  text: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν, ἔρχεται γὰρ ὁ τοῦ κόσμου ἄρχων· καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/030.yaml
  text: I will no longer speak much with you[a], for the ruler of the world is coming[b]. And he has nothing in me.
translation:
  language: pt
  text: Já não falarei muito com vocês, pois o governante do mundo[a] está vindo; e ele não tem nada em mim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas traduções dizem “o governante deste mundo”, em harmonia com expressões semelhantes em João; aqui, porém, o grego diz literalmente “do mundo”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele não tem nenhum direito sobre mim”, “não tem nenhum domínio sobre mim” ou “não encontra em mim nenhum ponto de apoio”. O grego diz literalmente: “ele não tem nada em mim”.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκέτι
  choice: já não
  rationale: Expressa de modo natural em português a cessação a partir deste momento.
- source_word: πολλὰ λαλήσω
  choice: falarei muito
  rationale: O neutro plural πολλὰ tem valor adverbial com λαλήσω; a formulação preserva o futuro e evita o sentido contável de “muitas coisas”.
- source_word: μεθ’ ὑμῶν
  choice: com vocês
  rationale: μετά com genitivo indica associação e, neste contexto, conversa direta com os discípulos. “Vocês” oferece ampla legibilidade brasileira sem perder dignidade.
- source_word: ἔρχεται
  choice: está vindo
  rationale: O presente grego aponta para uma chegada iminente; a locução progressiva comunica essa aproximação em português corrente.
- source_word: ὁ τοῦ κόσμου ἄρχων
  choice: o governante do mundo
  rationale: “Governante” traduz ἄρχων de modo claro e atual. Não se acrescenta “deste”, pois o demonstrativo não aparece no texto grego.
- source_word: ἐν ἐμοὶ οὐκ ἔχει οὐδέν
  choice: ele não tem nada em mim
  rationale: Mantém a formulação compacta e deliberadamente aberta do grego, sem reduzi-la a uma única interpretação como “nenhum direito sobre mim”.
theological_decisions:
- issue: Identidade do “governante do mundo”
  choice: Manter o título sem substituir seu referente por “Satanás”
  alternative: Explicitar “Satanás” ou entender a expressão como personificação mais geral dos poderes malignos do mundo
  rationale: No contexto joanino, o título é geralmente entendido como referência a Satanás, mas o texto apresenta o título, não o nome. A tradução preserva essa forma e deixa a identificação como inferência contextual.
- issue: Sentido de “não tem nada em mim”
  choice: Conservar a expressão literal e aberta
  alternative: “não tem nenhum direito sobre mim”, “não tem poder sobre mim” ou “não encontra em mim nenhum ponto de apoio”
  rationale: A expressão pode envolver ausência de direito, domínio, apoio ou afinidade, mas o grego não especifica apenas uma dessas nuances. Mantê-la no texto preserva a tensão, e a nota apresenta as principais possibilidades.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Já não” e “está vindo” soam naturais; “governante” é mais transparente hoje do que o tradicional “príncipe”. Os marcadores foram colocados junto às expressões que as respectivas notas explicam.
