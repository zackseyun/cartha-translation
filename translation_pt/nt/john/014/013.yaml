id: JHN.14.13
reference: John 14:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὅ τι ἂν αἰτήσητε ἐν τῷ ὀνόματί μου τοῦτο ποιήσω, ἵνα δοξασθῇ ὁ πατὴρ ἐν τῷ υἱῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/013.yaml
  text: And whatever you ask in my name[a], this I will do, so that the Father may be glorified in the Son.
translation:
  language: pt
  text: E tudo o que vocês pedirem em meu nome, isso farei, para que o Pai seja glorificado no Filho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio do Filho”. O grego diz “no Filho”, expressão que pode indicar a esfera ou o meio pelo qual o Pai é glorificado.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τι ἂν
  choice: tudo o que
  rationale: A construção relativa indefinida com ἄν expressa abrangência e indefinição. “Tudo o que” é natural em português e preserva o alcance aberto da expressão.
- source_word: αἰτήσητε
  choice: vocês pedirem
  rationale: O verbo αἰτέω significa pedir ou solicitar. “Vocês pedirem” expressa claramente a segunda pessoa do plural e é corrente no português moderno, sobretudo para leitores brasileiros.
- source_word: ἐν τῷ ὀνόματί μου
  choice: em meu nome
  rationale: A formulação preserva a expressão joanina e sua amplitude relacional e teológica, sem reduzi-la a uma única explicação, como “por minha autoridade”.
- source_word: τοῦτο
  choice: isso
  rationale: O demonstrativo retoma enfaticamente aquilo que for pedido. “Isso farei” mantém sua presença e posição destacada de modo natural em português.
- source_word: ποιήσω
  choice: farei
  rationale: O futuro de ποιέω é direto e abrangente. “Farei” reproduz com concisão tanto o sentido quanto a força da promessa.
- source_word: ἵνα
  choice: para que
  rationale: A locução introduz naturalmente em português a finalidade expressa por ἵνα.
- source_word: δοξασθῇ
  choice: seja glorificado
  rationale: A forma passiva preserva a linguagem bíblica de glória e corresponde ao subjuntivo passivo grego, sem enfraquecê-lo para apenas “seja honrado”.
- source_word: ὁ πατὴρ
  choice: o Pai
  rationale: O grego traz “o Pai”, não “meu Pai”. A tradução mantém essa designação divina característica de João.
- source_word: ἐν τῷ υἱῷ
  choice: no Filho
  rationale: A tradução mantém o valor formal de ἐν e preserva a possível ideia de esfera, manifestação ou meio, sem restringir a frase a apenas uma dessas nuances.
theological_decisions:
- issue: Sentido de pedir “em meu nome”
  choice: Mantida a expressão “em meu nome” sem expansão interpretativa.
  alternative: “por minha autoridade”; “em união comigo”; “de acordo com meu caráter e minha vontade”
  rationale: A expressão possui significado teológico e relacional amplo no contexto joanino. A formulação direta preserva essa riqueza sem impor uma única interpretação.
- issue: Força de ἐν τῷ υἱῷ
  choice: Traduzido como “no Filho”.
  alternative: “por meio do Filho”
  rationale: A preposição ἐν admite nuances relacionadas, e o texto grego não exige que a tradução escolha apenas uma. O texto principal conserva a formulação mais próxima, e a nota registra a principal alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O pronome “vocês” explicita o plural de αἰτήσητε. A ordem “isso farei” preserva a ênfase do demonstrativo grego sem soar artificial.
