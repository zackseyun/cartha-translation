source:
  edition: SBLGNT
  text: λέγει αὐτῷ Θωμᾶς· Κύριε, οὐκ οἴδαμεν ποῦ ὑπάγεις· ⸀πῶς ⸂δυνάμεθα τὴν ὁδὸν εἰδέναι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/005.yaml
  text: Thomas said to him[a], “Lord, we do not know where you are going[b]. How can we know the way?”
translation:
  language: pt
  text: 'Tomé lhe disse: “Senhor, não sabemos para onde vais. Como podemos saber o caminho?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como somos capazes de saber o caminho?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ Θωμᾶς
  choice: Tomé lhe disse
  rationale: O presente histórico λέγει é vertido pelo pretérito, forma natural na narrativa em português; αὐτῷ é representado por “lhe”, e Θωμᾶς pelo nome tradicional “Tomé”.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva tanto o tratamento respeitoso quanto a possível densidade cristológica do termo no contexto de João, sem reduzi-lo a uma simples fórmula de cortesia.
- source_word: οὐκ οἴδαμεν
  choice: não sabemos
  rationale: Expressa conhecimento, e não apenas compreensão; “sabemos” também permite conservar a repetição do mesmo verbo grego mais adiante.
- source_word: ποῦ ὑπάγεις
  choice: para onde vais
  rationale: É uma formulação natural e concisa que mantém em aberto a profundidade joanina do destino de Jesus, sem explicá-la antecipadamente.
- source_word: πῶς δυνάμεθα
  choice: Como podemos
  rationale: A pergunta direta reproduz o interrogativo πῶς e a noção de capacidade de δυνάμεθα em português corrente.
- source_word: τὴν ὁδὸν
  choice: o caminho
  rationale: “Caminho” preserva o sentido literal e figurado de ὁδός, bem como sua ligação temática com a declaração de Jesus no versículo seguinte.
- source_word: εἰδέναι
  choice: saber
  rationale: Completa naturalmente “podemos” e conserva a repetição lexical de οἴδαμεν e εἰδέναι no grego.
theological_decisions:
- issue: Possível nuance teológica de ὑπάγεις no contexto joanino
  choice: para onde vais
  alternative: para onde estás partindo
  rationale: A ida de Jesus possui importância teológica em João, mas Tomé declara ignorar o destino. A formulação neutra mantém essa tensão narrativa sem inserir aqui a explicação de que Jesus volta ao Pai.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se a segunda pessoa singular em “vais” por ser concisa, amplamente inteligível e apropriada ao registro bíblico sem soar excessivamente arcaica.
