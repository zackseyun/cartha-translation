  yaml_path: translation/nt/john/014/025.yaml
  text: I have spoken these things to you while staying with you[a].
translation:
  language: pt
  text: Eu lhes falei destas coisas enquanto ainda permaneço com vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enquanto ainda estou com vocês”. O grego emprega o particípio de “permanecer”, verbo recorrente em João.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: estas coisas
  rationale: Preserva o demonstrativo neutro plural, que retoma os ensinamentos anteriores, e mantém o estilo joanino.
- source_word: λελάληκα
  choice: disse
  rationale: O perfeito de λαλέω apresenta palavras já proferidas com relevância presente. Em português atual, “disse” comunica isso com mais naturalidade do que “tenho falado” neste contexto.
- source_word: ὑμῖν
  choice: lhes
  rationale: Representa naturalmente o dativo plural dirigido aos discípulos; “vocês” na expressão seguinte torna explícito o referente plural.
- source_word: παρ’ ὑμῖν
  choice: com vocês
  rationale: παρά com o dativo expressa aqui proximidade e presença; “com vocês” é a formulação portuguesa mais natural.
- source_word: μένων
  choice: enquanto permaneço
  rationale: O particípio presente é expresso por uma oração temporal, e “permaneço” preserva a ligação lexical com o uso recorrente de μένω em João.
theological_decisions:
- issue: Preservação da linguagem joanina associada a μένω
  choice: enquanto permaneço com vocês
  alternative: enquanto estou com vocês; enquanto fico com vocês
  rationale: “Permaneço” conserva a continuidade lexical e a possível ressonância temática de μένω sem acrescentar uma interpretação doutrinária. A nota registra opções mais idiomáticas.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Eu lhes disse” evita a construção pouco natural “tenho falado”, enquanto a oração no presente preserva a simultaneidade do particípio μένων.
