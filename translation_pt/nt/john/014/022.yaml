id: JHN.14.22
reference: John 14:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ἰούδας, οὐχ ὁ Ἰσκαριώτης· Κύριε, ⸀τί γέγονεν ὅτι ἡμῖν μέλλεις ἐμφανίζειν σεαυτὸν καὶ οὐχὶ τῷ κόσμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/022.yaml
  text: Judas (not Iscariot) said to him[a], “Lord[b], what has happened that you are going to reveal yourself to us and not to the world?”
translation:
  language: pt
  text: 'Judas (não o Iscariotes) disse-lhe: “Senhor, o que aconteceu para que pretendas revelar-te a nós e não ao mundo?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: perguntou
  rationale: Embora o verbo grego seja literalmente “diz”, o conteúdo é uma pergunta; o pretérito é natural na narrativa portuguesa, e “perguntou” explicita corretamente o ato de fala.
- source_word: Ἰούδας, οὐχ ὁ Ἰσκαριώτης
  choice: Judas (não o Iscariotes)
  rationale: Mantém o nome tradicional e a explicação parentética que distingue este discípulo de Judas Iscariotes.
- source_word: Κύριε
  choice: Senhor
  rationale: É o equivalente português normal de κύριος como forma direta de tratamento a Jesus e preserva o peso respeitoso e teológico do título.
- source_word: τί γέγονεν
  choice: o que aconteceu
  rationale: Expressa naturalmente o perfeito grego e a ideia de uma circunstância surgida que explica a intenção anunciada por Jesus.
- source_word: ὅτι
  choice: para que
  rationale: 'Neste contexto, liga a mudança de circunstância à intenção subsequente: “o que aconteceu para que...?”. Essa formulação idiomática preserva a relação explicativa sem a resolver excessivamente.'
- source_word: ἡμῖν
  choice: a nós
  rationale: Conserva sem expansão o dativo dos destinatários da revelação.
- source_word: μέλλεις
  choice: pretendas
  rationale: Aqui μέλλω pode indicar intenção, não apenas iminência. “Pretendas” se encaixa naturalmente na pergunta “o que aconteceu para que...?” e evita afirmar que a ação é necessariamente imediata.
- source_word: ἐμφανίζειν σεαυτόν
  choice: revelar-te
  rationale: Comunica de modo atual e claro a ideia de tornar-se manifesto ou conhecido, preservando a força reflexiva.
- source_word: κόσμῳ
  choice: ao mundo
  rationale: Mantém o vocabulário característico de João e sua ambiguidade entre a humanidade em geral e a ordem humana afastada de Deus.
theological_decisions:
- issue: Uso joanino de κόσμος
  choice: ao mundo
  alternative: à humanidade em geral; às pessoas que não creem
  rationale: “Mundo” preserva a amplitude e a tensão teológica do termo em João, sem restringi-lo no próprio texto a uma interpretação específica.
- issue: Sentido da manifestação de Jesus em ἐμφανίζειν σεαυτόν
  choice: revelar-te
  alternative: manifestar-te; dar-te a conhecer
  rationale: “Revelar-te” pode abranger tanto tornar-se perceptível quanto dar-se a conhecer, sem definir antecipadamente a natureza exata dessa autorrevelação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção “o que aconteceu para que pretendas” conserva a estranheza significativa da pergunta sem soar artificial; “revelar-te” mantém o pronome reflexivo e um tom respeitoso.
