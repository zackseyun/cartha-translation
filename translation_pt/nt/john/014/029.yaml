  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ νῦν εἴρηκα ὑμῖν πρὶν γενέσθαι, ἵνα ὅταν γένηται πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/029.yaml
  text: And now I have told you before it happens[c][b][a], so that when it happens you may believe.
translation:
  language: pt
  text: E agora eu lhes disse isso antes que aconteça[a], para que, quando acontecer[b], vocês creiam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «antes que isso venha a acontecer».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «quando isso vier a acontecer».'
    reason: lexical_alternative
  - marker: c
    text: O verbo também pode ter o sentido de «confiar», mas «crer» é a tradução habitual no Evangelho de João.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: E agora
  rationale: Preserva tanto a conexão discursiva de καί quanto o valor temporal de νῦν, em português natural.
- source_word: εἴρηκα ὑμῖν
  choice: eu lhes disse
  rationale: O perfeito εἴρηκα apresenta uma declaração já feita com relevância presente. Em português, o pretérito perfeito simples é mais natural que «tenho dito» neste contexto; «lhes» expressa o dativo ὑμῖν.
- source_word: πρὶν γενέσθαι
  choice: antes que aconteça
  rationale: Expressa com naturalidade a anterioridade de πρίν com infinitivo. O referente implícito é retomado por «isso», e «aconteça» preserva o sentido de γίνομαι.
- source_word: ἵνα
  choice: para que
  rationale: Mantém claramente a força de propósito da conjunção.
- source_word: ὅταν γένηται
  choice: quando acontecer
  rationale: A construção com subjuntivo indica uma ocorrência futura esperada. A repetição de «acontecer» preserva a repetição de γίνομαι no grego.
- source_word: πιστεύσητε
  choice: vocês creiam
  rationale: «Crer» é a tradução corrente de πιστεύω no Evangelho de João. O presente do subjuntivo em português decorre de «para que» e não determina se se trata do início ou do fortalecimento da fé.
theological_decisions:
- issue: Força de πιστεύσητε no contexto
  choice: vocês creiam
  alternative: vocês confiem; vocês continuem crendo
  rationale: A forma grega pode abranger o surgimento ou o fortalecimento da fé, sem explicitar perseverança. A tradução ampla «creiam» preserva essa tensão em vez de impor uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega «vocês» para o plural e «lhes» como objeto indireto. O pronome «isso» torna explícito o acontecimento subentendido pelo grego sem especificá-lo além do contexto.
