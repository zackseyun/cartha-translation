  text: Μὴ ταρασσέσθω ὑμῶν ἡ καρδία· πιστεύετε εἰς τὸν θεόν, καὶ εἰς ἐμὲ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/001.yaml
  text: Do not let your heart be troubled[a]. Believe in God[b]; believe also in me.
translation:
  language: pt
  text: Não deixem que o coração de vocês fique perturbado. Creiam em Deus; creiam também em mim.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Vocês creem em Deus; creiam também em mim». A forma grega πιστεύετε pode ser indicativa («vocês creem») ou imperativa («creiam»).'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «Confiem em Deus; confiem também em mim». O verbo pode expressar confiança, além de crença.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ταρασσέσθω
  choice: Não deixem que ... fique perturbado
  rationale: Expressa naturalmente em português a proibição com imperativo presente passivo na terceira pessoa, preservando tanto a ideia de não permitir esse estado quanto o sentido amplo de ταράσσω, sem reduzi-lo apenas a medo ou ansiedade.
- source_word: ὑμῶν ἡ καρδία
  choice: o coração de vocês
  rationale: Mantém o singular coletivo do grego (ἡ καρδία) e torna explícito que Jesus se dirige a várias pessoas por meio de «de vocês», forma clara e amplamente compreensível.
- source_word: πιστεύετε
  choice: Creiam
  rationale: «Crer» é a correspondência direta e corrente de πιστεύω e, com «em», pode incluir confiança pessoal. A forma grega admite tanto indicativo quanto imperativo; o texto principal adota o imperativo, e a ambiguidade é registrada em nota.
- source_word: εἰς τὸν θεόν
  choice: em Deus
  rationale: Com πιστεύω, a preposição εἰς indica fé ou confiança dirigida a Deus e é idiomaticamente expressa por «em» em português.
- source_word: καὶ εἰς ἐμὲ πιστεύετε
  choice: creiam também em mim
  rationale: Preserva a repetição verbal e a força aditiva de καί, mantendo o paralelismo entre Deus e Jesus.
theological_decisions:
- issue: Valor indicativo ou imperativo das duas ocorrências de πιστεύετε
  choice: 'As duas ocorrências são apresentadas como imperativos: «Creiam em Deus; creiam também em mim».'
  alternative: «Vocês creem em Deus; creiam também em mim.» Também são gramaticalmente possíveis outras combinações entre indicativo e imperativo.
  rationale: No grego, a segunda pessoa do plural do presente do indicativo e do imperativo tem a mesma forma. O contexto de consolo e exortação favorece a leitura imperativa no texto principal, mas a ambiguidade genuína é preservada em nota, sem transformar uma possibilidade gramatical em certeza doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O plural «vocês» evita a ambiguidade de número de «seu» e comunica claramente o destinatário coletivo. «Perturbado» preserva o tom solene sem soar arcaico. Os marcadores aparecem juntos ao fim da frase porque as duas notas dizem respeito às duas orações com πιστεύετε.
