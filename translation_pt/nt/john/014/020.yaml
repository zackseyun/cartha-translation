  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ⸂γνώσεσθε ὑμεῖς⸃ ὅτι ἐγὼ ἐν τῷ πατρί μου καὶ ὑμεῖς ἐν ἐμοὶ κἀγὼ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/020.yaml
  text: On that day you will know that I am in my Father[a], and you are in me[b], and I am in you.
translation:
  language: pt
  text: Naquele dia, vocês saberão que eu estou em meu Pai, e vocês estão em mim, e eu estou em vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Naquele dia
  rationale: A expressão é temporal. “Naquele dia” é natural em português e preserva a especificidade do demonstrativo ἐκείνῃ.
- source_word: γνώσεσθε ὑμεῖς
  choice: vocês saberão
  rationale: O futuro de γινώσκω indica conhecimento ou compreensão futura. O pronome explícito ὑμεῖς confere alguma ênfase, expressa naturalmente por “vocês” antes do verbo.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo daquilo que os discípulos saberão, não uma oração causal.
- source_word: ἐγὼ ἐν τῷ πατρί μου
  choice: eu estou em meu Pai
  rationale: Preserva literalmente a preposição ἐν e a linguagem joanina de habitação mútua, sem reduzi-la a uma explicação interpretativa.
- source_word: καὶ ὑμεῖς ἐν ἐμοὶ
  choice: vocês estão em mim
  rationale: O verbo “estar” é suprido em português na oração nominal, e a preposição “em” mantém a correspondência com a construção grega.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: e eu estou em vocês
  rationale: κἀγώ significa “e eu”. A repetição de “em” conserva o paralelismo e a reciprocidade presentes no original.
theological_decisions:
- issue: Linguagem joanina de habitação mútua (ἐν ... ἐν ... ἐν)
  choice: 'Manter “em” nas três ocorrências: “eu estou em meu Pai, vocês estão em mim, e eu estou em vocês”.'
  alternative: “Eu estou unido ao meu Pai, vocês estão unidos a mim, e eu estou unido a vocês.”
  rationale: A repetição de ἐν contém uma metáfora teologicamente rica. Preservá-la evita restringir o sentido a uma única noção, como identidade ontológica ou mera união relacional.
- issue: Relação de Jesus com o Pai
  choice: Traduzir diretamente como “eu estou em meu Pai”.
  alternative: “Eu e meu Pai somos um em essência” ou “eu estou com meu Pai”.
  rationale: A formulação mantém a força cristológica do texto sem inserir uma definição dogmática posterior nem enfraquecer a afirmação original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” explicita naturalmente o plural de ὑμεῖς/ὑμῖν. A repetição de “estou/estão” favorece clareza em português e conserva o paralelismo do grego.
