id: JHN.14.19
reference: John 14:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔτι μικρὸν καὶ ὁ κόσμος με οὐκέτι θεωρεῖ, ὑμεῖς δὲ θεωρεῖτέ με, ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ⸀ζήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/019.yaml
  text: A little while longer[a], and the world will no longer see me, but you will see me. Because I live[b], you also will live.
translation:
  language: pt
  text: Mais um pouco, e o mundo já não me verá; vocês, porém, me verão. Porque eu vivo, vocês também viverão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vocês também viverão” pode se referir à participação dos discípulos na vida de Jesus ressuscitado, à vida espiritual em união com ele, à ressurreição futura ou a mais de um desses sentidos.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι μικρὸν
  choice: Mais um pouco
  rationale: Expressão temporal natural em português para o breve tempo restante, preservando a orientação para uma mudança iminente.
- source_word: ὁ κόσμος
  choice: o mundo
  rationale: Mantém o termo joanino amplo sem reduzi-lo explicitamente à humanidade hostil ou a um sistema de oposição a Deus.
- source_word: θεωρεῖ / θεωρεῖτέ
  choice: verá / verão
  rationale: Ver é o equivalente mais natural no contexto. O futuro em português explicita a mudança iminente indicada por ἔτι μικρὸν e οὐκέτι, embora o grego empregue o presente.
- source_word: οὐκέτι
  choice: já não
  rationale: Forma idiomática e concisa que comunica a cessação a partir do momento próximo em vista.
- source_word: δὲ
  choice: porém
  rationale: Assinala claramente o contraste entre o mundo e os discípulos, em registro digno e corrente.
- source_word: ὅτι
  choice: Porque
  rationale: Preserva a leitura causal mais natural, ligando a vida futura dos discípulos à vida de Jesus.
- source_word: ἐγὼ ζῶ
  choice: eu vivo
  rationale: Conserva o presente e a formulação concisa do grego, sem explicar antecipadamente sua abrangência teológica.
- source_word: καὶ ὑμεῖς ζήσετε
  choice: vocês também viverão
  rationale: Mantém o futuro de ζάω e representa καί por também, destacando a participação dos discípulos na vida ligada à de Jesus.
theological_decisions:
- issue: Natureza da visão de Jesus pelos discípulos
  choice: Traduzir simplesmente por “me verão”
  alternative: Especificar aparições físicas após a ressurreição, percepção espiritual pela fé ou uma referência escatológica
  rationale: O texto permite ressonâncias sobrepostas; a tradução não deve determinar qual modo de visão está exclusivamente em foco.
- issue: Sentido de “vocês também viverão”
  choice: Manter a afirmação ampla e acrescentar nota sobre seu possível alcance
  alternative: Restringir a expressão à vida espiritual presente, à ressurreição futura ou à vida eterna em união com Cristo
  rationale: O futuro ζήσετε pode abranger participação presente na vida de Jesus e ressurreição futura. A formulação ampla conserva essa tensão.
translation_notes:
  register: Português moderno de ampla compreensão, com legibilidade brasileira. “Vocês” oferece naturalidade corrente; “porém” mantém contraste claro e registro digno. A pontuação preserva o encadeamento causal e enfático do versículo.
