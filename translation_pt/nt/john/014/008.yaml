base_translation:
  language: en
  yaml_path: translation/nt/john/014/008.yaml
  text: Philip said to him[a], “Lord, show us the Father, and that is enough for us.”
translation:
  language: pt
  text: 'Filipe lhe disse[a]: “Senhor, mostre-nos o Pai, e isso nos basta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Filipe lhe disse: ‘Senhor, mostre-nos o Pai, e isso é suficiente para nós.’” O termo grego traduzido por “Senhor” também pode ser entendido como tratamento respeitoso (“senhor”).'
    reason: Registra a formulação mais explícita para ἀρκεῖ ἡμῖν e a alternativa lexical de κύριε, sem decidir a ambiguidade do termo.
lexical_decisions:
- source_word: Λέγει
  choice: disse
  rationale: Embora o grego empregue o presente histórico, o pretérito é mais natural na narrativa em português e preserva a função introdutória da fala.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome dativo indica o destinatário da fala; “lhe disse” é uma construção portuguesa natural e concisa.
- source_word: Φίλιππος
  choice: Filipe
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: Κύριε
  choice: Senhor
  rationale: O vocativo κύριε pode expressar respeito ou reconhecer autoridade; “Senhor” preserva a formulação cristológica usual no contexto joanino sem eliminar a alternativa semântica indicada em nota.
- source_word: δεῖξον
  choice: mostre
  rationale: O imperativo de δείκνυμι pede que alguém torne visível ou conhecido; “mostre” é direto, natural e lexicalmente próximo.
- source_word: ἡμῖν
  choice: nos
  rationale: Com o verbo “mostrar”, o dativo plural é expresso naturalmente pelo pronome “nos”.
- source_word: τὸν πατέρα
  choice: o Pai
  rationale: No contexto, a expressão se refere especificamente a Deus, Pai de Jesus; a inicial maiúscula sinaliza essa referência sem acrescentar conteúdo.
- source_word: καὶ
  choice: e
  rationale: Mantém a coordenação simples entre o pedido e a declaração de suficiência.
- source_word: ἀρκεῖ ἡμῖν
  choice: isso nos basta
  rationale: “Bastar” corresponde diretamente à ideia de suficiência de ἀρκέω, e a construção é idiomática e digna em português atual.
theological_decisions:
- issue: Sentido de κύριε ao dirigir-se a Jesus
  choice: Senhor
  alternative: senhor (como tratamento respeitoso)
  rationale: “Senhor” preserva tanto o respeito do vocativo quanto o peso cristológico que o termo pode ter no Evangelho de João. A nota registra que a forma grega também pode funcionar como tratamento respeitoso, evitando resolver por completo a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O presente histórico grego foi vertido pelo pretérito narrativo natural em português; “isso nos basta” conserva a concisão do original.
