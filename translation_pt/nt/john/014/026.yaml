id: JHN.14.26
reference: John 14:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/026.yaml
  text: But the Advocate[a], the Holy Spirit, whom the Father will send in my name, he will teach you all things and remind you of all that I said to you.
translation:
  language: pt
  text: Mas o Defensor[a], o Espírito Santo, que o Pai enviará em meu nome, ele ensinará a vocês todas as coisas e fará vocês se lembrarem de tudo o que eu lhes disse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Auxiliador”, “Conselheiro”, “Consolador” ou “Advogado”; grego paraklētos.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλητος
  choice: Defensor
  rationale: “Defensor” preserva a atuação pessoal, representativa e protetora do termo, incluindo sua possível dimensão forense, sem limitá-lo apenas ao consolo emocional. Como nenhuma palavra portuguesa abrange todo o campo semântico, as principais alternativas aparecem em nota.
- source_word: πνεῦμα τὸ ἅγιον
  choice: o Espírito Santo
  rationale: É a forma consagrada e atual em português, correspondendo diretamente ao título grego.
- source_word: ὃ πέμψει ὁ πατὴρ
  choice: que o Pai enviará
  rationale: Em português, “que” se refere naturalmente a uma pessoa neste contexto; a formulação preserva o futuro e apresenta o Pai como agente do envio.
- source_word: ἐν τῷ ὀνόματί μου
  choice: em meu nome
  rationale: Mantém a expressão do original e sua amplitude semântica, que pode envolver representação, autoridade e missão, sem escolher apenas uma dessas nuances.
- source_word: ἐκεῖνος
  choice: ele
  rationale: O demonstrativo masculino enfático retoma παράκλητος. O pronome explícito “ele” preserva essa ênfase e a agência pessoal do Espírito, embora seja parcialmente redundante em português.
- source_word: διδάξει ὑμᾶς πάντα
  choice: ensinará a vocês todas as coisas
  rationale: Traduz de modo claro o verbo e conserva a abrangência de πάντα. “A vocês” deixa explícito que o destinatário é plural e favorece ampla compreensão brasileira.
- source_word: ὑπομνήσει ὑμᾶς
  choice: fará vocês se lembrarem
  rationale: 'Expressa naturalmente o sentido causativo do verbo grego: levar alguém a recordar.'
- source_word: πάντα ἃ εἶπον ὑμῖν
  choice: tudo o que eu lhes disse
  rationale: Preserva a construção relativa, a abrangência de πάντα e a referência direta às palavras anteriormente ditas por Jesus aos discípulos.
theological_decisions:
- issue: Referência pessoal ao Espírito Santo
  choice: Usar referência pessoal explícita (“ele”)
  alternative: Omitir o pronome ou empregar linguagem que possa sugerir uma força impessoal
  rationale: A combinação do título masculino παράκλητος com o demonstrativo masculino enfático ἐκεῖνος apresenta o Espírito como agente pessoal que ensina e faz recordar.
- issue: Tradução de παράκλητος
  choice: Defensor
  alternative: Auxiliador, Conselheiro, Consolador ou Advogado
  rationale: “Defensor” comunica de modo natural em português a ação pessoal de amparar e representar, preservando melhor a possível nuance forense do que opções restritas ao ensino, auxílio genérico ou consolo. A nota mantém visível a riqueza lexical do termo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade prioritariamente brasileira e vocabulário amplamente compreensível. “A vocês” explicita o plural de ὑμᾶς; “lhes” evita repetição excessiva sem alterar o referente. A repetição “o Defensor, o Espírito Santo” e o pronome enfático “ele” acompanham a estrutura identificadora e enfática do grego.
