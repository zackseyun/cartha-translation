id: JHN.14.17
reference: John 14:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸ πνεῦμα τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ ⸀γινώσκει· ⸀ὑμεῖς γινώσκετε αὐτό, ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ⸀ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/017.yaml
  text: the Spirit of truth[a], whom the world is not able to receive, because it neither sees him nor knows him. You know him[b], because he remains with you and will be in you.
translation:
  language: pt
  text: o Espírito da verdade[a], que o mundo não pode receber, porque não o vê nem o conhece. Vocês o conhecem, porque ele permanece com vocês e estará em vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No grego, “Espírito” (πνεῦμα) é gramaticalmente neutro; em português, o substantivo é masculino. O contexto se refere ao Espírito de maneira pessoal.
    reason: lexical_alternative
  - marker: b
    text: Ou “estará entre vocês”. O plural grego permite uma leitura coletiva, embora “em vocês” preserve melhor o contraste com “com vocês”. Alguns manuscritos trazem “está em vocês”.
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: Espírito
  rationale: A inicial maiúscula indica que, no contexto joanino, a referência é ao Espírito Santo, agente pessoal, e não a uma disposição ou força impessoal.
- source_word: τῆς ἀληθείας
  choice: da verdade
  rationale: Preserva a construção genitiva grega e a expressão joanina estabelecida, sem transformá-la em paráfrase interpretativa.
- source_word: ὃ / αὐτό
  choice: que / o
  rationale: Embora πνεῦμα seja gramaticalmente neutro em grego, em português “Espírito” é masculino; os pronomes seguem naturalmente o gênero do substantivo e são compatíveis com a referência pessoal no contexto.
- source_word: κόσμος
  choice: o mundo
  rationale: Mantém o termo joanino amplo, sem restringi-lo indevidamente a toda a humanidade ou a um sistema abstrato.
- source_word: οὐ δύναται λαβεῖν
  choice: não pode receber
  rationale: Expressa de modo natural tanto a incapacidade indicada por δύναται quanto o sentido de λαβεῖν como “receber”.
- source_word: θεωρεῖ
  choice: vê
  rationale: É uma forma atual e direta que preserva a dimensão visual do verbo sem impor o sentido mais interpretativo de “perceber”.
- source_word: γινώσκει / γινώσκετε
  choice: conhece / conhecem
  rationale: Conserva a repetição lexical e o contraste entre o mundo e os discípulos.
- source_word: ὑμεῖς
  choice: Vocês
  rationale: O pronome explícito preserva a ênfase e o contraste do grego; “vocês” oferece ampla legibilidade brasileira e permanece compreensível internacionalmente.
- source_word: παρ’ ὑμῖν μένει
  choice: ele permanece com vocês
  rationale: “Permanece” conserva a importante continuidade joanina de μένω, enquanto “com vocês” traduz naturalmente παρά com dativo.
- source_word: ἐν ὑμῖν ἔσται
  choice: estará em vocês
  rationale: Preserva o valor mais direto de ἐν e o contraste verbal com “com vocês”, sem excluir que o plural também possa ser entendido coletivamente.
theological_decisions:
- issue: Referência pessoal ao Espírito apesar do gênero neutro de πνεῦμα no grego
  choice: 'Empregar referência pessoal masculina em português: “o”, “ele”'
  alternative: Imitar o neutro gramatical grego com formas impessoais
  rationale: O português exige concordância masculina com “Espírito”, e o contexto apresenta o Espírito como agente pessoal. A opção não depende de reproduzir mecanicamente o gênero gramatical grego.
- issue: Relação do Espírito com os discípulos em παρ’ ὑμῖν e ἐν ὑμῖν
  choice: Manter a distinção como “com vocês” e “em vocês”
  alternative: Uniformizar ambas as expressões como presença “com” ou “entre” os discípulos
  rationale: As duas preposições gregas são distintas. A tradução conserva a progressão e a tensão do texto em vez de reduzi-las a uma única ideia de presença.
- issue: Valor futuro de ἔσται
  choice: “estará”
  alternative: 'Leitura variante no presente: “está”'
  rationale: O texto-base SBLGNT apresentado traz ἔσται, futuro, e a tradução segue essa leitura sem ocultar que há variação textual relevante.
translation_notes:
  register: Português atual, digno e direto, com legibilidade brasileira ampla. Emprega “vocês” para o plural de segunda pessoa e mantém “permanece” para preservar a recorrência teológica e literária de μένω em João.
