  text: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν· Καὶ τίς ἐστιν, κύριε, ἵνα πιστεύσω εἰς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/036.yaml
  text: He answered and said[a], “And who is he, Lord, that I may believe in him?”
translation:
  language: pt
  text: 'Ele respondeu: “E quem é ele, Senhor[a], para que eu creia nele?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “senhor”, como forma respeitosa de tratamento. O grego κύριε pode ser tanto uma forma de cortesia quanto o título “Senhor”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν
  choice: Ele respondeu
  rationale: A fórmula narrativa grega combina literalmente ‘respondeu’ e ‘disse’. Em português atual, ‘Ele respondeu’ transmite naturalmente a fala responsiva sem reproduzir um dupleto pouco idiomático.
- source_word: Καὶ τίς ἐστιν
  choice: E quem é ele
  rationale: Mantém a conjunção inicial e traduz de modo direto a pergunta sobre a identidade da pessoa mencionada.
- source_word: κύριε
  choice: Senhor
  rationale: É a correspondência tradicional e semanticamente válida, mas o vocativo também pode ser uma forma respeitosa de tratamento; essa ambiguidade é preservada em nota.
- source_word: ἵνα πιστεύσω εἰς αὐτόν
  choice: para que eu creia nele
  rationale: ‘Para que’ expressa a finalidade marcada por ἵνα com o subjuntivo, enquanto ‘creia nele’ preserva a construção πιστεύω εἰς e sua linguagem de fé.
theological_decisions:
- issue: Sentido de κύριε antes da confissão explícita do homem no versículo seguinte
  choice: Senhor
  alternative: senhor, como forma respeitosa de tratamento; equivalente a ‘senhor’/‘meu senhor’ sem necessariamente implicar pleno reconhecimento
  rationale: O contexto não determina com certeza o grau de reconhecimento do homem nesse momento. O texto principal conserva ‘Senhor’, e a nota impede que a ambiguidade lexical seja resolvida de forma indevida.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção redundante ‘respondeu e disse’ foi naturalizada como ‘respondeu’, sem perda do conteúdo narrativo. A conjunção inicial da pergunta foi mantida.
