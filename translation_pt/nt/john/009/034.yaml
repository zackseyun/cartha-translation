  source_fidelity: A tradução preserva bem o plural de ἁμαρτίαις em “em pecados”, o intensificador ὅλος em “inteiramente” e a expulsão expressa por ἐξέβαλον αὐτὸν ἔξω. Contudo, “quer nos ensinar?” introduz a noção de vontade ou pretensão, ausente do presente διδάσκεις. “Está nos ensinando?” conserva melhor a ação presente e a indignação retórica.
  naturalness: O português é moderno, claro e de registro adequado. “Você nasceu inteiramente em pecados” é uma formulação incomum, mas justificadamente conserva a estranheza e a força insultuosa da construção grega, sem explicá-la doutrinariamente.
  terminology: “Pecados” mantém corretamente o plural do grego. “Expulsaram” é natural e suficientemente forte, sem afirmar no texto principal que a expulsão foi formalmente da sinagoga. A nota contextualiza essa possibilidade de modo cauteloso.
