  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ἐν ἁμαρτίαις σὺ ἐγεννήθης ὅλος, καὶ σὺ διδάσκεις ἡμᾶς; καὶ ἐξέβαλον αὐτὸν ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/034.yaml
  text: They answered and said to him[a], “You were born entirely in sins[c][b], and are you teaching us?” And they cast him out.
translation:
  language: pt
  text: 'Eles lhe responderam: “Você nasceu inteiramente em pecados, e você está nos ensinando?” E o expulsaram.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o puseram para fora”. No contexto, a expressão também pode sugerir sua exclusão da comunidade da sinagoga.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Eles lhe responderam
  rationale: Em português, “responderam e disseram” é uma duplicação pouco natural. “Lhe responderam” comunica com clareza a fórmula narrativa grega sem alterar seu sentido.
- source_word: Ἐν ἁμαρτίαις
  choice: em pecados
  rationale: Mantém o plural explícito do grego e a força da acusação, sem convertê-la em uma afirmação doutrinária mais específica.
- source_word: ἐγεννήθης ὅλος
  choice: nasceu inteiramente
  rationale: “Inteiramente” preserva a força intensificadora de ὅλος e apresenta a condição alegada pelos acusadores como abrangendo a pessoa por completo.
- source_word: καὶ σὺ διδάσκεις ἡμᾶς;
  choice: e quer nos ensinar?
  rationale: A formulação idiomática expressa a pergunta retórica indignada e a ênfase do pronome σὺ, contrastando “você” com “nós”.
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: o expulsaram
  rationale: “Expulsaram” comunica naturalmente a ação hostil de pôr para fora e deixa o contexto determinar se houve também exclusão da comunidade da sinagoga.
theological_decisions:
- issue: Sentido da acusação de ter nascido “em pecados” no contexto da cegueira congênita
  choice: Preservar a acusação hostil no plural, sem identificar de quem seriam os pecados nem qual relação teriam com a cegueira.
  alternative: “Você nasceu completamente em pecado” ou “Você nasceu sendo um pecador completo”.
  rationale: O grego registra o insulto dos interlocutores, mas não define se eles aludem a pecado pessoal, herdado, parental ou associado à condição física. A tradução não resolve essa tensão teológica.
- issue: Alcance de ἐξέβαλον αὐτὸν ἔξω
  choice: “o expulsaram”, deixando o objeto institucional implícito
  alternative: “expulsaram-no da sinagoga” ou “mandaram-no sair”.
  rationale: O texto não nomeia expressamente a sinagoga neste versículo. O contexto pode sugerir exclusão comunitária, mas inseri-la no corpo do texto tornaria explícito o que permanece implícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A contração pronominal “lhe” evita solenidade excessiva; “você” torna a confrontação natural. O plural incomum “em pecados” foi mantido por fidelidade à acusação grega, enquanto a nota esclarece apenas a possível extensão da expulsão.
