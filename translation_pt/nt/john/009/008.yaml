  yaml_path: translation/nt/john/009/008.yaml
  text: So the neighbors[a], and those who had seen him before as a beggar, were saying, “Is this not the man who used to sit and beg?”
translation:
  language: pt
  text: 'Então os vizinhos e os que antes o viam como mendigo diziam: “Não é este o homem que costumava ficar sentado e pedir esmolas?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Não é este o que se sentava e pedia esmolas?” O grego usa particípios (“sentado” e “pedindo”) para identificá-lo por sua atividade habitual anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e a consequência do acontecimento anterior de modo natural em português.
- source_word: γείτονες
  choice: vizinhos
  rationale: Equivalente direto e corrente para os que moravam perto dele.
- source_word: θεωροῦντες αὐτὸν τὸ πρότερον
  choice: os que antes o viam
  rationale: O particípio com a expressão temporal aponta para pessoas que costumavam vê-lo anteriormente; o imperfeito em português preserva bem essa ideia habitual.
- source_word: ὅτι προσαίτης ἦν
  choice: como mendigo
  rationale: No contexto, identifica a condição em que era conhecido e visto anteriormente, sem impor uma relação causal indevida.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito grego sugere fala em andamento ou repetida entre várias pessoas; o imperfeito português reproduz essa nuance.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Não é este
  rationale: Mantém a pergunta que espera resposta afirmativa e soa natural, embora digna, em português.
- source_word: ὁ καθήμενος καὶ προσαιτῶν
  choice: o homem que ficava sentado, pedindo esmolas
  rationale: Os particípios substantivados identificam o homem por sua atividade habitual anterior; 'ficava sentado' comunica habitualidade, e 'pedindo esmolas' explicita naturalmente o ato de mendigar.
