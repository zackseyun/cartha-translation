  yaml_path: translation/nt/john/009/010.yaml
  text: So they said to him[a], “How were your eyes opened?”
translation:
  language: pt
  text: 'Então, perguntavam-lhe: “Como os seus olhos foram abertos?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: perguntavam
  rationale: O imperfeito indica uma fala em andamento ou repetida. Como a fala introduz uma pergunta, “perguntavam” é natural em português e preserva o aspecto melhor que o pretérito perfeito.
- source_word: οὖν
  choice: Por isso
  rationale: Expressa a conexão inferencial com o contexto anterior, em linguagem corrente e digna.
- source_word: αὐτῷ
  choice: a ele
  rationale: Reproduz o pronome dativo como destinatário da pergunta.
- source_word: Πῶς
  choice: Como
  rationale: Equivalente direto e idiomático do advérbio interrogativo de modo.
- source_word: ἠνεῴχθησάν
  choice: foram abertos
  rationale: Preserva a voz passiva do aoristo de ἀνοίγω, sem identificar explicitamente o agente.
- source_word: σου οἱ ὀφθαλμοί
  choice: os seus olhos
  rationale: Construção possessiva natural e amplamente compreensível em português, mantendo o sentido do pronome e do substantivo gregos.
theological_decisions:
- issue: Agente da abertura dos olhos
  choice: 'Manter a construção passiva: “foram abertos”'
  alternative: “Como você passou a enxergar?”
  rationale: O grego não nomeia o agente nesta pergunta; a formulação passiva preserva essa abertura interpretativa e a ligação verbal com o milagre.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Perguntavam” combina a função interrogativa da fala com o aspecto imperfeito; “Por isso” mantém a relação lógica de οὖν. Não há necessidade de nota, pois o passivo grego pode ser preservado naturalmente em português.
