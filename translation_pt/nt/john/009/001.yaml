id: JHN.9.1
reference: John 9:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ παράγων εἶδεν ἄνθρωπον τυφλὸν ἐκ γενετῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/001.yaml
  text: And as he was passing by[a], he saw a man blind from birth.
translation:
  language: pt
  text: E, enquanto passava,[a] Jesus viu um homem cego de nascença.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enquanto ia passando”. O particípio grego retrata Jesus em movimento quando viu o homem.'
    reason: alternativa lexical para παράγων e explicitação de seu aspecto durativo
lexical_decisions:
- source_word: Καὶ
  choice: Enquanto
  rationale: Em português, a relação temporal entre o particípio παράγων e o verbo principal pode introduzir naturalmente a frase; a conexão narrativa de Καὶ fica expressa sem um 'E' pouco fluido antes de 'enquanto'.
- source_word: παράγων
  choice: passava
  rationale: O particípio presente retrata a ação em andamento e contemporânea a εἶδεν; 'enquanto passava' comunica esse valor temporal de modo natural.
- source_word: εἶδεν
  choice: viu
  rationale: Tradução direta do aoristo de ὁράω, sem acrescentar a nuance interpretativa de 'notou'.
- source_word: ἄνθρωπον
  choice: um homem
  rationale: Embora ἄνθρωπος possa significar 'pessoa', o contexto identifica um indivíduo masculino; 'um homem' é natural e preciso.
- source_word: τυφλὸν
  choice: cego
  rationale: O adjetivo modifica 'homem' e descreve sua condição sem exigir uma construção explicativa.
- source_word: ἐκ γενετῆς
  choice: de nascença
  rationale: Expressão portuguesa corrente e concisa para uma condição presente desde o nascimento.
theological_decisions:
- issue: Referente masculino de ἄνθρωπον
  choice: um homem
  alternative: uma pessoa
  rationale: O termo pode ser genérico em outros contextos, mas aqui se refere a um indivíduo apresentado como masculino na narrativa; a tradução preserva essa especificidade.
- issue: Sujeito implícito de παράγων e εἶδεν
  choice: Jesus
  alternative: ele
  rationale: O grego mantém o sujeito implícito, recuperável do contexto anterior. Em português, explicitar 'Jesus' evita possível ambiguidade na abertura isolada do versículo sem alterar o referente.
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. 'De nascença' preserva o sentido de cegueira existente desde o nascimento; a nota mantém a alternativa para o particípio. O marcador [a] aparece no texto principal.
