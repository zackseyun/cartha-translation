id: JHN.9.31
reference: John 9:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀οἴδαμεν ὅτι ⸂ἁμαρτωλῶν ὁ θεὸς⸃ οὐκ ἀκούει, ἀλλ’ ἐάν τις θεοσεβὴς ᾖ καὶ τὸ θέλημα αὐτοῦ ποιῇ τούτου ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/031.yaml
  text: We know that God does not listen to sinners; but if anyone is God-fearing and does his will[a], he listens to him.
translation:
  language: pt
  text: Sabemos que Deus não ouve os pecadores; mas, se alguém é temente a Deus[a] e faz a vontade dele, Deus ouve essa pessoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “adorador de Deus”.'
    reason: Alternativa lexical possível para θεοσεβής, embora “temente a Deus” expresse melhor o sentido reverencial amplo do adjetivo.
lexical_decisions:
- source_word: οἴδαμεν
  choice: Sabemos
  rationale: Embora tenha forma de perfeito, οἶδα tem sentido presente no grego koiné; “Sabemos” é a equivalência natural em português.
- source_word: ἁμαρτωλῶν
  choice: os pecadores
  rationale: O genitivo plural designa a classe de pessoas em questão. O artigo é natural em português para uma referência genérica, e “pecadores” preserva de modo conciso a força moral e religiosa do termo.
- source_word: ἀκούει
  choice: ouve
  rationale: Neste contexto, ἀκούω indica ouvir favoravelmente ou dar atenção, não mera percepção sonora. Em português, “ouvir” preserva essa extensão de sentido sem explicitar demais como “responder” ou “atender ao pedido”.
- source_word: θεοσεβὴς
  choice: temente a Deus
  rationale: O adjetivo descreve alguém que reverencia a Deus. “Temente a Deus” mantém a referência explícita a Deus e não restringe o sentido apenas ao ato de culto.
- source_word: τὸ θέλημα αὐτοῦ ποιῇ
  choice: faz a vontade dele
  rationale: É uma tradução natural e próxima da expressão grega ποιεῖν τὸ θέλημα. “Dele” identifica claramente Deus e evita uma possível ambiguidade gráfica de “sua”.
- source_word: τούτου ἀκούει
  choice: Deus ouve essa pessoa
  rationale: O demonstrativo enfático τούτου retoma a pessoa temente a Deus. A repetição de “Deus” produz uma frase natural em português e deixa inequívoco o sujeito de “ouve”.
- source_word: ἀλλ’ ἐάν τις
  choice: mas, se alguém
  rationale: A formulação preserva tanto o contraste introduzido por ἀλλά quanto a condição indefinida expressa por ἐάν τις.
theological_decisions:
- issue: Alcance da afirmação de que Deus não ouve os pecadores
  choice: Manter a afirmação com toda a sua força, conforme é pronunciada no contexto, sem a suavizar nem a transformar numa formulação doutrinária mais abrangente.
  alternative: “Deus não ouve as orações dos pecadores” ou “Deus não aprova os pecadores”.
  rationale: O grego afirma simplesmente que Deus não “ouve” pecadores e contrasta isso com ouvir a pessoa temente a Deus que faz a vontade dele. A tradução não deve definir além do texto todos os sentidos possíveis em que Deus pode ouvir ou conhecer pecadores.
- issue: Sentido de θεοσεβής
  choice: temente a Deus
  alternative: adorador de Deus
  rationale: “Temente a Deus” preserva o sentido adjetival amplo de reverência. “Adorador de Deus” é lexicalmente possível, mas pode sugerir um sentido mais restrito ao culto; por isso, fica registrado em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade no Brasil e compreensão internacional. A construção evita arcaísmos e jargão técnico. “Ouve” mantém a concisão e a tensão do original, enquanto a repetição de “Deus” no fim favorece a clareza.
