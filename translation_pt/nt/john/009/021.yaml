  text: πῶς δὲ νῦν βλέπει οὐκ οἴδαμεν, ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμοὺς ἡμεῖς οὐκ οἴδαμεν· ⸂αὐτὸν ἐρωτήσατε, ἡλικίαν ἔχει⸃, αὐτὸς περὶ ἑαυτοῦ λαλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/021.yaml
  text: But how he now sees[a], we do not know; or who opened his eyes, we do not know. Ask him; he is of age. He will speak for himself.
translation:
  language: pt
  text: Mas não sabemos como ele vê agora, nem sabemos quem abriu os olhos dele. Perguntem a ele; já tem idade suficiente. Ele mesmo falará por si.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele pode responder por si.” O futuro grego pode funcionar como uma afirmação prática da capacidade ou responsabilidade dele de responder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δὲ νῦν βλέπει
  choice: Mas não sabemos como ele vê agora
  rationale: “Como” preserva a pergunta sobre a maneira pela qual ele passou a ver; “mas” representa o valor levemente adversativo de δέ, e “vê agora” mantém o presente de βλέπει e o advérbio νῦν.
- source_word: οὐκ οἴδαμεν
  choice: não sabemos
  rationale: Tradução direta de οὐκ οἴδαμεν. A estrutura portuguesa conserva a declaração de ignorância dos pais.
- source_word: ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμούς
  choice: nem quem abriu os olhos dele
  rationale: No encadeamento negativo em português, “nem quem” expressa naturalmente a segunda alternativa introduzida por ἤ. “Abriu os olhos dele” preserva o idioma e sua ligação com o milagre narrado.
- source_word: αὐτὸν ἐρωτήσατε
  choice: Perguntem a ele
  rationale: O imperativo plural é expresso por “perguntem”; “a ele” mantém explícito o objeto enfático e é amplamente compreensível em português.
- source_word: ἡλικίαν ἔχει
  choice: já tem idade suficiente
  rationale: No contexto do interrogatório, a expressão indica idade ou maturidade suficiente para responder de modo independente. “Suficiente” torna natural em português o sentido contextual sem especificar uma idade legal moderna.
- source_word: αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: Ele mesmo falará por si
  rationale: “Ele mesmo” conserva a ênfase de αὐτός; “falará” mantém o futuro de λαλήσει; e “por si” comunica que ele pode prestar seu próprio depoimento, sem eliminar a forma futura do grego.
theological_decisions:
- issue: Sentido de ἡλικίαν ἔχει no contexto
  choice: Idade suficiente para responder de maneira independente
  alternative: Maioridade jurídica formal; maturidade em sentido geral; estatura física
  rationale: O contexto é o questionamento das autoridades e a recusa dos pais em responder pelo filho. A tradução evita impor uma categoria jurídica moderna precisa, mas comunica a capacidade social de testemunhar por si.
- issue: Força de αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: Declaração futura de que ele falará em seu próprio nome
  alternative: 'Afirmação modal explícita: “Ele pode responder por si”'
  rationale: O futuro grego é mantido no texto principal, preservando a forma e a possível nuance de responsabilidade; a leitura modal ou prática é registrada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção natural no Brasil. Mantém-se a repetição conceitual da ignorância dos pais, embora as duas ocorrências gregas de “não sabemos” sejam coordenadas em uma única estrutura portuguesa para evitar rigidez. A nota é colocada na oração a que se refere o futuro λαλήσει.
