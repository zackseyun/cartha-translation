  text: ἀπεκρίθη οὖν ⸀ἐκεῖνος· Εἰ ἁμαρτωλός ἐστιν οὐκ οἶδα· ἓν οἶδα ὅτι τυφλὸς ὢν ἄρτι βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/025.yaml
  text: 'So that man answered[a], “Whether he is a sinner, I do not know. One thing I do know: though I was blind, now I see.”'
translation:
  language: pt
  text: 'Então aquele homem respondeu: “Se ele é pecador, não sei. Uma coisa sei: eu era cego e agora vejo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: Verbo narrativo padrão para uma resposta em diálogo; é direto e natural em português.
- source_word: οὖν
  choice: Então
  rationale: Mantém a ligação discursiva com a conversa anterior sem a formalidade excessiva de “portanto”.
- source_word: ἐκεῖνος
  choice: aquele homem
  rationale: Preserva a força demonstrativa explícita e identifica naturalmente o homem que havia sido cego.
- source_word: Εἰ ἁμαρτωλός ἐστιν
  choice: Se ele é pecador
  rationale: Em português, “se” introduz de modo idiomático uma interrogativa indireta após “não sei” e conserva a forma lexical de εἰ sem impor uma condição real.
- source_word: οὐκ οἶδα
  choice: não sei
  rationale: Expressa com naturalidade o presente sentido de οἶδα.
- source_word: ἓν οἶδα
  choice: Uma coisa sei
  rationale: A repetição de “sei” ressalta o contraste enfático com “não sei”.
- source_word: τυφλὸς ὢν
  choice: eu era cego
  rationale: Explicita em português a condição anterior indicada pelo particípio, em contraste com o estado presente.
- source_word: ἄρτι βλέπω
  choice: agora vejo
  rationale: Reproduz de modo conciso e enfático o contraste temporal e o presente simples do grego.
theological_decisions:
- issue: Manter a perspectiva limitada do homem curado sem antecipar um juízo do narrador sobre a ausência de pecado em Jesus
  choice: Se ele é pecador, não sei.
  alternative: Não sei se ele é pecador.
  rationale: A formulação conserva a ordem e o destaque do grego, apresentando a limitação epistêmica do falante sem resolver a questão teológica em nome dele.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura breve preserva o contraste retórico entre “não sei” e “sei”, bem como entre “era cego” e “agora vejo”.
