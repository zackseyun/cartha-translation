  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ τυφλοὶ ἦτε, οὐκ ἂν εἴχετε ἁμαρτίαν· νῦν δὲ λέγετε ὅτι Βλέπομεν· ⸀ἡ ἁμαρτία ὑμῶν μένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/041.yaml
  text: Jesus said to them[a], “If you were blind, you would not have sin. But now you say, ‘We see,’ so your sin remains.”
translation:
  language: pt
  text: 'Jesus lhes disse: “Se vocês fossem cegos, não teriam pecado[a]. Mas agora vocês dizem: ‘Nós vemos’; o pecado de vocês permanece.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não teriam culpa”. O grego diz “pecado”, termo que aqui pode incluir o sentido de culpabilidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοὶ
  choice: cegos
  rationale: Mantém o sentido simples do adjetivo grego e permite que o contexto comunique sua força metafórica, sem acrescentar ‘espiritualmente’.
- source_word: οὐκ ἂν εἴχετε
  choice: não teriam
  rationale: O imperfeito com ἄν, na construção condicional, exprime um resultado contrário à realidade; esta formulação é natural em português.
- source_word: ἁμαρτίαν
  choice: pecado
  rationale: É o equivalente lexical direto e preserva o uso joanino; neste contexto, pode também envolver a ideia de culpa.
- source_word: νῦν δὲ
  choice: Mas agora
  rationale: Expressa com clareza o contraste entre a hipótese anterior e a situação presente.
- source_word: λέγετε ὅτι Βλέπομεν
  choice: 'vocês dizem: ‘Nós vemos’'
  rationale: Preserva a mudança da segunda pessoa do plural para a fala direta na primeira pessoa do plural, mantendo a força retórica e irônica.
- source_word: ἡ ἁμαρτία ὑμῶν μένει
  choice: o pecado de vocês permanece
  rationale: ‘Permanece’ traduz o presente de μένω e conserva um verbo importante no vocabulário joanino, indicando continuidade.
theological_decisions:
- issue: Explicitar que a cegueira é espiritual e que ‘pecado’ inclui culpabilidade diante de Deus
  choice: Conservar ‘cegos’ e ‘pecado’ no texto principal sem expansão interpretativa.
  alternative: “Se vocês fossem espiritualmente cegos, não seriam culpados de pecado.”
  rationale: O contexto aponta para percepção espiritual, mas a formulação de Jesus explora deliberadamente a metáfora da cegueira física desenvolvida ao longo do capítulo. Torná-la explícita reduziria a ambiguidade e a tensão teológica do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O uso de ‘vocês’ comunica naturalmente o plural; ‘lhes disse’ evita repetição excessiva. O ponto e vírgula conserva a ligação estreita entre a alegação ‘Nós vemos’ e a permanência do pecado.
