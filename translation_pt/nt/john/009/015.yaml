  text: πάλιν οὖν ἠρώτων αὐτὸν καὶ οἱ Φαρισαῖοι πῶς ἀνέβλεψεν. ὁ δὲ εἶπεν αὐτοῖς· Πηλὸν ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς, καὶ ἐνιψάμην, καὶ βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/015.yaml
  text: So the Pharisees also asked him again how he had received his sight[a]. He said to them, “He put mud on my eyes, and I washed[b], and I see.”
translation:
  language: pt
  text: 'Então, os fariseus também lhe perguntaram de novo como ele havia passado a enxergar. Ele lhes disse: “Ele pôs barro sobre os meus olhos, e eu me lavei, e enxergo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν οὖν
  choice: Então ... de novo
  rationale: “Então” dá continuidade à narrativa sem tornar οὖν excessivamente conclusivo; “de novo” expressa claramente a repetição indicada por πάλιν.
- source_word: ἠρώτων
  choice: perguntaram
  rationale: O imperfeito pode sugerir uma ação em curso ou reiterada; no contexto, “perguntaram de novo” comunica naturalmente essa repetição em português.
- source_word: καὶ οἱ Φαρισαῖοι
  choice: os fariseus também
  rationale: O καί inclui os fariseus entre os que o interrogaram, e “também” preserva essa ligação narrativa.
- source_word: πῶς ἀνέβλεψεν
  choice: como ele havia passado a enxergar
  rationale: No contexto de um homem cego de nascença, a expressão indica a obtenção da visão. “Passado a enxergar” é natural e evita sugerir necessariamente que ele recuperou uma capacidade que antes possuía.
- source_word: Πηλὸν
  choice: barro
  rationale: πηλός pode designar barro, lama ou argila. “Barro” é claro, natural e adequado à substância aplicada aos olhos.
- source_word: ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς
  choice: pôs barro nos meus olhos
  rationale: Reproduz de modo direto e corrente a ação de colocar a substância sobre os olhos.
- source_word: ἐνιψάμην
  choice: eu me lavei
  rationale: A forma média permite explicitar a participação do próprio homem na ação; “me lavei” é natural no contexto e não especifica além do grego exatamente o que foi lavado.
- source_word: βλέπω
  choice: enxergo
  rationale: O presente grego ressalta o estado atual resultante da cura. “Enxergo” preserva o presente e é especialmente apropriado ao contraste com a cegueira.
