revisions:
- from: 'Então, os fariseus também lhe perguntaram de novo como ele havia passado a enxergar.[a] Ele lhes respondeu: “Ele pôs barro[b] nos meus olhos, eu me lavei e enxergo.”'
  to: 'Então, os fariseus também lhe perguntaram de novo como ele havia passado a enxergar. Ele lhes disse: “Ele pôs barro sobre os meus olhos, e eu me lavei, e enxergo.”'
  rationale: Remove-se a nota a por introduzir uma possível implicação incompatível com o contexto narrativo. Ajusta-se a preposição em relação ao barro para refletir mais precisamente ἐπὶ τοὺς ὀφθαλμούς e emprega-se coordenação explícita na fala, preservando a simplicidade do original.
  reviewer_model: gpt-5.6-terra
