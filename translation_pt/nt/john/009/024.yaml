base_translation:
  language: en
  yaml_path: translation/nt/john/009/024.yaml
  text: So they called the man who had been blind a second time and said to him[a], “Give glory to God; we know that this man is a sinner.”
translation:
  language: pt
  text: 'Então chamaram o homem que tinha sido cego pela segunda vez e lhe disseram[a]: “Dê glória a Deus; nós sabemos que esse homem é pecador.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente, como uma exortação solene: “Dê a glória a Deus”, isto é, “Diga a verdade diante de Deus” ou “Confesse abertamente diante de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφώνησαν
  choice: chamaram
  rationale: Neste contexto, o verbo indica que as autoridades chamaram o homem novamente à presença delas. “Chamaram” é natural e não acrescenta a força oficial de “convocaram”, que não está explícita no verbo.
- source_word: οὖν
  choice: Então
  rationale: Marca a progressão narrativa decorrente da conversa anterior; “então” conserva a conexão de modo natural em português.
- source_word: ἐκ δευτέρου
  choice: pela segunda vez
  rationale: Reproduz com clareza o sentido temporal da expressão grega, sem reduzi-la ao menos preciso “novamente”.
- source_word: ὃς ἦν τυφλός
  choice: que tinha sido cego
  rationale: O homem já havia sido curado. Essa formulação situa a cegueira no passado e evita sugerir que ele ainda era cego.
- source_word: Δὸς δόξαν τῷ θεῷ
  choice: Dê glória a Deus
  rationale: Preserva a forma explícita da expressão grega, enquanto a nota registra sua provável força idiomática como uma exortação solene a dizer a verdade ou confessar abertamente.
- source_word: ἡμεῖς οἴδαμεν
  choice: Nós sabemos
  rationale: O pronome explícito é mantido para refletir a ênfase retórica com que os falantes afirmam sua certeza.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: esse homem
  rationale: Em referência a uma terceira pessoa presente ou em foco no discurso, “esse homem” é corrente em português e evita acrescentar o tom depreciativo de alternativas como “esse sujeito”.
- source_word: ἁμαρτωλός
  choice: pecador
  rationale: Como predicativo, “é pecador” expressa diretamente a acusação e é idiomático em português; o artigo indefinido não é necessário nesse uso.
theological_decisions:
- issue: Força idiomática de Δὸς δόξαν τῷ θεῷ
  choice: Manter no texto principal a formulação literal “Dê glória a Deus”
  alternative: Traduzir interpretativamente como “Diga a verdade diante de Deus” ou “Confesse diante de Deus”
  rationale: A expressão provavelmente funciona como uma adjuração solene para que o homem diga a verdade, mas sua forma verbal explícita fala em dar glória a Deus. O texto principal preserva essa formulação e a nota apresenta a força idiomática possível, sem resolver além da evidência.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Dê” trata o interlocutor no singular sem recorrer a uma forma excessivamente solene; “pela segunda vez” e “tinha sido cego” tornam clara a sequência narrativa.
