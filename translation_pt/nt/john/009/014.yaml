source:
  edition: SBLGNT
  text: ἦν δὲ σάββατον ⸂ἐν ᾗ ἡμέρᾳ⸃ τὸν πηλὸν ἐποίησεν ὁ Ἰησοῦς καὶ ἀνέῳξεν αὐτοῦ τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/014.yaml
  text: It was a Sabbath on the day when Jesus made the mud and opened his eyes.
translation:
  language: pt
  text: O dia em que Jesus fez a lama[a] e abriu os olhos dele[b] era sábado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “barro”.
    reason: lexical_alternative
  - marker: b
    text: A expressão concreta “abriu os olhos dele” descreve a cura da cegueira.
    reason: lexical_alternative
lexical_decisions:
- source_word: σάββατον
  choice: sábado
  rationale: Em português, a construção predicativa natural é “era sábado”, sem artigo. Ela preserva a referência ao dia semanal e não acrescenta interpretação sobre a controvérsia posterior.
- source_word: ἐν ᾗ ἡμέρᾳ
  choice: O dia em que
  rationale: A oração foi trazida para o início para produzir uma frase portuguesa natural, preservando explicitamente a referência a “dia” e a relação temporal.
- source_word: πηλόν
  choice: lama
  rationale: No contexto, trata-se da mistura de saliva com terra feita por Jesus. “Lama” é corrente e natural; “barro” continua sendo uma alternativa lexical possível.
- source_word: ἐποίησεν
  choice: fez
  rationale: Traduz diretamente o sentido comum de ποιέω e descreve de modo simples a preparação da lama.
- source_word: ἀνέῳξεν
  choice: abriu
  rationale: Mantém a imagem concreta do verbo grego e o modo joanino de descrever a cura, sem substituí-la pela interpretação “devolveu a visão”.
- source_word: αὐτοῦ τοὺς ὀφθαλμούς
  choice: os olhos dele
  rationale: Preserva a referência corporal concreta e deixa o pronome remeter ao homem curado, sem abstrair para “sua visão”.
- source_word: δὲ
  choice: sem equivalente expresso
  rationale: δέ funciona aqui como transição narrativa leve. O português não exige um conectivo, e inserir “mas” sugeriria contraste mais forte que o texto.
theological_decisions:
- issue: Referência ao sábado em relação à cura realizada por Jesus
  choice: Apresentar apenas a informação temporal de que o ato ocorreu no sábado.
  alternative: Acrescentar explicação sobre a lei do sábado ou antecipar a acusação dos fariseus.
  rationale: O versículo prepara a controvérsia subsequente, mas não a interpreta. A tradução conserva essa tensão narrativa sem decidir se a ação constitui violação do sábado.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da oração foi ajustada para evitar a formulação pouco natural “Era sábado no dia em que...”, sem perder nenhum elemento temporal do grego.
