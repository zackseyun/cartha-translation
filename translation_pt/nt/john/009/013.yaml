  text: Ἄγουσιν αὐτὸν πρὸς τοὺς Φαρισαίους τόν ποτε τυφλόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/013.yaml
  text: They brought the man who had formerly been blind to the Pharisees[a].
translation:
  language: pt
  text: Levaram aos fariseus o homem que antes era cego.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγουσιν
  choice: Levaram
  rationale: O presente grego é um presente histórico. Em narrativa portuguesa, o pretérito perfeito comunica a ação com naturalidade; “levaram” também expressa adequadamente o movimento até os fariseus.
- source_word: αὐτὸν
  choice: o homem
  rationale: Embora o pronome signifique literalmente “o”, a expressão substantivada seguinte identifica o referente. Tornar explícito “o homem” produz uma frase portuguesa clara e preserva o sentido.
- source_word: πρὸς τοὺς Φαρισαίους
  choice: aos fariseus
  rationale: πρός com acusativo indica aqui movimento em direção a pessoas. “Aos fariseus” é direto e menos interpretativo do que “à presença dos fariseus”.
- source_word: Φαρισαίους
  choice: fariseus
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do grupo.
- source_word: τὸν ποτε τυφλόν
  choice: o homem que antes era cego
  rationale: A expressão é substantivada, literalmente “aquele que antes era cego”. A oração relativa explicita o referente de modo natural e mantém o contraste entre a condição anterior e a cura presente.
- source_word: ποτε
  choice: antes
  rationale: No contexto, indica uma condição anterior. “Antes” é corrente e claro em português moderno.
- source_word: τυφλόν
  choice: cego
  rationale: Correspondência direta do adjetivo que descreve a condição anterior do homem.
