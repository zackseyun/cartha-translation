  text: ἡμεῖς οἴδαμεν ὅτι Μωϋσεῖ λελάληκεν ὁ θεός, τοῦτον δὲ οὐκ οἴδαμεν πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/029.yaml
  text: We know that God has spoken to Moses[a], but as for this man, we do not know where he is from.
translation:
  language: pt
  text: 'Nós sabemos que Deus falou a Moisés; quanto a este homem, porém, não sabemos de onde ele vem.[a]


    [a] Ou: “qual é a sua origem”. Em João, as questões sobre a origem de Jesus podem ter tanto um sentido comum quanto um significado teológico mais profundo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “qual é a sua origem”. Em João, as questões sobre a origem de Jesus podem ter tanto um sentido comum quanto um significado teológico mais profundo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: Nós
  rationale: O pronome explícito dá ênfase e estabelece contraste com “este homem”; em português, “nós” preserva isso naturalmente, sem recorrer a “nós mesmos”.
- source_word: οἴδαμεν
  choice: sabemos
  rationale: Expressa conhecimento ou certeza e é repetido da mesma forma nas duas ocorrências do versículo.
- source_word: Μωϋσεῖ
  choice: a Moisés
  rationale: Forma convencional do nome em português; o dativo indica a pessoa a quem Deus falou.
- source_word: λελάληκεν
  choice: falou
  rationale: O perfeito grego apresenta a fala de Deus como fato estabelecido e ainda relevante. Em português atual, “falou” comunica isso de modo mais natural que “tem falado”, que poderia sugerir repetição ou continuidade.
- source_word: ὁ θεός
  choice: Deus
  rationale: Designação padrão e natural em português, sem necessidade de artigo neste contexto.
- source_word: τοῦτον δὲ
  choice: quanto a este homem, porém
  rationale: Preserva o contraste, a mudança de tópico e o tom de distanciamento do demonstrativo, sem intensificá-lo indevidamente.
- source_word: οὐκ οἴδαμεν
  choice: não sabemos
  rationale: Mantém a repetição contrastiva do verbo usado anteriormente.
- source_word: πόθεν ἐστίν
  choice: de onde ele é
  rationale: Formulação idiomática que conserva a amplitude da pergunta sobre origem, sem decidir se se trata apenas de procedência geográfica ou também de origem e autoridade mais profundas.
theological_decisions:
- issue: Sentido da origem de Jesus em πόθεν ἐστίν
  choice: de onde ele é
  alternative: de onde ele vem
  rationale: A formulação ampla preserva a ironia narrativa e a possível dupla dimensão, comum em João, entre procedência humana e origem ou autorização divina, sem explicar essa tensão dentro do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula e a construção “quanto a este homem, porém” tornam explícito o contraste do grego sem acrescentar interpretação. O marcador foi colocado junto à expressão sobre a origem de Jesus, à qual a nota efetivamente se refere.
