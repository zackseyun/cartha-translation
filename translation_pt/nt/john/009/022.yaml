id: JHN.9.22
reference: John 9:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ ὅτι ἐφοβοῦντο τοὺς Ἰουδαίους, ἤδη γὰρ συνετέθειντο οἱ Ἰουδαῖοι ἵνα ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν, ἀποσυνάγωγος γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/022.yaml
  text: His parents said these things because they were afraid of the Jews[a], for the Jews had already agreed that if anyone confessed him as the Messiah[b], he would be put out of the synagogue.
translation:
  language: pt
  text: Seus pais disseram isso porque tinham medo dos judeus[a], pois os judeus já haviam combinado que, se alguém o reconhecesse como o Messias[b], seria expulso da sinagoga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “os judeus”. Neste contexto, a expressão provavelmente se refere às autoridades judaicas, e não indistintamente ao povo judeu.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “o reconhecesse como o Cristo” ou “declarasse que ele era o Messias”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπαν
  choice: disseram isso
  rationale: Embora ταῦτα seja formalmente plural, em português natural “isso” retoma de modo idiomático o conjunto das declarações anteriores sem perder o referente.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: seus pais
  rationale: Equivalente direto e natural de γονεῖς com o possessivo αὐτοῦ.
- source_word: ὅτι ἐφοβοῦντο
  choice: porque tinham medo
  rationale: ὅτι introduz a causa, e o imperfeito ἐφοβοῦντο expressa um estado contínuo de temor.
- source_word: τοὺς Ἰουδαίους / οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Preserva a expressão do texto grego; uma nota esclarece que, neste contexto, ela provavelmente aponta para as autoridades judaicas com poder disciplinar.
- source_word: ἤδη γὰρ συνετέθειντο
  choice: pois os judeus já haviam combinado
  rationale: O mais-que-perfeito indica um acordo estabelecido anteriormente; “combinado” comunica decisão conjunta sem acrescentar a ideia necessária de conspiração.
- source_word: ἵνα ἐάν τις
  choice: que, se alguém
  rationale: Expressa em português corrente o conteúdo do acordo introduzido pela construção grega.
- source_word: αὐτὸν ὁμολογήσῃ χριστόν
  choice: o reconhecesse como o Messias
  rationale: ὁμολογέω indica reconhecimento ou declaração pública; “reconhecesse” é natural em português e mantém a dimensão pública no contexto. χριστόν funciona como título messiânico.
- source_word: ἀποσυνάγωγος γένηται
  choice: seria expulso da sinagoga
  rationale: Comunica com clareza a exclusão da comunidade sinagogal indicada pelo adjetivo ἀποσυνάγωγος.
theological_decisions:
- issue: Tradução de χριστόν
  choice: o Messias
  alternative: o Cristo / Cristo
  rationale: Aqui Χριστός funciona claramente como título atribuído a Jesus. “Messias” preserva seu contexto judaico e o sentido de Ungido.
- issue: Referente de οἱ Ἰουδαῖοι
  choice: os judeus, com nota contextual
  alternative: as autoridades judaicas / os judeus da Judeia
  rationale: O texto principal mantém a formulação lexical ampla do grego, enquanto a nota evita sua aplicação indiscriminada ao povo judeu e registra o referente provável no contexto.
- issue: Natureza da exclusão expressa por ἀποσυνάγωγος
  choice: expulso da sinagoga
  alternative: excluído da comunidade da sinagoga
  rationale: A formulação concisa preserva a sanção social e religiosa sem definir além do texto sua forma institucional exata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação preserva a repetição de “os judeus” e mantém o valor titular de “Messias”, usando notas apenas onde a expressão grega pode ser mal compreendida ou admite tradução alternativa legítima.
