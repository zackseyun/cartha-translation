id: JHN.9.9
reference: John 9:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἄλλοι ἔλεγον ὅτι Οὗτός ἐστιν· ἄλλοι ⸂ἔλεγον· Οὐχί, ἀλλὰ⸃ ὅμοιος αὐτῷ ἐστιν. ἐκεῖνος ἔλεγεν ὅτι Ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/009.yaml
  text: Some were saying[a], “This is he.” Others were saying, “No, but he is like him.” He kept saying, “I am he.”
translation:
  language: pt
  text: 'Alguns diziam: “É ele.” Outros diziam: “Não, mas se parece com ele.” O homem insistia: “Sou eu.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Eu sou”. Aqui, a expressão é uma identificação comum: o homem afirma que é a pessoa de quem estão falando.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι ... ἄλλοι
  choice: Alguns ... Outros
  rationale: A dupla ocorrência distingue grupos diferentes entre os que discutiam; “Alguns... Outros” expressa naturalmente esse contraste em português.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito apresenta falas em andamento ou repetidas durante a discussão; “diziam” preserva esse aspecto sem exagerá-lo.
- source_word: ὅτι
  choice: marcador de discurso direto expresso por dois-pontos e aspas
  rationale: Aqui ὅτι introduz citações diretas; a pontuação é a forma idiomática de representá-lo em português.
- source_word: Οὗτός ἐστιν
  choice: É ele
  rationale: Identificação direta e concisa, natural em português, sem acrescentar um substantivo ausente do grego.
- source_word: Οὐχί, ἀλλὰ
  choice: Não, mas
  rationale: Preserva a negação enfática e o contraste de maneira clara e corrente.
- source_word: ὅμοιος αὐτῷ ἐστιν
  choice: se parece com ele
  rationale: Expressa semelhança, e não identidade, em português natural.
- source_word: ἐκεῖνος
  choice: O homem
  rationale: O pronome demonstrativo retoma o homem discutido. Repetir o referente evita a possível ambiguidade de “ele” e permanece natural no contexto.
- source_word: ἔλεγεν
  choice: insistia
  rationale: O imperfeito, no contexto da discussão continuada, sugere que ele repetia sua afirmação; “insistia” comunica essa força iterativa de modo conciso.
- source_word: Ἐγώ εἰμι
  choice: Sou eu
  rationale: Neste contexto, a expressão funciona como identificação pessoal. “Sou eu” é a formulação portuguesa mais natural e mantém a forma verbal explícita do grego.
theological_decisions:
- issue: Sentido de Ἐγώ εἰμι no contexto joanino
  choice: Sou eu
  alternative: Eu sou
  rationale: Embora a expressão possa ter ressonância especial em outros trechos de João, aqui quem fala é o homem curado, confirmando que é a pessoa discutida. “Sou eu” comunica essa identificação comum sem importar uma afirmação cristológica; a nota registra a forma mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O diálogo permanece conciso, e o aspecto iterativo dos imperfeitos é expresso primeiro por “diziam” e depois, no contexto de repetida autoidentificação, por “insistia”.
