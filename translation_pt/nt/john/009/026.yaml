  text: So they said to him, “What did he do to you? How did he open your eyes?”
translation:
  language: pt
  text: 'Então lhe disseram: “O que ele fez com você? Como abriu os seus olhos?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπον
  choice: disseram
  rationale: O aoristo de λέγω introduz a fala direta do grupo; “disseram” preserva o valor lexical, enquanto as perguntas já deixam claro que se trata de um interrogatório.
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação e a consequência no discurso. “Então” é natural em português e mantém a ligação com o contexto anterior.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome dativo refere-se ao homem que havia sido cego; “lhe disseram” é uma forma idiomática e clara em português.
- source_word: Τί ἐποίησέν σοι
  choice: O que ele fez com você?
  rationale: ποιέω com o dativo pode indicar o que foi feito a alguém ou em seu benefício. “Fez com você” preserva a formulação investigativa sem pressupor benevolência.
- source_word: πῶς ἤνοιξέν σου τοὺς ὀφθαλμούς
  choice: Como abriu os seus olhos?
  rationale: A tradução mantém a pergunta pelo modo ou meio e verte naturalmente a construção grega referente à parte do corpo.
