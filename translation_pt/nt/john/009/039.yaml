  source_fidelity: A tradução reproduz com precisão εἰς κρίμα (“Para juízo”), εἰς τὸν κόσμον τοῦτον ἦλθον (“vim a este mundo”) e a oração de finalidade com seus dois membros paralelos. “Os que não veem vejam” e “os que veem se tornem cegos” preservam a ambiguidade deliberada entre visão literal e discernimento espiritual, bem como a ideia de tornar-se expressa por γένωνται.
  naturalness: O português é moderno, claro e de registro bíblico sóbrio. A ordem mais marcada em “Para juízo vim” é natural nesse registro e reflete adequadamente a ênfase inicial do grego. “A fim de que” introduz a finalidade de modo idiomático e preciso.
  terminology: “Juízo” é uma escolha apropriada para κρίμα e evita reduzir o enunciado a “condenação”. “Mundo”, “veem” e “cegos” são termos estabelecidos, claros e coerentes com o uso joanino. A nota apresenta de modo equilibrado a alternativa “um juízo” e o alcance judicial da expressão, sem impor interpretação doutrinária.
