id: JHN.9.39
reference: John 9:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Εἰς κρίμα ἐγὼ εἰς τὸν κόσμον τοῦτον ἦλθον, ἵνα οἱ μὴ βλέποντες βλέπωσιν καὶ οἱ βλέποντες τυφλοὶ γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/039.yaml
  text: And Jesus said[a], “For judgment I came into this world, so that those who do not see may see, and those who see may become blind.”
translation:
  language: pt
  text: 'E Jesus disse: “Para juízo vim a este mundo,[a] a fim de que os que não veem vejam, e os que veem se tornem cegos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Para um juízo vim a este mundo”. O grego pode destacar o efeito judicial da vinda de Jesus, e não apenas condenação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίμα
  choice: juízo
  rationale: Preserva o sentido de decisão ou efeito judicial, sem restringi-lo a condenação, e mantém a concisão e a tensão do texto.
- source_word: κόσμον
  choice: mundo
  rationale: É o equivalente natural e consagrado para κόσμος no contexto joanino.
- source_word: οἱ μὴ βλέποντες / οἱ βλέποντες
  choice: os que não veem / os que veem
  rationale: Mantém o paralelismo e a ambiguidade entre visão física e percepção espiritual.
- source_word: βλέπωσιν
  choice: vejam
  rationale: O subjuntivo após ἵνα é expresso naturalmente em português e conserva tanto o sentido físico quanto o espiritual.
- source_word: τυφλοὶ γένωνται
  choice: se tornem cegos
  rationale: Reproduz a ideia resultativa de γίνομαι e a inversão contundente do dito.
- source_word: εἰς τὸν κόσμον τοῦτον ἦλθον
  choice: vim a este mundo
  rationale: Formulação natural em português que preserva a linguagem joanina da vinda de Jesus ao mundo.
theological_decisions:
- issue: Relação com João 3:17, onde se afirma que o Filho não veio para julgar o mundo
  choice: Manter “juízo” sem suavizar a afirmação
  alternative: Traduzir como “divisão”, “crise” ou “condenação”
  rationale: O versículo apresenta a vinda de Jesus como produzindo uma separação de caráter judicial. A tradução preserva a tensão teológica interna de João, sem harmonizá-la por paráfrase.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do original. “A fim de que” expressa com naturalidade a finalidade, enquanto “os que não veem / os que veem” conserva o paralelismo e a dupla referência à visão física e espiritual.
