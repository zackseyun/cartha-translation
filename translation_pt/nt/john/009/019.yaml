  text: καὶ ἠρώτησαν αὐτοὺς λέγοντες· Οὗτός ἐστιν ὁ υἱὸς ὑμῶν, ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη; πῶς οὖν ⸂βλέπει ἄρτι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/019.yaml
  text: And they asked them, saying, “Is this your son, whom you say was born blind? How then does he now see?”
translation:
  language: pt
  text: 'E perguntaram aos pais dele: “Este é o filho de vocês, que vocês dizem ter nascido cego? Como, então, ele vê agora?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν αὐτοὺς
  choice: perguntaram aos pais dele
  rationale: O pronome αὐτούς retoma os pais no contexto imediato. Explicitar o referente evita ambiguidade em português sem acrescentar informação nova.
- source_word: λέγοντες
  choice: '[incorporado nos dois-pontos]'
  rationale: O particípio introduz o conteúdo da pergunta. Em português atual, os dois-pontos cumprem essa função com mais naturalidade do que a expressão literal “dizendo”.
- source_word: Οὗτός ἐστιν ὁ υἱὸς ὑμῶν
  choice: Este é o filho de vocês?
  rationale: Embora a forma grega seja declarativa, o contexto e a sequência interrogativa mostram que funciona como pergunta. “Vocês” é amplamente inteligível e preserva a segunda pessoa do plural.
- source_word: ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη
  choice: que vocês dizem ter nascido cego
  rationale: A construção com infinitivo é idiomática em português, mantém o verbo neutro “dizem” e preserva a ênfase explícita em ὑμεῖς sem introduzir a suspeita adicional de “alegam”.
- source_word: πῶς οὖν
  choice: Como, então
  rationale: “Então” conserva a força inferencial de οὖν, ligando a visão presente à afirmação de que ele nasceu cego.
- source_word: βλέπει ἄρτι
  choice: ele vê agora
  rationale: “Vê” expressa o fato presente, sem deslocar o sentido para mera capacidade, e “agora” marca o contraste com a cegueira anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A formulação evita literalismo pouco natural em “perguntaram... dizendo”, preservando integralmente o conteúdo e a lógica das perguntas.
