id: JHN.9.33
reference: John 9:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ μὴ ἦν οὗτος παρὰ θεοῦ, οὐκ ἠδύνατο ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/033.yaml
  text: If this man were not from God[a], he could do nothing.
translation:
  language: pt
  text: Se este homem não viesse de Deus[a], não poderia fazer coisa alguma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Se este homem não fosse da parte de Deus».'
    reason: Alternativa mais formal que conserva diretamente o verbo «ser» e a expressão de procedência/associação, embora seja menos idiomática.
lexical_decisions:
- source_word: εἰ μὴ
  choice: Se ... não
  rationale: Mantém de modo transparente a estrutura condicional do grego; «a menos que» seria possível, mas menos natural nesta formulação contrafactual em português.
- source_word: ἦν
  choice: viesse
  rationale: Embora o verbo grego seja literalmente «era/estava», com παρὰ θεοῦ exprime aqui procedência. «Viesse de Deus» comunica em português natural a hipótese irreal sem ampliar a frase para «fosse enviado».
- source_word: οὗτος
  choice: este homem
  rationale: O demonstrativo refere-se a Jesus, um homem já em discussão; a forma é clara e natural no contexto.
- source_word: παρὰ θεοῦ
  choice: de Deus
  rationale: παρά com o genitivo indica fonte ou procedência. Em combinação com «viesse», preserva essa noção sem interpretar além do texto como «enviado» ou «autorizado».
- source_word: οὐκ ἠδύνατο
  choice: não poderia
  rationale: Expressa incapacidade no contexto de uma condição irreal e soa natural em português.
- source_word: ποιεῖν οὐδέν
  choice: fazer coisa alguma
  rationale: Reproduz a negação enfática do grego em português corrente e digno; evita a dupla negativa «não poderia fazer nada», também possível, mas mais coloquial.
theological_decisions:
- issue: Sentido de παρὰ θεοῦ em relação a Jesus
  choice: viesse de Deus
  alternative: fosse enviado por Deus; tivesse autorização de Deus
  rationale: A tradução conserva a afirmação de procedência divina sem convertê-la numa formulação técnica sobre missão, autorização ou ontologia.
- issue: Força da condição
  choice: Se este homem não viesse de Deus
  alternative: A menos que este homem viesse de Deus
  rationale: 'A construção escolhida preserva a argumentação contrafactual: sua capacidade de realizar tais obras é apresentada como incompatível com não proceder de Deus.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Viesse de Deus» é natural e mantém a ideia de origem sem acrescentar «enviado». O marcador [a] aparece no texto principal.
