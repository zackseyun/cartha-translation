base_translation:
  language: en
  yaml_path: translation/nt/john/009/032.yaml
  text: From of old it has never been heard that anyone opened the eyes of one born blind[a].
translation:
  language: pt
  text: Desde os tempos antigos, nunca se ouviu dizer que alguém tenha aberto os olhos de uma pessoa cega de nascença[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Desde que o mundo começou, nunca se ouviu dizer...”'
    reason: Alternativa lexical para ἐκ τοῦ αἰῶνος, que pode ser entendida como abrangendo toda a história do mundo.
lexical_decisions:
- source_word: ἐκ τοῦ αἰῶνος
  choice: Desde os tempos antigos
  rationale: Traduz a expressão temporal idiomática como referência a toda a memória histórica, sem impor o sentido metafísico mais forte de “desde a eternidade”.
- source_word: οὐκ ἠκούσθη
  choice: nunca se ouviu dizer
  rationale: Expressão impessoal natural em português para a ausência de qualquer precedente conhecido, preservando a forma passiva do grego.
- source_word: ὅτι
  choice: que
  rationale: Introduz diretamente o conteúdo daquilo de que nunca se ouviu falar.
- source_word: ἠνέῳξέν
  choice: tenha aberto
  rationale: Mantém a imagem concreta de abrir os olhos; o subjuntivo composto é natural depois de “nunca se ouviu dizer que” e apresenta o ato como precedente inexistente.
- source_word: τις
  choice: alguém
  rationale: Representa o sujeito indefinido dentro de uma afirmação negativa de alcance geral.
- source_word: ὀφθαλμοὺς
  choice: os olhos
  rationale: Conserva a expressão idiomática e concreta “abrir os olhos”.
- source_word: τυφλοῦ γεγεννημένου
  choice: de uma pessoa cega de nascença
  rationale: Expressa com clareza que a cegueira existia desde o nascimento, sem acrescentar “homem”, substantivo que não aparece explicitamente no grego.
theological_decisions:
- issue: Alcance temporal de ἐκ τοῦ αἰῶνος
  choice: 'referência histórica: “desde os tempos antigos”'
  alternative: “desde que o mundo começou” ou “desde a eternidade”
  rationale: No contexto, o homem aponta para a inexistência de precedente na experiência humana conhecida, não formula uma afirmação metafísica sobre a eternidade. A nota preserva a alternativa tradicional mais abrangente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pessoa cega de nascença” evita acrescentar gênero não explicitado pelo substantivo grego e soa natural no contexto.
