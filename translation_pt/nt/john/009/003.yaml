  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὔτε οὗτος ἥμαρτεν οὔτε οἱ γονεῖς αὐτοῦ, ἀλλ’ ἵνα φανερωθῇ τὰ ἔργα τοῦ θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/003.yaml
  text: Jesus answered[a], “Neither this man sinned, nor his parents[c][b], but so that the works of God might be revealed in him.”
translation:
  language: pt
  text: 'Jesus respondeu: “Nem este homem pecou, nem os pais dele; mas foi[b] para que as obras de Deus se manifestassem nele[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “por meio dele”. O grego diz literalmente “nele” e pode indicar tanto a pessoa em quem quanto aquela por meio de quem as obras de Deus se manifestam.
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente, a última parte diz: “mas para que as obras de Deus se manifestassem nele”. O grego deixa elíptico o elemento que em português foi expresso por “foi”.'
    reason: source_construction
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: Forma narrativa corrente e direta para introduzir a resposta de Jesus.
- source_word: Οὔτε ... οὔτε
  choice: Nem ... nem
  rationale: Reproduz naturalmente em português a negação correlativa enfática das duas possibilidades.
- source_word: οὗτος
  choice: este homem
  rationale: Explicita de modo natural o referente masculino já presente no contexto, sem acrescentar informação nova.
- source_word: ἥμαρτεν
  choice: pecou
  rationale: Equivalente direto e idiomático do aoristo de ἁμαρτάνω.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: os pais dele
  rationale: Expressão clara e corrente em português, evitando possível ambiguidade de «seus pais» quanto ao possuidor.
- source_word: ἀλλ’ ἵνα
  choice: mas foi para que
  rationale: Torna natural em português a construção elíptica grega e mantém a orientação de finalidade de ἵνα, sem especificar além do texto o que ocorreu ou quem o causou.
- source_word: φανερωθῇ
  choice: se manifestassem
  rationale: Preserva a ideia de que as obras se tornam visíveis ou evidentes e se ajusta naturalmente à oração final em português.
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: as obras de Deus
  rationale: Tradução transparente que conserva a formulação teológica característica de João.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Mantém a correspondência direta com ἐν αὐτῷ e não decide se a manifestação ocorre na pessoa ou por meio dela.
theological_decisions:
- issue: Se Jesus nega toda relação possível entre pecado e sofrimento ou apenas as causas propostas para este caso
  choice: A negação fica restrita a este homem e aos pais dele.
  alternative: Parafrasear como uma afirmação universal de que sofrimento nunca decorre de pecado pessoal ou parental.
  rationale: A resposta trata das duas explicações propostas pelos discípulos neste caso específico; não se deve ampliar a afirmação para uma regra universal.
- issue: Se ἵνα indica finalidade ou apenas resultado
  choice: Usar a formulação final «para que».
  alternative: Traduzir como simples resultado, por exemplo, «e assim as obras de Deus se manifestaram».
  rationale: A leitura mais direta de ἵνα com o subjuntivo é orientada para finalidade. A tradução conserva essa tensão sem acrescentar uma declaração explícita de que Deus causou a cegueira.
- issue: Sentido de ἐν αὐτῷ
  choice: Traduzir literalmente por «nele».
  alternative: Interpretar instrumentalmente como «por meio dele».
  rationale: A preposição pode admitir nuances locais ou instrumentais no contexto. «Nele» preserva a formulação e a ambiguidade do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Os pais dele» é preferido a «seus pais» para evitar ambiguidade. O ponto e vírgula marca a mudança entre a negação das causas propostas e a oração de finalidade.
