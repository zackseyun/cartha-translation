  text: ⸀εἶπεν αὐτῷ ὁ Ἰησοῦς· Καὶ ἑώρακας αὐτὸν καὶ ὁ λαλῶν μετὰ σοῦ ἐκεῖνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/037.yaml
  text: Jesus said to him[a], “You have seen him, and the one speaking with you is he.”
translation:
  language: pt
  text: 'Jesus lhe disse: “Você já o viu; é ele quem está falando com você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: lhe disse
  rationale: O aoristo de λέγω introduz naturalmente a fala no relato, e o dativo αὐτῷ é expresso pelo pronome indireto “lhe”.
- source_word: Καὶ ἑώρακας αὐτόν
  choice: Você já o viu
  rationale: O perfeito ἑώρακας indica uma visão ocorrida com relevância presente. “Já o viu” comunica esse resultado atual em português natural; o καί inicial tem aqui força contextual que não exige um “e” rígido.
- source_word: ὁ λαλῶν μετὰ σοῦ
  choice: quem está falando com você
  rationale: O particípio presente substantivado indica a pessoa que fala neste momento. “Falando com você” preserva o sentido normal de μετά com genitivo e é idiomático em português.
- source_word: ἐκεῖνός ἐστιν
  choice: é ele
  rationale: A fórmula identifica diretamente Jesus com o referente masculino mencionado no contexto, sem repetir ou acrescentar o título do versículo anterior.
theological_decisions:
- issue: A autoidentificação de Jesus como o referente da pergunta anterior
  choice: “é ele quem está falando com você”
  alternative: “aquele que fala com você é ele”
  rationale: A formulação conserva a identificação direta e enfática, mas não explicita novamente “Filho do Homem”, título que não aparece no texto grego deste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da segunda oração foi ajustada para soar natural sem perder a ênfase identificadora do grego.
