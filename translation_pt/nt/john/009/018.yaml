id: JHN.9.18
reference: John 9:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐκ ἐπίστευσαν οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι ⸂ἦν τυφλὸς⸃ καὶ ἀνέβλεψεν, ἕως ὅτου ἐφώνησαν τοὺς γονεῖς αὐτοῦ ⸂τοῦ ἀναβλέψαντος⸃
base_translation:
  language: en
  yaml_path: translation/nt/john/009/018.yaml
  text: So the Jews did not believe concerning him that he had been blind and had received sight[a], until they called the parents of the one who had received sight.
translation:
  language: pt
  text: Assim, os judeus[a] não acreditaram que ele tivesse sido cego e passado a enxergar, até que chamaram os pais daquele que havia passado a enxergar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “os líderes judeus” ou “os judeanos”, dependendo de como se entende, neste contexto, o uso que João faz da expressão “os judeus”.
    reason: Registra a possível especificidade contextual de οἱ Ἰουδαῖοι sem estreitar interpretativamente o texto principal.
lexical_decisions:
- source_word: ἐπίστευσαν
  choice: não acreditaram
  rationale: Com a oração de conteúdo introduzida por ὅτι, πιστεύω indica aceitar uma afirmação como verdadeira; “acreditaram” é natural e não introduz a ideia de confiança pessoal.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Preserva a expressão grega sem restringir no texto principal o referente a líderes ou a habitantes da Judeia; a possível especificidade contextual é indicada em nota.
- source_word: περὶ αὐτοῦ
  choice: que ele
  rationale: A referência a respeito de quem se nutria a descrença é incorporada naturalmente à oração portuguesa, evitando a formulação pesada “a respeito dele, que” sem perder o referente.
- source_word: ἦν τυφλὸς
  choice: tivesse sido cego
  rationale: O mais-que-perfeito composto do subjuntivo expressa com naturalidade, após “não acreditaram que”, o estado anterior de cegueira cuja realidade estava sendo contestada.
- source_word: ἀνέβλεψεν
  choice: passado a enxergar
  rationale: Em contexto de cura, ἀναβλέπω indica receber a capacidade de ver. “Passado a enxergar” não pressupõe que ele enxergasse antes, como poderia sugerir “recuperado a visão”.
- source_word: ἕως ὅτου
  choice: até
  rationale: Marca de modo idiomático o limite temporal da descrença descrita.
- source_word: ἐφώνησαν
  choice: chamarem
  rationale: φωνέω pode significar chamar ou convocar; “chamar” é corrente e não intensifica desnecessariamente o tom oficial.
- source_word: γονεῖς
  choice: os pais
  rationale: Equivalente português direto e usual para γονεῖς.
- source_word: τοῦ ἀναβλέψαντος
  choice: daquele que havia passado a enxergar
  rationale: Mantém a forma identificadora do particípio substantivado e repete a descrição da cura sem acrescentar informação ausente do grego.
- source_word: οὖν
  choice: Assim
  rationale: Representa a conexão inferencial e narrativa com o contexto anterior em português natural.
theological_decisions:
- issue: Referente e nuance de οἱ Ἰουδαῖοι no Evangelho de João
  choice: os judeus
  alternative: os líderes judeus; os judeanos
  rationale: O texto principal conserva a designação explícita do grego, enquanto a nota registra que, no uso joanino e neste cenário de investigação, o referente pode ser mais específico. Isso evita resolver silenciosamente uma ambiguidade relevante ou generalizar a ação para todo o povo judeu.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Passado a enxergar” é corrente e evita a implicação indevida de visão anterior. A repetição final acompanha a estrutura do original e mantém em foco a identidade do homem curado.
