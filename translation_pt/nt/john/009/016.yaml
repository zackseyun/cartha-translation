  text: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές· ⸂Οὐκ ἔστιν οὗτος παρὰ θεοῦ ὁ ἄνθρωπος⸃, ὅτι τὸ σάββατον οὐ τηρεῖ. ⸀ἄλλοι ἔλεγον· Πῶς δύναται ἄνθρωπος ἁμαρτωλὸς τοιαῦτα σημεῖα ποιεῖν; καὶ σχίσμα ἦν ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/016.yaml
  text: So some of the Pharisees were saying[a], “This man is not from God, because he does not keep the Sabbath.” But others were saying[b], “How can a sinful man do such signs?” And there was a division among them.
translation:
  language: pt
  text: 'Por isso, alguns dos fariseus diziam: “Esse homem não é da parte de Deus, porque não guarda o sábado.” Outros, porém, diziam: “Como pode um homem pecador[a] realizar sinais como esses[b]?” E havia divisão entre eles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um pecador”. O grego diz literalmente “um homem pecador”, com um adjetivo qualificando “homem”.'
    reason: lexical_alternative
  - marker: b
    text: João usa frequentemente “sinais” para as obras de Jesus, ressaltando seu significado revelador. Outra tradução possível é “sinais milagrosos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον ... τινές
  choice: alguns ... diziam
  rationale: O imperfeito ἔλεγον retrata a fala em andamento ou reiterada na cena; “diziam” preserva esse aspecto de modo natural. τινές é traduzido idiomaticamente por “alguns”.
- source_word: οὖν
  choice: Por isso
  rationale: O conectivo assinala continuação com valor inferencial em relação ao que precede. “Por isso” torna essa ligação clara em português corrente.
- source_word: ἐκ τῶν Φαρισαίων
  choice: dos fariseus
  rationale: A expressão identifica alguns pertencentes ao grupo dos fariseus; a contração “dos” transmite naturalmente o sentido de “dentre os”.
- source_word: οὗτος ... ὁ ἄνθρωπος
  choice: Esse homem
  rationale: Mantém a referência masculina e a força do demonstrativo no diálogo, sem acrescentar tom depreciativo ausente do texto.
- source_word: παρὰ θεοῦ
  choice: da parte de Deus
  rationale: παρά com o genitivo indica procedência ou origem. “Da parte de Deus” preserva essa ideia sem introduzir explicitamente o verbo “enviar”.
- source_word: τηρεῖ
  choice: guarda
  rationale: “Guardar o sábado” é expressão portuguesa estabelecida para observar suas exigências e corresponde ao sentido de τηρέω neste contexto.
- source_word: τὸ σάββατον
  choice: o sábado
  rationale: É a designação direta e corrente do dia judaico de descanso, sem necessidade de acrescentar “dia”.
- source_word: ἄλλοι
  choice: Outros, porém
  rationale: “Outros” expressa o grupo contrastante; “porém” explicita em português a oposição já inerente ao contexto.
- source_word: Πῶς δύναται
  choice: Como pode
  rationale: Forma interrogativa natural que preserva a noção de capacidade ou possibilidade de δύναται.
- source_word: ἄνθρωπος ἁμαρτωλὸς
  choice: um homem pecador
  rationale: Preserva a construção grega em que o adjetivo ἁμαρτωλός qualifica ἄνθρωπος, sem reformulá-la simplesmente como substantivo.
- source_word: τοιαῦτα σημεῖα
  choice: sinais como esses
  rationale: “Sinais” conserva o vocabulário característico de João e seu sentido revelador; “como esses” comunica de forma natural a qualidade indicada por τοιαῦτα.
- source_word: σχίσμα
  choice: divisão
  rationale: Expressa a ruptura de opinião dentro do grupo de maneira clara, digna e semanticamente próxima do grego.
theological_decisions:
- issue: Tradução do termo joanino σημεῖα
  choice: sinais
  alternative: milagres; sinais milagrosos
  rationale: João emprega σημεῖα para obras que apontam além do acontecimento para seu significado revelador. “Sinais” preserva essa nuance sem acrescentar uma explicação ao texto.
- issue: A afirmação de que Jesus é παρὰ θεοῦ
  choice: da parte de Deus
  alternative: enviado por Deus; vindo de Deus
  rationale: A expressão pode envolver origem ou autorização divina, mas não contém o verbo “enviar”. A tradução escolhida mantém aberta essa tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O paralelismo entre “alguns ... diziam” e “outros ... diziam” foi preservado, bem como a divergência interna entre os fariseus.
