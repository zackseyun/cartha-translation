id: JHN.9.40
reference: John 9:40
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἤκουσαν ἐκ τῶν Φαρισαίων ταῦτα οἱ ⸂μετ’ αὐτοῦ ὄντες⸃, καὶ εἶπον αὐτῷ· Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/040.yaml
  text: Some of the Pharisees who were with him heard these things and said to him[a], “Surely we are not blind too, are we?”
translation:
  language: pt
  text: 'Alguns dos fariseus que estavam com ele ouviram essas coisas e lhe disseram: “Por acaso nós também somos cegos?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pergunta grega usa μή e espera uma resposta negativa: eles supõem que não são cegos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: ouviram
  rationale: O aoristo de ἀκούω indica que eles ouviram o que Jesus acabara de dizer; “ouviram” é a forma narrativa natural em português.
- source_word: ἐκ τῶν Φαρισαίων
  choice: Alguns dos fariseus
  rationale: A construção partitiva com ἐκ e genitivo indica um grupo dentre os fariseus, não necessariamente todos eles.
- source_word: ταῦτα
  choice: essas coisas
  rationale: Preserva o plural do demonstrativo e remete às declarações anteriores de Jesus sem restringi-las a meras “palavras”.
- source_word: οἱ μετ’ αὐτοῦ ὄντες
  choice: que estavam com ele
  rationale: Expressa de modo natural a locução participial que identifica os fariseus presentes com Jesus.
- source_word: εἶπον αὐτῷ
  choice: lhe disseram
  rationale: Mantém o sentido comum de λέγω ao introduzir discurso direto; a forma interrogativa da fala já deixa claro que se trata de uma pergunta.
- source_word: Μὴ
  choice: Por acaso
  rationale: Em pergunta, μή sinaliza a expectativa de uma resposta negativa. “Por acaso” comunica naturalmente em português a incredulidade da pergunta, enquanto a nota explicita sua orientação.
- source_word: καὶ
  choice: também
  rationale: Associa enfaticamente os próprios fariseus às pessoas anteriormente descritas como cegas.
- source_word: ἡμεῖς
  choice: nós
  rationale: O pronome explícito é mantido para preservar a ênfase do grego.
- source_word: τυφλοί
  choice: cegos
  rationale: Traduz diretamente o adjetivo sem acrescentar “espiritualmente”; o contexto comunica o uso figurado.
- source_word: ἐσμεν
  choice: somos
  rationale: Equivalente direto e natural do presente de εἰμί.
theological_decisions:
- issue: Tornar explícito o sentido metafórico de τυφλοί
  choice: Manter “cegos” sem qualificação
  alternative: “espiritualmente cegos”
  rationale: Embora o contexto indique cegueira figurada, o grego emprega apenas “cegos”. A forma não qualificada preserva a ironia joanina e evita inserir uma explicação interpretativa no texto.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. “Por acaso” reproduz de modo idiomático a pergunta incrédula sem eliminar a expectativa negativa do original; a nota conserva essa nuance gramatical.
