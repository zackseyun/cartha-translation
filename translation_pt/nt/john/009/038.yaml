  text: ὁ δὲ ἔφη· Πιστεύω, κύριε· καὶ προσεκύνησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/038.yaml
  text: And he said[a], “I believe[b], Lord,” and he worshiped him.
translation:
  language: pt
  text: 'E ele disse: “Eu creio, Senhor[a]”, e o adorou[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “senhor”, como forma respeitosa de tratamento. O grego κύριε admite esse sentido; aqui se prefere “Senhor” porque o contexto culmina em confissão de fé e adoração.
    reason: alternative_reading
  - marker: b
    text: Ou “prostrou-se diante dele” ou “prestou-lhe homenagem”. O verbo grego pode indicar prostração ou homenagem; aqui é traduzido por “adorou” em vista do contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Então ele
  rationale: O artigo funciona como pronome e retoma o homem curado. A partícula δέ dá continuidade à narrativa; “então” produz uma transição natural em português sem introduzir um contraste forte.
- source_word: ἔφη
  choice: disse
  rationale: O aoristo de φημί introduz a fala de modo simples; “disse” é natural, preciso e digno.
- source_word: Πιστεύω
  choice: Eu creio
  rationale: Preserva a ligação verbal com o tema joanino de crer e responde diretamente à revelação de Jesus, sem transformar o verbo em paráfrase.
- source_word: κύριε
  choice: Senhor
  rationale: O contexto culmina na confissão de fé e na adoração a Jesus, favorecendo a forma cristologicamente mais forte “Senhor”; a possibilidade de uma forma respeitosa de tratamento é mantida em nota.
- source_word: προσεκύνησεν
  choice: adorou
  rationale: Embora o verbo possa descrever prostração ou homenagem, neste contexto — dirigido a Jesus após a confissão de fé — “adorou” expressa melhor sua força provável.
- source_word: αὐτῷ
  choice: o
  rationale: O dativo indica a pessoa a quem se dirige a ação. Com “adorar”, o pronome objeto direto “o” é a forma mais natural em português.
theological_decisions:
- issue: Se κύριε é apenas uma forma respeitosa de tratamento ou o título “Senhor”
  choice: Senhor
  alternative: senhor, como forma respeitosa de tratamento
  rationale: A autodeclaração de Jesus no contexto imediato, seguida pela fé e pela προσκύνησις do homem, favorece “Senhor”. A ambiguidade lexical genuína, porém, permanece registrada em nota.
- issue: Se προσεκύνησεν significa explicitamente “adorou” ou descreve prostração/homenagem
  choice: adorou
  alternative: prostrou-se diante dele; prestou-lhe homenagem
  rationale: A sequência narrativa — revelação, confissão de fé e ação dirigida a Jesus — sustenta “adorou”, sem apagar as alternativas lexicalmente possíveis.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Eu creio” mantém o tom confessional e o vocabulário característico de João. O ponto e vírgula separa com clareza a confissão da ação subsequente.
