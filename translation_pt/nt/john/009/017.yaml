  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγουσιν ⸀οὖν τῷ τυφλῷ πάλιν· ⸂Τί σὺ⸃ λέγεις περὶ αὐτοῦ, ὅτι ἠνέῳξέν σου τοὺς ὀφθαλμούς; ὁ δὲ εἶπεν ὅτι Προφήτης ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/017.yaml
  text: So they said again to the blind man[a], “What do you say about him, since he opened your eyes?” And he said[c][b], “He is a prophet.”
translation:
  language: pt
  text: 'Então perguntaram novamente ao cego: “E você, o que diz a respeito dele, já que ele abriu os seus olhos?” Ele respondeu: “É profeta.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “É um profeta”. O grego não usa artigo e também pode admitir uma leitura de caráter mais titular: “É Profeta”.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Assinala a continuação narrativa e lógica da conversa anterior de modo natural em português.
- source_word: τῷ τυφλῷ
  choice: ao cego
  rationale: O adjetivo substantivado identifica o homem pela condição mencionada no relato, sem acrescentar uma perspectiva temporal ausente da oração.
- source_word: πάλιν
  choice: novamente
  rationale: Preserva a ideia de que o interrogatório ou a pergunta prossegue de forma repetida.
- source_word: Τί σὺ λέγεις
  choice: E você, o que diz
  rationale: A colocação de “você” em destaque comunica a ênfase do pronome grego explícito σὺ com naturalidade em português.
- source_word: περὶ αὐτοῦ
  choice: a respeito dele
  rationale: Equivalente idiomático e claro de περί com genitivo neste contexto.
- source_word: ὅτι
  choice: já que
  rationale: 'Expressa a leitura causal mais provável: a abertura dos olhos serve de fundamento para a pergunta. A conjunção também pode ser vertida por “porque”.'
- source_word: ἠνέῳξέν σου τοὺς ὀφθαλμούς
  choice: ele abriu os seus olhos
  rationale: O pretérito perfeito traduz naturalmente o aoristo no fluxo narrativo, e a expressão mantém a imagem explícita do grego.
- source_word: Προφήτης ἐστίν
  choice: É profeta
  rationale: Em português, o predicativo sem artigo é natural e mantém alguma abertura entre uma classificação qualitativa (“é profeta”) e a possível compreensão indefinida (“é um profeta”), sem impor força titular.
theological_decisions:
- issue: Se Προφήτης deve ser entendido como título ou como substantivo comum
  choice: É profeta
  alternative: É um profeta; Ele é o Profeta
  rationale: A forma sem artigo em português é idiomática e preserva melhor a concisão e certa ambiguidade qualitativa do grego. O contexto favorece a identificação de Jesus como profeta, mas não exige que se imponha o título específico “o Profeta”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ênfase de σὺ foi incorporada no corpo do texto por meio de “E você”, evitando uma nota desnecessária. O pronome sujeito foi omitido em “É profeta” por ser natural em português e porque o referente está claro.
