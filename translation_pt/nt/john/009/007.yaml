  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ὕπαγε νίψαι εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ (ὃ ἑρμηνεύεται Ἀπεσταλμένος). ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/007.yaml
  text: And he said to him[a], “Go, wash in the pool of Siloam” (which is translated “Sent”). So he went and washed, and came back seeing.
translation:
  language: pt
  text: 'E disse-lhe: “Vá e lave-se no tanque de Siloé” (que se traduz por “Enviado”[a]). Então ele foi, lavou-se e voltou enxergando.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que significa ‘Enviado’”.'
    reason: Alternativa lexical para ἑρμηνεύεται, que pode ser expresso como “traduzir” ou, de modo mais idiomático, “significar”.
lexical_decisions:
- source_word: Ὕπαγε
  choice: Vá
  rationale: Imperativo direto de movimento; “Vá” é natural, claro e preserva a sequência da ordem.
- source_word: νίψαι / ἐνίψατο
  choice: lave-se / lavou-se
  rationale: νίπτω designa lavar, muitas vezes uma parte do corpo. A forma reflexiva é idiomática em português neste contexto, sem sugerir um banho completo.
- source_word: εἰς τὴν κολυμβήθραν
  choice: no tanque
  rationale: κολυμβήθρα refere-se a um tanque ou reservatório. Com o verbo “lavar-se”, “no tanque” é a construção portuguesa mais natural.
- source_word: Σιλωάμ
  choice: Siloé
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do lugar.
- source_word: ὃ ἑρμηνεύεται Ἀπεσταλμένος
  choice: nome que se traduz por “Enviado”
  rationale: Preserva a explicação explícita do nome e traduz o particípio passivo Ἀπεσταλμένος sem desenvolver além do texto seu possível simbolismo.
- source_word: οὖν
  choice: Então
  rationale: Marca aqui a consequência narrativa de modo fluente, sem a formalidade excessiva de “portanto”.
- source_word: ἀπῆλθεν
  choice: ele foi
  rationale: Equivalente simples e idiomático do aoristo narrativo de afastamento.
- source_word: ἦλθεν βλέπων
  choice: voltou enxergando
  rationale: Expressa de forma vívida o resultado da cura e a volta do homem, mantendo a construção participial sem uma paráfrase explicativa extensa.
theological_decisions:
- issue: Explicação do nome Siloé e possível simbolismo joanino
  choice: Manter no texto a explicação parentética “nome que se traduz por ‘Enviado’”.
  alternative: Explicitar uma ligação simbólica entre o nome e Jesus como aquele que foi enviado pelo Pai.
  rationale: O próprio grego fornece a glosa, portanto ela pertence ao texto principal; contudo, a tradução não deve tornar explícita uma interpretação teológica que o versículo apenas pode sugerir.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Tanque de Siloé” conserva a designação bíblica reconhecível; “voltou enxergando” comunica naturalmente a recuperação da visão.
