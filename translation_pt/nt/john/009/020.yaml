lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e lógica da interrogação anterior de modo natural em português, sem tornar a relação excessivamente formal.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: os pais dele
  rationale: O plural γονεῖς designa conjuntamente o pai e a mãe; esta é a forma corrente e clara em português.
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν
  choice: responderam e disseram
  rationale: Mantém os dois verbos da expressão joanina, preservando a textura discursiva do grego, embora haja alguma redundância natural.
- source_word: Οἴδαμεν
  choice: Sabemos
  rationale: Expressa diretamente o conhecimento ou a certeza afirmada pelos pais.
- source_word: οὗτός ἐστιν ὁ υἱὸς ἡμῶν
  choice: este é o nosso filho
  rationale: Preserva a identificação enfática e permanece idiomático em português.
- source_word: τυφλὸς ἐγεννήθη
  choice: nasceu cego
  rationale: Reproduz de forma direta, concisa e natural tanto o nascimento quanto a condição presente desde esse momento.
