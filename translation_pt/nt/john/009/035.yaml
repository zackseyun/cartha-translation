reference: John 9:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Ἤκουσεν Ἰησοῦς ὅτι ἐξέβαλον αὐτὸν ἔξω, καὶ εὑρὼν αὐτὸν ⸀εἶπεν· Σὺ πιστεύεις εἰς τὸν υἱὸν τοῦ ⸀ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/035.yaml
  text: Jesus heard that they had thrown him out[a], and when he found him, he said, “Do you believe in the Son of Man?”
translation:
  language: pt
  text: 'Jesus soube que o haviam expulsado e, ao encontrá-lo, perguntou: “Você crê no Filho do Homem?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “Filho de Deus” em vez de “Filho do Homem”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: o haviam expulsado
  rationale: A combinação enfática de ἐκβάλλω com ἔξω indica expulsão. “Haviam expulsado” comunica com naturalidade tanto a ação quanto a exclusão social no contexto.
- source_word: εὑρὼν αὐτόν
  choice: ao encontrá-lo
  rationale: O particípio aoristo tem valor temporal e indica a ação que antecede a pergunta; “ao encontrá-lo” preserva a sequência de modo conciso e natural.
- source_word: Σὺ πιστεύεις
  choice: Você crê
  rationale: πιστεύω significa aqui crer com confiança pessoal. “Você crê” mantém a interpelação direta e permite que o pronome explícito Σὺ receba alguma ênfase sem tornar a frase artificial.
- source_word: εἰς
  choice: 'no'
  rationale: Com πιστεύω, εἰς indica confiança dirigida a uma pessoa; em português, “crer em” é o equivalente idiomático adequado.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: Filho do Homem
  rationale: É a forma tradicional, reconhecível e intertextualmente adequada do título, preservando suas ressonâncias em Daniel 7 e no Evangelho de João.
theological_decisions:
- issue: Leitura do título cristológico na pergunta
  choice: Filho do Homem
  alternative: Filho de Deus
  rationale: O texto do SBLGNT traz ἀνθρώπου (“Homem”), adotado no texto principal. A variante “Filho de Deus” é teologicamente significativa e historicamente influente, por isso é registrada em nota sem substituir a leitura principal.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Você” torna a pergunta direta e natural; “crê” preserva o registro bíblico sem soar excessivamente arcaico. O marcador da nota foi colocado imediatamente após o título ao qual a variante se refere.
