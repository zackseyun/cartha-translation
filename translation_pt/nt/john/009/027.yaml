  text: ἀπεκρίθη αὐτοῖς· Εἶπον ὑμῖν ἤδη καὶ οὐκ ἠκούσατε· τί πάλιν θέλετε ἀκούειν; μὴ καὶ ὑμεῖς θέλετε αὐτοῦ μαθηταὶ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/027.yaml
  text: He answered them[a], “I already told you, and you did not listen. Why do you want to hear it again? You do not also want to become his disciples[b], do you?”
translation:
  language: pt
  text: 'Ele lhes respondeu: “Eu já lhes disse, mas vocês não escutaram.[a] Por que querem ouvir de novo? Vocês também não querem se tornar discípulos dele, querem?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas vocês não ouviram”. O verbo grego pode significar tanto “ouvir” como “escutar”; neste contexto, provavelmente indica que eles não deram atenção ao que foi dito.'
    reason: lexical_alternative
  - marker: b
    text: 'A pergunta grega é formulada de modo a esperar uma resposta negativa. Ou: “Certamente vocês também não querem se tornar discípulos dele?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: Ele lhes respondeu
  rationale: Mantém a fórmula narrativa grega em português natural e claro.
- source_word: ἤδη
  choice: já
  rationale: Expressa de modo direto que a informação havia sido dada anteriormente.
- source_word: οὐκ ἠκούσατε
  choice: vocês não escutaram
  rationale: 'No contexto, ἀκούω indica mais que percepção auditiva: eles não acolheram nem deram atenção ao que foi dito. “Escutaram” preserva também a ligação lexical com a ocorrência seguinte do verbo.'
- source_word: τί πάλιν θέλετε ἀκούειν;
  choice: Por que querem ouvir de novo?
  rationale: Aqui τί funciona naturalmente como pergunta de motivo, com tom de impaciência. O objeto permanece implícito, como no grego, e é facilmente recuperado do contexto.
- source_word: μὴ καὶ ὑμεῖς
  choice: Será que vocês também querem...?
  rationale: A construção portuguesa transmite uma pergunta retórica marcada por surpresa e inclinação para uma resposta negativa, sem torná-la artificial.
- source_word: αὐτοῦ μαθηταὶ
  choice: discípulos dele
  rationale: É uma construção possessiva natural que mantém αὐτοῦ em posição enfática no fim da pergunta.
- source_word: γενέσθαι
  choice: se tornar
  rationale: Preserva o sentido ingressivo de passar a ser discípulo, em vez de simplesmente já o ser.
theological_decisions:
- issue: Força retórica da pergunta final
  choice: “Será que vocês também querem se tornar discípulos dele?”
  alternative: “Vocês também não querem se tornar discípulos dele, querem?”
  rationale: A partícula μή sugere que se espera uma resposta negativa. A formulação escolhida conserva essa expectativa e o tom irônico ou provocador, mas evita uma pergunta-tag pouco natural no português amplamente internacional.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural e sintaxe natural tanto para leitores brasileiros quanto para um público lusófono amplo. A repetição semânttica entre “escutaram” e “ouvir” reflete a repetição de ἀκούω no original; a variação verbal evita rigidez sem apagar a conexão.
