id: JHN.9.28
reference: John 9:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἐλοιδόρησαν αὐτὸν καὶ εἶπον· Σὺ ⸂μαθητὴς εἶ⸃ ἐκείνου, ἡμεῖς δὲ τοῦ Μωϋσέως ἐσμὲν μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/028.yaml
  text: They reviled him and said[a], “You are that man's disciple, but we are disciples of Moses.”
translation:
  language: pt
  text: 'Eles o insultaram e disseram: “Você é discípulo daquele homem[a], mas nós somos discípulos de Moisés.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você é discípulo dele.” O grego diz literalmente “daquele”, expressão que pode ter aqui um tom de desprezo ou distanciamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλοιδόρησαν
  choice: o insultaram
  rationale: O verbo λοιδορέω indica dirigir palavras ofensivas ou injuriosas a alguém. “O insultaram” comunica com naturalidade a agressão verbal e o desprezo do contexto; “injuriaram” seria possível, mas é menos corrente para muitos leitores.
- source_word: αὐτόν
  choice: o
  rationale: Pronome objeto que retoma o homem anteriormente curado.
- source_word: καὶ εἶπον
  choice: e disseram
  rationale: Reproduz de modo direto a coordenação narrativa do grego.
- source_word: Σύ
  choice: Você
  rationale: 'O pronome expresso e colocado no início mantém a ênfase contrastiva: “você”, em oposição a “nós”.'
- source_word: μαθητής / μαθηταί
  choice: discípulo / discípulos
  rationale: “Discípulo” preserva tanto a relação de aprendizado quanto a ideia de adesão pessoal, e a repetição mantém o contraste retórico entre Jesus e Moisés.
- source_word: ἐκείνου
  choice: daquele homem
  rationale: O demonstrativo cria distância em relação a Jesus e, neste contexto hostil, pode soar depreciativo. “Daquele homem” conserva essa distância sem acrescentar um insulto que não está explicitamente no texto.
- source_word: ἡμεῖς δὲ
  choice: mas nós
  rationale: “Mas” expressa o contraste marcado por δέ, e o pronome explícito preserva a ênfase de ἡμεῖς.
- source_word: τοῦ Μωϋσέως ἐσμὲν μαθηταί
  choice: somos discípulos de Moisés
  rationale: Formulação portuguesa natural que conserva a relação expressa pelo genitivo e o paralelismo com “discípulo daquele homem”.
theological_decisions:
- issue: Tom de ἐκείνου ao se referir a Jesus
  choice: “daquele homem”, preservando o distanciamento hostil dos falantes
  alternative: “dele”, com tom mais neutro
  rationale: O demonstrativo grego pode ser vertido de maneira neutra, mas o ato de insultar o homem e o contraste polêmico com Moisés favorecem uma formulação que deixe perceptível o desprezo sem exagerá-lo.
- issue: Sentido e repetição de μαθητής
  choice: “discípulo” nas duas ocorrências
  alternative: “seguidor” ou “aluno”
  rationale: “Discípulo” conserva a combinação de aprendizado e lealdade pessoal, além de manter a simetria central da acusação e da resposta dos interlocutores.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” torna o contraste explícito e natural; “o insultaram” evita tanto a atenuação quanto o tom excessivamente arcaico de alternativas como “o injuriaram”.
