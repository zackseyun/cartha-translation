lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a coordenação simples com o contexto anterior sem acrescentar uma relação interpretativa mais específica.
- source_word: εἶπαν αὐτῷ
  choice: disseram a ele
  rationale: Mantém o sentido lexical de λέγω e expressa claramente o objeto indireto, embora a fala introduzida seja uma pergunta.
- source_word: Ποῦ ἐστιν ἐκεῖνος
  choice: Onde está aquele homem?
  rationale: “Aquele homem” comunica de modo natural o valor demonstrativo e substantivado de ἐκεῖνος, sem reduzi-lo ao simples pronome “ele”.
- source_word: λέγει
  choice: Ele respondeu
  rationale: No diálogo em português, “respondeu” expressa naturalmente a função discursiva do presente histórico λέγει. O pretérito mantém a narração corrente e não altera o conteúdo.
- source_word: Οὐκ οἶδα
  choice: Não sei
  rationale: Forma direta, natural e digna em português, com o sujeito de primeira pessoa claramente indicado pela flexão verbal.
