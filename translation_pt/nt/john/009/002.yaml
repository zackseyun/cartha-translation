id: JHN.9.2
reference: John 9:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν οἱ μαθηταὶ αὐτοῦ λέγοντες· Ῥαββί, τίς ἥμαρτεν, οὗτος ἢ οἱ γονεῖς αὐτοῦ, ἵνα τυφλὸς γεννηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/002.yaml
  text: And his disciples asked him[a], saying, “Rabbi, who sinned, this man or his parents, that he should be born blind?”
translation:
  language: pt
  text: 'E os discípulos dele lhe perguntaram: “Rabi, quem pecou: este homem ou os pais dele, para que ele nascesse cego[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de modo que ele nasceu cego”. A construção grega pode expressar a relação pressuposta de finalidade ou resultado presente na pergunta dos discípulos.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: perguntaram
  rationale: O aoristo de ἐρωτάω introduz uma pergunta direta; “perguntaram” é natural e preciso em português.
- source_word: μαθηταὶ
  choice: discípulos
  rationale: Termo consagrado e adequado para a relação entre seguidores e mestre nos Evangelhos.
- source_word: λέγοντες
  choice: 'perguntaram:'
  rationale: A formulação portuguesa integra o particípio à oração principal, evitando o redundante “perguntaram, dizendo” sem perder conteúdo.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Preserva a forma judaica de tratamento e o contexto histórico, sendo compreensível em português.
- source_word: τίς ἥμαρτεν
  choice: quem pecou
  rationale: Equivalência direta, natural e sem ampliar o sentido do aoristo.
- source_word: οὗτος
  choice: este homem
  rationale: Explicita o referente humano de modo idiomático, como exige o contexto.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: os pais dele
  rationale: “Pais” é o equivalente normal de γονεῖς; “dele” mantém clara a referência ao homem sem excessiva formalidade.
- source_word: ἵνα ... γεννηθῇ
  choice: para que ele nascesse
  rationale: Preserva a construção de finalidade ou resultado pressuposta na pergunta dos discípulos, sem convertê-la em afirmação do narrador.
- source_word: τυφλὸς
  choice: cego
  rationale: Equivalente direto do adjetivo predicativo que descreve a condição desde o nascimento.
theological_decisions:
- issue: Nuance causal ou final de ἵνα na relação pressuposta entre pecado e cegueira congênita
  choice: “para que ele nascesse cego”
  alternative: “de modo que ele nasceu cego” ou “para ele ter nascido cego”
  rationale: A tradução conserva a lógica pressuposta pelos discípulos, mas não a apresenta como doutrina endossada pelo narrador. A nota registra que a construção grega admite nuance de finalidade ou resultado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da pergunta foi mantida próxima do grego, enquanto “perguntaram, dizendo” foi vertido de modo idiomático. O marcador [a] aparece imediatamente após a expressão a que se refere.
