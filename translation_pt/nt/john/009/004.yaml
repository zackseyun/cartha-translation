  text: ⸀ἡμᾶς δεῖ ἐργάζεσθαι τὰ ἔργα τοῦ πέμψαντός με ἕως ἡμέρα ἐστίν· ἔρχεται νὺξ ὅτε οὐδεὶς δύναται ἐργάζεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/004.yaml
  text: We must do the works of the one who sent me while it is day; night is coming[a], when no one can work.
translation:
  language: pt
  text: Precisamos realizar as obras daquele que me enviou enquanto é dia; vem a noite[a], quando ninguém pode trabalhar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “Preciso realizar as obras daquele que me enviou”.'
    reason: textual_variant
lexical_decisions:
- source_word: ἡμᾶς δεῖ
  choice: Precisamos
  rationale: O acusativo plural ἡμᾶς com δεῖ expressa necessidade ou obrigação coletiva. “Precisamos” é natural em português e mantém a primeira pessoa do plural do texto da SBLGNT.
- source_word: ἐργάζεσθαι τὰ ἔργα
  choice: realizar as obras
  rationale: Evita a repetição pouco natural “trabalhar as obras”, preservando o substantivo “obras” e sua importância no vocabulário joanino.
- source_word: τοῦ πέμψαντός με
  choice: daquele que me enviou
  rationale: Traduz naturalmente o particípio substantivado sem explicitar além do texto quem é o agente.
- source_word: ἕως ἡμέρα ἐστίν
  choice: enquanto é dia
  rationale: Expressa o período disponível para agir e mantém o contraste temporal com a noite que vem.
- source_word: ἔρχεται νὺξ
  choice: vem a noite
  rationale: Mantém a vivacidade do presente grego e soa natural e solene em português.
- source_word: ὅτε οὐδεὶς δύναται ἐργάζεσθαι
  choice: quando ninguém pode trabalhar
  rationale: Reproduz de modo claro a oração temporal e a ideia geral de capacidade para trabalhar; “ninguém” preserva a referência não marcada por gênero.
theological_decisions:
- issue: 'Variante textual no início do versículo: ἡμᾶς (“nós”) ou ἐμέ (“eu”)'
  choice: Precisamos realizar as obras daquele que me enviou
  alternative: Preciso realizar as obras daquele que me enviou
  rationale: A tradução segue a leitura ἡμᾶς da SBLGNT fornecida, entendida de forma idiomática como “precisamos”. A leitura singular, amplamente atestada na tradição manuscrita, é registrada em nota para transparência.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Realizar as obras” evita uma construção cognata artificial; “vem a noite” conserva a força concisa da imagem.
