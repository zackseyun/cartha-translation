id: JHN.9.30
reference: John 9:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς· Ἐν ⸂τούτῳ γὰρ τὸ⸃ θαυμαστόν ἐστιν ὅτι ὑμεῖς οὐκ οἴδατε πόθεν ἐστίν, καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/030.yaml
  text: 'The man answered and said to them[a], “This is the remarkable thing: you do not know where he is from[b], and yet he opened my eyes.”'
translation:
  language: pt
  text: 'O homem lhes respondeu: “É justamente isto que é surpreendente[a]: vocês não sabem de onde ele é[b] e, ainda assim, ele abriu os meus olhos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “admirável”.
    reason: lexical_alternative
  - marker: b
    text: Ou “de onde ele vem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς
  choice: O homem lhes respondeu
  rationale: A fórmula narrativa grega reúne ‘respondeu’ e ‘disse’. Em português atual, ‘lhes respondeu’ comunica naturalmente o ato de responder e seus destinatários, sem a redundância pouco idiomática de ‘respondeu e disse’.
- source_word: Ἐν τούτῳ γὰρ τὸ θαυμαστόν ἐστιν
  choice: É justamente isto que é surpreendente
  rationale: A construção destaca como surpreendente a situação que será explicada em seguida. ‘Justamente isto’ preserva a ênfase demonstrativa e o tom irônico; ‘surpreendente’ expressa θαυμαστόν em linguagem corrente e digna. A força explicativa de γάρ fica comunicada pela estrutura e pelos dois-pontos.
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: vocês não sabem
  rationale: O pronome explícito ὑμεῖς recebe expressão direta em português, preservando o contraste enfático com os interlocutores. οἴδατε indica falta de conhecimento, não apenas de compreensão.
- source_word: πόθεν ἐστίν
  choice: de onde ele é
  rationale: Expressão portuguesa natural para a origem de uma pessoa, mantendo aberta a dimensão precisa da pergunta sobre a procedência de Jesus.
- source_word: καὶ
  choice: e, ainda assim
  rationale: 'Embora καί signifique formalmente ‘e’, neste contexto liga fatos em forte contraste irônico: eles alegam desconhecer a origem de Jesus, apesar de ele ter realizado a cura. ‘Ainda assim’ torna essa relação discursiva clara sem alterar os fatos narrados.'
- source_word: ἤνοιξέν μου τοὺς ὀφθαλμούς
  choice: ele abriu os meus olhos
  rationale: Tradução literal e idiomática que, no contexto imediato, descreve a cura física. Também permite que a ressonância joanina ligada à visão e à cegueira surja do contexto sem ser explicitada artificialmente.
theological_decisions:
- issue: Possível ressonância metafórica de ‘abriu os meus olhos’ no contexto joanino
  choice: Manter a expressão concreta da cura sem explicitar iluminação espiritual
  alternative: Traduzir de modo a destacar diretamente uma transformação ou iluminação espiritual
  rationale: O referente imediato é a restauração física da visão do homem. A linguagem também pode ressoar com o tema joanino de visão e cegueira espiritual, mas a tradução deve preservar essa tensão e permitir que ela emerja da narrativa.
- issue: Sentido da origem de Jesus em πόθεν ἐστίν
  choice: Preservar a formulação aberta ‘de onde ele é’
  alternative: Explicitar como origem geográfica, procedência divina ou autoridade religiosa
  rationale: A fala explora ironicamente o desconhecimento alegado pelos interlocutores, enquanto o Evangelho desenvolve em vários níveis a questão da origem de Jesus. A tradução não deve resolver aqui essa ambiguidade temática.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. O uso de ‘vocês’ torna explícito o pronome plural enfático do grego. A formulação preserva o tom firme e irônico do homem curado sem recorrer a linguagem excessivamente coloquial.
