id: JHN.9.6
reference: John 9:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ταῦτα εἰπὼν ἔπτυσεν χαμαὶ καὶ ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος, καὶ ⸀ἐπέχρισεν ⸀αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ⸀ὀφθαλμούς,
base_translation:
  language: en
  yaml_path: translation/nt/john/009/006.yaml
  text: After saying these things[a], he spit on the ground and made mud from the saliva, and he spread the mud on his eyes,
translation:
  language: pt
  text: Depois de dizer isso, ele cuspiu no chão, fez lama com a saliva e passou a lama nos olhos do homem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ungiu os olhos do homem com a lama”. O verbo grego pode significar “ungir” ou “passar sobre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰπὼν
  choice: Depois de dizer isso
  rationale: O particípio aoristo indica uma ação anterior às ações principais. A formulação é natural em português moderno e conserva claramente a sequência temporal.
- source_word: ἔπτυσεν χαμαί
  choice: cuspiu no chão
  rationale: χαμαί indica movimento ou posição no chão; a expressão portuguesa comunica de modo direto a ação concreta.
- source_word: ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος
  choice: fez lama com a saliva
  rationale: πηλός pode significar barro, argila ou lama. Neste contexto, terra umedecida com saliva é comunicada naturalmente por “lama”; “com a saliva” expressa de modo idiomático a matéria empregada.
- source_word: ἐπέχρισεν
  choice: passou
  rationale: O verbo significa aplicar, passar ou untar algo sobre uma superfície, podendo também ser traduzido por “ungir”. “Passou” descreve com naturalidade a ação física sem impor uma conotação cerimonial.
- source_word: αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ὀφθαλμούς
  choice: passou a lama nos olhos do homem
  rationale: A construção indica que Jesus aplicou a lama aos olhos daquele homem. Explicitar “do homem” evita em português a possível ambiguidade de “seus olhos”, sem acrescentar uma identificação ausente do contexto.
theological_decisions:
- issue: Possível nuance cerimonial de ἐπέχρισεν
  choice: passou a lama nos olhos do homem
  alternative: ungiu os olhos do homem com a lama
  rationale: Embora “ungir” seja lexicalmente possível, o contexto descreve antes de tudo a aplicação física de lama. O texto principal evita introduzir uma conotação ritual não afirmada pelo versículo, enquanto a nota conserva a alternativa legítima.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação evita tanto o arcaísmo “saliva”/“barro” em construções excessivamente literais quanto uma interpretação cerimonial indevida; “saliva” permanece por ser corrente, precisa e natural.
