id: JHN.9.11
reference: John 9:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ἐκεῖνος· ⸂Ὁ ἄνθρωπος ὁ⸃ λεγόμενος Ἰησοῦς πηλὸν ἐποίησεν καὶ ἐπέχρισέν μου τοὺς ὀφθαλμοὺς καὶ εἶπέν μοι ⸀ὅτι Ὕπαγε εἰς ⸀τὸν Σιλωὰμ καὶ νίψαι· ἀπελθὼν ⸀οὖν καὶ νιψάμενος ἀνέβλεψα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/011.yaml
  text: He answered[a], “The man called Jesus made mud and spread it on my eyes, and he told me, ‘Go to Siloam and wash.’ So I went away and washed[c][b], and I received my sight.”
translation:
  language: pt
  text: 'Ele respondeu: “O homem chamado Jesus fez lama[a], passou-a nos meus olhos[b] e me disse: ‘Vá a Siloé e lave-se.’ Então fui, lavei-me e passei a enxergar[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “barro”. A palavra grega pode designar lama ou barro.
    reason: lexical_alternative
  - marker: b
    text: Ou “ungiu os meus olhos”. O verbo grego pode significar passar ou espalhar algo sobre uma superfície; “ungir” é uma tradução mais formal.
    reason: lexical_alternative
  - marker: c
    text: Ou “recuperei a visão”. Neste contexto, o verbo indica receber ou recuperar a capacidade de ver.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος
  choice: Ele respondeu
  rationale: Forma narrativa natural em português; o pronome explícito ἐκεῖνος é adequadamente representado por “ele” no contexto.
- source_word: Ὁ ἄνθρωπος ὁ λεγόμενος Ἰησοῦς
  choice: O homem chamado Jesus
  rationale: Preserva a identificação simples e ainda não confessional feita pelo homem curado, sem acrescentar um título exaltado.
- source_word: πηλὸν ἐποίησεν
  choice: fez lama
  rationale: “Lama” é natural no contexto imediato da mistura feita por Jesus; “barro” continua sendo uma alternativa lexical possível.
- source_word: ἐπέχρισέν μου τοὺς ὀφθαλμούς
  choice: passou-a nos meus olhos
  rationale: Expressa claramente a aplicação física da lama e evita as possíveis conotações rituais de “ungiu”.
- source_word: εἶπέν μοι ὅτι
  choice: me disse
  rationale: Introduz de modo natural a fala direta que contém a ordem.
- source_word: Ὕπαγε εἰς τὸν Σιλωὰμ
  choice: Vá a Siloé
  rationale: Traduz diretamente a ordem de movimento e mantém apenas o topônimo, pois o grego deste versículo não repete “tanque”.
- source_word: νίψαι
  choice: lave-se
  rationale: O imperativo médio é naturalmente expresso em português pela forma reflexiva.
- source_word: ἀπελθὼν οὖν καὶ νιψάμενος
  choice: Então fui, lavei-me
  rationale: “Então” comunica a consequência marcada por οὖν; a sequência verbal é concisa e idiomática em português.
- source_word: ἀνέβλεψα
  choice: passei a enxergar
  rationale: No contexto da cura de alguém cego, o verbo indica a aquisição da visão, não simplesmente olhar para cima.
theological_decisions:
- issue: Caracterização de Jesus pelo homem curado
  choice: O homem chamado Jesus
  alternative: O homem que se chama Jesus
  rationale: 'Mantém o estágio de compreensão do falante dentro da narrativa: ele identifica Jesus simplesmente como homem, sem antecipar uma confissão cristológica posterior.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Empregou-se “Siloé”, forma tradicional e reconhecível do topônimo em português. A fala usa imperativo padrão (“Vá”, “lave-se”) e evita tanto solenidade arcaizante quanto coloquialismo excessivo.
