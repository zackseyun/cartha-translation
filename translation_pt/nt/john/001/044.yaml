base_translation:
  language: en
  yaml_path: translation/nt/john/001/044.yaml
  text: Philip was from Bethsaida[a], from the town of Andrew and Peter.
translation:
  language: pt
  text: Filipe era de Betsaida, da cidade de André e Pedro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a cidade de onde André e Pedro também eram.
    reason: Esclarece a relação de procedência implícita nos genitivos «de André e Pedro», sem impor uma noção de posse literal.
lexical_decisions:
- source_word: ἦν
  choice: era
  rationale: O imperfeito de εἰμί descreve aqui uma condição ou procedência no passado; “era” é direto e natural em português.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: δέ é um conectivo discursivo leve. Neste contexto, a continuidade narrativa já fica clara em português, e traduzi-lo por “ora”, “então” ou “mas” acrescentaria uma nuance temporal ou contrastiva forte demais.
- source_word: Φίλιππος
  choice: Filipe
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἀπὸ Βηθσαϊδά
  choice: de Betsaida
  rationale: ἀπό indica origem ou procedência; “de Betsaida” é a formulação idiomática em português.
- source_word: ἐκ τῆς πόλεως
  choice: a cidade
  rationale: πόλις pode designar cidade ou povoado. A construção foi apresentada como aposto natural em português, enquanto a nota registra mais literalmente a preposição repetida do grego.
- source_word: Ἀνδρέου καὶ Πέτρου
  choice: de André e Pedro
  rationale: Os genitivos associam André e Pedro à cidade, indicando que também eram provenientes dela, sem introduzir uma ideia de posse literal.
