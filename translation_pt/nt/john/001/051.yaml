id: JHN.1.51
reference: John 1:51
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἀμὴν ἀμὴν λέγω ⸀ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/051.yaml
  text: And he said to him[a], “Truly, truly, I say to you[b], you will see heaven opened and the angels of God ascending and descending on the Son of Man.”
translation:
  language: pt
  text: 'E lhe disse: “Em verdade, em verdade lhes digo[a]: vocês verão o céu aberto e os anjos de Deus subindo e descendo sobre o Filho do Homem[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Embora Jesus esteja falando com Natanael, “lhes” e “vocês” estão no plural no grego.
    reason: lexical_alternative
  - marker: b
    text: A imagem evoca o sonho de Jacó em Gênesis 28:12, agora centrada no Filho do Homem.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Preserva a fórmula solene e enfática, com sua repetição, em português claro e corrente.
- source_word: αὐτῷ / ὑμῖν
  choice: lhe / lhes, vocês
  rationale: Distingue a referência singular a Natanael na introdução da fala e o plural empregado por Jesus no restante da declaração.
- source_word: ὄψεσθε
  choice: vocês verão
  rationale: Expressa de modo natural o futuro e torna explícito o número plural do verbo grego.
- source_word: τὸν οὐρανὸν ἀνεῳγότα
  choice: o céu aberto
  rationale: 'Comunica o estado resultante indicado pelo particípio perfeito: o céu foi aberto e permanece aberto na visão.'
- source_word: ἀγγέλους
  choice: anjos
  rationale: O contexto divino e a evocação de Gênesis 28 indicam seres celestiais, não mensageiros humanos.
- source_word: ἀναβαίνοντας καὶ καταβαίνοντας
  choice: subindo e descendo
  rationale: Mantém o par direcional e a ligação verbal com a visão de Jacó em linguagem portuguesa natural.
- source_word: ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: sobre o Filho do Homem
  rationale: Preserva a relação espacial deliberadamente condensada e potencialmente ambígua da imagem, sem explicá-la no corpo do texto.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Conserva a autodesignação de Jesus e suas ressonâncias bíblicas e teológicas reconhecidas.
theological_decisions:
- issue: Mudança do destinatário singular para o plural
  choice: Tornar a mudança visível por meio de “lhe disse” e “lhes digo… vocês verão”, acrescentando uma nota breve.
  alternative: Manter formas menos explícitas quanto ao número ou dirigir toda a fala apenas a Natanael.
  rationale: O grego passa intencionalmente de αὐτῷ, singular, para ὑμῖν e ὄψεσθε, plurais, ampliando o alcance da declaração sem definir por si só todo o grupo incluído.
- issue: Evocação da visão de Jacó em Gênesis 28:12
  choice: Conservar a imagem no texto e identificar a correspondência em nota.
  alternative: Inserir no texto uma explicação de que Jesus substitui a escada ou é o lugar da revelação divina.
  rationale: A alusão é forte, mas o texto não explicita como cada elemento deve ser interpretado; uma paráfrase resolveria indevidamente essa tensão.
- issue: Relação dos anjos com o Filho do Homem expressa por ἐπί
  choice: Traduzir por “sobre”, sem desenvolver a geometria da cena.
  alternative: “Acima do”, “em direção ao” ou uma paráfrase que apresente o Filho do Homem como escada.
  rationale: “Sobre” preserva a imagem e sua ambiguidade genuína, evitando impor uma reconstrução espacial ou teológica específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Vocês” explicita naturalmente o plural; “Em verdade, em verdade” conserva a solenidade sem recorrer ao pouco transparente “Amém, amém”. Os marcadores aparecem junto aos elementos que as notas esclarecem.
