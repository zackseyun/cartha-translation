lexical_decisions:
- source_word: ταῦτα
  choice: Essas coisas
  rationale: Mantém o plural do demonstrativo grego e retoma naturalmente os acontecimentos e a conversa anteriores.
- source_word: ἐν Βηθανίᾳ
  choice: em Betânia
  rationale: Traduz diretamente o uso locativo de ἐν com o nome do lugar.
- source_word: ἐγένετο
  choice: aconteceram
  rationale: Expressa de modo corrente a ocorrência dos fatos e concorda em número com «essas coisas».
- source_word: πέραν τοῦ Ἰορδάνου
  choice: do outro lado do Jordão
  rationale: Comunica com clareza a localização na margem oposta, conforme a perspectiva narrativa, sem arcaísmo.
- source_word: ὅπου
  choice: onde
  rationale: Reproduz de maneira direta e natural o advérbio relativo de lugar.
- source_word: ἦν ὁ Ἰωάννης βαπτίζων
  choice: João estava batizando
  rationale: A construção progressiva preserva o valor durativo da perífrase grega, indicando atividade em andamento.
theological_decisions:
- issue: Leitura do topônimo Βηθανίᾳ («Betânia») em contraste com a variante Βηθαβαρᾷ («Betabara»).
  choice: Betânia
  alternative: Betabara
  rationale: O texto principal segue o SBLGNT e a evidência crítica adotada, enquanto a variante tradicional é registrada em nota sem ser incorporada ao texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Do outro lado do Jordão» é mais natural no uso corrente do que «além do Jordão», preservando a relação espacial do grego.
