  text: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων· Ἐγὼ βαπτίζω ἐν ὕδατι· ⸀μέσος ὑμῶν ⸀ἕστηκεν ὃν ὑμεῖς οὐκ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/026.yaml
  text: John answered them[a], saying, “I baptize in water. Among you stands one whom you do not know,”
translation:
  language: pt
  text: 'João lhes respondeu: “Eu batizo em água. No meio de vocês está alguém que vocês não conhecem.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων
  choice: João lhes respondeu
  rationale: Expressa naturalmente em português a fórmula narrativa grega; o particípio λέγων introduz a fala e não precisa ser reproduzido como “dizendo”, que seria redundante.
- source_word: βαπτίζω
  choice: batizo
  rationale: É o termo estabelecido e semanticamente adequado; “mergulho” estreitaria indevidamente o sentido e poderia introduzir uma especificidade denominacional.
- source_word: ἐν ὕδατι
  choice: em água
  rationale: Preserva de modo formal e inteligível a preposição ἐν, sem excluir a alternativa idiomática “com água”.
- source_word: μέσος ὑμῶν
  choice: no meio de vocês
  rationale: Construção corrente e clara em português, indicando presença dentro do grupo sem o tom mais literário de “em meio a vocês”.
- source_word: ἕστηκεν
  choice: está
  rationale: O perfeito transmite um estado presente resultante de ter tomado posição; neste contexto, “está” comunica naturalmente a presença, enquanto “está de pé” poderia enfatizar postura física além do necessário.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: alguém que vocês não conhecem
  rationale: Mantém o sentido amplo de οἶδα como “conhecer” e evita restringi-lo à ideia interpretativa de “reconhecer”.
theological_decisions:
- issue: Identidade daquele que está no meio deles
  choice: alguém
  alternative: o Messias; ele
  rationale: Embora o contexto mais amplo identifique Jesus, o versículo deixa o referente sem nome. “Alguém” preserva o efeito narrativo e não antecipa explicitamente essa identificação.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Vocês” representa o plural ὑμῶν/ὑμεῖς de forma inequívoca e amplamente compreensível. A pontuação transforma a fórmula grega de resposta e fala em diálogo natural, sem perda de conteúdo.
