  text: εἶπαν οὖν αὐτῷ· Τίς εἶ; ἵνα ἀπόκρισιν δῶμεν τοῖς πέμψασιν ἡμᾶς· τί λέγεις περὶ σεαυτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/022.yaml
  text: So they said to him, “Who are you, so that we may give an answer to those who sent us? What do you say about yourself?”
translation:
  language: pt
  text: 'Então lhe disseram: “Quem é você? Para que possamos dar uma resposta aos que nos enviaram, o que você diz a respeito de si mesmo?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação lógica e discursiva da conversa anterior, com naturalidade no português atual.
- source_word: εἶπαν ... αὐτῷ
  choice: lhe perguntaram
  rationale: Embora o verbo seja literalmente “disseram-lhe”, a fala introduzida consiste em perguntas; “lhe perguntaram” expressa naturalmente a função contextual sem alterar o conteúdo.
- source_word: Τίς εἶ;
  choice: Quem é você?
  rationale: Reproduz de modo direto e claro a pergunta concisa sobre a identidade de João.
- source_word: ἵνα ἀπόκρισιν δῶμεν
  choice: Precisamos dar uma resposta
  rationale: Transmite o propósito prático da construção com ἵνα em português idiomático. A necessidade decorre da missão recebida, sem sugerir obrigação teológica.
- source_word: τοῖς πέμψασιν ἡμᾶς
  choice: aos que nos enviaram
  rationale: Representa com clareza o particípio substantivado e preserva a referência aos remetentes da delegação.
- source_word: τί λέγεις περὶ σεαυτοῦ;
  choice: O que você diz a respeito de si mesmo?
  rationale: Preserva a referência explícita ao testemunho que João dá acerca de sua própria identidade, em registro digno e natural.
