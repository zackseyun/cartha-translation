id: JHN.1.18
reference: John 1:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς ἑώρακεν πώποτε· ⸂μονογενὴς θεὸς⸃ ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/018.yaml
  text: No one has ever seen God[a]; the one and only God, who is in the bosom of the Father[c][b], has made him known.
translation:
  language: pt
  text: Ninguém jamais viu Deus; o Deus único[a], que está no seio do Pai[b], foi quem o deu a conhecer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem «o Filho único» (ou «o Filho unigênito») em vez de «o Deus único».
    reason: textual_variant
  - marker: b
    text: Ou «ao lado do Pai». O grego diz literalmente «no seio do Pai», uma expressão de proximidade íntima.
    reason: lexical_alternative
  - marker: c
    text: Ou «o revelou» ou «o explicou».
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: Deus
  rationale: Objeto direto de ἑώρακεν; tradução padrão de θεός, aqui em referência absoluta a Deus.
- source_word: οὐδεὶς ... πώποτε
  choice: Ninguém jamais
  rationale: Expressa de modo natural e enfático a negação universal e a ideia temporal de πώποτε.
- source_word: ἑώρακεν
  choice: viu
  rationale: Com «jamais», o pretérito perfeito português comunica naturalmente que isso nunca ocorreu até o presente.
- source_word: μονογενὴς θεὸς
  choice: o Deus único
  rationale: Segue o texto impresso da SBLGNT, que traz θεός. «Único» expressa o sentido de singularidade de μονογενής sem introduzir «gerado» como parte necessária de seu valor lexical.
- source_word: ὁ ὢν
  choice: que está
  rationale: Converte o particípio substantivado em oração relativa natural e mantém a ideia de relação contínua.
- source_word: εἰς τὸν κόλπον τοῦ πατρὸς
  choice: junto ao coração do Pai
  rationale: Preserva a imagem relacional de κόλπος e comunica proximidade íntima em português corrente; a formulação mais literal é registrada em nota.
- source_word: ἐκεῖνος
  choice: foi quem
  rationale: Reproduz a ênfase do demonstrativo grego sem o pronome redundante ou pouco natural «esse».
- source_word: ἐξηγήσατο
  choice: revelou
  rationale: No contexto, comunica que o Filho deu a conhecer Deus. A nota preserva os sentidos alternativos de explicar e dar a conhecer.
theological_decisions:
- issue: Leitura textual μονογενὴς θεὸς em contraste com ὁ μονογενὴς υἱός
  choice: 'O texto principal segue a SBLGNT: «o Deus único».'
  alternative: «o Filho único» ou «o Filho unigênito».
  rationale: A fonte fornecida lê μονογενὴς θεός. Como se trata de importante variante textual cristológica, a leitura alternativa é preservada em nota, sem harmonização silenciosa.
- issue: Sentido de μονογενής
  choice: «único»
  alternative: «unigênito» ou «único de sua espécie».
  rationale: «Único» comunica singularidade e exclusividade sem fazer da noção de geração um componente lexical obrigatório; «unigênito» é mantido na nota como tradução tradicional ligada à variante.
- issue: Referente do objeto implícito de ἐξηγήσατο
  choice: «o revelou», referindo-se a Deus/Pai.
  alternative: «o deu a conhecer» ou «o explicou».
  rationale: O objeto não está expresso após o verbo no grego, mas é recuperado do contexto. A tradução mantém o referente masculino e evita acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Junto ao coração» conserva a metáfora de intimidade sem o tom arcaico ou anatômico que «no seio» pode ter hoje. Todos os marcadores aparecem no texto principal.
