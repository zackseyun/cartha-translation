  terminology: «O Deus único» reproduz adequadamente μονογενὴς θεός sem introduzir «unigênito» no texto principal. «Pai» e «Deus» conservam a terminologia joanina. «Deu a conhecer» é uma formulação portuguesa natural para ἐξηγήσατο no contexto.
