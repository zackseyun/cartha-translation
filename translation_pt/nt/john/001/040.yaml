id: JHN.1.40
reference: John 1:40
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/040.yaml
  text: Andrew[a], Simon Peter’s brother, was one of the two who had heard from John and followed him.
translation:
  language: pt
  text: André, irmão de Simão Pedro, era um dos dois que tinham ouvido João e seguido Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “e o tinham seguido”. O pronome se refere a Jesus no contexto.'
    reason: O texto principal explicita o referente contextual de αὐτῷ; a nota registra a forma pronominal do grego.
lexical_decisions:
- source_word: ἦν
  choice: era
  rationale: O imperfeito de εἰμί funciona como cópula de identificação; “era” é natural em português e mantém o aspecto narrativo.
- source_word: Ἀνδρέας
  choice: André
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: irmão de Simão Pedro
  rationale: Expressa de modo direto e natural a relação familiar indicada pelo genitivo, preservando a designação dupla “Simão Pedro”.
- source_word: εἷς ἐκ τῶν δύο
  choice: um dos dois
  rationale: Equivalente idiomático e preciso da expressão partitiva grega.
- source_word: τῶν ἀκουσάντων παρὰ Ἰωάννου
  choice: que tinham ouvido João
  rationale: O mais-que-perfeito composto explicita naturalmente a anterioridade em relação a “era”; παρά com genitivo marca a pessoa de quem ouviram. Em português, “ouvir João” comunica isso com maior naturalidade do que “ouvir de João”.
- source_word: καὶ ἀκολουθησάντων αὐτῷ
  choice: e seguido Jesus
  rationale: O particípio coordenado compartilha a sequência anterior. O contexto imediato identifica Jesus como referente de αὐτῷ; explicitar o nome evita em português a possível leitura de que seguiram João.
theological_decisions:
- issue: Referente de αὐτῷ
  choice: Jesus
  alternative: ele, preservando formalmente o pronome grego
  rationale: Em João 1:35–39, os dois ouvem João e passam a seguir Jesus. O nome explícito preserva o sentido contextual e elimina uma ambiguidade artificial que “ele” produziria em português.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha de perto o grego, mas emprega construções naturais em português.
source_grounding:
  english_pob_role: consult_only
