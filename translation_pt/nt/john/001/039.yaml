  text: λέγει αὐτοῖς· Ἔρχεσθε καὶ ⸂ὄψεσθε. ἦλθαν οὖν⸃ καὶ εἶδαν ποῦ μένει, καὶ παρ’ αὐτῷ ἔμειναν τὴν ἡμέραν ἐκείνην· ὥρα ἦν ὡς δεκάτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/039.yaml
  text: He said to them[a], “Come, and you will see.” So they went and saw where he was staying, and they stayed with him that day. It was about the tenth hour.
translation:
  language: pt
  text: 'Ele lhes disse: “Venham, e vocês verão.” Então foram e viram onde ele estava hospedado, e ficaram com ele naquele dia. Era por volta da décima hora.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Se contado a partir do nascer do sol, cerca das quatro da tarde; alguns entendem a expressão segundo a contagem romana, como cerca das dez da manhã.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Ele lhes disse
  rationale: O presente histórico grego é vertido pelo passado simples, mais natural na narrativa em português.
- source_word: Ἔρχεσθε
  choice: Venham
  rationale: Imperativo plural com força de convite; forma direta, natural e sem acréscimo interpretativo.
- source_word: ὄψεσθε
  choice: vocês verão
  rationale: Preserva o futuro do grego e o vínculo verbal com o posterior “viram”.
- source_word: ἦλθαν οὖν
  choice: Então foram
  rationale: “Então” expressa a consequência narrativa indicada por οὖν; “foram” apresenta naturalmente o movimento a partir da perspectiva narrativa dos discípulos.
- source_word: εἶδαν
  choice: viram
  rationale: Equivalente narrativo direto que mantém a repetição de ὁράω presente em “vocês verão”.
- source_word: ποῦ μένει
  choice: onde ele estava hospedado
  rationale: Neste contexto, μένω se refere ao lugar em que Jesus estava ficando; “hospedado” comunica com naturalidade uma estadia possivelmente temporária.
- source_word: παρ’ αὐτῷ ἔμειναν
  choice: ficaram com ele
  rationale: Expressa tanto a permanência quanto a companhia, sem restringir o sentido a simplesmente pernoitar.
- source_word: τὴν ἡμέραν ἐκείνην
  choice: naquele dia
  rationale: Mantém a expressão temporal sem acrescentar “o resto de”, ideia possível pelo contexto, mas não explícita.
- source_word: ὥρα ἦν ὡς δεκάτη
  choice: Era por volta da décima hora
  rationale: Preserva a forma antiga e a aproximação indicada por ὡς, sem decidir qual sistema de contagem estava em uso.
theological_decisions:
- issue: Sistema de contagem da “décima hora”
  choice: Manter “décima hora” no texto principal
  alternative: Converter para cerca de quatro da tarde, ou, segundo outra interpretação, cerca de dez da manhã
  rationale: O texto não identifica o sistema de contagem. A formulação literal preserva a ambiguidade histórica, enquanto a nota apresenta as principais possibilidades.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” explicita naturalmente o plural; “hospedado” evita o tom arcaico de “morava” ou “permanecia” neste contexto.
