id: JHN.1.13
reference: John 1:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἳ οὐκ ἐξ αἱμάτων οὐδὲ ἐκ θελήματος σαρκὸς οὐδὲ ἐκ θελήματος ἀνδρὸς ἀλλ’ ἐκ θεοῦ ἐγεννήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/013.yaml
  text: who were born, not from bloods, nor from the will of the flesh, nor from the will of a man, but from God.
translation:
  language: pt
  text: os quais nasceram, não de sangues[a], nem da vontade da carne, nem da vontade de um homem, mas de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, «de linhagens humanas». O grego traz o plural incomum «sangues», referindo-se à descendência natural ou à filiação humana.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: os quais
  rationale: Retoma as pessoas mencionadas no versículo anterior e preserva a ligação sintática da oração relativa; em português, «os quais» dá clareza ao fragmento fornecido.
- source_word: ἐξ αἱμάτων
  choice: de sangues
  rationale: Mantém o plural incomum do grego e o contraste formal entre a origem humana e a origem divina; a nota oferece a formulação idiomática.
- source_word: θελήματος
  choice: vontade
  rationale: Corresponde bem ao sentido neste contexto e preserva a repetição paralela de «da vontade».
- source_word: σαρκὸς
  choice: carne
  rationale: Conserva o termo concreto do original, que aqui aponta para a geração humana natural, sem explicá-lo como uma doutrina específica.
- source_word: ἀνδρὸς
  choice: um homem
  rationale: Preserva o singular e a referência provável à atuação masculina na procriação, sem reduzir o termo a uma expressão abstrata.
- source_word: ἐκ θεοῦ
  choice: de Deus
  rationale: Expressa naturalmente em português a fonte ou origem e mantém o contraste com as três expressões anteriores.
- source_word: ἐγεννήθησαν
  choice: nasceram
  rationale: É a forma moderna e natural de traduzir o aoristo passivo neste contexto; comunica nascimento ou origem sem o arcaísmo de «foram gerados».
theological_decisions:
- issue: Natureza do contraste entre origem humana e divina
  choice: O versículo descreve um nascimento cuja origem não está na descendência natural nem na vontade procriadora humana, mas em Deus.
  alternative: A frase pode ser entendida mais estreitamente como exclusão da linhagem étnica ou, em tradições posteriores, receber uma leitura sacramental ou metafísica.
  rationale: A negação tríplice contrasta a geração humana comum com a origem em Deus. A tradução conserva esse contraste sem impor uma doutrina denominacional específica da regeneração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe paralela e o plural marcante «sangues» foram preservados; a nota esclarece seu sentido idiomático.
