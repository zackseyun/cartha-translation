id: JHN.1.45
reference: John 1:45
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/045.yaml
  text: 'Philip found Nathanael and said to him[a], “We have found him of whom Moses in the Law and also the prophets wrote: Jesus son of Joseph[b], from Nazareth.”'
translation:
  language: pt
  text: 'Filipe encontrou Natanael e lhe disse: “Encontramos aquele sobre quem Moisés escreveu na Lei, e também os profetas: Jesus, filho de José, de Nazaré.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρίσκει
  choice: encontrou
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, mais natural na narrativa em português e coerente com λέγει.
- source_word: λέγει
  choice: disse
  rationale: O presente histórico é traduzido no passado para manter a progressão narrativa natural em português.
- source_word: Ὃν ἔγραψεν
  choice: aquele sobre quem ... escreveu
  rationale: A formulação idiomática preserva o referente pessoal e a função de Ὃν como objeto de ἔγραψεν.
- source_word: ἐν τῷ νόμῳ
  choice: na Lei
  rationale: A inicial maiúscula sinaliza o corpo reconhecido das Escrituras associado a Moisés, sem recorrer ao termo menos imediatamente acessível 'Torá'.
- source_word: οἱ προφῆται
  choice: os profetas
  rationale: Mantém a designação tradicional dos profetas e, por extensão contextual, de seu testemunho nas Escrituras.
- source_word: εὑρήκαμεν
  choice: encontramos
  rationale: Em português, o pretérito perfeito composto normalmente indica repetição ou continuidade; o pretérito perfeito simples expressa naturalmente a descoberta consumada com relevância presente.
- source_word: υἱὸν τοῦ Ἰωσὴφ
  choice: filho de José
  rationale: Preserva sem expansão a identificação social feita por Filipe, sem harmonização cristológica introduzida pelo tradutor.
- source_word: τὸν ἀπὸ Ναζαρέτ
  choice: de Nazaré
  rationale: Em português, 'de Nazaré' é a maneira natural de expressar origem ou associação e corresponde adequadamente a ἀπό neste contexto.
- source_word: Ναθαναὴλ
  choice: Natanael
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: Μωϋσῆς
  choice: Moisés
  rationale: Forma portuguesa convencional do nome próprio.
theological_decisions:
- issue: A identificação de Jesus como 'filho de José' em relação à cristologia
  choice: Manter a declaração de Filipe como 'Jesus, filho de José' sem qualificá-la.
  alternative: Jesus, considerado filho de José; Jesus, filho legal de José
  rationale: O versículo registra a identificação inicial feita por Filipe em termos sociais comuns. Acrescentar uma ressalva importaria para a fala uma harmonização doutrinária que o texto não explicita.
- issue: O alcance de 'Moisés escreveu na Lei, e também os profetas'
  choice: Apresentar Moisés e os profetas como testemunhas escriturísticas acerca da pessoa encontrada.
  alternative: Aquele de quem escreveram Moisés, na Lei, e os profetas
  rationale: A tradução conserva os dois sujeitos do testemunho e evita especificar além da afirmação explícita de Filipe a natureza exata de cada passagem evocada.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe portuguesa sem eliminar a tensão da fala de Filipe. Não há marcadores de nota, pois nenhuma nota é necessária para comunicar adequadamente as alternativas relevantes neste versículo.
