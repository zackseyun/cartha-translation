source:
  edition: SBLGNT
  text: Καὶ αὕτη ἐστὶν ἡ μαρτυρία τοῦ Ἰωάννου ὅτε ⸀ἀπέστειλαν οἱ Ἰουδαῖοι ἐξ Ἱεροσολύμων ἱερεῖς καὶ Λευίτας ἵνα ἐρωτήσωσιν αὐτόν· Σὺ τίς εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/019.yaml
  text: And this is the testimony of John[a], when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?”
translation:
  language: pt
  text: 'E este é o testemunho de João, quando os judeus[a] enviaram de Jerusalém sacerdotes e levitas para lhe perguntar: “Quem é você?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os líderes judeus” ou “os judeus da Judeia”. Em João, “os judeus” muitas vezes se refere especialmente às autoridades religiosas da Judeia, e não ao povo judeu como um todo.
    reason: Alternativa lexical e esclarecimento contextual do referente de οἱ Ἰουδαῖοι.
lexical_decisions:
- source_word: μαρτυρία
  choice: testemunho
  rationale: Preserva o sentido de declaração ou atestação e as ressonâncias jurídicas do vocabulário joanino.
- source_word: τοῦ Ἰωάννου
  choice: de João
  rationale: 'O genitivo é entendido como subjetivo: trata-se do testemunho dado por João, não de um testemunho a respeito dele.'
- source_word: ὅτε
  choice: quando
  rationale: Introduz naturalmente, em português, a ocasião em que o testemunho foi dado.
- source_word: ἀπέστειλαν
  choice: enviaram
  rationale: Equivalente corrente e direto para o ato de mandar representantes.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Mantém no texto principal a designação explícita do grego, enquanto a nota esclarece que, neste contexto joanino, o referente pode ser mais restrito.
- source_word: ἐξ Ἱεροσολύμων
  choice: de Jerusalém
  rationale: Expressa o lugar de onde sacerdotes e levitas foram enviados.
- source_word: ἱερεῖς καὶ Λευίτας
  choice: sacerdotes e levitas
  rationale: Conserva a distinção entre os dois grupos ligados ao serviço do templo.
- source_word: ἵνα ἐρωτήσωσιν αὐτόν
  choice: para lhe perguntar
  rationale: Traduz de modo natural a oração de finalidade e mantém João como objeto da pergunta.
- source_word: Σὺ τίς εἶ;
  choice: Quem é você?
  rationale: Formulação clara e corrente no português com legibilidade brasileira; o contexto comunica suficientemente a ênfase do pronome grego explícito.
theological_decisions:
- issue: Referente de οἱ Ἰουδαῖοι no Evangelho de João
  choice: os judeus, com esclarecimento em nota
  alternative: os líderes judeus; os judeus da Judeia
  rationale: A tradução principal preserva a expressão grega sem identificar de maneira excessivamente específica o grupo; a nota evita que ela seja tomada como referência indiscriminada a todo o povo judeu, pois o envio de sacerdotes e levitas a partir de Jerusalém aponta especialmente para autoridades religiosas da Judeia.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem “enviaram de Jerusalém sacerdotes e levitas” mantém claro que Jerusalém é o ponto de origem do envio. O marcador [a] aparece imediatamente após “João”, seguindo a camada de consulta fornecida, embora a nota esclareça especificamente a expressão “os judeus” que vem logo depois.
