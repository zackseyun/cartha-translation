  naturalness: “No princípio, a Palavra existia” é português moderno, claro e suficientemente solene. A repetição de “e” conserva a cadência e a coordenação das três orações gregas sem sacrificar a legibilidade.
  terminology: “Palavra” é uma escolha contemporânea apropriada para ὁ λόγος. “Deus” na oração final deve permanecer sem artigo. A nota sobre a última oração deve descrever a nuance qualitativa sem transformar uma explicação sintática em formulação doutrinária mais conclusiva que o texto.
