  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: pt
  text: No princípio[a], a Palavra existia, e a Palavra estava com Deus, e a Palavra era Deus[b].
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: A expressão “No princípio” retoma Gênesis 1:1 e relaciona a Palavra com o princípio da criação.
    reason: cross_reference
  - marker: b
    text: 'Ou: “a Palavra era divina” ou “aquilo que Deus era, a Palavra era”. No grego, “Deus” na oração final aparece sem artigo e antes do verbo, uma formulação que pode destacar qualitativamente o que a Palavra era, ao mesmo tempo que a distingue de “Deus” na oração anterior.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: No princípio
  rationale: Preserva a formulação solene e a alusão direta a Gênesis 1:1, com expressão natural e consagrada em português.
- source_word: ἦν
  choice: já existia / estava / era
  rationale: O imperfeito de εἰμί recebe formas naturais conforme cada predicação. Na primeira oração, “já existia” explicita sem exagero a existência da Palavra no princípio; nas demais, “estava” e “era” preservam as relações sintáticas e a cadência.
- source_word: ὁ λόγος
  choice: a Palavra
  rationale: “Palavra” mantém os sentidos de expressão, revelação e comunicação, além de funcionar naturalmente como designação pessoal no contexto joanino. “Verbo” é tradicional, mas menos transparente para muitos leitores atuais; “Logos” apenas translitera.
- source_word: πρὸς τὸν θεόν
  choice: estava com Deus
  rationale: “Com Deus” comunica de modo natural a relação e a distinção pessoal sugeridas por πρός neste contexto, sem a rigidez de “voltada para Deus” nem a expansão de “na presença de Deus”.
- source_word: θεὸς ἦν ὁ λόγος
  choice: a Palavra era Deus
  rationale: 'Reproduz de modo claro e natural a predicação qualitativa de θεός: afirma aquilo que a Palavra era quanto à natureza, sem confundi-la pessoalmente com Deus na oração anterior.'
theological_decisions:
- issue: Predicado θεός sem artigo na oração final
  choice: a Palavra era Deus
  alternative: a Palavra era divina; aquilo que Deus era, a Palavra era
  rationale: A ordem e a ausência do artigo dão ao predicado força principalmente qualitativa. A tradução principal afirma plenamente a natureza divina da Palavra, enquanto a oração anterior mantém a distinção relacional. A nota registra paráfrases possíveis da nuance sem resolver além do texto a tensão entre identidade de natureza e distinção pessoal.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. “Palavra” foi preferida a “Verbo” por transparência semântica. “Já existia” evita sugerir que a Palavra passou a existir no princípio. Os marcadores foram colocados no fim do versículo porque as notas explicam, respectivamente, a oração final e a alusão estrutural do conjunto.
