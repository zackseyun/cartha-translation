source:
  edition: SBLGNT
  text: ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/017.yaml
  text: For the law was given through Moses[a]; grace and truth came through Jesus the Messiah.
translation:
  language: pt
  text: Pois a lei foi dada por meio de Moisés; a graça e a verdade vieram por meio de Jesus, o Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme a forma tradicional: “Jesus Cristo”.'
    reason: Registra a forma tradicional de verter Ἰησοῦ Χριστοῦ, enquanto o texto principal traduz Χριστός como título.
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior (João 1:16), preservando de modo natural em português a força causal e explicativa.
- source_word: ὁ νόμος
  choice: a lei
  rationale: Refere-se ao corpo conhecido da instrução mosaica. A forma em minúscula é clara no contexto e evita depender de uma convenção editorial posterior.
- source_word: διὰ Μωϋσέως
  choice: por meio de Moisés
  rationale: διά com genitivo indica mediação ou agência; a expressão também mantém o paralelismo com a cláusula seguinte.
- source_word: ἐδόθη
  choice: foi dada
  rationale: Reproduz diretamente o aoristo passivo de δίδωμι sem explicitar quem a deu.
- source_word: ἡ χάρις
  choice: a graça
  rationale: Preserva o sentido rico de χάρις no contexto joanino e sua ligação com João 1:14.
- source_word: ἡ ἀλήθεια
  choice: a verdade
  rationale: Mantém o uso joanino de ἀλήθεια e o eco de João 1:14, sem restringi-lo a uma paráfrase interpretativa.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: por meio de Jesus, o Messias
  rationale: Mantém a mesma expressão mediadora da primeira cláusula e traduz Χριστός como título, em português idiomático.
- source_word: ἐγένετο
  choice: vieram
  rationale: Expressa naturalmente a manifestação histórica da graça e da verdade, preservando o contraste verbal com 'foi dada' sem sugerir que antes não existiam em sentido absoluto.
theological_decisions:
- issue: Tradução de Χριστοῦ em Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: Χριστός tem origem e valor titular, 'Ungido/Messias'. A tradução explicita esse sentido em português natural; a forma tradicional é registrada em nota.
- issue: Relação entre a lei e a graça e a verdade
  choice: Manter o contraste verbal e o paralelismo sem acrescentar oposição absoluta
  alternative: Inserir 'mas' entre as orações
  rationale: O grego não contém conjunção adversativa. O ponto e vírgula preserva a justaposição e a tensão do texto sem impor que lei e graça sejam mutuamente excludentes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. 'Por meio de' foi repetido para conservar o paralelismo grego; o ponto e vírgula mantém a relação entre as duas orações sem acrescentar um 'mas' ausente do original.
