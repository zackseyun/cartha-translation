id: JHN.1.38
reference: John 1:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: στραφεὶς δὲ ὁ Ἰησοῦς καὶ θεασάμενος αὐτοὺς ἀκολουθοῦντας λέγει αὐτοῖς· Τί ζητεῖτε; οἱ δὲ εἶπαν αὐτῷ· Ῥαββί (ὃ λέγεται ⸀μεθερμηνευόμενον Διδάσκαλε), ποῦ μένεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/038.yaml
  text: Then Jesus turned and[a], seeing them following, said to them, “What are you seeking?” They said to him, “Rabbi” (which translated means Teacher)[c][b], “where are you staying?”
translation:
  language: pt
  text: 'Então Jesus se virou e, vendo que eles o seguiam, disse-lhes: “O que vocês buscam?” Eles lhe disseram: “Rabi” (que, traduzido, significa Mestre)[a], “onde está hospedado?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rabi” é um título hebraico/aramaico que significa “Mestre”.
    reason: cultural_note
  - marker: b
    text: Ou “onde permanece?”. O verbo grego é o mesmo frequentemente traduzido por “permanecer” em outras passagens de João.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: se virou
  rationale: Expressa de modo natural a ação anterior de Jesus, sem especificar além do grego a direção do movimento.
- source_word: θεασάμενος
  choice: vendo
  rationale: Preserva a percepção visual atenta do particípio e forma uma sequência clara com “se virou”.
- source_word: ἀκολουθοῦντας
  choice: o seguiam
  rationale: Mantém tanto o sentido literal de caminhar atrás de Jesus quanto a possível ressonância de discipulado, sem impor uma única leitura.
- source_word: Τί ζητεῖτε;
  choice: O que vocês buscam?
  rationale: “Buscam” é compreensível em português atual e conserva melhor que “estão procurando” a possível profundidade narrativa de ζητέω em João.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Translitera o título judaico, que o próprio texto explica imediatamente.
- source_word: μεθερμηνευόμενον Διδάσκαλε
  choice: que, traduzido, significa Mestre
  rationale: Reproduz de maneira fluente a explicação parentética do evangelista e mantém “Mestre” como forma de tratamento.
- source_word: ποῦ μένεις;
  choice: onde o senhor está hospedado?
  rationale: No contexto imediato, μένω pergunta pelo lugar em que Jesus se encontra alojado. “Está hospedado” é natural e respeitoso, enquanto a nota registra a conexão lexical com “permanecer”.
theological_decisions:
- issue: O possível sentido duplo de ζητέω na narrativa joanina
  choice: O que vocês buscam?
  alternative: O que vocês estão procurando?
  rationale: “Buscam” preserva tanto a pergunta concreta quanto uma possível dimensão espiritual, sem tornar explícito o que o texto deixa implícito.
- issue: O emprego de μένω, verbo que adquire peso teológico em João
  choice: onde o senhor está hospedado?
  alternative: onde o senhor permanece?
  rationale: A tradução principal segue o sentido locativo exigido pelo diálogo, enquanto a nota preserva a repetição lexical e sua possível ressonância no Evangelho.
- issue: Forma de tratamento implícita em ποῦ μένεις
  choice: onde o senhor está hospedado?
  alternative: onde você está hospedado?
  rationale: “O senhor” soa natural no português brasileiro como tratamento respeitoso dirigido a um mestre, sem atribuir aqui um título cristológico adicional.
translation_notes:
  register: Português moderno, digno e amplamente acessível, com legibilidade brasileira. A colocação pronominal é natural sem ser excessivamente coloquial; “vocês” explicita o plural grego, e “o senhor” comunica o respeito dos discípulos pelo mestre.
