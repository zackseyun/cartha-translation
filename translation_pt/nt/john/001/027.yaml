  text: ⸀ὁ ὀπίσω μου ⸀ἐρχόμενος, οὗ ⸂οὐκ εἰμὶ⸃ ἄξιος ἵνα λύσω αὐτοῦ τὸν ἱμάντα τοῦ ὑποδήματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/027.yaml
  text: the one coming after me[a], whose sandal strap I am not worthy to untie.
translation:
  language: pt
  text: aquele que vem depois de mim, de cuja sandália não sou digno de desatar a correia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  choice: aquele que vem depois de mim
  rationale: O particípio presente articulado funciona como substantivo e aponta para uma pessoa específica. A formulação preserva tanto a ideia de vinda quanto o sentido temporal ou sucessivo de ὀπίσω μου, sem explicitar uma superioridade apenas implícita no contexto.
- source_word: οὗ
  choice: de cuja
  rationale: O pronome relativo no genitivo estabelece a relação com a sandália da pessoa mencionada. Em português, «de cuja sandália» preserva essa construção de modo correto e digno.
- source_word: οὐκ εἰμὶ ἄξιος
  choice: não sou digno
  rationale: Mantém diretamente a noção de dignidade ou aptidão expressa por ἄξιος e conserva a humildade da declaração sem ampliá-la.
- source_word: ἵνα λύσω
  choice: de desatar
  rationale: Depois de «digno», o infinitivo introduzido por «de» é a forma idiomática em português para a ação contemplada pelo grego ἵνα com o subjuntivo. «Desatar» expressa adequadamente o ato de soltar uma correia.
- source_word: ἱμάντα
  choice: correia
  rationale: No contexto do calçado, ἱμάς designa uma tira ou correia. «Correia» é clara, corrente e historicamente apropriada.
- source_word: τοῦ ὑποδήματος
  choice: sandália
  rationale: Embora ὑπόδημα possa designar calçado de modo mais amplo, «sandália» é precisa e natural para o contexto histórico.
theological_decisions:
- issue: Relação de «depois de mim» com aquele que vem
  choice: 'Sentido temporal ou sucessivo: «aquele que vem depois de mim»'
  alternative: «aquele que vem atrás de mim»
  rationale: No contexto joanino, a expressão indica aquele que sucede João na manifestação pública e pode também sugerir posição relativa. A tradução conserva o sentido temporal comum sem importar para esta oração a afirmação explícita de superioridade encontrada no contexto próximo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem «de cuja sandália... a correia» é um pouco mais formal, mas natural, e acompanha de perto a relação genitiva do grego sem exigir nota.
