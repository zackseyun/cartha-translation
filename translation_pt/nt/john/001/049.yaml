  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/049.yaml
  text: Nathanael answered him, “Rabbi, you are the Son of God; you are the King of Israel.”
translation:
  language: pt
  text: 'Natanael lhe respondeu: “Rabi, tu és o Filho de Deus; tu és o Rei de Israel.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: Equivalente narrativo direto e natural de ἀποκρίνομαι em diálogo.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Mantém o título judaico transliterado e o contexto cultural do primeiro século, em vez de substituí-lo por “Mestre”.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: o Filho de Deus
  rationale: Preserva a construção definida e sua força titular e cristológica, sem ampliação interpretativa.
- source_word: βασιλεὺς
  choice: Rei
  rationale: É o equivalente lexical direto; embora o predicativo seja anartro em grego, o contexto e o complemento “de Israel” lhe conferem sentido definido.
- source_word: τοῦ Ἰσραήλ
  choice: de Israel
  rationale: Reproduz de modo direto o genitivo e conserva a forma do título.
- source_word: σὺ εἶ … σὺ … εἶ
  choice: tu és … tu és
  rationale: Retém a repetição enfática e o paralelismo confessional do grego.
- source_word: Ναθαναήλ
  choice: Natanael
  rationale: Forma consagrada e natural do nome em português.
theological_decisions:
- issue: Força cristológica da confissão “o Filho de Deus”
  choice: Manter o título definido “o Filho de Deus” sem enfraquecê-lo nem expandi-lo.
  alternative: “um filho de Deus” ou uma paráfrase explicativa
  rationale: A expressão tem forte relevância messiânica e cristológica em João; a tradução preserva o que o grego afirma sem importar formulações doutrinárias posteriores.
- issue: Sentido régio-messiânico de “Rei de Israel”
  choice: Traduzir pelo título explícito “o Rei de Israel”.
  alternative: “rei sobre Israel” ou “rei dos israelitas”
  rationale: A formulação conserva o título régio e sua evocação messiânica, sem transformar o genitivo em uma explicação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tu” foi mantido porque reproduz com naturalidade a ênfase do pronome grego repetido; a colocação “lhe respondeu” é corrente e evita a sequência menos natural “respondeu-lhe Natanael”.
