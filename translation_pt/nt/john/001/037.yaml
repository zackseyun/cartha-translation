base_translation:
  language: en
  yaml_path: translation/nt/john/001/037.yaml
  text: And the two disciples heard him speaking[a], and they followed Jesus.
translation:
  language: pt
  text: E os dois discípulos o ouviram falar e seguiram Jesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσαν
  choice: ouviram
  rationale: O aoristo de ἀκούω apresenta o acontecimento simples de ouvir; “ouviram” é natural no contexto e não implica necessariamente escuta prolongada.
- source_word: οἱ δύο μαθηταὶ αὐτοῦ
  choice: os dois discípulos
  rationale: A expressão identifica os dois discípulos de João Batista mencionados no versículo anterior. Em português, omitir o possessivo evita que “seus” seja entendido equivocadamente como referência a Jesus, sem perder a identificação contextual.
- source_word: λαλοῦντος
  choice: falar
  rationale: 'O particípio presente de λαλέω indica ação concomitante: eles o ouviram enquanto falava. A construção idiomática portuguesa “ouviram falar” expressa isso de modo claro e digno.'
- source_word: ἠκολούθησαν
  choice: seguiram
  rationale: ἀκολουθέω denota aqui o ato concreto de ir atrás de Jesus, mantendo também a ressonância narrativa de se tornar seu seguidor.
- source_word: τῷ Ἰησοῦ
  choice: Jesus
  rationale: 'O dativo indica a pessoa seguida; em português, o verbo “seguir” rege objeto direto: “seguiram Jesus”.'
theological_decisions:
- issue: Referente de αὐτοῦ em οἱ δύο μαθηταὶ αὐτοῦ
  choice: Entendido como referência a João Batista; o possessivo fica implícito no texto principal.
  alternative: Traduzir explicitamente “os dois discípulos dele” ou “seus dois discípulos”.
  rationale: João 1:35-36 apresenta João Batista com dois discípulos; são eles que ouvem João falar e passam a seguir Jesus. A formulação escolhida preserva o referente contextual e evita uma ambiguidade enganosa em português.
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. A ordem narrativa e a dupla ressonância de “seguiram” — movimento físico e possível discipulado — foram preservadas.
