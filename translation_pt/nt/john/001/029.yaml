id: JHN.1.29
reference: John 1:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/029.yaml
  text: The next day he sees Jesus coming toward him and says, “Look, the Lamb of God, who takes away the sin of the world!”
translation:
  language: pt
  text: 'No dia seguinte, ele vê Jesus aproximando-se dele e diz: “Veja! O Cordeiro de Deus, que tira o pecado do mundo!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: No dia seguinte
  rationale: Expressão portuguesa natural e precisa para a indicação temporal.
- source_word: βλέπει
  choice: viu
  rationale: Embora o grego use o presente histórico, o pretérito é mais natural na narrativa portuguesa e mantém o valor discursivo.
- source_word: Ἴδε
  choice: Vejam!
  rationale: Imperativo plural inclusivo e corrente, adequado ao chamado público de João para dirigir a atenção dos ouvintes a Jesus.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: o Cordeiro de Deus
  rationale: Preserva a metáfora central e sua formulação tradicional, sem explicitar uma única possível alusão sacrificial.
- source_word: ὁ αἴρων
  choice: que tira
  rationale: Mantém a amplitude de αἴρω, que neste contexto pode envolver remover ou levar/carregar, sem desenvolver essa ambiguidade no corpo do versículo.
- source_word: τὴν ἁμαρτίαν τοῦ κόσμου
  choice: o pecado do mundo
  rationale: Conserva o singular coletivo de ἁμαρτία e a abrangência de κόσμος.
theological_decisions:
- issue: Sentido de αἴρων em relação ao pecado
  choice: que tira
  alternative: que carrega
  rationale: “Tira” comunica diretamente a remoção do pecado e corresponde ao uso contextual do verbo, enquanto o grego também pode evocar a ideia de carregar; a tradução não acrescenta uma explicação doutrinária que encerre todas as ressonâncias possíveis.
- issue: Identidade e simbolismo do “Cordeiro de Deus”
  choice: preservar a metáfora sem explicação
  alternative: explicitar uma referência ao cordeiro pascal ou ao sacrifício expiatório
  rationale: O texto não identifica expressamente uma única alusão veterotestamentária, portanto a tradução conserva a tensão e a riqueza da imagem.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem exclamativa em “Vejam! O Cordeiro de Deus” reproduz o impacto de Ἴδε sem recorrer ao mais arcaizante “Eis”. O sujeito “ele” permanece como no contexto narrativo, referindo-se a João.
