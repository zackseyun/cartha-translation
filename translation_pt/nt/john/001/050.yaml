  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὅτι εἶπόν σοι ⸀ὅτι εἶδόν σε ὑποκάτω τῆς συκῆς πιστεύεις; μείζω τούτων ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/050.yaml
  text: Jesus answered and said to him[a], “Because I told you that I saw you under the fig tree, do you believe? You will see greater things than these.”
translation:
  language: pt
  text: 'Jesus lhe respondeu: “Você crê porque eu lhe disse que o vi debaixo da figueira?[a] Você verá coisas maiores do que estas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “É porque eu lhe disse que o vi debaixo da figueira que você crê?”'
    reason: Alternativa sintática que torna explícito o foco interrogativo possível do primeiro ὅτι, sem alterar o conteúdo causal.
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Jesus lhe respondeu
  rationale: A fórmula narrativa grega combina ‘respondeu’ e ‘disse’. Em português atual, ‘lhe respondeu’ transmite naturalmente a fórmula sem a redundância pouco idiomática ‘respondeu e disse-lhe’.
- source_word: Ὅτι
  choice: porque
  rationale: Introduz a razão ligada à pergunta. A colocação de ‘porque’ dentro da pergunta conserva a força causal e produz sintaxe natural em português.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo do que Jesus disse, distinguindo este uso declarativo do primeiro ὅτι causal.
- source_word: εἶδόν σε
  choice: eu lhe disse que o vi
  rationale: O aoristo é vertido pelo pretérito perfeito simples ‘vi’. ‘O’ retoma o interlocutor como objeto direto, enquanto ‘lhe’ corresponde ao destinatário de ‘disse’.
- source_word: ὑποκάτω τῆς συκῆς
  choice: debaixo da figueira
  rationale: Equivalente concreto, claro e corrente em português, preservando a imagem do texto.
- source_word: πιστεύεις
  choice: você crê
  rationale: O presente indicativo em pergunta retórica é adequadamente representado pelo presente simples. ‘Crê’ preserva o vocabulário joanino de fé, e ‘você’ oferece ampla legibilidade brasileira sem perder dignidade.
- source_word: μείζω τούτων
  choice: coisas maiores do que estas
  rationale: O comparativo neutro plural substantivado requer ‘coisas maiores’; ‘do que estas’ conserva a comparação e o plural do demonstrativo.
- source_word: ὄψῃ
  choice: você verá
  rationale: O futuro do verbo ‘ver’ é expresso de modo direto e atual, sem arcaísmo.
theological_decisions:
- issue: Força da pergunta πιστεύεις; e relação causal introduzida por Ὅτι
  choice: “Você crê porque eu lhe disse...?”
  alternative: '“Porque eu lhe disse..., você crê?” ou leitura declarativa: “Você crê porque eu lhe disse...”'
  rationale: A tradução mantém a frase como pergunta retórica e não a intensifica em censura. A ordem escolhida é natural em português e conserva a ambiguidade quanto ao tom exato de Jesus.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. ‘Você’ evita o arcaísmo de ‘tu’ em grande parte do Brasil; ‘lhe’ mantém polidez e fluidez. A fórmula grega ‘respondeu e disse’ foi condensada segundo o uso natural do português.
