  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἦν τὸ φῶς τὸ ἀληθινὸν ὃ φωτίζει πάντα ἄνθρωπον ἐρχόμενον εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/009.yaml
  text: The true light[a], which enlightens every person, was coming into the world.
translation:
  language: pt
  text: A verdadeira luz[a], que ilumina toda pessoa, estava vindo ao mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A verdadeira luz, que ilumina toda pessoa que vem ao mundo.” O particípio grego traduzido por “vindo” pode ser ligado a “toda pessoa”, em vez de à “verdadeira luz”.'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: luz
  rationale: Emprega o substantivo comum e preserva seu valor cristológico no contexto sem recorrer à inicial maiúscula.
- source_word: ἀληθινόν
  choice: verdadeira
  rationale: “Verdadeira” é natural no uso joanino e comunica aquilo que é genuíno e pleno, não apenas factualmente correto.
- source_word: φωτίζει
  choice: ilumina
  rationale: Reproduz de modo conciso tanto a imagem da luz quanto sua força metafórica no contexto.
- source_word: πάντα ἄνθρωπον
  choice: toda pessoa
  rationale: Expressa o singular genérico de modo natural, abrangente e claro no português contemporâneo.
- source_word: ἐρχόμενον εἰς τὸν κόσμον
  choice: estava vindo ao mundo
  rationale: No texto principal, o particípio é entendido em sentido cristológico como referente à luz; a construção com o imperfeito ἦν preserva o aspecto progressivo. A ligação alternativa com “toda pessoa” é registrada em nota.
- source_word: κόσμον
  choice: mundo
  rationale: Equivalente corrente de κόσμος e adequado ao vocabulário joanino.
- source_word: ἦν
  choice: estava
  rationale: Com o particípio “vindo”, forma uma construção progressiva natural que reflete o imperfeito grego.
theological_decisions:
- issue: Ligação sintática de ἐρχόμενον (“vindo/que vem”)
  choice: 'Ligado em sentido a “a verdadeira luz”: “estava vindo ao mundo”.'
  alternative: 'Ligado a “toda pessoa”: “ilumina toda pessoa que vem ao mundo”.'
  rationale: Embora a concordância permita que o particípio modifique ἄνθρωπον, o contexto do prólogo e o uso joanino de “vir ao mundo” favorecem a referência à vinda da Luz. A ambiguidade real é preservada em nota, sem eliminar a leitura alternativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Toda pessoa” evita uma formulação marcada por gênero sem perder a abrangência do singular grego; “estava vindo” mantém a leitura principal e a progressão verbal do original.
