  text: ἔφη· Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Εὐθύνατε τὴν ὁδὸν κυρίου, καθὼς εἶπεν Ἠσαΐας ὁ προφήτης.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/023.yaml
  text: He said[a], “I am a voice of one crying out in the wilderness, ‘Make straight the way of the Lord,’ just as Isaiah the prophet said.”
translation:
  language: pt
  text: 'Ele disse[a]: “Eu sou uma voz de quem clama no deserto: ‘Endireitem o caminho do Senhor’, como disse o profeta Isaías.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, com outra pontuação possível, embora menos provável: “Eu sou uma voz no deserto, de alguém que clama”. A construção grega permite essa ligação diferente, mas o texto principal apresenta a leitura mais natural no contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: Ele disse
  rationale: Forma narrativa comum e natural para introduzir a resposta de João no diálogo.
- source_word: Ἐγὼ
  choice: Eu
  rationale: O pronome explícito mantém a ênfase da autoidentificação, que também soa natural em português.
- source_word: φωνὴ βοῶντος
  choice: a voz de quem clama
  rationale: Reproduz de modo claro a relação genitiva entre “voz” e o particípio, preservando a força da imagem profética sem tornar a frase pesada.
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: “Deserto” é a forma corrente em português para este cenário ermo e conserva a ressonância da citação de Isaías.
- source_word: Εὐθύνατε
  choice: Endireitem
  rationale: Imperativo direto, atual e idiomático, que mantém a imagem de tornar reto o caminho.
- source_word: τὴν ὁδὸν
  choice: o caminho
  rationale: Preserva tanto a imagem concreta quanto sua força metafórica no contexto profético.
- source_word: κυρίου
  choice: do Senhor
  rationale: É a tradução adequada no contexto da citação de Isaías e conserva seu peso teológico.
- source_word: καθὼς
  choice: como
  rationale: Expressa naturalmente a correspondência entre a identificação de João e a declaração profética.
- source_word: εἶπεν
  choice: disse
  rationale: Verbo simples e natural para introduzir o que Isaías declarou.
- source_word: Ἠσαΐας ὁ προφήτης
  choice: o profeta Isaías
  rationale: Ordem corrente em português, sem perda de conteúdo em relação ao grego.
theological_decisions:
- issue: Tradução de κύριος na citação de Isaías
  choice: Senhor
  alternative: senhor
  rationale: A forma titular “Senhor” preserva a referência divina e a ressonância da passagem profética, sem explicitar além do que o texto afirma.
- issue: Relação de “no deserto” com a frase participial
  choice: quem clama no deserto
  alternative: uma voz no deserto, de quem clama
  rationale: A leitura principal liga naturalmente a expressão locativa ao ato de clamar. A outra construção é gramaticalmente possível, por isso a ambiguidade é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A formulação conserva o paralelismo e a força profética da citação sem recorrer a linguagem excessivamente arcaica.
