  text: καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι ⸂Ἐγὼ οὐκ εἰμὶ⸃ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/020.yaml
  text: And he confessed and did not deny[a], but confessed, “I am not the Messiah.”
translation:
  language: pt
  text: 'Ele confessou e não negou, mas confessou: “Eu não sou o Messias.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”. O título grego é Χριστός (Christós). Aqui ele tem sentido messiânico; por isso, o texto principal traz “o Messias”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡμολόγησεν
  choice: confessou / declarou
  rationale: A primeira ocorrência é traduzida por “confessou”, preservando o caráter solene e público da afirmação; na repetição, “declarou” comunica naturalmente em português o mesmo ato de reconhecimento aberto sem produzir uma formulação pesada.
- source_word: οὐκ ἠρνήσατο
  choice: não negou
  rationale: 'Tradução direta que conserva a ênfase retórica da sequência grega: confessou e não negou.'
- source_word: καὶ ... καὶ ... καὶ
  choice: e ... e ... mas
  rationale: Os dois primeiros conectivos preservam a acumulação do grego; “mas” no terceiro introduz com naturalidade a declaração que explicita o que ele não negou.
- source_word: Ἐγὼ οὐκ εἰμὶ
  choice: Eu não sou
  rationale: O pronome explícito “Eu” mantém a ênfase do grego e soa natural na negação direta em português.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Neste contexto, Χριστός funciona como o título do libertador ungido esperado, e não como um nome próprio; “o Messias” preserva esse horizonte judaico.
theological_decisions:
- issue: Tradução de Χριστός como título
  choice: o Messias
  alternative: o Cristo
  rationale: João nega ser o ungido esperado. Como o termo tem função titular neste contexto, “Messias” explicita adequadamente a expectativa messiânica sem impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura enfática do original foi mantida, enquanto a variação “confessou / declarou” evita repetição pouco natural. O marcador da nota foi colocado após a declaração à qual se refere.
