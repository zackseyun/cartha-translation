  - severity: low
    issue: «era anterior a mim» para πρῶτός μου ἦν
    rationale: A formulação é mais abstrata e menos natural do que «era antes de mim». A revisão mantém a ambiguidade entre anterioridade e prioridade sem ampliar o sentido para «existia» no texto principal.
