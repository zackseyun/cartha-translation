  text: οὗτός ἐστιν ⸀ὑπὲρ οὗ ἐγὼ εἶπον· Ὀπίσω μου ἔρχεται ἀνὴρ ὃς ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/030.yaml
  text: This is he of whom I said[a], ‘After me comes a man who ranks before me[b], because he was before me.’
translation:
  language: pt
  text: 'Este é aquele de quem eu disse: “Depois de mim vem um homem que tem precedência sobre mim[a], porque ele era antes de mim[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “passou a estar à minha frente” ou “tem primazia sobre mim”. A expressão grega pode indicar precedência ou posição superior, não apenas sequência temporal.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “já existia antes de mim”. No contexto, a frase aponta para a preexistência de Jesus, embora o grego diga de forma mais compacta que ele “era antes” de João.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν
  choice: Este é aquele
  rationale: Mantém a identificação enfática do demonstrativo com a cópula em português natural.
- source_word: ὑπὲρ οὗ ἐγὼ εἶπον
  choice: a respeito de quem eu disse
  rationale: Neste contexto, ὑπέρ introduz a pessoa sobre quem João havia falado; “a respeito de quem” é claro e corrente.
- source_word: Ὀπίσω μου ἔρχεται
  choice: Depois de mim vem
  rationale: Expressa a sequência temporal e conserva a ordem enfática da frase grega.
- source_word: ἀνὴρ
  choice: um homem
  rationale: Traduz explicitamente o substantivo masculino e sua referência a Jesus como pessoa humana.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: ficou à minha frente
  rationale: O perfeito descreve um estado resultante de precedência. A expressão portuguesa preserva a imagem comparativa e permite tanto a ideia de precedência quanto a de posição superior.
- source_word: ὅτι
  choice: porque
  rationale: Apresenta de modo direto a razão da afirmação anterior.
- source_word: πρῶτός μου ἦν
  choice: era anterior a mim
  rationale: É uma formulação compacta que comunica prioridade sem explicitar além do grego se ela deve ser entendida apenas em sentido temporal ou também como superioridade.
theological_decisions:
- issue: Até que ponto explicitar a preexistência de Cristo na oração final
  choice: era anterior a mim
  alternative: já existia antes de mim
  rationale: O contexto joanino favorece fortemente a preexistência, mas “era anterior a mim” conserva a formulação compacta e parte da tensão entre prioridade temporal e precedência, sem inserir na linha principal o verbo “existir”.
- issue: Sentido de ἔμπροσθέν μου γέγονεν
  choice: ficou à minha frente
  alternative: tem primazia sobre mim
  rationale: A opção principal retém a metáfora espacial e a ambiguidade entre precedência e posição superior; a alternativa explicita o sentido de superioridade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Este é aquele” preserva a solenidade do testemunho; “ficou à minha frente” mantém a imagem e a ambiguidade do original, enquanto as notas registram as leituras mais explícitas.
