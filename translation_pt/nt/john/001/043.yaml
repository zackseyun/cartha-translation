id: JHN.1.43
reference: John 1:43
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ἠθέλησεν ἐξελθεῖν εἰς τὴν Γαλιλαίαν. καὶ εὑρίσκει Φίλιππον καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/043.yaml
  text: The next day he wanted to go out into Galilee[a], and Jesus finds Philip and says to him[c][b], “Follow me.”
translation:
  language: pt
  text: 'No dia seguinte, Jesus quis partir para a Galileia. Encontrou Filipe e lhe disse: “Siga-me.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Siga-me” pode indicar tanto acompanhar Jesus fisicamente quanto tornar-se seu discípulo.
    reason: alternative_reading
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: No dia seguinte
  rationale: Expressão temporal natural em português, que preserva a sequência narrativa.
- source_word: ἠθέλησεν ἐξελθεῖν
  choice: quis partir
  rationale: Mantém o sentido volitivo de θέλω e expressa de modo natural o movimento indicado por ἐξέρχομαι, sem intensificá-lo para 'decidiu'.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: para a Galileia
  rationale: Em português, 'para' expressa naturalmente o movimento em direção à região; uma reprodução rígida como 'para dentro da Galileia' seria pouco idiomática.
- source_word: εὑρίσκει ... λέγει
  choice: Encontrou ... disse
  rationale: Os presentes históricos gregos dão vivacidade à narrativa, mas o pretérito é a forma narrativa mais natural e clara em português.
- source_word: Φίλιππον
  choice: Filipe
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: Ἀκολούθει μοι
  choice: Siga-me
  rationale: Equivalente direto e idiomático que pode indicar tanto acompanhar Jesus quanto tornar-se seu discípulo.
theological_decisions:
- issue: Alcance da ordem de Jesus a Filipe
  choice: “Siga-me” como chamado aberto tanto ao acompanhamento quanto ao discipulado
  alternative: Entender apenas como convite para acompanhar Jesus fisicamente
  rationale: A formulação portuguesa conserva a amplitude de ἀκολούθει μοι no contexto dos Evangelhos, sem explicitar no corpo do texto apenas uma de suas dimensões.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa natural. O nome explícito 'Jesus' foi colocado no início para esclarecer o sujeito implícito de ἠθέλησεν e evitar uma sequência artificial; o referente permanece fiel ao contexto grego. Os presentes históricos foram vertidos pelo pretérito, mais natural na narrativa portuguesa.
