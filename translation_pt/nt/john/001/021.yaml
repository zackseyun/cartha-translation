  text: καὶ ἠρώτησαν αὐτόν· Τί οὖν; ⸂σὺ Ἠλίας εἶ⸃; καὶ λέγει· Οὐκ εἰμί. Ὁ προφήτης εἶ σύ; καὶ ἀπεκρίθη· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/021.yaml
  text: And they asked him[a], “What then? Are you Elijah?” And he says, “I am not.” “Are you the Prophet?” And he answered[b], “No.”
translation:
  language: pt
  text: 'E perguntaram-lhe: “O que, então? Você é Elias?” E ele diz[a]: “Não sou.” “Você é o Profeta[b]?” E ele respondeu: “Não.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega aqui o presente histórico, literalmente “ele diz”, recurso que dá vivacidade à narrativa.
    reason: lexical_alternative
  - marker: b
    text: Ou “aquele Profeta”; provavelmente uma referência ao profeta esperado semelhante a Moisés (Dt 18.15, 18).
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν αὐτόν
  choice: perguntaram a ele
  rationale: O aoristo introduz uma pergunta direta em narrativa simples. A construção é clara no português atual e evita atribuir à pergunta uma intensidade ausente no grego.
- source_word: Τί οὖν;
  choice: Então, o quê?
  rationale: Mantém a formulação curta e abrupta da pergunta de seguimento, sem acrescentar “quem é você?”, que não está expresso no grego.
- source_word: σὺ Ἠλίας εἶ
  choice: Você é Elias?
  rationale: É a ordem interrogativa mais natural no português brasileiro atual. O pronome explícito corresponde a σὺ, e Elias é a forma tradicional do nome em português.
- source_word: Οὐκ εἰμί
  choice: Não sou
  rationale: Reproduz a negação breve da cópula sem acrescentar um complemento como “ele”.
- source_word: λέγει
  choice: ele diz
  rationale: Conserva o presente histórico do texto grego e sua vivacidade narrativa.
- source_word: Ὁ προφήτης
  choice: o Profeta
  rationale: O artigo definido aponta para uma figura específica e esperada. A inicial maiúscula torna perceptível o uso titular sem identificar de modo definitivo o referente.
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: Equivalente narrativo direto e corrente para o verbo de resposta.
- source_word: Οὔ
  choice: Não
  rationale: A partícula negativa isolada funciona como resposta direta e enfática.
theological_decisions:
- issue: Identidade de “o Profeta”
  choice: Manter “o Profeta” no texto principal, sem explicação interpretativa.
  alternative: Identificá-lo diretamente como o profeta semelhante a Moisés de Deuteronômio 18, ou entendê-lo como um profeta qualquer.
  rationale: O artigo grego apresenta uma figura específica conhecida pelos interlocutores, mas o versículo não explica explicitamente sua identidade. A tradução preserva essa tensão, enquanto a nota informa a provável alusão.
- issue: Negação de João a respeito de Elias
  choice: Traduzir simplesmente “Não sou”.
  alternative: Expandir para “Não sou Elias literalmente” ou harmonizar a declaração com passagens que descrevem João em termos ligados a Elias.
  rationale: A resposta direta de João deve permanecer sem uma harmonização interpretativa acrescentada ao texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. As respostas curtas preservam a concisão enfática do grego. “Então, o quê?” mantém deliberadamente a brusquidão da pergunta, e a alternância entre o presente histórico “diz” e o passado “respondeu” acompanha os tempos verbais do original.
