  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/014.yaml
  text: And the Word became flesh and dwelt among us[a], and we saw his glory, glory as of the one and only Son from the Father[b], full of grace and truth.
translation:
  language: pt
  text: E a Palavra se fez carne e habitou entre nós[a]. Vimos a sua glória, glória como a do Filho único procedente do Pai[b], cheio de graça e de verdade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “armou sua tenda entre nós”; o verbo grego evoca a imagem da tenda ou do tabernáculo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Filho unigênito”; também pode transmitir a ideia de “Filho sem igual”.'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: a Palavra
  rationale: Mantém o título joanino consagrado e sua riqueza contextual, sem reduzi-lo a apenas “mensagem” ou “razão”.
- source_word: σὰρξ ἐγένετο
  choice: se fez carne
  rationale: Expressa naturalmente a transição indicada pelo grego e preserva a concretude da existência humana encarnada.
- source_word: ἐσκήνωσεν ἐν ἡμῖν
  choice: habitou entre nós
  rationale: É claro e idiomático em português; a alusão à tenda ou ao tabernáculo é preservada em nota.
- source_word: ἐθεασάμεθα
  choice: Vimos
  rationale: Comunica de modo direto e atual a experiência de testemunho visual, sem o arcaísmo de “contemplamos” como opção obrigatória.
- source_word: δόξαν
  choice: glória
  rationale: É a tradução bíblica consagrada e conserva o peso teológico do termo no contexto joanino.
- source_word: μονογενοῦς
  choice: Filho único
  rationale: No contexto, expressa a singularidade incomparável do Filho em português corrente; a tradução tradicional “unigênito” é registrada em nota.
- source_word: παρὰ πατρός
  choice: que veio do Pai
  rationale: Torna explícita de maneira natural a ideia relacional de procedência/origem expressa por παρά, sem sugerir que a glória, e não o Filho, veio do Pai.
- source_word: πλήρης χάριτος καὶ ἀληθείας
  choice: cheio de graça e de verdade
  rationale: Preserva a formulação familiar e liga corretamente o adjetivo masculino singular à Palavra/ao Filho.
theological_decisions:
- issue: Sentido cristologicamente sensível de μονογενοῦς
  choice: Filho único
  alternative: Filho unigênito; Filho singular
  rationale: “Filho único” comunica principalmente a singularidade, sentido lexical provável no contexto, sem negar a linguagem histórica de geração; “unigênito” permanece em nota por sua importância tradicional e por representar uma tradução possível.
- issue: Alusão ao tabernáculo em ἐσκήνωσεν
  choice: habitou entre nós
  alternative: armou sua tenda entre nós; tabernaculou entre nós
  rationale: A redação principal privilegia clareza e naturalidade, enquanto a nota conserva a imagem veterotestamentária potencialmente evocada pelo verbo.
- issue: Referente de πλήρης
  choice: cheio, no masculino singular
  alternative: cheia, concordando por atração com “glória”
  rationale: A forma grega πλήρης é nominativa masculina singular e retoma a Palavra, apresentada também como o Filho único, não a glória.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação divide o período longo para maior clareza. “A Palavra” preserva o título tradicional; “se fez carne” mantém a força concreta da encarnação. Os marcadores [a] e [b] aparecem no texto principal.
