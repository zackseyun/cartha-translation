- from: E a Palavra se fez carne e habitou entre nós[a]. Vimos a sua glória, glória como a do Filho único que veio do Pai[b], cheio de graça e de verdade.
  to: E a Palavra se fez carne e habitou entre nós[a]. Vimos a sua glória, glória como a do Filho único procedente do Pai[b], cheio de graça e de verdade.
  rationale: 'A revisão substitui “que veio do Pai” por “procedente do Pai”, que reproduz mais exatamente a relação de origem/procedência expressa por παρὰ πατρός sem introduzir uma nuance temporal. A nota de [b] é ajustada para uma formulação portuguesa mais idiomática, preservando “unigênito” como alternativa tradicional e indicando a nuance de unicidade. O masculino “cheio” é mantido: no grego, πλήρης é masculino singular e se refere ao Logos/Filho, que são o mesmo referente no contexto.'
