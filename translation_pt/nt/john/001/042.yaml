id: JHN.1.42
reference: John 1:42
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν. ἐμβλέψας αὐτῷ ὁ Ἰησοῦς εἶπεν· Σὺ εἶ Σίμων ὁ υἱὸς ⸀Ἰωάννου, σὺ κληθήσῃ Κηφᾶς (ὃ ἑρμηνεύεται Πέτρος).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/042.yaml
  text: He brought him to Jesus[a]. Looking at him, Jesus said, “You are Simon, the son of John[b]; you will be called Cephas” (which is translated Peter).
translation:
  language: pt
  text: 'Ele o levou a Jesus. Olhando fixamente para ele, Jesus disse: “Você é Simão, filho de João[a]; será chamado Cefas[b]” (que se traduz por Pedro).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “Jonas” em vez de “João”; o texto do SBLGNT traz “João”.
    reason: textual_variant
  - marker: b
    text: Cefas é o nome semítico correspondente a Pedro; ambos têm o sentido de “rocha” ou “pedra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν
  choice: Ele o levou a Jesus
  rationale: O aoristo de ἄγω indica aqui a ação concluída de levar alguém até uma pessoa; “levou a Jesus” é natural e preserva a direção expressa por πρός com acusativo.
- source_word: ἐμβλέψας αὐτῷ
  choice: Olhando fixamente para ele
  rationale: ἐμβλέπω sugere um olhar dirigido e atento, mais forte que uma olhada casual. A formulação é clara em português atual sem ampliar indevidamente o sentido.
- source_word: Σὺ εἶ Σίμων
  choice: Você é Simão
  rationale: Mantém a interpelação direta do pronome explícito σὺ em português moderno e amplamente compreensível.
- source_word: ὁ υἱὸς Ἰωάννου
  choice: filho de João
  rationale: Segue a leitura Ἰωάννου do SBLGNT. A variante “Jonas” é registrada em nota textual.
- source_word: σὺ κληθήσῃ Κηφᾶς
  choice: será chamado Cefas
  rationale: Preserva o futuro passivo de καλέω e translitera o nome semítico Κηφᾶς segundo a forma portuguesa consagrada, “Cefas”.
- source_word: ὃ ἑρμηνεύεται Πέτρος
  choice: que se traduz por Pedro
  rationale: Reproduz a explicação oferecida pelo próprio texto, mantendo Πέτρος como o nome pessoal português “Pedro”, em vez de substituí-lo no texto principal por seu sentido lexical.
theological_decisions:
- issue: Explicação dos nomes Κηφᾶς e Πέτρος
  choice: Manter “Cefas” e “Pedro” como nomes pessoais no texto principal
  alternative: Traduzir um ou ambos diretamente como “Rocha” ou “Pedra”
  rationale: O versículo descreve a atribuição de um nome e fornece a correspondência entre a forma semítica e a grega. Preservar os nomes evita inserir no texto principal conclusões teológicas posteriores, enquanto a nota comunica o sentido lexical compartilhado.
translation_notes:
  register: Português moderno, digno e de leitura natural, com “você” para a fala direta e as formas portuguesas consagradas dos nomes próprios. “Olhando fixamente” preserva a intensidade provável de ἐμβλέψας sem tornar a frase excessivamente literária. Os marcadores foram colocados junto aos termos a que cada nota efetivamente se refere.
