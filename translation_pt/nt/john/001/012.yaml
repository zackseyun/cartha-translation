id: JHN.1.12
reference: John 1:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/012.yaml
  text: But to all who received him[a], he gave them the right to become children of God—to those who believe in his name,
translation:
  language: pt
  text: Mas todos os que o receberam, ele deu o direito[a] de se tornarem filhos de Deus — aos que creem em seu nome,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a autoridade” ou “o poder” de se tornarem filhos de Deus; o termo grego pode indicar autoridade concedida, direito ou capacidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: todos os que
  rationale: Expressa naturalmente a referência plural inclusiva a todos aqueles que o receberam.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste com a rejeição mencionada no versículo anterior.
- source_word: ἔλαβον αὐτόν
  choice: o receberam
  rationale: Preserva a imagem joanina de acolher ou receber o Logos sem restringi-la ao sentido mais interpretativo de 'aceitar'.
- source_word: ἔδωκεν
  choice: ele deu
  rationale: Tradução direta do aoristo de δίδωμι; a ideia de concessão é comunicada pelo objeto 'o direito'.
- source_word: ἐξουσίαν
  choice: o direito
  rationale: No contexto, indica autorização ou prerrogativa concedida, e não mero poder bruto; 'direito' é claro e natural em português.
- source_word: τέκνα θεοῦ
  choice: filhos de Deus
  rationale: Em português, 'filhos' no plural pode incluir ambos os sexos e é a formulação bíblica natural para τέκνα; o termo grego não limita a condição filial aos homens.
- source_word: γενέσθαι
  choice: de se tornarem
  rationale: Mantém a noção de entrada em uma nova condição, presente em γίνομαι.
- source_word: τοῖς πιστεύουσιν
  choice: aos que creem
  rationale: Reproduz o particípio presente como característica dos que creem, em linguagem corrente e digna.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: em seu nome
  rationale: Conserva explicitamente 'nome' e expressa a confiança dirigida à pessoa e identidade revelada dele.
theological_decisions:
- issue: Relação entre 'receberam-no' e 'creem em seu nome'
  choice: Manter as duas expressões, apresentando a segunda como identificação explicativa dos destinatários.
  alternative: Fundir ambas em uma única expressão, tratando-as como sinônimos exatos.
  rationale: O grego preserva ambas as formulações; mantê-las conserva a textura teológica joanina sem definir além do texto a relação entre receber e crer.
- issue: Sentido do termo de filiação divina
  choice: Usar 'filhos de Deus' em sentido inclusivo.
  alternative: Usar uma formulação especificamente masculina ou substituir por uma paráfrase abstrata.
  rationale: τέκνα é um termo filial abrangente, não especificamente masculino; em português, o plural 'filhos' é a forma natural e inclusiva no contexto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O travessão torna explícita a função explicativa da frase final sem eliminar a ambiguidade relacional do grego.
