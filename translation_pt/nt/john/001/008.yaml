  text: οὐκ ἦν ἐκεῖνος τὸ φῶς, ἀλλ’ ἵνα μαρτυρήσῃ περὶ τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/008.yaml
  text: He was not the light[a], but came to bear witness about the light.
translation:
  language: pt
  text: Ele não era a luz[a], mas veio para dar testemunho da luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Ele não era a luz, mas para que desse testemunho da luz.” No grego, o verbo da segunda oração fica subentendido pelo contexto.'
    reason: alternativa lexical e explicação da elipse
lexical_decisions:
- source_word: οὐκ ἦν
  choice: não era
  rationale: Traduz diretamente o imperfeito negado de εἰμί e expressa de modo natural a negação da identidade de João com a luz.
- source_word: ἐκεῖνος
  choice: Ele
  rationale: Embora seja demonstrativo, aqui funciona como referência pessoal enfática a João; “Ele” é natural em português sem perder o contraste contextual.
- source_word: τὸ φῶς
  choice: a luz
  rationale: Mantém o artigo definido e a referência específica à luz já apresentada no prólogo.
- source_word: ἀλλ’ ἵνα
  choice: mas veio para
  rationale: O grego apresenta uma elipse depois de ἀλλά. “Veio para” explicita de modo idiomático a ideia verbal indicada pelo contexto e introduz a finalidade sem acrescentar uma função teológica alheia ao texto.
- source_word: μαρτυρήσῃ
  choice: dar testemunho
  rationale: Preserva a nuance testemunhal e quase forense de μαρτυρέω, além de soar natural e digna em português.
- source_word: περὶ τοῦ φωτός
  choice: da luz
  rationale: Com “dar testemunho”, a regência idiomática portuguesa “dar testemunho de” comunica naturalmente o sentido de περί com genitivo.
theological_decisions:
- issue: Identidade e papel de João em relação à luz
  choice: O versículo nega que João fosse a luz e declara que sua finalidade era dar testemunho dela.
  alternative: 'Uma forma mais literal seria: “Ele não era a luz, mas para que desse testemunho da luz.”'
  rationale: A formulação mantém a distinção entre a testemunha e a luz, sem desenvolver além do texto a identidade ou a natureza de nenhuma delas. O verbo “veio” supre a elipse grega com base no contexto imediato.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é claro e digno; “dar testemunho” conserva o vocabulário característico do prólogo joanino.
