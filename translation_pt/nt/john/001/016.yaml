  text: ⸀ὅτι ἐκ τοῦ πληρώματος αὐτοῦ ἡμεῖς πάντες ἐλάβομεν, καὶ χάριν ἀντὶ χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/016.yaml
  text: For from his fullness we have all received[a], and grace upon grace.
translation:
  language: pt
  text: Pois todos nós recebemos da sua plenitude, e graça em lugar de graça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “graça sobre graça” ou “uma graça depois de outra”. A expressão grega pode sugerir graça sucessiva, à medida que uma dádiva segue outra, embora ἀντί signifique mais literalmente “em lugar de”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz naturalmente em português a explicação ou fundamento ligado ao contexto anterior, preservando a força causal-explicativa.
- source_word: ἐκ τοῦ πληρώματος αὐτοῦ
  choice: da sua plenitude
  rationale: Mantém a ideia de que aquilo que foi recebido procede da plenitude pertencente ao Verbo, em formulação concisa e natural.
- source_word: ἡμεῖς πάντες
  choice: todos nós
  rationale: Preserva a ênfase do pronome explícito acompanhado de πάντες.
- source_word: ἐλάβομεν
  choice: recebemos
  rationale: O pretérito perfeito português expressa de modo natural o aoristo grego, sem impor explicitamente uma nuance aspectual ausente da forma fonte.
- source_word: καὶ
  choice: e
  rationale: Liga diretamente a expressão seguinte à afirmação anterior sem definir além do necessário a relação entre elas.
- source_word: χάριν ἀντὶ χάριτος
  choice: graça em lugar de graça
  rationale: Preserva a força lexical básica de ἀντί, que pode indicar substituição ou correspondência, sem eliminar a possível ideia contextual de sucessão.
theological_decisions:
- issue: Sentido de χάριν ἀντὶ χάριτος
  choice: graça em lugar de graça
  alternative: graça sobre graça; uma graça depois de outra
  rationale: A expressão grega admite debate entre substituição, correspondência e sucessão. O texto principal mantém a formulação mais próxima da força de ἀντί, enquanto a nota registra leituras idiomáticas sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural e ampla legibilidade brasileira. A repetição de “graça” foi preservada por ser estrutural e semanticamente significativa no grego.
