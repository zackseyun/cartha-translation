  text: εἶδεν ⸀ὁ Ἰησοῦς τὸν Ναθαναὴλ ἐρχόμενον πρὸς αὐτὸν καὶ λέγει περὶ αὐτοῦ· Ἴδε ἀληθῶς Ἰσραηλίτης ἐν ᾧ δόλος οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/047.yaml
  text: Jesus saw Nathanael coming toward him and said about him, “Look, truly an Israelite in whom there is no deceit.”
translation:
  language: pt
  text: 'Jesus viu Natanael se aproximando e disse a respeito dele: “Vejam! Aí está um verdadeiro israelita, em quem não há engano.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: Vejam! Aí está
  rationale: Reproduz a força de chamar a atenção e apontar alguém presente, de modo natural em português.
- source_word: ἀληθῶς Ἰσραηλίτης
  choice: um verdadeiro israelita
  rationale: Expressa o sentido adverbial de ἀληθῶς de modo idiomático, qualificando a autenticidade do israelita.
- source_word: δόλος
  choice: engano
  rationale: Abrange fraude, falsidade ou dolo sem restringir o termo a uma forma jurídica de má-fé.
theological_decisions:
- issue: Alcance do elogio de Jesus a Natanael
  choice: Preservar a formulação “em quem não há engano” sem explicá-la teologicamente
  alternative: Interpretar como ausência absoluta de pecado ou como referência explícita a Jacó/Israel
  rationale: O versículo elogia a falta de engano, mas não define aqui nem impecabilidade nem uma alusão específica; a tradução mantém essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Se aproximando” comunica o movimento em direção a Jesus; “Vejam! Aí está” evita o arcaísmo de “Eis” sem perder a função demonstrativa de Ἴδε.
