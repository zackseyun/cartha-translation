base_translation:
  language: en
  yaml_path: translation/nt/john/001/046.yaml
  text: And Nathanael said to him[a], “Can anything good come from Nazareth?” Philip said to him, “Come and see.”
translation:
  language: pt
  text: 'E Natanael lhe disse: “Pode vir alguma coisa boa de Nazaré?”[a] Filipe lhe disse: “Venha e veja.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Pode alguma coisa boa ser de Nazaré?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ Ναθαναήλ
  choice: Natanael lhe perguntou
  rationale: Em português, o verbo “perguntou” expressa naturalmente que a fala introduzida é interrogativa; o conectivo καί pode ficar implícito sem romper a continuidade narrativa.
- source_word: Ἐκ Ναζαρὲτ
  choice: de Nazaré
  rationale: A preposição ἐκ indica origem ou procedência; “de Nazaré” é a forma natural em português.
- source_word: δύναταί τι ἀγαθὸν εἶναι
  choice: Pode vir alguma coisa boa
  rationale: Embora εἶναι signifique literalmente “ser”, a formulação “vir alguma coisa boa de” comunica de modo idiomático a ideia de origem expressa por ἐκ, preservando a força retórica da pergunta.
- source_word: λέγει αὐτῷ ὁ Φίλιππος
  choice: Filipe lhe respondeu
  rationale: O presente histórico λέγει é vertido no passado, como é natural na narrativa portuguesa; “respondeu” explicita a relação discursiva já evidente no contexto sem alterar seu conteúdo.
- source_word: Ἔρχου καὶ ἴδε
  choice: Venha e veja
  rationale: Mantém os dois imperativos e preserva tanto o convite direto quanto a ressonância joanina do verbo “ver”.
theological_decisions:
- issue: Tom da pergunta de Natanael sobre Nazaré
  choice: Pergunta retórica que transmite ceticismo, sem acrescentar marcas explícitas de sarcasmo ou desprezo.
  alternative: “Pode haver alguma coisa boa em Nazaré?”
  rationale: O grego sugere dúvida quanto à possibilidade de algo bom ter origem em Nazaré, mas não define de modo inequívoco um tom de zombaria.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis. Emprega “venha” em vez do regionalmente marcado “vem” e conserva a concisão do diálogo.
