source:
  edition: SBLGNT
  text: Ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος δι’ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/010.yaml
  text: He was in the world[a], and the world came into being through him[b], and the world did not know him.
translation:
  language: pt
  text: Ele estava no mundo, e o mundo veio a existir[a] por meio dele, e o mundo não o conheceu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi feito”. O verbo grego significa “vir a ser” ou “vir a existir”.'
    reason: lexical_alternative
  - marker: b
    text: “Não o conheceu” também pode ter o sentido de “não o reconheceu” ou “não o admitiu como tal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμῳ / κόσμος
  choice: mundo
  rationale: Mantém a repetição tríplice do grego e preserva a amplitude joanina do termo, que pode abranger a ordem criada, o mundo habitado e a humanidade, sem restringir antecipadamente o sentido.
- source_word: ἦν
  choice: estava
  rationale: O imperfeito indica presença contínua no mundo. “Estava” é a forma natural em português neste contexto e mantém a distinção em relação a ἐγένετο.
- source_word: δι’ αὐτοῦ
  choice: por meio dele
  rationale: διά com o genitivo expressa mediação ou agência. “Por meio dele” comunica isso com clareza e corresponde ao uso de João 1:3.
- source_word: ἐγένετο
  choice: veio a existir
  rationale: Expressa a entrada do mundo na existência e conserva o contraste verbal entre o sujeito, que “estava”, e o mundo, que “veio a existir”.
- source_word: ἔγνω
  choice: não o conheceu
  rationale: Preserva o sentido básico de γινώσκω e sua profundidade relacional em João, sem reduzir o termo apenas a reconhecer ou admitir; essas nuances são registradas em nota.
- source_word: αὐτοῦ / αὐτόν
  choice: dele / o
  rationale: Os pronomes remetem pessoalmente ao Logos no contexto anterior. As formas portuguesas mantêm essa referência masculina e pessoal.
- source_word: καί
  choice: e
  rationale: Reproduz a coordenação repetida das três orações e evita explicitar como adversativa uma relação que o grego deixa a cargo do contexto.
theological_decisions:
- issue: Referente do sujeito implícito
  choice: Empregar “Ele”, com referência pessoal ao Logos do contexto imediato.
  alternative: Usar uma forma impessoal ou repetir “a Palavra”.
  rationale: Embora o substantivo sujeito não seja repetido no versículo, o contexto de João 1:1–9 estabelece uma referência pessoal. “Ele” preserva a continuidade do discurso sem acrescentar identificação ausente do texto.
- issue: Linguagem da criação em relação ao Logos
  choice: Traduzir ἐγένετο por “veio a existir”, distinguindo-o de ἦν, traduzido por “estava”.
  alternative: “Foi feito por meio dele.”
  rationale: 'A alternância entre ἦν e ἐγένετο é significativa no prólogo: o texto apresenta o mundo como aquilo que passou a existir por meio daquele que já estava. A tradução conserva essa distinção sem introduzir terminologia doutrinária posterior.'
- issue: Amplitude de “não o conheceu”
  choice: Manter “não o conheceu”.
  alternative: “Não o reconheceu” ou “não o acolheu como tal”.
  rationale: O verbo pode envolver reconhecimento e admissão relacional, mas a forma mais ampla preserva a tensão e a riqueza semântica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “mundo” e da conjunção “e” foi mantida para refletir a estrutura enfática do grego. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem.
