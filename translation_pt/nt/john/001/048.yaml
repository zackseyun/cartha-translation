source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/048.yaml
  text: Nathanael said to him[a], “How do you know me?” Jesus answered and said to him, “Before Philip called you, while you were under the fig tree, I saw you.”
translation:
  language: pt
  text: 'Natanael lhe perguntou: “Como você me conhece?”[a] Jesus lhe respondeu: “Antes de Filipe chamar você, quando você estava debaixo da figueira, eu vi você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “De onde você me conhece?”
    reason: Preserva a alternativa lexical literal para Πόθεν, enquanto o texto principal traduz o sentido idiomático da pergunta.
lexical_decisions:
- source_word: Πόθεν με γινώσκεις;
  choice: De onde você me conhece?
  rationale: Preserva a formulação e a ambiguidade do grego — literalmente, “de onde” — e soa natural em português como pergunta sobre a origem ou base do conhecimento de Jesus.
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Jesus lhe respondeu
  rationale: Em português atual, “respondeu e disse” seria uma reprodução semítica possível, mas pesada; “lhe respondeu” comunica naturalmente os dois verbos no contexto.
- source_word: Πρὸ τοῦ σε Φίλιππον φωνῆσαι
  choice: Antes que Filipe chamasse você
  rationale: Expressa com clareza a anterioridade marcada por Πρὸ τοῦ com infinitivo. “Chamasse” preserva o sentido comum de φωνέω no contexto.
- source_word: ὄντα ὑπὸ τὴν συκῆν
  choice: debaixo da figueira
  rationale: O particípio indica a circunstância em que Jesus viu Natanael. A construção portuguesa permite integrá-la diretamente a “vi você”, sem acrescentar uma relação temporal mais específica.
- source_word: εἶδόν σε
  choice: eu vi você
  rationale: Traduz diretamente o aoristo indicativo; a anterioridade em relação ao chamado de Filipe já está marcada por “antes que”.
theological_decisions:
- issue: Natureza do conhecimento de Jesus sobre Natanael
  choice: Apresentar diretamente que Jesus o viu antes do chamado de Filipe, sem explicar como isso ocorreu.
  alternative: Explicitar que se tratava de visão sobrenatural ou, no sentido oposto, de mera observação comum.
  rationale: O versículo não define o mecanismo desse conhecimento. A tradução preserva a tensão narrativa e evita impor uma interpretação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “você” para clareza natural e “Natanael”, “Filipe” e “figueira” nas formas correntes. A ordem da última frase evita a possível leitura de que Filipe chamou Natanael enquanto ele ainda estava debaixo da figueira.
