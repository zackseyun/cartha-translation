id: JHN.1.32
reference: John 1:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐμαρτύρησεν Ἰωάννης λέγων ὅτι Τεθέαμαι τὸ πνεῦμα καταβαῖνον ⸀ὡς περιστερὰν ἐξ οὐρανοῦ, καὶ ἔμεινεν ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/032.yaml
  text: And John testified[a], saying, “I have seen the Spirit descending like a dove out of heaven[b], and it remained on him.”
translation:
  language: pt
  text: 'E João testemunhou, dizendo: “Vi o Espírito descer do céu[b] como uma pomba[a] e permanecer sobre ele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, à maneira de uma pomba; a expressão grega indica comparação.
    reason: Esclarece a força comparativa de ὡς sem definir a forma exata da manifestação.
  - marker: b
    text: Ou “procedente do céu”.
    reason: Registra uma alternativa natural para a ideia de origem e movimento expressa por ἐξ οὐρανοῦ.
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: testemunhou
  rationale: Preserva a ideia de prestar testemunho e soa natural no registro narrativo e solene do Evangelho.
- source_word: λέγων
  choice: dizendo
  rationale: Reflete o particípio grego que introduz o conteúdo do testemunho de João.
- source_word: Τεθέαμαι
  choice: Vi
  rationale: O perfeito grego apresenta João como testemunha ocular, com relevância presente. Em português corrente, “vi” comunica isso com mais naturalidade do que “tenho visto”, que poderia sugerir uma ação repetida ou contínua.
- source_word: τὸ πνεῦμα
  choice: o Espírito
  rationale: O contexto imediato identifica o referente como o Espírito Santo; a inicial maiúscula sinaliza esse referente sem acrescentar palavras ao texto.
- source_word: καταβαῖνον
  choice: descer
  rationale: O infinitivo após “vi” é uma construção portuguesa natural para o particípio grego de movimento descendente.
- source_word: ὡς περιστερὰν
  choice: como uma pomba
  rationale: ὡς marca comparação. A formulação preserva a imagem sem afirmar que o Espírito fosse literalmente uma pomba.
- source_word: ἐξ οὐρανοῦ
  choice: vindo do céu
  rationale: Expressa a origem e o movimento para fora indicado por ἐξ, evitando uma sequência menos natural como “descer para fora do céu”.
- source_word: ἔμεινεν
  choice: permaneceu
  rationale: Mantém a força de μένω e sua importante recorrência temática no Evangelho de João.
- source_word: ἐπ’ αὐτόν
  choice: sobre ele
  rationale: Traduz naturalmente a relação expressa por ἐπί; no contexto, “ele” se refere a Jesus.
theological_decisions:
- issue: Identificação de τὸ πνεῦμα
  choice: “o Espírito”, com referência ao Espírito Santo
  alternative: “o espírito”, entendido de modo genérico
  rationale: João 1:32–33 apresenta o Espírito como o sinal divino relacionado àquele que batiza no Espírito Santo. A capitalização explicita o referente contextual sem ampliar a afirmação do texto.
- issue: Força de ὡς περιστερὰν
  choice: 'comparação: “como uma pomba”'
  alternative: identificação ou forma literal de pomba
  rationale: A partícula ὡς expressa semelhança. A tradução conserva a imagem e não define além do grego a natureza exata da manifestação.
- issue: Sujeito de ἔμεινεν
  choice: sujeito implícito retomando “o Espírito”
  alternative: repetir “o Espírito” ou empregar “ele” como sujeito explícito
  rationale: O português permite manter o sujeito implícito, como no grego, e assim evita a sequência ambígua “ele permaneceu sobre ele”, sem alterar o referente contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para evitar ambiguidade e tornar natural a relação entre a descida, a comparação com a pomba e a origem celestial.
