  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ἵνα φανερωθῇ τῷ Ἰσραὴλ διὰ τοῦτο ἦλθον ἐγὼ ⸀ἐν ὕδατι βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/031.yaml
  text: 'And I did not know him[a], but for this reason I came baptizing in water: that he might be revealed to Israel.'
translation:
  language: pt
  text: E eu não o conhecia[a], mas vim batizando em água para que ele fosse revelado a Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não o reconhecia”. O grego pode indicar tanto falta de conhecimento pessoal quanto falta de reconhecimento; o texto principal mantém a expressão mais ampla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Eu
  rationale: A conjunção liga este testemunho ao contexto anterior, mas, em português, a continuidade já é natural; o pronome explícito preserva a leve ênfase de ἐγώ sem tornar a frase pesada.
- source_word: οὐκ ᾔδειν αὐτόν
  choice: não o conhecia
  rationale: O imperfeito descreve um estado passado de não conhecimento. A formulação mantém o sentido amplo do grego, sem decidir se se trata de falta de convivência pessoal ou de reconhecimento da identidade de Jesus.
- source_word: ἀλλ’
  choice: mas
  rationale: Marca de modo natural o contraste entre o não conhecimento anterior de João e a finalidade de sua atividade batismal.
- source_word: ἵνα φανερωθῇ τῷ Ἰσραὴλ
  choice: para que ele fosse revelado a Israel
  rationale: Preserva tanto a finalidade introduzida por ἵνα quanto a voz passiva de φανερωθῇ; 'a Israel' reproduz adequadamente o referente coletivo no dativo.
- source_word: διὰ τοῦτο ἦλθον ἐγὼ
  choice: foi ... que vim
  rationale: A construção clivada portuguesa expressa a força explicativa de διὰ τοῦτο e a ênfase do pronome explícito, ligando claramente a vinda de João à finalidade subsequente.
- source_word: ἐν ὕδατι βαπτίζων
  choice: batizando em água
  rationale: '''Em água'' conserva a preposição ἐν e permanece compreensível em português; o gerúndio representa a ação contemporânea do particípio βαπτίζων sem especificar um modo ritual além do texto.'
theological_decisions:
- issue: Sentido da afirmação de João de que não conhecia Jesus
  choice: não o conhecia
  alternative: não o reconhecia; não sabia que ele era o Messias
  rationale: O versículo não define em que sentido João não o conhecia. A tradução mantém a amplitude lexical e a tensão do texto, sem acrescentar uma harmonização biográfica ou uma identificação messiânica explícita.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A ordem foi ajustada para uma construção focal natural em português, preservando a finalidade e a ênfase do original.
