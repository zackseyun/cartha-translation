base_translation:
  language: en
  yaml_path: translation/nt/john/001/015.yaml
  text: John testifies about him and has cried out[a], saying, “This was he of whom I said, ‘The one coming after me has become before me[b], because he was before me.’”
translation:
  language: pt
  text: 'João dá testemunho a respeito dele e clamou em alta voz[a], dizendo: “Este era aquele de quem eu disse: ‘Aquele que vem depois de mim passou à minha frente[b], porque já era antes de mim[c]’.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, refletindo o perfeito grego: “tem clamado”. O perfeito apresenta o clamor como um ato realizado cuja força ou relevância permanece.'
    reason: aspectual_alternative
  - marker: b
    text: 'Ou: “assumiu precedência sobre mim” ou “tornou-se superior a mim”. A expressão grega pode indicar prioridade ou posição, além de sequência.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “porque já existia antes de mim”. A tradução no texto segue mais de perto a formulação grega, deixando que o contexto comunique a preexistência.'
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: dá testemunho
  rationale: Preserva o sentido testemunhal e quase forense do presente grego, em formulação bíblica ainda clara no português moderno.
- source_word: περὶ αὐτοῦ
  choice: a respeito dele
  rationale: Equivalente natural de περί com genitivo, sem a rigidez de “acerca dele”.
- source_word: κέκραγεν
  choice: tem clamado
  rationale: Procura conservar o perfeito grego, que apresenta o clamor passado com relevância ou efeito ainda vigente; a nota oferece uma forma portuguesa mais idiomática.
- source_word: Οὗτος ἦν ὃν εἶπον
  choice: Este era aquele de quem eu disse
  rationale: Mantém o passado de ἦν e a construção relativa, com dignidade e clareza.
- source_word: Ὁ ὀπίσω μου ἐρχόμενος
  choice: Aquele que vem depois de mim
  rationale: Expressa naturalmente o particípio substantivado e conserva a ideia de sequência, sem decidir por si só se ela é temporal ou ministerial.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: passou à minha frente
  rationale: Português natural que conserva a metáfora comparativa e o perfeito de γίνομαι de modo mais inteligível que o literal “tornou-se diante de mim”; pode indicar precedência ou superioridade.
- source_word: ὅτι
  choice: porque
  rationale: Apresenta claramente a razão dada para a afirmação precedente.
- source_word: πρῶτός μου ἦν
  choice: já era antes de mim
  rationale: Conserva a prioridade expressa pelo grego e sugere a anterioridade relevante no contexto, sem inserir explicitamente o verbo “existir”.
theological_decisions:
- issue: Grau de explicitação da preexistência de Cristo na cláusula final
  choice: “já era antes de mim”
  alternative: “já existia antes de mim”
  rationale: O contexto joanino sustenta fortemente a preexistência, mas o grego emprega εἰμί, não um verbo lexical explícito para “existir”. A redação escolhida preserva a força teológica e a tensão do original sem explicação incorporada.
- issue: Sentido de ἔμπροσθέν μου γέγονεν
  choice: “passou à minha frente”
  alternative: “tornou-se superior a mim” / “assumiu precedência sobre mim”
  rationale: A expressão pode comunicar precedência de posição ou categoria, além da imagem de sequência. A tradução mantém a metáfora sem reduzir a declaração a uma única interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “tem clamado” é deliberadamente mais formal para refletir o perfeito grego e vem acompanhada de alternativa idiomática. As ambiguidades de precedência, categoria e anterioridade são preservadas por notas.
