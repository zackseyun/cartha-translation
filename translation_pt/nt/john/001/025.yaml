source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/025.yaml
  text: And they asked him and said to him[a], “Why then are you baptizing, if you are not the Messiah, nor Elijah[b], nor the Prophet?”
translation:
  language: pt
  text: 'E perguntaram-lhe e disseram-lhe: “Por que, então, você batiza, se você não é o Messias[a], nem Elias, nem o Profeta[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Cristo”. O título grego Χριστός (Christós) corresponde a “Messias” e é traduzido assim aqui para preservar o contexto da expectativa judaica.
    reason: alternative_reading
  - marker: b
    text: “O Profeta” provavelmente se refere ao profeta esperado semelhante a Moisés (ver Deuteronômio 18:15).
    reason: cross_reference
lexical_decisions:
- source_word: ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ
  choice: lhe perguntaram
  rationale: 'Em português natural, a fórmula dupla semítica pode ser condensada sem perda do sentido: a fala que segue é a própria pergunta. Reproduzir literalmente “perguntaram-lhe e disseram-lhe” seria possível, mas menos corrente.'
- source_word: Τί οὖν βαπτίζεις
  choice: Por que, então, você batiza
  rationale: Neste contexto, τί pede a razão ou a justificativa da ação; οὖν é preservado por “então”. O presente “batiza” expressa a prática em curso de João de modo idiomático em português.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Χριστός funciona aqui como título ligado à expectativa judaica; “Messias” comunica esse valor com maior clareza do que o uso quase nominal de “Cristo”.
- source_word: Ἠλίας
  choice: Elias
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: ὁ προφήτης
  choice: o Profeta
  rationale: O artigo e o contexto apontam para uma figura esperada específica. A inicial maiúscula assinala o uso titular sem acrescentar uma identificação explícita ao texto.
- source_word: οὐδὲ ... οὐδὲ
  choice: nem ... nem
  rationale: A correlação portuguesa reproduz naturalmente as alternativas coordenadas sob a negação iniciada por “não”.
theological_decisions:
- issue: Tradução de Χριστός na pergunta sobre a identidade de João
  choice: Messias
  alternative: Cristo
  rationale: O termo é um título neste diálogo e evoca diretamente a esperança messiânica judaica; a alternativa tradicional é registrada em nota para preservar a correspondência lexical.
- issue: Caráter específico de ὁ προφήτης
  choice: o Profeta
  alternative: o profeta
  rationale: A expressão designa uma figura reconhecida na expectativa dos interlocutores, provavelmente relacionada ao profeta semelhante a Moisés, mas a tradução não torna essa identificação mais certa do que o próprio contexto permite.
- issue: Explicitação da provável alusão a Deuteronômio 18:15
  choice: manter apenas “o Profeta” no texto e explicar a provável referência em nota
  alternative: traduzir ou parafrasear como “o profeta semelhante a Moisés”
  rationale: A paráfrase resolveria uma identificação que permanece implícita no grego; a nota oferece o contexto sem incorporá-lo ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “você” por clareza contemporânea, sem coloquialismo excessivo. A duplicação grega “perguntaram... e disseram” foi condensada em “perguntaram”, enquanto “então” e as duas negações correlativas foram preservados.
