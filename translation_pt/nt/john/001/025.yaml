  naturalness: “E perguntaram-lhe e disseram-lhe” é uma formulação um pouco mais formal, mas continua clara e natural no registro bíblico moderno e preserva uma ênfase narrativa presente no original. “Por que, então, você batiza...” é idiomático e apropriado para leitores brasileiros e internacionais.
  terminology: “Messias” representa bem ὁ χριστός como título; a nota registra adequadamente “o Cristo” como alternativa. “Elias” é a forma portuguesa estabelecida. “O Profeta”, com maiúscula, preserva o provável caráter titular de ὁ προφήτης sem incorporar ao texto a identificação explicativa da nota.
