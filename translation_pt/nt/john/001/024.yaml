  text: ⸀Καὶ ἀπεσταλμένοι ἦσαν ἐκ τῶν Φαρισαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/024.yaml
  text: And they had been sent from the Pharisees[a].
translation:
  language: pt
  text: E os que tinham sido enviados eram dos fariseus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E eles tinham sido enviados pelos fariseus”. O grego indica mais literalmente que eles eram dos fariseus.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Conjunção simples que mantém a continuidade narrativa sem acrescentar nuance temporal ou discursiva.
- source_word: ἀπεσταλμένοι ἦσαν
  choice: os que tinham sido enviados
  rationale: A construção perifrástica com particípio perfeito e ἦσαν indica um envio já realizado, com estado resultante; esta formulação é natural em português e preserva o valor verbal.
- source_word: ἐκ
  choice: dos
  rationale: Neste contexto, ἐκ com o genitivo marca mais diretamente origem ou procedência. A formulação evita converter a preposição em indicação inequívoca de agência.
- source_word: τῶν Φαρισαίων
  choice: fariseus
  rationale: Forma portuguesa corrente do nome do grupo; a contração em «dos» já incorpora o artigo grego.
theological_decisions:
- issue: Relação dos enviados com os fariseus
  choice: Os enviados eram provenientes do grupo dos fariseus.
  alternative: Eles tinham sido enviados pelos fariseus, com ênfase na agência.
  rationale: O grego emprega ἐκ com o genitivo, que expressa diretamente origem ou procedência, não o agente de forma explícita. A tradução mantém essa ambiguidade contextual sem negar que os fariseus possam ter patrocinado o envio.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para soar natural, preservando a conexão com o contexto anterior e a distinção entre origem e agência.
