id: JHN.1.34
reference: John 1:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κἀγὼ ἑώρακα, καὶ μεμαρτύρηκα ὅτι οὗτός ἐστιν ὁ ⸀ἐκλεκτὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/034.yaml
  text: And I have seen and have testified that this is the Chosen One of God[a].
translation:
  language: pt
  text: E eu vi e testemunhei que este é o Escolhido de Deus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem «o Filho de Deus» em vez de «o Escolhido de Deus».
    reason: textual_variant
lexical_decisions:
- source_word: κἀγώ
  choice: E eu
  rationale: Preserva tanto a continuidade expressa por καί quanto a ênfase do pronome explícito ἐγώ, sem tornar a frase artificial.
- source_word: ἑώρακα
  choice: vi
  rationale: Embora seja perfeito, em português moderno o pretérito perfeito simples expressa naturalmente a experiência concluída de João cujo valor permanece no contexto; «tenho visto» sugeriria repetição ou continuidade não exigida pelo grego.
- source_word: μεμαρτύρηκα
  choice: testemunhei
  rationale: O pretérito perfeito simples é a forma natural em português para o ato concluído de dar testemunho, cuja validade contínua decorre do contexto; evita o sentido iterativo de «tenho testemunhado».
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo do testemunho, e não uma oração causal.
- source_word: οὗτός
  choice: este
  rationale: Mantém a força demonstrativa e a referência direta a Jesus de modo natural em português.
- source_word: ἐκλεκτός
  choice: Escolhido
  rationale: O adjetivo com artigo é substantivado. «O Escolhido» comunica de maneira clara e digna o título aplicado a Jesus; a inicial maiúscula sinaliza o uso titular sem acrescentar conteúdo ao texto.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Reproduz de maneira direta e natural a construção genitiva do título, sem especificar além do texto se a relação é de origem, posse ou designação.
theological_decisions:
- issue: Título cristológico em João 1:34
  choice: o Escolhido de Deus
  alternative: o Filho de Deus
  rationale: O texto apresentado do SBLGNT traz ὁ ἐκλεκτὸς τοῦ θεοῦ e, por isso, a tradução principal conserva «o Escolhido de Deus». A variante cristologicamente relevante «o Filho de Deus» é registrada em nota, sem substituir nem harmonizar a leitura do texto-base.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Os perfeitos gregos foram vertidos pelo pretérito perfeito simples, mais idiomático neste contexto, sem perder a validade presente do testemunho. A estrutura concisa e enfática do original foi preservada.
