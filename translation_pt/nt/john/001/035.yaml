base_translation:
  language: en
  yaml_path: translation/nt/john/001/035.yaml
  text: On the next day[a], John was standing there again, and two of his disciples were with him.
translation:
  language: pt
  text: No dia seguinte, João estava novamente de pé, e dois dos seus discípulos estavam com ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: No dia seguinte
  rationale: A expressão temporal idiomática indica o dia posterior e soa natural no português contemporâneo.
- source_word: πάλιν
  choice: novamente
  rationale: Marca a repetição e mantém a continuidade com a cena anterior.
- source_word: εἱστήκει
  choice: estava ... ali
  rationale: A forma verbal descreve um estado contínuo no passado. “Estava ali” comunica naturalmente a presença ou posição de João; “ali” é uma explicitação contextual, não uma palavra expressa no grego.
- source_word: ὁ Ἰωάννης
  choice: João
  rationale: Forma portuguesa tradicional do nome. Embora o contexto identifique João Batista, o texto grego diz apenas “João”.
- source_word: καὶ
  choice: com
  rationale: Neste contexto, “com” expressa em português natural a presença conjunta de João e dos dois discípulos, sem exigir a repetição de um verbo elíptico.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: dois dos seus discípulos
  rationale: 'Preserva o sentido partitivo de ἐκ: eram dois dentre o grupo de discípulos de João.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução principal privilegia fluidez narrativa, enquanto a nota registra uma representação mais formal da postura e da construção coordenada. O marcador [a] aparece no texto principal.
