  terminology: “Espírito” e “Espírito Santo” refletem adequadamente o referente contextual de πνεῦμα e πνεύματι ἁγίῳ. “Batizar em água” e “batiza no Espírito Santo” preservam de forma coerente o paralelismo de ἐν, embora “com” seja uma alternativa idiomática possível, corretamente não imposta. A nota para “não o reconhecia” registra uma possibilidade lexical legítima sem deslocar o sentido principal.
