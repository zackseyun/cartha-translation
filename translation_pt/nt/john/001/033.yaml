  source_fidelity: 'O texto traduz com fidelidade os elementos centrais do grego: κἀγώ é adequadamente expresso por “E eu”; o imperfeito οὐκ ᾔδειν por “não o conhecia”; o particípio substantivado por “aquele que me enviou”; e a fórmula identificadora final por “esse é quem batiza”. A construção “sobre quem você vir o Espírito descer e permanecer” comunica naturalmente o sinal descrito por Ἐφ’ ὃν ἂν ἴδῃς ... καταβαῖνον καὶ μένον ἐπ’ αὐτόν, sem restringir indevidamente seu sentido.'
