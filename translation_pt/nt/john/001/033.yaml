id: JHN.1.33
reference: John 1:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/033.yaml
  text: And I did not know him[a], but the one who sent me to baptize in water said to me, ‘The one on whom you see the Spirit descending and remaining on him[c][b], this is he who baptizes in the Holy Spirit.’
translation:
  language: pt
  text: 'E eu não o conhecia[a], mas aquele que me enviou para batizar em água me disse: “Aquele sobre quem você vir o Espírito descer e permanecer, esse é quem batiza no Espírito Santo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não o reconhecia”. O grego pode indicar tanto não conhecer alguém quanto ainda não o reconhecer ou identificar nesse contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ οὐκ ᾔδειν αὐτόν
  choice: E eu não o conhecia
  rationale: Preserva a conexão e a ênfase de κἀγώ e traduz diretamente οὐκ ᾔδειν; em contexto, o verbo também pode indicar que João ainda não o reconhecia ou identificava.
- source_word: ὁ πέμψας με
  choice: aquele que me enviou
  rationale: Reproduz naturalmente o particípio substantivado definido, sem recorrer a formulação arcaizante.
- source_word: βαπτίζειν ἐν ὕδατι
  choice: batizar em água
  rationale: Mantém a preposição ἐν e o paralelismo verbal e preposicional com ἐν πνεύματι ἁγίῳ no fim do versículo.
- source_word: Ἐφ’ ὃν ἂν ἴδῃς
  choice: Aquele sobre quem você vir
  rationale: Exprime o sinal identificador e conserva a construção relativa e a referência aberta do grego.
- source_word: τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν
  choice: o Espírito descer e permanecer
  rationale: Os infinitivos flexionados após 'vir' traduzem os particípios presentes com naturalidade. 'Permanecer' preserva um verbo-chave joanino. O complemento 'sobre ele' não é repetido porque 'sobre quem' rege naturalmente os dois verbos em português.
- source_word: οὗτός ἐστιν ὁ βαπτίζων
  choice: esse é quem batiza
  rationale: Mantém a força demonstrativa da fórmula de identificação e traduz o particípio substantivado em português corrente.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: no Espírito Santo
  rationale: Conserva ἐν como 'em' e identifica o referente divino explicitamente qualificado como santo.
theological_decisions:
- issue: Sentido de οὐκ ᾔδειν
  choice: não o conhecia
  alternative: não o reconhecia
  rationale: A tradução principal mantém o sentido lexical mais direto sem decidir se a falta de conhecimento era ausência de convivência pessoal ou de reconhecimento da identidade revelada; a alternativa é registrada em nota.
- issue: Preposição nas duas expressões batismais
  choice: batizar em água ... batiza no Espírito Santo
  alternative: batizar com água ... batiza com o Espírito Santo
  rationale: A repetição de 'em' preserva o mesmo ἐν grego e o paralelismo entre as duas expressões, sem definir além do texto a natureza exata da relação entre o batismo e água/Espírito.
- issue: Identificação e capitalização de πνεῦμα
  choice: o Espírito ... o Espírito Santo
  alternative: o espírito ... espírito santo
  rationale: O contexto imediato identifica o Espírito que desce com o Espírito Santo mencionado ao fim; a capitalização indica o referente, sem acrescentar conteúdo ao grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação evita arcaísmos, preserva o paralelismo de ἐν e mantém 'permanecer' por sua relevância no vocabulário joanino.
