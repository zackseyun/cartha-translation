id: JHN.1.7
reference: John 1:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/007.yaml
  text: He came as a witness[a], so that he might testify about the Light[b], so that all might believe through him.
translation:
  language: pt
  text: Ele veio como testemunha, para dar testemunho a respeito da Luz, a fim de que todos cressem por meio dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, por meio de João e de seu testemunho; alguns entendem que “dele” se refere à Luz.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  choice: Ele
  rationale: O demonstrativo retoma João, apresentado no versículo anterior. Em português corrente, o pronome preserva claramente a referência sem a rigidez de “este” ou “este homem”.
- source_word: ἦλθεν
  choice: veio
  rationale: Tradução direta e natural do aoristo de ἔρχομαι, preservando o movimento narrativo.
- source_word: εἰς μαρτυρίαν
  choice: como testemunha
  rationale: Expressa de modo idiomático a função para a qual João veio, mantendo o campo semântico testemunhal de μαρτυρία.
- source_word: ἵνα μαρτυρήσῃ
  choice: para dar testemunho
  rationale: Preserva a finalidade introduzida por ἵνα e mantém a ligação lexical com “testemunha”, em linguagem bíblica ainda corrente e compreensível.
- source_word: περὶ τοῦ φωτός
  choice: a respeito da Luz
  rationale: περί com genitivo indica o assunto do testemunho. A inicial maiúscula sinaliza que “Luz” funciona no contexto como designação pessoal, não como luz física.
- source_word: ἵνα πάντες πιστεύσωσιν
  choice: a fim de que todos cressem
  rationale: A segunda oração final é mantida de forma distinta e natural; “todos” reproduz a abrangência não qualificada de πάντες.
- source_word: πιστεύσωσιν
  choice: cressem
  rationale: O verbo “crer” é a correspondência portuguesa convencional e natural para πιστεύω neste contexto; o imperfeito do subjuntivo acompanha a oração final dependente de um verbo no passado.
- source_word: δι’ αὐτοῦ
  choice: por meio dele
  rationale: διά com genitivo exprime meio ou agência. A formulação preserva a referência pronominal sem inserir “testemunho” no corpo do texto.
theological_decisions:
- issue: Referente de αὐτοῦ em δι’ αὐτοῦ
  choice: O pronome é mantido no texto, com João como referente contextual mais provável.
  alternative: O pronome pode ser entendido como referência à Luz.
  rationale: João é o sujeito humano em foco e o contexto imediato o distingue da Luz; contudo, a forma grega não identifica expressamente o referente. A nota preserva a possibilidade minoritária sem sobrecarregar o texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Dar testemunho” conserva a repetição intencional entre μαρτυρία e μαρτυρέω; as duas orações de finalidade do grego permanecem perceptíveis. O único marcador de nota aparece no texto após o pronome cuja referência é discutida.
