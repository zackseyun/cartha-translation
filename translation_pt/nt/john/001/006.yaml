  yaml_path: translation/nt/john/001/006.yaml
  text: There was a man sent from God[a], whose name was John.
translation:
  language: pt
  text: Surgiu um homem enviado da parte de Deus, cujo nome era João.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο
  choice: Surgiu
  rationale: Aqui, γίνομαι introduz uma nova personagem na narrativa. “Surgiu” é natural em português e comunica sua entrada em cena sem sugerir que tenha sido criado naquele momento.
- source_word: ἄνθρωπος
  choice: um homem
  rationale: O substantivo se refere a um indivíduo masculino, João; “um homem” é claro e natural.
- source_word: ἀπεσταλμένος
  choice: enviado
  rationale: Preserva o sentido passivo do particípio perfeito e apresenta João como alguém incumbido de uma missão.
- source_word: παρὰ θεοῦ
  choice: da parte de Deus
  rationale: παρά com o genitivo indica a origem da missão. “Da parte de Deus” preserva essa ideia e, no contexto de “enviado”, também comunica a comissão divina sem reduzir a expressão apenas à agência.
- source_word: ὄνομα αὐτῷ Ἰωάννης
  choice: cujo nome era João
  rationale: Reproduz de modo natural a expressão identificadora grega, sem a condensar em “chamado João”.
- source_word: Ἰωάννης
  choice: João
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Natureza da missão de João
  choice: João é apresentado como enviado da parte de Deus.
  alternative: João foi enviado por Deus.
  rationale: A combinação de ἀπεσταλμένος com παρὰ θεοῦ indica uma missão cuja origem está em Deus. “Da parte de Deus” mantém em primeiro plano essa origem sem acrescentar ao texto uma definição específica do ofício de João.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Surgiu” introduz João de maneira fluente; “da parte de Deus” preserva a nuance de origem presente em παρά com genitivo.
