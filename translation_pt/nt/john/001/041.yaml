  text: εὑρίσκει οὗτος ⸀πρῶτον τὸν ἀδελφὸν τὸν ἴδιον Σίμωνα καὶ λέγει αὐτῷ· Εὑρήκαμεν τὸν Μεσσίαν (ὅ ἐστιν μεθερμηνευόμενον χριστός).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/041.yaml
  text: He first found his own brother Simon and said to him[a], “We have found the Messiah” (which means Messiah).
translation:
  language: pt
  text: 'Ele encontrou primeiro seu próprio irmão, Simão, e lhe disse: “Encontramos o Messias” (que se traduz por Cristo).'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρίσκει
  choice: encontrou
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma natural da narrativa em português, sem alterar o sentido do acontecimento.
- source_word: οὗτος
  choice: ele
  rationale: O demonstrativo retoma André no contexto; o pronome é a forma natural em português.
- source_word: πρῶτον
  choice: primeiro
  rationale: Preserva o valor temporal ou sequencial do advérbio, embora a posição no grego admita alguma discussão textual e sintática.
- source_word: ἀδελφὸν τὸν ἴδιον
  choice: seu próprio irmão
  rationale: Mantém a ênfase de ἴδιον e identifica corretamente a relação masculina no contexto.
- source_word: Σίμωνα
  choice: Simão
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: λέγει αὐτῷ
  choice: lhe disse
  rationale: Converte o presente histórico para o passado narrativo e conserva a ideia de fala dirigida a Simão.
- source_word: Εὑρήκαμεν
  choice: Encontramos
  rationale: O perfeito grego exprime uma descoberta consumada com relevância presente; no português corrente, o pretérito perfeito comunica isso com naturalidade.
- source_word: Μεσσίαν
  choice: Messias
  rationale: Translitera o título semítico e preserva seu contexto judaico.
- source_word: μεθερμηνευόμενον
  choice: traduzido
  rationale: Indica explicitamente que o evangelista fornece o equivalente grego do título semítico.
- source_word: χριστός
  choice: Cristo
  rationale: Representa o equivalente grego tradicional de Messias e conserva a distinção entre o termo semítico Μεσσίας e sua tradução grega χριστός.
theological_decisions:
- issue: Tradução dos títulos messiânicos no parêntese explicativo
  choice: “Messias” para Μεσσίαν e “Cristo” para χριστός
  alternative: “Messias” para ambos, ou “Ungido” no parêntese
  rationale: O texto distingue o título semítico de seu equivalente grego. Usar “Cristo” no parêntese preserva a função tradutória e a forma historicamente reconhecida, sem apagar a relação semântica entre os termos.
- issue: Referente implícito de οὗτος
  choice: “Ele”, retomando André
  alternative: “Este”
  rationale: O contexto identifica André, mas o versículo não repete seu nome; o pronome evita inserir material ausente e mantém a ligação contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha o grego de perto sem conservar artificialmente os presentes históricos. Não há marcadores de nota, pois nenhuma nota é necessária para esta redação.
