  text: καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/005.yaml
  text: And the light shines in the darkness[a], and the darkness has not overcome it.
translation:
  language: pt
  text: E a luz brilha nas trevas, e as trevas não a venceram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «as trevas não a compreenderam» ou «não a apreenderam». O verbo grego pode ter o sentido de vencer/dominar ou o de apreender/compreender.'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: a luz
  rationale: Mantém o artigo definido e a referência temática à luz já estabelecida no prólogo.
- source_word: σκοτίᾳ / σκοτία
  choice: nas trevas / as trevas
  rationale: «Trevas» é a formulação portuguesa natural e consagrada para a escuridão personificada que se contrapõe à luz; os artigos gregos são refletidos pela contração «nas» e por «as».
- source_word: φαίνει
  choice: brilha
  rationale: Traduz o presente do indicativo como ação viva e contínua, sem explicitar além do que o aspecto verbal exige.
- source_word: κατέλαβεν
  choice: não a venceram
  rationale: No confronto figurado entre luz e trevas, «vencer» expressa bem o sentido hostil de dominar ou prevalecer contra. A possível acepção cognitiva de compreender ou apreender é preservada em nota.
- source_word: αὐτό
  choice: a
  rationale: O pronome retoma «a luz»; em português, o pronome feminino «a» concorda naturalmente com o gênero do substantivo, sem resolver de modo explícito a dimensão pessoal presente no contexto mais amplo.
theological_decisions:
- issue: Sentido de κατέλαβεν no contraste entre luz e trevas
  choice: não a venceram
  alternative: não a compreenderam; não a apreenderam
  rationale: O verbo grego pode indicar tanto compreensão/apreensão quanto domínio ou vitória. A imagem imediata do conflito entre luz e trevas favorece «vencer», mas a polissemia possível no estilo joanino é mantida por meio da nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Trevas» preserva a força literária e teológica da oposição joanina sem soar arcaico. A colocação do marcador após a oração deixa claro que a nota se refere ao verbo ambíguo.
