  yaml_path: translation/nt/john/001/036.yaml
  text: And looking at Jesus as he was walking, he says, “Look, the Lamb of God!”
translation:
  language: pt
  text: 'E, olhando atentamente para Jesus, que caminhava, disse: “Eis o Cordeiro de Deus!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: olhando atentamente
  rationale: O particípio indica um olhar dirigido e atento, não apenas uma percepção casual.
- source_word: περιπατοῦντι
  choice: enquanto ele caminhava
  rationale: Expressa naturalmente a ação simultânea indicada pelo particípio presente.
- source_word: λέγει
  choice: disse
  rationale: O presente histórico grego é vertido pelo passado narrativo natural em português.
- source_word: Ἴδε
  choice: Vejam!
  rationale: Imperativo de chamar a atenção; o plural se ajusta aos dois discípulos mencionados no contexto imediato.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: o Cordeiro de Deus
  rationale: Mantém a imagem central e a relação genitiva do original sem explicitar uma interpretação sacrificial além do texto.
theological_decisions:
- issue: Sentido do título “Cordeiro de Deus”
  choice: Preservar literalmente o título
  alternative: Explicitar como “o Cordeiro sacrificial enviado por Deus” ou expressão semelhante
  rationale: O texto não explica aqui de modo explícito todas as associações teológicas da metáfora; a tradução conserva sua densidade e possível amplitude.
- issue: Referente de “de Deus”
  choice: Manter o genitivo ambíguo e natural
  alternative: Parafrasear como “que pertence a Deus” ou “dado por Deus”
  rationale: A construção grega permite uma relação ampla, que não deve ser estreitada na tradução.
translation_notes:
  register: Português moderno, claro e digno, com fluidez brasileira e compreensão internacional. A exclamação após “Vejam” reproduz a força do chamado de atenção sem recorrer ao mais solene e menos corrente “Eis”.
