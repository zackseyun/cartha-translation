  to: Todas as coisas vieram a existir por meio dele,[a] e, sem ele, nem uma só coisa, dentre tudo o que veio a existir, veio a existir.
  rationale: A revisão substitui a construção pouco idiomática “dentre as que vieram a existir” por “dentre tudo o que veio a existir”, mantendo a ligação de ὃ γέγονεν ao versículo 3 conforme a pontuação do SBLGNT. A repetição de “veio a existir” reflete a repetição intencional de ἐγένετο/γέγονεν e conserva a diferença entre o aoristo e o perfeito de modo legível em português. A nota continua a registrar a alternativa legítima de iniciar o versículo 4 com a oração final.
