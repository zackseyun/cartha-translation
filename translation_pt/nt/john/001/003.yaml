  text: πάντα δι’ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν
base_translation:
  language: en
  yaml_path: translation/nt/john/001/003.yaml
  text: All things came into being through him[a], and apart from him not even one thing came into being that has come into being.
translation:
  language: pt
  text: Todas as coisas vieram a existir por meio dele,[a] e, sem ele, nem uma só coisa, dentre tudo o que veio a existir, veio a existir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, iniciando o versículo 4: “O que veio a existir nele era vida”.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: Todas as coisas
  rationale: O neutro plural tem sentido abrangente. A formulação preserva tanto a forma plural quanto o alcance cósmico da afirmação.
- source_word: δι’ αὐτοῦ
  choice: por meio dele
  rationale: διά com genitivo indica aqui mediação ou agência. “Por meio dele” é natural em português e mantém essa nuance.
- source_word: ἐγένετο
  choice: vieram a existir / veio a existir
  rationale: Neste contexto, γίνομαι se refere à entrada na existência, não apenas à fabricação. A concordância varia conforme o sujeito em português.
- source_word: χωρὶς αὐτοῦ
  choice: sem ele
  rationale: χωρίς expressa ausência ou separação. “Sem ele” comunica isso de modo claro, natural e digno.
- source_word: οὐδὲ ἕν
  choice: nem uma só coisa
  rationale: A expressão é enfática. “Nem uma só coisa” preserva a negação exaustiva e a força do numeral neutro singular.
- source_word: ὃ γέγονεν
  choice: dentre as que vieram a existir
  rationale: Ligada ao versículo 3, a oração retoma as coisas existentes. Esta construção evita a possível impressão, em português, de que alguma coisa veio a existir sem ele, e conserva o valor resultante do perfeito grego dentro dos limites naturais da língua.
theological_decisions:
- issue: Ligação da oração final ὃ γέγονεν
  choice: 'Ligá-la ao versículo 3: “nem uma só coisa veio a existir dentre as que vieram a existir”.'
  alternative: 'Iniciar o versículo 4: “O que veio a existir nele era vida”.'
  rationale: Os manuscritos gregos mais antigos não traziam a pontuação moderna, de modo que a oração admite ambas as ligações. O texto principal segue a pontuação fornecida no SBLGNT, enquanto a nota preserva a alternativa genuína sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Por meio dele” preserva a mediação expressa pelo grego; “vieram a existir” mantém a nuance ontológica do verbo. A vírgula antes do marcador encerra o primeiro membro da frase, e a nota registra a ambiguidade de pontuação da oração final.
