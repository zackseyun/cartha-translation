  yaml_path: translation/nt/john/001/004.yaml
  text: In him was life[a], and the life was the light of men.
translation:
  language: pt
  text: Nele estava a vida, e a vida era a luz da humanidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: Nele
  rationale: A preposição ἐν com o dativo é expressa naturalmente por «em», contraída com o pronome pessoal. O antecedente é o Logos do contexto anterior, apresentado pessoalmente; por isso, «nele» é preferível a «nisso».
- source_word: ζωὴ
  choice: vida
  rationale: ζωή significa diretamente «vida». A formulação simples preserva a densidade teológica do termo sem explicá-lo antecipadamente como «vida eterna».
- source_word: ἦν
  choice: estava / era
  rationale: O imperfeito de εἰμί permite essas formas naturais em português. «Estava» no primeiro membro comunica que a vida se encontrava nele; «era» no segundo preserva a identificação predicativa entre a vida e a luz.
- source_word: ἡ ζωὴ
  choice: a vida
  rationale: O artigo e a repetição retomam anaforicamente a vida já mencionada.
- source_word: τὸ φῶς
  choice: a luz
  rationale: φῶς é traduzido diretamente por «luz», mantendo a imagem central do prólogo e sua forma definida.
- source_word: τῶν ἀνθρώπων
  choice: da humanidade
  rationale: O plural ἀνθρώπων tem referência humana genérica, não exclusivamente masculina. «Da humanidade» conserva o genitivo e expressa com clareza, em português atual, o conjunto dos seres humanos.
theological_decisions:
- issue: Referente e força pessoal de αὐτῷ
  choice: «Nele», referindo-se pessoalmente ao Logos.
  alternative: «Nisso», caso λόγος fosse entendido de modo abstrato.
  rationale: O contexto imediato apresenta o Logos em relação pessoal com Deus e, posteriormente, como aquele que se fez carne. «Nele» preserva essa força contextual sem acrescentar ao versículo uma formulação doutrinária posterior.
- issue: Sentido genérico de ἀνθρώπων
  choice: «Da humanidade», abrangendo todos os seres humanos.
  alternative: «Dos homens» ou «das pessoas».
  rationale: Embora a forma grega seja um plural gramaticalmente masculino, seu referente é genérico. «Da humanidade» evita uma leitura exclusivamente masculina e mantém a relação genitiva sem resolver além do necessário a metáfora da luz.
- issue: Relação entre vida e luz
  choice: «A vida era a luz», mantendo a identificação predicativa.
  alternative: «A vida trazia luz» ou «a vida iluminava».
  rationale: Paráfrases funcionais enfraqueceriam a formulação identificadora do grego. A tradução mantém a tensão e a densidade da afirmação joanina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A cadência concisa do original foi preservada. «Nele estava a vida» soa natural e mantém a distinção estilística entre a existência da vida nele e a identificação da vida como luz.
