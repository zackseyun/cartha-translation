  text: οὗτος ἦν ἐν ἀρχῇ πρὸς τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/002.yaml
  text: He was in the beginning with God[a].
translation:
  language: pt
  text: Ele estava, no princípio, com Deus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Este estava, no princípio, com Deus.”'
    reason: Alternativa lexical que representa mais formalmente o demonstrativo οὗτος.
lexical_decisions:
- source_word: οὗτος
  choice: Ele
  rationale: Embora οὗτος signifique formalmente “este” ou “este mesmo”, aqui retoma o Logos do versículo 1. “Ele” é natural em português e preserva a referência pessoal; a alternativa mais formal é registrada em nota.
- source_word: ἦν
  choice: estava
  rationale: O imperfeito de εἰμί descreve um estado contínuo. Neste contexto relacional, “estava ... com Deus” soa mais natural em português do que “era ... com Deus”, sem acrescentar a ideia lexical mais explícita de “existia”.
- source_word: ἐν ἀρχῇ
  choice: no princípio
  rationale: Mantém o eco claro de Gênesis 1:1 e a formulação já estabelecida no prólogo de João.
- source_word: πρὸς
  choice: com
  rationale: Com acusativo, πρός expressa aqui relação e orientação pessoal. “Com” comunica proximidade e distinção relacional de modo conciso e natural, sem explicitar além do texto.
- source_word: τὸν θεόν
  choice: Deus
  rationale: Embora o grego tenha artigo, o português idiomático emprega simplesmente “Deus” neste contexto.
theological_decisions:
- issue: Referente de οὗτος em relação a João 1:1
  choice: O demonstrativo retoma a Palavra e é traduzido pessoalmente como “Ele”.
  alternative: “Este” ou “Este mesmo”.
  rationale: O versículo recapitula a identidade e a relação da Palavra apresentadas no versículo 1. “Ele” preserva o referente pessoal sem inserir formulação doutrinária adicional.
- issue: Sentido de πρὸς τὸν θεόν
  choice: Distinção relacional expressa por “com Deus”.
  alternative: “voltado para Deus” ou “na presença de Deus”.
  rationale: A expressão apresenta a relação entre a Palavra e Deus. “Com Deus” conserva a proximidade e a distinção sem definir categorias metafísicas que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula em “no princípio” destaca a expressão temporal e preserva o ritmo solene do prólogo.
