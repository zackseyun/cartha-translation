id: JHN.1.11
reference: John 1:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰς τὰ ἴδια ἦλθεν, καὶ οἱ ἴδιοι αὐτὸν οὐ παρέλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/011.yaml
  text: He came to his own[b][a], and his own people did not receive him.
translation:
  language: pt
  text: Veio para o que era seu[a], e os seus não o receberam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Veio para as suas próprias coisas”, “Veio para a sua própria casa” ou “Veio para os seus próprios domínios”. No grego, a primeira expressão está no neutro plural e se distingue da expressão masculina plural “os seus” que vem em seguida.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “não o aceitaram” ou “não o acolheram”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ ἴδια
  choice: para o que era seu
  rationale: O neutro plural indica aquilo que lhe pertencia — seu âmbito, sua casa ou seus bens —, sem identificar diretamente pessoas. A formulação preserva a distinção em relação ao masculino plural da oração seguinte.
- source_word: ἦλθεν
  choice: Veio
  rationale: Tradução direta e natural do aoristo de ἔρχομαι, mantendo simples o movimento narrativo.
- source_word: οἱ ἴδιοι
  choice: os seus
  rationale: O masculino plural se refere a pessoas. Em português, “os seus” comunica isso de modo conciso e conserva o contraste deliberado com “o que era seu”.
- source_word: παρέλαβον
  choice: receberam
  rationale: Neste contexto, παραλαμβάνω pode expressar receber, acolher ou aceitar uma pessoa. “Receberam” mantém a amplitude do termo sem especificar em excesso a forma da rejeição.
- source_word: αὐτόν
  choice: o
  rationale: O pronome retoma a Palavra/luz no contexto e é traduzido naturalmente pelo pronome masculino de objeto direto.
theological_decisions:
- issue: Referente e nuance do uso duplo de ἴδιος
  choice: A primeira expressão se refere ao que lhe pertencia, enquanto a segunda se refere aos seus, isto é, pessoas.
  alternative: Entender ambas as expressões simplesmente como referência ao seu próprio povo, ou tomar a primeira especificamente como sua casa ou seu lar.
  rationale: A mudança do neutro plural τὰ ἴδια para o masculino plural οἱ ἴδιοι sugere uma distinção deliberada entre aquilo que lhe pertencia e as pessoas que eram suas. A tradução preserva essa tensão sem restringir a primeira expressão a um referente específico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção concisa conserva a repetição de “seu/seus” e a diferença entre aquilo que pertencia a ele e as pessoas identificadas como suas.
