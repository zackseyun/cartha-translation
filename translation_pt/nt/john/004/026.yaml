    text: 'Ou: “Sou eu, aquele que lhe fala.” O grego diz literalmente: “Eu sou, aquele que lhe fala”; a identificação com o Messias fica subentendida pelo contexto do versículo anterior.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: disse
  rationale: Embora o grego use o presente histórico, o passado é mais natural na narrativa em português.
- source_word: αὐτῇ
  choice: lhe
  rationale: O pronome dativo expressa de modo natural o objeto indireto, “a ela”.
- source_word: Ἐγώ εἰμι
  choice: Eu sou
  rationale: Preserva a formulação explícita do grego e sua possível ressonância teológica, sem acrescentar um predicativo ausente no texto.
- source_word: ὁ λαλῶν σοι
  choice: aquele que está falando com você
  rationale: Reproduz a expressão substantivada do particípio presente em português natural; “com você” se ajusta ao contexto de diálogo.
theological_decisions:
- issue: Se a identificação messiânica deve ser explicitada no texto principal
  choice: Manter “Eu sou” sem acrescentar “ele”.
  alternative: “Sou eu, aquele que está falando com você” ou “Eu sou ele, aquele que está falando com você”.
  rationale: O contexto anterior identifica o referente como o Messias, mas o predicativo não aparece no grego. A formulação escolhida preserva tanto a identificação contextual quanto a concisão e a possível ressonância teológica da expressão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A vírgula mantém a aposição concisa do grego, ainda que a construção seja deliberadamente marcada em português.
