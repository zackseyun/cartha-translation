  text: αὐτὸς ⸀γὰρ Ἰησοῦς ἐμαρτύρησεν ὅτι προφήτης ἐν τῇ ἰδίᾳ πατρίδι τιμὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/044.yaml
  text: For Jesus himself testified that a prophet has no honor in his own homeland[a].
translation:
  language: pt
  text: Pois o próprio Jesus havia testemunhado que um profeta não recebe honra em sua própria terra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em sua própria pátria” ou “em seu lugar de origem”. O termo grego πατρίς pode se referir à terra natal ou à região de origem de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação ligada ao contexto anterior e preserva de modo natural a função discursiva de γάρ.
- source_word: αὐτὸς ... Ἰησοῦς
  choice: o próprio Jesus
  rationale: Conserva a ênfase de αὐτός em associação com o nome Jesus, com formulação idiomática em português.
- source_word: ἐμαρτύρησεν
  choice: havia testemunhado
  rationale: Mantém a linguagem de testemunho característica de João; o mais-que-perfeito composto explicita naturalmente, em português, a anterioridade do testemunho em relação ao movimento narrado no contexto.
- source_word: προφήτης
  choice: um profeta
  rationale: O singular sem artigo tem sentido indefinido e proverbial, adequadamente expresso por “um profeta”.
- source_word: ἐν τῇ ἰδίᾳ πατρίδι
  choice: em sua própria terra
  rationale: πατρίς pode designar terra natal, região de origem ou pátria. “Sua própria terra” é corrente, digna e suficientemente ampla para não definir além do texto o referente geográfico.
- source_word: τιμὴν οὐκ ἔχει
  choice: não recebe honra
  rationale: Expressa com naturalidade a ausência de reconhecimento no lugar de origem, preservando o substantivo τιμή como “honra”.
theological_decisions:
- issue: Referente e alcance de “sua própria terra” no contexto joanino
  choice: Manter a expressão geograficamente aberta
  alternative: Especificar Judeia, Galileia ou Nazaré
  rationale: O versículo não identifica expressamente o lugar. A tradução conserva a tensão interpretativa e não impõe uma harmonização geográfica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém tom proverbial e digno, sem arcaísmos nem especificação interpretativa do referente geográfico.
