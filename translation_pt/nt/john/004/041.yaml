  text: καὶ πολλῷ πλείους ἐπίστευσαν διὰ τὸν λόγον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/004/041.yaml
  text: And many more believed because of his word[b][a],
translation:
  language: pt
  text: E muitos mais creram por causa da palavra dele.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “muitos outros creram”. A expressão grega também pode ser entendida como um comparativo intensificado: “muitíssimos mais creram”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “por causa da mensagem dele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῷ πλείους
  choice: muitos mais
  rationale: O dativo πολλῷ intensifica o comparativo πλείους. “Muitos mais” é natural em português e preserva o aumento em relação aos que já haviam crido.
- source_word: ἐπίστευσαν
  choice: creram
  rationale: O aoristo ativo de πιστεύω é traduzido de modo direto, sem acrescentar um objeto ou explicitar uma formulação doutrinária ausente do versículo.
- source_word: διὰ
  choice: por causa de
  rationale: 'Com o acusativo τὸν λόγον, διά expressa aqui causa ou motivo: eles creram em decorrência do que Jesus disse.'
- source_word: λόγον
  choice: palavra
  rationale: “Palavra” preserva a dicção joanina e, neste contexto, designa o que Jesus falou; “mensagem” permanece uma alternativa natural.
- source_word: αὐτοῦ
  choice: dele
  rationale: O pronome retoma Jesus. “Dele” é claro e idiomático em português brasileiro, evitando a possível ambiguidade de “sua palavra”.
theological_decisions:
- issue: Tradução de πιστεύω em contexto narrativo de salvação
  choice: creram
  alternative: vieram a crer; depositaram nele a sua fé
  rationale: O grego afirma simplesmente que muitos mais creram por causa da palavra de Jesus, sem objeto explícito após o verbo. A formulação conserva essa concisão e permite que o contexto identifique aquele em quem creram.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores segue a expressão a que cada nota se refere: [a] esclarece “muitos mais”, e [b], “palavra”.'
