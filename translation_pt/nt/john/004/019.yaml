  text: λέγει αὐτῷ ἡ γυνή· Κύριε, θεωρῶ ὅτι προφήτης εἶ σύ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/019.yaml
  text: The woman said to him[a], “Lord, I see that you are a prophet.”
translation:
  language: pt
  text: 'A mulher lhe disse: “Senhor[a], vejo que você é profeta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “senhor”, como forma respeitosa de tratamento. O grego κύριε também pode ser usado desse modo.'
    reason: Preservar a ambiguidade contextual do vocativo κύριε.
lexical_decisions:
- source_word: λέγει
  choice: disse
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma natural na narrativa em português.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome dativo marca o destinatário da fala; “lhe disse” é uma construção portuguesa clara e concisa.
- source_word: ἡ γυνή
  choice: A mulher
  rationale: No contexto, refere-se à mulher samaritana, não a uma esposa.
- source_word: Κύριε
  choice: Senhor
  rationale: Mantém a correspondência usual com κύριε, enquanto a possível função de tratamento respeitoso é registrada em nota.
- source_word: θεωρῶ
  choice: vejo
  rationale: Aqui o verbo indica percepção ou reconhecimento com base no que Jesus revelou; “vejo” é natural e preserva a imagem do original.
- source_word: ὅτι
  choice: que
  rationale: Introduz diretamente o conteúdo da percepção.
- source_word: προφήτης
  choice: profeta
  rationale: O predicativo anartro identifica a qualidade ou condição de Jesus. Em português, depois de “ser”, a ausência de artigo é idiomática e não o identifica necessariamente como “o Profeta”.
- source_word: σύ
  choice: você
  rationale: O pronome explícito é representado por “você”, forma amplamente compreensível e natural no português brasileiro contemporâneo.
theological_decisions:
- issue: Sentido de κύριε como tratamento dirigido a Jesus
  choice: Senhor
  alternative: senhor, como tratamento respeitoso equivalente a “senhor”/“moço” conforme o contexto
  rationale: O contexto não exige que a mulher já esteja fazendo uma confissão cristológica plena; κύριε pode ser apenas um tratamento respeitoso. A tradução mantém “Senhor” no texto e explicita essa ambiguidade em nota.
- issue: Identidade expressa por προφήτης
  choice: profeta
  alternative: o Profeta
  rationale: A construção grega não apresenta artigo e, neste ponto da narrativa, a mulher reconhece Jesus como profeta, sem identificá-lo explicitamente com a figura escatológica conhecida como “o Profeta”.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Você” evita a ambiguidade verbal de uma forma sem pronome; “lhe disse” conserva de modo natural o destinatário expresso no grego.
