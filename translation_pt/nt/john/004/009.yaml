source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ἡ γυνὴ ἡ Σαμαρῖτις· Πῶς σὺ Ἰουδαῖος ὢν παρ’ ἐμοῦ πεῖν αἰτεῖς ⸂γυναικὸς Σαμαρίτιδος οὔσης⸃; οὐ γὰρ συγχρῶνται Ἰουδαῖοι Σαμαρίταις.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/009.yaml
  text: So the Samaritan woman said to him[a], “How is it that you, being a Jew, ask for a drink from me, a Samaritan woman?” (For Jews do not associate with Samaritans.)
translation:
  language: pt
  text: 'Então a mulher samaritana lhe disse: “Como é que você, sendo judeu, me pede de beber, sendo eu uma mulher samaritana?” (Pois os judeus não se relacionam com os samaritanos[a].)'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois os judeus não têm trato com os samaritanos”. O verbo também pode ter o sentido mais específico de não usar coisas em comum, como recipientes para beber.'
    reason: alternativa lexical
lexical_decisions:
- source_word: λέγει οὖν
  choice: Então ... disse
  rationale: οὖν faz avançar a narrativa e também liga a reação da mulher ao pedido anterior; “Então” preserva essa conexão com naturalidade em português.
- source_word: ἡ γυνὴ ἡ Σαμαρῖτις
  choice: a mulher samaritana
  rationale: A expressão identifica a mulher por gênero e pertencimento comunitário; esta formulação é natural e fiel em português.
- source_word: Πῶς
  choice: Como é que
  rationale: A pergunta expressa surpresa diante da transgressão de uma barreira social, e “Como é que” comunica bem essa incredulidade em português corrente.
- source_word: Ἰουδαῖος
  choice: judeu
  rationale: Aqui o contraste com “samaritana” diz respeito sobretudo à identidade étnico-religiosa e comunitária, não apenas à origem geográfica na Judeia.
- source_word: ὢν
  choice: sendo
  rationale: Mantém a construção circunstancial do particípio sem decidir se a relação lógica deve ser explicitada como causal ou concessiva.
- source_word: παρ’ ἐμοῦ πεῖν αἰτεῖς
  choice: pede de beber a mim
  rationale: Expressa de modo natural o pedido por água e mantém em destaque que o pedido é dirigido à própria mulher.
- source_word: γυναικὸς Σαμαρίτιδος οὔσης
  choice: uma mulher samaritana
  rationale: A aposição retoma “a mim” e preserva tanto a autodescrição feminina quanto a identidade samaritana que fundamentam a surpresa.
- source_word: συγχρῶνται
  choice: se relacionam com
  rationale: O verbo pode indicar trato ou associação social e também, mais especificamente, o uso compartilhado de objetos. A tradução principal preserva o sentido social amplo; a nota registra a possibilidade mais específica.
theological_decisions:
- issue: Sentido de Ἰουδαῖος no uso joanino
  choice: judeu
  alternative: judeano
  rationale: Neste contexto, a oposição é entre judeus e samaritanos como comunidades étnico-religiosas com relações sociais tensas, e não simplesmente entre habitantes da Judeia e de Samaria.
- issue: Amplitude semântica de συγχρῶνται
  choice: relação social em sentido amplo
  alternative: não compartilhar utensílios ou não usar coisas em comum
  rationale: A explicação pode se referir à separação social geral, mas o contexto de beber água torna possível uma alusão específica ao compartilhamento de recipientes. A tradução principal mantém o sentido amplo e a nota preserva o mais restrito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Você” evita solenidade artificial, enquanto “pede de beber” preserva a formulação do pedido. O comentário explicativo permanece entre parênteses, como aparte narrativo.
