  yaml_path: translation/nt/john/004/003.yaml
  text: he left Judea and went back to Galilee[a].
translation:
  language: pt
  text: deixou a Judeia e voltou para a Galileia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi novamente para a Galileia”. O advérbio grego πάλιν pode significar “novamente”, mas aqui provavelmente indica retorno; por isso, “voltou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῆκεν
  choice: deixou
  rationale: O aoristo de ἀφίημι indica aqui deixar um lugar; “deixou a Judeia” é direto e natural em português.
- source_word: τὴν Ἰουδαίαν
  choice: a Judeia
  rationale: Forma geográfica convencional em português, adequada ao contexto do Evangelho.
- source_word: ἀπῆλθεν
  choice: voltou
  rationale: Em combinação com πάλιν e o destino introduzido por εἰς, expressa naturalmente o movimento de retorno, sem reproduzir de modo rígido os dois elementos gregos.
- source_word: πάλιν
  choice: voltou
  rationale: Neste contexto de viagem, o advérbio provavelmente indica retorno à Galileia; seu sentido é integrado ao verbo português “voltou”.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: para a Galileia
  rationale: εἰς marca o destino do movimento; “para a Galileia” é a formulação corrente e clara em português.
