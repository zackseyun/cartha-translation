  text: Jesus answered and said to her[a], “Everyone who drinks from this water will be thirsty again.”
translation:
  language: pt
  text: 'Jesus respondeu e lhe disse: “Todo aquele que bebe desta água terá sede novamente.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ
  choice: Jesus lhe respondeu
  rationale: Em português atual, “respondeu” já introduz naturalmente a fala e inclui a ideia da fórmula grega “respondeu e disse”; reproduzir os dois verbos resultaria em expressão pouco idiomática. O pronome “lhe” preserva o objeto indireto feminino indicado por αὐτῇ no contexto.
- source_word: Πᾶς ὁ πίνων
  choice: Todo aquele que beber
  rationale: A construção com particípio presente tem sentido genérico e universal. “Todo aquele que beber” é inclusivo no referente e natural em português, sem restringir a declaração a homens.
- source_word: ἐκ τοῦ ὕδατος τούτου
  choice: desta água
  rationale: “Desta água” expressa de modo conciso tanto a origem indicada por ἐκ quanto o demonstrativo τούτου, referindo-se à água concreta em discussão.
- source_word: διψήσει πάλιν
  choice: terá sede novamente
  rationale: A locução “terá sede” é a forma corrente de expressar διψάω em português, e “novamente” preserva claramente a repetição indicada por πάλιν.
theological_decisions:
- issue: Fórmula dupla de fala ἀπεκρίθη ... καὶ εἶπεν
  choice: Condensar como “respondeu”
  alternative: “respondeu e lhe disse”
  rationale: A duplicação é uma fórmula narrativa grega. Em português moderno, “respondeu” comunica integralmente sua função sem a rigidez de um decalque, e não altera o conteúdo teológico.
- issue: Construção masculina genérica Πᾶς ὁ πίνων
  choice: “Todo aquele que beber”, com referência universal
  alternative: “Quem beber”
  rationale: O masculino gramatical grego é genérico, não limitado ao sexo masculino. A formulação escolhida conserva de maneira clara o alcance universal.
- issue: Valor temporal/aspectual de ὁ πίνων diante de διψήσει
  choice: “que beber ... terá sede”
  alternative: “que bebe ... voltará a ter sede”
  rationale: A frase descreve genericamente o resultado de beber desta água. O futuro do subjuntivo português na oração relativa combina naturalmente com o futuro da oração principal sem acrescentar uma condição teológica ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação evita tanto o arcaísmo “tornará a ter sede” quanto o decalque pouco natural “respondeu e disse a ela”.
