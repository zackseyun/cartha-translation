  text: οἱ γὰρ μαθηταὶ αὐτοῦ ἀπεληλύθεισαν εἰς τὴν πόλιν, ἵνα τροφὰς ἀγοράσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/008.yaml
  text: For his disciples had gone away into the city to buy food[a][b].
translation:
  language: pt
  text: Pois os discípulos dele tinham ido à cidade para comprar comida[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à vila”; πόλις pode ser traduzido por “cidade” ou, conforme o contexto, “vila”.
    reason: lexical_alternative
  - marker: b
    text: Ou “para comprar mantimentos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação da situação anterior e preserva de modo natural a força conectiva de γάρ.
- source_word: μαθηταὶ αὐτοῦ
  choice: os discípulos dele
  rationale: Reproduz claramente a relação possessiva e mantém “discípulos” como equivalente corrente e preciso de μαθηταί.
- source_word: ἀπεληλύθεισαν
  choice: tinham ido
  rationale: O mais-que-perfeito grego indica uma ação anterior à cena narrada; a locução verbal portuguesa comunica essa anterioridade com naturalidade.
- source_word: εἰς τὴν πόλιν
  choice: à cidade
  rationale: Expressa o movimento em direção ao lugar de modo idiomático; πόλις também pode designar uma localidade entendida como vila.
- source_word: ἵνα
  choice: para
  rationale: Marca de maneira natural a finalidade introduzida por ἵνα.
- source_word: τροφὰς
  choice: comida
  rationale: Equivalente corrente e acessível para o plural τροφάς neste contexto; “mantimentos” também é possível.
- source_word: ἀγοράσωσιν
  choice: comprar
  rationale: O infinitivo após “para” transmite naturalmente a ação pretendida expressa pelo aoristo do subjuntivo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Tinham ido” preserva a anterioridade verbal; “pois” mantém a ligação explicativa com o contexto precedente.
