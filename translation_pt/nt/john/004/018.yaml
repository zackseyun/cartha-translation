  text: For you have had five husbands[a], and the man you now have is not your husband; this you have said truly.
translation:
  language: pt
  text: Pois você já teve cinco maridos[a], e o homem que você tem agora não é seu marido; nisso, você disse a verdade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Pois você teve cinco homens, e aquele que você tem agora não é seu homem/marido”. A palavra grega ἀνήρ pode significar “homem” ou “marido”; neste contexto, “marido” é o sentido mais provável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέντε γὰρ ἄνδρας ἔσχες
  choice: Pois você já teve cinco maridos
  rationale: “Pois” conserva a função explicativa de γάρ. Embora ἀνήρ possa significar “homem” ou “marido”, o contexto relacional favorece “maridos”. “Já teve” expressa em português natural a experiência anterior com relevância para a situação presente.
- source_word: καὶ νῦν ὃν ἔχεις
  choice: e o homem que tem agora
  rationale: O antecedente implícito do pronome relativo é explicitado como “o homem”, e νῦν é traduzido por “agora”. “Tem” mantém a formulação direta do grego sem substituí-la interpretativamente por “vive com”.
- source_word: οὐκ ἔστιν σου ἀνήρ
  choice: não é seu marido
  rationale: Aqui a relação conjugal indicada pelo contexto torna “marido” a tradução mais clara de ἀνήρ; “seu” representa naturalmente o genitivo σου.
- source_word: τοῦτο ἀληθὲς εἴρηκας
  choice: nisso você disse a verdade
  rationale: A formulação retoma especificamente a declaração anterior da mulher e preserva a ênfase de que, nesse ponto, ela falou com verdade. O pretérito perfeito simples é a forma idiomática em português para a fala recém-concluída.
theological_decisions:
- issue: Sentido de ἀνήρ nas duas ocorrências
  choice: Traduzir a primeira ocorrência por “maridos” e a segunda por “marido”, explicitando “homem” apenas como antecedente do pronome relativo na oração intermediária.
  alternative: Traduzir mais literalmente por “homens/homem” em ambas as ocorrências.
  rationale: O diálogo trata do histórico conjugal da mulher e contrasta seus cinco maridos com sua relação atual, na qual o homem não é seu marido. A escolha transmite o sentido contextual sem acrescentar uma avaliação moral que o versículo não formula explicitamente.
translation_notes:
  register: Português moderno, digno e acessível, com “você” de ampla legibilidade brasileira. A pontuação com ponto e vírgula preserva o encadeamento argumentativo do grego, e a nota mantém visível a ambiguidade lexical de ἀνήρ.
