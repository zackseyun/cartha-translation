base_translation:
  language: en
  yaml_path: translation/nt/john/004/032.yaml
  text: But he said to them[a], “I have food to eat that you do not know.”
translation:
  language: pt
  text: 'Mas ele lhes disse[a]: “Eu tenho comida para comer que vocês não conhecem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu tenho algo para comer que vocês não conhecem.” Jesus fala de modo metafórico, como o contexto seguinte deixa claro.'
    reason: Alternativa lexical para βρῶσιν ἔχω φαγεῖν e esclarecimento contextual sem substituir a imagem no texto principal.
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca um contraste leve com a fala anterior dos discípulos e introduz a resposta corretiva de Jesus.
- source_word: εἶπεν αὐτοῖς
  choice: ele lhes disse
  rationale: É uma tradução direta e natural da construção grega, preservando o estilo narrativo.
- source_word: Ἐγὼ
  choice: Eu
  rationale: O pronome explícito preserva a ênfase e o contraste presentes no grego.
- source_word: βρῶσιν
  choice: comida
  rationale: Neste contexto, designa alimento, não o ato de comer; “comida” é claro e corrente em português.
- source_word: ἔχω φαγεῖν
  choice: tenho comida para comer
  rationale: Preserva a construção de posse e finalidade do grego sem explicar antecipadamente a metáfora.
- source_word: ἣν
  choice: que
  rationale: Retoma naturalmente “comida” em uma oração relativa no português contemporâneo.
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: vocês não conhecem
  rationale: Mantém o pronome contrastivo e traduz οἴδατε de modo próximo ao grego; a formulação também conserva a ambiguidade quanto à natureza ou procedência da comida.
theological_decisions:
- issue: Sentido metafórico da “comida” de Jesus
  choice: Manter “comida” no texto principal sem explicar a metáfora
  alternative: Tenho algo para comer que vocês desconhecem
  rationale: O contexto seguinte revela a referência à realização da vontade do Pai, mas este versículo preserva deliberadamente a incompreensão dos discípulos. A tradução não deve resolver essa tensão antes do próprio texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” expressa naturalmente o plural de ὑμεῖς; a repetição “comida para comer” foi mantida por proximidade formal ao grego e para preservar a imagem.
