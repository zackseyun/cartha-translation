  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἔρχεται γυνὴ ἐκ τῆς Σαμαρείας ἀντλῆσαι ὕδωρ. λέγει αὐτῇ ὁ Ἰησοῦς· Δός μοι πεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/007.yaml
  text: A woman from Samaria came to draw water. Jesus said to her[a], “Give me a drink.”
translation:
  language: pt
  text: 'Uma mulher da Samaria veio tirar água. Jesus lhe disse[a]: “Dê-me de beber.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “vem [...] diz”; o grego emprega presentes históricos na narrativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔρχεται
  choice: veio
  rationale: O presente grego funciona aqui como presente histórico. O pretérito perfeito é natural na narrativa portuguesa e preserva a sequência dos acontecimentos.
- source_word: γυνὴ
  choice: uma mulher
  rationale: Neste contexto, o substantivo designa uma pessoa do sexo feminino ainda não identificada, e não especificamente uma esposa.
- source_word: ἐκ τῆς Σαμαρείας
  choice: da Samaria
  rationale: Expressa de modo direto e natural a procedência indicada por ἐκ; preserva a referência geográfica sem substituir a expressão por uma identificação étnica explícita.
- source_word: ἀντλῆσαι ὕδωρ
  choice: tirar água
  rationale: O infinitivo indica finalidade. 'Tirar água' é uma expressão corrente e compreensível para retirar água de um poço.
- source_word: λέγει αὐτῇ
  choice: lhe disse
  rationale: λέγει também é um presente histórico. O passado soa natural em português narrativo, e o pronome 'lhe' traduz o objeto indireto αὐτῇ de maneira concisa.
- source_word: Δός μοι πεῖν
  choice: Dê-me de beber
  rationale: A construção formada pelo imperativo e pelo infinitivo pede que a mulher lhe dê algo para beber. Esta formulação é idiomática, digna e próxima da estrutura do grego.
theological_decisions:
- issue: Referência de 'Samaria'
  choice: A frase identifica a mulher como procedente da Samaria, sem acrescentar na linha traduzida afirmações étnicas ou teológicas mais amplas.
  alternative: Traduzir como 'uma mulher samaritana' ou entender especificamente 'da cidade de Samaria'.
  rationale: O grego diz literalmente 'uma mulher da Samaria' neste versículo. A tradução conserva essa formulação e deixa suas implicações para o contexto mais amplo.
translation_notes:
  register: Português moderno, natural e digno, de ampla compreensão internacional e boa legibilidade brasileira. O tratamento verbal 'Dê-me' evita regionalismos excessivos; 'tirar água' mantém clareza cotidiana.
