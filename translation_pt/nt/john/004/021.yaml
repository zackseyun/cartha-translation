  text: λέγει αὐτῇ ὁ Ἰησοῦς· ⸂Πίστευέ μοι, γύναι⸃, ὅτι ἔρχεται ὥρα ὅτε οὔτε ἐν τῷ ὄρει τούτῳ οὔτε ἐν Ἱεροσολύμοις προσκυνήσετε τῷ πατρί.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/021.yaml
  text: Jesus said to her[a], “Believe me, woman[c][b], an hour is coming when neither on this mountain nor in Jerusalem will you worship the Father.”
translation:
  language: pt
  text: 'Jesus lhe disse: “Acredite em mim[a], mulher[b]: vem a hora[c] em que vocês não adorarão o Pai nem neste monte nem em Jerusalém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Confie em mim”. O verbo grego pode indicar tanto acreditar no que alguém diz como confiar nessa pessoa.'
    reason: lexical_alternative
  - marker: b
    text: “Mulher” era uma forma respeitosa de tratamento neste contexto, não uma expressão rude.
    reason: cultural_note
  - marker: c
    text: 'Ou: “vem uma hora”. Embora o substantivo não tenha artigo no grego, João usa com frequência “hora” como termo temático para um momento decisivo no plano de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστευέ μοι
  choice: Creia em mim
  rationale: O imperativo com o pronome no dativo apela diretamente para que ela dê crédito ao que Jesus vai dizer. “Creia em mim” é natural em português e preserva a ligação verbal com πιστεύω ao longo de João; “confie em mim” também é possível, mas pode enfatizar mais a confiança relacional.
- source_word: γύναι
  choice: mulher
  rationale: O vocativo significa literalmente “mulher” e, neste contexto, é uma forma respeitosa de tratamento, embora possa soar ríspida ao leitor moderno; a nota esclarece o tom sem acrescentar ao texto termos ausentes do grego.
- source_word: ἔρχεται ὥρα
  choice: vem a hora
  rationale: “Hora” preserva o termo temático recorrente em João. O português idiomático admite “vem a hora” mesmo sem artigo no grego, sem definir além do texto a natureza desse momento decisivo.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: neste monte
  rationale: Com um lugar elevado, “neste monte” é a forma natural em português e se refere ao monte sagrado samaritano discutido no contexto.
- source_word: ἐν Ἱεροσολύμοις
  choice: em Jerusalém
  rationale: É a forma idiomática portuguesa para o nome da cidade, apesar da forma morfologicamente plural usada em grego.
- source_word: προσκυνήσετε
  choice: vocês adorarão
  rationale: O futuro está na segunda pessoa do plural, explicitada por “vocês”. No contexto de João 4, “adorar” expressa adequadamente o ato religioso, sem o restringir ao gesto físico de prostrar-se.
- source_word: τῷ πατρί
  choice: o Pai
  rationale: No contexto joanino, o referente é Deus como Pai; a inicial maiúscula sinaliza esse título pessoal divino.
- source_word: οὔτε ... οὔτε
  choice: nem ... nem
  rationale: A correlação portuguesa “nem ... nem” preserva a exclusão paralela dos dois lugares de culto.
theological_decisions:
- issue: Tom do vocativo γύναι
  choice: Traduzir literalmente por “mulher”, com esclarecimento em nota
  alternative: senhora; minha senhora
  rationale: O texto não apresenta desrespeito. A tradução literal conserva a formulação da fonte, enquanto a nota evita que o tom seja interpretado como rude sem introduzir uma nuance afetiva ou social não expressa.
- issue: Motivo joanino da ὥρα
  choice: Manter “hora”
  alternative: momento; tempo
  rationale: “Hora” conserva a linguagem temática de João e a tensão quanto à mudança decisiva que se aproxima, sem explicar antecipadamente seu alcance teológico.
- issue: Ausência de artigo em ἔρχεται ὥρα
  choice: Usar a expressão idiomática portuguesa “vem a hora” e registrar a alternativa em nota
  alternative: vem uma hora
  rationale: O substantivo grego não tem artigo, mas em português “vem a hora” é mais natural e mantém a conhecida formulação temática joanina. A nota preserva a diferença formal e a possibilidade de tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” torna explícito o plural de προσκυνήσετε. A ordem “nem neste monte nem em Jerusalém” mantém o paralelismo da fonte; as notas preservam ambiguidades lexicais e culturais relevantes.
