source:
  edition: SBLGNT
  text: οὗτος ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν ἀπῆλθεν πρὸς αὐτὸν καὶ ⸀ἠρώτα ἵνα καταβῇ καὶ ἰάσηται αὐτοῦ τὸν υἱόν, ἤμελλεν γὰρ ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/047.yaml
  text: When this man heard that Jesus had come from Judea into Galilee[a], he went to him and asked him to come down and heal his son[b], for he was about to die.
translation:
  language: pt
  text: Quando esse homem ouviu que Jesus tinha vindo da Judeia para a Galileia, foi até ele e pediu[a] que descesse[b] e curasse seu filho, pois o filho estava prestes a morrer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficou pedindo” ou “pedia”. O imperfeito grego pode apresentar o pedido como uma ação em andamento ou reiterada.
    reason: lexical_alternative
  - marker: b
    text: “Descesse” traduz o verbo grego “descer” e provavelmente alude à diferença de altitude entre Caná e Cafarnaum.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: esse homem
  rationale: Retoma de modo natural o oficial mencionado no versículo anterior e preserva a força demonstrativa do grego.
- source_word: ἀκούσας
  choice: quando ... ouviu
  rationale: Expressa naturalmente em português a relação temporal do particípio aoristo com o verbo principal.
- source_word: ἥκει
  choice: tinha vindo
  rationale: Comunica a chegada já ocorrida e a presença resultante de Jesus na Galileia.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: da Judeia para a Galileia
  rationale: Preserva tanto o ponto de origem quanto o destino, em formulação corrente em português.
- source_word: ἀπῆλθεν πρὸς αὐτόν
  choice: foi até ele
  rationale: Traduz naturalmente o deslocamento do homem em direção a Jesus.
- source_word: ἠρώτα
  choice: pediu
  rationale: No contexto, apresenta com naturalidade o pedido feito a Jesus; a possível nuance durativa ou reiterada do imperfeito é preservada em nota.
- source_word: ἵνα καταβῇ
  choice: que descesse
  rationale: Mantém o sentido topográfico de movimento para baixo e se encaixa naturalmente depois de 'pediu'.
- source_word: ἰάσηται
  choice: curasse
  rationale: Expressa de maneira clara a restauração física solicitada, sem acrescentar explicações ao texto.
- source_word: αὐτοῦ τὸν υἱόν
  choice: seu filho
  rationale: É a forma possessiva natural em português para a construção grega.
- source_word: ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: pois o filho estava prestes a morrer
  rationale: Reproduz a iminência indicada por μέλλω e explicita o referente contextual do sujeito para evitar ambiguidade acidental em português.
theological_decisions:
- issue: Referente do sujeito em 'estava prestes a morrer'
  choice: o filho
  alternative: Jesus ou o oficial
  rationale: O filho é o referente mais próximo e contextualmente inequívoco; a explicitação evita uma ambiguidade pronominal que não é relevante no contexto grego.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A sintaxe é narrativa e natural; as notas preservam a nuance aspectual de ἠρώτα e o sentido topográfico de καταβῇ.
