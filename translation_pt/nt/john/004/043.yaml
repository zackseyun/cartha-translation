  yaml_path: translation/nt/john/004/043.yaml
  text: After the two days[a], he departed from there for Galilee.
translation:
  language: pt
  text: Passados os dois dias, ele partiu dali para a Galileia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
