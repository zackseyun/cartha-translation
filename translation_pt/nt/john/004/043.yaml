lexical_decisions:
- source_word: Μετὰ δὲ τὰς δύο ἡμέρας
  choice: Passados os dois dias
  rationale: μετά com acusativo indica sequência temporal, “depois de”. O artigo retoma os dois dias de permanência mencionados no contexto anterior. A formulação “Passados os dois dias” é natural em português e mantém essa referência. δέ funciona como conexão narrativa leve e não precisa ser traduzido separadamente.
- source_word: ἐξῆλθεν
  choice: partiu
  rationale: O aoristo de ἐξέρχομαι significa literalmente “saiu”, mas, neste contexto de deslocamento, “partiu” expressa com naturalidade a saída do lugar anterior.
- source_word: ἐκεῖθεν
  choice: dali
  rationale: O advérbio indica procedência a partir do lugar previamente mencionado. “Dali” é conciso, claro e idiomático.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: para a Galileia
  rationale: εἰς assinala movimento em direção a um destino. “Para a Galileia” é a forma mais natural em português; “rumo à Galileia” também é possível.
