source:
  edition: SBLGNT
  text: ⸀ὁ θερίζων μισθὸν λαμβάνει καὶ συνάγει καρπὸν εἰς ζωὴν αἰώνιον, ⸀ἵνα ὁ σπείρων ὁμοῦ χαίρῃ καὶ ὁ θερίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/036.yaml
  text: The one who reaps is receiving wages and gathering fruit for eternal life[b][a], so that the one who sows and the one who reaps may rejoice together.
translation:
  language: pt
  text: Quem colhe está recebendo salário[a] e ajuntando fruto para a vida eterna[b], para que quem semeia e quem colhe se alegrem juntos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pagamento” ou “recompensa”. O termo grego pode designar tanto o pagamento pelo trabalho como uma recompensa.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ter o sentido de “com vistas à vida eterna” ou indicar que o fruto ajuntado resulta em vida eterna.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θερίζων
  choice: quem colhe
  rationale: O particípio presente com artigo funciona como substantivo. “Quem colhe” é natural em português e conserva o sentido verbal, além de permitir paralelismo com “quem semeia”.
- source_word: μισθὸν
  choice: pagamento
  rationale: O termo pode indicar salário, pagamento ou recompensa. “Pagamento” mantém a imagem concreta do trabalho sem excluir a ideia de recompensa.
- source_word: λαμβάνει
  choice: está recebendo
  rationale: A forma progressiva destaca a ação presente e em curso sugerida pelo presente grego no contexto da colheita que já acontece.
- source_word: συνάγει καρπὸν
  choice: ajuntando fruto
  rationale: “Ajuntando” expressa a reunião do que é colhido, e “fruto” preserva a amplitude da metáfora sem confundi-lo com a própria colheita.
- source_word: εἰς ζωὴν αἰώνιον
  choice: para a vida eterna
  rationale: A preposição εἰς pode indicar direção, finalidade ou resultado. A expressão portuguesa é natural e mantém aberta essa relação.
- source_word: ἵνα
  choice: para que
  rationale: Introduz adequadamente a oração de finalidade, sem excluir uma nuance de resultado.
- source_word: ὁ σπείρων
  choice: quem semeia
  rationale: Conserva a construção verbal substantivada e o paralelismo com “quem colhe”.
- source_word: ὁμοῦ
  choice: juntos
  rationale: Expressa de modo claro e idiomático a alegria compartilhada pelo semeador e pelo ceifeiro.
- source_word: χαίρῃ
  choice: se alegrem
  rationale: O subjuntivo depois de “para que” reproduz a construção de finalidade. O plural é exigido naturalmente em português pelos dois participantes coordenados.
theological_decisions:
- issue: Força do presente no início do versículo
  choice: Expressá-la por “está recebendo”, sem acrescentar “já”
  alternative: “Quem colhe recebe...” ou “Quem colhe já está recebendo...”
  rationale: O presente grego e o contexto indicam ação atual, mas o texto desta oração não contém um advérbio equivalente a “já”. A forma progressiva comunica a atualidade sem adicionar um elemento explícito ausente.
- issue: Relação de εἰς ζωὴν αἰώνιον com o fruto ajuntado
  choice: “para a vida eterna”
  alternative: Explicitar “destinado à vida eterna” ou “que resulta em vida eterna”
  rationale: A formulação escolhida preserva a possível nuance de finalidade, direção ou resultado, evitando resolver no texto uma ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A repetição “quem semeia e quem colhe” conserva o paralelismo enfático do grego.
