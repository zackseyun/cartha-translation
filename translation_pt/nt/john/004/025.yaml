  text: λέγει αὐτῷ ἡ γυνή· Οἶδα ὅτι Μεσσίας ἔρχεται, ὁ λεγόμενος χριστός· ὅταν ἔλθῃ ἐκεῖνος, ἀναγγελεῖ ἡμῖν ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/025.yaml
  text: The woman said to him[a], “I know that Messiah is coming” (the one called Messiah). “When he comes, he will tell us all things.”
translation:
  language: pt
  text: 'A mulher lhe disse: “Sei que o Messias está vindo, aquele que é chamado Cristo.[a] Quando ele vier, nos anunciará todas as coisas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego: “Messias, aquele que é chamado Cristo”. João explica o título semítico “Messias” por meio do título grego “Cristo”; ambos significam “Ungido”.'
    reason: Preserva a função bilíngue da explicação presente no texto grego.
lexical_decisions:
- source_word: λέγει
  choice: disse
  rationale: O presente histórico grego é vertido naturalmente pelo passado simples na narrativa em português.
- source_word: γυνή
  choice: a mulher
  rationale: No contexto, refere-se à mulher samaritana e não a uma esposa.
- source_word: Οἶδα
  choice: Sei
  rationale: Equivalente direto, corrente e natural de οἶδα.
- source_word: Μεσσίας
  choice: Messias
  rationale: Preserva o título semítico transliterado, reconhecível em português e adequado ao contexto judaico-samaritano.
- source_word: ἔρχεται
  choice: está vindo
  rationale: Expressa o presente com sentido futuro e conserva a expectativa imediata da formulação grega.
- source_word: ὁ λεγόμενος χριστός
  choice: aquele que é chamado Cristo
  rationale: Mantém visível a explicação do título semítico Μεσσίας pelo equivalente grego χριστός, sem reduzir os dois termos à mesma forma portuguesa.
- source_word: ὅταν ἔλθῃ
  choice: Quando ele vier
  rationale: O futuro do subjuntivo é a construção portuguesa natural para essa contingência futura.
- source_word: ἐκεῖνος
  choice: ele
  rationale: O pronome é natural em português; a referência enfática permanece clara no contexto.
- source_word: ἀναγγελεῖ
  choice: nos anunciará
  rationale: Verbo corrente e digno que preserva a ideia de dar a conhecer ou declarar plenamente.
- source_word: ἡμῖν
  choice: nos
  rationale: O pronome oblíquo exprime naturalmente o objeto indireto em português.
- source_word: ἅπαντα
  choice: todas as coisas
  rationale: Conserva a forma abrangente e ligeiramente mais formal do grego, sem restringir o referente.
theological_decisions:
- issue: Relação entre Μεσσίας e χριστός na explicação joanina
  choice: Traduzir Μεσσίας por “Messias” e conservar χριστός como “Cristo” na explicação.
  alternative: Usar “Messias” para ambos os termos, fazendo a explicação parecer uma repetição.
  rationale: O texto grego apresenta o título semítico e em seguida seu equivalente grego. As formas portuguesas “Messias” e “Cristo” preservam essa função explicativa e não introduzem uma distinção teológica entre os títulos.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e boa legibilidade brasileira. A ordem e a pontuação foram ajustadas à naturalidade portuguesa, preservando a explicação parentética do original.
