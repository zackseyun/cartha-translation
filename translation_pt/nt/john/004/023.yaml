id: JHN.4.23
reference: John 4:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ, καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/023.yaml
  text: But an hour is coming[a], and is now here, when the true worshipers will worship the Father in spirit and truth; for the Father indeed seeks such people to worship him.
translation:
  language: pt
  text: Mas vem a hora — e já chegou — em que os verdadeiros adoradores adorarão o Pai em espírito[a] e em verdade, pois o Pai procura justamente pessoas assim, que o adoram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no Espírito”. O grego pode indicar adoração capacitada pelo Espírito Santo, adoração no espírito humano ou adoração caracterizada pela realidade espiritual.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca o contraste com a discussão anterior sobre o lugar da adoração e é a adversativa mais natural e concisa em português.
- source_word: ἔρχεται ὥρα καὶ νῦν ἐστιν
  choice: vem a hora — e já chegou —
  rationale: Preserva a dicção joanina de 'hora' e comunica de modo natural que o tempo anunciado está chegando e, ao mesmo tempo, já se tornou presente.
- source_word: οἱ ἀληθινοὶ προσκυνηταὶ
  choice: os verdadeiros adoradores
  rationale: Mantém o sentido de adoradores genuínos ou reais, sem introduzir uma distinção sectária.
- source_word: προσκυνήσουσιν τῷ πατρὶ
  choice: adorarão o Pai
  rationale: Representa diretamente o futuro do verbo e o título divino no contexto joanino.
- source_word: ἐν πνεύματι καὶ ἀληθείᾳ
  choice: em espírito e em verdade
  rationale: Conserva os dois substantivos e a ambiguidade de πνεύματι; a repetição de 'em' é natural em português e dá equilíbrio à expressão.
- source_word: καὶ γὰρ
  choice: pois ... justamente
  rationale: '''Pois'' introduz a razão, enquanto ''justamente'' procura refletir a ênfase adicional de καί sem tornar a frase artificial.'
- source_word: τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν
  choice: o Pai procura justamente pessoas assim para o adorarem
  rationale: Expressa em português corrente que o Pai procura adoradores desse tipo, mantendo a finalidade ou caracterização ligada ao particípio.
theological_decisions:
- issue: Sentido de ἐν πνεύματι
  choice: em espírito
  alternative: no Espírito; espiritualmente
  rationale: O grego não traz artigo e permite referência ao espírito humano, ao Espírito Santo ou à esfera e qualidade espiritual da adoração. O texto principal preserva essa ambiguidade, e a nota registra as possibilidades.
- issue: Alcance de 'verdadeiros adoradores'
  choice: os verdadeiros adoradores
  alternative: os adoradores genuínos; os adoradores reais
  rationale: A formulação preserva o contraste joanino entre adoração meramente vinculada a um lugar e adoração correspondente à realidade e à revelação de Deus, sem impor uma leitura denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção entre travessões torna natural a tensão temporal de 'vem' e 'já chegou', e a nota conserva a ambiguidade teológica do original.
