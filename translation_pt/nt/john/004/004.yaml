  text: ἔδει δὲ αὐτὸν διέρχεσθαι διὰ τῆς Σαμαρείας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/004.yaml
  text: He had to pass through Samaria[a].
translation:
  language: pt
  text: Ele tinha de passar pela Samaria[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Era necessário que ele passasse pela Samaria”. O grego expressa necessidade sem especificar exatamente em que ela se baseava.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: tinha de
  rationale: O imperfeito de δέω expressa necessidade no contexto narrativo passado. “Tinha de” é natural em português moderno e mantém a necessidade sem definir sua causa.
- source_word: δὲ
  choice: não explicitado
  rationale: Aqui δέ funciona como conectivo leve na progressão narrativa, sem contraste forte. O português não exige um conectivo expresso neste versículo, e omiti-lo evita acrescentar uma indicação temporal como “então” ou “ora”.
- source_word: αὐτὸν
  choice: ele
  rationale: 'Embora αὐτόν seja formalmente acusativo como sujeito do infinitivo, a construção idiomática portuguesa usa oração finita com sujeito nominativo: “Ele tinha de passar”.'
- source_word: διέρχεσθαι
  choice: passar
  rationale: Com διά e uma região geográfica, διέρχομαι indica atravessar ou passar por um lugar. “Passar pela” é conciso e idiomático.
- source_word: διὰ τῆς Σαμαρείας
  choice: pela Samaria
  rationale: διά com genitivo indica movimento através de um lugar. Em português, “passar pela Samaria” comunica naturalmente esse percurso sem precisar acrescentar “região de”.
theological_decisions:
- issue: Natureza da necessidade expressa por ἔδει
  choice: Expressar uma necessidade real com “tinha de”, sem especificar sua base.
  alternative: Entender a necessidade como exigência puramente geográfica ou como necessidade divina ligada à missão de Jesus.
  rationale: O grego afirma a necessidade, mas este versículo não explica se ela é geográfica, circunstancial ou determinada pelo propósito divino. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tinha de” é corrente sem ser coloquial demais; “pela Samaria” é a formulação geográfica mais natural.
