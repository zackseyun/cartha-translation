source:
  edition: SBLGNT
  text: Ἐκ δὲ τῆς πόλεως ἐκείνης πολλοὶ ἐπίστευσαν εἰς αὐτὸν τῶν Σαμαριτῶν διὰ τὸν λόγον τῆς γυναικὸς μαρτυρούσης ὅτι Εἶπέν μοι πάντα ⸀ἃ ἐποίησα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/039.yaml
  text: And many of the Samaritans from that town believed in him because of the word of the woman who was testifying, “He told me everything I did.”
translation:
  language: pt
  text: 'E muitos dos samaritanos daquela cidade creram nele por causa da palavra[a] da mulher, que testemunhava: “Ele me contou tudo o que fiz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa da mensagem da mulher”. A palavra grega λόγος pode significar “palavra”, “mensagem” ou “relato”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ δὲ τῆς πόλεως ἐκείνης
  choice: E ... daquela cidade
  rationale: δέ funciona como conexão narrativa leve, representada por “E”. A origem expressa por ἐκ é transmitida naturalmente pela expressão “daquela cidade” ligada aos samaritanos.
- source_word: πολλοὶ ... τῶν Σαμαριτῶν
  choice: muitos dos samaritanos
  rationale: A construção genitiva tem sentido partitivo; “muitos dos samaritanos” preserva esse valor em português natural.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: creram nele
  rationale: πιστεύω com εἰς indica crença ou confiança dirigida a uma pessoa. “Creram nele” conserva essa força sem acrescentar uma formulação doutrinária mais específica.
- source_word: διὰ τὸν λόγον
  choice: por causa da palavra
  rationale: διά com acusativo expressa causa. “Palavra” preserva a correspondência com λόγος e a dicção joanina; a nota registra a alternativa idiomática “mensagem”.
- source_word: τῆς γυναικὸς μαρτυρούσης
  choice: da mulher, que testemunhava
  rationale: O particípio presente μαρτυρούσης retrata a mulher dando testemunho; o imperfeito “testemunhava” mantém esse aspecto em linguagem clara.
- source_word: Εἶπέν μοι
  choice: Ele me contou
  rationale: Embora λέγω possa ser traduzido literalmente por “disse”, com objeto indireto e conteúdo expresso a seguir, “me contou” é idiomático e adequado ao contexto.
- source_word: πάντα ἃ ἐποίησα
  choice: tudo o que fiz
  rationale: A expressão abrangente é preservada por “tudo o que”, e o aoristo ἐποίησα é representado naturalmente pelo pretérito perfeito simples “fiz”.
theological_decisions:
- issue: Força de πιστεύω εἰς no uso joanino
  choice: creram nele
  alternative: depositaram a fé nele
  rationale: A tradução expressa crença pessoal dirigida a Jesus, conforme a construção grega, sem definir além do texto a natureza ou o desenvolvimento posterior dessa fé.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe permanece próxima do grego sem soar artificial; “cidade” é a equivalência corrente de πόλις, e a fala direta conserva a vivacidade narrativa.
