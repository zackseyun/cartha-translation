  text: ἤδη δὲ αὐτοῦ καταβαίνοντος οἱ δοῦλοι αὐτοῦ ⸀ὑπήντησαν ⸀αὐτῷ λέγοντες ὅτι ὁ παῖς ⸀αὐτοῦ ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/051.yaml
  text: And while he was already going down[a], his slaves met him, saying that his child was alive.
translation:
  language: pt
  text: Enquanto ele já descia, seus escravos foram ao encontro dele, dizendo que sua criança[a] estava viva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seu filho»; o termo grego também pode significar «menino» e, em alguns contextos, «servo».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: já
  rationale: Marca que a descida já estava em andamento quando ocorreu o encontro.
- source_word: δὲ
  choice: Enquanto
  rationale: A relação narrativa suave de δέ é expressa naturalmente pela oração temporal em português, sem introduzir um contraste indevido.
- source_word: καταβαίνοντος
  choice: descia
  rationale: O particípio presente no genitivo absoluto indica uma ação contínua e simultânea; «descia» é natural no trajeto de Caná para Cafarnaum.
- source_word: δοῦλοι
  choice: escravos
  rationale: Preserva a realidade social de pessoas pertencentes à casa e sujeitas à autoridade do oficial, sem suavizá-la para «servos».
- source_word: ὑπήντησαν
  choice: foram ao encontro dele
  rationale: O verbo pode indicar não apenas encontrar, mas sair ou ir ao encontro de alguém; esta formulação comunica bem esse movimento.
- source_word: λέγοντες
  choice: dizendo
  rationale: Mantém a ligação participial entre o encontro e a informação transmitida.
- source_word: παῖς
  choice: filho
  rationale: No contexto imediato da narrativa, o referente é o filho do oficial (υἱός nos vv. 46–47, 50, 53). «Filho» é natural em português, enquanto a nota preserva a amplitude lexical própria de παῖς.
- source_word: ζῇ
  choice: estava vivo
  rationale: O presente grego significa literalmente «vive/está vivo»; em discurso indireto após uma narrativa no passado, «estava vivo» é a formulação portuguesa natural, sem acrescentar explicitamente «havia sarado».
theological_decisions:
- issue: Referência de παῖς na narrativa da cura
  choice: seu filho
  alternative: sua criança; seu menino; seu servo
  rationale: Embora παῖς tenha sentido amplo, o contexto identifica a pessoa como o filho do oficial. A tradução principal torna essa referência clara, e a nota registra a ambiguidade lexical sem sugerir que o contexto seja igualmente ambíguo.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluente. «Escravos» preserva a realidade histórica expressa por δοῦλοι; «foram ao encontro» explicita naturalmente a nuance de movimento de ὑπήντησαν.
