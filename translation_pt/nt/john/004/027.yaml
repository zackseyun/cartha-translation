source:
  edition: SBLGNT
  text: Καὶ ἐπὶ τούτῳ ἦλθαν οἱ μαθηταὶ αὐτοῦ, καὶ ⸀ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει· οὐδεὶς μέντοι εἶπεν· Τί ζητεῖς; ἢ τί λαλεῖς μετ’ αὐτῆς;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/027.yaml
  text: And at this point his disciples came[a], and they were amazed that he was speaking with a woman. Yet no one said, “What are you seeking?” or[b], “Why are you speaking with her?”
translation:
  language: pt
  text: 'Nesse momento, chegaram os seus discípulos e ficaram admirados por ele estar falando com uma mulher. Contudo, ninguém perguntou: “O que você procura?”[a] ou: “Por que está falando com ela?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que você quer?”'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “O que você está falando com ela?” O sentido é: “Por que está falando com ela?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τούτῳ
  choice: Nesse momento
  rationale: A expressão tem valor temporal no contexto e indica que os discípulos chegaram justamente nesse ponto da conversa. “Nesse momento” é natural e mantém a ligação narrativa.
- source_word: ἐθαύμαζον
  choice: ficaram admirados
  rationale: Expressa a reação de surpresa dos discípulos em linguagem atual. O contexto verbal permite apresentar a reação desencadeada pela cena que encontraram, sem acrescentar sua causa social específica.
- source_word: μετὰ γυναικὸς
  choice: com uma mulher
  rationale: O substantivo sem artigo é adequadamente indefinido. “Mulher”, e não “esposa”, é exigido pelo contexto.
- source_word: ἐλάλει
  choice: estar falando
  rationale: 'Preserva o caráter contínuo do imperfeito: ao chegarem, os discípulos encontraram Jesus no decorrer da conversa.'
- source_word: μέντοι
  choice: Contudo
  rationale: Marca o contraste concessivo entre a admiração dos discípulos e o fato de nenhum deles expressar suas perguntas.
- source_word: Τί ζητεῖς;
  choice: O que você procura?
  rationale: Mantém o sentido básico de ζητέω e deixa sem explicitar o objeto, como no grego. A forma portuguesa também não determina de modo explícito a quem a pergunta seria dirigida.
- source_word: τί λαλεῖς μετ’ αὐτῆς;
  choice: Por que está falando com ela?
  rationale: Embora τί signifique literalmente “o que”, aqui a força pragmática da pergunta é naturalmente causal em português. A tradução evita uma construção literal pouco idiomática.
theological_decisions:
- issue: Implicação social de Jesus falar com uma mulher
  choice: Registrar somente a admiração dos discípulos, sem explicar no corpo do versículo sua causa social, étnica ou religiosa.
  alternative: Acrescentar uma explicação sobre costumes entre homens e mulheres ou entre judeus e samaritanos.
  rationale: O texto grego afirma que os discípulos ficaram admirados por Jesus falar com uma mulher, mas não especifica a razão cultural dessa reação. A tradução preserva essa contenção e não introduz uma interpretação denominacional ou histórica no versículo.
- issue: Destinatário implícito da primeira pergunta
  choice: Usar “você”, preservando a falta de identificação explícita do destinatário.
  alternative: Empregar “o senhor”, identificando Jesus como destinatário, ou reformular para identificar a mulher.
  rationale: O grego traz apenas a segunda pessoa singular e não declara expressamente a quem a primeira pergunta seria feita. A formulação escolhida conserva essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Nesse momento” e “ficaram admirados” evitam arcaísmos; “falando” preserva a continuidade da conversa. Os marcadores foram colocados junto às expressões que explicam.
