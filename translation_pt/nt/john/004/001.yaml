id: JHN.4.1
reference: John 4:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὡς οὖν ἔγνω ὁ ⸀Ἰησοῦς ὅτι ἤκουσαν οἱ Φαρισαῖοι ὅτι Ἰησοῦς πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει ἢ Ἰωάννης—
base_translation:
  language: en
  yaml_path: translation/nt/john/004/001.yaml
  text: Therefore[a], when Jesus knew that the Pharisees had heard that Jesus was making and baptizing more disciples than John—
translation:
  language: pt
  text: Portanto, quando Jesus soube que os fariseus tinham ouvido que Jesus fazia e batizava mais discípulos do que João[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser entendido: “fazia mais discípulos do que João e os batizava”. No grego, a comparação pode se referir à atividade combinada de fazer e batizar discípulos, ou ser associada mais estreitamente ao número de discípulos feitos.'
    reason: alternativa sintática
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Portanto, quando
  rationale: Ὡς introduz a oração temporal, e οὖν indica inferência ou progressão narrativa; a formulação preserva ambas as funções.
- source_word: ἔγνω
  choice: soube
  rationale: O aoristo de γινώσκω indica aqui que Jesus tomou conhecimento da notícia; “soube” é natural e conciso em português.
- source_word: οἱ Φαρισαῖοι
  choice: os fariseus
  rationale: Forma consagrada e amplamente compreendida para o nome do grupo, com o artigo definido do grego.
- source_word: ἤκουσαν
  choice: tinham ouvido dizer
  rationale: O mais-que-perfeito composto esclarece que a notícia já havia chegado aos fariseus; “ouvido dizer” expressa naturalmente a ideia de um relato que circulava.
- source_word: πλείονας μαθητὰς
  choice: mais discípulos
  rationale: Equivalência direta e idiomática do comparativo com o substantivo.
- source_word: ποιεῖ
  choice: fazia
  rationale: Com μαθητάς, ποιέω significa fazer discípulos. A tradução permanece próxima do grego sem antecipar a explicação do versículo seguinte.
- source_word: βαπτίζει
  choice: batizava
  rationale: “Batizar” é o termo padrão, claro e historicamente estabelecido para βαπτίζω neste contexto.
- source_word: ἢ Ἰωάννης
  choice: do que João
  rationale: Reproduz de modo natural a construção comparativa e deixa em aberto o alcance exato da comparação.
theological_decisions:
- issue: Possível impressão de que Jesus batizava pessoalmente
  choice: Manter a formulação superficial do versículo, segundo a qual Jesus fazia e batizava discípulos.
  alternative: Antecipar João 4:2, dizendo que os discípulos de Jesus realizavam os batismos.
  rationale: O versículo seguinte esclarece quem efetuava pessoalmente os batismos. Inserir essa explicação aqui eliminaria deliberadamente a tensão narrativa do texto.
- issue: Alcance da comparação com João
  choice: Usar uma construção que liga “mais discípulos” aos dois verbos coordenados.
  alternative: Entender a comparação como aplicada de maneira mais estreita ao número de discípulos feitos, sem necessariamente qualificar do mesmo modo o ato de batizar.
  rationale: A sintaxe grega permite perceber a comparação como referente à atividade combinada, mas seu alcance exato pode ser analisado de mais de uma maneira; a nota registra essa possibilidade sem sobrecarregar o texto.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A repetição de “Jesus” foi mantida por corresponder ao texto grego. O travessão final preserva a oração suspensa, que continua no versículo seguinte.
