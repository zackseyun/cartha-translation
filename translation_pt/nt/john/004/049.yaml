id: JHN.4.49
reference: John 4:49
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ὁ βασιλικός· Κύριε, κατάβηθι πρὶν ἀποθανεῖν τὸ παιδίον μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/049.yaml
  text: The royal official said to him[a], “Lord, come down before my child dies.”
translation:
  language: pt
  text: 'O oficial do rei lhe disse: “Senhor,[a] desça antes que meu filho morra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Meu senhor”. A palavra grega pode ser uma forma respeitosa de tratamento ou significar “Senhor”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ βασιλικός
  choice: o oficial do rei
  rationale: O adjetivo substantivado designa alguém ligado ao rei ou à corte. “Oficial do rei” é claro em português atual e evita a ideia de classe social sugerida por “nobre”.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva a forma tradicional de tratamento e a possível ressonância mais profunda no Evangelho de João, sem eliminar o sentido contextual de tratamento respeitoso.
- source_word: κατάβηθι
  choice: desça
  rationale: O imperativo indica movimento para baixo, de Caná em direção a Cafarnaum. “Desça” conserva o dado topográfico e soa natural no pedido dirigido a Jesus.
- source_word: πρὶν ἀποθανεῖν
  choice: antes que ... morra
  rationale: A construção com πρίν e infinitivo expressa anterioridade; em português corrente, “antes que ... morra” comunica naturalmente essa relação temporal.
- source_word: τὸ παιδίον μου
  choice: meu filho
  rationale: Embora παιδίον signifique literalmente “criança”, o contexto anterior identifica a criança como o filho do oficial. “Meu filho” é natural em português e mantém a referência contextual sem especificar idade.
- source_word: λέγει πρὸς αὐτόν
  choice: lhe disse
  rationale: O presente histórico grego é vertido pelo pretérito para uma narrativa natural em português; o pronome indireto reproduz de modo conciso o destinatário da fala.
theological_decisions:
- issue: Sentido de κύριος como forma de tratamento dirigida a Jesus
  choice: Senhor
  alternative: Meu senhor / senhor
  rationale: “Senhor” mantém tanto o tratamento respeitoso possível no contexto imediato quanto a ressonância cristológica que o Evangelho pode suscitar, sem decidir que o oficial já fazia uma plena confissão teológica. A nota registra a leitura meramente cortês.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente naturalizada, e “desça” preserva a topografia indicada pelo verbo grego.
