id: JHN.4.20
reference: John 4:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν ἐν τῷ ὄρει τούτῳ προσεκύνησαν· καὶ ὑμεῖς λέγετε ὅτι ἐν Ἱεροσολύμοις ἐστὶν ὁ τόπος ὅπου ⸂προσκυνεῖν δεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/020.yaml
  text: Our fathers worshiped on this mountain[b][a], and you say that in Jerusalem is the place where one must worship.
translation:
  language: pt
  text: Nossos pais adoraram neste monte[a], e vocês dizem que em Jerusalém é o lugar onde se deve adorar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nossos antepassados adoraram neste monte”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “onde é necessário adorar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: Nossos pais
  rationale: Preserva de perto o idioma grego e a reivindicação de linhagem comunitária. Em português, “pais” pode abranger os antepassados; a alternativa mais explícita é registrada em nota.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: neste monte
  rationale: “Neste monte” é a forma locativa natural em português e mantém a referência dêitica a um monte presente no contexto.
- source_word: προσεκύνησαν
  choice: adoraram
  rationale: No contexto da discussão sobre o lugar legítimo de culto, προσκυνέω tem sentido religioso; “adoraram” é claro, corrente e digno.
- source_word: ὑμεῖς
  choice: vocês
  rationale: O pronome explícito é plural e contrasta com “nossos pais”. “Vocês” oferece ampla legibilidade brasileira sem acrescentar identidades não expressas no versículo.
- source_word: ἐν Ἱεροσολύμοις
  choice: em Jerusalém
  rationale: É a construção idiomática padrão em português; a forma plural do topônimo grego não exige reprodução formal.
- source_word: ὁ τόπος
  choice: o lugar
  rationale: Mantém a definição do substantivo sem acrescentar “certo”, “correto” ou “adequado”, qualificações apenas implícitas no contexto.
- source_word: ὅπου
  choice: onde
  rationale: Equivalente relativo locativo natural e direto em português.
- source_word: προσκυνεῖν δεῖ
  choice: se deve adorar
  rationale: A construção impessoal com “se” preserva a necessidade geral expressa por δεῖ sem identificar um sujeito específico nem produzir formulação excessivamente rígida.
- source_word: καὶ
  choice: e
  rationale: Conserva o valor coordenativo formal de καί; o contraste já fica claro por “nossos pais” e “vocês”.
theological_decisions:
- issue: Tornar explícitas as identidades samaritana e judaica no contraste
  choice: Manter o contraste implícito em “Nossos pais... e vocês dizem...”
  alternative: “Nossos antepassados samaritanos... mas vocês, judeus, dizem...”
  rationale: O grego estabelece o contraste por pronomes e pelo contexto, sem nomear samaritanos ou judeus neste versículo. Explicitar essas identidades no texto principal acrescentaria informação contextual.
- issue: Expressar a necessidade impessoal em προσκυνεῖν δεῖ
  choice: “onde se deve adorar”
  alternative: “onde é necessário adorar” ou “onde as pessoas devem adorar”
  rationale: A forma escolhida mantém o caráter geral e normativo da afirmação, sem transformá-la em ordem dirigida a uma pessoa específica.
- issue: Preservar a alegação de exclusividade ligada ao lugar
  choice: Traduzir literalmente “o lugar”, deixando a exclusividade ser percebida pela construção completa
  alternative: “o lugar correto” ou “o único lugar”
  rationale: A discussão pressupõe o lugar apropriado de adoração, mas os qualificadores “correto” e “único” não aparecem expressamente no grego.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Vocês” marca naturalmente o plural contrastivo; “neste monte” e “se deve adorar” evitam literalismo pouco idiomático. Os marcadores seguem a ordem de ocorrência no texto.
