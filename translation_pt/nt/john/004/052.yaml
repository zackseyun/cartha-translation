base_translation:
  language: en
  yaml_path: translation/nt/john/004/052.yaml
  text: So he asked them the hour in which he got better. Then they said to him[a], “Yesterday at the seventh hour the fever left him.”
translation:
  language: pt
  text: 'Então ele lhes perguntou a que hora o menino começou a melhorar. Eles lhe responderam: “Ontem, à sétima hora[a], a febre o deixou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à uma da tarde”, se as horas forem contadas a partir do nascer do sol; alguns entendem que João usa uma contagem das horas diferente.'
    reason: Explica um possível equivalente moderno para «à sétima hora» sem eliminar a incerteza sobre o sistema de contagem das horas no Evangelho de João.
lexical_decisions:
- source_word: ἐπύθετο οὖν
  choice: Então ele lhes perguntou
  rationale: πυνθάνομαι indica perguntar ou indagar, e οὖν faz avançar a narrativa. A formulação é natural em português e mantém a ligação com o versículo anterior.
- source_word: τὴν ὥραν παρ’ αὐτῶν
  choice: lhes perguntou a que hora
  rationale: παρά com o genitivo assinala a fonte da informação; em português, o pronome indireto em “lhes perguntou” expressa isso idiomaticamente. “A que hora” comunica com clareza a referência temporal.
- source_word: ἐν ᾗ κομψότερον ἔσχεν
  choice: a que hora o menino havia começado a melhorar
  rationale: O idioma κομψότερον ἔχειν descreve melhora de saúde. “Havia começado a melhorar” explicita naturalmente o início da melhora investigado pelo pai; “o menino” torna explícito o referente masculino sem ambiguidade em português.
- source_word: εἶπαν οὖν αὐτῷ
  choice: Eles lhe responderam
  rationale: Embora λέγω signifique literalmente “dizer”, neste contexto a fala dos servos é resposta à pergunta. “Responderam” é a equivalência contextual mais natural; οὖν tem aqui função de progressão narrativa já bem representada pela sequência.
- source_word: Ἐχθὲς ὥραν ἑβδόμην
  choice: Ontem, à sétima hora
  rationale: Mantém a designação horária literal do grego, sem impor ao texto um sistema específico de contagem das horas.
- source_word: ἀφῆκεν αὐτὸν ὁ πυρετός
  choice: a febre o deixou
  rationale: Conserva a estrutura em que “a febre” é o sujeito e traduz ἀφίημι de modo claro e próximo do grego.
theological_decisions:
- issue: Sistema de contagem em “à sétima hora”
  choice: Manter “à sétima hora” no texto principal
  alternative: “à uma da tarde”, se a contagem partir do nascer do sol; alguns entendem de outra forma a contagem das horas em João
  rationale: O grego não identifica o sistema horário utilizado. A tradução literal preserva a ambiguidade histórica e evita decidir uma questão cronológica que o próprio versículo não resolve.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português. O marcador [a] aparece após a introdução da resposta, conforme a camada de consulta fornecida, embora a nota se refira especificamente à expressão “à sétima hora”.
