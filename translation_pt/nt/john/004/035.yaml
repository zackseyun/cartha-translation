source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς λέγετε ὅτι Ἔτι τετράμηνός ἐστιν καὶ ὁ θερισμὸς ἔρχεται; ἰδοὺ λέγω ὑμῖν, ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν καὶ θεάσασθε τὰς χώρας ὅτι λευκαί εἰσιν πρὸς θερισμόν· ἤδη
base_translation:
  language: en
  yaml_path: translation/nt/john/004/035.yaml
  text: 'Do you not say[a], ‘There are still four months, and then the harvest comes’? Look, I tell you: lift up your eyes and see the fields, that they are white for harvest already.'
translation:
  language: pt
  text: 'Vocês não dizem: “Ainda faltam quatro meses, e então chega a colheita”? Vejam, eu lhes digo: levantem os olhos e observem os campos, pois já estão brancos para a colheita.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “já estão maduros para a colheita”. O grego diz literalmente “brancos”, preservando a imagem visual e indicando que os campos estão prontos para ser colhidos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὑμεῖς λέγετε
  choice: Vocês não dizem
  rationale: Reproduz naturalmente a pergunta negativa em português; o pronome explícito “vocês” conserva a ênfase de ὑμεῖς sem torná-la excessiva.
- source_word: Ἔτι τετράμηνός ἐστιν
  choice: Ainda faltam quatro meses
  rationale: Expressa em português corrente o intervalo restante até a colheita.
- source_word: καὶ ὁ θερισμὸς ἔρχεται
  choice: e então chega a colheita
  rationale: Mantém a sequência temporal do dito e traduz o presente ἔρχεται de modo idiomático.
- source_word: ἰδοὺ λέγω ὑμῖν
  choice: 'Prestem atenção: eu lhes digo'
  rationale: Comunica a função de ἰδοὺ como chamado enfático à atenção, sem recorrer ao arcaizante “eis”.
- source_word: ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν
  choice: levantem os olhos
  rationale: Preserva a imagem concreta e vívida da expressão grega.
- source_word: θεάσασθε
  choice: observem
  rationale: Indica contemplação intencional e evita repetir imediatamente o verbo “olhar”.
- source_word: τὰς χώρας
  choice: os campos
  rationale: No contexto da colheita, χώρας designa naturalmente os campos cultivados.
- source_word: λευκαί εἰσιν πρὸς θερισμόν
  choice: estão brancos para a colheita
  rationale: Mantém a imagem visual explícita do grego, em vez de substituí-la pela interpretação “maduros” ou “prontos”.
- source_word: ἤδη
  choice: já
  rationale: Conserva a força climática e o contraste com a espera de quatro meses, em posição natural no português.
theological_decisions:
- issue: Se a colheita deve ser explicitada como referência espiritual às pessoas
  choice: Preservar no texto principal a imagem agrícola sem identificar diretamente seu referente
  alternative: Traduzir interpretativamente como “as pessoas já estão prontas para ser reunidas”
  rationale: Embora o contexto dê à colheita uma dimensão metafórica ligada à missão, o versículo mantém a linguagem agrícola; explicitar o referente eliminaria a tensão e a imagem do original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém o discurso direto e a metáfora agrícola, evitando tanto arcaísmos como explicações doutrinárias dentro do texto.
