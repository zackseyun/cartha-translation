source:
  edition: SBLGNT
  text: ὑμεῖς προσκυνεῖτε ὃ οὐκ οἴδατε, ἡμεῖς προσκυνοῦμεν ὃ οἴδαμεν, ὅτι ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/022.yaml
  text: You worship what you do not know; we worship what we know[a], because salvation is from the Jews.
translation:
  language: pt
  text: Vocês adoram o que não conhecem; nós adoramos o que conhecemos, porque a salvação vem dos judeus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «do povo judeu». Em outros trechos de João, «judeus» pode, conforme o contexto, significar «judeanos»; aqui, porém, o contraste é com os samaritanos em questões de culto e da história da salvação.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνεῖτε / προσκυνοῦμεν
  choice: adoram / adoramos
  rationale: No contexto, o verbo designa culto religioso; «adorar» é natural em português e preserva o contraste entre samaritanos e judeus.
- source_word: ὃ
  choice: o que
  rationale: O pronome relativo neutro é mantido sem transformá-lo em referência pessoal mais específica, preservando a formulação geral do grego.
- source_word: οἴδατε / οἴδαμεν
  choice: conhecem / conhecemos
  rationale: «Conhecer» expressa diretamente o contraste quanto ao objeto da adoração e soa natural em português.
- source_word: σωτηρία
  choice: salvação
  rationale: É o equivalente consagrado e adequado para a obra salvadora de Deus neste contexto joanino.
- source_word: ἐκ
  choice: vem de
  rationale: A construção idiomática «vem de» comunica com clareza a ideia de fonte ou origem expressa por ἐκ, sem acrescentar uma explicação teológica.
- source_word: τῶν Ἰουδαίων
  choice: dos judeus
  rationale: É a tradução direta neste contraste entre samaritanos e o povo judeu no âmbito do culto e da história da salvação; a nota registra a alternativa coletiva mais explícita.
theological_decisions:
- issue: Sentido de «a salvação vem dos judeus»
  choice: Manter a afirmação de origem histórica da salvação no povo judeu, sem explicá-la dentro do versículo.
  alternative: Explicitar que se trata da origem judaica do Messias ou, de modo mais amplo, da prioridade da revelação e do culto judaicos.
  rationale: O grego afirma a fonte ou procedência e permite que o contexto sustente suas dimensões histórico-salvíficas; explicitar apenas uma delas estreitaria indevidamente o sentido.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais de ampla legibilidade brasileira. «Vocês» torna explícito o plural de ὑμεῖς. A nota foi colocada após a expressão a que se refere.
