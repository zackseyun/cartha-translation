  text: ἐν γὰρ τούτῳ ὁ λόγος ⸀ἐστὶν ἀληθινὸς ὅτι Ἄλλος ἐστὶν ὁ σπείρων καὶ ἄλλος ὁ θερίζων·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/037.yaml
  text: 'For in this the saying is true: one is the one sowing[c][b][a], and another the one reaping.'
translation:
  language: pt
  text: 'Pois, nisso, o ditado é verdadeiro: “Um é o que semeia, e outro, o que colhe[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Um é o semeador, e outro, o ceifeiro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τούτῳ
  choice: Pois nisso
  rationale: Mantém a função explicativa de γάρ e a referência demonstrativa de ἐν τούτῳ, em português natural e conciso.
- source_word: ὁ λόγος
  choice: o ditado
  rationale: Neste contexto, λόγος designa uma expressão proverbial ou máxima reconhecida, não o título teológico “Palavra”. “Ditado” comunica bem esse valor.
- source_word: ἐστὶν ἀληθινός
  choice: é verdadeiro
  rationale: Expressa diretamente que a máxima se mostra válida nesta situação.
- source_word: ὅτι
  choice: ':'
  rationale: Os dois-pontos introduzem naturalmente em português o conteúdo do ditado.
- source_word: ἄλλος ... καὶ ἄλλος
  choice: Um ... e outro
  rationale: Preserva de maneira concisa o contraste entre dois agentes distintos.
- source_word: ὁ σπείρων
  choice: o que semeia
  rationale: Reproduz o particípio substantivado com uma construção verbal natural, sem convertê-lo necessariamente no nome de agente “semeador”.
- source_word: ὁ θερίζων
  choice: o que colhe
  rationale: Mantém o paralelismo com “o que semeia” e traduz o particípio substantivado em linguagem corrente.
theological_decisions:
- issue: Identidade de quem semeia e de quem colhe
  choice: Manter o ditado geral, sem identificar seus agentes no próprio versículo.
  alternative: Explicitar que aquele que semeia representa os profetas, João Batista ou Jesus, e que aquele que colhe representa os discípulos.
  rationale: O grego não identifica aqui os agentes; a aplicação é desenvolvida pelo contexto. Não se deve inserir uma interpretação específica no texto traduzido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o caráter proverbial, o contraste equilibrado e a ligação explicativa com o versículo anterior.
