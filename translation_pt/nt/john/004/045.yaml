  text: ὅτε οὖν ἦλθεν εἰς τὴν Γαλιλαίαν, ἐδέξαντο αὐτὸν οἱ Γαλιλαῖοι, πάντα ἑωρακότες ⸀ὅσα ἐποίησεν ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ, καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/045.yaml
  text: So when he came into Galilee[a], the Galileans welcomed him, having seen all that he had done in Jerusalem at the feast[b], for they too had gone to the feast.
translation:
  language: pt
  text: Assim, quando ele chegou à Galileia, os galileus o receberam bem[a], tendo visto tudo o que ele havia feito em Jerusalém durante a festa[b], pois eles também tinham ido à festa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o acolheram”. O verbo grego pode indicar receber ou acolher alguém; aqui, o contexto sugere uma recepção favorável.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “celebração”. O termo grego se refere a uma festa religiosa; pelo contexto, trata-se da festa de peregrinação em Jerusalém mencionada anteriormente.'
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Assim, quando
  rationale: Preserva a progressão e a ligação inferencial de οὖν em português natural.
- source_word: ἦλθεν εἰς τὴν Γαλιλαίαν
  choice: ele chegou à Galileia
  rationale: Expressa de modo idiomático o movimento para dentro da região indicado por ἔρχομαι com εἰς.
- source_word: ἐδέξαντο αὐτὸν
  choice: o receberam bem
  rationale: Comunica a acolhida favorável sugerida pelo contexto, sem limitar δέχομαι ao sentido de mera recepção física.
- source_word: οἱ Γαλιλαῖοι
  choice: os galileus
  rationale: Designação geográfica direta, concisa e natural.
- source_word: πάντα ἑωρακότες ὅσα
  choice: pois tinham visto tudo o que
  rationale: O mais-que-perfeito composto reflete a percepção anterior com relevância para a acolhida; 'pois' torna explícita a relação circunstancial provavelmente causal do particípio.
- source_word: ἐποίησεν
  choice: ele havia feito
  rationale: O mais-que-perfeito esclarece que as ações ocorreram antes da recepção na Galileia.
- source_word: ἐν Ἱεροσολύμοις
  choice: em Jerusalém
  rationale: Equivalente locativo padrão.
- source_word: ἐν τῇ ἑορτῇ
  choice: durante a festa
  rationale: Expressa naturalmente a localização temporal da ação no período da celebração religiosa.
- source_word: καὶ αὐτοὶ γὰρ
  choice: eles também
  rationale: Mantém a força inclusiva de καί e αὐτοί; a explicação introduzida por γάρ já é transmitida pela estrutura causal iniciada por 'pois'.
- source_word: ἦλθον εἰς τὴν ἑορτήν
  choice: tinham ido à festa
  rationale: O mais-que-perfeito deixa clara a anterioridade da participação deles, e 'ir à festa' é idiomático no contexto narrativo.
