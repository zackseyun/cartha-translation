  text: τῇ τε γυναικὶ ἔλεγον ὅτι Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν· αὐτοὶ γὰρ ἀκηκόαμεν, καὶ οἴδαμεν ὅτι οὗτός ἐστιν ἀληθῶς ὁ σωτὴρ τοῦ ⸀κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/042.yaml
  text: And they were saying to the woman[a], “We no longer believe because of your word, for we ourselves have heard[b], and we know that this one truly is the Savior of the world.”
translation:
  language: pt
  text: 'E diziam à mulher: “Já não cremos por causa do que você disse[a], pois nós mesmos ouvimos e sabemos que este[b] é verdadeiramente o Salvador do mundo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “por causa da sua fala”. O grego se refere ao testemunho oral da mulher.
    reason: lexical_alternative
  - marker: b
    text: Ou “ele”. O demonstrativo grego é mais enfático do que um simples pronome.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε γυναικὶ
  choice: à mulher
  rationale: O dativo indica a pessoa a quem falavam; τε tem leve força conectiva, expressa naturalmente pelo “E” no início da frase.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito retrata uma fala em andamento ou reiterada no passado; “diziam” preserva esse aspecto com naturalidade.
- source_word: Οὐκέτι
  choice: já não
  rationale: Expressa que o testemunho da mulher deixou de ser o fundamento imediato da fé deles, sem negar a importância anterior desse testemunho.
- source_word: διὰ τὴν σὴν λαλιὰν
  choice: por causa do que você disse
  rationale: διά com acusativo indica causa ou fundamento, e λαλιά se refere à fala ou ao testemunho oral da mulher. A formulação é clara e natural em português moderno.
- source_word: πιστεύομεν
  choice: cremos
  rationale: O presente indica a convicção atual dos samaritanos; “cremos” mantém o tom confessional e é amplamente compreensível.
- source_word: αὐτοὶ γὰρ ἀκηκόαμεν
  choice: pois nós mesmos ouvimos
  rationale: O pronome intensivo αὐτοὶ enfatiza a experiência direta deles, em contraste com o relato recebido da mulher; o perfeito ἀκηκόαμεν é adequadamente representado pelo pretérito perfeito português no contexto.
- source_word: καὶ οἴδαμεν
  choice: e sabemos
  rationale: 'οἴδαμεν tem sentido presente e estativo: eles agora possuem esse conhecimento.'
- source_word: οὗτός
  choice: este
  rationale: O demonstrativo aponta enfaticamente para Jesus. “Este” preserva melhor essa força do que o simples pronome “ele” e permanece natural no contexto.
- source_word: ἀληθῶς
  choice: verdadeiramente
  rationale: Mantém a ênfase solene na veracidade da confissão.
- source_word: ὁ σωτὴρ τοῦ κόσμου
  choice: o Salvador do mundo
  rationale: É uma tradução direta e teologicamente não restritiva, preservando tanto o título σωτήρ quanto o alcance amplo de κόσμος.
theological_decisions:
- issue: Alcance da confissão samaritana
  choice: “o Salvador do mundo”
  alternative: “o Salvador de todas as pessoas” ou uma formulação que restrinja “mundo” a determinado grupo
  rationale: A tradução conserva a amplitude de κόσμος sem explicá-la, ampliá-la ou limitá-la por meio de uma conclusão doutrinária externa ao versículo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Você” é usado na fala dirigida à mulher por ser natural e não cerimonioso. A ordem e os conectivos preservam o contraste entre o testemunho recebido e a experiência direta dos samaritanos.
