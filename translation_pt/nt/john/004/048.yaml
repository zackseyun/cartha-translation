id: JHN.4.48
reference: John 4:48
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς πρὸς αὐτόν· Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε, οὐ μὴ πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/048.yaml
  text: So Jesus said to him[a], “Unless you see signs and wonders, you will certainly not believe.”
translation:
  language: pt
  text: 'Então Jesus lhe disse[a]: “Se vocês não virem sinais e maravilhas, certamente não crerão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Embora Jesus esteja falando diretamente com aquele homem, os verbos “virem” e “crerão” estão no plural no grego; assim, suas palavras parecem abranger também um grupo mais amplo.
    reason: Esclarecer a mudança do referente singular na introdução para as formas plurais na fala de Jesus.
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e lógica da conversa anterior de forma natural em português, sem tornar excessivamente explícita a inferência.
- source_word: πρὸς αὐτόν
  choice: lhe disse
  rationale: Na fórmula de introdução da fala, expressa de modo idiomático que Jesus se dirigiu àquele homem, mantendo o referente singular.
- source_word: Ἐὰν μὴ
  choice: Se ... não
  rationale: Reproduz com naturalidade a condição negativa; embora “a menos que” seja possível, “se ... não” combina melhor com a estrutura verbal da frase em português.
- source_word: σημεῖα
  choice: sinais
  rationale: Preserva o termo característico de João para atos que apontam além de si mesmos, sem reduzi-los simplesmente a “milagres”.
- source_word: τέρατα
  choice: maravilhas
  rationale: Termo claro e tradicional para fenômenos extraordinários que causam assombro, preservando o par “sinais e maravilhas”.
- source_word: ἴδητε
  choice: vocês não virem
  rationale: O verbo grego está na segunda pessoa do plural. “Vocês” torna esse número explícito para o leitor brasileiro e continua amplamente compreensível no português internacional.
- source_word: οὐ μὴ πιστεύσητε
  choice: certamente não crerão
  rationale: A combinação οὐ μή com o subjuntivo aoristo expressa negação enfática. “Certamente não” conserva essa força sem transformar a declaração em uma afirmação temporal absoluta.
- source_word: πιστεύσητε
  choice: crerão
  rationale: “Crer” é a correspondência mais direta e menos interpretativa para πιστεύω no uso joanino, preservando sua profundidade teológica sem a restringir a mera aceitação intelectual.
theological_decisions:
- issue: Número e alcance dos destinatários
  choice: Manter singular a pessoa a quem Jesus dirige inicialmente a fala (“lhe”), mas explicitar o plural dentro da declaração com “vocês”.
  alternative: Entender toda a declaração como dirigida apenas ao oficial, no singular, ou deixar o número implícito.
  rationale: O quadro narrativo apresenta Jesus falando ao oficial, mas os verbos ἴδητε e πιστεύσητε estão no plural. A tradução preserva essa mudança, permitindo que as palavras alcancem um grupo mais amplo sem definir precisamente quem o compõe.
- issue: Força da negação οὐ μή
  choice: “certamente não crerão”
  alternative: “jamais crerão” ou simplesmente “não crerão”
  rationale: A formulação mantém a negação enfática do grego sem enfraquecê-la nem impor a “jamais” um sentido temporal potencialmente mais absoluto que o exigido pelo contexto condicional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O uso explícito de “vocês” preserva o plural do grego e evita que a mudança de número passe despercebida. “Sinais e maravilhas” conserva a terminologia joanina e bíblica sem paráfrase denominacional.
