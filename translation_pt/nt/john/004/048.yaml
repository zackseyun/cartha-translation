  verdict: approve
  source_fidelity: A tradução preserva adequadamente a progressão de οὖν (“Então”), o destinatário singular no quadro narrativo (“lhe”) e a mudança para o plural na fala de Jesus (“vocês ... virem ... crerão”). “Sinais e maravilhas” corresponde diretamente a σημεῖα καὶ τέρατα, e “certamente não crerão” transmite de modo apropriado a negação enfática de οὐ μὴ πιστεύσητε, sem introduzir uma absolutização temporal indevida.
  naturalness: O texto é claro, fluente e de registro bíblico moderno compreensível internacionalmente, com boa legibilidade brasileira. A construção “Se vocês não virem ..., certamente não crerão” é natural e mantém a condição negativa do grego.
  terminology: “Sinais”, “maravilhas” e “crerão” são escolhas consistentes, não interpretativas e adequadas ao vocabulário joanino. A opção por “vocês” explicita legitimamente o plural grego sem definir de modo doutrinário o alcance exato do grupo.
