base_translation:
  language: en
  yaml_path: translation/nt/john/004/016.yaml
  text: He said to her[a], “Go, call your husband, and come here.”
translation:
  language: pt
  text: 'Ele lhe disse[a]: “Vá, chame seu marido e venha aqui.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Ele lhe diz”. O grego usa o presente histórico, um recurso narrativo comum, aqui expresso no passado para soar natural em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: Ele lhe disse
  rationale: O presente grego funciona aqui como presente histórico. O pretérito é mais natural na narrativa em português, sem alterar o sentido.
- source_word: αὐτῇ
  choice: lhe
  rationale: O pronome no dativo marca a destinatária da fala; “lhe” expressa isso de modo conciso e natural.
- source_word: Ὕπαγε
  choice: Vá
  rationale: O imperativo instrui a mulher a sair para realizar a ação seguinte; “Vá” é direto e idiomático.
- source_word: φώνησον
  choice: chame
  rationale: Neste contexto, φωνέω significa chamar alguém; “chame” preserva a formulação direta sem acrescentar a ideia específica de ir buscá-lo.
- source_word: τὸν ἄνδρα σου
  choice: seu marido
  rationale: Embora ἀνήρ também possa significar “homem”, o contexto doméstico e a continuação do diálogo indicam “marido”.
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa simples que liga os dois imperativos.
- source_word: ἐλθὲ
  choice: venha
  rationale: Equivalente direto do imperativo de ἔρχομαι; evita acrescentar “de volta”, ideia apenas implícita.
- source_word: ἐνθάδε
  choice: aqui
  rationale: Advérbio de lugar traduzido naturalmente por “aqui”.
