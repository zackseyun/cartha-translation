  source_fidelity: 'O texto português é fiel ao grego. A construção οὔτε ... καί não nega que o poço seja fundo; ela apresenta dois obstáculos: Jesus não tem utensílio para tirar água, e o poço é fundo. Assim, a coordenação portuguesa “não tem balde, e o poço é fundo” transmite corretamente o sentido, ao contrário da formulação inglesa de auditoria com “neither ... nor is the well deep”, que inverteria o segundo enunciado.'
  naturalness: A redação é moderna, clara e natural para leitores brasileiros e internacionais. “A mulher lhe disse”, “o senhor não tem balde” e “De onde, então, consegue...” mantêm um registro narrativo digno sem artificialidade.
  terminology: “Senhor” preserva a forma κύριε, enquanto a nota adequadamente informa seu possível valor de tratamento respeitoso. “Água viva” conserva tanto a expressão literal quanto sua ressonância no contexto joanino; a alternativa “água corrente” está bem apresentada em nota.
