id: JHN.4.11
reference: John 4:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸂ἡ γυνή⸃· Κύριε, οὔτε ἄντλημα ἔχεις καὶ τὸ φρέαρ ἐστὶν βαθύ· πόθεν οὖν ἔχεις τὸ ὕδωρ τὸ ζῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/011.yaml
  text: The woman said to him[a], “Lord, you have neither a bucket nor is the well deep[b]. So where do you get the living water?”
translation:
  language: pt
  text: 'A mulher lhe disse: “Senhor[a], o senhor não tem balde, e o poço é fundo. De onde, então, consegue a água viva[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “Senhor” também pode ser apenas uma forma respeitosa de tratamento, equivalente a “senhor”.
    reason: alternative_reading
  - marker: b
    text: Ou “água corrente”, isto é, água fresca que flui, em contraste com água parada. “Água viva” também preserva o sentido mais profundo das palavras de Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: lhe disse
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, mais natural na narrativa portuguesa; o pronome preserva o destinatário.
- source_word: ἡ γυνή
  choice: A mulher
  rationale: No contexto, designa a mulher samaritana, não uma esposa.
- source_word: Κύριε
  choice: Senhor
  rationale: Mantém a correspondência usual de κύριε e também pode funcionar como tratamento respeitoso em português; a ambiguidade contextual é explicitada em nota.
- source_word: ἄντλημα
  choice: balde
  rationale: Designa um utensílio para tirar água. “Balde” é claro, atual e adequado à cena.
- source_word: τὸ φρέαρ
  choice: o poço
  rationale: Neste contexto, φρέαρ é o poço do qual se tira água.
- source_word: βαθύ
  choice: fundo
  rationale: É a forma idiomática de descrever a profundidade de um poço, sem acrescentar intensidade ausente do grego.
- source_word: πόθεν οὖν
  choice: De onde, então
  rationale: Preserva tanto a pergunta sobre a origem quanto a inferência marcada por οὖν.
- source_word: ἔχεις τὸ ὕδωρ τὸ ζῶν
  choice: consegue a água viva
  rationale: Neste contexto, ἔχεις pergunta como ou de onde ele obtém essa água. “Água viva” conserva a expressão grega e seu duplo sentido joanino.
theological_decisions:
- issue: Sentido de κύριε no tratamento dado a Jesus
  choice: Senhor
  alternative: senhor, como simples tratamento respeitoso
  rationale: A forma pode indicar apenas cortesia neste ponto do diálogo, sem necessariamente expressar pleno reconhecimento teológico. A tradução mantém “Senhor”, e a nota preserva a possibilidade pragmática.
- issue: Duplo sentido de ὕδωρ τὸ ζῶν
  choice: água viva
  alternative: água corrente
  rationale: A expressão podia designar água fresca e corrente, sentido literal compatível com a compreensão da mulher, mas no Evangelho também carrega um sentido mais profundo. “Água viva” preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “o senhor” evita o regionalismo de “tu” e torna explícito o sujeito após o vocativo. A coordenação simples reproduz naturalmente o argumento da mulher, sem imitar de modo rígido a construção grega.
