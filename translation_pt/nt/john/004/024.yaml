id: JHN.4.24
reference: John 4:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πνεῦμα ὁ θεός, καὶ τοὺς προσκυνοῦντας αὐτὸν ἐν πνεύματι καὶ ἀληθείᾳ δεῖ προσκυνεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/024.yaml
  text: God is spirit[b][a], and those who worship him must worship in spirit and truth.
translation:
  language: pt
  text: Deus é espírito[b], e os que o adoram devem adorá-lo em espírito e em verdade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «no Espírito e em verdade». O grego pode ser entendido de modo mais específico, mas a redação no texto preserva o sentido mais amplo da expressão.'
    reason: alternative_reading
  - marker: b
    text: «Deus é espírito» expressa a natureza de Deus; não significa simplesmente que Deus seja um espírito entre outros.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: espírito
  rationale: Como predicativo sem artigo antes de ὁ θεός, expressa qualitativamente a natureza de Deus, não o identifica como um espírito entre outros. A minúscula evita especificar aqui uma referência ao Espírito Santo.
- source_word: ὁ θεός
  choice: Deus
  rationale: O artigo identifica θεός como sujeito da oração; em português, a referência divina é naturalmente traduzida por «Deus».
- source_word: τοὺς προσκυνοῦντας
  choice: os que o adoram
  rationale: O particípio presente substantivado designa os adoradores como classe. A formulação é natural e conserva o sentido geral e contínuo.
- source_word: ἐν πνεύματι
  choice: em espírito
  rationale: A expressão sem artigo, coordenada com ἀληθείᾳ, permite um sentido amplo de adoração caracterizada pela realidade espiritual, sem excluir a possível referência mais específica ao Espírito.
- source_word: ἀληθείᾳ
  choice: verdade
  rationale: «Verdade» preserva o sentido factual e revelacional característico do uso joanino, sem reduzi-lo apenas a sinceridade.
- source_word: δεῖ
  choice: devem
  rationale: No contexto, exprime necessidade ou obrigação; «devem» concorda naturalmente com o sujeito plural e mantém essa força.
- source_word: προσκυνεῖν
  choice: adorá-lo
  rationale: O infinitivo completa δεῖ. «Adorar» é a equivalência contextual corrente; o pronome retoma Deus e produz português claro.
theological_decisions:
- issue: Sentido de «Deus é espírito»
  choice: Declaração qualitativa sobre a natureza de Deus.
  alternative: «Deus é um espírito», como se fosse um ser espiritual entre outros.
  rationale: A ordem das palavras e a ausência de artigo com πνεῦμα favorecem o valor qualitativo. A tradução evita classificar Deus apenas como membro de uma categoria de espíritos.
- issue: Sentido de «em espírito e em verdade»
  choice: Adoração caracterizada pela realidade espiritual e pela verdade, sem especificar além do texto.
  alternative: «no Espírito e em verdade» ou «com sinceridade e verdade».
  rationale: A construção grega sem artigo admite uma compreensão mais específica relacionada ao Espírito, mas não exige que a tradução principal a imponha; tampouco permite reduzir «espírito» a mera sinceridade interior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a concisão e o paralelismo do grego. Os marcadores aparecem junto às expressões que explicam; a nota [a] é colocada após toda a locução alternativa para maior clareza.
