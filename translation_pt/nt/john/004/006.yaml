  text: ἦν δὲ ἐκεῖ πηγὴ τοῦ Ἰακώβ. ὁ οὖν Ἰησοῦς κεκοπιακὼς ἐκ τῆς ὁδοιπορίας ἐκαθέζετο οὕτως ἐπὶ τῇ πηγῇ· ὥρα ἦν ⸀ὡς ἕκτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/006.yaml
  text: Jacob’s well was there[a]. So Jesus, wearied from the journey, was sitting there by the well[c][b]. It was about the sixth hour.
translation:
  language: pt
  text: Ali estava o poço de Jacó[a]. Jesus, então, cansado da viagem, estava sentado assim junto ao poço[b]. Era por volta da sexta hora[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nascente” ou “fonte”; o termo grego πηγή pode designar uma nascente, uma fonte ou um poço.
    reason: lexical_alternative
  - marker: b
    text: Ou “estava sentado desse modo”; “assim” pode referir-se à maneira ou à circunstância em que estava sentado, mas a nuance exata é incerta.
    reason: lexical_alternative
  - marker: c
    text: Segundo a contagem judaica habitual das horas do dia, seria aproximadamente meio-dia. Alguns entendem que João emprega aqui outro sistema de contagem, o que poderia indicar cerca de seis da tarde.
    reason: alternative_reading
lexical_decisions:
- source_word: πηγή
  choice: poço
  rationale: Embora πηγή também possa significar “nascente” ou “fonte”, o contexto descreve um lugar de onde se tirava água; “poço de Jacó” é ainda a forma consagrada e natural em português. A alternativa lexical é preservada em nota.
- source_word: κεκοπιακὼς
  choice: cansado
  rationale: O particípio perfeito descreve o estado resultante do esforço da viagem. “Cansado” comunica isso de modo claro, natural e digno.
- source_word: ἐκ τῆς ὁδοιπορίας
  choice: da viagem
  rationale: A preposição ἐκ indica a causa ou origem do cansaço. “Cansado da viagem” é a formulação idiomática mais direta em português.
- source_word: ἐκαθέζετο
  choice: estava sentado
  rationale: A construção com o imperfeito apresenta Jesus em uma situação contínua ou descritiva; “estava sentado” preserva melhor esse aspecto do que o pontual “sentou-se”.
- source_word: οὕτως
  choice: assim
  rationale: A tradução mantém o advérbio difícil e potencialmente significativo, sem decidir se ele indica simplesmente a situação descrita, a maneira de se sentar ou a ideia de estar “como estava”. A nota oferece essas nuances.
- source_word: ἐπὶ τῇ πηγῇ
  choice: junto ao poço
  rationale: Com ἐπί e dativo, a expressão é locativa. “Junto ao poço” é natural e não sugere que Jesus estivesse literalmente sobre a estrutura.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: Era cerca da hora sexta
  rationale: “Cerca de” representa ὡς, e “hora sexta” conserva a forma antiga de indicar o tempo sem resolver no texto principal qual sistema de contagem João empregava.
- source_word: δὲ / οὖν
  choice: Ali / então
  rationale: δὲ introduz a informação sobre o local sem exigir um conectivo explícito; “Ali” traduz naturalmente ἐκεῖ. οὖν marca o avanço ou a consequência narrativa e é representado por “então”.
theological_decisions:
- issue: Referência temporal de “hora sexta”
  choice: Manter “cerca da hora sexta” no texto principal.
  alternative: Traduzir como “por volta do meio-dia”; sob outra hipótese de contagem, entender como aproximadamente seis da tarde.
  rationale: O grego não identifica o equivalente no relógio moderno. A formulação literal preserva a questão debatida da cronologia joanina, enquanto a nota apresenta as principais possibilidades sem impor uma delas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Poço de Jacó”, “cansado da viagem” e “junto ao poço” são formulações naturais. A expressão pouco comum “hora sexta” foi mantida deliberadamente para conservar a forma e a ambiguidade cronológica do original; as alternativas aparecem em nota.
