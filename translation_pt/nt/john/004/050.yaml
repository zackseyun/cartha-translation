id: JHN.4.50
reference: John 4:50
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Πορεύου· ὁ υἱός σου ζῇ. ⸀ἐπίστευσεν ὁ ἄνθρωπος τῷ λόγῳ ⸀ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς καὶ ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/050.yaml
  text: Jesus said to him[a], “Go; your son lives.” The man believed the word that Jesus spoke to him and went on his way.
translation:
  language: pt
  text: 'Jesus lhe disse: “Vá; seu filho está vivo.” O homem acreditou na palavra que Jesus lhe disse e seguiu seu caminho.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πορεύου
  choice: Vá
  rationale: O imperativo presente de πορεύομαι funciona aqui como uma ordem direta para partir. “Vá” é conciso, natural e preserva o ritmo da narrativa.
- source_word: ὁ υἱός σου
  choice: seu filho
  rationale: υἱός designa especificamente o filho do sexo masculino; “seu filho” preserva essa precisão.
- source_word: ζῇ
  choice: está vivo
  rationale: O presente do indicativo declara a condição atual do filho. “Está vivo” é mais natural em português neste contexto do que o possível, porém menos idiomático, “vive”, sem transformar a afirmação em promessa futura.
- source_word: ἐπίστευσεν
  choice: acreditou
  rationale: Com o dativo τῷ λόγῳ, πιστεύω expressa aceitar como verdadeira e digna de confiança a palavra dita. “Acreditou” é natural neste complemento e não resolve indevidamente a natureza ou o alcance teológico da fé do homem.
- source_word: ὁ ἄνθρωπος
  choice: O homem
  rationale: O grego emprega aqui o termo geral ἄνθρωπος. A tradução conserva “o homem” em vez de importar do contexto anterior sua condição de oficial.
- source_word: τῷ λόγῳ
  choice: na palavra
  rationale: λόγος refere-se à declaração pronunciada por Jesus. “Na palavra” mantém a imagem verbal do original, esclarecida pela oração relativa seguinte.
- source_word: ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: que Jesus lhe disse
  rationale: A formulação é idiomática em português, mantém explicitamente Jesus como sujeito e representa com precisão εἶπεν αὐτῷ.
- source_word: ἐπορεύετο
  choice: seguiu seu caminho
  rationale: O imperfeito de πορεύομαι apresenta o homem prosseguindo em sua jornada. “Seguiu seu caminho” transmite melhor esse movimento narrativo do que o simples “foi”.
theological_decisions:
- issue: Sentido de πιστεύω como resposta à palavra de Jesus
  choice: acreditou
  alternative: confiou
  rationale: “Acreditou” indica que o homem aceitou a declaração de Jesus sem definir se o narrador descreve aqui fé salvífica, confiança circunstancial ou um estágio de fé. Assim, preserva-se a tensão narrativa joanina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala de Jesus permanece breve e enfática; a narração evita linguagem excessivamente eclesiástica.
