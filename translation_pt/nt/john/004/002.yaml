  text: embora não fosse o próprio Jesus quem batizava, e sim os seus discípulos—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καίτοιγε
  choice: embora
  rationale: Introduz uma ressalva concessiva ao que foi dito no versículo anterior; «embora» é natural e preserva essa relação lógica.
- source_word: Ἰησοῦς αὐτὸς
  choice: o próprio Jesus
  rationale: Preserva a ênfase de αὐτός em que Jesus pessoalmente não realizava os batismos.
- source_word: οὐκ ἐβάπτιζεν
  choice: não estivesse batizando
  rationale: O imperfeito indica ação em curso ou habitual no contexto; a locução verbal mantém esse aspecto de modo natural em português.
- source_word: ἀλλ’
  choice: mas sim
  rationale: Marca com clareza o contraste corretivo entre Jesus e seus discípulos.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: os seus discípulos
  rationale: Mantém a elipse do verbo presente no grego; «estivessem batizando» fica subentendido pelo primeiro membro da oração.
theological_decisions:
- issue: Quem realizava os batismos no ministério de Jesus
  choice: Jesus não os administrava pessoalmente; seus discípulos os realizavam.
  alternative: «Jesus não batizou, mas os seus discípulos batizaram», sem explicitar o valor aspectual do imperfeito.
  rationale: A redação preserva tanto a ênfase em Jesus pessoalmente quanto a ação em curso ou habitual, sem acrescentar explicação teológica ao esclarecimento narrativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O travessão final preserva a continuidade sintática com o contexto. «Mas sim» torna natural o contraste apesar da elipse verbal.
