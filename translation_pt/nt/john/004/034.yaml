  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐμὸν βρῶμά ἐστιν ἵνα ⸀ποιήσω τὸ θέλημα τοῦ πέμψαντός με καὶ τελειώσω αὐτοῦ τὸ ἔργον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/034.yaml
  text: Jesus said to them[b][a], “My food is to do the will of him who sent me and to complete his work.”
translation:
  language: pt
  text: 'Jesus lhes disse: “Meu alimento é fazer a vontade daquele que me enviou[b] e completar a obra dele[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “concluir a obra dele”.
    reason: lexical_alternative
  - marker: b
    text: “Daquele que me enviou” refere-se, pelo contexto, ao Pai, embora o grego não use explicitamente esse título aqui.
    reason: cross_reference
lexical_decisions:
- source_word: βρῶμά
  choice: alimento
  rationale: Preserva a metáfora concreta no contexto em que os discípulos falavam de comida; “alimento” é natural e digno em português.
- source_word: Ἐμὸν βρῶμά ἐστιν
  choice: Meu alimento é
  rationale: Mantém a forma enfática e a metáfora do grego sem explicá-la em excesso.
- source_word: ἵνα ποιήσω
  choice: é fazer
  rationale: O infinitivo é a maneira idiomática em português de expressar aqui o conteúdo ou propósito introduzido por ἵνα com subjuntivo.
- source_word: τὸ θέλημα
  choice: a vontade
  rationale: É a correspondência precisa e corrente de θέλημα, preservando a linguagem de obediência.
- source_word: τοῦ πέμψαντός με
  choice: daquele que me enviou
  rationale: Traduz naturalmente o particípio substantivado sem inserir explicitamente o título “Pai”, ausente no texto grego.
- source_word: τελειώσω
  choice: completar
  rationale: Comunica levar a obra até seu término ou cumprimento; a alternativa “concluir” também é possível.
- source_word: αὐτοῦ τὸ ἔργον
  choice: a obra dele
  rationale: Preserva a referência pronominal do grego e traduz ἔργον pelo termo amplo e contextualmente apropriado “obra”.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Jesus lhes disse
  rationale: O presente histórico grego é vertido pelo passado narrativo natural em português.
theological_decisions:
- issue: Identidade daquele que enviou Jesus
  choice: Manter “daquele que me enviou” no texto e esclarecer em nota que o referente contextual é o Pai.
  alternative: Traduzir explicitamente “do Pai que me enviou”.
  rationale: O contexto joanino identifica o referente, mas este versículo não emprega explicitamente o título “Pai”; a tradução conserva essa distinção.
- issue: Nuance de τελειώσω
  choice: Traduzir por “completar”.
  alternative: “concluir” ou “levar a termo”.
  rationale: “Completar” preserva tanto a ideia de terminar quanto a de conduzir a obra ao cumprimento, sem impor uma interpretação teológica adicional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva-se a metáfora de alimento e a referência implícita ao Pai. Os marcadores foram colocados junto às expressões que explicam.
