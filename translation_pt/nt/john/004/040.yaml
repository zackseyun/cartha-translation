id: JHN.4.40
reference: John 4:40
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς οὖν ἦλθον πρὸς αὐτὸν οἱ Σαμαρῖται, ἠρώτων αὐτὸν μεῖναι παρ’ αὐτοῖς· καὶ ἔμεινεν ἐκεῖ δύο ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/040.yaml
  text: So when the Samaritans came to him[a], they asked him to stay with them, and he stayed there two days.
translation:
  language: pt
  text: Assim, quando os samaritanos chegaram até ele, pediam que ficasse com eles; e ele ficou ali dois dias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς οὖν
  choice: Assim, quando
  rationale: Expressa de modo natural tanto a ligação inferencial/sequencial de οὖν quanto o valor temporal de ὡς.
- source_word: ἦλθον πρὸς αὐτὸν
  choice: chegaram até ele
  rationale: Representa o movimento em direção a Jesus indicado por ἔρχομαι com πρός e acusativo.
- source_word: οἱ Σαμαρῖται
  choice: os samaritanos
  rationale: Designação direta e corrente do grupo étnico mencionado no texto.
- source_word: ἠρώτων
  choice: pediam
  rationale: O pretérito imperfeito preserva naturalmente em português o aspecto contínuo ou reiterado do imperfeito grego, sem intensificá-lo para 'insistiam'.
- source_word: μεῖναι παρ’ αὐτοῖς
  choice: que ficasse com eles
  rationale: Formulação idiomática que comunica a permanência na companhia deles.
- source_word: καὶ ἔμεινεν ἐκεῖ
  choice: e ele ficou ali
  rationale: Mantém a correspondência lexical com μεῖναι e representa explicitamente ἐκεῖ.
- source_word: δύο ἡμέρας
  choice: dois dias
  rationale: Tradução direta do acusativo de duração.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperfeito 'pediam' conserva no próprio texto a possível continuidade ou repetição do pedido, dispensando nota explicativa.
