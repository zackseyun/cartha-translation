id: JHN.4.31
reference: John 4:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Ἐν τῷ μεταξὺ ἠρώτων αὐτὸν οἱ μαθηταὶ λέγοντες· Ῥαββί, φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/031.yaml
  text: Meanwhile, the disciples were urging him, saying, “Rabbi, eat.”
translation:
  language: pt
  text: 'Enquanto isso[a], os discípulos insistiam com ele[b], dizendo: “Rabi[c], coma.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Nesse meio-tempo”.
    reason: lexical_alternative
  - marker: b
    text: O verbo também pode ser traduzido por “pediam” ou “continuavam pedindo”; aqui, o contexto transmite a ideia de insistirem para que Jesus comesse.
    reason: lexical_alternative
  - marker: c
    text: “Rabi” é um título judaico usado ao dirigir-se a alguém e também significa “Mestre”.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν τῷ μεταξὺ
  choice: Enquanto isso
  rationale: A expressão idiomática indica o intervalo entre a partida da mulher e esta conversa. “Enquanto isso” comunica esse valor temporal de modo natural em português.
- source_word: ἠρώτων
  choice: insistiam com
  rationale: O imperfeito retrata uma ação contínua ou repetida. Embora ἐρωτάω possa significar “pedir” ou “perguntar”, neste contexto os discípulos procuram persuadir Jesus a comer; “insistiam com” preserva essa força contextual.
- source_word: αὐτὸν
  choice: ele
  rationale: Pronome objeto que se refere a Jesus; após a locução “insistir com”, a forma “ele” é a construção natural em português.
- source_word: οἱ μαθηταὶ
  choice: os discípulos
  rationale: O artigo identifica o grupo já conhecido no contexto, sem necessidade de acrescentar “dele”.
- source_word: λέγοντες
  choice: dizendo
  rationale: O particípio introduz as palavras com que os discípulos insistiam e é preservado de maneira clara.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Mantém o título judaico de tratamento empregado no texto, em sua forma portuguesa corrente, sem reduzi-lo no corpo do versículo a “Mestre”.
- source_word: φάγε
  choice: coma
  rationale: O imperativo aoristo singular é vertido diretamente pelo imperativo português dirigido a Jesus.
