id: JHN.4.5
reference: John 4:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔρχεται οὖν εἰς πόλιν τῆς Σαμαρείας λεγομένην Συχὰρ πλησίον τοῦ χωρίου ὃ ἔδωκεν Ἰακὼβ ⸀τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/005.yaml
  text: So he came to a town of Samaria called Sychar[b][a], near the piece of land that Jacob had given to Joseph his son.
translation:
  language: pt
  text: Assim, ele chegou a uma cidade de Samaria chamada Sicar[a], perto do terreno[b] que Jacó tinha dado a seu filho José.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma povoação de Samaria». A palavra grega πόλις pode designar tanto uma cidade como uma povoação, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou «campo», «propriedade» ou «porção de terra».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: chegou
  rationale: O presente grego funciona como presente histórico na narrativa; o pretérito perfeito é a forma mais natural em português para manter a sequência dos acontecimentos.
- source_word: οὖν
  choice: Assim
  rationale: Conserva a ligação inferencial e narrativa com o contexto anterior sem a formalidade mais forte de «portanto».
- source_word: πόλιν
  choice: cidade
  rationale: πόλις pode designar cidade ou povoação; «cidade» é a correspondência portuguesa usual, enquanto a amplitude lexical é registrada em nota.
- source_word: τῆς Σαμαρείας
  choice: de Samaria
  rationale: Reproduz naturalmente o genitivo que situa a cidade na região de Samaria.
- source_word: λεγομένην Συχὰρ
  choice: chamada Sicar
  rationale: Expressão idiomática e direta para o particípio que identifica o nome do lugar.
- source_word: πλησίον
  choice: perto de
  rationale: Equivalente espacial claro e corrente.
- source_word: χωρίου
  choice: terreno
  rationale: χωρίον pode indicar campo, propriedade ou porção de terra; «terreno» preserva essa abrangência sem pressupor cultivo.
- source_word: ὃ ἔδωκεν Ἰακὼβ
  choice: que Jacó tinha dado
  rationale: O pretérito mais-que-perfeito composto apresenta naturalmente a doação como anterior à chegada narrada.
- source_word: τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ
  choice: a seu filho José
  rationale: Mantém José como destinatário e explicita de forma natural em português a relação appositiva «seu filho».
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para «seu filho José», mais idiomática em português, sem alterar a relação expressa no grego. Os marcadores aparecem imediatamente após os termos a que se referem.
