source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἰακώβ, ὃς ἔδωκεν ἡμῖν τὸ φρέαρ καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν καὶ οἱ υἱοὶ αὐτοῦ καὶ τὰ θρέμματα αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/012.yaml
  text: Are you greater than our father Jacob[a], who gave us the well and drank from it himself, as did his sons and his livestock?
translation:
  language: pt
  text: Por acaso você é maior do que o nosso pai Jacó[a], que nos deu o poço e bebeu dele, assim como seus filhos e seus rebanhos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais explicitamente: “Você certamente não é maior do que o nosso pai Jacó, é?” No grego, a forma da pergunta indica que se espera uma resposta negativa.'
    reason: alternativa lexical e explicação da força retórica
lexical_decisions:
- source_word: μὴ σὺ
  choice: Será que você
  rationale: A pergunta introduzida por μή espera resposta negativa. “Será que você” preserva em português o tom retórico e desafiador sem transformar a expectativa em uma afirmação explícita.
- source_word: μείζων
  choice: maior do que
  rationale: O comparativo se refere à grandeza ou posição, não ao tamanho físico; “maior do que” é natural e mantém a amplitude do grego.
- source_word: τοῦ πατρὸς ἡμῶν Ἰακώβ
  choice: do que o nosso pai Jacó
  rationale: Preserva a linguagem ancestral e honorífica da mulher samaritana em ordem natural no português.
- source_word: ἔδωκεν ἡμῖν τὸ φρέαρ
  choice: nos deu este poço
  rationale: O aoristo é traduzido pelo pretérito perfeito simples. “Este” explicita de modo natural o poço presente na cena, referido pelo artigo grego em contexto.
- source_word: καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν
  choice: e dele bebeu, tanto ele mesmo
  rationale: “Dele” retoma claramente o poço, e “ele mesmo” conserva a ênfase de αὐτός. A construção com “tanto... como” coordena naturalmente os três sujeitos do verbo.
- source_word: οἱ υἱοὶ αὐτοῦ
  choice: seus filhos
  rationale: No contexto patriarcal, υἱοί designa os filhos homens de Jacó; “filhos” é a forma portuguesa natural e semanticamente adequada.
- source_word: τὰ θρέμματα αὐτοῦ
  choice: seus rebanhos
  rationale: θρέμματα abrange animais domésticos criados por alguém. “Rebanhos” é claro e idiomático, sem restringir a referência apenas a gado bovino.
theological_decisions:
- issue: Força da pergunta retórica introduzida por μή
  choice: Pergunta com “Será que você...?”, que sugere a resposta “não”
  alternative: “Você não é maior do que o nosso pai Jacó, é?”
  rationale: A formulação escolhida comunica a expectativa negativa da mulher sem converter a pergunta em negação categórica, preservando o desafio e a ironia dramática do diálogo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Será que” expressa naturalmente a pergunta retórica; “rebanhos” evita o tom técnico de “animais de criação” e a limitação de “gado”.
