lexical_decisions:
- source_word: ὑδρία
  choice: cântaro
  rationale: Designa um recipiente para buscar e carregar água; “cântaro” é natural, preciso e mantém o cenário do poço.
- source_word: πόλις
  choice: cidade
  rationale: Equivalente direto e corrente de πόλις neste contexto.
- source_word: ἄνθρωποι
  choice: pessoas
  rationale: O plural τοῖς ἀνθρώποις refere-se de modo geral às pessoas da cidade; “pessoas” evita restringir indevidamente o grupo a homens do sexo masculino.
theological_decisions:
- issue: Presente histórico em λέγει após verbos no passado
  choice: diz
  alternative: disse
  rationale: Preserva a mudança vívida do aoristo narrativo para o presente histórico no texto grego, sem resolver ou uniformizar a tensão verbal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem narrativa foi mantida, e o presente histórico “diz” reproduz deliberadamente a forma do original.
