  text: ἔλεγον οὖν οἱ μαθηταὶ πρὸς ἀλλήλους· Μή τις ἤνεγκεν αὐτῷ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/033.yaml
  text: So the disciples were saying to one another[a], “Has anyone brought him something to eat?”
translation:
  language: pt
  text: 'Então os discípulos diziam uns aos outros[a]: “Ninguém trouxe algo para ele comer?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Será que alguém trouxe algo para ele comer?” A pergunta grega com μή espera uma resposta negativa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito retrata a conversa em andamento ou repetida entre os discípulos; “diziam” preserva esse aspecto com naturalidade.
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e a reação ao que Jesus acabara de dizer; “Então” é natural e mantém a ligação contextual.
- source_word: οἱ μαθηταὶ
  choice: os discípulos
  rationale: “Discípulos” é o termo português consagrado e contextualmente preciso para os seguidores de Jesus.
- source_word: πρὸς ἀλλήλους
  choice: uns aos outros
  rationale: Expressa diretamente a reciprocidade da conversa dentro do grupo.
- source_word: Μή τις
  choice: Será que alguém
  rationale: A pergunta com μή tende a esperar resposta negativa. Em português, “Será que alguém...?” conserva a incerteza percebida no diálogo, embora não expresse por si só toda a expectativa negativa; esta nuance é explicitada em nota.
- source_word: ἤνεγκεν
  choice: trouxe
  rationale: No contexto, o aoristo de φέρω se refere a trazer alimento; “trouxe” é a equivalência idiomática direta.
- source_word: αὐτῷ
  choice: para ele
  rationale: 'Explicita com naturalidade o objeto indireto: aquilo teria sido trazido para Jesus.'
- source_word: φαγεῖν
  choice: algo para ele comer
  rationale: O infinitivo indica a finalidade ou uso do que teria sido trazido. “Algo para ele comer” é português natural e não especifica alimento além do implícito.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O imperfeito “diziam” preserva o desenvolvimento da cena. A nota mantém a expectativa negativa da construção grega sem tornar o diálogo principal artificial.
