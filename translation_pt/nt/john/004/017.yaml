base_translation:
  language: en
  yaml_path: translation/nt/john/004/017.yaml
  text: 'The woman answered and said to him[a], “I do not have a husband.” Jesus said to her[b], “You have spoken well: ‘I do not have a husband.’”'
translation:
  language: pt
  text: 'A mulher respondeu: “Não tenho marido.” Jesus lhe disse: “Você disse bem: ‘Não tenho marido.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν
  choice: A mulher respondeu
  rationale: A fórmula grega literalmente reúne ‘respondeu’ e ‘disse’, mas, em português atual, ‘respondeu’ já introduz naturalmente a fala e evita redundância sem perda de sentido.
- source_word: Οὐκ ἔχω ἄνδρα
  choice: Não tenho marido
  rationale: Embora ἀνήρ possa significar ‘homem’ ou ‘marido’, o contexto imediato sobre a situação conjugal da mulher determina aqui o sentido ‘marido’. A construção portuguesa é direta e corrente.
- source_word: λέγει αὐτῇ ὁ Ἰησοῦς
  choice: Jesus lhe disse
  rationale: O presente histórico grego é vertido pelo pretérito, forma natural da narrativa portuguesa; ‘lhe’ expressa com clareza o objeto indireto feminino.
- source_word: Καλῶς εἶπας
  choice: Você disse bem
  rationale: Preserva a avaliação positiva de καλῶς e a referência ao que ela acabou de dizer, em linguagem atual, digna e amplamente compreensível.
- source_word: ὅτι Ἄνδρα οὐκ ἔχω
  choice: ': ‘Não tenho marido.’'
  rationale: ὅτι introduz o conteúdo da declaração. Os dois-pontos e a citação direta reproduzem com naturalidade a repetição enfática das palavras da mulher.
theological_decisions:
- issue: Sentido de ἀνήρ na declaração da mulher
  choice: marido
  alternative: homem
  rationale: O versículo seguinte explicita o histórico conjugal da mulher; assim, ‘marido’ comunica o sentido contextual sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, natural e digno, com boa legibilidade brasileira e compreensão internacional. A redundância semítica ‘respondeu e disse’ foi condensada, mas a repetição central ‘Não tenho marido’ foi preservada. Não foram necessárias notas de rodapé, pois a ambiguidade lexical de ἀνήρ é resolvida de modo suficientemente claro pelo contexto imediato.
