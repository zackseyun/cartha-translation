  text: ἐξῆλθον ἐκ τῆς πόλεως καὶ ἤρχοντο πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/030.yaml
  text: They went out of the city and were coming to him[a].
translation:
  language: pt
  text: Eles saíram da cidade e vinham em direção a ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles saíram da cidade e estavam a caminho de onde ele estava”.'
    reason: Alternativa lexical que torna explícito o caráter progressivo de ἤρχοντο, sem afirmar que já haviam chegado.
lexical_decisions:
- source_word: ἐξῆλθον ἐκ τῆς πόλεως
  choice: saíram da cidade
  rationale: O aoristo de ἐξέρχομαι com ἐκ indica a saída de um lugar delimitado. “Saíram da cidade” é natural em português e mantém o movimento desde o interior da cidade.
- source_word: τῆς πόλεως
  choice: da cidade
  rationale: πόλις pode designar cidade ou povoado; “cidade” é a correspondência ampla e tradicional, adequada ao contexto.
- source_word: ἤρχοντο
  choice: vinham
  rationale: O imperfeito expressa uma ação em andamento no passado. “Vinham” preserva esse aspecto melhor que o pontual “vieram”.
- source_word: πρὸς αὐτόν
  choice: até ele
  rationale: πρός com acusativo indica movimento em direção a uma pessoa. “Até ele” comunica de modo idiomático que se dirigiam ao lugar onde Jesus estava.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A construção mantém a distinção aspectual entre o aoristo “saíram” e o imperfeito progressivo “vinham”.
