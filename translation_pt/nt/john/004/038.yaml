  text: ἐγὼ ἀπέστειλα ὑμᾶς θερίζειν ὃ οὐχ ὑμεῖς κεκοπιάκατε· ἄλλοι κεκοπιάκασιν, καὶ ὑμεῖς εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/038.yaml
  text: I sent you to reap what you have not labored for[a]; others have labored[b], and you have entered into their labor.
translation:
  language: pt
  text: Eu os enviei para colher aquilo pelo qual vocês não trabalharam[a]. Outros trabalharam, e vocês entraram no trabalho deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para fazer a colheita”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “passaram a participar do trabalho deles” ou “passaram a participar dos resultados de seu trabalho”. O grego diz mais literalmente: “entraram no trabalho deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλα
  choice: enviei
  rationale: O aoristo indica aqui um envio realizado; “enviei” preserva de modo natural a força missional sem explicitar além do grego a ideia de comissionamento.
- source_word: θερίζειν
  choice: colher
  rationale: “Colher” mantém a metáfora agrícola do contexto e é corrente no português moderno; a alternativa “fazer a colheita” é possível, mas menos concisa.
- source_word: ὃ οὐχ ὑμεῖς κεκοπιάκατε
  choice: aquilo em que vocês não trabalharam
  rationale: A formulação conserva o objeto relativo e relaciona o esforço anterior ao campo ou à obra agora colhida, sem acrescentar no texto principal a ideia interpretativa de fruto ou resultado.
- source_word: ἄλλοι κεκοπιάκασιν
  choice: Outros trabalharam
  rationale: O perfeito grego apresenta um trabalho anterior ainda relevante. O pretérito perfeito simples é natural em português e o contexto comunica seu resultado presente.
- source_word: εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε
  choice: vocês entraram no trabalho deles
  rationale: Tradução próxima da construção grega, preservando a imagem incomum e evitando substituí-la silenciosamente por “desfrutaram do fruto” ou “participaram”.
- source_word: ἐγὼ ... ὑμεῖς
  choice: Eu ... vocês
  rationale: Os pronomes explícitos preservam o contraste entre quem envia e os enviados. “Vocês” oferece legibilidade brasileira e continua amplamente compreensível em português internacional.
theological_decisions:
- issue: Identidade dos “outros” que trabalharam
  choice: Manter o referente indefinido
  alternative: Identificá-los especificamente como os profetas, João Batista, Jesus ou testemunhas anteriores
  rationale: O versículo não identifica os “outros”; manter a referência aberta preserva a ambiguidade e evita inserir uma interpretação teológica particular.
- issue: Sentido de entrar no trabalho alheio
  choice: Conservar a expressão concreta “entraram no trabalho deles”
  alternative: Explicitar como receber os frutos do trabalho ou participar da obra
  rationale: O grego fala literalmente em entrar no κόπος deles. As paráfrases possíveis esclarecem sentidos plausíveis, mas resolvem uma imagem que o texto deixa aberta.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A repetição de “trabalhar/trabalho” reproduz a ligação entre κεκοπιάκατε, κεκοπιάκασιν e κόπον. A metáfora da colheita e a identidade dos trabalhadores anteriores permanecem abertas.
