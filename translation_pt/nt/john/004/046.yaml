  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἦλθεν οὖν ⸀πάλιν εἰς τὴν Κανὰ τῆς Γαλιλαίας, ὅπου ἐποίησεν τὸ ὕδωρ οἶνον. καὶ ἦν τις βασιλικὸς οὗ ὁ υἱὸς ἠσθένει ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/046.yaml
  text: So he came again to Cana of Galilee[a], where he had made the water wine[b]. And there was a certain royal official whose son was sick in Capernaum.
translation:
  language: pt
  text: Então, ele voltou a Caná da Galileia, onde havia feito da água vinho.[a] Havia ali certo funcionário real[b], cujo filho estava doente em Cafarnaum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais interpretativo, “onde havia transformado a água em vinho”. O grego diz mais literalmente: “onde havia feito da água vinho”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “oficial do rei”, “homem da corte” ou “nobre”. O termo grego βασιλικός designa alguém ligado a um rei, a uma corte ou ao serviço real; o cargo exato não é informado.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Assim
  rationale: Mantém a ligação narrativa e inferencial com o contexto anterior, em português natural, sem tornar a relação excessivamente conclusiva.
- source_word: πάλιν
  choice: voltou
  rationale: Em combinação com ἦλθεν, expressa naturalmente que Jesus foi novamente a Caná; evita a formulação menos fluida “veio novamente” fora de um ponto de referência explícito em português.
- source_word: Κανὰ τῆς Γαλιλαίας
  choice: Caná da Galileia
  rationale: Conserva a forma tradicional e reconhecível do topônimo e representa de perto o genitivo regional grego.
- source_word: ἐποίησεν τὸ ὕδωρ οἶνον
  choice: havia feito da água vinho
  rationale: Preserva a formulação relativamente literal do grego e usa o mais-que-perfeito composto para situar o sinal antes da presente visita.
- source_word: τις
  choice: certo
  rationale: Apresenta uma pessoa específica, mas não identificada, preservando a nuance do pronome indefinido.
- source_word: βασιλικός
  choice: funcionário do rei
  rationale: Comunica de modo claro uma pessoa ligada ao serviço ou à corte de um governante, sem afirmar cargo, patente ou nobreza específicos.
- source_word: υἱός
  choice: filho
  rationale: Representa a designação masculina específica do texto grego.
- source_word: ἠσθένει
  choice: estava doente
  rationale: No contexto, o verbo indica enfermidade física; esta é uma expressão corrente e precisa em português.
- source_word: Καφαρναούμ
  choice: Cafarnaum
  rationale: Emprega a forma portuguesa consagrada do nome geográfico.
theological_decisions:
- issue: Identidade e posição exata do βασιλικός
  choice: funcionário do rei
  alternative: oficial real; homem da corte; nobre
  rationale: O texto indica associação com um governante ou uma corte, mas não determina a função, a patente nem a condição social precisa do homem. A tradução escolhida evita importar uma identificação histórica específica com a corte de Herodes Antipas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Assim” mantém a continuidade narrativa; “voltou” torna natural a combinação de ἦλθεν com πάλιν. As notas preservam tanto a expressão incomum sobre a água e o vinho quanto a incerteza acerca da posição do βασιλικός.
