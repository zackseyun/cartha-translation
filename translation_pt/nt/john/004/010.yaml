id: JHN.4.10
reference: John 4:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Εἰ ᾔδεις τὴν δωρεὰν τοῦ θεοῦ καὶ τίς ἐστιν ὁ λέγων σοι· Δός μοι πεῖν, σὺ ἂν ᾔτησας αὐτὸν καὶ ἔδωκεν ἄν σοι ὕδωρ ζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/010.yaml
  text: Jesus answered and said to her[a], “If you knew the gift of God, and who it is who says to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”
translation:
  language: pt
  text: 'Jesus lhe respondeu: “Se você conhecesse o dom de Deus e soubesse quem é que lhe diz: ‘Dê-me de beber’, você lhe teria pedido, e ele lhe teria dado água viva[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “água corrente” ou “água fresca”. A expressão pode designar água que flui, mas “água viva” preserva o duplo sentido pretendido aqui.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ
  choice: Jesus lhe respondeu
  rationale: Em português, a fórmula dupla grega é expressa naturalmente pelo verbo “respondeu”; reproduzir literalmente “respondeu e disse” seria possível, mas menos corrente e não acrescentaria conteúdo aqui.
- source_word: τὴν δωρεὰν τοῦ θεοῦ
  choice: o dom de Deus
  rationale: “Dom” comunica uma dádiva concedida gratuitamente e conserva de modo conciso o genitivo grego.
- source_word: τίς ἐστιν ὁ λέγων σοι
  choice: soubesse quem é que lhe diz
  rationale: A formulação preserva a ênfase identificadora do grego, enquanto a repetição de “soubesse” torna natural em português a coordenação subordinada a “Se”.
- source_word: Δός μοι πεῖν
  choice: Dê-me de beber
  rationale: Expressão portuguesa idiomática e digna para o imperativo seguido de infinitivo, sem acrescentar um objeto ausente no grego.
- source_word: ᾔτησας αὐτὸν
  choice: você lhe teria pedido
  rationale: O condicional composto expressa a situação irreal no passado; “lhe” retoma a pessoa que fala sem inserir explicitamente o conteúdo do pedido.
- source_word: ἔδωκεν ἄν σοι
  choice: ele lhe teria dado
  rationale: O condicional composto representa adequadamente a apódose potencial ou contrária ao fato marcada por ἄν.
- source_word: ὕδωρ ζῶν
  choice: água viva
  rationale: A expressão tradicional e natural preserva tanto o sentido concreto possível de água corrente quanto a ressonância mais profunda desenvolvida no contexto joanino.
theological_decisions:
- issue: Manter a força concreta e simbólica de ὕδωρ ζῶν
  choice: água viva
  alternative: água corrente; água fresca
  rationale: “Água viva” conserva a tensão intencional entre a compreensão física imediata e o significado espiritual que se revela no diálogo, sem resolver antecipadamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e ampla compreensão internacional. O tratamento “você” favorece naturalidade no Brasil; os pronomes átonos “lhe” evitam repetições e mantêm o registro respeitoso.
