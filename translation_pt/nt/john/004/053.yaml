source:
  edition: SBLGNT
  text: ἔγνω οὖν ὁ πατὴρ ⸀ὅτι ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ εἶπεν αὐτῷ ὁ ⸀Ἰησοῦς· Ὁ υἱός σου ζῇ, καὶ ἐπίστευσεν αὐτὸς καὶ ἡ οἰκία αὐτοῦ ὅλη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/053.yaml
  text: So the father knew that it was at that hour when Jesus said to him[a], “Your son lives,” and he himself believed[b], and his whole household.
translation:
  language: pt
  text: 'Assim, o pai soube que tinha sido naquela hora em que Jesus lhe disse: “Seu filho está vivo”[a]. E ele mesmo creu[b], e toda a sua casa também.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Seu filho vive”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo “creu” pode se referir tanto a crer especificamente na palavra de Jesus quanto a chegar a uma fé mais plena em Jesus; o grego deixa implícito o alcance dessa fé.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: soube
  rationale: O aoristo de γινώσκω indica que o pai reconheceu a correspondência entre a hora informada pelos servos e a palavra de Jesus. “Soube” preserva a força cognitiva sem explicitar além do texto o processo dessa constatação.
- source_word: οὖν
  choice: Assim
  rationale: Assinala a conclusão tirada da informação dos servos no versículo anterior e mantém de modo natural a conexão lógica.
- source_word: ὁ πατὴρ
  choice: o pai
  rationale: Segue diretamente o grego e mantém a ênfase narrativa no vínculo familiar, em vez de retomar sua condição de oficial.
- source_word: ἐκείνῃ τῇ ὥρᾳ
  choice: naquela hora
  rationale: Expressa o momento específico indicado pelo dativo temporal, sem acrescentar a ênfase de “naquela mesma hora”.
- source_word: ἐν ᾗ
  choice: em que
  rationale: Equivalente temporal natural em português, próximo da forma relativa grega.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Jesus lhe disse
  rationale: Tradução corrente e fiel de λέγω com objeto indireto.
- source_word: Ὁ υἱός σου ζῇ
  choice: Seu filho está vivo
  rationale: O presente ζῇ declara o estado atual do filho. “Está vivo” é idiomático em português e não introduz um sentido futuro.
- source_word: ἐπίστευσεν
  choice: creu
  rationale: Preserva a formulação simples de πιστεύω e deixa implícito, como no grego, o alcance preciso da fé.
- source_word: αὐτὸς
  choice: ele mesmo
  rationale: Conserva a provável ênfase do pronome explícito, distinguindo a resposta pessoal do pai da resposta de sua casa.
- source_word: ἡ οἰκία αὐτοῦ ὅλη
  choice: toda a sua casa
  rationale: No contexto, οἰκία designa o grupo doméstico, não o edifício. “Toda a sua casa” é uma expressão bíblica natural e abrangente em português.
theological_decisions:
- issue: Sentido da fé do pai
  choice: A tradução afirma simplesmente que ele “creu”, sem definir de modo mais preciso o alcance dessa fé.
  alternative: Entender que ele apenas acreditou na palavra específica de cura, ou que naquele momento chegou a uma fé mais plena em Jesus.
  rationale: Embora πιστεύω tenha frequentemente profundidade teológica em João, o versículo não explicita se se trata apenas de confiança na declaração de Jesus ou de uma fé mais abrangente nele. A tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção conserva a progressão lógica do relato, a ênfase de “ele mesmo” e a ambiguidade teológica de ἐπίστευσεν.
