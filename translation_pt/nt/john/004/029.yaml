id: JHN.4.29
reference: John 4:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Δεῦτε ἴδετε ἄνθρωπον ὃς εἶπέ μοι πάντα ⸀ὅσα ἐποίησα· μήτι οὗτός ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/029.yaml
  text: Come[a], see a man who told me everything I have done. Could this be the Messiah?
translation:
  language: pt
  text: Venham ver um homem que me disse tudo o que eu fiz. Será que este é o Messias?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”.'
    reason: Alternativa de tradução para o título grego ὁ χριστός.
lexical_decisions:
- source_word: Δεῦτε ἴδετε
  choice: Venham ver
  rationale: Expressa de modo natural em português o convite dirigido a várias pessoas, preservando tanto o chamado para se aproximarem quanto o convite para verem por si mesmas.
- source_word: ἄνθρωπον
  choice: um homem
  rationale: O substantivo singular refere-se aqui a um indivíduo do sexo masculino, Jesus; “um homem” corresponde diretamente ao referente.
- source_word: ὃς εἶπέ μοι
  choice: que me disse
  rationale: Com o objeto indireto μοι e a oração de conteúdo seguinte, “me disse” é a formulação portuguesa mais natural.
- source_word: πάντα ὅσα ἐποίησα
  choice: tudo o que eu fiz
  rationale: Preserva a abrangência enfática de πάντα ὅσα e traduz naturalmente o aoristo como referência ao conjunto das ações passadas da mulher.
- source_word: μήτι οὗτός ἐστιν
  choice: Será que este é
  rationale: μήτι dá à pergunta um tom hesitante ou cauteloso, sem excluir uma resposta afirmativa; “Será que” preserva essa abertura, e “este” representa o demonstrativo οὗτος.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Χριστός funciona no contexto como o título messiânico esperado por judeus e samaritanos; “Messias” comunica esse valor titular com clareza.
theological_decisions:
- issue: Tradução de Χριστός como título
  choice: o Messias
  alternative: o Cristo
  rationale: Neste contexto, Χριστός designa a figura messiânica esperada, não funciona meramente como nome próprio. “Messias” torna esse sentido explícito sem acrescentar uma interpretação denominacional.
- issue: Força interrogativa de μήτι
  choice: Será que este é o Messias?
  alternative: Este não é o Messias, é?
  rationale: Embora μήτι possa sugerir expectativa de resposta negativa, aqui a mulher convida os ouvintes a considerar a possibilidade. A formulação escolhida mantém a cautela retórica sem transformar a pergunta em afirmação explícita.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. O plural “Venham” corresponde ao convite dirigido aos habitantes da cidade; evitou-se o arcaísmo “Eis” e manteve-se a hesitação genuína da pergunta final.
