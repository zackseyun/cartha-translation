id: JHN.4.15
reference: John 4:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ἡ γυνή· Κύριε, δός μοι τοῦτο τὸ ὕδωρ, ἵνα μὴ διψῶ μηδὲ ⸀διέρχωμαι ἐνθάδε ἀντλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/015.yaml
  text: The woman said to him[a], “Lord, give me this water, so that I may not be thirsty or come here to draw.”
translation:
  language: pt
  text: 'A mulher lhe disse: “Senhor[a], dê-me esta água, para que eu não tenha sede nem venha aqui tirar água.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “senhor”, como forma respeitosa de tratamento.'
    reason: Preserva a ambiguidade de Κύριε entre um tratamento cortês e a possível ressonância do título “Senhor”.
lexical_decisions:
- source_word: λέγει
  choice: disse
  rationale: Embora o grego use o presente histórico, o pretérito é mais natural na narrativa em português e preserva a função discursiva.
- source_word: γυνή
  choice: a mulher
  rationale: No contexto, refere-se à mulher samaritana, não a uma esposa.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva o valor lexical e a possível ressonância joanina, sem excluir o uso imediato como tratamento respeitoso; a alternativa consta em nota.
- source_word: δός μοι
  choice: dê-me
  rationale: Tradução direta e idiomática do imperativo aoristo.
- source_word: τοῦτο τὸ ὕδωρ
  choice: dessa água
  rationale: Em português, 'dessa água' é a forma dêitica natural para a água mencionada pelo interlocutor; não se acrescenta 'viva', ausente neste versículo.
- source_word: ἵνα μὴ διψῶ
  choice: para que eu não tenha sede
  rationale: Expressa naturalmente a finalidade e mantém a modalidade da construção com subjuntivo.
- source_word: μηδὲ διέρχωμαι ἐνθάδε
  choice: nem precise vir aqui
  rationale: A formulação explicita de modo idiomático a finalidade prática implícita, sem apresentar a vinda como simples impossibilidade futura.
- source_word: ἀντλεῖν
  choice: tirá-la
  rationale: No contexto do poço, o verbo significa tirar água; o pronome retoma 'água' e evita repetição pouco natural.
theological_decisions:
- issue: Sentido de κύριος no tratamento usado pela mulher samaritana
  choice: Senhor
  alternative: senhor (como tratamento respeitoso, equivalente a 'senhor'/'senhor meu')
  rationale: O termo pode funcionar apenas como tratamento cortês no nível imediato do diálogo, mas também admite ressonância mais profunda no Evangelho de João. O texto principal preserva 'Senhor', e a nota registra o sentido cortês.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A construção 'nem precise vir aqui tirá-la' comunica naturalmente o caráter repetido e trabalhoso da ação sem sobrecarregar o texto.
