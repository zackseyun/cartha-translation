id: JHN.4.14
reference: John 4:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν πίῃ ἐκ τοῦ ὕδατος οὗ ἐγὼ δώσω αὐτῷ, οὐ μὴ ⸀διψήσει εἰς τὸν αἰῶνα, ἀλλὰ τὸ ὕδωρ ὃ δώσω αὐτῷ γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/014.yaml
  text: But whoever drinks from the water that I will give him will never thirst forever; rather, the water that I will give him will become in him a spring of water welling up to eternal life.
translation:
  language: pt
  text: Mas quem beber da água que eu lhe der nunca mais terá sede. Pelo contrário, a água que eu lhe der se tornará nele uma fonte de água que jorra para a vida eterna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διψήσει εἰς τὸν αἰῶνα
  choice: nunca mais terá sede
  rationale: A dupla negação enfática com εἰς τὸν αἰῶνα expressa uma negação definitiva. Esta formulação é natural em português e evita o pouco idiomático «nunca terá sede para sempre».
- source_word: πηγὴ ὕδατος
  choice: uma fonte de água
  rationale: Mantém a imagem de uma nascente ou fonte interior, em contraste com a água simplesmente retirada de um poço.
- source_word: ἁλλομένου
  choice: que jorra
  rationale: O particípio sugere água viva que salta, brota ou jorra; «jorra» comunica de modo claro e vigoroso esse movimento contínuo.
- source_word: εἰς ζωὴν αἰώνιον
  choice: para a vida eterna
  rationale: Preserva a direção ou resultado indicado por εἰς sem determinar além do texto a relação exata entre a fonte e a vida eterna.
theological_decisions:
- issue: Alcance temporal da promessa de não ter sede
  choice: nunca mais terá sede
  alternative: jamais terá sede, para sempre
  rationale: A escolha comunica a força enfática e duradoura do grego em português corrente, sem sugerir que a pessoa jamais voltará a sentir sede física; o contexto sustenta o sentido metafórico.
- issue: Relação da fonte interior com a vida eterna
  choice: jorra para a vida eterna
  alternative: jorra até resultar em vida eterna
  rationale: Mantém a concisão e a ambiguidade direcional de εἰς, sem explicar indevidamente se a expressão indica finalidade, resultado ou culminação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Pelo contrário» representa ἀλλά de forma natural e marca nitidamente o contraste. A repetição de «a água que eu lhe der» foi preservada por sua função retórica.
