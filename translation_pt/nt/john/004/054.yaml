id: JHN.4.54
reference: John 4:54
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτο ⸀δὲ πάλιν δεύτερον σημεῖον ἐποίησεν ὁ Ἰησοῦς ἐλθὼν ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/054.yaml
  text: This again was the second sign Jesus did after coming from Judea into Galilee[a].
translation:
  language: pt
  text: Este foi, novamente, o segundo sinal que Jesus fez depois de vir da Judeia para a Galileia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “milagre”. João costuma usar “sinal” para destacar tanto o significado do ato como o poder nele manifestado.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Esse
  rationale: O demonstrativo retoma a cura narrada imediatamente antes; “esse” faz essa referência anafórica de modo natural em português.
- source_word: δὲ πάλιν
  choice: novamente
  rationale: A partícula δέ é uma conexão leve, enquanto πάλιν marca repetição; a vírgula destaca “novamente” sem introduzir um contraste inexistente.
- source_word: δεύτερον
  choice: o segundo
  rationale: Mantém de modo natural a numeração explícita do sinal.
- source_word: σημεῖον
  choice: sinal
  rationale: Preserva o termo característico de João, que apresenta o ato poderoso como algo que aponta para uma realidade além de si mesmo.
- source_word: ἐποίησεν
  choice: fez
  rationale: Equivalente direto e corrente de ποιέω na expressão “fazer um sinal”, sem a formalidade adicional de “realizou”.
- source_word: ἐλθὼν
  choice: depois de ir
  rationale: Expressa naturalmente o valor temporal do particípio aoristo e o deslocamento da Judeia para a Galileia; “ir” é idiomático na narração em terceira pessoa.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: da Judeia para a Galileia
  rationale: Reproduz com clareza o ponto de origem e o destino indicados por ἐκ e εἰς.
theological_decisions:
- issue: Terminologia joanina de σημεῖον
  choice: sinal
  alternative: milagre
  rationale: '“Sinal” conserva a função literária e teológica do vocábulo em João: o ato manifesta poder, mas também aponta para a identidade e a obra de Jesus, sem explicar além do que o texto diz.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a concisão do grego e a terminologia joanina, evitando linguagem excessivamente técnica.
