id: JHN.15.18
reference: John 15:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἰ ὁ κόσμος ὑμᾶς μισεῖ, γινώσκετε ὅτι ἐμὲ πρῶτον ⸀ὑμῶν μεμίσηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/018.yaml
  text: If the world hates you[a], know that it has hated me before you.
translation:
  language: pt
  text: Se o mundo odeia vocês, saibam que ele me odiou antes de odiar vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “saibam que ele me odiou primeiro, antes de vocês”. O grego emprega “primeiro” com “vocês” para indicar prioridade temporal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: o mundo
  rationale: Mantém a expressão ampla e característica de João sem explicá-la de modo excessivamente interpretativo como “o sistema do mundo”.
- source_word: μισεῖ
  choice: odeia
  rationale: O presente simples comunica de forma natural o valor geral ou contínuo do verbo grego.
- source_word: γινώσκετε
  choice: saibam
  rationale: Embora a forma grega possa ser lida morfologicamente como indicativo ou imperativo, o contexto favorece a exortação; “saibam” também concorda com o tratamento plural “vocês”.
- source_word: ἐμὲ
  choice: me
  rationale: O pronome grego é enfático. Em português, a construção “ele me odiou” é natural; a prioridade dada a Jesus fica especialmente clara na comparação que se segue.
- source_word: πρῶτον ὑμῶν
  choice: antes de odiar vocês
  rationale: Explicita de maneira idiomática a prioridade temporal expressa por πρῶτον com o genitivo ὑμῶν, sem sugerir que Jesus seria simplesmente o primeiro integrante do grupo.
- source_word: μεμίσηκεν
  choice: odiou
  rationale: O perfeito grego apresenta o ódio dirigido a Jesus como anterior e ainda relevante. O pretérito perfeito simples é mais natural em português do que “tem odiado”, que normalmente sugeriria ação reiterada até o presente.
theological_decisions:
- issue: Sentido de κόσμος na teologia joanina
  choice: Preservar “o mundo” sem paráfrase explicativa.
  alternative: “o sistema do mundo” ou “a humanidade em rebelião contra Deus”
  rationale: No Evangelho de João, κόσμος pode designar a humanidade organizada em oposição a Deus, como indica o contexto. Ainda assim, “o mundo” conserva a amplitude e a tensão teológica do termo sem impor uma interpretação mais estreita.
- issue: Força do perfeito em μεμίσηκεν
  choice: Usar “odiou”, deixando que o contexto expresse a anterioridade e a relevância presente.
  alternative: “tem odiado” ou “já odiou”
  rationale: “Tem odiado” tende a indicar repetição ou continuidade em português moderno, enquanto “já odiou” pode enfraquecer a comparação temporal explícita. A tradução escolhida evita introduzir um aspecto não exigido pelo grego.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural de segunda pessoa e “saibam” como imperativo correspondente. A repetição de “odiar” evita a possível ambiguidade de “antes de vocês” e torna explícita a comparação implícita no grego.
