source:
  edition: SBLGNT
  text: ἐὰν μείνητε ἐν ἐμοὶ καὶ τὰ ῥήματά μου ἐν ὑμῖν μείνῃ, ὃ ἐὰν θέλητε ⸀αἰτήσασθε καὶ γενήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/007.yaml
  text: If you remain in me and my words remain in you[a], ask whatever you want[b], and it will be done for you.
translation:
  language: pt
  text: Se vocês permanecerem em mim e as minhas palavras permanecerem em vocês, peçam o que quiserem, e isso lhes será concedido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μείνητε / μείνῃ (μένω)
  choice: permanecerem / permanecerem
  rationale: “Permanecer” comunica continuidade relacional e preserva a repetição do verbo grego, importante no contexto joanino.
- source_word: ἐν ἐμοὶ
  choice: em mim
  rationale: Mantém literalmente a preposição e preserva a linguagem joanina de união e relacionamento.
- source_word: τὰ ῥήματά μου
  choice: as minhas palavras
  rationale: Tradução direta e natural de ῥήματα, sem ampliar para uma paráfrase.
- source_word: ὃ ἐὰν θέλητε
  choice: o que quiserem
  rationale: Expressa de modo corrente a referência indefinida e ampla do grego, sem acrescentar limitações ausentes no versículo.
- source_word: αἰτήσασθε
  choice: peçam
  rationale: O imperativo “peçam” é direto e natural para uma petição, preservando o valor verbal do grego.
- source_word: γενήσεται ὑμῖν
  choice: isso lhes será feito
  rationale: Em contexto de petição atendida, esta formulação transmite de modo idiomático o resultado prometido e explicita com “isso” o referente da oração anterior.
theological_decisions:
- issue: Estrutura condicional da promessa relativa à oração
  choice: A promessa de pedir e receber permanece subordinada à condição de permanecer em Jesus e de suas palavras permanecerem nos discípulos.
  alternative: Traduzir de forma livre, fazendo a promessa parecer incondicional.
  rationale: A construção com ἐὰν introduz uma condição explícita; a tradução conserva essa estrutura e a tensão teológica do texto sem acrescentar condições nem universalizar a promessa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais. O paralelismo e a repetição de “permanecer” foram mantidos. Não se acrescentaram notas porque as alternativas “habitar” ou “ficar” são menos adequadas aqui e não representam ambiguidade que exija registro editorial.
