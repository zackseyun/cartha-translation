id: JHN.15.9
reference: John 15:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καθὼς ἠγάπησέν με ὁ πατήρ, κἀγὼ ⸂ὑμᾶς ἠγάπησα⸃, μείνατε ἐν τῇ ἀγάπῃ τῇ ἐμῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/009.yaml
  text: Just as the Father has loved me[a], I also have loved you; remain in my love.
translation:
  language: pt
  text: Assim como o Pai me amou, eu também amei vocês; permaneçam no meu amor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Assim como
  rationale: Preserva de modo natural a comparação entre o amor do Pai por Jesus e o amor de Jesus pelos discípulos.
- source_word: ἠγάπησέν με ὁ πατήρ
  choice: o Pai me amou
  rationale: O pretérito perfeito simples corresponde naturalmente ao aoristo grego em português, sem sugerir que esse amor deixou de ter relevância presente.
- source_word: κἀγὼ ὑμᾶς ἠγάπησα
  choice: eu também amei vocês
  rationale: “Também” expressa a correspondência indicada por κἀγώ; “vocês” torna explícito, em português corrente, o plural de ὑμᾶς.
- source_word: μείνατε
  choice: permaneçam
  rationale: Expressa com clareza o imperativo plural e preserva o tema joanino de continuidade relacional; é mais digno e preciso aqui que “fiquem”.
- source_word: ἐν τῇ ἀγάπῃ τῇ ἐμῇ
  choice: no meu amor
  rationale: Tradução direta e idiomática que mantém aberta a amplitude de “meu amor”, sem especificar indevidamente se o foco é o amor de Jesus pelos discípulos ou a esfera relacional desse amor.
theological_decisions:
- issue: Valor temporal e aspectual de ἠγάπησέν e ἠγάπησα
  choice: pretérito perfeito simples (“me amou” / “amei”)
  alternative: presente (“me ama” / “amo”) ou pretérito perfeito composto (“tem amado” / “tenho amado”)
  rationale: O aoristo apresenta os atos de amar de modo global. Em português, o pretérito perfeito simples é a correspondência mais natural; o mandamento seguinte deixa clara sua relevância contínua. O presente apagaria a forma passada, enquanto o pretérito perfeito composto sugeriria ação reiterada ou prolongada, nuance que o grego não exige.
- issue: Sentido de ἀγάπη
  choice: amor
  alternative: caridade
  rationale: “Amor” é a equivalência moderna, ampla e natural; “caridade” seria arcaizante e estreitaria indevidamente o sentido neste contexto.
- issue: Alcance de “meu amor”
  choice: manter a formulação possessiva sem explicação interpretativa no texto
  alternative: “no amor que tenho por vocês” ou “no amor de vocês por mim”
  rationale: A expressão grega permite uma formulação relacional ampla. Explicitar uma única direção do amor resolveria uma nuance que o texto não resolve formalmente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Vocês” comunica naturalmente o plural, e “permaneçam” conserva a força temática e solene do verbo sem soar arcaico.
