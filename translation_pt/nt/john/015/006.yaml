source:
  edition: SBLGNT
  text: ἐὰν μή τις ⸀μένῃ ἐν ἐμοί, ἐβλήθη ἔξω ὡς τὸ κλῆμα καὶ ἐξηράνθη, καὶ συνάγουσιν αὐτὰ καὶ εἰς τὸ πῦρ βάλλουσιν καὶ καίεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/006.yaml
  text: If anyone does not remain in me[a], he is thrown out like the branch and dries up; and they gather them and throw them into the fire[b], and they are burned.
translation:
  language: pt
  text: Se alguém não permanecer em mim[a], é lançado fora como o ramo e seca. Depois, recolhem esses ramos, lançam-nos no fogo[b], e o ramo é queimado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego também pode ser traduzido por “continuar” ou “ficar”. “Permanecer” preserva um termo-chave no Evangelho de João, que indica continuidade relacional.
    reason: lexical_alternative
  - marker: b
    text: A imagem adverte sobre exclusão e queima, mas o próprio versículo não especifica se descreve a perda de um discipulado genuíno ou a exposição de uma ligação apenas aparente.
    reason: alternative_reading
  - marker: c
    text: O grego passa do plural, “esses ramos”, para o singular passivo, “o ramo é queimado”, retomando o ramo como imagem representativa.
    reason: source_grammar
lexical_decisions:
- source_word: μένῃ
  choice: permanecer
  rationale: O verbo μένω expressa continuidade persistente e é um termo importante em João. “Permanecer” é claro, digno e mantém sua força relacional sem acrescentar uma interpretação doutrinária.
- source_word: ἐν ἐμοί
  choice: em mim
  rationale: A formulação literal preserva a força relacional e teológica da expressão grega, em vez de reduzi-la a “comigo” ou explicá-la como “ligado a mim”.
- source_word: ἐβλήθη ἔξω
  choice: é lançado fora
  rationale: O presente em português comunica naturalmente o resultado geral da condição, enquanto a voz passiva e a imagem concreta do grego são preservadas.
- source_word: ὡς τὸ κλῆμα
  choice: como um ramo
  rationale: κλῆμα designa um ramo ou rebento de videira no contexto. O artigo grego tem valor representativo; em português, “um ramo” expressa de modo natural a comparação genérica.
- source_word: ἐξηράνθη
  choice: seca
  rationale: A forma comunica que o ramo se torna seco. “Seca” é direta e natural dentro da metáfora, sem intensificação interpretativa.
- source_word: συνάγουσιν
  choice: recolhem
  rationale: A terceira pessoa do plural tem agentes não especificados. O português permite manter essa indeterminação sem inserir “as pessoas” ou identificar os agentes.
- source_word: αὐτὰ
  choice: esses ramos
  rationale: O pronome neutro plural se refere aos ramos desse tipo. A explicitação nominal evita a obscuridade do pronome português e mantém o plural do grego.
- source_word: εἰς τὸ πῦρ βάλλουσιν
  choice: lançam-nos no fogo
  rationale: A tradução conserva a ação concreta, o plural dos objetos e a direção indicada por εἰς.
- source_word: καίεται
  choice: o ramo queima
  rationale: A forma verbal grega é singular e retoma naturalmente o ramo representativo, embora a oração anterior fale dos ramos no plural. A repetição de “o ramo” torna essa mudança de número compreensível em português.
- source_word: τις
  choice: alguém
  rationale: O pronome indefinido introduz uma condição aplicável a qualquer pessoa, sem marcar gênero nem restringir o referente.
theological_decisions:
- issue: Se a advertência deve ser formulada de modo a decidir debates sobre apostasia, perseverança ou discipulado apenas aparente
  choice: Manter a advertência metafórica direta, sem explicação doutrinária no texto
  alternative: Explicitar que se trata ou da perda da condição de verdadeiro discípulo, ou da revelação de que nunca houve união genuína com Jesus
  rationale: O versículo descreve exclusão, ressecamento e fogo, mas não define por si só a condição anterior precisa da pessoa representada pelo ramo. A tradução preserva a força e a tensão da advertência sem impor uma conclusão denominacional.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é claro e digno; mantém a metáfora agrícola, os agentes humanos não especificados e a mudança de número do grego, esclarecida em nota.
