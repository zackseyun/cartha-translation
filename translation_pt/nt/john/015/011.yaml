source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἡ χαρὰ ἡ ἐμὴ ἐν ὑμῖν ⸀ᾖ καὶ ἡ χαρὰ ὑμῶν πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/011.yaml
  text: I have spoken these things to you so that my joy may be in you[b][a], and your joy may be made full.
translation:
  language: pt
  text: Eu lhes falei estas coisas para que a minha alegria esteja em vocês[a] e a alegria de vocês seja completa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre vocês”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seja levada à plenitude”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: estas coisas
  rationale: Preserva o plural explícito do demonstrativo e soa natural no discurso em português.
- source_word: λελάληκα
  choice: tenho dito
  rationale: O perfeito grego aponta para palavras já proferidas com relevância presente; a construção portuguesa comunica isso de modo natural.
- source_word: ὑμῖν
  choice: lhes
  rationale: Representa o dativo plural de modo corrente e claro no português internacional com boa legibilidade brasileira.
- source_word: ἵνα
  choice: para que
  rationale: Expressa naturalmente a finalidade introduzida pela conjunção grega.
- source_word: ἡ χαρὰ ἡ ἐμὴ
  choice: a minha alegria
  rationale: Mantém a ênfase possessiva do grego sem explicar indevidamente a origem ou a natureza dessa alegria.
- source_word: ἐν ὑμῖν
  choice: em vocês
  rationale: Preserva o sentido mais direto de ἐν e a possível ideia de interioridade, sem eliminar a alternativa coletiva 'entre vocês', registrada em nota.
- source_word: ᾖ
  choice: esteja
  rationale: O presente do subjuntivo após ἵνα é adequadamente expresso pelo presente do subjuntivo português.
- source_word: καὶ
  choice: e
  rationale: Mantém a coordenação simples entre os dois elementos de finalidade.
- source_word: ἡ χαρὰ ὑμῶν
  choice: a alegria de vocês
  rationale: Expressa claramente o possessivo plural e conserva o contraste com 'a minha alegria'.
- source_word: πληρωθῇ
  choice: seja completa
  rationale: Comunica de maneira idiomática que a alegria alcance sua plenitude; a alternativa mais formal que preserva a imagem de enchimento é registrada em nota.
theological_decisions:
- issue: Natureza de “a minha alegria” no contexto joanino
  choice: a minha alegria
  alternative: a alegria que eu dou; a alegria a meu respeito
  rationale: O grego não explica se é a própria alegria de Jesus compartilhada com os discípulos ou a alegria decorrente da união com ele. A formulação não restringe essa riqueza teológica.
- issue: Sentido de ἐν ὑμῖν
  choice: em vocês
  alternative: entre vocês
  rationale: A tradução principal permite a leitura interior ou pessoal, enquanto a nota preserva a possibilidade de sentido coletivo sem decidir a questão de forma dogmática.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para deixar explícito o plural. “Tenho dito” conserva a relevância presente do perfeito grego; “seja completa” evita uma formulação artificial, e a nota retém a imagem de plenitude.
