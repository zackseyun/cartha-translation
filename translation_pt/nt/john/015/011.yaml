revisions:
- from: Eu lhes tenho dito estas coisas para que a minha alegria esteja em vocês[a] e a alegria de vocês seja completa.[b]
  to: Eu lhes falei estas coisas para que a minha alegria esteja em vocês[a] e a alegria de vocês seja completa.[b]
  rationale: A revisão limita-se ao verbo inicial. “Falei” representa naturalmente em português o ato de falar já concluído expresso pelo perfeito grego, sem a implicação habitual de repetição de “tenho dito”. Mantêm-se as demais escolhas e ambas as notas, pois são fiéis ao alcance semântico do grego.
