  text: ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/023.yaml
  text: The one who hates me also hates my Father.
translation:
  language: pt
  text: Quem me odeia também odeia meu Pai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μισῶν
  choice: Quem ... odeia
  rationale: O artigo com o particípio presente funciona substantivamente e tem sentido genérico singular. “Quem me odeia” é natural em português moderno e caracteriza a pessoa pela ação sem a rigidez de “aquele que me odeia”.
- source_word: ἐμὲ
  choice: me
  rationale: Pronome de primeira pessoa como objeto direto; a colocação “me odeia” comunica o sentido de modo natural e claro.
- source_word: μισῶν / μισεῖ
  choice: odeia / odeia
  rationale: μισέω significa odiar ou detestar. O presente simples expressa adequadamente a afirmação geral, e a repetição de “odeia” preserva a repetição lexical do grego.
- source_word: καὶ
  choice: também
  rationale: Neste contexto, καί inclui o Pai como igualmente atingido pelo ódio dirigido a Jesus. “Também” torna essa relação explícita de maneira idiomática, sem acrescentar uma conclusão alheia ao texto.
- source_word: τὸν πατέρα μου
  choice: meu Pai
  rationale: πατήρ com μου é naturalmente traduzido por “meu Pai”. A inicial maiúscula identifica o referente divino e preserva o uso relacional e teológico característico do contexto joanino.
theological_decisions:
- issue: Uso de inicial maiúscula em “Pai” como referência a Deus
  choice: meu Pai
  alternative: meu pai
  rationale: Jesus se refere a Deus como seu Pai. A inicial maiúscula ajuda o leitor a reconhecer o referente divino sem ampliar nem restringir o conteúdo da afirmação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção concisa preserva o paralelismo e a repetição enfática do original.
