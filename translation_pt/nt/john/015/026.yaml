id: JHN.15.26
reference: John 15:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός, τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/026.yaml
  text: When the Advocate comes[a], whom I will send to you from the Father—the Spirit of truth[c][b], who proceeds from the Father—he will testify about me.
translation:
  language: pt
  text: Quando vier o Advogado[a], que eu enviarei a vocês da parte do Pai — o Espírito da verdade, que procede do Pai[b] —, ele dará testemunho de mim.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Auxiliador», «Conselheiro», «Consolador»; também se pode transliterar o termo grego como «Paráclito».
    reason: lexical_alternative
  - marker: b
    text: O grego diz «procede do Pai», expressão que mais tarde adquiriu importância nas discussões sobre a Trindade.
    reason: historical_theological_significance
  - marker: c
    text: Ou «testemunhará a meu respeito».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν ἔλθῃ
  choice: Quando vier
  rationale: A construção com ὅταν e o subjuntivo aponta aqui para um acontecimento futuro esperado; «quando vier» é natural e fiel em português.
- source_word: ὁ παράκλητος
  choice: o Advogado
  rationale: «Advogado» preserva a dimensão pessoal, representativa e forense do termo, especialmente adequada ao contexto imediato de testemunho, sem ocultar em nota outras possibilidades legítimas.
- source_word: ὃν ἐγὼ πέμψω ὑμῖν
  choice: que eu enviarei a vocês
  rationale: Reproduz o futuro ativo e o objeto indireto em português atual, com ênfase explícita em «eu» como no grego.
- source_word: παρὰ τοῦ πατρός
  choice: da parte do Pai
  rationale: Na primeira ocorrência, «da parte do Pai» expressa naturalmente a origem ou proveniência indicada por παρά com genitivo e distingue estilisticamente esta frase da oração com ἐκπορεύεται.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: o Espírito da verdade
  rationale: Mantém a construção genitiva e a formulação joanina tradicional, sem reduzi-la a «Espírito verdadeiro».
- source_word: ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται
  choice: que procede do Pai
  rationale: «Procede» preserva a especificidade de ἐκπορεύεται e a formulação do texto, sem acrescentar conclusões teológicas posteriores.
- source_word: ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ
  choice: ele dará testemunho de mim
  rationale: O pronome pessoal preserva a apresentação pessoal do Espírito; «dará testemunho de mim» comunica com naturalidade a linguagem testemunhal de μαρτυρέω e περί com genitivo.
theological_decisions:
- issue: Tradução de παράκλητος
  choice: Advogado
  alternative: Auxiliador, Conselheiro, Consolador ou Paráclito
  rationale: Nenhum equivalente português reúne todo o campo semântico. «Advogado» ressalta a atuação pessoal e representativa que combina com «dará testemunho», enquanto a nota conserva as alternativas.
- issue: Referência pessoal ao Espírito
  choice: que procede ... ele dará testemunho
  alternative: o qual procede ... este dará testemunho
  rationale: Embora πνεῦμα seja neutro em grego, ἐκεῖνος é masculino e retoma a apresentação do Espírito como παράκλητος; «ele» evita uma leitura impessoal em português.
- issue: Tradução de ἐκπορεύεται
  choice: procede do Pai
  alternative: vem do Pai / sai da presença do Pai
  rationale: A tradução formalmente transparente conserva a tensão e a relevância histórica da expressão sem inserir no versículo qualquer desenvolvimento doutrinário posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega «vocês» para o plural ὑμῖν. Os travessões delimitam o aposto «o Espírito da verdade» sem alterar a relação sintática do original.
