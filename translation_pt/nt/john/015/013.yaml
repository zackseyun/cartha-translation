  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μείζονα ταύτης ἀγάπην οὐδεὶς ἔχει, ἵνα τις τὴν ψυχὴν αὐτοῦ θῇ ὑπὲρ τῶν φίλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/013.yaml
  text: 'No one has greater love than this: that someone lay down his life for his friends[a][b][c][d].'
translation:
  language: pt
  text: 'Ninguém tem amor maior do que este: dar a própria vida por seus amigos.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que alguém dê a vida por seus amigos». O grego emprega um sujeito singular indefinido.'
    reason: lexical_alternative
  - marker: b
    text: «Vida» traduz o grego psychē, que também pode significar «alma» ou «o próprio ser»; aqui se refere à vida entregue na morte. «Por» também pode ser traduzido como «em favor de» ou «em benefício de».
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα ταύτης ἀγάπην
  choice: amor maior do que este
  rationale: Mantém a comparação e o demonstrativo do grego em uma formulação natural em português, apontando adiante para a explicação introduzida pelos dois-pontos.
- source_word: οὐδεὶς ἔχει
  choice: Ninguém tem
  rationale: Correspondência direta, clara e idiomática para a expressão negativa de posse.
- source_word: ἵνα τις
  choice: dar
  rationale: A oração infinitiva após os dois-pontos expressa naturalmente em português o conteúdo que define «este» amor; o infinitivo também preserva o caráter geral e indefinido de τις sem impor gênero.
- source_word: τὴν ψυχὴν αὐτοῦ θῇ
  choice: dar a própria vida
  rationale: Neste contexto, ψυχή é a vida entregue até a morte. «Dar a vida» é idiomático em português e comunica o sentido de τίθημι com ψυχή, enquanto «a própria» recupera a referência reflexiva de αὐτοῦ.
- source_word: ὑπὲρ τῶν φίλων αὐτοῦ
  choice: por seus amigos
  rationale: «Por» preserva de modo conciso a força benefativa ou representativa de ὑπέρ sem impor especificamente a ideia de substituição; «seus amigos» traduz diretamente o sintagma possessivo.
theological_decisions:
- issue: Sentido de ψυχή na declaração de autossacrifício
  choice: vida
  alternative: alma; si mesmo
  rationale: O contexto trata da entrega concreta da vida até a morte, não procura definir uma distinção entre corpo e alma.
- issue: Força de ὑπέρ no amor sacrificial
  choice: por
  alternative: em favor de; em benefício de; no lugar de
  rationale: «Por» permite a amplitude benefativa e representativa da preposição, sem explicitar uma leitura substitutiva que esta frase, isoladamente, não exige.
- issue: Sujeito indefinido τις e os possessivos αὐτοῦ
  choice: oração infinitiva com «a própria vida» e «seus amigos»
  alternative: que alguém dê a vida pelos seus amigos
  rationale: A formulação evita marcar gênero onde o grego é genérico, conserva a singularidade conceitual e soa natural no português moderno.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção infinitiva evita o masculino genérico sem recorrer a formas artificiais e mantém o caráter proverbial e solene da frase.
