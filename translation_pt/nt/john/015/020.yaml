id: JHN.15.20
reference: John 15:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν· Οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ· εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς διώξουσιν· εἰ τὸν λόγον μου ἐτήρησαν, καὶ τὸν ὑμέτερον τηρήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/020.yaml
  text: 'Remember the word that I said to you: ‘A slave is not greater than his master.’ If they persecuted me[a], they will also persecute you; if they kept my word[b], they will also keep yours.'
translation:
  language: pt
  text: 'Lembrem-se da palavra que eu lhes disse: “O escravo não é maior do que o seu senhor.” Se me perseguiram, também perseguirão vocês; se guardaram a minha palavra[a], também guardarão a de vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “obedeceram à minha palavra”. Em João, “guardar” a palavra pode incluir acolher a mensagem de Jesus e viver em obediência a ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύετε
  choice: Lembrem-se
  rationale: O imperativo presente pede que os discípulos mantenham na memória o que Jesus lhes disse; a forma é natural e preserva a força imperativa.
- source_word: τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν
  choice: da palavra que eu lhes disse
  rationale: Aqui λόγος aponta para uma declaração específica já proferida por Jesus; “palavra” mantém a ligação lexical com as ocorrências posteriores no versículo.
- source_word: δοῦλος
  choice: escravo
  rationale: No contraste direto com κύριος, a condição subordinada é essencial ao provérbio; “escravo” expressa essa assimetria com mais precisão que “servo”.
- source_word: μείζων
  choice: maior
  rationale: Preserva a comparação ampla de posição ou status sem restringi-la a importância ou autoridade.
- source_word: κυρίου
  choice: senhor
  rationale: No par “escravo—senhor”, designa aquele que exerce autoridade sobre o escravo. “Senhor” é corrente em português e preserva o vocabulário tradicional do dito.
- source_word: ἐδίωξαν / διώξουσιν
  choice: perseguiram / perseguirão
  rationale: No contexto da hostilidade contra Jesus e seus discípulos, o verbo significa perseguir, não apenas seguir ou procurar.
- source_word: ἐτήρησαν / τηρήσουσιν
  choice: guardaram / guardarão
  rationale: τηρέω pode envolver acolher, observar e obedecer à palavra. “Guardar” conserva a formulação joanina e sua amplitude sem escolher apenas um desses aspectos.
- source_word: τὸν λόγον μου ... τὸν ὑμέτερον
  choice: a minha palavra ... a de vocês
  rationale: Mantém o paralelismo entre a palavra de Jesus e a proclamação derivada dos discípulos, evitando repetição pouco natural em português.
theological_decisions:
- issue: Sentido social de δοῦλος no dito proverbial
  choice: escravo
  alternative: servo
  rationale: A força do dito depende da desigualdade de condição entre δοῦλος e κύριος. “Escravo” preserva claramente essa relação, sem transformar o termo em uma designação genérica de serviço.
- issue: Amplitude de τηρέω aplicado à palavra
  choice: guardar a palavra
  alternative: obedecer à palavra
  rationale: “Guardar” deixa presentes tanto a recepção e preservação da mensagem quanto a obediência a ela; “obedecer” explicitaria apenas uma dimensão do verbo.
- issue: Valor condicional das duas orações com εἰ
  choice: Se perseguiram...; se guardaram...
  alternative: Já que perseguiram...; se tivessem guardado...
  rationale: As duas construções gregas têm a mesma forma e podem ser apresentadas como condições reais. A tradução preserva o paralelismo e não resolve a tensão retórica sobre quem acolhe ou rejeita a palavra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Usa “vocês” para o plural de segunda pessoa e mantém o paralelismo conciso do grego. “Escravo” evita suavizar a relação social expressa por δοῦλος; “senhor” é natural no par proverbial e não funciona aqui primariamente como título cristológico.
