  text: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ ἵνα ἀγαπᾶτε ἀλλήλους καθὼς ἠγάπησα ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/012.yaml
  text: 'This is my command: that you love one another just as I have loved you[a].'
translation:
  language: pt
  text: 'Este é o meu mandamento: que vocês amem uns aos outros, assim como eu amei vocês.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Este é o meu mandamento: que vocês amem uns aos outros, assim como tenho amado vocês.”'
    reason: Alternativa de tradução para ἠγάπησα que ressalta a relevância presente do amor demonstrado por Jesus.
lexical_decisions:
- source_word: Αὕτη
  choice: Este
  rationale: O pronome demonstrativo identifica o mandamento específico que Jesus passa a enunciar; “Este” é direto e natural em português.
- source_word: ἐντολή
  choice: mandamento
  rationale: “Mandamento” preserva claramente a força normativa e solene de ἐντολή e é corrente no português bíblico moderno.
- source_word: ἡ ἐμὴ
  choice: meu
  rationale: O possessivo atribui o mandamento a Jesus e comunica sua autoridade; “meu” é a forma idiomática em português.
- source_word: ἵνα
  choice: que
  rationale: Neste contexto, ἵνα introduz o conteúdo do mandamento; “que” reproduz essa função com naturalidade.
- source_word: ἀγαπᾶτε
  choice: amem
  rationale: O presente do subjuntivo, regido pela formulação do mandamento, é naturalmente expresso por “amem” e comunica a prática ordenada sem explicitar indevidamente o aspecto verbal.
- source_word: ἀλλήλους
  choice: uns aos outros
  rationale: Equivalente recíproco claro e idiomático, adequado a um grupo de discípulos.
- source_word: καθὼς
  choice: assim como
  rationale: Marca tanto comparação quanto padrão; “assim como” mostra que o amor de Jesus serve de modelo para o amor mútuo.
- source_word: ἠγάπησα
  choice: amei
  rationale: O aoristo é vertido pelo pretérito perfeito simples, correspondência natural em português, sem impor uma leitura aspectual de efeito presente que o texto não explicita.
- source_word: ὑμᾶς
  choice: vocês
  rationale: O pronome é plural e se refere coletivamente aos discípulos; “vocês” torna explícito esse plural no português moderno e tem ampla legibilidade brasileira.
theological_decisions:
- issue: Tradução da linguagem de ἀγαπάω
  choice: amem / amei
  alternative: tenham amor / tenho amado
  rationale: A tradução pelo cognato “amar” mantém a continuidade lexical e o vínculo entre o amor ordenado aos discípulos e o amor de Jesus, sem acrescentar uma definição teológica externa ao versículo.
- issue: Relação entre o amor de Jesus e o amor mútuo
  choice: assim como eu amei vocês
  alternative: como eu amei vocês
  rationale: “Assim como” preserva a força comparativa de καθὼς, apresentando o amor de Jesus como padrão sem decidir além do texto se a expressão indica apenas modelo, medida ou fundamento.
- issue: Valor temporal de ἠγάπησα
  choice: amei
  alternative: tenho amado
  rationale: O pretérito perfeito simples representa de modo sóbrio o aoristo grego. A alternativa pode destacar relevância continuada, mas corre o risco de explicitar uma nuance temporal que a forma grega não exige.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Vocês” explicita o plural do grego; “mandamento” mantém o tom de autoridade sem soar arcaico. A estrutura com dois-pontos e “que” conserva a identificação seguida do conteúdo do mandamento.
