  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα πάντα ποιήσουσιν ⸂εἰς ὑμᾶς⸃ διὰ τὸ ὄνομά μου, ὅτι οὐκ οἴδασιν τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/021.yaml
  text: But they will do all these things to you because of my name[a], because they do not know the one who sent me.
translation:
  language: pt
  text: Mas farão todas essas coisas a vocês[a] por causa do meu nome, porque não conhecem aquele que me enviou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra vocês”. A expressão grega indica ações dirigidas aos discípulos e, neste contexto, pode ter sentido hostil.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca o forte contraste com a declaração anterior de modo natural em português.
- source_word: ταῦτα πάντα
  choice: todas essas coisas
  rationale: Preserva tanto a força demonstrativa de ταῦτα quanto a totalidade expressa por πάντα.
- source_word: ποιήσουσιν
  choice: farão
  rationale: Reproduz diretamente o futuro ativo do verbo ποιέω, sem restringir de forma indevida a natureza das ações.
- source_word: εἰς ὑμᾶς
  choice: contra vocês
  rationale: Neste contexto de perseguição, a expressão indica ações hostis dirigidas aos discípulos. Em português, 'farão todas essas coisas contra vocês' é mais natural que 'a vocês', embora esta última preserve uma formulação mais ampla.
- source_word: διὰ τὸ ὄνομά μου
  choice: por causa do meu nome
  rationale: Expressa a causa indicada por διά com acusativo e mantém 'nome' como referência à pessoa, identidade e autoridade de Jesus.
- source_word: ὅτι
  choice: porque
  rationale: Introduz claramente a razão explicativa da hostilidade.
- source_word: οὐκ οἴδασιν
  choice: não conhecem
  rationale: Mantém a simplicidade da expressão e permite o sentido relacional característico de João, sem reduzi-lo a mera falta de informação.
- source_word: τὸν πέμψαντά με
  choice: aquele que me enviou
  rationale: Traduz naturalmente o particípio substantivado sem acrescentar explicitamente o título 'Pai', ausente da formulação grega.
theological_decisions:
- issue: Referente de 'aquele que me enviou'
  choice: Manter a referência implícita como 'aquele que me enviou'.
  alternative: Explicitar 'o Pai que me enviou'.
  rationale: O contexto joanino identifica o referente como o Pai, mas o grego emprega um particípio substantivado, não o substantivo 'Pai'. A tradução preserva essa formulação sem acréscimo interpretativo.
- issue: Sentido de 'meu nome'
  choice: Preservar a expressão literal 'meu nome'.
  alternative: Explicitar como 'por minha causa' ou 'por serem meus seguidores'.
  rationale: Embora o nome represente a pessoa, identidade e autoridade de Jesus, a formulação original possui peso teológico próprio e não deve ser reduzida a uma paráfrase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com 'vocês' para o plural. A frase conserva a estrutura causal dupla do original e evita explicitar o Pai onde o texto grego não o nomeia.
