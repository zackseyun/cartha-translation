source:
  edition: SBLGNT
  text: εἰ ἐκ τοῦ κόσμου ἦτε, ὁ κόσμος ἂν τὸ ἴδιον ἐφίλει· ὅτι δὲ ἐκ τοῦ κόσμου οὐκ ἐστέ, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς ἐκ τοῦ κόσμου, διὰ τοῦτο μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/019.yaml
  text: If you were from the world[a], the world would love its own. But because you are not from the world, but I chose you out of the world, for this reason the world hates you.
translation:
  language: pt
  text: Se vocês fossem do mundo[a], o mundo amaria o que é seu. Mas, porque vocês não são do mundo, mas eu os escolhi do mundo, por isso o mundo odeia vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serem do mundo” ou “pertencerem ao mundo”. A expressão grega ἐκ τοῦ κόσμου pode indicar procedência ou pertencimento; o texto principal mantém a repetição de “do mundo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: do mundo / dentre o mundo
  rationale: “Do mundo” expressa naturalmente em português tanto procedência quanto pertencimento e mantém a repetição. Com ἐξελεξάμην, “dentre o mundo” evidencia a seleção a partir de um conjunto sem sugerir retirada física.
- source_word: κόσμος
  choice: mundo
  rationale: Preserva a amplitude da categoria joanina sem restringi-la interpretativamente a “sistema do mundo” ou à sociedade humana rebelde.
- source_word: ἂν ... ἐφίλει
  choice: amaria
  rationale: O futuro do pretérito comunica com naturalidade o resultado de uma condição contrária à realidade.
- source_word: τὸ ἴδιον
  choice: o que é seu
  rationale: Reproduz o neutro substantivado sem acrescentar explicitamente “pessoas”, embora elas estejam em vista no contexto.
- source_word: φιλέω
  choice: amar
  rationale: É a equivalência portuguesa mais clara e mantém o contraste direto com μισέω, “odiar”.
- source_word: ὅτι δὲ
  choice: Mas, porque
  rationale: Conserva tanto o contraste de δέ quanto a força causal de ὅτι.
- source_word: ἐξελεξάμην
  choice: eu os escolhi
  rationale: Traduz diretamente o aoristo médio sem acrescentar “para mim”, nuance possível, mas não obrigatória em português.
- source_word: διὰ τοῦτο
  choice: por isso
  rationale: Expressa de modo natural a relação causal explícita.
- source_word: μισεῖ
  choice: odeia
  rationale: Mantém a força incisiva do presente grego e seu contraste com “amar”.
theological_decisions:
- issue: Sentido de κόσμος no contexto joanino
  choice: Manter “mundo” sem expansão interpretativa.
  alternative: “sistema do mundo” ou “sociedade humana oposta a Deus”
  rationale: “Mundo” preserva a abrangência e a tensão da categoria teológica de João, que o próprio contexto deve definir.
- issue: Alcance teológico de ἐξελεξάμην
  choice: Traduzir simplesmente “eu os escolhi dentre o mundo”.
  alternative: Empregar formulação vinculada a um sistema específico de eleição ou predestinação.
  rationale: O texto afirma claramente a escolha feita por Jesus, mas não resolve neste versículo debates doutrinários posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. A formulação mantém as três ocorrências de ἐκ τοῦ κόσμου visíveis, variando apenas a terceira para “dentre o mundo” por exigência idiomática do verbo “escolher”.
