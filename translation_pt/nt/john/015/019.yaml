review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a condição contrária ao fato, o contraste entre amar e odiar, a escolha de Jesus e a causalidade final. Contudo, a construção “e sim porque eu os escolhi” introduz um segundo “porque” que não está no grego e torna a relação sintática menos clara. Além disso, “dentre o mundo” é possível, mas “do mundo” conserva melhor a repetição de ἐκ τοῦ κόσμου e é natural com “escolher”.
  naturalness: O registro com “vocês” é moderno e apropriado. “Mas, porque ... e sim porque ...” soa pesado e algo redundante em português; “mas eu os escolhi do mundo” é mais fluente e reproduz diretamente a coordenação adversativa grega.
  terminology: '“Mundo”, “amar”, “o que é seu”, “escolhi” e “odeia” são escolhas adequadas. A nota lexical é útil, mas a alternativa deve corresponder à expressão inteira: “serem do mundo”, não “pertencessem ao mundo”, pois a nota não deve trocar desnecessariamente a estrutura verbal da condição.'
  issues:
  - severity: medium
    issue: Repetição indevida de “porque” em “e sim porque eu os escolhi”.
    rationale: 'O grego diz literalmente, em estrutura aproximada: “mas, porque não sois do mundo, mas eu vos escolhi do mundo”. O segundo ὅτι não aparece; acrescentar “porque” prejudica a sintaxe portuguesa e enfraquece a apresentação direta da ação de Jesus.'
  - severity: low
    issue: “Dentre o mundo” substitui a terceira repetição de ἐκ τοῦ κόσμου.
    rationale: É semanticamente defensável, mas “eu os escolhi do mundo” é idiomático e mantém a repetição deliberada da expressão grega nas três ocorrências.
  - severity: low
    issue: A formulação da alternativa na nota não é paralela ao texto.
    rationale: “Ou ‘pertencessem ao mundo’” muda a forma condicional; “Ou ‘serem do mundo’” ou “Ou ‘pertencerem ao mundo’” explica melhor o valor de ἐκ τοῦ κόσμου.
  revised_text: Se vocês fossem do mundo[a], o mundo amaria o que é seu. Mas, porque vocês não são do mundo, mas eu os escolhi do mundo, por isso o mundo odeia vocês.
