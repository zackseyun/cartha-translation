source:
  edition: SBLGNT
  text: πᾶν κλῆμα ἐν ἐμοὶ μὴ φέρον καρπὸν αἴρει αὐτό, καὶ πᾶν τὸ καρπὸν φέρον καθαίρει αὐτὸ ἵνα ⸂καρπὸν πλείονα⸃ φέρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/002.yaml
  text: Every branch in me that does not bear fruit[a], he removes; and every branch that bears fruit[b], he prunes so that it may bear more fruit.
translation:
  language: pt
  text: Todo ramo que está em mim e não dá fruto, ele o remove[a]; e todo ramo que dá fruto, ele o poda[b], para que dê mais fruto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tira”. Alguns entendem αἴρει aqui no sentido de “levanta”.
    reason: alternative_reading
  - marker: b
    text: O verbo traduzido como “poda” também pode significar “limpa”; a expressão se ajusta à imagem da videira e antecipa a linguagem sobre estar “limpo” no versículo seguinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κλῆμα
  choice: todo ramo
  rationale: Com o substantivo no singular, πᾶν tem sentido distributivo. “Todo ramo” é natural em português e preserva a referência individual.
- source_word: ἐν ἐμοὶ
  choice: em mim
  rationale: A tradução direta conserva a formulação joanina e evita acrescentar uma interpretação como “ligado a mim”.
- source_word: μὴ φέρον καρπὸν
  choice: que não dá fruto
  rationale: A oração relativa é clara e idiomática em português; “dar fruto” expressa naturalmente a produção contínua indicada pelo particípio.
- source_word: αἴρει
  choice: remove
  rationale: No contraste da imagem da videira, o sentido de retirar ou remover se ajusta melhor à ação sobre o ramo infrutífero. A possibilidade lexical de “levantar” é mantida em nota.
- source_word: καρπός
  choice: fruto
  rationale: É o equivalente comum e apropriado na metáfora agrícola.
- source_word: καθαίρει
  choice: poda
  rationale: No contexto da videira, “poda” comunica com clareza a ação agrícola, embora o verbo também possa significar “limpa”, conexão preservada em nota.
- source_word: ἵνα καρπὸν πλείονα φέρῃ
  choice: para que dê mais fruto
  rationale: “Para que” expressa a finalidade de ἵνα, e “mais fruto” reproduz de modo idiomático o comparativo πλείονα.
- source_word: αὐτό / αὐτὸ
  choice: o referente é expresso ou recuperado pelo contexto
  rationale: Os pronomes retomam o substantivo neutro κλῆμα. Em português, após “remove” e “poda”, omitir o pronome objeto produz uma construção natural sem perder o referente.
- source_word: καὶ πᾶν τὸ καρπὸν φέρον
  choice: e todo ramo que dá fruto
  rationale: “Ramo” é retomado explicitamente porque o artigo com o particípio remete a κλῆμα, preservando o paralelismo e evitando obscuridade.
theological_decisions:
- issue: Sentido de αἴρει na primeira oração
  choice: ele remove
  alternative: ele tira; ele levanta
  rationale: “Remove” preserva o contraste entre o tratamento do ramo infrutífero e a poda do ramo frutífero sem definir implicações doutrinárias sobre apostasia ou perseverança. A leitura “levanta”, defendida por alguns, permanece em nota como possibilidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura paralela do grego foi preservada, e as alternativas lexicais relevantes aparecem em notas sem resolver indevidamente a tensão interpretativa.
