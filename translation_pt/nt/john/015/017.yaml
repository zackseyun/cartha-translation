  text: ταῦτα ἐντέλλομαι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/017.yaml
  text: These things I command you[b][a], so that you may love one another.
translation:
  language: pt
  text: Eu lhes ordeno estas coisas, para que amem uns aos outros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Eu lhes ordeno isto: amem uns aos outros». A oração grega introduzida por ἵνα pode indicar propósito ou aproximar-se da expressão do conteúdo da ordem.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: estas coisas
  rationale: Mantém o demonstrativo neutro plural e sua provável referência ao conjunto das instruções anteriores.
- source_word: ἐντέλλομαι
  choice: ordeno
  rationale: Expressa de modo natural e direto em português o presente do verbo que significa ordenar ou dar instruções.
- source_word: ὑμῖν
  choice: lhes
  rationale: Representa o dativo plural como objeto indireto idiomático de «ordeno».
- source_word: ἵνα
  choice: para que
  rationale: Preserva primariamente a ideia de propósito ou resultado pretendido, sem excluir a proximidade semântica com uma explicação do conteúdo da ordem.
- source_word: ἀγαπᾶτε
  choice: amem
  rationale: O presente do subjuntivo exigido por «para que» é vertido naturalmente como «amem», sem acrescentar uma continuidade não explicitada.
- source_word: ἀλλήλους
  choice: uns aos outros
  rationale: Equivalente português corrente do pronome recíproco, deixando clara a mutualidade dentro do grupo.
theological_decisions:
- issue: Relação entre a ordem e a oração introduzida por ἵνα
  choice: 'A oração é apresentada como propósito: «para que amem uns aos outros».'
  alternative: '«Eu lhes ordeno isto: amem uns aos outros.»'
  rationale: Em grego, ἵνα indica naturalmente propósito ou resultado, mas no estilo joanino pode aproximar-se da explicitação do conteúdo. A tradução principal preserva a forma de propósito, e a nota registra a leitura alternativa sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Eu lhes ordeno estas coisas» mantém o plural e a estrutura do grego sem soar excessivamente literal; «uns aos outros» é a formulação recíproca mais corrente.
