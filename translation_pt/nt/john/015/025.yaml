source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα πληρωθῇ ὁ λόγος ὁ ⸂ἐν τῷ νόμῳ αὐτῶν γεγραμμένος⸃ ὅτι Ἐμίσησάν με δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/025.yaml
  text: 'But this happened so that the word written in their Law might be fulfilled: ‘They hated me without cause.’[a][b][c]'
translation:
  language: pt
  text: 'Mas isso aconteceu para que se cumprisse a palavra escrita na Lei deles: “Odiaram-me sem motivo”.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Mas para que se cumprisse a palavra escrita na Lei deles”. O grego deixa implícita a oração principal; “isso aconteceu” é suprido a partir do contexto.'
    reason: lexical_alternative
  - marker: b
    text: “Lei deles” emprega “Lei” no sentido judaico mais amplo das Escrituras; a citação vem dos Salmos (cf. Sl 35:19; 69:4).
    reason: cross_reference
  - marker: c
    text: Ou “sem causa” ou “sem razão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Mas isso aconteceu
  rationale: A conjunção é adversativa e liga o versículo ao que precede. O grego deixa a oração principal implícita; acrescentar “isso aconteceu” torna a frase natural em português sem introduzir conteúdo novo.
- source_word: ἵνα πληρωθῇ
  choice: para que se cumprisse
  rationale: ἵνα com o subjuntivo passivo pode expressar propósito ou resultado. A formulação preserva essa abertura e o motivo joanino do cumprimento das Escrituras.
- source_word: ὁ λόγος
  choice: a palavra
  rationale: Aqui λόγος designa uma declaração específica das Escrituras, não o título teológico “a Palavra” de João 1.
- source_word: ἐν τῷ νόμῳ αὐτῶν γεγραμμένος
  choice: escrita na Lei deles
  rationale: O particípio perfeito passivo indica aquilo que permanece escrito. “Lei deles” conserva tanto νόμος quanto o pronome αὐτῶν e soa natural em português.
- source_word: νόμῳ
  choice: Lei
  rationale: Mantém o termo grego, que neste contexto é empregado em sentido amplo para as Escrituras judaicas, embora a citação venha dos Salmos.
- source_word: ὅτι
  choice: ':'
  rationale: A conjunção introduz o conteúdo da palavra citada; os dois-pontos cumprem naturalmente essa função em português.
- source_word: Ἐμίσησάν με
  choice: Odiaram-me
  rationale: O aoristo é adequadamente expresso pelo pretérito perfeito simples, preservando a forma concisa da citação.
- source_word: δωρεάν
  choice: sem motivo
  rationale: No contexto, o advérbio significa gratuitamente, sem causa ou razão. “Sem motivo” é claro e corrente, sem perder a ideia de ódio injustificado.
theological_decisions:
- issue: Sentido de “Lei deles” numa citação dos Salmos
  choice: Conservar “Lei”, entendendo o termo como referência ampla às Escrituras judaicas, aqui incluindo os Salmos.
  alternative: Traduzir como “Escritura” para explicitar o sentido amplo.
  rationale: O texto grego diz νόμος. Preservar “Lei” mantém a forma da fonte e a tensão do uso joanino, enquanto a nota evita que o leitor restrinja a referência ao Pentateuco.
- issue: Oração principal elíptica depois de ἀλλ’
  choice: Suprir “isso aconteceu” para produzir uma frase completa e natural em português.
  alternative: 'Manter a elipse: “Mas para que se cumprisse...”'
  rationale: A oração é recuperada do contexto anterior. A explicitação melhora a inteligibilidade sem resolver a relação de propósito e resultado de modo mais rígido do que o grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A colocação pronominal em “Odiaram-me” preserva um tom elevado sem arcaísmo excessivo; “sem motivo” é mais corrente que “sem causa”.
