  text: Ἐγώ εἰμι ἡ ἄμπελος ἡ ἀληθινή, καὶ ὁ πατήρ μου ὁ γεωργός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/001.yaml
  text: I am the true vine[a], and my Father is the vinegrower.
translation:
  language: pt
  text: Eu sou a videira verdadeira, e meu Pai é o agricultor[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “viticultor”, isto é, aquele que cultiva e cuida da vinha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Eu sou
  rationale: Forma natural e direta em português, preservando a declaração enfática característica dos ditos joaninos sem acrescentar uma ênfase artificial como “eu mesmo sou”.
- source_word: ἄμπελος
  choice: videira
  rationale: Equivalente corrente e preciso para a planta da uva, além de preservar com naturalidade a metáfora bíblica.
- source_word: ἀληθινή
  choice: verdadeira
  rationale: Preserva tanto o sentido de genuína e real quanto a ressonância teológica do vocabulário joanino, sem explicar além do texto.
- source_word: πατήρ μου
  choice: meu Pai
  rationale: A inicial maiúscula sinaliza com clareza que Jesus se refere a Deus, mantendo a relação pessoal expressa no grego.
- source_word: γεωργός
  choice: agricultor
  rationale: O termo grego designa quem cultiva a terra. “Agricultor” é atual, claro e fiel; no contexto específico de uma videira, “viticultor” é uma alternativa mais especializada, registrada em nota.
theological_decisions:
- issue: Identificação metafórica no dito “Eu sou”
  choice: Manter diretamente “Eu sou a videira verdadeira”
  alternative: Eu sou a videira real/genuína
  rationale: A formulação conserva a imagem e a tensão teológica do texto, sem transformar a metáfora em explicação interpretativa.
- issue: Designação do Pai como γεωργός
  choice: agricultor
  alternative: viticultor; lavrador; aquele que cuida da vinha
  rationale: “Agricultor” reflete o sentido lexical amplo do grego e permanece acessível. A alternativa contextual mais específica é preservada em nota, sem impor ao texto principal uma especialização ausente do substantivo grego isoladamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a concisão da afirmação grega foram preservadas; evitou-se linguagem excessivamente técnica no texto principal.
