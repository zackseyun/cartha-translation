  text: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ πρόφασιν οὐκ ἔχουσιν περὶ τῆς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/022.yaml
  text: If I had not come and spoken to them[a], they would not have sin[c][b]; but now they have no excuse for their sin.
translation:
  language: pt
  text: Se eu não tivesse vindo e falado com eles, não teriam pecado[a]; mas agora não têm desculpa para o seu pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não seriam culpados de pecado” ou “não teriam culpa”. O grego diz mais literalmente: “não teriam pecado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς
  choice: Se eu não tivesse vindo e falado com eles
  rationale: A construção portuguesa com mais-que-perfeito composto e imperfeito do subjuntivo expressa naturalmente a condição passada contrária aos fatos; «falado com eles» traduz de modo idiomático o dativo αὐτοῖς.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: não teriam pecado
  rationale: Preserva a expressão joanina literalmente próxima de «não teriam pecado» e a força condicional, sem substituí-la interpretativamente por «não seriam culpados».
- source_word: νῦν δὲ
  choice: mas agora
  rationale: Mantém o contraste enfático entre a hipótese irreal e a situação presente.
- source_word: πρόφασιν οὐκ ἔχουσιν
  choice: não têm desculpa
  rationale: «Desculpa» comunica em português corrente a ideia contextual de alegação ou justificativa defensiva; «pretexto» permanece uma alternativa lexical possível.
- source_word: περὶ τῆς ἁμαρτίας αὐτῶν
  choice: para o seu pecado
  rationale: Embora περί com genitivo possa significar «a respeito de», a combinação portuguesa idiomática é «ter desculpa para»; «seu» retoma o grupo plural sem ambiguidade relevante no contexto.
theological_decisions:
- issue: Se «não teriam pecado» afirma ausência absoluta de pecado ou ausência de culpa quanto à rejeição da revelação de Jesus
  choice: Manter «não teriam pecado» no texto principal.
  alternative: «não seriam culpados de pecado» ou «não teriam culpa por esse pecado»
  rationale: O contexto aponta para a responsabilidade decorrente da vinda e das palavras de Jesus, mas o grego conserva a formulação abrangente «ter pecado». A tradução não deve resolver silenciosamente essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e o paralelismo do grego são preservados sem sacrificar a naturalidade. O marcador [a] aparece imediatamente após a expressão a que se refere.
