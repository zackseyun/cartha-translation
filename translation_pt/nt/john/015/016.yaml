id: JHN.15.16
reference: John 15:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς με ἐξελέξασθε, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς, καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε καὶ ὁ καρπὸς ὑμῶν μένῃ, ἵνα ὅ τι ἂν αἰτήσητε τὸν πατέρα ἐν τῷ ὀνόματί μου δῷ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/016.yaml
  text: You did not choose me[a], but I chose you and appointed you so that you should go and bear fruit, and that your fruit should remain, so that whatever you ask the Father in my name[c][b], he may give you.
translation:
  language: pt
  text: Não foram vocês que me escolheram[a]; pelo contrário, eu escolhi vocês e os designei para que vocês vão e deem fruto, e para que o fruto de vocês permaneça[b], a fim de que o Pai[c] lhes dê tudo o que pedirem em meu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “selecionaram” e “selecionei”. O verbo pode ainda ser vertido por “elegeram” e “elegi”, mas “escolher” se ajusta melhor ao contexto imediato sem introduzir terminologia teológica posterior no texto principal.
    reason: lexical_alternative
  - marker: b
    text: Ou “continue” ou “dure”. João usa com frequência esse verbo para expressar permanência, continuidade relacional ou duração.
    reason: lexical_alternative
  - marker: c
    text: O grego diz “o Pai”, não “meu Pai”.
    reason: textual_precision
lexical_decisions:
- source_word: ἐξελέξασθε / ἐξελεξάμην
  choice: escolheram / escolhi
  rationale: O verbo ἐκλέγομαι significa escolher ou selecionar. “Escolher” expressa com naturalidade o contraste relacional e a iniciativa de Jesus, sem introduzir no texto principal a terminologia teológica posterior de “eleger”.
- source_word: ἔθηκα
  choice: designei
  rationale: Embora τίθημι possa significar literalmente “pôr” ou “colocar”, aqui indica que Jesus atribuiu aos discípulos uma finalidade. “Designei” comunica incumbência intencional sem restringi-la à ordenação para um ofício eclesiástico.
- source_word: ἵνα
  choice: para que / a fim de que
  rationale: As duas ocorrências introduzem finalidade. As formas portuguesas escolhidas preservam essa relação e evitam repetição estilística excessiva sem alterar a estrutura lógica.
- source_word: ὑπάγητε
  choice: vão
  rationale: ὑπάγω pode significar ir, partir ou afastar-se. Neste contexto, “vão” é amplo, natural e compatível com atividade ou missão, sem explicitar além do grego.
- source_word: καρπὸν φέρητε
  choice: deem fruto
  rationale: A expressão preserva a metáfora joanina e é idiomática em português. “Produzam fruto” seria possível, mas menos tradicional e relacional neste contexto.
- source_word: μένῃ
  choice: permaneça
  rationale: μένω é um termo importante em João e pode indicar permanência, continuidade ou duração. “Permaneça” conserva essa amplitude e a ligação lexical com o restante do discurso.
- source_word: ὅ τι ἂν αἰτήσητε
  choice: tudo o que pedirem
  rationale: A construção relativa com ἄν tem alcance indefinido. “Tudo o que pedirem” é uma formulação natural em português e mantém o sentido de “qualquer coisa que pedirem”.
- source_word: ἐν τῷ ὀνόματί μου
  choice: em meu nome
  rationale: É a equivalência portuguesa direta e consagrada, preservando a força relacional e teológica da expressão sem explicar excessivamente o que significa agir ou pedir no nome de Jesus.
- source_word: δῷ
  choice: dê
  rationale: O aoristo do subjuntivo depende de ἵνα e integra uma oração de finalidade ou resultado. O subjuntivo português “dê” preserva essa subordinação sem convertê-la em uma afirmação futura independente.
- source_word: τὸν πατέρα
  choice: o Pai
  rationale: O grego diz literalmente “o Pai”, e não “meu Pai”. A tradução mantém essa forma.
theological_decisions:
- issue: Possível leitura doutrinária técnica de ἐξελεξάμην
  choice: “Eu escolhi vocês”, no contexto imediato de discipulado, incumbência e frutificação.
  alternative: “Eu elegi vocês”, destacando uma categoria teológica técnica de eleição.
  rationale: O versículo afirma claramente a iniciativa de Jesus, mas o verbo em si não exige terminologia sistemático-teológica. “Escolhi” preserva a afirmação e permite que seu alcance seja interpretado no contexto mais amplo.
- issue: Sentido de ἔθηκα ὑμᾶς
  choice: Designação ou incumbência para ir e dar fruto.
  alternative: “Coloquei vocês”, de forma mais literal, ou uma referência específica à ordenação para um ofício.
  rationale: A sequência final expressa a finalidade da ação de Jesus. “Designei” comunica essa incumbência sem limitar a frase a um cargo eclesiástico.
- issue: Força da última oração com ἵνα
  choice: O pedido ao Pai e sua concessão são mantidos dentro de uma oração de finalidade ou resultado.
  alternative: 'Transformá-la em promessa futura independente: “ele lhes dará”.'
  rationale: A sintaxe grega liga a oração à escolha, à designação e à frutificação. O subjuntivo “dê” preserva essa relação e evita apresentar a frase como fórmula isolada e incondicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” por naturalidade contemporânea e mantém “deem fruto” e “permaneça” para preservar a metáfora e o vocabulário característico de João. A ordem da oração final foi ajustada dentro dos limites da sintaxe portuguesa para deixar claro que “o Pai” é o destinatário do pedido e o sujeito de “dê”.
