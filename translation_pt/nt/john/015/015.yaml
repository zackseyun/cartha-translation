id: JHN.15.15
reference: John 15:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐκέτι ⸂λέγω ὑμᾶς⸃ δούλους, ὅτι ὁ δοῦλος οὐκ οἶδεν τί ποιεῖ αὐτοῦ ὁ κύριος· ὑμᾶς δὲ εἴρηκα φίλους, ὅτι πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου ἐγνώρισα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/015.yaml
  text: I no longer call you slaves[a], because the slave does not know what his master is doing. But I have called you friends[b], because I have made known to you everything that I heard from my Father.
translation:
  language: pt
  text: Já não chamo vocês de escravos[a], porque o escravo não sabe o que seu senhor[b] faz. Mas chamei vocês de amigos, porque dei a conhecer a vocês tudo o que ouvi de meu Pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos”. O termo grego doulos pode designar um servo ou um escravo; aqui, “escravos” ressalta a condição subordinada em contraste com a amizade.
    reason: lexical_alternative
  - marker: b
    text: Ou “mestre”. O grego traz kyrios, termo que também pode significar “Senhor”; aqui ele designa o senhor de um escravo na analogia social.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι λέγω ὑμᾶς
  choice: Já não chamo vocês
  rationale: Mantém a negação temporal e o presente de λέγω numa formulação natural em português, indicando mudança em relação à designação anterior.
- source_word: δούλους / ὁ δοῦλος
  choice: escravos / o escravo
  rationale: No contraste com amigos e com o senhor, o termo destaca subordinação e falta de acesso ao que o superior faz; “escravo” preserva essa assimetria com mais precisão que “servo”.
- source_word: οὐκ οἶδεν τί ποιεῖ
  choice: não sabe o que ... faz
  rationale: Traduz diretamente a ideia de conhecimento e conserva o presente de ποιεῖ sem exigir que a ação seja apresentada como progressiva.
- source_word: αὐτοῦ ὁ κύριος
  choice: seu senhor
  rationale: No quadro social da relação entre escravo e senhor, κύριος designa o superior do escravo, não funciona aqui como título divino.
- source_word: ὑμᾶς δὲ εἴρηκα φίλους
  choice: Mas chamei vocês de amigos
  rationale: Expressa a designação feita por Jesus e o contraste com “escravos”. O pretérito perfeito é mais natural em português que “tenho chamado”, que poderia sugerir repetição.
- source_word: πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου
  choice: tudo o que ouvi de meu Pai
  rationale: Preserva ἀκούω como “ouvir” e παρά com genitivo como indicação de fonte.
- source_word: ἐγνώρισα ὑμῖν
  choice: dei a conhecer a vocês
  rationale: Traduz o aoristo de γνωρίζω como uma ação de revelação ou comunicação realizada, em linguagem clara e digna.
theological_decisions:
- issue: Sentido de δοῦλος no contraste entre discipulado e amizade
  choice: escravos
  alternative: servos
  rationale: O contexto enfatiza a condição subordinada e a exclusão do conhecimento dos atos do senhor. “Escravos” mantém a força social do contraste sem reduzir a relação a serviço voluntário.
- issue: Sentido de κύριος na analogia social
  choice: senhor
  alternative: mestre
  rationale: Em português, “senhor” é o correlato histórico e relacional natural de “escravo”. A inicial minúscula deixa claro que não se trata aqui do título cristológico “Senhor”.
- issue: Representação de εἴρηκα e ἐγνώρισα
  choice: chamei ... dei a conhecer
  alternative: tenho chamado ... tenho dado a conhecer
  rationale: εἴρηκα é perfeito e sustenta a condição vigente de “amigos”, mas a forma composta portuguesa poderia sugerir ação repetida. ἐγνώρισα é aoristo no texto grego e foi traduzido como ação realizada. O contexto conserva o resultado presente de ambas as afirmações.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para ampla legibilidade brasileira. A ordem da última oração foi ajustada para fluência, sem alterar o escopo de “tudo o que”. Os marcadores de nota foram colocados exatamente junto aos termos que explicam.
