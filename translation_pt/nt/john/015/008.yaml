  text: ἐν τούτῳ ἐδοξάσθη ὁ πατήρ μου ἵνα καρπὸν πολὺν φέρητε καὶ ⸀γένησθε ἐμοὶ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/008.yaml
  text: 'In this my Father is glorified: that you bear much fruit and become my disciples.'
translation:
  language: pt
  text: 'Nisto meu Pai é glorificado: que vocês deem muito fruto e se tornem meus discípulos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nisto
  rationale: Preserva a referência ampla e algo ambígua da expressão grega, que pode apontar para o que segue e também retomar o contexto anterior.
- source_word: ἐδοξάσθη
  choice: é glorificado
  rationale: O aoristo pode assumir valor proléptico ou consumativo neste contexto; o presente natural em português comunica que o Pai recebe glória na frutificação dos discípulos sem impor uma referência estritamente passada.
- source_word: καρπὸν πολὺν φέρητε
  choice: deem muito fruto
  rationale: Expressão idiomática corrente que mantém a metáfora agrícola de φέρω e sua conexão com a videira.
- source_word: γένησθε
  choice: se tornem
  rationale: Representa o sentido de vir a ser ou mostrar-se discípulos, sem enfraquecê-lo para uma simples afirmação de identidade.
- source_word: μαθηταί
  choice: discípulos
  rationale: Equivalente português estabelecido para aprendizes e seguidores de Jesus.
theological_decisions:
- issue: Relação entre a glorificação do Pai, o fruto e o discipulado
  choice: Usar dois-pontos após “glorificado” e manter “que vocês deem... e se tornem...”
  alternative: “Meu Pai é glorificado quando vocês dão muito fruto e assim mostram que são meus discípulos.”
  rationale: A redação escolhida preserva o ἵνα e a coordenação entre os dois verbos, evitando transformar γένησθε em mera demonstração externa ou acrescentar uma relação causal com “assim” que o texto grego não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa. A frase conserva a concisão e a tensão sintática do grego sem soar excessivamente literal.
