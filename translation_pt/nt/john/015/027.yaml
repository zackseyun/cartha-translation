source:
  edition: SBLGNT
  text: καὶ ὑμεῖς δὲ μαρτυρεῖτε, ὅτι ἀπ’ ἀρχῆς μετ’ ἐμοῦ ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/027.yaml
  text: And you also testify[b][a], because you have been with me from the beginning.
translation:
  language: pt
  text: E vocês também dão testemunho[a], porque estão comigo desde o princípio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, entendendo a forma grega como uma ordem: «deem testemunho».'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: καὶ ὑμεῖς δὲ
  choice: E vocês também
  rationale: Preserva a ligação com o versículo anterior e a ênfase no testemunho adicional dos discípulos, ao lado do testemunho do Paráclito.
- source_word: μαρτυρεῖτε
  choice: dão testemunho
  rationale: Expressão natural e digna em português que mantém o sentido testemunhal, inclusive sua possível nuance forense. A forma grega pode ser indicativa ou imperativa; a leitura indicativa foi adotada no texto e a alternativa foi preservada em nota.
- source_word: ὅτι
  choice: porque
  rationale: 'Introduz de modo natural a razão pela qual os discípulos dão testemunho: sua convivência com Jesus desde o princípio.'
- source_word: ἀπ’ ἀρχῆς
  choice: desde o princípio
  rationale: Equivalente idiomático que preserva a formulação aberta do grego sem especificar no texto a que começo se refere.
- source_word: μετ’ ἐμοῦ ἐστε
  choice: estão comigo
  rationale: O presente com «desde» expressa naturalmente em português um estado iniciado no passado e ainda vigente, sem necessidade de alterar o tempo verbal.
theological_decisions:
- issue: Alcance de «desde o princípio»
  choice: Manter a expressão sem explicitação adicional
  alternative: Especificar «desde o princípio do meu ministério»
  rationale: O contexto aponta para a convivência histórica dos discípulos com Jesus desde o começo, mas o texto grego não explicita «do ministério»; por isso, a tradução preserva sua abertura.
- issue: Valor verbal de μαρτυρεῖτε
  choice: 'Indicativo: «dão testemunho»'
  alternative: 'Imperativo: «deem testemunho»'
  rationale: A forma grega admite ambas as análises. O indicativo se encaixa como afirmação paralela ao testemunho do Espírito no versículo anterior, enquanto a possível leitura como ordem é mantida em nota para não eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com «vocês» para ampla legibilidade brasileira. «Dão testemunho» conserva a linguagem de testemunha sem soar excessivamente técnica. O presente «estão» com «desde o princípio» é idiomático e comunica continuidade até o momento presente.
