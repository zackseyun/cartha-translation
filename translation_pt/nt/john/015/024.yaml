id: JHN.15.24
reference: John 15:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ τὰ ἔργα μὴ ἐποίησα ἐν αὐτοῖς ἃ οὐδεὶς ἄλλος ⸀ἐποίησεν, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ καὶ ἑωράκασιν καὶ μεμισήκασιν καὶ ἐμὲ καὶ τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/024.yaml
  text: If I had not done among them the works that no one else did[a], they would not have sin[b]; but now they have both seen and hated both me and my Father.
translation:
  language: pt
  text: Se eu não tivesse feito entre eles as obras que nenhum outro fez, não teriam pecado algum[a]. Agora, porém, eles viram e odiaram tanto a mim quanto a meu Pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não seriam culpados de pecado”. O grego diz mais literalmente: “não teriam pecado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔργα
  choice: as obras
  rationale: “Obras” preserva o uso característico de João para os atos de Jesus que revelam sua identidade e missão.
- source_word: ἐποίησα ἐν αὐτοῖς
  choice: tivesse feito entre eles
  rationale: A construção condicional contrária ao fato pede naturalmente o pretérito imperfeito do subjuntivo em português; “entre eles” expressa o sentido locativo e social de ἐν αὐτοῖς.
- source_word: ἃ οὐδεὶς ἄλλος ἐποίησεν
  choice: que nenhum outro fez
  rationale: Tradução direta e natural que ressalta o caráter singular das obras de Jesus sem acrescentar “homem” ou “pessoa” ao texto.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: não teriam pecado algum
  rationale: A presença de “algum” deixa claro que “pecado” é substantivo, evitando que “teriam pecado” seja entendido como tempo composto do verbo pecar, e conserva de modo próximo o idioma joanino “ter pecado”.
- source_word: νῦν δὲ
  choice: Agora, porém
  rationale: Marca com clareza o contraste entre a hipótese anterior e a realidade presente.
- source_word: καὶ ἑωράκασιν καὶ μεμισήκασιν
  choice: viram e odiaram
  rationale: Os perfeitos gregos descrevem atos consumados com relevância presente. O pretérito perfeito simples é a forma portuguesa mais natural neste contexto, sem sugerir repetição contínua.
- source_word: καὶ ἐμὲ καὶ τὸν πατέρα μου
  choice: tanto a mim quanto a meu Pai
  rationale: A correlação “tanto... quanto...” reproduz a ênfase da repetição de καί sobre os dois objetos.
theological_decisions:
- issue: Sentido de “não teriam pecado” em relação à culpabilidade
  choice: Manter a formulação substantiva “não teriam pecado algum”, com nota explicativa.
  alternative: não seriam culpados de pecado
  rationale: O contexto aponta para a culpabilidade agravada diante das obras reveladoras de Jesus, mas a tradução principal preserva a expressão joanina sem reduzi-la a uma formulação teológica mais estreita.
- issue: Relação entre o ódio a Jesus e o ódio ao Pai
  choice: 'Preservar a coordenação enfática: “tanto a mim quanto a meu Pai”.'
  alternative: odiaram a mim e a meu Pai
  rationale: A forma escolhida conserva a ligação estreita e enfática estabelecida pela repetição de καί, sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Evitou-se “não teriam pecado” isoladamente porque, em português, a sequência pode ser lida como forma verbal (“não teriam cometido pecado”), e não como o idioma substantivo do grego.
