id: JHN.15.4
reference: John 15:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ’ ἑαυτοῦ ἐὰν μὴ ⸀μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ ⸀μένητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/004.yaml
  text: Remain in me[a], and I in you. Just as the branch is not able to bear fruit by itself unless it remains in the vine, so neither can you unless you remain in me.
translation:
  language: pt
  text: Permaneçam em mim[a], e eu em vocês. Assim como o ramo não pode dar fruto por si mesmo se não permanecer na videira, vocês também não podem, se não permanecerem em mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Continuem em mim”. O verbo grego também pode ter o sentido de “ficar” ou “continuar”, mas aqui indica uma ligação contínua com Jesus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνατε / μένῃ / μένητε
  choice: Permaneçam / permanecer
  rationale: Mantém de modo consistente o verbo-chave μένω e comunica continuidade relacional em português atual; o imperativo plural explicita que Jesus se dirige aos discípulos.
- source_word: ἐν ἐμοί / ἐν ὑμῖν
  choice: em mim / em vocês
  rationale: Preserva a preposição ἐν e a linguagem de união ou participação, sem reduzi-la a mera proximidade.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: e eu em vocês
  rationale: Conserva a elipse do grego, que não repete explicitamente o verbo, sem transformá-la numa promessa mais definida.
- source_word: τὸ κλῆμα
  choice: o ramo
  rationale: Termo claro e natural para a parte da videira usada na comparação; evita o regionalismo potencial de 'vara'.
- source_word: οὐ δύναται καρπὸν φέρειν
  choice: não pode dar fruto
  rationale: Expressa naturalmente tanto a incapacidade indicada por δύναμαι quanto a metáfora agrícola de καρπὸν φέρειν.
- source_word: ἀφ’ ἑαυτοῦ
  choice: por si mesmo
  rationale: Representa de forma idiomática a ideia de agir ou produzir independentemente.
- source_word: ἐν τῇ ἀμπέλῳ
  choice: na videira
  rationale: Preserva diretamente a imagem do original, sem acrescentar a explicação 'ligado à videira'.
- source_word: οὕτως οὐδὲ ὑμεῖς
  choice: vocês também não podem
  rationale: Retoma de modo natural em português a ideia verbal de incapacidade da oração anterior, implícita no grego.
theological_decisions:
- issue: Sentido de μένω no contexto da relação entre Jesus e os discípulos
  choice: permanecer
  alternative: continuar; ficar
  rationale: '''Permanecer'' preserva a ideia de continuidade, perseverança e união relacional sem impor uma formulação doutrinária mais específica.'
- issue: Elipse em κἀγὼ ἐν ὑμῖν
  choice: e eu em vocês
  alternative: e eu permanecerei em vocês; e permaneçam vocês em mim, e eu em vocês
  rationale: A formulação escolhida mantém a concisão e a ambiguidade sintática do grego quanto ao verbo subentendido, evitando definir se a segunda parte deve ser lida estritamente como ordem, promessa ou afirmação recíproca.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Usa 'vocês' para o plural e mantém a repetição de 'permanecer', central à passagem. A frase final deixa 'dar fruto' subentendido após 'não podem', como no encadeamento do original, sem perder naturalidade.
