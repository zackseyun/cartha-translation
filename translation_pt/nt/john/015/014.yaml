  text: You are my friends if you do what I command you[a].
translation:
  language: pt
  text: Vocês são meus amigos se fizerem o que eu lhes ordeno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “Vocês são meus amigos se fizerem as coisas que eu lhes ordeno.”'
    reason: alternativa lexical
lexical_decisions:
- source_word: ὑμεῖς
  choice: Vocês
  rationale: Pronome de segunda pessoa do plural, colocado em primeiro lugar no grego para dar ênfase. “Vocês” é natural e amplamente compreensível em português; não é necessário acrescentar “mesmos”.
- source_word: φίλοι μού
  choice: meus amigos
  rationale: Expressa proximidade relacional e posse ou vínculo. “Meus amigos” é a formulação portuguesa natural e preserva a intimidade do contexto joanino.
- source_word: ἐστε
  choice: são
  rationale: Presente do indicativo de “ser”, traduzido diretamente.
- source_word: ἐὰν
  choice: se
  rationale: Introduz uma condição com o subjuntivo. “Se” preserva essa relação condicional sem transformá-la em mera indicação temporal.
- source_word: ποιῆτε
  choice: fizerem
  rationale: Subjuntivo de ποιέω, concordando naturalmente em português com a oração introduzida por “se”. “Fizerem” comunica a realização do que é ordenado sem impor uma nuance durativa excessiva.
- source_word: ἃ
  choice: o que
  rationale: Pronome relativo neutro plural que se refere ao conteúdo das ordens. “O que” é mais natural no português atual do que “as coisas que”.
- source_word: ἐγὼ
  choice: eu
  rationale: O pronome explícito enfatiza Jesus como aquele que ordena. Em português, essa referência já está incorporada na forma verbal e no pronome oblíquo possessivo da relação; a tradução natural não exige “eu” expresso.
- source_word: ἐντέλλομαι
  choice: ordeno
  rationale: O verbo indica uma determinação revestida de autoridade. “Ordeno” preserva essa força melhor do que “instruo”, sem acrescentar conteúdo.
- source_word: ὑμῖν
  choice: lhes
  rationale: Dativo plural que identifica os destinatários da ordem. “Lhes ordeno” é uma construção correta, concisa e amplamente compreensível.
theological_decisions:
- issue: Natureza da oração condicional que relaciona amizade e obediência
  choice: “Vocês são meus amigos se fizerem o que eu lhes ordeno.”
  alternative: “Vocês são meus amigos quando fazem o que eu lhes ordeno.”
  rationale: A construção grega ἐὰν com o subjuntivo expressa mais naturalmente uma condição. A tradução mantém a ligação declarada entre amizade com Jesus e obediência, sem resolver a tensão por meio de explicações sobre mérito, salvação ou perseverança.
translation_notes:
  register: Português moderno, digno e claro, com legibilidade brasileira e compreensão internacional. O uso de “vocês” evita regionalismos mais restritos; “lhes ordeno” mantém o plural explícito e um registro natural, sem perder a autoridade do verbo grego.
