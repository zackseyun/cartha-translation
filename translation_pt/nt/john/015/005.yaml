id: JHN.15.5
reference: John 15:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα. ὁ μένων ἐν ἐμοὶ κἀγὼ ἐν αὐτῷ οὗτος φέρει καρπὸν πολύν, ὅτι χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/005.yaml
  text: I am the vine[a]; you are the branches. The one who remains in me, and I in him, bears much fruit[b], because apart from me you are not able to do anything.
translation:
  language: pt
  text: Eu sou a videira; vocês são os ramos. Quem permanece[a] em mim, e eu nele[b], esse produz muito fruto, porque sem mim vocês não podem fazer coisa alguma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “continua” ou “habita”. Em João, o verbo grego enfatiza com frequência uma relação contínua e duradoura.
    reason: lexical_alternative
  - marker: b
    text: O grego emprega aqui uma forma masculina singular com sentido representativo; a afirmação se aplica de modo geral a qualquer discípulo que permanece em Jesus.
    reason: grammatical_clarification
lexical_decisions:
- source_word: ἄμπελος
  choice: videira
  rationale: É o equivalente português comum e exato para a planta da uva, preservando com naturalidade a metáfora.
- source_word: κλήματα
  choice: ramos
  rationale: No contexto da viticultura, refere-se aos ramos da videira. “Ramos” é corrente, claro e mantém a imagem.
- source_word: ὁ μένων
  choice: quem permanece
  rationale: “Permanece” comunica a continuidade relacional característica do uso joanino de μένω; a construção com “quem” expressa naturalmente a aplicação geral.
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: em mim ... nele
  rationale: Mantém a preposição “em” e, assim, preserva a forte linguagem recíproca do texto grego, sem reduzi-la a mera companhia.
- source_word: κἀγὼ
  choice: e eu
  rationale: 'Reproduz a crase grega κἀγώ e conserva o paralelismo recíproco: a pessoa permanece em Jesus, e Jesus nela.'
- source_word: φέρει καρπὸν πολύν
  choice: produz muito fruto
  rationale: “Produz fruto” é uma combinação natural no português contemporâneo e conserva a imagem agrícola; “muito” traduz diretamente πολύν sem ampliar para “abundante”.
- source_word: χωρὶς ἐμοῦ
  choice: sem mim
  rationale: Equivalente conciso e idiomático de χωρίς ἐμοῦ, comunicando que a ação é impossível fora da relação com Jesus.
- source_word: οὐ δύνασθε ποιεῖν οὐδέν
  choice: vocês não podem fazer coisa alguma
  rationale: Expressa claramente incapacidade, não proibição. “Coisa alguma” reproduz de modo natural a negação enfática sem criar dupla negação inadequada.
theological_decisions:
- issue: Linguagem joanina de permanência e habitação recíproca
  choice: “permanece em mim, e eu nele”
  alternative: “fica comigo, e eu com ele”
  rationale: A formulação escolhida preserva tanto a continuidade indicada por μένω quanto a linguagem teologicamente densa de reciprocidade expressa por ἐν, sem explicá-la ou enfraquecê-la.
- issue: Masculino singular representativo em αὐτῷ
  choice: “nele”
  alternative: “nessa pessoa”
  rationale: “Nele” corresponde à forma masculina singular do grego e preserva sua força representativa. A nota esclarece que a declaração se aplica de modo geral, sem alterar a forma do texto.
- issue: Amplitude de “fazer coisa alguma”
  choice: Manter a afirmação absoluta sem qualificação
  alternative: “não podem produzir fruto algum”
  rationale: O grego diz literalmente que os discípulos não podem fazer coisa alguma sem Jesus. Restringir a afirmação à produção de fruto resolveria uma amplitude e uma tensão que o próprio texto mantém.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa, favorecendo a legibilidade brasileira sem regionalismos marcados. A retomada “esse produz” é deliberadamente enfática e reflete o οὗτος grego, embora seja um pouco mais marcada que a formulação coloquial.
