id: JHN.15.10
reference: John 15:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν τὰς ἐντολάς μου τηρήσητε, μενεῖτε ἐν τῇ ἀγάπῃ μου, καθὼς ἐγὼ ⸂τὰς ἐντολὰς τοῦ πατρός μου⸃ τετήρηκα καὶ μένω αὐτοῦ ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/010.yaml
  text: If you keep my commandments, you will remain in my love, just as I have kept my Father's commandments and remain in his love.
translation:
  language: pt
  text: Se vocês guardarem os meus mandamentos, permanecerão no meu amor, assim como eu tenho guardado os mandamentos de meu Pai e permaneço no amor dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: Se
  rationale: Introduz uma condição com o subjuntivo; “se” é a forma natural em português e preserva a força condicional sem acrescentar ideia de repetição.
- source_word: ἐντολάς
  choice: mandamentos
  rationale: Expressa ordens dotadas de autoridade e mantém a terminologia joanina reconhecível, com linguagem corrente e digna.
- source_word: τηρήσητε / τετήρηκα
  choice: guardarem / tenho guardado
  rationale: “Guardar” conserva o sentido joanino de observar fielmente e mantém a ligação lexical entre a conduta dos discípulos e a de Jesus. O perfeito τετήρηκα é representado por “tenho guardado”, ressaltando a continuidade relevante do ato.
- source_word: μενεῖτε / μένω
  choice: permanecerão / permaneço
  rationale: “Permanecer” é claro no português moderno e preserva a repetição temática de μένω, bem como a ideia de continuidade relacional.
- source_word: ἐν τῇ ἀγάπῃ μου
  choice: no meu amor
  rationale: Mantém a imagem joanina do amor como esfera relacional, sem parafraseá-la como recebimento ou merecimento de amor.
- source_word: καθὼς
  choice: assim como
  rationale: Marca com naturalidade a correspondência entre a obediência dos discípulos e o exemplo de Jesus.
- source_word: τοῦ πατρός μου
  choice: de meu Pai
  rationale: Forma natural e reverente em português; “Pai” funciona aqui como designação divina.
- source_word: αὐτοῦ ἐν τῇ ἀγάπῃ
  choice: no amor dele
  rationale: O pronome retoma claramente “meu Pai” e conserva o paralelismo com “no meu amor” sem repetição pesada.
theological_decisions:
- issue: Relação entre guardar os mandamentos e permanecer no amor de Jesus
  choice: Preservar a formulação como condição real, sem explicar se ela envolve mérito, evidência, perseverança ou perda da salvação.
  alternative: Parafrasear a obediência como meio de merecer o amor ou apenas como sinal externo sem força condicional real.
  rationale: O grego estabelece diretamente a condição e a compara à fidelidade de Jesus aos mandamentos do Pai, mas não resolve neste versículo debates sistemáticos mais amplos.
- issue: Sentido de ἀγάπη
  choice: amor
  alternative: caridade
  rationale: “Amor” é a equivalência moderna e abrangente, preservando a repetição lexical e a linguagem relacional do versículo.
translation_notes:
  register: Português moderno, claro e amplamente internacional, com boa legibilidade brasileira. O tratamento por “vocês” é natural no Brasil e evita regionalismo excessivo. A construção conserva o paralelismo e a repetição vocabular do original sem soar arcaica.
