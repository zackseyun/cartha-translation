  text: ἤδη ὑμεῖς καθαροί ἐστε διὰ τὸν λόγον ὃν λελάληκα ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/003.yaml
  text: Already you are clean because of the word that I have spoken to you[a].
translation:
  language: pt
  text: Vocês já estão limpos por causa da palavra que lhes falei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio da palavra que lhes falei”.'
    reason: Alternativa lexical para διὰ τὸν λόγον, preservando a possível nuance instrumental.
lexical_decisions:
- source_word: ἤδη
  choice: já
  rationale: Expressa de modo natural um estado presente que já se encontra em vigor.
- source_word: ὑμεῖς
  choice: vocês
  rationale: Mantém o pronome explícito e plural, com ampla legibilidade no português brasileiro e compreensão internacional.
- source_word: καθαροί
  choice: limpos
  rationale: Preserva a imagem de limpeza e sua ligação temática com o verbo καθαίρει em João 15:2, sem tornar o sentido abstratamente moral com 'puros'.
- source_word: διὰ τὸν λόγον
  choice: por causa da palavra
  rationale: διά com acusativo indica aqui, de modo mais provável, causa ou fundamento; a alternativa instrumental permanece registrada em nota.
- source_word: λόγον
  choice: palavra
  rationale: É a correspondência mais direta e conserva a dicção joanina; 'mensagem' ou 'ensino' seriam mais interpretativos.
- source_word: ὃν λελάληκα
  choice: que lhes tenho falado
  rationale: O perfeito grego apresenta uma fala passada com relevância persistente. A locução 'tenho falado' procura conservar esse aspecto, e o pronome dativo é integrado naturalmente como 'lhes'.
- source_word: ὑμῖν
  choice: lhes
  rationale: Representa o objeto indireto plural sem acrescentar 'todos', que não está lexicalmente expresso.
theological_decisions:
- issue: Natureza da limpeza dos discípulos
  choice: Manter a afirmação como estado presente de limpeza ligado à palavra de Jesus, sem especificar uma categoria doutrinária técnica.
  alternative: Interpretá-la especificamente como limpeza sacramental ou declaração forense de justificação.
  rationale: O contexto imediato emprega a imagem da videira, da poda e da limpeza. A tradução deve preservar a metáfora e a abertura teológica do texto.
- issue: Valor de διά com acusativo
  choice: 'Traduzir principalmente como causa: ''por causa da palavra''.'
  alternative: 'Entender como meio: ''por meio da palavra''.'
  rationale: O valor causal é natural na construção, mas a proximidade semântica entre causa e meio permite a alternativa, que é preservada em nota.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira. 'Vocês' torna explícito o plural de ὑμεῖς; 'limpos' conserva a ligação com a imagem de limpeza/poda no contexto. A formulação evita terminologia confessional técnica.
