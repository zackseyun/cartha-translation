id: JHN.3.27
reference: John 3:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰωάννης καὶ εἶπεν· Οὐ δύναται ἄνθρωπος λαμβάνειν ⸂οὐδὲ ἓν⸃ ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/027.yaml
  text: John answered and said[a], “A man is not able to receive even one thing unless it has been given to him from heaven.”
translation:
  language: pt
  text: 'João respondeu e disse: “Uma pessoa[a] não pode receber nem uma coisa sequer, a menos que isso lhe tenha sido dado do céu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um ser humano”. O termo grego ἄνθρωπος tem aqui sentido genérico e representativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰωάννης καὶ εἶπεν
  choice: João respondeu e disse
  rationale: Mantém a fórmula narrativa dupla do grego, comum no estilo joanino, sem reduzi-la a um único verbo.
- source_word: Οὐ δύναται
  choice: não pode
  rationale: Expressa de modo natural em português a incapacidade indicada por δύναμαι.
- source_word: ἄνθρωπος
  choice: uma pessoa
  rationale: Neste contexto, o singular tem sentido genérico e representativo, não limitado ao sexo masculino. “Uma pessoa” comunica esse alcance com clareza no português atual.
- source_word: λαμβάνειν
  choice: receber
  rationale: O contexto apresenta aquilo que vem como concessão ou dádiva, e não como algo tomado ou apreendido.
- source_word: οὐδὲ ἓν
  choice: nem uma coisa sequer
  rationale: Preserva a negação enfática e a ideia de que nem mesmo uma única coisa pode ser recebida.
- source_word: ἐὰν μὴ
  choice: a menos que
  rationale: Equivalente idiomático da condição exceptiva grega.
- source_word: ᾖ δεδομένον
  choice: tenha sido dado
  rationale: Reflete a construção perifrástica perfeita passiva, indicando uma dádiva já concedida com resultado vigente.
- source_word: αὐτῷ
  choice: lhe
  rationale: Conserva o objeto indireto singular e genérico de maneira natural em português.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: do céu
  rationale: Mantém a expressão literal joanina para a origem divina, sem explicitá-la interpretativamente como “de Deus”.
theological_decisions:
- issue: Alcance da origem celestial na declaração de João
  choice: Conservar a formulação ampla de que ninguém recebe coisa alguma sem que isso lhe seja dado do céu.
  alternative: Restringir explicitamente a declaração a funções ministeriais ou ampliá-la em termos de um determinismo absoluto.
  rationale: O contexto imediato diz respeito ao ministério de João e à crescente proeminência de Jesus, mas a redação é suficientemente geral para enunciar um princípio mais amplo. A tradução preserva essa tensão sem impor um sistema teológico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A fórmula “respondeu e disse” conserva deliberadamente a estrutura narrativa do original; “nem uma coisa sequer” retém sua ênfase.
