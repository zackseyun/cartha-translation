id: JHN.3.6
reference: John 3:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸ γεγεννημένον ἐκ τῆς σαρκὸς σάρξ ἐστιν, καὶ τὸ γεγεννημένον ἐκ τοῦ πνεύματος πνεῦμά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/006.yaml
  text: What is born of the flesh is flesh[b][a], and what is born of the Spirit is spirit.
translation:
  language: pt
  text: O que nasceu da carne é carne, e o que nasceu do Espírito é espírito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que nasceu do Espírito é espiritual”. O grego diz literalmente “é espírito”, preservando o contraste qualitativo com “carne”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γεγεννημένον
  choice: o que nasceu
  rationale: O artigo neutro singular com o particípio perfeito passivo tem sentido genérico. A formulação é natural em português e preserva a afirmação categórica sobre aquilo que tem sua origem em cada esfera.
- source_word: ἐκ
  choice: de / do
  rationale: 'Neste contexto de nascimento e origem, a preposição portuguesa “de” expressa naturalmente a fonte: “da carne” e “do Espírito”.'
- source_word: σάρξ / σαρκὸς
  choice: carne
  rationale: “Carne” conserva a terminologia e o contraste joaninos. Aqui, o foco primário é o nascimento humano natural em contraste com o nascimento proveniente do Espírito; “natureza pecaminosa” restringiria indevidamente o sentido.
- source_word: πνεύματος / πνεῦμά
  choice: Espírito / espírito
  rationale: A primeira ocorrência designa o Espírito como fonte do nascimento e recebe inicial maiúscula. A segunda, predicativa e sem artigo, é mantida em minúscula para preservar o contraste qualitativo do grego sem identificar o nascido com o próprio Espírito.
- source_word: ἐστιν
  choice: é
  rationale: A cópula simples preserva a estrutura concisa, paralela e definidora do enunciado.
theological_decisions:
- issue: Sentido de σάρξ na primeira oração
  choice: “carne” como esfera humana ou natural
  alternative: “natureza humana” ou “natureza pecaminosa”
  rationale: Embora σάρξ possa ter conotação ética em outros contextos, aqui o contraste imediato é entre o nascimento natural e o nascimento proveniente do Espírito. “Carne” preserva a amplitude e a tensão do texto.
- issue: Sentido de πνεῦμα no predicado da segunda oração
  choice: “espírito”, com inicial minúscula
  alternative: “Espírito” ou “espiritual”
  rationale: A forma predicativa sem artigo favorece uma leitura qualitativa. “Espírito” poderia confundir o resultado do nascimento com o Espírito que o origina, enquanto “espiritual” explicitaria uma interpretação que o substantivo grego deixa mais aberta.
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela próxima do grego. Mantém-se “carne” por sua importância no contraste joanino e distingue-se graficamente “Espírito” como fonte de “espírito” como qualidade ou esfera resultante.
