id: JHN.3.16
reference: John 3:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον ὥστε τὸν ⸀υἱὸν τὸν μονογενῆ ἔδωκεν, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλὰ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/016.yaml
  text: 'For God loved the world in this way: he gave his only Son[b][a], so that everyone who believes in him should not perish but have eternal life.'
translation:
  language: pt
  text: 'Pois Deus amou o mundo desta maneira[a]: deu o seu Filho único[b], para que todo aquele que nele crê não pereça, mas tenha a vida eterna.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, tradicionalmente: “Pois Deus amou tanto o mundo”. O grego pode enfatizar a maneira pela qual Deus amou: “Deus amou o mundo desta maneira”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o seu Filho unigênito”; também possível: “o seu Filho singular”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὕτως
  choice: desta maneira
  rationale: Em seu contexto joanino, indica sobretudo a maneira concreta pela qual Deus amou, explicitada pela entrega do Filho, e não apenas a intensidade do amor.
- source_word: γὰρ
  choice: Pois
  rationale: Preserva a função explicativa e fundamentadora que liga o versículo ao contexto anterior.
- source_word: ἠγάπησεν
  choice: amou
  rationale: O aoristo indicativo é expresso naturalmente pelo pretérito perfeito simples em português.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Correspondência direta e natural para o sujeito grego.
- source_word: τὸν κόσμον
  choice: o mundo
  rationale: Mantém a amplitude de κόσμος em João sem restringi-lo explicitamente apenas à humanidade ou à criação.
- source_word: ὥστε
  choice: ': deu'
  rationale: Os dois-pontos apresentam de modo idiomático a manifestação ou o resultado concreto do amor mencionado em 'desta maneira'.
- source_word: τὸν υἱὸν τὸν μονογενῆ
  choice: o seu Filho único
  rationale: Expressa com clareza a singularidade do Filho e sua relação filial, sem fazer de 'gerado' o sentido lexical principal; alternativas históricas são registradas em nota.
- source_word: ἔδωκεν
  choice: deu
  rationale: Mantém a amplitude do verbo, sem limitar a dádiva exclusivamente à encarnação ou à crucificação.
- source_word: ἵνα
  choice: para que
  rationale: Introduz naturalmente em português a finalidade ou o resultado pretendido.
- source_word: πᾶς ὁ πιστεύων
  choice: todo aquele que crê
  rationale: Construção substantivada, genérica e inclusiva, expressa em português natural sem decidir debates teológicos posteriores.
- source_word: εἰς αὐτὸν
  choice: nele
  rationale: Com 'crer', é a forma idiomática portuguesa de expressar confiança dirigida a uma pessoa.
- source_word: μὴ ἀπόληται
  choice: não pereça
  rationale: Preserva a força grave e a abertura semântica de ἀπόλλυμι, bem como o subjuntivo dependente de ἵνα.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: tenha a vida eterna
  rationale: Tradução direta que conserva o subjuntivo e a expressão joanina estabelecida.
theological_decisions:
- issue: Sentido de Οὕτως
  choice: maneira — “desta maneira”
  alternative: grau ou intensidade — “tanto”
  rationale: A sintaxe imediata faz da entrega do Filho a explicação de como Deus amou o mundo. A alternativa tradicional permanece em nota para preservar a possibilidade de leitura e sua recepção histórica.
- issue: Tradução de μονογενής aplicado ao Filho
  choice: “Filho único” no texto principal
  alternative: “Filho unigênito” ou “Filho singular”
  rationale: “Único” comunica a singularidade filial indicada pelo termo segundo a evidência lexical atual, enquanto “unigênito”, histórica e teologicamente relevante, é preservado em nota.
- issue: Alcance de πᾶς ὁ πιστεύων
  choice: “todo aquele que crê”
  alternative: “quem crê” ou “todo o que crê”
  rationale: Mantém a formulação genérica e abrangente do grego sem inserir conclusões denominacionais sobre eleição, expiação ou resposta humana.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pois” conserva a ligação explicativa; “desta maneira” evita que a construção seja entendida apenas como intensidade; “vida eterna” mantém a expressão bíblica corrente. Os marcadores aparecem junto à expressão a que se referem e seguem ordem alfabética.
