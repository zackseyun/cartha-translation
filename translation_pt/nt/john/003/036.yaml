id: JHN.3.36
reference: John 3:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον· ὁ δὲ ἀπειθῶν τῷ υἱῷ οὐκ ὄψεται ζωήν, ἀλλ’ ἡ ὀργὴ τοῦ θεοῦ μένει ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/036.yaml
  text: The one who believes in the Son has eternal life; but the one who disobeys the Son will not see life, but the wrath of God remains on him.
translation:
  language: pt
  text: Quem crê no Filho tem a vida eterna; mas quem desobedece ao Filho[a] não verá a vida, mas a ira de Deus permanece sobre essa pessoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quem se recusa a crer no Filho”. O verbo grego pode transmitir tanto a ideia de recusar-se a crer como a de desobedecer.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱόν
  choice: Quem crê no Filho
  rationale: O particípio presente articular tem sentido pessoal genérico. “Quem crê” é natural em português, e “no Filho” expressa a confiança dirigida a ele.
- source_word: τὸν υἱόν / τῷ υἱῷ
  choice: o Filho / ao Filho
  rationale: Mantém o título cristológico do grego sem acrescentar o possessivo “de Deus”.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: tem a vida eterna
  rationale: O presente “tem” preserva a posse atual, enquanto “vida eterna” é a expressão portuguesa consagrada e semanticamente adequada ao uso joanino.
- source_word: ὁ δὲ ἀπειθῶν τῷ υἱῷ
  choice: mas quem desobedece ao Filho
  rationale: ἀπειθέω pode indicar desobediência e também recusa em crer. A tradução principal preserva o sentido mais amplo; a nota registra a outra possibilidade.
- source_word: οὐκ ὄψεται ζωήν
  choice: não verá a vida
  rationale: Conserva a imagem joanina e a força futura da expressão, sem reduzi-la a “não terá vida”.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: a ira de Deus
  rationale: Tradução direta da construção genitiva, sem atenuar a linguagem explícita de juízo divino.
- source_word: μένει ἐπ’ αὐτόν
  choice: permanece sobre essa pessoa
  rationale: “Permanece” conserva o presente e o importante verbo joanino μένω. “Sobre essa pessoa” comunica o referente pessoal genérico sem restringi-lo ao sexo masculino.
theological_decisions:
- issue: Sentido de ἀπειθῶν em contraste com πιστεύων
  choice: “quem desobedece” no texto principal, com “quem se recusa a crer” em nota
  alternative: “quem não crê” ou “quem se recusa a crer” no texto principal
  rationale: O contraste aponta para incredulidade, mas o verbo também carrega a ideia de desobediência. A solução mantém essa tensão sem reduzir o termo a mero assentimento intelectual.
- issue: Dimensão temporal da vida eterna e da ira
  choice: Preservar tanto a posse presente da vida eterna quanto a permanência presente da ira, ao lado do futuro “não verá”
  alternative: Interpretar vida e ira somente como realidades futuras
  rationale: ἔχει e μένει estão no presente, enquanto ὄψεται está no futuro. A tradução mantém essa combinação temporal sem harmonizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “quem” evita o masculino genérico pesado; “essa pessoa” torna explícito que o referente grego singular não se limita a homens. A vírgula antes do marcador liga a nota à expressão anterior sem interromper a leitura.
