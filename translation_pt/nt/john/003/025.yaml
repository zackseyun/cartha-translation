  text: Ἐγένετο οὖν ζήτησις ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου περὶ καθαρισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/025.yaml
  text: Then a dispute arose between John's disciples and a Jew about purification[a].
translation:
  language: pt
  text: Então surgiu uma discussão entre os discípulos de João e um judeu a respeito da purificação[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “limpeza” ou “purificação ritual”. O termo grego pode referir-se à limpeza em sentido geral, embora neste contexto provavelmente tenha conotações rituais.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: surgiu
  rationale: O verbo introduz o acontecimento de uma discussão; “surgiu” é natural em português e conserva a ideia de que ela teve início.
- source_word: οὖν
  choice: Então
  rationale: Aqui a partícula dá sequência à narrativa, sem exigir uma conclusão lógica forte.
- source_word: ζήτησις
  choice: discussão
  rationale: O termo pode indicar debate ou controvérsia. “Discussão” preserva a possibilidade de desacordo sem impor o grau mais intenso sugerido por “briga” ou “disputa”.
- source_word: ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου
  choice: entre os discípulos de João e um judeu
  rationale: Embora ἐκ seja literalmente “da parte de/dentre”, a construção completa identifica os participantes dos dois lados; “entre... e...” expressa isso de modo idiomático e mantém o singular de Ἰουδαίου.
- source_word: περὶ καθαρισμοῦ
  choice: a respeito da purificação
  rationale: καθαρισμός abrange limpeza ou purificação e, neste contexto joanino, provavelmente tem conotação ritual, sem que o versículo especifique seu alcance exato.
theological_decisions:
- issue: Se καθαρισμός deve ser explicitado como purificação ritual
  choice: purificação
  alternative: limpeza; purificação ritual
  rationale: O contexto favorece uma conotação religiosa ou ritual, mas o texto não a explicita plenamente. “Purificação” mantém essa provável nuance sem acrescentar uma especificação indevida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe idiomática evita reproduzir de modo artificial a preposição grega, e a nota preserva a amplitude semântica de καθαρισμός.
