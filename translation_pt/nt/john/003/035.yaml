  source_fidelity: 'A tradução preserva com precisão os elementos centrais do grego: «O Pai» e «o Filho» refletem os títulos definidos e contextualmente cristológicos; «ama» conserva o presente; «todas as coisas» traduz o alcance de πάντα; e «entregou» comunica adequadamente o ato consumado de δέδωκεν. «Nas mãos dele» é uma adaptação idiomática portuguesa aceitável para a expressão grega singular ἐν τῇ χειρὶ αὐτοῦ, cujo sentido de entrega de autoridade ou posse é mantido e explicitado com cautela na nota.'
