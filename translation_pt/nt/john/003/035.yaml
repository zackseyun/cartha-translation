id: JHN.3.35
reference: John 3:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ πατὴρ ἀγαπᾷ τὸν υἱόν, καὶ πάντα δέδωκεν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/035.yaml
  text: The Father loves the Son and has given all things into his hand[a].
translation:
  language: pt
  text: O Pai ama o Filho e entregou todas as coisas nas mãos dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «na mão dele». A expressão indica que todas as coisas foram confiadas à posse ou autoridade do Filho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πατὴρ
  choice: O Pai
  rationale: No contexto joanino, funciona como título pessoal divino e designa Deus em sua relação com o Filho; a inicial maiúscula sinaliza esse uso.
- source_word: ἀγαπᾷ
  choice: ama
  rationale: O presente do indicativo expressa uma realidade atual e contínua; o presente simples é natural em português e preserva esse valor.
- source_word: τὸν υἱόν
  choice: o Filho
  rationale: No contexto, refere-se especificamente a Jesus em sua relação filial com o Pai; a inicial maiúscula indica o uso titular.
- source_word: πάντα
  choice: todas as coisas
  rationale: O neutro plural tem alcance abrangente, preservado explicitamente sem restringir o que foi entregue.
- source_word: δέδωκεν
  choice: entregou
  rationale: Com a expressão relativa às mãos, 'entregou' comunica naturalmente a ação concluída e seu resultado vigente de posse ou autoridade confiada ao Filho.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: nas mãos dele
  rationale: A expressão grega é literalmente singular, 'na mão dele', mas o plural 'nas mãos' é a forma idiomática corrente em português para indicar entrega à posse, ao cuidado ou à autoridade de alguém. 'Dele' evita a possível ambiguidade referencial de 'suas'.
theological_decisions:
- issue: Relação entre o Pai e o Filho
  choice: Mantidos os títulos pessoais «Pai» e «Filho», com iniciais maiúsculas.
  alternative: Linguagem familiar genérica em minúsculas.
  rationale: O contexto apresenta uma relação cristológica específica; a tradução preserva os títulos sem acrescentar uma formulação doutrinária além do texto.
- issue: Alcance e efeito permanente daquilo que foi entregue ao Filho
  choice: «entregou todas as coisas nas mãos dele»
  alternative: «deu tudo a ele» ou «tem dado todas as coisas»
  rationale: A formulação mantém o alcance abrangente de πάντα e comunica o resultado vigente do perfeito δέδωκεν, sem tornar artificial o português nem definir além do texto a natureza exata da autoridade ou posse.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «nas mãos dele» é idiomática e evita a ambiguidade de «suas mãos»; a nota conserva a forma singular do grego.
