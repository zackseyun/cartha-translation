id: JHN.3.34
reference: John 3:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃν γὰρ ἀπέστειλεν ὁ θεὸς τὰ ῥήματα τοῦ θεοῦ λαλεῖ, οὐ γὰρ ἐκ μέτρου ⸀δίδωσιν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/034.yaml
  text: For the one whom God sent speaks the words of God[a], for he gives the Spirit without measure.
translation:
  language: pt
  text: Pois aquele que Deus enviou fala as palavras de Deus, pois Deus dá o Espírito sem medida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois aquele que Deus enviou dá o Espírito sem medida.”'
    reason: Leitura alternativa quanto ao sujeito implícito do verbo “dá”.
lexical_decisions:
- source_word: ὃν
  choice: aquele que
  rationale: O pronome relativo acusativo masculino singular tem força substantivada e se refere à pessoa enviada por Deus; “aquele que” é natural e claro em português.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: O aoristo indicativo é adequadamente expresso pelo pretérito perfeito, preservando também a linguagem joanina recorrente de envio.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: as palavras de Deus
  rationale: Mantém o plural de ῥήματα, seu sentido de palavras pronunciadas e a construção genitiva do grego.
- source_word: λαλεῖ
  choice: fala
  rationale: Verbo corrente e direto, apropriado ao presente indicativo e à ação contínua ou característica de falar.
- source_word: οὐ ... ἐκ μέτρου
  choice: sem medida
  rationale: A expressão negativa indica que o Espírito não é dado de modo medido ou limitado; “sem medida” preserva concisamente a metáfora.
- source_word: δίδωσιν
  choice: dá
  rationale: Tradução direta do presente indicativo, sem acrescentar nuances ausentes como “concede” ou “derrama”.
- source_word: τὸ πνεῦμα
  choice: o Espírito
  rationale: No contexto joanino, a referência mais natural é ao Espírito de Deus; a inicial maiúscula explicita essa referência segundo a convenção portuguesa, embora o grego antigo não faça essa distinção gráfica.
theological_decisions:
- issue: Sujeito implícito de δίδωσιν (“dá”)
  choice: 'No texto principal, “ele” é entendido como Deus: Deus dá o Espírito sem medida.'
  alternative: “Ele” pode ser entendido como aquele que Deus enviou, isto é, o Filho, que dá o Espírito sem medida.
  rationale: Deus é o sujeito explícito mais próximo na sequência, e essa leitura explica por que o enviado fala as palavras de Deus. Contudo, o sujeito de δίδωσιν está implícito no grego, de modo que a referência ao enviado também é gramaticalmente possível e deve ser preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as repetições do grego foram preservadas quando naturais. O pronome “ele” foi mantido para não eliminar a ambiguidade real do sujeito, explicada na nota.
