    rationale: Essa divergência entre a formulação portuguesa e a leitura editorial altera a apresentação da ambiguidade do sujeito implícito de δίδωσιν. Nomear Deus no texto principal alinha a tradução à leitura escolhida, enquanto a nota preserva a alternativa de que o enviado seja o doador.
  revised_text: Pois aquele que Deus enviou fala as palavras de Deus, pois Deus dá o Espírito sem medida.[a]
