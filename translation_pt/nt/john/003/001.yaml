  text: Ἦν δὲ ἄνθρωπος ἐκ τῶν Φαρισαίων, Νικόδημος ὄνομα αὐτῷ, ἄρχων τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/001.yaml
  text: There was a man from the Pharisees named Nicodemus[a], a ruler of the Jews.
translation:
  language: pt
  text: Havia entre os fariseus um homem chamado Nicodemos, uma autoridade dos judeus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma autoridade dos judeanos”. O termo grego pode se referir aos judeus em geral ou, em certos contextos, mais especificamente aos judeanos ou às autoridades judaicas.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: Havia
  rationale: Introduz a personagem e faz avançar a narrativa de modo natural em português; o valor conectivo leve de δέ não exige uma conjunção explícita.
- source_word: ἄνθρωπος
  choice: um homem
  rationale: Refere-se aqui a um indivíduo masculino específico, Nicodemos.
- source_word: ἐκ τῶν Φαρισαίων
  choice: entre os fariseus
  rationale: ἐκ com o genitivo indica que Nicodemos pertencia ao grupo; esta formulação comunica naturalmente sua associação em português.
- source_word: Νικόδημος ὄνομα αὐτῷ
  choice: chamado Nicodemos
  rationale: Expressa de forma concisa e natural a fórmula grega de nomeação.
- source_word: ἄρχων
  choice: uma autoridade
  rationale: O termo designa alguém que ocupava posição de liderança ou governo; «autoridade» evita sugerir necessariamente um soberano individual.
- source_word: τῶν Ἰουδαίων
  choice: entre os judeus
  rationale: Neste contexto, qualifica a esfera comunitária na qual Nicodemos exercia autoridade, sem excluir a possível referência mais específica às autoridades judaicas.
theological_decisions:
- issue: Sentido de Ἰουδαίων no contexto joanino
  choice: entre os judeus
  alternative: entre os judeanos; uma autoridade judaica
  rationale: Ἰουδαῖοι pode ter sentido étnico-religioso, regional ou institucional em João. O texto principal mantém a referência ampla, enquanto a nota preserva as possíveis nuances regional e de liderança.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A formulação preserva a ambiguidade contextual de Ἰουδαίων.
