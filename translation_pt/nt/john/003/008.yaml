source:
  edition: SBLGNT
  text: τὸ πνεῦμα ὅπου θέλει πνεῖ, καὶ τὴν φωνὴν αὐτοῦ ἀκούεις, ἀλλ’ οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει· οὕτως ἐστὶν πᾶς ὁ γεγεννημένος ἐκ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/008.yaml
  text: The wind blows where it wishes[a], and you hear its sound, but you do not know where it comes from and where it goes[b]. So it is with everyone who has been born of the Spirit.
translation:
  language: pt
  text: O vento sopra onde quer[a]. Você ouve o seu som[b], mas não sabe de onde ele vem nem para onde vai. Assim é todo aquele que nasceu do Espírito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra grega pneuma pode significar tanto “vento” como “espírito”. Jesus emprega a mesma palavra nas duas partes do versículo, criando um jogo de palavras que o português não consegue reproduzir plenamente.
    reason: lexical_alternative
  - marker: b
    text: Ou “voz”. A palavra grega pode significar “som” ou “voz”; aqui, refere-se ao efeito audível do vento.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα (primeira ocorrência)
  choice: vento
  rationale: A associação com πνεῖ (“sopra”) e com um som audível favorece o sentido concreto de “vento”. A escolha também permite que a frase funcione naturalmente em português, enquanto a nota registra o jogo de palavras grego com “Espírito” no fim do versículo.
- source_word: ὅπου θέλει
  choice: onde quer
  rationale: Expressa a ideia de vontade ou liberdade de movimento de modo natural e atual, preservando a personificação presente na imagem.
- source_word: πνεῖ
  choice: sopra
  rationale: É o verbo português próprio para a ação do vento e corresponde diretamente à imagem meteorológica.
- source_word: φωνήν
  choice: som
  rationale: Embora φωνή também possa significar “voz”, aqui designa naturalmente aquilo que se ouve do vento. A alternativa é registrada em nota.
- source_word: οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει
  choice: não sabe de onde ele vem nem para onde vai
  rationale: Reproduz com clareza o paralelismo de origem e destino. “Nem” é idiomático em português depois da negação e mantém a coordenação do grego.
- source_word: οὕτως ἐστίν
  choice: Assim é
  rationale: Forma breve e natural que preserva a comparação entre o vento e a pessoa nascida do Espírito.
- source_word: πᾶς ὁ γεγεννημένος
  choice: todo aquele que nasceu
  rationale: Transmite o sentido genérico do particípio substantivado. O perfeito grego apresenta o nascimento como acontecimento realizado com estado resultante; no português corrente, “nasceu” comunica isso com naturalidade no contexto.
- source_word: ἐκ τοῦ πνεύματος (ocorrência final)
  choice: do Espírito
  rationale: No contexto do novo nascimento em João 3, refere-se ao Espírito como fonte ou origem desse nascimento. “Nasceu do Espírito” é natural e mantém essa relação.
theological_decisions:
- issue: O duplo sentido da repetição de πνεῦμα
  choice: Traduzir a primeira ocorrência por “vento” e a última por “Espírito”.
  alternative: Traduzir ambas por “Espírito” ou ambas por “vento”, ou manter “Espírito” na primeira com “vento” apenas em nota.
  rationale: O grego explora deliberadamente uma palavra que pode significar “vento” ou “espírito”. A primeira cláusula descreve algo que sopra e é ouvido, favorecendo “vento”; a cláusula final trata do nascimento procedente do Espírito. Como o português não consegue reproduzir o jogo com uma única palavra, a nota preserva a ambiguidade lexical sem obscurecer os sentidos contextuais.
- issue: Referência do Espírito na cláusula final
  choice: Usar “Espírito” com inicial maiúscula.
  alternative: Usar “espírito” como referência não especificada ao sopro ou à dimensão espiritual.
  rationale: O diálogo imediato sobre nascer da água e do Espírito favorece a referência ao Espírito divino. A tradução mantém, porém, a tensão figurativa com o vento por meio da nota lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” torna explícito o singular de ἀκούεις e οἶδας de maneira natural. A formulação evita arcaísmos como “onde lhe apraz” e conserva o ritmo conciso da comparação.
