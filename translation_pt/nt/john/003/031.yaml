id: JHN.3.31
reference: John 3:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ ἄνωθεν ἐρχόμενος ἐπάνω πάντων ἐστίν. ὁ ὢν ἐκ τῆς γῆς ἐκ τῆς γῆς ἐστιν καὶ ἐκ τῆς γῆς λαλεῖ· ὁ ἐκ τοῦ οὐρανοῦ ἐρχόμενος ἐπάνω πάντων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/031.yaml
  text: The one who comes from above is above all[a]. The one who is from the earth is from the earth and speaks from the earth[b]. The one who comes from heaven is above all.
translation:
  language: pt
  text: Aquele que vem do alto está acima de todos[a]. Aquele que é da terra é da terra e fala a partir da terra[b]. Aquele que vem do céu está acima de todos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do céu” em lugar de “do alto” na primeira frase. O grego ἄνωθεν indica origem de cima, esclarecida depois pela expressão “do céu”.
    reason: lexical_alternative
  - marker: b
    text: Ou “fala das coisas da terra”. O grego repete mais literalmente “da terra”, expressão que pode indicar origem, esfera ou assunto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: do alto
  rationale: Com ἐρχόμενος, indica origem superior, não repetição. “Do alto” preserva o contraste vertical com “da terra” e é esclarecido depois por “do céu”.
- source_word: ἐρχόμενος
  choice: que vem
  rationale: O particípio presente com artigo tem função substantiva; “aquele que vem” é natural em português e mantém sua força descritiva.
- source_word: ἐπάνω πάντων
  choice: acima de todos
  rationale: Expressa supremacia e conserva a metáfora espacial. Neste contexto pessoal, “todos” comunica com naturalidade o alcance do plural πάντων.
- source_word: ὁ ὢν ἐκ τῆς γῆς
  choice: aquele que é da terra
  rationale: Mantém a construção pessoal e a ênfase na origem, além de preparar a repetição intencional de “da terra”.
- source_word: γῆ
  choice: terra
  rationale: O termo contrasta com o céu como esfera de origem; por isso, “terra” é mais adequado que “solo” ou “região”.
- source_word: ἐκ τῆς γῆς ἐστιν
  choice: é da terra
  rationale: Preserva a repetição enfática do grego e evita condensar origem e natureza numa paráfrase interpretativa.
- source_word: ἐκ τῆς γῆς λαλεῖ
  choice: fala a partir da terra
  rationale: Conserva a ideia de procedência marcada por ἐκ e deixa aberta a possibilidade de referência à origem, esfera ou perspectiva do discurso.
- source_word: οὐρανός
  choice: céu
  rationale: No contexto joanino, refere-se à esfera celestial ou divina, e não meramente ao céu físico.
theological_decisions:
- issue: Relação entre “do alto” e “do céu”
  choice: Traduzir ἄνωθεν por “do alto” e ἐκ τοῦ οὐρανοῦ por “do céu”.
  alternative: Traduzir ambas as expressões por “do céu”.
  rationale: O grego emprega expressões relacionadas, mas distintas. A formulação escolhida preserva a dicção joanina e permite que “do céu” esclareça a origem indicada por “do alto”, sem apagar o paralelismo.
- issue: Força da linguagem repetida sobre a terra
  choice: Manter a repetição “da terra ... da terra ... a partir da terra”.
  alternative: Condensar como “aquele que é terreno fala de maneira terrena”.
  rationale: A repetição é retoricamente significativa e acentua o contraste entre origem terrena e origem celestial. A tradução evita impor uma explicação única à última expressão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição do original foi preservada deliberadamente; “a partir da terra” evita que “fala da terra” seja entendido de imediato apenas como assunto.
