  source_fidelity: A tradução preserva adequadamente a estrutura tripartida e a repetição enfática de ἐκ τῆς γῆς. “Do alto” para ἄνωθεν, “da terra” para γῆ, “a partir da terra” para ἐκ τῆς γῆς λαλεῖ e “do céu” para ἐκ τοῦ οὐρανοῦ mantêm o contraste de origem/esfera sem resolver indevidamente a nuance da fala terrena. “Acima de todos” transmite de modo natural a supremacia expressa por ἐπάνω πάντων.
  naturalness: O português é moderno, claro e de registro bíblico sóbrio. A repetição de “da terra” é deliberadamente marcada, como no grego. “Fala a partir da terra” é um pouco mais formal que a fala cotidiana, mas é compreensível e funcional aqui, pois evita reduzir a expressão a “falar sobre a terra”.
  terminology: “Do alto” e “do céu” preservam a distinção lexical do texto joanino. “Terra” e “céu” são os equivalentes apropriados no contraste cósmico do versículo. As notas apresentam alternativas legítimas e explicam a ambiguidade sem impor leitura doutrinária.
