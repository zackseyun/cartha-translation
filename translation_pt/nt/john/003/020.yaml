    issue: 'Formulação pouco idiomática: “não vem para a luz”.'
    rationale: Embora compreensível e próxima da estrutura grega, a expressão é menos natural em português moderno. “Não se aproxima da luz” conserva o valor de ἔρχεται πρὸς τὸ φῶς e a metáfora sem introduzir a expressão idiomática potencialmente ambígua “vir à luz”.
  - severity: low
    issue: 'Alternativa da nota: “seja demonstrada a culpa delas”.'
    rationale: A formulação é gramaticalmente possível, mas soa imprecisa aplicada a “obras”. É melhor apresentar a alternativa como a demonstração de que as obras são más ou culpáveis, preservando os matizes de ἐλέγχω.
