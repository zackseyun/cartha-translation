- from: Pois todo aquele que pratica o mal odeia a luz e não vem para a luz, para que as suas obras não sejam expostas.[a]
  to: Pois todo aquele que pratica o mal odeia a luz e não se aproxima da luz, para que as suas obras não sejam expostas.[a]
  rationale: A revisão limita-se a tornar idiomática a expressão de aproximação à luz e a esclarecer a alternativa lexical na nota. Mantêm-se a construção genérica singular, a repetição enfática de “a luz”, o sentido habitual da prática do mal e a ambiguidade semântica de ἐλεγχθῇ.
