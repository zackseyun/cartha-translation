source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ φαῦλα πράσσων μισεῖ τὸ φῶς καὶ οὐκ ἔρχεται πρὸς τὸ φῶς, ἵνα μὴ ἐλεγχθῇ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/020.yaml
  text: For everyone who practices evil hates the light and does not come to the light[b][a], lest his works be exposed.
translation:
  language: pt
  text: Pois todo aquele que pratica o mal odeia a luz e não se aproxima da luz, para que as suas obras não sejam expostas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sejam repreendidas” ou “seja demonstrado que são culpáveis”; o verbo grego pode indicar a exposição do erro, a demonstração de culpa ou a repreensão.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ὁ
  choice: Pois todo aquele que
  rationale: A construção com πᾶς e particípio substantivado expressa uma afirmação genérica sobre qualquer pessoa caracterizada pela ação; “Pois” mantém a função explicativa de γάρ.
- source_word: φαῦλα πράσσων
  choice: pratica o mal
  rationale: φαῦλα tem aqui sentido moral, enquanto o presente πράσσων descreve conduta característica ou contínua. A expressão portuguesa é natural e preserva ambas as ideias.
- source_word: μισεῖ τὸ φῶς
  choice: odeia a luz
  rationale: Tradução direta que conserva tanto a força de μισέω quanto a metáfora joanina da luz.
- source_word: οὐκ ἔρχεται πρὸς τὸ φῶς
  choice: não vem para a luz
  rationale: Mantém a simplicidade verbal e a imagem de movimento em direção à luz, sem transformar a metáfora em explicação.
- source_word: ἵνα μὴ
  choice: para que ... não
  rationale: Expressa em português atual a finalidade negativa ou a intenção de evitar o resultado.
- source_word: ἐλεγχθῇ
  choice: sejam expostas
  rationale: No contexto da luz, “expostas” comunica que as obras são trazidas à vista e reveladas como más, preservando também a possibilidade de demonstração de culpa.
- source_word: τὰ ἔργα αὐτοῦ
  choice: as suas obras
  rationale: “Obras” preserva a correspondência com ἔργα e a continuidade lexical joanina; “suas” retoma de modo natural o singular genérico “todo aquele”.
theological_decisions:
- issue: Referência masculina singular em uma declaração genérica
  choice: todo aquele ... as suas obras
  alternative: toda pessoa ... suas obras
  rationale: O grego apresenta uma construção masculina singular genérica. A tradução conserva essa forma representativa, que em português continua podendo abranger qualquer pessoa.
- issue: Sentido de ἐλεγχθῇ diante da luz
  choice: sejam expostas
  alternative: sejam repreendidas; sejam desmascaradas; seja demonstrada a culpa delas
  rationale: A escolha privilegia a imagem contextual da luz que revela as obras, sem reduzir o verbo exclusivamente à repreensão ou a uma condenação judicial.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva a repetição joanina de “a luz” e usa “para que ... não” em vez do mais literário “para que não sejam”, mantendo fluidez sem perder a relação de finalidade.
