review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente γάρ (“Pois”), a generalização de πᾶς ὁ, o aspecto habitual de πράσσων, a metáfora joanina de “a luz” e a finalidade negativa de ἵνα μή. “Sejam expostas” é uma boa opção contextual para ἐλεγχθῇ. Contudo, “não vem para a luz” é pouco idiomático em português e pode ser ajustado sem perda da imagem ou do sentido.
  naturalness: “Não se aproxima da luz” é mais natural e claro em português moderno do que “não vem para a luz”, preservando o movimento em direção à luz. A nota deve também formular com maior precisão as alternativas sem sugerir que as obras, como entidades pessoais, recebem formalmente uma culpa própria.
  terminology: “Pratica o mal”, “odeia a luz”, “obras” e “expostas” são escolhas adequadas, de registro sóbrio e amplamente compreensível. A repetição de “a luz” deve ser mantida.
