id: JHN.3.18
reference: John 3:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται· ὁ ⸀δὲ μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/018.yaml
  text: The one who believes in him is not judged[a]; but the one who does not believe has already been judged[b], because he has not believed in the name of the one and only Son of God.
translation:
  language: pt
  text: Quem crê nele não é julgado[a]; mas quem não crê já está julgado, porque não creu no nome do Filho único[b] de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “condenado”, aqui e na segunda ocorrência de “julgado”. O verbo grego κρίνω pode significar “julgar” ou, neste contexto, “condenar”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Filho singular”; tradicionalmente, “Filho unigênito”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων
  choice: quem crê
  rationale: O particípio presente com artigo tem sentido substantivado e geral. “Quem crê” é natural em português e preserva a referência a toda pessoa caracterizada pela fé.
- source_word: εἰς αὐτόν
  choice: nele
  rationale: Com πιστεύω, εἰς indica fé ou confiança dirigida a uma pessoa; “crer nele” é a forma idiomática correspondente em português.
- source_word: οὐ κρίνεται
  choice: não é julgado
  rationale: “Julgado” traduz diretamente o campo semântico de κρίνω e preserva a possibilidade de que, no contexto, se trate especificamente de condenação.
- source_word: ὁ δὲ μὴ πιστεύων
  choice: mas quem não crê
  rationale: δέ marca o contraste, e o particípio substantivado é expresso de modo natural por “quem não crê”.
- source_word: ἤδη κέκριται
  choice: já foi julgado
  rationale: O perfeito apresenta um julgamento já efetuado com relevância presente. “Já foi julgado” comunica com clareza a anterioridade e o resultado vigente, sem especificar além do grego se o veredito é condenatório.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão do julgamento mencionado na oração anterior.
- source_word: μὴ πεπίστευκεν
  choice: não creu
  rationale: O perfeito descreve a falta de fé que fundamenta o estado presente. Em português corrente, “não creu” evita uma construção artificial, enquanto o contexto mantém a relevância presente.
- source_word: εἰς τὸ ὄνομα
  choice: no nome
  rationale: Mantém a expressão joanina concreta, na qual “nome” representa a identidade revelada e a autoridade da pessoa, sem explicitar isso no corpo do texto.
- source_word: τοῦ μονογενοῦς υἱοῦ
  choice: do Filho único
  rationale: μονογενής destaca a condição única e singular do Filho. “Filho único” é claro e atual; a nota registra a tradução tradicional “unigênito”.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Tradução direta do genitivo que identifica Deus como Pai do Filho mencionado.
theological_decisions:
- issue: Sentido de κρίνω nas duas ocorrências
  choice: julgado
  alternative: condenado
  rationale: O contexto de João 3:17–19 permite entender o julgamento como condenação, mas o verbo grego é mais amplo. O texto principal preserva essa amplitude, e a nota apresenta a leitura contextual mais específica.
- issue: Tradução de μονογενής
  choice: Filho único
  alternative: Filho unigênito; Filho singular
  rationale: A tradução ressalta a singularidade incomparável do Filho sem introduzir no corpo do texto uma ideia biológica que o termo grego não exige. A forma tradicional é preservada em nota por sua importância histórica e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Quem crê” e “quem não crê” evitam rigidez desnecessária; “Filho” recebe inicial maiúscula por clareza referencial e uso bíblico corrente. Os marcadores [a] e [b] aparecem junto aos termos a que suas notas se referem.
