  text: καὶ ἦλθον πρὸς τὸν Ἰωάννην καὶ εἶπαν αὐτῷ· Ῥαββί, ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου, ᾧ σὺ μεμαρτύρηκας, ἴδε οὗτος βαπτίζει καὶ πάντες ἔρχονται πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/026.yaml
  text: And they came to John and said to him[a], “Rabbi, the one who was with you beyond the Jordan, to whom you have borne witness—look, he is baptizing[b], and everyone is going to him.”
translation:
  language: pt
  text: 'Eles foram até João e lhe disseram: “Rabi, aquele que estava com você do outro lado do Jordão, a respeito de quem você deu testemunho[a] — veja, ele está batizando[b], e todos estão indo até ele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a quem você deu testemunho”. A construção grega com o dativo admite as duas formas de entender a relação.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “esse está batizando”. O demonstrativo grego pode dar à fala um tom mais incisivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πρὸς τὸν Ἰωάννην
  choice: foram até João
  rationale: ἔρχομαι pode ser traduzido por ‘ir’ ou ‘vir’, conforme o ponto de vista. Em português narrativo, ‘foram até João’ expressa naturalmente o movimento de aproximação.
- source_word: εἶπαν αὐτῷ
  choice: lhe disseram
  rationale: A forma introduz discurso direto; ‘lhe disseram’ é natural, clara e mantém o destinatário explícito.
- source_word: Ῥαββί
  choice: Rabi
  rationale: A transliteração tradicional preserva o título judaico e o cenário do Evangelho; ‘Mestre’ seria uma explicação possível, mas menos transparente ao termo grego.
- source_word: ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου
  choice: aquele que estava com você do outro lado do Jordão
  rationale: ‘Aquele que’ traduz o relativo de modo idiomático, e ‘do outro lado do Jordão’ comunica com clareza a expressão geográfica πέραν τοῦ Ἰορδάνου.
- source_word: ᾧ σὺ μεμαρτύρηκας
  choice: a respeito de quem você deu testemunho
  rationale: A construção com o dativo admite referência à pessoa sobre quem João testemunhou. ‘Deu testemunho’ preserva o vocabulário recorrente de testemunho em João, e o perfeito grego é expresso naturalmente pelo pretérito perfeito português, cujo resultado continua relevante no contexto.
- source_word: ἴδε
  choice: veja
  rationale: Funciona como chamado de atenção em linguagem atual e digna, sem o tom arcaico de ‘eis’ ou ‘eis que’.
- source_word: οὗτος
  choice: ele
  rationale: ‘Ele’ é a formulação mais natural no corpo do texto português. A força mais explícita e possivelmente incisiva do demonstrativo grego é preservada em nota.
- source_word: βαπτίζει
  choice: está batizando
  rationale: A perífrase progressiva comunica a atividade em andamento relatada pelos discípulos.
- source_word: πάντες
  choice: todos
  rationale: ‘Todos’ preserva a generalização retórica da queixa, sem exigir que seja entendida como afirmação matematicamente exaustiva.
- source_word: ἔρχονται πρὸς αὐτόν
  choice: estão indo até ele
  rationale: A formulação expressa o movimento das pessoas em direção a Jesus segundo a perspectiva de quem fala e concorda naturalmente com ‘todos’.
theological_decisions:
- issue: Vocabulário joanino de testemunho
  choice: deu testemunho
  alternative: testemunhou
  rationale: A locução ‘dar testemunho’ mantém de forma clara e reconhecível o motivo teológico recorrente de μαρτυρέω no Evangelho de João, sem acrescentar uma interpretação denominacional.
- issue: Referente do testemunho no dativo ᾧ
  choice: a respeito de quem
  alternative: a quem
  rationale: O dativo grego pode ser entendido como a pessoa sobre quem se testemunhou ou aquela a quem o testemunho foi dado. O texto principal adota a leitura contextual mais natural em português, enquanto a nota conserva a alternativa genuína.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento ‘você’ favorece clareza contemporânea sem perder dignidade. A fala mantém o tom de preocupação ou rivalidade dos discípulos de João, mas evita intensificá-lo além do que o demonstrativo grego permite.
