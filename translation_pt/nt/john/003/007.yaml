base_translation:
  language: en
  yaml_path: translation/nt/john/003/007.yaml
  text: Do not be amazed that I told you[b][a], ‘You must be born from above.’
translation:
  language: pt
  text: 'Não se admire de eu lhe[b] ter dito: “É necessário que vocês nasçam do alto[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nasçam de novo”. O grego ἄνωθεν pode significar “do alto” ou “de novo/novamente”.'
    reason: alternative_reading
  - marker: b
    text: “Lhe” está no singular, mas “vocês” está no plural no grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάσῃς
  choice: Não fique admirado
  rationale: A construção com μή e o subjuntivo aoristo expressa uma proibição. A formulação é natural em português atual e preserva a ideia de espanto de θαυμάζω.
- source_word: ὅτι
  choice: por
  rationale: Neste contexto, ὅτι introduz aquilo que poderia causar admiração; em português, “por eu ter dito” expressa essa relação de modo natural, sem alterar o conteúdo da fala.
- source_word: εἶπόν σοι
  choice: eu ter dito a você
  rationale: Preserva o destinatário singular indicado por σοι e soa natural em português amplamente compreensível.
- source_word: Δεῖ
  choice: É necessário
  rationale: Δεῖ indica necessidade. “É necessário” conserva sua força e permite que o plural de ὑμᾶς fique explícito em “vocês”.
- source_word: ὑμᾶς
  choice: vocês
  rationale: O pronome grego é plural, em contraste com o σοι singular anterior. “Vocês” torna essa distinção visível no texto principal.
- source_word: γεννηθῆναι
  choice: nasçam
  rationale: O infinitivo passivo de γεννάω refere-se aqui a nascer. A construção portuguesa “é necessário que vocês nasçam” é idiomática e mantém o sentido passivo sem recorrer a “ser dados à luz”, que seria inadequado ao contexto.
- source_word: ἄνωθεν
  choice: do alto
  rationale: ἄνωθεν pode significar “do alto” ou “de novo”. “Do alto” preserva a ênfase joanina na origem celestial, enquanto a outra leitura genuína é registrada em nota.
theological_decisions:
- issue: Sentido de ἄνωθεν na declaração sobre o novo nascimento
  choice: do alto
  alternative: de novo; novamente
  rationale: O termo admite intencionalmente mais de um sentido no diálogo de João 3. O uso joanino e a ênfase na origem divina favorecem “do alto” no texto principal, mas a leitura “de novo” não deve ser eliminada e aparece em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A alternância entre “a você” e “vocês” explicita no próprio texto a mudança do singular para o plural; a nota confirma o dado gramatical. A ambiguidade de ἄνωθεν é preservada por meio da nota.
