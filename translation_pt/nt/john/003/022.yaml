reference: John 3:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὴν Ἰουδαίαν γῆν, καὶ ἐκεῖ διέτριβεν μετ’ αὐτῶν καὶ ἐβάπτιζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/022.yaml
  text: After these things[a], Jesus and his disciples went into the land of Judea[c][b], and there he was spending time with them and baptizing.
translation:
  language: pt
  text: Depois disso, Jesus e seus discípulos foram para a região da Judeia, e ali ele passava algum tempo com eles e batizava.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: João 4:2 esclarece que não era o próprio Jesus quem batizava, mas seus discípulos.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Depois disso
  rationale: Expressa naturalmente em português a transição temporal e a sequência narrativa, sem perder o valor do plural idiomático grego.
- source_word: ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: Jesus foi com seus discípulos
  rationale: Embora ἦλθεν possa ser vertido literalmente por “veio”, “foi” é natural diante do destino explícito. A formulação portuguesa comunica que Jesus e os discípulos se deslocaram juntos, preservando Jesus como sujeito principal.
- source_word: εἰς τὴν Ἰουδαίαν γῆν
  choice: para a região da Judeia
  rationale: γῆ designa aqui a terra ou região da Judeia, provavelmente em contraste com Jerusalém. “Região da Judeia” é claro e natural, sem restringir indevidamente o sentido a uma área rural.
- source_word: διέτριβεν μετ’ αὐτῶν
  choice: permaneceu algum tempo com eles
  rationale: Comunica o valor durativo do imperfeito e o sentido de passar ou permanecer algum tempo num lugar. O contexto já fornece “Ali”.
- source_word: ἐβάπτιζεν
  choice: batizava
  rationale: Mantém o verbo religioso convencional sem definir o modo do rito. O imperfeito português preserva a ação continuada, e o sujeito gramatical continua sendo Jesus.
theological_decisions:
- issue: Sujeito de “batizava” à luz de João 4:2
  choice: Manter Jesus como sujeito gramatical de “batizava” no texto principal.
  alternative: Reformular o texto para dizer diretamente que os discípulos batizavam.
  rationale: A sintaxe de João 3:22 atribui gramaticalmente a ação a Jesus, enquanto João 4:2 esclarece que ele não realizava pessoalmente os batismos. A tradução preserva essa relação narrativa em vez de antecipar a explicação posterior.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Região da Judeia” evita tanto o caráter potencialmente arcaico de “terra da Judeia” quanto a especificidade não explícita de “zona rural”. A divisão em duas frases favorece a leitura sem alterar a estrutura narrativa.
