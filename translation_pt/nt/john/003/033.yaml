  text: ὁ λαβὼν αὐτοῦ τὴν μαρτυρίαν ἐσφράγισεν ὅτι ὁ θεὸς ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/033.yaml
  text: Whoever has received his testimony has certified that God is true[a].
translation:
  language: pt
  text: Quem recebeu o testemunho dele atestou que Deus é verdadeiro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “pôs seu selo em que Deus é verdadeiro”.'
    reason: alternativa lexical que preserva a metáfora de ἐσφράγισεν
lexical_decisions:
- source_word: ὁ λαβὼν
  choice: Quem recebeu
  rationale: O artigo com o particípio aoristo tem função substantivada e sentido genérico. “Quem recebeu” é natural em português e conserva o aspecto de ação concluída em relação ao verbo principal.
- source_word: αὐτοῦ
  choice: dele
  rationale: O pronome remete naturalmente àquele que vem do céu, cujo testemunho está em foco no contexto. “Dele” evita acrescentar uma identificação não expressa no versículo.
- source_word: τὴν μαρτυρίαν
  choice: o testemunho
  rationale: “Testemunho” preserva tanto o sentido usual de μαρτυρία quanto o motivo jurídico-testemunhal característico de João.
- source_word: ἐσφράγισεν
  choice: atestou
  rationale: O verbo significa literalmente pôr um selo e, metaforicamente, confirmar ou certificar. “Atestou” comunica de modo claro o valor da metáfora; a imagem literal é preservada em nota.
- source_word: ὅτι
  choice: que
  rationale: Aqui ὅτι introduz o conteúdo da afirmação, não uma causa.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: O substantivo definido é vertido diretamente, sem expansão interpretativa.
- source_word: ἀληθής
  choice: verdadeiro
  rationale: “Verdadeiro” conserva a amplitude do termo, que neste contexto inclui a ideia de que Deus diz a verdade e é digno de confiança.
theological_decisions:
- issue: Força metafórica da linguagem do selo
  choice: Usar “atestou” no texto principal
  alternative: “pôs o seu selo, confirmando” ou “confirmou”
  rationale: Receber o testemunho equivale a confirmar que Deus é verdadeiro. “Atestou” expressa essa força sem tornar obscura a metáfora antiga, enquanto a nota registra a formulação literal.
- issue: Referente de αὐτοῦ
  choice: Manter apenas “dele”
  alternative: Explicitar “de Jesus” ou “do Filho”
  rationale: O contexto identifica o referente, mas o grego deste versículo emprega somente o pronome. A tradução preserva essa forma sem inserir uma identificação teológica explícita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a concisão do grego e preserva na nota a imagem cultural do selo.
