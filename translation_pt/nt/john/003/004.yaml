id: JHN.3.4
reference: John 3:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ⸀ὁ Νικόδημος· Πῶς δύναται ἄνθρωπος γεννηθῆναι γέρων ὤν; μὴ δύναται εἰς τὴν κοιλίαν τῆς μητρὸς αὐτοῦ δεύτερον εἰσελθεῖν καὶ γεννηθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/004.yaml
  text: Nicodemus said to him[a], “How can a man be born when he is old? He cannot enter his mother’s womb a second time and be born[b], can he?”
translation:
  language: pt
  text: 'Nicodemos lhe disse: “Como pode um homem[a] nascer quando já é velho? Ele não pode entrar uma segunda vez no ventre de sua mãe e nascer[b], pode?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma pessoa”. O grego diz “um homem”, empregando o masculino singular em sentido genérico.'
    reason: lexical_alternative
  - marker: b
    text: A expressão grega é “uma segunda vez”; Nicodemos entende as palavras de Jesus em sentido literal.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει πρὸς αὐτὸν
  choice: lhe disse
  rationale: Embora λέγει esteja no presente, trata-se do presente histórico frequente na narrativa de João. O pretérito é a forma narrativa natural em português.
- source_word: Πῶς δύναται
  choice: Como pode
  rationale: Equivalente idiomático e direto para uma pergunta sobre possibilidade.
- source_word: ἄνθρωπος
  choice: um homem
  rationale: Mantém o substantivo masculino singular do grego, empregado aqui com sentido genérico e representativo.
- source_word: γεννηθῆναι
  choice: nascer
  rationale: Neste contexto, o infinitivo passivo de γεννάω se refere ao nascimento. Não se acrescenta aqui a ideia de “de novo”, pois ela é expressa separadamente por δεύτερον.
- source_word: γέρων ὤν
  choice: quando já é velho
  rationale: A oração temporal comunica naturalmente em português a circunstância do particípio; “já” ressalta, sem exagero, o contraste entre velhice e nascimento.
- source_word: μὴ δύναται
  choice: Será que pode
  rationale: A pergunta introduzida por μή espera resposta negativa. Em português, “Será que pode...?” preserva a incredulidade sem transformar a pergunta em afirmação categórica.
- source_word: κοιλίαν τῆς μητρὸς αὐτοῦ
  choice: ventre de sua mãe
  rationale: Com a referência à mãe, κοιλία designa claramente o ventre materno; esta é uma expressão corrente e digna em português.
- source_word: δεύτερον
  choice: uma segunda vez
  rationale: Traduz explicitamente o valor ordinal do grego e torna evidente a compreensão literal de Nicodemos.
- source_word: εἰσελθεῖν καὶ γεννηθῆναι
  choice: entrar ... e nascer
  rationale: Conserva os dois infinitivos coordenados e a lógica vívida da pergunta de Nicodemos.
theological_decisions:
- issue: Tradução do masculino genérico ἄνθρωπος
  choice: um homem
  alternative: alguém; uma pessoa
  rationale: O grego emprega um masculino singular com força genérica. “Um homem” preserva a forma representativa da expressão sem restringir necessariamente sua aplicação ao sexo masculino.
- issue: Possível importação do sentido de ἄνωθεν, em João 3:3, para γεννηθῆναι neste versículo
  choice: nascer ... uma segunda vez
  alternative: nascer de novo
  rationale: Este versículo traz δεύτερον, “uma segunda vez”, e registra a interpretação literal de Nicodemos. A tradução não antecipa nem resolve a ambiguidade de ἄνωθεν no versículo anterior.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Nicodemos”, “ventre” e a construção interrogativa são formas correntes. O presente histórico grego foi vertido pelo pretérito narrativo, e a pergunta com μή foi mantida como pergunta marcada por incredulidade.
