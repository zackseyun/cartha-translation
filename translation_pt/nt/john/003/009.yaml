  text: ἀπεκρίθη Νικόδημος καὶ εἶπεν αὐτῷ· Πῶς δύναται ταῦτα γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/009.yaml
  text: Nicodemus answered and said to him[a], “How can these things happen?”
translation:
  language: pt
  text: 'Nicodemos respondeu e lhe disse: “Como podem acontecer essas coisas?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: O aoristo depoente de ἀποκρίνομαι exerce a função narrativa habitual de introduzir uma resposta em diálogo; “respondeu” é natural e fiel.
- source_word: Νικόδημος
  choice: Nicodemos
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: εἶπεν αὐτῷ
  choice: lhe disse
  rationale: Reproduz o sentido de “disse a ele” de modo idiomático, mantendo o referente pronominal sem inserir explicitamente o nome de Jesus.
- source_word: Πῶς
  choice: Como
  rationale: Equivalente interrogativo direto, que pergunta pela maneira ou possibilidade.
- source_word: δύναται
  choice: podem
  rationale: Expressa capacidade ou possibilidade; o plural em português faz concordância natural com “essas coisas”, embora o verbo grego esteja no singular por concordar com o infinitivo/evento concebido como unidade.
- source_word: ταῦτα
  choice: essas coisas
  rationale: Preserva o plural do demonstrativo e aponta naturalmente, em português, para os assuntos que Jesus acabou de mencionar.
- source_word: γενέσθαι
  choice: acontecer
  rationale: 'Comunica de forma natural o sentido eventivo de γίνομαι: ocorrer ou vir a realizar-se, sem explicar como isso se dá.'
theological_decisions:
- issue: A pergunta de Nicodemos sobre as realidades anteriormente descritas
  choice: Como podem acontecer essas coisas?
  alternative: Como podem ser essas coisas? / Como essas coisas podem vir a acontecer?
  rationale: “Acontecer” equilibra naturalidade e o sentido de ocorrência ou realização de γενέσθαι, preservando o caráter interrogativo e a tensão teológica sem explicar nem resolver o mistério apresentado por Jesus.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A construção “respondeu e lhe disse” conserva a dupla formulação semítica refletida no grego, embora seja mais marcada do que o simples “respondeu” em português corrente.
