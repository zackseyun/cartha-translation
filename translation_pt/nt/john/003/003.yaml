id: JHN.3.3
reference: John 3:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/003.yaml
  text: Jesus answered and said to him, “Truly, truly, I say to you, unless someone is born from above,[a] he is not able to see the kingdom of God.”
translation:
  language: pt
  text: 'Jesus lhe respondeu: “Em verdade, em verdade lhe digo: se alguém não nascer do alto,[a] não pode ver o reino de Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de novo”. O advérbio grego pode significar tanto “do alto” como “de novo”; o diálogo no versículo seguinte explora esse duplo sentido.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Jesus lhe respondeu
  rationale: A expressão portuguesa comunica naturalmente a resposta dirigida a Nicodemos. A coordenação grega literalmente traz ‘respondeu e disse’, mas reproduzi-la seria redundante e pouco natural em português.
- source_word: Ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Preserva a repetição enfática e solene da fórmula de Jesus em linguagem clara e tradicionalmente reconhecível.
- source_word: ἐὰν μή τις
  choice: se alguém não
  rationale: Expressa de modo natural a condição negativa e o caráter genérico do pronome indefinido.
- source_word: γεννηθῇ
  choice: nascer
  rationale: Traduz o passivo de γεννάω adequadamente no português idiomático; a construção com ‘alguém’ e o infinitivo após ‘se’ conserva o sentido sem inserir ‘de novo’ no próprio verbo.
- source_word: ἄνωθεν
  choice: do alto
  rationale: O uso joanino e o contraste entre o celestial e o terreno favorecem ‘do alto’, enquanto a acepção também possível ‘de novo’ é preservada em nota.
- source_word: οὐ δύναται
  choice: não pode
  rationale: É a forma portuguesa direta e natural de expressar a incapacidade indicada pelo grego.
- source_word: ἰδεῖν
  choice: ver
  rationale: Mantém o equivalente lexical direto e não elimina a possível amplitude entre percepção e participação.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: o reino de Deus
  rationale: Formulação corrente e precisa, capaz de conservar as dimensões de domínio e esfera do reinado divino.
theological_decisions:
- issue: Sentido de ἄνωθεν na declaração de Jesus
  choice: do alto
  alternative: de novo; novamente
  rationale: O advérbio é genuinamente polissêmico. ‘Do alto’ se harmoniza com o tema joanino da origem celestial, enquanto a reação de Nicodemos no versículo seguinte depende da acepção ‘de novo’. A nota conserva esse jogo de sentidos sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A colocação pronominal em ‘lhe respondeu’ e ‘lhe digo’ é natural no registro bíblico contemporâneo sem soar excessivamente arcaica.
