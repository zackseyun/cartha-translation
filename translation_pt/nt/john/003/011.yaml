source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι ὅτι ὃ οἴδαμεν λαλοῦμεν καὶ ὃ ἑωράκαμεν μαρτυροῦμεν, καὶ τὴν μαρτυρίαν ἡμῶν οὐ λαμβάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/011.yaml
  text: Truly[a], truly, I tell you, we speak what we know and testify to what we have seen[c][b], and you do not receive our testimony.
translation:
  language: pt
  text: 'Em verdade[a], em verdade, lhe digo: falamos o que sabemos e damos testemunho do que vimos; e vocês não recebem[b] nosso[c] testemunho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Amém, amém”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não aceitam”.'
    reason: lexical_alternative
  - marker: c
    text: O texto grego repete as formas “nós” e “nosso”; não fica explícito quem, além de Jesus, está incluído.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Preserva a duplicação enfática da fórmula solene e comunica seu sentido em português natural, deixando a forma transliterada como alternativa em nota.
- source_word: λέγω σοι
  choice: lhe digo
  rationale: Expressa de modo corrente a fala direta no singular; o contexto identifica Nicodemos como destinatário.
- source_word: ὅτι
  choice: ':'
  rationale: Os dois-pontos introduzem naturalmente, em português, o conteúdo da declaração, sem transformar ὅτι em uma oração causal.
- source_word: ὃ οἴδαμεν
  choice: do que sabemos
  rationale: A construção idiomática preserva o objeto neutro do conhecimento e se coordena naturalmente com o verbo falar.
- source_word: λαλοῦμεν
  choice: falamos
  rationale: O presente simples reproduz adequadamente a força declarativa da forma grega.
- source_word: ὃ ἑωράκαμεν
  choice: do que vimos
  rationale: O pretérito perfeito é a forma portuguesa natural para uma percepção passada relevante ao testemunho presente; a continuidade de seus efeitos fica implícita no contexto.
- source_word: μαρτυροῦμεν
  choice: damos testemunho
  rationale: Mantém a ligação lexical e temática com μαρτυρία e é uma expressão clara e digna em português contemporâneo.
- source_word: τὴν μαρτυρίαν ἡμῶν
  choice: o nosso testemunho
  rationale: Conserva o substantivo testemunhal e, sobretudo, o plural explícito sem identificar interpretativamente o grupo abrangido.
- source_word: οὐ λαμβάνετε
  choice: vocês não recebem
  rationale: Preserva o verbo joanino 'receber'; uma nota registra 'aceitam' como alternativa contextual. O plural 'vocês' torna visível o número da forma grega.
- source_word: καὶ ... καὶ
  choice: e ... e
  rationale: Mantém diretamente a coordenação grega e evita acrescentar uma força adversativa explícita que o texto não lexicaliza.
theological_decisions:
- issue: Primeira pessoa do plural em οἴδαμεν, λαλοῦμεν, ἑωράκαμεν, μαρτυροῦμεν e ἡμῶν
  choice: Conservar “falamos”, “sabemos”, “vimos”, “damos testemunho” e “nosso” sem definir o referente.
  alternative: Interpretar o plural como Jesus e seus discípulos, como plural retórico, ou como referência mais ampla ao testemunho celestial/divino.
  rationale: O grego usa reiteradamente a primeira pessoa do plural, mas não identifica aqui, de forma inequívoca, todos os incluídos. A tradução preserva essa tensão.
- issue: Número do destinatário em λέγω σοι e λαμβάνετε
  choice: Traduzir σοι no singular como “lhe” e λαμβάνετε no plural como “vocês”.
  alternative: Uniformizar a fala como dirigida apenas a Nicodemos ou tornar ambos os pronomes numericamente ambíguos.
  rationale: A mudança do singular para o plural é explícita no grego e pode ser significativa; por isso, deve permanecer perceptível em português.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “vocês” para marcar inequivocamente o plural de λαμβάνετε e “lhe” para o singular de σοι. A pontuação favorece a leitura oral sem apagar a coordenação do original.
