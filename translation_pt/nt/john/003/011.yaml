- from: 'Em verdade[a], em verdade lhe digo: falamos do que sabemos e damos testemunho do que vimos; e vocês não recebem[b] o nosso testemunho.[c]'
  to: 'Em verdade[a], em verdade, lhe digo: falamos o que sabemos e damos testemunho do que vimos; e vocês não recebem[b] nosso[c] testemunho.'
  rationale: A revisão substitui «falamos do que sabemos» por «falamos o que sabemos», evitando a possível leitura temática introduzida por «de» e refletindo com maior proximidade a relação sintática do relativo grego. Também ajusta a pontuação da fórmula introdutória e move a âncora da nota interpretativa para «nosso», sem resolver o referente debatido do plural.
