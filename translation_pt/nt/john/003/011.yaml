review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva a fórmula enfática, a alternância entre o destinatário singular em «lhe digo» e o plural em «vocês não recebem», o plural não especificado de «falamos/damos testemunho/nosso», e a coordenação final com «e». Contudo, «falamos do que sabemos» pode sugerir que o conteúdo da fala é acerca do que se sabe, ao passo que o relativo neutro grego funciona diretamente como objeto de «falamos»: «falamos o que sabemos».'
  naturalness: O registro é moderno, claro e apropriado. A vírgula depois da segunda ocorrência de «em verdade» melhora a cadência da fórmula em português. A realocação da nota sobre o plural para «nosso» torna seu escopo imediatamente claro.
  terminology: «Em verdade», «damos testemunho», «recebem» e «testemunho» são escolhas adequadas e mantêm tanto a solenidade quanto a conexão lexical entre μαρτυροῦμεν e μαρτυρίαν. «Recebem» preserva de modo útil o vocabulário joanino de λαμβάνετε, com «aceitam» devidamente registrado como alternativa.
  issues:
  - severity: low
    issue: «Falamos do que sabemos» é levemente ambíguo.
    rationale: Em português, «falar de» normalmente significa falar acerca de algo. O grego ὃ οἴδαμεν λαλοῦμεν apresenta «o que sabemos» como objeto do falar; «falamos o que sabemos» o representa mais diretamente.
  - severity: low
    issue: A nota sobre o plural está ancorada depois de «testemunho», não no elemento possessivo que torna o plural mais visível.
    rationale: Ancorá-la em «nosso» melhora a precisão editorial, pois a nota explica quem pode estar incluído no «nós/nosso» reiterado no grego.
  revised_text: 'Em verdade[a], em verdade, lhe digo: falamos o que sabemos e damos testemunho do que vimos; e vocês não recebem[b] nosso[c] testemunho.'
