id: JHN.3.19
reference: John 3:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ κρίσις ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ ἠγάπησαν οἱ ἄνθρωποι μᾶλλον τὸ σκότος ἢ τὸ φῶς, ἦν γὰρ ⸂αὐτῶν πονηρὰ⸃ τὰ ἔργα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/019.yaml
  text: 'And this is the judgment: that the light has come into the world[a], and people loved the darkness rather than the light, because their works were evil.'
translation:
  language: pt
  text: 'O julgamento é este: a luz veio ao mundo, e as pessoas amaram mais as trevas do que a luz, porque suas obras eram más.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίσις
  choice: julgamento
  rationale: Preserva o sentido amplo de avaliação judicial e sua consequência, sem restringi-lo antecipadamente a “condenação” ou “veredito”.
- source_word: τὸ φῶς
  choice: a luz
  rationale: Mantém a metáfora joanina e não explicita no texto o referente cristológico além do que o grego diz.
- source_word: ἐλήλυθεν
  choice: veio
  rationale: Em português natural, o pretérito perfeito comunica a chegada consumada da luz; “tem vindo” sugeriria repetição ou processo continuado.
- source_word: κόσμον
  choice: mundo
  rationale: Equivalente corrente que preserva a amplitude característica do uso joanino.
- source_word: ἠγάπησαν
  choice: amaram
  rationale: Conserva a força moral de ἀγαπάω e sua ligação lexical com o tema do amor, em vez de reduzi-lo a simples preferência.
- source_word: οἱ ἄνθρωποι
  choice: as pessoas
  rationale: Expressa naturalmente em português moderno a referência à humanidade em geral, não apenas aos homens do sexo masculino.
- source_word: μᾶλλον ... ἢ
  choice: mais ... do que
  rationale: Reproduz de modo idiomático a comparação explícita do grego e combina naturalmente com “amaram”.
- source_word: τὸ σκότος
  choice: as trevas
  rationale: Mantém a metáfora tradicional e a oposição simbólica com “a luz”.
- source_word: πονηρὰ
  choice: más
  rationale: Comunica a qualidade moral negativa das obras em português claro e direto.
- source_word: τὰ ἔργα
  choice: as suas obras
  rationale: Preserva a correspondência formal com ἔργα e o vocabulário teológico joanino; o possessivo torna clara a relação com “as pessoas”.
theological_decisions:
- issue: Referente de “a luz”
  choice: Manter a metáfora “a luz” sem explicitar o referente no texto principal.
  alternative: Traduzir interpretativamente como “Jesus” ou usar “a Luz” como título explícito.
  rationale: O contexto associa fortemente a luz ao Filho, mas o versículo emprega uma metáfora; conservá-la preserva a textura e a tensão teológica joaninas.
- issue: Sentido de κρίσις
  choice: “julgamento”
  alternative: “condenação” ou “veredito”
  rationale: “Julgamento” mantém a amplitude do termo, que aqui pode abranger tanto a avaliação decisiva quanto seu resultado condenatório, sem resolver essa relação além do texto.
- issue: Força genérica de οἱ ἄνθρωποι
  choice: “as pessoas”
  alternative: “os homens” ou “a humanidade”
  rationale: O referente é humano em sentido geral. “As pessoas” é inclusivo, preciso e mais natural no português contemporâneo; “a humanidade” tornaria a formulação mais abstrata.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A conjunção “mas” verte καί de forma contextual para tornar explícito o contraste discursivo entre a vinda da luz e a reação humana. Não há marcadores de nota porque nenhuma nota é necessária para esta redação.
