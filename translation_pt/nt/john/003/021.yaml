id: JHN.3.21
reference: John 3:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ποιῶν τὴν ἀλήθειαν ἔρχεται πρὸς τὸ φῶς, ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα ὅτι ἐν θεῷ ἐστιν εἰργασμένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/021.yaml
  text: But the one who does the truth comes to the light[a], so that his works may be revealed[d][c][b], because they have been done in God.
translation:
  language: pt
  text: Mas quem pratica a verdade vem para a luz, a fim de que as suas obras sejam manifestadas, pois foram realizadas em Deus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «faz a verdade». Também pode ser traduzido por «faz o que é verdadeiro».
    reason: lexical_alternative
  - marker: b
    text: 'A frase também pode ser entendida assim: «para que seja manifesto que as suas obras foram realizadas em Deus». «Em Deus» pode ainda ter o sentido de «por Deus» ou «mediante Deus».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ ποιῶν τὴν ἀλήθειαν
  choice: Mas quem pratica a verdade
  rationale: O particípio presente substantivado descreve a pessoa caracterizada por essa conduta, e δέ marca contraste com o versículo anterior. «Pratica a verdade» comunica em português natural o idioma sem reduzir a verdade à mera exatidão factual.
- source_word: ἔρχεται πρὸς τὸ φῶς
  choice: vem para a luz
  rationale: Preserva o movimento expresso por πρὸς e a metáfora joanina de aproximar-se da luz.
- source_word: ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα
  choice: a fim de que as suas obras sejam manifestadas
  rationale: Mantém a nuance de finalidade de ἵνα, a voz passiva e a referência ampla de ἔργα.
- source_word: ὅτι
  choice: pois
  rationale: Interpreta a conjunção como causal, leitura natural no contexto imediato, sem ocultar em nota a possibilidade de que introduza o conteúdo do que é manifestado.
- source_word: ἐν θεῷ ἐστιν εἰργασμένα
  choice: foram realizadas em Deus
  rationale: «Em Deus» conserva a abertura semântica de ἐν θεῷ. «Foram realizadas» representa o perfeito passivo perifrástico com resultado presente, em português claro e digno.
theological_decisions:
- issue: Sentido de ποιῶν τὴν ἀλήθειαν
  choice: pratica a verdade
  alternative: faz a verdade; faz o que é verdadeiro
  rationale: A formulação escolhida é natural em português e conserva a ideia joanina de verdade posta em ação, sem tratá-la apenas como crença ou correção factual.
- issue: Função de ὅτι
  choice: 'causa: «pois»'
  alternative: 'conteúdo: «que foram realizadas em Deus»'
  rationale: A construção admite tanto uma explicação causal quanto o conteúdo da manifestação. O texto principal adota a leitura causal por sua fluidez, e a nota preserva a alternativa legítima.
- issue: Nuance de ἐν θεῷ
  choice: em Deus
  alternative: por Deus; mediante Deus
  rationale: A expressão pode envolver esfera, relação ou agência divina. A tradução formal evita decidir uma nuance que o grego deixa aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Pratica a verdade» evita uma construção excessivamente estranha, enquanto as notas conservam a forma literal e as ambiguidades reais de ὅτι e ἐν θεῷ.
