  text: ἦν δὲ καὶ ⸀ὁ Ἰωάννης βαπτίζων ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ, ὅτι ὕδατα πολλὰ ἦν ἐκεῖ, καὶ παρεγίνοντο καὶ ἐβαπτίζοντο·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/023.yaml
  text: John also was baptizing at Aenon near Salim[a], because there were many waters there[b], and people were coming and being baptized.
translation:
  language: pt
  text: João também estava batizando em Enom, perto de Salim, porque havia ali muitas águas[a], e as pessoas vinham e eram batizadas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque havia ali muita água”; literalmente, “porque havia ali muitas águas”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido por “batizando” e “batizadas” também pode ser vertido por “imergindo” e “imersas”. Conserva-se “batizar” como termo estabelecido, sem que isso, por si só, determine o modo do rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ καὶ
  choice: também estava
  rationale: δέ marca uma transição leve, que pode permanecer implícita em português; καί é representado por “também”, e ἦν com o particípio forma uma construção de ação contínua no passado.
- source_word: ὁ Ἰωάννης
  choice: João
  rationale: O artigo diante do nome próprio é idiomático em grego e não exige tradução; não se acrescenta “Batista”, ausente do texto.
- source_word: βαπτίζων
  choice: estava batizando
  rationale: O particípio presente com ἦν expressa atividade contínua no passado. “Batizando” mantém o termo cristão consagrado sem decidir, por si só, o modo do rito.
- source_word: ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ
  choice: em Enom, perto de Salim
  rationale: Usam-se as formas tradicionais e reconhecíveis dos topônimos em português; ἐγγύς com genitivo indica proximidade.
- source_word: ὅτι ὕδατα πολλὰ ἦν ἐκεῖ
  choice: porque havia ali muitas águas
  rationale: ὅτι tem sentido causal. A tradução conserva o plural concreto ὕδατα πολλὰ e sua possível referência a várias fontes ou correntes, enquanto a nota oferece a formulação idiomática “muita água”.
- source_word: παρεγίνοντο
  choice: as pessoas vinham
  rationale: O imperfeito indica chegada contínua ou repetida. O sujeito “as pessoas” é suprido naturalmente em português, pois o grego deixa o sujeito plural implícito.
- source_word: ἐβαπτίζοντο
  choice: eram batizadas
  rationale: O imperfeito passivo indica que elas recebiam o batismo de modo contínuo ou repetido.
theological_decisions:
- issue: Tradução de βαπτίζω
  choice: batizando / eram batizadas
  alternative: imersando / eram imersas
  rationale: No Novo Testamento, o verbo funciona como termo religioso reconhecido. “Batizar” preserva essa continuidade lexical e não transforma a tradução em afirmação denominacional sobre o modo do rito; a alternativa lexical é registrada em nota.
- issue: Plural ὕδατα πολλὰ
  choice: muitas águas
  alternative: muita água
  rationale: O plural do grego é preservado no texto para não eliminar a possibilidade de várias fontes, poços ou correntes; a alternativa idiomática permanece disponível na nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem é natural em português, e o ponto e vírgula separa com clareza a explicação do local da ação contínua das pessoas.
