lexical_decisions:
- source_word: οὔπω
  choice: ainda não
  rationale: Expressa de modo natural que, até aquele ponto da narrativa, o acontecimento não havia ocorrido.
- source_word: γὰρ
  choice: pois
  rationale: Introduz uma explicação contextual e preserva a relação explicativa sem torná-la causal demais.
- source_word: ἦν βεβλημένος
  choice: tinha sido lançado
  rationale: Reproduz a construção perifrástica passiva com valor de anterioridade; «lançado» conserva a força de βάλλω e é idiomático neste contexto.
- source_word: εἰς τὴν φυλακήν
  choice: na prisão
  rationale: Em português, «lançado na prisão» é a formulação natural para o movimento que resulta em encarceramento; φυλακή designa aqui prisão ou encarceramento.
- source_word: ὁ Ἰωάννης
  choice: João
  rationale: O texto grego traz apenas o nome João; sua identificação como João Batista é dada pelo contexto e esclarecida em nota.
theological_decisions:
- issue: Identificação de ὁ Ἰωάννης
  choice: João
  alternative: João Batista
  rationale: Mantém no texto principal somente o que o grego explicita, sem incorporar a identificação contextual ao nome; a nota fornece o esclarecimento.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Pois» conserva a função explicativa de γάρ; «tinha sido lançado na prisão» comunica naturalmente a anterioridade e a voz passiva.
