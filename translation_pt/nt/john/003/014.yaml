id: JHN.3.14
reference: John 3:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ καθὼς Μωϋσῆς ὕψωσεν τὸν ὄφιν ἐν τῇ ἐρήμῳ, οὕτως ὑψωθῆναι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου,
base_translation:
  language: en
  yaml_path: translation/nt/john/003/014.yaml
  text: And just as Moses lifted up the serpent in the wilderness[a], so the Son of Man must be lifted up[b],
translation:
  language: pt
  text: E assim como Moisés levantou a serpente no deserto[a], também é necessário que o Filho do Homem seja levantado[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Veja Números 21:8–9, que relata como Moisés levantou a serpente no deserto.
    reason: cross_reference
  - marker: b
    text: Ou “seja exaltado”. O verbo grego pode indicar tanto ser fisicamente levantado quanto ser exaltado; em João, é provável que os dois sentidos estejam presentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: assim como
  rationale: Introduz com naturalidade a comparação direta entre a ação de Moisés e o que deve acontecer ao Filho do Homem.
- source_word: ὕψωσεν
  choice: levantou
  rationale: Expressa a elevação concreta da serpente e mantém a ligação verbal com ὑψωθῆναι na segunda parte do versículo.
- source_word: ὄφιν
  choice: serpente
  rationale: É claro em português moderno e conserva o registro bíblico da alusão a Números 21.
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: É a expressão corrente e amplamente compreensível em português para o cenário da peregrinação de Israel.
- source_word: οὕτως
  choice: também
  rationale: Completa de modo idiomático a correlação portuguesa “assim como... também”, marcando a correspondência entre os dois acontecimentos.
- source_word: ὑψωθῆναι
  choice: seja levantado
  rationale: Conserva tanto o sentido concreto de elevação quanto a possível conotação joanina de exaltação, sem limitar o texto a apenas um deles.
- source_word: δεῖ
  choice: é necessário que
  rationale: Comunica necessidade, inclusive sua dimensão divina no contexto, sem reduzi-la a mera previsão.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém o título tradicional de Jesus e suas ressonâncias bíblicas e joaninas.
theological_decisions:
- issue: Duplo sentido joanino de ὑψόω
  choice: 'Traduzir as duas ocorrências pela mesma raiz: “levantou” e “seja levantado”.'
  alternative: Traduzir a segunda ocorrência como “seja exaltado”.
  rationale: A formulação escolhida preserva o paralelo com a serpente elevada por Moisés e, ao mesmo tempo, não elimina a dimensão de exaltação associada à morte de Jesus em João.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “assim como... também” preserva claramente o paralelo, e a repetição de “levantar” reproduz a ligação lexical do grego. A pontuação final mantém a vírgula do trecho fornecido, que continua sintaticamente no versículo seguinte.
