  yaml_path: translation/nt/john/003/030.yaml
  text: He must increase[a], but I must decrease.
translation:
  language: pt
  text: É necessário que ele cresça[a], mas que eu diminua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “É necessário que aquele cresça, mas que eu diminua.”'
    reason: Alternativa que conserva o demonstrativo ἐκεῖνον; “ele” é a forma mais natural em português no contexto.
lexical_decisions:
- source_word: ἐκεῖνον
  choice: ele
  rationale: O demonstrativo acusativo funciona como sujeito lógico do infinitivo. Em português natural, “ele” retoma Jesus no contexto sem reproduzir de modo artificial “aquele”.
- source_word: δεῖ
  choice: É necessário que
  rationale: Expressa necessidade e conserva a força do grego, aplicando-se paralelamente ao crescimento de Jesus e à diminuição de João.
- source_word: αὐξάνειν
  choice: cresça
  rationale: “Crescer” é natural em português e mantém a amplitude semântica de aumento em importância, influência ou manifestação pública.
- source_word: ἐμὲ
  choice: eu
  rationale: O pronome acusativo é o sujeito lógico do infinitivo; a oração portuguesa exige a forma nominativa “eu”.
- source_word: δὲ
  choice: e que
  rationale: A segunda ocorrência de δέ estabelece contraposição. Em português, o paralelismo entre “ele” e “eu” já torna o contraste claro, e “e que” produz uma formulação proverbial mais natural sem apagar a oposição.
- source_word: ἐλαττοῦσθαι
  choice: diminua
  rationale: Preserva o paralelismo conciso com “cresça” e comunica tornar-se menor em destaque ou influência, sem especificar além do texto.
theological_decisions:
- issue: Natureza da necessidade expressa por δεῖ
  choice: Uma ordem necessária e apropriada no desenrolar da missão de Jesus e João, expressa sem explicar sua causa.
  alternative: Mera necessidade pragmática ou decreto divino explicitamente definido.
  rationale: δεῖ pode carregar a ideia de necessidade divina, mas o versículo não especifica o mecanismo. “É necessário” mantém o peso teológico e a ambiguidade do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção preserva o paralelismo e o caráter memorável da frase.
