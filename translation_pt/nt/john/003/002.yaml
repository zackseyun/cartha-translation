  to: 'Esse homem foi até Jesus à noite[a] e lhe disse: “Rabi, sabemos que o senhor veio de Deus como mestre, pois ninguém pode fazer estes sinais[b] que o senhor faz se Deus não estiver com ele[c]”.'
