  - severity: low
    issue: Formulação da nota c
    rationale: Dizer que o grego «diz literalmente “com ele”» é incompleto e pode ser impreciso, pois a cláusula é «a menos que Deus esteja com ele». A nota deve identificar a preservação da terceira pessoa.
