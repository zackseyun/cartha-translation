  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ· Ῥαββί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ ⸂δύναται ταῦτα τὰ σημεῖα⸃ ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/002.yaml
  text: This man came to him by night and said to him[a], “Rabbi, we know that you have come from God as a teacher[c][b], for no one is able to do these signs that you do unless God is with him.”
translation:
  language: pt
  text: 'Esse homem foi até Jesus à noite[a] e lhe disse: “Rabi, sabemos que o senhor veio de Deus como mestre, pois ninguém pode fazer estes sinais[b] que o senhor faz se Deus não estiver com ele[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “durante a noite”. Em João, a noite e a escuridão também podem ter valor temático ou simbólico.
    reason: lexical_alternative
  - marker: b
    text: Ou “estes sinais milagrosos”. Em João, “sinais” designa obras que apontam para além de si mesmas.
    reason: lexical_alternative
  - marker: c
    text: 'O grego conserva a terceira pessoa: “se Deus não estiver com ele”, embora Nicodemos se dirija a Jesus como “o senhor”.'
    reason: source_text_feature
lexical_decisions:
- source_word: οὗτος
  choice: Esse homem
  rationale: Retoma Nicodemos, apresentado no versículo anterior, e preserva de modo natural a força demonstrativa do grego.
- source_word: ἦλθεν πρὸς αὐτὸν
  choice: foi até Jesus
  rationale: Em português narrativo, “foi até” expressa naturalmente o movimento em direção a Jesus; o nome esclarece o referente do pronome sem alterar o sentido.
- source_word: νυκτός
  choice: à noite
  rationale: É a forma corrente e natural de expressar o genitivo de tempo, sem excluir a possível ressonância simbólica da noite no Evangelho de João.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Mantém por transliteração o título judaico presente no grego e preserva o contexto histórico.
- source_word: οἴδαμεν
  choice: sabemos
  rationale: Preserva a primeira pessoa do plural, sem decidir se Nicodemos fala em nome de um grupo específico ou usa um plural representativo.
- source_word: ἀπὸ θεοῦ ἐλήλυθας
  choice: o senhor veio da parte de Deus
  rationale: “Da parte de Deus” comunica origem e vínculo de maneira idiomática, enquanto o perfeito é expresso por uma vinda com relevância presente. Não se acrescenta o conceito mais específico de envio.
- source_word: διδάσκαλος
  choice: como mestre
  rationale: Expressa naturalmente em português a função predicativa atribuída a Jesus.
- source_word: οὐδεὶς γὰρ δύναται
  choice: pois ninguém pode
  rationale: “Pode” é a equivalência portuguesa direta e natural de δύναται neste contexto.
- source_word: ταῦτα τὰ σημεῖα
  choice: estes sinais
  rationale: Preserva o vocabulário característico de João, no qual as obras apontam para uma realidade além do próprio acontecimento.
- source_word: ποιεῖν ἃ σὺ ποιεῖς
  choice: fazer estes sinais que o senhor faz
  rationale: Mantém a repetição de ποιέω por meio de “fazer”, com uma forma respeitosa e corrente de tratamento em português.
- source_word: ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ
  choice: se Deus não estiver com ele
  rationale: Reproduz a condição e conserva a mudança do tratamento direto para a terceira pessoa presente no grego.
theological_decisions:
- issue: Sentido de σημεῖα no contexto joanino
  choice: sinais
  alternative: milagres; sinais milagrosos
  rationale: “Sinais” conserva a função teológica das obras como atos que apontam para a identidade e a missão de Jesus, sem negar seu caráter milagroso.
- issue: Mudança da segunda para a terceira pessoa na fala de Nicodemos
  choice: se Deus não estiver com ele
  alternative: se Deus não estiver com o senhor
  rationale: O grego passa do tratamento direto de Jesus para “com ele”. Manter essa mudança preserva a textura e a possível formalidade retórica da declaração.
- issue: Possível ideia de comissionamento em ἀπὸ θεοῦ ἐλήλυθας
  choice: veio da parte de Deus
  alternative: foi enviado por Deus
  rationale: A frase afirma procedência divina, mas não emprega o verbo “enviar”; por isso, a tradução evita explicitar uma noção mais forte do que a formulação deste versículo.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. Emprega-se “o senhor” como tratamento respeitoso dirigido a Jesus, sem capitalização que o transforme aqui em título divino. A ordem e as repetições do grego são preservadas quando naturais, e as possíveis ressonâncias joaninas são mantidas sem explicitação excessiva.
