id: JHN.3.32
reference: John 3:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ὃ ἑώρακεν καὶ ἤκουσεν τοῦτο μαρτυρεῖ, καὶ τὴν μαρτυρίαν αὐτοῦ οὐδεὶς λαμβάνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/032.yaml
  text: What he has seen and heard[a], this he testifies to[b], and no one receives his testimony.
translation:
  language: pt
  text: O que ele viu e ouviu, disso dá testemunho[a]; e ninguém recebe o testemunho dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «isso ele testemunha».'
    reason: lexical_alternative
  - marker: b
    text: A afirmação «ninguém recebe o testemunho dele» é uma generalização enfática; o versículo seguinte fala daquele que o recebe.
    reason: cross_reference
lexical_decisions:
- source_word: ὃ
  choice: O que
  rationale: O pronome relativo neutro introduz o conteúdo do que foi visto e ouvido; «o que» é natural em português e não sugere um antecedente pessoal.
- source_word: ἑώρακεν καὶ ἤκουσεν
  choice: viu e ouviu
  rationale: O português corrente não reproduz naturalmente o contraste entre o perfeito de ἑώρακεν e o aoristo de ἤκουσεν neste contexto. A coordenação no pretérito perfeito comunica ações concluídas e mantém a formulação clara.
- source_word: τοῦτο
  choice: disso
  rationale: Retoma enfaticamente o conteúdo anterior e preserva a estrutura resumitiva do grego sem produzir uma frase artificial em português.
- source_word: μαρτυρεῖ
  choice: dá testemunho
  rationale: Expressão corrente que conserva a ideia joanina de declarar como testemunha e mantém a relação lexical com μαρτυρίαν.
- source_word: μαρτυρίαν
  choice: testemunho
  rationale: Preserva a linguagem de testemunha e a ligação lexical com μαρτυρεῖ.
- source_word: οὐδεὶς
  choice: ninguém
  rationale: Equivalente direto e natural da negação universal.
- source_word: λαμβάνει
  choice: recebe
  rationale: Mantém o sentido básico e o uso temático joanino de receber um testemunho, sem substituir pela interpretação mais explícita «aceita».
theological_decisions:
- issue: Alcance da afirmação universal «ninguém recebe o testemunho dele»
  choice: Manter a formulação categórica «ninguém recebe».
  alternative: «Quase ninguém recebe» ou uma formulação que explicite uma negação matematicamente absoluta.
  rationale: O grego apresenta uma generalização enfática, enquanto o versículo seguinte fala de quem recebe o testemunho. A tradução preserva essa tensão retórica e teológica sem suavizá-la nem resolvê-la.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem «O que... disso...» conserva a retomada enfática do grego. O ponto e vírgula mantém unidas as duas afirmações sem converter o simples καί em uma conjunção adversativa.
