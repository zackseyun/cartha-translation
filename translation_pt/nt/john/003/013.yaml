id: JHN.3.13
reference: John 3:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἀναβέβηκεν εἰς τὸν οὐρανὸν εἰ μὴ ὁ ἐκ τοῦ οὐρανοῦ καταβάς, ὁ υἱὸς τοῦ ⸀ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/013.yaml
  text: And no one has ascended into heaven except the one who descended from heaven—the Son of Man[a][b].
translation:
  language: pt
  text: 'Ninguém subiu ao céu, a não ser aquele que desceu do céu: o Filho do Homem.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele que veio do céu”.'
    reason: lexical_alternative
  - marker: b
    text: “O Filho do Homem” é a designação característica que Jesus usa para si mesmo e remete a Daniel 7.13–14.
    reason: cross_reference
lexical_decisions:
- source_word: οὐδεὶς
  choice: Ninguém
  rationale: Equivalente português natural e abrangente do pronome negativo, sem a conotação masculina ou arcaica de alternativas como “nenhum homem”.
- source_word: ἀναβέβηκεν
  choice: subiu
  rationale: O pretérito perfeito português expressa naturalmente a ação anterior relevante para a afirmação presente; “ascendeu” seria possível, mas menos corrente para leitores comuns.
- source_word: εἰς τὸν οὐρανόν
  choice: ao céu
  rationale: Em português, “subir ao céu” exprime de modo idiomático o movimento em direção ao domínio celeste; “para dentro do céu” seria excessivamente literal.
- source_word: εἰ μὴ
  choice: a não ser
  rationale: Marca com clareza a exceção exclusiva após a negação e mantém um registro natural e digno.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: aquele que desceu do céu
  rationale: Preserva a construção substantivada e o contraste lexical direto entre subir e descer; “veio do céu” é alternativa idiomática, mas torna menos explícito esse paralelismo.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a designação característica de Jesus e sua ressonância com Daniel 7, sem substituí-la por uma paráfrase interpretativa.
theological_decisions:
- issue: Força cristológica de “o Filho do Homem”
  choice: Manter a designação reconhecida “o Filho do Homem”.
  alternative: “o Ser Humano” ou “o Humano”
  rationale: A expressão comporta dimensões idiomáticas e apocalípticas. A forma tradicional preserva a ligação intertextual e a tensão teológica sem reduzi-la a uma expressão meramente genérica.
- issue: Relação entre subida e descida
  choice: Traduzir de forma paralela como “subiu” e “desceu”.
  alternative: “foi para o céu” e “veio do céu”
  rationale: O paralelismo conserva a afirmação do texto sobre origem celeste e acesso singular, sem acrescentar uma explicação doutrinária.
- issue: Variante textual após “Filho do Homem”
  choice: Não incluir “que está no céu” no texto principal.
  alternative: “o Filho do Homem, que está no céu”
  rationale: A edição-fonte SBLGNT aqui fornecida encerra o versículo em ἀνθρώπου; a frase adicional pertence a uma variante manuscrita e não deve ser incorporada ao texto traduzido desta edição.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A formulação é concisa e digna; “Ninguém subiu ao céu” soa natural, enquanto “aquele que desceu do céu” conserva o contraste verbal do grego. Os marcadores [a] e [b] aparecem no texto principal.
