id: JHN.3.17
reference: John 3:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλεν ὁ θεὸς τὸν ⸀υἱὸν εἰς τὸν κόσμον ἵνα κρίνῃ τὸν κόσμον, ἀλλ’ ἵνα σωθῇ ὁ κόσμος δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/017.yaml
  text: For God did not send the Son into the world so that he might judge the world[a], but so that the world might be saved through him.
translation:
  language: pt
  text: Pois Deus não enviou o Filho ao mundo para julgar o mundo[a], mas para que o mundo fosse salvo por meio dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “condenar o mundo”. Neste contexto, o verbo grego pode ter esse sentido mais específico, embora seu sentido básico seja “julgar”.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Pois ... não
  rationale: “Pois” preserva a função explicativa de γάρ, ligando o versículo à afirmação anterior; “não” expressa diretamente οὐ.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: É o equivalente natural de ἀποστέλλω e mantém o tema joanino de Deus enviar o Filho sem acrescentar nuances não explícitas.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: O substantivo grego definido é traduzido idiomaticamente em português como “Deus”.
- source_word: τὸν υἱὸν
  choice: o Filho
  rationale: Preserva o artigo e a força titular da expressão grega, sem introduzir o possessivo “seu”, que não está explícito.
- source_word: εἰς τὸν κόσμον
  choice: ao mundo
  rationale: Em português corrente, “enviar ... ao mundo” expressa naturalmente o movimento indicado por εἰς, sem a artificialidade de “para dentro do mundo”.
- source_word: ἵνα κρίνῃ τὸν κόσμον
  choice: para julgar o mundo
  rationale: A construção final “para” comunica com naturalidade o propósito expresso por ἵνα com o subjuntivo. “Julgar” preserva o sentido básico e mais amplo de κρίνω.
- source_word: ἀλλ’ ἵνα
  choice: mas para que
  rationale: Mantém o forte contraste de propósito e permite formular naturalmente a oração passiva seguinte.
- source_word: σωθῇ
  choice: fosse salvo
  rationale: Reproduz a voz passiva e o valor da oração de propósito, preservando a amplitude soteriológica de σῴζω.
- source_word: ὁ κόσμος
  choice: o mundo
  rationale: Mantém a repetição deliberada de κόσμος e evita restringir interpretativamente seu referente.
- source_word: δι’ αὐτοῦ
  choice: por meio dele
  rationale: Expressa com clareza o meio ou a agência indicados por διά com genitivo.
theological_decisions:
- issue: Sentido de κρίνῃ em contraste com σωθῇ
  choice: julgar
  alternative: condenar
  rationale: Embora “condenar” seja contextualmente possível, κρίνω tem o sentido lexical mais amplo de “julgar”. A tradução principal conserva essa amplitude e a tensão entre juízo e salvação, enquanto a nota registra a leitura contextual mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o paralelismo dos dois propósitos contrastantes e a repetição de “o mundo”.
