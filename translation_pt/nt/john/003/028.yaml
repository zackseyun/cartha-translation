base_translation:
  language: en
  yaml_path: translation/nt/john/003/028.yaml
  text: You yourselves bear me witness that I said[a], ‘I am not the Messiah[b], but I have been sent ahead of him.’
translation:
  language: pt
  text: 'Vocês mesmos testemunham que eu disse: “Eu não sou o Messias[a], mas fui enviado[b] adiante dele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sou enviado adiante dele” ou “tenho sido enviado adiante dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ ὑμεῖς
  choice: Vocês mesmos
  rationale: Preserva de modo natural a ênfase do pronome grego, destacando que os próprios ouvintes podem confirmar a declaração.
- source_word: μοι μαρτυρεῖτε
  choice: dão testemunho de que eu disse
  rationale: A construção portuguesa comunica que os ouvintes confirmam a afirmação anterior de João; o objeto do testemunho fica expresso naturalmente pela oração seguinte.
- source_word: εἶπον
  choice: eu disse
  rationale: O aoristo remete de forma simples a uma declaração anterior de João.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Aqui Χριστός funciona como título do esperado ungido; “Messias” torna esse sentido claro ao leitor moderno.
- source_word: Ἀπεσταλμένος εἰμὶ
  choice: fui enviado
  rationale: A forma perifrástica apresenta João como alguém que recebeu uma missão; o pretérito passivo é natural em português, sem negar a relevância presente dessa comissão.
- source_word: ἔμπροσθεν ἐκείνου
  choice: adiante dele
  rationale: Expressa a precedência e a função preparatória de João sem sugerir superioridade de posição.
theological_decisions:
- issue: Tradução de Χριστός como título
  choice: Messias
  alternative: Cristo
  rationale: João nega ser a figura ungida esperada, de modo que o valor titular é central. A alternativa tradicional é preservada em nota.
- issue: Força da comissão de João em Ἀπεσταλμένος εἰμὶ
  choice: fui enviado adiante dele
  alternative: sou enviado diante dele; tenho sido enviado adiante dele
  rationale: A formulação mantém o papel subordinado e preparatório de João. O português corrente favorece “fui enviado”, enquanto a nota registra a possível ênfase no estado ou missão presente resultante do envio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo; “dão testemunho” preserva a linguagem testemunhal característica de João. As notas foram alinhadas aos termos aos quais seus marcadores estão ligados.
