id: JHN.3.5
reference: John 3:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/005.yaml
  text: Jesus answered[a], “Truly, truly, I say to you, unless someone is born of water and the Spirit[b], he is not able to enter the kingdom of God.”
translation:
  language: pt
  text: 'Jesus respondeu: “Em verdade, em verdade lhe digo: se alguém não nascer da água e do Espírito[a][b], não pode entrar no Reino de Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “água e espírito”. O grego também permite entender “espírito” com inicial minúscula, embora “Espírito” seja provavelmente o sentido aqui.'
    reason: alternative_reading
  - marker: b
    text: A expressão “da água e do Espírito” tem sido entendida de diferentes maneiras, entre elas como imagem de purificação e renovação, como referência ao nascimento físico e ao nascimento espiritual, ou como referência ao batismo. A tradução preserva a formulação grega sem decidir essa questão interpretativa no texto principal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: Forma narrativa natural e direta para introduzir a resposta de Jesus.
- source_word: Ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Preserva a repetição enfática e solene da fórmula grega em português claro e tradicional.
- source_word: λέγω σοι
  choice: lhe digo
  rationale: Mantém o destinatário singular e a solenidade da declaração, com formulação natural em português.
- source_word: ἐὰν μή τις
  choice: se alguém não
  rationale: Expressa de modo idiomático a condição negativa e o sentido genérico, sem introduzir especificidade masculina.
- source_word: γεννηθῇ
  choice: nascer
  rationale: Preserva a ideia de nascimento e a voz passiva implícita na construção portuguesa, sem importar de 3:3 os sentidos ‘de novo’ ou ‘do alto’, pois ἄνωθεν não aparece neste versículo.
- source_word: ἐξ ὕδατος
  choice: da água
  rationale: Equivalente português natural após ‘nascer’, preservando a relação expressa por ἐκ.
- source_word: καὶ πνεύματος
  choice: e do Espírito
  rationale: ‘Espírito’ é a referência contextual mais provável; o artigo é exigido pela formulação portuguesa natural, embora não apareça no grego. A possibilidade de ‘espírito’ permanece em nota.
- source_word: οὐ δύναται
  choice: não pode
  rationale: Tradução idiomática e exata da incapacidade expressa por δύναμαι.
- source_word: εἰσελθεῖν
  choice: entrar
  rationale: Equivalente direto e corrente do infinitivo grego.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: Reino de Deus
  rationale: Expressão consagrada e compreensível que não reduz βασιλεία apenas a território nem apenas a exercício de governo.
theological_decisions:
- issue: Sentido de πνεύματος em ἐξ ὕδατος καὶ πνεύματος
  choice: Espírito, com referência provável ao Espírito Santo
  alternative: espírito, entendido como realidade espiritual ou princípio espiritual
  rationale: O contexto joanino favorece a referência ao Espírito Santo, mas a ausência de artigo no grego e a amplitude lexical permitem registrar a alternativa sem eliminar a tensão interpretativa.
- issue: Referência da expressão ‘água e Espírito’
  choice: Preservar literalmente a expressão sem definir seu mecanismo no texto principal
  alternative: Imagem de purificação e renovação; nascimento físico e nascimento espiritual; ou referência específica ao batismo
  rationale: O grego não resolve por si só todas as propostas interpretativas. A tradução evita incorporar uma leitura sacramental ou denominacional específica e mantém a formulação aberta do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição ‘Em verdade, em verdade’ conserva a solenidade joanina; ‘se alguém não nascer’ e ‘não pode entrar’ mantêm naturalidade sem perder a estrutura e a força do grego.
