  text: ἵνα πᾶς ὁ πιστεύων ⸂ἐν αὐτῷ⸃ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/015.yaml
  text: so that everyone who believes in him may have eternal life[a][b].
translation:
  language: pt
  text: para que todo aquele que crê nele tenha a vida eterna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «todo o que crê».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade ou o resultado em relação à declaração anterior; «para que» é natural em português e preserva a força da construção.
- source_word: πᾶς ὁ πιστεύων
  choice: todo aquele que crê
  rationale: O particípio presente com artigo funciona como substantivo e tem alcance genérico. A formulação é idiomática, inclusiva e preserva a construção no singular.
- source_word: πιστεύων
  choice: crê
  rationale: «Crer» é a tradução transparente e consagrada de πιστεύω no contexto joanino, sem acrescentar uma paráfrase interpretativa.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Traduz diretamente a preposição ἐν com o pronome, sem importar a construção joanina mais frequente com εἰς.
- source_word: ἔχῃ
  choice: tenha
  rationale: O presente do subjuntivo depois de ἵνα é representado naturalmente pelo subjuntivo português «tenha», preservando a relação de finalidade ou resultado.
- source_word: ζωὴν αἰώνιον
  choice: a vida eterna
  rationale: «Vida eterna» é a expressão estabelecida e exata no contexto joanino, comunicando duração sem fim e a qualidade escatológica da vida.
theological_decisions:
- issue: Expressão joanina de crença com ἐν αὐτῷ
  choice: nele
  alternative: para dentro dele
  rationale: O texto grego traz ἐν, não εἰς. «Nele» preserva a redação efetiva da fonte e evita introduzir no texto a construção mais comum com εἰς; a decisão é gramatical, não denominacional.
- issue: Alcance de πᾶς ὁ πιστεύων
  choice: todo aquele que crê
  alternative: quem crê
  rationale: A expressão tem alcance genérico e inclusivo. «Todo aquele que crê» torna explícita a abrangência de πᾶς e mantém a construção substantivada no singular.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a conexão sintática com o versículo anterior e evita explicitar além do grego se «para que» expressa finalidade, resultado ou ambos.
