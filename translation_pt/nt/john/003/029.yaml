  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ ἔχων τὴν νύμφην νυμφίος ἐστίν· ὁ δὲ φίλος τοῦ νυμφίου ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ, χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου. αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/029.yaml
  text: The one who has the bride is the bridegroom[a]. But the friend of the bridegroom, who stands and hears him, rejoices greatly because of the bridegroom’s voice[c][b]. Therefore this joy of mine has been made complete.
translation:
  language: pt
  text: Quem tem a noiva é o noivo. Mas o amigo do noivo[a], que está ali e o ouve, alegra-se muito[b] por causa da voz do noivo. Portanto, esta minha alegria foi levada à plenitude[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “amigo do noivo”. A função cultural pode ser comparada à de um padrinho de casamento, mas o grego não usa esse título específico.
    reason: cultural_note
  - marker: b
    text: Literalmente, “alegra-se com alegria”, expressão grega enfática.
    reason: lexical_alternative
  - marker: c
    text: Ou “foi completada” ou “chegou à plenitude”. O verbo grego indica uma alegria tornada plena, em estado resultante.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων τὴν νύμφην
  choice: Quem tem a noiva
  rationale: Preserva o particípio substantivado e a imagem nupcial de modo natural em português, sem identificar explicitamente a noiva além do que o texto diz.
- source_word: νυμφίος
  choice: noivo
  rationale: É o equivalente corrente e claro em português para o homem que se casa, mantendo a repetição e a metáfora do original.
- source_word: φίλος τοῦ νυμφίου
  choice: amigo do noivo
  rationale: Traduz de maneira transparente a expressão grega, sem introduzir no texto principal a função cultural mais específica de “padrinho”.
- source_word: ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ
  choice: que está presente e o ouve
  rationale: O perfeito ἑστηκώς retrata o amigo em sua posição de espera ou assistência. “Está presente” comunica naturalmente a cena em português, enquanto “o ouve” preserva o pronome genitivo sem antecipar “voz”.
- source_word: χαρᾷ χαίρει
  choice: alegra-se muito
  rationale: A construção cognata intensifica a alegria; esta formulação transmite a ênfase em português natural, evitando o calque pouco idiomático “alegra-se com alegria”.
- source_word: διὰ τὴν φωνὴν τοῦ νυμφίου
  choice: por causa da voz do noivo
  rationale: Mantém o valor causal de διά com acusativo e a referência explícita à voz do noivo.
- source_word: αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ
  choice: Portanto, esta minha alegria
  rationale: “Portanto” preserva a inferência marcada por οὖν; “esta minha alegria” conserva o demonstrativo e a ênfase possessiva sem soar excessivamente artificial.
- source_word: πεπλήρωται
  choice: chegou à plenitude
  rationale: Expressa o estado resultante do perfeito passivo e conserva a ideia de plenitude, sem limitar o verbo à noção de cumprimento profético.
theological_decisions:
- issue: Imagem nupcial e posição de João Batista
  choice: Manter Jesus implicitamente como o noivo e João como o amigo do noivo, sem identificar a noiva no próprio versículo.
  alternative: Explicitar a noiva como a igreja ou o povo de Deus, ou traduzir o amigo como “padrinho”.
  rationale: O versículo emprega a imagem de um casamento, mas não identifica expressamente a noiva nem define com precisão uma função cerimonial. A tradução preserva essa abertura interpretativa.
- issue: Sentido de πεπλήρωται aplicado à alegria
  choice: chegou à plenitude
  alternative: foi cumprida; está completa
  rationale: O perfeito passivo permite a noção de algo levado à plenitude ou completado. A escolha preserva o estado resultante e evita sugerir necessariamente o cumprimento de uma profecia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha de perto o grego, mas evita construções pouco naturais. Os marcadores de todas as notas aparecem no texto principal.
