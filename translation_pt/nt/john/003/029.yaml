    issue: «Está presente» para ὁ ἑστηκώς
    rationale: A expressão portuguesa indica mera presença e não preserva suficientemente a postura/cena de o amigo estar ali, de pé, ouvindo o noivo. Uma formulação como «está ali e o ouve» mantém a imagem sem produzir um calque pesado.
  - severity: low
    issue: «Chegou à plenitude» para πεπλήρωται
    rationale: Embora seja semanticamente defensável, a formulação torna a alegria sujeito ativo do processo e suaviza o perfeito passivo grego. «Foi levada à plenitude» preserva de modo mais transparente a ideia de uma alegria tornada plena.
