  source_fidelity: O texto traduz com fidelidade o sentido de ἀπεκρίθη ... καὶ εἶπεν αὐτῷ por uma fórmula portuguesa idiomática, «Jesus lhe respondeu». A condensação dos dois verbos narrativos não perde conteúdo relevante no português. A ênfase de Σὺ é adequadamente mantida pelo pronome inicial «Você», e a pergunta preserva o tom de repreensão retórica. «O mestre de Israel» conserva a articulação definida de ὁ διδάσκαλος τοῦ Ἰσραήλ; «entende» comunica de modo contextual e natural o valor de γινώσκεις.
  naturalness: '«Jesus lhe respondeu: “Você é o mestre de Israel e não entende essas coisas?”» é português moderno, claro e digno. «Você» favorece a legibilidade brasileira sem comprometer a compreensão internacional, e «essas coisas» é uma retomada discursiva natural neste contexto.'
  terminology: «Mestre» é termo bíblico estabelecido e apropriado para διδάσκαλος neste contexto. «Israel» e a expressão «mestre de Israel» estão consistentes com o registro escriturístico. Não há imposição interpretativa ou doutrinária.
