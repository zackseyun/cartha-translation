source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ διδάσκαλος τοῦ Ἰσραὴλ καὶ ταῦτα οὐ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/010.yaml
  text: Jesus answered and said to him[a], “You are the teacher of Israel, and you do not know these things?”
translation:
  language: pt
  text: 'Jesus lhe respondeu: “Você é o mestre de Israel e não entende essas coisas?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν αὐτῷ
  choice: lhe respondeu
  rationale: A fórmula narrativa grega combina literalmente ‘respondeu’ e ‘disse-lhe’. Em português atual, ‘lhe respondeu’ comunica de modo natural tanto a resposta quanto o destinatário, sem a redundância pouco idiomática de ‘respondeu e lhe disse’.
- source_word: Σὺ
  choice: Você
  rationale: O pronome explícito tem valor enfático e fica preservado no início da pergunta. ‘Você’ oferece leitura brasileira clara e amplamente inteligível.
- source_word: ὁ διδάσκαλος
  choice: o mestre
  rationale: O artigo definido grego é preservado. ‘O mestre’ mantém a força reconhecida e retoricamente incisiva do título, ao passo que ‘um mestre’ enfraqueceria a definitude.
- source_word: τοῦ Ἰσραὴλ
  choice: de Israel
  rationale: Reproduz o genitivo e indica a posição representativa de Nicodemos entre o povo de Israel, não apenas sua localização.
- source_word: ταῦτα
  choice: essas coisas
  rationale: O demonstrativo retoma o ensino de Jesus no contexto anterior. Em português, ‘essas coisas’ é natural para algo que acaba de ser apresentado ao interlocutor.
- source_word: γινώσκεις
  choice: entende
  rationale: Embora o verbo possa significar ‘conhecer’ ou ‘saber’, neste contexto a pergunta trata da falta de compreensão do ensino exposto. ‘Entende’ expressa naturalmente essa nuance contextual sem acrescentar conteúdo.
theological_decisions:
- issue: Força de ὁ διδάσκαλος τοῦ Ἰσραήλ na interpelação a Nicodemos
  choice: “o mestre de Israel”, preservando a força definida
  alternative: “um mestre de Israel”
  rationale: O artigo definido sugere que Jesus se dirige a Nicodemos como mestre reconhecido de Israel, conferindo à pergunta uma força retórica incisiva. A tradução evita decidir além do texto qual era exatamente seu cargo ou grau de autoridade.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira. A fórmula dupla ‘respondeu e disse-lhe’ foi condensada por naturalidade, enquanto o pronome enfático, a definitude do título e a forma interrogativa de repreensão foram preservados.
