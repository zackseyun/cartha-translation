id: JHN.3.12
reference: John 3:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ τὰ ἐπίγεια εἶπον ὑμῖν καὶ οὐ πιστεύετε, πῶς ἐὰν εἴπω ὑμῖν τὰ ἐπουράνια πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/012.yaml
  text: If I told you about earthly things and you do not believe[b][a], how will you believe if I tell you about heavenly things?
translation:
  language: pt
  text: Se eu lhes falei das coisas terrenas e vocês não creem, como crerão se eu lhes falar das coisas celestiais?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἐπίγεια
  choice: as coisas terrenas
  rationale: O adjetivo neutro plural funciona como substantivo. “As coisas terrenas” é natural em português e preserva o contraste direto com τὰ ἐπουράνια sem definir se são realidades na terra ou ilustrações terrenas.
- source_word: εἶπον
  choice: falei
  rationale: O aoristo de λέγω remete à fala anterior de Jesus. Com o objeto indireto ὑμῖν, “lhes falei” soa natural e mantém o sentido amplo do verbo.
- source_word: οὐ πιστεύετε
  choice: vocês não creem
  rationale: O presente do indicativo descreve a resposta atual ou habitual dos ouvintes. “Creem” mantém o vocabulário característico de João e o registro digno, sem reduzir πιστεύω a mera aceitação intelectual.
- source_word: πῶς ... πιστεύσετε
  choice: como crerão
  rationale: A pergunta retórica com o futuro πιστεύσετε é preservada formalmente, sem tornar a expressão mais interpretativa como “como poderão crer”.
- source_word: ἐὰν εἴπω
  choice: se eu lhes falar
  rationale: ἐάν com o aoristo do subjuntivo exprime uma condição futura. A construção portuguesa com “se” e futuro do subjuntivo é idiomática e corresponde bem à forma grega.
- source_word: τὰ ἐπουράνια
  choice: as coisas celestiais
  rationale: O adjetivo neutro plural substantivado contrasta diretamente com τὰ ἐπίγεια. “As coisas celestiais” preserva a amplitude da expressão sem especificar quais realidades do céu estão em vista.
theological_decisions:
- issue: Sentido do contraste entre τὰ ἐπίγεια e τὰ ἐπουράνια
  choice: Manter o contraste amplo entre “as coisas terrenas” e “as coisas celestiais”.
  alternative: Explicitar “coisas que acontecem na terra”, “ilustrações tiradas da vida terrena” ou “mistérios divinos mais profundos”.
  rationale: O texto distingue duas categorias, mas não determina aqui uma interpretação mais estreita. A tradução preserva a ambiguidade e a tensão teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O pronome “vocês” torna explícito o plural de ὑμῖν e πιστεύετε; “lhes” evita repetição excessiva. O paralelismo e a pergunta retórica do grego foram mantidos.
