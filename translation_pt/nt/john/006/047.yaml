base_translation:
  language: en
  yaml_path: translation/nt/john/006/047.yaml
  text: Truly[a], truly, I say to you[b], the one who believes has eternal life.
translation:
  language: pt
  text: 'Em verdade, em verdade digo a vocês: aquele que crê[a] tem a vida eterna.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quem crê”. O grego tem um particípio presente com artigo, literalmente “aquele que crê”.
    reason: lexical_alternative
  - marker: b
    text: Ou “vida sem fim”; mais literalmente, “vida da era” ou “vida duradoura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Preserva a repetição solene característica das declarações de Jesus em João e comunica naturalmente a força asseverativa de ἀμήν em português.
- source_word: λέγω ὑμῖν
  choice: digo a vocês
  rationale: Traduz diretamente o presente λέγω e o pronome plural ὑμῖν, com formulação atual e clara para leitores de português.
- source_word: ὁ πιστεύων
  choice: aquele que crê
  rationale: Reproduz de modo natural o particípio presente substantivado, descrevendo a pessoa caracterizada pelo crer, sem acrescentar um objeto não expresso neste versículo.
- source_word: ἔχει
  choice: tem
  rationale: Mantém o presente do indicativo e, portanto, a afirmação de que a vida eterna é uma realidade presente, não apenas futura.
- source_word: ζωὴν αἰώνιον
  choice: a vida eterna
  rationale: É a expressão portuguesa natural e consagrada para a locução joanina, preservando sua dimensão duradoura sem reduzir αἰώνιος a uma paráfrase exclusivamente temporal.
theological_decisions:
- issue: Posse presente da vida eterna
  choice: tem a vida eterna
  alternative: terá a vida eterna
  rationale: O grego emprega o presente ἔχει. A tradução preserva essa afirmação presente e não a transforma em promessa apenas futura.
- issue: Valor de αἰώνιος
  choice: eterna
  alternative: da era / do século vindouro
  rationale: “Eterna” é natural e semanticamente adequada no contexto joanino; a nota registra a relação lexical com αἰών (“era”) sem restringir indevidamente o sentido à duração ou a uma única formulação escatológica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “A vocês” deixa explícito que ὑμῖν está no plural. A cadência repetida de “Em verdade” foi mantida por ser característica do Evangelho de João.
