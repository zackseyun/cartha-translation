lexical_decisions:
- source_word: λέγει
  choice: disse
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma natural na narrativa em português, sem alterar o sentido do ato de fala.
- source_word: αὐτῷ
  choice: a ele
  rationale: O pronome no dativo indica o destinatário da fala; no contexto, refere-se a Jesus. A forma explícita mantém a referência clara.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: Um dos seus discípulos
  rationale: Reproduz com naturalidade a construção partitiva εἷς ἐκ seguida de genitivo plural.
- source_word: μαθητῶν
  choice: discípulos
  rationale: Termo corrente nos Evangelhos, preservando tanto a relação com o mestre quanto a dimensão de aprendizado.
- source_word: Ἀνδρέας
  choice: André
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: irmão de Simão Pedro
  rationale: Expressa de modo direto e idiomático a identificação apositiva de André pela relação familiar.
- source_word: Σίμωνος Πέτρου
  choice: Simão Pedro
  rationale: Os dois nomes formam aqui a designação conhecida do personagem, sem indicação textual de que se deva expandir para 'Simão, chamado Pedro'.
