  text: Ἐμάχοντο οὖν πρὸς ἀλλήλους οἱ Ἰουδαῖοι λέγοντες· Πῶς δύναται οὗτος ἡμῖν δοῦναι τὴν σάρκα ⸀αὐτοῦ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/052.yaml
  text: So the Jews were arguing among themselves[a], saying[b], “How can this man give us his flesh to eat?”
translation:
  language: pt
  text: 'Então os judeus[a] discutiam entre si: “Como este homem pode nos dar sua carne[b] para comer?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os judeus da Judeia” ou, conforme o contexto, “os líderes judeus”. O grego diz simplesmente “os judeus”.
    reason: alternative_reading
  - marker: b
    text: Ou “seu corpo”. A palavra grega é “carne” (σάρξ), mantida aqui para preservar a linguagem concreta e a tensão da passagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐμάχοντο
  choice: discutiam
  rationale: O imperfeito indica uma contenda em andamento. “Discutiam” comunica conflito verbal contínuo sem sugerir necessariamente luta física.
- source_word: οὖν
  choice: Então
  rationale: Marca o desenvolvimento narrativo e a consequência da fala anterior, em português natural.
- source_word: πρὸς ἀλλήλους
  choice: entre si
  rationale: Expressão idiomática que preserva o caráter recíproco e interno da discussão.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Reproduz diretamente a formulação grega sem restringir no texto principal o referente a judeus da Judeia ou a líderes judaicos.
- source_word: λέγοντες
  choice: introduzido por dois-pontos
  rationale: O particípio introduz o conteúdo verbal da discussão; em português, os dois-pontos expressam isso de modo fluente sem perda de sentido.
- source_word: Πῶς δύναται
  choice: Como ... pode
  rationale: Forma corrente de expressar a pergunta grega sobre possibilidade ou capacidade.
- source_word: οὗτος
  choice: este homem
  rationale: Preserva o valor demonstrativo e o possível tom de distanciamento melhor do que o simples pronome “ele”.
- source_word: ἡμῖν
  choice: nos
  rationale: Objeto indireto expresso de modo idiomático em português.
- source_word: δοῦναι
  choice: dar
  rationale: Mantém o sentido básico do verbo, sem intensificação interpretativa.
- source_word: τὴν σάρκα αὐτοῦ
  choice: sua carne
  rationale: “Carne” corresponde diretamente a σάρξ e preserva a linguagem concreta e a tensão do trecho.
- source_word: φαγεῖν
  choice: para comer
  rationale: Expressa naturalmente em português o infinitivo ligado a “dar” e mantém a finalidade implícita na construção.
theological_decisions:
- issue: Tradução de σάρξ em contexto teologicamente carregado
  choice: carne
  alternative: corpo
  rationale: A escolha mantém o termo concreto empregado no grego e não antecipa uma interpretação sacramental nem suaviza a reação dos ouvintes.
- issue: Alcance de οἱ Ἰουδαῖοι no Evangelho de João
  choice: os judeus
  alternative: os judeus da Judeia; os líderes judeus
  rationale: O texto principal segue a designação grega sem decidir um referente mais estreito; a nota registra as possibilidades contextuais e evita que a expressão seja entendida automaticamente como referência a todo o povo judeu.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com fluência brasileira. A estrutura participial foi convertida em pontuação de discurso direto; as notas preservam ambiguidades lexicais e referenciais genuínas.
