source:
  edition: SBLGNT
  text: τοῦτο δέ ἐστιν τὸ θέλημα τοῦ πέμψαντός ⸀με ἵνα πᾶν ὃ δέδωκέν μοι μὴ ἀπολέσω ἐξ αὐτοῦ ἀλλὰ ἀναστήσω ⸀αὐτὸ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/039.yaml
  text: 'And this is the will of the one who sent me: that I should lose nothing of all that he has given me[a], but should raise it up on the last day.'
translation:
  language: pt
  text: 'E esta é a vontade daquele que me enviou: que eu não perca nada de tudo o que ele me deu[a], mas o ressuscite no último dia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais pessoal: «que eu não perca nenhum dos que ele me deu, mas os ressuscite». O grego emprega uma expressão coletiva no singular, literalmente: «tudo o que ... o».'
    reason: alternative_reading
lexical_decisions:
- source_word: θέλημα
  choice: vontade
  rationale: É a correspondência mais natural para a intenção ou propósito de Deus neste contexto e preserva o uso joanino sem definir se se trata de mero desejo ou decreto.
- source_word: τοῦ πέμψαντός με
  choice: daquele que me enviou
  rationale: Reproduz naturalmente o particípio substantivado e mantém tanto a relação pessoal quanto a ação de enviar.
- source_word: ἵνα
  choice: que
  rationale: Após «esta é a vontade», introduz de modo natural em português o conteúdo da vontade, sem eliminar sua possível nuance de propósito.
- source_word: πᾶν ὃ δέδωκέν μοι
  choice: tudo o que ele me deu
  rationale: Preserva a construção coletiva no neutro singular do grego e evita personalizar antecipadamente o referente.
- source_word: δέδωκέν
  choice: deu
  rationale: O pretérito perfeito português expressa naturalmente uma ação concluída; no contexto, a posse resultante permanece clara, embora o perfeito grego tenha valor resultativo explícito.
- source_word: μὴ ἀπολέσω ἐξ αὐτοῦ
  choice: eu não perca nada de tudo
  rationale: Neste contexto, ἀπόλλυμι significa perder, não destruir. «Nada de tudo» conserva a negação, o sentido partitivo de ἐξ αὐτοῦ e a referência coletiva.
- source_word: ἀναστήσω αὐτὸ
  choice: o ressuscite
  rationale: «Ressuscitar» comunica claramente o levantamento escatológico; o pronome singular «o» retoma coletivamente «tudo o que» e preserva a concordância formal do grego.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: no último dia
  rationale: É a formulação portuguesa natural e tradicional para a referência escatológica em João.
theological_decisions:
- issue: Se o objeto coletivo deve ser explicitamente pessoal («todos os que») ou conservar o neutro singular coletivo do grego («tudo o que»).
  choice: tudo o que ele me deu ... o ressuscite
  alternative: todos os que ele me deu ... os ressuscite
  rationale: As formas gregas πᾶν, ὃ e αὐτό estão no neutro singular e formam uma expressão coletiva. A tradução conserva essa forma e a tensão do texto, sem negar que, no contexto, o referente possa ser pessoas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as relações sintáticas do grego foram preservadas onde soam naturais; a nota esclarece a alternativa pessoal sem substituir a expressão coletiva do texto.
