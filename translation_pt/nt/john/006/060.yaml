id: JHN.6.60
reference: John 6:60
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἀκούσαντες ἐκ τῶν μαθητῶν αὐτοῦ εἶπαν· Σκληρός ἐστιν ⸂ὁ λόγος οὗτος⸃· τίς δύναται αὐτοῦ ἀκούειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/060.yaml
  text: Therefore many of his disciples[a], when they heard it, said, “This word is hard[b]; who can listen to it?”
translation:
  language: pt
  text: 'Por isso, muitos dos seus discípulos, ao ouvirem isso, disseram: “Essa palavra é dura[a]. Quem consegue ouvi-la[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Esse ensinamento é duro”. A palavra grega também pode significar “declaração”, “mensagem” ou “ensino”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Quem consegue dar ouvidos a ela?” O verbo grego pode significar ouvir, escutar, dar ouvidos ou acolher, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ
  choice: muitos
  rationale: Expressa de modo natural e conciso um número considerável dentro do grupo dos discípulos.
- source_word: οὖν
  choice: Por isso
  rationale: Mantém a conexão inferencial com o discurso anterior em português corrente.
- source_word: ἀκούσαντες
  choice: ao ouvirem isso
  rationale: Reproduz o valor temporal do particípio aoristo; “isso” retoma naturalmente o ensino anterior.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: dos seus discípulos
  rationale: Indica que os que falaram pertenciam ao grupo mais amplo dos discípulos, sem tornar a frase pesada.
- source_word: Σκληρός
  choice: dura
  rationale: “Dura” preserva a amplitude entre difícil, severa e difícil de aceitar, sem reduzir a objeção a mera incompreensão intelectual.
- source_word: ὁ λόγος οὗτος
  choice: Essa palavra
  rationale: Mantém proximidade lexical com λόγος e pode designar a declaração, mensagem ou ensino que acabavam de ouvir.
- source_word: τίς δύναται
  choice: Quem consegue
  rationale: Forma idiomática e direta de expressar capacidade em português moderno.
- source_word: αὐτοῦ ἀκούειν
  choice: ouvi-la
  rationale: Preserva a repetição de ἀκούω e sua ambiguidade contextual entre ouvir, dar ouvidos e acolher.
theological_decisions:
- issue: Sentido da objeção dos discípulos ao discurso de Jesus
  choice: A palavra de Jesus é descrita como “dura”, sem especificar se a dificuldade é intelectual, moral, emocional ou se decorre de seu caráter ofensivo.
  alternative: Traduzir de modo mais restrito como “difícil de entender”, “ofensiva” ou “inaceitável”.
  rationale: σκληρός abrange dureza, severidade e dificuldade de acolhimento. A formulação escolhida conserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Por isso” é mais natural do que “portanto” na progressão narrativa; “ao ouvirem isso” evita uma construção participial artificial. A repetição de “ouvir” mantém a ligação verbal do grego, enquanto as notas registram as alternativas sem resolver indevidamente a ambiguidade.
