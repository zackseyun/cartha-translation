  text: ἦν δὲ ἐγγὺς τὸ πάσχα, ἡ ἑορτὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/004.yaml
  text: The Passover[a], the feast of the Jews, was near.
translation:
  language: pt
  text: A Páscoa[a], a festa dos judeus, estava próxima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a festa dos judeanos». O termo grego pode designar os judeus em geral ou, conforme o contexto, os habitantes da Judeia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: não traduzido de forma explícita
  rationale: δέ é um conectivo leve de progressão narrativa. Em português, a ligação com o contexto pode ficar implícita, sem acrescentar um advérbio temporal inexistente no grego.
- source_word: ἐγγὺς
  choice: estava próxima
  rationale: Com ἦν, indica proximidade temporal. A concordância com «Páscoa» produz uma formulação natural e digna em português.
- source_word: πάσχα
  choice: Páscoa
  rationale: Designa a celebração judaica da Páscoa; esta é a equivalência portuguesa corrente e precisa.
- source_word: ἑορτὴ
  choice: festa
  rationale: ἑορτή denota uma celebração festiva religiosa. «Festa» é clara, natural e preserva o caráter cultual do termo.
- source_word: τῶν Ἰουδαίων
  choice: dos judeus
  rationale: Embora Ἰουδαῖοι possa significar «judeus» ou «judeus da Judeia/judeanos» conforme o contexto, aqui a Páscoa é apresentada como celebração do povo judeu em geral.
theological_decisions:
- issue: Sentido de Ἰουδαίων na narração joanina
  choice: dos judeus
  alternative: dos judeanos
  rationale: Neste contexto, a expressão identifica a Páscoa como festa do povo judeu, não apenas dos habitantes da Judeia. A alternativa lexical genuína é preservada em nota, sem restringir indevidamente o referente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem mantém a aposição explicativa do grego, e o conectivo δέ fica implícito para evitar um «ora» ou «então» excessivamente marcado.
