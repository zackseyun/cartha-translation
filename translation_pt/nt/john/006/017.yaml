source:
  edition: SBLGNT
  text: καὶ ἐμβάντες ⸀εἰς πλοῖον ἤρχοντο πέραν τῆς θαλάσσης εἰς Καφαρναούμ. καὶ σκοτία ἤδη ἐγεγόνει καὶ ⸀οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/017.yaml
  text: They got into a boat and were heading across the sea to Capernaum[a]. And it had already become dark[c][b], and Jesus had not yet come to them.
translation:
  language: pt
  text: Eles entraram num barco e seguiam para o outro lado do mar, em direção a Cafarnaum.[a] Já havia escurecido,[b] e Jesus ainda não tinha vindo até eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “atravessando o mar rumo a Cafarnaum”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a escuridão já havia caído”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντες εἰς πλοῖον
  choice: entraram num barco
  rationale: O particípio aoristo indica ação anterior ao verbo principal. Em português corrente, a coordenação com verbo finito preserva naturalmente a sequência sem tornar a frase pesada. O artigo indefinido reflete a ausência de artigo em πλοῖον.
- source_word: ἤρχοντο
  choice: seguiam
  rationale: O imperfeito de ἔρχομαι apresenta o deslocamento em curso. “Seguiam” conserva esse aspecto melhor que o pontual “foram” ou “partiram”.
- source_word: πέραν τῆς θαλάσσης
  choice: pelo mar
  rationale: No contexto de movimento rumo a Cafarnaum, a expressão indica a travessia do mar. “Pelo mar” é natural e evita sugerir que πέραν seja necessariamente o destino explícito, preservando Cafarnaum como termo de εἰς.
- source_word: εἰς Καφαρναούμ
  choice: em direção a Cafarnaum
  rationale: A preposição εἰς marca a direção do deslocamento. “Em direção a” combina naturalmente com o movimento ainda em curso expresso pelo imperfeito.
- source_word: σκοτία ἤδη ἐγεγόνει
  choice: já havia escurecido
  rationale: 'A formulação idiomática preserva o valor resultativo do mais-que-perfeito: a escuridão já havia chegado naquele ponto da narrativa.'
- source_word: οὔπω ἐληλύθει πρὸς αὐτοὺς
  choice: ainda não tinha vindo até eles
  rationale: O mais-que-perfeito com οὔπω indica que, até aquele momento, Jesus não havia chegado junto deles. “Vindo até eles” traduz diretamente o movimento expresso por πρὸς αὐτούς sem acrescentar a ideia interpretativa de que ele os teria “alcançado” ou “se juntado” a eles.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome.
theological_decisions:
- issue: Aspecto narrativo e sequência temporal
  choice: Distinguir a entrada no barco como ação concluída, a travessia como ação em curso e os dois mais-que-perfeitos como circunstâncias já estabelecidas naquele momento.
  alternative: 'Nivelar os verbos no pretérito perfeito ou traduzir a escuridão apenas como estado: “entraram, foram, estava escuro”.'
  rationale: A escolha conserva a progressão e a tensão narrativa do grego sem inferir qualquer explicação teológica além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação verbal evita uma construção participial artificial; “seguiam” mantém o movimento em curso. Os marcadores [a] e [b] aparecem no texto principal.
