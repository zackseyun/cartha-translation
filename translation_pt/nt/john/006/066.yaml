  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐκ τούτου πολλοὶ ⸀ἐκ ⸂τῶν μαθητῶν αὐτοῦ ἀπῆλθον⸃ εἰς τὰ ὀπίσω καὶ οὐκέτι μετ’ αὐτοῦ περιεπάτουν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/066.yaml
  text: From this time many of his disciples went back and no longer walked with him[a].
translation:
  language: pt
  text: A partir daquele momento, muitos dos seus discípulos voltaram atrás e já não andavam com ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por causa disso, muitos dos seus discípulos se afastaram”; a expressão grega inicial também pode ser entendida em sentido causal, embora, neste contexto, o sentido temporal destaque melhor o ponto de virada.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τούτου
  choice: A partir daquele momento
  rationale: No contexto, a expressão assinala um ponto de virada temporal, sem excluir totalmente uma nuance causal.
- source_word: πολλοὶ ἐκ τῶν μαθητῶν αὐτοῦ
  choice: muitos dos seus discípulos
  rationale: 'Preserva de forma natural o sentido partitivo: os que se retiraram pertenciam ao grupo mais amplo dos discípulos.'
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: voltaram atrás
  rationale: Traduz o conjunto verbal como retirada ou recuo, e não como simples deslocamento.
- source_word: οὐκέτι
  choice: já não
  rationale: Expressa claramente a cessação da ação a partir daquele ponto.
- source_word: μετ’ αὐτοῦ περιεπάτουν
  choice: andavam com ele
  rationale: Mantém a metáfora do caminhar e sua possível dimensão de convivência e seguimento, sem reduzi-la a uma interpretação única.
theological_decisions:
- issue: Se μαθηταί deve identificar os Doze ou somente crentes genuínos
  choice: discípulos
  alternative: seguidores
  rationale: O texto os inclui entre os discípulos de Jesus, mas não os identifica com os Doze nem define na tradução a condição espiritual deles.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Voltaram atrás” e “andavam com ele” preservam as imagens do grego sem linguagem excessivamente literal ou interpretativa.
