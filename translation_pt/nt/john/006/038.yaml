  text: ὅτι καταβέβηκα ⸀ἀπὸ τοῦ οὐρανοῦ οὐχ ἵνα ποιῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/038.yaml
  text: For I have come down from heaven, not to do my own will, but the will of the one who sent me.
translation:
  language: pt
  text: Pois desci do céu, não para fazer a minha própria vontade, mas a vontade daquele que me enviou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e conserva a força causal de modo natural em português.
- source_word: καταβέβηκα
  choice: desci
  rationale: O pretérito perfeito é a forma idiomática em português para a ação concluída de descer, enquanto o contexto mantém sua relevância presente; “tenho descido” sugeriria ação repetida ou contínua.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: do céu
  rationale: Expressa naturalmente a origem espacial indicada pela preposição e preserva a ressonância joanina da origem celestial.
- source_word: οὐχ ἵνα ποιῶ
  choice: não para fazer
  rationale: Conserva de maneira clara e concisa a negação da finalidade expressa pela construção grega.
- source_word: τὸ θέλημα τὸ ἐμὸν
  choice: a minha própria vontade
  rationale: “Vontade” preserva o peso pessoal e teológico de θέλημα, e “própria” comunica a ênfase do possessivo e reforça o contraste.
- source_word: ἀλλὰ
  choice: mas
  rationale: Mantém a oposição simples e enfática entre as duas finalidades.
- source_word: τὸ θέλημα τοῦ πέμψαντός με
  choice: a vontade daquele que me enviou
  rationale: Traduz naturalmente o particípio substantivado sem identificar explicitamente o remetente além do que o versículo declara.
theological_decisions:
- issue: A descida de Jesus do céu e sua relevância cristológica
  choice: Traduzir diretamente como “desci do céu”, preservando a afirmação de origem celestial.
  alternative: Entender a expressão apenas como metáfora de comissão divina.
  rationale: O texto apresenta a origem de Jesus em termos celestiais; a tradução não deve reduzir essa linguagem a uma simples referência à missão nem acrescentar formulações doutrinárias.
- issue: A vontade de Jesus e a vontade daquele que o enviou
  choice: Usar “vontade” nas duas ocorrências e manter o contraste.
  alternative: Verter dinamicamente como “o que eu quero” e “o que ele quer”.
  rationale: A repetição preserva o paralelismo e a tensão teológica do texto entre a vontade própria de Jesus e a vontade daquele que o enviou, sem explicar ou sistematizar essa relação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a concisão e o paralelismo do grego. Não há necessidade de notas textuais ou explicativas neste versículo.
