source:
  edition: SBLGNT
  text: ⸀εἶπεν ὁ Ἰησοῦς· Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν. ἦν δὲ χόρτος πολὺς ἐν τῷ τόπῳ. ἀνέπεσαν οὖν οἱ ἄνδρες τὸν ἀριθμὸν ⸀ὡς πεντακισχίλιοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/010.yaml
  text: Jesus said, “Have the people sit down.” Now there was plenty of grass in the place. So the men sat down, about five thousand in number.
translation:
  language: pt
  text: 'Jesus disse: “Façam o povo se sentar.”[a] Havia muita grama naquele lugar. Então os homens se sentaram; eram cerca de cinco mil.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Façam o povo se reclinar”. O verbo grego pode indicar a postura reclinada adotada durante uma refeição.'
    reason: lexical_alternative
  - marker: b
    text: O grego primeiro diz “o povo” (ἀνθρώπους) e depois “os homens” (ἄνδρες), indicando que a contagem de cerca de cinco mil se refere especificamente aos homens.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν
  choice: Façam o povo se sentar
  rationale: A construção com ποιέω e infinitivo expressa causação. “Façam o povo se sentar” conserva a força da ordem e soa natural em português; “povo” representa o sentido coletivo e inclusivo de ἀνθρώπους.
- source_word: ἀναπεσεῖν / ἀνέπεσαν
  choice: se sentar / se sentaram
  rationale: ἀναπίπτω pode indicar reclinar-se para uma refeição, mas, neste cenário ao ar livre, “sentar-se” comunica naturalmente a ação sem impor uma postura específica além do necessário.
- source_word: χόρτος πολὺς
  choice: muita grama
  rationale: χόρτος designa grama neste contexto, e πολύς indica grande quantidade. “Muita grama” é direto, corrente e próximo da forma grega.
- source_word: ἐν τῷ τόπῳ
  choice: naquele lugar
  rationale: A expressão locativa é vertida de modo natural e mantém a referência ao local da cena.
- source_word: οἱ ἄνδρες
  choice: os homens
  rationale: ἀνήρ especifica homens, em contraste com o termo inclusivo ἄνθρωπος usado antes para o povo em geral.
- source_word: τὸν ἀριθμὸν ὡς πεντακισχίλιοι
  choice: eram cerca de cinco mil
  rationale: “Cerca de” preserva a aproximação marcada por ὡς, enquanto a formulação explicita de maneira idiomática o total contado.
theological_decisions:
- issue: Contagem específica dos homens na narrativa da multiplicação
  choice: Distinguir “o povo” (ἀνθρώπους) de “os homens” (ἄνδρες).
  alternative: Traduzir ambos os termos genericamente como “pessoas”.
  rationale: A distinção lexical do grego indica que a ordem se dirige ao grupo em geral, enquanto o número aproximado se refere especificamente aos homens. Preservá-la evita apagar uma diferença real do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução mantém a distinção entre o grupo geral e os homens contados, empregando “sentar-se” no texto e registrando “reclinar-se” em nota.
