lexical_decisions:
- source_word: οἱ πατέρες ὑμῶν
  choice: Os pais de vocês
  rationale: Preserva o sentido literal de πατέρες e sua força representativa, referindo-se aos antepassados israelitas da geração do deserto. Em português, a nota esclarece o sentido ancestral para evitar que a expressão seja entendida apenas como referência aos pais imediatos.
- source_word: ἔφαγον
  choice: comeram
  rationale: Traduz diretamente o aoristo indicativo de ἐσθίω, com ação passada completa e formulação natural em português.
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: No contexto do êxodo, ἔρημος designa a região desértica atravessada por Israel. «No deserto» é corrente, claro e mantém a ressonância bíblica em português.
- source_word: τὸ μάννα
  choice: o maná
  rationale: Mantém o artigo grego e o referente conhecido da narrativa do êxodo; «o maná» é a forma idiomática em português.
- source_word: καὶ ἀπέθανον
  choice: e morreram
  rationale: Reproduz a coordenação explícita com καί e afirma a morte efetiva daquela geração, preservando o contraste contextual com o pão que dá vida.
theological_decisions:
- issue: Referência à geração israelita do deserto
  choice: Os pais de vocês
  alternative: Os antepassados de vocês
  rationale: A tradução principal conserva a forma concreta de πατέρες e a força retórica das palavras dirigidas aos ouvintes de Jesus, sem acrescentar interpretação. A alternativa mais explícita é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe é direta e mantém a concisão e o contraste do grego.
