id: JHN.6.1
reference: John 6:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀπῆλθεν ὁ Ἰησοῦς πέραν τῆς θαλάσσης τῆς Γαλιλαίας τῆς Τιβεριάδος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/001.yaml
  text: After these things[a], Jesus went away to the other side of the Sea of Galilee[b], which is the Sea of Tiberias.
translation:
  language: pt
  text: Depois desses acontecimentos[a], Jesus foi para o outro lado do mar da Galileia[b], isto é, o mar de Tiberíades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Depois dessas coisas”.'
    reason: lexical_alternative
  - marker: b
    text: O mar da Galileia também era conhecido como mar de Tiberíades; os dois nomes designam o mesmo corpo de água.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Depois desses acontecimentos
  rationale: Mantém o demonstrativo plural do grego, mas expressa a transição de maneira mais natural em português do que a formulação estritamente literal “depois dessas coisas”.
- source_word: ἀπῆλθεν
  choice: foi
  rationale: No contexto, o aoristo de ἀπέρχομαι indica que Jesus se dirigiu a outro lugar. “Foi” é claro e natural; a noção de afastamento fica suficientemente expressa por “para o outro lado”.
- source_word: πέραν
  choice: para o outro lado de
  rationale: Ao descrever o deslocamento através de uma extensão de água, esta expressão comunica naturalmente a chegada à margem oposta.
- source_word: τῆς θαλάσσης
  choice: do mar
  rationale: Embora se trate geograficamente de um lago, θάλασσα significa “mar” e corresponde ao nome tradicional e reconhecível desse corpo de água.
- source_word: τῆς Γαλιλαίας
  choice: da Galileia
  rationale: O genitivo identifica o corpo de água pela região; “mar da Galileia” é a forma corrente em português.
- source_word: τῆς Τιβεριάδος
  choice: isto é, o mar de Tiberíades
  rationale: A expressão apresenta um segundo nome para o mesmo corpo de água. “Isto é” torna clara a aposição implícita na sequência de genitivos gregos sem alterar o referente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva o plural da expressão inicial e esclarece de modo discreto que “Galileia” e “Tiberíades” nomeiam o mesmo mar.
