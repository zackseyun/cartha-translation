  text: εἶπον οὖν πρὸς αὐτόν· Τί ποιῶμεν ἵνα ἐργαζώμεθα τὰ ἔργα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/028.yaml
  text: Then they said to him[a], “What must we do so that we may work the works of God?”
translation:
  language: pt
  text: 'Então lhe disseram: “O que devemos fazer para realizar as obras de Deus?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que devemos fazer para praticar as obras de Deus?” O genitivo grego também pode ser entendido como “as obras que Deus exige”.'
    reason: Leitura alternativa que reflete outra tradução possível de ἐργάζομαι e a ambiguidade do genitivo τοῦ θεοῦ.
lexical_decisions:
- source_word: εἶπον οὖν πρὸς αὐτόν
  choice: Então lhe perguntaram
  rationale: No fluxo narrativo, οὖν indica continuidade ou consequência leve, bem expressa por “então”. Embora εἶπον seja literalmente “disseram”, o conteúdo interrogativo torna “perguntaram” natural em português, sem alterar o ato de fala; “lhe” representa πρὸς αὐτόν.
- source_word: Τί ποιῶμεν
  choice: O que devemos fazer
  rationale: A pergunta deliberativa com o subjuntivo presente ποιῶμεν busca saber qual ação é requerida. “Devemos fazer” comunica essa força de modo claro e corrente.
- source_word: ἵνα
  choice: para
  rationale: A conjunção introduz finalidade. “Para” é a forma mais natural e concisa em português neste contexto.
- source_word: ἐργαζώμεθα τὰ ἔργα
  choice: realizar as obras
  rationale: “Realizar” traduz adequadamente ἐργάζομαι como executar ou levar a efeito. Evita a formulação pouco natural “trabalhar as obras”, embora não reproduza integralmente o jogo etimológico entre o verbo e o substantivo.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: A construção genitiva é mantida sem explicitação, preservando a abertura semântica entre obras requeridas por Deus, pertencentes a Deus ou realizadas por ele.
theological_decisions:
- issue: Sentido do genitivo em τὰ ἔργα τοῦ θεοῦ
  choice: Manter “as obras de Deus” no texto principal
  alternative: “as obras que Deus exige” ou “as obras que Deus realiza”
  rationale: O genitivo grego admite mais de uma relação semântica, e o versículo seguinte explora a expressão. O texto principal não deve resolver uma tensão que o original deixa aberta.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão, com legibilidade brasileira. A formulação preserva a ambiguidade teológica central sem recorrer a linguagem excessivamente literal ou pouco idiomática.
