id: JHN.6.70
reference: John 6:70
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην; καὶ ἐξ ὑμῶν εἷς διάβολός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/070.yaml
  text: Jesus answered them[a], “Did I not choose you, the Twelve? Yet one of you is a devil.”
translation:
  language: pt
  text: 'Jesus lhes respondeu: “Não fui eu que escolhi vocês, os Doze? Contudo, um de vocês é um diabo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um difamador”. A palavra grega pode designar um falso acusador ou, em muitos contextos, o Diabo. Aqui, a formulação é qualitativa, não uma identificação direta com Satanás.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: lhes respondeu
  rationale: Expressa de modo natural em português o verbo narrativo de resposta e mantém αὐτοῖς como objeto indireto.
- source_word: Οὐκ ἐγὼ ὑμᾶς ... ἐξελεξάμην;
  choice: Não fui eu que escolhi vocês...?
  rationale: Preserva a pergunta retórica que espera resposta afirmativa e dá relevo ao pronome ἐγώ, com uma construção corrente e enfática em português.
- source_word: ὑμᾶς τοὺς δώδεκα
  choice: vocês, os Doze
  rationale: Mantém a aposição e trata “os Doze” como designação reconhecida do grupo, sem confundi-la com mero numeral.
- source_word: καὶ
  choice: Contudo
  rationale: Neste contexto, a conjunção introduz um contraste entre a escolha dos Doze e o caráter de um deles; “contudo” comunica naturalmente esse valor adversativo.
- source_word: ἐξ ὑμῶν εἷς
  choice: um de vocês
  rationale: Reproduz de forma idiomática o sentido partitivo da expressão grega.
- source_word: διάβολός
  choice: um diabo
  rationale: O predicativo sem artigo tem força qualitativa. “Um diabo” preserva a contundência e a ambiguidade teológica da formulação sem identificar diretamente esse discípulo como Satanás.
theological_decisions:
- issue: Se διάβολός identifica o discípulo com Satanás ou o caracteriza qualitativamente
  choice: um diabo
  alternative: o Diabo; um difamador
  rationale: A ausência do artigo e a construção predicativa favorecem uma descrição qualitativa, não uma identificação direta com Satanás. “Um diabo” mantém a força retórica; a nota registra o sentido lexical alternativo sem resolver além do que o grego permite.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para ampla legibilidade brasileira. A construção “Não fui eu que...” conserva a ênfase de ἐγώ sem soar artificial. “Os Doze” é grafado com maiúscula por funcionar como designação do grupo.
