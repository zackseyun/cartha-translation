id: JHN.6.27
reference: John 6:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/027.yaml
  text: Do not work for the food that perishes[a], but for the food that remains to eternal life, which the Son of Man will give to you[b]; for God the Father has set his seal on him.
translation:
  language: pt
  text: Não trabalhem pela comida que perece, mas pela comida que permanece[a] para a vida eterna, a qual o Filho do Homem dará a vocês; pois Deus, o Pai, pôs nele o seu selo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que dura para a vida eterna”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “selou”; a expressão pode transmitir a ideia de autenticação ou autorização.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργάζεσθε
  choice: trabalhem pela
  rationale: O imperativo presente plural mantém a força da ordem; a preposição explicita em português natural o sentido de empenhar-se por algo, tornado claro pelo objeto e pelo contraste.
- source_word: βρῶσιν
  choice: comida
  rationale: No contexto, o termo designa alimento, não o ato de comer. “Comida” é corrente, claro e adequado ao contraste do versículo.
- source_word: ἀπολλυμένην
  choice: que perece
  rationale: Preserva o sentido amplo de algo sujeito à deterioração e ao desaparecimento, sem restringi-lo ao simples ato de estragar.
- source_word: μένουσαν
  choice: que permanece
  rationale: Conserva o contraste verbal com “perece” e traduz μένω de modo claro e atual.
- source_word: εἰς ζωὴν αἰώνιον
  choice: para a vida eterna
  rationale: “Para” expressa de modo conciso a orientação para um fim ou resultado indicada por εἰς, sem determinar além do texto a relação exata entre a comida e a vida eterna.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Tradução consagrada que preserva a forma do título e suas ressonâncias bíblicas.
- source_word: ὑμῖν δώσει
  choice: dará a vocês
  rationale: Reproduz o futuro e o objeto indireto plural em português amplamente compreensível.
- source_word: ἐσφράγισεν
  choice: pôs nele o seu selo
  rationale: Mantém a metáfora do selo, que pode comunicar autenticação, aprovação ou autorização, sem reduzi-la a uma única interpretação.
- source_word: ὁ πατὴρ ... ὁ θεός
  choice: Deus, o Pai
  rationale: Preserva a construção apositiva que identifica o Pai como Deus e soa natural em português.
theological_decisions:
- issue: Sentido da comida que permanece εἰς ζωὴν αἰώνιον
  choice: que permanece para a vida eterna
  alternative: que dura até a vida eterna
  rationale: A tradução conserva a orientação ou finalidade expressa por εἰς e evita decidir se a expressão destaca duração temporal, resultado ou destino.
- issue: Sentido de ἐσφράγισεν aplicado ao Filho do Homem
  choice: pôs nele o seu selo
  alternative: autenticou-o
  rationale: A imagem concreta do selo é mantida, permitindo os sentidos relacionados de autenticação, aprovação e autorização sem escolher apenas um deles.
- issue: Aposição ὁ πατὴρ ... ὁ θεός
  choice: Deus, o Pai
  alternative: o Pai, Deus
  rationale: A forma escolhida identifica explicitamente o Pai como Deus, como faz o grego, sem acrescentar uma formulação doutrinária externa ao versículo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas naturais no Brasil. O plural “vocês” torna explícito o destinatário plural; a repetição de “comida” preserva o contraste retórico. A metáfora do selo e a possível amplitude de εἰς foram mantidas.
