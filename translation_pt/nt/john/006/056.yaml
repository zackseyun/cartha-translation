  yaml_path: translation/nt/john/006/056.yaml
  text: The one who eats my flesh and drinks my blood remains in me[b][a], and I in him.
translation:
  language: pt
  text: Quem come a minha carne e bebe o meu sangue permanece em mim[a], e eu nele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se alimenta da minha carne”; o verbo grego para “come” é mais vívido do que o termo mais comum para comer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: Quem come
  rationale: O artigo com o particípio presente tem função substantivada e descreve a pessoa caracterizada por essa ação. “Quem come” é natural em português e mantém o valor geral e contínuo do enunciado.
- source_word: τρώγων
  choice: come
  rationale: Embora τρώγω possa ser mais vívido que o verbo grego comum para comer, “come” comunica o sentido com clareza e dignidade; as opções mais gráficas soariam marcadas demais no texto principal.
- source_word: μου τὴν σάρκα
  choice: a minha carne
  rationale: Mantém o sentido concreto de σάρξ e preserva a linguagem forte, encarnacional e sacrificial do discurso, sem convertê-la em explicação doutrinária.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: e bebe o meu sangue
  rationale: Reproduz diretamente o particípio coordenado e conserva a imagem concreta e impactante do grego.
- source_word: ἐν ἐμοὶ μένει
  choice: permanece em mim
  rationale: “Permanece” é natural no português atual e preserva o importante uso joanino de μένω, que sugere continuidade relacional.
- source_word: κἀγὼ ἐν αὐτῷ
  choice: e eu nele
  rationale: Preserva a elipse do original, no qual o verbo não é repetido, e soa natural em português.
theological_decisions:
- issue: Interpretação eucarística/sacramental ou metafórica de comer a carne e beber o sangue
  choice: Manter a formulação concreta do grego sem explicação interpretativa.
  alternative: Explicitar uma leitura sacramental ou parafrasear a ação como crer em Jesus.
  rationale: O versículo não resolve por si só a controvérsia interpretativa. A tradução conserva a tensão teológica e não introduz uma posição denominacional.
- issue: Linguagem joanina de habitação mútua
  choice: Traduzir μένει por “permanece” e conservar a construção recíproca “em mim, e eu nele”.
  alternative: Usar “habita”, “está unido” ou repetir “permaneço”.
  rationale: “Permanece” mantém a ideia de continuidade relacional sem impor uma formulação mística ou dogmática posterior; a elipse final segue o grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e as imagens concretas do grego foram preservadas, enquanto “Quem come” evita rigidez desnecessária. O único marcador de nota aparece no texto principal.
