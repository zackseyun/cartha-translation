  text: Τῇ ἐπαύριον ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης ⸀εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ⸀ἕν, καὶ ὅτι οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ ⸀πλοῖον ἀλλὰ μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/022.yaml
  text: On the next day[a], the crowd that had been standing on the other side of the sea saw that no other small boat had been there except one, and that Jesus had not gone with his disciples into the boat[b], but that his disciples had gone away alone.
translation:
  language: pt
  text: No dia seguinte, a multidão que permanecia do outro lado do mar viu que não havia ali nenhum outro pequeno barco[a], a não ser um, e que Jesus não tinha entrado no barco[b] com os seus discípulos, mas que os discípulos tinham partido sozinhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “barco”; o grego πλοιάριον apresenta uma forma diminutiva.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos e edições variam entre “pequeno barco” (πλοιάριον) e “barco” (πλοῖον) neste versículo; a tradução segue, em cada ocorrência, o texto grego impresso.
    reason: textual_variant
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: No dia seguinte
  rationale: Expressão temporal idiomática que introduz os acontecimentos do dia posterior; a formulação é natural em português.
- source_word: ὁ ὄχλος ὁ ἑστηκὼς
  choice: a multidão que permanecia
  rationale: O particípio perfeito descreve a multidão em estado de permanência naquele lugar; “permanecia” comunica esse valor com naturalidade, sem sugerir necessariamente que todos estavam fisicamente de pé.
- source_word: πέραν τῆς θαλάσσης
  choice: do outro lado do mar
  rationale: πέραν com o genitivo indica localização no lado oposto; esta é a formulação geográfica corrente em português.
- source_word: εἶδον
  choice: viu
  rationale: Mantém o sentido básico de percepção de ὁράω. O singular concorda naturalmente em português com o substantivo coletivo “multidão”, apesar da forma verbal grega plural.
- source_word: πλοιάριον
  choice: barquinho
  rationale: Reproduz a forma diminutiva grega, embora no uso contextual ela possa simplesmente designar uma embarcação; a nota registra a alternativa “barco”.
- source_word: ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ἕν
  choice: não havia ali nenhum outro barquinho, a não ser um
  rationale: Preserva a ênfase de exclusividade da construção grega e mantém clara a referência a uma única embarcação.
- source_word: οὐ συνεισῆλθεν ... ὁ Ἰησοῦς
  choice: Jesus não tinha entrado ... com os seus discípulos
  rationale: O verbo composto indica entrar juntamente com alguém. O mais-que-perfeito composto expressa naturalmente a anterioridade em relação à constatação da multidão.
- source_word: εἰς τὸ πλοῖον
  choice: no barco
  rationale: Reflete πλοῖον, termo não diminutivo, e “entrar no barco” é a construção idiomática em português.
- source_word: μόνοι ... ἀπῆλθον
  choice: tinham partido sozinhos
  rationale: Comunica que os discípulos partiram sem Jesus e conserva o caráter retrospectivo da declaração.
