  naturalness: A redação é clara e natural. A revisão proposta apenas substitui um diminutivo potencialmente marcado por uma expressão descritiva neutra. “A multidão ... viu” é concordância portuguesa normal com um coletivo e é aceitável apesar do plural εἶδον no texto grego.
  terminology: “Pequeno barco” para πλοιάριον e “barco” para πλοῖον mantém de forma clara a diferença presente no texto impresso. “Discípulos”, “Jesus” e “mar” estão adequados ao registro.
