id: JHN.6.53
reference: John 6:53
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/053.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, unless you eat the flesh of the Son of Man and drink his blood[b], you do not have life in yourselves.”
translation:
  language: pt
  text: 'Então Jesus lhes disse: “Em verdade, em verdade lhes digo: a menos que comam a carne[a] do Filho do Homem e bebam o seu sangue, vocês não têm vida[b] em si mesmos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “corpo”; o grego traz “carne” (σάρξ), termo que preserva a força concreta da declaração.
    reason: lexical_alternative
  - marker: b
    text: O versículo diz simplesmente “vida”, não “vida eterna”, embora o contexto mais amplo de João frequentemente associe essa vida à vida eterna.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a conexão consequencial com a discussão anterior e soa natural em português, sem tornar a inferência excessivamente explícita.
- source_word: Ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Preserva a repetição solene e enfática característica das declarações de Jesus no Evangelho de João.
- source_word: ἐὰν μὴ
  choice: a menos que
  rationale: Expressa de modo idiomático a condição negativa e mantém sob a mesma condição as ações de comer e beber.
- source_word: φάγητε
  choice: comam
  rationale: Mantém o sentido concreto e direto do verbo grego, sem substituí-lo por uma formulação interpretativa como “participem”.
- source_word: σάρκα
  choice: carne
  rationale: Reproduz a força concreta e deliberadamente incisiva de σάρξ; “corpo” suavizaria a expressão e poderia introduzir terminologia sacramental não usada no texto grego.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: do Filho do Homem
  rationale: Preserva a designação tradicional de Jesus e suas ressonâncias bíblicas e messiânicas.
- source_word: πίητε
  choice: bebam
  rationale: Tradução direta que mantém o paralelismo vívido com “comam”.
- source_word: αἷμα
  choice: sangue
  rationale: Mantém a imagem forte do original sem explicação denominacional ou paráfrase.
- source_word: ζωὴν
  choice: vida
  rationale: O texto diz apenas “vida”, sem o adjetivo “eterna”; a tradução não acrescenta essa qualificação contextual.
- source_word: ἐν ἑαυτοῖς
  choice: em si mesmos
  rationale: Preserva a formulação reflexiva do grego e a ideia de possuir vida em si.
theological_decisions:
- issue: Se a linguagem de comer e beber deve ser traduzida literalmente ou interpretada à luz de leituras sacramentais e metafóricas
  choice: Manter “comam a carne ... e bebam o seu sangue” sem expansão interpretativa
  alternative: Empregar “participem”, “recebam” ou a formulação explicitamente eucarística “comam o corpo”
  rationale: A linguagem do versículo é concreta e provocadora. A tradução preserva a tensão entre possíveis dimensões sacramentais e metafóricas, sem decidir a questão em favor de uma tradição.
- issue: Se “vida” deve ser ampliada para “vida eterna” com base no contexto joanino
  choice: Manter “vida” no texto principal
  alternative: Traduzir “vida eterna”
  rationale: Embora o contexto mais amplo de João associe essa vida à vida eterna, αἰώνιος não aparece neste versículo; acrescentá-lo resolveria interpretativamente algo que o texto deixa implícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” torna explícito o plural de ὑμῖν e concorda naturalmente com “em si mesmos”. A construção “a menos que ... e ...” evita ambiguidade de escopo na condição negativa e preserva as duas ações coordenadas.
