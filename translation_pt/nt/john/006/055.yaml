  text: ἡ γὰρ σάρξ μου ⸀ἀληθής ἐστι βρῶσις, καὶ τὸ αἷμά μου ⸁ἀληθής ἐστι πόσις.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/055.yaml
  text: For my flesh is true food[a], and my blood is true drink.
translation:
  language: pt
  text: Pois a minha carne é verdadeira comida[a], e o meu sangue é verdadeira bebida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «comida real» e «bebida real».'
    reason: Alternativa lexical para ἀληθής, aplicado nos dois membros paralelos.
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Preserva a ligação explicativa com a declaração anterior e soa natural em português.
- source_word: σάρξ
  choice: carne
  rationale: Mantém o sentido literal e o paralelismo explícito entre a carne e o sangue de Jesus, sem substituí-lo pela opção interpretativa «corpo».
- source_word: ἀληθής
  choice: verdadeira
  rationale: Reproduz diretamente o adjetivo grego e preserva sua força no uso joanino sem impor a nuance mais interpretativa de «real».
- source_word: βρῶσις
  choice: comida
  rationale: Neste predicado, em paralelo com πόσις, designa aquilo que se come; «comida» é clara e corrente.
- source_word: αἷμα
  choice: sangue
  rationale: Tradução literal exigida pelo contexto e pelo paralelismo carne/sangue.
- source_word: πόσις
  choice: bebida
  rationale: Neste predicado, designa aquilo que se bebe e forma em português o paralelo natural com «comida».
theological_decisions:
- issue: Se ἀληθής deve ser traduzido como «verdadeira» ou como o termo mais interpretativo «real» no contexto eucarístico
  choice: verdadeira
  alternative: real
  rationale: «Verdadeira» acompanha mais diretamente o grego e conserva a tensão teológica do texto, sem decidir por tradução as controvérsias sobre suas implicações sacramentais.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de «verdadeira» foi mantida para refletir o paralelismo enfático do grego.
