  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Μὴ γογγύζετε μετ’ ἀλλήλων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/043.yaml
  text: Jesus answered and said to them[b][a], “Do not grumble among yourselves.”
translation:
  language: pt
  text: 'Jesus lhes respondeu: “Não murmurem entre vocês.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: respondeu
  rationale: A fórmula grega literalmente reúne ‘respondeu’ e ‘disse’. Em português atual, ‘respondeu’ comunica naturalmente a função discursiva sem a redundância pouco idiomática de ‘respondeu e disse’.
- source_word: Μὴ γογγύζετε
  choice: Não murmurem
  rationale: O presente imperativo com μή pode formular uma proibição geral ou pedir a interrupção de uma ação em curso. ‘Não murmurem’ preserva essa ambiguidade e a ressonância bíblica de γογγύζω, que denota queixa descontente em voz baixa.
- source_word: μετ’ ἀλλήλων
  choice: entre vocês
  rationale: A expressão indica ação recíproca dentro do grupo. ‘Entre vocês’ é natural, clara e amplamente compreensível em português moderno.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio grego.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e direto, com boa legibilidade brasileira. A construção evita reproduzir mecanicamente a fórmula semítica ‘respondeu e disse’, mas conserva a força de ‘murmurar’ e não decide se a ordem significa especificamente ‘parem de murmurar’ ou, de modo mais geral, ‘não murmurem’.
