id: JHN.6.11
reference: John 6:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔλαβεν ⸀οὖν τοὺς ἄρτους ὁ Ἰησοῦς καὶ εὐχαριστήσας ⸀διέδωκεν τοῖς ἀνακειμένοις, ὁμοίως καὶ ἐκ τῶν ὀψαρίων ὅσον ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/011.yaml
  text: So Jesus took the loaves[a], and after giving thanks he distributed them to those who were reclining; likewise also from the fish[b], as much as they wanted.
translation:
  language: pt
  text: Então Jesus pegou os pães e, depois de dar graças, os distribuiu aos que estavam recostados[a]. Fez o mesmo com os peixes[b], dando-lhes quanto queriam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sentados à mesa”. O grego diz mais literalmente “recostados”, a postura habitual para uma refeição.
    reason: lexical_alternative
  - marker: b
    text: Ou “peixinhos”. O termo grego pode se referir a peixe comido com pão, possivelmente peixe pequeno.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a progressão da narrativa de modo natural em português, sem impor uma conclusão lógica mais forte do que o contexto exige.
- source_word: τοὺς ἄρτους
  choice: os pães
  rationale: O plural se refere aos pães mencionados no contexto; em português, “os pães” é mais natural e preciso do que uma referência genérica a “pão”.
- source_word: εὐχαριστήσας
  choice: depois de dar graças
  rationale: Representa a ação anterior expressa pelo particípio aoristo e não acrescenta um objeto explícito que não consta do grego.
- source_word: διέδωκεν
  choice: os distribuiu
  rationale: Preserva o sentido distributivo do verbo, tendo “os pães” como objeto retomado naturalmente pelo pronome.
- source_word: τοῖς ἀνακειμένοις
  choice: aos que estavam recostados
  rationale: Mantém a referência à postura habitual durante uma refeição, em vez de reduzi-la simplesmente a estar sentado.
- source_word: ὁμοίως καὶ
  choice: Fez o mesmo
  rationale: Expressa com clareza e naturalidade o paralelismo enfático entre a distribuição dos pães e a dos peixes.
- source_word: ἐκ τῶν ὀψαρίων
  choice: com os peixes
  rationale: O termo pode designar peixes usados como acompanhamento, talvez pequenos, mas “peixes” evita especificidade incerta. A preposição é vertida idiomaticamente dentro da repetição elíptica da ação de distribuir.
- source_word: ὅσον ἤθελον
  choice: quanto queriam
  rationale: Comunica de maneira direta que receberam a quantidade que desejavam.
theological_decisions:
- issue: Possível ressonância eucarística de εὐχαριστήσας
  choice: “dar graças”, sem ampliação sacramental
  alternative: “abençoar” ou explicitar uma referência eucarística
  rationale: O verbo afirma que Jesus deu graças. Possíveis ecos eucarísticos pertencem à interpretação do contexto e não devem ser inseridos no texto traduzido.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em duas frases torna natural a elipse grega sem alterar a sequência das ações. “Recostados” preserva no texto principal o detalhe histórico da postura à mesa, explicado em nota.
