id: JHN.6.36
reference: John 6:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλ’ εἶπον ὑμῖν ὅτι καὶ ἑωράκατέ με καὶ οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/036.yaml
  text: But I told you that you have even seen me[a], and yet you do not believe.
translation:
  language: pt
  text: Mas eu lhes disse que vocês de fato me viram[a] e, mesmo assim, não creem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “vocês também me viram e não creem”.'
    reason: Alternativa lexical e sintática para os dois usos de καί.
lexical_decisions:
- source_word: ἀλλ’
  choice: Mas
  rationale: Marca o contraste com a afirmação anterior de Jesus e corresponde naturalmente ao adversativo grego.
- source_word: εἶπον ὑμῖν
  choice: eu lhes disse
  rationale: Expressa de modo natural em português o aoristo de λέγω com o objeto indireto plural.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo do que Jesus havia dito.
- source_word: καὶ ἑωράκατέ με
  choice: vocês de fato me viram
  rationale: O primeiro καί tem força enfática neste contexto; 'de fato' preserva essa ênfase sem converter explicitamente a construção em uma oração concessiva. O perfeito grego é vertido pelo pretérito perfeito, forma idiomática em português que apresenta o fato consumado e relevante no contexto.
- source_word: καὶ οὐ πιστεύετε
  choice: e, mesmo assim, não creem
  rationale: Mantém a coordenação por καί e torna claro o contraste retórico entre ver Jesus e continuar sem crer.
theological_decisions:
- issue: Força do primeiro καί em καὶ ἑωράκατέ με
  choice: vocês de fato me viram
  alternative: vocês até me viram; embora vocês tenham me visto
  rationale: A formulação escolhida comunica a ênfase do grego sem transformar silenciosamente a coordenação em concessão explícita; a nota registra uma alternativa mais formal.
- issue: Sentido de πιστεύετε
  choice: creem
  alternative: acreditam; têm fé
  rationale: '''Crer'' é o equivalente direto e tradicional de πιστεύω no Evangelho de João, sem restringir o termo a mero assentimento intelectual nem ampliá-lo por paráfrase.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'vocês' para o plural e 'lhes' como objeto indireto; 'não creem' preserva o registro bíblico corrente sem soar arcaico.
