id: JHN.6.24
reference: John 6:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδεν ὁ ὄχλος ὅτι Ἰησοῦς οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ, ἐνέβησαν αὐτοὶ εἰς τὰ ⸀πλοιάρια καὶ ἦλθον εἰς Καφαρναοὺμ ζητοῦντες τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/024.yaml
  text: So when the crowd saw that Jesus was not there[a], nor his disciples, they themselves got into the boats and came to Capernaum, looking for Jesus.
translation:
  language: pt
  text: Assim, quando a multidão viu que Jesus não estava ali, nem os seus discípulos, eles mesmos entraram nos barcos[a] e foram a Cafarnaum à procura de Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «barquinhos» ou «pequenos barcos»; o grego emprega uma forma diminutiva da palavra «barco».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Assim, quando
  rationale: Preserva tanto a sequência temporal de ὅτε como a ligação narrativa e consequencial de οὖν, em português natural.
- source_word: ὁ ὄχλος
  choice: a multidão
  rationale: Designa naturalmente o grupo reunido que vinha seguindo Jesus e mantém o valor coletivo do substantivo grego.
- source_word: εἶδεν
  choice: viu
  rationale: Traduz diretamente o verbo de percepção sem acrescentar a interpretação cognitiva mais forte de «percebeu».
- source_word: οὐκ ἔστιν ἐκεῖ
  choice: não estava ali
  rationale: O presente grego ocorre dentro de uma narrativa passada; o imperfeito em português faz a concordância temporal de modo natural.
- source_word: οὐδὲ οἱ μαθηταὶ αὐτοῦ
  choice: nem os seus discípulos
  rationale: 'Mantém de forma concisa a coordenação negativa: nem Jesus nem os discípulos estavam no lugar.'
- source_word: ἐνέβησαν
  choice: entraram
  rationale: No contexto de embarcações, «entraram nos barcos» comunica com clareza o ato de embarcar sem elevar desnecessariamente o registro.
- source_word: αὐτοὶ
  choice: eles mesmos
  rationale: 'Conserva a ênfase do pronome expresso: os integrantes da multidão tomaram pessoalmente a iniciativa de entrar nos barcos.'
- source_word: τὰ πλοιάρια
  choice: os barcos
  rationale: «Barcos» é a forma corrente no texto principal; o possível valor diminutivo de πλοιάριον é preservado em nota.
- source_word: ἦλθον εἰς Καφαρναούμ
  choice: foram a Cafarnaum
  rationale: Embora ἔρχομαι possa ser vertido por «vir», o ponto de vista narrativo em português favorece «foram», pois a multidão se desloca do local anterior para Cafarnaum.
- source_word: ζητοῦντες τὸν Ἰησοῦν
  choice: à procura de Jesus
  rationale: Expressa a ação concreta de tentar encontrá-lo, evitando que «buscando Jesus» adquira aqui um sentido espiritual não exigido pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém o encadeamento narrativo, a ênfase de αὐτοὶ e o sentido concreto da procura por Jesus. O marcador da nota foi colocado depois de «barcos», termo ao qual a variante lexical se refere.
