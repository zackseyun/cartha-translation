  yaml_path: translation/nt/john/006/068.yaml
  text: Simon Peter answered him[a], “Lord, to whom will we go? You have words of eternal life,”
translation:
  language: pt
  text: 'Simão Pedro lhe respondeu: “Senhor[a], para quem iremos? Tu tens palavras de vida eterna,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Mestre”. O título grego pode ser usado como forma respeitosa de tratamento; “Senhor” também preserva sua possível ressonância teológica neste contexto.
