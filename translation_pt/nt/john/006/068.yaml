lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: lhe respondeu
  rationale: Expressa de modo natural em português o verbo narrativo de resposta e o pronome dativo que se refere a Jesus.
- source_word: Σίμων Πέτρος
  choice: Simão Pedro
  rationale: Segue a forma tradicional e amplamente reconhecida do nome em português.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva tanto a forma respeitosa de tratamento quanto a possível ressonância cristológica do título no contexto joanino.
- source_word: πρὸς τίνα ἀπελευσόμεθα
  choice: para quem iremos?
  rationale: Mantém o futuro e o caráter pessoal da pergunta retórica, com formulação natural em português.
- source_word: ῥήματα ζωῆς αἰωνίου
  choice: palavras de vida eterna
  rationale: Preserva o plural ῥήματα e a expressão joanina ζωὴ αἰώνιος sem determinar além do texto a relação exata do genitivo.
- source_word: ἔχεις
  choice: tu tens
  rationale: Traduz diretamente a posse e conserva a segunda pessoa singular explícita, adequada ao tratamento solene dirigido a Jesus.
theological_decisions:
- issue: Força de Κύριε como forma de tratamento dirigida a Jesus
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” mantém o tratamento respeitoso e a ressonância cristológica possível em João, sem obrigar o leitor a escolher apenas um desses sentidos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase é natural, e o pronome “tu” preserva o singular explícito e o tom solene sem arcaísmo excessivo.
