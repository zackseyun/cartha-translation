  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ εἰσὶν ἐξ ὑμῶν τινες οἳ οὐ πιστεύουσιν. ᾔδει γὰρ ἐξ ἀρχῆς ὁ Ἰησοῦς τίνες εἰσὶν οἱ μὴ πιστεύοντες καὶ τίς ἐστιν ὁ παραδώσων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/064.yaml
  text: But there are some among you who do not believe[a]. For Jesus knew from the beginning who those were who did not believe[b], and who it was who would betray him.
translation:
  language: pt
  text: Mas há alguns entre vocês que não creem. Pois Jesus sabia, desde o princípio, quais eram os que não criam e quem o entregaria[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quem o trairia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Expressa naturalmente o contraste com a declaração anterior.
- source_word: ἐξ ὑμῶν
  choice: entre vocês
  rationale: Indica que essas pessoas pertenciam ao grupo ao qual Jesus se dirigia, em português natural.
- source_word: τινες
  choice: alguns
  rationale: Designa uma parte não especificada dos ouvintes.
- source_word: οἳ οὐ πιστεύουσιν
  choice: que não creem
  rationale: O presente exprime a incredulidade vigente; o presente simples é natural e preciso em português.
- source_word: ᾔδει
  choice: sabia
  rationale: O imperfeito de οἶδα descreve um estado de conhecimento no passado.
- source_word: ἐξ ἀρχῆς
  choice: desde o princípio
  rationale: Mantém a referência temporal sem definir indevidamente a qual princípio o texto se refere.
- source_word: οἱ μὴ πιστεύοντες
  choice: os que não criam
  rationale: Traduz o particípio substantivado de modo natural, identificando as pessoas caracterizadas pela incredulidade naquele contexto passado.
- source_word: παραδώσων
  choice: entregaria
  rationale: Preserva o sentido básico de entregar alguém e deixa que o contexto comunique a traição, evitando resolver no texto principal uma nuance lexical que pode ser explicitada em nota.
- source_word: αὐτόν
  choice: o
  rationale: Pronome objeto que retoma Jesus.
theological_decisions:
- issue: Sentido de πιστεύω na resposta dos discípulos a Jesus
  choice: crer
  alternative: confiar
  rationale: “Crer” é amplo e tradicional no uso joanino, preservando tanto a dimensão de assentimento quanto a relacional sem limitar o verbo a apenas uma delas.
- issue: Sentido de παραδίδωμι com referência a Judas
  choice: entregar
  alternative: trair
  rationale: “Entregar” representa diretamente o valor lexical do verbo e preserva a tensão entre o ato concreto de entregar Jesus e seu caráter de traição; a alternativa contextual aparece na nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Vocês” evita regionalismos mais marcados; “desde o princípio” conserva deliberadamente a ambiguidade temporal do grego.
