  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔλεγεν δὲ τὸν Ἰούδαν Σίμωνος ⸀Ἰσκαριώτου· οὗτος γὰρ ἔμελλεν ⸂παραδιδόναι αὐτόν⸃, ⸀εἷς ἐκ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/071.yaml
  text: He was speaking about Judas[a], the son of Simon Iscariot, for this one was about to betray him, being one of the Twelve.
translation:
  language: pt
  text: Ele estava falando de Judas, filho de Simão Iscariotes, pois era ele quem estava para traí-lo[a], sendo um dos Doze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “entregá-lo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ τὸν Ἰούδαν
  choice: Ele estava falando de Judas
  rationale: O imperfeito ἔλεγεν tem valor explicativo no contexto; em português, “estava falando de” expressa naturalmente a referência a Judas. δέ funciona como conexão leve e não precisa ser traduzido por uma palavra específica.
- source_word: Σίμωνος Ἰσκαριώτου
  choice: filho de Simão Iscariotes
  rationale: Os genitivos identificam Judas por sua relação filial com Simão, a quem “Iscariotes” qualifica na sintaxe grega.
- source_word: οὗτος γὰρ
  choice: pois era ele quem
  rationale: “Pois” conserva a explicação introduzida por γάρ, enquanto a construção focal “era ele quem” comunica a ênfase demonstrativa de οὗτος sem soar artificial.
- source_word: ἔμελλεν
  choice: estava para
  rationale: Preserva o sentido prospectivo de μέλλω sem acrescentar ideia explícita de destino ou intenção.
- source_word: παραδιδόναι αὐτόν
  choice: traí-lo
  rationale: No contexto da paixão segundo João, “trair” comunica de modo claro a força narrativa e relacional do ato; a tradução mais literal é registrada em nota.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: embora fosse um dos Doze
  rationale: A formulação idiomática destaca o contraste chocante de o traidor pertencer aos Doze. A concessão é contextual, não uma alteração da identidade expressa pelo grego.
theological_decisions:
- issue: Sentido de παραδιδόναι na ação de Judas
  choice: traí-lo
  alternative: entregá-lo
  rationale: O verbo pode significar literalmente “entregar”, mas, neste contexto, o ato de Judas constitui traição. A alternativa literal fica visível na nota para preservar a extensão lexical.
- issue: Relação entre a traição e a pertença aos Doze
  choice: embora fosse um dos Doze
  alternative: sendo um dos Doze
  rationale: A forma concessiva torna natural em português o contraste implícito na justaposição grega, sem explicar por que Judas agiu nem introduzir uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Os Doze” é mantido como designação reconhecível do grupo apostólico; evita-se um marcador discursivo inicial desnecessário.
