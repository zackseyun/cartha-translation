id: JHN.6.15
reference: John 6:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν γνοὺς ὅτι μέλλουσιν ἔρχεσθαι καὶ ἁρπάζειν αὐτὸν ἵνα ⸀ποιήσωσιν βασιλέα ἀνεχώρησεν ⸀πάλιν εἰς τὸ ὄρος αὐτὸς μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/015.yaml
  text: So Jesus[a], knowing that they were about to come and seize him in order to make him king, withdrew again to the mountain by himself.
translation:
  language: pt
  text: Então Jesus, sabendo que estavam prestes a vir buscá-lo à força para fazê-lo rei, retirou-se novamente, sozinho, para o monte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação e a consequência narrativa do episódio anterior de modo natural em português.
- source_word: γνοὺς
  choice: sabendo
  rationale: O particípio apresenta a percepção de Jesus como circunstância que motiva sua retirada.
- source_word: μέλλουσιν ἔρχεσθαι
  choice: estavam prestes a vir
  rationale: Expressa a iminência indicada por μέλλω com infinitivo.
- source_word: ἁρπάζειν
  choice: buscá-lo à força
  rationale: Neste contexto, o verbo indica apoderar-se de alguém mediante força; a formulação evita a leitura pouco natural de uma simples aproximação seguida de captura.
- source_word: ἵνα ποιήσωσιν βασιλέα
  choice: para fazê-lo rei
  rationale: Comunica de forma clara e concisa a finalidade expressa por ἵνα com o subjuntivo.
- source_word: ἀνεχώρησεν
  choice: retirou-se
  rationale: Expressa tanto o deslocamento quanto o afastamento deliberado da ação pretendida pela multidão.
- source_word: πάλιν
  choice: novamente
  rationale: Preserva a ideia de repetição sem sugerir uma localização não afirmada pelo texto.
- source_word: εἰς τὸ ὄρος
  choice: para o monte
  rationale: Mantém a referência definida ao terreno elevado já mencionado no contexto joanino.
- source_word: αὐτὸς μόνος
  choice: sozinho
  rationale: Em português corrente, 'sozinho' transmite naturalmente a ênfase conjunta de αὐτός e μόνος sem redundância artificial.
theological_decisions:
- issue: Natureza da ação pretendida pela multidão em relação à realeza de Jesus
  choice: buscá-lo à força para fazê-lo rei
  alternative: vir e apoderar-se dele para fazê-lo rei
  rationale: ἁρπάζειν apresenta a tentativa como coercitiva, não como mero convite ou coroação aceita; a tradução preserva essa tensão política sem acrescentar motivos não declarados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem final 'sozinho, para o monte' evita que 'sozinho' pareça qualificar o monte e conserva a ênfase da solidão de Jesus. Não há nota, pois a nuance coercitiva de ἁρπάζειν foi incorporada diretamente ao texto.
