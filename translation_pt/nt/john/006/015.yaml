  source_fidelity: 'O texto traduz adequadamente a progressão do grego: «Então» preserva a ligação narrativa de οὖν; «sabendo» exprime bem o particípio γνούς; «estavam prestes a vir» comunica a iminência de μέλλουσιν ἔρχεσθαι. «Buscá-lo à força» transmite de modo idiomático a ação coercitiva de ἁρπάζειν, e «para fazê-lo rei» mantém a finalidade expressa por ἵνα. «Retirou-se novamente ... para o monte» e «sozinho» refletem com fidelidade ἀνεχώρησεν, πάλιν, εἰς τὸ ὄρος e αὐτὸς μόνος.'
