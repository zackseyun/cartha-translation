id: JHN.6.12
reference: John 6:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς δὲ ἐνεπλήσθησαν λέγει τοῖς μαθηταῖς αὐτοῦ· Συναγάγετε τὰ περισσεύσαντα κλάσματα, ἵνα μή τι ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/012.yaml
  text: And when they were filled[a], he says to his disciples, “Gather up the leftover pieces[d][c][b], so that nothing may be lost.”
translation:
  language: pt
  text: 'Quando ficaram satisfeitos[a], ele diz[b] aos seus discípulos: “Recolham os pedaços que sobraram[c], para que nada se perca[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficaram saciados”; mais literalmente, “ficaram cheios”.
    reason: lexical_alternative
  - marker: b
    text: 'O grego emprega aqui o presente histórico: “diz”. Algumas traduções regularizam a narrativa com “disse”.'
    reason: lexical_alternative
  - marker: c
    text: Ou “os fragmentos que sobraram”; trata-se dos pedaços partidos do pão.
    reason: lexical_alternative
  - marker: d
    text: Ou “para que nada seja desperdiçado”. O grego diz mais literalmente “para que nada se perca”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Quando
  rationale: Expressa de modo natural a relação temporal e deixa a leve função narrativa de δέ implícita, como é comum em português.
- source_word: ἐνεπλήσθησαν
  choice: ficaram satisfeitos
  rationale: No contexto de uma refeição, comunica naturalmente que comeram até se saciar, sem perder a ideia de plenitude do verbo grego.
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico do texto grego, recurso narrativo também compreensível e natural em português.
- source_word: μαθηταῖς
  choice: discípulos
  rationale: É o equivalente tradicional, preciso e amplamente compreendido para μαθηταί nos Evangelhos.
- source_word: Συναγάγετε
  choice: Recolham
  rationale: Transmite com clareza a ordem direta de juntar os restos espalhados; é mais idiomático neste contexto do que uma reprodução mecânica de 'ajuntem'.
- source_word: τὰ περισσεύσαντα κλάσματα
  choice: os pedaços que sobraram
  rationale: Representa tanto os κλάσματα, pedaços partidos de pão, como o particípio περισσεύσαντα, aquilo que restou após a refeição.
- source_word: ἵνα μή τι ἀπόληται
  choice: para que nada se perca
  rationale: Preserva a formulação lexical do grego e sua possível ressonância joanina, sem impor aqui um sentido soteriológico; no contexto imediato, refere-se aos pedaços de alimento.
theological_decisions:
- issue: Possível leitura teológica de ἀπόληται no contexto do sinal
  choice: para que nada se perca
  alternative: para que nada seja desperdiçado
  rationale: O referente imediato são os pedaços de alimento, mas 'se perca' preserva a linguagem do original e permite eventual ressonância com outros usos joaninos sem explicitá-la nem eliminá-la.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. O presente histórico foi mantido para refletir o estilo narrativo de João. A tradução evita acrescentar um objeto como “pão” ao texto principal, embora o contexto e κλάσματα indiquem pedaços partidos de pão.
