  text: Ἐγόγγυζον οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι εἶπεν· Ἐγώ εἰμι ὁ ἄρτος ὁ καταβὰς ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/041.yaml
  text: So the Jews were grumbling about him because he said[a], “I am the bread that came down from heaven.”
translation:
  language: pt
  text: 'Os judeus então murmuravam a respeito dele, porque ele disse[a]: “Eu sou o pão que desceu do céu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os judeanos” ou, em alguns contextos, “os líderes judeus”. Em João, a expressão “os judeus” pode referir-se a um grupo específico que se opunha a Jesus, e não ao povo judeu como um todo.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγόγγυζον
  choice: começaram a murmurar
  rationale: O imperfeito retrata a murmuração em curso; em português, a construção ingressiva é natural neste ponto narrativo e mantém o sentido de queixa descontente de γογγύζω, além de evocar a murmuração no deserto.
- source_word: οὖν
  choice: Então
  rationale: Assinala a continuação narrativa e a consequência da declaração anterior sem impor uma dedução excessivamente formal.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: É a correspondência mais direta da expressão joanina e não restringe o referente a líderes nem introduz por si só um sentido geográfico. A nota esclarece que o contexto pode indicar um grupo específico, não todo o povo judeu.
- source_word: περὶ αὐτοῦ
  choice: contra ele
  rationale: Embora περί com genitivo tenha o sentido básico de 'a respeito de', com o verbo de murmurar o português idiomático pede 'murmurar contra'. A escolha expressa a orientação hostil da queixa sem ampliar seu conteúdo.
- source_word: ὅτι εἶπεν
  choice: porque havia dito
  rationale: ὅτι apresenta a causa da murmuração. O mais-que-perfeito composto torna clara, em português natural, a anterioridade da fala de Jesus em relação à reação narrada.
- source_word: Ἐγώ εἰμι
  choice: Eu sou
  rationale: Preserva a identificação enfática e direta do grego sem acrescentar interpretação.
- source_word: ὁ ἄρτος
  choice: o pão
  rationale: Mantém o artigo e identifica Jesus especificamente como 'o pão' no discurso.
- source_word: ὁ καταβὰς ἐκ τοῦ οὐρανοῦ
  choice: que desceu do céu
  rationale: A oração relativa traduz com clareza o particípio aoristo atributivo e preserva tanto o movimento de descida quanto a origem celestial.
theological_decisions:
- issue: Referente e tradução de οἱ Ἰουδαῖοι em João
  choice: os judeus no texto principal
  alternative: os judeus da Judeia; os líderes judeus
  rationale: A tradução conserva a formulação do grego sem restringir o referente além do que o versículo declara. A nota evita que a expressão seja tomada como generalização sobre todo o povo judeu, pois em João ela pode designar um grupo específico em oposição a Jesus.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Murmurar” conserva a ressonância bíblica da queixa no deserto sem ser arcaico; a nota previne uma leitura coletiva e antijudaica da expressão joanina.
