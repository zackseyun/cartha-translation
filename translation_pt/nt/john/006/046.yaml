revisions:
- from: Não que alguém tenha visto o Pai, a não ser aquele que vem de Deus[a]; ele viu o Pai.
  to: Não que alguém tenha visto o Pai, a não ser aquele que é de Deus[a]; esse viu o Pai.
  rationale: A revisão substitui o verbo de movimento «vem» por «é», correspondente ao particípio presente ὢν e capaz de conservar a relação expressa por παρὰ τοῦ θεοῦ sem estreitá-la. «Esse» torna perceptível, em português natural, a retomada enfática de οὗτος. A nota preserva as alternativas espaciais/pessoais sem impor uma interpretação metafísica.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:21:07Z'
review_pass:
  verdict: revise
  source_fidelity: A oração inicial e a exceção estão bem representadas. Contudo, «aquele que vem de Deus» altera o particípio presente ὁ ὢν («aquele que é/está») para um verbo de movimento. Embora «vem de» possa sugerir procedência, não preserva a forma nem a relação contínua expressas no grego. «Aquele que é de Deus» mantém a construção e sua ambiguidade de procedência/relação.
  naturalness: «Não que alguém tenha visto o Pai» e «a não ser» são naturais em português moderno. «Aquele que é de Deus» é claro, solene sem ser arcaico, e adequado ao registro joanino. «Esse viu o Pai» reproduz de modo legível a retomada enfática de οὗτος.
  terminology: «Pai» com maiúscula é apropriado para a referência titular a Deus. A nota deve apresentar as alternativas de παρά com genitivo sem converter a leitura principal em uma afirmação espacial exclusiva.
  issues:
  - severity: medium
    issue: «aquele que vem de Deus» para ὁ ὢν παρὰ τοῦ θεοῦ
    rationale: ὢν é o particípio presente de «ser/estar», e não um verbo de movimento. A formulação proposta introduz «vem», nuance dinâmica que o texto não declara. «Aquele que é de Deus» conserva melhor a relação caracterizadora e a possibilidade de procedência.
  - severity: low
    issue: Alternativas da nota formuladas como «que está na presença de Deus» e «que está com Deus»
    rationale: Essas formulações podem ser mantidas como possibilidades interpretativas, mas «junto de Deus» e «da presença de Deus» refletem mais diretamente a nuance locativa/de procedência de παρά com genitivo e deixam claro que não substituem o sentido principal.
  revised_text: Não que alguém tenha visto o Pai, a não ser aquele que é de Deus[a]; esse viu o Pai.
  revised_footnotes:
  - marker: a
    text: Ou «que vem da presença de Deus» ou «que está junto de Deus». A expressão grega pode indicar procedência e também proximidade pessoal.
    reason: lexical_alternative
