id: JHN.6.46
reference: John 6:46
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐχ ὅτι τὸν πατέρα ⸂ἑώρακέν τις⸃ εἰ μὴ ὁ ὢν παρὰ τοῦ θεοῦ, οὗτος ἑώρακεν τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/046.yaml
  text: Not that anyone has seen the Father[a], except the one who is from God; he has seen the Father.
translation:
  language: pt
  text: Não que alguém tenha visto o Pai, a não ser aquele que é de Deus[a]; esse viu o Pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «que vem da presença de Deus» ou «que está junto de Deus». A expressão grega pode indicar procedência e também proximidade pessoal.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: Não que
  rationale: Introduz uma ressalva esclarecedora em relação ao que precede, sem transformar a expressão em uma oração causal.
- source_word: τὸν πατέρα
  choice: o Pai
  rationale: Mantém o uso joanino de Deus como Pai e a forma titular corrente em português.
- source_word: ἑώρακέν τις
  choice: alguém tenha visto
  rationale: No contexto negativo, τις tem sentido indefinido; o perfeito indica uma visão realizada com relevância presente, expressa naturalmente pela locução com subjuntivo exigida por «não que».
- source_word: εἰ μὴ
  choice: a não ser
  rationale: Marca uma exceção, não uma condição, e soa natural no português contemporâneo.
- source_word: ὁ ὢν
  choice: aquele que vem
  rationale: Em conjunto com παρά seguido de genitivo, identifica a pessoa por sua procedência ou relação de origem; «vem de» comunica essa ideia com naturalidade, embora torne explícita a noção dinâmica contextual.
- source_word: παρὰ τοῦ θεοῦ
  choice: de Deus
  rationale: Preserva como sentido principal a procedência divina, sem excluir a possível nuance de proximidade pessoal, registrada em nota.
- source_word: οὗτος
  choice: ele
  rationale: Retoma de modo claro e natural «aquele que vem de Deus»; «esse» ou «este» seria mais enfático, porém menos fluente neste contexto.
- source_word: ἑώρακεν
  choice: viu
  rationale: O pretérito perfeito português expressa de modo idiomático a ação completa; a relevância duradoura decorre do contexto.
theological_decisions:
- issue: Relação daquele que vê o Pai com Deus em παρὰ τοῦ θεοῦ
  choice: aquele que vem de Deus
  alternative: aquele que está na presença de Deus; aquele que está com Deus
  rationale: A tradução principal expressa procedência e relação singular sem definir além do texto a natureza metafísica dessa relação. A nota conserva a possível nuance espacial e pessoal de παρά com genitivo.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. «Não que» conserva a correção do discurso anterior; «a não ser» apresenta com clareza a exceção. A repetição de «o Pai» foi mantida por corresponder à ênfase do grego.
