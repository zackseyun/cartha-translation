id: JHN.6.14
reference: John 6:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ οὖν ἄνθρωποι ἰδόντες ⸂ὃ ἐποίησεν σημεῖον⸃ ⸀ἔλεγον ὅτι Οὗτός ἐστιν ἀληθῶς ὁ προφήτης ὁ ἐρχόμενος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/014.yaml
  text: So when the people saw the sign that he had done[a], they were saying[b], “This truly is the Prophet who is coming into the world.”
translation:
  language: pt
  text: 'Assim, quando as pessoas viram o sinal que ele havia realizado[a], diziam: “Este é verdadeiramente o Profeta[b] que vem ao mundo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o milagre que ele havia realizado”. João usa regularmente “sinal” (σημεῖον) para destacar o significado revelador das obras de Jesus, e não apenas seu caráter milagroso.
    reason: lexical_alternative
  - marker: b
    text: “O Profeta” provavelmente se refere ao profeta esperado semelhante a Moisés (Deuteronômio 18:15–18).
    reason: cross_reference
lexical_decisions:
- source_word: οἱ οὖν ἄνθρωποι
  choice: Assim, quando as pessoas
  rationale: “As pessoas” expressa o sentido humano genérico de ἄνθρωποι no contexto da multidão; “assim” marca o desenvolvimento inferencial de οὖν, e “quando” integra naturalmente o particípio seguinte.
- source_word: ἰδόντες
  choice: viram
  rationale: O particípio aoristo é vertido naturalmente como verbo finito numa oração temporal, preservando a anterioridade contextual sem tornar a frase artificial.
- source_word: ὃ ἐποίησεν σημεῖον
  choice: o sinal que ele havia realizado
  rationale: “Sinal” preserva o uso teologicamente significativo de σημεῖον em João, enquanto “havia realizado” expressa com naturalidade a ação anterior à reação da multidão.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito indica fala em curso ou compartilhada pela multidão; “diziam” mantém esse aspecto sem exigir uma formulação mais pesada.
- source_word: ἀληθῶς
  choice: verdadeiramente
  rationale: Mantém a força enfática de reconhecimento genuíno presente no advérbio grego.
- source_word: ὁ προφήτης
  choice: o Profeta
  rationale: O artigo e o contexto apontam para uma figura profética esperada; a inicial maiúscula sinaliza o uso titular sem inserir no texto uma identificação explícita.
- source_word: ὁ ἐρχόμενος εἰς τὸν κόσμον
  choice: que vem ao mundo
  rationale: Reproduz de modo natural o particípio presente atributivo e a expressão joanina, sem definir em excesso sua temporalidade.
theological_decisions:
- issue: Identificação de “o Profeta”
  choice: “o Profeta”, sem identificação explícita no texto principal
  alternative: “o profeta semelhante a Moisés” ou “um profeta”
  rationale: A fala provavelmente alude ao profeta esperado de Deuteronômio 18:15–18, mas o grego diz apenas “o Profeta”; a tradução conserva tanto a alusão quanto a tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para fluidez narrativa, preservando o aspecto do imperfeito e o vocabulário joanino de “sinal”.
