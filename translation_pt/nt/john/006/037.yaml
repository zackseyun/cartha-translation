id: JHN.6.37
reference: John 6:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πᾶν ὃ δίδωσίν μοι ὁ πατὴρ πρὸς ἐμὲ ἥξει, καὶ τὸν ἐρχόμενον πρός ⸀με οὐ μὴ ἐκβάλω ἔξω,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/037.yaml
  text: All that the Father gives me will come to me[b][a], and the one who comes to me I will certainly not cast out.
translation:
  language: pt
  text: Tudo o que o Pai me dá virá a mim[a]; e aquele que vem a mim, de modo nenhum o expulsarei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego emprega aqui uma expressão coletiva no neutro singular. Também pode ser traduzida: «Tudo aquilo que o Pai me dá virá a mim».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «jamais o expulsarei». A expressão grega contém uma negação enfática.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὃ
  choice: Tudo o que
  rationale: Preserva a expressão coletiva neutra singular do grego sem a transformar explicitamente em «todos aqueles que», e soa natural em português.
- source_word: δίδωσίν μοι
  choice: me dá
  rationale: O presente simples corresponde ao presente grego e evita decidir se o ato de dar deve ser entendido como contínuo ou já concluído.
- source_word: ὁ πατήρ
  choice: o Pai
  rationale: Mantém o artigo e o uso joanino, sem acrescentar o possessivo «meu», ausente no grego.
- source_word: πρὸς ἐμὲ ἥξει
  choice: virá a mim
  rationale: Expressa de maneira natural o movimento em direção a Jesus e conserva a formulação teológica característica do contexto.
- source_word: τὸν ἐρχόμενον πρός με
  choice: aquele que vem a mim
  rationale: Representa de perto o particípio presente substantivado, mantendo seu sentido genérico sem o ampliar para uma formulação mais interpretativa.
- source_word: οὐ μὴ ἐκβάλω ἔξω
  choice: de modo nenhum o expulsarei
  rationale: «De modo nenhum» comunica a negação enfática de οὐ μή; «expulsarei» preserva a ideia de lançar para fora, enquanto o pronome «o» retoma naturalmente «aquele».
theological_decisions:
- issue: A expressão coletiva neutra πᾶν ὃ em relação ao ato do Pai de dar e ao vir a Jesus
  choice: Tudo o que o Pai me dá
  alternative: Todos aqueles que o Pai me dá
  rationale: A tradução conserva a forma coletiva neutra do grego e não decide se a ênfase teológica recai sobre um grupo considerado coletivamente ou sobre pessoas individualmente.
- issue: A força da promessa expressa por οὐ μὴ ἐκβάλω ἔξω
  choice: de modo nenhum o expulsarei
  alternative: jamais o expulsarei
  rationale: A formulação mantém a forte garantia dada por Jesus sem a expandir para conclusões doutrinárias posteriores sobre perseverança ou apostasia.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Tudo o que» mantém a forma coletiva sem soar artificial; «de modo nenhum» conserva a ênfase solene da promessa.
