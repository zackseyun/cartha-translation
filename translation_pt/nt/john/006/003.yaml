  text: Then Jesus went up on the mountain, and there he sat with his disciples.
translation:
  language: pt
  text: Então Jesus subiu ao monte e ali estava sentado com seus discípulos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνῆλθεν
  choice: subiu
  rationale: O aoristo de ἀνέρχομαι descreve aqui o movimento geográfico comum de subir; “subiu” é natural e preciso em português.
- source_word: δὲ
  choice: Então
  rationale: Aqui δέ dá continuidade à narrativa, sem indicar contraste forte; “Então” comunica bem essa progressão.
- source_word: εἰς τὸ ὄρος
  choice: ao monte
  rationale: Com ἀνῆλθεν, a expressão indica subir até o monte ou sua encosta. “Ao monte” preserva o movimento e o artigo definido sem sugerir entrada no interior da montanha.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: ἐκεῖ
  choice: ali
  rationale: Advérbio locativo natural, que retoma o monte mencionado imediatamente antes.
- source_word: ἐκάθητο
  choice: se sentou
  rationale: Neste contexto narrativo, a forma comunica naturalmente que Jesus tomou assento; o aspecto imperfeito também pode ser entendido como “estava sentado”, mas o fluxo da cena favorece “se sentou”.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: com os seus discípulos
  rationale: μετά com genitivo significa “com”; “discípulos” preserva a relação de aprendizes e seguidores de um mestre característica dos Evangelhos.
