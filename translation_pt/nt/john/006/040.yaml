  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτο ⸀γάρ ἐστιν τὸ θέλημα τοῦ ⸂πατρός μου⸃ ἵνα πᾶς ὁ θεωρῶν τὸν υἱὸν καὶ πιστεύων εἰς αὐτὸν ἔχῃ ζωὴν αἰώνιον, καὶ ἀναστήσω αὐτὸν ⸀ἐγὼ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/040.yaml
  text: 'For this is the will of my Father: that everyone who sees the Son and believes in him may have eternal life[b][a], and I myself will raise him up on the last day.'
translation:
  language: pt
  text: 'Pois esta é a vontade de meu Pai: que todo aquele que vê o Filho[a] e nele crê tenha a vida eterna; e eu mesmo o ressuscitarei no último dia.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que contempla o Filho”. O verbo grego pode indicar um olhar atento, não apenas o ato físico de ver.
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir simplesmente “e eu o ressuscitarei”. O grego traz explicitamente o pronome “eu”, dando-lhe ênfase.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γάρ ἐστιν
  choice: Pois esta é
  rationale: “Pois” preserva a função explicativa de γάρ, ligando o versículo à declaração anterior, e “esta é” representa diretamente τοῦτο ἐστιν.
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: a vontade de meu Pai
  rationale: “Vontade” é a equivalência mais direta e transparente para θέλημα. “Pai” preserva o título relacional dado a Deus no contexto.
- source_word: ἵνα
  choice: que
  rationale: Depois de “esta é a vontade”, “que” introduz de modo natural em português o conteúdo da vontade, sem eliminar por completo a nuance de propósito presente na construção grega.
- source_word: πᾶς ὁ θεωρῶν
  choice: todo aquele que vê
  rationale: A construção com particípio articulado tem sentido genérico. “Vê” é claro e atual; a nota registra que θεωρέω pode indicar um olhar atento, e não apenas visão física.
- source_word: τὸν υἱόν
  choice: o Filho
  rationale: No contexto joanino, a expressão funciona como título cristológico; a inicial maiúscula preserva esse valor.
- source_word: καὶ πιστεύων εἰς αὐτόν
  choice: e nele crê
  rationale: πιστεύω com εἰς expressa fé ou confiança dirigida a uma pessoa. “Nele crê” é idiomático, conciso e mantém a formulação característica de João.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: tenha a vida eterna
  rationale: “Tenha” preserva o subjuntivo regido por ἵνα. “Vida eterna” é a expressão portuguesa natural e conserva tanto a dimensão duradoura quanto a qualidade teológica do conceito joanino.
- source_word: καὶ ἀναστήσω αὐτὸν ἐγώ
  choice: e eu mesmo o ressuscitarei
  rationale: “Ressuscitarei” comunica sem ambiguidade a ação escatológica de ἀνίστημι neste contexto. “Eu mesmo” preserva a ênfase do pronome explícito ἐγώ.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: no último dia
  rationale: É a forma temporal mais natural em português atual e representa diretamente a expressão grega.
theological_decisions:
- issue: Alcance e condição em πᾶς ὁ θεωρῶν ... καὶ πιστεύων
  choice: que todo aquele que vê o Filho e nele crê tenha a vida eterna
  alternative: que quem contempla o Filho e nele crê tem a vida eterna
  rationale: A tradução mantém a formulação genérica que caracteriza as pessoas por verem e crerem, sem introduzir uma explicação denominacional sobre eleição ou livre-arbítrio. O subjuntivo “tenha” acompanha a estrutura ἵνα + subjuntivo.
- issue: Ênfase de ἐγώ em καὶ ἀναστήσω αὐτὸν ἐγώ
  choice: e eu mesmo o ressuscitarei
  alternative: e eu o ressuscitarei
  rationale: “Eu mesmo” conserva a ênfase expressa pelo pronome grego sem acrescentar conteúdo doutrinário, destacando a atuação pessoal de Jesus na promessa da ressurreição.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construções naturais para leitores brasileiros. “Crê” mantém o registro bíblico sem soar arcaico; “ressuscitarei” é mais claro em português do que o decalque “levantarei” neste contexto escatológico.
