  text: ⸀ἀλλὰ ἦλθεν ⸀πλοιάρια ἐκ Τιβεριάδος ἐγγὺς τοῦ τόπου ὅπου ἔφαγον τὸν ἄρτον εὐχαριστήσαντος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/023.yaml
  text: But boats came from Tiberias near the place where they ate the bread after the Lord had given thanks[a].
translation:
  language: pt
  text: Mas barcos de Tiberíades chegaram perto do lugar onde comeram o pão, depois que o Senhor deu graças.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «vieram de Tiberíades pequenos barcos». A palavra grega πλοιάρια é uma forma diminutiva.
    reason: Registra a nuance morfológica de πλοιάρια sem tornar o texto principal menos natural.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca o contraste com a situação anterior de modo direto e natural.
- source_word: ἦλθεν
  choice: vieram
  rationale: O aoristo de ἔρχομαι relata a chegada; o plural em português concorda naturalmente com «alguns barcos».
- source_word: πλοιάρια
  choice: alguns barcos
  rationale: O substantivo diminutivo pode indicar barcos pequenos, mas «barcos» é mais natural no texto; a nuance diminutiva fica registrada em nota.
- source_word: ἐκ Τιβεριάδος
  choice: de Tiberíades
  rationale: Expressa de forma idiomática o lugar de origem.
- source_word: ἐγγὺς τοῦ τόπου
  choice: para perto do lugar
  rationale: Ligado ao verbo de movimento, expressa que os barcos vieram até as proximidades do lugar.
- source_word: ὅπου ἔφαγον τὸν ἄρτον
  choice: onde comeram o pão
  rationale: Mantém o aoristo de modo natural e identifica o pão já mencionado no contexto.
- source_word: εὐχαριστήσαντος τοῦ κυρίου
  choice: depois que o Senhor deu graças
  rationale: Representa a ação anterior do particípio aoristo e preserva κύριος como título cristológico sem explicitação adicional.
theological_decisions:
- issue: Tradução de κύριος
  choice: o Senhor
  alternative: o mestre
  rationale: «Senhor» preserva o peso honorífico e cristológico do título aplicado a Jesus, sem reduzir seu sentido a uma função meramente social.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para evitar que «de Tiberíades» pareça modificar o substantivo em vez de indicar a origem do movimento.
