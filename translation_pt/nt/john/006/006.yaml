id: JHN.6.6
reference: John 6:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἔλεγεν πειράζων αὐτόν, αὐτὸς γὰρ ᾔδει τί ἔμελλεν ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/006.yaml
  text: But he was saying this to test him[a], for he himself knew what he was about to do.
translation:
  language: pt
  text: Mas dizia isso para pôr Filipe à prova[a], pois ele mesmo sabia o que estava para fazer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para testá-lo”. O verbo também pode significar “tentar”, mas aqui o sentido é pôr à prova.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: isso
  rationale: O demonstrativo retoma a pergunta feita por Jesus no versículo anterior; em português, “isso” é a retomada anafórica mais natural.
- source_word: δὲ
  choice: Mas
  rationale: Marca um contraste leve entre a pergunta dirigida a Filipe e a explicação do narrador sobre a intenção de Jesus.
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito grego é preservado pelo imperfeito português, que apresenta a fala em seu desenvolvimento narrativo.
- source_word: πειράζων αὐτόν
  choice: para pôr Filipe à prova
  rationale: O particípio expressa propósito ou circunstância. No contexto, significa testar ou provar, não induzir ao mal. A explicitação de Filipe evita a ambiguidade pronominal criada pelo uso de “ele” para Jesus na oração seguinte.
- source_word: αὐτὸς
  choice: ele mesmo
  rationale: Preserva a ênfase do pronome grego explícito, destacando que o próprio Jesus já sabia o que faria.
- source_word: γὰρ
  choice: pois
  rationale: Introduz de modo natural a explicação da ação de Jesus.
- source_word: ᾔδει
  choice: sabia
  rationale: Embora tenha forma histórica associada ao perfeito de οἶδα, funciona como estado passado; “sabia” é a equivalência idiomática em português.
- source_word: τί
  choice: o que
  rationale: Introduz naturalmente em português o conteúdo daquilo que Jesus sabia.
- source_word: ἔμελλεν ποιεῖν
  choice: estava para fazer
  rationale: Conserva o sentido prospectivo de μέλλω com infinitivo, sem decidir rigidamente entre ação iminente e intenção.
theological_decisions:
- issue: Sentido de πειράζων na ação de Jesus para com Filipe
  choice: para pôr Filipe à prova
  alternative: para tentá-lo
  rationale: O contexto descreve uma prova da compreensão ou da fé de Filipe, não um incentivo ao mal. A tradução mantém o sentido contextual do verbo sem apagar sua amplitude lexical, registrada em nota.
- issue: Ênfase no conhecimento prévio de Jesus
  choice: ele mesmo sabia
  alternative: ele sabia
  rationale: O pronome αὐτός é enfático e apresenta Jesus como consciente do que faria, sem acrescentar uma formulação doutrinária que ultrapasse o texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Pôr à prova” é idiomático e evita que “tentar” seja entendido exclusivamente como indução ao pecado. O nome “Filipe” foi explicitado para manter a referência inequívoca entre os dois referentes masculinos.
