    issue: A expressão «que sobraram para os que tinham comido» é pouco idiomática e pode comunicar uma relação de destinatário enganosa.
    rationale: O dativo grego τοῖς βεβρωκόσιν é difícil de reproduzir literalmente em português. No fluxo narrativo, descreve os pedaços que excederam após os comensais terem comido; «para os que tinham comido» soa como se os restos fossem destinados a eles.
  revised_text: Então eles os recolheram e encheram doze cestos com os pedaços[a] dos cinco pães de cevada que sobraram depois que todos comeram.[b]
