  yaml_path: translation/nt/john/006/013.yaml
  text: So they gathered them[b][a], and filled twelve baskets with pieces from the five barley loaves left over by those who had eaten.
translation:
  language: pt
  text: Então eles os recolheram e encheram doze cestos com os pedaços[a] dos cinco pães de cevada que sobraram depois que todos comeram.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «fragmentos».
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «que sobraram para os que tinham comido»; isto é, os pedaços que restaram após a refeição.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγον
  choice: eles os recolheram
  rationale: O aoristo descreve a ação dos discípulos de recolher os pedaços; o pronome explicita em português o objeto subentendido pelo contexto.
- source_word: οὖν
  choice: Por isso
  rationale: Preserva a consequência da ordem dada por Jesus no versículo anterior, em linguagem natural e clara.
- source_word: ἐγέμισαν
  choice: encheram
  rationale: Tradução direta do aoristo; o sujeito continua sendo os discípulos.
- source_word: δώδεκα κοφίνους
  choice: doze cestos
  rationale: Κόφινος designa um cesto; a tradução evita especificar tamanho ou formato não exigidos pelo texto.
- source_word: κλασμάτων
  choice: pedaços
  rationale: No contexto, refere-se aos pedaços de pão resultantes da repartição. «Pedaços» é corrente e inteligível; «fragmentos» permanece uma alternativa possível.
- source_word: ἐκ τῶν πέντε ἄρτων τῶν κριθίνων
  choice: dos cinco pães de cevada
  rationale: Mantém a origem dos pedaços e identifica com clareza o cereal dos pães.
- source_word: ἃ ἐπερίσσευσαν
  choice: que sobraram
  rationale: Reproduz de modo natural o sentido de exceder ou permanecer em abundância, sem apagar a relação expressa pela oração relativa.
- source_word: τοῖς βεβρωκόσιν
  choice: para os que tinham comido
  rationale: Conserva a forma dativa do grego e o valor anterior do particípio perfeito, embora a relação exata entre o excedente e os que comeram admita expressão idiomática diferente em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação preserva a construção menos habitual «sobraram para os que tinham comido» no texto principal para não substituir silenciosamente o dativo grego por uma interpretação causal; a nota esclarece o sentido contextual.
