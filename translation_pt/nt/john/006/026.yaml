id: JHN.6.26
reference: John 6:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν, ζητεῖτέ με οὐχ ὅτι εἴδετε σημεῖα ἀλλ’ ὅτι ἐφάγετε ἐκ τῶν ἄρτων καὶ ἐχορτάσθητε·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/026.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you, you are seeking me not because you saw signs, but because you ate of the loaves and were filled.
translation:
  language: pt
  text: 'Jesus lhes respondeu: “Em verdade, em verdade lhes digo: vocês estão me procurando, não porque viram sinais, mas porque comeram dos pães e ficaram satisfeitos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: Jesus lhes respondeu
  rationale: A fórmula grega literalmente duplica a introdução da fala (‘respondeu... e disse’). Em português natural, ‘lhes respondeu’ representa adequadamente o ato de fala sem redundância.
- source_word: Ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Preserva a repetição solene característica de Jesus no Evangelho de João e comunica com clareza o valor asseverativo de ἀμήν.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Formulação corrente e digna, correspondente ao presente λέγω e ao pronome plural ὑμῖν.
- source_word: ζητεῖτέ με
  choice: vocês estão me procurando
  rationale: A forma progressiva exprime a ação presente em curso; ‘procurando’ é natural em português e mantém o sentido de buscar Jesus.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: não porque... mas porque
  rationale: Reproduz claramente o contraste entre as razões ou motivações indicado pela construção grega.
- source_word: εἴδετε σημεῖα
  choice: viram sinais
  rationale: ‘Viram’ não acrescenta a ideia de compreensão espiritual, e ‘sinais’ preserva o vocabulário teologicamente significativo de João.
- source_word: ἐφάγετε ἐκ τῶν ἄρτων
  choice: comeram dos pães
  rationale: ‘Dos pães’ conserva tanto o plural de ἄρτων quanto a força partitiva de ἐκ, com expressão idiomática em português.
- source_word: ἐχορτάσθητε
  choice: ficaram satisfeitos
  rationale: O verbo passivo indica que comeram até a saciedade. ‘Ficaram satisfeitos’ é claro e natural, evitando a possível leitura exclusivamente física ou espacial de ‘ficaram cheios’.
theological_decisions:
- issue: Sentido de σημεῖα no contexto joanino
  choice: sinais
  alternative: milagres; sinais milagrosos
  rationale: Em João, os feitos de Jesus apontam para sua identidade e significado. ‘Sinais’ conserva essa dimensão reveladora sem inserir explicação adicional no texto.
- issue: Natureza da crítica de Jesus à multidão
  choice: O texto contrasta a percepção dos sinais com a satisfação obtida ao comer
  alternative: Explicitar que a multidão não compreendeu espiritualmente os milagres
  rationale: A tradução mantém o contraste formulado no grego, sem acrescentar uma interpretação explícita sobre a compreensão interior da multidão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa ‘vocês’ para o plural, enquanto ‘lhes digo’ preserva naturalidade e solenidade. A pontuação apresenta a fala de modo fluente e não reproduz mecanicamente a introdução dupla do grego.
