review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a construção participial, o conhecimento interior de Jesus, a murmuração dos discípulos e a pergunta final. Contudo, εἶπεν significa diretamente “disse-lhes”; “perguntou-lhes” explicita a função interrogativa, mas deixa de representar o verbo narrativo empregado no grego.
  naturalness: O texto é claro e de registro moderno. “Em seu íntimo” comunica de modo mais natural em português atual o valor de ἐν ἑαυτῷ do que “em si mesmo”, sem perder a ideia de conhecimento não obtido por informação externa. “Faz vocês tropeçarem?” é compreensível e preserva a metáfora.
  terminology: “Murmuravam” é apropriado para γογγύζουσιν. A opção principal “faz vocês tropeçarem” preserva a força metafórica de σκανδαλίζει, e a nota com “ofende vocês” registra uma alternativa idiomática legítima sem resolver a nuance teológica.
