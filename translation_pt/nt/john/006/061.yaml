  text: εἰδὼς δὲ ὁ Ἰησοῦς ἐν ἑαυτῷ ὅτι γογγύζουσιν περὶ τούτου οἱ μαθηταὶ αὐτοῦ εἶπεν αὐτοῖς· Τοῦτο ὑμᾶς σκανδαλίζει;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/061.yaml
  text: But Jesus[a], knowing in himself that his disciples were grumbling about this, said to them, “Does this offend you?"
translation:
  language: pt
  text: 'Mas Jesus, sabendo em seu íntimo que seus discípulos murmuravam a respeito disso, disse-lhes: “Isso faz vocês tropeçarem?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Isso ofende vocês?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: sabendo
  rationale: Preserva de modo natural o valor circunstancial e simultâneo do particípio, sem tornar a sintaxe pesada.
- source_word: ἐν ἑαυτῷ
  choice: em si mesmo
  rationale: Mantém a ideia de que Jesus tinha esse conhecimento interiormente, e não por informação externa.
- source_word: γογγύζουσιν
  choice: murmuravam
  rationale: Expressa fala baixa e descontente; o imperfeito português se ajusta ao contexto narrativo, embora o grego empregue o presente histórico.
- source_word: περὶ τούτου
  choice: a respeito disso
  rationale: Retoma de forma clara e natural o conteúdo do discurso anterior sem acrescentar uma explicação ausente no grego.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: os seus discípulos
  rationale: É uma formulação idiomática que não restringe o grupo aos Doze.
- source_word: Τοῦτο
  choice: isso
  rationale: O demonstrativo retoma o que Jesus acabara de dizer; “isso” é a escolha mais natural nesse diálogo em português.
- source_word: σκανδαλίζει
  choice: faz vocês tropeçarem
  rationale: Preserva a metáfora e a possibilidade mais forte de que as palavras de Jesus levem os discípulos à rejeição ou ao abandono, sem reduzir o verbo a mero desagrado emocional.
theological_decisions:
- issue: Sentido de σκανδαλίζει diante da possível rejeição do ensino de Jesus
  choice: Isso faz vocês tropeçarem?
  alternative: Isso ofende vocês?
  rationale: O verbo pode indicar tanto causar ofensa quanto levar alguém a tropeçar ou afastar-se. A tradução principal conserva a metáfora e a tensão teológica; a nota registra a alternativa idiomática ligada à reação de ofensa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês” adequado à legibilidade brasileira. “Murmuravam” preserva o tom de descontentamento velado; “faz vocês tropeçarem” mantém a força metafórica do grego.
