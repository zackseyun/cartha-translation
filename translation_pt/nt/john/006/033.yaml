id: JHN.6.33
reference: John 6:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ γὰρ ἄρτος τοῦ θεοῦ ἐστιν ὁ καταβαίνων ἐκ τοῦ οὐρανοῦ καὶ ζωὴν διδοὺς τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/033.yaml
  text: For the bread of God is the one who comes down from heaven and gives life to the world[a].
translation:
  language: pt
  text: Pois o pão de Deus é aquele que desce do céu e dá vida ao mundo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquilo que desce do céu e dá vida ao mundo”. A construção grega pode ser entendida de modo mais impessoal, mas os particípios masculinos favorecem uma referência pessoal.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρτος
  choice: pão
  rationale: Preserva o sentido concreto primário e a metáfora central do discurso, sem generalizá-lo como “alimento”.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Mantém a forma genitiva e deixa o contexto desenvolver as ideias possíveis de pertença e origem.
- source_word: ὁ καταβαίνων
  choice: aquele que desce
  rationale: Os particípios substantivados estão no masculino singular e favorecem uma referência pessoal; “desce” é natural em português e conserva o aspecto presente.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: do céu
  rationale: Expressão idiomática em português que preserva a ideia de origem indicada por ἐκ com o genitivo.
- source_word: ζωὴν
  choice: vida
  rationale: Retém o termo simples e teologicamente central no Evangelho de João.
- source_word: διδοὺς
  choice: dá
  rationale: Coordena naturalmente a ação com “desce” e expressa sua ação característica e contínua.
- source_word: τῷ κόσμῳ
  choice: ao mundo
  rationale: Preserva a amplitude do termo joanino κόσμος, sem restringi-lo antecipadamente a uma categoria teológica mais estreita.
- source_word: γὰρ
  choice: Pois
  rationale: Sinaliza de modo claro e digno que a frase fundamenta ou explica a afirmação anterior.
theological_decisions:
- issue: Referência pessoal ou impessoal em ὁ καταβαίνων ... καὶ ζωὴν διδοὺς
  choice: 'Usar linguagem pessoal: “aquele que desce do céu e dá vida ao mundo”.'
  alternative: “aquilo que desce do céu e dá vida ao mundo”
  rationale: Embora “pão” seja masculino também em português, a decisão se apoia sobretudo nos particípios gregos masculinos substantivados, que favorecem um referente pessoal e antecipam a identificação de Jesus, sem acrescentá-la explicitamente.
- issue: Alcance de κόσμος
  choice: Manter “mundo”.
  alternative: “humanidade” ou “todas as pessoas”
  rationale: “Mundo” conserva a formulação e a amplitude teológica do texto, sem resolver debates posteriores sobre o alcance ou a aplicação da vida concedida.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pois” mantém a ligação explicativa; “aquele que desce” soa natural e preserva a força pessoal da construção grega.
