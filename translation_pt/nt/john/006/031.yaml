id: JHN.6.31
reference: John 6:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν τὸ μάννα ἔφαγον ἐν τῇ ἐρήμῳ, καθώς ἐστιν γεγραμμένον· Ἄρτον ἐκ τοῦ οὐρανοῦ ἔδωκεν αὐτοῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/031.yaml
  text: 'Our fathers ate the manna in the wilderness[b][a], just as it is written: ‘He gave them bread from heaven to eat.’'
translation:
  language: pt
  text: 'Nossos pais[a] comeram o maná no deserto[b], como está escrito: “Ele lhes deu pão do céu para comer.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Nossos antepassados”. O grego diz literalmente “Nossos pais”.
    reason: lexical_alternative
  - marker: b
    text: O termo também pode ser traduzido como “região desabitada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: Nossos pais
  rationale: Preserva a forma masculina e o sentido literal do grego, enquanto o contexto deixa claro que se trata dos antepassados de Israel.
- source_word: τὸ μάννα
  choice: o maná
  rationale: “Maná” é a forma tradicional e natural em português para o alimento dado durante a peregrinação de Israel; o artigo aponta para essa provisão conhecida.
- source_word: ἔφαγον
  choice: comeram
  rationale: Traduz diretamente o aoristo indicativo, apresentando o ato como acontecimento passado.
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: “Deserto” é a expressão corrente em português no contexto do êxodo e comunica adequadamente o sentido de ἔρημος.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: como está escrito
  rationale: É a fórmula bíblica natural em português para introduzir uma citação das Escrituras e preserva a ideia de um texto que permanece escrito.
- source_word: Ἄρτον
  choice: pão
  rationale: Traduz o termo comum para pão sem sugerir um pão individual ou acrescentar interpretação cristológica.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: do céu
  rationale: Expressa naturalmente em português a procedência celestial indicada por ἐκ.
- source_word: ἔδωκεν αὐτοῖς φαγεῖν
  choice: Ele lhes deu ... para comer
  rationale: Mantém a construção com o destinatário e o infinitivo, em português claro e próximo da sintaxe grega.
theological_decisions:
- issue: Apresentação da citação sobre o maná sem antecipar a interpretação cristológica posterior
  choice: Manter “pão” em minúscula e traduzir a fala como uma afirmação histórica e escriturística sobre a dádiva celestial.
  alternative: Empregar maiúscula ou ampliar a formulação para identificar desde já o pão com Jesus.
  rationale: Neste ponto, os interlocutores citam a provisão de maná no deserto. A identificação cristológica deve surgir do desenvolvimento posterior do discurso, não ser inserida na fala deles.
- issue: Sujeito implícito de ἔδωκεν
  choice: Explicitar com o pronome “Ele”, sem identificar nominalmente o sujeito.
  alternative: 'Traduzir “Deus lhes deu” ou omitir o pronome: “Deu-lhes”.'
  rationale: O grego não nomeia o sujeito. “Ele” reproduz a forma da citação com clareza em português e evita acrescentar um nome ausente do texto, embora o referente divino seja evidente no contexto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. A formulação conserva o caráter de citação bíblica sem arcaísmos desnecessários.
