  yaml_path: translation/nt/john/006/048.yaml
  text: I am the bread of life.
translation:
  language: pt
  text: Eu sou o pão da vida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: Eu sou
  rationale: O pronome explícito ἐγώ, unido a εἰμι, forma uma autodeclaração enfática. “Eu sou” é a expressão natural em português e preserva a identificação direta sem acrescentar “eu mesmo”.
- source_word: ὁ ἄρτος
  choice: o pão
  rationale: Preserva o artigo definido e a imagem ampla de ἄρτος. “Pão” é mais natural e adequado ao sentido metafórico do que “pedaço de pão” ou “pão inteiro”.
- source_word: τῆς ζωῆς
  choice: da vida
  rationale: Mantém de forma concisa a relação genitiva do grego e a expressão joanina, sem explicá-la interpretativamente como “que dá vida”.
theological_decisions:
- issue: Força da declaração “Eu sou” na cristologia joanina
  choice: Eu sou
  alternative: Eu mesmo sou
  rationale: Aqui ἐγώ εἰμι recebe o predicativo “o pão da vida”; não é uma fórmula absoluta. A tradução preserva a forte autoidentificação de Jesus sem inserir uma explicação teológica ausente do texto.
- issue: Sentido do genitivo “da vida”
  choice: Preservar a formulação compacta “da vida”
  alternative: o pão que dá vida
  rationale: O genitivo pode envolver a ideia de pão que comunica ou sustenta a vida, mas a formulação literal preserva a amplitude e a tensão da metáfora sem escolher apenas uma explicação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. A redação mantém a forma tradicional por coincidir de modo direto e idiomático com o grego.
