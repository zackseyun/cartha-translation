  text: ἀπεκρίθη ⸀ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ ἔργον τοῦ θεοῦ ἵνα ⸀πιστεύητε εἰς ὃν ἀπέστειλεν ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/029.yaml
  text: 'Jesus answered and said to them[b][a], “This is the work of God: that you believe in the one whom he has sent.”'
translation:
  language: pt
  text: 'Jesus lhes respondeu: “A obra de Deus[a] é esta: que vocês creiam[b] naquele que ele enviou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a obra que Deus requer” ou “a obra que Deus realiza”. A expressão grega “a obra de Deus” pode ser entendida de mais de uma maneira; a redação do texto preserva essa ambiguidade.
    reason: alternative_reading
  - marker: b
    text: Ou “confiem naquele que ele enviou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς
  choice: Jesus lhes respondeu
  rationale: Em português, “respondeu” expressa naturalmente a fórmula narrativa grega “respondeu e disse”, evitando uma duplicação pouco idiomática sem perda de sentido.
- source_word: Τοῦτό ἐστιν
  choice: é esta
  rationale: Preserva a ênfase do demonstrativo e concorda naturalmente com “a obra” em português.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: a obra de Deus
  rationale: Tradução formalmente próxima que mantém a ambiguidade do genitivo grego entre a obra requerida por Deus e a obra realizada por Deus.
- source_word: ἵνα πιστεύητε
  choice: que vocês creiam
  rationale: A oração com ἵνα apresenta o conteúdo da obra. “Creiam” é claro, digno e natural, sem transformar o presente do grego em uma afirmação explícita de continuidade.
- source_word: εἰς ὃν
  choice: naquele que
  rationale: A construção πιστεύω εἰς é expressa naturalmente por “crer em”; “naquele que” conserva o referente pessoal.
- source_word: ἀπέστειλεν ἐκεῖνος
  choice: ele enviou
  rationale: O pretérito perfeito traduz diretamente o aoristo, e “ele” retoma Deus de modo natural no contexto.
theological_decisions:
- issue: Sentido de τὸ ἔργον τοῦ θεοῦ
  choice: Manter “a obra de Deus” no texto principal.
  alternative: “a obra que Deus requer” ou “a obra que Deus realiza”
  rationale: O genitivo grego admite mais de uma relação semântica. A formulação preserva a tensão entre a pergunta humana sobre o que fazer e a ação de Deus ligada à fé no enviado.
- issue: Sentido de πιστεύητε εἰς
  choice: “creiam naquele”
  alternative: “confiem naquele”
  rationale: “Crer em” é a correspondência portuguesa tradicional e corrente para a construção joanina, enquanto “confiar em” explicita uma nuance relacional legítima sem esgotar o verbo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fórmula grega redundante “respondeu e disse” foi vertida idiomaticamente por “respondeu”. O uso de “vocês” comunica com clareza o plural de πιστεύητε em português brasileiro e permanece amplamente compreensível.
