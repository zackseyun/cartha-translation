id: JHN.6.50
reference: John 6:50
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων ἵνα τις ἐξ αὐτοῦ φάγῃ καὶ μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/050.yaml
  text: This is the bread that comes down from heaven[b][a], so that anyone may eat from it and not die.
translation:
  language: pt
  text: Este é o pão que desce do céu[a], para que qualquer pessoa coma dele e não morra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Este é o pão que vem descendo do céu.”'
    reason: lexical_alternative
  - marker: b
    text: A expressão “não morra” é mantida em sentido amplo. No contexto, ela pode ser entendida como referência à morte definitiva, à morte espiritual ou à destruição escatológica.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός
  choice: Este
  rationale: O demonstrativo identifica diretamente o pão; “Este” é natural em português e preserva a força imediata do grego.
- source_word: ἄρτος
  choice: pão
  rationale: É o sentido lexical comum e conserva tanto a referência concreta quanto a força metafórica no discurso de João 6.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων
  choice: que desce do céu
  rationale: A oração relativa soa natural em português e preserva o aspecto presente do particípio καταβαίνων.
- source_word: οὐρανός
  choice: céu
  rationale: No contexto joanino, refere-se ao âmbito celestial divino, e não meramente ao céu visível.
- source_word: ἵνα
  choice: para que
  rationale: Expressa adequadamente a finalidade ou o resultado pretendido da oração grega.
- source_word: τις
  choice: qualquer pessoa
  rationale: Comunica de modo inclusivo e natural a força genérica do pronome indefinido, sem restringir o referente.
- source_word: ἐξ αὐτοῦ
  choice: dele
  rationale: Com o verbo “comer”, “coma dele” é uma formulação portuguesa natural e mantém a relação expressa por ἐξ.
- source_word: φάγῃ
  choice: coma
  rationale: O presente do subjuntivo português se ajusta à oração introduzida por “para que” e preserva o caráter geral da afirmação.
- source_word: μὴ ἀποθάνῃ
  choice: não morra
  rationale: Traduz diretamente o verbo “morrer”, sem introduzir a nuance interpretativa mais específica de “perecer”.
theological_decisions:
- issue: Natureza da morte em “não morra”
  choice: Manter a expressão ampla “não morra”, sem qualificá-la.
  alternative: “não morra espiritualmente” ou “não pereça eternamente”
  rationale: O contexto contrasta o pão comum com a vida dada por Jesus, mas o versículo não define explicitamente a natureza da morte. A formulação ampla preserva a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Qualquer pessoa” evita o possível valor masculino de “alguém” sem tornar a frase técnica; “coma dele” conserva uma construção bíblica compreensível e próxima do grego.
