id: JHN.6.62
reference: John 6:62
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν οὖν θεωρῆτε τὸν υἱὸν τοῦ ἀνθρώπου ἀναβαίνοντα ὅπου ἦν τὸ πρότερον;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/062.yaml
  text: Then what if you were to see the Son of Man ascending to where he was before?[a]
translation:
  language: pt
  text: Então, e se vocês virem o Filho do Homem subindo para onde estava antes?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Então, se vocês virem o Filho do Homem subindo para onde estava antes...?» O grego apresenta uma condição com sentido de pergunta retórica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Então, e se
  rationale: A formulação comunica de modo idiomático tanto a força inferencial de οὖν quanto o caráter condicional e retórico de ἐὰν, ligando a pergunta à reação mencionada no contexto anterior.
- source_word: θεωρῆτε
  choice: vocês virem
  rationale: O verbo indica ver ou contemplar; no português corrente, «virem» preserva com naturalidade a situação prospectiva da condição, sem acrescentar uma ideia ausente no texto.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a designação característica usada por Jesus e suas ressonâncias bíblicas, sem paráfrase interpretativa.
- source_word: ἀναβαίνοντα
  choice: subindo
  rationale: Expressa diretamente o movimento para cima indicado pelo particípio e permanece natural em português, sem precisar explicitar o destino.
- source_word: ὅπου ἦν τὸ πρότερον
  choice: para onde estava antes
  rationale: Conserva a referência a um lugar ou estado anterior sem inserir explicitamente «céu» ou «Pai», termos não presentes no versículo.
theological_decisions:
- issue: Se a subida deve ser explicitamente interpretada como retorno ao céu ou ao Pai e como afirmação de preexistência
  choice: Manter «para onde estava antes» sem expansão interpretativa.
  alternative: «para o céu, onde estava antes» ou «de volta ao Pai, onde estava antes»
  rationale: A frase grega sugere fortemente existência anterior e subida, mas não nomeia neste versículo nem o céu nem o Pai. A tradução conserva a força cristológica e a abertura exata do texto.
- issue: Como representar a construção condicional que funciona como pergunta retórica
  choice: Traduzir no texto principal como «Então, e se vocês virem...?».
  alternative: «Então, se vocês virem...»
  rationale: O ponto de interrogação no contexto e a construção grega permitem entendê-la como pergunta retórica. A redação principal torna essa função clara em português, enquanto a nota registra a forma mais próxima da estrutura superficial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Vocês» torna explícito o plural do verbo grego; «subindo» é mais corrente que «ascendendo», sem perder o sentido vertical e possivelmente celestial.
