  source_fidelity: 'A primeira frase e a citação reproduzem bem o grego, inclusive o futuro passivo e a referência aos Profetas. Contudo, «ouviu o Pai» tende a apresentar «o Pai» como objeto direto de «ouvir», enquanto παρὰ τοῦ πατρός marca mais especificamente a origem: ouvir do Pai. A revisão explicita essa relação sem acrescentar interpretação.'
  naturalness: «Está escrito nos Profetas» e «Todo aquele que ... vem a mim» são formulações naturais, claras e de registro bíblico moderado em português moderno. «Ouviu do Pai» é igualmente idiomático e torna a relação de fonte mais clara no contexto.
  terminology: '«Profetas», «Deus», «Pai» e «a mim» mantêm adequadamente a terminologia escriturística e joanina. Não é necessária nota lexical: «ensinados por Deus» já comunica de forma clara o sentido de διδακτοὶ θεοῦ.'
