reference: John 6:45
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔστιν γεγραμμένον ἐν τοῖς προφήταις· Καὶ ἔσονται πάντες διδακτοὶ θεοῦ· ⸀πᾶς ὁ ⸀ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν ἔρχεται πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/045.yaml
  text: It is written in the Prophets[a], ‘And they will all be taught by God.’ Everyone who has heard from the Father and has learned comes to me.
translation:
  language: pt
  text: 'Está escrito nos Profetas: “E todos serão ensinados por Deus.” Todo aquele que ouviu do Pai e aprendeu vem a mim.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστιν γεγραμμένον
  choice: Está escrito
  rationale: Fórmula corrente e natural para o perfeito perifrástico, indicando um texto escrito cuja validade permanece.
- source_word: ἐν τοῖς προφήταις
  choice: nos Profetas
  rationale: A maiúscula sinaliza a provável referência ao conjunto reconhecido dos escritos proféticos, em uma fórmula de citação das Escrituras.
- source_word: ἔσονται πάντες διδακτοὶ θεοῦ
  choice: todos serão ensinados por Deus
  rationale: Preserva o futuro e expressa θεοῦ naturalmente como agente ou fonte do ensino, sem a artificialidade de uma construção como “ensinados de Deus”.
- source_word: πᾶς ὁ
  choice: Todo aquele que
  rationale: Reproduz o singular substantivado de alcance geral em português claro e digno.
- source_word: ἀκούσας παρὰ τοῦ πατρὸς
  choice: ouviu o Pai
  rationale: Com verbos de ouvir, παρά com genitivo pode indicar a pessoa de quem se ouve; em português, “ouvir o Pai” expressa isso de modo natural, sem sugerir apenas que se recebeu informação indireta acerca dele.
- source_word: μαθὼν
  choice: aprendeu
  rationale: Coordena-se com o particípio aoristo anterior e mantém a sequência de ouvir e aprender antes do presente “vem”.
- source_word: ἔρχεται πρὸς ἐμέ
  choice: vem a mim
  rationale: Tradução corrente que preserva o presente e o movimento pessoal em direção a Jesus.
theological_decisions:
- issue: Relação entre o ensino divino e a vinda a Jesus
  choice: 'A tradução mantém a sequência textual: quem ouviu o Pai e aprendeu vem a Jesus.'
  alternative: Explicitar uma leitura determinista ou, no sentido oposto, uma leitura sinergista centrada na resposta humana.
  rationale: O grego afirma a relação, mas não explica seus mecanismos metafísicos; a tradução deve preservar essa tensão.
- issue: Relação entre o Pai e Jesus
  choice: Mantêm-se “o Pai” e “a mim” em relação direta.
  alternative: Acrescentar uma explicação cristológica não expressa no versículo.
  rationale: A formulação conserva a força joanina de que aprender do Pai conduz a Jesus, sem ampliar o que o texto declara.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. Registro digno e direto; “nos Profetas” conserva a fórmula escriturística, e os aoristos participiais são vertidos pelo pretérito perfeito, solução natural em português.
