  yaml_path: translation/nt/john/006/007.yaml
  text: Philip answered him, “Two hundred denarii worth of bread is not enough for them, so that each one may receive a little.”
translation:
  language: pt
  text: 'Filipe lhe respondeu: “Duzentos denários[a] de pão não bastam para eles, para que cada um receba um pouco.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O denário era uma moeda romana que correspondia aproximadamente ao pagamento diário de um trabalhador.
    reason: Ajuda o leitor moderno a perceber que duzentos denários representavam uma soma considerável, sem impor uma conversão monetária moderna instável.
lexical_decisions:
- source_word: Διακοσίων δηναρίων ἄρτοι
  choice: Pão no valor de duzentos denários
  rationale: Expressa naturalmente em português o valor monetário atribuído à quantidade de pão, sem converter a antiga unidade monetária em um valor moderno incerto.
- source_word: οὐκ ἀρκοῦσιν
  choice: não é suficiente
  rationale: Reproduz a afirmação presente do texto grego e concorda idiomaticamente com o coletivo singular “pão”.
- source_word: ἵνα ἕκαστος βραχύ τι λάβῃ
  choice: para que cada um receba um pouco
  rationale: Mantém a construção final/resultativa com ἵνα e preserva a ideia de que cada pessoa receberia apenas uma pequena porção.
