id: JHN.6.2
reference: John 6:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂ἠκολούθει δὲ⸃ αὐτῷ ὄχλος πολύς, ὅτι ⸀ἐθεώρουν τὰ σημεῖα ἃ ἐποίει ἐπὶ τῶν ἀσθενούντων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/002.yaml
  text: And a large crowd was following him[a], because they were seeing the signs that he was doing on those who were sick.
translation:
  language: pt
  text: E uma grande multidão o seguia, porque via os sinais[a] que ele realizava nos doentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “milagres” ou “sinais milagrosos”; a palavra usada por João, “sinais”, destaca o que essas obras revelam sobre Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: seguia
  rationale: O imperfeito indica uma ação contínua no passado; em português, “seguia” expressa isso de modo natural.
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ funciona como conectivo narrativo leve, sem contraste forte.
- source_word: ὄχλος πολύς
  choice: uma grande multidão
  rationale: Preserva a ideia de um grupo numeroso em linguagem corrente e digna.
- source_word: ἐθεώρουν
  choice: via
  rationale: O imperfeito retrata percepção repetida ou contínua; o singular concorda naturalmente com o coletivo “multidão”.
- source_word: σημεῖα
  choice: sinais
  rationale: Preserva o termo característico de João e sua dimensão reveladora, sem reduzi-lo apenas a “milagres”.
- source_word: ἐποίει
  choice: realizava
  rationale: Comunica naturalmente a atividade contínua de Jesus; em português, “realizar sinais” é mais idiomático que “fazer sinais” neste contexto.
- source_word: ἐπὶ τῶν ἀσθενούντων
  choice: nos doentes
  rationale: Reflete os doentes como pessoas sobre as quais ou em relação às quais os sinais eram realizados, sem introduzir explicitamente uma ideia de benefício.
- source_word: ἀσθενούντων
  choice: doentes
  rationale: No contexto, o particípio se refere a pessoas fisicamente enfermas.
theological_decisions:
- issue: Terminologia joanina σημεῖα
  choice: sinais
  alternative: milagres; sinais milagrosos
  rationale: João usa σημεῖα para destacar aquilo que as obras de Jesus revelam sobre ele. “Sinais” preserva essa nuance e a tensão própria do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém tom narrativo digno, evita construções excessivamente literais e conserva a terminologia teológica característica de João.
