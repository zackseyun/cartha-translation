  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον, κἀγὼ ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/054.yaml
  text: The one who eats my flesh and drinks my blood has eternal life[b][a], and I will raise him up on the last day.
translation:
  language: pt
  text: Quem come a minha carne e bebe o meu sangue tem a vida eterna[a], e eu o ressuscitarei no último dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego traduzido por “come” é mais concreto que o termo genérico para comer e também pode sugerir “alimentar-se de” ou, de modo mais vívido, “mastigar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: Quem come
  rationale: O artigo com o particípio presente funciona como substantivo e caracteriza a pessoa pela ação. “Quem come” é natural em português, mantém o valor geral da construção e permite conservar o singular na retomada por “o”.
- source_word: τρώγων
  choice: come
  rationale: Embora τρώγω possa ser mais concreto e vívido do que um verbo genérico para comer, “come” é a formulação portuguesa mais clara e digna; a nuance mais gráfica é registrada em nota.
- source_word: μου τὴν σάρκα
  choice: a minha carne
  rationale: Mantém o sentido concreto de σάρξ sem substituí-lo interpretativamente por “corpo”.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: e bebe o meu sangue
  rationale: Preserva o paralelismo dos particípios presentes e conserva literalmente a referência ao sangue.
- source_word: ἔχει
  choice: tem
  rationale: Reproduz com naturalidade o presente indicativo e a afirmação de posse presente da vida eterna.
- source_word: ζωὴν αἰώνιον
  choice: a vida eterna
  rationale: É a expressão portuguesa consagrada e comunica tanto a duração quanto a qualidade escatológica da vida no uso joanino.
- source_word: κἀγὼ
  choice: e eu
  rationale: Reflete a crase de καί com ἐγώ e conserva o sujeito explícito e enfático sem intensificação excessiva.
- source_word: ἀναστήσω αὐτὸν
  choice: o ressuscitarei
  rationale: No contexto escatológico, ἀνίστημι se refere à ressurreição. A colocação pronominal é natural no registro escrito e preserva o masculino singular de αὐτόν.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: no último dia
  rationale: Expressão idiomática e reconhecível em português para a fórmula escatológica joanina.
theological_decisions:
- issue: Se a linguagem de comer e beber deve ser interpretada no texto principal em sentido sacramental ou metafórico
  choice: Manter literalmente “come a minha carne e bebe o meu sangue”
  alternative: Explicitar uma leitura eucarística ou parafrasear como crer em Jesus
  rationale: O grego emprega termos concretos. A tradução preserva a tensão teológica do texto sem impor uma interpretação denominacional.
- issue: Retomada de αὐτόν
  choice: “o” em “o ressuscitarei”
  alternative: “essa pessoa” ou uma reformulação no plural
  rationale: O pronome grego é masculino singular e retoma a pessoa designada pela construção substantivada singular; a tradução conserva essa correspondência.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém a linguagem concreta e o paralelismo do original, sem explicação sacramental ou metafórica no corpo do versículo.
