  yaml_path: translation/nt/john/006/009.yaml
  text: There is a boy here who has five barley loaves and two fish[a], but what are these for so many?
translation:
  language: pt
  text: Há aqui um menino que tem cinco pães de cevada e dois peixes. Mas o que é isso para tanta gente?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas o que representam estes para tanta gente?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδάριον
  choice: menino
  rationale: Designa uma criança ou rapaz jovem; “menino” é natural, atual e não acrescenta uma indicação de tamanho ausente do termo.
- source_word: ὧδε
  choice: aqui
  rationale: Equivalente locativo direto e idiomático.
- source_word: ὃς ἔχει
  choice: que tem
  rationale: A oração relativa identifica o menino por aquilo que possui; esta é a formulação natural em português.
- source_word: ἄρτους κριθίνους
  choice: pães de cevada
  rationale: Expressa de forma clara e corrente tanto ἄρτους quanto a matéria especificada por κριθίνους, sem impor a forma moderna de “pães” ou “filões”.
- source_word: ὀψάρια
  choice: peixes
  rationale: Neste contexto, refere-se a peixe usado como alimento com o pão. “Peixes” é claro e não acrescenta que fossem pequenos, embora isso seja lexicalmente possível.
- source_word: ἀλλὰ
  choice: mas
  rationale: Preserva de maneira direta o contraste entre a comida disponível e o tamanho da multidão.
- source_word: ταῦτα τί ἐστιν
  choice: o que é isso
  rationale: O neutro plural grego com verbo no singular pode ser vertido naturalmente pelo coletivo demonstrativo singular em português. A pergunta mantém sua força retórica e avaliativa.
- source_word: εἰς τοσούτους
  choice: para tanta gente
  rationale: Comunica naturalmente a relação de adequação diante do grande número de pessoas, sem exigir que “gente” apareça explicitamente no grego.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tanta gente” torna explícito o referente humano implícito em τοσούτους. O ponto antes de “Mas” evita uma frase excessivamente longa e conserva o contraste enfático.
