  text: οὗτός ἐστιν ὁ ἄρτος ὁ ⸀ἐξ οὐρανοῦ καταβάς, οὐ καθὼς ἔφαγον οἱ ⸀πατέρες καὶ ἀπέθανον· ὁ τρώγων τοῦτον τὸν ἄρτον ⸀ζήσει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/058.yaml
  text: This is the bread that came down from heaven[a], not as the fathers ate and died[b]; the one who eats this bread will live forever.
translation:
  language: pt
  text: Este é o pão que desceu do céu, não como o pão que os antepassados[a] comeram e depois morreram; quem come este pão viverá para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os pais”. Provavelmente se refere aos antepassados de Israel que comeram o maná no deserto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “viverá para a era”; nesta expressão joanina, indica vida duradoura, para sempre.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ ἄρτος
  choice: Este é o pão
  rationale: Mantém o demonstrativo, a cópula e o substantivo articulado em uma construção natural em português, identificando o pão já apresentado no discurso.
- source_word: ὁ ἐξ οὐρανοῦ καταβάς
  choice: que desceu do céu
  rationale: Transforma o particípio aoristo em oração relativa idiomática, preservando tanto o movimento de descida quanto a origem celestial.
- source_word: οὐ καθὼς ἔφαγον οἱ πατέρες καὶ ἀπέθανον
  choice: Não é como aquele que os pais comeram — e morreram
  rationale: 'O pronome “aquele” explicita em português o pão subentendido na comparação, sem acrescentar um referente novo. O travessão comunica com clareza o contraste enfático: eles comeram, mas ainda assim morreram.'
- source_word: οἱ πατέρες
  choice: os pais
  rationale: Preserva a forma masculina e a expressão tradicional do grego, que neste contexto provavelmente aponta para os antepassados de Israel no deserto; a alternativa semântica é registrada em nota.
- source_word: ὁ τρώγων τοῦτον τὸν ἄρτον
  choice: Quem come este pão
  rationale: Expressa de modo natural o particípio substantivado com valor geral. “Come” mantém o sentido lexical sem impor uma interpretação sacramental ou exclusivamente metafórica.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: viverá para sempre
  rationale: É a forma portuguesa idiomática de comunicar vida duradoura e sem fim, preservando-se em nota a estrutura mais literal da expressão grega.
theological_decisions:
- issue: Referência de οἱ πατέρες na comparação com o pão do deserto
  choice: os pais
  alternative: os antepassados
  rationale: A tradução conserva a expressão masculina do texto e sua evocação dos pais de Israel que comeram o maná. A nota esclarece o referente provável sem ampliar silenciosamente o texto.
- issue: Força de τρώγων no discurso do pão da vida
  choice: Quem come
  alternative: Quem se alimenta de
  rationale: “Come” preserva a imagem concreta do verbo sem decidir entre as leituras sacramental e metafórica ligadas à fé.
- issue: Sentido de εἰς τὸν αἰῶνα
  choice: para sempre
  alternative: para a era / até a era
  rationale: A forma idiomática comunica a duração permanente pretendida no uso joanino, enquanto a nota mantém visível a formulação literal e sua possível tensão escatológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A pontuação divide o período longo para facilitar a leitura; o travessão ressalta o contraste entre comer e ainda assim morrer. As notas foram posicionadas junto às expressões que de fato explicam.
