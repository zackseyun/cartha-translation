review_pass:
  verdict: revise
  source_fidelity: A ideia central está preservada, incluindo a comparação com os que comeram o maná e morreram e a promessa de vida permanente. Contudo, “Não é como aquele que os pais comeram” cria uma construção comparativa pouco clara e faz “aquele” funcionar de modo pesado; além disso, “os pais” em português moderno tende a ser entendido como os próprios genitores, não como os antepassados israelitas pretendidos no contexto.
  naturalness: A primeira e a última frases são naturais. A frase central, porém, soa artificial e ligeiramente ambígua. Uma única frase com “não como o pão que os antepassados comeram e depois morreram” reproduz o contraste grego com clareza e fluência.
  terminology: “Antepassados” é o equivalente contextual mais claro para οἱ πατέρες neste versículo; a nota pode conservar “os pais” como formulação literal. “Para sempre” traduz idiomaticamente εἰς τὸν αἰῶνα sem impor uma leitura teológica adicional.
  issues:
  - severity: medium
    issue: Construção comparativa e referente de “aquele”
    rationale: Em “Não é como aquele que os pais comeram — e morreram”, o demonstrativo é pouco natural e a coordenação pode momentaneamente deixar incerto quem morreu. O grego contrasta este pão com o pão que os antepassados comeram, após o que eles morreram.
  - severity: medium
    issue: “Os pais” é um falso cognato contextual em português moderno
    rationale: Embora literalmente possível, “os pais” normalmente designa pai e mãe de alguém. Aqui οἱ πατέρες alude aos antepassados de Israel no deserto; “os antepassados” comunica o referente sem alterar o sentido.
  revised_text: Este é o pão que desceu do céu, não como o pão que os antepassados[a] comeram e depois morreram; quem come este pão viverá para sempre.[b]
