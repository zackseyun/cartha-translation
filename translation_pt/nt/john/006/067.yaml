  text: εἶπεν οὖν ὁ Ἰησοῦς τοῖς δώδεκα· Μὴ καὶ ὑμεῖς θέλετε ὑπάγειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/067.yaml
  text: So Jesus said to the Twelve[a], “You do not want to go away too, do you?”
translation:
  language: pt
  text: 'Então Jesus disse aos Doze[a]: “Vocês também não querem ir embora, querem?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês também querem ir embora?” A pergunta grega usa μή, que frequentemente espera uma resposta negativa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e a consequência da partida de muitos discípulos no contexto anterior, com naturalidade em português.
- source_word: τοῖς δώδεκα
  choice: aos Doze
  rationale: Preserva a expressão como designação reconhecida do círculo mais próximo de Jesus, sem acrescentar “discípulos”.
- source_word: Μὴ καὶ ὑμεῖς
  choice: Vocês também não ... querem?
  rationale: A pergunta negativa comunica a expectativa de uma resposta negativa sugerida por μή; “também” representa καί e destaca o contraste com os que partiram.
- source_word: θέλετε
  choice: querem
  rationale: Expressa de modo direto e atual a vontade ou disposição dos Doze.
- source_word: ὑπάγειν
  choice: ir embora
  rationale: Conserva a ideia de afastamento presente no verbo e se ajusta ao contexto imediato em que outros discípulos deixaram Jesus.
theological_decisions:
- issue: Força da pergunta introduzida por μή
  choice: Pergunta negativa que sugere a expectativa de que a resposta seja “não”
  alternative: 'Pergunta mais neutra: “Vocês também querem ir embora?”'
  rationale: μή normalmente introduz aqui uma pergunta que espera resposta negativa. A formulação em português preserva essa nuance pragmática sem transformar a expectativa de Jesus numa afirmação absoluta.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O pronome “vocês” torna explícito o plural de ὑμεῖς; a pergunta de confirmação final preserva de maneira natural a força de μή.
