lexical_decisions:
- source_word: ταῦτα
  choice: essas coisas
  rationale: O demonstrativo neutro plural retoma o conjunto de declarações anteriores e preserva naturalmente o plural em português.
- source_word: εἶπεν
  choice: Ele disse
  rationale: O aoristo de λέγω é traduzido diretamente por “disse”; o sujeito permanece pronominal, como está implícito no grego e claro no contexto.
- source_word: ἐν συναγωγῇ
  choice: na sinagoga
  rationale: Embora συναγωγῇ não tenha artigo no grego, a construção preposicional pode ser definida pelo contexto; “na sinagoga” é natural para o local conhecido em Cafarnaum.
- source_word: διδάσκων
  choice: enquanto ensinava
  rationale: O particípio presente expressa uma ação em curso simultânea ao verbo principal.
- source_word: ἐν Καφαρναούμ
  choice: em Cafarnaum
  rationale: Translitera o topônimo e expressa de modo natural sua função locativa.
