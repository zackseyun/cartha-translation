  text: καὶ ἔλεγον· ⸀Οὐχ οὗτός ἐστιν Ἰησοῦς ὁ υἱὸς Ἰωσήφ, οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα; πῶς ⸀νῦν ⸀λέγει ὅτι Ἐκ τοῦ οὐρανοῦ καταβέβηκα;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/042.yaml
  text: And they were saying, “Is this not Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”
translation:
  language: pt
  text: 'E diziam: “Este não é Jesus, o filho de José, cujo pai e cuja mãe nós conhecemos? Como é que ele agora diz: ‘Desci do céu’?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito indica fala contínua ou repetida; “diziam” preserva naturalmente esse aspecto em português.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Este não é
  rationale: Reproduz com naturalidade a pergunta negativa, que espera concordância e expressa a objeção dos falantes.
- source_word: ὁ υἱὸς Ἰωσήφ
  choice: o filho de José
  rationale: Tradução direta da construção genitiva, mantendo a ênfase na filiação humana conhecida atribuída a Jesus.
- source_word: οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα
  choice: cujo pai e cuja mãe nós conhecemos
  rationale: Preserva a oração relativa e o pronome enfático ἡμεῖς; a repetição de “cujo/cuja” torna clara e correta a relação em português.
- source_word: πῶς νῦν λέγει
  choice: Como, então, ele diz agora
  rationale: Mantém πῶς como “como”, νῦν como “agora” e o presente de λέγει. “Então” dá expressão natural à inferência contextual sem acrescentar a modalidade de “pode”.
- source_word: Ἐκ τοῦ οὐρανοῦ
  choice: do céu
  rationale: Forma portuguesa natural para indicar a origem expressa por ἐκ com o genitivo.
- source_word: καταβέβηκα
  choice: Desci
  rationale: O perfeito grego apresenta uma descida concluída com relevância presente. Como o português moderno não dispõe de equivalente perfeito simples com o mesmo valor, “desci” é a formulação direta e idiomática; “tenho descido” sugeriria repetição e seria inadequado.
theological_decisions:
- issue: A objeção à afirmação de origem celestial de Jesus
  choice: Manter literalmente “Desci do céu”
  alternative: Vim do céu
  rationale: A formulação conserva o movimento explícito de descida em καταβέβηκα e a tensão entre a origem familiar que os interlocutores alegam conhecer e a origem celestial afirmada por Jesus, sem transformar a declaração em metáfora nem explicá-la doutrinariamente.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem e a pontuação foram ajustadas à fluência portuguesa sem apagar o aspecto verbal, a pergunta retórica nem o contraste central do texto.
