  text: ἐπάρας οὖν ⸂τοὺς ὀφθαλμοὺς ὁ Ἰησοῦς⸃ καὶ θεασάμενος ὅτι πολὺς ὄχλος ἔρχεται πρὸς αὐτὸν λέγει ⸀πρὸς Φίλιππον· Πόθεν ⸀ἀγοράσωμεν ἄρτους ἵνα φάγωσιν οὗτοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/005.yaml
  text: So Jesus[a], lifting up his eyes and seeing that a large crowd was coming toward him, said to Philip[c][b], “Where are we to buy bread so that these may eat?”
translation:
  language: pt
  text: 'Então Jesus, levantando os olhos e vendo que uma grande multidão vinha em sua direção, disse a Filipe: “Onde compraremos pão para que eles comam?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “De onde compraremos pães para que estes comam?” A forma verbal também pode ter a nuance de “onde haveremos de comprar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάρας ... τοὺς ὀφθαλμούς
  choice: levantando os olhos
  rationale: Preserva de modo natural em português a expressão idiomática grega, sem explicitação desnecessária do possessivo.
- source_word: οὖν
  choice: Então
  rationale: Marca com naturalidade a progressão narrativa; evita o tom excessivamente inferencial que “portanto” poderia sugerir aqui.
- source_word: θεασάμενος
  choice: vendo
  rationale: Expressa a observação perceptiva de forma concisa e corrente.
- source_word: πολὺς ὄχλος
  choice: uma grande multidão
  rationale: Comunica claramente o tamanho do grupo em português moderno.
- source_word: ἔρχεται πρὸς αὐτόν
  choice: vinha em sua direção
  rationale: O imperfeito progressivo português representa naturalmente o presente narrativo e preserva a força direcional de πρός.
- source_word: λέγει πρὸς Φίλιππον
  choice: disse a Filipe
  rationale: Converte o presente histórico em passado narrativo idiomático, preservando o destinatário da fala.
- source_word: Πόθεν ἀγοράσωμεν
  choice: Onde compraremos
  rationale: É uma pergunta natural em português sobre o lugar ou a fonte de obtenção; a nota registra a forma mais literal e a possível nuance deliberativa.
- source_word: ἄρτους
  choice: pão
  rationale: Ἄρτος pode designar pão em sentido coletivo ou pães individuais; “pão” é natural neste contexto sem excluir a referência aos pães concretos.
- source_word: ἵνα φάγωσιν οὗτοι
  choice: para que eles comam
  rationale: Expressa a finalidade de ἵνα e retoma a multidão com um pronome natural em português, sem o caráter potencialmente distanciador de “estes”.
theological_decisions:
- issue: Tempo verbal do presente histórico e sequência dos particípios
  choice: “levantando... vendo... disse”
  alternative: “levantou... viu... e diz”
  rationale: A formulação escolhida mantém a sequência das ações e apresenta a narrativa em português natural, sem acrescentar interpretação doutrinária.
- issue: Força de Πόθεν ἀγοράσωμεν
  choice: “Onde compraremos”
  alternative: “De onde compraremos” ou “Onde haveremos de comprar”
  rationale: A escolha preserva a pergunta sobre a obtenção do alimento em linguagem corrente; a nota mantém visível a forma literal e a possível nuance deliberativa, sem decidir além do grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Filipe” segue a forma tradicional e corrente do nome. A estrutura participial foi mantida por ser natural e por refletir a progressão do grego.
