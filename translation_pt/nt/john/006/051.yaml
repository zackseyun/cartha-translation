id: JHN.6.51
reference: John 6:51
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου ⸀ζήσει εἰς τὸν αἰῶνα, καὶ ὁ ἄρτος δὲ ὃν ἐγὼ δώσω ἡ σάρξ μού ⸀ἐστιν ὑπὲρ τῆς τοῦ κόσμου ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/051.yaml
  text: I am the living bread that came down from heaven[a]. If anyone eats of this bread, he will live forever[c][b]. And the bread that I will give for the life of the world is my flesh.
translation:
  language: pt
  text: Eu sou o pão vivo que desceu do céu. Se alguém comer deste pão, viverá para sempre. E o pão que eu darei é a minha carne pela vida do mundo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἄρτος ὁ ζῶν
  choice: o pão vivo
  rationale: Traduz ζῶν de modo adjetival e direto, sem substituir a expressão pela formulação próxima, mas distinta, “pão da vida”.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: que desceu do céu
  rationale: A oração relativa é natural em português e preserva o sentido de uma descida já realizada.
- source_word: ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου
  choice: Se alguém comer deste pão
  rationale: A construção condicional geral é expressa naturalmente com “se” e futuro do subjuntivo; “deste pão” traduz de modo idiomático ἐκ τούτου τοῦ ἄρτου.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: viverá para sempre
  rationale: É o equivalente português claro e corrente da expressão joanina de duração sem fim.
- source_word: ὁ ἄρτος δὲ ὃν ἐγὼ δώσω
  choice: E o pão que eu darei
  rationale: “E” apresenta o desenvolvimento do pensamento sem impor contraste forte; o futuro mantém a referência à entrega ainda por vir.
- source_word: ἡ σάρξ μού ἐστιν
  choice: é a minha carne
  rationale: “Carne” traduz concretamente σάρξ e evita suavizar ou interpretar antecipadamente a linguagem provocativa do texto.
- source_word: ὑπὲρ τῆς τοῦ κόσμου ζωῆς
  choice: para que o mundo tenha vida
  rationale: Expressa em português natural a relação benefativa/final de ὑπέρ com ζωή, preservando “mundo” e sem restringir seu alcance.
- source_word: κόσμος
  choice: mundo
  rationale: Mantém a ressonância joanina e não reduz interpretativamente o termo a um grupo mais estreito.
- source_word: τις ... ζήσει
  choice: alguém ... viverá
  rationale: O português permite conservar o referente genérico singular sem introduzir pronome marcado por gênero.
theological_decisions:
- issue: Sentido de σάρξ na autodescrição de Jesus
  choice: “carne” no texto principal
  alternative: “corpo”
  rationale: O termo grego é concreto neste contexto. “Corpo” atenuaria sua força lexical e poderia antecipar uma interpretação sacramental específica.
- issue: Alcance de κόσμος
  choice: manter “mundo” sem restringir
  alternative: “humanidade” ou um grupo teologicamente delimitado
  rationale: A tradução conserva a amplitude e a tensão da formulação joanina sem importar um sistema doutrinário.
- issue: Força cristológica de “desceu do céu”
  choice: traduzir diretamente como descida do céu
  alternative: paráfrase como mero comissionamento divino
  rationale: A formulação direta preserva a afirmação do texto e sua força cristológica sem acrescentar explicação dogmática.
- issue: Relação sintática de ὑπὲρ τῆς τοῦ κόσμου ζωῆς
  choice: ligar a expressão à entrega da carne por meio de “para que o mundo tenha vida”
  alternative: “a minha carne, que darei pela vida do mundo”
  rationale: A ordem grega admite a formulação compacta tradicional, mas esta redação torna clara em português a finalidade benefativa sem definir o mecanismo teológico dessa dádiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se os termos concretos “pão”, “carne” e “mundo”; evita-se pronome genérico marcado por gênero. A nota registra uma alternativa sintática genuína.
