  text: And when they found him on the other side of the sea[a], they said to him, “Rabbi, when did you get here?”
translation:
  language: pt
  text: 'E, quando o encontraram do outro lado do mar, disseram-lhe: “Rabi, quando você chegou aqui?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando você veio para cá?”. O verbo grego está no perfeito e também pode ser traduzido mais formalmente dessa maneira; no contexto, porém, o sentido idiomático é o da chegada: “quando você chegou aqui?”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Mantém a ligação narrativa simples com o contexto anterior, sem acrescentar uma relação mais específica.
- source_word: εὑρόντες
  choice: quando o encontraram
  rationale: O particípio aoristo anterior ao verbo principal é expresso naturalmente como oração temporal, preservando a sequência dos acontecimentos.
- source_word: πέραν τῆς θαλάσσης
  choice: do outro lado do mar
  rationale: Expressa de modo idiomático a localização além da massa de água e conserva o contraste geográfico da narrativa.
- source_word: εἶπον αὐτῷ
  choice: disseram-lhe
  rationale: Mantém o sentido direto de λέγω; embora venha uma pergunta, evita substituir o verbo por uma interpretação como “perguntaram-lhe”.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Preserva o título judaico transliterado e a ambientação histórica, em vez de interpretá-lo aqui como “Mestre”.
- source_word: πότε
  choice: quando
  rationale: Equivalente temporal interrogativo natural e preciso em português.
- source_word: ὧδε
  choice: aqui
  rationale: Reproduz de forma concisa e idiomática o advérbio de lugar.
- source_word: γέγονας
  choice: você chegou
  rationale: Neste contexto, o perfeito de γίνομαι indica a chegada ou presença resultante. “Chegou” comunica naturalmente essa ideia em português.
