id: JHN.6.44
reference: John 6:44
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐδεὶς δύναται ἐλθεῖν πρός ⸀με ἐὰν μὴ ὁ πατὴρ ὁ πέμψας με ἑλκύσῃ αὐτόν, κἀγὼ ἀναστήσω αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/044.yaml
  text: No one is able to come to me unless the Father who sent me draws him[b][a], and I will raise him up on the last day.
translation:
  language: pt
  text: Ninguém pode vir a mim se o Pai que me enviou não o atrair[a][b]; e eu o ressuscitarei no último dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «puxar» ou «arrastar». O verbo grego pode expressar com mais força a ideia de puxar; «atrair» preserva aqui a imagem sem impor uma explicação teológica específica de como o Pai leva alguém ao Filho.
    reason: lexical_alternative
  - marker: b
    text: O grego emprega um pronome masculino singular com sentido representativo; a afirmação se aplica às pessoas em geral, não apenas aos homens.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δύναται
  choice: Ninguém pode
  rationale: Expressa de modo natural em português a negação universal e a incapacidade indicada pelo grego, sem enfraquecer a afirmação.
- source_word: ἐλθεῖν πρός με
  choice: vir a mim
  rationale: Preserva tanto o movimento em direção a Jesus quanto a força relacional que a expressão tem no contexto joanino.
- source_word: ἐὰν μὴ
  choice: se ... não
  rationale: Construção condicional clara e idiomática em português; neste período, soa mais natural que «a menos que».
- source_word: ὁ πατὴρ ὁ πέμψας με
  choice: o Pai que me enviou
  rationale: Traduz o particípio atributivo por uma oração relativa natural, preservando a designação pessoal «o Pai».
- source_word: ἑλκύσῃ
  choice: atrair
  rationale: «Atrair» é a formulação natural neste contexto e conserva a ideia de fazer alguém vir, sem decidir por si só quão coerciva é a ação; alternativas mais fortes são registradas em nota.
- source_word: αὐτόν
  choice: o
  rationale: O pronome oblíquo masculino singular corresponde à forma grega e retoma de modo representativo o «ninguém» genérico.
- source_word: κἀγὼ
  choice: e eu
  rationale: Preserva a ligação e o sujeito expresso e enfático, sem acrescentar uma ênfase artificial.
- source_word: ἀναστήσω αὐτόν
  choice: o ressuscitarei
  rationale: No contexto escatológico, «ressuscitar» comunica com clareza o ato de levantar dentre os mortos e mantém a promessa na voz ativa.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: no último dia
  rationale: É a expressão portuguesa corrente para a referência escatológica do grego.
theological_decisions:
- issue: Sentido de ἑλκύσῃ num contexto soteriologicamente disputado
  choice: atrair
  alternative: puxar; arrastar
  rationale: O verbo pode indicar puxar com força em certos contextos. «Atrair» preserva aqui a ação eficaz de fazer vir sem impor uma explicação denominacional sobre o modo dessa ação; a amplitude lexical fica explícita na nota.
- issue: Masculino singular αὐτόν com alcance representativo
  choice: o
  alternative: essa pessoa
  rationale: A forma masculina singular é mantida em português, mas seu alcance genérico é esclarecido para evitar que o enunciado seja entendido como restrito aos homens.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas segue os pontos a que se ligam no texto: primeiro o verbo «atrair», depois o pronome «o».'
