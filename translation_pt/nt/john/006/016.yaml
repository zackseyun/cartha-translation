lexical_decisions:
- source_word: Ὡς δὲ
  choice: Ao
  rationale: Em conjunto com a expressão seguinte, introduz a transição temporal com naturalidade; o valor conectivo de δέ pode permanecer implícito em português sem acrescentar um marcador pesado.
- source_word: ὀψία ἐγένετο
  choice: cair da tarde
  rationale: Expressão idiomática portuguesa que comunica o início da tarde/noite e corresponde naturalmente ao sentido de que chegou o entardecer.
- source_word: κατέβησαν
  choice: desceram
  rationale: Preserva diretamente o movimento descendente indicado por καταβαίνω e soa natural no contexto narrativo.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: os seus discípulos
  rationale: Reproduz de modo natural a construção possessiva grega, mantendo a referência a Jesus.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: até o mar
  rationale: Com verbo de movimento, ἐπί com acusativo indica deslocamento em direção ao corpo de água; “até” expressa bem o destino, e “mar” preserva θάλασσα.
theological_decisions: []
