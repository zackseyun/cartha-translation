id: JHN.6.34
reference: John 6:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτόν· Κύριε, πάντοτε δὸς ἡμῖν τὸν ἄρτον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/034.yaml
  text: So they said to him[a], “Lord, always give us this bread.”
translation:
  language: pt
  text: 'Então eles lhe disseram: “Senhor[a], dê-nos sempre desse pão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “senhor”, como forma respeitosa de tratamento. O título grego também pode ter o sentido mais forte de “Senhor”.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: disseram
  rationale: O aoristo de λέγω introduz naturalmente a fala no plural; “disseram” é direto e não especifica além do texto o tipo de ato de fala.
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação ou consequência da conversa anterior. “Então” é natural em português e preserva a ligação discursiva.
- source_word: πρὸς αὐτόν
  choice: lhe
  rationale: Com verbo de fala, πρός + acusativo indica o destinatário. O pronome “lhe” expressa isso de modo idiomático e conciso.
- source_word: Κύριε
  choice: Senhor
  rationale: O vocativo pode ser tanto um tratamento respeitoso quanto um título de maior peso cristológico. “Senhor” preserva melhor essa amplitude sem decidir quanto os falantes compreendiam.
- source_word: πάντοτε
  choice: sempre
  rationale: Equivalente claro e direto de πάντοτε, indicando provisão contínua.
- source_word: δὸς
  choice: dê
  rationale: O imperativo aoristo de δίδωμι expressa um pedido direto. “Dê” é corrente, digno e adequado ao tratamento por “Senhor”.
- source_word: ἡμῖν
  choice: -nos
  rationale: O dativo funciona como objeto indireto de “dar” e é naturalmente expresso pelo pronome enclítico em “dê-nos”.
- source_word: τὸν ἄρτον τοῦτον
  choice: desse pão
  rationale: O demonstrativo retoma o pão que Jesus acabou de mencionar. Em português, “desse pão” é a formulação idiomática após “dê-nos”, mantendo a referência ao elemento já discutido.
theological_decisions:
- issue: Tradução de κύριος ao dirigir-se a Jesus
  choice: Senhor
  alternative: senhor (como simples forma respeitosa de tratamento)
  rationale: O contexto não exige que a multidão já expresse plena compreensão cristológica, mas κύριος permite mais do que mera cortesia. “Senhor”, com nota explicativa, preserva deliberadamente essa abertura sem impor uma leitura.
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. “Então” mantém o fluxo narrativo; “dê-nos sempre desse pão” soa corrente sem perder o pedido de provisão contínua. A nota conserva a ambiguidade legítima de Κύριε.
