id: JHN.6.19
reference: John 6:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐληλακότες οὖν ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα θεωροῦσιν τὸν Ἰησοῦν περιπατοῦντα ἐπὶ τῆς θαλάσσης καὶ ἐγγὺς τοῦ πλοίου γινόμενον, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/019.yaml
  text: So when they had rowed about twenty-five or thirty stadia[a], they saw Jesus walking on the sea and coming near the boat[b], and they were afraid.
translation:
  language: pt
  text: Assim, depois de remarem cerca de vinte e cinco ou trinta estádios[a], viram Jesus andando sobre o mar[b] e aproximando-se do barco; e ficaram com medo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O estádio era uma antiga unidade de distância; vinte e cinco ou trinta estádios correspondem a cerca de cinco a seis quilômetros.
    reason: cultural_note
  - marker: b
    text: Ou “andando sobre a água”. O grego diz literalmente “andando sobre o mar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐληλακότες
  choice: depois de remarem
  rationale: No contexto náutico, ἐλαύνω se refere a impulsionar o barco a remo. A construção expressa ação anterior à percepção de Jesus.
- source_word: οὖν
  choice: Assim
  rationale: Mantém a conexão com a situação narrada anteriormente e soa natural no português atual.
- source_word: ὡς
  choice: cerca de
  rationale: Diante de uma medida, indica aproximação.
- source_word: σταδίους εἴκοσι πέντε ἢ τριάκοντα
  choice: vinte e cinco ou trinta estádios
  rationale: Preserva no texto a unidade antiga do grego; a equivalência moderna é explicada em nota.
- source_word: θεωροῦσιν
  choice: viram
  rationale: Expressa de modo claro e natural a percepção visual no contexto narrativo.
- source_word: περιπατοῦντα ἐπὶ τῆς θαλάσσης
  choice: andando sobre o mar
  rationale: Preserva θάλασσα como “mar” e comunica que Jesus caminhava sobre sua superfície, sem enfraquecer a descrição.
- source_word: ἐγγὺς τοῦ πλοίου γινόμενον
  choice: aproximando-se do barco
  rationale: γίνομαι com ἐγγύς descreve a passagem para a proximidade, isto é, um movimento de aproximação.
- source_word: πλοίου
  choice: barco
  rationale: No contexto do mar da Galileia, “barco” é mais adequado e natural que “navio”.
- source_word: ἐφοβήθησαν
  choice: ficaram com medo
  rationale: Traduz de maneira idiomática a reação de temor indicada pelo aoristo.
theological_decisions:
- issue: Descrição do milagre sem atenuar seu sentido direto
  choice: andando sobre o mar
  alternative: andando à beira do mar; andando sobre a água
  rationale: O contexto e ἐπί com o genitivo indicam que Jesus caminhava sobre o próprio mar. “À beira do mar” não se ajusta à localização dos discípulos, e “sobre a água”, embora correto quanto ao sentido, substitui o substantivo grego “mar” por uma formulação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura foi ajustada à fluência portuguesa, preservando a sequência narrativa, a unidade antiga e a formulação marcante do grego.
