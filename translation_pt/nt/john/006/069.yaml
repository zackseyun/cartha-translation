reference: John 6:69
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς πεπιστεύκαμεν καὶ ἐγνώκαμεν ὅτι σὺ εἶ ὁ ⸀ἅγιος τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/069.yaml
  text: And we have believed and have come to know that you are the Holy One of God[a][b].
translation:
  language: pt
  text: E nós cremos e sabemos que tu és o Santo de Deus[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “o Cristo, o Filho do Deus vivo”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “o Santo da parte de Deus”. O genitivo grego pode expressar relação ou origem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: nós
  rationale: O pronome explícito é enfático no grego. Em português, “nós” expresso preserva essa ênfase sem recorrer à forma mais pesada “nós mesmos”.
- source_word: πεπιστεύκαμεν
  choice: temos crido
  rationale: O perfeito indica uma fé estabelecida, resultante de uma ação anterior e ainda vigente. “Temos crido” conserva tanto o aspecto anterior quanto sua continuidade presente.
- source_word: ἐγνώκαμεν
  choice: chegamos a saber
  rationale: O perfeito de γινώσκω comunica conhecimento adquirido que permanece. “Chegamos a saber” expressa naturalmente a aquisição e a posse presente desse conhecimento.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo da fé e do conhecimento.
- source_word: ὁ ἅγιος
  choice: o Santo
  rationale: Trata-se de um título cristológico que apresenta Jesus como aquele singularmente santo e separado por Deus. “O Santo” é natural, dignificado e preserva seu caráter titular.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: A construção genitiva pode indicar relação, pertencimento ou origem. “De Deus” mantém essa amplitude sem escolher indevidamente apenas uma dessas nuances.
theological_decisions:
- issue: Título cristológico em João 6:69
  choice: o Santo de Deus
  alternative: o Santo que vem de Deus; o Cristo, o Filho do Deus vivo
  rationale: O texto da SBLGNT traz ὁ ἅγιος τοῦ θεοῦ. A tradução reproduz diretamente esse título, sem harmonizá-lo com Mateus 16:16 nem adotar expansões manuscritas posteriores. “De Deus” preserva a amplitude teológica do genitivo.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Registro digno e acessível; o paralelismo dos dois perfeitos gregos é preservado de modo compreensível, e a ambiguidade do genitivo é mantida no texto e esclarecida em nota.
