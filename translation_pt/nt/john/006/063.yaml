  text: τὸ πνεῦμά ἐστιν τὸ ζῳοποιοῦν, ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν· τὰ ῥήματα ἃ ἐγὼ ⸀λελάληκα ὑμῖν πνεῦμά ἐστιν καὶ ζωή ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/063.yaml
  text: It is the Spirit who gives life[a]; the flesh benefits nothing[c][b]. The words that I have spoken to you are spirit and are life.
translation:
  language: pt
  text: É o Espírito que dá vida[a]; a carne não serve para nada[b]. As palavras que eu lhes falei são espírito e vida[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “É o espírito que dá vida”. O grego πνεῦμα pode significar “Espírito” ou “espírito”; neste contexto, provavelmente se refere ao Espírito Santo.'
    reason: alternative_reading
  - marker: b
    text: “A carne” pode referir-se, em sentido amplo, ao que é meramente humano. Traduzir por “natureza pecaminosa” seria mais interpretativo do que o grego exige.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “são Espírito e vida”; ou, em sentido explicativo, “são espirituais e dão vida”. A expressão grega é concisa e provavelmente qualitativa.'
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: Espírito
  rationale: Na primeira oração, o sujeito articulado e o contexto joanino favorecem uma referência definida ao Espírito Santo. A inicial maiúscula expressa essa leitura provável, enquanto a nota preserva a possibilidade lexical de “espírito”.
- source_word: ζῳοποιοῦν
  choice: que dá vida
  rationale: O particípio presente denota dar vida ou vivificar. Esta formulação é natural em português, mantém a agência pessoal do Espírito e preserva o valor verbal.
- source_word: σὰρξ
  choice: carne
  rationale: “Carne” conserva a amplitude e a tensão do termo grego no contraste com o Espírito, sem restringi-lo a “natureza pecaminosa”, “corpo” ou “esforço humano”.
- source_word: ὠφελεῖ οὐδέν
  choice: não serve para nada
  rationale: Expressa em português atual a ausência absoluta de proveito indicada pelo verbo com οὐδέν, sem recorrer ao menos corrente “não aproveita nada”.
- source_word: ῥήματα
  choice: palavras
  rationale: Refere-se às declarações proferidas por Jesus; “palavras” é direto, claro e natural.
- source_word: λελάληκα
  choice: tenho falado
  rationale: O pretérito perfeito composto preserva, de modo natural, algo do aspecto perfeito grego e da relevância continuada das palavras pronunciadas.
- source_word: πνεῦμά ἐστιν
  choice: são espírito
  rationale: A formulação mantém a expressão grega concisa e seu provável valor qualitativo. A minúscula evita identificar de maneira excessivamente categórica as palavras com o Espírito Santo.
- source_word: ζωή
  choice: vida
  rationale: É a correspondência direta e natural para o termo joanino, preservando sua profundidade teológica sem explicitação adicional.
theological_decisions:
- issue: Referente de πνεῦμα na primeira oração
  choice: “Espírito”, entendido provavelmente como o Espírito Santo
  alternative: “espírito”, como princípio espiritual ou espírito humano
  rationale: O artigo e o contexto do Evangelho de João favorecem o Espírito Santo como agente que dá vida, mas a nota registra a ambiguidade lexical real.
- issue: Sentido de σὰρξ no contraste com o Espírito
  choice: Manter “carne” como termo amplo
  alternative: “natureza pecaminosa”, “mero esforço humano” ou “corpo físico”
  rationale: O texto não especifica uma dessas interpretações. “Carne” preserva a tensão teológica e evita introduzir uma antropologia denominacional.
- issue: Força de πνεῦμά ἐστιν na oração final
  choice: 'Leitura qualitativa: “são espírito”'
  alternative: 'Leitura identificadora: “são Espírito”; ou explicativa: “são espirituais”'
  rationale: O predicativo sem artigo favorece uma qualidade ou característica. A tradução conserva a formulação incisiva sem resolver além do que a gramática exige.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Não serve para nada” comunica naturalmente a negação enfática; “lhes tenho falado” preserva o aspecto verbal sem soar arcaico. Mantêm-se “carne” e “são espírito” para não eliminar ambiguidades genuínas do original.
