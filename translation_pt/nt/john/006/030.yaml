  naturalness: O texto é claro e moderno, com boa legibilidade brasileira. «Então, disseram-lhe» é mais idiomático e menos causalmente forte que «Por isso, disseram-lhe», e conserva a progressão discursiva de οὖν.
  terminology: «Sinal» mantém o vocabulário característico de João. «Obra» e «realiza» refletem adequadamente ἐργάζῃ e distinguem a segunda pergunta de ποιεῖς. A nota revisada preserva a diferença entre πιστεύω + dativo e πιστεύω εἰς + acusativo.
