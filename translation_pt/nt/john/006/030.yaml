  text: εἶπον οὖν αὐτῷ· Τί οὖν ποιεῖς σὺ σημεῖον, ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι; τί ἐργάζῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/030.yaml
  text: So they said to him[a], “Then what sign are you doing, so that we may see and believe you? What work are you doing?”
translation:
  language: pt
  text: 'Então, disseram-lhe: “Então, que sinal você faz, para que vejamos e acreditemos em você[a]? Que obra você realiza?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “acreditemos no que você diz” ou “confiemos em você”. O grego usa o pronome no dativo; a construção pode expressar dar crédito a alguém ou ao que essa pessoa diz, e difere da expressão joanina mais comum para “crer em” alguém, com εἰς.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον οὖν αὐτῷ
  choice: Por isso, disseram-lhe
  rationale: O primeiro οὖν liga a pergunta à fala anterior de Jesus; “por isso” expressa a consequência de modo natural, e αὐτῷ é representado por “lhe”.
- source_word: Τί οὖν
  choice: Então, que
  rationale: Mantém o segundo οὖν e a força insistente da resposta, em ordem natural no português moderno.
- source_word: ποιεῖς σὺ σημεῖον
  choice: que sinal você faz
  rationale: Preserva o presente de ποιεῖς, a ênfase explícita de σὺ em “você” e o termo joanino σημεῖον como “sinal”, sem acrescentar “milagroso”.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι
  choice: para que vejamos e acreditemos em você
  rationale: “Para que” expressa a finalidade de ἵνα com os subjuntivos. Em português corrente, “acreditar em você” pode comunicar dar crédito ou depositar confiança; a nota registra a construção grega e suas possíveis nuances sem impor uma única leitura.
- source_word: τί ἐργάζῃ
  choice: Que obra você realiza?
  rationale: “Realiza” diferencia ἐργάζῃ do ποιεῖς anterior e conserva a referência a uma obra ou feito apresentado como credencial.
theological_decisions:
- issue: Força de πιστεύω com o dativo σοι
  choice: acreditemos em você
  alternative: acreditemos no que você diz; confiemos em você
  rationale: O grego usa o pronome no dativo, não a construção joanina mais característica πιστεύω εἰς. A expressão portuguesa escolhida permanece natural e permite tanto a ideia de dar crédito quanto a de confiar; a nota explicita a distinção gramatical.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O tratamento singular “você” torna explícita a ênfase de σὺ sem recorrer ao mais regional “tu”. A repetição dos dois οὖν é preservada por “Por isso” e “Então”.
