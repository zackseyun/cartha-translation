id: JHN.6.35
reference: John 6:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Εἶπεν αὐτοῖς ὁ Ἰησοῦς· Ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς· ὁ ἐρχόμενος πρὸς ἐμὲ οὐ μὴ πεινάσῃ, καὶ ὁ πιστεύων εἰς ⸀ἐμὲ οὐ μὴ ⸀διψήσει πώποτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/035.yaml
  text: Jesus said to them, “I am the bread of life; the one who comes to me will never hunger, and the one who believes in me will never thirst again.”
translation:
  language: pt
  text: 'Jesus lhes disse: “Eu sou o pão da vida. Quem vem a mim jamais terá fome, e quem crê em mim jamais terá sede[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de modo nenhum terá sede, nunca”. O grego emprega uma negação enfática, reforçada por “alguma vez”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν αὐτοῖς
  choice: lhes disse
  rationale: Forma narrativa natural e fiel para o aoristo de λέγω com o dativo αὐτοῖς.
- source_word: Ἐγώ εἰμι
  choice: Eu sou
  rationale: Preserva a autoidentificação direta e a ênfase possível do pronome explícito sem acrescentar interpretação.
- source_word: ὁ ἄρτος τῆς ζωῆς
  choice: o pão da vida
  rationale: Mantém a expressão genitiva e a força da metáfora de maneira tradicional, clara e transparente.
- source_word: ὁ ἐρχόμενος πρὸς ἐμέ
  choice: Quem vem a mim
  rationale: Expressa naturalmente o particípio substantivado de sentido genérico e contínuo.
- source_word: οὐ μὴ πεινάσῃ
  choice: jamais terá fome
  rationale: Comunica em português atual a forte negação de οὐ μή sem formulação artificial.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: quem crê em mim
  rationale: É a formulação portuguesa estabelecida e transparente para o uso joanino de πιστεύω com εἰς.
- source_word: οὐ μὴ διψήσει πώποτε
  choice: jamais terá sede
  rationale: Reproduz a negação intensificada por οὐ μή e πώποτε sem introduzir a noção de 'novamente', que não é exigida pelo grego.
theological_decisions:
- issue: Sentido de πιστεύων εἰς ἐμέ
  choice: quem crê em mim
  alternative: quem confia em mim
  rationale: “Crê em” preserva a terminologia joanina e a relação expressa pela construção, sem reduzir seu sentido apenas à confiança.
- issue: Força da autoidentificação Ἐγώ εἰμι
  choice: Eu sou
  alternative: Eu mesmo sou
  rationale: A tradução direta permite que as ressonâncias joaninas permaneçam abertas, sem impor uma explicação teológica ao texto.
- issue: Alcance de πώποτε
  choice: jamais terá sede
  alternative: de modo nenhum terá sede, nunca
  rationale: πώποτε significa “alguma vez/em qualquer tempo” e, sob negação, reforça “nunca”; não significa propriamente “novamente”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Jamais terá fome/sede” conserva o paralelismo e a ênfase sem soar excessivamente literal.
