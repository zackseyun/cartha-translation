  text: ὁ δὲ λέγει αὐτοῖς· Ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/020.yaml
  text: But he said to them[a], “It is I; do not be afraid.”
translation:
  language: pt
  text: 'Mas ele lhes disse: “Sou eu[a]. Não tenham medo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Eu sou”. Em João, essa expressão pode funcionar como simples autoidentificação e também evocar temas teológicos mais amplos.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ
  choice: Mas ele
  rationale: δέ marca uma transição ou contraste leve, e o artigo ὁ tem função pronominal, referindo-se a Jesus. “Mas ele” é natural no contexto.
- source_word: λέγει
  choice: disse
  rationale: Embora o grego empregue o presente histórico, o pretérito é a forma narrativa mais natural em português neste contexto.
- source_word: αὐτοῖς
  choice: lhes
  rationale: O pronome dativo plural é traduzido diretamente sem explicitar novamente “os discípulos”, cuja identidade já é dada pelo contexto.
- source_word: Ἐγώ εἰμι
  choice: Sou eu
  rationale: No contexto imediato, a expressão identifica Jesus aos discípulos assustados. “Sou eu” é a forma idiomática e natural em português; a tradução mais literal, “Eu sou”, é preservada em nota por sua possível ressonância no Evangelho de João.
- source_word: μὴ φοβεῖσθε
  choice: Não tenham medo
  rationale: Expressa naturalmente em português moderno a proibição e o encorajamento dados aos discípulos.
theological_decisions:
- issue: Se Ἐγώ εἰμι deve ser traduzido como simples autoidentificação ou como “Eu sou”, com possíveis ressonâncias teológicas
  choice: 'Texto principal: “Sou eu”'
  alternative: “Eu sou”
  rationale: O contexto imediato favorece a autoidentificação tranquilizadora. Contudo, a formulação grega pode carregar ressonâncias mais amplas em João; por isso, a alternativa literal é mantida em nota, sem impor nem eliminar essa possibilidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A colocação pronominal em “lhes disse” mantém fluidez sem excessiva formalidade.
