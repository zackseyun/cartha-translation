id: JHN.6.57
reference: John 6:57
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ ὁ τρώγων με κἀκεῖνος ⸀ζήσει δι’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/057.yaml
  text: Just as the living Father sent me[a], and I live because of the Father[b], so also the one who feeds on me will live because of me.
translation:
  language: pt
  text: Assim como o Pai vivo me enviou, e eu vivo por causa do Pai, também aquele que se alimenta de mim[a] viverá por causa de mim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «aquele que me come». O verbo grego é vívido e concreto e se refere literalmente a comer ou mastigar.
    reason: lexical_alternative
  - marker: b
    text: Ou «por meio do Pai» e «por meio de mim». A preposição grega pode ter sentido causal ou instrumental; o texto principal adota o sentido causal para preservar o paralelo entre Pai e Filho e entre Filho e discípulo.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: Assim como
  rationale: Introduz diretamente a comparação que estrutura toda a frase; «também» na oração correspondente torna a relação natural e clara em português.
- source_word: ὁ ζῶν πατὴρ
  choice: o Pai vivo
  rationale: Preserva o particípio atributivo e a ênfase joanina na vida, sem ampliar o sentido para «Pai que dá vida».
- source_word: ἀπέστειλέν
  choice: enviou
  rationale: Traduz de modo direto e natural o aoristo indicativo, sem especificar em excesso a natureza do envio.
- source_word: ζῶ
  choice: vivo
  rationale: Mantém o presente verbal e o paralelo explícito com «viverá».
- source_word: διὰ τὸν πατέρα
  choice: por causa do Pai
  rationale: διά com acusativo expressa naturalmente causa ou fundamento neste contexto, e esta formulação preserva o paralelo com δι’ ἐμέ.
- source_word: ὁ τρώγων με
  choice: aquele que se alimenta de mim
  rationale: Conserva o sentido concreto e contínuo do particípio, em português natural, sem decidir entre uma leitura sacramental e uma leitura metafórica.
- source_word: κἀκεῖνος
  choice: também aquele
  rationale: Representa a força enfática de «também esse» de maneira idiomática e mantém a correspondência da comparação.
- source_word: ζήσει
  choice: viverá
  rationale: Preserva o futuro indicativo e o paralelo verbal com «eu vivo».
- source_word: δι’ ἐμέ
  choice: por causa de mim
  rationale: Mantém o sentido causal provável e a simetria da relação Pai–Filho / Filho–discípulo.
theological_decisions:
- issue: A relação da vida de Jesus com o Pai em διὰ τὸν πατέρα
  choice: «eu vivo por causa do Pai»
  alternative: «eu vivo por meio do Pai»
  rationale: A tradução causal corresponde naturalmente a διά com acusativo e preserva a analogia do versículo, sem extrair conclusões ontológicas sobre a relação entre o Pai e o Filho.
- issue: A força sacramental ou metafórica de ὁ τρώγων με
  choice: «aquele que se alimenta de mim»
  alternative: «aquele que me come»
  rationale: A formulação mantém a imagem concreta de comer e deixa abertas as principais leituras teológicas do discurso, sem reduzir o texto a uma interpretação exclusivamente sacramental ou exclusivamente figurada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Pai vivo» mantém a concisão do grego; «se alimenta de mim» soa natural sem eliminar a concretude da imagem. Os marcadores [a] e [b] aparecem no texto principal junto às expressões pertinentes.
