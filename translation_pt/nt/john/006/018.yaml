  yaml_path: translation/nt/john/006/018.yaml
  text: And the sea was being stirred up because a strong wind was blowing[a].
translation:
  language: pt
  text: E o mar estava sendo agitado, porque soprava um vento forte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mar estava sendo revolvido” ou “o mar se levantava”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥ τε θάλασσα
  choice: E o mar
  rationale: θάλασσα significa diretamente “mar”. Embora o contexto seja o mar da Galileia, o grego emprega o substantivo comum. τε tem função conectiva leve, representada naturalmente por “E”.
- source_word: ἀνέμου μεγάλου
  choice: um vento forte
  rationale: ἄνεμος é “vento”, e μέγας, aplicado a um fenômeno meteorológico, é expresso idiomaticamente por “forte”, sem intensificar para “violento”.
- source_word: πνέοντος
  choice: porque soprava
  rationale: O particípio presente ativo descreve a circunstância associada ao estado do mar. A oração causal comunica em português a relação contextual e preserva o aspecto contínuo.
- source_word: διεγείρετο
  choice: estava ficando agitado
  rationale: O imperfeito passivo retrata um processo contínuo que afetava o mar. “Estava ficando agitado” conserva a progressão e a ideia de agitação sem acrescentar explicitamente ondas não mencionadas pelo verbo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção progressiva procura refletir o imperfeito grego; a nota preserva alternativas lexicais legítimas.
