    rationale: O imperfeito de θέλω descreve disposição ou vontade em curso no fluxo narrativo. «Quiseram» tende a apresentar uma decisão pontual; «estavam dispostos» conserva melhor o aspecto e o sentido contextual.
  - severity: low
