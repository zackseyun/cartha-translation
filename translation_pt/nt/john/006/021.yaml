    rationale: A expressão é aceitável, mas «levá-lo para dentro do barco» reproduz mais claramente o verbo concreto e o movimento indicado por εἰς.
  - severity: low
    issue: Alternativa da nota
    rationale: «Junto à terra» acrescenta uma relação de proximidade que não é expressa diretamente. Uma nota com «estava em terra» indica mais precisamente a construção literal, com a ressalva implícita de que o texto principal evita sugerir que o barco estivesse encalhado.
