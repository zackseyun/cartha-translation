  source_fidelity: A segunda oração comunica adequadamente a chegada imediata, mas «quiseram» torna o imperfeito ἤθελον mais pontual do que o original. «Estavam dispostos» preserva melhor a disposição continuada. «Recebê-lo no barco» é compreensível, porém «levá-lo para dentro do barco» representa mais diretamente λαβεῖν ... εἰς τὸ πλοῖον.
  naturalness: «Então estavam dispostos a levá-lo para dentro do barco» é português moderno, claro e natural. «Para dentro do barco» explicita de forma idiomática o valor de εἰς sem introduzir interpretação indevida.
  terminology: «Barco», «imediatamente» e «terra» são escolhas adequadas. A nota deve apresentar uma alternativa genuína ao texto principal; a formulação «estava junto à terra» não corresponde de modo particularmente direto a ἐπὶ τῆς γῆς, para o qual «estava em terra» é a alternativa mais literal, embora possa sugerir encalhe.
