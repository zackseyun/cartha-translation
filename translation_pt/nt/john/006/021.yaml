source:
  edition: SBLGNT
  text: ἤθελον οὖν λαβεῖν αὐτὸν εἰς τὸ πλοῖον, καὶ εὐθέως ⸂ἐγένετο τὸ πλοῖον⸃ ἐπὶ τῆς γῆς εἰς ἣν ὑπῆγον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/021.yaml
  text: So they were willing to take him into the boat[a], and immediately the boat was at the land to which they were going.
translation:
  language: pt
  text: Então estavam dispostos a levá-lo para dentro do barco, e imediatamente o barco chegou à terra para onde iam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «e imediatamente o barco estava em terra para onde iam».'
    reason: A construção ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς pode ser expressa de modo mais literal como o barco vindo a estar em terra; o texto principal, «chegou à terra», é mais natural em português e evita sugerir que a embarcação estivesse encalhada.
lexical_decisions:
- source_word: ἤθελον
  choice: quiseram
  rationale: O imperfeito de θέλω exprime aqui a disposição ou intenção dos discípulos após reconhecerem Jesus. Em português, «quiseram» é natural e não exige explicitar mais do que o grego.
- source_word: οὖν
  choice: Então
  rationale: Marca a consequência narrativa do que precede de modo claro e corrente.
- source_word: λαβεῖν αὐτὸν εἰς τὸ πλοῖον
  choice: recebê-lo no barco
  rationale: Neste contexto, λαμβάνω pode indicar acolher Jesus a bordo. «Recebê-lo no barco» é idiomático e preserva essa nuance.
- source_word: πλοῖον
  choice: barco
  rationale: É a designação natural para a embarcação usada no mar da Galileia; «navio» sugeriria uma embarcação maior.
- source_word: εὐθέως
  choice: imediatamente
  rationale: Preserva a forte indicação de rapidez e a possível força extraordinária da transição.
- source_word: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς
  choice: o barco chegou à terra
  rationale: γίνομαι com expressão locativa pode indicar que algo veio a estar em determinado lugar. «Chegou à terra» soa natural em português sem sugerir que o barco ficou literalmente sobre o solo.
- source_word: γῆς
  choice: terra
  rationale: Mantém o equivalente mais direto de γῆ no sentido do local de desembarque; «margem» é uma possibilidade contextual registrada em nota.
- source_word: εἰς ἣν ὑπῆγον
  choice: para onde iam
  rationale: Reproduz com naturalidade o destino e o aspecto contínuo do deslocamento expresso pelo imperfeito.
theological_decisions:
- issue: Se a segunda oração deve explicar ou atenuar a aparente chegada milagrosamente imediata
  choice: Manter «imediatamente» e a afirmação direta de que o barco chegou à terra
  alternative: Traduzir de forma atenuada, como «logo o barco alcançou a margem»
  rationale: O grego apresenta a transição de maneira breve e enfática. A tradução preserva essa tensão narrativa sem explicar se houve transporte milagroso ou apenas uma chegada muito rápida.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. A ordem narrativa e a ênfase em «imediatamente» foram preservadas; evitou-se linguagem arcaica e também uma explicação interpretativa do caráter súbito da chegada.
