  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ, ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ τὸν ἀληθινόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/032.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, Moses has not given you the bread from heaven[b], but my Father gives you the true bread from heaven.”
translation:
  language: pt
  text: 'Então Jesus lhes disse: “Em verdade, em verdade lhes digo: não foi Moisés[a] quem lhes deu o pão do céu, mas meu Pai lhes dá o verdadeiro[b] pão do céu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “Moisés não lhes deu o pão do céu”. No grego, a negação vem antes de “Moisés”, destacando especialmente o contraste quanto a quem dá o pão.'
    reason: lexical_alternative
  - marker: b
    text: '“Verdadeiro” também pode ter o sentido de “real” ou “genuíno”: o pão celestial em sua realidade plena, e não apenas o maná anterior como sinal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Mantém a ligação com o diálogo anterior e soa natural em português, sem tornar a inferência mais forte do que o contexto exige.
- source_word: Ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Preserva a repetição solene e enfática característica das declarações de Jesus no Evangelho de João.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Tradução direta e idiomática que se integra naturalmente à fórmula solene precedente.
- source_word: οὐ Μωϋσῆς δέδωκεν ὑμῖν
  choice: não foi Moisés quem lhes deu
  rationale: A construção realça o contraste de agente indicado pela posição da negação antes de Μωϋσῆς. O pretérito perfeito simples é a forma portuguesa natural para a dádiva passada do maná.
- source_word: τὸν ἄρτον ἐκ τοῦ οὐρανοῦ
  choice: o pão do céu
  rationale: Expressão clara e corrente que conserva a imagem e a procedência celestial indicadas por ἐκ τοῦ οὐρανοῦ.
- source_word: ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν
  choice: mas meu Pai lhes dá
  rationale: O presente “dá” preserva o contraste com a dádiva passada associada a Moisés e apresenta a ação do Pai como atual.
- source_word: τὸν ἀληθινόν
  choice: o verdadeiro
  rationale: '“Verdadeiro” conserva a amplitude de ἀληθινός em João: aquilo que é genuíno, pleno ou definitivo, sem reduzir o termo a uma única interpretação.'
theological_decisions:
- issue: Contraste entre Moisés e o Pai como agentes da dádiva
  choice: “não foi Moisés quem lhes deu... mas meu Pai lhes dá”
  alternative: “Moisés não lhes deu... mas meu Pai lhes dá”
  rationale: A construção escolhida torna audível em português o destaque que a ordem grega dá à negação de Moisés como agente, sem negar que o maná tenha sido recebido no período de Moisés.
- issue: Contraste temporal entre δέδωκεν e δίδωσιν
  choice: “deu... dá”
  alternative: “tem dado... dá”
  rationale: O português normalmente usa o pretérito perfeito simples para um ato passado concluído; “tem dado” sugeriria ação repetida ou continuada. “Deu... dá” conserva de maneira natural o contraste entre a tradição do maná e a dádiva presente do Pai.
- issue: Sentido de ἀληθινός aplicado ao pão
  choice: “o verdadeiro pão”
  alternative: “o pão real” ou “o pão genuíno”
  rationale: “Verdadeiro” mantém a tensão joanina entre a realidade plena oferecida pelo Pai e o maná anterior, sem explicar antecipadamente de que modo esse pão é verdadeiro.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fórmula “Em verdade, em verdade” mantém a solenidade e a repetição do original; os pronomes “lhes” evitam regionalismos e preservam o plural de ὑμῖν.
