id: JHN.6.65
reference: John 6:65
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Διὰ τοῦτο εἴρηκα ὑμῖν ὅτι οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/065.yaml
  text: And he was saying[b][a], “For this reason I have told you that no one is able to come to me unless it has been given to him from the Father.”
translation:
  language: pt
  text: 'E ele dizia: “Por isso eu lhes disse que ninguém pode vir a mim, se isso não lhe[b] for dado[a] da parte do Pai.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “for concedido”.'
    reason: lexical_alternative
  - marker: b
    text: O grego emprega aqui uma forma masculina singular com sentido genérico.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ele dizia
  rationale: O imperfeito grego apresenta a fala em andamento no contexto do discurso. “Dizia” preserva esse aspecto sem tornar a frase pesada.
- source_word: Διὰ τοῦτο
  choice: Por isso
  rationale: A expressão retoma a explicação anterior e introduz a razão da declaração; “por isso” é claro, natural e mantém a conexão lógica.
- source_word: εἴρηκα ὑμῖν
  choice: eu lhes disse
  rationale: O perfeito grego aponta para uma declaração anterior ainda relevante. Em português corrente, o pretérito perfeito simples expressa naturalmente essa referência retrospectiva no discurso.
- source_word: οὐδεὶς δύναται
  choice: ninguém pode
  rationale: Expressa incapacidade, não mera falta de permissão. “Ninguém pode” é a formulação portuguesa mais natural e conserva essa força.
- source_word: ἐλθεῖν πρός με
  choice: vir a mim
  rationale: É a correspondência idiomática direta e preserva, sem explicitação interpretativa, o sentido relacional característico do contexto joanino.
- source_word: ἐὰν μὴ ᾖ δεδομένον
  choice: se isso não ... for dado
  rationale: A construção passiva perifrástica estabelece uma condição necessária. “Isso” representa o neutro implícito e “for dado” mantém o valor lexical de δίδωμι sem substituir a imagem por uma explicação teológica.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome grego está no masculino singular com referência genérica. “Lhe” conserva o singular sem introduzir gênero desnecessariamente em português.
- source_word: ἐκ τοῦ πατρός
  choice: da parte do Pai
  rationale: A expressão preserva o sentido de fonte ou origem de ἐκ e soa mais natural em português do que uma reprodução rígida como “de dentro do Pai”; evita também reduzir a preposição à simples marca de agente.
theological_decisions:
- issue: A capacitação divina e a capacidade humana de vir a Jesus
  choice: Afirmar diretamente que ninguém pode vir a Jesus sem que isso lhe seja dado da parte do Pai.
  alternative: Explicitar essa concessão como irresistível ou, em sentido oposto, como capacitação preveniente oferecida de modo geral.
  rationale: O grego estabelece a dádiva procedente do Pai como condição necessária, mas não define aqui sua natureza, extensão ou relação sistemática com a resposta humana. A tradução mantém essa tensão.
- issue: O masculino singular genérico de αὐτῷ
  choice: Traduzir por “lhe” e esclarecer em nota a forma do grego.
  alternative: Empregar “a essa pessoa” ou uma formulação plural inclusiva.
  rationale: “Lhe” é singular e idiomático, abrange qualquer pessoa no contexto e não apaga a informação relevante da forma grega, registrada na nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Por isso”, “ninguém pode” e “vir a mim” mantêm clareza oral; “da parte do Pai” conserva a ideia de origem sem rigidez excessiva. Os marcadores [a] e [b] aparecem junto aos termos correspondentes no texto principal.
