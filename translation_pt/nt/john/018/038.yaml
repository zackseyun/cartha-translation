    issue: A expressão “para falar com os judeus” acrescenta finalidade.
    rationale: πρὸς τοὺς Ἰουδαίους expressa movimento em direção ao grupo; embora Pilatos de fato lhes fale em seguida, o infinitivo de finalidade não está no original.
  - severity: medium
    issue: “Não encontro nenhuma acusação contra ele” não reproduz com precisão o sentido jurídico de αἰτίαν.
    rationale: A frase pode ser entendida como inexistência de uma acusação formal, ao passo que Pilatos declara não encontrar nele fundamento ou base para acusação.
  - severity: low
    issue: A nota usa “autoridades da Judeia”.
    rationale: O ponto contextual é que οἱ Ἰουδαῖοι pode designar as autoridades judaicas ou um grupo representativo; “da Judeia” pode deslocar indevidamente a ênfase para geografia.
