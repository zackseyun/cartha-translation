  text: λέγει αὐτῷ ὁ Πιλᾶτος· Τί ἐστιν ἀλήθεια; Καὶ τοῦτο εἰπὼν πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους, καὶ λέγει αὐτοῖς· Ἐγὼ οὐδεμίαν ⸂εὑρίσκω ἐν αὐτῷ αἰτίαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/038.yaml
  text: Pilate said to him[a], “What is truth?” After saying this, he went out again to the Jews and said to them, “I find no case against him.”
translation:
  language: pt
  text: 'Pilatos lhe disse: “O que é a verdade?” Depois de dizer isso, foi novamente até os judeus[a] e lhes disse: “Não encontro nele fundamento para acusação alguma.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os líderes judeus”. Em João, “os judeus” pode às vezes referir-se mais especificamente às autoridades judaicas ou ao grupo representativo que se opõe a Jesus no contexto imediato.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Πιλᾶτος
  choice: Pilatos lhe disse
  rationale: O presente histórico λέγει é vertido pelo passado, natural na narrativa portuguesa; αὐτῷ é expresso pelo pronome indireto “lhe”.
- source_word: Τί ἐστιν ἀλήθεια;
  choice: O que é a verdade?
  rationale: Embora ἀλήθεια esteja sem artigo no grego, em português a formulação idiomática e abrangente exige normalmente o artigo, sem restringir o sentido filosófico da pergunta.
- source_word: Καὶ τοῦτο εἰπὼν
  choice: Depois de dizer isso
  rationale: Explicita de modo natural a anterioridade indicada pelo particípio aoristo εἰπών.
- source_word: πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους
  choice: saiu novamente para falar com os judeus
  rationale: “Novamente” preserva πάλιν, e “saiu” traduz diretamente ἐξῆλθεν. A expressão “para falar com” torna natural em português o movimento em direção ao grupo no fluxo narrativo; “os judeus” mantém no texto principal a forma lexical do grego.
- source_word: καὶ λέγει αὐτοῖς
  choice: e lhes disse
  rationale: O segundo presente histórico é igualmente traduzido pelo passado; “lhes” retoma o grupo mencionado.
- source_word: Ἐγὼ οὐδεμίαν εὑρίσκω ἐν αὐτῷ αἰτίαν
  choice: Não encontro nenhuma acusação contra ele
  rationale: No contexto judicial, αἰτία designa acusação, imputação ou fundamento de acusação. A formulação é clara e preserva o caráter forense, enquanto ἐν αὐτῷ é expresso idiomaticamente por “contra ele”.
theological_decisions:
- issue: Referente e tradução de τοὺς Ἰουδαίους na narrativa da paixão em João
  choice: Manter “os judeus” no texto principal e registrar em nota a possibilidade contextual “os líderes judeus”.
  alternative: Traduzir diretamente por “os líderes judeus” ou “os judeanos”.
  rationale: 'A forma lexical do original é preservada sem pressupor que a expressão inclua indistintamente todo o povo judeu. A nota mantém aberta a possibilidade de um referente contextual mais restrito: as autoridades ou o grupo representativo que se opunha a Jesus naquela cena.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva a concisão e a tensão da pergunta de Pilatos, usando vocabulário jurídico corrente sem tecnicismo excessivo.
