base_translation:
  language: en
  yaml_path: translation/nt/john/018/015.yaml
  text: Simon Peter was following Jesus[a], and so was another disciple. That disciple was known to the high priest, and he went in with Jesus into the courtyard of the high priest,
translation:
  language: pt
  text: Simão Pedro seguia Jesus[a], assim como outro discípulo. Esse discípulo era conhecido do sumo sacerdote e entrou com Jesus no pátio do sumo sacerdote,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Simão Pedro seguia Jesus, e outro discípulo [também o seguia].” No grego, o verbo referente ao segundo discípulo fica implícito.'
    reason: alternativa lexical
lexical_decisions:
- source_word: Ἠκολούθει
  choice: seguia
  rationale: O imperfeito apresenta a ação em andamento no cenário narrativo; “seguia” preserva esse aspecto com naturalidade.
- source_word: δὲ
  choice: sem tradução explícita
  rationale: Aqui funciona como conectivo narrativo leve; a progressão é natural em português sem acrescentar “então”, “ora” ou uma oposição indevida.
- source_word: καὶ ἄλλος μαθητής
  choice: e outro discípulo também
  rationale: Explicita de maneira idiomática que o outro discípulo compartilhava a ação de seguir Jesus, implícita na coordenação grega.
- source_word: μαθητής
  choice: discípulo
  rationale: Termo tradicional, claro e contextualmente preciso em João para um aprendiz e seguidor de Jesus.
- source_word: ἐκεῖνος
  choice: esse
  rationale: Retoma naturalmente em português o “outro discípulo” recém-mencionado, sem sugerir distância física relevante.
- source_word: γνωστὸς
  choice: conhecido
  rationale: Preserva a afirmação de familiaridade sem intensificá-la como faria “bem conhecido” ou especificá-la como “amigo”.
- source_word: ἀρχιερεῖ / ἀρχιερέως
  choice: sumo sacerdote
  rationale: Equivalente português consagrado e preciso para ἀρχιερεύς neste contexto, mantendo o singular nas duas ocorrências.
- source_word: συνεισῆλθεν
  choice: entrou com
  rationale: Expressa tanto o movimento de entrada quanto a força associativa do prefixo σύν.
- source_word: αὐλήν
  choice: pátio
  rationale: Designa com clareza a área interna descoberta ou cercada da residência, sem acrescentar a ideia não expressa de palácio.
