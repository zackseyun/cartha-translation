id: JHN.18.14
reference: John 18:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἦν δὲ Καϊάφας ὁ συμβουλεύσας τοῖς Ἰουδαίοις ὅτι συμφέρει ἕνα ἄνθρωπον ⸀ἀποθανεῖν ὑπὲρ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/014.yaml
  text: Caiaphas was the one who had advised the Jews that it was better for one man to die for the people[a][b].
translation:
  language: pt
  text: Caifás era aquele que tinha aconselhado os judeus[a] que era melhor um só homem morrer pelo povo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os líderes judeus” ou “os judeus da Judeia”, dependendo de como a expressão de João é entendida neste contexto.
    reason: alternative_reading
  - marker: b
    text: Ou “em favor do povo”; no contexto, a expressão também pode ter conotações representativas ou sacrificiais.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: era
  rationale: O δέ funciona como conexão narrativa leve; em português, o fluxo é natural sem acrescentar um marcador explícito como “ora” ou “mas”.
- source_word: Καϊάφας
  choice: Caifás
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ὁ συμβουλεύσας
  choice: aquele que tinha aconselhado
  rationale: Preserva a função identificadora do particípio aoristo articulado e apresenta o conselho como anterior ao momento narrado.
- source_word: τοῖς Ἰουδαίοις
  choice: os judeus
  rationale: Mantém a expressão não qualificada do grego; uma nota registra as possíveis delimitações contextuais.
- source_word: ὅτι συμφέρει
  choice: que era melhor
  rationale: Expressa de modo corrente a ideia de vantagem ou conveniência no contexto deliberativo.
- source_word: ἕνα ἄνθρωπον
  choice: um só homem
  rationale: Preserva tanto a referência masculina quanto a ênfase numérica em uma única pessoa.
- source_word: ἀποθανεῖν
  choice: morrer
  rationale: Equivalente direto e natural do infinitivo grego.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: pelo povo
  rationale: Formulação concisa que admite sentido benefativo ou representativo sem tornar explícita uma interpretação substitutiva.
- source_word: λαοῦ
  choice: povo
  rationale: Traduz λαός com precisão, sem confundi-lo com ἔθνος, “nação”, usado no contexto anterior.
theological_decisions:
- issue: Possível nuance representativa, sacrificial ou substitutiva de ὑπὲρ τοῦ λαοῦ
  choice: pelo povo
  alternative: em favor do povo; em lugar do povo
  rationale: “Pelo povo” conserva a amplitude semântica da preposição e a tensão entre o cálculo político de Caifás e as ressonâncias teológicas da narrativa, sem impor uma formulação doutrinária mais explícita.
- issue: Referente de τοῖς Ἰουδαίοις no uso joanino
  choice: os judeus
  alternative: os líderes judeus; os judeus da Judeia
  rationale: O original não traz uma qualificação explícita. A tradução principal preserva essa forma, enquanto a nota apresenta delimitações contextuais possíveis.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada ao uso natural do português, mantendo a ambiguidade relevante do original.
