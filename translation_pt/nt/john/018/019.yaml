id: JHN.18.19
reference: John 18:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ οὖν ἀρχιερεὺς ἠρώτησεν τὸν Ἰησοῦν περὶ τῶν μαθητῶν αὐτοῦ καὶ περὶ τῆς διδαχῆς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/019.yaml
  text: So the high priest questioned Jesus about his disciples and about his teaching[a].
translation:
  language: pt
  text: Então, o sumo sacerdote questionou Jesus sobre os seus discípulos e sobre o seu ensino.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perguntou a Jesus”. O verbo grego pode significar “perguntou” ou “questionou”; “questionou” foi usado para refletir o contexto de uma audiência formal.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e a ligação com os acontecimentos anteriores, em português natural, sem tornar explícita uma inferência mais forte do que o contexto exige.
- source_word: ἀρχιερεὺς
  choice: o sumo sacerdote
  rationale: É a designação consagrada e precisa do ofício judaico. Mantém o título singular e definido do grego sem substituir o referente por um nome próprio.
- source_word: ἠρώτησεν
  choice: questionou
  rationale: O verbo pode significar tanto 'perguntou' como 'questionou'. Neste contexto de audiência formal, 'questionou' comunica uma inquirição oficial sem a intensidade potencial de 'interrogou'.
- source_word: περὶ
  choice: sobre
  rationale: Nas duas ocorrências, introduz o assunto das perguntas. 'Sobre' é claro, corrente e reproduz naturalmente a repetição do original.
- source_word: μαθητῶν
  choice: discípulos
  rationale: Preserva a relação entre mestre e aprendizes expressa por μαθητής e corresponde ao uso estabelecido nos Evangelhos.
- source_word: διδαχῆς
  choice: ensino
  rationale: É uma opção natural e acessível, sem as possíveis conotações técnicas ou sistemáticas de 'doutrina'.
- source_word: αὐτοῦ
  choice: seus / seu
  rationale: Em ambas as ocorrências, o possessivo se refere a Jesus; as formas portuguesas concordam respectivamente com 'discípulos' e 'ensino'.
theological_decisions:
- issue: O título ἀρχιερεύς no contexto narrativo em que Jesus está diante de Anás, e não de Caifás, o sumo sacerdote reconhecido naquele ano
  choice: Traduzir diretamente como 'o sumo sacerdote'
  alternative: Identificar o personagem como 'Anás, o sumo sacerdote' ou traduzir como 'o principal sacerdote'
  rationale: A tradução conserva a apresentação do texto grego e não tenta harmonizar ou explicar a questão histórica no corpo do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula depois de 'Então' favorece a fluidez. A repetição de 'sobre' preserva o paralelismo do grego, e a colocação do marcador após a frase indica que a nota se refere à escolha verbal no conjunto da declaração.
