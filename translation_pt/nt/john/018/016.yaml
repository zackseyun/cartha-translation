    reason: lexical_alternative
  revision_rationale: 'A revisão torna explícita, sem acrescentar informação, a direção da relação indicada por γνωστός: o discípulo era conhecido pelo sumo sacerdote. Também elimina uma alternativa tautológica da nota a. Mantêm-se as demais escolhas, inclusive “porteira”, pois o texto grego já apresenta a personagem no feminino.'
