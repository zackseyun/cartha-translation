  text: ὁ δὲ Πέτρος εἱστήκει πρὸς τῇ θύρᾳ ἔξω. ἐξῆλθεν οὖν ὁ μαθητὴς ὁ ἄλλος ⸀ὁ γνωστὸς ⸂τοῦ ἀρχιερέως⸃ καὶ εἶπεν τῇ θυρωρῷ καὶ εἰσήγαγεν τὸν Πέτρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/016.yaml
  text: But Peter was standing outside at the door[a]. So the other disciple, who was known to the high priest[b], went out and spoke to the doorkeeper and brought Peter in.
translation:
  language: pt
  text: Mas Pedro estava do lado de fora, junto à porta. Então o outro discípulo, que era conhecido pelo sumo sacerdote[a], saiu, falou com a porteira[b] e fez Pedro entrar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que era conhecido do sumo sacerdote”. O grego não especifica o grau de proximidade entre eles.
    reason: lexical_alternative
  - marker: b
    text: Ou “guardiã da porta”. O termo grego designa a pessoa encarregada da porta; a forma usada aqui indica que era uma mulher.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκει
  choice: estava
  rationale: O mais-que-perfeito grego descreve aqui um estado contínuo; em português natural, “estava” expressa adequadamente a permanência de Pedro naquele lugar sem tornar a construção pesada.
- source_word: πρὸς τῇ θύρᾳ ἔξω
  choice: do lado de fora, junto à porta
  rationale: A formulação conserva tanto ἔξω, “do lado de fora”, como a localização próxima à entrada indicada por πρὸς τῇ θύρᾳ.
- source_word: ὁ μαθητὴς ὁ ἄλλος
  choice: o outro discípulo
  rationale: “Discípulo” é a tradução consagrada e preserva a dimensão relacional do termo μαθητής no relato do Evangelho.
- source_word: ὁ γνωστὸς τοῦ ἀρχιερέως
  choice: que era conhecido do sumo sacerdote
  rationale: A expressão mantém a indeterminação de γνωστός quanto ao grau de proximidade entre o discípulo e o sumo sacerdote.
- source_word: ἀρχιερεύς
  choice: sumo sacerdote
  rationale: É a designação portuguesa usual e contextualmente precisa para o ofício judaico em questão.
- source_word: θυρωρῷ
  choice: porteira
  rationale: O artigo feminino grego indica uma mulher encarregada da entrada. “Porteira” comunica de modo conciso tanto a função como o gênero, sem antecipar informação alheia ao texto.
- source_word: εἶπεν τῇ θυρωρῷ
  choice: falou com a porteira
  rationale: Como o conteúdo da fala não é citado, “falou com” é mais natural em português do que uma construção com “disse” sem complemento verbal expresso.
- source_word: εἰσήγαγεν τὸν Πέτρον
  choice: fez Pedro entrar
  rationale: 'A expressão traduz naturalmente o sentido causativo de εἰσάγω no contexto: o outro discípulo conseguiu a entrada de Pedro, sem necessariamente sugerir que o conduziu fisicamente.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Do lado de fora, junto à porta” evita a rigidez de uma reprodução excessivamente literal. “Porteira” é corrente e preserva a indicação feminina do grego. Os marcadores de todas as notas aparecem no texto principal.
