revisions:
- from: Mas Pedro estava do lado de fora, junto à porta. Então o outro discípulo, que era conhecido do sumo sacerdote[a], saiu, falou com a porteira[b] e fez Pedro entrar.
  to: Mas Pedro estava do lado de fora, junto à porta. Então o outro discípulo, que era conhecido pelo sumo sacerdote[a], saiu, falou com a porteira[b] e fez Pedro entrar.
  rationale: 'A revisão torna explícita, sem acrescentar informação, a direção da relação indicada por γνωστός: o discípulo era conhecido pelo sumo sacerdote. Também elimina uma alternativa tautológica da nota a. Mantêm-se as demais escolhas, inclusive “porteira”, pois o texto grego já apresenta a personagem no feminino.'
