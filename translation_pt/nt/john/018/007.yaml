  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πάλιν οὖν ⸂ἐπηρώτησεν αὐτούς⸃· Τίνα ζητεῖτε; οἱ δὲ εἶπαν· Ἰησοῦν τὸν Ναζωραῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/007.yaml
  text: So he asked them again[a], “Whom are you seeking?” And they said, “Jesus the Nazarene.”
translation:
  language: pt
  text: 'Então ele lhes perguntou novamente: “Quem vocês estão procurando?” Eles responderam: “Jesus, o Nazareno.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Jesus de Nazaré”; em grego, “Jesus, o Nazareno”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν
  choice: Então ... novamente
  rationale: “Então” mantém a progressão narrativa de οὖν, enquanto “novamente” expressa com clareza a repetição indicada por πάλιν.
- source_word: ἐπηρώτησεν αὐτούς
  choice: ele lhes perguntou
  rationale: Forma natural e precisa em português para a pergunta direta dirigida ao grupo; o pronome sujeito explicita Jesus conforme o contexto imediato.
- source_word: Τίνα ζητεῖτε;
  choice: Quem vocês estão procurando?
  rationale: “Quem” é a forma interrogativa natural em português, e “estão procurando” comunica de modo corrente a ação presente de ζητεῖτε sem perder seu sentido contextual.
- source_word: οἱ δὲ εἶπαν
  choice: Eles responderam
  rationale: No diálogo, “responderam” expressa naturalmente o valor de εἶπαν após uma pergunta; δέ marca a continuação narrativa e não exige uma conjunção explícita.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Jesus, o Nazareno
  rationale: Preserva Ναζωραῖον como epíteto identificador, em correspondência próxima com a construção grega, e usa a forma portuguesa consagrada do nome.
theological_decisions:
- issue: Tradução de Ναζωραῖος como designação de Jesus
  choice: o Nazareno
  alternative: de Nazaré
  rationale: “O Nazareno” preserva a forma de epíteto do grego sem transformar silenciosamente a designação em uma construção geográfica. A alternativa idiomática “de Nazaré” é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita a artificialidade de “vós” no diálogo contemporâneo; “procurando” é mais natural no contexto do que “buscando”, sem alterar o sentido.
