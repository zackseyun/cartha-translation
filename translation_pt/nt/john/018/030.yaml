  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Εἰ μὴ ἦν οὗτος ⸂κακὸν ποιῶν⸃, οὐκ ἄν σοι παρεδώκαμεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/030.yaml
  text: They answered and said to him[a], “If this man were not an evildoer, we would not have handed him over to you.”
translation:
  language: pt
  text: 'Eles responderam e lhe disseram: “Se este homem não estivesse praticando o mal, não o teríamos entregue a você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Eles responderam e lhe disseram
  rationale: Preserva os dois verbos da fórmula narrativa, de influência semítica, e expressa naturalmente o dativo αὐτῷ por meio de “lhe”.
- source_word: Εἰ μὴ ἦν
  choice: Se ... não estivesse
  rationale: Reproduz a condição contrária ao fato de modo natural em português, sem comprimi-la em “a menos que”.
- source_word: οὗτος
  choice: este homem
  rationale: Identifica claramente o referente humano e mantém o tom de distanciamento do demonstrativo, sem acrescentar desprezo.
- source_word: κακὸν ποιῶν
  choice: praticando o mal
  rationale: Conserva a força verbal do particípio ποιῶν e a carga moral ampla de κακόν, sem transformar a expressão em uma designação jurídica técnica.
- source_word: οὐκ ἄν ... παρεδώκαμεν
  choice: não ... teríamos entregado
  rationale: Expressa corretamente a consequência contrária ao fato; “entregado” é corrente e adequado ao contexto de transferência à autoridade.
- source_word: σοι ... αὐτόν
  choice: o ... a você
  rationale: Representa claramente o objeto masculino, Jesus, e o destinatário singular, Pilatos, em português moderno de ampla compreensão.
theological_decisions:
- issue: Força e natureza da acusação contra Jesus
  choice: praticando o mal
  alternative: malfeitor; criminoso; fazendo algo errado
  rationale: A expressão grega é uma acusação ampla de conduta má, não um termo técnico que especifique um crime. A formulação escolhida preserva a alegação generalizada e evasiva sem suavizá-la nem torná-la juridicamente mais precisa.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A fórmula dupla “responderam e lhe disseram” é mantida por fidelidade ao relevo narrativo do grego; “praticando o mal” soa mais idiomático que “fazendo o mal” neste contexto e preserva a construção verbal.
