id: JHN.18.26
reference: John 18:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει εἷς ἐκ τῶν δούλων τοῦ ἀρχιερέως, συγγενὴς ὢν οὗ ἀπέκοψεν Πέτρος τὸ ὠτίον· Οὐκ ἐγώ σε εἶδον ἐν τῷ κήπῳ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/026.yaml
  text: One of the high priest’s slaves[a], being a relative of the man whose ear Peter had cut off, said, “Didn’t I see you in the garden with him?”
translation:
  language: pt
  text: 'Um dos escravos do sumo sacerdote[a], parente do homem cuja orelha Pedro havia cortado, disse: “Não fui eu que vi você no jardim com ele?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos”. A palavra grega pode significar “servos” ou “escravos”, conforme o contexto; aqui, “escravos” preserva a condição de escravidão indicada pelo termo.
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλων
  choice: escravos
  rationale: O termo δοῦλος, neste contexto doméstico e não metafórico, indica pessoas em condição de escravidão ligadas à casa do sumo sacerdote; “escravos” preserva essa realidade social sem suavizá-la.
- source_word: ἀρχιερέως
  choice: sumo sacerdote
  rationale: É a designação portuguesa corrente para o principal ofício sacerdotal no contexto da paixão em João.
- source_word: συγγενὴς ὢν
  choice: parente
  rationale: Identifica naturalmente o falante como familiar do homem ferido; a aposição em português comunica o valor circunstancial do particípio sem rigidez.
- source_word: οὗ
  choice: do homem cuja
  rationale: Explicita em português o referente humano do pronome relativo genitivo e conserva a relação de posse.
- source_word: ἀπέκοψεν
  choice: havia cortado
  rationale: O mais-que-perfeito composto marca de modo natural que o corte da orelha ocorreu antes desta fala.
- source_word: ὠτίον
  choice: orelha
  rationale: Equivalente português direto e idiomático; não há necessidade de reproduzir uma possível forma diminutiva.
- source_word: Οὐκ ἐγώ σε εἶδον
  choice: Não vi você
  rationale: A pergunta com οὐκ espera resposta afirmativa. Esta formulação é natural e amplamente inteligível em português, preservando a afirmação implícita do falante.
- source_word: ἐν τῷ κήπῳ
  choice: no jardim
  rationale: “Jardim” é o equivalente corrente de κῆπος neste cenário da prisão de Jesus.
- source_word: μετ’ αὐτοῦ
  choice: com ele
  rationale: Tradução direta; no contexto, o pronome se refere a Jesus.
theological_decisions:
- issue: Tradução de δοῦλος em contexto doméstico literal
  choice: escravos
  alternative: servos
  rationale: O contexto aponta para integrantes escravizados da casa do sumo sacerdote, não simplesmente auxiliares ou servidores; “escravos” conserva a condição social expressa pelo termo grego.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla inteligibilidade brasileira. A ordem foi ajustada ao idioma receptor, mantendo a identificação familiar do falante e a força de uma pergunta que espera confirmação.
