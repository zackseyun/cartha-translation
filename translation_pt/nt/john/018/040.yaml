  text: ἐκραύγασαν οὖν ⸀πάλιν λέγοντες· Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν. ἦν δὲ ὁ Βαραββᾶς λῃστής.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/040.yaml
  text: So they shouted again[a], saying, “Not this man, but Barabbas!” Now Barabbas was a robber.
translation:
  language: pt
  text: 'Então eles gritaram novamente: “Não este, mas Barrabás!” Ora, Barrabás era um assaltante[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bandido” ou “salteador”; em certos contextos, o termo grego pode designar um insurgente violento.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκραύγασαν
  choice: gritaram
  rationale: Expressa de modo natural e direto o grito forte indicado por κραυγάζω.
- source_word: οὖν
  choice: Então
  rationale: Marca naturalmente a continuação e o resultado do diálogo anterior.
- source_word: πάλιν
  choice: novamente
  rationale: Preserva de maneira clara a ideia de repetição.
- source_word: λέγοντες
  choice: introduzido diretamente pelos dois-pontos
  rationale: Em português, depois de “gritaram”, repetir “dizendo” seria pouco natural; os dois-pontos preservam a função do particípio ao introduzir as palavras gritadas.
- source_word: Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν
  choice: Não este, mas Barrabás
  rationale: Mantém a construção elíptica e a força demonstrativa de τοῦτον.
- source_word: Βαραββᾶν / Βαραββᾶς
  choice: Barrabás
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἦν δὲ
  choice: Barrabás era
  rationale: Apresenta com naturalidade a informação explicativa de fundo introduzida por δέ, sem acrescentar contraste indevido.
- source_word: λῃστής
  choice: assaltante
  rationale: “Assaltante” comunica em português atual o sentido básico de alguém que rouba mediante ataque ou violência, enquanto a nota preserva a possível nuance de banditismo ou insurgência violenta.
theological_decisions:
- issue: Nuance de λῃστής na descrição de Barrabás
  choice: assaltante
  alternative: bandido; salteador; insurgente violento
  rationale: O termo designa primariamente um ladrão ou bandido, muitas vezes com conotação de violência. Em certos contextos do século I, pode também ser usado para alguém ligado à insurgência, mas este versículo isoladamente não exige essa especificação. A tradução principal evita impor essa inferência, e a nota registra a amplitude lexical.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A fala direta conserva a concisão enfática do grego; a nota evita reduzir a amplitude semântica de λῃστής.
