id: JHN.18.17
reference: John 18:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει οὖν ⸂τῷ Πέτρῳ ἡ παιδίσκη ἡ θυρωρός⸃· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν εἶ τοῦ ἀνθρώπου τούτου; λέγει ἐκεῖνος· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/017.yaml
  text: So the servant girl who kept the door said to Peter[a], “You are not also one of this man's disciples, are you?” He said, “I am not.”
translation:
  language: pt
  text: 'Então a jovem serva que cuidava da porta perguntou a Pedro[a]: “Você também não é um dos discípulos desse homem?” Ele respondeu: “Não sou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a jovem escrava que era a porteira”.'
    reason: Alternativa lexical que preserva tanto a possível condição servil mais forte de παιδίσκη quanto a tradução nominal de θυρωρός.
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a progressão narrativa e mantém a conexão com o contexto anterior de modo natural em português.
- source_word: παιδίσκη
  choice: jovem serva
  rationale: Expressa tanto o gênero e a juventude sugeridos pelo termo quanto sua função servil, sem afirmar de modo inequívoco uma condição jurídica específica.
- source_word: θυρωρός
  choice: que cuidava da porta
  rationale: Traduz funcionalmente o papel de quem vigiava ou atendia a entrada, em linguagem corrente e clara.
- source_word: Μὴ καὶ σὺ
  choice: Você também não é
  rationale: A pergunta com μή tende a esperar resposta negativa; esta formulação preserva essa expectativa naturalmente em português.
- source_word: ἐκ τῶν μαθητῶν
  choice: um dos discípulos
  rationale: Construção idiomática que preserva o sentido partitivo de pertencimento ao grupo.
- source_word: τοῦ ἀνθρώπου τούτου
  choice: desse homem
  rationale: Mantém o sentido comum de ἄνθρωπος e o tom de distanciamento de τούτου, sem transformá-lo em título.
- source_word: ἐκεῖνος
  choice: Ele
  rationale: O referente contextual é Pedro; o pronome pessoal é a forma natural em português.
- source_word: Οὐκ εἰμί
  choice: Não sou
  rationale: Preserva a negação breve, direta e elíptica do grego.
theological_decisions:
- issue: Força da pergunta negativa introduzida por μή
  choice: 'Formular como pergunta que sugere resposta negativa: “Você também não é...?”'
  alternative: Usar uma pergunta neutra, como “Você também é...?”
  rationale: A formulação escolhida conserva a orientação pragmática da pergunta grega sem exagerar o tom ou resolver além do texto.
- issue: Nuance da condição social em παιδίσκη
  choice: Usar “jovem serva” no texto principal
  alternative: “jovem escrava”
  rationale: O termo pode designar uma serva ou escrava jovem. Neste contexto, sua função é mais saliente que sua condição jurídica; a alternativa mais explícita é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Você” torna a fala natural; “desse homem” conserva o distanciamento do original. A nota mantém a ambiguidade lexical relativa à condição social da mulher.
