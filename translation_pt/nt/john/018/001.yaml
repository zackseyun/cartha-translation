base_translation:
  language: en
  yaml_path: translation/nt/john/018/001.yaml
  text: After saying these things[a], Jesus went out with his disciples across the Kidron Valley, where there was a garden, into which he and his disciples entered.
translation:
  language: pt
  text: Depois de dizer essas coisas, Jesus saiu com os seus discípulos e atravessou o ribeiro do Cedrom[a]. Ali havia um jardim, no qual entraram ele e os seus discípulos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “atravessou o vale do Cedrom” ou “foi para o outro lado do ribeiro do Cedrom”. O termo grego se refere a um curso de água sazonal, que também pode ser entendido como uma ravina.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: Depois de dizer essas coisas
  rationale: O particípio aoristo é expresso naturalmente como oração temporal e preserva a sequência narrativa.
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Mantém o sentido concreto de movimento e a concisão do verbo grego.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: com os seus discípulos
  rationale: Expressa de modo claro e natural a ideia de acompanhamento.
- source_word: πέραν τοῦ χειμάρρου τοῦ Κεδρών
  choice: atravessou o ribeiro do Cedrom
  rationale: No contexto de movimento, πέραν indica a passagem para o outro lado; χειμάρρου designa um curso de água sazonal, e “ribeiro” é uma forma legível sem ocultar essa particularidade, esclarecida na nota.
- source_word: ὅπου ἦν κῆπος
  choice: Ali havia um jardim
  rationale: Transmite naturalmente a indicação de lugar e a construção existencial, evitando um período excessivamente carregado.
- source_word: εἰς ὃν εἰσῆλθεν αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: no qual ele entrou com os seus discípulos
  rationale: Preserva a entrada no jardim e inclui tanto Jesus quanto os discípulos, com ordem idiomática em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases torna a narrativa natural sem perder nenhuma relação explícita do grego. O nome Κεδρών é vertido pela forma portuguesa tradicional “Cedrom”.
