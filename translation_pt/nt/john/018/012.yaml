id: JHN.18.12
reference: John 18:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἡ οὖν σπεῖρα καὶ ὁ χιλίαρχος καὶ οἱ ὑπηρέται τῶν Ἰουδαίων συνέλαβον τὸν Ἰησοῦν καὶ ἔδησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/john/018/012.yaml
  text: So the cohort[a], the commander, and the officers of the Jews seized Jesus and bound him.
translation:
  language: pt
  text: Então, a coorte, o comandante e os guardas dos judeus[a] prenderam Jesus e o amarraram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos líderes judeus” ou “dos judeanos”, conforme o contexto; João muitas vezes usa “os judeus” em sentido mais específico do que todo o povo judeu.
    reason: Leitura alternativa necessária para preservar a possível abrangência contextual de τῶν Ἰουδαίων e evitar que a expressão seja entendida automaticamente como referência a todo o povo judeu.
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e a consequência da cena anterior de modo natural em português, sem impor uma conclusão lógica forte.
- source_word: σπεῖρα
  choice: coorte
  rationale: Preserva o sentido militar específico do termo. O substantivo grego não explicita por si só que se trata de uma coorte romana.
- source_word: χιλίαρχος
  choice: comandante
  rationale: Designa o oficial que comandava a unidade. “Comandante” é claro e corrente; “tribuno” seria historicamente mais específico, porém menos acessível.
- source_word: ὑπηρέται
  choice: guardas
  rationale: Neste contexto, refere-se a agentes oficiais envolvidos na prisão, não a empregados domésticos. “Guardas” comunica sua função sem acrescentar a especificação interpretativa “guardas do templo”.
- source_word: τῶν Ἰουδαίων
  choice: dos judeus
  rationale: Reproduz de maneira transparente a expressão grega, enquanto a nota esclarece que, no Evangelho de João, ela pode ter um referente mais restrito conforme o contexto.
- source_word: συνέλαβον
  choice: prenderam
  rationale: Expressa de forma natural que Jesus foi capturado e posto sob custódia. Embora “agarraram” realce o ato físico, “prenderam” corresponde melhor à ação completa no contexto.
- source_word: ἔδησαν
  choice: amarraram
  rationale: Verbo português claro e atual para o ato concreto de atar Jesus; evita o possível sentido abstrato de “ligaram”.
theological_decisions:
- issue: Referente e alcance de τῶν Ἰουδαίων no Evangelho de João
  choice: “dos judeus” no texto principal, com nota explicativa
  alternative: “dos líderes judeus” ou “dos judeanos”
  rationale: A redação principal preserva a expressão grega sem identificar automaticamente todo o povo judeu nem resolver de modo definitivo seu referente contextual. A nota mantém abertas as leituras mais restritas reconhecidas pelo uso joanino.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Coorte” mantém a precisão militar; “comandante” e “guardas” evitam tecnicismo excessivo. A colocação do marcador após “judeus” associa corretamente a nota à expressão que ela explica.
