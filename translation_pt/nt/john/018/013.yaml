source:
  edition: SBLGNT
  text: καὶ ⸀ἤγαγον πρὸς Ἅνναν πρῶτον· ἦν γὰρ πενθερὸς τοῦ Καϊάφα, ὃς ἦν ἀρχιερεὺς τοῦ ἐνιαυτοῦ ἐκείνου·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/013.yaml
  text: And they led him first to Annas, for he was the father-in-law of Caiaphas, who was high priest that year.
translation:
  language: pt
  text: E o levaram primeiro a Anás, pois ele era sogro de Caifás, que era o sumo sacerdote naquele ano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: levaram
  rationale: ἄγω pode significar conduzir ou levar. Neste contexto de prisão e transferência sob custódia, “levaram” é natural e preserva o movimento imposto; o objeto “o” é retomado do contexto.
- source_word: πρὸς Ἅνναν
  choice: a Anás
  rationale: πρός com acusativo indica movimento em direção a uma pessoa. “A Anás” expressa diretamente o destino.
- source_word: πρῶτον
  choice: primeiro
  rationale: 'O advérbio marca a ordem dos acontecimentos: Anás foi o primeiro destino.'
- source_word: πενθερός
  choice: sogro
  rationale: O termo designa especificamente o pai da esposa; “sogro” é a equivalência portuguesa precisa e corrente.
- source_word: ἀρχιερεύς
  choice: sumo sacerdote
  rationale: É a designação consagrada e precisa do principal ofício sacerdotal judaico.
- source_word: τοῦ ἐνιαυτοῦ ἐκείνου
  choice: naquele ano
  rationale: A expressão temporal modifica a afirmação de que Caifás exercia o sumo sacerdócio e soa natural em português.
- source_word: Ἅνναν
  choice: Anás
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: Καϊάφα
  choice: Caifás
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Referente de “que era o sumo sacerdote naquele ano”
  choice: A oração relativa refere-se a Caifás.
  alternative: Uma redação mal estruturada poderia fazer a oração parecer referir-se a Anás.
  rationale: No grego, ὃς retoma mais naturalmente o antecedente imediato Καϊάφα. A ordem da frase em português mantém essa referência sem introduzir ambiguidade artificial.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecido. A estrutura acompanha de perto a sequência narrativa do grego sem produzir rigidez desnecessária.
