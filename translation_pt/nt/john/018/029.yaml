  text: ἐξῆλθεν οὖν ὁ Πιλᾶτος ⸀ἔξω πρὸς αὐτοὺς καὶ ⸀φησίν· Τίνα κατηγορίαν φέρετε ⸀κατὰ τοῦ ἀνθρώπου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/029.yaml
  text: So Pilate went outside to them and said, “What accusation do you bring against this man?”
translation:
  language: pt
  text: 'Então Pilatos saiu e foi até eles e disse: “Que acusação vocês apresentam contra este homem?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: saiu
  rationale: O verbo composto e o advérbio expressam juntos o movimento do interior para o exterior. Em português, “saiu” comunica naturalmente o sentido sem a redundância pouco idiomática de “saiu para fora”.
- source_word: οὖν
  choice: Então
  rationale: Marca a progressão narrativa e a consequência da recusa anterior de entrar no pretório; “Então” é natural e mantém a conexão.
- source_word: πρὸς αὐτούς
  choice: para falar com eles
  rationale: πρός indica movimento em direção às pessoas para um encontro. A explicitação “para falar” torna a cena natural em português sem alterar a ação contextual.
- source_word: φησίν
  choice: disse
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma normal na narrativa portuguesa e coerente com “saiu”.
- source_word: Τίνα κατηγορίαν
  choice: Que acusação
  rationale: κατηγορία tem sentido jurídico de acusação ou denúncia formal. “Acusação” reproduz claramente esse valor forense.
- source_word: φέρετε
  choice: vocês apresentam
  rationale: No contexto jurídico, φέρω significa trazer ou apresentar uma acusação. “Apresentam” forma uma combinação corrente em português e preserva o sentido legal.
- source_word: κατὰ τοῦ ἀνθρώπου τούτου
  choice: contra este homem
  rationale: κατά com o genitivo tem sentido judicial de “contra”, e ἄνθρωπος designa aqui um indivíduo masculino específico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O pronome “vocês” explicita o plural já presente em φέρετε. Não há necessidade de nota textual ou teológica neste versículo.
