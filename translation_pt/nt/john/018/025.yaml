  text: Ἦν δὲ Σίμων Πέτρος ἑστὼς καὶ θερμαινόμενος. εἶπον οὖν αὐτῷ· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν αὐτοῦ εἶ; ⸀ἠρνήσατο ἐκεῖνος καὶ εἶπεν· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/025.yaml
  text: Simon Peter was standing and warming himself. So they said to him[a], “You are not also one of his disciples, are you?” He denied it and said, “I am not.”
translation:
  language: pt
  text: 'Simão Pedro estava em pé, aquecendo-se. Então lhe perguntaram[a]: “Você também não é um dos discípulos dele?” Ele negou e disse: “Não sou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Certamente você também não é um dos discípulos dele?” A pergunta grega com μή pressupõe uma resposta negativa.'
    reason: alternativa lexical
lexical_decisions:
- source_word: Ἦν δὲ
  choice: estava
  rationale: δέ é um conectivo narrativo leve. O português não precisa explicitá-lo aqui; a continuidade é natural sem acrescentar contraste ou uma indicação temporal ausente do grego.
- source_word: ἑστὼς
  choice: em pé
  rationale: O particípio perfeito de ἵστημι descreve a postura contínua de Pedro. “Estava em pé” comunica esse sentido de modo natural.
- source_word: θερμαινόμενος
  choice: aquecendo-se
  rationale: O particípio médio/passivo indica que Pedro se aquecia. Não se acrescenta “junto ao fogo”, pois isso vem do contexto, mas não está expresso neste versículo.
- source_word: εἶπον οὖν αὐτῷ
  choice: Então lhe perguntaram
  rationale: οὖν marca a progressão ou consequência narrativa. Como a fala seguinte tem forma interrogativa, “perguntaram” é mais natural em português do que o literal “disseram”, sem alterar o sentido.
- source_word: Μὴ καὶ σὺ ... εἶ;
  choice: Você também não é ...?
  rationale: A pergunta introduzida por μή espera normalmente uma resposta negativa. A formulação portuguesa preserva essa expectativa, e “também” representa καὶ σύ.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: um dos discípulos dele
  rationale: ἐκ com genitivo expressa pertencimento a um grupo. “Um dos discípulos dele” é a equivalência portuguesa natural e mantém clara a referência a Jesus.
- source_word: ἠρνήσατο ἐκεῖνος
  choice: Ele negou
  rationale: O verbo indica negar ou recusar reconhecer a afirmação. Em português, o uso intransitivo é natural neste contexto e evita inserir um objeto não expresso; ἐκεῖνος recebe representação suficiente pelo pronome “ele”.
- source_word: Οὐκ εἰμί
  choice: Não sou
  rationale: Preserva a resposta breve e direta do grego sem acrescentar “não” como interjeição nem completar a elipse com “um deles”.
theological_decisions:
- issue: Natureza da negação de Pedro
  choice: Apresentar a fala como negação direta de ser um dos discípulos de Jesus.
  alternative: Expandir para “Não sou um deles” ou formular uma negação mais ampla de Jesus.
  rationale: O grego é conciso e elíptico, retomando a pergunta. A tradução conserva a força narrativa sem ampliar a negação para além do que o versículo expressa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Você” é usado como forma natural de tratamento no discurso direto; “dele” evita a possível ambiguidade de “seus discípulos”. O marcador [a] aparece no texto principal.
