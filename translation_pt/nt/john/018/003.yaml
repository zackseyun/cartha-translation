  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ οὖν Ἰούδας λαβὼν τὴν σπεῖραν καὶ ἐκ τῶν ἀρχιερέων καὶ ⸂ἐκ τῶν⸃ Φαρισαίων ὑπηρέτας ἔρχεται ἐκεῖ μετὰ φανῶν καὶ λαμπάδων καὶ ὅπλων.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/003.yaml
  text: So Judas[a], having taken the cohort and officers from the chief priests and from the Pharisees[b], comes there with lanterns and torches and weapons.
translation:
  language: pt
  text: Então Judas, tendo recebido a coorte[a] e os guardas[b] dos chefes dos sacerdotes e dos fariseus, chega ali com lanternas, tochas e armas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “destacamento” ou “grupo de soldados”. O termo grego pode designar uma unidade militar sem exigir que toda a coorte estivesse presente.
    reason: lexical_alternative
  - marker: b
    text: Ou “agentes” ou “guardas do templo”. O termo se refere a servidores oficiais das autoridades judaicas.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e a ligação com o contexto anterior de maneira natural em português.
- source_word: λαβὼν
  choice: tendo levado consigo
  rationale: Preserva a ação anterior expressa pelo particípio aoristo e deixa claro que Judas conduzia o grupo com ele.
- source_word: σπεῖραν
  choice: coorte
  rationale: Mantém a especificidade militar do termo grego sem afirmar que todos os integrantes da unidade estavam presentes; a nota oferece equivalentes mais transparentes.
- source_word: ὑπηρέτας
  choice: guardas
  rationale: No contexto joanino, refere-se a agentes oficiais a serviço das autoridades judaicas. “Guardas” é claro e não especifica além do texto a estrutura exata desse corpo.
- source_word: ἀρχιερέων
  choice: chefes dos sacerdotes
  rationale: Expressa o plural que designa as principais autoridades sacerdotais, sem sugerir simplesmente vários ocupantes simultâneos do cargo singular de sumo sacerdote.
- source_word: Φαρισαίων
  choice: fariseus
  rationale: Forma consagrada em português para o nome do grupo.
- source_word: ἔρχεται
  choice: chega
  rationale: Conserva o presente histórico de João e sua vivacidade narrativa; neste contexto, “chega ali” é mais idiomático do que “vem ali”.
- source_word: ἐκεῖ
  choice: ali
  rationale: Retoma de modo natural o lugar já mencionado no contexto.
- source_word: φανῶν
  choice: lanternas
  rationale: Designa luzes portáteis e mantém a distinção lexical em relação às tochas.
- source_word: λαμπάδων
  choice: tochas
  rationale: Equivalente natural para λαμπάδες e distinto de φανῶν.
- source_word: ὅπλων
  choice: armas
  rationale: Traduz de maneira direta o termo geral para instrumentos de combate.
theological_decisions:
- issue: Identidade e composição do grupo que foi prender Jesus
  choice: “a coorte e os guardas dos chefes dos sacerdotes e dos fariseus”
  alternative: “um destacamento de soldados e os agentes das autoridades judaicas”
  rationale: A formulação conserva os dois componentes apresentados no grego — uma unidade militar e agentes ligados aos chefes dos sacerdotes e aos fariseus — sem determinar o número exato de soldados nem identificar de forma mais específica do que o texto a organização dos guardas.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O presente histórico foi preservado em “chega”, e os termos militares ou institucionais potencialmente ambíguos receberam notas sem impor uma identificação ou quantidade além do grego.
