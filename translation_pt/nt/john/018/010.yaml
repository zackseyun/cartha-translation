id: JHN.18.10
reference: John 18:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Σίμων οὖν Πέτρος ἔχων μάχαιραν εἵλκυσεν αὐτὴν καὶ ἔπαισεν τὸν τοῦ ἀρχιερέως δοῦλον καὶ ἀπέκοψεν αὐτοῦ τὸ ⸀ὠτάριον τὸ δεξιόν. ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/010.yaml
  text: Then Simon Peter[a], having a sword, drew it and struck the high priest’s slave and cut off his right ear. Now the slave’s name was Malchus.
translation:
  language: pt
  text: Então Simão Pedro, que tinha uma espada, desembainhou-a, golpeou o escravo[a] do sumo sacerdote e lhe cortou a orelha direita. O nome do escravo era Malco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”. A palavra grega doulos pode significar “escravo” ou “servo”, dependendo do contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a progressão da narrativa e a ligação com a cena anterior, sem dar ao conectivo um tom excessivamente lógico.
- source_word: ἔχων μάχαιραν
  choice: que tinha uma espada
  rationale: Expressa com naturalidade a construção participial. Embora μάχαιρα também possa designar uma espada curta ou adaga, “espada” é o termo amplo e tradicionalmente adequado ao contexto.
- source_word: εἵλκυσεν αὐτὴν
  choice: desembainhou-a
  rationale: No contexto de uma arma, comunica de modo idiomático que Pedro a puxou para fora, provavelmente da bainha.
- source_word: ἔπαισεν
  choice: golpeou
  rationale: Preserva a força da ação em linguagem atual e digna; “bateu” seria menos preciso neste contexto.
- source_word: τὸν τοῦ ἀρχιερέως δοῦλον
  choice: o escravo do sumo sacerdote
  rationale: δοῦλος pode significar escravo ou servo conforme o contexto. A relação expressa com o sumo sacerdote favorece “escravo”, enquanto a alternativa tradicional “servo” é preservada em nota.
- source_word: ἀπέκοψεν
  choice: cortou
  rationale: Com o complemento “a orelha” e o contexto, o verbo comunica claramente a remoção por corte; em português, a construção com o pronome “lhe” é natural.
- source_word: ὠτάριον τὸ δεξιόν
  choice: a orelha direita
  rationale: O diminutivo ὠτάριον pode simplesmente significar “orelha”; não exige “orelhinha” nem especifica apenas o lóbulo. δεξιόν identifica o lado direito.
- source_word: ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος
  choice: O nome do escravo era Malco
  rationale: Reproduz de maneira idiomática a informação identificadora introduzida pela construção grega. “Malco” é a forma portuguesa estabelecida do nome.
theological_decisions:
- issue: Tradução de δοῦλος
  choice: escravo
  alternative: servo
  rationale: O termo grego abrange tanto serviço quanto condição escravizada. Neste contexto, a vinculação do homem ao sumo sacerdote favorece “escravo”, mas a ambiguidade lexical genuína é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Desembainhou-a” mantém concisão narrativa e precisão contextual; a ordem das ações acompanha de perto o grego sem produzir uma frase artificial.
