  text: ἔστιν δὲ συνήθεια ὑμῖν ἵνα ἕνα ⸂ἀπολύσω ὑμῖν⸃ ἐν τῷ πάσχα· βούλεσθε οὖν ⸄ἀπολύσω ὑμῖν⸅ τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/039.yaml
  text: But you have a custom that I release one man for you at the Passover[a]. So do you want me to release to you the King of the Jews?
translation:
  language: pt
  text: Mas há entre vocês o costume de eu lhes soltar alguém por ocasião da Páscoa. Portanto, querem que eu lhes solte o Rei dos Judeus?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Rei dos Judeanos”. O termo grego pode designar judeus ou judeanos, conforme o contexto; aqui ele integra o título fixo usado na narrativa da paixão.
    reason: alternative_reading
lexical_decisions:
- source_word: συνήθεια
  choice: costume
  rationale: Expressa uma prática social estabelecida, adequada ao contexto judicial e festivo, sem o sentido individual de “hábito”.
- source_word: ἵνα ἕνα ἀπολύσω ὑμῖν
  choice: de que eu lhes solte um preso
  rationale: A construção explicita o conteúdo do costume. Embora ἕνα diga literalmente “um”, “um preso” torna natural em português o referente implícito no contexto.
- source_word: ἀπολύω
  choice: soltar
  rationale: No contexto da libertação de um detido, “soltar” é corrente, claro e mantém a mesma tradução nas duas ocorrências.
- source_word: ἐν τῷ πάσχα
  choice: por ocasião da Páscoa
  rationale: Reproduz naturalmente o valor temporal da expressão e indica que a prática estava associada à festa.
- source_word: βούλεσθε οὖν
  choice: Portanto, querem
  rationale: “Portanto” conserva a transição inferencial de οὖν, e “querem” traduz βούλεσθε em linguagem atual e direta.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: o Rei dos Judeus
  rationale: Mantém a formulação reconhecida da acusação e do título na narrativa da paixão. A inicial maiúscula apresenta “Rei” como parte do título aplicado a Jesus.
theological_decisions:
- issue: Sentido de Ἰουδαίων no título τὸν βασιλέα τῶν Ἰουδαίων
  choice: o Rei dos Judeus
  alternative: o Rei dos Judeanos
  rationale: Na narrativa da paixão, a expressão funciona como título régio e como formulação da acusação contra Jesus. “Judeus” preserva o sentido histórico e narrativo tradicional sem restringi-lo apenas à procedência regional; a alternativa lexical legítima é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “vocês” torna explícito o plural de ὑμῖν e βούλεσθε. “Por ocasião da Páscoa” evita possível ambiguidade com a refeição pascal e soa natural em contexto festivo.
