source:
  edition: SBLGNT
  text: Εἰσῆλθεν οὖν ⸂πάλιν εἰς τὸ πραιτώριον⸃ ὁ Πιλᾶτος καὶ ἐφώνησεν τὸν Ἰησοῦν καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/033.yaml
  text: So Pilate went back into the governor’s headquarters and called Jesus and said to him[b][a], “Are you the King of the Jews?”
translation:
  language: pt
  text: 'Então Pilatos voltou a entrar na sede do governador[a], chamou Jesus e lhe disse: “Você é o rei dos judeus[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pretório”, a residência ou sede oficial do governador romano.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “habitantes da Judeia”. O termo grego pode referir-se aos judeus em geral ou, em alguns contextos, aos habitantes da Judeia.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰσῆλθεν ... πάλιν
  choice: voltou a entrar
  rationale: A combinação do verbo de movimento com πάλιν indica reentrada. “Voltou a entrar” expressa isso de forma clara e natural em português.
- source_word: οὖν
  choice: Então
  rationale: Aqui, οὖν faz avançar a narrativa e liga a ação ao contexto anterior. “Então” preserva essa conexão sem sugerir uma conclusão lógica mais forte do que o texto exige.
- source_word: πραιτώριον
  choice: sede do governador
  rationale: O termo designa, neste contexto, a residência ou sede oficial do governador romano. A tradução comunica a função do lugar em linguagem acessível; o termo tradicional é preservado em nota.
- source_word: ἐφώνησεν
  choice: chamou
  rationale: φωνέω pode significar chamar alguém ou mandar chamá-lo. “Chamou” é simples, natural e não acrescenta a força formal que “convocou” poderia sugerir.
- source_word: εἶπεν αὐτῷ
  choice: lhe disse
  rationale: A tradução mantém o sentido básico de λέγω, “dizer”, enquanto a pontuação e a fala citada deixam claro que se trata de uma pergunta.
- source_word: Σὺ εἶ
  choice: Você é
  rationale: A construção interrogativa portuguesa transmite naturalmente a pergunta direta. O pronome expresso corresponde ao σύ explícito no grego, sem recorrer a ênfase tipográfica não presente no texto.
- source_word: ὁ βασιλεὺς
  choice: o rei
  rationale: O artigo definido é preservado, e “rei” expressa diretamente o título político em questão. Usa-se inicial minúscula conforme a ortografia corrente do português, sem diminuir seu valor titular.
- source_word: τῶν Ἰουδαίων
  choice: dos judeus
  rationale: No contexto do interrogatório romano e da acusação política, “rei dos judeus” é a formulação historicamente reconhecível e contextualmente mais provável. A possível nuance geográfica é preservada em nota.
theological_decisions:
- issue: Sentido de Ἰουδαίων no título real
  choice: judeus
  alternative: judeanos
  rationale: A pergunta apresenta a acusação política dirigida a Jesus diante de Pilatos. “Rei dos judeus” corresponde melhor ao título no relato da paixão, mas Ἰουδαῖοι pode ter nuance regional em certos contextos; por isso, a alternativa “judeanos” não é descartada e aparece em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” torna a pergunta direta natural para leitores atuais; a frase evita linguagem excessivamente formal. As notas preservam tanto o termo institucional tradicional quanto a ambiguidade de Ἰουδαίων.
