  text: ἵνα ὁ λόγος τοῦ Ἰησοῦ πληρωθῇ ὃν εἶπεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/032.yaml
  text: so that the word of Jesus would be fulfilled[a], which he had spoken[c][b], indicating by what kind of death he was about to die.
translation:
  language: pt
  text: para que se cumprisse a palavra de Jesus[a], que ele dissera, indicando de que tipo de morte estava para morrer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a declaração de Jesus».'
    reason: lexical_alternative
  - marker: b
    text: Isto é, Jesus havia indicado a maneira pela qual morreria; compare João 12:32–33.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz propósito ou resultado e conserva de modo natural a força da construção grega.
- source_word: ὁ λόγος τοῦ Ἰησοῦ
  choice: a palavra de Jesus
  rationale: Refere-se aqui a uma declaração de Jesus, não ao título «a Palavra» de João 1:1; a nota registra a alternativa idiomática.
- source_word: πληρωθῇ
  choice: se cumprisse
  rationale: Preserva a linguagem joanina de cumprimento e corresponde ao aoristo passivo do subjuntivo após ἵνα.
- source_word: ὃν εἶπεν
  choice: que ele tinha dito
  rationale: Retoma «a palavra» e situa naturalmente a declaração de Jesus antes dos acontecimentos narrados.
- source_word: σημαίνων
  choice: indicando
  rationale: Mantém o particípio circunstancial, sem decidir de modo excessivo entre maneira e propósito.
- source_word: ποίῳ θανάτῳ
  choice: com que tipo de morte
  rationale: Expressa a qualidade ou maneira da morte, e não apenas o fato de morrer; «com» é idiomático em português nesse contexto.
- source_word: ἤμελλεν ἀποθνῄσκειν
  choice: estava prestes a morrer
  rationale: Comunica a perspectiva futura e iminente de μέλλω sem acrescentar uma noção mais forte de predestinação.
theological_decisions:
- issue: A linguagem de cumprimento ligada à declaração anterior de Jesus
  choice: se cumprisse a palavra de Jesus
  alternative: se tornasse realidade aquilo que Jesus tinha dito
  rationale: A opção mantém o peso teológico de πληρόω no Evangelho de João e a autoridade da previsão de Jesus.
- issue: A força de μέλλω em relação à morte de Jesus
  choice: estava prestes a morrer
  alternative: estava destinado a morrer
  rationale: A tradução evita inserir determinismo mais forte do que a expressão grega exige neste versículo.
- issue: Relação de σημαίνων com εἶπεν
  choice: que ele tinha dito, indicando
  alternative: que ele tinha dito para indicar
  rationale: O particípio permite uma relação circunstancial que pode envolver maneira ou propósito; a formulação escolhida preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém-se «palavra» por sua ligação com a fórmula de cumprimento, enquanto a nota esclarece o sentido de declaração. A ordem da frase acompanha o grego sem produzir sintaxe artificial.
