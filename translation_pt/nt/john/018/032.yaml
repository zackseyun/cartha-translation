review_pass:
  verdict: revise
  source_fidelity: 'A estrutura e o sentido geral são fiéis: ἵνα introduz a finalidade/resultado, πληρωθῇ conserva a fórmula de cumprimento, e σημαίνων é adequadamente expresso por «indicando». Contudo, «estava prestes a morrer» reforça indevidamente a iminência temporal de μέλλω neste contexto narrativo; «estava para morrer» ou «ia morrer» reproduz melhor o futuro visto a partir da declaração anterior de Jesus.'
  naturalness: A redação é clara, mas «que ele tinha dito, indicando» fica ligeiramente pesada e ambígua pela repetição de «que» e pelo pronome. «Que ele dissera, indicando» é mais fluente em registro bíblico moderno e mantém a anterioridade.
  terminology: «A palavra de Jesus» é aceitável e preserva o léxico de cumprimento; a nota lexical oferece corretamente «a declaração de Jesus». «Com que tipo de morte» comunica o sentido de ποίῳ θανάτῳ, embora «de que tipo de morte» seja mais idiomático e diretamente ligado à classificação da morte. A nota sobre crucificação deve evitar apresentar como provável algo que o versículo não explicita, embora a remissão a João 12:32–33 seja pertinente.
  issues:
  - severity: medium
    issue: «Estava prestes a morrer» para ἤμελλεν ἀποθνῄσκειν
    rationale: «Prestes a» tende a sugerir iminência imediata em português. μέλλω aqui assinala o futuro da morte em relação à fala anterior de Jesus, sem exigir que ela fosse temporalmente iminente naquele ponto. «Estava para morrer» mantém o valor prospectivo sem essa intensificação.
  - severity: low
    issue: Formulação da nota [b]
    rationale: «Provavelmente em alusão à crucificação» introduz uma qualificação interpretativa desnecessária. João 12:32–33 identifica explicitamente a indicação como relativa ao tipo de morte; a nota pode remeter ao texto sem atribuir probabilidade interpretativa.
