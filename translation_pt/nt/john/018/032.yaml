revisions:
- from: para que se cumprisse a palavra de Jesus[a], que ele tinha dito, indicando com que tipo de morte estava prestes a morrer.[b]
  to: para que se cumprisse a palavra de Jesus[a], que ele dissera, indicando de que tipo de morte estava para morrer.[b]
  rationale: A revisão substitui uma expressão portuguesa que sugere iminência excessiva por «estava para morrer», preservando o valor futuro de μέλλω. Também torna a oração relativa mais fluente com «dissera», usa a formulação mais idiomática «de que tipo de morte» e ajusta a nota para que a referência joanina esclareça o sentido sem acrescentar uma afirmação probabilística.
