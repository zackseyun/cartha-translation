  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ Πιλᾶτος· Μήτι ἐγὼ Ἰουδαῖός εἰμι; τὸ ἔθνος τὸ σὸν καὶ οἱ ἀρχιερεῖς παρέδωκάν σε ἐμοί· τί ἐποίησας;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/035.yaml
  text: Pilate answered[a], “I am not a Jew, am I? Your own nation and the chief priests handed you over to me. What have you done?”
translation:
  language: pt
  text: 'Pilatos respondeu: “Por acaso eu sou judeu[a]? A sua própria nação e os chefes dos sacerdotes entregaram você a mim. O que você fez?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “judeano”. O termo grego pode indicar tanto uma identidade étnica e religiosa (“judeu”) como uma identidade regional (“judeano”), dependendo do contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: Verbo narrativo corrente para introduzir a resposta de Pilatos, natural e fiel ao diálogo.
- source_word: Μήτι
  choice: Por acaso eu sou...?
  rationale: A partícula introduz uma pergunta retórica que espera resposta negativa. Em português, «Por acaso eu sou judeu?» preserva essa força sem recorrer a uma construção artificial.
- source_word: Ἰουδαῖός
  choice: judeu
  rationale: Neste contexto, Pilatos contrasta sua própria identidade com a nação de Jesus e seus acusadores. «Judeu» comunica de modo claro o sentido étnico-religioso e nacional mais provável; «judeano» continua sendo uma possibilidade lexical e é registrado em nota.
- source_word: τὸ ἔθνος τὸ σὸν
  choice: a sua própria nação
  rationale: «Nação» representa ἔθνος, enquanto «própria» explicita a ênfase possessiva de τὸ σὸν e o tom de distanciamento de Pilatos.
- source_word: ἀρχιερεῖς
  choice: chefes dos sacerdotes
  rationale: Designa coletivamente a liderança sacerdotal de Jerusalém. Esta formulação é clara em português moderno e evita sugerir que houvesse simultaneamente vários sumos sacerdotes em exercício.
- source_word: παρέδωκάν σε ἐμοί
  choice: entregaram você a mim
  rationale: Expressa a transferência de Jesus às autoridades romanas e preserva a nuance judicial, sem impor aqui o sentido moralmente mais carregado de «traíram».
- source_word: τί ἐποίησας
  choice: O que você fez?
  rationale: A pergunta direta no passado é idiomática em português e mantém aberta a natureza exata da ação investigada por Pilatos.
theological_decisions:
- issue: Sentido de Ἰουδαῖος no Evangelho de João
  choice: judeu
  alternative: judeano
  rationale: O termo pode indicar identidade étnico-religiosa ou associação regional, conforme o contexto. Aqui, a pergunta retórica de Pilatos seguida de «a sua própria nação» favorece o sentido mais amplo, «judeu», mas a alternativa regional genuína é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. «Você» foi mantido no diálogo direto por sua naturalidade ampla no português brasileiro; a sintaxe permanece clara para leitores de outras variedades. A pergunta retórica conserva a expectativa de resposta negativa presente no grego.
