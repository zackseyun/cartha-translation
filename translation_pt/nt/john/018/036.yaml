id: JHN.18.36
reference: John 18:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐκ τοῦ κόσμου τούτου· εἰ ἐκ τοῦ κόσμου τούτου ἦν ἡ βασιλεία ἡ ἐμή, οἱ ὑπηρέται ⸂οἱ ἐμοὶ ἠγωνίζοντο ἄν⸃, ἵνα μὴ παραδοθῶ τοῖς Ἰουδαίοις· νῦν δὲ ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/036.yaml
  text: Jesus answered[a], “My kingdom is not from this world. If my kingdom were from this world, my servants would be fighting so that I might not be handed over to the Jews. But as it is, my kingdom is not from here.”
translation:
  language: pt
  text: 'Jesus respondeu: “O meu reino não vem deste mundo. Se o meu reino viesse deste mundo, os meus servos estariam lutando para que eu não fosse entregue aos judeus[a]. Mas, de fato, o meu reino não vem daqui.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos judeanos”, talvez se referindo aqui, mais especificamente, às autoridades da Judeia.
    reason: alternative_reading
lexical_decisions:
- source_word: βασιλεία
  choice: reino
  rationale: “Reino” é a tradução natural e consagrada no contexto, podendo abranger tanto o domínio quanto o governo real de Jesus.
- source_word: ἐκ τοῦ κόσμου τούτου
  choice: não vem deste mundo
  rationale: A preposição ἐκ indica origem ou fonte. “Não vem deste mundo” comunica isso com clareza e evita sugerir que o reino de Jesus não esteja presente ou atuante no mundo.
- source_word: κόσμος
  choice: mundo
  rationale: “Mundo” preserva a formulação joanina sem explicitar em excesso a possível nuance da ordem humana presente em oposição a Deus.
- source_word: ὑπηρέται
  choice: servos
  rationale: O termo designa pessoas que servem sob autoridade; “servos” combina naturalmente com o contexto de um reino sem restringir o sentido a oficiais ou guardas.
- source_word: ἠγωνίζοντο ἄν
  choice: estariam lutando
  rationale: O imperfeito com ἄν, numa condição contrária aos fatos, sugere uma ação contínua no cenário hipotético.
- source_word: ἵνα μὴ παραδοθῶ
  choice: para que eu não fosse entregue
  rationale: A formulação expressa propósito e mantém a voz passiva e a nuance judicial de παραδίδωμι em português atual.
- source_word: τοῖς Ἰουδαίοις
  choice: aos judeus
  rationale: O sentido lexical direto é “aos judeus”, embora no contexto joanino possa haver uma referência mais específica aos judeanos ou às autoridades da Judeia; essa possibilidade é preservada em nota.
- source_word: νῦν δὲ
  choice: Mas, de fato
  rationale: Neste contexto, a expressão contrasta a situação real com a hipótese anterior; “de fato” comunica essa função melhor do que o temporal “agora”.
- source_word: ἐντεῦθεν
  choice: não vem daqui
  rationale: A expressão significa literalmente “daqui” ou “deste lugar”. “Não vem daqui” preserva tanto a ideia de origem quanto a mudança para a formulação dêitica conclusiva.
theological_decisions:
- issue: A relação do reino de Jesus com o mundo
  choice: “não vem deste mundo”
  alternative: “não é deste mundo” ou “não faz parte deste mundo”
  rationale: A tradução mantém em primeiro plano a origem e o caráter do reino, sem concluir que ele esteja ausente do mundo ou deva retirar-se de toda realidade terrena.
- issue: O referente de Ἰουδαῖοι em João
  choice: “aos judeus” no texto principal, com alternativa contextual em nota
  alternative: “aos judeanos” ou “às autoridades judaicas”
  rationale: A opção conserva o sentido lexical amplo do grego e, ao mesmo tempo, reconhece em nota que o contexto pode apontar mais especificamente para os judeanos ou suas autoridades.
translation_notes:
  register: Português moderno, digno e de leitura natural, com vocabulário amplamente compreensível no Brasil e em outras comunidades lusófonas. A repetição de “o meu reino” e o paralelismo do original foram preservados.
