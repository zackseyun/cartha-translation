base_translation:
  language: en
  yaml_path: translation/nt/john/018/024.yaml
  text: So Annas sent him bound to Caiaphas the high priest[a].
translation:
  language: pt
  text: Então Anás o enviou amarrado a Caifás, o sumo sacerdote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme o contexto: «Ora, Anás já o havia enviado amarrado a Caifás, o sumo sacerdote», caso o versículo seja entendido como uma observação parentética que explica os acontecimentos anteriores.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: O aoristo ativo de ἀποστέλλω descreve aqui, de modo direto, o ato de enviar; «enviou» é natural e preciso em português.
- source_word: οὖν
  choice: Então
  rationale: Marca a progressão narrativa ou a consequência contextual sem a formalidade excessiva de «portanto».
- source_word: δεδεμένον
  choice: ainda amarrado
  rationale: O particípio perfeito passivo descreve o estado em que Jesus se encontrava ao ser enviado. «Amarrado» é corrente e claro; «ainda» explicita o valor resultante e contínuo do perfeito, sem mudar o acontecimento narrado.
- source_word: πρὸς
  choice: a
  rationale: Com verbo de movimento e nome pessoal no acusativo, indica movimento em direção a Caifás; «a» é a formulação portuguesa mais concisa.
- source_word: ὁ Ἅννας
  choice: Anás
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio grego Ἅννας.
- source_word: Καϊάφαν
  choice: Caifás
  rationale: Forma tradicional e amplamente reconhecida em português para Καϊάφας.
- source_word: τὸν ἀρχιερέα
  choice: o sumo sacerdote
  rationale: Designa o ocupante do principal ofício sacerdotal judaico; «sumo sacerdote» é o equivalente português estabelecido e distingue o cargo dos chefes dos sacerdotes em geral.
theological_decisions:
- issue: Sequência narrativa em relação ao contexto circundante
  choice: 'Traduzir o aoristo como ação passada simples: Anás enviou Jesus a Caifás.'
  alternative: 'Entender o versículo como uma observação parentética retrospectiva: Anás já o havia enviado a Caifás.'
  rationale: A forma grega é um aoristo do indicativo e, em sua leitura mais direta, apresenta um acontecimento na sequência narrativa. Como a relação cronológica com os versículos anteriores é debatida, a tradução principal não impõe uma harmonização; a nota preserva a leitura retrospectiva possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a ordem narrativa mais direta do grego e registra em nota a possibilidade de uma referência retrospectiva.
