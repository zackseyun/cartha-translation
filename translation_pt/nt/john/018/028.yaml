id: JHN.18.28
reference: John 18:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἄγουσιν οὖν τὸν Ἰησοῦν ἀπὸ τοῦ Καϊάφα εἰς τὸ πραιτώριον· ἦν δὲ πρωΐ· καὶ αὐτοὶ οὐκ εἰσῆλθον εἰς τὸ πραιτώριον, ἵνα μὴ μιανθῶσιν ⸀ἀλλὰ φάγωσιν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/028.yaml
  text: So they led Jesus from Caiaphas into the governor’s headquarters[a]. Now it was early morning. They themselves did not enter the headquarters, so that they would not be defiled[c][b], but could eat the Passover.
translation:
  language: pt
  text: Então levaram Jesus de Caifás para a sede do governador[a]. Era de manhã cedo. Eles mesmos não entraram na sede, para não se tornarem ritualmente impuros[b] e assim poderem comer a Páscoa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o pretório”, a residência oficial e sede judicial do governador romano.
    reason: lexical_alternative
  - marker: b
    text: Isto é, impuros em sentido ritual.
    reason: cultural_note
  - marker: c
    text: “Comer a Páscoa” pode referir-se especificamente à refeição pascal ou, de modo mais amplo, às refeições e observâncias realizadas durante a festa da Páscoa.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγουσιν
  choice: levaram
  rationale: O presente histórico grego é expresso naturalmente pelo pretérito perfeito na narrativa portuguesa; “levaram” também comunica o deslocamento de Jesus sob custódia.
- source_word: οὖν
  choice: Então
  rationale: Mantém a ligação e a progressão narrativa de modo corrente e natural em português.
- source_word: πραιτώριον
  choice: sede do governador
  rationale: Traduz a função do pretório como residência oficial e centro administrativo e judicial do governador romano, evitando uma transliteração pouco transparente no texto principal.
- source_word: πρωΐ
  choice: de manhã cedo
  rationale: Indica a primeira parte da manhã sem precisar o horário como se necessariamente fosse ao amanhecer.
- source_word: αὐτοὶ
  choice: eles mesmos
  rationale: Preserva a ênfase do pronome e o contraste entre entregar Jesus no local e não entrar nele.
- source_word: εἰσῆλθον
  choice: não entraram
  rationale: Equivalência direta e idiomática do aoristo narrativo.
- source_word: μιανθῶσιν
  choice: ficarem cerimonialmente impuros
  rationale: Explicita no texto o sentido ritual de μιαίνω neste contexto, evitando que “contaminados” seja entendido apenas em sentido físico ou moral.
- source_word: φάγωσιν τὸ πάσχα
  choice: poderem comer a Páscoa
  rationale: Conserva o idioma da fonte e deixa em aberto se a expressão se refere especificamente à refeição pascal ou, de modo mais amplo, às refeições e observâncias da festa.
- source_word: Καϊάφα
  choice: Caifás
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Emprega a forma tradicional e universalmente reconhecida do nome em português.
theological_decisions:
- issue: Sentido de “comer a Páscoa” em relação à cronologia joanina
  choice: Manter “comer a Páscoa” sem definir no texto principal seu referente exato.
  alternative: “comer a refeição pascal” ou “comer as ofertas/refeições da festa”
  rationale: A expressão grega é clara em sua forma, mas seu alcance preciso é debatido. A tradução preserva a ambiguidade e a tensão cronológica em vez de impor uma harmonização.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão internacional. “Sede do governador” prioriza clareza funcional; as notas preservam o termo histórico e a ambiguidade relevante.
