review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a progressão narrativa, a ênfase em “eles mesmos”, a impureza ritual e a ambiguidade de “comer a Páscoa”. Contudo, “da casa de Caifás” acrescenta “casa”, elemento que não está expresso neste versículo grego, que diz apenas “de Caifás”.
  naturalness: O português é claro e moderno. A construção final fica mais fluente e espelha melhor a relação de propósito com “para não se tornarem ritualmente impuros e assim poderem comer a Páscoa”.
  terminology: “Sede do governador” comunica bem a função de πραιτώριον, e a nota conserva “pretório”. “Ritualmente impuros” é terminologia clara e fiel para μιανθῶσιν. “Comer a Páscoa” preserva corretamente a expressão e sua reconhecida amplitude interpretativa.
  issues:
  - severity: medium
    issue: “da casa de Caifás” introduz “casa”.
    rationale: O texto diz ἀπὸ τοῦ Καϊάφα, literalmente “de Caifás”; embora o contexto anterior envolva a residência de Caifás, o substantivo “casa” não ocorre aqui e não deve ser acrescentado ao texto principal.
  - severity: low
    issue: A relação final de finalidade pode ser expressa com maior naturalidade.
    rationale: “Para não ... mas poderem” é compreensível, mas “para não ... e assim poderem” torna explícita, em português fluente, a finalidade preservada pelo grego.
  revised_text: Então levaram Jesus de Caifás para a sede do governador[a]. Era de manhã cedo. Eles mesmos não entraram na sede, para não se tornarem ritualmente impuros[b] e assim poderem comer a Páscoa[c].
  revised_footnotes:
