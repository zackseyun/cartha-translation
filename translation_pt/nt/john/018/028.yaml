    reason: lexical_alternative
  - marker: b
    text: Isto é, impuros em sentido ritual.
    reason: cultural_note
  - marker: c
    text: “Comer a Páscoa” pode referir-se especificamente à refeição pascal ou, de modo mais amplo, às refeições e observâncias realizadas durante a festa da Páscoa.
    reason: alternative_reading
  revision_rationale: A revisão elimina a adição não expressa de “casa” e ajusta a construção de finalidade para maior fluência, sem alterar o sentido, o registro nem a ambiguidade cronológica de “comer a Páscoa”. As notas mantêm os respectivos marcadores e funções.
