revisions:
- from: Então levaram Jesus da casa de Caifás para a sede do governador[a]. Era de manhã cedo. Eles mesmos não entraram na sede, para não ficarem cerimonialmente impuros[b], mas poderem comer a Páscoa[c].
  to: Então levaram Jesus de Caifás para a sede do governador[a]. Era de manhã cedo. Eles mesmos não entraram na sede, para não se tornarem ritualmente impuros[b] e assim poderem comer a Páscoa[c].
  rationale: A revisão elimina a adição não expressa de “casa” e ajusta a construção de finalidade para maior fluência, sem alterar o sentido, o registro nem a ambiguidade cronológica de “comer a Páscoa”. As notas mantêm os respectivos marcadores e funções.
