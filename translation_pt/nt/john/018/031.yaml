  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸀ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς, καὶ κατὰ τὸν νόμον ὑμῶν κρίνατε αὐτόν. ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Ἡμῖν οὐκ ἔξεστιν ἀποκτεῖναι οὐδένα·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/031.yaml
  text: So Pilate said to them[a], “Take him yourselves and judge him according to your law.” The Jews said to him, “It is not lawful for us to put anyone to death.”
translation:
  language: pt
  text: 'Então Pilatos lhes disse: “Levem-no vocês mesmos e julguem-no segundo a lei de vocês.” Os judeus[a] lhe disseram: “Não nos é permitido tirar a vida de ninguém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, “os judeus” (hoi Ioudaioi). Neste contexto, a expressão se refere às autoridades ou aos acusadores judeus que falavam com Pilatos, não ao povo judeu como um todo.
    reason: Esclarecer o referente contextual e evitar uma generalização antijudaica sem substituir a expressão do texto grego.
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Conector narrativo e inferencial natural em português, preservando a progressão do diálogo.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: Levem-no vocês mesmos
  rationale: O imperativo plural e o pronome explícito ὑμεῖς dão ênfase aos interlocutores; “vocês mesmos” reproduz essa força com naturalidade.
- source_word: κατὰ τὸν νόμον ὑμῶν
  choice: segundo a lei de vocês
  rationale: κατά com acusativo indica conformidade com uma norma; a formulação também preserva o distanciamento expresso por “de vocês”.
- source_word: κρίνατε αὐτόν
  choice: julguem-no
  rationale: Mantém a amplitude jurídica de κρίνω sem restringi-lo necessariamente a um julgamento formal nos moldes romanos.
- source_word: οἱ Ἰουδαῖοι
  choice: Os judeus
  rationale: Reproduz formalmente a expressão grega, enquanto a nota esclarece que o referente contextual é o grupo de autoridades ou acusadores presente diante de Pilatos.
- source_word: Ἡμῖν οὐκ ἔξεστιν
  choice: Não nos é permitido
  rationale: Expressa de modo atual a falta de autorização legal indicada por ἔξεστιν, sem introduzir a ideia mais específica de uma proibição moral.
- source_word: ἀποκτεῖναι οὐδένα
  choice: condenar ninguém à morte
  rationale: No contexto judicial, comunica a execução de uma sentença capital; é idiomático em português e evita sugerir qualquer ato de matar, embora seja um pouco mais contextual que o sentido lexical básico.
theological_decisions:
- issue: Referente de οἱ Ἰουδαῖοι no relato da paixão
  choice: Manter “Os judeus” no texto com nota contextual
  alternative: “As autoridades judaicas” ou “os judeus que o acusavam”
  rationale: A tradução principal preserva a forma abrangente e por vezes ambígua de João; a nota impede que, neste contexto, ela seja entendida como referência ao povo judeu inteiro.
- issue: Natureza da impossibilidade expressa por οὐκ ἔξεστιν
  choice: “Não nos é permitido”
  alternative: “Não é lícito para nós” ou “não temos autorização para”
  rationale: Preserva a tensão entre licitude e permissão sem decidir explicitamente se a restrição provém exclusivamente da administração romana ou de outra consideração legal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Levem-no vocês mesmos” conserva a ênfase do pronome grego; “lei de vocês” soa mais natural internacionalmente do que construções regionais com “vossa”. O marcador [a] aparece imediatamente após a expressão explicada.
