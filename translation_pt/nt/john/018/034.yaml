  text: ⸀ἀπεκρίθη Ἰησοῦς· ⸂Ἀπὸ σεαυτοῦ⸃ σὺ τοῦτο λέγεις ἢ ἄλλοι ⸂εἶπόν σοι⸃ περὶ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/034.yaml
  text: Jesus answered[a], “Are you saying this on your own, or did others tell you about me?”
translation:
  language: pt
  text: 'Jesus respondeu: “Você está dizendo isso por iniciativa própria[a], ou outros lhe falaram a meu respeito?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de si mesmo”; isto é, se isso se originou no próprio Pilatos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: Verbo narrativo padrão para introduzir uma resposta; é natural e preciso no diálogo.
- source_word: Ἀπὸ σεαυτοῦ
  choice: por iniciativa própria
  rationale: 'Expressa de modo natural em português a ideia de origem pessoal: se a afirmação parte do próprio Pilatos. A nota preserva a forma mais literal.'
- source_word: σὺ
  choice: você
  rationale: O pronome grego é explícito e enfático. “Você” mantém essa ênfase com ampla legibilidade brasileira.
- source_word: τοῦτο λέγεις
  choice: está dizendo isso
  rationale: O presente no diálogo é vertido naturalmente pela forma progressiva, e “isso” retoma a pergunta anterior de Pilatos.
- source_word: ἢ ἄλλοι εἶπόν σοι
  choice: ou outros lhe falaram
  rationale: O aoristo é adequadamente expresso pelo pretérito perfeito; “lhe falaram” conserva a referência ao que outras pessoas comunicaram a Pilatos.
- source_word: περὶ ἐμοῦ
  choice: a meu respeito
  rationale: Equivalente claro e digno de περί com genitivo, sem acrescentar interpretação.
theological_decisions:
- issue: Sentido da pergunta de Jesus a Pilatos
  choice: 'Apresentar a pergunta como investigação da origem da afirmação de Pilatos: se parte dele próprio ou do que outros lhe disseram.'
  alternative: Traduzir de modo mais interpretativo como “Você pergunta isso por conta própria...?”
  rationale: O grego usa λέγεις, “diz”, e destaca a origem da fala, sem explicitar motivos nem desenvolver uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Por iniciativa própria” evita a rigidez de uma reprodução literal, enquanto a nota registra a imagem de origem presente no grego.
