  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς οὖν εἶπεν ⸀αὐτοῖς· Ἐγώ εἰμι, ἀπῆλθον εἰς τὰ ὀπίσω καὶ ἔπεσαν χαμαί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/006.yaml
  text: So when he said to them[a], “I am he,” they went backward and fell to the ground.
translation:
  language: pt
  text: 'Assim, quando ele lhes disse: “Sou eu”[a], eles recuaram e caíram por terra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Eu sou”. A expressão grega também pode evocar as declarações distintivas de “Eu sou” no Evangelho de João.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς οὖν
  choice: Assim, quando
  rationale: Preserva tanto a ligação inferencial de οὖν quanto o valor temporal de ὡς em português natural.
- source_word: εἶπεν αὐτοῖς
  choice: ele lhes disse
  rationale: Correspondência direta e idiomática para o verbo de fala com objeto indireto.
- source_word: Ἐγώ εἰμι
  choice: Sou eu
  rationale: No contexto imediato, funciona como identificação pessoal e soa natural em português, sem ocultar a forma grega mais literal, registrada em nota.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: eles recuaram
  rationale: Expressa de modo corrente e preciso o movimento para trás indicado pela locução grega.
- source_word: ἔπεσαν χαμαί
  choice: caíram por terra
  rationale: Reproduz a queda física ao chão com formulação digna, clara e corrente.
theological_decisions:
- issue: Tradução de Ἐγώ εἰμι no contexto joanino, com possível ressonância teológica
  choice: Sou eu
  alternative: Eu sou
  rationale: O diálogo imediato favorece uma identificação pessoal. A tradução mais literal, que pode evocar as declarações distintivas de Jesus em João, é preservada em nota para não eliminar a tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Recuaram” evita rigidez literal, e “caíram por terra” mantém a força concreta da cena.
