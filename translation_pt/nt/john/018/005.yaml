  text: ἀπεκρίθησαν αὐτῷ· Ἰησοῦν τὸν Ναζωραῖον. λέγει ⸀αὐτοῖς· Ἐγώ εἰμι. εἱστήκει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/005.yaml
  text: They answered him, “Jesus the Nazarene.” He said to them, “I am he.” Now Judas, who was betraying him, was also standing with them.
translation:
  language: pt
  text: 'Eles lhe responderam: “Jesus, o Nazareno.” Ele lhes disse: “Sou eu.” Judas, que o estava entregando, também estava de pé com eles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Jesus, o Nazareno
  rationale: Reproduz naturalmente a identificação pelo nome e pela procedência, preservando o título substantivado do grego.
- source_word: Ἐγώ εἰμι
  choice: Sou eu
  rationale: Em resposta à procura por Jesus, esta é a forma idiomática portuguesa de autoidentificação. Mantém a concisão e a possível ressonância joanina sem produzir a formulação artificial “Eu sou” neste contexto.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: que o estava traindo
  rationale: O particípio presente descreve o papel e a ação em curso de Judas; “traindo” comunica aqui com clareza o sentido contextual de entregar Jesus aos adversários.
- source_word: εἱστήκει ... μετ’ αὐτῶν
  choice: estava ali com eles
  rationale: Expressa em português corrente a posição de Judas junto ao grupo; “ali” torna natural o valor contextual de estar presente e de pé.
theological_decisions:
- issue: Possível eco teológico de Ἐγώ εἰμι no Evangelho de João
  choice: Sou eu
  alternative: Eu sou
  rationale: O contexto imediato exige uma resposta de identificação (“Jesus, o Nazareno” — “Sou eu”). A tradução não exclui uma ressonância teológica, mas evita impor ao leitor uma fórmula pouco natural em português ou identificar explicitamente a expressão com o nome divino.
translation_notes:
  register: Português moderno, claro e digno, com pontuação natural para o diálogo. “O Nazareno” é amplamente compreensível, e “Sou eu” preserva tanto a função narrativa quanto a concisão enfática da resposta.
