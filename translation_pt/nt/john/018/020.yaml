id: JHN.18.20
reference: John 18:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Ἐγὼ παρρησίᾳ ⸀λελάληκα τῷ κόσμῳ· ἐγὼ πάντοτε ἐδίδαξα ἐν συναγωγῇ καὶ ἐν τῷ ἱερῷ, ὅπου ⸀πάντες οἱ Ἰουδαῖοι συνέρχονται, καὶ ἐν κρυπτῷ ἐλάλησα οὐδέν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/020.yaml
  text: Jesus answered him[a], “I have spoken openly to the world. I always taught in the synagogue and in the temple, where all the Jews gather[b], and I said nothing in secret.”
translation:
  language: pt
  text: 'Jesus lhe respondeu: “Eu tenho falado abertamente ao mundo. Sempre ensinei na sinagoga e no templo[a], onde todos os judeus[b] se reúnem, e nada falei em segredo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos pátios do templo” ou “no complexo do templo”. O grego ἱερόν se refere ao conjunto do templo, não especificamente ao santuário interior.
    reason: lexical_alternative
  - marker: b
    text: Ou “todo o povo judeu” ou, em alguns contextos de João, “todos os judeanos”. O sentido do grego Ἰουδαῖοι depende do contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: abertamente
  rationale: O contexto estabelece contraste direto com ἐν κρυπτῷ (‘em segredo’); ‘abertamente’ expressa fala pública e não oculta sem acrescentar indevidamente a ideia de ousadia.
- source_word: λελάληκα
  choice: tenho falado
  rationale: O pretérito perfeito composto preserva de modo natural a relevância presente da fala pública anterior de Jesus sugerida pelo perfeito grego.
- source_word: τῷ κόσμῳ
  choice: ao mundo
  rationale: Mantém a dicção joanina de κόσμος e sua amplitude, sem reduzi-la simplesmente a ‘ao público’ ou ‘a todos’.
- source_word: πάντοτε
  choice: sempre
  rationale: Equivalente temporal direto, corrente e natural em português.
- source_word: ἐδίδαξα
  choice: ensinei
  rationale: O pretérito perfeito simples representa adequadamente o aoristo e soa natural no relato.
- source_word: ἐν συναγωγῇ
  choice: na sinagoga
  rationale: Preserva o singular grego, que pode ter sentido genérico como lugar público de ensino.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: É a forma concisa e tradicional; neste contexto, ἱερόν designa o complexo do templo, nuance registrada em nota.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: todos os judeus
  rationale: É a tradução direta e, neste contexto de reunião na sinagoga e no templo, aponta amplamente para o povo judeu; a variação contextual do termo é registrada em nota.
- source_word: συνέρχονται
  choice: se reúnem
  rationale: Expressa com naturalidade a ação coletiva de juntar-se ou congregar-se.
- source_word: ἐν κρυπτῷ
  choice: em segredo
  rationale: Preserva o contraste explícito com ‘abertamente’ e evita confundir segredo com mera conversa privada.
- source_word: ἐλάλησα οὐδέν
  choice: nada falei
  rationale: Construção idiomática em português que conserva a negação enfática e o verbo de fala.
- source_word: ἀπεκρίθη αὐτῷ
  choice: lhe respondeu
  rationale: Forma narrativa concisa e natural que representa tanto o verbo quanto o objeto indireto.
theological_decisions:
- issue: Referente de Ἰουδαῖοι no Evangelho de João
  choice: ‘os judeus’, entendido aqui amplamente como o povo judeu em seu contexto público de reunião
  alternative: ‘o povo judeu’ ou, em certos contextos joaninos, ‘os judeanos’
  rationale: O uso joanino de Ἰουδαῖοι depende do contexto. A menção à sinagoga e ao templo favorece aqui uma referência comunitária ampla, e não uma restrição silenciosa às autoridades; a nota preserva as possibilidades lexicais sem introduzir conotação antijudaica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e o paralelismo da declaração foram preservados sem rigidez; ‘ao mundo’ conserva a linguagem característica de João. Os marcadores foram posicionados junto aos termos efetivamente explicados pelas notas.
