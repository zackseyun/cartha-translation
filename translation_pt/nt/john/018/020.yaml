  source_fidelity: 'O texto traduz com fidelidade os elementos centrais do grego: παρρησίᾳ/ἐν κρυπτῷ é adequadamente expresso por “abertamente/em segredo”; τῷ κόσμῳ permanece “ao mundo”; o perfeito λελάληκα é plausivelmente refletido por “tenho falado”; e a sequência de ensino em sinagoga e templo, seguida da negação enfática, foi preservada. “Todos os judeus” corresponde diretamente a πάντες οἱ Ἰουδαῖοι sem restringir indevidamente o referente.'
  naturalness: O português é claro, moderno e fluente, com registro apropriado para narrativa bíblica. “Jesus lhe respondeu” e “nada falei em segredo” são formulações naturais e dignas. Embora “tenho falado” tenha uma nuance aspectual mais continuativa em português do que o perfeito grego exige estritamente, é uma opção defensável neste contexto e não altera o sentido.
  terminology: “Sinagoga”, “templo”, “mundo”, “judeus” e “em segredo” são termos estáveis, compreensíveis e contextualmente adequados. As notas explicam de forma equilibrada o alcance de ἱερόν e a variação contextual de Ἰουδαῖοι, sem impor uma leitura confessional ou polemicamente restritiva.
