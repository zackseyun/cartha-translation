source:
  edition: SBLGNT
  text: Ἰησοῦς ⸀οὖν εἰδὼς πάντα τὰ ἐρχόμενα ἐπ’ αὐτὸν ⸂ἐξῆλθεν, καὶ λέγει⸃ αὐτοῖς· Τίνα ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/004.yaml
  text: Jesus therefore[a], knowing all the things coming upon him, went out and said to them, “Whom are you seeking?”
translation:
  language: pt
  text: 'Jesus, portanto, sabendo tudo o que estava para lhe acontecer, saiu e lhes perguntou: “Quem vocês estão procurando?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: portanto
  rationale: Marca a continuação lógica e narrativa, preservando a força inferencial sem tornar a frase pouco natural.
- source_word: εἰδὼς
  choice: sabendo
  rationale: O particípio indica que Jesus já tinha plena consciência dos acontecimentos; “sabendo” é natural e fiel ao aspecto circunstancial.
- source_word: πάντα τὰ ἐρχόμενα ἐπ’ αὐτόν
  choice: tudo o que estava para lhe acontecer
  rationale: Preserva a abrangência de πάντα e expressa naturalmente em português a iminência dos acontecimentos que viriam sobre Jesus, sem especificá-los além do grego.
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Equivalente direto e idiomático, sem acrescentar uma dramaticidade ausente do verbo grego.
- source_word: λέγει
  choice: perguntou
  rationale: Embora o grego empregue o presente histórico “diz”, o pretérito é mais natural na narrativa portuguesa; “perguntou” explicita o valor da frase interrogativa sem alterar seu conteúdo.
- source_word: Τίνα ζητεῖτε;
  choice: Quem vocês estão procurando?
  rationale: “Quem” é a forma objetiva normal no português atual, e “estão procurando” transmite com naturalidade o presente de ζητεῖτε e o sentido contextual de buscar uma pessoa.
theological_decisions:
- issue: O conhecimento prévio de Jesus na narrativa
  choice: A tradução afirma que Jesus sabia tudo o que estava para lhe acontecer.
  alternative: Explicitar que se trata de conhecimento prévio exaustivo ou formular uma afirmação doutrinária mais ampla.
  rationale: O texto apresenta Jesus plenamente consciente dos acontecimentos iminentes, mas não exige que a tradução amplie essa afirmação em linguagem de teologia sistemática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O uso de “vocês” evita uma construção excessivamente formal; a ordem da frase conserva a relação entre o conhecimento de Jesus e sua iniciativa de sair ao encontro do grupo.
