  text: Then Peter denied it again[a], and immediately a rooster crowed.
translation:
  language: pt
  text: Então Pedro negou novamente[a], e imediatamente um galo cantou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Então Pedro voltou a negar isso”. O grego não declara explicitamente o objeto da negação, mas o contexto o fornece a partir da pergunta anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: novamente
  rationale: Expressa a repetição da negação de Pedro de forma natural e concisa em português.
- source_word: οὖν
  choice: Então
  rationale: Neste contexto narrativo, liga a resposta de Pedro à pergunta anterior sem enfatizar excessivamente uma conclusão lógica.
- source_word: ἠρνήσατο
  choice: negou
  rationale: Traduz diretamente o verbo no contexto da negação de Pedro; o objeto permanece implícito, como no grego.
- source_word: Πέτρος
  choice: Pedro
  rationale: Forma portuguesa consagrada do nome pessoal.
- source_word: καὶ
  choice: e
  rationale: Mantém a coordenação simples entre a negação e o acontecimento imediatamente posterior.
- source_word: εὐθέως
  choice: imediatamente
  rationale: Preserva a forte proximidade temporal indicada pelo advérbio grego.
- source_word: ἀλέκτωρ
  choice: um galo
  rationale: Equivalente moderno e corrente para o macho da galinha; o artigo indefinido produz uma formulação natural em português.
- source_word: ἐφώνησεν
  choice: cantou
  rationale: Com 'galo' como sujeito, 'cantou' é a expressão idiomática normal em português para o som produzido pelo animal.
