  text: ταῦτα δὲ αὐτοῦ εἰπόντος εἷς ⸂παρεστηκὼς τῶν ὑπηρετῶν⸃ ἔδωκεν ῥάπισμα τῷ Ἰησοῦ εἰπών· Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/022.yaml
  text: And when he had said these things[a], one of the officers standing by struck Jesus, saying[b], “Is this how you answer the high priest?”
translation:
  language: pt
  text: 'Depois que Jesus disse essas coisas, um dos guardas[b] que estava ali deu um golpe[a] em Jesus e disse: “É assim que você responde ao sumo sacerdote?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deu uma bofetada em Jesus”. A expressão grega indica uma pancada com a mão e pode se referir a uma bofetada ou a um golpe semelhante.
    reason: lexical_alternative
  - marker: b
    text: O termo traduzido como “guardas” também pode significar assistentes, servidores ou servos; neste contexto, provavelmente se refere ao pessoal oficial ligado às autoridades sacerdotais.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: essas coisas
  rationale: Preserva o plural do demonstrativo grego e retoma as palavras anteriores de Jesus.
- source_word: δὲ
  choice: Depois que
  rationale: A conexão narrativa é expressa naturalmente pela oração temporal, sem introduzir um contraste mais forte do que o grego exige.
- source_word: αὐτοῦ εἰπόντος
  choice: Depois que Jesus disse
  rationale: A construção absoluta com particípio aoristo indica ação anterior; explicitar Jesus evita ambiguidade pronominal em português.
- source_word: εἷς παρεστηκὼς τῶν ὑπηρετῶν
  choice: um dos guardas que estava ali
  rationale: Representa um integrante do pessoal oficial presente, mantendo em nota a amplitude semântica de ὑπηρέτης. O singular “estava” liga a expressão ao homem que agiu.
- source_word: ἔδωκεν ῥάπισμα
  choice: deu um golpe
  rationale: A expressão denota uma pancada dada com a mão, possivelmente uma bofetada; “golpe” preserva essa abertura sem acrescentar uma modalidade não especificada.
- source_word: εἰπών
  choice: e disse
  rationale: Converte o particípio acompanhante em coordenação natural no português narrativo.
- source_word: Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
  choice: É assim que você responde ao sumo sacerdote?
  rationale: Reproduz de modo corrente a pergunta repreensiva sobre a maneira de Jesus responder e mantém o título convencional de ἀρχιερεύς.
theological_decisions:
- issue: Identificação de ὑπηρετῶν
  choice: guardas, no sentido de pessoal oficial subordinado
  alternative: servidores, assistentes ou servos
  rationale: No contexto do interrogatório ligado ao sumo sacerdote, o termo provavelmente designa pessoal oficial, mas sua amplitude lexical é preservada em nota sem afirmar uma identificação institucional mais específica do que o texto permite.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem narrativa foi naturalizada sem eliminar o plural de ταῦτα nem restringir indevidamente o sentido de ῥάπισμα e ὑπηρέτης.
