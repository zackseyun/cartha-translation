  source_fidelity: A tradução reproduz adequadamente a progressão inferencial de οὐκοῦν (“Logo”), a pergunta sobre a realeza e a resposta deliberadamente concisa de Jesus. Mantém distintas as duas declarações em perfeito grego, γεγέννημαι e ἐλήλυθα, com formas portuguesas naturais (“nasci” / “vim ao mundo”), sem eliminar a distinção textual. “Dar testemunho da verdade”, “da verdade” e “ouve a minha voz” correspondem de perto às expressões joaninas, sem acréscimos interpretativos.
  naturalness: O português é moderno, claro e digno. “Você” é apropriado ao objetivo de legibilidade brasileira e não torna o interrogatório indevidamente coloquial. “Todo aquele que é da verdade” é uma formulação um pouco solene, mas é natural no registro bíblico e preserva bem a linguagem relacional do original.
  terminology: “Rei”, “dar testemunho”, “verdade” e “voz” são escolhas consistentes e adequadas. A nota em [a] assinala de modo útil a ambiguidade pragmática de Σὺ λέγεις ὅτι βασιλεύς εἰμι, sem impor uma leitura confessional ou uma confirmação enfática que o grego não explicita.
