  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτῷ ὁ Πιλᾶτος· Οὐκοῦν βασιλεὺς εἶ σύ; ἀπεκρίθη ⸀ὁ Ἰησοῦς· Σὺ λέγεις ὅτι βασιλεύς ⸀εἰμι. ἐγὼ εἰς τοῦτο γεγέννημαι καὶ εἰς τοῦτο ἐλήλυθα εἰς τὸν κόσμον ἵνα μαρτυρήσω τῇ ἀληθείᾳ· πᾶς ὁ ὢν ἐκ τῆς ἀληθείας ἀκούει μου τῆς φωνῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/037.yaml
  text: 'Then Pilate said to him[a], “So then, are you a king?” Jesus answered, “You say that I am a king. For this I have been born, and for this I have come into the world: that I should bear witness to the truth. Everyone who is of the truth listens to my voice.”'
translation:
  language: pt
  text: 'Então Pilatos lhe perguntou: “Logo, você é rei?” Jesus respondeu: “Você diz que eu sou rei.[a] Para isto nasci e para isto vim ao mundo: para dar testemunho da verdade. Todo aquele que é da verdade ouve a minha voz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você mesmo diz: sou rei”, ou: “Você diz corretamente que eu sou rei”. A formulação grega é concisa e pode ser entendida como uma afirmação qualificada.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκοῦν
  choice: Logo
  rationale: Expressa de modo natural a conclusão que Pilatos tira da conversa anterior, preservando a força inferencial do termo grego.
- source_word: βασιλεὺς
  choice: rei
  rationale: É o equivalente direto e adequado ao interrogatório romano, mantendo tanto a dimensão política quanto as possíveis ressonâncias messiânicas.
- source_word: Σὺ λέγεις ὅτι βασιλεύς εἰμι
  choice: Você diz que eu sou rei
  rationale: Mantém de perto a formulação concisa e ambígua do grego, sem convertê-la em afirmação enfática nem em negação distanciadora.
- source_word: γεγέννημαι
  choice: nasci
  rationale: Em português, o pretérito perfeito é a forma natural de expressar o nascimento como acontecimento consumado com relevância presente; uma reprodução mais mecânica do perfeito grego soaria artificial.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: vim ao mundo
  rationale: Preserva a cláusula distinta sobre a vinda de Jesus ao mundo e soa corrente em português, sem reduzir sua possível importância joanina.
- source_word: μαρτυρήσω τῇ ἀληθείᾳ
  choice: dar testemunho da verdade
  rationale: Conserva a linguagem jurídica e testemunhal característica de João. Em português, “dar testemunho da verdade” é a construção idiomática correspondente.
- source_word: πᾶς ὁ ὢν ἐκ τῆς ἀληθείας
  choice: Todo aquele que é da verdade
  rationale: Preserva a linguagem relacional e de procedência de ἐκ, evitando a interpretação mais explícita “pertence à verdade”.
- source_word: ἀκούει μου τῆς φωνῆς
  choice: ouve a minha voz
  rationale: Traduz diretamente ἀκούει e mantém a ressonância joanina da voz, deixando que o contexto comunique a ideia de resposta ou acolhimento.
theological_decisions:
- issue: Nuance da resposta de Jesus a Pilatos (Σὺ λέγεις ὅτι βασιλεύς εἰμι)
  choice: Você diz que eu sou rei
  alternative: '“Você mesmo diz: sou rei” ou “Você diz corretamente que eu sou rei”'
  rationale: O grego pode ser ouvido como uma afirmação qualificada, mas não explicita uma confirmação enfática nem um afastamento da designação. O texto principal preserva essa tensão, e a nota registra possibilidades legítimas.
- issue: Relação entre “nasci” e “vim ao mundo”
  choice: Manter as duas declarações separadas
  alternative: Fundir ambas em uma única paráfrase sobre a missão de Jesus
  rationale: A formulação joanina distingue o nascimento da vinda ao mundo e pode carregar implicações sobre origem e missão. A tradução conserva ambas sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” no diálogo por naturalidade contemporânea, sem tornar o tom coloquial. Mantém formulações joaninas importantes, como “da verdade” e “a minha voz”.
