  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς τῷ Πέτρῳ· Βάλε τὴν ⸀μάχαιραν εἰς τὴν θήκην· τὸ ποτήριον ὃ δέδωκέν μοι ὁ πατὴρ οὐ μὴ πίω αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/011.yaml
  text: So Jesus said to Peter[a], “Put the sword into its sheath[b]. Shall I not drink the cup that the Father has given me?”
translation:
  language: pt
  text: 'Então Jesus disse a Pedro: “Ponha a espada na bainha.[a] Acaso não beberei o cálice[b] que o Pai me deu?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estojo para espada”.
    reason: lexical_alternative
  - marker: b
    text: O “cálice” é uma metáfora bíblica para o sofrimento ou destino determinado por Deus. Compare com a oração no Getsêmani em Mateus 26:39; Marcos 14:36; Lucas 22:42.
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação e a consequência narrativa de modo natural em português, sem tornar explícita uma inferência mais forte do que o contexto exige.
- source_word: Βάλε
  choice: Ponha
  rationale: Neste contexto, o imperativo de βάλλω significa colocar a arma em seu lugar. “Ponha” expressa uma ordem direta e natural.
- source_word: μάχαιραν
  choice: espada
  rationale: μάχαιρα designa uma arma de lâmina, possivelmente uma espada curta; “espada” é a tradução tradicional, clara e suficientemente ampla neste contexto.
- source_word: θήκην
  choice: bainha
  rationale: “Bainha” é o termo corrente para o estojo em que se guarda a lâmina de uma espada.
- source_word: ποτήριον
  choice: cálice
  rationale: Mantém a metáfora bíblica do destino ou sofrimento atribuído por Deus. “Cálice” é natural no registro bíblico em português e evita substituir a imagem por uma interpretação.
- source_word: δέδωκέν
  choice: deu
  rationale: Embora o grego use o perfeito, o pretérito perfeito simples é a forma idiomática em português para um ato concluído com relevância presente; “tem dado” sugeriria repetição ou continuidade indevida.
- source_word: ὁ πατήρ
  choice: o Pai
  rationale: Preserva o substantivo articulado do grego e o uso joanino, sem acrescentar o possessivo “meu”.
- source_word: οὐ μὴ πίω αὐτό;
  choice: Acaso não beberei o cálice...?
  rationale: A pergunta retórica espera resposta afirmativa e comunica a determinação de Jesus. “Acaso não beberei” conserva essa força sem transformar a pergunta em declaração.
theological_decisions:
- issue: Sentido de “o cálice”
  choice: Manter “cálice” como metáfora, sem defini-la no texto principal.
  alternative: Explicitar como “o sofrimento”, “o destino” ou “o cálice da ira divina”.
  rationale: O contexto aponta para o sofrimento e a missão dados pelo Pai, mas o versículo não limita a metáfora a uma única formulação doutrinária. Preservá-la mantém a amplitude e a tensão teológica do texto.
- issue: Relação de Jesus com o Pai
  choice: Traduzir de modo direto a disposição de Jesus de receber o cálice dado pelo Pai.
  alternative: Acrescentar explicações como “a missão que meu Pai me confiou”.
  rationale: A formulação direta preserva a obediência voluntária de Jesus sem acrescentar possessivos nem explicações ausentes do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ponha” evita regionalismo excessivo; “bainha” e “cálice” preservam as imagens concretas e bíblicas. Os marcadores foram associados aos elementos a que suas notas efetivamente se referem.
