source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Εἰ κακῶς ἐλάλησα, μαρτύρησον περὶ τοῦ κακοῦ· εἰ δὲ καλῶς, τί με δέρεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/023.yaml
  text: Jesus answered him[a], “If I spoke wrongly, testify about the wrong; but if rightly[b], why do you strike me?”
translation:
  language: pt
  text: 'Jesus lhe respondeu: “Se falei mal, dê testemunho sobre o mal[a]; mas, se falei bem, por que me bate[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dê testemunho a respeito do mal” ou “testemunhe sobre o que houve de errado”.
    reason: lexical_alternative
  - marker: b
    text: Ou “por que me golpeia?”. O verbo grego pode referir-se de modo amplo a bater ou golpear e, em outros contextos, a espancar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: lhe respondeu
  rationale: Forma narrativa natural em português, preservando tanto o verbo de resposta quanto o pronome dativo que retoma o interlocutor.
- source_word: κακῶς ἐλάλησα
  choice: falei de modo errado
  rationale: Expressa o sentido adverbial de κακῶς no contexto de uma contestação de natureza judicial, sem restringi-lo indevidamente a erro factual ou maldade moral.
- source_word: μαρτύρησον
  choice: dê testemunho
  rationale: Mantém de maneira clara o campo jurídico de prestar testemunho e soa mais natural neste contexto do que o verbo isolado “testemunhar”.
- source_word: περὶ τοῦ κακοῦ
  choice: do erro
  rationale: Conserva a forma substantivada da expressão e aponta para o alegado elemento errado na fala de Jesus; uma nota registra a alternativa mais literal e semanticamente mais ampla.
- source_word: καλῶς
  choice: corretamente
  rationale: Preserva o contraste com “de modo errado” e evita que “bem” seja entendido apenas como referência à qualidade estilística da fala.
- source_word: τί με δέρεις
  choice: por que me bate
  rationale: τί tem aqui valor idiomático de “por que”, e δέρεις designa de modo amplo o ato de golpear; “bate” é corrente, claro e adequado ao golpe narrado no contexto imediato.
theological_decisions:
- issue: Caráter da resposta de Jesus diante da violência
  choice: Apresentar a fala como uma contestação jurídico-moral baseada na necessidade de testemunho
  alternative: Intensificar a denúncia da injustiça ou suavizar o tom forense
  rationale: O texto exige prova do suposto erro e questiona o golpe, mas não acrescenta uma explicação doutrinária sobre resistência, violência ou procedimento legal.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A construção evita pronome de tratamento regionalmente marcado e preserva o contraste argumentativo entre falar de modo errado e falar corretamente.
