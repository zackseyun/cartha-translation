id: JHN.18.9
reference: John 18:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα πληρωθῇ ὁ λόγος ὃν εἶπεν ὅτι Οὓς δέδωκάς μοι οὐκ ἀπώλεσα ἐξ αὐτῶν οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/009.yaml
  text: 'so that the word that he had spoken might be fulfilled: “Of those whom you have given me[a], I lost not one.”'
translation:
  language: pt
  text: 'para que se cumprisse a palavra que ele tinha dito: “Dos que me deste, não perdi nenhum[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nenhum deles” ou “nem um sequer dentre eles”.'
    reason: Alternativas que explicitam a construção partitiva e a ênfase do grego.
lexical_decisions:
- source_word: ἵνα πληρωθῇ
  choice: para que se cumprisse
  rationale: Preserva a construção de finalidade/resultado com o subjuntivo e mantém a linguagem joanina de cumprimento.
- source_word: ὁ λόγος ὃν εἶπεν
  choice: a palavra que ele tinha dito
  rationale: Aqui λόγος designa uma declaração anterior de Jesus, não o título teológico “a Palavra”. O mais-que-perfeito composto deixa clara a anterioridade da fala em relação à cena.
- source_word: Οὓς δέδωκάς μοι
  choice: Dos que me deste
  rationale: A formulação antecipa naturalmente a relação partitiva expressa por ἐξ αὐτῶν. O pretérito “deste” é idiomático em português e corresponde ao ato de confiar essas pessoas a Jesus.
- source_word: οὐκ ἀπώλεσα
  choice: não perdi
  rationale: No contexto, o verbo se refere a não deixar que nenhum dos discípulos confiados a Jesus se perdesse. “Não perdi” preserva a formulação joanina e sua tensão teológica sem explicá-la em excesso.
- source_word: ἐξ αὐτῶν οὐδένα
  choice: nenhum
  rationale: Transmite de modo conciso e enfático que nem sequer uma pessoa dentre o grupo foi perdida; a noção partitiva já aparece em “Dos que”.
theological_decisions:
- issue: Natureza do cumprimento
  choice: Apresentar a fala anterior de Jesus como uma palavra que se cumpre
  alternative: Traduzir de modo mais livre como “para que se tornasse realidade”
  rationale: João aplica a linguagem de cumprimento também às palavras de Jesus. “Para que se cumprisse” mantém o peso narrativo e teológico sem classificar explicitamente a fala como profecia formal.
- issue: Sentido de ἀπώλεσα a respeito dos discípulos
  choice: “não perdi”
  alternative: “não deixei que nenhum se perdesse”
  rationale: A tradução conserva o vocabulário característico de João e abrange tanto a proteção imediata dos discípulos na prisão quanto a ressonância da preservação mencionada anteriormente, sem impor uma sistematização doutrinária.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com fluidez brasileira. A ordem “Dos que me deste” conserva a estrutura enfática do original sem soar excessivamente literal.
