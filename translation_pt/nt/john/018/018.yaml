id: JHN.18.18
reference: John 18:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἱστήκεισαν δὲ οἱ δοῦλοι καὶ οἱ ὑπηρέται ἀνθρακιὰν πεποιηκότες, ὅτι ψῦχος ἦν, καὶ ἐθερμαίνοντο· ἦν δὲ ⸂καὶ ὁ Πέτρος μετ’ αὐτῶν⸃ ἑστὼς καὶ θερμαινόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/018.yaml
  text: The slaves and the officers were standing there[a], having made a charcoal fire because it was cold, and they were warming themselves[b]. Peter also was standing with them and warming himself.
translation:
  language: pt
  text: Os escravos[a] e os guardas[b] estavam ali em pé. Como estava frio, tinham feito uma fogueira de carvão e se aqueciam. Pedro também estava em pé com eles, aquecendo-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «servos»; o termo grego pode ter ambos os sentidos, mas «escravos» preserva aqui a provável condição de sujeição dessas pessoas.
    reason: lexical_alternative
  - marker: b
    text: Ou «agentes»; eram auxiliares oficiais, provavelmente ligados ao templo ou à casa do sumo sacerdote.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: escravos
  rationale: Preserva o sentido social básico de pessoas em condição de escravidão, sem suavizá-lo para o termo mais amplo «servos»; a alternativa consta em nota.
- source_word: ὑπηρέται
  choice: guardas
  rationale: No contexto joanino, designa auxiliares oficiais ligados às autoridades e com funções de vigilância ou coerção. «Guardas» é claro em português, embora «agentes» também seja possível.
- source_word: ἀνθρακιὰν
  choice: uma fogueira de carvão
  rationale: Conserva o detalhe concreto de um fogo alimentado por carvão, importante também para a narrativa de João.
- source_word: πεποιηκότες
  choice: tinham feito
  rationale: 'Expressa uma ação já concluída cujo resultado permanecia presente: a fogueira estava acesa.'
- source_word: ὅτι ψῦχος ἦν
  choice: Como estava frio
  rationale: Mantém a relação causal e soa natural em português, sem sugerir contraste.
- source_word: ἐθερμαίνοντο
  choice: se aqueciam
  rationale: Reproduz a ação contínua e reflexiva indicada pela forma verbal.
- source_word: ἦν δὲ καὶ ὁ Πέτρος μετ’ αὐτῶν
  choice: Pedro também estava em pé com eles
  rationale: «Também» preserva o valor aditivo de καί, e «com eles» mantém explícita a associação de Pedro ao grupo.
- source_word: ἑστὼς
  choice: estava em pé
  rationale: Representa o estado ou a postura de Pedro na construção perifrástica com ἦν.
- source_word: θερμαινόμενος
  choice: aquecendo-se
  rationale: Mantém o paralelismo com a ação contínua dos demais e traduz diretamente o particípio reflexivo.
- source_word: δέ
  choice: sem conectivo explícito
  rationale: O conectivo é leve e pode ser naturalmente absorvido pela sequência narrativa em português, evitando introduzir um contraste ou marcador temporal inexistente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A divisão em três períodos evita uma frase excessivamente longa, preserva a progressão narrativa e mantém a repetição deliberada das ideias de estar em pé e aquecer-se.
