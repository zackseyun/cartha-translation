id: JHN.18.2
reference: John 18:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ᾔδει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν τὸν τόπον, ὅτι πολλάκις ⸀συνήχθη Ἰησοῦς ἐκεῖ μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/002.yaml
  text: Judas, who was betraying him, also knew the place, because Jesus had often gathered there with his disciples.
translation:
  language: pt
  text: Judas, que o estava traindo[a], também conhecia o lugar, porque Jesus muitas vezes se reunia[b] ali com os seus discípulos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que o estava entregando”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “se encontrava”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: conhecia
  rationale: O verbo οἶδα expressa conhecimento; o imperfeito português comunica de modo natural a familiaridade contínua de Judas com o lugar.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: A partícula marca uma leve progressão narrativa, que o português comunica naturalmente pela continuidade do relato, sem exigir um conectivo explícito.
- source_word: καὶ
  choice: também
  rationale: Preserva o valor aditivo, indicando que Judas igualmente conhecia o lugar.
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: que o estava traindo
  rationale: Mantém a força verbal do particípio presente e comunica o sentido contextual de παραδίδωμι na atuação de Judas, sem reduzi-lo a um mero título.
- source_word: τὸν τόπον
  choice: o lugar
  rationale: Equivalente direto, claro e natural de τόπος neste contexto.
- source_word: ὅτι
  choice: porque
  rationale: Introduz naturalmente a razão pela qual Judas conhecia o lugar.
- source_word: πολλάκις
  choice: muitas vezes
  rationale: Expressa com clareza a repetição indicada pelo advérbio grego.
- source_word: συνήχθη
  choice: se reunia
  rationale: A forma passiva pode ter sentido intransitivo neste contexto. O imperfeito português apresenta de modo idiomático a ação habitual anterior e preserva a ideia lexical de reunião.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: com os seus discípulos
  rationale: Preserva a associação expressa por μετά e a relação de mestre e discípulos indicada por μαθηταί.
theological_decisions:
- issue: Sentido de παραδιδοὺς aplicado a Judas
  choice: traindo
  alternative: entregando
  rationale: No relato da paixão, o contexto dá ao verbo a força moral e narrativa de traição. A alternativa mais literal é mantida em nota para preservar a amplitude lexical.
- issue: Sentido de συνήχθη
  choice: se reunia
  alternative: se encontrava
  rationale: A tradução escolhida conserva a imagem de reunir-se e trata o passivo grego em sentido intransitivo idiomático, sem acrescentar uma nuance teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Se reunia” e “conhecia” mantêm o pano de fundo habitual do relato sem recorrer a construções artificiais; o pronome “o” conserva a referência a Jesus de forma concisa.
