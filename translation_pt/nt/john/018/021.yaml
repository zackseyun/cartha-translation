base_translation:
  language: en
  yaml_path: translation/nt/john/018/021.yaml
  text: Why do you question me? Question those who have heard what I said to them. Look[a], they know what I said.
translation:
  language: pt
  text: Por que me interroga?[a] Interrogue os que ouviram o que lhes falei. Veja, estes sabem o que eu disse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por que me pergunta? Pergunte aos que ouviram o que lhes falei.” O verbo grego também pode ser traduzido de modo mais neutro por “perguntar”, mas “interrogar” reflete melhor o contexto desta audiência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί με ἐρωτᾷς
  choice: Por que você me interroga?
  rationale: A construção com τί introduz uma contestação direta. “Interroga” preserva o sentido de perguntar e, no contexto da audiência diante do sumo sacerdote, comunica adequadamente o caráter oficial do questionamento.
- source_word: ἐρώτησον
  choice: Interrogue
  rationale: O imperativo aoristo exige uma ação direta. A repetição de “interrogar” mantém o paralelo deliberado com o verbo anterior e o tom forense, sem chegar ao sentido mais forte de “examinar”.
- source_word: τοὺς ἀκηκοότας
  choice: os que ouviram
  rationale: O particípio perfeito identifica aqueles que ouviram Jesus e continuam qualificados como testemunhas do que foi dito. Em português, “os que ouviram” expressa isso de modo natural, sem acrescentar um objeto ausente do grego.
- source_word: τί ἐλάλησα αὐτοῖς
  choice: o que lhes falei
  rationale: λαλέω tem aqui o sentido comum de falar ou dizer. “O que lhes falei” é natural, preserva o pronome dativo αὐτοῖς e não acrescenta a ideia mais específica de instrução.
- source_word: ἴδε
  choice: Veja
  rationale: O imperativo funciona como expressão para chamar a atenção. “Veja” é atual e digno; “eis” seria possível, mas teria registro mais elevado.
- source_word: οὗτοι οἴδασιν
  choice: eles sabem
  rationale: Embora οὗτοι seja demonstrativo, em português o referente imediato — “os que ouviram” — torna “eles” mais natural e ainda aponta claramente para esse grupo. “Estes sabem” soaria rígido no português corrente.
- source_word: ἃ εἶπον ἐγώ
  choice: o que eu disse
  rationale: A formulação traduz naturalmente a oração de conteúdo. O pronome expresso “eu” conserva a ênfase de ἐγώ sem recorrer ao pouco natural “eu mesmo”.
theological_decisions:
- issue: Tom forense da resposta de Jesus diante do sumo sacerdote
  choice: Empregar “interrogar” nas duas ocorrências de ἐρωτάω.
  alternative: Empregar o termo mais neutro “perguntar” nas duas ocorrências.
  rationale: O contexto é uma audiência oficial, e “interrogar” comunica essa dimensão judicial sem transformar a fala em terminologia jurídica mais específica do que o grego exige. A nota preserva a alternativa lexical neutra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O uso de “você” evita ambiguidade na pergunta direta; “lhes falei” preserva o dativo de forma concisa. “Veja” mantém a força de chamada de atenção de ἴδε, e “eles” retoma naturalmente os ouvintes já mencionados.
