source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Εἶπον ὑμῖν ὅτι ἐγώ εἰμι· εἰ οὖν ἐμὲ ζητεῖτε, ἄφετε τούτους ὑπάγειν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/008.yaml
  text: Jesus answered[a], “I told you that I am he. So if you are seeking me, let these men go.”
translation:
  language: pt
  text: 'Jesus respondeu: “Eu já disse a vocês: ‘Sou eu’[a]. Portanto, se é a mim que vocês procuram, deixem estes homens ir.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “Eu sou”. O grego não traz outro predicativo; a expressão identifica Jesus como aquele que eles procuram e também pode conservar a ressonância do “Eu sou” no Evangelho de João.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: Forma narrativa corrente e digna para introduzir a resposta de Jesus no diálogo.
- source_word: Εἶπον ὑμῖν
  choice: Eu já disse a vocês
  rationale: O aoristo remete ao que Jesus acabara de declarar; “já disse a vocês” expressa naturalmente em português essa retomada, sem alterar o conteúdo.
- source_word: ἐγώ εἰμι
  choice: Sou eu
  rationale: Em contexto de identificação, “Sou eu” é a formulação portuguesa mais natural. A forma mais literal “Eu sou”, que pode conservar uma ressonância teológica própria de João, é registrada em nota.
- source_word: εἰ οὖν ἐμὲ ζητεῖτε
  choice: Portanto, se é a mim que vocês procuram
  rationale: A construção enfática “é a mim que” representa a posição enfática de ἐμέ, enquanto “procuram” comunica o presente no contexto imediato.
- source_word: ἄφετε τούτους ὑπάγειν
  choice: deixem estes homens ir
  rationale: “Deixem ... ir” reproduz de modo direto a ideia de permitir a partida; “estes homens” explicita o referente masculino plural indicado pelo contexto, sem sugerir que já estivessem formalmente presos.
theological_decisions:
- issue: Tradução de ἐγώ εἰμι no contexto joanino
  choice: Sou eu
  alternative: Eu sou
  rationale: A cena exige uma resposta de identificação, para a qual “Sou eu” é clara e idiomática em português. Contudo, a redação grega também admite a forma absoluta “Eu sou”, potencialmente significativa em João; a nota preserva essa tensão sem impô-la ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para legibilidade brasileira ampla. A ordem enfática “é a mim que vocês procuram” procura refletir a ênfase do grego em ἐμέ. A citação interna em torno de “Sou eu” deixa claro que Jesus retoma sua declaração anterior.
