base_translation:
  language: en
  yaml_path: translation/nt/john/007/016.yaml
  text: So Jesus answered them[a], “My teaching is not mine, but his who sent me.”
translation:
  language: pt
  text: 'Então Jesus lhes respondeu: “O meu ensino não é meu, mas daquele que me enviou.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: Então Jesus lhes respondeu
  rationale: “Então” preserva a continuidade discursiva de οὖν. A fórmula dupla “respondeu e disse” é condensada de modo natural em português, sem perda da função introdutória da fala.
- source_word: Ἡ ἐμὴ διδαχή
  choice: O meu ensino
  rationale: “Ensino” é corrente, claro e menos técnico ou eclesiástico que “doutrina”; o possessivo mantém a ênfase de ἐμὴ.
- source_word: οὐκ ἔστιν ἐμὴ
  choice: não é meu
  rationale: Reproduz de forma concisa e direta o contraste de posse ou origem expresso no grego.
- source_word: ἀλλὰ τοῦ πέμψαντός με
  choice: mas daquele que me enviou
  rationale: O genitivo elíptico retoma “ensino” e pode indicar pertença e origem. “Daquele que me enviou” mantém a concisão e a ambiguidade genuína sem acrescentar um verbo explicativo.
- source_word: πέμψαντός
  choice: enviou
  rationale: É o equivalente comum e não acrescenta a nuance mais específica de “comissionou”.
theological_decisions:
- issue: Relação entre o ensino de Jesus e aquele que o enviou
  choice: 'Preservar o contraste: o ensino não é independentemente de Jesus, mas daquele que o enviou.'
  alternative: Explicitar que o ensino “vem do Pai” ou interpretar a frase como negação da autoridade ou divindade de Jesus.
  rationale: O texto identifica o ensino com aquele que enviou Jesus por meio de um genitivo elíptico, sem desenvolver aqui as implicações metafísicas. A tradução conserva a distinção e a unidade de missão sem resolver além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “O meu ensino” soa natural e conserva a ênfase possessiva; “daquele” mantém o referente pessoal sem inserir “Pai”, que não aparece explicitamente neste versículo.
