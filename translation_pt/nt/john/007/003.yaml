id: JHN.7.3
reference: John 7:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτὸν οἱ ἀδελφοὶ αὐτοῦ· Μετάβηθι ἐντεῦθεν καὶ ὕπαγε εἰς τὴν Ἰουδαίαν, ἵνα καὶ οἱ μαθηταί σου ⸀θεωρήσουσιν ⸂σοῦ τὰ ἔργα⸃ ἃ ποιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/003.yaml
  text: So his brothers said to him[a], “Leave here and go to Judea, so that your disciples also may see the works you are doing.”
translation:
  language: pt
  text: 'Então os irmãos de Jesus lhe disseram: “Saia daqui e vá para a Judeia, para que também os seus discípulos vejam[a] as obras que você está realizando.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “observem”; literalmente, “verão”. O verbo grego pode indicar ver com atenção, e aqui aparece no futuro dentro de uma oração que expressa finalidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Conector discursivo natural em português, preservando a progressão narrativa e a leve força consequencial do grego.
- source_word: ἀδελφοὶ αὐτοῦ
  choice: os irmãos de Jesus
  rationale: O masculino plural, neste contexto, designa os familiares homens de Jesus. A explicitação do referente evita a possível ambiguidade de “seus irmãos” em português.
- source_word: Μετάβηθι ἐντεῦθεν
  choice: Saia daqui
  rationale: Expressa de modo direto e atual a ordem de deixar o lugar presente.
- source_word: ὕπαγε εἰς τὴν Ἰουδαίαν
  choice: vá para a Judeia
  rationale: Tradução natural da ordem de movimento e do nome geográfico.
- source_word: ἵνα καὶ οἱ μαθηταί σου
  choice: para que também os seus discípulos
  rationale: Preserva a finalidade introduzida por ἵνα e a inclusão assinalada por καί, sem decidir se “também” enfatiza os discípulos ou o ato de ver além do contexto imediato.
- source_word: θεωρήσουσιν
  choice: vejam
  rationale: Embora a forma grega seja futuro do indicativo, ela ocorre em oração de finalidade com ἵνα. O presente do subjuntivo é a construção portuguesa natural e mantém o sentido de ver ou observar atentamente.
- source_word: σοῦ τὰ ἔργα ἃ ποιεῖς
  choice: as obras que você está realizando
  rationale: Mantém “obras”, termo tematicamente importante em João, e traduz o presente ποιεῖς como ação em curso. “Realizando” evita a repetição menos natural “obras que faz”.
theological_decisions:
- issue: Referência de ἀδελφοὶ αὐτοῦ
  choice: irmãos de Jesus
  alternative: parentes ou familiares de Jesus em sentido mais amplo
  rationale: O texto usa o termo familiar masculino direto e o contexto de João 7:3–5 os apresenta como um grupo definido. A tradução não acrescenta conclusões sobre questões posteriores relativas ao parentesco.
- issue: Força de θεωρήσουσιν na oração com ἵνα
  choice: vejam
  alternative: verão / observem
  rationale: “Vejam” comunica naturalmente a finalidade em português; a nota preserva tanto a forma futura do grego quanto a possível nuance de observação atenta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” por naturalidade contemporânea e “obras” para conservar a linguagem temática do Evangelho de João.
