id: JHN.7.38
reference: John 7:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς ἐμέ, καθὼς εἶπεν ἡ γραφή, ποταμοὶ ἐκ τῆς κοιλίας αὐτοῦ ῥεύσουσιν ὕδατος ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/038.yaml
  text: The one who believes in me[a], just as the Scripture has said[b], rivers of living water will flow from his belly.
translation:
  language: pt
  text: Quem crê em mim, como disse a Escritura, do seu ventre[a] fluirão rios de água viva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, “do seu íntimo”. O grego diz literalmente “ventre” e provavelmente emprega a palavra como imagem do interior da pessoa. Alguns entendem que “seu” se refere ao Messias, e não a quem crê.
    reason: lexical_alternative_and_referent_ambiguity
lexical_decisions:
- source_word: ὁ πιστεύων
  choice: Quem crê
  rationale: O particípio presente substantivado descreve genericamente a pessoa caracterizada pela fé; esta formulação é natural em português e mantém o sentido aberto a qualquer pessoa.
- source_word: εἰς ἐμέ
  choice: em mim
  rationale: Com πιστεύω, εἰς indica confiança dirigida a uma pessoa; “crer em mim” é a expressão idiomática correspondente.
- source_word: καθὼς εἶπεν ἡ γραφή
  choice: como disse a Escritura
  rationale: Mantém o aoristo com passado simples, a forma singular e definida de ἡ γραφή e a função de introduzir autoridade escriturística.
- source_word: ποταμοὶ
  choice: rios
  rationale: Preserva a imagem de grande volume e abundância, sem reduzi-la a riachos ou correntes.
- source_word: ἐκ τῆς κοιλίας αὐτοῦ
  choice: do seu ventre
  rationale: “Ventre” conserva de modo digno e compreensível a imagem concreta de κοιλία, que aqui representa o interior da pessoa, sem substituir a metáfora por uma explicação.
- source_word: ῥεύσουσιν
  choice: fluirão
  rationale: Corresponde diretamente ao futuro ativo e não acrescenta a intensidade de “jorrarão”.
- source_word: ὕδατος ζῶντος
  choice: água viva
  rationale: Preserva a expressão joanina tradicional, sua metáfora e sua ressonância teológica, inclusive a possível ideia de água corrente e vivificante.
theological_decisions:
- issue: Referente de αὐτοῦ em ἐκ τῆς κοιλίας αὐτοῦ
  choice: O pronome se refere, no texto principal, a quem crê.
  alternative: O pronome pode ser entendido como referente ao Messias/Jesus, de modo que os rios fluem dele.
  rationale: O antecedente gramatical mais próximo é “quem crê”, e João 7:39 relaciona a declaração ao Espírito que os crentes receberiam. Como a construção também tem sido entendida de modo messiânico, a alternativa é preservada na nota.
- issue: Sentido contextual de κοιλία
  choice: ventre, como imagem do interior da pessoa
  alternative: íntimo; interior; ser interior
  rationale: A tradução mantém a metáfora corporal genuína do grego, enquanto a nota esclarece seu provável uso figurado sem apagar a concretude do texto.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem foi mantida próxima do grego sem sacrificar a naturalidade. “Ventre” preserva a metáfora original; a nota reúne a explicação lexical e a ambiguidade do referente pronominal.
