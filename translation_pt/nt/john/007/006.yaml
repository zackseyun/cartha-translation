  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτοῖς ὁ Ἰησοῦς· Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/006.yaml
  text: So Jesus said to them[a], “My time has not yet come, but your time is always ready.”
translation:
  language: pt
  text: 'Então Jesus lhes disse: “O meu tempo ainda não chegou, mas o tempo de vocês está sempre pronto.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas, para vocês, qualquer momento é oportuno”. O termo grego traduzido como “tempo” pode indicar um momento apropriado ou determinado, não apenas tempo em sentido geral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação lógica e narrativa de modo natural em português, sem a formalidade mais forte de “portanto”.
- source_word: λέγει ... ὁ Ἰησοῦς
  choice: Jesus disse
  rationale: Embora o grego use o presente histórico, o pretérito perfeito é natural na narrativa portuguesa.
- source_word: αὐτοῖς
  choice: lhes
  rationale: Reproduz de maneira concisa o objeto indireto, cujo referente é dado pelo contexto.
- source_word: ὁ καιρὸς ὁ ἐμός
  choice: o meu tempo
  rationale: Preserva o contraste enfático do possessivo e não substitui καιρός por “hora”, termo grego diferente e teologicamente carregado em João.
- source_word: οὔπω πάρεστιν
  choice: ainda não chegou
  rationale: Expressa idiomaticamente que o momento apropriado ainda não se apresentou.
- source_word: ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος
  choice: mas, para vocês, qualquer momento é oportuno
  rationale: Evita a construção pouco natural “o tempo de vocês está sempre pronto” e comunica que eles podem agir em qualquer ocasião, preservando o contraste com o tempo próprio de Jesus.
theological_decisions:
- issue: Sentido do “tempo” de Jesus no contexto joanino
  choice: o meu tempo
  alternative: o momento determinado para mim; a minha hora
  rationale: καιρός pode indicar um momento apropriado ou determinado, mas o texto não usa ὥρα (“hora”). A formulação mantém a possível importância teológica do momento sem explicá-la além do grego.
- issue: Sentido do tempo dos irmãos estar “sempre pronto”
  choice: para vocês, qualquer momento é oportuno
  alternative: o tempo de vocês está sempre pronto
  rationale: A tradução torna inteligível a expressão grega sem definir por que toda ocasião lhes é disponível; assim, não resolve implicitamente a tensão contextual entre Jesus e seus irmãos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Vocês” explicita o plural de ὑμέτερος e evita a ambiguidade de “seu”. O marcador [a] aparece no texto principal.
