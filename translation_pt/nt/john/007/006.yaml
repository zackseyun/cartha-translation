  source_fidelity: A primeira oração traduz adequadamente ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν. Na segunda, “qualquer momento é oportuno” comunica bem o efeito contextual, mas explicita “qualquer” e substitui o predicado ἕτοιμος (“está pronto”) por “é oportuno”, reduzindo a proximidade com a formulação grega e com o contraste deliberado entre os dois ‘tempos’.
  naturalness: “Então Jesus lhes disse” e “O meu tempo ainda não chegou” são naturais, claros e de registro apropriado. “O tempo de vocês está sempre pronto” é uma formulação um pouco mais literal, mas permanece compreensível em português moderno e preserva a imagem verbal do original.
  terminology: “Tempo” é a escolha adequada para καιρός neste versículo e não importa indevidamente o termo joanino “hora”. “Vocês” expressa de modo claro o plural de ὑμέτερος. A nota deve apresentar a possibilidade de “momento oportuno ou determinado” sem transformar essa nuance em paráfrase interpretativa obrigatória no texto principal.
