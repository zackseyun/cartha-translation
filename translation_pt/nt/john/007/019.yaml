  text: Οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν νόμον; καὶ οὐδεὶς ἐξ ὑμῶν ποιεῖ τὸν νόμον. τί με ζητεῖτε ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/019.yaml
  text: Did not Moses give you the law? Yet none of you keeps the law[b][a]. Why are you seeking to kill me?
translation:
  language: pt
  text: Não foi Moisés quem lhes deu a lei? Contudo, nenhum de vocês cumpre a lei.[a] Por que procuram me matar?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «faz a lei».
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ Μωϋσῆς δέδωκεν ὑμῖν
  choice: Não foi Moisés quem lhes deu
  rationale: A pergunta introduzida por οὐ espera resposta afirmativa. Em português natural, a construção enfática «Não foi Moisés quem...» preserva a força retórica; o pretérito perfeito é adequado ao ato histórico de dar a lei.
- source_word: τὸν νόμον
  choice: a lei
  rationale: No contexto, refere-se especificamente à lei mosaica, como deixa claro a menção a Moisés. A forma em minúscula é natural e não obscurece o referente.
- source_word: καὶ
  choice: Contudo
  rationale: 'Embora καί normalmente seja aditivo, aqui liga duas afirmações em claro contraste: Moisés lhes deu a lei, mas nenhum deles a cumpre.'
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: nenhum de vocês
  rationale: Expressão corrente e enfática em português, preservando a negação total do grego.
- source_word: ποιεῖ τὸν νόμον
  choice: cumpre a lei
  rationale: Literalmente, «faz a lei»; neste contexto, ποιεῖ significa pôr em prática ou observar. «Cumpre a lei» é idiomático, claro e mantém o sentido sem explicação adicional.
- source_word: τί με ζητεῖτε ἀποκτεῖναι
  choice: Por que procuram me matar?
  rationale: τί é causal neste contexto, e ζητεῖτε com infinitivo expressa a intenção ou tentativa em curso. «Procuram me matar» preserva de modo natural a formulação verbal do grego.
theological_decisions:
- issue: Referência de «a lei»
  choice: A lei mosaica dada por meio de Moisés
  alternative: Lei em sentido moral geral
  rationale: A menção explícita a Moisés identifica νόμος com a lei mosaica, sem necessidade de inserir «de Moisés» no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «vocês» para o plural de segunda pessoa e colocação pronominal natural no português brasileiro («procuram me matar»), sem perder a clareza internacional.
