base_translation:
  language: en
  yaml_path: translation/nt/john/007/052.yaml
  text: They answered and said to him[b][a], “Are you also from Galilee? Search and see that no prophet arises from Galilee.”
translation:
  language: pt
  text: 'Eles lhe responderam: “Será que você também é da Galileia?[a] Pesquise e veja que da Galileia não surge nenhum profeta.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você também não é da Galileia, é?” A pergunta grega é formulada de modo a esperar uma resposta negativa.'
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “da Galileia nenhum profeta é levantado”, preservando a possível nuance de que Deus levanta os profetas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Eles lhe responderam
  rationale: A fórmula grega combina literalmente ‘responderam’ e ‘disseram’. Em português atual, ‘lhe responderam’ transmite naturalmente a ação e o destinatário sem uma redundância artificial.
- source_word: Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ;
  choice: Será que você também é da Galileia?
  rationale: ‘Será que’ dá à pergunta um tom retórico e desconfiado, enquanto a nota registra de modo explícito que μή indica expectativa de resposta negativa.
- source_word: ἐραύνησον καὶ ἴδε
  choice: Pesquise e veja
  rationale: Preserva os dois imperativos e o desafio direto para que Nicodemos investigue a questão, sem acrescentar um objeto que não está expresso no grego.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: da Galileia
  rationale: Expressão portuguesa corrente para procedência ou origem; sua posição inicial na oração final preserva a ênfase do grego.
- source_word: προφήτης
  choice: nenhum profeta
  rationale: O substantivo sem artigo não aponta especificamente para ‘o Profeta’ escatológico. Com a negação, ‘nenhum profeta’ expressa de modo idiomático a afirmação abrangente dos interlocutores.
- source_word: οὐκ ἐγείρεται
  choice: não surge
  rationale: ‘Surge’ comunica o aparecimento de um profeta e conserva parte da imagem verbal, sem decidir se o verbo deve ser entendido como passivo, isto é, ‘é levantado’ por Deus.
theological_decisions:
- issue: Força retórica da pergunta introduzida por μή
  choice: Será que você também é da Galileia?
  alternative: Você também não é da Galileia, é?
  rationale: A formulação principal soa natural em português e mantém o tom desdenhoso no contexto. A alternativa torna explícita a expectativa gramatical de uma resposta negativa e é preservada em nota.
- issue: Possível nuance passiva ou divina de ἐγείρεται
  choice: não surge
  alternative: não é levantado
  rationale: O verbo pode descrever simplesmente o aparecimento de um profeta, mas a forma também admite a nuance de que Deus o levanta. A tradução principal evita impor essa leitura, e a nota a conserva.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. ‘Você’ corresponde ao singular σὺ e combina com a fala direta; ‘pesquise’ evita acrescentar ‘as Escrituras’, objeto não expresso no texto grego. A ordem ‘da Galileia não surge’ mantém a ênfase polemicamente colocada sobre a região.
