source:
  edition: SBLGNT
  text: ⸀οὐχ ἡ γραφὴ εἶπεν ὅτι ἐκ τοῦ σπέρματος Δαυίδ, καὶ ἀπὸ Βηθλέεμ τῆς κώμης ὅπου ἦν Δαυίδ, ⸂ἔρχεται ὁ χριστός⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/042.yaml
  text: Has not the Scripture said that the Messiah comes from the offspring of David and from Bethlehem[a], the village where David was?
translation:
  language: pt
  text: A Escritura não diz que o Messias vem da descendência de Davi e de Belém, a aldeia onde Davi estava?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o Cristo». O título grego é ὁ χριστός.'
    reason: Registra a tradução alternativa tradicional do título grego.
lexical_decisions:
- source_word: ἡ γραφή
  choice: a Escritura
  rationale: No uso joanino, a expressão singular designa a Escritura sagrada como testemunho autorizado; «a Escritura» é natural e precisa em português.
- source_word: εἶπεν
  choice: diz
  rationale: Embora o grego use o aoristo, o presente é idiomático em português para introduzir o testemunho permanente da Escritura numa pergunta retórica.
- source_word: ἐκ τοῦ σπέρματος Δαυίδ
  choice: da descendência de Davi
  rationale: Aqui σπέρμα indica linhagem ou posteridade, não semente literal; «descendência» comunica claramente o sentido genealógico.
- source_word: ἀπὸ Βηθλέεμ
  choice: de Belém
  rationale: ἀπό indica origem; «de Belém» é a formulação portuguesa mais natural.
- source_word: τῆς κώμης
  choice: a aldeia
  rationale: κώμη designa um povoado ou assentamento pequeno; «aldeia» preserva essa distinção lexical.
- source_word: ὅπου ἦν Δαυίδ
  choice: onde Davi vivia
  rationale: A formulação grega é literalmente «onde Davi estava/era». Em português, «onde Davi vivia» expressa de modo natural a associação local sem especificar indevidamente nascimento ou origem.
- source_word: ἔρχεται
  choice: vem
  rationale: O presente exprime a expectativa geral acerca da procedência do Messias e corresponde naturalmente a «vem».
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Neste debate sobre a expectativa judaica, Χριστός funciona como título do rei-libertador esperado; «Messias» traduz esse valor titular.
theological_decisions:
- issue: Tradução de Χριστός como título
  choice: o Messias
  alternative: o Cristo
  rationale: O contexto discute a origem esperada da figura messiânica, de modo que o termo funciona claramente como título, não como designação quase nominal. «Messias» torna explícito esse sentido sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta retórica foi preservada, e a ordem dos elementos acompanha de perto o grego sem produzir uma frase artificial.
