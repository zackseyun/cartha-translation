  text: οὐ δύναται ὁ κόσμος μισεῖν ὑμᾶς, ἐμὲ δὲ μισεῖ, ὅτι ἐγὼ μαρτυρῶ περὶ αὐτοῦ ὅτι τὰ ἔργα αὐτοῦ πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/007.yaml
  text: The world is not able to hate you[a], but it hates me[d][c][b], because I testify about it that its works are evil.
translation:
  language: pt
  text: O mundo[b] não pode odiar vocês[a], mas me odeia, porque eu testemunho a respeito do mundo[c] que as suas obras são más[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não é capaz de odiar vocês”.'
    reason: lexical_alternative
  - marker: b
    text: Em João, “o mundo” muitas vezes se refere à ordem humana em oposição a Deus, e não ao universo criado como tal.
    reason: cultural_note
  - marker: c
    text: 'Ou: “dou testemunho a respeito dele”.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “as suas ações são más”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δύναται
  choice: não pode
  rationale: Expressa de modo natural e direto em português a incapacidade indicada por δύναμαι, sem enfraquecer a afirmação.
- source_word: ὁ κόσμος
  choice: o mundo
  rationale: Mantém a formulação ampla e característica de João, sem restringi-la interpretativamente a um sistema ou grupo específico.
- source_word: μισεῖν / μισεῖ
  choice: odiar / odeia
  rationale: Preserva a repetição e a força incisiva de μισέω no contraste entre os irmãos de Jesus e o próprio Jesus.
- source_word: ἐμὲ δὲ
  choice: mas odeia a mim
  rationale: O pronome tônico após a preposição conserva a ênfase contrastiva em Jesus, enquanto δέ é traduzido naturalmente por “mas”.
- source_word: μαρτυρῶ
  choice: testemunho
  rationale: Mantém a nuance de testemunho e declaração pública própria de μαρτυρέω, em linguagem corrente e digna.
- source_word: περὶ αὐτοῦ
  choice: a respeito dele
  rationale: Retoma “o mundo” segundo o gênero gramatical exigido em português, sem personalizar além do que o contexto permite.
- source_word: τὰ ἔργα αὐτοῦ
  choice: as suas obras
  rationale: Conserva a expressão joanina e sua ressonância moral e teológica; a nota registra a alternativa mais cotidiana “ações”.
- source_word: πονηρά
  choice: más
  rationale: Comunica claramente a qualidade moral negativa de πονηρά e concorda naturalmente com “obras”.
theological_decisions:
- issue: Referente e força teológica de “o mundo” no contexto joanino
  choice: Manter “o mundo” sem expansão interpretativa
  alternative: o sistema do mundo; a humanidade em oposição a Deus
  rationale: κόσμος possui sentidos sobrepostos em João. Aqui aparece como uma ordem humana moralmente oposta a Jesus, mas explicitar uma interpretação no texto principal estreitaria a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega “vocês” para o plural ὑμᾶς e mantém “o mundo”, “testemunho” e “obras” para preservar o vocabulário e a tensão do texto joanino.
