reference: John 7:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτον οἴδαμεν πόθεν ἐστίν· ὁ δὲ χριστὸς ὅταν ἔρχηται οὐδεὶς γινώσκει πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/027.yaml
  text: But we know where this man is from; but when the Messiah comes[a], no one knows where he is from.
translation:
  language: pt
  text: Mas sabemos de onde este homem vem; porém, quando o Messias[a] vier, ninguém sabe de onde ele vem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”.'
    reason: Registra a alternativa tradicional e lexicalmente direta para o título grego Χριστός.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Introduz diretamente o contraste com a discussão anterior, de modo natural em português.
- source_word: τοῦτον
  choice: este homem
  rationale: O demonstrativo aponta concretamente para Jesus; “este homem” é mais natural e pessoal do que o literal “este” ou “este aqui”.
- source_word: οἴδαμεν
  choice: sabemos
  rationale: Expressa o conhecimento que os falantes afirmam possuir.
- source_word: πόθεν ἐστίν
  choice: de onde ... é
  rationale: Preserva a referência à origem e mantém a mesma formulação nas duas orações, sem substituir o verbo “ser” por “vir”.
- source_word: ὁ δὲ χριστός
  choice: porém, o Messias
  rationale: δέ sustenta o contraste, e Χριστός funciona aqui como título da figura messiânica esperada, não como nome próprio.
- source_word: ὅταν ἔρχηται
  choice: quando ... vier
  rationale: A construção com subjuntivo aponta para uma ocorrência futura esperada ou contingente; “quando vier” é a formulação portuguesa natural.
- source_word: οὐδεὶς γινώσκει
  choice: ninguém sabe
  rationale: Mantém o presente do grego e apresenta diretamente a alegação geral feita pela multidão.
theological_decisions:
- issue: Tradução de Χριστός como título
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός designa o libertador ungido esperado por Israel. “Messias” preserva com clareza esse sentido titular e o contexto judaico.
- issue: Alegação sobre a origem do Messias
  choice: Reproduzir a declaração da multidão sem explicá-la ou endossá-la
  alternative: Expandir para “ninguém saberá de onde o Messias virá”
  rationale: O versículo relata a expectativa ou compreensão dos falantes; a tradução mantém a tensão narrativa sem acrescentar uma correção teológica.
- issue: Tempo verbal de γινώσκει
  choice: ninguém sabe
  alternative: ninguém saberá
  rationale: O presente grego foi preservado, embora o português também permita uma acomodação futura. A forma escolhida mantém a alegação como máxima geral.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “de onde ... é” conserva a correspondência entre as duas metades do versículo e evita resolver a ambiguidade da origem como local de procedência ou origem mais ampla.
