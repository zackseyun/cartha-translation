id: JHN.7.15
reference: John 7:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂ἐθαύμαζον οὖν⸃ οἱ Ἰουδαῖοι λέγοντες· Πῶς οὗτος γράμματα οἶδεν μὴ μεμαθηκώς;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/015.yaml
  text: So the Jews were marveling[a], saying[b], “How does this man know letters without having studied?”
translation:
  language: pt
  text: 'Por isso, os judeus[b] se admiravam, dizendo: “Como este homem conhece as letras[a] sem ter estudado?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como este homem tem tal instrução?” Em grego, literalmente, “conhece letras”.'
    reason: lexical_alternative
  - marker: b
    text: Em João, “os judeus” refere-se aqui, conforme o contexto, aos interlocutores ou opositores judeus de Jesus em Jerusalém, provavelmente incluindo autoridades da Judeia, e não ao povo judeu como um todo.
    reason: cultural_note
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: se admiravam
  rationale: O imperfeito indica uma reação em curso; a forma pronominal é natural em português e preserva a ideia de admiração ou espanto.
- source_word: οὖν
  choice: Por isso
  rationale: Mantém a conexão narrativa e lógica com o contexto anterior em linguagem corrente.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Reproduz diretamente a expressão joanina sem restringir interpretativamente o referente no texto principal; a nota esclarece seu alcance contextual.
- source_word: λέγοντες
  choice: dizendo
  rationale: Preserva de modo conciso a construção participial que introduz a fala direta.
- source_word: Πῶς
  choice: Como
  rationale: Equivalente direto e natural do interrogativo grego.
- source_word: οὗτος
  choice: este homem
  rationale: Expressa naturalmente o demonstrativo substantivado e conserva seu tom de distanciamento sem acrescentar desprezo.
- source_word: γράμματα
  choice: as letras
  rationale: Mantém a imagem e a amplitude lexical do grego, que pode indicar letras, instrução ou conhecimento erudito; a nota apresenta o sentido idiomático.
- source_word: οἶδεν
  choice: conhece
  rationale: Comunica o sentido estativo de οἶδα e combina diretamente com a expressão grega 'conhecer letras'.
- source_word: μὴ μεμαθηκώς
  choice: sem ter estudado
  rationale: A construção com particípio perfeito aponta para a ausência da formação esperada; esta formulação é clara sem especificar indevidamente uma instituição ou tradição de ensino.
theological_decisions:
- issue: Referente de οἱ Ἰουδαῖοι no Evangelho de João
  choice: os judeus
  alternative: os líderes judeus; os judeus da Judeia
  rationale: A tradução principal conserva a formulação abrangente do texto grego. Para evitar que ela seja entendida como generalização étnica, a nota explica que, neste contexto, se trata dos interlocutores ou opositores judeus de Jesus em Jerusalém, provavelmente incluindo autoridades da Judeia, e não de todo o povo judeu.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A expressão deliberadamente literal “conhece as letras” preserva a ambiguidade do grego, enquanto a nota esclarece seu sentido idiomático ligado à instrução ou erudição.
