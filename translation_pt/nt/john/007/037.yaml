  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς εἱστήκει ὁ Ἰησοῦς, καὶ ἔκραξεν λέγων· Ἐάν τις διψᾷ ἐρχέσθω πρός με καὶ πινέτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/037.yaml
  text: On the last day[a], the great day of the feast, Jesus stood and cried out, saying, “If anyone is thirsty, let him come to me and drink.”
translation:
  language: pt
  text: 'No último dia, o grande dia da festa, Jesus estava de pé e exclamou: “Se alguém tem sede, venha a mim e beba.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ
  choice: No último dia
  rationale: A preposição com o dativo marca o tempo, e δέ é um conectivo leve que não exige tradução explícita em português. A formulação é natural e preserva a referência temporal.
- source_word: τῇ μεγάλῃ τῆς ἑορτῆς
  choice: o grande dia da festa
  rationale: μέγας qualifica o dia e lhe dá destaque. “Festa” é uma tradução corrente e adequada ao contexto festivo em João.
- source_word: εἱστήκει
  choice: se pôs de pé
  rationale: A forma de ἵστημι descreve Jesus em posição ereta; no fluxo narrativo, “se pôs de pé” comunica naturalmente sua postura pública, embora “estava de pé” também seja possível.
- source_word: ἔκραξεν λέγων
  choice: exclamou
  rationale: κράζω indica uma fala pública em voz alta. “Exclamou” preserva a ênfase sem a redundância pouco natural de “exclamou, dizendo”.
- source_word: Ἐάν τις διψᾷ
  choice: Se alguém tem sede
  rationale: τις é indefinido e singular; “alguém” o representa de modo inclusivo e natural. “Tem sede” mantém aberta a força literal e metafórica de διψάω.
- source_word: ἐρχέσθω πρός με καὶ πινέτω
  choice: venha a mim e beba
  rationale: Os dois imperativos presentes são preservados como convite ou ordem direta. Em português, as formas verbais concordam naturalmente com o pronome indefinido “alguém”, sem necessidade de acrescentar pronome de gênero.
theological_decisions:
- issue: Força metafórica da sede e do beber
  choice: Manter literalmente “tem sede” e “beba”
  alternative: Explicitar como desejar a vida, crer ou receber o Espírito
  rationale: O versículo apresenta uma imagem cuja interpretação se desenvolve no contexto. Preservá-la evita resolver no texto traduzido uma tensão teológica genuína.
- issue: Referência genérica de τις
  choice: Usar “alguém” com os verbos singulares “venha” e “beba”
  alternative: Acrescentar um pronome masculino ou reformular no plural
  rationale: O português permite conservar tanto a singularidade quanto o caráter genérico da expressão grega sem introduzir gênero que não está lexicalmente especificado por τις.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade no Brasil. A tradução evita um marcador discursivo inicial desnecessário e preserva a solenidade do convite público de Jesus.
