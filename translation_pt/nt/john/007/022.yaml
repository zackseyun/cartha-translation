reference: John 7:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τοῦτο Μωϋσῆς δέδωκεν ὑμῖν τὴν περιτομήν— οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων— καὶ ἐν σαββάτῳ περιτέμνετε ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/022.yaml
  text: For this reason Moses has given you circumcision—not that it is from Moses[a], but from the fathers—and on the Sabbath you circumcise a man.
translation:
  language: pt
  text: Por essa razão, Moisés lhes deu a circuncisão — não que ela venha de Moisés, mas dos antepassados — e vocês circuncidam um homem no sábado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por essa razão
  rationale: Preserva a força causal e explicativa da expressão grega em português natural.
- source_word: Μωϋσῆς
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: δέδωκεν
  choice: deu
  rationale: O pretérito perfeito é a forma portuguesa natural para o ato passado cujos efeitos permanecem; reproduzir formalmente o perfeito grego com «tem dado» seria pouco idiomático neste contexto.
- source_word: τὴν περιτομήν
  choice: a circuncisão
  rationale: Designa diretamente a prática ou instituição da circuncisão.
- source_word: οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων
  choice: não que ela venha de Moisés, mas dos patriarcas
  rationale: Mantém a observação parentética sobre a origem histórica; «venha de» expressa naturalmente ἐκ como fonte, e «patriarcas» torna claro o referente ancestral pré-mosaico sem sugerir pais imediatos.
- source_word: ἐν σαββάτῳ
  choice: no sábado
  rationale: Expressão temporal idiomática para a prática geral realizada em dia de sábado.
- source_word: περιτέμνετε
  choice: vocês circuncidam
  rationale: Conserva o presente indicativo e seu valor de prática habitual, com forma de segunda pessoa plural amplamente inteligível.
- source_word: ἄνθρωπον
  choice: um homem
  rationale: O referente concreto é masculino, como exige a prática da circuncisão; «homem» evita apagar esse dado.
theological_decisions:
- issue: Referência de «τῶν πατέρων» na explicação parentética
  choice: «dos patriarcas», indicando que a circuncisão antecede Moisés
  alternative: «dos antepassados», com referência mais ampla aos ancestrais de Israel
  rationale: O argumento contrasta Moisés com os ancestrais anteriores a ele. «Patriarcas» comunica de modo conciso a origem pré-mosaica da circuncisão, sem acrescentar uma identificação individual não explicitada no versículo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A construção parentética e a tensão do raciocínio jurídico-histórico foram preservadas. Não se acrescentou nota, pois «dos patriarcas» esclarece naturalmente o sentido relevante do grego sem eliminar uma ambiguidade teológica substantiva.
