  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἴδε παρρησίᾳ λαλεῖ καὶ οὐδὲν αὐτῷ λέγουσιν· μήποτε ἀληθῶς ἔγνωσαν οἱ ἄρχοντες ὅτι οὗτός ⸀ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/026.yaml
  text: And look[a], he is speaking openly, and they say nothing to him. Can it be that the rulers truly know that this is the Messiah?
translation:
  language: pt
  text: 'E vejam: ele está falando abertamente, e não lhe dizem nada. Será que as autoridades realmente reconheceram[a] que este é o Messias?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Será que as autoridades sabem de fato que este é o Messias?”'
    reason: A forma verbal ἔγνωσαν pode destacar tanto o reconhecimento a que chegaram como o conhecimento que agora possuem.
lexical_decisions:
- source_word: ἴδε
  choice: vejam
  rationale: Empregado como expressão que chama a atenção para o que está acontecendo. “Vejam” é atual e natural; evita o arcaísmo de “eis”.
- source_word: παρρησίᾳ
  choice: abertamente
  rationale: No contexto, destaca que Jesus fala de modo público e sem reserva. “Ousadamente” acentuaria a coragem mais do que a publicidade da fala.
- source_word: λαλεῖ
  choice: está falando
  rationale: O presente progressivo retrata a ação em curso observada pela multidão.
- source_word: οὐδὲν αὐτῷ λέγουσιν
  choice: não lhe dizem nada
  rationale: Mantém de perto a construção grega e não acrescenta a ideia interpretativa de dizer algo “contra” ele.
- source_word: μήποτε
  choice: Será que
  rationale: Introduz uma inferência hesitante e surpresa. A formulação portuguesa preserva a incerteza sem impor uma resposta negativa.
- source_word: ἀληθῶς
  choice: realmente
  rationale: Expressa de maneira natural a força confirmativa do advérbio no português contemporâneo.
- source_word: ἔγνωσαν
  choice: reconheceram
  rationale: O aoristo pode indicar que as autoridades chegaram ao reconhecimento da identidade de Jesus. A nota conserva a alternativa mais ampla “sabem”.
- source_word: οἱ ἄρχοντες
  choice: as autoridades
  rationale: No contexto, refere-se às autoridades dirigentes judaicas. “Autoridades” é mais claro em português do que “governantes”, sem especificar além do texto.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Aqui χριστός funciona como título messiânico na pergunta da multidão, e não como um nome próprio.
theological_decisions:
- issue: Tradução de ὁ χριστός como título
  choice: o Messias
  alternative: o Cristo
  rationale: O contexto trata da identificação esperada do enviado ungido; “Messias” preserva com clareza a função titular e o contexto judaico.
- issue: Força da pergunta introduzida por μήποτε
  choice: Será que as autoridades realmente reconheceram... ?
  alternative: Por acaso as autoridades sabem de fato... ?
  rationale: A pergunta expressa surpresa e conjectura, sem resolver se os falantes esperam categoricamente uma resposta negativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A pontuação após “vejam” reproduz naturalmente a função de chamar a atenção, e a pergunta mantém o tom de surpresa da multidão.
