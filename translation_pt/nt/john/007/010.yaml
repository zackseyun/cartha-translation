id: JHN.7.10
reference: John 7:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὡς δὲ ἀνέβησαν οἱ ἀδελφοὶ αὐτοῦ ⸂εἰς τὴν ἑορτήν, τότε καὶ αὐτὸς ἀνέβη⸃, οὐ φανερῶς ἀλλὰ ὡς ἐν κρυπτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/010.yaml
  text: But when his brothers had gone up to the feast[a], then he also went up, not openly but as if in secret.
translation:
  language: pt
  text: Mas, quando os irmãos dele subiram para a festa, então ele também subiu, não abertamente, mas como que em segredo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas em segredo”. A expressão grega diz literalmente “mas como que em segredo”, o que pode tornar a afirmação um pouco menos categórica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Mas, quando
  rationale: Ὡς com o aoristo introduz uma oração temporal, enquanto δέ marca uma transição com leve contraste em relação ao contexto anterior.
- source_word: ἀνέβησαν ... ἀνέβη
  choice: subiram ... subiu
  rationale: Mantém o sentido de ἀναβαίνω, natural para a subida geográfica e religiosa a Jerusalém; o contexto e a oração temporal deixam clara a sequência.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: os irmãos dele
  rationale: No contexto imediato, ἀδελφοί se refere aos irmãos homens de Jesus. A formulação com 'dele' é clara e natural em português brasileiro.
- source_word: εἰς τὴν ἑορτήν
  choice: para a festa
  rationale: ἑορτή designa a festa religiosa judaica, identificada no contexto como a Festa das Tendas.
- source_word: τότε καὶ αὐτὸς
  choice: então ele também
  rationale: Preserva tanto a sequência temporal indicada por τότε quanto a força aditiva de καὶ αὐτός.
- source_word: οὐ φανερῶς
  choice: não abertamente
  rationale: Equivalente direto de φανερῶς, em contraste claro com a expressão seguinte.
- source_word: ἀλλὰ ὡς ἐν κρυπτῷ
  choice: mas como que em segredo
  rationale: '''Como que'' preserva a qualificação introduzida por ὡς, sem reduzi-la à afirmação mais categórica ''em segredo''.'
theological_decisions:
- issue: Relação entre a ida de Jesus e sua declaração anterior sobre não subir para a festa
  choice: Narrar diretamente que Jesus subiu depois dos irmãos e não abertamente, sem explicar a tensão.
  alternative: Parafrasear para sugerir que Jesus mudou de ideia ou para harmonizar explicitamente sua ação com João 7:8.
  rationale: O grego não fornece uma explicação; a tradução deve conservar a sequência narrativa e a tensão do texto.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. 'Festa' mantém a terminologia religiosa do contexto, e 'como que em segredo' conserva uma nuance genuína do grego.
