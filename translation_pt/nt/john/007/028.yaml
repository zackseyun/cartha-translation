id: JHN.7.28
reference: John 7:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔκραξεν οὖν ἐν τῷ ἱερῷ διδάσκων ὁ Ἰησοῦς καὶ λέγων· Κἀμὲ οἴδατε καὶ οἴδατε πόθεν εἰμί· καὶ ἀπ’ ἐμαυτοῦ οὐκ ἐλήλυθα, ἀλλ’ ἔστιν ἀληθινὸς ὁ πέμψας με, ὃν ὑμεῖς οὐκ οἴδατε·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/028.yaml
  text: So Jesus cried out in the temple[a], teaching and saying, “You know me, and you know where I am from. And I have not come from myself, but the one who sent me is true[c][b], whom you do not know.”
translation:
  language: pt
  text: 'Então, enquanto ensinava no templo, Jesus falou em alta voz: “Vocês me conhecem e sabem de onde sou.[a] Eu não vim por mim mesmo,[b] mas é verdadeiro aquele que me enviou, a quem vocês não conhecem.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A declaração também pode ser entendida como irônica ou desafiadora no contexto. Contudo, a forma grega é afirmativa, não interrogativa.
    reason: ambiguity
  - marker: b
    text: 'Ou: «não vim por iniciativa própria».'
    reason: lexical_alternative
  - marker: c
    text: «Verdadeiro» também pode ter o sentido de «genuíno» ou «real» no uso de João.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: falou em alta voz
  rationale: Expressa uma declaração pública feita com voz forte, sem sugerir necessariamente aflição, como poderia ocorrer com «gritou» ou «clamou».
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: Ἱερόν designa o complexo do templo, não especificamente o santuário interior. «No templo» é claro e natural em português.
- source_word: διδάσκων ... καὶ λέγων
  choice: enquanto ensinava ... falou
  rationale: Apresenta o ensino como a situação em curso na qual Jesus fez a declaração; evita a formulação pouco natural «ensinando e dizendo».
- source_word: Κἀμὲ οἴδατε καὶ οἴδατε
  choice: Vocês me conhecem e sabem
  rationale: Preserva a repetição sem tornar a frase artificial. «Conhecem» é adequado para a pessoa, e «sabem» introduz naturalmente a informação sobre sua origem.
- source_word: πόθεν εἰμί
  choice: de onde sou
  rationale: Mantém aberta a referência à origem de Jesus, sem restringi-la a procedência geográfica nem explicá-la como origem celestial.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: por mim mesmo
  rationale: Preserva de modo relativamente formal a expressão reflexiva e o tema joanino de Jesus não ter vindo independentemente, deixando «por iniciativa própria» como esclarecimento possível.
- source_word: οὐκ ἐλήλυθα
  choice: não vim
  rationale: É a forma idiomática em português para o perfeito grego neste contexto e mantém em vista a vinda de Jesus que fundamenta sua missão presente.
- source_word: ἀληθινὸς
  choice: verdadeiro
  rationale: Preserva a amplitude joanina do termo, que pode envolver veracidade, realidade e autenticidade.
- source_word: ὁ πέμψας με
  choice: aquele que me enviou
  rationale: Mantém a agência pessoal do remetente sem acrescentar «o Pai», título que não aparece explicitamente nesta oração.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: vocês não o conhecem
  rationale: Conserva a acusação direta e o sentido pessoal de conhecer, em português corrente.
theological_decisions:
- issue: Se «Vocês me conhecem e sabem de onde sou» deve ser explicitamente apresentado como ironia ou pergunta retórica
  choice: Manter a declaração afirmativa no texto principal
  alternative: «Vocês me conhecem e sabem de onde sou?» ou uma formulação explicitamente irônica
  rationale: A forma grega é declarativa, embora o contexto permita tom irônico ou desafiador. A tradução conserva essa tensão sem decidir o tom pelo leitor.
- issue: O alcance da origem de Jesus em «de onde sou» e «não vim por mim mesmo»
  choice: Usar linguagem ampla, capaz de comportar tanto a origem aparente quanto a missão divina
  alternative: Limitar a frase à origem geográfica ou explicitar aqui uma origem celestial
  rationale: O Evangelho de João frequentemente sobrepõe sentidos relativos à origem de Jesus. O texto grego desta oração não os reduz a apenas um deles.
- issue: A identidade de «aquele que me enviou»
  choice: Não acrescentar «o Pai» ao texto principal
  alternative: «o Pai, que me enviou»
  rationale: O contexto joanino informa a identidade do remetente, mas esta oração usa uma descrição relacional, não o título explícito. A tradução segue essa forma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Emprega «vocês» para o plural de segunda pessoa e evita tanto arcaísmos como explicações teológicas inseridas no corpo do versículo.
