id: JHN.7.17
reference: John 7:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν, γνώσεται περὶ τῆς διδαχῆς πότερον ἐκ τοῦ θεοῦ ἐστιν ἢ ἐγὼ ἀπ’ ἐμαυτοῦ λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/017.yaml
  text: If anyone wants to do his will[a], he will know about the teaching, whether it is from God or whether I am speaking from myself.
translation:
  language: pt
  text: Se alguém quiser fazer a vontade dele, saberá a respeito do ensino se ele vem de Deus ou se eu falo por mim mesmo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de mim mesmo”; também pode significar “por conta própria” ou “por minha própria autoridade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις θέλῃ
  choice: Se alguém quiser
  rationale: A construção ἐάν com o subjuntivo apresenta uma condição geral. “Quiser” expressa de modo natural tanto o desejo quanto a disposição envolvidos em θέλω.
- source_word: τὸ θέλημα αὐτοῦ ποιεῖν
  choice: fazer a vontade dele
  rationale: “Fazer a vontade” é a expressão portuguesa direta e idiomática para ποιεῖν τὸ θέλημα. “Dele” preserva o pronome grego, cujo referente contextual é Deus.
- source_word: γνώσεται
  choice: saberá
  rationale: O futuro de γινώσκω indica o conhecimento ou discernimento resultante. “Saberá” é conciso e natural, sem impor uma ênfase processual.
- source_word: περὶ τῆς διδαχῆς
  choice: a respeito do ensino
  rationale: περί com genitivo indica o assunto em questão, e διδαχή se refere ao ensino de Jesus discutido no contexto.
- source_word: πότερον ... ἢ
  choice: se ... ou se
  rationale: A estrutura correlativa apresenta duas alternativas; repetir “se” deixa o contraste claro e fluente em português.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: ele vem de Deus
  rationale: ἐκ marca origem ou fonte. Em português, “vem de Deus” comunica naturalmente essa origem; o pronome “ele” retoma “o ensino” e evita a formulação menos idiomática “é de Deus”.
- source_word: ἀπ’ ἐμαυτοῦ λαλῶ
  choice: falo por mim mesmo
  rationale: A expressão indica que a fala teria origem no próprio Jesus. “Por mim mesmo” é natural em português e preserva a ideia de iniciativa ou fonte própria sem explicitar além do texto a noção de autoridade.
theological_decisions:
- issue: Referente de αὐτοῦ em “a vontade dele”
  choice: Preservar o pronome, entendendo contextualmente que se refere a Deus.
  alternative: 'Tornar o referente explícito: “a vontade de Deus”.'
  rationale: O contexto imediato torna Deus o referente mais natural, mas o grego usa um pronome. Mantê-lo evita uma explicitação interpretativa desnecessária.
- issue: Sentido de ἀπ’ ἐμαυτοῦ
  choice: “por mim mesmo”, com nota sobre a formulação mais literal e a possível nuance de autoridade independente.
  alternative: “de mim mesmo”, “por conta própria” ou “por minha própria autoridade”.
  rationale: O grego expressa diretamente origem ou fonte. A tradução principal deve conservar essa ideia sem transformar sua possível implicação de autoridade independente em formulação explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém o encadeamento condicional e as duas alternativas do grego. O marcador da nota foi colocado junto à expressão que ela esclarece.
