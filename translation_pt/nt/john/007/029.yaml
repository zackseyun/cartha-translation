  text: ἐγὼ οἶδα αὐτόν, ὅτι παρ’ αὐτοῦ εἰμι κἀκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/029.yaml
  text: I know him[a], because I am from him[b], and he sent me.
translation:
  language: pt
  text: Eu o conheço, porque venho dele[a], e foi ele quem me enviou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sou da parte dele” ou “procedo dele”. A expressão grega indica fonte ou procedência. A conjunção traduzida por “porque” também pode ser entendida como “que”: “Eu sei que venho dele”.'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: ἐγὼ
  choice: Eu
  rationale: O pronome explícito preserva a ênfase do grego e contrasta a afirmação de Jesus com o desconhecimento mencionado no contexto.
- source_word: οἶδα
  choice: conheço
  rationale: Embora tenha forma histórica de perfeito, οἶδα funciona normalmente como verbo de estado presente; “conheço” é natural e exato em português.
- source_word: αὐτόν
  choice: o
  rationale: O pronome retoma o Pai no contexto sem inserir essa identificação explicativa no texto principal.
- source_word: ὅτι
  choice: porque
  rationale: 'A conjunção é entendida em sentido causal: a procedência de Jesus fundamenta seu conhecimento daquele que o enviou.'
- source_word: παρ’ αὐτοῦ εἰμι
  choice: venho dele
  rationale: παρά com genitivo indica procedência ou origem. Em português corrente, “venho dele” comunica essa relação de modo mais natural do que “sou dele”, sem reduzi-la à simples missão.
- source_word: κἀκεῖνός
  choice: e foi ele quem
  rationale: A contração καί + ἐκεῖνος contém um pronome demonstrativo enfático; a construção portuguesa “foi ele quem” preserva essa ênfase com naturalidade.
- source_word: με
  choice: me
  rationale: Reproduz diretamente o objeto de ἀπέστειλεν.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: O aoristo é adequadamente expresso pelo pretérito perfeito simples e preserva o tema joanino do envio de Jesus.
theological_decisions:
- issue: Relação de Jesus com o Pai em παρ’ αὐτοῦ εἰμι
  choice: venho dele
  alternative: sou da parte dele; procedo dele; vim dele
  rationale: “Venho dele” exprime origem ou procedência sem definir de maneira excessiva se a frase enfatiza origem pessoal, presença anterior ou missão. Assim se conserva a profundidade e a tensão teológica do enunciado.
- issue: Valor de ὅτι
  choice: porque
  alternative: que
  rationale: 'A leitura causal se ajusta ao argumento: Jesus conhece aquele que o enviou porque vem dele. A possibilidade gramatical de conteúdo é registrada em nota, sem substituir a leitura contextual mais provável.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Venho dele” evita a possível leitura de posse em “sou dele”, enquanto “foi ele quem” transmite naturalmente a ênfase do pronome grego.
