  text: τινὲς δὲ ἤθελον ἐξ αὐτῶν πιάσαι αὐτόν, ἀλλ’ οὐδεὶς ⸀ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/044.yaml
  text: But some of them wanted to seize him[b][a], yet no one laid hands on him.
translation:
  language: pt
  text: Mas alguns deles queriam prendê-lo, porém ninguém pôs as mãos nele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς δὲ
  choice: Mas alguns
  rationale: Expressa de modo natural o grupo indefinido e o contraste com as reações anteriores da multidão.
- source_word: ἤθελον
  choice: queriam
  rationale: O imperfeito indica a intenção mantida naquele momento; “queriam” é claro e idiomático.
- source_word: ἐξ αὐτῶν
  choice: deles
  rationale: Indica que esses indivíduos pertenciam ao grupo já mencionado; “alguns deles” preserva esse sentido sem peso desnecessário.
- source_word: πιάσαι
  choice: prendê-lo
  rationale: No contexto joanino, o verbo denota agarrar alguém com a finalidade de detê-lo. “Prender” comunica naturalmente essa intenção em português.
- source_word: ἀλλ’ οὐδεὶς
  choice: porém ninguém
  rationale: Mantém o forte contraste entre a intenção de alguns e a ausência de ação efetiva.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: pôs as mãos nele
  rationale: Preserva a expressão concreta e idiomática grega para agarrar ou deter alguém, sem explicitar além do texto a razão pela qual não o fizeram.
theological_decisions:
- issue: A razão de ninguém deter Jesus
  choice: Não explicitar nenhuma causa
  alternative: Acrescentar que isso ocorreu por proteção divina ou porque ainda não havia chegado a hora
  rationale: O versículo afirma apenas que ninguém pôs as mãos nele; qualquer explicação teológica deve permanecer no contexto mais amplo, não ser inserida na tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Prendê-lo” torna explícita a nuance contextual de detenção, enquanto “pôs as mãos nele” preserva a imagem concreta da segunda oração.
