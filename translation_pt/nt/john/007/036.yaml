id: JHN.7.36
reference: John 7:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τίς ἐστιν ⸂ὁ λόγος οὗτος⸃ ὃν εἶπε· Ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/036.yaml
  text: What is this statement that he said[a], ‘You will seek me and will not find me, and where I am[c][b], you are not able to come’?”
translation:
  language: pt
  text: 'Que declaração é esta que ele fez[a]: “Vocês me procurarão e não me encontrarão; e, onde eu estou[b], vocês não podem vir”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que palavra é esta que ele disse?” O termo grego λόγος pode significar “palavra”, “declaração”, “mensagem” ou “dito”, conforme o contexto.'
    reason: lexical_alternative
  - marker: b
    text: Algumas traduções trazem “aonde eu vou”, mas o texto grego aqui diz literalmente “onde eu estou”, preservando a tensão intencional da formulação de João.
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: declaração
  rationale: Neste contexto, λόγος se refere ao conteúdo do que Jesus disse. “Declaração” é clara e preserva a ideia de um enunciado completo; a nota registra outras possibilidades lexicais.
- source_word: τίς ἐστιν ὁ λόγος οὗτος
  choice: Que declaração é esta
  rationale: Mantém a estrutura interrogativa do grego sem substituí-la pela paráfrase interpretativa “O que isso significa?”.
- source_word: Ζητήσετέ με
  choice: Vocês me procurarão
  rationale: “Procurar” expressa naturalmente ζητέω neste contexto e mantém o futuro do original.
- source_word: οὐχ εὑρήσετε
  choice: não me encontrarão
  rationale: Reproduz de modo direto a negação futura; a repetição de “me” torna o objeto claro em português.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: onde eu estou
  rationale: Preserva o presente εἰμί e a ênfase explícita de ἐγώ, sem mudar interpretativamente para “onde eu vou”.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: vocês não podem vir
  rationale: “Não podem” expressa a incapacidade indicada por δύνασθε, e “vir” corresponde a ἐλθεῖν, mantendo a perspectiva verbal do texto grego.
- source_word: εἶπε
  choice: ele fez
  rationale: Com “declaração”, a colocação idiomática portuguesa é “fez uma declaração”; isso comunica naturalmente o sentido de “disse” sem alterar o conteúdo.
theological_decisions:
- issue: Presente na expressão de Jesus “onde eu estou”
  choice: Manter “onde eu estou”
  alternative: “onde eu vou” ou “aonde eu vou”
  rationale: O texto grego emprega o presente εἰμί. Em João, essa formulação pode carregar tensão teológica quanto à identidade, origem e relação de Jesus com o Pai; por isso, a tradução não a reduz a um simples destino futuro.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” como plural não marcado no português brasileiro e preserva deliberadamente a formulação incomum “onde eu estou”. O ponto e vírgula ajuda a distinguir as duas partes da declaração sem transformá-las em citações separadas.
