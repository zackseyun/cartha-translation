  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ ἀφ’ ἑαυτοῦ λαλῶν τὴν δόξαν τὴν ἰδίαν ζητεῖ· ὁ δὲ ζητῶν τὴν δόξαν τοῦ πέμψαντος αὐτὸν οὗτος ἀληθής ἐστιν καὶ ἀδικία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/018.yaml
  text: The one who speaks from himself seeks his own glory[a]; but the one who seeks the glory of the one who sent him, this one is true[c][b], and there is no unrighteousness in him.
translation:
  language: pt
  text: Quem fala por conta própria[a] busca a sua própria glória; mas quem busca a glória daquele que o enviou, esse é verdadeiro[b], e nele não há injustiça[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por si mesmo” ou “com base em sua própria autoridade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “veraz”.
    reason: lexical_alternative
  - marker: c
    text: Ou “falta de retidão” ou “maldade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ ἑαυτοῦ
  choice: por si mesmo
  rationale: Preserva a ideia de fala originada no próprio indivíduo e, em português natural, mantém aberta a nuance de agir por iniciativa ou autoridade própria.
- source_word: λαλῶν
  choice: quem fala
  rationale: Expressa naturalmente o particípio substantivado e seu sentido geral e contínuo.
- source_word: δόξαν
  choice: glória
  rationale: É a correspondência tradicional e adequada no uso joanino, preservando tanto honra quanto ressonância teológica.
- source_word: τὴν ἰδίαν
  choice: a sua própria
  rationale: Marca enfaticamente aquilo que pertence ao próprio falante e sustenta o contraste com a glória de quem o enviou.
- source_word: ζητεῖ
  choice: busca
  rationale: Mantém a repetição verbal e o paralelismo entre as duas orações.
- source_word: τοῦ πέμψαντος αὐτὸν
  choice: daquele que o enviou
  rationale: Traduz com clareza o particípio articular e preserva a agência pessoal daquele que envia.
- source_word: οὗτος
  choice: esse
  rationale: Retém a ênfase demonstrativa do grego com formulação idiomática em português.
- source_word: ἀληθής
  choice: verdadeiro
  rationale: Preserva a amplitude do termo e a dicção joanina, sem limitá-lo apenas à veracidade verbal.
- source_word: ἀδικία
  choice: injustiça
  rationale: É uma tradução direta e corrente que pode abranger falta de retidão, injustiça e conduta errada; a nota registra alternativas semanticamente relevantes.
- source_word: ἐν αὐτῷ οὐκ ἔστιν
  choice: nele não há
  rationale: Reproduz de modo claro e natural a construção existencial e a caracterização moral interna.
theological_decisions:
- issue: Contraste entre falar ἀφ’ ἑαυτοῦ e buscar a glória de quem enviou
  choice: O texto contrasta a fala centrada na própria pessoa com a busca da glória daquele que envia.
  alternative: Interpretar a expressão exclusivamente como uma declaração técnica sobre autoridade própria ou aplicá-la apenas a falsos mestres.
  rationale: O contexto trata da origem e do propósito do ensino. A tradução conserva as categorias de fala, envio e glória sem introduzir uma formulação doutrinária posterior.
- issue: Sentido de ἀληθής
  choice: verdadeiro
  alternative: veraz
  rationale: “Verdadeiro” preserva a possível amplitude entre autenticidade, confiabilidade e veracidade, mantendo a tensão lexical do original.
- issue: Sentido de ἀδικία
  choice: injustiça
  alternative: injustiça moral, falta de retidão ou maldade
  rationale: “Injustiça” é transparente e formalmente próxima, enquanto a nota evita reduzir o termo ao campo social ou jurídico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela do grego foi preservada, e “esse” mantém a ênfase de οὗτος sem soar excessivamente literal.
