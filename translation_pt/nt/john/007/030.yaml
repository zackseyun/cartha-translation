source:
  edition: SBLGNT
  text: ἐζήτουν οὖν αὐτὸν πιάσαι, καὶ οὐδεὶς ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/030.yaml
  text: So they were seeking to seize him[a], yet no one laid a hand on him[b], because his hour had not yet come.
translation:
  language: pt
  text: Por isso, procuravam prendê-lo[a]; contudo, ninguém o agarrou, porque a sua hora ainda não havia chegado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tentavam agarrá-lo”. O verbo grego pode significar “agarrar” ou “capturar” e, neste contexto, implica prendê-lo.'
    reason: lexical_alternative
  - marker: b
    text: “A sua hora” é uma expressão recorrente em João para o momento determinado da missão de Jesus, especialmente o seu sofrimento, morte, ressurreição e glorificação.
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήτουν
  choice: procuravam
  rationale: O imperfeito indica uma ação contínua ou uma tentativa em curso; “procuravam” preserva esse aspecto de modo natural.
- source_word: οὖν
  choice: Por isso
  rationale: Expressa a progressão inferencial da narrativa em português corrente.
- source_word: πιάσαι
  choice: prendê-lo
  rationale: Embora o sentido básico seja “agarrar” ou “apanhar”, neste contexto a intenção é claramente deter Jesus; “prender” comunica essa ação sem exigir a nuance de um procedimento jurídico formal.
- source_word: οὐδεὶς
  choice: ninguém
  rationale: Equivalente direto e natural do pronome negativo.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα
  choice: pôs a mão nele
  rationale: Mantém a imagem e o singular do idioma grego, indicando que ninguém chegou a agarrá-lo.
- source_word: ὅτι
  choice: porque
  rationale: Introduz de forma clara a razão de ninguém agir.
- source_word: οὔπω
  choice: ainda não
  rationale: Equivalente temporal direto e idiomático.
- source_word: ἐληλύθει
  choice: havia chegado
  rationale: O mais-que-perfeito indica que, naquele ponto da narrativa, a hora decisiva ainda não chegara.
- source_word: ἡ ὥρα αὐτοῦ
  choice: a sua hora
  rationale: Preserva a expressão característica de João e sua densidade narrativa e teológica, sem reduzi-la simplesmente a “tempo”.
theological_decisions:
- issue: Sentido de “a sua hora” no contexto joanino
  choice: Manter a expressão literal “a sua hora” no texto principal.
  alternative: “o seu tempo” ou “o tempo determinado para a sua morte”
  rationale: Em João, a expressão aponta para o momento determinado da missão de Jesus, ligado especialmente ao seu sofrimento, morte, ressurreição e glorificação. O versículo, porém, não limita explicitamente a hora a um único desses acontecimentos; a formulação preserva essa amplitude e tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Procuravam prendê-lo” conserva o aspecto contínuo do imperfeito; “contudo” representa com clareza o contraste introduzido por καί neste contexto. A expressão joanina “a sua hora” foi mantida.
