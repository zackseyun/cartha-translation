  text: ἦν δὲ ἐγγὺς ἡ ἑορτὴ τῶν Ἰουδαίων ἡ σκηνοπηγία.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/002.yaml
  text: The Jewish feast[a], the Feast of Tabernacles, was near.
translation:
  language: pt
  text: A festa judaica dos Tabernáculos[a] estava próxima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “Festa das Cabanas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Funciona aqui como conector discursivo leve. O português natural não exige um equivalente explícito; “mas” sugeriria contraste excessivo, e “então” acrescentaria uma ideia temporal que o termo não contém por si só.
- source_word: ἐγγὺς
  choice: estava próxima
  rationale: Expressa com clareza a proximidade temporal da festa em português atual.
- source_word: ἑορτὴ τῶν Ἰουδαίων
  choice: festa judaica
  rationale: O genitivo identifica a festa como pertencente à tradição judaica. A forma adjetival é natural e evita uma formulação desnecessariamente pesada.
- source_word: σκηνοπηγία
  choice: dos Tabernáculos
  rationale: Emprega o nome tradicional e amplamente reconhecido da festa, enquanto a nota preserva o sentido lexical mais transparente, “Cabanas”.
theological_decisions:
- issue: Sentido de τῶν Ἰουδαίων na designação da festa
  choice: judaica
  alternative: dos judeus
  rationale: Neste contexto, a expressão classifica a festa, sem função polêmica. A forma adjetival preserva esse sentido e é idiomática em português.
- issue: Nome da σκηνοπηγία
  choice: Festa dos Tabernáculos
  alternative: Festa das Cabanas
  rationale: O texto principal usa a designação tradicional mais reconhecível; a nota registra a tradução mais literal e esclarece a referência às habitações temporárias.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural tanto para leitores brasileiros quanto para um público lusófono amplo. A ordem da frase foi ajustada sem alterar o foco informativo do original.
