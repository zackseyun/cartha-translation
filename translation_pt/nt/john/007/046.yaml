lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: responderam
  rationale: O aoristo de ἀποκρίνομαι introduz a resposta dos guardas no diálogo; “responderam” é a forma narrativa mais natural em português.
- source_word: οἱ ὑπηρέται
  choice: os guardas
  rationale: No contexto de João 7:32,45, são agentes enviados para prender Jesus. “Guardas” comunica sua função sem acrescentar a especificação interpretativa “do templo”.
- source_word: Οὐδέποτε
  choice: Nunca
  rationale: Expressa negação temporal absoluta e ocupa naturalmente a posição inicial para conservar a ênfase do grego.
- source_word: ἐλάλησεν
  choice: falou
  rationale: O pretérito perfeito traduz diretamente o aoristo e soa natural em português depois de “nunca” neste enunciado.
- source_word: οὕτως
  choice: assim
  rationale: Traduz de maneira concisa e idiomática a ideia de modo expressa por οὕτως.
- source_word: ἄνθρωπος
  choice: um homem
  rationale: Preserva o substantivo singular ἄνθρωπος e seu sentido representativo, sem substituí-lo silenciosamente pelo mais genérico “ninguém”.
theological_decisions:
- issue: Força representativa e forma masculina singular de ἄνθρωπος
  choice: um homem
  alternative: ninguém
  rationale: “Um homem” mantém a forma explícita do texto grego e sua força representativa. Como o sentido idiomático também pode ser expresso por “ninguém”, essa alternativa é registrada em nota, sem eliminar a tensão lexical do texto principal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem da frase conserva a ênfase inicial de “Nunca”.
