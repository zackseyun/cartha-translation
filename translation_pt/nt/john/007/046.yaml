  yaml_path: translation/nt/john/007/046.yaml
  text: The officers answered[a], “Never has a man spoken like this.”
translation:
  language: pt
  text: 'Os guardas responderam: “Nunca um homem[a] falou assim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nunca ninguém falou assim.” O grego traz “um homem”, no singular, com sentido representativo.'
