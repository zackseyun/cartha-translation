lexical_decisions:
- source_word: ταῦτα
  choice: essas coisas
  rationale: O demonstrativo neutro plural retoma as declarações anteriores; “essas coisas” conserva o plural e soa natural em português.
- source_word: δὲ ... εἰπὼν
  choice: Depois de dizer
  rationale: A construção com o particípio aoristo indica uma ação anterior à do verbo principal. A formulação temporal comunica com naturalidade a progressão narrativa, sem atribuir a δέ um contraste forte.
- source_word: αὐτὸς
  choice: ele mesmo
  rationale: O pronome explícito pode ter valor enfático ou contrastivo, destacando que o próprio Jesus permaneceu na Galileia, em contraste contextual com seus irmãos.
- source_word: ἔμεινεν
  choice: permaneceu
  rationale: Traduz diretamente μένω neste contexto locativo e preserva, sem exagerá-la, a recorrência lexical do verbo em João.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: na Galileia
  rationale: Tradução locativa direta e idiomática do nome geográfico.
