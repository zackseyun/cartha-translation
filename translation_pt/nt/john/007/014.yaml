id: JHN.7.14
reference: John 7:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἤδη δὲ τῆς ἑορτῆς μεσούσης ⸀ἀνέβη Ἰησοῦς εἰς τὸ ἱερὸν καὶ ἐδίδασκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/014.yaml
  text: When the feast was already half over[c][b][a], Jesus went up into the temple and was teaching.
translation:
  language: pt
  text: Quando a festa já estava pela metade[a], Jesus subiu ao templo[b] e ensinava.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por volta do meio da festa”.'
    reason: lexical_alternative
  - marker: b
    text: A palavra grega aqui traduzida por “templo” refere-se ao complexo ou aos pátios do templo, não especificamente ao santuário interior.
    reason: cultural_note
  - marker: c
    text: O imperfeito grego pode destacar que a ação de ensinar estava em andamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤδη
  choice: já
  rationale: Marca que a festa havia alcançado aquele ponto; “já” é o equivalente português mais direto e natural.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui funciona como transição narrativa branda. A construção temporal em português dá continuidade natural ao relato sem exigir “mas” ou “então”.
- source_word: τῆς ἑορτῆς μεσούσης
  choice: quando a festa estava pela metade
  rationale: O genitivo absoluto indica a circunstância temporal, e μεσούσης situa a festa em seu ponto médio.
- source_word: ἀνέβη
  choice: subiu
  rationale: Preserva a noção direcional de subir, apropriada para a ida ao templo em Jerusalém.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Forma portuguesa tradicional do nome.
- source_word: εἰς τὸ ἱερὸν
  choice: ao templo
  rationale: “Ao” expressa movimento em direção ao recinto; ἱερόν designa o complexo ou os pátios do templo, não especificamente o santuário interior.
- source_word: ἐδίδασκεν
  choice: ensinava
  rationale: O imperfeito apresenta a atividade em andamento, sem acrescentar explicitamente a ideia incoativa de que Jesus começou a ensinar.
theological_decisions:
- issue: Referência de ἱερόν
  choice: “templo” entendido como o complexo ou os pátios do templo
  alternative: “recinto do templo”
  rationale: A distinção lexical evita que o leitor imagine necessariamente o santuário interior, mas mantém no texto a expressão portuguesa corrente.
- issue: Aspecto de ἐδίδασκεν
  choice: “ensinava”, destacando ação em andamento
  alternative: “começou a ensinar”
  rationale: O imperfeito permite uma leitura progressiva; a tradução principal evita impor uma nuance incoativa que não está expressa de modo inequívoco.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Estava pela metade” comunica naturalmente o ponto médio da festa; “subiu ao templo” conserva a direção do movimento; “ensinava” mantém o aspecto durativo do imperfeito.
