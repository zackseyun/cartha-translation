source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ⸂τι ἐν κρυπτῷ⸃ ποιεῖ καὶ ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι· εἰ ταῦτα ποιεῖς, φανέρωσον σεαυτὸν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/004.yaml
  text: For no one does anything in secret while seeking to be in public view. If you do these things, show yourself to the world.
translation:
  language: pt
  text: Pois ninguém faz nada em segredo e, ao mesmo tempo, procura ser conhecido publicamente.[a] Se você faz essas coisas, mostre-se ao mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estar à vista de todos” ou “ser conhecido abertamente”. A expressão grega enfatiza abertura ou visibilidade pública.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς γάρ
  choice: Pois ninguém
  rationale: Preserva a generalização negativa e a função explicativa de γάρ em relação ao versículo anterior.
- source_word: τι ἐν κρυπτῷ ποιεῖ
  choice: faz algo em segredo
  rationale: Representa o objeto indefinido τι e a expressão idiomática de ocultação de modo natural em português.
- source_word: ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι
  choice: enquanto procura estar à vista de todos
  rationale: Expressa a busca intencional e o contraste entre agir em segredo e ter visibilidade pública; o valor enfático de αὐτός fica comunicado pelo próprio contraste.
- source_word: εἰ ταῦτα ποιεῖς
  choice: Se você faz essas coisas
  rationale: Mantém a condição no presente sem decidir se ela implica certeza ou dúvida quanto às ações mencionadas.
- source_word: φανέρωσον σεαυτὸν
  choice: mostre-se
  rationale: Imperativo direto e natural, adequado ao chamado para manifestação pública.
- source_word: τῷ κόσμῳ
  choice: ao mundo
  rationale: Preserva a dicção joanina e sua possível ressonância literária, sem reduzir κόσμος apenas a 'público'.
theological_decisions:
- issue: Sentido de κόσμος no contexto joanino
  choice: mundo
  alternative: público
  rationale: Embora o contexto imediato trate de visibilidade pública, 'mundo' preserva o termo recorrente em João e sua tensão literária e teológica.
- issue: Força da condição εἰ ταῦτα ποιεῖς
  choice: Se você faz essas coisas
  alternative: Já que você faz essas coisas
  rationale: A formulação condicional preserva a ambiguidade do grego e não transforma a fala dos irmãos numa afirmação inequívoca.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção 'à vista de todos' comunica naturalmente a publicidade contrastada com 'em segredo'; 'ao mundo' mantém a terminologia característica de João.
