  text: And[a] each went to his own home.
translation:
  language: pt
  text: E[a] cada um foi para sua casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo inicia o relato da mulher apanhada em adultério (João 7:53–8:11). Toda a passagem está ausente dos manuscritos gregos mais antigos, incluindo papiros do século III e os códices Sinaítico e Vaticano, do século IV, bem como de antigas traduções coptas e siríacas. Ela aparece no Códice de Beza, do século V, na tradição latina e na posterior tradição majoritária bizantina. Em alguns manuscritos, o relato ocorre em outros lugares, como depois de João 21:25 ou de Lucas 21:38, o que indica que circulou como uma tradição independente antes de ser incorporado à transmissão manuscrita. É preservado aqui também por ter sido estimado teológica e pastoralmente ao longo de cerca de 1.500 anos de leitura cristã.
    reason: textual_critical
lexical_decisions:
- source_word: Καί
  choice: E
  rationale: Preserva a ligação narrativa explícita do grego, embora o versículo introduza uma passagem cuja posição na tradição manuscrita é discutida.
- source_word: ἐπορεύθη
  choice: foi
  rationale: No contexto da dispersão das pessoas, o verbo indica deslocamento; «foi» é a forma mais natural e direta em português.
- source_word: ἕκαστος
  choice: cada um
  rationale: Mantém a forma singular distributiva, destacando que as pessoas se retiraram individualmente.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: para sua casa
  rationale: Reproduz naturalmente em português a expressão grega que indica o retorno de cada pessoa à própria casa.
theological_decisions:
- issue: Situação textual de João 7:53–8:11
  choice: Preservar o versículo no texto principal com nota textual
  alternative: Omitir o versículo do texto principal ou colocá-lo apenas em nota/apêndice
  rationale: O texto-fonte solicitado é a edição bizantina Robinson-Pierpont 2005, que contém a passagem. A nota informa de modo transparente sua ausência nos manuscritos gregos mais antigos e sua posição variável na tradição, sem decidir silenciosamente a questão para o leitor.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação concisa acompanha de perto a estrutura do grego sem soar artificial.
