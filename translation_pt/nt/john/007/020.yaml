  text: The crowd answered[a], “You have a demon. Who is seeking to kill you?”
translation:
  language: pt
  text: 'A multidão respondeu: “Você tem um demônio.[a] Quem está procurando matar você?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você está possuído por um demônio”. Literalmente: “Você tem um demônio”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: Verbo narrativo natural para introduzir a reação da multidão no diálogo.
- source_word: ὁ ὄχλος
  choice: a multidão
  rationale: Expressa de modo claro e atual o grupo de pessoas presente na cena.
- source_word: Δαιμόνιον ἔχεις
  choice: Você tem demônio
  rationale: Mantém de perto a construção grega e preserva a acusação hostil sem acrescentar uma formulação interpretativa.
- source_word: τίς
  choice: Quem
  rationale: Conserva o pronome interrogativo explícito e a força retórica da pergunta.
- source_word: ζητεῖ
  choice: está procurando
  rationale: A forma progressiva comunica naturalmente a ação em curso sugerida pelo presente grego.
- source_word: ἀποκτεῖναι
  choice: matar
  rationale: Equivalente direto e idiomático, sem acrescentar a nuance jurídica ou moral de 'assassinar'.
theological_decisions:
- issue: Formulação da acusação com δαιμόνιον contra Jesus
  choice: Você tem demônio
  alternative: Você está possuído por um demônio
  rationale: A tradução literal preserva a expressão do texto e deixa claro que se trata da acusação da multidão, sem endossá-la nem definir mais precisamente a natureza alegada da influência demoníaca.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural sobretudo no Brasil. A colocação de 'você' após 'matar' evita a ambiguidade que 'procurando te matar' poderia introduzir em algumas variedades, embora resulte em leve repetição.
