  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Ἓν ἔργον ἐποίησα καὶ πάντες θαυμάζετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/021.yaml
  text: Jesus answered and said to them[a], “I did one work[b], and you all marvel.”
translation:
  language: pt
  text: 'Jesus respondeu e lhes disse: “Fiz uma só obra[a][b], e todos vocês ficam admirados.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ato”. A palavra grega pode ter os dois sentidos, mas “obra” preserva o uso recorrente do termo em João para as ações de Jesus.
    reason: lexical_alternative
  - marker: b
    text: Provavelmente se refere à cura do homem enfermo realizada por Jesus em um sábado, em João 5:1–18.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτοῖς
  choice: respondeu e lhes disse
  rationale: Preserva os dois verbos da fórmula narrativa influenciada pelo semitismo e expressa naturalmente o objeto indireto em português.
- source_word: Ἓν ἔργον
  choice: uma só obra
  rationale: “Uma só” conserva a ênfase do numeral, e “obra” mantém a recorrência joanina de ἔργον para as ações de Jesus.
- source_word: ἐποίησα
  choice: fiz
  rationale: Verbo simples no pretérito perfeito, correspondente natural ao aoristo grego, sem formalidade desnecessária.
- source_word: πάντες θαυμάζετε
  choice: todos vocês se admiram
  rationale: Torna explícito que toda a audiência está incluída e conserva o presente vívido. “Admiram” permite tanto espanto quanto perplexidade, sem impor uma reação exclusivamente positiva.
theological_decisions:
- issue: Significado joanino de ἔργον
  choice: obra
  alternative: ato
  rationale: “Obra” preserva a ressonância recorrente do termo no Evangelho de João e sua possível ligação com as ações de Jesus, sem acrescentar uma interpretação ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fórmula “respondeu e lhes disse” conserva deliberadamente a estrutura do original; “todos vocês” explicita o plural da audiência.
