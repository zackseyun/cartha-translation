  text: καὶ γογγυσμὸς ⸂περὶ αὐτοῦ ἦν πολὺς⸃ ἐν τοῖς ὄχλοις· οἱ μὲν ἔλεγον ὅτι Ἀγαθός ἐστιν, ἄλλοι ⸀δὲ ἔλεγον· Οὔ, ἀλλὰ πλανᾷ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/012.yaml
  text: And there was much murmuring about him among the crowds[a]. Some were saying, “He is good.” Others were saying, “No, on the contrary[b], he is misleading the crowd.”
translation:
  language: pt
  text: 'E havia muita murmuração a respeito dele entre as multidões[a]. Alguns diziam: “Ele é bom.” Outros diziam: “Não, pelo contrário, ele engana a multidão[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “murmúrios” ou “cochichos” a respeito dele.
    reason: lexical_alternative
  - marker: b
    text: Ou “desvia a multidão” ou “leva a multidão ao erro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσμός
  choice: comentários em voz baixa
  rationale: Expressa a fala discreta e não pública que circulava entre as multidões, sem limitar o termo à ideia de queixa; a nota preserva alternativas com tonalidade mais negativa.
- source_word: περὶ αὐτοῦ
  choice: a respeito dele
  rationale: Tradução direta e natural da expressão que identifica Jesus como assunto dos comentários.
- source_word: πολύς
  choice: muitos
  rationale: Transmite a grande quantidade ou extensão dos comentários; a formulação plural é idiomática em português.
- source_word: ἐν τοῖς ὄχλοις
  choice: entre as multidões
  rationale: Preserva o plural grego e retrata a fala circulando entre os diversos grupos reunidos.
- source_word: οἱ μὲν ... ἄλλοι δὲ
  choice: Alguns ... Outros ...
  rationale: Reproduz claramente o contraste entre dois grupos, em português corrente.
- source_word: Ἀγαθός ἐστιν
  choice: Ele é bom
  rationale: Mantém o adjetivo predicativo do grego sem acrescentar 'homem' e deixa intacta a avaliação positiva da pessoa de Jesus.
- source_word: Οὔ, ἀλλὰ
  choice: Não; pelo contrário
  rationale: Comunica a negação direta seguida de uma correção enfática.
- source_word: πλανᾷ
  choice: engana
  rationale: Expressa uma acepção central de πλανάω no contexto de uma acusação contra Jesus; a nota registra a alternativa 'desvia', que enfatiza o resultado de levar ao erro.
- source_word: τὸν ὄχλον
  choice: a multidão
  rationale: Preserva o singular coletivo usado pelo grego na segunda declaração.
theological_decisions:
- issue: Caracterização de Jesus pelas multidões
  choice: Apresentar diretamente tanto a avaliação positiva quanto a acusação negativa, sem endossar nenhuma delas na voz do narrador.
  alternative: Suavizar 'engana' para 'confunde' ou explicitar que uma das opiniões é correta.
  rationale: O versículo relata opiniões humanas conflitantes sobre Jesus. A tradução conserva essa tensão e não antecipa o juízo narrativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Comentários em voz baixa” evita o caráter excessivamente literário de “murmuração” e preserva a natureza discreta das falas; as alternativas mais concisas aparecem em nota.
