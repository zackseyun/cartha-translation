id: JHN.7.5
reference: John 7:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ οἱ ἀδελφοὶ αὐτοῦ ἐπίστευον εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/005.yaml
  text: For not even his brothers believed in him[a].
translation:
  language: pt
  text: Pois nem mesmo os irmãos dele criam nele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois nem mesmo os irmãos dele estavam crendo nele”. O imperfeito grego pode apresentar uma ação contínua ou característica no passado; em português, “criam” normalmente já transmite esse aspecto.'
    reason: alternativa aspectual
lexical_decisions:
- source_word: οὐδὲ
  choice: nem mesmo
  rationale: Neste contexto, οὐδὲ enfatiza que até os irmãos de Jesus estavam incluídos entre os que não criam; “nem mesmo” comunica essa força com naturalidade.
- source_word: γὰρ
  choice: Pois
  rationale: γὰρ apresenta a explicação da declaração anterior e mantém explícita a ligação discursiva com o contexto.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: os irmãos dele
  rationale: O masculino plural refere-se aqui aos irmãos ou parentes masculinos de Jesus conforme apresentados pela narrativa. “Dele” evita qualquer ambiguidade artificial sem especificar além do grego o tipo exato de parentesco.
- source_word: ἐπίστευον
  choice: criam
  rationale: O imperfeito grego descreve a falta de fé no período narrado. O pretérito imperfeito português preserva naturalmente esse valor durativo ou habitual, sem a estranheza de uma perífrase literal.
- source_word: εἰς αὐτόν
  choice: nele
  rationale: Com πιστεύω, εἰς αὐτόν indica fé ou confiança dirigida à pessoa de Jesus; “crer nele” é a formulação portuguesa corrente e adequada.
theological_decisions:
- issue: Sentido de πιστεύω εἰς αὐτόν no uso joanino
  choice: fé ou confiança pessoal dirigida a Jesus
  alternative: confiavam nele
  rationale: João emprega regularmente πιστεύω εἰς para expressar crer em Jesus. “Criam nele” conserva essa formulação sem definir de modo indevido toda a extensão teológica da fé nem explicar as razões da incredulidade dos irmãos.
- issue: Identidade de οἱ ἀδελφοὶ αὐτοῦ
  choice: os irmãos dele
  alternative: os parentes dele
  rationale: A tradução mantém o sentido lexical direto de ἀδελφοί e não resolve no texto a discussão histórica sobre o grau exato de parentesco.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pois” conserva a relação explicativa; “criam” é natural e mantém o aspecto do imperfeito grego. A colocação “irmãos dele” reduz a possível ambiguidade de “seus irmãos” no português.
