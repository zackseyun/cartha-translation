  text: τοῦτο δὲ εἶπεν περὶ τοῦ πνεύματος ⸀οὗ ἔμελλον λαμβάνειν οἱ ⸀πιστεύσαντες εἰς αὐτόν· οὔπω γὰρ ἦν ⸀πνεῦμα, ὅτι Ἰησοῦς ⸀οὐδέπω ἐδοξάσθη.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/039.yaml
  text: He said this about the Spirit[a], whom those who believed in him were about to receive; for the Spirit was not yet[b], because Jesus had not yet been glorified.
translation:
  language: pt
  text: Ele disse isso a respeito do Espírito, que os que haviam crido nele haveriam de receber; pois o Espírito ainda não era[a], porque Jesus ainda não havia sido glorificado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, explicitando o sentido provável: «o Espírito ainda não havia sido dado». O grego diz simplesmente «o Espírito ainda não era» e relaciona isso ao fato de Jesus ainda não ter sido glorificado.'
    reason: alternative_reading
lexical_decisions:
- source_word: πνεύματος / πνεῦμα
  choice: Espírito
  rationale: O contexto se refere ao Espírito divino que seria recebido pelos que cressem em Jesus. A inicial maiúscula identifica o referente sem acrescentar «Santo», adjetivo ausente do grego.
- source_word: οὗ
  choice: que
  rationale: O pronome relativo retoma «o Espírito». Em português, «que» é natural e não força uma distinção gramatical entre pessoa e coisa.
- source_word: ἔμελλον λαμβάνειν
  choice: haveriam de receber
  rationale: Preserva a orientação prospectiva de μέλλω com infinitivo a partir do ponto de vista da narrativa, em linguagem digna e corrente.
- source_word: πιστεύσαντες εἰς αὐτόν
  choice: os que nele cressem
  rationale: A formulação se integra naturalmente à referência prospectiva aos futuros receptores. «Crer nele» representa o uso joanino de πιστεύω εἰς sem acrescentar a ideia de mero assentimento intelectual.
- source_word: οὔπω γὰρ ἦν πνεῦμα
  choice: pois o Espírito ainda não era
  rationale: Traduz de perto a frase grega, deliberadamente breve e difícil, preservando sua tensão em vez de inserir «dado», palavra que não consta do texto.
- source_word: οὐδέπω ἐδοξάσθη
  choice: ainda não havia sido glorificado
  rationale: O mais-que-perfeito composto expressa naturalmente em português a relação temporal; «glorificado» conserva a terminologia característica de João.
theological_decisions:
- issue: Como traduzir οὔπω γὰρ ἦν πνεῦμα sem sugerir que o Espírito não existia antes da glorificação de Jesus.
  choice: 'Manter no texto a formulação tensa: «o Espírito ainda não era», com esclarecimento em nota.'
  alternative: «o Espírito ainda não havia sido dado»; «o Espírito ainda não estava presente»
  rationale: O grego não contém «dado» nem «presente». A nota oferece o sentido contextual provável sem apagar a formulação marcante do texto-fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe mantém a progressão explicativa do grego; a dificuldade teológica da oração sobre o Espírito é preservada no texto e esclarecida em nota.
