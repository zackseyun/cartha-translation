  text: σχίσμα οὖν ⸂ἐγένετο ἐν τῷ ὄχλῳ⸃ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/043.yaml
  text: So there was a division in the crowd because of him.
translation:
  language: pt
  text: Assim, houve uma divisão entre a multidão por causa dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: divisão
  rationale: O substantivo indica uma cisão entre pessoas; “divisão” é natural em português atual e preserva a ideia de ruptura dentro do grupo.
- source_word: οὖν
  choice: Assim
  rationale: A conjunção apresenta o resultado da discussão anterior. “Assim” mantém a conexão lógica sem lhe dar força excessivamente formal.
- source_word: ἐγένετο
  choice: houve
  rationale: Com σχίσμα como sujeito, γίνομαι expressa o surgimento de uma situação. “Houve” é a formulação portuguesa mais direta e idiomática.
- source_word: ἐν τῷ ὄχλῳ
  choice: entre a multidão
  rationale: ὄχλος designa a multidão reunida. “Entre a multidão” comunica que a divisão ocorreu no interior do grupo e soa natural em português.
- source_word: δι’ αὐτόν
  choice: por causa dele
  rationale: διά com acusativo indica causa. “Por causa dele” traduz diretamente essa relação e conserva o pronome do texto grego.
theological_decisions:
- issue: Referente de αὐτόν
  choice: “dele”, referindo-se a Jesus
  alternative: “por causa de Jesus”
  rationale: O contexto identifica Jesus como referente, mas o pronome é claro e natural em português; preservá-lo evita explicitação desnecessária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a concisão do grego e a ligação com o contexto anterior.
