  naturalness: O texto é claro, moderno e natural. «Estes lhes perguntaram» flui bem e conserva a mudança de sujeito. A explicitação «vocês» comunica de modo inequívoco o plural da pergunta em português contemporâneo.
  terminology: «Guardas» é adequado no contexto de agentes enviados para prender Jesus, sem especificar além do texto que seriam guardas do templo. «Chefes dos sacerdotes» representa adequadamente ἀρχιερεῖς como grupo de autoridades sacerdotais. Não há questão teológica ou de nomes próprios.
