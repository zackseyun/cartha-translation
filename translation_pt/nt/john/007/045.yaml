  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἦλθον οὖν οἱ ὑπηρέται πρὸς τοὺς ἀρχιερεῖς καὶ Φαρισαίους, καὶ εἶπον αὐτοῖς ἐκεῖνοι· Διὰ τί οὐκ ἠγάγετε αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/045.yaml
  text: So the officers came to the chief priests and Pharisees[a], and they said to them[b], “Why did you not bring him?”
translation:
  language: pt
  text: 'Então os guardas foram até os chefes dos sacerdotes e os fariseus, e estes lhes perguntaram: “Por que vocês não o trouxeram?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Expressa de modo natural a sequência e a consequência narrativa no contexto.
- source_word: ὑπηρέται
  choice: guardas
  rationale: No contexto, designa os agentes enviados pelas autoridades para prender Jesus; “guardas” comunica essa função sem acrescentar explicitamente “do templo”.
- source_word: ἀρχιερεῖς
  choice: chefes dos sacerdotes
  rationale: Designa coletivamente as principais autoridades sacerdotais e evita a impressão de haver vários sumos sacerdotes simultâneos.
- source_word: Φαρισαίους
  choice: fariseus
  rationale: Forma tradicional e corrente em português para o nome do grupo judaico.
- source_word: ἐκεῖνοι
  choice: estes
  rationale: Preserva o demonstrativo enfático do grego e retoma naturalmente os chefes dos sacerdotes e os fariseus.
- source_word: εἶπον
  choice: perguntaram
  rationale: Embora o verbo seja literalmente “disseram”, a fala introduzida é uma pergunta; “perguntaram” é natural e mantém a força comunicativa.
- source_word: Διὰ τί
  choice: Por que
  rationale: Equivalente interrogativo direto e idiomático.
- source_word: οὐκ ἠγάγετε αὐτόν
  choice: vocês não o trouxeram
  rationale: O aoristo é bem expresso pelo pretérito perfeito; “trouxeram” se ajusta à missão dos guardas de conduzir Jesus às autoridades.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O pronome “vocês” torna explícito o sujeito plural já marcado pela forma verbal grega. “Estes” conserva a referência enfática de ἐκεῖνοι sem produzir uma construção pesada.
