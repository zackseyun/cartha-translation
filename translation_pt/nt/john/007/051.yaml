  text: Μὴ ὁ νόμος ἡμῶν κρίνει τὸν ἄνθρωπον ἐὰν μὴ ἀκούσῃ ⸂πρῶτον παρ’ αὐτοῦ⸃ καὶ γνῷ τί ποιεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/051.yaml
  text: Our law does not judge a man unless it first hears from him and knows what he is doing[b][a], does it?
translation:
  language: pt
  text: Por acaso a nossa lei julga alguém sem primeiro ouvi-lo e saber o que ele está fazendo?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ
  choice: Por acaso ...?
  rationale: No início da pergunta, μή indica que se espera uma resposta negativa. Em português, «Por acaso...?» comunica naturalmente essa força retórica.
- source_word: ὁ νόμος ἡμῶν
  choice: a nossa lei
  rationale: Refere-se à norma jurídica da comunidade de Nicodemos. A forma minúscula evita restringir indevidamente a referência apenas ao Pentateuco.
- source_word: κρίνει
  choice: julga
  rationale: Preserva o sentido jurídico amplo de avaliar ou emitir juízo, sem introduzir o sentido mais forte de «condena».
- source_word: τὸν ἄνθρωπον
  choice: alguém
  rationale: O singular grego é genérico. «Alguém» mantém a referência individual de maneira natural e inclusiva no português contemporâneo, sem sugerir um homem específico.
- source_word: ἐὰν μὴ
  choice: sem
  rationale: Na estrutura interrogativa portuguesa, «sem primeiro...» expressa de modo claro e idiomático a condição negativa de ἐὰν μή.
- source_word: ἀκούσῃ πρῶτον παρ’ αὐτοῦ
  choice: primeiro ouvi-lo
  rationale: No contexto judicial, significa dar ao acusado a oportunidade de ser ouvido. A formulação é natural em português e conserva a prioridade indicada por πρῶτον.
- source_word: γνῷ
  choice: saber
  rationale: Expressa a obtenção de conhecimento dos fatos antes do julgamento, em paralelo natural com «ouvi-lo».
- source_word: τί ποιεῖ
  choice: o que ele está fazendo
  rationale: Conserva o aspecto presente de ποιεῖ, sem deslocá-lo para «o que fez».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica natural e ampla legibilidade brasileira. A pergunta retórica conserva a expectativa de resposta negativa. Não foram necessárias notas de rodapé, pois «alguém» comunica adequadamente o singular genérico e «ouvi-lo» é idiomático no contexto de procedimento legal.
