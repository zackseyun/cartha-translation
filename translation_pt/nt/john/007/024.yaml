  text: μὴ κρίνετε κατ’ ὄψιν, ἀλλὰ τὴν δικαίαν κρίσιν ⸀κρίνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/024.yaml
  text: Do not judge according to appearance[a], but judge with righteous judgment.
translation:
  language: pt
  text: Não julguem pelas aparências, mas julguem com justiça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ κρίνετε
  choice: Não julguem
  rationale: O imperativo presente com μή expressa aqui uma proibição. A formulação é direta e não força o sentido aspectual de “parem de julgar”.
- source_word: κατ’ ὄψιν
  choice: pelas aparências
  rationale: A expressão indica julgamento baseado no que se vê, na impressão exterior ou superficial. “Pelas aparências” é idiomático e claro em português.
- source_word: ἀλλὰ
  choice: mas
  rationale: Preserva o contraste enfático entre a maneira de julgar proibida e a ordenada.
- source_word: τὴν δικαίαν κρίσιν κρίνετε
  choice: julguem com justiça
  rationale: Evita a construção pouco natural “julguem o julgamento justo”, preservando o verbo repetido e o sentido ético-judicial de δικαίαν.
theological_decisions:
- issue: Sentido de δικαίαν no contexto ético-judicial
  choice: com justiça
  alternative: com julgamento justo; segundo a justiça
  rationale: “Com justiça” comunica tanto retidão moral quanto equidade judicial, sem restringir o termo à mera correção processual nem acrescentar uma doutrina específica.
translation_notes:
  register: Português moderno, claro e digno, com forma plural de alcance internacional e boa legibilidade brasileira. A repetição de “julgar” preserva o paralelismo retórico do grego; “pelas aparências” expressa naturalmente κατ’ ὄψιν.
