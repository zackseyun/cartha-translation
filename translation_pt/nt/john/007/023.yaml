  text: εἰ περιτομὴν ⸀λαμβάνει ἄνθρωπος ἐν σαββάτῳ ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως, ἐμοὶ χολᾶτε ὅτι ὅλον ἄνθρωπον ὑγιῆ ἐποίησα ἐν σαββάτῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/023.yaml
  text: If a man receives circumcision on the Sabbath so that the law of Moses may not be broken[c][b][a], are you angry with me because I made a whole man well on the Sabbath?
translation:
  language: pt
  text: Se um homem recebe a circuncisão no sábado para que a Lei de Moisés não seja violada[a], vocês se iram comigo porque tornei um homem inteiro saudável no sábado?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não seja desfeita” ou “não seja anulada”.
    reason: lexical_alternative
  - marker: b
    text: A expressão “um homem inteiro saudável” destaca o contraste entre circuncidar uma parte do corpo e restaurar o homem todo.
    reason: cross_reference
lexical_decisions:
- source_word: περιτομὴν λαμβάνει
  choice: recebe a circuncisão
  rationale: Reproduz de modo natural em português a expressão grega literalmente equivalente a “receber circuncisão”, sem convertê-la desnecessariamente em voz passiva.
- source_word: ἄνθρωπος
  choice: um homem
  rationale: Neste contexto, a referência é especificamente masculina, pois se trata de circuncisão.
- source_word: ἐν σαββάτῳ
  choice: no sábado
  rationale: É a forma idiomática e corrente de expressar o dativo temporal e a observância sabática em português.
- source_word: ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως
  choice: para que a Lei de Moisés não seja violada
  rationale: No contexto jurídico, λύω comunica a ideia de transgredir ou desrespeitar a lei. “Seja violada” é claro e preserva a possibilidade semântica de desfazer ou anular, indicada em nota.
- source_word: ἐμοὶ χολᾶτε
  choice: por que vocês estão irados comigo
  rationale: χολάω denota ira ou indignação. A formulação preserva a pergunta retórica e torna explícita em português a relação causal introduzida por ὅτι.
- source_word: ὅλον ἄνθρωπον
  choice: um homem inteiro
  rationale: Mantém a ênfase em ὅλον e o contraste entre a circuncisão de uma parte do corpo e a restauração do homem todo.
- source_word: ὑγιῆ ἐποίησα
  choice: eu ter deixado ... saudável
  rationale: Conserva a construção causativa “fazer saudável” em português natural e evita reduzir a expressão ao simples verbo “curar”, preservando a ligação retórica com “inteiro”.
theological_decisions:
- issue: Sentido da comparação entre circuncisão e cura no sábado
  choice: Jesus parte da circuncisão sabática aceita e argumenta em favor da legitimidade ainda maior de restaurar um homem inteiro no sábado.
  alternative: Jesus estaria apenas contrapondo, em termos gerais, a lei ritual à ação compassiva.
  rationale: 'A redação conserva o argumento do menor para o maior presente no texto: se a circuncisão pode ocorrer no sábado para manter a Lei de Moisés, tornar o homem todo saudável não justifica indignação. Não se introduz uma oposição doutrinária entre Jesus e a Lei.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Lei” foi grafada com inicial maiúscula por se referir especificamente à Lei de Moisés. A ordem da frase foi ajustada para soar natural, mantendo a ênfase grega em “um homem inteiro”.
