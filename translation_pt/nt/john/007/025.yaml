  text: Ἔλεγον οὖν τινες ἐκ τῶν Ἱεροσολυμιτῶν· Οὐχ οὗτός ἐστιν ὃν ζητοῦσιν ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/025.yaml
  text: So some of the people of Jerusalem were saying[a], “Is this not the man they are seeking to kill?”
translation:
  language: pt
  text: 'Então alguns moradores de Jerusalém diziam: “Não é este o homem que procuram matar?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγον
  choice: diziam
  rationale: O imperfeito indica fala em andamento ou repetida; em português, o pretérito imperfeito preserva naturalmente esse aspecto.
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e lógica do contexto anterior de modo natural no português moderno.
- source_word: τινες ἐκ τῶν Ἱεροσολυμιτῶν
  choice: alguns moradores de Jerusalém
  rationale: Expressa de forma clara e idiomática um grupo indeterminado dentre os habitantes de Jerusalém, preservando a força partitiva de ἐκ.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Não é este o homem
  rationale: Mantém a pergunta retórica que espera resposta afirmativa; “o homem” é explicitado em português para uma construção natural.
- source_word: ζητοῦσιν
  choice: procuram
  rationale: O presente retrata a intenção ainda vigente; “procuram matar” é corrente e conserva a construção com infinitivo.
- source_word: ἀποκτεῖναι
  choice: matar
  rationale: É o sentido direto do infinitivo, sem acrescentar a possível conotação judicial de “condenar à morte”.
