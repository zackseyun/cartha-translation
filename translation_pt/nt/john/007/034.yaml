  text: ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/034.yaml
  text: You will seek me and will not find me[a], and where I am[b], you are not able to come.
translation:
  language: pt
  text: Vocês me procurarão e não me encontrarão; aonde eu estou, vocês não podem vir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητήσετέ με
  choice: vocês me procurarão
  rationale: O futuro ativo indica que os ouvintes procurarão Jesus. “Procurar” é natural em português e se ajusta ao contexto de tentar encontrá-lo, sem acrescentar uma conotação espiritual ausente do verbo isoladamente.
- source_word: οὐχ εὑρήσετε
  choice: não me encontrarão
  rationale: Reproduz diretamente a negação e o futuro do verbo, sem acrescentar ênfase que o grego não expressa.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: onde eu estou
  rationale: Mantém a expressão locativa e o pronome explícito, preservando o contraste entre “eu” e “vocês”.
- source_word: ὑμεῖς οὐ δύνασθε ἐλθεῖν
  choice: vocês não podem ir
  rationale: 'δύνασθε expressa capacidade ou possibilidade, portanto “não podem” comunica incapacidade, não proibição. Embora ἐλθεῖν corresponda normalmente a “vir”, em português o ponto de vista locativo torna “ir” mais natural nesta frase: os ouvintes não podem chegar ao lugar onde Jesus está.'
theological_decisions:
- issue: Natureza da afirmação de que os ouvintes não podem ir aonde Jesus está
  choice: Expressar incapacidade sem definir sua causa
  alternative: “vocês não têm permissão para ir”, que sugeriria proibição
  rationale: O grego usa δύνασθε e indica incapacidade ou impossibilidade. O versículo não esclarece se ela é moral, espiritual, judicial ou temporária; a tradução não resolve essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para explicitar o plural de ὑμεῖς. O ponto e vírgula separa com clareza as duas afirmações coordenadas.
