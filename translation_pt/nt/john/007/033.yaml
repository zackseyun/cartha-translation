source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἔτι ⸂χρόνον μικρὸν⸃ μεθ’ ὑμῶν εἰμι καὶ ὑπάγω πρὸς τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/033.yaml
  text: So Jesus said[a], “I am with you a little while longer[b], and I am going to the one who sent me.”
translation:
  language: pt
  text: 'Então Jesus disse: “Estou com vocês ainda por pouco tempo[a] e vou para aquele que me enviou[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “por mais um pouco de tempo”.'
    reason: lexical_alternative
  - marker: b
    text: No contexto mais amplo de João, “aquele que me enviou” se refere ao Pai.
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e lógica em relação ao episódio anterior, de modo natural em português, sem tornar a inferência mais enfática do que o contexto exige.
- source_word: Ἔτι χρόνον μικρόν
  choice: ainda por pouco tempo
  rationale: Conserva tanto a ideia de continuidade expressa por ἔτι quanto a curta duração de χρόνον μικρόν. A colocação após “com vocês” produz uma frase corrente em português.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: Estou com vocês
  rationale: Mantém o presente de εἰμι e comunica diretamente a presença continuada de Jesus junto aos ouvintes.
- source_word: καὶ ὑπάγω
  choice: e vou
  rationale: Traduz com simplicidade o presente ὑπάγω, que em João pode indicar partida e destino. Não se acrescenta “depois”, pois a palavra não aparece explicitamente no grego.
- source_word: πρὸς τὸν πέμψαντά με
  choice: para aquele que me enviou
  rationale: Preserva o particípio substantivado e a formulação relacional do original sem explicitar no texto principal quem é o referente.
theological_decisions:
- issue: Identificação de “aquele que me enviou”
  choice: Manter a expressão indireta “aquele que me enviou” no texto principal.
  alternative: “para o Pai, que me enviou”
  rationale: No contexto mais amplo de João, o referente é o Pai, mas este versículo não o nomeia. A tradução conserva a forma e a tensão do original, deixando a identificação contextual para a nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O presente “estou” e a expressão simples “vou” mantêm a proximidade verbal do grego; as notas esclarecem uma alternativa lexical e o referente contextual sem inseri-los no texto principal.
