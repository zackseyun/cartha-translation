base_translation:
  language: en
  yaml_path: translation/nt/john/007/008.yaml
  text: You go up to the feast[a]. I am not going up to this feast[b], because my time has not yet come to fulfillment.
translation:
  language: pt
  text: Vocês, subam para a festa. Eu não vou subir[a] para esta festa, porque o meu tempo[b] ainda não se cumpriu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “Eu ainda não vou subir para esta festa”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “porque o meu tempo determinado ainda não se cumpriu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάβητε
  choice: subam
  rationale: Preserva a ideia de subir a Jerusalém no contexto da peregrinação, com formulação natural em português.
- source_word: ἑορτή
  choice: festa
  rationale: Termo corrente e digno para a celebração religiosa judaica no contexto joanino.
- source_word: οὐκ ἀναβαίνω
  choice: não vou subir
  rationale: Expressa naturalmente em português a ação imediata ou futura indicada pelo presente grego e segue a leitura οὐκ, sem introduzir 'ainda' no texto principal.
- source_word: ταύτην
  choice: esta
  rationale: Mantém a referência demonstrativa à festa específica em discussão.
- source_word: καιρός
  choice: tempo
  rationale: É conciso e natural, preservando sem explicitação excessiva a possível noção de tempo determinado.
- source_word: πεπλήρωται
  choice: se cumpriu
  rationale: Conserva a ideia de cumprimento ou plenitude do perfeito passivo de πληρόω, em expressão idiomática portuguesa.
theological_decisions:
- issue: Variante textual na declaração de Jesus sobre subir à festa
  choice: 'Seguir no texto principal a leitura SBLGNT οὐκ: ''não vou subir para esta festa''.'
  alternative: 'οὔπω: ''ainda não vou subir para esta festa''.'
  rationale: A fonte indicada traz οὐκ; a variante significativa é registrada em nota, sem harmonizar a tensão com a ida posterior de Jesus.
- issue: Sentido de καιρός
  choice: meu tempo
  alternative: meu tempo determinado
  rationale: A tradução principal preserva a concisão e a abertura semântica do grego; a possibilidade de um tempo designado é apresentada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O plural 'vocês' torna explícito ὑμεῖς; 'subam' conserva a direção da viagem a Jerusalém. As notas mantêm a transparência textual e lexical.
