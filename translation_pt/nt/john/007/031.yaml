id: JHN.7.31
reference: John 7:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂ἐκ τοῦ ὄχλου δὲ πολλοὶ⸃ ἐπίστευσαν εἰς αὐτόν, καὶ ⸀ἔλεγον· Ὁ χριστὸς ὅταν ἔλθῃ ⸀μὴ πλείονα ⸀σημεῖα ποιήσει ὧν οὗτος ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/031.yaml
  text: But many from the crowd believed in him[a], and they were saying, “When the Messiah comes, he will not do more signs than this man has done, will he?”
translation:
  language: pt
  text: 'Mas muitos dentre a multidão creram nele e diziam: “Quando o Messias[a] vier, por acaso fará mais sinais do que este homem fez?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Cristo”. O título grego Χριστός é traduzido aqui por “Messias” porque aparece como título em um contexto messiânico judaico.
    reason: Leitura alternativa do título grego.
lexical_decisions:
- source_word: ἐκ τοῦ ὄχλου δὲ πολλοὶ
  choice: Mas muitos dentre a multidão
  rationale: “Dentre a multidão” preserva o sentido partitivo, enquanto “mas” expressa o contraste leve de δέ com a incredulidade e a controvérsia do contexto.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: creram nele
  rationale: A formulação natural preserva a fé dirigida pessoalmente a Jesus sem ampliar o sentido com uma paráfrase interpretativa.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito indica fala em andamento ou repetida; “diziam” reproduz naturalmente esse aspecto em português.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Aqui Χριστός funciona claramente como título da esperança messiânica judaica, e não como nome próprio.
- source_word: ὅταν ἔλθῃ
  choice: Quando ... vier
  rationale: ὅταν com o subjuntivo aoristo aponta para uma eventualidade futura, expressa de modo idiomático pelo futuro do subjuntivo em português.
- source_word: μὴ πλείονα σημεῖα ποιήσει
  choice: por acaso fará mais sinais
  rationale: “Por acaso” sinaliza que a pergunta retórica espera resposta negativa, sem transformar a fala numa afirmação categórica. “Mais” preserva a comparação de quantidade de πλείονα.
- source_word: σημεῖα
  choice: sinais
  rationale: “Sinais” conserva a terminologia característica de João e sua dimensão reveladora, em vez de reduzi-la simplesmente a “milagres”.
- source_word: ὧν οὗτος ἐποίησεν
  choice: do que este homem fez
  rationale: “Este homem” é uma referência pública e coloquial natural a Jesus; “fez” traduz adequadamente o aoristo na comparação.
theological_decisions:
- issue: Tradução de Χριστός como título
  choice: Messias
  alternative: Cristo
  rationale: O contexto — “quando ... vier” — apresenta o termo como título messiânico judaico. A alternativa formal “Cristo” é mantida em nota.
- issue: Força da pergunta com μή
  choice: Pergunta retórica marcada por “por acaso”, com expectativa de resposta negativa
  alternative: Pergunta futura neutra
  rationale: μή normalmente indica que se espera uma resposta negativa. A redação conserva essa força sem resolver além do texto o grau ou a natureza da fé da multidão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “por acaso” mantém de forma natural a expectativa negativa da pergunta retórica; “dentre a multidão” preserva o valor partitivo sem soar excessivamente técnico.
