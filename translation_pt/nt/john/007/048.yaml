source:
  edition: SBLGNT
  text: μή τις ἐκ τῶν ἀρχόντων ἐπίστευσεν εἰς αὐτὸν ἢ ἐκ τῶν Φαρισαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/048.yaml
  text: Has any one of the rulers or of the Pharisees believed in him?[a]
translation:
  language: pt
  text: Por acaso algum dos líderes ou dos fariseus creu nele?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No grego, a pergunta é formulada de modo a esperar a resposta “não”.
    reason: Explicar a força da partícula interrogativa μή, que não pode ser reproduzida integralmente sem tornar explícita demais a resposta esperada.
lexical_decisions:
- source_word: μή τις
  choice: Por acaso algum
  rationale: Mantém a forma interrogativa e, em português natural, sugere a expectativa de resposta negativa sem transformar a pergunta em negação explícita.
- source_word: ἐκ τῶν ἀρχόντων
  choice: dos líderes
  rationale: No contexto, refere-se aos integrantes das autoridades dirigentes judaicas. “Líderes” é claro e corrente; evita a possível conotação monárquica de “governantes”.
- source_word: ἐπίστευσεν
  choice: creu
  rationale: Reproduz o aoristo com passado simples e mantém a terminologia joanina tradicional de fé de modo conciso.
- source_word: εἰς αὐτόν
  choice: nele
  rationale: É a expressão idiomática portuguesa para πιστεύω εἰς, preservando o sentido de crer em alguém.
- source_word: ἢ
  choice: ou
  rationale: Conserva a coordenação simples do grego sem acrescentar ênfase interpretativa.
- source_word: ἐκ τῶν Φαρισαίων
  choice: dos fariseus
  rationale: Expressa pertencimento ao grupo e mantém o paralelismo com “dos líderes”.
theological_decisions:
- issue: Força retórica da pergunta negativa
  choice: Manter uma pergunta retórica que pressupõe resposta negativa
  alternative: É claro que nenhum dos líderes ou dos fariseus creu nele.
  rationale: μή τις indica que os falantes esperam “não” como resposta, mas o texto permanece formalmente uma pergunta. A tradução conserva tanto a forma quanto a retórica desdenhosa, sem converter a implicação em afirmação explícita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Por acaso” comunica naturalmente a orientação negativa da pergunta; “líderes” é compreensível sem perder o sentido institucional do contexto.
