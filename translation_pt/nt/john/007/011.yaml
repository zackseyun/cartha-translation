source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι ἐζήτουν αὐτὸν ἐν τῇ ἑορτῇ καὶ ἔλεγον· Ποῦ ἐστιν ἐκεῖνος;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/011.yaml
  text: So the Jews were looking for him at the feast and were saying[a], “Where is that one?”
translation:
  language: pt
  text: 'Então, os judeus[a] o procuravam durante a festa e perguntavam: “Onde está aquele?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os judeus da Judeia”; no contexto narrativo de João, o termo pode referir-se mais especificamente às autoridades judaicas da Judeia.
    reason: Preservar a amplitude contextual de Ἰουδαῖοι e evitar que o texto principal resolva uma ambiguidade genuína.
lexical_decisions:
- source_word: οὖν
  choice: Assim
  rationale: Marca a continuação e a consequência narrativa do contexto anterior de modo natural em português.
- source_word: Ἰουδαῖοι
  choice: os judeus
  rationale: Mantém o sentido lexical amplo sem restringir explicitamente o referente às autoridades; a possível nuance contextual é registrada em nota.
- source_word: ἐζήτουν
  choice: o procuravam
  rationale: O imperfeito indica uma ação em andamento; a construção portuguesa preserva esse aspecto sem ficar artificial.
- source_word: ἐν τῇ ἑορτῇ
  choice: durante a festa
  rationale: Expressa com clareza tanto o contexto do evento quanto seu enquadramento temporal.
- source_word: ἔλεγον
  choice: perguntavam
  rationale: No contexto, o verbo introduz repetidamente uma pergunta direta; 'perguntavam' é idiomático e preserva o aspecto imperfeito.
- source_word: ἐκεῖνος
  choice: aquele homem
  rationale: Conserva a força demonstrativa e certa distância de ἐκεῖνος em português natural, sem reduzi-lo ao simples pronome 'ele'.
theological_decisions:
- issue: Referente de Ἰουδαῖοι no Evangelho de João
  choice: os judeus no texto principal
  alternative: os judeus da Judeia; as autoridades judaicas
  rationale: O versículo não restringe expressamente o grupo. A tradução principal preserva a amplitude lexical, enquanto a nota informa as possibilidades contextuais sem impor uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação dos dois imperfeitos foi vertida de modo idiomático, mantendo a ideia de ações em andamento.
