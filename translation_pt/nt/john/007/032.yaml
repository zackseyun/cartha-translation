reference: John 7:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἤκουσαν οἱ Φαρισαῖοι τοῦ ὄχλου γογγύζοντος περὶ αὐτοῦ ταῦτα, καὶ ἀπέστειλαν ⸂οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ὑπηρέτας⸃ ἵνα πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/032.yaml
  text: The Pharisees heard the crowd muttering these things about him[c][b][a], and the chief priests and the Pharisees sent officers to seize him.
translation:
  language: pt
  text: Os fariseus ouviram a multidão murmurando essas coisas a respeito dele[a], e os principais sacerdotes e os fariseus enviaram guardas[b] para prendê-lo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “comentando em voz baixa” ou “resmungando”. O grego sugere fala contida, possivelmente descontente.
    reason: lexical_alternative
  - marker: b
    text: Ou “oficiais”, “servidores” ou “guardas do templo”. O termo grego se refere a agentes oficiais enviados pelas autoridades judaicas.
    reason: lexical_alternative
  - marker: c
    text: Mais literalmente, “para agarrá-lo” ou “para capturá-lo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: ouviram
  rationale: O aoristo de ἀκούω indica que os fariseus tomaram conhecimento do que a multidão dizia; “ouviram” é natural e fiel.
- source_word: τοῦ ὄχλου
  choice: a multidão
  rationale: ὄχλος designa o conjunto de pessoas reunidas; “multidão” é claro e corrente em português.
- source_word: γογγύζοντος
  choice: murmurando
  rationale: O particípio sugere fala baixa e possivelmente descontente. “Murmurando” preserva tanto o tom abafado quanto a possível conotação negativa, sem torná-la absoluta.
- source_word: περὶ αὐτοῦ ταῦτα
  choice: essas coisas a respeito dele
  rationale: Mantém o demonstrativo neutro plural ταῦτα e traduz περί com genitivo de modo claro e natural.
- source_word: οἱ ἀρχιερεῖς
  choice: os principais sacerdotes
  rationale: O plural refere-se à liderança sacerdotal, não a vários ocupantes simultâneos do cargo singular de sumo sacerdote.
- source_word: ἀπέστειλαν
  choice: enviaram
  rationale: Equivalente direto e idiomático do aoristo de ἀποστέλλω.
- source_word: ὑπηρέτας
  choice: guardas
  rationale: No contexto joanino, eram agentes oficiais subordinados às autoridades judaicas. “Guardas” comunica sua função de modo mais imediato ao leitor comum do que “oficiais”, sem especificar além do contexto.
- source_word: ἵνα πιάσωσιν αὐτόν
  choice: para prendê-lo
  rationale: A construção com ἵνα expressa propósito, e πιάζω indica agarrar ou capturar. No contexto de uma ação oficial, “prendê-lo” é natural; a tradução mais literal consta em nota.
theological_decisions:
- issue: Identidade institucional de ὑπηρέτας
  choice: guardas enviados pelas autoridades sacerdotais e farisaicas
  alternative: oficiais, servidores ou guardas do templo
  rationale: O texto apresenta agentes encarregados oficialmente de capturar Jesus, mas não explicita no próprio termo sua estrutura institucional exata. “Guardas” preserva a função sem afirmar mais do que o contexto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase segue de perto o grego sem sacrificar a naturalidade. As notas preservam a amplitude semântica de γογγύζω, ὑπηρέτης e πιάζω.
