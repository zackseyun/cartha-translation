id: JHN.7.49
reference: John 7:49
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ ὁ ὄχλος οὗτος ὁ μὴ γινώσκων τὸν νόμον ⸀ἐπάρατοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/049.yaml
  text: But this crowd[a], which does not know the law[b], is accursed.
translation:
  language: pt
  text: Mas esta multidão, que não conhece a Lei[a], é amaldiçoada.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A Lei” se refere à Lei judaica, isto é, à Torá.
    reason: cultural_note
  - marker: b
    text: 'Ou: “está sob maldição”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Conjunção adversativa que contrasta esta afirmação com a fala anterior; “Mas” é natural e preserva a oposição.
- source_word: ὁ ὄχλος οὗτος
  choice: esta multidão
  rationale: ὄχλος designa uma multidão ou aglomeração de pessoas. “Multidão” é corrente e não acrescenta a conotação pejorativa mais forte de “turba”.
- source_word: ὁ μὴ γινώσκων
  choice: que não conhece
  rationale: O particípio presente atributivo caracteriza a multidão por sua alegada falta de conhecimento, preservando o sentido de estado contínuo.
- source_word: τὸν νόμον
  choice: a Lei
  rationale: No contexto, νόμος se refere à Lei judaica, isto é, à Torá. A inicial maiúscula ajuda a indicar esse referente específico sem ampliar o texto.
- source_word: ἐπάρατοί
  choice: amaldiçoada
  rationale: 'O adjetivo exprime uma condenação forte: “amaldiçoada” é claro, atual e mantém a força da denúncia.'
- source_word: εἰσιν
  choice: é
  rationale: Embora o verbo grego esteja no plural por referência às pessoas da multidão, em português “multidão” normalmente rege o singular; “é amaldiçoada” é a concordância mais natural.
theological_decisions:
- issue: Se a condenação dos fariseus deve ser apresentada como afirmação teológica do narrador
  choice: Manter sem atenuação a denúncia dentro da fala direta dos opositores de Jesus.
  alternative: Acrescentar uma fórmula de distanciamento, como “eles dizem que esta multidão é amaldiçoada”.
  rationale: O grego registra diretamente a fala hostil. A tradução deve preservar sua dureza sem endossá-la como juízo do narrador nem inserir palavras de distanciamento ausentes do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Multidão” evita uma carga pejorativa não exigida pelo grego; a frase mantém o tom severo dos próprios falantes.
