  text: ἀπεκρίθησαν οὖν αὐτοῖς οἱ Φαρισαῖοι· Μὴ καὶ ὑμεῖς πεπλάνησθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/047.yaml
  text: So the Pharisees answered them[a], “Have you also been led astray?”
translation:
  language: pt
  text: 'Então os fariseus lhes responderam: “Será que vocês também foram enganados[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram desencaminhados”. O verbo pode indicar tanto ser enganado quanto ser levado ao erro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: responderam
  rationale: Verbo narrativo padrão para introduzir uma resposta em diálogo; é natural e fiel ao contexto.
- source_word: οὖν
  choice: Então
  rationale: Marca a progressão consequencial do diálogo em português corrente, sem a formalidade excessiva de “portanto”.
- source_word: αὐτοῖς
  choice: lhes
  rationale: 'Expressa de modo conciso e natural o objeto indireto dativo: os fariseus responderam aos guardas.'
- source_word: οἱ Φαρισαῖοι
  choice: os fariseus
  rationale: Designação tradicional e amplamente compreendida do grupo judaico, preservando o artigo.
- source_word: Μὴ καὶ ὑμεῖς
  choice: Será que vocês também
  rationale: “Será que” comunica em português a pergunta retórica introduzida por μή, que espera resposta negativa, enquanto “também” preserva καί e o destaque de ὑμεῖς.
- source_word: πεπλάνησθε
  choice: foram enganados
  rationale: O perfeito passivo de πλανάω indica que eles teriam sido induzidos ao erro e permaneciam sob esse efeito. “Foram enganados” é natural e claro; a nota registra a alternativa que ressalta o desvio.
theological_decisions:
- issue: Força retórica da pergunta com μή
  choice: “Será que vocês também foram enganados?”
  alternative: “Vocês também não foram enganados, foram?”
  rationale: A formulação escolhida conserva a expectativa de resposta negativa e o tom de incredulidade dos fariseus sem acrescentar uma expressão enfática ausente do texto.
- issue: Nuance de πεπλάνησθε
  choice: “foram enganados”
  alternative: “foram desencaminhados”
  rationale: O contexto envolve indução ao erro. A tradução principal privilegia clareza corrente, enquanto a nota preserva a nuance possível de ser levado para fora do caminho correto, sem impor uma interpretação moral ou doutrinária mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa e sintaxe natural ao público brasileiro. A pergunta mantém o tom retórico e desdenhoso sem o intensificar por paráfrase.
