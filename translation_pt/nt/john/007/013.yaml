  text: οὐδεὶς μέντοι παρρησίᾳ ἐλάλει περὶ αὐτοῦ διὰ τὸν φόβον τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/013.yaml
  text: Yet no one was speaking openly about him for fear of the Jews[a].
translation:
  language: pt
  text: No entanto, ninguém falava abertamente a respeito dele por medo dos judeus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente neste contexto, “dos líderes judeus” ou “das autoridades da Judeia”. Em João, “os judeus” pode referir-se ao povo judeu em geral ou, em algumas passagens, às autoridades sediadas em Jerusalém que se opunham a Jesus.
    reason: Leitura contextual alternativa e esclarecimento histórico para evitar que o termo seja indevidamente generalizado.
lexical_decisions:
- source_word: οὐδεὶς
  choice: ninguém
  rationale: Pronome negativo abrangente, natural e direto em português.
- source_word: μέντοι
  choice: no entanto
  rationale: Expressa o contraste moderado com as opiniões divergentes mencionadas no contexto anterior.
- source_word: παρρησίᾳ
  choice: abertamente
  rationale: Neste contexto, indica fala franca e pública, sem ocultação.
- source_word: ἐλάλει
  choice: falava
  rationale: O pretérito imperfeito preserva o aspecto contínuo ou habitual do imperfeito grego.
- source_word: περὶ αὐτοῦ
  choice: a respeito dele
  rationale: Equivalente idiomático de περί com o genitivo, em registro claro e digno.
- source_word: διὰ τὸν φόβον
  choice: por medo
  rationale: Preserva de modo natural a construção causal nominal do grego.
- source_word: τῶν Ἰουδαίων
  choice: dos judeus
  rationale: Mantém no texto principal a forma lexical ampla do grego, enquanto a nota esclarece o provável referente contextual.
theological_decisions:
- issue: Referente de τῶν Ἰουδαίων na narrativa joanina
  choice: Manter “dos judeus” no texto principal, com nota explicativa.
  alternative: “dos líderes judeus” ou “das autoridades da Judeia”
  rationale: A tradução direta preserva a amplitude e a tensão do termo grego; a nota registra que, neste contexto, o referente pode ser mais especificamente as autoridades judaicas ligadas a Jerusalém, evitando uma generalização indevida.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O pretérito imperfeito comunica a ação contínua, e “no entanto” mantém o contraste discursivo sem elevar excessivamente o registro.
