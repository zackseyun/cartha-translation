id: JHN.7.40
reference: John 7:40
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂Ἐκ τοῦ ὄχλου οὖν⸃ ἀκούσαντες ⸂τῶν λόγων τούτων⸃ ⸀ἔλεγον· Οὗτός ἐστιν ἀληθῶς ὁ προφήτης·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/040.yaml
  text: Therefore[a], some from the crowd, when they heard these words, were saying, “This truly is the Prophet.”
translation:
  language: pt
  text: 'Assim, alguns da multidão, ao ouvirem essas palavras, diziam: “Este é verdadeiramente o Profeta[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O Profeta” provavelmente se refere ao profeta semelhante a Moisés que era esperado (veja Deuteronômio 18:15), embora alguns intérpretes entendam a expressão de modo mais geral, como “o profeta”.
    reason: Referência cruzada e preservação de ambiguidade interpretativa.
lexical_decisions:
- source_word: Ἐκ τοῦ ὄχλου
  choice: alguns da multidão
  rationale: 'Explicita com naturalidade o sentido partitivo: apenas uma parte da multidão se manifestava.'
- source_word: οὖν
  choice: Assim
  rationale: Mantém a conexão lógica e narrativa com as palavras anteriores de Jesus, sem a rigidez que “portanto” poderia ter neste contexto.
- source_word: ἀκούσαντες
  choice: ao ouvirem
  rationale: Expressa de modo idiomático a relação temporal do particípio aoristo com o verbo principal.
- source_word: τῶν λόγων τούτων
  choice: essas palavras
  rationale: Refere-se diretamente às palavras que Jesus acabara de pronunciar; “palavras” é claro e natural.
- source_word: ἔλεγον
  choice: diziam
  rationale: O pretérito imperfeito preserva o aspecto contínuo ou reiterado do verbo grego.
- source_word: Οὗτός ἐστιν
  choice: Este é
  rationale: Conserva a força demonstrativa e imediata da identificação de Jesus.
- source_word: ἀληθῶς
  choice: verdadeiramente
  rationale: Preserva a ênfase solene da afirmação, sem recorrer a uma formulação excessivamente coloquial.
- source_word: ὁ προφήτης
  choice: o Profeta
  rationale: A maiúscula sinaliza o provável uso como título para a figura profética esperada, sem identificar explicitamente essa figura com o Messias.
theological_decisions:
- issue: Identidade indicada por “o Profeta”
  choice: Traduzir como expressão titular, “o Profeta”, sem equipará-la explicitamente ao Messias no texto principal.
  alternative: Entender “o profeta” genericamente, ou considerar “o Profeta” plenamente sinônimo de “o Messias”.
  rationale: No contexto joanino, a expressão provavelmente alude ao profeta semelhante a Moisés esperado com base em Deuteronômio 18:15, mas o versículo não define sua relação exata com o Messias. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Assim” cria uma transição natural; “ao ouvirem” e “diziam” preservam as relações temporal e aspectual do grego. A pontuação segue o uso editorial corrente em português.
