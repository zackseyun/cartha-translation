  text: ἄλλοι ἔλεγον· Οὗτός ἐστιν ὁ χριστός· ⸂οἱ δὲ⸃ ἔλεγον· Μὴ γὰρ ἐκ τῆς Γαλιλαίας ὁ χριστὸς ἔρχεται;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/041.yaml
  text: Others were saying[a], “This is the Messiah.” But some were saying, “Surely the Messiah does not come from Galilee[b], does he?”
translation:
  language: pt
  text: 'Outros diziam: “Este é o Messias”. Mas alguns diziam: “Por acaso o Messias vem da Galileia?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι
  choice: Outros
  rationale: O adjetivo substantivado plural distingue um grupo no meio da multidão e é expresso naturalmente por “Outros”.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito indica fala contínua ou repetida entre os grupos; “diziam” preserva esse aspecto com naturalidade.
- source_word: Οὗτός ἐστιν
  choice: Este é
  rationale: Forma idiomática e direta de identificação demonstrativa em português.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Χριστός funciona aqui como título do esperado ungido, não como nome próprio; “Messias” preserva o contexto judaico da discussão.
- source_word: οἱ δὲ
  choice: Mas alguns
  rationale: O artigo substantivado com δέ introduz outro grupo em contraste; “Mas alguns” evita repetição pesada sem apagar a oposição.
- source_word: Μὴ γὰρ
  choice: Por acaso ...?
  rationale: A construção introduz uma pergunta retórica que espera resposta negativa. “Por acaso” comunica em português a incredulidade e a expectativa negativa sem acrescentar uma resposta explícita.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: da Galileia
  rationale: ἐκ indica origem; na construção portuguesa com “vir”, “vem da Galileia” é natural e fiel.
- source_word: ἔρχεται
  choice: vem
  rationale: O presente expressa uma expectativa geral sobre a origem do Messias; o presente simples em português reproduz esse valor.
theological_decisions:
- issue: Tradução de Χριστός como título
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, a multidão debate a identidade do esperado ungido. “Messias” torna explícito o valor titular de Χριστός sem tratá-lo como nome próprio.
- issue: Força da pergunta com μή γάρ
  choice: Por acaso o Messias vem da Galileia?
  alternative: O Messias não vem da Galileia, vem?
  rationale: A forma escolhida conserva a pergunta que pressupõe resposta negativa e soa natural em português amplo. Evita transformar a pressuposição dos falantes numa afirmação categórica do narrador.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o contraste entre os dois grupos e a força retórica da pergunta sem explicitar além do grego.
