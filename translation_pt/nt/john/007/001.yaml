source:
  edition: SBLGNT
  text: Καὶ ⸂μετὰ ταῦτα περιεπάτει ὁ Ἰησοῦς⸃ ἐν τῇ Γαλιλαίᾳ, οὐ γὰρ ἤθελεν ἐν τῇ Ἰουδαίᾳ περιπατεῖν, ὅτι ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/001.yaml
  text: And after these things Jesus was walking in Galilee[a], for he did not want to walk in Judea, because the Jews were seeking to kill him.
translation:
  language: pt
  text: E, depois dessas coisas, Jesus percorria a Galileia, pois não queria percorrer a Judeia, porque os judeus[a] procuravam matá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os judeus da Judeia” ou “os líderes judeus”. Em João, “os judeus” muitas vezes se refere mais especificamente às autoridades judaicas da Judeia ou aos opositores presentes no contexto narrativo, e não ao povo judeu como um todo.
    reason: Alternativa lexical e esclarecimento do referente narrativo de οἱ Ἰουδαῖοι.
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: depois dessas coisas
  rationale: Preserva o demonstrativo plural e a ligação narrativa característica de João, mantendo uma formulação compreensível em português atual.
- source_word: περιεπάτει / περιπατεῖν
  choice: percorria / percorrer
  rationale: O imperfeito indica atividade contínua. “Percorrer” exprime naturalmente o movimento dentro de uma região e conserva a repetição lexical do verbo grego nas duas ocorrências.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: a Galileia
  rationale: Com “percorrer”, o objeto direto é idiomático em português e comunica o sentido locativo sem ampliar indevidamente o alcance da atividade.
- source_word: οὐ γὰρ ἤθελεν
  choice: pois não queria
  rationale: “Pois” preserva o caráter explicativo de γάρ, e “não queria” expressa a vontade, sem sugerir incapacidade.
- source_word: ἐν τῇ Ἰουδαίᾳ περιπατεῖν
  choice: percorrer a Judeia
  rationale: Repete o mesmo verbo usado na primeira oração, refletindo a repetição de περιπατέω no texto grego.
- source_word: ὅτι
  choice: porque
  rationale: Introduz com clareza a causa pela qual Jesus evitava a Judeia.
- source_word: ἐζήτουν
  choice: procuravam
  rationale: O imperfeito apresenta uma intenção hostil contínua; o infinitivo seguinte explicita o objetivo dessa busca.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Mantém a forma lexical do grego no texto principal, enquanto a nota esclarece o referente narrativo contextual para evitar uma generalização étnica indevida.
- source_word: ἀποκτεῖναι
  choice: matá-lo
  rationale: Tradução direta, natural e atual do infinitivo com seu objeto.
theological_decisions:
- issue: Referente de οἱ Ἰουδαῖοι no Evangelho de João
  choice: Manter “os judeus” no texto principal com nota contextual.
  alternative: “os judeus da Judeia” ou “os líderes judeus”
  rationale: A opção preserva a expressão grega e sua ambiguidade lexical, mas a nota deixa claro que, neste contexto, ela aponta para a oposição judaica da Judeia, especialmente suas autoridades, e não para todo o povo judeu.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Percorria” evita o literalismo pouco natural de “andava em” e preserva a repetição verbal do original. A construção mantém as duas relações causais marcadas por γάρ e ὅτι.
