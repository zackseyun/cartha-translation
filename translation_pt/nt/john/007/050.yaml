  text: λέγει Νικόδημος πρὸς αὐτούς, ὁ ⸀ἐλθὼν πρὸς αὐτὸν ⸀πρότερον, εἷς ὢν ἐξ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/050.yaml
  text: Nicodemus[a], the one who had come to him earlier, being one of them, said to them,
translation:
  language: pt
  text: 'Nicodemos, aquele que antes tinha ido até ele e que era um deles, disse-lhes:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: disse
  rationale: Embora o grego empregue o presente histórico, o pretérito é mais natural na narrativa em português e preserva a função discursiva.
- source_word: Νικόδημος
  choice: Nicodemos
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: πρὸς αὐτούς
  choice: disse-lhes
  rationale: Com verbo de fala, πρός com acusativo indica os destinatários; o pronome átono expressa isso de modo natural e digno em português.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: aquele que antes tinha ido até ele
  rationale: A construção articulada com particípio identifica Nicodemos em aposição. O mais-que-perfeito composto assinala naturalmente a ação anterior, e “ele” conserva a referência pronominal do grego sem inserir explicitamente o nome de Jesus.
- source_word: εἷς ὢν ἐξ αὐτῶν
  choice: e que era um deles
  rationale: A oração relativa comunica com naturalidade a informação circunstancial e identificadora do particípio, sem lhe atribuir valor causal.
theological_decisions:
- issue: Referente de αὐτόν em ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: Manter “ele” no texto, com Jesus como referente contextual.
  alternative: Explicitar “Jesus” na tradução.
  rationale: João 3:1–2 identifica Nicodemos como aquele que foi até Jesus. Contudo, o versículo usa um pronome; mantê-lo preserva a forma e a leve ambiguidade do texto-fonte sem ocultar o referente indicado pelo contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem mantém Nicodemos seguido pelas informações apositivas antes do verbo principal; os dois relativos coordenados evitam o peso pouco natural de particípios literais. Os dois-pontos refletem que o versículo introduz a fala apresentada no versículo seguinte.
