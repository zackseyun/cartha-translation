  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς ἑαυτούς· Ποῦ οὗτος μέλλει πορεύεσθαι ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν; μὴ εἰς τὴν διασπορὰν τῶν Ἑλλήνων μέλλει πορεύεσθαι καὶ διδάσκειν τοὺς Ἕλληνας;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/035.yaml
  text: So the Jews said to one another, “Where is this man about to go, that we will not find him? He is not about to go to the dispersion among the Greeks and teach the Greeks, is he?”
translation:
  language: pt
  text: 'Então os judeus[a] disseram uns aos outros: “Para onde este homem pretende ir, de modo que não o encontremos? Não pretende ir para a Dispersão entre os gregos[b] e ensinar os gregos?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os habitantes da Judeia”. O termo grego pode designar os judeus em geral ou, em certos contextos, as pessoas da Judeia.
    reason: lexical_alternative
  - marker: b
    text: “A Dispersão entre os gregos” refere-se aos judeus espalhados entre populações gregas, não a uma dispersão formada por gregos.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: É o equivalente lexical mais direto neste contexto e não restringe indevidamente o grupo a líderes ou habitantes da Judeia; a alternativa possível é registrada em nota.
- source_word: πρὸς ἑαυτούς
  choice: uns aos outros
  rationale: Expressa naturalmente em português o sentido recíproco da conversa dentro do grupo.
- source_word: Ποῦ οὗτος
  choice: Aonde este homem
  rationale: Como há ideia de movimento com πορεύεσθαι, “aonde” é idiomático; “este homem” conserva o tom distanciador de οὗτος.
- source_word: μέλλει πορεύεσθαι
  choice: pretende ir
  rationale: No contexto de especulação sobre o destino de Jesus, transmite a força prospectiva de μέλλω sem sugerir necessariamente partida imediata.
- source_word: ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν
  choice: para que não o encontremos
  rationale: Torna natural em português a relação entre o lugar para onde ele iria e o resultado de não ser encontrado, sem acrescentar incapacidade explícita.
- source_word: μὴ
  choice: Será que
  rationale: Introduz uma pergunta especulativa que, no grego, tende a esperar resposta negativa; a formulação portuguesa preserva o caráter retórico sem soar artificial.
- source_word: διασπορὰν τῶν Ἑλλήνων
  choice: a Dispersão entre os gregos
  rationale: “Dispersão” designa aqui as comunidades judaicas espalhadas entre populações gregas, não uma dispersão composta por gregos; a inicial maiúscula ajuda a sinalizar o uso histórico reconhecido.
- source_word: Ἕλληνας
  choice: os gregos
  rationale: Mantém o sentido lexical direto e evita ampliar sem necessidade para “gentios”.
- source_word: καὶ διδάσκειν τοὺς Ἕλληνας
  choice: e ensinar os gregos
  rationale: Reproduz de modo claro e direto a coordenação e o objeto do infinitivo grego.
theological_decisions:
- issue: Sentido de Ἰουδαῖοι na narrativa joanina
  choice: os judeus
  alternative: os judeanos
  rationale: O contexto não exige limitar o termo regionalmente nem identificá-lo como “os líderes judeus”. A tradução principal mantém o equivalente abrangente, e a possibilidade regional fica em nota para preservar a ambiguidade lexical.
- issue: Identidade da διασπορά
  choice: a Dispersão entre os gregos
  alternative: os judeus dispersos entre os gregos
  rationale: A tradução conserva o termo histórico do texto e evita fazer dos próprios gregos o grupo disperso; a nota esclarece a referência cultural sem inserir a explicação no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Aonde” acompanha o verbo de movimento; “Será que” reproduz naturalmente a pergunta especulativa. As notas preservam uma alternativa lexical relevante e esclarecem a referência histórica da Dispersão.
