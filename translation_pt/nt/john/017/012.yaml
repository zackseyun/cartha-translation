id: JHN.17.12
reference: John 17:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτε ἤμην μετ’ ⸀αὐτῶν ἐγὼ ἐτήρουν αὐτοὺς ἐν τῷ ὀνόματί σου ⸀ᾧ δέδωκάς μοι, ⸀καὶ ἐφύλαξα, καὶ οὐδεὶς ἐξ αὐτῶν ἀπώλετο εἰ μὴ ὁ υἱὸς τῆς ἀπωλείας, ἵνα ἡ γραφὴ πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/012.yaml
  text: While I was with them[a], I kept them in your name, which you have given me, and I guarded them, and not one of them perished except the son of destruction[b], so that the Scripture might be fulfilled.
translation:
  language: pt
  text: Enquanto eu estava com eles, eu os guardava no teu nome, o nome que me deste, e os protegi; nenhum deles se perdeu[a], exceto o filho da perdição[b], para que se cumprisse a Escritura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pereceu”.'
    reason: lexical_alternative
  - marker: b
    text: “Filho da perdição” é uma expressão de estilo hebraico; também pode ser entendida como “aquele destinado à destruição” ou traduzida como “filho da destruição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἤμην μετ’ αὐτῶν
  choice: Enquanto eu estava com eles
  rationale: “Enquanto” expressa com naturalidade a ação contínua indicada pelos imperfeitos gregos e mantém a relação temporal.
- source_word: ἐτήρουν αὐτοὺς ἐν τῷ ὀνόματί σου
  choice: eu os guardava no teu nome
  rationale: O imperfeito é preservado por “guardava”, e “no teu nome” mantém a densidade teológica de ἐν τῷ ὀνόματί sem explicá-la em excesso.
- source_word: ᾧ δέδωκάς μοι
  choice: o nome que me deste
  rationale: O relativo neutro singular retoma naturalmente ὀνόματι, “nome”. A repetição de “o nome” torna essa ligação gramatical inequívoca e natural em português.
- source_word: καὶ ἐφύλαξα
  choice: e os protegi
  rationale: “Protegi” distingue φυλάσσω de τηρέω e comunica a ideia mais forte de guardar contra perigo.
- source_word: οὐδεὶς ἐξ αὐτῶν ἀπώλετο
  choice: nenhum deles se perdeu
  rationale: “Perdeu-se” é natural em português, preserva a voz intransitiva e a ressonância joanina de ἀπόλλυμι; a alternativa “pereceu” é registrada em nota.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: o filho da perdição
  rationale: A expressão tradicional em português conserva de modo conciso a forma semítica e a relação lexical entre ἀπώλετο e ἀπωλείας, sem transformar a frase em uma declaração doutrinária mais explícita.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: para que se cumprisse a Escritura
  rationale: Preserva a nuance de propósito/resultado de ἵνα e trata γραφή com artigo como referência reconhecida à Escritura.
theological_decisions:
- issue: Referente de ᾧ δέδωκάς μοι
  choice: 'A oração relativa modifica “nome”: “o nome que me deste”.'
  alternative: 'Entender a expressão como referência aos discípulos: “aqueles que me deste”.'
  rationale: No texto fornecido, o relativo é neutro singular e concorda naturalmente com ὀνόματι, não com αὐτούς, masculino plural. A tradução segue a gramática da fonte sem harmonizá-la com formulações joaninas semelhantes.
- issue: Sentido de ὁ υἱὸς τῆς ἀπωλείας
  choice: “o filho da perdição”, preservando a expressão semítica.
  alternative: “aquele destinado à destruição” ou “o filho da destruição”.
  rationale: A formulação mantém a tensão do idioma original e evita definir se a expressão descreve caráter, destino ou ambos.
- issue: Relação entre ἀπώλετο e ὁ υἱὸς τῆς ἀπωλείας
  choice: “se perdeu” / “filho da perdição”.
  alternative: “pereceu” / “filho da destruição”.
  rationale: A escolha principal soa idiomática em português e conserva a afinidade lexical entre o verbo e o substantivo sem limitar o sentido a morte física.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com formas pronominais “teu/te” adequadas à fala dirigida ao Pai. A repetição “o nome” esclarece o antecedente do relativo sem acrescentar conteúdo. Evitou-se linguagem denominacional e preservaram-se a ambiguidade idiomática e a tensão teológica do texto.
