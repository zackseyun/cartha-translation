  text: Ἐφανέρωσά σου τὸ ὄνομα τοῖς ἀνθρώποις οὓς ⸀ἔδωκάς μοι ἐκ τοῦ κόσμου. σοὶ ἦσαν κἀμοὶ αὐτοὺς ⸁ἔδωκας, καὶ τὸν λόγον σου τετήρηκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/006.yaml
  text: I have made your name known to the men whom you gave me out of the world. They were yours, and you gave them to me, and they have kept your word.
translation:
  language: pt
  text: Revelei[a] o teu nome[b] às pessoas[c] que me deste do meio do mundo[d]. Elas eram tuas, e tu as deste a mim; e têm guardado a tua palavra[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Dei a conhecer”.'
    reason: lexical_alternative
  - marker: b
    text: “O teu nome” se refere à identidade e ao caráter revelados de Deus, não apenas a uma designação pronunciada.
    reason: cultural_note
  - marker: c
    text: 'Ou: “aos homens”. Aqui, o referente imediato são os discípulos de Jesus.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “do mundo”.'
    reason: lexical_alternative
  - marker: e
    text: 'Ou: “têm obedecido à tua palavra”. Mais literalmente: “têm guardado a tua palavra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφανέρωσά
  choice: Revelei
  rationale: O aoristo de φανερόω comunica tornar conhecido ou manifesto. “Revelei” é natural em português, mantém o sentido de divulgação e combina bem com o objeto “o teu nome”.
- source_word: τὸ ὄνομα
  choice: o teu nome
  rationale: Embora “nome” aqui abranja a identidade e o caráter revelados de Deus, o texto emprega concretamente ὄνομα. A tradução conserva essa formulação e sua profundidade teológica.
- source_word: τοῖς ἀνθρώποις
  choice: às pessoas
  rationale: ἄνθρωποι pode designar seres humanos ou pessoas em geral. “Pessoas” é português atual e natural; o contexto identifica essas pessoas como os discípulos de Jesus, sem ser necessário inserir o gênero no substantivo.
- source_word: οὓς ἔδωκάς μοι
  choice: que me deste
  rationale: Reproduz de modo direto o aoristo ἔδωκας e a relação expressa pelo pronome relativo, sem acrescentar uma explicação sobre a natureza desse ato de dar.
- source_word: ἐκ τοῦ κόσμου
  choice: do meio do mundo
  rationale: A expressão preserva a força de ἐκ, indicando proveniência de dentro do mundo, e soa mais clara em português do que a formulação rígida “para fora do mundo”.
- source_word: σοὶ ἦσαν
  choice: Elas eram tuas
  rationale: Mantém a estrutura possessiva breve e solene do grego, com concordância natural com “pessoas”.
- source_word: κἀμοὶ αὐτοὺς ἔδωκας
  choice: e tu as deste a mim
  rationale: Conserva a ênfase explícita de κἀμοί, “e a mim”, usando uma ordem compreensível em português.
- source_word: τὸν λόγον σου
  choice: a tua palavra
  rationale: λόγος pode significar palavra, mensagem ou ensino. “A tua palavra” preserva a terminologia joanina e evita restringir indevidamente o sentido.
- source_word: τετήρηκαν
  choice: têm guardado
  rationale: O perfeito de τηρέω descreve uma ação com resultado persistente. “Têm guardado” conserva tanto esse aspecto quanto a amplitude semântica de guardar, observar e obedecer.
theological_decisions:
- issue: Sentido de “o teu nome” na teologia joanina
  choice: Manter “o teu nome” no texto principal
  alternative: Parafrasear como “quem tu és” ou “o teu caráter”
  rationale: A expressão envolve a identidade, o caráter e a presença revelados do Pai, mas a formulação concreta do original deve ser preservada para não reduzir sua riqueza teológica.
- issue: Referente de τοῖς ἀνθρώποις
  choice: Traduzir como “às pessoas” e esclarecer o referente imediato em nota
  alternative: Traduzir como “aos homens”
  rationale: O substantivo grego permite um sentido humano genérico, enquanto o contexto delimita o grupo aos discípulos de Jesus. A tradução natural não precisa transformar essa delimitação contextual em marca lexical de gênero.
- issue: O Pai dar pessoas ao Filho
  choice: Preservar a afirmação sem explicar seu mecanismo doutrinário
  alternative: Explicá-la segundo um sistema específico de eleição ou de resposta humana prevista
  rationale: O versículo afirma que essas pessoas pertenciam ao Pai e foram dadas ao Filho, mas não apresenta aqui uma sistematização do modo como isso se relaciona com eleição, fé ou liberdade humana.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O tratamento por “tu” preserva a distinção pronominal da oração dirigida ao Pai; as formas verbais e pronominais mantêm coerência. A pontuação conserva o encadeamento solene das três afirmações finais sem produzir uma frase excessivamente pesada.
