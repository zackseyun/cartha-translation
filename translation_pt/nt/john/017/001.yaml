id: JHN.17.1
reference: John 17:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ⸂ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανὸν εἶπεν⸃· Πάτερ, ἐλήλυθεν ἡ ὥρα· δόξασόν σου τὸν υἱόν, ⸀ἵνα ὁ ⸀υἱὸς δοξάσῃ σέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/001.yaml
  text: 'Jesus said these things, and lifting up his eyes to heaven, he said: “Father, the hour has come. Glorify your Son, so that the Son may glorify you,”'
translation:
  language: pt
  text: 'Jesus disse essas coisas e, levantando os olhos para o céu, disse: “Pai, chegou a hora. Glorifica o teu Filho, para que o Filho te glorifique,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: essas coisas
  rationale: O demonstrativo neutro plural retoma o discurso anterior; “essas coisas” é natural em português e preserva a referência retrospectiva.
- source_word: ἐλάλησεν
  choice: disse
  rationale: Embora λαλέω possa ser traduzido por “falar”, “disse” é idiomático neste contexto narrativo e introduz naturalmente a ação seguinte.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: levantando os olhos
  rationale: Preserva o gesto físico expresso pelo particípio aoristo, com formulação corrente e digna em português; o possessivo é desnecessário por ser claramente reflexivo no contexto.
- source_word: εἰς τὸν οὐρανόν
  choice: para o céu
  rationale: εἰς com acusativo indica direção; “para o céu” expressa naturalmente a orientação ascendente do olhar.
- source_word: Πάτερ
  choice: Pai
  rationale: Reproduz diretamente o vocativo, sem acrescentar o possessivo “meu”, ausente do grego.
- source_word: ἐλήλυθεν ἡ ὥρα
  choice: chegou a hora
  rationale: A formulação portuguesa comunica a chegada decisiva indicada pelo perfeito e mantém “hora”, termo temático no Evangelho de João.
- source_word: δόξασόν
  choice: Glorifica
  rationale: “Glorificar” preserva o peso revelatório, honorífico e teológico de δοξάζω em João, além da simetria da frase.
- source_word: σου τὸν υἱόν
  choice: o teu Filho
  rationale: Expressa naturalmente a relação possessiva e mantém “Filho” como referência titular a Jesus.
- source_word: ἵνα
  choice: para que
  rationale: Marca de modo claro a finalidade ou o resultado pretendido, sem eliminar a amplitude possível da construção grega.
- source_word: ὁ υἱὸς
  choice: o Filho
  rationale: Preserva o artigo definido e a passagem de “teu Filho” para o sujeito titular “o Filho”.
- source_word: δοξάσῃ σέ
  choice: te glorifique
  rationale: O presente do subjuntivo português após “para que” representa naturalmente o subjuntivo grego e mantém o objeto pronominal em estilo corrente.
theological_decisions:
- issue: A glorificação recíproca entre o Pai e o Filho
  choice: “Glorifica o teu Filho, para que o Filho te glorifique”
  alternative: “Honra o teu Filho, para que ele te honre”
  rationale: A tradução conserva a repetição e a simetria de δοξάζω, bem como sua densidade teológica joanina, sem explicar de que maneira ocorre essa glorificação nem inserir formulações doutrinárias posteriores.
- issue: Uso de maiúscula em “Filho”
  choice: “Filho” com inicial maiúscula
  alternative: “filho” com inicial minúscula
  rationale: No contexto, o termo identifica Jesus em sua relação singular com o Pai. A maiúscula sinaliza o uso titular segundo a convenção editorial portuguesa, sem alterar o conteúdo lexical.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A ordem e a repetição do original foram preservadas onde soam naturais. Usou-se “teu” para manter uma forma clara e digna de tratamento direto, evitando a mistura pronominal frequente na fala coloquial. A pontuação final mantém a vírgula porque o versículo continua na unidade sintática seguinte.
