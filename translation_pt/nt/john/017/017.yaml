  text: ἁγίασον αὐτοὺς ἐν τῇ ⸀ἀληθείᾳ· ὁ λόγος ὁ σὸς ἀλήθειά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/017.yaml
  text: Sanctify them in the truth[a]; your word is truth.
translation:
  language: pt
  text: Santifica-os na verdade[a]; a tua palavra é verdade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Santifica-os por meio da verdade”. A preposição grega também pode indicar o meio pelo qual se realiza a santificação. A última oração também pode ser traduzida: “a tua palavra é a verdade”.'
    reason: Preservar a amplitude locativa/instrumental de ἐν e a possibilidade de entender o predicativo ἀλήθεια de modo definido.
lexical_decisions:
- source_word: ἁγίασον
  choice: Santifica
  rationale: O imperativo aoristo ativo de ἁγιάζω reúne as ideias de consagrar, separar para Deus e tornar santo. “Santifica” preserva essa amplitude e é natural no registro bíblico moderno.
- source_word: αὐτοὺς
  choice: -os
  rationale: Pronome acusativo plural que retoma os discípulos; o pronome oblíquo ligado ao verbo é claro e idiomático em português.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: na verdade
  rationale: Mantém a preposição ἐν e o artigo definido, preservando a possível amplitude locativa e instrumental sem restringir o sentido a “por meio da verdade”.
- source_word: ὁ λόγος ὁ σὸς
  choice: a tua palavra
  rationale: λόγος designa aqui aquilo que Deus comunica. A construção possessiva enfática grega é vertida de modo natural, conservando o referente pessoal de segunda pessoa singular.
- source_word: ἀλήθειά ἐστιν
  choice: é verdade
  rationale: A ausência de artigo no predicativo ἀλήθεια favorece a força qualitativa. “É verdade” preserva o substantivo e evita tanto reduzi-lo a “é verdadeira” quanto impor obrigatoriamente a identificação definida “é a verdade”.
theological_decisions:
- issue: Valor qualitativo ou definido de ἀλήθεια na segunda oração
  choice: a tua palavra é verdade
  alternative: a tua palavra é a verdade
  rationale: O predicativo anartro pode destacar a qualidade ou natureza da palavra de Deus como verdade. A alternativa definida continua gramaticalmente possível e é registrada em nota, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “tu” porque o contexto é uma oração dirigida ao Pai e a forma “a tua palavra” é corrente em traduções bíblicas; evita explicitações confessionais.
