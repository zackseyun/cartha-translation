source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ αἰώνιος ζωὴ ἵνα γινώσκωσι σὲ τὸν μόνον ἀληθινὸν θεὸν καὶ ὃν ἀπέστειλας Ἰησοῦν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/003.yaml
  text: 'And this is eternal life: that they may know you[a], the only true God, and Jesus the Messiah whom you sent.'
translation:
  language: pt
  text: 'E a vida eterna é esta: que te conheçam, o único Deus verdadeiro, e a Jesus, o Messias[a], a quem enviaste.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, tradicionalmente, “Jesus Cristo”. O grego Χριστός pode funcionar como título (“Messias”) ou, em certos contextos, como designação semelhante a um nome (“Cristo”).
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη δέ ἐστιν
  choice: E ... é esta
  rationale: Preserva a conexão de δέ e introduz com naturalidade, em português, a explicação que segue.
- source_word: ἡ αἰώνιος ζωὴ
  choice: a vida eterna
  rationale: Expressão joanina consagrada e natural, que designa a vida pertencente à era vindoura e caracterizada pela comunhão duradoura com Deus.
- source_word: ἵνα γινώσκωσι
  choice: que conheçam
  rationale: A oração com ἵνα define em que consiste a vida eterna; o presente do subjuntivo permite perceber um conhecimento contínuo e relacional sem explicitação excessiva.
- source_word: σὲ
  choice: a ti
  rationale: Objeto direto de γινώσκωσι, referente ao Pai a quem Jesus se dirige. A forma tônica evita ambiguidade e mantém o tom de oração.
- source_word: τὸν μόνον ἀληθινὸν θεὸν
  choice: o único Deus verdadeiro
  rationale: Reproduz de modo claro e tradicional a atribuição de exclusividade e veracidade do grego, sem acrescentar interpretação doutrinária.
- source_word: καὶ
  choice: e
  rationale: Mantém a coordenação simples entre o Pai e Jesus, aquele que foi enviado.
- source_word: ὃν ἀπέστειλας
  choice: a quem enviaste
  rationale: Traduz naturalmente a oração relativa e o aoristo como ação passada; a colocação após o aposto titular torna claro que o antecedente é Jesus.
- source_word: Ἰησοῦν Χριστόν
  choice: a Jesus, o Messias
  rationale: Χριστός conserva aqui seu valor titular, traduzido por “Messias”. A preposição “a” marca o objeto pessoal coordenado, e as vírgulas apresentam o título em português idiomático.
theological_decisions:
- issue: Relação entre “o único Deus verdadeiro” e Jesus
  choice: Manter o Pai como destinatário descrito pela expressão e distinguir Jesus como aquele que o Pai enviou.
  alternative: Acrescentar linguagem para explicitar uma formulação trinitária ou reformular o texto para enfraquecer a distinção sintática.
  rationale: O versículo deve conservar sua formulação e tensão próprias, sem resolver por paráfrase debates teológicos posteriores nem negar o contexto cristológico mais amplo do Evangelho.
- issue: Tradução de Χριστόν
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, o sentido de título permanece perceptível. A forma tradicional e possivelmente mais nominal, “Cristo”, é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega “a ti” e “enviaste” para preservar a fala direta dirigida a Deus e evitar a ambiguidade de “você”, sem recorrer a construções arcaicas.
