  text: Now they have come to know that everything you have given me is from you[a].
translation:
  language: pt
  text: Agora eles sabem que tudo o que me deste vem de ti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tudo o que me deste procede de ti”.'
    reason: Alternativa lexical para a ideia de procedência ou origem expressa por παρὰ σοῦ.
lexical_decisions:
- source_word: νῦν
  choice: Agora
  rationale: Marca o estágio presente do entendimento dos discípulos de modo conciso e natural.
- source_word: ἔγνωκαν
  choice: eles chegaram a saber
  rationale: O perfeito de γινώσκω expressa um conhecimento alcançado que permanece; a formulação preserva tanto o processo de compreensão quanto seu resultado presente.
- source_word: ὅτι
  choice: que
  rationale: Introduz naturalmente o conteúdo daquilo que os discípulos chegaram a saber.
- source_word: πάντα ὅσα
  choice: tudo o que
  rationale: Expressa a totalidade e mantém a nuance relativa da construção grega em português corrente.
- source_word: δέδωκάς μοι
  choice: me deste
  rationale: O pretérito perfeito é idiomático em português para uma dádiva já realizada e contextualmente ainda relevante; a colocação pronominal é natural e digna.
- source_word: παρὰ σοῦ εἰσιν
  choice: vem de ti
  rationale: παρά com genitivo indica fonte ou origem. A formulação verbal é mais natural em português do que 'é de ti' e conserva essa relação de procedência.
theological_decisions:
- issue: Relação entre aquilo que o Pai deu ao Filho e sua origem
  choice: tudo o que me deste vem de ti
  alternative: tudo o que me deste é da tua parte
  rationale: A tradução afirma que o Pai é a fonte de tudo o que o Filho recebeu, sem desenvolver a declaração segundo formulações doutrinárias posteriores nem resolver além do que o texto diz.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Chegaram a saber” conserva a força resultativa do perfeito grego; “vem de ti” comunica naturalmente a ideia de origem. O pronome “ti” mantém o tratamento singular e a solenidade adequada ao contexto de oração.
