id: JHN.17.25
reference: John 17:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Πάτερ δίκαιε, καὶ ὁ κόσμος σε οὐκ ἔγνω, ἐγὼ δέ σε ἔγνων, καὶ οὗτοι ἔγνωσαν ὅτι σύ με ἀπέστειλας,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/025.yaml
  text: Righteous Father[a], though the world has not known you, I have known you[b], and these have known that you sent me.
translation:
  language: pt
  text: Pai justo, embora o mundo[a] não te tenha conhecido, eu te conheci, e estes reconheceram[b] que tu me enviaste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Pai justo, e o mundo não te conheceu, mas eu te conheci». A conjunção grega pode ser entendida como simples coordenação ou, no contexto, com sentido concessivo.'
    reason: lexical_alternative
  - marker: b
    text: O mesmo verbo grego usado anteriormente para «conhecer» aparece aqui. Como «conheceram que» não é natural em português, foi traduzido por «reconheceram que».
    reason: translation_clarity
lexical_decisions:
- source_word: Πάτερ δίκαιε
  choice: Pai justo
  rationale: Mantém o vocativo direto e traduz δίκαιε pelo adjetivo corrente «justo», que em português conserva tanto a retidão moral quanto a dimensão judicial sem recorrer a uma formulação arcaica.
- source_word: καὶ
  choice: embora
  rationale: Neste contexto, a primeira conjunção introduz naturalmente uma relação concessiva entre o desconhecimento do mundo e o conhecimento de Jesus. A nota preserva a possibilidade de coordenação simples.
- source_word: ὁ κόσμος
  choice: o mundo
  rationale: Preserva a amplitude do uso joanino, que pode abranger a humanidade em seu afastamento de Deus, sem inserir essa interpretação diretamente no texto.
- source_word: ἔγνω / ἔγνων
  choice: não te tenha conhecido / te conheci
  rationale: O perfeito composto exigido por «embora» expressa em português a situação relevante no contexto; o pretérito perfeito «conheci» traduz naturalmente o aoristo e mantém o sentido relacional de conhecer.
- source_word: οὗτοι
  choice: estes
  rationale: Reproduz o demonstrativo grego e deixa que o contexto identifique os seguidores de Jesus, sem acrescentar «discípulos» ao texto.
- source_word: ἔγνωσαν ὅτι
  choice: reconheceram que
  rationale: Em português, «conheceram que» não é idiomático. «Reconheceram que» comunica que chegaram a saber e aceitar como verdadeiro o conteúdo da oração seguinte.
- source_word: σύ με ἀπέστειλας
  choice: tu me enviaste
  rationale: O pronome explícito preserva a ênfase de σύ, e o pretérito perfeito traduz diretamente o aoristo de ἀποστέλλω.
theological_decisions:
- issue: O atributo δίκαιε aplicado ao Pai
  choice: Pai justo
  alternative: Pai reto
  rationale: «Justo» é a correspondência bíblica e portuguesa mais abrangente, preservando a retidão moral do Pai sem reduzir o termo apenas à imparcialidade judicial.
- issue: O sentido de κόσμος em João
  choice: o mundo
  alternative: a humanidade afastada de Deus
  rationale: A expressão literal mantém as várias ressonâncias joaninas e evita resolver no texto principal se a referência é à humanidade, à ordem humana hostil a Deus ou a ambas.
- issue: A relação discursiva da primeira ocorrência de καὶ
  choice: embora
  alternative: e
  rationale: A leitura concessiva torna claro o contraste contextual sem negar que a forma grega básica seja coordenativa; essa alternativa é registrada em nota.
- issue: O valor temporal e aspectual dos aoristos de γινώσκω
  choice: formas portuguesas naturais determinadas pela sintaxe e pelo contexto
  alternative: pretérito perfeito simples em todas as ocorrências
  rationale: O grego emprega aoristos, mas a construção com «embora» pede naturalmente «não tenha conhecido». «Te conheci» e «reconheceram» preservam a ação apresentada globalmente, sem impor uma teoria específica sobre o início ou a duração desse conhecimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem é próxima da grega, mas a sintaxe foi ajustada ao uso natural do português. «Estes» conserva deliberadamente o demonstrativo do original, embora «eles» fosse mais coloquial.
