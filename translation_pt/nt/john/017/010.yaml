id: JHN.17.10
reference: John 17:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὰ ἐμὰ πάντα σά ἐστιν καὶ τὰ σὰ ἐμά, καὶ δεδόξασμαι ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/010.yaml
  text: And all that is mine is yours[a], and what is yours is mine, and I have been glorified in them.
translation:
  language: pt
  text: E tudo o que é meu é teu, e o que é teu é meu; e sou glorificado neles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «por meio deles» ou «entre eles». O grego diz «neles», expressão que, neste contexto, pode indicar esfera, meio ou manifestação.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐμὰ πάντα
  choice: tudo o que é meu
  rationale: O neutro plural substantivado com πᾶς abrange tudo quanto pertence a Jesus. A formulação é natural em português e evita a conotação excessivamente material de «todas as minhas coisas».
- source_word: σά
  choice: teu
  rationale: O adjetivo possessivo funciona predicativamente. «Teu» expressa com concisão a posse e combina com o tratamento singular dirigido ao Pai.
- source_word: τὰ σὰ ἐμά
  choice: o que é teu é meu
  rationale: A formulação espelha a primeira oração, preserva a afirmação de posse recíproca e soa natural em português.
- source_word: δεδόξασμαι
  choice: sou glorificado
  rationale: O perfeito passivo indica uma glorificação realizada cujo resultado permanece. Em português, «sou glorificado» comunica bem o estado resultante; «tenho sido glorificado» poderia sugerir ação repetida ou progressiva, e «fui glorificado» poderia enfatizar apenas o evento passado.
- source_word: ἐν αὐτοῖς
  choice: neles
  rationale: É a correspondência mais direta de ἐν αὐτοῖς e, no contexto, o pronome retoma naturalmente os discípulos dados pelo Pai. A expressão mantém em aberto se o sentido contextual é de esfera, manifestação ou meio.
theological_decisions:
- issue: Posse recíproca entre o Filho e o Pai
  choice: 'Manter sem atenuação: «tudo o que é meu é teu, e o que é teu é meu».'
  alternative: Interpretar a frase apenas como cooperação funcional, enfraquecendo a linguagem de posse compartilhada.
  rationale: O grego afirma diretamente a reciprocidade da posse. A tradução preserva essa elevada afirmação cristológica sem acrescentar terminologia dogmática posterior.
- issue: Referente e valor de ἐν αὐτοῖς
  choice: Conservar «neles» no texto principal.
  alternative: Traduzir de modo instrumental como «por meio deles» ou relacional/espacial como «entre eles».
  rationale: A preposição ἐν admite essas nuances, mas o contexto não exige que a tradução escolha apenas uma. «Neles» preserva a formulação e a ambiguidade genuína do original.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se «teu» por se tratar da fala direta de Jesus ao Pai e mantém-se o paralelismo conciso do grego. O ponto e vírgula torna clara a passagem da afirmação de posse recíproca para a declaração sobre a glorificação.
