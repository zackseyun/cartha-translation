  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγὼ δέδωκα αὐτοῖς τὸν λόγον σου, καὶ ὁ κόσμος ἐμίσησεν αὐτούς, ὅτι οὐκ εἰσὶν ἐκ τοῦ κόσμου καθὼς ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/014.yaml
  text: I have given them your word[a], and the world has hated them because they are not of the world, just as I am not of the world.
translation:
  language: pt
  text: Eu lhes dei a tua palavra, e o mundo os odiou, porque eles não são do mundo[a], assim como eu não sou do mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não têm sua origem no mundo». A expressão grega usa literalmente «de, a partir de» e pode indicar origem ou pertencimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέδωκα
  choice: dei
  rationale: O perfeito grego apresenta uma ação realizada cujos efeitos permanecem. Em português, «dei» expressa naturalmente a ação concluída neste contexto; «tenho dado» poderia sugerir repetição ou continuidade da entrega.
- source_word: λόγον
  choice: palavra
  rationale: «Palavra» preserva o vocabulário característico de João e a amplitude de λόγος, sem reduzi-lo à paráfrase mais interpretativa «mensagem».
- source_word: κόσμος
  choice: mundo
  rationale: «Mundo» mantém a amplitude do termo joanino; neste contexto, a hostilidade expressa pelo verbo «odiou» deixa claro que se trata do âmbito humano em oposição a Jesus e aos discípulos.
- source_word: ἐμίσησεν
  choice: odiou
  rationale: O aoristo é vertido naturalmente pelo pretérito perfeito português. O contexto permite entender a hostilidade resultante sem acrescentar uma forma verbal durativa.
- source_word: ὅτι
  choice: porque
  rationale: 'A conjunção introduz a causa do ódio do mundo: os discípulos não são do mundo.'
- source_word: ἐκ τοῦ κόσμου
  choice: do mundo
  rationale: A formulação portuguesa é natural e preserva a tensão entre origem e pertencimento presente em ἐκ, sem impor uma explicação exclusivamente social ou metafísica.
- source_word: καθὼς
  choice: assim como
  rationale: Marca claramente a comparação entre a relação dos discípulos com o mundo e a relação de Jesus com o mundo.
theological_decisions:
- issue: Relação dos discípulos com o mundo em comparação com Jesus
  choice: «eles não são do mundo, assim como eu não sou do mundo»
  alternative: «eles não vêm do mundo, assim como eu não venho do mundo»
  rationale: A tradução conserva diretamente a analogia feita pelo texto e deixa aberta a dimensão de origem ou pertencimento de ἐκ, sem enfraquecê-la nem transformá-la numa afirmação metafísica mais específica do que o grego exige.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento «tua» preserva o discurso direto de Jesus ao Pai; a sintaxe permanece próxima do grego sem soar artificial. O marcador foi colocado junto à primeira ocorrência relevante de «do mundo».
