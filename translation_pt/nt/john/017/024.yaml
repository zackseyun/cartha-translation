id: JHN.17.24
reference: John 17:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀πάτερ, ⸀ὃ δέδωκάς μοι, θέλω ἵνα ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ, ἵνα θεωρῶσιν τὴν δόξαν τὴν ἐμὴν ἣν ⸀δέδωκάς μοι, ὅτι ἠγάπησάς με πρὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/024.yaml
  text: Father[a], I desire that those whom you have given me also may be with me where I am, so that they may see my glory that you have given me, because you loved me before the foundation of the world.
translation:
  language: pt
  text: Pai, desejo que aqueles que me deste[a] também estejam comigo onde eu estou, para que vejam a minha glória, que me deste porque me amaste antes da fundação do mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “o que” ou “aquilo que me deste”. A expressão é coletiva e se refere às pessoas que o Pai deu ao Filho; por isso, foi traduzida como “aqueles que me deste”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: Pai
  rationale: Vocativo direto dirigido a Deus; “Pai” é natural e fiel, sem acrescentar o possessivo “meu”, ausente do grego.
- source_word: ὃ δέδωκάς μοι
  choice: aqueles que me deste
  rationale: Embora ὃ seja neutro singular, a expressão tem sentido coletivo e se refere a pessoas, como confirma o plural κἀκεῖνοι ὦσιν. A forma pessoal plural comunica esse referente com clareza em português.
- source_word: θέλω
  choice: desejo
  rationale: Expressa vontade firme no contexto da oração, sem a possível dureza de uma formulação imperativa e com registro mais digno que “quero”.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: onde eu estou
  rationale: Mantém o presente e o pronome explícito do grego de maneira natural em português.
- source_word: κἀκεῖνοι ὦσιν μετ’ ἐμοῦ
  choice: também estejam comigo
  rationale: Preserva tanto a força aditiva de κἀκεῖνοι quanto o valor da oração subordinada introduzida por ἵνα.
- source_word: θεωρῶσιν
  choice: vejam
  rationale: Equivalente atual e claro para a percepção contemplativa indicada pelo verbo, sem recorrer ao mais arcaizante “contemplem” ou “contemplem com os olhos”.
- source_word: τὴν δόξαν τὴν ἐμήν
  choice: a minha glória
  rationale: Reproduz de modo idiomático a ênfase possessiva da construção grega.
- source_word: ἣν δέδωκάς μοι
  choice: que me deste
  rationale: Identifica a glória como aquela dada pelo Pai ao Filho; o pretérito perfeito simples é a forma natural em português para o perfeito grego neste contexto, mantendo o resultado vigente.
- source_word: ὅτι ἠγάπησάς με
  choice: porque me amaste
  rationale: Mantém a relação causal mais provável de ὅτι e traduz o aoristo por um passado simples adequado à referência anterior à criação.
- source_word: πρὸ καταβολῆς κόσμου
  choice: antes da fundação do mundo
  rationale: Tradução formal e corrente que preserva a afirmação temporal anterior à criação.
theological_decisions:
- issue: A preexistência do Filho implícita no amor do Pai anterior à criação
  choice: antes da fundação do mundo
  alternative: Paráfrases que tratem a referência como meramente figurada ou como anterior apenas no propósito divino
  rationale: A tradução conserva a afirmação temporal direta do grego sem ampliá-la nem enfraquecê-la interpretativamente.
- issue: Força volitiva de θέλω na oração de Jesus
  choice: desejo
  alternative: quero; determino
  rationale: “Desejo” mantém a vontade expressa por Jesus e o tom de oração, sem transformar a frase em decreto nem reduzi-la a preferência débil.
- issue: Relação expressa por ὅτι
  choice: porque
  alternative: pois; visto que; que
  rationale: A leitura causal é a mais natural no contexto, mas a tradução não acrescenta explicação sobre a relação eterna entre o amor do Pai e a glória dada ao Filho.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “deste” e “amaste” como formas correntes da linguagem bíblica sem recorrer a construções excessivamente arcaicas. O marcador da nota foi colocado junto à expressão que ela explica.
