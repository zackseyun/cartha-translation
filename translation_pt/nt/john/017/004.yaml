id: JHN.17.4
reference: John 17:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγώ σε ἐδόξασα ἐπὶ τῆς γῆς, τὸ ἔργον ⸀τελειώσας ὃ δέδωκάς μοι ἵνα ποιήσω·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/004.yaml
  text: I glorified you on the earth by completing the work that you have given me to do[a].
translation:
  language: pt
  text: 'Eu te glorifiquei na terra, completando a obra que me deste para fazer.[a]


    [a] Ou: “tendo completado a obra que me deste para fazer”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo completado a obra que me deste para fazer”.'
    reason: Registra a tradução mais formal do particípio aoristo τελειώσας e preserva a possível nuance de ação anterior.
lexical_decisions:
- source_word: ἐδόξασα
  choice: glorifiquei
  rationale: Preserva o sentido teologicamente marcante de δοξάζω no Evangelho de João, em vez de reduzi-lo a “honrei”.
- source_word: ἐπὶ τῆς γῆς
  choice: na terra
  rationale: Expressa de modo direto e natural a localização indicada por ἐπί com o genitivo; em português, o artigo pode ser omitido nessa expressão sem perda de sentido.
- source_word: τελειώσας
  choice: completando
  rationale: O particípio aoristo explica naturalmente como Jesus glorificou o Pai, mantendo uma formulação corrente em português. A nota registra a alternativa mais formal “tendo completado”.
- source_word: τὸ ἔργον
  choice: a obra
  rationale: “Obra” é uma correspondência direta e contextualmente adequada para ἔργον, especialmente para a missão recebida do Pai no contexto joanino.
- source_word: δέδωκάς μοι
  choice: me deste
  rationale: Embora o grego use o perfeito, o pretérito perfeito simples é a forma idiomática em português para uma dádiva concluída que continua relevante; “tens me dado” sugeriria repetição no português brasileiro.
- source_word: ἵνα ποιήσω
  choice: para fazer
  rationale: Comunica de forma natural o propósito ou a tarefa pretendida pela construção ἵνα com o subjuntivo depois do verbo “dar”.
- source_word: ἐγώ σε
  choice: Eu te
  rationale: Mantém os dois pronomes expressos. O “eu” explícito preserva a ênfase do grego sem recorrer ao enfático e menos natural “eu mesmo”.
theological_decisions:
- issue: Relação entre glorificar o Pai e o particípio τελειώσας
  choice: 'O particípio é traduzido como meio ou circunstância associada: Jesus glorificou o Pai completando a obra recebida.'
  alternative: 'Leitura temporal ou anterior: “tendo completado a obra”; também seria possível uma coordenação mais solta: “glorifiquei-te...; completei a obra”.'
  rationale: A sintaxe liga naturalmente o particípio ao verbo principal e apresenta a realização da obra como a maneira pela qual o Pai foi glorificado. A nota preserva a possibilidade de destacar a anterioridade do particípio sem impor uma conclusão doutrinária além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Na terra” e “me deste” são idiomáticos; “obra” conserva o vocabulário joanino tradicional sem soar arcaico.
