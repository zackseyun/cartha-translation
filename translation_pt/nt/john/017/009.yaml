id: JHN.17.9
reference: John 17:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγὼ περὶ αὐτῶν ἐρωτῶ· οὐ περὶ τοῦ κόσμου ἐρωτῶ ἀλλὰ περὶ ὧν δέδωκάς μοι, ὅτι σοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/009.yaml
  text: I am asking on their behalf[a]. I am not asking on behalf of the world, but on behalf of those whom you have given me[b], because they are yours.
translation:
  language: pt
  text: Eu peço por eles[a][b]. Não peço pelo mundo, mas por aqueles que me deste, porque são teus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a respeito deles». Neste contexto, a preposição grega pode indicar tanto o assunto do pedido quanto aqueles em favor de quem se pede.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «oro». O verbo grego significa mais literalmente «peço» ou «solicito», embora aqui o pedido seja feito em oração ao Pai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: peço
  rationale: Preserva o sentido básico de ἐρωτάω, «pedir/solicitar», sem tornar o verbo mais explicitamente religioso do que o grego, embora o contexto seja de oração ao Pai.
- source_word: περὶ αὐτῶν
  choice: por eles
  rationale: Com um verbo de pedido neste contexto intercessório, περί com genitivo é expresso naturalmente em português por «por eles»; a alternativa mais formal «a respeito deles» é mantida em nota.
- source_word: κόσμου
  choice: mundo
  rationale: Mantém o termo joanino e sua tensão contextual, sem restringi-lo interpretativamente à humanidade em geral ou a um sistema hostil.
- source_word: ὧν δέδωκάς μοι
  choice: aqueles que me deste
  rationale: Expressa o grupo pessoal indicado pelo pronome relativo. Em português, o pretérito perfeito «deste» comunica naturalmente o ato concluído cujo resultado continua vigente.
- source_word: ὅτι
  choice: porque
  rationale: 'Apresenta de modo claro a razão do pedido de Jesus: eles pertencem ao Pai.'
- source_word: σοί εἰσιν
  choice: são teus
  rationale: Formulação direta e idiomática que conserva tanto a relação quanto a ideia de pertencimento.
- source_word: ἐγὼ
  choice: Eu
  rationale: O pronome explícito preserva a ênfase do sujeito e contribui para o contraste do versículo.
- source_word: ἀλλὰ
  choice: mas
  rationale: Marca naturalmente o forte contraste entre o mundo e aqueles dados pelo Pai ao Filho.
theological_decisions:
- issue: Uso de linguagem explicitamente religiosa para ἐρωτῶ
  choice: «peço», em vez de «oro»
  alternative: «oro por eles»
  rationale: Embora Jesus esteja orando ao Pai, o verbo grego significa basicamente «pedir». A tradução mantém essa transparência lexical sem negar o contexto de oração.
- issue: Sentido de κόσμος no contraste do versículo
  choice: «mundo», sem explicação restritiva
  alternative: «a humanidade» ou «o sistema mundano incrédulo»
  rationale: O uso joanino de κόσμος comporta nuances que o versículo não resolve por si só. Manter «mundo» preserva a tensão teológica e evita uma leitura denominacional específica.
- issue: Força de περί com genitivo no pedido de Jesus
  choice: «por», com sentido intercessório
  alternative: «a respeito de»
  rationale: No contexto de um pedido dirigido ao Pai, «por» é o português mais natural, mas a nota conserva a ambiguidade lexical legítima entre benefício/intercessão e assunto do pedido.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa singular («me deste», «teus») mantém a forma direta e solene da oração de Jesus ao Pai. A repetição de «peço» e «por» reproduz o paralelismo contrastivo do grego.
