id: JHN.17.15
reference: John 17:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐκ ἐρωτῶ ἵνα ἄρῃς αὐτοὺς ἐκ τοῦ κόσμου ἀλλ’ ἵνα τηρήσῃς αὐτοὺς ἐκ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/015.yaml
  text: I am not asking that you take them out of the world[a], but that you keep them from the evil one.
translation:
  language: pt
  text: Não peço que os tires do mundo, mas que os guardes do Maligno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que os guardes do mal”. O grego τοῦ πονηροῦ pode significar tanto “o Maligno” como “o mal”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: peço
  rationale: O presente do indicativo expressa o pedido que Jesus faz naquele momento. “Peço” é natural no contexto da oração e representa diretamente o sentido do verbo, sem recorrer a um registro eclesiástico.
- source_word: ἄρῃς
  choice: tires
  rationale: Aqui αἴρω tem o sentido de tirar ou remover. A construção “tirar do mundo” é clara e idiomática em português.
- source_word: κόσμου
  choice: mundo
  rationale: “Mundo” mantém a amplitude de κόσμος e seu uso característico no Evangelho de João, sem restringi-lo explicitamente à sociedade ou ao sistema humano caído.
- source_word: τηρήσῃς
  choice: guardes
  rationale: τηρέω pode significar guardar, conservar ou proteger. “Guardes” transmite proteção e também preserva uma correspondência lexical ampla com outros usos joaninos do verbo.
- source_word: ἐκ
  choice: do
  rationale: Na construção τηρέω ἐκ, “guardar de” expressa naturalmente em português a ideia de proteção contra ou preservação diante de algo.
- source_word: τοῦ πονηροῦ
  choice: o Maligno
  rationale: A forma grega com artigo pode ser masculina, “o Maligno”, ou neutra, “o mal”. O uso joanino favorece aqui a referência pessoal, enquanto a alternativa genuína é mantida em nota.
theological_decisions:
- issue: Se τοῦ πονηροῦ é impessoal (“o mal”) ou pessoal (“o Maligno”)
  choice: o Maligno
  alternative: o mal
  rationale: A forma grega é genuinamente ambígua. O uso joanino e o contexto de proteção divina favorecem a referência pessoal, provavelmente a Satanás, mas a leitura impessoal é preservada em nota para não eliminar a tensão do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem das orações acompanha de perto o grego, enquanto “Não peço que os tires” e “que os guardes” soam naturais em português.
