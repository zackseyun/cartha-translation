id: JHN.17.5
reference: John 17:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ νῦν δόξασόν με σύ, πάτερ, παρὰ σεαυτῷ τῇ δόξῃ ᾗ εἶχον πρὸ τοῦ τὸν κόσμον εἶναι παρὰ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/005.yaml
  text: And now[a], Father[b], glorify me in your presence with the glory that I had with you before the world existed.
translation:
  language: pt
  text: E agora, Pai, glorifica-me junto de ti[a] com a glória que eu tinha contigo antes que o mundo existisse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “na tua presença”; a expressão grega também pode indicar proximidade: “ao teu lado”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “antes que o mundo fosse” ou “antes que o mundo viesse a existir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξασόν
  choice: glorifica-me
  rationale: Preserva o vocabulário joanino de glória e glorificação e traduz diretamente o imperativo aoristo, sem reduzi-lo a mero reconhecimento ou honra.
- source_word: παρὰ σεαυτῷ
  choice: junto de ti
  rationale: παρά com o dativo expressa proximidade ou presença. “Junto de ti” é natural em português e mantém o aspecto relacional e espacial da expressão.
- source_word: τῇ δόξῃ
  choice: com a glória
  rationale: O dativo liga a glorificação à glória especificada pela oração relativa. “Com a glória” reproduz essa relação de modo claro e idiomático.
- source_word: ᾗ εἶχον
  choice: que eu tinha
  rationale: O imperfeito εἶχον indica a posse anterior dessa glória; o pretérito imperfeito português conserva naturalmente esse valor.
- source_word: πρὸ τοῦ τὸν κόσμον εἶναι
  choice: antes que o mundo existisse
  rationale: A construção de infinitivo articular expressa anterioridade temporal. A formulação escolhida é clara e preserva a referência à existência do mundo.
- source_word: παρὰ σοί
  choice: contigo
  rationale: παρά com o dativo volta a indicar presença ou proximidade. “Contigo” é conciso e natural, sem apagar o paralelismo conceitual com “junto de ti”.
- source_word: σύ, πάτερ
  choice: Pai
  rationale: O pronome explícito σύ dá ênfase no grego, mas o vocativo “Pai” dentro do pedido transmite o foco de maneira natural em português, sem a construção marcada “tu, Pai”.
- source_word: κόσμον
  choice: mundo
  rationale: “Mundo” é o equivalente habitual de κόσμος em João e se ajusta ao contexto da criação sem ampliar o sentido para uma paráfrase como “ordem criada”.
theological_decisions:
- issue: A preexistência do Filho implícita no versículo
  choice: Traduzir diretamente a oração temporal como referência à glória que Jesus tinha com o Pai antes da existência do mundo.
  alternative: Atenuar a frase como mera glória prevista ou destinada de antemão.
  rationale: O grego apresenta a posse anterior da glória em relação à existência do mundo. A tradução preserva essa afirmação sem acrescentar uma explicação dogmática ao texto.
- issue: A natureza da glória compartilhada com o Pai
  choice: Manter “glória” sem expansão interpretativa.
  alternative: Substituir por “majestade” ou “honra”.
  rationale: O versículo não define aqui a natureza dessa glória. Conservar o termo mantém o vocabulário e a tensão teológica joaninos.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla inteligibilidade internacional e boa fluidez para leitores brasileiros. O tratamento por “tu” foi mantido nas formas oblíquas “ti” e “contigo”, usuais no registro bíblico e compreensíveis em todo o espaço lusófono. Os marcadores foram colocados precisamente junto às expressões que explicam.
