id: JHN.17.18
reference: John 17:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καθὼς ἐμὲ ἀπέστειλας εἰς τὸν κόσμον, κἀγὼ ἀπέστειλα αὐτοὺς εἰς τὸν κόσμον·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/018.yaml
  text: Just as you sent me into the world, I also sent them into the world.
translation:
  language: pt
  text: Assim como me enviaste ao mundo, eu também os enviei ao mundo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Assim como
  rationale: Introduz com naturalidade a comparação entre o envio de Jesus pelo Pai e o envio dos discípulos por Jesus.
- source_word: ἐμὲ
  choice: me
  rationale: Objeto direto de ἀπέστειλας; a forma pronominal portuguesa comunica o referente sem precisar reproduzir artificialmente a ênfase posicional do grego.
- source_word: ἀπέστειλας
  choice: enviaste
  rationale: Preserva o sentido comum de ἀποστέλλω e a linguagem joanina de missão, sem acrescentar a interpretação mais específica de 'comissionaste'.
- source_word: εἰς τὸν κόσμον
  choice: ao mundo
  rationale: Em português corrente, 'enviar ao mundo' expressa de modo natural o movimento e o âmbito da missão. 'Para dentro do mundo' seria excessivamente espacial e pouco idiomático.
- source_word: κἀγὼ
  choice: eu também
  rationale: Reproduz a força aditiva de καὶ ἐγώ e mantém claro o paralelismo entre as duas orações.
- source_word: ἀπέστειλα
  choice: enviei
  rationale: Repete o mesmo verbo da primeira oração para conservar o paralelismo deliberado do texto grego.
- source_word: αὐτοὺς
  choice: os
  rationale: Pronome objeto que retoma naturalmente os discípulos mencionados no contexto.
- source_word: κόσμον
  choice: mundo
  rationale: Mantém o termo joanino central κόσμος e sua tensão contextual, sem definir de modo restritivo se ele designa a humanidade, a ordem humana ou o âmbito da missão.
theological_decisions:
- issue: Paralelo missionário entre o envio do Filho pelo Pai e o envio dos discípulos pelo Filho
  choice: Manter o mesmo verbo em 'enviaste ... enviei'.
  alternative: Variar com 'enviaste ... comissionei'.
  rationale: A repetição preserva a analogia textual sem afirmar identidade de condição, autoridade ou natureza entre a missão singular de Jesus e a missão dos discípulos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção é concisa e conserva o paralelismo do grego. Emprega-se 'ao mundo', mais idiomático do que 'para dentro do mundo', sem eliminar o sentido de entrada no âmbito da missão.
