  source_fidelity: 'A tradução preserva com precisão a estrutura e o sentido do grego: κἀγώ é adequadamente representado por «E eu», os dois perfeitos são expressos de modo idiomático pelo pretérito perfeito simples («dei», «deste»), e a oração final «para que sejam um» mantém o propósito/resultante de ἵνα com o subjuntivo. A comparação final permanece concisa e não interpreta além de «assim como nós somos um».'
  naturalness: O texto é claro, fluente e digno em português moderno de ampla compreensão, inclusive com boa legibilidade brasileira. «Lhes dei» é conciso e natural em registro bíblico contemporâneo; «sejam um» preserva uma formulação consagrada e inteligível sem acrescentar «só» ou «unidos».
