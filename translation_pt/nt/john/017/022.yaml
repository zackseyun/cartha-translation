id: JHN.17.22
reference: John 17:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κἀγὼ τὴν δόξαν ἣν δέδωκάς μοι δέδωκα αὐτοῖς, ἵνα ὦσιν ἓν καθὼς ἡμεῖς ⸀ἕν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/022.yaml
  text: And I have given them the glory that you have given me[a], so that they may be one, just as we are one.
translation:
  language: pt
  text: E eu lhes dei a glória que me deste[a], para que sejam um, assim como nós somos um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Eu também lhes dei a glória que me deste». O grego κἀγώ pode ter ênfase aditiva («eu também»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: E eu
  rationale: A crase de καί + ἐγώ preserva a ligação com o contexto e explicita o sujeito enfático. O possível valor aditivo de καί é registrado em nota.
- source_word: δόξαν
  choice: a glória
  rationale: Em João, δόξα carrega com frequência o sentido de glória divina, mais amplo que mera honra ou esplendor.
- source_word: ἣν δέδωκάς μοι
  choice: que me deste
  rationale: O pretérito perfeito composto do português brasileiro sugeriria ação repetida ou contínua; o pretérito perfeito simples expressa naturalmente o ato realizado cujo efeito permanece no contexto.
- source_word: δέδωκα αὐτοῖς
  choice: lhes dei
  rationale: O pretérito perfeito simples é a forma portuguesa natural para o perfeito grego neste contexto, enquanto o pronome indireto «lhes» representa αὐτοῖς com concisão.
- source_word: ἵνα ὦσιν
  choice: para que sejam
  rationale: «Para que» conserva o valor de propósito ou resultado de ἵνα, e «sejam» corresponde naturalmente ao subjuntivo ὦσιν.
- source_word: ἓν
  choice: um
  rationale: Mantém o neutro singular conceitual e a formulação concisa do grego, sem substituir a imagem por uma interpretação como «unidos».
- source_word: καθὼς
  choice: assim como
  rationale: Marca de maneira clara e idiomática a comparação expressa pelo grego.
- source_word: ἡμεῖς ἕν
  choice: nós somos um
  rationale: Supre o verbo exigido em português e mantém aberta a natureza exata da unidade entre o Pai e o Filho.
theological_decisions:
- issue: Natureza da unidade dos discípulos em comparação com a unidade do Pai e do Filho
  choice: «para que sejam um, assim como nós somos um»
  alternative: Explicitar a unidade como apenas relacional, como participação na vida divina ou como unidade institucional/eclesial
  rationale: O texto estabelece uma comparação real, mas não define aqui a modalidade exata dessa unidade. A tradução conserva a tensão teológica sem impor uma interpretação posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega «lhes dei» e o pretérito perfeito simples por serem naturais em português, sem perder o valor resultante dos perfeitos gregos. A repetição de «um» preserva a concisão e a abertura teológica do original.
