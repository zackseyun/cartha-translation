id: JHN.17.11
reference: John 17:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐκέτι εἰμὶ ἐν τῷ κόσμῳ, καὶ ⸀αὐτοὶ ἐν τῷ κόσμῳ εἰσίν, κἀγὼ πρὸς σὲ ἔρχομαι. πάτερ ἅγιε, τήρησον αὐτοὺς ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι, ἵνα ὦσιν ἓν ⸀καθὼς ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/011.yaml
  text: And I am no longer in the world[a], but they are in the world, and I am coming to you. Holy Father, keep them in your name, which you have given to me, so that they may be one[b], just as we are.
translation:
  language: pt
  text: Eu já não estou no mundo, mas eles estão no mundo, e estou indo para junto de ti. Pai santo, guarda-os em teu nome[a], o qual me deste[b], para que sejam um, assim como nós.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “guarda-os por meio do teu nome” ou “protege-os pela autoridade do teu nome”. A expressão grega pode indicar esfera, meio ou autoridade.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos trazem uma forma entendida como “guarda em teu nome aqueles que me deste”. Esta tradução segue o texto do SBLGNT, no qual “o qual” se refere a “nome”.
    reason: textual_variant
lexical_decisions:
- source_word: οὐκέτι
  choice: já não
  rationale: Expressa de modo natural em português a cessação vista a partir do momento presente de Jesus.
- source_word: κόσμος
  choice: mundo
  rationale: Preserva o termo característico de João para a esfera humana e terrena na qual os discípulos permanecem.
- source_word: κἀγὼ πρὸς σὲ ἔρχομαι
  choice: e estou indo para junto de ti
  rationale: O presente grego tem valor progressivo ou iminente. Em português, do ponto de vista de quem parte, “indo para junto de ti” comunica naturalmente o movimento em direção ao Pai.
- source_word: πάτερ ἅγιε
  choice: Pai santo
  rationale: Mantém o vocativo e une a intimidade de “Pai” à santidade expressa pelo adjetivo.
- source_word: τήρησον
  choice: guarda-os
  rationale: “Guardar” conserva a amplitude de τηρέω, que pode envolver proteção, preservação e cuidado fiel, sem restringir o sentido à segurança física.
- source_word: ἐν τῷ ὀνόματί σου
  choice: em teu nome
  rationale: Mantém a preposição aberta às ideias de esfera, meio e autoridade, sem resolver na tradução uma ambiguidade genuína.
- source_word: ᾧ δέδωκάς μοι
  choice: o qual me deste
  rationale: O pronome relativo grego concorda com “nome”; “o qual” torna essa relação gramatical clara sem recorrer a paráfrase.
- source_word: ἵνα ὦσιν ἓν
  choice: para que sejam um
  rationale: “Para que” expressa a finalidade introduzida por ἵνα, e “sejam um” preserva a formulação concisa sobre a unidade dos discípulos.
- source_word: καθὼς ἡμεῖς
  choice: assim como nós
  rationale: Conserva a comparação entre a unidade dos discípulos e a do Pai e do Filho sem definir além do que o texto afirma.
theological_decisions:
- issue: Sentido de “guarda-os em teu nome”
  choice: Manter “em teu nome” no texto principal.
  alternative: “Guarda-os por meio do teu nome” ou “protege-os pela autoridade do teu nome”.
  rationale: A expressão grega pode indicar esfera, meio ou autoridade. A formulação escolhida preserva essa amplitude e evita impor uma única interpretação.
- issue: Referente de “o qual me deste”
  choice: Entender o pronome relativo como referência a “nome”, conforme o texto do SBLGNT.
  alternative: Entender a frase como “aqueles que me deste”, segundo uma leitura manuscrita alternativa.
  rationale: Na leitura apresentada pelo SBLGNT, o pronome relativo concorda gramaticalmente com “nome”; a tradução explicita essa ligação sem ocultar a variante textual.
- issue: Natureza da unidade em “para que sejam um, assim como nós”
  choice: Preservar a comparação direta sem definir a natureza metafísica da unidade.
  alternative: Reduzir a expressão a mera cooperação moral ou interpretá-la como identidade ontológica.
  rationale: O texto estabelece uma analogia teologicamente significativa, mas não explica neste versículo todos os seus aspectos. A tradução mantém essa tensão.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas de segunda pessoa do singular (“ti”, “teu”) adequadas à oração dirigida ao Pai. “Estou indo para junto de ti” é natural em português e comunica o movimento iminente sem perder a orientação relacional da expressão grega.
