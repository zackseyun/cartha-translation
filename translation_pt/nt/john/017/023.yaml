source:
  edition: SBLGNT
  text: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί, ἵνα ὦσιν τετελειωμένοι εἰς ἕν, ⸀ἵνα γινώσκῃ ὁ κόσμος ὅτι σύ με ἀπέστειλας καὶ ἠγάπησας αὐτοὺς καθὼς ἐμὲ ἠγάπησας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/023.yaml
  text: I in them and you in me[a], so that they may be perfected into one, so that the world may know that you sent me and loved them just as you loved me.
translation:
  language: pt
  text: Eu neles e tu em mim, para que sejam aperfeiçoados na unidade[a], a fim de que o mundo saiba que tu me enviaste e os amaste assim como me amaste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sejam feitos perfeitos na unidade» ou «sejam levados à plena unidade».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτοῖς / ἐν ἐμοί
  choice: neles / em mim
  rationale: Preserva a linguagem joanina de habitação mútua mediante a preposição «em», sem enfraquecê-la com «entre».
- source_word: τετελειωμένοι
  choice: aperfeiçoados
  rationale: O particípio perfeito passivo indica um estado resultante de uma ação levada à plenitude. «Aperfeiçoados» conserva tanto a ideia de completude quanto a nuance transformadora, sem limitar o sentido à perfeição moral sem pecado.
- source_word: εἰς ἕν
  choice: em um
  rationale: Em português, «aperfeiçoados em um» expressa de modo natural o resultado visado por εἰς ἕν, isto é, a unidade, preservando o numeral e evitando uma formulação artificial como «para dentro de um».
- source_word: γινώσκῃ
  choice: saiba
  rationale: Tradução direta e idiomática do presente do subjuntivo na oração introduzida por ἵνα; preserva a finalidade sem acrescentar a nuance interpretativa de um processo de vir a conhecer.
- source_word: κόσμος
  choice: o mundo
  rationale: Mantém a expressão joanina sem substituí-la por uma explicação interpretativa como «as pessoas do mundo».
- source_word: ἀπέστειλας
  choice: enviaste
  rationale: É a tradução natural e coerente de ἀποστέλλω em João, preservando a missão do Filho pelo Pai.
- source_word: ἠγάπησας
  choice: amaste
  rationale: Mantém a repetição lexical do verbo em ambas as ocorrências e o paralelismo da frase.
- source_word: καθὼς
  choice: assim como
  rationale: Marca claramente a comparação real estabelecida pelo grego, sem suavizá-la nem explicar em excesso seu alcance.
theological_decisions:
- issue: Força da comparação em «os amaste assim como me amaste»
  choice: 'Manter a comparação direta: «assim como me amaste».'
  alternative: «como me amaste» ou uma paráfrase atenuada, como «com o mesmo tipo de amor».
  rationale: καθὼς introduz uma comparação substantiva. A tradução conserva o peso teológico da relação entre o amor do Pai pelos discípulos e seu amor pelo Filho, sem definir além do texto a natureza ou a extensão dessa correspondência.
- issue: Sentido de τετελειωμένοι no contexto
  choice: 'Expressar uma ação consumada cujo resultado se orienta para a unidade: «sejam aperfeiçoados em um».'
  alternative: «sejam feitos perfeitos em um» ou «sejam levados à plena unidade».
  rationale: A forma perfeita passiva comunica um estado de completude produzido neles. A redação mantém a tensão entre aperfeiçoamento e unidade, sem interpretar a expressão exclusivamente como perfeição moral absoluta nem reduzir seu sentido a mera coesão social.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção elíptica inicial «eu neles, e tu em mim» acompanha o grego e o fluxo da oração. Empregou-se «tu» por coerência sintática e para preservar a oração direta ao Pai; «a fim de que» distingue com naturalidade a segunda oração de finalidade sem alterar a repetição de ἵνα.
