  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/020.yaml
  text: I do not ask concerning these only[a], but also concerning those who believe in me through their word[b],
translation:
  language: pt
  text: Não peço somente por estes, mas também por aqueles que creem em mim por meio da palavra deles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por meio da mensagem deles».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: peço
  rationale: No contexto da oração de Jesus ao Pai, «peço» expressa com naturalidade o ato de fazer um pedido, sem acrescentar ao verbo a formulação religiosa mais específica de «oro».
- source_word: περὶ τούτων
  choice: por estes
  rationale: Embora περί com o genitivo possa ser vertido formalmente por «a respeito de», em português o verbo «pedir» neste contexto rege naturalmente «por», indicando as pessoas em favor de quem Jesus pede. «Estes» mantém a referência implícita aos discípulos imediatos.
- source_word: μόνον
  choice: somente
  rationale: Reproduz claramente a limitação de alcance expressa por μόνον e forma a correlação natural «não somente... mas também».
- source_word: ἀλλὰ καὶ
  choice: mas também
  rationale: Preserva tanto o contraste quanto a ampliação do pedido para além do grupo imediato.
- source_word: τῶν πιστευόντων
  choice: aqueles que creem
  rationale: O particípio presente substantivado é expresso de modo natural, conservando sua força verbal sem convertê-lo no substantivo mais estático «crentes».
- source_word: διὰ τοῦ λόγου αὐτῶν
  choice: por meio da palavra deles
  rationale: «Por meio de» comunica o valor instrumental de διά; «palavra» conserva a proximidade lexical e a ressonância joanina de λόγος, enquanto a nota registra a alternativa contextual «mensagem».
- source_word: εἰς ἐμέ
  choice: em mim
  rationale: Com πιστεύω, a expressão grega é idiomaticamente traduzida por «crer em», preservando o objeto pessoal da fé.
- source_word: Οὐ ... μόνον
  choice: Não peço somente
  rationale: Mantém o presente e a estrutura de negação com limitador, em formulação corrente e digna em português.
theological_decisions:
- issue: Alcance da oração de Jesus para além dos discípulos imediatos
  choice: A formulação abrange aqueles que creem em Jesus por meio do testemunho dos discípulos, sem explicitar quando isso ocorre.
  alternative: Entender a expressão exclusivamente como referência a um círculo mais restrito de pessoas que já começavam a crer por meio dos discípulos.
  rationale: O particípio presente τῶν πιστευόντων e a expressão instrumental διὰ τοῦ λόγου αὐτῶν ampliam o alcance para além de «estes», mas o grego não contém explicitamente um verbo futuro. Por isso, «creem» preserva a abertura temporal e evita acrescentar «crerão».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A correlação «não somente... mas também» é natural; «por estes» se ajusta ao contexto de intercessão, e «palavra deles» mantém a textura joanina sem impedir a leitura contextual de «mensagem».
