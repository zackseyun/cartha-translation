source:
  edition: SBLGNT
  text: νῦν δὲ πρὸς σὲ ἔρχομαι, καὶ ταῦτα λαλῶ ἐν τῷ κόσμῳ ἵνα ἔχωσιν τὴν χαρὰν τὴν ἐμὴν πεπληρωμένην ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/013.yaml
  text: But now I am coming to you[b][a], and I am speaking these things in the world so that they may have my joy fulfilled in themselves.
translation:
  language: pt
  text: Mas agora vou para ti e digo estas coisas no mundo, para que tenham em si mesmos a minha alegria completa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Mas agora
  rationale: νῦν assinala o momento presente, e δέ introduz uma transição com leve contraste em relação ao que precede.
- source_word: πρὸς σὲ ἔρχομαι
  choice: vou para ti
  rationale: Embora ἔρχομαι possa ser vertido formalmente por “venho”, em português o movimento do falante em direção ao interlocutor é expresso naturalmente por “vou para ti”; o presente aponta para a partida iminente de Jesus para o Pai.
- source_word: ταῦτα λαλῶ
  choice: digo estas coisas
  rationale: Expressa de modo claro e corrente o ato presente de Jesus falar estas palavras.
- source_word: ἐν τῷ κόσμῳ
  choice: enquanto estou no mundo
  rationale: A formulação explicita o valor circunstancial mais provável da expressão no contexto, sem perder a referência joanina ao mundo.
- source_word: ἵνα ἔχωσιν
  choice: para que tenham
  rationale: Preserva a finalidade introduzida por ἵνα em português natural.
- source_word: τὴν χαρὰν τὴν ἐμὴν
  choice: a minha alegria
  rationale: 'Mantém o possessivo enfático: trata-se da alegria pertencente a Jesus, sem explicar além do texto como ela é partilhada.'
- source_word: πεπληρωμένην
  choice: completa
  rationale: O particípio perfeito passivo de πληρόω apresenta a alegria como levada à plenitude e permanecendo nesse estado; “completa” é natural e conserva esse resultado.
- source_word: ἐν ἑαυτοῖς
  choice: em si mesmos
  rationale: Mantém a expressão reflexiva e sua referência à presença ou experiência interior da alegria nos discípulos, sem substituir por uma paráfrase mais interpretativa.
theological_decisions:
- issue: Natureza de “minha alegria”
  choice: A alegria é apresentada como pertencente a Jesus e presente plenamente nos discípulos.
  alternative: Entender “minha alegria” principalmente como a alegria dos discípulos a respeito de Jesus.
  rationale: O possessivo ἐμὴν indica mais naturalmente a alegria do próprio Jesus. A tradução conserva essa relação sem definir doutrinariamente de que modo os discípulos participam dela.
- issue: Localização expressa por ἐν ἑαυτοῖς
  choice: “em si mesmos”, indicando que a alegria está neles.
  alternative: “entre si”, indicando uma dimensão coletiva entre os discípulos.
  rationale: O reflexivo plural admite alguma amplitude, mas neste contexto a leitura interior é mais natural; a formulação formal preserva a expressão sem desenvolver uma teoria sobre sua natureza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ti” mantém o tratamento singular dirigido ao Pai sem recorrer a uma forma regional excessivamente coloquial. A ordem final conserva a relação entre “alegria completa” e “em si mesmos” de modo natural.
