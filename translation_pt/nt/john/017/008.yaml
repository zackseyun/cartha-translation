reference: John 17:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι τὰ ῥήματα ἃ ⸀ἔδωκάς μοι δέδωκα αὐτοῖς, καὶ αὐτοὶ ἔλαβον καὶ ἔγνωσαν ἀληθῶς ὅτι παρὰ σοῦ ἐξῆλθον, καὶ ἐπίστευσαν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/008.yaml
  text: For the words that you gave me I have given to them[a], and they received them and truly came to know that I came from you[b], and they believed that you sent me.
translation:
  language: pt
  text: Pois as palavras que me deste, eu as dei a eles[a]; eles as receberam e verdadeiramente reconheceram que vim de ti[b], e creram que tu me enviaste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as declarações que me deste”.
    reason: lexical_alternative
  - marker: b
    text: Ou “saí de junto de ti”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥήματα
  choice: palavras
  rationale: Preserva o plural concreto e o sentido de palavras ou declarações proferidas, sem reduzi-las ao singular interpretativo “mensagem”.
- source_word: ἔδωκάς ... δέδωκα
  choice: me deste ... eu as dei
  rationale: O português natural emprega o pretérito perfeito nos dois casos; a relação entre a dádiva recebida do Pai e sua transmissão aos discípulos permanece clara no contexto.
- source_word: αὐτοῖς
  choice: a eles
  rationale: Explicita o objeto indireto do verbo “dar” de modo claro e corrente em português internacional.
- source_word: ἔλαβον
  choice: receberam
  rationale: Expressa adequadamente a recepção daquilo que Jesus lhes deu, sem a materialidade de “tomaram” nem a interpretação adicional de “aceitaram”.
- source_word: ἔγνωσαν ἀληθῶς
  choice: verdadeiramente reconheceram
  rationale: “Reconheceram” comunica a percepção alcançada no aoristo, enquanto “verdadeiramente” preserva diretamente o advérbio ἀληθῶς.
- source_word: παρὰ σοῦ ἐξῆλθον
  choice: vim de ti
  rationale: Expressa origem de forma idiomática e preserva o peso teológico da afirmação sem introduzir terminologia doutrinária posterior.
- source_word: ἐπίστευσαν
  choice: creram
  rationale: Com a oração introduzida por ὅτι, indica que reconheceram como verdadeira a afirmação de que o Pai enviou Jesus.
- source_word: ἀπέστειλας
  choice: enviaste
  rationale: Equivalente direto e suficientemente expressivo para o envio de Jesus pelo Pai.
- source_word: ὅτι
  choice: Pois
  rationale: O ὅτι inicial tem força explicativa em relação ao contexto anterior; “Pois” conserva essa conexão com dignidade e naturalidade.
theological_decisions:
- issue: Relação entre Jesus e o Pai em παρὰ σοῦ ἐξῆλθον
  choice: vim de ti
  alternative: saí de junto de ti
  rationale: A opção principal preserva a ideia de origem e soa natural em português, sem definir além do texto a natureza dessa procedência.
- issue: Sentido de πιστεύω seguido de oração com ὅτι
  choice: creram que
  alternative: acreditaram que
  rationale: A construção apresenta como objeto uma afirmação — que o Pai enviou Jesus. “Creram que” mantém essa força proposicional e o registro bíblico digno sem convertê-la indevidamente em uma expressão apenas relacional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém a repetição de “dar” e os dois atos distintos de reconhecer e crer. Os pronomes “ti” e “tu” preservam a referência direta ao Pai sem recorrer a formas excessivamente formais.
