  source_fidelity: 'O texto traduz com fidelidade a cadeia sintática e semântica do grego: as palavras dadas pelo Pai são dadas por Jesus aos discípulos; eles as recebem, reconhecem verdadeiramente a origem de Jesus no Pai e creem que o Pai o enviou. «Vim de ti» preserva adequadamente o sentido de origem de παρὰ σοῦ ἐξῆλθον sem impor formulação doutrinária posterior.'
  naturalness: O português é moderno, claro e de registro apropriado. A construção «as palavras que me deste, eu as dei a eles» é um pouco marcada pela topicalização, mas é natural e dá boa ênfase ao objeto sem comprometer a fluidez. «Verdadeiramente reconheceram» é uma opção compreensível e digna para ἔγνωσαν ἀληθῶς.
  terminology: «Palavras», «receberam», «creram» e «enviaste» são equivalentes diretos e adequados. O uso de «tu/ti» mantém coerência interna e legibilidade, inclusive para leitores brasileiros, sem alterar o registro. As notas oferecem alternativas lexicais legítimas e os marcadores estão corretamente posicionados.
