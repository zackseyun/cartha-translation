  text: καὶ ὑπὲρ αὐτῶν ἐγὼ ἁγιάζω ἐμαυτόν, ἵνα ⸂ὦσιν καὶ αὐτοὶ⸃ ἡγιασμένοι ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/019.yaml
  text: And for their sake I sanctify myself[b][a], so that they also may be sanctified in truth.
translation:
  language: pt
  text: E por eles eu me santifico[a], para que também eles sejam santificados na verdade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu me consagro”. O mesmo verbo grego é traduzido por “sejam santificados” mais adiante no versículo.'
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “em verdade”. Compare 17:17.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ αὐτῶν
  choice: por eles
  rationale: Ὑπέρ com o genitivo indica benefício ou atuação em favor de alguém. “Por eles” é natural em português e preserva a amplitude da expressão sem explicitar além do texto uma ideia de substituição.
- source_word: ἁγιάζω ἐμαυτόν
  choice: eu me santifico
  rationale: Mantém a forma reflexiva e torna visível a repetição da mesma raiz verbal em ἡγιασμένοι. Neste contexto, “santifico” pode significar dedicar ou consagrar para uma missão, sem implicar passagem de impureza moral para pureza.
- source_word: ἵνα
  choice: para que
  rationale: Expressa de modo natural a finalidade introduzida pela conjunção.
- source_word: ὦσιν καὶ αὐτοὶ
  choice: também eles sejam
  rationale: Preserva tanto a inclusão marcada por καί quanto a ênfase de αὐτοί em uma ordem natural no português.
- source_word: ἡγιασμένοι
  choice: santificados
  rationale: O particípio perfeito passivo descreve um estado resultante e conserva a correspondência lexical com “me santifico” na primeira oração.
- source_word: ἐν ἀληθείᾳ
  choice: na verdade
  rationale: A construção pode indicar a esfera ou realidade em que ocorre a santificação. “Na verdade” é idiomático e mantém a ressonância com João 17:17, embora o grego aqui não tenha artigo.
theological_decisions:
- issue: Sentido da autossantificação de Jesus
  choice: Preservar “eu me santifico”, entendendo o verbo contextualmente como dedicação ou consagração de si mesmo em favor dos discípulos.
  alternative: “Eu me consagro.”
  rationale: A alternativa explicita bem o sentido contextual, mas elimina a repetição da raiz de ἁγιάζω/ἡγιασμένοι. A tradução principal mantém a ligação verbal sem sugerir necessariamente que Jesus passa de impureza moral para santidade.
- issue: Força de ἐν ἀληθείᾳ
  choice: “na verdade”, como esfera ou realidade da santificação.
  alternative: “em verdade” ou “pela verdade”.
  rationale: O texto grego permite alguma abertura semântica. “Na verdade” mantém a ligação contextual com 17:17 sem decidir que a verdade seja explicitamente o instrumento, como faria “pela verdade”.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição “santifico/santificados” foi mantida para refletir a repetição lexical do grego; as notas preservam as principais alternativas sem sobrecarregar o texto.
