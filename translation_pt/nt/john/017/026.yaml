  text: καὶ ἐγνώρισα αὐτοῖς τὸ ὄνομά σου καὶ γνωρίσω, ἵνα ἡ ἀγάπη ἣν ἠγάπησάς με ἐν αὐτοῖς ᾖ κἀγὼ ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/026.yaml
  text: And I made your name known to them[a], and I will make it known, so that the love with which you loved me may be in them[c][b], and I in them.
translation:
  language: pt
  text: Eu lhes dei a conhecer o teu nome[a] e o darei a conhecer, para que o amor com que me amaste esteja neles[b], e eu, neles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“O teu nome” se refere à identidade e ao caráter de Deus tal como são revelados, e não apenas a uma designação pronunciada. Ou: “Eu lhes revelei o teu nome e o revelarei”.'
    reason: Nota cultural e alternativa lexical.
  - marker: b
    text: 'Ou: “esteja entre eles”; “neles” traduz mais diretamente o grego e preserva a possível ideia joanina de habitação interior.'
    reason: Alternativa lexical.
lexical_decisions:
- source_word: ἐγνώρισα
  choice: dei a conhecer
  rationale: Traduz naturalmente o aoristo causativo de γνωρίζω e mantém o paralelismo com o futuro γνωρίσω.
- source_word: τὸ ὄνομά σου
  choice: o teu nome
  rationale: Conserva a expressão concreta do grego e sua profundidade joanina sem substituí-la por uma explicação interpretativa.
- source_word: γνωρίσω
  choice: continuarei a dá-lo a conhecer
  rationale: O futuro indica que Jesus ainda dará a conhecer o nome do Pai; “continuarei” torna natural a sequência após a ação já realizada, sem alterar seu referente.
- source_word: ἵνα
  choice: para que
  rationale: Expressa de modo claro a força de propósito ou resultado da construção grega.
- source_word: ἣν ἠγάπησάς με
  choice: com que me amaste
  rationale: Reproduz de forma idiomática a relação entre “o amor” e o ato do Pai de amar o Filho.
- source_word: ἐν αὐτοῖς
  choice: neles
  rationale: É a tradução mais direta e preserva a possível ideia joanina de habitação interior, sem excluir outras nuances contextuais.
- source_word: κἀγὼ ἐν αὐτοῖς
  choice: e eu neles
  rationale: Mantém a elipse compacta do grego, deixando subentendido o verbo “esteja” sem explicitar uma relação teológica que o texto não define.
theological_decisions:
- issue: Sentido de “o teu nome”
  choice: Manter “o teu nome” no texto principal.
  alternative: “quem tu és” ou “o teu caráter”
  rationale: Em João, “nome” envolve a identidade e o caráter revelados do Pai, mas a tradução deve preservar a imagem bíblica em vez de inserir sua interpretação no corpo do versículo.
- issue: Relação entre o amor do Pai e a presença de Cristo nos discípulos
  choice: 'Apresentar os dois elementos coordenadamente: “o amor ... esteja neles, e eu neles”.'
  alternative: Explicitar “e para que eu esteja neles” ou uma relação causal entre ambos.
  rationale: O grego coordena as duas realidades e deixa o verbo elíptico na última expressão; não especifica uma relação causal ou subordinada.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção natural para leitores brasileiros. Emprega “teu” em coerência com a oração dirigida ao Pai e conserva a concisão da cláusula final.
