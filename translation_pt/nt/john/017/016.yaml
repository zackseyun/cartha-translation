id: JHN.17.16
reference: John 17:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐκ τοῦ κόσμου οὐκ εἰσὶν καθὼς ἐγὼ ⸂οὐκ εἰμὶ ἐκ τοῦ κόσμου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/016.yaml
  text: They are not from the world[a], just as I am not from the world.
translation:
  language: pt
  text: Eles não são do mundo[a], assim como eu não sou do mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «procedentes do mundo». A expressão grega pode indicar origem, procedência ou pertencimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: do
  rationale: A contração «do» (de + o) traduz naturalmente ἐκ τοῦ em português e, neste contexto, pode expressar origem, procedência ou pertencimento, preservando a amplitude da expressão grega.
- source_word: κόσμου
  choice: mundo
  rationale: Mantém o termo simples e recorrente no Evangelho de João, sem restringi-lo por paráfrases interpretativas como «sistema do mundo» ou «ordem caída».
- source_word: οὐκ εἰσὶν
  choice: não são
  rationale: Reproduz diretamente a negação e o presente do verbo εἰμί na terceira pessoa do plural.
- source_word: καθὼς
  choice: assim como
  rationale: Introduz com clareza e naturalidade a comparação entre os discípulos e Jesus.
- source_word: ἐγὼ
  choice: eu
  rationale: Retém o pronome explícito, que reforça o segundo termo da comparação.
- source_word: οὐκ εἰμὶ
  choice: não sou
  rationale: Reproduz diretamente a negação e o presente de εἰμί na primeira pessoa do singular.
- source_word: ἐκ τοῦ κόσμου
  choice: do mundo
  rationale: A mesma expressão é mantida nas duas orações. «Do mundo» é idiomático em português e admite tanto a ideia de origem quanto a de pertencimento.
theological_decisions:
- issue: Sentido de «mundo» na teologia joanina
  choice: Manter «mundo» sem expansão interpretativa no texto principal.
  alternative: «sistema do mundo» ou «ordem presente afastada de Deus»
  rationale: Embora κόσμος possa designar em João a humanidade ou a ordem humana em oposição a Deus, o versículo não explicita uma dessas formulações. A tradução simples preserva a tensão e a amplitude do uso joanino.
- issue: Amplitude de ἐκ τοῦ κόσμου
  choice: Traduzir como «do mundo» e explicar sua amplitude em nota.
  alternative: «procedentes do mundo» ou «pertencentes ao mundo»
  rationale: O grego pode indicar origem, procedência ou pertencimento. Escolher apenas uma dessas explicações no texto principal estreitaria a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de «do mundo» foi preservada para refletir a estrutura paralela do grego.
