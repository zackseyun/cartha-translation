reference: John 17:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα πάντες ἓν ὦσιν, καθὼς σύ, ⸀πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, ἵνα καὶ αὐτοὶ ἐν ⸀ἡμῖν ὦσιν, ἵνα ὁ κόσμος ⸀πιστεύῃ ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/021.yaml
  text: that they may all be one[a], just as you, Father, are in me and I am in you; that they also may be in us[c][b], so that the world may believe that you sent me.
translation:
  language: pt
  text: para que todos sejam um[a], assim como tu, Pai, estás em mim, e eu em ti; para que eles também estejam em nós[b], a fim de que o mundo creia[c] que tu me enviaste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para que todos estejam unidos». O grego diz mais literalmente «para que todos sejam um», expressão que preserva um sentido mais amplo de unidade sem limitá-lo a um único aspecto.'
    reason: lexical_alternative
  - marker: b
    text: A repetição de «em» — «em mim», «em ti», «em nós» — reflete a linguagem joanina de habitação mútua e participação; seu sentido é mais forte que o de mera associação.
    reason: cross_reference
  - marker: c
    text: 'Ou: «venha a crer». O grego permite entender que o mundo creia, sem especificar se a ênfase está em começar a crer ou em continuar crendo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: para que / a fim de que
  rationale: As três orações de finalidade ou resultado são preservadas. A variação final para «a fim de que» mantém o encadeamento e evita uma sequência pesada em português.
- source_word: πάντες
  choice: todos
  rationale: Tradução direta e natural, preservando o alcance universal da oração de Jesus.
- source_word: ἓν
  choice: um
  rationale: Mantém o singular neutro e a amplitude da unidade expressa pelo grego, sem reduzi-la a um único aspecto.
- source_word: καθὼς
  choice: assim como
  rationale: Marca claramente a comparação entre a unidade dos discípulos e a relação entre o Pai e o Filho.
- source_word: πάτερ
  choice: Pai
  rationale: Preserva o vocativo e seu valor relacional e teológico.
- source_word: ἐν ἐμοὶ ... ἐν σοί
  choice: em mim ... em ti
  rationale: Reproduz de modo coerente a preposição ἐν e conserva a linguagem joanina de habitação mútua e participação.
- source_word: κἀγώ
  choice: e eu
  rationale: 'Expressa naturalmente a coordenação e a reciprocidade: «e eu em ti».'
- source_word: καὶ αὐτοὶ
  choice: eles também
  rationale: Preserva a força aditiva de καί, ligando a participação dos discípulos à relação entre o Pai e o Filho.
- source_word: ἐν ἡμῖν
  choice: em nós
  rationale: Mantém a formulação grega e sua densidade joanina; «entre nós» enfraqueceria o sentido para mera associação.
- source_word: κόσμος
  choice: o mundo
  rationale: Conserva o termo característico de João e sua amplitude teológica.
- source_word: πιστεύῃ
  choice: creia
  rationale: Traduz naturalmente o presente do subjuntivo sem impor se a ênfase recai no começo ou na continuidade da fé.
- source_word: ἀπέστειλας
  choice: enviaste
  rationale: O pretérito perfeito simples corresponde bem ao aoristo e é natural no português contemporâneo.
theological_decisions:
- issue: Natureza da unidade dos discípulos em relação ao Pai e ao Filho
  choice: Traduzir ἓν por «um» e preservar «em nós» sem ampliação interpretativa.
  alternative: «para que todos estejam unidos» ou «para que todos tenham o mesmo propósito»
  rationale: O texto compara a unidade dos discípulos à relação entre o Pai e o Filho, mas não a define exclusivamente como unidade organizacional, moral ou metafísica. A formulação conserva essa profundidade e tensão sem impor uma construção doutrinária posterior.
- issue: Linguagem joanina de habitação e participação
  choice: Usar literalmente «em mim», «em ti» e «em nós».
  alternative: «comigo», «contigo» e «conosco» ou «unidos a nós»
  rationale: A repetição de ἐν é significativa. Substituí-la por linguagem de simples companhia ou explicá-la como união resolveria uma ambiguidade e reduziria a ressonância teológica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de «tu» acompanha a oração dirigida ao Pai e permite reproduzir com clareza as formas singulares do original. A pontuação conserva a progressão das três orações introduzidas por ἵνα.
