id: JHN.17.2
reference: John 17:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καθὼς ἔδωκας αὐτῷ ἐξουσίαν πάσης σαρκός, ἵνα πᾶν ὃ δέδωκας αὐτῷ ⸀δώσῃ αὐτοῖς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/002.yaml
  text: just as you gave him authority over all flesh[a], so that to all whom you have given him[b], he may give eternal life.
translation:
  language: pt
  text: assim como lhe deste autoridade sobre toda a humanidade[a], para que ele dê a vida eterna a todos os que lhe deste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «sobre toda carne»; expressão bíblica que significa toda a humanidade.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «tudo o que lhe deste»; o grego emprega uma expressão coletiva no singular neutro para se referir às pessoas dadas ao Filho.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: assim como
  rationale: Preserva a relação de correspondência com o pedido do versículo anterior e soa natural em português.
- source_word: ἔδωκας
  choice: deste
  rationale: O aoristo é traduzido pelo pretérito perfeito simples, indicando a concessão da autoridade pelo Pai ao Filho.
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: Expressa direito e jurisdição concedidos, não apenas capacidade ou força.
- source_word: πάσης σαρκός
  choice: sobre toda a humanidade
  rationale: A expressão grega, literalmente «toda carne», é um idiomatismo bíblico referente a todos os seres humanos. A formulação no texto principal evita que o leitor moderno entenda «carne» como corpo físico ou natureza pecaminosa; a forma literal é preservada em nota.
- source_word: ἵνα
  choice: para que
  rationale: Marca naturalmente em português a finalidade ou o resultado pretendido.
- source_word: πᾶν ὃ
  choice: a todos os que
  rationale: Embora a construção grega seja neutra singular e coletiva, seu referente são pessoas. Esta formulação comunica isso com clareza sem apagar a forma peculiar do original, registrada em nota.
- source_word: δέδωκας
  choice: deste
  rationale: Em português, o pretérito perfeito composto teria valor aspectual diferente do perfeito grego. O pretérito perfeito simples expressa melhor o ato concluído, cujo resultado permanece no contexto.
- source_word: δώσῃ
  choice: ele dê
  rationale: O presente do subjuntivo após «para que» é a construção portuguesa natural para o aoristo subjuntivo grego nesta oração final.
- source_word: αὐτοῖς
  choice: a todos os que lhe deste
  rationale: O pronome dativo plural é ligado explicitamente ao grupo coletivo antecedente, produzindo uma frase clara em português.
- source_word: ζωὴν αἰώνιον
  choice: a vida eterna
  rationale: É a expressão joanina consagrada e semanticamente adequada, abrangendo duração sem fim e a vida própria da era vindoura.
theological_decisions:
- issue: Alcance de «toda a humanidade» e referente de «todos os que lhe deste»
  choice: Manter a autoridade universal do Filho sobre toda a humanidade e, ao mesmo tempo, identificar como receptores da vida eterna aqueles que o Pai lhe deu.
  alternative: Generalizar os receptores da vida eterna a toda a humanidade, ou formular a frase de modo a restringir a autoridade do Filho somente aos que lhe foram dados.
  rationale: O próprio grego distingue o alcance universal da autoridade do Filho do grupo coletivo ao qual ele dá a vida eterna. A tradução preserva essa tensão sem impor um sistema doutrinário.
- issue: Sentido coletivo do neutro singular πᾶν ὃ
  choice: Traduzir no texto como «todos os que», com nota sobre a forma literal coletiva.
  alternative: Traduzir literalmente «tudo o que», o que poderia sugerir coisas em vez de pessoas.
  rationale: O pronome plural αὐτοῖς confirma que o coletivo neutro se refere a pessoas. A solução mantém a referência pessoal clara e registra a forma grega na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega «lhe deste», evitando uma sequência pronominal pouco natural. A ordem foi ajustada ao português corrente, sem confundir «toda a humanidade» com o grupo dos que foram dados ao Filho.
