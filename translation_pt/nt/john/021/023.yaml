  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ⸂οὗτος ὁ λόγος⸃ εἰς τοὺς ἀδελφοὺς ὅτι ὁ μαθητὴς ἐκεῖνος οὐκ ἀποθνῄσκει. ⸂οὐκ εἶπεν δὲ⸃ αὐτῷ ὁ Ἰησοῦς ὅτι οὐκ ἀποθνῄσκει ἀλλ’· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/023.yaml
  text: So this report spread among the brothers that that disciple would not die. Yet Jesus did not say to him that he would not die, but, “If I want him to remain until I come, what is that to you?”
translation:
  language: pt
  text: 'Assim, espalhou-se entre os irmãos[b] a notícia[a] de que aquele discípulo não morreria. Jesus, porém, não lhe disse que aquele discípulo não morreria, mas: “Se eu quiser que ele permaneça até que eu venha, o que isso importa a você?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “essa declaração”. O grego λόγος pode significar “palavra”, “declaração”, “dito” ou, neste contexto, uma notícia que circula.
    reason: lexical_alternative
  - marker: b
    text: “Irmãos” refere-se aqui à comunidade dos discípulos; o grego emprega o plural masculino ἀδελφοί.
    reason: cultural_note
  - marker: c
    text: 'Jesus não prometeu que esse discípulo jamais morreria; ele formulou uma condição: “Se eu quiser que ele permaneça até que eu venha...”'
    reason: interpretive_clarification
lexical_decisions:
- source_word: ἐξῆλθεν οὖν οὗτος ὁ λόγος
  choice: Assim, espalhou-se ... a notícia
  rationale: A construção descreve uma informação que passou a circular em um grupo. “Espalhou-se a notícia” comunica naturalmente esse sentido em português, sem atribuir veracidade à interpretação divulgada.
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: entre os irmãos
  rationale: Com o verbo de disseminação, εἰς indica a comunidade dentro da qual a notícia circulou. “Irmãos” preserva o plural masculino do grego e, no contexto, designa a comunidade dos discípulos.
- source_word: ὁ μαθητὴς ἐκεῖνος
  choice: aquele discípulo
  rationale: Mantém o demonstrativo e a referência específica ao discípulo mencionado no contexto imediato.
- source_word: οὐκ ἀποθνῄσκει
  choice: não morreria
  rationale: Embora o grego empregue o presente, o futuro do pretérito é natural em português no discurso indireto dependente de uma notícia passada.
- source_word: οὐκ εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς
  choice: Jesus, porém, não lhe disse
  rationale: “Porém” expressa a correção contrastiva introduzida por δέ; “lhe” traduz de modo conciso o dativo αὐτῷ, que se refere a Pedro.
- source_word: Ἐὰν αὐτὸν θέλω μένειν
  choice: Se eu quiser que ele permaneça
  rationale: “Quiser” preserva a volição expressa por θέλω, e “permaneça” mantém o sentido de μένω e sua ressonância joanina.
- source_word: ἕως ἔρχομαι
  choice: até que eu venha
  rationale: O presente grego tem referência futura dentro da condição. A tradução permanece próxima da forma do original sem explicitar interpretativamente “volte”.
- source_word: τί πρὸς σέ
  choice: o que isso importa a você?
  rationale: Expressa em português atual a pergunta idiomática que afasta a preocupação de Pedro com o destino do outro discípulo.
theological_decisions:
- issue: Natureza da afirmação difundida a respeito do discípulo
  choice: Apresentá-la como uma notícia que se espalhou, seguida da correção explícita do evangelista.
  alternative: Traduzir literalmente como “essa palavra saiu” ou entender a afirmação como promessa de Jesus.
  rationale: O próprio versículo distingue a interpretação difundida daquilo que Jesus realmente disse. A tradução não transforma a condição hipotética em promessa.
- issue: Sentido de “até que eu venha”
  choice: Preservar a formulação temporal e a ambiguidade do original.
  alternative: Explicitar como “até que eu volte” ou identificar uma ocasião específica da vinda.
  rationale: O texto não define aqui a natureza ou o momento dessa vinda; acrescentar essa identificação resolveria uma tensão que o grego conserva.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A ordem foi levemente ajustada para fluência natural, sem eliminar a correção enfática nem a condição hipotética do grego.
