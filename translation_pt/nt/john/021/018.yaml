id: JHN.21.18
reference: John 21:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι, ὅτε ἦς νεώτερος, ἐζώννυες σεαυτὸν καὶ περιεπάτεις ὅπου ἤθελες· ὅταν δὲ γηράσῃς, ἐκτενεῖς τὰς χεῖράς σου, καὶ ἄλλος ⸂σε ζώσει⸃ καὶ οἴσει ὅπου οὐ θέλεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/018.yaml
  text: Truly[a], truly, I say to you, when you were younger, you used to dress yourself and walk where you wanted; but when you grow old, you will stretch out your hands[c][b], and another will dress you and carry you where you do not want to go.
translation:
  language: pt
  text: '“Em verdade, em verdade[a] lhe digo: quando você era mais jovem, vestia-se[b] e andava por onde queria; mas, quando envelhecer, estenderá as mãos[c], e outra pessoa o vestirá e o levará[d] para onde você não quer ir.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “amém, amém”. A repetição introduz uma declaração solene e enfática.
    reason: lexical_alternative
  - marker: b
    text: Ou “cingia-se”. O verbo grego se refere literalmente a prender ou ajustar a roupa ao corpo; a mesma palavra aparece depois em “o vestirá”.
    reason: lexical_alternative
  - marker: c
    text: “Estenderá as mãos” é frequentemente entendido como uma alusão à morte de Pedro por crucificação. O versículo seguinte explica que Jesus disse isso para indicar com que tipo de morte Pedro glorificaria a Deus.
    reason: cross_reference
  - marker: d
    text: Ou “o carregará” ou “o conduzirá”. O verbo grego pode expressar a ideia de ser levado a um destino contra a própria vontade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Preserva a fórmula joanina duplicada, sua ênfase solene e seu sentido asseverativo em português claro e consagrado.
- source_word: λέγω σοι
  choice: lhe digo
  rationale: Mantém o discurso direto dirigido a Pedro, com formulação natural em português.
- source_word: ὅτε ἦς νεώτερος
  choice: quando você era mais jovem
  rationale: Reproduz o comparativo νεώτερος e prepara o contraste com a velhice mencionada em seguida.
- source_word: ἐζώννυες σεαυτόν
  choice: vestia-se
  rationale: Comunica naturalmente o ato de prender ou ajustar a própria roupa e destaca a antiga autonomia de Pedro; a imagem literal de cingir é registrada em nota.
- source_word: περιεπάτεις ὅπου ἤθελες
  choice: andava por onde queria
  rationale: Preserva a imagem concreta de deslocamento e a liberdade pessoal, sem atribuir ao verbo um sentido ético metafórico.
- source_word: ὅταν δὲ γηράσῃς
  choice: mas, quando envelhecer
  rationale: Expressa com naturalidade a referência futura da construção com ὅταν e o contraste introduzido por δέ.
- source_word: ἐκτενεῖς τὰς χεῖράς σου
  choice: estenderá as mãos
  rationale: Traduz diretamente a expressão sem explicitar no texto principal sua provável alusão à crucificação.
- source_word: ἄλλος σε ζώσει
  choice: outra pessoa o vestirá
  rationale: Retoma o mesmo campo semântico da ocorrência anterior de ζώννυμι e preserva o contraste entre autonomia e sujeição. 'Outra pessoa' evita a possível leitura de ἄλλος como necessariamente masculino.
- source_word: οἴσει
  choice: o levará
  rationale: No contexto, verte com naturalidade a ideia de alguém ser conduzido ou levado a um destino não desejado, enquanto a alternativa mais literal é preservada em nota.
- source_word: ὅπου οὐ θέλεις
  choice: para onde você não quer ir
  rationale: Acrescenta 'ir', implícito no grego, para completar de modo idiomático a expressão portuguesa sem alterar seu sentido.
theological_decisions:
- issue: Se a referência à morte de Pedro por crucificação deve ser explicitada nas palavras de Jesus
  choice: Manter a imagem literal no texto principal
  alternative: Traduzir a frase como uma predição explícita de crucificação ou de execução
  rationale: O versículo seguinte fornece a interpretação narrativa de que Jesus indicava o tipo de morte de Pedro. Manter aqui a formulação figurada preserva a progressão do próprio texto e sua tensão interpretativa.
- issue: Se ζώσει deve ser traduzido como 'amarrará' por causa do contexto de morte
  choice: Traduzir como 'vestirá', em paralelo com a primeira ocorrência do verbo
  alternative: Traduzir como 'cingirá' ou 'amarrará'
  rationale: A repetição lexical contrasta Pedro vestindo a si mesmo com outra pessoa fazendo isso por ele. 'Amarrará' tornaria explícita uma nuance possível, mas não obrigatória, e enfraqueceria o paralelismo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” para a segunda pessoa, evita arcaísmos no texto principal e conserva a cadência solene da fórmula inicial. A tradução mantém as imagens concretas do grego e deixa a explicação da morte de Pedro para a nota e para a progressão narrativa do versículo seguinte.
