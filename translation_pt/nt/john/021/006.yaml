source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Βάλετε εἰς τὰ δεξιὰ μέρη τοῦ πλοίου τὸ δίκτυον, καὶ εὑρήσετε. ἔβαλον οὖν, καὶ οὐκέτι αὐτὸ ἑλκύσαι ⸀ἴσχυον ἀπὸ τοῦ πλήθους τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/006.yaml
  text: But he said to them[a], “Cast the net on the right side of the boat, and you will find some.” So they cast it, and they were no longer able to haul it in because of the multitude of fish.
translation:
  language: pt
  text: 'Mas ele lhes disse: “Lancem a rede do lado direito do barco, e vocês encontrarão.”[a] Então a lançaram e já não conseguiam puxá-la para dentro, por causa da grande quantidade de peixes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e vocês encontrarão alguns”. O objeto (“peixes” ou “alguns”) fica implícito no contexto da pesca e não aparece expresso no grego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βάλετε
  choice: Lancem
  rationale: O imperativo de βάλλω, no contexto da pesca, refere-se naturalmente ao ato de lançar a rede; “lancem” é corrente e digno em português.
- source_word: τὰ δεξιὰ μέρη τοῦ πλοίου
  choice: do lado direito do barco
  rationale: A expressão literalmente aponta para as partes ou a região direita da embarcação; “lado direito do barco” transmite o sentido com clareza, sem jargão náutico.
- source_word: τὸ δίκτυον
  choice: a rede
  rationale: Equivalente direto e natural para a rede de pesca singular.
- source_word: καὶ εὑρήσετε
  choice: e vocês encontrarão
  rationale: Mantém sem objeto explícito a formulação grega, na qual o contexto da pesca permite entender o que seria encontrado.
- source_word: οὐκέτι αὐτὸ ἑλκύσαι ἴσχυον
  choice: já não conseguiam puxá-la para dentro
  rationale: Expressa tanto a incapacidade indicada por ἴσχυον quanto o movimento de recolher a rede indicado por ἑλκύσαι, em português natural.
- source_word: ἀπὸ τοῦ πλήθους τῶν ἰχθύων
  choice: por causa da grande quantidade de peixes
  rationale: Transmite a força causal de ἀπό e o grande número expresso por πλῆθος de modo claro e atual.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega “vocês” para o plural explícito e conserva a elipse do objeto em εὑρήσετε no texto principal, explicando-a em nota.
