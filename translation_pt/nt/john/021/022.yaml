id: JHN.21.22
reference: John 21:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ; σύ ⸂μοι ἀκολούθει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/022.yaml
  text: Jesus said to him[a], “If I want him to remain until I come[b], what is that to you? You follow me.”
translation:
  language: pt
  text: 'Jesus lhe disse: “Se eu quiser que ele permaneça até que eu venha[a], o que você tem com isso? Quanto a você, siga-me.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “até que eu venha” não especifica a que vinda de Jesus se refere; há diferentes interpretações, entre elas uma vinda em algum acontecimento histórico ou sua vinda final.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jesus lhe disse
  rationale: O presente histórico grego é vertido pelo passado narrativo natural em português.
- source_word: Ἐὰν
  choice: Se
  rationale: Introduz de modo natural a condição hipotética, sem acrescentar incerteza indevida.
- source_word: θέλω
  choice: eu quiser
  rationale: Expressa vontade ou desejo; no período condicional, “quiser” é a forma portuguesa mais natural e mantém aberta essa extensão semântica.
- source_word: μένειν
  choice: permaneça
  rationale: Preserva o sentido básico de permanecer e a ressonância joanina, sem explicitar indevidamente “continuar vivo”.
- source_word: ἕως ἔρχομαι
  choice: até que eu venha
  rationale: Mantém indefinida a natureza da vinda, evitando a interpretação mais específica sugerida por “volte”.
- source_word: τί πρὸς σέ;
  choice: o que você tem com isso?
  rationale: Expressão corrente e direta em português que comunica que o destino do outro discípulo não cabe à preocupação de Pedro.
- source_word: σύ μοι ἀκολούθει
  choice: Quanto a você, siga-me
  rationale: “Quanto a você” reproduz o contraste enfático do pronome explícito σύ, e “siga-me” transmite naturalmente o imperativo presente.
theological_decisions:
- issue: Sentido da “vinda” de Jesus em ἕως ἔρχομαι
  choice: “até que eu venha”, sem identificar o acontecimento
  alternative: Entender a expressão como uma aparição posterior, uma vinda histórica em juízo ou a vinda final
  rationale: O versículo não define o referente, e o contexto imediato adverte contra transformar a declaração condicional em uma previsão específica; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” evita a ambiguidade regional das formas de segunda pessoa; “Quanto a você” conserva a ênfase contrastiva sem soar artificial.
