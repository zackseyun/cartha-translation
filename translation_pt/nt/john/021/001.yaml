id: JHN.21.1
reference: John 21:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἐφανέρωσεν ἑαυτὸν πάλιν ⸀ὁ Ἰησοῦς τοῖς μαθηταῖς ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος· ἐφανέρωσεν δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/001.yaml
  text: After these things[a], Jesus revealed himself again to the disciples by the Sea of Tiberias, and he revealed himself in this way.
translation:
  language: pt
  text: Depois dessas coisas, Jesus se manifestou novamente aos discípulos junto ao mar de Tiberíades. Ele se manifestou desta maneira:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apareceu”. O verbo grego pode indicar que alguém se torna visível ou se dá a conhecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Depois dessas coisas
  rationale: Preserva o demonstrativo plural e a transição narrativa característica de João, sem substituir a expressão por um vago «mais tarde».
- source_word: ἐφανέρωσεν ἑαυτὸν
  choice: se manifestou
  rationale: Expressa de modo natural em português tanto o tornar-se visível quanto a autocomunicação sugerida por φανερόω, preservando a construção reflexiva.
- source_word: πάλιν
  choice: novamente
  rationale: Indica com clareza que esta manifestação sucede a aparições anteriores de Jesus ressuscitado.
- source_word: τοῖς μαθηταῖς
  choice: aos discípulos
  rationale: Mantém o artigo do grego sem acrescentar o possessivo «seus», embora este seja compreendido pelo contexto.
- source_word: ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος
  choice: junto ao mar de Tiberíades
  rationale: Comunica naturalmente a localização à margem do lago e conserva a designação geográfica usada no texto grego.
- source_word: ἐφανέρωσεν δὲ οὕτως
  choice: Ele se manifestou desta maneira
  rationale: Retém a repetição deliberada do verbo para coesão literária; a nova frase soa digna e clara em português e introduz o relato seguinte.
theological_decisions:
- issue: Linguagem da aparição após a ressurreição
  choice: se manifestou
  alternative: apareceu; se deu a conhecer
  rationale: «Se manifestou» conserva a ênfase do verbo grego na iniciativa e autorrevelação de Jesus, sem negar o caráter visível e real do encontro nem restringir o sentido a uma simples aparição.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Mar de Tiberíades» preserva a forma tradicional do topônimo; «junto ao» evita a possível impressão de que a cena já ocorre sobre as águas. A repetição de «se manifestou» reproduz intencionalmente a estrutura do original.
