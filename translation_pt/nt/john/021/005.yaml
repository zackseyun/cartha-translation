  text: λέγει οὖν αὐτοῖς ⸀ὁ Ἰησοῦς· Παιδία, μή τι προσφάγιον ἔχετε; ἀπεκρίθησαν αὐτῷ· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/005.yaml
  text: So Jesus said to them[a], “Children, you do not have any fish, do you?” They answered him, “No.”
translation:
  language: pt
  text: 'Então Jesus lhes perguntou: “Filhos, vocês não têm nenhum peixe[a], têm?” Eles lhe responderam: “Não.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “algo para comer”. O grego προσφάγιον refere-se mais especificamente a alimento comido com pão; neste contexto de pesca, provavelmente se refere a peixe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Conector narrativo natural em português, preservando a progressão do relato sem introduzir uma conclusão lógica forte.
- source_word: Παιδία
  choice: Filhos
  rationale: Forma vocativa afetuosa e relacional. “Filhos” é natural neste contexto de fala de Jesus e evita tanto a conotação etária de “crianças” quanto a interpretação mais livre de “amigos”.
- source_word: μή τι
  choice: vocês não têm... têm?
  rationale: A pergunta com μή espera resposta negativa; a formulação negativa com confirmação final reproduz essa expectativa de modo idiomático em português.
- source_word: προσφάγιον
  choice: peixe
  rationale: O termo designa algo comido com pão; no contexto de pescadores e da pesca, a referência provável é a peixe. A alternativa lexical mais ampla é preservada em nota.
- source_word: ἔχετε
  choice: vocês têm
  rationale: Expressa de modo direto e natural a posse indicada pelo presente grego.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: Eles lhe responderam
  rationale: Fórmula narrativa corrente que mantém explicitamente o objeto indireto αὐτῷ.
- source_word: Οὔ
  choice: Não
  rationale: Resposta negativa breve, correspondente à concisão do grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O tratamento por “vocês” é amplamente compreensível; “Filhos” preserva o tom afetuoso. A construção interrogativa mantém a expectativa de resposta negativa presente no grego.
