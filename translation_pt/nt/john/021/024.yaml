  text: Οὗτός ἐστιν ὁ μαθητὴς ὁ μαρτυρῶν περὶ τούτων καὶ ⸀ὁ γράψας ταῦτα, καὶ οἴδαμεν ὅτι ἀληθὴς ⸂αὐτοῦ ἡ μαρτυρία ἐστίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/024.yaml
  text: This is the disciple who testifies about these things and who wrote these things[a], and we know that his testimony is true.
translation:
  language: pt
  text: Este é o discípulo que dá testemunho a respeito destas coisas e que as escreveu[a], e sabemos que o testemunho dele é verdadeiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “que testemunha a respeito destas coisas e que escreveu estas coisas”. No grego, o verbo “dar testemunho” e o substantivo “testemunho” pertencem à mesma família de palavras ao longo do versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός
  choice: Este
  rationale: O pronome demonstrativo retoma o discípulo mencionado anteriormente e conserva a força identificadora de modo natural em português.
- source_word: μαθητὴς
  choice: discípulo
  rationale: É o termo corrente e preciso para um seguidor de Jesus no Evangelho de João.
- source_word: μαρτυρῶν
  choice: dá testemunho
  rationale: O particípio presente tem força característica ou contínua. A locução é natural, digna e mantém claramente o campo lexical de testemunho.
- source_word: περὶ τούτων
  choice: a respeito destas coisas
  rationale: Reproduz a referência demonstrativa ao conteúdo narrado no Evangelho sem restringi-la a assuntos mais específicos.
- source_word: ὁ γράψας ταῦτα
  choice: que as escreveu
  rationale: O particípio aoristo aponta para o ato realizado de escrever; o pronome retoma naturalmente 'estas coisas' e evita repetição pesada em português.
- source_word: οἴδαμεν
  choice: sabemos
  rationale: O perfeito grego tem sentido presente, expresso diretamente pelo presente do indicativo em português.
- source_word: ἀληθὴς
  choice: verdadeiro
  rationale: Traduz diretamente o adjetivo predicativo e preserva tanto a ideia de veracidade quanto a de conformidade com a verdade.
- source_word: αὐτοῦ ἡ μαρτυρία
  choice: o testemunho dele
  rationale: A construção com 'dele' é clara e natural, além de evitar eventual ambiguidade de 'seu' quanto ao referente.
- source_word: μαρτυρία
  choice: testemunho
  rationale: Mantém a ligação lexical com 'dá testemunho', refletindo a repetição cognata do grego.
theological_decisions:
- issue: Identidade e voz de οἴδαμεν ('sabemos')
  choice: Manter a primeira pessoa do plural sem identificar seus falantes.
  alternative: Entender o plural como voz editorial do evangelista ou como afirmação de uma comunidade que confirma o testemunho do discípulo.
  rationale: O texto grego usa explicitamente a primeira pessoa do plural, mas não esclarece quem está incluído; a tradução preserva essa ambiguidade sem decidir uma questão de autoria ou de comunidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Dá testemunho' preserva a conexão lexical interna do versículo; 'o testemunho dele' evita a ambiguidade referencial que 'seu testemunho' poderia criar.
