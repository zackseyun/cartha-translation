id: JHN.21.20
reference: John 21:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Ἐπιστραφεὶς ὁ Πέτρος βλέπει τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς ἀκολουθοῦντα, ὃς καὶ ἀνέπεσεν ἐν τῷ δείπνῳ ἐπὶ τὸ στῆθος αὐτοῦ καὶ εἶπεν· Κύριε, τίς ἐστιν ὁ παραδιδούς σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/020.yaml
  text: Peter turned and saw the disciple whom Jesus loved following[a], who had also leaned back against his chest at the supper and said, “Lord[b], who is the one betraying you?”
translation:
  language: pt
  text: 'Pedro se virou e viu que o discípulo a quem Jesus amava vinha atrás[a]. Era ele quem, durante a ceia, também havia se inclinado sobre o peito de Jesus e perguntado: “Senhor, quem é aquele que o está traindo?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o seguia” ou “vinha atrás deles”; o particípio grego não declara explicitamente quem ele seguia.
    reason: lexical_alternative
  - marker: b
    text: Ou “quem é aquele que o trai?”; o particípio grego está no presente.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπιστραφεὶς
  choice: se virou
  rationale: Expressa naturalmente em português a ação anterior do particípio aoristo, preservando a sequência narrativa.
- source_word: βλέπει
  choice: viu
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, mais natural na narrativa portuguesa, sem perda de sentido.
- source_word: τὸν μαθητὴν
  choice: o discípulo
  rationale: Mantém o termo joanino habitual e sua continuidade teológica.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: a quem Jesus amava
  rationale: Formulação idiomática e fiel para a oração relativa e o imperfeito grego.
- source_word: ἀκολουθοῦντα
  choice: vinha atrás
  rationale: Comunica o movimento do discípulo seguindo no contexto, sem acrescentar um objeto que o grego não explicita.
- source_word: ἀνέπεσεν
  choice: havia se inclinado
  rationale: No contexto de uma refeição reclinada, descreve de modo compreensível o gesto recordado em João 13.
- source_word: ἐν τῷ δείπνῳ
  choice: durante a ceia
  rationale: Identifica a refeição específica e situa naturalmente o gesto no decorrer dela.
- source_word: ἐπὶ τὸ στῆθος αὐτοῦ
  choice: sobre o peito de Jesus
  rationale: Torna explícito o referente de αὐτοῦ para evitar ambiguidade em português e preserva a proximidade física descrita.
- source_word: Κύριε
  choice: Senhor
  rationale: É a correspondência portuguesa tradicional e semanticamente adequada para a forma de tratamento dirigida a Jesus.
- source_word: ὁ παραδιδούς σε
  choice: quem é que vai trair o senhor
  rationale: No contexto da paixão, παραδίδωμι tem o sentido de trair ou entregar traiçoeiramente; a construção perifrástica soa natural em pergunta direta e explicita o objeto σε.
theological_decisions:
- issue: Presente histórico βλέπει
  choice: pretérito perfeito (“viu”)
  alternative: presente histórico (“vê”)
  rationale: 'A mudança de tempo é estilística: o passado é mais natural na narrativa portuguesa e não elimina conteúdo teológico.'
- issue: Objeto não expresso de ἀκολουθοῦντα
  choice: não fornecer objeto (“vinha atrás”)
  alternative: “vinha atrás deles” ou “o seguia”
  rationale: O contexto permite mais de um referente implícito; a redação preserva essa abertura em vez de decidir entre Jesus e Jesus com Pedro.
- issue: Referente de αὐτοῦ em “seu peito”
  choice: explicitar “de Jesus”
  alternative: “sobre o peito dele”
  rationale: O antecedente grego é Jesus; explicitar o nome evita que o português associe o possessivo a outro discípulo, sem alterar o sentido.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com legibilidade brasileira. “Vinha atrás” evita a formulação pouco natural “viu o discípulo seguindo” e conserva a ausência de objeto no grego. O pronome de tratamento “o senhor” distingue, na fala, o vocativo reverente “Senhor” do objeto verbal.
