  text: λέγει αὐτῷ τὸ τρίτον· Σίμων ⸀Ἰωάννου, φιλεῖς με; ἐλυπήθη ὁ Πέτρος ὅτι εἶπεν αὐτῷ τὸ τρίτον· Φιλεῖς με; καὶ ⸀εἶπεν αὐτῷ· Κύριε, ⸂πάντα σὺ⸃ οἶδας, σὺ γινώσκεις ὅτι φιλῶ σε. λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Βόσκε τὰ ⸀πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/017.yaml
  text: He said to him the third time[a], “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” And he said to him, “Lord, you know all things; you know that I love you.” Jesus said to him[b], “Feed my sheep.”
translation:
  language: pt
  text: 'Ele lhe perguntou pela terceira vez[a]: “Simão, filho de João, tu me amas?” Pedro ficou entristecido porque Jesus lhe perguntou pela terceira vez: “Tu me amas?” E respondeu: “Senhor, tu sabes[b] todas as coisas; sabes que te amo.” Jesus lhe disse: “Alimenta as minhas ovelhas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui o grego usa φιλέω (“amar, ter afeição”), enquanto nas duas perguntas anteriores Jesus havia usado ἀγαπάω. Alguns intérpretes veem uma distinção significativa; outros entendem que os verbos se sobrepõem neste contexto. A tradução usa “amar” e não impõe uma diferença mais nítida do que o grego permite afirmar.
    reason: lexical_alternative
  - marker: b
    text: 'Na resposta de Pedro, o grego emprega dois verbos para “saber”: οἶδα e γινώσκω. Em português, ambos são traduzidos naturalmente por “saber” aqui. A repetição pode sugerir uma nuance, mas expressá-la com verbos diferentes correria o risco de interpretar além do que o texto estabelece.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τρίτον
  choice: pela terceira vez
  rationale: Expressão temporal natural em português, preservando o motivo da pergunta repetida.
- source_word: Σίμων Ἰωάννου
  choice: Simão, filho de João
  rationale: O genitivo Ἰωάννου é mais naturalmente patronímico; “filho de João” traduz esta leitura grega sem importar a forma tradicional “filho de Jonas” de outras passagens.
- source_word: φιλεῖς / φιλῶ
  choice: ama / amo
  rationale: φιλέω expressa amor ou afeição. “Amar” mantém a força relacional e solene; uma distinção rígida em relação a ἀγαπάω não é semanticamente segura neste contexto.
- source_word: ἐλυπήθη
  choice: ficou triste
  rationale: Transmite de modo atual e natural a tristeza e o sofrimento emocional de Pedro, sem acrescentar uma ideia de ofensa que não é exigida pelo verbo.
- source_word: Κύριε
  choice: Senhor
  rationale: No contexto joanino e como forma de tratamento dirigida ao Jesus ressuscitado, “Senhor” preserva melhor o peso de κύριε do que uma mera fórmula de cortesia.
- source_word: πάντα σὺ οἶδας
  choice: tu sabes todas as coisas
  rationale: Preserva a abrangência e a solenidade de πάντα, bem como a ênfase no sujeito expressa por σὺ.
- source_word: οἶδας ... γινώσκεις
  choice: sabes ... sabes
  rationale: Ambos os verbos pertencem ao campo do conhecimento. Repetir “sabes” é natural em português e evita impor uma distinção semântica incerta.
- source_word: Βόσκε
  choice: Alimente
  rationale: βόσκω designa especificamente alimentar ou dar pasto, preservando sua distinção de ποιμαίνω, “pastorear/cuidar do rebanho”.
- source_word: πρόβατά
  choice: ovelhas
  rationale: πρόβατα significa ovelhas, não especificamente cordeiros; a escolha preserva a distinção lexical em relação a ἀρνία no versículo 15.
theological_decisions:
- issue: Se a alternância entre φιλέω e ἀγαπάω deve ser apresentada como diferença nítida entre tipos de amor
  choice: Traduzir φιλέω por “amar” no texto principal e registrar a alternância em nota
  alternative: Empregar verbos distintos, como “amar” e “ter afeição”, tornando a alternância teologicamente determinante
  rationale: No grego koiné, a distinção entre os dois verbos não é estável o bastante para ser imposta aqui. A solução preserva a gravidade da troca e a genuína possibilidade de nuance sem resolver a questão na tradução.
- issue: Alcance da afirmação de Pedro “tu sabes todas as coisas”
  choice: Manter a afirmação ampla exatamente como aparece no discurso
  alternative: Restringir a frase a “tu sabes tudo sobre isso” ou ampliá-la com uma explicação doutrinária explícita
  rationale: O grego faz uma declaração abrangente. A tradução deve conservar sua força sem atenuá-la nem convertê-la em glosa doutrinária.
- issue: Mudança de “você” para “tu” na fala de Pedro
  choice: Usar “você” nas perguntas narradas e “tu” na confissão solene de Pedro
  alternative: Uniformizar todas as falas com “tu” ou todas com “você”
  rationale: 'A alternância é idiomaticamente possível no português brasileiro amplo: “você” torna a pergunta direta e corrente, enquanto o “tu” explícito reproduz melhor a ênfase de πάντα σὺ οἶδας e o tom solene da confissão. Não representa diferença no referente nem grau teológico distinto.'
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A narração evita inversões excessivamente literárias. “Ficou triste” é corrente sem perder o peso emocional; “Alimente as minhas ovelhas” conserva a imagem pastoral e a especificidade lexical de βόσκω. Todos os marcadores de nota aparecem no texto principal.
