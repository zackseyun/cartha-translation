  text: Ὡς οὖν ἀπέβησαν εἰς τὴν γῆν βλέπουσιν ἀνθρακιὰν κειμένην καὶ ὀψάριον ἐπικείμενον καὶ ἄρτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/009.yaml
  text: So when they got out onto the land[a], they saw a charcoal fire laid there, and fish lying on it[b], and bread.
translation:
  language: pt
  text: Assim, quando desembarcaram em terra[a], viram ali uma fogueira de carvão[b], com peixe sobre ela, e pão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “chegaram à margem”. O grego diz mais literalmente: “saíram para a terra”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “fogueira de carvão” traduz o mesmo termo grego usado em João 18:18, na cena em que Pedro negou Jesus.
    reason: cross_reference
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Assim, quando
  rationale: Combina a força temporal de ὡς com a continuidade narrativa de οὖν em português natural, sem tornar a conexão excessivamente conclusiva.
- source_word: ἀπέβησαν εἰς τὴν γῆν
  choice: desembarcaram em terra
  rationale: Expressa naturalmente a saída do barco para a terra e permanece próxima da imagem do grego; “chegaram à margem” seria mais idiomático, porém mais específico que γῆ.
- source_word: βλέπουσιν
  choice: viram
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma mais natural na narrativa portuguesa.
- source_word: ἀνθρακιὰν κειμένην
  choice: ali uma fogueira de carvão
  rationale: ἀνθρακιά designa uma fogueira de carvão ou brasas; “ali” comunica de modo natural o sentido estativo de κειμένην sem a formulação pouco idiomática “posta ali”.
- source_word: ὀψάριον ἐπικείμενον
  choice: com peixe sobre ela
  rationale: ὀψάριον refere-se naturalmente a peixe como alimento, e ἐπικείμενον indica que estava sobre a fogueira; evita especificar indevidamente se era um único peixe ou peixe em sentido coletivo.
- source_word: ἄρτον
  choice: pão
  rationale: Tradução comum e não marcada, sem impor a forma ou a quantidade do pão.
theological_decisions:
- issue: Presente histórico narrativo
  choice: 'Traduzir βλέπουσιν no passado: “viram”'
  alternative: 'Conservar o presente vívido: “veem”'
  rationale: Trata-se de um recurso narrativo, não de uma afirmação doutrinária. O passado mantém a sequência dos acontecimentos em português moderno e natural.
- issue: Possível elo verbal com a negação de Pedro
  choice: Preservar “fogueira de carvão” e registrar o elo em nota
  alternative: Traduzir de modo mais genérico como “fogueira” ou “brasas”
  rationale: A expressão mantém a correspondência lexical com João 18:18 sem afirmar no corpo do texto qual significado teológico o leitor deve atribuir a ela.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para soar natural. Todos os marcadores de nota aparecem no texto principal.
