  text: 'Então Pedro, ao vê-lo, disse a Jesus: “Senhor, e quanto a este?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον ... ἰδών
  choice: ao vê-lo
  rationale: Retoma de modo natural em português o discípulo mencionado no contexto anterior, preservando o particípio circunstancial.
- source_word: λέγει
  choice: perguntou
  rationale: Embora a forma grega seja literalmente “diz”, a fala introduzida é uma pergunta; o pretérito mantém a narrativa natural em português sem alterar sua força.
- source_word: οὗτος δὲ τί;
  choice: e quanto a este?
  rationale: Expressa a construção grega elíptica e contrastiva sem completar indevidamente o que Pedro deseja saber sobre o outro discípulo.
theological_decisions:
- issue: Caráter elíptico da pergunta de Pedro
  choice: e quanto a este?
  alternative: o que acontecerá com este?
  rationale: O grego não explicita o verbo nem especifica destino, dever ou modo de morte; a tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “este” preserva a referência presente no grego e a concisão da pergunta.
