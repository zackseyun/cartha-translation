  text: Πρωΐας δὲ ἤδη ⸀γενομένης ⸀ἔστη Ἰησοῦς εἰς τὸν αἰγιαλόν· οὐ μέντοι ᾔδεισαν οἱ μαθηταὶ ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/004.yaml
  text: When daybreak had already come[a], Jesus stood on the shore; yet the disciples did not know that it was Jesus.
translation:
  language: pt
  text: Quando o dia já tinha amanhecido, Jesus estava de pé na praia; mas os discípulos não sabiam[a] que era Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não reconheceram que era Jesus”. O grego diz mais literalmente: “não sabiam que era Jesus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ ἤδη γενομένης
  choice: Quando já amanhecia
  rationale: A construção genitiva absoluta estabelece a circunstância temporal. A formulação natural em português comunica o início da manhã e preserva ἤδη, “já”; δέ é representado pelo fluxo narrativo, sem um marcador inicial artificial.
- source_word: ἔστη
  choice: se pôs de pé
  rationale: O aoristo de ἵστημι apresenta Jesus assumindo sua posição junto à praia; esta forma preserva melhor o valor verbal do que o simples estado “estava”.
- source_word: εἰς τὸν αἰγιαλόν
  choice: na praia
  rationale: Com um verbo de posição, εἰς pode indicar o lugar em que alguém se encontra. αἰγιαλός designa praia ou margem; “na praia” é corrente e adequado ao contexto.
- source_word: οὐ μέντοι
  choice: mas ... não
  rationale: A combinação marca contraste entre a presença de Jesus e a falta de identificação pelos discípulos.
- source_word: ᾔδεισαν
  choice: não sabiam
  rationale: Preserva o sentido lexical de οἶδα, “saber/conhecer”, sem tornar explícita na linha principal a interpretação contextual “reconhecer”.
- source_word: οἱ μαθηταὶ
  choice: os discípulos
  rationale: O artigo identifica o grupo já conhecido no contexto, sem acrescentar um possessivo ausente do grego.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: que era Jesus
  rationale: É a forma idiomática em português para a oração de identificação e mantém o sentido do presente grego dentro da perspectiva narrativa passada.
theological_decisions:
- issue: Identificação de Jesus depois da ressurreição
  choice: não sabiam que era Jesus
  alternative: não reconheceram que era Jesus
  rationale: O texto relata a não identificação, mas não explica sua causa. A tradução mantém a formulação mais literal e evita inferências sobre a aparência de Jesus ou a percepção dos discípulos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação mantém o contraste narrativo sem tornar a frase excessivamente formal.
