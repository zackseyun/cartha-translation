  rationale: A revisão reproduz melhor a anterioridade expressa por ἤδη γενομένης, evita uma implicação não expressa pelo aoristo ἔστη e reposiciona a chamada da nota junto ao termo que ela esclarece. O contraste de οὐ μέντοι é mantido por «mas», e a tradução principal continua a refletir literalmente οἶδα, sem impor uma explicação para a não identificação de Jesus.
