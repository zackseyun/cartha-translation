review_pass:
  verdict: revise
  source_fidelity: 'A circunstância temporal precisa de um perfeito composto em português: «Quando já amanhecia» sugere uma ação ainda em curso, enquanto Πρωΐας ... ἤδη γενομένης indica que o amanhecer já havia chegado. «Estava de pé» comunica naturalmente a presença de Jesus em posição ereta junto à praia, sem a sugestão indevida de que ele acabara de se levantar de uma posição sentada, que «se pôs de pé» pode trazer.'
  naturalness: «Quando o dia já tinha amanhecido» é claro, moderno e amplamente compreensível. «Jesus estava de pé na praia» é mais idiomático no contexto narrativo do que «Jesus se pôs de pé na praia».
  terminology: «Discípulos», «Jesus» e «não sabiam que era Jesus» preservam adequadamente os termos e a reserva interpretativa do grego. A nota alternativa deve estar ancorada em «não sabiam», expressão a que se refere.
  issues:
  - severity: medium
    issue: Aspecto temporal de «Quando já amanhecia»
    rationale: A forma imperfeita apresenta o amanhecer como processo em andamento. O particípio aoristo γενομένης, qualificado por ἤδη, situa a ação principal quando a manhã já havia chegado.
  - severity: low
    issue: «Se pôs de pé» pode sugerir levantar-se
    rationale: Embora possível, a expressão pode implicar que Jesus estava antes sentado ou deitado. O texto apenas o apresenta de pé na praia.
  - severity: low
    issue: Âncora da nota lexical
    rationale: A nota sobre «não reconheceram» explica ᾔδεισαν e deve acompanhar «não sabiam», não «Jesus».
  revised_text: Quando o dia já tinha amanhecido, Jesus estava de pé na praia; mas os discípulos não sabiam[a] que era Jesus.
