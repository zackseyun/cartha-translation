    issue: «sem roupa» estreita o sentido de γυμνός
    rationale: Em português, a expressão tende a significar que a pessoa não vestia roupa alguma. No contexto e no uso de γυμνός, o termo também pode designar alguém pouco vestido ou sem a roupa exterior; a tradução principal deve evitar decidir essa questão, e a nota deve preservar a alternativa literal.
