id: JHN.21.7
reference: John 21:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει οὖν ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς τῷ Πέτρῳ· Ὁ κύριός ἐστιν. Σίμων οὖν Πέτρος, ἀκούσας ὅτι ὁ κύριός ἐστιν, τὸν ἐπενδύτην διεζώσατο, ἦν γὰρ γυμνός, καὶ ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/021/007.yaml
  text: So that disciple whom Jesus loved said to Peter[a], “It is the Lord.” Therefore, when Simon Peter heard that it was the Lord, he tied his outer garment around himself (for he was lightly clothed) and threw himself into the sea.
translation:
  language: pt
  text: 'Então aquele discípulo a quem Jesus amava disse a Pedro: “É o Senhor!” Ao ouvir que era o Senhor, Simão Pedro amarrou em torno de si a veste de cima, pois estava com pouca roupa[a], e lançou-se ao mar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nu”. O termo grego também pode indicar que ele estava vestido de modo leve ou sem a veste exterior.'
    reason: γυμνός pode denotar nudez literal ou estar vestido de maneira insuficiente/leve, conforme o contexto.
lexical_decisions:
- source_word: λέγει οὖν
  choice: Então ... disse
  rationale: οὖν faz a narrativa avançar e pode indicar sequência ou consequência; “Então” é natural em português e mantém a ligação com o contexto.
- source_word: ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς
  choice: aquele discípulo a quem Jesus amava
  rationale: Preserva o demonstrativo ἐκεῖνος e a designação joanina característica, com formulação portuguesa clara.
- source_word: Ὁ κύριός ἐστιν
  choice: É o Senhor!
  rationale: “Senhor” conserva tanto o título comum quanto seu peso cristológico no reconhecimento de Jesus ressuscitado; a exclamação reproduz naturalmente a vivacidade da fala.
- source_word: Σίμων οὖν Πέτρος, ἀκούσας
  choice: Ao ouvir ... Simão Pedro
  rationale: O particípio aoristo é expresso naturalmente por uma oração temporal. A segunda ocorrência de οὖν fica comunicada pela sequência resultante, sem uma repetição pesada de conectivos.
- source_word: τὸν ἐπενδύτην
  choice: a veste de cima
  rationale: ἐπενδύτης designa uma peça usada por cima; “veste de cima” é compreensível e evita especificar indevidamente o tipo exato de roupa.
- source_word: διεζώσατο
  choice: amarrou em torno de si
  rationale: Preserva a ideia de cingir ou prender a veste ao próprio corpo, evitando o arcaísmo “cingiu-se” e a imprecisão de simplesmente “vestiu”.
- source_word: ἦν γὰρ γυμνός
  choice: pois estava sem roupa
  rationale: Traduz γυμνός diretamente, mas sem decidir se Pedro estava totalmente nu ou apenas sem a veste exterior; a ambiguidade contextual é explicitada em nota.
- source_word: ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν
  choice: lançou-se ao mar
  rationale: Mantém a força vívida da construção reflexiva com βάλλω e usa uma expressão portuguesa natural.
theological_decisions:
- issue: Sentido de κύριος no reconhecimento de Jesus
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” preserva a forma normal do título e seu possível peso cristológico neste contexto pós-ressurreição, sem explicitar além do texto.
- issue: Sentido de γυμνός na descrição de Pedro
  choice: sem roupa
  alternative: nu; com pouca roupa; sem a roupa de cima
  rationale: A expressão principal mantém aberta a extensão da nudez, enquanto a nota registra a amplitude lexical. Assim, não se elimina a leitura literal nem se impõe que Pedro estivesse totalmente nu.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez narrativa, sem perder os vínculos temporais e causais do grego.
