reference: John 21:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς Σίμων Πέτρος· Ὑπάγω ἁλιεύειν· λέγουσιν αὐτῷ· Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί. ἐξῆλθον καὶ ἐνέβησαν εἰς τὸ ⸀πλοῖον, καὶ ἐν ἐκείνῃ τῇ νυκτὶ ἐπίασαν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/003.yaml
  text: Simon Peter said to them[a], “I am going to fish.” They said to him, “We are also coming with you.” They went out and got into the boat, and that night they caught nothing.
translation:
  language: pt
  text: 'Simão Pedro lhes disse[a]: “Vou pescar.” Eles lhe disseram: “Nós também vamos com você.” Saíram, entraram no barco e, naquela noite, não pegaram nada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, os verbos estão no presente histórico (“Simão Pedro lhes diz... eles lhe dizem”), recurso narrativo comum aqui traduzido pelo passado.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει ... λέγουσιν
  choice: disse ... disseram
  rationale: Embora o grego empregue o presente histórico, o pretérito é mais natural na narrativa portuguesa e conserva a sequência discursiva.
- source_word: Ὑπάγω ἁλιεύειν
  choice: Vou pescar
  rationale: Expressão corrente e concisa em português para a intenção imediata de Pedro, sem duplicar desnecessariamente a ideia de movimento.
- source_word: Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί
  choice: Nós também vamos com você
  rationale: Preserva a ênfase de καὶ ἡμεῖς e a ideia de acompanhamento expressa por σύν; “vamos” é natural em português na perspectiva dos que acompanham Pedro.
- source_word: ἐξῆλθον
  choice: Saíram
  rationale: Reproduz diretamente o movimento narrativo sem especificar de onde saíram, algo não declarado no texto.
- source_word: ἐνέβησαν εἰς τὸ πλοῖον
  choice: entraram no barco
  rationale: Forma natural em português para embarcar, mantendo πλοῖον como “barco” no contexto da pesca.
- source_word: ἐν ἐκείνῃ τῇ νυκτί
  choice: naquela noite
  rationale: Equivalente temporal idiomático e fiel.
- source_word: ἐπίασαν οὐδέν
  choice: não pegaram nada
  rationale: No contexto da pesca, πιάζω significa apanhar ou pegar peixes; a formulação mantém a negação total de οὐδέν.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Com você” evita regionalismo excessivo; “Vou pescar” e “não pegaram nada” soam naturais sem perder o conteúdo do grego.
