  text: ἀνέβη ⸀οὖν Σίμων Πέτρος καὶ εἵλκυσεν τὸ δίκτυον ⸂εἰς τὴν γῆν⸃ μεστὸν ἰχθύων μεγάλων ἑκατὸν πεντήκοντα τριῶν· καὶ τοσούτων ὄντων οὐκ ἐσχίσθη τὸ δίκτυον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/011.yaml
  text: So Simon Peter went aboard and pulled the net onto the shore[a], full of large fish, one hundred fifty-three; and though there were so many[b], the net was not torn.
translation:
  language: pt
  text: Então Simão Pedro subiu no barco[a] e puxou a rede para a margem[b]. Ela estava cheia de cento e cinquenta e três peixes grandes; e, embora fossem tantos, a rede não se rompeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou simplesmente “subiu”. O grego não menciona expressamente o barco, mas, pelo contexto, provavelmente indica que Pedro subiu nele para puxar a rede.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para a terra”. Aqui, “margem” expressa o sentido no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: subiu no barco
  rationale: O verbo significa literalmente “subiu”. Neste contexto, Pedro estava na água e provavelmente subiu no barco para trazer a rede; a explicitação torna a ação natural em português, enquanto a nota preserva a forma e a possível abertura do grego.
- source_word: οὖν
  choice: Então
  rationale: Introduz a ação seguinte como consequência narrativa do que Jesus acabara de dizer, de modo natural em português.
- source_word: εἵλκυσεν
  choice: puxou
  rationale: Expressa de maneira clara e direta o ato de trazer a rede, sem acrescentar a ideia mais específica de arrastá-la pelo chão.
- source_word: τὸ δίκτυον
  choice: a rede
  rationale: Equivalente comum e direto para o instrumento de pesca.
- source_word: εἰς τὴν γῆν
  choice: até a margem
  rationale: A expressão é literalmente “para a terra”; na cena de pesca, refere-se à margem em contraste com a água.
- source_word: μεστὸν ἰχθύων μεγάλων
  choice: cheia de cento e cinquenta e três peixes grandes
  rationale: Mantém a descrição concreta da rede e a posição enfática da quantidade, com ordem natural em português.
- source_word: ἑκατὸν πεντήκοντα τριῶν
  choice: cento e cinquenta e três
  rationale: Reproduz exatamente o número explícito no texto grego.
- source_word: τοσούτων ὄντων
  choice: embora fossem tantos
  rationale: Representa o valor concessivo da construção absoluta, preservando o contraste entre a grande quantidade de peixes e a resistência da rede.
- source_word: οὐκ ἐσχίσθη
  choice: não se rompeu
  rationale: “Romper-se” é uma descrição natural, digna e precisa de uma rede que permaneceu inteira sob tensão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A tradução explicita o barco apenas onde o contexto o sugere fortemente, registrando em nota a formulação mais literal e a ambiguidade residual.
