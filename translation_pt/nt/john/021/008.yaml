id: JHN.21.8
reference: John 21:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ἄλλοι μαθηταὶ τῷ πλοιαρίῳ ἦλθον, οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων, σύροντες τὸ δίκτυον τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/008.yaml
  text: But the other disciples came in the small boat[a], for they were not far from the land, but about two hundred cubits away[c][b], dragging the net of fish.
translation:
  language: pt
  text: Mas os outros discípulos vieram no pequeno barco, pois não estavam longe da terra, mas a cerca de duzentos côvados[a], arrastando a rede com os peixes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Duzentos côvados correspondem a aproximadamente 90 metros.
    reason: cultural_note
  - marker: b
    text: Mais literalmente, “a rede dos peixes”. A expressão grega provavelmente se refere à rede que continha os peixes.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄλλοι μαθηταὶ
  choice: Mas os outros discípulos
  rationale: δέ marca aqui o contraste com a ação separada de Pedro no versículo anterior; “mas” mantém essa relação narrativa.
- source_word: τῷ πλοιαρίῳ
  choice: no pequeno barco
  rationale: πλοιάριον é diminutivo e designa uma embarcação pequena; a tradução preserva essa nuance de modo natural.
- source_word: ἦλθον
  choice: vieram
  rationale: O aoristo de ἔρχομαι descreve a ação seguinte na narrativa e é naturalmente traduzido por “vieram”.
- source_word: οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς
  choice: pois não estavam longe da terra
  rationale: γάρ introduz a explicação, e γῆ contrasta a terra firme com a água, podendo contextualmente referir-se à margem.
- source_word: ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων
  choice: mas a cerca de duzentos côvados
  rationale: ὡς indica aproximação; mantém-se a medida cultural antiga no texto, com equivalência moderna em nota.
- source_word: σύροντες
  choice: arrastando
  rationale: O particípio presente expressa uma ação simultânea à chegada e σύρω sugere o esforço de puxar a rede pela água.
- source_word: τὸ δίκτυον τῶν ἰχθύων
  choice: a rede com os peixes
  rationale: A construção genitiva pode ser entendida literalmente como “a rede dos peixes”, mas no contexto indica naturalmente a rede que continha os peixes; “com os peixes” evita acrescentar explicitamente a ideia de que estava cheia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Preserva-se “côvados” no texto por fidelidade cultural, explicando-se a medida em nota. “Terra” mantém a formulação mais literal, embora “margem” seja possível no contexto.
