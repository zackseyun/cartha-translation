id: JHN.21.19
reference: John 21:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν σημαίνων ποίῳ θανάτῳ δοξάσει τὸν θεόν. καὶ τοῦτο εἰπὼν λέγει αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/019.yaml
  text: He said this to indicate by what kind of death he would glorify God[a]. And after saying this, he says to him[b], “Follow me.”
translation:
  language: pt
  text: 'Ele disse isso para indicar com que tipo de morte Pedro glorificaria a Deus[a]. E, depois de dizer isso, Jesus lhe diz[b]: “Siga-me.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com que espécie de morte”.
    reason: lexical_alternative
  - marker: b
    text: 'O grego emprega aqui o presente histórico: “Jesus lhe diz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημαίνων
  choice: para indicar
  rationale: Expressa de modo claro que a declaração anterior tornava conhecido, por implicação, o que aconteceria.
- source_word: ποίῳ θανάτῳ
  choice: com que tipo de morte
  rationale: Preserva a nuance qualitativa de ποίῳ e a ideia do modo ou tipo de morte, sem reduzir a expressão a um simples “com que morte”.
- source_word: δοξάσει τὸν θεόν
  choice: Pedro glorificaria a Deus
  rationale: O futuro grego é naturalmente expresso em português pelo futuro do pretérito no discurso indireto. O nome “Pedro” explicita o referente contextual do sujeito e evita que “ele” seja entendido como Jesus.
- source_word: καὶ τοῦτο εἰπὼν
  choice: E, depois de dizer isso
  rationale: Traduz naturalmente o particípio aoristo como uma oração temporal e conserva a conexão marcada por καί.
- source_word: λέγει αὐτῷ
  choice: Jesus lhe diz
  rationale: Mantém o presente histórico de λέγει e explicita o sujeito para evitar ambiguidade em português; “lhe” representa αὐτῷ.
- source_word: Ἀκολούθει μοι
  choice: Siga-me
  rationale: É o imperativo português natural e preserva tanto o chamado imediato quanto sua possível força contínua no contexto do discipulado.
theological_decisions:
- issue: Como a morte de Pedro glorificaria a Deus
  choice: Manter apenas a afirmação de que Pedro glorificaria a Deus por meio de sua morte
  alternative: Explicar que seu martírio glorificaria a Deus como testemunho fiel
  rationale: O versículo afirma a relação entre a morte de Pedro e a glória de Deus, mas não explica aqui o mecanismo; a tradução não acrescenta uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O presente histórico foi preservado para manter a vivacidade narrativa de João. Os nomes “Pedro” e “Jesus” foram explicitados onde os pronomes ou sujeitos implícitos poderiam gerar ambiguidade em português.
