  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ἀριστήσατε. οὐδεὶς ⸀δὲ ἐτόλμα τῶν μαθητῶν ἐξετάσαι αὐτόν· Σὺ τίς εἶ; εἰδότες ὅτι ὁ κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/012.yaml
  text: Jesus said to them[a], “Come, eat breakfast.” But none of the disciples dared to ask him[b], “Who are you?” knowing that it was the Lord.
translation:
  language: pt
  text: 'Jesus lhes disse: “Venham tomar café da manhã.”[a] Mas nenhum dos discípulos ousava perguntar-lhe:[b] “Quem é você?”, sabendo que era o Senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Venham comer o café da manhã”. O verbo grego se refere especificamente à refeição da manhã.
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido como “perguntar” também pode ter o sentido de “questionar” ou “examinar detidamente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: Venham
  rationale: Convite no imperativo plural; “Venham” é natural em português e preserva a convocação direta.
- source_word: ἀριστήσατε
  choice: comer o café da manhã
  rationale: O verbo designa especificamente a refeição matinal; a expressão mantém essa especificidade temporal em linguagem clara.
- source_word: οὐδεὶς δὲ
  choice: Mas nenhum
  rationale: δέ introduz aqui uma transição com leve contraste entre o convite de Jesus e a reação contida dos discípulos.
- source_word: ἐτόλμα
  choice: ousava
  rationale: O imperfeito expressa a falta de disposição ou coragem naquele momento; “ousava” reproduz naturalmente a construção com infinitivo.
- source_word: ἐξετάσαι
  choice: interrogar
  rationale: O verbo pode significar perguntar, questionar ou examinar detidamente. “Interrogar” preserva uma nuance mais forte que o simples “perguntar”, enquanto a nota registra a amplitude lexical.
- source_word: Σὺ τίς εἶ;
  choice: Quem é você?
  rationale: Forma idiomática contemporânea da pergunta direta de identidade; o pronome explícito do grego não exige uma estrutura marcada em português.
- source_word: εἰδότες ὅτι
  choice: pois sabiam que
  rationale: Expressa de modo natural a circunstância explicativa do particípio, sem tornar a relação causal absoluta; “pois” liga a hesitação ao reconhecimento já presente.
- source_word: ὁ κύριός
  choice: o Senhor
  rationale: Preserva o peso cristológico de κύριος e a identificação narrativa de Jesus, mantendo também o artigo.
theological_decisions:
- issue: Tradução de κύριος em referência a Jesus
  choice: o Senhor
  alternative: o Mestre
  rationale: “O Senhor” preserva o uso cristológico do termo no contexto da aparição após a ressurreição, sem reduzir seu alcance ao sentido social de mestre ou chefe.
- issue: Força lógica de εἰδότες
  choice: pois sabiam
  alternative: sabendo
  rationale: O particípio admite valor circunstancial e possivelmente causal. “Pois sabiam” torna a relação discursiva compreensível, mas não afirma que esse conhecimento seja a única causa de não perguntarem.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Café da manhã” foi preferido por ser imediato para leitores brasileiros; a construção verbal evita regionalismo excessivo. A pontuação mantém a pergunta como conteúdo do interrogatório que nenhum discípulo ousava fazer.
