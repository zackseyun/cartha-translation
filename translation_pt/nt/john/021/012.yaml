  naturalness: “Venham comer o café da manhã” é compreensível, mas “Venham tomar café da manhã” é mais idiomático e amplamente natural. “Nenhum dos discípulos ousava perguntar-lhe” é mais fluente em português moderno do que “ousava interrogá-lo”. A pontuação da primeira fala deve situar o ponto final dentro das aspas, antes do marcador de nota.
  terminology: “O Senhor” é a tradução apropriada de ὁ κύριος neste contexto e deve ser mantida. “Café da manhã” comunica adequadamente a especificidade matinal de ἀριστάω para leitores brasileiros e internacionais.
