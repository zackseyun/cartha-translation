  edition: SBLGNT
  text: Ὅτε οὖν ἠρίστησαν λέγει τῷ Σίμωνι Πέτρῳ ὁ Ἰησοῦς· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με πλέον τούτων; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Βόσκε τὰ ἀρνία μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/015.yaml
  text: So when they had eaten breakfast[a], Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Feed my lambs.”
translation:
  language: pt
  text: 'Depois de tomarem o café da manhã, Jesus perguntou a Simão Pedro: “Simão, filho de João, você me ama[a] mais do que estes[b]?” Ele respondeu: “Sim, Senhor; o Senhor sabe que eu o amo”. Jesus lhe disse: “Alimente os meus cordeiros”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Aqui o grego emprega dois verbos diferentes: Jesus pergunta com ἀγαπάω (“amar”), e Pedro responde com φιλέω (“amar, ter afeição por”). Alguns intérpretes veem uma distinção entre eles; outros consideram a variação estilística. O texto principal traduz ambos por “amar” para não exagerar um contraste que o contexto não torna explícito.'
    reason: lexical_alternative
  - marker: b
    text: “Mais do que estes” pode significar “mais do que estes homens me amam” ou “mais do que você ama estas coisas”. O grego deixa implícito o termo exato da comparação.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρίστησαν
  choice: tomarem o café da manhã
  rationale: O verbo ἀριστάω se refere à refeição da manhã. A expressão é natural em português e preserva essa especificidade.
- source_word: λέγει
  choice: perguntou / respondeu / disse
  rationale: O presente histórico grego foi vertido no passado, conforme o uso narrativo natural em português. No primeiro caso, “perguntou” explicita corretamente a força interrogativa da fala; depois, “respondeu” e “disse” acompanham a função de cada enunciado.
- source_word: Σίμων Ἰωάννου
  choice: Simão, filho de João
  rationale: O genitivo funciona como patronímico. “João” traduz diretamente Ἰωάννου, sem introduzir a forma tradicional “Jonas”, proveniente de outra passagem.
- source_word: ἀγαπᾷς / φιλῶ
  choice: ama / amo
  rationale: “Amar” é a tradução mais natural dos dois verbos neste contexto. A alternância lexical grega é registrada em nota para não impor ao texto uma diferença de grau ou qualidade que permanece discutida.
- source_word: πλέον τούτων
  choice: mais do que estes
  rationale: A formulação conserva a comparação elíptica do grego sem decidir se “estes” se refere aos homens, às coisas presentes ou à medida do amor dos demais.
- source_word: κύριε
  choice: Senhor
  rationale: A forma expressa a maneira reverente como Pedro se dirige a Jesus e corresponde ao uso cristológico de κύριος no contexto joanino.
- source_word: σὺ οἶδας
  choice: o Senhor sabe
  rationale: Em português brasileiro, repetir “Senhor” como forma reverente de tratamento comunica naturalmente o pronome enfático σὺ e o verbo “saber”, embora reduza ligeiramente a distinção formal entre o vocativo e o pronome grego.
- source_word: Βόσκε
  choice: Alimente
  rationale: βόσκω designa especificamente dar alimento ou pasto, e não todo o conjunto das tarefas de pastoreio. “Alimente” preserva essa especificidade.
- source_word: τὰ ἀρνία μου
  choice: os meus cordeiros
  rationale: “Cordeiros” preserva a imagem pastoral e o possessivo mantém a afirmação de que o rebanho pertence a Jesus.
theological_decisions:
- issue: Possível distinção entre ἀγαπάω e φιλέω
  choice: Traduzir ambos por “amar” no texto principal e registrar a alternância em nota.
  alternative: Traduzir φιλέω por “ter afeição” ou entender os verbos como níveis distintos de amor.
  rationale: O grego emprega dois verbos, mas não deixa inequívoco que haja aqui uma hierarquia entre formas de amor. A tradução evita construir uma psicologia teológica que o texto não afirma explicitamente.
- issue: Sentido de πλέον τούτων
  choice: Manter a expressão elíptica “mais do que estes”.
  alternative: Explicitar “mais do que estes homens me amam” ou “mais do que você ama estas coisas”.
  rationale: O referente e o segundo termo exato da comparação não são expressos no grego. Preservar a ambiguidade evita estreitar indevidamente o sentido.
translation_notes:
  register: Português moderno, claro e digno, com construção de alta legibilidade brasileira. “Você” torna a pergunta direta e natural; “o Senhor sabe” mantém a resposta reverente de Pedro. As falas usam pontuação corrente, e a ordem narrativa permanece próxima da fonte sem soar artificial.
