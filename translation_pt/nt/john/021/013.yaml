reference: John 21:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἔρχεται ⸀ὁ Ἰησοῦς καὶ λαμβάνει τὸν ἄρτον καὶ δίδωσιν αὐτοῖς, καὶ τὸ ὀψάριον ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/013.yaml
  text: Jesus comes and takes the bread and gives it to them[b][a], and the fish likewise.
translation:
  language: pt
  text: Jesus vem, toma o pão e o dá a eles[a], e faz o mesmo com o peixe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus veio, tomou o pão e o deu a eles”. O grego emprega presentes históricos.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “e, do mesmo modo, o peixe”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: vem
  rationale: Mantém o presente histórico do grego e a vivacidade característica da narrativa joanina.
- source_word: λαμβάνει
  choice: toma
  rationale: Expressa a ação simples de pegar o pão antes de distribuí-lo, em registro digno e natural.
- source_word: τὸν ἄρτον
  choice: o pão
  rationale: Conserva o artigo definido, que aponta para o pão específico presente na refeição.
- source_word: δίδωσιν αὐτοῖς
  choice: o dá a eles
  rationale: Retoma explicitamente “o pão” com o pronome e traduz a ação de dar sem ampliá-la para “servir”.
- source_word: τὸ ὀψάριον
  choice: o peixe
  rationale: Neste contexto, designa peixe usado como alimento; não é necessário especificar que estava cozido.
- source_word: ὁμοίως
  choice: faz o mesmo
  rationale: Torna explícita em português a ação verbal elíptica aplicada ao peixe, preservando o sentido conciso de “do mesmo modo”.
theological_decisions:
- issue: Presentes históricos no relato da aparição após a ressurreição
  choice: 'Manter o presente narrativo: “vem, toma... dá”'
  alternative: 'Empregar o pretérito: “veio, tomou... deu”'
  rationale: A escolha preserva a textura narrativa do grego sem atribuir ao tempo verbal uma distinção doutrinária.
- issue: Ação elíptica referente ao peixe
  choice: Explicitar “faz o mesmo com o peixe”
  alternative: 'Traduzir de modo mais formal: “e, do mesmo modo, o peixe”'
  rationale: O grego deixa implícito que Jesus toma e dá também o peixe. A explicitação produz português natural sem definir além do que o contexto imediato fornece.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O presente histórico foi preservado; a elipse final foi expressa de maneira natural, com alternativa mais literal em nota.
