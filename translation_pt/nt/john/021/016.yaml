source:
  edition: SBLGNT
  text: λέγει αὐτῷ πάλιν δεύτερον· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Ποίμαινε τὰ πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/016.yaml
  text: He said to him again a second time[a], “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Shepherd my sheep.”
translation:
  language: pt
  text: 'Ele lhe disse novamente, pela segunda vez: “Simão, filho de João, você me ama?” Ele respondeu: “Sim, Senhor; o Senhor sabe que eu o amo.” Jesus lhe disse: “Pastoreie as minhas ovelhas.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No grego, Jesus usa aqui agapaō (“amar”), enquanto Pedro responde com phileō (também “amar”, podendo expressar afeição). Alguns intérpretes veem uma distinção entre os verbos; outros entendem a variação como estilística. O texto principal traduz ambos por “amar” para não acentuar uma diferença incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δεύτερον
  choice: novamente, pela segunda vez
  rationale: Preserva os dois elementos da expressão grega e sua ênfase reiterativa, mantendo uma formulação compreensível em português.
- source_word: Σίμων Ἰωάννου
  choice: Simão, filho de João
  rationale: O genitivo funciona naturalmente como patronímico; esta leitura segue o texto grego apresentado, sem harmonizá-lo com a forma tradicional “filho de Jonas”.
- source_word: ἀγαπᾷς με
  choice: você me ama
  rationale: “Amar” é a equivalência portuguesa natural; evita impor no texto principal uma distinção forte em relação a φιλέω.
- source_word: Ναί, κύριε
  choice: Sim, Senhor
  rationale: Conserva a afirmação simples e o tratamento reverente dirigido a Jesus.
- source_word: σὺ οἶδας
  choice: o Senhor sabe
  rationale: A repetição de “o Senhor” é idiomática no português brasileiro respeitoso e mantém uma leve ênfase no interlocutor indicada pelo pronome grego explícito.
- source_word: ὅτι φιλῶ σε
  choice: que eu o amo
  rationale: “Amar” comunica naturalmente o sentido neste contexto, enquanto a variação lexical em relação a ἀγαπάω é registrada em nota.
- source_word: Ποίμαινε
  choice: Pastoreie
  rationale: Preserva a metáfora pastoral e abrange conduzir, cuidar e supervisionar, em vez de restringir a ordem apenas a alimentar.
- source_word: τὰ πρόβατά μου
  choice: as minhas ovelhas
  rationale: Mantém a imagem concreta das ovelhas e a relação possessiva com Jesus.
theological_decisions:
- issue: Se ἀγαπάω e φιλέω devem ser distinguidos por verbos portugueses diferentes
  choice: Traduzir ambos por “amar” no texto principal e indicar a variação lexical em nota.
  alternative: Traduzir ἀγαπάω por “amar” e φιλέω por “ter afeição” ou “gostar”.
  rationale: Há uma variação real no grego, mas o uso joanino não exige inequivocamente uma diferença de grau ou qualidade. Empregar verbos distintos no texto principal poderia resolver indevidamente uma tensão interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Você” evita a ambiguidade regional de “tu”; na resposta de Pedro, “o Senhor” funciona como tratamento respeitoso e evita a sequência menos natural “você sabe”. A expressão reiterativa πάλιν δεύτερον foi mantida sem eliminar sua ênfase.
