  text: ἔστιν δὲ καὶ ἄλλα πολλὰ ⸀ἃ ἐποίησεν ὁ Ἰησοῦς, ἅτινα ἐὰν γράφηται καθ’ ἕν, οὐδ’ αὐτὸν οἶμαι τὸν κόσμον ⸀χωρήσειν τὰ γραφόμενα ⸀βιβλία.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/025.yaml
  text: There are also many other things that Jesus did[a], which, if they were written down one by one, I suppose that not even the world itself would have room for the books being written.
translation:
  language: pt
  text: Há ainda muitas outras coisas que Jesus fez e que, se fossem escritas uma por uma, penso que nem o próprio mundo teria espaço[a] para os livros que seriam escritos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “poderia conter os livros que fossem escritos”. O verbo grego pode significar “ter espaço para” ou “conter”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ καὶ ἄλλα πολλὰ
  choice: Há ainda muitas outras coisas
  rationale: Expressa com naturalidade a continuidade de δὲ καί e o caráter adicional de ἄλλα πολλὰ, sem introduzir uma ideia temporal ausente do grego.
- source_word: ἃ ἐποίησεν ὁ Ἰησοῦς
  choice: que Jesus fez
  rationale: O verbo ποιέω designa aqui, de modo amplo, as ações de Jesus; “fez” é direto e natural.
- source_word: ἅτινα
  choice: e que
  rationale: Introduz a explicação relativa ligada às muitas outras coisas, evitando em português uma sequência pesada de orações.
- source_word: ἐὰν γράφηται καθ’ ἕν
  choice: se fossem escritas uma por uma
  rationale: Preserva a condição hipotética, a voz passiva e o sentido distributivo de καθ’ ἕν.
- source_word: οὐδ’ αὐτὸν οἶμαι τὸν κόσμον
  choice: penso que nem o próprio mundo
  rationale: Mantém a observação pessoal de οἶμαι e a ênfase intensiva de αὐτόν sobre “mundo”.
- source_word: χωρήσειν
  choice: teria espaço para
  rationale: Conserva a imagem espacial do verbo, que também pode significar “conter”.
- source_word: τὰ γραφόμενα βιβλία
  choice: os livros que seriam escritos
  rationale: Representa idiomaticamente, dentro da hipótese, os livros resultantes da escrita de cada ação, em vez do menos natural “os livros sendo escritos”.
theological_decisions:
- issue: Hipérbole sobre a capacidade do mundo
  choice: Mantida a imagem de que nem o próprio mundo teria espaço para os livros.
  alternative: “Seriam necessários incontáveis livros” ou “o mundo não poderia conter os livros”.
  rationale: A formulação preserva a hipérbole retórica que encerra o Evangelho, sem reduzi-la a uma simples afirmação de grande quantidade nem exigir leitura literalista.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “teria espaço para” preserva a imagem espacial, enquanto “que seriam escritos” comunica de forma natural o resultado futuro dentro da condição hipotética.
