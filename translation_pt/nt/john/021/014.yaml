  text: τοῦτο ἤδη τρίτον ἐφανερώθη ⸀ὁ Ἰησοῦς τοῖς ⸀μαθηταῖς ἐγερθεὶς ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/014.yaml
  text: This was now the third time Jesus was revealed to the disciples after he had been raised from the dead[a].
translation:
  language: pt
  text: Esta foi, até então, a terceira vez que Jesus se revelou aos discípulos depois de ter sido ressuscitado dentre os mortos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Esta foi, até então, a terceira vez que Jesus apareceu aos discípulos depois de ter sido ressuscitado dentre os mortos».'
    reason: Alternativa lexical para ἐφανερώθη.
lexical_decisions:
- source_word: τοῦτο ἤδη τρίτον
  choice: Esta foi a terceira vez
  rationale: A formulação portuguesa expressa naturalmente o demonstrativo anafórico, o ponto alcançado na narrativa e o ordinal adverbial. O sentido de ἤδη fica implícito de modo idiomático, sem o pouco natural «esta já foi».
- source_word: ἐφανερώθη
  choice: se revelou
  rationale: Preserva a ideia de manifestação própria de φανερόω e soa mais natural em português do que «foi revelado» neste contexto; «apareceu» permanece uma alternativa lexical válida.
- source_word: τοῖς μαθηταῖς
  choice: aos discípulos
  rationale: Segue o dativo e não acrescenta o possessivo «seus», ausente do grego.
- source_word: ἐγερθεὶς
  choice: depois de ter sido ressuscitado
  rationale: Explicita a anterioridade temporal do particípio aoristo e conserva sua voz passiva.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: Expressa o sentido literal de saída do meio dos mortos em linguagem portuguesa bíblica ainda clara e corrente.
theological_decisions:
- issue: Voz da linguagem da ressurreição em ἐγερθεὶς ἐκ νεκρῶν
  choice: depois de ter sido ressuscitado dentre os mortos
  alternative: depois de ressuscitar dentre os mortos
  rationale: O particípio grego é passivo; a tradução mantém essa voz sem resolver ou apagar a forma teológica do enunciado.
- issue: Sentido de ἐφανερώθη
  choice: se revelou
  alternative: apareceu
  rationale: «Se revelou» preserva a nuance joanina de manifestação, enquanto «apareceu» comunica adequadamente o acontecimento, mas torna menos explícita essa nuance lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe é natural; «dentre os mortos» mantém precisão sem recorrer a formulação excessivamente técnica.
