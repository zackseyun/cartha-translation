  text: 'Jesus lhes disse: “Tragam alguns dos peixes que vocês acabaram de pescar.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: disse
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma natural na narrativa portuguesa, sem alterar sua função discursiva.
- source_word: Ἐνέγκατε
  choice: Tragam
  rationale: O imperativo aoristo plural de φέρω expressa uma ordem direta; “tragam” é idiomático e adequado ao movimento dos peixes até Jesus.
- source_word: ἀπὸ τῶν ὀψαρίων
  choice: alguns dos peixes
  rationale: 'A construção tem sentido partitivo: trata-se de trazer uma parte dos peixes, não necessariamente toda a pesca.'
- source_word: ὀψαρίων
  choice: peixes
  rationale: No contexto imediato da pesca, “peixes” comunica claramente o referente sem especificar indevidamente tamanho ou preparo.
- source_word: ὧν ἐπιάσατε νῦν
  choice: que vocês acabaram de pescar
  rationale: “Acabaram de pescar” exprime em português corrente a ação recém-concluída indicada pelo aoristo com νῦν.
