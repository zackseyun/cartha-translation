base_translation:
  language: en
  yaml_path: translation/nt/john/021/002.yaml
  text: Simon Peter[a], Thomas called Didymus, Nathanael from Cana of Galilee, the sons of Zebedee, and two others of his disciples were together.
translation:
  language: pt
  text: Estavam juntos Simão Pedro, Tomé, chamado Dídimo[a], Natanael, de Caná da Galileia, os filhos de Zebedeu e outros dois dos seus discípulos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dídimo é uma palavra grega que significa “Gêmeo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν ὁμοῦ
  choice: Estavam juntos
  rationale: O imperfeito de εἰμί expressa um estado passado, e ὁμοῦ indica que estavam reunidos no mesmo lugar. A formulação é natural em português e mantém a abertura do grego.
- source_word: Σίμων Πέτρος
  choice: Simão Pedro
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: Θωμᾶς ὁ λεγόμενος Δίδυμος
  choice: Tomé, chamado Dídimo[a]
  rationale: Mantém a designação grega Δίδυμος em sua forma portuguesa tradicional, enquanto a nota esclarece seu significado lexical, sem transformar silenciosamente a designação em tradução.
- source_word: Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας
  choice: Natanael, de Caná da Galileia
  rationale: ἀπό indica procedência; a expressão geográfica tradicional conserva de perto a estrutura do original.
- source_word: οἱ τοῦ Ζεβεδαίου
  choice: os filhos de Zebedeu
  rationale: O substantivo 'filhos' está elíptico no grego, mas é exigido em português e é contextualmente inequívoco.
- source_word: ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: outros dois dos seus discípulos
  rationale: 'Conserva o sentido partitivo de ἐκ: eram dois dentre o grupo dos discípulos dele.'
- source_word: καί ... καί
  choice: enumeração com vírgulas e um último «e»
  rationale: A coordenação repetida do grego é expressa segundo a sintaxe corrente do português, sem perda de nenhum elemento da lista.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas amplamente reconhecidas. A ordem inicial «Estavam juntos» preserva o foco narrativo do grego. A nota foi colocada junto de «Dídimo», o termo que ela explica.
