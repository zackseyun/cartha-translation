source:
  edition: SBLGNT
  text: Ταῦτα ἐν παροιμίαις λελάληκα ὑμῖν· ⸀ἔρχεται ὥρα ὅτε οὐκέτι ἐν παροιμίαις λαλήσω ὑμῖν ἀλλὰ παρρησίᾳ περὶ τοῦ πατρὸς ⸀ἀπαγγελῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/025.yaml
  text: I have spoken these things to you in figures of speech[a]. An hour is coming when I will no longer speak to you in figures of speech[c][b], but will tell you plainly about the Father.
translation:
  language: pt
  text: Eu lhes tenho falado estas coisas em linguagem figurada[a]. Vem a hora[b] em que já não lhes falarei em linguagem figurada, mas lhes anunciarei claramente[c] a respeito do Pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio de parábolas” ou “por meio de ditos velados”; a palavra grega se refere aqui a uma forma de falar figurada ou indireta.
    reason: lexical_alternative
  - marker: b
    text: Ou “Vem um tempo”. Em João, “hora” muitas vezes tem significado teológico.
    reason: lexical_alternative
  - marker: c
    text: Ou “abertamente” ou “com franqueza”; aqui, o sentido é uma comunicação direta, não figurada.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαις
  choice: em linguagem figurada
  rationale: No uso joanino, o termo indica fala figurada ou indireta, não necessariamente uma parábola no sentido técnico dos Evangelhos Sinóticos. A expressão é clara e natural em português.
- source_word: λελάληκα
  choice: tenho falado
  rationale: O perfeito grego apresenta a fala anterior com relevância presente; esta forma também mantém a ligação lexical com λαλήσω mais adiante.
- source_word: ἔρχεται ὥρα
  choice: Vem a hora
  rationale: Preserva a imagem joanina de “hora” e sua possível ressonância teológica, numa formulação idiomática em português.
- source_word: οὐκέτι
  choice: já não
  rationale: Equivalente português natural e preciso na declaração contrastiva sobre o futuro.
- source_word: λαλήσω
  choice: falarei
  rationale: Mantém a correspondência verbal com λελάληκα e o foco no modo de falar.
- source_word: παρρησίᾳ
  choice: claramente
  rationale: Neste contexto, o contraste com a linguagem figurada aponta sobretudo para clareza e franqueza, não para ousadia pública.
- source_word: ἀπαγγελῶ
  choice: lhes falarei
  rationale: No contexto, o verbo descreve a comunicação direta acerca do Pai. A formulação evita o sentido excessivamente formal de “anunciarei” e produz português natural, embora não reproduza a mudança de verbo do grego.
- source_word: περὶ τοῦ πατρὸς
  choice: sobre o Pai
  rationale: Expressão natural que conserva tanto o assunto da revelação quanto o título relacional e teológico “Pai”.
theological_decisions:
- issue: Sentido de ὥρα no contexto joanino
  choice: Vem a hora
  alternative: Vem um tempo
  rationale: “Hora” conserva a dicção característica de João e sua possível relevância teológica sem definir além do texto qual acontecimento específico está em vista.
- issue: Sentido de παρρησίᾳ em contraste com ἐν παροιμίαις
  choice: claramente
  alternative: abertamente; com franqueza
  rationale: O contraste imediato é entre fala figurada ou indireta e comunicação clara. A tradução não desloca a ênfase para coragem, publicidade ou ousadia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os pronomes átonos “lhes” evitam regionalizar a tradução entre “vocês” e “vós”. A repetição de “linguagem figurada” e “falarei” preserva o contraste e a coesão do grego.
