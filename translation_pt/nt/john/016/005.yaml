  text: νῦν δὲ ὑπάγω πρὸς τὸν πέμψαντά με καὶ οὐδεὶς ἐξ ὑμῶν ἐρωτᾷ με· Ποῦ ὑπάγεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/005.yaml
  text: But now I am going to the one who sent me, and none of you asks me, ‘Where are you going?’
translation:
  language: pt
  text: 'Mas agora vou para aquele que me enviou, e nenhum de vocês me pergunta: “Para onde você vai?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Mas agora
  rationale: Preserva o contraste discursivo marcado por δέ e introduz naturalmente a transição no português moderno.
- source_word: ὑπάγω
  choice: vou
  rationale: Expressa de modo idiomático o movimento em curso ou iminente, sem restringir o sentido a uma simples partida.
- source_word: πρὸς τὸν πέμψαντά με
  choice: para aquele que me enviou
  rationale: Reproduz o particípio substantivado sem acrescentar explicitamente “o Pai”, que não aparece nesta oração grega.
- source_word: πέμψαντά
  choice: enviou
  rationale: Mantém a linguagem joanina de envio e missão sem a explicitação interpretativa de “comissionou”.
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: nenhum de vocês
  rationale: É uma tradução direta, clara e natural da expressão partitiva com negação enfática.
- source_word: ἐρωτᾷ με
  choice: me pergunta
  rationale: Neste contexto, ἐρωτάω designa fazer uma pergunta, e não formular um pedido.
- source_word: Ποῦ ὑπάγεις;
  choice: Para onde você vai?
  rationale: Forma corrente em português que preserva tanto a direção do movimento quanto a pergunta direta.
theological_decisions:
- issue: Identidade de “aquele que me enviou”
  choice: Manter “aquele que me enviou”, sem acrescentar “o Pai”.
  alternative: “para o Pai, que me enviou”
  rationale: Embora o referente seja reconhecível no contexto e na teologia joanina, o grego deste versículo não nomeia explicitamente o Pai; a tradução conserva essa formulação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” comunica naturalmente o plural ὑμῶν; a pontuação introduz a pergunta citada com clareza.
