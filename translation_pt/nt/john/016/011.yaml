  text: and concerning judgment[c][b][a], because the ruler of this world has been judged.
translation:
  language: pt
  text: e quanto ao juízo, porque o governante deste mundo[a][b] foi julgado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o príncipe deste mundo”.
    reason: lexical_alternative
  - marker: b
    text: Provavelmente uma referência a Satanás; compare João 12:31 e 14:30.
    reason: cross_reference
  - marker: c
    text: Ou “está julgado”. O perfeito grego enfatiza um julgamento concluído cujos efeitos continuam.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ κρίσεως
  choice: e quanto ao juízo
  rationale: περί com o genitivo introduz o assunto, e δέ conecta este item aos anteriores. “Quanto ao juízo” é natural em português e mantém a sequência “pecado... justiça... juízo”.
- source_word: ὅτι
  choice: porque
  rationale: Aqui ὅτι introduz a razão pela qual o Espírito convence quanto ao juízo; “porque” expressa claramente essa relação causal.
- source_word: ὁ ἄρχων
  choice: o governante
  rationale: ἄρχων designa quem governa ou exerce autoridade. “Governante” comunica essa função com clareza atual, sem a possível associação de “príncipe” com filiação real.
- source_word: τοῦ κόσμου τούτου
  choice: deste mundo
  rationale: “Mundo” é a correspondência normal de κόσμος no vocabulário joanino e preserva literalmente a expressão demonstrativa.
- source_word: κέκριται
  choice: já foi julgado
  rationale: O perfeito passivo de κρίνω apresenta um julgamento realizado cujos efeitos permanecem. “Já foi julgado” preserva a voz passiva e comunica o caráter consumado, sem estreitar o sentido para “condenado”.
theological_decisions:
- issue: Identidade e sentido de “o governante deste mundo”
  choice: Manter o título sem identificar explicitamente Satanás no texto principal.
  alternative: “Satanás, o governante deste mundo”
  rationale: Embora a expressão seja geralmente entendida como referência a Satanás à luz de João 12:31 e 14:30, o versículo usa um título, não o nome próprio. A tradução preserva essa forma e deixa a provável identificação para a nota.
- issue: Nuance de κέκριται
  choice: “já foi julgado”
  alternative: “foi condenado” ou “permanece condenado”
  rationale: “Julgado” preserva a extensão lexical de κρίνω e evita explicitar condenação onde o verbo, isoladamente, é mais amplo. O contexto pode implicar uma sentença adversa, mas a tradução não a impõe.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Quanto ao” dá continuidade natural à enumeração do contexto; “governante” evita o caráter mais tradicional e potencialmente ambíguo de “príncipe”. Os marcadores [a], [b] e [c] aparecem todos no texto principal.
