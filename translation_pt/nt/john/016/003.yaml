  footnotes:
  - marker: a
    text: 'Ou: “não conhecem o Pai nem a mim”; ou: “não chegaram a conhecer o Pai nem a mim”. Neste contexto, o verbo grego admite mais de uma tradução natural em português.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conectivo simples que liga a afirmação ao contexto anterior.
- source_word: ταῦτα
  choice: essas coisas
  rationale: Mantém o plural e retoma naturalmente as ações hostis mencionadas antes.
- source_word: ποιήσουσιν
  choice: farão
  rationale: O futuro ativo de ποιέω é expresso de modo direto e natural.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a causa pela qual eles praticarão essas ações.
- source_word: οὐκ ἔγνωσαν
  choice: não conheceram
  rationale: Preserva o aoristo de γινώσκω em português natural, mantendo a ideia joanina de conhecimento relacional; outras nuances temporais são registradas em nota.
- source_word: τὸν πατέρα
  choice: o Pai
  rationale: A inicial maiúscula sinaliza o uso titular referente a Deus no contexto joanino.
- source_word: οὐδὲ ἐμέ
  choice: nem a mim
  rationale: Reproduz com naturalidade a coordenação negativa enfática de οὐδέ.
theological_decisions:
- issue: A linguagem joanina de conhecer o Pai e Jesus
  choice: não conheceram o Pai nem a mim
  alternative: não conhecem o Pai nem a mim; não chegaram a conhecer o Pai nem a mim
  rationale: A formulação conserva a afirmação de que a perseguição decorre da falta de conhecimento relacional tanto do Pai como de Jesus, sem explicar além do que o texto diz.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Essas coisas” retoma o contexto anterior; “nem a mim” preserva a estrutura negativa do grego.
