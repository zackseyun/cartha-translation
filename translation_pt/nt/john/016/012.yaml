id: JHN.16.12
reference: John 16:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἔτι πολλὰ ἔχω ⸂ὑμῖν λέγειν⸃, ἀλλ’ οὐ δύνασθε βαστάζειν ἄρτι·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/012.yaml
  text: I still have many things to say to you[a], but you are not able to bear them now.
translation:
  language: pt
  text: Ainda tenho muitas coisas para dizer a vocês, mas agora vocês não podem suportá-las.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “carregá-las” ou “aguentá-las”. O verbo grego pode transmitir a ideia de carregar, suportar ou aguentar.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι
  choice: Ainda
  rationale: Expressa continuidade e indica que Jesus tem outros ensinamentos a comunicar.
- source_word: πολλὰ
  choice: muitas coisas
  rationale: O adjetivo neutro plural é substantivado; esta formulação explicita o sentido de modo natural em português.
- source_word: ἔχω
  choice: tenho
  rationale: Preserva naturalmente a construção grega com infinitivo, indicando algo que ainda resta dizer.
- source_word: ὑμῖν λέγειν
  choice: para dizer a vocês
  rationale: Reproduz diretamente o sentido amplo de λέγειν e o destinatário expresso pelo dativo ὑμῖν, em português de ampla compreensão.
- source_word: ἀλλ’
  choice: mas
  rationale: É a conjunção adversativa mais direta e natural neste contexto.
- source_word: οὐ δύνασθε
  choice: vocês não podem
  rationale: Comunica de forma idiomática a incapacidade presente expressa pelo verbo grego.
- source_word: βαστάζειν
  choice: suportá-las
  rationale: Mantém tanto a noção metafórica de aguentar um peso quanto a possibilidade de resistir ou tolerar, sem reduzir o sentido apenas à compreensão intelectual.
- source_word: ἄρτι
  choice: agora
  rationale: Marca a incapacidade no momento presente, em contraste com o desenvolvimento anunciado nos versículos seguintes.
theological_decisions:
- issue: Sentido de βαστάζειν em relação à incapacidade presente dos discípulos
  choice: Os discípulos não podem, naquele momento, suportar o peso das muitas coisas que Jesus ainda tem para lhes dizer.
  alternative: Os discípulos não podem compreendê-las plenamente agora; ou não podem aguentar ouvi-las agora.
  rationale: βαστάζειν pode significar carregar, suportar ou aguentar. “Suportá-las” conserva a tensão entre capacidade cognitiva, espiritual e emocional, sem limitar o texto a apenas uma dessas dimensões.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “A vocês” evita regionalismo excessivo; “suportá-las” preserva a metáfora e a ambiguidade do original.
