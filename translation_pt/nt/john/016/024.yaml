  text: ἕως ἄρτι οὐκ ᾐτήσατε οὐδὲν ἐν τῷ ὀνόματί μου· αἰτεῖτε καὶ λήμψεσθε, ἵνα ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/024.yaml
  text: Until now you have asked for nothing in my name[a]. Ask, and you will receive[c][b], so that your joy may be full.
translation:
  language: pt
  text: Até agora vocês não pediram nada em meu nome[a]. Peçam, e receberão, para que a alegria de vocês seja plena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «em meu nome» pode indicar um pedido feito em relação com a pessoa, a autoridade e a missão de Jesus; a tradução mantém a expressão literal sem limitá-la a uma única explicação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἄρτι
  choice: Até agora
  rationale: Expressa de modo natural o limite temporal até o presente momento.
- source_word: ᾐτήσατε οὐδὲν
  choice: não pediram nada
  rationale: No contexto de oração, pedir traduz αἰτέω com clareza; a construção com «até agora» torna o pretérito perfeito simples natural em português.
- source_word: ἐν τῷ ὀνόματί μου
  choice: em meu nome
  rationale: Mantém a expressão joanina literal e sua amplitude teológica, sem reduzi-la a uma única explicação.
- source_word: αἰτεῖτε
  choice: Peçam
  rationale: O imperativo presente pode admitir ação contínua ou repetida, mas o imperativo simples é natural e não determina indevidamente o aspecto.
- source_word: λήμψεσθε
  choice: receberão
  rationale: Preserva de modo direto e digno a promessa futura correspondente ao pedido.
- source_word: ἵνα
  choice: para que
  rationale: Comunica naturalmente a relação de propósito ou resultado.
- source_word: ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη
  choice: a alegria de vocês seja plena
  rationale: «Seja plena» comunica o estado resultante de plenitude e preserva a imagem joanina, com naturalidade em português.
theological_decisions:
- issue: Sentido de pedir «em meu nome»
  choice: Manter a expressão literal «em meu nome».
  alternative: em minha autoridade; em meu favor; em união comigo
  rationale: A expressão relaciona a oração à pessoa, autoridade e missão de Jesus, mas o texto não a restringe a uma única paráfrase interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para o plural. A formulação evita tanto rigidez excessiva quanto expansão interpretativa.
