  text: Μικρὸν καὶ ⸀οὐκέτι θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/016.yaml
  text: A little while[a], and you no longer see me; and again a little while, and you will see me.
translation:
  language: pt
  text: Mais um pouco, e vocês não me verão mais[a]; e, mais um pouco, vocês me verão de novo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego usa aqui dois verbos diferentes para “ver”: θεωρέω na primeira oração e ὁράω na segunda. Pode haver alguma diferença de nuance, mas ambos são traduzidos por “ver” porque o contraste principal neste versículo é temporal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μικρὸν
  choice: mais um pouco
  rationale: O adjetivo neutro singular é usado idiomaticamente para indicar um breve intervalo de tempo. “Mais um pouco” é natural em português e, na repetição, preserva o ritmo da frase.
- source_word: οὐκέτι
  choice: já não
  rationale: Expressa a cessação a partir de certo momento; “já não” é idiomático, claro e adequado ao contexto temporal.
- source_word: θεωρεῖτέ
  choice: verão
  rationale: Embora θεωρέω possa sugerir olhar ou observar, aqui “ver” comunica naturalmente o sentido básico sem impor uma distinção excessiva em relação a ὁράω.
- source_word: πάλιν
  choice: e, mais um pouco
  rationale: O valor de repetição ou reversão de πάλιν é expresso pela segunda ocorrência paralela de “mais um pouco” e pela coordenação; uma tradução explícita como “novamente” seria possível, mas menos natural nesta construção portuguesa.
- source_word: ὄψεσθέ
  choice: verão
  rationale: O futuro de ὁράω indica visão futura. Usar novamente “ver” conserva o paralelismo e evita criar uma distinção teológica que o grego não exige.
- source_word: με
  choice: me
  rationale: Pronome objeto que se refere a Jesus, traduzido diretamente em ambas as orações.
- source_word: καὶ
  choice: e
  rationale: A repetição de καὶ estrutura o dito em orações equilibradas; “e” preserva sua coordenação e cadência.
theological_decisions:
- issue: Se θεωρέω e ὁράω devem ser traduzidos por verbos portugueses diferentes para sugerir modos distintos de ver
  choice: Traduzir ambos por “ver” no texto principal
  alternative: “vocês já não me contemplarão... vocês me verão” ou “vocês já não me verão... vocês me contemplarão”
  rationale: Os dois verbos gregos têm ampla sobreposição semântica no uso joanino. Diferenciá-los rigidamente poderia introduzir uma oposição teológica maior do que o texto sustenta; a nota preserva a informação lexical, enquanto o texto destaca o contraste temporal.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para legibilidade ampla no Brasil. A construção paralela procura conservar a brevidade e a cadência do grego.
