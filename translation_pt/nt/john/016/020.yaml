id: JHN.16.20
reference: John 16:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι κλαύσετε καὶ θρηνήσετε ὑμεῖς, ὁ δὲ κόσμος χαρήσεται· ⸀ὑμεῖς λυπηθήσεσθε, ἀλλ’ ἡ λύπη ὑμῶν εἰς χαρὰν γενήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/020.yaml
  text: Truly[a], truly, I say to you, you will weep and mourn, but the world will rejoice; you will be grieved, but your grief will become joy.
translation:
  language: pt
  text: 'Em verdade, em verdade lhes digo: vocês chorarão e lamentarão, mas o mundo se alegrará. Vocês ficarão tristes, mas a tristeza de vocês se transformará em alegria.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se tornará alegria”.'
    reason: Alternativa mais formal para εἰς χαρὰν γενήσεται; a redação principal é mais idiomática em português.
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Preserva a repetição solene e enfática da fórmula de Jesus em linguagem digna e amplamente compreensível.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Reproduz de modo natural a fórmula de discurso direto e o plural de ὑμῖν.
- source_word: κλαύσετε καὶ θρηνήσετε
  choice: vocês chorarão e lamentarão
  rationale: 'Mantém distintos os dois verbos: o primeiro expressa o choro, e o segundo, a manifestação verbal ou ritual da dor.'
- source_word: ὁ δὲ κόσμος
  choice: mas o mundo
  rationale: Conserva o termo joanino abrangente κόσμος e o contraste marcado por δέ sem inserir explicação interpretativa no texto.
- source_word: χαρήσεται
  choice: se alegrará
  rationale: Expressa claramente a alegria e mantém a ligação semântica com χαρά no fim do versículo.
- source_word: λυπηθήσεσθε
  choice: vocês ficarão tristes
  rationale: É uma formulação portuguesa natural para o futuro passivo, preservando o estado de tristeza sem especificar sua causa.
- source_word: ἡ λύπη ὑμῶν
  choice: a tristeza de vocês
  rationale: Mantém a ligação lexical com λυπηθήσεσθε por meio de 'tristes' e 'tristeza'.
- source_word: εἰς χαρὰν γενήσεται
  choice: se transformará em alegria
  rationale: Comunica naturalmente a passagem da tristeza à alegria indicada por εἰς com γενήσεται, sem reduzir a frase a uma simples substituição externa.
theological_decisions:
- issue: Uso joanino de κόσμος
  choice: o mundo
  alternative: o mundo incrédulo; o sistema do mundo
  rationale: Embora κόσμος possa ter conotação moral negativa em João, o versículo não a explicita. A tradução preserva a amplitude e a tensão do termo sem introduzir comentário denominacional.
- issue: Relação entre tristeza e alegria
  choice: a tristeza se transformará em alegria
  alternative: a tristeza será substituída pela alegria
  rationale: A construção grega sugere que a própria tristeza chegará a ser alegria; evita-se explicar de que modo isso ocorrerá ou enfraquecer essa formulação teologicamente expressiva.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com 'vocês' para o plural e colocação pronominal natural. A repetição 'Em verdade, em verdade' conserva a solenidade característica de João.
