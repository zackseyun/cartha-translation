  text: ἐξῆλθον ⸀ἐκ τοῦ πατρὸς καὶ ἐλήλυθα εἰς τὸν κόσμον· πάλιν ἀφίημι τὸν κόσμον καὶ πορεύομαι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/028.yaml
  text: I came from the Father and have come into the world. Again[a], I am leaving the world and going to the Father.
translation:
  language: pt
  text: Saí do Pai[a] e vim ao mundo. Novamente, deixo o mundo e vou para o Pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Vim do Pai.»'
    reason: Registra uma alternativa idiomática que enfatiza a origem, em vez do movimento de saída expresso por ἐξῆλθον ἐκ τοῦ πατρὸς.
lexical_decisions:
- source_word: ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: Saí de junto do Pai
  rationale: Expressa o movimento cuja origem está no Pai sem sugerir, de modo indevido, uma saída do interior do Pai. A locução «de junto de» é natural em português e preserva a dimensão relacional e espacial da expressão grega.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: vim ao mundo
  rationale: O perfeito ἐλήλυθα descreve uma vinda concluída com relevância presente. Em português, «vim» comunica isso naturalmente no contexto; «ao mundo» é a formulação idiomática usual para o movimento indicado por εἰς.
- source_word: πάλιν
  choice: Agora
  rationale: 'Neste contexto, πάλιν introduz o movimento correspondente e inverso: depois de vir ao mundo, Jesus o deixa e vai para o Pai. «Agora» torna clara essa progressão em português sem sugerir que ele já tenha deixado o mundo anteriormente.'
- source_word: ἀφίημι τὸν κόσμον
  choice: deixo o mundo
  rationale: O presente aponta para a partida iminente. O presente português funciona naturalmente e mantém a concisão do grego.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: vou para o Pai
  rationale: Preserva o movimento em direção ao Pai. «Para» é natural no português moderno e não acrescenta uma explicação teológica ausente do texto.
theological_decisions:
- issue: A origem de Jesus no Pai e seu retorno ao Pai
  choice: Traduzir diretamente como «Saí de junto do Pai» e «vou para o Pai».
  alternative: Expandir a frase como uma explicação explícita da preexistência ou da encarnação.
  rationale: O versículo afirma a origem de Jesus no Pai, sua vinda ao mundo e seu retorno ao Pai. A tradução mantém essa afirmação cristológica sem acrescentar formulações doutrinárias que não aparecem expressamente no grego.
- issue: Sentido de πάλιν na sequência dos movimentos
  choice: Agora
  alternative: Novamente; outra vez
  rationale: «Novamente» ou «outra vez» poderia sugerir, em português, uma repetição do ato de deixar o mundo. Aqui, πάλιν assinala mais naturalmente a etapa seguinte e inversa do percurso.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A redação evita tanto arcaísmos como paráfrases doutrinárias.
