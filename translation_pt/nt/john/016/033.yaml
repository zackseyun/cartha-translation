id: JHN.16.33
reference: John 16:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε· ἐν τῷ κόσμῳ θλῖψιν ἔχετε, ἀλλὰ θαρσεῖτε, ἐγὼ νενίκηκα τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/033.yaml
  text: I have spoken these things to you so that in me you may have peace[a]. In the world you have tribulation, but take courage[b]; I have overcome the world.
translation:
  language: pt
  text: 'Eu lhes disse estas coisas para que em mim vocês tenham paz. No mundo vocês passam por aflição[a]; mas tenham coragem[b]: eu venci o mundo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «tribulação», «angústia» ou «sofrimento».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «tenham bom ânimo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λελάληκα ὑμῖν
  choice: Eu lhes disse estas coisas
  rationale: Mantém o demonstrativo plural e expressa de modo natural em português o perfeito λελάληκα, uma fala concluída cuja relevância permanece.
- source_word: ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε
  choice: para que em mim vocês tenham paz
  rationale: Preserva a finalidade de ἵνα, a linguagem joanina significativa de «em mim» e o sentido contínuo do presente subjuntivo.
- source_word: ἐν τῷ κόσμῳ
  choice: No mundo
  rationale: Conserva a formulação ampla e teologicamente carregada de João sem restringi-la a «sistema do mundo» ou «mundo caído».
- source_word: θλῖψιν ἔχετε
  choice: vocês passam por aflição
  rationale: «Aflição» comunica pressão, sofrimento e angústia; «passam por» torna natural o presente idiomático sem transformá-lo em futuro.
- source_word: θαρσεῖτε
  choice: tenham coragem
  rationale: Imperativo claro e atual que exorta à confiança diante da aflição; «tenham bom ânimo» seria menos corrente.
- source_word: ἐγὼ νενίκηκα τὸν κόσμον
  choice: eu venci o mundo
  rationale: Em português, o pretérito perfeito «venci» é a forma natural de apresentar uma vitória consumada com efeito vigente; o pronome explícito preserva a ênfase de ἐγώ.
theological_decisions:
- issue: Sentido de κόσμος no contexto joanino
  choice: mundo nas duas ocorrências
  alternative: sistema do mundo; este mundo caído
  rationale: A repetição mantém o contraste entre estar «em mim» e estar «no mundo», sem reduzir a polissemia teológica de κόσμος.
- issue: Força do perfeito νενίκηκα antes da crucificação na narrativa
  choice: eu venci o mundo
  alternative: eu tenho vencido o mundo; eu já derrotei o mundo
  rationale: A declaração apresenta a vitória como decisiva e vigente. O português idiomático usa aqui o pretérito perfeito, sem explicar como se relaciona com os acontecimentos ainda futuros na narrativa.
- issue: Natureza da aflição indicada por θλῖψις
  choice: aflição
  alternative: tribulação; dificuldades; angústia
  rationale: «Aflição» preserva o peso do sofrimento sem impor um sentido técnico escatológico que o substantivo isolado não exige.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. «Vocês» explicita o plural de ὑμῖν/ἔχητε/ἔχετε; a ordem «em mim» conserva o contraste joanino. As notas foram associadas aos termos corretos segundo o grego, corrigindo a aparente inversão dos marcadores na camada inglesa.
