  text: καὶ ὑμεῖς οὖν ⸂νῦν μὲν λύπην⸃ ἔχετε· πάλιν δὲ ὄψομαι ὑμᾶς, καὶ χαρήσεται ὑμῶν ἡ καρδία, καὶ τὴν χαρὰν ὑμῶν οὐδεὶς ⸀αἴρει ἀφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/022.yaml
  text: So you also now have sorrow; but I will see you again[a], and your heart will rejoice, and no one will take your joy from you.
translation:
  language: pt
  text: Assim, agora vocês também sentem tristeza; mas eu os verei novamente[a], e o coração de vocês se alegrará, e ninguém lhes tirará a alegria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “eu os verei novamente”, com Jesus como sujeito e os discípulos como objeto. Essa formulação pode enfatizar a iniciativa de Jesus ao voltar para junto dos seus discípulos.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Assim
  rationale: Marca a conclusão e a aplicação da comparação com o parto no versículo anterior, mantendo a ligação discursiva em português natural.
- source_word: νῦν μὲν λύπην ἔχετε
  choice: agora sentem tristeza
  rationale: Preserva o substantivo λύπη como “tristeza” e expressa de modo idiomático a experiência presente dos discípulos; o contraste de μέν é completado por “mas” na oração seguinte.
- source_word: πάλιν δὲ
  choice: mas ... novamente
  rationale: “Mas” representa o contraste introduzido por δέ, enquanto “novamente” comunica πάλιν e a renovação do encontro.
- source_word: ὄψομαι ὑμᾶς
  choice: eu os verei
  rationale: Mantém a estrutura explícita do grego, na qual Jesus é o sujeito e os discípulos são o objeto, sem harmonizá-la com João 16:16.
- source_word: χαρήσεται ὑμῶν ἡ καρδία
  choice: o coração de vocês se alegrará
  rationale: Conserva a imagem semítica do coração como centro da vida interior e a força verbal futura de χαρήσεται.
- source_word: τὴν χαρὰν ὑμῶν
  choice: a sua alegria
  rationale: Tradução possessiva natural que mantém a ligação lexical entre “se alegrará” e “alegria”.
- source_word: οὐδεὶς αἴρει ἀφ’ ὑμῶν
  choice: ninguém tirará de vocês
  rationale: Embora αἴρει esteja no presente, o futuro em português se ajusta à orientação futura da promessa e comunica naturalmente que essa alegria não lhes será retirada.
theological_decisions:
- issue: Sujeito e ênfase do reencontro futuro
  choice: eu os verei novamente
  alternative: vocês me verão novamente
  rationale: O texto grego apresenta inequivocamente Jesus como sujeito de ὄψομαι e os discípulos como objeto. A tradução preserva essa forma e a possível ênfase na iniciativa de Jesus, enquanto a nota registra a formulação alternativa comum no contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Vocês” evita regionalismos excessivos; “sentem tristeza” soa mais natural do que uma reprodução rígida de “têm tristeza”. O paralelismo entre “se alegrará” e “alegria” foi mantido.
