  source_fidelity: A tradução preserva adequadamente a estrutura argumentativa, o propósito introduzido por ἵνα, a contingência futura de ὅταν, o contraste de δέ e a razão final («porque eu estava com vocês»). O perfeito λελάληκα é bem vertido pelo pretérito perfeito português neste contexto. Contudo, «a hora delas» tende a sugerir que o pronome se refere a «estas coisas», ao passo que, no contexto imediato, o antecedente mais provável são os agentes hostis mencionados anteriormente. «Deles» permite o masculino genérico sem definir além do necessário a referência do αὐτῶν.
  naturalness: O texto principal é claro, moderno e de boa legibilidade. A combinação de «lhes» com «vocês» é gramatical e aceitável num registro internacional. A formulação da nota atual, porém, apresenta uma sequência literal pouco inteligível («se lembrem delas, de que eu lhes falei») e não explica com precisão onde ocorre a segunda repetição grega.
  terminology: «Estas coisas», «para que», «desde o princípio» e «estava com vocês» são escolhas apropriadas e dignas. «Disse» e «falei» representam adequadamente os verbos de comunicação sem introduzir interpretação teológica.
