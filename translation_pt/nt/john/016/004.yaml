  text: ἀλλὰ ταῦτα λελάληκα ὑμῖν ἵνα ὅταν ἔλθῃ ἡ ὥρα ⸀αὐτῶν μνημονεύητε ⸁αὐτῶν ὅτι ἐγὼ εἶπον ὑμῖν. Ταῦτα δὲ ὑμῖν ἐξ ἀρχῆς οὐκ εἶπον, ὅτι μεθ’ ὑμῶν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/004.yaml
  text: But I have spoken these things to you so that when their hour comes[a], you may remember that I told you. But I did not tell you these things from the beginning, because I was with you.
translation:
  language: pt
  text: Mas eu lhes disse estas coisas para que, quando chegar a hora deles[a], vocês se lembrem de que eu lhes falei. Não lhes disse estas coisas desde o princípio, porque eu estava com vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego repete αὐτῶν («deles/delas»): uma vez em «a hora deles» e outra após «se lembrem». Muito literalmente, a sequência seria algo como: «para que, quando chegar a hora deles, vocês se lembrem deles, que eu lhes falei». As duas ocorrências são difíceis de reproduzir com naturalidade em português, e o referente exato do pronome permanece aberto.'
    reason: alternativa lexical e ambiguidade sintática
lexical_decisions:
- source_word: λελάληκα
  choice: eu lhes disse
  rationale: O perfeito apresenta uma fala já realizada e ainda relevante. Em português, o pretérito perfeito simples é mais natural do que «tenho dito» neste contexto.
- source_word: ταῦτα
  choice: estas coisas
  rationale: O demonstrativo plural retoma as advertências anteriores sem restringi-las apenas a palavras específicas.
- source_word: ἵνα
  choice: para que
  rationale: Preserva de modo natural a força de propósito.
- source_word: ὅταν ἔλθῃ ἡ ὥρα αὐτῶν
  choice: quando chegar a hora delas
  rationale: Expressa a contingência futura e conserva a formulação ambígua do genitivo αὐτῶν, sem identificar indevidamente seu referente.
- source_word: μνημονεύητε
  choice: vocês se lembrem
  rationale: Verbo corrente e claro para a recordação pretendida.
- source_word: ὅτι ἐγὼ εἶπον ὑμῖν
  choice: de que eu lhes falei
  rationale: Depois de «lembrar-se», «de que» é idiomático em português; «lhes falei» evita acrescentar um objeto não expresso nessa oração e mantém o sentido de comunicação anterior.
- source_word: ἐξ ἀρχῆς
  choice: desde o princípio
  rationale: Equivalente direto e digno, com sentido temporal contínuo desde o começo.
- source_word: μεθ’ ὑμῶν ἤμην
  choice: eu estava com vocês
  rationale: Representa diretamente a relação de presença indicada pelo grego.
theological_decisions:
- issue: Referente e repetição de αὐτῶν
  choice: O primeiro αὐτῶν foi conservado como «delas»; o segundo é indicado em nota, pois sua reprodução literal tornaria a frase principal pouco natural.
  alternative: 'Traduzir de forma mais literal: «quando chegar a hora delas, vocês se lembrem delas, de que eu lhes falei».'
  rationale: O texto do SBLGNT contém duas ocorrências de αὐτῶν, cuja relação sintática e referência são difíceis. A tradução principal preserva a primeira sem definir o referente, enquanto a nota registra a forma mais literal e mantém a tensão textual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega «vocês/lhes», evita construções excessivamente literais no texto principal e conserva em nota a ambiguidade das duas ocorrências de αὐτῶν.
