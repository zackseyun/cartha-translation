  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐν τῷ ὀνόματί μου αἰτήσεσθε, καὶ οὐ λέγω ὑμῖν ὅτι ἐγὼ ἐρωτήσω τὸν πατέρα περὶ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/026.yaml
  text: On that day you will ask in my name[a], and I do not say to you that I will ask the Father concerning you[c][b];
translation:
  language: pt
  text: Naquele dia, vocês pedirão em meu nome, e não lhes digo que eu pedirei ao Pai a respeito de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego emprega dois verbos diferentes neste versículo: αἰτέω para o pedido dos discípulos e ἐρωτάω para o pedido de Jesus ao Pai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Naquele dia
  rationale: A expressão é temporal; “naquele dia” é natural em português e conserva a ênfase demonstrativa.
- source_word: ἐν τῷ ὀνόματί μου
  choice: em meu nome
  rationale: Preserva a expressão joanina e sua amplitude, sem reduzi-la apenas a autoridade ou representação.
- source_word: αἰτήσεσθε
  choice: vocês pedirão
  rationale: O futuro e a segunda pessoa do plural são mantidos; “pedir” é natural no contexto de oração.
- source_word: οὐ λέγω ὑμῖν
  choice: não lhes digo
  rationale: Mantém o presente do grego em português corrente e digno.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo do que Jesus não está dizendo, e não uma oração causal.
- source_word: ἐρωτήσω
  choice: pedirei
  rationale: “Pedir” é natural para a solicitação dirigida ao Pai; a nota registra que o grego emprega aqui um verbo diferente do anterior.
- source_word: τὸν πατέρα
  choice: ao Pai
  rationale: Reproduz o artigo do grego sem acrescentar um possessivo ausente no texto.
- source_word: περὶ ὑμῶν
  choice: por vocês
  rationale: Neste contexto, περί com genitivo admite o sentido de interesse ou intercessão em favor de alguém; “por vocês” é natural e preserva essa possibilidade.
theological_decisions:
- issue: Se Jesus nega toda intercessão futura ou apenas afirma que não está apresentando assim o acesso dos discípulos ao Pai neste contexto
  choice: Traduzir diretamente “não lhes digo que eu pedirei ao Pai por vocês”, sem transformar a frase numa negação absoluta da intercessão de Jesus.
  alternative: Parafrasear que Jesus jamais intercederá por eles, ou que terão acesso ao Pai sem qualquer mediação.
  rationale: A construção trata do que Jesus não está dizendo neste ponto. A tradução conserva a tensão com outras passagens sobre sua atuação em favor dos discípulos, sem resolvê-la doutrinariamente.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com “vocês” para explicitar a segunda pessoa do plural. A pontuação encerra o versículo com ponto, embora a unidade discursiva prossiga no contexto.
