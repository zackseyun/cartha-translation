id: JHN.16.30
reference: John 16:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: νῦν οἴδαμεν ὅτι οἶδας πάντα καὶ οὐ χρείαν ἔχεις ἵνα τίς σε ἐρωτᾷ· ἐν τούτῳ πιστεύομεν ὅτι ἀπὸ θεοῦ ἐξῆλθες.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/030.yaml
  text: Now we know that you know all things and have no need that anyone should question you[a]. By this we believe that you came from God.
translation:
  language: pt
  text: Agora sabemos que sabes todas as coisas e não precisas que alguém te faça perguntas[a]. Por isso, cremos que vieste de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “te interrogue”. O verbo grego pode significar “perguntar” ou “interrogar”; aqui, o contexto trata do conhecimento de Jesus e das perguntas ainda não expressas pelos discípulos.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: Agora
  rationale: Marca a compreensão presente dos discípulos de modo natural e conciso.
- source_word: οἴδαμεν
  choice: sabemos
  rationale: Embora tenha forma de perfeito, οἶδα possui sentido presente; o presente simples é idiomático em português.
- source_word: οἶδας πάντα
  choice: sabes todas as coisas
  rationale: Preserva a abrangência de πάντα e o tom solene, sem explicitar uma formulação doutrinária além do texto.
- source_word: οὐ χρείαν ἔχεις
  choice: não precisas
  rationale: Expressa naturalmente em português atual a ausência de necessidade indicada pela construção nominal grega.
- source_word: ἵνα τίς σε ἐρωτᾷ
  choice: que alguém te interrogue
  rationale: ἐρωτάω pode significar perguntar ou interrogar. Aqui, o contexto enfatiza que Jesus conhece as questões sem precisar que sejam formuladas; “interrogar” preserva essa nuance sem necessariamente sugerir hostilidade.
- source_word: ἐν τούτῳ
  choice: Por isso
  rationale: Indica que o que acaba de ser afirmado serve de fundamento para a conclusão dos discípulos, em português claro e natural.
- source_word: πιστεύομεν
  choice: cremos
  rationale: É a formulação direta e digna da confissão dos discípulos; mantém o sentido de πιστεύω neste contexto.
- source_word: ἀπὸ θεοῦ
  choice: de Deus
  rationale: Traduz diretamente a origem expressa no grego, sem substituir “Deus” por “Pai”.
- source_word: ἐξῆλθες
  choice: vieste
  rationale: Com “de Deus”, comunica de modo idiomático a origem e missão de Jesus; “saíste” seria mais literal, porém menos natural e potencialmente equívoco.
theological_decisions:
- issue: Força cristológica de “sabes todas as coisas”
  choice: Manter a declaração dos discípulos sem ampliação explicativa.
  alternative: Explicitar que Jesus é onisciente.
  rationale: A tradução conserva todo o peso cristológico da afirmação, mas não acrescenta uma formulação doutrinária que não esteja expressa no versículo.
- issue: Sentido de ἀπὸ θεοῦ ἐξῆλθες
  choice: vieste de Deus
  alternative: vieste do Pai; saíste de Deus
  rationale: A redação traduz diretamente o texto e preserva sua afirmação de origem e missão divinas, sem harmonizá-lo com referências próximas ao Pai nem resolver em excesso a imagem de ἐξέρχομαι.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Emprega “tu” coerentemente nas formas verbais (“sabes”, “precisas”, “vieste”), evitando regionalismos marcados. A pontuação mantém a nota ligada à expressão pertinente.
