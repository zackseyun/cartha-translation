source:
  edition: SBLGNT
  text: ὅταν δὲ ἔλθῃ ἐκεῖνος, τὸ πνεῦμα τῆς ἀληθείας, ὁδηγήσει ὑμᾶς ⸂ἐν τῇ ἀληθείᾳ πάσῃ⸃, οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ, ἀλλ’ ὅσα ⸀ἀκούσει λαλήσει, καὶ τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/013.yaml
  text: But when he[a], the Spirit of truth, comes, he will guide you into all the truth. For he will not speak from himself, but whatever he hears he will speak[d][c][b], and he will declare to you the things that are coming.
translation:
  language: pt
  text: Mas, quando ele, o Espírito da verdade, vier, guiará vocês a toda a verdade[a], pois não falará por si mesmo; pelo contrário, falará tudo o que ouvir e anunciará a vocês as coisas que estão por vir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «guiará vocês em toda a verdade». A preposição grega significa normalmente «em», mas, com o verbo «guiar», também pode ser entendida em sentido direcional.'
    reason: alternativa_lexical
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Mas, quando
  rationale: ὅταν introduz uma circunstância futura, e δέ mantém a transição levemente contrastiva com o contexto anterior.
- source_word: ἔλθῃ ἐκεῖνος
  choice: quando ele ... vier
  rationale: O aoristo do subjuntivo depois de ὅταν aponta para uma ocasião futura. O pronome masculino ἐκεῖνος é representado por “ele”, preservando a referência pessoal.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: o Espírito da verdade
  rationale: Mantém o título joanino e a relação genitiva sem parafraseá-la como se significasse exclusivamente “o Espírito que é a verdade”.
- source_word: ὁδηγήσει ὑμᾶς
  choice: guiará vocês
  rationale: ὁδηγέω expressa condução ou orientação; “guiará” é corrente e preserva a metáfora. “Vocês” comunica com clareza o plural de ὑμᾶς em português contemporâneo.
- source_word: ἐν τῇ ἀληθείᾳ πάσῃ
  choice: em toda a verdade
  rationale: Conserva o valor formal de ἐν e o sentido definido de τῇ ἀληθείᾳ, enquanto “toda” representa πάσῃ. A possibilidade direcional é registrada em nota.
- source_word: οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ
  choice: pois não falará por si mesmo
  rationale: “Por si mesmo” é uma expressão portuguesa natural que preserva a ideia de que sua fala não procede independentemente dele próprio, sem acrescentar explicitamente “autoridade”.
- source_word: ἀλλ’ ὅσα ἀκούσει λαλήσει
  choice: pelo contrário, falará tudo o que ouvir
  rationale: A formulação mantém o contraste entre não falar por si mesmo e falar o que ouvir. O futuro grego é reproduzido por “ouvir” em uma construção portuguesa de referência futura.
- source_word: τὰ ἐρχόμενα
  choice: as coisas que estão por vir
  rationale: A expressão representa o particípio presente substantivado como realidades ou acontecimentos vindouros, sem restringi-los a uma categoria específica.
- source_word: ἀναγγελεῖ ὑμῖν
  choice: anunciará a vocês
  rationale: ἀναγγέλλω pode significar anunciar, relatar ou dar a conhecer; “anunciará” preserva o tom declarativo e permanece acessível.
theological_decisions:
- issue: Referência pessoal ao Espírito
  choice: Usar o pronome pessoal masculino “ele”
  alternative: Evitar o pronome repetindo “o Espírito”
  rationale: O próprio texto grego emprega o demonstrativo masculino ἐκεῖνος em aposição a πνεῦμα. “Ele” preserva essa referência pessoal sem acrescentar uma formulação doutrinária externa ao versículo.
- issue: Sentido de ἐν com ὁδηγήσει
  choice: “guiará vocês em toda a verdade” no texto principal
  alternative: “guiará vocês para toda a verdade”
  rationale: “Em” mantém a forma da preposição grega e é compreensível em português; “para” explicita a possível força direcional da metáfora. A alternativa é mantida em nota para não eliminar a tensão tradutória.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem “ele, o Espírito da verdade, vier” torna clara a aposição. Evitaram-se tanto uma literalidade artificial quanto explicações doutrinárias não expressas no texto.
