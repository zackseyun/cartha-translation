id: JHN.16.27
reference: John 16:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: αὐτὸς γὰρ ὁ πατὴρ φιλεῖ ὑμᾶς, ὅτι ὑμεῖς ἐμὲ πεφιλήκατε καὶ πεπιστεύκατε ὅτι ἐγὼ παρὰ τοῦ ⸀θεοῦ ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/027.yaml
  text: For the Father himself loves you[a], because you have loved me and have believed that I came from God.
translation:
  language: pt
  text: Pois o próprio Pai ama vocês, porque vocês me amaram e creram que eu vim de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “saí de junto de Deus”; o grego também pode sugerir que ele veio da presença de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: o próprio
  rationale: O pronome é intensivo e enfatiza que o Pai mesmo ama os discípulos; “o próprio Pai” é natural e preserva essa força.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e mantém a ligação discursiva sem confundi-la com o segundo nexo causal do versículo.
- source_word: ὁ πατὴρ
  choice: Pai
  rationale: É título divino no uso joanino e, por isso, recebe inicial maiúscula.
- source_word: φιλεῖ
  choice: ama
  rationale: Expressa amor ou afeição pessoal; “ama” é claro, digno e adequado ao contexto, sem enfraquecer o vínculo relacional.
- source_word: ὑμᾶς
  choice: vocês
  rationale: Refere-se coletivamente aos discípulos; “vocês” oferece leitura natural e ampla no português moderno.
- source_word: ὅτι
  choice: porque
  rationale: A primeira ocorrência introduz a razão declarada para o amor do Pai.
- source_word: ὑμεῖς
  choice: vocês
  rationale: O pronome explícito no grego traz alguma ênfase, suficientemente comunicada pelo sujeito expresso em português, sem o peso excessivo de “vocês mesmos”.
- source_word: ἐμὲ
  choice: me
  rationale: Objeto direto de πεφιλήκατε, referente a Jesus.
- source_word: πεφιλήκατε
  choice: amaram
  rationale: O perfeito indica amor estabelecido com relevância presente. O pretérito perfeito português é a forma mais natural aqui; “têm amado” sugeriria repetição ou continuidade não necessariamente expressa pelo grego.
- source_word: καὶ
  choice: e
  rationale: 'Coordena os dois fundamentos mencionados: amar Jesus e crer em sua procedência.'
- source_word: πεπιστεύκατε
  choice: creram
  rationale: O perfeito grego apresenta uma fé adquirida e ainda relevante. “Creram” é natural em português e se ajusta à oração proposicional seguinte.
- source_word: ὅτι
  choice: que
  rationale: A segunda ocorrência introduz o conteúdo da fé.
- source_word: παρὰ τοῦ θεοῦ
  choice: de Deus
  rationale: A preposição παρά com genitivo indica procedência e pode também evocar saída da presença de alguém; a tradução principal mantém a formulação concisa, e a nota registra a nuance.
- source_word: ἐξῆλθον
  choice: vim
  rationale: No contexto, descreve a vinda de Jesus a partir de Deus. “Vim” é idiomático, enquanto a nota preserva a alternativa mais formal “saí de junto de Deus”.
theological_decisions:
- issue: Força cristológica de παρὰ τοῦ θεοῦ ἐξῆλθον
  choice: “vim de Deus”, como linguagem de procedência e missão, sem paráfrase doutrinária adicional
  alternative: “saí de junto de Deus” ou “procedi de Deus”
  rationale: A formulação afirma a procedência de Jesus em relação a Deus, mas não deve ser expandida para resolver além do texto todas as suas implicações cristológicas. A nota preserva a possível nuance da presença de Deus.
- issue: Relação entre o amor do Pai e o amor e a fé dos discípulos
  choice: preservar o nexo causal explícito com “porque”
  alternative: enfraquecer o vínculo como simples explicação circunstancial
  rationale: O primeiro ὅτι é causal. A tradução mantém a tensão teológica da declaração sem reinterpretá-la como mérito humano nem remover a causalidade expressa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para o plural. Os perfeitos gregos foram traduzidos pelo pretérito perfeito simples (“amaram”, “creram”), mais idiomático em português, mantendo pelo contexto sua relevância presente. A nota está marcada no texto principal.
