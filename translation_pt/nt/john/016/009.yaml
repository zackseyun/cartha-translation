lexical_decisions:
- source_word: περὶ
  choice: quanto a
  rationale: Com o genitivo, introduz o assunto a respeito do qual o Espírito convencerá o mundo. “Quanto a” é natural em português e sustenta o paralelismo com os versículos seguintes.
- source_word: ἁμαρτίας
  choice: pecado
  rationale: O substantivo abstrato no singular designa a categoria de pecado, sem especificar atos individuais.
- source_word: μέν
  choice: —
  rationale: Marca o primeiro elemento de uma série desenvolvida nos versículos 9–11. Em português, sua função discursiva fica adequadamente expressa pela estrutura paralela, sem equivalente lexical explícito.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão ou explicação de “quanto ao pecado”. “Porque” comunica de modo claro essa força causal, embora o grego também possa admitir uma formulação epexegética com “que”.
- source_word: οὐ πιστεύουσιν
  choice: não creem
  rationale: O presente do indicativo descreve a realidade vigente da incredulidade. “Crer” é a forma corrente e digna para πιστεύω neste contexto.
- source_word: εἰς ἐμέ
  choice: em mim
  rationale: A construção joanina πιστεύω εἰς expressa fé ou confiança pessoal dirigida a Jesus; “crer em mim” é a formulação idiomática correspondente em português.
theological_decisions:
- issue: Natureza do pecado identificado no versículo
  choice: O versículo apresenta a incredulidade em Jesus como a expressão decisiva do pecado neste contexto.
  alternative: Entender o pecado como a pecaminosidade humana em geral, sendo a incredulidade apenas um exemplo.
  rationale: A oração introduzida por ὅτι liga diretamente “pecado” ao fato de não crerem em Jesus. A tradução preserva essa ligação sem ampliá-la para uma formulação doutrinária não explicitada no texto.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. “Quanto ao” mantém o tom discursivo e o paralelismo da passagem; “creem” evita uma perífrase desnecessária. Nenhuma nota foi incluída, pois a alternativa “que não creem em mim” é possível, mas não precisa ser exibida para que a ambiguidade relevante seja respeitada nesta unidade breve.
