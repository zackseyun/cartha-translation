  source_fidelity: «Quanto ao pecado, porque não creem em mim» reproduz com precisão a estrutura de περὶ ἁμαρτίας ... ὅτι οὐ πιστεύουσιν εἰς ἐμέ. O singular abstrato «pecado», o valor explicativo-causal de «porque» e a construção idiomática «crer em mim» são adequados. O ponto e vírgula preserva corretamente a continuidade da enumeração dos versículos 9–11.
  naturalness: O texto é claro, moderno e natural em português de ampla compreensão, incluindo o uso brasileiro de «creem». «Quanto ao» funciona bem como introdução temática e mantém o paralelismo esperado com os versículos seguintes.
  terminology: «Pecado» e «crer em mim» são termos estabelecidos, idiomáticos e teologicamente não expansionistas. A redação preserva a ligação textual entre pecado e a não crença em Jesus, sem impor uma formulação doutrinária adicional.
