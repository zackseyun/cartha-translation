source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐμὲ οὐκ ἐρωτήσετε οὐδέν· ἀμὴν ἀμὴν λέγω ὑμῖν, ⸂ἄν τι⸃ αἰτήσητε τὸν πατέρα ⸂δώσει ὑμῖν ἐν τῷ ὀνόματί μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/023.yaml
  text: And in that day you will ask me nothing[a]. Truly, truly, I say to you, whatever you ask the Father in my name[b], he will give to you.
translation:
  language: pt
  text: 'Naquele dia, vocês não me farão nenhuma pergunta[a]. Em verdade, em verdade lhes digo: se pedirem alguma coisa ao Pai, ele a dará a vocês em meu nome[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego emprega dois verbos diferentes neste versículo: primeiro ἐρωτάω, aqui traduzido por “fazer pergunta”, com referência a Jesus; depois αἰτέω, “pedir”, com referência ao Pai.'
    reason: lexical_alternative
  - marker: b
    text: '“Em meu nome” também pode ser entendido com “pedirem”: “se pedirem alguma coisa ao Pai em meu nome, ele a dará a vocês”.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Naquele dia
  rationale: Expressão temporal natural em português que preserva a ressonância joanina sem tornar a frase artificial.
- source_word: ἐμὲ οὐκ ἐρωτήσετε οὐδέν
  choice: vocês não me farão pergunta alguma
  rationale: Distingue naturalmente o ato de fazer perguntas a Jesus do pedido dirigido ao Pai na oração seguinte, preservando a negação enfática e o objeto explícito “me”.
- source_word: ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Mantém a repetição enfática característica de João em linguagem digna e compreensível.
- source_word: ἄν τι αἰτήσητε
  choice: se pedirem alguma coisa
  rationale: Preserva a construção indefinida e condicional do grego, sem tornar a promessa mais absoluta do que a sintaxe exige.
- source_word: τὸν πατέρα
  choice: ao Pai
  rationale: Reproduz o texto grego, que diz “o Pai”, sem acrescentar o possessivo “meu”.
- source_word: δώσει ὑμῖν
  choice: ele a dará a vocês
  rationale: O pronome “a” retoma naturalmente “alguma coisa” e evita uma construção truncada em português.
- source_word: ἐν τῷ ὀνόματί μου
  choice: em meu nome
  rationale: Preserva a expressão joanina e sua amplitude representativa sem explicar de forma denominacional o mecanismo da promessa.
theological_decisions:
- issue: Distinção entre ἐρωτάω e αἰτέω
  choice: “fazer pergunta” para a ação dirigida a Jesus e “pedir” para a petição dirigida ao Pai
  alternative: Traduzir ambos simplesmente por “perguntar/pedir” e explicar toda a diferença em nota
  rationale: O português permite expressar a distinção lexical de modo natural, sem impor uma separação teológica mais rígida do que o texto.
- issue: Ligação sintática de “em meu nome”
  choice: Ligá-lo na linha principal a “ele a dará a vocês”, conforme a ordem do texto impresso do SBLGNT, registrando em nota a ligação tradicional ao pedido
  alternative: “se pedirem alguma coisa ao Pai em meu nome, ele a dará a vocês”
  rationale: A posição da expressão no texto grego fornecido favorece sua ligação ao verbo “dará”, mas a tradição textual e a pontuação admitem sua ligação ao pedido. A nota preserva essa ambiguidade relevante.
- issue: Alcance da promessa de oração
  choice: Traduzir diretamente, sem acrescentar condições doutrinárias
  alternative: Acrescentar que os pedidos devem estar de acordo com a vontade de Jesus
  rationale: Embora o contexto mais amplo possa orientar a interpretação, tal condição não é declarada nesta frase e não deve ser importada para a tradução.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O uso de “vocês” torna explícito o plural dos verbos gregos; “Em verdade, em verdade” conserva o tom solene e a repetição joanina. A formulação evita arcaísmos e explicações doutrinárias inseridas no texto.
