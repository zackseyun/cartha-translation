review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz bem a imagem, o contraste entre tristeza/aflição e alegria, e o sentido genérico de ἄνθρωπος. Contudo, «depois que dá à luz» explicita uma sequência posterior que o grego exprime paralelamente com ὅταν («quando»); «quando dá à luz» é mais próximo sem perder naturalidade.
  naturalness: O português é claro, moderno e apropriado. «Está dando à luz», «já não se lembra» e «por causa da alegria de ter nascido um ser humano no mundo» são naturais e compreensíveis. A substituição de «depois que» por «quando» mantém a fluência.
  terminology: «Mulher», «criança», «tristeza», «aflição», «hora» e «ser humano» são escolhas adequadas. A nota, porém, chama «um homem» de tradução literal de ἄνθρωπος, o que pode sugerir indevidamente que o termo significa especificamente um indivíduo masculino; convém apresentar isso como possibilidade lexical, não como literalidade necessária.
  issues:
  - severity: low
    issue: «Depois que» em lugar de «quando»
    rationale: O δεύτερο ὅταν introduz, como o primeiro, uma situação geral («quando dá à luz»). «Depois que» é contextualmente plausível, mas acrescenta uma relação temporal mais explícita do que a construção grega.
  - severity: medium
    issue: 'Nota lexical: «literalmente, “um homem”»'
    rationale: Ἄνθρωπος pode ser usado para «homem», mas também é frequentemente genérico, «ser humano/pessoa». Classificar «um homem» como a tradução literal pode induzir uma especificação masculina que o contexto não exige.
  revised_text: Quando uma mulher está dando à luz, sente tristeza, porque chegou a sua hora; mas, quando dá à luz a criança, já não se lembra da aflição, por causa da alegria de ter nascido um ser humano[a] no mundo.
