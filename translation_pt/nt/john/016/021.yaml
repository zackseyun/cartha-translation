source:
  edition: SBLGNT
  text: ἡ γυνὴ ὅταν τίκτῃ λύπην ἔχει, ὅτι ἦλθεν ἡ ὥρα αὐτῆς· ὅταν δὲ γεννήσῃ τὸ παιδίον, οὐκέτι μνημονεύει τῆς θλίψεως διὰ τὴν χαρὰν ὅτι ἐγεννήθη ἄνθρωπος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/021.yaml
  text: When a woman is giving birth[a], she has sorrow because her hour has come; but when she has given birth to the child, she no longer remembers the distress because of the joy that a child has been born into the world.
translation:
  language: pt
  text: Quando uma mulher está dando à luz, sente tristeza, porque chegou a sua hora; mas, quando dá à luz a criança, já não se lembra da aflição, por causa da alegria de ter nascido um ser humano[a] no mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma pessoa”. O grego ἄνθρωπος pode designar um homem ou, de modo geral, um ser humano; aqui não indica necessariamente alguém do sexo masculino.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: mulher
  rationale: Na ilustração genérica sobre o parto, significa 'mulher', não especificamente 'esposa'.
- source_word: ὅταν τίκτῃ
  choice: quando uma mulher está dando à luz
  rationale: O presente do subjuntivo com ὅταν apresenta uma situação geral em andamento; a formulação é natural e preserva o processo do parto.
- source_word: λύπην ἔχει
  choice: sente tristeza
  rationale: λύπη abrange tristeza e sofrimento, não apenas dor física, e se liga ao contraste contextual com a alegria.
- source_word: ἡ ὥρα αὐτῆς
  choice: chegou a sua hora
  rationale: Mantém 'hora', que aqui designa o momento chegado do parto e preserva a ressonância característica do vocabulário joanino.
- source_word: γεννήσῃ τὸ παιδίον
  choice: depois que dá à luz a criança
  rationale: A construção indica o parto como evento concluído; 'depois que' comunica essa relação temporal com naturalidade em português.
- source_word: οὐκέτι μνημονεύει
  choice: já não se lembra
  rationale: Tradução direta e idiomática de μνημονεύει com οὐκέτι.
- source_word: τῆς θλίψεως
  choice: da aflição
  rationale: Expressa o sofrimento intenso da experiência sem restringi-lo à dor física nem introduzir aqui o sentido técnico de 'tribulação'.
- source_word: διὰ τὴν χαράν
  choice: por causa da alegria
  rationale: διά com acusativo indica causa; a expressão é clara e corrente.
- source_word: ὅτι ἐγεννήθη
  choice: de ter nascido
  rationale: A formulação portuguesa apresenta de modo natural o motivo ou conteúdo da alegria, conservando a força explicativa de ὅτι.
- source_word: ἄνθρωπος
  choice: um ser humano
  rationale: Neste contexto, o substantivo é genérico e destaca a entrada de uma nova vida humana no mundo, sem indicar necessariamente sexo masculino.
- source_word: εἰς τὸν κόσμον
  choice: no mundo
  rationale: Em português, 'nascer no mundo' comunica idiomaticamente a entrada da pessoa no mundo; 'para dentro do mundo' seria rígido e pouco natural.
theological_decisions:
- issue: Sentido genérico de ἄνθρωπος
  choice: um ser humano
  alternative: uma pessoa; um homem; uma criança
  rationale: O substantivo, embora morfologicamente masculino, refere-se genericamente a uma nova vida humana. 'Ser humano' conserva essa referência sem sugerir que o bebê seja necessariamente do sexo masculino; a nota registra as possibilidades lexicais e a opção mais contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se 'sua hora' pela força temática joanina. 'Sente tristeza' e 'aflição' preservam a dimensão emocional e o contraste com a alegria, sem reduzir a experiência à dor física.
