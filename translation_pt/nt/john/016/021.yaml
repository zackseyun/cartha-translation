revisions:
- from: Quando uma mulher está dando à luz, sente tristeza, porque chegou a sua hora; mas, depois que dá à luz a criança, já não se lembra da aflição, por causa da alegria de ter nascido um ser humano[a] no mundo.
  to: Quando uma mulher está dando à luz, sente tristeza, porque chegou a sua hora; mas, quando dá à luz a criança, já não se lembra da aflição, por causa da alegria de ter nascido um ser humano[a] no mundo.
