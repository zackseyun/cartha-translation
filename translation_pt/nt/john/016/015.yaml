  text: πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν· διὰ τοῦτο εἶπον ὅτι ἐκ τοῦ ἐμοῦ λαμβάνει καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/015.yaml
  text: Everything that the Father has is mine[a]. That is why I said that he takes from what is mine and will declare it to you.
translation:
  language: pt
  text: Tudo o que o Pai tem é meu. Por isso eu disse que ele recebe[a] do que é meu e anunciará a vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toma”.'
    reason: Alternativa lexical para λαμβάνει, que pode significar “recebe” ou “toma” neste contexto.
lexical_decisions:
- source_word: πάντα ὅσα
  choice: Tudo o que
  rationale: Expressa de modo natural e abrangente a totalidade indicada pela construção grega.
- source_word: ἔχει
  choice: tem
  rationale: Equivalente direto e corrente do presente de ἔχω, sem a formalidade excessiva de “possui”.
- source_word: ὁ πατήρ
  choice: o Pai
  rationale: No contexto joanino, é uma designação pessoal de Deus; a inicial maiúscula preserva esse uso titular.
- source_word: ἐμά ἐστιν
  choice: é meu
  rationale: Reproduz de forma direta a construção possessiva e mantém a força da afirmação do Filho.
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Conector natural em português que preserva a relação explicativa e inferencial.
- source_word: εἶπον
  choice: eu disse
  rationale: O pretérito perfeito traduz adequadamente o aoristo; o pronome explícito dá clareza ao sujeito no fluxo da frase.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: do que é meu
  rationale: Explicita naturalmente a expressão elíptica grega e mantém a ideia de origem naquilo que pertence ao Filho.
- source_word: λαμβάνει
  choice: recebe
  rationale: O verbo pode significar “receber” ou “tomar”. Aqui, “recebe” é natural com a indicação de origem e evita que “tira” sugira subtração ou apropriação indevida; a alternativa é preservada em nota.
- source_word: ἀναγγελεῖ
  choice: anunciará
  rationale: Preserva o futuro e o sentido de comunicar ou dar a conhecer, adequado ao contexto revelatório joanino.
- source_word: ὑμῖν
  choice: a vocês
  rationale: Equivalente claro e amplamente compreensível do dativo plural dirigido aos discípulos.
theological_decisions:
- issue: Relação entre o que o Pai tem e o Filho
  choice: Tudo o que o Pai tem é meu
  alternative: Tudo o que o Pai tem pertence a mim
  rationale: Mantém a afirmação abrangente e forte do texto sobre o que pertence ao Filho, sem acrescentar terminologia doutrinária posterior.
- issue: Recepção pelo Espírito daquilo que é do Filho
  choice: ele recebe do que é meu
  alternative: ele tira do que é meu
  rationale: O grego admite as nuances de receber e tomar. O texto principal usa a formulação mais natural em português neste contexto, enquanto a nota preserva a alternativa lexical sem definir além do texto a relação do Espírito com o Filho.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil e inteligíveis internacionalmente. A formulação preserva a concisão, a progressão argumentativa e o futuro do anúncio.
