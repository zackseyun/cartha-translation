  text: ἀπεκρίθη ⸀αὐτοῖς Ἰησοῦς· Ἄρτι πιστεύετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/031.yaml
  text: Jesus answered them[a], “Do you now believe?”
translation:
  language: pt
  text: 'Jesus lhes respondeu: “Agora vocês creem?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Agora vocês creem.” O grego também pode ser entendido como uma afirmação, embora o contexto favoreça uma pergunta retórica.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: Aoristo narrativo de ἀποκρίνομαι; “respondeu” é a forma natural e convencional em português para introduzir a fala em um diálogo.
- source_word: αὐτοῖς
  choice: lhes
  rationale: Pronome dativo plural que indica os destinatários da resposta. “Lhes respondeu” preserva essa relação de modo conciso e idiomático.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: Ἄρτι
  choice: agora
  rationale: Expressa imediatidade temporal. “Agora” é claro, natural e mantém a ênfase temporal da fala de Jesus.
- source_word: πιστεύετε
  choice: vocês creem
  rationale: Presente ativo, segunda pessoa do plural, de πιστεύω. “Creem” traduz diretamente o verbo e “vocês” torna explícito o plural, com ampla inteligibilidade no português moderno.
theological_decisions:
- issue: Valor da frase Ἄρτι πιστεύετε;
  choice: “Agora vocês creem?” como pergunta retórica
  alternative: “Agora vocês creem.” como afirmação
  rationale: O grego pode ser pontuado como pergunta ou afirmação. O contexto imediato, em que Jesus anuncia que os discípulos serão dispersos, favorece a pergunta retórica, mas a leitura afirmativa continua genuinamente possível e é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O uso explícito de “vocês” comunica sem ambiguidade a segunda pessoa do plural; a nota preserva a ambiguidade de pontuação do grego.
