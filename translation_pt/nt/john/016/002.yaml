id: JHN.16.2
reference: John 16:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀποσυναγώγους ποιήσουσιν ὑμᾶς· ἀλλ’ ἔρχεται ὥρα ἵνα πᾶς ὁ ἀποκτείνας ὑμᾶς δόξῃ λατρείαν προσφέρειν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/002.yaml
  text: They will make you outcasts from the synagogues[a]; indeed[b], an hour is coming when everyone who kills you will think he is offering service to God.
translation:
  language: pt
  text: Eles expulsarão vocês das sinagogas[a]. De fato, vem a hora em que todo aquele que matar vocês pensará estar oferecendo culto a Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “excluirão vocês das sinagogas” ou “farão com que vocês sejam excluídos das sinagogas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “estar oferecendo adoração a Deus” ou “estar prestando serviço religioso a Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσυναγώγους ποιήσουσιν ὑμᾶς
  choice: Eles expulsarão vocês das sinagogas
  rationale: A construção com ποιέω e o adjetivo ἀποσυνάγωγος indica fazer alguém ficar excluído da comunidade da sinagoga. “Expulsarão vocês das sinagogas” comunica isso de modo natural e preserva o plural do texto grego.
- source_word: ἀλλ’
  choice: De fato
  rationale: Neste contexto, ἀλλά intensifica a advertência anterior, introduzindo uma perseguição ainda mais grave, em vez de marcar apenas uma oposição simples.
- source_word: ἔρχεται ὥρα
  choice: vem a hora
  rationale: Preserva a expressão joanina com ὥρα e soa natural em português, sem reduzir a imagem ao termo mais interpretativo “tempo”.
- source_word: ἵνα
  choice: em que
  rationale: Depois de “vem a hora”, introduz naturalmente o conteúdo ou a característica dessa hora em português.
- source_word: πᾶς ὁ ἀποκτείνας ὑμᾶς
  choice: todo aquele que matar vocês
  rationale: Reproduz a força universal da expressão substantivada e o valor genérico do particípio, com formulação clara e corrente.
- source_word: δόξῃ
  choice: pensará
  rationale: Expressa a convicção subjetiva e equivocada dos perseguidores sem insinuar que Deus aprova o ato.
- source_word: λατρείαν προσφέρειν τῷ θεῷ
  choice: estar oferecendo culto a Deus
  rationale: “Culto” preserva a dimensão religiosa e cultual de λατρεία, enquanto “oferecendo” reflete προσφέρειν e conserva a ironia chocante da afirmação.
theological_decisions:
- issue: A autocompreensão religiosa dos perseguidores
  choice: pensará estar oferecendo culto a Deus
  alternative: pensará estar prestando serviço a Deus
  rationale: A tradução mantém a linguagem cultual do grego e deixa claro que essa é a crença dos assassinos, não uma aprovação divina. “Culto” é natural em português e preserva melhor a densidade religiosa de λατρεία.
- issue: Valor genérico de πᾶς ὁ ἀποκτείνας
  choice: todo aquele que matar vocês
  alternative: quem matar vocês
  rationale: “Todo aquele” conserva explicitamente a força universal de πᾶς e o masculino singular representativo do grego, sem acrescentar identificação denominacional ou social aos perseguidores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” representa ὑμᾶς sem regionalismo excessivo. A formulação preserva a intensificação, a expressão joanina “vem a hora” e a tensão teológica da violência praticada como suposto culto.
