id: JHN.16.1
reference: John 16:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ταῦτα λελάληκα ὑμῖν ἵνα μὴ σκανδαλισθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/001.yaml
  text: I have spoken these things to you so that you may not fall away.
translation:
  language: pt
  text: Eu lhes disse essas coisas para que vocês não venham a tropeçar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sejam levados a tropeçar”, “se escandalizem” ou “abandonem a fé”. O verbo grego pode indicar que alguém é levado a vacilar, chegando à incredulidade ou ao afastamento.
    reason: Alternativas lexicais e esclarecimento da amplitude contextual de σκανδαλισθῆτε.
lexical_decisions:
- source_word: Ταῦτα
  choice: essas coisas
  rationale: O demonstrativo neutro plural retoma as palavras anteriores de Jesus. Em português corrente, “essas coisas” preserva o plural e faz uma retomada natural do que acaba de ser dito.
- source_word: λελάληκα
  choice: Eu lhes disse
  rationale: O perfeito de λαλέω apresenta as palavras já proferidas como relevantes para a situação presente. “Eu lhes disse” é natural em português e, no contexto, comunica melhor esse ato concluído do que “tenho falado”, que poderia sugerir repetição.
- source_word: ὑμῖν
  choice: lhes
  rationale: O pronome dativo representa o objeto indireto plural e evita uma construção mais pesada com “a vocês”.
- source_word: ἵνα μὴ
  choice: para que ... não
  rationale: A construção expressa propósito; “para que” seguido do subjuntivo é a forma portuguesa natural e fiel.
- source_word: σκανδαλισθῆτε
  choice: venham a tropeçar
  rationale: “Tropeçar” preserva a imagem lexical de σκανδαλίζω sem decidir de antemão se o resultado seria abalo, ofensa ou abandono da fé. “Venham a” torna natural a referência a uma eventual crise futura.
theological_decisions:
- issue: Alcance de σκανδαλισθῆτε diante da perseguição anunciada
  choice: venham a tropeçar
  alternative: venham a abandonar a fé / se afastem
  rationale: O contexto permite entender um tropeço que leve à incredulidade ou à deserção, mas o verbo mantém uma imagem mais ampla. O texto principal preserva essa tensão; a nota esclarece a gravidade possível sem impor como única leitura a apostasia consumada.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Vocês” fica implícito no pronome plural “lhes” e na forma verbal; a frase evita tanto linguagem excessivamente técnica quanto uma interpretação denominacional do possível tropeço.
