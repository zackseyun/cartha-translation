id: JHN.16.17
reference: John 16:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπαν οὖν ἐκ τῶν μαθητῶν αὐτοῦ πρὸς ἀλλήλους· Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με; καί· ⸀Ὅτι ὑπάγω πρὸς τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/017.yaml
  text: 'So some of his disciples said to one another[a], “What is this that he is saying to us: ‘A little while, and you will not see me, and again a little while, and you will see me’? And, ‘Because I am going to the Father’?”'
translation:
  language: pt
  text: 'Então, alguns dos seus discípulos disseram uns aos outros: “O que significa isto que ele nos diz: ‘Daqui a pouco vocês não me verão e, de novo, daqui a pouco vocês me verão’? E: ‘Porque vou para o Pai’[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E: ‘Que vou para o Pai’?” A conjunção grega pode introduzir o conteúdo citado (“que”) ou ter sentido causal (“porque”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e inferencial do que Jesus acabara de dizer, em português atual e natural.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: alguns dos seus discípulos
  rationale: Preserva o valor partitivo de ἐκ, indicando um grupo dentre os discípulos, não necessariamente todos.
- source_word: πρὸς ἀλλήλους
  choice: uns aos outros
  rationale: Expressa claramente a reciprocidade da conversa.
- source_word: Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν
  choice: O que significa isto que ele nos diz
  rationale: Torna natural em português a pergunta de perplexidade, sem perder a referência direta às palavras de Jesus.
- source_word: Μικρὸν
  choice: Daqui a pouco / pouco depois
  rationale: O adjetivo substantivado tem sentido temporal no contexto; a variação idiomática comunica os dois intervalos curtos sem alterar o conteúdo.
- source_word: θεωρεῖτέ με
  choice: vocês não me verão
  rationale: Comunica o sentido perceptivo do verbo de modo corrente e mantém o paralelo verbal da frase.
- source_word: ὄψεσθέ με
  choice: vocês me verão
  rationale: Tradução direta do futuro de ὁράω; repetir “ver” preserva o paralelismo retórico, embora o grego use verbos diferentes.
- source_word: πάλιν
  choice: novamente
  rationale: Preserva de modo direto a ideia de repetição.
- source_word: Ὅτι ὑπάγω πρὸς τὸν πατέρα
  choice: Porque vou para o Pai
  rationale: Mantém o possível valor causal de ὅτι e reproduz a formulação que causa perplexidade aos discípulos; a alternativa completiva é registrada em nota.
- source_word: τὸν πατέρα
  choice: o Pai
  rationale: Conserva o artigo e não acrescenta o possessivo “meu”, ausente no texto grego.
theological_decisions:
- issue: Referência da partida e do reencontro anunciados por Jesus
  choice: Manter indeterminada a referência exata
  alternative: Especificar morte e ressurreição, ascensão e presença espiritual, aparições após a ressurreição ou vinda do Espírito
  rationale: O próprio versículo apresenta a perplexidade dos discípulos e não identifica qual desses acontecimentos está em vista; a tradução não deve resolver antecipadamente essa tensão.
- issue: Função de ὅτι na última citação
  choice: 'Valor causal: “Porque vou para o Pai”'
  alternative: 'Valor completivo: “Que vou para o Pai”'
  rationale: Ambas as leituras são gramaticalmente possíveis. O texto principal preserva a força causal comum de ὅτι, enquanto a nota mantém explícita a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. A formulação conserva a pergunta truncada e cumulativa dos discípulos. O marcador [a] foi colocado junto à cláusula ambígua a que a nota se refere.
