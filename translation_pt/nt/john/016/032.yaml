  source_fidelity: 'O texto traduz com precisão os elementos centrais do grego: a hora simultaneamente iminente e já chegada, a dispersão passiva dos discípulos, o movimento distributivo de cada um εἰς τὰ ἴδια, o abandono de Jesus e a presença do Pai como razão de ele não estar só. “Cada um para o que é seu” preserva adequadamente a amplitude deliberada de τὰ ἴδια sem restringi-la a uma casa.'
