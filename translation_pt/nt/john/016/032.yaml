id: JHN.16.32
reference: John 16:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδοὺ ἔρχεται ὥρα ⸀καὶ ἐλήλυθεν ἵνα σκορπισθῆτε ἕκαστος εἰς τὰ ἴδια κἀμὲ μόνον ἀφῆτε· καὶ οὐκ εἰμὶ μόνος, ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/032.yaml
  text: Behold[a], an hour is coming, and has come, when you will be scattered, each to his own, and will leave me alone. Yet I am not alone, because the Father is with me.
translation:
  language: pt
  text: 'Vejam: está chegando a hora — e já chegou — em que vocês serão dispersos, cada um para o que é seu[a], e me deixarão sozinho. Contudo, não estou sozinho, porque o Pai está comigo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cada um para sua casa”, “seu lugar” ou “suas coisas”. A expressão grega é ampla e pode se referir, em geral, ao que pertence a cada um.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Vejam
  rationale: Mantém a função de chamar solenemente a atenção dos discípulos, em português atual e natural.
- source_word: ἔρχεται ὥρα καὶ ἐλήλυθεν
  choice: está chegando a hora — e já chegou —
  rationale: Preserva a tensão entre o acontecimento iminente e sua chegada já efetivada. O artigo em português é idiomático nessa construção temporal e não pretende apagar a ausência de artigo no grego.
- source_word: ἵνα
  choice: em que
  rationale: Após a expressão temporal, introduz naturalmente o conteúdo da hora, sem impor uma finalidade que o contexto não exige.
- source_word: σκορπισθῆτε
  choice: vocês serão dispersos
  rationale: Conserva a voz passiva e apresenta a dispersão como acontecimento esperado, não como mera possibilidade.
- source_word: ἕκαστος εἰς τὰ ἴδια
  choice: cada um para o que é seu
  rationale: Preserva o sentido distributivo e a amplitude de τὰ ἴδια, que pode abranger casa, lugar, bens ou esfera própria, sem especificar além do texto.
- source_word: κἀμὲ μόνον ἀφῆτε
  choice: e me deixarão sozinho
  rationale: Expressa com clareza a ação futura de deixar Jesus só, sem intensificá-la indevidamente com 'abandonar'.
- source_word: καὶ οὐκ εἰμὶ μόνος
  choice: Contudo, não estou sozinho
  rationale: Torna explícito o contraste contextual indicado por καί entre a partida dos discípulos e a presença do Pai.
- source_word: ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν
  choice: porque o Pai está comigo
  rationale: Traduz diretamente a razão apresentada por ὅτι e mantém o título relacional definido 'o Pai'.
theological_decisions:
- issue: Amplitude de ἕκαστος εἰς τὰ ἴδια
  choice: cada um para o que é seu
  alternative: cada um para sua casa
  rationale: A tradução evita limitar a expressão a uma residência, preservando a ambiguidade genuína do grego e sua ênfase distributiva.
- issue: Relação entre o fato de os discípulos deixarem Jesus e a presença do Pai
  choice: Contudo, não estou sozinho, porque o Pai está comigo
  alternative: E não estou sozinho, pois o Pai está comigo
  rationale: 'Mantém a tensão do versículo: Jesus será realmente deixado sozinho pelos discípulos, mas declara não estar sozinho em sentido absoluto por causa da presença do Pai, sem acrescentar conclusões doutrinárias posteriores.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Vejam' dirige-se naturalmente ao grupo; os travessões destacam sem resolver a tensão temporal entre a hora que se aproxima e a hora que já chegou.
