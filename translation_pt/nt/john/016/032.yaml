  terminology: “O Pai” mantém o título definido e relacional do original; “está comigo” traduz diretamente μετ’ ἐμοῦ ἐστιν. “Contudo” comunica de modo legítimo o contraste contextual, sem acrescentar interpretação doutrinária.
