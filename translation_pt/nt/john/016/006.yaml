id: JHN.16.6
reference: John 16:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ταῦτα λελάληκα ὑμῖν ἡ λύπη πεπλήρωκεν ὑμῶν τὴν καρδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/006.yaml
  text: But because I have spoken these things to you[a], sorrow has filled your heart.
translation:
  language: pt
  text: Mas, porque lhes falei estas coisas, a tristeza encheu o coração de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os corações de vocês”. No grego, “coração” está no singular, enquanto “de vocês” se refere a várias pessoas; essa construção pode apresentar a tristeza interior como compartilhada pelo grupo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Mas
  rationale: Conjunção adversativa que marca contraste com a declaração anterior; “Mas” é natural e preserva a força do grego.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a causa da tristeza dos discípulos, e não apenas o conteúdo do que foi dito.
- source_word: ταῦτα
  choice: estas coisas
  rationale: Preserva o demonstrativo plural e remete ao que Jesus acaba de dizer.
- source_word: λελάληκα
  choice: falei
  rationale: Em português, o pretérito perfeito simples expressa naturalmente o ato concluído cujos efeitos permanecem no presente; “tenho falado” sugeriria repetição ou continuidade não exigida pelo perfeito grego.
- source_word: ὑμῖν
  choice: lhes
  rationale: Dativo plural como objeto indireto; “lhes falei” é claro, natural e compatível com a referência plural aos discípulos.
- source_word: ἡ λύπη
  choice: a tristeza
  rationale: Traduz λύπη de modo corrente e solene, abrangendo profunda aflição emocional sem intensificar para além do texto.
- source_word: πεπλήρωκεν
  choice: encheu
  rationale: Conserva a imagem concreta de πληρόω. O perfeito grego descreve um enchimento consumado com resultado presente; o pretérito perfeito português comunica isso naturalmente no contexto.
- source_word: ὑμῶν τὴν καρδίαν
  choice: o coração de vocês
  rationale: Mantém o substantivo singular do grego e torna explícito, em português brasileiro claro, que o possessivo se refere ao grupo.
theological_decisions:
- issue: Singular coletivo “coração” ou plural distributivo “corações”
  choice: o coração de vocês
  alternative: os corações de vocês
  rationale: O grego combina o possessivo plural ὑμῶν com o substantivo singular καρδίαν. A tradução principal preserva essa forma e sua possível apresentação da tristeza interior compartilhada pelo grupo, enquanto a nota registra a leitura distributiva natural em português.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem “porque lhes falei estas coisas” segue de perto a estrutura grega sem soar artificial. O singular coletivo foi preservado no texto, com a alternativa idiomática plural em nota.
