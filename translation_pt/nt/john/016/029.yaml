  text: ⸀Λέγουσιν οἱ μαθηταὶ αὐτοῦ· Ἴδε νῦν ⸀ἐν παρρησίᾳ λαλεῖς, καὶ παροιμίαν οὐδεμίαν λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/029.yaml
  text: His disciples said[a], “Look[b], now you are speaking openly and are not speaking in any figure of speech.”
translation:
  language: pt
  text: 'Seus discípulos disseram: “Olha, agora falas abertamente[a] e não usas nenhuma linguagem figurada[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “claramente” ou “com franqueza”. A expressão grega pode indicar fala aberta, clara ou franca.
    reason: lexical_alternative
  - marker: b
    text: Ou “dito figurado”, “provérbio”, “parábola” ou “fala velada”. Aqui se refere a uma maneira figurada ou indireta de falar.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν
  choice: disseram
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma natural da narração em português.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Seus discípulos
  rationale: Construção possessiva idiomática que preserva claramente a relação com Jesus.
- source_word: Ἴδε
  choice: Veja
  rationale: Interjeição que chama a atenção do interlocutor; é atual e mais natural que “eis” neste diálogo.
- source_word: νῦν
  choice: agora
  rationale: Mantém a referência temporal à mudança que os discípulos julgam perceber na maneira de Jesus falar.
- source_word: ἐν παρρησίᾳ
  choice: abertamente
  rationale: No contraste imediato com παροιμία, indica discurso aberto, claro ou direto, mais que ousadia.
- source_word: λαλεῖς
  choice: fala
  rationale: O presente expressa a maneira como Jesus está falando naquele momento; o presente simples é natural em português.
- source_word: παροιμίαν
  choice: linguagem figurada
  rationale: Neste contexto joanino, designa fala figurada, indireta ou velada, e não necessariamente um provérbio sapiencial.
- source_word: οὐδεμίαν
  choice: nenhuma
  rationale: Reproduz a negação enfática aplicada ao objeto singular.
- source_word: λέγεις
  choice: usa
  rationale: Embora o verbo signifique literalmente “diz”, com “linguagem figurada” o português idiomático prefere “usa”, sem alterar o sentido.
theological_decisions:
- issue: Sentido de παρρησία em contraste com παροιμία
  choice: Jesus é descrito como falando abertamente, em vez de empregar linguagem figurada ou indireta.
  alternative: Jesus é descrito como falando com franqueza ou ousadia.
  rationale: O contraste explícito com παροιμία favorece clareza e caráter direto da expressão. A tradução mantém a tensão narrativa sem confirmar que a avaliação dos discípulos seja plenamente correta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “O senhor” evita uma conjugação regionalmente marcada e permanece natural como forma respeitosa de tratamento; a inicial minúscula evita introduzir uma distinção tipográfica ausente do grego. Os marcadores de nota foram colocados junto às expressões que explicam.
