source:
  edition: SBLGNT
  text: περὶ δικαιοσύνης δέ, ὅτι πρὸς τὸν ⸀πατέρα ὑπάγω καὶ οὐκέτι θεωρεῖτέ με·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/010.yaml
  text: and concerning righteousness[a], because I am going to the Father and you no longer see me.
translation:
  language: pt
  text: e quanto à justiça[a], porque vou para o Pai e vocês já não me veem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”. A palavra grega pode referir-se tanto à retidão quanto à justiça; neste contexto, também pode sugerir a vindicação de Jesus ao ir para o Pai.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: quanto a
  rationale: Preserva a estrutura das cláusulas paralelas nos vv. 9–11 em português natural e digno.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: Em português, “justiça” abrange tanto a qualidade de ser justo quanto a ideia de justiça/vindicação, ajustando-se ao campo semântico de δικαιοσύνη neste contexto.
- source_word: δέ
  choice: e
  rationale: Marca a continuação aditiva do item anterior da série, sem introduzir um contraste forte.
- source_word: ὅτι
  choice: porque
  rationale: Expressa naturalmente o valor causal da explicação introduzida por ὅτι.
- source_word: πρὸς τὸν πατέρα
  choice: para o Pai
  rationale: Com verbo de movimento, πρός indica direção; mantém-se o artigo e o título relacional do grego.
- source_word: ὑπάγω
  choice: vou
  rationale: O presente tem referência futura imediata no contexto; “vou” preserva essa proximidade e soa natural.
- source_word: οὐκέτι
  choice: já não
  rationale: Indica a cessação da visão a partir desse momento, em formulação corrente no português internacional.
- source_word: θεωρεῖτέ
  choice: veem
  rationale: Comunica com clareza a percepção visual, sem o arcaísmo ou a intensidade indevida de alternativas como “contemplam”.
theological_decisions:
- issue: Sentido de δικαιοσύνη em um contexto teologicamente significativo
  choice: justiça
  alternative: retidão
  rationale: “Justiça” é a correspondência portuguesa mais ampla e estabelecida para δικαιοσύνη, podendo incluir o caráter justo e a vindicação de Jesus ao ir para o Pai. A nota preserva “retidão” como alternativa sem fixar de modo exclusivo a interpretação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Vocês” explicita o plural de θεωρεῖτε sem recorrer a “vós”; “quanto a” mantém o paralelismo discursivo da passagem.
