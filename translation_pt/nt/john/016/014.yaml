id: JHN.16.14
reference: John 16:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐκεῖνος ἐμὲ δοξάσει, ὅτι ἐκ τοῦ ἐμοῦ λήμψεται καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/014.yaml
  text: He will glorify me[a], because he will take from what is mine and declare it to you.
translation:
  language: pt
  text: Ele me glorificará, porque receberá do que é meu e anunciará isso a vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Ele
  rationale: Retoma o Espírito mencionado no contexto imediato. Em português, o pronome pessoal é natural, sem necessidade de reproduzir de modo rígido a força demonstrativa.
- source_word: ἐμὲ
  choice: me
  rationale: Pronome de primeira pessoa no acusativo, objeto direto de “glorificará”.
- source_word: δοξάσει
  choice: glorificará
  rationale: Preserva o peso teológico de δοξάζω no Evangelho de João, em vez de reduzir o sentido a mera honra humana.
- source_word: ὅτι
  choice: porque
  rationale: Introduz aqui a razão pela qual o Espírito glorificará Jesus.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: do que é meu
  rationale: Reproduz naturalmente a expressão grega e mantém em aberto o que, precisamente, pertence a Jesus, sem restringi-la a ensino, autoridade ou revelação.
- source_word: λήμψεται
  choice: receberá
  rationale: λαμβάνω admite os sentidos de tomar e receber. Neste contexto, “receberá do que é meu” é idiomático em português e evita sugerir apropriação independente.
- source_word: ἀναγγελεῖ
  choice: anunciará isso
  rationale: ἀναγγέλλω significa anunciar, relatar ou dar a conhecer. “Isso” explicita em português o objeto implícito retomado da oração anterior.
- source_word: ὑμῖν
  choice: a vocês
  rationale: Expressa claramente a segunda pessoa do plural em português de ampla legibilidade, especialmente no Brasil.
theological_decisions:
- issue: A relação do Espírito com Jesus em ἐκ τοῦ ἐμοῦ λήμψεται
  choice: receberá do que é meu
  alternative: receberá de mim; tomará do que é meu
  rationale: A formulação preserva a afirmação ampla de que o Espírito comunica aquilo que pertence ao Filho, sem convertê-la numa definição técnica posterior nem especificar além do texto o conteúdo recebido.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha de perto o grego, enquanto “a vocês” deixa explícito o plural de ὑμῖν. Não se acrescentou nota, pois “receberá” representa adequadamente λήμψεται no contexto e a alternativa “tomará” não altera de modo substancial a interpretação.
