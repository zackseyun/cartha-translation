  text: ἔλεγον οὖν· ⸂Τί ἐστιν τοῦτο⸃ ὃ ⸀λέγει μικρόν; οὐκ οἴδαμεν τί λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/018.yaml
  text: So they were saying[a], “What is this that he says, ‘A little while’? We do not know what he is saying.”
translation:
  language: pt
  text: 'Então, eles diziam: “O que é isto que ele diz: ‘Um pouco’? Não sabemos o que ele está dizendo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: eles perguntavam
  rationale: O imperfeito indica fala em andamento ou repetida; como o conteúdo é interrogativo, “perguntavam” expressa naturalmente em português o ato de dizer essas perguntas.
- source_word: οὖν
  choice: Por isso
  rationale: Preserva a ligação inferencial com a fala anterior de Jesus, em linguagem corrente e digna.
- source_word: Τί ἐστιν τοῦτο
  choice: O que significa isso
  rationale: Embora literalmente seja “o que é isso”, no contexto a pergunta busca o sentido da expressão; esta formulação é natural em português sem eliminar a perplexidade dos discípulos.
- source_word: ὃ λέγει μικρόν
  choice: 'que ele diz: ‘Um pouco’'
  rationale: Mantém a referência direta à expressão usada por Jesus e deixa μικρόν em destaque como citação.
- source_word: μικρόν
  choice: Um pouco
  rationale: Preserva a forma elíptica do grego e deve manter coerência com a expressão repetida no contexto imediato; “pouco tempo” seria uma explicitação possível.
- source_word: οὐκ οἴδαμεν
  choice: Não sabemos
  rationale: Equivalente direto e natural do verbo οἶδα negado, que tem sentido presente.
- source_word: τί λαλεῖ
  choice: do que ele está falando
  rationale: Comunica com naturalidade o conteúdo da fala de Jesus e evita uma repetição pouco elegante de “diz/dizendo”, sem converter explicitamente a frase em “o que ele quer dizer”.
theological_decisions: []
