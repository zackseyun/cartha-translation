id: JHN.16.8
reference: John 16:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ἐκεῖνος ἐλέγξει τὸν κόσμον περὶ ἁμαρτίας καὶ περὶ δικαιοσύνης καὶ περὶ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/008.yaml
  text: And when that one comes[c][b][a], he will convict the world concerning sin and concerning righteousness and concerning judgment.
translation:
  language: pt
  text: E, quando ele vier, convencerá o mundo a respeito do pecado, da justiça e do juízo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: quando ele vier
  rationale: O particípio aoristo tem aqui valor temporal; esta formulação é natural em português e preserva a relação temporal.
- source_word: ἐκεῖνος
  choice: ele
  rationale: O demonstrativo enfático retoma o Consolador no contexto imediato. Em português, o pronome explícito já lhe confere destaque sem recorrer ao pouco natural «aquele».
- source_word: ἐλέγξει
  choice: convencerá
  rationale: O verbo indica demonstrar culpa ou erro e levar à constatação. «Convencerá» conserva a força moral e forense sem restringir o sentido à condenação judicial.
- source_word: κόσμον
  choice: o mundo
  rationale: Mantém a amplitude e a ressonância joanina de κόσμος, sem explicitar de modo indevido «a humanidade» ou «o sistema do mundo».
- source_word: περὶ
  choice: a respeito de
  rationale: Expressa com clareza a relação temática. A coordenação portuguesa permite evitar a repetição pesada da locução sem perder a tríade grega.
- source_word: ἁμαρτίας
  choice: pecado
  rationale: Equivalente corrente que preserva o singular do grego.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: «Justiça» é o equivalente português amplo e tradicional de δικαιοσύνη, capaz de abranger retidão e condição justa; o contexto do versículo seguinte esclarecerá sua aplicação.
- source_word: κρίσεως
  choice: juízo
  rationale: Preserva a dimensão forense e escatológica sem antecipar o resultado como «condenação».
theological_decisions:
- issue: Referente e força de ἐκεῖνος
  choice: O referente é o Consolador/Espírito mencionado no contexto, vertido pelo pronome explícito «ele».
  alternative: «aquele»
  rationale: O demonstrativo grego é enfático, mas «aquele» como substantivo soaria marcado ou distante em português. O sujeito explícito após a oração temporal mantém destaque suficiente sem acrescentar uma conotação estranha.
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: «Justiça» preserva a amplitude semântica do termo e a tensão que será explicada em João 16:10; «retidão» enfatizaria mais diretamente a qualidade moral.
- issue: Força de ἐλέγξει
  choice: convencerá
  alternative: demonstrará que está errado; desmascarará
  rationale: O verbo reúne exposição, reprovação e demonstração de culpa. «Convencerá» é natural e mantém essa abertura, embora o objeto direto «o mundo» deva ser entendido no sentido de confrontá-lo com a verdade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase conserva a tríade «pecado, justiça e juízo» e evita explicações interpretativas dentro do texto.
