id: JHN.16.7
reference: John 16:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλ’ ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν, συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω. ἐὰν ⸀γὰρ μὴ ἀπέλθω, ὁ παράκλητος ⸂οὐ μὴ ἔλθῃ⸃ πρὸς ὑμᾶς· ἐὰν δὲ πορευθῶ, πέμψω αὐτὸν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/007.yaml
  text: 'But I am telling you the truth: it is better for you that I go away. For if I do not go away[a], the Advocate will certainly not come to you; but if I go, I will send him to you.'
translation:
  language: pt
  text: 'Mas eu lhes digo a verdade: é melhor para vocês que eu vá embora. Pois, se eu não for, o Advogado[a] de modo nenhum virá até vocês; mas, se eu for, eu o enviarei a vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Auxiliador”, “Conselheiro” ou “Consolador”; em grego, “Paráclito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Mas
  rationale: Marca o contraste com a tristeza dos discípulos no contexto anterior, de maneira natural e concisa.
- source_word: τὴν ἀλήθειαν λέγω ὑμῖν
  choice: eu lhes digo a verdade
  rationale: Preserva a afirmação solene de veracidade em português corrente e digno.
- source_word: συμφέρει ὑμῖν
  choice: é melhor para vocês
  rationale: Comunica de modo idiomático que a partida de Jesus é para o benefício dos discípulos.
- source_word: ἵνα ἐγὼ ἀπέλθω
  choice: que eu vá embora
  rationale: Expressa naturalmente o conteúdo daquilo que é vantajoso e permite repetir a ideia verbal na condição seguinte.
- source_word: ἐὰν γὰρ μὴ ἀπέλθω
  choice: Pois, se eu não for
  rationale: Mantém a estrutura condicional e traduz γάρ como explicação; o contexto deixa claro que se trata de ir embora.
- source_word: ὁ παράκλητος
  choice: o Advogado
  rationale: Preserva o sentido pessoal e representativo do título joanino. Como nenhuma palavra portuguesa abrange todo o campo semântico, outras possibilidades são registradas em nota.
- source_word: οὐ μὴ ἔλθῃ
  choice: de modo nenhum virá
  rationale: Reproduz a negação enfática de οὐ μή com o subjuntivo sem recorrer a linguagem arcaica.
- source_word: πρὸς ὑμᾶς
  choice: até vocês / a vocês
  rationale: Representa o movimento em direção aos discípulos; a variação preposicional evita ambiguidade e soa natural em cada oração.
- source_word: ἐὰν δὲ πορευθῶ
  choice: mas, se eu for
  rationale: Mantém o contraste introduzido por δέ e traduz πορεύομαι de forma simples e natural.
- source_word: πέμψω αὐτὸν
  choice: eu o enviarei
  rationale: Traduz diretamente o ato futuro de enviar e conserva a referência pessoal masculina a παράκλητος.
theological_decisions:
- issue: Tradução de παράκλητος no discurso joanino
  choice: Advogado
  alternative: Auxiliador, Conselheiro, Consolador ou Paráclito
  rationale: “Advogado” destaca a atuação pessoal e representativa do termo, também relevante em 1 João 2:1. A nota conserva a amplitude lexical sem impor um único aspecto como sentido exaustivo.
- issue: Referência pessoal ao παράκλητος
  choice: eu o enviarei
  alternative: eu enviarei isso
  rationale: O acusativo masculino αὐτόν retoma o título masculino παράκλητος, apresentado no discurso como agente pessoal enviado por Jesus; a tradução evita despersonalizar o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” oferece clareza internacional razoável e evita formas regionais ou excessivamente solenes. A negação enfática e a repetição condicional do grego foram preservadas.
