revisions:
- from: 'Jesus soube que eles queriam fazer-lhe uma pergunta e lhes disse: “Vocês estão conversando entre si sobre eu ter dito:[a] ‘Mais um pouco, e vocês já não me veem; depois, mais um pouco, e vocês me verão’?[b]”'
  to: 'Jesus soube que eles queriam fazer-lhe uma pergunta e lhes disse: “Vocês estão discutindo entre si sobre o que eu disse[a]: ‘Daqui a pouco, vocês já não me veem; e, mais um pouco, vocês me verão’?[b]”'
  rationale: A revisão elimina uma construção sintaticamente pouco natural, tornando explícito que os discípulos discutiam o que Jesus havia dito, sem resolver indevidamente a ambiguidade de ὅτι; a nota mantém a alternativa causal. Também ajusta a primeira expressão temporal para o uso moderno mais idiomático e esclarece na nota que a distinção lexical grega não foi forçada no texto principal.
