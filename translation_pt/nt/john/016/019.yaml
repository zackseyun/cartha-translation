source:
  edition: SBLGNT
  text: ⸀ἔγνω Ἰησοῦς ὅτι ἤθελον αὐτὸν ἐρωτᾶν, καὶ εἶπεν αὐτοῖς· Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων ὅτι εἶπον· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/019.yaml
  text: Jesus knew that they wanted to ask him[a], and he said to them, “Are you discussing this with one another, that I said, ‘A little while, and you no longer see me, and again a little while[c][b], and you will see me’?”
translation:
  language: pt
  text: 'Jesus soube que eles queriam fazer-lhe uma pergunta e lhes disse: “Vocês estão discutindo entre si sobre o que eu disse[a]: ‘Daqui a pouco, vocês já não me veem; e, mais um pouco, vocês me verão’?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque eu disse”. A conjunção grega pode apresentar tanto o conteúdo da conversa quanto a razão dela.'
    reason: alternative_reading
  - marker: b
    text: 'O grego emprega aqui dois verbos diferentes relacionados a ver: primeiro θεωρέω, que também pode significar “observar” ou “contemplar”, e depois ὁράω, “ver”. Ambos são traduzidos aqui por formas de “ver”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: soube
  rationale: Expressa de modo direto o conhecimento de Jesus acerca da intenção dos discípulos, sem acrescentar a ideia mais específica de percepção visual ou intuitiva.
- source_word: ἤθελον αὐτὸν ἐρωτᾶν
  choice: queriam fazer-lhe uma pergunta
  rationale: Formulação portuguesa natural para a intenção contínua dos discípulos de perguntar algo a Jesus; evita o possível tom adversarial de “interrogá-lo”.
- source_word: Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων
  choice: Vocês estão conversando entre si sobre
  rationale: No contexto, ζητέω descreve os discípulos procurando esclarecer entre si o sentido das palavras de Jesus. “Conversando” comunica isso com naturalidade, enquanto “buscando” seria pouco idiomático aqui.
- source_word: ὅτι εἶπον
  choice: eu ter dito
  rationale: Trata ὅτι como introdutor do conteúdo ou assunto da conversa. A nota registra a possível leitura causal.
- source_word: Μικρὸν
  choice: Mais um pouco
  rationale: O adjetivo neutro tem valor temporal e indica um breve intervalo. A repetição preserva a estrutura enfática do grego.
- source_word: οὐ θεωρεῖτέ με
  choice: vocês já não me veem
  rationale: O presente grego é mantido em português, enquanto “já não” explicita naturalmente a cessação iminente sugerida pela sequência temporal.
- source_word: πάλιν μικρὸν
  choice: depois, mais um pouco
  rationale: “Depois” representa πάλιν como avanço para a etapa seguinte, sem sugerir que o próprio intervalo se repete de maneira independente.
- source_word: ὄψεσθέ με
  choice: vocês me verão
  rationale: O futuro de ὁράω é vertido pelo futuro simples e mantém o paralelismo com a oração anterior.
theological_decisions:
- issue: Diferença entre θεωρέω e ὁράω nas duas orações
  choice: Traduzir ambos por formas de “ver” no texto principal
  alternative: Distinguir como “contemplar/observar” e “ver”
  rationale: Embora o grego empregue dois verbos, o contraste central é entre a ausência temporária de Jesus e a visão posterior. Impor verbos portugueses diferentes poderia sugerir uma distinção teológica mais nítida do que o contexto exige; a diferença lexical é preservada em nota.
- issue: Função de ὅτι após a pergunta de Jesus
  choice: Entendê-lo como introdutor do conteúdo ou assunto discutido
  alternative: 'Entendê-lo causalmente: “porque eu disse”'
  rationale: As duas relações são gramaticalmente possíveis e próximas no contexto. O texto principal privilegia o conteúdo da conversa, e a nota preserva explicitamente a leitura causal.
- issue: Forma da pergunta de Jesus
  choice: Manter uma pergunta direta e investigativa
  alternative: Transformá-la numa afirmação sobre o que os discípulos faziam
  rationale: A pontuação e a construção contextual favorecem uma pergunta pela qual Jesus traz à luz a conversa dos discípulos, sem acrescentar censura ou ironia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” oferece clareza internacional razoável e concordância natural no português brasileiro; a colocação pronominal em “fazer-lhe” e “lhes disse” conserva um registro bíblico moderadamente formal sem arcaísmo. A formulação mantém a repetição e a tensão temporal do original.
