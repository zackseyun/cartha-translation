    issue: Construção “sobre eu ter dito:”
    rationale: Embora seja compreensível em alguns usos brasileiros, a construção com infinitivo pessoal/composto seguida diretamente de dois-pontos e citação é pouco natural. “Sobre o que eu disse:” transmite com clareza o conteúdo de ὅτι εἶπον e permite que a nota preserve a leitura causal.
  - severity: low
    issue: Formulação temporal “Mais um pouco” na primeira ocorrência
    rationale: “Daqui a pouco” é mais idiomático para o intervalo temporal indicado por Μικρόν. A segunda expressão, “mais um pouco”, preserva naturalmente a sequência marcada por πάλιν.
  - severity: low
    issue: Nota lexical não explicita a solução adotada
    rationale: A nota identifica os dois verbos, mas deve também informar que ambos foram vertidos por “ver” no texto principal, evitando a impressão de que a diferença foi reproduzida na tradução.
