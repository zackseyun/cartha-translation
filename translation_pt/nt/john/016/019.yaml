review_pass:
  verdict: revise
  source_fidelity: 'O sentido central é bem preservado: Jesus conhece a intenção dos discípulos e pergunta se eles discutem entre si a sua declaração sobre um breve período de ausência seguido de vê-lo novamente. A tradução de οὐ θεωρεῖτέ por “já não me veem” é defensável no enquadramento temporal e a futura “me verão” corresponde adequadamente a ὄψεσθέ. Contudo, “sobre eu ter dito:” soa sintaticamente truncado antes da citação direta e não representa de modo tão claro o conteúdo introduzido por ὅτι.'
  naturalness: O texto é geralmente claro e de registro apropriado, mas “Vocês estão conversando entre si sobre eu ter dito:” é pouco idiomático no português moderno. “Sobre o que eu disse” torna a pergunta fluente e conserva o assunto da discussão. “Daqui a pouco” é uma expressão temporal mais natural do que “mais um pouco” na primeira ocorrência; “mais um pouco” na segunda conserva a progressão temporal.
  terminology: “Jesus”, “ver”, “discutindo entre si” e as formas de tratamento com “vocês” são adequados ao português moderno de ampla compreensão. A nota lexical deve declarar que os dois verbos gregos são ambos traduzidos por formas de “ver”, para explicar precisamente a decisão adotada no texto.
  issues:
