  text: Τοῦτο δὲ ἔλεγον πειράζοντες αὐτόν, ἵνα ἔχωσιν κατηγορίαν κατ' αὐτοῦ. Ὁ δὲ Ἰησοῦς κάτω κύψας, τῷ δακτύλῳ ἔγραφεν εἰς τὴν γῆν, μὴ προσποιούμενος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/006.yaml
  text: They[a] were saying this to test him, so that they might have an accusation against him. But Jesus, bending down, wrote on the ground with his finger, paying no attention.
translation:
  language: pt
  text: Eles[a] diziam isso para pô-lo à prova, a fim de terem do que acusá-lo. Jesus, porém, inclinando-se, escrevia no chão com o dedo, sem lhes dar atenção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Continuação do relato da mulher apanhada em adultério (João 7:53–8:11). Veja a nota em João 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: πειράζοντες
  choice: para pô-lo à prova
  rationale: Expressa a tentativa hostil de testar Jesus e criar contra ele uma base para acusação, sem reduzir o sentido a mera tentação.
- source_word: κατηγορίαν
  choice: do que acusá-lo
  rationale: Reproduz de modo natural em português a ideia de obter fundamento para uma acusação contra Jesus.
- source_word: κάτω κύψας
  choice: inclinando-se
  rationale: Mantém a ação participial de Jesus curvar-se para baixo, em formulação natural e concisa.
- source_word: ἔγραφεν
  choice: escrevia
  rationale: O imperfeito retrata a ação em andamento, sem especificar o conteúdo escrito.
- source_word: μὴ προσποιούμενος
  choice: sem lhes dar atenção
  rationale: Comunica naturalmente que Jesus agia como quem não os notava, preservando o sentido contextual da expressão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção preserva a finalidade hostil dos interlocutores e o aspecto contínuo de ἔγραφεν. O pronome em “sem lhes dar atenção” explicita naturalmente o alvo implícito da falta de atenção.
