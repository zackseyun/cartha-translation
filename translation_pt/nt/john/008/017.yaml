id: JHN.8.17
reference: John 8:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ νόμῳ δὲ τῷ ὑμετέρῳ γέγραπται ὅτι δύο ἀνθρώπων ἡ μαρτυρία ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/017.yaml
  text: And even in your law it is written that the testimony of two men is true[a].
translation:
  language: pt
  text: E até na lei de vocês está escrito que o testemunho de dois homens é verdadeiro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o testemunho de duas pessoas é verdadeiro». O grego diz «dois homens», expressão jurídica convencional para testemunhas humanas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμῳ
  choice: lei
  rationale: Refere-se ao corpo legal e escriturístico judaico ao qual Jesus apela. A minúscula preserva o sentido imediato de «lei de vocês» sem restringir necessariamente a referência a um título formal.
- source_word: ὑμετέρῳ
  choice: de vocês
  rationale: Reproduz diretamente o possessivo e mantém o distanciamento retórico de Jesus, sem intensificá-lo com «a própria lei de vocês».
- source_word: γέγραπται
  choice: está escrito
  rationale: Fórmula corrente de citação das Escrituras, natural em português e compatível com a força duradoura do perfeito grego.
- source_word: δύο ἀνθρώπων
  choice: dois homens
  rationale: Mantém a forma masculina da expressão jurídica grega. Como ἄνθρωπος também pode ter sentido humano genérico, a alternativa «duas pessoas» é indicada em nota.
- source_word: μαρτυρία
  choice: testemunho
  rationale: Expressa adequadamente o sentido jurídico de declaração ou prova testemunhal e combina naturalmente com «de dois homens».
- source_word: ἀληθής
  choice: verdadeiro
  rationale: Preserva o sentido lexical direto do grego; no contexto jurídico, a expressão também implica que o testemunho é válido, sem substituir essa tensão interpretativa no texto principal.
- source_word: καὶ ... δὲ
  choice: E até
  rationale: Comunica tanto a ligação com o discurso anterior quanto a leve ênfase da combinação grega, em português natural.
theological_decisions:
- issue: Força retórica de «lei de vocês»
  choice: Manter «lei de vocês» como discurso direto aos interlocutores de Jesus.
  alternative: «a lei»; «a própria lei de vocês»
  rationale: O possessivo está explícito no grego. Mantê-lo conserva a tensão retórica sem sugerir que Jesus rejeita a lei nem reforçar o tom além do texto.
- issue: Sentido de ἀνθρώπων na máxima jurídica
  choice: Usar «homens» no texto principal.
  alternative: «pessoas»; «seres humanos»
  rationale: A tradução conserva a expressão masculina do grego, enquanto a nota registra que ela funciona convencionalmente como referência a testemunhas humanas.
- issue: Sentido jurídico de ἀληθής
  choice: Traduzir por «verdadeiro».
  alternative: «válido»; «digno de crédito»
  rationale: «Verdadeiro» preserva a formulação grega e deixa implícita a nuance de validade jurídica, evitando resolver silenciosamente essa amplitude semântica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. «De vocês» evita a ambiguidade regional de «seu» e mantém o endereço plural; a ordem da frase acompanha de perto o grego sem soar artificial.
