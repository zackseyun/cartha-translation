  text: ἔλεγον οὖν αὐτῷ· Σὺ τίς εἶ; ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Τὴν ἀρχὴν ⸂ὅ τι⸃ καὶ λαλῶ ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/025.yaml
  text: So they were saying to him, “Who are you?” Jesus said to them, “Just what I have been telling you from the beginning.”
translation:
  language: pt
  text: 'Então lhe perguntavam: “Quem é você?” Jesus lhes respondeu: “O que venho dizendo a vocês desde o princípio.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção grega é difícil e admite outras traduções. Também pode ser entendida como: “Por que ainda falo com vocês?”'
    reason: Preserva para o leitor a ambiguidade sintática e semântica genuína de Τὴν ἀρχὴν ὅ τι καὶ λαλῶ ὑμῖν, sem introduzir uma ideia causal não expressa no grego.
lexical_decisions:
- source_word: ἔλεγον
  choice: perguntavam
  rationale: O imperfeito indica uma ação em curso ou repetida; no contexto, o conteúdo da fala é uma pergunta, por isso “perguntavam” é natural e preciso.
- source_word: Σὺ τίς εἶ;
  choice: Quem é você?
  rationale: Mantém a ênfase expressa pelo pronome Σὺ sem recorrer à construção menos natural “Você, quem é?”.
- source_word: Τὴν ἀρχὴν
  choice: desde o princípio
  rationale: Entende a expressão acusativa em sentido adverbial e temporal, leitura antiga e coerente com o contexto, embora a construção grega seja difícil.
- source_word: ὅ τι καὶ λαλῶ ὑμῖν
  choice: Exatamente o que venho dizendo a vocês
  rationale: “O que” representa ὅ τι; “exatamente” comunica a força enfática de καί nesta leitura, e “venho dizendo” expressa a fala continuada de Jesus.
theological_decisions:
- issue: A resposta de Jesus pode ser entendida como referência à constância de sua autorrevelação ou, por outra análise sintática, como uma pergunta retórica.
  choice: “Exatamente o que venho dizendo a vocês desde o princípio.”
  alternative: “Por que afinal ainda falo com vocês?”
  rationale: A leitura escolhida se ajusta à pergunta “Quem é você?” e ao tema joanino do testemunho contínuo de Jesus, sem transformar a resposta em uma identificação cristológica mais explícita do que o grego permite. A ambiguidade real é registrada em nota.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. “A vocês” evita regionalismo excessivo; “desde o princípio” conserva o tom bíblico sem soar arcaico.
