revisions:
- from: Mas, ao ouvirem isso, sendo acusados pela própria consciência, eles foram saindo um por um, começando pelos mais velhos até os últimos.[b] Jesus ficou sozinho, com a mulher em pé no meio.[a]
  to: Mas, ao ouvirem isso, sendo convencidos pela consciência, foram saindo um por um, começando pelos mais velhos até os últimos. E Jesus ficou sozinho, com a mulher, em pé no meio.[a]
  rationale: A revisão substitui uma expressão potencialmente imprecisa por “convencidos pela consciência”, remove a ênfase não expressa em “própria”, restaura o conectivo narrativo e elimina a nota [b], que não é sustentada como variante necessária e pode confundir por mudar o plural do grego para o singular. Mantêm-se a ambiguidade de “os últimos”, o sentido progressivo de “um por um” e a mulher em pé no meio.
