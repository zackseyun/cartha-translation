  text: Οἱ δὲ ἀκούσαντες, καὶ ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι, ἐξήρχοντο εἷς καθ' εἷς, ἀρξάμενοι ἀπὸ τῶν πρεσβυτέρων ἕως τῶν ἐσχάτων· καὶ κατελείφθη μόνος ὁ Ἰησοῦς, καὶ ἡ γυνὴ ἐν μέσῳ ἑστῶσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/009.yaml
  text: But those[a] who heard it, being convicted by their conscience, went out one by one, beginning with the older ones down to the last. And Jesus was left alone, with the woman standing in the midst.
translation:
  language: pt
  text: Mas, ao ouvirem isso, sendo convencidos pela consciência, foram saindo um por um, começando pelos mais velhos até os últimos. E Jesus ficou sozinho, com a mulher, em pé no meio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo faz parte da continuação do episódio da mulher apanhada em adultério (João 7:53–8:11). Veja a nota em João 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: συνείδησις
  choice: consciência
  rationale: Equivalente português direto para a faculdade interior de discernimento moral; no contexto, é a própria consciência que os acusa.
- source_word: ἐλέγχω
  choice: acusados
  rationale: A forma passiva descreve a consciência confrontando-os com sua culpa. “Acusados” preserva a força moral e quase judicial do verbo sem tornar explícito um agente externo.
- source_word: πρεσβύτερος
  choice: mais velhos
  rationale: Aqui o contraste na sequência favorece uma referência à idade ou senioridade, não ao ofício formal de presbítero ou ancião.
- source_word: ἕως τῶν ἐσχάτων
  choice: até os últimos
  rationale: Mantém a formulação aberta do grego, que pode indicar os últimos na sequência, sem inserir “mais jovens”, ideia não expressa diretamente.
- source_word: ἐν μέσῳ ἑστῶσα
  choice: em pé no meio
  rationale: Reproduz o particípio perfeito com valor de estado e a localização central da mulher.
theological_decisions:
- issue: Identidade dos “últimos”
  choice: até os últimos
  alternative: até os mais jovens
  rationale: O grego não diz explicitamente “mais jovens”. A tradução preserva a ambiguidade entre os últimos da sequência e uma possível progressão etária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Foram saindo” expressa naturalmente a ação progressiva, um por um. O marcador textual [a] foi colocado ao fim do versículo para não interromper a abertura da frase; [b] aparece junto à expressão a que se refere.
