id: JHN.8.37
reference: John 8:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἶδα ὅτι σπέρμα Ἀβραάμ ἐστε· ἀλλὰ ζητεῖτέ με ἀποκτεῖναι, ὅτι ὁ λόγος ὁ ἐμὸς οὐ χωρεῖ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/037.yaml
  text: I know that you are Abraham’s offspring[a]; but you are seeking to kill me[b], because my word has no place in you.
translation:
  language: pt
  text: Sei que vocês são descendência de Abraão[a]; contudo, procuram me matar, porque a minha palavra não encontra espaço em vocês[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “semente de Abraão” ou “descendentes de Abraão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “porque a minha palavra não tem lugar em vocês”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπέρμα Ἀβραάμ
  choice: descendência de Abraão
  rationale: O singular coletivo σπέρμα indica aqui linhagem física. “Descendência” preserva esse valor coletivo em português natural e evita tanto o sentido predominantemente botânico de “semente” quanto o plural mais explícito “descendentes”.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: procuram me matar
  rationale: ζητέω com infinitivo pode expressar busca, intenção ou tentativa. “Procuram me matar” conserva o aspecto presente e a força verbal sem especificar além do texto se a ênfase recai no desejo ou na tentativa.
- source_word: ὁ λόγος ὁ ἐμὸς
  choice: a minha palavra
  rationale: “Palavra” traduz diretamente λόγος e preserva a dicção característica de João e suas possíveis ressonâncias, que “mensagem” poderia achatar.
- source_word: οὐ χωρεῖ ἐν ὑμῖν
  choice: não encontra espaço em vocês
  rationale: 'A expressão mantém a metáfora de χωρέω: a palavra de Jesus não é acolhida nem encontra lugar interior neles. Evita restringir o sentido a mera compreensão intelectual.'
- source_word: ἀλλὰ
  choice: contudo
  rationale: Marca claramente o forte contraste entre a ascendência abraâmica reconhecida e a hostilidade contra Jesus.
- source_word: οἶδα ὅτι
  choice: Sei que
  rationale: Tradução direta e natural da oração introdutória e de sua oração completiva.
theological_decisions:
- issue: Relação entre a descendência física de Abraão e a verdadeira conformidade com Abraão
  choice: Traduzir σπέρμα Ἀβραάμ em sentido claramente genealógico como “descendência de Abraão”, sem inserir neste versículo a categoria de filiação espiritual.
  alternative: “filhos de Abraão”
  rationale: No contexto, Jesus reconhece a linhagem física dos interlocutores enquanto confronta sua reação a ele. “Descendência” preserva essa tensão sem antecipar ou resolver o argumento dos versículos seguintes.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O uso de “vocês” evita regionalismo excessivo; “descendência” preserva o coletivo genealógico, e “não encontra espaço” mantém viva a metáfora do original.
