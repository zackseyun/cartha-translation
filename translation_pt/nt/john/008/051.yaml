source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐάν τις τὸν ⸂ἐμὸν λόγον⸃ τηρήσῃ, θάνατον οὐ μὴ θεωρήσῃ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/051.yaml
  text: Truly, truly, I say to you, if anyone keeps my word, he will certainly never see death forever.
translation:
  language: pt
  text: 'Em verdade, em verdade lhes digo: se alguém guardar a minha palavra, jamais verá a morte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: de modo nenhum verá a morte para sempre.'
    reason: Registra mais formalmente a força combinada da dupla negação grega οὐ μὴ e de εἰς τὸν αἰῶνα, cuja formulação literal é incomum em português.
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Mantém a repetição enfática característica de Jesus em João, com formulação digna e amplamente compreensível.
- source_word: τηρήσῃ
  choice: guardar
  rationale: 'Expressa mais do que ouvir: conservar, observar e permanecer fiel à palavra recebida.'
- source_word: θεωρήσῃ
  choice: verá
  rationale: Equivalente natural que preserva a imagem do verbo grego; neste contexto, 'ver a morte' significa experimentá-la.
- source_word: οὐ μὴ ... εἰς τὸν αἰῶνα
  choice: jamais
  rationale: A negação enfática combinada com a expressão temporal comunica 'de modo nenhum, para sempre'; 'jamais' reproduz isso naturalmente em português.
theological_decisions:
- issue: A promessa de não ver a morte apesar da morte física dos discípulos
  choice: Preservar literalmente a expressão 'jamais verá a morte'
  alternative: Explicitar 'não sofrerá a morte eterna' ou 'não morrerá espiritualmente'
  rationale: O texto mantém uma tensão deliberada entre morte física e vida eterna. A tradução não deve impor no corpo do versículo uma interpretação teológica específica.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil e em contexto internacional. O pronome 'lhes' evita regionalizar excessivamente a segunda pessoa plural; a construção conserva a solenidade e a ênfase do original.
