id: JHN.8.30
reference: John 8:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ταῦτα αὐτοῦ λαλοῦντος πολλοὶ ἐπίστευσαν εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/030.yaml
  text: As he was saying these things[b][a], many believed in him.
translation:
  language: pt
  text: Enquanto ele dizia essas coisas, muitos creram nele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: essas coisas
  rationale: Preserva o plural do demonstrativo e retoma naturalmente, em português, o conteúdo do discurso precedente de Jesus.
- source_word: αὐτοῦ λαλοῦντος
  choice: enquanto ele dizia
  rationale: O genitivo absoluto com particípio presente indica ação simultânea e em andamento. A formulação é natural e mantém a ideia de que a fé surgiu durante sua fala.
- source_word: πολλοὶ
  choice: muitos
  rationale: O adjetivo substantivado pode ser traduzido diretamente por “muitos”, sem acrescentar “pessoas”.
- source_word: ἐπίστευσαν
  choice: creram
  rationale: O aoristo apresenta o acontecimento como um todo. “Creram” é conciso, corrente no registro bíblico moderno e preserva o campo lexical de πιστεύω.
- source_word: εἰς αὐτόν
  choice: nele
  rationale: Com πιστεύω, a construção joanina exprime fé ou confiança dirigida à pessoa de Jesus. “Creram nele” é idiomático e mantém essa força relacional.
theological_decisions:
- issue: Sentido de πιστεύω εἰς αὐτόν no uso joanino
  choice: creram nele
  alternative: acreditaram no que ele dizia
  rationale: A preposição εἰς orienta a fé para a pessoa de Jesus, não apenas para a veracidade de suas palavras. A tradução escolhida conserva essa dimensão sem definir antecipadamente a profundidade ou permanência dessa fé, questão que o contexto subsequente mantém em tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para a fluência natural, sem perder a simultaneidade expressa pelo grego nem a referência plural ao discurso anterior.
