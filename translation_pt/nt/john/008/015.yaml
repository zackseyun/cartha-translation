id: JHN.8.15
reference: John 8:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑμεῖς κατὰ τὴν σάρκα κρίνετε, ἐγὼ οὐ κρίνω οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/015.yaml
  text: You judge according to the flesh[a]; I judge no one.
translation:
  language: pt
  text: Vocês julgam segundo a carne[a]; eu não julgo ninguém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por critérios humanos” ou “segundo as aparências”.
    reason: Alternativas contextuais para a expressão idiomática κατὰ τὴν σάρκα.
lexical_decisions:
- source_word: ὑμεῖς
  choice: Vocês
  rationale: O pronome grego de segunda pessoa do plural está explícito e estabelece contraste com ἐγώ. “Vocês” é natural e amplamente compreensível, sobretudo para leitores brasileiros.
- source_word: κατὰ τὴν σάρκα
  choice: segundo a carne
  rationale: A formulação preserva a imagem e a tensão do grego, sem reduzir σάρξ a uma doutrina de “natureza pecaminosa”. As leituras contextuais mais interpretativas são registradas em nota.
- source_word: κρίνετε
  choice: julgam
  rationale: Presente do indicativo ativo, segunda pessoa do plural. “Julgam” é a correspondência direta, clara e natural.
- source_word: ἐγὼ
  choice: eu
  rationale: O pronome explícito marca o contraste com ὑμεῖς; sua presença em português preserva essa oposição.
- source_word: οὐ κρίνω οὐδένα
  choice: não julgo ninguém
  rationale: Reproduz de modo natural e conciso a negação enfática do grego, sem acrescentar qualificações ausentes do texto.
theological_decisions:
- issue: Sentido de σάρξ em κατὰ τὴν σάρκα
  choice: Manter “carne” no texto principal
  alternative: “por critérios humanos” ou “segundo as aparências”
  rationale: No contexto, a expressão provavelmente aponta para critérios meramente humanos ou exteriores, mas “carne” conserva a linguagem joanina e sua amplitude teológica sem impor uma interpretação única.
- issue: Afirmação de Jesus de que não julga ninguém
  choice: 'Traduzir sem qualificação: “eu não julgo ninguém”'
  alternative: Explicitar um sentido temporal ou um tipo específico de julgamento
  rationale: O versículo apresenta uma afirmação absoluta em sua forma imediata. Possíveis harmonizações com outras declarações sobre julgamento pertencem à interpretação contextual e não devem ser inseridas na tradução.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega-se “vocês” para a segunda pessoa do plural e mantém-se a concisão e o contraste da frase grega.
