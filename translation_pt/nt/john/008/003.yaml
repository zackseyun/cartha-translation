  yaml_path: translation/nt/john/008/003.yaml
  text: Then[a] the scribes and the Pharisees brought to him a woman caught in adultery, and having set her in the midst,
translation:
  language: pt
  text: Então[a] os escribas e os fariseus trouxeram até ele uma mulher apanhada em adultério e, depois de a colocarem no meio,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Continuação do relato da mulher apanhada em adultério (João 7:53–8:11). Veja a nota em João 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: Ἄγουσιν (ἄγω)
  choice: trouxeram
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, mais natural na narrativa em português; «trouxeram até ele» expressa o movimento em direção a Jesus.
- source_word: κατειλημμένην (καταλαμβάνω)
  choice: apanhada
  rationale: O particípio perfeito passivo indica que a mulher havia sido surpreendida em adultério; «apanhada» é uma formulação natural e amplamente compreensível.
- source_word: στήσαντες (ἵστημι)
  choice: colocando-a
  rationale: O particípio aoristo descreve a ação deliberada de fazê-la ficar em determinada posição; «colocando-a» evita a rigidez de uma tradução literal como «fazendo-a ficar em pé».
- source_word: ἐν μέσῳ (μέσος)
  choice: no meio de todos
  rationale: A expressão indica uma posição central diante do grupo reunido; «de todos» explicita naturalmente em português o sentido contextual sem identificar um grupo além do que o texto permite.
