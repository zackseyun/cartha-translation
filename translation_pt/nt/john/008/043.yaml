  text: διὰ τί τὴν λαλιὰν τὴν ἐμὴν οὐ γινώσκετε; ὅτι οὐ δύνασθε ἀκούειν τὸν λόγον τὸν ἐμόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/043.yaml
  text: Why do you not understand my way of speaking? Because you are not able to hear my word[a][b].
translation:
  language: pt
  text: Por que vocês não entendem o meu modo de falar? Porque não são capazes de ouvir a minha palavra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não conseguem ouvir a minha palavra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰν
  choice: modo de falar
  rationale: Refere-se aqui à maneira de Jesus falar e preserva a distinção em relação a λόγος na oração seguinte.
- source_word: γινώσκετε
  choice: entendem
  rationale: No contexto, indica compreensão, e não simples conhecimento ou reconhecimento.
- source_word: ἀκούειν
  choice: ouvir
  rationale: Preserva o sentido básico do verbo sem explicitar como aceitação a receptividade sugerida pelo contexto.
- source_word: λόγον
  choice: palavra
  rationale: Mantém a distinção lexical em relação a λαλιά e conserva tanto o sentido de palavra proferida quanto a possível referência à mensagem de Jesus.
- source_word: οὐ δύνασθε
  choice: não são capazes
  rationale: Expressa claramente a incapacidade afirmada no grego, sem reduzi-la a mera falta de vontade.
- source_word: ὅτι
  choice: Porque
  rationale: Introduz de modo natural e claro a razão da pergunta anterior.
- source_word: τὴν ἐμὴν / τὸν ἐμόν
  choice: meu / minha
  rationale: Os possessivos são traduzidos naturalmente e mantêm o paralelismo entre o modo de falar e a palavra de Jesus.
theological_decisions:
- issue: Natureza da incapacidade de ouvir a palavra de Jesus
  choice: Traduzir diretamente como incapacidade, sem explicar sua causa teológica.
  alternative: Interpretá-la especificamente como falta de vontade moral, endurecimento judicial ou incapacidade espiritual.
  rationale: O versículo afirma a incapacidade, mas não define por si só todo o seu mecanismo; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” representa naturalmente o plural. “Modo de falar” distingue λαλιά de λόγος; “palavra” conserva a formulação concreta e a ressonância do original.
