id: JHN.8.13
reference: John 8:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπον οὖν αὐτῷ οἱ Φαρισαῖοι· Σὺ περὶ σεαυτοῦ μαρτυρεῖς· ἡ μαρτυρία σου οὐκ ἔστιν ἀληθής.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/013.yaml
  text: So the Pharisees said to him, “You are testifying about yourself; your testimony is not true.”
translation:
  language: pt
  text: 'Por isso, os fariseus lhe disseram: “Você dá testemunho de si mesmo; o seu testemunho não é verdadeiro[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o seu testemunho não é válido”. O grego diz “não é verdadeiro”, expressão que, neste contexto, também pode ter o sentido de validade jurídica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Por isso
  rationale: Marca a continuidade lógica com a declaração anterior de Jesus e soa natural em português, sem reduzir a conexão a mera sequência temporal.
- source_word: εἶπον ... αὐτῷ οἱ Φαρισαῖοι
  choice: os fariseus lhe disseram
  rationale: Reproduz naturalmente a construção narrativa e conserva o pronome referente a Jesus, sem substituí-lo interpretativamente pelo nome.
- source_word: Σὺ
  choice: Você
  rationale: Mantém o pronome explícito e sua posição inicial, comunicando o contraste enfático no português corrente.
- source_word: περὶ σεαυτοῦ
  choice: de si mesmo
  rationale: Expressa de modo idiomático que o próprio Jesus é o assunto de seu testemunho, preservando a ênfase reflexiva.
- source_word: μαρτυρεῖς
  choice: dá testemunho
  rationale: Conserva no presente o campo semântico testemunhal e jurídico, além da correspondência lexical com μαρτυρία.
- source_word: ἡ μαρτυρία σου
  choice: o seu testemunho
  rationale: Preserva a repetição intencional do vocabulário de testemunho e suas conotações probatórias.
- source_word: οὐκ ἔστιν ἀληθής
  choice: não é verdadeiro
  rationale: É o equivalente lexical direto e mantém aberta a possibilidade de a acusação tratar tanto da veracidade quanto da validade do testemunho.
theological_decisions:
- issue: Sentido da objeção dos fariseus ao testemunho sobre si mesmo
  choice: o seu testemunho não é verdadeiro
  alternative: o seu testemunho não é válido
  rationale: Embora o contexto tenha caráter jurídico, ἀληθής é mais amplo que um termo técnico de admissibilidade. A tradução principal preserva a tensão entre veracidade e validade, enquanto a nota registra a nuance contextual possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” torna a fala direta natural, enquanto “dá testemunho” mantém o vocabulário central e o tom probatório do contexto.
