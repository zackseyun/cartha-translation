id: JHN.8.47
reference: John 8:47
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ ὢν ἐκ τοῦ θεοῦ τὰ ῥήματα τοῦ θεοῦ ἀκούει· διὰ τοῦτο ὑμεῖς οὐκ ἀκούετε ὅτι ἐκ τοῦ θεοῦ οὐκ ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/047.yaml
  text: The one who is from God hears the words of God[a]. For this reason you do not hear[b], because you are not from God.
translation:
  language: pt
  text: Quem é de Deus ouve as palavras de Deus. Por isso vocês não ouvem, porque não são de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, tomando a conjunção grega em sentido declarativo: “Por isso vocês não ouvem que não são de Deus.” O sentido causal, “porque”, ajusta-se melhor ao contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ὢν
  choice: Quem é
  rationale: O artigo com o particípio presente tem função substantiva e descreve uma classe de pessoa. “Quem é” conserva o singular representativo em português natural.
- source_word: ἐκ τοῦ θεοῦ
  choice: de Deus
  rationale: A preposição ἐκ indica fonte ou origem. Em português, “ser de Deus” é conciso e idiomático e preserva a amplitude joanina, sem restringir a expressão apenas a posse, eleição ou novo nascimento.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: as palavras de Deus
  rationale: Mantém o plural concreto de ῥήματα e o genitivo, com clareza e dignidade em português contemporâneo.
- source_word: ἀκούει / ἀκούετε
  choice: ouve / ouvem
  rationale: Preserva a repetição verbal do grego e o sentido lexical básico de ouvir. O contexto pode implicar acolhimento ou obediência, mas isso não é explicitado na tradução.
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural e atual a relação explicativa ou inferencial introduzida pela locução grega.
- source_word: ὑμεῖς
  choice: vocês
  rationale: O pronome grego está explícito e é plural. “Vocês” torna o número inequívoco e tem ampla legibilidade brasileira.
- source_word: ὅτι
  choice: porque
  rationale: 'A leitura causal se ajusta melhor ao argumento: eles não ouvem porque não são de Deus. A possibilidade declarativa é registrada em nota.'
- source_word: ἐκ τοῦ θεοῦ οὐκ ἐστέ
  choice: não são de Deus
  rationale: Repete a formulação da primeira oração, como no grego, preservando o contraste de fonte, origem ou pertencimento sem o resolver em uma categoria doutrinária específica.
theological_decisions:
- issue: Sentido de ser “de Deus” no contexto joanino
  choice: Manter a expressão ampla “de Deus”.
  alternative: Explicitar “pertence a Deus”, “nasceu de Deus” ou “procede de Deus”.
  rationale: O texto apresenta uma relação de fonte, origem ou pertencimento, mas não a define aqui por uma única categoria sistemática. A tradução conserva essa tensão.
- issue: Força de ἀκούω
  choice: Traduzir por “ouvir”.
  alternative: “Dar ouvidos”, “acolher” ou “obedecer”.
  rationale: Embora o contexto indique uma escuta receptiva, “ouvir” preserva o valor lexical e a repetição do original sem transformar uma implicação em afirmação explícita.
- issue: Valor de ὅτι
  choice: 'Entender como causal: “porque”.'
  alternative: 'Entender como declarativo: “que”.'
  rationale: A leitura causal produz a explicação mais coerente no contexto, mas a construção grega admite formalmente a leitura declarativa, registrada em nota.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira e compreensão internacional. “Vocês” explicita o plural; a repetição de “de Deus” e “ouvem” acompanha a estrutura retórica do grego.
