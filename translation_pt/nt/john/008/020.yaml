id: JHN.8.20
reference: John 8:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ταῦτα τὰ ῥήματα ⸀ἐλάλησεν ἐν τῷ γαζοφυλακίῳ διδάσκων ἐν τῷ ἱερῷ· καὶ οὐδεὶς ἐπίασεν αὐτόν, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/020.yaml
  text: He spoke these words in the treasury while teaching in the temple[a], and no one seized him[b], because his hour had not yet come.
translation:
  language: pt
  text: Jesus falou essas palavras na tesouraria, enquanto ensinava no templo[a]. Ninguém o prendeu, porque a hora dele ainda não havia chegado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no recinto do templo”; o termo grego refere-se ao complexo do templo, e não apenas ao santuário interior.
    reason: lexical_alternative
  - marker: b
    text: Em João, “a hora dele” refere-se ao momento determinado do sofrimento culminante e da glorificação de Jesus. Outra tradução possível é “a hora determinada para ele”.
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα τὰ ῥήματα
  choice: essas palavras
  rationale: ῥήματα designa palavras ou declarações proferidas; “essas palavras” retoma naturalmente o discurso imediatamente anterior.
- source_word: ἐλάλησεν
  choice: falou
  rationale: λαλέω enfatiza o ato de falar; “falou essas palavras” mantém a forma verbal do grego em linguagem clara e corrente.
- source_word: ἐν τῷ γαζοφυλακίῳ
  choice: na tesouraria
  rationale: γαζοφυλάκιον indica a tesouraria ou a área do templo onde ficavam as ofertas, e não necessariamente um único cofre.
- source_word: διδάσκων
  choice: enquanto ensinava
  rationale: O particípio presente expressa uma ação simultânea à ação principal; “enquanto ensinava” explicita essa relação temporal.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: ἱερόν refere-se ao complexo do templo; “no templo” é a expressão portuguesa mais natural, com nota para esclarecer seu alcance.
- source_word: οὐδεὶς ἐπίασεν αὐτόν
  choice: ninguém o prendeu
  rationale: πιάζω significa agarrar, capturar ou deter. No contexto hostil, “prendeu” comunica de modo natural a tentativa de tomar Jesus sob custódia, sem tornar explícito um procedimento jurídico formal.
- source_word: ὅτι οὔπω ἐληλύθει
  choice: porque ... ainda não havia chegado
  rationale: ὅτι introduz a causa, e o mais-que-perfeito ἐληλύθει indica que, naquele ponto da narrativa, a hora ainda não chegara.
- source_word: ἡ ὥρα αὐτοῦ
  choice: a hora dele
  rationale: A tradução literal preserva o motivo joanino da “hora” de Jesus e sua tensão teológica, em vez de reduzi-lo ao sentido genérico de “tempo”.
theological_decisions:
- issue: O uso joanino de “a hora dele”
  choice: Manter “a hora dele” no texto principal.
  alternative: “a hora determinada para ele” ou “o tempo dele”
  rationale: Em João, “hora” aponta para o momento determinado do sofrimento e da glorificação de Jesus. A formulação literal preserva o tema recorrente e evita explicar demais no texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Tesouraria” mantém a designação tradicional sem sugerir um único cofre; “a hora dele” conserva a expressão temática característica de João.
