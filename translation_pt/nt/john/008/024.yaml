  text: εἶπον οὖν ὑμῖν ὅτι ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν· ἐὰν γὰρ μὴ πιστεύσητε ὅτι ἐγώ εἰμι, ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/024.yaml
  text: So I told you that you will die in your sins. For unless you believe that I am[a], you will die in your sins.
translation:
  language: pt
  text: Por isso, eu lhes disse que vocês morrerão em seus pecados; pois, se não crerem que eu sou[a], morrerão em seus pecados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “que eu sou”. O grego não traz um predicativo explícito depois de “eu sou”; também pode ser entendido como “que sou eu” ou “que eu sou ele”. A expressão pode ter uma ressonância mais profunda no Evangelho de João.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν ὑμῖν
  choice: Por isso, eu lhes disse
  rationale: οὖν liga a afirmação ao contexto anterior com valor inferencial; “Por isso” torna essa relação clara. εἶπον e o dativo ὑμῖν são expressos naturalmente por “eu lhes disse”.
- source_word: ἀποθανεῖσθε
  choice: vocês morrerão
  rationale: O futuro de ἀποθνῄσκω indica diretamente “morrerão”; “perecerão” acrescentaria uma nuance interpretativa desnecessária.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: em seus pecados
  rationale: Preserva tanto a preposição ἐν, que aqui indica estado ou esfera, quanto o plural ἁμαρτίαις.
- source_word: ἐὰν γὰρ μὴ
  choice: pois, se não
  rationale: “Pois” representa o valor explicativo de γάρ, e “se não” reproduz de modo claro a condição negativa de ἐὰν μή.
- source_word: πιστεύσητε
  choice: crerem
  rationale: “Crer” é o equivalente corrente de πιστεύω no uso joanino e permite que o contexto comunique suas dimensões de confiança e adesão.
- source_word: ὅτι ἐγώ εἰμι
  choice: que Eu Sou[a]
  rationale: A formulação mantém a ausência de predicativo explícito no grego, sem inserir “ele”. As maiúsculas assinalam a expressão distintiva, mas a nota preserva sua ambiguidade contextual e possível ressonância mais profunda.
theological_decisions:
- issue: A expressão joanina ἐγώ εἰμι sem predicativo explícito
  choice: que Eu Sou[a]
  alternative: que sou eu / que eu sou ele
  rationale: O grego pode funcionar como identificação contextual, mas sua forma absoluta também pode ter ressonâncias de autorrevelação no Evangelho de João. A tradução principal conserva literalmente a construção, e a nota registra a leitura idiomática sem decidir de modo exclusivo entre elas.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural de segunda pessoa e “lhes” como objeto indireto. O ponto e vírgula conserva a estreita ligação lógica entre as duas declarações. A repetição de “morrerão em seus pecados” foi mantida por corresponder à ênfase do original.
