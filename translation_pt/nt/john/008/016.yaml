id: JHN.8.16
reference: John 8:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐὰν κρίνω δὲ ἐγώ, ἡ κρίσις ἡ ἐμὴ ⸀ἀληθινή ἐστιν, ὅτι μόνος οὐκ εἰμί, ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/016.yaml
  text: But even if I do judge[a], my judgment is true, because I am not alone, but I and the Father who sent me.
translation:
  language: pt
  text: Mas, mesmo que eu julgue[a], o meu julgamento é verdadeiro, porque não estou sozinho, mas estamos eu e o Pai que me enviou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “se eu julgar”. A expressão condicional grega também pode ser traduzida de modo mais formal, mas, neste contexto, provavelmente tem sentido concessivo: “mesmo que eu julgue”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν κρίνω
  choice: mesmo que eu julgue
  rationale: A construção ἐὰν com o subjuntivo presente expressa uma possibilidade condicional que, neste contexto, tem força concessiva. “Mesmo que eu julgue” preserva essa nuance sem excluir as alternativas mais formais indicadas na nota.
- source_word: δὲ
  choice: Mas
  rationale: δέ introduz aqui um contraste com a declaração anterior, e “Mas” comunica naturalmente essa transição adversativa.
- source_word: ἡ κρίσις ἡ ἐμὴ
  choice: o meu julgamento
  rationale: A expressão articulada com possessivo corresponde naturalmente a “o meu julgamento” e mantém a nuance forense de κρίσις.
- source_word: ἀληθινή
  choice: verdadeiro
  rationale: “Verdadeiro” preserva o alcance joanino de ἀληθινή, que pode envolver tanto veracidade quanto validade, sem reduzir o termo a apenas uma dessas ideias.
- source_word: μόνος οὐκ εἰμί
  choice: não estou sozinho
  rationale: Esta formulação é clara e natural em português e conserva a afirmação relacional de que Jesus não julga isoladamente.
- source_word: ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ
  choice: mas estamos eu e o Pai que me enviou
  rationale: A forma “estamos eu e o Pai” explicita em português corrente a presença conjunta indicada pelo grego, enquanto “que me enviou” reproduz naturalmente a função identificadora do particípio πέμψας.
theological_decisions:
- issue: Relação entre o julgamento de Jesus e a presença/testemunho do Pai
  choice: O julgamento de Jesus é verdadeiro porque ele não está sozinho, mas unido ao Pai que o enviou.
  alternative: Entender a declaração apenas como uma alegação jurídica sobre a exigência de múltiplas testemunhas, sem implicações relacionais mais amplas.
  rationale: O próprio versículo fundamenta a verdade do julgamento de Jesus no fato de ele não estar só e na presença do Pai que o enviou. A tradução mantém essa tensão entre o contexto jurídico e a relação entre Jesus e o Pai, sem desenvolver formulações doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Julgamento” preserva o campo jurídico do contexto; “estamos eu e o Pai” evita uma coordenação nominal truncada e comunica com clareza que Jesus não está sozinho.
