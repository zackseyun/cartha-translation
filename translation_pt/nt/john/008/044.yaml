  source_fidelity: A tradução comunica adequadamente a filiação/pertencimento indicada por ἐκ, a vontade de realizar os desejos do diabo, o caráter homicida, a ausência de verdade nele e a origem própria da mentira. Contudo, «foi assassino» pode sugerir em português que ele deixou de sê-lo, embora o imperfeito grego apresente uma caracterização continuada. Além disso, ὅταν tem valor habitual, melhor expresso por «sempre que», e o referente de αὐτοῦ em «ὁ πατὴρ αὐτοῦ» deve ser assinalado como discutido, não apenas explicado como resolvido.
  naturalness: «Vocês têm por pai o diabo» e «falam do que lhe é próprio» são claros e naturais. «Profere a mentira» é compreensível, mas relativamente elevado e menos idiomático para português moderno do que «fala a mentira». «Era assassino desde o princípio» evita a implicação temporal indesejada de «foi assassino».
  terminology: «Diabo», «desejos», «assassino», «verdade» e «mentiroso» são escolhas apropriadas. «Pai dela» preserva a leitura contextual que toma «a mentira» como antecedente, mas a nota deve reconhecer que o pronome grego pode ser entendido de outra forma.
