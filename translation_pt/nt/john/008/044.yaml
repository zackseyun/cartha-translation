source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ’ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ ⸂οὐκ ἔστηκεν⸃, ὅτι οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/044.yaml
  text: You are from your father[a], the devil, and you want to do your father's desires. He was a murderer from the beginning, and he has not stood in the truth, because there is no truth in him. Whenever he speaks the lie, he speaks from his own nature[c][b], because he is a liar and the father of it.
translation:
  language: pt
  text: Vocês têm por pai o diabo e querem fazer os desejos do pai de vocês. Ele era assassino desde o princípio e não está firme na verdade,[a] porque nele não há verdade. Sempre que fala a mentira, fala do que lhe é próprio,[b] porque é mentiroso e pai dela.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se mantém na verdade”. A expressão grega não exige a conclusão de que ele antes estivesse na verdade e depois a abandonasse.'
    reason: preservação_de_ambiguidade
  - marker: b
    text: Literalmente, “fala do que é seu”, isto é, daquilo que lhe pertence ou lhe é característico.
    reason: alternativa_lexical
  - marker: c
    text: Isto é, pai da mentira, sua fonte. O grego diz literalmente “pai dela”; o referente do pronome é discutido. Alguns o entendem de forma mais geral como “pai da mentira”.
    reason: esclarecimento_de_referente
lexical_decisions:
- source_word: ἐκ τοῦ πατρὸς τοῦ διαβόλου
  choice: têm por pai o diabo
  rationale: Expressa de modo natural em português a origem ou pertença indicada por ἐκ com εἰμί, preservando a afirmação de filiação espiritual sem sugerir filiação física.
- source_word: ἐπιθυμίας
  choice: desejos
  rationale: Termo amplo e corrente, adequado ao sentido volitivo e moral; evita a conotação sexual excessivamente estreita de “paixões” ou “concupiscências”.
- source_word: θέλετε ποιεῖν
  choice: querem fazer
  rationale: Reproduz com clareza a vontade ou intenção culpável expressa pela construção grega.
- source_word: ἀνθρωποκτόνος
  choice: assassino
  rationale: Equivalente português natural para quem tira deliberadamente a vida humana, adequado à força moral do contexto.
- source_word: ἀπ’ ἀρχῆς
  choice: desde o princípio
  rationale: Preserva diretamente a expressão temporal e sua ressonância joanina.
- source_word: ἐν τῇ ἀληθείᾳ οὐκ ἔστηκεν
  choice: não se mantém na verdade
  rationale: Conserva a imagem de posição firme ou permanência sem afirmar explicitamente que o diabo antes esteve na verdade e depois a abandonou.
- source_word: ὅταν λαλῇ τὸ ψεῦδος
  choice: Quando profere a mentira
  rationale: Mantém o artigo e o singular marcantes do grego, mas com formulação digna e inteligível em português.
- source_word: ἐκ τῶν ἰδίων λαλεῖ
  choice: fala do que lhe é próprio
  rationale: Preserva a expressão elíptica do grego sem explicitar indevidamente “natureza”; comunica que a mentira procede daquilo que caracteriza o próprio diabo.
- source_word: ψεύστης
  choice: mentiroso
  rationale: Equivalente direto, corrente e idiomático.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: pai dela
  rationale: Toma o pronome como referência à mentira, seu antecedente contextual mais próximo e coerente, mantendo o singular e a metáfora de origem.
theological_decisions:
- issue: Referente de ὁ πατὴρ αὐτοῦ
  choice: “pai dela”, referindo-se à mentira
  alternative: “pai da mentira” como paráfrase geral, ou, menos provavelmente, “pai dele”
  rationale: A mentira é o antecedente contextual mais natural. “Pai dela” conserva o singular e evita a ideia especulativa de que o diabo tenha um pai.
- issue: Se o texto implica que o diabo antes esteve na verdade
  choice: não se mantém na verdade
  alternative: “não permaneceu na verdade”, que pode sugerir mais fortemente uma posição anterior
  rationale: A formulação preserva a imagem verbal e a tensão do grego sem decidir a questão debatida de uma participação anterior do diabo na verdade.
- issue: Sentido da filiação dos interlocutores
  choice: têm por pai o diabo
  alternative: “procedem do pai, o diabo”
  rationale: A expressão comunica filiação espiritual manifestada pelos desejos e atos no próprio contexto, sem acrescentar uma explicação doutrinária externa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Usa “vocês” para o plural explícito ὑμεῖς e evita tanto arcaísmos como “concupiscências” quanto expansões doutrinárias. “Profere” mantém solenidade moderada sem obscurecer o sentido.
