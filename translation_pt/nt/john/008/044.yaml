revisions:
- from: Vocês têm por pai o diabo e querem fazer os desejos do pai de vocês. Ele foi assassino desde o princípio e não se mantém na verdade,[a] porque nele não há verdade. Quando profere a mentira, fala do que lhe é próprio,[b] porque é mentiroso e pai dela.[c]
  to: Vocês têm por pai o diabo e querem fazer os desejos do pai de vocês. Ele era assassino desde o princípio e não está firme na verdade,[a] porque nele não há verdade. Sempre que fala a mentira, fala do que lhe é próprio,[b] porque é mentiroso e pai dela.[c]
  rationale: A revisão conserva as opções centrais do rascunho, mas ajusta o imperfeito grego («era assassino»), torna explícito o valor habitual de ὅταν («sempre que») e substitui uma formulação mais elevada por português moderno e direto («fala a mentira»). «Não está firme na verdade» mantém a imagem de estar de pé/firme sem pressupor uma permanência anterior. A nota sobre «pai dela» agora preserva a disputa de referente sem introduzir leitura doutrinária.
  reviewer_model: gpt-5.6-terra
