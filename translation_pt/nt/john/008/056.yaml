  text: Ἀβραὰμ ὁ πατὴρ ὑμῶν ἠγαλλιάσατο ἵνα ἴδῃ τὴν ἡμέραν τὴν ἐμήν, καὶ εἶδεν καὶ ἐχάρη.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/056.yaml
  text: Abraham your father rejoiced to see my day[b][a]; he saw it and was glad.
translation:
  language: pt
  text: Abraão, o pai de vocês, exultou para ver o meu dia[a][b]; ele o viu e se alegrou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: «exultou para que visse o meu dia» ou «exultou por ver o meu dia». A oração grega com ἵνα admite mais de uma tradução estreitamente relacionada.'
    reason: lexical_alternative
  - marker: b
    text: «O meu dia» pode referir-se de modo amplo ao dia ou à realização messiânica de Jesus; o próprio versículo não especifica o acontecimento ou o momento exato em vista.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀβραὰμ
  choice: Abraão
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do patriarca.
- source_word: ὁ πατὴρ ὑμῶν
  choice: pai de vocês
  rationale: Construção natural e clara em português internacional com boa legibilidade brasileira; preserva a relação reivindicada pelos interlocutores.
- source_word: ἠγαλλιάσατο
  choice: exultou
  rationale: Expressa a alegria intensa de ἀγαλλιάομαι e mantém distinção lexical em relação a ἐχάρη no fim do versículo.
- source_word: ἵνα ἴδῃ
  choice: com a perspectiva de ver
  rationale: Comunica a expectativa voltada para o futuro e acomoda a proximidade entre finalidade e conteúdo na oração com ἵνα, sem impor uma única análise gramatical.
- source_word: τὴν ἡμέραν τὴν ἐμήν
  choice: o meu dia
  rationale: Mantém a formulação concreta e teologicamente sugestiva do grego, sem identificar o evento ou período exato.
- source_word: καὶ εἶδεν
  choice: ele o viu
  rationale: O pronome retoma naturalmente «o meu dia», objeto subentendido no grego.
- source_word: καὶ ἐχάρη
  choice: e se alegrou
  rationale: Tradução natural de χαίρω que preserva alguma distinção em relação ao verbo mais intenso traduzido por «exultou».
theological_decisions:
- issue: Sentido de «o meu dia»
  choice: Conservar a expressão literal «o meu dia» sem especificar seu referente.
  alternative: Explicitar a encarnação, o ministério terreno, a consumação messiânica, a morte e ressurreição ou o dia escatológico de Cristo.
  rationale: O versículo não delimita qual acontecimento ou período está em vista; explicá-lo no texto resolveria indevidamente uma tensão interpretativa genuína.
- issue: Força da oração ἵνα ἴδῃ
  choice: Traduzir por «com a perspectiva de ver».
  alternative: «para ver», «a fim de ver» ou «por ver».
  rationale: A formulação preserva a antecipação de Abraão e evita decidir rigidamente entre finalidade e conteúdo, nuances estreitamente relacionadas neste contexto.
translation_notes:
  register: Português moderno, digno e acessível, com «vocês» para leitura brasileira natural. «Exultou» conserva a intensidade do primeiro verbo, enquanto «se alegrou» evita apagar a variação lexical do grego. Os marcadores seguem a ordem de aparecimento [a][b].
