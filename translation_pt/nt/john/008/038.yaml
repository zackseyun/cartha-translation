id: JHN.8.38
reference: John 8:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂ἃ ἐγὼ⸃ ἑώρακα παρὰ τῷ ⸀πατρὶ λαλῶ· καὶ ὑμεῖς οὖν ⸂ἃ ἠκούσατε⸃ παρὰ ⸂τοῦ πατρὸς⸃ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/038.yaml
  text: I speak what I have seen with the Father[a], and you, then, do what you have heard from your father.
translation:
  language: pt
  text: Eu falo o que vi junto do Pai; e vocês, então, fazem[a] o que ouviram do pai de vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “façam”. A forma grega pode ser entendida como indicativo ou imperativo.'
    reason: ambiguity
  - marker: b
    text: 'Mais literalmente: “do pai”. O contexto indica que se trata do pai deles; sua identidade é explicitada no versículo 44.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ
  choice: o que
  rationale: O pronome relativo neutro plural introduz o conteúdo da fala; “o que” é natural em português e preserva o sentido de “as coisas que”.
- source_word: ἑώρακα
  choice: tenho visto
  rationale: O perfeito grego apresenta uma percepção passada com relevância contínua; o pretérito perfeito composto conserva essa perspectiva sem reduzir o verbo a um passado pontual.
- source_word: παρὰ τῷ πατρὶ
  choice: junto do Pai
  rationale: παρά com dativo indica proximidade ou presença. “Junto do Pai” expressa essa relação melhor do que uma formulação que apresentasse o Pai apenas como fonte da informação.
- source_word: λαλῶ
  choice: falo
  rationale: Tradução direta e corrente do presente grego, tendo “o que tenho visto” como objeto.
- source_word: οὖν
  choice: portanto
  rationale: Mantém a conexão inferencial ou conclusiva marcada pela partícula, sem eliminar a tensão do contraste.
- source_word: ἃ ἠκούσατε
  choice: o que ouviram
  rationale: O aoristo é expresso naturalmente pelo pretérito perfeito simples em português.
- source_word: παρὰ τοῦ πατρὸς
  choice: do pai de vocês
  rationale: παρά com genitivo indica origem. Embora não haja pronome possessivo expresso, o contraste entre o Pai de Jesus e o pai dos interlocutores torna a relação possessiva fortemente implícita; a nota registra a forma mais literal.
- source_word: ποιεῖτε
  choice: fazem
  rationale: A forma pode ser indicativo ou imperativo. O indicativo se ajusta à acusação desenvolvida no contexto imediato, enquanto a alternativa imperativa é preservada em nota.
- source_word: πατήρ / πατρὸς
  choice: Pai / pai
  rationale: A inicial maiúscula no primeiro caso sinaliza a referência a Deus; a minúscula no segundo conserva a distinção retórica sem antecipar a identificação explícita feita no versículo 44.
theological_decisions:
- issue: Identidade do segundo “pai”
  choice: “pai de vocês”, sem identificá-lo no texto como o diabo
  alternative: “o pai”; ou “o diabo”
  rationale: O contexto contrapõe o Pai de Jesus ao pai dos interlocutores, mas a identificação explícita deste último como o diabo só aparece no versículo 44. A tradução mantém a progressão retórica e não importa prematuramente essa explicação.
- issue: Valor verbal de ποιεῖτε
  choice: 'Indicativo: “fazem”'
  alternative: 'Imperativo: “façam”'
  rationale: A morfologia admite as duas análises. O indicativo se harmoniza com a denúncia das ações habituais dos interlocutores, especialmente à luz do versículo 41, mas a ambiguidade genuína é indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vocês” evita uma forma regional ou excessivamente solene; “junto do Pai” preserva a ideia de presença e relacionamento. O ponto e vírgula realça o contraste entre Jesus e seus interlocutores sem acrescentar conteúdo.
