    reason: alternative_reading
  revision_rationale: A revisão limita-se a corrigir uma nuance aspectual pouco natural em português e a tornar a ligação discursiva mais fluente. Mantêm-se o contraste entre os dois pais, a ambiguidade de ποιεῖτε e todas as âncoras de notas.
