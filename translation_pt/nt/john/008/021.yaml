id: JHN.8.21
reference: John 8:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς· Ἐγὼ ὑπάγω καὶ ζητήσετέ με, καὶ ἐν τῇ ἁμαρτίᾳ ὑμῶν ἀποθανεῖσθε· ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/021.yaml
  text: So he said to them again[a], “I am going away, and you will seek me, and you will die in your sin. Where I am going[c][b], you are not able to come.”
translation:
  language: pt
  text: 'Por isso, ele lhes disse novamente: “Eu vou embora, e vocês me procurarão[a], e morrerão no pecado de vocês[b]. Para onde eu vou, vocês não podem vir[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vocês me buscarão”. O verbo pode indicar a procura por alguém e, em João, também pode ter uma dimensão espiritual mais profunda.
    reason: lexical_alternative
  - marker: b
    text: 'O grego traz o singular: “no pecado de vocês”. Algumas traduções usam “nos pecados de vocês”, mas o singular pode enfatizar uma condição contínua, e não atos individuais.'
    reason: lexical_alternative
  - marker: c
    text: Também se pode traduzir “vocês não podem ir”, adotando a perspectiva dos ouvintes em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Por isso
  rationale: Mantém a ligação inferencial ou continuativa com o diálogo anterior, em português natural.
- source_word: πάλιν
  choice: novamente
  rationale: Expressa de modo direto e digno a repetição indicada pelo advérbio.
- source_word: ὑπάγω
  choice: vou embora
  rationale: Comunica tanto o movimento quanto a ideia de partida que o verbo frequentemente assume em João, sem explicitar no texto principal o destino de Jesus.
- source_word: ζητήσετέ με
  choice: vocês me procurarão
  rationale: ‘Procurar’ é corrente e preserva a possibilidade de uma busca literal, embora o contexto joanino também possa sugerir uma dimensão espiritual.
- source_word: ἐν τῇ ἁμαρτίᾳ ὑμῶν
  choice: no pecado de vocês
  rationale: Preserva o substantivo grego no singular e a construção com ἐν, permitindo que ‘pecado’ denote uma condição persistente, e não apenas atos individuais.
- source_word: ἀποθανεῖσθε
  choice: morrerão
  rationale: Reproduz de maneira natural o futuro do verbo grego.
- source_word: ὅπου ἐγὼ ὑπάγω
  choice: Para onde eu vou
  rationale: É uma formulação idiomática que mantém o presente e a ideia de destino, sem repetir desnecessariamente ‘embora’.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: vocês não podem vir
  rationale: Preserva a ideia explícita de incapacidade expressa por δύνασθε e mantém a perspectiva dêitica de Jesus por meio de ‘vir’.
theological_decisions:
- issue: Singular de ἁμαρτίᾳ em contraste com o plural mais comum em algumas traduções
  choice: no pecado de vocês
  alternative: nos pecados de vocês
  rationale: O texto grego emprega o singular, que pode enfatizar uma condição contínua de pecado, inclusive a incredulidade e a alienação de Deus, sem reduzir a expressão a uma lista de atos.
- issue: Alcance da partida de Jesus em ὑπάγω
  choice: Eu vou embora
  alternative: Eu vou; Eu parto
  rationale: Em João, a partida de Jesus pode apontar para sua morte, ressurreição e ida ao Pai. A tradução mantém essa profundidade possível sem determinar explicitamente o referente.
- issue: Perspectiva de ἐλθεῖν na declaração final
  choice: vir
  alternative: ir
  rationale: ‘Vir’ conserva a perspectiva do lugar para onde Jesus vai; ‘ir’ é possível em português por assimilação ao ponto de vista dos ouvintes, mas altera levemente a orientação dêitica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Emprega “vocês” para o plural e preserva a coordenação repetida com “e” do texto grego, sem transformar a segunda oração em contraste com “mas”.
