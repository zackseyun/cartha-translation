  terminology: 'Os termos centrais estão consistentes e adequados: “luz do mundo”, “trevas” e “luz da vida” são traduções precisas e amplamente compreensíveis. A tradução não introduz interpretações confessionais na expressão “Eu sou” nem em “a luz da vida”.'
