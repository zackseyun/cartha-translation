  source_fidelity: 'A tradução representa com precisão o grego: Πάλιν οὖν é adequadamente expresso por “Então ... tornou a falar”; a declaração “Eu sou a luz do mundo” preserva a sintaxe predicativa; “Quem me segue” reproduz bem o particípio substantivado; “de modo nenhum andará” comunica legitimamente a negação enfática οὐ μή; e “a luz da vida” mantém a abertura do genitivo τῆς ζωῆς.'
