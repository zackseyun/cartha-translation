id: JHN.8.12
reference: John 8:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πάλιν οὖν αὐτοῖς ⸂ἐλάλησεν ὁ Ἰησοῦς⸃ λέγων· Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου· ὁ ἀκολουθῶν ⸀ἐμοὶ οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ, ἀλλ’ ἕξει τὸ φῶς τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/012.yaml
  text: So Jesus spoke to them again[a], saying, “I am the light of the world. The one who follows me will certainly not walk in the darkness[b], but will have the light of life.”
translation:
  language: pt
  text: 'Então Jesus tornou a falar com eles: “Eu sou a luz do mundo. Quem me segue de modo nenhum andará nas trevas[a], mas terá a luz da vida[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nunca andará nas trevas”. O grego emprega uma negação enfática (οὐ μή).'
    reason: lexical_alternative
  - marker: b
    text: A expressão “a luz da vida” também pode ser entendida como “a luz que dá vida”.
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν οὖν
  choice: Então ... tornou a falar
  rationale: Expressa naturalmente tanto a conexão discursiva de οὖν quanto a repetição indicada por Πάλιν, sem dar ao conectivo uma força lógica excessiva.
- source_word: ἐλάλησεν ὁ Ἰησοῦς λέγων
  choice: 'Jesus tornou a falar com eles:'
  rationale: A introdução direta com dois-pontos evita a redundância pouco natural de “falou, dizendo”, sem perder a função de λέγων de introduzir a fala.
- source_word: Ἐγώ εἰμι
  choice: Eu sou
  rationale: Tradução direta da construção copulativa com pronome explícito, sem acrescentar uma ênfase teológica que a sintaxe, ligada ao predicativo, não exige.
- source_word: τὸ φῶς τοῦ κόσμου
  choice: a luz do mundo
  rationale: Equivalência precisa e consagrada que preserva a imagem e o genitivo do texto grego.
- source_word: ὁ ἀκολουθῶν ἐμοὶ
  choice: Quem me segue
  rationale: Formulação portuguesa natural para o particípio substantivado, mantendo sua aplicação geral e representativa.
- source_word: οὐ μὴ περιπατήσῃ
  choice: de modo nenhum andará
  rationale: A combinação οὐ μή com o subjuntivo aoristo exprime negação enfática; “de modo nenhum” comunica essa força em português atual.
- source_word: ἐν τῇ σκοτίᾳ
  choice: nas trevas
  rationale: “Trevas” é uma expressão portuguesa natural e digna para a esfera metafórica da escuridão no uso joanino.
- source_word: ἕξει
  choice: terá
  rationale: Equivalente simples e idiomático do futuro de ἔχω.
- source_word: τὸ φῶς τῆς ζωῆς
  choice: a luz da vida
  rationale: Mantém a relação genitiva compacta e deliberadamente aberta, sem restringi-la à ideia de luz que concede vida.
theological_decisions:
- issue: Força da autoidentificação de Jesus em Ἐγώ εἰμι
  choice: Traduzir simplesmente como “Eu sou” na declaração predicativa “Eu sou a luz do mundo”.
  alternative: Acrescentar ênfase para sinalizar uma possível alusão ao nome divino.
  rationale: Aqui Ἐγώ εἰμι está gramaticalmente ligado ao predicativo “a luz do mundo”. A tradução preserva a sintaxe explícita e permite que eventuais ressonâncias joaninas sejam percebidas sem as impor.
- issue: Sentido de τὸ φῶς τῆς ζωῆς
  choice: Conservar “a luz da vida”.
  alternative: Traduzir interpretativamente como “a luz que dá vida” ou “a luz vivificante”.
  rationale: O genitivo admite mais de uma nuance, como origem, qualidade ou efeito. A formulação literal preserva essa riqueza e tensão teológica.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Tornou a falar” evita a sequência menos natural “falou novamente, dizendo”; “nas trevas” mantém a imagem joanina tradicional sem soar arcaica. Os marcadores foram posicionados junto às expressões a que suas respectivas notas efetivamente se referem.
