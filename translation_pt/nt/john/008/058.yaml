source:
  edition: SBLGNT
  text: εἶπεν ⸀αὐτοῖς Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, πρὶν Ἀβραὰμ γενέσθαι ἐγὼ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/058.yaml
  text: Jesus said to them[a], “Truly, truly, I say to you, before Abraham came to be[b], I am.”
translation:
  language: pt
  text: 'Jesus lhes disse: “Em verdade, em verdade lhes digo: antes de Abraão vir a existir[a], eu sou[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “antes de Abraão nascer”. O verbo grego é mais amplo e pode significar “vir a existir”.
    reason: lexical_alternative
  - marker: b
    text: Ou, quanto ao sentido temporal, “eu já existia”. O grego diz literalmente “eu sou”, conservando o presente e sua possível ressonância teológica.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν αὐτοῖς Ἰησοῦς
  choice: Jesus lhes disse
  rationale: Forma narrativa direta e natural em português, mantendo Jesus como sujeito e os interlocutores como destinatários.
- source_word: Ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Preserva a repetição enfática e solene da fórmula joanina em linguagem portuguesa clara e tradicionalmente reconhecível.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Equivalente direto e idiomático que mantém a fórmula de declaração solene dirigida aos ouvintes.
- source_word: πρὶν
  choice: antes de
  rationale: Expressa de modo simples e preciso a relação temporal introduzida pela preposição grega.
- source_word: Ἀβραὰμ γενέσθαι
  choice: Abraão vir a existir
  rationale: Mantém o sentido amplo de γίνομαι e o contraste verbal com ἐγὼ εἰμί, sem restringir a referência ao nascimento de Abraão.
- source_word: ἐγὼ εἰμί
  choice: eu sou
  rationale: Reproduz o presente grego e a forma enfática e absoluta da expressão, preservando sua tensão contextual e sua possível ressonância teológica.
- source_word: Ἀβραὰμ
  choice: Abraão
  rationale: Forma portuguesa consagrada do nome bíblico.
theological_decisions:
- issue: Tradução de ἐγὼ εἰμί em contexto cristologicamente significativo
  choice: eu sou
  alternative: eu já existia
  rationale: A tradução principal conserva o tempo presente e a formulação absoluta do grego. Assim, não reduz a declaração a uma simples afirmação de preexistência nem impõe uma explicação teológica; mantém aberta a possível ressonância com a autoidentificação divina.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição “Em verdade, em verdade” preserva a fórmula enfática de Jesus; “vir a existir” e “eu sou” mantêm o contraste marcante do original.
