  text: But when[a] they continued questioning him, he straightened up and said to them, "Let the one among you who is without sin be the first to throw a stone at her."
translation:
  language: pt
  text: 'Mas, como continuavam a interrogá-lo,[a] ele se endireitou e lhes disse: “Aquele de vocês que não tem pecado seja o primeiro a atirar uma pedra contra ela.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo faz parte do relato da mulher surpreendida em adultério (João 7:53–8:11), ausente dos manuscritos gregos mais antigos. Veja a nota em João 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπέμενον ἐρωτῶντες
  choice: continuavam a interrogá-lo
  rationale: O imperfeito ἐπέμενον com o particípio presente ἐρωτῶντες expressa uma ação insistente e contínua; a formulação portuguesa preserva esse aspecto com naturalidade.
- source_word: ἀνακύψας
  choice: ele se endireitou
  rationale: Indica que Jesus levantou a parte superior do corpo após estar inclinado escrevendo no chão; “se endireitou” comunica de modo conciso e natural esse movimento.
- source_word: ἀναμάρτητος
  choice: que não tem pecado
  rationale: Preserva o sentido moral amplo do raro adjetivo grego, sem restringi-lo à inocência quanto ao delito específico nem afirmar uma interpretação teológica além do texto.
- source_word: πρῶτος ... τὸν λίθον βαλέτω
  choice: seja o primeiro a atirar uma pedra
  rationale: Reproduz a construção imperativa e a ênfase em ser o primeiro a executar o apedrejamento, em português atual e digno.
theological_decisions:
- issue: Alcance de ἀναμάρτητος
  choice: que não tem pecado
  alternative: que não é culpado deste pecado
  rationale: O grego não especifica “deste pecado”; a tradução mantém deliberadamente o alcance amplo e a tensão moral da expressão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Interrogá-lo” preserva o caráter insistente das perguntas; “se endireitou” retoma naturalmente a postura descrita no contexto. O marcador [a] foi colocado após a oração inicial para sinalizar a questão textual sem interromper a fala de Jesus.
