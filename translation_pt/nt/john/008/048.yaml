  text: ⸀Ἀπεκρίθησαν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Οὐ καλῶς λέγομεν ἡμεῖς ὅτι Σαμαρίτης εἶ σὺ καὶ δαιμόνιον ἔχεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/048.yaml
  text: The Jews answered and said to him[c][b][a], “Are we not right in saying that you are a Samaritan and have a demon?”
translation:
  language: pt
  text: 'Os judeus[a] responderam e lhe disseram: “Não temos razão em dizer[b] que você é samaritano e tem um demônio[c]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em alguns contextos, também pode ser traduzido como “os judeus da Judeia” ou “os líderes judeus”. Em João, “os judeus” muitas vezes se refere a um grupo específico que se opõe a Jesus, e não a todos os judeus sem exceção.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “Não dizemos corretamente...?”'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “tem um demônio”; algumas traduções interpretam a expressão como “está possuído por um demônio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν
  choice: responderam
  rationale: O aoristo de forma passiva, mas com sentido depoente, significa naturalmente “responderam”; preserva o estilo narrativo do grego.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: É a correspondência lexical direta. O contexto joanino pode delimitar o referente a um grupo específico em oposição a Jesus, mas o versículo não diz explicitamente “líderes”; essa nuance fica em nota.
- source_word: καὶ εἶπαν αὐτῷ
  choice: e lhe disseram
  rationale: Mantém os dois verbos do original e sua redundância narrativa deliberada, em português natural e digno.
- source_word: Οὐ καλῶς λέγομεν ἡμεῖς
  choice: Não temos razão ao dizer
  rationale: Expressa de modo idiomático a pergunta retórica com οὐ, que espera resposta afirmativa, e traduz καλῶς como “com razão/corretamente”.
- source_word: Σαμαρίτης
  choice: samaritano
  rationale: Designação étnico-religiosa direta, empregada aqui de modo hostil; o predicativo dispensa artigo em português.
- source_word: δαιμόνιον ἔχεις
  choice: tem um demônio
  rationale: Reproduz transparentemente a construção literal “ter um demônio”, sem substituí-la pela interpretação mais específica “estar possuído”.
theological_decisions:
- issue: Referente de οἱ Ἰουδαῖοι no Evangelho de João
  choice: os judeus
  alternative: os judeus da Judeia; os líderes judeus
  rationale: A tradução principal preserva a formulação do grego sem estreitar o referente para “líderes”. A nota esclarece que, em João, a expressão frequentemente designa um grupo particular de opositores no contexto narrativo, não todos os judeus sem exceção.
- issue: Sentido de δαιμόνιον ἔχεις
  choice: tem um demônio
  alternative: está possuído por um demônio
  rationale: A formulação literal preserva a amplitude da expressão grega e evita resolver interpretativamente a natureza exata da alegação.
translation_notes:
  register: Português moderno, amplamente internacional, com leitura natural no Brasil. A construção conserva a dupla expressão narrativa “responderam e lhe disseram” e mantém a tensão lexical e contextual do original.
