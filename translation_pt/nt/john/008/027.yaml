  text: οὐκ ἔγνωσαν ὅτι τὸν πατέρα αὐτοῖς ἔλεγεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/027.yaml
  text: They did not understand that he was speaking to them about the Father[a].
translation:
  language: pt
  text: Eles não entenderam que ele lhes falava do Pai[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Eles não sabiam que ele lhes falava do Pai».'
    reason: Alternativa lexical para οὐκ ἔγνωσαν, que também pode ser traduzido por «não sabiam».
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: não entenderam
  rationale: Embora γινώσκω frequentemente signifique «conhecer» ou «saber», aqui descreve a incapacidade dos ouvintes de captar a quem Jesus se referia. «Não entenderam» comunica esse sentido com naturalidade em português.
- source_word: ὅτι
  choice: que
  rationale: Introduz a oração que expressa o conteúdo daquilo que eles não entenderam.
- source_word: τὸν πατέρα
  choice: do Pai
  rationale: O contexto joanino identifica o referente como Deus, a quem Jesus chama de Pai. A inicial maiúscula sinaliza esse uso titular sem acrescentar conteúdo ao grego.
- source_word: αὐτοῖς
  choice: lhes
  rationale: O pronome dativo com λέγω indica os destinatários da fala; «lhes falava» é uma formulação natural e concisa.
- source_word: ἔλεγεν
  choice: falava
  rationale: O imperfeito apresenta a ação em curso. «Falava» preserva adequadamente esse aspecto em português.
theological_decisions:
- issue: Referente de «o Pai»
  choice: Jesus falava de Deus, o Pai.
  alternative: Jesus falava de um pai humano.
  rationale: No contexto imediato de João, «o Pai» é a designação usada por Jesus para Deus. A tradução mantém essa identificação contextual sem desenvolver formulações doutrinárias posteriores.
- issue: Sentido contextual de γινώσκω
  choice: Traduzir por «entender».
  alternative: Traduzir por «saber», «conhecer» ou «reconhecer».
  rationale: O ponto é que os ouvintes não captaram o referente da fala de Jesus. A alternativa lexical é preservada em nota para não ocultar a amplitude possível do verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação «lhes falava» mantém concisão e naturalidade sem perder o valor do dativo grego.
