  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγνώκατε αὐτόν, ἐγὼ δὲ οἶδα αὐτόν· κἂν εἴπω ὅτι οὐκ οἶδα αὐτόν, ἔσομαι ὅμοιος ⸀ὑμῖν ψεύστης· ἀλλὰ οἶδα αὐτὸν καὶ τὸν λόγον αὐτοῦ τηρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/055.yaml
  text: Yet you have not known him[a], but I know him. If I were to say that I do not know him, I would be a liar like you. But I do know him[c][b], and I keep his word.
translation:
  language: pt
  text: No entanto, vocês não o conhecem[a], mas eu o conheço. Se eu dissesse[b] que não o conheço, seria um mentiroso como vocês. Mas eu o conheço e guardo a sua palavra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês não o conheceram”. O verbo grego está no perfeito e pode ressaltar a condição contínua de não o conhecerem verdadeiramente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Se eu disser”. A construção grega é hipotética; “Se eu dissesse” expressa naturalmente essa ideia em português.'
    reason: lexical_alternative
  - marker: c
    text: “Guardar” também pode ser traduzido por “obedecer” ou “observar”. Em João, o verbo frequentemente traz a ideia de conservar e cumprir fielmente a palavra de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκατε
  choice: não o conheceram
  rationale: O perfeito grego aponta para a falta de conhecimento que se estabeleceu e permanece. O pretérito perfeito português preserva o contraste com o conhecimento presente de Jesus, enquanto a nota registra a alternativa mais explicitamente estativa.
- source_word: οἶδα
  choice: conheço
  rationale: Embora tenha forma historicamente perfeita, οἶδα funciona como verbo estativo presente. “Conheço” é a correspondência natural em português.
- source_word: κἂν εἴπω
  choice: Se eu dissesse
  rationale: O imperfeito do subjuntivo expressa com naturalidade em português a hipótese irreal ou remota introduzida pela construção grega.
- source_word: ἔσομαι
  choice: seria
  rationale: No resultado dessa condição hipotética, o futuro grego corresponde idiomaticamente ao futuro do pretérito em português.
- source_word: ὅμοιος ὑμῖν ψεύστης
  choice: mentiroso como vocês
  rationale: Mantém a acusação direta e o substantivo forte ψεύστης, sem suavizá-lo para mero erro ou falsidade.
- source_word: τὸν λόγον αὐτοῦ
  choice: a sua palavra
  rationale: Preserva a dicção joanina e deixa em aberto tanto a palavra pronunciada quanto a mensagem revelada de Deus.
- source_word: τηρῶ
  choice: guardo
  rationale: '“Guardo” conserva a amplitude de τηρέω: manter fielmente, observar e obedecer, sem reduzi-lo apenas ao cumprimento de ordens.'
- source_word: καὶ ... δὲ
  choice: No entanto ... mas
  rationale: Torna claro em português o contraste discursivo entre os interlocutores e Jesus.
theological_decisions:
- issue: A alegação de Jesus de conhecer Deus em contraste com seus opositores
  choice: Apresentar diretamente o conhecimento verdadeiro de Jesus e sua fidelidade à palavra de Deus.
  alternative: Acrescentar linguagem sobre filiação divina exclusiva ou suavizar “conhecer” para mera familiaridade.
  rationale: O texto afirma um contraste incisivo entre Jesus e seus opositores, mas não requer aqui explicação doutrinária adicional. A formulação preserva a força e a tensão do versículo sem importar elaboração externa.
translation_notes:
  register: Português moderno, claro e digno, com plural “vocês” de ampla legibilidade brasileira. A ordem foi ajustada para fluência natural, preservando o confronto direto, a repetição de “conheço” e a amplitude joanina de “palavra” e “guardar”.
