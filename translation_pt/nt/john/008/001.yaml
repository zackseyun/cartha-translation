  text: Jesus, porém, foi para o monte das Oliveiras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo dá continuidade ao relato da mulher apanhada em adultério (João 7:53–8:11). Veja a nota em João 7:53 sobre as evidências textuais.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπορεύθη (πορεύομαι)
  choice: foi
  rationale: O aoristo, embora de forma passiva, tem sentido ativo e descreve de modo simples o deslocamento de Jesus para um destino.
- source_word: ὄρος
  choice: monte
  rationale: Neste nome geográfico tradicional, «monte» é natural, reconhecível e corresponde ao substantivo grego.
- source_word: τῶν Ἐλαιῶν (ἐλαία)
  choice: das Oliveiras
  rationale: O genitivo plural refere-se às oliveiras associadas ao lugar e integra a designação tradicional «monte das Oliveiras».
- source_word: δέ
  choice: porém
  rationale: Preserva a conexão contrastiva ou transicional com a frase anterior sem torná-la mais forte do que o grego exige.
