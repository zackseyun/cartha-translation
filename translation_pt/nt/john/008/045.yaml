  text: But because I tell the truth[a], you do not believe me.
translation:
  language: pt
  text: Mas, porque eu digo a verdade[a], vocês não creem em mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Mas eu, porque digo a verdade, vocês não creem em mim” ou “Mas, por eu dizer a verdade, vocês não creem em mim”. A conjunção grega também pode ser traduzida por “que”, mas aqui o sentido parece ser causal: “porque”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: eu
  rationale: O pronome explícito preserva a ênfase contrastiva do grego e soa natural na oração causal em português.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste com o contexto anterior de maneira clara e natural.
- source_word: ὅτι
  choice: porque
  rationale: A leitura causal explica a relação irônica entre Jesus dizer a verdade e seus interlocutores não crerem nele; é a leitura mais adequada ao fluxo do discurso.
- source_word: τὴν ἀλήθειαν
  choice: a verdade
  rationale: Equivalente corrente e direto, preservando naturalmente o artigo.
- source_word: λέγω
  choice: digo
  rationale: Mantém o presente e traduz diretamente λέγω; em português, 'dizer a verdade' é a expressão idiomática normal.
- source_word: οὐ πιστεύετέ μοι
  choice: vocês não creem em mim
  rationale: Preserva o verbo πιστεύω e seu complemento pessoal no dativo, sem expandi-lo para 'não creem no que digo'. 'Vocês' oferece ampla inteligibilidade moderna, especialmente no Brasil.
theological_decisions:
- issue: Sentido de ὅτι na relação entre a fala verdadeira de Jesus e a incredulidade dos ouvintes
  choice: 'Leitura causal: “porque eu digo a verdade”'
  alternative: 'Leitura declarativa ou mais formal: “que eu digo a verdade”'
  rationale: 'O contraste imediato favorece o valor causal e conserva a ironia contundente do texto: eles não creem em Jesus precisamente porque ele diz a verdade. A nota registra a alternativa sintática sem resolver além da evidência.'
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A ordem mantém a ênfase em “eu” sem produzir uma construção artificial.
