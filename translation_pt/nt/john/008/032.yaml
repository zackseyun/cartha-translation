id: JHN.8.32
reference: John 8:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ γνώσεσθε τὴν ἀλήθειαν, καὶ ἡ ἀλήθεια ἐλευθερώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/032.yaml
  text: and you will know the truth[b][a], and the truth will set you free.
translation:
  language: pt
  text: E vocês conhecerão a verdade[a], e a verdade os libertará.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês virão a conhecer a verdade”.'
    reason: lexical_alternative
  - marker: b
    text: O versículo não especifica aqui a natureza dessa liberdade; o contexto seguinte a relaciona com a libertação do pecado.
    reason: cross_reference
lexical_decisions:
- source_word: γνώσεσθε
  choice: vocês conhecerão
  rationale: O futuro de γινώσκω é vertido de modo direto e natural. “Conhecerão” preserva a possibilidade contextual de vir a conhecer sem explicitar essa nuance no texto principal.
- source_word: ἀλήθειαν / ἀλήθεια
  choice: a verdade
  rationale: O artigo grego é preservado nas duas ocorrências, assim como a repetição retórica da expressão.
- source_word: ἐλευθερώσει
  choice: libertará
  rationale: “Libertará” expressa com naturalidade a ação causativa de ἐλευθερόω e mantém em aberto, no próprio versículo, a natureza dessa liberdade.
- source_word: ὑμᾶς
  choice: vocês / os
  rationale: O pronome grego está no plural. “Vocês” torna esse número explícito no português internacional de leitura brasileira, e “os” é a retomada pronominal natural como objeto de “libertará”.
- source_word: καὶ ... καὶ
  choice: e ... e
  rationale: As duas conjunções são mantidas para conservar a estrutura coordenada, a progressão e a cadência do grego.
theological_decisions:
- issue: Natureza da liberdade em “a verdade os libertará”
  choice: Não especificar no texto principal de que liberdade se trata.
  alternative: “a verdade os libertará do pecado” ou “os tornará espiritualmente livres”
  rationale: Embora o contexto seguinte relacione a liberdade ao pecado, o enunciado deste versículo não explicita seu objeto. A tradução preserva essa concisão e deixa que o contexto faça a interpretação.
translation_notes:
  register: Português moderno, claro e digno, com uso de “vocês” para tornar explícito o plural grego e favorecer ampla legibilidade brasileira. A ordem e a repetição do original foram preservadas sem produzir uma construção artificial.
