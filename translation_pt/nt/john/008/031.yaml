  text: Ἔλεγεν οὖν ὁ Ἰησοῦς πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους· Ἐὰν ὑμεῖς μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ, ἀληθῶς μαθηταί μού ἐστε,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/031.yaml
  text: So Jesus was saying to the Jews who had believed him[a], “If you remain in my word, you are truly my disciples,”
translation:
  language: pt
  text: 'Assim, Jesus dizia aos judeus que lhe haviam dado crédito[a]: “Se vocês permanecerem na minha palavra, são verdadeiramente meus discípulos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos judeus que haviam crido nele”. O grego diz literalmente que haviam crido «a ele», com pronome no dativo; essa construção pode significar dar crédito a alguém. Não emprega aqui a preposição que explicitamente expressaria «crer em».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔλεγεν
  choice: dizia
  rationale: O imperfeito grego apresenta a fala em curso; “dizia” preserva esse aspecto de modo natural em português.
- source_word: οὖν
  choice: Assim
  rationale: Marca a continuação ou consequência no discurso sem lhe impor uma força estritamente lógica.
- source_word: πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους
  choice: aos judeus que haviam crido nele
  rationale: “Haviam crido” representa o particípio perfeito como ação anterior com resultado presente. “Crido nele” é português natural e mantém certa abertura sem explicitar “depositado a fé nele”.
- source_word: Ἐὰν ὑμεῖς μείνητε
  choice: Se vocês permanecerem
  rationale: A construção condicional com subjuntivo é expressa naturalmente por “se” mais futuro do subjuntivo. O pronome explícito corresponde ao ὑμεῖς enfático e torna claro o plural.
- source_word: ἐν τῷ λόγῳ τῷ ἐμῷ
  choice: na minha palavra
  rationale: Preserva a dicção joanina e sua ressonância, embora no contexto “palavra” também possa significar mensagem ou ensino.
- source_word: ἀληθῶς μαθηταί μού ἐστε
  choice: serão verdadeiramente meus discípulos
  rationale: Na apódose de uma condição futura, o futuro é idiomático em português; “verdadeiramente” comunica autenticidade, e “discípulos” é o termo adequado ao contexto do Evangelho.
theological_decisions:
- issue: Construção πιστεύω com o dativo αὐτῷ
  choice: que haviam crido nele
  alternative: que haviam acreditado no que ele dizia
  rationale: O grego emprega o dativo, e não a construção joanina explícita com εἰς. Em português, “crer nele” é a formulação pessoal mais natural, mas pode ser entendida como fé em sua pessoa; a nota registra a possibilidade contextual de referência à credibilidade de suas palavras, preservando a tensão.
- issue: Relação entre permanecer e ser discípulo
  choice: Se vocês permanecerem na minha palavra, serão verdadeiramente meus discípulos
  alternative: Se vocês permanecerem na minha palavra, são verdadeiramente meus discípulos
  rationale: O grego tem presente (“vocês são”), mas a condição prospectiva com ἐὰν e subjuntivo é expressa com naturalidade em português pelo futuro na oração principal. A formulação não decide se a permanência produz, demonstra ou caracteriza o discipulado verdadeiro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A ordem foi ajustada à sintaxe natural do português, preservando o aspecto do imperfeito, a condição prospectiva e a expressão joanina “minha palavra”.
