review_pass:
  verdict: revise
  source_fidelity: A oração principal grega está no presente (ἐστε, «são»), não no futuro. Embora o futuro possa ocorrer em português em condicionais, aqui altera desnecessariamente a afirmação presente do texto. Além disso, «haviam crido nele» tende a equivaler a «crido em Jesus», enquanto o dativo αὐτῷ permite a formulação mais direta «deram-lhe crédito»/«acreditaram nele [no sentido de acreditar-lhe]».
  naturalness: «Assim, Jesus dizia» e «Se vocês permanecerem na minha palavra» são naturais em português moderno. «Deram-lhe crédito» é uma formulação clara e idiomática que evita a ambiguidade menos controlada de «crer nele».
  terminology: «Palavra» preserva adequadamente a dicção joanina de λόγος, e «discípulos» é o termo estabelecido e apropriado. A nota deve distinguir a construção grega com dativo da leitura portuguesa habitual «crer nele».
  issues:
  - severity: medium
    issue: «serão verdadeiramente meus discípulos» traduz ἐστε por futuro.
    rationale: O texto grego traz o presente indicativo «vocês são». A condição com ἐάν + subjuntivo não exige que a apódose portuguesa seja posta no futuro; «são» é natural e preserva o tempo e a força caracterizadora do original.
  - severity: medium
    issue: «haviam crido nele» e a nota identificam de modo impreciso o dativo αὐτῷ com «nele».
    rationale: «Crer nele» em português normalmente expressa fé em sua pessoa e corresponde mais diretamente a construções com «em». O grego usa πιστεύω com dativo, que pode ser expresso de forma mais direta por «dar crédito a alguém», sem resolver antecipadamente sua nuance no contexto joanino.
  revised_text: 'Assim, Jesus dizia aos judeus que lhe haviam dado crédito[a]: “Se vocês permanecerem na minha palavra, são verdadeiramente meus discípulos.”'
