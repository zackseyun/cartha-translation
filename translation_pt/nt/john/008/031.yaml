  to: 'Assim, Jesus dizia aos judeus que lhe haviam dado crédito[a]: “Se vocês permanecerem na minha palavra, são verdadeiramente meus discípulos.”'
  rationale: A revisão restaura o presente de «são» para ἐστε e traduz πιστεύω com dativo por «dar crédito», expressão portuguesa natural que reproduz a relação direta com Jesus sem importar a construção explícita «crer em». A nota conserva a alternativa tradicional e explica de modo preciso a diferença sintática, sem decidir além do que o grego permite.
