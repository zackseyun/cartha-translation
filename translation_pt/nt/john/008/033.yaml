id: JHN.8.33
reference: John 8:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν ⸂πρὸς αὐτόν⸃· Σπέρμα Ἀβραάμ ἐσμεν καὶ οὐδενὶ δεδουλεύκαμεν πώποτε· πῶς σὺ λέγεις ὅτι Ἐλεύθεροι γενήσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/033.yaml
  text: They answered him[a], “We are Abraham’s offspring and have never been enslaved to anyone. How can you say[c][b], ‘You will become free’?”
translation:
  language: pt
  text: 'Eles lhe responderam: “Somos da descendência de Abraão[a] e nunca fomos escravos de ninguém[b]. Como você pode dizer: ‘Vocês se tornarão livres’?[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “semente de Abraão”. O grego emprega uma expressão coletiva no singular para indicar descendência física.
    reason: lexical_alternative
  - marker: b
    text: Ou “nunca servimos a ninguém”. Neste contexto, porém, o verbo ressalta a condição de escravidão.
    reason: lexical_alternative
  - marker: c
    text: Ou “Vocês serão livres”. Mais literalmente, o grego diz “Vocês se tornarão livres”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν πρὸς αὐτόν
  choice: Eles lhe responderam
  rationale: Expressão natural em português para uma resposta dirigida a Jesus, sem reproduzir de modo rígido a preposição grega.
- source_word: Σπέρμα Ἀβραάμ
  choice: da descendência de Abraão
  rationale: Comunica a linhagem física reivindicada e mantém uma noção coletiva, aproximando-se do singular coletivo σπέρμα sem recorrer ao menos natural “semente” no texto principal.
- source_word: οὐδενὶ δεδουλεύκαμεν πώποτε
  choice: nunca fomos escravos de ninguém
  rationale: Forma idiomática que preserva o estado de sujeição destacado pelo perfeito e o contraste imediato entre escravidão e liberdade. “Ninguém” corresponde naturalmente ao dativo οὐδενί na oração negativa.
- source_word: πῶς σὺ λέγεις
  choice: Como você pode dizer
  rationale: Expressa em português a incredulidade da pergunta e a ênfase contextual no interlocutor.
- source_word: Ἐλεύθεροι γενήσεσθε
  choice: Vocês se tornarão livres
  rationale: Preserva tanto o plural quanto a ideia de transição expressa por γενήσεσθε, em vez de reduzir a frase ao estado simples “serão livres”.
theological_decisions:
- issue: Sentido de δουλεύω no contraste entre escravidão e liberdade
  choice: fomos escravos
  alternative: servimos
  rationale: O contexto dos versículos 34–36 torna proeminente a condição de escravidão. A tradução escolhida conserva essa força social e teológica sem limitar a frase a serviço voluntário.
- issue: Representação de Σπέρμα Ἀβραάμ
  choice: da descendência de Abraão
  alternative: semente de Abraão; descendentes de Abraão
  rationale: A escolha indica linhagem física e preserva o caráter coletivo da expressão, sem introduzir aqui sentidos teológicos de outros contextos bíblicos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você/vocês” oferece naturalidade contemporânea; “da descendência de Abraão” evita o arcaísmo de “semente” no texto principal. Os marcadores foram posicionados junto às expressões que explicam.
