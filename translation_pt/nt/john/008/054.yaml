  text: ἀπεκρίθη Ἰησοῦς· Ἐὰν ἐγὼ ⸀δοξάσω ἐμαυτόν, ἡ δόξα μου οὐδέν ἐστιν· ἔστιν ὁ πατήρ μου ὁ δοξάζων με, ὃν ὑμεῖς λέγετε ὅτι θεὸς ⸀ἡμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/054.yaml
  text: Jesus answered[a], “If I glorify myself, my glory is nothing. My Father is the one who glorifies me, he whom you say is our God,”
translation:
  language: pt
  text: 'Jesus respondeu: “Se eu glorifico a mim mesmo, a minha glória não é nada. Meu Pai é quem me glorifica, aquele que vocês dizem ser o nosso Deus[a],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “o Deus de vocês” em vez de “o nosso Deus”.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: Forma narrativa comum e natural para introduzir a resposta de Jesus no diálogo.
- source_word: δοξάσω / δοξάζων
  choice: glorifico / glorifica
  rationale: Preserva o tema joanino da glória e a ligação lexical entre a ação de Jesus e a do Pai.
- source_word: ἡ δόξα μου οὐδέν ἐστιν
  choice: a minha glória não é nada
  rationale: Reproduz de perto a construção enfática do grego sem suavizá-la para 'não vale nada' ou 'não conta para nada'.
- source_word: ὁ πατήρ μου
  choice: Meu Pai
  rationale: Designação pessoal e natural em português para a referência de Jesus ao Pai.
- source_word: ὁ δοξάζων με
  choice: é quem me glorifica
  rationale: Expressa de modo idiomático a força identificadora do particípio substantivado.
- source_word: ὃν ὑμεῖς λέγετε ὅτι θεὸς ἡμῶν ἐστιν
  choice: aquele que vocês dizem ser o nosso Deus
  rationale: Mantém a referência relativa ao Pai, a acusação dirigida aos interlocutores e a leitura ἡμῶν do texto-base.
- source_word: θεὸς
  choice: Deus
  rationale: O referente é o Deus de Israel; a inicial maiúscula é a convenção portuguesa apropriada.
- source_word: ἡμῶν
  choice: nosso
  rationale: Segue a leitura do SBLGNT; a variante ὑμῶν é registrada em nota.
theological_decisions:
- issue: Pronome em θεὸς ἡμῶν/ὑμῶν ἐστιν
  choice: o nosso Deus
  alternative: o Deus de vocês / seu Deus
  rationale: O texto principal segue ἡμῶν no SBLGNT, enquanto a variante ὑμῶν, relevante para o tom da controvérsia, é preservada sem ser incorporada silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com 'vocês' para o plural de segunda pessoa. A repetição de 'glorifico/glória/glorifica' foi mantida para preservar o encadeamento lexical do original.
