id: JHN.8.28
reference: John 8:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν ⸀οὖν ὁ Ἰησοῦς· Ὅταν ὑψώσητε τὸν υἱὸν τοῦ ἀνθρώπου, τότε γνώσεσθε ὅτι ἐγώ εἰμι, καὶ ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν, ἀλλὰ καθὼς ἐδίδαξέν με ὁ ⸀πατὴρ ταῦτα λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/028.yaml
  text: So Jesus said[a], “When you lift up the Son of Man, then you will know that I am he, and that I do nothing from myself, but just as the Father taught me[b], I speak these things.”
translation:
  language: pt
  text: 'Então Jesus disse: “Quando vocês elevarem[a] o Filho do Homem, então saberão que eu sou[b] e que não faço nada por mim mesmo, mas falo estas coisas conforme o Pai me ensinou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Elevar” pode se referir tanto ao ato físico de erguer quanto, no uso de João, à exaltação.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sou eu” ou “eu sou ele”. O grego diz simplesmente “eu sou” (ἐγώ εἰμι), sem predicativo expresso.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação e a consequência do diálogo anterior de modo natural em português, sem tornar a conexão excessivamente formal.
- source_word: Ὅταν
  choice: Quando
  rationale: Com o subjuntivo, aponta aqui para um acontecimento futuro específico, não para uma ação repetida.
- source_word: ὑψώσητε
  choice: elevarem
  rationale: Preserva melhor o duplo sentido joanino de levantar fisicamente e exaltar, sem restringir a expressão apenas à crucificação ou apenas à glorificação.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: É a forma consagrada e inteligível do título, preservando suas ressonâncias bíblicas e seu uso como autodesignação de Jesus.
- source_word: γνώσεσθε
  choice: saberão
  rationale: Expressa de modo conciso a futura percepção ou tomada de conhecimento anunciada por Jesus.
- source_word: ἐγώ εἰμι
  choice: eu sou
  rationale: Reproduz a expressão grega sem predicativo explícito e preserva sua solenidade, ambiguidade e possível caráter alusivo.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: por mim mesmo
  rationale: Em português corrente, comunica que Jesus não age a partir de si mesmo ou por iniciativa independente.
- source_word: ποιῶ οὐδέν
  choice: não faço nada
  rationale: Mantém o presente de caráter geral e a negação abrangente do grego.
- source_word: ἀλλὰ καθὼς ἐδίδαξέν με ὁ πατήρ
  choice: mas ... conforme o Pai me ensinou
  rationale: Conserva o contraste introduzido por ἀλλά e a correspondência indicada por καθώς, em formulação natural.
- source_word: ταῦτα λαλῶ
  choice: falo estas coisas
  rationale: Preserva o demonstrativo ταῦτα e o sentido de proferir ou falar, sem substituir o conteúdo por uma paráfrase interpretativa.
theological_decisions:
- issue: Tradução da expressão absoluta ou elíptica ἐγώ εἰμι
  choice: eu sou
  alternative: sou eu; eu sou ele
  rationale: O grego não traz predicativo expresso. A tradução principal mantém essa forma aberta, evitando decidir se a expressão é apenas uma identificação contextual ou também uma alusão à autoidentificação divina.
- issue: Sentido de ὑψώσητε no contexto joanino
  choice: elevarem
  alternative: levantarem; exaltarem; crucificarem
  rationale: “Elevarem” permite perceber tanto o ato físico de erguer Jesus na cruz quanto sua exaltação, preservando a tensão intencional do vocabulário de João.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. O plural “vocês” explicita a segunda pessoa do plural do verbo grego. A ordem das notas foi ajustada aos termos que realmente anotam, e todos os marcadores aparecem no texto principal.
