id: JHN.8.40
reference: John 8:40
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: νῦν δὲ ζητεῖτέ με ἀποκτεῖναι, ἄνθρωπον ὃς τὴν ἀλήθειαν ὑμῖν λελάληκα ἣν ἤκουσα παρὰ τοῦ θεοῦ· τοῦτο Ἀβραὰμ οὐκ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/040.yaml
  text: But now you are seeking to kill me, a man who has told you the truth that I heard from God. Abraham did not do this.
translation:
  language: pt
  text: Mas agora vocês procuram me matar, um homem que lhes disse a verdade que ouvi de Deus. Abraão não fez isso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Mas agora
  rationale: Preserva tanto o contraste marcado por δέ quanto a referência temporal de νῦν, em português natural.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: vocês procuram me matar
  rationale: Mantém o presente e a ideia de intenção ou empenho expressa por ζητέω com infinitivo, sem intensificá-la para além do texto.
- source_word: ἀποκτεῖναι
  choice: matar
  rationale: É o equivalente direto do verbo; “assassinar” acrescentaria uma qualificação moral ou jurídica não explicitada lexicalmente.
- source_word: ἄνθρωπον
  choice: um homem
  rationale: Preserva a referência masculina singular de Jesus a si mesmo e expressa naturalmente sua humanidade no contexto.
- source_word: τὴν ἀλήθειαν
  choice: a verdade
  rationale: Mantém o artigo e a referência definida ao conteúdo verdadeiro comunicado por Jesus.
- source_word: ὑμῖν λελάληκα
  choice: lhes disse
  rationale: O perfeito grego apresenta uma fala realizada com relevância presente; “lhes disse” é idiomático e claro em português.
- source_word: ἣν ἤκουσα παρὰ τοῦ θεοῦ
  choice: que ouvi de Deus
  rationale: παρά com genitivo indica aqui fonte ou origem; “de Deus” comunica isso sem especificação adicional.
- source_word: τοῦτο Ἀβραὰμ οὐκ ἐποίησεν
  choice: Abraão não fez isso
  rationale: Conserva a referência de τοῦτο e o contraste direto com a conduta de Abraão, em ordem natural no português.
theological_decisions:
- issue: A autodescrição de Jesus como ἄνθρωπον
  choice: um homem
  alternative: um ser humano
  rationale: “Um homem” preserva o sentido lexical, o gênero e a força concreta da afirmação sobre a humanidade de Jesus, sem fazer qualquer declaração redutiva sobre sua identidade.
- issue: A fonte da mensagem de Jesus em παρὰ τοῦ θεοῦ
  choice: de Deus
  alternative: do Pai
  rationale: O texto grego diz τοῦ θεοῦ. Traduzir “do Pai” importaria um título mais específico, embora coerente com outros contextos joaninos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” torna explícito o plural de ζητεῖτε; “lhes” evita repetição pesada e conserva o objeto plural. A construção mantém a tensão e a sequência argumentativa do grego sem paráfrase denominacional.
