  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς αὐτόν· Πεντήκοντα ἔτη οὔπω ἔχεις καὶ Ἀβραὰμ ἑώρακας;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/057.yaml
  text: So the Jews said to him, “You are not yet fifty years old, and you have seen Abraham?”
translation:
  language: pt
  text: 'Então, os judeus[a] lhe disseram: “Você ainda não tem cinquenta anos e viu Abraão?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os habitantes da Judeia” ou “os líderes judeus”, dependendo do alcance que João dá à expressão neste contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: É a correspondência mais direta para a designação narrativa grega. O contexto não restringe explicitamente o referente apenas às autoridades; outras possibilidades contextuais são registradas em nota.
- source_word: οὖν
  choice: Por isso
  rationale: Expressa de modo natural a conexão inferencial com a declaração anterior de Jesus.
- source_word: Πεντήκοντα ἔτη οὔπω ἔχεις
  choice: Você ainda não tem cinquenta anos
  rationale: Conserva de forma idiomática em português a expressão grega de idade construída com o verbo 'ter'.
- source_word: ἑώρακας
  choice: viu
  rationale: O perfeito grego apresenta o ato de ver como ocorrido com relevância para a situação presente. Neste contexto interrogativo, o pretérito perfeito simples é a forma natural em português.
- source_word: καὶ
  choice: e
  rationale: Mantém a conjunção aditiva do grego e, no contexto, comunica a incredulidade dos interlocutores sem explicá-la em excesso.
- source_word: Ἀβραὰμ
  choice: Abraão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Sentido de οἱ Ἰουδαῖοι no Evangelho de João
  choice: os judeus
  alternative: os judeanos; os líderes judeus
  rationale: A expressão pode ter alcance contextual variável em João, mas este versículo não identifica explicitamente apenas líderes nem exige o sentido geográfico. A tradução direta permanece no texto, e as possibilidades alternativas são preservadas em nota.
- issue: Força de ἑώρακας na pergunta
  choice: viu Abraão
  alternative: tem visto Abraão
  rationale: O português normalmente emprega o pretérito perfeito simples para perguntar se alguém viu uma pessoa no passado. 'Tem visto' sugeriria ação repetida ou continuada e distorceria o sentido; a relevância presente do perfeito grego permanece implícita na pergunta incrédula.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A pergunta conserva sua forma concisa e o tom de incredulidade do original.
