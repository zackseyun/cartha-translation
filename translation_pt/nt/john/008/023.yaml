  source_fidelity: O texto preserva adequadamente o imperfeito de ἔλεγεν em “dizia”, os pronomes explícitos e contrastivos “vocês/eu”, a construção repetida de procedência com “de”, a oposição vertical “de baixo/de cima” e a repetição enfática de “deste mundo”. Não transforma a metáfora em uma explicação moral ou doutrinária.
  naturalness: A redação é direta, moderna e bem compreensível em português de ampla circulação, com boa legibilidade brasileira. “Vocês são de baixo; eu sou de cima” mantém a concisão e o paralelismo do grego; embora possa ter associações contextuais secundárias em português, o contraste imediato e a sequência sobre “deste mundo” tornam o sentido pretendido claro sem exigir paráfrase.
  terminology: “Mundo” é a tradução natural e semanticamente ampla para κόσμος neste contexto joanino. “Deste mundo” conserva o demonstrativo e a repetição do original. A nota b esclarece o uso joanino sem impor uma definição exaustiva; a nota a oferece uma alternativa lexical compatível com as expressões substantivadas τῶν κάτω e τῶν ἄνω.
