id: JHN.8.23
reference: John 8:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγεν αὐτοῖς· Ὑμεῖς ἐκ τῶν κάτω ἐστέ, ἐγὼ ἐκ τῶν ἄνω εἰμί· ὑμεῖς ἐκ ⸂τούτου τοῦ κόσμου⸃ ἐστέ, ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/023.yaml
  text: And he was saying to them[a], “You are from below; I am from above. You are from this world[b]; I am not from this world.”
translation:
  language: pt
  text: 'E ele lhes dizia: “Vocês são de baixo[a]; eu sou de cima. Vocês são deste mundo[b]; eu não sou deste mundo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do que está embaixo”; em contraste com “do que está em cima”.
    reason: lexical_alternative
  - marker: b
    text: Em João, “mundo” muitas vezes não indica apenas a terra física, mas também a ordem humana em seu afastamento de Deus.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito grego apresenta a fala em andamento no contexto; “dizia” preserva esse aspecto e soa natural em português.
- source_word: Ὑμεῖς / ἐγώ
  choice: Vocês / eu
  rationale: Os pronomes explícitos no grego reforçam o contraste entre os interlocutores e Jesus. “Vocês” oferece leitura clara e amplamente compreensível, especialmente no português brasileiro.
- source_word: ἐκ τῶν κάτω
  choice: de baixo
  rationale: Preserva de modo conciso a imagem vertical e a noção de procedência expressa por ἐκ, sem explicitar indevidamente um sentido moral ou metafísico.
- source_word: ἐκ τῶν ἄνω
  choice: de cima
  rationale: Mantém o paralelismo direto com “de baixo” e conserva a imagem joanina de origem ou procedência.
- source_word: κόσμος
  choice: mundo
  rationale: “Mundo” é a correspondência portuguesa mais ampla e natural para κόσμος, permitindo que o contexto joanino determine suas dimensões física, humana e espiritual.
- source_word: τούτου τοῦ κόσμου / τοῦ κόσμου τούτου
  choice: deste mundo
  rationale: O demonstrativo é preservado, assim como a repetição da expressão, marcando o âmbito ao qual pertencem os ouvintes e do qual Jesus declara não proceder.
- source_word: οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου
  choice: não sou deste mundo
  rationale: A formulação conserva a construção repetida com ἐκ e sua ênfase em origem ou procedência; “não pertenço a este mundo” seria mais interpretativo.
theological_decisions:
- issue: Sentido do contraste entre “de baixo/de cima” e “deste mundo”
  choice: Preservar a linguagem de procedência e o contraste vertical sem explicar a metáfora no corpo do texto.
  alternative: Explicitar o contraste como moral, espiritual ou como oposição direta entre origem terrena e origem celestial.
  rationale: O grego estabelece um forte contraste cristológico, mas não desenvolve aqui todos os seus aspectos. A tradução conserva a tensão e evita restringir a imagem a uma única interpretação.
translation_notes:
  register: Português moderno, digno e direto, com ampla legibilidade brasileira. A repetição de “deste mundo” e o contraste “vocês/eu” foram mantidos por sua força retórica. “De baixo/de cima” é natural e preserva a concisão e a ambiguidade da imagem grega.
