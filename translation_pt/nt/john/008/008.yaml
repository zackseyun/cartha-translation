  yaml_path: translation/nt/john/008/008.yaml
  text: And again[a], he stooped down and wrote on the ground.
translation:
  language: pt
  text: E, novamente[a], abaixou-se e escreveu no chão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo faz parte da continuação do relato da mulher apanhada em adultério (João 7:53–8:11). Veja a nota em João 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: πάλιν
  choice: novamente
  rationale: Expressa a repetição da ação e se liga naturalmente ao gerúndio em português.
- source_word: κάτω κύψας
  choice: inclinando-se
  rationale: O particípio aoristo κύψας, reforçado por κάτω, descreve o ato de curvar o corpo para baixo; em português, “inclinando-se” comunica a ação com naturalidade, sem precisar do redundante “para baixo”.
- source_word: ἔγραφεν
  choice: escrevia
  rationale: O imperfeito grego apresenta a ação em curso ou continuada; “escrevia” preserva esse aspecto no contexto narrativo.
- source_word: εἰς τὴν γῆν
  choice: no chão
  rationale: Neste contexto, γῆ designa a superfície do solo diante de Jesus; “no chão” é a expressão portuguesa corrente e precisa.
theological_decisions: []
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. O imperfeito “escrevia” conserva a nuance aspectual do grego, e a posição de “novamente” evita sugerir que a repetição se aplique apenas ao ato de inclinar-se.
