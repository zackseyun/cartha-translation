id: JHN.8.10
reference: John 8:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἀνακύψας δὲ ὁ Ἰησοῦς, καὶ μηδένα θεασάμενος πλὴν τῆς γυναικός, εἶπεν αὐτῇ, Ἡ γυνή, ποῦ εἰσιν ἐκεῖνοι οἱ κατήγοροί σου; Οὐδείς σε κατέκρινεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/010.yaml
  text: Then Jesus[a] straightened up, and seeing no one except the woman, said to her, "Woman, where are those accusers of yours? Has no one condemned you?"
translation:
  language: pt
  text: 'Então Jesus[a] se endireitou e, não vendo ninguém além da mulher, perguntou-lhe: “Mulher, onde estão aqueles seus acusadores? Ninguém condenou você?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo faz parte do relato da mulher apanhada em adultério (João 7:53–8:11), ausente dos manuscritos gregos mais antigos. Veja a nota em João 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνακύψας
  choice: se endireitou
  rationale: Indica que Jesus ergueu o corpo depois de estar inclinado, escrevendo no chão; a expressão mantém a ligação física com o contexto sem afirmar que ele se levantou por completo.
- source_word: θεασάμενος
  choice: não vendo
  rationale: Expressa de modo natural a percepção visual indicada pelo particípio grego, preservando a construção negativa ligada a μηδένα.
- source_word: κατέκρινεν
  choice: condenou
  rationale: No contexto jurídico ou quase jurídico, κατακρίνω significa declarar culpado ou proferir condenação; “condenou” conserva essa força melhor que o termo mais amplo “julgou”.
- source_word: Ἡ γυνή
  choice: Mulher
  rationale: Forma direta e digna de tratamento, fiel ao vocativo grego; em seu contexto antigo, não é necessariamente áspera ou desrespeitosa.
- source_word: ἐκεῖνοι οἱ κατήγοροί σου
  choice: aqueles seus acusadores
  rationale: Preserva tanto o demonstrativo enfático ἐκεῖνοι quanto a relação expressa por σου, em português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” na pergunta por naturalidade contemporânea, sem tornar o tratamento inicial “Mulher” coloquial. A ordem e a progressão do grego foram mantidas tanto quanto possível sem produzir uma frase artificial.
