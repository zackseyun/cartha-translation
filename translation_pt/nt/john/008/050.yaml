  yaml_path: translation/nt/john/008/050.yaml
  text: But I do not seek my own glory[b][a]; there is One who seeks it and judges.
translation:
  language: pt
  text: Eu, porém, não busco a minha própria glória; há quem a busque e julgue.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «há aquele que busca e julga». O objeto implícito de «busca» é a glória de Jesus, mencionada na oração anterior.'
    reason: lexical_alternative
  - marker: b
    text: Pelo contexto, aquele que busca essa glória e julga é geralmente entendido como o Pai, embora o grego não o diga explicitamente aqui.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: Eu, porém
  rationale: O pronome explícito preserva a ênfase contrastiva, e «porém» comunica naturalmente a força adversativa de δέ.
- source_word: οὐ ζητῶ
  choice: não busco
  rationale: O presente simples é natural em português e mantém a ligação lexical com ζητῶν na oração seguinte.
- source_word: τὴν δόξαν μου
  choice: a minha própria glória
  rationale: «Glória» preserva o campo semântico de δόξα, enquanto «própria» torna natural em português a ênfase na recusa de buscar glória para si.
- source_word: ἔστιν ὁ ζητῶν
  choice: há quem a busque
  rationale: A formulação portuguesa reproduz de modo idiomático a construção existencial com o particípio substantivado. O pronome «a» explicita o objeto subentendido — a glória de Jesus — sem identificar o sujeito não nomeado.
- source_word: καὶ κρίνων
  choice: e julgue
  rationale: O subjuntivo é exigido em português pela construção indefinida «há quem», sem alterar a afirmação indicativa do grego; «julgue» preserva o sentido forense de κρίνω no contexto.
theological_decisions:
- issue: Identidade daquele que busca a glória de Jesus e julga
  choice: 'O texto principal mantém o sujeito sem nome: «há quem».'
  alternative: «Há o Pai, que a busca e julga.»
  rationale: O contexto aponta comumente para o Pai, mas o grego não o identifica de forma explícita neste versículo. A tradução preserva essa contenção e não resolve silenciosamente a referência.
- issue: Objeto de «busque»
  choice: O pronome «a» retoma «a minha própria glória».
  alternative: «há aquele que busca e julga», sem objeto expresso
  rationale: O objeto está implícito no grego e é recuperado da oração anterior. Explicitar essa retomada torna o português claro sem acrescentar uma nova ideia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Eu, porém» conserva a ênfase; «há quem» soa natural, preserva o sujeito não nomeado e evita inserir «o Pai» no texto principal.
