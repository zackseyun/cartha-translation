id: JHN.8.41
reference: John 8:41
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑμεῖς ποιεῖτε τὰ ἔργα τοῦ πατρὸς ὑμῶν. ⸀εἶπαν αὐτῷ· Ἡμεῖς ἐκ πορνείας ⸂οὐ γεγεννήμεθα⸃· ἕνα πατέρα ἔχομεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/041.yaml
  text: You are doing the works of your father.” They said to him[a], “We were not born of sexual immorality; we have one Father—God.”
translation:
  language: pt
  text: 'Vocês fazem as obras do pai de vocês”. Eles lhe disseram[a]: “Nós não nascemos de imoralidade sexual; temos um só Pai: Deus”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nós não somos filhos ilegítimos”. O grego diz literalmente: “Nós não nascemos de imoralidade sexual”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖτε
  choice: fazem
  rationale: O presente do indicativo descreve a ação atual e característica; em português, o presente simples é mais natural que uma forma progressiva neste contexto.
- source_word: τὰ ἔργα
  choice: as obras
  rationale: Preserva o sentido comum de ἔργα e a ligação verbal com ποιεῖτε, além de manter a linguagem joanina.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: do pai de vocês
  rationale: Mantém a imagem relacional e metafórica de πατήρ sem explicitar prematuramente a identidade do pai.
- source_word: ἐκ πορνείας
  choice: de imoralidade sexual
  rationale: Traduz de perto a construção grega e conserva sua formulação deliberadamente forte, sem reduzi-la no texto principal à ideia interpretativa de ilegitimidade.
- source_word: οὐ γεγεννήμεθα
  choice: não nascemos
  rationale: O perfeito passivo é expresso de modo idiomático em português pelo pretérito perfeito na declaração sobre o nascimento.
- source_word: ἕνα πατέρα ἔχομεν
  choice: temos um só Pai
  rationale: “Um só” comunica naturalmente a ênfase de ἕνα na unicidade; a inicial maiúscula sinaliza que o referente é Deus.
- source_word: τὸν θεόν
  choice: Deus
  rationale: A aposição identifica Deus como o único Pai; os dois-pontos tornam essa identificação clara e natural em português.
theological_decisions:
- issue: Se a negação de terem nascido ἐκ πορνείας deve ser explicitada como reivindicação de filiação legítima
  choice: Manter no texto principal “não nascemos de imoralidade sexual”
  alternative: “não somos filhos ilegítimos”
  rationale: A alternativa expressa uma implicação provável do idioma, mas a formulação literal conserva a ambiguidade e a possível carga polêmica sem resolver além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa e preserva a tensão metafórica em torno da paternidade.
