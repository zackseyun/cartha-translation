source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἀβραάμ, ὅστις ἀπέθανεν; καὶ οἱ προφῆται ἀπέθανον· τίνα ⸀σεαυτὸν ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/053.yaml
  text: Surely you are not greater than our father Abraham[a], who died? The prophets also died[b]. Who do you make yourself out to be?
translation:
  language: pt
  text: Por acaso você é maior do que o nosso pai Abraão, que morreu? Os profetas também morreram. Quem você afirma ser?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem você se declara ser?” A expressão grega pergunta que identidade ou posição alguém atribui a si mesmo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: Por acaso você é
  rationale: A formulação interrogativa com μή espera resposta negativa. Em português, “Por acaso você é...?” transmite naturalmente a incredulidade e o tom de desafio sem transformar a pergunta em afirmação.
- source_word: μείζων
  choice: maior
  rationale: Mantém o sentido comparativo amplo, que pode envolver posição, importância e autoridade, sem especificar indevidamente uma dessas nuances.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: do que o nosso pai Abraão
  rationale: O genitivo de comparação é expresso naturalmente por “do que”; “nosso pai Abraão” preserva a reivindicação ancestral e o caráter honorífico da expressão.
- source_word: ὅστις ἀπέθανεν
  choice: que morreu
  rationale: Expressa diretamente o fato histórico indicado pelo aoristo, sem acrescentar uma nuance aspectual desnecessária.
- source_word: καὶ οἱ προφῆται ἀπέθανον
  choice: Os profetas também morreram
  rationale: '“Também” preserva a adição paralela de καί: Abraão morreu, e os profetas igualmente morreram.'
- source_word: τίνα σεαυτὸν ποιεῖς
  choice: Quem você pretende ser?
  rationale: Reproduz em português corrente o sentido idiomático de apresentar-se ou alegar ser alguém, conservando o tom acusatório. Uma tradução estritamente literal seria pouco natural.
theological_decisions:
- issue: Desafio retórico ao status de Jesus em relação a Abraão e aos profetas
  choice: Formular a pergunta como uma contestação incrédula que espera resposta negativa.
  alternative: “Você é maior do que o nosso pai Abraão...?”
  rationale: μή marca a expectativa de uma resposta negativa. “Por acaso” preserva essa força retórica e a tensão sobre a identidade de Jesus, sem inserir na fala uma resolução doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” corresponde ao singular explícito σύ e sustenta o confronto direto. “Por acaso” comunica a expectativa negativa da pergunta sem recorrer a uma construção excessivamente literal. A nota registra a forma mais próxima do grego para o último enunciado.
