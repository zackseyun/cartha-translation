  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Κἂν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἀληθής ἐστιν ἡ μαρτυρία μου, ὅτι οἶδα πόθεν ἦλθον καὶ ποῦ ὑπάγω· ὑμεῖς δὲ οὐκ οἴδατε πόθεν ἔρχομαι ⸀ἢ ποῦ ὑπάγω.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/014.yaml
  text: Jesus answered and said to them[a], “Even if I testify about myself, my testimony is true, because I know where I came from and where I am going[b]; but you do not know where I come from or where I am going.”
translation:
  language: pt
  text: 'Jesus lhes respondeu: “Mesmo que eu dê testemunho de mim mesmo[a], meu testemunho é verdadeiro, porque sei de onde vim e para onde vou. Vocês, porém, não sabem de onde venho ou para onde vou[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu testemunhe a respeito de mim mesmo”.'
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos trazem “e para onde vou” em vez de “ou para onde vou”.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν αὐτοῖς
  choice: lhes respondeu
  rationale: A combinação idiomática grega de ‘responder’ e ‘dizer’ introduz a fala. Em português atual, ‘lhes respondeu’ comunica naturalmente a fórmula sem a redundância pouco idiomática de ‘respondeu e disse-lhes’.
- source_word: Κἂν
  choice: Mesmo que
  rationale: 'Expressa com clareza a força concessiva da construção: Jesus admite a hipótese para desenvolver o argumento, sem conceder que seu testemunho seja falso ou inválido.'
- source_word: μαρτυρῶ περὶ ἐμαυτοῦ
  choice: eu dê testemunho de mim mesmo
  rationale: Preserva o campo semântico de testemunho, importante no contexto joanino, e traduz περί de modo direto, sem acrescentar a ideia mais específica de agir ‘em defesa própria’.
- source_word: ἀληθής ... ἡ μαρτυρία μου
  choice: meu testemunho é verdadeiro
  rationale: ‘Verdadeiro’ conserva tanto a afirmação de veracidade quanto sua ressonância temática em João; ‘válido’ limitaria indevidamente o sentido ao âmbito jurídico.
- source_word: ὅτι οἶδα
  choice: porque sei
  rationale: Apresenta de forma natural a razão explícita dada por Jesus para a veracidade de seu testemunho.
- source_word: πόθεν ἦλθον καὶ ποῦ ὑπάγω
  choice: de onde vim e para onde vou
  rationale: Distingue naturalmente em português a origem indicada pelo aoristo ἦλθον e o destino indicado pelo presente ὑπάγω.
- source_word: ὑμεῖς δὲ οὐκ οἴδατε
  choice: Vocês, porém, não sabem
  rationale: Mantém o pronome explícito e enfático, bem como o contraste marcado por δέ. ‘Vocês’ oferece ampla legibilidade brasileira sem perder dignidade.
- source_word: πόθεν ἔρχομαι ἢ ποῦ ὑπάγω
  choice: de onde venho ou para onde vou
  rationale: Conserva a conjunção disjuntiva ἢ do texto principal e permite representar com precisão a variante textual καί (‘e’).
theological_decisions:
- issue: Natureza do testemunho que Jesus dá sobre si mesmo
  choice: Afirmar que seu testemunho é verdadeiro por causa de seu conhecimento da própria origem e destino
  alternative: Traduzir o testemunho como juridicamente ‘válido’ ou explicitar no versículo uma origem celestial
  rationale: O texto afirma diretamente a veracidade do testemunho e a fundamenta no conhecimento singular de Jesus. A tradução preserva essa afirmação e deixa que suas implicações cristológicas sejam desenvolvidas pelo contexto de João, sem inserir formulações posteriores.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem e as conexões do grego foram preservadas quando naturais; a fórmula narrativa redundante foi vertida de modo idiomático. A pontuação separa a fundamentação do testemunho do contraste enfático com os interlocutores.
