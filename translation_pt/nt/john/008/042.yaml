id: JHN.8.42
reference: John 8:42
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν ἠγαπᾶτε ἂν ἐμέ, ἐγὼ γὰρ ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω· οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα, ἀλλ’ ἐκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/042.yaml
  text: Jesus said to them[a], “If God were your Father, you would love me, because I came from God and am here. For I have not come from myself[b], but he sent me.”
translation:
  language: pt
  text: 'Jesus lhes disse: “Se Deus fosse o Pai de vocês, vocês me amariam, porque vim de Deus e estou aqui.[a] Pois não vim de mim mesmo,[b] mas foi ele quem me enviou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “porque saí de Deus e vim”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Pois não vim por minha própria iniciativa”. O grego pode enfatizar tanto a origem (“de mim mesmo”) quanto a iniciativa independente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ ... ἦν ... ἠγαπᾶτε ἂν
  choice: Se Deus fosse o Pai de vocês, vocês me amariam
  rationale: A construção com εἰ, imperfeito e ἄν expressa uma condição contrária à realidade. O imperfeito do subjuntivo e o futuro do pretérito comunicam isso naturalmente em português.
- source_word: θεὸς πατὴρ ὑμῶν
  choice: Deus fosse o Pai de vocês
  rationale: A formulação apresenta Deus como Pai dos interlocutores. A inicial maiúscula trata “Pai” como título relacional divino.
- source_word: ἠγαπᾶτε
  choice: vocês me amariam
  rationale: “Amariam” traduz de modo idiomático o valor potencial do imperfeito com ἄν, enquanto “me” preserva o objeto expresso por ἐμέ.
- source_word: ἐγὼ γὰρ
  choice: porque
  rationale: γάρ introduz a razão pela qual eles amariam Jesus se Deus fosse de fato o Pai deles; “porque” torna clara essa relação causal em português atual.
- source_word: ἐκ τοῦ θεοῦ ἐξῆλθον
  choice: vim de Deus
  rationale: A expressão indica origem ou procedência. “Vim de Deus” é natural e preserva a afirmação sem introduzir terminologia teológica técnica posterior.
- source_word: καὶ ἥκω
  choice: e estou aqui
  rationale: ἥκω pode destacar a chegada com seu resultado presente. “Estou aqui” comunica de maneira idiomática esse estado atual.
- source_word: οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα
  choice: Pois não vim de mim mesmo
  rationale: A tradução mantém a linguagem de origem e o paralelo com “vim de Deus”. A nota registra a possível ênfase na ausência de iniciativa independente.
- source_word: ἀλλ’ ἐκεῖνός με ἀπέστειλεν
  choice: mas foi ele quem me enviou
  rationale: A construção clivada reproduz com naturalidade a ênfase de ἐκεῖνος, cujo referente é Deus, e “enviou” preserva a linguagem de missão de ἀποστέλλω.
theological_decisions:
- issue: A linguagem sobre a origem de Jesus sem especificar categorias doutrinárias posteriores
  choice: vim de Deus e estou aqui
  alternative: saí de Deus e vim
  rationale: O texto afirma a origem divina e a missão de Jesus, mas emprega verbos comuns de sair, vir e estar presente. A tradução principal preserva a afirmação com naturalidade, sem transformar “proceder” em termo técnico; uma forma mais próxima da estrutura grega aparece na nota.
- issue: O sentido de ἀπ’ ἐμαυτοῦ
  choice: não vim de mim mesmo
  alternative: não vim por minha própria iniciativa
  rationale: A expressão pode salientar tanto a fonte quanto a iniciativa independente. A opção principal conserva o paralelo de origem com “de Deus”, e a nota explicita a outra nuance legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” evita a ambiguidade regional de “vós” e representa claramente o plural. Os conectivos distinguem a explicação causal (“porque”) da fundamentação seguinte (“Pois”).
