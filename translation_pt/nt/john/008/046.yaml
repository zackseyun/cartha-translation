  text: τίς ἐξ ὑμῶν ἐλέγχει με περὶ ἁμαρτίας; ⸀εἰ ἀλήθειαν λέγω, διὰ τί ὑμεῖς οὐ πιστεύετέ μοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/046.yaml
  text: Which one of you convicts me of sin? If I speak the truth[c][b][a], why do you not believe me?
translation:
  language: pt
  text: Quem de vocês pode provar que sou culpado de pecado?[a] Se digo a verdade, por que vocês não acreditam em mim?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem de vocês me convence de pecado?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por que vocês não confiam em mim?” O grego pode incluir tanto acreditar no que alguém diz quanto confiar nessa pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς ἐξ ὑμῶν
  choice: Quem de vocês
  rationale: Expressa de modo natural e direto a pergunta sobre quem, dentre os ouvintes, poderia sustentar a acusação.
- source_word: ἐλέγχει
  choice: pode provar que sou culpado
  rationale: O verbo pode significar expor, demonstrar culpa ou convencer de culpa. Nesta contestação de tom forense, a formulação comunica claramente a ideia de estabelecer uma acusação, sem sugerir apenas repreensão.
- source_word: περὶ ἁμαρτίας
  choice: de pecado
  rationale: A construção com περί e genitivo indica aquilo a respeito do qual se demonstraria culpa. Em português, 'culpado de pecado' é conciso e preserva o alcance geral do singular ἁμαρτίας.
- source_word: εἰ ἀλήθειαν λέγω
  choice: Se digo a verdade
  rationale: Mantém a forma condicional de εἰ, sem convertê-la interpretativamente em 'já que', e reproduz com naturalidade a expressão grega.
- source_word: διὰ τί
  choice: por que
  rationale: Equivalente interrogativo corrente para uma pergunta sobre a razão.
- source_word: πιστεύετέ μοι
  choice: creem em mim
  rationale: πιστεύω com dativo pode envolver acreditar no que alguém diz e confiar nessa pessoa. 'Creem em mim' preserva de modo conciso ambas as dimensões possíveis no contexto joanino.
theological_decisions:
- issue: Força retórica da alegação de Jesus quanto ao pecado e à verdade
  choice: Manter as duas perguntas como desafios diretos, sem explicitar além do texto a conclusão implícita.
  alternative: 'Parafrasear: ''Algum de vocês consegue provar que cometi algum pecado?'' ou transformar ''se'' em ''já que''.'
  rationale: A redação conserva a forte alegação implícita do versículo e sua tensão retórica, sem acrescentar uma formulação doutrinária nem resolver o valor condicional de εἰ.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Vocês' traduz o plural ὑμεῖς de maneira natural. A formulação evita o juridiquês de 'condenar' e conserva a ambiguidade de πιστεύω por meio de nota.
