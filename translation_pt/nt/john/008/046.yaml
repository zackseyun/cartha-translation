  source_fidelity: A primeira pergunta comunica adequadamente o desafio forense de ἐλέγχει με περὶ ἁμαρτίας. Na segunda, porém, «creem em mim» em português tende mais especificamente a significar fé em uma pessoa, enquanto πιστεύετε μοι, com dativo, também preserva de modo imediato o sentido de aceitar o que Jesus diz. «Acreditam em mim» reproduz melhor essa amplitude sem resolver a ambiguidade.
  naturalness: O texto é claro, moderno e apropriado ao registro do evangelho. «Acreditam em mim» é mais idiomático neste contexto para a pergunta dirigida aos interlocutores e se harmoniza melhor com a nota.
  terminology: «Provar que sou culpado de pecado» expressa de forma natural a força de ἐλέγχει no desafio de caráter forense. «Pecado» e «verdade» estão adequados. A substituição de «creem» por «acreditam» evita estreitar πιστεύω a uma formulação de fé religiosa.
