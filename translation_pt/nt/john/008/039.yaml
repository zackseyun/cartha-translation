  text: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν. λέγει αὐτοῖς ὁ Ἰησοῦς· Εἰ τέκνα τοῦ Ἀβραάμ ⸀ἐστε, τὰ ἔργα τοῦ Ἀβραὰμ ⸀ἐποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/039.yaml
  text: They answered and said to him[a], “Abraham is our father.” Jesus says to them, “If you are Abraham’s children, you would be doing Abraham’s works.”
translation:
  language: pt
  text: 'Eles responderam e lhe disseram: “Abraão é nosso pai.” Jesus lhes diz: “Se vocês são filhos de Abraão, estariam fazendo as obras de Abraão.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se vocês fossem filhos de Abraão, fariam as obras de Abraão.” O verbo grego no imperfeito pode ser entendido como parte de uma condição contrária aos fatos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Eles responderam e lhe disseram
  rationale: Mantém a formulação joanina com os dois verbos, distinguindo a resposta do ato de falar, sem deixar a frase incompreensível em português.
- source_word: Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν
  choice: Abraão é nosso pai
  rationale: Expressa de modo natural e enfático a alegação de vínculo paterno com Abraão.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Jesus lhes diz
  rationale: Preserva o presente histórico do grego e sua vivacidade narrativa.
- source_word: τέκνα τοῦ Ἀβραάμ
  choice: filhos de Abraão
  rationale: Conserva a linguagem de relação filial; no uso português, o plural masculino pode abranger homens e mulheres, enquanto “descendentes” reduziria a dimensão relacional.
- source_word: τὰ ἔργα τοῦ Ἀβραὰμ
  choice: as obras de Abraão
  rationale: Mantém o termo concreto “obras” e o contraste joanino entre a filiação reivindicada e a conduta efetiva.
- source_word: ἐποιεῖτε
  choice: estariam fazendo
  rationale: Representa o imperfeito no contexto condicional como ação esperada, mas não realizada, preservando a tensão com a prótase no presente.
theological_decisions:
- issue: Natureza da filiação a Abraão na resposta de Jesus
  choice: Manter literalmente a linguagem filial e deixar que o contraste com as obras revele a tensão.
  alternative: Explicitar “descendência espiritual” ou entender a frase como negação direta da descendência física.
  rationale: O versículo contrapõe a alegação de que Abraão é pai deles à ausência das obras de Abraão, mas não formula por si só uma doutrina completa sobre descendência física e filiação espiritual.
- issue: Força da condição expressa por ἐστε e ἐποιεῖτε
  choice: “Se vocês são... estariam fazendo”, com nota sobre a leitura contrária aos fatos.
  alternative: “Se vocês fossem... fariam” ou “Se vocês são... façam”.
  rationale: A formulação principal procura refletir a combinação do presente ἐστε com o imperfeito ἐποιεῖτε no texto fornecido, sem apagar sua tensão gramatical; a nota oferece a formulação idiomática que entende a condição como contrária aos fatos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. O presente histórico “diz” e a repetição “responderam e disseram” foram mantidos para conservar traços narrativos do grego. A construção condicional deliberadamente preserva a tensão da forma grega, esclarecida em nota.
