  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ· Ποῦ ἐστιν ὁ πατήρ σου; ἀπεκρίθη Ἰησοῦς· Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου· εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/019.yaml
  text: So they were saying to him[a], “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”
translation:
  language: pt
  text: 'Então lhe perguntavam: “Onde está o seu Pai?” Jesus respondeu: “Vocês não conhecem nem a mim nem o meu Pai. Se me conhecessem, conheceriam também o meu Pai.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: perguntavam
  rationale: O imperfeito sugere ação em andamento ou repetida. Em português, “perguntavam” preserva esse aspecto e, diante de uma pergunta direta, expressa naturalmente o ato de fala sem exagerar a repetição.
- source_word: οὖν
  choice: Então
  rationale: Mantém a conexão com o discurso anterior de modo natural no português contemporâneo; “portanto” daria à ligação um tom inferencial mais forte e formal.
- source_word: Ποῦ ἐστιν ὁ πατήρ σου;
  choice: Onde está o seu Pai?
  rationale: Tradução direta da pergunta. A inicial maiúscula sinaliza que o referente pretendido no contexto joanino é Deus, sem alterar o conteúdo lexical.
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: Equivalente narrativo padrão, claro e idiomático.
- source_word: Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου
  choice: Vocês não conhecem nem a mim nem o meu Pai
  rationale: A construção “não... nem... nem” reproduz naturalmente em português a coordenação negativa οὔτε...οὔτε. “Conhecem” preserva a amplitude de οἶδα, que pode abranger conhecimento e reconhecimento relacional.
- source_word: οἶδατε / ᾔδειτε
  choice: conhecem / conhecessem / conheceriam
  rationale: “Conhecer” mantém a continuidade lexical e é mais adequado para pessoas do que “saber”, sem reduzir o sentido a mero entendimento intelectual ou reconhecimento visual.
- source_word: εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ἂν ᾔδειτε
  choice: Se me conhecessem, conheceriam também o meu Pai
  rationale: O imperfeito com ἄν exprime uma condição irreal relativa ao presente. O imperfeito do subjuntivo e o futuro do pretérito comunicam essa força com clareza e naturalidade; “também” representa καί.
- source_word: πατήρ / πατέρα μου
  choice: Pai / meu Pai
  rationale: A maiúscula identifica graficamente Deus como referente no contexto, sem acrescentar uma designação ausente do grego.
theological_decisions:
- issue: Uso de maiúscula em “Pai” como referência a Deus
  choice: “Pai” com inicial maiúscula em todas as ocorrências
  alternative: “pai” com inicial minúscula
  rationale: O contexto identifica o Pai de Jesus como Deus. A maiúscula auxilia o leitor moderno a perceber o referente pretendido, embora a pergunta dos interlocutores revele que eles não o compreendem.
- issue: Sentido de conhecer Jesus e o Pai
  choice: Manter o verbo amplo “conhecer”
  alternative: Usar “reconhecer” ou “compreender”
  rationale: “Conhecer” preserva a relação teológica estabelecida entre conhecer Jesus e conhecer o Pai, sem decidir se o enfoque é reconhecimento, compreensão intelectual ou conhecimento relacional.
- issue: Força da condição final
  choice: 'Expressar uma condição irreal no presente: “Se me conhecessem, conheceriam...”'
  alternative: 'Expressar anterioridade: “Se me tivessem conhecido, teriam conhecido...”'
  rationale: A construção grega admite forte sentido contrário aos fatos; neste contexto, as formas portuguesas escolhidas apresentam essa irrealidade como situação presente, sem introduzir desnecessariamente uma referência temporal passada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa, favorecendo a legibilidade brasileira sem regionalismo marcado. A ordem e a repetição de “meu Pai” conservam a ênfase do texto grego.
