  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἡ δὲ εἶπεν, Οὐδείς, κύριε. Εἶπεν δὲ ὁ Ἰησοῦς, Οὐδὲ ἐγώ σε κατακρίνω· πορεύου, καὶ μηκέτι ἁμάρτανε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/011.yaml
  text: She[a] said, "No one, Lord." And Jesus said, "Neither do I condemn you; go, and sin no more."
translation:
  language: pt
  text: 'Ela[a] disse: “Ninguém, Senhor.” Então Jesus lhe disse: “Eu também não a condeno. Vá e, de agora em diante, não peque mais.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Versículo final do relato da mulher apanhada em adultério (João 7:53–8:11). Veja a nota em João 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: κύριε
  choice: Senhor
  rationale: O vocativo pode funcionar como tratamento respeitoso, mas “Senhor” preserva tanto a naturalidade da resposta quanto o reconhecimento da autoridade de Jesus, sem eliminar a possível profundidade cristológica.
- source_word: κατακρίνω
  choice: condeno
  rationale: Expressa com precisão o sentido judicial de proferir condenação contra alguém e se ajusta ao contexto da acusação e da pena pretendida.
- source_word: μηκέτι
  choice: de agora em diante, não... mais
  rationale: Torna explícita, em português natural, a orientação temporal de cessar o pecado a partir daquele momento.
- source_word: ἁμάρτανε
  choice: peque
  rationale: O presente imperativo com μηκέτι comunica a ordem de não continuar ou voltar a pecar; “não peque mais” reproduz esse sentido de modo claro e digno.
- source_word: πορεύου
  choice: Vá
  rationale: Equivalente direto e idiomático do imperativo, adequado ao português moderno.
theological_decisions:
- issue: Força do tratamento κύριε
  choice: Senhor
  alternative: senhor / mestre
  rationale: “Senhor” mantém a ambiguidade entre um tratamento respeitoso e uma confissão mais profunda da autoridade de Jesus, sem decidir além do que o contexto exige.
- issue: Relação entre graça e chamado ao abandono do pecado
  choice: Preservar lado a lado “não a condeno” e “não peque mais”
  alternative: Parafrasear de modo a subordinar uma declaração à outra
  rationale: O grego mantém em tensão a recusa de Jesus em condená-la e sua ordem de abandonar o pecado; a tradução não deve atenuar nenhum dos dois elementos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ela respondeu” explicita naturalmente a mudança de falante; “lhe disse” conserva o destinatário. A pontuação divide as duas ordens finais para fluidez sem alterar sua relação no grego.
