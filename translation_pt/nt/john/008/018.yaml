id: JHN.8.18
reference: John 8:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ μαρτυρῶν περὶ ἐμαυτοῦ καὶ μαρτυρεῖ περὶ ἐμοῦ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/018.yaml
  text: I am the one who testifies about myself[a], and the Father who sent me testifies about me.
translation:
  language: pt
  text: Eu sou quem dá testemunho a respeito de mim mesmo,[a] e o Pai que me enviou dá testemunho a meu respeito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “testemunha a respeito de mim mesmo [...] testemunha a meu respeito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ εἰμι ὁ μαρτυρῶν
  choice: Eu sou quem dá testemunho
  rationale: O particípio presente com artigo tem função substantivada, literalmente “aquele que dá testemunho”. A formulação escolhida é natural em português e mantém a ênfase do pronome ἐγώ.
- source_word: περὶ ἐμαυτοῦ
  choice: a respeito de mim mesmo
  rationale: περί com genitivo significa aqui “a respeito de/sobre”. A expressão preserva a força reflexiva de ἐμαυτοῦ sem impor a ideia mais interpretativa de testemunhar “em favor” de si mesmo.
- source_word: μαρτυρεῖ
  choice: dá testemunho
  rationale: A repetição da mesma expressão conserva a ligação lexical e o caráter jurídico-testemunhal de μαρτυρέω no contexto.
- source_word: περὶ ἐμοῦ
  choice: a meu respeito
  rationale: Equivalente português natural de περί com genitivo, mantendo o paralelismo semântico com a primeira oração.
- source_word: ὁ πέμψας με πατήρ
  choice: o Pai que me enviou
  rationale: O particípio aoristo com artigo modifica πατήρ e é naturalmente expresso por uma oração relativa. Não se acrescenta “meu”, pois isso não está explícito no grego.
theological_decisions:
- issue: Referência de “o Pai” no contexto joanino
  choice: o Pai
  alternative: meu Pai; Deus Pai
  rationale: A tradução preserva a designação do texto grego e sua afirmação relacional e teológica, sem acrescentar explicações doutrinárias ausentes do versículo.
- issue: Força jurídica da linguagem de testemunho
  choice: dá testemunho
  alternative: testifica; testemunha
  rationale: “Dar testemunho” é corrente, digno e claro em português, além de preservar o motivo testemunhal do Evangelho de João e a repetição do mesmo verbo grego.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. A redação mantém tom digno, paralelismo entre as duas testemunhas e a linguagem forense do contexto, sem expansão denominacional.
