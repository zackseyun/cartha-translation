translation:
  language: pt
  text: '[a] Na nossa Lei, Moisés ordenou que mulheres assim fossem apedrejadas. E você, o que diz?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Continuação do relato da mulher apanhada em adultério (João 7:53–8:11). Veja a nota em João 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἐν δὲ τῷ νόμῳ ἡμῶν
  choice: Na nossa Lei
  rationale: Expressa naturalmente o âmbito da Lei mosaica; o δέ funciona como conexão discursiva e não exige uma palavra inicial separada em português.
- source_word: τὰς τοιαύτας
  choice: mulheres assim
  rationale: O acusativo feminino plural retoma mulheres do tipo mencionado no contexto, sem acrescentar uma caracterização além do grego.
- source_word: λιθοβολεῖσθαι
  choice: fossem apedrejadas
  rationale: O infinitivo passivo designa a pena de apedrejamento; a construção com subjuntivo é idiomática após «ordenou que».
- source_word: ἐνετείλατο
  choice: ordenou
  rationale: Preserva a força de uma determinação autoritativa atribuída a Moisés.
- source_word: σὺ οὖν τί λέγεις;
  choice: E você, o que diz?
  rationale: Mantém a ênfase explícita em «você» e traduz οὖν por uma ligação conclusiva natural, sem tornar a pergunta excessivamente formal.
