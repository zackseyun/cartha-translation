  text: ὁ δὲ δοῦλος οὐ μένει ἐν τῇ οἰκίᾳ εἰς τὸν αἰῶνα· ⸀ὁ υἱὸς μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/035.yaml
  text: The slave does not remain in the household forever[b][a]; the son remains forever.
translation:
  language: pt
  text: O escravo[a] não permanece na casa para sempre; o filho[b] permanece para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «servo»; o termo grego pode ter ambos os sentidos, mas «escravo» preserva melhor aqui o contraste de condição dentro da casa.
    reason: lexical_alternative
  - marker: b
    text: No contexto, «o filho» também pode conter uma referência implícita a Jesus, embora a frase tenha forma de provérbio.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: escravo
  rationale: Preserva o contraste de condição social e pertencimento entre o escravo e o filho. «Servo» poderia atenuar indevidamente a falta de posição permanente indicada pelo contexto.
- source_word: μένει
  choice: permanece
  rationale: Mantém a repetição do verbo grego nas duas orações e expressa continuidade de modo natural e digno em português.
- source_word: οἰκία
  choice: casa
  rationale: Em português, «casa» pode designar tanto a residência quanto a unidade familiar, preservando a imagem concreta e a dimensão de pertencimento presentes no provérbio.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É a expressão idiomática mais clara para a permanência duradoura indicada pela locução grega, repetida nas duas orações.
- source_word: υἱός
  choice: filho
  rationale: Conserva o masculino singular e o contraste específico de condição dentro da casa, além da possível ressonância cristológica no contexto.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: O contraste já é comunicado com clareza pela estrutura paralela das duas orações; acrescentar «agora» introduziria uma ideia temporal ausente, e «mas» antes da primeira oração soaria artificial neste versículo isolado.
theological_decisions:
- issue: Possível ressonância cristológica de «o filho»
  choice: «o filho», em minúscula
  alternative: «o Filho», como título cristológico explícito
  rationale: A frase tem forma proverbial sobre a condição de alguém dentro da casa, mas no contexto também prepara a referência de Jesus ao Filho no versículo seguinte. A minúscula preserva essa tensão sem tornar explícito aqui o que o grego deixa implícito.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O paralelismo conciso e a repetição de «permanece para sempre» foram preservados.
