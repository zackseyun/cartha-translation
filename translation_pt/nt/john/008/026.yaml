id: JHN.8.26
reference: John 8:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πολλὰ ἔχω περὶ ὑμῶν λαλεῖν καὶ κρίνειν· ἀλλ’ ὁ πέμψας με ἀληθής ἐστιν, κἀγὼ ἃ ἤκουσα παρ’ αὐτοῦ ταῦτα ⸀λαλῶ εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/026.yaml
  text: I have many things to say and to judge concerning you[a]. But the one who sent me is true, and what I heard from him[b], these things I speak to the world.
translation:
  language: pt
  text: Tenho muitas coisas a dizer e a julgar a respeito de vocês[a]. Mas aquele que me enviou é verdadeiro, e aquilo que ouvi dele, isso digo ao mundo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre vocês”.
    reason: lexical_alternative
  - marker: b
    text: O grego retoma enfaticamente “aquilo que ouvi” com o demonstrativo “isso”.
    reason: source_emphasis
lexical_decisions:
- source_word: πολλὰ
  choice: muitas coisas
  rationale: O adjetivo neutro plural é usado substantivamente; “muitas coisas” preserva a pluralidade e soa natural em português.
- source_word: περὶ ὑμῶν
  choice: a respeito de vocês
  rationale: περί com genitivo indica referência ou assunto. A expressão é clara, corrente e mantém o tom solene sem arcaísmo.
- source_word: λαλεῖν
  choice: a dizer
  rationale: No primeiro par de infinitivos, “dizer” é natural ao lado de “julgar” e representa adequadamente a atividade verbal.
- source_word: κρίνειν
  choice: a julgar
  rationale: Preserva o campo semântico amplo de κρίνω, sem restringi-lo indevidamente a “condenar”.
- source_word: ὁ πέμψας με
  choice: aquele que me enviou
  rationale: Reproduz o particípio substantivado de modo natural e não explicita “o Pai”, substantivo ausente no grego.
- source_word: ἀληθής
  choice: verdadeiro
  rationale: Mantém tanto a ideia de veracidade quanto a ressonância joanina de ser verdadeiro ou genuíno, sem estreitar o sentido a “confiável”.
- source_word: ἃ ἤκουσα παρ’ αὐτοῦ
  choice: aquilo que ouvi dele
  rationale: Expressa naturalmente em português o conteúdo recebido daquele que o enviou.
- source_word: ταῦτα
  choice: isso
  rationale: Retém o demonstrativo retomador explícito e sua ênfase. O singular neutro português retoma naturalmente o conteúdo coletivo de “aquilo que ouvi”.
- source_word: λαλῶ
  choice: anuncio
  rationale: No contexto de comunicação pública dirigida ao mundo, “anuncio” transmite a fala proclamada de modo natural, sem alterar seu conteúdo.
- source_word: εἰς τὸν κόσμον
  choice: ao mundo
  rationale: Com verbo de comunicação, εἰς indica a direção ou os destinatários da fala; “ao mundo” é idiomático e fiel.
theological_decisions:
- issue: Referente de “aquele que me enviou”
  choice: O referente implícito é preservado sem inserir “o Pai” no texto.
  alternative: Mas o Pai, que me enviou, é verdadeiro.
  rationale: O contexto joanino identifica o referente, mas o grego emprega uma expressão participial e não nomeia explicitamente o Pai neste versículo.
- issue: Força de κρίνειν
  choice: julgar
  alternative: condenar
  rationale: “Julgar” preserva a amplitude semântica do verbo e evita impor o sentido mais estreito de condenação.
- issue: Repetição enfática de ἃ ... ταῦτα
  choice: aquilo que ouvi dele, isso anuncio
  alternative: anuncio ao mundo aquilo que ouvi dele
  rationale: A formulação conserva a retomada demonstrativa enfática do grego, ainda que uma redação portuguesa mais fluida pudesse omiti-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural ὑμῶν. A sintaxe marcada da última oração foi mantida para preservar a ênfase do original; “anuncio” evita a repetição pouco elegante de “dizer” e comunica a fala pública dirigida ao mundo.
