id: JHN.8.59
reference: John 8:59
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἦραν οὖν λίθους ἵνα βάλωσιν ἐπ’ αὐτόν· Ἰησοῦς δὲ ἐκρύβη καὶ ἐξῆλθεν ἐκ τοῦ ⸀ἱεροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/059.yaml
  text: So they picked up stones to throw at him[a], but Jesus hid himself and went out of the temple.
translation:
  language: pt
  text: Então pegaram pedras para atirar nele, mas Jesus se ocultou e saiu do templo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais precisamente, “saiu do recinto do templo” ou “dos pátios do templo”; o termo grego ἱερόν se refere ao complexo do templo, e não ao santuário interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: pegaram
  rationale: No contexto, αἴρω descreve tomar pedras nas mãos com a intenção de arremessá-las. “Pegaram” é natural e claro em português moderno.
- source_word: οὖν
  choice: Então
  rationale: Marca a consequência ou reação ao que foi dito anteriormente, preservando a ligação lógica de modo fluente.
- source_word: λίθους
  choice: pedras
  rationale: É a correspondência usual de λίθους e mantém a associação contextual com um apedrejamento.
- source_word: ἵνα βάλωσιν ἐπ’ αὐτόν
  choice: para atirar nele
  rationale: A construção com ἵνα e subjuntivo expressa propósito. A formulação infinitiva é idiomática em português e preserva a ação hostil dirigida contra Jesus.
- source_word: ἐκρύβη
  choice: se ocultou
  rationale: Embora a forma grega seja morfologicamente passiva, pode ter sentido médio neste contexto. “Se ocultou” evita sugerir um agente externo e mantém um registro digno e natural.
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Traduz diretamente o movimento expresso por ἐξέρχομαι e combina naturalmente com “do templo”.
- source_word: ἐκ τοῦ ἱεροῦ
  choice: do templo
  rationale: ἱερόν designa o complexo ou recinto do templo, não especificamente o santuário interior. “Templo” mantém a leitura fluente, e a precisão lexical é registrada em nota.
theological_decisions:
- issue: Natureza da saída de Jesus
  choice: Traduzir somente que Jesus se ocultou e saiu, sem acrescentar detalhes milagrosos.
  alternative: Jesus passou milagrosamente pelo meio deles ou tornou-se invisível.
  rationale: O texto da SBLGNT afirma apenas que Jesus se ocultou e saiu do templo. Pormenores presentes em tradições manuscritas posteriores não devem ser importados.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Se ocultou” preserva a reflexividade contextual sem introduzir uma explicação sobrenatural; a nota distingue ἱερόν de ναός.
