  text: ἀπεκρίθη Ἰησοῦς· Ἐγὼ δαιμόνιον οὐκ ἔχω, ἀλλὰ τιμῶ τὸν πατέρα μου, καὶ ὑμεῖς ἀτιμάζετέ με.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/049.yaml
  text: Jesus answered[a], “I do not have a demon, but I honor my Father, and you dishonor me.”
translation:
  language: pt
  text: 'Jesus respondeu: “Eu não tenho demônio[a], mas honro o meu Pai, e vocês me desonram.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais interpretativo: “não estou possuído por demônio”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: Verbo narrativo comum em diálogos; “respondeu” é natural e corresponde diretamente ao grego.
- source_word: δαιμόνιον οὐκ ἔχω
  choice: não tenho demônio
  rationale: Preserva a formulação e o idioma direto do grego, que no contexto significa estar sob influência ou possessão demoníaca.
- source_word: ἀλλὰ
  choice: pelo contrário
  rationale: Expressa com clareza o contraste forte entre a acusação negada e a afirmação seguinte.
- source_word: τιμῶ
  choice: honro
  rationale: Equivalente direto de τιμάω e preserva o contraste lexical com ἀτιμάζω.
- source_word: τὸν πατέρα μου
  choice: o meu Pai
  rationale: No contexto joanino, refere-se a Deus como Pai de Jesus; a maiúscula sinaliza essa referência contextual sem acrescentar conteúdo.
- source_word: ἀτιμάζετέ με
  choice: vocês me desonram
  rationale: Mantém o objeto pronominal e reproduz o contraste entre honrar e desonrar; “vocês” oferece ampla legibilidade brasileira e distingue o plural.
theological_decisions:
- issue: Sentido de “ter demônio”
  choice: Manter no texto a expressão direta “não tenho demônio”.
  alternative: “não estou possuído por demônio”
  rationale: A alternativa explicita o sentido provável, mas é mais interpretativa. A formulação principal conserva a expressão grega e sua tensão idiomática.
- issue: Referência de “meu Pai”
  choice: Entender a expressão como referência de Jesus a Deus e escrever “Pai” com inicial maiúscula.
  alternative: “meu pai”, como referência familiar genérica
  rationale: O contexto imediato e o uso joanino identificam o Pai como Deus; a capitalização esclarece a referência sem reformular o texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “não tenho demônio” foi mantida por proximidade formal ao original, enquanto a nota registra o sentido idiomático mais explícito. “Pelo contrário” comunica naturalmente a força adversativa de ἀλλά.
