id: JHN.8.52
reference: John 8:52
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Νῦν ἐγνώκαμεν ὅτι δαιμόνιον ἔχεις. Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται, καὶ σὺ λέγεις· Ἐάν τις τὸν λόγον μου τηρήσῃ, οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/052.yaml
  text: The Jews said to him[a], “Now we know that you have a demon. Abraham died, and the prophets also, yet you say, ‘If anyone keeps my word[c][b], he will certainly never taste death forever.’”
translation:
  language: pt
  text: 'Os judeus lhe disseram: “Agora sabemos que você tem um demônio.[a] Abraão morreu, e os profetas também; no entanto, você diz: ‘Se alguém guardar a minha palavra, certamente jamais provará a morte.’[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você está possuído por um demônio”. O grego diz literalmente: “você tem um demônio”.'
    reason: lexical_alternative
  - marker: b
    text: A construção grega é uma negação enfática e significa que essa pessoa jamais provará a morte, em tempo algum.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: Os judeus
  rationale: Tradução direta do grupo nomeado no texto. “Os líderes judeus” seria interpretativo, e “os judeanos” enfatizaria uma possibilidade geográfica ou étnica que o contexto não exige.
- source_word: Νῦν ἐγνώκαμεν
  choice: Agora sabemos
  rationale: Expressa em português natural o estado presente de convicção resultante indicado pelo perfeito grego.
- source_word: δαιμόνιον ἔχεις
  choice: você tem um demônio
  rationale: Preserva de perto a formulação grega; a alternativa idiomática “você está possuído por um demônio” explicita uma interpretação da expressão.
- source_word: Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται
  choice: Abraão morreu, e os profetas também
  rationale: O passado simples traduz naturalmente o aoristo, e “também” deixa clara a coordenação de Abraão com os profetas.
- source_word: καὶ σὺ λέγεις
  choice: no entanto, você diz
  rationale: A conjunção assume força contrastiva no contexto, opondo a morte de Abraão e dos profetas à afirmação citada.
- source_word: Ἐάν τις
  choice: Se alguém
  rationale: Mantém a condição indefinida e seu alcance geral.
- source_word: τὸν λόγον μου τηρήσῃ
  choice: guardar a minha palavra
  rationale: “Guardar” preserva a amplitude de τηρέω — conservar, observar, obedecer — e “palavra” mantém a dicção joanina de λόγος.
- source_word: οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα
  choice: certamente jamais provará a morte
  rationale: “Certamente jamais” comunica a negação enfática οὐ μή e incorpora de modo natural a força temporal de εἰς τὸν αἰῶνα. “Provará a morte” conserva a metáfora do original sem definir seu referente.
theological_decisions:
- issue: Sentido da promessa a respeito da morte
  choice: Manter a expressão metafórica “provará a morte” sem determinar o tipo de morte em vista.
  alternative: Explicitar “morte física”, “morte espiritual” ou “morte eterna/final”.
  rationale: Os interlocutores entendem as palavras de Jesus em relação à morte de Abraão e dos profetas, enquanto o Evangelho de João frequentemente sustenta sentidos em mais de um nível. A tradução preserva essa tensão.
- issue: Identidade e função de “os judeus”
  choice: Traduzir literalmente o grupo mencionado como “os judeus”.
  alternative: “Os líderes judeus” ou “os judeanos”.
  rationale: O texto não especifica aqui líderes nem exige uma delimitação geográfica. A escolha evita acrescentar uma identificação não expressa, sem generalizar a fala para todos os judeus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” por naturalidade contemporânea, sem coloquialismo excessivo. A ordem e a pontuação evitam a formulação ambígua “provar a morte para sempre”, na qual “para sempre” poderia parecer modificar a duração da morte, e não reforçar que isso jamais ocorrerá.
