id: JHN.8.36
reference: John 8:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν οὖν ὁ υἱὸς ὑμᾶς ἐλευθερώσῃ, ὄντως ἐλεύθεροι ἔσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/036.yaml
  text: So if the Son sets you free[a], you will be truly free.
translation:
  language: pt
  text: Portanto, se o Filho libertar vocês, vocês serão verdadeiramente livres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “realmente livres” ou “livres de fato”. O advérbio grego enfatiza que essa liberdade é real e genuína.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Portanto, se
  rationale: ἐὰν introduz a condição, enquanto οὖν apresenta a conclusão decorrente do argumento anterior. “Portanto, se” preserva os dois elementos com clareza em português.
- source_word: ὁ υἱὸς
  choice: o Filho
  rationale: O artigo e o contexto joanino indicam um título cristológico que se refere a Jesus; a inicial maiúscula sinaliza esse uso sem acrescentar conteúdo ao texto.
- source_word: ὑμᾶς
  choice: vocês
  rationale: O pronome grego está no plural. “Vocês” torna explícita essa pluralidade e tem ampla legibilidade no português moderno.
- source_word: ἐλευθερώσῃ
  choice: libertar
  rationale: O verbo expressa o ato de tornar livre. “Libertar” é natural e digno em português e funciona adequadamente na construção condicional.
- source_word: ὄντως
  choice: verdadeiramente
  rationale: O advérbio enfatiza que a liberdade é real ou genuína. “Verdadeiramente” conserva essa força e o tom solene da afirmação.
- source_word: ἐλεύθεροι
  choice: livres
  rationale: É um adjetivo predicativo que descreve o estado resultante, e não apenas o ato de libertação.
- source_word: ἔσεσθε
  choice: vocês serão
  rationale: Preserva o futuro do verbo εἰμί em português moderno e concorda com o referente plural.
theological_decisions:
- issue: Identidade de “o Filho”
  choice: Título cristológico que se refere especificamente a Jesus
  alternative: Referência genérica a um filho
  rationale: No contexto de João, “o Filho” integra a autorrevelação de Jesus e seu argumento acerca da posição permanente na casa e da autoridade para libertar.
- issue: Natureza da liberdade descrita
  choice: Liberdade verdadeira ou genuína, sem restringir seu alcance na tradução
  alternative: Explicitar apenas liberdade espiritual, social ou política
  rationale: O contexto imediato trata da escravidão ao pecado, mas o versículo formula o resultado de modo amplo. A tradução mantém essa amplitude e não resolve além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O uso de “vocês” explicita o plural grego; “Portanto” preserva a relação inferencial com o contexto anterior.
