  text: Jesus answered them[a], “Truly, truly, I say to you[b], everyone who practices sin is a slave of sin.”
translation:
  language: pt
  text: 'Jesus lhes respondeu: “Em verdade, em verdade lhes digo: todo aquele que pratica o pecado[a] é escravo do pecado[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “comete pecado”. A expressão grega pode ser traduzida mais literalmente assim, mas “pratica o pecado” comunica melhor, neste contexto, uma ação contínua ou característica.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “servo do pecado”. A palavra grega pode significar “servo” ou “escravo”; aqui, “escravo” ressalta a ideia de sujeição central ao argumento de Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: Jesus lhes respondeu
  rationale: Ordem natural em português, preservando tanto o sujeito quanto o caráter responsivo do verbo.
- source_word: Ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Mantém a repetição solene característica do Evangelho de João e comunica com clareza a certeza enfática da declaração.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Tradução concisa e natural da fórmula, com o plural de ὑμῖν expresso pelo pronome “lhes”.
- source_word: πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: todo aquele que pratica o pecado
  rationale: “Pratica” procura transmitir o aspecto contínuo ou característico do particípio presente, sem transformar a frase numa afirmação técnica além do que o grego diz.
- source_word: δοῦλος
  choice: escravo
  rationale: A metáfora enfatiza sujeição e falta de liberdade; “escravo” preserva essa força melhor do que “servo” neste contexto.
- source_word: τῆς ἁμαρτίας
  choice: do pecado
  rationale: Preserva de modo natural a construção genitiva, apresentando a pessoa como pertencente ao domínio do pecado.
theological_decisions:
- issue: O alcance do particípio presente ποιῶν
  choice: “pratica o pecado”, indicando conduta contínua ou característica
  alternative: “comete pecado”, que pode ser entendido como um ato isolado
  rationale: O particípio presente favorece a ideia de prática ou comportamento característico, embora não seja necessário convertê-lo numa formulação doutrinária mais rígida.
- issue: A metáfora de δοῦλος
  choice: “escravo do pecado”
  alternative: “servo do pecado”
  rationale: No argumento sobre liberdade e escravidão, “escravo” comunica mais diretamente a sujeição ao poder do pecado, sem suavizar a tensão da metáfora.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A fórmula joanina repetida foi preservada, e a metáfora de escravidão não foi suavizada.
