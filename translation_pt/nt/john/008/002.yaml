  yaml_path: translation/nt/john/008/002.yaml
  text: At dawn he came again to the temple, and all the people were coming to him; and he sat down and began to teach them.
translation:
  language: pt
  text: Ao amanhecer, porém, ele voltou ao templo, e todo o povo vinha até ele; sentou-se e começou a ensiná-los.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo dá continuidade ao relato da mulher apanhada em adultério (João 7:53–8:11). Esse relato está ausente dos manuscritos gregos mais antigos. Veja a nota em João 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: Ὄρθρου
  choice: Ao amanhecer
  rationale: O genitivo temporal indica o período do raiar do dia; a expressão é concisa, natural e mantém a referência temporal do grego.
- source_word: δὲ
  choice: porém
  rationale: Marca uma transição narrativa com leve contraste; “porém” preserva essa nuance sem torná-la excessivamente forte.
- source_word: πάλιν παρεγένετο
  choice: foi novamente
  rationale: Expressa de modo natural a nova ida de Jesus ao destino indicado; “novamente” traduz explicitamente πάλιν.
- source_word: ἱερόν
  choice: templo
  rationale: Refere-se ao complexo do templo, onde ocorria o ensino público, e não especificamente ao santuário interior; “templo” é a forma corrente em português.
- source_word: πᾶς ὁ λαὸς ἤρχετο
  choice: todo o povo vinha
  rationale: O imperfeito descreve o movimento contínuo das pessoas em direção a Jesus; “vinha” preserva esse aspecto.
- source_word: καθίσας
  choice: sentou-se
  rationale: O particípio aoristo apresenta o ato de sentar-se como anterior ao ensino.
- source_word: ἐδίδασκεν
  choice: começou a ensiná-los
  rationale: O imperfeito pode ter força ingressiva ou contínua. No encadeamento com o ato de sentar-se, “começou a ensinar” comunica naturalmente o início da atividade, sem excluir sua continuidade.
