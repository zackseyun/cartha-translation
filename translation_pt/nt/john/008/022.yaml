  naturalness: O português é moderno, claro e adequado ao registro narrativo. “Ele não vai se matar, vai?” é uma interrogativa retórica corrente e natural, particularmente legível no português brasileiro, que comunica melhor a força cética de μήτι.
  terminology: “Os judeus” mantém a forma lexical do grego sem impor uma delimitação interpretativa. A nota deve indicar com maior precisão que a alternativa regional diz respeito a “judeanos”/habitantes da Judeia, e não sugerir que “judeus da Judeia” seja uma equivalência lexical estrita.
