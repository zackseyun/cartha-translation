source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Μήτι ἀποκτενεῖ ἑαυτὸν ὅτι λέγει· Ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/022.yaml
  text: So the Jews were saying[a], “Surely he will not kill himself, since he says, ‘Where I am going, you cannot come’?”
translation:
  language: pt
  text: 'Então, os judeus diziam[a]: “Ele não vai se matar, vai? Pois diz: ‘Para onde eu vou, vocês não podem ir’.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente no contexto de João, “os judeanos” (isto é, os habitantes da Judeia) ou “os líderes judeus”, conforme a amplitude pretendida para a referência aqui.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito indica fala em andamento ou repetida; “diziam” preserva naturalmente esse aspecto em português.
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e a inferência decorrente da declaração anterior, de modo natural em português.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: É a correspondência lexical direta. Em João, a expressão pode designar, conforme o contexto, judeus da Judeia ou autoridades judaicas, mas o versículo não restringe explicitamente o referente.
- source_word: Μήτι
  choice: Será que ...?
  rationale: Introduz uma pergunta que espera resposta negativa. A formulação comunica em português a conjectura incrédula sem transformar a expectativa implícita em afirmação categórica.
- source_word: ἀποκτενεῖ ἑαυτόν
  choice: vai se matar
  rationale: Expressa de maneira direta, atual e idiomática o futuro com pronome reflexivo.
- source_word: ὅτι
  choice: já que
  rationale: 'Introduz a razão ou base da conjectura: eles inferem isso do que Jesus diz.'
- source_word: λέγει
  choice: diz
  rationale: Preserva o presente grego dentro da moldura narrativa.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: Para onde eu vou
  rationale: Tradução idiomática de movimento em português; mantém o sentido de ir ou partir sem explicitar além do texto.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: vocês não podem ir
  rationale: Em português, “ir” é exigido pela perspectiva dêitica estabelecida por “para onde eu vou”; repetir “ir” transmite naturalmente a incapacidade de chegar ao destino de Jesus.
theological_decisions:
- issue: Referente de οἱ Ἰουδαῖοι no Evangelho de João
  choice: Manter “os judeus” no texto principal
  alternative: “os judeus da Judeia” ou “os líderes judeus”
  rationale: O grego não restringe explicitamente aqui o grupo a autoridades nem o define apenas em sentido regional. A nota registra as possibilidades contextuais sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Será que” reproduz uma pergunta de expectativa negativa de modo corrente; “vai se matar” evita solenidade artificial. A fala citada usa “vocês”, natural no português brasileiro e inteligível internacionalmente.
