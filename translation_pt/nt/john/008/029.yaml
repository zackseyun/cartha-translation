id: JHN.8.29
reference: John 8:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με μετ’ ἐμοῦ ἐστιν· οὐκ ἀφῆκέν με ⸀μόνον, ὅτι ἐγὼ τὰ ἀρεστὰ αὐτῷ ποιῶ πάντοτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/029.yaml
  text: And the one who sent me is with me[a]. He has not left me alone[b], because I always do what is pleasing to him.
translation:
  language: pt
  text: E aquele que me enviou está comigo; ele não me deixou sozinho, porque faço sempre o que lhe agrada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμψας
  choice: aquele que me enviou
  rationale: O particípio aoristo substantivado designa quem enviou Jesus. A formulação preserva a expressão relacional do grego sem explicitar “o Pai” no texto.
- source_word: μετ’ ἐμοῦ ἐστιν
  choice: está comigo
  rationale: μετά com genitivo expressa companhia ou presença. “Está comigo” é natural em português e mantém o sentido de presença contínua.
- source_word: οὐκ ἀφῆκέν με μόνον
  choice: ele não me deixou sozinho
  rationale: O aoristo ἀφῆκεν é vertido pelo pretérito perfeito, a correspondência portuguesa natural neste contexto; μόνον funciona predicativamente e resulta de modo idiomático em “sozinho”.
- source_word: ὅτι
  choice: porque
  rationale: A conjunção introduz a razão declarada para ele não ter deixado Jesus sozinho; “porque” comunica diretamente o valor causal.
- source_word: τὰ ἀρεστὰ αὐτῷ
  choice: o que lhe agrada
  rationale: A expressão neutra plural significa literalmente “as coisas agradáveis a ele”. A construção idiomática “o que lhe agrada” preserva o sentido sem rigidez.
- source_word: ποιῶ πάντοτε
  choice: faço sempre
  rationale: O presente indica ação habitual, e πάντοτε expressa constância. “Faço sempre” é uma ordem natural e digna em português.
theological_decisions:
- issue: Referente de “aquele que me enviou”
  choice: Manter a expressão relacional, sem substituí-la por “o Pai”.
  alternative: Explicitar “o Pai que me enviou”.
  rationale: O contexto joanino identifica o referente como o Pai, mas o grego preserva a descrição relacional. A tradução evita acrescentar uma identificação que não está expressa no versículo.
- issue: Relação causal introduzida por ὅτι
  choice: Traduzir por “porque”, mantendo a afirmação de Jesus como razão apresentada no discurso.
  alternative: Traduzir por “pois” ou entender a oração com valor explicativo menos direto.
  rationale: O valor causal é o mais natural no contexto. A tradução preserva a tensão teológica da declaração sem explicar de que modo o agir de Jesus se relaciona com a presença daquele que o enviou.
- issue: Valor temporal de ἀφῆκεν
  choice: 'Usar o pretérito perfeito português: “não me deixou sozinho”.'
  alternative: 'Usar uma formulação de estado resultante: “não me tem deixado sozinho” ou “não me abandonou”.'
  rationale: O pretérito perfeito representa adequadamente o aoristo e, combinado com “está comigo”, permite que o contexto comunique a continuidade da presença sem impor ao verbo uma explicitação aspectual adicional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva a estrutura coordenada do grego, evita linguagem excessivamente literal e não introduz explicações denominacionais.
