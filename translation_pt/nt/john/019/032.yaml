  text: ἦλθον οὖν οἱ στρατιῶται, καὶ τοῦ μὲν πρώτου κατέαξαν τὰ σκέλη καὶ τοῦ ἄλλου τοῦ συσταυρωθέντος αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/032.yaml
  text: So the soldiers came and broke the legs of the first man[b][a], and of the other who had been crucified with him.
translation:
  language: pt
  text: Então os soldados vieram e quebraram as pernas do primeiro homem e as do outro que tinha sido crucificado com ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Expressa a continuação resultante do versículo anterior de forma natural no português atual.
- source_word: οἱ στρατιῶται
  choice: os soldados
  rationale: É a designação comum e clara para os militares romanos neste contexto.
- source_word: τοῦ μὲν πρώτου
  choice: do primeiro homem
  rationale: O grego diz literalmente «do primeiro»; acrescenta-se «homem» para explicitar o referente pessoal sem alterar o sentido.
- source_word: κατέαξαν τὰ σκέλη
  choice: quebraram as pernas
  rationale: Tradução direta e idiomática da ação praticada no contexto da execução.
- source_word: τοῦ ἄλλου
  choice: as do outro
  rationale: «As» retoma naturalmente «pernas» e preserva a construção elíptica do grego sem produzir obscuridade.
- source_word: τοῦ συσταυρωθέντος αὐτῷ
  choice: que tinha sido crucificado com ele
  rationale: A forma verbal composta apresenta a crucificação como anterior à chegada dos soldados; «com ele» mantém a referência pronominal do original.
theological_decisions:
- issue: Referente de αὐτῷ
  choice: «com ele», entendido no contexto como Jesus
  alternative: «com o primeiro homem» ou explicitação direta como «com Jesus»
  rationale: Jesus é o referente central da cena, e os outros dois homens são identificados por terem sido crucificados com ele. Manter o pronome reproduz a forma do grego sem inserir o nome ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de «pernas» foi evitada por meio do pronome «as», construção natural em português.
