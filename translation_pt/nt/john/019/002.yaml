  text: καὶ οἱ στρατιῶται πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ, καὶ ἱμάτιον πορφυροῦν περιέβαλον αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/002.yaml
  text: And the soldiers, after weaving a crown out of thorns, put it on his head and clothed him in a purple robe,
translation:
  language: pt
  text: E os soldados, depois de trançarem uma coroa de espinhos, puseram-na na cabeça dele e o vestiram com um manto púrpura[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e puseram nele uma veste púrpura”.'
    reason: Alternativa lexical mais genérica para ἱμάτιον e formulação mais próxima da construção grega.
lexical_decisions:
- source_word: στρατιῶται
  choice: soldados
  rationale: Equivalente corrente e preciso para militares romanos neste contexto narrativo.
- source_word: πλέξαντες
  choice: depois de trançarem
  rationale: Expressa naturalmente em português a ação anterior indicada pelo particípio aoristo, preservando a sequência dos acontecimentos.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: uma coroa de espinhos
  rationale: “Coroa” preserva a imagem de realeza, enquanto “de espinhos” expressa de modo natural o material de que foi feita.
- source_word: ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ
  choice: puseram-na na cabeça dele
  rationale: Reproduz idiomaticamente a ação e torna explícito, por meio do pronome, que o objeto colocado foi a coroa.
- source_word: ἱμάτιον πορφυροῦν
  choice: um manto púrpura
  rationale: “Manto” designa naturalmente uma veste exterior sem especificar em excesso; “púrpura” conserva a cor e suas conotações régias.
- source_word: περιέβαλον αὐτόν
  choice: o vestiram com
  rationale: Expressa em português corrente o ato de envolver ou cobrir alguém com uma peça de roupa.
theological_decisions:
- issue: Imagem de realeza simulada nas ações dos soldados
  choice: Narrar diretamente a coroa de espinhos e o manto púrpura, sem acrescentar uma explicação de que se tratava de zombaria.
  alternative: 'Explicitar: “zombaram dele, vestindo-o como rei”.'
  rationale: O contexto deixa evidente a zombaria, mas o versículo relata apenas as ações; a tradução não deve inserir interpretação ausente do texto grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a sequência do grego e evita explicar além do que o versículo afirma.
