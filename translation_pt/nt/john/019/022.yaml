lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: O aoristo de ἀποκρίνομαι significa naturalmente “respondeu” no diálogo narrativo.
- source_word: ὁ Πιλᾶτος
  choice: Pilatos
  rationale: O artigo pertence ao uso narrativo grego e não precisa ser reproduzido em português; o nome assume a forma portuguesa tradicional.
- source_word: Ὃ
  choice: O que
  rationale: O pronome relativo neutro substantivado é expresso de modo natural e fiel por “o que”.
- source_word: γέγραφα
  choice: escrevi
  rationale: Embora seja perfeito no grego, o pretérito perfeito simples é a forma idiomática em português para uma ação concluída cujo resultado permanece; a repetição integral preserva a ênfase e a finalidade retórica.
theological_decisions:
- issue: Força da repetição do perfeito γέγραφα γέγραφα
  choice: “O que escrevi, escrevi.”
  alternative: “O que tenho escrito, tenho escrito.”
  rationale: A repetição comunica a decisão irrevogável de Pilatos sem explicitar mais do que o texto. Em português corrente, “escrevi” expressa melhor essa finalidade; a nota registra o aspecto resultante do perfeito grego.
translation_notes:
  register: Português moderno, claro e digno, com formulação natural tanto no Brasil como no uso internacional. A repetição breve e enfática do original foi mantida.
