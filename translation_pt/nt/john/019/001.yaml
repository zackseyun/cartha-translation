id: JHN.19.1
reference: John 19:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τότε οὖν ἔλαβεν ὁ Πιλᾶτος τὸν Ἰησοῦν καὶ ἐμαστίγωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/001.yaml
  text: Then Pilate took Jesus and flogged him[a].
translation:
  language: pt
  text: Então Pilatos tomou Jesus e o açoitou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, explicitando a ação por meio de subordinados: “Então Pilatos tomou Jesus e mandou açoitá-lo”.'
    reason: Leitura alternativa que torna explícita a possível agência delegada, sem afirmá-la no texto principal.
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Advérbio temporal que marca o acontecimento seguinte na sequência narrativa; “Então” é a forma mais natural e concisa em português.
- source_word: οὖν
  choice: implícito no fluxo de “Então”
  rationale: A partícula assinala progressão lógica e narrativa. Traduzir separadamente Τότε e οὖν produziria uma combinação pesada; sua força é absorvida por “Então” e pela sequência da frase.
- source_word: ἔλαβεν
  choice: tomou
  rationale: Preserva o sentido lexical simples de λαμβάνω e a estrutura superficial do grego sem especificar se Pilatos agiu pessoalmente ou por meio de subordinados.
- source_word: ὁ Πιλᾶτος
  choice: Pilatos
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome; o artigo grego não precisa ser reproduzido.
- source_word: τὸν Ἰησοῦν
  choice: Jesus
  rationale: Forma portuguesa estabelecida do nome e objeto direto de “tomou”.
- source_word: ἐμαστίγωσεν
  choice: o açoitou
  rationale: μαστιγόω designa castigo com açoite ou flagelo. “Açoitou” é claro, digno e suficientemente forte em português atual; o pronome retoma Jesus de modo natural.
theological_decisions:
- issue: Agência de Pilatos em ἔλαβεν ... ἐμαστίγωσεν diante do procedimento romano
  choice: Manter Pilatos como sujeito gramatical dos dois verbos, sem determinar se executou pessoalmente o açoite.
  alternative: “Pilatos tomou Jesus e mandou açoitá-lo” ou “Pilatos mandou levar Jesus e açoitá-lo”.
  rationale: O grego apresenta Pilatos como sujeito de ambos os verbos. A tradução principal conserva essa estrutura e a ambiguidade entre ação direta e autoridade delegada, sem inserir uma reconstrução histórica.
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. “Açoitou” preserva a gravidade da ação sem recorrer ao tom menos corrente de “flagelou”. O marcador [a] aparece no texto principal.
