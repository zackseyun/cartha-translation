  source_fidelity: 'A tradução representa fielmente a sequência e os principais elementos do grego: ὅτε οὖν é expresso por “Então, quando”; ἔλαβεν por “recebeu”; τὸ ὄξος por “o vinho azedo”; Τετέλεσται por “Está consumado”; e παρέδωκεν τὸ πνεῦμα por “entregou o espírito”. A formulação não explicita indevidamente o referente implícito de Τετέλεσται nem reduz a expressão final a uma simples notícia de morte.'
