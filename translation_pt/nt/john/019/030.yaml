id: JHN.19.30
reference: John 19:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτε οὖν ἔλαβεν τὸ ὄξος ὁ Ἰησοῦς εἶπεν· Τετέλεσται, καὶ κλίνας τὴν κεφαλὴν παρέδωκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/030.yaml
  text: So when Jesus had received the sour wine[a], he said, “It is finished,” and bowing his head[c][b], he gave up his spirit.
translation:
  language: pt
  text: 'Então, quando Jesus recebeu o vinho azedo[a], disse: “Está consumado”[b]. E, inclinando a cabeça, entregou o espírito.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o vinagre” ou “o vinagre de vinho”. O termo grego se refere a vinho azedo ou avinagrado.
    reason: lexical_alternative
  - marker: b
    text: Ou “Está concluído” ou “Foi realizado por completo”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou “deu o último suspiro”. Mais literalmente, o grego diz: “entregou o espírito”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Então, quando
  rationale: Preserva tanto a relação temporal de ὅτε quanto a função de continuidade e consequência narrativa de οὖν, em português natural.
- source_word: ἔλαβεν
  choice: recebeu
  rationale: No contexto do vinho oferecido numa esponja, “recebeu” expressa naturalmente λαμβάνω sem sugerir que Jesus o tomou com as mãos.
- source_word: τὸ ὄξος
  choice: o vinho azedo
  rationale: Ὄξος designa vinho que azedou ou vinho avinagrado. “Vinho azedo” comunica com clareza a natureza da bebida e evita a ideia moderna de vinagre culinário puro.
- source_word: Τετέλεσται
  choice: Está consumado
  rationale: O perfeito de τελέω apresenta algo levado ao fim, com resultado vigente. “Está consumado” preserva a concisão, a finalidade e a possível dimensão de cumprimento sem explicitar o que foi completado.
- source_word: κλίνας τὴν κεφαλήν
  choice: inclinando a cabeça
  rationale: Reproduz de modo natural a ação circunstancial do particípio aoristo, anterior à entrega do espírito.
- source_word: παρέδωκεν τὸ πνεῦμα
  choice: entregou o espírito
  rationale: Mantém a formulação concreta e solene do grego, em vez de reduzi-la a uma simples declaração de morte; o artigo grego é preservado naturalmente em português.
theological_decisions:
- issue: Se παρέδωκεν τὸ πνεῦμα deve ser reduzido a uma expressão idiomática que apenas declare a morte de Jesus.
  choice: entregou o espírito
  alternative: deu o último suspiro
  rationale: A tradução principal conserva a linguagem específica e potencialmente significativa de João, inclusive a apresentação da morte como ato voluntário, sem definir além do texto se πνεῦμα significa aqui espírito, vida ou sopro.
- issue: Como traduzir o perfeito Τετέλεσται sem determinar explicitamente o referente implícito.
  choice: Está consumado
  alternative: Está concluído
  rationale: A forma concisa mantém em aberto o que foi levado ao fim e conserva tanto o aspecto de conclusão quanto o de resultado presente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, sem perder a progressão do grego. “Está consumado” conserva uma formulação conhecida, mas ainda corrente; as notas registram alternativas lexicais genuínas.
