id: JHN.19.11
reference: John 19:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Οὐκ εἶχες ἐξουσίαν ⸂κατ’ ἐμοῦ οὐδεμίαν⸃ εἰ μὴ ἦν ⸂δεδομένον σοι⸃ ἄνωθεν· διὰ τοῦτο ὁ ⸀παραδούς μέ σοι μείζονα ἁμαρτίαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/011.yaml
  text: Jesus answered him[a], “You would have no authority over me at all unless it had been given to you from above[b]. Therefore the one who handed me over to you has the greater sin.”
translation:
  language: pt
  text: 'Jesus lhe respondeu: “Você não teria autoridade alguma sobre mim se ela não lhe tivesse sido dada do alto.[a] Por isso, aquele que me entregou a você[b] é culpado de um pecado maior.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do céu”. O grego diz “do alto”, expressão que em João frequentemente aponta para uma origem divina.
    reason: lexical_alternative
  - marker: b
    text: O texto não identifica explicitamente quem entregou Jesus a Pilatos. A expressão pode ser entendida como referência a Judas, a Caifás ou, de modo mais amplo, à liderança judaica.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: No contexto do interrogatório de Pilatos, indica jurisdição ou autoridade delegada; “poder” poderia sugerir apenas capacidade ou força.
- source_word: κατ’ ἐμοῦ οὐδεμίαν
  choice: autoridade alguma sobre mim
  rationale: A formulação é natural em português e preserva a ênfase da negação expressa por οὐδεμίαν.
- source_word: δεδομένον σοι
  choice: lhe tivesse sido dada
  rationale: A construção passiva indica que a autoridade de Pilatos depende de uma concessão anterior; o mais-que-perfeito composto se ajusta naturalmente à condição irreal em português.
- source_word: ἄνωθεν
  choice: do alto
  rationale: Preserva a expressão característica de João e sua referência a uma origem divina sem explicitar além do texto “do céu” ou “por Deus”.
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo corrente a ligação causal ou inferencial com a afirmação anterior.
- source_word: ὁ παραδούς μέ σοι
  choice: aquele que me entregou a você
  rationale: Mantém indefinida a identidade da pessoa ou do agente referido e evita restringir a expressão a Judas por meio de “traidor”.
- source_word: μείζονα ἁμαρτίαν ἔχει
  choice: é culpado de um pecado maior
  rationale: Comunica em português natural a maior responsabilidade moral indicada literalmente por “tem pecado maior”, sem eliminar a comparação com Pilatos.
theological_decisions:
- issue: Origem da autoridade de Pilatos indicada por ἄνωθεν
  choice: do alto
  alternative: do céu; dada por Deus
  rationale: A expressão aponta para uma fonte divina, mas a tradução conserva a linguagem do texto e não a transforma numa declaração geral e detalhada sobre legitimidade política.
- issue: Identidade de ὁ παραδούς μέ σοι
  choice: aquele que me entregou a você
  alternative: Judas; Caifás; a liderança judaica em sentido coletivo
  rationale: O versículo não identifica explicitamente o referente. A formulação genérica preserva essa ambiguidade histórica e exegética.
- issue: Comparação de culpa entre Pilatos e quem entregou Jesus
  choice: é culpado de um pecado maior
  alternative: tem um pecado maior
  rationale: A tradução mantém a gradação de responsabilidade moral sem absolver Pilatos nem definir de modo mais preciso a natureza da culpa de cada agente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” reflete o tratamento direto singular dirigido a Pilatos; “lhe” evita repetição excessiva. A ordem e as relações lógicas do grego foram preservadas, com ajustes idiomáticos mínimos.
