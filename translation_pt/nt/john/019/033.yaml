id: JHN.19.33
reference: John 19:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες, ὡς εἶδον ⸂ἤδη αὐτὸν⸃ τεθνηκότα, οὐ κατέαξαν αὐτοῦ τὰ σκέλη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/033.yaml
  text: But when they came to Jesus[a], seeing that he was already dead[b], they did not break his legs.
translation:
  language: pt
  text: Mas, quando chegaram a Jesus[a] e viram que ele já estava morto[b], não lhe quebraram as pernas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'João relaciona mais adiante essa ação com a Escritura: “Nenhum dos seus ossos será quebrado” (João 19:36; cf. Êxodo 12:46; Números 9:12; Salmo 34:20).'
    reason: cross_reference
  - marker: b
    text: 'Ou: “viram que ele já havia morrido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες
  choice: Mas, quando chegaram a Jesus
  rationale: A construção participial é expressa naturalmente em português por uma oração temporal. “Mas” preserva o contraste moderado de δέ com o que os soldados fizeram aos outros crucificados.
- source_word: ὡς εἶδον
  choice: e viram que
  rationale: No contexto, ὡς introduz a circunstância percebida que fundamentou a ação seguinte. A coordenação com “e” mantém a sequência narrativa de modo natural sem eliminar por completo essa relação.
- source_word: ἤδη
  choice: já
  rationale: Indica que a morte de Jesus havia ocorrido antes da chegada dos soldados; “já” é o equivalente português direto e idiomático.
- source_word: τεθνηκότα
  choice: estava morto
  rationale: O particípio perfeito enfatiza o estado resultante da morte. “Estava morto” comunica claramente esse estado, enquanto a nota preserva a alternativa verbal “já havia morrido”.
- source_word: οὐ κατέαξαν
  choice: não lhe quebraram
  rationale: κατάγνυμι designa aqui quebrar membros ou ossos. A construção portuguesa com pronome dativo é natural e mantém Jesus como a pessoa afetada.
- source_word: τὰ σκέλη
  choice: as pernas
  rationale: σκέλη refere-se às pernas. Embora o procedimento envolvesse quebrar seus ossos, “quebrar as pernas” é a formulação corrente e não antecipa indevidamente a linguagem de “ossos” em João 19:36.
theological_decisions:
- issue: Possível alusão ao cumprimento das Escrituras no fato de as pernas de Jesus não serem quebradas
  choice: Manter no texto principal a afirmação narrativa direta, usando “pernas”, e apresentar a conexão bíblica em nota.
  alternative: Empregar “ossos das pernas” ou inserir linguagem de cumprimento para antecipar João 19:36.
  rationale: João 19:36 explicita posteriormente a conexão com as Escrituras. Este versículo deve narrar a ação dos soldados sem tornar explícita antes do momento textual a sua implicação teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada ao uso natural do português, preservando o contraste, a sequência narrativa e o estado resultante expresso pelo perfeito grego.
