  source_fidelity: 'A estrutura e o sentido central são bem preservados: os soldados tomam as roupas, fazem quatro partes, uma para cada soldado, e tomam também a túnica. Contudo, “de cima a baixo” explicita uma direção até a parte inferior que o grego não declara de modo direto; ἐκ τῶν ἄνωθεν indica a origem no alto/na parte superior, e δι’ ὅλου indica que a tecelagem se estendia pela peça inteira.'
  naturalness: O português é claro e moderno. A revisão mantém essa fluência, substituindo a formulação potencialmente excessivamente específica por uma redação natural e mais precisa. “Suas roupas externas” também torna mais nítida a distinção contextual entre ἱμάτια e a túnica.
  terminology: “Túnica” é apropriado para χιτών. “Sem costura” traduz adequadamente ἄραφος. “Roupas externas” é uma solução segura para ἱμάτια neste contraste imediato, sem atribuir significado simbólico à peça.
