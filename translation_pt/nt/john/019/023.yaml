    rationale: O texto diz que a túnica era tecida ἐκ τῶν ἄνωθεν, “a partir do alto/da parte superior”, δι’ ὅλου, “por toda [a extensão]”. A expressão portuguesa acrescenta de forma mais explícita o ponto de chegada “a baixo”, enquanto a redação revista conserva a abrangência sem além do que está expresso.
  - severity: low
    issue: “Roupas dele” torna menos clara a distinção entre ἱμάτια e χιτών.
    rationale: Embora “roupas” seja lexicalmente possível, o versículo separa as vestes tomadas da túnica. “Roupas externas” reproduz melhor esse contraste contextual em português.
