  to: Assim, quando os soldados crucificaram Jesus, pegaram suas roupas externas e as dividiram em quatro partes, uma para cada soldado. Pegaram também a túnica. A túnica, por sua vez, não tinha costura[a]; era tecida a partir da parte superior, por toda a sua extensão[b].
