  text: οἱ οὖν στρατιῶται ὅτε ἐσταύρωσαν τὸν Ἰησοῦν ἔλαβον τὰ ἱμάτια αὐτοῦ καὶ ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος, καὶ τὸν χιτῶνα. ἦν δὲ ὁ χιτὼν ἄραφος, ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/023.yaml
  text: So when the soldiers had crucified Jesus[a], they took his outer garments and made four parts, a part for each soldier, and also the tunic. Now the tunic was seamless[c][b], woven from the top throughout.
translation:
  language: pt
  text: Assim, quando os soldados crucificaram Jesus, pegaram suas roupas externas e as dividiram em quatro partes, uma para cada soldado. Pegaram também a túnica. A túnica, por sua vez, não tinha costura[a]; era tecida a partir da parte superior, por toda a sua extensão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “era sem emenda”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tecida desde o alto por inteiro”. A expressão grega também pode ser entendida como “a partir de cima”; no contexto, provavelmente se refere à parte superior da túnica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν στρατιῶται
  choice: Assim, ... os soldados
  rationale: οὖν dá continuidade à narrativa; “Assim” preserva a conexão sem sugerir uma conclusão lógica forte.
- source_word: ὅτε ἐσταύρωσαν τὸν Ἰησοῦν
  choice: quando os soldados crucificaram Jesus
  rationale: O aoristo apresenta a crucificação como anterior às ações seguintes; em português, a sequência já fica clara sem o mais-que-perfeito.
- source_word: ἔλαβον τὰ ἱμάτια αὐτοῦ
  choice: pegaram as roupas dele
  rationale: ἱμάτια pode designar roupas em sentido amplo. “Roupas” é claro e natural, enquanto a menção separada da túnica mantém a distinção contextual.
- source_word: ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος
  choice: as dividiram em quatro partes, uma para cada soldado
  rationale: Expressa de modo natural o resultado da divisão e preserva tanto o número quanto a distribuição individual.
- source_word: καὶ τὸν χιτῶνα
  choice: Pegaram também a túnica
  rationale: χίτων é uma peça de roupa usada junto ao corpo e tradicionalmente chamada “túnica”; a repetição verbal torna explícita em português a construção elíptica grega.
- source_word: ἦν δὲ ὁ χιτὼν ἄραφος
  choice: A túnica, porém, não tinha costura
  rationale: δέ introduz uma explicação com leve contraste, e ἄραφος significa literalmente “sem costura”. A formulação é corrente e digna.
- source_word: ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου
  choice: era tecida inteira, de cima a baixo
  rationale: No contexto de confecção da roupa, ἄνωθεν indica o alto da peça, e δι’ ὅλου sua extensão completa. A formulação comunica uma peça tecida continuamente, preservando em nota a alternativa mais literal.
theological_decisions:
- issue: Possível simbolismo da túnica sem costura
  choice: Traduzir apenas a descrição concreta da túnica e de sua confecção.
  alternative: Inserir uma alusão à veste sacerdotal ou à unidade da igreja.
  rationale: O versículo não explicita nenhum significado simbólico; acrescentá-lo resolveria interpretativamente algo que o texto deixa em aberto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Roupas dele” evita rigidez, “túnica” preserva o termo histórico conhecido, e a divisão em três frases facilita a compreensão sem alterar a progressão narrativa.
