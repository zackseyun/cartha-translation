  text: Εἱστήκεισαν δὲ παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ ἡ μήτηρ αὐτοῦ καὶ ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ, Μαρία ἡ τοῦ Κλωπᾶ καὶ Μαρία ἡ Μαγδαληνή.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/025.yaml
  text: Standing by the cross of Jesus were his mother[a], and his mother's sister, Mary the wife of Clopas[b], and Mary Magdalene.
translation:
  language: pt
  text: Junto à cruz de Jesus estavam de pé sua mãe, a irmã de sua mãe[b], Maria, mulher de Clopas[a], e Maria Madalena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Maria, a de Clopas”. O grego não declara explicitamente qual era a relação entre Maria e Clopas, embora seja comum entendê-la como esposa dele.
    reason: lexical_alternative
  - marker: b
    text: O grego também pode ser entendido como uma lista de três mulheres, caso “a irmã de sua mãe” seja a mesma pessoa que “Maria, a de Clopas”.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἱστήκεισαν
  choice: estavam
  rationale: O mais-que-perfeito de ἵστημι tem aqui valor de estado contínuo; “estavam” expressa com naturalidade que elas permaneciam junto à cruz.
- source_word: δὲ
  choice: sem tradução explícita
  rationale: A partícula marca uma transição narrativa leve, que o português comunica naturalmente pela própria mudança de cena, sem exigir “ora”, “mas” ou “e”.
- source_word: παρὰ τῷ σταυρῷ
  choice: junto à cruz
  rationale: παρά com dativo indica proximidade; “junto à” é claro, corrente e preserva a relação espacial.
- source_word: τοῦ Ἰησοῦ
  choice: de Jesus
  rationale: Mantém a relação genitiva direta com “cruz”, sem acrescentar explicação ausente do grego.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: sua mãe
  rationale: Tradução direta e natural; no contexto, o referente de “sua” é Jesus.
- source_word: ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ
  choice: a irmã de sua mãe
  rationale: Reproduz claramente a construção genitiva e evita uma formulação excessivamente pesada.
- source_word: Μαρία ἡ τοῦ Κλωπᾶ
  choice: Maria, mulher de Clopas
  rationale: A construção com artigo e genitivo identifica Maria por sua relação com Clopas. “Mulher de Clopas” comunica a interpretação conjugal comum, enquanto a nota preserva o fato de que o grego não explicita a relação.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Maria Madalena
  rationale: Forma portuguesa tradicional e amplamente reconhecida do epíteto que identifica Maria como procedente de Magdala.
theological_decisions:
- issue: Identificação e número das mulheres junto à cruz
  choice: 'O texto principal apresenta quatro mulheres: a mãe de Jesus, a irmã dela, Maria, mulher de Clopas, e Maria Madalena.'
  alternative: É possível entender “a irmã de sua mãe” como uma explicação de quem é “Maria, a de Clopas”, resultando em três mulheres.
  rationale: A coordenação dos sintagmas favorece a leitura de quatro mulheres, mas a sintaxe compacta permite a leitura de três. A tradução adota a primeira sem eliminar a segunda, registrada em nota.
- issue: Relação de Maria com Clopas
  choice: mulher de Clopas
  alternative: Maria, a de Clopas
  rationale: A relação conjugal é a interpretação contextual mais comum, mas o genitivo grego não contém um termo equivalente a “esposa” ou “mulher”; por isso, a alternativa formalmente mais aberta é preservada em nota.
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. “Junto à cruz” soa natural e preserva a proximidade indicada pelo original. A repetição de “sua mãe” mantém clareza sem introduzir nomes ausentes do versículo. As notas conservam as duas ambiguidades reais: a relação de Maria com Clopas e a possibilidade de haver três ou quatro mulheres.'
