  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πάλιν ἑτέρα γραφὴ λέγει· Ὄψονται εἰς ὃν ἐξεκέντησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/037.yaml
  text: And again another Scripture says[a], “They will look on the one whom they pierced.”
translation:
  language: pt
  text: 'E outra passagem da Escritura diz: “Olharão para aquele a quem traspassaram.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Contemplarão aquele a quem traspassaram.” A construção grega indica um olhar dirigido para a pessoa e retoma Zacarias 12:10.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: E outra
  rationale: O valor aditivo de πάλιν é expresso naturalmente pela coordenação com “outra”; em português, “E novamente outra passagem” seria pesado.
- source_word: ἑτέρα γραφή
  choice: outra passagem da Escritura
  rationale: Identifica uma segunda citação bíblica com clareza e naturalidade; “passagem da Escritura” evita a possível estranheza de “outra Escritura”.
- source_word: λέγει
  choice: diz
  rationale: Preserva o presente da fórmula de citação, comum e vívido em português.
- source_word: Ὄψονται
  choice: Olharão
  rationale: Expressa um olhar dirigido, e não apenas percepção visual, adequando-se à construção com εἰς.
- source_word: εἰς ὃν
  choice: para aquele a quem
  rationale: “Olhar para” é a construção corrente em português e mantém o referente pessoal da oração relativa.
- source_word: ἐξεκέντησαν
  choice: traspassaram
  rationale: Verbo tradicional, digno e compreensível para perfuração corporal profunda; corresponde ao contexto imediato da lança e à alusão profética.
theological_decisions:
- issue: Preservar a força cristológica da alusão a Zacarias sem importar para João formulações adicionais do texto profético
  choice: Olharão para aquele a quem traspassaram
  alternative: Olharão para aquele que perfuraram
  rationale: A tradução segue a redação grega de João, identifica naturalmente o traspassado no contexto e não acrescenta a formulação divina em primeira pessoa encontrada em uma forma textual de Zacarias 12:10.
- issue: Direção ou atitude do olhar em εἰς ὃν
  choice: para aquele a quem
  alternative: aquele a quem / sobre aquele a quem
  rationale: A preposição εἰς marca direção para o referente. “Olhar para” é a equivalência portuguesa mais natural, embora o contexto profético possa dar ao olhar uma dimensão maior que a mera visão.
translation_notes:
  register: Português moderno, amplo e digno, com boa legibilidade brasileira. “Traspassaram” conserva a solenidade bíblica sem obscurecer o ato físico; a nota registra a possível nuance mais intensa do verbo de visão.
