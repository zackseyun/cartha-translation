id: JHN.19.19
reference: John 19:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔγραψεν δὲ καὶ τίτλον ὁ Πιλᾶτος καὶ ἔθηκεν ἐπὶ τοῦ σταυροῦ· ἦν δὲ γεγραμμένον· Ἰησοῦς ὁ Ναζωραῖος ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/019.yaml
  text: 'Pilate also wrote an inscription and put it on the cross. It was written: “Jesus the Nazarene[a], the King of the Jews.”'
translation:
  language: pt
  text: 'Pilatos também escreveu uma inscrição e a colocou na cruz. Estava escrito: “Jesus, o Nazareno, o Rei dos Judeus[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Rei dos Judeanos”. O termo grego pode referir-se aos judeus de modo mais amplo ou, conforme o contexto, especificamente aos habitantes da Judeia.
    reason: alternative_reading
lexical_decisions:
- source_word: τίτλον
  choice: inscrição
  rationale: No contexto da crucificação, designa o texto escrito afixado à cruz. “Inscrição” é claro e natural em português moderno.
- source_word: ἔθηκεν ἐπὶ τοῦ σταυροῦ
  choice: a colocou na cruz
  rationale: Representa diretamente a preposição grega ἐπί, sem acrescentar a inferência contextual “acima da cruz”.
- source_word: ἦν δὲ γεγραμμένον
  choice: Estava escrito
  rationale: Expressa de modo idiomático o estado resultante da construção perifrástica grega.
- source_word: Ναζωραῖος
  choice: o Nazareno
  rationale: Preserva o epíteto adjetival/nominal grego, em vez de convertê-lo explicitamente em “de Nazaré”.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: o Rei dos Judeus
  rationale: É a formulação tradicional, natural e contextualmente adequada para a designação régia pública na narrativa da paixão.
- source_word: δὲ καὶ
  choice: também
  rationale: Transmite com naturalidade a força aditiva da combinação de partículas.
- source_word: Πιλᾶτος
  choice: Pilatos
  rationale: Forma portuguesa consagrada do nome próprio.
- source_word: σταυροῦ
  choice: cruz
  rationale: Equivalente padrão e contextualmente apropriado de σταυρός nas narrativas da paixão.
theological_decisions:
- issue: Sentido de Ἰουδαίων na inscrição
  choice: Judeus
  alternative: judeanos
  rationale: Na acusação régia pública, “Judeus” comunica melhor o referente coletivo convencional; a possibilidade lexical mais regional, “judeanos”, é mantida em nota para preservar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e ampla legibilidade brasileira. A repetição de “escreveu/estava escrito” acompanha a estrutura do original sem soar excessivamente rígida.
