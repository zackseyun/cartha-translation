source:
  edition: SBLGNT
  text: ἐκ τούτου ⸂ὁ Πιλᾶτος ἐζήτει⸃ ἀπολῦσαι αὐτόν· οἱ δὲ Ἰουδαῖοι ⸀ἐκραύγασαν λέγοντες· Ἐὰν τοῦτον ἀπολύσῃς, οὐκ εἶ φίλος τοῦ Καίσαρος· πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν ἀντιλέγει τῷ Καίσαρι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/012.yaml
  text: From then on Pilate was seeking to release him. But the Jews shouted, saying, “If you release this man, you are not Caesar’s friend. Everyone who makes himself a king speaks against Caesar.”
translation:
  language: pt
  text: 'A partir de então, Pilatos procurava soltá-lo.[a] Mas os judeus[b] gritaram: “Se você soltar este homem, não é amigo de César. Todo aquele que se faz rei se opõe a César.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por causa disso, Pilatos continuava tentando soltá-lo”. A expressão grega pode ser entendida em sentido temporal (“a partir de então”) ou causal (“por causa disso”).'
    reason: lexical_alternative
  - marker: b
    text: Em João, “os judeus” muitas vezes se refere mais especificamente às autoridades judaicas da Judeia ou a determinados adversários judeus no contexto narrativo, e não necessariamente ao povo judeu como um todo.
    reason: cultural_note
  - marker: c
    text: 'Ou: “fala contra César” ou “se coloca contra César”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτου
  choice: A partir de então
  rationale: Preserva a leitura temporal mais provável no fluxo narrativo, sem eliminar a possível leitura causal, registrada em nota.
- source_word: ἐζήτει
  choice: procurava
  rationale: O imperfeito indica uma ação contínua ou reiterada; “procurava soltá-lo” comunica naturalmente esse aspecto em português.
- source_word: ἀπολῦσαι / ἀπολύσῃς
  choice: soltá-lo / soltar
  rationale: No contexto judicial, “soltar” expressa de modo claro e corrente a libertação da custódia.
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Mas os judeus
  rationale: Mantém a formulação ampla do texto grego sem inserir no corpo da tradução uma identificação mais restrita; a provável referência contextual é esclarecida em nota.
- source_word: ἐκραύγασαν λέγοντες
  choice: gritaram
  rationale: O verbo comunica clamor em voz alta. Em português, “gritaram” introduz naturalmente o discurso direto, tornando desnecessário reproduzir de modo rígido o particípio “dizendo”.
- source_word: τοῦτον
  choice: este homem
  rationale: Reproduz de maneira idiomática a força demonstrativa e o tom potencialmente depreciativo da fala.
- source_word: φίλος τοῦ Καίσαρος
  choice: amigo de César
  rationale: É a formulação portuguesa natural e preserva tanto o sentido comum quanto a possível conotação político-honorífica da expressão.
- source_word: πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν
  choice: Todo aquele que se faz rei
  rationale: Mantém de perto a construção grega, sem reduzi-la interpretativamente a uma mera alegação de realeza.
- source_word: ἀντιλέγει τῷ Καίσαρι
  choice: se opõe a César
  rationale: No contexto da acusação política, ἀντιλέγω expressa oposição a César, não apenas fala verbal contra ele; a alternativa mais formal é preservada em nota.
theological_decisions:
- issue: Referente de “os judeus” no Evangelho de João
  choice: Manter “os judeus” no texto principal.
  alternative: “as autoridades judaicas” ou “os judeus da Judeia”
  rationale: O grego traz οἱ Ἰουδαῖοι sem especificação adicional. Restringir o referente no texto principal resolveria uma questão contextual que o original deixa implícita; a nota previne uma generalização indevida.
- issue: Natureza da oposição expressa por ἀντιλέγει
  choice: Traduzir como “se opõe a César”.
  alternative: “fala contra César”
  rationale: 'A situação é uma ameaça político-jurídica: fazer-se rei implica resistência à autoridade imperial. “Se opõe” comunica esse alcance contextual sem acrescentar uma acusação doutrinária.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe é natural, mas conserva as ambiguidades relevantes do grego por meio de notas. Emprega-se “você” na fala direta por ser corrente e amplamente inteligível; “César” mantém o título imperial tradicional.
