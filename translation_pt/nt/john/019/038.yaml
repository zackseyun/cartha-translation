reference: John 19:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μετὰ ⸀δὲ ταῦτα ἠρώτησεν τὸν Πιλᾶτον Ἰωσὴφ ⸀ἀπὸ Ἁριμαθαίας, ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ διὰ τὸν φόβον τῶν Ἰουδαίων, ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ· καὶ ἐπέτρεψεν ὁ Πιλᾶτος. ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/038.yaml
  text: After these things[a], Joseph from Arimathea, being a disciple of Jesus but having kept it hidden because of fear of the Jews, asked Pilate that he might take away the body of Jesus. And Pilate gave permission. So he came and took away his body.
translation:
  language: pt
  text: Depois dessas coisas, José de Arimateia, que era discípulo de Jesus, mas mantinha isso em segredo por medo dos judeus[a], pediu a Pilatos que lhe permitisse retirar o corpo de Jesus. Pilatos deu permissão. Então ele veio e retirou o corpo de Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente neste contexto, «das autoridades judaicas». João muitas vezes usa «os judeus» para se referir aos que se opunham a Jesus, não ao povo judeu sem distinção.
    reason: Alternativa lexical e esclarecimento contextual para evitar uma generalização étnica indevida.
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Depois dessas coisas
  rationale: Preserva a transição temporal e o plural ταῦτα, mantendo formulação natural em português.
- source_word: Ἰωσὴφ ἀπὸ Ἁριμαθαίας
  choice: José de Arimateia
  rationale: Embora ἀπό indique origem, «de Arimateia» é a forma idiomática e tradicional em português para indicar sua procedência.
- source_word: ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ
  choice: que era discípulo de Jesus, mas mantinha isso em segredo
  rationale: Explicita que o que José ocultava era sua condição de discípulo; «mantinha» também comunica o estado resultante do particípio perfeito.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: por medo dos judeus
  rationale: Tradução concisa e próxima da estrutura grega; a nota esclarece o alcance contextual de Ἰουδαίων.
- source_word: ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ
  choice: que lhe permitisse retirar o corpo de Jesus
  rationale: No contexto do pedido dirigido a Pilatos, explicita naturalmente a permissão pretendida; «retirar» expressa a remoção do corpo.
- source_word: καὶ ἐπέτρεψεν ὁ Πιλᾶτος
  choice: Pilatos deu permissão
  rationale: Expressa com clareza o sentido de conceder autorização, sem acrescentar conteúdo interpretativo.
- source_word: ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα αὐτοῦ
  choice: Então ele foi e retirou o corpo de Jesus
  rationale: «Então» comunica o valor sequencial de οὖν. A repetição do nome elimina em português a possível ambiguidade de «seu corpo» quanto ao referente, e «foi» é contextualmente natural para ἦλθεν visto da perspectiva narrativa.
theological_decisions:
- issue: Referente de τῶν Ἰουδαίων no Evangelho de João
  choice: os judeus, com nota contextual
  alternative: as autoridades judaicas; os judeus da Judeia
  rationale: O texto principal preserva a expressão abrangente do grego sem resolver silenciosamente sua complexidade. A nota evita que ela seja entendida como referência indistinta a todo o povo judeu e indica seu provável foco contextual nos opositores de Jesus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi suavizada sem apagar a progressão narrativa nem a tensão lexical do original.
