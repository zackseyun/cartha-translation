source:
  edition: SBLGNT
  text: ἔλεγον οὖν τῷ Πιλάτῳ οἱ ἀρχιερεῖς τῶν Ἰουδαίων· Μὴ γράφε· Ὁ βασιλεὺς τῶν Ἰουδαίων, ἀλλ’ ὅτι ἐκεῖνος εἶπεν Βασιλεὺς ⸂τῶν Ἰουδαίων εἰμί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/021.yaml
  text: So the chief priests of the Jews were saying to Pilate[a], “Do not write, ‘The King of the Jews,’ but that he said[b], ‘I am King of the Jews.’”
translation:
  language: pt
  text: 'Então os principais sacerdotes dos judeus diziam a Pilatos[a]: “Não escreva: ‘O Rei dos Judeus’, mas sim que ele disse[b]: ‘Sou Rei dos Judeus’.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos judeanos” e “Rei dos Judeanos”. O termo grego pode designar os judeus em geral ou, conforme o contexto, os habitantes da Judeia.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “Sou o Rei dos Judeus”. Embora o grego não use artigo diante de “Rei” nesta frase, o português pode empregá-lo naturalmente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: disseram
  rationale: O imperfeito grego pode retratar a fala em curso, mas, neste contexto narrativo, o pretérito perfeito é a forma mais natural em português para introduzir a intervenção dirigida a Pilatos, sem exigir repetição.
- source_word: οὖν
  choice: Por isso
  rationale: Preserva a conexão inferencial com a inscrição mencionada no contexto anterior.
- source_word: ἀρχιερεῖς
  choice: principais sacerdotes
  rationale: Designa as autoridades sacerdotais dirigentes, sem sugerir que vários ocupavam simultaneamente o cargo singular de sumo sacerdote.
- source_word: τῶν Ἰουδαίων
  choice: dos judeus
  rationale: Mantém a designação político-religiosa reconhecível no relato da paixão; a possibilidade contextual de 'judeus da Judeia' é indicada em nota.
- source_word: Μὴ γράφε
  choice: Não escreva
  rationale: Tradução direta e idiomática da proibição no presente imperativo.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: O Rei dos Judeus
  rationale: Reproduz o teor da inscrição contestada; a inicial maiúscula assinala o uso titular.
- source_word: ἀλλ’ ὅτι
  choice: mas sim que
  rationale: Introduz claramente a formulação corretiva solicitada pelos sacerdotes.
- source_word: ἐκεῖνος
  choice: ele
  rationale: Em português, 'ele' é natural nesta construção; opções como 'aquele homem' tornariam explícito um tom depreciativo possível, mas não obrigatório.
- source_word: εἶπεν
  choice: disse
  rationale: Preserva o sentido simples do verbo, sem acrescentar a ideia interpretativa de alegação.
- source_word: Βασιλεὺς τῶν Ἰουδαίων εἰμί
  choice: Sou Rei dos Judeus
  rationale: A construção predicativa sem artigo corresponde de perto ao grego e é idiomática em português; a forma com artigo também é possível e aparece em nota.
theological_decisions:
- issue: Sentido de Ἰουδαίων no contexto joanino da paixão
  choice: judeus
  alternative: judeus da Judeia / judeanos
  rationale: A expressão integra o título público e político 'Rei dos Judeus'. A tradução principal preserva a formulação tradicional e inteligível, enquanto a nota registra a possível especificidade geográfica do termo.
- issue: Artigo no título predicativo Βασιλεὺς τῶν Ἰουδαίων
  choice: Sou Rei dos Judeus
  alternative: Sou o Rei dos Judeus
  rationale: O grego não traz artigo diante de βασιλεύς nesta oração, embora o português possa empregá-lo naturalmente; a alternativa é mantida em nota para preservar a abertura lexical.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. As aspas distinguem a fala dos sacerdotes das duas formulações propostas para a inscrição.
