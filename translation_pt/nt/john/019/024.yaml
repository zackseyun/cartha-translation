  naturalness: “Tirar sortes” é claro e atual. A sequência fica mais fluida sem “Isso aconteceu”, e “Assim, os soldados fizeram essas coisas” é uma conclusão idiomática e fiel ao resumidor grego.
  terminology: “Vestes” e “roupa” preservam, de modo compreensível, a distinção lexical da citação. “Escritura” é apropriado no uso joanino. A nota de Salmos 22:18 é pertinente.
