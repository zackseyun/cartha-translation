  text: εἶπαν οὖν πρὸς ἀλλήλους· Μὴ σχίσωμεν αὐτόν, ἀλλὰ λάχωμεν περὶ αὐτοῦ τίνος ἔσται· ἵνα ἡ γραφὴ πληρωθῇ ⸂ἡ λέγουσα⸃· Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς καὶ ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον. Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/024.yaml
  text: So they said to one another[a], “Let us not tear it, but cast lots for it to decide whose it will be,” so that the Scripture might be fulfilled that says, “They divided my garments among themselves[b], and for my clothing they cast a lot.” So the soldiers did these things.
translation:
  language: pt
  text: 'Então disseram uns aos outros: “Não vamos rasgá-la; em vez disso, vamos tirar sortes[a] para decidir de quem será”, para que se cumprisse a Escritura[b] que diz: “Repartiram entre si as minhas vestes e lançaram sorte sobre a minha roupa”[c]. Assim, os soldados fizeram essas coisas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: lançar sortes.'
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos não trazem “que diz”.
    reason: textual_variant
  - marker: c
    text: Citação de Salmos 22:18.
    reason: cross_reference
lexical_decisions:
- source_word: σχίσωμεν
  choice: rasgá-la
  rationale: O verbo significa rasgar ou partir. “Rasgar” é a forma natural em português para tecido; o pronome feminino retoma a túnica mencionada no contexto anterior.
- source_word: λάχωμεν
  choice: vamos tirar sortes
  rationale: O verbo se refere à determinação da posse mediante sorteio. “Tirar sortes” comunica com clareza essa prática em português atual.
- source_word: περὶ αὐτοῦ τίνος ἔσται
  choice: para decidir de quem será
  rationale: A formulação explicita de modo idiomático a finalidade do sorteio — determinar quem ficaria com a peça — sem acrescentar conteúdo estranho ao grego.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: Isso aconteceu para que se cumprisse a Escritura
  rationale: Preserva a fórmula joanina de cumprimento e a relação expressa por ἵνα, com uma construção clara e natural em português.
- source_word: Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς
  choice: Repartiram entre si as minhas vestes
  rationale: “Repartiram entre si” representa o sentido distributivo do verbo e do reflexivo dativo; “vestes” mantém o registro digno da citação.
- source_word: ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον
  choice: lançaram sorte sobre a minha roupa
  rationale: Mantém o singular de κλῆρον e distingue ἱματισμόν de ἱμάτια, traduzido anteriormente por “vestes”.
- source_word: Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν
  choice: Foi isso, pois, que os soldados fizeram
  rationale: Conserva a conclusão enfática e o valor resumidor de ταῦτα, em ordem natural no português.
theological_decisions:
- issue: Relação entre a ação dos soldados e o cumprimento da Escritura em ἵνα ἡ γραφὴ πληρωθῇ
  choice: 'Traduzir como declaração de cumprimento: “para que se cumprisse a Escritura”.'
  alternative: 'Entender ἵνα apenas como resultado: “e assim se cumpriu a Escritura”.'
  rationale: A tradução conserva a formulação de finalidade típica de João, mas não acrescenta uma explicação determinista sobre a relação entre a intenção divina e a ação humana.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A citação mantém um tom discretamente elevado por meio de “vestes”, sem arcaísmo excessivo.
