id: JHN.19.40
reference: John 19:40
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔλαβον οὖν τὸ σῶμα τοῦ Ἰησοῦ καὶ ἔδησαν ⸀αὐτὸ ὀθονίοις μετὰ τῶν ἀρωμάτων, καθὼς ἔθος ἐστὶν τοῖς Ἰουδαίοις ἐνταφιάζειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/040.yaml
  text: So they took Jesus’s body and wrapped it in linen cloths with the spices[a], as is the burial custom of the Jews.
translation:
  language: pt
  text: Assim, eles pegaram o corpo de Jesus e o envolveram em faixas de linho com as especiarias, conforme o costume judaico de preparar o corpo para o sepultamento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «conforme é costume entre os judeus sepultar». O verbo grego também pode abranger o preparo do corpo para o sepultamento.
    reason: Preserva a forma mais literal e a amplitude semântica do verbo grego.
lexical_decisions:
- source_word: ἔλαβον
  choice: pegaram
  rationale: Neste contexto, λαμβάνω indica tomar o corpo para realizar os preparativos funerários; «pegaram» é claro e natural.
- source_word: οὖν
  choice: Assim
  rationale: Mantém a ligação consequencial com o versículo anterior sem tornar a narrativa excessivamente formal.
- source_word: σῶμα
  choice: corpo
  rationale: Equivalente direto e digno; «cadáver» seria mais explícito e áspero do que o grego.
- source_word: ἔδησαν
  choice: envolveram
  rationale: Embora δέω possa significar amarrar, aqui descreve o uso funerário das faixas; «envolveram» comunica naturalmente a ação sem sugerir que o corpo foi meramente atado.
- source_word: ὀθονίοις
  choice: em faixas de linho
  rationale: O termo designa peças de tecido de linho usadas no preparo funerário; «faixas» se ajusta ao plural e à ação expressa pelo verbo.
- source_word: ἀρωμάτων
  choice: as especiarias
  rationale: Refere-se às substâncias aromáticas empregadas no preparo funerário; «especiarias» é a expressão bíblica corrente e compreensível.
- source_word: καθὼς
  choice: conforme
  rationale: Expressa que a ação foi realizada em conformidade com um costume estabelecido.
- source_word: ἔθος ἐστὶν
  choice: o costume
  rationale: Reproduz de modo direto a ideia de prática habitual.
- source_word: τοῖς Ἰουδαίοις
  choice: judaico
  rationale: Neste contexto, refere-se à prática funerária dos judeus em sentido cultural e religioso, não especificamente às autoridades nem apenas aos habitantes da Judeia.
- source_word: ἐνταφιάζειν
  choice: preparar o corpo para o sepultamento
  rationale: O verbo pode abranger os preparativos funerários, e não somente o ato final de sepultar; a formulação esclarece a ação descrita no versículo.
theological_decisions:
- issue: Sentido de τοῖς Ἰουδαίοις
  choice: judaico
  alternative: dos judeus; entre os judeus; dos judeanos
  rationale: O contexto trata de uma prática funerária geral do povo judeu. «Judaico» evita atribuir o costume apenas a autoridades ou a moradores da Judeia, preservando o sentido cultural-religioso.
- issue: Extensão semântica de ἐνταφιάζειν
  choice: preparar o corpo para o sepultamento
  alternative: sepultar; enterrar
  rationale: A ação imediata é o preparo funerário com linho e especiarias, antes da colocação no túmulo; a tradução mantém essa amplitude sem reduzir o verbo à inumação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita tecnicismo funerário e preserva a referência cultural sem tom polemizante.
