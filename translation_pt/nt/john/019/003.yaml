  text: καὶ ⸂ἤρχοντο πρὸς αὐτὸν καὶ⸃ ἔλεγον· Χαῖρε, ὁ βασιλεὺς τῶν Ἰουδαίων· καὶ ἐδίδοσαν αὐτῷ ῥαπίσματα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/003.yaml
  text: And they came up to him and said[a], “Hail[b], King of the Jews!” And they were slapping him.
translation:
  language: pt
  text: 'E aproximavam-se dele e diziam[a]: “Salve, rei dos judeus!” E davam-lhe bofetadas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “continuavam se aproximando dele e dizendo”, pois os verbos gregos podem indicar ações repetidas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρχοντο πρὸς αὐτὸν καὶ ἔλεγον
  choice: aproximavam-se dele e diziam
  rationale: Os dois imperfeitos gregos apresentam ações em curso ou repetidas. A formulação portuguesa conserva essa força sem tornar a narrativa artificial.
- source_word: Χαῖρε
  choice: Salve
  rationale: Neste contexto, é uma saudação formal dirigida ironicamente a um suposto rei. “Salve” preserva tanto o tom de aclamação régia quanto a zombaria.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: rei dos judeus
  rationale: Tradução direta e tradicional do título, mantendo sua dimensão política e messiânica no relato da paixão.
- source_word: ἐδίδοσαν αὐτῷ ῥαπίσματα
  choice: davam-lhe bofetadas
  rationale: Reproduz de modo natural a construção idiomática grega “dar golpes/bofetadas” e, com o imperfeito, comunica agressão repetida. “Bofetadas” expressa adequadamente ῥαπίσματα sem acrescentar um instrumento não mencionado.
theological_decisions:
- issue: Tom da saudação dirigida a Jesus
  choice: Manter a forma de aclamação régia “Salve, rei dos judeus!”, cuja ironia surge do contexto
  alternative: Explicitar a zombaria com uma expressão como “Zombavam dele, dizendo”
  rationale: O contexto evidencia o escárnio, mas o texto grego não acrescenta um verbo interpretativo. A tradução preserva a ironia narrativa sem explicá-la dentro do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Salve” mantém o registro solene e irônico da saudação; “bofetadas” é corrente e preciso.
