  text: τότε οὖν παρέδωκεν αὐτὸν αὐτοῖς ἵνα σταυρωθῇ. Παρέλαβον ⸀οὖν τὸν ⸀Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/016.yaml
  text: Then he handed him over to them to be crucified[b][a]. So they took Jesus.
translation:
  language: pt
  text: Então ele o entregou a eles[b] para que fosse crucificado.[a] Então, eles tomaram Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para ser crucificado”.'
    reason: lexical_alternative
  - marker: b
    text: Neste versículo, o texto grego não identifica expressamente quem são “a eles” e “eles”; o contexto imediato orienta a referência.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: Então
  rationale: A combinação marca a consequência e o passo seguinte da narrativa. “Então” exprime essa progressão de modo natural, sem a redundância pouco idiomática de “então, portanto”.
- source_word: παρέδωκεν
  choice: entregou
  rationale: Preserva o sentido de entregar alguém ao controle de outros, adequado ao contexto judicial, sem acrescentar quem são os destinatários.
- source_word: αὐτὸν αὐτοῖς
  choice: o ... a eles
  rationale: Mantém as referências pronominais do grego sem substituir “ele” por “Jesus” nem identificar explicitamente o grupo receptor.
- source_word: ἵνα σταυρωθῇ
  choice: para que fosse crucificado
  rationale: Reproduz a construção de finalidade com voz passiva e conserva aberta a identidade dos executores.
- source_word: οὖν
  choice: Assim
  rationale: Liga a tomada de Jesus à entrega narrada na oração anterior e comunica naturalmente o valor consecutivo do conectivo.
- source_word: Παρέλαβον
  choice: levaram
  rationale: No contexto, o verbo indica que tomaram Jesus consigo ou sob seu controle. “Levaram” é corrente e claro, sem a formalidade de “receberam” nem a explicitação interpretativa de “tomaram sob custódia”.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome.
theological_decisions:
- issue: Identidade de “eles” em αὐτοῖς e no sujeito implícito de Παρέλαβον
  choice: Manter “a eles” e “eles” sem identificar o grupo.
  alternative: Especificar os chefes dos sacerdotes e seus guardas, ou os soldados romanos.
  rationale: O versículo grego emprega referências pronominais e não nomeia o grupo. A tradução preserva essa abertura referencial, deixando que o contexto imediato oriente o leitor.
- issue: Agente da crucificação na oração passiva
  choice: Manter “fosse crucificado” na voz passiva.
  alternative: Explicitar quem o crucificaria.
  rationale: A forma passiva grega não identifica o agente; explicitá-lo resolveria uma questão que o texto deixa sem expressão direta.
translation_notes:
  register: Português atual, digno e acessível, com leitura natural no Brasil e compreensão internacional. Evitou-se tanto a repetição rígida de conectivos quanto a identificação interpretativa dos participantes não nomeados no versículo.
