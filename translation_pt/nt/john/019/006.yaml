  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδον αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ὑπηρέται ἐκραύγασαν λέγοντες· Σταύρωσον ⸀σταύρωσον. λέγει αὐτοῖς ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε, ἐγὼ γὰρ οὐχ εὑρίσκω ἐν αὐτῷ αἰτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/006.yaml
  text: So when the chief priests and the officers saw him[a], they cried out, saying, “Crucify him! Crucify him!” Pilate said to them, “You take him and crucify him[b], for I find no charge against him.”
translation:
  language: pt
  text: 'Assim, quando os chefes dos sacerdotes e os guardas o viram, gritaram: “Crucifique-o! Crucifique-o!” Pilatos lhes disse: “Levem-no vocês mesmos[a] e crucifiquem-no, pois não encontro nele motivo para acusação[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego inclui explicitamente “vocês”, dando ênfase: “Levem-no vocês mesmos e crucifiquem-no”.'
    reason: lexical_emphasis
  - marker: b
    text: 'Ou: “não encontro nele culpa alguma”. O termo grego pode indicar uma acusação, o fundamento para acusar ou culpa; neste contexto, o sentido judicial é predominante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Assim, quando
  rationale: Preserva tanto a progressão narrativa e inferencial de οὖν quanto o valor temporal de ὅτε, em português natural.
- source_word: ἀρχιερεῖς
  choice: chefes dos sacerdotes
  rationale: Designa a liderança sacerdotal de Jerusalém no plural, sem sugerir que houvesse vários sumos sacerdotes em exercício.
- source_word: ὑπηρέται
  choice: guardas
  rationale: No contexto joanino, refere-se a subordinados a serviço das autoridades judaicas; “guardas” é claro e corrente, sem acrescentar no texto principal uma vinculação explícita ao templo.
- source_word: ἐκραύγασαν λέγοντες
  choice: gritaram
  rationale: O verbo expressa um clamor em voz alta; em português, “gritaram” incorpora naturalmente a função introdutória do particípio λέγοντες.
- source_word: Σταύρωσον σταύρωσον
  choice: Crucifique-o! Crucifique-o!
  rationale: Mantém a repetição enfática. O pronome objeto, implícito no grego por estar claro no contexto, é expresso para que a ordem soe natural em português.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: Levem-no vocês mesmos
  rationale: O pronome explícito ὑμεῖς é enfático e contrasta os interlocutores com Pilatos; “vocês mesmos” preserva essa ênfase.
- source_word: σταυρώσατε
  choice: crucifiquem-no
  rationale: Equivalente direto e preciso do imperativo aoristo, com o objeto expresso naturalmente em português.
- source_word: αἰτίαν
  choice: motivo para acusação
  rationale: No cenário judicial, indica fundamento ou causa para uma acusação. A formulação mantém o sentido forense sem transformar a declaração em uma afirmação teológica mais ampla.
theological_decisions:
- issue: A declaração de Pilatos sobre a inocência de Jesus
  choice: não encontro nele motivo para acusação
  alternative: não encontro nele culpa alguma
  rationale: A opção principal conserva o caráter jurídico de αἰτία e apresenta a avaliação judicial de Pilatos, sem resolver o termo como uma declaração doutrinária geral. A alternativa tradicional é legítima, mas menos especificamente forense.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das frases acompanha o movimento do grego sem produzir sintaxe artificial. A repetição da ordem de crucificação e a ênfase de ὑμεῖς foram preservadas.
