id: JHN.19.42
reference: John 19:42
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐκεῖ οὖν διὰ τὴν παρασκευὴν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν τὸ μνημεῖον, ἔθηκαν τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/042.yaml
  text: So there[a], because of the Jews’ day of preparation, since the tomb was nearby, they laid Jesus there.
translation:
  language: pt
  text: Assim, por causa do dia de preparação dos judeus[a] e porque o túmulo ficava perto, puseram Jesus ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa do dia judaico de preparação”; ou: “por causa da Preparação dos judeus”.'
    reason: Alternativas lexicais que refletem outras maneiras possíveis de entender e expressar a construção παρασκευὴ τῶν Ἰουδαίων.
lexical_decisions:
- source_word: ἐκεῖ
  choice: ali
  rationale: Advérbio locativo que retoma o lugar do sepultamento; sua colocação no fim da frase é natural em português e torna explícito onde Jesus foi posto.
- source_word: οὖν
  choice: Assim
  rationale: Mantém a ideia de consequência ou continuação narrativa de modo corrente e conciso.
- source_word: διὰ τὴν παρασκευὴν
  choice: por causa do dia de preparação
  rationale: διά com acusativo expressa causa. A forma expandida esclarece ao leitor moderno que παρασκευή designa o dia de preparação, sem especificar além do texto para qual sábado ou festa se preparavam.
- source_word: τῶν Ἰουδαίων
  choice: dos judeus
  rationale: Reproduz o genitivo grego sem decidir indevidamente entre associação étnica, religiosa ou costumeira.
- source_word: ὅτι
  choice: e porque
  rationale: Introduz a razão adicional ligada à proximidade do túmulo; a conjunção 'e' organiza naturalmente em português as duas circunstâncias causais.
- source_word: ἐγγὺς
  choice: perto
  rationale: Expressa com clareza e naturalidade a proximidade do túmulo.
- source_word: μνημεῖον
  choice: túmulo
  rationale: É o termo português corrente e preciso para o lugar de sepultamento neste contexto.
- source_word: ἔθηκαν
  choice: puseram
  rationale: Traduz de modo natural o ato de colocar o corpo de Jesus no túmulo; 'depositaram' seria mais interpretativo e formal.
- source_word: τὸν Ἰησοῦν
  choice: Jesus
  rationale: Forma portuguesa consagrada do nome próprio e objeto direto do verbo.
theological_decisions:
- issue: Sentido de παρασκευή no contexto da Paixão
  choice: dia de preparação
  alternative: Preparação
  rationale: A expressão explica o termo calendárico ao leitor atual, mas não acrescenta uma identificação mais específica do dia do que aquela dada pelo próprio versículo.
- issue: Sentido de τῶν Ἰουδαίων na narrativa joanina
  choice: dos judeus
  alternative: judaico
  rationale: Preserva de perto a construção genitiva e a tensão da formulação de João, sem convertê-la em juízo teológico ou generalização sobre o povo judeu.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase foi ajustada ao uso natural do português, mantendo as duas razões expressas no grego e reservando 'ali' para o fim, onde completa naturalmente a indicação do sepultamento.
