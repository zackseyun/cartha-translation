  text: ⸂καὶ ἐξῆλθεν⸃ πάλιν ἔξω ὁ Πιλᾶτος καὶ λέγει αὐτοῖς· Ἴδε ἄγω ὑμῖν αὐτὸν ἔξω, ἵνα γνῶτε ὅτι ⸂οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/004.yaml
  text: Then Pilate went outside again and said to them[a], “Look, I am bringing him out to you so that you may know that I find no case against him.”
translation:
  language: pt
  text: 'Então Pilatos saiu outra vez e lhes disse: “Vejam, eu o trago para fora, para que vocês saibam que não encontro nele nenhum fundamento para acusação.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não encontro nele culpa alguma”. A expressão grega tem sentido judicial e também pode ser traduzida como “não encontro nenhuma acusação contra ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: saiu
  rationale: O verbo e o advérbio indicam movimento para fora. Em português, “saiu” expressa isso naturalmente sem redundância.
- source_word: πάλιν
  choice: outra vez
  rationale: Marca a repetição da ação e soa natural na narrativa.
- source_word: λέγει
  choice: disse
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma normal na narrativa portuguesa.
- source_word: Ἴδε
  choice: Vejam
  rationale: Funciona como chamado de atenção dirigido ao grupo; “Vejam” é atual e preserva o valor demonstrativo do imperativo.
- source_word: ἄγω ... αὐτὸν ἔξω
  choice: eu o trago para fora
  rationale: ἄγω pode significar conduzir ou trazer. Aqui Pilatos apresenta Jesus aos que estão do lado de fora; a formulação mantém tanto a ação quanto a direção espacial.
- source_word: ἵνα γνῶτε
  choice: para que vocês saibam
  rationale: Preserva claramente o valor de propósito de ἵνα com o subjuntivo.
- source_word: οὐδεμίαν αἰτίαν
  choice: motivo algum para acusação
  rationale: No contexto judicial, αἰτία designa fundamento, causa ou acusação. A expressão comunica o sentido forense sem sugerir que já existia uma acusação formal específica válida.
- source_word: εὑρίσκω ἐν αὐτῷ
  choice: não encontro nele
  rationale: Mantém a construção locativa do grego em português natural, ligada a “motivo algum para acusação”.
theological_decisions:
- issue: Formulação judicial da declaração de Pilatos sobre Jesus
  choice: não encontro nele motivo algum para acusação
  alternative: não encontro nele culpa alguma
  rationale: A escolha conserva o caráter jurídico de αἰτία e apresenta a avaliação de Pilatos sem ampliar a frase, por si só, para uma declaração teológica geral. A alternativa tradicional permanece legítima e é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” torna explícito o plural de ὑμῖν e combina com “Vejam”. A ordem da fala permanece próxima ao grego sem soar artificial.
