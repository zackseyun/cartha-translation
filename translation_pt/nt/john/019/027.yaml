source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ μαθητῇ· ⸀Ἴδε ἡ μήτηρ σου. καὶ ἀπ’ ἐκείνης τῆς ὥρας ἔλαβεν ὁ μαθητὴς αὐτὴν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/027.yaml
  text: Then he said to the disciple, “Look, your mother.” And from that hour the disciple took her into his own home.
translation:
  language: pt
  text: 'Então disse ao discípulo: “Aí está a sua mãe.” A partir daquela hora, o discípulo a acolheu em sua casa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: Aí está
  rationale: Expressa de modo natural e digno a apresentação enfática feita por Jesus, sem recorrer ao arcaísmo “Eis” nem reduzir a expressão a uma ordem literal para olhar.
- source_word: ἀπ’ ἐκείνης τῆς ὥρας
  choice: daquela hora em diante
  rationale: Reproduz o valor temporal da expressão grega e deixa claro que a ação começou naquele momento e continuou depois.
- source_word: ἔλαβεν
  choice: recebeu
  rationale: Preserva o sentido básico de acolher ou tomar consigo, adequado ao contexto sem explicitar além do que o verbo afirma.
- source_word: εἰς τὰ ἴδια
  choice: em sua casa
  rationale: No contexto, a expressão idiomática indica o âmbito doméstico ou aquilo que lhe pertencia; “em sua casa” comunica isso com clareza em português corrente.
theological_decisions:
- issue: Natureza da relação declarada entre Maria e o discípulo
  choice: “Aí está a sua mãe”
  alternative: “Eis a sua mãe” ou uma explicitação de maternidade espiritual universal
  rationale: Mantém a declaração direta e sua tensão teológica sem acrescentar uma interpretação eclesiológica ou denominacional não expressa no versículo.
- issue: Extensão do acolhimento de Maria
  choice: “a recebeu em sua casa”
  alternative: “tomou-a como sua”
  rationale: O contexto favorece acolhimento doméstico, mas a tradução evita inferir detalhes específicos sobre tutela, propriedade ou residência permanente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A formulação evita tanto o arcaísmo “Eis” quanto o coloquialismo excessivo. Nenhuma nota de rodapé é necessária.
