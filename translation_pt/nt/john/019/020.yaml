id: JHN.19.20
reference: John 19:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτον οὖν τὸν τίτλον πολλοὶ ἀνέγνωσαν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν ὁ τόπος τῆς πόλεως ὅπου ἐσταυρώθη ὁ Ἰησοῦς· καὶ ἦν γεγραμμένον Ἑβραϊστί, ⸂Ῥωμαϊστί, Ἑλληνιστί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/020.yaml
  text: Therefore many of the Jews read this inscription[a], because the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek.
translation:
  language: pt
  text: Por isso, muitos dos judeus leram essa inscrição[a], pois o lugar onde Jesus foi crucificado ficava perto da cidade; e ela estava escrita em hebraico, latim e grego.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “em aramaico”; João usa “hebraico” para a língua semítica local.
    reason: alternativa lexical
lexical_decisions:
- source_word: τίτλον
  choice: inscrição
  rationale: No contexto da crucificação, refere-se ao texto escrito afixado à cruz; “inscrição” é natural e preciso em português.
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: muitos dos judeus
  rationale: Preserva o sentido partitivo do genitivo e evita generalizar a afirmação a todos os judeus.
- source_word: ἀνέγνωσαν
  choice: leram
  rationale: Expressa diretamente a ação, sem acrescentar a ideia não explícita de leitura em voz alta.
- source_word: ἐγγὺς ἦν ὁ τόπος τῆς πόλεως
  choice: o lugar ... ficava perto da cidade
  rationale: Reproduz o sentido espacial com formulação idiomática, sem acrescentar referência a uma porta da cidade.
- source_word: ὅπου ἐσταυρώθη ὁ Ἰησοῦς
  choice: onde Jesus foi crucificado
  rationale: Mantém naturalmente a voz passiva do grego, sem explicitar um agente.
- source_word: ἦν γεγραμμένον
  choice: estava escrita
  rationale: A construção perifrástica com particípio perfeito descreve o estado resultante da inscrição; o feminino concorda naturalmente com “inscrição” em português.
- source_word: Ἑβραϊστί
  choice: em hebraico
  rationale: Mantém no texto principal a designação usada pelo grego; a possível referência ao aramaico é registrada em nota.
- source_word: Ῥωμαϊστί
  choice: em latim
  rationale: Embora a forma signifique literalmente “à maneira romana”, seu referente idiomático é a língua latina.
- source_word: Ἑλληνιστί
  choice: em grego
  rationale: Tradução direta e corrente do advérbio de língua.
- source_word: οὖν
  choice: Por isso
  rationale: Marca de modo natural a ligação lógica e narrativa com o versículo anterior.
theological_decisions:
- issue: Sentido de Ἑβραϊστί no uso joanino
  choice: hebraico no texto principal
  alternative: aramaico
  rationale: O texto grego emprega a designação “hebraico”, que deve ser preservada; como ela pode designar a língua semítica local, possivelmente o aramaico, essa alternativa é indicada em nota sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ficava” evita uma sequência pesada de formas de “estar”, enquanto “estava escrita” preserva o estado resultante indicado pela construção grega.
