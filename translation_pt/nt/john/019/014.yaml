id: JHN.19.14
reference: John 19:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἦν δὲ παρασκευὴ τοῦ πάσχα, ὥρα ⸂ἦν ὡς⸃ ἕκτη. καὶ λέγει τοῖς Ἰουδαίοις· Ἴδε ὁ βασιλεὺς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/014.yaml
  text: It was the day of preparation of the Passover[a]; it was about the sixth hour. And he says to the Jews, “Behold[b], your king!”
translation:
  language: pt
  text: Era o dia da preparação da Páscoa; era por volta da hora sexta.[a] E ele diz aos judeus:[b] “Eis o rei de vocês!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente em termos modernos, “por volta do meio-dia”, dependendo de como as horas são contadas.
    reason: cultural_note
  - marker: b
    text: Neste contexto, “os judeus” pode referir-se mais especificamente às autoridades da Judeia ou aos líderes judeus.
    reason: alternative_reading
lexical_decisions:
- source_word: παρασκευὴ τοῦ πάσχα
  choice: o dia da preparação da Páscoa
  rationale: Expressa de modo natural o valor temporal de παρασκευή e mantém a relação genitiva com a Páscoa sem decidir além do que o grego afirma.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: era por volta da hora sexta
  rationale: Preserva a forma antiga de indicar as horas e a aproximação marcada por ὡς, sem resolver no texto principal a questão do sistema de contagem.
- source_word: λέγει
  choice: ele diz
  rationale: Mantém o presente histórico característico da narrativa joanina e sua vivacidade.
- source_word: τοῖς Ἰουδαίοις
  choice: aos judeus
  rationale: Traduz diretamente a expressão grega, deixando em nota a possível referência contextual mais restrita às autoridades ou lideranças judaicas.
- source_word: Ἴδε
  choice: Eis
  rationale: Conserva a força solene e demonstrativa da exclamação na apresentação pública de Jesus.
- source_word: ὁ βασιλεὺς ὑμῶν
  choice: o rei de vocês
  rationale: Formulação natural e amplamente compreensível em português, preservando a ênfase política e irônica da declaração.
theological_decisions:
- issue: Referência de τοῖς Ἰουδαίοις no Evangelho de João
  choice: Manter “aos judeus” no texto principal
  alternative: “às autoridades judaicas” ou “aos líderes judeus”
  rationale: O versículo não restringe explicitamente o referente; a nota conserva a possibilidade contextual mais específica sem inseri-la no texto.
- issue: Sistema de contagem da “hora sexta”
  choice: Preservar a expressão antiga no texto principal
  alternative: “por volta do meio-dia”
  rationale: A tradução mantém a forma do texto e evita solucionar silenciosamente a questão cronológica, oferecendo a equivalência moderna possível em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Eis” preserva a solenidade da cena; “de vocês” evita uma forma excessivamente regional ou arcaica. Os marcadores de nota foram posicionados imediatamente após as expressões que esclarecem.
