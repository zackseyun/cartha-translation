reference: John 19:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ οὖν Πιλᾶτος ἀκούσας ⸂τῶν λόγων τούτων⸃ ἤγαγεν ἔξω τὸν Ἰησοῦν, καὶ ἐκάθισεν ⸀ἐπὶ βήματος εἰς τόπον λεγόμενον Λιθόστρωτον, Ἑβραϊστὶ δὲ Γαββαθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/013.yaml
  text: So when Pilate heard these words[a], he brought Jesus outside and sat down on the judgment seat at a place called the Stone Pavement, and in Hebrew[b], Gabbatha.
translation:
  language: pt
  text: Então, Pilatos, ao ouvir essas palavras, levou Jesus para fora e sentou-se no tribunal, num lugar chamado Pavimento de Pedra, que, em hebraico, se chama Gábata.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fez Jesus sentar-se no tribunal”. O verbo grego pode ser entendido como transitivo, embora seja mais provável que Pilatos tenha se sentado no tribunal.'
    reason: alternative_reading
  - marker: b
    text: “Em hebraico” provavelmente se refere à língua semítica local, possivelmente o aramaico, como em outros lugares de João.
    reason: cultural_note
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação e a consequência narrativa da fala anterior de modo natural em português.
- source_word: ἀκούσας τῶν λόγων τούτων
  choice: ao ouvir essas palavras
  rationale: Traduz o particípio aoristo com valor temporal; λόγων se refere às palavras que acabavam de ser ditas.
- source_word: ἤγαγεν ἔξω τὸν Ἰησοῦν
  choice: levou Jesus para fora
  rationale: Expressa claramente o movimento para fora sem acrescentar a ideia mais específica de condução a pé.
- source_word: ἐκάθισεν ἐπὶ βήματος
  choice: sentou-se no tribunal
  rationale: No contexto judicial, βῆμα designa o assento ou estrado oficial de julgamento. A leitura mais provável toma Pilatos como sujeito, embora a construção admita outra análise, registrada em nota.
- source_word: εἰς τόπον λεγόμενον Λιθόστρωτον
  choice: no lugar chamado Pavimento de Pedra
  rationale: O destino do movimento passa a ser o local da ação seguinte; Λιθόστρωτον tem sentido transparente e é traduzido como nome do lugar.
- source_word: Ἑβραϊστὶ δὲ Γαββαθα
  choice: e, em hebraico, Gábata
  rationale: Preserva a designação linguística do texto grego; δέ é levemente conectivo, e Γαββαθα é transliterado como nome próprio.
theological_decisions:
- issue: Sujeito e valor de ἐκάθισεν
  choice: Pilatos sentou-se no tribunal
  alternative: Pilatos fez Jesus sentar-se no tribunal
  rationale: A forma grega pode ser entendida de modo intransitivo ou transitivo. O contexto judicial e a sintaxe mais natural favorecem Pilatos tomando seu lugar no tribunal, mas a alternativa é genuína e interpretativamente relevante, por isso é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tribunal” comunica aqui o assento ou estrado judicial, não apenas a instituição. Os marcadores [a] e [b] aparecem no texto principal.
