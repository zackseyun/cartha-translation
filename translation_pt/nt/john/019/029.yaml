base_translation:
  language: en
  yaml_path: translation/nt/john/019/029.yaml
  text: A container full of sour wine was lying there[b][a]; so they put a sponge full of the sour wine on hyssop and brought it to his mouth.
translation:
  language: pt
  text: Havia ali um recipiente cheio de vinho azedo[a]. Então, puseram no hissopo[b] uma esponja cheia de vinho azedo e levaram-na à boca dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vinagre”. O termo grego pode designar vinho azedo ou vinagre; aqui, provavelmente se refere à bebida de vinho azedo disponível aos soldados.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “num ramo de hissopo”; ou: “com hissopo”. O grego diz apenas “no/com hissopo”, e a forma exata como ele foi usado é discutida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεῦος
  choice: recipiente
  rationale: Termo geral e natural em português, sem especificar indevidamente se era vaso, jarro ou outro tipo de objeto.
- source_word: ἔκειτο
  choice: havia ali
  rationale: Expressa com naturalidade o sentido estativo e a localização do recipiente na cena, sem sugerir uma ação não declarada.
- source_word: ὄξος
  choice: vinho azedo
  rationale: No contexto, designa provavelmente a bebida barata de vinho avinagrado consumida por soldados; evita a impressão de que se tratava apenas de vinagre culinário.
- source_word: μεστόν
  choice: cheio de / embebida
  rationale: “Cheio de” reproduz diretamente a descrição do recipiente; para a esponja, “embebida” comunica a mesma ideia de modo idiomático em português.
- source_word: σπόγγον
  choice: uma esponja
  rationale: Equivalente lexical direto e corrente.
- source_word: οὖν
  choice: então
  rationale: Marca a sequência ou consequência narrativa de forma clara e natural.
- source_word: ὑσσώπῳ
  choice: no hissopo
  rationale: Mantém o termo botânico e a construção concisa do grego sem acrescentar “ramo”, que não está explícito, nem decidir se o dativo indica suporte ou instrumento.
- source_word: περιθέντες
  choice: puseram
  rationale: Verbo simples que representa a ação anterior ao ato de levar a esponja à boca, sem definir além do texto como ela foi presa ou apoiada.
- source_word: προσήνεγκαν
  choice: levaram
  rationale: Comunica o movimento de aproximar ou apresentar a esponja à boca de Jesus sem acrescentar que ele bebeu.
- source_word: αὐτοῦ τῷ στόματι
  choice: à boca dele
  rationale: Reproduz naturalmente a referência pronominal e a construção dativa do original.
theological_decisions:
- issue: Possível ressonância histórica e cultual de ὑσσώπῳ
  choice: Conservar “hissopo” no texto principal sem explicar seu simbolismo.
  alternative: Traduzir de modo mais interpretativo como “ramo de hissopo” ou substituir por “haste”.
  rationale: A menção pode evocar a Páscoa e ritos de purificação, mas o versículo não explicita essa associação. Manter “hissopo” preserva a possível ressonância teológica sem impor uma interpretação.
- issue: Natureza de ὄξος
  choice: Traduzir como “vinho azedo”.
  alternative: Traduzir como “vinagre”.
  rationale: “Vinho azedo” representa melhor a bebida histórica provável, enquanto a nota conserva a amplitude lexical do termo grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação evita especificar o tipo de recipiente, preserva “hissopo” e mantém aberta a relação instrumental ou espacial indicada pelo dativo grego.
