source:
  edition: SBLGNT
  text: ⸂ἐκραύγασαν οὖν ἐκεῖνοι⸃· Ἆρον ἆρον, σταύρωσον αὐτόν. λέγει αὐτοῖς ὁ Πιλᾶτος· Τὸν βασιλέα ὑμῶν σταυρώσω; ἀπεκρίθησαν οἱ ἀρχιερεῖς· Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/015.yaml
  text: So they cried out[a], “Away, away! Crucify him!” Pilate said to them, “Shall I crucify your king?” The chief priests answered, “We have no king except Caesar.”
translation:
  language: pt
  text: 'Então eles gritaram: “Fora! Fora! Crucifique-o!” Pilatos lhes perguntou: “Devo crucificar o rei de vocês?” Os principais sacerdotes responderam: “Não temos rei a não ser César.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não temos outro rei senão César.”'
    reason: Alternativa idiomática para a construção exclusiva εἰ μὴ, com o mesmo sentido básico.
lexical_decisions:
- source_word: ἐκραύγασαν οὖν ἐκεῖνοι
  choice: Então eles gritaram
  rationale: “Então” expressa a progressão ou consequência marcada por οὖν; “gritaram” comunica de modo natural a intensidade de ἐκραύγασαν, enquanto o pronome basta para ἐκεῖνοι no contexto.
- source_word: Ἆρον ἆρον
  choice: Fora! Fora!
  rationale: A repetição preserva a urgência dos imperativos. Neste contexto judicial, “Fora!” funciona como clamor idiomático por sua retirada sem acrescentar um objeto ausente no grego.
- source_word: σταύρωσον αὐτόν
  choice: Crucifique-o
  rationale: “Crucificar” é o termo histórico e convencionalmente adequado para σταυρόω no contexto romano; o pronome representa αὐτόν.
- source_word: λέγει αὐτοῖς ὁ Πιλᾶτος
  choice: Pilatos lhes perguntou
  rationale: O presente histórico λέγει é vertido no passado, natural na narrativa portuguesa. Como introduz uma pergunta direta, “perguntou” explicita corretamente a função discursiva.
- source_word: Τὸν βασιλέα ὑμῶν σταυρώσω;
  choice: Devo crucificar o rei de vocês?
  rationale: “Devo” representa naturalmente o subjuntivo deliberativo σταυρώσω. “O rei de vocês” mantém a formulação incisiva de Pilatos e oferece ampla clareza no português moderno.
- source_word: οἱ ἀρχιερεῖς
  choice: os principais sacerdotes
  rationale: No plural, ἀρχιερεῖς designa as autoridades sacerdotais dirigentes, não vários ocupantes simultâneos do cargo singular de sumo sacerdote.
- source_word: Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα
  choice: Não temos rei a não ser César
  rationale: “A não ser” expressa a exceção exclusiva de εἰ μὴ de forma clara e atual, preservando a força contundente da declaração.
theological_decisions:
- issue: Declaração de lealdade política dos principais sacerdotes
  choice: Não temos rei a não ser César
  alternative: Não temos outro rei senão César
  rationale: A formulação mantém a exclusividade e a tensão narrativa da declaração, sem explicar suas implicações teológicas nem introduzir uma conclusão doutrinária além do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por “vocês” para ὑμῶν. A fala da multidão permanece breve e veemente; a pergunta de Pilatos conserva seu caráter provocador. O marcador foi colocado junto à frase à qual a variante lexical realmente se refere.
