id: JHN.19.9
reference: John 19:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἰσῆλθεν εἰς τὸ πραιτώριον πάλιν καὶ λέγει τῷ Ἰησοῦ· Πόθεν εἶ σύ; ὁ δὲ Ἰησοῦς ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/009.yaml
  text: And he entered the governor’s headquarters again and said to Jesus[a], “Where are you from?” But Jesus gave him no answer.
translation:
  language: pt
  text: 'Ele entrou novamente na sede do governador[a] e disse a Jesus: “De onde você é?” Jesus, porém, não lhe deu resposta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pretório”, a residência oficial ou sede do governador romano.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: entrou
  rationale: O aoristo de εἰσέρχομαι indica movimento para dentro; “entrou” é direto, natural e conciso em português.
- source_word: πραιτώριον
  choice: sede do governador
  rationale: O termo designa a residência oficial ou sede administrativa do governador romano. “Sede do governador” comunica sua função de modo claro, sem depender do empréstimo menos conhecido “pretório”.
- source_word: πάλιν
  choice: novamente
  rationale: O advérbio indica repetição da ação; “novamente” preserva esse sentido com naturalidade.
- source_word: λέγει
  choice: disse
  rationale: Embora o grego empregue o presente histórico, o pretérito é mais natural na narrativa portuguesa e não altera o sentido.
- source_word: Πόθεν εἶ σύ
  choice: De onde você é?
  rationale: A pergunta trata da origem de Jesus. Esta formulação é idiomática no português moderno e mantém a possível profundidade da pergunta sem explicá-la.
- source_word: ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ
  choice: não lhe deu resposta
  rationale: Preserva de perto a construção grega, literalmente “não lhe deu resposta”, e soa natural e digna em português.
- source_word: καὶ ... καὶ ... δὲ
  choice: '... e ... porém'
  rationale: A coordenação mantém o fluxo narrativo, enquanto “porém” expressa o contraste introduzido por δέ entre a pergunta e o silêncio de Jesus.
theological_decisions:
- issue: Referente do sujeito implícito de εἰσῆλθεν e λέγει
  choice: Usar o pronome “ele”, cujo referente contextual é Pilatos.
  alternative: Explicitar “Pilatos” no texto principal.
  rationale: O grego deixa o sujeito implícito, mas o contexto o identifica claramente como Pilatos. O pronome acompanha mais de perto a forma da fonte sem acrescentar explicitação desnecessária.
- issue: Alcance da pergunta “De onde você é?”
  choice: Manter a pergunta sem explicar se ela trata de origem geográfica ou celestial.
  alternative: Explicitar uma origem divina, celestial ou geográfica.
  rationale: Πόθεν pergunta pela origem, e o contexto joanino permite ressonâncias mais amplas. A tradução preserva essa ambiguidade em vez de resolvê-la teologicamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O marcador foi colocado imediatamente após “sede do governador”, expressão à qual a nota lexical se refere.
