  text: ὅπου αὐτὸν ἐσταύρωσαν, καὶ μετ’ αὐτοῦ ἄλλους δύο ἐντεῦθεν καὶ ἐντεῦθεν, μέσον δὲ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/018.yaml
  text: where they crucified him[a], and with him two others, one on each side, and Jesus in the middle.
translation:
  language: pt
  text: onde o crucificaram e, com ele, outros dois, um de cada lado, e Jesus no meio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: onde
  rationale: Advérbio relativo locativo direto e natural em português, retomando o lugar mencionado no contexto.
- source_word: ἐσταύρωσαν
  choice: o crucificaram
  rationale: Expressa com precisão o sentido de σταυρόω no relato da paixão, sem acrescentar detalhes sobre o método.
- source_word: μετ’ αὐτοῦ
  choice: com ele
  rationale: Μετά com genitivo indica associação ou acompanhamento; a formulação é concisa e natural.
- source_word: ἄλλους δύο
  choice: outros dois
  rationale: Mantém a expressão grega sem acrescentar o substantivo 'homens', ausente no original.
- source_word: ἐντεῦθεν καὶ ἐντεῦθεν
  choice: um de cada lado
  rationale: Reproduz de modo idiomático e claro a distribuição dos dois em lados opostos.
- source_word: μέσον δὲ τὸν Ἰησοῦν
  choice: e Jesus no meio
  rationale: Preserva a posição central explicitamente atribuída a Jesus e trata δέ como conexão leve.
theological_decisions:
- issue: Explicitar que Jesus estava entre os outros dois
  choice: um de cada lado, e Jesus no meio
  alternative: com Jesus entre eles
  rationale: 'A redação conserva separadamente as duas afirmações espaciais do grego: os outros estavam distribuídos pelos lados, e Jesus ocupava a posição central, sem condensá-las numa formulação mais interpretativa.'
translation_notes:
  register: Português moderno, digno e acessível, com construção espacial natural. Não foi incluída nota, pois a alternativa inglesa assinalada apenas oferece uma formulação mais compacta, sem variante textual ou diferença relevante de sentido.
