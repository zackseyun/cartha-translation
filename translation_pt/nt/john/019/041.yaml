  verdict: revise
  source_fidelity: A estrutura da frase, a repetição de «jardim», «túmulo novo» e a passiva «foi crucificado» refletem bem o grego. Contudo, «havia sido sepultado» especifica a ação como sepultamento, enquanto τεθειμένος diz mais literalmente que ninguém havia sido posto/deitado no túmulo. Embora o contexto seja funerário, essa especificação pode ser evitada sem perda de naturalidade.
  naturalness: O texto é claro, moderno e natural para leitores brasileiros e internacionais. «Onde ninguém ainda havia sido colocado» é um pouco mais formal do que «sepultado», mas permanece claro e adequado ao registro narrativo.
  terminology: «Lugar», «jardim» e «túmulo» são escolhas adequadas. «Colocado» preserva melhor a amplitude semântica de τεθειμένος do que «sepultado», mantendo o contexto funerário por meio de «túmulo».
  issues:
