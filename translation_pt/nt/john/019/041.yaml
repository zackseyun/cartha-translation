  text: ἦν δὲ ἐν τῷ τόπῳ ὅπου ἐσταυρώθη κῆπος, καὶ ἐν τῷ κήπῳ μνημεῖον καινόν, ἐν ᾧ οὐδέπω οὐδεὶς ⸂ἦν τεθειμένος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/041.yaml
  text: In the place where he was crucified there was a garden, and in the garden a new tomb, in which no one had yet been laid.
translation:
  language: pt
  text: No lugar onde ele foi crucificado havia um jardim e, no jardim, um túmulo novo, onde ninguém ainda havia sido colocado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: não traduzido de forma explícita
  rationale: A partícula marca uma transição narrativa leve. Em português, o encadeamento com o contexto já comunica essa função, e acrescentar «então» ou «ora» poderia sugerir uma força temporal ou contrastiva indevida.
- source_word: τόπῳ
  choice: lugar
  rationale: Equivalente direto, natural e suficientemente amplo para o cenário narrativo.
- source_word: ὅπου ἐσταυρώθη
  choice: onde ele foi crucificado
  rationale: Mantém a voz passiva do grego e recupera do contexto o sujeito pronominal implícito, sem introduzir um agente humano explícito.
- source_word: κῆπος
  choice: jardim
  rationale: É o sentido comum do termo e evita a especificidade não expressa de «pomar».
- source_word: μνημεῖον
  choice: túmulo
  rationale: No contexto funerário, designa o local de sepultamento e é mais preciso do que o termo genérico «sepultura».
- source_word: καινόν
  choice: novo
  rationale: Traduz diretamente o adjetivo; a oração seguinte esclarece que o túmulo ainda não tinha sido usado.
- source_word: ἐν ᾧ
  choice: onde
  rationale: Retoma naturalmente «túmulo» em português e evita a construção mais pesada «no qual».
- source_word: οὐδέπω οὐδεὶς
  choice: ninguém ainda
  rationale: Preserva tanto a negação universal quanto o valor temporal de «ainda não» em ordem idiomática portuguesa.
- source_word: ἦν τεθειμένος
  choice: havia sido sepultado
  rationale: A construção perifrástica indica um estado resultante anterior. «Sepultado» expressa naturalmente, neste contexto, a ação de colocar alguém em um túmulo, sem alterar o sentido narrativo.
theological_decisions:
- issue: Terminologia funerária de μνημεῖον e ἦν τεθειμένος
  choice: túmulo ... havia sido sepultado
  alternative: sepultura ... havia sido colocado
  rationale: A formulação escolhida comunica com naturalidade o cenário concreto do sepultamento. Não acrescenta uma interpretação doutrinária; apenas torna explícito em português o sentido contextual de colocar um corpo num túmulo.
- issue: Voz de ἐσταυρώθη
  choice: ele foi crucificado
  alternative: eles o crucificaram
  rationale: A voz passiva preserva a forma da fonte e evita acrescentar nesta oração um agente que o grego não nomeia.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A repetição de «jardim» foi mantida por refletir a estrutura enfática do original; não há marcadores de nota de rodapé porque nenhuma nota é necessária.
