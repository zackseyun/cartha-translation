  text: ἀπεκρίθησαν αὐτῷ οἱ Ἰουδαῖοι· Ἡμεῖς νόμον ἔχομεν, καὶ κατὰ τὸν ⸀νόμον ὀφείλει ἀποθανεῖν, ὅτι ⸂υἱὸν θεοῦ ἑαυτὸν⸃ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/007.yaml
  text: The Jews answered him[a], “We have a law, and according to that law he ought to die[b], because he made himself the Son of God.”
translation:
  language: pt
  text: 'Os judeus[a] lhe responderam: “Temos uma lei e, segundo essa lei, ele deve morrer, porque se fez Filho de Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em João, “os judeus” pode designar, conforme o contexto, as autoridades ou os opositores de Jesus, e não necessariamente todo o povo judeu.
    reason: contextual_clarification
lexical_decisions:
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: lhe responderam
  rationale: Forma narrativa natural em português, preservando tanto o verbo de resposta quanto o objeto indireto.
- source_word: οἱ Ἰουδαῖοι
  choice: Os judeus
  rationale: Tradução direta da designação coletiva usada no texto. A nota esclarece seu alcance contextual sem substituir o termo por uma interpretação mais estreita.
- source_word: νόμον ἔχομεν
  choice: Nós temos uma lei
  rationale: O substantivo aparece inicialmente sem artigo; “uma lei” reproduz de modo natural o apelo a uma norma legal.
- source_word: κατὰ τὸν νόμον
  choice: de acordo com essa lei
  rationale: O artigo na segunda ocorrência retoma a lei já mencionada; “essa lei” torna clara essa referência em português.
- source_word: ὀφείλει ἀποθανεῖν
  choice: ele deve morrer
  rationale: Expressa a obrigação jurídica alegada pelos acusadores sem transformar a frase em declaração absoluta do narrador.
- source_word: υἱὸν θεοῦ
  choice: o Filho de Deus
  rationale: Embora υἱόν não tenha artigo, a construção predicativa e o contexto joanino indicam um título ou condição singular, não apenas um membro indefinido de uma classe.
- source_word: ἑαυτὸν ἐποίησεν
  choice: fez de si mesmo
  rationale: Mantém de perto a formulação acusatória grega e soa idiomática com o complemento “o Filho de Deus”.
theological_decisions:
- issue: Sentido de υἱὸν θεοῦ na acusação contra Jesus
  choice: o Filho de Deus
  alternative: um filho de Deus
  rationale: A acusação, no contexto de João, diz respeito à reivindicação de uma relação filial singular com Deus. A tradução preserva essa força sem endossar nem explicar a acusação na voz do narrador.
- issue: Identidade do grupo designado por οἱ Ἰουδαῖοι
  choice: Os judeus, com esclarecimento contextual em nota
  alternative: as autoridades judaicas
  rationale: O texto grego emprega a designação coletiva sem especificar lexicalmente “autoridades”. A tradução conserva essa amplitude formal, enquanto a nota evita uma generalização indevida à totalidade do povo judeu.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível no Brasil e compreensível internacionalmente. “De acordo com essa lei” explicita naturalmente a retomada da segunda ocorrência de νόμος; “deve morrer” conserva o tom jurídico da acusação.
