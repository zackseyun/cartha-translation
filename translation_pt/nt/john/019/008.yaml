  text: Ὅτε οὖν ἤκουσεν ὁ Πιλᾶτος τοῦτον τὸν λόγον, μᾶλλον ἐφοβήθη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/008.yaml
  text: When Pilate heard this statement, he became even more afraid,
translation:
  language: pt
  text: Quando Pilatos ouviu essa declaração, ficou com ainda mais medo,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Quando
  rationale: Ὅτε introduz a circunstância temporal. O valor conectivo leve de οὖν já é transmitido naturalmente pela sequência narrativa, sem necessidade de um “portanto” explícito.
- source_word: ἤκουσεν
  choice: ouviu
  rationale: No contexto, ἀκούω indica que Pilatos recebeu a informação acabada de declarar; “ouviu” é natural e preciso.
- source_word: ὁ Πιλᾶτος
  choice: Pilatos
  rationale: O artigo grego diante do nome próprio não precisa ser reproduzido em português; a forma tradicional do nome é “Pilatos”.
- source_word: τοῦτον τὸν λόγον
  choice: essa declaração
  rationale: λόγος se refere ao conteúdo expresso anteriormente — a alegação de que Jesus se fez Filho de Deus —, e não a uma única palavra. “Essa declaração” retoma com clareza a fala precedente.
- source_word: μᾶλλον ἐφοβήθη
  choice: ficou com ainda mais medo
  rationale: μᾶλλον marca aumento em relação a um medo já existente, enquanto ἐφοβήθη apresenta a reação ocorrida naquele momento. A formulação é idiomática e conserva a intensificação.
theological_decisions:
- issue: Natureza do medo de Pilatos
  choice: Descrever apenas o aumento do medo, sem indicar sua causa específica.
  alternative: Explicitar que o medo foi político, supersticioso ou provocado por possíveis implicações divinas.
  rationale: O grego afirma somente que Pilatos teve mais medo ao ouvir a declaração. A tradução preserva a tensão narrativa sem decidir um motivo que o texto não especifica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ficou com ainda mais medo” soa natural e comunica a progressão do temor sem interpretação adicional. A vírgula final foi mantida porque o versículo continua sintaticamente no seguinte.
