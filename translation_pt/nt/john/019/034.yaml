base_translation:
  language: en
  yaml_path: translation/nt/john/019/034.yaml
  text: But one of the soldiers pierced his side with a spear[b][a], and immediately blood and water came out.
translation:
  language: pt
  text: Mas um dos soldados perfurou-lhe o lado com uma lança[a], e imediatamente saíram sangue e água.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «com uma lança comprida».'
    reason: lexical_alternative
  - marker: b
    text: Alguns intérpretes entendem «sangue e água» de maneira simbólica ou sacramental; outros consideram a expressão uma descrição física. O próprio texto grego não explica aqui o seu significado.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Mas
  rationale: Marca o contraste com a afirmação anterior de que as pernas de Jesus não foram quebradas; «Mas» é natural e preserva a força adversativa.
- source_word: εἷς τῶν στρατιωτῶν
  choice: um dos soldados
  rationale: Preserva a construção partitiva explícita no grego, em vez de reduzi-la a «um soldado».
- source_word: λόγχῃ
  choice: com uma lança
  rationale: Designa a arma de haste e ponta usada pelo soldado; «lança» é o termo português mais claro e corrente.
- source_word: αὐτοῦ
  choice: -lhe
  rationale: O pronome retoma Jesus no contexto. A construção «perfurou-lhe o lado» evita a ambiguidade que «seu lado» poderia causar em português e não acrescenta identificação ausente do grego.
- source_word: τὴν πλευρὰν
  choice: o lado
  rationale: «Lado» expressa naturalmente πλευρά sem especificar além do texto uma região anatômica mais precisa.
- source_word: ἔνυξεν
  choice: perfurou
  rationale: O verbo indica penetrar ou furar com um instrumento pontiagudo. «Perfurou» é preciso, natural e digno neste contexto narrativo.
- source_word: καὶ ⸂ἐξῆλθεν εὐθὺς⸃
  choice: e imediatamente saíram
  rationale: Preserva tanto a sequência indicada por καί como a força temporal de εὐθύς. O plural «saíram» faz a concordância natural em português com o sujeito composto posposto.
- source_word: αἷμα καὶ ὕδωρ
  choice: sangue e água
  rationale: Tradução direta que conserva a expressão incomum sem introduzir explicação médica, simbólica ou sacramental.
theological_decisions:
- issue: Se «sangue e água» deve ser interpretado sacramentalmente, simbolicamente ou fisiologicamente no texto principal
  choice: Manter a expressão literal «sangue e água» sem explicação interpretativa.
  alternative: Explicitar uma alusão sacramental ou oferecer uma descrição fisiológica dos efeitos da ferida.
  rationale: O versículo relata o fenômeno, mas não explica seu significado. A tradução preserva a formulação e a tensão interpretativa do texto, sem introduzir uma tradição teológica ou hipótese médica específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção pronominal «perfurou-lhe o lado» mantém a referência a Jesus sem a ambiguidade de «seu lado». Os marcadores [a] e [b] aparecem no texto junto aos termos pertinentes.
