  text: ἐξῆλθεν οὖν ὁ Ἰησοῦς ἔξω, φορῶν τὸν ἀκάνθινον στέφανον καὶ τὸ πορφυροῦν ἱμάτιον. καὶ λέγει αὐτοῖς· ⸀Ἰδοὺ ὁ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/005.yaml
  text: So Jesus came out[a], wearing the crown of thorns and the purple robe. And he says to them, “Behold, the man.”
translation:
  language: pt
  text: 'Então Jesus saiu, usando a coroa de espinhos e o manto púrpura. E Pilatos lhes disse: “Eis o homem.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vejam o homem.” O grego Ἰδού é uma expressão usada para chamar a atenção e pode ser traduzida por “Eis”, “Vejam” ou “Olhem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν οὖν ... ἔξω
  choice: Então Jesus saiu
  rationale: O verbo e o advérbio enfatizam o movimento para fora; “saiu” expressa isso naturalmente em português, enquanto “então” marca a continuação e consequência narrativa indicada por οὖν.
- source_word: φορῶν
  choice: usando
  rationale: O particípio indica que Jesus trazia as duas peças sobre o corpo. “Usando” é claro e corrente em português.
- source_word: τὸν ἀκάνθινον στέφανον
  choice: a coroa de espinhos
  rationale: Expressa de modo tradicional e exato uma coroa feita de espinhos.
- source_word: τὸ πορφυροῦν ἱμάτιον
  choice: o manto púrpura
  rationale: ἱμάτιον designa uma veste exterior; “manto” preserva essa generalidade e se ajusta ao contexto da encenação régia, sem especificar excessivamente a peça.
- source_word: λέγει
  choice: disse
  rationale: Embora seja um presente histórico grego, o pretérito é a forma narrativa mais natural em português e mantém clara a sequência dos acontecimentos.
- source_word: Ἰδοὺ
  choice: Eis
  rationale: Interjeição de apresentação que chama a atenção. “Eis” conserva a força pública e solene da declaração sem soar casual.
- source_word: ὁ ἄνθρωπος
  choice: o homem
  rationale: Refere-se concretamente a Jesus, apresentado à multidão, e preserva a formulação direta e sua possível ressonância mais ampla.
theological_decisions:
- issue: Tradução de ὁ ἄνθρωπος na declaração de Pilatos
  choice: o homem
  alternative: o ser humano
  rationale: A expressão identifica concretamente Jesus como o homem apresentado diante da multidão. “O homem” mantém a referência masculina do texto e não elimina possíveis ecos representativos, sem os impor na tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis o homem” preserva a solenidade e a formulação conhecida; o marcador da nota aparece imediatamente após a citação à qual se refere.
