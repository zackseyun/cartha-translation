  source_fidelity: A tradução transmite com precisão a progressão narrativa de οὖν, o movimento expresso por ἐξῆλθεν ... ἔξω, o particípio φορῶν e os dois elementos de vestuário. «E Pilatos lhes disse» identifica corretamente o falante exigido pelo contexto narrativo imediato; sem essa identificação, o português tenderia a atribuir a fala a Jesus, o sujeito da oração anterior. «Eis o homem» reproduz de modo direto Ἰδοὺ ὁ ἄνθρωπος.
  naturalness: O texto é claro, digno e natural em português moderno. «Então Jesus saiu» e «usando a coroa de espinhos e o manto púrpura» são formulações correntes. O pretérito «disse» é uma adaptação narrativa idiomática do presente histórico λέγει.
  terminology: «Coroa de espinhos», «manto púrpura» e «Eis o homem» são escolhas precisas e estabelecidas, sem impor interpretação teológica adicional. A nota apresenta alternativas legítimas para Ἰδού e explica adequadamente sua função discursiva.
