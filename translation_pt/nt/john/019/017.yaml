id: JHN.19.17
reference: John 19:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ βαστάζων ⸂αὑτῷ τὸν σταυρὸν⸃ ἐξῆλθεν εἰς ⸀τὸν λεγόμενον Κρανίου Τόπον, ⸀ὃ λέγεται Ἑβραϊστὶ Γολγοθα,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/017.yaml
  text: And carrying the cross by himself[a], he went out to the place called Skull Place, which in Hebrew is called Golgotha.
translation:
  language: pt
  text: E, carregando ele mesmo a cruz, saiu para o lugar chamado Lugar da Caveira, que em hebraico[a] se chama Gólgota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “em aramaico”. O termo usado por João, “em hebraico”, pode se referir à língua semítica local da Judeia.
    reason: Alternativa lexical e esclarecimento histórico-linguístico.
lexical_decisions:
- source_word: βαστάζων
  choice: carregando
  rationale: O particípio descreve a ação concreta de levar ou carregar; “carregando” é claro e natural em português atual.
- source_word: αὑτῷ τὸν σταυρόν
  choice: ele mesmo a cruz
  rationale: Preserva a força reflexiva e enfática da construção, indicando que Jesus carregava pessoalmente a cruz, sem transformar explicitamente o artigo em possessivo.
- source_word: σταυρός
  choice: cruz
  rationale: É o equivalente consagrado e semanticamente adequado no contexto da paixão; o grego não exige a especificação mais estreita “trave transversal”.
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Expressa de modo direto e idiomático o movimento para fora indicado pelo aoristo.
- source_word: τὸν λεγόμενον Κρανίου Τόπον
  choice: o lugar chamado Lugar da Caveira
  rationale: Mantém tanto τόπος, “lugar”, quanto κρανίον, “caveira”, e preserva a forma de denominação presente no grego.
- source_word: ὃ λέγεται
  choice: que ... se chama
  rationale: Reproduz naturalmente em português a fórmula passiva usada para indicar o nome do lugar.
- source_word: Ἑβραϊστί
  choice: em hebraico
  rationale: Segue a designação explícita do texto grego, deixando para a nota a possibilidade de referência ao aramaico local.
- source_word: Γολγοθα
  choice: Gólgota
  rationale: Emprega a transliteração tradicional e amplamente reconhecida do nome próprio em português.
theological_decisions:
- issue: Referência linguística de Ἑβραϊστί
  choice: em hebraico
  alternative: em aramaico
  rationale: O texto grego diz literalmente “em hebraico”, mas o uso joanino pode abranger a língua semítica local da Judeia. A tradução mantém a expressão da fonte e registra a possibilidade histórica na nota.
- issue: Força reflexiva de αὑτῷ
  choice: carregando ele mesmo a cruz
  alternative: carregando sua própria cruz
  rationale: A formulação escolhida conserva a ênfase de que ele próprio a carregava e evita converter sem necessidade o artigo grego em possessivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “lugar” é mantida para refletir a expressão nominal grega; “Caveira” e “Gólgota” recebem maiúscula por integrarem a denominação do local.
