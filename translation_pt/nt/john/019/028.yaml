id: JHN.19.28
reference: John 19:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μετὰ τοῦτο ⸀εἰδὼς ὁ Ἰησοῦς ὅτι ⸂ἤδη πάντα⸃ τετέλεσται ἵνα τελειωθῇ ἡ γραφὴ λέγει· Διψῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/028.yaml
  text: After this[a], Jesus, knowing that all things had already been completed, in order that the Scripture might be fulfilled, said, “I thirst.”
translation:
  language: pt
  text: 'Depois disso, Jesus, sabendo que tudo já estava concluído, para que se cumprisse a Escritura, disse: “Estou com sede.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais tradicionalmente: “Tenho sede.”'
    reason: Registra uma tradução formal e tradicional de Διψῶ, enquanto o texto principal emprega a expressão mais corrente em português moderno.
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Depois disso
  rationale: Expressa de modo natural a transição temporal e preserva o demonstrativo singular τοῦτο.
- source_word: εἰδὼς
  choice: sabendo
  rationale: Mantém o particípio circunstancial ligado a Jesus e sua relação simultânea com a ação principal.
- source_word: ἤδη πάντα τετέλεσται
  choice: tudo já estava concluído
  rationale: O mais-que-perfeito composto grego indica um estado de conclusão já alcançado. A formulação portuguesa preserva πάντα, ἤδη e o aspecto resultante sem antecipar a declaração do versículo 30.
- source_word: ἵνα τελειωθῇ
  choice: para que se cumprisse
  rationale: Com a Escritura como sujeito, “cumprir-se” é idiomático e conserva a nuance de propósito ou resultado de ἵνα.
- source_word: ἡ γραφή
  choice: a Escritura
  rationale: No contexto joanino, refere-se ao texto sagrado; a inicial maiúscula torna esse referente claro.
- source_word: λέγει
  choice: disse
  rationale: O presente histórico grego é vertido no passado, forma natural na narrativa portuguesa.
- source_word: Διψῶ
  choice: Estou com sede
  rationale: É a expressão corrente e clara em português moderno para o presente indicativo grego. A forma tradicional é preservada em nota.
theological_decisions:
- issue: Relação entre o conhecimento de Jesus, a conclusão de tudo e o cumprimento da Escritura
  choice: O texto afirma que Jesus sabia que tudo já estava concluído e, em seguida, falou para que a Escritura se cumprisse.
  alternative: 'A oração com ἵνα também pode ser entendida com nuance de resultado: ao falar, Jesus levou a Escritura ao cumprimento.'
  rationale: A redação acompanha a sintaxe grega e mantém aberta a nuance de propósito ou resultado, sem acrescentar uma explicação doutrinária sobre presciência ou predestinação. Também distingue τετέλεσται, traduzido como “estava concluído”, de τελειωθῇ, traduzido como “se cumprisse”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações conserva a tensão do grego sem tornar a frase excessivamente rígida. O marcador [a] foi colocado junto à expressão a que a alternativa lexical se refere.
