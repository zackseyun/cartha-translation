id: JHN.19.39
reference: John 19:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἦλθεν δὲ καὶ Νικόδημος, ὁ ἐλθὼν πρὸς ⸀αὐτὸν νυκτὸς τὸ πρῶτον, φέρων ⸀μίγμα σμύρνης καὶ ἀλόης ὡς λίτρας ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/039.yaml
  text: Nicodemus also came—the one who had first come to him at night—bringing a mixture of myrrh and aloes[b][a], about a hundred litras.
translation:
  language: pt
  text: Nicodemos também veio — aquele que anteriormente tinha ido até Jesus à noite —, trazendo uma mistura de mirra e aloés, cerca de cem litras.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Uma litra era uma libra romana, equivalente a cerca de 327 gramas; cem litras correspondem aproximadamente a 32–33 quilogramas.
    reason: cultural_note
  - marker: b
    text: Essa descrição relembra a visita de Nicodemos a Jesus narrada em João 3:1–2.
    reason: cross_reference
lexical_decisions:
- source_word: ἦλθεν δὲ καὶ
  choice: também veio
  rationale: δέ faz uma ligação leve com o relato anterior, enquanto καί acrescenta Nicodemos aos participantes do sepultamento. “Também veio” expressa naturalmente essa força aditiva.
- source_word: Νικόδημος
  choice: Nicodemos
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν νυκτὸς τὸ πρῶτον
  choice: aquele que anteriormente tinha ido até Jesus à noite
  rationale: A construção articular com particípio identifica Nicodemos e remete à visita narrada em João 3:1–2. “Anteriormente” traduz τὸ πρῶτον no sentido temporal, e “à noite” expressa o uso idiomático de νυκτός. O pronome foi explicitado como “Jesus” para evitar ambiguidade artificial em português.
- source_word: φέρων
  choice: trazendo
  rationale: O particípio presente indica uma circunstância concomitante à chegada de Nicodemos; “trazendo” é natural no contexto.
- source_word: μίγμα σμύρνης καὶ ἀλόης
  choice: uma mistura de mirra e aloés
  rationale: “Mistura” corresponde diretamente a μίγμα; “mirra” é a equivalência corrente de σμύρνη, e “aloés” designa aqui a substância aromática usada na preparação funerária.
- source_word: ὡς
  choice: cerca de
  rationale: Diante de uma quantidade, ὡς indica aproximação; “cerca de” é claro e idiomático.
- source_word: λίτρας ἑκατόν
  choice: cem litras
  rationale: Mantém a antiga unidade romana em vez de confundi-la com a libra moderna; a equivalência aproximada é explicada em nota.
theological_decisions:
- issue: Referente de αὐτόν na oração identificadora
  choice: “Jesus”
  alternative: “ele”
  rationale: O contexto joanino remete claramente à visita de Nicodemos a Jesus em João 3:1–2. Explicitar o referente produz português natural sem acrescentar uma interpretação teológica controversa.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa natural. A unidade antiga “litra” foi preservada e esclarecida em nota; o travessão mantém a identificação parentética de Nicodemos sem tornar o período excessivamente pesado.
