  text: ἐγένετο γὰρ ταῦτα ἵνα ἡ γραφὴ πληρωθῇ· Ὀστοῦν οὐ συντριβήσεται ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/036.yaml
  text: 'For these things happened so that the Scripture might be fulfilled: “Not one of his bones will be broken.”[a]'
translation:
  language: pt
  text: 'Pois essas coisas aconteceram para que se cumprisse a Escritura: “Nenhum dos seus ossos será quebrado.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego, literalmente: “Um osso dele não será quebrado”. O singular “osso” é expresso de modo idiomático como “Nenhum dos seus ossos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: aconteceram
  rationale: O aoristo de γίνομαι apresenta os fatos narrados; “aconteceram” é natural e preserva o sentido de ocorrência.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação do que foi dito anteriormente, com concisão e registro literário digno.
- source_word: ταῦτα
  choice: essas coisas
  rationale: O demonstrativo neutro plural remete aos acontecimentos imediatamente anteriores; “essas coisas” preserva o plural e é corrente em português.
- source_word: ἵνα
  choice: para que
  rationale: Mantém a construção de finalidade ou resultado ligada ao cumprimento das Escrituras, sem decidir além do que o grego permite.
- source_word: ἡ γραφή
  choice: a Escritura
  rationale: Neste contexto joanino, refere-se à Escritura sagrada; o singular definido é preservado.
- source_word: πληρωθῇ
  choice: se cumprisse
  rationale: Preserva a voz passiva e se encaixa naturalmente depois de “para que”; o imperfeito do subjuntivo é exigido pela sequência verbal em português.
- source_word: Ὀστοῦν
  choice: nenhum dos seus ossos
  rationale: Embora o grego use o singular “osso” com força distributiva ou coletiva, esta formulação comunica idiomaticamente que nem sequer um osso seria quebrado.
- source_word: οὐ συντριβήσεται
  choice: será quebrado
  rationale: O futuro passivo refere-se, no contexto, a um osso que não seria fraturado; “será quebrado” é claro e preserva a alusão bíblica.
- source_word: αὐτοῦ
  choice: seus
  rationale: O genitivo pronominal é vertido naturalmente pelo possessivo, referindo-se a Jesus.
theological_decisions:
- issue: Forma da citação bíblica e sua alusão a Êxodo 12:46, Números 9:12 e Salmo 34:20
  choice: Nenhum dos seus ossos será quebrado
  alternative: Um osso dele não será quebrado
  rationale: A redação escolhida expressa em português natural a força distributiva ou coletiva do singular grego, preservando a conexão com os textos veterotestamentários sem explicitar qual deles João tem prioritariamente em vista.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém tom digno e bíblico sem arcaísmos; preserva a relação de finalidade ou resultado em ἵνα e não identifica de maneira exclusiva a fonte veterotestamentária da citação.
