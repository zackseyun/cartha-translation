  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὁ ἑωρακὼς μεμαρτύρηκεν, καὶ ἀληθινὴ ⸂αὐτοῦ ἐστιν⸃ ἡ μαρτυρία, καὶ ἐκεῖνος οἶδεν ὅτι ἀληθῆ λέγει, ἵνα ⸀καὶ ὑμεῖς ⸀πιστεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/035.yaml
  text: And the one who has seen has testified[a], and his testimony is true, and that one knows that he is telling the truth, so that you also may believe.
translation:
  language: pt
  text: E aquele que viu deu testemunho, e o testemunho dele é verdadeiro, e ele sabe que diz a verdade, para que vocês também creiam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que vocês também continuem crendo”. O presente do subjuntivo grego pode ter sentido contínuo.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἑωρακὼς
  choice: aquele que viu
  rationale: Preserva o particípio substantivado e a força de testemunha ocular. Embora o perfeito grego indique uma visão passada com relevância permanente, o pretérito perfeito é a forma mais natural em português.
- source_word: μεμαρτύρηκεν
  choice: deu testemunho
  rationale: Expressa de modo claro e digno o ato de testemunhar já realizado, cujo testemunho continua válido no contexto.
- source_word: ἀληθινὴ αὐτοῦ ἐστιν ἡ μαρτυρία
  choice: o testemunho dele é verdadeiro
  rationale: Traduz diretamente tanto a veracidade e confiabilidade de ἀληθινή quanto o pronome possessivo, sem acrescentar uma identificação ao testemunho.
- source_word: ἐκεῖνος
  choice: ele
  rationale: O pronome demonstrativo retoma enfaticamente a testemunha; em português, “ele” é natural e mantém o referente em terceira pessoa, enquanto “aquele” aqui produziria uma repetição marcada e potencialmente ambígua.
- source_word: οἶδεν
  choice: sabe
  rationale: Embora formalmente perfeito, οἶδα tem valor presente e estativo; “sabe” é a correspondência idiomática direta.
- source_word: ἀληθῆ λέγει
  choice: diz a verdade
  rationale: Reproduz naturalmente o sentido idiomático do adjetivo neutro plural com λέγει, sem o literalismo artificial de “diz coisas verdadeiras”.
- source_word: ἵνα καὶ ὑμεῖς πιστεύητε
  choice: para que vocês também creiam
  rationale: Mantém a finalidade introduzida por ἵνα e a inclusão enfática de καὶ ὑμεῖς. “Vocês” oferece ampla legibilidade brasileira sem perder dignidade.
theological_decisions:
- issue: Referente das expressões em terceira pessoa
  choice: Manter a testemunha sem identificação explícita
  alternative: Identificá-la como o discípulo amado/narrador ou como outra testemunha ocular
  rationale: O grego não identifica expressamente quem viu. A tradução conserva a terceira pessoa e não resolve a ambiguidade autoral.
- issue: Valor aspectual de πιστεύητε
  choice: creiam
  alternative: continuem crendo
  rationale: O presente do subjuntivo pode admitir nuance contínua, mas não a exige neste contexto. A formulação não marcada fica no texto, e a possibilidade durativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição de “testemunho” preserva a cadeia lexical de μαρτυρέω/μαρτυρία; “vocês” comunica naturalmente o plural de ὑμεῖς. O marcador de nota aparece imediatamente após a oração a que se refere.
