  source_fidelity: 'A tradução reproduz com precisão o conteúdo central: a testemunha que viu, seu testemunho verdadeiro, seu conhecimento de que fala a verdade e a finalidade de os leitores crerem. Contudo, o ponto final depois de «verdadeiro» deixa sem expressão o καὶ que liga a afirmação seguinte e enfraquece a progressão enfática do grego.'
