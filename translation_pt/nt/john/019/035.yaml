  terminology: «Testemunho» preserva adequadamente a relação entre μεμαρτύρηκεν e μαρτυρία. «Verdadeiro» e «diz a verdade» traduzem bem ἀληθινή e ἀληθῆ λέγει. «Ele» mantém o referente em terceira pessoa sem identificá-lo indevidamente; não resolve a questão de quem é a testemunha.
