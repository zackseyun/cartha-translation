  text: λέγει οὖν αὐτῷ ὁ Πιλᾶτος· Ἐμοὶ οὐ λαλεῖς; οὐκ οἶδας ὅτι ἐξουσίαν ἔχω ⸂ἀπολῦσαί σε καὶ ἐξουσίαν ἔχω σταυρῶσαί⸃ σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/019/010.yaml
  text: So Pilate said to him[a], “Will you not speak to me? Do you not know that I have authority to release you and authority to crucify you?”
translation:
  language: pt
  text: 'Então Pilatos lhe disse: “Você não fala comigo? Não sabe que tenho autoridade[a] para soltá-lo e autoridade para crucificá-lo?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “poder”. A palavra grega pode indicar autoridade, direito ou poder. Aqui, “autoridade” é preferível por se tratar de um contexto jurídico e governamental.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν αὐτῷ ὁ Πιλᾶτος
  choice: Então Pilatos lhe disse
  rationale: οὖν faz avançar a narrativa e, neste contexto, é expresso naturalmente por “Então”; o dativo αὐτῷ é preservado em “lhe”.
- source_word: Ἐμοὶ οὐ λαλεῖς
  choice: Você não fala comigo?
  rationale: A colocação enfática de Ἐμοὶ destaca a pessoa de Pilatos. A pergunta direta em português preserva seu tom ofendido e repreensivo sem acrescentar uma ideia modal ausente do grego.
- source_word: οὐκ οἶδας ὅτι
  choice: Não sabe que
  rationale: Tradução direta e idiomática da pergunta retórica, mantendo o sentido comum de οἶδα, “saber”.
- source_word: ἐξουσίαν ἔχω
  choice: tenho autoridade
  rationale: ἐξουσία pode indicar autoridade, direito ou poder; “autoridade” se ajusta melhor à alegação de Pilatos num contexto jurídico e governamental.
- source_word: ἀπολῦσαί σε
  choice: para soltá-lo
  rationale: No contexto judicial, ἀπολύω significa libertar ou pôr em liberdade. “Soltá-lo” é claro e natural, sem implicar necessariamente uma absolvição formal.
- source_word: καὶ ἐξουσίαν ἔχω σταυρῶσαί σε
  choice: e autoridade para crucificá-lo
  rationale: A repetição de ἐξουσία é mantida, enquanto o segundo ἔχω pode ser naturalmente subentendido em português. Isso preserva o contraste retórico entre soltar e crucificar.
theological_decisions:
- issue: Natureza da ἐξουσία reivindicada por Pilatos
  choice: Traduzir ἐξουσία por “autoridade”, sem validar como legítima ou absoluta a reivindicação de Pilatos.
  alternative: “poder” ou “direito”
  rationale: O versículo relata a alegação de Pilatos; não afirma teologicamente uma soberania romana autônoma. “Autoridade” preserva o sentido lexical e a tensão que será abordada por Jesus no versículo seguinte.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento “você” torna natural a pergunta direta; os pronomes átonos em “soltá-lo” e “crucificá-lo” mantêm um registro escrito digno. A repetição de “autoridade” conserva a ênfase do grego.
