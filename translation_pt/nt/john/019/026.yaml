  text: Ἰησοῦς οὖν ἰδὼν τὴν μητέρα καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα λέγει τῇ ⸀μητρί· Γύναι, ⸀ἴδε ὁ υἱός σου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/026.yaml
  text: So when Jesus saw his mother and the disciple whom he loved standing there[a], he says to his mother, “Woman, behold, your son.”
translation:
  language: pt
  text: 'Então, ao ver sua mãe e o discípulo a quem amava, que estava de pé ali, Jesus disse à sua mãe: “Mulher,[a] eis o seu filho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Senhora”. Em grego, esta forma de tratamento é respeitosa, não rude.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a progressão da narrativa e sua ligação com a cena anterior, em português natural.
- source_word: ἰδὼν
  choice: quando ... viu
  rationale: Expressa naturalmente o valor temporal do particípio aoristo e preserva a sequência dos acontecimentos.
- source_word: τὴν μητέρα
  choice: sua mãe
  rationale: Embora o grego use o artigo, o possessivo é natural em português e torna explícita a referência à mãe de Jesus.
- source_word: τὸν μαθητὴν παρεστῶτα
  choice: ao lado dela, o discípulo
  rationale: Transmite que o discípulo estava presente junto à mãe de Jesus; a formulação evita ambiguidade sobre sua posição na cena.
- source_word: ὃν ἠγάπα
  choice: a quem amava
  rationale: Preserva a identificação joanina do discípulo pelo amor de Jesus sem acrescentar seu nome.
- source_word: λέγει
  choice: disse
  rationale: O presente histórico grego é vertido pelo pretérito, a forma narrativa mais natural em português moderno, sem perda do conteúdo do evento.
- source_word: Γύναι
  choice: Mulher
  rationale: É a correspondência direta do vocativo grego e mantém a formulação característica de João; uma nota esclarece que a forma de tratamento é respeitosa no contexto.
- source_word: ἴδε
  choice: aí está
  rationale: Neste enunciado dêitico, identifica solenemente o discípulo como filho dela e soa mais natural em português atual do que 'eis' ou 'olhe'.
- source_word: ὁ υἱός σου
  choice: o seu filho
  rationale: Preserva a identificação relacional expressa pelo sintagma nominal grego.
theological_decisions:
- issue: Tom da forma de tratamento Γύναι dirigida por Jesus à sua mãe
  choice: Manter “Mulher” no texto e esclarecer em nota que o tratamento não é rude.
  alternative: “Senhora” ou “Querida mulher”
  rationale: “Mulher” preserva de modo transparente a forma lexical e sua ligação com outras ocorrências em João. As alternativas poderiam suavizar ou acrescentar uma intimidade que o vocábulo grego, por si só, não explicita.
- issue: Sentido de ἴδε ὁ υἱός σου
  choice: “aí está o seu filho”
  alternative: “eis o seu filho” ou “veja, o seu filho”
  rationale: A formulação mantém o caráter dêitico e solene da declaração sem decidir além do texto todas as suas possíveis implicações familiares ou teológicas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação posiciona o marcador imediatamente após a forma de tratamento a que a nota se refere.
