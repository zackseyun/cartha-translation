source:
  edition: SBLGNT
  text: Οἱ οὖν Ἰουδαῖοι, ⸂ἐπεὶ παρασκευὴ ἦν, ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ⸃, ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου, ἠρώτησαν τὸν Πιλᾶτον ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη καὶ ἀρθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/031.yaml
  text: Therefore the Jews[a], because it was the day of preparation[d][c][b], asked Pilate that the bodies might not remain on the cross on the Sabbath—for that Sabbath day was a great one—and that their legs might be broken and they might be taken away.
translation:
  language: pt
  text: Portanto, os judeus[a], visto que era o dia da Preparação[b], para que os corpos não permanecessem na cruz no sábado — pois aquele sábado era um grande dia[c] — pediram a Pilatos que as pernas deles fossem quebradas e que os corpos fossem retirados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto, “os judeus” pode referir-se mais especificamente às autoridades ou aos líderes judeus.
    reason: Esclarece a possível delimitação contextual de Ἰουδαῖοι sem impô-la ao texto principal.
  - marker: b
    text: Isto é, o dia de preparação antes do sábado.
    reason: Explica o sentido histórico e lexical de παρασκευή para leitores modernos.
  - marker: c
    text: Literalmente, “pois era grande o dia daquele sábado”; isto é, aquele sábado tinha importância especial.
    reason: Preserva a formulação e a amplitude de μεγάλη, sem especificar a razão da importância especial.
lexical_decisions:
- source_word: Οἱ οὖν Ἰουδαῖοι
  choice: Portanto, os judeus
  rationale: οὖν marca a consequência ou continuação do contexto. Ἰουδαῖοι é mantido em sua forma mais direta, sem restringir explicitamente o referente aos líderes, embora essa possibilidade contextual seja indicada em nota.
- source_word: ἐπεὶ παρασκευὴ ἦν
  choice: visto que era o dia da Preparação
  rationale: παρασκευή designa o dia de preparação antes do sábado. A expressão explicita que se trata de um dia e preserva o termo tradicional, esclarecido em nota.
- source_word: ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ
  choice: para que não permanecessem na cruz durante o sábado
  rationale: A construção com ἵνα exprime finalidade. O plural em português concorda naturalmente com 'corpos', e 'durante o sábado' comunica com clareza o valor temporal de ἐν.
- source_word: ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου
  choice: pois aquele sábado era um dia solene
  rationale: μεγάλη indica que aquele sábado possuía importância especial. 'Dia solene' transmite esse sentido em português corrente sem recorrer à expressão pouco natural 'grande dia'.
- source_word: ἠρώτησαν τὸν Πιλᾶτον
  choice: pediram a Pilatos
  rationale: ἐρωτάω, neste contexto, tem o sentido de fazer um pedido a uma autoridade. A formulação é natural e não acrescenta explicitamente 'permissão', embora ela esteja implícita.
- source_word: ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη
  choice: que as pernas fossem quebradas
  rationale: Mantém a voz passiva e o sentido específico de κατάγνυμι aplicado às pernas dos crucificados.
- source_word: καὶ ἀρθῶσιν
  choice: e os corpos retirados
  rationale: αἴρω pode significar tirar ou remover. A retomada explícita de 'os corpos' evita em português a possível leitura de que seriam retiradas as pernas.
theological_decisions:
- issue: Referente de Ἰουδαῖοι no Evangelho de João
  choice: os judeus
  alternative: as autoridades judaicas; os líderes judeus; os judeanos
  rationale: O termo joanino varia conforme o contexto. Como o texto não especifica formalmente os líderes, a tradução direta permanece no corpo do versículo, enquanto a possível delimitação contextual é registrada em nota.
- issue: Sentido de μεγάλη aplicado ao sábado
  choice: um dia solene
  alternative: um grande dia; um sábado especialmente importante
  rationale: A frase assinala a importância excepcional daquele sábado. 'Solene' expressa a força contextual sem definir além do texto a razão religiosa exata dessa importância.
- issue: Ordem das orações finais
  choice: pedido principal apresentado antes da finalidade de não deixar os corpos na cruz
  alternative: seguir estritamente a ordem grega, apresentando primeiro a finalidade
  rationale: 'A reorganização produz uma frase portuguesa mais clara, sem alterar as relações lógicas: o motivo era o dia da Preparação, o objetivo era evitar que os corpos permanecessem na cruz no sábado, e o pedido foi quebrar as pernas e retirar os corpos.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'sábado' em minúscula segundo o uso corrente e 'Preparação' como designação do dia, acompanhada de nota explicativa. Evita linguagem arcaica e não restringe silenciosamente o referente de 'os judeus'.
