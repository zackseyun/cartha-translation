id: JHN.12.19
reference: John 12:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ οὖν Φαρισαῖοι εἶπαν πρὸς ἑαυτούς· Θεωρεῖτε ὅτι οὐκ ὠφελεῖτε οὐδέν· ἴδε ὁ ⸀κόσμος ὀπίσω αὐτοῦ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/019.yaml
  text: So the Pharisees said to one another[a], “You see that you are accomplishing nothing. Look—the world has gone after him.”
translation:
  language: pt
  text: 'Então os fariseus disseram uns aos outros: “Vocês estão vendo que não conseguem nada. Vejam! O mundo foi atrás dele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a consequência da cena anterior de modo natural no português moderno, sem tornar a ligação excessivamente formal.
- source_word: πρὸς ἑαυτούς
  choice: uns aos outros
  rationale: 'Expressa o sentido recíproco no contexto: os fariseus falavam entre si como grupo.'
- source_word: Θεωρεῖτε
  choice: Vocês estão vendo
  rationale: Mantém a forma indicativa plural e transmite a constatação exasperada dirigida pelos fariseus aos próprios companheiros, sem convertê-la em imperativo.
- source_word: οὐκ ὠφελεῖτε οὐδέν
  choice: não conseguem nada
  rationale: Comunica de maneira clara e idiomática a inutilidade dos esforços deles contra Jesus; evita a tradução pouco natural 'não aproveitam nada'.
- source_word: ἴδε
  choice: Vejam!
  rationale: Interjeição que chama bruscamente a atenção. O plural se harmoniza naturalmente com o grupo interpelado em português.
- source_word: κόσμος
  choice: o mundo
  rationale: Preserva o termo grego e sua força retórica, sem reduzir interpretativamente a referência a 'todos' ou 'a multidão'.
- source_word: ὀπίσω αὐτοῦ
  choice: atrás dele
  rationale: Conserva a imagem grega e, com 'foi', forma uma expressão portuguesa natural para seguir alguém.
- source_word: ἀπῆλθεν
  choice: foi
  rationale: O aoristo é expresso naturalmente pelo pretérito perfeito; no contexto, 'foi atrás dele' comunica também o resultado que os fariseus observam.
theological_decisions:
- issue: Alcance de κόσμος na declaração dos fariseus
  choice: Manter 'o mundo' como hipérbole retórica.
  alternative: Traduzir como 'todos' ou 'toda a multidão'.
  rationale: A fala frustrada exagera retoricamente o alcance da adesão a Jesus. Preservar 'o mundo' mantém tanto a formulação grega quanto a ressonância joanina, sem transformar a frase numa afirmação doutrinária de discipulado universal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento plural 'vocês' esclarece o indicativo de Θεωρεῖτε; a exclamação após 'Vejam' preserva a força abrupta de ἴδε. Não se acrescentou nota, pois a hipérbole de 'o mundo' é inteligível no próprio contexto.
