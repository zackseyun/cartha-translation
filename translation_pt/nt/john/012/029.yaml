id: JHN.12.29
reference: John 12:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ οὖν ὄχλος ὁ ἑστὼς καὶ ἀκούσας ἔλεγεν βροντὴν γεγονέναι· ἄλλοι ἔλεγον· Ἄγγελος αὐτῷ λελάληκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/029.yaml
  text: So the crowd that was standing there and had heard it was saying that thunder had happened; others were saying[a], “An angel has spoken to him.”
translation:
  language: pt
  text: 'Então a multidão que estava ali, em pé, e tinha ouvido dizia que tinha trovejado; outros diziam: “Um anjo falou com ele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e a reação ao que acaba de ocorrer, com naturalidade em português.
- source_word: ὁ ὄχλος ὁ ἑστὼς
  choice: a multidão que estava ali
  rationale: Traduz o substantivo coletivo e o particípio perfeito em função descritiva; “ali” torna natural a referência à presença da multidão na cena.
- source_word: ἀκούσας
  choice: tinha ouvido
  rationale: O mais-que-perfeito composto expressa a anterioridade do ato de ouvir em relação ao que a multidão dizia; o objeto permanece implícito, como no grego.
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito apresenta a fala em curso ou repetida, sem exigir a formulação mais pesada “ficava dizendo”.
- source_word: βροντὴν γεγονέναι
  choice: que tinha trovejado
  rationale: Expressa idiomaticamente em português a construção acusativo com infinitivo, sem a estranheza de “um trovão tinha acontecido”.
- source_word: ἄλλοι ἔλεγον
  choice: outros diziam
  rationale: Mantém o contraste entre grupos e o aspecto imperfeito da fala.
- source_word: Ἄγγελος
  choice: Um anjo
  rationale: No contexto da interpretação de uma voz celeste, “anjo” é o sentido provável, embora o termo também possa significar “mensageiro” em outros contextos.
- source_word: αὐτῷ λελάληκεν
  choice: falou com ele
  rationale: “Falar com alguém” é a regência portuguesa mais natural neste contexto; o pretérito perfeito comunica adequadamente o ato concluído e ainda relevante.
theological_decisions:
- issue: Natureza daquele que a multidão supôs ter falado
  choice: Um anjo falou com ele
  alternative: Um mensageiro falou com ele
  rationale: O contexto celeste favorece “anjo”, sem acrescentar uma explicação doutrinária que o texto não oferece.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Preferiu-se “tinha trovejado” por ser natural e semanticamente fiel; a estrutura narrativa e o contraste entre as duas interpretações da multidão foram preservados.
