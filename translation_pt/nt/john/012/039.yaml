  text: διὰ τοῦτο οὐκ ἠδύναντο πιστεύειν ὅτι πάλιν εἶπεν Ἠσαΐας·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/039.yaml
  text: 'For this reason they were not able to believe, because Isaiah said again:'
translation:
  language: pt
  text: 'Por essa razão, eles não podiam crer, porque Isaías disse novamente:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por essa razão
  rationale: Expressa de modo natural e explícito a relação causal com o contexto anterior, sem reduzir a construção a uma mera inferência.
- source_word: οὐκ ἠδύναντο
  choice: não podiam
  rationale: Preserva o sentido real de incapacidade expresso pelo imperfeito de δύναμαι e soa mais natural em português do que «não eram capazes de».
- source_word: πιστεύειν
  choice: crer
  rationale: É uma tradução corrente e digna de πιστεύω no uso joanino, além de funcionar naturalmente após «podiam».
- source_word: ὅτι
  choice: porque
  rationale: Mantém a força causal da conjunção no contexto, introduzindo a razão vinculada à nova citação de Isaías.
- source_word: πάλιν
  choice: novamente
  rationale: Indica que se segue outra declaração de Isaías, depois da citação precedente.
- source_word: εἶπεν
  choice: disse
  rationale: É a forma idiomática usual para introduzir uma citação e corresponde diretamente ao verbo λέγω.
- source_word: Ἠσαΐας
  choice: Isaías
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Natureza da incapacidade declarada de crer
  choice: Traduzir diretamente como «não podiam crer», sem explicar doutrinariamente a origem ou o funcionamento dessa incapacidade.
  alternative: Suavizar para «não queriam crer» ou explicitar uma interpretação calvinista ou arminiana.
  rationale: O grego afirma incapacidade, e não apenas falta de disposição. Ao mesmo tempo, a tradução deve preservar a tensão entre endurecimento e responsabilidade humana sem resolver no texto debates teológicos mais amplos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Por essa razão» torna explícita a conexão causal; «não podiam crer» é conciso e natural; «disse novamente» preserva a sequência das citações.
