lexical_decisions:
- source_word: Διὰ τί
  choice: Por que
  rationale: Forma interrogativa direta e natural em português, correspondente a “por qual razão?”.
- source_word: τοῦτο τὸ μύρον
  choice: este perfume
  rationale: “Perfume” comunica de modo atual o óleo aromático valioso do contexto; o demonstrativo preserva τοῦτο.
- source_word: οὐκ ἐπράθη
  choice: não foi vendido
  rationale: Preserva a voz passiva e a força da pergunta retórica no aoristo.
- source_word: τριακοσίων δηναρίων
  choice: por trezentos denários
  rationale: O genitivo indica preço. Mantém-se a unidade monetária histórica, explicada em nota.
- source_word: καὶ ἐδόθη πτωχοῖς
  choice: e o dinheiro dado aos pobres
  rationale: O sujeito implícito de ἐδόθη é expresso como “o dinheiro” para produzir português natural e esclarecer que o valor obtido com a venda seria dado, sem alterar o sentido contextual.
