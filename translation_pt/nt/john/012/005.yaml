  source_fidelity: 'A pergunta, o demonstrativo, o perfume, o preço em denários e os pobres estão bem representados. Contudo, a coordenação grega mantém a negação sobre os dois passivos: o perfume não foi vendido e o produto da venda não foi dado aos pobres. A redação atual («e o dinheiro dado») deixa o segundo verbo elíptico de maneira sintaticamente incompleta e torna o escopo da negação menos claro.'
