  yaml_path: translation/nt/john/012/005.yaml
  text: Why was this perfume not sold for three hundred denarii and given to the poor?[a]
translation:
  language: pt
  text: Por que este perfume não foi vendido por trezentos denários, e o dinheiro não foi dado aos pobres?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um denário era o pagamento diário comum de um trabalhador; trezentos denários correspondiam aproximadamente aos ganhos de um ano, descontados os dias em que não se trabalhava.
