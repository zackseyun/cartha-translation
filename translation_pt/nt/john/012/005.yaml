  terminology: «Denários» preserva corretamente a moeda antiga. «O dinheiro» explicita de modo legítimo o referente prático de «dado», isto é, o valor obtido com a venda, sem converter a moeda em equivalente moderno. A nota cultural é adequada; «pagamento diário comum» é formulação mais direta e internacionalmente compreensível.
