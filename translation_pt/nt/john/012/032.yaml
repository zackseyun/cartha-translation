id: JHN.12.32
reference: John 12:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κἀγὼ ⸀ἐὰν ὑψωθῶ ἐκ τῆς γῆς, πάντας ἑλκύσω πρὸς ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/032.yaml
  text: And I[a], when I am lifted up from the earth[c][b], will draw all people to myself.
translation:
  language: pt
  text: E eu, quando[a] for levantado[b] da terra, atrairei todos[c] a mim mesmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se eu for levantado”. O grego emprega uma forma condicional, mas, neste contexto, refere-se à morte iminente de Jesus, apresentada como certa.
    reason: alternative_reading
  - marker: b
    text: '“Levantado” também pode ter o sentido de “exaltado”, preservando o duplo sentido em João: crucificação e glorificação.'
    reason: lexical_alternative
  - marker: c
    text: Ou “todas as pessoas”. O grego diz literalmente “todos” e se refere naturalmente a pessoas, sem explicitar como isso se relaciona com debates teológicos posteriores sobre o alcance da salvação.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: E eu
  rationale: A crase de καί + ἐγώ combina ligação com o discurso e leve ênfase pessoal; “E eu” preserva ambas de modo natural.
- source_word: ἐὰν
  choice: quando
  rationale: Embora ἐάν com o subjuntivo tenha forma condicional e possa ser traduzido por “se”, no contexto Jesus fala de sua morte iminente como acontecimento certo. “Quando” comunica bem essa força contextual, enquanto a nota preserva a forma grega.
- source_word: ὑψωθῶ
  choice: for levantado
  rationale: 'A expressão conserva o duplo sentido joanino: Jesus será fisicamente levantado na cruz e, ao mesmo tempo, exaltado ou glorificado.'
- source_word: ἐκ τῆς γῆς
  choice: da terra
  rationale: A preposição ἐκ indica afastamento ou procedência, e γῆ aqui se refere naturalmente à terra ou ao chão, em conexão com a crucificação explicada no versículo seguinte.
- source_word: πάντας
  choice: todos
  rationale: O acusativo masculino plural refere-se naturalmente a pessoas. Em português, “todos” é idiomático e preserva a amplitude da afirmação sem explicitar além do necessário como ela se relaciona com debates teológicos posteriores.
- source_word: ἑλκύσω
  choice: atrairei
  rationale: ἕλκω pode expressar puxar ou conduzir para si. “Atrairei” é natural em português neste contexto pessoal e preserva a ideia de movimento em direção a Jesus sem definir seu mecanismo.
- source_word: πρὸς ἐμαυτόν
  choice: a mim mesmo
  rationale: O pronome reflexivo ἐμαυτόν é mais enfático que um simples pronome pessoal; “a mim mesmo” mantém essa ênfase.
theological_decisions:
- issue: Alcance de πάντας em relação à salvação
  choice: todos
  alternative: todas as pessoas; todos sem distinção; todos sem exceção
  rationale: O masculino plural aponta para pessoas, não para toda a criação impessoal. O versículo afirma a abrangência da ação de Jesus, mas não resolve por si só debates posteriores sobre “todos sem exceção” ou “todos sem distinção”; a tradução mantém essa amplitude sem impor uma conclusão denominacional.
- issue: Duplo sentido joanino de ὑψωθῶ
  choice: for levantado
  alternative: for exaltado
  rationale: “Levantado” mantém juntas a elevação física de Jesus na cruz e sua exaltação ou glorificação. Traduzir apenas por “exaltado” eliminaria deliberadamente uma dimensão da expressão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a ênfase do grego são mantidas sem rigidez artificial; as notas preservam a forma condicional, o duplo sentido de “levantado” e a amplitude de “todos”.
