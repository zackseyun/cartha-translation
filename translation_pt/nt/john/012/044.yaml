source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ἔκραξεν καὶ εἶπεν· Ὁ πιστεύων εἰς ἐμὲ οὐ πιστεύει εἰς ἐμὲ ἀλλὰ εἰς τὸν πέμψαντά με,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/044.yaml
  text: But Jesus cried out and said[a], “The one who believes in me does not believe in me[b], but in the one who sent me,”
translation:
  language: pt
  text: 'Mas Jesus clamou e disse: “Aquele que crê[a] em mim não crê em mim[b], mas naquele que me enviou,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem crê em mim”.'
    reason: lexical_alternative
  - marker: b
    text: Isso não nega que Jesus seja objeto legítimo da fé; expressa que crer nele é inseparável de crer no Pai que o enviou.
    reason: cross_reference
lexical_decisions:
- source_word: ἔκραξεν
  choice: clamou
  rationale: O verbo indica uma declaração feita em voz alta e publicamente. “Clamou” preserva a força e a solenidade do grego sem reduzi-lo ao simples “disse”.
- source_word: Ὁ πιστεύων
  choice: Aquele que crê
  rationale: O particípio presente com artigo tem sentido substantivo e genérico. “Aquele que crê” reflete de perto a construção grega e continua natural em português.
- source_word: πιστεύων / πιστεύει
  choice: crê
  rationale: Com εἰς, o verbo πιστεύω expressa fé ou confiança dirigida a alguém. “Crer em” é a formulação consagrada e preserva a repetição deliberada do verbo no versículo.
- source_word: εἰς ἐμέ
  choice: em mim
  rationale: Com πιστεύω, a preposição εἰς é vertida idiomaticamente por “em”, indicando fé dirigida à pessoa de Jesus.
- source_word: ἀλλὰ εἰς τὸν πέμψαντά με
  choice: mas naquele que me enviou
  rationale: A tradução mantém o contraste introduzido por ἀλλά e a referência indireta do particípio substantivado, sem acrescentar “Pai” ao texto principal.
- source_word: δὲ
  choice: Mas
  rationale: Aqui δέ marca uma transição com nuance de contraste em relação ao contexto anterior; “Mas” comunica naturalmente esse movimento.
theological_decisions:
- issue: A afirmação “não crê em mim, mas naquele que me enviou” pode ser entendida equivocadamente como negação de que Jesus seja objeto legítimo da fé.
  choice: 'Preservar literalmente a tensão retórica e teológica: crer em Jesus é inseparável de crer naquele que o enviou.'
  alternative: Traduzir de forma explicativa como “não crê somente em mim” ou identificar “o Pai” no texto principal.
  rationale: O grego não contém “somente”. Acrescentar essa palavra resolveria uma tensão que o próprio texto mantém. A formulação joanina relaciona estreitamente Jesus àquele que o enviou, sem exigir que a tradução explicite essa relação por paráfrase.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Clamou” conserva o caráter solene e público da fala; “Aquele que crê” mantém a forma genérica do grego. A pontuação foi ajustada ao uso natural do português.
