  text: ἠγάπησαν γὰρ τὴν δόξαν τῶν ἀνθρώπων μᾶλλον ἤπερ τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/043.yaml
  text: For they loved the glory of men rather than the glory of God[a].
translation:
  language: pt
  text: Pois amaram mais a glória das pessoas do que a glória de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o louvor das pessoas” / “a aprovação humana”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάπησαν
  choice: amaram
  rationale: O aoristo ativo de ἀγαπάω expressa aqui forte afeição e escolha. “Amaram” preserva a ligação lexical com a linguagem do amor, enquanto a construção comparativa comunica a ideia de preferência.
- source_word: γὰρ
  choice: pois
  rationale: γάρ apresenta a razão da afirmação anterior. “Pois” mantém de modo natural e digno a ligação explicativa com o contexto.
- source_word: δόξαν
  choice: glória
  rationale: δόξα pode significar glória, honra, louvor, reputação ou aprovação. “Glória” preserva a repetição do termo e sua ressonância joanina sem restringir indevidamente o sentido.
- source_word: τῶν ἀνθρώπων
  choice: das pessoas
  rationale: O plural ἀνθρώπων refere-se genericamente aos seres humanos, não apenas a homens. “Das pessoas” é inclusivo, natural em português moderno e conserva a construção genitiva, que pode sugerir procedência ou pertencimento.
- source_word: μᾶλλον ἤπερ
  choice: mais ... do que
  rationale: A expressão comparativa estabelece preferência entre os dois objetos. “Mais ... do que” reproduz diretamente a estrutura e soa natural em português.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: A formulação conserva o paralelismo com “das pessoas” e deixa aberta a nuance do genitivo, que pode indicar a glória proveniente de Deus ou associada a ele.
theological_decisions:
- issue: Sentido de δόξα no contraste entre os seres humanos e Deus
  choice: glória
  alternative: louvor, honra ou aprovação
  rationale: “Glória” mantém a amplitude semântica e a continuidade com a teologia joanina da glória. As alternativas explicitam dimensões possíveis, mas são mais estreitas.
- issue: Valor do genitivo em “das pessoas” e “de Deus”
  choice: manter a formulação genitiva
  alternative: “proveniente das pessoas” e “proveniente de Deus”
  rationale: O grego permite entender a glória como procedente de alguém ou associada a alguém. A tradução genitiva preserva essa ambiguidade genuína em vez de fixar apenas a ideia de aprovação recebida.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pessoas” evita que o genérico ἄνθρωποι seja entendido como referência exclusiva ao sexo masculino. A repetição de “glória” reproduz deliberadamente o paralelismo do grego.
