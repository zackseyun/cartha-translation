id: JHN.12.17
reference: John 12:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐμαρτύρει οὖν ὁ ὄχλος ὁ ὢν μετ’ αὐτοῦ ὅτε τὸν Λάζαρον ἐφώνησεν ἐκ τοῦ μνημείου καὶ ἤγειρεν αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/017.yaml
  text: So the crowd that had been with him when he called Lazarus out of the tomb and raised him from the dead was bearing witness[a].
translation:
  language: pt
  text: Assim, a multidão que estava com ele quando chamou Lázaro para fora do túmulo e o ressuscitou dentre os mortos continuava dando testemunho[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “continuava testemunhando”; o verbo grego pode indicar prestar testemunho ou dar testemunho, tema recorrente em João.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρει
  choice: continuava dando testemunho
  rationale: O imperfeito indica uma ação em curso ou repetida no contexto narrativo. “Dar testemunho” preserva o vocabulário recorrente de João, enquanto “continuava” comunica naturalmente o aspecto verbal em português.
- source_word: οὖν
  choice: Assim
  rationale: Marca a ligação narrativa e lógica com o contexto anterior, em linguagem atual e digna.
- source_word: ὁ ὄχλος
  choice: a multidão
  rationale: Designa o grupo de pessoas presente; “multidão” é claro e corrente em português bíblico moderno.
- source_word: ὁ ὢν μετ’ αὐτοῦ
  choice: que estava com ele
  rationale: O particípio articular identifica a multidão específica que acompanhava Jesus naquela ocasião. A formulação evita impor uma anterioridade não expressa diretamente pelo particípio presente.
- source_word: ὅτε
  choice: quando
  rationale: Conjunção temporal comum que introduz a ocasião testemunhada pela multidão.
- source_word: ἐφώνησεν
  choice: chamou
  rationale: Expressa diretamente o ato de Jesus chamar Lázaro, sem acrescentar uma intensidade não exigida pelo verbo.
- source_word: ἐκ τοῦ μνημείου
  choice: para fora do túmulo
  rationale: “Túmulo” corresponde ao local de sepultamento, e “para fora” torna explícito em português o movimento indicado por ἐκ.
- source_word: ἤγειρεν
  choice: ressuscitou
  rationale: No contexto da volta de Lázaro dentre os mortos, “ressuscitou” comunica com clareza o sentido de ἐγείρω em português, sem paráfrase explicativa.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: Preserva de modo natural a construção grega, que pode ser entendida como saída do meio dos mortos, e mantém a linguagem tradicional de ressurreição.
theological_decisions:
- issue: Declaração sobre a ressurreição de Lázaro
  choice: o ressuscitou dentre os mortos
  alternative: o levantou dos mortos
  rationale: A formulação traduz diretamente a afirmação de que Jesus fez Lázaro voltar da morte, sem atenuar o milagre nem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha o fluxo do grego sem produzir rigidez; “continuava dando testemunho” comunica o aspecto imperfeito e conserva a terminologia joanina.
