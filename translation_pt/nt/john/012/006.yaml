  text: εἶπεν δὲ τοῦτο οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ, ἀλλ’ ὅτι κλέπτης ἦν καὶ τὸ γλωσσόκομον ⸀ἔχων τὰ βαλλόμενα ἐβάσταζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/006.yaml
  text: He said this not because he cared about the poor[a], but because he was a thief, and having the money box[b], he used to take what was put into it.
translation:
  language: pt
  text: Ele disse isso não porque se importasse com os pobres, mas porque era ladrão e, tendo a caixa de dinheiro[a], costumava tirar[b] o que era colocado nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a bolsa de dinheiro”. O termo grego pode designar um recipiente usado para guardar dinheiro.
    reason: lexical_alternative
  - marker: b
    text: Ou “carregava”; no contexto, também pode ser entendido como “costumava roubar o que era colocado nela”. O verbo frequentemente significa “carregar” ou “levar”, mas a afirmação de que ele era ladrão indica apropriação indevida.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ τοῦτο
  choice: Ele disse isso, porém
  rationale: Traduz εἶπεν ... τοῦτο diretamente e representa o valor conectivo leve de δέ com “porém”, sem introduzir uma noção temporal ausente do grego.
- source_word: οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ
  choice: não porque se importasse com os pobres
  rationale: A construção οὐχ ὅτι nega o motivo alegado; “importar-se com” expressa naturalmente μέλει com o dativo em português.
- source_word: ἀλλ’ ὅτι κλέπτης ἦν
  choice: mas porque era ladrão
  rationale: Preserva o contraste correlativo entre οὐχ ὅτι e ἀλλ’ ὅτι; κλέπτης designa quem furta, adequadamente expresso por “ladrão”.
- source_word: τὸ γλωσσόκομον
  choice: a caixa de dinheiro
  rationale: O termo designa um recipiente usado para guardar dinheiro; “caixa de dinheiro” é claro e próximo do sentido lexical, enquanto “bolsa de dinheiro” permanece uma alternativa possível.
- source_word: ἔχων
  choice: tendo
  rationale: Mantém a construção participial e indica que Judas tinha a posse ou o controle do recipiente.
- source_word: τὰ βαλλόμενα
  choice: o que era colocado nela
  rationale: O particípio passivo refere-se ao que era depositado no recipiente; “nela” explicita naturalmente o destino exigido pelo contexto.
- source_word: ἐβάσταζεν
  choice: costumava tirar
  rationale: O imperfeito indica ação habitual. Embora βαστάζω possa significar “carregar”, a afirmação de que Judas era ladrão favorece aqui o sentido contextual de retirar ou apropriar-se do conteúdo, sem tornar “roubar” a tradução lexical explícita no texto principal.
theological_decisions:
- issue: Sentido de ἐβάσταζεν em relação ao furto de Judas
  choice: costumava tirar o que era colocado nela
  alternative: carregava o que era colocado nela; costumava roubar o que era colocado nela
  rationale: O contexto imediato — “era ladrão” — favorece a ideia de apropriação indevida, não a simples responsabilidade de transportar o dinheiro. “Tirar” comunica essa ação no contexto sem eliminar por completo a amplitude lexical do verbo, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase preserva o contraste entre o motivo negado e o motivo afirmado. Os marcadores de nota foram posicionados junto aos termos a que efetivamente se referem.
