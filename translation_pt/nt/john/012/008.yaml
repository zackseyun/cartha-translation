source:
  edition: SBLGNT
  text: τοὺς πτωχοὺς γὰρ πάντοτε ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/008.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: pt
  text: Pois vocês sempre têm os pobres com vocês[a], mas nem sempre têm a mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pessoas pobres”. O adjetivo grego é usado como substantivo: “os pobres”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχούς
  choice: os pobres
  rationale: O adjetivo substantivado refere-se às pessoas pobres como grupo; “os pobres” é natural, conciso e preserva essa referência genérica.
- source_word: γάρ
  choice: Pois
  rationale: Introduz a explicação do que foi dito anteriormente; “pois” mantém a conexão argumentativa de modo natural e digno.
- source_word: πάντοτε
  choice: sempre
  rationale: Expressa presença ou disponibilidade contínua no contexto e é mantido nas duas ocorrências, com a segunda sob negação.
- source_word: ἔχετε
  choice: têm
  rationale: Aqui indica presença ou disponibilidade, não posse; “têm” funciona naturalmente nas duas orações.
- source_word: μεθ’ ἑαυτῶν
  choice: com vocês
  rationale: A expressão significa na companhia ou na presença dos ouvintes; “com vocês” é a formulação corrente em português.
- source_word: ἐμέ
  choice: a mim
  rationale: O pronome enfático e a regência de “ter” nesta construção contrastiva são expressos naturalmente por “a mim”, preservando o destaque dado a Jesus.
- source_word: δέ
  choice: mas
  rationale: Marca o contraste entre a presença contínua dos pobres e a presença limitada de Jesus.
- source_word: οὐ πάντοτε
  choice: nem sempre
  rationale: Na oração contrastiva, “nem sempre” traduz de modo idiomático a negação de πάντοτε, sem sugerir ausência absoluta.
theological_decisions:
- issue: Possível uso da declaração para diminuir o cuidado com os pobres
  choice: Manter a afirmação como contraste direto de presença e ocasião, sem sugerir que os pobres têm menor importância.
  alternative: Parafrasear de forma que subordine o valor dos pobres a Jesus, ou suavizar o contraste explícito.
  rationale: O grego contrapõe a presença contínua dos pobres à presença temporalmente limitada de Jesus junto aos discípulos. A tradução preserva essa tensão sem acrescentar uma avaliação do dever de cuidar dos pobres.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Vocês” comunica claramente o plural dos verbos gregos; a ordem “têm a mim” preserva o contraste enfático com “os pobres” sem soar excessivamente arcaica.
