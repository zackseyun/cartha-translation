source:
  edition: SBLGNT
  text: νῦν κρίσις ἐστὶν τοῦ κόσμου τούτου, νῦν ὁ ἄρχων τοῦ κόσμου τούτου ἐκβληθήσεται ἔξω·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/031.yaml
  text: Now is the judgment of this world[b][a]; now the ruler of this world will be cast out.
translation:
  language: pt
  text: Agora é o julgamento deste mundo; agora o governante[a] deste mundo será expulso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o príncipe deste mundo”. A expressão é geralmente entendida como uma referência a Satanás.
    reason: Registra a alternativa lexical tradicional para ἄρχων e a identificação contextual comum sem resolver a questão no texto principal.
lexical_decisions:
- source_word: νῦν
  choice: agora
  rationale: Preserva a força temporal enfática e a repetição paralela nas duas orações.
- source_word: κρίσις
  choice: julgamento
  rationale: Expressa o ato decisivo de julgar, sem restringir o sentido a mera avaliação nem antecipar o resultado como condenação.
- source_word: τοῦ κόσμου τούτου
  choice: deste mundo
  rationale: Mantém o demonstrativo e a formulação joanina, deixando ao contexto o alcance de κόσμος.
- source_word: ὁ ἄρχων
  choice: o governante
  rationale: Termo moderno e claro para alguém que exerce autoridade; evita o sentido dinástico que “príncipe” pode sugerir hoje.
- source_word: ἐκβληθήσεται ἔξω
  choice: será expulso
  rationale: Reproduz naturalmente em português o futuro passivo e a ideia intensificada de remoção para fora.
theological_decisions:
- issue: Identidade do “governante deste mundo”
  choice: A identidade permanece implícita no texto principal.
  alternative: Explicitar “Satanás” ou entender a expressão como personificação do sistema deste mundo.
  rationale: O grego emprega um título, não um nome. A tradução preserva essa formulação e registra em nota a identificação contextual mais comum sem inseri-la no texto.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do grego. A repetição de “agora” e de “deste mundo” foi mantida para preservar o paralelismo e a ênfase do original.
