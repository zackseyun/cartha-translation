base_translation:
  language: en
  yaml_path: translation/nt/john/012/004.yaml
  text: But Judas Iscariot[a], one of his disciples—the one who was about to betray him—said,
translation:
  language: pt
  text: 'Mas Judas Iscariotes, um dos seus discípulos — aquele que estava para traí-lo[a] —, disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “entregá-lo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: disse
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma natural na narrativa em português, sem alterar sua função discursiva.
- source_word: δὲ
  choice: Mas
  rationale: A conjunção marca aqui uma transição com leve contraste entre o gesto anterior e a objeção que se segue.
- source_word: Ἰούδας ὁ Ἰσκαριώτης
  choice: Judas Iscariotes
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: um dos seus discípulos
  rationale: “Discípulos” preserva a relação específica entre mestre e aprendiz presente no contexto dos Evangelhos.
- source_word: ὁ μέλλων
  choice: aquele que estava para
  rationale: A expressão comunica a perspectiva futura e a iminência indicada por μέλλω, mantendo clara a aposição.
- source_word: παραδιδόναι
  choice: traí-lo
  rationale: No contexto da ação de Judas contra Jesus, “trair” expressa com naturalidade o sentido contextual; a acepção mais literal, “entregá-lo”, é preservada em nota.
theological_decisions:
- issue: Tradução de παραδιδόναι em referência à ação de Judas contra Jesus
  choice: traí-lo
  alternative: entregá-lo
  rationale: O verbo pode significar literalmente “entregar” ou “passar às mãos de alguém”. Neste contexto, “trair” comunica o caráter desleal do ato de Judas, enquanto a nota preserva a formulação mais literal e a amplitude lexical do grego.
translation_notes:
  register: Português moderno, digno e acessível, com construção narrativa natural. Os travessões destacam a explicação parentética sobre Judas, e os dois-pontos mantêm o versículo aberto para a fala que vem a seguir.
