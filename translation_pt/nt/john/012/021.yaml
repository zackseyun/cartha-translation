source:
  edition: SBLGNT
  text: οὗτοι οὖν προσῆλθον Φιλίππῳ τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας, καὶ ἠρώτων αὐτὸν λέγοντες· Κύριε, θέλομεν τὸν Ἰησοῦν ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/021.yaml
  text: So these came to Philip[a], who was from Bethsaida in Galilee, and were asking him, saying, “Lord, we want to see Jesus.”
translation:
  language: pt
  text: 'Esses, então, aproximaram-se de Filipe, que era de Betsaida, na Galileia, e lhe pediam: “Senhor[a], queremos ver Jesus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “senhor”. O vocativo grego κύριε pode ser uma forma respeitosa de se dirigir a Filipe, sem necessariamente ser um título divino.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι οὖν
  choice: Esses, então
  rationale: O demonstrativo retoma os gregos mencionados no versículo anterior, e «então» conserva a progressão narrativa expressa por οὖν.
- source_word: προσῆλθον
  choice: aproximaram-se de
  rationale: Expressa naturalmente o movimento em direção a Filipe sem acrescentar a ideia de uma viagem.
- source_word: Φιλίππῳ
  choice: Filipe
  rationale: Forma tradicional e corrente do nome Φίλιππος em português.
- source_word: τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας
  choice: que era de Betsaida da Galileia
  rationale: A oração relativa identifica Filipe de modo natural e preserva a localização geográfica.
- source_word: ἠρώτων αὐτόν
  choice: lhe pediam
  rationale: O imperfeito indica uma solicitação em andamento; no contexto, ἐρωτάω tem o sentido de pedir ou solicitar, não apenas fazer uma pergunta.
- source_word: λέγοντες
  choice: introduzido diretamente pelos dois-pontos
  rationale: Em português, os dois-pontos introduzem naturalmente o conteúdo da fala e evitam a redundância de «pediam, dizendo», sem perda de sentido.
- source_word: Κύριε
  choice: Senhor
  rationale: «Senhor» preserva tanto a forma lexical quanto a possível função de tratamento respeitoso dirigida a Filipe; a ambiguidade contextual é esclarecida em nota.
- source_word: θέλομεν
  choice: queremos
  rationale: Tradução direta, atual e natural da expressão de vontade ou desejo.
- source_word: τὸν Ἰησοῦν ἰδεῖν
  choice: ver Jesus
  rationale: Mantém o sentido literal de ἰδεῖν sem explicitar uma audiência, encontro ou conversa que o texto apenas pode sugerir.
theological_decisions:
- issue: Sentido de κύριε na fala dirigida a Filipe
  choice: Senhor
  alternative: tratamento respeitoso equivalente a «senhor», sem atribuição de um título divino
  rationale: Embora κύριε possa significar «Senhor» como título, aqui se dirige a Filipe e provavelmente funciona como tratamento cortês. A tradução portuguesa «Senhor» preserva ambas as possibilidades, e a nota evita que a forma seja tomada necessariamente como uma afirmação teológica sobre Filipe.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se o demonstrativo que liga o versículo aos gregos mencionados anteriormente e o aspecto durativo do imperfeito em «pediam».
