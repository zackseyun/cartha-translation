  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀οὖν αὐτῷ ὁ ὄχλος· Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου ὅτι ὁ χριστὸς μένει εἰς τὸν αἰῶνα, καὶ πῶς ⸂λέγεις σὺ⸃ ⸀ὅτι δεῖ ὑψωθῆναι τὸν υἱὸν τοῦ ἀνθρώπου; τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/034.yaml
  text: So the crowd answered him[a], "We have heard from the Law that the Messiah remains forever[b], and how can you say that the Son of Man must be lifted up? Who is this Son of Man?"
translation:
  language: pt
  text: 'Então a multidão lhe respondeu: “Nós ouvimos da Lei que o Messias permanece para sempre, e como você pode dizer que o Filho do Homem precisa ser levantado[a]? Quem é esse Filho do Homem?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “exaltado”. Em João, “levantado” pode indicar tanto ser erguido fisicamente como ser exaltado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτῷ ὁ ὄχλος
  choice: Então a multidão lhe respondeu
  rationale: “Então” expressa naturalmente a continuação ou inferência marcada por οὖν; “multidão” traduz ὄχλος de modo corrente, e “lhe respondeu” preserva αὐτῷ.
- source_word: Ἡμεῖς ἠκούσαμεν
  choice: Ouvimos
  rationale: O pretérito perfeito português comunica de modo natural o ensinamento recebido e ainda relevante; o pronome explícito seria desnecessário.
- source_word: ἐκ τοῦ νόμου
  choice: da Lei
  rationale: Preserva a formulação grega e o enquadramento judaico das Escrituras, com inicial maiúscula indicando a referência reconhecida à Lei.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Aqui χριστός funciona claramente como título; “Messias” preserva o contexto messiânico judaico e é português corrente.
- source_word: μένει εἰς τὸν αἰῶνα
  choice: permanece para sempre
  rationale: Mantém o aspecto durativo de μένει e traduz o idiomatismo εἰς τὸν αἰῶνα com clareza.
- source_word: καὶ πῶς λέγεις σὺ
  choice: Como, então, você pode dizer
  rationale: A formulação transmite a objeção incrédula da multidão. “Você” oferece ampla legibilidade brasileira, e “então” explicita a relação lógica de καί neste contexto sem tornar a frase rígida.
- source_word: δεῖ
  choice: precisa
  rationale: Expressa necessidade em português natural; no contexto, mantém a força de δεῖ sem a construção mais pesada “é necessário que”.
- source_word: ὑψωθῆναι
  choice: ser levantado
  rationale: Preserva a polissemia joanina entre elevação física na cruz e exaltação, sem reduzir o verbo a apenas um desses sentidos.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: É a forma titular estabelecida em português e conserva suas ressonâncias bíblicas.
- source_word: τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Quem é esse Filho do Homem?
  rationale: Reproduz diretamente a pergunta, usando “esse” para a referência ao título que Jesus acabara de empregar.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Como o termo está acompanhado do artigo e funciona como título esperado pela multidão, “Messias” comunica melhor o contexto judaico sem introduzir uma leitura denominacional.
- issue: Sentido de ὑψωθῆναι no Evangelho de João
  choice: ser levantado
  alternative: ser exaltado
  rationale: “Levantado” conserva a tensão intencional entre a elevação física de Jesus na crucificação e sua exaltação; “exaltado” resolveria a ambiguidade em apenas uma direção.
- issue: Natureza da necessidade em δεῖ
  choice: precisa ser levantado
  alternative: deve ser levantado
  rationale: A tradução afirma a necessidade presente no grego, mas não especifica indevidamente se ela é profética, escritural ou divina, preservando a abertura do texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A ordem foi levemente ajustada para fluidez, sem perder a relação argumentativa. Empregou-se “Messias” como título e manteve-se a ambiguidade teológica de “levantado”.
