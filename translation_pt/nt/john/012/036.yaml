    issue: Sequência de ἀπελθών e ἐκρύβη
    rationale: “Retirando-se, escondeu-se” pode sugerir que Jesus se ocultou enquanto se retirava. O aoristo participial favorece a sequência “partiu e se escondeu” (ou “depois de partir, escondeu-se”).
  revised_text: Enquanto vocês têm a luz, creiam na luz, para que se tornem filhos da luz.[a] Jesus disse essas coisas, partiu e se escondeu deles.[b]
