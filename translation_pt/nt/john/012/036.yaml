  to: Enquanto vocês têm a luz, creiam na luz, para que se tornem filhos da luz.[a] Jesus disse essas coisas, partiu e se escondeu deles.[b]
  rationale: A única alteração é a substituição da construção gerundiva por verbos coordenados, a fim de representar com maior clareza a anterioridade de ἀπελθών e produzir uma formulação portuguesa mais natural. As notas são mantidas, pois explicam respectivamente o idiomatismo de υἱοὶ φωτός e a nuance formalmente passiva de ἐκρύβη.
