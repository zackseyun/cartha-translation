  text: ⸀ὡς τὸ φῶς ἔχετε, πιστεύετε εἰς τὸ φῶς, ἵνα υἱοὶ φωτὸς γένησθε. Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/036.yaml
  text: While you have the light[a], believe in the light, so that you may become sons of light. Jesus spoke these things[b], and he departed and hid from them.
translation:
  language: pt
  text: Enquanto vocês têm a luz, creiam na luz, para que se tornem filhos da luz.[a] Jesus disse essas coisas, partiu e se escondeu deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filhos da luz”; expressão que designa pessoas caracterizadas pela luz.
    reason: idiom_explanation
  - marker: b
    text: 'Ou: “e, depois de partir, ficou oculto para eles”.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: ὡς τὸ φῶς ἔχετε
  choice: Enquanto vocês têm a luz
  rationale: Neste contexto, ὡς com o presente ἔχετε tem sentido temporal. “Enquanto” comunica com naturalidade a oportunidade presente e sua urgência, sem ampliar a expressão além do necessário.
- source_word: τὸ φῶς
  choice: a luz
  rationale: Mantém o artigo definido e preserva a ressonância literal e cristológica do motivo joanino da luz, sem explicá-lo por paráfrase.
- source_word: πιστεύετε εἰς τὸ φῶς
  choice: creiam na luz
  rationale: “Crer em” é a forma portuguesa direta e natural de expressar πιστεύω εἰς no Evangelho de João, preservando a linguagem característica do texto.
- source_word: ἵνα υἱοὶ φωτὸς γένησθε
  choice: para que se tornem filhos da luz
  rationale: “Para que” conserva a força de finalidade de ἵνα; “se tornem” traduz o sentido de vir a ser de γίνομαι; e “filhos da luz” mantém a forma masculina plural e o idioma caracterizador do original.
- source_word: Ταῦτα ἐλάλησεν Ἰησοῦς
  choice: Jesus disse essas coisas
  rationale: Embora λαλέω tenha o sentido básico de falar, “disse essas coisas” é mais natural em português narrativo e transmite corretamente a referência ao discurso anterior.
- source_word: ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν
  choice: retirando-se, escondeu-se deles
  rationale: O particípio aoristo indica a retirada associada e anterior ao ato principal. A construção portuguesa conserva a sequência e entende ἐκρύβη em seu sentido médio/intransitivo adequado ao contexto.
theological_decisions:
- issue: Expressão familiar de gênero em υἱοὶ φωτός
  choice: filhos da luz
  alternative: pessoas caracterizadas pela luz
  rationale: A tradução mantém o substantivo masculino do grego e a expressão idiomática joanina. A nota esclarece que a frase caracteriza as pessoas por sua relação com a luz, sem restringir o chamado apenas a homens.
- issue: Expressão joanina πιστεύω εἰς
  choice: creiam na luz
  alternative: confiem na luz
  rationale: “Creiam na luz” preserva a formulação característica de João e o chamado teológico à fé, sem acrescentar uma interpretação denominacional.
- issue: Valor de ἐκρύβη
  choice: escondeu-se deles
  alternative: ficou oculto para eles
  rationale: A forma verbal é formalmente passiva, mas neste contexto admite sentido médio ou intransitivo. A tradução principal apresenta Jesus como quem se oculta; a nota registra a alternativa mais formal para preservar a nuance gramatical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para explicitar o plural da segunda pessoa. A sintaxe permanece próxima do grego, mas evita rigidez desnecessária.
