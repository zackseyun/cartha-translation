  text: καὶ ὁ θεωρῶν ἐμὲ θεωρεῖ τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/045.yaml
  text: And the one who sees me sees the one who sent me[a].
translation:
  language: pt
  text: E quem me vê vê aquele que me enviou[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contempla”; o verbo grego pode indicar ver com atenção e percepção, não apenas enxergar fisicamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a conexão simples com o contexto anterior de maneira direta e natural.
- source_word: ὁ θεωρῶν
  choice: quem me vê
  rationale: O particípio presente substantivado tem sentido genérico. “Quem me vê” é idiomático em português e preserva a ação contínua ou característica sem tornar a frase artificial.
- source_word: ἐμὲ
  choice: me
  rationale: Traduz diretamente o pronome de primeira pessoa usado como objeto; a forma enfática grega não exige ênfase adicional em português.
- source_word: θεωρεῖ
  choice: vê
  rationale: θεωρέω pode indicar ver, observar ou contemplar. “Vê” é claro e atual, além de preservar a repetição verbal do original.
- source_word: τὸν πέμψαντά με
  choice: aquele que me enviou
  rationale: Reproduz naturalmente o particípio aoristo substantivado e mantém a descrição relacional do remetente sem acrescentar o título “Pai”, que não aparece neste versículo.
theological_decisions:
- issue: Relação entre ver Jesus e ver aquele que o enviou
  choice: 'Preservar a afirmação direta: quem vê Jesus vê aquele que o enviou.'
  alternative: Explicitar que a pessoa apenas conhece o remetente por meio de Jesus, ou parafrasear a frase como uma declaração de identidade ontológica.
  rationale: O texto afirma uma unidade reveladora forte, mas não a explica neste ponto. A tradução conserva essa força e a tensão teológica sem enfraquecê-la nem acrescentar formulações doutrinárias ausentes do versículo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A repetição de “vê” reproduz deliberadamente a repetição do verbo grego.
