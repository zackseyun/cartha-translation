id: JHN.12.23
reference: John 12:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀ἀποκρίνεται αὐτοῖς λέγων· Ἐλήλυθεν ἡ ὥρα ἵνα δοξασθῇ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/023.yaml
  text: But Jesus answered them[a], saying[b], “The hour has come for the Son of Man to be glorified.”
translation:
  language: pt
  text: 'Jesus, porém, lhes respondeu: “Chegou a hora[a] de o Filho do Homem[b] ser glorificado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Chegou o tempo”. O grego diz “hora”, termo recorrente em João para o momento determinado do sofrimento e da glória de Jesus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o Ser Humano”. O título grego “o Filho do Homem” evoca Daniel 7 e é mantido aqui por sua força teológica e intertextual.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται αὐτοῖς λέγων
  choice: 'lhes respondeu:'
  rationale: O presente histórico grego é vertido pelo pretérito, mais natural na narrativa em português. O pronome «lhes» expressa αὐτοῖς, e os dois-pontos introduzem a fala de modo idiomático, comunicando a função de λέγων sem a construção redundante «respondeu-lhes, dizendo».
- source_word: Ἐλήλυθεν
  choice: Chegou
  rationale: O perfeito grego apresenta a hora como já chegada e agora presente. «Chegou» é a formulação portuguesa natural e, no contexto, conserva esse resultado atual.
- source_word: ἡ ὥρα
  choice: a hora
  rationale: «Hora» preserva o motivo recorrente em João para o momento determinado do sofrimento e da glória de Jesus; «tempo» seria mais genérico.
- source_word: ἵνα δοξασθῇ
  choice: de ... ser glorificado
  rationale: A construção portuguesa com «chegou a hora de» comunica naturalmente o conteúdo ou propósito introduzido por ἵνα, enquanto «ser glorificado» mantém a voz passiva e a densidade teológica de δοξάζω.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a designação cristológica estabelecida e suas ressonâncias com Daniel 7, sem reduzi-la a uma referência genérica à humanidade.
theological_decisions:
- issue: Sentido de Ἐλήλυθεν ἡ ὥρα
  choice: Chegou a hora
  alternative: Chegou o tempo
  rationale: A tradução retém «hora», motivo teológico joanino ligado ao momento determinado da morte, exaltação e glória de Jesus, e comunica que esse momento decisivo já chegou.
- issue: Tradução do título ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  alternative: o Ser Humano
  rationale: A forma tradicional preserva a função cristológica do título e sua ligação intertextual com Daniel 7, sem eliminar a ambiguidade e a amplitude de suas ressonâncias.
- issue: Alcance de δοξασθῇ
  choice: ser glorificado
  alternative: receber glória
  rationale: «Ser glorificado» mantém a voz passiva e não restringe a glória a mera honra pública; em João, ela abrange de modo paradoxal o caminho de Jesus pela morte e exaltação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem «Jesus, porém» soa natural na narrativa. Os dois-pontos evitam o pesado «dizendo», sem perda semântica, e a construção «de o Filho do Homem ser glorificado» conserva com clareza o sujeito do infinitivo.
