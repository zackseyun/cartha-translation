  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἄφες αὐτήν, ⸀ἵνα εἰς τὴν ἡμέραν τοῦ ἐνταφιασμοῦ μου ⸀τηρήσῃ αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/007.yaml
  text: So Jesus said[a], “Leave her alone[b], so that she may keep it for the day of my burial.”
translation:
  language: pt
  text: 'Então Jesus disse: “Deixe-a em paz[a], para que ela o guarde para o dia[b] do meu sepultamento.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deixe-a em paz; ela o guardou para o dia do meu sepultamento.” Alguns entendem a oração como descrição do que ela já fez, e não do que ainda poderá fazer.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “até o dia do meu sepultamento”. A construção grega também pode ser entendida com sentido temporal mais explícito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e a resposta de Jesus ao que acaba de ser dito, em português natural.
- source_word: Ἄφες αὐτήν
  choice: Deixe-a em paz
  rationale: Neste contexto, o imperativo de ἀφίημι ordena que parem de importuná-la ou interferir em sua ação.
- source_word: ἵνα
  choice: para que
  rationale: Mantém a relação de propósito ou resultado pretendido sem eliminar a dificuldade sintática da frase.
- source_word: εἰς τὴν ἡμέραν
  choice: para o dia
  rationale: Aponta para a ocasião futura em vista, sem impor no texto principal o sentido temporal mais explícito de “até o dia”.
- source_word: ἐνταφιασμοῦ
  choice: sepultamento
  rationale: Expressa de modo claro e digno o ato de sepultar ou colocar no túmulo.
- source_word: τηρήσῃ
  choice: guarde
  rationale: Preserva o sentido de conservar ou reservar, aqui expresso pelo subjuntivo em uma oração introduzida por ἵνα.
- source_word: αὐτό
  choice: isso
  rationale: Mantém a referência pronominal neutra ao perfume, sem acrescentar na fala um substantivo ausente do grego.
theological_decisions:
- issue: Relação entre a ação da mulher e o sepultamento futuro de Jesus
  choice: Apresentar a fala como uma orientação para que ela guarde isso para o dia do sepultamento de Jesus.
  alternative: 'Entender a oração como referência ao que ela já fez: “ela guardou isso para o dia do meu sepultamento”; ou traduzir com sentido temporal explícito: “que ela guarde isso até o dia do meu sepultamento”.'
  rationale: A construção grega é sintaticamente difícil e admite mais de uma compreensão. O texto principal conserva a leitura prospectiva mais direta, enquanto as notas registram as alternativas genuínas sem decidir silenciosamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Sepultamento” evita tanto coloquialismo quanto tecnicismo excessivo; as notas preservam a ambiguidade real da construção grega.
