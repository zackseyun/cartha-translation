id: JHN.12.16
reference: John 12:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ταῦτα οὐκ ἔγνωσαν ⸂αὐτοῦ οἱ μαθηταὶ⸃ τὸ πρῶτον, ἀλλ’ ὅτε ἐδοξάσθη Ἰησοῦς τότε ἐμνήσθησαν ὅτι ταῦτα ἦν ἐπ’ αὐτῷ γεγραμμένα καὶ ταῦτα ἐποίησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/016.yaml
  text: His disciples did not understand these things at first[a], but when Jesus was glorified[c][b], then they remembered that these things had been written about him and that they had done these things to him.
translation:
  language: pt
  text: No início, os seus discípulos não compreenderam essas coisas[a]. Mas, quando Jesus foi glorificado[b], eles se lembraram de que essas coisas estavam escritas a respeito dele[c] e de que lhe haviam feito essas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não reconheceram” ou “não souberam o que significavam essas coisas”.'
    reason: lexical_alternative
  - marker: b
    text: Em João, a glorificação de Jesus está ligada à sua morte, ressurreição e exaltação.
    reason: cross_reference
  - marker: c
    text: 'Ou: “escritas acerca dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνωσαν
  choice: não compreenderam
  rationale: No contexto, o verbo indica que os discípulos não captaram o significado dos acontecimentos, e não apenas que desconheciam certos fatos. A nota preserva a alternativa lexical mais literal.
- source_word: αὐτοῦ οἱ μαθηταί
  choice: os seus discípulos
  rationale: O genitivo expressa naturalmente a relação dos discípulos com Jesus; esta é uma formulação clara e idiomática em português.
- source_word: τὸ πρῶτον
  choice: No início
  rationale: Expressão temporal idiomática que indica a compreensão inicial dos discípulos, antes da glorificação de Jesus.
- source_word: ἐδοξάσθη
  choice: foi glorificado
  rationale: Preserva o vocabulário teologicamente carregado de João sem reduzi-lo a uma simples honra pública ou explicá-lo de forma excessivamente restrita.
- source_word: ἐμνήσθησαν
  choice: eles se lembraram
  rationale: Expressa de modo natural o aoristo de μιμνῄσκομαι e mantém a sequência narrativa.
- source_word: ἐπ’ αὐτῷ γεγραμμένα
  choice: estavam escritas a respeito dele
  rationale: ἐπί com o dativo tem aqui o sentido de referência — 'a respeito de' ou 'acerca de' —, e não um sentido espacial.
- source_word: ταῦτα ἐποίησαν αὐτῷ
  choice: lhe haviam feito essas coisas
  rationale: Mantém o sujeito plural não expresso do grego e o dativo αὐτῷ sem identificar explicitamente quem realizou as ações. O mais-que-perfeito situa os atos antes da lembrança dos discípulos.
- source_word: ταῦτα
  choice: essas coisas
  rationale: A repetição do demonstrativo neutro plural retoma coletivamente os atos narrados e os elementos das Escrituras, preservando a coesão do original.
theological_decisions:
- issue: O alcance da glorificação de Jesus em João
  choice: foi glorificado
  alternative: foi exaltado; foi honrado
  rationale: A linguagem joanina da glorificação pode abranger a morte, a ressurreição e a exaltação de Jesus. A tradução mantém essa amplitude e tensão em vez de impor uma delimitação.
- issue: A identidade dos que fizeram essas coisas a Jesus
  choice: manter o sujeito plural sem identificação explícita
  alternative: explicitar 'a multidão' ou entender o sujeito como 'os discípulos'
  rationale: O verbo grego está na terceira pessoa do plural sem sujeito expresso. Embora o contexto aponte para os participantes dos acontecimentos narrados, a tradução não acrescenta uma identificação ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “essas coisas” foi mantida para refletir a coesão do grego; “lhe haviam feito” preserva de modo conciso o dativo e evita inserir um sujeito que o original não nomeia.
