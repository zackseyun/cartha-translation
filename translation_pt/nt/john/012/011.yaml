reference: John 12:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι πολλοὶ δι’ αὐτὸν ὑπῆγον τῶν Ἰουδαίων καὶ ἐπίστευον εἰς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/011.yaml
  text: because many of the Jews were going away because of him and were believing in Jesus[a][b][c][d].
translation:
  language: pt
  text: porque muitos dos judeus iam embora por causa dele e criam em Jesus[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “muitos dos habitantes da Judeia”. Em João, o termo grego pode designar os judeus em geral, os habitantes da Judeia ou, em certos contextos, as autoridades judaicas.
    reason: alternative_reading
  - marker: b
    text: Ou “estavam indo embora”, “estavam partindo” ou “estavam se afastando”. O verbo grego está no imperfeito e indica uma ação em andamento ou repetida; o ponto de partida não é expresso.
    reason: lexical_alternative
  - marker: c
    text: Ou “tinham fé em Jesus” ou “confiavam em Jesus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: porque
  rationale: Introduz a causa da decisão dos principais sacerdotes mencionada no versículo anterior.
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: muitos dos judeus
  rationale: 'Preserva a relação partitiva do grego: trata-se de muitos dentre o grupo, não de todos os judeus.'
- source_word: δι’ αὐτόν
  choice: por causa dele
  rationale: διά com acusativo tem sentido causal neste contexto; o referente é Lázaro.
- source_word: ὑπῆγον
  choice: estavam se afastando
  rationale: O imperfeito indica ação contínua ou repetida. 'Afastando' conserva a ideia de retirada sem especificar além do texto exatamente de quem ou de que se afastavam.
- source_word: ἐπίστευον εἰς τὸν Ἰησοῦν
  choice: crendo em Jesus
  rationale: Mantém a linguagem de crença dirigida a Jesus e o aspecto contínuo do imperfeito, sem acrescentar conclusões doutrinárias não expressas no versículo.
theological_decisions:
- issue: Sentido de Ἰουδαίων no contexto joanino
  choice: judeus
  alternative: judeus da Judeia; judeanos
  rationale: A formulação principal preserva a designação grega e a construção partitiva, enquanto a nota registra a possível nuance geográfica. O texto não apresenta uma condenação indistinta de todo o povo judeu.
- issue: Força de πιστεύω εἰς
  choice: crendo em Jesus
  alternative: depositando a fé em Jesus; confiando em Jesus
  rationale: Expressa fé dirigida a Jesus, mas não transforma a declaração em uma formulação doutrinária mais ampla, como 'tornando-se discípulos' ou 'sendo salvos'.
- issue: Objeto implícito do afastamento
  choice: não explicitado
  alternative: afastando-se da posição ou influência das autoridades contrárias a Jesus
  rationale: O contexto favorece a ideia de abandono da esfera de influência dos opositores, mas o grego não declara expressamente o ponto de partida; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem 'por causa dele' foi antecipada para evitar a repetição pesada de 'porque ... por causa dele' e deixar inequívoco que Lázaro motivava tanto o afastamento quanto a fé em Jesus. O referente de 'dele' permanece recuperável do contexto anterior.
