id: JHN.12.46
reference: John 12:46
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγὼ φῶς εἰς τὸν κόσμον ἐλήλυθα, ἵνα πᾶς ὁ πιστεύων εἰς ἐμὲ ἐν τῇ σκοτίᾳ μὴ μείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/046.yaml
  text: I have come into the world as light[b][a], so that everyone who believes in me may not remain in the darkness.
translation:
  language: pt
  text: 'Eu vim ao mundo como luz[a], para que todo aquele que crê em mim não permaneça nas trevas.


    [a] Ou: “uma luz”. O grego não usa artigo; a expressão pode caracterizar Jesus como luz ou apresentá-lo como “uma luz”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma luz”. O grego não usa artigo; a expressão pode caracterizar Jesus como luz ou apresentá-lo como “uma luz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: como luz
  rationale: A construção sem artigo tem força qualitativa. “Como luz” preserva a metáfora joanina e expressa a identidade e a função de Jesus sem impor o artigo indefinido.
- source_word: εἰς τὸν κόσμον
  choice: ao mundo
  rationale: Em português, “vir ao mundo” expressa naturalmente o movimento para dentro da esfera do mundo e conserva o sentido encarnacional e missionário do contexto.
- source_word: ἐλήλυθα
  choice: vim
  rationale: Embora o perfeito grego destaque o resultado presente da vinda, o pretérito perfeito simples é a forma idiomática em português para uma vinda já realizada com relevância atual; “tenho vindo” sugeriria repetição ou continuidade indevida.
- source_word: ἵνα
  choice: para que
  rationale: Expressa de modo claro e natural a finalidade introduzida por ἵνα.
- source_word: πᾶς ὁ πιστεύων
  choice: todo aquele que crê
  rationale: Reproduz a abrangência geral da expressão e o caráter substantivado do particípio de modo corrente e digno em português.
- source_word: πιστεύων εἰς ἐμέ
  choice: crê em mim
  rationale: É a formulação portuguesa tradicional e ainda natural para a fé pessoal dirigida a Jesus, sem acrescentar explicação interpretativa.
- source_word: ἐν τῇ σκοτίᾳ
  choice: nas trevas
  rationale: “Trevas” é a expressão portuguesa natural para o domínio moral e espiritual simbolizado no uso joanino, preservando a imagem temática definida pelo artigo grego.
- source_word: μὴ μείνῃ
  choice: não permaneça
  rationale: O subjuntivo após “para que” preserva a finalidade negativa e a ideia de não continuar nesse estado.
theological_decisions:
- issue: Autodeclaração cristológica por meio da imagem da luz
  choice: “vim ao mundo como luz”
  alternative: “vim ao mundo como uma luz” ou “vim trazer luz ao mundo”
  rationale: A redação mantém a metáfora e sua força cristológica sem transformá-la numa explicação doutrinária nem sugerir que Jesus apenas traz algo distinto de si mesmo.
- issue: Abrangência de πᾶς ὁ πιστεύων
  choice: “todo aquele que crê”
  alternative: “quem crê” ou “todo o que crê”
  rationale: A escolha conserva a abrangência da classe dos que creem sem introduzir conclusões denominacionais sobre como a fé se origina.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Preferiu-se “vim” a “tenho vindo” por naturalidade aspectual em português, e “nas trevas” para conservar a imagem joanina reconhecível.
