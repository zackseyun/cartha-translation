lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: No dia seguinte
  rationale: Expressão temporal natural em português, preservando a sequência narrativa.
- source_word: ὁ ὄχλος πολὺς
  choice: a grande multidão
  rationale: Traduz com clareza o substantivo coletivo ὄχλος e a ideia de grande número expressa por πολὺς.
- source_word: ὁ ἐλθὼν εἰς τὴν ἑορτήν
  choice: que tinha vindo para a festa
  rationale: A oração relativa reproduz naturalmente o particípio atributivo; o mais-que-perfeito composto indica a anterioridade da vinda em relação ao momento narrado.
- source_word: ἀκούσαντες
  choice: ao ouvir
  rationale: Expressa de modo idiomático o valor circunstancial do particípio aoristo e acomoda a referência às pessoas que compõem a multidão.
- source_word: ὅτι ἔρχεται ὁ Ἰησοῦς
  choice: que Jesus estava chegando
  rationale: O progressivo no passado é natural na narrativa portuguesa e transmite o presente histórico grego sem alterar o ponto de vista temporal do relato.
- source_word: εἰς Ἱεροσόλυμα
  choice: a Jerusalém
  rationale: Com verbo de movimento, a preposição «a» expressa de modo natural o destino indicado por εἰς.
