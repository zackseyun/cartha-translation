  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐάν τίς μου ἀκούσῃ τῶν ῥημάτων καὶ μὴ ⸀φυλάξῃ, ἐγὼ οὐ κρίνω αὐτόν, οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον ἀλλ’ ἵνα σώσω τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/047.yaml
  text: And if anyone hears my words and does not keep them[a], I do not judge him; for I did not come to judge the world[b], but to save the world.
translation:
  language: pt
  text: E, se alguém ouvir as minhas palavras e não as guardar, eu não o julgo[a]; pois não vim para julgar o mundo, mas para salvar o mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eu não o condeno”. O verbo grego pode significar “julgar” ou, conforme o contexto, assumir o sentido de uma sentença desfavorável.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τίς
  choice: se alguém
  rationale: A construção condicional indefinida apresenta um caso geral; “se alguém” é natural em português e preserva seu alcance aberto.
- source_word: ἀκούσῃ
  choice: ouvir
  rationale: Conserva o sentido primário de perceber a mensagem falada, sem acrescentar a ideia mais forte de atenção ou obediência contida em “escutar” em certos usos.
- source_word: τῶν ῥημάτων
  choice: as minhas palavras
  rationale: ῥήματα designa palavras ou enunciados falados; a expressão é natural, digna e mantém a referência explícita às palavras de Jesus.
- source_word: φυλάξῃ
  choice: as guardar
  rationale: φυλάσσω pode significar guardar, preservar ou observar. “Guardar” mantém a amplitude semântica, incluindo fidelidade obediente, sem estreitá-la para “obedecer”.
- source_word: οὐ κρίνω αὐτόν
  choice: eu não o julgo
  rationale: “Julgar” preserva a repetição de κρίνω na oração seguinte e a tensão joanina sobre juízo. O pronome “o” corresponde ao singular αὐτόν, retomando o genérico “alguém”.
- source_word: οὐ γὰρ ἦλθον
  choice: pois não vim
  rationale: O aoristo resume a vinda e a missão de Jesus; o pretérito perfeito “vim” é a forma idiomática em português.
- source_word: ἵνα κρίνω
  choice: para julgar
  rationale: A construção expressa propósito, naturalmente vertido pela locução “para” com infinitivo.
- source_word: τὸν κόσμον
  choice: o mundo
  rationale: κόσμος é um termo característico de João e, aqui, designa o mundo humano como objeto da missão; a tradução tradicional e contextualmente adequada é “o mundo”.
- source_word: ἵνα σώσω
  choice: para salvar
  rationale: σῴζω significa salvar ou resgatar; “salvar” preserva o sentido soteriológico estabelecido e o paralelismo com “para julgar”.
theological_decisions:
- issue: A declaração “eu não o julgo” em relação à linguagem joanina de juízo
  choice: Traduzir ambas as ocorrências de κρίνω por “julgar” e deixar implícita a nuance ligada ao propósito da missão.
  alternative: Traduzir a primeira ocorrência por “condenar” ou explicitar “não o julgo agora”.
  rationale: A uniformidade lexical mantém a tensão genuína entre salvação e juízo no Evangelho, sem impor uma harmonização temporal nem reduzir o verbo ao resultado adverso do julgamento.
- issue: O pronome masculino singular αὐτόν com referente genérico
  choice: Usar “o”, retomando gramaticalmente “alguém”.
  alternative: Usar “essa pessoa”.
  rationale: Em português, “alguém” é pronome indefinido sem marca lexical de sexo, mas sua retomada padrão neste contexto é o clítico singular “o”. A formulação aplica-se genericamente a qualquer pessoa.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A redação conserva a repetição retórica de “mundo” e de “julgar”, bem como o verbo “guardar”, frequente na linguagem joanina. A próclise “as guardar” após “não” segue o uso culto natural.
