  text: τοῦτο δὲ ἔλεγεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/033.yaml
  text: He was saying this to signify what kind of death he was about to die[a].
translation:
  language: pt
  text: Ele dizia isso para indicar de que tipo de morte estava prestes a morrer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por que tipo de morte». A expressão grega pode enfatizar a maneira da morte.'
    reason: alternativa lexical
lexical_decisions:
- source_word: τοῦτο
  choice: isso
  rationale: O demonstrativo neutro singular retoma a declaração anterior de Jesus; «isso» é a forma natural em português nesse contexto.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui δέ funciona como conectivo narrativo leve. O português não exige um marcador explícito, e acrescentar «ora» ou «mas» poderia sugerir uma transição ou oposição forte demais.
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito apresenta a fala em seu contexto passado; «dizia» preserva o aspecto de modo natural, sem a construção mais pesada «estava dizendo».
- source_word: σημαίνων
  choice: para indicar
  rationale: O particípio descreve o propósito ou efeito explicativo da fala. «Indicar» comunica que suas palavras davam a conhecer algo de maneira indireta.
- source_word: ποίῳ θανάτῳ
  choice: com que tipo de morte
  rationale: O dativo pode salientar a maneira ou espécie de morte. «Com que tipo de morte» preserva essa nuance e evita reduzir a expressão apenas a «que morte».
- source_word: ἤμελλεν
  choice: estava prestes a
  rationale: μέλλω aponta aqui para um acontecimento futuro iminente. A escolha não acrescenta a noção mais forte de destino inevitável.
- source_word: ἀποθνῄσκειν
  choice: morrer
  rationale: Infinitivo complementar de ἤμελλεν; «morrer» é o equivalente direto e idiomático.
theological_decisions:
- issue: Explicitar que a morte seria por crucificação
  choice: 'Manter a formulação indireta: «com que tipo de morte estava prestes a morrer»'
  alternative: «que morreria crucificado» ou «como seria executado»
  rationale: O narrador explica que as palavras de Jesus indicavam a natureza ou maneira de sua morte, mas não nomeia a crucificação neste versículo. Explicitá-la no texto principal ultrapassaria a formulação da fonte.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Dizia» soa mais natural do que «estava dizendo»; «estava prestes a morrer» mantém a iminência sem impor uma leitura teológica adicional.
