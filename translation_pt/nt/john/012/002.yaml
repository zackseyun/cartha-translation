id: JHN.12.2
reference: John 12:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐποίησαν οὖν αὐτῷ δεῖπνον ἐκεῖ, καὶ ἡ Μάρθα διηκόνει, ὁ δὲ Λάζαρος εἷς ἦν ⸀ἐκ τῶν ἀνακειμένων σὺν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/002.yaml
  text: So they made a dinner for him there[a], and Martha was serving, but Lazarus was one of those reclining at the table with him.
translation:
  language: pt
  text: Então, prepararam ali um jantar para ele. Marta servia, enquanto Lázaro era um dos que estavam reclinados à mesa com ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “reclinados com ele”. Reclinar-se era a postura costumeira durante uma refeição formal.
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν
  choice: prepararam
  rationale: Com δεῖπνον, ποιέω tem o sentido natural de preparar ou oferecer uma refeição. “Prepararam” é corrente em português e não identifica quem foram os anfitriões.
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e a ligação com o contexto anterior sem a formalidade excessiva de “portanto”.
- source_word: αὐτῷ
  choice: para ele
  rationale: O dativo indica que o jantar foi preparado em benefício de Jesus.
- source_word: δεῖπνον
  choice: jantar
  rationale: Designa a refeição principal, geralmente tomada à noite; “jantar” é claro e atual.
- source_word: ἐκεῖ
  choice: ali
  rationale: Retoma naturalmente o lugar mencionado no contexto, Betânia.
- source_word: διηκόνει
  choice: servia
  rationale: O imperfeito retrata uma ação em andamento. Neste contexto, o verbo se refere ao serviço durante a refeição, sem conotação eclesiástica necessária.
- source_word: δὲ
  choice: enquanto
  rationale: Expressa com naturalidade tanto a simultaneidade quanto o contraste leve entre Marta servindo e Lázaro reclinado à mesa.
- source_word: εἷς ἦν ἐκ
  choice: era um dos
  rationale: Reproduz a identificação de Lázaro como integrante do grupo que participava da refeição.
- source_word: ἀνακειμένων
  choice: que estavam reclinados à mesa
  rationale: Preserva a postura cultural específica adotada nas refeições formais; “à mesa” explicita o contexto implícito no verbo.
- source_word: σὺν αὐτῷ
  choice: com ele
  rationale: Expressa acompanhamento; no contexto, o pronome se refere a Jesus.
theological_decisions: []
