reference: John 12:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἔγνω ⸀οὖν ὄχλος πολὺς ἐκ τῶν Ἰουδαίων ὅτι ἐκεῖ ἐστιν, καὶ ἦλθον οὐ διὰ τὸν Ἰησοῦν μόνον, ἀλλ’ ἵνα καὶ τὸν Λάζαρον ἴδωσιν ὃν ἤγειρεν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/009.yaml
  text: So a large crowd of the Jews learned that he was there[a], and they came not only because of Jesus, but also so that they might see Lazarus, whom he had raised from the dead.
translation:
  language: pt
  text: Então, uma grande multidão dentre os judeus[a] ficou sabendo que Jesus estava ali. Eles vieram não somente por causa de Jesus, mas também para ver Lázaro, a quem ele havia ressuscitado dentre os mortos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dos habitantes da Judeia». O termo grego pode referir-se aos judeus em geral ou, em alguns contextos de João, mais especificamente aos habitantes da Judeia.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔγνω
  choice: ficou sabendo
  rationale: O aoristo de γινώσκω indica aqui a aquisição da informação, não apenas um estado de conhecimento; «ficou sabendo» é natural em português narrativo.
- source_word: οὖν
  choice: Então
  rationale: Mantém a conexão narrativa e consecutiva com o contexto anterior em linguagem corrente.
- source_word: ὄχλος πολὺς
  choice: uma grande multidão
  rationale: Preserva o substantivo coletivo singular e a ideia de grande número.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: dentre os judeus
  rationale: ἐκ indica que a multidão procedia de um grupo maior. «Dentre os judeus» preserva essa relação sem decidir silenciosamente se Ἰουδαῖοι tem sentido étnico-religioso ou geográfico.
- source_word: ὅτι ἐκεῖ ἐστιν
  choice: que Jesus estava ali
  rationale: O sujeito implícito é explicitado como Jesus para evitar ambiguidade em português; «estava» é a concordância temporal natural depois de um verbo narrativo no passado.
- source_word: ἦλθον
  choice: eles foram
  rationale: No português moderno, «foram» expressa naturalmente o deslocamento até o lugar mencionado a partir da perspectiva do narrador; o pronome explicita o sujeito após a mudança de número entre «multidão» e o verbo grego plural.
- source_word: οὐ διὰ τὸν Ἰησοῦν μόνον
  choice: não somente por causa de Jesus
  rationale: διά com acusativo expressa motivo; a formulação conserva a construção correlativa e é clara em português.
- source_word: ἀλλ’ ἵνα καὶ ... ἴδωσιν
  choice: mas também para ver
  rationale: O infinitivo final em português comunica de modo natural a finalidade expressa por ἵνα com o subjuntivo, dentro da correlação «não somente... mas também».
- source_word: Λάζαρον
  choice: Lázaro
  rationale: Adota a forma tradicional e corrente do nome em português.
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν
  choice: a quem ele havia ressuscitado dentre os mortos
  rationale: O mais-que-perfeito composto esclarece que a ressurreição precedeu a ida da multidão. «Dentre os mortos» conserva o valor de ἐκ e a expressão coletiva sem acrescentar que Lázaro recebeu a ressurreição final.
theological_decisions:
- issue: Sentido de Ἰουδαίων no Evangelho de João
  choice: judeus
  alternative: judeanos
  rationale: Neste contexto de multidão ligada à festa, «judeus» é uma leitura plausível e amplamente compreensível, mas o termo joanino também pode designar mais especificamente os habitantes da Judeia. A nota preserva essa ambiguidade e evita transformar o grupo numa caracterização hostil de todo o povo judeu.
- issue: Descrição do retorno de Lázaro à vida
  choice: ressuscitado dentre os mortos
  alternative: levantado dentre os mortos
  rationale: «Ressuscitado» comunica com clareza o sentido contextual de ἐγείρω. A expressão não determina a natureza escatológica do acontecimento além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A divisão em duas frases reduz a carga sintática sem alterar a progressão do versículo. «Não somente... mas também» mantém o paralelismo formal; «dentre» preserva a ideia de procedência presente em ἐκ.
