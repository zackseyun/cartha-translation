  yaml_path: translation/nt/john/012/010.yaml
  text: So the chief priests decided to kill Lazarus also,[a]
translation:
  language: pt
  text: Então, os principais sacerdotes decidiram matar Lázaro também,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “planejaram matar Lázaro também”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: decidiram
  rationale: O verbo indica deliberação que resulta numa decisão ou propósito definido. “Decidiram” é natural e preserva a intenção deliberada, sem acrescentar a ideia específica de conspiração.
- source_word: δὲ
  choice: Por isso
  rationale: Neste contexto narrativo, a conjunção liga a decisão dos principais sacerdotes aos acontecimentos anteriores. “Por isso” expressa naturalmente essa progressão contextual, embora δέ, isoladamente, seja uma conexão flexível.
- source_word: οἱ ἀρχιερεῖς
  choice: os principais sacerdotes
  rationale: No Evangelho, o plural designa os integrantes da liderança sacerdotal. “Principais sacerdotes” é claro e evita sugerir a existência simultânea de vários sumos sacerdotes em exercício.
- source_word: ἵνα
  choice: matar
  rationale: Após “decidiram”, a construção de finalidade ou conteúdo com ἵνα e subjuntivo é expressa de modo idiomático em português pelo infinitivo.
- source_word: καὶ
  choice: também
  rationale: 'A partícula tem valor aditivo: Lázaro é incluído entre os alvos da intenção homicida.'
- source_word: τὸν Λάζαρον
  choice: Lázaro
  rationale: O nome próprio segue a forma portuguesa consagrada; o artigo grego não precisa ser reproduzido nesta construção.
- source_word: ἀποκτείνωσιν
  choice: matar
  rationale: É a tradução direta e natural do verbo. “Executar” poderia sugerir um procedimento judicial, e “assassinar” acrescentaria uma avaliação lexical não explicitada pelo termo.
theological_decisions:
- issue: Caracterização da intenção dos principais sacerdotes contra Lázaro
  choice: Apresentar diretamente a decisão deliberada de matar Lázaro, sem explicar o motivo nem caracterizá-la como conspiração.
  alternative: Empregar linguagem mais carregada, como “tramaram” ou “conspiraram para matar”.
  rationale: O texto declara uma decisão intencional, mas não usa neste versículo um termo técnico que exija a ideia adicional de trama ou conspiração.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A ordem “matar também Lázaro” conserva com naturalidade o valor aditivo de καί. A vírgula final acompanha a continuidade sintática do versículo no contexto.
