id: JHN.12.42
reference: John 12:42
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅμως μέντοι καὶ ἐκ τῶν ἀρχόντων πολλοὶ ἐπίστευσαν εἰς αὐτόν, ἀλλὰ διὰ τοὺς Φαρισαίους οὐχ ὡμολόγουν ἵνα μὴ ἀποσυνάγωγοι γένωνται,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/042.yaml
  text: Nevertheless, even among the rulers many believed in him, but because of the Pharisees they were not confessing it, so that they might not become excluded from the synagogue.
translation:
  language: pt
  text: Mesmo assim, até entre as autoridades muitos creram nele. Mas, por causa dos fariseus, não declaravam essa fé, para não serem excluídos da comunidade da sinagoga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “expulsos da sinagoga”. O termo grego indica exclusão da comunidade vinculada à sinagoga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως μέντοι
  choice: Mesmo assim
  rationale: A combinação de partículas tem forte valor concessivo e adversativo; “Mesmo assim” comunica isso de modo natural no português atual.
- source_word: καὶ ἐκ τῶν ἀρχόντων πολλοὶ
  choice: até entre as autoridades muitos
  rationale: ἐκ com o genitivo indica pertencimento ao grupo, e ἄρχοντες designa aqui pessoas investidas de liderança ou autoridade. A formulação evita o sentido monárquico que “governantes” poderia sugerir.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: creram nele
  rationale: É a forma portuguesa corrente de expressar a construção joanina πιστεύω εἰς, que dirige a fé à pessoa de Jesus.
- source_word: διὰ τοὺς Φαρισαίους
  choice: por causa dos fariseus
  rationale: διά com acusativo expressa causa. A tradução não acrescenta explicitamente “por medo”, embora o contexto permita inferi-lo.
- source_word: οὐχ ὡμολόγουν
  choice: não declaravam essa fé
  rationale: O imperfeito indica uma conduta continuada. Como o grego não traz objeto expresso, “essa fé” retoma o ato de crer mencionado antes sem decidir explicitamente entre confessar Jesus e confessar a própria fé; “declaravam” comunica a manifestação pública envolvida no contexto.
- source_word: ἵνα μὴ
  choice: para não
  rationale: Expressa de maneira concisa e natural a finalidade de evitar a consequência indicada a seguir.
- source_word: ἀποσυνάγωγοι γένωνται
  choice: serem excluídos da comunidade da sinagoga
  rationale: O adjetivo denota exclusão do âmbito comunitário da sinagoga, e a formulação conserva o alcance social e religioso do termo sem pressupor um procedimento jurídico específico.
theological_decisions:
- issue: Natureza da fé das autoridades à luz da teologia joanina
  choice: Traduzir ἐπίστευσαν diretamente como “creram”, mantendo ao mesmo tempo a informação de que não declaravam essa fé.
  alternative: Enfraquecer para “alegaram crer” ou fortalecer para “alcançaram a fé salvadora”.
  rationale: O texto afirma que creram em Jesus, mas também registra sua falta de confissão. A tradução preserva essa tensão e não determina além do texto a natureza ou o resultado definitivo dessa fé.
- issue: Objeto implícito de ὡμολόγουν
  choice: “não declaravam essa fé”
  alternative: “não o confessavam” ou “não confessavam isso”
  rationale: O original não expressa objeto. A redação escolhida remete ao conteúdo antecedente sem fixar de forma exclusiva se a confissão tinha como objeto gramatical Jesus ou a fé nele.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Autoridades” preserva o caráter institucional do grupo; “comunidade da sinagoga” esclarece que a exclusão envolvia mais que a simples retirada de um edifício.
