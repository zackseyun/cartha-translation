  verdict: approve
  source_fidelity: A tradução representa com precisão a concessão de ὅμως μέντοι, o grupo das autoridades, a fé em Jesus, a causa ligada aos fariseus, a não confissão continuada e a finalidade de evitar a exclusão sinagogal. “Não declaravam essa fé” fornece em português um complemento natural sem transformar o objeto implícito de ὡμολόγουν em uma afirmação doutrinária mais específica do que o grego exige.
  naturalness: O português é moderno, claro e adequado a leitores brasileiros e internacionais. “Mesmo assim”, “autoridades”, “por causa dos fariseus” e “para não serem excluídos” soam naturais. “Comunidade da sinagoga” comunica bem a dimensão comunitária da exclusão.
  terminology: “Creram nele” preserva a formulação joanina sem qualificar indevidamente a natureza dessa fé. “Autoridades” é apropriado para ἄρχοντες neste contexto. A nota sobre “expulsos da sinagoga” oferece uma alternativa idiomática e explica adequadamente o alcance de ἀποσυνάγωγοι.
