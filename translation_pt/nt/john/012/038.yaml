id: JHN.12.38
reference: John 12:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος Ἠσαΐου τοῦ προφήτου πληρωθῇ ὃν εἶπεν· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/038.yaml
  text: 'so that the word of Isaiah the prophet might be fulfilled[a], which he said: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?”'
translation:
  language: pt
  text: 'para que se cumprisse a palavra do profeta Isaías, que disse: “Senhor, quem creu em nossa mensagem[a]? E a quem foi revelado o braço do Senhor?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “naquilo que ouvimos” ou “em nosso anúncio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz naturalmente a oração de cumprimento e preserva, sem resolver, a possível nuance de propósito e resultado.
- source_word: ὁ λόγος Ἠσαΐου τοῦ προφήτου
  choice: a palavra do profeta Isaías
  rationale: Mantém a fórmula de cumprimento e traduz λόγος de modo direto e idiomático.
- source_word: πληρωθῇ
  choice: se cumprisse
  rationale: Reproduz o aoristo passivo do subjuntivo após ἵνα e conserva o motivo joanino do cumprimento das Escrituras.
- source_word: Κύριε
  choice: Senhor
  rationale: Equivalente natural do vocativo κύριε no contexto da citação bíblica.
- source_word: ἐπίστευσεν
  choice: creu
  rationale: O pretérito perfeito simples é natural em português na pergunta retórica e corresponde ao aoristo grego.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: em nossa mensagem
  rationale: No contexto, ἀκοή designa aquilo que foi ouvido ou proclamado. “Mensagem” comunica esse conteúdo com clareza em português moderno; a ambiguidade lexical é registrada em nota.
- source_word: ὁ βραχίων κυρίου
  choice: o braço do Senhor
  rationale: Preserva a metáfora bíblica da ação e do poder divinos, sem interpretá-la no corpo do texto.
- source_word: ἀπεκαλύφθη
  choice: foi revelado
  rationale: Mantém explicitamente a voz passiva e soa natural em português.
theological_decisions:
- issue: Linguagem de cumprimento e relação entre propósito e resultado
  choice: “para que se cumprisse”
  alternative: “de modo que se cumpriu”
  rationale: A construção com ἵνα pode carregar nuances de propósito, resultado ou ambas no estilo joanino. A tradução mantém a formulação tradicional de cumprimento sem impor uma explicação determinista.
- issue: Sentido de ἀκοή na citação de Isaías
  choice: “nossa mensagem”
  alternative: “aquilo que ouvimos” ou “nosso anúncio”
  rationale: O substantivo pode indicar o ato de ouvir, aquilo que se ouviu ou a mensagem anunciada. O texto principal adota a leitura contextual mais clara, enquanto a nota preserva as alternativas genuínas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, preservando a fórmula de cumprimento, as perguntas retóricas e a metáfora “braço do Senhor”.
