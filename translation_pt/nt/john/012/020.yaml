  text: Ἦσαν δὲ ⸂Ἕλληνές τινες⸃ ἐκ τῶν ἀναβαινόντων ἵνα προσκυνήσωσιν ἐν τῇ ἑορτῇ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/020.yaml
  text: There were some Greeks among those going up to worship at the feast[a].
translation:
  language: pt
  text: Havia alguns gregos entre os que subiam para adorar durante a festa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “certos gregos”; possivelmente não judeus que subiam para adorar durante a festa.
    reason: Registra uma tradução alternativa para τινες e a possível, mas não explícita, identidade não judaica dessas pessoas.
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: Havia
  rationale: O imperfeito de εἰμί tem aqui sentido existencial, expresso naturalmente por “havia”. A partícula δέ marca uma transição leve, que o português pode deixar implícita sem perda relevante.
- source_word: Ἕλληνές τινες
  choice: alguns gregos
  rationale: Ἕλληνες designa mais diretamente “gregos”, enquanto τινες acrescenta indefinição. A tradução não generaliza o termo para “gentios” nem define o estatuto religioso dessas pessoas.
- source_word: ἐκ τῶν ἀναβαινόντων
  choice: entre os que tinham subido
  rationale: ἐκ indica que os gregos faziam parte do grupo de peregrinos. O verbo “subir” preserva a maneira tradicional de falar da viagem a Jerusalém; o mais-que-perfeito composto situa naturalmente a subida antes do encontro narrado no versículo seguinte.
- source_word: ἵνα προσκυνήσωσιν
  choice: para adorar
  rationale: ἵνα com o subjuntivo expressa finalidade. Neste contexto, προσκυνέω se refere ao culto religioso, adequadamente traduzido por “adorar”.
- source_word: ἐν τῇ ἑορτῇ
  choice: durante a festa
  rationale: A expressão situa a adoração no contexto da festa judaica. “Durante a festa” é natural em português e evita sugerir que a própria festa fosse o objeto da adoração.
theological_decisions:
- issue: Identidade dos Ἕλληνες
  choice: gregos
  alternative: gentios
  rationale: O texto os chama de Ἕλληνες e não esclarece se eram prosélitos, tementes a Deus ou judeus de cultura grega. “Gregos” preserva a designação textual e a ambiguidade histórica e religiosa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Festa” mantém o vocabulário joanino tradicional sem acrescentar aqui o nome “Páscoa”, embora o contexto o forneça.
