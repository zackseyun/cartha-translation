  naturalness: O português é claro, moderno e apropriado ao registro narrativo. “Entre os que subiam” é igualmente natural e reproduz melhor o aspecto do original.
  terminology: “Gregos”, “adorar” e “festa” são escolhas corretas. “Gregos” preserva a ambiguidade histórica e religiosa do texto sem a resolver como “gentios” ou como uma categoria religiosa específica.
