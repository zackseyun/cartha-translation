translation_notes:
  register: Português moderno, claro e digno, com formas nominais tradicionais. O presente histórico foi preservado para reproduzir a vivacidade narrativa de João; “vai/vão” foi preferido a “vem/vêm” por corresponder melhor à perspectiva do deslocamento no contexto.
