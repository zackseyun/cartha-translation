base_translation:
  language: en
  yaml_path: translation/nt/john/012/022.yaml
  text: Philip comes and tells Andrew[a]; Andrew and Philip come and tell Jesus.
translation:
  language: pt
  text: Filipe vem e diz a André[a]; André e Filipe vêm e dizem a Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega o presente histórico em toda a frase (“vem… diz… vêm… dizem”), um recurso narrativo comum que dá vivacidade ao relato. Muitas traduções vertem esses verbos no passado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: vai / vão
  rationale: O verbo pode significar “ir” ou “vir” conforme a perspectiva. Aqui, Filipe se dirige a André e, em seguida, ambos se dirigem a Jesus; “vai/vão” expressa naturalmente esse movimento em português e mantém o presente histórico do grego.
- source_word: λέγει / λέγουσιν
  choice: conta / contam
  rationale: Neste contexto, os verbos introduzem a transmissão de uma informação. “Conta a” é corrente e mais natural do que o rígido “diz a”, sem acrescentar conteúdo ao que foi comunicado.
- source_word: τῷ Ἀνδρέᾳ
  choice: a André
  rationale: O dativo indica o destinatário da comunicação; o nome é vertido em sua forma portuguesa tradicional.
- source_word: τῷ Ἰησοῦ
  choice: a Jesus
  rationale: O dativo indica o destinatário da comunicação; a construção preserva o paralelismo com “conta a André”.
- source_word: καί
  choice: e
  rationale: Mantém a coordenação simples e o fluxo paratático do texto grego, sem impor uma relação temporal ou causal mais específica.
- source_word: ὁ Φίλιππος
  choice: Filipe
  rationale: Emprega-se a forma portuguesa tradicional do nome; o artigo grego diante do nome próprio não precisa ser reproduzido.
