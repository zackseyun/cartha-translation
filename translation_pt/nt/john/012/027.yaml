source:
  edition: SBLGNT
  text: Νῦν ἡ ψυχή μου τετάρακται, καὶ τί εἴπω; πάτερ, σῶσόν με ἐκ τῆς ὥρας ταύτης. ἀλλὰ διὰ τοῦτο ἦλθον εἰς τὴν ὥραν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/027.yaml
  text: Now my soul is troubled[a], and what should I say? Father, save me from this hour. But for this reason I came to this hour.
translation:
  language: pt
  text: Agora a minha alma está perturbada[a], e o que direi? Pai, salva-me desta hora. Mas foi por isso que vim a esta hora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E o que direi? ‘Pai, salva-me desta hora’?” O grego também pode ser entendido como uma pergunta retórica, em vez de uma petição direta.'
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Agora
  rationale: Marca a imediatidade da aflição presente de Jesus de modo direto e natural.
- source_word: ψυχή
  choice: alma
  rationale: Preserva a linguagem antropológica e a gravidade do termo, que aqui se refere à vida interior ou à própria pessoa de Jesus.
- source_word: τετάρακται
  choice: está perturbada
  rationale: Expressa o estado presente resultante de uma perturbação, conforme a força do perfeito, sem exagerar nem amenizar a aflição.
- source_word: τί εἴπω
  choice: o que direi?
  rationale: Reproduz naturalmente o subjuntivo deliberativo e mantém aberta a ligação possível com a frase seguinte.
- source_word: πάτερ
  choice: Pai
  rationale: Forma natural e digna de vocativo dirigido a Deus.
- source_word: σῶσόν με ἐκ τῆς ὥρας ταύτης
  choice: salva-me desta hora
  rationale: Mantém o imperativo e a ideia de livramento da hora iminente; “salvar” também conserva a amplitude semântica do verbo.
- source_word: ὥρα
  choice: hora
  rationale: Preserva o motivo joanino do tempo determinado do sofrimento, morte e glorificação de Jesus.
- source_word: ἀλλὰ διὰ τοῦτο
  choice: Mas foi precisamente para isto
  rationale: Comunica o contraste e a finalidade ou razão com clareza; “precisamente” torna natural em português a ênfase contextual sem eliminar a ambiguidade referencial de “isto”.
- source_word: ἦλθον εἰς τὴν ὥραν ταύτην
  choice: cheguei a esta hora
  rationale: Representa εἰς como chegada ao momento decisivo, evitando transformar explicitamente a preposição em finalidade, embora o contexto a sugira.
theological_decisions:
- issue: Se “Pai, salva-me desta hora” é uma petição direta ou parte de uma pergunta retórica iniciada por “o que direi?”
  choice: 'Apresentar como petição direta: “Pai, salva-me desta hora.”'
  alternative: 'Ler como pergunta retórica: “E o que direi? ‘Pai, salva-me desta hora’?”'
  rationale: A pontuação não fazia parte dos manuscritos mais antigos, e a sintaxe permite ambas as leituras. A pontuação do SBLGNT favorece a petição direta, preservando a tensão entre a perturbação real de Jesus e sua aceitação da missão; a nota registra a alternativa sem resolver dogmaticamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva “alma” e “hora” por seu peso literário e teológico em João, sem recorrer a linguagem denominacional.
