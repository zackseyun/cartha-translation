id: JHN.12.35
reference: John 12:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἔτι μικρὸν χρόνον τὸ φῶς ⸂ἐν ὑμῖν⸃ ἐστιν. περιπατεῖτε ⸀ὡς τὸ φῶς ἔχετε, ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ, καὶ ὁ περιπατῶν ἐν τῇ σκοτίᾳ οὐκ οἶδεν ποῦ ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/035.yaml
  text: So Jesus said to them[a], “The light is still among you for a little while. Walk while you have the light, so that darkness may not overtake you. The one who walks in the darkness does not know where he is going.”
translation:
  language: pt
  text: 'Então Jesus lhes disse: “A luz ainda está entre vocês[a] por mais um pouco de tempo. Caminhem enquanto têm a luz, para que as trevas não os alcancem. Quem caminha nas trevas não sabe para onde vai.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em vocês” ou “com vocês”. A expressão grega admite mais de um sentido, embora “entre vocês” se ajuste melhor ao contexto imediato da presença pública de Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Funciona como conector discursivo natural em português, ligando a fala de Jesus ao diálogo anterior sem impor uma conclusão lógica forte.
- source_word: Ἔτι μικρὸν χρόνον
  choice: ainda ... por um pouco de tempo
  rationale: Preserva tanto a ideia de continuidade de ἔτι quanto a brevidade expressa por μικρὸν χρόνον, em linguagem portuguesa corrente.
- source_word: τὸ φῶς
  choice: a luz
  rationale: Mantém literalmente a imagem joanina e seu peso metafórico e cristológico, sem explicá-la dentro do texto.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: No contexto imediato, indica de modo mais provável a presença pública de Jesus em meio aos ouvintes; a ambiguidade da expressão grega é preservada em nota.
- source_word: περιπατεῖτε
  choice: Caminhem
  rationale: Conserva a metáfora de andar como orientação de vida, sem reduzi-la a uma paráfrase abstrata.
- source_word: ὡς
  choice: enquanto
  rationale: 'A leitura temporal se ajusta à urgência da declaração: agir durante o período em que a luz está disponível.'
- source_word: ἵνα μὴ
  choice: para que ... não
  rationale: Expressa naturalmente em português a finalidade preventiva da oração grega.
- source_word: σκοτία
  choice: as trevas
  rationale: Preserva o contraste joanino tradicional e inteligível entre a luz e as trevas.
- source_word: καταλάβῃ
  choice: alcancem
  rationale: Reproduz a imagem dinâmica de as trevas chegarem a alguém e apanhá-lo; evita resolver o verbo como simples vitória espiritual.
- source_word: ὁ περιπατῶν
  choice: Quem caminha
  rationale: Representa de modo natural o particípio substantivado genérico, sem introduzir gênero desnecessário.
- source_word: ἐν τῇ σκοτίᾳ
  choice: nas trevas
  rationale: Mantém a expressão definida e o contraste temático com “a luz”, em formulação idiomática portuguesa.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: não sabe para onde vai
  rationale: Tradução direta e idiomática que conserva o sentido direcional e existencial da frase.
theological_decisions:
- issue: Sentido de ἐν ὑμῖν em relação à luz
  choice: entre vocês
  alternative: em vocês; com vocês
  rationale: O cenário narrativo favorece a presença de Jesus, a luz, em meio à multidão por tempo limitado. A nota conserva os sentidos interior e associativo possíveis, sem importar uma doutrina específica de habitação interior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo; “caminhem” e “trevas” preservam as imagens centrais sem soar arcaicos. O marcador [a] aparece imediatamente após a expressão a que se refere.
