id: JHN.12.24
reference: John 12:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ ὁ κόκκος τοῦ σίτου πεσὼν εἰς τὴν γῆν ἀποθάνῃ, αὐτὸς μόνος μένει· ἐὰν δὲ ἀποθάνῃ, πολὺν καρπὸν φέρει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/024.yaml
  text: Truly[a], truly, I say to you, unless the grain of wheat falls into the ground and dies, it remains by itself; but if it dies[b], it bears much fruit.
translation:
  language: pt
  text: 'Em verdade, em verdade lhes digo: se o grão de trigo não cair na terra e morrer, permanece por si só[a]; mas, se morrer[b], dá muito fruto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: permanece sozinho.'
    reason: lexical_alternative
  - marker: b
    text: A imagem é a de um grão que precisa morrer na terra para produzir fruto; no contexto, Jesus aplica esse padrão à própria morte e aos que o seguem.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Preserva a repetição solene característica de João e comunica com clareza a força asseverativa de ἀμήν em português atual e digno.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Mantém a fórmula de discurso direto e o plural de ὑμῖν de modo natural em português amplamente compreensível.
- source_word: ἐὰν μὴ
  choice: se ... não
  rationale: Expressa naturalmente a condição negativa em português, sem alterar a relação lógica do grego.
- source_word: ὁ κόκκος τοῦ σίτου
  choice: o grão de trigo
  rationale: É a expressão portuguesa corrente para o grão ou semente de trigo e conserva a imagem agrícola.
- source_word: πεσὼν εἰς τὴν γῆν
  choice: cair na terra
  rationale: Converte o particípio adverbial em verbo finito, como exige a fluência portuguesa, preservando a sequência da queda na terra antes da morte.
- source_word: ἀποθάνῃ
  choice: morrer
  rationale: O infinitivo pessoalmente não marcado após a construção condicional portuguesa reproduz de modo natural o aoristo subjuntivo nas duas condições.
- source_word: αὐτὸς μόνος μένει
  choice: permanece por si só
  rationale: Conserva tanto a ideia de permanência quanto a ênfase de que o grão fica sozinho, sem sugerir necessariamente solidão emocional.
- source_word: ἐὰν δὲ ἀποθάνῃ
  choice: mas, se morrer
  rationale: A conjunção 'mas' torna explícito o contraste marcado por δέ sem ampliar o sentido.
- source_word: πολὺν καρπὸν φέρει
  choice: dá muito fruto
  rationale: Expressão natural em português que preserva a metáfora de produzir fruto e evita interpretar καρπός como 'colheita'.
theological_decisions:
- issue: Imagem agrícola com significado cristológico e implicações para o discipulado
  choice: Manter no texto principal a imagem agrícola literal, sem explicitar sua aplicação teológica.
  alternative: Expandir interpretativamente o versículo para declarar que Jesus fala de sua própria morte e dos resultados dela.
  rationale: O contexto aponta para a morte de Jesus e, nos versículos seguintes, para o caminho de seus seguidores; contudo, este versículo apresenta a imagem sem desenvolver expressamente toda a sua aplicação. A tradução preserva essa tensão e deixa a interpretação ao contexto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição solene foi preservada, assim como a metáfora agrícola e a concisão do original.
