id: JHN.12.26
reference: John 12:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν ἐμοί ⸂τις διακονῇ⸃ ἐμοὶ ἀκολουθείτω, καὶ ὅπου εἰμὶ ἐγὼ ἐκεῖ καὶ ὁ διάκονος ὁ ἐμὸς ἔσται· ⸀ἐάν τις ἐμοὶ διακονῇ τιμήσει αὐτὸν ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/026.yaml
  text: If anyone serves me[a], let him follow me; and where I am, there my servant will be also. If anyone serves me, the Father will honor him.
translation:
  language: pt
  text: Se alguém me serve[a], siga-me; e, onde eu estou, ali também estará o meu servo. Se alguém me serve, o Pai o honrará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego emprega uma construção genérica no masculino singular: “Se alguém me serve... o Pai o honrará”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονῇ (διακονέω)
  choice: serve
  rationale: Neste contexto, o verbo indica prestar serviço a Jesus. “Serve” é claro, natural e mantém a relação lexical com “servo”, sem a conotação eclesiástica mais estreita de “ministra”.
- source_word: ἀκολουθείτω
  choice: siga-me
  rationale: O imperativo presente expressa o chamado ao discipulado. “Siga-me” preserva de modo idiomático a força imperativa, sem tornar explícita uma nuance aspectual além do necessário.
- source_word: διάκονος
  choice: servo
  rationale: Aqui o termo designa quem serve a Jesus em sentido geral, não o ofício eclesiástico posterior de diácono. “Servo” é claro no contexto e preserva a ligação com o verbo “servir”.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: onde eu estou
  rationale: A presença explícita de ἐγώ dá certa ênfase ao sujeito. Em português, “eu” expresso conserva essa ênfase de maneira natural.
- source_word: ἐκεῖ καὶ
  choice: ali também
  rationale: A formulação preserva tanto a referência locativa de ἐκεῖ quanto o valor aditivo de καί.
- source_word: τιμήσει
  choice: honrará
  rationale: O verbo promete que o Pai concederá honra. “Honrará” é direto e preserva o futuro sem especificar a natureza dessa honra.
- source_word: ὁ πατήρ
  choice: o Pai
  rationale: O grego traz “o Pai”, sem possessivo. A tradução evita acrescentar “meu” e mantém o uso joanino.
- source_word: τις
  choice: alguém
  rationale: O pronome indefinido tem sentido genérico. “Alguém” comunica naturalmente esse alcance amplo em português.
- source_word: αὐτόν
  choice: o
  rationale: O pronome retoma no singular a pessoa indicada por τις. “O” conserva a concordância masculina singular da construção grega, explicada em nota.
theological_decisions:
- issue: Referência masculina genérica nas construções condicionais
  choice: Usar “alguém” para τις e conservar as retomadas masculinas em “o meu servo” e “o honrará”.
  alternative: Empregar formulações inteiramente neutras, como “essa pessoa” e “a honrará”.
  rationale: O grego apresenta um indefinido de sentido genérico com concordância masculina singular. A tradução comunica a abrangência por meio de “alguém” e preserva a forma singular masculina nas retomadas, sem restringir o sentido aos homens.
- issue: Natureza da honra concedida pelo Pai
  choice: Traduzir simplesmente “o Pai o honrará”.
  alternative: Explicitar essa honra como recompensa celestial ou glorificação escatológica.
  rationale: O versículo promete honra divina à pessoa que serve Jesus, mas não define aqui sua forma. A tradução preserva essa abertura teológica.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo do grego foram preservados sem rigidez: “onde eu estou, ali também” mantém a estrutura enfática, e “siga-me” comunica de modo natural o imperativo do discipulado.'
