id: JHN.12.40
reference: John 12:40
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τετύφλωκεν αὐτῶν τοὺς ὀφθαλμοὺς καὶ ⸀ἐπώρωσεν αὐτῶν τὴν καρδίαν, ἵνα μὴ ἴδωσιν τοῖς ὀφθαλμοῖς καὶ νοήσωσιν τῇ καρδίᾳ καὶ ⸀στραφῶσιν, καὶ ⸀ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/040.yaml
  text: He has blinded their eyes and hardened their heart[a], so that they may not see with their eyes and understand with their heart and turn[c][b], and I would heal them.
translation:
  language: pt
  text: Ele cegou os olhos deles e endureceu o coração deles, para que não vejam com os olhos, nem entendam com o coração, nem se voltem[a], e eu os cure[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «se convertam».'
    reason: lexical_alternative
  - marker: b
    text: 'O grego traz uma forma futura, que também pode ser traduzida: «e eu os curarei».'
    reason: lexical_alternative
  - marker: c
    text: Esta passagem retoma Isaías 6:10.
    reason: cross_reference
lexical_decisions:
- source_word: Τετύφλωκεν
  choice: cegou
  rationale: O perfeito grego descreve uma ação realizada cujos efeitos permanecem. Em português, o pretérito perfeito simples é natural neste contexto e não elimina necessariamente o estado resultante.
- source_word: ἐπώρωσεν
  choice: endureceu
  rationale: Preserva de modo natural a ideia de tornar insensível e mantém o sentido profético e judicial da citação de Isaías.
- source_word: καρδίαν / καρδίᾳ
  choice: coração
  rationale: Mantém a antropologia e a imagem bíblicas; o verbo «entendam» comunica o aspecto cognitivo.
- source_word: ἵνα μὴ
  choice: para que não
  rationale: Conserva a força de propósito ou resultado da construção grega sem tentar resolver essa tensão.
- source_word: ἴδωσιν τοῖς ὀφθαλμοῖς
  choice: vejam com os olhos
  rationale: Reproduz a imagem concreta e o paralelismo com «entendam com o coração».
- source_word: νοήσωσιν
  choice: entendam
  rationale: Expressa compreensão mental de maneira atual e idiomática.
- source_word: στραφῶσιν
  choice: se voltem
  rationale: O passivo aoristo pode ter sentido intransitivo. «Se voltem» preserva a amplitude do verbo e evita a formulação eclesiástica mais específica «se convertam».
- source_word: ἰάσομαι
  choice: eu os cure
  rationale: Embora a forma grega seja futura, o presente do subjuntivo em português ajusta-se naturalmente à sequência regida por «para que não» e comunica o sentido contingente sem impor uma leitura estritamente temporal.
- source_word: αὐτῶν τὴν καρδίαν
  choice: o coração deles
  rationale: Mantém o singular coletivo do grego e a sua dimensão corporativa.
theological_decisions:
- issue: Agência divina ao cegar e endurecer
  choice: 'Manter o sujeito divino explícito: «Ele cegou... e endureceu...»'
  alternative: Usar uma construção impessoal ou passiva que atenue a agência divina
  rationale: Os verbos gregos atribuem as ações a um sujeito singular. A tradução conserva a tensão teológica do endurecimento judicial sem suavizá-la.
- issue: Linguagem de conversão em στραφῶσιν
  choice: Traduzir por «se voltem» no texto principal
  alternative: «se convertam»
  rationale: O verbo pode descrever voltar-se ou retornar e não exige, por si só, uma formulação doutrinária mais estreita.
- issue: Valor de ἰάσομαι na construção citada
  choice: «e eu os cure»
  alternative: «e eu os curarei»
  rationale: O subjuntivo é idiomático em português depois da sequência negativa de propósito ou resultado, enquanto a nota registra que a morfologia grega é futura.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conservam-se a repetição de «olhos» e «coração», o singular coletivo «coração» e a agência divina explícita. Os marcadores foram colocados junto às expressões pertinentes; a referência cruzada aparece ao fim do versículo.
