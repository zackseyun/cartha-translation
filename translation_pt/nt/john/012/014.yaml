  text: εὑρὼν δὲ ὁ Ἰησοῦς ὀνάριον ἐκάθισεν ἐπ’ αὐτό, καθώς ἐστιν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/014.yaml
  text: 'Then Jesus[a], having found a young donkey, sat on it, just as it is written:'
translation:
  language: pt
  text: 'Então Jesus encontrou um jumentinho[a] e sentou-se nele, conforme está escrito:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um jumento jovem». O grego ὀνάριον se refere a um jumento, muitas vezes jovem.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν
  choice: encontrou
  rationale: O particípio aoristo indica uma ação anterior à de sentar-se. Em português corrente, a coordenação verbal comunica naturalmente a sequência sem exigir a forma mais pesada «tendo encontrado».
- source_word: δὲ
  choice: Então
  rationale: Aqui δέ funciona como conectivo narrativo leve; «Então» faz a narrativa avançar sem introduzir um contraste indevido.
- source_word: ὀνάριον
  choice: jumentinho
  rationale: O diminutivo grego designa um jumento, frequentemente jovem. «Jumentinho» é natural, claro e preserva a nuance lexical sem determinar com absoluta precisão a idade do animal.
- source_word: ἐκάθισεν ἐπ’ αὐτό
  choice: sentou-se nele
  rationale: Reproduz de modo direto e natural a expressão grega, evitando o mais interpretativo «montou nele».
- source_word: καθώς ἐστιν γεγραμμένον
  choice: conforme está escrito
  rationale: Fórmula idiomática de citação bíblica que preserva tanto a correspondência expressa por καθώς quanto o estado resultante de γεγραμμένον.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Em português, o nome próprio é apresentado naturalmente sem reproduzir o artigo narrativo grego.
theological_decisions:
- issue: Relação entre a ação de Jesus e a citação das Escrituras
  choice: Apresentar a ação como correspondente ao que está escrito, sem declarar explicitamente a motivação de Jesus.
  alternative: Traduzir de forma mais dinâmica, dando a entender que Jesus encenou deliberadamente o cumprimento da profecia.
  rationale: O versículo relata a ação e em seguida introduz a citação bíblica. A correspondência profética está presente, mas a motivação não é explicitada; a tradução preserva essa contenção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Jumentinho» é mais natural no contexto bíblico do que «pequeno jumento», enquanto a nota preserva a alternativa que explicita a possível idade.
