  text: ταῦτα εἶπεν Ἠσαΐας ⸀ὅτι εἶδεν τὴν δόξαν αὐτοῦ, καὶ ἐλάλησεν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/041.yaml
  text: Isaiah said these things because he saw his glory and spoke about him[a].
translation:
  language: pt
  text: Isaías disse essas coisas porque viu a glória dele e falou a respeito dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Isaías disse essas coisas porque viu a glória de Deus e falou a respeito dele». No contexto de João, os pronomes provavelmente se referem a Jesus; no pano de fundo mais amplo de Isaías, porém, trata-se da visão da glória do Senhor (Is 6:1).'
    reason: Leitura alternativa do referente dos pronomes, preservando a relação entre o contexto joanino e o pano de fundo de Isaías.
lexical_decisions:
- source_word: ταῦτα
  choice: essas coisas
  rationale: O demonstrativo neutro plural retoma as declarações proféticas citadas anteriormente; «essas coisas» preserva o plural e soa natural em português.
- source_word: εἶπεν
  choice: disse
  rationale: Tradução direta do aoristo de λέγω, distinguindo-o de ἐλάλησεν na segunda oração.
- source_word: Ἠσαΐας
  choice: Isaías
  rationale: Forma tradicional e amplamente reconhecida do nome do profeta em português.
- source_word: ὅτι
  choice: porque
  rationale: No contexto, introduz de modo mais natural a razão pela qual Isaías disse essas coisas; «que» continua gramaticalmente possível.
- source_word: εἶδεν
  choice: viu
  rationale: Equivalente direto e corrente do aoristo de ὁράω.
- source_word: δόξαν
  choice: glória
  rationale: Preserva o termo teologicamente significativo e recorrente no Evangelho de João.
- source_word: αὐτοῦ
  choice: dele
  rationale: Expressa naturalmente a relação possessiva sem inserir explicitamente «Jesus» ou «Deus», preservando a forma pronominal e sua tensão referencial.
- source_word: ἐλάλησεν
  choice: falou
  rationale: Traduz o aoristo de λαλέω e mantém uma leve distinção em relação a εἶπεν, vertido por «disse».
- source_word: περὶ αὐτοῦ
  choice: a respeito dele
  rationale: Expressa com clareza o sentido de περί com genitivo e mantém o referente pronominal sem explicitação interpretativa.
theological_decisions:
- issue: Referente dos dois pronomes αὐτοῦ
  choice: Manter ambos como «dele», deixando o texto principal apontar pelo contexto para Jesus sem substituir os pronomes por um nome.
  alternative: Explicitar «a glória de Jesus e falou a respeito dele», ou entender os pronomes mais genericamente como referência a Deus/o Senhor.
  rationale: O argumento imediato de João 12:37–41 favorece Jesus como referente, mas o pano de fundo de Isaías 6 é a visão da glória do Senhor. A redação pronominal preserva tanto a orientação cristológica do contexto joanino quanto a tensão intertextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «A respeito dele» evita a possível oralidade excessiva de «sobre ele», enquanto «essas coisas» retoma naturalmente as citações precedentes. O marcador [a] aparece no texto principal.
