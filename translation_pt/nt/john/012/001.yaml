  text: Ὁ οὖν Ἰησοῦς πρὸ ἓξ ἡμερῶν τοῦ πάσχα ἦλθεν εἰς Βηθανίαν, ὅπου ἦν ⸀Λάζαρος, ὃν ἤγειρεν ἐκ νεκρῶν ⸀Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/001.yaml
  text: So Jesus came to Bethany six days before the Passover[a], where Lazarus was, whom Jesus had raised from the dead.
translation:
  language: pt
  text: Assim, seis dias antes da Páscoa, Jesus foi a Betânia, onde estava Lázaro, a quem Jesus havia ressuscitado dentre os mortos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dos mortos».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Assim
  rationale: Preserva a conexão narrativa com o contexto anterior sem tornar a frase excessivamente formal.
- source_word: πρὸ ἓξ ἡμερῶν τοῦ πάσχα
  choice: seis dias antes da Páscoa
  rationale: Expressa de modo natural e exato a relação temporal indicada pelo grego.
- source_word: ἦλθεν εἰς Βηθανίαν
  choice: foi a Betânia
  rationale: Em português, «foi» é natural neste contexto narrativo; «chegou a» também seria possível, mas explicitaria a chegada mais do que o verbo grego exige.
- source_word: ὅπου ἦν Λάζαρος
  choice: onde estava Lázaro
  rationale: Mantém a formulação locativa simples, sem acrescentar que Lázaro morava ou permanecia ali.
- source_word: ἤγειρεν
  choice: havia ressuscitado
  rationale: No contexto de Lázaro morto, «ressuscitado» comunica naturalmente o sentido de levantar da morte; o mais-que-perfeito composto deixa clara a anterioridade da ação.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: Reflete de perto a ideia de saída do meio dos mortos e permanece idiomático em português.
theological_decisions:
- issue: Linguagem de ressurreição aplicada a Lázaro
  choice: a quem Jesus havia ressuscitado dentre os mortos
  alternative: a quem ele havia ressuscitado dos mortos
  rationale: O grego repete explicitamente «Jesus» como sujeito; a tradução conserva essa repetição e não reduz a identificação enfática a um pronome.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para uma abertura temporal natural, sem perda da conexão indicada por οὖν.
