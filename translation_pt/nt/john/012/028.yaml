id: JHN.12.28
reference: John 12:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πάτερ, δόξασόν σου τὸ ὄνομα. ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ· Καὶ ἐδόξασα καὶ πάλιν δοξάσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/028.yaml
  text: 'Father[a], glorify your name. Then a voice came from heaven: “I have glorified it, and I will glorify it again.”'
translation:
  language: pt
  text: 'Pai, glorifica o teu nome. Então veio do céu uma voz: “Eu o glorifiquei e novamente o glorificarei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάτερ
  choice: Pai
  rationale: Vocativo direto dirigido a Deus. “Pai” é natural e fiel; o grego não traz o possessivo “meu”.
- source_word: δόξασόν
  choice: glorifica
  rationale: Preserva o sentido joanino de manifestar a glória divina e corresponde ao imperativo aoristo sem enfraquecê-lo para simples honra.
- source_word: σου τὸ ὄνομα
  choice: o teu nome
  rationale: Expressão bíblica natural que conserva a referência ao caráter e à reputação revelados de Deus, sem paráfrase explicativa.
- source_word: ἦλθεν οὖν
  choice: Então veio
  rationale: Neste contexto, οὖν faz avançar a narrativa; “então” expressa essa progressão com naturalidade em português.
- source_word: φωνὴ ἐκ τοῦ οὐρανοῦ
  choice: do céu uma voz
  rationale: A fala direta subsequente mostra que φωνή significa “voz”, e “do céu” preserva a origem divina indicada pelo contexto.
- source_word: Καὶ ἐδόξασα καὶ πάλιν δοξάσω
  choice: Eu já o glorifiquei e o glorificarei novamente
  rationale: “Já ... glorifiquei” comunica um ato passado consumado com relevância presente. O pronome “o” retoma naturalmente “nome”, e “novamente” traduz πάλιν ligado ao futuro.
theological_decisions:
- issue: Referente do objeto implícito na resposta divina
  choice: Empregar “o” para retomar “o teu nome”
  alternative: 'Deixar o objeto implícito: “Eu já glorifiquei e glorificarei novamente”'
  rationale: O grego omite um objeto facilmente recuperável, mas o português corrente pede sua explicitação. O pronome masculino “o” retoma “nome” sem introduzir interpretação nova.
- issue: Tradução de δοξάζω no contexto teológico de João
  choice: glorificar
  alternative: honrar; manifestar a glória de
  rationale: “Glorificar” conserva a rede terminológica de glória entre o Pai e o Filho em João e evita reduzir o sentido a mera honra.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Adotou-se “teu” por sua naturalidade bíblica e ampla inteligibilidade; manteve-se a concisão e a tensão teológica do original. Nenhuma nota é necessária: a nota inglesa fornecida parece estar com o marcador deslocado, pois trata da forma verbal da resposta, não de πάτερ.'
