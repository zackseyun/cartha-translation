id: JHN.12.25
reference: John 12:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ φιλῶν τὴν ψυχὴν αὐτοῦ ⸀ἀπολλύει αὐτήν, καὶ ὁ μισῶν τὴν ψυχὴν αὐτοῦ ἐν τῷ κόσμῳ τούτῳ εἰς ζωὴν αἰώνιον φυλάξει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/025.yaml
  text: The one who loves his life loses it[b][a], and the one who hates his life in this world will keep it for eternal life.
translation:
  language: pt
  text: Quem ama a sua vida a perde, e quem odeia a sua vida neste mundo a conservará para a vida eterna.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alma” ou “a si mesmo”; o grego ψυχή pode designar a vida, a pessoa ou a alma, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: “Odeia a sua vida” é um paradoxo deliberado sobre rejeitar o apego à própria vida na ordem presente deste mundo; compare Lucas 14:26, onde aparece linguagem semelhante. Não é um incentivo ao ódio de si mesmo.
    reason: cross_reference
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: quem ama
  rationale: O particípio presente substantivado tem sentido genérico; “quem ama” é natural em português e preserva a ação característica.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: a sua vida
  rationale: Neste contexto, ψυχή designa a vida ou o próprio ser enquanto sujeito a perda ou conservação, não necessariamente uma alma imaterial. “Vida” também sustenta o contraste com ζωὴν αἰώνιον.
- source_word: ἀπολλύει
  choice: a perde
  rationale: O presente do indicativo exprime o resultado paradoxal de amar a própria vida; “perde” forma um contraste claro com “conservará”.
- source_word: ὁ μισῶν
  choice: quem odeia
  rationale: Mantém a força deliberada de μισέω e o paralelismo com “quem ama”, sem suavizar no texto principal o paradoxo de Jesus.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: neste mundo
  rationale: Tradução direta e corrente que delimita o âmbito em que a pessoa “odeia” a própria vida e preserva a possível conotação joanina da ordem presente.
- source_word: φυλάξει
  choice: a conservará
  rationale: O futuro indica o resultado; “conservará” comunica guardar ou preservar e contrasta naturalmente com “perde”.
- source_word: εἰς ζωὴν αἰώνιον
  choice: para a vida eterna
  rationale: “Para” preserva a ideia de direção, finalidade ou resultado de εἰς sem decidir além do que a construção exige.
theological_decisions:
- issue: Sentido de “odeia a sua vida”
  choice: Manter a formulação forte como paradoxo sobre renunciar ao apego à própria vida no mundo presente.
  alternative: “Ama menos a sua vida” ou “não se apega à sua vida”.
  rationale: O grego usa μισέω, e a expressão “neste mundo” contextualiza o contraste. Suavizar o verbo no texto resolveria uma tensão retórica que deve ser preservada; a nota impede uma leitura como incentivo ao ódio de si.
- issue: Sentido de ψυχή
  choice: Traduzir como “vida” nas duas ocorrências.
  alternative: “Alma” ou “a si mesmo”.
  rationale: “Vida” se ajusta ao contraste entre perder e conservar e evita impor uma antropologia dualista que o contexto não requer, sem negar a amplitude semântica de ψυχή.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção genérica “quem” evita rigidez e não acrescenta marcação de gênero ausente na expressão portuguesa. Os marcadores seguem as afirmações às quais ambas as notas se referem.
