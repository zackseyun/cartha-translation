id: JHN.12.3
reference: John 12:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ λαβοῦσα λίτραν μύρου νάρδου πιστικῆς πολυτίμου ἤλειψεν τοὺς πόδας τοῦ Ἰησοῦ καὶ ἐξέμαξεν ταῖς θριξὶν αὐτῆς τοὺς πόδας αὐτοῦ· ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/003.yaml
  text: Then Mary took a litra of costly pure nard perfume[a], anointed Jesus's feet, and wiped his feet with her hair[c][b]. And the house was filled with the fragrance of the perfume.
translation:
  language: pt
  text: Então, Maria tomou uma litra de perfume de nardo puro, muito caro[a], ungiu os pés de Jesus e os enxugou com seus cabelos. E a casa ficou cheia da fragrância do perfume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Uma litra era uma unidade romana de peso, equivalente a cerca de 330 gramas. O adjetivo traduzido como «puro» (πιστικῆς) tem sentido discutido; também pode significar «genuíno».
    reason: Esclarece a unidade antiga e preserva uma alternativa lexical relevante para πιστικῆς.
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e a ligação com a cena anterior, de modo natural em português.
- source_word: λαβοῦσα
  choice: pegou
  rationale: O particípio aoristo anterior aos verbos principais é expresso como verbo finito na sequência narrativa, evitando a construção menos natural «tendo pegado».
- source_word: λίτραν
  choice: uma litra
  rationale: Mantém por transliteração a unidade romana antiga e deixa sua equivalência aproximada para a nota.
- source_word: μύρου νάρδου
  choice: perfume de nardo
  rationale: Comunica de forma clara e atual o preparado aromático usado para ungir, preservando a substância específica, o nardo.
- source_word: πιστικῆς
  choice: puro
  rationale: É uma interpretação contextual plausível para o adjetivo de sentido lexical discutido; a alternativa «genuíno» é preservada na nota.
- source_word: πολυτίμου
  choice: muito caro
  rationale: Expressa em linguagem corrente o alto valor do perfume.
- source_word: ἤλειψεν
  choice: ungiu
  rationale: Preserva o ato concreto de aplicar perfume e sua possível ressonância simbólica, sem impor uma interpretação ritual ou doutrinária.
- source_word: ἐξέμαξεν ταῖς θριξὶν αὐτῆς
  choice: os enxugou com os cabelos
  rationale: «Enxugou» traduz naturalmente o ato indicado pelo verbo, e «com os cabelos» reproduz o instrumental sem explicitação desnecessária.
- source_word: ἡ δὲ οἰκία ἐπληρώθη
  choice: A casa se encheu
  rationale: Forma idiomática em português que preserva o sentido passivo/resultativo do original.
- source_word: ὀσμῆς τοῦ μύρου
  choice: fragrância do perfume
  rationale: «Fragrância» comunica o odor agradável e mantém a repetição referencial de μύρον.
theological_decisions:
- issue: Possível sobreinterpretação da linguagem de unção
  choice: «ungiu» em sentido narrativo, sem explicação teológica no corpo do texto
  alternative: «aplicou perfume nos» ou «passou perfume nos»
  rationale: O verbo descreve adequadamente uma unção com perfume e pode carregar ressonância simbólica, mas o versículo não define seu significado teológico; a tradução preserva essa abertura.
- issue: Sentido incerto de πιστικῆς
  choice: «puro» no texto, com «genuíno» em nota
  alternative: «genuíno», «líquido» ou simples transliteração do adjetivo
  rationale: A evidência lexical não permite certeza. «Puro» é inteligível e plausível no contexto de um nardo muito caro, enquanto a nota torna transparente a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das ações e a repetição de «perfume» seguem de perto o grego, enquanto a sintaxe é natural em português. «Nardo» é preferido ao termo tradicional menos corrente «espicanardo».
