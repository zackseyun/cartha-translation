id: JHN.12.48
reference: John 12:48
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ ἀθετῶν ἐμὲ καὶ μὴ λαμβάνων τὰ ῥήματά μου ἔχει τὸν κρίνοντα αὐτόν· ὁ λόγος ὃν ἐλάλησα ἐκεῖνος κρινεῖ αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/048.yaml
  text: 'The one who rejects me and does not receive my words has one who judges him: the word that I spoke will judge him on the last day[a][b].'
translation:
  language: pt
  text: 'Quem me rejeita e não recebe as minhas palavras tem quem o julgue: a palavra que falei o julgará no último dia.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «não aceita as minhas palavras». O verbo grego pode significar receber, acolher ou aceitar.
    reason: lexical_alternative
  - marker: b
    text: Ou «a mensagem que falei». A palavra grega logos pode significar «palavra» ou «mensagem», conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶν
  choice: rejeita
  rationale: Expressa a ideia de repudiar Jesus pessoalmente, com mais força do que «desconsidera» e de modo mais natural do que «põe de lado».
- source_word: μὴ λαμβάνων τὰ ῥήματά μου
  choice: não recebe as minhas palavras
  rationale: Preserva o sentido joanino de receber, acolher ou aceitar a revelação, sem reduzi-lo a mero assentimento intelectual.
- source_word: ῥήματά
  choice: palavras
  rationale: Representa naturalmente as declarações faladas de Jesus e mantém o plural do grego.
- source_word: ἔχει τὸν κρίνοντα αὐτόν
  choice: tem quem o julgue
  rationale: Mantém a construção elíptica e a força do particípio substantivado, preparando a identificação subsequente da palavra como aquilo que julga.
- source_word: ὁ λόγος
  choice: a palavra
  rationale: Conserva o singular e a força enfática, quase personificada, de λόγος; «mensagem» também é possível no contexto.
- source_word: ὃν ἐλάλησα
  choice: que falei
  rationale: Traduz diretamente o aoristo e mantém o foco na palavra proferida por Jesus.
- source_word: ἐκεῖνος
  choice: a palavra ... o julgará
  rationale: A repetição natural do referente em português transmite a retomada enfática do demonstrativo grego sem produzir uma construção obscura.
- source_word: κρινεῖ
  choice: julgará
  rationale: Preserva a amplitude de κρίνω; «condenará» especificaria um resultado que o verbo, por si só, não explicita.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: no último dia
  rationale: É uma formulação portuguesa natural para a expressão escatológica joanina, sem acrescentar um esquema doutrinário.
theological_decisions:
- issue: Natureza do agente de julgamento no versículo
  choice: A palavra proferida por Jesus é apresentada como aquilo que julgará no último dia.
  alternative: Entender a palavra apenas como o padrão de julgamento exercido pessoalmente por Jesus, ou como um juiz personificado.
  rationale: 'A tradução conserva a sequência sintática: quem rejeita Jesus já tem quem o julgue, e esse elemento é identificado como a palavra que Jesus falou. Não harmoniza essa formulação com outras passagens joaninas nem resolve sua tensão teológica.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a imagem judicial do grego foram preservadas sem rigidez excessiva; «tem quem o julgue» mantém deliberadamente a formulação elíptica do original.
