source:
  edition: SBLGNT
  text: καὶ οἶδα ὅτι ἡ ἐντολὴ αὐτοῦ ζωὴ αἰώνιός ἐστιν. ἃ οὖν ⸂ἐγὼ λαλῶ⸃, καθὼς εἴρηκέν μοι ὁ πατήρ, οὕτως λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/050.yaml
  text: And I know that his commandment is eternal life. So what I speak[a], I speak just as the Father has told me.
translation:
  language: pt
  text: E sei que o seu mandamento é vida eterna. Portanto, aquilo que eu falo, falo exatamente como o Pai me disse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολή
  choice: mandamento
  rationale: Preserva o sentido de uma ordem investida de autoridade e corresponde de perto ao termo grego, com registro digno e corrente em português.
- source_word: ζωὴ αἰώνιος
  choice: vida eterna
  rationale: É a expressão joanina consagrada e preserva tanto a duração quanto a qualidade escatológica dessa vida.
- source_word: ἃ
  choice: aquilo que
  rationale: Representa naturalmente o relativo neutro plural como objeto de 'falo', sem a rigidez de 'as coisas que'.
- source_word: λαλῶ
  choice: falo
  rationale: A repetição de 'falo' nas duas ocorrências preserva a repetição enfática de λαλέω no grego.
- source_word: καθώς
  choice: exatamente como
  rationale: Expressa com clareza a correspondência entre o que o Pai disse e o que Jesus fala; 'assim como' também seria possível.
- source_word: εἴρηκέν μοι
  choice: me disse
  rationale: É natural em português e comunica uma declaração anterior do Pai que continua determinando a fala de Jesus, embora não reproduza formalmente o perfeito grego.
- source_word: ὁ πατήρ
  choice: o Pai
  rationale: Mantém o artigo e o título relacional do texto grego, sem acrescentar o possessivo 'meu'.
- source_word: οὖν
  choice: portanto
  rationale: Preserva explicitamente a ligação inferencial com a afirmação anterior, em registro claro e digno.
- source_word: οἶδα
  choice: sei
  rationale: É a correspondência direta, idiomática e solene para οἶδα.
theological_decisions:
- issue: Sentido de 'o seu mandamento é vida eterna'
  choice: 'Manter a construção equativa direta: ''é vida eterna''.'
  alternative: Explicitar que o mandamento conduz à vida eterna ou diz respeito à vida eterna.
  rationale: O grego identifica diretamente o mandamento com a vida eterna. A tradução conserva essa tensão teológica e não restringe a relação a resultado ou assunto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém a solenidade do discurso, a repetição de 'falo' e a concisão do original. Não se acrescentou nota, pois a tradução direta preserva a ambiguidade genuína sem exigir uma alternativa textual.
