id: JHN.12.49
reference: John 12:49
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ἐγὼ ἐξ ἐμαυτοῦ οὐκ ἐλάλησα, ἀλλ’ ὁ πέμψας με πατὴρ αὐτός μοι ἐντολὴν ⸀δέδωκεν τί εἴπω καὶ τί λαλήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/049.yaml
  text: For I have not spoken from myself[b][a], but the Father who sent me has himself given me a command as to what I should say and what I should speak.
translation:
  language: pt
  text: Pois eu não falei por mim mesmo,[a] mas o próprio Pai, que me enviou, me deu uma ordem quanto ao que devo dizer e ao que devo falar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por conta própria” ou “pela minha própria autoridade”.
    reason: lexical_alternative
  - marker: b
    text: O grego emprega dois verbos diferentes, correspondentes a “dizer” e “falar”; a tradução preserva essa distinção.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão ou explicação da afirmação anterior; “Pois” preserva essa ligação discursiva de modo natural.
- source_word: ἐξ ἐμαυτοῦ
  choice: por mim mesmo
  rationale: Mantém a ideia de que Jesus não fala com origem em si mesmo ou de modo independente, sem explicitar além do texto se a ênfase recai sobre iniciativa ou autoridade.
- source_word: οὐκ ἐλάλησα
  choice: não falei
  rationale: O pretérito perfeito traduz naturalmente o aoristo grego como uma declaração sobre a fala de Jesus em seu ministério.
- source_word: ὁ πέμψας με πατήρ
  choice: o Pai, que me enviou
  rationale: Expressa o particípio substantivado em português corrente e conserva “Pai” como título divino no contexto joanino.
- source_word: αὐτός
  choice: o próprio Pai
  rationale: Representa a ênfase do pronome grego, destacando que foi o próprio Pai quem deu a ordem.
- source_word: ἐντολήν
  choice: uma ordem
  rationale: Comunica a força autoritativa do termo em linguagem moderna; “mandamento” poderia sugerir mais especificamente uma norma de um código legal.
- source_word: δέδωκεν
  choice: me deu
  rationale: O pretérito perfeito é a forma idiomática em português para uma ordem dada e ainda vigente; evita a construção pouco natural “tem me dado”, que poderia sugerir repetição.
- source_word: τί εἴπω καὶ τί λαλήσω
  choice: quanto ao que devo dizer e ao que devo falar
  rationale: “Devo” comunica a força diretiva da ordem, enquanto “dizer” e “falar” preservam a variação entre os dois verbos gregos.
theological_decisions:
- issue: Relação entre a fala do Filho e a ordem do Pai
  choice: A redação afirma que Jesus não fala independentemente, mas segundo a ordem do Pai que o enviou.
  alternative: Explicitar que Jesus fala apenas como profeta humano, ou afirmar que age de modo independente embora concorde com o Pai.
  rationale: O versículo trata diretamente da origem e da comissão da fala de Jesus. A tradução conserva essa relação sem acrescentar uma conclusão sobre inferioridade de natureza ou resolver além do texto a relação intradivina.
- issue: Uso de πατήρ
  choice: Pai
  alternative: pai
  rationale: A inicial maiúscula sinaliza o uso contextual como título de Deus, sem alterar o sentido lexical do termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal e a sintaxe evitam formalismo excessivo. A repetição final é intencional para refletir a distinção lexical do grego.
