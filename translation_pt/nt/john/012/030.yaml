  text: ἀπεκρίθη ⸂Ἰησοῦς καὶ εἶπεν⸃· Οὐ δι’ ἐμὲ ⸂ἡ φωνὴ αὕτη⸃ γέγονεν ἀλλὰ δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/030.yaml
  text: Jesus answered and said[a], “This voice has not come for my sake, but for yours.”
translation:
  language: pt
  text: 'Jesus respondeu: “Esta voz não veio para mim, mas para vocês.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Esta voz não veio por minha causa, mas por causa de vocês.” A preposição grega pode também ser entendida em sentido causal, embora neste contexto o sentido de destinação ou benefício pareça mais provável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν
  choice: Jesus respondeu
  rationale: A fórmula narrativa grega combina ‘respondeu’ e ‘disse’. Em português atual, ‘respondeu’ sozinho transmite naturalmente a função discursiva, evitando a expressão redundante e pouco idiomática ‘respondeu e disse’.
- source_word: ἡ φωνὴ αὕτη
  choice: Esta voz
  rationale: No contexto, φωνή designa a voz celestial que acaba de ser ouvida; ‘voz’ é mais preciso que o termo amplo ‘som’.
- source_word: γέγονεν
  choice: veio
  rationale: O perfeito de γίνομαι descreve a ocorrência da voz com relevância presente. Com ‘voz’, ‘veio’ é uma formulação portuguesa natural, embora ‘aconteceu’ seja lexicalmente possível.
- source_word: δι’ ἐμὲ ... δι’ ὑμᾶς
  choice: por minha causa ... por causa de vocês
  rationale: διά com acusativo admite valor causal e também final ou benefactivo. A redação preserva em português uma medida dessa amplitude, enquanto a nota explicita a leitura contextual ‘para o benefício de’.
- source_word: Οὐ ... ἀλλὰ
  choice: não ... mas
  rationale: Mantém diretamente o contraste adversativo do grego.
theological_decisions:
- issue: Finalidade ou causa da voz celestial
  choice: A voz veio em função dos ouvintes, podendo ‘por causa de vocês’ implicar que lhes era destinada ou benéfica.
  alternative: A voz aconteceu causalmente por causa dos ouvintes, em contraste com Jesus.
  rationale: A repetição de διά com acusativo sustenta o paralelismo, mas não exige que a tradução elimine toda a amplitude entre causa e benefício. O contexto favorece que a voz foi dada para os ouvintes, sem desenvolver implicações doutrinárias além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. ‘Vocês’ traduz claramente o plural ὑμᾶς. A fórmula grega ‘respondeu e disse’ foi condensada para o português idiomático. O marcador da nota aparece no texto principal.
