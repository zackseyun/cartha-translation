  text: ἔλαβον τὰ βαΐα τῶν φοινίκων καὶ ἐξῆλθον εἰς ὑπάντησιν αὐτῷ, καὶ ⸀ἐκραύγαζον· Ὡσαννά, εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου, ⸂καὶ ὁ⸃ βασιλεὺς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/013.yaml
  text: They took the palm branches and went out to meet him[a], and they were crying out, “Hosanna! Blessed is the one who comes in the name of the Lord[c][b], even the King of Israel!”
translation:
  language: pt
  text: 'Pegaram os ramos das palmeiras e saíram ao encontro dele. E gritavam: “Hosana![a] Bendito é o que vem em nome do Senhor![b] E o Rei de Israel!”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosana” vem de uma expressão hebraica que significa “salva agora” ou “por favor, salva”; nessa época, também era usada como aclamação de louvor.
    reason: lexical_alternative
  - marker: b
    text: Esta aclamação retoma o Salmo 118:26.
    reason: cross_reference
  - marker: c
    text: 'Ou: “isto é, o Rei de Israel”.'
    reason: alternative_reading
lexical_decisions:
- source_word: βαΐα τῶν φοινίκων
  choice: os ramos das palmeiras
  rationale: Preserva explicitamente tanto os ramos quanto as palmeiras, com formulação natural em português.
- source_word: ἐξῆλθον εἰς ὑπάντησιν αὐτῷ
  choice: saíram ao encontro dele
  rationale: Expressa diretamente o ato de sair para encontrar alguém, sem acrescentar a ideia interpretativa de dar boas-vindas.
- source_word: ἐκραύγαζον
  choice: gritavam
  rationale: O pretérito imperfeito comunica a ação contínua ou repetida indicada pelo imperfeito grego.
- source_word: Ὡσαννά
  choice: Hosana
  rationale: Mantém a aclamação litúrgica tradicional, reconhecível em português, e explica em nota seu sentido hebraico subjacente.
- source_word: εὐλογημένος ὁ ἐρχόμενος
  choice: Bendito o que vem
  rationale: Formulação corrente e digna que preserva o particípio substantivado e a alusão ao Salmo 118:26.
- source_word: ἐν ὀνόματι κυρίου
  choice: em nome do Senhor
  rationale: Mantém a expressão bíblica formal e representa κυρίου como “Senhor”, conforme o texto grego.
- source_word: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ
  choice: E o Rei de Israel
  rationale: Conserva o καί como “E”, sem decidir silenciosamente se é coordenativo ou explicativo, e mantém a força culminante do título real.
theological_decisions:
- issue: Tradução de κύριος na citação ou aclamação baseada no salmo
  choice: Senhor
  alternative: SENHOR
  rationale: O texto grego traz κυρίου. “Senhor” representa diretamente o grego, enquanto “SENHOR” explicitaria o nome divino subjacente ao texto hebraico do salmo.
- issue: Relação sintática de καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ com a aclamação anterior
  choice: E o Rei de Israel
  alternative: isto é, o Rei de Israel
  rationale: O καί pode ser simplesmente coordenativo ou ter força explicativa. A tradução principal preserva a coordenação formal, e a nota registra a alternativa explicativa sem resolver a ambiguidade.
- issue: Força messiânica e real da aclamação
  choice: Rei de Israel
  alternative: rei de Israel
  rationale: Mantém sem atenuação nem expansão o título real atribuído a Jesus no próprio texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A pontuação separa as aclamações e todas as notas estão ancoradas no texto principal.
