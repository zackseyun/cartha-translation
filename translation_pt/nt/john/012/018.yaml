source:
  edition: SBLGNT
  text: διὰ τοῦτο ⸀καὶ ὑπήντησεν αὐτῷ ὁ ὄχλος ὅτι ⸀ἤκουσαν τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/018.yaml
  text: For this reason also the crowd went to meet him[b][a], because they heard that he had done this sign.
translation:
  language: pt
  text: Por isso, a multidão também foi ao encontro dele[a], porque tinha ouvido que ele havia realizado esse sinal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “encontrou-se com ele” ou “saiu ao encontro dele”. O verbo grego inclui a ideia de ir encontrar alguém.'
    reason: lexical_alternative
  - marker: b
    text: “Sinal” é o termo característico de João para um ato milagroso que aponta além de si mesmo para a identidade e a missão de Jesus; alternativamente, “milagre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural e claro a relação causal com o contexto anterior.
- source_word: καὶ
  choice: também
  rationale: Preserva a força aditiva da conjunção sem lhe atribuir ênfase excessiva.
- source_word: ὑπήντησεν αὐτῷ
  choice: foi ao encontro dele
  rationale: Comunica a ideia direcional de sair ou ir para encontrar alguém, sem acrescentar detalhes ausentes do texto.
- source_word: ὁ ὄχλος
  choice: a multidão
  rationale: Equivalente corrente e digno para o grupo reunido designado por ὄχλος.
- source_word: ὅτι
  choice: porque
  rationale: Introduz aqui a razão pela qual a multidão foi ao encontro de Jesus.
- source_word: ἤκουσαν
  choice: tinha ouvido
  rationale: O mais-que-perfeito composto explicita naturalmente em português que a informação recebida antecedeu a ação da multidão.
- source_word: τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον
  choice: que ele havia realizado esse sinal
  rationale: A construção portuguesa preserva o ato concluído e sua relevância, enquanto 'esse sinal' retoma o acontecimento já mencionado no contexto.
theological_decisions:
- issue: Tradução do termo joanino σημεῖον
  choice: sinal
  alternative: milagre
  rationale: Em João, o termo caracteriza uma obra poderosa que aponta para a identidade e a missão de Jesus; 'sinal' mantém essa dimensão reveladora sem reduzi-la apenas ao caráter milagroso.
translation_notes:
  register: Português moderno, claro e digno, de leitura natural no Brasil e amplamente compreensível no mundo lusófono. A ordem dos marcadores foi ajustada para que cada nota apareça junto ao termo que explica.
