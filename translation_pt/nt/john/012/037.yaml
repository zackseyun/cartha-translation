id: JHN.12.37
reference: John 12:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοσαῦτα δὲ αὐτοῦ σημεῖα πεποιηκότος ἔμπροσθεν αὐτῶν οὐκ ἐπίστευον εἰς αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/037.yaml
  text: Although he had done so many signs before them[a], they did not believe in him[b],
translation:
  language: pt
  text: Embora ele tivesse realizado tantos sinais diante deles, eles não criam nele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não acreditaram nele”. O verbo grego está no imperfeito, que pode sugerir incredulidade contínua ou repetida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα
  choice: tantos
  rationale: Expressa de modo natural a grande quantidade enfatizada pelo termo grego.
- source_word: δὲ
  choice: embora
  rationale: O contraste introduzido por δέ é incorporado à construção concessiva, evitando a redundância pouco natural de “mas, embora”.
- source_word: σημεῖα
  choice: sinais
  rationale: Preserva o uso característico de João, no qual as obras apontam para a identidade e a missão de Jesus, sem reduzi-las simplesmente a “milagres”.
- source_word: πεποιηκότος
  choice: tivesse realizado
  rationale: A construção concessiva com o particípio perfeito indica uma ação anterior cujos resultados continuam relevantes; o mais-que-perfeito composto do subjuntivo se ajusta naturalmente a “embora”.
- source_word: ἔμπροσθεν αὐτῶν
  choice: diante deles
  rationale: Mantém a ideia de que os sinais foram realizados publicamente, na presença dessas pessoas.
- source_word: οὐκ ἐπίστευον
  choice: não criam
  rationale: O pretérito imperfeito português reproduz com naturalidade o aspecto contínuo ou reiterado do imperfeito grego, sem acrescentar a ideia explícita de recusa deliberada.
- source_word: εἰς αὐτόν
  choice: nele
  rationale: “Crer nele” é a forma portuguesa idiomática de expressar a construção joanina πιστεύω + εἰς, preservando sua dimensão relacional.
theological_decisions:
- issue: O caráter persistente da incredulidade no imperfeito grego
  choice: eles não criam nele
  alternative: eles não acreditaram nele
  rationale: “Não criam” preserva o aspecto contínuo ou reiterado do imperfeito sem intensificá-lo para “continuavam se recusando a crer”, formulação que acrescentaria uma nuance volitiva não expressa diretamente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A concessão expressa por “embora” comunica o contraste de δέ sem duplicá-lo com um “mas” inicial. O pronome “ele” torna explícito o sujeito da oração subordinada e evita ambiguidade.
