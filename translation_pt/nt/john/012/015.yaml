  text: Μὴ φοβοῦ, θυγάτηρ Σιών· ἰδοὺ ὁ βασιλεύς σου ἔρχεται, καθήμενος ἐπὶ πῶλον ὄνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/015.yaml
  text: Do not be afraid[a], daughter of Zion. Look, your King is coming[e][d][c][b], seated on a donkey’s colt.
translation:
  language: pt
  text: '“Não tenha medo[a], filha de Sião[b]. Veja[c]: o seu rei vem[d], sentado sobre um jumentinho[e].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não tema”.'
    reason: lexical_alternative
  - marker: b
    text: “Filha de Sião” é uma personificação profética de Sião, isto é, Jerusalém.
    reason: cultural_note
  - marker: c
    text: 'Ou: “Eis” ou “Olhe”.'
    reason: lexical_alternative
  - marker: d
