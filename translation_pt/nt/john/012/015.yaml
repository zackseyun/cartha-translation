    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Não tenha medo
  rationale: A proibição com μή e o imperativo de φοβέομαι é expressa de modo natural e atual, sem perder a força de “não tema”.
- source_word: θυγάτηρ Σιών
  choice: filha de Sião
  rationale: Mantém a personificação profética de Sião/Jerusalém e a forma de tratamento do texto grego.
- source_word: ἰδοὺ
  choice: Veja
  rationale: Reproduz em português moderno a função de chamar a atenção, evitando o tom arcaico de “eis”.
- source_word: ὁ βασιλεύς σου
  choice: o seu rei
  rationale: Traduz diretamente o substantivo definido e o possessivo. A minúscula segue o uso ortográfico corrente e evita acrescentar uma distinção ausente dos manuscritos gregos.
- source_word: ἔρχεται
  choice: vem
  rationale: O presente transmite a chegada com vivacidade e soa mais natural em português do que uma construção progressiva.
- source_word: καθήμενος
  choice: sentado
  rationale: Preserva o sentido explícito do particípio; “montado” seria idiomático, mas acrescentaria uma nuance contextual não expressa lexicalmente.
- source_word: ἐπὶ πῶλον ὄνου
  choice: sobre um jumentinho
  rationale: “Jumentinho” comunica de maneira natural que se trata de um jumento novo; a nota registra a estrutura mais literal “filhote de jumenta”.
theological_decisions:
- issue: Alusão messiânica a Zacarias 9:9
  choice: Conservar “filha de Sião” e “o seu rei vem” no texto, explicando a alusão em nota.
  alternative: Explicitar no corpo do versículo que Sião é Jerusalém ou que Jesus é o rei prometido.
  rationale: A tradução mantém a linguagem profética e sua tensão própria, sem inserir no texto uma explicação interpretativa.
- issue: Uso de maiúscula em “rei”
  choice: Usar “rei” com inicial minúscula.
  alternative: Usar “Rei” como título messiânico.
  rationale: O grego não estabelece essa distinção editorial; a minúscula é natural no português contemporâneo e não enfraquece a identificação contextual do rei com Jesus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação destaca a chamada de atenção de ἰδοὺ, e a formulação conserva o tom profético sem arcaísmo desnecessário.
