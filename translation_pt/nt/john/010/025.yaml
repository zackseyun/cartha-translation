  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Εἶπον ὑμῖν καὶ οὐ πιστεύετε· τὰ ἔργα ἃ ἐγὼ ποιῶ ἐν τῷ ὀνόματι τοῦ πατρός μου ταῦτα μαρτυρεῖ περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/025.yaml
  text: Jesus answered them[a], “I told you, and you do not believe[b]. The works that I do in the name of my Father—these testify about me.”
translation:
  language: pt
  text: 'Jesus lhes respondeu: “Eu lhes disse, e vocês não creem. As obras que faço em nome de meu Pai[a] — elas dão testemunho a meu respeito[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pela autoridade de meu Pai”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “testificam acerca de mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: lhes respondeu
  rationale: Forma narrativa natural em português para introduzir a resposta de Jesus, preservando o objeto indireto plural.
- source_word: Εἶπον ὑμῖν
  choice: Eu lhes disse
  rationale: Expressa de modo direto a referência de Jesus ao que já havia dito, sem acrescentar conteúdo não explícito.
- source_word: καὶ οὐ πιστεύετε
  choice: mas vocês não creem
  rationale: Neste contexto, καί tem força contrastiva; “mas” torna essa relação natural e clara. “Creem” mantém a continuidade lexical e teológica de πιστεύω em João.
- source_word: τὰ ἔργα
  choice: As obras
  rationale: “Obras” é o termo joanino tradicional e abrangente para as ações de Jesus, incluindo seus sinais, sem restringir o sentido a milagres.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: em nome de meu Pai
  rationale: Preserva a expressão grega e sua amplitude semântica de representação e autoridade, sem reduzi-la a apenas uma dessas ideias.
- source_word: ταῦτα μαρτυρεῖ περὶ ἐμοῦ
  choice: elas dão testemunho a meu respeito
  rationale: O pronome retomador “elas” reproduz a ênfase de ταῦτα e concorda naturalmente com “obras” em português. “Dão testemunho” conserva a linguagem forense característica do Evangelho de João.
theological_decisions:
- issue: Relação entre as obras de Jesus e o nome do Pai
  choice: em nome de meu Pai
  alternative: pela autoridade de meu Pai
  rationale: A formulação preserva a afirmação de autorização e representação divina sem expandi-la nem limitá-la a uma interpretação teológica mais específica.
- issue: Função das obras de Jesus
  choice: dão testemunho a meu respeito
  alternative: testificam acerca de mim
  rationale: Mantém a função testemunhal das obras na argumentação joanina, em linguagem clara e digna, sem explicitar além do que o texto declara.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Vocês” comunica com clareza o plural de ὑμεῖς; “creem” e “dão testemunho” preservam o vocabulário teológico e forense de João. Os marcadores foram colocados junto às expressões a que suas respectivas notas se referem.
