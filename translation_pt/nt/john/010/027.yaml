source:
  edition: SBLGNT
  text: τὰ πρόβατα τὰ ἐμὰ τῆς φωνῆς μου ⸀ἀκούουσιν, κἀγὼ γινώσκω αὐτά, καὶ ἀκολουθοῦσίν μοι,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/027.yaml
  text: My sheep hear my voice, and I know them, and they follow me.
translation:
  language: pt
  text: As minhas ovelhas ouvem a minha voz, e eu as conheço, e elas me seguem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πρόβατα τὰ ἐμὰ
  choice: As minhas ovelhas
  rationale: “Ovelhas” é o equivalente natural de πρόβατα no contexto da metáfora do pastor. A construção possessiva articulada é expressa com naturalidade por “as minhas ovelhas”, sem acrescentar a ênfase maior de “as ovelhas que são minhas”.
- source_word: τῆς φωνῆς μου
  choice: a minha voz
  rationale: Embora ἀκούω possa reger o genitivo no grego, o português atual pede objeto direto nesta construção. “Voz” preserva a referência pessoal ao pastor, em vez do sentido mais amplo de “som”.
- source_word: ἀκούουσιν
  choice: ouvem
  rationale: O presente descreve uma ação característica e contínua; o presente simples em português comunica isso naturalmente. “Ouvem” mantém o sentido lexical direto sem explicitar a atenção ou obediência que “escutam” poderia sugerir.
- source_word: κἀγὼ
  choice: eu
  rationale: A crase de καί + ἐγώ introduz a oração coordenada e dá leve destaque ao sujeito. O ponto e vírgula seguido de “eu” mantém a progressão natural em português sem tornar repetitivo o encadeamento de três ocorrências de “e”.
- source_word: γινώσκω αὐτά
  choice: eu as conheço
  rationale: “Conheço” preserva tanto o sentido direto quanto a profundidade relacional possível no uso joanino, sem a expansão interpretativa “conheço pessoalmente”. O pronome feminino plural concorda naturalmente com “ovelhas” em português.
- source_word: ἀκολουθοῦσίν μοι
  choice: elas me seguem
  rationale: O presente simples expressa a conduta característica indicada pelo grego. O pronome explícito “elas” torna claro o sujeito depois da oração “eu as conheço” e mantém uma formulação natural.
theological_decisions:
- issue: Força relacional de γινώσκω na metáfora do pastor e das ovelhas
  choice: conheço
  alternative: conheço pessoalmente; reconheço
  rationale: “Conheço” conserva a riqueza relacional do verbo sem definir de maneira mais estreita a natureza desse conhecimento. “Reconheço” seria mais fraco, enquanto “conheço pessoalmente” acrescentaria uma explicação não expressa no texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das três afirmações foi preservada. O ponto e vírgula reduz a repetição pesada de conectivos sem alterar a relação coordenada entre as orações.
