source:
  edition: SBLGNT
  text: διὰ τοῦτό ⸂με ὁ πατὴρ⸃ ἀγαπᾷ ὅτι ἐγὼ τίθημι τὴν ψυχήν μου, ἵνα πάλιν λάβω αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/017.yaml
  text: For this reason the Father loves me[a], because I lay down my life so that I may take it up again.
translation:
  language: pt
  text: Por isso, o Pai me ama, porque eu entrego a minha vida[a] para retomá-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a minha alma”. Aqui, ψυχή significa mais naturalmente “vida”, isto é, a vida que Jesus entrega na morte e retoma.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural e conciso a relação causal com o que segue e com o contexto anterior.
- source_word: με ὁ πατὴρ ἀγαπᾷ
  choice: o Pai me ama
  rationale: Mantém o sujeito definido do grego, «o Pai», sem acrescentar o possessivo «meu».
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão do amor do Pai, preservando o valor causal mais provável no contexto.
- source_word: τίθημι τὴν ψυχήν μου
  choice: entrego a minha vida
  rationale: Em português corrente, «entregar a vida» comunica a ação voluntária de se dar à morte melhor do que o literal e pouco idiomático «depor a vida».
- source_word: τὴν ψυχήν μου
  choice: a minha vida
  rationale: Neste contexto, ψυχή designa a vida que Jesus entrega na morte e retoma; «alma» poderia sugerir uma distinção antropológica que o versículo não enfatiza.
- source_word: ἵνα
  choice: para
  rationale: Preserva de maneira idiomática a finalidade da ação sem decidir além do texto questões sobre a relação exata entre propósito e resultado.
- source_word: πάλιν λάβω αὐτήν
  choice: retomá-la
  rationale: «Retomar» reúne naturalmente em português as ideias de tomar e fazê-lo novamente, referindo-se à vida entregue.
theological_decisions:
- issue: Sentido de ψυχή no contexto da entrega voluntária de Jesus
  choice: vida
  alternative: alma
  rationale: O contexto trata da morte voluntária de Jesus e da retomada de sua vida. A alternativa legítima é registrada em nota, sem introduzir no texto principal uma afirmação sobre a composição do ser humano.
- issue: Força de ἵνα com λάβω
  choice: para retomá-la
  alternative: para que eu possa tomá-la de novo
  rationale: A construção infinitiva portuguesa conserva a finalidade expressa por ἵνα e soa natural, sem transformar a oração em simples previsão futura.
- issue: Relação causal entre o amor do Pai e a entrega da vida
  choice: porque
  alternative: que
  rationale: O uso causal de ὅτι é o mais adequado aqui; a tradução mantém a tensão do enunciado sem explicar teologicamente em que sentido essa ação constitui a razão declarada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Entrego a minha vida» evita o literalismo pouco natural de «deponho a minha vida», enquanto «retomá-la» expressa de modo compacto πάλιν λάβω αὐτήν.
