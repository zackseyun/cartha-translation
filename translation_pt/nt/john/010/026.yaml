  text: ἀλλὰ ὑμεῖς οὐ πιστεύετε, ⸂ὅτι οὐκ⸃ ἐστὲ ἐκ τῶν προβάτων τῶν ⸀ἐμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/026.yaml
  text: But you do not believe[a], because you are not among my sheep.
translation:
  language: pt
  text: Mas vocês não creem[a], porque não são das minhas ovelhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Mas vocês não creem que não são das minhas ovelhas». A conjunção grega também pode introduzir o conteúdo daquilo em que eles não creem, em vez de indicar a causa.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Conjunção adversativa que marca o contraste com a descrição anterior das ovelhas de Jesus; «Mas» é natural e claro em português moderno.
- source_word: ὑμεῖς
  choice: vocês
  rationale: O pronome explícito dá certa ênfase ao grupo interpelado. «Vocês» é amplamente compreensível e adequado ao plural em português de leitura brasileira.
- source_word: οὐ πιστεύετε
  choice: não creem
  rationale: O presente do indicativo negado é expresso naturalmente pelo presente simples. «Crer» preserva o uso joanino e o tom do contexto.
- source_word: ὅτι
  choice: porque
  rationale: A conjunção pode ser causal ou introduzir o conteúdo do que não creem. A leitura causal se ajusta melhor ao fluxo imediato, sem eliminar a alternativa, registrada em nota.
- source_word: οὐκ ἐστὲ
  choice: não são
  rationale: Tradução direta e idiomática da cópula negada no plural.
- source_word: ἐκ τῶν προβάτων
  choice: das ovelhas
  rationale: Aqui ἐκ expressa pertencimento a um grupo. «Ser das minhas ovelhas» comunica essa pertença de modo natural e mantém a imagem do texto.
- source_word: τῶν ἐμῶν
  choice: minhas
  rationale: O possessivo concorda naturalmente com «ovelhas» e preserva a relação de pertença expressa no grego.
theological_decisions:
- issue: Valor de ὅτι na relação entre incredulidade e pertença às ovelhas de Jesus
  choice: 'Leitura causal: «porque não são das minhas ovelhas»'
  alternative: 'Leitura de conteúdo: «Mas vocês não creem que não são das minhas ovelhas»'
  rationale: O contexto imediato contrasta as ovelhas que ouvem e seguem Jesus com os interlocutores que não creem. A leitura causal é provavelmente a mais adequada, mas a construção grega permite a leitura de conteúdo. A nota preserva essa ambiguidade relevante sem resolver debates sobre eleição e incredulidade por meio da tradução.
translation_notes:
  register: Português moderno, digno e acessível, com «vocês» para o plural e «creem» em registro bíblico corrente. A formulação concisa acompanha a estrutura grega, enquanto a nota conserva a ambiguidade interpretativa de ὅτι.
