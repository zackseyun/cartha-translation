  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ⸀ὅτι ἐγώ εἰμι ἡ θύρα τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/007.yaml
  text: So Jesus said to them again[a], “Truly, truly, I say to you, I am the door for the sheep.”
translation:
  language: pt
  text: 'Então Jesus lhes disse novamente[a]: “Em verdade, em verdade lhes digo: eu sou a porta das ovelhas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o portão das ovelhas”. O grego θύρα pode significar “porta” ou “portão”, especialmente na imagem de um redil.'
    reason: Alternativa lexical contextual para θύρα, em continuidade com a nota do registro de auditoria inglês.
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e lógica da explicação anterior de forma natural em português.
- source_word: πάλιν
  choice: novamente
  rationale: Expressa claramente a repetição do ato de falar, sem alterar o tom narrativo.
- source_word: Ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Preserva a repetição solene e enfática característica das declarações de Jesus em João, em formulação transparente e digna.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: É uma tradução próxima e idiomática da fórmula de fala, mantendo seu tom formal.
- source_word: ὅτι
  choice: —
  rationale: A conjunção que introduz o conteúdo da declaração não precisa ser explicitada em português depois dos dois-pontos.
- source_word: ἐγώ εἰμι
  choice: eu sou
  rationale: Mantém o pronome explícito e, assim, a ênfase da autoidentificação no grego.
- source_word: θύρα
  choice: porta
  rationale: É o equivalente lexical direto e funciona naturalmente como entrada de um recinto; “portão” é possível no contexto, mas tornaria a imagem mais específica do que o termo grego exige.
- source_word: τῶν προβάτων
  choice: das ovelhas
  rationale: Preserva a construção genitiva e sua relação metafórica aberta, sem decidir se a porta pertence às ovelhas, está associada a elas ou serve para elas.
theological_decisions:
- issue: Autoidentificação metafórica na declaração “eu sou”
  choice: eu sou a porta das ovelhas
  alternative: eu sou a porta para as ovelhas
  rationale: A tradução conserva a metáfora e a ambiguidade relacional do genitivo, sem ampliar o texto numa explicação doutrinária.
- issue: Sentido contextual de θύρα
  choice: porta
  alternative: portão
  rationale: “Porta” preserva a amplitude lexical do grego. Embora “portão” se ajuste ao cenário pastoril, o versículo não exige essa especificação.
translation_notes:
  register: Português moderno, amplamente compreensível e com cadência bíblica digna. A ordem “lhes disse novamente” é natural, e a repetição “Em verdade, em verdade” preserva a solenidade joanina.
