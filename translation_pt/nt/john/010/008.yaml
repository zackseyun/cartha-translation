  text: πάντες ὅσοι ἦλθον ⸂πρὸ ἐμοῦ⸃ κλέπται εἰσὶν καὶ λῃσταί· ἀλλ’ οὐκ ἤκουσαν αὐτῶν τὰ πρόβατα.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/008.yaml
  text: All who came before me are thieves and robbers[a], but the sheep did not listen to them.
translation:
  language: pt
  text: Todos os que vieram antes de mim[a][b] são ladrões e assaltantes; mas as ovelhas não lhes deram ouvidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à minha frente”. A expressão pode ser entendida em sentido temporal (“antes de mim”) ou como referência aos que se apresentaram antes, reivindicando autoridade à parte de Jesus. O contexto indica falsos pastores, não todos os servos de Deus que viveram anteriormente.'
    reason: alternative_reading
  - marker: b
    text: Alguns manuscritos omitem “antes de mim”.
    reason: textual_variant
lexical_decisions:
- source_word: πάντες ὅσοι
  choice: Todos os que
  rationale: Expressa de modo natural em português o sentido abrangente e distributivo da construção grega.
- source_word: ἦλθον
  choice: vieram
  rationale: O pretérito perfeito traduz adequadamente o aoristo indicativo e mantém a referência passada sem acrescentar uma nuance de resultado presente.
- source_word: πρὸ ἐμοῦ
  choice: antes de mim
  rationale: É a tradução direta e mais natural da possível relação temporal; a possível nuance espacial ou de precedência é preservada em nota.
- source_word: κλέπται
  choice: ladrões
  rationale: Equivalente corrente de κλέπται, apropriado ao contraste entre quem entra ilegitimamente e o verdadeiro pastor.
- source_word: λῃσταί
  choice: assaltantes
  rationale: Distingue o termo de κλέπται e comunica sua frequente conotação mais violenta ou predatória sem recorrer a vocabulário arcaico.
- source_word: ἀλλ’
  choice: mas
  rationale: Conjunção adversativa simples e natural em português.
- source_word: οὐκ ἤκουσαν αὐτῶν
  choice: não lhes deram ouvidos
  rationale: Comunica não apenas a audição física, mas a recusa de atender ou seguir, nuance adequada à imagem das ovelhas que reconhecem a voz do pastor.
- source_word: τὰ πρόβατα
  choice: as ovelhas
  rationale: Tradução usual e clara no discurso joanino sobre o pastor e o rebanho.
theological_decisions:
- issue: Alcance de “todos os que vieram antes de mim”
  choice: Manter no texto a formulação ampla “Todos os que vieram antes de mim”.
  alternative: Explicitar no texto que se trata apenas dos que reivindicaram autoridade de pastor ou messiânica à parte de Jesus.
  rationale: A forma grega é abrangente, mas o contexto aponta para falsos pastores, não para uma condenação de todos os servos de Deus anteriores a Jesus. A tradução preserva a tensão do original, enquanto a nota oferece a cautela contextual sem impor uma delimitação interpretativa ao texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Não lhes deram ouvidos” conserva a ideia de escuta responsiva própria da imagem pastoral; “assaltantes” mantém a distinção lexical em relação a “ladrões”.
