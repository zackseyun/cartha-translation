  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃν ὁ πατὴρ ἡγίασεν καὶ ἀπέστειλεν εἰς τὸν κόσμον ὑμεῖς λέγετε ὅτι Βλασφημεῖς, ὅτι εἶπον· Υἱὸς τοῦ θεοῦ εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/036.yaml
  text: do you say of the one whom the Father sanctified and sent into the world[a], ‘You are blaspheming,’ because I said, ‘I am the Son of God’?”
translation:
  language: pt
  text: 'Vocês dizem, a respeito daquele a quem o Pai santificou[a] e enviou ao mundo: ‘Você está blasfemando’, porque eu disse: ‘Sou o Filho de Deus’?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “consagrou” ou “separou”.
    reason: Alternativas lexicais para ἡγίασεν, cujo sentido inclui santificar, consagrar ou separar para uma finalidade.
lexical_decisions:
- source_word: ἡγίασεν
  choice: santificou
  rationale: Preserva a ligação lexical com santidade e a tensão do texto. No contexto, pode indicar que o Pai consagrou ou separou o Filho para sua missão, sem sugerir aperfeiçoamento moral.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: É a equivalência direta e natural, preservando a linguagem joanina recorrente do envio do Filho.
- source_word: κόσμον
  choice: mundo
  rationale: Equivalente corrente de κόσμος em João, mantendo suas possíveis ressonâncias teológicas sem explicá-las dentro do texto.
- source_word: Βλασφημεῖς
  choice: Você está blasfemando
  rationale: A forma progressiva expressa naturalmente em português a acusação direta introduzida pelo primeiro ὅτι.
- source_word: Υἱὸς τοῦ θεοῦ
  choice: o Filho de Deus
  rationale: Reproduz de modo idiomático a força titular e cristológica da expressão predicativa.
- source_word: ὃν ὁ πατὴρ
  choice: daquele a quem o Pai
  rationale: Construção natural em português que mantém o referente singular e a oração relativa.
- source_word: ὅτι ... ὅτι
  choice: 'dizem ...: ... porque eu disse'
  rationale: O primeiro ὅτι introduz o conteúdo da acusação, representado por dois-pontos; o segundo apresenta a razão dessa acusação, traduzido por “porque”.
theological_decisions:
- issue: Sentido de ἡγίασεν aplicado ao Filho
  choice: santificou
  alternative: consagrou; separou
  rationale: “Santificou” preserva a formulação e a tensão teológica do original. A nota registra os sentidos contextualmente possíveis sem insinuar que o Filho antes fosse moralmente impuro.
- issue: Força cristológica de Υἱὸς τοῦ θεοῦ
  choice: o Filho de Deus
  alternative: Filho de Deus; o Filho que vem de Deus
  rationale: A forma definida é idiomática em português e preserva a força titular no contexto da acusação de blasfêmia, sem acrescentar formulações doutrinárias posteriores.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. Emprega “vocês” para o plural explícito ὑμεῖς e “Você” na citação singular dirigida a Jesus. Mantém “santificou” no texto e esclarece alternativas na nota.
