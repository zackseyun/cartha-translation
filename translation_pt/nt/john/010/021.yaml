id: JHN.10.21
reference: John 10:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἄλλοι ἔλεγον· Ταῦτα τὰ ῥήματα οὐκ ἔστιν δαιμονιζομένου· μὴ δαιμόνιον δύναται τυφλῶν ὀφθαλμοὺς ⸀ἀνοῖξαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/021.yaml
  text: Others were saying[a], “These words are not those of a demon-possessed man. A demon cannot open the eyes of the blind, can it?”
translation:
  language: pt
  text: 'Outros diziam: “Essas palavras não são de alguém possuído por demônio. Por acaso um demônio pode abrir os olhos dos cegos?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι
  choice: Outros
  rationale: Contrasta este grupo com os que falaram antes; a forma simples é natural e suficiente em português.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito grego sugere fala em andamento ou repetida; o imperfeito português preserva bem esse aspecto.
- source_word: Ταῦτα τὰ ῥήματα
  choice: Essas palavras
  rationale: Refere-se às palavras pronunciadas por Jesus; é uma tradução direta, clara e corrente.
- source_word: οὐκ ἔστιν δαιμονιζομένου
  choice: não são de alguém possuído por demônio
  rationale: A construção genitiva indica a pessoa de quem tais palavras procederiam. Esta formulação é natural e evita acrescentar uma especificação masculina não explícita no grego.
- source_word: δαιμόνιον
  choice: um demônio
  rationale: Traduz diretamente o termo grego sem substituí-lo pela expressão mais interpretativa “espírito maligno”.
- source_word: μὴ ... δύναται
  choice: Será que ... pode
  rationale: A pergunta com μή espera resposta negativa. “Será que” comunica essa expectativa de modo natural, sem transformar a pergunta numa afirmação categórica.
- source_word: τυφλῶν ὀφθαλμοὺς
  choice: os olhos dos cegos
  rationale: Preserva a construção concreta e a ligação contextual com a cura do homem que era cego.
- source_word: ἀνοῖξαι
  choice: abrir
  rationale: Mantém a imagem explícita do original, em vez de interpretá-la como “dar visão” ou “restaurar a vista”.
theological_decisions:
- issue: Tradução da linguagem de δαιμονίζομαι / δαιμόνιον
  choice: possuído por demônio / um demônio
  alternative: sob o poder de um demônio / um espírito maligno
  rationale: A opção emprega a formulação portuguesa mais reconhecível neste contexto, mas não desenvolve uma doutrina técnica sobre a natureza ou o grau da ação demoníaca.
- issue: Força da pergunta retórica introduzida por μή
  choice: Será que um demônio pode abrir os olhos dos cegos?
  alternative: Um demônio não pode abrir os olhos dos cegos, pode?
  rationale: A forma escolhida conserva a pergunta e sua expectativa de resposta negativa, com fluidez em português amplamente compreensível.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A pontuação e a formulação preservam o contraste entre os grupos e o caráter retórico da pergunta.
