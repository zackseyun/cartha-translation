  text: Ἐγένετο ⸀τότε τὰ ἐγκαίνια ἐν ⸀τοῖς Ἱεροσολύμοις· ⸀χειμὼν ἦν,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/022.yaml
  text: At that time the Feast of Dedication took place in Jerusalem[a]. It was winter,
translation:
  language: pt
  text: Naquela ocasião, realizou-se em Jerusalém a Festa da Dedicação[a]. Era inverno,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também conhecida como “Hanucá”, festa judaica que comemora a rededicação do templo em Jerusalém.
    reason: Nota cultural que identifica para o leitor moderno a celebração designada pelo termo grego.
lexical_decisions:
- source_word: Ἐγένετο
  choice: celebrava-se
  rationale: Neste contexto, γίνομαι introduz a realização de uma festa. “Celebrava-se” é natural em português e explicita de modo legítimo o caráter festivo de τὰ ἐγκαίνια.
- source_word: τότε
  choice: Naquele tempo
  rationale: Preserva a transição temporal marcada por τότε com formulação narrativa corrente e digna.
- source_word: τὰ ἐγκαίνια
  choice: a Festa da Dedicação
  rationale: Traduz o sentido do termo grego e identifica claramente a celebração para leitores que talvez não conheçam o nome Hanucá.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: em Jerusalém
  rationale: É a expressão locativa direta e idiomática em português moderno.
- source_word: χειμὼν ἦν
  choice: Era inverno
  rationale: Reproduz de forma simples e direta a descrição temporal do grego.
theological_decisions:
- issue: Identificação de τὰ ἐγκαίνια
  choice: Festa da Dedicação no texto principal
  alternative: Hanucá
  rationale: O texto principal traduz o termo grego, preservando transparência sem substituir a expressão original pelo nome comum posterior; a identificação cultural como Hanucá aparece em nota.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A inversão “celebrava-se em Jerusalém” evita uma construção pesada com “aconteceu a festa”, sem alterar o valor eventivo do original.
