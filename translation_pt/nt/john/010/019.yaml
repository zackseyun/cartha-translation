base_translation:
  language: en
  yaml_path: translation/nt/john/010/019.yaml
  text: Because of these words[a], a division arose again among the Jews.
translation:
  language: pt
  text: Por causa dessas palavras, surgiu novamente uma divisão entre os judeus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os judeus da Judeia” ou, em alguns contextos de João, “os líderes judeus”. Aqui, “os judeus” reproduz a expressão grega, mas, no Evangelho de João, ela muitas vezes se refere a um grupo específico no contexto, e não ao povo judeu como um todo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σχίσμα
  choice: uma divisão
  rationale: O substantivo designa uma ruptura ou divisão; neste contexto, refere-se às reações divergentes às palavras de Jesus.
- source_word: πάλιν
  choice: novamente
  rationale: Marca a repetição de uma divisão já ocorrida anteriormente na narrativa.
- source_word: ἐγένετο
  choice: surgiu
  rationale: Expressa que a divisão veio a ocorrer; “surgiu” combina de modo natural com “divisão” em português.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: entre os judeus
  rationale: Reproduz diretamente a expressão grega, deixando em nota a amplitude contextual de Ἰουδαῖοι no Evangelho de João.
- source_word: διὰ τοὺς λόγους τούτους
  choice: Por causa dessas palavras
  rationale: διά com acusativo indica causa, e λόγοι se refere às declarações anteriores de Jesus.
theological_decisions:
- issue: Referente de Ἰουδαῖοι em João
  choice: “os judeus” no texto principal, com nota explicativa
  alternative: “os judeus da Judeia” ou “os líderes judeus”
  rationale: A tradução direta preserva a formulação grega, enquanto a nota evita que a expressão seja entendida como generalização sobre todo o povo judeu e mantém aberta sua referência contextual.
translation_notes:
  register: Português atual, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. A ordem causal inicial acompanha o sentido do grego e dá continuidade ao discurso anterior.
