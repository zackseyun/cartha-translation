  text: ὁ πατήρ μου ⸀ὃ δέδωκέν ⸀μοι ⸂πάντων μεῖζων⸃ ἐστίν, καὶ οὐδεὶς δύναται ἁρπάζειν ἐκ τῆς χειρὸς τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/029.yaml
  text: My Father[a], who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand.
translation:
  language: pt
  text: Meu Pai[a], que me deu as ovelhas, é maior do que todos, e ninguém pode arrancá-las da mão do Pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «Meu Pai, aquilo que ele me deu é maior do que todos». A redação grega aqui é difícil, e alguns entendem que o próprio dom, e não as pessoas dadas, é o sujeito da comparação.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατήρ μου
  choice: Meu Pai
  rationale: Forma idiomática e direta em português, preservando a relação filial de Jesus com Deus sem acréscimo interpretativo.
- source_word: ὃ δέδωκέν μοι
  choice: que as deu a mim
  rationale: O relativo neutro singular ὃ apresenta dificuldade textual e sintática. No contexto, o referente são as ovelhas dos versículos 27–28; por isso, o pronome feminino plural «as» explicita naturalmente esse referente em português. O perfeito δέδωκεν é expresso por «deu», cujo resultado permanente fica claro no contexto.
- source_word: πάντων μεῖζων
  choice: maior do que todos
  rationale: Mantém a amplitude da comparação grega sem restringi-la explicitamente a pessoas ou coisas.
- source_word: οὐδεὶς δύναται
  choice: ninguém pode
  rationale: Expressão natural em português que comunica integralmente a incapacidade indicada por δύναται.
- source_word: ἁρπάζειν
  choice: arrancar
  rationale: Comunica remoção súbita e forçada e mantém a ligação verbal com a imagem protetora da mão.
- source_word: ἐκ τῆς χειρὸς τοῦ πατρός
  choice: da mão do Pai
  rationale: Preserva a metáfora da mão como expressão de posse, proteção e poder; em português, «arrancar da mão» expressa naturalmente a força de ἐκ.
theological_decisions:
- issue: Dificuldade textual e sintática em ὃ δέδωκέν μοι
  choice: 'Entender a oração conforme o referente contextual das ovelhas: «que as deu a mim»'
  alternative: «Meu Pai, aquilo que ele me deu, é maior do que todos» ou «Aquilo que meu Pai me deu é maior do que tudo»
  rationale: A redação grega impressa é sintaticamente difícil, e há variantes manuscritas. O contexto imediato trata das ovelhas dadas pelo Pai ao Filho e da impossibilidade de arrancá-las de sua mão. A tradução principal torna esse referente explícito, enquanto a nota preserva a leitura alternativa genuína.
- issue: Alcance da comparação em πάντων μεῖζων
  choice: «maior do que todos»
  alternative: «maior do que todas as pessoas» ou «maior do que todas as coisas»
  rationale: O grego permite uma comparação ampla. A tradução evita determinar se πάντων se refere exclusivamente a pessoas ou a coisas e preserva a força abrangente da afirmação.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção clara e vocabulário corrente. Os pronomes femininos «as» e «-las» retomam naturalmente «ovelhas» no contexto imediato.
