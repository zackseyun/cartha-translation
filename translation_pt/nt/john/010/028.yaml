source:
  edition: SBLGNT
  text: κἀγὼ ⸂δίδωμι αὐτοῖς ζωὴν αἰώνιον⸃, καὶ οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα, καὶ οὐχ ἁρπάσει τις αὐτὰ ἐκ τῆς χειρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/028.yaml
  text: And I give them eternal life, and they will certainly never perish forever, and no one will snatch them out of my hand.
translation:
  language: pt
  text: E eu lhes dou vida eterna, e elas jamais perecerão; ninguém as arrancará da minha mão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀγώ
  choice: Eu
  rationale: A contração significa literalmente “e eu”; em português, o encadeamento já é sustentado pela sequência do discurso, e iniciar com “Eu” produz uma frase natural sem perda relevante.
- source_word: δίδωμι αὐτοῖς ζωὴν αἰώνιον
  choice: lhes dou vida eterna
  rationale: Reproduz diretamente o presente verbal e a expressão consagrada, mantendo Jesus como agente da dádiva.
- source_word: οὐ μὴ ἀπόλωνται
  choice: jamais perecerão
  rationale: A combinação οὐ μή com o subjuntivo aoristo expressa negação futura enfática; “jamais” comunica essa força em português corrente e digno.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: Preserva explicitamente a expressão temporal do grego, sem absorvê-la apenas em “jamais”.
- source_word: οὐχ ἁρπάσει τις αὐτὰ
  choice: ninguém as arrancará
  rationale: ἁρπάζω indica tomar à força ou arrebatar; “arrancar” é natural no contexto da mão e conserva a ideia de remoção forçada.
- source_word: ἐκ τῆς χειρός μου
  choice: da minha mão
  rationale: Tradução direta da imagem de proteção e posse, sem explicitação interpretativa.
theological_decisions:
- issue: Força e alcance da promessa de não perecer
  choice: “jamais perecerão, para sempre”
  alternative: “nunca perecerão”
  rationale: A formulação mantém tanto a negação enfática οὐ μή quanto εἰς τὸν αἰῶνα. A aparente redundância reflete a intensidade do original sem acrescentar uma sistematização doutrinária.
- issue: Identidade do agente que poderia arrancar as ovelhas
  choice: “ninguém”
  alternative: “ninguém poderá”
  rationale: O pronome indefinido τις sob negação é naturalmente expresso por “ninguém”. Não se acrescenta “poderá”, pois o texto afirma que o ato não ocorrerá, sem usar explicitamente um verbo de capacidade.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Conserva a ênfase cumulativa do grego em “jamais... para sempre”, embora a construção seja deliberadamente mais marcada que a fala cotidiana.
