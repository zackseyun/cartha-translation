review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a dádiva da vida eterna, a negação enfática de perecer e a imagem de ninguém arrebatar as ovelhas da mão de Jesus. Contudo, κἀγώ inclui a conjunção «E», que convém conservar. A sequência «jamais perecerão, para sempre» tenta reproduzir εἰς τὸν αἰῶνα de modo mecânico, mas não é idiomática em português; na construção grega, a expressão reforça a negação enfática e é bem representada por «jamais perecerão».
  naturalness: «Elas» retoma naturalmente as ovelhas do contexto. «Jamais perecerão, para sempre», porém, soa redundante e pouco natural; «jamais perecerão» é claro, solene e preserva a força da promessa.
  terminology: «Vida eterna», «perecerão», «arrancará» e «da minha mão» são escolhas adequadas e de registro bíblico moderno. «Arrancará» preserva bem a noção de tomar à força expressa por ἁρπάσει.
  issues:
  - severity: low
    issue: Omitida a conjunção inicial de κἀγώ.
    rationale: κἀγώ significa «e eu». Embora a omissão não altere substancialmente o sentido, «E eu» conserva o encadeamento do discurso.
  - severity: medium
    issue: «jamais perecerão, para sempre» é uma reprodução não idiomática da fórmula grega.
    rationale: οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα é uma negação enfática de perecer, reforçada por uma expressão idiomática de duração. Em português, «jamais perecerão» comunica essa força sem sugerir a leitura estranha de que elas não perecerão eternamente, mas poderiam perecer de outra forma.
  revised_text: E eu lhes dou vida eterna, e elas jamais perecerão; ninguém as arrancará da minha mão.
