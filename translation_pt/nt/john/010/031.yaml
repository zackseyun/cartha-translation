  text: Ἐβάστασαν ⸀οὖν πάλιν λίθους οἱ Ἰουδαῖοι ἵνα λιθάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/031.yaml
  text: So the Jews picked up stones again to stone him[a].
translation:
  language: pt
  text: Então, os judeus pegaram pedras outra vez para apedrejá-lo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente neste contexto, “os líderes judeus” ou “os judeus da Judeia”. Em João, a expressão “os judeus” muitas vezes se refere a determinados opositores judeus de Jesus, e não ao povo judeu como um todo.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐβάστασαν
  choice: pegaram
  rationale: Embora βαστάζω possa significar “carregar”, com λίθους nesta cena hostil indica tomar as pedras para uso imediato; “pegaram” é natural e preciso em português.
- source_word: οὖν
  choice: Então
  rationale: Marca a ligação inferencial ou narrativa com a declaração anterior de Jesus, sem a formalidade mais forte de “portanto”.
- source_word: πάλιν
  choice: novamente
  rationale: Expressa diretamente a repetição da reação hostil.
- source_word: λίθους
  choice: pedras
  rationale: Equivalente direto de λίθους, sem acrescentar ao substantivo a intenção já expressa pelo verbo seguinte.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Mantém a formulação explícita do grego. Como o uso joanino pode designar um grupo específico de opositores, a possível delimitação é explicada em nota, não inserida no texto.
- source_word: ἵνα λιθάσωσιν
  choice: para apedrejá-lo
  rationale: A construção com ἵνα e subjuntivo expressa finalidade; “para apedrejá-lo” preserva de modo natural tanto o propósito quanto o sentido específico de λιθάζω.
- source_word: αὐτόν
  choice: -lo
  rationale: Pronome objeto que retoma Jesus; a forma enclítica é natural após o infinitivo em português escrito.
theological_decisions:
- issue: Referente e alcance de οἱ Ἰουδαῖοι no Evangelho de João
  choice: “os judeus” no texto principal, com explicação contextual em nota
  alternative: “os líderes judeus” ou “os judeus da Judeia”
  rationale: O grego não especifica “líderes”, por isso o texto principal conserva sua amplitude e ambiguidade. A nota esclarece que, em João, a expressão frequentemente aponta para opositores judeus específicos de Jesus, e não para todo o povo judeu.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Então” mantém a fluidez narrativa; “pegaram novamente pedras” é idiomático sem eliminar a repetição indicada por πάλιν.
