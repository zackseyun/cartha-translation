id: JHN.10.14
reference: John 10:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ποιμὴν ὁ καλός, καὶ γινώσκω τὰ ἐμὰ καὶ ⸂γινώσκουσί με τὰ ἐμά⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/014.yaml
  text: I am the good shepherd[a], and I know my own, and my own know me,
translation:
  language: pt
  text: Eu sou o bom pastor; conheço os que são meus, e os que são meus me conhecem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “minhas ovelhas”. O grego diz literalmente “os meus” nas duas ocorrências.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμήν
  choice: pastor
  rationale: Em português, “pastor” é o termo comum tanto para quem cuida de ovelhas quanto para a metáfora bíblica. Aqui o contexto imediato mantém clara a imagem do rebanho, sem exigir a expressão menos natural “pastor de ovelhas”.
- source_word: καλός
  choice: bom
  rationale: “Bom” preserva de modo natural a excelência moral, a adequação e a nobreza expressas por καλός, além de corresponder à formulação consagrada e compreensível “o bom pastor”.
- source_word: γινώσκω / γινώσκουσί
  choice: conheço / conhecem
  rationale: “Conhecer” conserva a reciprocidade verbal e permite o sentido pessoal e relacional do grego, sem reduzi-lo a simples reconhecimento.
- source_word: τὰ ἐμὰ / τὰ ἐμά
  choice: os que são meus
  rationale: O adjetivo possessivo neutro plural substantivado designa, no contexto, aqueles que pertencem ao pastor. “Os que são meus” é natural em português, preserva a ideia relacional de pertencimento e não insere explicitamente “ovelhas”, palavra ausente neste versículo.
- source_word: ἐγώ εἰμι
  choice: Eu sou
  rationale: Reproduz a autoidentificação enfática e direta do texto grego, mantendo também sua ressonância no conjunto das declarações “Eu sou” em João.
- source_word: καί
  choice: e
  rationale: A conjunção coordena de forma simples as duas orações sobre o conhecimento recíproco; “e” preserva essa estrutura sem acrescentar ênfase.
theological_decisions:
- issue: Expressar a relação recíproca entre Jesus e aqueles que lhe pertencem sem inserir formulações doutrinárias posteriores
  choice: os que são meus
  alternative: minhas ovelhas
  rationale: A escolha conserva o pertencimento pessoal e o conhecimento mútuo presentes no texto, mas evita explicitar “ovelhas” onde o grego emprega apenas um possessivo substantivado. A alternativa é contextualmente válida e aparece em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula evita uma sequência pesada de conjunções, sem alterar a relação entre as orações. A repetição de “os que são meus” preserva o paralelismo e a reciprocidade do original.
