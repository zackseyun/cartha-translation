  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἦλθον πρὸς αὐτὸν καὶ ἔλεγον ὅτι Ἰωάννης μὲν σημεῖον ἐποίησεν οὐδέν, πάντα δὲ ὅσα εἶπεν Ἰωάννης περὶ τούτου ἀληθῆ ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/041.yaml
  text: And many came to him and were saying, “John did no sign, but everything that John said about this man was true.”
translation:
  language: pt
  text: 'E muitos vieram até ele e diziam: “João não realizou sinal algum[a], mas tudo o que João disse a respeito deste homem[b] era verdade.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não fez sinal algum”.
    reason: lexical_alternative
  - marker: b
    text: Ou “dele”. O grego diz literalmente “deste/este”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: muitos
  rationale: O adjetivo plural funciona substantivamente; “muitos” é natural em português e não exige acrescentar “pessoas”.
- source_word: ἦλθον πρὸς αὐτόν
  choice: foram até ele
  rationale: Expressa de modo natural o movimento em direção a Jesus indicado por ἔρχομαι com πρός e acusativo.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito apresenta a fala como contínua ou repetida, aspecto preservado por “diziam”.
- source_word: σημεῖον
  choice: sinal
  rationale: “Sinal” preserva o termo característico do Evangelho de João e sua função de apontar para uma realidade além do próprio ato, sem reduzi-lo simplesmente a “milagre”.
- source_word: ἐποίησεν οὐδέν
  choice: não realizou sinal algum
  rationale: A formulação é idiomática em português e conserva a negação enfática de que João tenha realizado qualquer sinal.
- source_word: πάντα δὲ ὅσα
  choice: mas tudo o que
  rationale: Preserva tanto o contraste introduzido por δέ quanto a abrangência total da expressão grega.
- source_word: περὶ τούτου
  choice: a respeito deste homem
  rationale: Torna explícito que o demonstrativo se refere a Jesus e preserva sua força melhor que o simples pronome “dele”.
- source_word: ἀληθῆ ἦν
  choice: era verdade
  rationale: É a equivalência direta e natural; o sujeito abrangente “tudo o que” pede o singular em português.
theological_decisions:
- issue: Terminologia joanina de σημεῖον
  choice: sinal
  alternative: milagre
  rationale: O Evangelho de João emprega σημεῖον como termo temático para atos que apontam para a identidade e a obra de Jesus. “Sinal” preserva essa dimensão sem impor interpretação doutrinária adicional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A ordem e o aspecto da narrativa foram preservados sem sacrificar a naturalidade.
