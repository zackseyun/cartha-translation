id: JHN.10.5
reference: John 10:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλοτρίῳ δὲ οὐ μὴ ⸀ἀκολουθήσουσιν ἀλλὰ φεύξονται ἀπ’ αὐτοῦ, ὅτι οὐκ οἴδασι τῶν ἀλλοτρίων τὴν φωνήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/005.yaml
  text: But they will certainly not follow a stranger[a]; instead, they will flee from him[b], because they do not know the voice of strangers.
translation:
  language: pt
  text: Mas de modo nenhum seguirão um estranho[a]; pelo contrário, fugirão dele, porque não conhecem a voz dos estranhos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “jamais seguirão um estranho”. O grego emprega uma negação enfática (οὐ μή).'
    reason: lexical_alternative
  - marker: b
    text: “Conhecem a voz” também pode ser entendido como “reconhecem a voz”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: um estranho
  rationale: No contexto da metáfora pastoril, designa alguém que não pertence às ovelhas nem é reconhecido por elas. “Estrangeiro” sugeriria indevidamente nacionalidade, e “outro” seria vago demais.
- source_word: οὐ μὴ ἀκολουθήσουσιν
  choice: de modo nenhum seguirão
  rationale: A combinação οὐ μή com o futuro expressa negação enfática. A formulação preserva essa força em português atual e digno.
- source_word: ἀκολουθήσουσιν
  choice: seguirão
  rationale: É a forma mais direta e natural no contexto de ovelhas que seguem um pastor.
- source_word: φεύξονται ἀπ’ αὐτοῦ
  choice: fugirão dele
  rationale: O verbo φεύγω com ἀπό indica afastamento ou fuga para longe de alguém; “fugirão dele” conserva a intensidade e a concisão.
- source_word: οἴδασι
  choice: conhecem
  rationale: οἶδα pode significar conhecer ou reconhecer. “Conhecem” mantém a formulação mais direta e a dimensão relacional presente no contexto, sem excluir a ideia de reconhecimento.
- source_word: τῶν ἀλλοτρίων
  choice: dos estranhos
  rationale: O genitivo plural amplia a referência para a classe dos que são estranhos às ovelhas, em correspondência formal com o grego.
- source_word: φωνήν
  choice: voz
  rationale: No discurso, φωνή é a voz ou chamado identificável do pastor ou dos estranhos; “voz” preserva tanto o sentido literal quanto o relacional.
- source_word: δὲ ... ἀλλὰ
  choice: Mas ... pelo contrário
  rationale: As partículas marcam um contraste forte entre não seguir e fugir. A construção escolhida reproduz essa oposição com naturalidade.
theological_decisions:
- issue: Força metafórica das imagens das ovelhas e do pastor
  choice: Manter “um estranho” sem identificar explicitamente seu referente
  alternative: Explicitar “falso mestre” ou “líder ilegítimo”
  rationale: O versículo permanece dentro da metáfora e não identifica aqui, de modo expresso, quem o estranho representa. A tradução evita acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e claro. “De modo nenhum” comunica a negação enfática sem arcaísmo; “pelo contrário” torna explícita a oposição já marcada pelas partículas gregas. Todos os marcadores de nota aparecem no texto principal.
