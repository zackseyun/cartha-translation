source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ ⸀Ἰουδαῖοι· Περὶ καλοῦ ἔργου οὐ λιθάζομέν σε ἀλλὰ περὶ βλασφημίας, καὶ ὅτι σὺ ἄνθρωπος ὢν ποιεῖς σεαυτὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/033.yaml
  text: The Jews answered him[a], “We are not stoning you for a good work, but for blasphemy, and because you, being a man, make yourself God.”
translation:
  language: pt
  text: 'Os judeus lhe responderam: “Não estamos apedrejando você por uma boa obra, mas por blasfêmia e porque você, sendo homem, faz de si mesmo Deus.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faz de si mesmo um deus”. No grego, θεόν não tem artigo; contudo, neste contexto de acusação de blasfêmia, o sentido mais provável é “Deus”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰουδαῖοι
  choice: os judeus
  rationale: É a tradução mais direta e preserva a dicção característica de João. Neste contexto, refere-se ao grupo hostil que confronta Jesus no templo, sem restringir explicitamente o termo aos líderes nem ampliá-lo a todo o povo judeu.
- source_word: Περὶ καλοῦ ἔργου
  choice: por uma boa obra
  rationale: Expressa naturalmente em português a causa indicada por περί com genitivo, preservando o singular ἔργου e a qualidade moral de καλοῦ.
- source_word: λιθάζομέν
  choice: vamos apedrejá-lo
  rationale: No contexto imediato, o presente indica a ação pretendida ou iminente do grupo. Esta formulação é mais natural em português do que “estamos apedrejando”, pois as pedras haviam sido levantadas, mas o apedrejamento ainda não se consumara.
- source_word: βλασφημίας
  choice: blasfêmia
  rationale: É o termo português corrente e preciso para a acusação de desonrar ou afrontar Deus.
- source_word: ἄνθρωπος ὢν
  choice: sendo homem
  rationale: Segue de perto a construção participial grega e mantém o contraste formulado pelos acusadores entre a condição humana de Jesus e sua alegada pretensão.
- source_word: ποιεῖς σεαυτὸν θεόν
  choice: faz de si mesmo Deus
  rationale: Reproduz a construção com objeto reflexivo e predicativo. “Deus” comunica melhor a força da acusação de blasfêmia no contexto, enquanto a possibilidade gramatical “um deus” é registrada em nota.
theological_decisions:
- issue: Tradução de θεόν, sem artigo, em ποιεῖς σεαυτὸν θεόν
  choice: Deus
  alternative: um deus
  rationale: Embora θεόν sem artigo admita, isoladamente, a tradução “um deus”, a acusação de blasfêmia e o contexto monoteísta joanino indicam que os acusadores entendem Jesus como atribuindo a si uma condição pertencente a Deus. A alternativa gramatical é preservada em nota para não ocultar a ambiguidade formal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Você” comunica naturalmente o singular de σύ; “apedrejá-lo” mantém clareza e registro bíblico corrente. A referência potencialmente variável de Ἰουδαῖοι foi mantida sem paráfrase interpretativa.
