id: JHN.10.9
reference: John 10:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ θύρα· δι’ ἐμοῦ ἐάν τις εἰσέλθῃ σωθήσεται καὶ εἰσελεύσεται καὶ ἐξελεύσεται καὶ νομὴν εὑρήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/009.yaml
  text: I am the door. If anyone enters through me[a], he will be saved, and will go in and go out and find pasture.
translation:
  language: pt
  text: Eu sou a porta.[a] Se alguém entrar por mim, será salvo; entrará, sairá e encontrará pastagem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “portão”. A palavra grega pode designar uma porta ou um portão; “porta” foi mantida no texto como a correspondência lexical mais direta.
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: porta
  rationale: “Porta” é o equivalente lexical mais direto e preserva a formulação metafórica de Jesus. No contexto pastoril, “portão” também é possível e consta em nota.
- source_word: δι’ ἐμοῦ
  choice: por mim
  rationale: διά com o genitivo expressa aqui o meio pelo qual se entra; “por mim” é natural em português e mantém Jesus como o meio de entrada.
- source_word: ἐάν τις εἰσέλθῃ
  choice: Se alguém entrar
  rationale: A construção ἐάν com o subjuntivo apresenta uma condição geral, e “se alguém entrar” conserva o alcance indefinido e aberto de τις.
- source_word: σωθήσεται
  choice: será salvo
  rationale: Preserva tanto o sentido soteriológico proeminente em João quanto a ressonância de proteção presente na imagem pastoril, sem restringir o termo a mero resgate físico.
- source_word: εἰσελεύσεται καὶ ἐξελεύσεται
  choice: entrará, sairá
  rationale: Reproduz com concisão o movimento paralelo do grego e evita acrescentar uma interpretação específica de liberdade ou segurança.
- source_word: νομὴν
  choice: pastagem
  rationale: No contexto das ovelhas, “pastagem” comunica com clareza o lugar ou alimento de pastoreio e soa natural em português moderno.
- source_word: εὑρήσει
  choice: encontrará
  rationale: É a correspondência direta e natural para εὑρίσκω no futuro.
theological_decisions:
- issue: Metáfora de θύρα no contexto pastoril
  choice: porta
  alternative: portão
  rationale: “Porta” mantém a equivalência lexical direta e a conhecida metáfora joanina; “portão” explicita melhor o cenário do redil, mas é deixado em nota para não resolver silenciosamente a nuance contextual.
- issue: Amplitude de σωθήσεται
  choice: será salvo
  alternative: será resgatado ou estará a salvo
  rationale: “Será salvo” conserva a amplitude teológica do verbo em João e, ao mesmo tempo, permite que permaneça sua relação com a imagem de proteção do rebanho, sem impor uma formulação sistemática mais estreita.
- issue: Sujeito genérico após τις
  choice: construções verbais sem pronome de gênero
  alternative: ele será salvo
  rationale: O português permite preservar naturalmente o singular indefinido de “alguém” sem introduzir um pronome masculino que o grego não exige de modo semântico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação preserva a sequência enfática das promessas, e a omissão de pronomes pessoais evita gênero desnecessário sem alterar o singular do original.
