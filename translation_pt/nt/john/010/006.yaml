  text: ταύτην τὴν παροιμίαν εἶπεν αὐτοῖς ὁ Ἰησοῦς· ἐκεῖνοι δὲ οὐκ ἔγνωσαν τίνα ⸀ἦν ἃ ἐλάλει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/006.yaml
  text: Jesus spoke this figure of speech to them[a], but they did not understand what he was saying to them.
translation:
  language: pt
  text: Jesus lhes falou por meio desta figura de linguagem[a], mas eles não entenderam o que ele lhes dizia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parábola”, “ilustração” ou “provérbio”. A palavra grega pode referir-se, de modo amplo, a um enunciado figurado; aqui, introduz o discurso de Jesus sobre o pastor em forma não literal.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαν
  choice: linguagem figurada
  rationale: O termo pode designar uma declaração figurada, provérbio ou ilustração velada. Neste contexto, refere-se ao discurso do pastor apresentado de modo não literal; “linguagem figurada” preserva essa amplitude sem classificá-lo de forma excessivamente específica como parábola ou provérbio.
- source_word: εἶπεν
  choice: disse
  rationale: O verbo λέγω significa normalmente “dizer”. Em português, “disse esta linguagem figurada” mantém de modo claro e conciso o ato de Jesus dirigir essas palavras aos ouvintes.
- source_word: ἐκεῖνοι δὲ
  choice: mas eles
  rationale: O pronome estabelece contraste com Jesus, e δέ tem aqui valor adversativo. “Mas eles” é natural em português e preserva o contraste.
- source_word: οὐκ ἔγνωσαν
  choice: não entenderam
  rationale: No contexto, γινώσκω descreve a incapacidade de compreender o sentido do discurso figurado, não mera falta de informação; por isso, “não entenderam” expressa adequadamente o sentido.
- source_word: τίνα ἦν ἃ ἐλάλει αὐτοῖς
  choice: o que ele lhes dizia
  rationale: A construção grega é incomum e, de forma mais literal, pergunta quais eram as coisas que ele lhes falava. A tradução comunica naturalmente a incapacidade deles de captar o conteúdo ou sentido, sem acrescentar explicitamente “queria dizer”.
- source_word: αὐτοῖς
  choice: lhes
  rationale: O dativo indica os destinatários da fala. O pronome “lhes” é idiomático e sua repetição acompanha a estrutura do grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a repetição dos destinatários presente no grego e evita resolver de modo excessivamente específico a amplitude de παροιμία.
