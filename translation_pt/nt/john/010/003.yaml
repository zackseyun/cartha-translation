id: JHN.10.3
reference: John 10:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τούτῳ ὁ θυρωρὸς ἀνοίγει, καὶ τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει καὶ τὰ ἴδια πρόβατα ⸀φωνεῖ κατ’ ὄνομα καὶ ἐξάγει αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/003.yaml
  text: To him the gatekeeper opens[a], and the sheep hear his voice, and he calls his own sheep by name and leads them out.
translation:
  language: pt
  text: Para ele o porteiro abre, e as ovelhas ouvem a sua voz. Ele chama pelo nome as suas próprias ovelhas e as conduz para fora.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as traz para fora”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: Para ele
  rationale: O dativo retoma a figura do pastor no versículo anterior. “Para ele” é natural em português e mantém a referência pessoal sem explicitação interpretativa.
- source_word: ὁ θυρωρός
  choice: o porteiro
  rationale: Designa quem guarda e abre a entrada. “Porteiro” é corrente e adequado ao contexto do aprisco.
- source_word: ἀνοίγει
  choice: abre
  rationale: Reproduz diretamente o presente do indicativo e deixa o objeto implícito, como no grego.
- source_word: τὰ πρόβατα
  choice: as ovelhas
  rationale: Equivalente comum e claro no contexto da metáfora pastoril.
- source_word: τῆς φωνῆς αὐτοῦ ἀκούει
  choice: ouvem a sua voz
  rationale: Embora o verbo grego esteja no singular, seu sujeito neutro plural tem sentido plural; o português exige “ouvem”. A formulação preserva tanto a audição quanto o reconhecimento sugerido pelo contexto.
- source_word: τὰ ἴδια πρόβατα
  choice: as suas próprias ovelhas
  rationale: “Próprias” conserva a ênfase de ἴδια na pertença e na relação particular com o pastor.
- source_word: φωνεῖ κατ’ ὄνομα
  choice: chama pelo nome
  rationale: Expressão portuguesa natural que comunica que o pastor chama cada ovelha individualmente.
- source_word: ἐξάγει αὐτά
  choice: as conduz para fora
  rationale: ἐξάγω admite “levar”, “trazer” ou “conduzir para fora”. “Conduz” combina com a ação do pastor e evita a possível ambiguidade regional de “leva” quanto ao ponto de vista.
theological_decisions:
- issue: Identidade da figura do pastor
  choice: Manter as ações atribuídas à figura metafórica sem nomeá-la explicitamente como Jesus neste versículo.
  alternative: Inserir “Jesus” ou explicitar uma interpretação cristológica.
  rationale: O contexto orienta a interpretação, mas o texto grego deste versículo mantém a imagem do pastor; a tradução não deve resolver no próprio enunciado aquilo que a metáfora desenvolve no discurso.
- issue: Agência em ἐξάγει
  choice: “as conduz para fora”
  alternative: “as traz para fora” ou “as leva para fora”
  rationale: A escolha preserva a agência pessoal e orientadora do pastor sem acrescentar uma direção de perspectiva não especificada pelo verbo grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em duas frases melhora a fluidez sem alterar as relações coordenadas do grego. O pronome possessivo em “a sua voz” e “as suas próprias ovelhas” permanece claro porque o antecedente imediato é a figura do pastor.
