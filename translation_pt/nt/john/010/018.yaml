id: JHN.10.18
reference: John 10:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐδεὶς ⸀αἴρει αὐτὴν ἀπ’ ἐμοῦ, ἀλλ’ ἐγὼ τίθημι αὐτὴν ἀπ’ ἐμαυτοῦ. ἐξουσίαν ἔχω θεῖναι αὐτήν, καὶ ἐξουσίαν ἔχω πάλιν λαβεῖν αὐτήν· ταύτην τὴν ἐντολὴν ἔλαβον παρὰ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/018.yaml
  text: No one takes it from me[a], but I lay it down of myself. I have authority to lay it down, and I have authority to take it up again[c][b]. This command I received from my Father.
translation:
  language: pt
  text: Ninguém a tira de mim; pelo contrário, eu a entrego por minha própria vontade.[a] Tenho autoridade[b] para entregá-la e autoridade para retomá-la.[c] Esta ordem recebi de meu Pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “por mim mesmo” ou “por iniciativa própria”. A expressão ressalta que Jesus entrega sua vida voluntariamente, sem implicar que aja independentemente do Pai.
    reason: lexical_alternative
  - marker: b
    text: Ou “poder” ou “direito”. O termo grego pode abranger tanto a capacidade de agir quanto a legítima autorização para fazê-lo.
    reason: lexical_alternative
  - marker: c
    text: Isto é, retomar a sua vida; compare “minha vida” no versículo 17. O verbo também pode ser traduzido como “recebê-la de volta” ou “tomá-la outra vez”.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: αἴρει
  choice: tira
  rationale: No contexto, o verbo indica tirar de Jesus a sua vida. “Tira” é natural em português e mantém o contraste com a entrega voluntária que vem em seguida.
- source_word: τίθημι αὐτήν / θεῖναι αὐτήν
  choice: eu a entrego / para entregá-la
  rationale: Embora τίθημι tenha o sentido básico de “pôr”, neste contexto a expressão se refere a entregar voluntariamente a própria vida. “Entregar” comunica isso com naturalidade, sem explicitar além do texto o referente do pronome.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: por minha própria vontade
  rationale: A expressão enfatiza que Jesus age voluntariamente e por iniciativa própria. A formulação não deve sugerir independência em relação ao Pai, pois a última frase menciona a ordem recebida dele.
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: O termo pode abranger poder, direito e autorização. “Autoridade” preserva tanto a agência de Jesus quanto a relação ordenada com a vontade do Pai.
- source_word: πάλιν λαβεῖν αὐτήν
  choice: para retomá-la
  rationale: “Retomá-la” expressa de modo conciso a ação de tomar outra vez aquilo que foi entregue e preserva πάλιν, sem substituir o pronome pelo seu referente contextual.
- source_word: ἐντολήν
  choice: ordem
  rationale: “Ordem” transmite diretamente a força de ἐντολή em linguagem portuguesa atual e se ajusta à construção “recebi de meu Pai”.
- source_word: παρὰ τοῦ πατρός μου
  choice: de meu Pai
  rationale: Com o genitivo, παρά indica aqui a fonte da ordem. “De meu Pai” preserva a linguagem pessoal e relacional do original.
theological_decisions:
- issue: O sentido de ἐξουσία em relação à morte e à retomada da vida por Jesus
  choice: autoridade
  alternative: poder; direito
  rationale: “Autoridade” mantém unidas a capacidade e a legitimidade da ação de Jesus, sem reduzi-la a mero poder nem apagar sua relação com a ordem do Pai.
- issue: A força de ἀπ’ ἐμαυτοῦ
  choice: por minha própria vontade
  alternative: por mim mesmo; por iniciativa própria
  rationale: A tradução ressalta a entrega voluntária de Jesus, mas evita afirmar que ele aja independentemente do Pai. Assim se preserva a tensão interna do versículo entre iniciativa pessoal e obediência filial.
- issue: O referente de αὐτήν
  choice: a
  alternative: minha vida
  rationale: O pronome retoma “minha vida” no contexto imediato, especialmente no versículo 17. Mantê-lo como pronome preserva a coesão e a forma do grego; a nota esclarece o referente.
- issue: O valor de λαβεῖν na retomada da vida
  choice: retomá-la
  alternative: recebê-la de volta; tomá-la outra vez
  rationale: O verbo pode ser entendido como tomar ou receber. “Retomar” conserva a agência expressa pela construção sem decidir de modo excessivo entre esses matizes.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pelo contrário” torna explícito o forte contraste de ἀλλά. A repetição de “autoridade” reproduz a ênfase do original. Os pronomes femininos preservam a referência contextual à vida sem acrescentá-la ao corpo do versículo.
