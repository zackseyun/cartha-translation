  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἄλλα πρόβατα ἔχω ἃ οὐκ ἔστιν ἐκ τῆς αὐλῆς ταύτης· κἀκεῖνα ⸂δεῖ με⸃ ἀγαγεῖν, καὶ τῆς φωνῆς μου ἀκούσουσιν, καὶ ⸀γενήσονται μία ποίμνη, εἷς ποιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/016.yaml
  text: And I have other sheep that are not from this sheepfold[a]. I must bring them also, and they will listen to my voice. Then there will be one flock[b], one shepherd.
translation:
  language: pt
  text: Ainda tenho outras ovelhas que não são deste aprisco. Devo trazê-las também; elas ouvirão a minha voz, e haverá um só rebanho[a] e um só pastor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego distingue “aprisco” (αὐλή), o recinto das ovelhas, de “rebanho” (ποίμνη), o conjunto de ovelhas. Por isso, a frase final é “um só rebanho”, e não “um só aprisco”.
    reason: lexical_distinction
lexical_decisions:
- source_word: ἄλλα πρόβατα
  choice: outras ovelhas
  rationale: πρόβατα é o termo comum para ovelhas, sem indicar especificamente cordeiros; ἄλλα aponta para outras além das já mencionadas.
- source_word: αὐλή
  choice: aprisco
  rationale: No contexto pastoril, designa o recinto cercado onde as ovelhas ficam; “aprisco” é natural em português e mantém a imagem.
- source_word: κἀκεῖνα
  choice: também ... -las
  rationale: Retoma “outras ovelhas”; a colocação em “Também preciso trazê-las” expressa com naturalidade o valor inclusivo de κἀκεῖνα.
- source_word: δεῖ με ἀγαγεῖν
  choice: preciso trazê-las
  rationale: δεῖ exprime necessidade, e ἀγαγεῖν, neste contexto, é trazer ou conduzir. “Preciso trazê-las” preserva a necessidade em português corrente sem explicar sua causa teológica.
- source_word: τῆς φωνῆς μου ἀκούσουσιν
  choice: elas ouvirão a minha voz
  rationale: ἀκούω admite tanto percepção auditiva quanto escuta receptiva. “Ouvirão a minha voz” preserva essa amplitude sem inserir explicitamente a ideia de obediência.
- source_word: γενήσονται μία ποίμνη
  choice: haverá um só rebanho
  rationale: Expressa de modo idiomático o estado futuro resultante e traduz ποίμνη como o grupo de ovelhas, não como o recinto.
- source_word: εἷς ποιμήν
  choice: um só pastor
  rationale: Mantém literalmente a figura pastoril e usa “só” para tornar clara a unidade expressa por εἷς.
theological_decisions:
- issue: Distinção entre αὐλή e ποίμνη
  choice: deste aprisco ... um só rebanho
  alternative: deste aprisco ... um só aprisco
  rationale: 'O grego emprega substantivos diferentes: αὐλή é o recinto, enquanto ποίμνη é o conjunto de ovelhas. A tradução preserva essa distinção e não transforma a unidade do rebanho em identidade de recinto institucional.'
- issue: Força de δεῖ
  choice: preciso trazê-las
  alternative: devo trazê-las
  rationale: “Preciso” comunica necessidade real em português contemporâneo, sem especificar se ela decorre de obrigação, plano divino ou outra causa não explicitada no versículo.
- issue: Sentido de ἀκούω
  choice: ouvirão a minha voz
  alternative: escutarão a minha voz
  rationale: “Ouvir” conserva a ambiguidade legítima entre ouvir e acolher atentamente, enquanto o contexto pode fornecer a nuance de resposta sem que ela seja imposta na tradução.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Aprisco”, “rebanho” e “pastor” preservam a metáfora e a distinção lexical do original. O marcador [a] aparece no texto e corresponde à única nota.
