id: JHN.10.11
reference: John 10:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ ποιμὴν ὁ καλός· ὁ ποιμὴν ὁ καλὸς τὴν ψυχὴν αὐτοῦ τίθησιν ὑπὲρ τῶν προβάτων·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/011.yaml
  text: I am the good shepherd[c][b][a]. The good shepherd lays down his life for the sheep.
translation:
  language: pt
  text: Eu sou o bom pastor.[a] O bom pastor dá a sua vida[b] pelas ovelhas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pastor nobre”; o grego καλός pode indicar aquilo que é bom, nobre ou exemplar.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “põe a sua alma”; a expressão grega significa “dá a sua vida”.
    reason: lexical_alternative
  - marker: c
    text: Ou “em favor das ovelhas”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Eu sou
  rationale: Expressão copulativa direta e natural em português. O pronome explícito preserva a ênfase do grego sem recorrer a uma expansão como “eu mesmo sou”.
- source_word: ποιμήν
  choice: pastor
  rationale: Equivalente tradicional e contextualmente adequado para quem cuida de ovelhas. Aqui, a imagem concreta do pastoreio controla o sentido, sem exigir associações eclesiásticas posteriores.
- source_word: καλός
  choice: bom
  rationale: “Bom” é natural, consagrado e abrange a excelência moral e exemplar do termo, embora καλός também possa ter a nuance de “nobre”.
- source_word: τὴν ψυχὴν αὐτοῦ τίθησιν
  choice: dá a sua vida
  rationale: A expressão grega significa entregar a própria vida. “Dá a sua vida” comunica com naturalidade o sentido sacrificial em português, enquanto uma versão literal com “alma” seria enganosa.
- source_word: ὑπὲρ
  choice: por
  rationale: Na contração “pelas”, preserva de modo conciso a força benefativa ou representativa da preposição sem impor uma teoria específica da expiação.
- source_word: τῶν προβάτων
  choice: as ovelhas
  rationale: Mantém o artigo do grego e não acrescenta o possessivo “suas”, ausente no texto-fonte.
theological_decisions:
- issue: Força da autoidentificação Ἐγώ εἰμι
  choice: “Eu sou” sem expansão explicativa
  alternative: “Eu mesmo sou” ou uma formulação que explicite alusão ao nome divino
  rationale: A frase funciona aqui como autoidentificação predicativa. Possíveis ressonâncias joaninas permanecem abertas, sem serem elevadas a uma afirmação explícita pela tradução.
- issue: Sentido de καλός no título do pastor
  choice: “bom pastor”
  alternative: “pastor nobre” ou “pastor exemplar”
  rationale: “Bom pastor” é preciso, natural e reconhecível, ao mesmo tempo que a nota preserva a nuance possível de nobreza ou exemplaridade.
- issue: Sentido de ὑπὲρ τῶν προβάτων em relação à morte de Jesus
  choice: “pelas ovelhas”
  alternative: “em favor das ovelhas” ou “em benefício das ovelhas”
  rationale: A formulação mantém a amplitude representativa e benefativa de ὑπέρ sem restringi-la a uma teoria denominacional específica da expiação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a imagem tradicional do “bom pastor”, evita linguagem técnica e mantém nas notas as nuances lexicais genuínas.
