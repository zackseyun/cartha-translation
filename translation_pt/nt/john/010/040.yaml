source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν πάλιν πέραν τοῦ Ἰορδάνου εἰς τὸν τόπον ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων, καὶ ἔμεινεν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/040.yaml
  text: And he went away again across the Jordan to the place where John had first been baptizing[a], and he stayed there.
translation:
  language: pt
  text: E foi novamente para o outro lado do Jordão, ao lugar onde João batizava anteriormente, e ficou ali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: foi
  rationale: O aoristo de ἀπέρχομαι indica que Jesus saiu do local em que estava; no contexto, «foi» expressa essa partida com naturalidade, sem exigir o mais marcado «retirou-se».
- source_word: πάλιν
  choice: novamente
  rationale: Preserva de modo direto a ideia de repetição do movimento.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: para o outro lado do Jordão
  rationale: A expressão com genitivo indica a região além ou do outro lado do rio; esta formulação é clara e natural em português e, com o verbo de movimento, explicita adequadamente o destino.
- source_word: εἰς τὸν τόπον
  choice: ao lugar
  rationale: εἰς marca movimento em direção ao destino; «ao lugar» é idiomático e conciso.
- source_word: ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων
  choice: onde João batizava no início
  rationale: A construção perifrástica ἦν ... βαπτίζων apresenta a atividade contínua de João no período inicial; o imperfeito português mantém essa duração sem impor um mais-que-perfeito ausente da forma grega.
- source_word: ἔμεινεν
  choice: ficou
  rationale: O aoristo de μένω significa permanecer ou ficar; «ficou» é corrente, claro e apropriado ao contexto.
- source_word: ἐκεῖ
  choice: ali
  rationale: Equivalente locativo natural, retomando o lugar que acaba de ser mencionado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha de perto o grego sem soar artificial. Não se acrescentou nota para πέραν τοῦ Ἰορδάνου, pois «para o outro lado do Jordão» comunica a relação espacial sem perda relevante nem ambiguidade que exija alternativa editorial.
