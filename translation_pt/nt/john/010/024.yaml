base_translation:
  language: en
  yaml_path: translation/nt/john/010/024.yaml
  text: So the Jews surrounded him and were saying to him[a], “How long will you keep us in suspense? If you are the Messiah[b], tell us plainly.”
translation:
  language: pt
  text: 'Então os judeus[b] o cercaram e lhe perguntavam: “Até quando você nos manterá em suspense?[a] Se você é o Messias, diga-nos claramente.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Até quando você manterá nossa alma suspensa?” Trata-se de uma expressão idiomática com o sentido de manter alguém na incerteza ou em suspense.'
    reason: lexical_alternative
  - marker: b
    text: Em João, “os judeus” pode, conforme o contexto, referir-se mais especificamente às autoridades judaicas ou aos opositores de Jesus, e não ao povo judeu como um todo.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκύκλωσαν
  choice: cercaram
  rationale: Preserva o sentido concreto de rodear ou circundar e, no contexto, a força potencialmente confrontadora da ação.
- source_word: οὖν
  choice: Então
  rationale: Marca de modo natural a progressão narrativa ou a consequência em português.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Mantém a formulação explícita do grego sem restringir interpretativamente o referente a líderes; uma nota esclarece o possível sentido contextual mais específico.
- source_word: ἔλεγον αὐτῷ
  choice: lhe perguntavam
  rationale: O imperfeito sugere ação em curso ou repetida; como a fala que segue é interrogativa e imperativa, “perguntavam” comunica naturalmente sua função no contexto.
- source_word: Ἕως πότε
  choice: Até quando
  rationale: Equivalente idiomático direto e natural da expressão temporal grega.
- source_word: τὴν ψυχὴν ἡμῶν αἴρεις
  choice: você nos manterá em suspense
  rationale: Expressa em português corrente o sentido idiomático de manter alguém na incerteza, enquanto a nota preserva a imagem mais literal.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Χριστός funciona aqui como título judaico do esperado ungido, e não como designação semelhante a nome próprio.
- source_word: εἰπὲ ἡμῖν
  choice: diga-nos
  rationale: Reproduz de forma concisa e direta a força do imperativo aoristo.
- source_word: παρρησίᾳ
  choice: claramente
  rationale: Neste contexto, indica fala franca, aberta e sem ambiguidade; “claramente” transmite bem a exigência dos interlocutores.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: O termo é empregado como título messiânico judaico na pergunta sobre a identidade de Jesus; “Messias” torna essa função transparente.
- issue: Referente de οἱ Ἰουδαῖοι em João
  choice: os judeus
  alternative: os líderes judeus / os judeanos
  rationale: O versículo não restringe expressamente o grupo. A tradução mantém a ambiguidade do texto, e a nota adverte que, no uso joanino, o referente pode ser contextual e mais limitado.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento por “você” torna a fala direta natural sem perder respeito; “diga-nos” conserva um tom mais elevado. As notas mantêm tanto a imagem idiomática do original quanto a ambiguidade contextual de “os judeus”.
