id: JHN.10.39
reference: John 10:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν ⸂πάλιν αὐτὸν⸃ πιάσαι· καὶ ἐξῆλθεν ἐκ τῆς χειρὸς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/039.yaml
  text: So they were seeking again to seize him[a], but he escaped from their hand.
translation:
  language: pt
  text: Por isso, tentavam novamente agarrá-lo, mas ele escapou das mãos deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da mão deles”; expressão idiomática que pode significar “do poder deles” ou “do alcance deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: tentavam
  rationale: O imperfeito indica uma ação contínua ou uma tentativa no passado; em português, “tentavam” comunica com naturalidade que o propósito não se concretizou.
- source_word: οὖν
  choice: Por isso
  rationale: Marca a consequência do confronto anterior e mantém clara a ligação discursiva.
- source_word: πάλιν
  choice: novamente
  rationale: Expressa de modo direto a repetição da tentativa de capturar Jesus.
- source_word: πιάσαι
  choice: agarrá-lo
  rationale: Preserva o sentido físico e hostil de πιάζω sem acrescentar necessariamente a formalidade jurídica de “prendê-lo”.
- source_word: ἐξῆλθεν
  choice: escapou
  rationale: Embora o verbo signifique literalmente “saiu”, neste contexto a expressão completa indica que Jesus saiu do poder ou alcance deles; “escapou” comunica naturalmente esse resultado em português.
- source_word: ἐκ τῆς χειρὸς αὐτῶν
  choice: das mãos deles
  rationale: O grego usa o singular idiomático “da mão deles” no sentido de poder, domínio ou alcance. O plural é a forma idiomática mais natural em português e conserva a imagem corporal.
theological_decisions:
- issue: Se a saída de Jesus do poder dos adversários deve ser explicitada como fuga
  choice: “escapou das mãos deles”
  alternative: “saiu da mão deles”
  rationale: A alternativa reproduz mais literalmente as palavras gregas, mas soa pouco natural e pode obscurecer o sentido idiomático em português. “Escapou das mãos deles” expressa o resultado narrado sem explicar como isso ocorreu nem atribuir uma intervenção não declarada no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o aspecto durativo da tentativa e preserva na nota a forma singular do idioma grego.
