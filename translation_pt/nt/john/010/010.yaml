id: JHN.10.10
reference: John 10:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ κλέπτης οὐκ ἔρχεται εἰ μὴ ἵνα κλέψῃ καὶ θύσῃ καὶ ἀπολέσῃ· ἐγὼ ἦλθον ἵνα ζωὴν ἔχωσιν καὶ περισσὸν ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/010.yaml
  text: The thief comes only to steal and slaughter and destroy[a]; I came so that they may have life[b], and have it abundantly.
translation:
  language: pt
  text: O ladrão vem somente para roubar, matar e destruir[a]; eu vim para que tenham vida e a tenham em abundância[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abater”, para “matar” (θύσῃ). O verbo grego muitas vezes se refere ao abate de animais, sentido que combina com a imagem das ovelhas neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “tenham vida em abundância” ou “a tenham em plenitude”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ κλέπτης
  choice: o ladrão
  rationale: O artigo favorece o singular definido e representativo no discurso sobre o pastor e as ovelhas.
- source_word: οὐκ ἔρχεται εἰ μὴ
  choice: vem somente
  rationale: Expressa de modo natural a exclusividade de propósito do idioma grego.
- source_word: ἵνα κλέψῃ
  choice: para roubar
  rationale: O infinitivo português comunica de forma concisa a finalidade da vinda.
- source_word: θύσῃ
  choice: matar
  rationale: É português corrente e claro; no contexto das ovelhas, o verbo grego pode ter o sentido mais específico de abater, preservado em nota.
- source_word: ἀπολέσῃ
  choice: destruir
  rationale: Conserva a ideia abrangente de devastação sem especificar indevidamente objeto ou modo.
- source_word: ἐγὼ ἦλθον
  choice: eu vim
  rationale: Reproduz naturalmente o aoristo e mantém o contraste enfático com o ladrão.
- source_word: ἵνα ζωὴν ἔχωσιν
  choice: para que tenham vida
  rationale: Mantém a oração de finalidade e o termo joanino 'vida' sem acrescentar 'eterna', ausente neste versículo.
- source_word: περισσὸν ἔχωσιν
  choice: a tenham em abundância
  rationale: Retoma claramente 'vida' e comunica sua medida ou plenitude em português natural.
theological_decisions:
- issue: Alcance de ζωὴ no uso joanino
  choice: vida
  alternative: vida eterna; vida verdadeira
  rationale: O grego não traz aqui o adjetivo 'eterna'. A forma simples preserva a profundidade teológica e a possível ressonância joanina sem explicitá-la além do texto.
- issue: Força de περισσὸν
  choice: em abundância
  alternative: em plenitude; plenamente
  rationale: Exprime a riqueza e plenitude da vida dada por Jesus, sem transformar a frase em promessa específica de prosperidade material.
- issue: Sentido contextual de θύσῃ
  choice: matar no texto, com 'abater' em nota
  alternative: abater; sacrificar
  rationale: '''Matar'' é amplamente compreensível, enquanto a nota preserva o matiz de abate de animais adequado à imagem das ovelhas, sem sugerir necessariamente um sacrifício cultual.'
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem e o paralelismo do grego são preservados sem rigidez; evita-se vocabulário denominacional e expansão interpretativa.
