  source_fidelity: O texto preserva adequadamente o contraste entre o ladrão e Jesus, a construção exclusiva οὐκ ἔρχεται εἰ μὴ, a tríade κλέψῃ/θύσῃ/ἀπολέσῃ e as duas orações finais de propósito. “Vida” mantém o alcance não especificado de ζωή, e “em abundância” expressa naturalmente o valor adverbial de περισσόν sem acrescentar uma interpretação materialista.
  naturalness: A redação é moderna, clara e idiomática em português de ampla compreensão, inclusive no Brasil. “O ladrão vem somente para roubar, matar e destruir” tem paralelismo eficaz; “para que tenham vida e a tenham em abundância” retoma “vida” com clareza e soa natural.
