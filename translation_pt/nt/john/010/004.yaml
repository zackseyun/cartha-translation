  source_fidelity: 'O texto reproduz adequadamente a sequência e as relações do grego: a saída de todos os que pertencem ao pastor, sua posição à frente delas, o seguimento das ovelhas e a razão baseada no conhecimento de sua voz. A nota registra de modo apropriado a gama de ἐκβάλῃ.'
  naturalness: «Quando faz sair» é compreensível, mas, com o valor temporal indefinido de ὅταν seguido de subjuntivo e a anterioridade da ação em relação a «vai», «Quando tiver feito sair» é mais idiomático e preciso em português. «Todos os seus» tende a evocar pessoas ou um grupo masculino; «todas as suas», com «ovelhas» recuperável no contexto imediato, preserva melhor a elipse do original.
  terminology: «Ovelhas», «seguem», «voz» e «vai adiante» são termos claros, dignos e adequados à imagem pastoral. A alternativa «expulsa» na nota deve permanecer qualificada como possibilidade lexical, sem ser imposta no texto principal.
