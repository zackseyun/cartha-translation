  text: ⸀ὅταν τὰ ἴδια ⸀πάντα ἐκβάλῃ, ἔμπροσθεν αὐτῶν πορεύεται, καὶ τὰ πρόβατα αὐτῷ ἀκολουθεῖ, ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/004.yaml
  text: When he has brought out all his own[a], he goes before them, and the sheep follow him, because they know his voice.
translation:
  language: pt
  text: Quando tiver feito sair todas as suas[a], vai adiante delas, e as ovelhas o seguem, porque conhecem a sua voz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «expulsa» ou «conduz para fora»; o verbo grego pode transmitir a ideia de impelir ou fazer sair de um recinto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Quando
  rationale: Introduz uma oração temporal indefinida com o subjuntivo; «quando» é natural em português e preserva o sentido geral da cena.
- source_word: τὰ ἴδια πάντα
  choice: todos os seus
  rationale: Preserva a expressão substantivada do grego e seu referente contextual, as ovelhas pertencentes ao pastor, sem antecipar o substantivo explícito da oração seguinte.
- source_word: ἐκβάλῃ
  choice: faz sair
  rationale: Conserva tanto o movimento para fora do aprisco quanto o possível matiz causativo do verbo, sem sugerir necessariamente expulsão hostil.
- source_word: ἔμπροσθεν αὐτῶν πορεύεται
  choice: vai adiante deles
  rationale: Expressa de modo natural a posição e o movimento do pastor à frente do rebanho.
- source_word: τὰ πρόβατα αὐτῷ ἀκολουθεῖ
  choice: as ovelhas o seguem
  rationale: Emprega a construção idiomática portuguesa com objeto direto e mantém claramente a imagem pastoral.
- source_word: ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ
  choice: porque conhecem a sua voz
  rationale: «Porque» introduz claramente a causa; «conhecem» preserva o valor lexical de οἴδασιν e permite a nuance contextual de reconhecimento.
theological_decisions:
- issue: Imagem pastoral e força de ἐκβάλῃ
  choice: faz sair
  alternative: expulsa; conduz para fora
  rationale: No contexto, o pastor retira do aprisco as ovelhas que lhe pertencem. «Faz sair» mantém a ação concreta e o matiz causativo sem importar coerção teológica; a nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Vai adiante deles» mantém a imagem espacial; «todos os seus» conserva a concisão e a leve abertura referencial do original.
