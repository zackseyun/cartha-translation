source:
  edition: SBLGNT
  text: εἰ δὲ ποιῶ, κἂν ἐμοὶ μὴ πιστεύητε τοῖς ἔργοις ⸀πιστεύετε, ἵνα γνῶτε καὶ ⸀γινώσκητε ὅτι ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν ⸂τῷ πατρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/038.yaml
  text: But if I do them[a], even if you do not believe me, believe the works, so that you may know and continue to know that the Father is in me[c][b], and I am in the Father.
translation:
  language: pt
  text: Mas, se as faço, mesmo que vocês não creiam em mim[a], creiam nas obras, para que venham a saber e continuem sabendo[b] que o Pai está em mim, e eu estou no Pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não acreditem em mim”. O grego usa “crer” com um pronome no dativo, o que pode significar dar crédito a Jesus, crer nele ou confiar nele; neste contexto, contrasta com “creiam nas obras”.'
    reason: lexical_alternative
  - marker: b
    text: As duas formas verbais gregas podem indicar a progressão entre chegar a saber e continuar reconhecendo essa verdade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῶ
  choice: as faço
  rationale: O presente remete às obras mencionadas no contexto imediato; o pronome feminino plural explicita em português o objeto implícito no grego.
- source_word: κἂν ἐμοὶ μὴ πιστεύητε
  choice: mesmo que vocês não acreditem no que digo
  rationale: πιστεύω com o dativo ἐμοί pode significar acreditar em Jesus ou dar crédito ao que ele diz. A formulação escolhida torna natural em português o contraste com dar crédito às obras, sem ocultar a alternativa, registrada em nota.
- source_word: τοῖς ἔργοις πιστεύετε
  choice: acreditem nas obras
  rationale: 'Conserva a construção compacta e a personificação implícita do grego: as obras dão testemunho das afirmações de Jesus. Evita transformar explicitamente as obras no objeto de fé religiosa.'
- source_word: ἔργοις
  choice: obras
  rationale: Mantém a terminologia característica de João para os atos reveladores de Jesus; “sinais” seria uma interpretação além do termo ἔργα.
- source_word: ἵνα γνῶτε καὶ γινώσκητε
  choice: para que venham a saber e continuem sabendo
  rationale: 'Expressa de modo inteligível a provável progressão entre o aoristo subjuntivo γνῶτε e o presente subjuntivo γινώσκητε: chegar ao conhecimento e permanecer nele.'
- source_word: ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν τῷ πατρί
  choice: o Pai está em mim, e eu estou no Pai
  rationale: Preserva a preposição repetida e a linguagem joanina de mútua imanência, sem substituí-la por explicação doutrinária.
- source_word: πατήρ
  choice: o Pai
  rationale: Reproduz o substantivo grego com artigo, sem acrescentar o possessivo “meu”.
theological_decisions:
- issue: Mútua imanência do Pai e do Filho
  choice: o Pai está em mim, e eu estou no Pai
  alternative: o Pai está unido a mim, e eu estou unido ao Pai
  rationale: A tradução direta conserva a força e a tensão teológica da afirmação joanina sem inserir terminologia explicativa ou credal posterior.
- issue: Objeto de πιστεύω em relação a Jesus
  choice: acreditar no que Jesus diz, com a alternativa em nota
  alternative: crer em Jesus
  rationale: O dativo grego admite as duas leituras. No contexto, a referência ao testemunho das obras favorece a ideia de dar crédito às palavras de Jesus, mas a possível leitura relacional não deve ser eliminada.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para tornar explícito o sujeito plural. “Obras” preserva o vocabulário joanino. A repetição em “venham a saber e continuem sabendo” é deliberada para representar a distinção aspectual do grego.
