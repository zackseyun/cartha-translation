reference: John 10:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ ⸀μισθωτὸς καὶ οὐκ ὢν ποιμήν, οὗ οὐκ ⸀ἔστιν τὰ πρόβατα ἴδια, θεωρεῖ τὸν λύκον ἐρχόμενον καὶ ἀφίησιν τὰ πρόβατα καὶ φεύγει— καὶ ὁ λύκος ἁρπάζει αὐτὰ καὶ ⸀σκορπίζει—
base_translation:
  language: en
  yaml_path: translation/nt/john/010/012.yaml
  text: The hired hand[a], who is not a shepherd and whose sheep are not his own, sees the wolf coming and leaves the sheep and flees—and the wolf snatches them and scatters them.
translation:
  language: pt
  text: O assalariado[a], que não é pastor e a quem as ovelhas não pertencem, vê o lobo se aproximando, abandona as ovelhas e foge — e o lobo as arrebata e dispersa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “trabalhador contratado”. O termo designa alguém que trabalha por salário.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθωτός
  choice: assalariado
  rationale: Designa alguém que trabalha por salário. “Assalariado” é atual e preserva o contraste com o pastor, sem o tom arcaico ou pejorativo de “mercenário”.
- source_word: οὐκ ὢν ποιμήν
  choice: que não é pastor
  rationale: A construção participial é expressa como oração relativa natural em português, mantendo a afirmação de que ele não é pastor.
- source_word: οὗ οὐκ ἔστιν τὰ πρόβατα ἴδια
  choice: a quem as ovelhas não pertencem
  rationale: Comunica diretamente a ausência de posse e de vínculo próprio, evitando uma formulação pouco natural como “cujas ovelhas não são suas”.
- source_word: θεωρεῖ
  choice: vê
  rationale: No contexto, indica a percepção clara do perigo; “vê” é simples, natural e não acrescenta nuance indevida.
- source_word: τὸν λύκον ἐρχόμενον
  choice: o lobo se aproximando
  rationale: Preserva o movimento expresso pelo particípio e soa mais natural em português do que “o lobo vindo”.
- source_word: ἀφίησιν
  choice: abandona
  rationale: No contexto de perigo, o verbo tem a força de deixar as ovelhas desamparadas; “abandona” explicita legitimamente essa nuance contextual.
- source_word: φεύγει
  choice: foge
  rationale: Equivalente conciso, atual e vívido para a retirada diante do perigo.
- source_word: ἁρπάζει
  choice: arrebata
  rationale: Expressa a ação violenta e repentina do lobo, preservando a intensidade do verbo grego.
- source_word: σκορπίζει
  choice: dispersa
  rationale: Traduz a separação das ovelhas causada pelo ataque. O pronome “as” retoma naturalmente “as ovelhas”.
- source_word: πρόβατα
  choice: ovelhas
  rationale: Mantém o substantivo plural concreto e a continuidade da imagem pastoril.
theological_decisions:
- issue: Força metafórica da imagem pastoril
  choice: Manter “pastor”, “assalariado”, “ovelhas” e “lobo” como termos concretos da metáfora.
  alternative: Substituí-los por termos interpretativos como “líder”, “cuidador”, “pessoas” ou “inimigo”.
  rationale: João 10 desenvolve uma metáfora pastoril contínua. Explicá-la dentro do versículo reduziria sua força e importaria uma interpretação não expressa no grego.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e boa legibilidade brasileira. A ordem das ações e a vivacidade da cena foram preservadas; o travessão marca a consequência dramática sem alterar o sentido.
