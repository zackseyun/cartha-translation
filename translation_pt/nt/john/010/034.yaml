  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἔστιν γεγραμμένον ἐν τῷ νόμῳ ὑμῶν ⸀ὅτι Ἐγὼ εἶπα· Θεοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/034.yaml
  text: Jesus answered them[a], “Is it not written in your Law, ‘I said, you are gods’?”
translation:
  language: pt
  text: 'Jesus lhes respondeu: “Não está escrito na Lei de vocês: ‘Eu disse: vocês são deuses’?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seres divinos”. Jesus cita o Salmo 82:6, em que a interpretação do termo é debatida; o texto principal preserva a formulação direta da citação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: lhes respondeu
  rationale: Expressa de forma natural em português o verbo narrativo de resposta e seu objeto dativo.
- source_word: Οὐκ ἔστιν γεγραμμένον
  choice: Não está escrito
  rationale: Preserva a pergunta retórica e o valor presente da fórmula usada para introduzir uma citação das Escrituras.
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: na Lei de vocês
  rationale: “Lei” designa aqui as Escrituras reconhecidas pelos interlocutores, incluindo o Salmo 82; a inicial maiúscula sinaliza esse uso, e “de vocês” comunica naturalmente o pronome plural.
- source_word: Ἐγὼ εἶπα
  choice: Eu disse
  rationale: Traduz diretamente o pronome explícito e o verbo da citação, sem acrescentar ênfase interpretativa.
- source_word: Θεοί ἐστε
  choice: vocês são deuses
  rationale: Mantém o substantivo plural e a cópula da citação de modo direto, sem inserir “chamados” nem resolver sua interpretação.
theological_decisions:
- issue: Sentido de θεοί na citação de Salmo 82:6
  choice: deuses
  alternative: seres divinos
  rationale: “Deuses” é o equivalente lexical direto e preserva a força retórica e a tensão interpretativa da citação. A alternativa é registrada em nota, sem substituir o texto nem impor uma identificação específica dos referentes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “Lei de vocês” preserva a referência contextual sem recorrer a formulação excessivamente literal; a citação mantém deliberadamente a ambiguidade de “deuses”.
