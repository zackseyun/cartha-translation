  text: ⸀ὅτι μισθωτός ἐστιν καὶ οὐ μέλει αὐτῷ περὶ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/013.yaml
  text: because he is a hired hand and does not care about the sheep.
translation:
  language: pt
  text: porque é assalariado e não se importa com as ovelhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: porque
  rationale: Introduz a causa da fuga descrita no contexto anterior; “porque” exprime com naturalidade essa relação causal em português moderno.
- source_word: μισθωτός
  choice: empregado
  rationale: Designa alguém que trabalha por salário, em contraste com o pastor a quem pertencem as ovelhas. “Empregado” é corrente e claro, sem o tom arcaico ou pejorativo de “mercenário”.
- source_word: οὐ μέλει αὐτῷ περὶ
  choice: não se importa com
  rationale: A construção impessoal com dativo e περί expressa falta de cuidado ou preocupação; esta formulação é idiomática e preserva a força moral da afirmação.
- source_word: τῶν προβάτων
  choice: as ovelhas
  rationale: Mantém diretamente o substantivo grego e a imagem pastoril central do discurso, sem generalizá-lo como “rebanho”.
theological_decisions:
- issue: Caracterização do μισθωτός em contraste com o bom pastor
  choice: Apresentar de modo direto que ele é empregado e não se importa com as ovelhas, sem identificar alegoricamente uma classe específica de líderes.
  alternative: Traduzir μισθωτός como “mercenário”, atribuindo-lhe já no substantivo uma condenação moral mais explícita, ou identificá-lo com falsos líderes.
  rationale: O próprio texto fundamenta sua conduta no fato de trabalhar por salário e declara sua falta de cuidado. A tradução conserva esse contraste ético sem acrescentar uma identidade doutrinária não explicitada no versículo.
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. A frase começa em minúscula porque continua sintaticamente a declaração do versículo anterior. “Empregado” é preferível a “mercenário” por representar o sentido ocupacional de μισθωτός sem antecipar no substantivo toda a avaliação dada pela oração seguinte.
