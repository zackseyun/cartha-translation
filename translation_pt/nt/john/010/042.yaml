lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conjunção coordenativa simples que liga o versículo à narrativa anterior sem acrescentar uma relação mais específica.
- source_word: πολλοὶ
  choice: muitos
  rationale: O adjetivo masculino plural é usado de modo substantivado e se refere a muitas pessoas; “muitos” é natural e conciso em português.
- source_word: ἐπίστευσαν
  choice: creram
  rationale: O aoristo ativo indicativo de πιστεύω é traduzido diretamente, sem impor ao aspecto verbal uma nuance ingressiva como “passaram a crer”.
- source_word: εἰς αὐτόν
  choice: nele
  rationale: Com πιστεύω, a expressão indica fé ou confiança dirigida a Jesus; “crer nele” é a formulação portuguesa idiomática e preserva sua força pessoal.
- source_word: ἐκεῖ
  choice: ali
  rationale: O advérbio locativo retoma o lugar mencionado no contexto. “Ali” soa natural na narrativa e mantém a ênfase espacial.
theological_decisions:
- issue: Tradução de πιστεύω εἰς αὐτόν em contexto de fé em Jesus
  choice: creram nele
  alternative: depositaram sua fé nele
  rationale: “Creram nele” preserva a linguagem bíblica de fé dirigida a Jesus sem ampliar o texto com uma paráfrase interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ordem natural. A colocação de “ali” antes do verbo evita a possível leitura de que “nele ali” forme uma unidade e mantém o foco narrativo no lugar.
