  text: εἰ οὐ ποιῶ τὰ ἔργα τοῦ πατρός μου, μὴ πιστεύετέ μοι·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/037.yaml
  text: If I am not doing the works of my Father[a], do not believe me;
translation:
  language: pt
  text: Se não faço as obras de meu Pai, não me deem crédito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não acreditem em mim”.'
    reason: Alternativa idiomática para πιστεύετέ μοι, que pode expressar dar crédito à pessoa ou ao seu testemunho.
lexical_decisions:
- source_word: εἰ οὐ ποιῶ
  choice: Se não faço
  rationale: A construção introduz uma condição e nega o presente do indicativo. Em português, o presente simples expressa naturalmente a atividade contínua no contexto.
- source_word: τὰ ἔργα
  choice: as obras
  rationale: “Obras” preserva o termo característico do Evangelho de João para as ações de Jesus, inclusive seus sinais, sem restringir o sentido.
- source_word: τοῦ πατρός μου
  choice: de meu Pai
  rationale: Reproduz diretamente a construção genitiva; “Pai” recebe inicial maiúscula por funcionar aqui como título divino.
- source_word: μὴ πιστεύετέ μοι
  choice: não creiam em mim
  rationale: O imperativo presente com μή expressa proibição. A construção com o dativo μοι pode indicar crédito ou fé dirigidos à pessoa de Jesus; “creiam em mim” preserva essa formulação pessoal e é natural em português.
theological_decisions:
- issue: Sentido de πιστεύω com o dativo μοι
  choice: não creiam em mim
  alternative: não creiam no que eu digo
  rationale: A construção grega permite tanto a orientação pessoal da fé ou confiança quanto o sentido de dar crédito ao que alguém diz. O texto principal conserva a referência direta a Jesus, enquanto a nota registra a nuance proposicional sem resolver indevidamente a sobreposição contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O presente simples evita uma perífrase desnecessária e mantém o caráter direto da declaração. O marcador foi colocado após “mim”, expressão à qual a nota se refere.
