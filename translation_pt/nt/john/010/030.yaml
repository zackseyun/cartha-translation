  text: ἐγὼ καὶ ὁ πατὴρ ἕν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/030.yaml
  text: I and the Father are one[a].
translation:
  language: pt
  text: Eu e o Pai somos um[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No grego, «um» está no gênero neutro, o que enfatiza a unidade sem identificar Jesus e o Pai como uma só pessoa.
    reason: A forma portuguesa «um» não torna visível a distinção gramatical do neutro grego, relevante para a interpretação da frase.
lexical_decisions:
- source_word: ἐγὼ
  choice: Eu
  rationale: Mantém o pronome explícito e enfático do grego, embora em português ele pudesse ser omitido.
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa simples que une os dois sujeitos sem acrescentar outra nuance.
- source_word: ὁ πατὴρ
  choice: o Pai
  rationale: O artigo e o uso joanino apontam para o Pai de Jesus; a inicial maiúscula sinaliza o título pessoal e divino.
- source_word: ἕν
  choice: um
  rationale: Reproduz de modo direto o numeral neutro singular. Em português, a forma masculina é exigida no predicativo substantivado desta construção e, isoladamente, não preserva a distinção de gênero visível no grego; por isso, a nota registra esse dado.
- source_word: ἐσμεν
  choice: somos
  rationale: Preserva a primeira pessoa do plural no presente, mantendo distintos os sujeitos «Eu» e «o Pai» ao mesmo tempo que afirma sua unidade.
theological_decisions:
- issue: O sentido de ἕν, neutro, combinado com ἐσμεν, no plural, numa declaração cristologicamente significativa
  choice: «Eu e o Pai somos um.»
  alternative: «Eu e o Pai somos uma só coisa»; «Eu e o Pai estamos em unidade»
  rationale: 'A formulação direta preserva a tensão do grego: afirma uma unidade real entre Jesus e o Pai sem identificá-los como uma única pessoa. «Uma só coisa» pode soar impessoal ou excessivamente explicativo, e «estamos em unidade» pode enfraquecer a afirmação para mera concordância.'
translation_notes:
  register: Português moderno, claro e digno, com formulação tradicional e natural tanto no Brasil como em outros contextos lusófonos. A nota explica apenas a informação gramatical que se perde na tradução.
