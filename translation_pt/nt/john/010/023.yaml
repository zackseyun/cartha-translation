lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a ligação coordenativa simples do grego sem acrescentar uma nuance temporal.
- source_word: περιεπάτει
  choice: caminhava
  rationale: O imperfeito indica uma ação em andamento no passado; “caminhava” preserva naturalmente esse aspecto em português.
- source_word: ἱερῷ
  choice: complexo do templo
  rationale: ἱερόν designa toda a área ou recinto do templo, em contraste com ναός, o santuário propriamente dito.
- source_word: στοᾷ
  choice: Pórtico
  rationale: στοά designa uma passagem coberta sustentada por colunas; “Pórtico” é adequado ao nome tradicional do lugar.
- source_word: τοῦ Σολομῶνος
  choice: de Salomão
  rationale: Expressa de modo natural em português o genitivo que integra o nome do local.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem natural. “Complexo do templo” explicita o alcance de ἱερόν, enquanto “Pórtico de Salomão” preserva o nome reconhecível do local. Os marcadores foram colocados imediatamente após os termos explicados.
