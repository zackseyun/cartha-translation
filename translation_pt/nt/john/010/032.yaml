  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Πολλὰ ⸂ἔργα καλὰ ἔδειξα ὑμῖν⸃ ἐκ τοῦ ⸀πατρός· διὰ ποῖον αὐτῶν ἔργον ⸂ἐμὲ λιθάζετε⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/032.yaml
  text: Jesus answered them[a], “I showed you many good works from the Father[b]; for which of them are you stoning me?”
translation:
  language: pt
  text: 'Jesus lhes respondeu: “Mostrei a vocês muitas obras boas que vêm do Pai; por qual delas vocês estão me apedrejando?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: Verbo narrativo corrente e natural para introduzir a resposta de Jesus.
- source_word: Πολλὰ ἔργα καλὰ
  choice: muitas obras boas
  rationale: Preserva o substantivo joanino ἔργα como “obras” e a qualidade positiva expressa por καλὰ, sem reduzir as obras apenas a milagres.
- source_word: ἔδειξα
  choice: mostrei
  rationale: Traduz diretamente o aoristo e conserva a ideia de tornar as obras visíveis ou evidentes.
- source_word: ἐκ τοῦ πατρός
  choice: que vêm do Pai
  rationale: Expressa naturalmente em português a origem indicada por ἐκ, mantendo “o Pai” sem acrescentar o possessivo “meu”.
- source_word: διὰ ποῖον αὐτῶν ἔργον
  choice: por qual delas
  rationale: “Por” comunica a causa expressa por διά com acusativo; “qual delas” retoma de modo claro e conciso as muitas obras mencionadas.
- source_word: ἐμὲ λιθάζετε
  choice: vocês estão me apedrejando
  rationale: A forma progressiva corresponde ao presente no contexto da ação imediata e evita acrescentar explicitamente “tentando”, ideia não lexicalizada no verbo.
theological_decisions:
- issue: Referência a “o Pai” na fala de Jesus
  choice: do Pai
  alternative: do meu Pai
  rationale: O texto grego não contém o pronome possessivo μου. A formulação conserva a referência cristológica sem intensificá-la além do que está expresso.
- issue: Natureza das ações de Jesus
  choice: obras boas
  alternative: milagres / boas ações
  rationale: “Obras” mantém a amplitude teológica de ἔργα em João, que pode abranger sinais e outros atos de Jesus, sem limitar o sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “A vocês” e “vocês” evitam regionalismo excessivo; “apedrejando” preserva a imagem concreta do original. Nenhuma nota é necessária, pois as alternativas relevantes podem ser tratadas nas decisões editoriais sem sobrecarregar o versículo.
