source:
  edition: SBLGNT
  text: καθὼς γινώσκει με ὁ πατὴρ κἀγὼ γινώσκω τὸν πατέρα, καὶ τὴν ψυχήν μου τίθημι ὑπὲρ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/015.yaml
  text: just as the Father knows me and I know the Father[b][a], and I lay down my life for the sheep.
translation:
  language: pt
  text: Assim como o Pai me conhece e eu conheço o Pai, dou a minha vida[a] pelas ovelhas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a minha alma”. Aqui, no contexto da entrega sacrificial, o sentido é “a minha vida”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em favor das ovelhas”. A preposição grega pode ter força representativa ou sacrificial.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: assim como
  rationale: Introduz naturalmente em português a comparação com o conhecimento mútuo entre o pastor e as ovelhas mencionado no contexto anterior.
- source_word: γινώσκει / γινώσκω
  choice: conhece / conheço
  rationale: Preserva a repetição e o sentido relacional profundo do verbo grego sem explicá-lo além do texto.
- source_word: ὁ πατὴρ / τὸν πατέρα
  choice: o Pai
  rationale: Mantém o artigo grego e o uso joanino, sem acrescentar o possessivo 'meu'.
- source_word: κἀγὼ
  choice: e eu
  rationale: Reflete a contração de καί + ἐγώ e conserva o paralelismo equilibrado da frase.
- source_word: τὴν ψυχήν μου
  choice: a minha vida
  rationale: Neste contexto de entrega até a morte, ψυχή designa a vida da pessoa, não especificamente uma alma imaterial.
- source_word: τίθημι
  choice: dou
  rationale: Em português corrente, 'dar a vida' expressa de modo natural o idioma grego de pôr ou depor a própria vida, preservando a entrega voluntária.
- source_word: ὑπὲρ
  choice: pelas
  rationale: A construção 'dar a vida pelas ovelhas' é natural e conserva a amplitude benefativa, representativa e sacrificial de ὑπέρ sem impor uma formulação técnica.
- source_word: τῶν προβάτων
  choice: as ovelhas
  rationale: Preserva diretamente a metáfora pastoral central da passagem.
theological_decisions:
- issue: Força de ὑπὲρ na entrega de Jesus
  choice: pelas ovelhas
  alternative: em favor das ovelhas
  rationale: A tradução mantém o caráter intencional e sacrificial da entrega em benefício das ovelhas, sem restringir a preposição a uma única formulação doutrinária, como 'no lugar de'.
- issue: Sentido de ψυχή neste contexto
  choice: vida
  alternative: alma
  rationale: A cena trata da morte voluntária do bom pastor; portanto, 'vida' comunica o referente contextual sem sugerir que apenas uma parte imaterial seja entregue.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação preserva a estreita ligação com o contexto anterior; a formulação mantém o paralelismo e a metáfora das ovelhas.
