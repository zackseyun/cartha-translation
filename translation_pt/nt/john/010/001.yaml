source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ μὴ εἰσερχόμενος διὰ τῆς θύρας εἰς τὴν αὐλὴν τῶν προβάτων ἀλλὰ ἀναβαίνων ἀλλαχόθεν ἐκεῖνος κλέπτης ἐστὶν καὶ λῃστής·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/001.yaml
  text: Truly[a], truly, I say to you, the one who does not enter through the door into the sheepfold[c][b], but climbs up from somewhere else—that man is a thief and a robber.
translation:
  language: pt
  text: '“Em verdade, em verdade lhes digo: quem não entra pela porta[a] no aprisco das ovelhas[b], mas sobe por outro lugar, esse é ladrão e assaltante[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelo portão”. O grego θύρα pode significar “porta” ou “portão”, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “no curral das ovelhas” ou “no pátio das ovelhas”. O grego αὐλή designa um pátio ou recinto cercado.
    reason: lexical_alternative
  - marker: c
    text: O grego distingue “ladrão” (κλέπτης) de “assaltante” (λῃστής); o segundo termo frequentemente sugere roubo mediante força ou violência.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Preserva a repetição enfática e solene da fórmula de Jesus em português atual e digno.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Expressa diretamente a fórmula de fala; o plural de ὑμῖν é preservado pelo pronome “lhes”.
- source_word: ὁ μὴ εἰσερχόμενος
  choice: quem não entra
  rationale: Verte naturalmente o particípio substantivado de sentido genérico, sem recorrer a uma construção arcaica.
- source_word: διὰ τῆς θύρας
  choice: pela porta
  rationale: “Porta” é equivalente direto de θύρα e mantém a imagem que será desenvolvida no contexto; “portão” também é possível.
- source_word: εἰς τὴν αὐλὴν τῶν προβάτων
  choice: no aprisco das ovelhas
  rationale: No contexto pastoril, “aprisco” comunica com precisão o recinto cercado destinado às ovelhas, embora αὐλή também possa designar um pátio.
- source_word: ἀλλὰ ἀναβαίνων ἀλλαχόθεν
  choice: mas sobe por outro lugar
  rationale: Mantém o movimento expresso por ἀναβαίνων e a ideia espacial de uma origem ou passagem diferente em ἀλλαχόθεν, sem explicar além do texto.
- source_word: ἐκεῖνος
  choice: esse
  rationale: Preserva a força identificadora do demonstrativo de maneira natural em português.
- source_word: κλέπτης
  choice: ladrão
  rationale: Equivalente corrente para quem furta ou rouba, frequentemente de modo furtivo.
- source_word: λῃστής
  choice: assaltante
  rationale: Distingue o termo de κλέπτης e comunica sua frequente associação com roubo mediante força ou violência.
theological_decisions:
- issue: Configuração metafórica de αὐλή e θύρα
  choice: Manter concretamente “porta” e “aprisco”, sem identificar neste versículo os referentes da metáfora.
  alternative: Usar “portão” e “curral das ovelhas” ou explicitar alegoricamente quem são a porta, as ovelhas e os invasores.
  rationale: O versículo apresenta a imagem antes de sua explicação no contexto. A tradução não deve antecipar nem impor uma interpretação teológica.
- issue: Forma genérica do particípio substantivado masculino singular
  choice: Traduzir por “quem não entra” e retomar com “esse”.
  alternative: Empregar “o homem que não entra” ou “aquele que não entra”.
  rationale: “Quem” preserva o sentido representativo e genérico de modo idiomático; “esse” mantém o singular demonstrativo sem acrescentar uma referência masculina mais explícita do que o português exige.
- issue: Distinção entre κλέπτης e λῃστής
  choice: Usar “ladrão e assaltante”.
  alternative: Usar “ladrão e salteador”.
  rationale: A escolha conserva a distinção entre o furto/roubo furtivo e a apropriação mais ligada à força, sem fundir os dois termos.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e direto. “Aprisco” é um termo pastoril conhecido e preciso; as alternativas mais cotidianas constam em nota. A pontuação mantém a solenidade da abertura e a progressão da frase grega.
