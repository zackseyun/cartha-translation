  text: ὁ δὲ εἰσερχόμενος διὰ τῆς θύρας ποιμήν ἐστιν τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/002.yaml
  text: But the one who enters through the door is the shepherd of the sheep[a].
translation:
  language: pt
  text: Mas quem entra pela porta é o pastor das ovelhas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “um pastor das ovelhas”. Em grego, o substantivo traduzido como “pastor” não tem artigo, mas o contexto favorece o sentido definido: o pastor legítimo, em contraste com os invasores.'
    reason: alternativa lexical e ambiguidade quanto à definitude
lexical_decisions:
- source_word: ὁ δὲ εἰσερχόμενος
  choice: Mas quem entra
  rationale: O particípio presente substantivado refere-se à pessoa caracterizada por entrar. “Quem entra” é natural em português e mantém o sentido genérico; δέ marca o contraste com o ladrão e assaltante do versículo anterior.
- source_word: διὰ τῆς θύρας
  choice: pela porta
  rationale: διά com genitivo indica passagem através de um meio ou abertura. Em português, “entrar pela porta” expressa naturalmente esse movimento.
- source_word: ποιμήν
  choice: o pastor
  rationale: Embora o substantivo predicativo grego não tenha artigo, o contraste contextual aponta para o pastor legítimo e reconhecido, não apenas para um integrante indeterminado da classe dos pastores.
- source_word: τῶν προβάτων
  choice: das ovelhas
  rationale: Traduz diretamente o genitivo e preserva a imagem concreta de πρόβατα, sem substituí-la interpretativamente por “rebanho”.
theological_decisions:
- issue: Definitude de ποιμήν no predicativo
  choice: o pastor
  alternative: um pastor
  rationale: O contexto contrasta quem entra legitimamente com ladrões e assaltantes. O artigo definido comunica essa identificação contextual sem antecipar ou impor conclusões cristológicas posteriores; a possibilidade gramatical indefinida é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Quem entra pela porta” evita rigidez literal, enquanto “pastor das ovelhas” conserva a metáfora e a estrutura do original.
