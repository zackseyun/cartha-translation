  text: εἰ ἐκείνους εἶπεν θεοὺς πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο, καὶ οὐ δύναται λυθῆναι ἡ γραφή,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/035.yaml
  text: If he called those to whom the word of God came ‘gods’—and the Scripture cannot be broken—[a][b]
translation:
  language: pt
  text: Se ele chamou de “deuses” aqueles a quem veio a palavra de Deus — e a Escritura não pode ser anulada —[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seres divinos”. O grego diz “deuses”, retomando o Salmo 82:6; alguns intérpretes entendem que se refere a juízes humanos.
    reason: lexical_alternative
  - marker: b
    text: Ou “não pode ser invalidada”, “não pode ser deixada de lado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Se
  rationale: Preserva a estrutura condicional do argumento de Jesus de modo natural em português.
- source_word: ἐκείνους
  choice: aqueles
  rationale: Retoma as pessoas mencionadas na Escritura sem acrescentar uma identificação ausente do grego.
- source_word: εἶπεν θεοὺς
  choice: chamou de “deuses”
  rationale: A construção predicativa é expressa naturalmente em português por “chamar de”, mantendo o termo decisivo da citação do Salmo 82:6.
- source_word: θεοὺς
  choice: deuses
  rationale: Reproduz literalmente o plural da citação e preserva a tensão interpretativa; as minúsculas distinguem esses referentes de Deus.
- source_word: πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο
  choice: aqueles a quem veio a palavra de Deus
  rationale: Mantém a direção da palavra divina aos destinatários e a expressão bíblica natural “veio a palavra de Deus”.
- source_word: οὐ δύναται λυθῆναι
  choice: não pode ser anulada
  rationale: Comunica diretamente que a Escritura não pode ser invalidada nem destituída de autoridade, sentido contextual de λύω.
- source_word: ἡ γραφή
  choice: a Escritura
  rationale: Preserva o artigo e a referência ao texto sagrado como autoridade escrita.
theological_decisions:
- issue: Sentido de “deuses” na citação de Jesus
  choice: Manter “deuses” no texto principal sem identificar os referentes.
  alternative: “seres divinos” ou “juízes”
  rationale: O argumento depende da formulação do Salmo 82:6. Substituir o termo por uma identificação interpretativa resolveria indevidamente uma ambiguidade real.
- issue: Força de “a Escritura não pode ser anulada”
  choice: Expressar a impossibilidade de invalidar a Escritura.
  alternative: “a Escritura não pode ser quebrada” ou “deixada de lado”
  rationale: “Anulada” transmite em português corrente o valor de algo que não pode ser invalidado, sem restringir a frase a uma formulação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. As aspas destacam o termo citado, e os travessões preservam o caráter parentético da afirmação sobre a Escritura.
