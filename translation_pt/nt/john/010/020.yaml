  text: ἔλεγον δὲ πολλοὶ ἐξ αὐτῶν· Δαιμόνιον ἔχει καὶ μαίνεται· τί αὐτοῦ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/020.yaml
  text: But many of them were saying[a], “He has a demon and is insane. Why do you listen to him?”
translation:
  language: pt
  text: 'Mas muitos deles diziam: “Ele tem um demônio e está louco. Por que vocês o escutam?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito indica fala contínua ou repetida na cena; “diziam” expressa isso naturalmente em português.
- source_word: δὲ
  choice: Mas
  rationale: A conjunção introduz contraste com a reação apresentada no contexto anterior.
- source_word: πολλοὶ ἐξ αὐτῶν
  choice: muitos deles
  rationale: Expressa de modo idiomático a construção partitiva, deixando claro que se tratava de uma parcela do grupo.
- source_word: Δαιμόνιον ἔχει
  choice: Ele tem um demônio
  rationale: Tradução direta e transparente da expressão grega, sem substituí-la pela formulação mais interpretativa “está possuído por um demônio”.
- source_word: μαίνεται
  choice: está louco
  rationale: Comunica em linguagem atual a acusação de desvario, sem introduzir um diagnóstico clínico moderno.
- source_word: τί αὐτοῦ ἀκούετε;
  choice: Por que vocês o escutam?
  rationale: Neste contexto, τί tem força idiomática de “por que?”, e ἀκούω com o genitivo transmite a ideia de dar ouvidos a alguém.
theological_decisions:
- issue: Formulação da acusação hostil contra Jesus
  choice: Ele tem um demônio e está louco
  alternative: Ele está possuído por um demônio e fora de si
  rationale: Mantém a acusação como fala dos adversários e segue de perto as duas afirmações gregas, sem suavizá-las nem convertê-las em explicação clínica ou doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vocês” torna natural a pergunta dirigida ao grupo; “está louco” preserva o caráter ofensivo da acusação sem soar excessivamente técnico.
