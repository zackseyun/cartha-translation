source:
  edition: SBLGNT
  text: δέομαι δὲ τὸ μὴ παρὼν θαρρῆσαι τῇ πεποιθήσει ᾗ λογίζομαι τολμῆσαι ἐπί τινας τοὺς λογιζομένους ἡμᾶς ὡς κατὰ σάρκα περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/002.yaml
  text: But I beg that when I am present I may not have to be bold with the confidence by which I consider daring to confront some who regard us as walking according to the flesh[a].
translation:
  language: pt
  text: Mas suplico que, quando eu estiver presente, eu não tenha de agir com ousadia, valendo-me da confiança com que penso atrever-me a enfrentar alguns que nos consideram pessoas que vivem segundo a carne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que vivem segundo critérios humanos”.'
    reason: Alternativa lexical que esclarece um possível sentido contextual de κατὰ σάρκα sem substituir a ambiguidade do texto principal.
lexical_decisions:
- source_word: δέομαι
  choice: peço
  rationale: Expressa uma súplica pessoal e séria; em português moderno, “peço” preserva a dignidade e, no contexto, comunica o apelo sem a possível conotação excessivamente dramática de “imploro”.
- source_word: τὸ μὴ παρὼν θαρρῆσαι
  choice: que, quando eu estiver presente, não tenha de agir com ousadia
  rationale: Apresenta de modo idiomático o conteúdo do pedido e explicita a necessidade indesejada implícita, mantendo o contraste contextual entre presença e ausência.
- source_word: τῇ πεποιθήσει
  choice: valendo-me da confiança
  rationale: Reproduz o provável valor instrumental ou associativo do dativo e evita uma ligação pouco natural em português.
- source_word: ᾗ λογίζομαι
  choice: com que penso
  rationale: λογίζομαι indica aqui avaliação ou intenção ponderada; “penso” é natural e não torna a decisão mais definitiva do que o grego.
- source_word: τολμῆσαι ἐπί τινας
  choice: enfrentar alguns
  rationale: Comunica de maneira concisa a ousadia dirigida contra certas pessoas, preservando a força adversativa de ἐπί sem produzir uma construção artificial.
- source_word: τοὺς λογιζομένους ἡμᾶς
  choice: que nos consideram
  rationale: Expressa o juízo avaliativo dos críticos sobre Paulo e seus colaboradores.
- source_word: κατὰ σάρκα
  choice: segundo a carne
  rationale: Mantém o termo paulino σάρξ e sua amplitude sem restringi-lo indevidamente a “natureza pecaminosa” ou apenas a critérios humanos.
- source_word: περιπατοῦντας
  choice: pessoas que vivem
  rationale: O verbo é metafórico e se refere à conduta; “vivem” comunica naturalmente esse sentido em português, enquanto o substantivo “pessoas” evita a formulação ambígua “nos consideram vivendo”.
theological_decisions:
- issue: Sentido de σάρξ em κατὰ σάρκα
  choice: segundo a carne
  alternative: segundo critérios humanos
  rationale: A acusação pode envolver conduta orientada por padrões meramente humanos, mas o termo paulino também comporta ressonância moral e teológica. A tradução principal conserva essa tensão, e a nota oferece a leitura contextual mais interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura foi suavizada para evitar literalismo truncado, mas foram preservados o pedido urgente, a futura presença de Paulo, a confrontação contemplada e a ambiguidade teológica de “carne”.
