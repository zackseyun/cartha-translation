    rationale: «Penso enfrentar alguns» traduz a ação de confronto, mas não a noção de atrever-se/ousar que o infinitivo τολμῆσαι acrescenta. «Penso atrever-me a enfrentar» conserva ambos os elementos sem introduzir uma interpretação doutrinária.
  - severity: low
