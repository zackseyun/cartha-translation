id: 2CO.10.6
reference: 2 Corinthians 10:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐν ἑτοίμῳ ἔχοντες ἐκδικῆσαι πᾶσαν παρακοήν, ὅταν πληρωθῇ ὑμῶν ἡ ὑπακοή.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/006.yaml
  text: and being ready to punish every act of disobedience[b][a], when your obedience is complete.
translation:
  language: pt
  text: e estando prontos para punir toda desobediência[a], quando a obediência de vocês estiver completa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fazer justiça contra toda desobediência” ou “vingar toda desobediência”. O verbo grego pode indicar a aplicação da justiça ou a vingança; neste contexto, provavelmente se refere a uma medida disciplinar.
    reason: lexical_alternative
  - marker: b
    text: Ou “tiver sido cumprida” ou “levada à plenitude”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑτοίμῳ ἔχοντες
  choice: estando prontos
  rationale: A expressão idiomática indica estar preparado ou de prontidão; esta formulação preserva o valor participial e soa natural em português.
- source_word: ἐκδικῆσαι
  choice: punir
  rationale: No contexto da autoridade apostólica diante da oposição, o verbo aponta para a imposição de uma medida justa ou disciplinar, sem sugerir necessariamente vingança pessoal.
- source_word: πᾶσαν παρακοήν
  choice: toda desobediência
  rationale: Mantém de forma concisa tanto o alcance de πᾶσαν quanto o sentido de recusa em obedecer expresso por παρακοή.
- source_word: ὅταν
  choice: quando
  rationale: Com o subjuntivo, introduz uma circunstância futura ainda contingente; em português, “quando” seguido do futuro do subjuntivo expressa naturalmente essa nuance.
- source_word: πληρωθῇ
  choice: estiver completa
  rationale: O passivo de πληρόω indica que a obediência alcança sua medida plena; “estiver completa” é claro e preserva a ideia de completude.
- source_word: ὑμῶν ἡ ὑπακοή
  choice: a obediência de vocês
  rationale: Reproduz claramente o possessivo plural e oferece ampla legibilidade, especialmente no português brasileiro.
theological_decisions:
- issue: Natureza da resposta pretendida por Paulo à oposição
  choice: ação punitiva ou disciplinar contra a desobediência
  alternative: vingança pessoal contra os opositores ou juízo divino escatológico
  rationale: O contexto imediato trata da autoridade apostólica e da correção da oposição rebelde. “Punir” comunica ação disciplinar sem transformar o texto em defesa de vingança privada; a nota preserva a amplitude lexical do verbo.
translation_notes:
  register: Português moderno, digno e de compreensão ampla, com “vocês” para explicitar o plural. A estrutura foi mantida como continuação da frase anterior, inclusive com inicial minúscula. As notas foram posicionadas junto às expressões que esclarecem.
