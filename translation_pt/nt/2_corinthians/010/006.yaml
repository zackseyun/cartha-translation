  source_fidelity: O texto traduz adequadamente a construção participial καὶ ἐν ἑτοίμῳ ἔχοντες como continuação da frase anterior (“e estando prontos”), ἐκδικῆσαι como “punir”, πᾶσαν παρακοήν como “toda desobediência” e ὅταν πληρωθῇ como “quando ... estiver completa”. A formulação portuguesa conserva a circunstância futura e contingente expressa pelo subjuntivo grego, sem introduzir uma interpretação doutrinária indevida.
  naturalness: “E estando prontos para punir toda desobediência, quando a obediência de vocês estiver completa” é português moderno, claro e adequado ao registro epistolar. “Vocês” favorece a legibilidade brasileira e permanece amplamente compreensível no português internacional. A inicial minúscula é apropriada por se tratar de continuação sintática.
