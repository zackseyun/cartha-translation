source:
  edition: SBLGNT
  text: οὐ γὰρ ὁ ἑαυτὸν ⸀συνιστάνων, ἐκεῖνός ἐστιν δόκιμος, ἀλλὰ ὃν ὁ κύριος συνίστησιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/018.yaml
  text: For it is not the one who commends himself who is approved[a], but the one whom the Lord commends.
translation:
  language: pt
  text: Pois não é aprovado aquele que recomenda a si mesmo, mas aquele que o Senhor recomenda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «apresenta a si mesmo» ... «aquele que o Senhor apresenta». O mesmo verbo grego é usado nos dois casos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνων / συνίστησιν
  choice: recomenda / recomenda
  rationale: No contexto de avaliação e vanglória, συνίστημι indica apresentar alguém favoravelmente ou recomendá-lo. A repetição do mesmo verbo em português preserva a correspondência intencional do grego.
- source_word: δόκιμος
  choice: aprovado
  rationale: Designa quem é considerado aprovado após exame ou avaliação; mantém o contraste entre recomendar a si mesmo e receber a recomendação do Senhor.
- source_word: κύριος
  choice: Senhor
  rationale: É a tradução corrente do título κύριος e não especifica além do que o próprio versículo declara.
- source_word: ἑαυτὸν
  choice: a si mesmo
  rationale: Preserva a referência reflexiva do grego e soa natural na construção portuguesa.
- source_word: ὃν
  choice: aquele que
  rationale: 'Explicita naturalmente em português o segundo termo do contraste: não aquele que recomenda a si mesmo, mas aquele que o Senhor recomenda.'
- source_word: γὰρ
  choice: Pois
  rationale: Conserva a função explicativa de γάρ, ligando o versículo ao argumento anterior.
theological_decisions:
- issue: Referente de ὁ κύριος
  choice: Senhor
  alternative: Senhor Jesus; Deus
  rationale: Embora no uso paulino o título frequentemente se refira a Jesus, o versículo diz apenas «o Senhor». A tradução preserva essa formulação sem resolver a referência no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para uma construção natural em português, mantendo o contraste e a repetição lexical do original.
