id: 2CO.10.13
reference: 2 Corinthians 10:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ⸀οὐκ εἰς τὰ ἄμετρα καυχησόμεθα, ἀλλὰ κατὰ τὸ μέτρον τοῦ κανόνος οὗ ἐμέρισεν ἡμῖν ὁ θεὸς μέτρου, ἐφικέσθαι ἄχρι καὶ ὑμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/013.yaml
  text: But we will not boast beyond measure[a], but according to the measure of the sphere that God assigned to us—a measure that reaches even to you—
translation:
  language: pt
  text: Nós, porém, não nos gloriaremos além dos limites, mas segundo a medida do campo de atuação que Deus nos atribuiu, medida que chega até mesmo a vocês—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄμετρα
  choice: além dos limites
  rationale: Expressa o ato de ultrapassar os limites apropriados e mantém a imagem contextual de uma esfera delimitada, em português natural.
- source_word: καυχησόμεθα
  choice: nos gloriaremos
  rationale: Verbo tradicional, digno e compreensível para a reivindicação de mérito ou autoridade presente na polêmica de Paulo.
- source_word: κατὰ τὸ μέτρον
  choice: segundo a medida
  rationale: Preserva a linguagem reiterada de μέτρον e a ideia de conformidade com o limite atribuído.
- source_word: κανόνος
  choice: campo de atuação
  rationale: Neste contexto, designa a esfera delimitada de trabalho confiada por Deus; a expressão comunica o sentido espacial sem sugerir primariamente uma regra moral.
- source_word: οὗ ἐμέρισεν ἡμῖν ὁ θεὸς
  choice: que Deus nos atribuiu
  rationale: Comunica de modo natural a distribuição divina de uma esfera de ministério.
- source_word: μέτρου
  choice: medida
  rationale: Mantém a repetição intencional do substantivo grego e funciona como explicação do campo atribuído.
- source_word: ἐφικέσθαι
  choice: que chega
  rationale: Indica a extensão alcançada pelo campo de atuação atribuído.
- source_word: ἄχρι καὶ ὑμῶν
  choice: até mesmo a vocês
  rationale: Preserva tanto a ideia de extensão de ἄχρι quanto a ênfase inclusiva de καί.
theological_decisions:
- issue: Sentido de κανών na reivindicação ministerial de Paulo
  choice: Um campo de atuação delimitado e atribuído por Deus, que inclui os coríntios
  alternative: Uma regra ou norma pela qual Paulo mede sua glória
  rationale: O contexto imediato reúne medida, atribuição e alcance. A tradução privilegia a imagem espacial dominante, sem negar que κανών também possa designar uma regra ou padrão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Campo de atuação” evita o sentido moderno eclesiástico de “cânon” e torna clara a esfera ministerial, enquanto “medida” é repetida para refletir o grego. O travessão final preserva a continuidade sintática com o versículo seguinte.
