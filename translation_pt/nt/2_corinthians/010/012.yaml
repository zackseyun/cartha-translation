id: 2CO.10.12
reference: 2 Corinthians 10:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐ γὰρ τολμῶμεν ἐγκρῖναι ἢ συγκρῖναι ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων· ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες καὶ συγκρίνοντες ἑαυτοὺς ἑαυτοῖς οὐ συνιᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/012.yaml
  text: For we do not dare to classify or compare ourselves with some of those who commend themselves[a]. But when they measure themselves by themselves and compare themselves with themselves[b], they do not understand.
translation:
  language: pt
  text: Pois não ousamos nos incluir[a] entre alguns dos que recomendam a si mesmos, nem nos comparar com eles. Mas eles próprios, medindo-se por si mesmos e comparando-se consigo mesmos[b], não entendem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos classificar” ou “nos colocar no mesmo nível”. O verbo grego transmite a ideia de incluir alguém em determinada categoria.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “medindo a si mesmos em si mesmos e comparando a si mesmos consigo mesmos”. A expressão também pode sugerir que eles se avaliam dentro do próprio grupo, tomando a si mesmos como referência.
    reason: lexical_alternative
lexical_decisions:
- source_word: τολμῶμεν
  choice: ousamos
  rationale: Mantém a ideia de atrever-se ou presumir fazer algo e preserva o tom irônico de Paulo.
- source_word: ἐγκρῖναι
  choice: nos incluir entre
  rationale: Neste contexto, o verbo indica colocar-se na mesma classe ou grupo que outros, não simplesmente emitir um juízo.
- source_word: συγκρῖναι / συγκρίνοντες
  choice: comparar / comparando
  rationale: O sentido natural é comparar; a repetição da mesma raiz em português preserva a retórica do grego.
- source_word: ἑαυτοὺς συνιστανόντων
  choice: recomendam a si mesmos
  rationale: A expressão denota autoaprovação ou autorrecomendação; a forma explícita evita que o reflexivo seja entendido como ação recíproca.
- source_word: ἀλλὰ αὐτοὶ
  choice: Mas eles próprios
  rationale: “Eles próprios” preserva a ênfase de αὐτοὶ e o contraste com Paulo e seus colaboradores.
- source_word: ἐν ἑαυτοῖς
  choice: por si mesmos
  rationale: Expressa de modo natural a avaliação autorreferencial, sem apagar por completo a possível nuance de atuação dentro do próprio grupo.
- source_word: μετροῦντες
  choice: medindo-se
  rationale: Conserva a metáfora concreta de medir, usada aqui no sentido de avaliar segundo um padrão.
- source_word: ἑαυτοὺς ἑαυτοῖς
  choice: comparando-se consigo mesmos
  rationale: Mantém a forte repetição reflexiva e evidencia que a comparação não recorre a um padrão externo.
- source_word: οὐ συνιᾶσιν
  choice: não entendem
  rationale: Tradução direta e corrente para a falta de compreensão ou discernimento indicada pelo verbo.
theological_decisions:
- issue: O referente implícito de “não entendem”
  choice: Manter o objeto sem explicitação
  alternative: “não entendem o que fazem” ou “não têm bom senso”
  rationale: O grego não declara exatamente o que eles deixam de entender; explicitar o objeto resolveria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição dos pronomes reflexivos foi preservada deliberadamente por ser central à ironia e à crítica do versículo.
