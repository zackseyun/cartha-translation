source:
  edition: SBLGNT
  text: καὶ πᾶν ὕψωμα ἐπαιρόμενον κατὰ τῆς γνώσεως τοῦ θεοῦ, καὶ αἰχμαλωτίζοντες πᾶν νόημα εἰς τὴν ὑπακοὴν τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/005.yaml
  text: and every lofty thing raised up against the knowledge of God[a], and taking every thought captive into obedience to Messiah[b],
translation:
  language: pt
  text: e toda coisa elevada que se ergue contra o conhecimento de Deus[a], e levando cativo todo pensamento à obediência ao Messias[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda altivez” ou “toda pretensão”, em vez de “toda coisa elevada”.
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “o Messias”; tradicionalmente, “Cristo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν ὕψωμα
  choice: toda altivez
  rationale: ὕψωμα designa literalmente algo elevado ou exaltado. “Altivez” preserva em português a imagem de elevação e sua conotação metafórica neste contexto, sem restringi-la apenas a argumentos ou pretensões.
- source_word: ἐπαιρόμενον
  choice: que se ergue
  rationale: O particípio descreve aquilo que é levantado ou se eleva. “Que se ergue” é natural em português e mantém a imagem de oposição elevada, sem exigir uma leitura estritamente reflexiva de autoexaltação.
- source_word: κατὰ τῆς γνώσεως τοῦ θεοῦ
  choice: contra o conhecimento de Deus
  rationale: A formulação conserva tanto a oposição expressa por κατά quanto a concisão do genitivo τοῦ θεοῦ, sem decidir se a ênfase recai no conhecimento acerca de Deus ou no ato de conhecê-lo.
- source_word: αἰχμαλωτίζοντες
  choice: levando cativo
  rationale: O verbo pertence à linguagem de capturar prisioneiros de guerra. “Levando cativo” preserva a metáfora militar e a ideia de condução para um novo domínio.
- source_word: πᾶν νόημα
  choice: todo pensamento
  rationale: νόημα pode indicar pensamento, propósito ou disposição mental. “Todo pensamento” é amplo, claro e reproduz o valor distributivo de πᾶν sem impor a ideia mais negativa de trama ou maquinação.
- source_word: εἰς τὴν ὑπακοὴν
  choice: à obediência
  rationale: A contração “à” expressa de modo idiomático em português o movimento ou direcionamento para a obediência indicado por εἰς.
- source_word: τοῦ Χριστοῦ
  choice: ao Messias
  rationale: Χριστός conserva aqui seu valor titular. “Messias” traduz o título e, com o artigo exigido pelo uso natural do português, apresenta a obediência como dirigida ao Messias.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: O termo pode ser tradicionalmente vertido por “Cristo”, mas neste contexto funciona como título; “Messias” torna explícito seu significado sem acrescentar uma interpretação denominacional.
- issue: Natureza de πᾶν ὕψωμα ἐπαιρόμενον
  choice: uma realidade elevada que se opõe ao conhecimento de Deus
  alternative: toda pretensão arrogante que se levanta contra o conhecimento de Deus
  rationale: O grego mantém amplo o referente da metáfora. A tradução evita reduzi-lo somente a uma alegação intelectual ou a uma atitude psicológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a coordenação participial e a metáfora militar do contexto. “Altivez” é literária, mas corrente no registro bíblico; a nota registra alternativas mais literais ou interpretativas.
