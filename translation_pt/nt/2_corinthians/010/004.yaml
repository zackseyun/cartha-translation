id: 2CO.10.4
reference: 2 Corinthians 10:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὰ γὰρ ὅπλα τῆς στρατείας ἡμῶν οὐ σαρκικὰ ἀλλὰ δυνατὰ τῷ θεῷ πρὸς καθαίρεσιν ὀχυρωμάτων— λογισμοὺς καθαιροῦντες
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/004.yaml
  text: For the weapons of our warfare are not fleshly[c][b][a], but powerful before God for the tearing down of strongholds—tearing down arguments
translation:
  language: pt
  text: Pois as armas da nossa luta não são carnais[a], mas poderosas diante de Deus[b] para derrubar fortalezas — derrubando raciocínios[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “próprias da carne” ou “meramente humanas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “poderosas por meio de Deus” ou “divinamente poderosas”.
    reason: alternative_reading
  - marker: c
    text: Ou “argumentos” ou “especulações”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλα
  choice: armas
  rationale: Preserva a metáfora militar concreta e é a equivalência mais natural em português.
- source_word: στρατείας
  choice: luta
  rationale: Neste contexto metafórico, comunica de modo natural o conflito em que Paulo e seus colaboradores estão envolvidos; “guerra” também seria possível, mas soaria mais absoluta.
- source_word: σαρκικὰ
  choice: carnais
  rationale: Mantém a ligação paulina com σάρξ e o contraste com o poder de Deus, sem reduzir o sentido a “pecaminosas” ou apenas “mundanas”.
- source_word: δυνατὰ τῷ θεῷ
  choice: poderosas diante de Deus
  rationale: Reflete o dativo grego sem impor como única a leitura instrumental “por meio de Deus”; a formulação conserva a concisão e a ambiguidade da expressão.
- source_word: καθαίρεσιν
  choice: derrubar
  rationale: Expressa vividamente o desmantelamento de posições fortificadas e permite conservar a repetição lexical com καθαιροῦντες.
- source_word: ὀχυρωμάτων
  choice: fortalezas
  rationale: Equivalente corrente que preserva a imagem militar de posições fortificadas.
- source_word: λογισμοὺς
  choice: raciocínios
  rationale: Mantém a amplitude do termo para processos de pensamento, cálculos ou argumentos, sem restringi-lo antecipadamente apenas a argumentos verbalizados.
- source_word: καθαιροῦντες
  choice: derrubando
  rationale: Conserva a ligação lexical com καθαίρεσιν e reproduz a transição do propósito geral para sua aplicação específica.
theological_decisions:
- issue: Sentido de σαρκικὰ no contraste paulino
  choice: carnais
  alternative: humanas; mundanas; próprias da carne
  rationale: “Carnais” preserva a textura teológica e a tensão entre recursos associados à carne e poder relacionado a Deus, sem definir σάρξ aqui exclusivamente como natureza pecaminosa.
- issue: Força do dativo τῷ θεῷ em δυνατὰ τῷ θεῷ
  choice: diante de Deus
  alternative: poderosas por meio de Deus; divinamente poderosas
  rationale: O dativo é sintaticamente comprimido e admite mais de uma compreensão. A tradução principal evita acrescentar inequivocamente uma relação instrumental; a nota registra alternativas plausíveis.
- issue: Referente de λογισμοὺς
  choice: raciocínios
  alternative: argumentos; especulações
  rationale: O contexto seguinte aponta para pensamentos que se levantam contra o conhecimento de Deus, mas “raciocínios” preserva melhor a extensão lexical sem neutralizar seu caráter opositor no contexto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição “derrubar/derrubando” é deliberada para reproduzir καθαίρεσιν/καθαιροῦντες. Os marcadores foram posicionados junto aos termos a que se referem.
