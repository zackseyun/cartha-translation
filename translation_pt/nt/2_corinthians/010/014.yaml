id: 2CO.10.14
reference: 2 Corinthians 10:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ γὰρ ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς ὑπερεκτείνομεν ἑαυτούς, ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/014.yaml
  text: For we are not overextending ourselves[a], as though we had not reached you[c][b], for we came even as far as you with the gospel of Messiah—
translation:
  language: pt
  text: Pois não estamos nos estendendo além dos limites, como se não tivéssemos chegado até vocês, porque chegamos até mesmo a vocês com o evangelho do Messias[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de Cristo”.'
    reason: Alternativa tradicional para a tradução de Χριστοῦ.
lexical_decisions:
- source_word: ὑπερεκτείνομεν ἑαυτούς
  choice: estamos nos estendendo além dos limites
  rationale: Preserva a imagem de alguém que se estende para além do alcance ou dos limites que lhe cabem, com formulação natural em português e manutenção do presente.
- source_word: ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς
  choice: como se não tivéssemos chegado até vocês
  rationale: Expressa a situação hipotética que tornaria indevida a pretensão de Paulo; o pretérito composto do subjuntivo é idiomático depois de “como se” e se ajusta à chegada já realizada.
- source_word: ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν
  choice: porque chegamos até mesmo a vocês
  rationale: “Até mesmo” conserva a ênfase de καί, enquanto “chegamos” comunica a ação concluída de alcançar Corinto sem repetir a metáfora de estender-se.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: com o evangelho
  rationale: 'Representa de modo natural o valor associativo ou instrumental de ἐν: Paulo e seus cooperadores chegaram a Corinto levando e proclamando o evangelho.'
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Aqui Χριστός permanece semanticamente ativo como título no sintagma “evangelho do Messias”; “Messias” torna explícito esse valor em português.
theological_decisions:
- issue: Sentido do genitivo em “εὐαγγελίῳ τοῦ Χριστοῦ”
  choice: evangelho do Messias
  alternative: evangelho de Cristo; evangelho acerca do Messias; evangelho pertencente ao Messias
  rationale: O genitivo pode envolver origem, pertença e conteúdo, e a formulação concisa “do Messias” preserva essa amplitude sem decidir por apenas uma relação.
- issue: Valor de Χριστοῦ como título ou forma semelhante a nome próprio
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, como qualificador de “evangelho”, o sentido titular continua perceptível; a alternativa tradicional é registrada em nota sem impor uma distinção teológica ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo; o travessão final foi mantido porque a frase continua no versículo seguinte.
