id: 2CO.10.11
reference: 2 Corinthians 10:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτο λογιζέσθω ὁ τοιοῦτος, ὅτι οἷοί ἐσμεν τῷ λόγῳ δι’ ἐπιστολῶν ἀπόντες, τοιοῦτοι καὶ παρόντες τῷ ἔργῳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/011.yaml
  text: 'Let such a person consider this: what we are in word by letters when absent[b][a], we are also in deed when present.'
translation:
  language: pt
  text: 'Que tal pessoa[a] considere isto: o que somos no que dizemos por meio de cartas, quando ausentes, também somos no que fazemos[b], quando presentes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma pessoa assim”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “na palavra [...] na ação”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζέσθω
  choice: considere
  rationale: O imperativo presente na terceira pessoa pede que o indivíduo avalie ou leve em conta o fato apresentado. “Considere” é natural, claro e mantém a força deliberativa.
- source_word: ὁ τοιοῦτος
  choice: tal pessoa
  rationale: Refere-se, no singular, ao tipo de pessoa mencionado no contexto anterior. “Tal pessoa” é corrente e preserva essa referência qualitativa.
- source_word: οἷοί ἐσμεν ... τοιοῦτοι
  choice: o que somos ... também somos
  rationale: A formulação reproduz a comparação de qualidade ou caráter entre a comunicação à distância e a atuação em presença, sem acrescentar uma ideia ausente do grego.
- source_word: τῷ λόγῳ
  choice: no que dizemos
  rationale: O dativo indica esfera ou respeito. Esta forma comunica em português atual a dimensão verbal e mantém o contraste com “no que fazemos”.
- source_word: δι’ ἐπιστολῶν
  choice: por meio de cartas
  rationale: διά com genitivo indica aqui o meio pelo qual as palavras chegam aos destinatários. “Por meio de cartas” explicita naturalmente essa função instrumental.
- source_word: ἀπόντες
  choice: quando ausentes
  rationale: O particípio presente tem valor circunstancial e contrasta diretamente com παρόντες. A forma concisa mantém o paralelismo.
- source_word: τῷ ἔργῳ
  choice: no que fazemos
  rationale: O dativo indica esfera ou respeito e forma uma antítese deliberada com τῷ λόγῳ. A tradução é idiomática e conserva o sentido de ação efetiva.
- source_word: παρόντες
  choice: quando presentes
  rationale: O particípio presente é circunstancial e corresponde a “quando ausentes”, preservando a simetria do enunciado.
theological_decisions:
- issue: A relação entre as palavras de Paulo nas cartas e sua conduta quando presente
  choice: Apresentar a afirmação como correspondência entre o que Paulo e seus cooperadores dizem por carta e o que fazem pessoalmente.
  alternative: Transformar a frase explicitamente em uma ameaça de ação futura ou em uma distinção doutrinária entre estilo verbal e poder espiritual.
  rationale: O grego estabelece uma comparação direta entre palavra à distância e ação em presença. O presente verbal deve ser mantido, deixando que o contexto forneça a força de advertência sem explicitação excessiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação privilegia expressões idiomáticas sem perder o paralelismo entre ausência e presença nem a antítese compacta entre palavra e ação.
