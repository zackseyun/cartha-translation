  text: Pois, embora andemos na carne[a], não guerreamos segundo a carne—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois, embora vivamos no corpo, não guerreamos por critérios meramente humanos”.'
    reason: Alternativa lexical que explicita os sentidos contextuais distintos das duas ocorrências de σάρξ.
lexical_decisions:
- source_word: ἐν σαρκὶ
  choice: na carne
  rationale: Mantém a expressão relativamente literal e preserva sua relação com a segunda ocorrência de σάρξ, sem restringi-la a “natureza pecaminosa”. Aqui, a primeira expressão aponta para a existência humana corpórea.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz naturalmente em português a explicação ligada ao contexto anterior.
- source_word: περιπατοῦντες
  choice: embora andemos
  rationale: Preserva a metáfora de “andar” e entende o particípio como concessivo, em contraste com a oração seguinte.
- source_word: οὐ κατὰ σάρκα
  choice: não guerreando segundo a carne
  rationale: '“Segundo a carne” preserva a repetição retórica de σάρξ e deixa aberta a nuance exata: por critérios meramente humanos, mundanos ou carnais.'
- source_word: στρατευόμεθα
  choice: guerreamos
  rationale: Reproduz de modo natural a metáfora militar de Paulo para seu conflito apostólico.
theological_decisions:
- issue: Tradução das duas ocorrências de σάρξ
  choice: Usar “carne” nas duas ocorrências do texto principal.
  alternative: “no corpo ... por critérios meramente humanos” ou “na fraqueza humana ... de maneira carnal”
  rationale: A primeira ocorrência se refere à existência humana corpórea, enquanto a segunda indica a norma ou o modo da luta. Repetir “carne” conserva o jogo retórico e a tensão sem impor a leitura específica de “natureza pecaminosa”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação preserva a metáfora de andar, a imagem militar, a repetição de “carne” e o travessão que indica continuação no versículo seguinte.
