  text: so that I may not seem as though I were trying to frighten you by my letters[a].
translation:
  language: pt
  text: para que eu não pareça estar tentando assustar vocês por meio das cartas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como se eu quisesse intimidar vocês por meio das cartas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: para que... não
  rationale: Mantém a força de finalidade ou resultado da oração subordinada e soa natural em português.
- source_word: δόξω
  choice: eu não pareça
  rationale: O subjuntivo aoristo de δοκέω, após ἵνα, tem aqui o sentido de parecer, não de pensar; o presente do subjuntivo é a forma portuguesa idiomática.
- source_word: ὡς ἂν
  choice: estar tentando
  rationale: No contexto, a construção apresenta como aparente a caracterização expressa pelo infinitivo; em português, 'pareça estar tentando' transmite naturalmente essa nuance, sem afirmar que essa seja de fato a intenção de Paulo.
- source_word: ἐκφοβεῖν
  choice: assustar
  rationale: Expressa causar medo ou alarme. 'Assustar' é direto e corrente; 'intimidar' continua sendo uma alternativa contextual possível.
- source_word: ὑμᾶς
  choice: vocês
  rationale: Representa o objeto plural de ἐκφοβεῖν em português moderno de ampla compreensão.
- source_word: διὰ τῶν ἐπιστολῶν
  choice: por meio das cartas
  rationale: διά com genitivo indica meio ou instrumento. O artigo definido do grego é preservado em 'das cartas', evitando explicitar como pronome possessivo o que o texto apenas deixa claro pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação preserva a dependência sintática do contexto anterior, já que o versículo começa com uma oração de finalidade. O marcador [a] aparece no texto principal.
