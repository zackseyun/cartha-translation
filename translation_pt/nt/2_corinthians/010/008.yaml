reference: 2 Corinthians 10:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐάν ⸀τε ⸀γὰρ περισσότερόν τι καυχήσωμαι περὶ τῆς ἐξουσίας ἡμῶν, ἧς ἔδωκεν ὁ ⸀κύριος εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν ὑμῶν, οὐκ αἰσχυνθήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/008.yaml
  text: For even if I should boast somewhat more about our authority[a], which the Lord gave for building you up and not for tearing you down[b], I will not be put to shame.
translation:
  language: pt
  text: Pois, mesmo que eu me glorie um pouco mais da nossa autoridade, que o Senhor deu para edificar vocês e não para derrubá-los[a], não serei envergonhado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e não para a destruição de vocês”. O grego contrapõe edificação a demolição ou destruição.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não passarei vergonha” ou “não me envergonharei”. O verbo grego está na voz passiva e também pode indicar ser exposto à vergonha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: Pois, ainda que
  rationale: “Pois” preserva a função explicativa de γάρ, enquanto “ainda que” expressa de modo natural a condição hipotética introduzida por ἐάν e a nuance acrescentada por τε.
- source_word: περισσότερόν τι
  choice: um pouco mais
  rationale: Expressa o grau comparativo de περισσότερον e a atenuação indefinida de τι, sem sugerir ostentação excessiva.
- source_word: καυχήσωμαι
  choice: eu me glorie
  rationale: O subjuntivo depois de ἐάν é naturalmente representado pelo subjuntivo português na oração concessivo-condicional. “Gloriar-se” mantém o vocabulário paulino associado a καυχάομαι.
- source_word: περὶ τῆς ἐξουσίας ἡμῶν
  choice: da nossa autoridade
  rationale: ἐξουσία indica autoridade ou direito delegado, não apenas poder ou capacidade abstrata.
- source_word: ἧς ἔδωκεν ὁ κύριος
  choice: que o Senhor deu
  rationale: O pronome relativo retoma “autoridade”; o aoristo é expresso naturalmente pelo pretérito perfeito, e κύριος conserva o título “Senhor”.
- source_word: εἰς οἰκοδομὴν
  choice: para edificar vocês
  rationale: Mantém a metáfora de construção e explicita o objeto pessoal indicado pelo contraste com ὑμῶν.
- source_word: καὶ οὐκ εἰς καθαίρεσιν ὑμῶν
  choice: e não para derrubá-los
  rationale: “Derrubar” preserva a oposição metafórica entre construir e demolir, além de soar mais natural que o substantivo abstrato “destruição”.
- source_word: οὐκ αἰσχυνθήσομαι
  choice: não ficarei envergonhado
  rationale: A formulação é natural em português e pode indicar tanto sentir vergonha quanto acabar exposto à vergonha, preservando a amplitude possível do futuro passivo.
theological_decisions:
- issue: Natureza e finalidade da autoridade apostólica
  choice: A autoridade de Paulo é dada pelo Senhor para fortalecer construtivamente os coríntios, não para arruiná-los.
  alternative: Entender a autoridade principalmente como poder disciplinar destinado à destruição.
  rationale: O contraste explícito entre οἰκοδομή e καθαίρεσις apresenta a finalidade da autoridade como edificante, sem negar que ela possa ser exercida com firmeza.
- issue: Sentido de οὐκ αἰσχυνθήσομαι
  choice: Manter uma expressão capaz de abranger vergonha sentida e vergonha imposta ou publicamente demonstrada.
  alternative: Resolver a expressão exclusivamente como “não me envergonharei” ou exclusivamente como “não serei desmoralizado”.
  rationale: A forma grega permite mais de uma nuance contextual; “não ficarei envergonhado” evita decidir além do que o texto exige.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Vocês” torna explícito o referente plural de ὑμῶν; “edificar” conserva a metáfora bíblica ainda corrente, enquanto “derrubá-los” completa naturalmente o contraste.
