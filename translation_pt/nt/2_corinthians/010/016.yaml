  text: εἰς τὰ ὑπερέκεινα ὑμῶν εὐαγγελίσασθαι, οὐκ ἐν ἀλλοτρίῳ κανόνι εἰς τὰ ἕτοιμα καυχήσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/016.yaml
  text: to proclaim the good news in the regions beyond you[c][b][a], not to boast in another's sphere about things already prepared.
translation:
  language: pt
  text: para anunciar as boas-novas nas regiões além de vocês, sem nos gloriarmos a respeito de coisas já preparadas na esfera de outro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερέκεινα ὑμῶν
  choice: nas regiões além de vocês
  rationale: O adjetivo substantivado no plural indica áreas situadas além dos destinatários. A formulação mantém a relação geográfica com os coríntios sem acrescentar 'território de vocês'.
- source_word: εὐαγγελίσασθαι
  choice: anunciar as boas-novas
  rationale: Expressa de modo claro e atual a ação missionária de comunicar o evangelho, preservando a força verbal do grego.
- source_word: ἀλλοτρίῳ κανόνι
  choice: na esfera de outro
  rationale: Neste contexto, κανών designa metaforicamente uma esfera delimitada ou atribuída de atuação, não uma regra moral nem um cânon posterior.
- source_word: τὰ ἕτοιμα
  choice: coisas já preparadas
  rationale: O adjetivo substantivado permanece deliberadamente amplo. 'Já preparadas' comunica o estado de prontidão sem explicitar como 'trabalho' aquilo que o grego deixa implícito.
- source_word: καυχήσασθαι
  choice: nos gloriarmos
  rationale: Mantém o vocabulário paulino de gloriar-se e encaixa-se naturalmente na construção reflexiva em português.
theological_decisions:
- issue: Sentido de κανών no contexto do ministério de Paulo
  choice: esfera delimitada de atuação ou ministério
  alternative: regra, padrão ou cânon
  rationale: O contexto imediato trata de limites e áreas de trabalho atribuídas. 'Esfera' evita introduzir os sentidos moral ou escritural adquiridos em outros contextos.
- issue: Referência de τὰ ἕτοιμα
  choice: coisas já preparadas
  alternative: trabalho já realizado ou preparado por outros
  rationale: Embora o contexto sugira resultados ministeriais associados ao trabalho alheio, a tradução preserva a expressão substantivada e relativamente aberta do grego, sem resolver sua elipse no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para clareza, e a ambiguidade de τὰ ἕτοιμα foi preservada. O infinitivo depende do propósito expresso no contexto anterior, por isso o fragmento começa com 'para'.
