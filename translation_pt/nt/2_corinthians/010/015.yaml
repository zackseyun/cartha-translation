review_pass:
  verdict: revise
  source_fidelity: A tradução capta o contraste principal, o não se gloriar no trabalho alheio, o crescimento da fé e a ideia contextual de expansão. Contudo, «seremos grandemente ampliados» soa pouco idiomático em português e o futuro indicativo enfraquece a dependência de ἐλπίδα ἔχοντες («esperando que...»). «Para avançarmos ainda mais» introduz uma ação verbal que o grego não explicita para εἰς περισσείαν.
  naturalness: «Gloriar-se» é adequado ao registro paulino. A revisão torna a oração final mais natural em português moderno, mantendo a referência contextual à expansão da atuação apostólica sem sugerir exaltação pessoal.
  terminology: «Esfera de trabalho» comunica adequadamente κανών neste contexto, sem o anacronismo de «cânon» ou a opacidade de «regra». «Fé» preserva o valor normal de πίστις. A nota registra a ligação sintática alternativa de ἐν ὑμῖν.
  issues:
  - severity: medium
    issue: Modo verbal e naturalidade de «seremos grandemente ampliados»
    rationale: O infinitivo μεγαλυνθῆναι depende da esperança expressa por ἐλπίδα ἔχοντες; em português, «esperamos que ... seja ampliada» expressa melhor essa dependência. Além disso, pessoas «ampliadas» é formulação pouco natural; o contexto permite explicitar com cautela a atuação apostólica que é ampliada.
  - severity: medium
    issue: «Para avançarmos ainda mais» explicita além do grego
    rationale: εἰς περισσείαν expressa maior medida, abundância ou expansão adicional; não introduz explicitamente o verbo «avançar». «Ainda mais» preserva a direção sem acrescentar uma ação específica.
  - severity: low
    issue: A ambiguidade de ἐν ὑμῖν requer registro em nota
    rationale: Embora a posição favoreça sua ligação com μεγαλυνθῆναι, também pode ser entendido com o crescimento da fé. A redação principal segue a primeira leitura e a nota preserva a alternativa.
