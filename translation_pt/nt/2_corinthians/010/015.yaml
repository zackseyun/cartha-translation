revisions:
- from: Não nos gloriamos além dos limites no trabalho de outros; pelo contrário, temos a esperança de que, à medida que a fé de vocês crescer, seremos grandemente ampliados entre vocês, dentro da esfera que nos foi atribuída,[a] para avançarmos ainda mais.[b]
  to: Não nos gloriamos além da medida no trabalho de outros; ao contrário, esperamos que, à medida que a fé de vocês[a] cresce, nossa atuação entre vocês seja ampliada, dentro de nossa esfera de trabalho, ainda mais.[b]
  rationale: A revisão conserva o sentido contextual de μεγαλυνθῆναι como expansão da atuação apostólica, mas substitui uma construção portuguesa pouco natural por uma oração que depende claramente de «esperamos que». Também evita transformar εἰς περισσείαν em um novo verbo de propósito e registra em nota a ambiguidade sintática de ἐν ὑμῖν.
