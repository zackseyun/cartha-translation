  text: οὐκ εἰς τὰ ἄμετρα καυχώμενοι ἐν ἀλλοτρίοις κόποις, ἐλπίδα δὲ ἔχοντες αὐξανομένης τῆς πίστεως ὑμῶν ἐν ὑμῖν μεγαλυνθῆναι κατὰ τὸν κανόνα ἡμῶν εἰς περισσείαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/015.yaml
  text: not boasting beyond measure in the labors of others, but having hope that, as your faith is growing among you, we will be enlarged according to our sphere of ministry, unto abundance,
translation:
  language: pt
  text: Não nos gloriamos além da medida no trabalho de outros; ao contrário, esperamos que, à medida que a fé de vocês[a] cresce, nossa atuação entre vocês seja ampliada, dentro de nossa esfera de trabalho, ainda mais.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à medida que a fé de vocês cresce entre vocês”. O grego permite ligar “entre vocês” tanto ao crescimento da fé como à ampliação da atuação.'
    reason: syntactic_ambiguity
  - marker: b
    text: 'Ou: “segundo a nossa medida”, “segundo a nossa regra” ou “dentro do nosso campo”. O termo grego indica aqui uma esfera delimitada de trabalho; “ainda mais” também pode ser entendido como “em maior medida” ou “para maior expansão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ εἰς τὰ ἄμετρα καυχώμενοι
  choice: Não nos gloriamos além dos limites
  rationale: Expressa de modo natural a ideia de não ultrapassar os limites próprios ao gloriar-se, preservando a metáfora de medida presente no contexto.
- source_word: ἐν ἀλλοτρίοις κόποις
  choice: no trabalho de outros
  rationale: Indica que Paulo não reivindica mérito pelo esforço realizado por outras pessoas.
- source_word: ἐλπίδα δὲ ἔχοντες
  choice: pelo contrário, temos a esperança
  rationale: Mantém a construção nominal com ἐλπίδα e apresenta com clareza o contraste introduzido por δέ.
- source_word: αὐξανομένης τῆς πίστεως ὑμῶν
  choice: à medida que a fé de vocês crescer
  rationale: Traduz naturalmente o genitivo absoluto e mantém πίστις como 'fé'.
- source_word: ἐν ὑμῖν μεγαλυνθῆναι
  choice: seremos grandemente ampliados entre vocês
  rationale: Liga ἐν ὑμῖν ao infinitivo, uma possibilidade sintática plausível, e conserva a metáfora de expansão sem reduzi-la a prestígio pessoal.
- source_word: κατὰ τὸν κανόνα ἡμῶν
  choice: dentro da esfera que nos foi atribuída
  rationale: No contexto, κανών designa o campo delimitado do trabalho apostólico; a formulação evita tanto o anacronismo de 'cânon' quanto a obscuridade de uma tradução literal por 'regra'.
- source_word: εἰς περισσείαν
  choice: para avançarmos ainda mais
  rationale: Comunica a direção para uma extensão maior do trabalho, de maneira idiomática em português.
theological_decisions:
- issue: Sentido de μεγαλυνθῆναι em relação à autoridade apostólica
  choice: Expansão do trabalho apostólico de Paulo entre os coríntios e para além deles
  alternative: Paulo ser mais honrado ou ter sua reputação engrandecida pelos coríntios
  rationale: O contexto trata dos limites do campo apostólico, do trabalho alheio e da expectativa de anunciar o evangelho em regiões mais distantes, não de exaltação pessoal.
- issue: Sentido de κανών
  choice: esfera atribuída de trabalho
  alternative: regra, padrão ou cânon
  rationale: Nos versículos 13–16, o termo se refere a uma área medida ou delimitada para o trabalho apostólico.
- issue: Ligação sintática de ἐν ὑμῖν
  choice: 'com μεγαλυνθῆναι: ''ampliados entre vocês'''
  alternative: 'com αὐξανομένης: ''a fé de vocês crescer entre vocês'''
  rationale: A proximidade com μεγαλυνθῆναι e o fluxo da oração favorecem essa ligação, embora a alternativa seja gramaticalmente possível e seja registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. 'Gloriamos' preserva o vocabulário recorrente do capítulo; 'esfera que nos foi atribuída' esclarece o sentido contextual sem introduzir uma estrutura eclesiástica posterior.
