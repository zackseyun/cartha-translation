  text: Τὰ κατὰ πρόσωπον βλέπετε. εἴ τις πέποιθεν ἑαυτῷ Χριστοῦ εἶναι, τοῦτο λογιζέσθω πάλιν ⸀ἐφ’ ἑαυτοῦ ὅτι καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ⸀ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/007.yaml
  text: 'You are looking at outward appearances[a]. If anyone is confident in himself that he belongs to Messiah, let him consider this again within himself: that just as he belongs to Messiah[b], so also do we.'
translation:
  language: pt
  text: 'Vocês olham para as aparências[a]. Se alguém está seguro, quanto a si mesmo, de que pertence ao Messias, considere isto de novo, consigo mesmo: assim como ele pertence ao Messias[b], nós também pertencemos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente, “Vocês olham para as coisas segundo a aparência”; também é possível entender: “Olhem para o que está diante dos olhos”.'
    reason: lexical_alternative
  - marker: b
    text: Em grego, “é do Messias”. Aqui e no restante da frase, “pertence ao Messias” explicita o sentido do genitivo.
    reason: alternative_reading
lexical_decisions:
- source_word: Τὰ κατὰ πρόσωπον
  choice: as aparências
  rationale: Expressa de modo natural o sentido provável de avaliar pelo que é exterior, sem tornar a frase excessivamente literal.
- source_word: βλέπετε
  choice: Vocês olham
  rationale: A forma pode ser indicativa ou imperativa; o contexto favorece a leitura indicativa como repreensão. A nota preserva a alternativa.
- source_word: πέποιθεν ἑαυτῷ
  choice: está convencido
  rationale: O perfeito indica uma convicção estabelecida. Em português, a construção reflexiva já comunica que a pessoa tem essa certeza a respeito de si mesma.
- source_word: Χριστοῦ εἶναι
  choice: pertence ao Messias
  rationale: O genitivo com εἶναι indica pertencimento; 'Messias' preserva Χριστός como título.
- source_word: λογιζέσθω πάλιν ἐφ’ ἑαυτοῦ
  choice: considere novamente consigo mesmo
  rationale: Mantém a força imperativa de reavaliação refletida e o caráter interior ou pessoal da consideração.
- source_word: καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ἡμεῖς
  choice: assim como ele pertence ao Messias, nós também pertencemos
  rationale: Explicita em português a elipse grega sem alterar a afirmação de igual pertencimento.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: ao Messias
  alternative: a Cristo
  rationale: Χριστός funciona como título e o texto trata de pertencer ao Ungido; 'Messias' preserva essa dimensão titular.
- issue: Natureza do pertencimento reivindicado
  choice: pertence ao Messias
  alternative: é do Messias
  rationale: A formulação expressa pertencimento sem definir além do texto se a alegação envolve identidade comunitária, lealdade, autoridade ou salvação.
translation_notes:
  register: Português moderno, claro e digno, com 'vocês' para o plural. A tradução principal adota a leitura indicativa de βλέπετε, mas a nota conserva a possível leitura imperativa. 'Consigo mesmo' preserva a introspecção sem soar arcaico.
