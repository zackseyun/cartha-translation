  text: ὅτι Αἱ ⸂ἐπιστολαὶ μέν⸃, φησίν, βαρεῖαι καὶ ἰσχυραί, ἡ δὲ παρουσία τοῦ σώματος ἀσθενὴς καὶ ὁ λόγος ἐξουθενημένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/010.yaml
  text: For they say[a], “His letters are weighty and strong, but his bodily presence is weak[b], and his speech is despised.”
translation:
  language: pt
  text: 'Pois dizem[a]: “As cartas dele são pesadas e fortes, mas sua presença física é fraca, e sua fala é desprezada[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois ele diz: ‘As cartas são pesadas e fortes...’”. O grego traz o singular “diz”, que pode funcionar como fórmula parentética de citação; no contexto, trata-se da opinião relatada dos críticos de Paulo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sua fala é considerada desprezível” ou “não tem valor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz aqui a razão ou explicação da afirmação anterior; “Pois” mantém a ligação argumentativa de modo natural.
- source_word: ἐπιστολαὶ
  choice: cartas
  rationale: É o equivalente comum e atual para correspondência escrita, sem elevar desnecessariamente o registro para “epístolas”.
- source_word: μέν ... δὲ
  choice: são ... mas
  rationale: A construção estabelece contraste, expresso naturalmente em português por “mas”.
- source_word: φησίν
  choice: dizem
  rationale: Embora a forma grega seja singular (“diz”), pode funcionar como fórmula parentética que cita uma opinião representativa; o plural explicita naturalmente a crítica atribuída aos opositores no contexto. A forma singular é preservada em nota.
- source_word: βαρεῖαι
  choice: incisivas
  rationale: No contexto retórico, indica cartas de grande peso e impacto. “Incisivas” comunica essa força em português corrente, sem sugerir peso físico.
- source_word: ἰσχυραί
  choice: vigorosas
  rationale: Expressa diretamente força e eficácia, formando com “incisivas” uma combinação natural em português.
- source_word: παρουσία τοῦ σώματος
  choice: presença física
  rationale: Refere-se à presença pessoal e corporal de Paulo, em contraste com suas cartas; “presença física” é claro e idiomático.
- source_word: ἀσθενὴς
  choice: fraca
  rationale: Mantém o equivalente lexical direto e deixa em aberto se a crítica diz respeito à aparência, à impressão pessoal ou ao desempenho presencial.
- source_word: λόγος
  choice: fala
  rationale: No contraste com as cartas e a presença física, refere-se à expressão oral ou ao modo de falar, não necessariamente ao conteúdo da mensagem.
- source_word: ἐξουθενημένος
  choice: desprezada
  rationale: O particípio indica algo tratado como sem valor ou tido em desprezo; “desprezada” preserva que se trata da avaliação dos críticos, sem afirmar inferioridade intrínseca.
theological_decisions:
- issue: A crítica relatada não deve soar como avaliação endossada pelo narrador
  choice: Introduzir a citação com “Pois dizem”
  alternative: “Pois ele diz” ou “Pois se diz”
  rationale: O contexto apresenta a opinião dos críticos de Paulo. A redação em forma de citação relatada preserva o enquadramento retórico e evita transformar a acusação em juízo do narrador.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A citação mantém o tom depreciativo dos críticos sem apresentá-lo como fato. “Incisivas e vigorosas” transmite a metáfora retórica de peso e força de modo natural; “presença física” e “fala” tornam claro o contraste entre correspondência e atuação pessoal.
