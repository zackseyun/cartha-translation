source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ἐγὼ Παῦλος παρακαλῶ ὑμᾶς διὰ τῆς πραΰτητος καὶ ἐπιεικείας τοῦ Χριστοῦ, ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν, ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/001.yaml
  text: I myself[a], Paul, appeal to you by the meekness and gentleness of Messiah—I who am humble face to face among you[c][b], but bold toward you when absent.
translation:
  language: pt
  text: Eu mesmo, Paulo, apelo a vocês pela mansidão e brandura do Messias[a] — eu que, quando estou presente entre vocês[b], sou humilde[c], mas, quando ausente, sou ousado para com vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cristo”. O termo grego Χριστός significa “Messias” e aqui funciona como título.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “segundo o rosto”; isto é, “cara a cara” ou “em pessoa”.
    reason: lexical_alternative
  - marker: c
    text: “Humilde” talvez reproduza ironicamente o que alguns diziam de Paulo quando ele estava presente; outras traduções possíveis são “modesto” ou, de modo mais interpretativo, “tímido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς δὲ ἐγὼ Παῦλος
  choice: Eu mesmo, Paulo
  rationale: Preserva a ênfase enfática do pronome e do nome explícito. O δέ marca a transição, mas não exige aqui um conectivo expresso em português.
- source_word: παρακαλῶ ὑμᾶς
  choice: apelo a vocês
  rationale: Comunica um pedido pessoal e insistente, sem transformar a fala em ordem.
- source_word: διὰ τῆς πραΰτητος καὶ ἐπιεικείας
  choice: pela mansidão e brandura
  rationale: “Pela” conserva a ideia de fundamento ou meio; “mansidão” e “brandura” mantêm as duas qualidades próximas, mas distintas, sem reduzi-las a mera fraqueza.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Χριστός funciona como título; “Messias” traduz seu sentido em vez de apenas transliterá-lo.
- source_word: κατὰ πρόσωπον
  choice: pessoalmente
  rationale: No contraste com ἀπών, a expressão idiomática indica a presença física de Paulo; “pessoalmente” é claro e natural em português.
- source_word: ταπεινὸς ἐν ὑμῖν
  choice: sou humilde entre vocês
  rationale: Mantém o sentido lexical e permite que o leitor perceba a possível ironia ou eco de uma acusação, sem impor “tímido”.
- source_word: ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς
  choice: mas, quando ausente, sou ousado para com vocês
  rationale: Reproduz o contraste retórico entre presença e ausência. “Para com vocês” preserva a direção ampla de εἰς sem acrescentar hostilidade.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: O termo é tratado como título e traduzido pelo seu sentido, preservando a identidade messiânica evocada pelo grego.
- issue: Tom da autodescrição de Paulo
  choice: humilde, com nota sobre possível ironia
  alternative: tímido ou modesto
  rationale: O texto pode ecoar uma avaliação crítica feita contra Paulo, mas não contém marca explícita de citação. A tradução mantém essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. “Vocês” evita regionalismos marcados; “pessoalmente” comunica o idioma grego com naturalidade, enquanto a nota preserva sua forma concreta.
