id: 2CO.10.17
reference: 2 Corinthians 10:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ δὲ καυχώμενος ἐν κυρίῳ καυχάσθω·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/017.yaml
  text: But the one who boasts must boast in the Lord[a].
translation:
  language: pt
  text: Mas quem se gloria, glorie-se no Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em formulação mais explícita: “Aquele que se gloria, glorie-se no Senhor”. Paulo provavelmente faz alusão a Jeremias 9:24 (9:23 na Septuaginta).'
    reason: cross_reference
lexical_decisions:
- source_word: Ὁ ... καυχώμενος
  choice: quem se gloria
  rationale: O artigo com o particípio presente substantivado indica genericamente a pessoa que se gloria. A formulação é natural em português e preserva o singular representativo.
- source_word: δὲ
  choice: Mas
  rationale: A conjunção marca aqui contraste leve com a argumentação anterior, contrapondo a vanglória imprópria ao gloriar-se legítimo.
- source_word: καυχώμενος / καυχάσθω
  choice: se gloria / glorie-se
  rationale: A repetição da mesma raiz é preservada, assim como a força exortativa do imperativo. “Gloriar-se” é corrente no registro bíblico em português, mantém a dignidade e acomoda melhor o objeto “no Senhor” do que “vangloriar-se”.
- source_word: ἐν
  choice: 'no'
  rationale: Com καυχάομαι, ἐν aponta para a esfera, base ou fundamento do gloriar-se. “No Senhor” preserva essa amplitude e corresponde à provável alusão a Jeremias.
- source_word: κυρίῳ
  choice: Senhor
  rationale: Mantém o referente sem explicitação interpretativa, permitindo a ressonância tanto da passagem de Jeremias quanto do uso paulino de κύριος.
theological_decisions:
- issue: Referente de κυρίῳ em contexto de citação ou alusão
  choice: Senhor
  alternative: Senhor Jesus; Deus
  rationale: O grego não explicita o referente além de “Senhor”. A tradução evita resolver a tensão entre a alusão veterotestamentária e o uso cristológico paulino.
- issue: Natureza do gloriar-se
  choice: glorie-se no Senhor
  alternative: orgulhe-se do Senhor; vanglorie-se no Senhor
  rationale: A formulação mantém aberta a relação semântica de ἐν — esfera, base ou fundamento — e preserva o paradoxo teológico de um gloriar-se legítimo, sem reduzi-lo a mero orgulho.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção proverbial concisa reproduz a força retórica do grego; o pronome reflexivo é colocado depois do imperativo afirmativo conforme o padrão escrito corrente.
