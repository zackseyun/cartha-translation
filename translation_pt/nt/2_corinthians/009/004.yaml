source:
  edition: SBLGNT
  text: μή πως ἐὰν ἔλθωσιν σὺν ἐμοὶ Μακεδόνες καὶ εὕρωσιν ὑμᾶς ἀπαρασκευάστους καταισχυνθῶμεν ἡμεῖς, ἵνα μὴ ⸀λέγωμεν ὑμεῖς, ἐν τῇ ὑποστάσει ⸀ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/004.yaml
  text: lest if any Macedonians come with me and find you unprepared[b][a], we—not to say you—would be put to shame in this matter of confidence.
translation:
  language: pt
  text: para que não aconteça que, se alguns macedônios vierem comigo e encontrarem vocês despreparados, nós — para não dizer vocês[a] — venhamos a ser envergonhados nessa confiança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para não mencionar vocês”. Paulo dá a entender, de modo parentético, que os próprios coríntios também ficariam envergonhados se fossem encontrados despreparados.
    reason: alternative_reading
  - marker: b
    text: Ou “nesse empreendimento” ou “nessa situação”. Aqui, a palavra grega provavelmente se refere à confiança de Paulo a respeito de vocês.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή πως ἐὰν
  choice: para que, se
  rationale: A construção expressa a preocupação preventiva de Paulo diante de uma possibilidade futura. Em português, “para que, se” preserva essa nuance de modo natural no encadeamento com o versículo anterior.
- source_word: ἔλθωσιν σὺν ἐμοὶ Μακεδόνες
  choice: alguns macedônios vierem comigo
  rationale: O substantivo sem artigo tem força indefinida e aponta para possíveis acompanhantes macedônios, sem identificar um grupo específico.
- source_word: εὕρωσιν ὑμᾶς ἀπαρασκευάστους
  choice: encontrarem vocês despreparados
  rationale: “Despreparados” reproduz diretamente a falta de prontidão dos coríntios quanto à coleta.
- source_word: καταισχυνθῶμεν
  choice: não sejamos envergonhados
  rationale: A forma passiva comunica vergonha pública ou humilhação perante outros, e não apenas um sentimento interior.
- source_word: ἡμεῖς
  choice: nós
  rationale: O pronome explícito é enfático; os travessões destacam o contraste parentético com “vocês”.
- source_word: ἵνα μὴ λέγωμεν ὑμεῖς
  choice: para não dizer vocês
  rationale: A expressão parentética atenua a afirmação ao mesmo tempo que implica que os coríntios também participariam da vergonha.
- source_word: ἐν τῇ ὑποστάσει ταύτῃ
  choice: nessa confiança
  rationale: No contexto, ὑπόστασις se refere mais provavelmente à confiança de Paulo na prontidão dos coríntios; a nota preserva outras possibilidades contextuais.
theological_decisions:
- issue: Sentido de ὑπόστασις neste contexto paulino não técnico
  choice: confiança
  alternative: empreendimento ou situação
  rationale: O contexto imediato trata da confiança manifestada por Paulo acerca da prontidão dos coríntios. A tradução evita importar o sentido filosófico ou teológico posterior de “substância”, mas registra a amplitude lexical em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” comunica naturalmente o plural de ὑμεῖς; os travessões preservam a observação parentética de Paulo. A ordem das notas segue os respectivos marcadores no texto.
