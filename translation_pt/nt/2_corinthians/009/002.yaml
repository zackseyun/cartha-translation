  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἶδα γὰρ τὴν προθυμίαν ὑμῶν ἣν ὑπὲρ ὑμῶν καυχῶμαι Μακεδόσιν ὅτι Ἀχαΐα παρεσκεύασται ἀπὸ πέρυσι, καὶ ⸀τὸ ὑμῶν ζῆλος ἠρέθισε τοὺς πλείονας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/002.yaml
  text: 'For I know your eagerness[a], which I boast about to the Macedonians on your behalf: that Achaia has been ready since last year[c][b], and your zeal has stirred up most of them.'
translation:
  language: pt
  text: 'Pois conheço a disposição de vocês[a], a respeito da qual me glorio diante dos macedônios: a Acaia está preparada desde o ano passado[b], e o zelo de vocês estimulou a maior parte deles[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «prontidão».
    reason: lexical_alternative
  - marker: b
    text: Isto é, a província da Acaia, que incluía Corinto; Paulo usa o nome da região para se referir aos cristãos que viviam nela.
    reason: cultural_note
  - marker: c
    text: Ou «a maioria deles».
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμίαν
  choice: disposição
  rationale: Expressa a prontidão interior e a boa vontade para agir, com naturalidade no português contemporâneo; a alternativa «prontidão» é preservada em nota.
- source_word: καυχῶμαι
  choice: me glorio
  rationale: Mantém a força retórica de καυχάομαι sem reduzi-la a uma simples menção elogiosa.
- source_word: ὑπὲρ ὑμῶν
  choice: por vocês
  rationale: No contexto de καυχῶμαι, indica que Paulo fala favoravelmente a respeito dos coríntios; a formulação é natural e conserva a concisão do grego.
- source_word: Μακεδόσιν
  choice: diante dos macedônios
  rationale: O dativo identifica as pessoas perante as quais Paulo se gloria; «diante dos» explicita essa relação de modo idiomático.
- source_word: Ἀχαΐα
  choice: a Acaia
  rationale: Preserva o nome da província romana e a metonímia do original, em que a região representa seus cristãos, inclusive os de Corinto.
- source_word: παρεσκεύασται
  choice: está preparada
  rationale: Comunica o estado presente resultante de preparação anterior indicado pelo perfeito, combinando naturalmente com «desde o ano passado».
- source_word: ἀπὸ πέρυσι
  choice: desde o ano passado
  rationale: É o equivalente português natural para a duração iniciada no ano anterior e ainda pertinente no presente.
- source_word: τὸ ὑμῶν ζῆλος
  choice: o zelo de vocês
  rationale: «Zelo» preserva a intensidade positiva de ζῆλος e o tom elogioso da passagem.
- source_word: ἠρέθισε
  choice: estimulou
  rationale: Neste contexto positivo, transmite a ideia de incitar ou mover outros à ação sem a conotação predominantemente negativa de «provocou».
- source_word: τοὺς πλείονας
  choice: a maior parte deles
  rationale: Expressa o grupo majoritário entre os macedônios mencionados; «deles» torna explícito o referente implícito no grego.
theological_decisions:
- issue: Referente de «Acaia»
  choice: Manter o nome geográfico como metonímia dos cristãos da região.
  alternative: Explicitar «vocês» ou «os cristãos da Acaia».
  rationale: O grego nomeia expressamente Ἀχαΐα. Preservar o topônimo mantém tanto a formulação de Paulo quanto o alcance regional de sua afirmação.
- issue: Força de καυχῶμαι
  choice: Traduzir diretamente por «me glorio».
  alternative: Suavizar como «falo com orgulho» ou «elogio».
  rationale: O verbo tem força retórica deliberada nos escritos paulinos; não há razão textual ou teológica para atenuá-la.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas correntes como «vocês». A estrutura preserva a progressão do grego, mas evita rigidez excessiva. «Acaia» mantém o referente histórico, e as notas esclarecem alternativas lexicais e a metonímia geográfica.
