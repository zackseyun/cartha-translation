reference: 2 Corinthians 9:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀναγκαῖον οὖν ἡγησάμην παρακαλέσαι τοὺς ἀδελφοὺς ἵνα προέλθωσιν ⸀εἰς ὑμᾶς καὶ προκαταρτίσωσι τὴν ⸀προεπηγγελμένην εὐλογίαν ὑμῶν, ταύτην ἑτοίμην εἶναι οὕτως ὡς εὐλογίαν καὶ μὴ ὡς πλεονεξίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/005.yaml
  text: Therefore I considered it necessary to urge the brothers to go on ahead to you and prepare in advance your previously promised blessing[c][b][a], so that it might be ready in this way as a blessing and not as greed.
translation:
  language: pt
  text: Por isso, considerei necessário pedir aos irmãos[a] que fossem adiante até vocês e preparassem com antecedência a bênção que vocês já haviam prometido[b], para que ela estivesse pronta como bênção, e não como ganância[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”, caso o grupo mencionado seja entendido de modo inclusivo.
    reason: lexical_alternative
  - marker: b
    text: “Bênção” refere-se aqui à contribuição prometida pelos coríntios; também se pode traduzir por “oferta generosa”.
    reason: lexical_alternative
  - marker: c
    text: Ou “como algo exigido por ganância”. A palavra grega significa mais literalmente “ganância” ou “cobiça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖον
  choice: necessário
  rationale: Expressa a necessidade prática percebida por Paulo sem sugerir coerção absoluta.
- source_word: ἡγησάμην
  choice: considerei
  rationale: Comunica o juízo deliberado de Paulo de modo natural e preciso.
- source_word: παρακαλέσαι
  choice: pedir
  rationale: No contexto, descreve um pedido insistente para que os irmãos ajam antes da chegada de Paulo; evita a formalidade pouco natural de 'exortar'.
- source_word: τοὺς ἀδελφοὺς
  choice: os irmãos
  rationale: Conserva a forma masculina plural do grego; a possível abrangência inclusiva é registrada em nota.
- source_word: προέλθωσιν εἰς ὑμᾶς
  choice: fossem antes de mim até vocês
  rationale: Torna explícita em português a ideia contextual de a delegação ir adiante, antes da chegada de Paulo.
- source_word: προκαταρτίσωσι
  choice: preparassem com antecedência
  rationale: Preserva tanto a noção de preparar quanto a prioridade temporal indicada pelo composto verbal.
- source_word: προεπηγγελμένην
  choice: já haviam prometido
  rationale: Indica claramente que a promessa da contribuição fora feita anteriormente.
- source_word: εὐλογίαν
  choice: bênção
  rationale: Mantém a repetição retórica de εὐλογία e o contraste deliberado com πλεονεξία; a referência concreta à contribuição é esclarecida em nota.
- source_word: ἑτοίμην εἶναι
  choice: ela estivesse pronta
  rationale: Expressa o resultado pretendido da visita antecipada e identifica naturalmente a bênção como referente.
- source_word: οὕτως ὡς εὐλογίαν
  choice: 'dessa maneira: como bênção'
  rationale: Representa οὕτως e preserva a segunda ocorrência de εὐλογία, deixando clara a maneira como a contribuição deveria estar preparada.
- source_word: πλεονεξίαν
  choice: ganância
  rationale: Conserva o sentido lexical direto e a tensão do contraste de Paulo, sem reduzir a palavra a uma paráfrase sobre relutância.
theological_decisions:
- issue: Abrangência de ἀδελφοὺς
  choice: os irmãos
  alternative: os irmãos e as irmãs
  rationale: A forma masculina do texto é mantida, sem excluir em nota a possibilidade de emprego coletivo inclusivo.
- issue: Sentido de εὐλογία no contexto da coleta
  choice: bênção
  alternative: oferta generosa
  rationale: Embora a palavra designe concretamente a contribuição prometida, 'bênção' conserva a moldura teológica e a repetição retórica do original.
- issue: Força contextual de πλεονεξία
  choice: ganância
  alternative: exação motivada pela ganância
  rationale: A tradução principal mantém o valor lexical mais direto e a ambiguidade quanto a quem manifestaria ganância; a nota oferece a leitura contextual de uma cobrança exploradora.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com uso de “vocês” para legibilidade brasileira e internacional. A estrutura foi levemente ajustada com dois-pontos para tornar natural o contraste final, sem eliminar a repetição deliberada de “bênção” nem a formulação incisiva “ganância”.
