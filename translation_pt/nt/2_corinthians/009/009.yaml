  text: (καθὼς γέγραπται· Ἐσκόρπισεν, ἔδωκεν τοῖς πένησιν, ἡ δικαιοσύνη αὐτοῦ μένει εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/009.yaml
  text: 'as it is written: “He scattered abroad[a], he gave to the poor; his righteousness remains forever.”'
translation:
  language: pt
  text: 'como está escrito:


    “Ele distribuiu, deu aos pobres;

    a sua justiça[a] permanece para sempre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “retidão”.'
    reason: Alternativa lexical para δικαιοσύνη, que pode designar justiça, retidão ou conduta justa.
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: como está escrito
  rationale: Fórmula corrente e digna para introduzir uma citação das Escrituras, com correspondência direta ao grego.
- source_word: Ἐσκόρπισεν
  choice: distribuiu
  rationale: Embora o verbo possa significar literalmente “espalhou”, neste contexto descreve a ampla distribuição de recursos aos necessitados. “Distribuiu” comunica naturalmente essa imagem em português sem exigir um objeto não expresso no grego.
- source_word: ἔδωκεν
  choice: deu
  rationale: O pretérito perfeito corresponde de modo natural ao aoristo da citação poética.
- source_word: τοῖς πένησιν
  choice: aos pobres
  rationale: Expressa diretamente pessoas de poucos recursos e é a formulação mais clara e corrente neste contexto.
- source_word: ἡ δικαιοσύνη αὐτοῦ
  choice: a sua justiça
  rationale: “Justiça” é a correspondência portuguesa tradicional e semanticamente ampla para δικαιοσύνη, podendo abranger tanto o caráter justo quanto a conduta justa demonstrada pela generosidade. A alternativa “retidão” é preservada em nota.
- source_word: μένει
  choice: permanece
  rationale: Reproduz claramente a ideia de continuidade duradoura expressa pelo presente grego.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É a expressão idiomática portuguesa para duração indefinida e permanente neste contexto.
theological_decisions:
- issue: Sentido de δικαιοσύνη na citação paulina
  choice: justiça
  alternative: retidão
  rationale: O termo pode indicar a qualidade de ser justo e também a conduta justa, especialmente a generosidade mencionada no contexto. “Justiça” preserva essa amplitude; “retidão” explicita a dimensão moral sem ser imposta ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com disposição poética para a citação. “Distribuiu” foi preferido a “espalhou” porque soa natural no contexto de dar aos pobres, mantendo a ideia de uma distribuição ampla.
