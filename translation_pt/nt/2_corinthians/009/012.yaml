id: 2CO.9.12
reference: 2 Corinthians 9:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ἡ διακονία τῆς λειτουργίας ταύτης οὐ μόνον ἐστὶν προσαναπληροῦσα τὰ ὑστερήματα τῶν ἁγίων, ἀλλὰ καὶ περισσεύουσα διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/012.yaml
  text: For the ministry of this service is not only supplying the needs of the saints[b][a], but is also overflowing in many thanksgivings to God—
translation:
  language: pt
  text: Pois o ministério deste serviço não apenas supre o que falta aos santos[a], mas também transborda por meio de muitas ações de graças a Deus—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “supre as necessidades dos santos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e preserva de modo natural a força explicativa do grego.
- source_word: ἡ διακονία τῆς λειτουργίας ταύτης
  choice: o ministério deste serviço
  rationale: Mantém a distinção entre διακονία e λειτουργία, respectivamente como “ministério” e “serviço”, sem tornar a expressão excessivamente técnica.
- source_word: προσαναπληροῦσα τὰ ὑστερήματα
  choice: supre o que falta
  rationale: Expressa com clareza a ideia de preencher uma carência; também preserva mais diretamente a formulação grega do que o simples “supre as necessidades”.
- source_word: τῶν ἁγίων
  choice: aos santos
  rationale: Preserva o termo paulino habitual para os membros do povo de Deus, sem substituí-lo por uma paráfrase interpretativa.
- source_word: περισσεύουσα
  choice: transborda
  rationale: Comunica vividamente a ideia de abundância que ultrapassa o necessário.
- source_word: διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ
  choice: em muitas ações de graças a Deus
  rationale: Em português, a construção descreve naturalmente o resultado ou a manifestação abundante do serviço, mantendo as ações de graças dirigidas a Deus.
theological_decisions:
- issue: Sentido de ἅγιοι
  choice: os santos
  alternative: o povo de Deus; os que pertencem a Deus
  rationale: “Os santos” conserva a terminologia eclesial de Paulo e, no contexto, designa os fiéis beneficiários da coleta, sem pressupor uma categoria posterior de pessoas canonizadas.
- issue: Relação expressa por διὰ πολλῶν εὐχαριστιῶν
  choice: em muitas ações de graças
  alternative: por meio de muitas ações de graças; resultando em muitas ações de graças
  rationale: A formulação principal conserva a associação entre o transbordamento do serviço e a multiplicação de agradecimentos, sem definir rigidamente se διά indica meio, manifestação ou resultado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a distinção entre “ministério” e “serviço” e conserva o travessão final, pois a frase prossegue no versículo seguinte.
