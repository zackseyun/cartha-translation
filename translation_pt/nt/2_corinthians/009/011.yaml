id: 2CO.9.11
reference: 2 Corinthians 9:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν παντὶ πλουτιζόμενοι εἰς πᾶσαν ἁπλότητα, ἥτις κατεργάζεται δι’ ἡμῶν εὐχαριστίαν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/011.yaml
  text: being enriched in every way for all generosity[a], which through us produces thanksgiving to God—
translation:
  language: pt
  text: sendo enriquecidos em tudo para toda generosidade[a], a qual, por nosso intermédio, produz ações de graças a Deus—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para toda liberalidade». Em outros contextos, ἁπλότης também pode significar «sinceridade» ou «simplicidade», mas aqui o contexto das contribuições favorece «generosidade».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντὶ
  choice: em tudo
  rationale: Expressa de modo natural a abrangência da provisão, sem restringi-la a um sentido locativo.
- source_word: πλουτιζόμενοι
  choice: sendo enriquecidos
  rationale: Preserva o particípio presente passivo e deixa Deus como agente implícito, evitando sugerir uma promessa absoluta de prosperidade.
- source_word: εἰς πᾶσαν ἁπλότητα
  choice: para toda generosidade
  rationale: O contexto da coleta favorece o sentido concreto de liberalidade no ato de contribuir; «para» comunica a finalidade ou o resultado de serem enriquecidos.
- source_word: ἥτις
  choice: a qual
  rationale: Retoma gramaticalmente «generosidade» e introduz o efeito que ela produz.
- source_word: κατεργάζεται
  choice: produz
  rationale: Comunica de forma clara que a generosidade ocasiona o resultado mencionado.
- source_word: δι’ ἡμῶν
  choice: por nosso intermédio
  rationale: Preserva a ideia de mediação ou instrumentalidade de Paulo e seus colaboradores na administração da oferta.
- source_word: εὐχαριστίαν τῷ θεῷ
  choice: ações de graças a Deus
  rationale: Formulação portuguesa natural e digna que mantém o substantivo e seu destinatário.
theological_decisions:
- issue: Sentido de ἁπλότης no contexto da coleta
  choice: generosidade no ato de contribuir
  alternative: simplicidade, sinceridade ou singeleza
  rationale: Embora o termo admita esses sentidos em outros contextos, aqui a provisão material, a coleta e as ações de graças resultantes favorecem claramente a generosidade concreta, sem excluir a integridade que pode acompanhá-la.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Sendo enriquecidos» conserva a estrutura participial do grego, enquanto «por nosso intermédio» explicita naturalmente a mediação sem acrescentar «ministério». O travessão final preserva a continuidade sintática indicada na fonte.
