source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιχορηγῶν ⸀σπόρον τῷ σπείροντι καὶ ἄρτον εἰς βρῶσιν ⸀χορηγήσει καὶ ⸀πληθυνεῖ τὸν σπόρον ὑμῶν καὶ ⸀αὐξήσει τὰ γενήματα τῆς δικαιοσύνης ὑμῶν·)
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/010.yaml
  text: The one who supplies seed to the sower and bread for food will supply and multiply your seed and increase the harvest of your righteousness[a][b].
translation:
  language: pt
  text: Aquele que fornece semente ao semeador e pão para comer fornecerá e multiplicará a semente de vocês e aumentará a colheita da justiça de vocês[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aumentará os frutos, ou a produção, da justiça de vocês”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a colheita da retidão de vocês”. O termo grego δικαιοσύνη pode significar “justiça” ou “retidão”, conforme o contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: aquele que fornece
  rationale: O particípio substantivado com ὁ identifica quem provê. “Fornece” é claro e natural, mantendo o sentido de provisão sem explicitar indevidamente a possível nuance de abundância.
- source_word: σπόρον
  choice: semente
  rationale: Preserva o sentido agrícola e a metáfora ligada ao ato de semear.
- source_word: τῷ σπείροντι
  choice: ao semeador
  rationale: Tradução concisa e idiomática do particípio substantivado, referente à pessoa que semeia.
- source_word: ἄρτον εἰς βρῶσιν
  choice: pão para alimento
  rationale: Mantém a construção de finalidade e a distinção entre a semente destinada à semeadura e o pão destinado ao consumo.
- source_word: χορηγήσει
  choice: fornecerá
  rationale: Reproduz o futuro e mantém a ligação semântica com ἐπιχορηγῶν. O “também” representa καί e articula naturalmente a afirmação futura.
- source_word: πληθυνεῖ
  choice: multiplicará
  rationale: Expressa o aumento em número ou abundância e se integra bem à imagem agrícola.
- source_word: τὸν σπόρον ὑμῶν
  choice: a semente de vocês
  rationale: Conserva a metáfora e sua abertura para a provisão material e para a capacidade dos coríntios de praticar a generosidade.
- source_word: αὐξήσει
  choice: aumentará
  rationale: Verbo natural em português para crescimento ou incremento, adequado ao objeto metafórico “colheita”.
- source_word: τὰ γενήματα
  choice: a colheita
  rationale: O plural grego designa produtos, frutos ou produção. “Colheita” comunica de modo natural o resultado agrícola coletivo e preserva a imagem do contexto.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: “Justiça” é uma tradução portuguesa natural de δικαιοσύνη e, no contexto de generosidade concreta, preserva tanto a dimensão ética quanto a relacional, sem limitar o termo a uma teoria doutrinária específica.
theological_decisions:
- issue: Sentido de “a colheita da justiça de vocês”
  choice: Metáfora para os frutos ou resultados da conduta justa e generosa dos coríntios, sem restringi-los a retorno material, posição forense ou ação social isoladamente.
  alternative: A colheita da retidão de vocês; os frutos da justiça de vocês.
  rationale: A imagem agrícola está inserida em uma exortação à generosidade. A formulação mantém a amplitude teológica da expressão e evita transformá-la em promessa automática de prosperidade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa. A ordem da frase acompanha de perto o grego, mas evita rigidez. Não se acrescenta um marcador temporal como “Agora”, pois δέ funciona aqui como conectivo e não contém esse valor lexical explícito.
