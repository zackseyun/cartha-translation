revisions:
- from: Por causa da prova dada por este serviço, eles glorificam a Deus pela submissão que acompanha a confissão de vocês ao evangelho do Messias[a] e pela generosidade da contribuição de vocês para eles e para todos.[b]
  to: Por causa da prova proporcionada por este serviço, eles glorificam a Deus pela submissão demonstrada na confissão de vocês ao evangelho do Messias[a] e pela generosidade com que vocês contribuem para eles e para todos.[b]
  rationale: A revisão conserva o sentido e a estrutura argumentativa do grego, mas substitui duas construções pouco naturais por formulações portuguesas mais claras. “Demonstrada na confissão” apresenta a submissão como evidenciada na profissão do evangelho, sem resolver além do necessário a relação genitiva. A oração “com que vocês contribuem” explicita de modo natural que a generosidade qualifica sua participação material em favor deles e de todos.
