  source_fidelity: 'A tradução transmite adequadamente o sentido central: a assistência material serve de prova e leva os destinatários a glorificar Deus pela submissão dos coríntios ao evangelho e por sua generosidade. Contudo, “prova dada por este serviço” é menos idiomático e pode sugerir que o serviço enuncia uma prova; δοκιμῆς é melhor expresso como a prova/evidência proporcionada ou demonstrada por esse serviço. A formulação de κοινωνίας como “contribuição” é contextual e defensável, mas a construção “generosidade da contribuição” soa abstrata e não representa tão claramente a generosidade no ato de compartilhar.'
  naturalness: “Submissão que acompanha a confissão” é compreensível e evita um genitivo excessivamente literal, mas “acompanha” introduz uma relação explicativa que o grego deixa mais compacta. “Submissão demonstrada na confissão” é mais natural e preserva a ligação estreita sem atribuir submissão à própria confissão. “Generosidade com que vocês contribuem” é mais fluente do que “generosidade da contribuição de vocês”.
  terminology: “Serviço”, “glorificam a Deus”, “submissão”, “evangelho do Messias” e “generosidade” são escolhas adequadas. “Messias” preserva o valor titular de Χριστός, e a nota registra legitimamente a alternativa tradicional “Cristo”. A nota sobre “contribuição” deve acompanhar a formulação revista, esclarecendo que κοινωνία conserva a noção de partilha/participação.
