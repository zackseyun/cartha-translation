  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τῆς δοκιμῆς τῆς διακονίας ταύτης δοξάζοντες τὸν θεὸν ἐπὶ τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ ἁπλότητι τῆς κοινωνίας εἰς αὐτοὺς καὶ εἰς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/013.yaml
  text: Because of the proof provided by this ministry[a], they glorify God for the obedience of your confession to the gospel of the Messiah and for the generosity of your sharing with them and with everyone[d][c][b],
translation:
  language: pt
  text: Por causa da prova proporcionada por este serviço, eles glorificam a Deus pela submissão demonstrada na confissão de vocês ao evangelho do Messias[a] e pela generosidade com que vocês contribuem para eles e para todos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “evangelho de Cristo”. O termo grego Χριστός é traduzido no texto como o título “Messias”.
    reason: alternative_reading
  - marker: b
    text: O termo aqui expresso como “contribuem” também pode significar “partilham”, “participam” ou “têm comunhão”; neste contexto, aponta especialmente para a participação material na coleta.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκιμῆς
  choice: prova
  rationale: No contexto, o serviço da coleta oferece evidência concreta da fé e do amor dos coríntios; “prova” preserva o resultado demonstrado, sem enfatizar apenas o processo de teste.
- source_word: διακονίας
  choice: serviço
  rationale: Refere-se ao auxílio material organizado por Paulo. “Serviço” é natural em português e conserva tanto a ação prática quanto sua dimensão religiosa.
- source_word: δοξάζοντες τὸν θεὸν
  choice: eles glorificam a Deus
  rationale: O particípio é expresso como oração finita para dar clareza ao longo período; “glorificam” corresponde de perto a δοξάζοντες.
- source_word: ὑποταγῇ τῆς ὁμολογίας ὑμῶν
  choice: pela submissão que acompanha a confissão de vocês
  rationale: A formulação mantém a relação estreita entre submissão e confissão, mas evita a expressão pouco natural “submissão da confissão”. “Acompanha” explicita com moderação que a submissão se manifesta junto da confissão professada.
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: ao evangelho do Messias
  rationale: “Ao” preserva a orientação da submissão/confissão para o evangelho. Χριστός é traduzido como o título “Messias”, mantendo sua força messiânica.
- source_word: ἁπλότητι
  choice: generosidade
  rationale: No contexto da coleta, designa liberalidade e disposição aberta para dar, e não apenas simplicidade ou sinceridade.
- source_word: κοινωνίας
  choice: contribuição
  rationale: Embora o termo possa significar comunhão ou participação, neste contexto aponta concretamente para a participação material na oferta; “contribuição” torna esse referente claro sem excluir a ideia de participação conjunta.
- source_word: εἰς αὐτοὺς καὶ εἰς πάντας
  choice: para eles e para todos
  rationale: A repetição de εἰς indica os destinatários ou a direção da contribuição; “para” é idiomático e preciso em português.
theological_decisions:
- issue: Tradução de Χριστοῦ em εὐαγγέλιον τοῦ Χριστοῦ
  choice: evangelho do Messias
  alternative: evangelho de Cristo
  rationale: Χριστός conserva aqui valor titular. “Messias” comunica o significado do título sem acrescentar conteúdo doutrinário; a forma tradicional é registrada em nota.
- issue: Relação entre submissão e confissão em ὑποταγῇ τῆς ὁμολογίας
  choice: submissão que acompanha a confissão
  alternative: submissão da confissão
  rationale: O genitivo grego admite uma formulação mais formal e ambígua. A redação principal evita sugerir que a própria confissão seja o agente que se submete, sem separar a conduta obediente da profissão do evangelho.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa do plural. A redação busca equivalência ótima: mantém a estrutura argumentativa e os termos teológicos do grego, mas evita construções excessivamente rígidas. Os marcadores [a] e [b] aparecem no texto principal.'
