  text: ⸀χάρις τῷ θεῷ ἐπὶ τῇ ἀνεκδιηγήτῳ αὐτοῦ δωρεᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/015.yaml
  text: Thanks be to God for his indescribable gift[a].
translation:
  language: pt
  text: Graças a Deus por seu dom indescritível[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dom inexprimível”. O adjetivo grego indica algo que não pode ser plenamente descrito ou narrado.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: Graças
  rationale: Na construção exclamativa com τῷ θεῷ, χάρις expressa agradecimento ou louvor. “Graças a Deus” é a formulação idiomática e digna em português.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: O dativo indica aquele a quem se dirige o agradecimento e integra naturalmente a expressão “Graças a Deus”.
- source_word: ἐπὶ
  choice: por
  rationale: Com o dativo, assinala a causa ou o fundamento da ação de graças; “por” é conciso e natural em português.
- source_word: ἀνεκδιηγήτῳ
  choice: indescritível
  rationale: O adjetivo caracteriza algo que não pode ser plenamente narrado ou expresso. “Indescritível” comunica isso em linguagem corrente sem tom arcaico.
- source_word: αὐτοῦ
  choice: seu
  rationale: O pronome retoma Deus. “Seu” preserva a forma pronominal grega e permanece claro nesta frase breve.
- source_word: δωρεᾷ
  choice: dom
  rationale: δωρεά designa algo concedido gratuitamente. “Dom” é natural no registro bíblico moderno e mantém o foco na dádiva divina sem acrescentar explicações.
theological_decisions:
- issue: Referente de “seu dom indescritível”
  choice: Mantido implícito como o dom de Deus, sem identificar na tradução se é especificamente Cristo, a salvação em Cristo ou, de modo mais amplo, a graça de Deus manifestada no contexto da generosidade.
  alternative: Explicitar “Cristo”, “a salvação” ou “a graça que produz generosidade”.
  rationale: O versículo diz apenas “seu dom indescritível”. Embora Cristo seja central em uma interpretação cristã histórica, o contexto imediato também trata da graça de Deus que produz generosidade. Manter a expressão aberta preserva a amplitude e a tensão do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A exclamação preserva a força doxológica da frase nominal grega; “dom” mantém um registro bíblico digno sem obscuridade.
