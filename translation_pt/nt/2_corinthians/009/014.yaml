    issue: «Enquanto oram» explicita uma relação temporal.
    rationale: δεήσει é um substantivo no dativo; a construção pode indicar o âmbito ou a expressão da ação, mas não requer que a oração seja apresentada como ação simultânea por meio de «enquanto».
  - severity: medium
    issue: «Sentem profunda saudade» restringe ἐπιποθούντων.
    rationale: O verbo grego expressa anseio ou desejo intenso; «saudade» sugere mais especificamente a falta causada pela separação ou ausência. «Anseiam» preserva melhor a amplitude do original.
