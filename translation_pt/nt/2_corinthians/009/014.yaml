  text: and in their prayer for you[a], they long for you because of the surpassing grace of God upon you.
translation:
  language: pt
  text: e, em suas orações por vocês, anseiam por vocês por causa da graça extraordinária de Deus sobre vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέησις
  choice: oram
  rationale: O substantivo no dativo descreve o âmbito ou modo em que se manifesta o anseio. A forma verbal torna a construção natural em português, mantendo o sentido de oração intercessória.
- source_word: αὐτῶν
  choice: '[sujeito implícito de «oram»]'
  rationale: O genitivo plural retoma os beneficiários da oferta mencionados no contexto. Em português, o sujeito pode ficar implícito sem perder a referência contextual.
- source_word: ὑπὲρ ὑμῶν
  choice: por vocês
  rationale: Com o genitivo, ὑπέρ indica oração em favor de alguém; «por vocês» é a expressão idiomática e clara.
- source_word: ἐπιποθούντων
  choice: sentem profunda saudade de vocês
  rationale: O particípio expressa um desejo afetivo intenso e contínuo. «Sentem profunda saudade» comunica esse anseio relacional em português corrente e digno.
- source_word: διὰ
  choice: por causa de
  rationale: Com acusativo, διά tem aqui valor causal, indicando o motivo do anseio.
- source_word: ὑπερβάλλουσαν
  choice: extraordinária
  rationale: Preserva a ideia de algo que excede a medida comum, com formulação natural em português.
- source_word: χάριν
  choice: graça
  rationale: Mantém o termo paulino consagrado para o favor gracioso e a atuação capacitadora de Deus.
- source_word: ἐφ’ ὑμῖν
  choice: sobre vocês
  rationale: Conserva a imagem da graça de Deus repousando ou atuando sobre os destinatários, sem restringir indevidamente o sentido.
- source_word: καὶ
  choice: e
  rationale: Mantém o vínculo coordenativo com a sequência do versículo anterior.
theological_decisions:
- issue: Relação sintática entre a oração e o anseio
  choice: A oração fornece o contexto em que os beneficiários da oferta manifestam seu profundo anseio pelos coríntios.
  alternative: A oração pode ser entendida mais especificamente como o meio pelo qual esse anseio é expresso.
  rationale: A construção grega é condensada. «Enquanto oram» preserva simultaneamente as duas ações e evita decidir além do texto se a oração é apenas o âmbito ou propriamente o meio do anseio.
translation_notes:
  register: Português moderno, amplamente internacional, com legibilidade brasileira. «Vocês» evita a rigidez de «vós»; «profunda saudade» expressa de modo natural o forte afeto de ἐπιποθέω. A construção foi desdobrada para clareza sem acrescentar conteúdo doutrinário.
