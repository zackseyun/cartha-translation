  text: Τοῦτο δέ, ὁ σπείρων φειδομένως φειδομένως καὶ θερίσει, καὶ ὁ σπείρων ἐπ’ εὐλογίαις ἐπ’ εὐλογίαις καὶ θερίσει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/006.yaml
  text: 'This: the one who sows sparingly will also reap sparingly[a], and the one who sows with blessings will also reap with blessings.'
translation:
  language: pt
  text: 'O ponto é este: quem semeia com parcimônia também colherá com parcimônia, e quem semeia com bênçãos[a] também colherá com bênçãos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “generosamente” ou “com fartura”. O grego emprega o substantivo “bênçãos”, que, neste contexto, também pode indicar uma medida generosa ou abundante.
    reason: alternativa lexical
lexical_decisions:
- source_word: Τοῦτο δέ
  choice: 'O ponto é este:'
  rationale: Expressa de modo natural a introdução enfática de um princípio. O valor conectivo de δέ é tratado como transição discursiva, sem lhe impor necessariamente sentido adversativo.
- source_word: ὁ σπείρων
  choice: quem semeia
  rationale: Reproduz o valor genérico e proverbial do particípio substantivado em português corrente.
- source_word: φειδομένως
  choice: com parcimônia
  rationale: Indica medida restrita ou escassa sem acrescentar a censura moral mais forte de termos como “mesquinhamente”.
- source_word: καὶ θερίσει
  choice: também colherá
  rationale: Mantém a correspondência entre o modo de semear e o resultado da colheita, bem como o paralelismo das duas orações.
- source_word: ἐπ’ εὐλογίαις
  choice: com bênçãos
  rationale: Conserva o substantivo grego “bênçãos” e sua repetição, preservando tanto a imagem de generosidade quanto a ressonância teológica da bênção.
theological_decisions:
- issue: Sentido de εὐλογίαις no provérbio sobre semear e colher
  choice: Traduzir pelo sentido lexical “bênçãos”, conservando a mesma expressão na semeadura e na colheita.
  alternative: Traduzir idiomaticamente por “generosamente”, “com fartura” ou “em abundância”.
  rationale: No contexto, o termo pode indicar generosidade ou abundância, mas o substantivo grego mantém a linguagem de bênção. Preservá-lo evita reduzir a frase a mera quantidade e não transforma o provérbio em promessa automática de enriquecimento material.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Com parcimônia” preserva o tom proverbial; “com bênçãos” mantém deliberadamente a formulação incomum e a ambiguidade significativa do grego, esclarecida em nota.
