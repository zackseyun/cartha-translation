id: 2CO.9.3
reference: 2 Corinthians 9:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔπεμψα δὲ τοὺς ἀδελφούς, ἵνα μὴ τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν κενωθῇ ἐν τῷ μέρει τούτῳ, ἵνα καθὼς ἔλεγον παρεσκευασμένοι ἦτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/003.yaml
  text: But I sent the brothers[a], so that our boasting about you might not be emptied in this matter, so that, just as I was saying, you may be prepared[b],
translation:
  language: pt
  text: Mas enviei os irmãos para que, neste assunto, o orgulho que temos de vocês não se mostre vazio e para que, como eu vinha dizendo, vocês estejam preparados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεμψα
  choice: enviei
  rationale: O aoristo indicativo é adequadamente expresso pelo pretérito perfeito simples neste contexto explicativo.
- source_word: τοὺς ἀδελφούς
  choice: os irmãos
  rationale: O plural masculino refere-se provavelmente aos delegados específicos mencionados no contexto; a forma tradicional continua natural em português.
- source_word: τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν
  choice: o orgulho que temos de vocês
  rationale: καύχημα indica aquilo de que alguém se gloria ou se orgulha; esta formulação comunica naturalmente que Paulo falava dos coríntios com orgulho, sem reduzi-lo apenas a confiança.
- source_word: κενωθῇ
  choice: não se mostre vazio
  rationale: Preserva a imagem lexical de vazio e expressa, em português natural, que a declaração orgulhosa de Paulo não deveria revelar-se sem fundamento.
- source_word: ἐν τῷ μέρει τούτῳ
  choice: neste assunto
  rationale: μέρος tem aqui sentido idiomático de aspecto, questão ou assunto, não de parte física.
- source_word: καθὼς ἔλεγον
  choice: como eu vinha dizendo
  rationale: A locução com 'vinha' preserva o aspecto durativo ou reiterado do imperfeito ἔλεγον.
- source_word: παρεσκευασμένοι ἦτε
  choice: vocês estejam preparados
  rationale: A construção perifrástica indica o estado resultante de prontidão pretendido pela oração de finalidade; o subjuntivo é natural depois de 'para que'.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição grega de ἵνα foi representada por duas coordenações de finalidade ('para que... e para que...'), mantendo a estrutura lógica sem rigidez excessiva.
