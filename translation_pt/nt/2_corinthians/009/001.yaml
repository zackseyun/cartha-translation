  text: Περὶ μὲν γὰρ τῆς διακονίας τῆς εἰς τοὺς ἁγίους περισσόν μοί ἐστιν τὸ γράφειν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/001.yaml
  text: For concerning the ministry to the saints[a], it is superfluous for me to write to you,
translation:
  language: pt
  text: Quanto ao serviço em favor dos santos[a], é desnecessário que eu lhes escreva,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dirigido aos santos». A preposição grega pode indicar direção ou benefício neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ μὲν γὰρ
  choice: Quanto a
  rationale: Περὶ introduz o assunto, enquanto μὲν γὰρ liga a frase ao contexto anterior. Em português, «Quanto a» marca naturalmente a transição sem reproduzir de modo artificial cada partícula grega.
- source_word: διακονίας
  choice: serviço
  rationale: διακονία aqui se refere ao auxílio organizado destinado aos cristãos necessitados. «Serviço» conserva a dignidade da atividade e é mais claro no português corrente do que «ministério» neste contexto.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: em favor dos santos
  rationale: εἰς pode expressar direção ou benefício. «Em favor dos santos» comunica naturalmente a destinação do serviço, enquanto a nota preserva a alternativa direcional.
- source_word: ἁγίους
  choice: santos
  rationale: «Santos» corresponde ao termo paulino usual para os que foram separados para Deus e preserva sua formulação concisa e tradicional.
- source_word: περισσόν
  choice: desnecessário
  rationale: Neste contexto, περισσόν indica algo redundante ou dispensável. «Desnecessário» transmite com clareza a força retórica sem recorrer ao menos corrente «supérfluo».
- source_word: μοί ἐστιν τὸ γράφειν ὑμῖν
  choice: é desnecessário que eu lhes escreva
  rationale: A construção com infinitivo articular é vertida por uma oração natural em português, preservando o agente e os destinatários.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Serviço» evita que «ministério» seja entendido apenas como cargo eclesiástico; «santos» preserva a terminologia paulina. A vírgula final acompanha a continuidade sintática do versículo no contexto.
