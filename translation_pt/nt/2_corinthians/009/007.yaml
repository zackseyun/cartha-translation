base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/007.yaml
  text: Each one should give as he has decided in his heart[a], not out of grief or compulsion[b], for God loves a cheerful giver.
translation:
  language: pt
  text: Cada pessoa dê conforme decidiu em seu coração, não por tristeza[a] nem por obrigação, pois Deus ama quem dá com alegria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não com relutância”. Literalmente, “não por tristeza” ou “por pesar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: Cada pessoa
  rationale: Preserva o foco distributivo em cada indivíduo e deixa claro o sentido genericamente humano do masculino gramatical grego, sem transformar o singular em plural.
- source_word: καθὼς προῄρηται τῇ καρδίᾳ
  choice: conforme decidiu em seu coração
  rationale: Expressa uma decisão pessoal e deliberada já tomada. “Coração” preserva a linguagem antropológica bíblica como centro interior da intenção e da vontade.
- source_word: μὴ ἐκ λύπης
  choice: não com tristeza
  rationale: Mantém o sentido lexical direto de λύπη, “tristeza” ou “pesar”, enquanto a nota registra a implicação contextual de relutância.
- source_word: ἢ ἐξ ἀνάγκης
  choice: nem por obrigação
  rationale: No contexto da contribuição, comunica de modo natural a ideia de necessidade imposta, pressão ou compulsão.
- source_word: ἱλαρὸν ... δότην
  choice: quem dá com alegria
  rationale: Formulação idiomática em português que conserva tanto a pessoa que dá quanto sua disposição alegre, evitando o pouco natural “doador alegre”.
- source_word: ἀγαπᾷ ὁ θεός
  choice: Deus ama
  rationale: Preserva diretamente o verbo “amar” e o sujeito explícito do texto grego.
theological_decisions:
- issue: Gênero gramatical de ἕκαστος
  choice: Cada pessoa
  alternative: Cada um
  rationale: O masculino singular grego é representativo e não limita a instrução aos homens. “Cada pessoa” mantém a individualidade singular sem introduzir exclusividade masculina.
- issue: Sentido de λύπη no contexto da contribuição
  choice: não com tristeza
  alternative: não com relutância
  rationale: A tradução principal conserva a força lexical de tristeza ou pesar; a nota apresenta a interpretação contextual comum sem substituir silenciosamente a imagem do original.
- issue: Forma verbal implícita para a contribuição
  choice: dê
  alternative: deve dar
  rationale: O verbo é suprido pelo contexto imediato. O subjuntivo com valor exortativo é conciso e natural, sem tornar a orientação mais legalista do que o grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita pronomes marcados por gênero, mantém o singular distributivo e preserva “coração” e “tristeza” como imagens do texto-fonte.
