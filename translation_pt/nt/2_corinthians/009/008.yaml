reference: 2 Corinthians 9:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀δυνατεῖ δὲ ὁ θεὸς πᾶσαν χάριν περισσεῦσαι εἰς ὑμᾶς, ἵνα ἐν παντὶ πάντοτε πᾶσαν αὐτάρκειαν ἔχοντες περισσεύητε εἰς πᾶν ἔργον ἀγαθόν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/008.yaml
  text: And God is able to make all grace abound to you[a], so that in everything, at all times, having all sufficiency, you may abound in every good work.
translation:
  language: pt
  text: E Deus é capaz de fazer abundar sobre vocês toda a graça, para que, em tudo e em todo o tempo, tendo tudo de que necessitam[a], vocês abundem em toda boa obra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo plena suficiência”. O termo grego pode indicar suficiência, recursos adequados ou contentamento; aqui se refere à provisão adequada que vem de Deus, não a uma autossuficiência independente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατεῖ
  choice: é capaz
  rationale: Expressa de modo natural a capacidade e o poder de Deus, preservando a ênfase do presente indicativo.
- source_word: δὲ
  choice: E
  rationale: Aqui funciona como conexão leve com o contexto anterior, sem contraste forte.
- source_word: πᾶσαν χάριν
  choice: toda a graça
  rationale: Preserva a amplitude de χάρις como provisão graciosa de Deus, sem reduzi-la apenas a recursos materiais.
- source_word: περισσεῦσαι εἰς ὑμᾶς
  choice: fazer abundar sobre vocês
  rationale: Mantém o sentido causativo e a direção da graça para os destinatários; “sobre” comunica de forma natural essa abundância.
- source_word: ἵνα
  choice: para que
  rationale: Conserva a força de propósito ou resultado da oração grega.
- source_word: ἐν παντὶ πάντοτε
  choice: em tudo e em todo o tempo
  rationale: Reproduz explicitamente a repetição enfática dos termos com παν-.
- source_word: πᾶσαν αὐτάρκειαν
  choice: tudo de que necessitam
  rationale: No contexto, indica provisão adequada recebida de Deus, e não autossuficiência independente; esta formulação é clara em português corrente.
- source_word: ἔχοντες
  choice: tendo
  rationale: Preserva a relação circunstancial do particípio com o verbo principal.
- source_word: περισσεύητε
  choice: vocês abundem
  rationale: Retém a repetição do campo semântico de abundância presente em περισσεῦσαι e περισσεύητε.
- source_word: εἰς πᾶν ἔργον ἀγαθόν
  choice: em toda boa obra
  rationale: É idiomático depois de “abundar” e preserva a abrangência de πᾶν.
theological_decisions:
- issue: Sentido de χάρις no contexto da generosidade
  choice: graça como provisão graciosa de Deus em sentido amplo, incluindo capacitação material para a generosidade
  alternative: favor gracioso apenas; dom
  rationale: O contexto envolve recursos para dar, mas χάρις permanece mais amplo que dinheiro ou provisão material.
- issue: Sentido de αὐτάρκεια
  choice: provisão adequada, isto é, ter tudo de que se necessita
  alternative: contentamento; autossuficiência
  rationale: A suficiência aqui procede de Deus e habilita para boas obras; a tradução evita sugerir autonomia filosófica ou independência de Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a acumulação retórica de expressões de totalidade e a repetição do verbo “abundar”, ao mesmo tempo que esclarece αὐτάρκεια no corpo do texto e registra a alternativa mais formal em nota.
