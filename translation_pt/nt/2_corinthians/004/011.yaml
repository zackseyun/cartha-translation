id: 2CO.4.11
reference: 2 Corinthians 4:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀεὶ γὰρ ἡμεῖς οἱ ζῶντες εἰς θάνατον παραδιδόμεθα διὰ Ἰησοῦν, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ φανερωθῇ ἐν τῇ θνητῇ σαρκὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/011.yaml
  text: For we who are living are always being handed over to death for Jesus’ sake[b][a], so that the life of Jesus also may be revealed in our mortal flesh.
translation:
  language: pt
  text: Pois nós, os que vivemos, somos sempre entregues à morte por causa de Jesus[a], para que também a vida de Jesus se manifeste em nossa carne mortal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por amor de Jesus” ou “por Jesus”.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “carne” se refere à existência corporal mortal, não à “natureza pecaminosa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀεὶ
  choice: sempre
  rationale: Expressa a circunstância constante ou repetida da exposição à morte e corresponde diretamente ao advérbio grego.
- source_word: γάρ
  choice: Pois
  rationale: Mantém a ligação explicativa com o versículo anterior sem tornar a relação mais específica do que o grego.
- source_word: ἡμεῖς οἱ ζῶντες
  choice: nós, os que vivemos
  rationale: Conserva a forma substantivada do particípio presente e o contraste deliberado entre os vivos e a morte.
- source_word: εἰς θάνατον
  choice: à morte
  rationale: 'Com o verbo παραδιδόμεθα, indica destino ou resultado: são entregues para enfrentar a morte.'
- source_word: παραδιδόμεθα
  choice: somos sempre entregues
  rationale: A voz passiva e o presente indicam uma ação continuamente sofrida; 'somos entregues' preserva tanto a passividade quanto a ressonância de perseguição.
- source_word: διὰ Ἰησοῦν
  choice: por causa de Jesus
  rationale: διά com acusativo normalmente exprime causa ou motivo. A formulação preserva a relação causal sem decidir se a ênfase recai na perseguição motivada por Jesus ou no sofrimento suportado em favor dele.
- source_word: ἵνα
  choice: para que
  rationale: Expressa naturalmente em português a finalidade ou o resultado pretendido, preservando a abertura semântica da construção grega.
- source_word: καὶ
  choice: também
  rationale: Mantém a correspondência entre a entrega à morte por causa de Jesus e a manifestação da vida de Jesus.
- source_word: ἡ ζωὴ τοῦ Ἰησοῦ
  choice: a vida de Jesus
  rationale: Preserva a construção genitiva e o contraste teológico e retórico entre morte e vida.
- source_word: φανερωθῇ
  choice: se manifeste
  rationale: Reproduz de modo natural a forma passiva do subjuntivo após ἵνα, sem acrescentar um agente explícito.
- source_word: ἐν τῇ θνητῇ σαρκὶ ἡμῶν
  choice: em nossa carne mortal
  rationale: Mantém o termo concreto σάρξ e o singular coletivo do grego; 'mortal' deixa claro que se trata da existência corporal vulnerável à morte.
theological_decisions:
- issue: Sentido de σάρξ no contexto paulino
  choice: carne mortal
  alternative: corpo mortal; natureza pecaminosa
  rationale: Neste contexto, σάρξ designa a existência corporal sujeita à morte, e não uma inclinação ética ao pecado. 'Carne mortal' preserva a palavra escolhida por Paulo e evita a interpretação inadequada 'natureza pecaminosa'.
- issue: Valor de διὰ Ἰησοῦν
  choice: por causa de Jesus
  alternative: por amor de Jesus; por Jesus
  rationale: A preposição διά com acusativo favorece causa ou motivo. A tradução principal preserva esse valor; a nota registra formulações possíveis que podem enfatizar sofrimento em favor de Jesus sem impor essa nuance ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi mantida próxima ao grego quando natural. 'Nós, os que vivemos' conserva a ênfase explícita de ἡμεῖς e o contraste com a morte; 'carne mortal' mantém a imagem paulina, esclarecida por nota.
