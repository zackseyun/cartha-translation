  text: εἰ δὲ καὶ ἔστιν κεκαλυμμένον τὸ εὐαγγέλιον ἡμῶν, ἐν τοῖς ἀπολλυμένοις ἐστὶν κεκαλυμμένον,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/003.yaml
  text: And even if our gospel is veiled[a], it is veiled among those who are perishing,
translation:
  language: pt
  text: E, mesmo que o nosso evangelho esteja velado, ele está velado para os que estão perecendo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre os que estão perecendo” ou “para os perdidos”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: εἰ δὲ καὶ
  choice: E, mesmo que
  rationale: Expressa naturalmente a força condicional-concessiva; «e» mantém a continuidade discursiva de δέ, enquanto «mesmo» representa o valor intensificador de καί.
- source_word: κεκαλυμμένον
  choice: encoberto
  rationale: Preserva a metáfora do véu/encobrimento desenvolvida no contexto imediato (3:14–16; 4:4), sem reduzi-la ao sentido mais genérico de «oculto».
- source_word: τὸ εὐαγγέλιον ἡμῶν
  choice: o nosso evangelho
  rationale: Mantém explicitamente o possessivo ἡμῶν e emprega «evangelho», termo corrente e conciso em português para εὐαγγέλιον.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: entre os que estão perecendo
  rationale: «Entre» representa ἐν com sentido de esfera ou grupo, e «estão perecendo» conserva o aspecto processual do particípio presente ἀπολλυμένοις.
- source_word: ἐστὶν κεκαλυμμένον
  choice: é ... que ele está encoberto
  rationale: Mantém a repetição enfática do predicado grego e explicita com «ele» a referência ao evangelho; a construção focalizadora produz português natural sem acrescentar a ideia interpretativa de permanência.
theological_decisions:
- issue: Natureza de ἀπολλυμένοις no contexto soteriológico paulino
  choice: os que estão perecendo
  alternative: os perdidos
  rationale: A formulação escolhida conserva a condição ou processo em curso indicado pelo particípio e preserva a tensão teológica, sem convertê-lo prematuramente num rótulo estático.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «encoberto» reproduz a ênfase do original, e «evangelho» preserva o vocabulário paulino tradicional sem soar arcaico.
