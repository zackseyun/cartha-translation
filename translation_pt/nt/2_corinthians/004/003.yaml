- from: E, mesmo que o nosso evangelho esteja encoberto, é entre os que estão perecendo que ele está encoberto[a].
  to: E, mesmo que o nosso evangelho esteja velado, ele está velado para os que estão perecendo[a].
  rationale: A revisão substitui «encoberto» por «velado» para conservar a metáfora contextual do original. Também simplifica a segunda oração, sem eliminar a repetição enfática de κεκαλυμμένον. «Para os que estão perecendo» é uma tradução natural de ἐν τοῖς ἀπολλυμένοις neste uso e a nota preserva «entre» como alternativa mais próxima da preposição, além de registrar «perdidos» como leitura lexical possível.
