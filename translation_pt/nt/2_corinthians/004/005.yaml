id: 2CO.4.5
reference: 2 Corinthians 4:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ γὰρ ἑαυτοὺς κηρύσσομεν ἀλλὰ ⸂Χριστὸν Ἰησοῦν⸃ κύριον, ἑαυτοὺς δὲ δούλους ὑμῶν διὰ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/005.yaml
  text: For we do not proclaim ourselves[a], but Messiah Jesus as Lord[c][b], and ourselves as your slaves for Jesus' sake.
translation:
  language: pt
  text: Pois não proclamamos a nós mesmos, mas a Jesus, o Messias[a], como Senhor; e a nós mesmos como escravos[b] de vocês, por causa de Jesus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cristo Jesus”. O grego Χριστός pode ser traduzido por “Cristo” quando funciona de modo semelhante a um nome; aqui foi entendido como o título “Messias”.
    reason: lexical_alternative
  - marker: b
    text: Ou “servos” ou “servidores”. O termo grego δοῦλοι pode designar servos ou escravos; “escravos” preserva aqui o sentido mais forte de subordinação, em contraste com Jesus como Senhor.
    reason: lexical_alternative
  - marker: c
    text: Ou “por amor a Jesus”. A expressão grega indica a causa ou o motivo dessa condição em relação aos coríntios.
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσομεν
  choice: proclamamos
  rationale: Preserva a ideia de anunciar publicamente, sem limitar o sentido à pregação formal de um sermão.
- source_word: ἑαυτοὺς
  choice: a nós mesmos
  rationale: 'Mantém a repetição enfática e o contraste: os mensageiros não são o conteúdo da proclamação, mas se apresentam como subordinados aos coríntios.'
- source_word: Χριστὸν Ἰησοῦν
  choice: a Jesus, o Messias
  rationale: Expressa Χριστός como título e reorganiza a expressão de modo natural em português, sem perder a identificação de Jesus como o Messias.
- source_word: κύριον
  choice: como Senhor
  rationale: 'Entende κύριον em função predicativa: Jesus é proclamado como Senhor.'
- source_word: δούλους
  choice: escravos
  rationale: Conserva a força de subordinação de δοῦλος e o contraste deliberado entre Jesus como Senhor e os apóstolos como escravos dos destinatários.
- source_word: ὑμῶν
  choice: de vocês
  rationale: Representa naturalmente o genitivo relacional depois de δοῦλος e oferece leitura clara tanto no Brasil quanto em outras variedades modernas do português.
- source_word: διὰ Ἰησοῦν
  choice: por causa de Jesus
  rationale: 'διά com acusativo indica aqui causa, razão ou motivo: essa condição de escravos em relação aos coríntios decorre de Jesus.'
theological_decisions:
- issue: Χριστός como título ou elemento semelhante a nome próprio
  choice: Jesus, o Messias
  alternative: Cristo Jesus
  rationale: Neste contexto, Χριστός mantém força titular naquilo que é proclamado sobre Jesus; a formulação escolhida torna essa força explícita em português.
- issue: Função de κύριον em Χριστὸν Ἰησοῦν κύριον
  choice: Jesus, o Messias, como Senhor
  alternative: Cristo Jesus, o Senhor
  rationale: A construção predicativa apresenta o senhorio de Jesus como conteúdo da proclamação, sem acrescentar um verbo finito ausente do grego.
- issue: Força de δοῦλος na relação dos apóstolos com os coríntios
  choice: escravos de vocês
  alternative: servos de vocês
  rationale: A opção mais forte preserva a autodepreciação apostólica e o contraste com Jesus como Senhor, sem transformar essa relação em uma afirmação social além da metáfora do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para clareza internacional e brasileira. A ordem foi levemente ajustada para apresentar Χριστός como título de modo idiomático. O paralelismo de “a nós mesmos” foi mantido, assim como a força deliberada de “escravos”.
