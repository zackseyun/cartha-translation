source:
  edition: SBLGNT
  text: τὸ γὰρ παραυτίκα ἐλαφρὸν τῆς θλίψεως ⸀ἡμῶν καθ’ ὑπερβολὴν εἰς ὑπερβολὴν αἰώνιον βάρος δόξης κατεργάζεται ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/017.yaml
  text: For our momentary light affliction is producing for us an eternal weight of glory beyond all comparison,[a]
translation:
  language: pt
  text: Pois esta nossa aflição leve e momentânea produz para nós um peso eterno de glória, muito além de toda medida,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «em grau extraordinariamente excedente». O grego diz literalmente: «segundo excesso para excesso», expressão que indica uma medida extraordinária.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραυτίκα
  choice: momentânea
  rationale: Expressa o caráter presente e passageiro da aflição e mantém o contraste direto com «eterno».
- source_word: ἐλαφρὸν
  choice: leve
  rationale: Preserva a antítese retórica entre a aflição «leve» e o «peso» da glória.
- source_word: θλίψεως
  choice: aflição
  rationale: Comunica pressão, angústia e sofrimento sem acrescentar conotações escatológicas que não são exigidas pelo termo.
- source_word: ἡμῶν
  choice: nossa
  rationale: Mantém a relação possessiva explícita no grego.
- source_word: καθ’ ὑπερβολὴν εἰς ὑπερβολὴν
  choice: muito além de toda medida
  rationale: Reproduz em português natural a intensificação extraordinária da expressão grega, sem a tornar uma comparação explícita demais.
- source_word: αἰώνιον
  choice: eterno
  rationale: É o equivalente natural no contraste entre a brevidade presente da aflição e a duração da glória.
- source_word: βάρος
  choice: peso
  rationale: Conserva a imagem deliberada e seu contraste com «leve»; «fardo» sugeriria algo opressivo.
- source_word: δόξης
  choice: de glória
  rationale: Mantém o genitivo e a expressão densa «peso de glória», sem reduzi-la ao adjetivo «glorioso».
- source_word: κατεργάζεται
  choice: produz
  rationale: Expressa a causação eficaz do presente verbal de maneira clara e natural.
- source_word: ἡμῖν
  choice: para nós
  rationale: Interpreta o dativo como benefício, preservando, porém, a referência aos destinatários da glória.
- source_word: τὸ ... ἐλαφρὸν τῆς θλίψεως ἡμῶν
  choice: esta nossa aflição leve e momentânea
  rationale: Reorganiza a construção grega em ordem portuguesa natural, conservando a referência definida, a posse, a leveza e a brevidade.
theological_decisions:
- issue: Natureza da glória produzida pela aflição
  choice: A aflição presente resulta em glória eterna para os fiéis, sem declarar que o sofrimento conquista a salvação por mérito.
  alternative: A aflição merece a glória; ou produz apenas maturidade espiritual no presente.
  rationale: O contraste entre o momentâneo e o eterno aponta para um resultado escatológico. «Produz para nós» conserva a forte relação expressa pelo verbo sem acrescentar uma teoria de mérito nem limitar o resultado à formação interior presente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação preserva as antíteses «leve/peso» e «momentânea/eterno». O intensificador foi traduzido idiomaticamente, e sua forma incomum no grego foi registrada em nota.
