reference: 2 Corinthians 4:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ὁ θεὸς ὁ εἰπών· Ἐκ σκότους φῶς ⸀λάμψει, ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν πρὸς φωτισμὸν τῆς γνώσεως τῆς δόξης τοῦ θεοῦ ἐν προσώπῳ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/006.yaml
  text: For God[a], who said[c][b], “Light will shine out of darkness,” has shone in our hearts for the illumination of the knowledge of the glory of God in the face of Messiah.
translation:
  language: pt
  text: 'Pois Deus, que disse: “Das trevas brilhará a luz”[a], brilhou em nossos corações, para a iluminação do conhecimento da glória de Deus na face do Messias[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A declaração evoca Gênesis 1:3 e aplica a imagem da luz da criação à obra reveladora de Deus.
    reason: cross_reference
  - marker: b
    text: 'Grego: “na face de Cristo”. A expressão também pode ser entendida de modo mais idiomático como “na pessoa de Cristo”; “face” preserva a imagem concreta da glória divina que se torna visível.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: A conjunção apresenta a razão da afirmação anterior; “Pois” preserva de modo natural a ligação argumentativa.
- source_word: ὁ θεὸς ὁ εἰπών
  choice: Deus, que disse
  rationale: A construção com particípio articular é expressa naturalmente por uma oração relativa, sem perder a identificação enfática de Deus como aquele que falou.
- source_word: Ἐκ σκότους φῶς λάμψει
  choice: Das trevas brilhará a luz
  rationale: Mantém o futuro de λάμψει, a força de procedência de ἐκ e a ordem marcada da frase grega, em português corrente e solene.
- source_word: ὃς ἔλαμψεν
  choice: brilhou
  rationale: Preserva o uso intransitivo de λάμπω e a correspondência verbal com “brilhará”, sem introduzir uma paráfrase causativa.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: em nosso coração
  rationale: “Coração” conserva a metáfora bíblica da interioridade. O singular coletivo é idiomático em português e representa a experiência compartilhada dos falantes.
- source_word: πρὸς φωτισμὸν
  choice: para a iluminação
  rationale: Reproduz diretamente a finalidade expressa por πρός e o substantivo abstrato φωτισμός, preservando a formulação compacta de Paulo.
- source_word: τῆς γνώσεως τῆς δόξης τοῦ θεοῦ
  choice: do conhecimento da glória de Deus
  rationale: Conserva a cadeia de genitivos e sua densidade teológica, sem decidir além do que a sintaxe explicita.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: na face do Messias
  rationale: “Face” retém o sentido concreto de πρόσωπον e se harmoniza com as imagens de luz e glória; “Messias” traduz Χριστός como título.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: Neste contexto, Χριστός funciona como título daquele em cuja face se revela a glória divina. “Messias” torna o título explícito sem acrescentar uma interpretação denominacional.
- issue: Sentido de ἐν προσώπῳ Χριστοῦ
  choice: na face do Messias
  alternative: na pessoa de Cristo
  rationale: A tradução concreta preserva a imagem visual formada por luz, brilho e glória. A leitura idiomática “na pessoa de” continua possível e é registrada em nota, sem substituir silenciosamente a imagem do texto.
- issue: Relação de φωτισμός com γνώσεως
  choice: para a iluminação do conhecimento
  alternative: para dar a luz do conhecimento
  rationale: A formulação nominal conserva a compactação e a possível tensão semântica do grego, evitando explicar se a iluminação consiste no conhecimento ou o produz.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém-se a estrutura densa de Paulo onde ela permanece inteligível. “Messias” traduz o título Χριστός; a nota oferece a forma tradicional “Cristo” e registra a ambiguidade de πρόσωπον.
