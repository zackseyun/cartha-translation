reference: 2 Corinthians 4:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἔχομεν δὲ τὸν θησαυρὸν τοῦτον ἐν ὀστρακίνοις σκεύεσιν, ἵνα ἡ ὑπερβολὴ τῆς δυνάμεως ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/007.yaml
  text: But we have this treasure in clay jars[b][a], so that the surpassing greatness of the power may be of God and not from us.
translation:
  language: pt
  text: Mas temos este tesouro em vasos de barro[a], para que o poder extraordinário seja de Deus, e não venha de nós.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «recipientes de barro».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχομεν δὲ
  choice: Mas temos
  rationale: O presente do indicativo expressa posse atual, e «mas» conserva o contraste ou a transição marcada por δέ no contexto.
- source_word: τὸν θησαυρὸν τοῦτον
  choice: este tesouro
  rationale: Mantém o substantivo metafórico e o demonstrativo que remete ao que Paulo acaba de descrever.
- source_word: ἐν ὀστρακίνοις σκεύεσιν
  choice: em vasos de barro
  rationale: ὀστράκινος designa algo feito de barro ou cerâmica, e σκεῦος, um recipiente. «Vasos de barro» é uma expressão clara e corrente que preserva a imagem de fragilidade e pouco valor.
- source_word: ἵνα
  choice: para que
  rationale: Expressa naturalmente a nuance de propósito, sem excluir a ideia de resultado.
- source_word: ἡ ὑπερβολὴ τῆς δυνάμεως
  choice: o poder extraordinário
  rationale: A formulação portuguesa comunica o grau excepcional expresso por ὑπερβολή sem recorrer à construção pouco natural «a extraordinariedade do poder».
- source_word: ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν
  choice: seja de Deus, e não venha de nós
  rationale: «Seja de Deus» reflete o genitivo τοῦ θεοῦ; «não venha de nós» torna explícita em português a ideia de origem indicada por ἐξ, preservando o contraste entre Deus e os mensageiros.
theological_decisions:
- issue: Identidade do «tesouro» e sentido dos «vasos de barro»
  choice: Manter ambas as imagens sem explicar no texto principal o tesouro como evangelho nem os vasos como corpos ou fraqueza humana.
  alternative: Expandir para «o tesouro do evangelho» e «nossos corpos frágeis».
  rationale: O contexto orienta a interpretação, mas o versículo conserva a linguagem metafórica. Explicá-la no texto traduzido eliminaria uma abertura presente no grego.
- issue: Relação expressa pela oração com ἵνα
  choice: Traduzir com «para que», conservando a nuance de propósito sem impedir uma leitura de resultado.
  alternative: 'Traduzir exclusivamente como resultado: «de modo que».'
  rationale: A construção admite proximidade entre propósito e resultado; «para que» mantém a forma mais direta sem resolver indevidamente essa tensão.
- issue: Origem divina do poder
  choice: Conservar o contraste entre o poder ser «de Deus» e não vir «de nós».
  alternative: Parafrasear como «para mostrar que somente Deus opera».
  rationale: A paráfrase acrescentaria a ideia explícita de demonstração e a exclusividade marcada por «somente», elementos não formulados dessa maneira no texto grego.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. «Vasos de barro» preserva a imagem bíblica tradicional sem soar arcaico; «poder extraordinário» comunica de modo natural a intensidade de ὑπερβολή.
