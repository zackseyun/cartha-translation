  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν οἷς ὁ θεὸς τοῦ αἰῶνος τούτου ἐτύφλωσεν τὰ νοήματα τῶν ἀπίστων εἰς τὸ μὴ ⸀αὐγάσαι τὸν φωτισμὸν τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ, ὅς ἐστιν εἰκὼν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/004.yaml
  text: In their case[a], the god of this age has blinded the minds of the unbelieving, so that the light of the gospel of the glory of Messiah, who is the image of God[c][b], might not shine on them.
translation:
  language: pt
  text: No caso deles, o deus desta era cegou as mentes dos que não creem, para que a luz do evangelho da glória do Messias não brilhasse sobre eles[a], o qual é a imagem de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que não vejam a luz do evangelho da glória do Messias”. O verbo grego, raro, pode enfatizar tanto o brilho da luz quanto a percepção dela pelas pessoas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: No caso deles
  rationale: Retoma de modo idiomático as pessoas que perecem, mencionadas no contexto anterior, sem sugerir habitação interior.
- source_word: ὁ θεὸς τοῦ αἰῶνος τούτου
  choice: o deus desta era
  rationale: “Era” corresponde mais precisamente a αἰών e destaca a presente ordem caída, não o mundo criado; a inicial minúscula evita identificar esse referente com o Deus verdadeiro.
- source_word: ἐτύφλωσεν τὰ νοήματα τῶν ἀπίστων
  choice: cegou a mente dos que não creem
  rationale: O aoristo é expresso naturalmente pelo pretérito perfeito; “mente” comunica a faculdade de compreensão, e “os que não creem” preserva o sentido substantivado de ἀπίστων.
- source_word: εἰς τὸ μὴ αὐγάσαι
  choice: para que não lhes brilhe
  rationale: Expressa propósito ou resultado e toma a luz como aquilo que brilha sobre as pessoas; a ambiguidade do verbo raro é preservada em nota.
- source_word: τὸν φωτισμὸν τοῦ εὐαγγελίου
  choice: a luz do evangelho
  rationale: “Luz” transmite de forma clara e natural a metáfora de φωτισμός, enquanto “evangelho” mantém o sentido estabelecido de εὐαγγέλιον.
- source_word: τῆς δόξης τοῦ Χριστοῦ
  choice: da glória do Messias
  rationale: Mantém a cadeia de genitivos e traduz Χριστός como título, “Messias”, em vez de tratá-lo apenas como nome próprio.
- source_word: ὅς ἐστιν εἰκὼν τοῦ θεοῦ
  choice: que é a imagem de Deus
  rationale: Preserva diretamente a afirmação cristológica e a ressonância paulina de εἰκών, sem expansão doutrinária.
theological_decisions:
- issue: Referente de “o deus desta era”
  choice: Conservar a expressão do texto, com “deus” em minúscula
  alternative: Substituir explicitamente por “Satanás” ou entender como um sistema impessoal
  rationale: A expressão aponta naturalmente para um poder maligno pessoal, tradicionalmente identificado com Satanás, mas o texto não o nomeia; a tradução evita tanto acrescentar o nome quanto reduzir o referente a uma abstração.
- issue: Função de αὐγάσαι com φωτισμός
  choice: A luz do evangelho não brilha sobre os que não creem
  alternative: Os que não creem não veem ou percebem a luz do evangelho
  rationale: O verbo é raro e admite as duas orientações. A leitura principal coordena naturalmente o verbo com “luz”, enquanto a nota registra a alternativa perceptiva.
- issue: Sentido cristológico de “imagem de Deus”
  choice: Preservar a identificação direta do Messias como imagem de Deus
  alternative: Acrescentar explicação ontológica ou doutrinária
  rationale: A formulação grega é teologicamente densa, mas deve permanecer sem terminologia posterior que não esteja no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “No caso deles” é idiomático; “desta era” conserva a distinção em relação ao mundo criado; “Messias” mantém o valor titular de Χριστός. A ordem foi levemente ajustada para que o português permaneça natural sem eliminar a estrutura teológica do grego.
