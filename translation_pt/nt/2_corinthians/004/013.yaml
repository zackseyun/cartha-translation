id: 2CO.4.13
reference: 2 Corinthians 4:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἔχοντες δὲ τὸ αὐτὸ πνεῦμα τῆς πίστεως, κατὰ τὸ γεγραμμένον· Ἐπίστευσα, διὸ ἐλάλησα, καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/013.yaml
  text: But having the same spirit of faith[a], according to what is written, “I believed; therefore I spoke,” we also believe; therefore we also speak[b],
translation:
  language: pt
  text: 'Mas, tendo o mesmo espírito de fé[a], conforme está escrito: “Cri; por isso falei”, nós também cremos; por isso também falamos[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o mesmo Espírito de fé”, caso πνεῦμα seja entendido como referência ao Espírito Santo, e não a uma disposição compartilhada, marcada pela fé.'
    reason: alternative_reading
  - marker: b
    text: Paulo cita o Salmo 116:10 (115:1 na Septuaginta), associando sua própria fé e sua fala ao testemunho do salmista.
    reason: cross_reference
lexical_decisions:
- source_word: Ἔχοντες δὲ
  choice: Mas, tendo
  rationale: Mantém a construção participial e o desenvolvimento levemente contrastivo marcado por δέ, sem tornar explícita uma relação causal que o grego apenas pode sugerir.
- source_word: τὸ αὐτὸ πνεῦμα τῆς πίστεως
  choice: o mesmo espírito de fé
  rationale: Conserva a formulação e a ambiguidade do grego. A inicial minúscula favorece, no texto principal, a ideia de disposição compartilhada caracterizada pela fé, sem excluir por nota uma possível referência ao Espírito Santo.
- source_word: κατὰ τὸ γεγραμμένον
  choice: conforme está escrito
  rationale: É uma fórmula natural e digna em português para introduzir uma citação das Escrituras, preservando o sentido de conformidade com o que foi escrito.
- source_word: Ἐπίστευσα, διὸ ἐλάλησα
  choice: Cri; por isso falei
  rationale: Traduz diretamente os aoristos e preserva a relação lógica expressa por διό. “Cri” é a forma portuguesa concisa e natural de crer no pretérito perfeito.
- source_word: καὶ ἡμεῖς πιστεύομεν
  choice: nós também cremos
  rationale: O pronome expresso mantém a ênfase de ἡμεῖς, e “também” marca a correspondência entre Paulo e o salmista.
- source_word: διὸ καὶ λαλοῦμεν
  choice: por isso também falamos
  rationale: Preserva a inferência de διό e o paralelismo retórico entre crer e falar.
theological_decisions:
- issue: Se πνεῦμα se refere ao Espírito Santo ou a um espírito/disposição compartilhada de fé
  choice: espírito de fé, entendido no texto principal como disposição ou impulso compartilhado marcado pela fé
  alternative: Espírito de fé, como referência ao Espírito Santo
  rationale: A ligação imediata com “Cri; por isso falei” favorece a ideia de uma disposição de fé semelhante à do salmista. Contudo, o grego não elimina a leitura referente ao Espírito Santo; por isso, a alternativa é preservada em nota.
- issue: Tradução do grupo lexical πιστ-
  choice: fé / cri / cremos
  alternative: confiança / confiei / confiamos
  rationale: A escolha mantém em português a relação lexical e conceitual entre πίστις e πιστεύω tanto quanto o idioma permite, com linguagem bíblica corrente e natural.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação é digna e acessível; conserva o fluxo participial, o paralelismo da frase e a ambiguidade teológica real de πνεῦμα.
