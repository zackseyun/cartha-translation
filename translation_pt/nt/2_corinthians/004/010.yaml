  text: πάντοτε τὴν νέκρωσιν ⸀τοῦ Ἰησοῦ ἐν τῷ σώματι περιφέροντες, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ ἐν τῷ σώματι ἡμῶν φανερωθῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/010.yaml
  text: always carrying in the body the death of Jesus[a], so that the life of Jesus may also be revealed in our body.
translation:
  language: pt
  text: levando sempre no corpo a morte de Jesus[a], para que também a vida de Jesus se manifeste em nosso corpo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o morrer de Jesus». O substantivo grego pode enfatizar a condição ou a experiência de morte levada no corpo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: sempre
  rationale: Expressa de modo natural e conciso a circunstância contínua indicada pelo advérbio.
- source_word: νέκρωσιν
  choice: morte
  rationale: Preserva o sentido de morte ou condição de morte e mantém o paralelismo direto com «a vida de Jesus»; a alternativa «processo de morrer» é registrada em nota.
- source_word: τοῦ Ἰησοῦ
  choice: de Jesus
  rationale: Mantém a relação genitiva sem especificar além do texto se é a morte sofrida por Jesus ou a morte associada à participação em seus sofrimentos.
- source_word: ἐν τῷ σώματι
  choice: no corpo
  rationale: Conserva a ausência de possessivo na primeira ocorrência e o singular do grego.
- source_word: περιφέροντες
  choice: levando
  rationale: Comunica de forma idiomática o ato contínuo de portar corporalmente essa morte.
- source_word: ἵνα
  choice: para que
  rationale: Expressa adequadamente a relação de propósito ou resultado sem eliminá-la.
- source_word: καὶ
  choice: também
  rationale: Mantém a correspondência entre a morte e a vida de Jesus.
- source_word: ζωὴ
  choice: vida
  rationale: Equivalente direto e natural, aqui ligado à vida de Jesus manifestada nos apóstolos.
- source_word: ἐν τῷ σώματι ἡμῶν
  choice: em nosso corpo
  rationale: Preserva o singular grego acompanhado do possessivo plural, mantendo a formulação corporal e coletiva de Paulo.
- source_word: φανερωθῇ
  choice: se manifeste
  rationale: Traduz com naturalidade o passivo subjuntivo e ressalta que a vida de Jesus se torna perceptível, sem indicar explicitamente o agente.
theological_decisions:
- issue: Sentido de νέκρωσις em relação a Jesus
  choice: morte de Jesus
  alternative: processo de morrer de Jesus
  rationale: «Morte» corresponde ao sentido lexical e reforça o paralelo com «vida», enquanto a nota preserva a possível ênfase na experiência ou no processo de morrer.
- issue: Número de σώμα
  choice: 'manter o singular: «corpo» nas duas ocorrências'
  alternative: usar o plural «nossos corpos» na segunda ocorrência
  rationale: O grego emprega o singular nas duas frases. Mantê-lo conserva a retórica do versículo e sua possível dimensão coletiva sem resolver essa nuance interpretativamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Levando» evita a rigidez de «portando», e «se manifeste» é mais corrente do que «seja manifestada», sem perder a voz passiva do sentido.
