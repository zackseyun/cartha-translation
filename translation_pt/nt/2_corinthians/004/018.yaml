id: 2CO.4.18
reference: 2 Corinthians 4:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ σκοπούντων ἡμῶν τὰ βλεπόμενα ἀλλὰ τὰ μὴ βλεπόμενα, τὰ γὰρ βλεπόμενα πρόσκαιρα, τὰ δὲ μὴ βλεπόμενα αἰώνια.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/018.yaml
  text: as we look not to the things that are seen but to the things that are not seen. For the things that are seen are temporary[a], but the things that are not seen are eternal.
translation:
  language: pt
  text: enquanto não fixamos a atenção nas coisas que se veem, mas nas que não se veem. Pois as coisas que se veem são passageiras[a], mas as que não se veem são eternas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “temporárias”. Também é possível traduzir as expressões paralelas como “o que se vê… o que não se vê” ou “as coisas visíveis… as coisas invisíveis”.
    reason: Registra alternativas lexicais e estruturais legítimas para πρόσκαιρα e para os particípios substantivados, sem alterar o contraste central.
lexical_decisions:
- source_word: σκοπούντων
  choice: fixamos a atenção
  rationale: O particípio presente de σκοπέω indica dirigir a atenção ou consideração para algo. A formulação preserva a ideia de foco sem reduzir o verbo ao ato físico de olhar; “enquanto” exprime naturalmente seu valor circunstancial e mantém a ligação com o contexto anterior.
- source_word: μὴ
  choice: não
  rationale: É a negação simples do particípio, sem a nuance temporal de “já não”.
- source_word: τὰ βλεπόμενα
  choice: as coisas que se veem
  rationale: O particípio presente articular neutro plural funciona como substantivo. Esta tradução preserva a concretude e o paralelismo com τὰ μὴ βλεπόμενα.
- source_word: ἀλλὰ
  choice: mas
  rationale: Marca a oposição direta entre os dois objetos da atenção.
- source_word: τὰ μὴ βλεπόμενα
  choice: as que não se veem
  rationale: Mantém a estrutura relativa e a simetria com a expressão anterior; a elipse de “coisas” é natural em português e não altera o sentido.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação que fundamenta a afirmação precedente e conserva a progressão argumentativa de Paulo.
- source_word: πρόσκαιρα
  choice: passageiras
  rationale: Designa aquilo que dura por tempo limitado. “Passageiras” forma um contraste claro e idiomático com “eternas”, sem intensificar o termo para “momentâneas”.
- source_word: δέ
  choice: mas
  rationale: Assinala o segundo membro da antítese.
- source_word: αἰώνια
  choice: eternas
  rationale: Neste contraste paulino com πρόσκαιρα, refere-se ao que perdura e pertence à realidade futura; “eternas” é a tradução natural e contextual.
- source_word: ἡμῶν
  choice: nós, expresso na desinência de “fixamos”
  rationale: Embora formalmente genitivo e ligado ao particípio, funciona como seu sujeito. Em português, o sujeito fica naturalmente indicado pela forma verbal.
theological_decisions:
- issue: Contraste entre o que é visto e o que não é visto
  choice: Manter a linguagem concreta de “coisas que se veem” e “as que não se veem”.
  alternative: “coisas visíveis ... coisas invisíveis” ou “coisas materiais ... coisas espirituais”
  rationale: Paulo contrapõe realidades vistas e não vistas, mas não as define explicitamente por categorias filosóficas como material e espiritual. A tradução preserva essa tensão sem acrescentar uma distinção doutrinária ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Fixamos a atenção” comunica o sentido de σκοπέω com naturalidade; “se veem” mantém a voz e o paralelismo do grego. A frase começa em minúscula porque o particípio depende sintaticamente do contexto precedente.
