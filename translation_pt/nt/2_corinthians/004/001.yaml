  text: Διὰ τοῦτο, ἔχοντες τὴν διακονίαν ταύτην καθὼς ἠλεήθημεν, οὐκ ⸀ἐγκακοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/001.yaml
  text: Therefore, since we have this ministry, just as we have received mercy, we do not lose heart.
translation:
  language: pt
  text: Por isso, visto que temos este ministério, assim como recebemos misericórdia, não desanimamos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural a inferência que liga o versículo ao argumento anterior.
- source_word: τὴν διακονίαν ταύτην
  choice: este ministério
  rationale: Mantém o demonstrativo e o sentido de serviço ou encargo ministerial no contexto apostólico.
- source_word: καθὼς ἠλεήθημεν
  choice: assim como recebemos misericórdia
  rationale: Preserva a comparação introduzida por καθὼς e traduz o passivo de ἐλεέω de forma idiomática, sem explicitar o agente.
- source_word: οὐκ ἐγκακοῦμεν
  choice: não desanimamos
  rationale: Comunica o sentido de não perder o ânimo ou não desistir, em português corrente e digno.
theological_decisions:
- issue: Relação entre o ministério e a misericórdia recebida
  choice: Manter “assim como”, sem especificar além do texto a natureza exata da relação.
  alternative: “porque recebemos misericórdia”
  rationale: καθὼς é comparativo e pode também sugerir correspondência circunstancial; a tradução conserva essa tensão sem reduzi-la explicitamente a uma relação causal.
- issue: Agente da misericórdia
  choice: 'Preservar a construção passiva: “recebemos misericórdia”.'
  alternative: “Deus teve misericórdia de nós”
  rationale: Embora Deus seja o agente implícito no contexto teológico, o grego não o nomeia neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha de perto a progressão do grego sem soar artificial.
