id: 2CO.4.15
reference: 2 Corinthians 4:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὰ γὰρ πάντα δι’ ὑμᾶς, ἵνα ἡ χάρις πλεονάσασα διὰ τῶν πλειόνων τὴν εὐχαριστίαν περισσεύσῃ εἰς τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/015.yaml
  text: For all things are for your sake[a], so that as grace increases through more and more people, thanksgiving may overflow to the glory of God.
translation:
  language: pt
  text: Pois tudo é em favor de vocês, a fim de que a graça, multiplicando-se por meio de um número cada vez maior de pessoas[a], faça transbordar a ação de graças para a glória de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio dos muitos” ou “por meio de um número maior de pessoas”. A expressão grega pode se referir tanto a muitas pessoas em geral quanto a um número crescente de pessoas.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ γὰρ πάντα
  choice: Pois tudo isso
  rationale: “Pois” mantém a função explicativa de γάρ. “Tudo isso” expressa o conjunto abrangente indicado pelo neutro plural com artigo e, no contexto, remete naturalmente ao que Paulo acaba de descrever.
- source_word: δι’ ὑμᾶς
  choice: é para o bem de vocês
  rationale: διά com o acusativo indica benefício. A formulação comunica isso com clareza e evita que “por causa de vocês” seja entendida apenas como causa.
- source_word: ἵνα
  choice: a fim de que
  rationale: Conserva o valor de finalidade ou resultado da oração grega em linguagem portuguesa natural e digna.
- source_word: ἡ χάρις
  choice: a graça
  rationale: Mantém o termo teologicamente amplo, sem restringi-lo à graça salvadora nem apenas ao favor manifestado no ministério de Paulo.
- source_word: πλεονάσασα
  choice: multiplicando-se
  rationale: Reproduz a ideia de crescimento ou aumento do particípio aoristo, ligando-a de modo natural à ação principal.
- source_word: διὰ τῶν πλειόνων
  choice: por meio de um número cada vez maior de pessoas
  rationale: Preserva a força instrumental de διά e representa o comparativo substantivado como um número crescente de pessoas, sem ocultar a possibilidade de entendê-lo simplesmente como “os muitos”.
- source_word: τὴν εὐχαριστίαν περισσεύσῃ
  choice: faça transbordar a ação de graças
  rationale: Mantém “a graça” como sujeito e “a ação de graças” como objeto, de acordo com os casos gregos, e traduz a forma transitiva de περισσεύω com a imagem vívida de abundância.
- source_word: εἰς τὴν δόξαν τοῦ θεοῦ
  choice: para a glória de Deus
  rationale: Expressa o alvo ou resultado indicado por εἰς de maneira idiomática em português.
theological_decisions:
- issue: Referente e atuação da “graça” na oração de finalidade
  choice: Conservar “a graça” como a realidade divina que se multiplica por meio de mais pessoas e produz abundante ação de graças.
  alternative: Entender especificamente a graça salvadora como alcançando mais destinatários, ou o favor gracioso de Deus como atuando no ministério apostólico.
  rationale: O texto não exige que se escolha entre esses sentidos mais específicos; a tradução preserva a amplitude e a tensão da formulação paulina.
- issue: Relação sintática entre graça e ação de graças
  choice: Traduzir “a graça” como sujeito que faz a “ação de graças” transbordar.
  alternative: Reformular a frase de modo que “a ação de graças” pareça ser o sujeito que transborda à medida que a graça aumenta.
  rationale: No grego, ἡ χάρις está no nominativo e τὴν εὐχαριστίαν no acusativo; a construção transitiva preserva essa relação sem eliminar a conexão teológica entre a graça recebida e a gratidão oferecida a Deus.
translation_notes:
  register: Português moderno, claro e reverente, com ampla legibilidade brasileira. “Vocês” oferece naturalidade contemporânea; “ação de graças” preserva o vocabulário bíblico reconhecível. A sintaxe foi ajustada para soar natural sem apagar a relação gramatical do original.
