id: 2CO.4.14
reference: 2 Corinthians 4:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ὁ ἐγείρας ⸀τὸν Ἰησοῦν καὶ ἡμᾶς ⸀σὺν Ἰησοῦ ἐγερεῖ καὶ παραστήσει σὺν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/014.yaml
  text: because we know that the one who raised Jesus will also raise us with Jesus and will present us with you[a].
translation:
  language: pt
  text: porque sabemos que aquele que ressuscitou Jesus[a] também nos ressuscitará com Jesus e nos apresentará com vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “o Senhor Jesus” em vez de “Jesus”.
    reason: textual_variant
lexical_decisions:
- source_word: εἰδότες
  choice: porque sabemos
  rationale: O particípio expressa a razão da perseverança mencionada no contexto; a construção causal é clara e natural em português.
- source_word: ὁ ἐγείρας
  choice: aquele que ressuscitou
  rationale: Preserva a construção participial substantivada e identifica Deus sem acrescentar ao texto um sujeito explícito.
- source_word: τὸν Ἰησοῦν
  choice: Jesus
  rationale: Segue diretamente o texto principal da SBLGNT; a leitura mais longa é registrada em nota.
- source_word: καὶ ἡμᾶς
  choice: também nos ressuscitará
  rationale: Conserva a força aditiva de καί e a ligação entre a ressurreição de Jesus e a futura ressurreição dos que creem.
- source_word: σὺν Ἰησοῦ
  choice: com Jesus
  rationale: σύν com o dativo indica associação; esta tradução evita introduzir uma ideia instrumental não expressa.
- source_word: παραστήσει
  choice: nos apresentará
  rationale: Mantém o sentido de fazer comparecer ou apresentar, sem especificar além do grego o cenário escatológico.
- source_word: σὺν ὑμῖν
  choice: com vocês
  rationale: Expressa naturalmente a associação coletiva entre Paulo e os coríntios; 'vocês' oferece ampla legibilidade brasileira.
theological_decisions:
- issue: Variante textual depois de ἐγείρας
  choice: Jesus no texto principal
  alternative: o Senhor Jesus
  rationale: A redação principal segue a SBLGNT, enquanto a leitura mais longa, bem atestada, é preservada em nota. A diferença é textual e não altera a afirmação central sobre a ressurreição.
- issue: Força escatológica de παραστήσει
  choice: nos apresentará
  alternative: nos fará comparecer diante dele
  rationale: O futuro e o contexto apontam para uma apresentação escatológica conjunta, mas o complemento implícito não deve ser explicitado de modo a resolver além do texto perante quem ou em qual cenário preciso ocorrerá.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A repetição de “Jesus” foi mantida por refletir a formulação grega e preservar a associação expressa por σύν.
