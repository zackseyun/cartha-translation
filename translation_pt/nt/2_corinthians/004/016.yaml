  text: Διὸ οὐκ ⸀ἐγκακοῦμεν, ἀλλ’ εἰ καὶ ὁ ἔξω ἡμῶν ἄνθρωπος διαφθείρεται, ἀλλ’ ὁ ⸂ἔσω ἡμῶν⸃ ἀνακαινοῦται ἡμέρᾳ καὶ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/016.yaml
  text: Therefore we do not lose heart. But even if our outer man is wasting away[a], yet our inner man is being renewed day by day.
translation:
  language: pt
  text: Por isso, não desanimamos. Mas, mesmo que o nosso ser exterior esteja se desgastando[a], ainda assim o nosso ser interior é renovado dia após dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente, “o nosso homem exterior”; na segunda expressão, “homem” está subentendido: “o nosso [homem] interior”. No grego, “homem” representa o ser humano e estabelece um contraste deliberado entre a vida exterior e a interior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Por isso
  rationale: Expressa de modo natural a conclusão inferida do argumento anterior.
- source_word: οὐκ ἐγκακοῦμεν
  choice: não desanimamos
  rationale: Comunica a ideia de não perder a coragem nem ceder ao desalento, com linguagem atual e digna.
- source_word: ἀλλ’ εἰ καὶ
  choice: Ainda que
  rationale: Preserva o valor concessivo da construção, que reconhece como real o processo descrito a seguir.
- source_word: ὁ ἔξω ἡμῶν ἄνθρωπος
  choice: o nosso ser exterior
  rationale: Reproduz de forma natural em português o contraste antropológico deliberado, sem restringir o referente ao sexo masculino nem impor uma antropologia técnica.
- source_word: διαφθείρεται
  choice: esteja se desgastando
  rationale: Representa o processo contínuo de deterioração expresso pelo presente passivo, sem sugerir aniquilação imediata.
- source_word: ὁ ἔσω ἡμῶν
  choice: o nosso ser interior
  rationale: Mantém o paralelismo lexical e conceitual com “ser exterior”; o substantivo ἄνθρωπος está subentendido no grego.
- source_word: ἀνακαινοῦται
  choice: se renova
  rationale: Expressa uma renovação contínua recebida pelo sujeito; em português, a forma pronominal é natural e não exige identificar explicitamente o agente.
- source_word: ἡμέρᾳ καὶ ἡμέρᾳ
  choice: dia após dia
  rationale: Equivalente idiomático que preserva a recorrência distributiva e contínua da expressão grega.
theological_decisions:
- issue: Contraste entre ὁ ἔξω ἄνθρωπος e ὁ ἔσω
  choice: ser exterior / ser interior
  alternative: homem exterior / homem interior; pessoa exterior / pessoa interior
  rationale: A tradução conserva o contraste entre a dimensão exterior que se deteriora e a vida interior que é renovada, sem transformar o verso numa definição técnica da relação entre corpo e alma. A nota registra a forma mais literal do idioma paulino.
- issue: Agente da renovação
  choice: Não explicitado
  alternative: Deus renova o nosso ser interior
  rationale: O passivo grego não nomeia o agente neste versículo; explicitá-lo no texto resolveria algo que a formulação original deixa implícito.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ser exterior” e “ser interior” evitam a estranheza de “pessoa exterior” e o possível sentido exclusivamente masculino de “homem”, enquanto a nota preserva a forma literal e o paralelismo do grego.
