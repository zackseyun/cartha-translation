id: 2CO.4.2
reference: 2 Corinthians 4:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ ἀπειπάμεθα τὰ κρυπτὰ τῆς αἰσχύνης, μὴ περιπατοῦντες ἐν πανουργίᾳ μηδὲ δολοῦντες τὸν λόγον τοῦ θεοῦ, ἀλλὰ τῇ φανερώσει τῆς ἀληθείας ⸀συνιστάνοντες ἑαυτοὺς πρὸς πᾶσαν συνείδησιν ἀνθρώπων ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/002.yaml
  text: Instead[a], we have renounced the hidden things of shame, not walking in cunning nor falsifying the word of God[b], but by the open display of the truth commending ourselves to every human conscience before God.
translation:
  language: pt
  text: Pelo contrário, renunciamos às práticas ocultas e vergonhosas. Não agimos com astúcia nem adulteramos a palavra de Deus[a]; antes, mediante a manifestação pública da verdade[b], nós nos recomendamos à consciência de todas as pessoas, diante de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falsificamos a palavra de Deus”. O verbo grego pode indicar corromper algo por meio de manipulação enganosa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ao tornar manifesta a verdade”. A expressão grega destaca que a verdade é trazida à luz, sem limitar isso apenas à proclamação verbal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειπάμεθα
  choice: renunciamos
  rationale: Expressa uma rejeição decidida e é natural em português, sem impor ao aoristo uma referência temporal mais específica do que o contexto exige.
- source_word: τὰ κρυπτὰ τῆς αἰσχύνης
  choice: às práticas ocultas e vergonhosas
  rationale: Torna idiomática a expressão genitiva, entendendo τὰ κρυπτά como coisas ou práticas mantidas em segredo e caracterizadas pela vergonha.
- source_word: μὴ περιπατοῦντες ἐν πανουργίᾳ
  choice: Não agimos com astúcia
  rationale: Traduz o uso metafórico de περιπατέω pelo modo de proceder; 'astúcia' conserva aqui a ideia negativa de esperteza inescrupulosa.
- source_word: μηδὲ δολοῦντες
  choice: nem adulteramos
  rationale: Preserva a imagem concreta de corromper algo mediante manipulação enganosa; 'falsificamos' também seria possível.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: Formulação consagrada, clara e suficientemente ampla para não restringir λόγος apenas à Escritura escrita ou apenas à pregação.
- source_word: τῇ φανερώσει τῆς ἀληθείας
  choice: mediante a manifestação pública da verdade
  rationale: φανέρωσις indica tornar manifesto ou patente; 'manifestação pública' evita limitar o sentido a uma proclamação exclusivamente verbal.
- source_word: συνιστάνοντες ἑαυτούς
  choice: nós nos recomendamos
  rationale: Comunica a apresentação de si mesmo à aprovação ou avaliação alheia, sem necessariamente sugerir vanglória.
- source_word: πρὸς πᾶσαν συνείδησιν ἀνθρώπων
  choice: à consciência de todas as pessoas
  rationale: Reproduz o alcance distributivo e genérico da expressão em português inclusivo e natural.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: diante de Deus
  rationale: Mantém a ideia de que Deus é testemunha e juiz da conduta ministerial.
theological_decisions:
- issue: Alcance da oposição entre o ministério enganoso e a manifestação da verdade
  choice: Apresentar o texto como uma afirmação de transparência ética na conduta e comunicação ministerial.
  alternative: Lê-lo exclusivamente como condenação de técnicas retóricas ou transformá-lo em uma formulação técnica sobre toda interpretação das Escrituras.
  rationale: O contexto imediato trata da integridade do ministério apostólico; a tradução mantém esse alcance sem excluir aplicações mais amplas nem introduzir uma doutrina técnica não explicitada.
- issue: Sentido de λόγος τοῦ θεοῦ
  choice: Manter a expressão ampla 'palavra de Deus'.
  alternative: Especificar 'Escritura' ou 'mensagem pregada'.
  rationale: O grego não exige aqui uma dessas delimitações, e a formulação ampla preserva a tensão semântica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi dividida em duas frases para clareza, preservando o contraste lógico do grego. Evitaram-se regionalismos e terminologia confessional específica.
