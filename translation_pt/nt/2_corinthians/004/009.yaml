  text: persecuted[a], but not abandoned; struck down, but not destroyed[b],
translation:
  language: pt
  text: perseguidos, mas não abandonados; derrubados, mas não destruídos,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διωκόμενοι
  choice: perseguidos
  rationale: No contexto paulino, o verbo denota perseguição hostil; «perseguidos» é a forma corrente e preserva o particípio passivo.
- source_word: ἐγκαταλειπόμενοι
  choice: abandonados
  rationale: Expressa com clareza a ideia de ser deixado desamparado, sem o tom menos corrente de «desamparados» ou «desamparados por Deus».
- source_word: καταβαλλόμενοι
  choice: derrubados
  rationale: Preserva a imagem de ser lançado ou abatido ao chão e forma uma antítese natural com «não destruídos».
- source_word: ἀπολλύμενοι
  choice: destruídos
  rationale: No contraste com «derrubados», comunica ruína definitiva, não simples queda ou sofrimento contínuo.
- source_word: ἀλλ’ οὐκ
  choice: mas não
  rationale: Reproduz de modo conciso os dois contrastes paralelos do grego.
theological_decisions:
- issue: Se ἐγκαταλειπόμενοι deve receber uma formulação de maior ressonância teológica ou uma expressão moderna e direta
  choice: abandonados
  alternative: desamparados
  rationale: «Abandonados» mantém a afirmação de que os apóstolos não são deixados sem amparo, sem acrescentar uma alusão formal ou identificar explicitamente o agente, que não aparece no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo compacto. A tradução conserva os particípios passivos e não explicita quem persegue, abandona, derruba ou destrói.
