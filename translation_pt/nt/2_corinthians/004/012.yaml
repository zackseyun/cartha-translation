  text: ὥστε ⸀ὁ θάνατος ἐν ἡμῖν ἐνεργεῖται, ἡ δὲ ζωὴ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/012.yaml
  text: So then[a], death is at work in us, but life in you.
translation:
  language: pt
  text: Assim, a morte atua em nós, mas a vida em vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Assim
  rationale: Introduz a consequência ou conclusão do que foi exposto nos versículos anteriores, em português natural e conciso.
- source_word: ὁ θάνατος
  choice: a morte
  rationale: O artigo e o substantivo abstrato são naturalmente expressos em português; preserva a morte como realidade operante no sofrimento apostólico.
- source_word: ἐν ἡμῖν
  choice: em nós
  rationale: Tradução direta que mantém o sentido pessoal e corporal e o contraste com os coríntios.
- source_word: ἐνεργεῖται
  choice: atua
  rationale: Expressa de modo corrente a operação efetiva e contínua indicada pelo verbo, sem recorrer a formulação técnica.
- source_word: ἡ δὲ ζωὴ
  choice: mas a vida
  rationale: “Mas” explicita o contraste marcado por δέ, enquanto “a vida” mantém a antítese concisa com “a morte”.
- source_word: ἐν ὑμῖν
  choice: em vocês
  rationale: Preserva o paralelismo com “em nós” e permite tanto ressonância pessoal quanto comunitária; “vocês” oferece ampla legibilidade brasileira.
theological_decisions:
- issue: Sentido do contraste entre morte e vida
  choice: Manter os termos literais e concisos, apresentando a morte como atuante nos apóstolos e a vida nos coríntios.
  alternative: Explicitar a morte como sofrimento físico dos apóstolos e a vida como vida espiritual comunicada aos coríntios.
  rationale: O contexto reúne sofrimento corporal, a morte e a vida de Jesus manifestadas nos apóstolos e o efeito vivificador do ministério. A tradução não restringe a afirmação a uma única categoria física, metafórica ou espiritual.
translation_notes:
  register: Português moderno, digno e conciso, com legibilidade brasileira. A estrutura antitética do grego foi preservada. Não se acrescentou nota, pois “Assim” e “atua” comunicam adequadamente a inferência e a ação contínua sem perda relevante de ambiguidade.
