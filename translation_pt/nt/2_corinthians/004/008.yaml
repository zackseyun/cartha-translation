  text: ἐν παντὶ θλιβόμενοι ἀλλ’ οὐ στενοχωρούμενοι, ἀπορούμενοι ἀλλ’ οὐκ ἐξαπορούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/008.yaml
  text: We are afflicted in every way[a], but not crushed; perplexed[c][b], but not driven to despair.
translation:
  language: pt
  text: Somos afligidos em tudo[a], mas não encurralados[b]; ficamos perplexos, mas não levados ao desespero[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «de todas as maneiras». A expressão indica abrangência e não necessariamente uma posição espacial literal.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «não confinados num lugar estreito»; isto é, não completamente encurralados.
    reason: lexical_alternative
  - marker: c
    text: Ou «não completamente sem saber o que fazer». O verbo grego intensifica o termo anterior, traduzido como «perplexos».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντί
  choice: de todos os lados
  rationale: Expressa de modo natural a abrangência da pressão sofrida. A expressão grega também pode significar «em tudo» ou «de todas as maneiras», sem exigir uma imagem espacial literal.
- source_word: θλιβόμενοι
  choice: somos pressionados
  rationale: Preserva a imagem de pressão presente em θλίβω e introduz com clareza o contraste com a ideia de ficar constrangido, sem espaço ou saída.
- source_word: στενοχωρούμενοι
  choice: ficamos sem saída
  rationale: Comunica idiomaticamente a imagem de ser confinado num espaço estreito. No contexto, nega que a pressão deixe os apóstolos completamente encurralados.
- source_word: ἀπορούμενοι
  choice: ficamos perplexos
  rationale: Expressa estar em dúvida ou não saber o que fazer, mantendo a distinção em relação ao verbo intensificado seguinte.
- source_word: ἐξαπορούμενοι
  choice: desesperados
  rationale: 'Representa a intensificação de ἀπορέω: passar da perplexidade à perda completa de recursos ou esperança. A nota preserva a alternativa mais literalmente ligada à ideia de não encontrar saída.'
- source_word: ἀλλ’ οὐ ... ἀλλ’ οὐκ
  choice: mas não ... mas não
  rationale: Mantém o paralelismo adversativo e o ritmo retórico das duas antíteses.
theological_decisions:
- issue: Grau de intensificação no segundo par de particípios
  choice: «perplexos, mas não desesperados»
  alternative: «sem saber o que fazer, mas não completamente sem saída»
  rationale: A formulação conserva a progressão entre incerteza e desespero sem transformar o texto numa afirmação técnica sobre o estado psicológico ou a perda da fé.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva o paralelismo conciso do grego e suas imagens de pressão, confinamento e perda de recursos.
