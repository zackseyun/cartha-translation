translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. A construção mantém o contraste enfático do grego e conserva em nota tanto a nuance de graça em χαρίσασθαι quanto a metáfora vívida de καταποθῇ.
