  text: so that[a], on the contrary, you should rather forgive and comfort him[b], so that such a person may not be overwhelmed by excessive sorrow.
translation:
  language: pt
  text: de modo que, pelo contrário, vocês devem antes perdoá-lo[a] e consolá-lo, para que essa pessoa não seja tragada por tristeza excessiva.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perdoá-lo graciosamente”; o verbo está relacionado a conceder graça ou favor.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “seja engolida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὐναντίον
  choice: pelo contrário
  rationale: Expressa claramente a inversão da conduta esperada e corresponde ao contraste marcado no grego.
- source_word: μᾶλλον
  choice: antes
  rationale: Preserva a força comparativa junto de τοὐναντίον, indicando o que os leitores devem fazer em lugar da disciplina anterior.
- source_word: χαρίσασθαι
  choice: perdoá-lo
  rationale: No contexto de restauração após disciplina, o verbo indica conceder perdão; a nota preserva sua relação lexical com graça e favor.
- source_word: παρακαλέσαι
  choice: consolá-lo
  rationale: A tristeza mencionada em seguida favorece o sentido de consolar, embora o verbo também possa significar encorajar.
- source_word: καταποθῇ
  choice: seja consumida
  rationale: Mantém em português natural a forte imagem de ser tragado ou engolido pela tristeza.
- source_word: ὁ τοιοῦτος
  choice: essa pessoa
  rationale: Retoma o indivíduo em questão sem especificar mais do que a expressão grega.
- source_word: περισσοτέρᾳ λύπῃ
  choice: uma tristeza excessiva
  rationale: Comunica naturalmente que a tristeza poderia ultrapassar uma medida suportável, preservando a força contextual da expressão.
