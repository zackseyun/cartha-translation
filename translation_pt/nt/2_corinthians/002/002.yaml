  text: εἰ γὰρ ἐγὼ λυπῶ ὑμᾶς, καὶ ⸀τίς ὁ εὐφραίνων με εἰ μὴ ὁ λυπούμενος ἐξ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/002.yaml
  text: For if I grieve you[a], who is there to make me glad except the one who is grieved by me?
translation:
  language: pt
  text: Pois, se eu entristeço vocês, quem me alegrará, senão aquele que é entristecido por mim?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “senão aquele que fica triste por minha causa”. A expressão grega pode indicar a origem ou a causa da tristeza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπῶ
  choice: entristeço
  rationale: O verbo expressa causar tristeza ou pesar. “Entristeço” é direto, atual e conserva a força causativa do grego.
- source_word: εὐφραίνων
  choice: me alegrará
  rationale: A expressão comunica com naturalidade a ideia de alguém que traz alegria a Paulo e mantém o contraste com “entristeço”.
- source_word: τίς ὁ εὐφραίνων με
  choice: quem me alegrará
  rationale: A formulação preserva a força retórica da pergunta e verte o particípio substantivado em português natural.
- source_word: ὁ λυπούμενος
  choice: aquele que é entristecido
  rationale: A forma passiva preserva a voz do particípio grego e evita transformar silenciosamente a construção em ativa.
- source_word: ἐξ ἐμοῦ
  choice: por mim
  rationale: Neste contexto, a preposição indica a origem ou causa da tristeza; “por mim” é conciso e mantém essa relação.
- source_word: γὰρ
  choice: Pois
  rationale: “Pois” assinala adequadamente que a frase explica o argumento anterior de Paulo.
