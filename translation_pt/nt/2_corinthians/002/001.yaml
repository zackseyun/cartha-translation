  text: ἔκρινα ⸀γὰρ ἐμαυτῷ τοῦτο, τὸ μὴ πάλιν ἐν λύπῃ πρὸς ὑμᾶς ἐλθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/001.yaml
  text: 'For I decided this for myself: not to come to you again in sorrow[a].'
translation:
  language: pt
  text: 'Pois decidi isto comigo mesmo: não voltar a vocês em tristeza[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com tristeza”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα
  choice: decidi
  rationale: O aoristo de κρίνω expressa aqui uma decisão pessoal definida; “decidi” é claro, natural e preserva a força deliberativa.
- source_word: γὰρ
  choice: Pois
  rationale: γάρ introduz uma explicação ligada ao contexto anterior; “Pois” mantém essa conexão de modo conciso e digno.
- source_word: ἐμαυτῷ
  choice: comigo mesmo
  rationale: O dativo reflexivo indica que Paulo tomou essa decisão interiormente e por si mesmo; “comigo mesmo” preserva essa ênfase pessoal.
- source_word: τοῦτο
  choice: isto
  rationale: O demonstrativo aponta para a decisão explicitada pelo infinitivo seguinte; os dois-pontos tornam essa referência prospectiva clara em português.
- source_word: τὸ μὴ ... ἐλθεῖν
  choice: não voltar
  rationale: O infinitivo articular apresenta o conteúdo da decisão. Como πάλιν acompanha o verbo de vir, “não voltar” transmite naturalmente em português a ideia de não ir novamente até os destinatários.
- source_word: πάλιν
  choice: voltar
  rationale: A noção de repetição de πάλιν é incorporada idiomaticamente em “voltar”, evitando a formulação menos fluida “vir novamente”.
- source_word: ἐν λύπῃ
  choice: em tristeza
  rationale: A expressão preserva a preposição ἐν e a amplitude de λύπη, sem decidir se a tristeza caracteriza Paulo, os destinatários ou a visita como um todo.
- source_word: πρὸς ὑμᾶς
  choice: a vocês
  rationale: Com verbo de movimento, πρός + acusativo indica direção às pessoas; “a vocês” é claro e amplamente compreensível.
theological_decisions:
- issue: A relação exata da tristeza com a visita
  choice: em tristeza
  alternative: causando tristeza
  rationale: O grego ἐν λύπῃ não explicita de quem é a tristeza nem se Paulo a leva consigo ou a provoca. A tradução mantém essa ambiguidade contextual e evita uma interpretação teológica ou psicológica adicional.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura com “isto:” preserva o movimento prospectivo do grego. “Voltar a vocês” é idiomático, enquanto a nota registra a alternativa para ἐν λύπῃ.
