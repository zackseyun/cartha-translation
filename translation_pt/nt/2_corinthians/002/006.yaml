lexical_decisions:
- source_word: ἱκανὸν
  choice: basta
  rationale: Como predicativo da oração, indica que a medida disciplinar já foi suficiente. “Basta” é natural e direto em português.
- source_word: τῷ τοιούτῳ
  choice: para esse homem
  rationale: A expressão masculina singular aponta, no contexto, para um infrator específico. “Esse homem” preserva essa referência de modo claro e corrente.
- source_word: ἐπιτιμία
  choice: castigo
  rationale: Designa uma sanção disciplinar concreta imposta pela comunidade. “Castigo” comunica melhor essa ação do que “repreensão”, que poderia sugerir apenas censura verbal.
- source_word: ἡ ὑπὸ τῶν πλειόνων
  choice: aplicado pela maioria
  rationale: O particípio implícito é explicitado para produzir português natural, enquanto “pela maioria” preserva o sentido de τῶν πλειόνων como a parte maior do grupo.
