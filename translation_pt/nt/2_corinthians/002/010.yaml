reference: 2 Corinthians 2:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ᾧ δέ τι χαρίζεσθε, κἀγώ· καὶ γὰρ ἐγὼ ⸂ὃ κεχάρισμαι, εἴ τι⸃ κεχάρισμαι, δι’ ὑμᾶς ἐν προσώπῳ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/010.yaml
  text: To anyone whom you forgive anything[a], I do too. For what I have forgiven—if I have forgiven anything—I have forgiven for your sake in the presence of Messiah,
translation:
  language: pt
  text: A quem vocês perdoam alguma coisa, eu também perdoo. Pois aquilo que perdoei — se é que perdoei alguma coisa — perdoei por causa de vocês, na presença do Messias[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na pessoa do Messias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαρίζεσθε / κεχάρισμαι
  choice: perdoam / perdoei
  rationale: Embora χαρίζομαι possa significar conceder por graça ou favorecer, neste contexto de disciplina e restauração refere-se à liberação de uma ofensa; “perdoar” comunica isso com clareza em português.
- source_word: ᾧ ... τι
  choice: A quem ... alguma coisa
  rationale: O pronome relativo no dativo indica quem recebe o perdão, e τι mantém indefinido o objeto. A formulação conserva a abertura do grego sem acrescentar um referente específico.
- source_word: κἀγώ
  choice: eu também perdoo
  rationale: Explicita naturalmente em português o verbo subentendido na expressão grega condensada “eu também”.
- source_word: ὃ κεχάρισμαι, εἴ τι κεχάρισμαι
  choice: aquilo que perdoei — se é que perdoei alguma coisa —
  rationale: Preserva a formulação condicional e discretamente autolimitadora de Paulo; os travessões assinalam o caráter parentético da oração.
- source_word: δι’ ὑμᾶς
  choice: por causa de vocês
  rationale: Expressa que a ação foi realizada tendo os coríntios em vista, sem definir de modo excessivamente estreito se a nuance é benefício, representação ou motivação.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: na presença do Messias
  rationale: πρόσωπον pode significar rosto, presença ou pessoa. “Na presença” comunica de modo natural a ideia de agir diante do Messias, enquanto a alternativa legítima é registrada em nota.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Traduz o título Χριστός em vez de tratá-lo simplesmente como nome próprio, conforme seu valor cristológico no contexto.
theological_decisions:
- issue: Sentido de ἐν προσώπῳ Χριστοῦ
  choice: na presença do Messias
  alternative: na pessoa do Messias
  rationale: A expressão pode indicar uma ação realizada diante do Messias ou em sua pessoa/como seu representante. O texto principal adota a leitura contextual natural, e a nota preserva a ambiguidade sem impor uma interpretação teológica.
- issue: Tradução de Χριστοῦ como título ou forma tradicional semelhante a nome próprio
  choice: Messias
  alternative: Cristo
  rationale: Aqui nada exige que o termo seja tratado apenas como identificador pessoal; “Messias” preserva seu conteúdo titular sem acrescentar uma distinção doutrinária.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com “vocês” adequado à referência plural. A repetição de “perdoar” e a ressalva parentética foram mantidas por refletirem a forma e a tensão do grego. A vírgula final preserva a continuidade sintática com o versículo seguinte.
