  text: οὐκ ἔσχηκα ἄνεσιν τῷ πνεύματί μου τῷ μὴ εὑρεῖν με Τίτον τὸν ἀδελφόν μου, ἀλλὰ ἀποταξάμενος αὐτοῖς ἐξῆλθον εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/013.yaml
  text: I had no rest in my spirit because I did not find Titus my brother[a], but after taking leave of them[c][b], I went on to Macedonia.
translation:
  language: pt
  text: Não tive descanso em meu espírito[a], porque não encontrei Tito, meu irmão[b]; mas, depois de me despedir deles[c], parti para a Macedônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para meu espírito”.'
    reason: lexical_alternative
  - marker: b
    text: “Meu irmão” indica que Tito era irmão de Paulo na fé e seu cooperador.
    reason: cultural_note
  - marker: c
    text: 'Ou: “depois de lhes dar adeus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔσχηκα
  choice: Não tive
  rationale: Embora o perfeito grego possa destacar um estado resultante, o contexto narrativo em português favorece o pretérito perfeito para descrever a falta de descanso antes da partida de Paulo.
- source_word: ἄνεσιν
  choice: descanso
  rationale: “Descanso” preserva o sentido de alívio ou tranquilidade e forma uma expressão natural com “em meu espírito”.
- source_word: τῷ πνεύματί μου
  choice: em meu espírito
  rationale: O dativo pode indicar esfera ou referência. “Em meu espírito” mantém a dimensão interior sem reduzir πνεῦμα a uma leitura meramente psicológica.
- source_word: τῷ μὴ εὑρεῖν με Τίτον
  choice: porque não encontrei Tito
  rationale: O infinitivo articular com μή apresenta a razão da inquietação de Paulo; a construção causal é clara e não acrescenta a ideia de incapacidade.
- source_word: Τίτον τὸν ἀδελφόν μου
  choice: Tito, meu irmão
  rationale: Preserva a metáfora familiar paulina e sua proximidade afetiva; a aposição soa natural em português.
- source_word: ἀποταξάμενος αὐτοῖς
  choice: depois de me despedir deles
  rationale: Expressa com naturalidade a ação anterior de despedir-se das pessoas em Trôade, sem a solenidade hoje pouco comum de “tomar licença”.
- source_word: ἐξῆλθον εἰς Μακεδονίαν
  choice: parti para a Macedônia
  rationale: Reproduz de modo idiomático tanto a partida quanto o destino indicado por εἰς.
theological_decisions:
- issue: Sentido de “meu irmão” aplicado a Tito
  choice: Manter a expressão literal no texto e explicá-la em nota
  alternative: Substituir por “meu companheiro na fé” ou “meu cooperador”
  rationale: A linguagem familiar é teologicamente e afetivamente significativa em Paulo; a nota esclarece seu uso sem apagar a metáfora.
- issue: Sentido de πνεῦμα em “meu espírito”
  choice: Preservar “espírito” sem especificar se significa disposição interior, ser interior ou outra nuance
  alternative: Traduzir por “ânimo” ou “mente”
  rationale: O grego permite uma referência ampla à vida interior de Paulo. Uma equivalência psicológica mais estreita resolveria indevidamente a ambiguidade.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, mantendo a progressão do grego: inquietação interior, causa, despedida e partida. Todos os marcadores de nota aparecem no texto.'
