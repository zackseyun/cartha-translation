id: 2CO.2.12
reference: 2 Corinthians 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ εἰς τὴν Τρῳάδα εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ θύρας μοι ἀνεῳγμένης ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/012.yaml
  text: When I came to Troas for the gospel of Messiah[a], and a door had been opened for me in the Lord[b],
translation:
  language: pt
  text: Quando, porém, cheguei a Trôade para o evangelho do Messias[a], e uma porta havia sido aberta para mim no Senhor[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de Cristo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e uma porta estava aberta para mim no Senhor”.'
    reason: aspectual_alternative
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: Quando, porém, cheguei
  rationale: O particípio aoristo tem valor temporal, e δέ assinala uma transição leve. A formulação é natural em português e mantém a ligação com a oração principal que vem no versículo seguinte.
- source_word: εἰς τὴν Τρῳάδα
  choice: a Trôade
  rationale: É a forma direcional idiomática em português para a chegada a esse lugar.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: para anunciar o evangelho
  rationale: O segundo εἰς expressa finalidade. Embora o verbo “anunciar” esteja implícito, explicitá-lo produz português claro e natural sem alterar a finalidade missionária da expressão.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Χριστός funciona aqui como título. “Messias” preserva o sentido de “Ungido”, enquanto a nota registra a forma tradicional “Cristo”.
- source_word: θύρας
  choice: uma porta
  rationale: Mantém a metáfora de Paulo, em vez de substituí-la diretamente por “oportunidade”.
- source_word: ἀνεῳγμένης
  choice: havia sido aberta
  rationale: O particípio perfeito passivo indica uma ação anterior cujo resultado permanecia vigente.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Preserva a expressão paulina e evita restringir ἐν a um sentido exclusivamente instrumental.
theological_decisions:
- issue: Sentido titular de Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: Neste contexto, Χριστός designa o Ungido e mantém força titular; a alternativa tradicional é oferecida em nota.
- issue: Relação expressa por ἐν κυρίῳ
  choice: no Senhor
  alternative: pelo Senhor
  rationale: “No Senhor” conserva a amplitude da construção grega, que pode indicar esfera ou relação; “pelo Senhor” definiria de modo mais estreito o Senhor como agente.
translation_notes:
  register: Português atual, digno e acessível, com leitura natural no Brasil. A vírgula final foi mantida porque a construção sintática continua no versículo 13.
