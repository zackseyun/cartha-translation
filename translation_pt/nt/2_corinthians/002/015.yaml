  text: ὅτι Χριστοῦ εὐωδία ἐσμὲν τῷ θεῷ ἐν τοῖς σῳζομένοις καὶ ἐν τοῖς ἀπολλυμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/015.yaml
  text: For we are the aroma of Messiah to God among those who are being saved and among those who are perishing[b][a],
translation:
  language: pt
  text: Pois somos, para Deus, o aroma do Messias entre os que estão sendo salvos e entre os que estão perecendo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior, preservando de modo natural a força causal e explicativa.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: 'Mantém o sentido titular de Χριστός nesta construção genitiva: o aroma pertence ao Messias ou é caracterizado por ele.'
- source_word: εὐωδία
  choice: o aroma
  rationale: Preserva a metáfora olfativa sem acrescentar a ideia de doçura, que não está explícita no termo grego.
- source_word: τῷ θεῷ
  choice: para Deus
  rationale: Representa diretamente o dativo e conserva a orientação relacional da metáfora.
- source_word: ἐν τοῖς σῳζομένοις
  choice: entre os que estão sendo salvos
  rationale: O particípio presente expressa um processo em curso; “entre” é natural em português neste contexto.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: entre os que estão perecendo
  rationale: O particípio presente conserva a noção de processo contínuo, sem especificar indevidamente a forma da perdição.
theological_decisions:
- issue: Aspecto processual de σῳζομένοις e ἀπολλυμένοις
  choice: “os que estão sendo salvos” e “os que estão perecendo”
  alternative: “os salvos” e “os perdidos”
  rationale: As duas formas participiais presentes apresentam salvação e perdição como processos em curso. A tradução preserva essa tensão, em vez de reduzi-las a categorias estáticas ou estados já concluídos.
- issue: Valor de Χριστοῦ
  choice: “do Messias”
  alternative: “de Cristo”
  rationale: A forma é entendida aqui com força titular. “Messias” torna esse valor explícito sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A ordem “para Deus” foi antecipada para evitar a sequência menos natural “o aroma do Messias para Deus”, sem alterar as relações sintáticas do grego. A repetição de “entre” espelha os dois sintagmas com ἐν e reforça o paralelismo.
