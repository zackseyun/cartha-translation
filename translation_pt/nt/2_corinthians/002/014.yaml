id: 2CO.2.14
reference: 2 Corinthians 2:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τῷ δὲ θεῷ χάρις τῷ πάντοτε θριαμβεύοντι ἡμᾶς ἐν τῷ Χριστῷ καὶ τὴν ὀσμὴν τῆς γνώσεως αὐτοῦ φανεροῦντι δι’ ἡμῶν ἐν παντὶ τόπῳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/014.yaml
  text: But thanks be to God[b][a], who always leads us in triumphal procession in the Messiah and makes the fragrance of the knowledge of him known through us in every place.
translation:
  language: pt
  text: Mas graças a Deus, que sempre nos conduz em procissão triunfal no Messias[a] e, por nosso intermédio, manifesta em todo lugar a fragrância[b] do conhecimento dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que sempre triunfa sobre nós no Messias”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “aroma”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: graças
  rationale: Na fórmula «Τῷ δὲ θεῷ χάρις», «graças a Deus» expressa de modo natural em português a ação de graças e conserva sua força doxológica.
- source_word: θριαμβεύοντι
  choice: nos conduz em procissão triunfal
  rationale: A expressão preserva a imagem concreta do triunfo romano e mantém ἡμᾶς como objeto direto. A possibilidade de o verbo significar que Deus triunfa sobre os apóstolos é registrada em nota.
- source_word: ἐν τῷ Χριστῷ
  choice: no Messias
  rationale: Χριστός funciona aqui como título; «no Messias» preserva tanto esse valor quanto a ideia de esfera ou união expressa por ἐν.
- source_word: ὀσμὴν
  choice: fragrância
  rationale: «Fragrância» comunica a conotação positiva da metáfora no contexto; «aroma», igualmente possível, é indicado em nota.
- source_word: γνώσεως
  choice: conhecimento
  rationale: É a correspondência mais direta e clara para a noção do conhecimento de Deus difundido pelo ministério apostólico.
- source_word: φανεροῦντι
  choice: manifesta
  rationale: «Manifesta» comunica o ato de tornar perceptível ou conhecido e combina naturalmente com a metáfora da fragrância.
- source_word: δι’ ἡμῶν
  choice: por nosso intermédio
  rationale: διά com o genitivo indica agência ou instrumentalidade; a formulação deixa claro que Deus age por meio dos apóstolos.
- source_word: ἐν παντὶ τόπῳ
  choice: em todo lugar
  rationale: Mantém de perto a formulação grega e soa natural em português contemporâneo.
theological_decisions:
- issue: Sentido de θριαμβεύω com ἡμᾶς como objeto
  choice: Deus conduz os apóstolos em procissão triunfal no Messias.
  alternative: Deus triunfa sobre os apóstolos no Messias.
  rationale: O texto principal conserva a imagem vívida da procissão triunfal e sua ligação com a metáfora da fragrância. Como o verbo também pode retratar pessoas como vencidas e exibidas no triunfo, a alternativa é mantida em nota, sem eliminar a tensão.
- issue: Referente de αὐτοῦ em «τῆς γνώσεως αὐτοῦ»
  choice: «dele», sem explicitar o referente
  alternative: «de Deus» ou «do Messias»
  rationale: O pronome português preserva a possibilidade referencial do grego, embora o contexto favoreça o conhecimento de Deus, evitando resolver silenciosamente uma ambiguidade gramatical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. «Por nosso intermédio» evita uma construção pesada, enquanto «procissão triunfal» conserva a imagem histórica. O pronome «dele» mantém a concisão e a ambiguidade do original.
