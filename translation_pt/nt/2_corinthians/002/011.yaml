  verdict: revise
  source_fidelity: A tradução preserva a finalidade de ἵνα μή, o agente pessoal «Satanás», a relação explicativa de γάρ e a declaração de não ignorar os νοήματα dele. Contudo, «tire vantagem de nós» pode soar como mero benefício obtido, menos claramente como a exploração/lesão sofrida expressa pelo passivo πλεονεκτηθῶμεν.
  naturalness: «Para que Satanás não se aproveite de nós» é uma formulação idiomática, clara e amplamente compreensível em português contemporâneo. A alternativa atual «não nos leve vantagem» na nota não é natural; requer «sobre nós».
  terminology: «Satanás», «pois», «não ignoramos» e «planos» são adequados. «Planos» conserva uma amplitude legítima para νοήματα no contexto; a nota oferece alternativas mais específicas sem impor uma interpretação doutrinária.
  issues:
  - severity: medium
    issue: A formulação principal «tire vantagem de nós» é semanticamente mais fraca e potencialmente ambígua para πλεονεκτηθῶμεν.
    rationale: O verbo grego passivo indica que os destinatários não devem ser logrados, explorados ou prejudicados por Satanás. «Não se aproveite de nós» exprime mais diretamente essa relação sem restringi-la a engano intelectual.
  - severity: low
    issue: A alternativa de nota «não nos leve vantagem» não é idiomática.
    rationale: Em português corrente, diz-se «levar vantagem sobre alguém»; a nota deve ser corrigida para não introduzir uma formulação defeituosa.
