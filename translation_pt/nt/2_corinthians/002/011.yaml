  text: ἵνα μὴ πλεονεκτηθῶμεν ὑπὸ τοῦ Σατανᾶ, οὐ γὰρ αὐτοῦ τὰ νοήματα ἀγνοοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/011.yaml
  text: so that we would not be outwitted by Satan[b][a], for we are not ignorant of his schemes.
translation:
  language: pt
  text: para que Satanás não se aproveite de nós,[a] pois não ignoramos os seus planos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não nos explore”, “não nos lese” ou “não leve vantagem sobre nós”.
    reason: lexical_alternative
  - marker: b
    text: Ou “desígnios”, “intenções” ou “pensamentos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: para que ... não
  rationale: Expressa de modo natural em português a finalidade preventiva da construção grega, sem reduzir sua força a uma simples consequência.
- source_word: πλεονεκτηθῶμεν
  choice: tire vantagem de nós
  rationale: O passivo grego indica ser explorado, lesado ou sobrepujado. A formulação ativa exigida pelo português corrente preserva a ideia ampla de Satanás obter vantagem, sem limitar o sentido apenas a engano intelectual.
- source_word: Σατανᾶ
  choice: Satanás
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome pessoal em português.
- source_word: γὰρ
  choice: pois
  rationale: Introduz a explicação que fundamenta a oração anterior e mantém clara a relação lógica.
- source_word: νοήματα
  choice: planos
  rationale: No contexto, refere-se aos desígnios ou maquinações de Satanás. “Planos” é claro e natural, embora o termo grego também possa designar pensamentos ou intenções.
- source_word: ἀγνοοῦμεν
  choice: não ignoramos
  rationale: Reproduz diretamente a negação e o campo semântico de conhecimento do verbo grego, em linguagem digna e compreensível.
theological_decisions: []
