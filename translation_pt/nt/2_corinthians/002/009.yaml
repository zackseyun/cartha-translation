  text: εἰς τοῦτο γὰρ καὶ ἔγραψα ἵνα γνῶ τὴν δοκιμὴν ὑμῶν, εἰ εἰς πάντα ὑπήκοοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/009.yaml
  text: 'For this is why I also wrote: so that I might know the proof of you[a], whether you are obedient in everything.'
translation:
  language: pt
  text: 'Pois foi também para isto que escrevi: para conhecer a prova de vocês[a], se são obedientes em tudo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a comprovação de vocês” ou “a qualidade aprovada de vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ καὶ
  choice: Pois foi também para isto
  rationale: Conserva a explicação introduzida por γάρ, a finalidade de εἰς τοῦτο e a força aditiva de καί em português natural.
- source_word: ἔγραψα
  choice: escrevi
  rationale: O pretérito perfeito traduz naturalmente o aoristo e remete à carta ou instrução anteriormente escrita.
- source_word: ἵνα γνῶ
  choice: para conhecer
  rationale: Mantém a finalidade da ação e o sentido de vir a saber mediante a resposta dos destinatários.
- source_word: τὴν δοκιμὴν ὑμῶν
  choice: o que vocês demonstrariam na prova
  rationale: δοκιμή pode indicar tanto a prova quanto a qualidade comprovada por ela. A formulação mantém juntas as ideias de teste e demonstração sem reduzir o termo apenas a 'caráter aprovado'.
- source_word: εἰ εἰς πάντα ὑπήκοοί ἐστε
  choice: isto é, se são obedientes em tudo
  rationale: εἰ introduz aquilo que Paulo procura verificar; 'em tudo' preserva a abrangência de εἰς πάντα. 'Isto é' explicita em português a relação explicativa entre a demonstração e a obediência.
theological_decisions:
- issue: Sentido de δοκιμή aplicado aos coríntios
  choice: o que vocês demonstrariam na prova
  alternative: o caráter aprovado de vocês; a prova de vocês
  rationale: A escolha evita decidir se Paulo enfatiza o processo de serem postos à prova ou o resultado comprovado, preservando a tensão lexical do grego.
translation_notes:
  register: Português moderno, digno e acessível, com 'vocês' para o plural explícito. A construção foi ajustada para soar natural sem eliminar a ambiguidade de δοκιμή.
