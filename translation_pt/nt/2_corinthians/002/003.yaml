source:
  edition: SBLGNT
  text: καὶ ⸀ἔγραψα τοῦτο αὐτὸ ἵνα μὴ ἐλθὼν λύπην ⸀σχῶ ἀφ’ ὧν ἔδει με χαίρειν, πεποιθὼς ἐπὶ πάντας ὑμᾶς ὅτι ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/003.yaml
  text: And I wrote this very thing so that, when I came, I might not have grief from those who ought to make me rejoice, because I was confident about all of you that my joy is the joy of you all.
translation:
  language: pt
  text: E escrevi exatamente isso para que, ao chegar, eu não tivesse tristeza da parte daqueles que deveriam me dar alegria,[a] pois estou confiante, a respeito de todos vocês, de que a minha alegria é a alegria de todos vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “da parte daqueles de quem eu deveria me alegrar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: escrevi
  rationale: O aoristo indicativo aponta naturalmente para uma ação passada, provavelmente uma carta anterior de Paulo.
- source_word: τοῦτο αὐτό
  choice: exatamente isso
  rationale: Preserva a ênfase da expressão grega em português corrente.
- source_word: ἵνα μὴ ἐλθὼν λύπην σχῶ
  choice: para que, ao chegar, eu não tivesse tristeza
  rationale: Expressa a finalidade de ἵνα, a circunstância temporal do particípio ἐλθών e a dor emocional indicada por λύπη.
- source_word: ἀφ’ ὧν ἔδει με χαίρειν
  choice: da parte daqueles que deveriam me dar alegria
  rationale: Comunica naturalmente que essas pessoas deveriam ser fonte de alegria para Paulo, preservando em nota a construção mais literal e sua ambiguidade.
- source_word: πεποιθὼς ἐπὶ πάντας ὑμᾶς
  choice: pois confio em todos vocês
  rationale: O perfeito participial expressa confiança estabelecida; 'pois' apresenta sua relação explicativa sem impor uma causalidade forte.
- source_word: ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν
  choice: a minha alegria é a alegria de todos vocês
  rationale: Mantém a estrutura e a tensão do grego, sem decidir se a alegria é compartilhada, pertencente a todos ou causada por eles.
theological_decisions:
- issue: A natureza da alegria comum entre Paulo e os coríntios
  choice: a minha alegria é a alegria de todos vocês
  alternative: todos vocês compartilham da minha alegria
  rationale: A formulação mais próxima do grego preserva a abertura semântica e evita explicitar uma interpretação que o texto não determina.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A colocação de 'ao chegar' evita uma oração pesada; 'me dar alegria' é idiomático, enquanto a nota registra a forma mais literal.
