source:
  edition: SBLGNT
  text: Εἰ δέ τις λελύπηκεν, οὐκ ἐμὲ λελύπηκεν, ἀλλὰ ἀπὸ μέρους ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/005.yaml
  text: But if anyone has caused grief[a], he has grieved not me, but in part all of you—to some extent[b], so that I may not overstate it.
translation:
  language: pt
  text: Mas, se alguém causou tristeza, não entristeceu a mim, mas, em certa medida, a todos vocês — para não sobrecarregar todos vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para não pesar demais sobre todos vocês»; também pode ter o sentido de «para não exagerar».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λελύπηκεν
  choice: causou tristeza / entristeceu
  rationale: Mantém a ligação lexical entre as duas ocorrências de λυπέω e expressa, de modo natural, uma ação passada cujos efeitos permanecem.
- source_word: οὐκ ἐμὲ
  choice: não ... a mim
  rationale: Preserva diretamente o contraste enfático do pronome grego, sem acrescentar «pessoalmente».
- source_word: ἀπὸ μέρους
  choice: em certa medida
  rationale: Traduz o valor adverbial e qualificativo da expressão, evitando sugerir necessariamente que apenas uma parte da comunidade foi atingida.
- source_word: πάντας ὑμᾶς
  choice: a todos vocês
  rationale: Conserva a abrangência explícita de πάντας e a dimensão comunitária da afirmação.
- source_word: ἐπιβαρῶ
  choice: ser muito severo
  rationale: No contexto, o verbo de «sobrecarregar» pode descrever retoricamente uma formulação pesada ou excessiva; esta opção comunica a atenuação de Paulo, enquanto a nota preserva a imagem literal e a ambiguidade.
theological_decisions:
- issue: Alcance de ἀπὸ μέρους e função de ἵνα μὴ ἐπιβαρῶ
  choice: A tristeza alcançou todos «em certa medida», e Paulo evita formular a acusação com severidade excessiva.
  alternative: «Não entristeceu a mim, mas em parte a todos vocês, para que eu não sobrecarregue todos vocês.»
  rationale: A sintaxe admite mais de uma ligação para ἀπὸ μέρους e mais de um matiz para ἐπιβαρῶ. O texto principal segue a leitura contextual mais fluente, sem eliminar na nota a leitura mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para o plural. A repetição «tristeza/entristeceu» reproduz deliberadamente a ligação lexical do grego; o travessão marca a explicação atenuadora final.
