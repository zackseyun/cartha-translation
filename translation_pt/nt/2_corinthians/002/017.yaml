  source_fidelity: 'O texto transmite com precisão o contraste de Paulo: ele e seus colaboradores não tratam a palavra de Deus como mercadoria, mas falam com integridade, tendo Deus como origem/autoridade, diante dele e no Messias. «Pelo contrário» representa adequadamente ἀλλά, e a nota [c] preserva explicitamente a estrutura comparativa dupla ὡς ... ὡς que foi suavizada para o português.'
  naturalness: Português moderno, claro e de registro digno. «Pois não somos como tantos outros» é natural e evita dar a οἱ πολλοί uma precisão estatística indevida. «Mercadejam» é formal, mas compreensível e apropriado ao tom da passagem; mantém melhor a imagem comercial do que alternativas excessivamente genéricas.
  terminology: «Palavra de Deus», «diante de Deus» e «no Messias» são escolhas consistentes e fiéis. «No Messias» traduz Χριστῷ como título e a nota [e] registra de modo útil a forma tradicional «em Cristo».
