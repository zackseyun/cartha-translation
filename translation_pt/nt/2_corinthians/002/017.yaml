id: 2CO.2.17
reference: 2 Corinthians 2:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ γάρ ἐσμεν ὡς οἱ ⸀πολλοὶ καπηλεύοντες τὸν λόγον τοῦ θεοῦ, ἀλλ’ ὡς ἐξ εἰλικρινείας, ἀλλ’ ὡς ἐκ θεοῦ ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/017.yaml
  text: For we are not like the many[a], peddling the word of God, but as from sincerity, but as from God[f][e][d][c][b], before God we speak in Messiah.
translation:
  language: pt
  text: Pois não somos como tantos outros[a], que mercadejam[b] a palavra de Deus. Pelo contrário, falamos com sinceridade[c], da parte de Deus, diante de Deus[d], no Messias[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «os muitos»; também pode ser entendido como «muitos» ou «tantos outros».
    reason: lexical_alternative
  - marker: b
    text: O verbo evoca quem negocia uma mercadoria e pode sugerir vendê-la por interesse próprio ou adulterá-la para obter vantagem.
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente, «como a partir da sinceridade»; o grego repete a construção: «mas como a partir da sinceridade, mas como a partir de Deus».'
    reason: source_structure
  - marker: d
    text: Ou «na presença de Deus» ou «aos olhos de Deus».
    reason: lexical_alternative
  - marker: e
    text: Tradicionalmente, «em Cristo».
    reason: alternative_rendering
lexical_decisions:
- source_word: οἱ πολλοί
  choice: tantos outros
  rationale: Em português, «tantos outros» expressa naturalmente o grupo numeroso com o qual Paulo se contrasta, sem afirmar estatisticamente que se trata da maioria; a alternativa mais formal «os muitos» é preservada em nota.
- source_word: καπηλεύοντες
  choice: mercadejam
  rationale: Mantém a metáfora comercial e a censura de tratar a mensagem divina como mercadoria em benefício próprio, sem limitar explicitamente o sentido à adulteração ou ao lucro.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: Reproduz diretamente a construção genitiva e conserva a expressão paulina reconhecível.
- source_word: ἐξ εἰλικρινείας
  choice: com sinceridade
  rationale: É a formulação portuguesa mais natural para indicar a qualidade e a motivação do falar; a nota registra o valor mais formal de origem expresso por ἐξ.
- source_word: ἐκ θεοῦ
  choice: da parte de Deus
  rationale: Comunica em português corrente que Deus é a fonte e a autoridade do falar apostólico, sem acrescentar explicitamente «enviados».
- source_word: κατέναντι θεοῦ
  choice: diante de Deus
  rationale: Expressa concisamente presença, testemunho e responsabilidade perante Deus.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Traduz o título Χριστός e preserva a fórmula relacional e esférica marcada por ἐν, sem reduzi-la a «em nome de».
- source_word: λαλοῦμεν
  choice: falamos
  rationale: Equivalente direto e natural do presente grego, sem intensificá-lo para «proclamamos».
theological_decisions:
- issue: Sentido de ἐν Χριστῷ
  choice: no Messias
  alternative: em Cristo
  rationale: A tradução verte Χριστός como título, mantendo deliberadamente aberta a amplitude paulina de união, esfera e relação com o Messias; «em nome do Messias» seria explicativo demais.
- issue: Fonte e caráter do ministério em ἐξ εἰλικρινείας e ἐκ θεοῦ
  choice: com sinceridade, da parte de Deus
  alternative: como provenientes da sinceridade, como provenientes de Deus
  rationale: A formulação principal conserva tanto a integridade humana quanto a origem divina do falar, sem opô-las nem fundi-las; a estrutura comparativa repetida do grego é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Mercadejam» foi escolhido por conservar a imagem comercial sem recorrer ao coloquial «mascateiam». A repetição grega ἀλλ’ ὡς ... ἀλλ’ ὡς é suavizada no texto para evitar uma sequência artificial em português, mas documentada em nota. Todos os marcadores [a]–[e] aparecem no texto principal.
