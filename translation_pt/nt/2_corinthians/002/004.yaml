  naturalness: O português é moderno, claro e apropriado ao registro epistolar. “De muita aflição e angústia de coração” é igualmente natural e mais próximo do grego. Explicitar “vocês” em ambas as orações de finalidade melhora a leitura internacional sem alterar o sentido.
  terminology: “Aflição”, “angústia de coração”, “lágrimas” e “amor” são escolhas adequadas. “Ficassem entristecidos” conserva mais claramente o valor passivo de λυπηθῆτε do que a construção causativa “entristecê-los”.
