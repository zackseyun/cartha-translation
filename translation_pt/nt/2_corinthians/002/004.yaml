  text: ἐκ γὰρ πολλῆς θλίψεως καὶ συνοχῆς καρδίας ἔγραψα ὑμῖν διὰ πολλῶν δακρύων, οὐχ ἵνα λυπηθῆτε, ἀλλὰ τὴν ἀγάπην ἵνα γνῶτε ἣν ἔχω περισσοτέρως εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/004.yaml
  text: For out of much affliction and anguish of heart I wrote to you through many tears[a], not so that you might be grieved[b], but so that you might know the love that I have especially for you.
translation:
  language: pt
  text: Pois escrevi a vocês de muita aflição e angústia de coração, com muitas lágrimas, não para que vocês ficassem entristecidos, mas para que conhecessem o amor que tenho de modo tão abundante por vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o amor especial que tenho por vocês”; literalmente, “o amor que tenho mais abundantemente para com vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ πολλῆς θλίψεως
  choice: Pois... em meio a muita aflição
  rationale: ἐκ indica a condição interior da qual a escrita procedeu. Em português, “em meio a” comunica naturalmente que Paulo escreveu sob intensa aflição, sem restringi-la a perseguição externa.
- source_word: συνοχῆς καρδίας
  choice: angústia de coração
  rationale: Preserva a ideia de aperto ou constrição interior e a forte carga emocional da expressão grega.
- source_word: ἔγραψα ὑμῖν
  choice: escrevi a vocês
  rationale: Mantém o aoristo simples, sem acrescentar ao verbo a inferência contextual de que se tratava de uma carta anterior.
- source_word: διὰ πολλῶν δακρύων
  choice: com muitas lágrimas
  rationale: É a forma idiomática em português para expressar as lágrimas que acompanharam o ato de escrever; a preposição διά permite esse valor circunstancial.
- source_word: οὐχ ἵνα λυπηθῆτε
  choice: não para entristecê-los
  rationale: Expressa de modo natural a finalidade negada e o efeito de tristeza sobre os destinatários.
- source_word: τὴν ἀγάπην ἵνα γνῶτε
  choice: para que conhecessem o amor
  rationale: Conserva a oração de finalidade e deixa “conhecer” abranger tanto perceber quanto compreender mais plenamente.
- source_word: ἣν ἔχω περισσοτέρως εἰς ὑμᾶς
  choice: o amor transbordante que tenho por vocês
  rationale: “Transbordante” comunica a intensidade ou abundância de περισσοτέρως sem afirmar inequivocamente uma comparação com o amor dedicado a outras pessoas; a ambiguidade é registrada em nota.
theological_decisions:
- issue: Força comparativa ou intensiva de περισσοτέρως εἰς ὑμᾶς
  choice: amor transbordante que tenho por vocês
  alternative: amor especial que tenho por vocês; amor que tenho por vocês mais abundantemente
  rationale: O advérbio pode ser entendido como intensivo (“abundantemente”) ou comparativo (“especialmente/mais”). O texto principal evita transformar a frase numa comparação explícita entre os coríntios e outros grupos, enquanto a nota preserva as possibilidades.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “A vocês” evita regionalismo excessivo; “angústia de coração” mantém o tom afetivo e solene. A nota preserva a ambiguidade real de περισσοτέρως.
