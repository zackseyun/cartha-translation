  source_fidelity: A tradução preserva com precisão o contraste distributivo de οἷς μὲν ... οἷς δέ, a repetição simétrica de ὀσμή e as expressões compactas ἐκ θανάτου εἰς θάνατον / ἐκ ζωῆς εἰς ζωήν. “De ... para ...” representa adequadamente as preposições sem fechar a ambiguidade interpretativa. “Para essas coisas” reflete o plural πρὸς ταῦτα, e “suficiente” corresponde bem a ἱκανός.
