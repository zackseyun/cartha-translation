source:
  edition: SBLGNT
  text: οἷς μὲν ὀσμὴ ⸀ἐκ θανάτου εἰς θάνατον, οἷς δὲ ὀσμὴ ⸁ἐκ ζωῆς εἰς ζωήν. καὶ πρὸς ταῦτα τίς ἱκανός;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/016.yaml
  text: To the one[a], a fragrance from death to death; to the other, a fragrance from life to life[c][b]. And who is sufficient for these things?
translation:
  language: pt
  text: Para uns, cheiro[a] de morte para morte; para outros, cheiro de vida para vida.[b] E quem é suficiente para essas coisas?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aroma” ou “odor”, nas duas ocorrências de “cheiro”.
    reason: lexical_alternative
  - marker: b
    text: As expressões “de morte para morte” e “de vida para vida” podem indicar origem e resultado (“proveniente da morte e conduzindo à morte” / “proveniente da vida e conduzindo à vida”) ou uma caracterização intensificada.
    reason: alternative_reading
  - marker: c
    text: Ou “capaz” ou “competente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσμή
  choice: cheiro
  rationale: “Cheiro” preserva de modo natural e amplo a imagem sensorial, sem atribuir por si só valor agradável ou desagradável; assim, funciona nos dois lados do contraste entre morte e vida.
- source_word: ἐκ θανάτου εἰς θάνατον
  choice: de morte para morte
  rationale: A formulação concisa reproduz o paralelismo e mantém em aberto se a expressão indica origem e resultado ou uma caracterização intensificada.
- source_word: ἐκ ζωῆς εἰς ζωήν
  choice: de vida para vida
  rationale: Mantém a simetria deliberada com “de morte para morte” e evita restringir a expressão a uma única explicação.
- source_word: πρὸς ταῦτα
  choice: para essas coisas
  rationale: Reflete o demonstrativo plural e expressa naturalmente a ideia de estar à altura das realidades ou da tarefa que Paulo acaba de descrever.
- source_word: ἱκανός
  choice: suficiente
  rationale: Preserva o sentido de ser capaz ou estar à altura de uma tarefa, com o tom elevado da pergunta retórica.
theological_decisions:
- issue: Força interpretativa das expressões paralelas “de morte para morte” e “de vida para vida”
  choice: Conservar no texto principal a formulação compacta e ambígua do grego.
  alternative: Explicitar como “proveniente da morte e conduzindo à morte” / “proveniente da vida e conduzindo à vida”, ou entendê-las como caracterizações intensificadas.
  rationale: O texto não determina inequivocamente se as expressões indicam origem e resultado ou intensificação. A tradução preserva essa abertura e a tensão teológica em vez de escolher uma paráfrase interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Para uns... para outros” verte idiomaticamente o contraste distributivo do grego; o paralelismo conciso foi preservado.
