  terminology: A opção por “cheiro” mantém o campo semântico amplo de ὀσμή nos dois membros do contraste. “Morte”, “vida” e “suficiente” são escolhas terminologicamente estáveis e não introduzem interpretação doutrinária. As notas apresentam alternativas lexicais e a ambiguidade das expressões preposicionais de modo adequado.
