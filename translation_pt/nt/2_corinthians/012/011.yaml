id: 2CO.12.11
reference: 2 Corinthians 12:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Γέγονα ⸀ἄφρων· ὑμεῖς με ἠναγκάσατε· ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι. οὐδὲν γὰρ ὑστέρησα τῶν ὑπερλίαν ἀποστόλων, εἰ καὶ οὐδέν εἰμι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/011.yaml
  text: I have become a fool; you forced me to it. For I ought to have been commended by you[a], for I fell short in nothing compared with those super-apostles, even if I am nothing.
translation:
  language: pt
  text: Tornei-me insensato; vocês me obrigaram a isso. Pois eu é que deveria ter sido recomendado por vocês, porque em nada fui inferior aos superapóstolos[a], ainda que eu nada seja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos mais eminentes apóstolos”. A expressão grega é fortemente enfática e pode ser irônica neste contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: Γέγονα
  choice: Tornei-me
  rationale: O perfeito grego indica um estado presente resultante do que ocorreu; em português, o pretérito perfeito com verbo de mudança expressa naturalmente o estado alcançado.
- source_word: ἄφρων
  choice: insensato
  rationale: Preserva a autodescrição retórica de Paulo com linguagem digna e corrente; evita que “tolo” soe excessivamente coloquial.
- source_word: ὑμεῖς με ἠναγκάσατε
  choice: vocês me obrigaram a isso
  rationale: Mantém a ênfase no sujeito explícito ὑμεῖς e explicita apenas o complemento elíptico, isto é, sua fala insensata no contexto.
- source_word: ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι
  choice: Pois eu é que deveria ter sido recomendado por vocês
  rationale: “Eu é que” reproduz a ênfase de ἐγώ; a construção passiva e o agente são preservados. “Recomendado” comunica que os coríntios deveriam ter falado em favor de Paulo.
- source_word: οὐδὲν γὰρ ὑστέρησα
  choice: porque em nada fui inferior
  rationale: Expressa diretamente a ideia comparativa de não ficar atrás ou abaixo de alguém, preservando o segundo γάρ.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: aos superapóstolos
  rationale: Retém a intensificação incomum e a possível ironia da expressão, sem acrescentar no texto principal qualificações interpretativas como “pretensos”.
- source_word: εἰ καὶ οὐδέν εἰμι
  choice: ainda que eu nada seja
  rationale: Mantém a concessão e a forte autodepreciação do original sem transformar οὐδέν em “ninguém”.
theological_decisions:
- issue: Identidade e força retórica de τῶν ὑπερλίαν ἀποστόλων
  choice: “superapóstolos”, deixando implícita a provável ironia
  alternative: “os mais eminentes apóstolos”, como possível referência não irônica a apóstolos de grande reputação
  rationale: A expressão é fortemente enfática e, no contexto de 2 Coríntios, provavelmente polêmica; contudo, o grego não contém um marcador explícito equivalente a “pretensos”. A tradução conserva a tensão interpretativa.
- issue: Força de εἰ καί
  choice: “ainda que eu nada seja”
  alternative: “mesmo se eu nada sou”
  rationale: No contexto, a oração funciona naturalmente como concessão factual. A formulação escolhida preserva essa concessão sem atenuar a afirmação de Paulo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Vocês” evita regionalismo excessivo e mantém o contraste enfático com “eu é que”. A repetição causal de γάρ foi preservada por “Pois” e “porque”.
