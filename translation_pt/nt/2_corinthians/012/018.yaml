source:
  edition: SBLGNT
  text: παρεκάλεσα Τίτον καὶ συναπέστειλα τὸν ἀδελφόν· μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος; οὐ τῷ αὐτῷ πνεύματι περιεπατήσαμεν; οὐ τοῖς αὐτοῖς ἴχνεσιν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/018.yaml
  text: I urged Titus to go and sent the brother with him. Titus did not take advantage of you[a], did he? Did we not walk in the same spirit? Did we not walk in the same footsteps?
translation:
  language: pt
  text: Pedi a Tito que fosse e enviei o irmão com ele. Por acaso Tito se aproveitou de vocês? Não andamos no mesmo espírito[a]? Não seguimos os mesmos passos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelo mesmo Espírito”, possivelmente em referência ao Espírito Santo, e não apenas à mesma disposição ou atitude.'
    reason: Leitura alternativa legítima do dativo τῷ αὐτῷ πνεύματι e preservação da ambiguidade teológica.
lexical_decisions:
- source_word: παρεκάλεσα
  choice: Insisti com Tito
  rationale: No contexto de uma missão prática, παρακαλέω indica um pedido ou apelo insistente. A formulação é natural em português e evita acrescentar explicitamente «que fosse», embora esse movimento esteja implícito no contexto.
- source_word: συναπέστειλα
  choice: enviei com ele
  rationale: O verbo composto indica que o irmão foi enviado juntamente com Tito; o pronome explicita em português a relação presente no grego.
- source_word: τὸν ἀδελφόν
  choice: o irmão
  rationale: Preserva o artigo definido e não acrescenta um possessivo ausente no texto, referindo-se provavelmente a um irmão na fé conhecido dos leitores.
- source_word: μήτι ἐπλεονέκτησεν ὑμᾶς
  choice: Por acaso Tito se aproveitou de vocês?
  rationale: μήτι introduz uma pergunta que espera resposta negativa, e πλεονεκτέω indica obter vantagem à custa de alguém, possivelmente no âmbito financeiro. «Por acaso» comunica a expectativa retórica sem transformar a pergunta em afirmação.
- source_word: τῷ αὐτῷ πνεύματι
  choice: no mesmo espírito
  rationale: A expressão pode indicar a mesma disposição ou modo de agir e também admite possível referência ao Espírito Santo. A redação principal privilegia o sentido contextual sem eliminar a alternativa, registrada em nota.
- source_word: περιεπατήσαμεν
  choice: andamos
  rationale: Mantém a metáfora paulina de caminhar como modo de viver ou proceder, comum e compreensível em português bíblico moderno.
- source_word: τοῖς αὐτοῖς ἴχνεσιν
  choice: seguimos os mesmos passos
  rationale: ἴχνος designa pegadas ou rastros. «Seguir os mesmos passos» preserva a imagem e soa mais natural em português do que uma reprodução rígida da construção grega.
theological_decisions:
- issue: Sentido de «no mesmo espírito»
  choice: a mesma disposição ou orientação, com «espírito» em minúscula
  alternative: «pelo mesmo Espírito», em referência ao Espírito Santo
  rationale: O contexto imediato enfatiza a coerência entre a conduta de Paulo e a de Tito. Contudo, o dativo grego não exclui uma referência ao Espírito Santo; por isso, a alternativa é preservada em nota, sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Vocês» traduz o plural ὑμᾶς com clareza. As duas perguntas finais foram coordenadas para reproduzir o paralelismo retórico, mantendo as metáforas de andar e dos passos.
