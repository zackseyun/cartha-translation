id: 2CO.12.20
reference: 2 Corinthians 12:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: φοβοῦμαι γὰρ μή πως ἐλθὼν οὐχ οἵους θέλω εὕρω ὑμᾶς, κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε, μή πως ⸀ἔρις, ⸀ζῆλος, θυμοί, ἐριθεῖαι, καταλαλιαί, ψιθυρισμοί, φυσιώσεις, ἀκαταστασίαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/020.yaml
  text: For I fear that perhaps when I come I may find you not as I wish[a], and I may be found by you to be as you do not wish—that perhaps there may be strife, jealousy, outbursts of anger, selfish ambition, slanders, whisperings, conceit, and disorder.
translation:
  language: pt
  text: Pois temo que, quando eu chegar, talvez não os encontre como desejo, e que vocês me encontrem como não desejam. Temo que haja discórdias, ciúmes, explosões de ira, ambições egoístas, calúnias, cochichos[a], arrogância e desordens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fofocas”.
    reason: Alternativa lexical para ψιθυρισμοί, que pode indicar comentários maliciosos e secretos.
lexical_decisions:
- source_word: φοβοῦμαι ... μή πως
  choice: temo que ... talvez
  rationale: Expressa a apreensão presente de Paulo e a possibilidade temida sem transformar a declaração em certeza.
- source_word: ἐλθὼν
  choice: quando eu chegar
  rationale: O particípio aoristo tem sentido temporal no contexto e esta formulação é natural em português.
- source_word: οὐχ οἵους θέλω εὕρω ὑμᾶς
  choice: não os encontre como desejo
  rationale: Preserva a referência à condição ou conduta em que Paulo espera encontrar os coríntios.
- source_word: κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε
  choice: e que vocês me encontrem como não desejam
  rationale: Conserva o paralelismo recíproco entre Paulo encontrar os coríntios e eles encontrarem Paulo, usando voz ativa natural em português sem alterar o sentido.
- source_word: ἔρις
  choice: discórdias
  rationale: Designa conflitos e contendas dentro da comunidade; o plural harmoniza naturalmente com a lista.
- source_word: ζῆλος
  choice: ciúmes
  rationale: Neste catálogo de vícios, o contexto exige o sentido negativo, e não o de zelo positivo.
- source_word: θυμοί
  choice: explosões de ira
  rationale: O plural sugere manifestações repetidas e intensas de ira.
- source_word: ἐριθεῖαι
  choice: ambições egoístas
  rationale: Comunica a busca partidária de vantagem e promoção pessoal característica do termo paulino.
- source_word: καταλαλιαί
  choice: calúnias
  rationale: Refere-se à fala que difama ou denigre outras pessoas.
- source_word: ψιθυρισμοί
  choice: cochichos
  rationale: Preserva a imagem de comentários maliciosos feitos em voz baixa ou às escondidas; a nota registra a alternativa idiomática mais ampla.
- source_word: φυσιώσεις
  choice: arrogância
  rationale: Expressa o orgulho presunçoso associado à imagem de estar inflado.
- source_word: ἀκαταστασίαι
  choice: desordens
  rationale: Mantém o sentido amplo de perturbações e falta de ordem comunitária.
theological_decisions:
- issue: Tom do encontro temido por Paulo
  choice: Paulo teme desagrado recíproco e a presença de vícios comunitários.
  alternative: Explicitar que ele teme ter de exercer severidade apostólica ou encontrar a influência de falsos mestres.
  rationale: O versículo afirma diretamente a decepção recíproca e enumera pecados sociais, mas não identifica aqui uma única causa doutrinária nem explicita a forma da reação de Paulo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “temo” antes da lista torna clara em português a retomada de μή πως e evita uma sequência sintática excessivamente pesada. “Vocês” oferece clareza contemporânea para o plural ὑμεῖς/ὑμῖν.
source_grounding:
  english_pob_role: consult_only
