  text: Did I exploit you through any of those whom I sent to you?[a]
translation:
  language: pt
  text: Será que explorei vocês por meio de algum daqueles que enviei a vocês?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tirei vantagem de vocês” ou “fraudei vocês”. O verbo grego transmite a ideia de obter ganho à custa de outra pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή
  choice: Será que ...?
  rationale: Introduz uma pergunta retórica que espera resposta negativa; esta formulação é natural em português e mantém essa expectativa sem acrescentar uma negação explícita.
- source_word: τινα ὧν
  choice: algum daqueles que
  rationale: 'Preserva o sentido partitivo: qualquer indivíduo dentre o grupo enviado por Paulo.'
- source_word: ἀπέσταλκα
  choice: enviei
  rationale: O pretérito perfeito simples comunica naturalmente o envio já realizado; o estado resultante do perfeito grego não precisa ser explicitado aqui.
- source_word: πρὸς ὑμᾶς
  choice: a vocês
  rationale: Equivalente direcional corrente e claro no português moderno.
- source_word: δι’ αὐτοῦ
  choice: por meio de algum daqueles
  rationale: Embora o pronome grego seja singular, ele retoma distributivamente o indefinido anterior. A formulação portuguesa torna clara essa relação.
- source_word: ἐπλεονέκτησα
  choice: explorei
  rationale: Expressa a ideia de obter vantagem ou ganho injusto à custa de outra pessoa, de modo conciso e atual.
- source_word: ὑμᾶς
  choice: vocês
  rationale: Refere-se coletivamente aos cristãos de Corinto; “vocês” oferece ampla legibilidade brasileira.
