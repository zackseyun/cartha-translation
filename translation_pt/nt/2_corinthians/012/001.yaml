id: 2CO.12.1
reference: 2 Corinthians 12:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καυχᾶσθαι ⸀δεῖ· οὐ ⸂συμφέρον μέν⸃, ἐλεύσομαι ⸀δὲ εἰς ὀπτασίας καὶ ἀποκαλύψεις κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/001.yaml
  text: Boasting is necessary[a], though it is not beneficial[b]; but I will go on to visions and revelations of the Lord.
translation:
  language: pt
  text: É necessário gloriar-me, embora isso não seja proveitoso; passarei, porém, às visões e revelações do Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «vindas do Senhor». O genitivo grego pode indicar origem, mas «do Senhor» preserva melhor a formulação e a ambiguidade do grego.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχᾶσθαι
  choice: gloriar-me
  rationale: O infinitivo presente funciona como sujeito de δεῖ. Em português, «gloriar-me» expressa de modo natural o ato de vangloriar-se no contexto autobiográfico de Paulo, sem transformá-lo em substantivo abstrato.
- source_word: δεῖ
  choice: É necessário
  rationale: Preserva a ideia de necessidade e se ajusta naturalmente à construção com infinitivo.
- source_word: οὐ συμφέρον μέν
  choice: embora isso não seja proveitoso
  rationale: «Proveitoso» comunica o que é vantajoso ou benéfico, e «embora» representa naturalmente o valor concessivo de μέν no encadeamento com δέ.
- source_word: ἐλεύσομαι δὲ
  choice: mas passarei
  rationale: Neste contexto, o futuro de ἔρχομαι com εἰς indica transição para outro assunto. «Passarei» é idiomático em português, enquanto «mas» mantém o contraste marcado por δέ.
- source_word: εἰς ὀπτασίας
  choice: às visões
  rationale: «Visões» é a correspondência corrente e acessível para experiências visuais sobrenaturais, preservando o plural.
- source_word: καὶ ἀποκαλύψεις
  choice: e revelações
  rationale: «Revelações» é o equivalente estabelecido e adequado para comunicações ou desvelamentos divinos neste contexto.
- source_word: κυρίου
  choice: do Senhor
  rationale: O genitivo modifica naturalmente «visões e revelações». «Do Senhor» preserva melhor a forma e a ambiguidade do grego do que a explicitação «vindas do Senhor».
theological_decisions:
- issue: Relação de κυρίου com «visões e revelações»
  choice: do Senhor
  alternative: vindas do Senhor
  rationale: O genitivo pode indicar origem ou outra relação de pertencimento, mas o grego não exige que ela seja explicitada. A tradução mantém a ambiguidade e evita acrescentar uma precisão teológica não expressa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. «Gloriar-me» conserva o vocabulário paulino tradicional sem soar excessivamente arcaico; «passarei» sinaliza com clareza a transição discursiva.
