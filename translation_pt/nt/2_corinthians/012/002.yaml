reference: 2 Corinthians 12:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἶδα ἄνθρωπον ἐν Χριστῷ πρὸ ἐτῶν δεκατεσσάρων— εἴτε ἐν σώματι οὐκ οἶδα, εἴτε ἐκτὸς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν— ἁρπαγέντα τὸν τοιοῦτον ἕως τρίτου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/002.yaml
  text: I know a man in Messiah who[a], fourteen years ago—whether in the body I do not know, or outside the body I do not know[c][b], God knows—was caught up to the third heaven.
translation:
  language: pt
  text: Conheço um homem no Messias que, há catorze anos — não sei se no corpo, não sei se fora do corpo; Deus sabe —, foi arrebatado até o terceiro céu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O terceiro céu” conserva uma expressão da cosmologia judaica antiga; o contexto seguinte o associa ao paraíso. O texto não explica aqui a estrutura dos céus.
    reason: cultural_note
lexical_decisions:
- source_word: οἶδα
  choice: Conheço
  rationale: O perfeito οἶδα tem sentido presente no grego koiné; “conheço” é natural em português e introduz uma pessoa específica.
- source_word: ἄνθρωπον
  choice: um homem
  rationale: O substantivo masculino singular refere-se aqui a um indivíduo do sexo masculino, identificado indiretamente no contexto com o próprio Paulo.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Preserva o valor titular de Χριστός e a fórmula paulina de pertencimento ou união, sem expandi-la em paráfrase.
- source_word: πρὸ ἐτῶν δεκατεσσάρων
  choice: há catorze anos
  rationale: Equivalente temporal idiomático e exato em português.
- source_word: εἴτε ἐν σώματι ... εἴτε ἐκτὸς τοῦ σώματος
  choice: se no corpo ... se fora do corpo
  rationale: Mantém o paralelismo e a incerteza explícita de Paulo quanto ao modo da experiência.
- source_word: ὁ θεὸς οἶδεν
  choice: Deus sabe
  rationale: Tradução direta, sem acrescentar “somente”, que não está expresso no texto.
- source_word: ἁρπαγέντα
  choice: foi arrebatado
  rationale: O passivo expressa um transporte súbito sofrido pelo homem; “arrebatado” é corrente, digno e adequado ao contexto.
- source_word: ἕως τρίτου οὐρανοῦ
  choice: até o terceiro céu
  rationale: Conserva a expressão cosmológica antiga sem identificar ou explicar no corpo do texto o que seria o “terceiro céu”.
theological_decisions:
- issue: Valor de Χριστῷ em ἐν Χριστῷ
  choice: no Messias
  alternative: em Cristo
  rationale: A tradução verte o título Χριστός por seu sentido, “Messias”, preservando ao mesmo tempo a concisão da fórmula paulina.
- issue: Natureza da experiência de Paulo
  choice: Manter explícita a incerteza entre estar no corpo e estar fora do corpo
  alternative: Interpretar o acontecimento como ascensão corporal ou como visão desencarnada
  rationale: Paulo repete que não sabe e atribui esse conhecimento a Deus; a tradução não resolve o que o grego deixa em aberto.
- issue: Referente de “um homem”
  choice: Manter a referência indireta
  alternative: Substituir por “eu” ou identificar explicitamente o homem como Paulo
  rationale: Embora o contexto indique que Paulo fala de si, o versículo usa deliberadamente a terceira pessoa, que deve ser preservada.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A pontuação destaca o comentário parentético sem alterar a ordem lógica do grego. Evitou-se uma nota em “Messias” por não haver, neste versículo, necessidade textual de oferecer a forma tradicional “Cristo”; a decisão lexical já registra a alternativa.
