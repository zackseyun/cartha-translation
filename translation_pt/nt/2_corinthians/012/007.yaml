id: 2CO.12.7
reference: 2 Corinthians 12:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τῇ ὑπερβολῇ τῶν ἀποκαλύψεων. ⸀διὸ ἵνα μὴ ὑπεραίρωμαι, ἐδόθη μοι σκόλοψ τῇ σαρκί, ἄγγελος ⸀Σατανᾶ, ἵνα με κολαφίζῃ, ⸂ἵνα μὴ ὑπεραίρωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/007.yaml
  text: And because of the surpassing greatness of the revelations—so that I might not exalt myself—a thorn in the flesh was given to me[a], a messenger of Satan, so that it might torment me[e][d][c][b], so that I might not exalt myself.
translation:
  language: pt
  text: E, por causa da grandeza extraordinária das revelações — para que eu não me exaltasse — foi-me dado um espinho na carne[a], um mensageiro de Satanás[b], para me golpear[c], para que eu não me exaltasse[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma estaca na carne”. A palavra grega pode designar uma estaca pontiaguda, uma farpa ou um espinho; a imagem exata é incerta.
    reason: lexical_alternative
  - marker: b
    text: Ou “um anjo de Satanás”. A palavra grega pode significar “mensageiro” ou “anjo”.
    reason: alternative_reading
  - marker: c
    text: Ou “para me atormentar” ou “para me esmurrar”. O verbo grego se refere literalmente a bater ou desferir golpes.
    reason: lexical_alternative
  - marker: d
    text: A frase “para que eu não me exaltasse” aparece duas vezes no texto grego e foi mantida nas duas ocorrências.
    reason: textual_transparency
lexical_decisions:
- source_word: τῇ ὑπερβολῇ τῶν ἀποκαλύψεων
  choice: por causa da grandeza extraordinária das revelações
  rationale: Expressa o caráter excepcional das revelações e mantém a ligação causal sugerida pelo contexto, em português natural.
- source_word: ὑπεραίρωμαι
  choice: eu não me exaltasse
  rationale: Preserva o sentido reflexivo de elevar-se ou ensoberbecer-se e permite conservar literalmente a repetição grega.
- source_word: ἐδόθη μοι
  choice: foi-me dado
  rationale: Mantém a voz passiva e não identifica o agente que o texto deixa implícito.
- source_word: σκόλοψ τῇ σαρκί
  choice: um espinho na carne
  rationale: Conserva a metáfora tradicional e a incerteza quanto ao objeto pontiagudo e à natureza da aflição.
- source_word: ἄγγελος Σατανᾶ
  choice: um mensageiro de Satanás
  rationale: Mensageiro abrange tanto um emissário quanto um ser angelical, sem decidir a identidade do agente.
- source_word: κολαφίζῃ
  choice: me golpear
  rationale: Conserva a imagem concreta do verbo, que designa bater ou desferir golpes, sem reduzir seu sentido ao efeito mais interpretativo de atormentar.
theological_decisions:
- issue: Natureza do “espinho na carne”
  choice: Manter a metáfora sem identificar a aflição.
  alternative: Doença física, perseguição, oposição humana ou assédio demoníaco.
  rationale: O texto não especifica a natureza do espinho.
- issue: Agente de “foi-me dado”
  choice: Manter a construção passiva sem nomear quem deu.
  alternative: Deus o deu ou permitiu.
  rationale: A formulação grega não declara explicitamente o agente e preserva a tensão entre permissão divina e atuação satânica.
- issue: Identidade de ἄγγελος Σατανᾶ
  choice: um mensageiro de Satanás
  alternative: um anjo de Satanás
  rationale: Ἄγγελος admite ambos os sentidos; a opção principal evita determinar a natureza do agente.
- issue: Repetição de ἵνα μὴ ὑπεραίρωμαι
  choice: Conservar as duas ocorrências.
  alternative: Omitir uma delas por razões estilísticas.
  rationale: A repetição pertence ao texto grego e reforça a finalidade declarada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os travessões esclarecem a finalidade parentética sem eliminar a ordem enfática do grego; a colocação “foi-me dado” preserva a passiva de modo formal, mas natural no registro bíblico.
