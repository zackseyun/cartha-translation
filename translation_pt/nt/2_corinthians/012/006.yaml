  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν γὰρ θελήσω καυχήσασθαι, οὐκ ἔσομαι ἄφρων, ἀλήθειαν γὰρ ἐρῶ· φείδομαι δέ, μή τις εἰς ἐμὲ λογίσηται ὑπὲρ ὃ βλέπει με ἢ ἀκούει ⸀τι ἐξ ἐμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/006.yaml
  text: For if I should want to boast[a], I would not be foolish, for I would be speaking the truth. But I refrain, so that no one may reckon me above what he sees in me or hears from me.
translation:
  language: pt
  text: Pois, se eu quisesse me gloriar, não seria insensato, porque diria a verdade. Mas me contenho, para que ninguém pense a meu respeito além do que vê em mim ou ouve de mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ouve alguma coisa de mim”. O grego inclui explicitamente um elemento indefinido depois de “ouve”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θελήσω
  choice: se eu quisesse
  rationale: A construção ἐὰν com o subjuntivo aoristo apresenta uma possibilidade hipotética; o imperfeito do subjuntivo em português expressa essa contingência de modo natural.
- source_word: καυχήσασθαι
  choice: me gloriar
  rationale: No contexto paulino, o verbo pode indicar gloriar-se ou vangloriar-se, muitas vezes com ironia. “Me gloriar” preserva o termo recorrente no contexto sem impor de antemão uma censura moral.
- source_word: ἄφρων
  choice: insensato
  rationale: Reproduz o adjetivo predicativo e mantém a ligação com a linguagem de insensatez usada no contexto, em registro digno e atual.
- source_word: ἀλήθειαν γὰρ ἐρῶ
  choice: porque diria a verdade
  rationale: O futuro grego está subordinado à hipótese; o condicional português preserva essa relação e o sentido de fala verdadeira.
- source_word: φείδομαι
  choice: me contenho
  rationale: Neste contexto, o verbo indica que Paulo voluntariamente se limita e deixa de prosseguir na glória pessoal.
- source_word: λογίσηται
  choice: pense a meu respeito
  rationale: Expressa a avaliação ou consideração feita por outros, em português claro, sem reduzir o sentido a simples cálculo.
- source_word: ὑπὲρ ὃ
  choice: além do que
  rationale: Marca a ideia de exceder o padrão fornecido pelo que pode ser visto ou ouvido.
- source_word: βλέπει με
  choice: vê em mim
  rationale: Formula de modo natural a avaliação baseada no que é observável na pessoa de Paulo.
- source_word: ἀκούει τι ἐξ ἐμοῦ
  choice: ouve de mim
  rationale: Expressa de forma idiomática aquilo que procede de Paulo; a nota registra a possibilidade de explicitar o elemento indefinido τι.
theological_decisions:
- issue: A autodescrição de Paulo e sua contenção quanto a gloriar-se
  choice: A fala é apresentada como uma hipótese em que Paulo diria a verdade, embora decida se conter para não ser superestimado.
  alternative: Traduzir de modo a afirmar que Paulo teria pleno direito de se vangloriar, ou sugerir que toda forma de gloriar-se aqui seria necessariamente falsa ou pecaminosa.
  rationale: 'O grego sustenta a tensão: Paulo diz que não seria insensato porque falaria a verdade, mas ainda assim se contém. A tradução não transforma essa declaração contextual em uma doutrina geral sobre gloriar-se.'
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto mantém tom digno e claro. “Me gloriar” e “me contenho” são correntes no português brasileiro; a próclise após a pausa também favorece a naturalidade sem comprometer a compreensão internacional.
