id: 2CO.12.19
reference: 2 Corinthians 12:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Πάλαι δοκεῖτε ὅτι ὑμῖν ἀπολογούμεθα; ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν. τὰ δὲ πάντα, ἀγαπητοί, ὑπὲρ τῆς ὑμῶν οἰκοδομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/019.yaml
  text: Have you been thinking all along that we are defending ourselves to you? Before God[a], in Messiah, we are speaking. And everything, beloved[b], is for your building up.
translation:
  language: pt
  text: Vocês têm pensado todo esse tempo que estamos nos defendendo perante vocês? É diante de Deus, no Messias, que falamos. E tudo, amados, é para a edificação de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλαι
  choice: todo esse tempo
  rationale: No contexto da pergunta retórica, indica uma suposição mantida pelos leitores até o presente, não apenas um momento remoto no passado.
- source_word: δοκεῖτε
  choice: vocês têm pensado
  rationale: O presente grego, combinado com Πάλαι, é expresso naturalmente em português como uma percepção continuada até o momento atual.
- source_word: ἀπολογούμεθα
  choice: estamos nos defendendo
  rationale: Preserva o sentido de apresentar defesa ou justificar a si mesmo, sem recorrer a linguagem jurídica excessivamente técnica.
- source_word: ὑμῖν
  choice: perante vocês
  rationale: Indica que os coríntios seriam o público ou tribunal diante do qual Paulo supostamente estaria se defendendo.
- source_word: κατέναντι θεοῦ
  choice: diante de Deus
  rationale: Comunica tanto a presença de Deus quanto a responsabilidade perante ele.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Mantém Χριστός como título e preserva a ideia de que a fala ocorre na esfera da união ou relação com o Messias.
- source_word: λαλοῦμεν
  choice: falamos
  rationale: Forma corrente e direta, adequada à declaração enfática no presente.
- source_word: τὰ δὲ πάντα
  choice: E tudo
  rationale: δέ tem aqui força conectiva leve; 'tudo' abrange o conjunto das palavras e ações ministeriais de Paulo no contexto.
- source_word: ἀγαπητοί
  choice: amados
  rationale: Preserva o vocativo afetuoso e sua ligação lexical com o amor.
- source_word: ὑπὲρ τῆς ὑμῶν οἰκοδομῆς
  choice: para a edificação de vocês
  rationale: Conserva a metáfora de construção aplicada ao fortalecimento da comunidade e expressa claramente a finalidade.
theological_decisions:
- issue: Tradução de Χριστῷ
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός conserva valor titular; 'Messias' torna esse sentido explícito sem alterar a ideia de estar ou falar 'no Messias'.
- issue: Finalidade de tudo o que Paulo diz e faz
  choice: para a edificação de vocês
  alternative: para o fortalecimento de vocês
  rationale: A formulação preserva a metáfora de οἰκοδομή sem restringi-la a uma definição doutrinária específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção enfática 'É diante de Deus... que falamos' mantém o contraste entre uma suposta defesa perante os coríntios e a fala responsável perante Deus. Não foram acrescentadas notas, pois as variantes assinaladas na edição fornecida não vieram acompanhadas de leituras alternativas suficientes para documentação responsável.
