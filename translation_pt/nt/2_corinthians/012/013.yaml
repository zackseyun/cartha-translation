source:
  edition: SBLGNT
  text: τί γάρ ἐστιν ὃ ⸀ἡσσώθητε ὑπὲρ τὰς λοιπὰς ἐκκλησίας, εἰ μὴ ὅτι αὐτὸς ἐγὼ οὐ κατενάρκησα ὑμῶν; χαρίσασθέ μοι τὴν ἀδικίαν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/013.yaml
  text: For in what were you treated as inferior to the rest of the churches[c][b][a], except that I myself did not become a burden to you? Forgive me this wrong.
translation:
  language: pt
  text: Pois em que vocês foram tratados como inferiores às demais igrejas,[a] a não ser no fato de que eu mesmo não fui um peso para vocês?[b] Perdoem-me por esta injustiça.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram colocados em desvantagem em relação às outras igrejas”. O verbo grego pode indicar ser posto em posição inferior ou receber tratamento menos favorável.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, Paulo não lhes impôs um encargo financeiro, pois não aceitou sustento deles.
    reason: cultural_note
  - marker: c
    text: 'Paulo fala ironicamente: a suposta “injustiça” foi não ter sido um peso para eles.'
    reason: cross_reference
lexical_decisions:
- source_word: ἡσσώθητε
  choice: foram tratados como inferiores
  rationale: Expressa a ideia passiva de terem sido colocados em desvantagem ou em posição inferior, sem sugerir inferioridade intrínseca.
- source_word: ὑπὲρ τὰς λοιπὰς ἐκκλησίας
  choice: às demais igrejas
  rationale: No contexto comparativo, ὑπέρ marca a comparação; a formulação é natural em português após 'tratados como inferiores'.
- source_word: αὐτὸς ἐγώ
  choice: eu mesmo
  rationale: Preserva a ênfase pessoal do pronome intensivo e do sujeito explícito.
- source_word: οὐ κατενάρκησα ὑμῶν
  choice: não fui um peso para vocês
  rationale: Comunica de modo natural que Paulo não lhes impôs encargo material ou financeiro, sem transformar a explicação contextual em paráfrase no texto.
- source_word: χαρίσασθέ μοι
  choice: Perdoem-me
  rationale: Neste imperativo irônico, o sentido de perdoar transmite adequadamente a aparente retratação de Paulo.
- source_word: τὴν ἀδικίαν ταύτην
  choice: por esta injustiça
  rationale: Mantém a força de ἀδικία como 'injustiça' ou 'ato injusto' e preserva a ironia sem acrescentar exagero.
- source_word: τί γάρ ἐστιν ὃ
  choice: Pois em que
  rationale: Introduz naturalmente em português a pergunta retórica e preserva a ligação argumentativa de γάρ.
theological_decisions:
- issue: A autodefesa irônica de Paulo quanto ao sustento financeiro
  choice: Preservar a ironia pela formulação literal 'Perdoem-me por esta injustiça', sem explicitar sarcasmo no corpo do versículo.
  alternative: 'Ampliar a ironia, por exemplo: ''Perdoem-me por esta terrível injustiça''.'
  rationale: A ironia decorre do contexto e das próprias palavras gregas; inserir qualificadores ausentes resolveria de modo excessivo o efeito retórico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para leitura natural no Brasil. A sintaxe conserva a pergunta retórica, a ênfase em “eu mesmo” e o contraste irônico do original.
