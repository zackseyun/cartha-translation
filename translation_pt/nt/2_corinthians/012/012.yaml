source:
  edition: SBLGNT
  text: τὰ μὲν σημεῖα τοῦ ἀποστόλου κατειργάσθη ἐν ὑμῖν ἐν πάσῃ ⸀ὑπομονῇ, σημείοις ⸀τε καὶ τέρασιν καὶ δυνάμεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/012.yaml
  text: Indeed[a], the signs of an apostle were performed among you with all perseverance[b], with signs and wonders and powers.
translation:
  language: pt
  text: De fato, os sinais de um apóstolo foram realizados entre vocês com toda perseverança, com sinais, maravilhas e atos poderosos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Atos poderosos” também pode ser traduzido por “milagres” ou “obras poderosas”; o termo grego enfatiza manifestações de poder.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ μὲν σημεῖα
  choice: De fato, os sinais
  rationale: μέν, sem um δέ expresso, dá ênfase afirmativa ou concessiva; “De fato” comunica essa força com naturalidade, enquanto “sinais” preserva σημεῖα.
- source_word: τοῦ ἀποστόλου
  choice: de um apóstolo
  rationale: O genitivo pode ser qualitativo ou genérico, indicando sinais característicos de um apóstolo. A formulação também evita identificar obrigatoriamente a expressão apenas com Paulo.
- source_word: κατειργάσθη
  choice: foram realizados
  rationale: O aoristo passivo indica que os sinais foram efetuados. “Foram realizados” preserva a voz passiva e é idiomático neste contexto.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: A expressão se refere à atividade ocorrida no meio da comunidade de Corinto, não primariamente a algo interior aos destinatários.
- source_word: ἐν πάσῃ ὑπομονῇ
  choice: com toda perseverança
  rationale: ὑπομονή designa constância resistente em meio a dificuldades; “perseverança” é clara, atual e adequada ao contexto do ministério de Paulo.
- source_word: σημείοις τε καὶ τέρασιν καὶ δυνάμεσιν
  choice: sinais, maravilhas e atos poderosos
  rationale: A tríade descreve manifestações miraculosas. “Atos poderosos” expressa o sentido concreto de δυνάμεις sem confundi-lo lexicalmente com os “sinais” anteriores.
theological_decisions:
- issue: Sentido de “os sinais de um apóstolo”
  choice: Evidências que autenticam o ministério apostólico, manifestadas na perseverança e em sinais, maravilhas e atos poderosos.
  alternative: Milagres exclusivamente, entendidos como os únicos sinais definidores do apostolado.
  rationale: A sintaxe apresenta a perseverança como circunstância abrangente e a tríade final como especificação ou manifestação dos sinais. A tradução conserva essa relação sem formular uma lista doutrinária fechada de credenciais apostólicas.
- issue: Valor de τοῦ ἀποστόλου
  choice: “de um apóstolo”, em sentido qualitativo ou genérico.
  alternative: “do apóstolo”, como referência específica a Paulo.
  rationale: O grego admite a forma definida, mas o contexto permite entender a expressão como aquilo que caracteriza um apóstolo. A opção principal preserva esse sentido, sem excluir que Paulo esteja aplicando-o ao próprio ministério.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação com dois-pontos apresenta a tríade final como explicação dos “sinais”, evitando a repetição pouco natural de “com ... com”. Mantém-se “um apóstolo” para preservar a leitura qualitativa/genérica mais provável.
