source:
  edition: SBLGNT
  text: ὅτι ἡρπάγη εἰς τὸν παράδεισον καὶ ἤκουσεν ἄρρητα ῥήματα ἃ οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/004.yaml
  text: that he was caught up into paradise and heard inexpressible words, which a man is not permitted to speak.
translation:
  language: pt
  text: foi arrebatado ao paraíso e ouviu palavras inexprimíveis, que não é permitido ao ser humano pronunciar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρπάγη
  choice: foi arrebatado
  rationale: Mantém a voz passiva e a ideia de ser levado de modo súbito ou por força, sem identificar explicitamente quem realizou a ação.
- source_word: παράδεισον
  choice: paraíso
  rationale: Equivalente direto e tradicional, preservando a referência sem explicar além do texto.
- source_word: ἄρρητα ῥήματα
  choice: palavras inexprimíveis
  rationale: Reproduz de forma concisa a ideia de palavras que não podem ser expressas, sem eliminar a possível relação com a proibição mencionada em seguida.
- source_word: οὐκ ἐξὸν
  choice: não é permitido
  rationale: Expressa a noção de não ser lícito ou permitido, em vez de mera incapacidade.
- source_word: ἀνθρώπῳ
  choice: ao ser humano
  rationale: O substantivo é genérico no contexto; esta forma comunica a referência à humanidade sem restringi-la ao sexo masculino.
- source_word: λαλῆσαι
  choice: pronunciar
  rationale: Indica proferir verbalmente as palavras ouvidas e soa natural com “palavras”.
theological_decisions:
- issue: Natureza da impossibilidade relativa às palavras ouvidas
  choice: não é permitido
  alternative: não é possível
  rationale: οὐκ ἐξὸν aponta primariamente para falta de permissão ou licitude. A tradução preserva a tensão com “inexprimíveis” sem transformar a segunda oração em simples incapacidade linguística.
- issue: Identidade do agente do arrebatamento
  choice: voz passiva sem agente expresso
  alternative: foi arrebatado por Deus
  rationale: O grego não nomeia o agente; explicitar Deus resolveria uma informação que o versículo deixa implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura acompanha de perto o grego, mas evita rigidez desnecessária. Não há marcadores de nota porque nenhuma nota é necessária.
