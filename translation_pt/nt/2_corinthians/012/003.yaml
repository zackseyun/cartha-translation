  text: And I know such a man—whether in the body or apart from the body I do not know[a]; God knows—
translation:
  language: pt
  text: E conheço tal homem — se no corpo ou fora do corpo, não sei[a]; Deus sabe —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “separado do corpo”. Paulo não diz se a experiência ocorreu no corpo ou fora dele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: conheço / sei / sabe
  rationale: O verbo expressa conhecimento. Em português, “conheço” é natural com o objeto pessoal “esse homem”, enquanto “sei” e “sabe” são idiomáticos nas orações seguintes; a repetição conceitual é preservada.
- source_word: τὸν τοιοῦτον ἄνθρωπον
  choice: esse homem
  rationale: No contexto, a expressão retoma o homem mencionado anteriormente e conserva tanto o masculino singular quanto a referência indireta de Paulo. “Esse homem” é mais natural em português do que o literal “tal homem” neste encadeamento.
- source_word: εἴτε ... εἴτε
  choice: se ... ou
  rationale: A construção apresenta duas possibilidades alternativas; “se... ou” reproduz essa indeterminação de modo corrente em português.
- source_word: ἐν σώματι
  choice: no corpo
  rationale: Equivalente formal e idiomático que preserva o contraste espacial ou existencial sem explicar a natureza da experiência.
- source_word: χωρὶς τοῦ σώματος
  choice: fora do corpo
  rationale: χωρίς indica separação. “Fora do corpo” é claro e natural em português, mas não afirma que a experiência tenha sido desse tipo, pois permanece dentro da alternativa não resolvida.
- source_word: οὐκ οἶδα, ὁ θεὸς οἶδεν
  choice: não sei; Deus sabe
  rationale: Mantém o contraste enfático entre a ignorância de Paulo e o conhecimento de Deus; o ponto e vírgula marca adequadamente a pausa.
- source_word: θεὸς
  choice: Deus
  rationale: Referência inequívoca a Deus; forma padrão em português.
theological_decisions:
- issue: A referência indireta de Paulo a si mesmo e a natureza da experiência
  choice: Manter “esse homem” e deixar sem solução se a experiência ocorreu no corpo ou fora dele.
  alternative: Identificar explicitamente o homem como Paulo, usar uma formulação genérica como “essa pessoa” ou afirmar que foi uma experiência extracorpórea.
  rationale: O grego conserva a distância retórica e não decide entre uma experiência corporal e uma experiência fora do corpo. A tradução preserva essa ambiguidade e tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Esse homem” retoma naturalmente a pessoa mencionada no contexto anterior; “fora do corpo” é corrente sem resolver a alternativa apresentada. O travessão final preserva a continuidade sintática com o versículo seguinte.
