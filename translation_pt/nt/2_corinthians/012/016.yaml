  text: ἔστω δέ, ἐγὼ οὐ κατεβάρησα ὑμᾶς· ἀλλὰ ὑπάρχων πανοῦργος δόλῳ ὑμᾶς ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/016.yaml
  text: 'But let it be so: I did not burden you[a]. Yet, being crafty[c][b], I took you by deceit.'
translation:
  language: pt
  text: 'Mas seja assim: eu não fui um peso para vocês.[a] Contudo, sendo ardiloso,[b] peguei vocês com engano.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Admitamos, então” ou “Seja como for”. Paulo parece conceder o ponto para fins de argumentação.'
    reason: lexical_alternative
  - marker: b
    text: A frase “sendo ardiloso, peguei vocês com engano” provavelmente repete de modo irônico uma acusação feita contra Paulo, e não constitui uma confissão.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “peguei vocês por meio de uma artimanha” ou “tirei proveito de vocês por meio do engano”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστω δέ
  choice: Mas seja assim
  rationale: Expressa a concessão retórica de Paulo sem explicitar além do grego que ele admite o ponto apenas para argumentar.
- source_word: κατεβάρησα
  choice: fui um peso para
  rationale: Preserva a metáfora de impor um peso e, no contexto, admite naturalmente a referência ao sustento material ou financeiro.
- source_word: ὑπάρχων
  choice: sendo
  rationale: Mantém a forma circunstancial do particípio sem determinar se a relação deve ser entendida como causal, concessiva ou meramente descritiva.
- source_word: πανοῦργος
  choice: astuto
  rationale: Termo corrente e digno que, neste contexto acusatório, pode comunicar esperteza inescrupulosa sem acrescentar uma interpretação denominacional.
- source_word: δόλῳ
  choice: com engano
  rationale: Traduz o dativo instrumental de modo conciso e natural, indicando o suposto meio empregado.
- source_word: ἔλαβον
  choice: apanhei
  rationale: Conserva a imagem de pegar ou capturar alguém por meio de uma artimanha, evitando resolver no texto principal se o sentido é explorar ou ludibriar.
theological_decisions:
- issue: Se as palavras após ἀλλὰ constituem uma confissão de Paulo ou uma repetição irônica de uma acusação
  choice: Manter a afirmação direta no texto e explicar em nota seu provável caráter irônico.
  alternative: 'Parafrasear no texto: “vocês dizem que, sendo astuto, eu os apanhei com engano”.'
  rationale: O contexto mais amplo nega que Paulo tenha explorado os coríntios, mas a construção grega apresenta a acusação diretamente. A tradução preserva essa tensão retórica sem transformar a frase em confissão literal nem inserir no texto palavras que não estão expressas.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Vocês” oferece clareza contemporânea; “fui um peso” preserva a metáfora contextual, enquanto “apanhei” mantém a força figurada de captura sem soar excessivamente técnica. As notas registram as alternativas e a provável ironia.
