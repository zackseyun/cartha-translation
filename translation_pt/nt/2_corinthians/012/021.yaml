  text: μὴ πάλιν ⸂ἐλθόντος μου⸃ ⸀ταπεινώσῃ ⸀με ὁ θεός μου πρὸς ὑμᾶς, καὶ πενθήσω πολλοὺς τῶν προημαρτηκότων καὶ μὴ μετανοησάντων ἐπὶ τῇ ἀκαθαρσίᾳ καὶ πορνείᾳ καὶ ἀσελγείᾳ ᾗ ἔπραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/021.yaml
  text: I fear that when I come again[a], my God may humble me before you[d][c][b], and I will mourn over many who have sinned before and have not repented of the impurity and sexual immorality and sensuality that they practiced.
translation:
  language: pt
  text: Temo que, quando eu voltar[a], meu Deus me humilhe diante de vocês[b] e eu chore por muitos dos que pecaram anteriormente[c] e não se arrependeram da impureza, da imoralidade sexual e da libertinagem[d] que praticaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando eu vier novamente”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “me abata entre vocês”. O verbo grego pode significar “humilhar”, “rebaixar” ou “abater”, conforme o contexto.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “muitos dos que já haviam pecado”.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “devassidão”. O termo grego indica conduta desregrada e sem pudor, muitas vezes de caráter sexual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάλιν ἐλθόντος μου
  choice: Temo que, quando eu for novamente
  rationale: O temor é retomado do versículo anterior; explicitá-lo em português torna a continuação sintática clara. πάλιν indica uma nova visita.
- source_word: ταπεινώσῃ με ὁ θεός μου πρὸς ὑμᾶς
  choice: meu Deus me humilhe diante de vocês
  rationale: “Humilhe” preserva a ideia de ser rebaixado ou abatido, sem decidir se se trata estritamente de humilhação pública. “Diante de vocês” situa isso na presença dos coríntios.
- source_word: καὶ πενθήσω
  choice: e eu tenha de chorar
  rationale: No escopo do temor, o subjuntivo português expressa naturalmente o acontecimento receado. “Chorar por” comunica a dor intensa de πενθέω de modo atual e digno.
- source_word: πολλοὺς τῶν προημαρτηκότων
  choice: muitos dos que pecaram anteriormente
  rationale: A construção partitiva é preservada, e “anteriormente” traduz a prioridade temporal do verbo, deixando aberta a referência exata.
- source_word: μὴ μετανοησάντων
  choice: não se arrependeram
  rationale: Expressa a ausência de arrependimento até o momento relevante da visita, sem acrescentar uma explicação doutrinária.
- source_word: ἀκαθαρσίᾳ
  choice: impureza
  rationale: Termo moderno e amplo para impureza moral, apropriado à lista de vícios.
- source_word: πορνείᾳ
  choice: imoralidade sexual
  rationale: Equivalente contemporâneo e abrangente, mais claro que o tradicional “fornicação” e sem restringir indevidamente o termo grego.
- source_word: ἀσελγείᾳ
  choice: libertinagem
  rationale: Comunica conduta desregrada e descaradamente entregue aos desejos; no contexto, possui provável dimensão sexual.
- source_word: ᾗ ἔπραξαν
  choice: que praticaram
  rationale: O relativo retoma coletivamente os três vícios, e πράσσω pode indicar conduta efetivamente praticada.
theological_decisions:
- issue: Continuação da declaração de temor iniciada no versículo anterior
  choice: Explicitar “Temo que” e manter toda a frase no âmbito do que Paulo receia
  alternative: Traduzir literalmente como uma oração independente iniciada por “para que não” ou “não aconteça que”
  rationale: O μή depende do verbo de temor no contexto anterior. A explicitação é sintática e não altera o conteúdo teológico.
- issue: Natureza do rebaixamento de Paulo por Deus
  choice: “meu Deus me humilhe diante de vocês”
  alternative: “meu Deus me abata entre vocês”
  rationale: O texto pode sugerir tanto ser abatido quanto sofrer humilhação na presença da comunidade. O texto principal conserva a formulação mais direta, e a nota registra a alternativa.
- issue: Distinção entre os três vícios
  choice: “impureza, imoralidade sexual e libertinagem”
  alternative: “impureza, prostituição e devassidão”
  rationale: Mantêm-se três termos distintos e parcialmente sobrepostos, sem reduzi-los a uma única categoria nem lhes impor definições confessionais estreitas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Usa “vocês” para o plural e evita termos hoje pouco naturais, como “fornicação”. A coordenação da lista foi mantida, enquanto “tenha de chorar” integra naturalmente a segunda consequência ao temor expresso no início.
