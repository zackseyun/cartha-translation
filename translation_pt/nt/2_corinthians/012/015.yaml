reference: 2 Corinthians 12:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἥδιστα δαπανήσω καὶ ἐκδαπανηθήσομαι ὑπὲρ τῶν ψυχῶν ὑμῶν. ⸀εἰ περισσοτέρως ὑμᾶς ⸀ἀγαπῶν, ἧσσον ἀγαπῶμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/015.yaml
  text: But I will most gladly spend and be spent for your souls. If I love you more abundantly[a], am I loved less?
translation:
  language: pt
  text: Eu, porém, com a maior alegria, gastarei e serei gasto em favor das almas de vocês.[a] Se eu amo vocês ainda mais, sou amado menos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das vidas de vocês” ou “de vocês mesmos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδιστα
  choice: com a maior alegria
  rationale: Expressa o superlativo e a disposição calorosa de Paulo em português natural, indo além de mero consentimento.
- source_word: δαπανήσω
  choice: gastarei
  rationale: Preserva a metáfora de despender recursos e prepara o jogo verbal com ἐκδαπανηθήσομαι.
- source_word: ἐκδαπανηθήσομαι
  choice: me deixarei gastar
  rationale: 'Mantém a voz passiva e a intensificação: Paulo não apenas gasta o que possui, mas permite que ele próprio seja consumido no serviço.'
- source_word: ὑπὲρ
  choice: em favor de
  rationale: Comunica claramente benefício e propósito sacrificial sem acrescentar uma ideia estranha ao contexto.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: da vida de vocês
  rationale: Neste contexto pastoral, ψυχή pode designar a vida ou a própria pessoa. A formulação é natural em português e evita impor uma antropologia técnica, enquanto a nota preserva as alternativas mais formais.
- source_word: εἰ
  choice: Se
  rationale: Conserva a forma condicional da pergunta retórica, sem convertê-la interpretativamente em uma afirmação causal.
- source_word: περισσοτέρως
  choice: mais intensamente
  rationale: Transmite o grau comparativo elevado do advérbio de modo corrente e evita que 'mais abundantemente' soe artificial aplicado ao verbo amar.
- source_word: ἀγαπῶν
  choice: eu os amo
  rationale: Converte naturalmente o particípio grego em oração finita portuguesa, preservando sua relação com a condição.
- source_word: ἧσσον
  choice: menos
  rationale: Equivalente comparativo direto, em contraste claro com περισσοτέρως.
- source_word: ἀγαπῶμαι
  choice: sou menos amado
  rationale: Preserva o presente passivo e a queixa retórica de Paulo sem especificar indevidamente quem o ama menos.
theological_decisions:
- issue: Sentido de ψυχή no cuidado pastoral de Paulo
  choice: da vida de vocês
  alternative: das almas de vocês; de vocês mesmos
  rationale: ψυχή pode referir-se à alma, à vida ou à pessoa inteira. 'Vida' mantém o peso pessoal do sacrifício de Paulo sem restringir o termo a uma parte imaterial do ser humano; a nota registra as alternativas legítimas.
- issue: Força da condição introduzida por εἰ
  choice: Se eu os amo mais intensamente, sou menos amado?
  alternative: Visto que eu os amo mais intensamente, sou menos amado?
  rationale: A tradução mantém a ambiguidade formal entre uma condição retórica e uma premissa que Paulo considera verdadeira, sem resolvê-la em favor de uma leitura causal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora paralela “gastarei e me deixarei gastar” foi mantida apesar de sua formulação marcada, pois é central ao efeito retórico do grego.
