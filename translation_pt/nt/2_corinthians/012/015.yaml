review_pass:
  verdict: revise
  source_fidelity: A tradução preserva a estrutura condicional e a pergunta retórica, bem como o contraste entre gastar e ser gasto. Contudo, “me deixarei gastar” acrescenta a noção de consentir ou permitir, que não está expressa no futuro passivo ἐκδαπανηθήσομαι. Além disso, “da vida de vocês” no singular reduz indevidamente o plural τῶν ψυχῶν e pode estreitar o sentido para a vida física.
  naturalness: O registro é geralmente moderno e claro. “Gastarei e serei gasto” é uma formulação deliberadamente metafórica, mas é compreensível e reproduz melhor o paralelismo enfático do original do que “me deixarei gastar”. “Eu amo vocês” favorece a legibilidade brasileira sem prejudicar a compreensão internacional.
  terminology: “Almas” mantém a forma lexical e o peso pastoral de ψυχαί, sem exigir uma antropologia técnica; as alternativas “vidas” e “vocês mesmos” devem constar na nota. “Ainda mais” expressa de modo natural a intensificação comparativa de περισσοτέρως.
  issues:
  - severity: medium
    issue: “me deixarei gastar” para ἐκδαπανηθήσομαι
    rationale: A expressão introduz uma ideia reflexiva e volitiva (“permitirei que me gastem”) ausente do passivo grego. O texto afirma que Paulo será gasto/consumido, em paralelo com o que ele gastará.
  - severity: medium
    issue: “em favor da vida de vocês” para τῶν ψυχῶν ὑμῶν
    rationale: O singular “vida” não reflete o plural grego, e a expressão pode limitar ψυχαί à vida física. “Almas” é a correspondência direta; a nota pode preservar os sentidos alternativos legítimos.
  revised_text: Eu, porém, com a maior alegria, gastarei e serei gasto em favor das almas de vocês.[a] Se eu amo vocês ainda mais, sou amado menos?
  revised_footnotes:
  - marker: a
    text: Ou “das vidas de vocês” ou “de vocês mesmos”.
    reason: lexical_alternative
