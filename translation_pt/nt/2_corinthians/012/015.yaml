revisions:
- from: Eu, porém, com a maior alegria, gastarei e me deixarei gastar em favor da vida de vocês.[a] Se eu os amo mais intensamente, sou menos amado?
  to: Eu, porém, com a maior alegria, gastarei e serei gasto em favor das almas de vocês.[a] Se eu amo vocês ainda mais, sou amado menos?
  rationale: A revisão elimina a ideia adicional de permissão em “me deixarei gastar”, restaura o plural de ψυχαί e preserva seu sentido lexical principal por “almas”, com alternativas na nota. Mantém-se a metáfora dupla de gasto e autodoação, a condicional retórica e a intensidade comparativa sem impor interpretação doutrinária.
