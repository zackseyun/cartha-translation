id: 2CO.12.5
reference: 2 Corinthians 12:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑπὲρ τοῦ τοιούτου καυχήσομαι, ὑπὲρ δὲ ἐμαυτοῦ οὐ καυχήσομαι εἰ μὴ ἐν ταῖς ⸀ἀσθενείαις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/005.yaml
  text: On behalf of such a one I will boast[a], but on behalf of myself I will not boast[b], except in my weaknesses.
translation:
  language: pt
  text: Quanto a alguém assim, eu me gloriarei[a]; mas, quanto a mim mesmo, não me gloriarei, a não ser nas minhas fraquezas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a respeito de alguém assim”. A preposição grega admite uma formulação mais geral; “quanto a” preserva o distanciamento retórico de Paulo sem indicar que ele age em benefício da pessoa.
    reason: lexical_alternative
  - marker: b
    text: Ou “nas fraquezas”. Em Paulo, “fraqueza” pode abranger fragilidade humana, sofrimento ou limitações nas quais se manifesta o poder de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: quanto a
  rationale: Com o genitivo, introduz a pessoa a respeito de quem se faz a afirmação. “Quanto a” é natural em português, preserva a referência relacional e evita sugerir que Paulo se gloria em benefício dessa pessoa.
- source_word: τοῦ τοιούτου
  choice: alguém assim
  rationale: Preserva a formulação indireta e o distanciamento retórico sem acrescentar uma indicação masculina que não está explícita no grego.
- source_word: καυχήσομαι
  choice: eu me gloriarei
  rationale: “Gloriar-se” é uma equivalência corrente e digna para καυχάομαι no uso paulino, mantendo sua tensão entre orgulho indevido e uma forma paradoxal de gloriar-se.
- source_word: ἐμαυτοῦ
  choice: mim mesmo
  rationale: O pronome reflexivo é contrastivo e identifica o próprio Paulo como referência.
- source_word: εἰ μὴ
  choice: a não ser
  rationale: Neste contexto, introduz uma exceção, e não uma condição.
- source_word: ἐν ταῖς ἀσθενείαις
  choice: nas minhas fraquezas
  rationale: “Fraquezas” comunica de modo amplo fragilidade, sofrimento ou limitações. O possessivo “minhas” é explicitado naturalmente em português pelo contraste com “mim mesmo” e pelo referente contextual.
theological_decisions:
- issue: Natureza do gloriar-se permitido a Paulo
  choice: Paulo contrasta gloriar-se quanto à pessoa associada à experiência extraordinária com gloriar-se quanto a si mesmo, permitindo este último apenas em suas fraquezas.
  alternative: A pessoa mencionada pode ser literalmente distinta de Paulo; ou a declaração pode expressar apenas um princípio geral de gloriar-se na fraqueza.
  rationale: A redação mantém o distanciamento retórico e a tensão autobiográfica do texto, sem decidir explicitamente se “alguém assim” é Paulo ou outra pessoa.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção mantém tom digno e a antítese do original. “Alguém assim” reproduz o caráter indireto de τοῦ τοιούτου; “gloriar-se” conserva a linguagem paulina tradicional sem se tornar arcaica.
