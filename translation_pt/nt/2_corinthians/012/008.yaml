  yaml_path: translation/nt/2_corinthians/012/008.yaml
  text: Concerning this[d][c][b][a], three times I pleaded with the Lord that it might depart from me.
translation:
  language: pt
  text: A respeito disso[a], três vezes supliquei[b] ao Senhor[c] que se afastasse de mim[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Por causa disso” ou “Quanto a isso”.
    reason: lexical_alternative
  - marker: b
    text: Ou “pedi insistentemente” ou “implorei”.
    reason: lexical_alternative
  - marker: c
    text: O grego diz somente “o Senhor”; Paulo não menciona explicitamente Jesus aqui.
    reason: alternative_reading
  - marker: d
    text: Ou “que fosse embora de mim”. O grego deixa o sujeito implícito, retomando o que foi mencionado no versículo anterior.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ τούτου
  choice: A respeito disso
  rationale: ὑπέρ com o genitivo introduz aqui o assunto da súplica e retoma a aflição mencionada no versículo anterior. “A respeito disso” é claro e natural em português.
- source_word: τρὶς
  choice: três vezes
  rationale: O advérbio indica três ocasiões; “três vezes” é a forma corrente e inequívoca em português moderno.
- source_word: τὸν κύριον
  choice: ao Senhor
  rationale: Mantém o título κύριος sem acrescentar o nome de Jesus, que não aparece explicitamente no texto grego.
- source_word: παρεκάλεσα
  choice: supliquei
  rationale: No contexto de uma oração insistente por alívio, “supliquei” comunica adequadamente o pedido fervoroso expresso por παρακαλέω.
- source_word: ἵνα ἀποστῇ ἀπ’ ἐμοῦ
  choice: que se afastasse de mim
  rationale: A construção expressa o conteúdo da súplica. O sujeito não expresso é preservado em português, evitando decidir entre o “espinho” e o “mensageiro” do versículo anterior.
theological_decisions:
- issue: Referente de “o Senhor”
  choice: Manter “ao Senhor” sem explicitar o nome
  alternative: ao Senhor Jesus
  rationale: Embora neste contexto paulino o referente provavelmente seja Jesus, o grego diz apenas τὸν κύριον. A tradução não acrescenta uma identificação que o versículo deixa implícita.
- issue: Sujeito de ἀποστῇ
  choice: Deixar o sujeito implícito em “que se afastasse”
  alternative: que ele se afastasse; que isso se afastasse; que o espinho se afastasse; que o mensageiro se afastasse
  rationale: O grego não expressa o sujeito e o contexto anterior menciona tanto um “espinho na carne” quanto um “mensageiro de Satanás”. O sujeito oculto, natural em português, preserva essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita arcaísmos e conserva tanto a referência não explicitada de “Senhor” quanto a ambiguidade gramatical do sujeito de “se afastasse”.
