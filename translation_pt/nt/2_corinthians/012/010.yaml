id: 2CO.12.10
reference: 2 Corinthians 12:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὸ εὐδοκῶ ἐν ἀσθενείαις, ἐν ὕβρεσιν, ἐν ἀνάγκαις, ἐν διωγμοῖς ⸀καὶ στενοχωρίαις, ὑπὲρ Χριστοῦ· ὅταν γὰρ ἀσθενῶ, τότε δυνατός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/010.yaml
  text: Therefore I delight in weaknesses[a], in insults, in hardships, in persecutions and distresses, for the sake of Messiah; for when I am weak, then I am strong.
translation:
  language: pt
  text: Por isso, tenho prazer nas fraquezas, nos insultos, nas adversidades, nas perseguições e nas angústias, por causa do Messias[a]; pois, quando sou fraco, então sou forte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, tradicionalmente, “por causa de Cristo”.
    reason: Registra a tradução tradicional de Χριστός sem substituir no texto principal seu sentido titular.
lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Expressa de modo natural a conclusão inferida do argumento anterior.
- source_word: εὐδοκῶ
  choice: tenho prazer
  rationale: Preserva a ideia de aprovação ou satisfação positiva, sem reduzi-la a mera resignação.
- source_word: ἐν ἀσθενείαις
  choice: nas fraquezas
  rationale: Mantém o plural e o sentido amplo de fragilidades, sem restringi-lo a enfermidades físicas.
- source_word: ἐν ὕβρεσιν
  choice: nos insultos
  rationale: Comunica de forma clara o tratamento humilhante ou ultrajante indicado pelo termo.
- source_word: ἐν ἀνάγκαις
  choice: nas adversidades
  rationale: No contexto, refere-se a circunstâncias opressivas e dificuldades impostas; “adversidades” é natural e não se confunde com as angústias da expressão seguinte.
- source_word: ἐν διωγμοῖς
  choice: nas perseguições
  rationale: Corresponde ao sentido estabelecido do termo no contexto paulino.
- source_word: καὶ στενοχωρίαις
  choice: e nas angústias
  rationale: Conserva a imagem de pressão e aperto intenso, expressando aflição severa.
- source_word: ὑπὲρ Χριστοῦ
  choice: por causa do Messias
  rationale: Expressa que os sofrimentos são suportados em razão da fidelidade ao Messias e mantém Χριστός como título.
- source_word: ὅταν γὰρ ἀσθενῶ
  choice: pois, quando sou fraco
  rationale: Reproduz o valor temporal geral de ὅταν com o presente do subjuntivo em formulação portuguesa idiomática.
- source_word: τότε δυνατός εἰμι
  choice: então sou forte
  rationale: Mantém diretamente o contraste paradoxal entre fraco e forte.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός conserva força titular; “Messias” torna explícito esse valor sem eliminar a tradução tradicional, registrada em nota.
- issue: Natureza da força na frase final
  choice: então sou forte
  alternative: então sou poderoso
  rationale: A tradução mantém a formulação paradoxal do texto e não explicita indevidamente que a força é divina, embora o contexto anterior sustente essa compreensão.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com boa legibilidade brasileira. A repetição das preposições e dos artigos preserva o ritmo enumerativo do grego; o ponto e vírgula mantém unidas a afirmação e sua explicação paradoxal.
