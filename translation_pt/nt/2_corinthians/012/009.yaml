id: 2CO.12.9
reference: 2 Corinthians 12:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἴρηκέν μοι· Ἀρκεῖ σοι ἡ χάρις μου· ἡ γὰρ ⸀δύναμις ἐν ἀσθενείᾳ ⸀τελεῖται. ἥδιστα οὖν μᾶλλον καυχήσομαι ἐν ταῖς ἀσθενείαις ⸀μου, ἵνα ἐπισκηνώσῃ ἐπ’ ἐμὲ ἡ δύναμις τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/009.yaml
  text: And he has said to me[a], “My grace is sufficient for you, for my power is made perfect in weakness.” Therefore I will boast all the more gladly in my weaknesses[d][c][b], so that the power of Messiah may dwell upon me.
translation:
  language: pt
  text: 'E ele me disse: “A minha graça é suficiente para você, pois o poder se aperfeiçoa na fraqueza”.[a] Portanto, com muito mais alegria me gloriarei nas minhas fraquezas, para que o poder do Messias[b] repouse sobre mim.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode entender: “pois o meu poder se aperfeiçoa na fraqueza”. O texto grego impresso diz literalmente “o poder”, sem possessivo explícito. “Se aperfeiçoa” também pode ser traduzido por “chega à plena realização”.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradicionalmente: “de Cristo”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “habite sobre mim”; mais literalmente, “arme sua tenda sobre mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκέν
  choice: disse
  rationale: O perfeito grego apresenta uma declaração passada que continua válida. Em português corrente, o pretérito perfeito simples expressa isso com mais naturalidade do que construções como “tem dito”, que poderiam sugerir repetição.
- source_word: Ἀρκεῖ
  choice: é suficiente
  rationale: Expressa adequação de modo claro, atual e digno.
- source_word: χάρις
  choice: graça
  rationale: Preserva o termo paulino consagrado e sua densidade teológica, que vai além de simples favor.
- source_word: δύναμις
  choice: poder
  rationale: Mantém a repetição lexical no versículo e a ligação entre o poder manifestado na fraqueza e o poder do Messias.
- source_word: ἀσθενείᾳ / ἀσθενείαις
  choice: fraqueza / fraquezas
  rationale: Conserva a passagem do princípio geral no singular para as experiências concretas de Paulo no plural.
- source_word: τελεῖται
  choice: se aperfeiçoa
  rationale: Reproduz de maneira concisa o passivo de τελέω e preserva a tensão da afirmação grega, sem explicá-la no corpo do texto.
- source_word: ἥδιστα ... μᾶλλον
  choice: com muito mais alegria
  rationale: Reúne de forma idiomática a intensificação superlativa e comparativa, comunicando a disposição alegre e ainda maior de Paulo.
- source_word: καυχήσομαι
  choice: me gloriarei
  rationale: “Gloriar-se” preserva o paradoxo retórico paulino e é mais digno e natural neste contexto do que “se gabar”.
- source_word: ἐπισκηνώσῃ ἐπ’ ἐμέ
  choice: repouse sobre mim
  rationale: Comunica naturalmente a ideia de uma presença que vem sobre Paulo; a imagem literal de armar tenda é preservada em nota.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Aqui Χριστός conserva valor titular; “Messias” torna esse sentido explícito sem tratá-lo apenas como nome próprio.
theological_decisions:
- issue: Ausência de possessivo explícito junto a δύναμις no texto grego impresso
  choice: pois o poder se aperfeiçoa na fraqueza
  alternative: pois o meu poder se aperfeiçoa na fraqueza
  rationale: O texto grego fornecido não traz μου junto a δύναμις. A tradução principal evita acrescentar o possessivo, embora o contexto permita entendê-lo; essa possibilidade é registrada em nota.
- issue: Sentido de τελεῖται aplicado ao poder
  choice: se aperfeiçoa
  alternative: chega à plena realização
  rationale: A formulação principal preserva a conhecida e teologicamente tensa linguagem do original, sem sugerir numa explicação inserida que o poder tivesse defeito moral.
- issue: Valor de Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: A tradução mantém o sentido titular de Χριστός, enquanto registra a forma tradicional em português como alternativa.
- issue: Imagem de ἐπισκηνόω
  choice: repouse sobre mim
  alternative: arme sua tenda sobre mim
  rationale: A opção principal é inteligível e preserva a ideia de presença sobre Paulo; a nota conserva a metáfora concreta de habitação em tenda.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural sobretudo no Brasil e compreensão internacional. Emprega “você” no discurso direto por ampla legibilidade brasileira; mantém “gloriar-se”, “graça” e “Messias” por sua precisão retórica e teológica. As notas preservam alternativas relevantes sem sobrecarregar o texto principal.
