id: 2CO.12.14
reference: 2 Corinthians 12:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰδοὺ τρίτον ⸀τοῦτο ἑτοίμως ἔχω ἐλθεῖν πρὸς ὑμᾶς, καὶ οὐ ⸀καταναρκήσω· οὐ γὰρ ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς, οὐ γὰρ ὀφείλει τὰ τέκνα τοῖς γονεῦσιν θησαυρίζειν, ἀλλὰ οἱ γονεῖς τοῖς τέκνοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/014.yaml
  text: Look, this is the third time I am ready to come to you, and I will not be a burden to you. For I do not seek what is yours, but you. For children are not obligated to store up for their parents, but parents for their children.
translation:
  language: pt
  text: 'Vejam: esta é a terceira vez que estou pronto para ir até vocês[a], e não serei um peso para vocês[b]. Pois não procuro o que vocês têm, mas vocês mesmos. Afinal, não são os filhos que devem ajuntar bens para os pais, mas os pais para os filhos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “pela terceira vez, estou pronto para ir até vocês”.'
    reason: A ordem mais literal preserva a ligação sintática de “terceira vez” com a prontidão de Paulo, mas é menos fluente em português.
  - marker: b
    text: O verbo traduzido como “ser um peso” pode indicar impor a alguém um encargo material ou financeiro.
    reason: A nota explicita o sentido contextual possível sem limitar a tradução principal a uma única espécie de encargo.
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Vejam
  rationale: Funciona como chamada de atenção natural no português atual; evita o arcaísmo de “eis” sem perder a força discursiva.
- source_word: τρίτον τοῦτο ἑτοίμως ἔχω ἐλθεῖν πρὸς ὑμᾶς
  choice: esta é a terceira vez que estou pronto para ir até vocês
  rationale: Expressa de modo natural a prontidão atual de Paulo para uma terceira ida, sem afirmar além do texto quantas visitas anteriores efetivamente ocorreram.
- source_word: καταναρκήσω
  choice: não serei um peso para vocês
  rationale: Transmite a ideia contextual de não impor encargo, sobretudo material ou financeiro, com linguagem corrente.
- source_word: ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς
  choice: não procuro o que vocês têm, mas vocês mesmos
  rationale: Preserva o contraste enfático entre os bens dos coríntios e as próprias pessoas; “vocês mesmos” torna o contraste natural e inequívoco em português.
- source_word: ὀφείλει
  choice: devem
  rationale: Comunica obrigação ou dever de forma direta e idiomática.
- source_word: θησαυρίζειν
  choice: ajuntar bens
  rationale: Mantém a noção de acumular ou reservar recursos, tornando explícito o sentido econômico sugerido pelo contexto familiar sem o restringir apenas a dinheiro.
- source_word: γονεῦσιν / γονεῖς
  choice: pais
  rationale: Em português, “pais” designa naturalmente pai e mãe em conjunto e corresponde ao termo grego inclusivo.
- source_word: τέκνα / τέκνοις
  choice: filhos
  rationale: É o equivalente genérico e natural para descendentes, sem restrição de sexo.
theological_decisions:
- issue: Sentido da expressão referente à “terceira vez”
  choice: Apresentar esta como a terceira ocasião em que Paulo está pronto para ir até os coríntios.
  alternative: Afirmar diretamente que esta seria sua terceira visita efetiva.
  rationale: A construção grega liga “terceira” à prontidão para ir e não exige que o tradutor resolva a reconstrução histórica das visitas anteriores.
- issue: Natureza do encargo evitado por Paulo
  choice: Usar a expressão ampla “ser um peso”, com nota sobre o provável aspecto financeiro.
  alternative: Traduzir no corpo do texto como “não lhes causarei despesas”.
  rationale: A formulação ampla preserva a imagem e a extensão semântica do verbo, enquanto o contexto financeiro pode ser esclarecido em nota sem estreitar indevidamente o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento naturais para leitores brasileiros. “Vejam” preserva a chamada de atenção; “ir até vocês” é idiomático no contexto de uma visita; a repetição de “vocês” mantém o contraste retórico do original.
