id: 2CO.5.18
reference: 2 Corinthians 5:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὰ δὲ πάντα ἐκ τοῦ θεοῦ τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ ⸀διὰ Χριστοῦ καὶ δόντος ἡμῖν τὴν διακονίαν τῆς καταλλαγῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/018.yaml
  text: All these things are from God[a], who reconciled us to himself through Messiah and gave us the ministry of reconciliation[c][b],
translation:
  language: pt
  text: Tudo isso, porém, vem de Deus[a], que nos[b] reconciliou consigo mesmo por meio do Messias[c] e nos deu o ministério da reconciliação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as coisas”. A expressão pode abranger amplamente tudo o que pertence a essa nova realidade ou, de modo mais específico, as questões mencionadas logo antes.
    reason: lexical_alternative
  - marker: b
    text: “Nos” pode se referir amplamente aos crentes, embora, no contexto próximo, Paulo dê ênfase especial à missão apostólica confiada a ele e a seus cooperadores.
    reason: alternative_reading
  - marker: c
    text: 'Grego: “por meio de Cristo”. Aqui, Χριστός foi traduzido como “o Messias” porque funciona como título.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ δὲ πάντα
  choice: Tudo isso, porém
  rationale: “Tudo isso” retoma naturalmente, como conjunto, as realidades mencionadas no contexto, sem excluir a possível amplitude de “todas as coisas”. “Porém” representa o δέ como transição leve, sem introduzir uma noção temporal ausente do grego.
- source_word: ἐκ τοῦ θεοῦ
  choice: vem de Deus
  rationale: A preposição ἐκ indica fonte ou origem. Em português atual, “vem de Deus” expressa isso de modo mais natural do que “é de Deus”.
- source_word: τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ
  choice: que nos reconciliou consigo mesmo
  rationale: A construção participial é vertida por uma oração relativa natural em português. “Consigo mesmo” preserva o reflexivo, deixando claro que Deus restaurou a relação conosco em direção a si próprio.
- source_word: διὰ Χριστοῦ
  choice: por meio do Messias
  rationale: διά com genitivo indica meio ou agência. Χριστός tem aqui força titular e mediadora, por isso é traduzido como “o Messias”.
- source_word: καὶ δόντος ἡμῖν
  choice: e nos deu
  rationale: O segundo particípio aoristo, coordenado ao primeiro e com Deus como sujeito, é expresso naturalmente por um verbo finito em português.
- source_word: τὴν διακονίαν τῆς καταλλαγῆς
  choice: o ministério da reconciliação
  rationale: 'διακονία designa aqui serviço ou encargo comissionado; “ministério” conserva essa nuance. O genitivo define o conteúdo ou caráter desse ministério: a reconciliação.'
theological_decisions:
- issue: Sentido titular de Χριστοῦ
  choice: o Messias
  alternative: Cristo
  rationale: No contexto, Χριστός destaca aquele por meio de quem Deus efetua a reconciliação, mantendo ativa a função titular do termo.
- issue: Alcance de ἡμᾶς / ἡμῖν
  choice: nos
  alternative: nós, os crentes em geral; ou nós, Paulo e seus cooperadores apostólicos, de modo mais específico
  rationale: O grego não resolve explicitamente o alcance dos pronomes. A tradução mantém “nos”, enquanto a nota registra a tensão entre o sentido amplo e a ênfase apostólica do contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação evita linguagem denominacional, conserva o caráter titular de “Messias” e mantém aberta a extensão dos pronomes plurais.
