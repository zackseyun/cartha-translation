  text: if indeed[a], when we have been clothed, we will not be found naked.
translation:
  language: pt
  text: se, de fato[a], depois de nos vestirmos, não formos encontrados nus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se realmente, tendo-nos vestido, não formos encontrados sem vestimenta”.'
    reason: Alternativa lexical e sintática que torna mais explícita a forma participial e registra uma possível tradução de γυμνοί.
lexical_decisions:
- source_word: εἴ γε
  choice: se, de fato
  rationale: Preserva tanto a força condicional de εἰ como a ênfase confirmatória de γε, sem transformar a condição em certeza.
- source_word: καὶ ἐνδυσάμενοι
  choice: depois de nos vestirmos
  rationale: Expressa em português natural a relação antecedente do particípio aoristo médio e mantém a metáfora do ato de vestir; o καί funciona na ligação enfática da expressão, sem exigir um 'também' isolado.
- source_word: οὐ
  choice: não
  rationale: Reproduz diretamente a negação do verbo futuro.
- source_word: γυμνοί
  choice: nus
  rationale: É a correspondência direta de γυμνός e preserva a imagem de vestimenta sem explicar seu referente teológico.
- source_word: εὑρεθησόμεθα
  choice: formos encontrados
  rationale: O futuro passivo grego é expresso de modo natural no âmbito da condição portuguesa, na qual o futuro do subjuntivo substitui idiomaticamente um futuro do indicativo.
theological_decisions:
- issue: Sentido da metáfora de estar vestido ou nu
  choice: Manter literalmente a metáfora, sem definir o que a nudez representa.
  alternative: Explicitar a nudez como estado desencarnado, ausência do corpo celestial ou vergonha diante de Deus.
  rationale: O versículo não identifica de maneira inequívoca o referente teológico da imagem; a tradução conserva a ambiguidade e a tensão do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi mantida próxima do grego, mas a oração condicional emprega naturalmente o futuro do subjuntivo. O pronome reflexivo em “nos vestirmos” reflete a voz média de ἐνδυσάμενοι, sem resolver a identidade da vestimenta.
