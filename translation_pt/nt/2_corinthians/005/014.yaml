id: 2CO.5.14
reference: 2 Corinthians 5:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ γὰρ ἀγάπη τοῦ Χριστοῦ συνέχει ἡμᾶς, κρίναντας τοῦτο ⸀ὅτι εἷς ὑπὲρ πάντων ἀπέθανεν· ἄρα οἱ πάντες ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/014.yaml
  text: 'For the love of Messiah compels us[a], because we have concluded this: that one died on behalf of all; therefore all died.'
translation:
  language: pt
  text: 'Pois o amor do Messias nos compele[a], porque chegamos a esta conclusão: um morreu em favor de todos; logo, todos morreram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o amor que o Messias tem” ou “o amor pelo Messias”; o genitivo grego pode ser entendido das duas maneiras.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: amor
  rationale: É o equivalente moderno e natural de ἀγάπη, sem a conotação arcaica ou restrita que outras opções poderiam trazer.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Χριστός funciona aqui como título. A construção portuguesa “do Messias” também mantém aberta, no texto principal, a relação genitiva entre o amor e o Messias.
- source_word: συνέχει
  choice: compele
  rationale: Expressa a força poderosa que governa e impele Paulo e seus colaboradores. Evita tanto a fraqueza de “move” quanto o sentido moderno frequentemente embaraçoso de “constrange”.
- source_word: κρίναντας τοῦτο
  choice: porque chegamos a esta conclusão
  rationale: O particípio apresenta a base do que precede, e κρίνω tem aqui o sentido de formar um juízo ou conclusão refletida. A oração causal torna essa relação clara em português natural.
- source_word: ὅτι
  choice: —
  rationale: Seu valor de introduzir o conteúdo da conclusão é expresso naturalmente pelos dois-pontos em português, sem necessidade de acrescentar “que” antes da oração seguinte.
- source_word: εἷς
  choice: um
  rationale: Preserva a formulação concisa do grego sem explicitar no texto algo que o contexto já permite identificar.
- source_word: ὑπὲρ πάντων
  choice: em favor de todos
  rationale: Conserva o sentido representativo ou benéfico de ὑπέρ sem restringi-lo à formulação mais específica “no lugar de todos”.
- source_word: ἄρα
  choice: logo
  rationale: Marca com clareza e concisão a inferência de Paulo a partir da morte de um em favor de todos.
- source_word: οἱ πάντες
  choice: todos
  rationale: Reproduz a expressão abrangente sem inserir “as pessoas” nem delimitar interpretativamente o grupo.
- source_word: ἀπέθανον
  choice: morreram
  rationale: O pretérito perfeito traduz adequadamente o aoristo nesta afirmação lógica e mantém a formulação teologicamente densa sem explicação adicional.
theological_decisions:
- issue: Valor do genitivo em ἡ ἀγάπη τοῦ Χριστοῦ
  choice: O texto principal diz “o amor do Messias”, preservando a ambiguidade formal.
  alternative: “o amor que o Messias tem” ou “o amor pelo Messias”
  rationale: O genitivo grego admite leitura subjetiva ou objetiva. Como o contexto imediato não exige que uma delas seja escolhida, a tradução mantém ambas abertas e as explicita em nota.
- issue: Sentido de “todos morreram”
  choice: A formulação é mantida literalmente, sem expansão interpretativa.
  alternative: “todos morreram representativamente no Messias” ou “todos os que creem morreram com ele”
  rationale: A lógica condensada pode envolver participação representativa na morte do Messias, mas o versículo não desenvolve essa relação nem delimita explicitamente “todos”. A tradução não resolve o debate além do que o grego afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Compele” mantém a intensidade motivadora do verbo sem soar mecânico; “logo” preserva o encadeamento lógico e a concisão do original.
