  terminology: “Messias” traduz apropriadamente Χριστός como título e preserva a decisão editorial fornecida. “Amor”, “em favor de todos” e “morreram” são escolhas naturais e semanticamente adequadas. A nota explica de modo suficiente a ambiguidade do genitivo, sem impor uma leitura teológica.
