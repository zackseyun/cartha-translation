  source_fidelity: 'O texto reproduz com precisão a estrutura argumentativa do grego: γάρ (“Pois”), o genitivo deliberadamente amplo em “o amor do Messias”, συνέχει (“nos compele”), o particípio causal κρίναντας (“porque chegamos a esta conclusão”), ὑπὲρ πάντων (“em favor de todos”) e a inferência de ἄρα (“logo”). “Todos morreram” conserva a formulação concisa e teologicamente não especificada de οἱ πάντες ἀπέθανον.'
