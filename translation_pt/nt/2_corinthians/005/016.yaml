id: 2CO.5.16
reference: 2 Corinthians 5:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὥστε ἡμεῖς ἀπὸ τοῦ νῦν οὐδένα οἴδαμεν κατὰ σάρκα· ⸀εἰ καὶ ἐγνώκαμεν κατὰ σάρκα Χριστόν, ἀλλὰ νῦν οὐκέτι γινώσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/016.yaml
  text: So from now on we regard no one according to the flesh[a]. Even if we have known Messiah according to the flesh[b], yet now we no longer know him that way.
translation:
  language: pt
  text: Portanto, de agora em diante, não consideramos ninguém segundo a carne[a]. Ainda que tenhamos conhecido o Messias segundo a carne, agora já não o conhecemos dessa maneira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do ponto de vista humano” ou “segundo critérios mundanos”, em lugar de “segundo a carne”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Portanto
  rationale: Marca a conclusão decorrente do argumento anterior e mantém clara a ligação inferencial.
- source_word: ἀπὸ τοῦ νῦν
  choice: de agora em diante
  rationale: Expressão temporal natural em português para uma mudança que vigora a partir do presente.
- source_word: οὐδένα οἴδαμεν
  choice: não consideramos ninguém
  rationale: Neste contexto, οἴδαμεν com κατὰ σάρκα envolve reconhecer ou avaliar alguém de determinada perspectiva; “consideramos” comunica esse sentido sem reduzir o verbo a mero conhecimento factual.
- source_word: κατὰ σάρκα
  choice: segundo a carne
  rationale: Preserva a terminologia paulina e sua tensão teológica, enquanto a nota apresenta equivalentes interpretativos possíveis.
- source_word: εἰ καὶ
  choice: Ainda que
  rationale: Expressa naturalmente a força concessiva da construção grega, sem decidir de modo rígido entre uma hipótese retórica e uma concessão factual.
- source_word: ἐγνώκαμεν
  choice: tenhamos conhecido
  rationale: O pretérito perfeito composto no subjuntivo se ajusta a “ainda que” e representa um conhecimento anterior relevante para o contraste atual.
- source_word: Χριστόν
  choice: o Messias
  rationale: Traduz o conteúdo titular de Χριστός, em vez de apenas transliterá-lo; o artigo é necessário em português natural.
- source_word: ἀλλὰ νῦν οὐκέτι γινώσκομεν
  choice: agora já não o conhecemos dessa maneira
  rationale: Mantém o contraste temporal e esclarece que mudou a maneira de conhecer ou considerar, não a realidade ou a identidade do Messias.
theological_decisions:
- issue: Sentido de κατὰ σάρκα aplicado às pessoas e ao Messias
  choice: segundo a carne
  alternative: do ponto de vista humano; segundo critérios meramente humanos ou mundanos
  rationale: A formulação mantém visível a linguagem de Paulo e não resolve silenciosamente sua amplitude. No contexto, trata-se de um modo inadequado de conhecer ou avaliar; não é uma negação da verdadeira humanidade do Messias.
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Aqui o termo designa Jesus por seu título messiânico. “Messias” transmite em português o conteúdo semântico do grego e não introduz uma leitura denominacional.
- issue: Força de εἰ καὶ
  choice: Ainda que
  alternative: Mesmo que; embora
  rationale: “Ainda que” preserva a concessão e deixa aberta a nuance entre referência factual e formulação concessiva, evitando afirmar além do que a construção exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “segundo a carne” é preservada onde aparece no grego; “dessa maneira” retoma a expressão na oração final sem repetição pesada.
