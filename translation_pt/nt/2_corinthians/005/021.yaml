source:
  edition: SBLGNT
  text: ⸀τὸν μὴ γνόντα ἁμαρτίαν ὑπὲρ ἡμῶν ἁμαρτίαν ἐποίησεν, ἵνα ἡμεῖς γενώμεθα δικαιοσύνη θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/021.yaml
  text: He made the one who did not know sin to be sin for us[b][a], so that in him we might become the righteousness of God.
translation:
  language: pt
  text: Àquele que não conheceu pecado, Deus o fez pecado[a] por nós, para que, nele, nos tornássemos justiça de Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oferta pelo pecado”. O grego emprega “pecado” nas duas ocorrências; alguns entendem a segunda em sentido sacrificial.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “retidão de Deus” ou “justiça que vem de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν μὴ γνόντα ἁμαρτίαν
  choice: Àquele que não conheceu pecado
  rationale: Mantém o idioma grego e a formulação condensada de Paulo. “Não conheceu pecado” indica ausência de participação pessoal no pecado sem substituir o texto pela paráfrase “não cometeu pecado”.
- source_word: ὑπὲρ ἡμῶν
  choice: por nós
  rationale: Expressa de modo natural a força benefativa e representativa de ὑπέρ, sem restringi-la antecipadamente a um único modelo de expiação.
- source_word: ἁμαρτίαν (segunda ocorrência)
  choice: pecado
  rationale: Reproduz deliberadamente o mesmo substantivo usado na primeira ocorrência e preserva a formulação marcante do original. A possível acepção sacrificial é indicada em nota.
- source_word: ἐποίησεν
  choice: fez
  rationale: Equivalente amplo e direto de ποιέω neste contexto, mantendo a ação divina sem acrescentar precisão metafísica ausente do texto.
- source_word: γενώμεθα
  choice: nos tornássemos
  rationale: Representa adequadamente o subjuntivo aoristo de γίνομαι na oração de finalidade introduzida por ἵνα, preservando a ideia de tornar-se em vez de reduzi-la a um estado estático.
- source_word: δικαιοσύνη θεοῦ
  choice: justiça de Deus
  rationale: “Justiça” é o equivalente corrente e abrangente de δικαιοσύνη em português. A construção “de Deus” conserva a abertura do genitivo, que pode indicar relação, origem ou pertencimento.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Preserva de modo conciso a expressão paulina sem expandi-la interpretativamente para “em união com ele”.
theological_decisions:
- issue: Sentido de “Deus o fez pecado”
  choice: Manter a formulação literal e paradoxal de Paulo, entendida à luz da declaração imediata de que Cristo não conheceu pecado.
  alternative: “Deus o fez oferta pelo pecado”; ou a leitura de que Cristo se tornou moralmente pecador.
  rationale: O texto distingue o sinless one do pecado e não afirma que ele se tornou pecador. A tradução não resolve silenciosamente a tensão; a leitura sacrificial plausível aparece em nota, enquanto a leitura de corrupção moral é incompatível com a primeira oração.
- issue: Força de δικαιοσύνη θεοῦ
  choice: “justiça de Deus”, sem definir o valor do genitivo.
  alternative: “justiça que vem de Deus” ou “retidão de Deus”.
  rationale: A expressão é densa e admite mais de uma nuance. A redação principal preserva sua ambiguidade quanto a origem, pertencimento ou relação, e a nota registra alternativas lexicais e sintáticas relevantes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem inicial “Àquele que...” evita ambiguidade sobre o referente do pronome e mantém Deus como sujeito explícito de “fez”. As notas aparecem junto às expressões a que se referem.
