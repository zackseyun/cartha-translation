  naturalness: A redação original “recomendando a nós mesmos a vocês” é pouco natural em português. “Nos recomendando a vocês” é fluente, moderno e amplamente compreensível. A manutenção de uma única frase preserva com clareza a oposição introduzida por ἀλλά.
  terminology: “Gloriar-se” permite conservar a repetição intencional do campo de καυχάομαι/καύχημα e evita que “orgulhar-se” sugira necessariamente um juízo moral negativo. “Aparência exterior” e “coração” representam adequadamente o contraste entre πρόσωπον e καρδία, sem estreitá-lo interpretativamente.
