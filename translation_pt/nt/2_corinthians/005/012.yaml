  rationale: 'A revisão torna a sintaxe portuguesa mais natural e ajusta as escolhas lexicais ao grego: ἀφορμή é vertido por “oportunidade”, o campo de καύχημα/καυχάομαι é mantido por “gloriar-se”, e ὑπὲρ ἡμῶν recebe a formulação contextual “em nosso favor”. A nota permanece ancorada no contraste de ἐν προσώπῳ e ἐν καρδίᾳ e registra, sem impor uma decisão, a alternativa “a nosso respeito” para a expressão precedente.'
