revisions:
- from: Não estamos outra vez recomendando a nós mesmos a vocês. Em vez disso, estamos lhes dando motivo para se orgulharem de nós[a], a fim de que tenham o que responder aos que se orgulham da aparência exterior[b], e não do coração.
