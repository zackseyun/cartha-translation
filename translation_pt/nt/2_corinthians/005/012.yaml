  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀οὐ πάλιν ἑαυτοὺς συνιστάνομεν ὑμῖν, ἀλλὰ ἀφορμὴν διδόντες ὑμῖν καυχήματος ὑπὲρ ἡμῶν, ἵνα ἔχητε πρὸς τοὺς ἐν προσώπῳ καυχωμένους καὶ ⸂μὴ ἐν⸃ καρδίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/012.yaml
  text: We are not commending ourselves to you again[a], but giving you an opportunity to boast about us[b], so that you may have an answer for those who boast in outward appearance and not in heart.
translation:
  language: pt
  text: Não estamos novamente nos recomendando a vocês, mas lhes dando oportunidade de se gloriarem em nosso favor, a fim de que tenham o que responder aos que se gloriam na aparência exterior e não no coração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “no rosto”; isto é, no que é exterior e visível, em contraste com o coração. Ou, quanto à expressão anterior: “oportunidade de se gloriarem a nosso respeito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνομεν
  choice: recomendando
  rationale: No contexto paulino, o verbo descreve apresentar alguém como digno de aprovação. “Recomendando a nós mesmos” é claro e preserva a negação da autopromoção.
- source_word: ἀφορμὴν
  choice: motivo
  rationale: O substantivo pode indicar ocasião, oportunidade ou base. “Motivo” expressa naturalmente que Paulo oferece aos coríntios uma base para falarem em seu favor.
- source_word: καυχήματος / καυχωμένους
  choice: se orgulharem / se orgulham
  rationale: A repetição de “orgulhar-se” conserva a ligação retórica entre o orgulho legítimo dos coríntios a respeito de Paulo e o orgulho dos adversários baseado no exterior.
- source_word: ὑπὲρ ἡμῶν
  choice: de nós
  rationale: Neste contexto, a expressão pode significar “a nosso respeito” ou “em nosso favor”. “Orgulharem-se de nós” é natural em português e mantém a possibilidade de esse orgulho também servir como defesa de Paulo.
- source_word: ἵνα ἔχητε πρὸς
  choice: a fim de que tenham o que responder aos
  rationale: A construção implica ter algo a dizer diante de certas pessoas. A tradução explicita apenas o complemento naturalmente subentendido.
- source_word: ἐν προσώπῳ
  choice: da aparência exterior
  rationale: Literalmente relacionada ao “rosto”, a expressão contrasta o que é externo e visível com o coração. “Aparência exterior” comunica esse sentido sem restringi-lo à aparência física.
- source_word: καρδίᾳ
  choice: coração
  rationale: “Coração” preserva a imagem original e seu contraste com a realidade exterior, sem definir de maneira excessiva se estão em vista motivos, caráter ou sinceridade.
- source_word: πάλιν
  choice: outra vez
  rationale: Expressa claramente a ideia de repetição presente no advérbio.
theological_decisions:
- issue: Contraste entre ἐν προσώπῳ e μὴ ἐν καρδίᾳ
  choice: aparência exterior ... coração
  alternative: reputação pública ... sinceridade interior
  rationale: A formulação escolhida preserva o contraste amplo entre o exterior visível e a realidade interior, sem decidir se Paulo se refere especificamente à aparência física, à reputação, aos motivos ou ao caráter.
- issue: Sentido de ὑπὲρ ἡμῶν
  choice: orgulharem-se de nós
  alternative: orgulharem-se em nosso favor
  rationale: A tradução conserva a referência a Paulo e seus cooperadores de modo idiomático. A nota registra que o contexto também admite a nuance de falar em defesa deles.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “A vocês” evita regionalismo excessivo; “recomendando a nós mesmos” mantém o tom argumentativo. A divisão em duas frases melhora a leitura sem alterar a relação lógica marcada por ἀλλά.
