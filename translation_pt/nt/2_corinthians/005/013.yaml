  text: For if we are out of our minds[a], it is for God; if we are of sound mind[b], it is for you.
translation:
  language: pt
  text: Pois, se estamos fora de nós[a], é para Deus; se estamos em perfeito juízo[b], é para vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «fora de si».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «agimos com sensatez»; «estamos lúcidos».'
