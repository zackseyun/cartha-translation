lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: se ... se
  rationale: A repetição de «se» reproduz com naturalidade a construção retórica condensada e mantém a força alternativa do grego.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação ou razão ligada ao contexto anterior e preserva a conexão argumentativa paulina.
- source_word: ἐξέστημεν
  choice: estamos fora de nós
  rationale: Expressão portuguesa corrente que comunica estar fora de si ou parecer irracional, sem afirmar de modo inequívoco loucura literal; o presente expressa bem a relevância atual do aoristo nesta formulação retórica.
- source_word: θεῷ
  choice: para Deus
  rationale: O dativo elíptico indica referência, direção ou interesse; «para Deus» conserva essa concisão sem especificar além do texto.
- source_word: σωφρονοῦμεν
  choice: estamos em nosso juízo perfeito
  rationale: Torna claro o contraste com «fora de nós» e expressa sensatez ou lucidez mental em linguagem natural e digna.
- source_word: ὑμῖν
  choice: para vocês
  rationale: O dativo elíptico aponta para referência ou benefício; a formulação indica que a conduta sensata de Paulo se dirige ao bem dos coríntios.
theological_decisions:
- issue: Sentido da descrição contrastante de Paulo
  choice: Preservar o contraste entre parecer estar fora de si e agir com lucidez, sem afirmar que Paulo endossa loucura literal.
  alternative: Entender a primeira expressão como experiência religiosa extática propriamente dita, ou apenas como reprodução hiperbólica de uma acusação alheia.
  rationale: A formulação grega é retórica e elíptica. A tradução mantém a tensão sem impor uma doutrina técnica de êxtase nem reduzir a frase a mero insulto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Vocês» evita o regionalismo de «vós». A estrutura paralela e concisa do grego foi mantida.
