  text: For we walk by faith[a], not by sight—
translation:
  language: pt
  text: Pois caminhamos pela fé, não pelo que vemos[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pela vista” ou “pela aparência”. A palavra grega pode se referir à forma visível, à aparência ou àquilo que é visto.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: pela fé
  rationale: διά com o genitivo expressa aqui o meio ou modo. “Pela fé” é natural em português, mantém o termo paulino πίστις e estabelece com clareza o contraste com a realidade visível.
- source_word: γὰρ
  choice: pois
  rationale: γάρ introduz a explicação do contexto anterior. “Pois” preserva essa ligação argumentativa sem transformar a oração numa subordinada causal mais explícita.
- source_word: περιπατοῦμεν
  choice: caminhamos
  rationale: O verbo περιπατέω significa literalmente “caminhar” e pode descrever figuradamente a maneira de viver. “Caminhamos” conserva a imagem do texto grego e permanece compreensível em português atual.
- source_word: οὐ διὰ εἴδους
  choice: não pelo que vemos
  rationale: εἶδος pode indicar forma visível, aparência ou aquilo que se vê. “Pelo que vemos” comunica naturalmente o contraste entre fé e percepção visível, sem restringir o sentido à faculdade física da visão.
theological_decisions:
- issue: Sentido de πίστις no contraste paulino com εἶδος
  choice: fé
  alternative: confiança; fidelidade
  rationale: Neste contexto, πίστις contrasta com a realidade presentemente visível e indica fé ou confiança, não primordialmente fidelidade. “Fé” preserva o vocabulário paulino e a amplitude teológica do termo.
- issue: Amplitude semântica de εἶδος
  choice: pelo que vemos
  alternative: pela vista; pela aparência
  rationale: A tradução escolhida mantém a referência ao domínio visível. “Pela aparência” poderia sugerir apenas superficialidade ou engano, enquanto “pela vista” é tradicional, mas menos natural e pode ser entendida apenas como capacidade física.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A metáfora de caminhar foi preservada. O travessão final foi mantido porque o versículo continua diretamente no seguinte.
