id: 2CO.5.10
reference: 2 Corinthians 5:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν, εἴτε ἀγαθὸν εἴτε ⸀φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/010.yaml
  text: For we all must be revealed before the judgment seat of Messiah[a], so that each one may receive what is due for what he has done in the body[d][c][b], whether good or bad.
translation:
  language: pt
  text: Pois todos nós devemos ser revelados diante do tribunal do Messias[a], para que cada um receba o que lhe é devido pelo que fez por meio do corpo[b], seja bom, seja mau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “comparecer diante do tribunal do Messias”. O verbo grego pode indicar tanto o comparecimento quanto o ser publicamente manifestado; o texto principal preserva o sentido mais forte de exposição.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pelo que fez enquanto estava no corpo”. A expressão grega também pode ser entendida como referência ao que foi feito ao longo da vida corporal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθῆναι
  choice: ser revelados
  rationale: Preserva a força passiva e o sentido de exposição aberta, mais forte que a simples ideia de comparecer, sem excluir essa nuance contextual.
- source_word: βήματος
  choice: tribunal
  rationale: No contexto, βῆμα designa o assento ou a plataforma judicial perante a qual ocorre avaliação; “tribunal” comunica isso com clareza em português atual.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Χριστός funciona aqui como título; “Messias” torna explícito seu valor titular.
- source_word: κομίσηται
  choice: receba o que lhe é devido
  rationale: Expressa o sentido de receber de volta ou receber em correspondência com os próprios atos, sem definir de antemão a natureza exata da retribuição.
- source_word: τὰ διὰ τοῦ σώματος
  choice: pelo que fez por meio do corpo
  rationale: A formulação mantém a instrumentalidade possível de διά com o genitivo e torna natural em português a expressão grega condensada.
- source_word: πρὸς ἃ ἔπραξεν
  choice: pelo que fez
  rationale: Comunica a correspondência entre o recebimento e a ação pessoal, preservando a responsabilidade individual indicada por ἔπραξεν.
- source_word: ἕκαστος
  choice: cada um
  rationale: Mantém a força distributiva e a ênfase na responsabilidade individual.
- source_word: ἀγαθὸν
  choice: bom
  rationale: É o equivalente amplo e direto no contraste moral com φαῦλον.
- source_word: φαῦλον
  choice: mau
  rationale: Representa o contraste moral com ἀγαθόν sem restringir o termo ao sentido de “sem valor” nem intensificá-lo desnecessariamente.
theological_decisions:
- issue: Natureza e alcance da avaliação diante do Messias
  choice: Manter a linguagem universal de comparecimento/exposição e de retribuição individual sem especificar o grupo abrangido nem o resultado do julgamento.
  alternative: Interpretar o tribunal exclusivamente como avaliação das recompensas dos fiéis ou, em sentido oposto, defini-lo explicitamente como o juízo final de toda a humanidade.
  rationale: O versículo afirma que todos serão manifestados e que cada um receberá em correspondência com o que fez, mas não resolve sozinho distinções sistemáticas sobre o alcance e os resultados desse julgamento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tribunal” evita a expressão menos natural “assento de julgamento”; “seja bom, seja mau” preserva o paralelismo conciso do grego.
