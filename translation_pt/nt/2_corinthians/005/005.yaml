id: 2CO.5.5
reference: 2 Corinthians 5:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ κατεργασάμενος ἡμᾶς εἰς αὐτὸ τοῦτο θεός, ⸀ὁ δοὺς ἡμῖν τὸν ἀρραβῶνα τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/005.yaml
  text: The one who prepared us for this very thing is God[b][a], who gave us the down payment of the Spirit.
translation:
  language: pt
  text: Quem nos preparou precisamente para isso foi Deus, que nos deu a garantia inicial do Espírito[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o penhor”, “o depósito” ou “a primeira parcela” do Espírito.
    reason: lexical_alternative
  - marker: b
    text: A expressão pode significar que o próprio Espírito é a garantia inicial, ou que Deus deu uma garantia daquilo que o Espírito levará à conclusão.
    reason: alternative_reading
lexical_decisions:
- source_word: κατεργασάμενος
  choice: preparou
  rationale: No contexto, o verbo descreve a ação intencional de Deus ao capacitar e moldar os fiéis para a condição futura mencionada nos versículos anteriores. “Preparou” comunica esse propósito com naturalidade.
- source_word: εἰς αὐτὸ τοῦτο
  choice: precisamente para isso
  rationale: Mantém a referência enfática à realidade específica que acaba de ser tratada, em português corrente e claro.
- source_word: θεός
  choice: Deus
  rationale: Identifica diretamente Deus como aquele que realizou a preparação; a construção “foi Deus” preserva a ênfase da frase grega.
- source_word: δοὺς
  choice: que nos deu
  rationale: A oração relativa traduz naturalmente o particípio aoristo e liga a dádiva do Espírito à obra preparatória de Deus.
- source_word: ἀρραβῶνα
  choice: garantia inicial
  rationale: Expressa tanto a garantia de cumprimento futuro quanto a ideia de uma primeira porção já recebida. Evita a possível obscuridade de “penhor” e a leitura meramente financeira de “entrada”.
- source_word: τοῦ πνεύματος
  choice: do Espírito
  rationale: Conserva a forma genitiva do grego e não decide no texto principal se o Espírito é a própria garantia ou se a expressão indica uma garantia relacionada à sua obra.
- source_word: δὲ
  choice: não explicitado
  rationale: Aqui δέ funciona como transição leve. O português não exige um conectivo expresso, e acrescentar “agora”, “mas” ou “e” poderia sugerir uma relação temporal ou contrastiva mais forte do que a presente no contexto.
theological_decisions:
- issue: Sentido de “a garantia inicial do Espírito”
  choice: Manter no texto a construção genitiva, permitindo entender o próprio Espírito como a garantia presente da vida futura.
  alternative: Entender a expressão como uma garantia dada por Deus que assegura aquilo que o Espírito levará à conclusão.
  rationale: O uso paulino favorece fortemente a compreensão do Espírito como a dádiva inicial que garante a herança futura, mas a forma genitiva admite mais de uma análise. A tradução e a nota preservam essa tensão sem impor uma única interpretação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Precisamente para isso” preserva a ênfase sem soar artificial; “garantia inicial” torna acessível a metáfora comercial, enquanto as alternativas tradicionais e mais literais aparecem em nota.
