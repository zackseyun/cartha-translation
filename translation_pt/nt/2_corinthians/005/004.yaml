id: 2CO.5.4
reference: 2 Corinthians 5:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ γὰρ οἱ ὄντες ἐν τῷ σκήνει στενάζομεν βαρούμενοι ἐφ’ ᾧ οὐ θέλομεν ἐκδύσασθαι ἀλλ’ ἐπενδύσασθαι, ἵνα καταποθῇ τὸ θνητὸν ὑπὸ τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/004.yaml
  text: For indeed[a], while we are in this tent, we groan, being burdened, because we do not want to be unclothed but to be further clothed[b], so that what is mortal may be swallowed up by life.
translation:
  language: pt
  text: Pois, de fato, enquanto estamos nesta tenda, gememos, sobrecarregados, porque não queremos ser despidos, mas revestidos por cima[a], para que o que é mortal[b] seja engolido pela vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “revestidos com outra veste”. O verbo grego sugere vestir uma peça sobre a roupa que já se usa.
    reason: lexical_alternative
  - marker: b
    text: Ou “aquilo que é mortal” ou “a mortalidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Pois, de fato
  rationale: Preserva tanto a ligação explicativa com o argumento anterior quanto a ênfase da expressão grega.
- source_word: σκήνει
  choice: tenda
  rationale: Mantém a metáfora de Paulo para a existência corporal presente e a ligação com o contexto imediato.
- source_word: στενάζομεν
  choice: gememos
  rationale: Expressa com força o peso e o anseio escatológico; “suspiramos” seria mais fraco.
- source_word: βαρούμενοι
  choice: sobrecarregados
  rationale: Conserva o sentido passivo do particípio e indica a condição que acompanha o gemido.
- source_word: ἐφ’ ᾧ
  choice: porque
  rationale: Neste contexto, introduz de modo natural a razão do gemido, sem rigidez literal.
- source_word: ἐκδύσασθαι
  choice: ser despidos
  rationale: Preserva a metáfora da roupa sem acrescentar uma explicação doutrinária à imagem.
- source_word: ἐπενδύσασθαι
  choice: ser revestidos por cima
  rationale: O verbo composto sugere vestir algo sobre o que já se usa; a formulação conserva essa força, embora seja deliberadamente imagética.
- source_word: καταποθῇ
  choice: seja engolido
  rationale: Mantém a imagem vívida de algo completamente vencido ou absorvido, em correspondência próxima com o verbo grego.
- source_word: τὸ θνητόν
  choice: o que é mortal
  rationale: O adjetivo neutro é substantivado; esta tradução mantém a referência abrangente à existência mortal sem reduzi-la a uma abstração.
- source_word: ζωῆς
  choice: vida
  rationale: É a forma natural em português e preserva o contraste direto com aquilo que é mortal.
theological_decisions:
- issue: A metáfora das vestes e o estado intermediário
  choice: Manter as imagens de ser “despidos” e “revestidos por cima” sem definir um esquema doutrinário específico.
  alternative: Explicitar “despidos” como existência sem corpo ou “revestidos por cima” exclusivamente como o corpo da ressurreição.
  rationale: O texto fala por metáforas sobre a existência corporal e a transformação futura. A tradução preserva a tensão teológica e não decide questões debatidas além do que o grego afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada com “enquanto” para fluidez, mantendo todas as relações do grego. As metáforas da tenda, das vestes e de ser engolido foram preservadas.
