source:
  edition: SBLGNT
  text: καὶ ὑπὲρ πάντων ἀπέθανεν ἵνα οἱ ζῶντες μηκέτι ἑαυτοῖς ζῶσιν ἀλλὰ τῷ ὑπὲρ αὐτῶν ἀποθανόντι καὶ ἐγερθέντι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/015.yaml
  text: And he died for all[a], so that those who live might no longer live for themselves[b], but for the one who died and was raised for them.
translation:
  language: pt
  text: E ele morreu por todos[a], para que os que vivem já não vivam para si mesmos, mas para aquele que morreu por eles e foi ressuscitado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em favor de todos»; do mesmo modo, «em favor deles» na segunda ocorrência de «por». O grego ὑπέρ pode enfatizar benefício ou representação.
    reason: lexical_alternative
  - marker: b
    text: 'O grego está na voz passiva: «foi ressuscitado». Algumas traduções dizem «ressuscitou».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ πάντων
  choice: por todos
  rationale: 'Ὑπέρ com o genitivo expressa benefício ou representação: «por, em favor de». «Por todos» é natural em português e mantém o alcance amplo sem impor uma teoria específica da expiação.'
- source_word: ἀπέθανεν
  choice: ele morreu
  rationale: O aoristo do indicativo apresenta a morte como acontecimento passado. O pronome «ele», recuperado do contexto e da flexão verbal grega, torna o sujeito claro em português.
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade, possivelmente com matiz de resultado. «Para que» conserva de modo natural a força télica.
- source_word: οἱ ζῶντες
  choice: os que vivem
  rationale: O particípio presente substantivado designa aqueles que vivem no sentido relevante do contexto. A formulação é clara e preserva o aspecto verbal.
- source_word: μηκέτι
  choice: já não
  rationale: Expressa a cessação de uma orientação anterior; «já não» é corrente e idiomático em português.
- source_word: ἑαυτοῖς ζῶσιν
  choice: vivam para si mesmos
  rationale: O dativo reflexivo indica orientação ou benefício. «Viver para si mesmos» comunica naturalmente uma vida voltada para os próprios interesses.
- source_word: ἀλλὰ τῷ ... ἀποθανόντι καὶ ἐγερθέντι
  choice: mas para aquele que morreu ... e foi ressuscitado
  rationale: O dativo retoma o verbo «viver» por elipse e estabelece o contraste entre viver para si e viver para outro. «Aquele que» mantém a estrutura participial com fluidez.
- source_word: ὑπὲρ αὐτῶν
  choice: por eles
  rationale: Mantém a mesma tradução básica de ὑπέρ usada antes, preservando a repetição e sem restringir o sentido de benefício ou representação.
- source_word: ἐγερθέντι
  choice: foi ressuscitado
  rationale: A forma passiva é preservada explicitamente e aponta para a ação de Deus sem precisar nomear o agente, que não está expresso nesta oração.
theological_decisions:
- issue: Alcance de πάντων / αὐτῶν
  choice: «todos» e «eles», sem restringir expressamente o referente
  alternative: Entender «todos» como toda a humanidade sem restrição, ou como todos os que Cristo representa no contexto
  rationale: O versículo emprega linguagem abrangente, mas não resolve por si só debates posteriores sobre a extensão da expiação. A tradução conserva essa tensão.
- issue: Voz de ἐγερθέντι
  choice: «foi ressuscitado»
  alternative: «ressuscitou»
  rationale: A tradução passiva corresponde à forma grega e preserva a ação divina implícita, sem negar que a formulação ativa possa ser teologicamente legítima em outros contextos.
- issue: Força de ὑπέρ
  choice: «por», com nota indicando «em favor de»
  alternative: «em favor de» no texto principal
  rationale: «Por» é conciso, natural e pode comunicar benefício ou representação. A nota torna explícita a amplitude lexical sem definir uma formulação denominacional da expiação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «vivem/vivam» preserva a coesão do grego; «já não» soa mais natural do que «não mais». O marcador [b] foi colocado junto de «foi ressuscitado», expressão à qual a nota efetivamente se refere.
