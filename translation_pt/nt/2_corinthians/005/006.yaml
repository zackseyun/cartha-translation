id: 2CO.5.6
reference: 2 Corinthians 5:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Θαρροῦντες οὖν πάντοτε καὶ εἰδότες ὅτι ἐνδημοῦντες ἐν τῷ σώματι ἐκδημοῦμεν ἀπὸ τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/006.yaml
  text: Therefore[a], we are always confident and know that while we are at home in the body, we are away from the Lord,
translation:
  language: pt
  text: Por isso, estamos sempre confiantes e sabemos que, enquanto habitamos no corpo, estamos longe[a] do Senhor,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ausentes do Senhor». O verbo grego ἐκδημοῦμεν é o contraponto de «habitamos no corpo» e pode ser traduzido por «estar longe» ou «estar ausente».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαρροῦντες
  choice: estamos sempre confiantes
  rationale: O particípio presente expressa uma disposição contínua de coragem ou confiança. A forma finita é natural em português e se coordena com «sabemos».
- source_word: οὖν
  choice: Por isso
  rationale: Assinala uma conclusão baseada no argumento anterior. «Por isso» conserva com naturalidade essa ligação lógica.
- source_word: πάντοτε
  choice: sempre
  rationale: Expressa a continuidade da confiança.
- source_word: εἰδότες
  choice: sabemos
  rationale: O particípio perfeito de οἶδα tem sentido presente e indica conhecimento estabelecido. A forma finita torna a frase clara e natural.
- source_word: ἐνδημοῦντες
  choice: enquanto estamos em casa
  rationale: Preserva a metáfora de estar no próprio lar e introduz a circunstância simultânea expressa pelo particípio.
- source_word: ἐν τῷ σώματι
  choice: no corpo
  rationale: Mantém a expressão locativa do grego sem acrescentar «este», que não é exigido pelo texto.
- source_word: ἐκδημοῦμεν
  choice: estamos longe
  rationale: Exprime afastamento e funciona como contraponto compreensível a «estamos em casa». «Estamos ausentes» também é possível, mas soa menos natural no português corrente.
- source_word: ἀπὸ τοῦ κυρίου
  choice: do Senhor
  rationale: A preposição ἀπό indica separação; em português, essa ideia integra naturalmente a expressão «longe do Senhor».
theological_decisions:
- issue: Contraste metafórico entre a vida no corpo e a presença com o Senhor
  choice: A existência atual no corpo é descrita como estar «em casa no corpo» e «longe do Senhor».
  alternative: Entender a frase como separação absoluta de Cristo ou importar para este versículo a formulação do versículo 8 sobre deixar o corpo e habitar com o Senhor.
  rationale: A redação conserva o contraste espacial e escatológico de Paulo sem afirmar uma separação total da presença sustentadora de Cristo nem antecipar a formulação do versículo seguinte.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A metáfora pouco comum «em casa no corpo» foi mantida por refletir deliberadamente o contraste lexical do grego. A vírgula final foi preservada porque o versículo continua sintaticamente no versículo seguinte.
