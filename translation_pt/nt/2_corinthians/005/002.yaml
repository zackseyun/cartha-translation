id: 2CO.5.2
reference: 2 Corinthians 5:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐν τούτῳ στενάζομεν, τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ ἐπενδύσασθαι ἐπιποθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/002.yaml
  text: For indeed in this we groan[a], longing to put on our dwelling from heaven[b],
translation:
  language: pt
  text: Pois, de fato, nisto gememos, ansiando por nos revestir[a] da nossa habitação que vem do céu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego também pode transmitir a ideia de “vestir por cima”, como quem coloca uma roupa sobre outra.
    reason: lexical_alternative
  - marker: b
    text: Ou “nossa habitação celestial”. Mais literalmente, o grego diz “nossa habitação que vem do céu”, destacando sua origem.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Pois, de fato
  rationale: Preserva tanto a ligação explicativa com o versículo anterior quanto a leve ênfase da expressão grega, em português natural.
- source_word: ἐν τούτῳ
  choice: nisto
  rationale: Mantém a concisão e a ambiguidade do demonstrativo grego, sem explicitar se a referência é à tenda, ao corpo presente ou à condição atual.
- source_word: στενάζομεν
  choice: gememos
  rationale: Expressa o peso interior e o anseio indicados pelo verbo, sem enfraquecê-lo para um simples suspiro nem ampliá-lo para lamentação explícita.
- source_word: τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ
  choice: a nossa habitação que vem do céu
  rationale: Conserva a metáfora concreta de moradia e apresenta ἐξ οὐρανοῦ como indicação de origem, em vez de convertê-la apenas numa qualidade descrita como celestial.
- source_word: ἐπενδύσασθαι
  choice: nos revestir
  rationale: Mantém a metáfora de vestir e soa digna e corrente em português. A possível nuance de vestir por cima é registrada em nota.
- source_word: ἐπιποθοῦντες
  choice: ansiando por
  rationale: Comunica o desejo forte e contínuo do particípio grego de modo natural, ligando-o ao gemido.
theological_decisions:
- issue: Natureza da metáfora da habitação que vem do céu
  choice: Manter juntas as imagens de habitação e revestimento, sem definir mais precisamente aquilo a que Paulo se refere.
  alternative: Explicitar como “corpo da ressurreição” ou “lar celestial”.
  rationale: O texto combina metáforas e não resolve, neste versículo isolado, se a referência é especificamente ao corpo ressurreto, ao estado intermediário ou à habitação escatológica. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Nisto” foi mantido para preservar a ambiguidade do original; “habitação” sustenta a metáfora em paralelo com o revestimento. A vírgula final reflete a continuação sintática no versículo seguinte.
