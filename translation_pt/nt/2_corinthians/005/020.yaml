id: 2CO.5.20
reference: 2 Corinthians 5:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑπὲρ Χριστοῦ οὖν πρεσβεύομεν ὡς τοῦ θεοῦ παρακαλοῦντος δι’ ἡμῶν· δεόμεθα ὑπὲρ Χριστοῦ, καταλλάγητε τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/020.yaml
  text: 'Therefore[a], we are ambassadors for the Messiah, as though God were appealing through us[b]. We beg you on behalf of the Messiah: be reconciled to God.'
translation:
  language: pt
  text: 'Portanto, somos embaixadores em nome do Messias[a], como se Deus fizesse seu apelo por nosso intermédio. Em nome do Messias, suplicamos a vocês: sejam reconciliados com Deus.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Cristo», nas duas ocorrências deste versículo. O título grego é Χριστός, aqui traduzido como «Messias» para tornar explícito seu sentido como título.
    reason: alternative_reading
  - marker: b
    text: Mais literalmente, «a Deus».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ Χριστοῦ
  choice: em nome do Messias
  rationale: Ὑπέρ com o genitivo expressa atuação em favor de alguém ou em seu nome. No contexto de uma embaixada, «em nome do» comunica com naturalidade a função representativa. «Messias» traduz Χριστός como título.
- source_word: οὖν
  choice: Portanto
  rationale: Marca a conclusão decorrente do argumento anterior sobre a reconciliação.
- source_word: πρεσβεύομεν
  choice: somos embaixadores
  rationale: Expressa de modo direto e corrente o ato de exercer a função de embaixador ou enviado.
- source_word: ὡς
  choice: como se
  rationale: Preserva o valor comparativo da construção, sem transformá-la numa afirmação causal.
- source_word: παρακαλοῦντος
  choice: fizesse seu apelo
  rationale: No contexto de reconciliação, παρακαλέω denota um apelo insistente; a formulação é natural e mantém o tom solene.
- source_word: δι’ ἡμῶν
  choice: por nosso intermédio
  rationale: Διά com genitivo indica meio ou agência; a expressão deixa claro que Deus faz seu apelo mediante os apóstolos.
- source_word: δεόμεθα
  choice: suplicamos a vocês
  rationale: Comunica a intensidade do pedido. O complemento «a vocês» fica claro pelo imperativo plural que segue e produz português natural.
- source_word: καταλλάγητε
  choice: sejam reconciliados
  rationale: Preserva explicitamente a voz passiva do imperativo aoristo, sem explicar além do texto como se relacionam a ação divina e a resposta humana.
- source_word: τῷ θεῷ
  choice: com Deus
  rationale: Depois de «reconciliar», «com Deus» é a regência mais natural no português contemporâneo e expressa adequadamente a relação restaurada indicada pelo dativo.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: O termo funciona como título e «Messias» explicita seu significado. A forma tradicional «Cristo» permanece indicada em nota.
- issue: Voz e agência na reconciliação
  choice: sejam reconciliados com Deus
  alternative: reconciliem-se com Deus
  rationale: A forma escolhida conserva a voz passiva do grego e, assim, a tensão entre o apelo de Deus e a ordem dirigida aos ouvintes, sem definir além do texto a mecânica da agência divina e humana.
- issue: Relação expressa por τῷ θεῷ
  choice: com Deus
  alternative: a Deus
  rationale: «Com Deus» é idiomático em português e salienta a relação restaurada; «a Deus» reproduz mais de perto a forma dativa e pode sugerir direção, mas soa menos natural.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. «Por nosso intermédio» mantém um registro moderadamente formal apropriado ao contexto de representação diplomática. A repetição de «em nome do Messias» acompanha a repetição grega e reforça a função representativa.
