id: 2CO.5.17
reference: 2 Corinthians 5:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥστε εἴ τις ἐν Χριστῷ, καινὴ κτίσις· τὰ ἀρχαῖα παρῆλθεν, ἰδοὺ γέγονεν ⸀καινά·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/017.yaml
  text: So then[a], if anyone is in Messiah, there is a new creation; the old things have passed away; behold[b], new things have come.
translation:
  language: pt
  text: Portanto, se alguém está no Messias, há uma nova criação[a]; as coisas antigas passaram; eis que surgiram coisas novas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “essa pessoa é uma nova criação”. O grego é elíptico; literalmente: “se alguém está no Messias — nova criação”.'
    reason: alternative_reading
  - marker: b
    text: 'Muitas traduções dizem: “tudo se fez novo”. O texto da SBLGNT diz simplesmente “coisas novas”, sem uma palavra explícita correspondente a “tudo”.'
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: Portanto
  rationale: Introduz uma conclusão inferida do argumento anterior, de modo claro e natural em português.
- source_word: εἴ τις
  choice: se alguém
  rationale: Preserva a condição indefinida e inclusiva do grego, sem acrescentar especificidade masculina.
- source_word: ἐν Χριστῷ
  choice: está no Messias
  rationale: Mantém a fórmula paulina de união e traduz Χριστός como título messiânico, em vez de tratá-lo apenas como nome próprio.
- source_word: καινὴ κτίσις
  choice: há uma nova criação
  rationale: A expressão grega é elíptica e não contém verbo. Esta formulação preserva sua concisão sem limitar a nova criação exclusivamente ao indivíduo.
- source_word: τὰ ἀρχαῖα
  choice: as coisas antigas
  rationale: Reproduz o adjetivo neutro plural substantivado e deixa aberto o alcance da expressão.
- source_word: παρῆλθεν
  choice: passaram
  rationale: Expressa de forma idiomática a cessação das coisas antigas, em contraste com a nova realidade presente.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Conserva a função enfática e de chamada de atenção do marcador grego em registro bíblico digno, porém compreensível.
- source_word: γέγονεν καινά
  choice: vieram coisas novas
  rationale: Reflete o plural neutro καινά e comunica o estado presente resultante indicado pelo perfeito, sem inserir a palavra 'todas', ausente no texto da SBLGNT.
theological_decisions:
- issue: Χριστῷ como título ou forma semelhante a nome próprio
  choice: no Messias
  alternative: em Cristo
  rationale: A tradução do título explicita o sentido messiânico ainda relevante na fórmula paulina, sem negar seu uso convencional como designação de Jesus.
- issue: Sentido da frase elíptica καινὴ κτίσις
  choice: há uma nova criação
  alternative: essa pessoa é uma nova criação
  rationale: Como o grego diz literalmente apenas 'nova criação', sem verbo ou sujeito explícito, a leitura principal evita restringir a declaração ao indivíduo; a alternativa pessoal é registrada em nota.
- issue: Escopo de γέγονεν καινά
  choice: vieram coisas novas
  alternative: tudo se fez novo
  rationale: A SBLGNT traz καινά, 'coisas novas', sem palavra explícita equivalente a 'tudo'. A tradução segue esse texto e registra a forma tradicional em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e conciso; “eis que” preserva a ênfase retórica, enquanto as notas mantêm a ambiguidade sintática e a questão textual.
