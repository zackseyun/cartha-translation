  text: θαρροῦμεν δὲ καὶ εὐδοκοῦμεν μᾶλλον ἐκδημῆσαι ἐκ τοῦ σώματος καὶ ἐνδημῆσαι πρὸς τὸν κύριον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/008.yaml
  text: So we are confident and would rather be away from the body and at home with the Lord[a].
translation:
  language: pt
  text: Assim, temos coragem e preferimos mais estar longe do corpo e em casa com o Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estar ausentes do corpo e junto ao Senhor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θαρροῦμεν
  choice: temos coragem
  rationale: O presente indica uma disposição contínua e confiante. “Temos coragem” é natural em português e mantém a ligação lexical com o contexto anterior.
- source_word: δὲ
  choice: Assim
  rationale: Aqui a partícula dá continuidade ao raciocínio e introduz uma conclusão decorrente dos versículos anteriores, sem exigir contraste forte.
- source_word: καὶ
  choice: e
  rationale: Conecta de maneira simples os verbos θαρροῦμεν e εὐδοκοῦμεν.
- source_word: εὐδοκοῦμεν μᾶλλον
  choice: preferimos
  rationale: A combinação expressa preferência. “Preferimos” comunica isso com clareza e evita a redundância pouco natural de “preferimos antes”.
- source_word: ἐκδημῆσαι
  choice: estar longe
  rationale: O verbo descreve estar fora de casa ou ausente. “Estar longe” preserva a metáfora espacial sem explicitar “morrer”.
- source_word: ἐκ τοῦ σώματος
  choice: do corpo
  rationale: Mantém literalmente o corpo como esfera da qual se está longe, sem paráfrase doutrinária.
- source_word: ἐνδημῆσαι
  choice: estar em casa
  rationale: Preserva o contraste metafórico com ἐκδημῆσαι e sua imagem de residência ou pertencimento.
- source_word: πρὸς τὸν κύριον
  choice: com o Senhor
  rationale: No contexto de ἐνδημῆσαι, πρός indica presença pessoal junto ao Senhor; “com o Senhor” é idiomático e preciso.
theological_decisions:
- issue: Se a linguagem de Paulo deve ser explicitada como uma afirmação sobre morte, céu ou estado intermediário
  choice: Manter a metáfora de estar longe do corpo e em casa com o Senhor
  alternative: Traduzir de modo explicativo como “morrer e ir para o céu estar com o Senhor”
  rationale: Embora o texto implique presença com o Senhor fora do corpo, não emprega explicitamente “morrer” nem “céu”. A tradução preserva a formulação e a tensão teológica do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo metafórico entre estar longe e estar em casa; a nota registra a alternativa tradicional baseada no sentido de ausência e presença.
