  source_fidelity: O texto principal preserva bem a sequência verbal, a metáfora contrastante de estar longe do corpo/estar em casa e evita acrescentar explicações sobre morte ou céu. Contudo, μᾶλλον explicita uma preferência comparativa; «preferimos estar» pode sugeri-la pelo contexto, mas «preferimos mais estar» a torna expressa sem alterar o sentido.
  naturalness: «Assim, temos coragem» e «estar em casa com o Senhor» são claros e naturais em português moderno. Na nota, porém, «presentes com o Senhor» é pouco idiomático; «junto ao Senhor» comunica naturalmente a alternativa semântica de presença.
  terminology: «corpo» e «Senhor» são adequados e consistentes. A formulação principal preserva a metáfora residencial de ἐκδημέω/ἐνδημέω; a nota pode registrar a alternativa ausência/presença de modo mais idiomático.
