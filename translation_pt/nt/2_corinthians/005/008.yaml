  - severity: low
    issue: A redação da nota «presentes com o Senhor» soa pouco natural em português.
    rationale: Em português, «junto ao Senhor» é a expressão mais idiomática para a presença pessoal indicada pela alternativa lexical, sem impor interpretação adicional.
