reference: 2 Corinthians 5:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς ὅτι θεὸς ἦν ἐν Χριστῷ κόσμον καταλλάσσων ἑαυτῷ, μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν, καὶ θέμενος ἐν ἡμῖν τὸν λόγον τῆς καταλλαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/019.yaml
  text: namely[a], that God was in Messiah reconciling the world to himself, not counting their trespasses against them[d][c][b], and entrusting to us the message of reconciliation.
translation:
  language: pt
  text: 'isto é: Deus estava no Messias reconciliando consigo o mundo, sem levar em conta as transgressões deles e confiando a nós[a] a mensagem da reconciliação.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pondo em nós a mensagem da reconciliação”; possivelmente, “entre nós”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ὅτι
  choice: 'isto é:'
  rationale: Introduz a explicação do conteúdo da afirmação anterior de modo natural em português, sem a repetição pouco fluente de “isto é, que”.
- source_word: θεὸς ἦν ἐν Χριστῷ
  choice: Deus estava no Messias
  rationale: Mantém diretamente ἐν como “em/no” e preserva a tensão da formulação grega, sem transformá-la numa construção instrumental como “por meio do Messias”.
- source_word: Χριστῷ
  choice: Messias
  rationale: Χριστός funciona aqui como título; “Messias” comunica o sentido do título em português.
- source_word: κόσμον
  choice: o mundo
  rationale: É a equivalência natural e ampla para κόσμος neste contexto, sem restringir explicitamente o referente apenas às pessoas.
- source_word: καταλλάσσων
  choice: reconciliando
  rationale: Reproduz o particípio presente e mantém a ligação lexical com “reconciliação” no fim do versículo.
- source_word: ἑαυτῷ
  choice: consigo
  rationale: Expressa de forma idiomática em português o reflexivo dativo, tendo Deus como referente.
- source_word: μὴ λογιζόμενος
  choice: sem levar em conta
  rationale: Comunica com clareza atual a ideia de não lançar à conta ou não computar, evitando jargão teológico desnecessário.
- source_word: παραπτώματα
  choice: transgressões
  rationale: Preserva a noção de atos pelos quais se ultrapassa um limite ou se comete uma falta, com registro bíblico digno e compreensível.
- source_word: καὶ θέμενος ἐν ἡμῖν
  choice: e confiando a nós
  rationale: Representa idiomaticamente a colocação do encargo ou da mensagem nos destinatários; em português, “pôr em nós a mensagem” seria pouco natural e poderia sugerir mera interiorização.
- source_word: τὸν λόγον τῆς καταλλαγῆς
  choice: a mensagem da reconciliação
  rationale: Neste contexto, λόγος designa o conteúdo comunicado ou proclamado; “mensagem” é claro em português e conserva a relação com a reconciliação.
theological_decisions:
- issue: Sentido de θεὸς ἦν ἐν Χριστῷ
  choice: Deus estava no Messias
  alternative: No Messias, Deus estava reconciliando consigo o mundo; Deus estava reconciliando consigo o mundo por meio do Messias
  rationale: A redação escolhida permanece próxima da ordem e das relações do grego, conservando a possível tensão entre presença e agência divina em vez de resolver ἐν como puramente instrumental.
- issue: Tradução do título Χριστός
  choice: Messias
  alternative: Cristo
  rationale: A escolha traduz o valor titular do termo grego, em vez de tratá-lo apenas como nome próprio.
- issue: Interpretação de θέμενος ἐν ἡμῖν
  choice: confiando a nós
  alternative: pondo em nós; estabelecendo entre nós
  rationale: A formulação escolhida explicita de modo idiomático o encargo ministerial sugerido pelo contexto, sem mudar o objeto confiado. As demais possibilidades de ἐν permanecem lexicalmente possíveis, mas seriam menos claras no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém “Messias” como título, preserva a formulação teologicamente densa “Deus estava no Messias” e usa linguagem corrente em “sem levar em conta” e “confiando a nós”.
