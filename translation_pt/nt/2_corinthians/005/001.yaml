reference: 2 Corinthians 5:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ἐὰν ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους καταλυθῇ, οἰκοδομὴν ἐκ θεοῦ ἔχομεν οἰκίαν ἀχειροποίητον αἰώνιον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/001.yaml
  text: For we know that if our earthly tent-house is torn down[a], we have a building from God, a house not made with hands[d][c][b], eternal in the heavens.
translation:
  language: pt
  text: Pois sabemos que, se a nossa casa terrena, esta tenda, for desmontada[a], temos[c], da parte de Deus, um edifício, uma casa não feita por mãos humanas[b], eterna nos céus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “for destruída” ou “for desfeita”. O verbo pode descrever o desmonte de uma estrutura, em harmonia com a imagem da tenda.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não feita com mãos”; a expressão ressalta a origem divina, e não humana.
    reason: lexical_alternative
  - marker: c
    text: O grego diz “temos”, e não “teremos”, preservando a tensão entre posse presente e realização futura.
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδαμεν
  choice: sabemos
  rationale: Expressa conhecimento firme e corresponde de modo natural ao presente grego.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa que liga o versículo ao argumento anterior.
- source_word: ἐὰν ... καταλυθῇ
  choice: se ... for desmontada
  rationale: Preserva a contingência futura e evoca o desmonte de uma tenda, sem excluir o sentido mais amplo de destruição.
- source_word: ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους
  choice: a nossa casa terrena, esta tenda
  rationale: Conserva visíveis as duas imagens gregas, casa e tenda, em formulação natural em português, sem substituí-las interpretativamente por 'corpo'.
- source_word: οἰκοδομὴν ἐκ θεοῦ
  choice: da parte de Deus um edifício
  rationale: Toma οἰκοδομή concretamente como estrutura e traduz ἐκ θεοῦ como origem divina, sem convertê-lo em mero possessivo.
- source_word: ἔχομεν
  choice: temos
  rationale: Retém o presente do texto grego e sua tensão entre posse presente e realização futura.
- source_word: οἰκίαν ἀχειροποίητον
  choice: uma casa não feita por mãos humanas
  rationale: Comunica com clareza que a casa não tem origem ou fabricação humana e mantém a ressonância bíblica da expressão.
- source_word: αἰώνιον
  choice: eterna
  rationale: Contrasta adequadamente a permanência da casa celestial com a transitoriedade da morada terrena.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: nos céus
  rationale: Preserva o plural da expressão grega em português natural.
theological_decisions:
- issue: Referente das imagens de moradia
  choice: Manter no texto as imagens de casa, tenda e edifício.
  alternative: Explicitar o referente como 'corpo'.
  rationale: O grego sobrepõe deliberadamente imagens arquitetônicas. Substituí-las por 'corpo' resolveria no texto uma interpretação que deve permanecer implícita.
- issue: Força temporal de ἔχομεν
  choice: Traduzir pelo presente 'temos'.
  alternative: Traduzir pelo futuro 'teremos'.
  rationale: A forma grega está no presente. A tradução preserva a tensão entre posse atual, certeza presente e realização futura, sem decidir entre essas leituras.
- issue: Natureza da casa 'não feita por mãos'
  choice: Expressar sua origem não humana sem definir mais precisamente seu referente.
  alternative: Identificá-la explicitamente como corpo ressuscitado, morada celestial ou templo.
  rationale: O versículo não identifica de maneira inequívoca a imagem; a tradução evita impor uma solução teológica particular.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A aposição 'esta tenda' evita o pouco natural 'casa-tenda' e conserva as duas imagens. A ordem foi levemente ajustada para fluência, sem eliminar a ambiguidade do original.
