revisions:
- from: Portanto, conhecendo o temor do Senhor[a], persuadimos as pessoas; mas somos plenamente conhecidos por Deus[b], e espero que também sejamos plenamente conhecidos nas consciências de vocês.
  to: Portanto, conhecendo o temor do Senhor[a], persuadimos as pessoas; mas estamos manifestos a Deus[b], e espero que também estejamos manifestos nas consciências de vocês.
  rationale: A revisão substitui «plenamente conhecidos» por «manifestos» nas duas ocorrências, preservando o campo semântico de φανερόω e a repetição deliberada do grego. A nota b oferece «expostos diante de Deus» como alternativa idiomática, sem alterar o texto principal nem resolver além do necessário a construção com o dativo e «nas consciências».
