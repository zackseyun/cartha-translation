id: 2CO.5.11
reference: 2 Corinthians 5:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἰδότες οὖν τὸν φόβον τοῦ κυρίου ἀνθρώπους πείθομεν, θεῷ δὲ πεφανερώμεθα· ἐλπίζω δὲ καὶ ἐν ταῖς συνειδήσεσιν ὑμῶν πεφανερῶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/011.yaml
  text: Therefore[a], knowing the fear of the Lord, we persuade people; but we have been made known to God[b], and I hope that we also have been made known in your consciences.
translation:
  language: pt
  text: Portanto, conhecendo o temor do Senhor[a], persuadimos as pessoas; mas estamos manifestos a Deus[b], e espero que também estejamos manifestos nas consciências de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O temor do Senhor” também pode ser entendido como profundo respeito reverente diante do Senhor, especialmente à luz do tribunal mencionado no versículo anterior.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estamos expostos diante de Deus [...] também estejamos expostos nas consciências de vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰδότες
  choice: conhecendo
  rationale: Preserva o particípio perfeito com sentido presente e sua ligação com o verbo principal, sem tornar explícita uma relação causal que o contexto apenas permite.
- source_word: οὖν
  choice: Portanto
  rationale: Expressa a inferência a partir do juízo perante o tribunal de Cristo mencionado no versículo anterior.
- source_word: φόβον τοῦ κυρίου
  choice: o temor do Senhor
  rationale: Mantém a expressão bíblica e sua amplitude sem reduzi-la apenas a reverência; o contexto inclui assombro, respeito e responsabilidade diante do juízo.
- source_word: ἀνθρώπους
  choice: as pessoas
  rationale: O substantivo se refere genericamente a seres humanos; a tradução é inclusiva e natural em português moderno.
- source_word: πείθομεν
  choice: persuadimos
  rationale: Reproduz diretamente o presente do indicativo, sem enfraquecê-lo com a formulação interpretativa 'procuramos persuadir'.
- source_word: θεῷ δὲ πεφανερώμεθα
  choice: mas somos plenamente conhecidos por Deus
  rationale: 'Comunica de modo idiomático o perfeito passivo e seu resultado presente: aquilo que Paulo e seus cooperadores são está aberto e evidente para Deus.'
- source_word: ἐλπίζω
  choice: espero
  rationale: É a equivalência corrente e preserva a expectativa pessoal, modestamente formulada por Paulo.
- source_word: ἐν ταῖς συνειδήσεσιν ὑμῶν
  choice: nas consciências de vocês
  rationale: Mantém o plural grego, referindo-se à percepção moral interior dos destinatários individualmente.
- source_word: πεφανερῶσθαι
  choice: sejamos plenamente conhecidos
  rationale: Retoma o mesmo verbo anterior e conserva o aspecto resultativo do perfeito passivo em português natural.
theological_decisions:
- issue: Sentido de 'temor do Senhor' no contexto
  choice: Manter 'temor do Senhor'.
  alternative: reverência pelo Senhor
  rationale: O contexto imediato do tribunal de Cristo sustenta uma noção forte que abrange reverência e consciência de prestação de contas; 'reverência' isoladamente poderia suavizar a tensão.
- issue: Força de φανερόω em relação a Deus e às consciências dos coríntios
  choice: Traduzir como 'ser plenamente conhecido'.
  alternative: estar manifesto; estar plenamente exposto
  rationale: A formulação expressa que o caráter e o ministério de Paulo estão abertos à avaliação, sem sugerir mera aquisição de informação por Deus nem acrescentar uma afirmação doutrinária alheia ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se o plural de 'consciências', a repetição de φανερόω e a tensão entre temor e reverência. 'Plenamente conhecidos' evita o pouco natural 'manifestos a Deus', enquanto a nota registra a alternativa mais formal.
