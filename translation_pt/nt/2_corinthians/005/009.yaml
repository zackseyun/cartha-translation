source:
  edition: SBLGNT
  text: διὸ καὶ φιλοτιμούμεθα, εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες, εὐάρεστοι αὐτῷ εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/009.yaml
  text: Therefore we also make it our ambition[a], whether at home or away, to be pleasing to him.
translation:
  language: pt
  text: Por isso, também temos por ambição, quer estejamos em casa, quer estejamos longe,[a] ser agradáveis a ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, explicitando o sentido indicado pelo contexto: “quer estejamos em casa, no corpo, quer longe do corpo”.'
    reason: Explicita os complementos que o contexto sugere, mas que o grego omite neste versículo.
lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Introduz naturalmente a conclusão tirada da discussão anterior sobre a vida no corpo e a presença com o Senhor.
- source_word: καὶ
  choice: também
  rationale: Mantém a ideia de acréscimo e continuidade presente no texto grego.
- source_word: φιλοτιμούμεθα
  choice: temos como ambição
  rationale: Preserva a força do verbo, que expressa uma aspiração assumida com empenho, sem reduzi-lo ao sentido mais fraco de simplesmente ter um objetivo.
- source_word: εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες
  choice: quer estejamos em casa, quer longe
  rationale: Reproduz de modo conciso o contraste literal entre estar em casa e estar longe, deixando que o contexto forneça os complementos omitidos no próprio versículo.
- source_word: εὐάρεστοι
  choice: agradáveis
  rationale: Expressa em português atual a condição de quem agrada ou é aceitável a alguém, preservando aqui o sentido relacional.
- source_word: αὐτῷ
  choice: a ele
  rationale: Mantém o pronome do grego, cujo referente contextual é o Senhor.
- source_word: εἶναι
  choice: ser
  rationale: 'Completa o conteúdo da ambição de Paulo: ser agradável ao Senhor.'
theological_decisions:
- issue: Se devem ser explicitados no texto os complementos implícitos de “em casa” e “longe”
  choice: Manter no texto principal a formulação concisa “quer estejamos em casa, quer longe”
  alternative: “quer estejamos em casa no corpo, quer longe do corpo”
  rationale: O contexto imediato, especialmente os versículos 6–8, indica que Paulo fala de estar no corpo ou longe dele; contudo, neste versículo o grego omite esses complementos. A tradução preserva essa concisão e registra a explicitação contextual em nota, sem resolver no texto o que o autor deixou implícito.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Temos como ambição” conserva a intensidade intencional de φιλοτιμούμεθα; “quer... quer...” traduz naturalmente a construção correlativa grega. A colocação da oração intercalada preserva, tanto quanto possível sem artificialidade, a ordem e a ênfase do original.
