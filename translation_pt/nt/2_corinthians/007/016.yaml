  text: I rejoice that in every way I have confidence in you[a].
translation:
  language: pt
  text: Alegro-me de que, em tudo, tenho confiança em vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Alegro-me porque, em todos os sentidos, estou confiante a respeito de vocês.”'
    reason: Registra a possível leitura causal de ὅτι, bem como alternativas legítimas para ἐν παντί, θαρρῶ e ἐν ὑμῖν.
lexical_decisions:
- source_word: χαίρω
  choice: Alegro-me
  rationale: Preserva o valor verbal do presente e o tom digno de Paulo, sendo natural em português moderno.
- source_word: ὅτι
  choice: porque
  rationale: Em português, “alegro-me porque” introduz com naturalidade aquilo que fundamenta e expressa a alegria; a distinção entre conteúdo e causa permanece próxima no contexto.
- source_word: ἐν παντί
  choice: em tudo
  rationale: Reproduz de modo conciso a abrangência da expressão grega e é idiomático em português.
- source_word: θαρρῶ
  choice: tenho confiança
  rationale: No contexto e com ἐν ὑμῖν, exprime confiança firme, sem excluir por completo a nuance lexical de coragem.
- source_word: ἐν ὑμῖν
  choice: em vocês
  rationale: Mantém a construção relacional do grego e comunica confiança depositada nos destinatários; “vocês” oferece ampla legibilidade brasileira.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A colocação pronominal “Alegro-me” conserva um tom literário natural; “vocês” evita regionalismo excessivo e representa com clareza o plural ὑμῖν.
