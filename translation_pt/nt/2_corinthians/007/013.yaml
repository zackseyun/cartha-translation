id: 2CO.7.13
reference: 2 Corinthians 7:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τοῦτο παρακεκλήμεθα. Ἐπὶ δὲ τῇ παρακλήσει ⸀ἡμῶν περισσοτέρως μᾶλλον ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου, ὅτι ἀναπέπαυται τὸ πνεῦμα αὐτοῦ ἀπὸ πάντων ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/013.yaml
  text: For this reason we have been comforted[a]. And in addition to our comfort, we rejoiced even more abundantly at Titus’s joy[b], because his spirit has been refreshed by all of you.
translation:
  language: pt
  text: Por isso, fomos consolados.[a] E, além dessa nossa consolação, nós nos alegramos ainda muito mais com a alegria de Tito, porque o espírito dele foi revigorado por todos vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encorajados”; os termos gregos traduzidos por “consolados” e “consolação” podem ter também o sentido de “encorajados” e “encorajamento” neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “encontrou descanso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural e conciso a relação causal ou consequencial indicada pela locução grega.
- source_word: παρακεκλήμεθα
  choice: fomos consolados
  rationale: Preserva a voz passiva e comunica o consolo resultante dos acontecimentos anteriores; a nota registra o sentido também possível de encorajamento.
- source_word: Ἐπὶ δὲ τῇ παρακλήσει ἡμῶν
  choice: E, além dessa nossa consolação
  rationale: Representa o acréscimo de uma alegria maior ao consolo já recebido, sem reproduzir de forma rígida a construção preposicional grega.
- source_word: περισσοτέρως μᾶλλον
  choice: ainda muito mais
  rationale: Conserva a intensificação enfática dos dois comparativos gregos em português corrente.
- source_word: ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου
  choice: nós nos alegramos ... com a alegria de Tito
  rationale: Mantém a repetição significativa entre o verbo alegrar-se e o substantivo alegria, bem como a relação entre a alegria dos autores e a de Tito.
- source_word: ἀναπέπαυται
  choice: foi revigorado
  rationale: Comunica a renovação e o alívio experimentados por Tito; a nota preserva a imagem alternativa de encontrar descanso.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: o espírito dele
  rationale: Traduz diretamente a linguagem antropológica do grego e deixa claro, em português corrente, que se trata do espírito de Tito.
- source_word: ἀπὸ πάντων ὑμῶν
  choice: por todos vocês
  rationale: Expressa naturalmente a fonte ou agência do revigoramento e mantém a inclusão enfática de toda a comunidade.
theological_decisions:
- issue: Sentido de πνεῦμα em referência a Tito
  choice: o espírito humano de Tito, isto é, seu íntimo ou disposição interior
  alternative: o Espírito Santo
  rationale: O possessivo αὐτοῦ e o contexto da reação pessoal de Tito indicam seu próprio espírito, não uma referência ao Espírito Santo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por “vocês” para o plural de segunda pessoa. A repetição de “consolados/consolação” e “alegramos/alegria” preserva as correspondências lexicais do grego. O pronome explícito “nós” na segunda oração ajuda a leitura após a expressão intercalada.
