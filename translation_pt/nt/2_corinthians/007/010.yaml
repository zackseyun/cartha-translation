id: 2CO.7.10
reference: 2 Corinthians 7:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ γὰρ κατὰ θεὸν λύπη μετάνοιαν εἰς σωτηρίαν ἀμεταμέλητον ⸀ἐργάζεται· ἡ δὲ τοῦ κόσμου λύπη θάνατον κατεργάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/010.yaml
  text: For godly sorrow produces repentance leading to salvation without regret[b][a], but worldly sorrow produces death.
translation:
  language: pt
  text: Pois a tristeza segundo Deus[b] produz um arrependimento que leva à salvação e não causa pesar[a], mas a tristeza do mundo produz morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «produz arrependimento para a salvação, do qual não se lamenta». O adjetivo grego pode ser entendido como qualificando mais diretamente «arrependimento».'
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, «tristeza de acordo com Deus» ou «tristeza conforme Deus».
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ θεὸν
  choice: segundo Deus
  rationale: Reproduz de perto a expressão grega e comunica uma tristeza conforme a vontade e o padrão de Deus, sem recorrer ao potencialmente ambíguo «tristeza divina».
- source_word: λύπη
  choice: tristeza
  rationale: É o equivalente português mais natural no contexto e funciona bem nas duas partes do contraste.
- source_word: μετάνοιαν
  choice: arrependimento
  rationale: Expressa a mudança moral e espiritual implicada no contexto, e não apenas uma reconsideração intelectual.
- source_word: εἰς σωτηρίαν
  choice: que leva à salvação
  rationale: Comunica a direção ou o resultado indicado por εἰς sem definir além do texto a relação causal entre arrependimento e salvação.
- source_word: ἀμεταμέλητον
  choice: não traz pesar
  rationale: Preserva o sentido de algo que não causa arrependimento posterior ou pesar, com formulação natural em português; a nota registra a possível ligação sintática direta com «arrependimento».
- source_word: ἐργάζεται
  choice: produz
  rationale: Expressa naturalmente a ideia de realizar ou causar um resultado.
- source_word: τοῦ κόσμου
  choice: do mundo
  rationale: Mantém a forma genitiva do grego e evita que «mundana» seja entendida apenas como secular ou ligada a prazeres.
- source_word: θάνατον
  choice: morte
  rationale: Mantém a amplitude do termo grego sem especificar se a morte é física, espiritual ou escatológica.
- source_word: κατεργάζεται
  choice: produz
  rationale: Embora seja formalmente distinto de ἐργάζεται, tem sentido próximo neste contexto; repetir «produz» preserva o paralelismo retórico.
theological_decisions:
- issue: Contraste entre duas espécies de tristeza
  choice: «tristeza segundo Deus» em contraste com «tristeza do mundo»
  alternative: «tristeza piedosa» em contraste com «tristeza mundana»
  rationale: A formulação escolhida preserva mais diretamente as relações gregas e não restringe «morte» a uma modalidade teológica específica.
- issue: Relação entre arrependimento e salvação
  choice: «arrependimento que leva à salvação»
  alternative: «arrependimento para a salvação» ou «arrependimento que resulta em salvação»
  rationale: A tradução conserva a orientação para a salvação sem transformar o enunciado numa formulação denominacional sobre os mecanismos da salvação.
- issue: Ligação sintática de ἀμεταμέλητον
  choice: No texto, a expressão é apresentada como resultado sem pesar dentro do conjunto «arrependimento que leva à salvação»
  alternative: 'Entender o adjetivo como qualificando diretamente «arrependimento»: «arrependimento do qual não se lamenta»'
  rationale: A sequência grega permite mais de uma ligação sintática plausível; a nota preserva essa ambiguidade em vez de resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Segundo Deus» conserva a formulação incomum mas significativa do original; «do mundo» mantém o contraste sem conotações coloquiais indevidas.
