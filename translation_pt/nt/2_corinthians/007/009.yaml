  text: νῦν χαίρω, οὐχ ὅτι ἐλυπήθητε, ἀλλ’ ὅτι ἐλυπήθητε εἰς μετάνοιαν, ἐλυπήθητε γὰρ κατὰ θεόν, ἵνα ἐν μηδενὶ ζημιωθῆτε ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/009.yaml
  text: Now I rejoice[a], not because you were grieved, but because you were grieved into a change of mind; for you were grieved according to God[c][b], so that you might suffer no loss from us.
translation:
  language: pt
  text: Agora me alegro, não porque vocês ficaram tristes, mas porque ficaram tristes a ponto de se arrependerem[a]. Pois vocês ficaram tristes segundo Deus[b], para que não sofressem prejuízo algum de nossa parte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficaram tristes de modo que mudaram de mente”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de maneira piedosa”; ou: “como Deus quer”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “para que vocês não fossem prejudicados por nossa causa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν χαίρω
  choice: Agora me alegro
  rationale: Mantém a perspectiva temporal presente de Paulo e o sentido verbal de χαίρω em linguagem natural e digna.
- source_word: ἐλυπήθητε
  choice: vocês ficaram tristes
  rationale: Expressa naturalmente em português o passivo que descreve a tristeza experimentada pelos destinatários e preserva a repetição central do versículo.
- source_word: εἰς μετάνοιαν
  choice: a ponto de se arrepender
  rationale: Comunica o movimento ou resultado expresso por εἰς e o sentido moral e espiritual de μετάνοια, evitando a construção pouco natural 'para o arrependimento'.
- source_word: κατὰ θεόν
  choice: segundo Deus
  rationale: Preserva a formulação aberta do grego, que pode indicar conformidade com o padrão, a vontade ou o propósito de Deus, sem reduzir a expressão a uma única interpretação.
- source_word: ζημιωθῆτε
  choice: não sofressem prejuízo algum
  rationale: Reproduz o sentido de perda ou dano de ζημιόω e o resultado pretendido introduzido por ἵνα, sem sugerir necessariamente dano físico.
- source_word: ἐξ ἡμῶν
  choice: de nossa parte
  rationale: Expressa de modo idiomático a procedência ou causa indicada por ἐξ, mantendo Paulo e seus colaboradores como possível fonte do prejuízo.
theological_decisions:
- issue: Sentido de μετάνοια
  choice: se arrepender
  alternative: mudar de mente
  rationale: Neste contexto, μετάνοια denota uma mudança moral produzida pela tristeza, para a qual 'arrepender-se' é a expressão portuguesa mais clara e adequada; a alternativa lexical mais literal é preservada em nota.
- issue: Natureza da tristeza em κατὰ θεόν
  choice: segundo Deus
  alternative: de maneira piedosa; como Deus quer
  rationale: A tradução formal conserva a relação teológica intencionalmente ampla entre a tristeza e Deus, sem decidir se a ênfase recai no padrão divino, na vontade de Deus ou no modo piedoso.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A construção é natural sem perder a repetição retórica de 'ficaram tristes'. 'Segundo Deus' foi mantido deliberadamente mais formal para preservar a ambiguidade genuína do original.
