source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἐν τῇ παρουσίᾳ αὐτοῦ, ἀλλὰ καὶ ἐν τῇ παρακλήσει ᾗ παρεκλήθη ἐφ’ ὑμῖν, ἀναγγέλλων ἡμῖν τὴν ὑμῶν ἐπιπόθησιν, τὸν ὑμῶν ὀδυρμόν, τὸν ὑμῶν ζῆλον ὑπὲρ ἐμοῦ, ὥστε με μᾶλλον χαρῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/007.yaml
  text: and not only by his coming, but also by the comfort with which he was comforted because of you, as he reported to us your longing, your mourning, and your zeal for me, so that I rejoiced even more.
translation:
  language: pt
  text: e não somente por sua chegada[a], mas também pelo consolo que ele recebeu por causa de vocês, ao nos contar do anseio de vocês, do pranto de vocês[c] e do zelo de vocês por mim, de modo que eu me alegrei ainda mais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “presença”.
    reason: lexical_alternative
  - marker: c
    text: Ou “lamentação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρουσίᾳ
  choice: chegada
  rationale: No contexto da viagem de Tito, refere-se naturalmente à sua chegada, embora o termo também possa significar presença.
- source_word: παρακλήσει / παρεκλήθη
  choice: consolo / recebeu
  rationale: O contexto destaca alívio e consolo após aflição. Em português, evitar a repetição literal 'consolo com que foi consolado' produz uma frase mais natural sem perder o sentido passivo; 'encorajamento' continua possível.
- source_word: ἐφ’ ὑμῖν
  choice: por causa de vocês
  rationale: 'Expressa a base ou ocasião do consolo de Tito: a resposta dos coríntios lhe trouxe consolo.'
- source_word: ἀναγγέλλων
  choice: Ele nos contou
  rationale: Explicita de modo natural que Tito comunicou a Paulo a reação dos coríntios, preservando a função explicativa do particípio.
- source_word: ἐπιπόθησιν
  choice: saudade que vocês sentem
  rationale: Comunica um desejo intenso e afetivo em português corrente; no contexto, o objeto implícito é Paulo.
- source_word: ὀδυρμόν
  choice: pranto
  rationale: Preserva tanto a tristeza quanto sua expressão em lamentação, com alternativa possível em 'lamentação'.
- source_word: ζῆλον
  choice: zelo
  rationale: Equivalente direto que conserva a ideia de fervorosa dedicação ou preocupação.
- source_word: ὑπὲρ ἐμοῦ
  choice: por mim
  rationale: Mantém a amplitude da expressão, que pode indicar zelo em favor de Paulo ou a respeito dele.
- source_word: ὥστε με μᾶλλον χαρῆναι
  choice: Assim, minha alegria foi ainda maior
  rationale: Exprime com naturalidade o resultado e preserva a força comparativa de μᾶλλον.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção foi dividida em frases para clareza, sem alterar as relações lógicas do grego. Não se incluiu nota [b], pois 'encorajamento' exigiria uma reformulação mais ampla e a tradução natural em português não repete o cognato nominal e verbal.
