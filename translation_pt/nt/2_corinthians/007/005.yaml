id: 2CO.7.5
reference: 2 Corinthians 7:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ γὰρ ἐλθόντων ἡμῶν εἰς Μακεδονίαν οὐδεμίαν ⸀ἔσχηκεν ἄνεσιν ἡ σὰρξ ἡμῶν, ἀλλ’ ἐν παντὶ θλιβόμενοι— ἔξωθεν μάχαι, ἔσωθεν φόβοι—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/005.yaml
  text: For even when we came into Macedonia[a], our flesh had no rest, but we were afflicted in every way—conflicts on the outside, fears on the inside—
translation:
  language: pt
  text: Pois, mesmo quando chegamos à Macedônia, nossa carne não teve descanso algum[a]; pelo contrário, fomos afligidos de todas as maneiras — por fora, conflitos; por dentro, temores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nós mesmos não tivemos descanso algum”. O grego diz literalmente “nossa carne”, expressão que aqui se refere à fragilidade e à aflição humanas em sua existência corporal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Pois, mesmo
  rationale: Mantém a ligação explicativa com o contexto anterior e a leve ênfase da combinação grega, em português natural.
- source_word: ἐλθόντων ἡμῶν εἰς Μακεδονίαν
  choice: quando chegamos à Macedônia
  rationale: Traduz o genitivo absoluto como oração temporal; 'chegamos à' expressa de modo idiomático o movimento indicado por εἰς.
- source_word: οὐδεμίαν ἔσχηκεν ἄνεσιν
  choice: não teve descanso algum
  rationale: ἄνεσις pode indicar descanso, alívio ou folga da pressão; esta formulação preserva a força da negação e soa natural.
- source_word: ἡ σὰρξ ἡμῶν
  choice: nossa carne
  rationale: Conserva a expressão concreta do grego, que aqui aponta para a fragilidade e aflição humanas em sua existência corporal, não para uma 'natureza pecaminosa'.
- source_word: ἀλλ’ ἐν παντὶ θλιβόμενοι
  choice: pelo contrário, fomos afligidos de todas as maneiras
  rationale: O particípio passivo comunica pressão ou aflição sofrida; a formulação mantém o contraste e a abrangência de ἐν παντί.
- source_word: ἔξωθεν μάχαι
  choice: por fora, conflitos
  rationale: μάχαι pode designar lutas, disputas ou conflitos; 'conflitos' evita restringir a expressão a combate físico e preserva a oposição espacial.
- source_word: ἔσωθεν φόβοι
  choice: por dentro, temores
  rationale: Mantém o paralelismo conciso com 'por fora' e traduz φόβοι sem reduzir necessariamente o sentido a ansiedade psicológica.
theological_decisions:
- issue: Sentido de σάρξ
  choice: nossa carne
  alternative: nós mesmos; nosso corpo
  rationale: Neste contexto, σάρξ descreve a pessoa humana em sua fragilidade corporal e sujeita à aflição, não uma natureza moralmente pecaminosa. A tradução literal preserva a textura e a tensão da expressão; a equivalência idiomática é registrada em nota.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo final foi mantido de forma concisa: ''por fora... por dentro''. O marcador [a] aparece imediatamente após a expressão a que se refere.'
