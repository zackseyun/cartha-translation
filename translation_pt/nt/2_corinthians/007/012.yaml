  text: ἄρα εἰ καὶ ἔγραψα ὑμῖν, οὐχ ⸀ἕνεκεν τοῦ ἀδικήσαντος, ⸀οὐδὲ ⸁ἕνεκεν τοῦ ἀδικηθέντος, ἀλλ’ ⸀1ἕνεκεν τοῦ φανερωθῆναι τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/012.yaml
  text: So even if I wrote to you[a], it was not because of the one who did wrong, nor because of the one who was wronged[b], but so that your earnestness for us might be made known among you before God.
translation:
  language: pt
  text: Portanto, ainda que eu tenha escrito a vocês, não foi por causa daquele que cometeu a injustiça, nem por causa daquele que sofreu a injustiça, mas para que o empenho de vocês por nós se tornasse evidente entre vocês diante de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “mas para que o nosso empenho por vocês se tornasse evidente entre vocês diante de Deus”.'
    reason: textual_variant
lexical_decisions:
- source_word: ἄρα εἰ καὶ
  choice: Portanto, ainda que
  rationale: “Portanto” preserva a inferência de ἄρα, e “ainda que” comunica naturalmente a força concessiva de εἰ καί.
- source_word: ἔγραψα ὑμῖν
  choice: eu tenha escrito a vocês
  rationale: O pretérito perfeito composto do subjuntivo encaixa-se naturalmente na oração concessiva portuguesa e remete à carta anterior de Paulo.
- source_word: τοῦ ἀδικήσαντος
  choice: daquele que cometeu a injustiça
  rationale: Mantém a ideia verbal do particípio substantivado sem identificar de modo mais específico a pessoa ou a natureza da ofensa.
- source_word: τοῦ ἀδικηθέντος
  choice: daquele que sofreu a injustiça
  rationale: Reproduz o paralelismo e a voz passiva do particípio, em linguagem clara e digna.
- source_word: ἕνεκεν τοῦ φανερωθῆναι
  choice: para que ... se tornasse evidente
  rationale: Expressa a finalidade da construção com infinitivo articular e conserva o sentido passivo de φανερωθῆναι.
- source_word: τὴν σπουδὴν ὑμῶν
  choice: o empenho de vocês
  rationale: “Empenho” reúne as ideias de diligência, zelo e séria disposição presentes em σπουδή, com boa legibilidade em português atual.
- source_word: τὴν ὑπὲρ ἡμῶν
  choice: por nós
  rationale: Preserva de maneira concisa a orientação favorável ou solicitude expressa por ὑπέρ.
- source_word: πρὸς ὑμᾶς
  choice: entre vocês
  rationale: Nesta construção difícil, “entre vocês” oferece uma leitura portuguesa coerente para a manifestação ocorrida no âmbito da comunidade, sem apagar a ambiguidade textual e sintática.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: diante de Deus
  rationale: Formulação corrente e solene que conserva a noção de presença e testemunho divinos.
theological_decisions:
- issue: Referente e sentido de “o empenho de vocês por nós ... entre vocês” numa cláusula sintaticamente difícil
  choice: 'O texto principal segue a forma impressa no SBLGNT: o empenho dos coríntios por Paulo e seus cooperadores tornou-se evidente entre eles diante de Deus.'
  alternative: “o nosso empenho por vocês se tornasse evidente entre vocês diante de Deus”
  rationale: A leitura principal traduz diretamente ὑμῶν (“de vocês”) e ὑπὲρ ἡμῶν (“por nós”). A variante textual antiga, que inverte os referentes, é relevante e por isso é preservada em nota, sem ser incorporada silenciosamente ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “injustiça” preserva o paralelismo entre os particípios ativo e passivo; “empenho” evita tanto um tom excessivamente técnico quanto uma interpretação emocional estreita.
