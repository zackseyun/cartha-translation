id: 2CO.7.15
reference: 2 Corinthians 7:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὰ σπλάγχνα αὐτοῦ περισσοτέρως εἰς ὑμᾶς ἐστιν ἀναμιμνῃσκομένου τὴν πάντων ὑμῶν ὑπακοήν, ὡς μετὰ φόβου καὶ τρόμου ἐδέξασθε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/015.yaml
  text: And his affection for you is even greater as he remembers the obedience of all of you[a], how you received him with fear and trembling.
translation:
  language: pt
  text: E o afeto dele por vocês é ainda maior quando se lembra da obediência de todos vocês e de como o receberam com temor e tremor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com reverência e tremor”. A expressão “temor e tremor” é uma forma paulina de indicar uma atitude séria, humilde e reverente.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: afeto
  rationale: Embora designe literalmente as partes interiores, o termo é usado de modo idiomático para sentimentos profundos e ternos. “Afeto” é natural, digno e preserva a força emocional.
- source_word: περισσοτέρως
  choice: ainda maior
  rationale: O advérbio comparativo intensifica o afeto de Tito por eles; “ainda maior” comunica claramente essa progressão.
- source_word: εἰς ὑμᾶς
  choice: por vocês
  rationale: Indica a direção do afeto para os coríntios. Em português, “afeto por vocês” é a construção mais natural.
- source_word: ἀναμιμνῃσκομένου
  choice: quando se lembra
  rationale: O particípio genitivo expressa a circunstância em que seu afeto aumenta. A formulação preserva o sentido recordativo sem rigidez sintática.
- source_word: τὴν πάντων ὑμῶν ὑπακοήν
  choice: da obediência de todos vocês
  rationale: Mantém o sentido direto de ὑπακοή e a ênfase inclusiva de πάντων ὑμῶν sobre toda a comunidade.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: com temor e tremor
  rationale: Preserva a expressão paulina reconhecível e sua tensão sem reduzi-la no texto principal a mero respeito ou a terror.
- source_word: ἐδέξασθε αὐτόν
  choice: o receberam
  rationale: Traduz de modo amplo e direto a acolhida dada a Tito, mantendo o pronome do grego e evitando explicitação desnecessária.
theological_decisions:
- issue: Sentido de “temor e tremor” na recepção de Tito
  choice: Manter a expressão “com temor e tremor” no texto principal
  alternative: “com reverência e tremor”
  rationale: A expressão pode envolver temor real, reverência, seriedade e resposta humilde. Preservar o idioma paulino evita resolver silenciosamente essa tensão; a nota esclarece o sentido contextual provável.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Vocês” torna inequívoco o plural e “afeto” mantém dignidade sem soar arcaico. A coordenação “e de como” explicita naturalmente que Tito se lembra tanto da obediência quanto da maneira como foi recebido.
