  source_fidelity: O texto preserva com precisão o imperativo plural Χωρήσατε («Abram espaço para») e seu objeto ἡμᾶς («nós»), mantendo a metáfora relacional sem inserir no texto principal «coração». As três negações com οὐδένα são conservadas. «Prejudicamos», «corrompemos» e «exploramos» correspondem adequadamente a ἠδικήσαμεν, ἐφθείραμεν e ἐπλεονεκτήσαμεν, respectivamente, sem restringir indevidamente o alcance dos verbos gregos.
