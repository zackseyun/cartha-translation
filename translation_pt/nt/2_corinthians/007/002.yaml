id: 2CO.7.2
reference: 2 Corinthians 7:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Χωρήσατε ἡμᾶς· οὐδένα ἠδικήσαμεν, οὐδένα ἐφθείραμεν, οὐδένα ἐπλεονεκτήσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/002.yaml
  text: Make room for us[a]. We have wronged no one, corrupted no one[b], taken advantage of no one.
translation:
  language: pt
  text: Abram espaço para nós[a]. Não prejudicamos ninguém, não corrompemos ninguém[b], não exploramos ninguém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Recebam-nos», «Acolham-nos» ou «Abram o coração para nós». O grego diz literalmente «Abram espaço para nós», provavelmente retomando a linguagem relacional de 6:11–13.
    reason: lexical_alternative
  - marker: b
    text: Ou «não arruinamos ninguém» ou «não desencaminhamos ninguém».
    reason: lexical_alternative
lexical_decisions:
- source_word: Χωρήσατε
  choice: Abram espaço para
  rationale: O imperativo plural pede acolhimento relacional. A formulação preserva a metáfora do grego e a ligação com 6:11–13, sem acrescentar explicitamente «no coração».
- source_word: ἡμᾶς
  choice: nós
  rationale: Objeto direto do imperativo, vertido de modo simples e natural.
- source_word: οὐδένα
  choice: ninguém
  rationale: A repetição tríplice é mantida para conservar a ênfase retórica da negação.
- source_word: ἠδικήσαμεν
  choice: prejudicamos
  rationale: ἀδικέω indica agir injustamente contra alguém ou causar-lhe dano. «Prejudicamos» é corrente e suficientemente amplo; «fizemos injustiça a» seria mais formal.
- source_word: ἐφθείραμεν
  choice: corrompemos
  rationale: φθείρω pode significar corromper, arruinar ou destruir. Neste contexto, «corrompemos» preserva a possibilidade de dano moral ou espiritual sem especificá-la além do texto.
- source_word: ἐπλεονεκτήσαμεν
  choice: exploramos
  rationale: πλεονεκτέω denota tirar vantagem de alguém, frequentemente em benefício próprio. «Exploramos» é conciso, natural e não restringe a ideia apenas a fraude financeira.
theological_decisions:
- issue: Natureza do apelo em Χωρήσατε ἡμᾶς
  choice: Apelo relacional para que os coríntios deem espaço a Paulo e seus companheiros
  alternative: Convite mais geral para que os recebam ou acolham
  rationale: O contexto imediato de 6:11–13 fala de afetos alargados e de retribuição relacional. A tradução conserva a metáfora sem inserir «coração», palavra que não aparece neste versículo.
- issue: Sentido de ἐφθείραμεν
  choice: Dano expresso como corrupção
  alternative: Arruinamos, desencaminhamos ou exploramos
  rationale: O verbo tem amplitude semântica, e o contexto não determina de maneira inequívoca a forma do dano. «Corrompemos» mantém a provável dimensão moral ou espiritual, enquanto a nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, mas amplamente compreensível no mundo lusófono. Conserva-se o paralelismo enfático das três negações e a metáfora relacional inicial.
