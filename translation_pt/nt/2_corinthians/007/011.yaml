  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ αὐτὸ τοῦτο τὸ κατὰ θεὸν ⸀λυπηθῆναι πόσην κατειργάσατο ὑμῖν σπουδήν, ἀλλὰ ἀπολογίαν, ἀλλὰ ἀγανάκτησιν, ἀλλὰ φόβον, ἀλλὰ ἐπιπόθησιν, ἀλλὰ ζῆλον, ἀλλὰ ἐκδίκησιν· ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς ⸀εἶναι τῷ πράγματι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/011.yaml
  text: 'For see what earnestness this very grief according to God has produced in you: but also a defense[a], but also indignation, but also fear, but also longing, but also zeal, but also vindication[c][b]. In every way you proved yourselves to be pure in the matter.'
translation:
  language: pt
  text: 'Pois vejam quanto empenho essa mesma tristeza segundo Deus[a] produziu em vocês! E mais: que defesa[b], que indignação, que temor, que anseio, que zelo e que justiça[c]! Em tudo vocês demonstraram estar puros nesse assunto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “essa mesma tristeza que agrada a Deus” ou “conforme a vontade de Deus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que esforço para se defenderem” ou “para demonstrarem sua inocência”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “que punição”, “que aplicação da justiça” ou “que determinação para corrigir o mal”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Pois vejam
  rationale: “Pois” preserva a função explicativa de γάρ, e “vejam” mantém o chamado enfático de ἰδού para que os leitores atentem aos resultados enumerados.
- source_word: αὐτὸ τοῦτο τὸ κατὰ θεὸν λυπηθῆναι
  choice: essa mesma tristeza segundo Deus
  rationale: A forma substantivada expressa o fato de terem ficado tristes. “Essa mesma tristeza” é natural em português, enquanto “segundo Deus” conserva a formulação aberta de κατὰ θεόν sem reduzi-la silenciosamente a uma única interpretação.
- source_word: πόσην κατειργάσατο ὑμῖν σπουδήν
  choice: quanta dedicação ... produziu em vocês
  rationale: κατεργάζομαι indica produzir ou efetuar um resultado; σπουδή descreve empenho sério e diligente. “Dedicação” distingue o termo de ζῆλος mais adiante.
- source_word: ἀλλὰ ... ἀλλὰ
  choice: 'E mais: que ... que ...'
  rationale: A repetição de ἀλλά é aditiva e enfática, não uma série de contrastes fortes. A construção portuguesa mantém o efeito cumulativo da lista sem a rigidez pouco natural de repetir “mas também”.
- source_word: ἀπολογίαν
  choice: defesa
  rationale: O termo indica uma resposta em defesa própria ou uma tentativa de se eximir de cumplicidade. “Defesa” mantém a concisão e a amplitude do grego.
- source_word: ἀγανάκτησιν
  choice: indignação
  rationale: Expressa forte desagrado moral sem determinar se seu objeto era o pecado, o ofensor ou a situação.
- source_word: φόβον
  choice: temor
  rationale: O grego não explicita o objeto do temor. A tradução preserva essa abertura, sem acrescentar “de Deus”, “de Paulo” ou “das consequências”.
- source_word: ἐπιπόθησιν
  choice: saudade
  rationale: No contexto relacional da carta, o termo comunica desejo intenso de reencontro ou restauração. “Saudade” é natural em português e não precisa explicitar seu objeto.
- source_word: ζῆλον
  choice: zelo
  rationale: Mantém a intensidade moral do termo e o distingue de σπουδή, traduzido como “dedicação”.
- source_word: ἐκδίκησιν
  choice: disposição para fazer justiça
  rationale: O substantivo pode indicar punição, reivindicação ou ação corretiva contra o mal. A expressão comunica uma resposta decidida para pôr a situação em ordem, sem sugerir vingança pessoal.
- source_word: ἐν παντὶ συνεστήσατε ἑαυτοὺς
  choice: Em tudo vocês demonstraram
  rationale: 'ἐν παντί resume a resposta de maneira abrangente, e συνίστημι tem aqui sentido evidencial: suas ações mostraram sua condição quanto ao caso.'
- source_word: ἁγνοὺς εἶναι τῷ πράγματι
  choice: estar puros nesse assunto
  rationale: “Puros” preserva a linguagem moral de ἁγνούς, e “nesse assunto” mantém a referência ampla de τῷ πράγματι sem definir além do texto a natureza exata da inocência alegada.
theological_decisions:
- issue: Sentido de κατὰ θεόν
  choice: segundo Deus
  alternative: que agrada a Deus; conforme a vontade de Deus
  rationale: A expressão pode descrever uma tristeza medida pelo padrão de Deus, produzida em relação a ele ou de acordo com sua vontade. A formulação mais próxima do grego conserva essa tensão, e a nota oferece uma leitura idiomática possível.
- issue: Força de ἐκδίκησις no contexto do arrependimento
  choice: disposição para fazer justiça
  alternative: punição; reivindicação; ação para corrigir o mal
  rationale: O contexto aponta para uma resposta concreta e resoluta ao erro, mas não define com precisão se Paulo enfatiza punição, justiça corretiva ou vindicação. A tradução evita tanto a ideia de vingança pessoal quanto uma leitura exclusivamente punitiva.
- issue: Pureza dos coríntios quanto ao caso
  choice: estar puros nesse assunto
  alternative: estar inocentes nesse caso
  rationale: A escolha preserva a afirmação de Paulo sem transformá-la numa absolvição irrestrita ou jurídica. A pureza é qualificada pelo próprio texto como relativa “a esse assunto”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A exclamação e a sequência de “que” reproduzem o impulso retórico e cumulativo de Paulo. “Saudade” foi preferida a “anelo” por ser corrente e expressiva; “temor” preserva um registro bíblico natural sem explicitar um objeto ausente no grego.
