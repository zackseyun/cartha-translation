  text: ⸂πρὸς κατάκρισιν οὐ⸃ λέγω, προείρηκα γὰρ ὅτι ἐν ταῖς καρδίαις ἡμῶν ἐστε εἰς τὸ συναποθανεῖν καὶ συζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/003.yaml
  text: I do not say this to condemn you[a], for I have said before that you are in our hearts[b], to die together and to live together.
translation:
  language: pt
  text: Não digo isso para condenar[a], pois já disse que vocês estão em nossos corações, para morrermos juntos e vivermos juntos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não digo isso para condenação” ou “com vistas à condenação”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para juntos morrermos e juntos vivermos”. O grego enfatiza a solidariedade compartilhada tanto na morte como na vida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς κατάκρισιν
  choice: para condená-los
  rationale: A preposição πρός com o acusativo κατάκρισιν indica finalidade ou direção. A formulação verbal é natural em português e deixa explícito, pelo contexto, que os coríntios são os possíveis alvos da condenação.
- source_word: λέγω
  choice: digo isso
  rationale: O presente é vertido naturalmente por “digo”; “isso” retoma as observações anteriores de Paulo e torna a referência clara em português.
- source_word: προείρηκα
  choice: já disse
  rationale: O perfeito aponta para uma declaração anterior que continua pertinente. “Já disse” comunica de modo corrente essa anterioridade e sua relevância presente.
- source_word: ἐν ταῖς καρδίαις ἡμῶν ἐστε
  choice: vocês estão em nosso coração
  rationale: A expressão preserva a imagem bíblica de profunda afeição e vínculo interior. Embora καρδίαις esteja no plural no grego, o singular coletivo “nosso coração” é mais idiomático em português e mantém a referência a Paulo e seus companheiros.
- source_word: εἰς τὸ συναποθανεῖν καὶ συζῆν
  choice: para juntos morrermos e juntos vivermos
  rationale: '“Para” conserva a relação aberta de finalidade ou resultado do grego. A repetição de “juntos” representa o prefixo συν- nos dois verbos e mantém o paralelismo enfático, incluindo a ordem incomum: morrer e viver.'
theological_decisions:
- issue: Se “morrermos juntos e vivermos juntos” deve ser interpretado explicitamente como união pactual, conjugal ou cristológica
  choice: Manter a linguagem de solidariedade relacional sem lhe atribuir uma categoria teológica técnica
  alternative: Explicitar uma alusão à lealdade pactual ou à participação em Cristo
  rationale: O texto exprime vínculo profundo e solidariedade entre Paulo, seus cooperadores e os coríntios, mas não identifica expressamente uma categoria teológica específica.
- issue: Relação semântica de εἰς τὸ com a afirmação de que os coríntios estão no coração dos autores
  choice: Usar “para”, preservando a abertura entre finalidade, resultado e orientação relacional
  alternative: Traduzir de modo interpretativo como “de modo que” ou “dispostos a”
  rationale: A construção admite matizes próximos, e uma tradução mais explicativa resolveria uma ambiguidade genuína que o grego deixa aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural e preserva o calor afetivo, o paralelismo e a tensão semântica do original.
