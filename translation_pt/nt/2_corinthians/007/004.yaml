  text: πολλή μοι παρρησία πρὸς ὑμᾶς, πολλή μοι καύχησις ὑπὲρ ὑμῶν· πεπλήρωμαι τῇ παρακλήσει, ὑπερπερισσεύομαι τῇ χαρᾷ ἐπὶ πάσῃ τῇ θλίψει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/004.yaml
  text: I have great boldness toward you[a], and great boasting on your behalf. I am filled with encouragement[c][b]; I overflow with joy in all our affliction.
translation:
  language: pt
  text: Tenho grande liberdade para falar com vocês[a] e muito me orgulho de vocês. Estou cheio de encorajamento[b]; transbordo de alegria em meio a toda a nossa aflição[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tenho muita franqueza com vocês”. O termo grego também pode indicar ousadia, abertura e liberdade para falar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “consolo”. A palavra grega inclui tanto fortalecimento e ânimo como consolação.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “apesar de toda a nossa aflição”. A expressão também pode ser entendida como alegria que transborda enquanto a aflição continua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: confiança
  rationale: O termo expressa confiança franca e liberdade para falar. Em português, “confiança” soa natural na relação com os coríntios, enquanto a nota preserva a nuance de franqueza.
- source_word: πρὸς ὑμᾶς
  choice: em vocês
  rationale: Com παρρησία, a expressão indica a orientação relacional da confiança de Paulo. “Confiança em vocês” é idiomático em português.
- source_word: καύχησις ὑπὲρ ὑμῶν
  choice: muito me orgulho de vocês
  rationale: A formulação comunica de modo natural a avaliação positiva e pública de Paulo a respeito dos coríntios, sem sugerir vanglória autocentrada.
- source_word: πεπλήρωμαι
  choice: Estou cheio
  rationale: 'O perfeito passivo descreve um estado presente resultante: Paulo se encontra plenamente tomado pelo encorajamento.'
- source_word: παρακλήσει
  choice: encorajamento
  rationale: παράκλησις abrange fortalecimento, consolo e ânimo. “Encorajamento” preserva bem a dimensão fortalecedora, e a nota registra a alternativa contextual “consolo”.
- source_word: ὑπερπερισσεύομαι
  choice: transbordo
  rationale: O verbo intensivo comunica superabundância; “transbordo” mantém a imagem de excesso com concisão e naturalidade.
- source_word: χαρᾷ
  choice: alegria
  rationale: Equivalente direto e natural de χαρά.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: em meio a toda a nossa aflição
  rationale: A expressão apresenta a alegria como coexistindo com a aflição. “Em meio a” torna clara essa esfera circunstancial sem convertê-la numa simples oposição.
- source_word: πολλή ... πολλή
  choice: grande ... muito
  rationale: 'A repetição grega enfatiza abundância. Em português natural, as construções exigem formas diferentes: “grande confiança” e “muito me orgulho”.'
theological_decisions:
- issue: Linguagem paulina positiva de καύχησις
  choice: “muito me orgulho de vocês”
  alternative: “tenho grande motivo de gloriar-me por vocês”
  rationale: A escolha conserva o sentido positivo de Paulo falar favoravelmente dos coríntios, mas evita que “vanglória” sugira necessariamente exaltação pecaminosa. A alternativa mais formal preservaria de modo mais visível a família lexical paulina.
- issue: Tensão entre alegria e sofrimento
  choice: “em meio a toda a nossa aflição”
  alternative: “apesar de toda a nossa aflição”
  rationale: “Em meio a” preserva a coexistência paradoxal entre alegria abundante e sofrimento, sem resolver a relação como meramente adversativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A redação prioriza naturalidade sem apagar a intensidade do grego nem a tensão entre alegria e aflição.
