id: 2CO.7.1
reference: 2 Corinthians 7:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ταύτας οὖν ἔχοντες τὰς ἐπαγγελίας, ἀγαπητοί, καθαρίσωμεν ἑαυτοὺς ἀπὸ παντὸς μολυσμοῦ σαρκὸς καὶ πνεύματος, ἐπιτελοῦντες ἁγιωσύνην ἐν φόβῳ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/001.yaml
  text: Therefore[a], since we have these promises, beloved, let us cleanse ourselves from every defilement of flesh and spirit[c][b], bringing holiness to completion in the fear of God.
translation:
  language: pt
  text: Portanto, amados, visto que temos essas promessas, purifiquemo-nos de toda contaminação da carne e do espírito,[a] levando a santidade à plenitude[b] no temor de Deus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de toda impureza do corpo e do espírito”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aperfeiçoando a santidade”.'
    reason: lexical_alternative
  - marker: c
    text: A expressão “temor de Deus” inclui profundo respeito e reverente assombro diante de Deus, não mero terror.
    reason: lexical_clarification
lexical_decisions:
- source_word: ταύτας ... τὰς ἐπαγγελίας
  choice: essas promessas
  rationale: ἐπαγγελία tem naturalmente o sentido de “promessa” no uso paulino, e o demonstrativo retoma as garantias divinas citadas imediatamente antes.
- source_word: οὖν
  choice: Portanto
  rationale: Marca a conclusão prática decorrente do argumento e das promessas anteriores; “portanto” torna clara essa ligação lógica.
- source_word: ἀγαπητοί
  choice: amados
  rationale: Preserva o vocativo afetuoso e solene, bem estabelecido no português bíblico e ainda compreensível hoje.
- source_word: καθαρίσωμεν ἑαυτοὺς
  choice: purifiquemo-nos
  rationale: O subjuntivo aoristo na primeira pessoa do plural tem força exortativa inclusiva. A forma pronominal portuguesa transmite de modo direto “purifiquemos a nós mesmos” e combina naturalmente com a linguagem de contaminação e santidade.
- source_word: ἀπὸ παντὸς μολυσμοῦ
  choice: de toda contaminação
  rationale: μολυσμός denota mancha, impureza ou contaminação moral e religiosa. “Contaminação” conserva essa ressonância sem soar excessivamente arcaico.
- source_word: σαρκὸς καὶ πνεύματος
  choice: da carne e do espírito
  rationale: A tradução literal mantém o contraste entre as dimensões corporal e interior da pessoa e evita interpretar σάρξ como “natureza pecaminosa” neste contexto.
- source_word: ἐπιτελοῦντες
  choice: levando ... à plenitude
  rationale: O particípio descreve a ação concomitante de conduzir algo até seu pleno desenvolvimento ou término. Esta formulação é natural em português e não sugere perfeição absoluta já alcançada.
- source_word: ἁγιωσύνην
  choice: a santidade
  rationale: ἁγιωσύνη designa a qualidade ou condição de santidade; “santidade” é a correspondência mais clara e usual.
- source_word: ἐν φόβῳ θεοῦ
  choice: no temor de Deus
  rationale: Mantém o idioma bíblico e sua força, abrangendo reverência e profundo assombro diante de Deus sem reduzir φόβος a mero terror.
theological_decisions:
- issue: Sentido de σάρξ em “contaminação da carne e do espírito”
  choice: carne
  alternative: corpo; natureza pecaminosa
  rationale: O paralelismo com “espírito” aponta para as dimensões exterior/corporal e interior da pessoa inteira. “Carne” preserva a expressão grega e evita introduzir aqui o sentido paulino especializado de orientação pecaminosa.
- issue: Força de καθαρίσωμεν
  choice: 'Exortação inclusiva: “purifiquemo-nos”'
  alternative: devemos nos purificar
  rationale: A primeira pessoa do plural inclui Paulo e seus leitores na exortação e tem mais força do que uma simples declaração de dever.
- issue: Relação entre purificação e ἐπιτελοῦντες ἁγιωσύνην
  choice: “levando a santidade à plenitude” como ação concomitante
  alternative: aperfeiçoando a santidade
  rationale: A construção conserva a ideia de processo rumo à completude sem decidir além do texto como essa santidade se relaciona com categorias doutrinárias de santificação.
- issue: Sentido de φόβος diante de Deus
  choice: temor de Deus
  alternative: reverência por Deus
  rationale: “Temor” preserva a tensão e o peso da expressão bíblica, enquanto a nota esclarece que não se trata de simples pavor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Amados”, “carne”, “espírito”, “santidade” e “temor de Deus” conservam a densidade do vocabulário bíblico sem recorrer a construções antiquadas. Os marcadores foram colocados junto às expressões que explicam.
