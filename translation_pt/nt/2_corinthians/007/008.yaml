- from: Pois, ainda que eu os tenha entristecido com a carta, não lamento — embora tenha lamentado[a], pois vejo que aquela carta os entristeceu, ainda que só por algum tempo[b].
  to: Pois, mesmo que eu os tenha entristecido com a carta, não me arrependo disso — embora antes sentisse pesar por isso, pois vejo que aquela carta os entristeceu, ainda que só por pouco tempo.
  rationale: A revisão explicita o objeto de μεταμέλομαι e diferencia de modo natural o arrependimento presente do estado passado de pesar indicado pelo imperfeito, preservando a ambiguidade não doutrinária do termo. O marcador a é mantido junto à cláusula correspondente e o marcador b junto à expressão temporal.
