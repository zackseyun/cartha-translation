source:
  edition: SBLGNT
  text: ἀλλ’ ὁ παρακαλῶν τοὺς ταπεινοὺς παρεκάλεσεν ἡμᾶς ὁ θεὸς ἐν τῇ παρουσίᾳ Τίτου·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/006.yaml
  text: But God[a], who comforts the humble[b], comforted us by the coming of Titus.
translation:
  language: pt
  text: Mas Deus, que consola os abatidos[a], nos consolou com a chegada de Tito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os humildes” ou “os de condição humilde”.
    reason: lexical_alternative
  - marker: b
    text: Ou “pela presença de Tito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Mas
  rationale: Marca o contraste com as aflições descritas no contexto anterior, de maneira natural e concisa em português.
- source_word: ὁ παρακαλῶν
  choice: que consola
  rationale: O particípio presente substantivado descreve uma ação característica de Deus. “Consola” se ajusta ao contexto de aflição e mantém a ligação lexical com παρεκάλεσεν.
- source_word: τοὺς ταπεινοὺς
  choice: os abatidos
  rationale: No contexto, o adjetivo substantivado designa pessoas postas em condição baixa ou desanimadas pela aflição. “Os abatidos” expressa esse sentido circunstancial sem atribuir necessariamente uma virtude moral de humildade.
- source_word: παρεκάλεσεν
  choice: nos consolou
  rationale: O aoristo relata a ação concreta de Deus e repete a raiz de παρακαλῶν; a repetição de “consola/consolou” preserva essa conexão.
- source_word: ἐν τῇ παρουσίᾳ
  choice: com a chegada
  rationale: παρουσία pode indicar presença ou chegada. Aqui, a vinda efetiva de Tito constitui o meio ou a ocasião do consolo; “com a chegada” é corrente e preserva certa abertura relacional entre ocasião e meio.
- source_word: Τίτου
  choice: de Tito
  rationale: Forma portuguesa tradicional do nome próprio, integrada naturalmente à expressão.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Mantém o sujeito explícito e sua função enfática como aquele que consola.
theological_decisions:
- issue: Sentido de τοὺς ταπεινοὺς no contexto
  choice: os abatidos
  alternative: os humildes; os de condição humilde
  rationale: O termo pode indicar humildade, condição social baixa ou alguém que foi rebaixado pelas circunstâncias. O contexto imediato de aflição e consolo favorece “os abatidos”, mas a nota preserva a amplitude semântica.
- issue: Valor de ἐν τῇ παρουσίᾳ Τίτου
  choice: com a chegada de Tito
  alternative: pela presença de Tito
  rationale: A expressão pode focalizar tanto a chegada quanto a presença pessoal de Tito. O contexto narrativo favorece a chegada, sem excluir que sua presença tenha sido o meio do consolo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição “consola/consolou” reproduz deliberadamente a ligação lexical do grego. Todos os marcadores de nota aparecem no texto principal.
