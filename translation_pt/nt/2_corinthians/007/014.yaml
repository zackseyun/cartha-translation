  to: Pois, se me gloriei diante dele a respeito de vocês[a], não fui envergonhado. Pelo contrário, assim como tudo o que lhes dissemos foi verdadeiro, também o nosso gloriar-nos diante de Tito se mostrou verdadeiro.[b]
