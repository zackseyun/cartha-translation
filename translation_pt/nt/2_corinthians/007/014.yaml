reference: 2 Corinthians 7:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι εἴ τι αὐτῷ ὑπὲρ ὑμῶν κεκαύχημαι, οὐ κατῃσχύνθην, ἀλλ’ ὡς πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν, οὕτως καὶ ἡ καύχησις ἡμῶν ⸀ἡ ἐπὶ Τίτου ἀλήθεια ἐγενήθη.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/014.yaml
  text: For if I have boasted to him at all about you[a], I was not put to shame; rather, just as we spoke everything to you in truth[b], so also our boasting to Titus proved true.
translation:
  language: pt
  text: Pois, se me gloriei diante dele a respeito de vocês[a], não fui envergonhado. Pelo contrário, assim como tudo o que lhes dissemos foi verdadeiro, também o nosso gloriar-nos diante de Tito se mostrou verdadeiro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se falei com orgulho de vocês a ele”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o nosso gloriar-nos a Tito”; isto é, o que lhe dissemos a respeito de vocês.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κεκαύχημαι
  choice: me gloriei
  rationale: Preserva a força retórica de καυχάομαι e sua relação com καύχησις, sem implicar necessariamente arrogância pecaminosa.
- source_word: οὐ κατῃσχύνθην
  choice: não fui envergonhado
  rationale: A forma passiva indica que Paulo não acabou exposto à vergonha por suas palavras terem sido desmentidas pelos fatos.
- source_word: πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν
  choice: lhes falamos tudo com verdade
  rationale: Mantém o alcance de πάντα e traduz ἐν ἀληθείᾳ naturalmente como o modo verdadeiro do falar.
- source_word: ἡ καύχησις ἡμῶν ἡ ἐπὶ Τίτου
  choice: o que dissemos com orgulho a Tito
  rationale: Expressa em português corrente a fala elogiosa e confiante dirigida a Tito, mantendo o referente contextual aos coríntios; a construção grega admite uma tradução mais formal.
- source_word: ἀλήθεια ἐγενήθη
  choice: mostrou-se verdadeiro
  rationale: Reproduz idiomaticamente a ideia de que a afirmação de Paulo foi confirmada pelos acontecimentos.
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a explicação ligada ao versículo anterior.
theological_decisions:
- issue: Natureza do gloriar-se de Paulo
  choice: Manter a linguagem de gloriar-se e de falar com orgulho, deixando o contexto mostrar que se trata de elogio confiante e justificado.
  alternative: Traduzir como ter confiança ou falar confiantemente para evitar conotação negativa.
  rationale: καυχάομαι e καύχησις podem designar, no uso paulino, uma exaltação ou recomendação confiante, não necessariamente arrogância pecaminosa. A tradução preserva essa tensão lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pronomes de uso brasileiro. A formulação evita a ambiguidade indesejada de “nosso orgulho diante de Tito”, mas registra em nota a estrutura mais literal do grego.
