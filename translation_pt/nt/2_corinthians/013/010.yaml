id: 2CO.13.10
reference: 2 Corinthians 13:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τοῦτο ταῦτα ἀπὼν γράφω, ἵνα παρὼν μὴ ἀποτόμως χρήσωμαι κατὰ τὴν ἐξουσίαν ἣν ⸂ὁ κύριος ἔδωκέν μοι⸃, εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/010.yaml
  text: For this reason I write these things while absent[a], so that when present I may not have to act harshly[b], according to the authority that the Lord gave me for building up and not for tearing down.
translation:
  language: pt
  text: Por essa razão, escrevo estas coisas enquanto estou ausente, para que, quando estiver presente, eu não tenha de agir com severidade[a], segundo a autoridade que o Senhor me deu para edificar, e não para derrubar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “usar de severidade” ou “proceder com rigor”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “para edificação, e não para destruição”. O grego emprega uma metáfora de construção: “para edificar, e não para derrubar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por essa razão
  rationale: Expressa com naturalidade a ligação causal e consequencial explícita com o contexto anterior.
- source_word: ταῦτα
  choice: estas coisas
  rationale: Mantém o plural do demonstrativo e remete ao conteúdo da carta ou às advertências anteriores.
- source_word: ἀπὼν
  choice: enquanto estou ausente
  rationale: Traduz o particípio com valor temporal e preserva o contraste com παρὼν.
- source_word: γράφω
  choice: escrevo
  rationale: O presente simples é direto, natural no contexto epistolar e corresponde ao aspecto da forma grega.
- source_word: ἵνα
  choice: para que
  rationale: Comunica claramente a finalidade da escrita de Paulo.
- source_word: παρὼν
  choice: quando estiver presente
  rationale: Expressa o valor temporal do particípio e equilibra a formulação anterior sobre estar ausente.
- source_word: μὴ ἀποτόμως χρήσωμαι
  choice: eu não tenha de agir com severidade
  rationale: ἀποτόμως comunica rigor ou dureza, e χράομαι, neste contexto, indica proceder ou agir. A formulação explicita de modo idiomático a necessidade indesejada implícita no contexto.
- source_word: κατὰ τὴν ἐξουσίαν
  choice: segundo a autoridade
  rationale: κατά indica conformidade ou correspondência com a autoridade confiada a Paulo.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Preserva o título do texto grego sem especificar além do que o versículo afirma.
- source_word: ἔδωκέν μοι
  choice: me deu
  rationale: O pretérito perfeito simples traduz naturalmente o aoristo que se refere à concessão da autoridade.
- source_word: εἰς οἰκοδομὴν
  choice: para edificar
  rationale: Mantém a metáfora de construção paulina em linguagem atual e acessível.
- source_word: καθαίρεσιν
  choice: derrubar
  rationale: Preserva o contraste metafórico com edificar melhor do que uma formulação abstrata como 'destruição'.
theological_decisions:
- issue: Referente de “o Senhor” na declaração sobre a autoridade concedida
  choice: o Senhor
  alternative: Identificar explicitamente como Jesus ou empregar uma referência divina mais ampla
  rationale: O grego traz ὁ κύριος. A tradução conserva o título e não impõe uma identificação mais específica do que a expressa neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o contraste entre ausência e presença e preserva a metáfora arquitetônica no fecho do versículo.
