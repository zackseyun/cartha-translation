  text: προείρηκα καὶ προλέγω ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν ⸀νῦν, τοῖς προημαρτηκόσιν καὶ τοῖς λοιποῖς πᾶσιν, ὅτι ἐὰν ἔλθω εἰς τὸ πάλιν οὐ φείσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/002.yaml
  text: I have said before[a], and I say beforehand now while absent, as when present the second time, to those who sinned previously and to all the rest, that if I come again, I will not spare them.
translation:
  language: pt
  text: 'Eu já disse antes e digo de antemão, agora que estou ausente, assim como fiz quando estive presente pela segunda vez, aos que pecaram anteriormente e a todos os demais: se eu for outra vez[a], não os pouparei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: «se eu for pela terceira vez». O grego diz literalmente «se eu for outra vez», mas o contexto das visitas de Paulo sugere uma visita posterior à segunda.'
    reason: alternative_reading
lexical_decisions:
- source_word: προείρηκα
  choice: Eu já disse antes
  rationale: O perfeito indica algo dito anteriormente que continua em vigor. A formulação preserva esse valor sem acrescentar explicitamente a ideia de advertência.
- source_word: προλέγω
  choice: digo de antemão
  rationale: Mantém a ideia literal de falar antecipadamente e a continuidade lexical com προείρηκα; o tom de advertência decorre do contexto.
- source_word: ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν νῦν
  choice: agora que estou ausente, ... como quando estive presente pela segunda vez
  rationale: Explicita de modo natural o contraste entre a ausência atual de Paulo e sua presença anterior, sem apagar a construção condensada do grego.
- source_word: τοῖς προημαρτηκόσιν
  choice: aos que pecaram anteriormente
  rationale: O particípio perfeito identifica pessoas cujo pecado anterior está em vista, sem afirmar se houve ou não arrependimento.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: a todos os demais
  rationale: Reproduz o alcance abrangente de πᾶσιν e distingue esse grupo dos que pecaram anteriormente.
- source_word: ἐὰν ἔλθω εἰς τὸ πάλιν
  choice: se eu for outra vez
  rationale: Expressa naturalmente o retorno de Paulo. A identificação explícita como terceira visita depende do contexto e fica na nota.
- source_word: οὐ φείσομαι
  choice: não os pouparei
  rationale: φείδομαι comunica não poupar ou não se abster de agir com severidade. O pronome retoma naturalmente as pessoas advertidas.
theological_decisions:
- issue: Alcance da severidade anunciada por Paulo
  choice: A advertência é dirigida aos que pecaram anteriormente e também a todos os demais, sem especificar a forma exata da ação apostólica.
  alternative: Restringir a ameaça apenas aos que haviam pecado ou explicá-la como uma medida disciplinar específica.
  rationale: A sintaxe inclui ambos os grupos, enquanto οὐ φείσομαι anuncia severidade sem definir um procedimento eclesiástico concreto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada para fluência sem eliminar o contraste temporal do grego. O marcador [a] aparece no texto principal.
