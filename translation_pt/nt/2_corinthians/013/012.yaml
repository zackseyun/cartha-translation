reference: 2 Corinthians 13:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀσπάσασθε ἀλλήλους ἐν ἁγίῳ φιλήματι. ἀσπάζονται ὑμᾶς οἱ ἅγιοι πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/012.yaml
  text: Greet one another with a holy kiss[b][a]. All the saints greet you.
translation:
  language: pt
  text: Saúdem uns aos outros com um beijo santo.[a] Todos os santos[b] mandam saudações a vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com um beijo sagrado”. A expressão se refere a uma forma de saudação reconhecida naquela cultura e marcada pela santidade e pela comunhão cristã.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “santos” significa os fiéis, isto é, o povo santo de Deus; não se refere apenas a uma classe especial de cristãos canonizados.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saúdem
  rationale: O imperativo aoristo médio, na segunda pessoa do plural, expressa uma exortação direta. “Saúdem” é natural, conciso e mantém o destinatário plural.
- source_word: ἀλλήλους
  choice: uns aos outros
  rationale: O pronome recíproco indica uma ação mútua dentro da comunidade; esta é a formulação mais corrente em português.
- source_word: ἐν ἁγίῳ φιλήματι
  choice: com um beijo santo
  rationale: Na fórmula de saudação, ἐν é expresso idiomaticamente por “com”. “Beijo” preserva o sentido direto de φίλημα, e “santo” mantém o caráter consagrado e comunitário do gesto.
- source_word: ἀσπάζονται ὑμᾶς
  choice: mandam saudações a vocês
  rationale: No encerramento epistolar, esta formulação portuguesa comunica naturalmente que terceiros enviam suas saudações aos destinatários e torna explícito o plural de ὑμᾶς.
- source_word: οἱ ἅγιοι πάντες
  choice: Todos os santos
  rationale: Em Paulo, ἅγιοι designa habitualmente os que pertencem ao povo santo de Deus. “Santos” preserva essa terminologia, enquanto πάντες é traduzido diretamente por “Todos”.
theological_decisions:
- issue: Sentido comunitário de ἅγιοι
  choice: santos
  alternative: povo santo de Deus
  rationale: “Santos” conserva o termo paulino tradicional e aplica-se aqui a todos os fiéis, sem restringi-lo a uma categoria posterior de pessoas canonizadas.
- issue: Caráter de ἅγιος em “beijo santo”
  choice: santo
  alternative: sagrado
  rationale: “Santo” preserva a ligação lexical com a santidade e caracteriza a saudação como própria da comunhão cristã, sem transformar o gesto em rito sacramental.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para tornar claro o plural de ὑμᾶς; mantém “beijo santo” e “santos” por sua importância lexical e teológica, esclarecendo possíveis ambiguidades em notas.
