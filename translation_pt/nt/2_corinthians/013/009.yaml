  text: χαίρομεν γὰρ ὅταν ἡμεῖς ἀσθενῶμεν, ὑμεῖς δὲ δυνατοὶ ἦτε· ⸀τοῦτο καὶ εὐχόμεθα, τὴν ὑμῶν κατάρτισιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/009.yaml
  text: 'For we rejoice when we are weak and you are strong[a]. And this also is what we pray for: your restoration.'
translation:
  language: pt
  text: 'Pois nos alegramos quando nós somos fracos, e vocês são fortes. E também oramos por isto: pela restauração de vocês[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu amadurecimento”, “seu aperfeiçoamento” ou “sua plena preparação”. O termo grego pode indicar restauração, preparo ou o ato de levar algo à condição adequada ou completa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρομεν
  choice: nos alegramos
  rationale: Expressa a disposição presente de Paulo e preserva o sentido positivo forte do verbo em linguagem portuguesa natural.
- source_word: γὰρ
  choice: pois
  rationale: Mantém a ligação explicativa com o contexto anterior sem tornar a frase excessivamente causal.
- source_word: ὅταν
  choice: quando
  rationale: Com o subjuntivo, introduz uma circunstância temporal geral; “quando” é natural e não restringe indevidamente o sentido.
- source_word: ἀσθενῶμεν
  choice: estamos fracos
  rationale: Preserva a amplitude da fraqueza mencionada por Paulo — que pode ser aparente, social ou ministerial — sem especificá-la além do texto.
- source_word: δυνατοὶ
  choice: fortes
  rationale: Forma o contraste direto e natural com “fracos” e evita limitar o termo à ideia de poder ou autoridade.
- source_word: τοῦτο καὶ εὐχόμεθα
  choice: E também oramos por isto
  rationale: Traduz εὐχόμεθα como oração e conserva a ênfase de τοῦτο, preparando de modo natural a explicação seguinte.
- source_word: κατάρτισιν
  choice: que vocês sejam restaurados
  rationale: Comunica a ideia de serem postos na condição adequada no contexto pastoral, enquanto a nota preserva os sentidos possíveis de aperfeiçoamento, preparo e completude.
theological_decisions:
- issue: Sentido de κατάρτισις no objetivo pastoral de Paulo
  choice: que vocês sejam restaurados
  alternative: que vocês alcancem a maturidade; que sejam aperfeiçoados ou levados à condição adequada
  rationale: “Restaurados” se ajusta à preocupação de correção pastoral no contexto, sem transformar o termo em uma doutrina técnica de perfeição. A nota mantém a amplitude lexical genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para leitura natural no Brasil. A repetição enfática de “nós” foi preservada no primeiro contraste; a formulação final com oração subordinada torna κατάρτισιν idiomático em português sem eliminar sua ambiguidade, explicitada na nota.
