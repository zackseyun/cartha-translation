  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ καὶ ἡ ἀγάπη τοῦ θεοῦ καὶ ἡ κοινωνία τοῦ ἁγίου πνεύματος μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/013.yaml
  text: The grace of the Lord Jesus Christ[a], and the love of God, and the fellowship of the Holy Spirit[b], be with all of you.
translation:
  language: pt
  text: A graça do Senhor Jesus, o Messias[a], e o amor de Deus, e a comunhão do Espírito Santo[b] estejam com todos vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, tradicionalmente, “Senhor Jesus Cristo”.
    reason: alternative_reading
  - marker: b
    text: Ou “a participação no Espírito Santo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: graça
  rationale: Termo consagrado nas bênçãos paulinas; preserva tanto a ideia de favor quanto seu peso teológico.
- source_word: κυρίου
  choice: Senhor
  rationale: Equivalente natural e tradicional de κύριος como título cristológico neste contexto.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Χριστός funciona aqui como título, não como simples sobrenome; “o Messias” comunica seu significado, enquanto a forma tradicional é mantida em nota.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: o amor de Deus
  rationale: Mantém o genitivo grego sem decidir explicitamente se o foco recai apenas no amor que procede de Deus ou em outra relação genitiva possível.
- source_word: κοινωνία
  choice: comunhão
  rationale: “Comunhão” é corrente em português e conserva os sentidos relacionais de vínculo, compartilhamento e participação presentes em κοινωνία.
- source_word: ἁγίου πνεύματος
  choice: Espírito Santo
  rationale: Forma contemporânea, clara e amplamente reconhecida para a referência ao Espírito divino.
- source_word: μετὰ πάντων ὑμῶν
  choice: estejam com todos vocês
  rationale: O verbo é suprido pela construção de bênção; “todos vocês” representa explicitamente πάντων ὑμῶν e tem ampla legibilidade brasileira.
theological_decisions:
- issue: Sentido titular de Χριστοῦ
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: Traduzir o título torna explícito o valor de Χριστός no grego; a forma tradicional e igualmente reconhecível permanece disponível em nota.
- issue: Sentido de κοινωνία τοῦ ἁγίου πνεύματος
  choice: a comunhão do Espírito Santo
  alternative: a participação no Espírito Santo
  rationale: A construção genitiva admite nuances de comunhão vinculada ao Espírito e de participação nele. O texto principal preserva a formulação ampla, e a nota registra a alternativa sem resolver indevidamente a ambiguidade.
- issue: Verbo implícito na bênção
  choice: estejam
  alternative: seja
  rationale: O grego não traz verbo expresso. O plural concorda naturalmente em português com os três elementos coordenados — graça, amor e comunhão — sem alterar o caráter de bênção.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A coordenação foi apresentada sem repetir “e” após cada membro, conforme o uso natural do português, e “todos vocês” conserva a inclusão explícita do original.
