source:
  edition: SBLGNT
  text: ⸀εὐχόμεθα δὲ πρὸς τὸν θεὸν μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν, οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν, ἀλλ’ ἵνα ὑμεῖς τὸ καλὸν ποιῆτε, ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/007.yaml
  text: We pray to God that you may do nothing wrong—not so that we may appear approved[a], but so that you may do what is right[c][b], even if we may seem disqualified.
translation:
  language: pt
  text: Oramos, porém, a Deus para que vocês não façam mal algum[a] — não para que pareçamos aprovados[b], mas para que vocês façam o que é bom, ainda que sejamos como reprovados[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não façam nada de errado” ou “não pratiquem mal algum”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, aprovados depois de postos à prova; também pode ser traduzido por “comprovadamente autênticos”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “ainda que pareçamos reprovados” ou “ainda que sejamos tidos por não aprovados”. O grego contrasta aqui termos relacionados, traduzidos por “aprovados” e “reprovados”.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐχόμεθα δὲ πρὸς τὸν θεόν
  choice: Oramos, porém, a Deus
  rationale: εὐχόμεθα indica oração dirigida a Deus; πρός com o acusativo expressa essa direção. “Porém” representa δέ sem acrescentar uma ideia temporal inexistente no grego.
- source_word: μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν
  choice: para que vocês não façam mal algum
  rationale: A construção infinitiva apresenta o conteúdo da oração. κακὸν μηδέν é uma negação enfática; “mal algum” preserva sua força ética e é natural em português.
- source_word: οὐχ ἵνα
  choice: não para que
  rationale: Mantém a ideia de propósito negado introduzida por οὐχ ἵνα.
- source_word: δόκιμοι φανῶμεν
  choice: pareçamos aprovados
  rationale: δόκιμοι designa os que foram testados e aprovados, enquanto φανῶμεν diz respeito a aparecer ou ser visto de determinada maneira. A tradução conserva tanto a avaliação quanto a dimensão pública.
- source_word: τὸ καλὸν ποιῆτε
  choice: vocês façam o que é bom
  rationale: Em contexto ético, τὸ καλόν é aquilo que é bom ou correto. “O que é bom” mantém a expressão ampla e concreta.
- source_word: ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν
  choice: ainda que sejamos como reprovados
  rationale: A tradução mantém ὡς (“como”) e o contraste lexical entre δόκιμοι e ἀδόκιμοι por meio de “aprovados/reprovados”, sem decidir de forma indevida se Paulo fala de condição, aparência ou avaliação alheia.
theological_decisions:
- issue: Sentido de ὡς ἀδόκιμοι na autodescrição de Paulo
  choice: “ainda que sejamos como reprovados”
  alternative: “ainda que pareçamos reprovados” ou “ainda que sejamos tidos por reprovados”
  rationale: O contexto envolve prova e reconhecimento apostólico, mas ὡς permite mais de uma nuance. A redação principal preserva a tensão entre condição e percepção, sem transformar a expressão em afirmação sobre condenação espiritual definitiva.
- issue: Contraste entre δόκιμοι e ἀδόκιμοι
  choice: “aprovados” e “reprovados”
  alternative: “comprovadamente autênticos” e “não aprovados”
  rationale: O par escolhido reproduz em português a oposição de termos gregos relacionados e mantém a linguagem de teste ou avaliação presente no contexto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para o plural. A formulação evita um “agora” sem correspondente no texto grego e conserva o conectivo δέ por meio de “porém”. O travessão organiza o contraste retórico sem alterar sua estrutura.
