  text: Τρίτον τοῦτο ἔρχομαι πρὸς ὑμᾶς· ἐπὶ στόματος δύο μαρτύρων καὶ τριῶν σταθήσεται πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/001.yaml
  text: 'This is the third time I am coming to you: “Every matter will be established by the testimony of two witnesses or three.”[a][b]'
translation:
  language: pt
  text: 'Esta é a terceira vez que vou até vocês: “Toda questão será estabelecida pelo depoimento de duas ou três testemunhas.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Toda palavra será estabelecida pela boca de duas ou três testemunhas”. O grego segue de perto a formulação de Deuteronômio 19:15 e emprega uma expressão jurídica.'
    reason: lexical_alternative
  - marker: b
    text: Alusão a Deuteronômio 19:15.
    reason: cross_reference
lexical_decisions:
- source_word: Τρίτον τοῦτο
  choice: Esta é a terceira vez
  rationale: A expressão acusativa tem valor adverbial e indica a terceira ocorrência da ida de Paulo; esta formulação é natural e clara em português.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: que vou até vocês
  rationale: O presente ἔρχομαι tem sentido iminente ou futuro no contexto. “Vou até vocês” preserva a ideia de deslocamento e soa natural em português.
- source_word: ἐπὶ στόματος
  choice: pelo depoimento de
  rationale: Trata-se de uma expressão jurídica que ecoa Deuteronômio 19:15. “Pelo depoimento de” comunica seu sentido forense sem a obscuridade da tradução literal “pela boca de”.
- source_word: δύο μαρτύρων καὶ τριῶν
  choice: duas ou três testemunhas
  rationale: Na fórmula jurídica citada, καί tem sentido distributivo equivalente a “ou”; a ordem escolhida é idiomática em português e conserva o alcance do texto.
- source_word: σταθήσεται
  choice: será estabelecida
  rationale: O futuro passivo de ἵστημι, neste contexto jurídico, indica que algo será estabelecido ou confirmado.
- source_word: πᾶν ῥῆμα
  choice: Toda questão
  rationale: Embora ῥῆμα possa significar “palavra” ou “declaração”, na citação legal designa uma questão ou matéria em consideração. “Questão” mantém o sentido amplo sem restringi-lo a uma acusação específica.
theological_decisions:
- issue: Uso da norma jurídica de Deuteronômio no contexto disciplinar de Paulo
  choice: Traduzir a citação como princípio jurídico amplo aplicável a toda questão.
  alternative: Traduzir πᾶν ῥῆμα literalmente como “toda palavra” ou, de modo mais específico, como “toda acusação”.
  rationale: A tradução preserva a força jurídica geral da citação sem limitá-la à disciplina eclesiástica nem introduzir uma interpretação doutrinária não expressa no grego.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A tradução principal verte o idioma jurídico de maneira natural; a nota preserva a possibilidade de uma tradução mais literal.
