source:
  edition: SBLGNT
  text: καὶ ⸀γὰρ ἐσταυρώθη ἐξ ἀσθενείας, ἀλλὰ ζῇ ἐκ δυνάμεως θεοῦ. καὶ γὰρ ἡμεῖς ἀσθενοῦμεν ἐν αὐτῷ, ἀλλὰ ⸀ζήσομεν σὺν αὐτῷ ἐκ δυνάμεως θεοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/004.yaml
  text: For indeed he was crucified in weakness[a], but he lives by the power of God. For indeed we are weak in him[d][c][b], but we will live with him by the power of God toward you.
translation:
  language: pt
  text: Pois, de fato, ele foi crucificado em fraqueza[a], mas vive pelo poder de Deus. Pois também nós somos fracos nele, mas viveremos com ele[c], pelo poder de Deus[b], em relação a vocês[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a partir da fraqueza». A preposição grega ἐξ pode expressar origem ou fundamento; neste contexto, «em fraqueza» é mais natural em português.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: «a partir do poder de Deus». O grego repete a preposição ἐκ, estabelecendo um contraste deliberado entre a fraqueza e o poder divino.'
    reason: lexical_alternative
  - marker: c
    text: «Viveremos com ele» pode se referir à futura manifestação da vida fortalecida por Cristo na atuação de Paulo em relação aos coríntios e também pode evocar o tema mais amplo da vida da ressurreição.
    reason: alternative_reading
  - marker: d
    text: 'Ou: «para vocês» ou «entre vocês». A expressão grega εἰς ὑμᾶς é condensada e pode indicar direção, relação ou efeito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσταυρώθη
  choice: foi crucificado
  rationale: O aoristo passivo de σταυρόω é expresso de modo preciso e corrente pela formulação tradicional «foi crucificado».
- source_word: ἐξ ἀσθενείας
  choice: em fraqueza
  rationale: Embora ἐξ possa indicar origem ou fundamento, aqui «em fraqueza» comunica naturalmente em português a condição na qual ocorreu a crucificação e preserva o contraste com o poder de Deus.
- source_word: ζῇ
  choice: vive
  rationale: Preserva o presente verbal e apresenta a vida de Cristo como realidade vigente, em contraste com sua crucificação.
- source_word: ἐκ δυνάμεως θεοῦ
  choice: pelo poder de Deus
  rationale: Em português, «pelo poder de Deus» expressa com naturalidade o poder divino como fundamento ou meio da vida, sem perder o contraste deliberado com a fraqueza.
- source_word: ἀσθενοῦμεν
  choice: somos fracos
  rationale: Mantém a ligação lexical com ἀσθένεια, traduzida por «fraqueza», sem acrescentar a ideia mais específica de impotência absoluta.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Conserva de forma compacta a linguagem paulina de participação ou união com Cristo, sem explicá-la excessivamente.
- source_word: ζήσομεν
  choice: viveremos
  rationale: Preserva o futuro do verbo e não decide se a referência se limita à atuação apostólica futura ou se também evoca a vida da ressurreição.
- source_word: σὺν αὐτῷ
  choice: com ele
  rationale: Expressa diretamente a associação e participação indicadas por σύν.
- source_word: εἰς ὑμᾶς
  choice: em relação a vocês
  rationale: A expressão grega é condensada e pode indicar direção, referência ou efeito. «Em relação a vocês» é natural em português e mantém essa amplitude contextual.
theological_decisions:
- issue: O sentido da fraqueza de Cristo na crucificação
  choice: Manter a afirmação de que ele foi crucificado «em fraqueza», como parte do paradoxo entre a crucificação e a vida pelo poder de Deus.
  alternative: Explicitar que a fraqueza era apenas aparente ou percebida pelos seres humanos.
  rationale: O texto fala realmente de fraqueza, mas não explica aqui sua natureza. A tradução preserva essa formulação sem negar a divindade, a integridade ou a ausência de pecado de Cristo e sem inserir uma explicação dogmática no versículo.
- issue: A referência de «viveremos com ele»
  choice: Preservar uma formulação ampla que permita tanto a manifestação futura da vida e do poder de Cristo no ministério de Paulo perante os coríntios quanto uma ressonância mais abrangente da vida da ressurreição.
  alternative: Restringir a frase exclusivamente à ressurreição futura ou exclusivamente à atuação apostólica de Paulo.
  rationale: O contexto imediato aponta para a futura atuação de Paulo em relação aos coríntios, enquanto a linguagem de viver com Cristo pode evocar temas mais amplos de participação em sua vida. O futuro simples mantém essa tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com «vocês» para a segunda pessoa do plural. A redação mantém a repetição de «poder de Deus» e a correspondência entre «fraqueza» e «fracos». As vírgulas na segunda oração tornam clara a ligação de «pelo poder de Deus» e «em relação a vocês» com «viveremos com ele».
