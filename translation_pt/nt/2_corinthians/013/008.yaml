  text: For we are not able to do anything against the truth[a], but for the truth.
translation:
  language: pt
  text: Pois nada podemos fazer contra a verdade, mas a favor da verdade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois não podemos fazer coisa alguma contra a verdade, mas em apoio à verdade.”'
    reason: Alternativa lexical para “a favor da verdade”, explicitando o sentido de apoio de ὑπέρ sem acrescentar “somente”.
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Pois ... nada
  rationale: γάρ introduz a explicação do que precede; “pois” é um conector natural e conciso. A negação οὐ, com τι, é expressa idiomaticamente por “nada”.
- source_word: δυνάμεθά τι
  choice: nada podemos fazer
  rationale: δύναμαι indica capacidade ou poder, e τι sob negação assume sentido abrangente. Esta formulação preserva a incapacidade afirmada e soa natural em português.
- source_word: κατὰ τῆς ἀληθείας
  choice: contra a verdade
  rationale: κατά com genitivo tem aqui sentido adversativo. O artigo é mantido, sem restringir “a verdade” a uma fórmula doutrinária específica.
- source_word: ἀλλὰ
  choice: mas
  rationale: ἀλλά estabelece o contraste enfático entre as duas partes da frase.
- source_word: ὑπὲρ τῆς ἀληθείας
  choice: a favor da verdade
  rationale: ὑπέρ expressa apoio ou defesa. “A favor da verdade” mantém o paralelismo direto com “contra a verdade” e esclarece o sentido em português corrente.
theological_decisions:
- issue: Sentido de “a verdade” na antítese de Paulo
  choice: Manter “a verdade” sem restringi-la a uma fórmula doutrinária específica
  alternative: “a verdade do evangelho” ou “aquilo que é verdadeiro”
  rationale: A expressão grega é ampla. No contexto, inclui certamente a verdade do evangelho, mas o texto não a limita explicitamente; a tradução preserva essa amplitude e tensão.
- issue: Alcance da incapacidade afirmada
  choice: Traduzir literalmente a incapacidade de agir contra a verdade, sem explicar sua natureza
  alternative: Parafrasear como incapacidade moral, apostólica ou divina de prevalecer contra a verdade
  rationale: O versículo não especifica se a incapacidade é moral, vocacional ou relacionada ao resultado final. A tradução evita resolver essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A inversão leve em “nada podemos fazer” conserva a concisão e o equilíbrio retórico entre “contra” e “a favor”.
