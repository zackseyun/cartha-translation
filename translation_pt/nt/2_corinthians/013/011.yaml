reference: 2 Corinthians 13:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Λοιπόν, ἀδελφοί, χαίρετε, καταρτίζεσθε, παρακαλεῖσθε, τὸ αὐτὸ φρονεῖτε, εἰρηνεύετε, καὶ ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/011.yaml
  text: Finally[a], brothers, rejoice, be restored, be encouraged, think the same thing, live in peace[e][d][c][b], and the God of love and peace will be with you.
translation:
  language: pt
  text: Por fim, irmãos,[a] alegrem-se,[b] sejam restaurados,[c] sejam encorajados,[d] tenham o mesmo modo de pensar,[e] vivam em paz, e o Deus de amor e paz estará com vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “irmãos” é uma forma coletiva de se dirigir à congregação e provavelmente inclui homens e mulheres.
    reason: cultural_note
  - marker: b
    text: 'Ou “despeçam-se”. O grego também pode funcionar como uma saudação de encerramento, mas aqui provavelmente continua a série de exortações: “alegrem-se”.'
    reason: lexical_alternative
  - marker: c
    text: Ou “sejam aperfeiçoados”, “sejam postos em ordem” ou “restaurem-se”.
    reason: lexical_alternative
  - marker: d
    text: Ou “aceitem encorajamento” ou “aceitem exortação”.
    reason: lexical_alternative
  - marker: e
    text: Literalmente, “pensem a mesma coisa”; isto é, vivam em unidade de pensamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπόν
  choice: Por fim
  rationale: Marca a aproximação do encerramento da carta de modo natural e atual.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva a forma masculina plural do grego; no contexto, é uma forma coletiva de dirigir-se à congregação inteira, como esclarece a nota.
- source_word: χαίρετε
  choice: alegrem-se
  rationale: Embora também possa funcionar como saudação de despedida, aqui integra uma sequência de exortações imperativas.
- source_word: καταρτίζεσθε
  choice: deixem-se restaurar
  rationale: Expressa a forma passiva ou média e a ideia de ser reconduzido à condição apropriada, sem sugerir perfeição absoluta.
- source_word: παρακαλεῖσθε
  choice: deixem-se encorajar
  rationale: Mantém a voz passiva ou média e a abertura semântica para receber encorajamento ou exortação.
- source_word: τὸ αὐτὸ φρονεῖτε
  choice: tenham o mesmo modo de pensar
  rationale: Reproduz de maneira natural a ideia literal de pensar a mesma coisa, preservando a ênfase na unidade de disposição.
- source_word: εἰρηνεύετε
  choice: vivam em paz
  rationale: Comunica a conduta pacífica contínua indicada pelo imperativo presente.
- source_word: ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης
  choice: o Deus de amor e paz
  rationale: Tradução direta e idiomática da expressão genitiva.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: estará com vocês
  rationale: Expressa com clareza a promessa no futuro e usa uma forma amplamente compreensível em português moderno.
theological_decisions:
- issue: Alcance inclusivo de ἀδελφοί no tratamento congregacional
  choice: irmãos, com nota explicando que o termo abrange a congregação
  alternative: irmãos e irmãs
  rationale: A forma principal preserva o masculino plural do original, enquanto a nota torna explícito seu provável alcance sobre homens e mulheres.
- issue: Relação entre as exortações e a promessa da presença divina
  choice: manter a conjunção “e”, sem explicitar causalidade ou condição
  alternative: entender a presença de Deus como resultado ou condição ligada às exortações
  rationale: O grego apenas coordena as orações com καί; a tradução não deve acrescentar uma relação teológica mais específica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O plural “vocês” é usado na promessa final, e os imperativos são formulados de modo natural. As notas preservam ambiguidades lexicais reais sem sobrecarregar o texto principal.
