source:
  edition: SBLGNT
  text: Ἑαυτοὺς πειράζετε εἰ ἐστὲ ἐν τῇ πίστει, ἑαυτοὺς δοκιμάζετε· ἢ οὐκ ἐπιγινώσκετε ἑαυτοὺς ὅτι ⸂Ἰησοῦς Χριστὸς⸃ ἐν ⸀ὑμῖν; εἰ μήτι ἀδόκιμοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/005.yaml
  text: Test yourselves to see whether you are in the faith[a]; examine yourselves[c][b]. Or do you not recognize that Jesus the Messiah is in you?—unless indeed you are disqualified.
translation:
  language: pt
  text: Examinem a si mesmos para ver se estão na fé[a]; ponham a si mesmos à prova. Ou vocês não reconhecem que Jesus, o Messias, está em vocês[b]? A não ser que sejam reprovados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Na fé” pode se referir tanto a permanecer na fé cristã quanto a possuir fé genuína.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “entre vocês”.'
    reason: alternative_reading
lexical_decisions:
- source_word: πειράζετε
  choice: Examinem
  rationale: Neste contexto, o imperativo pede autoavaliação, não tentação. “Examinem” é natural em português e comunica a ideia de verificar a autenticidade.
- source_word: ἐν τῇ πίστει
  choice: na fé
  rationale: Preserva a formulação definida do grego e mantém aberta a possibilidade de referência tanto à permanência na fé cristã quanto à posse de fé genuína.
- source_word: δοκιμάζετε
  choice: ponham ... à prova
  rationale: Distingue o segundo verbo do primeiro e expressa a ideia de testar para verificar aprovação ou autenticidade.
- source_word: ἐπιγινώσκετε
  choice: reconhecem
  rationale: Expressa reconhecimento ou percepção plena e funciona naturalmente na pergunta retórica.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus, o Messias
  rationale: Trata Χριστός como título neste enunciado confessional, preservando seu significado.
- source_word: ἐν ὑμῖν
  choice: está em vocês
  rationale: O contexto de autoexame favorece a presença de Cristo nos próprios destinatários; a possível nuance comunitária é registrada em nota.
- source_word: εἰ μήτι
  choice: A menos, é claro, que
  rationale: Comunica a exceção com a leve ênfase ou ironia retórica da expressão grega.
- source_word: ἀδόκιμοί
  choice: tenham sido reprovados
  rationale: 'Mantém o contraste com a ação de pôr à prova: são aqueles que não passam no teste, sem recorrer ao termo teologicamente carregado “réprobos”.'
theological_decisions:
- issue: Sentido de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: O contexto permite entender Χριστός como título. “Messias” explicita seu significado, enquanto “Cristo” continua sendo uma tradução possível.
- issue: Sentido de ἐν τῇ πίστει
  choice: na fé, sem especificar além disso
  alternative: com fé genuína / dentro da fé cristã
  rationale: A expressão pode apontar para a permanência no âmbito da fé cristã ou para a realidade da fé pessoal; a tradução preserva essa tensão.
- issue: Sentido de ἐν ὑμῖν
  choice: em vocês
  alternative: entre vocês
  rationale: O autoexame favorece a ideia da presença de Cristo nos destinatários, mas o plural e a preposição também admitem uma leitura comunitária, registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas brasileiras naturais. O paralelismo dos dois imperativos foi preservado por verbos distintos, e “vocês” deixa claro que os pronomes gregos estão no plural.
