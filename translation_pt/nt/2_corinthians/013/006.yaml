base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/006.yaml
  text: But I hope that you will know that we are not disqualified[a].
translation:
  language: pt
  text: Mas espero que vocês saibam que nós não somos desqualificados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não somos reprovados” ou “não falhamos no teste”. O adjetivo grego se refere a não ser aprovado depois de passar por uma prova.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: espero
  rationale: O presente do indicativo expressa a esperança ou expectativa de Paulo; “espero” é a forma mais direta e natural em português.
- source_word: δὲ
  choice: Mas
  rationale: Marca contraste moderado com a preocupação do versículo anterior; “Mas” preserva essa ligação discursiva.
- source_word: γνώσεσθε
  choice: vocês reconheçam
  rationale: Embora a forma grega seja futura (“vocês saberão/conhecerão”), depois de “espero que” o português idiomático emprega o presente do subjuntivo. “Reconheçam” expressa a futura constatação dos coríntios sem enfatizar indevidamente um processo de aprendizado.
- source_word: ὅτι
  choice: que
  rationale: Introduz a oração que apresenta o conteúdo da esperança de Paulo.
- source_word: ἡμεῖς
  choice: nós
  rationale: O pronome explícito preserva a leve ênfase do grego sobre Paulo e seus colaboradores.
- source_word: οὐκ ἐσμὲν
  choice: não fomos
  rationale: Com a expressão portuguesa “reprovados no teste”, o pretérito composto semanticamente resultativo comunica o estado presente decorrente da avaliação. Não intensifica a negação.
- source_word: ἀδόκιμοι
  choice: reprovados no teste
  rationale: No contexto imediato de examinar e provar, o adjetivo designa quem não é aprovado após ser testado. A formulação é clara e preserva a metáfora da prova, evitando o sentido doutrinariamente carregado que “réprobos” poderia sugerir.
theological_decisions:
- issue: Sentido de ἀδόκιμοι no contexto de prova e legitimidade apostólica
  choice: não fomos reprovados no teste
  alternative: não somos desqualificados; não deixamos de ser aprovados; não somos réprobos
  rationale: A tradução mantém a linguagem avaliativa dos versículos próximos e não transforma o termo numa declaração sobre condenação eterna. A nota registra alternativas legítimas e a forma adjetival mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa. A formulação principal explicita a imagem de teste presente no contexto e evita o arcaísmo teologicamente carregado “réprobos”.
