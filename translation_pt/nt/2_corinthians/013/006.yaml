  naturalness: «Mas espero que vocês saibam que nós não somos desqualificados» é português moderno e natural. O subjuntivo «saibam», dependente de «espero que», comunica adequadamente a expectativa futura expressa por γνώσεσθε.
  terminology: «Desqualificados» transmite com clareza o sentido avaliativo de ἀδόκιμοι no contexto de exame, sem a carga teológica posterior de «réprobos». A nota oferece alternativas que conservam a imagem de teste.
