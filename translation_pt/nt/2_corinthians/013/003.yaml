  text: since you are seeking proof that Messiah is speaking in me—he is not weak toward you[a], but is powerful in you[b],
translation:
  language: pt
  text: visto que vocês procuram uma prova de que o Messias fala em mim[a] — ele não é fraco para com vocês, mas é poderoso em vocês[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fala por meu intermédio”. O grego diz, mais literalmente, “fala em mim”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “é poderoso entre vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: visto que
  rationale: Introduz a razão ligada ao contexto anterior e preserva com naturalidade a força causal.
- source_word: δοκιμὴν ζητεῖτε
  choice: vocês procuram uma prova
  rationale: δοκιμήν designa aqui evidência comprobatória, e o presente ζητεῖτε indica a busca em curso dos destinatários.
- source_word: τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ
  choice: de que o Messias fala em mim
  rationale: A construção genitiva é expressa naturalmente como conteúdo da prova. Mantém-se ἐν ἐμοί como “em mim”, sem decidir implicitamente que signifique apenas “por meu intermédio”.
- source_word: Χριστοῦ
  choice: o Messias
  rationale: O termo conserva seu valor titular neste contexto, em português natural e compreensível.
- source_word: εἰς ὑμᾶς οὐκ ἀσθενεῖ
  choice: ele não é fraco para com vocês
  rationale: Preserva a direção ou relação expressa por εἰς e o contraste lexical entre fraqueza e poder.
- source_word: ἀλλὰ δυνατεῖ ἐν ὑμῖν
  choice: mas é poderoso em vocês
  rationale: Mantém o contraste direto com “não é fraco” e traduz ἐν ὑμῖν de modo próximo ao grego, sem excluir seu possível sentido corporativo.
theological_decisions:
- issue: Sentido de ἐν ἐμοί na fala do Messias
  choice: fala em mim
  alternative: fala por meu intermédio
  rationale: A redação principal segue de perto a preposição grega e preserva a tensão entre presença interior e atuação mediante Paulo; a alternativa interpretativa é registrada em nota.
- issue: Alcance de ἐν ὑμῖν
  choice: em vocês
  alternative: entre vocês
  rationale: “Em vocês” corresponde diretamente ao grego e pode indicar atuação nos destinatários; “entre vocês” explicita a possível dimensão comunitária sem substituir a ambiguidade no texto principal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “vocês” para o plural. A estrutura mantém a ligação causal com o contexto e o contraste enfático entre fraqueza e poder.
