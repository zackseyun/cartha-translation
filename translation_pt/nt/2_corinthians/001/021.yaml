id: 2CO.1.21
reference: 2 Corinthians 1:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ βεβαιῶν ἡμᾶς σὺν ὑμῖν εἰς Χριστὸν καὶ χρίσας ἡμᾶς θεός,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/021.yaml
  text: But the one who establishes us with you in Messiah[a], and who anointed us, is God.
translation:
  language: pt
  text: Mas aquele que nos firma, junto com vocês, no Messias[a] e que nos ungiu é Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «em Cristo». O título grego é Christós, aqui traduzido por «Messias». A expressão também pode ser entendida mais literalmente como «para o Messias».'
    reason: Registra tanto a forma tradicional do título quanto a possível nuance direcional de εἰς, preservando a ambiguidade do grego.
lexical_decisions:
- source_word: βεβαιῶν
  choice: firma
  rationale: Expressa a ideia de tornar firme, seguro ou confirmado. O presente «firma» preserva o aspecto contínuo do particípio grego e soa natural em português.
- source_word: σὺν ὑμῖν
  choice: junto com vocês
  rationale: Torna explícita a participação conjunta de Paulo e seus colaboradores com os coríntios, sem sugerir distinção de condição entre os grupos.
- source_word: εἰς Χριστόν
  choice: no Messias
  rationale: Em contexto paulino, εἰς pode indicar relação ou incorporação, não apenas movimento literal. «No Messias» comunica essa relação de modo idiomático, embora a preposição grega admita uma tradução mais direcional.
- source_word: χρίσας
  choice: ungiu
  rationale: Preserva a ligação lexical entre χρίω, a unção, e o título «Messias», sem restringir o sentido a um rito específico.
- source_word: θεός
  choice: Deus
  rationale: 'Mantém a identificação enfática que encerra a frase grega: quem firma e unge é Deus.'
- source_word: Χριστόν
  choice: Messias
  rationale: Representa Χριστός como título, preservando sua relação com a ideia de alguém ungido; a forma tradicional «Cristo» é indicada em nota.
theological_decisions:
- issue: Sentido de εἰς em εἰς Χριστόν
  choice: sentido relacional ou incorporativo, traduzido por «no Messias»
  alternative: «para o Messias» ou, com o título tradicional, «em Cristo»
  rationale: A tradução evita impor à preposição um movimento espacial rígido, mas reconhece que εἰς conserva uma possível nuance direcional. O texto principal privilegia a expressão paulina idiomática de relação com o Messias.
- issue: Relação entre os pronomes «nós» e «vocês»
  choice: «nos firma, junto com vocês»
  alternative: «firma a nós com vocês»
  rationale: A formulação natural em português preserva a participação compartilhada do grupo apostólico e dos coríntios, sem fundi-los nem criar uma hierarquia ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para leitura brasileira natural. As vírgulas em «junto com vocês» destacam a participação comum sem tornar a frase pesada. A ordem final «é Deus» conserva a ênfase do original.
