id: 2CO.1.1
reference: 2 Corinthians 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς τῇ ἐκκλησίᾳ τοῦ θεοῦ τῇ οὔσῃ ἐν Κορίνθῳ, σὺν τοῖς ἁγίοις πᾶσιν τοῖς οὖσιν ἐν ὅλῃ τῇ Ἀχαΐᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother, to the church of God that is in Corinth[b], together with all the saints who are in all Achaia:'
translation:
  language: pt
  text: 'Paulo, apóstolo do Messias Jesus[a] pela vontade de Deus, e Timóteo, nosso irmão, à igreja de Deus que está em Corinto, juntamente com todos os santos que estão em toda a Acaia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: Cristo Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπόστολος
  choice: apóstolo
  rationale: Termo consagrado e preciso para o encargo comissionado de Paulo nesta identificação epistolar.
- source_word: Χριστοῦ Ἰησοῦ
  choice: do Messias Jesus
  rationale: Preserva aqui a força titular de Χριστός e reproduz a relação genitiva com ἀπόστολος.
- source_word: διὰ θελήματος θεοῦ
  choice: pela vontade de Deus
  rationale: Expressão portuguesa natural para διά com genitivo nesta fórmula de comissionamento, indicando que o apostolado decorre da vontade divina.
- source_word: ὁ ἀδελφὸς
  choice: nosso irmão
  rationale: Embora o grego diga literalmente 'o irmão', a formulação relacional 'nosso irmão' é idiomática em português e explicita sem distorção a relação comunitária pressuposta.
- source_word: ἐκκλησίᾳ
  choice: igreja
  rationale: Equivalente estabelecido, natural e contextualmente adequado nas saudações paulinas.
- source_word: ἁγίοις
  choice: santos
  rationale: Termo conciso e tradicional para os integrantes do povo santo de Deus no uso paulino.
- source_word: σὺν
  choice: juntamente com
  rationale: Torna clara a força inclusiva da preposição e mantém um registro natural.
- source_word: ἐν ὅλῃ τῇ Ἀχαΐᾳ
  choice: em toda a Acaia
  rationale: Segue de perto a estrutura grega e comunica claramente a abrangência regional.
theological_decisions:
- issue: Tradução de Χριστός na identificação inicial de Paulo
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Neste contexto, Χριστός conserva força titular; 'Messias' torna esse sentido explícito, enquanto a forma tradicional é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a forma de saudação epistolar e os dois remetentes, sem apagar o caráter titular de 'Messias'.
