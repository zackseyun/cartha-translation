source:
  edition: SBLGNT
  text: Ἡ γὰρ καύχησις ἡμῶν αὕτη ἐστίν, τὸ μαρτύριον τῆς συνειδήσεως ἡμῶν, ὅτι ἐν ⸀ἁγιότητι καὶ εἰλικρινείᾳ ⸀τοῦ θεοῦ, ⸀οὐκ ἐν σοφίᾳ σαρκικῇ ἀλλ’ ἐν χάριτι θεοῦ, ἀνεστράφημεν ἐν τῷ κόσμῳ, περισσοτέρως δὲ πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/012.yaml
  text: 'For this is our boast: the testimony of our conscience[a], that we conducted ourselves in the world in holiness and sincerity of God[c][b], not in fleshly wisdom but in the grace of God—and especially toward you.'
translation:
  language: pt
  text: 'Pois este é o nosso motivo de orgulho: o testemunho da nossa consciência, de que nos conduzimos no mundo com santidade[a] e sinceridade proveniente de Deus[b], não com sabedoria carnal[c], mas com a graça de Deus — e ainda mais para com vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “simplicidade” em vez de “santidade”.
    reason: textual_variant
  - marker: b
    text: 'Ou: “sinceridade divina”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “sabedoria humana”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καύχησις
  choice: motivo de orgulho
  rationale: Expressa a base legítima da confiança de Paulo sem sugerir mera vaidade; é natural em português neste contexto.
- source_word: μαρτύριον τῆς συνειδήσεως
  choice: o testemunho da nossa consciência
  rationale: Preserva a imagem da consciência como aquilo que atesta interiormente a conduta dos remetentes.
- source_word: ἁγιότητι
  choice: santidade
  rationale: Representa diretamente a leitura do SBLGNT e conserva sua força moral e religiosa.
- source_word: εἰλικρινείᾳ τοῦ θεοῦ
  choice: sinceridade que vêm de Deus
  rationale: Interpreta o genitivo como origem sem esconder a associação estreita das duas qualidades com Deus; a concordância plural faz a expressão abranger naturalmente santidade e sinceridade.
- source_word: σοφίᾳ σαρκικῇ
  choice: sabedoria carnal
  rationale: Mantém visível o grupo lexical de σάρξ e o contraste paulino entre recursos da carne e a graça de Deus.
- source_word: χάριτι θεοῦ
  choice: a graça de Deus
  rationale: Formulação portuguesa natural que preserva o peso teológico de χάρις.
- source_word: ἀνεστράφημεν
  choice: nos conduzimos
  rationale: Comunica a maneira de viver e agir, em registro digno e corrente.
- source_word: περισσοτέρως δὲ πρὸς ὑμᾶς
  choice: e especialmente em relação a vocês
  rationale: Reproduz o valor intensificador de περισσοτέρως e o sentido relacional de πρός em português claro.
theological_decisions:
- issue: Sentido de τοῦ θεοῦ em εἰλικρινείᾳ τοῦ θεοῦ
  choice: que vêm de Deus
  alternative: divinas; próprias de Deus; diante de Deus
  rationale: A tradução apresenta Deus como origem das qualidades, mas a nota preserva outras relações possíveis do genitivo sem impor uma solução denominacional.
- issue: Contraste entre σοφίᾳ σαρκικῇ e χάριτι θεοῦ
  choice: sabedoria carnal / graça de Deus
  alternative: sabedoria humana / graça de Deus
  rationale: Conserva a tensão lexical e teológica de Paulo, sem reduzir σάρκινος ao sentido geral de simplesmente humano.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” evita regionalismo excessivo; “motivo de orgulho” e “nos conduzimos” mantêm clareza sem perder o tom formal. Todos os marcadores aparecem no texto principal.
