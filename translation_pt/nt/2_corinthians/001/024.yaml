source:
  edition: SBLGNT
  text: οὐχ ὅτι κυριεύομεν ὑμῶν τῆς πίστεως, ἀλλὰ συνεργοί ἐσμεν τῆς χαρᾶς ὑμῶν, τῇ γὰρ πίστει ἑστήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/024.yaml
  text: Not that we lord it over your faith[a], but we are fellow workers for your joy[c][b], for you stand firm by faith.
translation:
  language: pt
  text: Não que exerçamos domínio sobre a fé de vocês[a]; antes, somos cooperadores para a alegria de vocês[b], pois é pela fé que vocês permanecem firmes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a confiança de vocês”.
    reason: lexical_alternative
  - marker: b
    text: Ou “colaboradores da alegria de vocês”.
    reason: lexical_alternative
  - marker: c
    text: Ou “vocês permanecem firmes na fé”.
    reason: alternative_reading
lexical_decisions:
- source_word: κυριεύομεν
  choice: dominemos sobre
  rationale: Expressa o exercício de domínio ou senhorio. No contexto negado, “dominar sobre” comunica com naturalidade a autoridade controladora que Paulo rejeita.
- source_word: ὑμῶν τῆς πίστεως
  choice: a fé de vocês
  rationale: Representa de modo idiomático a construção genitiva e mantém πίστις como “fé”, sem excluir a nuance de confiança.
- source_word: συνεργοί
  choice: cooperadores
  rationale: Indica pessoas que trabalham juntamente com outras, contrastando cooperação com domínio. “Cooperadores” é corrente, digno e adequado ao tom paulino.
- source_word: τῆς χαρᾶς ὑμῶν
  choice: para a alegria de vocês
  rationale: O genitivo pode exprimir aquilo em favor do qual eles trabalham. A formulação comunica claramente que a atividade apostólica visa à alegria dos coríntios.
- source_word: τῇ γὰρ πίστει
  choice: pela fé
  rationale: 'Toma o dativo como meio ou base e conserva a explicação introduzida por γάρ: é pela fé que os coríntios se mantêm firmes.'
- source_word: ἑστήκατε
  choice: permanecem firmes
  rationale: 'O perfeito de ἵστημι descreve um estado presente resultante: eles estão e continuam estabelecidos. “Permanecem firmes” transmite esse valor naturalmente.'
theological_decisions:
- issue: Sentido de πίστις nas duas ocorrências
  choice: fé
  alternative: confiança
  rationale: O contexto trata da postura de fé dos coríntios. “Fé” preserva o termo teológico amplo sem decidir indevidamente entre crença e confiança pessoal; a alternativa lexical é registrada em nota.
- issue: Relação expressa por τῇ πίστει
  choice: pela fé
  alternative: na fé
  rationale: O dativo permite uma leitura de meio ou base (“pela fé”), embora uma leitura locativa ou de esfera (“na fé”) também seja possível. A alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. O contraste “não é que...; pelo contrário...” torna explícita a oposição οὐχ ὅτι... ἀλλά sem alterar seu sentido. As notas preservam as ambiguidades legítimas de πίστις, συνεργοί com genitivo e do dativo τῇ πίστει.
