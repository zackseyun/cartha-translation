    issue: A conjunção entre “leem” e “entendem” não preserva o segundo ἢ.
    rationale: O grego diz literalmente “o que vocês leem ou também entendem/reconhecem”. O “e” da versão atual funde os dois membros, enquanto “ou também” conserva a construção e sua nuance sem tornar o português artificial.
  - severity: low
    issue: “De fato” para καί é menos preciso que “também”.
    rationale: Neste paralelismo, καί funciona naturalmente como adição (“também”), não exige a leitura enfática de confirmação expressa por “de fato”.
  revised_text: Pois não escrevemos a vocês nada além do que leem ou também entendem; e espero que entendam até o fim.[a]
