  text: οὐ γὰρ ἄλλα γράφομεν ὑμῖν ἀλλ’ ἢ ἃ ἀναγινώσκετε ἢ καὶ ἐπιγινώσκετε, ἐλπίζω δὲ ⸀ὅτι ἕως τέλους ἐπιγνώσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/013.yaml
  text: For we are not writing anything else to you except what you read and indeed understand[a], and I hope that you will understand fully to the end,
translation:
  language: pt
  text: Pois não escrevemos a vocês nada além do que leem ou também entendem; e espero que entendam até o fim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entendam completamente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: nada além
  rationale: Com o verbo negado, esta formulação idiomática preserva a negação de qualquer conteúdo diferente ou oculto.
- source_word: ἀναγινώσκετε
  choice: vocês leem
  rationale: O presente simples expressa naturalmente a leitura da carta e mantém o sentido direto do verbo.
- source_word: ἐπιγινώσκετε
  choice: de fato entendem
  rationale: No contexto, o verbo aponta para reconhecer ou compreender o sentido do que está escrito; 'entendem' é claro e natural, e 'de fato' representa o valor enfático de καί.
- source_word: ἐπιγνώσεσθε
  choice: entendam
  rationale: O futuro é expresso pela construção 'espero que entendam'; a repetição mantém a ligação lexical com o verbo anterior sem impor artificialmente a ideia de compreensão plena.
- source_word: ἕως τέλους
  choice: até o fim
  rationale: A tradução formal preserva a possível dimensão temporal ou escatológica da expressão, sem reduzi-la silenciosamente ao sentido de 'completamente'.
- source_word: οὐ γὰρ ... ἀλλ’ ἢ
  choice: Pois não ... nada além do que
  rationale: A construção portuguesa comunica com naturalidade a exclusividade da formulação grega.
theological_decisions:
- issue: Sentido de ἕως τέλους
  choice: até o fim
  alternative: completamente
  rationale: A expressão pode indicar duração até o fim ou, idiomaticamente, compreensão completa. O texto principal conserva a forma e a ambiguidade do grego; a nota registra a alternativa.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por 'vocês'. A pontuação foi ajustada para uma leitura natural; o ponto e vírgula separa as duas afirmações estreitamente relacionadas.
