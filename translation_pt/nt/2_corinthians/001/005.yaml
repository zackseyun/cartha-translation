id: 2CO.1.5
reference: 2 Corinthians 1:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι καθὼς περισσεύει τὰ παθήματα τοῦ Χριστοῦ εἰς ἡμᾶς, οὕτως διὰ τοῦ Χριστοῦ περισσεύει καὶ ἡ παράκλησις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/005.yaml
  text: For just as the sufferings of Christ overflow to us[b][a], so also through Christ our comfort overflows.
translation:
  language: pt
  text: Pois, assim como os sofrimentos de Cristo transbordam sobre nós[a][b], assim também, por meio de Cristo, transborda a nossa consolação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os sofrimentos por Cristo”. O grego pode indicar sofrimentos pertencentes a Cristo ou sofrimentos suportados por causa dele.'
    reason: alternative_reading
  - marker: b
    text: “Cristo” também pode ser traduzido por “Messias” quando se destaca o sentido do título.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e preserva a força causal com uma ligação natural em português.
- source_word: καθὼς ... οὕτως
  choice: assim como ... assim também
  rationale: Reproduz com clareza a estrutura correlativa da comparação grega.
- source_word: περισσεύει
  choice: transbordam / transborda
  rationale: Preserva, nas duas ocorrências, a imagem de abundância que excede limites; a flexão varia apenas para concordar com os respectivos sujeitos em português.
- source_word: τὰ παθήματα
  choice: os sofrimentos
  rationale: É a equivalência direta, corrente e adequada ao contexto paulino de aflição.
- source_word: τοῦ Χριστοῦ
  choice: de Cristo
  rationale: Mantém a relação genitiva deliberadamente aberta, sem decidir no texto principal se são sofrimentos pertencentes a Cristo, compartilhados com ele ou suportados por causa dele.
- source_word: εἰς ἡμᾶς
  choice: sobre nós
  rationale: Comunica naturalmente que os sofrimentos alcançam e recaem sobre Paulo e seus companheiros, preservando a direção expressa por εἰς.
- source_word: διὰ τοῦ Χριστοῦ
  choice: por meio de Cristo
  rationale: Expressa com clareza a mediação indicada por διά com o genitivo.
- source_word: ἡ παράκλησις ἡμῶν
  choice: a nossa consolação
  rationale: Conserva a construção possessiva e o sentido pastoral de alívio e amparo em contraste com os sofrimentos.
theological_decisions:
- issue: Sentido de «os sofrimentos de Cristo»
  choice: Manter no texto a formulação genitiva «de Cristo»
  alternative: «os sofrimentos por Cristo» ou referência explícita aos sofrimentos que o próprio Cristo padeceu
  rationale: O genitivo grego admite mais de uma relação semântica. A tradução principal preserva essa tensão, enquanto a nota registra a alternativa ligada a sofrimentos suportados por causa de Cristo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «transbordar» conserva a imagem e o paralelismo do original; «consolação» mantém o contraste pastoral com «sofrimentos».
