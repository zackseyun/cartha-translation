id: 2CO.1.17
reference: 2 Corinthians 1:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτο οὖν ⸀βουλόμενος μήτι ἄρα τῇ ἐλαφρίᾳ ἐχρησάμην; ἢ ἃ βουλεύομαι κατὰ σάρκα βουλεύομαι, ἵνα ᾖ παρ’ ἐμοὶ τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/017.yaml
  text: So when I intended this[a], was I acting lightly? Or do I plan what I plan according to the flesh, so that with me there should be both “Yes, yes” and “No[d][c][b], no”?
translation:
  language: pt
  text: Portanto, ao ter essa intenção, será que agi com leviandade?[a] Ou será que faço meus planos segundo a carne,[b] de modo que, da minha parte, haja tanto o “sim, sim” como o “não, não”?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com inconstância”.'
    reason: lexical_alternative
  - marker: b
    text: “Segundo a carne” pode significar segundo critérios meramente humanos ou mundanos.
    reason: lexical_alternative
  - marker: c
    text: Isto é, como se o “sim” e o “não” pudessem valer ao mesmo tempo.
    reason: cultural_note
lexical_decisions:
- source_word: βουλόμενος
  choice: ao ter essa intenção
  rationale: O particípio retoma a intenção de viagem mencionada no contexto. A formulação preserva a ideia de propósito sem sugerir um plano formal mais definido do que o grego exige.
- source_word: τῇ ἐλαφρίᾳ ἐχρησάμην
  choice: agi com leviandade
  rationale: A expressão descreve agir com falta de firmeza ou seriedade. “Leviandade” mantém a imagem de leveza do termo grego e permite registrar “inconstância” como alternativa contextual.
- source_word: ἃ βουλεύομαι ... βουλεύομαι
  choice: faço meus planos
  rationale: Em português, esta formulação comunica naturalmente o ato de deliberar e planejar. A repetição grega não é reproduzida mecanicamente porque resultaria pouco idiomática, mas a força reflexiva permanece em “meus planos”.
- source_word: κατὰ σάρκα
  choice: segundo a carne
  rationale: Mantém a expressão paulina e sua abertura semântica, evitando reduzi-la no texto principal a “de modo humano” ou “segundo padrões mundanos”.
- source_word: παρ’ ἐμοὶ
  choice: da minha parte
  rationale: Expressa de modo natural em português aquilo que procederia de Paulo ou caracterizaria sua conduta, sem acrescentar explicitamente um verbo de fala.
- source_word: τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: tanto o “sim, sim” como o “não, não”
  rationale: Conserva as repetições do grego e apresenta os dois elementos em paralelo, preservando a acusação implícita de vacilação ou duplicidade.
theological_decisions:
- issue: Sentido de σάρξ na expressão paulina κατὰ σάρκα
  choice: segundo a carne
  alternative: segundo critérios meramente humanos; de maneira mundana
  rationale: O uso é metafórico e pode apontar para critérios puramente humanos ou mundanos. Preservar “carne” mantém a linguagem característica de Paulo e não encerra prematuramente a amplitude interpretativa.
- issue: Relação entre “sim, sim” e “não, não”
  choice: manter os dois enunciados coordenados sem explicitar sua relação
  alternative: “sim” e “não” ao mesmo tempo
  rationale: O grego sugere a acusação de uma postura contraditória ou vacilante, mas não contém uma expressão equivalente a “ao mesmo tempo”. A tradução deixa essa implicação para a nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura interrogativa foi preservada, bem como a expressão paulina “segundo a carne”. Evitou-se acrescentar “dizer” ao contraste final, pois o grego deixa em aberto se Paulo se refere especificamente à fala, aos compromissos ou à sua conduta de modo mais amplo.
