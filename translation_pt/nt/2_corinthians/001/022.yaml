    rationale: ἀρραβών designa penhor, depósito ou primeira parcela que assegura o restante; «sinal» pode ocorrer em contextos comerciais portugueses, mas é semanticamente mais impreciso e pode remeter a um mero indício ou marca.
  revised_text: o qual também nos selou e deu, em nossos corações, a entrada[a] do Espírito.
