  text: ὁ καὶ σφραγισάμενος ἡμᾶς καὶ δοὺς τὸν ἀρραβῶνα τοῦ πνεύματος ἐν ταῖς καρδίαις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/022.yaml
  text: who also sealed us and gave the down payment of the Spirit in our hearts.
translation:
  language: pt
  text: o qual também nos selou e deu, em nossos corações, a entrada[a] do Espírito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o penhor”, “a garantia” ou “o pagamento inicial” do Espírito.
    reason: lexical_alternative
lexical_decisions:
- source_word: σφραγισάμενος
  choice: selou
  rationale: Preserva de modo conciso a metáfora de marcar com selo, que pode comunicar posse, autenticação ou segurança, sem explicá-la além do texto.
- source_word: δοὺς
  choice: deu
  rationale: 'O particípio aoristo é coordenado naturalmente com o anterior em português, acompanhando a estrutura paralela: “selou e deu”.'
- source_word: ἀρραβῶνα
  choice: entrada
  rationale: No uso comercial, ἀρραβών designa um pagamento inicial que antecipa e assegura o restante. “Entrada” mantém essa imagem concreta em português corrente; a nota registra alternativas que ressaltam a função de garantia.
- source_word: τοῦ πνεύματος
  choice: do Espírito
  rationale: Mantém o genitivo grego compacto e sua possível nuance de conteúdo ou origem, sem explicitar no texto principal uma relação interpretativa única.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: em nosso coração
  rationale: Traduz diretamente ἐν com dativo e emprega a expressão coletiva idiomática em português, preservando o caráter interior e pessoal da dádiva.
- source_word: ὁ καὶ ... καὶ
  choice: o qual também ... e
  rationale: Retoma Deus, mencionado no versículo anterior, e conserva a continuidade sintática do particípio substantivado com uma oração relativa natural e digna.
theological_decisions:
- issue: Sentido do Espírito como ἀρραβών
  choice: a entrada do Espírito
  alternative: o penhor do Espírito; a garantia do Espírito; o sinal do Espírito
  rationale: A escolha conserva a metáfora comercial de uma primeira parcela que antecipa e assegura o que ainda virá. “Garantia” explicitaria a função, mas perderia a imagem concreta; “penhor” é tradicional, porém menos transparente e pode sugerir um bem deixado como garantia.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação é concisa e digna; preserva tanto a metáfora do selo quanto a imagem comercial de ἀρραβών, com alternativas na nota para refletir sua amplitude semântica.
