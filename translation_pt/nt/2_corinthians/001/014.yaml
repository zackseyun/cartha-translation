id: 2CO.1.14
reference: 2 Corinthians 1:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καθὼς καὶ ἐπέγνωτε ἡμᾶς ἀπὸ μέρους, ὅτι καύχημα ὑμῶν ἐσμεν καθάπερ καὶ ὑμεῖς ἡμῶν ἐν τῇ ἡμέρᾳ τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/014.yaml
  text: just as you also came to understand us in part[a], that we are your boast, just as you also are ours[b], in the day of our Lord Jesus.
translation:
  language: pt
  text: assim como vocês também chegaram a nos conhecer em parte[a], somos motivo de orgulho para vocês, assim como vocês também são para nós[b], no dia de nosso Senhor Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «parcialmente» ou «até certo ponto».
    reason: lexical_alternative
  - marker: b
    text: Ou «são nosso motivo de glória» ou «são nossa razão para nos orgulharmos».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωτε
  choice: chegaram a nos conhecer
  rationale: Expressa o reconhecimento ou conhecimento real alcançado pelos coríntios, sem sugerir compreensão plena.
- source_word: ἀπὸ μέρους
  choice: em parte
  rationale: Preserva de modo conciso a ideia de conhecimento parcial, deixando em aberto seu grau.
- source_word: καύχημα
  choice: motivo de orgulho
  rationale: Comunica naturalmente o sentido de algo ou alguém de que se pode gloriar, evitando que o substantivo português «orgulho» pareça designar diretamente as pessoas.
- source_word: καθάπερ
  choice: assim como
  rationale: Mantém a comparação recíproca explícita entre Paulo e os coríntios.
- source_word: ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: no dia de nosso Senhor Jesus
  rationale: Preserva a expressão escatológica e a construção genitiva em português natural.
- source_word: κύριος
  choice: Senhor
  rationale: É a tradução estabelecida e adequada ao título cristológico neste contexto.
- source_word: καθὼς καὶ
  choice: assim como vocês também
  rationale: Liga o versículo ao pensamento anterior e conserva a força aditiva de καί.
theological_decisions:
- issue: A linguagem recíproca de καύχημα
  choice: somos motivo de orgulho para vocês, assim como vocês também são para nós
  alternative: somos a glória de vocês, assim como vocês são a nossa
  rationale: Mantém a reciprocidade escatológica sem transformar a afirmação em autoexaltação nem eliminar a tensão positiva da linguagem paulina sobre gloriar-se.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Vocês» torna explícito o plural de ὑμεῖς; «chegaram a nos conhecer» é natural e não exagera a força de ἐπιγινώσκω. O dois-pontos apresenta com clareza o conteúdo introduzido por ὅτι, sem alterar a relação sintática.
