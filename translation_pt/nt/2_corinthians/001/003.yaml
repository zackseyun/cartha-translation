  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῶν οἰκτιρμῶν καὶ θεὸς πάσης παρακλήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], the Father of mercies and God of all comfort[d][c][b],
translation:
  language: pt
  text: Bendito seja o Deus e Pai de nosso Senhor[a] Jesus, o Messias[b], o Pai das misericórdias[c] e Deus de todo consolo[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mestre”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Jesus Cristo”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “compaixões”.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “encorajamento” ou “consolação”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Bendito seja
  rationale: Reproduz de modo natural a fórmula doxológica grega e conserva sua força declarativa.
- source_word: θεὸς καὶ πατὴρ
  choice: o Deus e Pai
  rationale: O artigo grego rege naturalmente os dois substantivos coordenados, que designam o mesmo referente.
- source_word: κυρίου
  choice: Senhor
  rationale: É a tradução corrente e adequada de κύριος no uso cristológico do Novo Testamento; “Mestre” permanece como alternativa lexical.
- source_word: Χριστοῦ
  choice: o Messias
  rationale: Torna explícito o valor titular de Χριστός em português idiomático; “Cristo” é mantido em nota como a forma tradicional.
- source_word: οἰκτιρμῶν
  choice: misericórdias
  rationale: Preserva o plural grego e expressa tanto as compaixões de Deus como suas manifestações de misericórdia.
- source_word: παρακλήσεως
  choice: consolo
  rationale: No contexto de aflição, é a opção portuguesa mais natural, sem excluir os sentidos próximos de encorajamento e consolação.
theological_decisions:
- issue: Valor de Χριστός em Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: A tradução principal preserva o significado do título, enquanto a nota registra a forma tradicional, que também pode ser entendida como uma designação consolidada.
- issue: Relação expressa por θεὸς καὶ πατὴρ
  choice: o Deus e Pai de nosso Senhor Jesus
  alternative: Deus, o Pai de nosso Senhor Jesus
  rationale: A redação mantém a coordenação do grego sem dividir a expressão em referentes distintos nem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e solene, com formulação doxológica natural. O plural “misericórdias” e a abrangência semântica de παράκλησις foram preservados; as alternativas relevantes aparecem em notas.
