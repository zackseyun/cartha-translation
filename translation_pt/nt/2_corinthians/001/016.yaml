base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/016.yaml
  text: and through you to pass into Macedonia[a], and again from Macedonia to come to you and by you to be sent on to Judea.
translation:
  language: pt
  text: e visitar vocês de passagem para a Macedônia; e, novamente, voltar da Macedônia até vocês e ser ajudado por vocês a seguir para a Judeia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e ser encaminhado por vocês para a Judeia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὑμῶν
  choice: por onde vocês estavam
  rationale: διά com o genitivo indica o percurso por meio do território ou localidade dos coríntios. A formulação torna natural em português o sentido de passar por Corinto sem sugerir que as pessoas fossem o meio da viagem.
- source_word: διελθεῖν εἰς Μακεδονίαν
  choice: passar ... a caminho da Macedônia
  rationale: O infinitivo expressa atravessar ou seguir viagem, enquanto εἰς marca o destino. A construção portuguesa comunica claramente que Paulo passaria por Corinto rumo à Macedônia.
- source_word: πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς
  choice: depois, voltar da Macedônia para junto de vocês
  rationale: πάλιν assinala a segunda visita prevista. Embora o grego diga literalmente 'vir novamente', 'voltar' expressa naturalmente o movimento de retorno implicado pelo itinerário, e 'para junto de vocês' preserva a orientação relacional de πρός.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι
  choice: ser encaminhado por vocês
  rationale: O verbo προπέμπω, em contexto de viagem, pode incluir despedida, provisões, companhia ou outra ajuda para prosseguir. 'Ser encaminhado' mantém a agência dos coríntios e evita especificar uma forma de apoio não explicitada.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: para a Judeia
  rationale: A preposição εἰς indica o destino; 'para a Judeia' é a forma corrente e precisa em português.
