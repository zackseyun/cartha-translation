review_pass:
  verdict: revise
  source_fidelity: A formulação «por onde vocês estavam» introduz uma localização e uma circunstância temporal («estavam») que o grego não explicita. δι’ ὑμῶν, no itinerário em questão, comunica uma passagem/visita aos coríntios antes da ida à Macedônia; «visitar vocês de passagem» transmite isso de modo idiomático sem acrescentar uma localização. «Depois» também não traduz plenamente πάλιν, que marca o retorno à comunidade.
  naturalness: O texto é geralmente fluente, mas «passar por onde vocês estavam» soa perifrástico e um pouco artificial. «Visitar vocês de passagem para a Macedônia» é moderno, claro e natural. «Ser ajudado por vocês a seguir» expressa com naturalidade, em português, o uso de προπέμπω no contexto de viagem.
  terminology: «Macedônia», «Judeia» e o tratamento «vocês» são adequados ao português moderno de ampla compreensão. A tradução de προπεμφθῆναι deve manter o sentido de apoio para prosseguir viagem, sem especificar indevidamente a forma dessa ajuda.
  issues:
  - severity: medium
    issue: «por onde vocês estavam» acrescenta um elemento não expresso no texto-fonte.
    rationale: O grego diz literalmente que Paulo passaria «por meio de/via vocês», isto é, em seu itinerário incluindo os coríntios; não afirma «onde vocês estavam» nem requer a noção de localização circunstancial.
  - severity: low
    issue: «depois» enfraquece πάλιν.
    rationale: πάλιν assinala a vinda de retorno aos coríntios. «Voltar» já o sugere, mas «novamente» o conserva de modo explícito.
  - severity: low
    issue: «ser encaminhado» pode soar administrativo e não deixa tão claro o auxílio de viagem implicado por προπέμπω.
    rationale: No contexto, o verbo descreve o apoio prestado a alguém que segue viagem. «Ser ajudado ... a seguir» é mais transparente, e a redação mais literal pode permanecer na nota.
  revised_text: e visitar vocês de passagem para a Macedônia; e, novamente, voltar da Macedônia até vocês e ser ajudado por vocês a seguir para a Judeia.[a]
