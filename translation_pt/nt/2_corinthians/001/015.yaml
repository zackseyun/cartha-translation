  text: Καὶ ταύτῃ τῇ πεποιθήσει ἐβουλόμην ⸂πρότερον πρὸς ὑμᾶς ἐλθεῖν⸃, ἵνα δευτέραν ⸀χάριν ⸀σχῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/015.yaml
  text: And with this confidence I intended to come to you first[a], so that you might have a second benefit[b],
translation:
  language: pt
  text: E, com essa confiança, eu pretendia ir primeiro até vocês, para que recebessem um segundo benefício[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma segunda graça” ou “um segundo favor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθήσει
  choice: confiança
  rationale: Expressa segurança ou convicção e corresponde naturalmente ao fundamento da intenção de viagem de Paulo.
- source_word: ἐβουλόμην
  choice: pretendia
  rationale: Comunica vontade e intenção sem sugerir, além do texto, um plano formal irrevogável.
- source_word: πρότερον πρὸς ὑμᾶς ἐλθεῖν
  choice: ir primeiro até vocês
  rationale: No contexto do itinerário, πρότερον indica mais naturalmente prioridade na sequência; em português, 'ir até vocês' é uma formulação natural do movimento em direção aos destinatários.
- source_word: δευτέραν χάριν
  choice: um segundo benefício
  rationale: Neste contexto de visita, χάρις provavelmente designa o benefício ou favor proporcionado pela presença e pelo ministério de Paulo; a nota preserva a alternativa mais formal 'graça'.
- source_word: σχῆτε
  choice: recebessem
  rationale: Embora ἔχω signifique literalmente 'ter', aqui pode comunicar a obtenção do benefício; 'recebessem' produz português natural sem alterar o sentido.
theological_decisions:
- issue: Sentido de χάρις no contexto da visita apostólica
  choice: benefício
  alternative: graça; favor
  rationale: O contexto imediato favorece uma vantagem recebida por meio de uma segunda passagem ou visita, mas a polissemia teologicamente relevante de χάρις é preservada em nota, sem reduzi-la dogmaticamente.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula final foi mantida porque o versículo prossegue sintaticamente no contexto seguinte.
