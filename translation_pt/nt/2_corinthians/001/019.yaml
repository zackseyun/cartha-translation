  text: ὁ ⸂τοῦ θεοῦ γὰρ⸃ υἱὸς ⸂Ἰησοῦς Χριστὸς⸃ ὁ ἐν ὑμῖν δι’ ἡμῶν κηρυχθείς, δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου, οὐκ ἐγένετο Ναὶ καὶ Οὒ, ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/019.yaml
  text: For the Son of God[a], Jesus the Messiah, who was proclaimed among you through us—through me and Silvanus and Timothy—did not become Yes and No; rather[d][c][b], in him it has become Yes.
translation:
  language: pt
  text: Pois o Filho de Deus, Jesus Cristo, que foi proclamado entre vocês por nosso intermédio — por mim, Silvano e Timóteo — não se tornou “sim” e “não”; mas, nele, tornou-se “sim”.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τοῦ θεοῦ υἱός
  choice: o Filho de Deus
  rationale: Preserva a expressão titular e seu peso cristológico em uma formulação natural em português.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus Cristo
  rationale: Nesta construção, a expressão funciona como designação pessoal consolidada; “Jesus Cristo” é a forma natural e reconhecível em português, sem eliminar a origem titular de Χριστός.
- source_word: κηρυχθείς
  choice: foi proclamado
  rationale: Mantém o sentido público e anunciador de κηρύσσω com linguagem atual e digna.
- source_word: δι’ ἡμῶν
  choice: por nosso intermédio
  rationale: Expressa a agência ou instrumentalidade de διά e prepara a especificação dos mensageiros na oração seguinte.
- source_word: δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου
  choice: por mim, Silvano e Timóteo
  rationale: Conserva a autorreferência de Paulo e os nomes de seus colaboradores, evitando uma repetição pesada de “por intermédio de”.
- source_word: οὐκ ἐγένετο Ναὶ καὶ Οὔ
  choice: não se tornou “sim” e “não”
  rationale: Representa de perto ἐγένετο e preserva a formulação retórica de Paulo, sem explicá-la como inconstância.
- source_word: ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν
  choice: pelo contrário, nele se tornou “sim”
  rationale: Mantém ἐν αὐτῷ sem paráfrase interpretativa e traduz o perfeito γέγονεν de modo conciso; o contexto comunica a validade presente do resultado.
theological_decisions:
- issue: Valor titular ou nominal de Χριστός
  choice: Jesus Cristo
  alternative: Jesus, o Messias
  rationale: Embora Χριστός tenha origem titular, a combinação Ἰησοῦς Χριστός aqui funciona naturalmente como designação pessoal fixa. A alternativa explicita o título, mas o texto principal evita tornar a aposição mais marcada do que no grego.
- issue: Interpretação de Ναί e Οὔ
  choice: preservar “sim” e “não” como formulação retórica
  alternative: explicitar como “inconstante” ou “ora sim, ora não”
  rationale: A tradução mantém a tensão e a imagem verbal de Paulo, em vez de resolver sua afirmação em uma paráfrase teológica.
- issue: Força aspectual de γέγονεν
  choice: se tornou
  alternative: tem sido; tornou-se e permanece
  rationale: “Se tornou” reproduz a mudança expressa pelo verbo sem acrescentar uma explicação aspectual ao texto principal; o perfeito grego também permite entender um resultado vigente.
translation_notes:
  register: Português moderno de ampla compreensão, com legibilidade brasileira. A pontuação isola a retomada explicativa dos mensageiros, e as aspas distinguem “sim” e “não” como termos citados. Mantém-se um registro digno sem arcaísmos.
