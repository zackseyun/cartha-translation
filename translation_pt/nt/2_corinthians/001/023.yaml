  text: Ἐγὼ δὲ μάρτυρα τὸν θεὸν ἐπικαλοῦμαι ἐπὶ τὴν ἐμὴν ψυχήν, ὅτι φειδόμενος ὑμῶν οὐκέτι ἦλθον εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/023.yaml
  text: But I call God as witness upon my own life[b][a], that to spare you I did not come again to Corinth.
translation:
  language: pt
  text: Mas eu invoco Deus como testemunha sobre a minha própria vida[a], de que, para poupar vocês, não voltei a Corinto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra mim mesmo”; literalmente, “sobre a minha alma”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não fui mais a Corinto”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: Mas eu
  rationale: Preserva o contraste leve de δέ e a ênfase do pronome explícito ἐγώ, com expressão natural em português.
- source_word: μάρτυρα τὸν θεὸν ἐπικαλοῦμαι
  choice: invoco Deus como testemunha
  rationale: Reproduz o caráter solene e quase judicial da declaração de Paulo sem tornar a frase artificial.
- source_word: ἐπὶ τὴν ἐμὴν ψυχήν
  choice: sobre a minha própria vida
  rationale: Mantém a imagem da fórmula de juramento e a responsabilidade pessoal de Paulo; 'vida' comunica aqui o sentido de ψυχή com mais clareza atual que 'alma'.
- source_word: ὅτι
  choice: ':'
  rationale: Os dois-pontos introduzem naturalmente em português o conteúdo da invocação solene, correspondente a ὅτι.
- source_word: φειδόμενος ὑμῶν
  choice: foi para poupar vocês
  rationale: 'Expressa com clareza o motivo indicado pelo particípio e conserva o objeto pessoal: Paulo queria poupá-los.'
- source_word: οὐκέτι ἦλθον
  choice: ainda não fui
  rationale: No contexto de uma visita esperada mas adiada, esta formulação é natural e conserva a possível nuance temporal de οὐκέτι sem concluir que Paulo jamais voltaria.
- source_word: εἰς Κόρινθον
  choice: a Corinto
  rationale: Forma portuguesa corrente para indicar movimento em direção à cidade.
theological_decisions:
- issue: Natureza da invocação de Deus e alcance de ἐπὶ τὴν ἐμὴν ψυχήν
  choice: sobre a minha própria vida
  alternative: contra mim mesmo; literalmente, sobre a minha alma
  rationale: A tradução preserva a fórmula solene de autoimplicação sem explicar no texto se ela constitui juramento formal nem impor uma leitura doutrinária específica.
- issue: Nuance temporal de οὐκέτι
  choice: ainda não fui
  alternative: não voltei; não fui mais
  rationale: A expressão pode ser entendida à luz da visita adiada. A opção principal evita sugerir de modo indevido uma decisão definitiva, enquanto a nota registra a alternativa lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Usa “vocês” para o plural de segunda pessoa e mantém a solenidade da declaração sem literalismo opaco.
