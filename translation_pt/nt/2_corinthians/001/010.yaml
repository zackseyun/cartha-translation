    rationale: O futuro grego não contém «continuará»; a adição introduz continuidade que o texto não explicita.
  - severity: medium
    issue: «ainda nos livrará novamente» para καὶ ἔτι
    rationale: «Ainda» já transmite a continuação/futura repetição sugerida por ἔτι; «novamente» duplica essa ideia e torna a formulação desnecessariamente pesada.
  - severity: low
