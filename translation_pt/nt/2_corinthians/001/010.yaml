  source_fidelity: A primeira forma futura, ῥύσεται, é simplesmente futura («nos livrará»); «continuará a nos livrar» acrescenta uma noção aspectual não expressa no grego. A expressão final καὶ ἔτι é adequadamente representada por «ainda», sem a redundância de «ainda... novamente».
  naturalness: «Ele nos livrou de tão grande morte» mantém o registro elevado, mas compreensível, do enunciado. «Nele temos posto a nossa esperança» é aceitável em registro bíblico moderno e comunica uma esperança estabelecida e vigente.
  terminology: «Livrou»/«livrará» preserva a repetição do verbo ῥύομαι. «Morte» permanece no texto principal, e a alternativa idiomática «perigo tão mortal» fica restrita à nota.
