  text: ὃς ἐκ τηλικούτου θανάτου ἐρρύσατο ἡμᾶς καὶ ⸀ῥύσεται, εἰς ὃν ἠλπίκαμεν ὅτι καὶ ἔτι ῥύσεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/010.yaml
  text: who rescued us from so great a death and will rescue us[a], in whom we have hoped that he will indeed rescue us again,
translation:
  language: pt
  text: Ele nos livrou de tão grande morte[a] e nos livrará. Nele temos posto a nossa esperança de que ainda nos livrará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «de um perigo tão mortal».'
    reason: Alternativa lexical e idiomática para a expressão grega «de tão grande morte».
lexical_decisions:
- source_word: τηλικούτου
  choice: tão grande
  rationale: Mantém a força intensificadora do demonstrativo e sua relação direta com «morte», em português natural e solene.
- source_word: θανάτου
  choice: morte
  rationale: Preserva o sentido lexical direto e a imagem enfática de Paulo; a possível referência idiomática a um perigo mortal fica registrada em nota.
- source_word: ἐρρύσατο
  choice: nos livrou
  rationale: «Livrar» expressa resgate de um perigo e funciona naturalmente no registro bíblico moderno sem ser excessivamente técnico.
- source_word: ῥύσεται
  choice: continuará a nos livrar / nos livrará
  rationale: Preserva a repetição do mesmo verbo grego e a força futura; na primeira ocorrência, «continuará» torna clara a progressão entre o livramento passado e o futuro.
- source_word: εἰς ὃν
  choice: Nele
  rationale: A preposição introduz a pessoa em quem se deposita a esperança; «Nele» é conciso, idiomático e mantém o foco pessoal.
- source_word: ἠλπίκαμεν
  choice: temos posto a nossa esperança
  rationale: Comunica o perfeito grego como uma confiança estabelecida no passado e ainda vigente.
- source_word: καὶ ἔτι
  choice: ainda... novamente
  rationale: Representa tanto a continuidade indicada por ἔτι quanto a expectativa enfática de outro livramento, sem eliminar a tensão da formulação grega.
theological_decisions:
- issue: Interpretar θάνατος literalmente ou como referência idiomática a perigo mortal
  choice: Manter «morte» no texto principal
  alternative: Traduzir «um perigo tão mortal» no texto principal
  rationale: O grego nomeia explicitamente a morte. A tradução conserva a imagem forte de Paulo, enquanto a nota informa o sentido contextual possível sem decidir por ele no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Temos posto a nossa esperança» conserva o aspecto resultante do perfeito sem soar arcaico; «livrar» mantém consistência lexical nas três ocorrências do verbo.
