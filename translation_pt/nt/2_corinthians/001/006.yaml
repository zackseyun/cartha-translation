source:
  edition: SBLGNT
  text: εἴτε δὲ θλιβόμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως καὶ σωτηρίας· ⸂εἴτε παρακαλούμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως⸃ τῆς ἐνεργουμένης ἐν ὑπομονῇ τῶν αὐτῶν παθημάτων ὧν καὶ ἡμεῖς πάσχομεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/006.yaml
  text: But if we are afflicted[a], it is for your comfort and salvation; or if we are comforted, it is for your comfort[b], which is at work in enduring the same sufferings that we also suffer.
translation:
  language: pt
  text: Mas, se somos atribulados, é para o consolo[b] e a salvação de vocês; ou, se somos consolados, é para o consolo de vocês[a], que se mostra eficaz na perseverança diante dos mesmos sofrimentos que nós também sofremos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos omitem: “ou, se somos consolados, é para o consolo de vocês”.'
    reason: textual_variant
  - marker: b
    text: Ou “encorajamento”, em lugar de “consolo”, em todo este versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβόμεθα
  choice: somos atribulados
  rationale: O presente passivo expressa a experiência contínua de pressão e aflição; “somos atribulados” é claro, digno e mantém a ligação com os sofrimentos mencionados no fim do versículo.
- source_word: παρακλήσεως / παρακαλούμεθα
  choice: consolo / somos consolados
  rationale: No contexto imediato, a família lexical de παράκλησις reúne consolo e fortalecimento. A repetição de “consolo” preserva a coesão lexical do texto grego; a nota registra a alternativa “encorajamento”.
- source_word: σωτηρίας
  choice: salvação
  rationale: “Salvação” representa de modo direto o sentido amplo de σωτηρία sem restringi-lo a um livramento meramente circunstancial.
- source_word: τῆς ἐνεργουμένης
  choice: que atua
  rationale: A expressão comunica eficácia operante, não simples existência. “Que atua” é natural em português e conserva esse caráter ativo.
- source_word: ἐν ὑπομονῇ
  choice: quando vocês suportam com perseverança
  rationale: A formulação torna natural a relação entre o consolo e a perseverança efetiva em meio aos sofrimentos, preservando o sentido de constância de ὑπομονή.
- source_word: τῶν αὐτῶν παθημάτων
  choice: os mesmos sofrimentos
  rationale: Tradução direta que ressalta a participação dos coríntios em sofrimentos da mesma natureza que os de Paulo e seus companheiros.
- source_word: ὑπὲρ
  choice: para
  rationale: Neste contexto, ὑπέρ indica benefício em favor dos coríntios; “para” expressa isso com clareza e concisão.
theological_decisions:
- issue: Relação do consolo com a perseverança nos sofrimentos
  choice: “que atua quando vocês suportam com perseverança”
  alternative: “que é eficaz na perseverança”
  rationale: A opção escolhida preserva a eficácia do consolo e torna explícita, sem impor uma explicação doutrinária, a vivência da perseverança implícita na construção grega e no genitivo dirigido aos destinatários.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservou-se a repetição de “consolo” para refletir a coesão lexical do grego; “vocês” identifica naturalmente os destinatários plurais. A ordem e a tensão entre aflição, consolo, salvação e perseverança foram mantidas sem harmonização teológica.
