  text: συνυπουργούντων καὶ ὑμῶν ὑπὲρ ἡμῶν τῇ δεήσει, ἵνα ἐκ πολλῶν προσώπων τὸ εἰς ἡμᾶς χάρισμα διὰ πολλῶν εὐχαριστηθῇ ὑπὲρ ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/011.yaml
  text: as you also join in helping us by prayer[c][b][a], so that thanks may be given by many on our behalf for the gracious gift given to us.
translation:
  language: pt
  text: ao cooperarem também em nosso favor com suas orações, para que muitas pessoas deem graças por nós pelo dom que nos foi concedido, com a participação de muitos.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “para que, por meio de muitos, muitas pessoas deem graças por nós pelo dom que nos foi concedido”. A ligação exata de “por meio de muitos” na frase grega é incerta.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “de muitos rostos”.
    reason: lexical_alternative
  - marker: c
    text: “Dom” também pode ser traduzido aqui por “bênção” ou “favor concedido a nós”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνυπουργούντων
  choice: cooperam
  rationale: Expressa auxílio conjunto e preserva a força colaborativa do prefixo συν- em português corrente.
- source_word: ὑπὲρ ἡμῶν
  choice: em nosso favor
  rationale: Comunica benefício e referência no contexto de oração e ação de graças sem restringir indevidamente o sentido.
- source_word: τῇ δεήσει
  choice: por meio da oração
  rationale: Mantém o valor instrumental do dativo. Embora δέησις possa destacar uma súplica fervorosa, “oração” é claro e natural neste contexto.
- source_word: ἐκ πολλῶν προσώπων
  choice: muitas pessoas
  rationale: πρόσωπον significa literalmente “rosto”, mas aqui designa pessoas; a formulação idiomática evita uma expressão obscura em português.
- source_word: χάρισμα
  choice: dom concedido a nós
  rationale: Preserva a ideia de uma dádiva recebida pela graça. A nota registra as possibilidades contextuais “bênção” e “favor”.
- source_word: διὰ πολλῶν
  choice: por meio de muitos
  rationale: Mantém no texto a expressão grega difícil e sua segunda referência a “muitos”, sem decidir se ela se liga mais estreitamente ao dom recebido ou à ação de graças.
- source_word: εὐχαριστηθῇ
  choice: deem graças
  rationale: O passivo grego é expresso de maneira idiomática em português como a oferta de ação de graças pelo dom recebido.
theological_decisions:
- issue: Relação entre as orações de muitos, o dom recebido e a ação de graças
  choice: Preservar “por meio de muitos” no texto e explicar em nota a possível ligação com a ação de graças
  alternative: Explicitar que o dom foi concedido em resposta às orações de muitos
  rationale: A sintaxe grega é difícil e não determina com plena clareza o vínculo de διὰ πολλῶν; a tradução não deve impor uma explicação causal ou teológica mais específica do que o texto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo; “cooperam” e “em nosso favor” mantêm precisão sem linguagem técnica. A repetição de “muitos” foi conservada por refletir uma característica relevante e uma ambiguidade real do grego.
