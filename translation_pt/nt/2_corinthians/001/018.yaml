base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/018.yaml
  text: As surely as God is faithful[b][a], our message to you is not “Yes and No.”
translation:
  language: pt
  text: Tão certo como Deus é fiel, a nossa mensagem a vocês não é “sim e não”.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Mas Deus é fiel: a nossa palavra a vocês não é ‘sim e não’.” “Mensagem” também pode ser traduzida por “palavra” ou “fala”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: fiel
  rationale: Expressa de modo natural a confiabilidade de Deus, que serve de fundamento solene para a afirmação de Paulo.
- source_word: δὲ
  choice: tão certo como
  rationale: Em conjunto com πιστὸς ὁ θεὸς e ὅτι, introduz uma afirmação enfática; a formulação comunica essa força em português corrente, em vez de impor um contraste pouco natural com “mas”.
- source_word: ὁ θεός
  choice: Deus
  rationale: Tradução direta do sujeito.
- source_word: ὅτι
  choice: incorporado à construção “Tão certo como...,”
  rationale: Liga a fidelidade de Deus à afirmação seguinte. A construção portuguesa preserva a força asseverativa sem reproduzir literalmente uma sintaxe grega pouco natural.
- source_word: ὁ λόγος ἡμῶν
  choice: a nossa mensagem
  rationale: No contexto, λόγος designa aquilo que Paulo e seus companheiros comunicaram; “mensagem” é claro e idiomático, enquanto “palavra” permanece como alternativa legítima em nota.
- source_word: ὁ πρὸς ὑμᾶς
  choice: a vocês
  rationale: Identifica os coríntios como destinatários da mensagem, em português moderno e amplamente compreensível.
- source_word: οὐκ ἔστιν
  choice: não é
  rationale: Mantém o presente do grego e o caráter vigente da afirmação.
- source_word: Ναὶ καὶ Οὔ
  choice: “sim e não”
  rationale: Conserva a expressão contrastiva e incisiva de Paulo; as aspas indicam seu caráter formular.
theological_decisions:
- issue: Sentido da construção asseverativa πιστὸς δὲ ὁ θεὸς ὅτι
  choice: Tão certo como Deus é fiel
  alternative: 'Mas Deus é fiel: a nossa palavra a vocês não é “sim e não”'
  rationale: A opção principal apresenta a fidelidade de Deus como garantia solene da veracidade da comunicação apostólica, sem transformar a relação sintática em causalidade explícita nem resolver além do necessário sua formulação incomum.
translation_notes:
  register: Português moderno, digno e de leitura natural, com “vocês” para o plural ὑμᾶς. A tradução principal prioriza equivalência ótima e a nota preserva a forma mais literal e as alternativas de λόγος.
