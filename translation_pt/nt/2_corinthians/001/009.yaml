  text: ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς τὸ ἀπόκριμα τοῦ θανάτου ἐσχήκαμεν, ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ τῷ ἐγείροντι τοὺς νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/009.yaml
  text: Indeed[a], we ourselves had the sentence of death within ourselves, so that we would not rely on ourselves but on God, who raises the dead.
translation:
  language: pt
  text: Mas nós mesmos tínhamos em nós mesmos a sentença de morte[a], para que não confiássemos em nós mesmos, mas em Deus, que ressuscita os mortos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o veredito de morte”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Pelo contrário
  rationale: Marca com naturalidade o forte contraste com a afirmação anterior, sem reduzir ἀλλά a uma simples confirmação.
- source_word: αὐτοὶ ἐν ἑαυτοῖς
  choice: nós mesmos já tínhamos em nós
  rationale: Preserva tanto a ênfase de αὐτοί quanto a dimensão interior e pessoal de ἐν ἑαυτοῖς.
- source_word: τὸ ἀπόκριμα τοῦ θανάτου
  choice: a sentença de morte
  rationale: No contexto, ἀπόκριμα denota uma decisão ou resultado definitivo de caráter judicial; “sentença de morte” é claro e idiomático.
- source_word: ἐσχήκαμεν
  choice: já tínhamos
  rationale: Expressa o estado resultante indicado pelo perfeito sem acrescentar a ideia não explícita de que a sentença foi “recebida”.
- source_word: ἵνα μὴ πεποιθότες ὦμεν
  choice: para que não confiássemos
  rationale: Conserva a finalidade de ἵνα e comunica uma confiança firme ou dependência, em português natural.
- source_word: ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ
  choice: em nós mesmos, mas em Deus
  rationale: Mantém o paralelismo e o contraste direto entre autoconfiança e confiança em Deus.
- source_word: τῷ ἐγείροντι τοὺς νεκρούς
  choice: que ressuscita os mortos
  rationale: Identifica Deus por seu poder de dar vida e emprega formulação bíblica clara e reconhecível.
theological_decisions:
- issue: Como traduzir τοὺς νεκρούς
  choice: os mortos
  alternative: as pessoas mortas
  rationale: “Os mortos” é exato, natural e preserva a ressonância da ação divina de ressuscitar sem explicitação interpretativa desnecessária.
- issue: Natureza de ἀπόκριμα τοῦ θανάτου
  choice: sentença de morte
  alternative: veredito de morte
  rationale: As duas leituras judiciais são plausíveis; “sentença de morte” comunica melhor em português a decisão de que a morte parecia certa, sem definir quem a teria pronunciado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem conserva a ênfase em “nós mesmos” e o contraste entre confiar em si e confiar em Deus.
