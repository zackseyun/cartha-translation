revisions:
- from: 'Pois não queremos que vocês desconheçam, irmãos[a], a aflição que sofremos na Ásia[b]: fomos oprimidos de modo extremo, além das nossas forças, a ponto de perdermos até a esperança de continuar vivos[c].'
  to: 'Pois não queremos, irmãos[a], que vocês desconheçam a respeito da nossa aflição que nos sobreveio na Ásia[b]: fomos sobrecarregados sobremaneira, além das nossas forças, a ponto de desesperarmos até da vida[c].'
  rationale: 'A revisão conserva a relação sintática e a progressão do grego: a aflição sobreveio na Ásia, o grupo foi sobrecarregado em grau extraordinário e além de sua capacidade, e o resultado foi desespero até mesmo quanto à vida. “Nos sobreveio” representa γενομένης sem acrescentar uma formulação de sofrimento; “sobrecarregados” preserva a metáfora de peso de ἐβαρήθημεν; e “desesperarmos até da vida” mantém a concisão e a amplitude do original. As notas permanecem corretamente ancoradas e a alternativa explicativa é preservada.'
