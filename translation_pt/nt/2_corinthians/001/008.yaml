review_pass:
  verdict: revise
  source_fidelity: A estrutura e o sentido geral estão corretos. Contudo, “a aflição que sofremos” desloca a formulação de γεγονέναι (“que ocorreu/nos sobreveio”) para uma explicitação interpretativa, e “oprimidos” pode sugerir opressão social ou política, não presente necessariamente em ἐβαρήθημεν (“fomos sobrecarregados/ficamos sob pesado fardo”).
  naturalness: O texto é claro e contemporâneo. “Não queremos que vocês desconheçam” é aceitável, mas a ordem “não queremos, irmãos, que vocês desconheçam” soa mais idiomática e preserva melhor o vocativo. “Fomos sobrecarregados sobremaneira” é natural em registro bíblico moderno e reproduz a imagem de peso.
  terminology: “Irmãos”, “aflição”, “Ásia” e “forças” são adequados. A nota sobre a província romana é pertinente. A formulação principal para o resultado deve conservar mais diretamente o desespero relativo à vida, sem explicitar como sentido principal a esperança de sobreviver; esta explicitação cabe bem como alternativa em nota.
  issues:
  - severity: medium
    issue: “a aflição que sofremos” para τῆς θλίψεως ... τῆς γενομένης
    rationale: O particípio γενομένης descreve a aflição como ocorrida ou sobrevinda na Ásia; embora o sofrimento de Paulo esteja implícito em “nossa aflição”, “que sofremos” acrescenta uma formulação que não é a expressão do texto.
  - severity: medium
    issue: “fomos oprimidos” para ἐβαρήθημεν
    rationale: O verbo expressa primariamente ser pesado, sobrecarregado ou esmagado. “Oprimidos” é possível em certos contextos, mas em português tende a introduzir uma conotação sociopolítica desnecessária.
  - severity: low
    issue: “perdermos até a esperança de continuar vivos” como texto principal
    rationale: É uma interpretação plausível do resultado, mas “desesperarmos até da vida” conserva de forma mais direta a construção καὶ τοῦ ζῆν e deixa aberto o matiz exato.
