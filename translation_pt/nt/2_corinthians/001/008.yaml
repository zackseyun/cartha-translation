source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν, ἀδελφοί, ⸀ὑπὲρ τῆς θλίψεως ἡμῶν τῆς ⸀γενομένης ἐν τῇ Ἀσίᾳ, ὅτι καθ’ ὑπερβολὴν ⸂ὑπὲρ δύναμιν ἐβαρήθημεν⸃, ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/008.yaml
  text: For we do not want you to be unaware[a], brothers, about our affliction that happened in Asia, that we were burdened exceedingly, beyond our strength[c][b], so that we despaired even of life.
translation:
  language: pt
  text: 'Pois não queremos, irmãos[a], que vocês desconheçam a respeito da nossa aflição que nos sobreveio na Ásia[b]: fomos sobrecarregados sobremaneira, além das nossas forças, a ponto de desesperarmos até da vida[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” traduz o masculino plural ἀδελφοί; neste contexto, Paulo provavelmente se dirige de modo inclusivo a toda a comunidade de fiéis.
    reason: cultural_note
  - marker: b
    text: “Ásia” se refere à província romana situada no oeste da Ásia Menor, e não ao continente moderno.
    reason: cultural_note
  - marker: c
    text: 'Ou: “a ponto de perdermos até a esperança de continuar vivos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλομεν ... ἀγνοεῖν
  choice: não queremos que vocês desconheçam
  rationale: Reproduz a declaração volitiva e comunica ἀγνοεῖν com clareza em português atual, sem o tom potencialmente pejorativo de “sejam ignorantes”.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém a forma masculina plural do grego e o vocativo epistolar tradicional; uma nota esclarece seu provável alcance inclusivo na comunidade.
- source_word: ὑπὲρ τῆς θλίψεως ἡμῶν τῆς γενομένης
  choice: a aflição que sofremos
  rationale: “Aflição” preserva a gravidade de θλῖψις. Embora γενομένης signifique literalmente “ocorrida”, a formulação natural “que sofremos” explicita sem exagero a relação do grupo com a aflição.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: na Ásia
  rationale: Conserva o nome geográfico do texto; a nota identifica a província romana para evitar a leitura como o continente moderno.
- source_word: καθ’ ὑπερβολὴν
  choice: de modo extremo
  rationale: Expressa o grau extraordinário e excessivo da carga em português natural, preparando a especificação “além das nossas forças”.
- source_word: ὑπὲρ δύναμιν ἐβαρήθημεν
  choice: fomos oprimidos ... além das nossas forças
  rationale: O passivo mantém a experiência de uma carga imposta. “Oprimidos” comunica tanto o peso figurado de ἐβαρήθημεν quanto a severidade da provação; “além das nossas forças” preserva o limite de capacidade expresso por δύναμις.
- source_word: ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν
  choice: a ponto de perdermos até a esperança de continuar vivos
  rationale: “A ponto de” marca o resultado. A formulação comunica a força de ἐξαπορέομαι e entende τοῦ ζῆν como o objeto do desespero, sem sugerir necessariamente um desejo de morrer.
theological_decisions:
- issue: Alcance de ἀδελφοί no vocativo epistolar
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A tradução principal preserva a forma gramatical masculina do original, enquanto a nota registra que, no contexto, o chamado provavelmente abrange toda a comunidade cristã.
- issue: Natureza do desespero expresso por ἐξαπορηθῆναι ... τοῦ ζῆν
  choice: perdermos até a esperança de continuar vivos
  alternative: desesperarmos até da própria vida
  rationale: A escolha comunica o temor de não sobreviver à aflição e evita resolver o texto como declaração inequívoca de desejo de morte; a alternativa mais formal permanece possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para leitura natural no Brasil e inteligibilidade internacional. A construção foi levemente reorganizada com dois-pontos para evitar uma sequência pesada de orações subordinadas, sem alterar a progressão do grego.
