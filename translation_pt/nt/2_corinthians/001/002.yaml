source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: pt
  text: Graça e paz a vocês, da parte de Deus, nosso Pai, e do Senhor[b] Jesus, o Messias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, conforme a forma tradicional, “Jesus Cristo”.
    reason: lexical_alternative
  - marker: b
    text: Em alguns contextos, “Senhor” também pode ser traduzido como “Mestre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: graça
  rationale: Preserva tanto a forma da saudação paulina quanto a densidade teológica do termo, sem reduzi-lo a mero favor.
- source_word: ὑμῖν
  choice: a vocês
  rationale: Expressa naturalmente o dativo de destinatário em português de ampla compreensão, com boa legibilidade brasileira.
- source_word: εἰρήνη
  choice: paz
  rationale: É o equivalente bíblico e corrente, preservando as ressonâncias judaicas e escriturísticas da saudação.
- source_word: ἀπὸ
  choice: da parte de
  rationale: Indica a origem da graça e da paz de modo idiomático em uma fórmula epistolar portuguesa.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Deus, nosso Pai
  rationale: A aposição com vírgulas comunica claramente que Deus é identificado como nosso Pai, sem sugerir dois referentes.
- source_word: κυρίου
  choice: Senhor
  rationale: É a tradução tradicional, natural e teologicamente adequada do título κύριος aplicado a Jesus neste contexto.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título, tornando explícito seu sentido messiânico; o artigo e a vírgula são recursos idiomáticos do português e não pretendem acrescentar um artigo ao texto grego.
theological_decisions:
- issue: Tradução de Χριστοῦ na saudação paulina
  choice: o Messias
  alternative: Cristo
  rationale: A opção traduz o sentido titular de Χριστός em vez de apenas reproduzir sua forma tradicional; a alternativa consagrada é registrada em nota para não ocultar o uso eclesiástico corrente.
- issue: Tradução cristológica de κυρίου
  choice: Senhor
  alternative: Mestre
  rationale: Neste enunciado de bênção, κύριος funciona como título de Jesus e aparece ao lado de Deus, nosso Pai. “Senhor” preserva melhor o registro e a amplitude do termo, sem resolver além do texto suas implicações cristológicas.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leitura natural no Brasil. “A vocês” evita regionalismo excessivo; “da parte de” mantém o caráter epistolar da fórmula. As notas foram colocadas junto aos termos a que se referem.
