source:
  edition: SBLGNT
  text: καὶ ἡ ἐλπὶς ἡμῶν βεβαία ὑπὲρ ⸀ὑμῶν· εἰδότες ὅτι ⸀ὡς κοινωνοί ἐστε τῶν παθημάτων, οὕτως καὶ τῆς παρακλήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/007.yaml
  text: And our hope for you is firm[a], because we know that just as you share in the sufferings, so also you share in the comfort.
translation:
  language: pt
  text: E a nossa esperança a respeito de vocês é firme, pois sabemos que, assim como vocês participam dos sofrimentos, também participam do consolo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «encorajamento».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίς
  choice: esperança
  rationale: É o equivalente português mais direto e preserva tanto a expectativa quanto a confiança presentes no termo.
- source_word: βεβαία
  choice: firme
  rationale: Expressa de modo natural o caráter seguro e estável da esperança de Paulo.
- source_word: ὑπὲρ ὑμῶν
  choice: a respeito de vocês
  rationale: Neste contexto, ὑπέρ com o genitivo indica referência aos coríntios; esta formulação evita que «por vocês» seja entendido como benefício ou intercessão.
- source_word: εἰδότες
  choice: pois sabemos
  rationale: Explicita naturalmente o valor causal do particípio, que fundamenta a firmeza da esperança.
- source_word: ὡς ... οὕτως καί
  choice: assim como ... também
  rationale: Preserva a estrutura correlativa do grego em português corrente.
- source_word: κοινωνοί
  choice: participam
  rationale: Comunica a ideia de participação compartilhada e permite reproduzir com naturalidade a elipse da segunda oração.
- source_word: παθημάτων
  choice: sofrimentos
  rationale: É amplo, claro e coerente com o vocabulário do contexto imediato.
- source_word: παρακλήσεως
  choice: consolo
  rationale: No contexto de 2 Coríntios 1, destaca o alívio e amparo recebidos em meio ao sofrimento, mantendo a recorrência temática de παράκλησις.
- source_word: '[elipse na segunda oração]'
  choice: participam
  rationale: O verbo não se repete no grego, mas sua retomada em português torna clara a relação paralela sem acrescentar conteúdo novo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Vocês» representa o plural ὑμῶν/ἐστε; «consolo» mantém a ênfase contextual, enquanto a nota registra a amplitude possível de παράκλησις.
