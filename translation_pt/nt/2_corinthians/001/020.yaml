reference: 2 Corinthians 1:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅσαι γὰρ ἐπαγγελίαι θεοῦ, ἐν αὐτῷ τὸ Ναί· ⸀διὸ καὶ ⸂δι’ αὐτοῦ⸃ τὸ Ἀμὴν τῷ θεῷ πρὸς δόξαν δι’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/020.yaml
  text: For however many promises of God there are[a], in him is the Yes[c][b]. Therefore also through him is the Amen to God for glory through us.
translation:
  language: pt
  text: Pois, por mais numerosas que sejam as promessas de Deus, nele está o “Sim”[a]. Por isso, também por meio dele está o “Amém” a Deus, para glória por nosso intermédio.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: “nele elas recebem o seu Sim”.'
    reason: alternative_reading
  - marker: b
    text: “Amém” translitera uma palavra hebraica usada como afirmação, com sentido semelhante a “verdadeiramente” ou “assim seja”.
    reason: cultural_note
  - marker: c
    text: 'A construção “a Deus, para glória por nosso intermédio” é compacta. “Para glória” pode ser entendido como a finalidade da aclamação dirigida a Deus; nesse caso, pode-se explicitar: “para a glória de Deus por nosso intermédio”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσαι
  choice: por mais numerosas que sejam
  rationale: Expressa a totalidade indefinida das promessas em português natural, sem sugerir dúvida quanto à sua validade.
- source_word: ἐπαγγελίαι θεοῦ
  choice: promessas de Deus
  rationale: Mantém o genitivo de modo direto, identificando-as como promessas pertencentes a Deus ou feitas por ele.
- source_word: ἐν αὐτῷ τὸ Ναί
  choice: nele está o “Sim”
  rationale: Preserva a formulação compacta e enfática de Paulo, sem explicitar no texto principal que as promessas são cumpridas em Cristo.
- source_word: δι’ αὐτοῦ
  choice: por meio dele
  rationale: Reflete διά com genitivo e destaca a mediação de Cristo.
- source_word: τὸ Ἀμήν
  choice: o “Amém”
  rationale: Conserva o termo litúrgico transliterado e o paralelismo articulado com “o Sim”.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: Representa o destinatário a quem o Amém é dirigido.
- source_word: πρὸς δόξαν
  choice: para a glória de Deus
  rationale: Torna explícita, em português idiomático, a finalidade de glorificar a Deus; a possível ligação sintática é registrada em nota.
- source_word: δι’ ἡμῶν
  choice: por nosso intermédio
  rationale: Preserva a amplitude da expressão e evita acrescentar “ministério”, que seria interpretativo.
theological_decisions:
- issue: Se a afirmação elíptica deve ser expandida como fórmula explícita de cumprimento
  choice: Manter “nele está o ‘Sim’”
  alternative: “nele todas as promessas se cumprem” ou “nele elas recebem o seu Sim”
  rationale: Embora o cumprimento em Cristo esteja implícito, a redação compacta conserva a força retórica e a tensão do grego.
- issue: Quem profere o Amém
  choice: Explicitar “dizemos” a partir de δι’ ἡμῶν
  alternative: “por meio dele está o Amém a Deus”
  rationale: Em português, a elipse literal é pouco natural. O contexto de uma aclamação dirigida a Deus permite tornar explícito o ato de dizer, sem definir se “nós” abrange apenas Paulo e seus cooperadores ou toda a comunidade.
- issue: Ligação de πρὸς δόξαν
  choice: “para a glória de Deus”
  alternative: “para glória, por nosso intermédio”
  rationale: A formulação adotada comunica a leitura contextual mais natural, mas a concisão do grego permite outra disposição sintática, preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. As aspas destacam “Sim” e “Amém” como afirmações substantivadas. A ordem foi ajustada para soar natural sem apagar o paralelismo e a concisão do original.
