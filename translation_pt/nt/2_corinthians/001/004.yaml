source:
  edition: SBLGNT
  text: ὁ παρακαλῶν ἡμᾶς ἐπὶ πάσῃ τῇ θλίψει ἡμῶν, εἰς τὸ δύνασθαι ἡμᾶς παρακαλεῖν τοὺς ἐν πάσῃ θλίψει διὰ τῆς παρακλήσεως ἧς παρακαλούμεθα αὐτοὶ ὑπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/004.yaml
  text: who comforts us in all our affliction[a], so that we may be able to comfort those in any affliction through the comfort with which we ourselves are comforted by God.
translation:
  language: pt
  text: que nos consola em toda a nossa aflição[a], para que possamos consolar os que passam por qualquer aflição, por meio da consolação com que nós mesmos somos consolados por Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encoraja... encorajar... encorajamento... somos encorajados”; o grego emprega a mesma família de palavras ao longo de todo o versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶν / παρακαλεῖν / παρακλήσεως / παρακαλούμεθα
  choice: consola / consolar / consolação / somos consolados
  rationale: No contexto de θλῖψις, a família de palavras transmite consolo que também fortalece. A repetição da mesma família lexical em português preserva a coesão enfática do grego.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: em toda a nossa aflição
  rationale: A formulação preserva o peso de θλῖψις como sofrimento, angústia ou pressão e verte a preposição de modo natural em português.
- source_word: εἰς τὸ δύνασθαι ἡμᾶς
  choice: para que possamos
  rationale: Expressa de maneira natural a finalidade ou o resultado indicado pela construção infinitiva, sem decidir rigidamente entre essas nuances.
- source_word: τοὺς ἐν πάσῃ θλίψει
  choice: os que passam por qualquer aflição
  rationale: 'Comunica o alcance distributivo da expressão: pessoas que enfrentam qualquer espécie de aflição. ''Passam por'' é idiomático e não reduz a intensidade do substantivo.'
- source_word: αὐτοὶ
  choice: nós mesmos
  rationale: Mantém a ênfase explícita do pronome grego.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: por Deus
  rationale: Com o verbo passivo, ὑπό indica Deus como agente pessoal do consolo.
theological_decisions:
- issue: Amplitude semântica de παρακαλέω / παράκλησις
  choice: consolar / consolação
  alternative: encorajar / encorajamento
  rationale: A aflição mencionada no versículo favorece o sentido de consolo fortalecedor. A nota conserva a alternativa legítima sem restringir o termo a mero alívio emocional.
- issue: Finalidade ou resultado em εἰς τὸ δύνασθαι
  choice: para que possamos
  alternative: de modo que podemos
  rationale: A construção pode envolver finalidade e resultado; a tradução escolhida acompanha o fluxo intencional da frase sem formular uma distinção teológica que o grego não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição deliberada de 'consolar/consolação' reproduz a recorrência retórica do grego; 'os que passam por' evita uma construção excessivamente literal e pouco natural.
