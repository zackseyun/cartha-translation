  text: Ἀρχόμεθα πάλιν ἑαυτοὺς ⸀συνιστάνειν; ⸀ἢ μὴ χρῄζομεν ὥς τινες συστατικῶν ἐπιστολῶν πρὸς ὑμᾶς ἢ ἐξ ⸀ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/001.yaml
  text: Are we beginning again to commend ourselves? Or do we need[a], like some, letters of recommendation to you or from you?
translation:
  language: pt
  text: Será que estamos começando novamente a nos recomendar? Ou será que, como alguns, precisamos de cartas de recomendação para vocês ou vindas de vocês?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀρχόμεθα πάλιν
  choice: estamos começando outra vez
  rationale: Preserva o aspecto presente e a ideia de repetição numa pergunta retórica natural em português.
- source_word: ἑαυτοὺς συνιστάνειν
  choice: a recomendar a nós mesmos
  rationale: Expressa a ideia de apresentar-se favoravelmente, mantendo a ligação lexical com as cartas de recomendação mencionadas em seguida.
- source_word: ἢ μὴ χρῄζομεν
  choice: Ou será que precisamos
  rationale: A formulação interrogativa com «será que» soa natural e conserva a expectativa de resposta negativa indicada por μή.
- source_word: ὥς τινες
  choice: como alguns
  rationale: Mantém sem identificar o grupo indefinido ao qual Paulo alude.
- source_word: συστατικῶν ἐπιστολῶν
  choice: cartas de recomendação
  rationale: Designa de modo claro e atual cartas que apresentam ou endossam uma pessoa.
- source_word: πρὸς ὑμᾶς
  choice: dirigidas a vocês
  rationale: Explicita a direção indicada por πρός sem sugerir que as cartas fossem escritas em benefício dos coríntios.
- source_word: ἢ ἐξ ὑμῶν
  choice: ou fornecidas por vocês
  rationale: Comunica a origem indicada por ἐξ e evita a possível leitura espacial de «vindas de vocês».
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de «recomendação» preserva o jogo lexical entre συνιστάνειν e συστατικῶν. «Vocês» representa o plural ὑμᾶς/ὑμῶν de modo natural.
