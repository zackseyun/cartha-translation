  text: Such confidence we have through Messiah toward God[a][b].
translation:
  language: pt
  text: Temos tal confiança por meio do Messias[a] diante de Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio de Cristo”.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “para com Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεποίθησιν
  choice: confiança
  rationale: Expressa uma segurança firme e fundamentada, sem transformar o termo em mera sensação subjetiva nem introduzir outro objeto para a confiança.
- source_word: δὲ τοιαύτην
  choice: tal
  rationale: Retoma de modo natural o contexto anterior e preserva a força qualitativa de τοιαύτην; o valor conectivo leve de δέ fica adequadamente expresso pelo fluxo da frase.
- source_word: ἔχομεν
  choice: temos
  rationale: Equivalente direto, claro e idiomático do verbo grego.
- source_word: διὰ τοῦ Χριστοῦ
  choice: por meio do Messias
  rationale: διά com o genitivo indica mediação ou instrumentalidade. “Messias” preserva aqui o sentido titular de Χριστός.
- source_word: πρὸς τὸν θεόν
  choice: diante de Deus
  rationale: Comunica em português corrente a orientação relacional da confiança para com Deus, adequada ao contexto, enquanto a nota registra uma formulação mais próxima da construção grega.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: O termo conserva valor titular neste contexto; a forma tradicional “Cristo” é mantida em nota como alternativa legítima.
- issue: Sentido de πρὸς τὸν θεόν
  choice: diante de Deus
  alternative: para com Deus
  rationale: “Diante de Deus” é natural e mantém a referência teocêntrica da confiança sem decidir além do que o contexto permite; “para com Deus” reflete mais de perto a orientação lexical de πρός.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe simples. “Por meio de” explicita naturalmente a mediação indicada por διά; “diante de Deus” evita o caráter pouco corrente de “para com Deus”, preservado em nota.
