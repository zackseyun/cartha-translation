  text: οὐχ ὅτι ⸂ἀφ’ ἑαυτῶν ἱκανοί ἐσμεν⸃ λογίσασθαί τι ὡς ἐξ ⸀αὑτῶν, ἀλλ’ ἡ ἱκανότης ἡμῶν ἐκ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/005.yaml
  text: Not that we are sufficient in ourselves to consider anything as coming from ourselves[a], but our sufficiency is from God[b],
translation:
  language: pt
  text: Não que sejamos, por nós mesmos, capazes[a] de considerar coisa alguma como proveniente de nós mesmos; mas a nossa capacidade vem de Deus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «suficientes» ou «aptos»; de modo correspondente, «suficiência» ou «aptidão» no fim do versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: Não que
  rationale: Introduz uma ressalva ou esclarecimento retórico, sem transformar a expressão em uma afirmação causal.
- source_word: ἀφ’ ἑαυτῶν
  choice: por nós mesmos
  rationale: Com «sejamos capazes», expressa que essa capacidade não reside nem se origina nos próprios sujeitos.
- source_word: ἱκανοί / ἱκανότης
  choice: capazes / capacidade
  rationale: Preserva em português a ligação lexical entre o adjetivo e o substantivo, além de comunicar aptidão ou suficiência sem restringi-la apenas à habilidade ministerial.
- source_word: λογίσασθαί
  choice: considerar
  rationale: Transmite de modo natural o sentido de avaliar mentalmente, calcular ou julgar.
- source_word: τι
  choice: alguma coisa
  rationale: Mantém o alcance indefinido da expressão no contexto negativo.
- source_word: ὡς ἐξ αὑτῶν
  choice: como proveniente de nós mesmos
  rationale: Explicita de maneira idiomática a noção de origem presente na preposição ἐξ.
- source_word: ἐκ τοῦ θεοῦ
  choice: vem de Deus
  rationale: Apresenta Deus claramente como a fonte da capacidade, em português corrente e direto.
theological_decisions:
- issue: Alcance da afirmação de Paulo sobre a capacidade humana
  choice: Manter a formulação ampla sobre a incapacidade de origem própria.
  alternative: Restringir explicitamente a afirmação à competência para o ministério apostólico.
  rationale: Embora o contexto imediato trate do ministério, o enunciado grego deste versículo é mais amplo; a tradução não deve estreitá-lo além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural tanto no Brasil quanto em outros contextos lusófonos. A repetição «capazes/capacidade» preserva o vínculo lexical do grego; «por nós mesmos» e «proveniente de nós mesmos» mantêm a dupla ênfase na ausência de origem própria.
