id: 2CO.3.14
reference: 2 Corinthians 3:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ ἐπωρώθη τὰ νοήματα αὐτῶν. ἄχρι γὰρ τῆς σήμερον ⸀ἡμέρας τὸ αὐτὸ κάλυμμα ἐπὶ τῇ ἀναγνώσει τῆς παλαιᾶς διαθήκης μένει μὴ ἀνακαλυπτόμενον, ⸀ὅτι ἐν Χριστῷ καταργεῖται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/014.yaml
  text: But their minds were hardened[a]. For until this very day, at the reading of the old covenant, the same veil remains, not being lifted[b], because in Messiah it is removed.
translation:
  language: pt
  text: Mas a mente deles foi endurecida. Pois, até o dia de hoje, durante a leitura da antiga aliança[a], o mesmo véu permanece sem ser levantado, porque é no Messias que ele é removido.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “antigo testamento”. Em grego, “antiga aliança”.
    reason: lexical_alternative
  - marker: b
    text: 'Outra possibilidade: “porque no Messias ela é abolida” ou “posta de lado”, entendendo-se que a expressão se refere à antiga aliança, e não ao véu.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπωρώθη τὰ νοήματα αὐτῶν
  choice: a mente deles foi endurecida
  rationale: Preserva a imagem de endurecimento e expressa de modo natural a faculdade de percepção e entendimento indicada por νοήματα.
- source_word: ἄχρι γὰρ τῆς σήμερον ἡμέρας
  choice: Pois, até o dia de hoje
  rationale: Mantém tanto a conexão explicativa de γάρ quanto a ênfase temporal da expressão grega.
- source_word: ἐπὶ τῇ ἀναγνώσει
  choice: durante a leitura
  rationale: Formulação corrente em português que comunica a circunstância em que o véu permanece.
- source_word: παλαιᾶς διαθήκης
  choice: antiga aliança
  rationale: διαθήκη significa aqui 'aliança'; evita substituir o termo original pelo tradicional 'testamento'.
- source_word: κάλυμμα
  choice: véu
  rationale: Conserva a metáfora ligada ao véu de Moisés no contexto imediato.
- source_word: μένει μὴ ἀνακαλυπτόμενον
  choice: permanece sem ser levantado
  rationale: Mantém o aspecto contínuo de μένει e traduz o particípio passivo de maneira compatível com a imagem do véu.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Representa Χριστός como título e segue a política lexical do projeto.
- source_word: καταργεῖται
  choice: é removido
  rationale: Com 'véu' como antecedente mais próximo, 'removido' comunica naturalmente a cessação expressa pelo verbo passivo.
theological_decisions:
- issue: Referente implícito de καταργεῖται
  choice: 'O pronome ''ele'' retoma o véu: ''é no Messias que ele é removido''.'
  alternative: A antiga aliança é abolida ou posta de lado; também é possível entender que a formulação grega conserva alguma ambiguidade entre o véu e a aliança.
  rationale: O véu é o antecedente mais próximo e se harmoniza com a oração anterior, mas a nota registra a alternativa sintática e teologicamente significativa sem impor uma conclusão mais forte que o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A redação conserva a metáfora do endurecimento e do véu, usa 'Messias' para Χριστός e documenta em nota a ambiguidade relevante do referente final.
