lexical_decisions:
- source_word: Ἔχοντες
  choice: tendo
  rationale: Preserva de modo natural a forma participial e sua relação circunstancial com a oração principal; junto de οὖν, o nexo inferencial permanece claro.
- source_word: οὖν
  choice: portanto
  rationale: Expressa diretamente a inferência tirada do argumento anterior.
- source_word: τοιαύτην
  choice: tal
  rationale: Reproduz de forma compacta a força qualitativa e demonstrativa do termo grego.
- source_word: ἐλπίδα
  choice: esperança
  rationale: Equivalente corrente que, no contexto, comunica expectativa confiante.
- source_word: πολλῇ
  choice: grande
  rationale: Intensifica naturalmente παρρησίᾳ em português.
- source_word: παρρησίᾳ
  choice: ousadia
  rationale: No contexto, comunica confiança e ausência de reserva, sem excluir as nuances de franqueza e abertura registradas na nota.
- source_word: χρώμεθα
  choice: agimos com
  rationale: O verbo médio com dativo indica fazer uso ou valer-se de algo; esta formulação é idiomática e evita sugerir que o texto menciona explicitamente a fala.
