    reason: alternative_reading
  revision_rationale: A revisão limita-se à expressão final e à nota correspondente. «Da parte de» reflete melhor o valor de ἀπό, enquanto «o Senhor, o Espírito» preserva a construção compacta e a ambiguidade sintática do original. As alternativas continuam disponíveis em nota, sem impor uma leitura doutrinária.
