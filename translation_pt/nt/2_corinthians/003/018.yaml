id: 2CO.3.18
reference: 2 Corinthians 3:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ πάντες ἀνακεκαλυμμένῳ προσώπῳ τὴν δόξαν κυρίου κατοπτριζόμενοι τὴν αὐτὴν εἰκόνα μεταμορφούμεθα ἀπὸ δόξης εἰς δόξαν, καθάπερ ἀπὸ κυρίου πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/018.yaml
  text: And we all[a], with unveiled face, beholding the glory of the Lord as in a mirror, are being transformed into the same image from glory to glory, just as from the Lord[b], the Spirit.
translation:
  language: pt
  text: E todos nós, com o rosto descoberto, contemplando como num espelho a glória do Senhor[a], somos transformados na mesma imagem, de glória em glória, como da parte do Senhor, o Espírito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «refletindo como um espelho a glória do Senhor».'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «da parte do Senhor, que é o Espírito»; outra possibilidade: «da parte do Espírito do Senhor».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνακεκαλυμμένῳ προσώπῳ
  choice: com o rosto descoberto
  rationale: Expressa o estado presente resultante de o véu ter sido retirado e conserva o singular coletivo do grego em português natural.
- source_word: δόξαν κυρίου
  choice: a glória do Senhor
  rationale: Reproduz diretamente o genitivo e emprega «Senhor» como equivalente corrente e digno de κύριος.
- source_word: κατοπτριζόμενοι
  choice: contemplando como num espelho
  rationale: O verbo pode indicar contemplar por meio de um espelho ou refletir como espelho. A leitura de contemplação se ajusta ao movimento contextual entre ver a glória e ser transformado, enquanto a alternativa genuína é preservada em nota.
- source_word: τὴν αὐτὴν εἰκόνα
  choice: na mesma imagem
  rationale: Mantém a formulação concisa e o vínculo entre a glória do Senhor e a imagem na qual os fiéis são transformados.
- source_word: μεταμορφούμεθα
  choice: somos transformados
  rationale: A forma passiva preserva a ação recebida; no contexto, o presente português admite o caráter contínuo da transformação sem tornar a frase pesada.
- source_word: ἀπὸ δόξης εἰς δόξαν
  choice: de glória em glória
  rationale: Conserva a expressão compacta e retórica do grego sem explicitar graus ou etapas que o texto não enuncia diretamente.
- source_word: καθάπερ
  choice: como
  rationale: Equivalente comparativo natural em português atual; neste contexto, evita a rigidez de «assim como» junto da expressão final já condensada.
- source_word: ἀπὸ κυρίου πνεύματος
  choice: pelo Senhor, o Espírito
  rationale: Apresenta a origem ou agência da transformação em português inteligível e mantém «o Espírito» em aposição a «o Senhor», sem converter a frase principal numa explicação doutrinária mais explícita.
- source_word: κύριος
  choice: Senhor
  rationale: É o equivalente estabelecido e contextualmente apropriado para as duas ocorrências de κύριος.
theological_decisions:
- issue: O sentido de κατοπτριζόμενοι
  choice: contemplando como num espelho a glória do Senhor
  alternative: refletindo como um espelho a glória do Senhor
  rationale: A progressão entre contemplação e transformação favorece a primeira leitura, mas o verbo grego comporta genuinamente a ideia de reflexão; por isso, a alternativa permanece em nota.
- issue: A relação entre κυρίου e πνεύματος na frase final
  choice: pelo Senhor, o Espírito
  alternative: pelo Senhor, que é o Espírito; pelo Espírito do Senhor
  rationale: A construção grega é condensada e sintaticamente ambígua. A aposição no texto principal permanece próxima dessa forma, enquanto a nota registra as duas explicitações principais sem impor uma delas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase conserva o encadeamento retórico do grego, e as expressões «de glória em glória» e «o Senhor, o Espírito» mantêm sua concisão e tensão interpretativa.
