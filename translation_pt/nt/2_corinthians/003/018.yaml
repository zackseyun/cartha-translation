revisions:
- from: E todos nós, com o rosto descoberto, contemplando como num espelho a glória do Senhor[a], somos transformados na mesma imagem, de glória em glória, como pelo Senhor, o Espírito.[b]
  to: E todos nós, com o rosto descoberto, contemplando como num espelho a glória do Senhor[a], somos transformados na mesma imagem, de glória em glória, como da parte do Senhor, o Espírito.[b]
  rationale: A revisão limita-se à expressão final e à nota correspondente. «Da parte de» reflete melhor o valor de ἀπό, enquanto «o Senhor, o Espírito» preserva a construção compacta e a ambiguidade sintática do original. As alternativas continuam disponíveis em nota, sem impor uma leitura doutrinária.
