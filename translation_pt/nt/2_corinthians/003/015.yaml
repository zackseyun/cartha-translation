id: 2CO.3.15
reference: 2 Corinthians 3:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλ’ ἕως σήμερον ἡνίκα ⸂ἂν ἀναγινώσκηται⸃ Μωϋσῆς κάλυμμα ἐπὶ τὴν καρδίαν αὐτῶν κεῖται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/015.yaml
  text: But to this day[a], whenever Moses is read[b], a veil lies over their heart.
translation:
  language: pt
  text: Mas, até hoje, sempre que Moisés é lido[a], um véu permanece sobre o coração deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os escritos de Moisés, especialmente a Lei.
    reason: cultural_note
  - marker: b
    text: O grego traz “o coração deles” no singular, provavelmente com sentido coletivo; também seria possível traduzir “os corações deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Mas
  rationale: Introduz de modo conciso e natural o contraste com a afirmação anterior.
- source_word: ἕως σήμερον
  choice: até hoje
  rationale: Expressa que a situação descrita continua até o presente.
- source_word: ἡνίκα ἂν ἀναγινώσκηται
  choice: sempre que ... é lido
  rationale: A construção com ἄν e o presente do subjuntivo indica uma circunstância indefinida e repetida.
- source_word: Μωϋσῆς
  choice: Moisés
  rationale: Preserva a metonímia do texto grego, em que o nome se refere aos escritos mosaicos, sem explicá-la dentro do texto principal.
- source_word: κάλυμμα
  choice: um véu
  rationale: Mantém a imagem central do contexto imediato e corresponde diretamente ao objeto que encobria o rosto de Moisés.
- source_word: ἐπὶ τὴν καρδίαν αὐτῶν
  choice: sobre o coração deles
  rationale: Conserva o singular coletivo καρδίαν ligado ao possessivo plural, uma tensão gramatical genuína do original.
- source_word: κεῖται
  choice: permanece
  rationale: Comunica que o véu está sobre o coração e continua ali; em português, é mais natural nesse contexto do que uma reprodução rígida como 'jaz'.
theological_decisions:
- issue: Se “Moisés” deve ser explicitado como a Lei ou os escritos mosaicos
  choice: Manter “Moisés” no texto principal como metonímia
  alternative: Traduzir como “a Lei de Moisés” ou “os escritos de Moisés”
  rationale: O original diz literalmente “Moisés”. Preservar essa forma evita restringir indevidamente a referência, enquanto a nota esclarece o sentido metonímico.
- issue: Se o singular “coração” deve ser convertido no plural em português
  choice: 'Manter o singular coletivo: “o coração deles”'
  alternative: 'Usar o plural idiomático: “os corações deles”'
  rationale: O singular preserva mais de perto a formulação grega e pode designar coletivamente o interior do grupo, sem decidir se Paulo enfatiza uma condição comum ou indivíduos separados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a imagem do original foram preservadas, evitando tanto o arcaísmo “jaz” quanto uma explicitação interpretativa de “Moisés” no texto principal.
