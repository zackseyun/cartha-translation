id: 2CO.3.6
reference: 2 Corinthians 3:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς καὶ ἱκάνωσεν ἡμᾶς διακόνους καινῆς διαθήκης, οὐ γράμματος ἀλλὰ πνεύματος, τὸ γὰρ γράμμα ἀποκτέννει, τὸ δὲ πνεῦμα ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/006.yaml
  text: who also made us competent as servants of a new covenant[a], not of the letter but of the Spirit; for the letter kills[c][b], but the Spirit gives life.
translation:
  language: pt
  text: o qual também nos capacitou para sermos servos de uma nova aliança, não da letra, mas do Espírito[a]; pois a letra mata[b], mas o Espírito dá vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espírito”, nas duas ocorrências.
    reason: alternative_reading
  - marker: b
    text: “Letra” também pode ser entendida como “código escrito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκάνωσεν
  choice: nos capacitou
  rationale: Expressa que Deus tornou os apóstolos aptos para o serviço, sem sugerir apenas suficiência pessoal ou certificação formal.
- source_word: διακόνους
  choice: servos
  rationale: Preserva o sentido de serviço de διάκονος e evita importar a ideia posterior de um cargo eclesiástico; “ministros” continua sendo uma alternativa possível.
- source_word: καινῆς διαθήκης
  choice: de uma nova aliança
  rationale: Representa naturalmente o sintagma genitivo e sua forma sem artigo, mantendo a clara referência à categoria bíblica da nova aliança.
- source_word: γράμματος / γράμμα
  choice: da letra / a letra
  rationale: Mantém a metáfora concisa e a contraposição de Paulo com πνεῦμα; “código escrito” seria uma explicitação interpretativa mais restrita.
- source_word: πνεύματος / πνεῦμα
  choice: do Espírito / o Espírito
  rationale: No contexto da nova aliança, a referência mais provável é ao Espírito Santo. A possibilidade de “espírito” é preservada em nota, pois o grego antigo não distingue maiúsculas e minúsculas dessa maneira.
- source_word: ἀποκτέννει
  choice: mata
  rationale: Tradução direta e vigorosa, correspondente ao presente e à força do contraste grego.
- source_word: ζῳοποιεῖ
  choice: dá vida
  rationale: Forma natural em português que comunica claramente a ação vivificadora do verbo.
theological_decisions:
- issue: Se πνεῦμα deve ser traduzido como “Espírito” ou “espírito”
  choice: Espírito
  alternative: espírito
  rationale: No contraste ligado à nova aliança, o referente mais provável é o Espírito Santo, não um princípio espiritual genérico. Como a escrita grega não resolve a questão por capitalização, a alternativa é registrada em nota.
- issue: Alcance de γράμμα no contraste entre letra e Espírito
  choice: letra
  alternative: código escrito
  rationale: “Letra” preserva a formulação metafórica e a tensão do texto, sem identificar de modo explícito e restritivo o termo com toda Escritura, com a lei em abstrato ou apenas com um código escrito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Capacitou” é natural e conserva a iniciativa divina; “servos” mantém a orientação ao serviço. A ordem e o paralelismo do grego foram preservados sem rigidez artificial.
