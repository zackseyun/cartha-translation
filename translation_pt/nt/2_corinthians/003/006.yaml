  source_fidelity: 'O texto traduz com fidelidade os elementos centrais do grego: Deus capacitou «nos», para o serviço de «uma nova aliança», em contraste entre «letra» e «Espírito». Os presentes «mata» e «dá vida» reproduzem adequadamente a força verbal de ἀποκτέννει e ζῳοποιεῖ. A escolha de «uma nova aliança» preserva apropriadamente o caráter anartro de καινῆς διαθήκης.'
  naturalness: A redação é fluente, clara e digna em português moderno de ampla compreensão. «Nos capacitou para sermos servos» é natural e comunica bem a habilitação divina para o serviço, sem artificialidade.
  terminology: «Aliança», «letra» e «Espírito» são escolhas consistentes com o contexto e com o uso bíblico em português. A nota em «Espírito» preserva de modo apropriado a alternativa «espírito», sem impor uma resolução além do que a ortografia grega permite. «Servos» mantém o valor funcional de διακόνους sem introduzir necessariamente um título eclesiástico posterior.
