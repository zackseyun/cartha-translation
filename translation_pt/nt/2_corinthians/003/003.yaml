source:
  edition: SBLGNT
  text: φανερούμενοι ὅτι ἐστὲ ἐπιστολὴ Χριστοῦ διακονηθεῖσα ὑφ’ ἡμῶν, ἐγγεγραμμένη οὐ μέλανι ἀλλὰ πνεύματι θεοῦ ζῶντος, οὐκ ἐν πλαξὶν λιθίναις ἀλλ’ ἐν πλαξὶν καρδίαις σαρκίναις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/003.yaml
  text: showing that you are a letter from the Messiah[a], ministered by us, written not with ink but with the Spirit of the living God[d][c][b], not on stone tablets but on tablets of hearts of flesh.
translation:
  language: pt
  text: É evidente que vocês são uma carta do Messias[a][b], ministrada por nós, escrita não com tinta, mas com o Espírito do Deus vivo; não em tábuas de pedra, mas em tábuas que são corações de carne[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma carta proveniente do Messias”. O genitivo grego também pode indicar origem ou autoria.'
    reason: alternative_reading
  - marker: b
    text: “Messias” traduz o título grego Χριστός, tradicionalmente vertido como “Cristo”.
    reason: lexical_alternative
  - marker: c
    text: A expressão “corações de carne” evoca a promessa de Deus de substituir o coração de pedra por um coração de carne; veja Ezequiel 11:19; 36:26.
    reason: cross_reference
lexical_decisions:
- source_word: φανερούμενοι
  choice: Vocês deixam evidente
  rationale: Expressa de modo natural o caráter manifesto indicado pelo particípio, mantendo os coríntios como aquilo que se torna publicamente reconhecível.
- source_word: ἐπιστολὴ
  choice: carta
  rationale: Equivalente moderno e direto, adequado à metáfora desenvolvida no contexto.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Preserva Χριστός como título e mantém a construção genitiva, cuja relação exata pode envolver autoria, origem ou pertencimento.
- source_word: διακονηθεῖσα ὑφ’ ἡμῶν
  choice: preparada por nosso intermédio
  rationale: Comunica que Paulo e seus cooperadores serviram como agentes na formação da carta, sem sugerir que fossem seus autores nem recorrer ao uso eclesiástico menos transparente de 'ministrada'.
- source_word: ἐγγεγραμμένη
  choice: escrita
  rationale: Mantém com clareza a metáfora da carta e o contraste entre tinta e Espírito.
- source_word: μέλανι
  choice: tinta
  rationale: Equivalente lexical direto no campo da escrita.
- source_word: πνεύματι θεοῦ ζῶντος
  choice: o Espírito do Deus vivo
  rationale: O contexto da escrita divina e da nova aliança favorece a referência ao Espírito de Deus; a expressão 'Deus vivo' é preservada integralmente.
- source_word: πλαξὶν λιθίναις
  choice: tábuas de pedra
  rationale: Forma corrente em português que conserva a alusão às tábuas do Sinai.
- source_word: πλαξὶν καρδίαις σαρκίναις
  choice: tábuas que são corações de carne
  rationale: 'Torna explícita a relação apositiva: os corações são as tábuas. Ao mesmo tempo, preserva a imagem bíblica deliberadamente concreta de ''corações de carne''.'
theological_decisions:
- issue: Relação genitiva em ἐπιστολὴ Χριστοῦ
  choice: carta do Messias
  alternative: carta proveniente do Messias
  rationale: A formulação mais formal conserva a ambiguidade legítima entre pertencimento, autoria e origem; a nota informa a leitura de procedência sem impô-la no texto.
- issue: Sentido de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: O termo grego funciona como título; 'Messias' comunica seu sentido, enquanto a forma tradicional é registrada em nota.
- issue: Referente de πνεύματι
  choice: Espírito
  alternative: espírito
  rationale: O contraste entre tinta e a ação do Deus vivo, dentro do argumento sobre a nova aliança, sustenta a referência ao Espírito divino.
- issue: Imagem de καρδίαις σαρκίναις
  choice: corações de carne
  alternative: corações humanos
  rationale: A tradução literal preserva o contraste teológico e intertextual com pedra, sem reduzir 'carne' simplesmente a 'humano' nem atribuir-lhe aqui um sentido moral negativo.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com uso de “vocês” para a segunda pessoa do plural. A sintaxe procura ser natural sem apagar a metáfora da carta, a agência apostólica subordinada e o contraste entre pedra e coração de carne.
