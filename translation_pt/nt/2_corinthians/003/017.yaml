  text: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν· οὗ δὲ τὸ πνεῦμα ⸀κυρίου, ἐλευθερία.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/017.yaml
  text: The Lord is the Spirit[a], and where the Spirit of the Lord is, there is freedom.
translation:
  language: pt
  text: O Senhor é o Espírito[a], e onde está o Espírito do Senhor, aí há liberdade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Agora o Senhor é o Espírito». A frase pode ser entendida como uma identificação estreitamente contextual, sem especificar como essa relação deve ser definida teologicamente.'
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: Senhor
  rationale: Mantém o equivalente português consagrado e adequado ao uso paulino e teológico do termo neste contexto.
- source_word: πνεῦμα
  choice: Espírito
  rationale: A inicial maiúscula indica que, nas duas ocorrências, o referente contextual é o Espírito Santo, e não o espírito humano ou uma força impessoal.
- source_word: δὲ
  choice: e
  rationale: Na primeira ocorrência, o valor discursivo é deixado implícito para evitar um «agora» temporal inexistente no grego; na segunda, «e» liga naturalmente as orações sem impor contraste forte.
- source_word: οὗ
  choice: onde
  rationale: Expressa de modo natural o sentido locativo da afirmação geral, sem ampliar necessariamente para «onde quer que».
- source_word: ἐλευθερία
  choice: liberdade
  rationale: É o equivalente contemporâneo mais direto e preserva o peso teológico do termo.
- source_word: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν
  choice: O Senhor é o Espírito
  rationale: Conserva sem atenuação a oração equativa do grego e sua tensão interpretativa.
- source_word: τὸ πνεῦμα κυρίου
  choice: o Espírito do Senhor
  rationale: Reproduz explicitamente a construção genitiva e sua ressonância bíblica.
theological_decisions:
- issue: A identificação expressa em «o Senhor é o Espírito» é teologicamente debatida.
  choice: A oração foi traduzida diretamente como «O Senhor é o Espírito».
  alternative: Entendê-la como uma identificação contextual, funcional ou ligada à nova aliança, sem definir exaustivamente a relação; também há divergência sobre se «o Senhor» se refere especificamente a Cristo ou mais amplamente a Deus.
  rationale: O grego apresenta a identificação de forma direta. A tradução preserva essa formulação e sua tensão, sem inserir na linha principal uma solução doutrinária específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O demonstrativo adverbial «aí» torna natural a correlação «onde... aí» e não acrescenta conteúdo substantivo ao grego.
