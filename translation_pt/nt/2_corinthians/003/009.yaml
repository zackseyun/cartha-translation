reference: 2 Corinthians 3:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ γὰρ ⸂τῇ διακονίᾳ⸃ τῆς κατακρίσεως δόξα, πολλῷ μᾶλλον περισσεύει ἡ διακονία τῆς ⸀δικαιοσύνης δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/009.yaml
  text: For if the ministry of condemnation came with glory[a], much more does the ministry of righteousness abound in glory.
translation:
  language: pt
  text: Pois, se o ministério da condenação veio com glória, muito mais o ministério da justiça[a] transborda em glória.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονία
  choice: ministério
  rationale: No contexto, Paulo contrasta dois serviços ou administrações ligados às alianças; “ministério” preserva essa dimensão melhor que o termo mais genérico “serviço”.
- source_word: κατάκρισις
  choice: condenação
  rationale: Mantém o sentido forense do substantivo e o contraste paulino com δικαιοσύνη.
- source_word: δόξα
  choice: glória
  rationale: É a correspondência natural e tradicional em português, além de manter a continuidade do argumento sobre a glória superior.
- source_word: πολλῷ μᾶλλον
  choice: muito mais
  rationale: Expressa de modo natural a forte intensificação comparativa do grego.
- source_word: περισσεύω
  choice: transborda
  rationale: Comunica abundância excedente e combina naturalmente com “em glória”, sem reduzir o verbo a uma simples comparação.
- source_word: δικαιοσύνη
  choice: justiça
  rationale: “Justiça” é a tradução portuguesa ampla e natural de δικαιοσύνη, podendo abranger aqui tanto a condição de retidão quanto a ação justificadora; a possível nuance de “justificação” é preservada em nota.
- source_word: εἰ γὰρ τῇ διακονίᾳ ... δόξα
  choice: Pois, se ... veio com glória
  rationale: A oração grega não tem verbo expresso. “Veio com glória” supre idiomaticamente a cópula e preserva a assimetria entre a glória que acompanhou o primeiro ministério e a glória transbordante do segundo.
theological_decisions:
- issue: Sentido de δικαιοσύνη no contraste entre os dois ministérios
  choice: justiça
  alternative: justificação
  rationale: “Justiça” conserva a amplitude semântica do grego e evita decidir de forma indevida entre qualidade, status justo e ação divina de justificar. “Justificação” explicita uma nuance forense plausível, por isso consta na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o encadeamento argumentativo de Paulo e a repetição de “ministério” e “glória”.
