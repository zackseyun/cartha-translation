id: 2CO.3.16
reference: 2 Corinthians 3:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡνίκα ⸂δὲ ἐὰν⸃ ἐπιστρέψῃ πρὸς κύριον, περιαιρεῖται τὸ κάλυμμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/016.yaml
  text: But whenever one turns to the Lord[b][a], the veil is removed.
translation:
  language: pt
  text: Mas, sempre que alguém se volta para o Senhor[a], o véu é retirado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando alguém se volta para o Senhor”.'
    reason: Alternativa que representa o valor temporal sem destacar tão fortemente a ideia de repetição ou ocorrência indefinida.
  - marker: b
    text: 'Ou: “é tirado”.'
    reason: Alternativa lexical natural para o verbo passivo περιαιρεῖται.
lexical_decisions:
- source_word: ἡνίκα δὲ ἐὰν
  choice: Mas, sempre que
  rationale: “Sempre que” expressa com naturalidade o valor temporal indefinido da construção com subjuntivo; “mas” preserva a conexão contrastiva de δέ com o contexto anterior.
- source_word: ἐπιστρέψῃ
  choice: se volta
  rationale: Mantém a imagem de mudança de direção sem restringi-la de antemão a uma formulação técnica como “se converte” ou “se arrepende”.
- source_word: πρὸς κύριον
  choice: para o Senhor
  rationale: Expressa a direção para uma pessoa indicada por πρός com acusativo. “Senhor” preserva o título κύριος sem identificar explicitamente seu referente além do que o versículo afirma.
- source_word: περιαιρεῖται
  choice: é retirado
  rationale: Reproduz o presente passivo e não acrescenta um agente não expresso no grego.
- source_word: τὸ κάλυμμα
  choice: o véu
  rationale: “Véu” é a tradução contextual precisa por causa da imagem de Moisés desenvolvida na passagem.
theological_decisions:
- issue: Sujeito não expresso de ἐπιστρέψῃ
  choice: alguém
  alternative: ele; a pessoa
  rationale: O grego não traz um substantivo como sujeito. “Alguém” torna a frase natural em português e conserva o sentido geral e indefinido, sem decidir se Paulo enfatiza um indivíduo específico ou um referente coletivo do contexto.
- issue: Identidade do “Senhor”
  choice: o Senhor
  alternative: Cristo; o Senhor, isto é, o Espírito
  rationale: O versículo diz apenas κύριον. A tradução mantém a tensão interpretativa do contexto e não especifica uma identificação que o próprio enunciado não explicita.
- issue: Agente da remoção do véu
  choice: 'voz passiva sem agente: “é retirado”'
  alternative: o Senhor retira o véu
  rationale: O grego emprega a voz passiva e não nomeia o agente; explicitá-lo resolveria além do texto uma questão deixada implícita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Se volta para” conserva a metáfora direcional e soa mais corrente do que “se volta ao”; “véu” mantém a ligação imediata com a imagem de Moisés no contexto.
