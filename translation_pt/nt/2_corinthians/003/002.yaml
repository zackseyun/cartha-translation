  text: ἡ ἐπιστολὴ ἡμῶν ὑμεῖς ἐστε, ἐγγεγραμμένη ἐν ταῖς καρδίαις ἡμῶν, γινωσκομένη καὶ ἀναγινωσκομένη ὑπὸ πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/002.yaml
  text: You are our letter[a], written in our hearts, known and read by all people.
translation:
  language: pt
  text: Vocês são a nossa carta, escrita em nossos corações, conhecida e lida por todos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἐπιστολὴ ἡμῶν
  choice: a nossa carta
  rationale: “Carta” é o equivalente moderno e claro de ἐπιστολή; o genitivo ἡμῶν expressa a relação metafórica da carta com Paulo e seus cooperadores.
- source_word: ὑμεῖς ἐστε
  choice: Vocês são
  rationale: A construção predicativa é direta. “Vocês” é natural e amplamente compreensível no português moderno, preservando a referência plural.
- source_word: ἐγγεγραμμένη
  choice: escrita
  rationale: O particípio perfeito passivo indica algo que permanece escrito. “Escrita” conserva com naturalidade a metáfora da carta.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: em nosso coração
  rationale: A preposição ἐν favorece “em”. Embora o grego tenha o plural “corações”, o singular distributivo “nosso coração” é idiomático em português e mantém a ideia de interioridade compartilhada.
- source_word: γινωσκομένη
  choice: conhecida
  rationale: O verbo pode significar “conhecida” ou “reconhecida”. “Conhecida” forma um par claro com “lida” sem eliminar a alternativa lexical.
- source_word: ἀναγινωσκομένη
  choice: lida
  rationale: A tradução direta preserva o jogo metafórico com a carta.
- source_word: ὑπὸ πάντων ἀνθρώπων
  choice: por todos
  rationale: A expressão grega tem sentido humano genérico e universal. “Por todos” é inclusivo, natural e não sugere referência apenas a homens.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A metáfora da carta foi mantida de modo direto; evitou-se o termo tradicional e menos corrente “epístola”.
