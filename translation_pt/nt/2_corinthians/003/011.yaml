  text: εἰ γὰρ τὸ καταργούμενον διὰ δόξης, πολλῷ μᾶλλον τὸ μένον ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/011.yaml
  text: For if what was being brought to an end came with glory[c][b][a], much more what remains is in glory.
translation:
  language: pt
  text: Pois, se aquilo que estava sendo levado ao fim[a] veio com glória[b], muito mais aquilo que permanece[c] está em glória.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aquilo que estava sendo posto de lado” ou “aquilo que estava sendo abolido”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “por meio de glória”.
    reason: lexical_alternative
  - marker: c
    text: Ou “aquilo que perdura” ou “aquilo que continua”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταργούμενον
  choice: aquilo que estava sendo levado ao fim
  rationale: O particípio presente passivo indica algo em processo de ser tornado inoperante ou levado ao fim. A formulação evita a interpretação contextual mais específica de “desvanecer” e preserva o caráter processual do grego.
- source_word: διὰ δόξης
  choice: veio com glória
  rationale: Embora διά com genitivo seja literalmente “por meio de”, neste contexto a expressão indica que aquilo que era transitório veio acompanhado de glória; “veio com glória” é natural em português.
- source_word: μένον
  choice: aquilo que permanece
  rationale: Preserva o particípio substantivado neutro e o contraste entre o que chega ao fim e o que continua.
- source_word: ἐν δόξῃ
  choice: está em glória
  rationale: Mantém de modo direto a preposição ἐν e o contraste retórico com διὰ δόξης, sem reduzir a expressão a apenas “é glorioso”.
- source_word: πολλῷ μᾶλλον
  choice: muito mais
  rationale: É a expressão comparativa idiomática em português e corresponde ao intensificador grego.
theological_decisions:
- issue: Natureza do contraste entre o que é transitório e o que permanece
  choice: Manter as referências indiretas “aquilo que estava sendo levado ao fim” e “aquilo que permanece”.
  alternative: Identificar explicitamente nesta frase a antiga e a nova aliança, ou seus respectivos ministérios.
  rationale: O grego emprega particípios substantivados neutros e não nomeia diretamente as alianças neste versículo. A tradução conserva a formulação e a tensão retórica de Paulo, deixando a identificação explícita a cargo do contexto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura paralela do grego foi preservada, e as notas registram alternativas lexicais genuínas sem acrescentar identificação doutrinária ausente do versículo.
