reference: 2 Corinthians 3:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐ δεδόξασται τὸ δεδοξασμένον ἐν τούτῳ τῷ μέρει ⸀εἵνεκεν τῆς ὑπερβαλλούσης δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/010.yaml
  text: For indeed[a], what had been glorified has not been glorified in this respect, because of the glory that surpasses it.
translation:
  language: pt
  text: Pois, de fato, aquilo que foi glorificado não foi glorificado nesse aspecto, por causa da glória que o supera.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Pois, de fato
  rationale: “Pois” preserva a ligação explicativa de γάρ, e “de fato” comunica o reforço de καί de maneira natural em português.
- source_word: οὐ δεδόξασται
  choice: ficou sem glória
  rationale: Embora a forma grega seja um perfeito passivo, uma reprodução mecânica como “não foi glorificado” seria contraditória e pouco clara em português. “Ficou sem glória” conserva a negação comparativa e o efeito paradoxal no contexto.
- source_word: τὸ δεδοξασμένον
  choice: aquilo que havia sido glorificado
  rationale: A expressão substantiva preserva o particípio perfeito passivo sem acrescentar explicitamente “ministério” ou “aliança”, referentes inferidos do contexto.
- source_word: ἐν τούτῳ τῷ μέρει
  choice: nesse aspecto
  rationale: 'A locução delimita a afirmação: a glória anterior não é negada em absoluto, mas relativizada dentro desta comparação.'
- source_word: εἵνεκεν
  choice: por causa de
  rationale: Expressa com clareza e naturalidade a relação causal.
- source_word: τῆς ὑπερβαλλούσης δόξης
  choice: da glória que o supera
  rationale: A construção verbal mantém a força comparativa do particípio ὑπερβαλλούσης. O pronome “o” explicita em português o termo superado, implícito no grego e evidente no contexto.
- source_word: δόξα / δεδοξασμένον
  choice: glorificado ... glória
  rationale: Mantém visível o jogo retórico baseado na mesma família lexical grega, ainda que “ficou sem glória” seja usado para tornar inteligível a negação.
theological_decisions:
- issue: Se Paulo nega absolutamente a glória do ministério anterior ou faz uma negação comparativa
  choice: Negação comparativa, limitada pela expressão “nesse aspecto”
  alternative: Negação absoluta de que o ministério anterior tivesse qualquer glória real
  rationale: O contexto imediato afirma que o ministério anterior veio com glória; aqui, essa glória é tratada como se não fosse glória quando comparada com a glória que a supera.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação evita explicitar “antiga aliança” ou “ministério”, preservando a forma não especificada do grego. A aparente tensão entre ter sido glorificado e ficar sem glória é mantida, mas expressa de modo natural.
