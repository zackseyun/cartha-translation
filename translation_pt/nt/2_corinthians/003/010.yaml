- from: Pois, de fato, aquilo que havia sido glorificado ficou sem glória nesse aspecto, por causa da glória que o supera.[a]
  to: Pois, de fato, aquilo que foi glorificado não foi glorificado nesse aspecto, por causa da glória que o supera.
