review_pass:
  verdict: revise
  source_fidelity: A redação preserva a comparação e a relação causal, mas «ficou sem glória» altera o perfeito passivo de οὐ δεδόξασται e enfraquece o paralelismo verbal com τὸ δεδοξασμένον. O grego afirma paradoxalmente que «não foi/tem sido glorificado» aquilo que havia sido glorificado, no âmbito comparativo indicado; não descreve propriamente uma perda de glória.
  naturalness: «Pois, de fato» e «nesse aspecto» são naturais em português moderno. «Não foi glorificado» é levemente paradoxal, mas é intencional no texto paulino e permanece compreensível com a delimitação comparativa. «Aquilo que foi glorificado» evita a sequência temporal artificial sugerida por «havia sido».
  terminology: '«Glorificado ... glória» mantém adequadamente a repetição da família δοξ-. «A glória que o supera» introduz corretamente, de modo explícito e contextual, o referente comparado. A nota proposta não é necessária: «incomparavelmente maior» intensifica interpretativamente o particípio e não constitui uma alternativa estritamente equivalente.'
  issues:
  - severity: medium
    issue: «ficou sem glória» para οὐ δεδόξασται
    rationale: A formulação troca a negação do verbo passivo «ser glorificado» por um estado resultante de privação («ficar sem glória»). Embora procure esclarecer a comparação, deixa de reproduzir o paralelismo retórico entre δεδόξασται e δεδοξασμένον.
  - severity: low
    issue: «havia sido glorificado» para τὸ δεδοξασμένον
    rationale: O mais-que-perfeito é possível por inferência contextual, mas o particípio perfeito não exige essa anterioridade marcada. «Foi glorificado» preserva melhor o aspecto e o vínculo verbal sem carregar a sequência temporal.
  - severity: low
    issue: Nota alternativa com «incomparavelmente maior»
    rationale: Ὑπερβάλλουσα exprime excelência/superação, mas «incomparavelmente» acrescenta uma intensificação que o texto não explicita. Como a tradução principal já comunica o sentido, a nota pode ser omitida.
  revised_text: Pois, de fato, aquilo que foi glorificado não foi glorificado nesse aspecto, por causa da glória que o supera.
