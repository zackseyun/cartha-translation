  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ διακονία τοῦ θανάτου ἐν ⸀γράμμασιν ⸀ἐντετυπωμένη λίθοις ἐγενήθη ἐν δόξῃ, ὥστε μὴ δύνασθαι ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ πρόσωπον Μωϋσέως διὰ τὴν δόξαν τοῦ προσώπου αὐτοῦ τὴν καταργουμένην,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/007.yaml
  text: But if the ministry of death[a], engraved in letters on stones, came with glory, so that the sons of Israel were not able to gaze at Moses’ face because of the glory of his face, which was fading away[b],
translation:
  language: pt
  text: Mas, se o ministério da morte, gravado em letras sobre pedras, veio com glória, a ponto de os filhos de Israel[a] não poderem fixar os olhos no rosto de Moisés por causa da glória do rosto dele, glória que estava desaparecendo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. A expressão “os filhos de Israel” reflete mais de perto o grego.
    reason: lexical_alternative
  - marker: b
    text: Ou “que estava sendo levada ao fim” ou “que estava passando”.
    reason: alternative_reading
lexical_decisions:
- source_word: διακονία
  choice: ministério
  rationale: Preserva tanto a ideia de serviço quanto a de uma função confiada, adequando-se ao contraste de Paulo entre as duas alianças.
- source_word: τοῦ θανάτου
  choice: da morte
  rationale: Mantém de modo compacto o genitivo grego e a expressão incisiva de Paulo, sem explicá-la como “que traz a morte” ou “que resulta em morte”.
- source_word: ἐν γράμμασιν ἐντετυπωμένη λίθοις
  choice: gravado com letras em pedras
  rationale: Comunica a inscrição gravada e conserva o plural literal “pedras”, sem introduzir explicitamente “tábuas”, embora o contexto as pressuponha.
- source_word: ἐγενήθη ἐν δόξῃ
  choice: veio com glória
  rationale: Expressão natural em português que preserva o caráter acontecimental de ἐγενήθη e a glória que acompanhou esse ministério.
- source_word: ὥστε μὴ δύνασθαι ἀτενίσαι
  choice: a ponto de ... não poderem fixar os olhos
  rationale: Preserva a relação de resultado e a ideia de olhar de maneira fixa ou atenta.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: os filhos de Israel
  rationale: Reflete de perto a expressão masculina concreta do grego; a forma mais corrente “os israelitas” é registrada em nota.
- source_word: εἰς τὸ πρόσωπον Μωϋσέως
  choice: no rosto de Moisés
  rationale: É idiomático em português depois de “fixar os olhos” e mantém o foco concreto no rosto de Moisés.
- source_word: καταργουμένην
  choice: estava desaparecendo
  rationale: No contexto imediato da glória visível no rosto de Moisés, exprime naturalmente sua perda progressiva, sem ocultar em nota os sentidos mais abstratos possíveis.
theological_decisions:
- issue: Se καταργουμένην descreve a diminuição visível da glória ou, em sentido mais abstrato, algo que estava sendo levado ao fim.
  choice: glória que estava desaparecendo
  alternative: glória que estava sendo levada ao fim; glória que estava passando
  rationale: O antecedente imediato é a glória do rosto de Moisés, favorecendo uma descrição perceptível de seu desaparecimento. A nota preserva as alternativas e a tensão com o argumento mais amplo de Paulo sobre a transitoriedade da antiga aliança.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. Conserva-se a frase incompleta no fim do versículo, pois o período continua no contexto. Os marcadores foram posicionados junto às expressões a que suas notas realmente se referem.
