reference: 2 Corinthians 3:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐ καθάπερ Μωϋσῆς ἐτίθει κάλυμμα ἐπὶ τὸ πρόσωπον ⸀αὐτοῦ, πρὸς τὸ μὴ ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ τέλος τοῦ καταργουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/013.yaml
  text: and not like Moses[b][a], who used to put a veil over his face so that the sons of Israel would not gaze at the end of what was fading away.
translation:
  language: pt
  text: e não como Moisés, que costumava pôr um véu sobre o rosto, para que os filhos de Israel[b] não fixassem os olhos no fim daquilo que estava desaparecendo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na meta/no resultado daquilo que estava sendo levado ao fim”.'
    reason: alternative_reading
  - marker: b
    text: Em grego, “filhos de Israel”; em linguagem idiomática, “israelitas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: como
  rationale: Introduz a comparação com a afirmação anterior de maneira concisa e natural, preservando a força comparativa.
- source_word: ἐτίθει
  choice: costumava pôr
  rationale: O imperfeito sugere uma ação habitual ou repetida no episódio de Moisés; esta formulação comunica esse aspecto com clareza.
- source_word: κάλυμμα
  choice: véu
  rationale: É o termo preciso e consagrado para a cobertura do rosto neste contexto e também sustenta a metáfora desenvolvida por Paulo.
- source_word: πρόσωπον αὐτοῦ
  choice: o rosto
  rationale: Expressa o sentido simples e direto da frase grega; o possessivo fica naturalmente implícito em português após a menção de Moisés.
- source_word: πρὸς τὸ μὴ ἀτενίσαι
  choice: para que ... não fixassem os olhos
  rationale: Preserva tanto a ideia de propósito da construção quanto o sentido de olhar fixamente presente em ἀτενίζω.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: os filhos de Israel
  rationale: Mantém a forma explícita e o idioma bíblico do grego; a alternativa idiomática moderna é registrada em nota.
- source_word: εἰς τὸ τέλος
  choice: no fim
  rationale: τέλος pode indicar fim, meta ou resultado. Aqui, em associação com καταργουμένου e com o contraste contextual entre o transitório e o permanente, “fim” expressa adequadamente a terminação sem ocultar as alternativas.
- source_word: τοῦ καταργουμένου
  choice: daquilo que estava desaparecendo
  rationale: No contexto da glória transitória, a expressão comunica de modo natural algo que perdia sua eficácia ou passava, sem impor a noção mais forte de abolição.
theological_decisions:
- issue: Sentido de τέλος τοῦ καταργουμένου
  choice: o fim daquilo que estava desaparecendo
  alternative: a meta ou o resultado daquilo que estava sendo levado ao fim
  rationale: O contexto imediato contrasta o que é transitório com o que permanece. A tradução principal favorece a ideia de terminação, mas a nota conserva a ambiguidade real de τέλος e a possível força passiva de καταργουμένου.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a construção ligada ao versículo anterior, o aspecto habitual do imperfeito e a tensão semântica da frase final.
