base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/011.yaml
  text: Our mouth has been opened to you[a], Corinthians[b]; our heart has been widened.
translation:
  language: pt
  text: Nossa boca se abriu para vocês, coríntios; nosso coração se alargou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “Falamos abertamente com vocês; nosso coração está aberto.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: στόμα
  choice: boca
  rationale: Preserva a metáfora corporal e seu paralelismo retórico com «coração», sem substituir a imagem por uma explicação.
- source_word: ἀνέῳγεν
  choice: está aberta
  rationale: O perfeito expressa um estado presente resultante de uma ação anterior. Em português, «está aberta» comunica esse estado com mais naturalidade do que «foi aberta», preservando a metáfora.
- source_word: πρὸς ὑμᾶς
  choice: para vocês
  rationale: Expressa naturalmente a fala dirigida aos destinatários e oferece ampla compreensão no português moderno, especialmente no Brasil.
- source_word: Κορίνθιοι
  choice: coríntios
  rationale: Mantém o vocativo direto e o apelo pessoal de Paulo.
- source_word: καρδία
  choice: coração
  rationale: É a correspondência natural para o centro dos afetos e da disposição interior, além de conservar o paralelismo corporal com «boca».
- source_word: πεπλάτυνται
  choice: se alargou
  rationale: 'Reproduz diretamente a imagem de πλατύνω e mantém a força resultativa do perfeito: o coração foi ampliado e permanece aberto em afeição.'
theological_decisions:
- issue: Linguagem metafórica da franqueza e da afeição de Paulo
  choice: Conservar no texto as imagens corporais «boca está aberta» e «coração se alargou».
  alternative: «Falamos abertamente com vocês, coríntios; nosso coração está inteiramente aberto.»
  rationale: A formulação literal preserva a retórica e a tensão expressiva do grego sem transformar a metáfora em interpretação. A nota oferece a equivalência idiomática necessária.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. «Vocês» evita a marca regional de «vós». A construção metafórica foi mantida, mas «está aberta» foi preferida a uma passiva rígida. O marcador [a] reúne as alternativas idiomáticas relativas às duas imagens.
