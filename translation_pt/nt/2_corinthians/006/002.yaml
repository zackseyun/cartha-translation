  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει γάρ· Καιρῷ δεκτῷ ἐπήκουσά σου καὶ ἐν ἡμέρᾳ σωτηρίας ἐβοήθησά σοι· ἰδοὺ νῦν καιρὸς εὐπρόσδεκτος, ἰδοὺ νῦν ἡμέρα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/002.yaml
  text: For he says[a], “At an acceptable time I listened to you, and in a day of salvation I helped you.” Behold, now is the acceptable time; behold[b], now is the day of salvation.
translation:
  language: pt
  text: 'Pois ele diz: “Em tempo favorável, eu te ouvi[a] e, em dia de salvação, eu te ajudei”. Eis que agora é o tempo favorável; eis que agora é o dia da salvação.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eu te ouvi favoravelmente” ou “eu te respondi”. O verbo pode indicar não apenas ouvir, mas acolher o pedido e agir em resposta.
    reason: lexical_alternative
  - marker: b
    text: 'Como o grego não usa artigo nessas expressões, também se pode traduzir: “agora é um tempo favorável; agora é um dia de salvação”, ou, mais literalmente, “agora é tempo favorável; agora é dia de salvação”.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει γάρ
  choice: Pois ele diz
  rationale: γάρ introduz a explicação que fundamenta a exortação anterior, e λέγει apresenta a citação como fala viva de Deus. A formulação pessoal preserva essa textura melhor do que “pois está escrito”.
- source_word: Καιρῷ δεκτῷ
  choice: Em tempo favorável
  rationale: καιρός indica uma ocasião apropriada, e δεκτός, algo acolhido ou favorável. “Tempo favorável” é natural em português e evita o sentido moderno de mera tolerabilidade que “tempo aceitável” poderia sugerir.
- source_word: ἐπήκουσά σου
  choice: eu te ouvi
  rationale: ἐπακούω significa ouvir, frequentemente com a ideia contextual de acolher ou responder ao pedido. “Te ouvi” mantém essa amplitude sem tornar explícito demais “te respondi”.
- source_word: ἐν ἡμέρᾳ σωτηρίας
  choice: em dia de salvação
  rationale: A expressão grega não tem artigo. A construção portuguesa sem artigo conserva essa forma e permanece compreensível no estilo elevado da citação.
- source_word: ἐβοήθησά σοι
  choice: eu te ajudei
  rationale: βοηθέω significa ajudar ou vir em auxílio. “Te ajudei” é direto, atual e fiel.
- source_word: ἰδοὺ
  choice: Eis que
  rationale: ἰδού chama enfaticamente a atenção. “Eis que” preserva a solenidade e a força retórica sem soar coloquial.
- source_word: καιρὸς εὐπρόσδεκτος
  choice: o tempo favorável
  rationale: εὐπρόσδεκτος descreve aquilo que é bem acolhido ou favorável. Em português, “o tempo favorável” identifica naturalmente a ocasião presente anunciada por Paulo e mantém o vínculo lexical com δεκτός.
- source_word: ἡμέρα σωτηρίας
  choice: o dia da salvação
  rationale: A forma definida é idiomática em português quando o predicativo identifica o momento presente como a ocasião salvadora, embora o grego não traga artigo; a alternativa mais formalmente anartrosa é registrada em nota.
theological_decisions:
- issue: Definitude nas declarações finais sobre o tempo favorável e o dia da salvação
  choice: Usar “o tempo favorável” e “o dia da salvação” no texto principal.
  alternative: “um tempo favorável” e “um dia de salvação”, ou as construções sem artigo “tempo favorável” e “dia de salvação”.
  rationale: O grego é anartro, mas isso não exige indefinição. A identificação predicativa com νῦν torna a forma definida natural em português. A nota preserva a ambiguidade e evita transformar a escolha idiomática em afirmação de um esquema escatológico exclusivo.
- issue: Sujeito de λέγει na introdução da citação
  choice: Traduzir pessoalmente como “ele diz”.
  alternative: “a Escritura diz” ou “está escrito”.
  rationale: A citação apresenta Deus como aquele que fala em primeira pessoa. “Ele diz” conserva essa dimensão sem acrescentar uma identificação que não está expressa no versículo.
- issue: Grau de resposta implícito em ἐπήκουσά σου
  choice: Traduzir como “eu te ouvi”.
  alternative: “eu te respondi” ou “eu te ouvi favoravelmente”.
  rationale: O verbo pode implicar acolhimento e resposta, mas “respondi” explicitaria uma consequência que o termo não exige em todos os contextos. A nota mantém disponível a nuance responsiva.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O uso de “te” evita a repetição pesada de “você” e é amplamente inteligível. “Eis que” mantém o tom enfático da citação e da aplicação apostólica; a pontuação distingue com clareza a fala citada da declaração de Paulo.
