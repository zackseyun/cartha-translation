  yaml_path: translation/nt/2_corinthians/006/003.yaml
  text: giving no cause for stumbling in anything[a], so that the ministry may not be blamed[b],
translation:
  language: pt
  text: Não damos, em nada, motivo de tropeço[a], para que o ministério não seja censurado[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “motivo de ofensa”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para que o serviço não caia em descrédito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεμίαν ... προσκοπήν
  choice: motivo de tropeço
  rationale: A expressão comunica uma ocasião ou causa de tropeço, preservando a imagem do grego e mantendo como alternativa a ideia de ofensa.
- source_word: ἐν μηδενί
  choice: em nada
  rationale: 'Expressa de modo natural e abrangente a esfera ou circunstância: em nenhum aspecto.'
- source_word: διδόντες
  choice: Não damos
  rationale: O particípio depende do contexto anterior; a forma verbal corrente em português conserva o sentido literal de 'dar' e produz uma frase clara.
- source_word: ἵνα μὴ
  choice: para que ... não
  rationale: Preserva a força de finalidade, sem excluir a nuance de resultado possível no contexto.
- source_word: μωμηθῇ
  choice: seja censurado
  rationale: O passivo significa ser alvo de censura ou reprovação. 'Seja censurado' é direto, digno e natural em português.
- source_word: ἡ διακονία
  choice: o ministério
  rationale: No contexto, refere-se ao serviço apostólico de Paulo e seus cooperadores; 'ministério' comunica esse sentido sem pressupor uma estrutura eclesiástica posterior.
theological_decisions:
- issue: Sentido de διακονία na autodescrição de Paulo
  choice: o ministério
  alternative: o serviço
  rationale: O contexto trata da conduta de Paulo e seus cooperadores no cumprimento da missão recebida. 'Ministério' exprime esse serviço apostólico, enquanto a nota preserva a possibilidade lexical mais ampla de 'serviço'.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem 'em nada' conserva a abrangência enfática do grego; as notas registram alternativas lexicais genuínas sem resolver além do necessário a amplitude de προσκοπή e διακονία.
