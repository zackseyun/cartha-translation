  text: ὡς λυπούμενοι ἀεὶ δὲ χαίροντες, ὡς πτωχοὶ πολλοὺς δὲ πλουτίζοντες, ὡς μηδὲν ἔχοντες καὶ πάντα κατέχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/010.yaml
  text: as sorrowful[a], yet always rejoicing; as poor, yet making many rich; as having nothing[b], and yet possessing everything.
translation:
  language: pt
  text: como entristecidos, mas sempre alegres; como pobres, mas enriquecendo a muitos[a]; como os que nada têm e possuem tudo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornando muitos ricos”. No contexto, essa riqueza provavelmente não é material, mas espiritual.'
    reason: lexical_alternative
  - marker: b
    text: Embora exteriormente pareçam nada ter, Paulo declara que possuem tudo; o texto grego não explicita aqui a natureza dessa posse.
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: como
  rationale: Mantém a moldura comparativa repetida que estrutura os três paradoxos, sem decidir se ela descreve aparência, avaliação alheia ou condição percebida.
- source_word: λυπούμενοι
  choice: entristecidos
  rationale: Expressa de modo conciso o estado de tristeza e permite a nuance passiva ou média do particípio sem especificar sua causa.
- source_word: ἀεὶ δὲ χαίροντες
  choice: mas sempre alegres
  rationale: Conserva o contraste contínuo entre tristeza e alegria em português natural. Embora χαίροντες seja particípio verbal, “alegres” evita a possível leitura reflexiva de “nos alegrando”.
- source_word: πτωχοὶ
  choice: pobres
  rationale: É o equivalente direto e não intensifica indevidamente a expressão para “miseráveis” ou “indigentes”.
- source_word: πολλοὺς δὲ πλουτίζοντες
  choice: mas enriquecendo a muitos
  rationale: Preserva o sentido verbal de tornar ricos e a concisão do original, sem definir no texto principal a natureza dessa riqueza.
- source_word: ὡς μηδὲν ἔχοντες
  choice: como quem nada tem
  rationale: Reproduz a comparação em português corrente, evitando a construção menos natural “como nada tendo”.
- source_word: καὶ πάντα κατέχοντες
  choice: mas possui tudo
  rationale: κατέχω pode significar possuir, reter ou conservar. “Possui” forma um paradoxo claro com “nada tem”; “mas” explicita o contraste que, no último par, o grego liga com καί.
theological_decisions:
- issue: Natureza da riqueza e da posse nos paradoxos de Paulo
  choice: Manter no texto principal as afirmações abrangentes “enriquecendo a muitos” e “possui tudo”, sem acrescentar “espiritualmente” ou “em Cristo”.
  alternative: Explicitar que se trata de riqueza espiritual e de posse de todas as coisas em união com Cristo.
  rationale: O contexto paulino favorece uma dimensão espiritual, mas o grego não contém esse qualificativo. A formulação direta preserva a tensão entre privação exterior e riqueza mais profunda.
- issue: Força de ὡς nos três contrastes
  choice: Traduzir uniformemente por “como”, preservando a comparação sem reduzi-la a mera aparência.
  alternative: Usar “como se estivéssemos” ou “considerados como”, tornando explícita uma leitura de aparência ou avaliação alheia.
  rationale: A construção pode envolver como os apóstolos parecem ou são considerados, mas também apresenta suas condições paradoxais. “Como” conserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “como” e os três pares contrastantes preservam o ritmo retórico do grego. A construção “como quem nada tem” prioriza naturalidade sem perder o sentido participial.
