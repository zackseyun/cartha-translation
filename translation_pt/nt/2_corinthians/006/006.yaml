id: 2CO.6.6
reference: 2 Corinthians 6:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν ἁγνότητι, ἐν γνώσει, ἐν μακροθυμίᾳ, ἐν χρηστότητι, ἐν πνεύματι ἁγίῳ, ἐν ἀγάπῃ ἀνυποκρίτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/006.yaml
  text: in purity[a], in knowledge, in patience, in kindness, in the Holy Spirit, in sincere love,
translation:
  language: pt
  text: em pureza, em conhecimento, em paciência, em bondade, no Espírito Santo,[a] em amor sincero,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em espírito santo”, se a expressão descreve uma disposição santa em vez de se referir ao Espírito Santo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγνότητι
  choice: pureza
  rationale: ἁγνότης indica pureza ou integridade moral em sentido amplo. “Pureza” é natural em português e não restringe o termo à castidade sexual.
- source_word: γνώσει
  choice: conhecimento
  rationale: γνῶσις aqui abrange conhecimento, possivelmente com dimensão prática e espiritual no ministério; “conhecimento” mantém essa amplitude.
- source_word: μακροθυμίᾳ
  choice: paciência
  rationale: μακροθυμία expressa perseverança paciente diante de pessoas ou dificuldades. “Paciência” é a forma moderna mais clara e abrangente.
- source_word: χρηστότητι
  choice: bondade
  rationale: χρηστότης denota bondade benevolente, amabilidade ou disposição graciosa. “Bondade” é corrente e digna, preservando a qualidade relacional.
- source_word: πνεύματι ἁγίῳ
  choice: Espírito Santo
  rationale: No uso paulino, a expressão sem artigo pode referir-se ao Espírito divino. A maiúscula explicita a leitura principal, enquanto a nota preserva a possibilidade de uma disposição humana santa.
- source_word: ἀγάπῃ ἀνυποκρίτῳ
  choice: amor sincero
  rationale: ἀγάπη é vertido por “amor”, e ἀνυπόκριτος significa sem hipocrisia ou fingimento. “Amor sincero” é idiomático e preserva o sentido.
- source_word: ἐν
  choice: em/no
  rationale: A repetição de ἐν marca esfera, meio ou modo. A tradução conserva a cadência com “em”, usando a contração natural “no” antes de “Espírito Santo”.
theological_decisions:
- issue: Referente de πνεύματι ἁγίῳ
  choice: O Espírito Santo, entendido como o Espírito divino
  alternative: um espírito santo, isto é, uma disposição humana santa
  rationale: O uso paulino favorece a referência ao Espírito divino, embora a ausência do artigo e a sequência de qualidades permitam entender a expressão como descrição de uma disposição santa. A leitura alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “em” preserva a estrutura retórica do grego; “no” é a contração portuguesa natural de “em” com o artigo implícito no nome pessoal “Espírito Santo”.
