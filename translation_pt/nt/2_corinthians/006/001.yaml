  text: Συνεργοῦντες δὲ καὶ παρακαλοῦμεν μὴ εἰς κενὸν τὴν χάριν τοῦ θεοῦ δέξασθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/001.yaml
  text: Working together with him[a], we also urge you not to receive the grace of God in vain.
translation:
  language: pt
  text: Como cooperadores, também exortamos vocês a não receberem em vão a graça de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνεργοῦντες
  choice: Como cooperadores de Deus
  rationale: O particípio descreve Paulo e seus colaboradores atuando em cooperação com alguém. O contexto de 5:18–20 aponta fortemente para Deus como o referente implícito. A formulação é natural em português, preserva a força verbal da cooperação e explicita contextualmente o complemento ausente no grego.
- source_word: δὲ
  choice: —
  rationale: Aqui funciona como conectivo leve de transição, sem contraste forte. Seu valor discursivo é absorvido pela fluidez da frase em português.
- source_word: καὶ
  choice: também
  rationale: 'Acrescenta a exortação à atuação descrita pelo particípio: além de cooperarem, eles também exortam.'
- source_word: παρακαλοῦμεν
  choice: exortamos
  rationale: Neste contexto, o verbo expressa um apelo pastoral sério. “Exortamos” conserva essa força e pertence ao registro bíblico corrente, sem ser obscuro.
- source_word: μὴ
  choice: não
  rationale: É a negação direta ligada ao infinitivo e se traduz naturalmente por “não”.
- source_word: εἰς κενὸν
  choice: em vão
  rationale: A expressão idiomática significa sem resultado, efeito ou propósito. “Em vão” é conciso, natural e retoricamente forte.
- source_word: τὴν χάριν
  choice: a graça
  rationale: “Graça” preserva o termo paulino teologicamente significativo para a ação e o favor gratuitos de Deus.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Reproduz de modo direto e natural o genitivo grego na expressão “a graça de Deus”.
- source_word: δέξασθαι
  choice: receberem
  rationale: “Receber” é a equivalência direta e adequada ao contexto teológico. O infinitivo pessoal explicita naturalmente que o sujeito é “vocês”.
- source_word: ὑμᾶς
  choice: vocês
  rationale: O pronome plural é sujeito semântico do infinitivo na construção acusativo mais infinitivo. “Vocês” oferece leitura moderna e amplamente compreensível.
theological_decisions:
- issue: Referente implícito de Συνεργοῦντες
  choice: “Como cooperadores de Deus”, entendendo Deus como o parceiro implícito
  alternative: “Como cooperadores” ou “Trabalhando juntos”, sem explicitar com quem Paulo e seus companheiros cooperam
  rationale: O grego não nomeia o parceiro, mas o contexto imediato destaca a iniciativa reconciliadora de Deus e o ministério confiado aos apóstolos (5:18–20). A tradução principal explicita a leitura contextual mais provável, enquanto a nota preserva a ambiguidade formal do original.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Vocês” evita regionalismo excessivo; “exortamos” mantém a seriedade pastoral. A nota registra a ambiguidade sintática genuína do grego.
