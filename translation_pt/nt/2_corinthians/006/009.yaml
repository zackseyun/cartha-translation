  text: ὡς ἀγνοούμενοι καὶ ἐπιγινωσκόμενοι, ὡς ἀποθνῄσκοντες καὶ ἰδοὺ ζῶμεν, ὡς παιδευόμενοι καὶ μὴ θανατούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/009.yaml
  text: as unknown and yet well known[a], as dying and behold, we live, as disciplined and not put to death[b],
translation:
  language: pt
  text: como desconhecidos, embora reconhecidos[a]; como quem está morrendo, mas eis que vivemos; como disciplinados, mas não levados à morte[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “plenamente conhecidos”; o verbo grego pode destacar reconhecimento efetivo ou pleno, não apenas notoriedade.
    reason: lexical_alternative
  - marker: b
    text: Ou “corrigidos” ou “instruídos”; o verbo grego pode indicar disciplina corretiva ou formação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: como
  rationale: Mantém a repetição retórica que introduz cada caracterização paradoxal.
- source_word: ἀγνοούμενοι
  choice: desconhecidos
  rationale: Expressa de modo conciso a condição de não serem conhecidos ou reconhecidos pelos outros.
- source_word: ἐπιγινωσκόμενοι
  choice: reconhecidos
  rationale: Preserva a ideia de reconhecimento efetivo e contrasta naturalmente com “desconhecidos”, sem reduzir o termo à fama pública.
- source_word: ἀποθνῄσκοντες
  choice: quem está morrendo
  rationale: Reproduz a condição contínua ou aparente de estar à beira da morte e evita confusão com θανατούμενοι no fim do versículo.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Conserva a força repentina de chamar a atenção em registro digno e corrente.
- source_word: ζῶμεν
  choice: vivemos
  rationale: Mantém o presente simples e o contraste incisivo com estar morrendo.
- source_word: παιδευόμενοι
  choice: disciplinados
  rationale: Abrange tanto disciplina corretiva quanto formação por meio de provação, sem impor uma interpretação punitiva específica.
- source_word: μὴ θανατούμενοι
  choice: não mortos
  rationale: Preserva o sentido passivo de não serem levados à morte, em formulação breve e natural no paralelo.
theological_decisions:
- issue: Sentido de παιδευόμενοι em relação ao sofrimento
  choice: disciplinados
  alternative: corrigidos; instruídos; castigados
  rationale: “Disciplinados” conserva a tensão entre correção e formação, sem afirmar que o sofrimento apostólico seja necessariamente punição divina.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo retórico preservado. “Eis que” mantém a súbita ênfase do original; os pontos e vírgulas tornam legível a sequência dentro do catálogo maior.
