  yaml_path: translation/nt/2_corinthians/006/005.yaml
  text: in beatings, in imprisonments, in riots, in labors, in sleepless nights, in fastings,
translation:
  language: pt
  text: em espancamentos, em prisões, em tumultos, em trabalhos árduos, em noites sem dormir, em jejuns,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληγαῖς
  choice: espancamentos
  rationale: No contexto das provações apostólicas, o plural indica agressões físicas ou surras sofridas, não feridas em sentido abstrato.
- source_word: φυλακαῖς
  choice: prisões
  rationale: Expressa encarceramentos, preservando a forma plural do grego.
- source_word: ἀκαταστασίαις
  choice: tumultos
  rationale: O termo pode indicar desordens, agitações ou tumultos; aqui, entre sofrimentos externos, “tumultos” é natural e preserva a amplitude contextual sem especificar necessariamente motins formais.
- source_word: κόποις
  choice: trabalhos árduos
  rationale: Comunica trabalho fatigante e penoso, força lexical que “trabalhos” sozinho poderia atenuar.
- source_word: ἀγρυπνίαις
  choice: noites sem dormir
  rationale: Neste catálogo de dificuldades, denota períodos de vigília ou privação de sono; a formulação é clara e natural.
- source_word: νηστείαις
  choice: jejuns
  rationale: Mantém o sentido lexical direto e também a possível tensão entre jejum voluntário e privação de alimento, sem explicá-la no corpo do versículo.
theological_decisions:
- issue: Natureza dos “jejuns” (νηστείαις)
  choice: jejuns
  alternative: fome / privações de alimento
  rationale: O grego normalmente designa jejuns, mas o contexto de sofrimentos permite discussão sobre privação involuntária. A tradução formal preserva a ambiguidade relevante sem impor uma interpretação.
- issue: Natureza das “noites sem dormir” (ἀγρυπνίαις)
  choice: noites sem dormir
  alternative: vigílias
  rationale: “Vigílias” poderia sugerir uma disciplina religiosa deliberada; “noites sem dormir” preserva melhor a possibilidade de privação causada pelas provações narradas.
translation_notes:
  register: Português moderno, claro e digno, com repetição de “em” para conservar o ritmo anafórico do grego. “Trabalhos árduos” explicita a fadiga inerente a κόποις; “tumultos” evita restringir ἀκαταστασίαις a motins tecnicamente definidos.
