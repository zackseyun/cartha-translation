id: 2CO.6.8
reference: 2 Corinthians 6:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ δόξης καὶ ἀτιμίας, διὰ δυσφημίας καὶ εὐφημίας· ὡς πλάνοι καὶ ἀληθεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/008.yaml
  text: through honor and dishonor[a], through slander and praise; regarded as deceivers and yet true[c][b],
translation:
  language: pt
  text: em meio à honra e à desonra[a], em meio à difamação e à boa fama[b]; considerados enganadores, embora verdadeiros[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em meio à glória e à desonra». A palavra grega traduzida como «honra» também pode significar «glória», mas aqui provavelmente se refere à honra pública.
    reason: lexical_alternative
  - marker: b
    text: Ou «em meio à má fama e à boa fama».
    reason: lexical_alternative
  - marker: c
    text: Literalmente, «como enganadores e verdadeiros». A expressão contrasta a maneira como Paulo e seus cooperadores são vistos com aquilo que de fato são.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ
  choice: em meio a
  rationale: Com os genitivos que nomeiam circunstâncias contrastantes, expressa o percurso ou o ambiente em que o ministério prossegue. A repetição preserva o paralelismo retórico do grego.
- source_word: δόξης
  choice: honra
  rationale: Em contraste com ἀτιμία, tem aqui sentido social e público; «honra» evita sugerir exclusivamente a glória divina.
- source_word: ἀτιμίας
  choice: desonra
  rationale: Forma um par antitético direto e conciso com «honra», preservando a dimensão social.
- source_word: δυσφημίας
  choice: difamação
  rationale: Designa fala hostil ou reputação desfavorável. «Difamação» comunica com clareza o ataque verbal, sem restringir o termo apenas à reputação.
- source_word: εὐφημίας
  choice: boa fama
  rationale: Como contraponto a δυσφημία, indica fala favorável ou boa reputação. «Boa fama» conserva melhor essa amplitude do que «elogio».
- source_word: ὡς
  choice: considerados
  rationale: 'Torna explícita, em português natural, a perspectiva implícita: Paulo e seus cooperadores são vistos dessa maneira, sem que a acusação seja afirmada como verdadeira.'
- source_word: πλάνοι
  choice: enganadores
  rationale: No contexto, refere-se à acusação de induzir outros ao erro; «enganadores» é claro e mantém o caráter da acusação.
- source_word: ἀληθεῖς
  choice: verdadeiros
  rationale: Mantém a forma adjetiva e o contraste conciso com «enganadores». Preserva alguma abertura entre os sentidos de verazes e autênticos.
theological_decisions:
- issue: Se deve ficar explícito que o último par contrasta a percepção pública com a realidade
  choice: «considerados enganadores, embora verdadeiros»
  alternative: «como enganadores e verdadeiros»
  rationale: A formulação explicita que «enganadores» é a avaliação feita por outros, enquanto «verdadeiros» descreve a realidade reivindicada, preservando a tensão retórica sem validar a acusação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Em meio a» apresenta os pares como circunstâncias atravessadas no ministério e evita o português pouco natural «através de honra». A repetição conserva a cadência do original; o ponto e vírgula marca a passagem das circunstâncias externas para o contraste entre percepção e realidade.
