- from: Não se ponham em jugo desigual com os descrentes.[a] Pois que parceria há entre a justiça[b] e a transgressão da lei? Ou que comunhão há entre a luz e as trevas?
  to: Não se ponham sob um jugo desigual com descrentes.[a] Pois que parceria há entre a retidão[b] e a iniquidade? Ou que comunhão há entre a luz e as trevas?
  rationale: A revisão conserva a metáfora e a indeterminação quanto ao tipo de vínculo proibido. Ajusta «transgressão da lei», que pode sugerir um ato isolado, para «iniquidade», correspondente mais natural ao substantivo abstrato ἀνομία no paralelismo. Também apresenta «retidão» no texto e «justiça» na nota, preservando ambas as possibilidades de δικαιοσύνη sem impor uma leitura doutrinária.
