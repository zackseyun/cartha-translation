  text: Μὴ γίνεσθε ἑτεροζυγοῦντες ἀπίστοις· τίς γὰρ μετοχὴ δικαιοσύνῃ καὶ ἀνομίᾳ, ⸂ἢ τίς⸃ κοινωνία φωτὶ πρὸς σκότος;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/014.yaml
  text: Do not become unequally yoked with unbelievers[b][a]. For what partnership has righteousness with lawlessness? Or what fellowship has light with darkness?
translation:
  language: pt
  text: Não se ponham sob um jugo desigual com descrentes.[a] Pois que parceria há entre a retidão[b] e a iniquidade? Ou que comunhão há entre a luz e as trevas?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “jugo desigual” evoca animais de espécies diferentes presos ao mesmo jugo; compare Deuteronômio 22:10.
    reason: cross_reference
  - marker: b
    text: Ou “justiça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: Não se ponham
  rationale: Expressa a proibição no presente e conserva a ideia dinâmica de entrar ou colocar-se nessa condição, de modo natural em português.
- source_word: ἑτεροζυγοῦντες
  choice: em jugo desigual
  rationale: Preserva a metáfora de animais incompatíveis presos ao mesmo jugo e corresponde a uma formulação conhecida, concisa e compreensível em português.
- source_word: ἀπίστοις
  choice: com os descrentes
  rationale: Designa aqui os que não creem; “descrentes” é corrente e se encaixa naturalmente na construção com a metáfora do jugo.
- source_word: μετοχὴ
  choice: parceria
  rationale: Comunica participação ou vínculo compartilhado e mantém distinção lexical em relação a κοινωνία na oração seguinte.
- source_word: δικαιοσύνῃ
  choice: justiça
  rationale: “Justiça” é uma tradução natural e semanticamente ampla de δικαιοσύνη em português; a alternativa “retidão” explicita melhor o caráter ético no contraste com ἀνομία e é preservada em nota.
- source_word: ἀνομίᾳ
  choice: transgressão da lei
  rationale: Torna transparente a força de ἀνομία como desprezo ou violação da lei, sem recorrer ao termo menos corrente “anomia”.
- source_word: κοινωνία
  choice: comunhão
  rationale: Preserva a ideia de participação e vínculo comum, além de soar natural no paralelismo retórico.
- source_word: φωτὶ πρὸς σκότος
  choice: entre a luz e as trevas
  rationale: Mantém o contraste metafórico e verte idiomaticamente a relação expressa por πρός; o plural “trevas” é a forma consagrada e natural em português.
theological_decisions:
- issue: Sentido de δικαιοσύνη no contraste paulino
  choice: justiça
  alternative: retidão
  rationale: O termo grego pode abranger justiça e retidão. “Justiça” preserva sua amplitude lexical, enquanto a nota registra “retidão”, que evidencia a dimensão moral sugerida pelo contraste com ἀνομία, sem resolver indevidamente a tensão.
- issue: Alcance da proibição do jugo desigual
  choice: Manter a metáfora sem especificar um tipo de associação
  alternative: Explicitar casamento, culto ou parceria comercial
  rationale: O versículo não delimita a aplicação a uma única relação. A tradução evita importar uma interpretação denominacional ou restringir a exortação além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora tradicional do jugo foi mantida, mas a sintaxe foi atualizada. “Transgressão da lei” evita o tecnicismo “anomia”; “trevas” conserva o uso bíblico natural em português.
