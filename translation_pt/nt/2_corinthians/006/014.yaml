  source_fidelity: A proibição e a metáfora do jugo são adequadamente preservadas, assim como o paralelismo das duas perguntas. Contudo, «transgressão da lei» tende a designar um ato específico, ao passo que ἀνομία é uma qualidade ou condição abstrata («iniquidade», «ausência de lei», «desprezo da lei»). Além disso, a opção principal «justiça» com nota «retidão» inverte sem necessidade a decisão lexical de manter a dimensão ética de δικαιοσύνη no texto principal e a alternativa mais ampla em nota.
  naturalness: «Não se ponham sob um jugo desigual com descrentes» é claro e natural em português contemporâneo. «Retidão» e «iniquidade» mantêm um registro bíblico digno, compreensível e apropriado ao paralelismo retórico do versículo.
  terminology: «Retidão» verte bem δικαιοσύνη no contraste ético com ἀνομία, sem excluir «justiça», preservada em nota. «Iniquidade» é uma expressão abstrata e idiomática para ἀνομία neste contexto e evita reduzir o termo a uma única infração. «Comunhão», «luz» e «trevas» são adequados.
