  text: τίς δὲ συμφώνησις ⸀Χριστοῦ πρὸς Βελιάρ, ἢ τίς μερὶς πιστῷ μετὰ ἀπίστου;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/015.yaml
  text: And what harmony is there between Messiah and Beliar? Or what share does a believer have with an unbeliever?[a]
translation:
  language: pt
  text: E que harmonia há entre o Messias e Beliar? Ou que parte tem quem crê com quem não crê?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Beliar: grego Βελιάρ; muitas traduções usam a forma alternativa “Belial”.'
    reason: Registra a forma alternativa tradicional do nome sem substituir a forma atestada no texto grego.
lexical_decisions:
- source_word: συμφώνησις
  choice: harmonia
  rationale: O substantivo indica concordância ou compatibilidade; “harmonia” preserva a força relacional e retórica do contraste em português natural.
- source_word: Χριστοῦ
  choice: o Messias
  rationale: Aqui Χριστός tem força titular no contraste conceitual com Beliar; “o Messias” expressa essa função sem tratá-lo apenas como nome próprio.
- source_word: Βελιάρ
  choice: Beliar
  rationale: Translitera diretamente a forma grega Βελιάρ, mantendo o nome próprio sem acrescentar identificação interpretativa ao texto principal.
- source_word: μερίς
  choice: parte
  rationale: O termo designa parte, porção ou participação em comum; “que parte tem” é uma formulação clara e idiomática em português.
- source_word: πιστῷ
  choice: quem crê
  rationale: O adjetivo substantivado refere-se à pessoa caracterizada pela fé; “quem crê” é natural e preserva o vínculo verbal com πιστεύω.
- source_word: ἀπίστου
  choice: quem não crê
  rationale: No contraste com πιστῷ, indica a pessoa que não crê; esta formulação evita a possível ambiguidade de “infiel”, que também pode significar desleal.
- source_word: πρὸς
  choice: entre
  rationale: Com συμφώνησις, a relação mútua é expressa naturalmente em português pela construção “entre ... e ...”.
- source_word: μετὰ
  choice: com
  rationale: A preposição marca associação; “com” é a correspondência portuguesa direta e concisa.
- source_word: δὲ
  choice: E
  rationale: δέ dá continuidade à sequência de perguntas retóricas; “E” mantém o fluxo aditivo sem impor contraste excessivo.
theological_decisions:
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: No paralelismo antitético com Beliar, Χριστός funciona de modo proeminente como título; “o Messias” preserva essa força titular.
- issue: Identificação de Βελιάρ
  choice: Beliar, como nome próprio transliterado
  alternative: Belial
  rationale: A forma do texto grego é Βελιάρ. O texto principal a translitera sem inserir uma identificação teológica adicional; a forma tradicional “Belial” é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura em duas perguntas retóricas e o contraste entre os pares foram preservados; evitou-se “infiel” por sua ambiguidade em português.
