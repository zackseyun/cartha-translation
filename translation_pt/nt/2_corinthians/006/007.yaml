id: 2CO.6.7
reference: 2 Corinthians 6:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν λόγῳ ἀληθείας, ἐν δυνάμει θεοῦ· διὰ τῶν ὅπλων τῆς δικαιοσύνης τῶν δεξιῶν καὶ ἀριστερῶν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/007.yaml
  text: in the word of truth[a], in the power of God; through the weapons of righteousness in the right hand and in the left[c][b],
translation:
  language: pt
  text: na palavra da verdade, no poder de Deus; por meio das armas da justiça, na mão direita e na esquerda[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “das direitas e das esquerdas”. A expressão provavelmente se refere às duas mãos e pode sugerir armas tanto de ataque como de defesa.
    reason: Nota textual e cultural que preserva a forma concisa e a ambiguidade da imagem grega.
lexical_decisions:
- source_word: λόγῳ ἀληθείας
  choice: palavra da verdade
  rationale: Preserva a forma compacta do grego e mantém abertas as ideias de mensagem verdadeira, proclamação da verdade e fala veraz.
- source_word: δυνάμει θεοῦ
  choice: poder de Deus
  rationale: Reproduz diretamente a construção genitiva e conserva o paralelismo com a expressão anterior introduzida por ἐν.
- source_word: διὰ
  choice: por meio de
  rationale: Com o genitivo, διά indica aqui meio ou instrumento; a expressão portuguesa explicita esse valor com naturalidade.
- source_word: ὅπλων
  choice: armas
  rationale: Ὅπλον pode abranger instrumentos de combate ofensivos ou defensivos. “Armas” é claro e evita restringir o sentido a “armadura”.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: “Justiça” conserva a amplitude paulina do termo, que pode envolver retidão, conduta justa ou aquilo que está em conformidade com Deus, sem definir aqui uma doutrina específica.
- source_word: τῶν δεξιῶν καὶ ἀριστερῶν
  choice: na mão direita e na esquerda
  rationale: Os adjetivos substantivados exigem em português um referente implícito. “Mão” é a leitura mais provável no contexto das armas e produz uma formulação natural, enquanto a nota preserva a concisão e a possível amplitude da imagem grega.
theological_decisions:
- issue: Sentido de δικαιοσύνη na expressão militar
  choice: justiça
  alternative: retidão
  rationale: “Justiça” mantém o campo semântico amplo e a formulação tradicionalmente reconhecível, sem decidir se Paulo enfatiza caráter moral, conduta justa ou recursos concedidos por Deus.
- issue: Imagem da mão direita e da esquerda
  choice: armas empunhadas em ambas as mãos
  alternative: armas à direita e à esquerda, possivelmente ofensivas e defensivas
  rationale: O texto menciona literalmente direita e esquerda sem explicar a função de cada lado. A tradução supre “mão”, exigido pela naturalidade do português, mas não transforma a provável alusão a ataque e defesa em afirmação explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a cadência da enumeração por meio de “na... no... por meio de...”. O fragmento termina com vírgula porque a frase continua no versículo seguinte.
