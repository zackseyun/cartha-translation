  text: καὶ ἔσομαι ὑμῖν εἰς πατέρα, καὶ ὑμεῖς ἔσεσθέ μοι εἰς υἱοὺς καὶ θυγατέρας, λέγει κύριος παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/018.yaml
  text: And I will be a Father to you[a], and you will be sons and daughters to me, says the Lord Almighty.
translation:
  language: pt
  text: “E eu serei Pai para vocês,[a] e vocês serão filhos e filhas para mim”, diz o Senhor Todo-Poderoso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “serei para vocês um pai, e vocês serão para mim filhos e filhas”. O grego usa uma construção que expressa uma relação de aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσομαι
  choice: serei
  rationale: O futuro de εἰμί é expresso naturalmente pelo futuro simples do verbo «ser».
- source_word: ὑμῖν εἰς πατέρα
  choice: Pai para vocês
  rationale: A construção pactual εἶναι + dativo + εἰς com acusativo indica uma relação estabelecida. «Pai para vocês» preserva a reciprocidade do original em português natural; a maiúscula assinala o título relacional divino.
- source_word: ὑμεῖς ἔσεσθέ μοι
  choice: vocês serão ... para mim
  rationale: Mantém o pronome explícito e a estrutura recíproca da primeira oração, sem acrescentar a ideia de posse.
- source_word: υἱοὺς καὶ θυγατέρας
  choice: filhos e filhas
  rationale: O grego nomeia expressamente ambos os sexos; «filhos» ou «crianças» isoladamente apagaria essa inclusão marcada.
- source_word: λέγει
  choice: diz
  rationale: O presente da fórmula de citação é preservado de modo natural em português.
- source_word: κύριος
  choice: Senhor
  rationale: É a equivalência corrente e adequada para o título divino κύριος neste contexto.
- source_word: παντοκράτωρ
  choice: Todo-Poderoso
  rationale: Reproduz de forma corrente e solene o título divino παντοκράτωρ, sem substituí-lo por outro título veterotestamentário.
theological_decisions:
- issue: Expressão inclusiva e exata da relação filial
  choice: filhos e filhas
  alternative: filhos; crianças
  rationale: Paulo menciona explicitamente υἱούς e θυγατέρας. A tradução conserva a inclusão enfática das filhas em vez de generalizá-la.
- issue: Tradução do título κύριος παντοκράτωρ
  choice: Senhor Todo-Poderoso
  alternative: Senhor, o Todo-Poderoso; Senhor dos Exércitos
  rationale: «Senhor Todo-Poderoso» traduz diretamente os dois termos gregos. «Senhor dos Exércitos» importaria um título diferente que não aparece no texto grego deste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Vocês» evita a ambiguidade regional de «vós» e corresponde ao plural grego. A formulação conserva o paralelismo relacional e a solenidade da citação.
