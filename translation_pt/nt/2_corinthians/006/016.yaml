id: 2CO.6.16
reference: 2 Corinthians 6:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τίς δὲ συγκατάθεσις ναῷ θεοῦ μετὰ εἰδώλων; ⸂ἡμεῖς γὰρ ναὸς θεοῦ ἐσμεν⸃ ζῶντος· καθὼς εἶπεν ὁ θεὸς ὅτι Ἐνοικήσω ἐν αὐτοῖς καὶ ἐμπεριπατήσω, καὶ ἔσομαι αὐτῶν θεός, καὶ αὐτοὶ ἔσονταί ⸀μου λαός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/016.yaml
  text: 'And what agreement has the temple of God with idols? For we are the temple of the living God[a], just as God said: “I will dwell among them and walk among them, and I will be their God[b], and they will be my people.”'
translation:
  language: pt
  text: 'E que acordo[a] há entre o templo de Deus e os ídolos? Pois nós somos o templo do Deus vivo, como Deus disse: “Habitarei entre eles[b] e andarei entre eles; serei o Deus deles, e eles serão o meu povo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “concordância”, “consentimento” ou “harmonia”.
    reason: lexical_alternative
  - marker: b
    text: Ou “neles”. A preposição grega pode significar “em” ou “entre”; aqui, o contexto comunitário da aliança favorece “entre eles”.
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατάθεσις
  choice: acordo
  rationale: O substantivo indica acordo, consentimento ou harmonia. “Acordo” é claro, atual e adequado à série de incompatibilidades retóricas do contexto.
- source_word: ναῷ / ναὸς
  choice: templo
  rationale: ναός designa o templo ou santuário propriamente dito, e “templo” preserva de modo acessível a força cultual da metáfora.
- source_word: εἰδώλων
  choice: ídolos
  rationale: O contexto trata de objetos de culto pagão, não de imagens em sentido neutro; “ídolos” mantém a contraposição religiosa.
- source_word: ζῶντος
  choice: vivo
  rationale: O particípio modifica θεοῦ e forma a expressão “Deus vivo”, contrapondo Deus aos ídolos sem vida.
- source_word: καθὼς εἶπεν ὁ θεὸς
  choice: como Deus disse
  rationale: “Como” comunica naturalmente a relação estabelecida por καθώς, e “disse” corresponde ao aoristo εἶπεν.
- source_word: Ἐνοικήσω ἐν αὐτοῖς
  choice: Habitarei entre eles
  rationale: Embora ἐν possa significar “em”, o plural coletivo e o paralelo com “andarei entre eles” favorecem aqui a presença de Deus no meio da comunidade.
- source_word: ἐμπεριπατήσω
  choice: andarei entre eles
  rationale: A expressão conserva a imagem vívida da presença de Deus junto ao seu povo e soa natural em português.
- source_word: ἔσομαι αὐτῶν θεός
  choice: serei o Deus deles
  rationale: A formulação preserva o genitivo relacional e a conhecida fórmula da aliança.
- source_word: λαός
  choice: povo
  rationale: Na fórmula da aliança, λαός designa coletivamente o povo pertencente a Deus.
theological_decisions:
- issue: Imagem corporativa do templo
  choice: nós somos o templo do Deus vivo
  alternative: nós somos um templo do Deus vivo
  rationale: 'Embora ναός não tenha artigo no predicativo grego, seu sentido aqui é qualitativo e definido: a comunidade é identificada corporativamente como o templo de Deus. O artigo definido comunica melhor essa metáfora e sua ligação com a citação da aliança.'
- issue: Formulação da habitação divina
  choice: Habitarei entre eles
  alternative: Habitarei neles
  rationale: A citação reúne linguagem veterotestamentária da presença de Deus e se dirige à comunidade como um todo. “Entre eles” ressalta esse sentido corporativo e acompanha o paralelo “andarei entre eles”, enquanto a nota preserva a possibilidade de “neles”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a pergunta retórica, a metáfora cultual e o caráter corporativo da citação. Os marcadores foram colocados junto às expressões às quais suas notas se referem.
