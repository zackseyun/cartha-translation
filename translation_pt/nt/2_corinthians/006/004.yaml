source:
  edition: SBLGNT
  text: ἀλλ’ ἐν παντὶ ⸀συνιστάνοντες ἑαυτοὺς ὡς θεοῦ διάκονοι· ἐν ὑπομονῇ πολλῇ, ἐν θλίψεσιν, ἐν ἀνάγκαις, ἐν στενοχωρίαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/004.yaml
  text: 'but in everything commending ourselves as God''s servants: in great endurance[a], in afflictions, in hardships, in distresses[c][b],'
translation:
  language: pt
  text: 'mas, em tudo, recomendando-nos como servos de Deus: com muita perseverança[a], em aflições, em necessidades, em angústias,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com grande perseverança». O termo grego indica perseverança firme sob provações.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: mas
  rationale: Marca o contraste com a declaração negativa anterior e introduz a maneira positiva pela qual Paulo e seus cooperadores exercem o ministério.
- source_word: ἐν παντί
  choice: em tudo
  rationale: Preserva a abrangência da expressão grega, que pode se referir a toda circunstância ou a todo aspecto da conduta.
- source_word: συνιστάνοντες ἑαυτούς
  choice: recomendando a nós mesmos
  rationale: Mantém o sentido paulino de apresentar credenciais ou demonstrar aprovação mediante a conduta, sem reduzir a expressão apenas a uma alegação verbal.
- source_word: ὡς θεοῦ διάκονοι
  choice: como servos de Deus
  rationale: διάκονοι enfatiza pessoas que servem; «servos» é claro e evita impor a ideia de um cargo eclesiástico formal.
- source_word: ἐν ὑπομονῇ πολλῇ
  choice: com muita perseverança
  rationale: ὑπομονή indica constância resistente sob provação. O português idiomático favorece «com» para a maneira, embora o grego repita ἐν.
- source_word: θλίψεσιν
  choice: aflições
  rationale: Expressa sofrimento e pressão de modo claro e digno, com o peso apropriado à lista.
- source_word: ἀνάγκαις
  choice: privações
  rationale: Neste catálogo, ἀνάγκαις denota necessidades ou circunstâncias prementes e constrangedoras; «privações» distingue o termo dos sofrimentos ao redor.
- source_word: στενοχωρίαις
  choice: situações angustiosas
  rationale: Comunica a imagem semântica de estar apertado, encurralado ou sob pressão extrema, sem recorrer a uma expressão arcaica.
theological_decisions:
- issue: Sentido de διάκονοι no contexto do ministério
  choice: servos de Deus
  alternative: ministros de Deus
  rationale: O termo caracteriza Paulo e seus cooperadores pelo serviço prestado a Deus, sem exigir que se leia aqui a designação de um ofício eclesiástico formal.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por vocabulário acessível. A cadência enumerativa do grego foi preservada. «Com muita perseverança» soa mais natural em português que «em muita perseverança», enquanto os demais itens mantêm «em». A vírgula final indica que a lista continua no versículo seguinte.
