  text: διὸ ἐξέλθατε ἐκ μέσου αὐτῶν, καὶ ἀφορίσθητε, λέγει κύριος, καὶ ἀκαθάρτου μὴ ἅπτεσθε· κἀγὼ εἰσδέξομαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/017.yaml
  text: Therefore[a], come out from among them and be separate, says the Lord, and do not touch what is unclean[c][b]; and I will receive you.
translation:
  language: pt
  text: Por isso, saiam do meio deles e fiquem separados[a], diz o Senhor. Não toquem no que é impuro[b][c], e eu os receberei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sejam postos à parte” ou “separem-se”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não toquem em nada impuro”.'
    reason: lexical_alternative
  - marker: c
    text: Paulo retoma a linguagem profética do Antigo Testamento, especialmente Isaías 52:11.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Introduz uma conclusão inferida do argumento anterior, em português natural e claro.
- source_word: ἐξέλθατε
  choice: saiam
  rationale: Preserva a força do imperativo aoristo plural, que convoca a uma ação decisiva.
- source_word: ἐκ μέσου αὐτῶν
  choice: do meio deles
  rationale: Expressão idiomática que mantém tanto a ideia de procedência quanto a separação de um grupo.
- source_word: ἀφορίσθητε
  choice: fiquem separados
  rationale: Expressa de modo natural o estado resultante ordenado pelo imperativo passivo, sem especificar indevidamente quem efetua a separação.
- source_word: λέγει κύριος
  choice: diz o Senhor
  rationale: Mantém a fórmula profética e traduz κύριος segundo o uso normal do Novo Testamento.
- source_word: ἀκαθάρτου
  choice: no que é impuro
  rationale: Substantiva o adjetivo neutro sem restringi-lo a um objeto específico.
- source_word: μὴ ἅπτεσθε
  choice: Não toquem
  rationale: Conserva a imagem concreta de contato presente no contexto de pureza e separação.
- source_word: κἀγὼ
  choice: e eu
  rationale: Representa a crase de καί com ἐγώ e preserva a resposta pessoal enfática sem exagerá-la.
- source_word: εἰσδέξομαι ὑμᾶς
  choice: eu os receberei
  rationale: Mantém o futuro e a ideia de recepção favorável, com tom digno e compatível com o contexto profético.
theological_decisions:
- issue: Tradução de κύριος em linguagem profética com pano de fundo no Antigo Testamento
  choice: Senhor
  alternative: SENHOR; Soberano
  rationale: O texto grego do Novo Testamento traz κύριος. “Senhor” preserva essa forma sem importar para o texto a representação tipográfica do nome divino hebraico.
- issue: Força da ordem de separação
  choice: fiquem separados
  alternative: separem-se; sejam postos à parte
  rationale: A formulação conserva o chamado à distinção e a nuance passiva ou resultativa do grego, sem transformá-lo em uma exigência sectária de ausência de todo contato social.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pontuação divide a longa sequência grega em duas frases para facilitar a leitura, sem alterar a relação entre as ordens e a promessa.
