  naturalness: “Em igual reciprocidade” soa redundante e pouco idiomático em português atual, pois “reciprocidade” já pressupõe correspondência mútua. “Como retribuição correspondente” é mais claro e natural no registro epistolar, sem sugerir necessariamente pagamento monetário.
  terminology: “Retribuição correspondente” comunica adequadamente ἀντιμισθία no contexto de uma resposta proporcional. “Abram-se” mantém a imagem sem acrescentar “coração”, ausente deste versículo; a nota explicita tanto o valor literal quanto o sentido contextual.
