  text: τὴν δὲ αὐτὴν ἀντιμισθίαν, ὡς τέκνοις λέγω, πλατύνθητε καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/013.yaml
  text: In the same return—I speak as to children—be open wide[b][a], you also.
translation:
  language: pt
  text: Como retribuição correspondente[a] — falo como a filhos —, abram-se[b] também vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como retribuição”, “como recompensa” ou “em troca equivalente”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sejam alargados”; no contexto, o sentido é abrir-se em afeto e receptividade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιμισθίαν
  choice: reciprocidade
  rationale: O substantivo indica uma resposta correspondente, retribuição ou troca recíproca. No contexto, Paulo pede que os coríntios respondam à abertura afetiva dele e de seus companheiros, não que façam um pagamento; “reciprocidade” comunica essa correspondência sem conotação comercial predominante.
- source_word: τὴν αὐτὴν
  choice: igual
  rationale: Preserva a ideia de uma resposta da mesma medida ou natureza que a abertura já demonstrada por Paulo e seus companheiros.
- source_word: ὡς τέκνοις
  choice: como a filhos
  rationale: Mantém o substantivo simples “filhos” e o tom familiar, sem acrescentar o possessivo “meus”, ausente do grego.
- source_word: πλατύνθητε
  choice: abram-se
  rationale: O imperativo passivo significa literalmente “sejam alargados”. No contexto imediato, descreve abertura afetiva e receptividade; “abram-se” exprime isso naturalmente sem inserir “coração” no texto principal.
- source_word: καὶ ὑμεῖς
  choice: também vocês
  rationale: Conserva tanto a reciprocidade indicada por καί como a ênfase explícita do pronome ὑμεῖς.
- source_word: δὲ
  choice: não representado por palavra isolada
  rationale: Aqui δέ funciona como conexão leve dentro do apelo. A continuidade é suficientemente comunicada pela construção portuguesa, sem acrescentar um “agora” temporal nem um “mas” excessivamente contrastivo.
theological_decisions:
- issue: Explicitar uma relação possessiva entre Paulo e os destinatários
  choice: “como a filhos”, sem acrescentar “meus”
  alternative: “como a meus filhos”
  rationale: O tom é claramente paternal, mas o texto grego não contém pronome possessivo. A formulação escolhida preserva o afeto familiar sem tornar explícito o que permanece implícito.
- issue: Tornar “coração” explícito no imperativo
  choice: “abram-se”
  alternative: “abram bem o coração”
  rationale: O contexto anterior associa a metáfora ao coração, mas καρδία não ocorre neste versículo. A tradução principal preserva a imagem e deixa a nota esclarecer seu sentido, evitando acrescentar um objeto ausente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem marcada da frase e os travessões preservam o apelo enfático de Paulo; “vocês” evita regionalismo excessivo e mantém a ênfase do pronome grego.
