  text: You are not restricted by us[a], but you are restricted in your own affections.
translation:
  language: pt
  text: Vocês não estão limitados por nós,[a] mas estão limitados em seus próprios afetos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Vocês não estão apertados em nós, mas estão apertados em suas próprias entranhas.” Também se pode dizer: “... em seus próprios corações.”'
    reason: Preserva a metáfora espacial de στενοχωρεῖσθε, o valor básico de ἐν e o plural da imagem corporal σπλάγχνα, ao mesmo tempo que registra uma alternativa idiomática.
lexical_decisions:
- source_word: στενοχωρεῖσθε
  choice: estão limitados
  rationale: O verbo evoca literalmente um espaço apertado e, em sentido figurado, restrição. “Estão limitados” é claro e natural em português; a repetição da mesma expressão preserva o contraste retórico de Paulo.
- source_word: ἐν ἡμῖν
  choice: por nós
  rationale: Embora ἐν tenha como sentido básico “em”, aqui a expressão indica que Paulo e seus companheiros não são a origem da limitação dos coríntios. “Por nós” comunica essa relação com naturalidade.
- source_word: δὲ
  choice: mas
  rationale: Marca o contraste direto entre a ausência de limitação da parte de Paulo e a limitação existente nos próprios coríntios.
- source_word: ἐν τοῖς σπλάγχνοις ὑμῶν
  choice: em seus próprios afetos
  rationale: σπλάγχνα designa literalmente as entranhas e, figuradamente, os sentimentos profundos. “Afetos” preserva o sentido emocional e relacional; “próprios” enfatiza que a limitação está neles.
- source_word: οὐ
  choice: não
  rationale: Expressa diretamente a negação da primeira oração.
theological_decisions:
- issue: Sentido figurado de σπλάγχνα
  choice: afetos, isto é, a capacidade interior e emocional dos coríntios de corresponder à abertura de Paulo
  alternative: entranhas ou coração
  rationale: O contexto é relacional, não anatômico. A tradução figurada comunica o sentido, enquanto a nota registra a metáfora corporal e uma alternativa tradicional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação mantém o paralelismo verbal do grego e evita interpretar além do contraste relacional expresso no texto.
