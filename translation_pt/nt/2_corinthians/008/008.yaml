id: 2CO.8.8
reference: 2 Corinthians 8:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐ κατ’ ἐπιταγὴν λέγω ἀλλὰ διὰ τῆς ἑτέρων σπουδῆς καὶ τὸ τῆς ὑμετέρας ἀγάπης γνήσιον δοκιμάζων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/008.yaml
  text: I am not saying this as a command[b][a], but through the earnestness of others I am also testing the genuineness of your love.
translation:
  language: pt
  text: Não digo isso como uma ordem, mas, por meio da dedicação dos outros[a], também ponho à prova[b] a autenticidade do amor de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «por meio da prontidão dos outros»; σπουδή pode indicar dedicação, prontidão ou diligência.
    reason: lexical_alternative
  - marker: b
    text: Ou «comprovo» ou «verifico» a autenticidade do amor de vocês.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιταγή
  choice: ordem
  rationale: Em «οὐ κατ’ ἐπιταγὴν λέγω», indica que Paulo não fala na forma de uma determinação autoritativa. «Ordem» é corrente e mantém o contraste com a generosidade voluntária.
- source_word: διὰ τῆς ἑτέρων σπουδῆς
  choice: por meio da dedicação dos outros
  rationale: διά com genitivo expressa aqui meio ou instrumento; ἑτέρων permanece como «dos outros», sem identificar explicitamente os macedônios.
- source_word: σπουδή
  choice: dedicação
  rationale: No contexto, comunica empenho sério e ativo. «Dedicação» é natural em português e preserva a ideia de diligência, embora «prontidão» também seja possível.
- source_word: ἀγάπη
  choice: amor
  rationale: Equivalente direto e adequado ao contexto da disposição amorosa demonstrada pela contribuição.
- source_word: γνήσιον
  choice: autenticidade
  rationale: O adjetivo substantivado designa a qualidade do que é genuíno. «Autenticidade do amor» soa natural e conserva a noção de legitimidade real.
- source_word: δοκιμάζων
  choice: ponho à prova
  rationale: O particípio presente acompanha λέγω e descreve a ação ou finalidade concomitante de Paulo. «Ponho à prova» preserva o campo semântico de testar para verificar ou demonstrar a qualidade.
- source_word: καί
  choice: também
  rationale: 'Mantém a força aditiva: por intermédio do empenho alheio, Paulo também verifica a autenticidade do amor dos coríntios.'
- source_word: ὑμετέρας
  choice: de vocês
  rationale: Expressa de modo claro e amplamente compreensível a posse coletiva referente aos destinatários.
theological_decisions:
- issue: A postura retórica de Paulo quanto à contribuição
  choice: Paulo declara que não fala como quem dá uma ordem e apresenta suas palavras como um modo de pôr à prova a autenticidade do amor dos coríntios.
  alternative: Entender que Paulo apenas suaviza retoricamente uma ordem, sem negar sua força obrigatória.
  rationale: A expressão οὐ κατ’ ἐπιταγὴν λέγω nega de maneira direta que ele esteja falando na forma de uma ordem. A tradução mantém a tensão entre sua autoridade apostólica e uma resposta voluntária motivada pelo amor.
translation_notes:
  register: Português moderno, digno e de leitura natural, com «vocês» para o plural dos destinatários. A formulação conserva a relação instrumental de διά, a força aditiva de καί e a abertura semântica de δοκιμάζων.
