  yaml_path: translation/nt/2_corinthians/008/002.yaml
  text: that in a severe test of affliction[b][a], the abundance of their joy and their deep poverty overflowed into the wealth of their generosity.
translation:
  language: pt
  text: pois, em meio a uma grande prova de aflição, a abundância da alegria deles e sua profunda pobreza[a] redundaram em rica generosidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua pobreza extrema”; literalmente, “sua pobreza até as profundezas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em rica liberalidade”. A palavra grega também pode significar “simplicidade”, “sinceridade” ou “inteireza de coração”, mas aqui provavelmente se refere à generosidade ao contribuir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πολλῇ δοκιμῇ θλίψεως
  choice: em meio a uma grande prova de aflição
  rationale: Preserva a relação entre δοκιμή e θλίψεως, comunicando uma situação intensa de provação de modo natural e digno em português.
- source_word: περισσεία τῆς χαρᾶς
  choice: a abundância da alegria deles
  rationale: Mantém a estrutura nominal e a ideia de abundância, além de conservar a ligação verbal com ἐπερίσσευσεν.
- source_word: κατὰ βάθους πτωχεία
  choice: sua profunda pobreza
  rationale: Expressa idiomaticamente a intensificação de πτωχεία e preserva a imagem de profundidade.
- source_word: ἐπερίσσευσεν
  choice: transbordaram
  rationale: A forma plural concorda naturalmente com os dois elementos coordenados em português e comunica a abundância que resulta no que segue.
- source_word: εἰς τὸ πλοῦτος
  choice: na riqueza
  rationale: O contexto permite entender εἰς em sentido resultativo; 'transbordaram na riqueza' preserva a imagem direcional sem tornar a frase excessivamente literal.
- source_word: ἁπλότης
  choice: generosidade
  rationale: No contexto da coleta e da contribuição material, o termo denota mais provavelmente liberalidade ou generosidade, embora também possa significar simplicidade ou sinceridade sem duplicidade.
theological_decisions:
- issue: Sentido de ἁπλότης no contexto de contribuição material
  choice: generosidade
  alternative: simplicidade, sinceridade ou inteireza de coração
  rationale: O contexto imediato trata da oferta aos santos, favorecendo o sentido de generosidade. A nota preserva a amplitude lexical e evita eliminar a possível conotação de disposição sincera e não dividida.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A construção conserva o paradoxo entre alegria abundante, pobreza profunda e rica generosidade.
