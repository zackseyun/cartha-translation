id: 2CO.8.12
reference: 2 Corinthians 8:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ προθυμία πρόκειται, καθὸ ἐὰν ⸀ἔχῃ εὐπρόσδεκτος, οὐ καθὸ οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/012.yaml
  text: For if the readiness is present[a], it is acceptable according to what one has[b], not according to what one does not have.
translation:
  language: pt
  text: Pois, se há disposição[a], ela é aceitável segundo o que a pessoa tem[b], e não segundo o que não tem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prontidão” ou “boa vontade”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “segundo o que quer que a pessoa tenha... e não segundo o que não tem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμία
  choice: disposição
  rationale: No contexto, indica prontidão interior e vontade de contribuir. “Disposição” é natural em português e não intensifica indevidamente o sentido como poderia ocorrer com “entusiasmo”.
- source_word: πρόκειται
  choice: há
  rationale: Neste uso idiomático, expressa que a disposição está presente. “Há disposição” comunica isso de modo corrente, sem reproduzir literalmente a ideia de algo posto diante de alguém.
- source_word: καθὸ ἐὰν ἔχῃ
  choice: segundo o que a pessoa tem
  rationale: Preserva o padrão ou medida baseado nos recursos efetivamente disponíveis e mantém o caráter genérico do singular grego.
- source_word: εὐπρόσδεκτος
  choice: aceitável
  rationale: Expressa aprovação ou acolhimento favorável sem especificar quem aceita, pois o texto grego não explicita esse referente.
- source_word: οὐ καθὸ οὐκ ἔχει
  choice: e não segundo o que não tem
  rationale: 'Mantém o paralelismo e o contraste do grego: a avaliação se baseia nos recursos existentes, não nos inexistentes.'
- source_word: εἰ γὰρ
  choice: Pois, se
  rationale: Conserva tanto a ligação explicativa de γάρ quanto a condição introduzida por εἰ.
theological_decisions:
- issue: Referente implícito da aceitabilidade
  choice: Não especificar diante de quem a oferta é aceitável.
  alternative: Explicitar “aceitável diante de Deus” ou “aceitável para a comunidade”.
  rationale: Embora εὐπρόσδεκτος implique aceitação favorável, o versículo não identifica expressamente quem aceita. A formulação preserva essa abertura.
- issue: Sujeito implícito de εὐπρόσδεκτος
  choice: Explicitar “a oferta” como sujeito contextual.
  alternative: Manter apenas “é aceitável”, permitindo que “a disposição” pareça ser o sujeito.
  rationale: A elipse grega pode apontar contextualmente para a contribuição/oferta. A explicitação torna a frase natural em português, sem definir o referente teológico da aceitação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “A pessoa” evita o masculino genérico; “oferta” explicita a elipse contextual sem acrescentar quem a recebe ou aprova.
