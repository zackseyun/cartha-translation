  text: οὐ γὰρ ἵνα ἄλλοις ἄνεσις, ⸀ὑμῖν θλῖψις· ἀλλ’ ἐξ ἰσότητος
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/013.yaml
  text: For I do not mean that there should be relief for others and hardship for you[a], but equality—
translation:
  language: pt
  text: Pois não para que haja alívio para outros e dificuldade para vocês, mas igualdade[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “equidade”. O termo grego pode indicar um equilíbrio justo no atendimento das necessidades, não necessariamente uma igualdade rigorosa de todos os bens.
    reason: alternativa lexical
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Pois não
  rationale: “Pois” preserva a função explicativa de γάρ, enquanto “não” expressa a negação de οὐ e liga a correção de Paulo ao apelo anterior.
- source_word: ἵνα
  choice: quero dizer que deva haver
  rationale: Após uma ideia elíptica de intenção, ἵνα é expresso naturalmente em português pela oração “que deva haver”; “quero dizer” explicita a elipse sem alterar o sentido.
- source_word: ἄλλοις
  choice: para outros
  rationale: O dativo indica aqueles que receberiam o benefício; “para outros” mantém a referência indefinida do grego.
- source_word: ἄνεσις
  choice: alívio
  rationale: No contexto da coleta, o termo designa alívio de pressão ou necessidade, não apenas conforto emocional.
- source_word: ὑμῖν
  choice: para vocês
  rationale: O dativo contrasta diretamente com ἄλλοις. “Vocês” oferece leitura brasileira clara e permanece amplamente compreensível no português internacional.
- source_word: θλῖψις
  choice: aflição
  rationale: O termo denota pressão, dificuldade ou sofrimento. “Aflição” conserva sua amplitude e, no contexto, inclui a dificuldade material causada por uma contribuição excessiva.
- source_word: ἀλλ’ ἐξ ἰσότητος
  choice: mas igualdade
  rationale: A formulação concisa preserva o contraste e a continuação sintática do versículo seguinte. “Igualdade” é o equivalente lexical mais direto de ἰσότης, sem decidir se Paulo tem em vista identidade absoluta ou equilíbrio equitativo.
theological_decisions:
- issue: Sentido de ἰσότης no ensino sobre a partilha material
  choice: igualdade
  alternative: equidade
  rationale: “Igualdade” preserva a correspondência lexical direta e a força retórica de Paulo. A alternativa “equidade” reconhece que o termo pode indicar equilíbrio justo no atendimento das necessidades, sem exigir posse rigorosamente idêntica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O travessão final preserva a continuidade do raciocínio com o versículo 14. A construção evita definir de modo excessivo a natureza da igualdade pretendida.
