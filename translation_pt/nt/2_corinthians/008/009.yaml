id: 2CO.8.9
reference: 2 Corinthians 8:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: γινώσκετε γὰρ τὴν χάριν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι δι’ ὑμᾶς ἐπτώχευσεν πλούσιος ὤν, ἵνα ὑμεῖς τῇ ἐκείνου πτωχείᾳ πλουτήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/009.yaml
  text: For you know the grace of our Lord Jesus Christ[a], that though he was rich, yet for your sake he became poor[b], so that you by his poverty might become rich.
translation:
  language: pt
  text: 'Pois vocês conhecem a graça de nosso Senhor Jesus, o Messias[a]: embora fosse rico, ele se tornou pobre em favor de vocês[b], para que, por meio da pobreza dele, vocês se tornassem ricos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Jesus Cristo». O título grego Χριστός significa «Messias»; «Cristo» é sua forma tradicional em português.
    reason: alternative_reading
  - marker: b
    text: «Rico», «pobre» e «ricos» formam uma antítese que provavelmente é metafórica. Paulo não define aqui com precisão em que consistem a riqueza e a pobreza mencionadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: vocês conhecem
  rationale: O presente do indicativo apela a um conhecimento que os coríntios já possuem; «vocês conhecem» é natural e preserva o valor do plural.
- source_word: χάριν
  choice: graça
  rationale: «Graça» mantém tanto a iniciativa graciosa de Cristo quanto, no contexto, sua relação com a generosidade, sem reduzir o termo apenas a «favor» ou «generosidade».
- source_word: κυρίου
  choice: Senhor
  rationale: É o título português consagrado que preserva a autoridade e o peso cristológico de κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Χριστός é título e corresponde a «Messias»; o artigo acrescentado em português deixa claro que não se trata de sobrenome. A forma tradicional «Jesus Cristo» é registrada em nota.
- source_word: δι’ ὑμᾶς
  choice: em favor de vocês
  rationale: διά com acusativo tem aqui força benefactiva. «Em favor de vocês» evita a possível leitura meramente causal de «por causa de vocês».
- source_word: πλούσιος ὤν
  choice: embora fosse rico
  rationale: 'A oração concessiva comunica com clareza o contraste pretendido pelo particípio: apesar de rico, ele se tornou pobre.'
- source_word: ἐπτώχευσεν
  choice: se tornou pobre
  rationale: Preserva a mudança expressa pelo verbo ativo sem explicar de que maneira ocorreu nem definir a natureza da pobreza.
- source_word: τῇ ἐκείνου πτωχείᾳ
  choice: por meio da pobreza dele
  rationale: Expressa o provável valor instrumental do dativo e mantém a ênfase do pronome ἐκείνου em Cristo.
- source_word: πλουτήσητε
  choice: vocês se tornassem ricos
  rationale: O subjuntivo após ἵνα exprime finalidade ou resultado. «Se tornassem ricos» conserva o paralelismo verbal com «se tornou pobre».
theological_decisions:
- issue: Sentido da riqueza de Cristo, de sua pobreza e do enriquecimento dos fiéis
  choice: Manter a linguagem de riqueza e pobreza sem definir a metáfora
  alternative: Identificar a riqueza exclusivamente com a glória divina preexistente, a pobreza exclusivamente com a encarnação ou morte, e o enriquecimento exclusivamente com bênçãos espirituais
  rationale: Paulo não explicita neste versículo cada referente da antítese. A formulação preserva tanto seu alcance cristológico quanto sua função ética no contexto da generosidade, sem impor uma interpretação denominacional.
- issue: Valor de ἵνα na oração final
  choice: Traduzir como finalidade, deixando aberta sua relação com o resultado
  alternative: 'Explicitar somente resultado: «de modo que vocês ficaram ricos»'
  rationale: O subjuntivo com ἵνα naturalmente apresenta propósito, mas propósito e resultado podem se sobrepor aqui; «para que» conserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para o plural. A pontuação com dois-pontos apresenta naturalmente o conteúdo conhecido após «vocês conhecem a graça», sem alterar a relação explicativa introduzida por ὅτι. Evitaram-se termos excessivamente técnicos e explicações doutrinárias dentro do versículo.
