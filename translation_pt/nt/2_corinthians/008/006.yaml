    issue: «Insistimos com» intensifica desnecessariamente παρακαλέσαι.
    rationale: O verbo pode significar pedir, exortar ou encorajar; «insistir» normalmente introduz a ideia adicional de repetição ou pressão persistente.
  - severity: medium
    issue: «Esta obra da graça» é ambígua e pouco natural em português.
    rationale: A expressão pode indicar uma obra produzida pela graça, não a atividade graciosa/concreta da coleta. Uma formulação com «generosidade», acompanhada de nota literal, representa melhor o contexto sem apagar χάρις.
  revised_text: Por isso, pedimos a Tito que, assim como ele já havia começado, também levasse a bom termo entre vocês esta obra de generosidade.[a]
