  text: εἰς τὸ παρακαλέσαι ἡμᾶς Τίτον ἵνα καθὼς προενήρξατο οὕτως καὶ ἐπιτελέσῃ εἰς ὑμᾶς καὶ τὴν χάριν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/006.yaml
  text: So we urged Titus that[a], just as he had previously begun, he should also complete among you this act of grace.
translation:
  language: pt
  text: Por isso, pedimos a Tito que, assim como ele já havia começado, também levasse a bom termo entre vocês esta obra de generosidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «esta obra graciosa»; mais literalmente, «esta graça».
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: insistimos com
  rationale: No contexto, o verbo descreve o apelo de Paulo para que Tito agisse. «Insistimos com» comunica força sem sugerir uma ordem autoritária.
- source_word: καθὼς προενήρξατο
  choice: assim como já havia começado
  rationale: 'Preserva a nuance temporal do verbo composto: Tito iniciara anteriormente essa atividade entre os coríntios.'
- source_word: ἐπιτελέσῃ
  choice: completasse
  rationale: O subjuntivo após ἵνα expressa o propósito do apelo, e o verbo indica levar a iniciativa já começada até sua conclusão.
- source_word: εἰς ὑμᾶς
  choice: entre vocês
  rationale: Expressa naturalmente a atividade de Tito dirigida à comunidade e realizada em seu meio.
- source_word: τὴν χάριν ταύτην
  choice: esta obra da graça
  rationale: Mantém o vocabulário teológico de χάρις e, ao mesmo tempo, indica a iniciativa concreta da contribuição, sem reduzi-la simplesmente a «oferta» ou «donativo».
theological_decisions:
- issue: Sentido de χάρις no contexto da coleta
  choice: «obra da graça», referindo-se à iniciativa concreta de generosidade concebida como expressão da graça
  alternative: «esta graça», em sentido mais literal e potencialmente mais abstrato; ou «esta oferta»
  rationale: O contexto de 2 Coríntios 8 aponta para a contribuição destinada aos santos, mas Paulo a caracteriza teologicamente como χάρις. A tradução conserva as duas dimensões.
translation_notes:
  register: Português moderno, claro e digno, com «vocês» para o plural. A construção evita formalismo excessivo e preserva a relação entre a coleta concreta e o conceito de graça.
