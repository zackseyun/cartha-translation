  text: μετὰ πολλῆς παρακλήσεως δεόμενοι ἡμῶν, τὴν χάριν καὶ τὴν κοινωνίαν τῆς διακονίας τῆς εἰς τοὺς ἁγίους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/004.yaml
  text: begging us with much urging for the grace and the fellowship of this ministry to the saints—[a]
translation:
  language: pt
  text: pedindo-nos com muita insistência a graça e a participação no serviço em favor dos santos—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o privilégio e a comunhão no serviço em favor dos santos”.'
    reason: Preserva as alternativas lexicais plausíveis de χάρις (“privilégio”) e κοινωνία (“comunhão”), sem resolver indevidamente a amplitude dos termos.
lexical_decisions:
- source_word: μετὰ πολλῆς παρακλήσεως
  choice: com muita insistência
  rationale: A construção expressa a maneira intensa do pedido. Neste contexto, παράκλησις indica apelo insistente, não consolo; a formulação é natural e evita redundância com “pedindo”.
- source_word: δεόμενοι ἡμῶν
  choice: pedindo-nos
  rationale: δέομαι denota pedir, rogar ou suplicar, e o genitivo ἡμῶν identifica aqueles a quem se dirige o pedido. “Pedindo-nos” mantém dignidade e fluidez em português.
- source_word: τὴν χάριν
  choice: a graça
  rationale: χάρις pode significar graça, favor ou privilégio. “Graça” preserva o vocabulário característico de Paulo e a ressonância teológica, sem eliminar a nuance contextual de privilégio.
- source_word: τὴν κοινωνίαν
  choice: a participação
  rationale: κοινωνία aqui aponta concretamente para participação compartilhada na ajuda. “Participação” comunica o sentido contextual com mais clareza que “comunhão”, embora esta preserve melhor a dimensão relacional e seja registrada em nota.
- source_word: τῆς διακονίας
  choice: nesse serviço
  rationale: διακονία designa aqui o serviço prático de assistência aos necessitados. “Serviço” é claro e atual; “nesse” torna natural em português a cadeia genitiva e remete à ação mencionada no contexto.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: em favor dos santos
  rationale: A expressão preposicional indica a direção ou os beneficiários do serviço. “Em favor de” explicita naturalmente essa relação, enquanto “santos” preserva o termo paulino para os crentes.
theological_decisions:
- issue: Sentido de χάρις no contexto da coleta
  choice: graça
  alternative: privilégio
  rationale: Mantém a linguagem teológica de Paulo e a ambiguidade genuína do termo, enquanto a nota registra a leitura contextual de privilégio.
- issue: Sentido de κοινωνία
  choice: participação
  alternative: comunhão
  rationale: O contexto exige envolvimento concreto no serviço de assistência; “participação” expressa isso diretamente, sem negar a dimensão comunitária presente em κοινωνία.
- issue: Tradução de ἅγιοι
  choice: santos
  alternative: povo santo de Deus
  rationale: “Santos” mantém a continuidade lexical do uso paulino e designa todos os crentes, sem restringir o termo a uma classe canonizada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase preserva o caráter sintaticamente dependente e o travessão do texto-fonte, pois o versículo continua a oração iniciada anteriormente.
