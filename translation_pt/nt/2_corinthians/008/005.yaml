review_pass:
  verdict: revise
  source_fidelity: 'A ideia central está bem preservada: a entrega pessoal dos macedônios, a prioridade dada ao Senhor e a relação dessa ação com a vontade de Deus. Contudo, «não apenas» introduz uma limitação (“não meramente”) que não está expressa no grego, e «depois» explicita uma sequência temporal que πρῶτον sugere, mas não formula dessa maneira. «Por meio da vontade» é compreensível, porém menos idiomático e menos direto para διά com genitivo neste contexto.'
  naturalness: «Deram a si mesmos» é correto, mas «eles se deram» é mais fluente no português moderno sem perder o reflexivo. «Pela vontade de Deus» é natural, digno e suficientemente amplo. A alternativa atual da nota a («como tínhamos esperança») não é idiomática em português contemporâneo.
  terminology: «Senhor» e «Deus» estão adequados. «Eles se deram primeiro ao Senhor e também a nós» conserva os dois dativos sem sugerir que Paulo e seus companheiros tenham o mesmo estatuto do Senhor, nem transforma indevidamente a entrega numa contribuição financeira.
  issues:
  - severity: medium
    issue: «não apenas como esperávamos» acrescenta «apenas»
    rationale: O grego diz literalmente «e não como esperávamos, mas...». Embora a construção portuguesa possa tentar esclarecer a elipse, «apenas» formula explicitamente a noção de “não meramente”, que não aparece no texto-fonte.
  - severity: low
    issue: «depois a nós» explicita além do necessário
    rationale: πρῶτον marca prioridade para o Senhor, mas o grego coordena em seguida «e a nós». «Também a nós» preserva melhor essa coordenação e deixa aberta a nuance exata da prioridade.
  - severity: low
    issue: Nota a pouco natural
    rationale: «Como tínhamos esperança» não é uma alternativa idiomática para expressar o valor de ἠλπίσαμεν em português. Uma formulação com «havíamos esperado» é natural e mantém a possibilidade de entender o verbo no sentido de esperança.
