source:
  edition: SBLGNT
  text: καὶ οὐ καθὼς ἠλπίσαμεν ἀλλ’ ἑαυτοὺς ἔδωκαν πρῶτον τῷ κυρίῳ καὶ ἡμῖν διὰ θελήματος θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/005.yaml
  text: And not as we expected[a], but they gave themselves first to the Lord and to us through the will of God[b],
translation:
  language: pt
  text: E não como esperávamos[a], mas eles se deram primeiro ao Senhor e também a nós, pela vontade de Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «como havíamos esperado».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «por meio da vontade de Deus» ou «de acordo com a vontade de Deus».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ἠλπίσαμεν
  choice: como esperávamos
  rationale: Embora ἐλπίζω frequentemente signifique «esperar» no sentido de ter esperança, aqui o contexto destaca aquilo que Paulo e seus companheiros previam. «Como esperávamos» é natural em português; a possível nuance de esperança é preservada em nota.
- source_word: ἑαυτοὺς ἔδωκαν
  choice: deram a si mesmos
  rationale: Preserva o pronome reflexivo enfático e o sentido de entrega pessoal, sem reduzir a ação a uma simples contribuição financeira.
- source_word: πρῶτον
  choice: primeiro
  rationale: Mantém a prioridade expressa pelo advérbio, sem decidir se ela é principalmente temporal, lógica ou ambas.
- source_word: τῷ κυρίῳ
  choice: ao Senhor
  rationale: Reproduz de modo direto o dativo e mantém o título κύριος como «Senhor».
- source_word: καὶ ἡμῖν
  choice: e depois a nós
  rationale: O português pede maior clareza na coordenação. «Depois» torna explícita a sequência já indicada por πρῶτον, sem colocar Paulo e seus companheiros no mesmo nível do Senhor.
- source_word: διὰ θελήματος θεοῦ
  choice: por meio da vontade de Deus
  rationale: Preserva a construção διά com genitivo e deixa em aberto as nuances de meio, ação divina ou conformidade com a vontade de Deus.
theological_decisions:
- issue: Relação entre a entrega ao Senhor e a entrega aos apóstolos
  choice: A prioridade pertence ao Senhor; a entrega a Paulo e seus companheiros vem em seguida, no âmbito do serviço apostólico.
  alternative: Entender a expressão como uma dedicação dupla, sem hierarquia além da sequência indicada por «primeiro».
  rationale: A ordem dos dativos e πρῶτον estabelece prioridade, mas o texto não deve ser ampliado para sustentar afirmações eclesiológicas mais fortes.
- issue: Sentido de διὰ θελήματος θεοῦ
  choice: «por meio da vontade de Deus», preservando a amplitude da construção.
  alternative: «pela vontade de Deus» ou «de acordo com a vontade de Deus».
  rationale: A expressão grega pode destacar meio ou ação divina, e também admite uma ideia de conformidade; a formulação principal evita resolver essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a entrega reflexiva e pessoal, bem como a ambiguidade da frase final. «Não apenas» comunica que a ação superou a expectativa, evitando a construção pouco natural «não como».
