- from: E não apenas como esperávamos[a], mas deram a si mesmos, primeiro ao Senhor e depois a nós, por meio da vontade de Deus[b].
  to: E não como esperávamos[a], mas eles se deram primeiro ao Senhor e também a nós, pela vontade de Deus[b].
  rationale: A revisão remove acréscimos explicativos não exigidos pelo grego («apenas» e «depois»), usa uma forma reflexiva mais natural em português e adota «pela vontade de Deus», que é idiomática para διά com genitivo sem resolver de modo indevido a relação entre agência, autorização e conformidade. As notas mantêm as alternativas relevantes com redação portuguesa natural.
