  text: ὅτι τὴν μὲν παράκλησιν ἐδέξατο, σπουδαιότερος δὲ ὑπάρχων αὐθαίρετος ἐξῆλθεν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/017.yaml
  text: For he accepted the appeal[a], but being more earnest[d][c][b], he went to you of his own accord.
translation:
  language: pt
  text: Pois ele acolheu o apelo[a], mas, sendo ainda mais empenhado[b], partiu rumo a vocês por iniciativa própria.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a exortação” ou “o pedido”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ainda mais zeloso” ou “ainda mais diligente”.
    reason: lexical_alternative
  - marker: c
    text: Ou “voluntariamente” ou “por sua própria iniciativa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a explicação causal do agradecimento expresso no versículo anterior e soa natural em português.
- source_word: παράκλησιν
  choice: apelo
  rationale: No contexto, refere-se ao pedido ou à exortação dirigida a Tito para participar dessa missão, e não principalmente a consolo.
- source_word: ἐδέξατο
  choice: acolheu
  rationale: Expressa uma recepção favorável do apelo, preservando melhor que uma simples ideia de recebimento.
- source_word: σπουδαιότερος
  choice: ainda mais zeloso
  rationale: Preserva a forma comparativa e comunica o empenho intenso de Tito sem restringi-lo apenas a diligência administrativa.
- source_word: ὑπάρχων
  choice: sendo
  rationale: Mantém a construção participial e deixa aberta a relação circunstancial com a ação principal.
- source_word: αὐθαίρετος
  choice: por iniciativa própria
  rationale: Comunica que Tito agiu voluntariamente e movido por disposição pessoal, sem sugerir arbitrariedade, sentido que a palavra portuguesa cognata poderia evocar.
- source_word: ἐξῆλθεν πρὸς ὑμᾶς
  choice: partiu para ir até vocês
  rationale: Preserva a ideia de saída em direção aos destinatários e evita confundir a perspectiva do remetente com a dos leitores.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural. A formulação mantém o contraste entre Tito acolher o apelo e agir também por iniciativa própria; “partiu para ir” conserva a perspectiva direcional do grego sem produzir o pouco natural “saiu para vocês”.
