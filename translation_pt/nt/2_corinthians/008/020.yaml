  text: στελλόμενοι τοῦτο μή τις ἡμᾶς μωμήσηται ἐν τῇ ἁδρότητι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/020.yaml
  text: taking this precaution, so that no one may blame us in regard to this generous gift being administered by us,
translation:
  language: pt
  text: tomando esta precaução, para que ninguém nos censure quanto a essa oferta generosa[a] que administramos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “essa abundante contribuição” ou “essa grande oferta”. O termo grego pode indicar generosidade ou abundância.
    reason: lexical_alternative
lexical_decisions:
- source_word: στελλόμενοι τοῦτο
  choice: tomando esta precaução
  rationale: O particípio médio expressa a adoção de medidas preventivas; a formulação portuguesa comunica naturalmente a cautela que visa evitar censura.
- source_word: μή τις ἡμᾶς μωμήσηται
  choice: para que ninguém nos censure
  rationale: A construção μή com o subjuntivo indica prevenção ou propósito negativo, e μωμάομαι significa censurar, culpar ou encontrar motivo de crítica.
- source_word: ἐν τῇ ἁδρότητι ταύτῃ
  choice: quanto a essa oferta generosa
  rationale: ἐν delimita o assunto em que poderia surgir censura. ἁδρότης denota abundância ou generosidade e, no contexto da coleta, refere-se à contribuição generosa.
- source_word: τῇ διακονουμένῃ ὑφ’ ἡμῶν
  choice: que administramos
  rationale: No contexto financeiro e assistencial, διακονέω descreve o serviço de gerir ou encaminhar a contribuição; a voz passiva grega é vertida de modo ativo e natural, sem alterar o agente.
theological_decisions:
- issue: A preocupação de Paulo no manejo da coleta
  choice: Destacar a cautela prática para evitar censura na administração da oferta.
  alternative: Entender a expressão apenas como uma providência de viagem, sem ênfase explícita na prestação de contas.
  rationale: O texto grego liga diretamente a medida preventiva à possibilidade de censura relativa à contribuição administrada por Paulo e seus companheiros, realçando responsabilidade sem acrescentar uma doutrina externa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Censure” preserva a ideia de atribuir culpa ou encontrar falta; “administramos” é natural no contexto de gestão responsável da coleta.
