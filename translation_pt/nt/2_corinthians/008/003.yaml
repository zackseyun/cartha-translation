  text: For[a], I testify, they gave according to their ability, and beyond their ability, of their own accord[b],
translation:
  language: pt
  text: Pois eles deram, eu testemunho, segundo suas possibilidades[a] e além delas, por iniciativa própria[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conforme seus recursos” ou “segundo sua capacidade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “voluntariamente” ou “de livre vontade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Aqui, ὅτι introduz uma explicação que sustenta a afirmação do versículo anterior. “Pois” reproduz essa função discursiva sem transformar o termo apenas em uma conjunção integrante.
- source_word: κατὰ δύναμιν
  choice: conforme suas possibilidades
  rationale: 'A expressão indica medida ou proporção: eles contribuíram de acordo com a capacidade ou os recursos que tinham. “Possibilidades” é natural em português e abrange ambos os aspectos.'
- source_word: μαρτυρῶ
  choice: posso testemunhar
  rationale: Mantém a declaração pessoal e enfática de Paulo como observação parentética, em formulação natural no português atual.
- source_word: καὶ παρὰ δύναμιν
  choice: e até além delas
  rationale: παρά com acusativo expressa ultrapassar um limite. O pronome retoma “possibilidades”, enquanto “até” realça o contraste presente no grego.
- source_word: αὐθαίρετοι
  choice: por iniciativa própria
  rationale: O adjetivo descreve uma ação espontânea, tomada sem imposição externa. A expressão preserva tanto a voluntariedade quanto a ideia de iniciativa.
theological_decisions:
- issue: Verbo implícito junto de αὐθαίρετοι
  choice: Explicitar “eles deram” a partir do contexto imediato.
  alternative: 'Traduzir de modo elíptico: “espontaneamente” ou “sendo voluntários”.'
  rationale: O grego omite o verbo da ação, mas o contexto trata claramente da contribuição dos macedônios. Explicitar “deram” produz uma frase compreensível em português sem acrescentar uma ação estranha ao texto.
- issue: Relação sintática de μαρτυρῶ
  choice: Manter “posso testemunhar” como comentário parentético.
  alternative: 'Integrar a expressão como oração principal: “testemunho que eles deram...”.'
  rationale: A ordem grega intercala μαρτυρῶ entre as duas expressões de medida. A construção parentética preserva essa ênfase e evita fazer de ὅτι apenas o introdutor do conteúdo do testemunho.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção parentética conserva a ênfase de Paulo; a vírgula final sinaliza que a frase continua no versículo seguinte.
