  text: καθὼς γέγραπται· Ὁ τὸ πολὺ οὐκ ἐπλεόνασεν, καὶ ὁ τὸ ὀλίγον οὐκ ἠλαττόνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/015.yaml
  text: 'as it is written: The one who had much did not have too much[a], and the one who had little did not have too little.'
translation:
  language: pt
  text: 'como está escrito: “Quem tinha muito não teve em excesso, e quem tinha pouco não teve falta.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais literal e em consonância com Êxodo 16:18: “Quem recolheu muito não teve sobra, e quem recolheu pouco não teve falta.”'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: como está escrito
  rationale: Fórmula corrente de citação das Escrituras; o presente em português expressa adequadamente o testemunho escrito que permanece válido, refletindo o perfeito grego.
- source_word: Ὁ τὸ πολὺ
  choice: Quem tinha muito
  rationale: A construção substantivada indica a pessoa associada a uma quantidade grande. “Tinha muito” é natural no contexto de provisão e não acrescenta à citação paulina um verbo explícito de recolher.
- source_word: ἐπλεόνασεν
  choice: não ficou com excesso
  rationale: O verbo pode indicar abundar ou ter em excesso. A formulação comunica o resultado distributivo e mantém a oposição com “falta” sem sugerir que possuir muito seja, por si só, errado.
- source_word: ὁ τὸ ὀλίγον
  choice: quem tinha pouco
  rationale: Preserva o paralelismo com “quem tinha muito” e não importa explicitamente o ato de recolher presente no contexto de Êxodo.
- source_word: ἠλαττόνησεν
  choice: não ficou com falta
  rationale: Expressa não sofrer deficiência ou carência. A construção paralela a “não ficou com excesso” comunica de modo claro o equilíbrio resultante.
theological_decisions:
- issue: Uso da citação de Êxodo 16:18 por Paulo no contexto de generosidade e igualdade
  choice: Traduzir em termos do resultado da posse e distribuição, sem inserir explicitamente “recolheu”.
  alternative: “Quem recolheu muito não teve sobra, e quem recolheu pouco não teve falta.”
  rationale: Paulo emprega a Escritura para sustentar uma provisão equilibrada entre os fiéis. A tradução principal preserva sua aplicação imediata sem apagar a ligação com Êxodo, apresentada na nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ficou com excesso/falta” reproduz o paralelismo e destaca o resultado da distribuição; a nota conserva a formulação ligada ao recolhimento do maná.
