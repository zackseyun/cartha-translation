  text: But thanks be to God[a], who puts the same earnestness for you into Titus's heart,
translation:
  language: pt
  text: Mas graças a Deus, que põe no coração de Tito a mesma dedicação por vocês,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χάρις δὲ τῷ θεῷ
  choice: Mas graças a Deus
  rationale: A construção idiomática expressa gratidão dirigida a Deus. δέ introduz uma transição levemente contrastiva, bem representada por “Mas”.
- source_word: τῷ διδόντι
  choice: que põe
  rationale: Embora δίδωμι signifique literalmente “dar”, com a imagem do coração o português natural prefere “pôr no coração”, preservando a ideia de Deus produzir essa disposição interior.
- source_word: τὴν αὐτὴν σπουδὴν
  choice: a mesma dedicação
  rationale: σπουδή indica empenho sincero, zelo ou solicitude. “Dedicação” comunica esse envolvimento diligente em português corrente sem restringir o sentido à mera pressa.
- source_word: ὑπὲρ ὑμῶν
  choice: por vocês
  rationale: A expressão indica uma disposição favorável e interessada nos coríntios; “por vocês” é conciso, natural e preserva essa orientação relacional.
- source_word: ἐν τῇ καρδίᾳ Τίτου
  choice: no coração de Tito
  rationale: Mantém a metáfora bíblica do coração como sede da disposição interior. A combinação “põe no coração” é idiomática em português e corresponde ao sentido da construção grega.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vocês” representa naturalmente o plural ὑμῶν. A vírgula final foi preservada porque o versículo continua sintaticamente no contexto seguinte.
