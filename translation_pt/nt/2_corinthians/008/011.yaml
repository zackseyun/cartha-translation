  text: νυνὶ δὲ καὶ τὸ ποιῆσαι ἐπιτελέσατε, ὅπως καθάπερ ἡ προθυμία τοῦ θέλειν οὕτως καὶ τὸ ἐπιτελέσαι ἐκ τοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/011.yaml
  text: But now complete the doing of it also[a], so that just as there was the eagerness to will it[b], so also there may be the completion from what you have.
translation:
  language: pt
  text: Agora, porém, terminem também de realizá-la[a], para que, assim como houve prontidão no querer, haja também a conclusão a partir do que vocês têm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “levem também isso até o fim”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a partir do que vocês têm”; isto é, conforme seus recursos atuais.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Agora, porém
  rationale: Marca a transição para a ação presente e conserva tanto o valor temporal de νυνί como a leve força adversativa de δέ.
- source_word: τὸ ποιῆσαι ἐπιτελέσατε
  choice: terminem também de realizá-la
  rationale: Expressa em português natural a ordem de levar à conclusão a ação já proposta; o pronome retoma a contribuição em discussão no contexto.
- source_word: ὅπως
  choice: para que
  rationale: Preserva a ideia de propósito ou resultado pretendido introduzida pela conjunção.
- source_word: καθάπερ
  choice: assim como
  rationale: Mantém a comparação equilibrada entre a disposição de querer e a efetiva conclusão.
- source_word: ἡ προθυμία τοῦ θέλειν
  choice: a prontidão no querer
  rationale: προθυμία indica disposição pronta e positiva; a formulação conserva o destaque volitivo de θέλειν sem reduzi-lo simplesmente ao fazer.
- source_word: οὕτως καὶ τὸ ἐπιτελέσαι
  choice: haja também a conclusão
  rationale: A oração elíptica exige em português um verbo suprido. A forma nominal preserva o paralelismo e a repetição conceitual de ἐπιτελέω.
- source_word: ἐκ τοῦ ἔχειν
  choice: com o que vocês têm
  rationale: Indica que a conclusão deve proceder dos recursos disponíveis, sem afirmar uma exigência além das posses atuais.
theological_decisions:
- issue: A contribuição em relação aos recursos disponíveis
  choice: A exortação pede que a contribuição prometida seja concluída com os recursos que os destinatários possuem.
  alternative: Entender o versículo como uma exigência geral de cumprir toda boa intenção, independentemente dos meios disponíveis.
  rationale: O contexto imediato trata da coleta, e ἐκ τοῦ ἔχειν limita concretamente sua realização ao que está disponível. A tradução mantém essa orientação prática sem ampliar a afirmação para além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação evita o literalismo pouco natural de “completem o fazer”, mas conserva o paralelismo entre a prontidão interior e a conclusão prática. “Houve” explicita a elipse grega à luz da disposição já demonstrada no contexto.
