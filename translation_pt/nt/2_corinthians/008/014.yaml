reference: 2 Corinthians 8:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν τῷ νῦν καιρῷ τὸ ὑμῶν περίσσευμα εἰς τὸ ἐκείνων ὑστέρημα, ἵνα καὶ τὸ ἐκείνων περίσσευμα γένηται εἰς τὸ ὑμῶν ὑστέρημα, ὅπως γένηται ἰσότης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/014.yaml
  text: At the present time[a], your abundance is for their need, so that their abundance may also be for your need, in order that there may be equality.
translation:
  language: pt
  text: Neste momento, a abundância de vocês é para suprir a necessidade deles, para que também a abundância deles venha a suprir a necessidade de vocês, a fim de que haja igualdade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “justiça”, “equidade” ou “equilíbrio”. Aqui, o termo grego se refere à provisão mútua e equilibrada, não necessariamente a posses idênticas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ νῦν καιρῷ
  choice: Neste momento
  rationale: Expressa o tempo ou a circunstância presente indicada por καιρός, em português natural e sem reduzir a expressão a um mero ponto cronológico.
- source_word: τὸ ὑμῶν περίσσευμα
  choice: a abundância de vocês
  rationale: περίσσευμα designa aquilo que excede a necessidade, aqui provavelmente recursos materiais; “abundância” preserva a amplitude do termo sem restringi-lo apenas a dinheiro.
- source_word: εἰς τὸ ἐκείνων ὑστέρημα
  choice: deve suprir a necessidade deles
  rationale: A construção εἰς com o acusativo aponta para a destinação da abundância em relação ao que falta aos outros. “Suprir a necessidade” comunica isso com clareza; “deve” torna explícita a força exortativa implícita no contexto, sem transformar a frase em simples descrição.
- source_word: ἵνα καὶ
  choice: para que também
  rationale: Mantém tanto a finalidade introduzida por ἵνα quanto a reciprocidade assinalada por καί.
- source_word: τὸ ἐκείνων περίσσευμα γένηται εἰς τὸ ὑμῶν ὑστέρημα
  choice: a abundância deles venha a suprir a necessidade de vocês
  rationale: “Venha a suprir” reflete a possibilidade futura da forma subjuntiva γένηται e reproduz a estrutura recíproca do versículo em português corrente.
- source_word: ὅπως γένηται ἰσότης
  choice: a fim de que haja igualdade
  rationale: “Igualdade” é o equivalente direto de ἰσότης e mantém aberta a nuance contextual de equilíbrio, justiça ou equidade na provisão mútua.
theological_decisions:
- issue: Sentido de ἰσότης no apelo de Paulo à contribuição
  choice: igualdade na provisão mútua
  alternative: justiça, equidade ou equilíbrio
  rationale: O contexto trata de uma comunidade suprindo a necessidade de outra, com possibilidade de reciprocidade futura. A tradução não transforma a expressão em uma teoria abstrata de igualdade econômica nem exige posses idênticas.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para leitura amplamente natural no Brasil. A repetição de “abundância” e “necessidade” preserva o paralelismo recíproco do grego. O marcador da nota foi colocado após “igualdade”, termo ao qual a nota lexical se refere.
