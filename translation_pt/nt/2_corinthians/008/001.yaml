  text: Γνωρίζομεν δὲ ὑμῖν, ἀδελφοί, τὴν χάριν τοῦ θεοῦ τὴν δεδομένην ἐν ταῖς ἐκκλησίαις τῆς Μακεδονίας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/001.yaml
  text: We make known to you[a], brothers, the grace of God that has been given among the churches of Macedonia[b],
translation:
  language: pt
  text: Nós lhes damos a conhecer, irmãos[a], a graça de Deus concedida nas igrejas da Macedônia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «irmãos e irmãs»; o grego diz «irmãos» e muitas vezes emprega a forma masculina para se dirigir a toda a comunidade.
    reason: lexical_alternative
  - marker: b
    text: «A graça de Deus» pode se referir tanto ao favor de Deus quanto à generosidade graciosa que esse favor produziu nas igrejas da Macedônia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζομεν δὲ ὑμῖν
  choice: queremos que vocês conheçam
  rationale: Em português corrente, a fórmula comunica naturalmente o ato de dar conhecimento aos destinatários. O δέ funciona como transição leve e não exige uma palavra separada; começar por «Irmãos» produz uma abertura natural sem criar contraste ou valor temporal ausente.
- source_word: ἀδελφοί
  choice: Irmãos
  rationale: Mantém a forma masculina do vocativo grego e o uso tradicional e natural nas cartas paulinas; uma nota registra que o termo pode abranger toda a comunidade.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: a graça de Deus
  rationale: 'Preserva o termo paulino central e sua amplitude: tanto o favor e a atuação graciosa de Deus quanto a generosidade produzida por essa graça.'
- source_word: τὴν δεδομένην
  choice: concedida
  rationale: O particípio perfeito passivo indica uma graça dada por Deus cujos efeitos permanecem. «Concedida» expressa isso com concisão e dignidade.
- source_word: ἐν ταῖς ἐκκλησίαις
  choice: entre as igrejas
  rationale: ἐν indica aqui a esfera em que a graça atua. «Entre» é natural em português e não restringe a frase a mera localização geográfica.
- source_word: τῆς Μακεδονίας
  choice: da Macedônia
  rationale: Reproduz naturalmente o genitivo que identifica as comunidades cristãs da região.
theological_decisions:
- issue: Sentido de «a graça de Deus» neste contexto
  choice: A atuação graciosa de Deus entre as igrejas macedônias, manifestada em sua generosidade
  alternative: Uma referência específica à oferta beneficente ou, de forma mais geral, ao favor divino concedido a essas igrejas
  rationale: A tradução conserva «graça de Deus» para não reduzir a expressão nem à oferta em si nem a um favor abstrato. Assim permanece a tensão entre a origem divina e seu resultado concreto na generosidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem com o vocativo inicial é natural em português; «vocês» evita regionalismo excessivo e mantém explícitos os destinatários. Todas as notas estão assinaladas no texto.
