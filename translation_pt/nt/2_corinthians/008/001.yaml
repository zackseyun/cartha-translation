  source_fidelity: A paráfrase «queremos que vocês conheçam» comunica a ideia geral, mas acrescenta o elemento volitivo «queremos», que não está expresso em Γνωρίζομεν («damos a conhecer/fazemos saber»). A revisão conserva o ato declarativo do presente indicativo. «Graça de Deus», o particípio passivo «concedida» e a referência às igrejas da Macedônia são adequadamente preservados.
  naturalness: «Nós lhes damos a conhecer, irmãos» é claro, digno e natural em registro epistolar moderno, sem introduzir uma partícula temporal ou contrastiva excessiva para δέ. «Nas igrejas da Macedônia» expressa de modo direto a esfera em que a graça foi concedida/está manifesta.
  terminology: «Irmãos», «graça de Deus», «igrejas» e «Macedônia» são escolhas consistentes com o uso paulino e com o registro solicitado. A nota sobre «irmãos» preserva a alternativa inclusiva sem substituir a forma masculina do texto grego.
