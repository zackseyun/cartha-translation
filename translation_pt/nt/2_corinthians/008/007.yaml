source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ ἐν παντὶ περισσεύετε, πίστει καὶ λόγῳ καὶ γνώσει καὶ πάσῃ σπουδῇ καὶ τῇ ἐξ ⸂ἡμῶν ἐν ὑμῖν⸃ ἀγάπῃ, ἵνα καὶ ἐν ταύτῃ τῇ χάριτι περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/007.yaml
  text: But just as you abound in everything—in faith and speech and knowledge and all diligence and in our love in you—see that you also abound in this grace[a][b].
translation:
  language: pt
  text: Mas, assim como vocês têm abundância em tudo — na fé, no falar, no conhecimento, em toda dedicação e no amor que procede de nós e está em vocês —, também tenham abundância nesta graça[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “no amor de vocês por nós”. A expressão grega é difícil; alguns manuscritos leem “no amor de vocês em nós”.
    reason: alternative_reading
  - marker: b
    text: Isto é, nesta obra graciosa de contribuir.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσεύετε / περισσεύητε
  choice: têm abundância / tenham abundância
  rationale: Preserva em ambas as ocorrências a imagem de abundância e distingue naturalmente, em português, a realidade presente da exortação.
- source_word: ἐν παντί
  choice: em tudo
  rationale: Mantém o alcance abrangente da expressão e introduz naturalmente a lista que se segue.
- source_word: πίστει
  choice: fé
  rationale: É o equivalente direto e contextualmente adequado dentro da lista de qualidades cristãs.
- source_word: λόγῳ
  choice: falar
  rationale: Neste contexto, λόγος provavelmente se refere à expressão verbal ou capacidade de falar; “no falar” é corrente e evita a ambiguidade pouco natural de “na palavra”.
- source_word: γνώσει
  choice: conhecimento
  rationale: Equivalente direto que se ajusta à lista de capacidades e qualidades dos coríntios.
- source_word: πάσῃ σπουδῇ
  choice: toda dedicação
  rationale: Comunica a seriedade, o empenho e a diligência expressos por σπουδή em linguagem portuguesa atual.
- source_word: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: o amor que procede de nós e está em vocês
  rationale: Conserva os dois elementos preposicionais da leitura adotada, sem resolver silenciosamente uma construção grega difícil e textualmente sensível.
- source_word: χάριτι
  choice: graça
  rationale: Preserva a densidade teológica de χάρις, enquanto a nota esclarece sua referência concreta à contribuição generosa.
theological_decisions:
- issue: Sentido de χάρις no contexto da coleta para os santos
  choice: graça
  alternative: obra graciosa de contribuir; dádiva; ato de graça
  rationale: Paulo relaciona a contribuição à graça, e não apenas a uma transação financeira. O texto principal mantém essa dimensão teológica, com esclarecimento em nota.
- issue: Interpretação de τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: o amor que procede de nós e está em vocês
  alternative: o amor de vocês por nós
  rationale: A construção e a tradição manuscrita permitem mais de uma compreensão. A tradução principal segue de perto o texto adotado, e a nota registra a leitura alternativa sem eliminar a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês”. A formulação mantém a repetição semântica de περισσεύω e conserva, de modo deliberado, a relativa estranheza da frase sobre o amor, pois ela reflete uma dificuldade real do texto grego.
