id: 2CO.8.22
reference: 2 Corinthians 8:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ αὐτοῖς τὸν ἀδελφὸν ἡμῶν ὃν ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις σπουδαῖον ὄντα, νυνὶ δὲ πολὺ σπουδαιότερον πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/022.yaml
  text: And we have sent with them our brother[a], whom we have often tested in many matters and found to be diligent, but who is now even more diligent because of his great confidence in you.
translation:
  language: pt
  text: Também enviamos com eles o nosso irmão, que muitas vezes, em muitas situações, comprovamos ser dedicado. Agora ele está ainda mais empenhado, por causa da grande confiança que tem em vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego não declara expressamente de quem é essa confiança. A construção se refere mais naturalmente à grande confiança que esse irmão tem em vocês; também pode ser entendida como a confiança de Paulo e seus colaboradores em vocês.
    reason: Preserva a ambiguidade gramatical quanto ao possuidor implícito de “confiança”.
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: Também enviamos com eles
  rationale: O aoristo apresenta o envio como ação realizada; “com eles” expressa o prefixo σύν-, enquanto “também” representa δέ de modo natural na sequência do discurso.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: o nosso irmão
  rationale: Preserva a linguagem familiar cristã e a referência masculina singular ao colaborador não identificado.
- source_word: ὃν ἐδοκιμάσαμεν
  choice: que ... comprovamos ser
  rationale: δοκιμάζω envolve pôr à prova e reconhecer o caráter demonstrado. “Comprovamos ser” comunica aqui tanto a avaliação quanto seu resultado positivo.
- source_word: ἐν πολλοῖς πολλάκις
  choice: muitas vezes, em muitas situações
  rationale: Mantém tanto a repetição de πολλάκις quanto a variedade de circunstâncias indicada por ἐν πολλοῖς, em português corrente.
- source_word: σπουδαῖον ὄντα
  choice: ser dedicado
  rationale: “Dedicado” comunica diligência e empenho no serviço sem limitar o termo a zelo emocional.
- source_word: νυνὶ δὲ πολὺ σπουδαιότερον
  choice: Agora ele está ainda mais empenhado
  rationale: O comparativo intensificado por πολὺ retoma e eleva a descrição anterior; “ainda mais empenhado” soa natural e preserva a progressão.
- source_word: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: por causa da grande confiança que tem em vocês
  rationale: O dativo é entendido como causal, explicando o empenho aumentado, e εἰς ὑμᾶς indica que a confiança se dirige aos coríntios. O possuidor implícito é explicitado no texto como o irmão, leitura sintaticamente mais natural, com a ambiguidade registrada em nota.
theological_decisions:
- issue: Referente implícito de πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: A grande confiança é a do irmão enviado e explica seu empenho maior.
  alternative: A confiança pode ser entendida como a de Paulo e seus colaboradores nos coríntios.
  rationale: A ligação imediata com σπουδαιότερον favorece o irmão como sujeito implícito da confiança, mas o grego não traz pronome possessivo; por isso, a alternativa não deve ser ocultada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Vocês” representa o plural ὑμᾶς sem regionalismo marcado. A divisão em duas frases reduz a sobrecarga sintática sem alterar as relações do grego.
