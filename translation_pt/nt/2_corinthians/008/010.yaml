  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ γνώμην ἐν τούτῳ δίδωμι· τοῦτο γὰρ ὑμῖν συμφέρει, οἵτινες οὐ μόνον τὸ ποιῆσαι ἀλλὰ καὶ τὸ θέλειν προενήρξασθε ἀπὸ πέρυσι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/010.yaml
  text: 'And in this matter I give my judgment: for this is beneficial for you[b][a], who began last year not only to do it but also to will it.'
translation:
  language: pt
  text: E, sobre esta questão, dou a minha opinião[a], pois isso é proveitoso para vocês, que no ano passado começaram não somente a fazer, mas também a querer fazê-lo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parecer” ou “conselho”. Paulo apresenta uma recomendação ponderada, em vez de formulá-la como ordem.
    reason: lexical_alternative
  - marker: b
    text: Ou “a estar dispostos a fazê-lo”. O grego distingue a vontade ou disposição da realização efetiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώμην
  choice: opinião
  rationale: Expressa uma avaliação ponderada e, no contexto, distingue a recomendação de Paulo de uma ordem direta. Em português atual, “dou a minha opinião” é natural e mantém a seriedade sem sugerir decreto.
- source_word: ἐν τούτῳ
  choice: sobre esta questão
  rationale: Identifica naturalmente o assunto em discussão, a coleta, sem acrescentá-lo explicitamente ao texto.
- source_word: δίδωμι
  choice: dou
  rationale: Reproduz de modo direto o presente do indicativo e forma uma expressão idiomática com “opinião”.
- source_word: συμφέρει
  choice: é proveitoso
  rationale: Transmite aquilo que convém ou traz benefício, sem limitar o sentido a lucro material.
- source_word: οἵτινες
  choice: vocês, que
  rationale: Preserva a construção relativa que caracteriza os coríntios por sua iniciativa anterior.
- source_word: τὸ ποιῆσαι
  choice: a fazer
  rationale: Refere-se à realização efetiva da iniciativa já conhecida pelo contexto; o complemento permanece implícito como no grego.
- source_word: τὸ θέλειν
  choice: a querer fazê-lo
  rationale: Torna clara a dimensão volitiva e a distingue da execução efetiva, em português natural.
- source_word: προενήρξασθε
  choice: começaram
  rationale: Preserva o sentido principal de iniciar; a anterioridade já é comunicada pela expressão temporal seguinte.
- source_word: ἀπὸ πέρυσι
  choice: desde o ano passado
  rationale: Representa de perto a construção com ἀπό e indica o ponto anterior em que a iniciativa começou, sem afirmar necessariamente que a ação se manteve sem interrupção.
theological_decisions:
- issue: Força da declaração de Paulo em relação à autoridade apostólica
  choice: Paulo apresenta uma opinião ponderada ou recomendação, não formula aqui uma ordem direta.
  alternative: Paulo emite uma diretiva autoritativa.
  rationale: O contexto imediato contrasta a forma de ordem com a apresentação de γνώμη (8:8,10). “Opinião” preserva o caráter de conselho ponderado sem reduzir sua seriedade apostólica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “não somente a fazer, mas também a querer fazê-lo” foi preservada apesar de ser inesperada, pois corresponde ao grego e mantém sua tensão retórica. Os marcadores foram colocados junto aos termos que explicam.
