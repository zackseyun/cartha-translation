  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἴτε ὑπὲρ Τίτου, κοινωνὸς ἐμὸς καὶ εἰς ὑμᾶς συνεργός· εἴτε ἀδελφοὶ ἡμῶν, ἀπόστολοι ἐκκλησιῶν, δόξα Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/023.yaml
  text: As for Titus[a], he is my partner and fellow worker for you; as for our brothers, they are messengers of the churches[b], the glory of Messiah.
translation:
  language: pt
  text: Quanto a Tito, ele é meu companheiro e cooperador para vocês; quanto a nossos irmãos, eles são mensageiros das igrejas[a], a glória do Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “apóstolos das igrejas”. A palavra grega pode designar apóstolos em sentido amplo ou mensageiros e delegados comissionados; neste contexto, provavelmente se refere a representantes das igrejas.
    reason: alternative_reading
  - marker: b
    text: Ou “a glória de Cristo”. Aqui, “Messias” traduz Χριστός como título.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ὑπὲρ Τίτου
  choice: Quanto a Tito
  rationale: A construção elíptica introduz dois casos paralelos. “Quanto a” expressa de modo natural a função discursiva de ὑπέρ, aqui no sentido de “a respeito de”.
- source_word: κοινωνὸς ἐμὸς
  choice: meu companheiro
  rationale: κοινωνός designa alguém que participa ou compartilha de uma atividade. “Companheiro” preserva o vínculo pessoal e ministerial sem sugerir uma parceria comercial.
- source_word: εἰς ὑμᾶς συνεργός
  choice: cooperador em favor de vocês
  rationale: συνεργός indica alguém que trabalha junto, e εἰς ὑμᾶς direciona esse trabalho aos coríntios. A formulação é natural em português e evita ampliar a expressão para “para o bem de vocês”.
- source_word: ἀδελφοὶ ἡμῶν
  choice: nossos irmãos
  rationale: O masculino plural refere-se, neste contexto, aos homens enviados como representantes das igrejas; por isso, mantém-se “irmãos”.
- source_word: ἀπόστολοι ἐκκλησιῶν
  choice: mensageiros das igrejas
  rationale: ἀπόστολοι pode indicar enviados ou delegados comissionados. O genitivo “das igrejas” e o contexto da coleta favorecem representantes congregacionais, sem exigir o sentido técnico de “apóstolos”.
- source_word: δόξα Χριστοῦ
  choice: a glória do Messias
  rationale: A expressão nominal e aposicional descreve os irmãos como manifestação ou honra do Messias. “Messias” traduz Χριστός como título, enquanto a nota registra a forma tradicional “Cristo”.
theological_decisions:
- issue: Sentido de ἀπόστολοι aplicado aos irmãos não nomeados
  choice: mensageiros das igrejas
  alternative: apóstolos das igrejas
  rationale: O contexto apresenta representantes ligados à oferta e enviados pelas congregações. A tradução evita atribuir-lhes, sem necessidade textual, o ofício apostólico em sentido técnico, mas preserva a alternativa em nota.
- issue: Tradução de Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: Χριστός funciona como título e corresponde semanticamente a “Messias”. A forma tradicional “Cristo” permanece indicada em nota.
- issue: Força da expressão δόξα Χριστοῦ
  choice: a glória do Messias
  alternative: uma honra para o Messias
  rationale: O genitivo permite alguma tensão entre glória que pertence ao Messias, glória que o manifesta e honra prestada a ele. A tradução formal preserva a formulação nominal sem escolher silenciosamente uma paráfrase causal ou resultativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “vocês” para legibilidade brasileira e internacional. O paralelismo “quanto a... quanto a...” reproduz a estrutura retórica do grego. O artigo antes de “glória” torna a aposição natural em português sem acrescentar verbo explicativo.
