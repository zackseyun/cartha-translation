review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente o envio conjunto, a referência a um irmão específico e a relação não especificada do seu louvor com o evangelho. Contudo, «se estende por todas as igrejas» atribui ao «louvor» uma ação pouco idiomática em português. Uma formulação estática de reconhecimento público expressa melhor o alcance de διὰ πασῶν τῶν ἐκκλησιῶν sem restringir indevidamente a nuance.
  naturalness: «E enviamos com ele o irmão cujo louvor no evangelho é conhecido em todas as igrejas» é claro, moderno e natural em português internacional. Mantém o registro paulino sem introduzir linguagem técnica ou uma identificação conjectural do irmão.
  terminology: «Irmão», «louvor», «evangelho» e «igrejas» são equivalentes adequados e consistentes. «Louvor» traduz diretamente ἔπαινος; a nota preserva «recomendação» como alternativa possível. A expressão «no evangelho» deve permanecer, pois o grego não determina se a referência é à pregação, ao serviço ou a outra relação com o evangelho.
  issues:
