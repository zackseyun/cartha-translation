    issue: 'Construção pouco natural: «cujo louvor no evangelho se estende por todas as igrejas».'
    rationale: Embora comunique a difusão pretendida, em português «louvor se estende» soa menos idiomático e pode sugerir uma expansão abstrata do louvor. «É conhecido em todas as igrejas» comunica naturalmente o reconhecimento difundido e conserva a abertura semântica de διά com o genitivo.
