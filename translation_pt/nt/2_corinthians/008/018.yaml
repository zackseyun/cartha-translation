source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ μετ’ αὐτοῦ τὸν ἀδελφὸν οὗ ὁ ἔπαινος ἐν τῷ εὐαγγελίῳ διὰ πασῶν τῶν ἐκκλησιῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/018.yaml
  text: And we sent with him the brother whose praise in the gospel is throughout all the churches—[a]
translation:
  language: pt
  text: E enviamos com ele o irmão cujo louvor no evangelho é conhecido em todas as igrejas—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cuja recomendação no evangelho é reconhecida entre todas as igrejas”.'
    reason: Registra a possibilidade de entender ἔπαινος como recomendação ou reconhecimento, e διά como presença entre as igrejas.
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: enviamos com ele
  rationale: O aoristo apresenta o envio como ação realizada, e o elemento σύν indica acompanhamento. A formulação é direta e natural em português.
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ funciona como conectivo brando que dá continuidade ao relato, sem exigir contraste forte.
- source_word: τὸν ἀδελφόν
  choice: o irmão
  rationale: O artigo e o substantivo masculino singular apontam para um cristão específico, conhecido no contexto. A tradução não acrescenta “nosso”, ausente no grego.
- source_word: οὗ ὁ ἔπαινος
  choice: cujo louvor
  rationale: Preserva a construção nominal e relativa do grego sem transformá-la numa descrição mais interpretativa.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: no evangelho
  rationale: Mantém aberta a relação exata entre o elogio do irmão e o evangelho, sem acrescentar ideias específicas como pregação, cargo ou trabalho ministerial.
- source_word: διὰ πασῶν τῶν ἐκκλησιῶν
  choice: se estende por todas as igrejas
  rationale: Comunica a extensão do reconhecimento através do conjunto das igrejas e produz uma frase compreensível em português.
- source_word: ἐκκλησιῶν
  choice: igrejas
  rationale: É o equivalente corrente e claro para as comunidades cristãs locais no uso paulino.
theological_decisions:
- issue: Identidade e condição de ἀδελφός
  choice: “o irmão”, como referência a um colaborador cristão específico do sexo masculino
  alternative: “um irmão na fé” ou “um companheiro cristão”
  rationale: O masculino singular com artigo, no contexto de uma delegação de viagem, indica uma pessoa específica. A tradução preserva essa referência sem generalizá-la.
- issue: Sentido de ἐν τῷ εὐαγγελίῳ
  choice: “no evangelho”, sem definir a atividade pela qual ele era elogiado
  alternative: “por sua pregação do evangelho” ou “por seu trabalho em favor do evangelho”
  rationale: O grego relaciona o louvor ao evangelho, mas não declara explicitamente que se trate de pregação, de um ofício ou de uma modalidade específica de serviço. A formulação preserva essa abertura.
- issue: Nuance de ἔπαινος e alcance de διά
  choice: “cujo louvor... se estende por todas as igrejas”
  alternative: “cuja recomendação... é reconhecida entre todas as igrejas”
  rationale: “Louvor” representa o sentido mais direto de ἔπαινος, enquanto “se estende por” expressa a ampla difusão desse reconhecimento sem decidir se διά enfatiza circulação ou presença entre as igrejas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva a construção compacta e a ambiguidade da relação entre o irmão, seu louvor e o evangelho. O travessão final reproduz a continuidade sintática do texto fornecido.
