  text: ⸂προνοοῦμεν γὰρ⸃ καλὰ οὐ μόνον ἐνώπιον κυρίου ἀλλὰ καὶ ἐνώπιον ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/021.yaml
  text: For we take thought for what is good[a], not only before the Lord but also before people.
translation:
  language: pt
  text: Pois nos preocupamos em fazer o que é bom[a], não somente diante do Senhor, mas também diante das pessoas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o que é honroso” ou “o que é correto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προνοοῦμεν
  choice: nos preocupamos em fazer
  rationale: O verbo προνοέω expressa dar atenção antecipada, cuidar ou tomar providências. No contexto da administração responsável da coleta, a formulação comunica cuidado deliberado com uma conduta correta, em português natural.
- source_word: γὰρ
  choice: Pois
  rationale: γάρ introduz a razão ou explicação do que precede; “Pois” preserva de modo conciso o vínculo argumentativo.
- source_word: καλὰ
  choice: o que é bom
  rationale: O neutro plural καλὰ pode designar aquilo que é bom, correto ou honroso. A opção principal mantém o sentido moral amplo, sem restringi-lo à reputação pública.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: não somente ... mas também
  rationale: A construção correlativa é preservada com seu equilíbrio e sua ênfase.
- source_word: ἐνώπιον
  choice: diante de
  rationale: A expressão significa “perante” ou “à vista de”. “Diante de” é clara, digna e funciona naturalmente nas duas ocorrências.
- source_word: κυρίου
  choice: do Senhor
  rationale: κύριος é traduzido por “Senhor”, com o artigo exigido pela construção portuguesa.
- source_word: ἀνθρώπων
  choice: das pessoas
  rationale: ἄνθρωποι tem referência humana genérica, não especificamente masculina; “pessoas” reproduz essa abrangência em português atual.
theological_decisions:
- issue: Nuance ética de καλὰ no contexto da prestação de contas financeira
  choice: o que é bom
  alternative: o que é honroso; o que é correto
  rationale: O texto enfatiza uma conduta recomendável tanto perante o Senhor quanto perante observadores humanos. O grego permite um sentido moral amplo ou uma ênfase mais específica na honra e na integridade pública; o texto principal preserva a amplitude, e a nota registra as alternativas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Nos preocupamos em fazer” comunica a ideia contextual de cuidado deliberado sem recorrer ao pouco natural “tomamos pensamento”. O paralelismo grego foi mantido.
