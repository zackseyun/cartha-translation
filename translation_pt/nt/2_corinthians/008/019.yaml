id: 2CO.8.19
reference: 2 Corinthians 8:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἀλλὰ καὶ χειροτονηθεὶς ὑπὸ τῶν ἐκκλησιῶν συνέκδημος ἡμῶν ⸀σὺν τῇ χάριτι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν πρὸς τὴν ⸀αὐτοῦ τοῦ κυρίου δόξαν καὶ προθυμίαν ἡμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/019.yaml
  text: And not only that[d][c][b][a], but he was also appointed by the churches as our traveling companion with this gracious gift that is being administered by us for the glory of the Lord himself and our eagerness—
translation:
  language: pt
  text: E não somente isso[d], mas ele também foi designado[a] pelas igrejas como nosso companheiro de viagem com esta dádiva[b], que está sendo administrada por nós para a glória do próprio Senhor[c] e para a nossa prontidão—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «escolhido» ou «eleito» pelas igrejas.
    reason: lexical_alternative
  - marker: b
    text: Ou «com esta graça»; neste contexto da coleta, «dádiva» traduz χάρις como uma oferta graciosa concreta.
    reason: lexical_alternative
  - marker: c
    text: Ou «para a glória do seu Senhor» ou «para a glória do Senhor»; a construção grega também pode ser entendida como «a glória do Senhor».
    reason: alternative_reading
  - marker: d
    text: Ou «como nosso companheiro de viagem com esta dádiva».
    reason: previous_rendering
lexical_decisions:
- source_word: χειροτονηθεὶς
  choice: designado
  rationale: Expressa que as igrejas o escolheram para a função sem impor a ideia moderna de uma eleição formal.
- source_word: ἐκκλησιῶν
  choice: igrejas
  rationale: É o termo corrente e contextualmente adequado para as comunidades cristãs no uso paulino.
- source_word: συνέκδημος
  choice: companheiro de viagem
  rationale: Comunica de modo natural que ele acompanharia Paulo e seus cooperadores na viagem ligada à coleta.
- source_word: χάριτι
  choice: dádiva da graça
  rationale: No contexto, χάρις aponta para a oferta concreta, sem perder sua qualidade de expressão da graça.
- source_word: διακονουμένῃ
  choice: é administrada
  rationale: Descreve adequadamente a gestão responsável da oferta por Paulo e seus companheiros.
- source_word: πρὸς
  choice: para
  rationale: Indica a finalidade ou o objetivo da administração da oferta.
- source_word: αὐτοῦ τοῦ κυρίου
  choice: do próprio Senhor
  rationale: Toma αὐτοῦ em sentido intensivo, preservando a ênfase da construção grega.
- source_word: δόξαν
  choice: glória
  rationale: Mantém o termo paulino tradicional e seu peso teológico.
- source_word: προθυμίαν
  choice: boa vontade
  rationale: Expressa disposição voluntária e zelosa sem acrescentar um objeto ausente no grego.
theological_decisions:
- issue: Força e referente de αὐτοῦ em πρὸς τὴν αὐτοῦ τοῦ κυρίου δόξαν
  choice: a glória do próprio Senhor
  alternative: a glória do seu Senhor; a glória do Senhor
  rationale: A leitura intensiva produz português natural e ressalta que a finalidade é a glória do Senhor, enquanto a nota preserva a ambiguidade sintática real.
- issue: Relação de προθυμίαν ἡμῶν com a finalidade da administração
  choice: para demonstrar nossa boa vontade
  alternative: para nossa boa vontade; e nossa prontidão
  rationale: O verbo 'demonstrar' explicita em português a relação final indicada por πρὸς sem especificar além do texto em que consistia essa disposição.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva o travessão final por o período continuar no versículo seguinte. Os marcadores [a], [b] e [c] devem acompanhar, respectivamente, “designado”, “dádiva da graça” e “próprio Senhor” no texto principal.
