  text: τὴν οὖν ἔνδειξιν τῆς ἀγάπης ὑμῶν καὶ ἡμῶν καυχήσεως ὑπὲρ ὑμῶν εἰς αὐτοὺς ⸀ἐνδεικνύμενοι εἰς πρόσωπον τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/024.yaml
  text: Therefore[b][a], show them before the churches the proof of your love and of our boasting about you.
translation:
  language: pt
  text: Portanto, mostrem a eles a prova[a] do amor de vocês e do nosso orgulho por vocês, diante das igrejas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “demonstração” ou “evidência” do amor de vocês.
    reason: lexical_alternative
  - marker: b
    text: A expressão indica uma demonstração pública perante os representantes das igrejas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειξιν
  choice: prova
  rationale: O termo designa uma manifestação ou evidência que torna algo claro. “Prova” é conciso e, no contexto, aponta para a confirmação concreta do amor dos coríntios.
- source_word: ἀγάπης
  choice: amor
  rationale: Equivalente corrente de ἀγάπη; aqui se trata de amor relacional demonstrado por uma ação concreta.
- source_word: καυχήσεως
  choice: orgulho
  rationale: Neste contexto, καύχησις se refere ao modo positivo como Paulo falava dos coríntios. “Orgulho” comunica isso naturalmente em português sem eliminar a força retórica do termo.
- source_word: ὑπὲρ ὑμῶν
  choice: a respeito de vocês
  rationale: Com καύχησις, a expressão indica que os coríntios eram o assunto ou objeto do orgulho de Paulo.
- source_word: εἰς αὐτοὺς
  choice: a eles
  rationale: Retoma os irmãos, representantes das igrejas, mencionados no contexto imediato.
- source_word: ἐνδεικνύμενοι
  choice: mostrem
  rationale: O particípio tem força imperativa no contexto. “Mostrem” é claro, atual e preserva a ideia de tornar algo evidente.
- source_word: εἰς πρόσωπον
  choice: diante de
  rationale: A expressão idiomática indica uma demonstração pública na presença das igrejas ou de seus representantes.
- source_word: τῶν ἐκκλησιῶν
  choice: das igrejas
  rationale: Em Paulo, ἐκκλησίαι normalmente designa comunidades cristãs locais; “igrejas” é a forma corrente e clara em português.
- source_word: οὖν
  choice: Portanto
  rationale: Marca a conclusão prática decorrente da recomendação e do apelo anteriores.
theological_decisions: []
