  text: τίς ἀσθενεῖ, καὶ οὐκ ἀσθενῶ; τίς σκανδαλίζεται καὶ οὐκ ἐγὼ πυροῦμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/029.yaml
  text: Who is weak[a], and I am not weak? Who is caused to stumble, and I do not burn with indignation?
translation:
  language: pt
  text: Quem é fraco, sem que eu também seja fraco? Quem é levado a tropeçar, sem que eu arda por dentro?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “e eu não ardo?”. A metáfora grega pode expressar intensa dor, indignação ou zelo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενεῖ / ἀσθενῶ
  choice: está fraco / me sinta fraco
  rationale: ἀσθενέω tem sentido amplo de fraqueza física, social ou espiritual. A formulação preserva essa amplitude e expressa naturalmente a solidariedade empática de Paulo.
- source_word: σκανδαλίζεται
  choice: é levado a tropeçar
  rationale: O passivo preserva a ideia de alguém ser induzido ao tropeço moral ou espiritual, sem limitar o resultado a ofensa, pecado ou queda definitiva.
- source_word: πυροῦμαι
  choice: fique abrasado por dentro
  rationale: Mantém a metáfora do fogo e comunica intensa agitação interior sem definir indevidamente se se trata de indignação, dor ou zelo.
- source_word: τίς
  choice: Quem
  rationale: Introduz naturalmente em português as duas perguntas retóricas referentes a pessoas.
- source_word: καὶ οὐκ ἐγὼ
  choice: sem que eu também
  rationale: Em português, esta construção transmite com naturalidade a participação enfática de Paulo na fraqueza e no sofrimento alheios.
theological_decisions:
- issue: Natureza da reação de Paulo em πυροῦμαι
  choice: Preservar a metáfora como “fique abrasado por dentro”, sem determinar uma emoção única.
  alternative: “arder de indignação”, “arder de tristeza” ou “ficar profundamente perturbado”
  rationale: O grego expressa intenso envolvimento interior, mas não identifica inequivocamente indignação, tristeza ou zelo. A tradução mantém essa tensão pastoral e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Está fraco” evita restringir ἀσθενέω a doença; “levado a tropeçar” conserva a metáfora moral; “abrasado por dentro” preserva a imagem de πυροῦμαι em linguagem natural.
