  text: τρὶς ἐραβδίσθην, ἅπαξ ἐλιθάσθην, τρὶς ἐναυάγησα, νυχθήμερον ἐν τῷ βυθῷ πεποίηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/025.yaml
  text: Three times I was beaten with rods[a], once I was stoned, three times I was shipwrecked; I have spent a night and a day in the deep.
translation:
  language: pt
  text: Três vezes fui espancado com varas, uma vez fui apedrejado, três vezes sofri naufrágio; passei uma noite e um dia no mar profundo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em alto-mar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τρὶς
  choice: três vezes
  rationale: Equivalente adverbial direto e natural, mantido nas duas ocorrências.
- source_word: ἐραβδίσθην
  choice: fui espancado com varas
  rationale: O passivo de ῥαβδίζω indica especificamente uma surra com varas; a tradução explicita o instrumento e preserva a violência da ação.
- source_word: ἅπαξ
  choice: uma vez
  rationale: Forma corrente em português para indicar uma única ocorrência.
- source_word: ἐλιθάσθην
  choice: fui apedrejado
  rationale: Equivalente conciso e consagrado de λιθάζω no contexto de agressão com pedras.
- source_word: ἐναυάγησα
  choice: sofri naufrágio
  rationale: Expressão idiomática em português que comunica diretamente a experiência indicada por ναυαγέω.
- source_word: νυχθήμερον
  choice: uma noite e um dia
  rationale: Preserva a ordem do composto grego e evita a precisão interpretativa de 'vinte e quatro horas'.
- source_word: ἐν τῷ βυθῷ
  choice: em alto-mar
  rationale: No contexto, βυθός designa o mar profundo ou aberto; 'em alto-mar' é natural e inteligível, sem sugerir que Paulo permaneceu literalmente submerso.
- source_word: πεποίηκα
  choice: passei
  rationale: Com uma expressão temporal, ποιέω pode significar passar ou permanecer durante certo período; o perfeito grego apresenta a experiência retrospectivamente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo preservado na repetição de “três vezes”. A pontuação mantém o ritmo cumulativo do relato.
