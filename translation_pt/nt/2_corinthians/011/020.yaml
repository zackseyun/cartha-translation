base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/020.yaml
  text: For you put up with it if someone enslaves you[a], if someone devours you, if someone takes from you, if someone exalts himself[b], if someone strikes you in the face.
translation:
  language: pt
  text: Pois vocês suportam[a] se alguém os escraviza, se alguém os devora, se alguém lhes toma algo[b], se alguém se exalta, se alguém lhes bate no rosto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: toleram; ou: aguentam.'
    reason: lexical_alternative
  - marker: b
    text: 'Lit.: toma. O verbo grego não declara o que é tomado; neste contexto, provavelmente indica algum tipo de exploração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέχεσθε
  choice: vocês suportam
  rationale: O presente descreve a tolerância efetiva dos coríntios diante de pessoas abusivas. “Suportam” é natural, mantém o tom de censura irônica e não acrescenta um objeto ausente no grego.
- source_word: γὰρ
  choice: Pois
  rationale: Preserva a função explicativa da frase em relação ao argumento anterior.
- source_word: εἴ τις
  choice: se alguém
  rationale: A repetição foi mantida em cada oração para conservar a estrutura condicional e a força retórica do grego.
- source_word: καταδουλοῖ
  choice: os escraviza
  rationale: Conserva de modo direto a ideia forte de reduzir alguém à escravidão ou sujeição, sem suavizá-la.
- source_word: κατεσθίει
  choice: os devora
  rationale: Mantém a imagem vívida e predatória do verbo, empregado metaforicamente para exploração destrutiva.
- source_word: λαμβάνει
  choice: toma o que é de vocês
  rationale: O verbo grego é amplo e não explicita aqui aquilo que é tomado. A formulação portuguesa comunica a apropriação exploradora sugerida pelo contexto sem limitá-la a dinheiro ou a outro bem específico.
- source_word: ἐπαίρεται
  choice: se exalta
  rationale: Preserva a nuance reflexiva de alguém que se eleva ou age com arrogância.
- source_word: εἰς πρόσωπον ὑμᾶς δέρει
  choice: lhes bate no rosto
  rationale: Expressão corrente e concreta que preserva tanto a agressão quanto a humilhação, sem restringir o golpe a uma bofetada.
theological_decisions:
- issue: Tom retórico da declaração de Paulo
  choice: A frase permanece como censura irônica à tolerância dos coríntios diante de abusadores, sem identificá-los explicitamente no versículo.
  alternative: Acrescentar no texto uma identificação como “falsos apóstolos” ou “falsos mestres”.
  rationale: O contexto aponta para os adversários de Paulo e sustenta o tom irônico, mas este versículo apenas enumera seus atos. Não se acrescenta ao texto uma identificação que o grego não expressa aqui.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “se alguém” conserva o ritmo acusatório do original; “vocês” evita ambiguidade de número, e “lhes bate no rosto” soa natural sem perder a concretude da agressão.
