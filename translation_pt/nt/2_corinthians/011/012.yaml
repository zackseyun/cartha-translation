review_pass:
  verdict: revise
  source_fidelity: A tradução preserva a estrutura argumentativa, a repetição de ἀφορμή e a neutralidade de “oportunidade”. Contudo, “sejam considerados iguais a nós” desloca εὑρεθῶσιν (“sejam encontrados/achados”) para um juízo explícito de terceiros. Uma formulação com “encontrados” mantém melhor o passivo e a imagem do original.
  naturalness: O texto é claro e de registro moderno. “Sejam encontrados iguais a nós” é compreensível em português bíblico moderno e está mais próximo do grego; “tirar-lhes a oportunidade” é natural e preserva claramente que a oportunidade é retirada daqueles que a procuram.
  terminology: “Oportunidade” é uma escolha lexical adequada e coerente nas duas ocorrências de ἀφορμή. A nota corretamente registra “ocasião” e “pretexto” como alternativas e deixa claro que se aplicam às duas ocorrências.
  issues:
  - severity: medium
    issue: “sejam considerados iguais a nós” para εὑρεθῶσιν καθὼς καὶ ἡμεῖς
    rationale: “Considerados” introduz mais nitidamente a noção de avaliação ou opinião, enquanto o passivo de εὑρίσκω é mais diretamente “ser encontrado”. “Iguais” é aceitável como explicitação elíptica, mas deve ser associado a um verbo que preserve o passivo do original.
  - severity: low
    issue: “eliminar a oportunidade daqueles” para ἐκκόψω τὴν ἀφορμὴν τῶν θελόντων ἀφορμήν
    rationale: “Eliminar” comunica o sentido geral, mas “tirar-lhes a oportunidade” exprime com mais clareza a relação de privação indicada pelo genitivo e conserva melhor a força concreta de ἐκκόπτω.
