  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὃ δὲ ποιῶ καὶ ποιήσω, ἵνα ἐκκόψω τὴν ἀφορμὴν τῶν θελόντων ἀφορμήν, ἵνα ἐν ᾧ καυχῶνται εὑρεθῶσιν καθὼς καὶ ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/012.yaml
  text: But what I am doing[a], I will continue to do, in order to cut off the opportunity from those who want an opportunity, so that in what they boast about they may be found to be just as we are.
translation:
  language: pt
  text: Mas o que estou fazendo continuarei a fazer, a fim de tirar-lhes a oportunidade[a], àqueles que querem uma oportunidade, para que, naquilo de que se orgulham, sejam encontrados iguais a nós.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ocasião” ou “pretexto”, nas duas ocorrências de “oportunidade” (grego ἀφορμή).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ δὲ ποιῶ καὶ ποιήσω
  choice: Mas o que estou fazendo, continuarei a fazer
  rationale: O presente seguido do futuro expressa a prática atual de Paulo e sua decisão de mantê-la. A formulação é natural em português e explicita a continuidade implícita.
- source_word: ἐκκόψω
  choice: eliminar
  rationale: 'Embora o verbo possa significar literalmente “cortar”, aqui é metafórico: Paulo pretende retirar dos adversários a oportunidade que procuram. “Eliminar” comunica esse sentido com clareza.'
- source_word: ἀφορμή
  choice: oportunidade
  rationale: O substantivo pode designar oportunidade, ocasião ou pretexto. “Oportunidade” preserva a amplitude lexical e evita determinar se os adversários buscavam uma abertura real ou apenas um pretexto.
- source_word: τῶν θελόντων ἀφορμήν
  choice: daqueles que querem uma oportunidade
  rationale: Mantém a repetição enfática de ἀφορμή e traduz diretamente o particípio θελόντων, sem acrescentar uma avaliação moral não exigida pelo substantivo.
- source_word: ἐν ᾧ καυχῶνται
  choice: naquilo de que se orgulham
  rationale: Expressa naturalmente em português a matéria ou esfera da vanglória dos adversários.
- source_word: εὑρεθῶσιν καθὼς καὶ ἡμεῖς
  choice: sejam considerados iguais a nós
  rationale: O passivo εὑρεθῶσιν tem o sentido de serem achados ou reconhecidos de determinada maneira. “Considerados” é idiomático, enquanto “iguais a nós” preserva a comparação sem explicar em que aspecto ela se dá.
theological_decisions:
- issue: Natureza da ἀφορμή buscada pelos adversários de Paulo
  choice: Traduzir de modo neutro como “oportunidade” no texto principal.
  alternative: “pretexto” ou “ocasião”
  rationale: O contexto é polêmico, mas ἀφορμή não exige por si só a leitura moralmente carregada de “pretexto”. A tradução neutra preserva a ambiguidade lexical, e a nota registra as alternativas.
- issue: Aspecto preciso em que os adversários desejam ser comparados a Paulo e seus cooperadores
  choice: 'Manter a comparação sem especificar o seu objeto: “iguais a nós”.'
  alternative: Explicitar que se trata de condições de trabalho, sustento financeiro ou credenciais apostólicas.
  rationale: O versículo não nomeia expressamente o aspecto da comparação. Especificá-lo no texto resolveria uma referência que deve ser entendida a partir do contexto mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “oportunidade” foi preservada por refletir a repetição deliberada no grego. A nota foi colocada na primeira ocorrência e explicitamente se aplica às duas.
