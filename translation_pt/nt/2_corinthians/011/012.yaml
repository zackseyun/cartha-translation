- from: Mas o que estou fazendo, continuarei a fazer, a fim de eliminar a oportunidade[a] daqueles que querem uma oportunidade, para que, naquilo de que se orgulham, sejam considerados iguais a nós.
  to: Mas o que estou fazendo continuarei a fazer, a fim de tirar-lhes a oportunidade[a], àqueles que querem uma oportunidade, para que, naquilo de que se orgulham, sejam encontrados iguais a nós.
  rationale: A revisão mantém as escolhas centrais do rascunho — especialmente a repetição de “oportunidade” e a ambiguidade não doutrinária de ἀφορμή —, mas aproxima a tradução do passivo εὑρεθῶσιν por “sejam encontrados”. “Tirar-lhes a oportunidade” torna explícita, sem acréscimo interpretativo, a privação dirigida aos que desejam tal oportunidade.
