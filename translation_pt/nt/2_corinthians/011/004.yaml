reference: 2 Corinthians 11:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ μὲν γὰρ ὁ ἐρχόμενος ἄλλον Ἰησοῦν κηρύσσει ὃν οὐκ ἐκηρύξαμεν, ἢ πνεῦμα ἕτερον λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ εὐαγγέλιον ἕτερον ὃ οὐκ ἐδέξασθε, καλῶς ⸀ἀνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/004.yaml
  text: For if someone comes and proclaims another Jesus[a], whom we did not proclaim, or if you receive a different spirit, which you did not receive, or a different gospel, which you did not accept[c][b], you put up with it well enough.
translation:
  language: pt
  text: Pois, se alguém chega e proclama outro Jesus, que nós não proclamamos, ou se vocês recebem um espírito diferente, que não receberam, ou um evangelho diferente, que não aceitaram, vocês toleram isso muito bem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão “vocês toleram isso muito bem” é provavelmente irônica: Paulo censura os coríntios por acolherem com demasiada facilidade essas alegações e mensagens rivais.'
    reason: ironia contextual
lexical_decisions:
- source_word: ὁ ἐρχόμενος
  choice: alguém chega
  rationale: O particípio presente substantivado refere-se genericamente a uma pessoa que chega até os coríntios; a formulação é natural em português e preserva essa indefinição contextual.
- source_word: ἄλλον Ἰησοῦν
  choice: outro Jesus
  rationale: ἄλλος é adequadamente representado por “outro”; a expressão conserva a ideia de uma proclamação rival que emprega o nome de Jesus, mas apresenta uma figura distinta.
- source_word: κηρύσσει / ἐκηρύξαμεν
  choice: proclama / não proclamamos
  rationale: “Proclamar” expressa o anúncio público indicado por κηρύσσω e mantém a repetição lexical do grego.
- source_word: πνεῦμα ἕτερον
  choice: um espírito diferente
  rationale: ἕτερος destaca aqui o contraste qualitativo; “diferente” mantém o referente de “espírito” sem o definir além do texto.
- source_word: λαμβάνετε / ἐλάβετε
  choice: recebem / não receberam
  rationale: “Receber” corresponde naturalmente a λαμβάνω e preserva o contraste verbal com δέχομαι na oração seguinte.
- source_word: εὐαγγέλιον ἕτερον
  choice: um evangelho diferente
  rationale: “Evangelho” é o equivalente corrente de εὐαγγέλιον, e “diferente” comunica a força contrastiva de ἕτερον.
- source_word: ἐδέξασθε
  choice: não aceitaram
  rationale: “Aceitar” transmite a acolhida implicada por δέχομαι e evita apagar a distinção em relação a λαμβάνω, traduzido por “receber”.
- source_word: καλῶς ἀνέχεσθε
  choice: vocês o toleram muito bem
  rationale: “Tolerar” expressa ἀνέχομαι; “muito bem” preserva καλῶς e permite que a ironia seja percebida no contexto, sem inseri-la diretamente no corpo do versículo.
- source_word: εἰ μὲν γὰρ
  choice: Pois, se
  rationale: A formulação reproduz a conexão explicativa de γάρ e introduz de modo idiomático a condição apresentada por εἰ.
theological_decisions:
- issue: Referência de πνεῦμα ἕτερον
  choice: “um espírito diferente”, sem especificação
  alternative: o Espírito Santo apresentado de modo falso; um espírito demoníaco; outra disposição ou experiência espiritual
  rationale: O grego não identifica de forma inequívoca o referente; a tradução preserva essa ambiguidade teológica.
- issue: Tom de καλῶς ἀνέχεσθε
  choice: Repreensão irônica, esclarecida em nota
  alternative: elogio literal ou observação neutra
  rationale: O contexto mostra que Paulo censura a prontidão dos coríntios para tolerar uma mensagem rival. O texto mantém o idioma grego, e a nota sinaliza a provável ironia.
- issue: Referente pronominal implícito em ἀνέχεσθε
  choice: “o”, retomando o conjunto da situação ou mensagem rival
  alternative: “essa pessoa”, retomando quem chega
  rationale: O verbo grego não traz objeto expresso. O pronome neutro em português retoma naturalmente a situação descrita sem decidir que a tolerância se dirige exclusivamente ao mensageiro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. A estrutura tripla foi preservada, assim como a distinção entre “receber” e “aceitar”. A única nota explicita a ironia contextual sem sobrecarregar o texto.
