id: 2CO.11.13
reference: 2 Corinthians 11:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι ψευδαπόστολοι, ἐργάται δόλιοι, μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/013.yaml
  text: For such men are false apostles[a], deceitful workers, disguising themselves as apostles of Messiah.
translation:
  language: pt
  text: Pois homens assim são falsos apóstolos, trabalhadores enganadores, que se disfarçam de apóstolos do Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de Cristo”. O título grego Χριστός significa “Messias”, mas também pode ser vertido como “Cristo” quando funciona de modo mais semelhante a um nome.'
    reason: Registra a alternativa legítima para o valor titular ou mais nominal de Χριστός.
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação que fundamenta a afirmação anterior e mantém de modo natural a ligação argumentativa.
- source_word: οἱ τοιοῦτοι
  choice: homens assim
  rationale: Designa pessoas da espécie que acaba de ser descrita; a formulação é natural em português e preserva a referência masculina plural do contexto.
- source_word: ψευδαπόστολοι
  choice: falsos apóstolos
  rationale: Reproduz com clareza o composto grego, que caracteriza pessoas que alegam falsamente ter condição ou autoridade apostólica.
- source_word: ἐργάται δόλιοι
  choice: trabalhadores enganadores
  rationale: Preserva tanto a imagem de pessoas empenhadas numa obra quanto o caráter enganoso que define sua atuação.
- source_word: μετασχηματιζόμενοι
  choice: que se disfarçam
  rationale: No contexto, indica mudança deliberada de aparência ou apresentação, não transformação interior; a forma reflexiva comunica a participação intencional dos próprios agentes.
- source_word: εἰς ἀποστόλους Χριστοῦ
  choice: de apóstolos do Messias
  rationale: Com μετασχηματιζόμενοι, εἰς indica o papel ou identidade que eles aparentam assumir. “Do Messias” conserva o sentido titular de Χριστός e expressa pertencimento ou representação.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: 'Neste sintagma genitivo, o sentido titular permanece perceptível: são apóstolos que alegam pertencer ao Messias ou representá-lo. A alternativa tradicional “de Cristo” é igualmente possível e aparece em nota, sem resolver indevidamente a oscilação entre título e uso semelhante a nome.'
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. “Homens assim” evita a rigidez de “tais” sem enfraquecer a referência; “trabalhadores enganadores” conserva a repetição acusatória e o paralelismo do grego.
