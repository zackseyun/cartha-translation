  source_fidelity: 'O texto reproduz com precisão a pergunta retórica: Ἢ é adequadamente introduzido por «Ou será que»; «cometi pecado» comunica o idiomatismo ἁμαρτίαν ἐποίησα; «ao me humilhar» preserva o particípio reflexivo; e «para que vocês fossem exaltados» mantém a finalidade e a voz passiva de ὑψωθῆτε. «Porque lhes anunciei gratuitamente o evangelho de Deus» representa satisfatoriamente ὅτι, δωρεὰν e εὐηγγελισάμην ὑμῖν, sem acrescentar interpretação sobre sustento ministerial.'
