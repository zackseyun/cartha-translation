  terminology: «Evangelho de Deus» preserva a formulação paulina e o genitivo sem especificá-lo indevidamente. «Exaltados» conserva o contraste retórico de status/honra com «me humilhar». «Gratuitamente» é natural e abrange adequadamente a ideia de proclamação sem cobrança.
