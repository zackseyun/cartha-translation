id: 2CO.11.7
reference: 2 Corinthians 11:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἢ ἁμαρτίαν ἐποίησα ἐμαυτὸν ταπεινῶν ἵνα ὑμεῖς ὑψωθῆτε, ὅτι δωρεὰν τὸ τοῦ θεοῦ εὐαγγέλιον εὐηγγελισάμην ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/007.yaml
  text: Or did I commit a sin by humbling myself so that you might be exalted[b][a], because I proclaimed the gospel of God to you free of charge?
translation:
  language: pt
  text: Ou será que cometi pecado ao me humilhar para que vocês fossem exaltados, porque lhes anunciei gratuitamente o evangelho de Deus?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἢ
  choice: Ou será que
  rationale: Introduz a alternativa retórica ligada ao argumento anterior e conserva o tom incisivo da pergunta de Paulo.
- source_word: ἁμαρτίαν ἐποίησα
  choice: cometi pecado
  rationale: Expressa em português natural o idiomatismo grego, literalmente 'fiz pecado', preservando sua categoria moral e sua força retórica.
- source_word: ἐμαυτὸν ταπεινῶν
  choice: ao me humilhar
  rationale: Reproduz o sentido reflexivo do particípio e deixa aberta sua relação circunstancial com a pergunta, sem explicitação excessiva.
- source_word: ἵνα ὑμεῖς ὑψωθῆτε
  choice: para que vocês fossem exaltados
  rationale: Mantém a oração de finalidade e o contraste de posição e honra entre a humilhação de Paulo e a exaltação dos coríntios.
- source_word: ὅτι
  choice: porque
  rationale: Apresenta com clareza o fundamento ou a especificação do suposto pecado, conforme o contexto.
- source_word: δωρεὰν
  choice: gratuitamente
  rationale: Comunica de maneira natural e digna que Paulo não exigiu pagamento, preservando também o valor mais amplo de dádiva gratuita.
- source_word: τὸ τοῦ θεοῦ εὐαγγέλιον
  choice: o evangelho de Deus
  rationale: Preserva a construção genitiva e a formulação paulina familiar sem decidir se o genitivo indica origem, autoria ou pertencimento.
- source_word: εὐηγγελισάμην ὑμῖν
  choice: lhes anunciei
  rationale: Transmite o ato de anunciar o evangelho em português corrente e evita restringir o verbo ao contexto formal de uma pregação.
theological_decisions:
- issue: Natureza da pergunta retórica de Paulo sobre sustento financeiro e humilhação
  choice: Manter a pergunta e sua ironia implícita sem acrescentar um juízo doutrinário sobre remuneração ministerial.
  alternative: Explicitar que Paulo renunciou a um direito apostólico ou suavizar a ironia como simples pedido de desculpas.
  rationale: O grego pergunta se a autohumilhação de Paulo e o anúncio gratuito do evangelho constituíram pecado; não formula aqui uma doutrina completa sobre sustento ministerial.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. 'Vocês' favorece clareza contemporânea; 'cometi pecado', 'fossem exaltados' e 'evangelho de Deus' mantêm dignidade e proximidade formal com o grego. Não há variantes lexicais indispensáveis que exijam nota neste versículo.
