base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/030.yaml
  text: If I must boast[a], I will boast in the things of my weakness.
translation:
  language: pt
  text: Se é necessário gloriar-me, vou me gloriar nas coisas ligadas à minha fraqueza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «vou me gloriar nas coisas da minha fraqueza». De modo mais idiomático, também pode ser expresso: «vou me gloriar nas minhas fraquezas».'
    reason: alternativa lexical
lexical_decisions:
- source_word: Εἰ
  choice: Se
  rationale: Preserva a forma condicional grega sem transformá-la em causal, embora o contexto tenha força retórica.
- source_word: καυχᾶσθαι / καυχήσομαι
  choice: me glorie / vou me gloriar
  rationale: “Gloriar-se” expressa o sentido paulino de καυχάομαι e mantém a repetição retórica; é digno e amplamente compreensível em português.
- source_word: δεῖ
  choice: é necessário
  rationale: Reproduz a necessidade expressa pelo verbo impessoal, sem tornar a formulação excessivamente coloquial.
- source_word: τὰ τῆς ἀσθενείας μου
  choice: as coisas que revelam a minha fraqueza
  rationale: Torna compreensível a construção grega incomum com artigo neutro plural e genitivo, preservando a referência a fatos ou circunstâncias ligados à fraqueza de Paulo.
- source_word: ἀσθενείας
  choice: fraqueza
  rationale: É o equivalente mais claro e consistente para a condição de vulnerabilidade e humilhação em vista no contexto, sem restringi-la à enfermidade física.
theological_decisions:
- issue: Natureza do gloriar-se de Paulo
  choice: Manter o paradoxo de Paulo gloriar-se no que revela sua fraqueza, sem explicá-lo doutrinariamente no corpo do texto.
  alternative: Verter de modo mais simples como “vou me gloriar nas minhas fraquezas”.
  rationale: A formulação conserva a tensão entre o gloriar-se e a fraqueza, ao mesmo tempo que deixa o contexto definir a ironia e o alcance teológico.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil e em âmbito internacional. A expressão “as coisas que revelam” esclarece a construção grega sem reduzir seu conteúdo simplesmente a uma lista de fraquezas.
