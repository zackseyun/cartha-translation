  yaml_path: translation/nt/2_corinthians/011/018.yaml
  text: Since many boast according to the flesh[a], I too will boast.
translation:
  language: pt
  text: Visto que muitos se vangloriam segundo a carne[a], eu também me vangloriarei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo critérios humanos” ou “de maneira meramente humana”.
    reason: Alternativas idiomáticas para κατὰ σάρκα, cujo sentido contextual não se limita à carne física.
lexical_decisions:
- source_word: ἐπεὶ
  choice: Visto que
  rationale: Introduz a causa da decisão irônica de Paulo e soa natural em português atual.
- source_word: πολλοὶ
  choice: muitos
  rationale: Reproduz de modo direto o valor quantitativo do adjetivo.
- source_word: καυχῶνται
  choice: se orgulham
  rationale: Expressa o sentido de vangloriar-se no contexto, com linguagem corrente e digna.
- source_word: κατὰ σάρκα
  choice: segundo a carne
  rationale: Preserva a formulação paulina e sua tensão teológica, sem reduzir a expressão a uma única interpretação.
- source_word: κἀγὼ
  choice: eu também
  rationale: Mantém a ênfase de καί + ἐγώ e o paralelo retórico com os muitos.
- source_word: καυχήσομαι
  choice: me orgulharei
  rationale: Mantém a repetição do mesmo verbo grego e comunica a estratégia retórica anunciada por Paulo.
theological_decisions:
- issue: Sentido de σάρξ na expressão κατὰ σάρκα
  choice: segundo a carne
  alternative: segundo critérios humanos; de maneira meramente humana
  rationale: A tradução principal conserva o termo teologicamente carregado de Paulo e a ambiguidade genuína da expressão; a nota oferece sentidos idiomáticos plausíveis no contexto.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A construção é concisa e digna; a nota esclarece o idioma sem substituir a imagem paulina no texto principal.
