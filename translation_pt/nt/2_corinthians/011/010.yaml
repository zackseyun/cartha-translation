id: 2CO.11.10
reference: 2 Corinthians 11:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔστιν ἀλήθεια Χριστοῦ ἐν ἐμοὶ ὅτι ἡ καύχησις αὕτη οὐ φραγήσεται εἰς ἐμὲ ἐν τοῖς κλίμασι τῆς Ἀχαΐας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/010.yaml
  text: As the truth of Messiah is in me[c][b][a], this boasting of mine will not be silenced in the regions of Achaia.
translation:
  language: pt
  text: Tão certo como a verdade de Cristo está em mim[a], esta minha vanglória não será silenciada nas regiões da Acaia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A verdade de Cristo está em mim: esta minha vanglória não será silenciada...”'
    reason: A construção grega pode ser reproduzida como uma afirmação direta seguida de seu conteúdo.
  - marker: b
    text: 'Ou: “esta minha vanglória não será impedida” ou “não será bloqueada no que diz respeito a mim”. A expressão grega é idiomática e difícil; “esta minha glória” ou “este meu motivo de orgulho” também são possíveis conforme o sentido dado a καύχησις.'
    reason: Preserva alternativas para o futuro passivo φραγήσεται, a expressão εἰς ἐμέ e o alcance semântico de καύχησις.
lexical_decisions:
- source_word: ἔστιν ἀλήθεια Χριστοῦ ἐν ἐμοὶ ὅτι
  choice: Tão certo como a verdade de Cristo está em mim
  rationale: A construção introduz uma afirmação solene com força semelhante à de um juramento. A formulação portuguesa comunica essa força sem transformar ἀλήθεια em mera sinceridade subjetiva.
- source_word: ἀλήθεια Χριστοῦ
  choice: a verdade de Cristo
  rationale: Preserva a construção genitiva, que pode indicar a verdade pertencente a Cristo ou vinculada a ele, sem especificar além do texto.
- source_word: καύχησις αὕτη
  choice: me gloriar disso
  rationale: A forma verbal é mais natural em português do que substantivos como “jactância” e mantém a referência ao ato de Paulo gloriar-se do procedimento descrito no contexto.
- source_word: οὐ φραγήσεται εἰς ἐμὲ
  choice: ninguém me impedirá
  rationale: Expressa idiomaticamente em português a imagem passiva de algo ser bloqueado ou fechado com respeito a Paulo. A nota conserva a forma mais literal e a dificuldade da expressão.
- source_word: ἐν τοῖς κλίμασι τῆς Ἀχαΐας
  choice: nas regiões da Acaia
  rationale: Mantém o plural de κλίμασι e usa a forma portuguesa tradicional do nome da província romana.
theological_decisions:
- issue: Sentido do genitivo em ἀλήθεια Χριστοῦ
  choice: a verdade de Cristo
  alternative: a verdade que vem de Cristo
  rationale: A tradução escolhida conserva a ambiguidade entre posse, relação e origem, evitando decidir uma relação teológica que o genitivo não explicita.
- issue: Tradução de Χριστοῦ
  choice: Cristo
  alternative: Messias
  rationale: Em português, “Cristo” é a forma corrente e digna do título grego neste contexto paulino; “Messias” explicita o valor titular, mas poderia soar como uma substituição interpretativa.
- issue: Força da declaração inicial
  choice: Tão certo como
  alternative: 'A verdade de Cristo está em mim:'
  rationale: A escolha comunica a força solene e asseverativa da construção, sem convertê-la em um juramento explícito por Cristo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Evitou-se “jactância”, por ser pouco corrente, e preferiu-se uma construção verbal para καύχησις. “Acaia” segue a forma portuguesa tradicional.
