base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/016.yaml
  text: Again I say[a], let no one think me to be foolish—but if not, then receive me even as foolish, so that I too may boast a little.
translation:
  language: pt
  text: 'Digo outra vez: ninguém me considere insensato[a]; mas, se não, recebam-me ao menos como insensato, para que eu também me glorie um pouco.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ninguém pense que sou um insensato... recebam-me ao menos como um insensato”. O adjetivo grego ἄφρων pode ser entendido adjetivamente (“insensato”) ou como substantivo (“um insensato”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν λέγω
  choice: Digo outra vez
  rationale: Expressa de modo natural e direto a repetição do apelo de Paulo.
- source_word: μή τίς με δόξῃ ἄφρονα εἶναι
  choice: ninguém me considere insensato
  rationale: A construção negativa com subjuntivo transmite uma exortação; «considere insensato» representa com clareza δοκέω com o infinitivo.
- source_word: εἰ δὲ μή γε
  choice: Mas, se não for assim
  rationale: 'Explicita naturalmente a alternativa concessiva: caso não atendam ao pedido anterior.'
- source_word: κἂν ὡς ἄφρονα δέξασθέ με
  choice: recebam-me ao menos como insensato
  rationale: «Ao menos» comunica a concessão introduzida por κἂν, enquanto «recebam-me» preserva a força direta do imperativo.
- source_word: ἵνα κἀγὼ μικρόν τι καυχήσωμαι
  choice: para que eu também me glorie um pouco
  rationale: Mantém a ideia de finalidade, a ênfase inclusiva de κἀγώ e a linguagem explícita de gloriar-se usada na argumentação irônica de Paulo.
theological_decisions:
- issue: A autodescrição irônica de Paulo por meio de ἄφρων e καυχάομαι
  choice: Manter «insensato» e «me glorie», sem suavizar a ironia
  alternative: Parafrasear como «imprudente» e «falar de mim mesmo»
  rationale: O contexto apresenta Paulo assumindo, por concessão retórica, a aparência de insensatez para entrar no discurso de autodefesa; a tradução preserva essa tensão.
- issue: Função gramatical de ἄφρονα
  choice: Traduzir adjetivamente como «insensato» nas duas ocorrências
  alternative: Traduzir substantivamente como «um insensato» ou «um tolo»
  rationale: O grego admite ambas as análises; a forma adjetiva é natural em português e a alternativa genuína é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Insensato» preserva o tom formal sem soar arcaico; «glorie» mantém a terminologia retórica e teológica do contexto.
