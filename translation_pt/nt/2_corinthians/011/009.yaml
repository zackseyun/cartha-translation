review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha adequadamente a estrutura e o sentido do grego: Paulo estava presente, sofreu necessidade, não onerou ninguém, recebeu suprimento dos irmãos vindos da Macedônia e manterá essa conduta. Contudo, «não fui pesado para ninguém» pode sugerir que ele não foi incômodo ou cansativo, e não expressa com a mesma clareza o sentido de encargo, especialmente financeiro, de κατενάρκησα.'
  naturalness: «Não fui um peso para ninguém» é mais idiomático e inequívoco no português moderno. Na oração final, «mantive-me sem ser um peso para vocês e continuarei assim» reproduz de modo mais direto o verbo «manter» (τηρέω) e sua continuidade futura.
  terminology: «Irmãos», «Macedônia», «necessidade», «supriram» e «peso» são escolhas adequadas. «Peso» preserva a ligação semântica entre καταναρκάω e ἀβαρής sem restringir indevidamente o texto a uma modalidade específica de auxílio.
  issues:
  - severity: low
    issue: «não fui pesado para ninguém»
    rationale: Embora seja compreensível, «pesado» em português costuma descrever uma pessoa enfadonha ou difícil de tolerar. «Não fui um peso para ninguém» comunica com maior precisão o encargo material-relacional implícito no verbo grego.
  - severity: low
    issue: «evitei ser um peso ... e continuarei evitando»
    rationale: A formulação é possível, mas enfraquece a noção de manter-se nessa condição, expressa por τηρέω. «Mantive-me sem ser um peso ... e continuarei assim» preserva melhor o aspecto da conduta sustentada.
  revised_text: E, quando estive com vocês e passei necessidade, não fui um peso para ninguém; pois os irmãos que vieram da Macedônia supriram o que me faltava. Em tudo, mantive-me sem ser um peso para vocês e continuarei assim.
