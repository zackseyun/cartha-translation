id: 2CO.11.9
reference: 2 Corinthians 11:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ παρὼν πρὸς ὑμᾶς καὶ ὑστερηθεὶς οὐ κατενάρκησα οὐθενός· τὸ γὰρ ὑστέρημά μου προσανεπλήρωσαν οἱ ἀδελφοὶ ἐλθόντες ἀπὸ Μακεδονίας· καὶ ἐν παντὶ ἀβαρῆ ⸂ἐμαυτὸν ὑμῖν⸃ ἐτήρησα καὶ τηρήσω.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/009.yaml
  text: And when I was present with you and was in need[a], I was not a burden to anyone; for the brothers who came from Macedonia supplied what I lacked. And in everything I kept myself from being a burden to you[b], and will keep doing so.
translation:
  language: pt
  text: E, quando estive com vocês e passei necessidade, não fui um peso para ninguém; pois os irmãos que vieram da Macedônia supriram o que me faltava. Em tudo, mantive-me sem ser um peso para vocês e continuarei assim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὼν πρὸς ὑμᾶς
  choice: quando estive com vocês
  rationale: Expressa naturalmente em português o valor temporal e circunstancial do particípio, preservando a presença pessoal de Paulo entre os coríntios.
- source_word: ὑστερηθεὶς
  choice: passei necessidade
  rationale: O particípio indica sofrer carência, sobretudo material neste contexto. A expressão é corrente, clara e não especifica além do que o grego permite.
- source_word: οὐ κατενάρκησα οὐθενός
  choice: não fui pesado para ninguém
  rationale: O verbo raro καταναρκάω comunica a ideia de pesar sobre alguém ou tornar-se um encargo, aqui especialmente financeiro. A formulação mantém a metáfora de peso e se liga à expressão ἀβαρῆ da frase seguinte.
- source_word: τὸ ὑστέρημά μου
  choice: o que me faltava
  rationale: Traduz a carência concreta de modo natural, sem a abstração menos idiomática de 'minha deficiência'.
- source_word: προσανεπλήρωσαν
  choice: supriram
  rationale: O verbo significa completar ou fornecer o que falta; com 'o que me faltava', 'supriram' comunica o sentido pleno sem redundância.
- source_word: οἱ ἀδελφοὶ
  choice: os irmãos
  rationale: Preserva a forma masculina plural do grego e, neste contexto, provavelmente designa colaboradores específicos vindos da Macedônia.
- source_word: ἐλθόντες ἀπὸ Μακεδονίας
  choice: que vieram da Macedônia
  rationale: Transforma o particípio aoristo em oração relativa natural em português e preserva a origem geográfica.
- source_word: ἐν παντί
  choice: em tudo
  rationale: Mantém o alcance abrangente da expressão adverbial sem restringi-la a um aspecto específico.
- source_word: ἀβαρῆ ἐμαυτὸν ὑμῖν
  choice: evitei ser um peso para vocês
  rationale: O adjetivo ἀβαρής significa 'não pesado, não oneroso'. A expansão verbal é natural em português e retém a metáfora e o sentido econômico-relacional.
- source_word: ἐτήρησα καὶ τηρήσω
  choice: evitei ... e continuarei evitando
  rationale: No contexto, τηρέω descreve manter-se na condição de não ser oneroso. A formulação portuguesa torna clara a manutenção passada e futura dessa conduta.
theological_decisions:
- issue: Abrangência de gênero de ἀδελφοὶ
  choice: os irmãos
  alternative: os irmãos e as irmãs; os companheiros de fé
  rationale: A forma grega é masculina plural e, no contexto imediato, provavelmente se refere a colaboradores específicos que levaram sustento desde a Macedônia. Mantém-se o masculino no texto sem afirmar que o termo paulino nunca possa ter referência mais ampla.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição da metáfora de peso reproduz a ligação entre καταναρκάω e ἀβαρής. Não se acrescentaram notas, pois a tradução principal preserva adequadamente as nuances relevantes e não há marcador necessário.
