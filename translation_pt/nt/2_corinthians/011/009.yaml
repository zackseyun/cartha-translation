revisions:
- from: E, quando estive com vocês e passei necessidade, não fui pesado para ninguém; pois os irmãos que vieram da Macedônia supriram o que me faltava. Em tudo, evitei ser um peso para vocês e continuarei evitando.
  to: E, quando estive com vocês e passei necessidade, não fui um peso para ninguém; pois os irmãos que vieram da Macedônia supriram o que me faltava. Em tudo, mantive-me sem ser um peso para vocês e continuarei assim.
  rationale: A revisão substitui uma expressão potencialmente ambígua por «não fui um peso», que é natural e preserva o sentido de não impor encargo. Também ajusta a oração final para refletir mais diretamente a ideia de Paulo ter-se mantido não oneroso e de continuar nessa postura. Não são necessárias notas, pois o texto traduz as nuances relevantes sem introduzir interpretação adicional.
