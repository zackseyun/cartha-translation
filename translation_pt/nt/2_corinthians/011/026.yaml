  text: ὁδοιπορίαις πολλάκις, κινδύνοις ποταμῶν, κινδύνοις λῃστῶν, κινδύνοις ἐκ γένους, κινδύνοις ἐξ ἐθνῶν, κινδύνοις ἐν πόλει, κινδύνοις ἐν ἐρημίᾳ, κινδύνοις ἐν θαλάσσῃ, κινδύνοις ἐν ψευδαδέλφοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/026.yaml
  text: often on journeys[a], in dangers from rivers, in dangers from robbers, in dangers from my own people, in dangers from Gentiles, in dangers in the city, in dangers in the wilderness, in dangers at sea, in dangers among false brothers[b],
translation:
  language: pt
  text: muitas vezes em viagens, em perigos por causa de rios, em perigos por causa de assaltantes, em perigos da parte do meu próprio povo[a], em perigos da parte dos gentios, em perigos na cidade, em perigos no deserto, em perigos no mar, em perigos entre falsos irmãos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da parte da minha própria raça” ou “da parte da minha própria nação”. O grego diz literalmente “da parte do [meu] povo/parentela”.
    reason: lexical_alternative
  - marker: b
    text: Ou “entre falsos crentes”. O grego diz literalmente “entre falsos irmãos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοιπορίαις πολλάκις
  choice: muitas vezes em viagens
  rationale: Mantém o sentido de viagens repetidas e a forma fragmentária da lista, com ordem natural e compreensível em português.
- source_word: κινδύνοις
  choice: em perigos
  rationale: Conserva a repetição enfática do dativo plural grego e a cadência cumulativa da enumeração.
- source_word: ποταμῶν
  choice: por causa de rios
  rationale: Expressa a origem do perigo sem especificar enchentes ou travessias, detalhes que o grego deixa implícitos.
- source_word: λῃστῶν
  choice: por causa de assaltantes
  rationale: “Assaltantes” é corrente e comunica com clareza a ameaça de ladrões ou bandidos no contexto de viagens.
- source_word: ἐκ γένους
  choice: da parte do meu próprio povo
  rationale: Comunica o grupo étnico de Paulo sem inserir explicitamente “judeus”, termo ausente da frase grega, e preserva o contraste com os gentios.
- source_word: ἐξ ἐθνῶν
  choice: da parte dos gentios
  rationale: No contraste com o próprio povo de Paulo, ἔθνη designa naturalmente os povos não judeus; “gentios” é conciso e tradicional.
- source_word: ἐν πόλει
  choice: na cidade
  rationale: Preserva o singular genérico do grego e o paralelismo espacial da lista.
- source_word: ἐν ἐρημίᾳ
  choice: no deserto
  rationale: Representa de modo claro ἐρημία como região desabitada ou erma, sem restringir o texto a um local específico.
- source_word: ἐν θαλάσσῃ
  choice: no mar
  rationale: É a forma idiomática portuguesa para perigos marítimos e corresponde diretamente à expressão grega.
- source_word: ἐν ψευδαδέλφοις
  choice: entre falsos irmãos
  rationale: Mantém o composto grego, literalmente “falsos irmãos”, sem ampliar o masculino plural nem definir além do texto em que sentido eram falsos.
theological_decisions:
- issue: Sentido e gênero de ψευδαδέλφοις
  choice: entre falsos irmãos
  alternative: entre falsos crentes
  rationale: A expressão grega é masculina plural e apresenta essas pessoas como pretensos irmãos. A tradução literal preserva tanto a forma relacional quanto a tensão sobre sua autenticidade; a nota registra a alternativa funcional.
- issue: Contraste entre ἐκ γένους e ἐξ ἐθνῶν
  choice: da parte do meu próprio povo / da parte dos gentios
  alternative: da parte da minha própria raça / da parte das nações
  rationale: A formulação escolhida torna claro o contraste étnico contextual sem nomear explicitamente o primeiro grupo nem obscurecer o uso paulino de ἔθνη para os não judeus.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “em perigos” foi mantida para reproduzir a força retórica da enumeração grega. A pontuação final conserva a vírgula porque o trecho integra uma lista que continua no contexto.
