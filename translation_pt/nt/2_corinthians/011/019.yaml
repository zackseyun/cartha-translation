  text: ἡδέως γὰρ ἀνέχεσθε τῶν ἀφρόνων φρόνιμοι ὄντες·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/019.yaml
  text: For you gladly put up with fools[b][a], being wise yourselves.
translation:
  language: pt
  text: Pois vocês toleram de bom grado os tolos[a], sendo vocês mesmos sábios.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “suportam os tolos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Paulo fala com ironia: os coríntios se veem como sábios, mas toleram líderes tolos.'
    reason: cultural_note
lexical_decisions:
- source_word: ἡδέως
  choice: de bom grado
  rationale: Expressa disposição favorável ou prazer em aceitar algo e preserva, em português natural, o tom irônico da afirmação.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa do conectivo em relação ao argumento anterior.
- source_word: ἀνέχεσθε
  choice: toleram
  rationale: Comunica de modo claro a ideia de suportar ou admitir pessoas e condutas, conservando a força crítica do contexto.
- source_word: τῶν ἀφρόνων
  choice: os tolos
  rationale: Refere-se a pessoas caracterizadas pela falta de bom senso ou sabedoria; “tolos” é direto e mantém o contraste retórico com “sábios”.
- source_word: φρόνιμοι
  choice: sábios
  rationale: Preserva o contraste irônico com “tolos” e se ajusta ao vocabulário de sabedoria presente no argumento.
- source_word: ὄντες
  choice: sendo
  rationale: Conserva a construção participial sem decidir se sua relação lógica deve ser entendida como causal ou concessiva.
theological_decisions:
- issue: A ironia de Paulo ao chamar os coríntios de sábios
  choice: Manter a formulação direta, deixando a ironia surgir do contraste entre “tolos” e “sábios”.
  alternative: Tornar a ironia explícita com uma paráfrase como “já que vocês se consideram tão sábios”.
  rationale: O grego não declara expressamente que eles apenas se consideram sábios; acrescentar isso resolveria uma tensão retórica que o texto mantém implícita.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “vocês”. A ordem e a construção participial preservam o vínculo com o grego, enquanto “toleram de bom grado” soa natural e mantém a crítica irônica.
