  text: ἄλλας ἐκκλησίας ἐσύλησα λαβὼν ὀψώνιον πρὸς τὴν ὑμῶν διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/008.yaml
  text: I robbed other churches by accepting support for serving you,[a]
translation:
  language: pt
  text: Despojei outras igrejas, recebendo sustento para servir vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «salário» ou «pagamento».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλας ἐκκλησίας
  choice: outras igrejas
  rationale: No uso paulino, ἐκκλησία normalmente designa comunidades cristãs locais; «igrejas» é natural e amplamente compreensível em português.
- source_word: ἐσύλησα
  choice: despojei
  rationale: O verbo συλάω é forte e significa despojar, saquear ou roubar. «Despojei» preserva a metáfora provocativa e irônica sem fazer a frase soar como uma confissão literal de furto.
- source_word: λαβὼν
  choice: recebendo
  rationale: O particípio aoristo explica o modo pelo qual Paulo «despojou» as outras igrejas. «Recebendo» conserva a relação participial de maneira clara e natural.
- source_word: ὀψώνιον
  choice: sustento
  rationale: Embora o termo possa significar literalmente salário ou pagamento, neste contexto refere-se à assistência material recebida para o ministério. «Sustento» evita sugerir em excesso uma relação comercial de emprego; a alternativa mais literal aparece na nota.
- source_word: πρὸς τὴν ὑμῶν διακονίαν
  choice: para servir vocês
  rationale: 'A construção indica a finalidade do sustento: possibilitar o serviço de Paulo aos coríntios. A formulação é clara, atual e mantém Paulo como agente do serviço.'
theological_decisions:
- issue: Força retórica da afirmação de Paulo sobre receber recursos de outras igrejas
  choice: Manter a metáfora forte em «Despojei outras igrejas» como ironia ou hipérbole.
  alternative: Abrandar para «Recebi ajuda de outras igrejas» ou «Tirei recursos de outras igrejas».
  rationale: O verbo grego é deliberadamente contundente. O contexto mostra que Paulo fala de sustento financeiro, não de roubo literal; suavizar a expressão eliminaria parte importante de sua defesa irônica.
translation_notes:
  register: Português moderno, digno e de leitura natural, com «vocês» para ampla legibilidade brasileira. «Despojei» retém a contundência do original, enquanto «sustento» comunica com clareza a assistência material no contexto ministerial.
