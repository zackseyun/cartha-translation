  text: ζηλῶ γὰρ ὑμᾶς θεοῦ ζήλῳ, ἡρμοσάμην γὰρ ὑμᾶς ἑνὶ ἀνδρὶ παρθένον ἁγνὴν παραστῆσαι τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/002.yaml
  text: For I am jealous for you with God's jealousy[a], because I betrothed you to one husband[b], to present you as a pure virgin to Messiah.
translation:
  language: pt
  text: Pois tenho ciúme de vocês com o ciúme de Deus[a], porque os prometi em casamento a um só esposo, para apresentá-los como uma virgem pura ao Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com um ciúme que vem de Deus” ou “com um ciúme segundo Deus”. O grego pode indicar o ciúme pertencente a Deus ou um ciúme caracterizado por ele.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a Cristo”. Em grego, Χριστός pode funcionar como o título “Messias” ou como a designação tradicional “Cristo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλῶ
  choice: tenho por vocês o ciúme
  rationale: Preserva a ideia de zelo protetor e exclusividade pactual no contexto da metáfora matrimonial, sem reduzi-la a inveja mesquinha.
- source_word: θεοῦ ζήλῳ
  choice: o ciúme de Deus
  rationale: Reproduz diretamente o genitivo grego, que pode indicar um ciúme pertencente a Deus ou caracterizado por ele; a alternativa interpretativa fica registrada em nota.
- source_word: ἡρμοσάμην
  choice: os prometi em casamento
  rationale: Expressa de modo claro e atual o ato de comprometer ou dar em casamento, preservando a metáfora de noivado sem recorrer ao menos corrente 'desposei'.
- source_word: ἑνὶ ἀνδρὶ
  choice: a um só marido
  rationale: No quadro nupcial, ἀνήρ tem naturalmente o sentido de marido; 'um só' ressalta a exclusividade indicada por ἑνί.
- source_word: παρθένον ἁγνήν
  choice: virgem pura
  rationale: Mantém tanto a imagem nupcial de παρθένος quanto a qualidade moral expressa por ἁγνή.
- source_word: παραστῆσαι
  choice: para apresentá-los
  rationale: Conserva o sentido de colocar ou apresentar alguém diante de outro, adequado ao caráter cerimonial da imagem.
- source_word: τῷ Χριστῷ
  choice: ao Messias
  rationale: O artigo e a função de noivo designado favorecem a leitura titular de Χριστός; 'Messias' torna essa função explícita em português.
theological_decisions:
- issue: Natureza do ciúme de Paulo
  choice: Paulo manifesta um ciúme que pertence a Deus ou reflete o ciúme pactual de Deus.
  alternative: Paulo fala de um zelo piedoso, sem afirmar diretamente que o ciúme seja de Deus.
  rationale: O genitivo θεοῦ admite ambas as relações, e a tradução principal mantém a forma mais direta sem eliminar a alternativa.
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός funciona de modo plausível como título do noivo; a forma tradicional 'Cristo' permanece indicada em nota para preservar a alternativa lexical.
- issue: Referência coletiva sob imagem feminina singular
  choice: os prometi / apresentá-los como virgem pura
  alternative: prometi vocês / apresentar vocês como uma virgem pura
  rationale: O grego dirige-se coletivamente aos coríntios no plural, mas os representa pela figura singular de uma virgem; a tradução preserva essa tensão de número e imagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Prometi em casamento' evita o arcaísmo de 'desposei'; a metáfora coletiva da comunidade como uma única virgem é preservada.
