  to: E, ainda que eu não tenha treinamento na oratória[a], não me falta conhecimento; mas, de todas as maneiras e em tudo, temos deixado isso claro a vocês.[b]
  rationale: A revisão substitui uma intensificação interpretativa por «mas», explicita o vínculo inicial de εἰ δὲ καί com «E, ainda que», e emprega «treinamento na oratória» para comunicar com mais precisão a falta de polimento retórico, não uma deficiência intelectual. Mantêm-se a primeira pessoa do singular na autodescrição e o plural de φανερώσαντες («temos deixado»), bem como a ambiguidade de ἐν πᾶσιν no texto e na nota.
