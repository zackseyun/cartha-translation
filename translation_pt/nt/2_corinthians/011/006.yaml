  text: εἰ δὲ καὶ ἰδιώτης τῷ λόγῳ, ἀλλ’ οὐ τῇ γνώσει, ἀλλ’ ἐν παντὶ ⸀φανερώσαντες ἐν πᾶσιν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/006.yaml
  text: But even if I am unskilled in speech[a], I am not in knowledge; indeed[c][b], in every way we have made this plain among all to you.
translation:
  language: pt
  text: E, ainda que eu não tenha treinamento na oratória[a], não me falta conhecimento; mas, de todas as maneiras e em tudo, temos deixado isso claro a vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não seja treinado na oratória”, isto é, não possua uma oratória refinada.'
    reason: lexical_alternative
  - marker: b
    text: A expressão grega é compacta e também pode ser entendida como “de todas as maneiras, temos deixado isso evidente a vocês diante de todos” ou “em todas as situações”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδιώτης τῷ λόγῳ
  choice: não seja um orador treinado
  rationale: No contexto, a expressão indica falta de formação ou refinamento retórico, não ignorância geral. A formulação é natural em português e mantém o contraste com o conhecimento.
- source_word: γνώσει
  choice: conhecimento
  rationale: O substantivo designa o conhecimento que Paulo afirma possuir, em contraste com sua possível falta de preparo retórico.
- source_word: φανερώσαντες
  choice: temos deixado isso claro
  rationale: O particípio funciona no contexto como uma afirmação de que Paulo e seus cooperadores demonstraram abertamente esse conhecimento aos coríntios. O perfeito composto comunica o resultado continuado de modo idiomático.
- source_word: ἐν παντί
  choice: de todas as maneiras
  rationale: Expressa a abrangência da demonstração, sem restringi-la a uma única forma ou ocasião.
- source_word: ἐν πᾶσιν
  choice: em tudo
  rationale: Preserva a formulação ampla e compacta do grego. Como a expressão também pode ser entendida com referência a pessoas, a ambiguidade é registrada em nota.
- source_word: εἰς ὑμᾶς
  choice: a vocês
  rationale: Indica os coríntios como destinatários da demonstração e soa natural no português contemporâneo.
theological_decisions:
- issue: Sentido da autodescrição de Paulo quanto à fala
  choice: Paulo admite, ao menos para fins do argumento, não ser um orador treinado, mas nega qualquer deficiência de conhecimento.
  alternative: Paulo afirma ser geralmente inculto, ou fala de modo inteiramente irônico sem admitir deficiência alguma.
  rationale: O contraste explícito entre fala e conhecimento aponta para formação ou refinamento retórico, não para falta de autoridade, verdade ou instrução em geral. A tradução evita decidir se a concessão é plena ou retórica.
- issue: Referência de ἐν πᾶσιν
  choice: em tudo
  alternative: diante de todos / entre todos
  rationale: A forma grega pode ser neutra, referindo-se a todas as coisas ou circunstâncias, ou masculina, referindo-se a todas as pessoas. O texto principal mantém a leitura abrangente, e a nota preserva a alternativa pessoal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Orador treinado” torna explícito o âmbito retórico sem sugerir ignorância geral. A repetição abrangente “de todas as maneiras e em tudo” procura conservar a ênfase do grego, enquanto a nota registra sua ambiguidade.
