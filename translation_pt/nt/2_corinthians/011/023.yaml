base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/023.yaml
  text: 'Are they servants of Messiah? I am speaking as if insane: I am more so—in labors more abundantly[a], in imprisonments more abundantly, in beatings beyond measure[b], in deaths often.'
translation:
  language: pt
  text: 'São eles servos do Messias?[a] Falo como quem perdeu o juízo: eu, ainda mais — em trabalhos, muito mais; em prisões, muito mais; em golpes, além de toda medida; muitas vezes diante da morte.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “Cristo”: “São eles servos de Cristo?”'
    reason: alternativa lexical para o título Χριστός
  - marker: b
    text: Literalmente, “em mortes, muitas vezes”; provavelmente se refere a repetidas ocasiões em que Paulo esteve perto da morte ou enfrentou perigos mortais.
    reason: o plural grego é marcante e mais literal, mas pouco natural em português
lexical_decisions:
- source_word: διάκονοι
  choice: servos
  rationale: Expressa de modo claro o sentido geral de pessoas que servem, sem introduzir a conotação eclesiástica moderna que “ministros” poderia sugerir.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Aqui Χριστός funciona como título; “Messias” torna esse valor titular transparente em português. A forma tradicional “Cristo” é indicada em nota.
- source_word: παραφρονῶν λαλῶ
  choice: Falo como quem perdeu o juízo
  rationale: Comunica a caracterização deliberadamente extrema que Paulo faz de sua própria fala, mantendo a ideia comparativa sem afirmar simplesmente que ele esteja de fato fora de si.
- source_word: ὑπὲρ ἐγώ
  choice: eu, ainda mais
  rationale: 'Preserva a expressão grega abrupta e elíptica: se os outros são servos do Messias, Paulo afirma sê-lo em grau ainda maior.'
- source_word: ἐν κόποις περισσοτέρως
  choice: em trabalhos, muito mais
  rationale: Mantém tanto o paralelismo da lista quanto a ideia de esforço árduo e superior em grau ou quantidade.
- source_word: ἐν φυλακαῖς περισσοτέρως
  choice: em prisões, muito mais
  rationale: A forma plural aponta para repetidas experiências de encarceramento; a construção concisa conserva o ritmo retórico do grego.
- source_word: ἐν πληγαῖς ὑπερβαλλόντως
  choice: em açoites, muito além da conta
  rationale: “Açoites” comunica punições físicas repetidas, e “muito além da conta” reproduz a intensidade de ὑπερβαλλόντως sem limitar o sentido a uma contagem literal.
- source_word: ἐν θανάτοις πολλάκις
  choice: muitas vezes diante da morte
  rationale: Apresenta em português natural o provável sentido de repetidas situações de perigo mortal, enquanto a nota conserva o plural incomum e mais literal do grego.
theological_decisions:
- issue: Tradução de Χριστοῦ como título
  choice: Messias
  alternative: Cristo
  rationale: O contexto admite e favorece o valor titular de Χριστός. “Messias” explicita esse valor, enquanto “Cristo”, forma tradicional e igualmente possível, permanece registrado em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo conciso para preservar o caráter intenso e crescente da lista. A formulação “como quem perdeu o juízo” evita tanto um tom clínico moderno quanto uma expressão excessivamente coloquial.
