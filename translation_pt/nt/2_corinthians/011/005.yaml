  yaml_path: translation/nt/2_corinthians/011/005.yaml
  text: For I consider that I am not in the least inferior to those super-apostles[a].
translation:
  language: pt
  text: Pois considero que em nada sou inferior a esses superapóstolos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos mais eminentes apóstolos”. A expressão grega pode ser entendida ironicamente (“superapóstolos”) ou como uma referência direta a apóstolos muito conceituados.'
    reason: alternative_reading
lexical_decisions:
- source_word: λογίζομαι
  choice: considero
  rationale: Expressa avaliação refletida e corresponde naturalmente ao sentido de pensar, julgar ou considerar.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação ou fundamentação do argumento anterior de Paulo, preservando a ligação discursiva.
- source_word: μηδὲν
  choice: em nada
  rationale: Usado adverbialmente com o infinitivo, enfatiza que Paulo não é inferior em aspecto algum; a formulação é clara e idiomática em português.
- source_word: ὑστερηκέναι
  choice: sou inferior
  rationale: O infinitivo perfeito de ὑστερέω indica estar em desvantagem ou aquém de outros; no contexto comparativo, 'sou inferior' comunica o sentido com naturalidade.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: a esses superapóstolos
  rationale: '''Superapóstolos'' preserva a provável ironia da expressão ὑπερλίαν ἀποστόλων, enquanto ''esses'' torna natural a referência aos personagens em pauta.'
theological_decisions:
- issue: Se τῶν ὑπερλίαν ἀποστόλων designa ironicamente os adversários de Paulo ou, de modo direto, apóstolos muito eminentes
  choice: esses superapóstolos
  alternative: os mais eminentes apóstolos
  rationale: O contexto imediato favorece uma referência irônica a ministros rivais que se exaltavam diante dos coríntios. Contudo, como a expressão grega também admite uma leitura direta, essa possibilidade é mantida em nota, sem resolver dogmaticamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção concisa acompanha o fluxo argumentativo de Paulo, e a provável ironia é preservada sem ser intensificada por expressões como 'supostos'.
