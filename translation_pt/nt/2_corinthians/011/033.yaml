  text: and through a window in a basket I was lowered through the wall and escaped his hands[a].
translation:
  language: pt
  text: E, por uma janela, fui baixado num cesto através da muralha e escapei das mãos dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fui descido através da muralha num cesto de cordas”.'
    reason: Alternativa lexical que explicita a possível composição do cesto e reproduz outra forma natural do passivo.
lexical_decisions:
- source_word: θυρίδος
  choice: janela
  rationale: O termo designa uma janela ou pequena abertura. “Janela” é a opção mais natural e específica em português neste contexto.
- source_word: σαργάνῃ
  choice: cesto
  rationale: O termo se refere a um recipiente trançado, possivelmente feito de cordas ou vime. “Cesto” é claro e natural, enquanto a possível composição é indicada em nota.
- source_word: ἐχαλάσθην
  choice: fui baixado
  rationale: O passivo de χαλάω indica que Paulo foi descido por outras pessoas, provavelmente com cordas. “Fui baixado” expressa claramente esse movimento.
- source_word: διὰ τοῦ τείχους
  choice: através da muralha
  rationale: A expressão indica passagem por uma abertura na muralha. “Muralha” comunica melhor que se trata de uma estrutura defensiva, sem acrescentar explicitamente “da cidade”.
- source_word: ἐξέφυγον τὰς χεῖρας αὐτοῦ
  choice: escapei das mãos dele
  rationale: A formulação preserva a imagem vívida do grego, que descreve escapar do domínio ou alcance de alguém.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi levemente ajustada para soar natural, preservando a repetição de διά e a imagem concreta das “mãos”.
