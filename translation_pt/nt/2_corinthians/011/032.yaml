  text: ἐν Δαμασκῷ ὁ ἐθνάρχης Ἁρέτα τοῦ βασιλέως ἐφρούρει τὴν ⸂πόλιν Δαμασκηνῶν⸃ πιάσαι ⸀με,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/032.yaml
  text: In Damascus[a], the ethnarch of King Aretas was guarding the city of the Damascenes in order to seize me,
translation:
  language: pt
  text: Em Damasco, o etnarca do rei Aretas vigiava a cidade dos damascenos[a], a fim de me capturar,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a cidade de Damasco». O grego diz mais literalmente «a cidade dos damascenos».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Δαμασκῷ
  choice: Em Damasco
  rationale: O uso locativo de ἐν com o dativo indica lugar; esta é a formulação natural em português.
- source_word: ἐθνάρχης
  choice: etnarca
  rationale: Preserva o título histórico específico de um governante de um povo ou território, sem reduzi-lo ao termo mais genérico «governador».
- source_word: Ἁρέτα τοῦ βασιλέως
  choice: do rei Aretas
  rationale: Mantém de forma natural o genitivo que vincula o etnarca ao rei Aretas, provavelmente como seu representante ou subordinado, sem explicitar além do texto.
- source_word: ἐφρούρει
  choice: mantinha sob vigilância
  rationale: Expressa a ação contínua do imperfeito e o sentido de vigiar ou guardar a cidade com um objetivo hostil.
- source_word: τὴν πόλιν Δαμασκηνῶν
  choice: a cidade dos damascenos
  rationale: Reproduz o genitivo plural substantivado do grego, literalmente «dos damascenos», preservando a forma incomum do texto-fonte.
- source_word: πιάσαι με
  choice: a fim de me capturar
  rationale: O infinitivo aoristo indica finalidade. «Capturar» transmite a apreensão hostil sem impor o sentido jurídico mais específico de «prender».
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. O termo histórico «etnarca» foi mantido por precisão; a construção «cidade dos damascenos» conserva a forma do grego e recebe uma nota com a alternativa idiomática.
