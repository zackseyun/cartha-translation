source:
  edition: SBLGNT
  text: ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ⸀Ἰησοῦ οἶδεν, ὁ ὢν εὐλογητὸς εἰς τοὺς αἰῶνας, ὅτι οὐ ψεύδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/031.yaml
  text: The God and Father of the Lord Jesus[a], he who is blessed forever, knows that I am not lying.
translation:
  language: pt
  text: O Deus e Pai do Senhor Jesus, aquele que é bendito para sempre[a], sabe que não estou mentindo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “pelos séculos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: O Deus e Pai
  rationale: O único artigo rege os dois substantivos, formando a expressão “o Deus e Pai”. A tradução mantém ambos e preserva a estrutura solene da afirmação de Paulo.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: do Senhor Jesus
  rationale: Traduz o título κύριος por “Senhor” e não acrescenta “nosso”, ausente do texto grego.
- source_word: οἶδεν
  choice: sabe
  rationale: Preserva o sentido direto do verbo, embora no contexto ele também dê à declaração o caráter de um apelo solene a Deus.
- source_word: ὁ ὢν εὐλογητὸς
  choice: aquele que é bendito
  rationale: Reproduz a descrição substantivada de Deus e mantém o tom doxológico sem tornar a frase artificial.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: É a forma portuguesa corrente e natural de expressar a duração contínua da doxologia; a formulação mais literal fica registrada em nota.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo do que Deus sabe, e não uma oração causal.
- source_word: οὐ ψεύδομαι
  choice: não estou mentindo
  rationale: Expressa naturalmente em português a afirmação presente e contextual de Paulo.
theological_decisions:
- issue: Relação entre “Deus e Pai” e “o Senhor Jesus”
  choice: Traduzir diretamente como “O Deus e Pai do Senhor Jesus”
  alternative: Parafrasear a expressão para atenuar a distinção relacional
  rationale: A tradução conserva a distinção de pessoas presente no texto sem acrescentar explicações doutrinárias nem amenizar sua formulação.
- issue: Ligação da cláusula doxológica
  choice: Tratar “aquele que é bendito para sempre” como descrição parentética de Deus
  alternative: Ler a cláusula como restritiva ou ligá-la a outro referente
  rationale: A construção grega descreve Deus em uma breve afirmação doxológica inserida no apelo solene de Paulo; as vírgulas preservam essa função com clareza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Bendito” preserva o tom reverente e doxológico; a ordem sintática mantém a solenidade sem soar arcaica.
