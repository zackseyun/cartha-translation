  text: καὶ οὐ ⸀θαῦμα, αὐτὸς γὰρ ὁ Σατανᾶς μετασχηματίζεται εἰς ἄγγελον φωτός·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/014.yaml
  text: And no wonder[a], for Satan himself disguises himself as an angel of light.
translation:
  language: pt
  text: E não é de admirar[a], pois o próprio Satanás se disfarça de anjo de luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E isso não é surpresa”. O verbo grego traduzido por “se disfarça” também pode ser entendido mais literalmente como “muda de forma” ou “se transforma”. Neste contexto, provavelmente indica uma aparência enganosa.'
    reason: Alternativa idiomática e lexical; preserva a amplitude de μετασχηματίζεται.
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a ligação com o versículo anterior de modo natural e direto em português.
- source_word: οὐ θαῦμα
  choice: não é de admirar
  rationale: Expressão idiomática e digna que comunica que isso não causa surpresa, sem ampliar o sentido.
- source_word: αὐτὸς ... ὁ Σατανᾶς
  choice: o próprio Satanás
  rationale: Expressa a força intensiva de αὐτός; o artigo grego integra a construção do nome próprio e não exige uma tradução separada.
- source_word: γὰρ
  choice: pois
  rationale: Introduz de forma clara e concisa a razão para a afirmação anterior.
- source_word: μετασχηματίζεται
  choice: se disfarça
  rationale: No contexto de engano e falsa aparência, traduz naturalmente a ideia de assumir outra forma ou aspecto, sem afirmar necessariamente uma mudança de natureza.
- source_word: εἰς ἄγγελον φωτός
  choice: de anjo de luz
  rationale: Com 'se disfarça', a preposição portuguesa 'de' introduz idiomaticamente a aparência ou identidade assumida; 'anjo de luz' preserva a imagem e a estrutura essencial do grego.
theological_decisions:
- issue: Natureza da mudança de Satanás
  choice: Apresentação exterior enganosa, expressa por 'se disfarça de'.
  alternative: Transformação real em anjo de luz, expressa por 'se transforma em'.
  rationale: O contexto trata de falsos apóstolos que assumem uma aparência enganosa. A tradução escolhida comunica essa ênfase, enquanto a nota preserva a possibilidade lexical mais literal sem fazer uma afirmação metafísica adicional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Não é de admirar' conserva o tom retórico; 'o próprio Satanás' mantém a ênfase; e 'se disfarça de anjo de luz' soa natural sem eliminar a alternativa lexical registrada na nota.
