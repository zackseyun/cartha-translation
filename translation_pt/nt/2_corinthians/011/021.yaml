base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/021.yaml
  text: I say this to our shame[a], as though we had been weak[d][c][b]. Yet in whatever anyone dares to boast—I am speaking foolishly—I also dare.
translation:
  language: pt
  text: Digo isso para nossa vergonha, como se tivéssemos sido fracos.[a] Mas, naquilo em que alguém ousa — falo como insensato —, eu também ouso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Digo isso como desonra [ou: com desonra], como se tivéssemos sido fracos”. A expressão grega é idiomática; Paulo fala ironicamente neste contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'O sentido contextual é: “naquilo em que alguém ousa vangloriar-se ... eu também ouso”. O verbo “vangloriar-se” está implícito no grego.'
    reason: implicit_object
lexical_decisions:
- source_word: κατὰ ἀτιμίαν
  choice: Para desonra nossa
  rationale: A expressão é idiomática e difícil. Esta formulação conserva a ideia de desonra ou humilhação ligada a Paulo e seus cooperadores, sem decidir de modo excessivo entre vergonha reconhecida e fala desonrosa.
- source_word: ὡς ὅτι ἡμεῖς ἠσθενήκαμεν
  choice: como se nós tivéssemos sido fracos
  rationale: Reproduz a concessão irônica e o valor retrospectivo do perfeito, sem transformar a frase numa admissão direta de falta de legitimidade apostólica.
- source_word: ἐν ᾧ δ’ ἄν τις τολμᾷ
  choice: Mas, naquilo em que alguém ousa
  rationale: Mantém o objeto de 'ousar' implícito, como no grego, enquanto o contexto de vanglória o torna recuperável.
- source_word: ἐν ἀφροσύνῃ λέγω
  choice: falo como insensato
  rationale: Expressa de forma natural a ressalva retórica de Paulo; 'como insensato' preserva a caracterização da fala sem afirmar que ele seja de fato insensato.
- source_word: τολμῶ κἀγώ
  choice: eu também ouso
  rationale: Preserva a repetição de τολμάω e o paralelismo enfático com aquilo que os adversários ousam.
theological_decisions:
- issue: Ironia retórica acerca da fraqueza de Paulo
  choice: 'Conservar a declaração como concessão irônica: ''como se nós tivéssemos sido fracos'''
  alternative: 'Entendê-la como admissão direta: ''porque fomos fracos'' ou ''que nós éramos fracos'''
  rationale: O contexto do discurso 'insensato' contrapõe Paulo aos adversários que se vangloriam. A construção ὡς ὅτι favorece aparência ou concessão irônica, sem negar que a fraqueza seja um tema teológico real em 2 Coríntios.
- issue: Objeto implícito de τολμᾷ
  choice: Deixar 'vangloriar-se' implícito no texto e explicá-lo em nota
  alternative: 'Explicitar no corpo: ''ousa vangloriar-se'''
  rationale: Assim se conserva a forma aberta do original e a repetição entre 'alguém ousa' e 'eu também ouso', enquanto a nota esclarece o contexto.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A colocação 'Para desonra nossa' retém a estranheza controlada do idioma grego; 'falo como insensato' é corrente sem ser coloquial. As notas preservam alternativas reais e esclarecem a ironia e o objeto elíptico.
