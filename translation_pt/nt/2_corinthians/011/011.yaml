  yaml_path: translation/nt/2_corinthians/011/011.yaml
  text: Why? Because I do not love you? God knows I do.
translation:
  language: pt
  text: Por quê? Porque não amo vocês? Deus sabe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, explicitando a resposta implícita: «Deus sabe que amo vocês». O grego diz literalmente apenas «Deus sabe».'
    reason: alternativa lexical e esclarecimento da elipse retórica
lexical_decisions:
- source_word: διὰ τί
  choice: Por quê?
  rationale: Pergunta idiomática e concisa que preserva a força retórica do grego.
- source_word: ὅτι
  choice: Porque
  rationale: Introduz a explicação interrogativa após «Por quê?» de modo natural em português.
- source_word: οὐκ ἀγαπῶ ὑμᾶς
  choice: não amo vocês
  rationale: Preserva diretamente a negação, o verbo «amar» e o objeto plural, com ampla legibilidade brasileira.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Equivalente padrão de θεός neste contexto.
- source_word: οἶδεν
  choice: sabe
  rationale: Traduz exatamente a declaração elíptica do grego, sem explicitar no texto principal a resposta positiva subentendida.
theological_decisions:
- issue: Se a última oração deve explicitar que Paulo ama os coríntios
  choice: Deus sabe.
  alternative: Deus sabe que amo vocês.
  rationale: O grego diz apenas «Deus sabe». Manter a elipse preserva a ambiguidade formal e a força do apelo retórico, enquanto a nota esclarece o sentido contextual provável.
translation_notes:
  register: Português moderno, digno e direto, com «vocês» para o plural ὑμᾶς, favorecendo a legibilidade brasileira sem regionalismo excessivo.
