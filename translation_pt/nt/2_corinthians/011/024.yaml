lexical_decisions:
- source_word: ὑπὸ Ἰουδαίων
  choice: dos judeus
  rationale: A construção ὑπό com genitivo indica os agentes ou a fonte da punição. “Dos judeus” é natural em português e evita acrescentar a ideia não expressa de uma autoridade formal específica.
- source_word: πεντάκις
  choice: Cinco vezes
  rationale: Reproduz diretamente o advérbio e mantém a ênfase na repetição da experiência.
- source_word: τεσσεράκοντα παρὰ μίαν
  choice: quarenta açoites menos um
  rationale: Preserva a forma da expressão grega, “quarenta menos um”, enquanto “açoites” explicita de modo necessário e contextual o tipo de punição recebido.
- source_word: ἔλαβον
  choice: recebi
  rationale: Traduz literalmente λαμβάνω no sentido de ser submetido a uma punição, com formulação natural e dignificada em português.
