  text: Ἑβραῖοί εἰσιν; κἀγώ. Ἰσραηλῖταί εἰσιν; κἀγώ. σπέρμα Ἀβραάμ εἰσιν; κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/022.yaml
  text: Are they Hebrews? So am I[a]. Are they Israelites? So am I. Are they Abraham’s offspring? So am I.
translation:
  language: pt
  text: Eles são hebreus? Eu também. São israelitas? Eu também. São descendência de Abraão[a]? Eu também.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “semente de Abraão”. O grego emprega uma expressão coletiva no singular.'
    reason: alternativa lexical e esclarecimento da forma coletiva singular
lexical_decisions:
- source_word: Ἑβραῖοί
  choice: hebreus
  rationale: Mantém a designação étnico-religiosa tradicional e a distingue de “israelitas” e de “descendência de Abraão”.
- source_word: κἀγώ
  choice: Eu também
  rationale: Reproduz de modo natural e enfático a resposta breve e repetida de Paulo.
- source_word: Ἰσραηλῖται
  choice: israelitas
  rationale: Expressa precisamente a pertença a Israel e preserva a sequência de três designações distintas.
- source_word: σπέρμα Ἀβραάμ
  choice: descendência de Abraão
  rationale: “Descendência” é corrente em português e conserva o valor coletivo do substantivo grego singular, sem limitar a referência a um único descendente.
- source_word: εἰσιν
  choice: Eles são / São
  rationale: Integra a cópula às perguntas retóricas de maneira idiomática, sem perder a estrutura repetitiva do original.
theological_decisions:
- issue: Distinção entre três designações da identidade judaica
  choice: Manter “hebreus”, “israelitas” e “descendência de Abraão” como expressões distintas
  alternative: Uniformizar as três expressões como “judeus” ou “descendentes de Abraão”
  rationale: A acumulação de termos sobrepostos, mas não idênticos, é parte da força retórica do texto e não deve ser nivelada.
translation_notes:
  register: Português moderno, claro e digno, com frases breves para conservar o ritmo incisivo das perguntas e respostas. O pronome “eles” aparece na primeira pergunta e fica implícito nas seguintes, como é natural em português.
