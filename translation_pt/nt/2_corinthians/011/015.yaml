id: 2CO.11.15
reference: 2 Corinthians 11:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ μέγα οὖν εἰ καὶ οἱ διάκονοι αὐτοῦ μετασχηματίζονται ὡς διάκονοι δικαιοσύνης, ὧν τὸ τέλος ἔσται κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/015.yaml
  text: So it is no great thing if his servants also disguise themselves as servants of righteousness[a], whose end will be according to their works.
translation:
  language: pt
  text: Portanto, não é de admirar que também os servos dele se disfarcem de servos da justiça[a]. O fim deles será de acordo com as suas obras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”. A palavra grega pode significar tanto “justiça” como “retidão”; aqui se refere à aparência de estar a serviço do que é certo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέγα
  choice: não é de admirar
  rationale: Expressa de modo natural em português a ideia idiomática de que isso não é algo extraordinário nem surpreendente.
- source_word: οὖν
  choice: Portanto
  rationale: Mantém a inferência lógica em relação ao versículo anterior.
- source_word: διάκονοι
  choice: servos
  rationale: No contexto, designa agentes que servem a Satanás; evita a conotação eclesiástica positiva que “ministros” poderia sugerir.
- source_word: μετασχηματίζονται
  choice: se disfarcem
  rationale: Indica mudança enganosa de aparência ou apresentação, não transformação interior.
- source_word: ὡς
  choice: de
  rationale: Na construção portuguesa “disfarçar-se de”, introduz naturalmente a identidade aparente assumida e corresponde funcionalmente ao grego ὡς.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: “Servos da justiça” é natural e abrange aqui a alegação de estar a serviço do que é reto; a nota preserva a alternativa lexical “retidão”.
- source_word: τὸ τέλος
  choice: O fim deles
  rationale: Conserva a formulação concisa de julgamento e a referência ao destino final dessas pessoas.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: de acordo com as suas obras
  rationale: Preserva a correspondência entre o desfecho e as ações, bem como a continuidade lexical tradicional de ἔργα como “obras”.
theological_decisions:
- issue: Sentido de δικαιοσύνη na expressão διάκονοι δικαιοσύνης
  choice: justiça
  alternative: retidão
  rationale: O termo grego pode designar justiça ou retidão. Neste contexto, caracteriza a aparência de serviço ao que é justo e correto, sem definir mais precisamente uma doutrina da justificação.
- issue: Relação entre o fim e as obras
  choice: será de acordo com as suas obras
  alternative: corresponderá aos seus atos
  rationale: Mantém a fórmula de juízo do texto sem acrescentar uma explicação sobre mérito, causa ou mecanismo da condenação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Não é de admirar” comunica naturalmente o idiomatismo grego, e “se disfarcem” preserva o contexto de engano. A divisão em duas frases favorece clareza sem alterar a relação sintática e lógica.
