source:
  edition: SBLGNT
  text: ὃ λαλῶ οὐ ⸂κατὰ κύριον λαλῶ⸃, ἀλλ’ ὡς ἐν ἀφροσύνῃ, ἐν ταύτῃ τῇ ὑποστάσει τῆς καυχήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/017.yaml
  text: What I am saying[a], I am not saying according to the Lord, but as in foolishness[c][b], in this confidence of boasting.
translation:
  language: pt
  text: O que digo não o digo segundo o Senhor,[a] mas como em insensatez,[b] nesta confiança em gloriar-se.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não o digo como da parte do Senhor” ou “conforme o padrão do Senhor”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “mas como se estivesse agindo com insensatez”; de modo mais idiomático, “mas como um insensato”.'
    reason: lexical_alternative
  - marker: c
    text: A palavra grega traduzida por “confiança” também pode significar, neste contexto, “questão”, “base” ou “empreendimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ λαλῶ
  choice: O que estou dizendo
  rationale: Expressa de modo natural o conteúdo da fala presente de Paulo e preserva o aspecto contínuo do presente grego.
- source_word: κατὰ κύριον
  choice: segundo o Senhor
  rationale: Mantém a ideia de norma ou padrão expressa por κατά com acusativo, sem decidir se Paulo se refere à maneira, à autoridade ou ao padrão do Senhor.
- source_word: κύριον
  choice: Senhor
  rationale: É a tradução usual de κύριος e, no contexto, refere-se naturalmente ao Senhor Jesus sem exigir explicitação.
- source_word: ἀλλ’ ὡς ἐν ἀφροσύνῃ
  choice: mas como em insensatez
  rationale: Conserva a formulação qualificada do grego, na qual Paulo caracteriza o modo de falar sem se identificar diretamente como insensato.
- source_word: ἐν ταύτῃ τῇ ὑποστάσει
  choice: nesta confiança
  rationale: ὑπόστασις é semanticamente difícil aqui; “confiança” comunica uma postura segura ligada à glória pessoal, embora “questão”, “base” ou “empreendimento” também sejam possíveis.
- source_word: τῆς καυχήσεως
  choice: de me gloriar
  rationale: A construção verbal é mais natural em português do que “da glória” ou “da jactância” e preserva o sentido de καύχησις como ato de gloriar-se.
theological_decisions:
- issue: Referência e força de κατὰ κύριον (“segundo o Senhor”)
  choice: Paulo afirma que sua fala de autoexaltação não segue o padrão ou a maneira do Senhor.
  alternative: Paulo pode estar dizendo que não cita uma palavra ou ordem direta do Senhor, ou que não fala isso como algo procedente do Senhor.
  rationale: A tradução literal e natural “segundo o Senhor” preserva a tensão e não transforma a ressalva retórica de Paulo numa negação explícita da inspiração ou veracidade de suas palavras.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, mantendo a estrutura retórica e as ambiguidades do grego. “Insensatez” evita o tom excessivamente coloquial de “tolice”, e “me gloriar” é corrente no registro bíblico sem soar arcaico.
