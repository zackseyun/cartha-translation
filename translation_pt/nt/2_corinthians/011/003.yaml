id: 2CO.11.3
reference: 2 Corinthians 11:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: φοβοῦμαι δὲ μή πως, ὡς ὁ ὄφις ⸂ἐξηπάτησεν Εὕαν⸃ ἐν τῇ πανουργίᾳ αὐτοῦ, ⸀φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ τῆς ἁπλότητος ⸂καὶ τῆς ἁγνότητος⸃ τῆς εἰς τὸν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/003.yaml
  text: But I fear that somehow[a], just as the serpent deceived Eve by his cunning[d][c][b], your minds may be corrupted from the sincerity and purity that are toward Messiah.
translation:
  language: pt
  text: Mas temo que, de algum modo, assim como a serpente enganou Eva com sua astúcia, seus pensamentos sejam corrompidos, afastando-se da sinceridade[a] e da pureza[b] para com o Messias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “simplicidade” ou “inteireza de coração”.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos não trazem “e da pureza”.
    reason: textual_variant
lexical_decisions:
- source_word: φοβοῦμαι δὲ μή πως
  choice: Mas temo que... de algum modo
  rationale: Mantém a apreensão contínua de Paulo e expressa de maneira natural em português a construção que introduz o conteúdo do temor.
- source_word: ὁ ὄφις
  choice: a serpente
  rationale: Preserva claramente a alusão a Gênesis e o registro bíblico.
- source_word: ἐξηπάτησεν
  choice: enganou
  rationale: Comunica diretamente a ideia de engano, sem tornar artificial em português a possível força intensiva do verbo composto.
- source_word: ἐν τῇ πανουργίᾳ αὐτοῦ
  choice: com sua astúcia
  rationale: Apresenta a astúcia como o meio empregado pela serpente e conserva a conotação de habilidade enganosa.
- source_word: φθαρῇ τὰ νοήματα ὑμῶν
  choice: a mente de vocês seja corrompida
  rationale: Preserva a voz passiva e traduz o plural grego coletivo por uma expressão portuguesa natural, referente ao modo de pensar dos destinatários.
- source_word: ἀπὸ
  choice: e se afaste de
  rationale: Explicita em português a separação indicada pela preposição, sem alterar a relação sintática fundamental.
- source_word: τῆς ἁπλότητος
  choice: da sinceridade
  rationale: Neste contexto, o termo aponta para franqueza e devoção sem duplicidade; a nota conserva os sentidos possíveis de simplicidade e inteireza de coração.
- source_word: καὶ τῆς ἁγνότητος
  choice: e da pureza
  rationale: Mantém a qualidade moral ampla do termo e sua conexão com a imagem de fidelidade nupcial no contexto imediato.
- source_word: τῆς εἰς τὸν Χριστόν
  choice: para com o Messias
  rationale: A expressão portuguesa indica adequadamente a orientação relacional da sinceridade e da pureza, enquanto 'Messias' traduz o valor titular de Χριστός.
theological_decisions:
- issue: Tradução de Χριστόν
  choice: o Messias
  alternative: Cristo
  rationale: Χριστός conserva aqui valor titular; 'Messias' comunica o significado do título sem tratá-lo apenas como nome próprio.
- issue: Sentido de ἁπλότης
  choice: sinceridade
  alternative: simplicidade; inteireza de coração
  rationale: A advertência diz respeito a uma disposição franca e indivisa para com o Messias. A nota preserva a amplitude lexical sem impor uma interpretação denominacional.
- issue: Presença de καὶ τῆς ἁγνότητος
  choice: incluir 'e da pureza'
  alternative: omitir a expressão
  rationale: A edição SBLGNT inclui as palavras no texto principal; a leitura mais curta, atestada por alguns manuscritos, é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'vocês' para o plural e mantém a comparação com Gênesis. A formulação evita tanto um literalismo rígido quanto uma paráfrase que transforme 'sinceridade e pureza' em um único conceito.
