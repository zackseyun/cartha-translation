base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/001.yaml
  text: I wish you would bear with me in a little foolishness[a]. But indeed[b], do bear with me.
translation:
  language: pt
  text: Quem dera vocês me suportassem em um pouco de insensatez[a]! Mas, de fato, suportem-me[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um pouco de loucura”.
    reason: lexical_alternative
  - marker: b
    text: Ou “tenham paciência comigo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὄφελον
  choice: Quem dera
  rationale: Expressa de modo natural e digno um desejo, preservando a força optativa da partícula sem recorrer a uma construção excessivamente literal.
- source_word: ἀνείχεσθέ / ἀνέχεσθέ
  choice: me suportassem / suportem-me
  rationale: O verbo ἀνέχομαι indica tolerar ou aguentar pacientemente alguém. A repetição foi mantida, e a mudança para o imperativo na segunda ocorrência reproduz o apelo renovado.
- source_word: μικρόν τι
  choice: um pouco de
  rationale: Reproduz de forma compacta a ideia de pequena medida ou grau presente na combinação grega.
- source_word: ἀφροσύνης
  choice: insensatez
  rationale: Termo atual e digno que conserva a autodepreciação retórica de Paulo e evita o tom potencialmente coloquial de outras opções.
- source_word: ἀλλὰ καὶ
  choice: Mas, de fato
  rationale: Preserva tanto o valor adversativo quanto o reforço enfático com que Paulo retoma seu pedido.
theological_decisions:
- issue: A descrição de Paulo de sua própria fala como ἀφροσύνη
  choice: insensatez
  alternative: loucura
  rationale: Mantém a tensão irônica e autodepreciativa que introduz a seção de vanglória, sem suavizá-la nem convertê-la em afirmação doutrinária sobre Paulo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Quem dera” conserva a força do desejo; “vocês” torna explícito o sujeito plural já marcado no grego. A pontuação separa o desejo inicial do apelo enfático final.
