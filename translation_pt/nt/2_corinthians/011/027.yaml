base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/027.yaml
  text: in labor and hardship[a], in many sleepless nights, in hunger and thirst, in frequent fastings[b], in cold and exposure.
translation:
  language: pt
  text: em trabalho árduo e sofrimento, em muitas noites sem dormir, com fome e sede, em frequentes jejuns[a], passando frio e com roupa insuficiente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em jejuns frequentes”. O grego se refere a jejuns repetidos, mas o texto não especifica se eram voluntários ou impostos pelas circunstâncias.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em nudez”. Neste contexto, pode indicar falta de roupa adequada e exposição aos elementos.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόπῳ
  choice: trabalho árduo
  rationale: Expressa o esforço laborioso e extenuante de κόπος em português corrente, preservando o primeiro elemento do par cumulativo.
- source_word: μόχθῳ
  choice: sofrimento
  rationale: Distingue μόχθος de κόπος e comunica a aflição e a penosidade ligadas ao trabalho, sem reduzir os dois termos a sinônimos idênticos.
- source_word: ἐν ἀγρυπνίαις πολλάκις
  choice: em muitas noites sem dormir
  rationale: Traduz de modo natural os repetidos períodos de vigília ou insônia indicados pelo plural ἀγρυπνίαις e por πολλάκις.
- source_word: ἐν λιμῷ καὶ δίψει
  choice: com fome e sede
  rationale: Apresenta de forma idiomática as condições de privação suportadas por Paulo, mantendo o par conciso do grego.
- source_word: ἐν νηστείαις πολλάκις
  choice: em frequentes jejuns
  rationale: Preserva o sentido lexical de νηστεία e sua distinção em relação à fome já mencionada, sem decidir se os jejuns eram voluntários ou impostos pelas circunstâncias.
- source_word: ἐν ψύχει
  choice: passando frio
  rationale: Comunica naturalmente em português o frio como condição adversa suportada.
- source_word: γυμνότητι
  choice: sem roupa adequada
  rationale: No catálogo de sofrimentos, comunica a provável ideia de vestuário insuficiente e exposição aos elementos; a tradução mais literal é mantida em nota.
theological_decisions:
- issue: Sentido de νηστείαις na lista de sofrimentos
  choice: jejuns
  alternative: privação involuntária de alimento
  rationale: Como λιμός já designa fome, “jejuns” preserva a distinção lexical. O texto não informa se eram práticas voluntárias ou privações impostas pelas circunstâncias, e a nota mantém essa ambiguidade.
- issue: Sentido de γυμνότητι
  choice: sem roupa adequada
  alternative: nudez
  rationale: O contexto de frio e sofrimento favorece a ideia de vestuário insuficiente e exposição, mas a nota registra o sentido mais literal sem excluir essa possibilidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A repetição de condições adversas conserva o ritmo cumulativo da lista, enquanto construções idiomáticas evitam rigidez desnecessária.
