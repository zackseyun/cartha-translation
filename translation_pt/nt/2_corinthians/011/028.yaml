  yaml_path: translation/nt/2_corinthians/011/028.yaml
  text: 'Apart from such external things[c][b][a], there is the daily pressure on me: concern for all the churches.'
translation:
  language: pt
  text: 'Além de outras coisas[a], há sobre mim a pressão diária[b]: a preocupação com todas as igrejas[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “À parte das outras coisas”; ou: “Além das coisas que não mencionei”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o peso que recai diariamente sobre mim”; ou: “aquilo que me pressiona todos os dias”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a ansiedade por todas as igrejas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς τῶν παρεκτὸς
  choice: À parte dessas coisas externas
  rationale: A expressão indica aquilo que fica à parte ou além do que acabou de ser enumerado. A tradução mantém a ligação com os sofrimentos externos mencionados anteriormente, sem excluir as alternativas de sentido registradas em nota.
- source_word: ἐπίστασίς μοι
  choice: há a pressão ... sobre mim
  rationale: ἐπίστασις pode indicar pressão, investida ou algo que pesa sobre alguém. Aqui, a explicação subsequente sobre a preocupação pelas igrejas favorece o sentido figurado de pressão, e o dativo μοι é representado naturalmente por “sobre mim”.
- source_word: ἡ καθ’ ἡμέραν
  choice: diária
  rationale: A expressão preposicional articulada qualifica a pressão como algo recorrente a cada dia. “Diária” é conciso e natural em português.
- source_word: ἡ μέριμνα
  choice: a preocupação
  rationale: μέριμνα abrange cuidado, preocupação e ansiedade. “Preocupação” preserva tanto o cuidado pastoral quanto seu peso emocional, sem caracterizá-lo necessariamente como ansiedade moralmente censurável.
- source_word: πασῶν τῶν ἐκκλησιῶν
  choice: com todas as igrejas
  rationale: No uso paulino, ἐκκλησίαι são as comunidades cristãs. Em português, “preocupação com todas as igrejas” expressa de modo idiomático a relação genitiva.
theological_decisions:
- issue: Nuance do encargo pastoral de Paulo em μέριμνα
  choice: preocupação com todas as igrejas
  alternative: ansiedade por todas as igrejas; cuidado de todas as igrejas
  rationale: “Preocupação” comunica cuidado pastoral genuíno e peso interior sem impor ao texto um juízo moral negativo sobre a ansiedade. A nota conserva a possibilidade lexical mais intensa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “À parte” conserva a relação lógica do grego; “pressão diária sobre mim” mantém a força experiencial; “preocupação” preserva deliberadamente a tensão entre cuidado pastoral e aflição interior.
