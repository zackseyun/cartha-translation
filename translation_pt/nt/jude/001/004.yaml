  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: παρεισέδυσαν γάρ τινες ἄνθρωποι, οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα, ἀσεβεῖς, τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν καὶ τὸν μόνον ⸀δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν ἀρνούμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/004.yaml
  text: For certain men have slipped in unnoticed[a], who long ago were designated for this judgment, ungodly men who turn the grace of our God into sensuality and deny our only Master and Lord[d][c][b], Jesus the Messiah.
translation:
  language: pt
  text: Pois certas pessoas se infiltraram sem ser notadas[a]. Há muito tempo, elas foram indicadas para este juízo[b]. São ímpias, transformam a graça de nosso Deus em libertinagem[c] e negam nosso único Soberano e Senhor, Jesus, o Messias[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entraram sorrateiramente” ou “se introduziram às escondidas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a respeito dos quais há muito se escreveu antecipadamente acerca deste juízo” ou “há muito foram designados anteriormente para este juízo”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “devassidão”, “conduta desenfreada” ou “licenciosidade”.'
    reason: lexical_alternative
  - marker: d
    text: Em grego, “Jesus Cristo”. “Messias” traduz Χριστός, empregado aqui como título; os títulos “Soberano” e “Senhor” referem-se a Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεισέδυσαν
  choice: se infiltraram sem serem notados
  rationale: Expressa a entrada clandestina e dissimulada indicada pelo verbo, em linguagem portuguesa natural e atual.
- source_word: πάλαι προγεγραμμένοι
  choice: há muito tempo, eles foram indicados
  rationale: Mantém tanto a anterioridade remota de πάλαι quanto a ideia de prévia indicação de προγεγραμμένοι, sem impor a conclusão mais forte de predestinação individual; uma nota registra o sentido mais literal ligado a escrever previamente.
- source_word: κρίμα
  choice: juízo
  rationale: Preserva a amplitude judicial do termo, que pode abranger o ato de julgar, a sentença ou a condenação resultante.
- source_word: ἀσεβεῖς
  choice: ímpios
  rationale: Termo corrente e digno que caracteriza essas pessoas por sua irreverência e oposição a Deus.
- source_word: χάριτα
  choice: graça
  rationale: É a tradução teológica tradicional e semanticamente adequada para o favor gracioso de Deus neste contexto.
- source_word: μετατιθέντες
  choice: transformam ... em
  rationale: Representa diretamente a mudança de uma coisa em outra sem introduzir no texto principal a interpretação mais explícita de 'perverter'.
- source_word: ἀσέλγειαν
  choice: libertinagem
  rationale: Comunica conduta desenfreada e desavergonhada, frequentemente de caráter sexual, sem restringir o termo apenas à esfera sexual.
- source_word: μόνον δεσπότην καὶ κύριον
  choice: único Soberano e Senhor
  rationale: Conserva os dois títulos distintos. 'Soberano' comunica a autoridade de δεσπότης e evita a repetição pouco clara de 'Senhor e Senhor'.
- source_word: Ἰησοῦν Χριστόν
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título e usa uma construção idiomática em português, em vez de tratá-lo apenas como parte de um nome próprio.
- source_word: ἀρνούμενοι
  choice: negam
  rationale: Verbo direto e tradicional que abrange repúdio tanto por confissão quanto por conduta.
theological_decisions:
- issue: Sentido de προγεγραμμένοι εἰς τοῦτο τὸ κρίμα
  choice: prévia indicação para este juízo, sem afirmar explicitamente predestinação individual
  alternative: terem sido mencionados por escrito de antemão a respeito deste juízo; terem sido predestinados para esta condenação
  rationale: O particípio pode apontar para registro profético anterior ou para designação prévia. O texto principal mantém a noção de anterioridade e indicação, enquanto a nota conserva a alternativa mais literal, sem resolver além do necessário a tensão teológica.
- issue: Referente de “único Soberano e Senhor”
  choice: os dois títulos se referem a Jesus, o Messias
  alternative: “Soberano” refere-se a Deus Pai, e “Senhor”, a Jesus, o Messias
  rationale: A construção grega une naturalmente os dois títulos antes do único nome em aposição, favorecendo um só referente, embora a nota reconheça a outra análise possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em três frases reduz a sobrecarga sintática do período grego sem alterar suas relações lógicas. “Pois” preserva a ligação explicativa com o contexto anterior; “libertinagem” mantém a força moral do original; e “Jesus, o Messias” explicita o valor titular de Χριστός.
