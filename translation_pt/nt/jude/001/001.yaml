id: JUD.1.1
reference: Jude 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος, ἀδελφὸς δὲ Ἰακώβου, τοῖς ἐν θεῷ πατρὶ ⸀ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/001.yaml
  text: 'Jude[a], a slave of Jesus the Messiah and brother of James, to those who are loved in God the Father and kept for Jesus the Messiah[c][b], called:'
translation:
  language: pt
  text: 'Judas, escravo de Jesus, o Messias, e irmão de Tiago, aos que são amados[b] em Deus Pai, guardados para Jesus, o Messias,[a] e chamados:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “guardados por Jesus, o Messias”. O dativo grego pode indicar agência (“por”) ou destinação/benefício (“para”).'
    reason: alternative_reading
  - marker: b
    text: Alguns manuscritos trazem “santificados em Deus Pai” em vez de “amados em Deus Pai”.
    reason: textual_variant
lexical_decisions:
- source_word: Ἰούδας
  choice: Judas
  rationale: Em português, Judas é a forma convencional do nome grego Ἰούδας; não há uma forma distinta equivalente ao inglês “Jude”.
- source_word: δοῦλος
  choice: escravo
  rationale: Preserva a ideia de pertencimento e serviço vinculante expressa pelo termo, mais forte que “servo”.
- source_word: Χριστοῦ / Χριστῷ
  choice: o Messias
  rationale: Traduz o valor titular de Χριστός, em vez de tratá-lo apenas como parte de um nome próprio.
- source_word: ἀδελφὸς δὲ Ἰακώβου
  choice: e irmão de Tiago
  rationale: δέ tem aqui força conectiva branda; “e” produz português natural sem impor contraste forte.
- source_word: ἐν θεῷ πατρὶ
  choice: em Deus Pai
  rationale: Mantém o sentido de esfera ou relação expresso por ἐν sem o converter em agência.
- source_word: ἠγαπημένοις
  choice: amados
  rationale: Comunica o estado resultante indicado pelo particípio perfeito passivo, em linguagem clara e atual.
- source_word: τετηρημένοις
  choice: guardados para
  rationale: Expressa preservação contínua resultante e mantém, no texto principal, a provável noção de destinação ou benefício do dativo.
- source_word: κλητοῖς
  choice: chamados
  rationale: O adjetivo substantivado descreve os destinatários e permanece paralelo a “amados” e “guardados”.
- source_word: Ἰάκωβος
  choice: Tiago
  rationale: É a forma convencional em português para esta personagem do Novo Testamento.
theological_decisions:
- issue: Relação de τετηρημένοις com Ἰησοῦ Χριστῷ
  choice: guardados para Jesus, o Messias
  alternative: guardados por Jesus, o Messias
  rationale: O dativo pode indicar destinação ou benefício (“para”) ou ser entendido como agência (“por”). A leitura principal preserva a provável orientação para o Messias, e a ambiguidade real é registrada em nota.
- issue: Leitura de ἠγαπημένοις
  choice: amados
  alternative: santificados
  rationale: O texto da SBLGNT traz ἠγαπημένοις (“amados”); alguns manuscritos apresentam ἡγιασμένοις (“santificados”), variante registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura da saudação conserva o paralelismo entre “amados”, “guardados” e “chamados”. A aposição “o Messias” explicita o caráter titular de Χριστός sem perder a identificação de Jesus.
