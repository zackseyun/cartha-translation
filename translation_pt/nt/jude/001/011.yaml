    rationale: Embora a nota registre alternativas úteis, num texto de equivalência ótima a redação principal deve conservar, quando possível, tanto a força impetuosa do verbo quanto sua ligação com τῇ πλάνῃ. «Precipitaram-se ... no erro» faz isso em português corrente, sem alegar uma imagem literal inexistente no texto principal.
