  source_fidelity: 'A primeira e a terceira cláusulas são fiéis: «seguiram o caminho de Caim» transmite adequadamente a metáfora de ἐπορεύθησαν com ὁδός, e «pereceram na rebelião de Corá» expressa naturalmente a alusão de ἀντιλογία a Números 16. Na cláusula central, porém, «entregaram-se desenfreadamente» explicita uma ideia possível de abandono imprudente, mas deixa pouco visível o movimento impetuoso em direção ao erro, presente na construção grega com τῇ πλάνῃ. «Precipitaram-se ... no erro» representa melhor esse movimento e conserva a concisão metafórica.'
  naturalness: «Ai deles, pois» e a estrutura tripla são naturais e solenes em português moderno. «Precipitaram-se por recompensa no erro de Balaão» é idiomático, claro e mantém o paralelismo verbal do versículo. A nota permite registrar a imagem incomum de «derramar-se» sem sobrecarregar o texto principal.
  terminology: Caim, Balaão e Corá são as formas bíblicas estabelecidas e adequadas ao público lusófono. «Erro» conserva a amplitude de πλάνη sem decidir entre engano, desvio ou sedução. «Recompensa» é aceitável para μισθός; a locução «por recompensa» exprime mais diretamente a motivação indicada pelo genitivo.
