  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐαὶ αὐτοῖς, ὅτι τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν, καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν, καὶ τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/011.yaml
  text: Woe to them[a], because they have walked in the way of Cain, and have poured themselves out for pay into Balaam’s error, and have perished in Korah’s rebellion.
translation:
  language: pt
  text: Ai deles, pois seguiram o caminho de Caim, precipitaram-se por recompensa no erro de Balaão[a] e pereceram na rebelião de Corá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “derramaram-se, por recompensa, no erro de Balaão”. Ou: “por lucro, precipitaram-se no erro de Balaão”.'
    reason: A expressão grega é metafórica e sintaticamente comprimida. A nota preserva a imagem de ἐξεχύθησαν e registra uma alternativa idiomática para a motivação expressa por μισθοῦ.
lexical_decisions:
- source_word: οὐαὶ αὐτοῖς
  choice: Ai deles!
  rationale: Mantém a força profética de denúncia e juízo de οὐαί, em formulação corrente e solene em português.
- source_word: τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν
  choice: seguiram o caminho de Caim
  rationale: Expressa com naturalidade o movimento figurado de ἐπορεύθησαν e preserva ὁδός como metáfora de uma conduta moral.
- source_word: τῇ πλάνῃ τοῦ Βαλαὰμ
  choice: ao erro de Balaão
  rationale: πλάνη pode indicar erro, engano ou desvio. “Erro” preserva a amplitude da expressão, enquanto “ao” se ajusta ao movimento expresso pelo verbo no contexto.
- source_word: μισθοῦ
  choice: em troca de recompensa
  rationale: Torna explícita a motivação mercenária, sem restringir μισθός a salário regular; a expressão pode indicar pagamento, ganho ou recompensa.
- source_word: ἐξεχύθησαν
  choice: entregaram-se desenfreadamente
  rationale: O verbo significa literalmente “foram derramados”, mas aqui descreve figuradamente um abandono impetuoso. A escolha comunica a força da imagem em português natural; a tradução mais imagética é registrada em nota.
- source_word: τῇ ἀντιλογίᾳ τοῦ Κόρε
  choice: na rebelião de Corá
  rationale: Embora ἀντιλογία possa significar oposição ou contestação, a alusão a Números 16 favorece “rebelião”, sem acrescentar detalhes interpretativos.
- source_word: ἀπώλοντο
  choice: pereceram
  rationale: Preserva de modo conciso e solene a ideia de destruição ou ruína resultante, sem especificar indevidamente a forma do juízo.
theological_decisions:
- issue: Como traduzir a expressão comprimida καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν
  choice: entregaram-se desenfreadamente, em troca de recompensa, ao erro de Balaão
  alternative: derramaram-se, por recompensa, no erro de Balaão
  rationale: A construção grega combina a imagem de “derramar-se” com a motivação de recompensa e o erro de Balaão. A tradução principal comunica o abandono impetuoso sem tornar o português opaco; a nota preserva a imagem literal e a dificuldade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a estrutura tríplice do versículo e as alusões bíblicas por meio das formas tradicionais Caim, Balaão e Corá.
