id: JUD.1.7
reference: Jude 1:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον ⸂τρόπον τούτοις⸃ ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/007.yaml
  text: just as Sodom and Gomorrah and the cities around them[a], having in like manner committed sexual immorality and gone after other flesh, are set forth as an example[b], undergoing the punishment of eternal fire.
translation:
  language: pt
  text: Assim como Sodoma e Gomorra e as cidades ao redor delas, que, do mesmo modo[a], se entregaram à imoralidade sexual e foram atrás de outra carne[b], são apresentadas como exemplo, sofrendo a pena do fogo eterno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “do mesmo modo que estes”. “Estes” pode referir-se aos anjos mencionados no versículo anterior ou, de maneira mais geral, aos exemplos anteriores de rebelião e juízo.
    reason: alternative_reading
  - marker: b
    text: Ou “carne diferente”; tradicionalmente, “carne estranha”. A expressão foi mantida de forma literal, sem ser limitada a uma única interpretação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Assim como
  rationale: Introduz a comparação com os exemplos anteriores e conserva de modo natural a força comparativa do grego.
- source_word: Σόδομα καὶ Γόμορρα
  choice: Sodoma e Gomorra
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos topônimos em português.
- source_word: αἱ περὶ αὐτὰς πόλεις
  choice: as cidades ao redor delas
  rationale: Conserva o sentido geográfico de περί com acusativo e explicita corretamente o referente feminino plural em português.
- source_word: τὸν ὅμοιον τρόπον τούτοις
  choice: do mesmo modo
  rationale: Expressa a comparação sem fixar no texto principal o antecedente incerto de τούτοις; a formulação completa é registrada em nota.
- source_word: ἐκπορνεύσασαι
  choice: se entregaram à imoralidade sexual
  rationale: Traduz com clareza a conduta sexual ilícita e a força intensiva do verbo composto, em linguagem atual e digna.
- source_word: ἀπελθοῦσαι ὀπίσω
  choice: foram atrás de
  rationale: Reproduz naturalmente em português a expressão idiomática de perseguir ou buscar algo.
- source_word: σαρκὸς ἑτέρας
  choice: outra carne
  rationale: Mantém a formulação concreta e deliberadamente não especificada do grego, sem restringi-la a uma interpretação particular.
- source_word: πρόκεινται δεῖγμα
  choice: são apresentadas como exemplo
  rationale: Comunica que essas cidades estão expostas diante de todos como demonstração ou exemplo de juízo.
- source_word: πυρὸς αἰωνίου
  choice: do fogo eterno
  rationale: Tradução direta da construção genitiva, sem atenuar nem ampliar a linguagem teológica do texto.
- source_word: δίκην ὑπέχουσαι
  choice: sofrendo a pena
  rationale: Preserva a forma participial e o sentido judicial de estar sujeito a uma penalidade.
theological_decisions:
- issue: Referente de τούτοις em τὸν ὅμοιον τρόπον τούτοις
  choice: Traduzir no texto principal como “do mesmo modo” e registrar em nota a expressão completa “do mesmo modo que estes”.
  alternative: Traduzir “do mesmo modo que estes”, entendendo “estes” como os anjos do versículo 6 ou, mais amplamente, como os exemplos anteriores de rebelião e juízo.
  rationale: O grego contém um pronome demonstrativo cujo antecedente é discutido. A tradução conserva a comparação sem decidir silenciosamente entre as possibilidades, e a nota torna explícita a ambiguidade textual.
- issue: Sentido de σαρκὸς ἑτέρας
  choice: outra carne
  alternative: “carne diferente” ou a forma tradicional “carne estranha”; também existem interpretações que especificam práticas sexuais entre pessoas do mesmo sexo ou a transgressão da fronteira entre seres angélicos e humanos.
  rationale: A expressão grega não especifica por si só a natureza exata da transgressão. A tradução literal preserva a tensão interpretativa e evita importar uma conclusão doutrinária mais estreita.
- issue: Força de πυρὸς αἰωνίου
  choice: fogo eterno
  alternative: fogo perpétuo
  rationale: Mantém a expressão do texto sem convertê-la em uma formulação sistemática mais ampla acerca da natureza ou duração do castigo.
translation_notes:
  register: Português contemporâneo, claro e solene, com ampla legibilidade brasileira. A estrutura comparativa e as imagens de “carne” e “fogo eterno” foram preservadas; as ambiguidades genuínas foram indicadas em notas sem impor uma leitura denominacional.
