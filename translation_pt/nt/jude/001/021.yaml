id: JUD.1.21
reference: Jude 1:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε προσδεχόμενοι τὸ ἔλεος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/021.yaml
  text: keep yourselves in the love of God[c][b][a], waiting for the mercy of our Lord Jesus the Messiah unto eternal life.
translation:
  language: pt
  text: Mantenham-se no amor de Deus[a], enquanto aguardam a misericórdia de nosso Senhor Jesus, o Messias[b], para a vida eterna[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “no amor que Deus tem por vocês” ou “no amor a Deus”.
    reason: alternative_reading
  - marker: b
    text: 'Grego: “Jesus Cristo”; aqui, Χριστός é traduzido como o título “Messias”.'
    reason: lexical_alternative
  - marker: c
    text: Ou “que conduz à vida eterna” ou “para a vida eterna”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρήσατε
  choice: Mantenham-se
  rationale: O imperativo aoristo ativo na segunda pessoa do plural dá uma exortação direta. “Mantenham-se” é natural em português e preserva tanto a força imperativa quanto o pronome reflexivo ἑαυτούς.
- source_word: ἐν ἀγάπῃ θεοῦ
  choice: no amor de Deus
  rationale: A expressão conserva a ambiguidade do genitivo grego, podendo apontar para o amor procedente de Deus ou para o amor dirigido a Deus, sem decidir a questão no corpo do texto.
- source_word: προσδεχόμενοι
  choice: enquanto aguardam
  rationale: O particípio presente descreve uma atitude contínua que acompanha a ordem principal. “Enquanto aguardam” expressa essa simultaneidade e expectativa sem acrescentar intensidade indevida.
- source_word: ἔλεος
  choice: misericórdia
  rationale: Equivalente tradicional e atual que preserva a ideia de favor compassivo.
- source_word: κυρίου
  choice: Senhor
  rationale: É o equivalente consagrado e contextualmente apropriado para κύριος no uso do Novo Testamento.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Χριστός conserva aqui seu valor de título. “Jesus, o Messias” comunica esse valor de modo idiomático em português, em vez de tratar “Cristo” apenas como parte de um nome.
- source_word: εἰς ζωὴν αἰώνιον
  choice: para a vida eterna
  rationale: “Para” preserva de modo conciso a orientação ou finalidade indicada por εἰς, sem explicitar além do grego se a misericórdia conduz, se estende ou tem em vista a vida eterna.
theological_decisions:
- issue: Sentido do genitivo em ἀγάπῃ θεοῦ
  choice: Preservar a ambiguidade com “amor de Deus”.
  alternative: “amor que Deus tem por vocês” ou “amor a Deus”
  rationale: O genitivo θεοῦ admite mais de uma relação semântica, e o contexto imediato não exige que a tradução escolha entre o amor de Deus pelos fiéis e o amor deles por Deus.
- issue: Tradução do título Χριστός
  choice: Messias
  alternative: Cristo
  rationale: A forma grega ainda possui valor titular neste contexto; “Messias” traduz o sentido do título, e o artigo em português torna a expressão idiomática sem afirmar que havia artigo no grego.
- issue: Relação de εἰς ζωὴν αἰώνιον com a misericórdia aguardada
  choice: para a vida eterna
  alternative: “que conduz à vida eterna” ou “até a vida eterna”
  rationale: A preposição εἰς indica orientação, alvo ou resultado. A formulação escolhida mantém essa abertura sem transformar uma relação preposicional em uma explicação causal mais definida.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural sobretudo no Brasil e compreensão internacional. O plural “mantenham-se” dirige a exortação à comunidade. “Enquanto aguardam” evita uma sequência rígida de gerúndios e explicita apenas a simultaneidade já presente no particípio grego.
