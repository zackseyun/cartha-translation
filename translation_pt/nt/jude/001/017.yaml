id: JUD.1.17
reference: Jude 1:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὑμεῖς δέ, ἀγαπητοί, μνήσθητε τῶν ῥημάτων τῶν προειρημένων ὑπὸ τῶν ἀποστόλων τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/017.yaml
  text: But you[a], beloved, remember the words spoken beforehand by the apostles of our Lord Jesus the Messiah.
translation:
  language: pt
  text: Vocês, porém, amados, lembrem-se das palavras anteriormente ditas pelos apóstolos de nosso Senhor Jesus, o Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus Cristo”.'
    reason: Alternativa lexical tradicional para Ἰησοῦ Χριστοῦ.
lexical_decisions:
- source_word: Ὑμεῖς δέ
  choice: Vocês, porém
  rationale: Preserva tanto a ênfase do pronome explícito quanto o contraste introduzido por δέ, marcando a mudança dos ímpios antes descritos para os destinatários.
- source_word: ἀγαπητοί
  choice: amados
  rationale: Mantém o tratamento afetuoso no plural e o tom digno próprio da carta, sem acrescentar uma especificação ausente no grego.
- source_word: μνήσθητε
  choice: lembrem-se
  rationale: Traduz naturalmente o imperativo aoristo médio, conclamando os leitores a trazer à memória o ensino já recebido.
- source_word: τῶν ῥημάτων
  choice: das palavras
  rationale: Representa de modo direto as declarações faladas às quais Judas se refere.
- source_word: τῶν προειρημένων
  choice: anteriormente ditas
  rationale: Expressa a anterioridade e a voz passiva do particípio sem impor necessariamente o sentido mais específico de profecia preditiva.
- source_word: ὑπὸ τῶν ἀποστόλων
  choice: pelos apóstolos
  rationale: Emprega o equivalente português estabelecido e preserva a agência explícita da construção passiva.
- source_word: τοῦ κυρίου ἡμῶν
  choice: de nosso Senhor
  rationale: Conserva a relação genitiva entre os apóstolos e o Senhor a quem pertencem ou por quem foram enviados.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título messiânico em português idiomático, em vez de tratá-lo simplesmente como parte de um nome próprio.
theological_decisions:
- issue: Tradução de Χριστοῦ na expressão Ἰησοῦ Χριστοῦ
  choice: o Messias
  alternative: Cristo
  rationale: O termo grego conserva seu valor titular, identificando Jesus como o Ungido esperado. A forma tradicional “Cristo” permanece em nota para familiaridade e para refletir a alternativa legítima de tradução.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Vocês” torna explícito o sujeito enfático do grego; “porém” preserva o contraste. A ordem da frase permanece próxima da estrutura original sem soar artificial.
