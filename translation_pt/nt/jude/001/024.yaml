  text: Τῷ δὲ δυναμένῳ φυλάξαι ⸀ὑμᾶς ἀπταίστους καὶ στῆσαι κατενώπιον τῆς δόξης αὐτοῦ ἀμώμους ἐν ἀγαλλιάσει
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/024.yaml
  text: To the one who is able to keep you from stumbling and to present you blameless before his glory with rejoicing[c][b][a],
translation:
  language: pt
  text: Àquele que é capaz de guardar vocês de tropeçar[a] e de apresentá-los irrepreensíveis[b] diante da sua glória[c], com exultação,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de cair”. O adjetivo grego ἀπταίστους transmite a ideia de não tropeçar ou não cair.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sem mancha” ou “sem defeito”. O grego ἀμώμους pode evocar também a linguagem de algo sem imperfeição.'
    reason: lexical_alternative
  - marker: c
    text: Algumas traduções vertem a expressão como “diante da sua presença gloriosa”; mais literalmente, o grego diz “diante da sua glória”.
    reason: alternative_reading
lexical_decisions:
- source_word: Τῷ δὲ δυναμένῳ
  choice: Àquele que é capaz
  rationale: O particípio substantivado no dativo introduz o destinatário da doxologia, completada no versículo 25. A formulação é natural e preserva a ideia de capacidade; δέ funciona como transição leve e não exige uma palavra específica em português.
- source_word: φυλάξαι ὑμᾶς
  choice: guardar vocês
  rationale: φυλάσσω pode significar guardar, proteger ou preservar. “Guardar” é conciso, corrente e mantém a ação divina sem especificar além do texto. “Vocês” explicita de modo natural o plural de ὑμᾶς.
- source_word: ἀπταίστους
  choice: de tropeçar
  rationale: O adjetivo denota não tropeçar ou não cair. Depois de “guardar”, a construção “de tropeçar” é idiomática e conserva a metáfora sem restringi-la indevidamente à falha cotidiana ou à apostasia final.
- source_word: καὶ στῆσαι
  choice: e de apresentá-los
  rationale: Embora ἵστημι tenha literalmente o sentido de fazer ficar em pé, neste contexto de comparecimento diante da glória divina “apresentar” comunica naturalmente a função causativa e solene.
- source_word: κατενώπιον τῆς δόξης αὐτοῦ
  choice: diante da sua glória
  rationale: A tradução mantém o substantivo explícito δόξα e evita ampliá-lo interpretativamente para “presença gloriosa”.
- source_word: ἀμώμους
  choice: irrepreensíveis
  rationale: ἀμώμος pode indicar alguém sem defeito, sem mancha ou sem culpa. “Irrepreensíveis” é digno e compreensível, adequando-se ao contexto moral e de apresentação diante de Deus, sem eliminar a possível ressonância cultual.
- source_word: ἐν ἀγαλλιάσει
  choice: com exultação
  rationale: ἀγαλλίασις expressa alegria intensa e jubilosa. “Com exultação” preserva o substantivo e a força do termo sem acrescentar um intensificador ausente no grego.
theological_decisions:
- issue: Sentido de τῆς δόξης αὐτοῦ
  choice: diante da sua glória
  alternative: diante da sua presença gloriosa
  rationale: O grego diz literalmente “sua glória”. A opção escolhida conserva o peso teológico do substantivo e não transforma em explícita a presença que o contexto pode implicar.
- issue: Amplitude de ἀπταίστους
  choice: guardar vocês de tropeçar
  alternative: guardar vocês de cair
  rationale: “Tropeçar” preserva a imagem lexical e deixa em aberto se o foco recai sobre pecado, erro ou queda definitiva, evitando resolver uma tensão não especificada pelo texto.
- issue: Ressonância de ἀμώμους
  choice: irrepreensíveis
  alternative: sem mancha
  rationale: “Irrepreensíveis” comunica diretamente a condição diante da glória divina, enquanto a nota preserva a possível imagem cultual de ausência de defeito ou mancha.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” representa claramente a segunda pessoa do plural; “Àquele” mantém o tom doxológico. A vírgula final indica que a frase continua no versículo 25. Os marcadores foram posicionados junto às expressões correspondentes, em ordem alfabética.
