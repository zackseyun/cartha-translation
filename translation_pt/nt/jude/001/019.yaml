  text: οὗτοί εἰσιν οἱ ἀποδιορίζοντες, ψυχικοί, πνεῦμα μὴ ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/019.yaml
  text: These are the ones who cause divisions[a], worldly people[c][b], not having the Spirit.
translation:
  language: pt
  text: São estes os que causam divisões[a], pessoas meramente naturais[b], que não têm o Espírito[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que se separam” ou “os que estabelecem distinções”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pessoas não espirituais” ou “pessoas mundanas”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “espírito”; no contexto, a referência mais provável é ao Espírito Santo.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοί
  choice: São estes
  rationale: Retoma de modo enfático e natural em português os intrusos descritos no contexto, preservando a força demonstrativa.
- source_word: οἱ ἀποδιορίζοντες
  choice: os que causam divisões
  rationale: Expressa a atividade divisiva atribuída a essas pessoas. O verbo raro também pode indicar que elas se separam ou estabelecem distinções, alternativa preservada em nota.
- source_word: ψυχικοί
  choice: pessoas meramente naturais
  rationale: Conserva o contraste entre a vida limitada ao âmbito natural e a posse do Espírito, sem usar 'mundanas', termo que poderia introduzir associações morais mais amplas que o vocábulo grego.
- source_word: πνεῦμα
  choice: o Espírito
  rationale: O contraste imediato com ψυχικοί e o contexto favorecem uma referência ao Espírito Santo; a possibilidade lexical de 'espírito' é mantida em nota.
- source_word: μὴ ἔχοντες
  choice: que não têm
  rationale: Reproduz com clareza e naturalidade a negação do particípio grego e liga a expressão aos qualificativos anteriores.
theological_decisions:
- issue: Referente de πνεῦμα
  choice: o Espírito Santo
  alternative: espírito
  rationale: O contexto e o contraste com ψυχικοί favorecem a referência ao Espírito Santo, mas a ausência de artigo e a amplitude lexical de πνεῦμα justificam registrar a alternativa sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção 'São estes os que' mantém a ênfase do demonstrativo; 'pessoas meramente naturais' torna inteligível o contraste antropológico e espiritual sem impor terminologia denominacional.
