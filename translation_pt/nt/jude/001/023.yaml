id: JUD.1.23
reference: Jude 1:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες, οὓς δὲ ἐλεᾶτε ἐν φόβῳ⸃, μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/023.yaml
  text: save others by snatching them out of the fire[a]; and have mercy on others with fear[d][c][b], hating even the tunic stained by the flesh.
translation:
  language: pt
  text: salvem outros, arrancando-os do fogo[a]; e tenham misericórdia de outros com temor[b], odiando até mesmo a túnica manchada pela carne[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «resgatem outros, arrebatando-os do fogo». A imagem pode apontar para o juízo iminente ou para grave perigo espiritual.'
    reason: alternative_reading
  - marker: b
    text: «Com temor» pode significar com temor reverente diante de Deus ou com cautela para que vocês também não sejam corrompidos.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «a veste contaminada pela natureza pecaminosa». Grego: «carne».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῴζετε
  choice: salvem
  rationale: O imperativo preserva tanto o peso de salvação quanto o sentido imediato de resgate no contexto.
- source_word: ἐκ πυρὸς ἁρπάζοντες
  choice: arrancando-os do fogo
  rationale: O particípio indica o modo de salvar; «arrancando» comunica ação enérgica e urgente, mantendo a imagem vívida.
- source_word: ἐλεᾶτε
  choice: tenham misericórdia
  rationale: Equivalente direto, natural e digno para o imperativo grego.
- source_word: ἐν φόβῳ
  choice: com temor
  rationale: Preserva a concisão e a ambiguidade entre temor reverente diante de Deus e cautela diante do risco de corrupção.
- source_word: μισοῦντες
  choice: odiando
  rationale: Mantém a força moral do particípio e distingue a misericórdia para com a pessoa da rejeição da corrupção.
- source_word: χιτῶνα
  choice: túnica
  rationale: Termo específico para a veste interior mencionada no grego, sem modernização anacrônica.
- source_word: ἐσπιλωμένον
  choice: manchada
  rationale: Conserva a metáfora da roupa e sugere, ao mesmo tempo, contaminação moral.
- source_word: σάρξ
  choice: carne
  rationale: Mantém a expressão metafórica do original sem substituí-la pela interpretação mais sistematizada «natureza pecaminosa».
theological_decisions:
- issue: Sentido do «fogo» na imagem de resgate
  choice: Manter «fogo» sem definir seu referente no texto principal.
  alternative: Juízo futuro ou grave perigo espiritual presente.
  rationale: O grego não identifica expressamente o referente; a formulação conserva a advertência e sua tensão interpretativa.
- issue: Sentido de σάρξ em «manchada pela carne»
  choice: Traduzir por «carne».
  alternative: Natureza pecaminosa.
  rationale: Embora o contexto indique corrupção moral, «carne» preserva a metáfora e evita impor uma formulação teológica mais específica.
- issue: Sentido de «com temor»
  choice: Preservar a expressão sem explicá-la no texto principal.
  alternative: Com reverência diante de Deus ou com cautela para não ser também contaminado.
  rationale: Ambos os sentidos são plausíveis no contexto, e a tradução não deve decidir silenciosamente entre eles.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A estrutura mantém os três grupos indicados pelo texto crítico da SBLGNT, usa imperativos plurais naturais e preserva as metáforas e ambiguidades centrais do grego.
