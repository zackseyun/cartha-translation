id: JUD.1.2
reference: Jude 1:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔλεος ὑμῖν καὶ εἰρήνη καὶ ἀγάπη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/002.yaml
  text: May mercy and peace and love be multiplied to you[a].
translation:
  language: pt
  text: Que a misericórdia, a paz e o amor se multipliquem para vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aumentem” ou “sejam abundantes”.
    reason: alternativa lexical para πληθυνθείη
lexical_decisions:
- source_word: ἔλεος
  choice: misericórdia
  rationale: Equivalente consagrado que preserva tanto a dimensão compassiva quanto a ressonância da bondade divina.
- source_word: ὑμῖν
  choice: para vocês
  rationale: Expressa com naturalidade, em português amplamente compreensível e de leitura brasileira, os destinatários da bênção.
- source_word: εἰρήνη
  choice: paz
  rationale: Tradução direta e tradicional, capaz de abranger reconciliação, integridade e bem-estar sem explicitar em excesso.
- source_word: ἀγάπη
  choice: amor
  rationale: Equivalente moderno e claro, sem a conotação mais restrita que 'caridade' adquiriu no uso corrente.
- source_word: πληθυνθείη
  choice: se multipliquem
  rationale: O presente do subjuntivo com 'Que' comunica o desejo expresso pelo optativo aoristo passivo e mantém a imagem de multiplicação.
- source_word: καὶ ... καὶ ... καὶ
  choice: a misericórdia, a paz e o amor
  rationale: A coordenação portuguesa natural conserva os três elementos da bênção com dignidade e clareza; repetir 'e' entre todos eles soaria mais marcado em português atual.
theological_decisions:
- issue: Forma optativa da bênção
  choice: Que a misericórdia, a paz e o amor se multipliquem para vocês.
  alternative: Misericórdia, paz e amor lhes sejam multiplicados.
  rationale: A construção com 'Que' torna explícito o desejo ou a oração do autor, enquanto 'se multipliquem' preserva a metáfora do aumento sem determinar quem realiza a ação.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com legibilidade brasileira. 'Para vocês' evita o regionalismo ou a formalidade variável de 'vós' e torna o destinatário plural inequívoco. A vírgula antes de 'e' foi omitida conforme o uso português corrente.
