id: JUD.1.15
reference: Jude 1:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ποιῆσαι κρίσιν κατὰ πάντων καὶ ἐλέγξαι ⸂πάντας τοὺς ἀσεβεῖς⸃ περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν καὶ περὶ πάντων τῶν σκληρῶν ὧν ἐλάλησαν κατ’ αὐτοῦ ἁμαρτωλοὶ ἀσεβεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/015.yaml
  text: to execute judgment against all and to convict all the ungodly concerning all their ungodly deeds that they committed in ungodliness[c][b][a], and concerning all the harsh things that ungodly sinners have spoken against him.
translation:
  language: pt
  text: para executar juízo contra todos e demonstrar a culpa de todos os ímpios[a] a respeito de todos os seus atos de impiedade que praticaram impiamente, e a respeito de todas as palavras duras[c] que pecadores ímpios proferiram contra ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “expor” ou “provar a culpa de”. O verbo grego pode indicar que a transgressão é trazida à luz; aqui, porém, aparece em contexto judicial, junto de “executar juízo”.
    reason: lexical_alternative
  - marker: b
    text: “Ele” refere-se, pelo contexto, ao Senhor mencionado no versículo anterior.
    reason: cross_reference
  - marker: c
    text: Ou “palavras severas”. O termo grego significa literalmente “coisas duras” e provavelmente se refere aqui a palavras duras, desafiadoras ou insolentes proferidas contra ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι κρίσιν
  choice: executar juízo
  rationale: A expressão descreve a realização efetiva de uma ação judicial. “Executar juízo” conserva o substantivo e o tom escatológico e forense.
- source_word: κατὰ πάντων
  choice: contra todos
  rationale: κατά com o genitivo tem aqui sentido adversativo e judicial, indicando aqueles contra quem o juízo é exercido.
- source_word: ἐλέγξαι
  choice: demonstrar a culpa
  rationale: No contexto judicial, o verbo envolve trazer a transgressão à luz e estabelecer a culpabilidade, não apenas repreender ou persuadir.
- source_word: πάντας τοὺς ἀσεβεῖς
  choice: todos os ímpios
  rationale: A expressão substantivada e plural é vertida de modo conciso, preservando a ligação lexical com as referências seguintes à impiedade.
- source_word: περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν
  choice: por todos os atos de impiedade
  rationale: “Atos de impiedade” é natural em português e mantém o conteúdo do genitivo, enquanto “por” expressa com clareza a matéria da acusação nesse contexto judicial.
- source_word: ὧν ἠσέβησαν
  choice: que praticaram de maneira ímpia
  rationale: A formulação mantém a repetição enfática da família lexical ἀσεβ-, ainda que a repetição soe deliberadamente intensa também no grego.
- source_word: σκληρῶν
  choice: palavras duras
  rationale: O adjetivo neutro substantivado refere-se, pelo verbo “proferiram”, a palavras ou declarações duras, hostis ou insolentes. A explicitação de “palavras” produz português natural sem estreitar excessivamente o sentido.
- source_word: ἐλάλησαν κατ’ αὐτοῦ
  choice: proferiram contra ele
  rationale: “Proferiram” se ajusta às palavras acusatórias em vista, e “contra ele” reproduz o valor adversativo de κατά com o genitivo.
- source_word: ἁμαρτωλοὶ ἀσεβεῖς
  choice: pecadores ímpios
  rationale: A tradução conserva os dois qualificativos e sua força enfática, mantendo “ímpios” próximo da repetição dominante da família ἀσεβ-.
theological_decisions:
- issue: Referente de αὐτοῦ em “proferiram contra ele”
  choice: Manter o pronome “ele” no texto principal.
  alternative: “proferiram contra o Senhor” ou “contra Deus”
  rationale: O contexto do versículo anterior aponta para o Senhor, mas o grego emprega um pronome. Mantê-lo evita explicitar no texto principal mais do que a forma grega afirma e preserva a referência contextual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira ampla. A formulação mantém o tom judicial e a repetição enfática de “ímpios”, “impiedade” e “ímpia”, sem suavizar a retórica do original.
