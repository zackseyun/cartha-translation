id: JUD.1.25
reference: Jude 1:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀μόνῳ θεῷ σωτῆρι ἡμῶν ⸂διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν⸃ ⸀δόξα μεγαλωσύνη κράτος καὶ ἐξουσία ⸂πρὸ παντὸς τοῦ αἰῶνος⸃ καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/025.yaml
  text: to the only God our Savior[a], through Jesus the Messiah our Lord, be glory, majesty, dominion, and authority, before all time and now and forever[b]. Amen.
translation:
  language: pt
  text: ao único Deus, nosso Salvador, por meio de Jesus, o Messias[a], nosso Senhor, sejam glória, majestade, domínio e autoridade, antes de todos os tempos, agora e para todo o sempre[b]. Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Jesus Cristo». O título grego Χριστός significa «Messias».
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «antes de toda era [...] e por todas as eras».
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνῳ θεῷ
  choice: ao único Deus
  rationale: O dativo identifica o destinatário da doxologia, e μόνος ressalta a singularidade de Deus. A contração «ao» expressa naturalmente em português o sentido implícito de atribuição.
- source_word: σωτῆρι ἡμῶν
  choice: nosso Salvador
  rationale: σωτήρ designa aquele que salva ou liberta; «Salvador» é a forma clara e consagrada neste contexto redentor.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: por meio de Jesus, o Messias
  rationale: διά com o genitivo indica meio ou mediação. «Por meio de» torna essa relação explícita sem ampliá-la. Χριστός é preservado como título, «o Messias», em português idiomático.
- source_word: τοῦ κυρίου ἡμῶν
  choice: nosso Senhor
  rationale: A expressão está em aposição a Jesus, o Messias, e mantém κύριος como o título «Senhor».
- source_word: δόξα
  choice: glória
  rationale: Equivalente corrente e adequado ao registro doxológico.
- source_word: μεγαλωσύνη
  choice: majestade
  rationale: O termo denota grandeza ou majestade; «majestade» preserva o tom elevado da doxologia.
- source_word: κράτος
  choice: domínio
  rationale: κράτος comunica força soberana ou poder efetivo. «Domínio» preserva sua dimensão régia e o distingue de ἐξουσία.
- source_word: ἐξουσία
  choice: autoridade
  rationale: O termo indica autoridade ou direito de exercer poder; «autoridade» mantém a distinção em relação a κράτος.
- source_word: πρὸ παντὸς τοῦ αἰῶνος
  choice: antes de todos os tempos
  rationale: A formulação comunica de modo natural a anterioridade a toda era ou tempo, sem limitar a expressão a uma época específica.
- source_word: καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας
  choice: agora e para todo o sempre
  rationale: A tradução mantém o alcance temporal presente e interminável da expressão; a nota registra sua forma mais literal ligada a «eras» ou «séculos».
theological_decisions:
- issue: Relação da expressão mediadora com a doxologia
  choice: A glória, majestade, domínio e autoridade são atribuídos ao único Deus, nosso Salvador, por meio de Jesus, o Messias, nosso Senhor.
  alternative: Ligar a expressão «por meio de Jesus» de maneira mais solta à doxologia.
  rationale: A sintaxe favorece a ligação de διὰ Ἰησοῦ Χριστοῦ com a atribuição de louvor. A tradução conserva tanto o foco da doxologia em Deus quanto a mediação de Jesus, sem fundir nem explicar além do texto suas relações.
- issue: Sentido de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Aqui Χριστός funciona como título. «O Messias» comunica seu significado em português corrente, enquanto a nota oferece a forma tradicional «Cristo».
- issue: Força temporal da conclusão
  choice: antes de todos os tempos, agora e para todo o sempre
  alternative: antes de toda era, agora e por todas as eras
  rationale: A redação principal comunica naturalmente o tríplice alcance temporal, sem apagar a formulação grega baseada em αἰών, registrada na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura solene da doxologia foi mantida, mas o encadeamento foi ajustado à sintaxe natural do português. As vírgulas em «Jesus, o Messias, nosso Senhor» deixam clara a aposição dos títulos.
