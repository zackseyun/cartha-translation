id: JUD.1.8
reference: Jude 1:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, κυριότητα δὲ ἀθετοῦσιν, δόξας δὲ βλασφημοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/008.yaml
  text: Yet in the same way, these people also, relying on dreams, defile the flesh, reject authority, and slander glorious ones.
translation:
  language: pt
  text: Do mesmo modo, porém, essas pessoas também, apoiando-se em sonhos,[a] contaminam a carne, rejeitam a autoridade e difamam os seres gloriosos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sonhando”. O particípio grego pode ser traduzido de modo mais formal dessa maneira; no contexto, porém, talvez indique que essas pessoas recorrem a sonhos para justificar sua conduta.'
    reason: lexical_alternative
  - marker: b
    text: “Os seres gloriosos” provavelmente se refere a seres celestiais exaltados, possivelmente anjos; literalmente, “as glórias”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁμοίως μέντοι
  choice: Ainda assim, da mesma forma
  rationale: Preserva tanto a comparação expressa por ὁμοίως como a leve força adversativa de μέντοι, em português natural.
- source_word: οὗτοι
  choice: essas pessoas
  rationale: Explicita de modo natural que o demonstrativo se refere aos intrusos já mencionados, sem acrescentar uma especificação masculina ausente desta forma grega.
- source_word: ἐνυπνιαζόμενοι
  choice: apoiando-se em sonhos
  rationale: Expressa a provável relação entre as experiências de sonho e a conduta denunciada. A tradução mais formal e menos interpretativa é preservada em nota.
- source_word: σάρκα
  choice: a carne
  rationale: Mantém o termo concreto e teologicamente aberto do grego, sem reduzi-lo a 'corpo' nem convertê-lo na expressão interpretativa 'natureza pecaminosa'.
- source_word: μιαίνουσιν
  choice: contaminam
  rationale: Comunica profanação moral ou ritual em linguagem atual e digna; 'corrompem' seria mais interpretativo e 'mancham' menos forte.
- source_word: κυριότητα
  choice: a autoridade
  rationale: Preserva a amplitude de κυριότης, que pode apontar para senhorio, domínio ou autoridade, sem decidir no texto principal qual é o referente específico.
- source_word: ἀθετοῦσιν
  choice: rejeitam
  rationale: Reproduz de maneira concisa a ideia de repudiar ou não reconhecer aquilo que deveria ser respeitado.
- source_word: δόξας
  choice: os seres gloriosos
  rationale: O plural provavelmente designa seres celestiais exaltados. A formulação evita identificá-los explicitamente como anjos, preservando a relativa indeterminação do substantivo grego.
- source_word: βλασφημοῦσιν
  choice: difamam
  rationale: Neste contexto, indica fala insultuosa ou caluniosa contra seres exaltados. 'Blasfemam' poderia sugerir ao leitor moderno que o objeto é necessariamente Deus.
theological_decisions:
- issue: Referente de δόξας
  choice: expressão ampla para seres gloriosos ou exaltados
  alternative: anjos; majestades celestiais; glórias
  rationale: Judas 1:9 favorece um referente celestial, mas δόξας não identifica explicitamente esses seres como anjos. O texto principal mantém essa abertura, e a nota informa a interpretação provável.
- issue: Força de ἐνυπνιαζόμενοι
  choice: a conduta está ligada ao apoio ou à confiança em sonhos
  alternative: sonhando; sendo sonhadores
  rationale: O particípio pode indicar a base ou circunstância da conduta. A tradução principal comunica a leitura contextual provável, enquanto a nota conserva a formulação mais estritamente formal.
- issue: Referente de κυριότητα
  choice: autoridade, sem referente especificado
  alternative: senhorio divino; domínio angelical; estruturas de autoridade
  rationale: O substantivo admite mais de um referente no contexto. Traduzir simplesmente por 'a autoridade' evita resolver uma tensão que o grego deixa aberta.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O tom é direto e solene, acompanhando a denúncia de Judas. A repetição coordenada dos três verbos conserva o ritmo acusatório do original.
