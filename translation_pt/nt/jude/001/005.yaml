id: JUD.1.5
reference: Jude 1:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ⸂ὑμᾶς ἅπαξ⸃ ⸀πάντα, ὅτι ⸀Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/005.yaml
  text: I want to remind you[a], though you know all things once for all, that Jesus, having saved a people out of the land of Egypt, afterward destroyed those who did not believe.
translation:
  language: pt
  text: Quero lembrar a vocês, embora já saibam tudo isso de uma vez por todas, que Jesus[a], depois de salvar um povo da terra do Egito, destruiu os que não creram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “o Senhor” ou “Deus” em vez de “Jesus”.
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπομνῆσαι ... βούλομαι
  choice: Quero lembrar a vocês
  rationale: Expressa de modo claro e atual a construção volitiva com o infinitivo, sem acrescentar um marcador temporal ausente do grego.
- source_word: εἰδότας ὑμᾶς ἅπαξ πάντα
  choice: embora já saibam tudo isso de uma vez por todas
  rationale: Entende o particípio em sentido concessivo, toma πάντα contextualmente como “tudo isso” e preserva em ἅπαξ a ideia de algo estabelecido de uma vez por todas.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Traduz diretamente a leitura do SBLGNT e mantém sua forte afirmação cristológica, sem substituí-la por uma variante menos específica.
- source_word: λαὸν
  choice: um povo
  rationale: Reproduz o substantivo anartro sem especificação adicional e mantém a referência coletiva ao povo retirado do Egito.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: da terra do Egito
  rationale: Conserva a formulação bíblica ligada ao êxodo, em linguagem portuguesa compreensível.
- source_word: σώσας
  choice: depois de salvar
  rationale: Marca a anterioridade do particípio aoristo em relação ao verbo principal de maneira natural em português.
- source_word: τὸ δεύτερον
  choice: depois
  rationale: 'Comunica a sequência temporal idiomática: após salvar o povo, Jesus julgou os incrédulos.'
- source_word: τοὺς μὴ πιστεύσαντας
  choice: os que não creram
  rationale: Mantém a referência direta aos que deixaram de crer, sem diluir a advertência em uma caracterização abstrata.
- source_word: ἀπώλεσεν
  choice: destruiu
  rationale: Preserva a força do verbo que descreve o juízo divino contra a geração incrédula.
theological_decisions:
- issue: O sujeito cristológico da ação no êxodo
  choice: Jesus no texto principal
  alternative: o Senhor; Deus
  rationale: O texto grego fornecido lê Ἰησοῦς. A tradução preserva essa leitura e a tensão cristológica que ela produz, enquanto registra as variantes significativas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção foi levemente reordenada para soar natural, sem apagar a sequência entre salvação e juízo nem a ambiguidade textual documentada.
