id: JUD.1.6
reference: Jude 1:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀγγέλους τε τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον εἰς κρίσιν μεγάλης ἡμέρας δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/006.yaml
  text: And the angels who did not keep their own domain[a], but abandoned their proper dwelling[c][b], he has kept in eternal chains under gloom for the judgment of the great day.
translation:
  language: pt
  text: E os anjos que não conservaram sua própria posição[a], mas abandonaram a morada que lhes era própria[b], ele os tem conservado em correntes eternas, sob densas trevas[c], para o julgamento do grande dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sua própria esfera de autoridade».
    reason: lexical_alternative
  - marker: b
    text: Ou «sua própria habitação».
    reason: lexical_alternative
  - marker: c
    text: Ou «sob profunda escuridão»; o termo grego indica trevas densas e sombrias.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλους
  choice: anjos
  rationale: Neste contexto de julgamento, o termo se refere mais naturalmente a seres celestiais do que a mensageiros humanos.
- source_word: τηρήσαντας / τετήρηκεν
  choice: não conservaram / tem conservado
  rationale: 'A repetição de «conservar» mantém o contraste verbal intencional: eles não conservaram sua posição, e Deus os tem conservado para o julgamento.'
- source_word: τὴν ἑαυτῶν ἀρχὴν
  choice: sua própria posição
  rationale: ἀρχή pode indicar autoridade, posição ou esfera de atuação. «Posição» é clara em português e evita definir em excesso a natureza exata do que os anjos deixaram de manter.
- source_word: ἀπολιπόντας
  choice: abandonaram
  rationale: Expressa uma partida deliberada e culpável, adequada ao tom judicial do versículo.
- source_word: τὸ ἴδιον οἰκητήριον
  choice: a morada que lhes era própria
  rationale: Traduz οἰκητήριον como lugar de habitação e comunica ἴδιον sem presumir detalhes não explicitados no texto.
- source_word: εἰς κρίσιν μεγάλης ἡμέρας
  choice: para o julgamento do grande dia
  rationale: Preserva a orientação de finalidade ou resultado de εἰς e a estrutura escatológica da expressão.
- source_word: δεσμοῖς ἀϊδίοις
  choice: em correntes eternas
  rationale: «Correntes» comunica de modo vívido e natural a ideia de δεσμοί, enquanto «eternas» expressa a permanência indicada por ἀΐδιος.
- source_word: ὑπὸ ζόφον
  choice: sob densas trevas
  rationale: ζόφος indica escuridão profunda ou sombria, não apenas ausência comum de luz; «sob» preserva a imagem da preposição grega.
- source_word: τε
  choice: E
  rationale: Liga este exemplo de julgamento aos anteriores de maneira natural em português.
theological_decisions:
- issue: Sentido da transgressão dos anjos
  choice: A tradução afirma que os anjos não conservaram sua posição e abandonaram a morada que lhes era própria, sem definir além do grego a natureza exata dessa posição ou morada.
  alternative: Entender a passagem especificamente como referência à tradição de Gênesis 6 ou, de modo mais geral, a uma queda angelical primordial.
  rationale: Judas provavelmente evoca uma tradição conhecida por seus leitores, mas o versículo não identifica explicitamente todos os seus detalhes; a tradução preserva essa abertura interpretativa.
- issue: Força de ἀΐδιος
  choice: eternas
  alternative: perpétuas; duradouras
  rationale: O termo indica permanência contínua; «eternas» é a expressão portuguesa mais direta e tradicional, sem acrescentar uma explicação metafísica não presente no texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase foi ajustada com pontuação natural, sem resolver a ambiguidade de ἀρχή nem especificar a tradição subjacente. A repetição de τηρέω foi mantida por meio de «conservar».
