source:
  edition: SBLGNT
  text: κύματα ἄγρια θαλάσσης ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας, ἀστέρες πλανῆται οἷς ὁ ζόφος τοῦ σκότους εἰς αἰῶνα τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/013.yaml
  text: wild waves of the sea[a], foaming up their own shames; wandering stars[b], for whom the gloom of darkness has been reserved forever.
translation:
  language: pt
  text: ondas bravias do mar, que espumam suas próprias vergonhas[a]; estrelas errantes, para quem está reservada para sempre a escuridão das trevas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que lançam para fora a própria desonra” ou “que espumam seus próprios atos vergonhosos”. O plural grego traduzido por “vergonhas” pode indicar a desonra em si ou atos vergonhosos que a tornam visível.
    reason: lexical_alternative
  - marker: b
    text: Ou “o negrume das trevas”. A expressão grega combina termos para escuridão a fim de intensificar a imagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύματα ἄγρια θαλάσσης
  choice: ondas bravias do mar
  rationale: Preserva a imagem vívida e a relação genitiva do grego em português natural e digno.
- source_word: ἐπαφρίζοντα
  choice: que espumam
  rationale: Expressa a ação contínua do particípio presente e mantém a metáfora das ondas produzindo espuma.
- source_word: τὰς ἑαυτῶν αἰσχύνας
  choice: suas próprias vergonhas
  rationale: Mantém tanto a ênfase reflexiva de ἑαυτῶν quanto o plural marcante de αἰσχύνας, sem decidir se indica desonras ou atos vergonhosos.
- source_word: ἀστέρες πλανῆται
  choice: estrelas errantes
  rationale: Conserva a metáfora antiga de astros que vagueiam sem introduzir a precisão astronômica moderna de 'planetas'.
- source_word: οἷς
  choice: para as quais
  rationale: A concordância imediata com 'estrelas' produz português claro, embora a metáfora se refira, em última análise, a pessoas.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: a escuridão mais profunda
  rationale: Transmite de modo natural a intensificação formada por ζόφος e σκότος, evitando uma construção portuguesa artificial.
- source_word: εἰς αἰῶνα
  choice: para sempre
  rationale: Neste contexto de juízo, comunica naturalmente a duração contínua da expressão.
- source_word: τετήρηται
  choice: está reservada
  rationale: O perfeito passivo indica um estado presente resultante de ação anterior; 'está reservada' expressa bem esse estado no contexto de juízo.
theological_decisions:
- issue: Duração da imagem do juízo em εἰς αἰῶνα
  choice: para sempre
  alternative: pela era
  rationale: No contexto, a expressão comunica mais naturalmente duração sem fim; a tradução mantém a força da advertência sem acrescentar elaboração doutrinária.
- issue: Referente pessoal sob a metáfora de ἀστέρες πλανῆται
  choice: para as quais
  alternative: para quem
  rationale: A opção principal mantém a concordância gramatical com 'estrelas'; a personificação e o referente humano continuam claros pelo contexto, sem explicitação interpretativa desnecessária.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é poético e solene, preservando as duas metáforas e o paralelismo, sem arcaísmos desnecessários.
