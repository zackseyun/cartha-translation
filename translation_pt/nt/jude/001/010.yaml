  source_fidelity: 'A primeira oração transmite bem o contraste entre o que essas pessoas não compreendem e o que conhecem de modo meramente natural. Na segunda, porém, a ordem atual («em tudo o que conhecem ... elas se corrompem») torna ἐν τούτοις excessivamente dependente de «tudo» e enfraquece a retomada enfática: é precisamente nas coisas que conhecem por instinto que ocorre a corrupção/ruína.'
  naturalness: «Insultam tudo» é compreensível, mas «falam mal de tudo» é mais idiomático em português atual para fala abusiva dirigida a objetos não pessoais. A reordenação da segunda oração deixa clara a relação entre o conhecimento instintivo e a corrupção, sem alterar o registro.
  terminology: «Por instinto» e «animais irracionais» refletem adequadamente φυσικῶς e ἄλογα ζῷα. «Se corrompem» é uma opção legítima para φθείρονται, preservando a possibilidade de ruína, registrada em nota. «Como animais irracionais» é mantido como comparação do modo de conhecer.
