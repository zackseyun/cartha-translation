    rationale: ἐν τούτοις retoma as coisas conhecidas naturalmente; «naquilo que conhecem por instinto ... se corrompem» reproduz melhor essa retomada e evita que «em tudo» pareça um simples adjunto antecipado.
  - severity: low
    issue: «Insultam tudo» é menos idiomático para βλασφημοῦσιν com objeto não pessoal.
    rationale: «Falam mal de tudo» comunica fala abusiva ou depreciativa sem limitar o verbo à blasfêmia contra Deus nem pressupor a falsidade específica de «caluniar».
