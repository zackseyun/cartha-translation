revisions:
- from: Mas essas pessoas insultam tudo o que não compreendem[a]; e, em tudo o que conhecem por instinto, como animais irracionais[b], elas se corrompem[c].
  to: Mas essas pessoas falam mal de tudo o que não compreendem[a]; e se corrompem naquilo que conhecem por instinto, como animais irracionais[b][c].
  rationale: 'A revisão torna explícita, em português natural, a retomada de ἐν τούτοις: a corrupção ocorre nas próprias coisas que conhecem apenas por instinto. Também substitui «insultam tudo» por uma expressão mais idiomática para o uso não necessariamente religioso de βλασφημέω. As notas preservam as alternativas lexicais e a ambiguidade entre corrupção e ruína/destruição.'
