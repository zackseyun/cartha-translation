id: JUD.1.10
reference: Jude 1:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτοι δὲ ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν, ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται, ἐν τούτοις φθείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/010.yaml
  text: But these people slander whatever they do not understand[a], and whatever they understand naturally, like irrational animals[c][b], by these things they are corrupted.
translation:
  language: pt
  text: Mas essas pessoas falam mal de tudo o que não compreendem[a]; e se corrompem naquilo que conhecem por instinto, como animais irracionais[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “blasfemam contra tudo o que não conhecem” ou “insultam tudo o que não conhecem”.
    reason: lexical_alternative
  - marker: b
    text: Ou “conhecem naturalmente, como animais sem razão”.
    reason: lexical_alternative
  - marker: c
    text: Ou “por essas coisas são destruídas” ou “nessas coisas encontram a sua ruína”.
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: essas pessoas
  rationale: O demonstrativo plural retoma os intrusos denunciados no contexto. “Essas pessoas” esclarece o referente sem introduzir uma especificação masculina ausente da forma grega.
- source_word: βλασφημοῦσιν
  choice: insultam
  rationale: O verbo indica fala abusiva ou difamatória e pode, em certos contextos, significar “blasfemar”. “Insultam” preserva a gravidade sem limitar o objeto a Deus ou ao sagrado.
- source_word: ὅσα μὲν οὐκ οἴδασιν
  choice: tudo o que não compreendem
  rationale: No contraste com o conhecimento meramente instintivo, οἴδασιν aponta aqui para compreensão consciente, não apenas para posse de informação.
- source_word: φυσικῶς
  choice: por instinto
  rationale: A comparação com animais esclarece que se trata de conhecimento natural, não racional; “por instinto” comunica esse sentido de modo corrente.
- source_word: ἄλογα ζῷα
  choice: animais irracionais
  rationale: A expressão caracteriza animais desprovidos de razão; a tradução é clara, atual e mantém o contraste do texto.
- source_word: ἐπίστανται
  choice: conhecem
  rationale: O verbo descreve a percepção ou o saber limitado que possuem naturalmente. “Conhecem” mantém a distinção em relação a “compreendem” na primeira oração.
- source_word: ἐν τούτοις
  choice: em tudo o que
  rationale: Mantém o valor local de ἐν e liga a corrupção ao âmbito das coisas conhecidas instintivamente, sem excluir a possível nuance instrumental.
- source_word: φθείρονται
  choice: se corrompem
  rationale: A forma pode indicar corrupção, ruína ou destruição e admite leitura média ou passiva. “Se corrompem” expressa a decadência resultante sem eliminar em nota a leitura de destruição.
theological_decisions:
- issue: Sentido de βλασφημέω quando o objeto não é explicitamente divino
  choice: insultam
  alternative: blasfemam contra; falam mal de
  rationale: O objeto é “tudo o que não compreendem”, portanto o texto não exige que a fala seja diretamente contra Deus. A opção mantém a condenação da fala abusiva sem impor um objeto sagrado.
- issue: Valor médio ou passivo e alcance de φθείρονται
  choice: elas se corrompem
  alternative: são destruídas por essas coisas; encontram nessas coisas a sua ruína
  rationale: O contexto reúne degradação moral e juízo. A tradução principal conserva a dimensão de corrupção, enquanto a nota registra a possível leitura passiva ou resultativa de destruição.
- issue: Valor de ἐν em ἐν τούτοις
  choice: em tudo o que
  alternative: por essas coisas
  rationale: A preposição pode ser entendida localmente, “nessas coisas”, ou instrumentalmente, “por essas coisas”. A tradução principal segue a forma mais direta, e a nota preserva a alternativa causal ou instrumental.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura contrastiva foi preservada com ponto e vírgula; as notas mantêm as ambiguidades lexicais e gramaticais relevantes sem sobrecarregar o texto principal.
