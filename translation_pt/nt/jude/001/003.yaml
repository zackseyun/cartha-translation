id: JUD.1.3
reference: Jude 1:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ⸀ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/003.yaml
  text: Beloved[a], although I was making every effort to write to you about our common salvation, I found it necessary to write[d][c][b], urging you to contend earnestly for the faith once for all delivered to the saints.
translation:
  language: pt
  text: Amados, embora eu estivesse me empenhando ao máximo para escrever a vocês sobre a salvação que compartilhamos, achei necessário escrever-lhes para exortá-los a lutar com toda dedicação pela fé[a] que, de uma vez por todas, foi entregue[b] aos santos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “a fé” provavelmente se refere ao conjunto da mensagem e do ensino cristãos confiado aos que creem, e não apenas ao ato pessoal de crer.
    reason: alternative_reading
  - marker: b
    text: Ou “foi transmitida”, destacando que a fé foi passada adiante e confiada à comunidade.
    reason: lexical_alternative
  - marker: c
    text: “Santos” significa aqui o povo santo de Deus, isto é, os que creem.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Amados
  rationale: Mantém a forma vocativa, o tom pastoral afetuoso e a ligação lexical com o amor, sem acrescentar a ideia de amizade.
- source_word: πᾶσαν σπουδὴν ποιούμενος
  choice: embora eu estivesse me empenhando ao máximo
  rationale: Expressa a diligência intensa do idioma grego e entende o particípio como concessivo no contexto, em contraste com a necessidade que surgiu.
- source_word: γράφειν ... γράψαι
  choice: escrever a vocês ... escrever-lhes
  rationale: Conserva a repetição do verbo e dos destinatários presente no grego, com formas naturais em português.
- source_word: περὶ τῆς κοινῆς ἡμῶν σωτηρίας
  choice: sobre a salvação que compartilhamos
  rationale: Traduz κοινῆς como algo comum ou compartilhado e preserva a ênfase comunitária em linguagem corrente.
- source_word: ἀνάγκην ἔσχον
  choice: achei necessário
  rationale: Reproduz de modo idiomático uma necessidade surgida pelas circunstâncias, sem intensificá-la para uma compulsão absoluta.
- source_word: παρακαλῶν
  choice: para exortá-los
  rationale: No contexto, o particípio apresenta a finalidade ou o conteúdo urgente da carta; “exortar” comunica uma convocação séria e pastoral.
- source_word: ἐπαγωνίζεσθαι
  choice: a lutar com toda dedicação
  rationale: Preserva a ideia intensificada de empenhar-se numa luta, evitando tanto uma formulação débil quanto uma linguagem excessivamente militar.
- source_word: τῇ ... πίστει
  choice: pela fé
  rationale: A expressão aponta mais naturalmente para a fé como conteúdo recebido pela comunidade, mas a formulação tradicional mantém a concisão e permite esclarecer o sentido em nota.
- source_word: ἅπαξ
  choice: de uma vez por todas
  rationale: Comunica o caráter definitivo e não repetido da entrega, sentido adequado do advérbio neste contexto.
- source_word: παραδοθείσῃ
  choice: foi entregue
  rationale: Representa o particípio passivo e conserva a imagem de algo confiado à comunidade; “foi transmitida” permanece uma alternativa lexical plausível.
- source_word: τοῖς ἁγίοις
  choice: aos santos
  rationale: Mantém o termo cristão estabelecido para o povo separado para Deus, com nota que evita a leitura restrita a pessoas posteriormente canonizadas.
theological_decisions:
- issue: Sentido de πίστις (“a fé”)
  choice: o conteúdo da fé cristã confiado à comunidade
  alternative: a confiança ou o ato pessoal de crer
  rationale: A descrição da fé como algo entregue de uma vez por todas aos santos favorece um corpo de ensino ou confissão recebido pela comunidade, sem exigir uma formulação denominacional posterior.
- issue: Força de ἅπαξ παραδοθείσῃ
  choice: uma entrega definitiva, de uma vez por todas
  alternative: uma entrega ocorrida simplesmente uma vez
  rationale: Neste contexto, ἅπαξ salienta adequadamente a singularidade e o caráter definitivo do ato, sem especificar além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção concessiva explicita a relação contextual do particípio inicial; a repetição de “escrever” preserva a forma do grego sem tornar a frase artificial. Evitaram-se tanto jargão denominacional quanto linguagem militar excessiva.
