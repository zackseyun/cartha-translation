source:
  edition: SBLGNT
  text: ὅτι ἔλεγον ⸀ὑμῖν· ⸂Ἐπ’ ἐσχάτου χρόνου⸃ ἔσονται ἐμπαῖκται κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/018.yaml
  text: that they were saying to you[a], “In the last time there will be mockers[b], going according to their own ungodly desires.”
translation:
  language: pt
  text: 'Eles costumavam dizer a vocês: “No último tempo[a] haverá zombadores[b], que vivem segundo seus próprios desejos ímpios.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “No tempo do fim” ou “No fim dos tempos”. O grego traz “tempo” no singular, não “dias”.
    reason: lexical_alternative
  - marker: b
    text: Ou “escarnecedores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: costumavam dizer
  rationale: O imperfeito indica fala passada habitual ou repetida. “Costumavam dizer” expressa esse aspecto com naturalidade em português.
- source_word: Ἐπ’ ἐσχάτου χρόνου
  choice: No último tempo
  rationale: Preserva o singular χρόνος (“tempo”) e a força escatológica da expressão, sem harmonizá-la com a fórmula plural “últimos dias”.
- source_word: ἐμπαῖκται
  choice: zombadores
  rationale: Termo atual e amplamente compreensível para pessoas que ridicularizam ou escarnecem; “escarnecedores” permanece como alternativa em nota.
- source_word: κατὰ τὰς ἑαυτῶν ἐπιθυμίας
  choice: segundo seus próprios desejos
  rationale: κατά com acusativo indica conformidade ou norma. “Segundo” acompanha de perto essa relação, e “desejos” preserva a amplitude de ἐπιθυμίαι sem restringi-la ao âmbito sexual.
- source_word: πορευόμενοι
  choice: que viverão
  rationale: Embora o particípio signifique literalmente “indo” ou “andando”, aqui descreve a conduta habitual. “Viverão” comunica naturalmente em português a metáfora do modo de vida e concorda com o futuro da oração principal.
- source_word: τῶν ἀσεβειῶν
  choice: ímpios
  rationale: O genitivo caracteriza os desejos como marcados pela impiedade. O adjetivo “ímpios” é idiomático e mantém o juízo moral e religioso do grego.
theological_decisions:
- issue: Expressão escatológica
  choice: No último tempo
  alternative: Nos últimos dias; No tempo do fim; No fim dos tempos
  rationale: A tradução conserva o singular “tempo” e a formulação própria de Judas, sem substituí-la por expressões escatológicas mais familiares de outras passagens.
- issue: Caracterização moral dos desejos
  choice: seus próprios desejos ímpios
  alternative: seus próprios desejos de impiedade; suas próprias paixões ímpias
  rationale: A formulação mantém a avaliação moral do texto, mas não reduz os desejos a paixões sexuais, pois ἐπιθυμίαι possui sentido mais amplo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “A vocês” evita regionalismo excessivo; “costumavam dizer” preserva o aspecto verbal; “viverão segundo” torna natural a metáfora de πορεύομαι sem apagar sua referência ao modo de conduta. Os marcadores de nota foram posicionados junto às expressões a que de fato correspondem.
