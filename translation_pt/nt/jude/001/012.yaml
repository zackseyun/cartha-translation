id: JUD.1.12
reference: Jude 1:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν ⸀οἱ ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες συνευωχούμενοι, ἀφόβως ἑαυτοὺς ποιμαίνοντες, νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι, δένδρα φθινοπωρινὰ ἄκαρπα δὶς ἀποθανόντα ἐκριζωθέντα,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/012.yaml
  text: These are hidden reefs at your love feasts[a], feasting together without fear, shepherding themselves; waterless clouds carried along by winds; autumn trees without fruit, twice dead[c][b], uprooted.
translation:
  language: pt
  text: Esses são recifes ocultos em suas festas de amor[a], banqueteando-se juntos sem temor, pastoreando a si mesmos[b]; nuvens sem água, levadas pelos ventos; árvores de outono sem fruto, duas vezes mortas[c], arrancadas pela raiz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “manchas” ou “máculas”. A palavra grega pode ter sentido moral, referindo-se a manchas ou máculas em suas festas de amor, mas também pode designar recifes perigosos; esta última acepção combina melhor com a sequência de metáforas vívidas de Judas.
    reason: alternative_reading
  - marker: b
    text: “Pastoreando a si mesmos” também pode ser traduzido como “alimentando a si mesmos”, destacando sua conduta interesseira. Compare Ezequiel 34, sobre pastores que alimentam a si mesmos em vez do rebanho.
    reason: lexical_alternative_and_cross_reference
  - marker: c
    text: A expressão “duas vezes mortas” é mantida conforme o grego; também pode ser entendida como uma forma enfática de dizer “completamente mortas”.
    reason: ambiguity
lexical_decisions:
- source_word: σπιλάδες
  choice: recifes ocultos
  rationale: Preserva a imagem de perigos escondidos no convívio comunitário e se harmoniza com a sequência de metáforas vívidas; a possível acepção moral é registrada em nota.
- source_word: ἀγάπαις
  choice: festas de amor
  rationale: O plural designa refeições comunitárias cristãs e mantém a ligação lexical explícita com o amor.
- source_word: συνευωχούμενοι
  choice: banqueteando-se juntos
  rationale: Expressa a participação conjunta numa refeição festiva sem acrescentar um complemento não explícito no grego.
- source_word: ἀφόβως
  choice: sem temor
  rationale: Conserva a ambiguidade entre falta de receio, de reverência e de escrúpulo.
- source_word: ἑαυτοὺς ποιμαίνοντες
  choice: pastoreando a si mesmos
  rationale: Mantém a metáfora pastoral e sua possível ressonância com Ezequiel 34, sem reduzi-la de imediato ao ato de alimentar-se.
- source_word: νεφέλαι ἄνυδροι
  choice: nuvens sem água
  rationale: Tradução concreta e natural da imagem de promessa sem provisão.
- source_word: ὑπὸ ἀνέμων παραφερόμεναι
  choice: levadas pelos ventos
  rationale: Reproduz o particípio passivo e a ação de forças externas.
- source_word: δένδρα φθινοπωρινὰ ἄκαρπα
  choice: árvores de outono sem fruto
  rationale: Mantém a referência sazonal e a esterilidade em linguagem concreta.
- source_word: δὶς ἀποθανόντα
  choice: duas vezes mortas
  rationale: Preserva a formulação retoricamente marcante sem explicar ou atenuar sua tensão.
- source_word: ἐκριζωθέντα
  choice: arrancadas pela raiz
  rationale: Comunica de modo vívido a remoção completa e intensifica a imagem de morte.
theological_decisions:
- issue: Sentido de σπιλάδες aplicado aos falsos mestres
  choice: perigosos recifes ocultos nas refeições comunitárias
  alternative: manchas ou máculas nas festas de amor
  rationale: A leitura como recifes se encaixa bem na cadeia de imagens naturais e no perigo dissimulado, mas a alternativa moral possui base lexical e tradição suficiente para ser preservada em nota.
- issue: Força de ποιμαίνοντες em ἑαυτοὺς ποιμαίνοντες
  choice: manter a metáfora de pastorear
  alternative: alimentando a si mesmos
  rationale: O verbo significa normalmente pastorear e pode evocar líderes que cuidam apenas de si; a tradução alternativa explicita uma implicação possível, porém estreita a imagem.
- issue: Sentido de δὶς ἀποθανόντα
  choice: preservar literalmente 'duas vezes mortas'
  alternative: completamente mortas
  rationale: A expressão grega é enfática e teologicamente sugestiva, mas não explica em que consistem as duas mortes; a tradução não deve resolver essa tensão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação conserva a sequência rápida das metáforas. “Festas de amor” mantém o termo histórico sem recorrer a vocabulário denominacional; “sem temor” e “duas vezes mortas” preservam ambiguidades reais do original.
