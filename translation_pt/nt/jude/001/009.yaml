id: JUD.1.9
reference: Jude 1:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν· Ἐπιτιμήσαι σοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/009.yaml
  text: But Michael the archangel[a], when he was disputing with the devil and arguing about Moses' body, did not dare to bring a slanderous judgment against him, but said[b], “May the Lord rebuke you.”
translation:
  language: pt
  text: 'Mas o arcanjo Miguel, quando disputava com o diabo e discutia a respeito do corpo de Moisés, não se atreveu a proferir contra ele um juízo injurioso[a]; pelo contrário, disse: “Que o Senhor repreenda você!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais tradicional: “uma acusação insultuosa contra ele”.'
    reason: lexical_alternative
  - marker: b
    text: A formulação remete a Zacarias 3:2, onde o Senhor repreende Satanás.
    reason: cross_reference
lexical_decisions:
- source_word: ἀρχάγγελος
  choice: arcanjo
  rationale: Título tradicional, transparente e corrente em português, correspondente à ideia de anjo principal.
- source_word: διαβόλῳ
  choice: o diabo
  rationale: Neste contexto, διάβολος designa o adversário sobrenatural pessoal; a forma titular consagrada é mais natural do que o sentido lexical literal “caluniador”.
- source_word: διακρινόμενος
  choice: disputava
  rationale: Expressa contenda ou disputa e preserva a nuance de conflito presente no particípio.
- source_word: διελέγετο
  choice: discutia
  rationale: Indica uma troca verbal em andamento. “Discutia” mantém o tom adversativo e distingue este verbo de διακρινόμενος sem criar repetição exata.
- source_word: περὶ τοῦ Μωϋσέως σώματος
  choice: a respeito do corpo de Moisés
  rationale: Forma natural e dignificada em português, preservando a referência concreta e a relação genitiva do grego.
- source_word: οὐκ ἐτόλμησεν
  choice: não se atreveu
  rationale: Reproduz diretamente a ideia de não ousar ou não tomar para si a iniciativa.
- source_word: κρίσιν ἐπενεγκεῖν βλασφημίας
  choice: proferir contra ele um juízo injurioso
  rationale: Mantém o sentido forense de κρίσις e ἐπιφέρω e entende βλασφημίας como caracterização do juízo. A formulação evita sugerir de modo inequívoco que Miguel blasfemaria contra Deus, sem eliminar a dificuldade sintática.
- source_word: Ἐπιτιμήσαι σοι κύριος
  choice: Que o Senhor repreenda você!
  rationale: O optativo aoristo exprime desejo ou invocação. A construção com “Que” torna essa força explícita em português contemporâneo.
- source_word: κύριος
  choice: o Senhor
  rationale: Segue a tradução bíblica corrente de κύριος e preserva o título teológico sem especificar além do texto.
theological_decisions:
- issue: A natureza da contenção de Miguel ao dirigir-se ao diabo
  choice: Miguel não profere por autoridade própria um juízo injurioso contra o diabo, mas invoca a repreensão do Senhor.
  alternative: A expressão pode ser entendida como “uma acusação insultuosa” ou como um juízo de caráter blasfemo.
  rationale: A construção grega κρίσιν ... βλασφημίας é discutida. A tradução preserva o contraste claro entre a recusa de Miguel e seu apelo à autoridade do Senhor, sem impor uma angelologia detalhada nem resolver além do necessário a ambiguidade lexical.
translation_notes:
  register: Português moderno, dignificado e amplamente compreensível, com boa legibilidade brasileira. “A respeito do corpo de Moisés” conserva um registro formal natural; “Que o Senhor repreenda você” explicita a força volitiva do optativo sem recorrer ao lusitanismo “te” nem ao regionalismo “tu”.
source_grounding:
  english_pob_role: consult_only
