  source_fidelity: A tradução preserva o contraste de ὑμεῖς δέ (“Mas vocês”), o vocativo afetivo ἀγαπητοί (“amados”), a sequência de particípios e a continuidade sintática com o versículo seguinte. “Edificando a si mesmos sobre a sua santíssima fé” transmite adequadamente a imagem de ἐποικοδομοῦντες ἑαυτούς e a possível relação de fundamento expressa pelo dativo. “Santíssima” mantém o superlativo ἁγιωτάτῃ, e “no Espírito Santo” reproduz de modo fiel e não excessivamente interpretativo ἐν πνεύματι ἁγίῳ.
  naturalness: O texto é claro, digno e natural em português moderno de ampla compreensão. A construção participial “edificando a si mesmos ... e orando” é apropriada, pois a frase permanece em continuidade no versículo seguinte. “A si mesmos” é um pouco mais formal que “a vocês mesmos” ou a forma pronominal “edificando-se”, mas é plenamente idiomático e preserva com clareza o reflexivo grego.
  terminology: “Amados”, “fé”, “santíssima” e “Espírito Santo” são escolhas consistentes com o registro bíblico e com a terminologia cristã amplamente reconhecida, sem introduzir explicação doutrinária na tradução. As notas apresentam de forma equilibrada as alternativas de construção, de relação com o Espírito e do alcance lexical de πίστις.
