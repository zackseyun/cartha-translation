id: JUD.1.20
reference: Jude 1:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀγαπητοί, ⸂ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει⸃, ἐν πνεύματι ἁγίῳ προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/020.yaml
  text: But you[a], beloved, building yourselves up in your most holy faith and praying in the Holy Spirit[c][b],
translation:
  language: pt
  text: Mas vocês, amados, edificando a si mesmos sobre a sua santíssima fé[a][c] e orando no Espírito Santo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em sua santíssima fé”. A construção grega pode indicar tanto a edificação sobre um fundamento como a edificação no âmbito da fé.
    reason: lexical_alternative
  - marker: b
    text: Ou “pelo Espírito Santo”. A expressão pode enfatizar tanto o âmbito em que se ora (“no”) como a ação capacitadora do Espírito (“pelo”).
    reason: alternative_reading
  - marker: c
    text: “Fé” também pode ser entendida aqui como “confiança” ou “fidelidade”, embora, em Judas, provavelmente se refira à fé cristã compartilhada pela comunidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Mas vocês
  rationale: δέ estabelece contraste com os ímpios mencionados antes, e o pronome explícito ὑμεῖς dá ênfase aos destinatários. “Mas vocês” preserva ambos em português corrente.
- source_word: ἀγαπητοί
  choice: amados
  rationale: O vocativo plural expressa afeto e conserva o peso teológico do termo, sem recorrer a uma formulação excessivamente coloquial.
- source_word: ἐποικοδομοῦντες ἑαυτούς
  choice: edificando a si mesmos
  rationale: Mantém a metáfora de construção, o valor participial e a força reflexiva do pronome. O plural permite perceber que a comunidade inteira participa dessa edificação.
- source_word: τῇ ἁγιωτάτῃ ὑμῶν πίστει
  choice: sobre a sua santíssima fé
  rationale: “Sobre” torna visível a possível ideia de fundamento associada a ἐποικοδομέω. O superlativo ἁγιωτάτῃ é preservado por “santíssima”, e “sua” mantém a referência à fé compartilhada pelos destinatários.
- source_word: πίστει
  choice: fé
  rationale: No contexto de Judas, o termo provavelmente aponta para a fé cristã recebida e professada pela comunidade, embora lexicalmente também possa exprimir confiança ou fidelidade.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: no Espírito Santo
  rationale: Preserva ἐν como “em/no” e entende a expressão, conforme o uso cristão primitivo e o contexto, como referência ao Espírito Santo, sem explicitar além do texto se a ênfase recai na esfera ou na ação capacitadora.
- source_word: προσευχόμενοι
  choice: orando
  rationale: Conserva a forma participial e o fluxo da exortação, que continua no versículo seguinte.
theological_decisions:
- issue: Referente de πνεύματι ἁγίῳ
  choice: o Espírito Santo divino
  alternative: uma disposição espiritual santa
  rationale: No contexto parenético de Judas e no uso cristão primitivo, a referência ao Espírito Santo é a leitura mais natural. A tradução não acrescenta uma formulação doutrinária além da expressão grega.
- issue: Sentido de πίστις em “sua santíssima fé”
  choice: a fé cristã recebida e compartilhada pelos fiéis
  alternative: o ato pessoal de confiar ou a fidelidade dos destinatários
  rationale: O emprego de “a fé” em Judas favorece o conteúdo crido e transmitido, mas a tradução “fé” e a nota preservam a amplitude lexical sem eliminar as alternativas.
- issue: Relação expressa por ἐν em ἐν πνεύματι ἁγίῳ
  choice: oração realizada no âmbito ou sob a influência do Espírito Santo
  alternative: oração realizada por meio da ação capacitadora do Espírito Santo
  rationale: “No Espírito Santo” acompanha mais de perto a preposição grega e deixa aberta a relação entre esfera e agência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura participial foi mantida porque o período continua no versículo seguinte. “A si mesmos” evita enfraquecer a força reflexiva e mantém perceptível o caráter coletivo da exortação.
