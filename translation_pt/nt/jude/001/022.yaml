  yaml_path: translation/nt/jude/001/022.yaml
  text: And have mercy on those who are doubting,[a]
translation:
  language: pt
  text: E tenham misericórdia dos que estão em dúvida,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dos que estão vacilando»; possivelmente, «dos que estão discutindo». Neste contexto, o particípio grego pode ter mais de uma nuance.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conjunção simples que liga esta exortação às anteriores; a forma direta preserva a continuidade do discurso.
- source_word: οὓς μὲν
  choice: dos que
  rationale: O pronome relativo acusativo com μέν introduz o primeiro grupo de uma série. Em português, não é necessário explicitar «por um lado»; «dos que» retoma naturalmente as pessoas que recebem misericórdia.
- source_word: ἐλεᾶτε
  choice: tenham misericórdia
  rationale: O imperativo de ἐλεάω pede que se demonstre misericórdia ou compaixão. «Tenham misericórdia» é claro, digno e conserva a força ética da ordem.
- source_word: διακρινομένους
  choice: estão em dúvida
  rationale: Neste contexto, o particípio pode descrever pessoas que duvidam ou vacilam, embora também possa ter o sentido de contender. «Estão em dúvida» oferece uma leitura pastoral natural sem apagar as alternativas, registradas em nota.
theological_decisions:
- issue: Sentido de διακρινομένους no contexto das diferentes respostas pastorais
  choice: os que estão em dúvida
  alternative: os que estão vacilando; os que estão discutindo
  rationale: A leitura principal entende o grupo como pessoas espiritualmente incertas, o que se ajusta ao chamado à misericórdia. Como o particípio admite mais de uma nuance e o contexto não elimina toda ambiguidade, as principais alternativas são preservadas na nota, sem identificar essas pessoas dogmaticamente como hostis.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. O plural «tenham» dirige a exortação à comunidade. A ambiguidade lexical relevante é preservada em nota.
