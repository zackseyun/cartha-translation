id: JUD.1.14
reference: Jude 1:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων· Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/014.yaml
  text: And Enoch[a], the seventh from Adam, also prophesied to these, saying, “Behold[c][b], the Lord came with his holy myriads,”
translation:
  language: pt
  text: 'Também Enoque, o sétimo a partir de Adão, profetizou a respeito destes[a], dizendo: “Eis que[c] o Senhor veio com suas miríades santas[b]”,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “contra estes” ou “a estes”. O dativo grego τούτοις pode indicar aqueles de quem a profecia trata e, no contexto, refere-se aos intrusos ímpios.
    reason: lexical_alternative
  - marker: b
    text: Ou “com dezenas de milhares de seus santos”. μυριάσιν pode significar “miríades” ou “dezenas de milhares”; a expressão descreve uma imensa hoste santa.
    reason: lexical_alternative
  - marker: c
    text: A citação corresponde de perto a 1 Enoque 1:9.
    reason: cross_reference
lexical_decisions:
- source_word: Προεφήτευσεν
  choice: profetizou
  rationale: Preserva o ato de falar profeticamente sem restringi-lo à mera predição.
- source_word: δὲ καὶ
  choice: Também
  rationale: Expressa de modo natural a progressão leve de δέ e a força aditiva de καί, sem introduzir um contraste forte.
- source_word: τούτοις
  choice: a respeito destes
  rationale: O dativo pode indicar as pessoas às quais a profecia se refere; a formulação portuguesa é natural e não acrescenta um substantivo ausente do grego.
- source_word: ἕβδομος ἀπὸ Ἀδὰμ
  choice: o sétimo a partir de Adão
  rationale: Reproduz diretamente a designação genealógica, sem transformar a expressão em uma contagem interpretativa.
- source_word: Ἑνὼχ
  choice: Enoque
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: Ἰδοὺ
  choice: Eis que
  rationale: Mantém o tom solene e profético da interjeição, permanecendo compreensível em português moderno.
- source_word: ἦλθεν
  choice: veio
  rationale: Representa o aoristo como passado; não converte silenciosamente o possível passado profético em futuro.
- source_word: κύριος
  choice: o Senhor
  rationale: Equivalente corrente do título grego com artigo, sem explicitar um referente que o texto não identifica neste ponto.
- source_word: ἐν ἁγίαις μυριάσιν αὐτοῦ
  choice: com suas miríades santas
  rationale: Entende ἐν em sentido associativo e conserva μυριάσιν como uma hoste vastíssima, sem especificar que se trata de anjos, o que o grego não declara.
theological_decisions:
- issue: Identidade de “o Senhor” na citação
  choice: Manter apenas “o Senhor”.
  alternative: Explicitar Deus ou Jesus como referente.
  rationale: κύριος não resolve por si só se Judas aplica a expressão a Deus em sentido geral ou especificamente a Jesus; a tradução preserva essa tensão.
- issue: Natureza da profecia atribuída a Enoque
  choice: Apresentá-la como profecia e indicar a correspondência com 1 Enoque apenas em nota.
  alternative: Declarar no texto principal uma posição sobre a autoridade canônica de 1 Enoque.
  rationale: Judas afirma que Enoque profetizou, mas o versículo não formula um juízo explícito sobre o estatuto canônico da obra preservada.
- issue: Valor temporal de ἦλθεν
  choice: 'Traduzir no passado: “veio”.'
  alternative: Traduzir interpretativamente como “virá” ou “está vindo”.
  rationale: O aoristo grego está formalmente no passado, embora possa ter força de passado profético; conservar o passado evita resolver essa questão na tradução.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com leve elevação profética em “Eis que”. A construção evita “homens”, que não aparece explicitamente no grego, e conserva tanto o passado de ἦλθεν quanto a identidade não especificada da hoste santa.
