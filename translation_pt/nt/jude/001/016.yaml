id: JUD.1.16
reference: Jude 1:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν γογγυσταί, μεμψίμοιροι, κατὰ τὰς ἐπιθυμίας ⸀αὐτῶν πορευόμενοι, καὶ τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα, θαυμάζοντες πρόσωπα ὠφελείας χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/016.yaml
  text: These are grumblers[a], malcontents, walking according to their own desires, and their mouth speaks arrogant things[c][b], showing favoritism for the sake of gain.
translation:
  language: pt
  text: Esses são murmuradores, descontentes com a própria sorte, que vivem segundo os seus próprios desejos, e sua boca profere palavras arrogantes; mostram favoritismo em busca de vantagem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “admiram rostos”; expressão idiomática para mostrar parcialidade ou favoritismo. Também pode incluir a ideia de lisonjear pessoas para obter vantagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσταί
  choice: murmuradores
  rationale: Expressa pessoas caracterizadas por queixas resmungadas e preserva o tom acusatório do substantivo grego.
- source_word: μεμψίμοιροι
  choice: descontentes com a própria sorte
  rationale: O termo raro descreve quem se queixa da condição que lhe coube; a expressão explicita esse sentido sem o confundir com mera crítica aos outros.
- source_word: κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι
  choice: que vivem segundo os seus próprios desejos
  rationale: O particípio de πορεύομαι tem sentido figurado de conduzir a vida; 'desejos' mantém a amplitude de ἐπιθυμίαι, enquanto o contexto fornece a carga moral negativa.
- source_word: τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα
  choice: sua boca profere palavras arrogantes
  rationale: Mantém a imagem coletiva da boca no singular e comunica o caráter inflado, presunçoso e arrogante de ὑπέρογκα em português natural.
- source_word: θαυμάζοντες πρόσωπα
  choice: bajulam pessoas
  rationale: No contexto de benefício próprio, o idioma indica tratamento lisonjeiro e parcial dirigido a pessoas; 'bajulam' torna clara essa conduta interessada.
- source_word: ὠφελείας χάριν
  choice: em busca de benefício
  rationale: Expressa o motivo utilitário da bajulação sem limitar o possível benefício exclusivamente a lucro financeiro.
- source_word: οὗτοί εἰσιν
  choice: Esses são
  rationale: Reproduz diretamente a identificação enfática do grego e se liga naturalmente aos referentes anteriores.
theological_decisions:
- issue: Força moral de ἐπιθυμίαι
  choice: '''desejos'' no texto principal, com sentido negativo dado pelo contexto'
  alternative: '''paixões'' ou ''desejos pecaminosos'''
  rationale: O substantivo pode designar desejos fortes de natureza variada; não convém restringi-lo silenciosamente à sensualidade nem acrescentar uma qualificação ausente.
- issue: Força idiomática de θαυμάζοντες πρόσωπα
  choice: '''bajulam pessoas'''
  alternative: '''mostram favoritismo'' ou, literalmente, ''admiram rostos'''
  rationale: A ligação com ὠφελείας χάριν favorece a ideia de lisonja interessada. A nota preserva o idioma literal e a nuance de parcialidade, sem impor uma única manifestação possível.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução prioriza equivalência ótima: conserva a imagem singular de ''boca'', explicita o sentido raro de μεμψίμοιροι e traduz idiomaticamente θαυμάζοντες πρόσωπα, registrando sua forma literal em nota.'
