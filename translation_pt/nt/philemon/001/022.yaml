id: PHM.1.22
reference: Philemon 1:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἑτοίμαζέ μοι ξενίαν, ἐλπίζω γὰρ ὅτι διὰ τῶν προσευχῶν ὑμῶν χαρισθήσομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/022.yaml
  text: At the same time also prepare a guest room for me[b][a], for I hope that through your prayers I will be granted to you.
translation:
  language: pt
  text: Ao mesmo tempo, prepare também para mim um lugar onde ficar[a], pois espero que, por meio das orações de vocês, eu lhes seja concedido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma hospedagem” ou “hospitalidade”; o termo grego pode se referir tanto ao acolhimento como ao lugar preparado para um hóspede.
    reason: lexical_alternative
  - marker: b
    text: Ou “eu lhes seja dado gratuitamente”; o verbo grego transmite a ideia de conceder livremente ou pela graça, provavelmente deixando implícita a ação de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: Ao mesmo tempo, ... também
  rationale: Expressa o pedido adicional ligado ao anterior, preservando tanto a ideia de simultaneidade de ἅμα quanto a força aditiva de καί; δέ é refletido pelo fluxo da frase.
- source_word: ἑτοίμαζέ
  choice: prepare
  rationale: O imperativo presente pede uma providência prática; “prepare” é direto, natural e digno em português.
- source_word: μοι
  choice: para mim
  rationale: 'Representa o dativo de benefício: a hospedagem deve ser preparada em favor de Paulo.'
- source_word: ξενίαν
  choice: um lugar onde ficar
  rationale: No contexto de ἑτοίμαζέ, o sentido concreto de acomodação é o mais provável. A formulação é clara e não restringe o termo necessariamente a um quarto específico.
- source_word: ἐλπίζω γὰρ ὅτι
  choice: pois espero que
  rationale: “Pois” apresenta a razão do pedido, e “espero que” introduz naturalmente o conteúdo da expectativa.
- source_word: διὰ τῶν προσευχῶν ὑμῶν
  choice: por meio das orações de vocês
  rationale: Preserva o valor instrumental de διά com o genitivo e usa uma forma amplamente compreensível em português.
- source_word: χαρισθήσομαι
  choice: eu lhes seja concedido
  rationale: Mantém a voz passiva e a noção de concessão ou dádiva do verbo, sem acrescentar explicitamente quem concede nem substituir o verbo por “ser libertado”.
- source_word: ὑμῖν
  choice: lhes
  rationale: O pronome dativo indica que Paulo espera ser concedido aos destinatários; “lhes” é conciso e evita repetir “a vocês”.
theological_decisions:
- issue: Sentido de χαρισθήσομαι e agência implícita
  choice: eu lhes seja concedido
  alternative: eu lhes seja dado gratuitamente; eu seja libertado e volte para vocês
  rationale: A tradução conserva a passiva e permite que a provável agência divina permaneça implícita, como no grego. Não explicita libertação da prisão, embora o contexto da carta possa sugeri-la, nem elimina completamente a nuance de dádiva.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Vocês” torna explícito que os pronomes gregos estão no plural. “Um lugar onde ficar” evita a precisão excessiva de “quarto de hóspedes”, e “eu lhes seja concedido” preserva a formulação incomum e teologicamente sugestiva do original.
