  text: διὰ τὴν ἀγάπην μᾶλλον παρακαλῶ, τοιοῦτος ὢν ὡς Παῦλος πρεσβύτης νυνὶ δὲ καὶ δέσμιος ⸂Χριστοῦ Ἰησοῦ⸃—
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/009.yaml
  text: because of love I rather appeal[a], being such a one as Paul, an old man[c][b], and now also a prisoner of Messiah Jesus—
translation:
  language: pt
  text: por amor, prefiro apelar[a] — eu, Paulo, homem idoso[b] e agora também prisioneiro do Messias Jesus[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa do amor, prefiro apelar”.'
    reason: lexical_alternative
  - marker: b
    text: 'Outra leitura proposta: “Paulo, um embaixador”; mas o termo grego significa mais naturalmente “um homem idoso”.'
    reason: alternative_reading
  - marker: c
    text: 'Grego: “Cristo Jesus”. Aqui, “Messias” traduz Χριστός como título.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τὴν ἀγάπην
  choice: por causa do amor
  rationale: διά com acusativo expressa aqui causa ou motivo. A formulação é clara e preserva a força causal do grego.
- source_word: μᾶλλον παρακαλῶ
  choice: prefiro fazer um apelo
  rationale: A expressão contrasta o apelo de Paulo com a ordem que ele poderia dar no versículo anterior. A formulação comunica tanto a preferência marcada por μᾶλλον quanto o caráter pessoal e relacional de παρακαλῶ.
- source_word: τοιοῦτος ὢν ὡς Παῦλος
  choice: 'sendo quem sou: Paulo'
  rationale: A construção grega é elíptica e introduz a autodescrição seguinte. A tradução mantém essa função sem reproduzir uma estrutura pouco natural em português.
- source_word: πρεσβύτης
  choice: um homem idoso
  rationale: O sentido lexical mais natural é etário. “Homem idoso” evita tanto a possível ambiguidade eclesiástica de “presbítero” quanto a leitura menos provável “embaixador”.
- source_word: νυνὶ δὲ καὶ
  choice: e agora também
  rationale: Preserva o destaque temporal de νυνί e a adição de mais uma condição de Paulo por meio de καί.
- source_word: δέσμιος
  choice: prisioneiro
  rationale: É a equivalência direta para alguém encarcerado e mantém a forma nominal do original.
- source_word: Χριστοῦ Ἰησοῦ
  choice: do Messias Jesus
  rationale: Χριστός conserva aqui força titular. O genitivo apresenta Paulo como prisioneiro pertencente a, ou por causa de sua relação com, o Messias Jesus, sem resolver além do que o texto permite.
theological_decisions:
- issue: Sentido de πρεσβύτης
  choice: homem idoso
  alternative: embaixador; presbítero
  rationale: O texto traz πρεσβύτης, cujo sentido normal é um homem de idade avançada, e não πρεσβευτής, “embaixador”. “Presbítero” importaria uma referência a ofício eclesiástico que o contexto não exige.
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Nesta expressão, o termo ainda pode ser ouvido como título. A nota registra a forma tradicional portuguesa sem apagar a força messiânica do grego.
- issue: Relação expressa por δέσμιος Χριστοῦ Ἰησοῦ
  choice: prisioneiro do Messias Jesus
  alternative: prisioneiro por causa do Messias Jesus
  rationale: O genitivo é preservado de modo conciso, pois pode sugerir pertencimento e serviço, ao mesmo tempo que o contexto permite a ideia de prisão por causa de Jesus. A tradução não restringe a relação a uma única explicação.
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. A expressão “sendo quem sou: Paulo” torna natural a construção elíptica grega, e o travessão final preserva a continuidade sintática com o versículo seguinte.'
