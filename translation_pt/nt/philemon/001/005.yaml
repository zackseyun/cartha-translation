id: PHM.1.5
reference: Philemon 1:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀκούων σου τὴν ἀγάπην καὶ τὴν πίστιν ἣν ἔχεις ⸀πρὸς τὸν κύριον Ἰησοῦν καὶ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/005.yaml
  text: because I hear of your love and faith that you have toward the Lord Jesus and for all the saints[c][b][a],
translation:
  language: pt
  text: porque ouço falar do seu amor e da sua fé em relação ao Senhor Jesus e para com todos os santos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, explicitando o sentido: “sua fé no Senhor Jesus e seu amor por todos os santos”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “sua fidelidade”. A palavra grega pode indicar fé, confiança ou fidelidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούων
  choice: porque ouço falar
  rationale: O particípio depende da ação de graças do versículo anterior e tem valor causal no contexto. A formulação finita é natural em português e mantém o sentido presente.
- source_word: ἀγάπην
  choice: amor
  rationale: É a tradução corrente e direta de ἀγάπη.
- source_word: πίστιν
  choice: fé
  rationale: Mantém a tradução principal de πίστις, sem excluir a possível nuance de fidelidade, registrada em nota.
- source_word: πρὸς τὸν κύριον Ἰησοῦν
  choice: em relação ao Senhor Jesus
  rationale: Expressa a orientação pessoal indicada por πρός sem substituir automaticamente a construção por “fé no Senhor Jesus” e sem igualá-la por completo à preposição seguinte.
- source_word: κύριον
  choice: Senhor
  rationale: Preserva o título cristológico usual de κύριος.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: para com todos os santos
  rationale: A construção é idiomática em português para uma disposição dirigida a pessoas e conserva a ideia direcional de εἰς.
- source_word: ἁγίους
  choice: santos
  rationale: É a designação neotestamentária concisa e tradicional para os membros do povo santo de Deus.
theological_decisions:
- issue: Relação de “amor” e “fé” com as duas expressões preposicionais
  choice: Manter, no texto principal, os dois substantivos antes das duas expressões, acompanhando a ordem e a ambiguidade do grego.
  alternative: 'Explicitar distributivamente: “sua fé no Senhor Jesus e seu amor por todos os santos”.'
  rationale: A leitura distributiva é provável e combina com o uso paulino, mas o grego não redistribui expressamente cada substantivo a um complemento. A nota apresenta a interpretação sem impô-la ao texto principal.
- issue: Sentido de πίστις neste contexto
  choice: fé
  alternative: fidelidade
  rationale: “Fé” é o equivalente principal, mas o contexto admite uma nuance de lealdade ou fidelidade; essa possibilidade é preservada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Você” expressa naturalmente o singular dirigido a Filemom. A formulação evita resolver no texto principal a possível distribuição de “fé” ao Senhor Jesus e “amor” aos santos.
