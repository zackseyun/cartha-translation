id: PHM.1.17
reference: Philemon 1:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἰ οὖν με ἔχεις κοινωνόν, προσλαβοῦ αὐτὸν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/017.yaml
  text: So if you consider me a partner[a], receive him as you would me.
translation:
  language: pt
  text: Portanto, se você me considera seu parceiro, receba-o como receberia a mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰ οὖν
  choice: Portanto, se
  rationale: Preserva a relação inferencial de οὖν com o apelo anterior e introduz naturalmente a condição expressa por εἰ.
- source_word: με ἔχεις κοινωνόν
  choice: você me considera seu parceiro
  rationale: κοινωνός designa alguém que participa ou compartilha com outro. A formulação comunica de modo natural a relação de parceria, enquanto o possessivo explicita em português a ligação entre Paulo e Filemom sem torná-la técnica.
- source_word: προσλαβοῦ
  choice: receba-o
  rationale: O imperativo médio de προσλαμβάνομαι pode significar receber, acolher ou aceitar favoravelmente. “Receba-o” conserva a amplitude entre acolhimento pessoal e aceitação relacional.
- source_word: αὐτὸν
  choice: -o
  rationale: Pronome acusativo masculino que, no contexto, se refere a Onésimo.
- source_word: ὡς ἐμέ
  choice: como receberia a mim
  rationale: 'A expansão verbal idiomática em português esclarece a comparação: Filemom deve receber Onésimo do mesmo modo que receberia Paulo.'
theological_decisions:
- issue: Força relacional de κοινωνός no apelo de Paulo
  choice: parceiro
  alternative: companheiro; participante; alguém que compartilha da mesma comunhão
  rationale: “Parceiro” expressa participação e vínculo mútuos sem transformar o termo em conceito sacramental ou denominacional. Mantém a força social e eclesial do apelo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A construção é direta e natural, preservando a lógica condicional e a força relacional do original. Não se acrescentou nota, pois “receba” mantém adequadamente a amplitude lexical de προσλαβοῦ; a nota inglesa fornecida parece inconsistente ao apresentar “welcome him” como alternativa ligada a “partner”.
