review_pass:
  verdict: revise
  source_fidelity: 'A formulação atual transmite adequadamente o desejo de Paulo, a retenção de Onésimo, o propósito e o serviço representativo a Filemom. Contudo, “enquanto estou preso por causa do evangelho” explicita duas relações que o grego mantém compactas: ἐν τοῖς δεσμοῖς é literalmente ‘nas cadeias’, e o genitivo τοῦ εὐαγγελίου admite relação mais ampla do que apenas causal. A revisão preserva essa concisão e ambiguidade, com nota para a leitura causal.'
  naturalness: “Nas cadeias do evangelho” é uma formulação digna, compreensível e natural no registro bíblico moderno em português. A colocação de “em seu lugar” antes de “ele me servisse” torna clara a relação de ὑπὲρ σοῦ sem tornar a frase pesada.
  terminology: “Cadeias” conserva a imagem de δεσμοί e seu uso metonímico para prisão. “Evangelho” corresponde regularmente a εὐαγγέλιον. “Em seu lugar” é contextualmente defensável para ὑπὲρ σοῦ, pois o serviço de Onésimo supriria o serviço que Filemom teria prestado.
  issues:
  - severity: medium
    issue: A expressão “enquanto estou preso por causa do evangelho” resolve interpretativamente “ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου”.
    rationale: Ela substitui a imagem de ‘cadeias’ por uma paráfrase temporal e fixa o genitivo como causal. O texto grego permite a compreensão causal, mas a construção é deliberadamente mais compacta; a alternativa deve permanecer disponível em nota.
  revised_text: Eu queria mantê-lo comigo, para que, em seu lugar, ele me servisse nas cadeias do evangelho[a],
