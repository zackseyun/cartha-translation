source:
  edition: SBLGNT
  text: ὃν ἐγὼ ἐβουλόμην πρὸς ἐμαυτὸν κατέχειν, ἵνα ὑπὲρ σοῦ ⸂μοι διακονῇ⸃ ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/013.yaml
  text: I wanted to keep him with me[a], so that on your behalf he might serve me in the chains of the gospel,
translation:
  language: pt
  text: Eu queria mantê-lo comigo, para que, em seu lugar, ele me servisse nas cadeias do evangelho[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa do evangelho”, isto é, cadeias sofridas por causa do evangelho.'
    reason: Preserva no texto a expressão compacta e ambígua do grego, ao mesmo tempo que registra a interpretação causal provável do genitivo.
lexical_decisions:
- source_word: ὃν
  choice: -lo
  rationale: Pronome relativo acusativo masculino singular que retoma Onésimo; em português natural, é incorporado como pronome objeto em “mantê-lo”.
- source_word: ἐβουλόμην
  choice: Eu queria
  rationale: Expressa de modo idiomático o desejo ou intenção de Paulo no passado, sem forçar uma nuance aspectual além do contexto.
- source_word: πρὸς ἐμαυτὸν
  choice: comigo
  rationale: Com κατέχειν, indica conservar Onésimo na companhia de Paulo; “comigo” é natural e claro.
- source_word: κατέχειν
  choice: mantê-lo
  rationale: No contexto, significa reter Onésimo junto de si. “Manter” preserva o sentido sem a possível conotação coercitiva de “reter”.
- source_word: ἵνα
  choice: para que
  rationale: Mantém claramente a força de propósito da conjunção.
- source_word: ὑπὲρ σοῦ
  choice: em seu lugar
  rationale: Neste contexto, o serviço de Onésimo representaria o serviço que Filemom prestaria a Paulo; a expressão comunica essa representação de modo direto.
- source_word: μοι διακονῇ
  choice: ele me servisse
  rationale: διακονέω designa serviço ou assistência; “servisse” evita restringir o termo a um ministério eclesiástico e o subjuntivo corresponde à construção de propósito.
- source_word: ἐν τοῖς δεσμοῖς
  choice: enquanto estou preso
  rationale: O plural δεσμοί denota literalmente laços ou correntes e, por extensão, prisão. A formulação comunica com naturalidade a situação concreta de Paulo.
- source_word: τοῦ εὐαγγελίου
  choice: por causa do evangelho
  rationale: 'O genitivo liga a prisão de Paulo ao evangelho e, no contexto, é naturalmente entendido em sentido causal: ele está preso por causa do evangelho.'
theological_decisions:
- issue: Força de τοῦ εὐαγγελίου em relação a δεσμοῖς
  choice: por causa do evangelho
  alternative: nas correntes do evangelho
  rationale: Embora o grego use um genitivo compacto, a relação causal é a leitura contextual mais provável. A tradução natural esclarece que Paulo sofre prisão em razão do evangelho, sem introduzir uma afirmação doutrinária adicional.
- issue: Sentido de ὑπὲρ σοῦ
  choice: em seu lugar
  alternative: em seu favor
  rationale: O contexto sugere que Onésimo prestaria a Paulo o serviço que Filemom desejaria ou deveria prestar. “Em seu lugar” torna essa dimensão representativa explícita sem implicar substituição salvífica.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para fluidez: “enquanto estou preso por causa do evangelho” traduz de maneira natural a relação entre a prisão e o evangelho. Não há marcadores de nota, pois nenhuma nota é necessária nesta formulação.'
