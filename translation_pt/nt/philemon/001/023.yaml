source:
  edition: SBLGNT
  text: ⸀Ἀσπάζεταί σε Ἐπαφρᾶς ὁ συναιχμάλωτός μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/023.yaml
  text: Epaphras[a], my fellow prisoner in Messiah Jesus, greets you.
translation:
  language: pt
  text: Epafras, meu companheiro de prisão no Messias Jesus[a], envia saudações a você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais tradicionalmente, “em Cristo Jesus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: envia saudações a
  rationale: Neste contexto, ἀσπάζομαι expressa o ato de saudar ou mandar saudações. A formulação é natural em português moderno e evita uma construção pronominal excessivamente regional.
- source_word: σε
  choice: você
  rationale: O pronome grego está no singular e se refere diretamente a Filemom. “Você” deixa explícito o número e oferece boa legibilidade brasileira.
- source_word: Ἐπαφρᾶς
  choice: Epafras
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome grego.
- source_word: ὁ συναιχμάλωτός μου
  choice: meu companheiro de prisão
  rationale: O substantivo composto designa alguém que compartilha a condição de prisioneiro. “Companheiro de prisão” é claro e idiomático, sem acrescentar a ideia específica de prisioneiro de guerra.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Mantém a preposição ἐν e preserva a linguagem paulina de relação ou união com o Messias, sem reduzi-la a “por causa de”. Χριστός é vertido como título, “Messias”, e Ἰησοῦ como o nome “Jesus”.
theological_decisions:
- issue: Sentido de Χριστῷ na fórmula paulina ἐν Χριστῷ Ἰησοῦ
  choice: Messias
  alternative: Cristo
  rationale: A tradução explicita o valor titular de Χριστός e preserva a tensão teológica da expressão “no Messias”. A forma tradicional “em Cristo Jesus” permanece registrada em nota, pois também é uma tradução legítima e consagrada.
- issue: Relação expressa por ἐν
  choice: 'no'
  alternative: por causa do
  rationale: A tradução formal da preposição conserva a formulação caracteristicamente paulina e evita definir se a prisão é apenas causada pelo serviço a Jesus ou se a expressão descreve primariamente a relação do prisioneiro com ele.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Envia saudações a você” comunica com clareza o singular de σε e evita tanto o lusitanismo marcado quanto oscilações regionais entre “te” e “lhe”. O marcador foi colocado diretamente após a expressão à qual a alternativa da nota se refere.
