source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: pt
  text: Graça e paz a vocês, da parte de Deus, nosso Pai, e do Senhor Jesus, o Messias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus Cristo”. O grego Χριστός pode funcionar como título (“Messias”) ou, em alguns contextos, de modo mais semelhante a um nome (“Cristo”).'
    reason: Leitura alternativa que preserva a variação legítima na função de Χριστός.
lexical_decisions:
- source_word: χάρις
  choice: Graça
  rationale: Preserva tanto a forma característica da saudação paulina quanto o peso teológico do termo, sem reduzi-lo a mero favor.
- source_word: ὑμῖν
  choice: a vocês
  rationale: É a expressão idiomática e amplamente compreensível para o dativo plural nesta saudação.
- source_word: εἰρήνη
  choice: paz
  rationale: Mantém o sentido usual e sua provável ressonância com o conceito bíblico de shalom.
- source_word: ἀπὸ
  choice: da parte de
  rationale: Expressa naturalmente em português a fonte da graça e da paz no contexto de uma saudação epistolar.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Deus, nosso Pai
  rationale: Entende πατρὸς ἡμῶν em aposição a θεοῦ e usa vírgula para tornar clara em português a formulação paulina.
- source_word: κυρίου
  choice: Senhor
  rationale: Preserva a força honorífica e cristológica de κύριος no uso paulino.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título, explicitando seu significado em português; a vírgula e o artigo tornam a aposição titular natural.
theological_decisions:
- issue: Tradução de Χριστοῦ na expressão Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: Χριστός pode conservar força titular ou funcionar de modo mais semelhante a um nome. O texto principal explicita o título messiânico, enquanto a nota preserva a tradução tradicional e a ambiguidade de uso.
- issue: Relação sintática em θεοῦ πατρὸς ἡμῶν
  choice: Deus, nosso Pai
  alternative: nosso Deus e Pai
  rationale: A sequência grega favorece a leitura apositiva, na qual Deus é identificado como nosso Pai, sem introduzir uma conjunção ausente no original.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com naturalidade brasileira sem regionalismo marcado. “A vocês” comunica claramente o plural de ὑμῖν; “da parte de” é idiomático em saudações. A pontuação explicita as aposições sem alterar a sintaxe essencial.
