source:
  edition: SBLGNT
  text: χωρὶς δὲ τῆς σῆς γνώμης οὐδὲν ἠθέλησα ποιῆσαι, ἵνα μὴ ὡς κατὰ ἀνάγκην τὸ ἀγαθόν σου ᾖ ἀλλὰ κατὰ ἑκούσιον·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/014.yaml
  text: But without your consent I wanted to do nothing[a], so that your good deed might not be as if by compulsion[c][b], but voluntary.
translation:
  language: pt
  text: Mas não quis fazer nada sem o seu consentimento,[a] para que o seu ato de bondade[b] não fosse como se fosse por imposição, mas de livre vontade.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem a sua aprovação” ou “sem a sua opinião”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a sua bondade” ou “o bem que você fizer”. O grego pode se referir tanto à boa ação de Filemom nessa situação quanto, de modo mais abstrato, à sua bondade.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “segundo o que é voluntário”; isto é, “por sua própria vontade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς ... τῆς σῆς γνώμης
  choice: sem o seu consentimento
  rationale: γνώμη pode indicar opinião, parecer, intenção ou consentimento. No contexto, Paulo se abstém de agir sem a anuência de Filemom; “consentimento” expressa de modo natural essa dimensão relacional e volitiva.
- source_word: οὐδὲν ἠθέλησα ποιῆσαι
  choice: não quis fazer nada
  rationale: θέλω expressa vontade. A formulação conserva a volição pessoal de Paulo sem transformá-la em mera decisão formal.
- source_word: ἵνα μὴ ... ᾖ
  choice: para que ... não fosse
  rationale: A construção preserva a finalidade introduzida por ἵνα e soa natural em português depois do verbo principal no passado.
- source_word: ὡς κατὰ ἀνάγκην
  choice: como que por obrigação
  rationale: ἀνάγκη indica aqui constrangimento ou compulsão, e “como que” representa ὡς, evitando afirmar de modo absoluto que o ato seria forçado.
- source_word: τὸ ἀγαθόν σου
  choice: o seu ato de bondade
  rationale: O adjetivo neutro substantivado pode apontar para o bem concreto que Filemom faria e também evocar sua bondade. “Ato de bondade” mantém ambas as dimensões melhor do que uma especificação maior do ato.
- source_word: ἀλλὰ κατὰ ἑκούσιον
  choice: mas de livre vontade
  rationale: ἑκούσιος designa aquilo que é voluntário. A expressão idiomática portuguesa estabelece com clareza o contraste com a obrigação.
theological_decisions:
- issue: Natureza da resposta de Filemom
  choice: Apresentar o bem esperado como um ato praticado livremente, sem especificar em que ele consistiria.
  alternative: Traduzir de forma abstrata como “a sua bondade” ou mais específica como “a sua gentileza”.
  rationale: O texto ressalta o caráter voluntário, e não coagido, da resposta de Filemom, mas deixa implícito o ato concreto. A tradução evita acrescentar uma exigência ética ou doutrinária que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Não quis fazer nada” mantém a ordem retórica do grego; “como que por obrigação” e “de livre vontade” formam um contraste natural sem eliminar a nuance de ὡς.
