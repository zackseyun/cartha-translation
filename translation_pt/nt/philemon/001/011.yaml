  text: who once was useless to you[a], but now is useful both to you and to me,
translation:
  language: pt
  text: o qual antes foi inútil para você[a], mas agora é útil tanto para você como para mim,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulo provavelmente faz um jogo de palavras com o nome Onésimo, relacionado à ideia de ser útil ou proveitoso.
    reason: lexical_alternative
lexical_decisions:
- source_word: τόν
  choice: o qual
  rationale: O artigo acusativo retoma Onésimo no versículo anterior; «o qual» dá continuidade natural à frase em português.
- source_word: ποτέ
  choice: antes
  rationale: Expressa o tempo passado de modo claro e estabelece o contraste direto com «agora».
- source_word: σοι
  choice: para você
  rationale: Neste contexto relacional, o dativo indica em benefício ou proveito de quem algo é útil ou inútil.
- source_word: ἄχρηστον
  choice: inútil
  rationale: Preserva o sentido direto de «não útil», o contraste lexical com εὔχρηστον e o provável jogo com o nome Onésimo.
- source_word: νυνὶ δὲ
  choice: mas agora
  rationale: Mantém tanto o contraste temporal como a força adversativa de δέ.
- source_word: σοὶ καὶ ἐμοὶ
  choice: tanto para você como para mim
  rationale: Representa com clareza a construção coordenada e destaca os dois beneficiários sem alterar o sentido.
- source_word: εὔχρηστον
  choice: útil
  rationale: É o equivalente moderno mais direto e preserva a oposição deliberada entre «inútil» e «útil».
theological_decisions:
- issue: Possível jogo de palavras com o nome Onésimo e sua transformação
  choice: Manter no texto principal o contraste simples entre «inútil» e «útil».
  alternative: Explicitar o jogo de palavras por meio de uma paráfrase, como «antes sem proveito... agora verdadeiramente proveitoso».
  rationale: O grego já torna o contraste explícito. A tradução direta conserva o efeito literário e evita interpretar além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Você» traduz o singular σοι sem arcaísmo; «o qual» mantém a ligação sintática com o versículo anterior.
