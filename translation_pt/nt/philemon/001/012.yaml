    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: o
  rationale: Pronome relativo acusativo masculino singular, retomando Onésimo; em português, o clítico «o» integra naturalmente a construção verbal.
- source_word: ἀνέπεμψά
  choice: envio de volta
  rationale: O aoristo de ἀναπέμπω significa enviar de volta. O presente epistolar comunica com naturalidade a ação associada ao envio e à recepção da carta, sem excluir na nota as representações pretéritas do aoristo.
- source_word: σοι
  choice: a você
  rationale: O dativo singular indica o destinatário. «A você» é claro, atual e amplamente compreensível, inclusive no português brasileiro.
- source_word: αὐτόν
  choice: ele mesmo
  rationale: O pronome repetido tem força enfática. «Ele mesmo» preserva essa ênfase sem produzir a repetição pouco natural «o... ele».
- source_word: τοῦτ’ ἔστιν
  choice: isto é
  rationale: Fórmula explicativa que introduz a identificação metafórica seguinte; «isto é» mantém sua função com pouca interpretação.
- source_word: τὰ ἐμὰ σπλάγχνα
  choice: o meu próprio coração
  rationale: Embora σπλάγχνα denote literalmente as entranhas, aqui designa o centro da afeição profunda. «O meu próprio coração» reproduz a intensidade pessoal da metáfora em português natural.
theological_decisions:
- issue: Metáfora antropológica em τὰ ἐμὰ σπλάγχνα
  choice: o meu próprio coração
  alternative: as minhas próprias entranhas; os meus afetos mais profundos
  rationale: A decisão é idiomática, não doutrinária. «Coração» comunica ao leitor moderno a afeição profunda e a forte identificação de Paulo com Onésimo, enquanto uma tradução anatômica literal poderia obscurecer o sentido.
- issue: Valor temporal do aoristo epistolar ἀνέπεμψα
  choice: envio de volta
  alternative: enviei de volta; tenho enviado de volta
  rationale: O presente acompanha a perspectiva prática da carta em trânsito ou chegando ao destinatário. A nota preserva a possibilidade formal de representar o aoristo pelo passado, sem transformar a escolha temporal em afirmação teológica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. O travessão conserva a ênfase da retomada pronominal, e as notas registram tanto a nuance do aoristo epistolar quanto a imagem literal de σπλάγχνα.
