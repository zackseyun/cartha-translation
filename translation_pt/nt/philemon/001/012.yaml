  text: I am sending him back to you—him[a], that is[b], my very heart.
translation:
  language: pt
  text: Eu o envio[a] de volta a você — ele, isto é, o meu próprio coração[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais literal quanto à forma verbal: «eu o enviei de volta a você». O aoristo grego pode ser representado de mais de uma maneira em português; o presente considera a perspectiva da carta ao chegar a Filemom.'
    reason: lexical_alternative
  - marker: b
