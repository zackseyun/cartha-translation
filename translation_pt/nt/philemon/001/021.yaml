  text: πεποιθὼς τῇ ὑπακοῇ σου ἔγραψά σοι, εἰδὼς ὅτι καὶ ὑπὲρ ⸀ἃ λέγω ποιήσεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/021.yaml
  text: Confident of your obedience[a], I wrote to you, knowing that you will do even more than I say.
translation:
  language: pt
  text: Confiante em sua obediência, escrevi a você, sabendo que fará até mais do que digo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “irá além do que digo”. Paulo talvez dê a entender que Filemom fará mais do que o pedido específico apresentado, mas o texto não declara exatamente como.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: Confiante
  rationale: O particípio perfeito expressa um estado firme de confiança; “confiante” é natural em português e mantém essa ideia como base para o ato de escrever.
- source_word: τῇ ὑπακοῇ σου
  choice: em sua obediência
  rationale: ὑπακοή designa obediência ou disposição de atender. “Obediência” preserva a força relacional e moral do termo sem reduzi-lo a mera cortesia.
- source_word: ἔγραψά σοι
  choice: escrevi a você
  rationale: O aoristo é vertido naturalmente pelo pretérito perfeito. A formulação é clara e corrente no português moderno, com boa legibilidade brasileira.
- source_word: εἰδὼς
  choice: sabendo
  rationale: O particípio perfeito introduz a convicção que acompanha o ato de escrever; “sabendo” preserva de modo natural a ligação participial.
- source_word: καὶ ὑπὲρ ἃ λέγω
  choice: ainda mais do que estou dizendo
  rationale: ὑπέρ com acusativo significa “além de” ou “mais do que”; a tradução comunica que Paulo espera algo além de seu pedido expresso sem determinar em que isso consistirá.
- source_word: ποιήσεις
  choice: fará
  rationale: O futuro de ποιέω tem sentido amplo. “Fará” mantém deliberadamente indefinida a ação adicional esperada.
theological_decisions:
- issue: Força de ὑπακοή no apelo de Paulo
  choice: obediência
  alternative: disposição de atender; cumprimento do pedido
  rationale: O termo grego expressa propriamente obediência. Mantê-lo preserva a dinâmica de autoridade presente na carta, sem acrescentar coerção que o texto não explicita.
- issue: Implicação de “ainda mais do que estou dizendo”
  choice: A expectativa permanece aberta e não especificada.
  alternative: Uma alusão à libertação de Onésimo; apenas uma recepção especialmente generosa
  rationale: A formulação de Paulo é sugestiva, mas não declara qual seria a ação adicional. A tradução preserva essa ambiguidade e não resolve no texto uma questão interpretativa debatida.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros. A repetição explícita de “você” na oração final foi evitada porque a forma verbal “fará” identifica claramente o sujeito e produz uma frase mais fluida. O marcador da nota foi colocado junto à expressão que ela explica.
