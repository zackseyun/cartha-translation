  text: ὅπως ἡ κοινωνία τῆς πίστεώς σου ἐνεργὴς γένηται ἐν ἐπιγνώσει παντὸς ἀγαθοῦ ⸀τοῦ ἐν ἡμῖν εἰς ⸀Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/006.yaml
  text: so that the fellowship of your faith may become effective in the knowledge of every good thing that is in us for the Messiah[a][b][c][d][e].
translation:
  language: pt
  text: para que a comunhão da sua fé[a][b] se torne eficaz no conhecimento de todo o bem que há em nós[c] para o Messias[d][e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a participação da sua fé”, “o compartilhamento da sua fé” ou “a parceria da sua fé”.'
    reason: lexical_alternative
  - marker: b
    text: A palavra grega também pode, em alguns contextos, ter o sentido de “fidelidade” ou “confiança”.
    reason: alternative_reading
  - marker: c
    text: Alguns manuscritos trazem “em você” em vez de “em nós”.
    reason: textual_variant
  - marker: d
    text: 'Ou: “para Cristo”. O título grego Χριστός é traduzido aqui como “Messias”.'
    reason: lexical_alternative
  - marker: e
    text: 'A expressão “para o Messias” também pode ser ligada à oração inteira: “para que, em relação ao Messias, a comunhão da sua fé se torne eficaz pelo conhecimento de todo o bem que há em nós”.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ὅπως
  choice: para que
  rationale: Introduz o propósito ou resultado esperado da oração de Paulo e preserva naturalmente a força final da conjunção.
- source_word: κοινωνία
  choice: comunhão
  rationale: Mantém a amplitude de κοινωνία, que pode indicar comunhão, participação, compartilhamento ou parceria, sem limitar o sentido à comunicação verbal da fé.
- source_word: πίστεώς
  choice: fé
  rationale: É o sentido mais provável no contexto e preserva o termo teologicamente significativo, sem excluir por completo as nuances de confiança ou fidelidade.
- source_word: ἐνεργὴς γένηται
  choice: se torne eficaz
  rationale: Expressa tanto a ideia de vir a ser quanto a de produzir efeito, de modo natural em português.
- source_word: ἐν ἐπιγνώσει
  choice: no conhecimento
  rationale: Reflete diretamente ἐν e deixa aberta a relação entre o conhecimento e a eficácia; ἐπίγνωσις pode sugerir conhecimento pleno ou reconhecimento, mas explicitar isso no texto principal estreitaria a expressão.
- source_word: παντὸς ἀγαθοῦ
  choice: todo o bem
  rationale: Traduz de modo idiomático o neutro substantivado sem acrescentar a ideia não expressa de dom ou dádiva.
- source_word: τοῦ ἐν ἡμῖν
  choice: que há em nós
  rationale: Liga a expressão a 'todo o bem' e segue a leitura do SBLGNT com ἡμῖν, entendida coletivamente.
- source_word: εἰς Χριστόν
  choice: para o Messias
  rationale: Preserva a orientação ou referência expressa por εἰς sem definir excessivamente sua relação sintática; Χριστός é vertido como o título 'Messias'.
theological_decisions:
- issue: Sentido de κοινωνία τῆς πίστεώς σου
  choice: “a comunhão da sua fé”, mantendo aberta a ideia de participação, compartilhamento e parceria ligados à fé de Filemom
  alternative: “o compartilhamento da sua fé” ou “a participação na sua fé”
  rationale: A expressão grega é notoriamente difícil. A formulação escolhida preserva sua dimensão comunitária e prática sem decidir se Paulo fala principalmente da comunicação da fé, da participação comum nela ou da parceria que ela produz.
- issue: Referente de “em nós”
  choice: O plural coletivo do texto impresso, possivelmente abrangendo Paulo, Filemom e outros fiéis
  alternative: A variante “em você”, aplicada especificamente a Filemom
  rationale: O SBLGNT traz ἐν ἡμῖν, por isso o texto principal conserva “em nós”; a variante textual é registrada em nota.
- issue: Relação sintática de εἰς Χριστόν
  choice: Ligação mais próxima com “todo o bem que há em nós”
  alternative: Ligação com a eficácia da comunhão da fé ou com a oração inteira
  rationale: A construção grega é compacta e permite mais de uma relação sintática. O texto principal segue a ligação mais próxima, enquanto a nota preserva a alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Comunhão” é corrente no registro bíblico, mas as notas evitam que seja tomada como a única acepção possível. A ordem final conserva a concisão e parte da ambiguidade do grego.
