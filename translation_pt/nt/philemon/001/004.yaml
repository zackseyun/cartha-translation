  text: Εὐχαριστῶ τῷ θεῷ μου πάντοτε μνείαν σου ποιούμενος ἐπὶ τῶν προσευχῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/004.yaml
  text: I always thank my God[a], making mention of you in my prayers,
translation:
  language: pt
  text: Sempre dou graças ao meu Deus, fazendo menção de você nas minhas orações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lembrando-me de você nas minhas orações”. O grego diz mais literalmente: “fazendo menção de você”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: dou graças
  rationale: O presente do indicativo exprime a ação habitual no contexto. “Dou graças” é uma formulação natural e digna em português e conserva o sentido de agradecimento dirigido a Deus.
- source_word: τῷ θεῷ μου
  choice: ao meu Deus
  rationale: O dativo indica aquele a quem se dirigem as graças; “ao meu Deus” preserva também a expressão devocional pessoal do possessivo.
- source_word: πάντοτε
  choice: sempre
  rationale: Equivalente direto e corrente para o advérbio de constância, ligado à ação principal.
- source_word: μνείαν σου ποιούμενος
  choice: fazendo menção de você
  rationale: 'Conserva de perto o idioma grego e sua possível dimensão verbal: Paulo não apenas se lembra de Filemom, mas o menciona diante de Deus. O particípio é simultâneo à ação principal.'
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: nas minhas orações
  rationale: Tradução idiomática de ἐπί com genitivo neste contexto, indicando a ocasião em que Filemom é mencionado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva a estrutura participial e a repetição dos possessivos do grego sem soar excessivamente literal.
