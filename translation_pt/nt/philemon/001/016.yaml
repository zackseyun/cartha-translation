source:
  edition: SBLGNT
  text: οὐκέτι ὡς δοῦλον ἀλλὰ ὑπὲρ δοῦλον, ἀδελφὸν ἀγαπητόν, μάλιστα ἐμοί, πόσῳ δὲ μᾶλλον σοὶ καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/016.yaml
  text: no longer as a slave[a], but more than a slave, a beloved brother—especially to me, but how much more to you[b], both in the flesh and in the Lord.
translation:
  language: pt
  text: 'não mais como escravo[a], mas mais do que um escravo: um irmão amado, especialmente para mim, mas quanto mais para você, tanto na carne[b] como no Senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo” ou “servo vinculado”; a palavra grega pode abranger diferentes condições de servidão, mas aqui provavelmente se refere à condição social de Onésimo como escravo.
    reason: alternative_reading
  - marker: b
    text: Aqui, “na carne” provavelmente se refere à relação humana, terrena ou social, ou à relação pessoal, e não à “natureza pecaminosa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: não mais
  rationale: Expressa de modo natural a negação temporal e a mudança em relação à situação anterior.
- source_word: ὡς δοῦλον
  choice: como escravo
  rationale: No contexto social e jurídico de Onésimo, “escravo” comunica com clareza sua condição servil e mantém o contraste do versículo.
- source_word: ὑπὲρ δοῦλον
  choice: como alguém que é mais do que escravo
  rationale: Ὑπέρ indica aqui posição ou valor que ultrapassa o de escravo; a formulação explicita naturalmente a comparação sem alterar seu sentido.
- source_word: ἀδελφὸν ἀγαπητόν
  choice: um irmão amado
  rationale: Preserva diretamente a metáfora familiar cristã e traduz ἀγαπητός em linguagem digna e corrente.
- source_word: μάλιστα ἐμοί
  choice: especialmente para mim
  rationale: Reproduz de modo conciso a ênfase de grau marcada por μάλιστα.
- source_word: πόσῳ δὲ μᾶλλον σοὶ
  choice: e quanto mais para você
  rationale: Mantém a força retórica da progressão entre a relação de Paulo com Onésimo e a de Filemom com ele.
- source_word: ἐν σαρκὶ
  choice: na carne
  rationale: Conserva a expressão paulina e sua amplitude sem reduzi-la no texto principal a apenas “pessoalmente” ou “na relação terrena”.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Preserva a conhecida expressão paulina de relação e esfera cristã sem acrescentar uma identificação não explícita no sintagma.
theological_decisions:
- issue: Tradução de δοῦλος no contexto de Onésimo
  choice: escravo
  alternative: servo; escravo por dívida
  rationale: A condição social servil de Onésimo é central ao contraste. “Escravo” comunica essa realidade de modo direto, enquanto a nota reconhece a amplitude lexical do termo grego.
- issue: Sentido de ἐν σαρκὶ καὶ ἐν κυρίῳ
  choice: tanto na carne como no Senhor
  alternative: tanto na relação terrena como no Senhor; tanto pessoalmente como no Senhor
  rationale: A tradução mantém o contraste paulino entre a dimensão humana, corporal ou social e a relação cristã, sem resolver indevidamente a ambiguidade de σάρξ.
- issue: Relação indicada por πόσῳ δὲ μᾶλλον σοὶ
  choice: e quanto mais para você
  alternative: mas muito mais para você
  rationale: A forma escolhida conserva a intensificação retórica sem especificar se ela se deve sobretudo à relação social anterior, à convivência pessoal ou à fraternidade cristã.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “como alguém que é mais do que escravo” evita a possível rigidez de “acima de escravo”, enquanto “na carne” conserva a formulação paulina e recebe esclarecimento em nota.
