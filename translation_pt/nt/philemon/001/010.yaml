source:
  edition: SBLGNT
  text: παρακαλῶ σε περὶ τοῦ ἐμοῦ τέκνου, ὃν ἐγέννησα ἐν τοῖς ⸀δεσμοῖς Ὀνήσιμον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/010.yaml
  text: I appeal to you concerning my child[a], Onesimus, whom I fathered in my chains[b],
translation:
  language: pt
  text: Faço um apelo a você a respeito de meu filho[a], Onésimo, a quem gerei em minhas correntes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Filho» expressa aqui a relação espiritual e afetuosa de Paulo com Onésimo.
    reason: lexical_alternative
  - marker: b
    text: Ou «na minha prisão»; o grego usa a imagem concreta de correntes ou grilhões.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ
  choice: Peço
  rationale: No contexto de um apelo pessoal e afetuoso, «peço» comunica uma solicitação sincera sem o tom mais forte de uma ordem; «rogo» seria possível, mas é menos corrente no português moderno.
- source_word: περὶ τοῦ ἐμοῦ τέκνου
  choice: em favor de meu filho
  rationale: περί com genitivo introduz a pessoa a respeito de quem Paulo faz seu pedido. «Em favor de» soa natural neste contexto e «meu filho» preserva a relação afetuosa e metafórica.
- source_word: τέκνου
  choice: filho
  rationale: Embora τέκνον signifique literalmente «criança/filho», aqui designa metaforicamente Onésimo, um homem. «Filho» é natural em português e mantém a imagem de parentesco espiritual.
- source_word: ὃν ἐγέννησα
  choice: a quem gerei
  rationale: «Gerei» preserva de modo conciso a metáfora explícita de γεννάω, sem substituí-la por uma explicação sobre conversão ou paternidade espiritual.
- source_word: ἐν τοῖς δεσμοῖς
  choice: enquanto estava preso
  rationale: δεσμοί significa literalmente «correntes/grilhões» e, por metonímia, prisão. A formulação escolhida expressa com clareza a circunstância temporal implícita, enquanto a nota registra a imagem concreta do grego.
- source_word: Ὀνήσιμον
  choice: Onésimo
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Natureza da relação de Paulo com Onésimo
  choice: 'Manter a metáfora de geração: «a quem gerei»'
  alternative: «de quem me tornei pai» ou explicitar que Paulo o levou à fé
  rationale: O grego sugere paternidade espiritual, provavelmente ligada ao início da fé de Onésimo, mas não formula isso diretamente como conversão. A tradução conserva a metáfora e evita acrescentar uma explicação doutrinária ao texto principal.
- issue: Sentido de ἐν τοῖς δεσμοῖς
  choice: Traduzir no texto como circunstância de prisão e registrar a imagem literal em nota
  alternative: «em minhas correntes»
  rationale: A expressão pode evocar concretamente os grilhões e, ao mesmo tempo, funcionar como referência à condição de prisioneiro. A escolha mantém o sentido contextual sem negar a imagem literal.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e ampla inteligibilidade internacional. «Peço a você» evita tanto o arcaísmo de «rogo-te» quanto um tom autoritário. A vírgula antes de Onésimo foi omitida porque o nome funciona naturalmente como identificação de «meu filho»; as notas preservam a metáfora espiritual e a imagem concreta das correntes.
