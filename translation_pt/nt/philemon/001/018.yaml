    issue: «lhe causou algum dano» para ἠδίκησεν
    rationale: A expressão pode sugerir sobretudo prejuízo ou dano causado, ao passo que ἀδικέω significa agir injustamente contra alguém e pode incluir, mas não se limita a, dano material. «Lhe fez alguma injustiça» mantém o alcance do original.
  - severity: low
    issue: Formulação da alternativa na nota
    rationale: «Debite isso a mim» é pouco idiomático em português. «Debite isso na minha conta» preserva a metáfora contábil e é a alternativa natural a «ponha isso na minha conta».
