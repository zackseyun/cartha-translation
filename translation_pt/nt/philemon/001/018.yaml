  text: εἰ δέ τι ἠδίκησέν σε ἢ ὀφείλει, τοῦτο ἐμοὶ ⸀ἐλλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/018.yaml
  text: But if he has wronged you in any way or owes you anything[a], charge this to me.
translation:
  language: pt
  text: Mas, se ele lhe fez alguma injustiça ou lhe deve alguma coisa, ponha isso na minha conta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “debite isso na minha conta”. O verbo tem sentido contábil: lançar ou debitar algo na conta de alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Mas, se
  rationale: A conjunção εἰ introduz a condição, e δέ marca uma transição levemente contrastiva em relação ao pedido anterior.
- source_word: τι ἠδίκησέν σε
  choice: ele lhe causou algum dano
  rationale: ἀδικέω abrange fazer injustiça, prejudicar ou lesar. A formulação preserva a amplitude do possível dano sem especificar se foi pessoal ou material.
- source_word: ἢ ὀφείλει
  choice: ou lhe deve alguma coisa
  rationale: ὀφείλω indica dívida ou obrigação; o objeto indireto é explicitado naturalmente em português a partir de σε e do contexto.
- source_word: τοῦτο ἐμοὶ ἐλλόγα
  choice: ponha isso na minha conta
  rationale: ἐλλογέω é um termo de contabilidade que significa lançar ou debitar algo na conta de alguém. A expressão portuguesa comunica com clareza a metáfora financeira.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O tratamento por “lhe” evita regionalizar excessivamente o texto; “ponha isso na minha conta” conserva de modo natural a imagem contábil do original.
