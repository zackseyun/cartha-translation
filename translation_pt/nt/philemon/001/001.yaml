source:
  edition: SBLGNT
  text: Παῦλος δέσμιος Χριστοῦ Ἰησοῦ καὶ Τιμόθεος ὁ ἀδελφὸς Φιλήμονι τῷ ἀγαπητῷ καὶ συνεργῷ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/001.yaml
  text: Paul[a], a prisoner of Messiah Jesus, and Timothy our brother, to Philemon our beloved fellow worker[b],
translation:
  language: pt
  text: Paulo, prisioneiro do Messias Jesus[a][b], e Timóteo, nosso irmão, a Filemom, nosso amado cooperador,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prisioneiro por causa do Messias Jesus”. O genitivo grego pode indicar tanto relação com o Messias Jesus quanto a causa da prisão.
    reason: alternative_reading
  - marker: b
    text: 'Grego: “Cristo”. Aqui, Χριστός é traduzido por “Messias” por funcionar como título.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσμιος
  choice: prisioneiro
  rationale: O substantivo designa alguém preso ou acorrentado. “Prisioneiro” é a forma mais clara e natural em português, sem explicitar no texto principal se o genitivo indica pertencimento, relação ou causa.
- source_word: Χριστοῦ
  choice: Messias
  rationale: Aqui Χριστός conserva sua força de título. “Messias” traduz o sentido do termo grego, enquanto “Cristo” é registrado em nota como alternativa tradicional.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Forma portuguesa consagrada do nome pessoal.
- source_word: ὁ ἀδελφὸς
  choice: nosso irmão
  rationale: Embora o grego diga literalmente “o irmão”, o possessivo implícito no vínculo comunitário é expresso naturalmente em português por “nosso irmão”.
- source_word: Φιλήμονι
  choice: a Filemom
  rationale: O dativo identifica o destinatário da saudação epistolar e é vertido naturalmente com a preposição “a”.
- source_word: ἀγαπητῷ
  choice: amado
  rationale: Preserva a expressão calorosa de afeto do original e seu registro comunitário.
- source_word: συνεργῷ
  choice: cooperador
  rationale: Expressa de modo conciso alguém que trabalha junto com outros, mantendo a conotação de labor compartilhado.
- source_word: ἡμῶν
  choice: nosso
  rationale: Mantém o plural do original, coerente com Paulo e Timóteo apresentados conjuntamente na saudação.
theological_decisions:
- issue: Sentido do genitivo Χριστοῦ Ἰησοῦ após δέσμιος
  choice: do Messias Jesus
  alternative: por causa do Messias Jesus
  rationale: A construção compacta preserva a ambiguidade do genitivo grego, que pode indicar relação ou causa. A leitura causal é apresentada em nota, sem ser imposta no texto.
- issue: Tradução de Χριστός na saudação
  choice: Messias
  alternative: Cristo
  rationale: O termo funciona aqui como título ligado a Jesus; por isso, traduz-se seu valor semântico por “Messias”, mantendo “Cristo” como alternativa lexical tradicional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem titular “Messias Jesus” acompanha de perto Χριστοῦ Ἰησοῦ e preserva o valor de título, embora seja mais marcada em português do que a fórmula tradicional “Cristo Jesus”.
