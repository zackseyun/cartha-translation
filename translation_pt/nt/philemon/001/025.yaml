  text: Ἡ χάρις τοῦ ⸀κυρίου Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/025.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a][b].
translation:
  language: pt
  text: A graça do Senhor Jesus Cristo esteja com o espírito de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “De vocês” está no plural no grego, mostrando que a bênção final se estende a todos os destinatários da carta, e não somente a Filemom.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: graça
  rationale: Termo paulino consagrado para o favor gracioso e a bênção procedentes de Deus; é natural e teologicamente adequado em português.
- source_word: κυρίου
  choice: Senhor
  rationale: Preserva o título cristológico e corresponde ao uso de κύριος nesta bênção final.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus Cristo
  rationale: Em português, “Jesus Cristo” é a forma corrente, clara e digna; embora Χριστός tenha origem titular, nesta fórmula também funciona como designação consolidada, sem exigir a substituição por “Messias”.
- source_word: μετὰ
  choice: esteja com
  rationale: O grego traz a preposição “com” numa oração sem verbo explícito; “esteja” é naturalmente suprido em português para expressar a bênção.
- source_word: πνεύματος
  choice: espírito
  rationale: A minúscula evita identificar explicitamente o termo com o Espírito Santo; o possessivo favorece a referência ao espírito ou ser interior dos destinatários.
- source_word: ὑμῶν
  choice: de vocês
  rationale: Torna explícito em português moderno que o pronome grego está no plural e que a bênção alcança o conjunto dos destinatários.
theological_decisions:
- issue: Valor de Χριστοῦ na bênção final
  choice: Cristo
  alternative: Messias
  rationale: Χριστός conserva sua origem como título, mas na fórmula “Senhor Jesus Cristo” funciona em português como designação cristológica estabelecida. “Cristo” preserva a linguagem bíblica corrente sem reduzir necessariamente o termo a sobrenome.
- issue: Referente de πνεύματος em “com o espírito de vocês”
  choice: espírito humano ou ser interior dos destinatários
  alternative: Espírito Santo
  rationale: O possessivo plural “de vocês” favorece o espírito dos destinatários. A tradução mantém “espírito” em minúscula e não acrescenta uma identificação doutrinária ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A explicitação do plural por “de vocês” reproduz diretamente uma distinção presente no grego; “esteja” completa de modo idiomático a oração nominal da bênção.
