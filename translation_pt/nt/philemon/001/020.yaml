source:
  edition: SBLGNT
  text: ναί, ἀδελφέ, ἐγώ σου ὀναίμην ἐν κυρίῳ· ἀνάπαυσόν μου τὰ σπλάγχνα ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/020.yaml
  text: Yes[a], brother, let me have benefit from you in the Lord[c][b]; refresh my heart in Messiah.
translation:
  language: pt
  text: Sim, irmão, que eu seja beneficiado por você no Senhor[a]; dê alívio ao meu coração[b] no Messias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que eu tenha proveito de você” ou “que eu receba alegria de você”. Paulo talvez esteja fazendo um jogo de palavras entre o nome Onésimo e a ideia de utilidade ou benefício.
    reason: lexical_alternative
  - marker: b
    text: Em grego, literalmente “minhas partes internas”, expressão idiomática que indica os afetos profundos ou o ser interior.
    reason: lexical_alternative
  - marker: c
    text: Ou “em Cristo”. O título grego Χριστός é traduzido aqui por “Messias” para preservar seu sentido titular.
    reason: alternative_reading
lexical_decisions:
- source_word: ναί
  choice: Sim
  rationale: Introduz uma afirmação calorosa e reforça o apelo de Paulo de maneira natural em português.
- source_word: ἀδελφέ
  choice: irmão
  rationale: Vocativo singular dirigido a Filemom como irmão na fé; preserva corretamente o gênero e o tom pessoal.
- source_word: ἐγώ σου ὀναίμην
  choice: que eu seja beneficiado por você
  rationale: Expressa o valor optativo e o sentido de receber benefício ou proveito, evitando a conotação exploradora que 'tirar proveito de você' pode ter em português. A formulação também permite indicar em nota o provável jogo de palavras com o nome Onésimo.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Expressão paulina que situa o pedido na esfera da relação comum com o Senhor; é idiomática e reverente em português.
- source_word: ἀνάπαυσόν
  choice: reanime
  rationale: Imperativo que pede alívio e renovação concreta; 'reanime' comunica naturalmente a ideia de dar descanso ou refrigério e mantém a ligação temática com Filemom 1:7.
- source_word: μου τὰ σπλάγχνα
  choice: meu coração
  rationale: O plural grego significa literalmente 'minhas partes internas', mas funciona como expressão idiomática para os afetos profundos ou o ser interior; 'meu coração' é o equivalente natural em português.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Preserva o valor titular de Χριστός e apresenta a ação como realizada na esfera da comunhão messiânica.
theological_decisions:
- issue: Tradução de Χριστῷ
  choice: Messias
  alternative: Cristo
  rationale: O termo conserva aqui força titular; 'Messias' torna esse sentido explícito, enquanto 'Cristo' permanece uma tradução tradicional possível e é registrado em nota.
- issue: Tradução de κυρίῳ
  choice: Senhor
  alternative: Mestre
  rationale: No uso paulino desta expressão, 'Senhor' preserva o título reverente e evita introduzir indevidamente uma ênfase específica na relação senhor-escravo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção passiva em “seja beneficiado por você” preserva o sentido do optativo grego sem sugerir exploração. “Reanime meu coração” mantém o tom afetivo e pastoral do pedido.
