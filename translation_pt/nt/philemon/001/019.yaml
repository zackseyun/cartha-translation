source:
  edition: SBLGNT
  text: ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί, ἐγὼ ἀποτίσω· ἵνα μὴ λέγω σοι ὅτι καὶ σεαυτόν μοι προσοφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/019.yaml
  text: 'I[a], Paul, write this with my own hand: I will repay it—not to mention to you that you owe me even your very self.'
translation:
  language: pt
  text: 'Eu, Paulo, escrevo isto de próprio punho: eu pagarei — sem falar de que você me deve até a sua própria pessoa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Eu, Paulo, escrevi isto de próprio punho: eu pagarei, para não lhe dizer que você ainda me deve a sua própria pessoa.”'
    reason: Registra o valor formal do aoristo ἔγραψα, uma representação mais literal da construção retórica ἵνα μὴ λέγω σοι e a possível nuance adicional de προσοφείλεις.
lexical_decisions:
- source_word: ἔγραψα
  choice: escrevo
  rationale: Embora seja formalmente um aoristo (“escrevi”), o presente epistolar é natural em português quando Paulo chama atenção para o que escreve de próprio punho diante do leitor.
- source_word: τῇ ἐμῇ χειρί
  choice: de próprio punho
  rationale: Expressão portuguesa idiomática que indica escrita autógrafa e ressalta a garantia pessoal de Paulo.
- source_word: ἀποτίσω
  choice: eu pagarei
  rationale: O futuro promete quitar a dívida ou o prejuízo mencionado no versículo anterior; “pagarei” é conciso e adequado ao contexto financeiro.
- source_word: ἵνα μὴ λέγω σοι
  choice: Isso para não dizer
  rationale: A oração tem força retórica e levemente irônica, não uma simples finalidade; a formulação preserva a menção indireta que Paulo, na realidade, faz.
- source_word: σεαυτόν
  choice: a si mesmo
  rationale: Mantém a referência reflexiva à própria pessoa de Filemom, enquanto “até” expressa a ênfase de καί.
- source_word: προσοφείλεις
  choice: me deve
  rationale: Forma clara e corrente; o componente adicional do verbo é comunicado no contexto por “até a si mesmo”.
theological_decisions:
- issue: Natureza da dívida de Filemom para com Paulo
  choice: Manter a dívida pessoal em linguagem metafórica, sem definir sua causa exata.
  alternative: Explicitar que Filemom deve a Paulo sua conversão, salvação ou vida.
  rationale: O grego afirma uma dívida profunda, mas não especifica se se trata da conversão de Filemom, de sua vida física ou de outra obrigação pessoal. A tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “De próprio punho” preserva a solenidade natural da garantia autógrafa; “você” oferece clareza contemporânea sem regionalismo excessivo.
