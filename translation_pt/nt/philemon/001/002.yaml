  source_fidelity: A tradução mantém os destinatários, a leitura crítica “a irmã” (sem acrescentar “nossa”) e a coordenação da saudação. Contudo, “que se reúne em sua casa” explicita uma ideia provável, mas não expressa diretamente no grego κατ’ οἶκόν σου; a formulação mais próxima é “em sua casa”. “Companheiro de luta” preserva apenas de modo geral a metáfora, enquanto συστρατιώτῃ designa especificamente um companheiro de armas/soldado თანამ.
  naturalness: A redação é clara e de registro apropriado. “Companheiro de armas” é uma expressão corrente e natural, preservando melhor a imagem militar do original. “Igreja em sua casa” é conciso e idiomático no contexto epistolar.
  terminology: “Áfia”, “Arquipo”, “irmã” e “igreja” são escolhas adequadas. “Companheiro de armas” traduz com maior precisão συστρατιώτῃ sem impor interpretação doutrinária. A nota textual está corretamente vinculada a Áfia/“irmã” e descreve adequadamente a variante.
