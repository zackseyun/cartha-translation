  - severity: medium
    issue: “companheiro de luta” enfraquece a imagem militar específica de συστρατιώτῃ.
    rationale: O composto significa literalmente alguém que é companheiro de serviço militar. “Companheiro de armas” conserva essa metáfora de forma natural em português.
