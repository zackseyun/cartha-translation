source:
  edition: SBLGNT
  text: καὶ Ἀπφίᾳ τῇ ⸀ἀδελφῇ καὶ Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν καὶ τῇ κατ’ οἶκόν σου ἐκκλησίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/002.yaml
  text: 'and to Apphia our sister[a], and to Archippus our fellow soldier, and to the church in your house:'
translation:
  language: pt
  text: 'e à irmã Áfia,[a] a Arquipo, nosso companheiro de armas, e à igreja em sua casa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “nossa irmã” em vez de “a irmã”.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπφίᾳ
  choice: Áfia
  rationale: Nome pessoal transliterado segundo a forma portuguesa corrente, com acento para indicar a pronúncia natural.
- source_word: ἀδελφῇ
  choice: irmã
  rationale: Preserva o substantivo de parentesco cristão sem acrescentar o possessivo “nossa”, ausente no texto da SBLGNT apresentado.
- source_word: Ἀρχίππῳ
  choice: Arquipo
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: συστρατιώτῃ
  choice: companheiro de luta
  rationale: Mantém a metáfora militar do termo composto grego e soa mais natural em português contemporâneo do que uma tradução excessivamente literal.
- source_word: ἐκκλησίᾳ
  choice: igreja
  rationale: Neste contexto epistolar, designa naturalmente a comunidade cristã reunida.
- source_word: κατ’ οἶκόν σου
  choice: que se reúne em sua casa
  rationale: Explicita o sentido idiomático de uma comunidade cuja reunião ocorre na casa do destinatário, evitando a possível impressão de que se trata de um edifício religioso situado nela.
- source_word: καὶ
  choice: e
  rationale: Mantém a estrutura aditiva da saudação.
theological_decisions:
- issue: Acrescentar ou não o possessivo a ἀδελφῇ
  choice: irmã
  alternative: nossa irmã
  rationale: O texto grego fornecido traz τῇ ἀδελφῇ, sem ἡμῶν. A tradução principal segue essa leitura, enquanto a variante com o possessivo é registrada em nota.
- issue: Natureza da ἐκκλησία na casa
  choice: igreja que se reúne em sua casa
  alternative: igreja em sua casa
  rationale: A formulação escolhida comunica que se trata da comunidade reunida no lar, sem transformar a expressão em referência inequívoca a um edifício.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, sem regionalismos marcados. A repetição das conjunções preserva o ritmo enumerativo da saudação; “companheiro de luta” conserva a imagem militar de modo idiomático.
