source:
  edition: SBLGNT
  text: ⸀χαρὰν γὰρ ⸂πολλὴν ἔσχον⸃ καὶ παράκλησιν ἐπὶ τῇ ἀγάπῃ σου, ὅτι τὰ σπλάγχνα τῶν ἁγίων ἀναπέπαυται διὰ σοῦ, ἀδελφέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/007.yaml
  text: For I had much joy and encouragement because of your love[a], because the hearts of the saints have been refreshed through you, brother.
translation:
  language: pt
  text: Pois tive grande alegria e encorajamento por causa do seu amor, pois os corações[a] dos santos estão revigorados por meio de você, irmão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “o íntimo” ou “os afetos profundos” dos santos.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαρὰν
  choice: alegria
  rationale: Equivalente corrente e natural para χαρά, preservando a expressão afetiva de Paulo.
- source_word: πολλὴν ἔσχον
  choice: tive grande
  rationale: O aoristo de ἔχω descreve aqui a experiência de Paulo; em português, “tive grande alegria” é mais idiomático do que “tive muita alegria” neste registro.
- source_word: παράκλησιν
  choice: encorajamento
  rationale: No contexto, παράκλησις comunica o ânimo que Paulo recebeu ao saber dos efeitos do amor de Filemom; “encorajamento” preserva melhor esse sentido ativo, embora “consolo” também seja possível.
- source_word: ἐπὶ τῇ ἀγάπῃ σου
  choice: por causa do seu amor
  rationale: 'ἐπί com dativo tem aqui sentido causal: o amor de Filemom é o motivo da alegria e do encorajamento de Paulo.'
- source_word: σπλάγχνα
  choice: corações
  rationale: O termo designa literalmente os órgãos internos e, como expressão idiomática, o íntimo ou os afetos profundos. “Corações” comunica esse sentido de forma natural, enquanto a nota preserva a imagem original.
- source_word: τῶν ἁγίων
  choice: dos santos
  rationale: Mantém a designação paulina dos que pertencem a Deus, sem substituí-la por uma paráfrase interpretativa.
- source_word: ἀναπέπαυται
  choice: foram reanimados
  rationale: O perfeito indica um alívio ou renovação produzidos no passado e ainda relevantes. “Foram reanimados” expressa naturalmente o efeito restaurador no íntimo dos santos.
- source_word: διὰ σοῦ
  choice: por meio de você
  rationale: διά com genitivo indica meio ou agência; a formulação conserva essa nuance e é clara em português internacional com boa legibilidade brasileira.
- source_word: ἀδελφέ
  choice: irmão
  rationale: Preserva o vocativo familiar e comunitário sem acrescentar um qualificativo ausente do grego.
theological_decisions:
- issue: Sentido comunitário de ἅγιοι
  choice: santos
  alternative: povo de Deus; aqueles que pertencem a Deus
  rationale: “Santos” preserva a linguagem eclesial de Paulo, na qual os fiéis são separados para Deus, sem implicar a noção posterior de canonização.
- issue: Expressão antropológica σπλάγχνα
  choice: corações
  alternative: íntimo; afetos profundos
  rationale: A expressão se refere à vida interior e aos afetos profundos, não à anatomia em sentido estrito. “Corações” transmite a força pastoral da imagem, e a nota registra sua amplitude lexical.
translation_notes:
  register: Português moderno, digno e acessível, com formulação amplamente internacional e natural para leitores brasileiros. O pronome “você” oferece clareza contemporânea; “por meio de você” preserva a agência expressa no grego. A posição da nota foi ligada a “corações”, o termo a que ela efetivamente se refere.
