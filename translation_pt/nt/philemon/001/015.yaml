  text: τάχα γὰρ διὰ τοῦτο ἐχωρίσθη πρὸς ὥραν ἵνα αἰώνιον αὐτὸν ἀπέχῃς,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/015.yaml
  text: For perhaps he was separated from you for a time so that you might have him back forever,[a]
translation:
  language: pt
  text: Pois talvez ele tenha sido separado de você por algum tempo, para que você o tenha de volta para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele se afastou de você por algum tempo”. A forma passiva grega, “foi separado”, pode evitar delicadamente a atribuição direta de culpa e também deixar implícita a possibilidade de um propósito divino.'
    reason: alternative_reading
lexical_decisions:
- source_word: τάχα
  choice: talvez
  rationale: Preserva a inferência cautelosa e modesta de Paulo, sem apresentá-la como certeza.
- source_word: γὰρ
  choice: pois
  rationale: Mantém de modo natural a ligação explicativa com o versículo anterior.
- source_word: διὰ τοῦτο
  choice: por isso
  rationale: Expressa a ideia de razão ou propósito sem tornar explícito um agente que o grego deixa implícito.
- source_word: ἐχωρίσθη
  choice: ficou separado
  rationale: Conserva a forma passiva e sua delicada ambiguidade quanto à agência, evitando atribuir diretamente a ação a Deus ou a Onésimo.
- source_word: πρὸς ὥραν
  choice: por algum tempo
  rationale: Traduz a expressão idiomática como um período limitado e sustenta o contraste com 'para sempre'.
- source_word: ἵνα
  choice: para que
  rationale: Marca com clareza propósito ou resultado pretendido.
- source_word: αἰώνιον
  choice: para sempre
  rationale: O adjetivo tem valor adverbial neste contexto e contrasta a separação temporária com uma restauração duradoura, sem excluir possíveis ressonâncias espirituais.
- source_word: αὐτὸν
  choice: o
  rationale: Pronome objeto que se refere a Onésimo.
- source_word: ἀπέχῃς
  choice: você o tivesse de volta
  rationale: Comunica em português corrente a ideia contextual de voltar a ter ou receber Onésimo, preservando o tom relacional.
theological_decisions:
- issue: Agência implícita na forma passiva ἐχωρίσθη
  choice: Manter a construção passiva, 'ficou separado', sem nomear o agente.
  alternative: “ele se afastou” ou “Deus o separou”
  rationale: A formulação de Paulo pode insinuar providência divina e, ao mesmo tempo, evitar atribuir culpa direta. A tradução mantém essa tensão sem resolvê-la.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. 'Ficou separado' soa mais natural que 'foi separado' neste contexto e ainda preserva a ambiguidade do passivo grego. A pontuação com dois-pontos torna clara a relação de propósito sem eliminar a cautela expressa por 'talvez'.
