base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
translation:
  language: pt
  text: 'dizendo: “Mestre, Moisés disse: ‘Se um homem morrer sem filhos, o irmão dele deverá casar-se[a] com a viúva e gerar descendência em favor de seu irmão falecido.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “cumprir para com a viúva o dever de irmão do marido”. O verbo grego se refere especificamente ao casamento levirático.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: Forma natural e digna de tratamento para Jesus como instrutor; em português, “Mestre” comunica esse sentido com clareza.
- source_word: Ἐάν τις ἀποθάνῃ
  choice: Se um homem morrer
  rationale: O caso legal trata especificamente de um homem falecido e de seu irmão; a formulação preserva os papéis masculinos presentes no contexto da lei do levirato.
- source_word: μὴ ἔχων τέκνα
  choice: sem ter filhos
  rationale: τέκνα designa filhos de modo amplo, sem restringir o sentido a filhos homens; a expressão também conserva de modo natural a construção participial.
- source_word: ἐπιγαμβρεύσει
  choice: deverá casar-se
  rationale: O verbo indica contrair casamento levirático com a viúva do irmão. A tradução apresenta o sentido central, enquanto a nota explicita a força técnica.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: com a viúva
  rationale: Embora o grego diga literalmente “com a mulher dele”, no contexto ela já é a viúva do falecido; “a viúva” evita ambiguidade referencial sem alterar o sentido.
- source_word: ἀναστήσει σπέρμα
  choice: gerar descendência
  rationale: A expressão idiomática significa produzir descendência que dê continuidade à linhagem do falecido. “Gerar descendência” é clara e conserva a dimensão procriativa.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: para seu irmão
  rationale: 'O dativo indica benefício ou referência: a descendência seria reconhecida em favor do irmão falecido.'
theological_decisions:
- issue: Formulação do caso legal em termos de gênero
  choice: “um homem” e “o irmão dele”
  alternative: “alguém” e “o irmão dessa pessoa”
  rationale: A citação da lei mosaica descreve papéis familiares masculinos específicos no casamento levirático; preservá-los evita neutralizar o sentido contextual.
- issue: Identidade da mulher mencionada
  choice: “a viúva”
  alternative: “a mulher dele”
  rationale: O referente é a esposa do homem que morreu. A escolha torna explícita uma relação já determinada pelo contexto, sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é claro e digno; “deverá” preserva a força normativa da citação legal, e a nota mantém disponível o sentido técnico de ἐπιγαμβρεύσει.
