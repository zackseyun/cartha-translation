id: MAT.22.18
reference: Matthew 22:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπεν· Τί με πειράζετε, ὑποκριταί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: pt
  text: 'Jesus, porém, percebendo a má intenção deles[a], disse: “Por que vocês estão me pondo à prova[b], hipócritas?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a maldade deles” ou “a malícia deles”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Por que vocês estão me tentando?” O verbo grego pode significar “pôr à prova”, “testar” ou “tentar”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: percebendo
  rationale: O particípio aoristo de γινώσκω indica que Jesus reconheceu claramente o motivo oculto deles antes de responder. “Percebendo” é natural em português e não acrescenta uma explicação doutrinária ao texto.
- source_word: δὲ
  choice: porém
  rationale: A partícula marca aqui uma leve contraposição entre a abordagem enganosa dos interlocutores e a percepção de Jesus. A posição pós-nominal de “porém” preserva um fluxo narrativo natural.
- source_word: πονηρίαν
  choice: má intenção
  rationale: πονηρία pode significar maldade, perversidade ou malícia. Neste contexto, refere-se especialmente ao propósito hostil por trás da pergunta, por isso “má intenção” comunica com clareza sua força contextual sem negar o sentido moral do termo.
- source_word: εἶπεν
  choice: disse
  rationale: É a tradução narrativa comum e direta do aoristo de λέγω.
- source_word: Τί
  choice: Por que
  rationale: Neste uso idiomático, τί introduz uma pergunta sobre a razão da ação. “Por que” é a formulação natural em português.
- source_word: πειράζετε
  choice: estão me pondo à prova
  rationale: πειράζω pode significar testar, provar ou tentar. A expressão “pôr à prova” preserva essa amplitude e, no contexto, comunica a tentativa deliberada de apanhar Jesus em uma armadilha.
- source_word: ὑποκριταί
  choice: hipócritas
  rationale: “Hipócritas” é o equivalente estabelecido e adequado para pessoas que fingem sinceridade enquanto ocultam intenções hostis.
theological_decisions:
- issue: A percepção de Jesus acerca do motivo interior de seus opositores
  choice: Jesus percebe a má intenção deles.
  alternative: Jesus conhece a maldade ou a malícia deles.
  rationale: O versículo afirma que Jesus reconheceu corretamente o caráter moral e o propósito oculto da abordagem deles. A formulação mantém essa afirmação sem ampliá-la para uma proposição doutrinária que ultrapasse o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” torna explícito o plural presente na forma verbal grega; “estão me pondo à prova” soa natural e mantém a ambiguidade lexical relevante de πειράζω.
