lexical_decisions:
- source_word: λέγει
  choice: perguntou
  rationale: Embora o grego use o presente histórico, o pretérito é natural na narrativa em português. O verbo foi vertido como “perguntou” porque a fala introduz uma pergunta, sem alterar seu conteúdo.
- source_word: αὐτοῖς
  choice: lhes
  rationale: O pronome dativo plural indica os destinatários da fala; “lhes” é uma forma concisa e natural em português.
- source_word: Τίνος
  choice: De quem
  rationale: O interrogativo no genitivo pergunta pela pertença ou associação. “De quem” preserva diretamente essa força.
- source_word: εἰκών
  choice: imagem
  rationale: “Imagem” é a equivalência habitual e adequada para a figura estampada na moeda, sem especificar além do texto.
- source_word: αὕτη
  choice: esta
  rationale: O demonstrativo aponta para a imagem presente na moeda mostrada a Jesus.
- source_word: ἐπιγραφή
  choice: inscrição
  rationale: “Inscrição” designa com precisão e clareza o texto gravado na moeda.
- source_word: καὶ
  choice: e
  rationale: 'A conjunção coordena os dois elementos perguntados: a imagem e a inscrição.'
