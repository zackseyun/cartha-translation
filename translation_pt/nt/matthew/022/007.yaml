  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: pt
  text: Mas o rei ficou irado e enviou suas tropas, destruiu aqueles assassinos e incendiou a cidade deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: ficou irado
  rationale: Expressa de modo natural e digno o ingresso no estado de ira indicado pelo aoristo passivo de sentido intransitivo.
- source_word: τὰ στρατεύματα αὐτοῦ
  choice: suas tropas
  rationale: Mantém o sentido coletivo de forças militares sob a autoridade do rei, em linguagem corrente.
- source_word: ἀπώλεσεν
  choice: destruiu
  rationale: Preserva a força do verbo no contexto de ação militar punitiva, sem atenuá-lo para apenas 'matou'.
- source_word: τοὺς φονεῖς ἐκείνους
  choice: aqueles assassinos
  rationale: Traduz diretamente a designação enfática dos responsáveis pelas mortes.
- source_word: ἐνέπρησεν
  choice: incendiou
  rationale: Comunica com precisão que o rei fez a cidade arder, em formulação natural no português moderno.
theological_decisions:
- issue: Referência parabólica do rei e do juízo
  choice: Manter a narrativa sem explicitar a identidade simbólica do rei nem o referente histórico da cidade.
  alternative: Acrescentar linguagem interpretativa que identifique diretamente o rei com Deus e a cidade com Jerusalém.
  rationale: O versículo apresenta esses elementos dentro da parábola; a tradução deve conservar sua forma e permitir que a interpretação decorra do contexto, sem inserir uma leitura teológica específica no texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A coordenação verbal reproduz a sequência direta das ações no grego sem tornar a frase artificial.
