  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους λέγων· Εἴπατε τοῖς κεκλημένοις· Ἰδοὺ τὸ ἄριστόν μου ⸀ἡτοίμακα, οἱ ταῦροί μου καὶ τὰ σιτιστὰ τεθυμένα, καὶ πάντα ἕτοιμα· δεῦτε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/004.yaml
  text: Again he sent other slaves[a], saying, ‘Tell those who have been invited, “Look, I have prepared my dinner; my oxen and my fattened cattle have been slaughtered, and everything is ready[c][b]. Come to the wedding feast.”’
translation:
  language: pt
  text: 'Ele enviou novamente outros escravos[a], dizendo: “Digam aos convidados: ‘Vejam, preparei o meu banquete[b]. Meus bois e meus animais cevados já foram abatidos, e tudo está pronto. Venham para a festa de casamento[c]’”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “outros servos”. A palavra grega doulous pode significar “servos” ou “escravos”, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “minha refeição”. O termo grego se refere a uma refeição preparada, muitas vezes realizada mais cedo no dia.
    reason: lexical_alternative
  - marker: c
    text: Ou simplesmente “para o casamento”. O plural grego pode se referir às celebrações do casamento como um todo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἀπέστειλεν
  choice: Ele enviou novamente
  rationale: Expressa de modo natural a repetição indicada por πάλιν e o aoristo narrativo de ἀποστέλλω.
- source_word: ἄλλους δούλους
  choice: outros escravos
  rationale: No contexto da casa de um rei, δοῦλοι designa pessoas sob domínio e autoridade, não meros empregados; “escravos” preserva essa realidade social. A alternativa “servos” consta em nota.
- source_word: Εἴπατε τοῖς κεκλημένοις
  choice: Digam aos convidados
  rationale: O particípio perfeito passivo identifica aqueles que já haviam recebido o convite; “aos convidados” comunica isso de forma concisa e idiomática.
- source_word: Ἰδοὺ
  choice: Vejam
  rationale: Partícula que chama a atenção dos destinatários; o plural concorda naturalmente com o grupo interpelado.
- source_word: τὸ ἄριστόν μου ἡτοίμακα
  choice: preparei o meu banquete
  rationale: ἄριστον é uma refeição preparada, muitas vezes tomada mais cedo no dia; no contexto nupcial, “banquete” comunica melhor a refeição festiva sem impor um horário específico.
- source_word: οἱ ταῦροί μου καὶ τὰ σιτιστὰ
  choice: meus bois e meus animais cevados
  rationale: “Bois” representa naturalmente ταῦροι; “animais cevados” mantém a generalidade substantivada de σιτιστά sem acrescentar “bezerros”, ausente do grego.
- source_word: τεθυμένα
  choice: já foram abatidos
  rationale: O perfeito passivo indica abate concluído com resultado presente. “Abatidos” evita a possível conotação cultual de “sacrificados”.
- source_word: καὶ πάντα ἕτοιμα
  choice: e tudo está pronto
  rationale: Tradução direta, clara e idiomática, preservando a abrangência de πάντα.
- source_word: δεῦτε εἰς τοὺς γάμους
  choice: Venham para a festa de casamento
  rationale: δεῦτε é um convite no plural; γάμοι, também no plural, pode designar as celebrações nupciais como um todo.
theological_decisions:
- issue: Sentido de δοῦλος na casa real da parábola
  choice: escravos
  alternative: servos
  rationale: A condição de sujeição é relevante no cenário de uma casa real. A tradução preserva a realidade social do termo sem lhe acrescentar uma aplicação teológica; a alternativa mais tradicional é registrada em nota.
- issue: Alcance de τοὺς γάμους
  choice: festa de casamento
  alternative: casamento
  rationale: O plural grego pode abranger as celebrações nupciais, mas não exige separar rigidamente a festa do casamento; a nota preserva a formulação mais literal e abrangente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o discurso direto em camadas e emprega “cevados”, termo preciso e ainda corrente para animais especialmente engordados.
