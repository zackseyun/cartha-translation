  text: πορεύεσθε οὖν ἐπὶ τὰς διεξόδους τῶν ὁδῶν, καὶ ὅσους ⸀ἐὰν εὕρητε καλέσατε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/009.yaml
  text: Therefore go to the street intersections[b][a], and invite to the wedding feast as many as you find.
translation:
  language: pt
  text: Portanto, vão às encruzilhadas[a] e convidem para a festa de casamento[b] todos os que encontrarem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos cruzamentos” ou “às saídas dos caminhos”; o grego se refere a lugares onde os caminhos se encontram, se ramificam ou terminam.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para as bodas”; neste contexto, a expressão grega se refere à celebração ou ao banquete de casamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: vão
  rationale: O imperativo presente tem força de ordem direta; “vão” é natural, claro e mantém o plural dirigido aos servos.
- source_word: οὖν
  choice: portanto
  rationale: Marca a conclusão decorrente da ordem anterior e preserva explicitamente a relação lógica.
- source_word: ἐπὶ τὰς διεξόδους τῶν ὁδῶν
  choice: às encruzilhadas
  rationale: A expressão designa lugares onde caminhos se encontram, se ramificam ou têm saídas. “Encruzilhadas” é uma equivalência portuguesa corrente e preserva a amplitude espacial sem impor um cenário urbano moderno.
- source_word: ὅσους ἐὰν εὕρητε
  choice: todos os que encontrarem
  rationale: Reproduz a abrangência indefinida da construção grega e soa mais natural em português do que uma formulação quantitativa rígida.
- source_word: καλέσατε
  choice: convidem
  rationale: No contexto de uma celebração nupcial, καλέω significa convidar, não apenas chamar em voz alta.
- source_word: εἰς τοὺς γάμους
  choice: para a festa de casamento
  rationale: O plural idiomático γάμοι refere-se à celebração ou ao banquete nupcial, não a vários casamentos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural verbal explícito preserva que a ordem é dirigida a mais de um servo; “encruzilhadas” evita a modernização excessiva de “interseções de ruas”.
