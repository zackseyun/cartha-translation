id: MAT.22.16
reference: Matthew 22:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρῳδιανῶν ⸀λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ τὴν ὁδὸν τοῦ θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/016.yaml
  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: pt
  text: 'E enviam a ele os seus discípulos, junto com os herodianos, dizendo: “Mestre, sabemos que és verdadeiro, que ensinas o caminho de Deus conforme a verdade e que não te deixas influenciar por ninguém, pois não fazes distinção entre as pessoas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: enviam
  rationale: Preserva o presente histórico grego, que torna viva a sequência narrativa, e soa natural em português nesse contexto.
- source_word: μαθητὰς
  choice: discípulos
  rationale: É o termo corrente e contextualmente adequado para seguidores e aprendizes no relato dos Evangelhos.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: junto com os herodianos
  rationale: Expressa claramente a associação indicada por μετά com genitivo, sem explicar além do texto a identidade ou a função do grupo.
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: É a forma de tratamento tradicional e natural em português para um ensinador, sem exigir uma paráfrase.
- source_word: ἀληθὴς
  choice: verdadeiro
  rationale: Preserva a descrição ampla do caráter de Jesus; pode envolver veracidade e autenticidade, sem restringir o sentido apenas a 'sincero'.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: o caminho de Deus
  rationale: Mantém a metáfora da fonte, que pode abranger ensino, conduta e orientação segundo Deus.
- source_word: ἐν ἀληθείᾳ
  choice: conforme a verdade
  rationale: Comunica de modo natural que o ensino está em plena conformidade com a verdade, preservando a relação explícita com ἀλήθεια.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: não te deixas influenciar por ninguém
  rationale: 'Transmite a força contextual do idioma: Jesus não é condicionado pela opinião, posição ou pressão de pessoa alguma. Evita a impressão enganosa de que ele não se importa com as pessoas.'
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: pois não fazes distinção entre as pessoas
  rationale: Traduz idiomaticamente a ideia de não favorecer ou avaliar alguém segundo sua posição ou aparência; 'pessoas' representa naturalmente o plural genérico ἀνθρώπων.
theological_decisions:
- issue: Imparcialidade diante da condição humana
  choice: não te deixas influenciar por ninguém, pois não fazes distinção entre as pessoas
  alternative: não te importas com ninguém, pois não olhas para o rosto dos seres humanos
  rationale: 'A formulação escolhida evita atribuir a Jesus indiferença moral e comunica o sentido idiomático da declaração: ele não ajusta seu ensino à influência, ao prestígio ou à aparência das pessoas. Não acrescenta uma posição doutrinária sobre grupos específicos.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se o presente histórico do grego. A fala tem fluidez natural sem perder a repetição temática de verdade/verdadeiro nem a metáfora 'caminho de Deus'.
