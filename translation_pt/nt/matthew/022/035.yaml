  text: καὶ ἐπηρώτησεν εἷς ἐξ αὐτῶν νομικὸς πειράζων ⸀αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/035.yaml
  text: And one of them, a lawyer, asked him a question, testing him.
translation:
  language: pt
  text: E um deles, especialista na Lei[a], perguntou-lhe, pondo-o à prova.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “jurista”. O termo grego se refere aqui a um especialista na Lei judaica.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém o conectivo narrativo simples do grego, sem acrescentar uma relação temporal mais específica.
- source_word: ἐπηρώτησεν
  choice: perguntou-lhe
  rationale: Expressa de modo natural e suficiente o ato de perguntar; não acrescenta o substantivo “pergunta”, ausente do texto grego.
- source_word: εἷς ἐξ αὐτῶν
  choice: um deles
  rationale: Reproduz idiomaticamente a expressão partitiva, indicando que o homem pertencia ao grupo mencionado.
- source_word: νομικὸς
  choice: especialista na Lei
  rationale: No contexto judaico, designa alguém versado na Lei de Moisés. A formulação evita que “advogado” seja entendido no sentido forense moderno.
- source_word: πειράζων αὐτόν
  choice: pondo-o à prova
  rationale: Preserva a construção participial e o sentido de testar ou provar Jesus, sem sugerir necessariamente uma tentativa de induzi-lo ao pecado.
theological_decisions:
- issue: Nuance de πειράζων em relação a Jesus
  choice: pondo-o à prova
  alternative: tentando-o
  rationale: O verbo pode indicar provar, testar ou tentar. Neste contexto, trata-se de uma abordagem destinada a submeter Jesus a uma prova; a tradução escolhida conserva a intenção adversarial sem restringir o sentido a uma tentação para o mal.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. “Lei” recebe inicial maiúscula por se referir à Lei de Moisés; a colocação pronominal mantém um tom escrito natural sem arcaísmo excessivo.
