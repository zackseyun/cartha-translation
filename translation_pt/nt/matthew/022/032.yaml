  text: Ἐγώ εἰμι ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ; οὐκ ἔστιν ⸂ὁ θεὸς⸃ νεκρῶν ἀλλὰ ζώντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/032.yaml
  text: I am the God of Abraham and the God of Isaac and the God of Jacob. He is not the God of the dead[a], but of the living.
translation:
  language: pt
  text: “Eu sou o Deus de Abraão, o Deus de Isaque e o Deus de Jacó.” Ele não é Deus dos mortos, mas dos vivos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Eu sou
  rationale: Mantém a identificação direta no presente e preserva a forma da citação, importante para o argumento de Jesus.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: o Deus de Abraão, o Deus de Isaque e o Deus de Jacó
  rationale: Conserva a repetição enfática de “o Deus” presente no grego, sem comprimir a expressão.
- source_word: οὐκ ἔστιν ὁ θεὸς
  choice: Ele não é Deus
  rationale: O pronome retoma naturalmente o Deus recém-mencionado. Em português, o predicativo “Deus de mortos” dispensa artigo e evita a formulação pouco idiomática “Deus não é o Deus”.
- source_word: νεκρῶν
  choice: mortos
  rationale: O adjetivo plural substantivado é expresso de modo conciso e natural, preservando o contraste.
- source_word: ζώντων
  choice: vivos
  rationale: O particípio presente substantivado é vertido de maneira paralela a “mortos”, mantendo a antítese breve e enfática.
theological_decisions:
- issue: Implicação de que os patriarcas continuam vivos diante de Deus no argumento de Jesus sobre a ressurreição
  choice: Traduzir a afirmação diretamente, sem explicitar uma doutrina sobre a ressurreição ou o estado intermediário.
  alternative: Ele não é Deus de pessoas mortas, mas de pessoas que continuam vivas para ele.
  rationale: A formulação preserva a força do argumento de Jesus e sua tensão teológica sem acrescentar uma explicação que não está expressa neste versículo.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição retórica da primeira frase foi preservada; a segunda usa uma construção idiomática e concisa.
