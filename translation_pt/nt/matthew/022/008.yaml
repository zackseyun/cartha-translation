source:
  edition: SBLGNT
  text: τότε λέγει τοῖς δούλοις αὐτοῦ· Ὁ μὲν γάμος ἕτοιμός ἐστιν, οἱ δὲ κεκλημένοι οὐκ ἦσαν ἄξιοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/008.yaml
  text: Then he says to his servants[a], ‘The wedding feast is ready, but those who were invited were not worthy.’
translation:
  language: pt
  text: 'Então ele diz aos seus servos: “A festa de casamento está pronta, mas os convidados[a] não eram dignos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que foram chamados”. O particípio grego pode ser traduzido mais literalmente dessa maneira, mas, neste contexto de banquete, refere-se aos convidados para a festa de casamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Adverbio temporal comum que marca a sequência narrativa de modo natural em português.
- source_word: λέγει
  choice: ele diz
  rationale: Mantém o presente histórico grego e sua vivacidade narrativa.
- source_word: δούλοις
  choice: servos
  rationale: Embora δοῦλος também possa significar “escravo”, “servos” é natural no cenário régio da parábola sem tornar o estatuto social o foco do versículo.
- source_word: Ὁ μὲν γάμος
  choice: A festa de casamento
  rationale: No contexto, γάμος designa a celebração ou banquete nupcial já preparado; a construção contrastiva μὲν...δὲ é representada por “mas”.
- source_word: ἕτοιμός ἐστιν
  choice: está pronta
  rationale: Tradução direta e idiomática do adjetivo predicativo com a cópula.
- source_word: οἱ δὲ κεκλημένοι
  choice: os convidados
  rationale: O particípio perfeito passivo de καλέω refere-se, neste contexto de banquete, às pessoas que haviam sido convidadas; a alternativa formal é preservada em nota.
- source_word: οὐκ ἦσαν ἄξιοι
  choice: não eram dignos
  rationale: Preserva a força avaliativa de ἄξιοι sem especificar indevidamente em que consistia a indignidade.
theological_decisions:
- issue: Possíveis conotações teológicas de κεκλημένοι (“chamados”)
  choice: os convidados
  alternative: os que foram chamados
  rationale: O contexto imediato aponta para os convidados anteriormente convocados à festa. “Convidados” comunica esse sentido social sem introduzir categorias teológicas de chamado ou eleição; a forma mais literal permanece em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O presente histórico foi mantido; “festa de casamento” explicita naturalmente o sentido contextual de γάμος.
