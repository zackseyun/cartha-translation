  text: πολλοὶ γάρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/014.yaml
  text: For many are called[b][a], but few are chosen.
translation:
  language: pt
  text: Pois muitos são chamados[a], mas poucos são escolhidos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “convidados”; neste contexto, a palavra pode ter o sentido de convite para um banquete.
    reason: lexical_alternative
  - marker: b
    text: Ou “eleitos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: muitos
  rationale: O adjetivo substantivado é vertido de modo conciso e preserva o contraste direto com ὀλίγοι.
- source_word: γάρ
  choice: pois
  rationale: Introduz a explicação ou fundamento do que precede; “pois” mantém essa ligação de modo natural e digno em português.
- source_word: εἰσιν
  choice: são
  rationale: Equivalente direto do presente de εἰμί e necessário nas duas construções predicativas em português.
- source_word: κλητοὶ
  choice: chamados
  rationale: Preserva tanto o sentido básico de “chamados” quanto a ressonância mais ampla do termo; no contexto do banquete, “convidados” também é possível e consta em nota.
- source_word: ὀλίγοι
  choice: poucos
  rationale: Equivalente direto que mantém o contraste breve e proverbial com “muitos”.
- source_word: δὲ
  choice: mas
  rationale: Expressa claramente o contraste entre as duas orações.
- source_word: ἐκλεκτοί
  choice: escolhidos
  rationale: Comunica o sentido lexical de forma clara no português contemporâneo sem impor uma formulação teológica técnica; “eleitos” é registrado em nota.
theological_decisions:
- issue: Tradução de ἐκλεκτοί em um texto associado a debates sobre eleição
  choice: escolhidos
  alternative: eleitos
  rationale: “Escolhidos” transmite transparentemente o sentido grego sem decidir entre sistemas doutrinários posteriores. A alternativa tradicional “eleitos” é preservada em nota.
- issue: Tradução de κλητοί no contexto da parábola do banquete
  choice: chamados
  alternative: convidados
  rationale: Embora “convidados” realce adequadamente o cenário imediato do banquete, “chamados” conserva a amplitude semântica e a tensão da formulação grega. A nota apresenta a alternativa contextual.
translation_notes:
  register: Português moderno, claro e solene, com construção breve que preserva o caráter proverbial e o paralelismo antitético do grego. A colocação dos marcadores segue imediatamente os termos a que se referem.
