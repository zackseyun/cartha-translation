  yaml_path: translation/nt/matthew/022/027.yaml
  text: Last of all[a], the woman died.
translation:
  language: pt
  text: Por último, morreu a mulher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Finalmente, morreu a mulher”; literalmente, “Depois de todos, morreu a mulher”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: Por último
  rationale: Com πάντων, indica a etapa final da sequência; “por último” é natural e mantém o sentido de “finalmente/depois de todos”.
- source_word: δὲ
  choice: incorporado à transição “Por último”
  rationale: δέ é um conectivo leve cuja força discursiva é expressa naturalmente pela locução de transição, sem exigir uma conjunção separada.
- source_word: πάντων
  choice: implícito em “Por último”
  rationale: O genitivo plural completa a ideia idiomática de ὕστερον πάντων, “por último/depois de todos”; em português, “por último” transmite a sequência sem formulação pesada.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: Tradução direta do aoristo, sem recorrer a eufemismo.
- source_word: ἡ γυνή
  choice: a mulher
  rationale: γυνή pode significar “mulher” ou “esposa”; aqui, “a mulher” preserva a formulação grega e evita vinculá-la à perspectiva de apenas um dos vários maridos.
