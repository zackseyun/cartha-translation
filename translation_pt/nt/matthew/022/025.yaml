id: MAT.22.25
reference: Matthew 22:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: pt
  text: Havia entre nós sete irmãos. O primeiro se casou e morreu; e, como não tinha descendência[a], deixou sua mulher ao seu irmão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “semente”. Aqui a palavra significa descendência ou descendentes.
    reason: lexical_alternative
  - marker: b
    text: Isso se refere ao costume do casamento levirato, segundo o qual se esperava que o irmão de um homem falecido se casasse com a viúva para suscitar descendência ao falecido; veja Deuteronômio 25:5.
    reason: cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: entre nós
  rationale: παρά com o dativo indica presença ou associação no grupo mencionado. “Entre nós” é natural em português e preserva a maneira como os saduceus apresentam o caso.
- source_word: ἑπτὰ ἀδελφοί
  choice: sete irmãos
  rationale: Neste contexto de casamento levirato, ἀδελφοί designa claramente irmãos do sexo masculino.
- source_word: ὁ πρῶτος
  choice: o primeiro
  rationale: πρῶτος indica a ordem na sequência dos sete, sem afirmar necessariamente que se tratava do mais velho.
- source_word: γήμας
  choice: se casou
  rationale: O particípio aoristo indica uma ação anterior à morte. A forma finita coordenada é natural em português e mantém a sequência dos acontecimentos.
- source_word: ἐτελεύτησεν
  choice: morreu
  rationale: Tradução direta e clara de τελευτάω, sem recorrer a eufemismo.
- source_word: μὴ ἔχων σπέρμα
  choice: como não tinha descendência
  rationale: 'σπέρμα significa literalmente “semente”, mas aqui tem sentido familiar e jurídico coletivo: descendência. “Como não tinha” expressa naturalmente a circunstância indicada pelo particípio.'
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: deixou sua mulher
  rationale: ἀφίημι significa aqui deixar alguém após a morte, não abandonar nem divorciar-se. “Mulher” preserva o sentido contextual de esposa sem acrescentar informação.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: ao seu irmão
  rationale: O dativo apresenta o irmão sobrevivente como aquele a quem a viúva foi deixada. A formulação evita acrescentar explicitamente “para se casar”, ausente do grego.
theological_decisions:
- issue: Explicitar no texto principal o casamento levirato
  choice: Manter implícita a obrigação de o irmão se casar com a viúva.
  alternative: Traduzir “deixou sua mulher para que seu irmão se casasse com ela”.
  rationale: O contexto jurídico de Deuteronômio 25:5 é pressuposto, mas o grego deste versículo não declara explicitamente a finalidade. A nota fornece o contexto sem ampliar o texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita um marcador discursivo inicial sem correspondente específico no grego e conserva de modo conciso a sequência e o pano de fundo jurídico do original.
