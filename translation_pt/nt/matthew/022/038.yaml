  text: αὕτη ἐστὶν ⸂ἡ μεγάλη καὶ πρώτη⸃ ἐντολή.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/038.yaml
  text: This is the great and first commandment[a].
translation:
  language: pt
  text: Este é o grande e primeiro mandamento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Este é o principal mandamento”. O grego traz, mais literalmente, dois qualificativos: “o grande e primeiro mandamento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Este
  rationale: O pronome demonstrativo retoma o mandamento citado no versículo 37. “Este” é natural em português e preserva essa referência.
- source_word: ἐστὶν
  choice: é
  rationale: A cópula no presente do indicativo é traduzida diretamente.
- source_word: μεγάλη
  choice: grande
  rationale: Neste contexto, indica importância ou posição. “Maior” ou “o maior” introduziria um grau comparativo ou superlativo que a forma grega positiva não expressa diretamente.
- source_word: πρώτη
  choice: primeiro
  rationale: Expressa primazia ou primeira posição. A tradução direta preserva a distinção entre este adjetivo e “grande”.
- source_word: ἐντολή
  choice: mandamento
  rationale: É a opção corrente no contexto bíblico e jurídico-religioso e mantém a ligação com a discussão sobre a Lei.
theological_decisions:
- issue: Relação entre μεγάλη e πρώτη na descrição do mandamento
  choice: 'Traduzir os dois adjetivos de modo coordenado: “o grande e primeiro mandamento”.'
  alternative: “o principal mandamento” ou “o maior e primeiro mandamento”
  rationale: O grego apresenta dois adjetivos positivos coordenados, ambos modificando “mandamento”. Mantê-los explícitos preserva a ênfase e a possível distinção entre grandeza e primazia, sem converter “grande” silenciosamente em superlativo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A formulação deliberadamente conserva a coordenação um pouco marcada do grego para não apagar seus dois qualificativos.
