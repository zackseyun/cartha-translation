  text: εἰπὸν οὖν ἡμῖν τί σοι δοκεῖ· ἔξεστιν δοῦναι κῆνσον Καίσαρι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/017.yaml
  text: Tell us, then, what do you think? Is it lawful to give the poll tax to Caesar, or not?
translation:
  language: pt
  text: 'Diga-nos, então, o que você acha: é permitido dar o imposto de capitação a César ou não?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰπὸν οὖν ἡμῖν
  choice: Diga-nos, então
  rationale: Reproduz diretamente o imperativo singular dirigido a Jesus, com οὖν expresso por “então”.
- source_word: τί σοι δοκεῖ
  choice: o que você acha
  rationale: Formulação natural e corrente para perguntar a opinião ou o juízo do interlocutor.
- source_word: ἔξεστιν
  choice: é permitido
  rationale: Preserva a questão de licitude sem especificar indevidamente se a norma em vista é religiosa, civil ou moral.
- source_word: δοῦναι
  choice: dar
  rationale: Mantém o sentido básico do infinitivo aoristo de δίδωμι e a formulação deliberadamente direta do texto-fonte.
- source_word: κῆνσον
  choice: o imposto
  rationale: No contexto romano, designa o tributo ou imposto de capitação; “imposto” é claro e natural, sem sobrecarregar o versículo.
- source_word: Καίσαρι
  choice: a César
  rationale: Mantém o título imperial tradicional e a construção de destinatário do grego.
- source_word: ἢ οὔ
  choice: ou não?
  rationale: Conserva a alternativa binária e a força da pergunta-armadilha.
theological_decisions:
- issue: Natureza da licitude perguntada
  choice: é permitido
  alternative: é lícito
  rationale: “É permitido” comunica ἔξεστιν em português corrente e preserva a ambiguidade sobre qual autoridade normativa determina a permissão.
- issue: Relação do pagamento com César
  choice: dar o imposto a César
  alternative: pagar o imposto a César
  rationale: “Dar” acompanha mais de perto δοῦναι e evita antecipar a reformulação conceitual que aparecerá na resposta de Jesus, embora “pagar” seja idiomático em português.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O singular “você” torna explícito que a pergunta é dirigida a Jesus; a colocação pronominal é natural no registro oral respeitoso contemporâneo.
