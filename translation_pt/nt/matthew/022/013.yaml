  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε ⸂ὁ βασιλεὺς εἶπεν⸃ τοῖς διακόνοις· Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ⸂ἐκβάλετε αὐτὸν⸃ εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: pt
  text: 'Então o rei disse aos criados: “Amarrem os pés e as mãos dele e lancem-no nas trevas exteriores. Ali haverá choro e ranger de dentes.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Advérbio temporal que introduz naturalmente o acontecimento seguinte na narrativa.
- source_word: ὁ βασιλεὺς
  choice: o rei
  rationale: Preserva de modo direto a figura régia da parábola.
- source_word: τοῖς διακόνοις
  choice: aos criados
  rationale: No contexto do banquete, designa os que servem ao rei; evita a conotação eclesiástica que “ministros” poderia sugerir.
- source_word: Δήσαντες
  choice: Amarrem
  rationale: O particípio aoristo ligado ao imperativo seguinte é expresso naturalmente em português como uma primeira ordem coordenada.
- source_word: αὐτοῦ πόδας καὶ χεῖρας
  choice: os pés e as mãos dele
  rationale: Mantém a ordem incomum, mas expressiva, do grego e usa construção clara em português.
- source_word: ἐκβάλετε αὐτὸν
  choice: lancem-no para fora
  rationale: Comunica a expulsão enérgica de ἐκβάλλω em registro digno e atual.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: para fora, nas trevas
  rationale: Expressa o sentido espacial de trevas situadas do lado de fora e soa mais natural em português do que o decalque “trevas exteriores”.
- source_word: ἐκεῖ
  choice: Ali
  rationale: Preserva de maneira concisa a ênfase locativa.
- source_word: ὁ κλαυθμὸς
  choice: choro
  rationale: Equivalente corrente para lamentação e pranto, adequado à fórmula de Mateus.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: ranger de dentes
  rationale: Forma idiomática tradicional e precisa, sem decidir se expressa angústia, ira ou ambas.
theological_decisions:
- issue: Natureza da imagem de exclusão na parábola
  choice: Manter a imagem concreta de expulsão para fora, nas trevas, sem identificá-la explicitamente com o inferno nem reduzi-la à simples exclusão do banquete.
  alternative: Explicitar castigo infernal ou suavizar a imagem como mera vergonha social.
  rationale: O grego apresenta uma imagem vívida de juízo, mas não fornece aqui uma interpretação doutrinária explícita; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Criados” é contextual e não eclesiástico; “lancem-no” conserva a força do ato sem recorrer a linguagem arcaica. A pontuação em “para fora, nas trevas” torna explícita a relação espacial do grego.
