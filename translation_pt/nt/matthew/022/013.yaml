review_pass:
  verdict: revise
  source_fidelity: 'A tradução transmite adequadamente a sequência narrativa, o rei, a ordem de amarrar os pés e as mãos, a expulsão e a fórmula final de choro e ranger de dentes. Contudo, “para fora, nas trevas” não representa com precisão suficiente τὸ σκότος τὸ ἐξώτερον: a expressão grega designa especificamente “as trevas exteriores”, e não apenas trevas que estejam fora.'
  naturalness: O texto é claro e de registro apropriado. “Amarrem”, “criados”, “lancem-no”, “choro” e “ranger de dentes” são naturais e amplamente compreensíveis. “Trevas exteriores”, embora ligeiramente mais literário, é expressão estabelecida em português bíblico e preserva com clareza a formulação mateana.
  terminology: “Criados” é contextual e adequado para os διάκονοι no cenário do banquete, sem conotação eclesiástica. “Trevas exteriores” preserva a imagem recorrente de Mateus e evita reduzir ou interpretar a imagem de juízo.
  issues:
  - severity: medium
    issue: A expressão “nas trevas” omite o qualificativo ἐξώτερον (“exteriores/mais externas”).
    rationale: O acréscimo de “para fora” não equivale de modo claro ao sintagma grego “para as trevas exteriores” e pode sugerir duas localizações sucessivas. A formulação revisada conserva tanto o destino quanto a caracterização específica das trevas.
  revised_text: 'Então o rei disse aos criados: “Amarrem os pés e as mãos dele e lancem-no nas trevas exteriores. Ali haverá choro e ranger de dentes.”'
  revised_footnotes: []
