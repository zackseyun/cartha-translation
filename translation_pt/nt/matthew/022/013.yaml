- from: 'Então o rei disse aos criados: “Amarrem os pés e as mãos dele e lancem-no para fora, nas trevas. Ali haverá choro e ranger de dentes.”'
  to: 'Então o rei disse aos criados: “Amarrem os pés e as mãos dele e lancem-no nas trevas exteriores. Ali haverá choro e ranger de dentes.”'
  rationale: A única alteração necessária é substituir “para fora, nas trevas” por “nas trevas exteriores”, preservando a expressão definida τὸ σκότος τὸ ἐξώτερον e sua força literária sem impor uma interpretação doutrinária. O restante do texto mantém boa fidelidade e fluência.
