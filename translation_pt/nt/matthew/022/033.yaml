- source_word: ἐξεπλήσσοντο
  choice: ficaram admiradas
  rationale: Expressa a forte reação de surpresa indicada pelo verbo, em linguagem contemporânea e sem exagerar sua intensidade.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: com o seu ensino
  rationale: Comunica de modo idiomático a ocasião ou causa da admiração; «ensino» preserva o sentido de διδαχή sem o tom técnico de «doutrina».
