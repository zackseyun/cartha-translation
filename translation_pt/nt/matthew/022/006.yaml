  text: οἱ δὲ λοιποὶ κρατήσαντες τοὺς δούλους αὐτοῦ ὕβρισαν καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/006.yaml
  text: But the rest[a], seizing his slaves, mistreated them and killed them.
translation:
  language: pt
  text: Mas os outros agarraram os escravos dele[a], maltrataram-nos e os mataram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Mas os outros
  rationale: “Os outros” retoma os convidados restantes, enquanto “mas” expressa naturalmente o leve contraste introduzido por δέ com os que apenas não deram atenção ao convite no versículo anterior.
- source_word: κρατήσαντες
  choice: agarraram
  rationale: 'O particípio aoristo indica uma ação associada e anterior aos verbos principais. Em português, a coordenação verbal preserva com naturalidade a sequência: agarraram, maltrataram e mataram.'
- source_word: τοὺς δούλους αὐτοῦ
  choice: os escravos dele
  rationale: δοῦλος designa aqui pessoas pertencentes ao rei e enviadas por ele. “Escravos” preserva com transparência essa condição social; “servos” continua sendo uma alternativa contextual válida e aparece em nota.
- source_word: ὕβρισαν
  choice: maltrataram-nos
  rationale: ὑβρίζω abrange tratamento abusivo, humilhante e violento, não apenas insulto verbal. “Maltrataram” comunica bem essa amplitude em português corrente.
- source_word: ἀπέκτειναν
  choice: os mataram
  rationale: Tradução direta de ἀποκτείνω, sem acrescentar a nuance jurídica ou moral mais específica de “assassinar”.
theological_decisions:
- issue: Tradução de δοῦλος no contexto da parábola
  choice: escravos
  alternative: servos
  rationale: A cena apresenta emissários pertencentes ao rei, de modo que “escravos” conserva a realidade social expressa pelo termo grego sem acrescentar uma interpretação teológica. Como “servos” também é possível conforme a função exercida, a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A colocação pronominal em “maltrataram-nos” evita repetição excessiva sem elevar demasiadamente o registro.
