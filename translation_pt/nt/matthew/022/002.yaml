  text: Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ, ὅστις ἐποίησεν γάμους τῷ υἱῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/002.yaml
  text: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
translation:
  language: pt
  text: O Reino dos céus foi comparado a um rei que deu uma festa de casamento para seu filho.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pode ser comparado a”. O verbo grego está literalmente no passado passivo: “foi comparado” ou “foi tornado semelhante”.'
    reason: lexical_alternative
  - marker: b
    text: No grego, “casamentos” (plural), expressão que pode designar as festividades ou o banquete de casamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡμοιώθη
  choice: foi comparado
  rationale: Preserva o aoristo passivo indicativo sem introduzir a modalidade de “pode ser comparado”; em português, é uma formulação clara, embora a alternativa proverbial seja registrada em nota.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: o Reino dos céus
  rationale: Mantém a expressão característica de Mateus, sem harmonizá-la com “Reino de Deus”; “Reino” conserva a possível amplitude entre domínio e exercício do reinado.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: um rei
  rationale: A combinação grega identifica a figura humana como rei. “Um homem, um rei” seria possível formalmente, mas pouco natural e desnecessariamente marcado em português.
- source_word: ὅστις
  choice: que
  rationale: Introduz naturalmente, em português, a ação do rei, sem atribuir ao pronome uma ênfase maior do que o contexto exige.
- source_word: ἐποίησεν γάμους
  choice: celebrou o casamento
  rationale: A construção idiomática indica a realização das festividades nupciais; “celebrou o casamento” é corrente e abrangente em português.
- source_word: γάμους
  choice: o casamento
  rationale: O plural grego pode designar as festividades ou o banquete de casamento, não necessariamente vários casamentos; a nota preserva essa informação lexical.
- source_word: τῷ υἱῷ αὐτοῦ
  choice: de seu filho
  rationale: Com a expressão portuguesa “celebrar o casamento”, o genitivo é a construção natural para indicar de quem era o casamento, comunicando a relação expressa pelo dativo grego.
theological_decisions:
- issue: Natureza da expressão “Reino dos céus”
  choice: Manter “Reino dos céus”
  alternative: Reino de Deus; reinado dos céus
  rationale: Preserva a linguagem própria de Mateus e deixa aberta a amplitude semântica de βασιλεία, sem impor uma paráfrase teológica.
- issue: Referente da comparação
  choice: O Reino é comparado ao rei no desenvolvimento da parábola
  alternative: Explicitar que o Reino é semelhante exclusivamente ao banquete
  rationale: A sintaxe liga formalmente a comparação a “um rei”, e a tradução não deve restringir antecipadamente a correspondência parabólica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “Reino” em forma consagrada e inteligível. A construção evita tanto o literalismo pouco natural “um homem, um rei” quanto uma explicitação excessiva de “banquete”, preservada em nota.
