id: MAT.22.29
reference: Matthew 22:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: pt
  text: 'Jesus, porém, lhes respondeu: “Vocês estão enganados[a], pois não conhecem nem as Escrituras nem o poder de Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estão errados”, “estão sendo enganados” ou “se desviam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Jesus, porém, lhes respondeu
  rationale: A fórmula participial seguida de εἶπεν é vertida idiomaticamente por “respondeu”, sem a redundância “respondendo, disse”. “Porém” representa o δέ levemente adversativo e marca a contraposição à fala anterior.
- source_word: Πλανᾶσθε
  choice: Vocês estão enganados
  rationale: O verbo pode indicar estar em erro, enganar-se ou ser desviado. “Estão enganados” é natural em português e mantém aberta a possibilidade de erro próprio ou de engano sofrido.
- source_word: μὴ εἰδότες
  choice: pois não conhecem
  rationale: O particípio expressa a causa do erro. “Pois” comunica essa relação causal com clareza, sem tornar a afirmação mais forte do que o grego.
- source_word: τὰς γραφὰς
  choice: as Escrituras
  rationale: No contexto judaico, o plural designa os escritos sagrados; “as Escrituras” é a expressão portuguesa consagrada, clara e precisa.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: nem o poder de Deus
  rationale: A construção coordenada com μηδέ é preservada por “nem”, e o genitivo é traduzido naturalmente como “de Deus”.
theological_decisions:
- issue: Causa do erro dos saduceus
  choice: A falta de conhecimento tanto das Escrituras como do poder de Deus é apresentada como causa do erro.
  alternative: Ler a frase apenas como duas acusações paralelas, sem relação causal explícita.
  rationale: O particípio μὴ εἰδότες explica naturalmente Πλανᾶσθε; “pois” preserva essa relação, enquanto “nem... nem...” mantém os dois elementos igualmente em foco.
- issue: Nuance de Πλανᾶσθε
  choice: estão enganados
  alternative: estão errados; vocês se desviam; são enganados
  rationale: A forma grega admite nuances médias ou passivas. A tradução escolhida evita decidir de modo rígido se o erro é autogerado ou causado externamente; a nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” torna explícito o plural de Πλανᾶσθε; a colocação “lhes respondeu” conserva fluidez e formalidade moderada.
