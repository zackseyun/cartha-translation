  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ δοῦλοι ἐκεῖνοι εἰς τὰς ὁδοὺς συνήγαγον πάντας ⸀οὓς εὗρον, πονηρούς τε καὶ ἀγαθούς· καὶ ἐπλήσθη ὁ ⸀γάμος ἀνακειμένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those slaves went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: pt
  text: E aqueles escravos saíram pelas estradas e reuniram todos os que encontraram, tanto maus como bons; e o salão do banquete de casamento ficou cheio de convidados reclinados à mesa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, reclinados na postura costumeira para uma refeição formal.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλοι
  choice: escravos
  rationale: Preserva a condição social de pessoas sob a autoridade do rei, sem suavizar o termo grego para “servos”.
- source_word: ὁδοὺς
  choice: estradas
  rationale: Expressa de modo natural as vias públicas onde os escravos encontraram pessoas, sem restringir a referência a ruas urbanas.
- source_word: συνήγαγον πάντας οὓς εὗρον
  choice: reuniram todos os que encontraram
  rationale: Reproduz a abrangência de πάντας e o sentido direto de συνάγω em português corrente.
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: tanto maus como bons
  rationale: Mantém o contraste moral e a ordem do grego; “maus” é natural em português e evita a possível leitura metafísica mais forte de “maus como bons” com “malignos”.
- source_word: γάμος
  choice: salão do casamento
  rationale: Embora γάμος possa designar o casamento ou banquete nupcial, o fato de ficar cheio de pessoas reclinadas favorece aqui uma referência contextual ao espaço da celebração.
- source_word: ἀνακειμένων
  choice: convidados reclinados à mesa
  rationale: Torna explícito que se trata dos participantes da refeição na postura formal costumeira do mundo antigo.
theological_decisions:
- issue: Caracterização moral dos reunidos
  choice: tanto maus como bons
  alternative: tanto perversos como bons
  rationale: Conserva o alcance indiscriminado do convite e o contraste moral do grego, sem antecipar uma conclusão doutrinária sobre a presença ou a resposta dos convidados.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Escravos” preserva a realidade social do termo grego; “salão do casamento” comunica o referente contextual de γάμος, enquanto a nota esclarece o costume de reclinar-se durante o banquete.
