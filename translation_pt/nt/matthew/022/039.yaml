  text: Δευτέρα ⸀δὲ ὁμοία ⸀αὐτῇ· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/039.yaml
  text: 'And a second is like it: You shall love your neighbor as yourself[a].'
translation:
  language: pt
  text: 'E o segundo mandamento é semelhante ao primeiro: “Ame o seu próximo como a si mesmo.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E um segundo é semelhante a ele.”'
    reason: Alternativa lexical para o ordinal grego sem artigo.
lexical_decisions:
- source_word: Δευτέρα
  choice: o segundo
  rationale: O adjetivo ordinal feminino, usado substantivamente, identifica no contexto o segundo mandamento. Em português, o artigo definido é a forma mais natural; a ausência de artigo no grego também permite a alternativa registrada em nota.
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ funciona como conectivo leve que dá continuidade ao discurso, sem contraste forte.
- source_word: ὁμοία αὐτῇ
  choice: semelhante a ele
  rationale: ὁμοία com o dativo αὐτῇ expressa semelhança com o primeiro mandamento; o pronome português retoma naturalmente “mandamento”, implícito no contexto.
- source_word: Ἀγαπήσεις
  choice: Ame
  rationale: O futuro do indicativo tem força imperativa na citação de Levítico 19:18. O imperativo português comunica com clareza essa força normativa sem recorrer ao pouco natural “amarás” no uso moderno.
- source_word: τὸν πλησίον σου
  choice: o seu próximo
  rationale: A expressão idiomática designa o próximo, não apenas alguém fisicamente perto. “O seu próximo” é tradicional, claro e amplamente compreensível.
- source_word: ὡς
  choice: como
  rationale: Introduz o padrão de comparação de maneira natural e precisa em português.
- source_word: σεαυτόν
  choice: a si mesmo
  rationale: O pronome reflexivo remete ao sujeito singular implícito e é vertido de modo idiomático e digno.
theological_decisions:
- issue: Relação do segundo mandamento com o primeiro
  choice: o segundo, semelhante a ele
  alternative: um segundo é semelhante a ele
  rationale: A formulação mantém distintos os dois mandamentos e afirma sua semelhança, sem explicar além do que o texto diz. O definido é mais natural no contexto ordinal português, enquanto a alternativa preserva de maneira mais direta a construção grega sem artigo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção direta. O imperativo “Ame” preserva a força do mandamento em linguagem atual; a nota conserva a ambiguidade entre leitura definida e indefinida de Δευτέρα.
