source:
  edition: SBLGNT
  text: λέγων· Τί ὑμῖν δοκεῖ περὶ τοῦ χριστοῦ; τίνος υἱός ἐστιν; λέγουσιν αὐτῷ· Τοῦ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/042.yaml
  text: saying[a], “What do you think about the Messiah? Whose son is he?” They said to him, “David’s.”
translation:
  language: pt
  text: 'dizendo: “O que vocês pensam a respeito do Messias[a]? De quem ele é filho?” Eles lhe disseram: “De Davi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cristo”. O título grego é Χριστός (Christós), empregado aqui em sentido messiânico.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: dizendo
  rationale: Mantém o particípio presente que introduz diretamente a fala de Jesus, sem acrescentar a nuance interpretativa de “perguntando”.
- source_word: Τί ὑμῖν δοκεῖ
  choice: O que vocês pensam
  rationale: Expressão natural em português moderno para uma pergunta que solicita opinião ou juízo, preservando o plural ὑμῖν.
- source_word: περὶ τοῦ χριστοῦ
  choice: a respeito do Messias
  rationale: Χριστός funciona aqui como título no contexto da expectativa messiânica judaica; “Messias” comunica esse valor titular com clareza.
- source_word: τίνος υἱός ἐστιν
  choice: De quem ele é filho?
  rationale: Reproduz a pergunta de filiação ou descendência, com o pronome “ele” retomando naturalmente “o Messias”.
- source_word: λέγουσιν αὐτῷ
  choice: Eles lhe responderam
  rationale: O presente histórico grego é vertido no passado narrativo; “responderam” explicita de modo natural a função contextual da fala, e “lhe” preserva αὐτῷ.
- source_word: Τοῦ Δαυίδ
  choice: De Davi
  rationale: Conserva a resposta genitiva e elíptica do grego, cujo sentido completo é “filho de Davi”, sem expandi-la desnecessariamente.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Neste diálogo, o termo é claramente um título ligado à identidade e descendência do esperado rei davídico, não uma designação semelhante a nome próprio. A nota registra a alternativa lexical tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” representa naturalmente o plural ὑμῖν; “a respeito de” conserva o tom deliberativo sem soar excessivamente coloquial.
