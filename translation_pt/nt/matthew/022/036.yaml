source:
  edition: SBLGNT
  text: Διδάσκαλε, ποία ἐντολὴ μεγάλη ἐν τῷ νόμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/036.yaml
  text: Teacher[a], which commandment is greatest in the Law?
translation:
  language: pt
  text: Mestre, qual é o maior mandamento da Lei?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Mestre, qual mandamento é grande na Lei?”'
    reason: Preserva a forma positiva do adjetivo grego μεγάλη, embora o contexto permita e o português favoreça o sentido comparativo “maior”.
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: Vocativo dirigido a Jesus. Em português, “Mestre” é a forma corrente e digna para alguém reconhecido como ensinador, sem exigir a conotação de senhor ou proprietário.
- source_word: ποία
  choice: qual
  rationale: Adjetivo interrogativo que pede a identificação de um mandamento entre os mandamentos da Lei.
- source_word: ἐντολὴ
  choice: mandamento
  rationale: Preserva o sentido jurídico e religioso do termo no contexto da Lei judaica e sua associação tradicional com os mandamentos bíblicos.
- source_word: μεγάλη
  choice: maior
  rationale: 'Embora a forma grega seja o adjetivo positivo “grande”, a pergunta tem força comparativa no contexto: qual mandamento se destaca entre os demais. “Maior” expressa essa leitura de modo natural em português, enquanto a forma mais literal é registrada em nota.'
- source_word: ἐν τῷ νόμῳ
  choice: da Lei
  rationale: Refere-se à Lei judaica, isto é, à Torá. Em português, “mandamento da Lei” identifica naturalmente o conjunto ao qual o mandamento pertence; a inicial maiúscula sinaliza o referente bíblico específico.
theological_decisions:
- issue: Se μεγάλη deve ser traduzido pelo positivo “grande” ou pelo comparativo idiomático “maior”
  choice: maior
  alternative: grande
  rationale: O grego emprega formalmente o adjetivo positivo, mas, em uma pergunta que seleciona um mandamento entre vários, o português pede naturalmente “maior”. A nota conserva a formulação mais literal e evita ocultar a nuance gramatical.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Mestre” mantém o tratamento tradicional e acessível; “Lei” aparece com inicial maiúscula por designar especificamente a Lei judaica.
