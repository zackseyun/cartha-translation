  text: ἐπιδείξατέ μοι τὸ νόμισμα τοῦ κήνσου. οἱ δὲ προσήνεγκαν αὐτῷ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/019.yaml
  text: Show me the coin for the tax[a]. And they brought him a denarius.
translation:
  language: pt
  text: “Mostrem-me a moeda do imposto.” Então lhe trouxeram um denário.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: Mostrem-me
  rationale: O imperativo aoristo ativo na segunda pessoa do plural pede que os interlocutores exibam a moeda para inspeção. “Mostrem-me” preserva o sentido visual e é natural em português.
- source_word: νόμισμα
  choice: moeda
  rationale: O termo designa uma moeda ou peça monetária em circulação; “moeda” é claro e prepara naturalmente a identificação específica como denário.
- source_word: τοῦ κήνσου
  choice: do imposto
  rationale: O empréstimo latino κῆνσος se refere ao imposto romano em discussão. “Do imposto” é conciso, natural e evita especificar no texto principal mais do que o grego exige.
- source_word: προσήνεγκαν
  choice: trouxeram
  rationale: No contexto narrativo, a forma aorista de προσφέρω indica que levaram a moeda até Jesus; “trouxeram” é direto e idiomático.
- source_word: δηνάριον
  choice: um denário
  rationale: O termo nomeia uma moeda romana específica. A transliteração preserva a precisão histórica.
