id: MAT.22.28
reference: Matthew 22:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν τῇ ⸂ἀναστάσει οὖν⸃ τίνος τῶν ἑπτὰ ἔσται γυνή; πάντες γὰρ ἔσχον αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/028.yaml
  text: In the resurrection[a], then, whose wife of the seven will she be? For they all had her.
translation:
  language: pt
  text: Na ressurreição, então, de qual dos sete ela será esposa? Pois todos eles a tiveram como esposa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais explicitamente: “todos os sete se casaram com ela”. O grego diz literalmente: “todos a tiveram”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ἀναστάσει
  choice: Na ressurreição
  rationale: A construção com ἐν situa a pergunta no momento ou estado da futura ressurreição; “na ressurreição” é clara, concisa e corrente em português.
- source_word: οὖν
  choice: então
  rationale: Marca a conclusão da situação hipotética apresentada pelos saduceus. “Então” preserva a progressão lógica com naturalidade numa pergunta.
- source_word: τίνος τῶν ἑπτὰ
  choice: de qual dos sete
  rationale: O genitivo interrogativo identifica, dentro do grupo dos sete irmãos, aquele de quem ela seria esposa. Esta formulação é mais idiomática em português do que uma reprodução rígida da ordem grega.
- source_word: ἔσται γυνή
  choice: ela será esposa
  rationale: No contexto matrimonial, γυνή significa “esposa”, e o futuro ἔσται é representado diretamente por “será”.
- source_word: πάντες γὰρ ἔσχον αὐτήν
  choice: Pois todos eles a tiveram como esposa
  rationale: γάρ introduz a razão da pergunta. A expressão “a tiveram como esposa” conserva o verbo amplo ἔχω e explicita apenas a relação conjugal já exigida pelo contexto, evitando que “todos a tiveram” soe principalmente sexual no português atual.
theological_decisions:
- issue: Sentido de ἀνάστασις no desafio dos saduceus
  choice: A futura ressurreição dos mortos
  alternative: Uma vida após a morte em sentido vago ou apenas a condição posterior à morte
  rationale: O contexto trata especificamente da controvérsia sobre a ressurreição, tema que Jesus aborda nos versículos seguintes. “Ressurreição” preserva essa referência concreta sem acrescentar uma explicação doutrinária ao versículo.
- issue: Natureza da relação expressa por ἔσχον αὐτήν
  choice: 'Relação matrimonial: todos a tiveram como esposa'
  alternative: 'Uma referência inespecífica ou meramente sexual: todos a tiveram'
  rationale: A pergunta anterior identifica a mulher como esposa, e a narrativa precedente afirma que cada irmão se casou com ela. A tradução mantém esse referente matrimonial sem ampliar a afirmação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Então” mantém o encadeamento argumentativo sem a rigidez de “portanto”. A ordem “de qual dos sete ela será esposa?” é natural em português e preserva a pergunta sobre qual dos irmãos seria o marido na ressurreição.
