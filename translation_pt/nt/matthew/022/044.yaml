  text: ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/044.yaml
  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: pt
  text: '“O Senhor disse ao meu Senhor: ‘Sente-se à minha direita, até que eu ponha os seus inimigos debaixo dos seus pés’?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: Senhor
  rationale: Mantém o mesmo título nas duas ocorrências gregas, distinguindo os referentes pela expressão relacional “meu Senhor”, sem inserir no texto grego uma diferenciação tipográfica baseada no hebraico.
- source_word: Εἶπεν
  choice: disse
  rationale: Equivalente direto, natural e não enfático do aoristo de λέγω na fórmula de citação.
- source_word: τῷ κυρίῳ μου
  choice: ao meu Senhor
  rationale: Expressa o destinatário marcado pelo dativo e preserva o título κύριος e a relação indicada por μου.
- source_word: Κάθου
  choice: Sente-se
  rationale: Imperativo natural em português contemporâneo; o uso pronominal é idiomático no contexto de tomar assento em posição de honra.
- source_word: ἐκ δεξιῶν μου
  choice: à minha direita
  rationale: Expressão portuguesa clara e consagrada para a posição de honra e autoridade indicada pelo idioma grego.
- source_word: ἕως ἂν θῶ
  choice: até que eu ponha
  rationale: Preserva a referência futura da construção com ἄν e subjuntivo aoristo, em formulação natural.
- source_word: τοὺς ἐχθρούς σου
  choice: os seus inimigos
  rationale: Equivalente comum e claro; “seus” concorda com o tratamento respeitoso da fala dirigida ao Senhor.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: debaixo dos seus pés
  rationale: Traduz diretamente a leitura do texto grego de Mateus, sem substituir a expressão pela imagem do escabelo presente no hebraico do Salmo 110:1.
theological_decisions:
- issue: As duas ocorrências de κύριος na citação do Salmo 110:1
  choice: O Senhor disse ao meu Senhor
  alternative: O SENHOR disse ao meu Senhor; O Senhor disse ao meu mestre
  rationale: O grego emprega κύριος em ambos os casos. Repetir “Senhor” preserva a forma da citação e a tensão central do argumento de Jesus, enquanto “meu” distingue a relação sem reduzir o segundo título a “mestre”. Grafar “SENHOR” importaria explicitamente para a tradução do grego a identificação do nome divino presente no texto hebraico subjacente.
- issue: Imagem final da citação
  choice: ponha os seus inimigos debaixo dos seus pés
  alternative: faça dos seus inimigos um estrado para os seus pés
  rationale: A escolha segue a redação grega de Mateus, ὑποκάτω τῶν ποδῶν σου. A formulação com “estrado” representa o idioma hebraico do Salmo 110:1, mas não precisa ser introduzida no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O tratamento por “o senhor” é evitado na fala citada para não confundir o título “Senhor”; por isso, usam-se o imperativo “Sente-se” e os possessivos “seus”. A pontuação mantém o versículo como continuação de uma pergunta de Jesus.
