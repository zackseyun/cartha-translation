lexical_decisions:
- source_word: Συνηγμένων
  choice: estavam reunidos
  rationale: O particípio aoristo passivo no genitivo absoluto estabelece a circunstância de fundo. A forma natural em português preserva o estado coletivo sem tornar a ação principal.
- source_word: δὲ
  choice: Enquanto
  rationale: δέ funciona aqui como transição leve; não exige uma palavra separada. A ligação discursiva é expressa naturalmente pela oração circunstancial, sem introduzir contraste inexistente.
- source_word: τῶν Φαρισαίων
  choice: os fariseus
  rationale: Designação corrente e clara do grupo; o caso genitivo decorre da construção absoluta grega.
- source_word: ἐπηρώτησεν
  choice: perguntou
  rationale: Equivalente moderno e direto para o aoristo de ἐπερωτάω neste contexto, sem o tom potencialmente hostil de «interrogou».
- source_word: αὐτοὺς
  choice: lhes
  rationale: Retoma os fariseus e se encaixa naturalmente na regência corrente de «perguntar» em português.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Nome próprio sujeito da oração; o artigo grego não é reproduzido em português.
