id: MAT.22.30
reference: Matthew 22:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: pt
  text: Pois, na ressurreição,[a] não se casam nem são dados em casamento, mas são como os anjos de Deus no céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por ocasião da ressurreição”.'
    reason: Alternativa lexical para ἐν τῇ ἀναστάσει; a preposição pode ser entendida temporalmente, além de indicar a condição da vida ressuscitada.
lexical_decisions:
- source_word: ἐν ... τῇ ἀναστάσει
  choice: na ressurreição
  rationale: Preserva de modo natural a preposição grega e pode indicar tanto o âmbito quanto a condição da vida ressuscitada.
- source_word: γαμοῦσιν
  choice: se casam
  rationale: É a expressão corrente e abrangente em português para contrair casamento, sem acrescentar uma especificação de gênero que soaria pouco natural.
- source_word: γαμίζονται
  choice: são dadas em casamento
  rationale: Mantém a distinção entre o verbo ativo anterior e esta forma passiva, tradicionalmente associada a alguém ser dado em casamento.
- source_word: ὡς
  choice: como
  rationale: 'Marca comparação, não identidade: os ressuscitados são semelhantes aos anjos no aspecto indicado, não se tornam anjos.'
- source_word: ἄγγελοι θεοῦ
  choice: os anjos de Deus
  rationale: Representa explicitamente o genitivo θεοῦ e segue uma formulação clara e digna em português.
- source_word: ἐν τῷ οὐρανῷ
  choice: no céu
  rationale: Neste contexto, οὐρανός designa o céu como morada dos anjos, não o céu físico.
- source_word: γὰρ
  choice: Pois
  rationale: Conserva de maneira sucinta a relação explicativa com a declaração anterior.
theological_decisions:
- issue: Natureza da comparação com os anjos
  choice: Os ressuscitados são como os anjos quanto à ausência de casamento.
  alternative: Entender a comparação como afirmação de uma condição angélica mais ampla ou de transformação em anjos.
  rationale: ὡς introduz uma comparação, e o contexto imediato indica o casamento como seu ponto. A tradução preserva a semelhança sem afirmar identidade ou transformação ontológica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “As pessoas” explicita naturalmente o sujeito plural implícito e evita que a sequência seja entendida como limitada a um único gênero.
