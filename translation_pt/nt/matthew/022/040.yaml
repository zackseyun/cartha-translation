base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/040.yaml
  text: On these two commandments hang the whole Law and the Prophets[a][b].
translation:
  language: pt
  text: Destes dois mandamentos dependem toda a Lei e os Profetas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego traduzido como “dependem” significa literalmente “estão pendurados”. A expressão indica que toda a Lei e os Profetas se apoiam nesses dois mandamentos e neles encontram seu resumo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: Destes dois mandamentos
  rationale: Em combinação com κρέμαται, a preposição ἐν expressa a base da qual algo depende. Em português, “depender de” comunica naturalmente essa relação, sem forçar a construção literal “nestes”.
- source_word: ὅλος ὁ νόμος
  choice: toda a Lei
  rationale: ὅλος enfatiza a totalidade. “Toda a Lei” é uma formulação natural e abrangente; a inicial maiúscula indica a referência à Torá, e não à lei em sentido abstrato.
- source_word: κρέμαται
  choice: dependem
  rationale: O verbo significa literalmente “está pendurado” e, metaforicamente, “depende”. Como o sujeito composto em português é “toda a Lei e os Profetas”, emprega-se o plural “dependem”. Essa escolha preserva o sentido da metáfora em linguagem natural, embora torne sua imagem menos explícita.
- source_word: καὶ οἱ προφῆται
  choice: e os Profetas
  rationale: A expressão integra a fórmula judaica estabelecida “a Lei e os Profetas”. A inicial maiúscula sinaliza a referência à seção profética das Escrituras e ao testemunho escritural associado a ela.
theological_decisions:
- issue: Sentido da fórmula “a Lei e os Profetas”
  choice: Manter a fórmula como referência abrangente ao testemunho das Escrituras, relacionado aos dois mandamentos do amor
  alternative: Entendê-la de modo mais restrito, apenas como o ensino ético presente na legislação e nos escritos proféticos
  rationale: Em Mateus, “a Lei e os Profetas” funciona como expressão consolidada para o conjunto das Escrituras ou de seu ensino autorizado. A tradução conserva a fórmula e não a substitui por uma interpretação como “toda a Escritura” ou “todos os mandamentos de Deus”.
- issue: Força metafórica de κρέμαται
  choice: Traduzir pelo sentido idiomático “dependem”
  alternative: Preservar diretamente a imagem com “estão suspensos” ou “pendem”
  rationale: “Dependem” expressa com clareza a relação indicada pela metáfora grega, sem impor em português uma construção pouco natural. A nota registra a imagem literal para que ela não seja ocultada.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A ordem foi ajustada para uma construção portuguesa natural. “Lei” e “Profetas” recebem iniciais maiúsculas por formarem uma expressão referente às Escrituras.
