base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/043.yaml
  text: He said to them[a], “How then does David, in the Spirit, call him Lord[b], saying,”
translation:
  language: pt
  text: 'Ele lhes disse: “Como, então, Davi, no Espírito[a], o chama de Senhor[b], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelo Espírito”. A expressão grega pode indicar esfera ou agência; “no Espírito” segue mais de perto sua forma.
    reason: lexical_alternative
  - marker: b
    text: Ou “senhor” ou “mestre”. O título grego é κύριος, geralmente traduzido como “Senhor”.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Ele lhes disse
  rationale: O presente grego é um presente histórico; o pretérito é a forma narrativa mais natural em português, sem alterar a função do discurso.
- source_word: Πῶς οὖν
  choice: Como, então
  rationale: Preserva a força interrogativa de πῶς e o valor inferencial ou continuativo de οὖν.
- source_word: Δαυὶδ
  choice: Davi
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἐν πνεύματι
  choice: no Espírito
  rationale: Segue de perto a preposição grega e, neste contexto de fala inspirada, provavelmente se refere ao Espírito Santo; a expressão também preserva a possível nuance de esfera ou agência.
- source_word: καλεῖ αὐτὸν κύριον
  choice: o chama de Senhor
  rationale: “Senhor” preserva o sentido titular de κύριος e sua importância no argumento baseado no Salmo 110.
- source_word: λέγων
  choice: dizendo
  rationale: Mantém de forma direta a ligação participial com a citação que vem a seguir.
theological_decisions:
- issue: Referente de πνεύματι
  choice: Espírito Santo
  alternative: O espírito do próprio Davi ou um estado espiritual
  rationale: O contexto apresenta Davi pronunciando Escritura inspirada; a maiúscula indica o referente mais provável sem expandir o texto.
- issue: Sentido de κύριος
  choice: Senhor
  alternative: senhor ou mestre
  rationale: No contexto messiânico e na ligação com o Salmo 110, “Senhor” conserva melhor o caráter de título e a tensão cristológica da pergunta.
translation_notes:
  register: Português moderno, digno e natural, com ampla legibilidade brasileira. A ordem e a formulação preservam a pergunta aberta que introduz a citação seguinte.
