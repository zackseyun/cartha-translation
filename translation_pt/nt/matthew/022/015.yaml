  text: Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/015.yaml
  text: Then the Pharisees went and took counsel how they might trap him in his words[a].
translation:
  language: pt
  text: Então os fariseus saíram e deliberaram sobre como poderiam apanhar Jesus em alguma coisa que ele dissesse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tramaram como apanhá-lo pelo que dissesse”.'
    reason: Alternativa lexical para a força hostil possível de συμβούλιον ἔλαβον no contexto e para a formulação de ἐν λόγῳ.
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca de modo conciso e natural a sequência narrativa.
- source_word: πορευθέντες
  choice: foram
  rationale: O particípio aoristo antecede a ação principal e, neste contexto narrativo, é expresso naturalmente por uma forma verbal coordenada.
- source_word: οἱ Φαρισαῖοι
  choice: os fariseus
  rationale: Designação corrente e reconhecível do grupo religioso.
- source_word: συμβούλιον ἔλαβον
  choice: discutir entre si
  rationale: Expressa a deliberação conjunta do idioma grego sem atribuir a esta locução, por si só, a hostilidade já declarada na oração de propósito.
- source_word: ὅπως
  choice: como poderiam
  rationale: Depois de uma expressão de deliberação, introduz naturalmente em português o conteúdo e propósito do plano.
- source_word: αὐτὸν
  choice: Jesus
  rationale: O referente contextual do pronome é explicitado para assegurar clareza natural em português, sem alterar o sentido.
- source_word: παγιδεύσωσιν
  choice: apanhar
  rationale: Conserva a imagem de capturar numa armadilha e, com o complemento seguinte, comunica claramente a intenção de fazê-lo cair por suas declarações.
- source_word: ἐν λόγῳ
  choice: em alguma coisa que ele dissesse
  rationale: Torna natural o sentido idiomático de λόγος como fala ou declaração e preserva que a armadilha dependeria das próprias palavras de Jesus.
theological_decisions:
- issue: Grau de hostilidade expresso em συμβούλιον ἔλαβον
  choice: Traduzir como “foram discutir entre si” e deixar a intenção hostil explícita em “apanhar Jesus”.
  alternative: “tramaram” ou “conspiraram”
  rationale: A intenção maliciosa é inequívoca na oração de propósito, mas não precisa ser antecipada ou duplicada na locução que descreve a deliberação.
- issue: Referente de αὐτόν
  choice: Explicitar “Jesus”.
  alternative: Manter apenas “ele”.
  rationale: A explicitação do referente contextual favorece a leitura isolada do versículo e não acrescenta interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A formulação evita o pouco natural “tomaram conselho” e conserva tanto a deliberação conjunta quanto a intenção de fazer Jesus cair por suas próprias palavras.
