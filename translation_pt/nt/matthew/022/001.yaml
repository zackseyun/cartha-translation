  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς πάλιν εἶπεν ⸂ἐν παραβολαῖς αὐτοῖς⸃ λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/001.yaml
  text: 'And Jesus answered and again spoke to them in parables[a], saying:'
translation:
  language: pt
  text: 'E Jesus, respondendo, tornou a falar-lhes em parábolas, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Preserva o conectivo narrativo simples, sem acrescentar uma nuance temporal ausente do grego.
- source_word: ἀποκριθεὶς
  choice: respondendo
  rationale: Reproduz o particípio aoristo e o idioma narrativo de ἀποκρίνομαι de modo natural em português, mesmo sem uma pergunta explícita imediatamente anterior.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: O artigo grego diante do nome próprio não é normalmente expresso em português neste contexto.
- source_word: πάλιν
  choice: tornou a
  rationale: A locução portuguesa marca com naturalidade a repetição indicada por πάλιν e liga-se diretamente a «falar».
- source_word: εἶπεν
  choice: falar
  rationale: Na construção «tornou a falar-lhes», evita a repetição pouco elegante de «disse... dizendo» sem perder o ato de fala.
- source_word: ἐν παραβολαῖς
  choice: em parábolas
  rationale: Mantém a forma tradicional e transparente para o valor de meio ou modo da expressão preposicional.
- source_word: αὐτοῖς
  choice: -lhes
  rationale: O pronome dativo identifica de modo conciso e natural os destinatários da fala de Jesus.
- source_word: λέγων
  choice: dizendo
  rationale: Conserva o particípio que introduz o conteúdo do discurso a seguir.
theological_decisions:
- issue: Força idiomática de ἀποκριθεὶς sem pergunta explícita imediatamente anterior
  choice: «respondendo»
  alternative: «tomando novamente a palavra» ou omissão do particípio
  rationale: «Respondendo» preserva o idioma narrativo grego e a continuidade do discurso sem transformar a expressão em uma afirmação teológica nem pressupor uma pergunta formal.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «tornou a falar-lhes» é natural e preserva a ideia de repetição; «respondendo» mantém a leve tensão do idioma narrativo grego.
