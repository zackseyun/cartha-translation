  text: λέγουσιν ⸀αὐτῷ· Καίσαρος. τότε λέγει αὐτοῖς· Ἀπόδοτε οὖν τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/021.yaml
  text: They said to him[a], “Caesar’s.” Then he said to them, “Therefore render to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: pt
  text: 'Eles lhe responderam: “De César”. Então ele lhes disse: “Deem, portanto, a César o que é de César e a Deus o que é de Deus”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Devolvam a César... e a Deus...”. O verbo grego pode significar “dar”, “devolver”, “pagar” ou “entregar o que é devido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Eles lhe responderam
  rationale: O presente histórico grego é vertido pelo pretérito, natural na narrativa portuguesa; “responderam” explicita de modo idiomático a função da fala no diálogo, sem acrescentar conteúdo.
- source_word: Καίσαρος
  choice: De César
  rationale: O genitivo responde à pergunta implícita sobre a imagem e a inscrição da moeda; “De César” é mais natural em português do que uma construção possessiva.
- source_word: τότε λέγει αὐτοῖς
  choice: Então ele lhes disse
  rationale: “Então” preserva a progressão do diálogo, e o presente histórico λέγει é traduzido pelo pretérito para fluidez narrativa.
- source_word: Ἀπόδοτε
  choice: Deem
  rationale: No contexto, ἀποδίδωμι pode significar dar, devolver ou pagar o que é devido. “Deem” produz uma ordem clara e natural, enquanto a nota conserva a amplitude lexical.
- source_word: οὖν
  choice: portanto
  rationale: Marca a inferência extraída da resposta deles acerca da moeda.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: a César o que é de César
  rationale: Preserva a formulação equilibrada e idiomática da máxima, bem como a relação de pertencimento expressa pelo genitivo.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: a Deus o que é de Deus
  rationale: Mantém o paralelismo retórico com a primeira oração e a referência ao Deus único no contexto judaico.
theological_decisions:
- issue: Alcance da ordem de Jesus quanto às obrigações civis e divinas
  choice: Manter em paralelo o que pertence a César e o que pertence a Deus, sem explicar os limites de cada esfera.
  alternative: Restringir a frase apenas ao pagamento de impostos ou apresentá-la como endosso de autoridade estatal absoluta.
  rationale: O grego distingue as duas obrigações, mas não oferece aqui uma teoria política completa. A tradução preserva tanto a obrigação cívica quanto a reivindicação divina, sem resolver a tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “a César o que é de César” conserva a cadência tradicional sem recorrer ao pouco corrente “tributem” ou ao mais formal “restituam”. O marcador [a] aparece no texto e remete à amplitude semântica de Ἀπόδοτε.
