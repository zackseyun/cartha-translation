  text: οἱ δὲ ἀμελήσαντες ἀπῆλθον, ⸀ὃς μὲν εἰς τὸν ἴδιον ἀγρόν, ⸁ὃς δὲ ⸀ἐπὶ τὴν ἐμπορίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: pt
  text: Mas eles não fizeram caso[a] e foram embora, um para o seu próprio campo, outro para os seus negócios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «desconsideraram» ou «negligenciaram»; no contexto, o objeto implícito é o convite do rei.
    reason: alternativa lexical e esclarecimento do objeto implícito
lexical_decisions:
- source_word: ἀμελήσαντες
  choice: não deram atenção
  rationale: O particípio expressa descaso ou falta de interesse. A formulação é natural em português e mantém implícito o objeto, recuperável no contexto como o convite do rei.
- source_word: ἀπῆλθον
  choice: foram embora
  rationale: Expressa com naturalidade o afastamento dos convidados diante da convocação, sem a formalidade maior de «partiram».
- source_word: ὃς μὲν ... ὃς δὲ
  choice: um ... outro
  rationale: Reproduz de modo idiomático a distribuição contrastiva da construção grega.
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: para o seu próprio campo
  rationale: «Campo» corresponde diretamente a ἀγρός, e «seu próprio» preserva a ênfase de ἴδιον nos interesses particulares.
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: para os seus negócios
  rationale: ἐμπορία indica atividade comercial. «Negócios» é uma expressão contemporânea e natural; o plural idiomático em português não altera o sentido coletivo da atividade.
theological_decisions:
- issue: Objeto implícito de ἀμελήσαντες
  choice: Manter o objeto implícito em «não deram atenção», com nota indicando que o contexto aponta para o convite do rei.
  alternative: «Ignoraram o convite» ou «não fizeram caso dele».
  rationale: O grego não explicita o objeto. A redação conserva essa característica sem perder clareza, enquanto a nota registra a referência contextual sem introduzir conteúdo doutrinário.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Não deram atenção» e «foram embora» são correntes sem ser coloquiais em excesso; «negócios» comunica naturalmente a atividade comercial.
