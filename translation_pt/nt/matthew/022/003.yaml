source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: pt
  text: E enviou seus servos[a] para chamar os que já haviam sido convidados[b] para o banquete de casamento[c], e eles não quiseram vir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «escravos». O termo grego pode designar tanto servos como escravos; aqui, «servos» destaca sua função como agentes do rei.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, mais literalmente: «os que já haviam sido chamados». No contexto, trata-se dos que já tinham recebido o convite.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «para a festa de casamento».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: O aoristo de ἀποστέλλω é expresso naturalmente por «enviou», sem acrescentar a nuance mais forte de «despachou».
- source_word: δούλους
  choice: servos
  rationale: δοῦλος pode indicar servos ou escravos. Nesta parábola, a função deles como agentes do rei está em primeiro plano; «servos» mantém o registro bíblico e é natural em português.
- source_word: καλέσαι
  choice: para chamar
  rationale: O infinitivo indica a finalidade do envio. «Chamar» preserva, na medida do possível, a ligação lexical com κεκλημένους, embora o particípio seja vertido contextualmente como «convidados».
- source_word: κεκλημένους
  choice: os que já haviam sido convidados
  rationale: O particípio perfeito passivo indica pessoas anteriormente chamadas ou convidadas. No contexto de um casamento, «convidados» comunica com clareza o sentido, e «já haviam sido» preserva o aspecto anterior resultante do perfeito.
- source_word: εἰς τοὺς γάμους
  choice: para o banquete de casamento
  rationale: O plural γάμοι pode designar as celebrações nupciais e, neste contexto, o banquete. A formulação deixa claro que se trata da refeição festiva.
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: mas eles não quiseram vir
  rationale: A expressão salienta a vontade dos convidados. «Não quiseram vir» é natural e fiel, sem intensificar para «recusaram-se».
theological_decisions:
- issue: Sentido de δοῦλος na narrativa parabólica
  choice: servos
  alternative: escravos
  rationale: O vínculo jurídico ou social dos enviados não é o foco da passagem; sua função como agentes do rei é central. A alternativa é registrada para não apagar a extensão semântica do termo grego.
- issue: Relação entre καλέσαι e κεκλημένους
  choice: «chamar os que já haviam sido convidados»
  alternative: «chamar os que já haviam sido chamados»
  rationale: A tradução escolhida preserva parcialmente a repetição e torna explícito o sentido de convite no contexto do banquete. A alternativa mais formal é mantida em nota.
- issue: Força volitiva de οὐκ ἤθελον
  choice: «não quiseram vir»
  alternative: «recusaram-se a vir»
  rationale: A escolha conserva a ênfase na falta de vontade sem converter a expressão em uma recusa formal mais enfática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a sequência narrativa do grego e usa «mas» para transmitir naturalmente o contraste de καί antes da resposta negativa. Os marcadores foram agrupados ao fim do versículo para não interromper excessivamente a leitura, e cada um corresponde a uma alternativa lexical presente no texto.
