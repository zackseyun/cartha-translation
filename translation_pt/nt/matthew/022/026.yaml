- source_word: ὁμοίως
  choice: O mesmo aconteceu
  rationale: O advérbio retoma elipticamente o que ocorreu no versículo anterior. Em português, explicitar “aconteceu” produz uma frase natural sem alterar o sentido contextual.
- source_word: καὶ ὁ δεύτερος καὶ ὁ τρίτος
  choice: também com o segundo e o terceiro
  rationale: Os ordinais substantivados referem-se aos irmãos já mencionados. Mantém-se a elipse de “irmão”, enquanto “também” representa o primeiro καί e a coordenação preserva a sequência.
- source_word: ἕως τῶν ἑπτά
  choice: até o sétimo
  rationale: A expressão indica que o mesmo ocorreu sucessivamente até chegar ao último dos sete. “Até o sétimo” é a formulação portuguesa mais natural e comunica o limite inclusivo da série.
