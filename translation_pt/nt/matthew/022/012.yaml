source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἑταῖρε, πῶς εἰσῆλθες ὧδε μὴ ἔχων ἔνδυμα γάμου; ὁ δὲ ἐφιμώθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: pt
  text: 'E ele lhe disse: “Amigo, como você entrou aqui sem traje de casamento?” Mas o homem ficou sem palavras.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi silenciado”. O verbo grego também pode significar, literalmente, “foi amordaçado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Amigo
  rationale: Forma de tratamento que, neste contexto, soa cortês, mas distante e repreensiva; “amigo” é natural em português e preserva a ironia sem intensificar a hostilidade.
- source_word: πῶς
  choice: como
  rationale: Pergunta pela maneira ou circunstância da entrada, sem transformar a pergunta em uma indagação explícita sobre o motivo.
- source_word: εἰσῆλθες ὧδε
  choice: você entrou aqui
  rationale: Expressa de modo corrente o ato já realizado de entrar naquele lugar.
- source_word: μὴ ἔχων
  choice: sem
  rationale: Traduz naturalmente a construção participial que indica a falta da vestimenta exigida.
- source_word: ἔνδυμα γάμου
  choice: traje de casamento
  rationale: Mantém o singular e a associação com a celebração de casamento sem especificar indevidamente o tipo exato de peça de roupa.
- source_word: ἐφιμώθη
  choice: ficou sem palavras
  rationale: Comunica em português natural que o homem não conseguiu responder, preservando em nota o valor passivo e a imagem mais literal do verbo.
theological_decisions:
- issue: Tom da forma de tratamento dirigida ao convidado sem o traje adequado
  choice: “Amigo”, cortês na forma, mas implicitamente repreensivo no contexto
  alternative: “Companheiro” ou uma forma mais áspera de interpelação
  rationale: A tradução conserva a tensão narrativa sem transformar a fala em expressão inequívoca de afeto nem acrescentar desprezo ausente do termo grego.
- issue: Sentido de ἐφιμώθη
  choice: Expressão resultativa “ficou sem palavras” no texto principal
  alternative: “foi silenciado” ou, mais literalmente, “foi amordaçado”
  rationale: O contexto destaca a incapacidade de responder. A formulação principal é clara e idiomática, enquanto a nota preserva tanto a voz passiva quanto a imagem forte do verbo grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” evita a ambiguidade regional de “tu” e mantém a interpelação direta; “traje de casamento” é claro sem definir uma peça específica. O marcador da nota foi colocado junto à expressão que ela explica.
