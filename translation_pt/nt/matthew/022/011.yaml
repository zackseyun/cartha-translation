id: MAT.22.11
reference: Matthew 22:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: pt
  text: Mas, quando o rei entrou para ver os convidados reclinados à mesa[a], viu ali um homem que não estava vestido com traje de casamento.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “os que estavam reclinados”, refletindo a postura habitual dos convidados em banquetes formais da época.
    reason: cultural_note
  - marker: b
    text: 'Ou: “que não vestia traje de casamento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: quando ... entrou
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal; a oração temporal soa natural em português e preserva a sequência narrativa.
- source_word: δὲ
  choice: Mas
  rationale: Marca o avanço da narrativa com leve contraste, introduzindo a tensão causada pela observação do rei.
- source_word: ὁ βασιλεὺς
  choice: o rei
  rationale: Equivalente direto e corrente no contexto de uma parábola real.
- source_word: θεάσασθαι
  choice: para ver
  rationale: O infinitivo expressa finalidade. A formulação é natural e não torna a ação mais formal do que o grego exige.
- source_word: τοὺς ἀνακειμένους
  choice: os convidados reclinados à mesa
  rationale: No contexto de um banquete, o verbo se refere à postura costumeira de reclinar-se para comer; 'convidados' explicita naturalmente o papel indicado pelo contexto.
- source_word: εἶδεν ἐκεῖ
  choice: viu ali
  rationale: Reproduz de modo direto o verbo de percepção e o advérbio de lugar.
- source_word: ἄνθρωπον
  choice: um homem
  rationale: O substantivo singular designa um indivíduo masculino na narrativa, não a humanidade em sentido genérico.
- source_word: οὐκ ἐνδεδυμένον
  choice: que não vestia
  rationale: Expressa em português corrente o estado presente descrito pelo particípio perfeito, sem sugerir apenas o ato momentâneo de vestir-se.
- source_word: ἔνδυμα γάμου
  choice: traje de casamento
  rationale: Mantém o substantivo singular e comunica uma roupa apropriada para a celebração nupcial, sem especificar uma peça que o texto não identifica.
theological_decisions:
- issue: Imagem parabólica da postura no banquete
  choice: Preservar a referência aos convidados reclinados à mesa.
  alternative: Traduzir apenas como 'os convidados' ou, mais literalmente, 'os que estavam reclinados'.
  rationale: A escolha conserva o cenário histórico do banquete antigo e, ao mesmo tempo, torna clara ao leitor moderno a função das pessoas mencionadas.
- issue: Natureza do traje nupcial
  choice: Traduzir como 'traje de casamento', sem definir uma peça específica nem explicar seu simbolismo.
  alternative: Usar 'roupas de casamento' ou interpretar o traje como símbolo de uma realidade teológica determinada.
  rationale: O grego emprega um substantivo singular amplo. A tradução preserva a imagem e sua tensão teológica sem impor uma identificação doutrinária não expressa neste versículo.
- issue: Referência masculina de ἄνθρωπον
  choice: um homem
  alternative: uma pessoa ou alguém
  rationale: A personagem é apresentada no singular masculino; manter isso respeita a forma narrativa do texto-fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita arcaísmos, preserva a postura histórica do banquete e mantém a expressão singular e relativamente aberta para o traje nupcial.
