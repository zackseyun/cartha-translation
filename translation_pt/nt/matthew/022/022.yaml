  text: And hearing this[a], they were amazed, and leaving him, they went away.
translation:
  language: pt
  text: Ao ouvirem isso[a], ficaram admirados e, deixando-o, foram embora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Depois de ouvirem, ficaram maravilhados e, deixando-o, partiram.”'
    reason: Alternativa lexical e sintática que reproduz mais de perto os particípios e emprega equivalentes portugueses mais formais.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Ao ouvirem isso
  rationale: O particípio aoristo ativo tem valor temporal e indica uma ação anterior à reação principal. “Isso” explicita naturalmente em português o objeto implícito, isto é, a resposta de Jesus no contexto.
- source_word: ἐθαύμασαν
  choice: ficaram admirados
  rationale: θαυμάζω expressa admiração ou espanto. “Ficaram admirados” é natural, atual e preserva a reação sem intensificá-la indevidamente.
- source_word: ἀφέντες αὐτὸν
  choice: deixando-o
  rationale: Neste contexto, ἀφίημι significa deixar alguém e afastar-se dele. A tradução direta evita acrescentar “sozinho”, ideia que não está expressa no grego.
- source_word: ἀπῆλθαν
  choice: foram embora
  rationale: ἀπέρχομαι indica ir-se ou afastar-se. “Foram embora” é uma formulação clara e corrente em português.
- source_word: καὶ ... καὶ
  choice: e ... e
  rationale: A coordenação conserva a sequência simples e rápida das ações no texto grego; a pontuação portuguesa torna essa sequência natural.
