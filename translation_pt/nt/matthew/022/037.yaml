  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη αὐτῷ· Ἀγαπήσεις κύριον τὸν θεόν σου ἐν ὅλῃ ⸀τῇ καρδίᾳ σου καὶ ἐν ὅλῃ ⸁τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/037.yaml
  text: And he said to him[c][b][a], “You shall love the Lord your God with all your heart and with all your soul and with all your mind.”
translation:
  language: pt
  text: 'Ele lhe disse: “Amarás o Senhor, seu Deus, com todo o seu coração[a], com toda a sua alma[b] e com toda a sua mente[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir “em todo o seu coração”, “em toda a sua alma” e “em toda a sua mente”. A preposição grega é ἐν (“em”), mas, nesta construção, “com” é mais natural em português.
    reason: lexical_alternative
  - marker: b
    text: A palavra grega ψυχή também pode significar “vida” ou “a própria pessoa”, conforme o contexto; aqui, “alma” preserva a formulação abrangente do mandamento.
    reason: lexical_alternative
  - marker: c
    text: A palavra grega διάνοια também pode ser traduzida por “entendimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ele lhe disse
  rationale: A partícula δέ funciona aqui como conexão leve na progressão do diálogo; não exige uma adversativa forte em português. O pronome mantém o sujeito expresso sem acrescentar o nome de Jesus ao texto grego.
- source_word: ἔφη αὐτῷ
  choice: lhe disse
  rationale: φημί introduz fala direta, e αὐτῷ indica o destinatário. “Lhe disse” é simples, natural e não acrescenta a ideia de resposta que o verbo, por si só, não explicita.
- source_word: Ἀγαπήσεις
  choice: Ame
  rationale: O futuro do indicativo reproduz a forma da citação de Deuteronômio, mas tem força de mandamento. Em português moderno, o imperativo “Ame” comunica essa força com clareza, sem soar como mera previsão.
- source_word: κύριον τὸν θεόν σου
  choice: o Senhor, seu Deus
  rationale: “Senhor” preserva a ressonância pactual da citação, e “seu Deus” expressa naturalmente a relação indicada pelo possessivo grego.
- source_word: ἐν ὅλῃ
  choice: com todo o
  rationale: Embora ἐν signifique formalmente “em”, nesta construção indica a totalidade com que o amor é dirigido a Deus. “Com todo o” é idiomático em português e permite preservar a repetição enfática.
- source_word: καρδίᾳ
  choice: coração
  rationale: “Coração” é o equivalente estabelecido e representa o interior da pessoa, não apenas os sentimentos.
- source_word: ψυχῇ
  choice: alma
  rationale: ψυχή pode designar alma, vida ou a própria pessoa. “Alma” preserva a distinção lexical da enumeração e a formulação reconhecível da citação.
- source_word: διανοίᾳ
  choice: mente
  rationale: διάνοια designa a faculdade de pensar e compreender. “Mente” é atual, conciso e preserva a dimensão intelectual do mandamento.
theological_decisions:
- issue: Forma verbal do mandamento citado de Deuteronômio
  choice: Usar o imperativo “Ame” para comunicar a força normativa do futuro grego
  alternative: Usar “Amarás” para reproduzir formalmente o futuro do indicativo
  rationale: O grego Ἀγαπήσεις conserva a forma da citação bíblica, mas funciona como mandamento. “Ame” evita que leitores modernos entendam a frase como simples previsão, sem alterar seu conteúdo normativo.
- issue: Preservação da tríade “coração, alma e mente”
  choice: Manter os três termos distintos
  alternative: Reuni-los numa paráfrase como “com todo o seu ser”
  rationale: A enumeração do texto grego apresenta aspectos distintos e complementares da devoção integral. Mantê-los evita apagar a forma e a tensão semântica da citação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento por “seu” evita uma alternância artificial entre “tu” e “você”. A pontuação de “o Senhor, seu Deus” torna explícita a aposição e mantém a leitura natural.
