  text: εἰ οὖν Δαυὶδ καλεῖ αὐτὸν κύριον, πῶς υἱὸς αὐτοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/045.yaml
  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: pt
  text: Se, pois, Davi o chama de Senhor[a], como pode ele ser seu filho?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, explicitando o contexto: “Se, pois, Davi chama o Messias de ‘Senhor’, como pode ele ser seu filho?”'
    reason: Explicita o referente contextual do pronome sem inseri-lo no texto principal.
lexical_decisions:
- source_word: εἰ οὖν
  choice: Se, então
  rationale: Preserva tanto a força condicional de εἰ como a inferência marcada por οὖν, em formulação natural no argumento.
- source_word: Δαυὶδ
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: καλεῖ
  choice: chama
  rationale: Mantém o sentido de chamar ou designar alguém por um título, apropriado à citação do Salmo 110.1.
- source_word: αὐτὸν
  choice: o
  rationale: Pronome objeto que retoma, pelo contexto anterior, o Messias, sem tornar explícito no texto o que o grego deixa pronominal.
- source_word: κύριον
  choice: Senhor
  rationale: Conserva o título honorífico e sua ressonância cristológica na citação do salmo; “mestre” enfraqueceria essa associação.
- source_word: πῶς
  choice: como
  rationale: Expressa diretamente a pergunta sobre a relação lógica entre as duas afirmações.
- source_word: υἱὸς αὐτοῦ
  choice: seu filho
  rationale: Preserva a linguagem filial e régia, bem como a tensão deliberada do argumento; “descendente” seria mais explicativo.
- source_word: ἐστιν
  choice: é
  rationale: Tradução direta e natural da cópula no presente.
theological_decisions:
- issue: Força messiânica e cristológica de Davi chamar o Messias de “Senhor”
  choice: Manter “Senhor” e “seu filho” sem explicar a relação no corpo do versículo.
  alternative: “Se, então, Davi chama o Messias de ‘Senhor’, como ele é filho de Davi?”
  rationale: O grego emprega um pronome cujo referente vem do contexto. A tradução preserva a tensão entre a filiação davídica e o senhorio, sem acrescentar uma solução doutrinária nem explicitar no texto principal o substantivo “Messias”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal “o chama” é natural nesse registro; a ordem da frase acompanha de perto o argumento grego sem soar rígida.
