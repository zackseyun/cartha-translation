lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição narrativa com leve contraste em relação ao episódio anterior, de forma natural em português.
- source_word: Φαρισαῖοι
  choice: os fariseus
  rationale: Forma tradicional e amplamente reconhecida em português para o nome desse grupo judaico.
- source_word: ἀκούσαντες
  choice: ao ouvirem
  rationale: Expressa de modo idiomático o valor temporal do particípio aoristo, mantendo a relação entre ouvir a notícia e reunir-se.
- source_word: ἐφίμωσεν
  choice: havia silenciado
  rationale: Comunica o sentido figurado contextual de fazer calar em debate; a imagem mais literal de amordaçar é preservada em nota.
- source_word: Σαδδουκαίους
  choice: os saduceus
  rationale: Forma tradicional e amplamente reconhecida em português para o nome desse grupo judaico.
- source_word: συνήχθησαν
  choice: reuniram-se
  rationale: Traduz naturalmente o aoristo passivo com sentido intransitivo de congregar-se ou juntar-se como grupo.
- source_word: ἐπὶ τὸ αὐτό
  choice: reuniram-se
  rationale: A ideia de estarem juntos é incorporada naturalmente ao verbo pronominal; uma tradução separada como 'juntos' seria redundante em português, enquanto 'no mesmo lugar' especificaria além do necessário.
