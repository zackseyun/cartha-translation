  text: καὶ οὐδεὶς ἐδύνατο ⸂ἀποκριθῆναι αὐτῷ⸃ λόγον, οὐδὲ ἐτόλμησέν τις ἀπ’ ἐκείνης τῆς ἡμέρας ἐπερωτῆσαι αὐτὸν οὐκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/046.yaml
  text: And no one was able to answer him a word[a], nor did anyone dare from that day on to question him any longer.
translation:
  language: pt
  text: E ninguém pôde responder-lhe uma palavra sequer,[a] e, daquele dia em diante, ninguém mais ousou fazer-lhe perguntas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “responder-lhe nem uma palavra”. A expressão grega diz literalmente “responder-lhe uma palavra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: ninguém
  rationale: Pronome indefinido negativo que expressa a ausência total de alguém capaz de responder; “ninguém” é a forma direta e natural em português.
- source_word: ἐδύνατο
  choice: conseguia
  rationale: O imperfeito de δύναμαι indica incapacidade naquele momento narrativo; “conseguia” comunica com naturalidade a ideia de não ser capaz.
- source_word: ἀποκριθῆναι αὐτῷ λόγον
  choice: lhe responder uma palavra sequer
  rationale: Preserva o elemento explícito λόγον (“palavra”) e expressa idiomaticamente em português a ênfase negativa da construção, sem reduzi-la ao simples “responder-lhe”.
- source_word: οὐδὲ
  choice: nem
  rationale: Liga estreitamente a segunda oração negativa à primeira, de modo natural em português.
- source_word: ἐτόλμησέν τις
  choice: alguém ousou
  rationale: O aoristo de τολμάω denota atrever-se ou ter coragem para agir; sob o alcance de “nem”, a construção portuguesa é clara e fiel.
- source_word: ἀπ’ ἐκείνης τῆς ἡμέρας
  choice: daquele dia em diante
  rationale: Marca o ponto inicial de uma situação que continua posteriormente; esta expressão é idiomática e temporalmente precisa.
- source_word: ἐπερωτῆσαι αὐτὸν
  choice: fazer-lhe perguntas
  rationale: No contexto, refere-se a dirigir perguntas a Jesus em ambiente de controvérsia. “Fazer-lhe perguntas” soa mais natural do que “questioná-lo” e evita a força excessiva de “interrogá-lo”.
- source_word: οὐκέτι
  choice: mais
  rationale: Com a negação introduzida por “nem”, “mais” exprime de maneira idiomática a cessação das perguntas daquele ponto em diante.
theological_decisions:
- issue: Força narrativa do silêncio dos interlocutores depois da resposta de Jesus
  choice: Apresentar somente a incapacidade de responder e a falta de ousadia para continuar fazendo perguntas
  alternative: Explicitar na tradução a sabedoria superior ou a autoridade de Jesus
  rationale: Embora o contexto sugira a vitória de Jesus na controvérsia, o versículo limita-se a narrar que ninguém conseguia responder e que ninguém ousou fazer-lhe mais perguntas. A tradução não acrescenta uma conclusão teológica ao enunciado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “daquele dia em diante” conserva o marco temporal, e “fazer-lhe mais perguntas” transmite o contexto de questionamento sem tornar o verbo excessivamente hostil.
