  text: Ἐν ἐκείνῃ τῇ ἡμέρᾳ προσῆλθον αὐτῷ Σαδδουκαῖοι, ⸀λέγοντες μὴ εἶναι ἀνάστασιν, καὶ ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: pt
  text: Naquele dia, saduceus, que dizem não haver ressurreição, aproximaram-se dele e lhe perguntaram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Naquele dia
  rationale: Expressão temporal idiomática em português, que preserva a referência ao mesmo dia da narrativa.
- source_word: προσῆλθον αὐτῷ
  choice: aproximaram-se de Jesus
  rationale: προσέρχομαι indica vir até alguém ou aproximar-se. O nome “Jesus” torna claro o referente do pronome sem alterar o sentido.
- source_word: Σαδδουκαῖοι
  choice: alguns saduceus
  rationale: “Saduceus” é a forma tradicional do nome do grupo em português. O artigo indefinido plural, natural neste contexto, não implica que todos os membros do grupo estivessem presentes.
- source_word: λέγοντες μὴ εἶναι ἀνάστασιν
  choice: que dizem não haver ressurreição
  rationale: O particípio pode caracterizar os saduceus por sua posição habitual. Esta formulação expressa naturalmente em português o conteúdo da negação e evita a leitura pouco clara de que eles a estariam declarando naquele momento.
- source_word: ἀνάστασιν
  choice: ressurreição
  rationale: Termo português corrente e teologicamente preciso para ἀνάστασις neste contexto.
- source_word: ἐπηρώτησαν αὐτὸν
  choice: lhe fizeram uma pergunta
  rationale: Expressa de modo natural o ato de perguntar a Jesus. O contexto subsequente mostrará o caráter desafiador da pergunta sem que seja necessário acrescentá-lo aqui.
theological_decisions:
- issue: Caracterização da negação dos saduceus
  choice: que dizem não haver ressurreição
  alternative: dizendo que não há ressurreição
  rationale: A construção relativa preserva a ideia de que a negação da ressurreição caracteriza esse grupo, sem apresentar a afirmação como verdadeira nem acrescentar explicações doutrinárias.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para fluência, preservando a informação e a tensão teológica do grego.
