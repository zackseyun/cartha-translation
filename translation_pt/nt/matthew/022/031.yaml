  text: περὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶν οὐκ ἀνέγνωτε τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: pt
  text: 'Quanto à ressurreição dos mortos, vocês não leram o que Deus disse a vocês:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ
  choice: Quanto a
  rationale: περί com o genitivo introduz o assunto, enquanto δέ assinala a transição. “Quanto a” é natural em português e não transforma a transição em contraste forte nem acrescenta um advérbio temporal.
- source_word: ἀναστάσεως τῶν νεκρῶν
  choice: ressurreição dos mortos
  rationale: A expressão designa a ressurreição corporal em debate e conserva o genitivo, apresentando os mortos como aqueles que ressuscitam.
- source_word: οὐκ ἀνέγνωτε
  choice: vocês não leram
  rationale: O aoristo é vertido naturalmente pelo pretérito perfeito. Na pergunta retórica, a formulação põe em causa a leitura conhecida das Escrituras.
- source_word: τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ
  choice: o que Deus lhes disse
  rationale: A construção ativa é idiomática em português e preserva tanto Deus como agente da fala quanto os ouvintes como seus destinatários.
- source_word: λέγοντος
  choice: dizendo
  rationale: O particípio introduz a citação direta do versículo seguinte; “dizendo” mantém essa ligação sem antecipar o conteúdo.
theological_decisions:
- issue: Autoria divina e atualidade do endereço das Escrituras
  choice: o que Deus lhes disse
  alternative: o que lhes foi dito por Deus
  rationale: A formulação preserva a afirmação explícita de que Deus falou e de que a palavra se dirigia aos ouvintes de Jesus, sem acrescentar uma teoria de inspiração.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural ὑμῖν. A ordem foi levemente naturalizada para evitar uma passiva pesada, sem perda semântica. O versículo termina com dois-pontos porque introduz a citação do versículo seguinte.
