  text: Ἔσεσθε οὖν ὑμεῖς τέλειοι ⸀ὡς ὁ πατὴρ ὑμῶν ὁ ⸀οὐράνιος τέλειός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/048.yaml
  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: pt
  text: Portanto, sejam vocês perfeitos[a], como o Pai celestial de vocês é perfeito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “completos”, “íntegros” ou “maduros”. O grego τέλειος pode indicar plenitude, inteireza ou maturidade, além de perfeição.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔσεσθε
  choice: sejam
  rationale: O futuro indicativo de εἰμί tem força imperativa ou exortativa no contexto. Em português moderno, “sejam” comunica essa força com naturalidade e dignidade.
- source_word: οὖν
  choice: Portanto
  rationale: Preserva a inferência que liga a exortação ao ensino anterior, especialmente ao amor pelos inimigos.
- source_word: ὑμεῖς
  choice: vocês
  rationale: O pronome explícito no grego é mantido para conservar a ênfase. “Vocês” oferece ampla legibilidade brasileira sem perder clareza internacional.
- source_word: τέλειοι / τέλειός
  choice: perfeitos / perfeito
  rationale: Mantém a correspondência lexical e a força retórica da repetição grega. A amplitude semântica do termo é registrada em nota.
- source_word: ὡς
  choice: como
  rationale: Introduz de modo direto e natural a comparação com o Pai.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: o Pai celestial de vocês
  rationale: Reproduz a relação possessiva e o adjetivo atributivo, usando uma formulação clara e corrente em português.
theological_decisions:
- issue: Sentido de τέλειος na exortação ética
  choice: “perfeito” no texto principal, com alternativas semânticas em nota
  alternative: “completo”, “íntegro” ou “maduro”
  rationale: “Perfeito” é a tradução mais direta e preserva a exigência ética incisiva do texto; a nota conserva a genuína amplitude do termo, que no contexto pode salientar inteireza ou plenitude no amor, sem transformar a tradução em explicação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem “como perfeito é” preserva a repetição enfática de τέλειος sem soar excessivamente rígida. O marcador [a] aparece imediatamente após o termo ao qual se refere.
