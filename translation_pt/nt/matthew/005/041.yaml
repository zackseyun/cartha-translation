  yaml_path: translation/nt/matthew/005/041.yaml
  text: And whoever forces you to go one mile[c][b][a], go with him two miles.
translation:
  language: pt
  text: E, se alguém obrigar você a andar uma milha, vá com ele duas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, duas milhas. O verbo traduzido por “obrigar” pode indicar que alguém era requisitado para prestar serviço por uma autoridade oficial, como acontecia no mundo romano.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: se alguém
  rationale: Introduz um caso geral e indefinido; esta formulação é natural em português e preserva a abrangência do grego.
- source_word: ἀγγαρεύσει
  choice: obrigar você a andar
  rationale: O verbo indica imposição de serviço, muitas vezes por autoridade oficial. “Obrigar” preserva a coerção, e “andar” expressa naturalmente o deslocamento indicado pela distância.
- source_word: μίλιον ἕν
  choice: uma milha
  rationale: Refere-se a uma milha romana. A tradução mantém a unidade concreta do texto sem convertê-la para uma medida moderna.
- source_word: ὕπαγε
  choice: vá
  rationale: Imperativo direto e idiomático que comunica prosseguir ou ir.
- source_word: μετ’ αὐτοῦ
  choice: com ele
  rationale: Expressa diretamente a ideia de acompanhamento indicada por μετά com o genitivo.
- source_word: δύο
  choice: duas
  rationale: O substantivo “milhas” fica subentendido no grego. Em português, o feminino “duas” retoma de modo claro e natural “milha”, preservando a elipse.
theological_decisions:
- issue: Contexto histórico-social do serviço imposto por autoridade
  choice: Traduzir como uma exigência coerciva sem mencionar soldados romanos no texto principal.
  alternative: Explicitar que se trata de requisição feita por soldados romanos.
  rationale: O verbo e a referência à milha evocam fortemente a requisição oficial no contexto romano, mas o texto grego não menciona soldados. A tradução preserva a coerção sem tornar explícito um agente que o original deixa implícito.
translation_notes:
  register: Português moderno, claro e digno, com construção amplamente compreensível no Brasil e em outros contextos lusófonos. “Você” favorece a legibilidade brasileira; o singular acompanha o pronome grego σε. A elipse de “milhas” após “duas” é natural em português.
