  text: ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: pt
  text: 'Em verdade lhe digo: você certamente não sairá de lá até pagar o último quadrante.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O quadrante era uma pequena moeda romana.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν
  choice: Em verdade
  rationale: Na fórmula sinótica, introduz uma declaração solene e autorizada; «Em verdade» comunica essa força em português corrente e digno.
- source_word: λέγω σοι
  choice: lhe digo
  rationale: Reproduz de modo natural a fórmula de discurso direto no singular, preservando sua autoridade.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: você certamente não sairá
  rationale: A combinação οὐ μή com o subjuntivo aoristo expressa negação enfática; «certamente não» torna explícita essa força sem linguagem arcaica.
- source_word: ἐκεῖθεν
  choice: de lá
  rationale: Indica movimento para fora daquele lugar e corresponde naturalmente ao verbo «sair».
- source_word: ἕως ἂν ἀποδῷς
  choice: até pagar
  rationale: Expressa o limite futuro da permanência e a quitação requerida; em português, o infinitivo após «até» é natural e não elimina a ideia contextual de pagamento completo.
- source_word: τὸν ἔσχατον
  choice: o último
  rationale: Preserva diretamente a ideia da porção final do valor devido, sem intensificação desnecessária.
- source_word: κοδράντην
  choice: quadrante
  rationale: Mantém o nome tradicional em português da moeda romana específica, em vez de substituí-la por uma moeda moderna ou por um termo genérico; a nota esclarece seu caráter.
theological_decisions:
- issue: Se a tradução deve definir a imagem como juízo final, purgação ou apenas prisão por dívida
  choice: Preservar a imagem concreta de confinamento até o pagamento integral, sem determinar sua aplicação doutrinária.
  alternative: Traduzir ou explicar a frase explicitamente como metáfora do juízo divino ou de uma purgação após a morte.
  rationale: O grego afirma enfaticamente que a pessoa não sairá até pagar a última moeda, mas não identifica nesse versículo a natureza teológica precisa da prisão. A tradução conserva essa tensão e deixa a interpretação mais ampla em aberto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O singular é vertido por «você» e «lhe», evitando tanto arcaísmo quanto regionalismo excessivo. A ordem foi ajustada à sintaxe natural do português, mantendo a solenidade e a negação enfática do original.
