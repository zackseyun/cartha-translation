id: MAT.5.14
reference: Matthew 5:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ φῶς τοῦ κόσμου. οὐ δύναται πόλις κρυβῆναι ἐπάνω ὄρους κειμένη·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: pt
  text: Vocês são a luz do mundo. Uma cidade situada sobre um monte não pode ficar escondida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Vocês
  rationale: O pronome grego está explícito e tem valor enfático. “Vocês” expressa com naturalidade a segunda pessoa do plural no português contemporâneo de ampla legibilidade, enquanto o contexto e a posição inicial preservam a ênfase.
- source_word: τὸ φῶς
  choice: a luz
  rationale: Mantém o artigo definido e a metáfora direta do grego.
- source_word: τοῦ κόσμου
  choice: do mundo
  rationale: Reproduz naturalmente o genitivo e preserva a amplitude semântica de κόσμος, sem introduzir a interpretação mais finalística “para o mundo”.
- source_word: οὐ δύναται
  choice: não pode
  rationale: Equivalente português idiomático que preserva a ideia de impossibilidade.
- source_word: πόλις
  choice: Uma cidade
  rationale: “Cidade” é a correspondência normal de πόλις e conserva com clareza a imagem proverbial.
- source_word: κρυβῆναι
  choice: ficar escondida
  rationale: Expressa naturalmente em português o infinitivo passivo “ser/ficar escondida”; “ficar” combina bem com a condição visível e contínua da cidade.
- source_word: ἐπάνω ὄρους
  choice: sobre um monte
  rationale: ὄρος pode designar monte ou montanha. “Monte” evita exagerar a topografia e “sobre” conserva de modo natural a localização elevada.
- source_word: κειμένη
  choice: situada
  rationale: O particípio descreve a cidade como localizada ou assentada no monte. “Situada” é claro, atual e semanticamente próximo, sem sugerir necessariamente que alguém a colocou ali.
theological_decisions:
- issue: Identificação metafórica dos discípulos como luz
  choice: “Vocês são a luz do mundo”
  alternative: “Vocês são luz para o mundo”
  rationale: A tradução mantém a identificação metafórica direta e o genitivo do texto grego, sem ampliar seu sentido com uma formulação funcional ou doutrinária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por “vocês” como segunda pessoa plural internacionalmente compreensível e especialmente natural ao público brasileiro. A segunda frase permanece próxima da estrutura grega sem soar artificial.
