  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: pt
  text: Nem jure pela sua cabeça, porque você não pode tornar branco ou preto um só fio de cabelo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτε
  choice: Nem
  rationale: Dá continuidade à série coordenada de proibições do contexto anterior, com concisão natural em português.
- source_word: ἐν τῇ κεφαλῇ σου
  choice: pela sua cabeça
  rationale: Com ὀμόσῃς, a preposição introduz aquilo que é invocado no juramento; “jurar pela sua cabeça” reproduz naturalmente a expressão.
- source_word: ὀμόσῃς
  choice: jure
  rationale: O aoristo do subjuntivo com μήτε forma uma proibição; o presente do subjuntivo português expressa de modo claro e direto essa força.
- source_word: ὅτι
  choice: porque
  rationale: Introduz explicitamente a razão da proibição.
- source_word: οὐ δύνασαι
  choice: você não pode
  rationale: Expressa de modo corrente a incapacidade indicada por δύνασαι sem enfraquecer sua força.
- source_word: μίαν τρίχα
  choice: um só fio de cabelo
  rationale: “Um só” preserva a ênfase de μίαν, enquanto “fio de cabelo” é mais natural e inequívoco em português do que simplesmente “cabelo” neste contexto.
- source_word: λευκὴν ... ἢ μέλαιναν
  choice: branco ou preto
  rationale: Mantém os termos básicos de cor e o contraste direto do grego, sem interpretar “branco” como “grisalho”.
- source_word: ποιῆσαι
  choice: tornar
  rationale: No contexto predicativo, significa fazer com que algo adquira determinada qualidade; “tornar branco ou preto” é idiomático e preciso.
theological_decisions:
- issue: Alcance da proibição de jurar
  choice: Apresentar diretamente a proibição específica de jurar pela própria cabeça.
  alternative: Transformar o versículo numa afirmação doutrinária explícita sobre todo e qualquer juramento, ou restringi-lo apenas a fórmulas evasivas.
  rationale: O versículo menciona especificamente jurar pela própria cabeça e fundamenta a proibição na limitação humana. A tradução preserva esse alcance textual sem decidir debates teológicos mais amplos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” torna explícito o singular de σου e δύνασαι. Não se acrescentou nota, pois a redação portuguesa integra naturalmente a ênfase de μίαν em “um só fio de cabelo”; a nota do inglês parece associada a uma alternativa lexical, mas seu conteúdo corresponde à própria oração causal, não a “pela sua cabeça”.
