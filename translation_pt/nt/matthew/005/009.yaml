  text: μακάριοι οἱ εἰρηνοποιοί, ὅτι αὐτοὶ υἱοὶ θεοῦ κληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: pt
  text: Felizes os que promovem a paz, pois serão chamados filhos de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filhos e filhas de Deus”. O grego diz literalmente “filhos de Deus”, usando linguagem filial masculina plural com sentido representativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Felizes
  rationale: Em uma bem-aventurança, expressa uma condição favorecida e digna de celebração, não apenas uma emoção passageira; é natural e amplamente compreensível em português.
- source_word: εἰρηνοποιοί
  choice: os que promovem a paz
  rationale: 'Preserva o sentido agentivo do substantivo composto: pessoas que atuam para produzir ou estabelecer a paz, e não apenas pessoas pacíficas.'
- source_word: ὅτι
  choice: pois
  rationale: Introduz de modo natural a razão ou fundamento da bem-aventurança, preservando a relação causal.
- source_word: αὐτοὶ
  choice: '[implícito em] serão'
  rationale: O pronome enfático identifica precisamente os promotores da paz; em português, essa retomada é comunicada naturalmente pelo sujeito oculto da forma verbal, sem a rigidez de 'eles mesmos'.
- source_word: υἱοὶ θεοῦ
  choice: filhos de Deus
  rationale: Mantém a linguagem filial masculina plural do grego, que pode ter força representativa e inclusiva, sem reduzir a expressão a mero reconhecimento social.
- source_word: κληθήσονται
  choice: serão chamados
  rationale: Reproduz diretamente o futuro passivo de καλέω e preserva a abertura quanto ao agente da declaração.
theological_decisions:
- issue: Linguagem filial de gênero em υἱοὶ θεοῦ
  choice: filhos de Deus
  alternative: filhos e filhas de Deus / crianças de Deus
  rationale: A forma masculina plural do grego é mantida no texto, enquanto a nota esclarece sua possível força representativa e inclusiva. Isso preserva possíveis ressonâncias de condição filial sem excluir mulheres do referente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Os que promovem a paz” evita a possível leitura meramente passiva de “pacíficos” e soa mais natural do que o pouco corrente “pacificadores” em alguns contextos. O marcador da nota foi colocado após a expressão a que se refere.
