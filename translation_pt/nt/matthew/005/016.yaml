id: MAT.5.16
reference: Matthew 5:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: pt
  text: Da mesma forma, que a luz de vocês brilhe diante das pessoas, para que elas vejam as boas obras de vocês e glorifiquem o Pai de vocês, que está nos céus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Assim
  rationale: Retoma de modo natural a imagem anterior da lâmpada e indica a maneira pela qual a luz deve brilhar.
- source_word: λαμψάτω τὸ φῶς ὑμῶν
  choice: brilhe a luz de vocês
  rationale: Preserva o imperativo na terceira pessoa e o singular coletivo de 'luz', com uma construção corrente em português.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: diante das pessoas
  rationale: ἄνθρωποι designa aqui os seres humanos em geral; 'pessoas' comunica diretamente esse alcance sem sugerir apenas indivíduos do sexo masculino.
- source_word: ὅπως ἴδωσιν
  choice: para que elas vejam
  rationale: Expressa naturalmente a relação de propósito introduzida por ὅπως com o subjuntivo.
- source_word: ὑμῶν τὰ καλὰ ἔργα
  choice: as boas obras que vocês fazem
  rationale: Torna explícita em português corrente a relação possessiva, evitando a possível impressão de que as obras pertencem aos observadores; καλὰ é adequadamente vertido por 'boas'.
- source_word: δοξάσωσιν
  choice: glorifiquem
  rationale: Mantém o sentido religioso forte e tradicional de δοξάζω em relação a Deus.
- source_word: τὸν πατέρα ὑμῶν
  choice: o Pai de vocês
  rationale: Conserva a linguagem relacional e traduz com clareza o possessivo plural.
- source_word: τὸν ἐν τοῖς οὐρανοῖς
  choice: que está nos céus
  rationale: Preserva o plural grego οὐρανοῖς e permanece natural e inteligível em português.
theological_decisions:
- issue: Sentido genérico de ἀνθρώπων
  choice: diante das pessoas
  alternative: diante dos homens
  rationale: Neste contexto, o substantivo abrange seres humanos em geral. 'Pessoas' conserva o referente real do grego e evita uma leitura exclusivamente masculina.
- issue: Plural οὐρανοῖς
  choice: que está nos céus
  alternative: que está no céu
  rationale: O plural da fonte é mantido sem impor uma distinção cosmológica além daquilo que o texto afirma.
- issue: Relação entre boas obras e glorificação de Deus
  choice: para que elas vejam as boas obras que vocês fazem e glorifiquem o Pai de vocês
  alternative: para que vejam as boas obras de vocês e deem glória ao Pai de vocês
  rationale: 'A tradução preserva a finalidade expressa no texto: as obras são vistas, mas a glória é dirigida ao Pai, sem acrescentar uma explicação sobre mérito ou salvação.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'vocês' para o plural de segunda pessoa, 'pessoas' no sentido humano genérico e conserva o plural concreto 'nos céus'. Não são necessárias notas de rodapé.
