id: MAT.5.7
reference: Matthew 5:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μακάριοι οἱ ἐλεήμονες, ὅτι αὐτοὶ ἐλεηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/007.yaml
  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: pt
  text: Felizes os misericordiosos, porque receberão misericórdia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: serão tratados com misericórdia. O grego usa um verbo no futuro passivo, sem declarar quem exercerá a misericórdia.'
    reason: Esclarecer a forma passiva do original e preservar a ausência de um agente expresso.
lexical_decisions:
- source_word: μακάριοι
  choice: Felizes
  rationale: Expressa a condição de bem-estar e favor declarada nas bem-aventuranças, sem reduzi-la a uma emoção passageira. É uma forma natural e amplamente compreensível em português moderno.
- source_word: οἱ ἐλεήμονες
  choice: os misericordiosos
  rationale: O artigo com o adjetivo funciona como substantivo. “Os misericordiosos” preserva a forma concisa e a ligação lexical com a misericórdia prometida.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão ou fundamento da declaração e é claro no português contemporâneo.
- source_word: αὐτοὶ
  choice: eles (implícito na forma verbal)
  rationale: O pronome grego é enfático. Em português, o sujeito fica naturalmente identificado em “receberão”; inserir “eles mesmos” daria uma ênfase pesada e potencialmente enganosa.
- source_word: ἐλεηθήσονται
  choice: receberão misericórdia
  rationale: Traduz de modo idiomático o futuro passivo de ἐλεάω e mantém a repetição da ideia de misericórdia presente em “misericordiosos”.
theological_decisions:
- issue: Agente da misericórdia prometida
  choice: 'Manter o agente sem identificação explícita: “receberão misericórdia”.'
  alternative: “Deus terá misericórdia deles” ou “serão tratados com misericórdia”.
  rationale: O verbo grego está na voz passiva e não nomeia o agente. Embora o contexto sugira fortemente Deus, a tradução não acrescenta essa identificação e preserva a abertura do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Felizes” evita o caráter excessivamente tradicional de “bem-aventurados”, enquanto “misericordiosos” conserva a concisão e a repetição lexical do grego.
