id: MAT.5.1
reference: Matthew 5:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: pt
  text: Ao ver as multidões, ele subiu o monte; e, quando se sentou, seus discípulos se aproximaram dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν
  choice: Ao ver
  rationale: O particípio aoristo de ὁράω estabelece a circunstância da ação principal. “Ao ver” é natural em português e preserva a relação temporal sem impor uma sequência rígida.
- source_word: δὲ
  choice: —
  rationale: Aqui, δέ funciona como conectivo leve de transição. Omiti-lo produz narrativa natural em português sem acrescentar contraste ou ênfase indevidos.
- source_word: τοὺς ὄχλους
  choice: as multidões
  rationale: Mantém o plural do grego e expressa, em linguagem corrente, os diversos grupos numerosos de pessoas.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: subiu o monte
  rationale: Expressa de modo conciso e idiomático o movimento ascendente indicado por ἀναβαίνω com εἰς, preservando o artigo definido.
- source_word: τὸ ὄρος
  choice: o monte
  rationale: ὄρος pode designar monte ou montanha. “Monte” é natural na narrativa bíblica em português, sem determinar uma topografia além do que o texto informa.
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: e, quando se sentou
  rationale: A construção de genitivo absoluto apresenta a circunstância temporal. “Quando se sentou” preserva a fluidez e evita tornar a sucessão mais estrita do que o grego exige.
- source_word: προσῆλθαν αὐτῷ
  choice: se aproximaram dele
  rationale: προσέρχομαι significa vir até ou aproximar-se. “Se aproximaram dele” é claro, corrente e representa bem o movimento em direção a Jesus.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seus discípulos
  rationale: É a forma padrão e precisa de expressar os seguidores que mantêm uma relação de aprendizagem com o mestre.
theological_decisions:
- issue: Artigo definido em τὸ ὄρος
  choice: o monte
  alternative: um monte; a encosta
  rationale: O grego emprega o artigo definido. Preservá-lo não exige identificar um monte específico, mas reflete a forma do texto e evita tornar indefinido o cenário.
- issue: Relação temporal de καθίσαντος αὐτοῦ
  choice: quando se sentou
  alternative: depois que se sentou
  rationale: O genitivo absoluto indica uma relação circunstancial ou temporal, mas não obriga a acentuar sucessão estrita. A tradução escolhida conserva essa abertura e não acrescenta significado cerimonial à postura sentada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Monte” preserva o sentido de ὄρος em formulação idiomática; “se aproximaram” evita uma construção excessivamente literal.
