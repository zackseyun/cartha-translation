source:
  edition: SBLGNT
  text: ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: pt
  text: Deixe ali a sua oferta diante do altar e vá; primeiro, reconcilie-se com o seu irmão[a] e, então, venha apresentar a sua oferta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmão” traduz o termo grego masculino singular; neste contexto, o princípio da reconciliação pode ter aplicação mais ampla.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες ἐκεῖ
  choice: deixe ali
  rationale: O imperativo pede que a oferta permaneça naquele lugar; “deixe ali” expressa de modo natural tanto a ação quanto a referência espacial.
- source_word: τὸ δῶρόν σου
  choice: a sua oferta
  rationale: Embora δῶρον possa significar “presente”, no contexto do altar “oferta” comunica com clareza que se trata de algo apresentado a Deus.
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: diante do altar
  rationale: Preserva a relação espacial do grego em linguagem portuguesa corrente e digna.
- source_word: ὕπαγε πρῶτον
  choice: vá. Primeiro
  rationale: 'Mantém a ordem enfática: a reconciliação deve preceder a apresentação da oferta.'
- source_word: διαλλάγηθι τῷ ἀδελφῷ σου
  choice: reconcilie-se com o seu irmão
  rationale: “Reconciliar-se com” é a regência natural em português e conserva a força relacional do imperativo passivo grego.
- source_word: καὶ τότε ἐλθὼν
  choice: depois, volte
  rationale: O retorno ao altar está implícito no encadeamento espacial; “volte” torna natural em português a ação expressa pelo particípio sem alterar a sequência.
- source_word: πρόσφερε τὸ δῶρόν σου
  choice: apresente a sua oferta
  rationale: “Apresentar uma oferta” exprime naturalmente o ato cultual de levá-la ao altar, evitando a repetição menos fluida de “ofereça a sua oferta”.
theological_decisions:
- issue: Alcance de ἀδελφός na ética interpessoal
  choice: irmão
  alternative: irmão ou irmã; outra pessoa
  rationale: O substantivo grego está no masculino singular, por isso o texto principal preserva “irmão”. Uma nota indica que, no contexto, o princípio da reconciliação não precisa ficar restrito a um irmão do sexo masculino.
- issue: Sentido relacional de διαλλάγηθι
  choice: reconcilie-se com
  alternative: faça as pazes com; seja reconciliado com
  rationale: A forma passiva pode ressaltar a entrada em um estado de reconciliação. A construção pronominal portuguesa mantém essa tensão sem sugerir que apenas uma das partes controla o resultado.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período foi dividido após “vá” para destacar a prioridade expressa por πρῶτον. “Oferta” e “apresente” mantêm o cenário cultual com clareza.
