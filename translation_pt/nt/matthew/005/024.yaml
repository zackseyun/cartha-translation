  source_fidelity: A tradução reproduz adequadamente a sequência de deixar a oferta, ir reconciliar-se e só então concluir a oferta. «Oferta», «diante do altar» e «reconcilie-se com o seu irmão» são escolhas fiéis e idiomáticas. Contudo, «volte» explicita o retorno, que é fortemente sugerido pelo contexto, mas não é dito de modo explícito por ἐλθών («vindo/tendo vindo»); «venha apresentar» conserva melhor a formulação do grego sem perder naturalidade.
  naturalness: O português é moderno, claro e apropriado ao registro do discurso. A coordenação com ponto e vírgula torna a prioridade de «primeiro» mais fluida do que a separação em frases curtas.
  terminology: «Oferta» é apropriado para δῶρον no contexto cultual; «altar» para θυσιαστήριον e «reconcilie-se» para διαλλάγηθι são escolhas estabelecidas. «Irmão» preserva o masculino singular grego, e a nota explica com cuidado a possível abrangência do princípio.
