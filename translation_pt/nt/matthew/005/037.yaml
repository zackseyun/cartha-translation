  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: pt
  text: 'Mas que a palavra de vocês seja: “Sim, sim” ou “Não, não”. O que passar disso vem do Maligno.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vem do mal”. A expressão grega pode referir-se tanto ao Maligno como ao mal em sentido impessoal.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: que ... seja
  rationale: O imperativo presente na terceira pessoa é expresso naturalmente em português pela construção exortativa com subjuntivo.
- source_word: λόγος
  choice: a palavra de vocês
  rationale: No contexto, refere-se ao que se diz; “palavra” mantém a forma concisa e proverbial do grego.
- source_word: ναὶ ναί, οὒ οὔ
  choice: “Sim, sim” ou “Não, não”
  rationale: Mantém a repetição enfática e o ritmo do original, acrescentando “ou” para explicitar o contraste com naturalidade em português.
- source_word: τὸ δὲ περισσὸν τούτων
  choice: O que passar disso
  rationale: Expressa de maneira corrente aquilo que excede as declarações simples de sim ou não, sem apagar o valor comparativo de περισσόν.
- source_word: ἐκ
  choice: vem de
  rationale: Torna explícita em português a ideia de fonte ou origem indicada pela preposição grega.
- source_word: τοῦ πονηροῦ
  choice: do Maligno
  rationale: A forma grega pode ser pessoal ou impessoal. O uso de Mateus favorece aqui a leitura pessoal; “Maligno” é natural e preserva o referente sem acrescentar o nome Satanás.
theological_decisions:
- issue: Se τοῦ πονηροῦ é impessoal (“do mal”) ou pessoal (“do Maligno”)
  choice: do Maligno
  alternative: do mal
  rationale: A expressão é gramaticalmente ambígua, mas o uso de ὁ πονηρός em Mateus favorece o sentido pessoal. A alternativa impessoal é preservada em nota para não eliminar a tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição enfática do original foi preservada, e evitou-se linguagem excessivamente técnica ou confessional.
