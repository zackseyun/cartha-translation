id: MAT.5.17
reference: Matthew 5:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: pt
  text: Não pensem que vim abolir a Lei ou os Profetas. Não vim abolir, mas cumprir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «levar ao cumprimento» ou «levar à plena expressão».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Não pensem
  rationale: O subjuntivo aoristo com μή expressa proibição; esta formulação é direta, natural e conserva a força do grego.
- source_word: ἦλθον
  choice: vim
  rationale: O pretérito perfeito traduz naturalmente o aoristo grego em português e funciona bem nas duas ocorrências paralelas.
- source_word: καταλῦσαι
  choice: abolir
  rationale: No contexto da Lei e dos Profetas, o verbo indica invalidar, revogar ou pôr de lado, não destruição física; «abolir» comunica bem esse sentido.
- source_word: τὸν νόμον ἢ τοὺς προφήτας
  choice: a Lei ou os Profetas
  rationale: As iniciais maiúsculas indicam a referência reconhecível às Escrituras de Israel, sem reduzir a expressão a leis genéricas ou somente a indivíduos proféticos.
- source_word: ἀλλὰ πληρῶσαι
  choice: mas cumprir
  rationale: «Cumprir» preserva a amplitude semântica e o peso teológico de πληρόω, podendo envolver levar ao cumprimento, à plenitude ou à plena expressão; o objeto permanece naturalmente subentendido em português, como no grego.
theological_decisions:
- issue: O sentido da relação de Jesus com «a Lei ou os Profetas» em πληρῶσαι
  choice: manter «cumprir» sem restringir o termo a uma única explicação teológica
  alternative: levar ao cumprimento; completar; levar à plena expressão; confirmar
  rationale: As interpretações variam, e «cumprir» preserva a tensão e a amplitude do original sem inserir no texto uma leitura denominacional específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição de «Não vim abolir» reproduz a ênfase e o paralelismo do original. Não foi acrescentado pronome depois de «cumprir», pois o objeto elíptico é natural em português e corresponde ao grego.
