  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μακάριοι οἱ καθαροὶ τῇ καρδίᾳ, ὅτι αὐτοὶ τὸν θεὸν ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/008.yaml
  text: Blessed are the pure in heart[b][a], because they will see God.
translation:
  language: pt
  text: Felizes os puros de coração[a], porque eles verão a Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “limpos de coração”.'
    reason: lexical_alternative
  - marker: b
    text: A promessa de que “verão a Deus” pode se referir ao acesso direto à presença de Deus, incluindo sua consumação futura; a tradução preserva a expressão sem restringir seu sentido.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Felizes
  rationale: Forma natural e consagrada nas bem-aventuranças em português; descreve a condição favorecida e digna de celebração, sem exigir uma formulação mais interpretativa.
- source_word: καθαροὶ
  choice: puros
  rationale: Expressa adequadamente a pureza moral e interior neste contexto; “limpos” permanece uma alternativa lexical possível, mas pode sugerir mais facilmente limpeza externa ou ritual.
- source_word: τῇ καρδίᾳ
  choice: de coração
  rationale: Construção idiomática em português que indica o âmbito interior em que a pureza se manifesta; “coração” representa a pessoa interior, não apenas as emoções.
- source_word: ὅτι
  choice: porque
  rationale: Introduz com clareza a razão ou fundamento da declaração de felicidade.
- source_word: αὐτοὶ
  choice: eles
  rationale: Conserva o pronome enfático do grego de modo natural, destacando que são precisamente essas pessoas que receberão a promessa.
- source_word: τὸν θεὸν
  choice: a Deus
  rationale: Objeto direto de ὄψονται; em português, o nome pessoal “Deus” pode receber a preposição “a” como objeto direto preposicionado, numa formulação natural e reverente.
- source_word: ὄψονται
  choice: verão
  rationale: Futuro direto e natural de “ver”, preservando a concisão e a força da promessa grega.
theological_decisions:
- issue: Sentido de “ver a Deus”
  choice: Mantido literalmente como “verão a Deus”, sem expansão interpretativa.
  alternative: “experimentarão a presença de Deus” ou “contemplarão a Deus na consumação futura”
  rationale: A expressão pode envolver acesso direto à presença de Deus e uma dimensão escatológica, mas o grego não especifica seu alcance. A tradução preserva essa profundidade e tensão sem restringi-la.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Felizes” evita arcaísmo, enquanto “puros de coração” conserva a formulação bíblica natural. Os marcadores foram colocados junto às expressões a que suas notas se referem.
