  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: pt
  text: 'Mas eu lhes digo: não jurem de modo algum, nem pelo céu, porque é o trono de Deus;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Mas eu lhes digo
  rationale: Preserva o contraste enfático introduzido por δέ e explicita o pronome ἐγώ, mantendo uma formulação natural em português.
- source_word: μὴ ὀμόσαι ὅλως
  choice: não jurem de modo algum
  rationale: ὀμόσαι refere-se a prestar juramento, e ὅλως amplia a proibição com o sentido de 'de modo algum'.
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: nem pelo céu
  rationale: Em fórmulas de juramento, ἐν com o dativo indica aquilo pelo qual se jura; 'pelo céu' é a expressão idiomática correspondente em português.
- source_word: ὅτι θρόνος ἐστὶν τοῦ θεοῦ
  choice: porque é o trono de Deus
  rationale: Traduz ὅτι causalmente e conserva a construção predicativa direta do grego.
theological_decisions:
- issue: Alcance da proibição de jurar
  choice: não jurem de modo algum
  alternative: não façam juramentos falsos
  rationale: O texto emprega μὴ ὀμόσαι ὅλως, cuja formulação é abrangente; a tradução não restringe a ordem apenas a juramentos falsos nem resolve aqui como ela se relaciona com outras passagens bíblicas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento plural por 'lhes' e imperativo 'jurem'. A pontuação mantém o versículo aberto para a continuação da enumeração no contexto seguinte.
