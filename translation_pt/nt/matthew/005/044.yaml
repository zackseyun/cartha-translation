  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: pt
  text: 'Mas eu lhes digo: amem os seus inimigos e orem por[a] aqueles que perseguem vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “orem em favor daqueles que perseguem vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Mas eu lhes digo
  rationale: Preserva o contraste enfático de δέ e a presença explícita de ἐγώ, em linguagem portuguesa natural e digna.
- source_word: ἀγαπᾶτε
  choice: amem
  rationale: Traduz diretamente o imperativo presente de ἀγαπάω, sem acrescentar uma definição interpretativa do amor nem sobrecarregar o aspecto verbal.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: os seus inimigos
  rationale: Formulação direta e idiomática que mantém a hostilidade relacional expressa por ἐχθρούς.
- source_word: προσεύχεσθε
  choice: orem
  rationale: Equivalente corrente e preciso do imperativo de προσεύχομαι.
- source_word: ὑπὲρ
  choice: por
  rationale: Com o genitivo, indica oração em favor de alguém; “por” é a forma mais natural em português, enquanto “em favor de” explicita a nuance possível.
- source_word: τῶν διωκόντων ὑμᾶς
  choice: aqueles que perseguem vocês
  rationale: Conserva o sentido verbal do particípio substantivado e sua ação característica ou contínua, sem substituí-lo pelo substantivo mais abstrato “perseguidores”.
theological_decisions:
- issue: Alcance do mandamento referente aos inimigos
  choice: Traduzir diretamente os dois imperativos, sem definir no próprio texto como o amor deve se manifestar nem qual deve ser o conteúdo da oração.
  alternative: Explicitar amor como ação benevolente ou especificar oração por bênção, arrependimento ou conversão.
  rationale: O grego ordena amar os inimigos e orar pelos perseguidores, mas este versículo não delimita todas as implicações práticas nem especifica o pedido da oração.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Lhes digo” mantém naturalidade e respeito; “vocês” evita a ambiguidade regional de “vós” e deixa explícito o objeto plural de ὑμᾶς. O marcador [a] foi colocado imediatamente após “por”, expressão à qual a alternativa lexical se refere.
