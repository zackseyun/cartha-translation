id: MAT.5.47
reference: Matthew 5:47
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: pt
  text: E, se vocês cumprimentarem somente os seus irmãos[a], o que fazem de extraordinário[b]? Até os gentios[c] não fazem o mesmo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o grego diz “irmãos”, mas o termo pode referir-se mais amplamente aos membros do próprio grupo.
    reason: lexical_alternative
  - marker: b
    text: Ou “o que fazem a mais?”
    reason: lexical_alternative
  - marker: c
    text: Ou “pagãos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: cumprimentarem
  rationale: O verbo indica dirigir uma saudação a alguém. “Cumprimentarem” expressa naturalmente essa ação social sem ampliá-la para acolhimento ou hospitalidade.
- source_word: ἀδελφοὺς
  choice: irmãos
  rationale: Preserva a forma masculina plural do grego, ao mesmo tempo que uma nota registra que, no contexto, o termo pode abranger irmãos e irmãs ou membros do próprio grupo.
- source_word: μόνον
  choice: somente
  rationale: Expressa com clareza a restrição da saudação ao próprio grupo.
- source_word: τί περισσὸν ποιεῖτε
  choice: o que fazem de extraordinário
  rationale: περισσόν aponta para aquilo que excede o comum ou se distingue dele. A formulação conserva a força retórica sem reduzir a expressão apenas a uma comparação quantitativa.
- source_word: ἐθνικοὶ
  choice: gentios
  rationale: No contexto judaico, o termo designa os não judeus. “Gentios” preserva esse contraste étnico e comunitário sem impor a conotação religiosa mais forte de “pagãos”.
- source_word: τὸ αὐτό
  choice: o mesmo
  rationale: Equivalente direto e idiomático para a repetição da mesma conduta.
theological_decisions:
- issue: Alcance de ἀδελφοὺς no ensino ético
  choice: irmãos
  alternative: irmãos e irmãs; membros do próprio grupo
  rationale: A tradução principal conserva a forma masculina plural, mas não resolve de modo indevido se a referência inclui mulheres ou, mais amplamente, pessoas do círculo social e comunitário dos ouvintes; essa possibilidade é indicada em nota.
- issue: Sentido de ἐθνικοὶ
  choice: gentios
  alternative: pagãos; pessoas das nações
  rationale: “Gentios” mantém o sentido básico de não judeus e o contraste contextual com a comunidade judaica, sem intensificar o termo como juízo religioso.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. O plural “vocês” torna explícito o sujeito plural; “Até... não” conserva a força da pergunta retórica grega, que espera resposta afirmativa.
