id: MAT.5.11
reference: Matthew 5:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: pt
  text: Felizes são vocês quando os insultarem[a], os perseguirem e, mentindo, disserem todo tipo de mal contra vocês[b] por causa de mim[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os injuriarem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “disserem toda espécie de mal contra vocês”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “por minha causa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: Felizes são vocês
  rationale: Preserva a fórmula das bem-aventuranças em português atual e compreensível. “Bem-aventurados” é tradicional, mas menos corrente; “abençoados” poderia introduzir uma nuance passiva não explicitada pelo adjetivo grego.
- source_word: ὅταν
  choice: quando
  rationale: Expressa de modo natural a contingência geral introduzida por ὅταν com o subjuntivo, sem enfatizar indevidamente a repetição.
- source_word: ὀνειδίσωσιν ὑμᾶς
  choice: os insultarem
  rationale: Comunica claramente a agressão verbal em linguagem contemporânea; “injuriarem” é uma alternativa mais formal.
- source_word: διώξωσιν
  choice: os perseguirem
  rationale: Mantém a amplitude da hostilidade sofrida por causa da ligação com Jesus, sem restringi-la à violência física, à ação judicial ou ao assédio social.
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: disserem todo tipo de mal contra vocês
  rationale: Reproduz o caráter abrangente da expressão grega de maneira idiomática, mantendo κατά com o sentido de fala dirigida contra alguém.
- source_word: ψευδόμενοι
  choice: mentindo
  rationale: Preserva a forma participial e deixa claro que as declarações malignas são falsas, ligando o particípio mais diretamente ao ato de falar.
- source_word: ἕνεκεν ἐμοῦ
  choice: por causa de mim
  rationale: Expressa diretamente que a oposição ocorre em razão da relação ou lealdade a Jesus, sem acrescentar uma finalidade não declarada.
theological_decisions:
- issue: Natureza da oposição descrita
  choice: O versículo abrange insulto, perseguição e acusações falsas sofridos por causa de Jesus.
  alternative: Restringir a perseguição à violência física ou entender toda a oposição apenas como difamação.
  rationale: Os verbos coordenados descrevem formas relacionadas, mas distintas, de hostilidade. A tradução mantém essa amplitude sem impor uma modalidade específica.
- issue: Sentido de μακάριοι
  choice: “Felizes” como declaração de condição favorecida no contexto das bem-aventuranças.
  alternative: “Abençoados” ou o tradicional “bem-aventurados”.
  rationale: “Felizes” é atual e inteligível, sem explicar em excesso a fonte ou a natureza dessa condição. O contexto preserva o peso teológico da declaração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural explícito e evita tanto arcaísmos quanto coloquialismos excessivos. A ordem “e, mentindo, disserem” mantém a falsidade associada principalmente às declarações malignas.
