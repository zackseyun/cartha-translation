  text: 'E, abrindo a boca, ele os ensinava, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva o conectivo simples do grego, sem acrescentar uma sequência temporal mais forte.
- source_word: ἀνοίξας
  choice: abrindo
  rationale: Mantém a imagem literal e solene da expressão grega, ao mesmo tempo que forma uma construção natural em português.
- source_word: τὸ στόμα αὐτοῦ
  choice: a boca
  rationale: Com o sujeito expresso em seguida, o possessivo seria redundante em português; a expressão completa 'abrindo a boca' preserva o idioma introdutório do original.
- source_word: ἐδίδασκεν
  choice: ensinava
  rationale: O pretérito imperfeito representa adequadamente o aspecto contínuo ou progressivo do imperfeito grego, sem restringi-lo ao sentido incoativo.
- source_word: αὐτοὺς
  choice: os
  rationale: Conserva o referente pronominal indefinido no próprio versículo, sem especificá-lo como discípulos ou multidões.
- source_word: λέγων
  choice: dizendo
  rationale: Preserva o particípio que introduz o conteúdo do ensino e prepara naturalmente as palavras seguintes.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve solenidade narrativa. A ordem 'abrindo a boca' conserva a expressão marcada do original; 'ensinava' mantém o aspecto imperfeito. Não se acrescenta nota, pois a formulação formal permanece clara em português.
