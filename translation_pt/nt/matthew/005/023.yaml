id: MAT.5.23
reference: Matthew 5:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: pt
  text: Portanto, se você estiver apresentando a sua oferta sobre o altar e ali se lembrar de que seu irmão[a] tem alguma coisa contra você,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu irmão ou sua irmã”; o grego diz “irmão”, termo masculino singular que, neste contexto, pode ter função representativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Portanto, se
  rationale: Preserva tanto a inferência marcada por οὖν como a condição introduzida por ἐάν, em português natural.
- source_word: προσφέρῃς
  choice: estiver apresentando
  rationale: A construção progressiva retrata vividamente a ação em curso no cenário hipotético; “apresentando” comunica o ato cultual sem reduzir o sentido ao simples transporte da oferta.
- source_word: τὸ δῶρόν σου
  choice: a sua oferta
  rationale: Embora δῶρον signifique literalmente “presente” ou “dádiva”, no contexto do altar “oferta” expressa com clareza o referente sacrificial em português.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: sobre o altar
  rationale: Reflete ἐπί com acusativo e a apresentação da oferta sobre o altar, preservando a imagem espacial do texto grego.
- source_word: κἀκεῖ
  choice: e ali
  rationale: Mantém a conjunção e a referência explícita ao lugar em que a pessoa está oferecendo.
- source_word: μνησθῇς
  choice: se lembrar
  rationale: É a equivalência portuguesa natural do verbo deponente, sem especificar indevidamente como a lembrança ocorre.
- source_word: ὁ ἀδελφός σου
  choice: seu irmão
  rationale: Preserva o substantivo masculino singular do grego; uma nota registra seu possível uso representativo no contexto.
- source_word: ἔχει τι κατὰ σοῦ
  choice: tem alguma coisa contra você
  rationale: Reproduz naturalmente a expressão idiomática e mantém a indefinição de τι, sem explicar a natureza da queixa.
theological_decisions:
- issue: Termo de parentesco masculino ἀδελφός
  choice: seu irmão
  alternative: seu irmão ou sua irmã; outro fiel
  rationale: O texto grego emprega o masculino singular. A tradução conserva essa forma sem limitar silenciosamente a aplicação; a possível função representativa é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Você” é usado como forma corrente de segunda pessoa. A frase permanece aberta com vírgula porque o versículo continua em Mateus 5:24.
