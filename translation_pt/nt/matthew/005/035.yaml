  text: μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/035.yaml
  text: nor by the earth[a], because it is the footstool of his feet; nor by Jerusalem, because it is the city of the great King[d][c][b];
translation:
  language: pt
  text: nem pela terra, porque ela é o estrado de seus pés; nem por Jerusalém[a], porque é a cidade do grande Rei[b][c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega εἰς, normalmente “para” ou “em direção a”, mas a expressão pode funcionar idiomaticamente na linguagem de juramentos com o sentido de “por Jerusalém”.
    reason: lexical_alternative
  - marker: b
    text: 'Alusão a Isaías 66:1: “a terra é o estrado dos meus pés”.'
    reason: cross_reference
  - marker: c
    text: Alusão ao Salmo 48:2, onde Jerusalém é chamada de “cidade do grande Rei”.
    reason: cross_reference
lexical_decisions:
- source_word: μήτε
  choice: nem
  rationale: Dá continuidade natural, em português, à série de proibições iniciada no versículo anterior.
- source_word: ἐν τῇ γῇ
  choice: pela terra
  rationale: No contexto de juramentos, ἐν introduz aquilo pelo qual se jura; “pela terra” expressa o idioma com clareza.
- source_word: γῇ
  choice: terra
  rationale: O contraste com o céu e Jerusalém indica a terra como um todo, não uma região específica.
- source_word: ὅτι
  choice: porque
  rationale: Introduz diretamente a razão de cada proibição.
- source_word: ὑποπόδιόν
  choice: estrado
  rationale: “Estrado” é uma equivalência corrente e digna para o apoio dos pés, preservando a alusão bíblica.
- source_word: τῶν ποδῶν αὐτοῦ
  choice: de seus pés
  rationale: Reproduz a construção genitiva e mantém implícito, como no grego, o referente divino do pronome.
- source_word: εἰς Ἱεροσόλυμα
  choice: por Jerusalém
  rationale: Embora εἰς seja normalmente direcional, aqui funciona idiomaticamente na fórmula de juramento; “por Jerusalém” é natural em português, e a forma grega é registrada em nota.
- source_word: πόλις
  choice: cidade
  rationale: Equivalente direto e natural.
- source_word: τοῦ μεγάλου βασιλέως
  choice: do grande Rei
  rationale: Preserva o genitivo e o registro elevado da provável alusão ao Salmo 48:2.
theological_decisions:
- issue: Referente de αὐτοῦ em “de seus pés”
  choice: Pronome em minúscula, mantendo o referente gramaticalmente implícito
  alternative: Empregar “Seus” com maiúscula para explicitar a referência a Deus
  rationale: O grego não marca maiúscula reverencial. O contexto e a alusão a Isaías apontam para Deus sem que a tradução precise acrescentar essa explicitação.
- issue: Identidade do “grande Rei”
  choice: Manter o título sem acrescentar “Deus”
  alternative: Traduzir de modo explicativo como “do grande Rei, Deus”
  rationale: A alusão identifica o referente no contexto bíblico, mas o texto grego conserva a formulação titular e não traz uma aposição explicativa.
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela. “Estrado” preserva o tom bíblico sem soar excessivamente arcaico; “por Jerusalém” comunica naturalmente a fórmula de juramento.
