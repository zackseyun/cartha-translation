id: MAT.5.25
reference: Matthew 5:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: pt
  text: Mostre-se favorável ao seu adversário sem demora[a], enquanto você está com ele a caminho, para que o adversário não entregue você ao juiz, o juiz ao oficial, e você seja lançado na prisão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático neste contexto jurídico: “Entre em acordo sem demora com o seu adversário”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: Mostre-se favorável
  rationale: Preserva o sentido básico de εὐνοέω, isto é, ter ou demonstrar boa disposição para com alguém, e soa mais natural em português do que a forma rígida «seja bem-disposto».
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: acusador
  rationale: O contexto de juiz, oficial e prisão dá ao termo um sentido jurídico; «acusador» comunica isso claramente, embora «adversário» também seja possível.
- source_word: ταχὺ
  choice: sem demora
  rationale: Expressa de modo natural a urgência do advérbio, sem sugerir apenas velocidade física.
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: enquanto você está com ele a caminho
  rationale: Mantém a imagem concreta do percurso e evita acrescentar explicitamente «ao tribunal», destino apenas implícito no contexto.
- source_word: μήποτέ
  choice: para que ... não
  rationale: Reproduz em português corrente a advertência preventiva da conjunção grega.
- source_word: παραδῷ
  choice: entregue
  rationale: É a formulação portuguesa natural para a transferência de alguém à autoridade judicial.
- source_word: κριτῇ / κριτὴς
  choice: juiz
  rationale: Equivalente direto e claro no cenário jurídico.
- source_word: ὑπηρέτῃ
  choice: oficial
  rationale: Designa de modo conciso o subordinado encarregado de executar a decisão do juiz, sem impor a função culturalmente específica de «oficial de justiça» ou «carcereiro».
- source_word: εἰς φυλακὴν
  choice: na prisão
  rationale: Tradução portuguesa padrão e apropriada à gravidade da advertência.
- source_word: βληθήσῃ
  choice: seja lançado
  rationale: Conserva a força vívida de βάλλω e o passivo do texto grego.
theological_decisions:
- issue: Se a ordem inicial deve ser vertida como disposição favorável ou como acordo jurídico
  choice: Mostre-se favorável ao seu acusador
  alternative: Entre em acordo sem demora com o seu acusador
  rationale: O contexto jurídico torna a ideia de acordo plausível, mas o sentido lexical de εὐνοέω é o de uma disposição favorável. O texto principal preserva esse sentido, e a nota registra a interpretação idiomática sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Você» evita a oscilação regional dos paradigmas de «tu». A construção mantém a sequência jurídica e a imagem de estar a caminho, sem explicitar que o trajeto é até o tribunal.
