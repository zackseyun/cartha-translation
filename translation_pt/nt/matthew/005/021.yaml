id: MAT.5.21
reference: Matthew 5:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: pt
  text: 'Vocês ouviram que foi dito aos antigos[a]: “Não cometa assassinato[b]; e quem cometer assassinato estará sujeito a julgamento.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “às pessoas de antigamente”.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradicionalmente: “Não mate”; porém, o verbo grego aqui significa mais especificamente cometer assassinato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Vocês ouviram
  rationale: O aoristo, nesta fórmula de discurso, aponta para o ensino recebido pelos ouvintes; o pretérito perfeito simples é natural em português e mantém a referência ao que ouviram.
- source_word: ἐρρέθη
  choice: foi dito
  rationale: A forma passiva preserva a formulação impessoal do grego sem identificar além do texto quem falou.
- source_word: τοῖς ἀρχαίοις
  choice: aos antigos
  rationale: Mantém o dativo como destinatário e designa as pessoas de tempos passados; a nota registra uma alternativa mais explícita.
- source_word: Οὐ φονεύσεις
  choice: Não cometa assassinato
  rationale: φονεύω se refere especificamente a assassinar, não a matar em sentido amplo. O imperativo negativo é uma forma portuguesa corrente de expressar a proibição.
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: e quem cometer assassinato
  rationale: A construção relativa com ἄν e subjuntivo expressa uma condição geral indefinida; esta formulação é clara e natural em português.
- source_word: ἔνοχος ἔσται
  choice: estará sujeito
  rationale: Expressa responsabilidade ou sujeição a uma consequência judicial, em vez de antecipar simplesmente um veredito de culpa.
- source_word: τῇ κρίσει
  choice: a julgamento
  rationale: Preserva o sentido judicial de κρίσις sem especificar se se trata de um tribunal humano ou de condenação, possibilidades que o termo isolado não resolve.
theological_decisions:
- issue: Formulação do sexto mandamento
  choice: assassinato
  alternative: matar
  rationale: O verbo grego φονεύω é mais específico que o verbo geral 'matar' e indica homicídio ilícito; 'assassinato' evita ampliar a proibição a toda forma de tirar a vida.
- issue: Referente de κρίσις
  choice: julgamento
  alternative: tribunal
  rationale: O texto admite uma nuance judicial, mas não exige que a tradução identifique uma instituição concreta; 'julgamento' preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com plural explícito em “Vocês”. A citação foi apresentada como uma única unidade, separada por ponto e vírgula, acompanhando a relação entre o mandamento e sua consequência judicial.
