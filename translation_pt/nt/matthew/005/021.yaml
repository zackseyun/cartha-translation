  source_fidelity: 'A tradução preserva adequadamente todos os elementos do grego: a fórmula discursiva recebida («Vocês ouviram que foi dito»), o destinatário histórico («aos antigos»), a proibição específica de φονεύω como assassinato, a generalização indefinida («quem cometer assassinato») e a responsabilidade judicial expressa por ἔνοχος ἔσται τῇ κρίσει. «Julgamento» mantém prudentemente a amplitude de κρίσις, sem impor a identificação de um tribunal específico ou de uma condenação escatológica.'
  naturalness: O português é claro, moderno e digno. «Não cometa assassinato» é uma formulação um pouco mais explicativa do que a forma tradicional do mandamento, mas é natural e comunica com precisão a especificidade semântica pretendida. A pontuação reúne o mandamento e sua consequência numa única citação, conforme o texto grego.
  terminology: «Assassinato» comunica apropriadamente o campo semântico mais restrito de φονεύω em contraste com «matar». «Estará sujeito a julgamento» reproduz bem a noção de responsabilidade judicial de ἔνοχος, sem antecipar um veredito. A nota em b esclarece de modo suficiente a divergência da tradição de tradução.
