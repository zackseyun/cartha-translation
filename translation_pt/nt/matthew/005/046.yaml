id: MAT.5.46
reference: Matthew 5:46
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: pt
  text: Pois, se vocês amam os que os amam, que recompensa têm?[a] Até os cobradores de impostos não fazem o mesmo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que salário recebem?” A palavra grega pode significar “salário” ou “recompensa”; aqui se refere à retribuição no contexto do ensino de Jesus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Pois, se
  rationale: γάρ liga a afirmação ao argumento anterior, enquanto ἐάν introduz a condição; “Pois, se” preserva ambas as funções de modo natural.
- source_word: ἀγαπήσητε
  choice: vocês amam
  rationale: O aoristo do subjuntivo com ἐάν expressa aqui uma condição geral; o presente em português comunica esse valor sem exagerar o aspecto verbal.
- source_word: τοὺς ἀγαπῶντας ὑμᾶς
  choice: os que os amam
  rationale: O particípio substantivado define o grupo por sua ação em relação aos ouvintes e mantém a repetição lexical de ἀγαπάω.
- source_word: τίνα μισθὸν ἔχετε
  choice: que recompensa têm
  rationale: μισθός pode indicar salário, pagamento ou recompensa; no ensino ético deste contexto, “recompensa” é claro e preserva a ideia de retribuição sem impor uma doutrina de mérito.
- source_word: οὐχὶ καὶ
  choice: Até ... não
  rationale: οὐχί introduz uma pergunta retórica que espera resposta afirmativa, e καί destaca enfaticamente a comparação; essa construção é idiomática em português.
- source_word: οἱ τελῶναι
  choice: os cobradores de impostos
  rationale: Designa os responsáveis pela cobrança de impostos ou taxas, um grupo socialmente desprezado no contexto dos Evangelhos; a expressão é clara para leitores modernos.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: fazem o mesmo
  rationale: Reproduz de forma concisa e natural a ação equivalente indicada pelo grego.
theological_decisions:
- issue: Sentido de μισθός no ensino ético de Jesus
  choice: recompensa
  alternative: salário; pagamento
  rationale: “Recompensa” preserva a dimensão moral e teológica da retribuição no contexto, sem transformar a passagem numa afirmação mecanicista sobre mérito.
translation_notes:
  register: Português moderno, digno e acessível, com pronome plural “vocês” para ampla legibilidade brasileira. A pergunta retórica foi mantida, assim como a repetição de “amam”. O marcador [a] aparece no texto principal.
