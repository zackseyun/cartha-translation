id: MAT.5.29
reference: Matthew 5:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: pt
  text: Mas, se o seu olho direito faz você tropeçar[a], arranque-o e jogue-o para longe de você. Pois é melhor para você perder um dos membros do seu corpo do que o seu corpo inteiro ser lançado na Geena[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faz você pecar”.'
    reason: lexical_alternative
  - marker: b
    text: Geena é a forma grega de um nome associado ao vale de Hinom; tradicionalmente traduzida por “inferno”.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: faz você tropeçar
  rationale: Preserva a metáfora de tropeçar presente no verbo grego, sem restringi-la silenciosamente ao sentido interpretativo de pecar.
- source_word: ἔξελε
  choice: arranque-o
  rationale: Transmite de modo natural e enérgico a força do imperativo, mantendo a imagem deliberadamente extrema.
- source_word: βάλε ἀπὸ σοῦ
  choice: jogue-o para longe de você
  rationale: Conserva tanto a ação forte de lançar quanto a ideia explícita de afastamento.
- source_word: συμφέρει
  choice: é melhor para você
  rationale: Expressa em português corrente a vantagem comparativa indicada pelo contexto.
- source_word: ἀπόληται
  choice: se perca
  rationale: Mantém a ideia grave de perda de um membro sem impor o sentido mais específico de aniquilação.
- source_word: μέλος
  choice: membro do seu corpo
  rationale: Explicita o sentido anatômico de μέλος e evita a possível leitura institucional de 'membro' em português moderno.
- source_word: βληθῇ
  choice: ser lançado
  rationale: Reproduz a voz passiva e a força de βάλλω em registro digno e natural.
- source_word: γέενναν
  choice: Geena
  rationale: Emprega a forma portuguesa do nome específico grego, preservando suas associações históricas sem substituí-lo diretamente pelo termo teológico mais amplo 'inferno'.
- source_word: ὁ δεξιὸς
  choice: direito
  rationale: Retém o detalhe expresso no texto-fonte.
- source_word: δὲ
  choice: Mas
  rationale: Representa a leve nuance adversativa de δέ no contexto.
theological_decisions:
- issue: Tradução de γέεννα
  choice: Geena
  alternative: inferno
  rationale: Preserva o termo específico usado no grego e evita incorporar automaticamente associações doutrinárias posteriores; a tradução tradicional é indicada em nota.
- issue: Força metafórica de σκανδαλίζω
  choice: faz você tropeçar
  alternative: faz você pecar
  rationale: Mantém no texto principal a metáfora grega, enquanto a nota esclarece o sentido contextual possível sem eliminar a tensão lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação pronominal em “arranque-o” mantém um registro escrito natural, enquanto “faz você tropeçar” evita formalidade excessiva. Todos os marcadores de nota aparecem no texto principal.
