id: MAT.5.19
reference: Matthew 5:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: pt
  text: Portanto, quem desconsiderar[a] um dos menores destes mandamentos e ensinar os outros a fazer o mesmo será chamado menor no Reino dos céus; mas quem os praticar e ensinar, esse será chamado grande no Reino dos céus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deixar de lado”, “anular” ou “violar”. O verbo grego significa literalmente “soltar” e, neste contexto, indica enfraquecer a força de um mandamento ou tratá-lo como não obrigatório.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Portanto
  rationale: Mantém a relação de consequência com a declaração anterior sobre a Lei.
- source_word: λύσῃ
  choice: desconsiderar
  rationale: No contexto de mandamentos, comunica tratar uma ordem como não obrigatória. Evita tanto a estranheza de uma tradução literal como “soltar” quanto a redução do sentido a um ato isolado de desobediência.
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: um só destes mandamentos, mesmo dos menores
  rationale: Expressa com naturalidade que se trata até de um mandamento pertencente à categoria dos considerados menores, sem sugerir que ele seja irrelevante.
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: ensinar os outros a fazer o mesmo
  rationale: “Os outros” representa naturalmente a referência genérica a seres humanos, e “a fazer o mesmo” torna explícita a retomada de οὕτως.
- source_word: ἐλάχιστος κληθήσεται
  choice: será chamado menor
  rationale: Conserva o futuro passivo e a comparação de condição ou reconhecimento, sem acrescentar exclusão do Reino.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: no Reino dos céus
  rationale: É a forma portuguesa consagrada e natural da expressão característica de Mateus.
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: os praticar e ensinar
  rationale: “Praticar” comunica pôr os mandamentos em ação; o objeto “os” abrange naturalmente os dois verbos.
- source_word: οὗτος
  choice: esse
  rationale: Preserva a ênfase do demonstrativo e o contraste marcado com a pessoa descrita na primeira oração.
- source_word: μέγας
  choice: grande
  rationale: É o equivalente direto e mantém o contraste com “menor”.
theological_decisions:
- issue: Condição de “menor” ou “grande” no Reino
  choice: Manter a linguagem comparativa dentro do Reino, sem explicar sua natureza.
  alternative: Interpretar “menor” como exclusão do Reino ou “grande” como uma categoria técnica de recompensa.
  rationale: O texto afirma que a pessoa será chamada menor ou grande no Reino dos céus, mas não define aqui as implicações soteriológicas ou a natureza dessa distinção.
- issue: Referência genérica de τοὺς ἀνθρώπους
  choice: os outros
  alternative: os homens
  rationale: No contexto, o masculino plural grego tem referência humana genérica. “Os outros” transmite essa extensão de modo atual e natural, sem alterar o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “esse será chamado” conserva a ênfase do grego sem soar excessivamente literal; “Reino” recebe inicial maiúscula por convenção editorial religiosa, não por exigência gramatical do original.
