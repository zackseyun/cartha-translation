  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: pt
  text: Dê a quem lhe pedir e não se afaste de quem quiser tomar algo emprestado de você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não recuse quem quiser tomar algo emprestado de você”.'
    reason: Alternativa lexical que explicita o sentido contextual de μὴ ἀποστραφῇς, em vez de conservar sua imagem verbal.
lexical_decisions:
- source_word: αἰτοῦντί
  choice: a quem lhe pedir
  rationale: O particípio presente com artigo tem função substantiva e sentido genérico. A formulação é natural em português e mantém a referência ampla a qualquer pessoa que peça.
- source_word: δός
  choice: Dê
  rationale: O imperativo aoristo de δίδωμι expressa uma ordem direta. O imperativo simples preserva sua força sem acrescentar modalidade.
- source_word: θέλοντα
  choice: quem quiser
  rationale: O particípio presente substantivado de θέλω indica a pessoa que deseja fazê-lo. “Quem quiser” é corrente e preserva o caráter genérico.
- source_word: ἀπὸ σοῦ
  choice: de você
  rationale: A locução preposicional indica a fonte daquilo que se pretende tomar emprestado. “De você” é claro e natural no português moderno.
- source_word: δανίσασθαι
  choice: tomar algo emprestado
  rationale: O infinitivo médio significa tomar emprestado. A inclusão de “algo” evita restringir o objeto a dinheiro, que não está especificado no grego.
- source_word: μὴ ἀποστραφῇς
  choice: não se afaste
  rationale: A construção com μή expressa proibição. “Não se afaste” conserva a imagem de voltar-se para longe, sem substituí-la diretamente pela interpretação “não recuse”.
theological_decisions:
- issue: Alcance e força da ordem ética de Jesus
  choice: Manter ordens diretas e de alcance geral, sem qualificações adicionais.
  alternative: Restringir a ordem a certos solicitantes considerados dignos ou explicá-la diretamente como “não recuse”.
  rationale: O grego apresenta mandamentos diretos e não enuncia aqui limitações quanto à pessoa que pede. A tradução preserva essa força e generalidade, bem como a imagem verbal da segunda ordem.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Emprega “você” para representar o singular de segunda pessoa de modo claro; “tomar algo emprestado” evita limitar o pedido a dinheiro.
