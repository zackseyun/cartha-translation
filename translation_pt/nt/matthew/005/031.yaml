base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/031.yaml
  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: pt
  text: 'Também foi dito: “Quem se divorciar de sua esposa deve dar a ela um certificado de divórcio.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem mandar sua esposa embora deve dar a ela um documento de divórcio”. O verbo grego pode significar “mandar embora”, mas, neste contexto jurídico matrimonial, refere-se ao divórcio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη
  choice: foi dito
  rationale: A fórmula passiva introduz uma citação e corresponde naturalmente, em português, a “foi dito”.
- source_word: δέ
  choice: Também
  rationale: Aqui δέ faz a transição para outro exemplo no conjunto de ensinamentos. “Também” é natural em português e evita impor um contraste mais forte do que o exigido neste versículo isolado.
- source_word: Ὃς ἂν
  choice: Quem
  rationale: A construção relativa com ἄν expressa uma condição geral indefinida; “quem” comunica isso de modo conciso e idiomático.
- source_word: ἀπολύσῃ
  choice: se divorciar de
  rationale: Embora o verbo possa significar “mandar embora”, o contexto matrimonial e a menção de ἀποστάσιον indicam juridicamente o divórcio.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: sua esposa
  rationale: γυνή significa “esposa” neste contexto matrimonial; o possessivo é preservado sem tornar a frase pesada.
- source_word: δότω
  choice: deve dar
  rationale: O imperativo de terceira pessoa é expresso com clareza e naturalidade pela formulação normativa “deve dar”, adequada à citação de caráter legal.
- source_word: αὐτῇ
  choice: a ela
  rationale: Explicita naturalmente o objeto indireto em português e evita possível ambiguidade de “lhe”.
- source_word: ἀποστάσιον
  choice: um certificado de divórcio
  rationale: O termo designa um documento escrito que formaliza o divórcio; esta expressão preserva tanto o sentido jurídico quanto o documental.
theological_decisions:
- issue: Relação das palavras de Jesus com a disposição mosaica sobre o divórcio
  choice: Apresentar a frase como citação de uma norma, sem indicar neste versículo aprovação ou reprovação.
  alternative: Traduzir de modo interpretativo como uma ordem que endossa o divórcio, ou como simples descrição de um ensino corrente.
  rationale: O versículo introduz a formulação que Jesus abordará no versículo seguinte. A tradução deve preservar a forma citacional e a tensão teológica, sem antecipar a avaliação posterior.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o caráter jurídico da citação sem soar arcaica.
