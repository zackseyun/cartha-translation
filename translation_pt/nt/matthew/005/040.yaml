  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: pt
  text: E, se alguém quiser processar você[a] e tomar a sua túnica[b], deixe que fique também com a sua capa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “levar você ao tribunal”. Literalmente, o grego diz “ser julgado”, num contexto judicial.
    reason: lexical_alternative
  - marker: b
    text: A “túnica” era a peça de roupa interior; a “capa”, a peça exterior.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: se alguém quiser
  rationale: O particípio substantivado descreve genericamente qualquer pessoa. A construção condicional é natural em português e conserva o sentido volitivo de θέλω.
- source_word: σοι κριθῆναι
  choice: processar você
  rationale: No contexto de uma disputa por uma peça de roupa, o infinitivo passivo de κρίνω se refere a recorrer a um processo judicial. “Processar você” é conciso e claro; a nota preserva uma alternativa mais literal.
- source_word: χιτῶνά
  choice: túnica
  rationale: χίτων designa a peça de roupa interior usada junto ao corpo. “Túnica” mantém a ambientação histórica e a distingue da roupa exterior.
- source_word: λαβεῖν
  choice: tomar
  rationale: O verbo indica obter ou tomar posse da túnica no contexto da ação judicial. “Tomar” conserva de modo direto esse sentido.
- source_word: ἄφες αὐτῷ
  choice: deixe que fique
  rationale: O imperativo de ἀφίημι aqui expressa ceder ou permitir que a outra pessoa fique com algo. A formulação transmite a ordem de maneira natural sem convertê-la numa expressão jurídica mais específica.
- source_word: ἱμάτιον
  choice: capa
  rationale: ἱμάτιον é a peça exterior, em contraste com χιτών. “Capa” comunica de modo acessível essa distinção histórica.
- source_word: καὶ ... καὶ
  choice: E ... também
  rationale: O primeiro καί liga a declaração ao contexto anterior; o segundo acrescenta enfaticamente a capa ao que deve ser cedido.
theological_decisions:
- issue: Força ética da instrução de Jesus numa disputa judicial
  choice: Manter uma ordem direta de generosidade radical e não retaliação
  alternative: Parafrasear como um princípio geral e abstrato de renúncia a direitos
  rationale: O imperativo ἄφες e a imagem concreta das duas peças de roupa dão à declaração uma força deliberadamente incisiva. A tradução não a reduz a mera metáfora nem a restringe por meio de uma interpretação doutrinária particular.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente compreensível. “Você” evita regionalismos marcados; “túnica” e “capa” preservam o contraste cultural necessário sem tornar o versículo arcaico.
