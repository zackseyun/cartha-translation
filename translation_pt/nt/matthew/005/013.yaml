id: MAT.5.13
reference: Matthew 5:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: pt
  text: Vocês são o sal da terra. Mas, se o sal perder o sabor, com que será salgado? Já não serve para nada, a não ser para ser jogado fora e pisado pelas pessoas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Vocês
  rationale: O pronome explícito dá destaque aos ouvintes. “Vocês” é natural, claro e amplamente compreensível em português, sem acrescentar a ênfase mais pesada de “vocês mesmos”.
- source_word: τὸ ἅλας τῆς γῆς
  choice: o sal da terra
  rationale: Preserva diretamente a metáfora e o sentido amplo de γῆ neste contexto.
- source_word: μωρανθῇ
  choice: perder o sabor
  rationale: Em relação ao sal, o verbo indica tornar-se insípido. A expressão escolhida é idiomática e mantém a força da imagem; o sentido cognato de “tornar-se tolo” não é imposto ao texto.
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: com que será salgado?
  rationale: Mantém a pergunta sobre o meio pelo qual o sal voltaria a ser salgado, preservando a voz passiva e sem acrescentar explicitamente “novamente”, ausente do grego.
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: Já não serve para nada
  rationale: Expressa em português corrente a inutilidade prática indicada por ἰσχύει neste contexto.
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: a não ser para ser jogado fora
  rationale: “Jogado fora” comunica naturalmente tanto a rejeição quanto o movimento para fora expresso por βληθὲν ἔξω.
- source_word: καταπατεῖσθαι
  choice: pisado
  rationale: É uma tradução direta e natural da ação de calcar ou pisotear, sem tornar a frase excessivamente pesada.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: pelas pessoas
  rationale: ἄνθρωποι refere-se aqui aos seres humanos em geral, não especificamente a homens do sexo masculino. “Pessoas” comunica esse alcance genérico com clareza em português atual.
theological_decisions:
- issue: Sentido genérico de ὑπὸ τῶν ἀνθρώπων
  choice: pelas pessoas
  alternative: pelos homens
  rationale: O referente é a humanidade em sentido geral. “Pelas pessoas” preserva o sentido sem sugerir indevidamente que apenas indivíduos do sexo masculino estão em vista.
- issue: Possível associação de μωρανθῇ com a ideia de insensatez
  choice: perder o sabor
  alternative: tornar-se insípido / tornar-se tolo
  rationale: Embora o verbo seja cognato de termos ligados à insensatez, sua aplicação ao sal determina aqui o sentido de tornar-se sem sabor. A tradução não introduz um jogo teológico que o contexto não exige.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por construções naturais de ampla legibilidade brasileira. “Vocês” representa adequadamente o plural ὑμεῖς; “pisado” evita uma formulação rebuscada, mantendo a imagem concreta.
