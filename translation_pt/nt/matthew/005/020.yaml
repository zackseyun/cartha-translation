id: MAT.5.20
reference: Matthew 5:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: pt
  text: 'Pois eu lhes digo: se a justiça[a] de vocês não superar a dos escribas e fariseus, vocês de modo nenhum entrarão no Reino dos céus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”. O termo grego pode indicar tanto justiça quanto uma vida reta; neste contexto, refere-se à conformidade com a vontade de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Pois eu lhes digo
  rationale: Mantém a força explicativa de γάρ e a fala direta de Jesus em português natural e atual.
- source_word: ἐὰν μὴ
  choice: se ... não
  rationale: Expressa com clareza a condição negativa necessária; nesta construção, soa mais natural do que “a menos que”.
- source_word: περισσεύσῃ ... πλεῖον
  choice: não superar
  rationale: A combinação comparativa indica exceder em medida ou qualidade. “Superar” é conciso e preserva a comparação.
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: a justiça de vocês
  rationale: “Justiça” conserva a amplitude de δικαιοσύνη, que aqui abrange a vida reta e a conduta conforme a vontade de Deus. A nota registra “retidão” como alternativa contextual.
- source_word: τῶν γραμματέων καὶ Φαρισαίων
  choice: a dos escribas e fariseus
  rationale: O artigo e o pronome implícito em “a dos” deixam claro que a justiça dos grupos é o termo da comparação. “Escribas” e “fariseus” são as designações tradicionais e precisas.
- source_word: οὐ μὴ εἰσέλθητε
  choice: vocês de modo nenhum entrarão
  rationale: “De modo nenhum” transmite a negação enfática οὐ μή sem recorrer a linguagem arcaica.
- source_word: τὴν βασιλείαν τῶν οὐρανῶν
  choice: no Reino dos céus
  rationale: É a forma portuguesa consagrada da expressão característica de Mateus e mantém o plural formal de τῶν οὐρανῶν.
theological_decisions:
- issue: Sentido de δικαιοσύνη no contexto de Mateus 5
  choice: justiça
  alternative: retidão
  rationale: “Justiça” mantém o termo bíblico amplo sem reduzi-lo apenas a comportamento moral nem a justiça social. “Retidão” esclarece a dimensão de viver corretamente, mas estreita um pouco o campo semântico; por isso aparece em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês” para o plural. A construção evita formalismo excessivo, preserva a comparação explícita e mantém a forte negação do original.
