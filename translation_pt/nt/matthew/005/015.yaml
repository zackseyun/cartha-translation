source:
  edition: SBLGNT
  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: pt
  text: Também não se acende uma lamparina para colocá-la debaixo de um recipiente de medir[a], mas sobre um suporte para lamparina; e ela ilumina todos os que estão na casa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «debaixo de uma medida de grãos»; tradicionalmente, «debaixo de um alqueire». O grego μόδιος designa uma medida para produtos secos e, por extensão, o recipiente usado para medir.
    reason: lexical_alternative
  - marker: b
    text: Ou «e ela brilha para todos os que estão na casa».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Também não
  rationale: Liga esta segunda imagem à declaração anterior e mantém com naturalidade a força aditiva e negativa do grego.
- source_word: καίουσιν λύχνον
  choice: se acende uma lamparina
  rationale: O plural genérico grego pode ser expresso naturalmente em português pela construção impessoal com «se»; «acender uma lamparina» é idiomático e preserva o objeto concreto.
- source_word: ὑπὸ τὸν μόδιον
  choice: debaixo de um cesto de medir
  rationale: μόδιος designa uma medida para secos e, por extensão, seu recipiente. «Cesto de medir» torna essa função perceptível sem recorrer ao tradicional e pouco transparente «alqueire».
- source_word: ἐπὶ τὴν λυχνίαν
  choice: sobre um suporte
  rationale: λυχνία é o suporte em que se punha a lamparina. No contexto imediato, «suporte» é claro e evita a expressão menos corrente «suporte de lamparina».
- source_word: λάμπει
  choice: ela ilumina
  rationale: Expressa de modo natural tanto o brilho da lamparina quanto seu efeito sobre as pessoas, sem perder a referência explícita ao objeto.
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: todos os que estão na casa
  rationale: Preserva o alcance universal de πᾶσιν e o sentido espacial de οἰκίᾳ.
theological_decisions:
- issue: Sujeito plural genérico não expresso no grego
  choice: Também não se acende uma lamparina
  alternative: As pessoas também não acendem uma lamparina
  rationale: A construção com «se» comunica em português a generalidade proverbial do plural grego sem introduzir um referente ambíguo para «eles».
- issue: Relação de λάμπει com πᾶσιν
  choice: ela ilumina todos os que estão na casa
  alternative: ela brilha para todos os que estão na casa
  rationale: «Ilumina» explicita naturalmente o efeito da luz sobre todos, enquanto a nota registra a tradução mais formal «brilha para», preservando a possibilidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Lamparina» comunica melhor do que «lâmpada» o pequeno objeto alimentado por óleo do cenário antigo. A ordem e o contraste do grego foram mantidos, com leve explicitação funcional em «cesto de medir».
