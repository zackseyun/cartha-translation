id: MAT.5.3
reference: Matthew 5:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μακάριοι οἱ πτωχοὶ τῷ πνεύματι, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/003.yaml
  text: Blessed are the poor in spirit[c][b][a], because the kingdom of heaven is theirs.
translation:
  language: pt
  text: Felizes os pobres em espírito[a], porque deles é o Reino dos céus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pobres em espírito” também pode ser entendido como “espiritualmente pobres” ou “os que reconhecem sua necessidade espiritual”. A tradução mantém a expressão grega sem restringir seu sentido.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “Reino dos céus”, expressão característica de Mateus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Felizes
  rationale: Em português, “felizes” é a formulação consagrada e natural das bem-aventuranças. Aqui indica uma condição digna de ser celebrada por causa do favor divino, não apenas um sentimento subjetivo.
- source_word: οἱ πτωχοὶ
  choice: os pobres
  rationale: Preserva a força substantivada do adjetivo grego e sua ideia básica de pobreza ou indigência, sem restringi-la a “mendigos”.
- source_word: τῷ πνεύματι
  choice: em espírito
  rationale: Mantém a expressão compacta e interpretativamente aberta do grego. Evita explicitar “espiritualmente necessitados” ou sugerir especificamente o Espírito Santo.
- source_word: ὅτι
  choice: porque
  rationale: Introduz de modo claro e atual a razão da declaração de felicidade.
- source_word: αὐτῶν ἐστιν
  choice: deles é
  rationale: Reproduz o presente de ἐστιν e dá destaque à posse, mantendo a ordem idiomática e solene comum em português.
- source_word: ἡ βασιλεία
  choice: o Reino
  rationale: “Reino” é a tradução convencional e compreensível de βασιλεία, preservando suas dimensões de domínio e governo real.
- source_word: τῶν οὐρανῶν
  choice: dos céus
  rationale: Reflete o plural do grego e corresponde à expressão mateana tradicional e natural em português, “Reino dos céus”.
theological_decisions:
- issue: Sentido de “pobres em espírito”
  choice: Manter “pobres em espírito” sem expansão interpretativa.
  alternative: “espiritualmente pobres”, “humildes” ou “os que reconhecem sua necessidade espiritual”
  rationale: A expressão grega admite nuances e não identifica explicitamente uma única interpretação. A tradução preserva essa abertura teológica.
- issue: Tempo presente da posse do Reino
  choice: “deles é o Reino”
  alternative: “deles será o Reino” ou “o Reino lhes será dado”
  rationale: O grego emprega o presente ἐστιν; a tradução não transforma a posse presente em promessa apenas futura.
translation_notes:
  register: Português moderno, claro e digno, com formulação reconhecível das bem-aventuranças. “Felizes” favorece ampla compreensão contemporânea; “Reino” recebe inicial maiúscula por convenção editorial referente ao governo divino. Os marcadores aparecem imediatamente após as expressões pertinentes.
