id: MAT.5.33
reference: Matthew 5:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: pt
  text: 'Vocês também ouviram que foi dito aos antigos: “Não jurarás falsamente[a], mas cumprirás os juramentos que fizeste ao Senhor[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não quebrarás um juramento”; o verbo pode referir-se a jurar falsamente ou a violar um juramento.'
    reason: alternativa lexical
  - marker: b
    text: 'Ou: “ao SENHOR”, refletindo o nome divino da aliança no pano de fundo do Antigo Testamento.'
    reason: leitura alternativa
lexical_decisions:
- source_word: Πάλιν
  choice: também
  rationale: Introduz mais um exemplo na sequência. “Também” expressa com naturalidade em português a progressão do discurso, sem sugerir que a mesma declaração esteja simplesmente sendo repetida.
- source_word: ἠκούσατε
  choice: vocês ouviram
  rationale: O aoristo foi vertido pelo pretérito perfeito, forma idiomática em português. “Vocês” oferece ampla legibilidade brasileira e deixa explícito o plural do verbo grego.
- source_word: ἐρρέθη
  choice: foi dito
  rationale: Preserva a construção passiva e impessoal do grego, sem identificar além do texto quem falou.
- source_word: τοῖς ἀρχαίοις
  choice: aos antigos
  rationale: Designa as gerações do passado, e não apenas pessoas idosas. A expressão é concisa e adequada ao registro bíblico.
- source_word: Οὐκ ἐπιορκήσεις
  choice: Não jurarás falsamente
  rationale: Mantém a forma singular da formulação legal citada e o sentido primário de prestar juramento falso, sem restringi-lo ao termo jurídico moderno “perjúrio”. A possibilidade de violar um juramento é preservada em nota.
- source_word: ἀποδώσεις
  choice: cumprirás
  rationale: No contexto de juramentos, ἀποδίδωμι indica executar aquilo a que a pessoa se obrigou, sentido expresso naturalmente por “cumprir”.
- source_word: τῷ κυρίῳ
  choice: ao Senhor
  rationale: O referente é Deus, e “Senhor” traduz diretamente κύριος. A possível representação do nome divino no pano de fundo veterotestamentário é registrada em nota.
- source_word: τοὺς ὅρκους σου
  choice: os juramentos que fizeste
  rationale: Explicita de modo natural em português que se trata dos juramentos da pessoa interpelada, sem alterar o conteúdo do objeto grego.
theological_decisions:
- issue: Tradução de κύριος em uma alusão às Escrituras de Israel
  choice: Senhor
  alternative: SENHOR
  rationale: O texto grego traz κυρίῳ, não o nome divino hebraico. “Senhor” mantém essa forma grega, enquanto a nota preserva a possibilidade de que a alusão veterotestamentária remeta ao nome da aliança.
- issue: Amplitude semântica de ἐπιορκέω
  choice: jurar falsamente
  alternative: quebrar um juramento
  rationale: O verbo pode referir-se tanto a jurar falsamente quanto a violar um juramento. A tradução principal conserva o sentido direto de juramento falso, e a nota mantém a alternativa sem reduzir o termo à categoria jurídica mais estreita de perjúrio.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O discurso dirigido aos ouvintes usa “vocês”, enquanto a citação legal conserva o singular “tu” nas formas verbais “jurarás” e “cumprirás”, como no grego. A ordem foi levemente ajustada em “os juramentos que fizeste ao Senhor” para obter naturalidade sem apagar a relação dativa com o Senhor.
