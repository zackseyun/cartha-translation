id: MAT.5.28
reference: Matthew 5:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: pt
  text: Mas eu lhes digo que todo aquele que olha para uma mulher a fim de desejá-la já cometeu adultério com ela em seu coração.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido como “mulher” também pode significar “esposa”, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para cobiçá-la”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Mas eu lhes digo
  rationale: Preserva o contraste de δέ e a ênfase do pronome explícito ἐγώ, usando uma formulação natural e digna em português.
- source_word: πᾶς ὁ βλέπων
  choice: todo aquele que olha
  rationale: Expressa a força universal e genérica da construção sem acrescentar ao texto grego uma referência explícita a “homem”.
- source_word: γυναῖκα
  choice: uma mulher
  rationale: γυνή pode significar “mulher” ou “esposa”, conforme o contexto. A formulação geral e sem artigo favorece “uma mulher”, sem eliminar a outra possibilidade lexical.
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτὴν
  choice: a fim de desejá-la
  rationale: “A fim de” conserva a ideia de propósito ou intenção da construção πρὸς τό com infinitivo. “Desejá-la” mantém a amplitude lexical de ἐπιθυμέω, enquanto o contexto de adultério deixa claro o caráter sexual e indevido do desejo.
- source_word: ἤδη ἐμοίχευσεν αὐτὴν
  choice: já cometeu adultério com ela
  rationale: “Já” traduz diretamente ἤδη, e “cometeu adultério com ela” é a forma idiomática de representar μοιχεύω com o objeto αὐτήν.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: em seu coração
  rationale: Mantém a imagem bíblica de καρδία como o centro interior do pensamento, da vontade e do desejo, em linguagem corrente.
theological_decisions:
- issue: Se γυνή deve ser traduzido como “mulher” ou “esposa” no contexto do adultério
  choice: mulher
  alternative: esposa
  rationale: O grego não especifica de modo inequívoco o estado civil. “Mulher” preserva a generalidade do enunciado, enquanto uma nota registra a ambiguidade lexical genuína.
- issue: Se ἐπιθυμέω deve ser traduzido por “desejar” ou por “cobiçar”
  choice: desejar
  alternative: cobiçar
  rationale: O verbo grego possui alcance mais amplo que o desejo sexual pecaminoso, embora esse sentido seja claro neste contexto. “Desejar” mantém transparência lexical; “cobiçar” é registrado como alternativa contextual legítima.
- issue: Se a construção πρὸς τὸ ἐπιθυμῆσαι descreve propósito ou apenas desejo concomitante
  choice: a fim de desejá-la
  alternative: com desejo por ela
  rationale: A construção preposicional com infinitivo indica finalidade ou intenção. A tradução principal preserva esse elemento e evita transformar o versículo numa condenação indiscriminada de qualquer olhar involuntário.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem e as imagens centrais do grego foram preservadas, mas com sintaxe portuguesa natural. “A fim de” assinala deliberadamente a intenção expressa pela construção grega.
