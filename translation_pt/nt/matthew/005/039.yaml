  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: pt
  text: 'Mas eu lhes digo: não resistam à pessoa má.[a] Pelo contrário, se alguém lhe der um tapa na bochecha direita, virem também a outra bochecha para ele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não resistam ao mal”; alternativamente, “não resistam ao Maligno”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Mas eu lhes digo
  rationale: Preserva o contraste expresso por δέ e a fórmula enfática e autoritativa de Jesus, em português atual e digno.
- source_word: μὴ ἀντιστῆναι
  choice: não resistam
  rationale: Mantém o sentido amplo de colocar-se contra ou resistir, sem restringi-lo indevidamente a oposição jurídica ou retaliação, embora o exemplo seguinte destaque a não retaliação.
- source_word: τῷ πονηρῷ
  choice: à pessoa má
  rationale: A forma substantivada é gramaticalmente ambígua, mas o exemplo imediatamente seguinte favorece um agente humano genérico. A redação principal conserva essa leitura contextual, e as demais ficam registradas em nota.
- source_word: ὅστις
  choice: se alguém
  rationale: Expressa naturalmente em português a força indefinida e condicional da construção.
- source_word: ῥαπίζει
  choice: der um tapa
  rationale: ῥαπίζω indica com frequência um golpe dado com a mão, especialmente um tapa; esta escolha combina com a face e conserva a nuance de afronta ou humilhação.
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: na face direita
  rationale: σιαγών pode designar a mandíbula ou a face; no contexto de um tapa, “face” é natural, clara e digna em português amplo.
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: volte-lhe também a outra
  rationale: Traduz diretamente στρέφω como “voltar” e deixa “face” subentendida pelo contexto, sem acrescentar a nuance interpretativa mais forte de “oferecer”.
theological_decisions:
- issue: Sentido de τῷ πονηρῷ
  choice: 'referência pessoal genérica: “à pessoa má”'
  alternative: 'referência abstrata: “ao mal”; ou referência pessoal específica: “ao Maligno”'
  rationale: O grego admite as três leituras. O agressor humano da ilustração seguinte favorece a referência pessoal genérica, mas a ambiguidade legítima é preservada em nota, sem impor uma leitura demonológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. “Lhes” evita marcar gênero no objeto indireto; “pessoa má” explicita o provável referente humano sem apagar em nota a ambiguidade do original. O singular “lhe” acompanha o exemplo individual do grego.
