id: MAT.5.43
reference: Matthew 5:43
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη· Ἀγαπήσεις τὸν πλησίον σου καὶ μισήσεις τὸν ἐχθρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: pt
  text: 'Vocês ouviram que foi dito[a]: “Ame o seu próximo e odeie o seu inimigo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A primeira parte ecoa Levítico 19:18. A segunda — “e odeie o seu inimigo” — não é uma citação direta do Antigo Testamento, mas reflete um ensino recebido que Jesus está corrigindo.
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Vocês ouviram
  rationale: O aoristo introduz, nesta fórmula de ensino, algo recebido anteriormente pelos ouvintes. “Vocês ouviram” é natural em português e preserva a referência à instrução já transmitida.
- source_word: ἐρρέθη
  choice: foi dito
  rationale: Mantém a forma passiva e impessoal do grego sem identificar indevidamente quem falou.
- source_word: Ἀγαπήσεις
  choice: Ame
  rationale: O futuro do indicativo tem força de mandamento. Em português atual, o imperativo “Ame” comunica essa função com mais naturalidade do que o futuro literal “amarás”.
- source_word: τὸν πλησίον σου
  choice: o seu próximo
  rationale: “Próximo” é o equivalente ético e bíblico estabelecido, apropriado à alusão a Levítico 19:18.
- source_word: μισήσεις
  choice: odeie
  rationale: O futuro também tem força injuntiva nesta fala citada; “odeie” mantém o paralelismo direto com “Ame”.
- source_word: τὸν ἐχθρόν σου
  choice: o seu inimigo
  rationale: “Inimigo” é o equivalente direto e natural no contraste ético do versículo.
theological_decisions:
- issue: Status da frase “e odeie o seu inimigo”
  choice: Apresentá-la como parte integral do ensino que os ouvintes haviam recebido, sem afirmar que toda a frase é citação direta das Escrituras.
  alternative: Tratar toda a declaração como citação igualmente direta do Antigo Testamento, ou identificar no texto principal a segunda parte como tradição interpretativa.
  rationale: O grego apresenta uma única declaração relatada sob “foi dito”. A nota esclarece que apenas a primeira parte ecoa diretamente Levítico 19:18, preservando tanto a forma do texto quanto a tensão histórica e teológica.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural explícito e imperativos naturais. Evita o futuro solene “amarás/odiarás”, menos corrente no português contemporâneo, sem enfraquecer a força de mandamento.
