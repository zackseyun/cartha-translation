  text: μακάριοι οἱ πραεῖς, ὅτι αὐτοὶ κληρονομήσουσι τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/005.yaml
  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: pt
  text: Felizes os mansos[a], porque herdarão a terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os gentis»; aqui, «mansos» indica humildade e gentileza, não fraqueza.
    reason: lexical_alternative
  - marker: b
    text: A palavra grega também pode significar «terra» no sentido de território. A frase provavelmente retoma o Salmo 37:11 e pode evocar tanto a terra da aliança quanto um alcance mais amplo.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Felizes
  rationale: No contexto das bem-aventuranças, exprime a condição favorecida e plena daqueles que recebem a aprovação e a promessa de Deus, sem se limitar a uma emoção passageira.
- source_word: οἱ πραεῖς
  choice: os mansos
  rationale: Preserva a ideia de humildade e gentileza sob domínio, não de fraqueza ou passividade; o artigo e o adjetivo substantivado são naturalmente representados por «os mansos».
- source_word: ὅτι
  choice: porque
  rationale: Introduz de modo claro e natural a razão ligada à bem-aventurança.
- source_word: αὐτοὶ
  choice: eles, implícito na forma verbal «herdarão»
  rationale: O pronome grego é enfático. Em português, o contraste já é comunicado com naturalidade pelo sujeito retomado na flexão verbal; explicitar «eles é que» daria ênfase excessiva.
- source_word: κληρονομήσουσι
  choice: herdarão
  rationale: Equivalente direto e idiomático que mantém a linguagem de herança e sua possível ligação com a promessa da aliança.
- source_word: τὴν γῆν
  choice: a terra
  rationale: «Terra» conserva em português a amplitude de γῆ, podendo designar tanto o mundo terrestre quanto uma terra ou território prometido.
theological_decisions:
- issue: Alcance de τὴν γῆν
  choice: a terra
  alternative: a terra prometida / o mundo
  rationale: O grego permite tanto um sentido universal quanto um sentido territorial ligado à aliança. A formulação «a terra» mantém essa tensão e permite ouvir a provável alusão ao Salmo 37:11 sem restringir a promessa.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira e compreensão internacional. A redação mantém a forma breve e memorável da bem-aventurança.
