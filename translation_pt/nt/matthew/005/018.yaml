id: MAT.5.18
reference: Matthew 5:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: pt
  text: 'Pois, em verdade lhes digo: até que o céu e a terra passem, nem um só iota[a] nem um só pequeno traço[b] jamais passará da lei, até que tudo aconteça.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Iota é o nome da menor letra do alfabeto grego; aqui representa a menor letra possível.
    reason: lexical_alternative
  - marker: b
    text: 'Isto é, uma diminuta marca escrita que distingue uma letra de outra. Tradicionalmente: “um só til”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “até que tudo se cumpra” ou “até que tudo se realize”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: em verdade
  rationale: Na fórmula introdutória de Jesus, expressa uma afirmação solene e autorizada. “Em verdade” é natural no registro bíblico português sem deixar o termo sem tradução.
- source_word: γὰρ
  choice: pois
  rationale: Mantém a função explicativa que liga esta declaração ao que a precede.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Forma direta e corrente que conserva o tom solene da declaração de Jesus.
- source_word: ἕως ἂν παρέλθῃ
  choice: até que ... passem
  rationale: Representa a contingência futura da construção e o sentido de deixar de existir ou chegar ao fim, sem explicá-lo em excesso.
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: o céu e a terra
  rationale: Equivalente português natural que preserva o alcance cósmico da expressão.
- source_word: ἰῶτα ἓν
  choice: um só iota
  rationale: Preserva o nome específico da letra empregado no grego; “só” comunica o valor enfático do numeral.
- source_word: μία κεραία
  choice: um só pequeno traço
  rationale: Comunica a ideia de uma diminuta marca gráfica ou projeção que distingue letras, evitando o arcaísmo “til” no sentido antigo de pequeno sinal.
- source_word: οὐ μὴ παρέλθῃ
  choice: jamais passará
  rationale: A combinação οὐ μή com o subjuntivo constitui uma negação enfática; “jamais” preserva essa força em português natural.
- source_word: ἀπὸ τοῦ νόμου
  choice: da lei
  rationale: Traduz diretamente νόμος e mantém aberta, conforme o contexto, a extensão exata da referência à lei bíblica.
- source_word: ἕως ἂν πάντα γένηται
  choice: até que tudo aconteça
  rationale: Preserva o sentido amplo de tudo vir a ocorrer, sem restringir a expressão à ideia de cumprimento; a alternativa possível é registrada em nota.
theological_decisions:
- issue: Alcance de νόμος
  choice: “a lei”, entendida contextualmente como a lei bíblica
  alternative: a Torá especificamente ou, por extensão, o conjunto das Escrituras anteriores
  rationale: Mateus 5:17 menciona “a Lei e os Profetas”, mas o presente versículo diz apenas “a lei”. A tradução conserva essa forma e não decide no texto se a referência se limita ao Pentateuco ou se é mais ampla.
- issue: Sentido de πάντα γένηται
  choice: “até que tudo aconteça”
  alternative: “até que tudo se cumpra” ou “até que tudo se realize”
  rationale: γίνομαι pode indicar que algo acontece, vem a ser ou se realiza. A formulação principal conserva a amplitude e a tensão teológica, enquanto a nota apresenta a leitura de cumprimento sem impô-la.
translation_notes:
  register: Português moderno, claro e solene, com construção amplamente compreensível no Brasil e em outras comunidades lusófonas. A repetição “um só ... um só” preserva a ênfase e o paralelismo do grego; “jamais” comunica a forte negação sem recorrer a uma formulação artificial.
