id: MAT.5.4
reference: Matthew 5:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μακάριοι οἱ πενθοῦντες, ὅτι αὐτοὶ παρακληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: pt
  text: Felizes os que choram[a], porque serão consolados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os que estão de luto» ou «os que se entristecem». O grego tem sentido amplo e não especifica a causa do lamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Felizes
  rationale: Na fórmula das bem-aventuranças, «felizes» expressa uma avaliação objetiva da condição dessas pessoas diante de Deus, não apenas um estado emocional; é natural e amplamente compreensível no português atual.
- source_word: οἱ πενθοῦντες
  choice: os que choram
  rationale: O particípio presente substantivado é vertido por uma construção plural natural. «Choram» mantém amplo o lamento por perda, sofrimento, pecado ou outra causa, sem especificar no texto aquilo que o grego deixa em aberto.
- source_word: ὅτι
  choice: porque
  rationale: Introduz de modo claro a razão da declaração de felicidade e preserva o valor causal da conjunção.
- source_word: αὐτοὶ
  choice: — implícito em «serão»
  rationale: Embora o pronome grego tenha certa ênfase, o português normalmente a comunica de maneira suficiente pela estrutura da bem-aventurança; «eles mesmos» seria marcado em excesso.
- source_word: παρακληθήσονται
  choice: serão consolados
  rationale: Preserva tanto o sentido futuro de receber consolo quanto a forma passiva do verbo grego, em linguagem digna e corrente.
theological_decisions:
- issue: Âmbito do lamento na bem-aventurança
  choice: Manter a formulação ampla «os que choram», sem indicar a causa.
  alternative: «os que choram por seus pecados», «os enlutados» ou «os que lamentam a condição de Israel»
  rationale: O texto grego não define o objeto nem a causa do lamento. A tradução preserva essa abertura teológica e pastoral, sem impor uma interpretação mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Felizes» evita a menor naturalidade de «bem-aventurados» sem reduzir a frase a uma emoção subjetiva; a nota preserva a extensão semântica de πενθέω.
