id: MAT.5.6
reference: Matthew 5:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: pt
  text: Felizes os que têm fome e sede de justiça[a], porque eles serão saciados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de retidão”. A palavra grega pode indicar justiça, retidão ou aquilo que é correto diante de Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Felizes
  rationale: Fórmula natural e digna para as bem-aventuranças em português; expressa uma condição objetiva de favor e bem-aventurança, sem se limitar a uma emoção passageira.
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: os que têm fome e sede
  rationale: Conserva a metáfora concreta e a ideia dos particípios presentes de desejo contínuo, em português corrente.
- source_word: τὴν δικαιοσύνην
  choice: de justiça
  rationale: δικαιοσύνη pode abranger justiça, retidão e aquilo que é correto diante de Deus. 'Justiça' é natural em português e mantém juntas as dimensões pessoal, relacional e social; a nota registra a alternativa 'retidão'.
- source_word: ὅτι
  choice: porque
  rationale: Introduz de modo claro e natural a razão da declaração de felicidade.
- source_word: αὐτοὶ
  choice: —
  rationale: A ênfase do pronome grego recai sobre os mesmos que têm fome e sede; em português, a flexão verbal e a continuidade do sujeito transmitem isso naturalmente, sem acrescentar um pronome pesado.
- source_word: χορτασθήσονται
  choice: serão saciados
  rationale: Preserva o futuro passivo e prolonga a imagem de fome e sede, indicando satisfação plena recebida, sem explicitar o agente.
theological_decisions:
- issue: Amplitude semântica de δικαιοσύνη
  choice: justiça
  alternative: retidão; aquilo que é correto diante de Deus
  rationale: O termo grego permite uma amplitude que inclui conduta reta, relações justas e conformidade com a vontade de Deus. O texto principal usa 'justiça', termo amplo e idiomático em português, enquanto a nota preserva outras nuances sem restringir a interpretação.
- issue: Agente implícito em χορτασθήσονται
  choice: 'manter o passivo: ''serão saciados'''
  alternative: Deus os saciará
  rationale: O passivo pode sugerir a ação divina, mas o grego não nomeia explicitamente o agente. A tradução mantém essa forma e evita tornar explícito o que permanece implícito.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o paralelismo conciso das bem-aventuranças e a metáfora de fome, sede e saciedade.
