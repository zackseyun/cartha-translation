source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: pt
  text: 'Mas eu lhes digo que todo aquele que se ira contra seu irmão[a] estará sujeito ao julgamento; e quem disser a seu irmão: “Racá”[b] estará sujeito ao conselho[c]; e quem disser: “Tolo” estará sujeito à Geena de fogo[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos acrescentam “sem motivo” depois de “se ira contra seu irmão”. A leitura mais antiga e mais bem atestada omite essas palavras. “Irmão” traduz um termo masculino singular que pode ter sentido representativo; a advertência não se limita a irmãos biológicos do sexo masculino.
    reason: textual_variant_and_lexical_note
  - marker: b
    text: “Racá” é um insulto aramaico, com sentido aproximado de “cabeça vazia” ou “inútil”.
    reason: cultural_note
  - marker: c
    text: Ou “ao Sinédrio”, o conselho governante judaico.
    reason: alternative_reading
  - marker: d
    text: Ou “ao inferno de fogo”. “Geena” preserva o termo específico empregado por Jesus, ligado à imagem do vale de Hinom e associado ao juízo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Mas eu lhes digo
  rationale: Preserva o contraste enfático de ἐγώ com δέ e soa natural em português.
- source_word: πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ αὐτοῦ
  choice: todo aquele que se ira contra seu irmão
  rationale: Expressa a força geral do particípio presente; “contra” torna clara a direção relacional da ira sem acrescentar a variante textual “sem motivo”.
- source_word: ἔνοχος ἔσται
  choice: estará sujeito
  rationale: Mantém a ideia jurídico-penal de estar passível de julgamento ou punição e funciona nas três construções paralelas.
- source_word: τῇ κρίσει
  choice: a julgamento
  rationale: Preserva a referência judicial sem decidir se se trata especificamente de um tribunal local ou do processo de julgamento em sentido mais amplo.
- source_word: Ῥακά
  choice: Racá
  rationale: Translitera o insulto aramaico conservado no texto grego e explica seu sentido em nota.
- source_word: τῷ συνεδρίῳ
  choice: ao conselho
  rationale: Traduz o substantivo sem identificar de modo excessivamente específico o órgão como o Sinédrio; essa possibilidade é indicada em nota.
- source_word: Μωρέ
  choice: Tolo
  rationale: Verte diretamente o vocativo insultuoso, preservando sua carga moral, sem recorrer a um termo moderno anacrônico.
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: à Geena de fogo
  rationale: Conserva o termo histórico e imagético usado por Jesus e mantém a construção genitiva “de fogo”.
theological_decisions:
- issue: Variante textual após “se ira contra seu irmão”
  choice: Omitir “sem motivo” do texto principal
  alternative: Incluir “sem motivo”
  rationale: A leitura de SBLGNT omite εἰκῇ, e a evidência manuscrita mais antiga e forte favorece a forma mais curta; a variante é registrada em nota.
- issue: Sentido de γέεννα
  choice: Geena
  alternative: inferno
  rationale: “Geena” preserva o pano de fundo judaico da imagem do vale de Hinom e evita incorporar ao termo todas as associações teológicas posteriores de “inferno”, sem enfraquecer a advertência de juízo.
- issue: Alcance de ἀδελφός
  choice: irmão
  alternative: irmão ou irmã; próximo; companheiro de fé
  rationale: Mantém o substantivo masculino singular do grego, reconhecendo em nota que ele pode ter função representativa e que a advertência não se limita a irmãos biológicos do sexo masculino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Usa “lhes” no discurso plural, mantém os paralelos jurídicos do versículo e conserva “Racá” e “Geena” para preservar a textura histórica do original.
