base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/038.yaml
  text: You have heard that it was said[a], ‘An eye for an eye and a tooth for a tooth.’
translation:
  language: pt
  text: 'Vocês ouviram que foi dito: “Olho por olho e dente por dente.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Vocês ouviram
  rationale: O aoristo, nesta fórmula introdutória de Mateus, aponta para o ensino recebido pelos ouvintes. Em português corrente, o pretérito perfeito é natural e mantém a referência ao que eles ouviram.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo daquilo que foi ouvido, como conjunção integrante.
- source_word: ἐρρέθη
  choice: foi dito
  rationale: Preserva a construção passiva e impessoal do grego sem identificar explicitamente quem falou.
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: Olho por olho
  rationale: A formulação tradicional em português é clara, reconhecível e expressa adequadamente a correspondência ou substituição indicada por ἀντί.
- source_word: καὶ
  choice: e
  rationale: Mantém a coordenação simples entre os dois membros paralelos.
- source_word: ὀδόντα ἀντὶ ὀδόντος
  choice: dente por dente
  rationale: Conserva o paralelismo da máxima jurídica e traduz ἀντί de modo idiomático e exato.
theological_decisions:
- issue: Formulação do princípio jurídico citado por Jesus
  choice: Olho por olho e dente por dente
  alternative: Um olho em lugar de um olho e um dente em lugar de um dente
  rationale: A expressão consagrada em português representa com precisão a máxima de talião citada do texto legal, sem decidir se sua aplicação deve ser entendida como retaliação literal ou como princípio de proporcionalidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural explícito. A máxima jurídica foi mantida em sua forma tradicional e reconhecível. Não se acrescentou nota, pois “por” transmite naturalmente o valor de ἀντί neste contexto, e uma alternativa excessivamente literal pouco ajudaria o leitor.
