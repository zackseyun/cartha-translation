id: MAT.5.30
reference: Matthew 5:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: pt
  text: E, se a sua mão direita leva você a tropeçar[a], corte-a e jogue-a para longe de você. Pois é melhor para você que uma das partes do seu corpo se perca do que o seu corpo inteiro vá para a Geena[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “leva você a pecar”. O verbo grego traz literalmente a ideia de fazer tropeçar.
    reason: lexical_alternative
  - marker: b
    text: Ou “inferno”. “Geena” vem do nome do vale de Hinom e é usada aqui em referência ao juízo escatológico.
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά ... χείρ
  choice: sua mão direita
  rationale: Expressão portuguesa natural que preserva a especificidade corporal e o paralelo retórico com o versículo anterior.
- source_word: σκανδαλίζει
  choice: leva você a tropeçar
  rationale: Preserva a metáfora de tropeço e, no contexto, sugere indução ao pecado sem substituir a imagem por uma explicação.
- source_word: ἔκκοψον
  choice: corte-a
  rationale: Imperativo direto e decisivo; o pronome feminino retoma naturalmente “mão”.
- source_word: βάλε ἀπὸ σοῦ
  choice: jogue-a para longe de você
  rationale: Reproduz tanto a ação vigorosa de βάλε quanto a ideia explícita de afastamento em ἀπὸ σοῦ.
- source_word: συμφέρει γάρ σοι
  choice: Pois é melhor para você
  rationale: Comunica vantagem comparativa de modo corrente e solene, sem a conotação financeira de “proveitoso”.
- source_word: ἵνα ἀπόληται
  choice: que ... se perca
  rationale: Expressa a perda da parte do corpo com linguagem natural, mantendo a gravidade do contraste.
- source_word: ἓν τῶν μελῶν σου
  choice: uma das partes do seu corpo
  rationale: “Partes do corpo” é claro e abrangente; evita o arcaísmo de “membros” e a restrição de “membros” no sentido de braços e pernas.
- source_word: ὅλον τὸ σῶμά σου
  choice: o seu corpo inteiro
  rationale: Preserva claramente o contraste entre uma parte e a totalidade do corpo.
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: vá para a Geena
  rationale: Reflete o verbo de movimento e conserva o termo histórico e escatológico γέεννα, sem introduzir a ideia de ser lançado, ausente nesta oração.
theological_decisions:
- issue: Tradução de γέεννα
  choice: Geena
  alternative: inferno
  rationale: “Geena” translitera o termo grego ligado ao vale de Hinom e preserva sua carga histórica e escatológica. “Inferno” é uma glosa contextual conhecida, mas pode trazer associações doutrinárias posteriores mais amplas que o termo-fonte.
- issue: Força contextual de σκανδαλίζει
  choice: leva você a tropeçar
  alternative: leva você a pecar
  rationale: A tradução principal mantém a metáfora do tropeço; a nota explicita o sentido contextual sem eliminar a imagem do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações e a imagem corporal foram preservadas, enquanto “partes do seu corpo” evita ambiguidade e arcaísmo. Todos os marcadores de nota aparecem junto aos termos correspondentes.
