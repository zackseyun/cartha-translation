id: MAT.5.45
reference: Matthew 5:45
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: pt
  text: para que vocês se tornem filhos de seu Pai que está nos céus[a], porque ele faz o seu sol nascer sobre maus e bons e faz chover sobre justos e injustos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu Pai que está no céu”. Em grego, “nos céus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “chove sobre justos e injustos”. A expressão “faz chover” torna explícita em português a ação de Deus já indicada pelo sujeito no grego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: para que
  rationale: Introduz finalidade ou resultado e preserva de modo natural a força da oração grega.
- source_word: γένησθε
  choice: vocês se tornem
  rationale: Preserva a força dinâmica de γίνομαι, em vez de reduzi-la ao sentido estático de 'ser'.
- source_word: υἱοὶ
  choice: filhos
  rationale: Mantém o termo filial masculino explícito no grego; no contexto, ele abrange os discípulos em geral.
- source_word: τοῦ πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: de seu Pai que está nos céus
  rationale: Representa separadamente 'seu Pai' e a expressão locativa, mantendo também o plural οὐρανοῖς de maneira idiomática em português bíblico.
- source_word: ὅτι
  choice: porque
  rationale: Apresenta com clareza a razão explicativa da afirmação anterior.
- source_word: τὸν ἥλιον αὐτοῦ ἀνατέλλει
  choice: faz o seu sol nascer
  rationale: Conserva o possessivo explícito e expressa naturalmente a construção causativa e a ação divina.
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: sobre maus e bons
  rationale: Os adjetivos são substantivados; a formulação concisa preserva o paralelismo proverbial do grego.
- source_word: βρέχει
  choice: faz chover
  rationale: É uma formulação portuguesa natural que preserva Deus como agente do verbo.
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: sobre justos e injustos
  rationale: Mantém o par moral tradicional e o equilíbrio da construção grega.
theological_decisions:
- issue: Linguagem filial marcada por gênero
  choice: filhos de seu Pai
  alternative: filhos e filhas de seu Pai; crianças de seu Pai
  rationale: O texto usa υἱοί, não τέκνα. 'Filhos' preserva a imagem de filiação da fonte sem negar sua aplicação representativa ao conjunto dos discípulos.
- issue: Força de γένησθε em relação à filiação divina
  choice: vocês se tornem
  alternative: vocês sejam; vocês demonstrem ser
  rationale: A tradução conserva o valor verbal de 'tornar-se' sem acrescentar uma teoria sobre como se recebe a filiação. O contexto relaciona essa filiação à imitação da generosidade do Pai, mas a tensão lexical não deve ser eliminada.
- issue: Providência divina para maus e bons
  choice: ele faz o seu sol nascer... e faz chover
  alternative: o sol nasce... e chove
  rationale: As formas verbais gregas apresentam Deus como agente; a tradução mantém essa agência sem explicar além do texto sua relação com a providência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'vocês' para o plural e conserva o paralelismo conciso do original. Os marcadores [a] e [b] aparecem no texto principal.
