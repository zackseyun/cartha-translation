  text: 'Vocês ouviram que foi dito: “Não cometerás adultério.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Vocês ouviram
  rationale: O aoristo remete ao que os ouvintes receberam anteriormente. Em português, o pretérito perfeito é natural nesta fórmula e mantém a referência direta ao público plural.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo daquilo que foi ouvido, de modo direto e idiomático.
- source_word: ἐρρέθη
  choice: foi dito
  rationale: A forma passiva impessoal é preservada sem explicitar um agente que o grego não identifica.
- source_word: Οὐ μοιχεύσεις
  choice: Não cometa adultério
  rationale: Expressa com clareza a proibição e conserva o vocabulário tradicional e preciso ligado ao Decálogo. O singular de segunda pessoa do mandamento é representado pela forma verbal singular.
theological_decisions:
- issue: Relação com a citação do Decálogo
  choice: Não cometa adultério.
  alternative: Não cometerás adultério.
  rationale: A formulação escolhida mantém o caráter inequívoco de mandamento e a ligação lexical com o Decálogo, usando ao mesmo tempo uma construção atual e amplamente compreensível. A alternativa reproduz mais formalmente o futuro proibitivo do grego e a dicção bíblica tradicional, mas soa menos corrente.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. “Vocês” torna explícito o plural de Ἠκούσατε; a citação preserva o singular do mandamento.
