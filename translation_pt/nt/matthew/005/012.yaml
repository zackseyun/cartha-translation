id: MAT.5.12
reference: Matthew 5:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: pt
  text: Alegrem-se e exultem, porque é grande a recompensa de vocês nos céus; pois foi assim que perseguiram os profetas que vieram antes de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρετε
  choice: Alegrem-se
  rationale: Imperativo presente na segunda pessoa do plural, que convoca os ouvintes à alegria; a forma é natural e clara em português contemporâneo.
- source_word: ἀγαλλιᾶσθε
  choice: exultem
  rationale: Expressa alegria intensa e exuberante, reforçando χαίρετε sem recorrer a uma paráfrase extensa.
- source_word: μισθὸς
  choice: recompensa
  rationale: Neste contexto, indica a retribuição divina pela perseguição sofrida, sem sugerir apenas uma relação comercial de salário.
- source_word: πολὺς
  choice: grande
  rationale: Adjetivo predicativo que ressalta a magnitude da recompensa; 'grande' é a combinação idiomática em português.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: nos céus
  rationale: Preserva naturalmente o plural grego, também corrente e inteligível no português bíblico moderno.
- source_word: οὕτως
  choice: foi assim
  rationale: Indica correspondência de maneira entre a perseguição dos discípulos e a dos profetas, com formulação idiomática.
- source_word: ἐδίωξαν
  choice: perseguiram
  rationale: O contexto exige o sentido hostil de διώκω, e não o sentido neutro de seguir ou ir atrás.
- source_word: προφήτας
  choice: os profetas
  rationale: Equivalente consagrado e direto para os profetas de Israel.
- source_word: τοὺς πρὸ ὑμῶν
  choice: que vieram antes de vocês
  rationale: Explicita de modo natural a precedência histórica dos profetas em relação aos ouvintes.
theological_decisions:
- issue: Sentido de ἐν τοῖς οὐρανοῖς
  choice: nos céus
  alternative: no céu
  rationale: A opção mantém o plural da expressão grega sem impor uma distinção cosmológica entre singular e plural; ambas as formas podem designar a esfera celestial.
- issue: Natureza da recompensa
  choice: recompensa
  alternative: salário
  rationale: Mantém a ideia de retribuição presente em μισθός, sem transformar a declaração em uma relação estritamente comercial nem definir além do texto a natureza dessa recompensa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação 'Alegrem-se e exultem' conserva a intensificação dos dois imperativos gregos; 'vocês' comunica claramente a segunda pessoa do plural.
