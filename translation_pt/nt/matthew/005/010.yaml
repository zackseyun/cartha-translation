  source_fidelity: O texto transmite com fidelidade μακάριοι, o particípio perfeito passivo substantivado δεδιωγμένοι, a relação causal de ἕνεκεν e a razão introduzida por ὅτι. «Os que são perseguidos» é uma solução portuguesa idiomática que comunica adequadamente a condição resultante do perfeito, sem afirmar indevidamente que a perseguição tenha terminado. «Reino dos céus» preserva a expressão mateana, inclusive o plural de τῶν οὐρανῶν.
  naturalness: A redação é clara, fluente e digna em português moderno de ampla compreensão. «Felizes» funciona naturalmente no gênero das bem-aventuranças e «pois deles é o reino dos céus» mantém uma formulação concisa e solene sem arcaísmo desnecessário.
  terminology: «Justiça» é uma tradução estabelecida e semanticamente defensável para δικαιοσύνη em português, podendo abranger justiça e vida reta conforme a vontade de Deus. A nota alternativa «retidão», acompanhada de explicação, preserva o aspecto ético/moral e a amplitude contextual do termo sem impor uma leitura doutrinária. Os demais termos-chave estão consistentes.
