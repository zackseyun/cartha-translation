id: MAT.5.10
reference: Matthew 5:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μακάριοι οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: pt
  text: Felizes os que são perseguidos por causa da justiça[a], pois deles é o reino dos céus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”. A palavra grega pode se referir tanto à justiça quanto à conduta reta em conformidade com a vontade de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Felizes
  rationale: Em português atual, “Felizes” introduz naturalmente as bem-aventuranças e expressa a condição favorável declarada por Jesus, sem se limitar a uma emoção passageira.
- source_word: οἱ δεδιωγμένοι
  choice: os que são perseguidos
  rationale: O particípio perfeito passivo substantivado descreve pessoas que sofreram perseguição e permanecem nessa condição. A forma portuguesa no presente passivo é natural e abrange esse estado resultante sem sugerir que a perseguição necessariamente terminou.
- source_word: ἕνεκεν
  choice: por causa de
  rationale: Expressa de modo claro e corrente a causa da perseguição.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: “Justiça” é a correspondência portuguesa mais ampla e natural para δικαιοσύνη, podendo incluir conduta reta e conformidade com a vontade de Deus. A alternativa “retidão” explicita o aspecto moral e é preservada em nota.
- source_word: ὅτι
  choice: pois
  rationale: Introduz com naturalidade a razão da declaração de felicidade.
- source_word: αὐτῶν ἐστιν
  choice: deles é
  rationale: Mantém de forma concisa a construção possessiva e a ênfase do grego em αὐτῶν.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: o reino dos céus
  rationale: É a forma portuguesa consagrada e natural da expressão característica de Mateus, preservando o plural do grego.
theological_decisions:
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: O termo grego pode abranger tanto justiça quanto vida reta em conformidade com a vontade de Deus. “Justiça” preserva melhor essa amplitude em português; a nota registra “retidão” para evitar que o aspecto moral seja perdido.
- issue: Aspecto de οἱ δεδιωγμένοι
  choice: os que são perseguidos
  alternative: os que foram perseguidos
  rationale: O perfeito grego sugere perseguição sofrida com efeito ou condição presente. O presente passivo é mais idiomático em português nesta bem-aventurança e não restringe a referência a um evento encerrado.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formulação reconhecível como bem-aventurança. Evitou-se linguagem excessivamente técnica; “reino dos céus” conserva a expressão mateana tradicional.
