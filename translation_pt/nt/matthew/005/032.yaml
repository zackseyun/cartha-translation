id: MAT.5.32
reference: Matthew 5:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: pt
  text: Eu, porém, lhes digo que todo aquele que se divorcia de sua esposa, exceto por motivo de imoralidade sexual[a], faz com que ela cometa adultério[b]; e quem se casar com uma mulher divorciada comete adultério.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Imoralidade sexual” traduz o grego porneía, termo amplo para conduta sexual ilícita; também pode ser traduzido por “fornicação” ou “falta de castidade”.
    reason: lexical_alternative
  - marker: b
    text: Ou, mais literalmente, “faz com que ela se torne adúltera”; o infinitivo grego tem forma passiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: se divorcia / mulher divorciada
  rationale: No contexto conjugal, ἀπολύω tem o sentido específico de divorciar-se, e não apenas o sentido geral de mandar embora ou libertar. A linguagem de divórcio preserva o caráter jurídico-conjugal e é natural em português.
- source_word: γυναῖκα
  choice: esposa
  rationale: γυνή pode significar “mulher” ou “esposa”; o possessivo αὐτοῦ e o contexto de divórcio exigem aqui o sentido de “esposa”.
- source_word: παρεκτὸς λόγου πορνείας
  choice: exceto por motivo de imoralidade sexual
  rationale: παρεκτός introduz uma exceção, e λόγου tem aqui o sentido de motivo, matéria ou caso. “Imoralidade sexual” conserva a amplitude de πορνεία sem restringi-la a um único ato sexual ilícito.
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: faz com que ela cometa adultério
  rationale: A construção ποιέω com infinitivo expressa causação. Esta formulação é clara e idiomática em português; como μοιχευθῆναι tem forma passiva e admite uma nuance resultativa, essa alternativa é preservada em nota.
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: quem se casar
  rationale: A oração relativa com ἐάν expressa uma condição geral indefinida. “Quem se casar” comunica isso de maneira concisa e natural.
- source_word: μοιχᾶται
  choice: comete adultério
  rationale: Esta é a expressão idiomática em português para o verbo grego neste contexto, sem impor à tradução uma distinção de voz que o português não preserva naturalmente.
- source_word: πᾶς ὁ ἀπολύων
  choice: todo aquele que se divorcia
  rationale: A construção participial masculina singular formula uma regra geral, enquanto “sua esposa” mantém visível o cenário social masculino específico do enunciado.
theological_decisions:
- issue: Sentido da cláusula de exceção παρεκτὸς λόγου πορνείας
  choice: 'Traduzir como exceção real: “exceto por motivo de imoralidade sexual”.'
  alternative: “exceto em caso de união ilícita” ou “exceto por causa de fornicação”
  rationale: O grego apresenta explicitamente uma exceção, mas não define com precisão maior o alcance de πορνεία. A tradução conserva tanto a exceção quanto a amplitude do termo, sem decidir entre interpretações teológicas concorrentes.
- issue: Valor de μοιχευθῆναι depois de ποιεῖ
  choice: Usar no texto “faz com que ela cometa adultério”, com a nuance passiva/resultativa em nota.
  alternative: “faz com que ela se torne adúltera”
  rationale: O infinitivo é passivo na forma, e seu valor exato é discutido. O texto principal privilegia clareza idiomática, enquanto a nota evita apagar a ambiguidade gramatical genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eu, porém” preserva o contraste enfático de ἐγὼ δέ; “lhes digo” é natural sem perder a referência plural. A redação evita linguagem técnica no versículo e mantém em notas as nuances lexicais relevantes.
