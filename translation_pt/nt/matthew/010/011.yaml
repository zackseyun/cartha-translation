id: MAT.10.11
reference: Matthew 10:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: pt
  text: Quando entrarem em qualquer cidade ou povoado, procurem saber[a] quem ali é digno[b] e fiquem ali até partirem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «averiguem» ou «investiguem».
    reason: lexical_alternative
  - marker: b
    text: Aqui, «digno» provavelmente significa apto ou disposto a receber os mensageiros, não alguém que tenha conquistado o favor de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε
  choice: Quando entrarem em qualquer cidade ou povoado
  rationale: A construção relativa indefinida indica toda cidade ou povoado em que os discípulos vierem a entrar. A formulação com «quando» e «qualquer» comunica de modo natural em português tanto a indefinição quanto o ato de entrar.
- source_word: ἐξετάσατε
  choice: procurem saber
  rationale: O imperativo pede uma averiguação cuidadosa. «Procurem saber» é corrente e claro, sem sugerir necessariamente uma investigação formal.
- source_word: τίς ἐν αὐτῇ ἄξιός ἐστιν
  choice: quem ali é digno
  rationale: «Ali» retoma naturalmente a cidade ou o povoado, e «digno» preserva o caráter avaliativo de ἄξιος sem explicitar no corpo do texto um sentido contextual mais estreito.
- source_word: κἀκεῖ μείνατε
  choice: e fiquem ali
  rationale: A expressão preserva a referência espacial concisa do grego e evita especificar além do texto se «ali» aponta para a casa da pessoa ou, de modo mais amplo, para aquele lugar.
- source_word: ἕως ἂν ἐξέλθητε
  choice: até partirem
  rationale: A construção marca o momento futuro da saída. «Até partirem» é idiomático e mantém a ideia de permanecer até a partida.
theological_decisions:
- issue: Sentido de «digno» nas instruções missionárias
  choice: Manter «digno» no texto e esclarecer em nota seu provável sentido contextual de pessoa apta ou disposta a receber os mensageiros.
  alternative: Traduzir diretamente como «adequado» ou «disposto a recebê-los».
  rationale: O contexto favorece a aptidão ou receptividade do anfitrião, mas o termo grego conserva uma nuance avaliativa mais ampla. Manter «digno» preserva essa tensão e evita transformar uma inferência contextual em tradução explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural verbal sem pronome expresso corresponde aos discípulos já identificados no contexto. «Cidade ou povoado» conserva a distinção entre πόλις e κώμη.
