id: MAT.10.5
reference: Matthew 10:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων· Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: pt
  text: 'Jesus enviou estes doze, dando-lhes estas instruções: “Não sigam pelo caminho dos gentios[a], nem entrem em uma cidade de samaritanos[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não tomem o caminho que leva aos gentios”. A expressão grega usa literalmente a linguagem de caminho ou estrada e pode indicar uma rota em direção ao território gentio.
    reason: lexical_alternative
  - marker: b
    text: Ou “em uma cidade samaritana”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: estes doze
  rationale: Preserva o demonstrativo, o artigo e o numeral sem acrescentar “discípulos”, termo implícito no contexto, mas ausente do grego.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Expressa de modo natural o ato de despachar alguém para uma missão; o contexto comunica suficientemente a finalidade do envio.
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: dando-lhes estas instruções
  rationale: Reproduz com naturalidade a ação circunstancial que introduz o discurso direto, mantendo a força diretiva de παραγγέλλω sem a formulação redundante “instruindo-os, dizendo”.
- source_word: Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε
  choice: Não sigam pelo caminho dos gentios
  rationale: Mantém a imagem concreta de ὁδός e a proibição, sem determinar em excesso se a expressão indica uma estrada usada por gentios ou uma rota em direção ao território deles.
- source_word: ἐθνῶν
  choice: gentios
  rationale: Neste contexto judaico, designa os povos não judeus; “gentios” é o equivalente tradicional e contextualmente preciso.
- source_word: εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε
  choice: nem entrem em cidade de samaritanos
  rationale: Conserva a estrutura genitiva do grego e evita especificar o tamanho do núcleo urbano, pois πόλις pode corresponder a cidade ou povoado.
- source_word: Σαμαριτῶν
  choice: samaritanos
  rationale: Refere-se ao grupo etnorreligioso conhecido no contexto dos Evangelhos.
theological_decisions:
- issue: Alcance e duração da proibição relativa a gentios e samaritanos
  choice: Apresentar a ordem como diretiva dada aos doze neste envio específico, sem comentário interpretativo.
  alternative: Redigir a ordem de modo que sugira exclusão absoluta ou permanente de gentios e samaritanos.
  rationale: O versículo contém uma proibição clara dentro de uma missão historicamente situada, mas não declara aqui que essa restrição seja universal ou permanente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Dando-lhes estas instruções” evita uma construção pesada com dois particípios. A repetição de “não” foi condensada naturalmente em “nem”, sem enfraquecer a segunda proibição.
