base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: pt
  text: E, se alguém não receber vocês nem ouvir as palavras de vocês[a], ao saírem daquela casa ou daquela cidade[c], sacudam o pó dos pés de vocês[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem escutar o que vocês dizem”.'
    reason: lexical_alternative
  - marker: b
    text: “Sacudir o pó dos pés” era um gesto simbólico de ruptura e de juízo contra os que rejeitavam a mensagem.
    reason: cultural_note
  - marker: c
    text: 'Ou: “daquela casa ou daquela localidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν μὴ
  choice: se alguém não
  rationale: A construção relativa indefinida com ἄν tem sentido genérico ou condicional. “Se alguém não” é natural em português e mantém a relação com a ordem que vem em seguida.
- source_word: δέξηται ὑμᾶς
  choice: receber vocês
  rationale: δέχομαι abrange tanto a recepção hospitaleira dos mensageiros quanto a aceitação favorável de sua missão. “Receber” preserva essa amplitude.
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: nem ouvir as palavras de vocês
  rationale: A formulação conserva o verbo ἀκούω e o substantivo λόγοι sem acrescentar a ideia mais específica de obedecer, embora o contexto sugira uma escuta receptiva.
- source_word: ἐξερχόμενοι ἔξω
  choice: ao saírem
  rationale: O particípio com ἔξω descreve a saída como circunstância associada à ordem principal. “Ao saírem” é conciso e idiomático.
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: daquela casa ou daquela cidade
  rationale: A tradução explicita naturalmente em português a referência demonstrativa aos dois lugares. πόλις pode designar uma cidade ou uma localidade de menor porte.
- source_word: ἐκτινάξατε
  choice: sacudam
  rationale: O imperativo descreve a remoção deliberada do pó por meio de um gesto enérgico. “Sacudam” preserva a imagem concreta.
- source_word: τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: dos pés o pó
  rationale: A ordem escolhida mantém a ligação do pó com os pés e produz uma instrução clara em português, sem transformar o gesto em paráfrase interpretativa.
theological_decisions:
- issue: Ação simbólica diante da rejeição dos discípulos e de sua mensagem
  choice: Manter no texto a ordem concreta “sacudam dos pés o pó”.
  alternative: Acrescentar “como testemunho contra eles” ou parafrasear o gesto como uma declaração explícita de condenação.
  rationale: O versículo apresenta o gesto, mas não explica diretamente seu significado. A tradução evita importar palavras dos relatos paralelos e deixa a nota fornecer o contexto cultural sem eliminar a força e a tensão da imagem.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega “vocês” e o imperativo correspondente, evita linguagem eclesiástica desnecessária e conserva a imagem concreta e a estrutura condicional do grego.
