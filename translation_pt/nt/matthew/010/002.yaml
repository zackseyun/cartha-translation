  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: pt
  text: 'Estes são os nomes dos doze apóstolos: primeiro[a], Simão, chamado Pedro, e André, seu irmão; Tiago, filho de Zebedeu, e João, seu irmão,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «primeiro» pode indicar destaque entre os doze, e não apenas a primeira posição na lista.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: não expresso separadamente
  rationale: A partícula marca uma transição leve. Em português, o fluxo é natural sem acrescentar um marcador temporal como «agora».
- source_word: δώδεκα ἀποστόλων
  choice: dos doze apóstolos
  rationale: «Apóstolos» é o termo tradicional, reconhecível e semanticamente adequado para o grupo comissionado por Jesus.
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: Estes são os nomes
  rationale: Preserva a estrutura demonstrativa do grego em português corrente e natural.
- source_word: πρῶτος
  choice: primeiro
  rationale: Mantém o valor lexical direto e a possível abertura entre ordem de enumeração e destaque, sem inserir no texto uma conclusão doutrinária.
- source_word: ὁ λεγόμενος
  choice: chamado
  rationale: Forma concisa e natural de identificar Simão pelo nome Pedro, sem perda de sentido.
- source_word: Πέτρος
  choice: Pedro
  rationale: Emprega a forma portuguesa consagrada do nome próprio.
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: seu irmão
  rationale: Expressa naturalmente a relação familiar; a primeira ocorrência se refere a Simão, e a segunda, a Tiago.
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: filho de Zebedeu
  rationale: Explicita de modo idiomático a filiação implícita na construção genitiva grega.
theological_decisions:
- issue: Sentido de πρῶτος em relação a Simão/Pedro
  choice: «primeiro» no texto, sem explicitar primazia de autoridade
  alternative: «primeiro» como possível indicação de destaque ou proeminência entre os doze
  rationale: No contexto de uma lista, o termo pode indicar a primeira posição na enumeração, embora também possa carregar uma nuance de destaque. A tradução mantém a ambiguidade legítima e a nota registra a alternativa sem impor uma conclusão denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação conserva o caráter de lista; nomes bíblicos seguem as formas portuguesas consagradas.
