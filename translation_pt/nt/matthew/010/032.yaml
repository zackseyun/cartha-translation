id: MAT.10.32
reference: Matthew 10:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ὁμολογήσει ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, ὁμολογήσω κἀγὼ ἐν αὐτῷ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: pt
  text: Portanto, todo aquele que me reconhecer diante das pessoas, eu também o reconhecerei[a] diante de meu Pai, que está nos céus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz mais literalmente «confessarei nele» ou «o confessarei com respeito a ele»; a construção foi traduzida de forma idiomática como «o reconhecerei».
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Portanto, todo aquele que
  rationale: A expressão generaliza de modo inclusivo, enquanto «portanto» mantém a ligação de consequência com o contexto anterior.
- source_word: ὁμολογήσει ἐν ἐμοὶ
  choice: me reconhecer
  rationale: Neste contexto, ὁμολογέω indica reconhecer ou declarar publicamente a relação com Jesus. «Reconhecer» é natural em português atual e evita que «confessar» seja entendido apenas como admitir uma culpa.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: diante das pessoas
  rationale: ἔμπροσθεν expressa presença pública, e ἀνθρώπων tem aqui referência humana genérica; «pessoas» comunica isso com precisão e naturalidade.
- source_word: ὁμολογήσω κἀγὼ ἐν αὐτῷ
  choice: eu também o reconhecerei
  rationale: Repete-se o mesmo verbo para conservar a reciprocidade enfática da declaração de Jesus. O pronome objeto comunica idiomaticamente em português a construção grega com ἐν.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: de meu Pai, que está nos céus
  rationale: Mantém a expressão característica de Mateus e o plural οὐρανοῖς, usando uma formulação portuguesa clara e corrente.
theological_decisions:
- issue: O reconhecimento público de Jesus e o reconhecimento recíproco por Jesus
  choice: Apresentar diretamente a promessa de que Jesus reconhecerá diante do Pai quem o reconhecer diante das pessoas.
  alternative: Explicitar que se trata exclusivamente do juízo final ou definir os mecanismos de salvação envolvidos.
  rationale: O versículo afirma a reciprocidade, mas não especifica aqui o momento nem desenvolve uma formulação sistemática; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Reconhecer» preserva a dimensão pública e relacional de ὁμολογέω sem sugerir principalmente confissão de pecado; «diante das pessoas» traduz a referência humana genérica sem restringi-la aos homens do sexo masculino.
