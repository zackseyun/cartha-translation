source:
  edition: SBLGNT
  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: pt
  text: E, se a casa for digna[a], que a paz de vocês venha sobre ela; mas, se não for digna[b], que a paz de vocês volte para vocês[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o lar” ou “os da casa”; a palavra grega para “casa” pode indicar a moradia e, por extensão, quem vive nela.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “digna” significa apta para receber os mensageiros e a paz deles, não moralmente sem pecado.
    reason: cultural_note
  - marker: c
    text: Ou “retorne para vocês”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: casa
  rationale: É o equivalente mais direto e natural; no contexto, pode incluir por extensão as pessoas que vivem nela, possibilidade registrada em nota.
- source_word: ἀξία
  choice: digna
  rationale: Preserva o sentido avaliativo de ἄξιος sem restringi-lo interpretativamente a mera receptividade; aqui indica aptidão para receber os mensageiros e sua paz.
- source_word: ἐλθάτω
  choice: que ... venha
  rationale: Reproduz de modo idiomático a força do imperativo aoristo grego.
- source_word: εἰρήνη
  choice: paz
  rationale: É o equivalente normal de εἰρήνη e preserva, sem explicitação excessiva, o sentido mais amplo de bem-estar e bênção.
- source_word: ἐπ’ αὐτήν
  choice: sobre ela
  rationale: Mantém a imagem direcional da paz vindo sobre a casa e concorda naturalmente com o feminino de “casa” em português.
- source_word: πρὸς ὑμᾶς
  choice: para vocês
  rationale: Expressa a direção indicada por πρός; a ideia de retorno já está contida no verbo.
- source_word: ἐπιστραφήτω
  choice: que ... volte
  rationale: Verte idiomaticamente o imperativo como retorno da paz aos discípulos, sem a rigidez de uma construção passiva literal.
- source_word: μὲν ... δὲ
  choice: se ...; mas, se ...
  rationale: Representa com clareza e naturalidade o contraste entre as duas condições.
theological_decisions:
- issue: Natureza de “a paz de vocês”
  choice: Mantida como “a paz de vocês”, uma paz pronunciada pelos discípulos que pode vir sobre a casa ou voltar para eles.
  alternative: “a saudação de paz de vocês” ou “a bênção de paz que vocês pronunciam”
  rationale: O texto apresenta a paz de maneira concreta, ligada à missão, mas não explica seu funcionamento metafísico. A formulação preserva essa imagem e tensão sem reduzi-la a uma simples saudação nem transformá-la em força mecanicista.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” oferece naturalidade contemporânea; “que ... venha/volte” conserva a força imperativa sem soar artificial. Os marcadores foram posicionados junto aos termos que explicam.
