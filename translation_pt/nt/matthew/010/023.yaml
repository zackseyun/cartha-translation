id: MAT.10.23
reference: Matthew 10:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: pt
  text: 'Mas, sempre que perseguirem vocês nesta cidade, fujam para outra[a]. Em verdade lhes digo: vocês certamente não terminarão de percorrer as cidades de Israel[b] até que venha o Filho do Homem[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para a outra”. O grego diz literalmente “para a outra/outra”, deixando subentendido o termo “cidade”, mencionado antes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, mais literalmente: “vocês certamente não terminarão as cidades de Israel”. A expressão “de percorrer” torna explícita a atividade missionária itinerante implícita no contexto.'
    reason: lexical_alternative
  - marker: c
    text: A expressão “até que venha o Filho do Homem” é mantida intencionalmente em aberto. Há diferentes interpretações sobre se ela se refere à vindicação de Jesus, a uma vinda em juízo ou à sua volta final.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: sempre que
  rationale: Expressa uma circunstância temporal indefinida ou potencial, preservando melhor essa força do que o simples «quando».
- source_word: διώκωσιν
  choice: perseguirem
  rationale: No contexto do discurso missionário, o verbo indica perseguição hostil, não mera perseguição física ou busca.
- source_word: πόλει ταύτῃ
  choice: nesta cidade
  rationale: Preserva o demonstrativo proximal e o caráter direto da instrução.
- source_word: φεύγετε
  choice: fujam
  rationale: Imperativo claro e enérgico que comunica partida urgente diante da perseguição.
- source_word: εἰς τὴν ἑτέραν
  choice: para a seguinte
  rationale: O substantivo «cidade» está subentendido; «a seguinte» comunica naturalmente o deslocamento a outra cidade, sem repeti-lo.
- source_word: ἀμὴν
  choice: em verdade
  rationale: Fórmula solene que introduz uma declaração autorizada; é digna, corrente no registro bíblico e compreensível em português.
- source_word: οὐ μὴ τελέσητε
  choice: vocês certamente não terminarão de percorrer
  rationale: «Certamente não» representa a negação enfática; «de percorrer» explicita com moderação a atividade implícita exigida pelo objeto «as cidades» no contexto itinerante.
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: as cidades de Israel
  rationale: Reprodução direta da construção genitiva, adequada ao contexto da missão em Israel.
- source_word: ἕως ἂν ἔλθῃ
  choice: antes que venha
  rationale: Em uma oração principal negativa, esta formulação portuguesa expressa naturalmente que a missão não estará concluída até o futuro acontecimento indicado.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Forma tradicional e amplamente reconhecida que preserva a expressão literal e suas ressonâncias bíblicas e teológicas.
theological_decisions:
- issue: Sentido da vinda do Filho do Homem neste contexto
  choice: Manter «antes que venha o Filho do Homem» sem identificar o acontecimento.
  alternative: Especificar a vindicação ou ressurreição de Jesus, uma vinda em juízo — por exemplo, sobre Jerusalém — ou sua volta final.
  rationale: O grego não determina inequivocamente qual desses referentes está em vista. A redação preserva a ambiguidade e a tensão escatológica do texto, sem impor um esquema interpretativo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural sobretudo no Brasil e compreensão internacional. Emprega «vocês» por ampla acessibilidade; mantém «em verdade» e «Filho do Homem» pelo valor solene e pelo reconhecimento bíblico. A pontuação separa a declaração solene com dois-pontos.
