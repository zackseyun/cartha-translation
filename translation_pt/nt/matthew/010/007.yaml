id: MAT.10.7
reference: Matthew 10:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πορευόμενοι δὲ κηρύσσετε λέγοντες ὅτι Ἤγγικεν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/007.yaml
  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: pt
  text: 'E, enquanto vão, proclamem: “O Reino dos céus se aproximou.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chegou perto” ou “está próximo”. O perfeito grego indica que essa proximidade já ocorreu e continua vigente.
    reason: lexical_alternative
  - marker: b
    text: Mateus usa regularmente “o Reino dos céus”, enquanto os outros Evangelhos muitas vezes dizem “o Reino de Deus”.
    reason: cross_reference
lexical_decisions:
- source_word: πορευόμενοι
  choice: enquanto vão
  rationale: O particípio presente acompanha o imperativo principal e indica a ação durante a qual a proclamação deve ocorrer; esta formulação é natural em português e preserva essa relação temporal.
- source_word: δὲ
  choice: E
  rationale: Conectivo leve que liga esta instrução às anteriores sem introduzir contraste forte.
- source_word: κηρύσσετε
  choice: proclamem
  rationale: O imperativo denota anúncio público e autorizado; “proclamem” conserva esse sentido sem a conotação eclesiástica mais estreita que “preguem” pode adquirir.
- source_word: λέγοντες
  choice: ':'
  rationale: O particípio introduz o conteúdo da proclamação. Em português atual, os dois-pontos comunicam naturalmente essa função e evitam a redundância de “proclamem, dizendo”.
- source_word: ὅτι
  choice: discurso direto
  rationale: Aqui introduz o conteúdo anunciado; as aspas após os dois-pontos expressam isso de modo idiomático sem acrescentar “que”.
- source_word: Ἤγγικεν
  choice: se aproximou
  rationale: O perfeito indica uma aproximação já ocorrida cujos efeitos permanecem. “Se aproximou” preserva a ação consumada, enquanto a nota explicita a continuidade relevante.
- source_word: ἡ βασιλεία
  choice: o Reino
  rationale: “Reino” é o equivalente tradicional e abrangente, capaz de incluir tanto o governo real quanto a esfera desse governo.
- source_word: τῶν οὐρανῶν
  choice: dos céus
  rationale: Preserva a forma plural da expressão característica de Mateus e soa natural no uso bíblico português.
theological_decisions:
- issue: Sentido de “o Reino dos céus”
  choice: Mantida a expressão “o Reino dos céus”.
  alternative: o reinado dos céus; o Reino de Deus
  rationale: Preserva a formulação distintiva de Mateus, sem harmonizá-la com os paralelos nem limitar βασιλεία somente ao ato de reinar.
- issue: Aspecto de Ἤγγικεν
  choice: “se aproximou”, com nota sobre o estado resultante
  alternative: está próximo; chegou perto
  rationale: A tradução conserva a anterioridade expressa pelo perfeito e a nota evita perder sua relevância contínua, sem definir além do texto a cronologia teológica do Reino.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva a expressão própria de Mateus e usa os dois-pontos para representar de modo idiomático λέγοντες.
