  text: μὴ κτήσησθε χρυσὸν μηδὲ ἄργυρον μηδὲ χαλκὸν εἰς τὰς ζώνας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/009.yaml
  text: Do not acquire gold or silver or copper for your belts[b][a],
translation:
  language: pt
  text: Não adquiram ouro, nem prata, nem cobre[a] para levar nos cintos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bronze”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, dinheiro carregado nos cintos ou em bolsas presas à cintura.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: Não adquiram
  rationale: κτάομαι significa adquirir ou obter. A formulação preserva a ideia de não providenciar esses recursos para si, em vez de simplesmente proibir que já os levassem.
- source_word: χρυσὸν
  choice: ouro
  rationale: Termo direto para o metal; neste contexto, refere-se a dinheiro em ouro.
- source_word: ἄργυρον
  choice: prata
  rationale: Termo direto para o metal; neste contexto, refere-se a dinheiro em prata.
- source_word: χαλκὸν
  choice: cobre
  rationale: χαλκός pode designar cobre ou bronze. Em uma lista de metais usados como dinheiro, “cobre” comunica naturalmente a moeda de menor valor; a alternativa “bronze” é preservada em nota.
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: para levar nos cintos
  rationale: A expressão indica dinheiro destinado a ser posto ou carregado nos cintos. A explicitação mínima produz português natural sem transformar “cintos” em “bolsas” no texto principal.
theological_decisions:
- issue: Alcance da proibição missionária
  choice: Manter a ordem concreta de não adquirir dinheiro, sem explicar no versículo se ela é temporária ou universal.
  alternative: Parafrasear como uma regra permanente de pobreza ou apenas como uma instrução para esta viagem.
  rationale: O grego não resolve no próprio versículo o alcance posterior da ordem; a tradução preserva essa tensão contextual.
translation_notes:
  register: Português moderno, claro e digno, com imperativo plural de ampla legibilidade brasileira. “Adquiram” preserva com precisão o sentido de obtenção; “para levar nos cintos” torna inteligível a função cultural do cinto sem sobrecarregar o texto.
