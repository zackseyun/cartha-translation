  source_fidelity: «Não adquiram» reproduz adequadamente a proibição aorista média de μὴ κτήσησθε, conservando o sentido de não obter/prover para si, e não o de simplesmente não transportar. A sequência «ouro, nem prata, nem cobre» corresponde aos երեք metais do grego. «Para levar nos cintos» comunica de modo inteligível a função de εἰς τὰς ζώνας ὑμῶν no contexto monetário, sem substituir indevidamente «cintos» por «bolsas» no texto.
