  text: πορεύεσθε δὲ μᾶλλον πρὸς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/006.yaml
  text: but go instead to the lost sheep of the house of Israel[a].
translation:
  language: pt
  text: Mas vão antes às ovelhas perdidas da casa de Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas vão às ovelhas que se perderam da casa de Israel”.'
    reason: 'Alternativa de ligação sintática: «da casa de Israel» pode ser entendido com «ovelhas» ou com «que se perderam».'
lexical_decisions:
- source_word: πορεύεσθε
  choice: vão
  rationale: Imperativo presente na segunda pessoa do plural. “Vão” é a forma natural e direta de expressar a ordem neste contexto de envio.
- source_word: δὲ μᾶλλον
  choice: Mas, em vez disso
  rationale: A combinação estabelece contraste com as proibições anteriores e redireciona os discípulos a outro destino. A expressão comunica com clareza tanto a oposição quanto a preferência corretiva.
- source_word: πρὸς
  choice: às
  rationale: Com um verbo de movimento, indica direção ou destino. A contração “às” é idiomática diante de “ovelhas”.
- source_word: τὰ πρόβατα
  choice: as ovelhas
  rationale: Mantém a imagem pastoral explícita do grego e suas ressonâncias bíblicas, sem substituí-la por uma explicação interpretativa.
- source_word: τὰ ἀπολωλότα
  choice: perdidas
  rationale: O particípio perfeito de ἀπόλλυμι, usado adjetivamente nesta metáfora pastoral, descreve as ovelhas em estado de perdição ou extravio. “Perdidas” preserva a imagem sem restringi-la à destruição física.
- source_word: οἴκου Ἰσραήλ
  choice: da casa de Israel
  rationale: Preserva a construção tradicional e biblicamente significativa, com seu sentido coletivo e pactual, sem reduzi-la à paráfrase “povo de Israel”.
theological_decisions:
- issue: Descrição metafórica de Israel
  choice: Manter “as ovelhas perdidas da casa de Israel”
  alternative: os israelitas que se desviaram
  rationale: A metáfora está explícita no grego e possui importante continuidade literária e teológica com as imagens pastorais das Escrituras Hebraicas. Preservá-la evita acrescentar uma interpretação explicativa ao texto.
- issue: Relação de “perdidas” com “casa de Israel”
  choice: Leitura principal em que as ovelhas perdidas pertencem à casa de Israel
  alternative: Ovelhas que se perderam ou se afastaram da casa de Israel
  rationale: A construção grega permite entender o genitivo como identificação ou pertencimento, mas também pode sugerir separação. A tradução principal conserva a formulação mais natural, e a nota registra a alternativa sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A metáfora bíblica e a expressão “casa de Israel” foram mantidas; “em vez disso” explicita de modo idiomático o contraste de δὲ μᾶλλον.
