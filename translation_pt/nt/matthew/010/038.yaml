id: MAT.10.38
reference: Matthew 10:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: pt
  text: E quem não toma a sua cruz e não me segue não é digno de mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não toma a sua cruz e não segue atrás de mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: quem
  rationale: Em português, “quem” expressa de modo natural o relativo indefinido e genérico, mantendo a força abrangente da declaração.
- source_word: λαμβάνει
  choice: toma
  rationale: Com “a sua cruz”, “toma” preserva a imagem concreta de assumir a cruz; o contexto deixa claro que não se trata de simples recebimento.
- source_word: σταυρὸν αὐτοῦ
  choice: a sua cruz
  rationale: É a formulação portuguesa natural para a cruz correspondente a cada discípulo e preserva o singular genérico do grego sem restringir o referente a homens.
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: me segue
  rationale: “Segue-me” ou “me segue” é a expressão idiomática em português para acompanhar alguém como discípulo. A noção mais explícita de ir atrás é registrada em nota.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: não é digno de mim
  rationale: Tradução direta e solene da construção com ἄξιος e genitivo, sem expandir interpretativamente a relação com Jesus.
theological_decisions:
- issue: A imagem de tomar a cruz no discipulado
  choice: Manter a imagem concreta “toma a sua cruz”
  alternative: Explicitar como “aceita o sofrimento” ou “renuncia a si mesmo”
  rationale: O texto emprega deliberadamente a cruz, imagem histórica de execução, vergonha e sofrimento. Uma paráfrase abstrata reduziria sua força e limitaria suas implicações.
- issue: O valor de ὀπίσω em ἀκολουθεῖ ὀπίσω μου
  choice: Traduzir naturalmente como “me segue” e indicar em nota a formulação mais explícita
  alternative: “segue atrás de mim”
  rationale: “Segue atrás de mim” reproduz mais visivelmente ὀπίσω, mas pode sugerir sobretudo posição física em português. “Me segue” comunica de modo idiomático o discipulado sem excluir essa nuance.
- issue: O singular masculino genérico de αὐτοῦ
  choice: Usar “a sua cruz” com referência genérica a cada discípulo
  alternative: “a própria cruz” ou uma formulação explicitamente masculina
  rationale: O possessivo português não marca gênero e conserva naturalmente o número singular e a aplicação individual do original, sem introduzir uma restrição inexistente no sentido.
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão, com colocação pronominal natural para a legibilidade brasileira. A repetição de “não” corresponde à coordenação grega: tanto tomar a cruz quanto seguir Jesus integram a descrição do discípulo digno dele.'
