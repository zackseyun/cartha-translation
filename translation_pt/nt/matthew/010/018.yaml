id: MAT.10.18
reference: Matthew 10:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: pt
  text: E vocês serão levados à presença de governadores e reis por minha causa, para servir de testemunho a eles[b] e aos gentios[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “às nações”.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “a eles” também pode ser entendido como “contra eles”, embora o dativo grego não expresse isso de modo explícito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: à presença de governadores e reis
  rationale: Depois de um verbo de condução, ἐπί com acusativo indica comparecimento diante de autoridades. A formulação é natural em português e mantém ἡγεμόνας como autoridades governamentais, sem ampliar seu sentido.
- source_word: ἀχθήσεσθε
  choice: serão levados
  rationale: O futuro passivo de ἄγω indica que outros os conduzirão. “Serão levados” é natural no contexto judicial e não acrescenta a violência sugerida por “serão arrastados”.
- source_word: ἕνεκεν ἐμοῦ
  choice: por minha causa
  rationale: Expressa claramente causa ou motivo e preserva a referência pessoal a Jesus.
- source_word: εἰς μαρτύριον
  choice: para servir de testemunho
  rationale: Preserva o substantivo μαρτύριον e comunica a função ou o resultado do comparecimento dos discípulos perante as autoridades.
- source_word: αὐτοῖς
  choice: a eles
  rationale: O dativo retoma naturalmente governadores e reis. A tradução neutra evita decidir se o testemunho será favorável ou acusatório.
- source_word: τοῖς ἔθνεσιν
  choice: aos gentios
  rationale: Em Mateus, ἔθνη frequentemente designa os povos não judeus. “Gentios” expressa essa provável referência, enquanto a nota registra a alternativa lexical mais ampla.
theological_decisions:
- issue: Sentido de μαρτύριον αὐτοῖς
  choice: “testemunho a eles”, em sentido neutro
  alternative: “testemunho contra eles”
  rationale: 'O dativo αὐτοῖς não marca por si só oposição. A opção neutra conserva a tensão do texto: o testemunho poderá comunicar a mensagem ou tornar-se acusatório conforme a resposta dos ouvintes.'
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. “À presença de” esclarece o cenário de comparecimento perante autoridades; “servir de testemunho” evita uma construção rígida sem eliminar a ambiguidade teológica do dativo.
