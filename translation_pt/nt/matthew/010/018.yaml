  verdict: approve
  source_fidelity: 'A tradução representa com precisão a construção grega: o futuro passivo (“serão levados”), o comparecimento perante autoridades (“à presença de governadores e reis”), a causa (“por minha causa”) e a finalidade/função testemunhal (“para servir de testemunho”). “A eles” conserva adequadamente o dativo αὐτοῖς sem impor sentido adversativo. “Aos gentios” é uma tradução contextual adequada de τοῖς ἔθνεσιν, com a alternativa mais ampla devidamente anotada.'
  naturalness: O português é atual, claro e fluente para leitura internacional, com boa legibilidade brasileira. “Serão levados à presença de” é particularmente natural no contexto de comparecimento perante autoridades. “Para servir de testemunho” é idiomático e mantém registro bíblico sóbrio sem arcaísmo.
  terminology: “Governadores”, “reis”, “testemunho” e “gentios” são escolhas terminológicas consistentes com o uso neotestamentário e com o grau de equivalência pretendido. As notas distinguem corretamente a alternativa “nações” e a possibilidade contextual, não exigida pelo dativo, de entender o testemunho como contrário às autoridades.
