  text: As you enter the house[a], greet it.
translation:
  language: pt
  text: Ao entrarem na casa[a], saúdem-na.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «saúdem os que moram nela». O grego diz literalmente «saúdem-na», referindo-se à casa, provavelmente como forma de falar dos seus moradores.'
    reason: alternativa lexical e esclarecimento da metonímia
lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: Ao entrarem
  rationale: O particípio presente nominativo plural tem função adverbial e circunstancial. A oração temporal com «ao» expressa com naturalidade em português a ação ligada à ordem principal.
- source_word: δὲ
  choice: incorporado à ligação da frase, sem tradução separada
  rationale: δέ é um conectivo brando. Aqui, sua função discursiva é transmitida naturalmente pela construção «Ao entrarem», sem exigir «mas» ou «e».
- source_word: οἰκίαν
  choice: na casa
  rationale: οἰκία pode designar a casa física ou os que nela vivem. O contexto imediato fala de entrar, favorecendo o sentido concreto «casa», sem excluir seu uso metonímico.
- source_word: ἀσπάσασθε
  choice: saúdem
  rationale: O imperativo aoristo médio, na segunda pessoa do plural, dá uma instrução direta. «Saúdem» é atual, claro e digno.
- source_word: αὐτήν
  choice: -na
  rationale: O pronome feminino singular retoma οἰκίαν. A forma enclítica «-na» preserva a referência gramatical à casa e a metonímia do grego.
theological_decisions:
- issue: Referência metonímica à casa ou menção explícita aos moradores
  choice: Manter «saúdem-na» no texto principal
  alternative: «saúdem os que moram nela» ou «saúdem a família»
  rationale: O grego emprega um pronome feminino singular que retoma «casa». Preservar essa formulação evita inserir no texto principal uma explicitação interpretativa; a provável referência social aos moradores é indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Ao entrarem» e «saúdem-na» mantêm a segunda pessoa do plural sem regionalismo excessivo; a colocação enclítica é natural após o imperativo afirmativo.
