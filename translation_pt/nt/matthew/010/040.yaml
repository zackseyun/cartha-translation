  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: pt
  text: Quem recebe vocês[a] me recebe; e quem me recebe recebe aquele que me enviou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “acolhe”; o verbo grego pode significar receber, aceitar ou acolher, especialmente no sentido de receber um mensageiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: Quem recebe
  rationale: O particípio presente substantivado tem sentido genérico. “Quem recebe” expressa isso de forma natural e inclusiva no português moderno.
- source_word: δέχομαι / δέχεται
  choice: recebe
  rationale: A repetição deliberada do verbo estabelece uma cadeia de identificação. “Recebe” conserva essa repetição e abrange, no contexto, acolher e aceitar os mensageiros.
- source_word: ὑμᾶς
  choice: vocês
  rationale: O pronome é objeto da segunda pessoa do plural e se refere aos discípulos de Jesus. “Vocês” torna explícito o plural com ampla legibilidade brasileira.
- source_word: ἐμέ
  choice: a mim
  rationale: Objeto direto enfático referente a Jesus. A forma preposicionada é exigida no português após “recebe” quando o objeto é o pronome tônico “mim” e preserva a ênfase do grego.
- source_word: τὸν ἀποστείλαντά με
  choice: aquele que me enviou
  rationale: O particípio aoristo ativo com artigo funciona como substantivo. “Aquele que me enviou” é natural, pessoal e não explicita além do que está no grego.
theological_decisions:
- issue: Identidade daquele que enviou Jesus
  choice: aquele que me enviou
  alternative: o Pai que me enviou
  rationale: O contexto e a teologia de Mateus apontam para o Pai, mas o texto grego diz literalmente apenas “aquele que me enviou”. A tradução preserva essa formulação sem acrescentar uma identificação explícita.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Vocês” explicita o plural de ὑμᾶς. A repetição de “recebe” foi mantida para preservar a estrutura retórica e a cadeia de representação do original.
