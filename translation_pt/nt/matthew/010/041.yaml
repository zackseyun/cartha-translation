id: MAT.10.41
reference: Matthew 10:41
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: pt
  text: Quem recebe um profeta em nome de profeta receberá recompensa de profeta[a]; e quem recebe um justo em nome de justo receberá recompensa de justo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por ele ser profeta” ou “na qualidade de profeta”. O grego diz literalmente “em nome de profeta”.
    reason: lexical_alternative
  - marker: b
    text: Ou “por ele ser justo” ou “na qualidade de justo”. O grego diz literalmente “em nome de justo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: quem recebe
  rationale: O particípio presente substantivado expressa uma pessoa em sentido geral. “Quem recebe” é natural em português e conserva a força proverbial da construção.
- source_word: προφήτην
  choice: um profeta
  rationale: Tradução direta do objeto acusativo, preservando a função reconhecida sem paráfrase.
- source_word: εἰς ὄνομα προφήτου
  choice: em nome de profeta
  rationale: 'Mantém de perto a expressão grega e seu paralelismo, enquanto a nota esclarece os sentidos idiomáticos possíveis: receber alguém por ele ser profeta ou na qualidade de profeta.'
- source_word: μισθὸν προφήτου
  choice: recompensa de profeta
  rationale: 'A construção com “de” preserva a ambiguidade do genitivo: pode ser a recompensa dada a um profeta ou a recompensa correspondente à recepção de um profeta.'
- source_word: λήμψεται
  choice: receberá
  rationale: O futuro é expresso naturalmente pelo futuro simples, repetindo o verbo “receber” e mantendo a ligação lexical do original.
- source_word: δίκαιον
  choice: um justo
  rationale: O adjetivo masculino singular substantivado é vertido por uma forma igualmente substantivada, corrente na linguagem bíblica e compreensível em português.
- source_word: εἰς ὄνομα δικαίου
  choice: em nome de justo
  rationale: Reproduz a estrutura da primeira oração e conserva a expressão grega; a nota apresenta os sentidos idiomáticos possíveis.
- source_word: μισθὸν δικαίου
  choice: recompensa de justo
  rationale: Espelha “recompensa de profeta” e evita decidir se o genitivo indica o destinatário, a categoria ou a recompensa associada ao justo.
theological_decisions:
- issue: Sentido de εἰς ὄνομα + genitivo
  choice: Conservar “em nome de” no texto e esclarecer a expressão em notas.
  alternative: Traduzir diretamente como “por ele ser” ou “na qualidade de”.
  rationale: A expressão indica acolhimento com base na identidade ou condição reconhecida da pessoa. A formulação literal preserva a repetição e a ressonância de “nome”, sem ocultar na nota o sentido idiomático.
- issue: Masculino substantivado em δίκαιον / δικαίου
  choice: Usar “um justo” e “de justo”.
  alternative: Usar “uma pessoa justa” e “de pessoa justa”.
  rationale: A forma escolhida preserva o masculino singular e a concisão do grego, sem acrescentar uma afirmação de exclusividade de gênero que o contexto não exige.
- issue: Ambiguidade do genitivo em μισθὸν προφήτου / δικαίου
  choice: Usar “recompensa de profeta/de justo” sem explicitar a relação.
  alternative: “A mesma recompensa que um profeta/justo recebe” ou “a recompensa por receber um profeta/justo”.
  rationale: O texto grego não define expressamente a relação do genitivo. A tradução conserva essa tensão em vez de selecionar uma interpretação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Quem recebe” evita rigidez desnecessária; “um justo” mantém concisão e transparência ao masculino substantivado. O paralelismo das duas orações foi preservado rigorosamente.
