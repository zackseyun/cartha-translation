id: MAT.10.25
reference: Matthew 10:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: pt
  text: Basta ao discípulo tornar-se como o seu mestre, e ao escravo, como o seu senhor. Se chamaram o dono da casa de Belzebul[a], quanto mais os membros da sua casa!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Belzebu”, forma tradicional do nome.
    reason: Registra a forma conhecida na tradição portuguesa sem substituir a forma correspondente ao texto grego adotado.
lexical_decisions:
- source_word: ἀρκετὸν
  choice: Basta
  rationale: Expressa de modo natural e direto, em português, a ideia de suficiência do adjetivo predicativo.
- source_word: μαθητῇ
  choice: ao discípulo
  rationale: “Discípulo” preserva a relação de aprendizado e seguimento característica do contexto do Evangelho.
- source_word: ἵνα γένηται
  choice: tornar-se
  rationale: Mantém a noção de vir a ser presente no verbo, com uma construção idiomática depois de “basta”.
- source_word: διδάσκαλος
  choice: mestre
  rationale: No par discípulo–mestre, é o equivalente tradicional e natural em português, sem confundi-lo com o senhor do escravo na oração seguinte.
- source_word: δοῦλος
  choice: escravo
  rationale: A oposição hierárquica explícita com κύριος torna “escravo” mais preciso do que o termo atenuado “servo”.
- source_word: κύριος
  choice: senhor
  rationale: Aqui designa aquele que exerce autoridade sobre um escravo; “senhor”, em minúscula, comunica esse sentido social em português.
- source_word: οἰκοδεσπότην
  choice: o dono da casa
  rationale: Designa quem governa a casa; esta formulação é corrente, clara e mantém a ligação com os membros da casa.
- source_word: Βεελζεβοὺλ
  choice: Belzebul
  rationale: Representa em forma portuguesa o nome grego Βεελζεβούλ; a forma tradicional “Belzebu” é registrada em nota.
- source_word: ἐπεκάλεσαν
  choice: chamaram ... de
  rationale: É a construção portuguesa natural para atribuir a alguém um nome ou designação.
- source_word: πόσῳ μᾶλλον
  choice: quanto mais
  rationale: Preserva a expressão comparativa que introduz o argumento do maior para o menor, com a elipse do verbo mantida.
- source_word: οἰκιακοὺς
  choice: os membros da sua casa
  rationale: Abrange os integrantes da casa em geral, sem restringi-los aos servos ou aos parentes.
theological_decisions:
- issue: Sentido de κύριος na analogia doméstica
  choice: senhor
  alternative: Senhor, como título cristológico explícito
  rationale: O paralelo imediato com δοῦλος apresenta uma relação social doméstica. A inicial minúscula evita transformar a palavra, neste ponto da analogia, em título cristológico explícito, sem eliminar a correspondência implícita no ensino de Jesus.
- issue: Representação de δοῦλος
  choice: escravo
  alternative: servo
  rationale: A relação de sujeição e posse evocada pelo contraste com κύριος é mais bem preservada por “escravo”; “servo” poderia suavizar indevidamente a realidade social retratada.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Conserva-se a estrutura paralela discípulo–mestre e escravo–senhor, bem como a elipse enfática em “quanto mais”. O marcador da nota foi colocado junto a “Belzebul”, termo ao qual a variante se refere.
