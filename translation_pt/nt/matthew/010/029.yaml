  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: pt
  text: Não se vendem dois pardais por um asse[a]? Contudo, nenhum deles cairá no chão à parte do Pai de vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O asse era uma moeda romana de cobre de valor muito baixo.
    reason: cultural_note
  - marker: b
    text: 'Ou: “sem o Pai de vocês”. A expressão pode envolver seu conhecimento, cuidado ou vontade, mas o grego não especifica em que sentido.'
    reason: alternative_reading
lexical_decisions:
- source_word: στρουθία
  choice: pardais
  rationale: Neste contexto, o diminutivo refere-se naturalmente a pardais, aves pequenas e de pouco valor comercial; a escolha é específica, corrente e tradicional sem perder clareza.
- source_word: ἀσσαρίου
  choice: um asse
  rationale: O termo designa uma moeda romana específica de cobre e baixo valor. “Asse” é a forma portuguesa historicamente estabelecida; uma nota esclarece seu sentido cultural.
- source_word: πωλεῖται
  choice: se vendem
  rationale: A construção pronominal reproduz de modo natural em português o presente passivo grego e conserva o cenário comercial.
- source_word: ἓν ἐξ αὐτῶν
  choice: nenhum deles
  rationale: Com a negação precedente, esta formulação portuguesa expressa idiomaticamente que nem sequer um dentre os pardais fica fora da afirmação.
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: cairá no chão
  rationale: Equivalente português natural do futuro e da expressão direcional grega, sem acrescentar a causa da queda.
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: sem o Pai de vocês
  rationale: Mantém a formulação ampla e incomum do grego, sem especificar se a relação envolve conhecimento, cuidado, permissão ou vontade.
- source_word: οὐχὶ ... ;
  choice: Não se vendem ...?
  rationale: A pergunta negativa comunica naturalmente a expectativa de resposta afirmativa presente em οὐχί.
- source_word: καὶ
  choice: Contudo
  rationale: No contexto, realça o contraste entre o valor ínfimo dos pardais e o fato de nenhum deles estar fora da relação com o Pai.
theological_decisions:
- issue: Sentido de “sem o Pai de vocês” quanto à providência divina
  choice: Preservar no texto a expressão abrangente “sem o Pai de vocês”.
  alternative: “sem que o Pai de vocês saiba” ou “sem a vontade do Pai de vocês”
  rationale: A frase grega afirma a relação providencial do Pai com o acontecimento, mas não define explicitamente se se trata de conhecimento, cuidado, permissão, presença ou vontade. Explicitar uma dessas opções resolveria uma ambiguidade que o texto conserva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Pai de vocês” evita a ambiguidade regional de “vosso Pai”; “asse” preserva a referência histórica e é explicado em nota. A ordem das notas acompanha os respectivos pontos no texto.
