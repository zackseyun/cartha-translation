id: MAT.10.42
reference: Matthew 10:42
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: pt
  text: 'E quem der a um destes pequeninos[b] nem que seja apenas um copo de água fria, por ele ser discípulo[a], em verdade lhes digo: de modo nenhum perderá a sua recompensa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “em nome de discípulo”. A expressão grega indica que o gesto é feito por causa da identidade do beneficiário como discípulo.'
    reason: alternative_reading
  - marker: b
    text: “Pequeninos” provavelmente se refere aqui aos seguidores de Jesus considerados humildes ou de pouca importância, não necessariamente apenas a crianças.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς ἂν
  choice: quem
  rationale: A construção relativa com ἄν tem sentido indefinido e generalizante; “quem” expressa isso com naturalidade em português.
- source_word: ποτίσῃ
  choice: der ... um copo de água fria
  rationale: Embora o verbo signifique literalmente “dar de beber”, esta formulação idiomática preserva claramente o ato de oferecer água.
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: um destes pequeninos
  rationale: Mantém a imagem do grego sem restringi-la a crianças; no contexto, pode designar seguidores humildes ou socialmente pouco importantes.
- source_word: ποτήριον ψυχροῦ
  choice: um copo de água fria
  rationale: O substantivo “água” está implícito no grego; a expressão portuguesa é clara e natural.
- source_word: μόνον
  choice: ainda que seja apenas
  rationale: Comunica a pequenez do gesto e retém o valor de “somente/meramente” sem produzir uma construção rígida.
- source_word: εἰς ὄνομα μαθητοῦ
  choice: por ele ser discípulo
  rationale: Expressa de modo transparente que o gesto é motivado pela identidade do beneficiário como discípulo, preservando em nota a forma mais literal.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: em verdade lhes digo
  rationale: Conserva o caráter solene e enfático da fórmula de Jesus em linguagem digna e corrente.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: de modo nenhum perderá
  rationale: A dupla negação grega é enfática; esta formulação reproduz com clareza a forte certeza da declaração.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: a sua recompensa
  rationale: “Recompensa” corresponde adequadamente a μισθός neste contexto de discipulado, sem reduzi-lo à ideia de salário.
theological_decisions:
- issue: Referente de “pequeninos”
  choice: A expressão foi mantida sem restringi-la a crianças.
  alternative: Traduzir de modo interpretativo como “discípulos humildes” ou entender exclusivamente crianças.
  rationale: O contexto imediato trata do acolhimento aos discípulos, mas a expressão grega deve conservar sua amplitude e imagem próprias.
- issue: Sentido de εἰς ὄνομα μαθητοῦ
  choice: “por ele ser discípulo”
  alternative: “em nome de discípulo”
  rationale: A tradução principal torna explícita a provável relação causal — agir por causa da identidade do destinatário — sem sugerir necessariamente uma fórmula pronunciada; a forma mais literal é registrada em nota.
- issue: Natureza da recompensa
  choice: O texto afirma a certeza da recompensa sem definir sua forma, ocasião ou fundamento teológico.
  alternative: Explicitar recompensa terrena, celestial ou mérito salvífico.
  rationale: O versículo não fornece essas especificações; acrescentá-las resolveria indevidamente uma questão teológica que o texto deixa aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregou-se “lhes digo” para o plural ὑμῖν e evitou-se linguagem denominacional. Os marcadores foram posicionados junto às expressões que explicam.
