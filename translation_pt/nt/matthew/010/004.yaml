  text: Σίμων ὁ ⸀Καναναῖος καὶ Ἰούδας ⸀ὁ Ἰσκαριώτης ὁ καὶ παραδοὺς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: pt
  text: Simão, o Cananeu[a], e Judas Iscariotes, que também o traiu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Simão, o Zelote». O grego traz «Cananeu», provavelmente refletindo uma designação aramaica ou hebraica tradicionalmente entendida como «zelote».
    reason: lexical_alternative
  - marker: b
    text: Ou «que também o entregou». O verbo grego pode significar «entregar», embora, no caso de Judas, «traiu» corresponda ao contexto narrativo.
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: Cananeu
  rationale: Translitera a designação grega derivada do aramaico/hebraico, em vez de inserir no texto a interpretação «zelote»; a alternativa tradicional é preservada em nota.
- source_word: Ἰσκαριώτης
  choice: Iscariotes
  rationale: Forma tradicional e amplamente reconhecida em português para o epíteto de Judas.
- source_word: παραδοὺς
  choice: traiu
  rationale: Embora o verbo possa significar de modo mais amplo «entregar», neste contexto referente a Judas ele comunica uma entrega traiçoeira; a acepção mais literal é indicada em nota.
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: que também o traiu
  rationale: A oração relativa reproduz naturalmente em português o artigo com particípio atributivo; «também» preserva καί.
theological_decisions:
- issue: Traduzir παραδοὺς pela formulação neutra «entregou» ou pela contextual «traiu»
  choice: traiu
  alternative: entregou
  rationale: A identificação de Judas remete ao ato traiçoeiro narrado no Evangelho, de modo que «traiu» expressa naturalmente a força contextual. Como o verbo grego é semanticamente mais amplo, «entregou» permanece em nota para preservar a tensão lexical.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas bíblicas amplamente reconhecidas. A ordem e a concisão da lista apostólica foram preservadas; as ambiguidades lexicais relevantes aparecem em notas.
