id: MAT.10.37
reference: Matthew 10:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: pt
  text: Quem ama pai ou mãe mais do que a mim não é digno de mim; e quem ama filho ou filha mais do que a mim não é digno de mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: quem ama
  rationale: O artigo com o particípio presente tem valor substantivado e descreve genericamente a pessoa caracterizada por essa ação. “Quem ama” é natural, inclusivo e preserva esse valor sem rigidez.
- source_word: πατέρα ἢ μητέρα
  choice: pai ou mãe
  rationale: Traduz diretamente os substantivos relacionais sem acrescentar um possessivo que não está explícito no grego.
- source_word: ὑπὲρ ἐμέ
  choice: mais do que a mim
  rationale: Neste contexto comparativo, ὑπέρ indica amor em grau superior ou preferência. A formulação explicita naturalmente a comparação e, com “a mim”, distingue Jesus como objeto do verbo amar.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: não é digno de mim
  rationale: Preserva de modo direto a construção de ἄξιος com o genitivo μου, sem acrescentar ideias como pertencer a Jesus ou estar apto para ele.
- source_word: καὶ
  choice: e
  rationale: A coordenação simples mantém o paralelismo enfático entre as duas afirmações.
- source_word: υἱὸν ἢ θυγατέρα
  choice: filho ou filha
  rationale: Traduz diretamente os substantivos relacionais, sem inserir artigo indefinido ou possessivo ausentes do texto grego.
theological_decisions:
- issue: A exigência de Jesus em relação ao amor e à lealdade familiar
  choice: 'Manter a comparação explícita: amar Jesus deve ter prioridade até mesmo sobre os vínculos familiares mais próximos.'
  alternative: Atenuar como “não ama a mim tanto quanto” ou ampliar como uma ordem para odiar a família.
  rationale: O grego expressa prioridade comparativa mediante ὑπὲρ ἐμέ e pronuncia o veredito “não é digno de mim”. A tradução conserva a força da exigência sem negar a legitimidade do amor familiar nem importar linguagem mais forte de outras passagens.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição integral das duas orações preserva o paralelismo retórico do original. Não se incluiu nota, pois “mais do que a mim” comunica claramente, no próprio texto, o sentido comparativo de ὑπὲρ ἐμέ.
