id: MAT.10.20
reference: Matthew 10:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: pt
  text: Pois não são vocês que falam, mas é o Espírito do Pai de vocês que fala em vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio de vocês”. O grego diz literalmente “em vocês”, expressão que, neste contexto, também pode implicar que o Espírito fala por meio dos discípulos.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Pois não
  rationale: Preserva a função explicativa de γάρ em relação à promessa do versículo anterior e introduz naturalmente a negação em português.
- source_word: ὑμεῖς ἐστε οἱ λαλοῦντες
  choice: são vocês que estão falando
  rationale: A construção clivada conserva a ênfase do pronome explícito ὑμεῖς e a ideia de identificar quem fala; o progressivo comunica a ação em curso.
- source_word: ἀλλὰ
  choice: mas
  rationale: Expressa de modo direto o forte contraste entre os discípulos e o verdadeiro agente da fala.
- source_word: τὸ πνεῦμα
  choice: o Espírito
  rationale: O contexto identifica o referente como o Espírito divino; a inicial maiúscula sinaliza isso sem acrescentar conteúdo ao texto.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: do Pai de vocês
  rationale: Reproduz a relação genitiva e a segunda pessoa do plural com clareza ampla em português, sem importar o qualificativo 'celestial', ausente do versículo.
- source_word: τὸ λαλοῦν
  choice: que fala
  rationale: A oração relativa retoma inequivocamente 'o Espírito' e representa com naturalidade o particípio presente substantivado em aposição.
- source_word: ἐν ὑμῖν
  choice: em vocês
  rationale: Mantém o sentido mais direto de ἐν e preserva a possível tensão entre presença interior e atuação expressa por meio dos discípulos.
theological_decisions:
- issue: Se ἐν ὑμῖν deve ser entendido como presença interior ('em vocês') ou agência instrumental ('por meio de vocês')
  choice: em vocês
  alternative: por meio de vocês
  rationale: A preposição grega é literalmente ἐν, 'em'. O contexto pode implicar que o Espírito fala por meio dos discípulos, mas traduzir diretamente pela alternativa instrumental eliminaria uma ambiguidade genuína do texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega-se “vocês” para a segunda pessoa do plural e “Pai”/“Espírito” com maiúsculas por referência divina. A repetição de “vocês” mantém a ênfase e o contraste do grego.
