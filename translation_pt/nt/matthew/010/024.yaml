id: MAT.10.24
reference: Matthew 10:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν διδάσκαλον οὐδὲ δοῦλος ὑπὲρ τὸν κύριον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: pt
  text: O discípulo não está acima do mestre, nem o escravo[a] acima do seu senhor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «servo»; o termo grego pode designar um escravo ou servo, conforme o contexto.
    reason: alternative_reading
  - marker: b
    text: Neste contexto, «senhor» refere-se a um superior humano na analogia; também poderia ser traduzido por «dono».
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: discípulo
  rationale: Preserva o sentido relacional de alguém que aprende seguindo um mestre, característico do contexto dos Evangelhos, melhor do que o termo mais acadêmico «aluno».
- source_word: ὑπέρ
  choice: acima de
  rationale: Com acusativo, expressa superioridade de posição; «acima de» conserva de modo natural e conciso a comparação do grego.
- source_word: διδάσκαλος
  choice: mestre
  rationale: No par relacional discípulo–mestre, «mestre» é natural em português e mantém o sentido de quem ensina sem confundi-lo com o senhor do escravo na segunda comparação.
- source_word: δοῦλος
  choice: escravo
  rationale: O contraste com κύριος salienta subordinação e pertencimento; «escravo» preserva essa força social com mais precisão, enquanto «servo» é indicado em nota como alternativa contextual.
- source_word: κύριος
  choice: senhor
  rationale: Neste paralelo social, designa a pessoa que exerce autoridade sobre o escravo. «Senhor» é claro em português e preserva a amplitude lexical do termo, sem exigir aqui uma referência divina.
- source_word: αὐτοῦ
  choice: seu
  rationale: O possessivo retoma o escravo e indica a relação com o senhor dele; «seu» é a formulação portuguesa natural no contexto.
- source_word: οὐδέ
  choice: nem
  rationale: Liga naturalmente a segunda comparação negativa à primeira.
theological_decisions:
- issue: Tradução de δοῦλος em uma analogia social
  choice: escravo
  alternative: servo
  rationale: A oposição entre δοῦλος e κύριος envolve diferença de condição e autoridade; «escravo» retém essa realidade histórica, sem suavizá-la. A alternativa «servo» permanece em nota por causa da amplitude contextual do termo.
- issue: Tradução de κύριος em contexto humano
  choice: senhor
  alternative: dono
  rationale: O referente é um superior humano na analogia, não necessariamente um título divino. «Senhor» mantém a correspondência lexical e a dignidade do registro; «dono» explicitaria a relação de posse, mas estreitaria o termo.
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial concisa. «Discípulo» e «mestre» preservam o contexto de aprendizagem; «escravo» evita atenuar a relação social expressa no original.
