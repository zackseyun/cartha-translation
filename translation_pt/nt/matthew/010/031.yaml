  text: μὴ οὖν ⸀φοβεῖσθε· πολλῶν στρουθίων διαφέρετε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: pt
  text: Portanto, não tenham medo; vocês valem mais do que muitos pardais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν
  choice: Portanto, não
  rationale: A partícula οὖν apresenta a conclusão decorrente do argumento anterior sobre o cuidado do Pai, enquanto μή com o imperativo expressa proibição. “Portanto, não” preserva com clareza essa ligação lógica.
- source_word: φοβεῖσθε
  choice: tenham medo
  rationale: A forma imperativa de φοβέομαι é expressa de modo natural e corrente em português por “tenham medo”; com a negação, comunica diretamente a ordem “não tenham medo”.
- source_word: πολλῶν στρουθίων
  choice: muitos pardais
  rationale: 'No contexto imediato, στρουθίον designa pardais, e o genitivo após διαφέρετε integra a comparação: “mais do que muitos pardais”.'
- source_word: διαφέρετε
  choice: valem mais do que
  rationale: Neste contexto, διαφέρω indica superioridade de valor ou importância, e não mera diferença. “Valem mais do que” comunica de maneira natural a comparação feita por Jesus.
- source_word: ὑμεῖς
  choice: vocês
  rationale: O pronome explícito dá ênfase aos discípulos em contraste com os pardais. “Vocês” preserva essa ênfase e oferece ampla legibilidade brasileira.
theological_decisions:
- issue: Valor relativo dos seres humanos e dos pardais no ensino de Jesus
  choice: vocês valem mais do que muitos pardais
  alternative: vocês são mais valiosos do que muitos pardais
  rationale: A formulação preserva a comparação de valor no contexto do cuidado de Deus pelos discípulos, sem sugerir que Deus não cuide dos animais. “Valem mais” é natural, conciso e mantém a força comparativa de διαφέρετε.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O plural “vocês” representa o destinatário plural do grego; “pardais” mantém a referência concreta do contexto.
