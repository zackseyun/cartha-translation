reference: Matthew 10:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: pt
  text: Um irmão entregará seu irmão à morte[a], e um pai entregará seu filho; os filhos se levantarão contra os pais e os matarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entregará para a morte”. O verbo também pode ter o sentido de “trair” em contextos de deslealdade.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: entregará
  rationale: Expressa dar alguém ao poder de outros, aqui com a morte como resultado, sem tornar explícita a ideia possível, mas não obrigatória, de traição.
- source_word: ἀδελφὸς ἀδελφὸν
  choice: um irmão ... o próprio irmão
  rationale: Mantém a referência masculina do grego e torna natural em português a relação familiar recíproca.
- source_word: εἰς θάνατον
  choice: à morte
  rationale: 'Indica o fim ou resultado da entrega: a pessoa é entregue para morrer.'
- source_word: πατὴρ τέκνον
  choice: o pai ... o filho
  rationale: Neste paralelismo familiar, 'filho' funciona como singular representativo de τέκνον; não restringe o plural inclusivo empregado em seguida.
- source_word: ἐπαναστήσονται
  choice: se levantarão contra
  rationale: Conserva a imagem vívida e o sentido hostil do verbo, sem especificar uma rebelião política.
- source_word: τέκνα
  choice: os filhos
  rationale: No plural, designa os descendentes, sem limitação ao sexo masculino no uso português contextual.
- source_word: ἐπὶ γονεῖς
  choice: contra os pais
  rationale: ἐπί com acusativo, após verbo de oposição, tem aqui o sentido de 'contra'; 'pais' designa pai e mãe coletivamente.
- source_word: θανατώσουσιν αὐτούς
  choice: os matarão
  rationale: Transmite de modo direto e natural que causarão a morte dos pais; o pronome retoma claramente 'os pais'.
theological_decisions:
- issue: Termos familiares marcados e coletivos
  choice: Conservar 'irmão' e usar 'filho(s)' e 'pais' segundo o uso coletivo natural do português
  alternative: Usar 'irmão ou irmã', 'criança(s)' e 'progenitores'
  rationale: ἀδελφός é masculino no texto, enquanto τέκνον/τέκνα e γονεῖς têm alcance mais amplo. A formulação escolhida preserva a distinção lexical e soa digna e corrente em português, sem acrescentar categorias ausentes do grego.
- issue: Agente implícito na entrega à morte
  choice: Não explicitar autoridades, tribunais ou executores
  alternative: Traduzir como 'entregará às autoridades para ser morto'
  rationale: O grego declara a entrega com resultado de morte, mas não identifica quem recebe a pessoa nem o mecanismo da execução; explicitar isso resolveria indevidamente uma ambiguidade do texto.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A repetição de 'entregará' no segundo membro explicita a elipse grega necessária ao português. 'O próprio irmão' reforça a gravidade do vínculo familiar sem alterar o sentido.
