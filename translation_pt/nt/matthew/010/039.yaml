id: MAT.10.39
reference: Matthew 10:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: pt
  text: Quem encontra a sua vida a perderá[a], e quem perde a sua vida por minha causa a encontrará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alma”, nas duas ocorrências; o grego ψυχή pode significar “vida” ou “alma”, mas aqui “vida” se ajusta melhor ao contexto de perder e encontrar a própria vida no discipulado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: Quem encontra
  rationale: O artigo com o particípio aoristo tem função substantiva e sentido representativo. “Quem encontra” é natural em português e preserva a força genérica da expressão.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: a sua vida
  rationale: Neste contexto de discipulado, ψυχή designa a própria vida, e não especificamente uma alma imaterial. “Sua” mantém a referência singular sem tornar a frase pesada.
- source_word: ἀπολέσει αὐτήν
  choice: a perderá
  rationale: Aqui ἀπόλλυμι exprime perda. A colocação pronominal é natural no registro digno escolhido e conserva o contraste entre encontrar e perder.
- source_word: ὁ ἀπολέσας
  choice: quem perde
  rationale: Embora o particípio seja aoristo, a máxima tem sentido geral; o presente em português comunica com naturalidade essa força proverbial.
- source_word: ἕνεκεν ἐμοῦ
  choice: por minha causa
  rationale: A expressão indica causa ou motivo ligado à pessoa de Jesus. “Por minha causa” é clara, corrente e menos suscetível à leitura de benefício prestado a Jesus do que “por mim” isoladamente.
- source_word: εὑρήσει αὐτήν
  choice: a encontrará
  rationale: “Encontrará” preserva a correspondência verbal deliberada com “encontra”, mantendo a simetria paradoxal do dito.
theological_decisions:
- issue: Sentido de ψυχή no paradoxo do discipulado
  choice: vida
  alternative: alma
  rationale: O contexto trata de conservar ou entregar a própria vida por lealdade a Jesus, não de estabelecer uma distinção entre corpo e alma. A nota preserva a amplitude lexical real de ψυχή sem dissolver o paradoxo.
- issue: Força de ἕνεκεν ἐμοῦ
  choice: por minha causa
  alternative: por amor de mim
  rationale: A formulação escolhida conserva a relação causal e pessoal com Jesus sem acrescentar explicitamente a ideia de amor, embora esta possa estar implicada no discipulado.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção paralela e concisa preserva o caráter proverbial e o paradoxo do original.
