id: MAT.10.1
reference: Matthew 10:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: pt
  text: E, chamando para junto de si os seus doze discípulos, deu-lhes autoridade sobre os espíritos impuros, para expulsá-los e curar toda doença e toda enfermidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda doença e toda debilidade”. O grego emprega dois termos relacionados, νόσος e μαλακία.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: chamando para junto de si
  rationale: O particípio aoristo médio de προσκαλέομαι indica chamar ou convocar alguém para perto de si. A formulação preserva essa nuance reflexiva sem tornar a sequência temporal mais explícita do que o grego.
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: os seus doze discípulos
  rationale: μαθητής é naturalmente traduzido por “discípulo” no contexto dos Evangelhos; αὐτοῦ é representado pelo possessivo “seus”.
- source_word: ἔδωκεν
  choice: deu-lhes
  rationale: δίδωμι tem aqui o sentido direto de “dar”; o pronome enclítico representa αὐτοῖς de modo natural em português.
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: ἐξουσία denota autoridade ou direito conferido para agir, mais precisamente do que mera força ou capacidade.
- source_word: πνευμάτων ἀκαθάρτων
  choice: sobre os espíritos impuros
  rationale: O genitivo dependente de ἐξουσία expressa o âmbito sobre o qual a autoridade é exercida. “Espíritos impuros” é claro e mantém o sentido ritual e moral de ἀκάθαρτος.
- source_word: ὥστε ἐκβάλλειν αὐτὰ
  choice: para expulsá-los
  rationale: ὥστε com infinitivo pode envolver finalidade e resultado; “para” conserva essa relação sem impor uma distinção rígida. ἐκβάλλω significa expulsar ou lançar para fora, e o pronome retoma os espíritos.
- source_word: θεραπεύειν
  choice: curar
  rationale: No contexto, θεραπεύω descreve restaurar pessoas de doenças e enfermidades; “curar” é corrente e preciso.
- source_word: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: toda doença e toda enfermidade
  rationale: A tradução mantém os dois termos gregos relacionados, νόσος e μαλακία, sem fundi-los. “Enfermidade” pode abranger a debilidade implícita em μαλακία.
theological_decisions:
- issue: Natureza da comissão dada aos discípulos
  choice: Jesus lhes deu autoridade sobre os espíritos impuros
  alternative: Jesus lhes deu poder sobre os espíritos impuros
  rationale: “Autoridade” reflete melhor ἐξουσία como direito ou autoridade conferida, preservando a origem delegada dessa capacidade sem acrescentar uma formulação doutrinária ao texto.
- issue: Relação expressa por ὥστε com os infinitivos
  choice: para expulsá-los e curar
  alternative: de modo que pudessem expulsá-los e curar
  rationale: O grego permite uma sobreposição entre propósito e resultado. A construção concisa com “para” mantém essa abertura melhor do que uma paráfrase que enfatize exclusivamente capacidade ou resultado.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. “Para junto de si” preserva a nuance do verbo grego; “espíritos impuros” evita uma expressão excessivamente arcaica. A repetição de “toda” reproduz a ênfase distributiva do original.
