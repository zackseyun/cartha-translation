source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: pt
  text: Mas, quando os entregarem, não se preocupem com o modo como ou com o que devem falar, pois, naquela hora, será dado a vocês o que devem falar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma passiva «será dado» deixa implícito quem dará as palavras; o versículo seguinte identifica o Espírito como aquele que fala por meio deles.
    reason: Preserva a passiva de δοθήσεται e remete à explicação imediata do contexto, sem explicitar o agente no texto principal.
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Mas, quando
  rationale: ὅταν apresenta uma situação futura eventual, enquanto δέ marca uma transição leve e contrastiva em relação à advertência anterior.
- source_word: παραδῶσιν ὑμᾶς
  choice: entregarem vocês
  rationale: Preserva o sentido de entregar alguém às autoridades ou ao poder de outros, sem restringir o verbo à ideia de traição.
- source_word: μὴ μεριμνήσητε
  choice: não se preocupem
  rationale: Expressa em português corrente a proibição de ansiedade antecipada quanto ao testemunho que terão de dar.
- source_word: πῶς ἢ τί
  choice: com como ou com o que
  rationale: Mantém a distinção grega entre a maneira de falar e o conteúdo da fala, bem como a conjunção alternativa ἤ.
- source_word: λαλήσητε
  choice: devem falar
  rationale: O subjuntivo em pergunta indireta contempla o discurso futuro; a construção com 'devem' é clara e natural em português.
- source_word: δοθήσεται
  choice: será dado
  rationale: Mantém a voz passiva e deixa implícito o agente, como no grego.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: naquela hora
  rationale: Conserva a imagem temporal e a ênfase na provisão no momento necessário.
- source_word: τί λαλήσητε
  choice: o que devem falar
  rationale: Repete a formulação anterior para refletir a repetição de λαλέω no texto grego.
theological_decisions:
- issue: Agente implícito na passiva δοθήσεται
  choice: Manter 'lhes será dado', sem nomear o agente no texto principal.
  alternative: Deus lhes dará / o Espírito lhes dará
  rationale: O versículo emprega uma passiva e não identifica expressamente quem dá. O versículo seguinte esclarece a atuação do Espírito; esta tradução preserva a reserva e a progressão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'vocês' para o plural de segunda pessoa e conserva a repetição de 'falar'. A sequência 'com como ou com o que' é deliberadamente formal para preservar a distinção entre modo e conteúdo; as notas esclarecem o contexto sem resolver no texto principal o agente da passiva.
