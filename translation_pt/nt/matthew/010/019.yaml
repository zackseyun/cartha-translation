review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a contingência futura, a proibição de ansiedade, a distinção entre modo e conteúdo, a repetição de λαλέω e a passiva impessoal de δοθήσεται. Contudo, a nota [a] original afirma especificamente a entrega «às autoridades», elemento que não está expresso neste versículo e que não deve ser apresentado como esclarecimento necessário do texto.
  naturalness: «Quando entregarem vocês» e especialmente «com como ou com o que» soam pouco naturais no português moderno. «Quando os entregarem» e «com o modo como ou com o que devem falar» são claros, mantêm o plural tratado como «vocês» e preservam a distinção do grego.
  terminology: «Entregar», «não se preocupem», «falar» e «será dado a vocês» são escolhas apropriadas. A passiva deve permanecer sem explicitar Deus ou o Espírito no texto principal.
  issues:
  - severity: medium
    issue: A nota [a] acrescenta «às autoridades».
    rationale: παραδῶσιν ὑμᾶς significa «entregarem vocês/os entregarem», mas o destinatário da entrega não é especificado no versículo. Embora o contexto possa envolver autoridades, a nota transforma uma inferência contextual em explicação do sentido lexical.
  - severity: low
    issue: A formulação «com como ou com o que» é pouco idiomática.
    rationale: A construção é compreensível, mas resulta truncada em português moderno. «Com o modo como ou com o que devem falar» conserva precisamente a distinção entre πῶς e τί.
  revised_text: Mas, quando os entregarem, não se preocupem com o modo como ou com o que devem falar, pois, naquela hora, será dado a vocês o que devem falar.[a]
