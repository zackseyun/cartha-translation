- from: Mas, quando entregarem vocês[a], não se preocupem com como ou com o que devem falar, pois naquela hora lhes será dado o que devem falar.[b]
  to: Mas, quando os entregarem, não se preocupem com o modo como ou com o que devem falar, pois, naquela hora, será dado a vocês o que devem falar.[a]
  rationale: 'A revisão elimina a nota que introduzia «às autoridades» sem apoio explícito no versículo, melhora a fluência de duas construções e conserva todas as relações semânticas relevantes do grego: entrega, ansiedade quanto ao modo ou conteúdo da fala, provisão no momento necessário e agente da passiva não nomeado.'
