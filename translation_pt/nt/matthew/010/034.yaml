id: MAT.10.34
reference: Matthew 10:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: pt
  text: Não pensem que vim trazer paz à terra. Não vim trazer paz, mas uma espada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: O grego diz literalmente «uma espada»; no contexto, a imagem aponta para divisão, não para uma recomendação da violência.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Não pensem
  rationale: O subjuntivo aoristo com μή expressa proibição. “Não pensem” é direto, natural e preserva a força da expressão grega.
- source_word: ἦλθον
  choice: vim
  rationale: O aoristo descreve de modo conciso a vinda de Jesus em relação à sua missão; “vim” é a forma idiomática correspondente em português.
- source_word: βαλεῖν
  choice: trazer
  rationale: Embora βάλλω possa significar literalmente “lançar”, neste contexto de missão “trazer” comunica com naturalidade o efeito visado, tanto com “paz” quanto com “espada”.
- source_word: εἰρήνην
  choice: paz
  rationale: Equivalente corrente e preciso de εἰρήνην.
- source_word: ἐπὶ τὴν γῆν
  choice: à terra
  rationale: Expressa de maneira natural a extensão sobre a terra; o acento grave também evita uma leitura em que “terra” fosse objeto direto de “trazer”.
- source_word: ἀλλὰ
  choice: mas
  rationale: Mantém o contraste adversativo forte e natural do grego.
- source_word: μάχαιραν
  choice: uma espada
  rationale: Preserva a imagem concreta do texto grego, sem substituí-la pela interpretação contextual de “divisão”.
theological_decisions:
- issue: Se a imagem da espada deve ser suavizada ou interpretada como “divisão” no texto principal
  choice: Manter “uma espada” no texto principal
  alternative: divisão
  rationale: O grego traz explicitamente μάχαιραν, “espada”. O contexto subsequente esclarece seu efeito divisivo, mas a tradução deve conservar a imagem e a tensão do dito, sem transformá-la em paráfrase interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. O plural “pensem” evita marcar regionalmente a segunda pessoa. A repetição de “trazer paz” preserva a ênfase retórica do original.
