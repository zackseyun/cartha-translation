id: MAT.10.28
reference: Matthew 10:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: pt
  text: E não tenham medo dos que matam o corpo, mas não podem matar a alma. Pelo contrário, tenham medo daquele que pode destruir tanto a alma como o corpo na Geena.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no inferno”. Em grego, “na Geena”, termo derivado do vale de Hinom e usado para o lugar do juízo final.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβεῖσθε
  choice: não tenham medo / tenham medo
  rationale: Preserva a repetição antitética do mesmo verbo e comunica com naturalidade tanto a proibição como a advertência.
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: dos que matam
  rationale: O particípio substantivado designa genericamente uma classe de pessoas; esta formulação é direta e natural em português.
- source_word: σῶμα
  choice: corpo
  rationale: Equivalente corrente e direto para o corpo físico.
- source_word: ψυχήν
  choice: alma
  rationale: No contraste explícito com o corpo, “alma” preserva melhor a distinção apresentada no grego; “vida” tornaria o contraste menos nítido.
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: não podem matar
  rationale: Expressa de modo claro e idiomático a incapacidade indicada pelo particípio grego.
- source_word: μᾶλλον
  choice: pelo contrário
  rationale: 'Marca a correção enfática: não temer uns, mas temer aquele que possui poder decisivo. Evita que “mais” sugira apenas uma diferença de intensidade.'
- source_word: τὸν δυνάμενον
  choice: daquele que pode
  rationale: Mantém o referente sem identificação explícita, como no grego, e se encaixa naturalmente na regência portuguesa de “ter medo de”.
- source_word: ἀπολέσαι
  choice: destruir
  rationale: Conserva a força do juízo decisivo sem definir além do texto a natureza metafísica dessa destruição.
- source_word: ἐν γεέννῃ
  choice: na Geena
  rationale: Translitera o termo específico grego e preserva seu contexto judaico, deixando a equivalência tradicional para a nota.
- source_word: καὶ ψυχὴν καὶ σῶμα
  choice: tanto a alma como o corpo
  rationale: Reproduz de forma natural em português a correlação enfática dos dois καί.
theological_decisions:
- issue: Identidade daquele que pode destruir a alma e o corpo na Geena
  choice: Manter “daquele que pode” sem identificação explícita
  alternative: Explicitar “Deus” ou “Satanás”
  rationale: O contexto aponta mais naturalmente para Deus como autoridade do juízo final, mas a expressão grega não nomeia o referente. A tradução preserva essa abertura textual.
- issue: Sentido de γέεννα
  choice: Geena no texto principal
  alternative: inferno
  rationale: “Geena” preserva o termo histórico e teológico do original; “inferno” é uma equivalência interpretativa tradicional e acessível, apresentada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “tenham” corresponde ao destinatário coletivo do imperativo grego. A repetição de “matar” e o contraste entre corpo e alma foram preservados.
