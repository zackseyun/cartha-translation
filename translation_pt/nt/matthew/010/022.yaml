id: MAT.10.22
reference: Matthew 10:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: pt
  text: E vocês serão odiados por todos por causa do meu nome.[a] Mas quem perseverar até o fim será salvo.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa de mim” ou “por amor ao meu nome”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quem suportar até o fim”.'
    reason: lexical_alternative
  - marker: c
    text: “Será salvo” também pode ser entendido como “será liberto” ou “será resgatado”, conforme a compreensão do contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι
  choice: serão odiados
  rationale: A construção perifrástica futura ἔσεσθε μισούμενοι descreve o estado futuro de serem alvo de ódio; esta é a forma natural e direta em português.
- source_word: ὑπὸ πάντων
  choice: por todos
  rationale: Com ὑπό na construção passiva, πάντων indica os agentes pessoais. “Por todos” conserva a força abrangente e a concisão do grego.
- source_word: διὰ τὸ ὄνομά μου
  choice: por causa do meu nome
  rationale: διά com acusativo expressa causa. A formulação preserva “nome” como referência à pessoa, autoridade e identificação com Jesus, sem explicitar no texto mais do que o original.
- source_word: ὁ δὲ ὑπομείνας
  choice: Mas quem perseverar
  rationale: O particípio aoristo substantivado designa a pessoa que se mantém firme sob provação. “Perseverar” comunica naturalmente essa resistência continuada no contexto de perseguição.
- source_word: εἰς τέλος
  choice: até o fim
  rationale: A expressão indica persistência até o ponto final; “até o fim” é idiomático e mantém aberta a identificação precisa desse fim pelo contexto.
- source_word: οὗτος
  choice: quem ... será
  rationale: O pronome retomador e enfático é representado pela construção portuguesa fluente “quem... será”, evitando o pouco natural “esse será” sem alterar a referência exclusiva à pessoa que persevera.
- source_word: σωθήσεται
  choice: será salvo
  rationale: O futuro passivo de σῴζω pode abranger salvação, livramento ou resgate. “Será salvo” preserva a amplitude teológica e a formulação tradicional sem restringir o sentido à proteção física.
theological_decisions:
- issue: Relação entre perseverança até o fim e salvação
  choice: Manter a afirmação direta de que quem perseverar até o fim será salvo.
  alternative: Especificar livramento físico, salvação escatológica ou um modelo doutrinário particular de perseverança.
  rationale: O versículo vincula perseverança em meio ao ódio e salvação, mas não resolve aqui todas as questões sobre a natureza do fim ou do livramento. A tradução conserva essa tensão sem importar uma formulação denominacional.
- issue: Sentido de “nome”
  choice: Preservar literalmente “meu nome”.
  alternative: Parafrasear como “por serem meus seguidores” ou “por causa de mim”.
  rationale: A expressão envolve a pessoa e a autoridade de Jesus e a identificação com ele, mas traduzir “nome” mantém a imagem e a densidade próprias do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “E vocês” mantém a ligação com o contexto e o plural explícito; “quem perseverar” evita uma construção pesada, preservando o sentido do particípio substantivado e do pronome retomador.
