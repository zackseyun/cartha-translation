source:
  edition: SBLGNT
  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: pt
  text: Curem os doentes, ressuscitem os mortos, purifiquem as pessoas com lepra[a] e expulsem os demônios. Vocês receberam de graça; deem de graça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pessoas com uma doença de pele”. O termo bíblico tradicionalmente traduzido por “lepra” pode abranger doenças graves de pele, e não apenas a hanseníase moderna.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενοῦντας θεραπεύετε
  choice: Curem os doentes
  rationale: O particípio designa pessoas enfermas neste contexto de cura, e θεραπεύετε é um imperativo plural. A formulação é direta, natural e preserva a ação concreta.
- source_word: νεκροὺς ἐγείρετε
  choice: ressuscitem os mortos
  rationale: Neste contexto, ἐγείρω significa levantar pessoas da morte. “Ressuscitem” expressa isso com clareza em português, sem sugerir apenas acordar ou erguer fisicamente.
- source_word: λεπροὺς καθαρίζετε
  choice: purifiquem as pessoas com lepra
  rationale: “Pessoas com lepra” evita reduzir as pessoas à enfermidade, enquanto a nota preserva a extensão histórica do termo. “Purifiquem” mantém as dimensões física e ritual de καθαρίζω, que “curem” não expressaria plenamente.
- source_word: δαιμόνια ἐκβάλλετε
  choice: expulsem os demônios
  rationale: É a equivalência direta e corrente para a expulsão de demônios no contexto do Novo Testamento.
- source_word: δωρεὰν ἐλάβετε, δωρεὰν δότε
  choice: Vocês receberam de graça; deem de graça
  rationale: “De graça” comunica o sentido de δωρεάν — gratuitamente, sem pagamento — e sua repetição conserva o paralelismo enfático do grego. “Vocês” torna explícito o sujeito plural de maneira natural no português brasileiro.
theological_decisions:
- issue: Alcance das ordens milagrosas
  choice: Traduzir todos os verbos como ordens diretas dadas aos discípulos no discurso missionário.
  alternative: Interpretar algumas ações metaforicamente ou limitá-las, já na tradução, a práticas eclesiásticas posteriores.
  rationale: O grego emprega imperativos plurais diretos numa lista de ações concretas. A tradução preserva a força histórica e teológica da comissão sem decidir além do texto como ela se aplica em outros contextos.
- issue: Sentido de καθαρίζετε em relação às pessoas com lepra
  choice: Usar “purifiquem”, preservando simultaneamente as dimensões corporal e ritual.
  alternative: Usar apenas “curem”, ressaltando exclusivamente a recuperação física.
  rationale: No contexto bíblico, a purificação de pessoas atingidas por essas doenças envolve linguagem de pureza e reintegração, além da cura física. A escolha conserva essa tensão sem explicá-la dentro do versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega verbos no imperativo plural associados a “vocês”. A coordenação com “e” antes da última ordem torna a enumeração natural sem enfraquecer sua sequência. O marcador [a] foi colocado após “pessoas com lepra”, expressão à qual a nota efetivamente se refere.
