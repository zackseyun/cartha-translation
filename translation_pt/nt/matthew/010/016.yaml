  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: pt
  text: Vejam, eu os envio como ovelhas no meio de lobos; portanto, sejam prudentes como as serpentes e íntegros como as pombas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Vejam
  rationale: Interjeição que chama a atenção dos discípulos; «Vejam» é natural, atual e preserva a força discursiva do plural implícito no contexto.
- source_word: ἀποστέλλω
  choice: envio
  rationale: Expressa diretamente o ato de incumbir e mandar os discípulos, sem acrescentar conteúdo ausente do grego.
- source_word: ἐν μέσῳ
  choice: para o meio de
  rationale: Com verbo de envio, comunica naturalmente o movimento para dentro de um ambiente hostil, preservando a imagem espacial.
- source_word: φρόνιμοι
  choice: prudentes
  rationale: Indica sensatez prática, discernimento e cautela; «prudentes» evita sugerir mera erudição ou astúcia moralmente duvidosa.
- source_word: οἱ ὄφεις
  choice: as serpentes
  rationale: Mantém a imagem tradicional e abrangente do grego ὄφις, com os artigos usados genericamente.
- source_word: ἀκέραιοι
  choice: íntegros
  rationale: O termo pode indicar aquilo que não está misturado e, moralmente, sinceridade ou ausência de malícia. «Íntegros» preserva essa amplitude melhor que uma formulação estritamente psicológica.
- source_word: αἱ περιστεραί
  choice: as pombas
  rationale: Equivalente comum e natural para περιστεραί, preservando a comparação proverbial.
theological_decisions:
- issue: Relação entre prudência e integridade na missão
  choice: Manter as duas qualidades em paralelo, sem fazer da prudência sinônimo de astúcia enganosa nem da integridade sinônimo de ingenuidade.
  alternative: Explicitar interpretativamente como «astutos, mas sem maldade».
  rationale: O texto coordena duas imagens em tensão complementar. A tradução deve preservar essa tensão ética sem inserir uma harmonização doutrinária no corpo do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural «Vejam» e as formas «sejam» refletem que Jesus se dirige ao grupo de discípulos. Evitou-se linguagem excessivamente arcaica.
