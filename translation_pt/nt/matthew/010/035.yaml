id: MAT.10.35
reference: Matthew 10:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἦλθον γὰρ διχάσαι ἄνθρωπον κατὰ τοῦ πατρὸς αὐτοῦ καὶ θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: pt
  text: Pois eu vim pôr um homem contra seu pai[a], uma filha contra sua mãe e uma nora contra sua sogra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dividir”; o infinitivo grego pode ser traduzido mais literalmente assim, mas as expressões repetidas com “contra” deixam explícito que se trata de oposição entre pessoas.
    reason: lexical_alternative
  - marker: b
    text: O grego νύμφη pode significar “noiva” em alguns contextos; aqui significa “nora”, pois aparece em relação com “sogra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: eu vim
  rationale: O aoristo de ἔρχομαι refere-se naturalmente à vinda e missão de Jesus; o pretérito perfeito é direto e idiomático em português.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa da conjunção e liga o versículo à declaração anterior.
- source_word: διχάσαι
  choice: pôr ... contra
  rationale: O infinitivo expressa causar divisão; junto das construções repetidas com κατά, indica oposição entre pessoas. Esta formulação comunica essa força relacional com naturalidade.
- source_word: ἄνθρωπον
  choice: um homem
  rationale: Embora ἄνθρωπος possa ser genérico, aqui integra uma série doméstica com figuras femininas explicitamente nomeadas; o masculino singular é apropriado.
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: contra seu pai
  rationale: κατά com genitivo expressa oposição; a formulação é clara e preserva a repetição estrutural.
- source_word: θυγατέρα
  choice: a filha
  rationale: Equivalente direto e natural do substantivo acusativo singular.
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: contra sua mãe
  rationale: Preserva o sentido adversativo e o paralelismo da frase grega.
- source_word: νύμφην
  choice: a nora
  rationale: Embora νύμφη possa significar “noiva”, a associação com πενθερά exige aqui o sentido de parentesco “nora”.
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: contra sua sogra
  rationale: É o equivalente corrente do termo de parentesco e mantém o padrão repetido de oposição familiar.
theological_decisions:
- issue: Natureza da missão de Jesus declarada no contexto
  choice: Apresentar a vinda de Jesus como causa de oposição dentro da família, preservando a força desconcertante da afirmação.
  alternative: Explicitar que se trata apenas de um efeito social da fidelidade a Jesus, ou suavizar a frase como simples separação.
  rationale: O grego atribui à vinda de Jesus a divisão entre familiares, mas o versículo não oferece por si só uma explicação teológica mais ampla. A tradução mantém a tensão sem sugerir que a hostilidade familiar seja celebrada como um bem último.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. “Pois” conserva a ligação explicativa; “pôr ... contra” é corrente e mantém a contundência do original. Os possessivos foram mantidos sem artigo, forma natural e amplamente compreensível.
