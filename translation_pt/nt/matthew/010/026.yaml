id: MAT.10.26
reference: Matthew 10:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: pt
  text: Portanto, não tenham medo deles, pois não há nada encoberto que não venha a ser revelado, nem nada oculto que não venha a ser conhecido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: Portanto, não tenham medo deles
  rationale: Mantém a inferência de οὖν, o imperativo negativo dirigido a um grupo e o referente explícito αὐτούς, em português natural e amplamente compreensível.
- source_word: κεκαλυμμένον
  choice: encoberto
  rationale: Expressa a ideia de algo coberto ou velado e preserva o contraste com ἀποκαλυφθήσεται, sem restringir o sentido a um segredo deliberadamente escondido.
- source_word: ἀποκαλυφθήσεται
  choice: venha a ser revelado
  rationale: Conserva a voz passiva e a orientação futura do verbo; a construção portuguesa apresenta o resultado futuro de modo idiomático.
- source_word: κρυπτὸν
  choice: oculto
  rationale: Distingue este termo de κεκαλυμμένον sem exagerar uma diferença semântica que o paralelismo não exige.
- source_word: γνωσθήσεται
  choice: venha a ser conhecido
  rationale: Preserva o sentido passivo de tornar-se conhecido, sem inserir um agente ou explicar indevidamente como isso acontecerá.
theological_decisions:
- issue: Agente implícito nas formas passivas futuras
  choice: Manter as formas passivas sem identificar o agente
  alternative: Explicitar Deus como aquele que revela e dá a conhecer
  rationale: O grego não nomeia o agente. Embora um passivo divino seja possível, explicitá-lo resolveria uma ambiguidade legítima do texto.
- issue: Alcance da máxima sobre revelação
  choice: Traduzir a afirmação de forma geral, sem acrescentar uma aplicação específica
  alternative: Explicar que se refere à mensagem dos discípulos, à perseguição ou ao juízo final
  rationale: O versículo formula a máxima sem delimitar expressamente sua aplicação; o contexto pode orientar a leitura, mas a tradução não deve fixar uma única interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com imperativo plural natural para leitores brasileiros e inteligível internacionalmente. O paralelismo foi preservado por meio de “nada encoberto... nem nada oculto...”, sem notas necessárias.
