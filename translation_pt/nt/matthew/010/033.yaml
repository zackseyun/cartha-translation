id: MAT.10.33
reference: Matthew 10:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: pt
  text: Mas quem me negar diante dos homens[a], eu também o negarei diante de meu Pai, que está nos céus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante das pessoas”. O plural masculino grego tem sentido genérico neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: Mas quem
  rationale: A construção introduz uma condição geral, e δέ estabelece contraste com o versículo anterior. “Mas quem” é natural em português e mantém ambos os aspectos.
- source_word: ἀρνήσηταί με
  choice: me negar
  rationale: “Negar” expressa diretamente ἀρνέομαι e permite conservar o mesmo verbo na resposta de Jesus.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: diante dos homens
  rationale: “Diante de” comunica presença pública; “homens” preserva a forma masculina plural do grego, empregada aqui com sentido genérico. A alternativa mais explicitamente inclusiva aparece em nota.
- source_word: ἀρνήσομαι κἀγὼ αὐτὸν
  choice: eu também o negarei
  rationale: Mantém o paralelismo verbal e a correspondência enfática de κἀγώ (“eu também”), enquanto o pronome “o” reflete αὐτόν.
- source_word: τοῦ πατρός μου
  choice: meu Pai
  rationale: Reproduz sem expansão a designação filial usada por Jesus.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: que está nos céus
  rationale: Preserva o plural grego οὐρανοῖς em uma expressão portuguesa clara e tradicional, sem alterar o sentido.
theological_decisions:
- issue: Forma masculina de ἀνθρώπων e αὐτόν com alcance geral
  choice: diante dos homens ... o negarei
  alternative: diante das pessoas ... negarei essa pessoa
  rationale: A tradução principal preserva a forma gramatical masculina do texto grego sem limitar o alcance da declaração aos homens; a nota explicita o sentido genérico.
- issue: Correspondência entre as duas ocorrências de ἀρνέομαι
  choice: me negar ... o negarei
  alternative: me repudiar ... o repudiarei
  rationale: Repetir “negar” conserva a simetria retórica e a reciprocidade solene do enunciado sem acrescentar uma nuance interpretativa.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe natural tanto no Brasil quanto em outros contextos lusófonos. O plural “nos céus” mantém de modo inteligível a forma do original.
