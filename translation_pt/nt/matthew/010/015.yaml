id: MAT.10.15
reference: Matthew 10:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: pt
  text: 'Em verdade lhes digo: no dia do juízo, será mais suportável para a terra de Sodoma e Gomorra[a] do que para aquela cidade[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para Sodoma e Gomorra». O grego diz literalmente «para a terra de Sodoma e Gomorra».
    reason: lexical_alternative
  - marker: b
    text: Ou «localidade» ou «povoado».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Em verdade
  rationale: Na fórmula solene de Jesus, «Em verdade» comunica de modo claro e digno a força asseverativa de ἀμήν, sem recorrer à transliteração menos transparente «Amém».
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Mantém de forma natural em português a declaração direta do grego, dirigindo-se aos discípulos no plural.
- source_word: ἀνεκτότερον
  choice: mais suportável
  rationale: Expressa o sentido comparativo de algo mais possível de suportar; é corrente e claro, enquanto «mais tolerável» permanece uma alternativa válida.
- source_word: γῇ
  choice: para a terra
  rationale: Preserva a referência territorial concreta e a construção comparativa do grego, sem reduzir Sodoma e Gomorra apenas aos habitantes ou às cidades.
- source_word: Σοδόμων καὶ Γομόρρων
  choice: de Sodoma e Gomorra
  rationale: Emprega as formas consagradas dos topônimos em português e mantém sua dependência de «terra».
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: no dia do juízo
  rationale: Formulação natural e tradicional em português que conserva a referência solene a um futuro dia de julgamento, sem acrescentar um esquema doutrinário.
- source_word: πόλει
  choice: cidade
  rationale: «Cidade» é o equivalente direto e amplamente natural de πόλις; «povoado» ou «localidade» seriam possíveis conforme o tamanho do lugar, mas menos formais.
- source_word: ἐκείνῃ
  choice: aquela
  rationale: Retoma a cidade específica que rejeitou os mensageiros, preservando o valor demonstrativo do grego sem intensificação indevida.
theological_decisions:
- issue: Natureza do «dia do juízo»
  choice: Apresentá-lo como um futuro dia de julgamento sem explicar além do que o versículo afirma.
  alternative: Entendê-lo de modo mais geral como um tempo de julgamento.
  rationale: A expressão aponta naturalmente para o juízo divino futuro, mas a tradução não deve impor detalhes escatológicos ausentes do texto.
- issue: Comparação entre Sodoma e Gomorra e a cidade rejeitadora
  choice: Conservar a comparação de graus de suportabilidade no juízo.
  alternative: Parafrasear como graus explícitos de culpa ou punição.
  rationale: O texto afirma que o juízo será mais suportável para uma parte do que para a outra, mas não explica diretamente a mecânica, a medida ou a natureza dessa diferença.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem foi levemente ajustada para fluência, trazendo «no dia do juízo» antes do predicado comparativo. «Em verdade lhes digo» preserva a fórmula enfática; «terra de Sodoma e Gomorra» mantém uma particularidade do original que muitas traduções simplificam.
