  source_fidelity: A tradução preserva adequadamente a fórmula solene «ἀμὴν λέγω ὑμῖν», a comparação de ἀνεκτότερον, o referente territorial expresso por γῇ («a terra de Sodoma e Gomorra»), o enquadramento temporal «no dia do juízo» e o demonstrativo referente à cidade específica. A antecipação de «no dia do juízo» é uma reorganização idiomática legítima e não altera o sentido.
