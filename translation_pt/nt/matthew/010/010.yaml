id: MAT.10.10
reference: Matthew 10:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: pt
  text: não levem bolsa de viagem para o caminho, nem duas túnicas, nem sandálias, nem cajado[a], pois o trabalhador é digno do seu alimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns entendem “nem cajado” como uma proibição de levar um cajado extra, especialmente à luz de Marcos 6:8, que permite levar um cajado.
    reason: Leitura alternativa proposta para explicar a diferença em relação ao relato paralelo.
lexical_decisions:
- source_word: πήραν
  choice: bolsa de viagem
  rationale: πήρα designa uma bolsa levada em viagem, especialmente para provisões. “Bolsa de viagem” explicita o contexto sem perder o sentido concreto.
- source_word: εἰς ὁδὸν
  choice: para o caminho
  rationale: A expressão indica aquilo que se leva para uma jornada. “Para o caminho” é conciso, natural e próximo da forma grega.
- source_word: δύο χιτῶνας
  choice: duas túnicas
  rationale: χιτών era a veste básica usada junto ao corpo. “Túnicas” mantém a precisão histórica, ao contrário de termos modernos como “camisas”.
- source_word: ὑποδήματα
  choice: sandálias
  rationale: ὑπόδημα designa calçado preso sob os pés; “sandálias” corresponde bem ao contexto do primeiro século.
- source_word: ῥάβδον
  choice: cajado
  rationale: Neste contexto, ῥάβδος se refere naturalmente ao bastão usado por um viajante. “Cajado” é claro e preserva a proibição expressa em Mateus, sem harmonizá-la com Marcos 6:8.
- source_word: ἄξιος
  choice: é digno
  rationale: ἄξιος expressa a ideia de ser digno ou merecedor. “É digno” preserva a nuance avaliativa e a formulação bíblica sem deixar de ser compreensível.
- source_word: ὁ ἐργάτης
  choice: o trabalhador
  rationale: ἐργάτης é aquele que trabalha. “Trabalhador” é corrente e não introduz terminologia eclesiástica técnica.
- source_word: τῆς τροφῆς αὐτοῦ
  choice: do seu alimento
  rationale: τροφή significa diretamente alimento ou sustento nutritivo. “Seu alimento” conserva o sentido concreto e a relação possessiva do grego, sem ampliar interpretativamente para “sustento” em geral.
theological_decisions:
- issue: Possível harmonização com os relatos paralelos quanto ao equipamento permitido na viagem
  choice: Manter no texto principal a proibição “nem cajado”, conforme Mateus.
  alternative: Entender a expressão como proibição de um cajado extra ou harmonizar a redação com Marcos 6:8, que permite levar um cajado.
  rationale: O texto grego de Mateus inclui claramente ῥάβδον entre os itens proibidos. A tradução preserva essa tensão entre os relatos e registra a interpretação alternativa em nota, sem resolvê-la no texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O plural “não levem” corresponde à instrução dirigida aos discípulos no contexto. Mantêm-se os termos históricos “túnicas”, “sandálias” e “cajado”.
