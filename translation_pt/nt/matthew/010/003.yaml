  rationale: Preserva a coordenação simples da lista grega; ponto e vírgula foi usado apenas como recurso de pontuação para tornar visíveis os pares.
theological_decisions:
- issue: Identificação do último apóstolo citado no versículo
  choice: Tadeu
  alternative: Lebeu; ou Judas, filho de Tiago, nas listas de Lucas
  rationale: O texto-base grego traz Θαδδαῖος. As demais formas não foram harmonizadas no texto principal, mas são registradas em nota para preservar a evidência manuscrita e a diferença entre as listas apostólicas.
translation_notes:
  register: Português moderno, claro e digno, com formas portuguesas tradicionais dos nomes bíblicos. Os pontos e vírgulas organizam os pares da lista sem alterar sua estrutura. A nota [a] aparece após Bartolomeu, seguindo a localização fornecida na camada de consulta inglesa, embora seu conteúdo diga respeito ao nome Tadeu no fim do versículo.
