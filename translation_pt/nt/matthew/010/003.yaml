- source_word: ὁ τοῦ Ἁλφαίου
  choice: filho de Alfeu
  rationale: Explicita de modo natural em português a relação de filiação indicada pela construção genitiva grega.
- source_word: Ἁλφαίου
  choice: Alfeu
  rationale: Forma portuguesa consagrada do nome pessoal.
- source_word: Θαδδαῖος
  choice: Tadeu
  rationale: Traduz diretamente a leitura Θαδδαῖος do SBLGNT pela forma portuguesa tradicional.
- source_word: καὶ
