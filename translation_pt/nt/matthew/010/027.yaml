source:
  edition: SBLGNT
  text: ὃ λέγω ὑμῖν ἐν τῇ σκοτίᾳ, εἴπατε ἐν τῷ φωτί· καὶ ὃ εἰς τὸ οὖς ἀκούετε, κηρύξατε ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: pt
  text: O que lhes digo na escuridão[a], digam na luz; e o que ouvem ao ouvido[b], proclamem sobre os terraços.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em segredo [...] publicamente”. O grego preserva a imagem “na escuridão [...] na luz”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, o que se ouve em particular deve ser anunciado publicamente. Os “terraços” eram as coberturas planas das casas antigas e serviam como lugares elevados e visíveis para anúncios públicos.
    reason: cultural_note
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: O que eu lhes digo
  rationale: A construção substantiva «o que» é natural em português; «lhes digo» preserva o destinatário plural e o sentido de comunicação direta.
- source_word: ἐν τῇ σκοτίᾳ
  choice: na escuridão
  rationale: Mantém a imagem grega e o contraste retórico com «na luz», sem reduzi-los à paráfrase «em segredo ... publicamente».
- source_word: εἴπατε
  choice: digam
  rationale: Imperativo plural natural e direto, correspondente ao aoristo imperativo grego.
- source_word: ἐν τῷ φωτί
  choice: na luz
  rationale: Preserva a imagem antitética em relação à escuridão.
- source_word: εἰς τὸ οὖς
  choice: ao ouvido
  rationale: Expressão portuguesa natural para comunicação reservada, mantendo a imagem singular do grego sem acrescentar um possessivo ausente no texto.
- source_word: ἀκούετε
  choice: ouvem
  rationale: O presente do indicativo traduz naturalmente a forma grega e concorda com o tratamento plural «vocês».
- source_word: κηρύξατε
  choice: proclamem
  rationale: Comunica anúncio público e enfático sem restringir o verbo à pregação formal.
- source_word: ἐπὶ τῶν δωμάτων
  choice: dos terraços
  rationale: Em português, «dos terraços» expressa naturalmente o ponto elevado de onde se faz o anúncio; «terraços» representa as coberturas planas das casas antigas.
theological_decisions:
- issue: Traduzir as imagens de escuridão/luz e ouvido/terraços literalmente ou explicitar segredo/publicidade
  choice: Preservar as imagens no texto principal.
  alternative: «em segredo ... publicamente ... o que lhes é sussurrado ... anunciem em público»
  rationale: As imagens antitéticas fazem parte da retórica de Jesus e comunicam a passagem da instrução reservada para o anúncio público sem eliminar a força figurativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega-se «vocês» de modo explícito na segunda oração e «lhes» na primeira. «Dos terraços» é mais idiomático do que «sobre os terraços» e preserva a cena cultural.
