  text: ὑμῶν δὲ καὶ αἱ τρίχες τῆς κεφαλῆς πᾶσαι ἠριθμημέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/030.yaml
  text: But even the hairs of your head are all numbered[a].
translation:
  language: pt
  text: Mas até os cabelos da cabeça de vocês estão todos contados[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foram todos contados”. O perfeito passivo grego pode enfatizar uma ação concluída cujo resultado permanece.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῶν
  choice: de vocês
  rationale: O genitivo plural de segunda pessoa indica posse; “de vocês” é claro, natural e amplamente compreensível em português, sem reduzir o referente ao singular.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma leve contraposição ou transição em relação ao contexto anterior; “Mas” preserva adequadamente esse movimento discursivo.
- source_word: καὶ
  choice: até
  rationale: Aqui tem força enfática, destacando que até algo tão pequeno quanto os cabelos está incluído.
- source_word: αἱ τρίχες τῆς κεφαλῆς
  choice: os cabelos da cabeça
  rationale: Expressão portuguesa natural que conserva a imagem concreta do grego e a referência coletiva aos fios de cabelo.
- source_word: πᾶσαι
  choice: todos
  rationale: Preserva a ênfase na totalidade, concordando naturalmente com “cabelos” em português.
- source_word: ἠριθμημέναι εἰσίν
  choice: estão todos contados
  rationale: A perífrase perfeita passiva descreve um estado presente resultante de uma ação concluída. “Estão contados” conserva o valor passivo e estativo de modo idiomático.
theological_decisions:
- issue: Alcance do conhecimento e cuidado divinos sugerido pela afirmação
  choice: Manter a afirmação concreta de que todos os cabelos estão contados, sem acrescentar explicações doutrinárias.
  alternative: Explicitar na tradução o cuidado, a providência ou o controle de Deus.
  rationale: O versículo apresenta a imagem concreta; seu sentido teológico deve emergir do contexto, sem ampliação interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “De vocês” preserva o plural do original; “até” comunica naturalmente a ênfase de καί.
