  text: καὶ ἐχθροὶ τοῦ ἀνθρώπου οἱ οἰκιακοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/036.yaml
  text: And a man's enemies will be those of his own household[a].
translation:
  language: pt
  text: E os inimigos do homem serão os da sua própria casa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os inimigos de uma pessoa serão os membros da sua própria casa”. O grego emprega “homem” no masculino singular em sentido representativo.'
    reason: Alternativa lexical e esclarecimento sobre a linguagem masculina representativa.
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conjunção coordenativa simples que liga esta declaração ao contexto anterior sem acrescentar uma relação interpretativa.
- source_word: ἐχθροὶ
  choice: inimigos
  rationale: O adjetivo substantivado no plural designa pessoas hostis; “inimigos” é a equivalência natural e mantém a força do termo.
- source_word: τοῦ ἀνθρώπου
  choice: do homem
  rationale: O genitivo expressa posse. “Homem” preserva o masculino singular representativo do grego, embora ἄνθρωπος também possa designar uma pessoa em sentido geral.
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: os da sua própria casa
  rationale: Refere-se aos que pertencem à casa ou ao grupo doméstico, não ao edifício. A formulação é natural, conserva a relação doméstica e transmite a ênfase contextual de αὐτοῦ.
theological_decisions:
- issue: Linguagem masculina representativa em ἀνθρώπου
  choice: do homem
  alternative: de uma pessoa
  rationale: O grego emprega o masculino singular numa máxima representativa. O texto principal conserva essa forma sem negar sua aplicação geral; a nota registra a alternativa semanticamente possível.
- issue: Extensão de οἰκιακοί
  choice: os da sua própria casa
  alternative: os membros da sua família
  rationale: “Casa” mantém o sentido mais amplo de grupo doméstico, que pode incluir mais do que a família nuclear, evitando restringir indevidamente o referente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção proverbial preserva a concisão e o paralelismo do original; “os da sua própria casa” indica membros do grupo doméstico, não a casa física.
