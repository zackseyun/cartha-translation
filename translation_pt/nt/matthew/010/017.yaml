  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: pt
  text: Mas tenham cuidado com as pessoas,[a] pois entregarão vocês aos tribunais e açoitarão vocês em suas sinagogas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os homens”; o termo grego está no masculino plural, mas aqui se refere genericamente às pessoas.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέχετε
  choice: tenham cuidado
  rationale: O imperativo plural expressa uma advertência diante do perigo. “Tenham cuidado com” é natural em português e preserva a força cautelar sem sugerir simplesmente atenção mental.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição levemente contrastiva para a advertência, bem expressa por “Mas”.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: com as pessoas
  rationale: Com προσέχω, ἀπό indica a fonte do perigo. “Pessoas” comunica o sentido humano genérico de ἄνθρωποι sem restringi-lo ao sexo masculino.
- source_word: παραδώσουσιν
  choice: entregarão
  rationale: O verbo descreve a entrega de alguém às autoridades; “entregarão” preserva o sentido jurídico sem acrescentar a ideia específica de traição.
- source_word: συνέδρια
  choice: tribunais
  rationale: O plural designa conselhos locais com função judicial. “Tribunais” torna essa função clara ao leitor moderno sem identificar indevidamente cada órgão com o Sinédrio de Jerusalém.
- source_word: συναγωγαῖς
  choice: sinagogas
  rationale: É o termo corrente e transparente para os locais e comunidades judaicas mencionados.
- source_word: αὐτῶν
  choice: delas
  rationale: Retoma naturalmente “as pessoas” e conserva a associação expressa pelo pronome grego, embora em português a formulação possa soar marcada.
- source_word: μαστιγώσουσιν
  choice: açoitarão
  rationale: Expressa punição corporal por golpes, com tom sério e judicial; é digno e amplamente compreensível em contexto bíblico.
theological_decisions:
- issue: Referência de gênero em ἀνθρώπων
  choice: pessoas
  alternative: homens
  rationale: 'Embora o substantivo grego esteja no masculino plural, seu sentido aqui é genérico: seres humanos que perseguirão os discípulos, não especificamente indivíduos do sexo masculino.'
- issue: Natureza dos συνέδρια
  choice: tribunais
  alternative: conselhos
  rationale: O contexto de entrega e punição destaca a função judicial desses órgãos locais. “Tribunais” evita impor a referência técnica ao grande Sinédrio, embora “conselhos” preserve mais diretamente a forma institucional.
translation_notes:
  register: Português moderno, digno e de leitura natural, com uso de “vocês” para o plural. A repetição de “vocês” mantém explícitos os dois objetos do texto grego. “Açoitarão” preserva a gravidade judicial sem recorrer ao arcaísmo “flagelarão”.
