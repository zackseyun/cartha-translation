id: MAT.17.19
reference: Matthew 17:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
translation:
  language: pt
  text: 'Então os discípulos se aproximaram de Jesus em particular e disseram: “Por que nós não conseguimos expulsá-lo[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome pode se referir ao demônio ou ao menino.
    reason: Preservar a ambiguidade do referente de αὐτό.
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca naturalmente, em português, a sequência temporal da narrativa.
- source_word: προσελθόντες
  choice: se aproximaram
  rationale: Expressa o movimento em direção a Jesus e converte com naturalidade o particípio aoristo grego em verbo finito.
- source_word: οἱ μαθηταὶ
  choice: os discípulos
  rationale: É a designação corrente e contextualmente adequada para os seguidores de Jesus nos Evangelhos.
- source_word: τῷ Ἰησοῦ
  choice: de Jesus
  rationale: Complementa de modo idiomático o verbo pronominal português “aproximar-se de”.
- source_word: κατ’ ἰδίαν
  choice: em particular
  rationale: Expressão atual e natural para uma conversa sem a presença dos demais.
- source_word: εἶπον
  choice: disseram
  rationale: Mantém o sentido básico de λέγω; a frase seguinte já deixa claro que se trata de uma pergunta.
- source_word: Διὰ τί
  choice: Por que
  rationale: Forma interrogativa direta e comum para pedir a razão de algo.
- source_word: ἡμεῖς
  choice: nós
  rationale: O pronome expresso preserva a ênfase do pronome grego explícito, contrastando os discípulos com Jesus.
- source_word: οὐκ ἠδυνήθημεν
  choice: não conseguimos
  rationale: Comunica de maneira natural a incapacidade verificada naquela ocasião, correspondente ao aoristo de δύναμαι.
- source_word: ἐκβαλεῖν
  choice: expulsá-lo
  rationale: “Expulsar” é corrente no contexto de exorcismo e conserva a ideia de fazer sair à força.
- source_word: αὐτό
  choice: -lo
  rationale: O pronome objeto masculino em português pode apontar tanto para o demônio quanto para o menino, preservando a ambiguidade contextual do grego.
theological_decisions:
- issue: Referente de αὐτό no contexto do exorcismo
  choice: Preservar a ambiguidade com “expulsá-lo”.
  alternative: Especificar “expulsar o demônio” ou entender o pronome como referência exclusiva ao menino.
  rationale: Embora o contexto favoreça o demônio como objeto de “expulsar”, a forma pronominal portuguesa permite manter aberta a referência ao demônio ou ao menino sem impor uma interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com construção de ampla compreensão internacional e leitura natural no Brasil. “Em particular” evita rigidez, e o “nós” explícito conserva a leve ênfase do original.
