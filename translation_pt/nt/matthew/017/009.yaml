  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων· Μηδενὶ εἴπητε τὸ ὅραμα ἕως οὗ ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ⸀ἐγερθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: pt
  text: 'Enquanto desciam do monte, Jesus lhes ordenou: “Não contem a visão[a] a ninguém, até que o Filho do Homem seja ressuscitado dos mortos[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquilo que vocês viram”. O grego diz literalmente “a visão”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, mais literalmente: “dentre os mortos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: Enquanto desciam do monte
  rationale: A construção absoluta no genitivo indica uma ação em curso e simultânea. “Enquanto desciam” preserva esse valor temporal em português natural.
- source_word: ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: 'Jesus lhes ordenou:'
  rationale: “Ordenou” comunica a força de ἐνετείλατο. Os dois-pontos introduzem naturalmente a fala e evitam o pouco idiomático “ordenou-lhes, dizendo”, sem perda de conteúdo.
- source_word: Μηδενὶ εἴπητε
  choice: Não contem a ninguém
  rationale: A proibição é direta e enfática. Esta formulação é corrente, clara e acomoda naturalmente o objeto que vem em seguida.
- source_word: τὸ ὅραμα
  choice: a visão
  rationale: “Visão” traduz diretamente ὅραμα e conserva sua possível nuance revelatória, sem reduzi-la apenas ao ato físico de ver.
- source_word: ἕως οὗ
  choice: até que
  rationale: Expressa de modo idiomático o limite temporal da proibição.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a autodesignação de Jesus e suas ressonâncias bíblicas, sem paráfrase interpretativa.
- source_word: ἐκ νεκρῶν
  choice: dos mortos
  rationale: É a forma portuguesa corrente para a ressurreição a partir do domínio ou conjunto dos mortos; a alternativa mais literal é registrada em nota.
- source_word: ἐγερθῇ
  choice: seja ressuscitado
  rationale: A forma passiva preserva a voz gramatical do grego. Em português, “ressuscitado” comunica com clareza o sentido contextual de ἐγείρω, evitando a ambiguidade física de “levantado”.
theological_decisions:
- issue: Formulação e voz da ressurreição
  choice: seja ressuscitado dos mortos
  alternative: ressuscite dos mortos
  rationale: O grego emprega uma forma passiva. A tradução mantém essa voz e não explicita o agente, preservando a ressonância de ação divina sem dizer mais do que o texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe da introdução da fala foi naturalizada por meio de dois-pontos, enquanto os termos teologicamente relevantes e a passiva da ressurreição foram preservados. Os marcadores foram posicionados junto às expressões às quais as notas realmente se referem.
