id: MAT.17.15
reference: Matthew 17:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ἐλέησόν μου τὸν υἱόν, ὅτι σεληνιάζεται καὶ κακῶς ⸀πάσχει, πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
translation:
  language: pt
  text: 'e disse: “Senhor, tem misericórdia do meu filho, pois ele tem convulsões[a] e sofre terrivelmente; muitas vezes cai no fogo e muitas vezes na água.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “é lunático”; literalmente, “é afetado pela lua”. O termo grego reflete uma maneira antiga de descrever uma condição semelhante a crises convulsivas.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: e disse
  rationale: O particípio presente liga esta fala à ação do contexto anterior. Em português narrativo, “e disse” expressa essa ligação de modo mais natural do que o literal “e dizendo”.
- source_word: Κύριε
  choice: Senhor
  rationale: Vocativo respeitoso dirigido a Jesus; “Senhor” preserva o uso corrente de κύριος e a dignidade do apelo.
- source_word: ἐλέησόν
  choice: tem misericórdia de
  rationale: Imperativo aoristo de ἐλεάω, formulado como um apelo urgente por compaixão e ajuda. A expressão é natural e consagrada em português.
- source_word: μου τὸν υἱόν
  choice: meu filho
  rationale: υἱός designa especificamente o filho do sexo masculino, e μου indica a relação possessiva.
- source_word: σεληνιάζεται
  choice: tem convulsões
  rationale: O verbo está ligado literalmente à lua, mas no uso antigo descreve uma aflição semelhante a crises convulsivas. “Tem convulsões” comunica o fenômeno observado sem impor um diagnóstico médico moderno nem afirmar causalidade lunar.
- source_word: κακῶς πάσχει
  choice: sofre terrivelmente
  rationale: κακῶς intensifica πάσχει; a formulação transmite sofrimento grave em português claro e atual.
- source_word: πολλάκις
  choice: muitas vezes
  rationale: Reproduz o sentido de ocorrência repetida e conserva a repetição enfática do termo grego nas duas orações.
- source_word: πίπτει εἰς τὸ πῦρ
  choice: cai no fogo
  rationale: Tradução direta e idiomática do movimento para dentro do fogo.
- source_word: εἰς τὸ ὕδωρ
  choice: na água
  rationale: Mantém o paralelismo com “no fogo” em português natural.
theological_decisions:
- issue: Sentido de σεληνιάζεται no contexto de cura e exorcismo
  choice: Traduzir fenomenologicamente como “tem convulsões”
  alternative: “é epiléptico”, “é lunático” ou, literalmente, “é afetado pela lua”
  rationale: A fala do pai descreve a condição do filho sem oferecer neste versículo um diagnóstico médico técnico nem explicar sua causa. A opção preserva a observação dos sintomas e evita resolver indevidamente a tensão entre linguagem antiga, condição física e o contexto narrativo mais amplo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe narrativa foi naturalizada em “e disse”, enquanto a repetição de “muitas vezes” foi mantida para preservar a ênfase do original.
