base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/014.yaml
  text: And when they came to the crowd[a], a man came up to him, kneeling before him[b],
translation:
  language: pt
  text: E, quando chegaram à multidão, um homem se aproximou de Jesus, ajoelhando-se diante dele,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Quando
  rationale: A conexão com a narrativa anterior é expressa naturalmente pela oração temporal; uma conjunção adicional como “E” seria possível, mas desnecessária em português corrente.
- source_word: ἐλθόντων
  choice: eles chegaram
  rationale: O particípio aoristo no genitivo absoluto indica a circunstância temporal e tem sujeito plural implícito, recuperado do contexto.
- source_word: πρὸς τὸν ὄχλον
  choice: junto à multidão
  rationale: Expressa a chegada ao lugar onde estava o grupo; “multidão” é corrente, digna e corresponde ao sentido de ὄχλος.
- source_word: προσῆλθεν
  choice: se aproximou
  rationale: Traduz diretamente o movimento em direção a alguém indicado por προσέρχομαι.
- source_word: αὐτῷ
  choice: de Jesus
  rationale: Explicita o referente do pronome para evitar em português a possível leitura de que o homem se aproximou da multidão.
- source_word: ἄνθρωπος
  choice: um homem
  rationale: Neste contexto, o substantivo designa um indivíduo adulto do sexo masculino.
- source_word: γονυπετῶν αὐτὸν
  choice: se ajoelhou diante dele
  rationale: Comunica de modo natural a ação corporal de pôr-se de joelhos perante Jesus, sem acrescentar uma interpretação explícita de adoração.
theological_decisions:
- issue: Possível caráter reverencial de γονυπετῶν
  choice: se ajoelhou diante dele
  alternative: prostrou-se em adoração diante dele
  rationale: O texto descreve claramente a postura de ajoelhar-se, mas não define por si só toda a intenção teológica do gesto; a tradução preserva essa abertura.
- issue: Referência masculina de ἄνθρωπος
  choice: um homem
  alternative: uma pessoa
  rationale: A referência narrativa é a um indivíduo masculino específico; “um homem” mantém essa informação sem formular uma afirmação mais ampla sobre humanidade ou gênero.
translation_notes:
  register: Português moderno, natural e digno, de ampla compreensão internacional e com boa legibilidade brasileira. A ordem foi ajustada para clareza referencial, e a vírgula final foi preservada porque o versículo continua no seguinte.
