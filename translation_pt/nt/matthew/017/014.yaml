  source_fidelity: A tradução transmite adequadamente a chegada do grupo, a aproximação de um homem a Jesus e o gesto de ajoelhar-se. Contudo, «Quando» absorve e deixa sem expressão a conjunção inicial Καὶ; uma formulação que preserve «E» é preferível em uma tradução de equivalência ótima. Além disso, o particípio presente γονυπετῶν é mais bem refletido por «ajoelhando-se», que mantém sua relação concomitante com a aproximação.
  naturalness: «E, quando chegaram à multidão» e «um homem se aproximou de Jesus, ajoelhando-se diante dele» são naturais, claros e dignos em português moderno de ampla compreensão. A vírgula final é apropriada, pois a frase prossegue no versículo seguinte.
  terminology: «multidão», «homem», «Jesus» e «ajoelhando-se diante dele» são escolhas terminológicas adequadas. A explicitação de «Jesus» torna inequívoco o referente de αὐτῷ sem alterar o sentido.
