id: MAT.17.27
reference: Matthew 17:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: pt
  text: Mas, para não os ofendermos[a], vá ao mar, lance o anzol e pegue o primeiro peixe que subir. Ao abrir a boca dele, você encontrará um estáter[b]. Pegue essa moeda e entregue-a a eles por mim e por você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para não os escandalizarmos” ou “para não lhes darmos motivo de tropeço”.'
    reason: lexical_alternative
  - marker: b
    text: O estáter era uma moeda equivalente a cerca de quatro dracmas, valor suficiente para pagar o imposto do templo por duas pessoas.
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: ofendermos
  rationale: Neste contexto, indica causar escândalo ou dar motivo de ofensa desnecessária aos cobradores, não necessariamente levar alguém ao pecado. A nota preserva a alternativa mais literal.
- source_word: θάλασσαν
  choice: mar
  rationale: Preserva o termo grego, tradicionalmente aplicado ao mar da Galileia, embora geograficamente seja um lago.
- source_word: ἄγκιστρον
  choice: anzol
  rationale: É o equivalente português específico, claro e natural para o instrumento de pesca mencionado.
- source_word: ἀναβάντα πρῶτον ἰχθὺν
  choice: o primeiro peixe que subir
  rationale: Reproduz de modo natural a referência ao primeiro peixe trazido para cima pela pesca, sem acrescentar detalhes não expressos.
- source_word: ἆρον
  choice: pegue
  rationale: No encadeamento dos imperativos, comunica naturalmente tomar o peixe capturado.
- source_word: στατῆρα
  choice: um estáter
  rationale: Mantém o nome específico da moeda grega; seu valor aproximado e sua suficiência para o imposto de duas pessoas são explicados em nota.
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: por mim e por você
  rationale: Expressa de forma idiomática o pagamento em favor de ambos, preservando o valor representativo de ἀντί.
- source_word: πορευθεὶς
  choice: vá
  rationale: O particípio introduz uma ação anterior associada aos imperativos; em português, o imperativo simples é natural e fiel à função discursiva.
- source_word: δὸς αὐτοῖς
  choice: entregue-a a eles
  rationale: O pronome retoma explicitamente a moeda, e 'entregue' comunica com clareza a ação no contexto do pagamento.
theological_decisions:
- issue: Sentido de σκανδαλίζω em relação ao pagamento do imposto do templo
  choice: Jesus manda pagar para evitar dar motivo de ofensa aos cobradores, sem desfazer explicitamente a afirmação anterior de que os filhos são livres.
  alternative: Entender que Jesus reconhece obrigação absoluta de pagar, ou que a ação serve apenas como demonstração milagrosa.
  rationale: A oração final apresenta o pagamento como concessão prática para não causar escândalo. A tradução mantém a tensão com o argumento dos versículos anteriores, sem impor uma conclusão doutrinária.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com tratamento por “você” para leitura natural no Brasil. A estrutura imperativa permanece direta. Os marcadores foram corrigidos em relação à camada inglesa: a nota lexical acompanha “ofendermos” [a], e a nota monetária acompanha “estáter” [b].'
