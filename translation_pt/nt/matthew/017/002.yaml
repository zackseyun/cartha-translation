  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν, καὶ ἔλαμψεν τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, τὰ δὲ ἱμάτια αὐτοῦ ⸀ἐγένετο λευκὰ ὡς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/002.yaml
  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: pt
  text: E ele foi transfigurado diante deles[a]; seu rosto brilhou como o sol, e suas roupas ficaram brancas como a luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi transformado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετεμορφώθη
  choice: foi transfigurado
  rationale: O aoristo passivo de μεταμορφόω descreve uma transformação visível. “Foi transfigurado” é corrente no contexto bíblico e preserva o caráter marcante do acontecimento; a alternativa mais ampla é registrada em nota.
- source_word: ἔμπροσθεν αὐτῶν
  choice: diante deles
  rationale: Expressão espacial natural em português, indicando que o acontecimento se deu na presença dos discípulos.
- source_word: ἔλαμψεν
  choice: brilhou
  rationale: Equivalente direto e idiomático de λάμπω, que denota emitir luz ou resplandecer.
- source_word: πρόσωπον
  choice: rosto
  rationale: Neste contexto, refere-se diretamente ao rosto físico de Jesus.
- source_word: ὡς ὁ ἥλιος
  choice: como o sol
  rationale: Preserva com naturalidade a comparação introduzida por ὡς.
- source_word: ἱμάτια
  choice: roupas
  rationale: Termo moderno, claro e abrangente para peças de vestuário, sem especificar indevidamente mantos ou túnicas.
- source_word: ἐγένετο λευκὰ
  choice: ficaram brancas
  rationale: Expressa de modo natural a mudança de estado; a concordância portuguesa segue o sujeito plural “roupas”.
- source_word: ὡς τὸ φῶς
  choice: como a luz
  rationale: Mantém tanto a comparação quanto o artigo de τὸ φῶς, sem transformar a imagem em simples intensificador de brancura.
theological_decisions:
- issue: Designação do acontecimento da transfiguração
  choice: foi transfigurado
  alternative: foi transformado
  rationale: A escolha expressa a manifestação visível descrita no contexto e mantém o uso cristão histórico, sem acrescentar uma explicação metafísica que o versículo não oferece.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula organiza as duas descrições coordenadas sem apagar a repetição enfática do grego.
