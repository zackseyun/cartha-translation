  text: καὶ ⸂προσῆλθεν ὁ Ἰησοῦς καὶ ἁψάμενος αὐτῶν⸃ εἶπεν· Ἐγέρθητε καὶ μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/007.yaml
  text: And Jesus came near and touched them and said[a], “Get up[c][b], and do not be afraid.”
translation:
  language: pt
  text: 'E Jesus se aproximou[a], tocou neles e disse: “Levantem-se[b] e não tenham medo[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chegou perto”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Ergam-se”; a ordem se refere a se levantarem da posição em que haviam caído.
    reason: lexical_alternative
  - marker: c
    text: Ou “não temam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθεν
  choice: se aproximou
  rationale: O verbo προσέρχομαι expressa movimento em direção a alguém. “Se aproximou” é natural em português e preserva esse sentido sem especificar além do grego.
- source_word: ἁψάμενος αὐτῶν
  choice: tocou neles
  rationale: O particípio aoristo médio de ἅπτω com genitivo significa “tocar”. A coordenação verbal soa natural em português e evita acrescentar a ideia mais específica de impor ou colocar a mão.
- source_word: εἶπεν
  choice: disse
  rationale: É a tradução direta e não interpretativa do verbo comum λέγω neste contexto.
- source_word: Ἐγέρθητε
  choice: Levantem-se
  rationale: A ordem chama os discípulos a se erguerem da posição prostrada descrita no contexto. “Levantem-se” é claro e atual, sem determinar de modo excessivo a postura final.
- source_word: μὴ φοβεῖσθε
  choice: não tenham medo
  rationale: Expressa de modo idiomático a proibição ligada a φοβέομαι. Não se força a possível nuance de cessar uma ação já em curso.
- source_word: καὶ
  choice: E / e
  rationale: A repetição de καί encadeia diretamente as ações. A conjunção “e” conserva o fluxo narrativo sem acrescentar uma relação temporal ou causal.
theological_decisions:
- issue: Forma de traduzir a ordem tranquilizadora de Jesus sem ampliar sua nuance pastoral
  choice: Levantem-se e não tenham medo
  alternative: Ergam-se e não temam
  rationale: A tradução mantém juntas a ordem física e a tranquilização, sem acrescentar explicações doutrinárias nem intensificar o aspecto verbal para “parem de ter medo”.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A colocação “tocou neles” é idiomática e fiel ao genitivo grego; o plural de tratamento é expresso pela forma verbal, sem pronome regional.
