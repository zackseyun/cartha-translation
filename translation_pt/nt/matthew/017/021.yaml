  text: Τοῦτο δὲ τὸ γένος οὐκ ἐκπορεύεται εἰ μὴ ἐν προσευχῇ καὶ νηστείᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/021.yaml
  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: pt
  text: Mas[a] esse tipo não sai senão por meio de oração e jejum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo não aparece nos manuscritos gregos mais antigos, incluindo o Sinaítico e o Vaticano, do século IV, nem nas antigas traduções siríacas e coptas. Contudo, está presente na tradição majoritária bizantina, na tradição latina e na maioria dos manuscritos siríacos. É provável que tenha sido acrescentado por copistas posteriores para harmonizar esta passagem com Marcos 9:29.
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: tipo
  rationale: Neste contexto, indica uma categoria ou classe de demônio. “Tipo” é natural e claro em português, sem introduzir os sentidos de raça ou família que a palavra pode ter em outros contextos.
- source_word: ἐκπορεύεται
  choice: sai
  rationale: Refere-se à saída do demônio da pessoa afligida. “Sai” preserva de modo direto e natural o movimento expresso pelo verbo grego.
- source_word: εἰ μὴ
  choice: senão
  rationale: 'A locução tem valor exclusivo: indica que esse tipo não sai por nenhum outro meio além do mencionado.'
- source_word: ἐν προσευχῇ καὶ νηστείᾳ
  choice: por meio de oração e jejum
  rationale: O uso instrumental de ἐν é expresso naturalmente por “por meio de”, mantendo tanto “oração” quanto “jejum” conforme o texto grego desta edição.
theological_decisions:
- issue: Referente implícito de “esse tipo”
  choice: Manter apenas “esse tipo”, sem explicitar “de demônio”.
  alternative: “Esse tipo de demônio”
  rationale: Embora o contexto indique uma categoria de demônio, o grego deixa o substantivo implícito. A tradução preserva essa concisão e não resolve além do necessário o referente contextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Senão por meio de” evita uma formulação excessivamente literal e comunica com precisão a exclusividade do original. O marcador [a] aparece no texto principal.
