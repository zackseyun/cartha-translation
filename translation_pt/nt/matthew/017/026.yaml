source:
  edition: SBLGNT
  text: ⸂εἰπόντος δέ⸃· Ἀπὸ τῶν ἀλλοτρίων, ἔφη αὐτῷ ὁ Ἰησοῦς· Ἄρα γε ἐλεύθεροί εἰσιν οἱ υἱοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
translation:
  language: pt
  text: 'Quando ele disse: “Dos que não são da família”[a], Jesus lhe disse: “Logo, os filhos estão livres”[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Dos estrangeiros” ou “Dos outros”. O grego contrapõe os que não pertencem à família do governante aos próprios filhos dele.
    reason: lexical_alternative
  - marker: b
    text: Ou “estão isentos”. O grego diz mais literalmente “estão livres”, o que, neste contexto, implica isenção do imposto.
    reason: lexical_alternative
  - marker: c
    text: Ou “os filhos homens”. Embora “filhos” possa, em português, incluir filhas conforme o contexto, o grego diz “filhos” no masculino plural.
    reason: lexical_clarification
lexical_decisions:
- source_word: εἰπόντος δέ
  choice: Quando ele respondeu
  rationale: O genitivo absoluto introduz a resposta de Pedro à pergunta anterior. “Quando ele respondeu” expressa naturalmente a relação temporal e o contexto discursivo; o conectivo δέ não precisa ser traduzido separadamente.
- source_word: ἀπὸ τῶν ἀλλοτρίων
  choice: Dos que não são da família
  rationale: ἀλλότριοι designa aqui os que não pertencem à casa do governante, em contraste com seus filhos. A formulação evita a possível conotação étnica ou nacional de “estrangeiros” e explicita apenas o contraste relacional presente no contexto.
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jesus lhe disse
  rationale: Tradução narrativa direta e natural de φημί com o pronome dativo αὐτῷ.
- source_word: Ἄρα γε
  choice: Logo
  rationale: A combinação de partículas introduz uma conclusão tirada da resposta de Pedro. “Logo” marca com clareza a inferência sem excesso de formalidade.
- source_word: ἐλεύθεροί
  choice: estão livres
  rationale: Preserva o sentido lexical amplo de “livres”, enquanto o contexto indica especificamente liberdade da obrigação tributária. “Isentos” seria mais explícito, mas estreitaria a afirmação.
- source_word: οἱ υἱοί
  choice: os filhos
  rationale: υἱοί é masculino plural e, na analogia, se refere especificamente aos filhos do rei. “Os filhos” é natural em português e mantém a imagem familiar e jurídica.
theological_decisions:
- issue: Sentido de οἱ υἱοί na analogia sobre a família do rei e a tributação
  choice: os filhos
  alternative: as crianças; os descendentes
  rationale: O grego diz especificamente “filhos” no masculino plural, e a analogia imediata contrapõe os filhos do governante aos que não pertencem à família. A tradução preserva essa linguagem de filiação sem ampliar nem restringir teologicamente sua referência.
- issue: Alcance de ἐλεύθεροί no contexto do imposto
  choice: estão livres
  alternative: estão isentos
  rationale: “Livres” mantém a formulação mais ampla do original e sua possível ressonância teológica, enquanto o contexto deixa claro que a consequência imediata é a isenção do tributo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem foi levemente ajustada para fluidez narrativa. “Dos que não são da família” preserva o contraste doméstico sem sugerir primariamente nacionalidade, e “estão livres” conserva a amplitude deliberada do original.
