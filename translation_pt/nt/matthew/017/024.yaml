reference: Matthew 17:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: pt
  text: 'Quando eles chegaram a Cafarnaum, os cobradores do imposto de duas dracmas[a] se aproximaram de Pedro e perguntaram: “O mestre de vocês não paga o imposto de duas dracmas?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, “as duas dracmas”; isto é, o tributo de duas dracmas associado ao templo.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: Quando eles chegaram
  rationale: O genitivo absoluto expressa uma circunstância temporal. A formulação é natural em português e preserva esse valor; δέ funciona aqui como transição leve e não exige uma conjunção explícita.
- source_word: Καφαρναοὺμ
  choice: Cafarnaum
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: os cobradores do imposto de duas dracmas
  rationale: O particípio identifica pessoas por sua função. Embora a expressão grega seja literalmente próxima de “os que recebiam as duas dracmas”, o contexto indica a cobrança de um tributo; “cobradores” comunica isso de modo claro e natural.
- source_word: προσῆλθον ... τῷ Πέτρῳ
  choice: se aproximaram de Pedro
  rationale: Expressa com naturalidade o movimento em direção a Pedro indicado pelo verbo e pelo dativo.
- source_word: δίδραχμα
  choice: imposto de duas dracmas
  rationale: O termo designa uma quantia de duas dracmas e, neste contexto, o pagamento cobrado. A tradução explicita o sentido fiscal sem substituir a unidade monetária antiga.
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: O mestre de vocês
  rationale: “Mestre” é a forma corrente e digna para o título διδάσκαλος nos Evangelhos; “de vocês” transmite claramente o plural de ὑμῶν.
- source_word: οὐ τελεῖ
  choice: não paga
  rationale: Neste contexto, τελέω significa pagar ou satisfazer uma obrigação. A pergunta negativa do grego é preservada sem explicitar à força a resposta esperada.
theological_decisions:
- issue: Identificação de δίδραχμα como tributo
  choice: imposto de duas dracmas no texto principal
  alternative: duas dracmas; didracma
  rationale: A passagem trata de uma cobrança, não apenas de moedas. “Imposto” torna claro o sentido contextual, enquanto a nota identifica prudentemente sua associação com o templo.
- issue: Força pragmática da pergunta negativa
  choice: preservar “não paga?”
  alternative: “paga, não é?” ou uma pergunta positiva
  rationale: A forma grega provavelmente espera uma resposta afirmativa, mas a pergunta negativa em português preserva tanto sua forma quanto sua nuance sem resolver excessivamente o tom dos cobradores.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A antiga unidade monetária foi mantida, e sua função contextual foi esclarecida sem sobrecarregar o versículo.
