id: MAT.17.16
reference: Matthew 17:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ προσήνεγκα αὐτὸν τοῖς μαθηταῖς σου, καὶ οὐκ ἠδυνήθησαν αὐτὸν θεραπεῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: pt
  text: E eu o trouxe aos teus discípulos, e eles não puderam curá-lo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não foram capazes de curá-lo”.'
    reason: Alternativa lexical que explicita mais literalmente a ideia de capacidade em οὐκ ἠδυνήθησαν.
lexical_decisions:
- source_word: προσήνεγκα
  choice: trouxe
  rationale: O aoristo de προσφέρω, com objeto direto e destinatário no dativo, indica aqui levar alguém até outra pessoa. “Trouxe” é natural e direto em português.
- source_word: μαθηταῖς σου
  choice: teus discípulos
  rationale: μαθητής designa os seguidores e alunos de um mestre; “discípulos” é a expressão clara e consagrada neste contexto dos Evangelhos.
- source_word: οὐκ ἠδυνήθησαν
  choice: não puderam
  rationale: δύναμαι expressa capacidade ou possibilidade. “Não puderam” reproduz de modo natural a incapacidade declarada, sem explicar sua causa.
- source_word: θεραπεῦσαι
  choice: curá-lo
  rationale: θεραπεύω refere-se aqui à cura do menino aflito. “Curar” é a escolha mais natural no contexto e o pronome retoma claramente o filho mencionado.
- source_word: καὶ ... καὶ
  choice: E ... e
  rationale: A repetição de καί coordena de maneira simples as duas declarações do pai. Mantê-la evita acrescentar um contraste explícito que o grego não marca.
theological_decisions:
- issue: Natureza do fracasso dos discípulos
  choice: Declarar apenas que eles não puderam curá-lo.
  alternative: Explicitar que não conseguiram expulsar o demônio ou que fracassaram por falta de fé.
  rationale: O versículo afirma somente a incapacidade de curar. As explicações presentes no contexto não devem ser introduzidas nesta frase.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação pronominal em “o trouxe” e “curá-lo” é natural no registro bíblico contemporâneo sem soar arcaica.
