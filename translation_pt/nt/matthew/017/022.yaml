id: MAT.17.22
reference: Matthew 17:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
translation:
  language: pt
  text: 'Enquanto se reuniam na Galileia[a], Jesus lhes disse: “O Filho do Homem está para ser entregue[b] nas mãos dos homens[c],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Enquanto estavam reunidos na Galileia”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “está prestes a ser entregue”.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, seres humanos; também se pode traduzir por “pessoas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συστρεφομένων
  choice: se reuniam
  rationale: O particípio genitivo absoluto descreve o grupo reunindo-se ou permanecendo junto. “Se reuniam” conserva o sentido coletivo e soa natural em português, sem especificar um deslocamento que o grego não exige.
- source_word: δὲ
  choice: Enquanto
  rationale: Em conjunto com a construção participial, introduz a circunstância temporal ligada à fala de Jesus; “Enquanto” produz uma ligação clara e natural em português.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: na Galileia
  rationale: Tradução locativa direta e idiomática.
- source_word: εἶπεν αὐτοῖς
  choice: Jesus lhes disse
  rationale: Reproduz de modo natural o verbo de fala com objeto indireto, mantendo Jesus como sujeito explícito.
- source_word: Μέλλει
  choice: está para
  rationale: Expressa ação iminente ou prestes a acontecer, sem acrescentar uma noção mais forte de destino inevitável.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: O Filho do Homem
  rationale: Forma tradicional e formalmente próxima do grego, preservando a autodesignação de Jesus e suas ressonâncias intertextuais.
- source_word: παραδίδοσθαι
  choice: ser entregue
  rationale: Mantém a voz passiva e a amplitude do verbo, sem restringir o sentido à traição de Judas ou apenas a um ato judicial.
- source_word: εἰς χεῖρας
  choice: nas mãos de
  rationale: Conserva a metáfora grega, plenamente compreensível e corrente em português.
- source_word: ἀνθρώπων
  choice: homens
  rationale: Preserva a repetição retórica entre “Filho do Homem” e “mãos dos homens”, ao mesmo tempo que a nota registra a possibilidade contextual mais inclusiva de “seres humanos”.
theological_decisions:
- issue: Tradução de ὁ υἱὸς τοῦ ἀνθρώπου
  choice: O Filho do Homem
  alternative: O Ser Humano
  rationale: “O Filho do Homem” preserva a expressão grega estabelecida e sua densidade bíblica e teológica; a alternativa é mais interpretativa e enfraquece essas ressonâncias.
- issue: Nuance de παραδίδοσθαι na predição da paixão
  choice: ser entregue
  alternative: ser passado às mãos de; ser traído
  rationale: “Ser entregue” conserva a passiva e deixa aberta a sobreposição entre agentes humanos e a dimensão teológica do acontecimento. “Ser traído” estreitaria indevidamente o referente ao ato de Judas.
- issue: Alcance de ἀνθρώπων
  choice: homens
  alternative: seres humanos; pessoas
  rationale: A escolha principal mantém o contraste verbal com “Filho do Homem”. A nota preserva a leitura genérica do substantivo plural sem resolver silenciosamente sua abrangência.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural tanto no Brasil quanto em outros contextos lusófonos. “Galileia” segue a ortografia brasileira contemporânea. A formulação mantém a metáfora “nas mãos”, a voz passiva e o contraste entre “Filho do Homem” e “homens”, sem impor uma interpretação denominacional.
