  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: pt
  text: 'Então Pedro respondeu e disse a Jesus: “Senhor, é bom estarmos aqui. Se quiseres, farei aqui três abrigos[a]: um para ti, um para Moisés e um para Elias.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tendas”, “cabanas” ou “tabernáculos”; do grego skēnás.
    reason: Preserva alternativas lexicais relevantes para σκηνάς, inclusive possíveis associações religiosas ou festivas, sem impô-las ao texto principal.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Então Pedro tomou a palavra e disse
  rationale: A fórmula grega introduz a intervenção de Pedro. “Tomou a palavra e disse” preserva essa função discursiva com naturalidade, sem sugerir necessariamente que Jesus lhe tivesse feito uma pergunta.
- source_word: Κύριε
  choice: Senhor
  rationale: Mantém tanto o respeito da forma de tratamento quanto seu possível peso cristológico.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: é bom estarmos aqui
  rationale: Reproduz de modo claro e natural a construção infinitiva grega.
- source_word: εἰ θέλεις
  choice: Se quiseres
  rationale: Expressa desejo ou vontade e conserva a forma direta e respeitosa com que Pedro se dirige a Jesus.
- source_word: ποιήσω
  choice: farei
  rationale: Traduz diretamente o futuro indicativo como uma oferta de ação.
- source_word: σκηνάς
  choice: abrigos
  rationale: Termo moderno e abrangente para estruturas temporárias; evita impor no texto principal uma associação específica com a Festa das Cabanas, preservando alternativas na nota.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: um para ti, um para Moisés e um para Elias
  rationale: Mantém a repetição distributiva de μίαν para cada pessoa.
- source_word: ὧδε
  choice: aqui
  rationale: As duas ocorrências são mantidas, acompanhando a repetição do grego.
theological_decisions:
- issue: Sentido de κύριος ao dirigir-se a Jesus
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” preserva a amplitude semântica do título, incluindo respeito e possível significado cristológico, sem reduzi-lo a mera cortesia.
- issue: Possível associação de σκηνάς com a Festa das Cabanas
  choice: abrigos
  alternative: tendas, cabanas ou tabernáculos
  rationale: O versículo não identifica explicitamente as estruturas com a festa. O texto principal permanece neutro, enquanto a nota conserva as opções que podem evocar essa associação intertextual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A segunda pessoa em “quiseres” e “ti” mantém coerência interna e um tom respeitoso sem arcaísmo excessivo.
