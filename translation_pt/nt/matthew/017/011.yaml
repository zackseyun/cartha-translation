base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/011.yaml
  text: He answered[a], “Elijah indeed is coming and will restore all things.”
translation:
  language: pt
  text: 'Ele respondeu: “Elias de fato vem e restaurará todas as coisas.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “está para vir e restaurará todas as coisas”. O verbo grego traduzido como “vem” está no presente, mas aqui tem sentido orientado para o futuro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ele respondeu
  rationale: A construção com particípio e verbo finito tem influência semítica. Em português natural, “Ele respondeu” preserva o sentido responsivo sem redundância.
- source_word: Ἠλίας
  choice: Elias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: μέν
  choice: de fato
  rationale: Marca ênfase e antecipa o contraste desenvolvido no versículo seguinte, sem tornar a frase artificial.
- source_word: ἔρχεται
  choice: vem
  rationale: Embora seja presente na forma, tem orientação futura no contexto. O presente “vem” mantém a vivacidade e pode expressar a vinda esperada em português.
- source_word: ἀποκαταστήσει
  choice: restaurará
  rationale: O futuro ativo indica ação futura; “restaurará” traduz diretamente o verbo sem definir além do texto a natureza da restauração.
- source_word: πάντα
  choice: todas as coisas
  rationale: Preserva o caráter amplo e abrangente do neutro plural sem acrescentar objetos ou destinatários não especificados.
theological_decisions:
- issue: Natureza e alcance da obra restauradora de Elias
  choice: restaurará todas as coisas
  alternative: porá tudo em ordem
  rationale: O grego apresenta a restauração de modo abrangente, mas não define neste versículo seu alcance exato. A formulação escolhida preserva essa amplitude e a tensão teológica sem impor um esquema interpretativo.
translation_notes:
  register: Português moderno, digno e de leitura natural, com vocabulário amplamente compreensível no Brasil e em outras comunidades lusófonas. A ordem foi levemente naturalizada, preservando a ênfase de μέν e a amplitude do texto grego.
