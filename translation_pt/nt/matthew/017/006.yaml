  text: καὶ ἀκούσαντες οἱ μαθηταὶ ἔπεσαν ἐπὶ πρόσωπον αὐτῶν καὶ ἐφοβήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/006.yaml
  text: And when the disciples heard it[c][b][a], they fell on their faces and were greatly afraid.
translation:
  language: pt
  text: Quando ouviram isso, os discípulos caíram com o rosto em terra e ficaram com muito medo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficaram profundamente amedrontados”. O advérbio grego indica medo intenso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Quando ouviram isso
  rationale: O particípio aoristo é expresso naturalmente em português por uma oração temporal. “Isso” retoma, sem explicação adicional, a voz ouvida no versículo anterior.
- source_word: οἱ μαθηταὶ
  choice: os discípulos
  rationale: Tradução corrente e contextualmente específica de μαθηταί nos Evangelhos.
- source_word: ἔπεσαν ἐπὶ πρόσωπον αὐτῶν
  choice: caíram com o rosto em terra
  rationale: Expressão portuguesa natural que conserva tanto o movimento de cair quanto a postura de prostração; o singular coletivo do grego é idiomático nessa construção.
- source_word: ἐφοβήθησαν σφόδρα
  choice: ficaram com muito medo
  rationale: Forma clara e atual de comunicar o início ou estado de medo intensificado por σφόδρα, sem acrescentar uma interpretação teológica à emoção.
theological_decisions:
- issue: Natureza da reação dos discípulos à voz divina
  choice: Descrever a prostração física e o medo intenso sem classificar a reação como adoração, terror ou temor reverente.
  alternative: Interpretar a reação especificamente como adoração reverente ou, em sentido oposto, como puro terror diante da manifestação divina.
  rationale: O grego registra a postura corporal e o medo, mas não define teologicamente a natureza exata da reação; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Com o rosto em terra” mantém a imagem concreta da prostração, e “com muito medo” comunica de modo natural a força de σφόδρα.
