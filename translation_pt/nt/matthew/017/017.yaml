  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ⸂μεθ’ ὑμῶν ἔσομαι⸃; ἕως πότε ἀνέξομαι ὑμῶν; φέρετέ μοι αὐτὸν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
translation:
  language: pt
  text: 'Jesus, porém, respondeu: “Ó geração sem fé[a] e perversa[b], até quando estarei com vocês? Até quando os suportarei? Tragam o menino aqui para mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “incrédula”; o termo grego também pode ter o sentido de “infiel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “distorcida” ou “corrompida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Jesus, porém, respondeu
  rationale: A construção ‘respondendo, disse’ é idiomática no grego e fica natural em português como ‘respondeu’; δέ marca aqui uma transição com leve contraste, expresso por ‘porém’.
- source_word: Ὦ γενεὰ
  choice: Ó geração
  rationale: ‘Ó’ conserva o tom solene de lamento e repreensão, enquanto ‘geração’ mantém a referência ao grupo contemporâneo e sua ressonância profética.
- source_word: ἄπιστος
  choice: sem fé
  rationale: No contexto da incapacidade dos discípulos e da fé deficiente, ‘sem fé’ comunica de modo natural a falta de fé, preservando em nota a possibilidade de ‘incrédula’.
- source_word: διεστραμμένη
  choice: perversa
  rationale: O particípio perfeito descreve uma condição moralmente desviada ou distorcida; ‘perversa’ é atual, digna e suficientemente forte em português.
- source_word: ἕως πότε μεθ’ ὑμῶν ἔσομαι
  choice: Até quando estarei com vocês?
  rationale: Tradução direta e idiomática da pergunta temporal, mantendo o futuro e a força retórica.
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: Até quando terei de suportá-los?
  rationale: ‘Suportar’ expressa o sentido de aguentar ou tolerar; ‘terei de’ torna natural em português a exasperação implícita sem eliminar a pergunta retórica.
- source_word: φέρετέ μοι αὐτὸν ὧδε
  choice: Tragam o menino aqui a mim
  rationale: O pronome masculino retoma o menino mencionado no contexto; explicitar ‘o menino’ evita ambiguidade em português. ‘Aqui a mim’ preserva tanto ὧδε quanto μοι.
theological_decisions:
- issue: Sentido de ἄπιστος na repreensão de Jesus
  choice: sem fé
  alternative: incrédula; infiel
  rationale: O contexto imediato enfatiza a deficiência de fé, mas o adjetivo também pode qualificar alguém como incrédulo ou infiel. A tradução principal evita restringir a expressão à infidelidade pactual e a nota conserva a alternativa lexical relevante.
- issue: Alcance de ‘geração’
  choice: manter o referente coletivo sem identificá-lo mais precisamente
  alternative: substituir por ‘povo’ ou restringir aos discípulos
  rationale: O versículo não define de forma inequívoca se a repreensão alcança apenas os discípulos, a multidão ou a geração contemporânea em sentido mais amplo; ‘geração’ preserva essa tensão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom permanece solene e incisivo, sem arcaísmos desnecessários. Usa-se ‘vocês’ por clareza contemporânea; ‘Tragam’ mantém o imperativo plural.
