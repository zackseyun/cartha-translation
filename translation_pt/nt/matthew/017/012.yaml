id: MAT.17.12
reference: Matthew 17:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι Ἠλίας ἤδη ἦλθεν, καὶ οὐκ ἐπέγνωσαν αὐτὸν ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν· οὕτως καὶ ὁ υἱὸς τοῦ ἀνθρώπου μέλλει πάσχειν ὑπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
translation:
  language: pt
  text: Mas eu lhes digo que Elias já veio, e eles não o reconheceram; pelo contrário, fizeram com ele tudo o que quiseram.[a] Assim também o Filho do Homem está para sofrer nas mãos deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não o conheceram” ou “não reconheceram quem ele era”. A expressão grega pode indicar que não identificaram ou não reconheceram devidamente sua identidade e seu papel. A frase seguinte também pode ser traduzida: “fizeram contra ele tudo o que quiseram” ou “trataram-no como quiseram”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “vai sofrer”. A expressão grega ressalta que esse sofrimento está próximo ou prestes a acontecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Mas eu lhes digo
  rationale: Mantém o contraste de δέ e traduz naturalmente a introdução direta da fala com o dativo ὑμῖν.
- source_word: Ἠλίας ἤδη ἦλθεν
  choice: Elias já veio
  rationale: Expressa de modo corrente a vinda já realizada indicada pelo aoristo com ἤδη, sem perder sua relevância no contexto.
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  choice: eles não o reconheceram
  rationale: No contexto, ἐπιγινώσκω indica que não identificaram devidamente quem ele era ou qual era seu papel, mais que simples falta de conhecimento pessoal.
- source_word: ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  choice: pelo contrário, fizeram com ele tudo o que quiseram
  rationale: A formulação idiomática comunica a ação irrestrita e hostil dirigida contra ele; «pelo contrário» dá a ἀλλά sua força adversativa.
- source_word: οὕτως καὶ
  choice: Assim também
  rationale: Preserva de forma compacta a analogia entre o tratamento dado a Elias e o sofrimento do Filho do Homem.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Emprega a forma consagrada em português e preserva as ressonâncias do título.
- source_word: μέλλει πάσχειν
  choice: está para sofrer
  rationale: Expressa o caráter iminente ou próximo do sofrimento sem acrescentar uma ideia explícita de destino ou necessidade que não está formulada nesta oração.
- source_word: ὑπ’ αὐτῶν
  choice: nas mãos deles
  rationale: Forma idiomática portuguesa que deixa clara a agência hostil expressa por ὑπό com genitivo.
theological_decisions:
- issue: Identificação da vinda de Elias
  choice: Manter «Elias» sem inserir no versículo a identificação com João Batista.
  alternative: Explicitar por paráfrase que Elias se refere a João Batista.
  rationale: Embora o contexto imediato esclareça a identificação, este versículo diz «Elias». A tradução deixa que o contexto forneça a interpretação e não a introduz no texto.
- issue: Força de μέλλει quanto ao sofrimento do Filho do Homem
  choice: 'Traduzir como futuro iminente: «está para sofrer».'
  alternative: «vai sofrer» ou «está destinado a sofrer».
  rationale: A expressão anuncia sofrimento vindouro, mas esta oração não enuncia por si mesma uma fórmula explícita de necessidade divina; evita-se acrescentar determinismo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Eles» permanece sem referente explicitado, como no grego, preservando a continuidade contextual e a ambiguidade genuína. Os marcadores aparecem após as respectivas unidades textuais.
