id: MAT.17.5
reference: Matthew 17:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔτι αὐτοῦ λαλοῦντος ἰδοὺ νεφέλη φωτεινὴ ἐπεσκίασεν αὐτούς, καὶ ἰδοὺ φωνὴ ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα· ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/005.yaml
  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
translation:
  language: pt
  text: 'Enquanto ele ainda falava, eis que uma nuvem luminosa os cobriu com sua sombra; e eis que uma voz vinda da nuvem dizia: “Este é o meu Filho amado, em quem me agrado. Escutem-no[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Ouçam-no”. O imperativo grego pode indicar ouvir no sentido de dar atenção e acatar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Enquanto ele ainda falava
  rationale: O genitivo absoluto indica uma ação simultânea, e ἔτι preserva a ideia de que a fala foi interrompida.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Mantém as duas ocorrências do marcador que chama a atenção e intensifica a cena, em registro elevado mas compreensível.
- source_word: νεφέλη φωτεινὴ
  choice: uma nuvem luminosa
  rationale: Expressa diretamente a qualidade brilhante ou radiante da nuvem sem explicar seu simbolismo.
- source_word: ἐπεσκίασεν
  choice: os cobriu com sua sombra
  rationale: Reproduz a imagem de ἐπισκιάζω em português natural e preserva sua possível ressonância de manifestação divina.
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  choice: uma voz vinda da nuvem dizia
  rationale: A formulação é natural em português e mantém o valor descritivo do particípio presente λέγουσα.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: o meu Filho amado
  rationale: Preserva tanto a identidade filial quanto a linguagem de amor ou eleição, sem acrescentar terminologia doutrinária.
- source_word: ἐν ᾧ εὐδόκησα
  choice: em quem me agrado
  rationale: Mantém a construção relacional com ἐν ᾧ e traduz εὐδόκησα mediante uma fórmula portuguesa clara e digna, sem forçar uma distinção temporal que o contexto declarativo não exige.
- source_word: ἀκούετε αὐτοῦ
  choice: Escutem-no
  rationale: O imperativo presente pede escuta atenta e acolhimento continuado; 'escutem-no' comunica isso melhor que o meramente auditivo 'ouçam-no', sem explicitar 'obedeçam'.
theological_decisions:
- issue: A declaração divina sobre a identidade de Jesus
  choice: Este é o meu Filho amado, em quem me agrado
  alternative: Este é o meu Filho, o Amado, em quem encontrei agrado
  rationale: A redação conserva a identificação direta de Jesus como Filho, bem como a linguagem de amor e agrado, sem introduzir formulações doutrinárias posteriores.
- issue: A força de ἀκούετε αὐτοῦ
  choice: Escutem-no
  alternative: Ouçam-no
  rationale: O imperativo pode incluir a ideia de dar atenção e acatar. A escolha preserva essa amplitude sem transformar a tradução em uma paráfrase como 'obedeçam-lhe'.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “eis que” foi mantida para refletir o efeito dramático do grego. A colocação pronominal em “Escutem-no” segue o registro escrito corrente.
