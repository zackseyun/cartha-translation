  source_fidelity: 'O texto traduz com precisão os elementos centrais do grego: o genitivo absoluto temporal (''Enquanto ele ainda falava''), as duas ocorrências de ἰδού (''eis que''), a nuvem ''luminosa'', o ato de ἐπεσκίασεν expresso como ''os cobriu com sua sombra'', a voz proveniente da nuvem, a identificação de Jesus como Filho amado, a expressão de agrado e o imperativo plural ἀκούετε αὐτοῦ. A opção ''em quem me agrado'' é uma forma portuguesa legítima e conserva a construção relacional sem impor uma explicação teológica.'
  naturalness: O português é moderno, claro e de registro narrativo digno. A repetição de 'eis que' é deliberadamente marcada, mas corresponde à força discursiva repetida de ἰδού e permanece compreensível. 'Escutem-no' é natural e adequado ao registro escrito internacional com boa legibilidade brasileira.
  terminology: '''Filho amado'', ''nuvem luminosa'', ''me agrado'' e ''Escutem-no'' são escolhas terminologicamente adequadas. ''Escutem-no'' comunica escuta atenta sem expandir indevidamente o imperativo para ''obedeçam-lhe''. A nota oferece ''Ouçam-no'' como alternativa pertinente.'
