  text: καὶ ἰδοὺ ⸀ὤφθη αὐτοῖς Μωϋσῆς καὶ Ἠλίας ⸂συλλαλοῦντες μετ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/003.yaml
  text: And behold[a], Moses and Elijah appeared to them, talking with him.
translation:
  language: pt
  text: E eis que Moisés e Elias lhes apareceram[a], conversando com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram vistos por eles”. O verbo grego está formalmente na voz passiva, embora “lhes apareceram” seja a expressão mais natural em português neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: eis que
  rationale: Mantém a função de chamar a atenção e a vivacidade narrativa de ἰδού em uma expressão corrente e digna em português.
- source_word: ὤφθη
  choice: apareceram
  rationale: Embora a forma grega seja passiva, o aoristo de ὁράω é usado aqui de modo idiomático para uma manifestação visível; “apareceram” é natural em português e não especifica o modo dessa presença.
- source_word: αὐτοῖς
  choice: lhes
  rationale: O pronome dativo identifica aqueles diante de quem ocorreu a aparição; “lhes apareceram” reproduz isso de maneira direta e natural.
- source_word: Μωϋσῆς
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: Ἠλίας
  choice: Elias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: συλλαλοῦντες
  choice: conversando
  rationale: O particípio indica fala recíproca ou conjunta. “Conversando” comunica essa ideia com naturalidade em português moderno.
- source_word: μετ’ αὐτοῦ
  choice: com ele
  rationale: μετά com o genitivo indica associação. O pronome preserva a formulação grega, e o contexto identifica seu referente como Jesus.
theological_decisions:
- issue: Referente de αὐτοῦ
  choice: “ele” refere-se a Jesus
  alternative: Substituir o pronome por “Jesus”
  rationale: O contexto imediato da transfiguração torna claro o referente, mas conservar o pronome evita explicitar no texto mais do que o grego explicita.
- issue: Natureza do aparecimento de Moisés e Elias
  choice: A tradução afirma sua manifestação visível sem definir o modo de sua presença
  alternative: “foram vistos por eles”
  rationale: O versículo apresenta Moisés e Elias como visíveis aos discípulos, mas não oferece aqui uma explicação metafísica ou doutrinária do acontecimento.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “E eis que” conserva a súbita chamada de atenção do original sem recorrer a uma paráfrase; “conversando” evita formalidade excessiva e expressa a reciprocidade da ação.
