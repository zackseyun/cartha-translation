  text: τότε συνῆκαν οἱ μαθηταὶ ὅτι περὶ Ἰωάννου τοῦ βαπτιστοῦ εἶπεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/013.yaml
  text: Then the disciples understood that he had spoken to them about John the Baptist[a].
translation:
  language: pt
  text: Então os discípulos entenderam que ele lhes havia falado a respeito de João Batista[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “João, o Batizador”.
    reason: Alternativa lexical que expressa diretamente a função indicada por βαπτιστής.
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca de forma natural e concisa o momento em que os discípulos chegaram à compreensão.
- source_word: συνῆκαν
  choice: entenderam
  rationale: O aoristo de συνίημι indica que eles compreenderam o sentido das palavras de Jesus; “entenderam” é claro e idiomático.
- source_word: οἱ μαθηταὶ
  choice: os discípulos
  rationale: Equivalente consagrado e claro para os seguidores de Jesus no relato dos Evangelhos.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo do que os discípulos entenderam, e não uma oração causal.
- source_word: περὶ
  choice: a respeito de
  rationale: Com o genitivo, indica o assunto da fala; esta formulação é natural e mantém o sentido relacional do grego.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: João Batista
  rationale: Forma tradicional, amplamente reconhecida e natural em português; “João, o Batizador” preserva mais diretamente a função expressa pelo título grego e é registrada em nota.
- source_word: εἶπεν αὐτοῖς
  choice: ele lhes havia falado
  rationale: O mais-que-perfeito composto deixa clara, em português natural, a anterioridade da fala em relação ao momento em que os discípulos entenderam, sem acrescentar conteúdo ao verbo grego.
theological_decisions:
- issue: Identificação da figura de Elias no contexto imediato
  choice: O versículo declara que os discípulos entenderam que Jesus falava de João Batista.
  alternative: Explicitar que João era Elias ou o cumprimento definitivo da profecia.
  rationale: A identificação com João é apresentada como a compreensão dos discípulos; a tradução não deve ampliar essa afirmação nem resolver além do texto a tensão teológica do contexto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Lhes havia falado” preserva a relação entre os participantes e a anterioridade da fala; “João Batista” mantém o uso bíblico corrente, com a alternativa funcional em nota.
