    reason: lexical_alternative
  revision_rationale: A revisão torna mais explícita a natureza pessoal de κῆνσος e esclarece o contraste entre os filhos dos reis e os de fora da família. Mantém a identificação de Pedro, a iniciativa de Jesus, a linguagem de filiação e a pergunta aberta do original, sem acrescentar inferências doutrinárias.
