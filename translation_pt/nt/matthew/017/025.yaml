id: MAT.17.25
reference: Matthew 17:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: pt
  text: 'Ele respondeu: “Sim.” Quando Pedro entrou na casa, Jesus lhe falou primeiro: “O que você acha, Simão? De quem os reis da terra cobram taxas ou imposto por pessoa: de seus próprios filhos ou dos que não são da família[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos estranhos”. O termo grego se refere aos que não pertencem à própria família, isto é, a pessoas de fora.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: Sim
  rationale: Resposta afirmativa simples e natural em português.
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: Quando Pedro entrou em casa
  rationale: O particípio acusativo refere-se a Pedro, objeto implícito de προέφθασεν; explicitar seu nome evita ambiguidade pronominal em português.
- source_word: προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων
  choice: Jesus falou primeiro, perguntando
  rationale: Expressa de modo natural que Jesus tomou a iniciativa e falou antes que Pedro o fizesse.
- source_word: Τί σοι δοκεῖ
  choice: O que você acha
  rationale: Equivalente idiomático atual para uma pergunta que solicita o juízo de Simão.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: os reis da terra
  rationale: Preserva a abrangência e a formulação concreta do grego sem restringir γῆ a uma região específica.
- source_word: τέλη
  choice: impostos
  rationale: Designa taxas, alfândegas ou impostos indiretos; 'impostos' é claro ao leitor comum, embora seja menos específico, e permanece distinto de 'tributo'.
- source_word: κῆνσον
  choice: tributo
  rationale: Refere-se ao imposto pessoal ou tributo cobrado pelo poder governante; 'tributo' é natural e mantém a distinção lexical de τέλη.
- source_word: υἱῶν αὐτῶν
  choice: seus próprios filhos
  rationale: Mantém a linguagem familiar de υἱοί e torna explícito o contraste entre os filhos do rei e os que não pertencem à família.
- source_word: ἀλλοτρίων
  choice: dos outros
  rationale: Forma concisa e natural para os que não são da própria família; a nota registra a alternativa mais literal.
theological_decisions:
- issue: Possível inferência teológica da linguagem de filiação na analogia
  choice: seus próprios filhos
  alternative: seus súditos
  rationale: A linguagem familiar deve ser preservada porque prepara a implicação do versículo seguinte, sem explicar ou impor essa implicação no texto deste versículo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. O nome 'Pedro' foi explicitado para desfazer uma ambiguidade pronominal criada pela passagem do particípio grego para uma oração temporal portuguesa. A construção mantém a distinção entre τέλη e κῆνσον sem recorrer a terminologia fiscal excessivamente técnica.
