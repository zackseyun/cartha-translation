review_pass:
  verdict: revise
  source_fidelity: A tradução identifica corretamente Pedro como quem entra e preserva a iniciativa de Jesus em falar antes que ele se pronunciasse. Contudo, «tributo» não comunica com precisão suficiente o κῆνσος, imposto individual/de capitação, e «dos outros» pode enfraquecer a oposição familiar expressa por ἀλλοτρίων.
  naturalness: O texto é geralmente claro e moderno. «Quando Pedro entrou na casa» e «Jesus lhe falou primeiro» soam naturais em português amplo. «Taxas ou imposto por pessoa» mantém uma distinção compreensível sem recorrer a tecnicismo excessivo.
  terminology: «Filhos» preserva adequadamente υἱῶν. «Taxas» para τέλη e «imposto por pessoa» para κῆνσον distinguem os dois tributos. «Os que não são da família» explicita de modo natural, sem interpretação teológica, o contraste de ἀλλότριοι com os filhos do rei.
  issues:
  - severity: medium
    issue: «Tributo» para κῆνσον é excessivamente amplo.
    rationale: κῆνσος designa especificamente um imposto de capitação/pessoal. Como «tributo» pode abranger impostos em geral, a versão perde parte da distinção com τέλη.
  - severity: low
    issue: «Dos outros» é ambíguo no contraste familiar.
    rationale: Pode significar apenas «os demais», sem deixar claro que se trata de pessoas de fora da família. Uma formulação explícita preserva melhor o valor contextual de ἀλλοτρίων.
