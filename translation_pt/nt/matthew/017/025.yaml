revisions:
- from: 'Ele respondeu: “Sim”. Quando Pedro entrou em casa, Jesus falou primeiro, perguntando: “O que você acha, Simão? De quem os reis da terra cobram impostos ou tributo: de seus próprios filhos ou dos outros[a]?”'
  to: 'Ele respondeu: “Sim.” Quando Pedro entrou na casa, Jesus lhe falou primeiro: “O que você acha, Simão? De quem os reis da terra cobram taxas ou imposto por pessoa: de seus próprios filhos ou dos que não são da família[a]?”'
  rationale: A revisão torna mais explícita a natureza pessoal de κῆνσος e esclarece o contraste entre os filhos dos reis e os de fora da família. Mantém a identificação de Pedro, a iniciativa de Jesus, a linguagem de filiação e a pergunta aberta do original, sem acrescentar inferências doutrinárias.
