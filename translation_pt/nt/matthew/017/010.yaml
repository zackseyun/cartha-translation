id: MAT.17.10
reference: Matthew 17:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: pt
  text: 'E os discípulos lhe perguntaram: “Por que, então, os escribas dizem que Elias deve vir primeiro?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: perguntaram
  rationale: O aoristo de ἐπερωτάω introduz aqui uma pergunta direta. “Perguntaram” é natural e reproduz adequadamente o sentido sem acrescentar formalidade.
- source_word: μαθηταὶ
  choice: os discípulos
  rationale: O artigo identifica um grupo definido e já conhecido no contexto. Não se acrescenta “seus”, pois o grego não traz αὐτοῦ junto ao substantivo.
- source_word: λέγοντες
  choice: —
  rationale: O particípio introduz o conteúdo da pergunta. Em português atual, sua função é expressa naturalmente pelos dois-pontos e pela fala direta; “dizendo” seria possível, mas menos fluente.
- source_word: Τί οὖν
  choice: Por que, então
  rationale: Embora τί seja formalmente “o que”, nesta construção pede a razão do ensino mencionado. “Por que, então” comunica de modo idiomático tanto a pergunta causal quanto a conexão inferencial de οὖν.
- source_word: γραμματεῖς
  choice: os escribas
  rationale: “Escribas” é o equivalente tradicional e direto de γραμματεῖς no contexto dos Evangelhos, sem inserir na tradução uma explicação funcional mais ampla.
- source_word: λέγουσιν ὅτι
  choice: dizem que
  rationale: Mantém o presente e introduz diretamente o conteúdo da afirmação, de forma natural em português.
- source_word: Ἠλίαν
  choice: Elias
  rationale: Emprega a forma portuguesa consagrada do nome bíblico.
- source_word: δεῖ ἐλθεῖν
  choice: deve vir
  rationale: δεῖ exprime necessidade. “Deve vir” é conciso, corrente e preserva essa força modal.
- source_word: πρῶτον
  choice: primeiro
  rationale: O advérbio indica prioridade temporal ou sequencial; “primeiro” conserva essa ideia sem explicá-la além do texto.
theological_decisions:
- issue: Força interpretativa da pergunta dos discípulos sobre a vinda de Elias
  choice: Apresentar a pergunta sem decidir se o ensino dos escribas está sendo afirmado, contestado ou parcialmente corrigido.
  alternative: Uma formulação mais interpretativa poderia sugerir ceticismo diante dos escribas ou inserir explicitamente o pano de fundo de Malaquias.
  rationale: O versículo apenas registra a pergunta dos discípulos. A tensão deve permanecer até a resposta de Jesus em Mateus 17:11–13.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A omissão de um equivalente lexical para λέγοντες evita o pouco natural “perguntaram, dizendo”; os dois-pontos preservam sua função discursiva. Mantém-se “escribas” por precisão histórico-religiosa.
