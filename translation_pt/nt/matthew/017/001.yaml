- from: Seis dias depois, Jesus levou consigo Pedro, Tiago e João, irmão de Tiago, e os conduziu, em particular, a um monte alto.
  to: Seis dias depois, Jesus levou consigo Pedro, Tiago e João, irmão de Tiago, e os levou à parte para o alto de um monte.
  rationale: A revisão substitui a expressão menos definida «em particular» por «à parte» e torna explícito o movimento ascendente de ἀναφέρει. Mantêm-se o pretérito narrativo, os nomes tradicionais e a identificação contextual de João como irmão de Tiago.
