review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a sequência temporal, os três discípulos, a identificação de João como irmão de Tiago e o destino em um monte alto. Contudo, «conduziu ... a um monte alto» deixa apenas implícito o movimento ascendente de ἀναφέρει, e «em particular» é menos preciso e menos idiomático nesta posição para κατ’ ἰδίαν, que indica que foram levados à parte, separados dos demais.
  naturalness: O pretérito perfeito é uma opção narrativa plenamente natural em português moderno. A redação fica mais clara com «à parte», que expressa diretamente a separação pretendida e evita o sentido português comum de «em particular» como “especialmente”.
  terminology: Pedro, Tiago e João são as formas portuguesas tradicionais e adequadas. «Irmão de Tiago» resolve de modo legítimo a potencial ambiguidade pronominal de «seu irmão», sem acrescentar conteúdo interpretativo indevido.
  issues:
  - severity: low
    issue: «Em particular» não é a melhor formulação para κατ’ ἰδίαν neste contexto.
    rationale: A locução pode ser entendida como “especialmente” e, posta entre vírgulas, soa pouco fluente. «À parte» conserva de modo mais direto o sentido de separação/privacidade.
  - severity: low
    issue: O componente ascensional de ἀναφέρει fica enfraquecido.
    rationale: Embora o monte sugira subida, «conduziu ... a um monte» não a exprime. «Levou-os para o alto de um monte» comunica naturalmente o movimento para cima sem exigir que tenham chegado ao cume.
  revised_text: Seis dias depois, Jesus levou consigo Pedro, Tiago e João, irmão de Tiago, e os levou à parte para o alto de um monte.
  revised_footnotes: []
  revision_rationale: A revisão substitui a expressão menos definida «em particular» por «à parte» e torna explícito o movimento ascendente de ἀναφέρει. Mantêm-se o pretérito narrativo, os nomes tradicionais e a identificação contextual de João como irmão de Tiago.
