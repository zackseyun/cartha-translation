id: MAT.17.1
reference: Matthew 17:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: pt
  text: Seis dias depois, Jesus levou consigo Pedro, Tiago e João, irmão de Tiago, e os levou à parte para o alto de um monte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: Seis dias depois
  rationale: Expressa naturalmente em português a sucessão temporal indicada por μετά com o acusativo, preservando a ligação narrativa.
- source_word: παραλαμβάνει
  choice: levou consigo
  rationale: Comunica o sentido de tomar alguém como acompanhante. O passado é a forma narrativa natural em português moderno, embora o grego empregue o presente histórico.
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Pedro, Tiago e João
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes em português.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: irmão de Tiago
  rationale: No contexto e pela construção apositiva, a expressão identifica João como irmão de Tiago; explicitar o referente evita uma ambiguidade pronominal pouco natural em português.
- source_word: ἀναφέρει
  choice: conduziu
  rationale: No contexto da subida ao monte, transmite o sentido de levar ou conduzir para cima; a ideia ascendente já fica clara pelo destino e evita repetição de 'levou'.
- source_word: εἰς ὄρος ὑψηλὸν
  choice: a um monte alto
  rationale: Expressa de modo idiomático o movimento em direção ao destino indicado por εἰς.
- source_word: κατ’ ἰδίαν
  choice: em particular
  rationale: Preserva o sentido de separação do restante das pessoas e pode indicar tanto privacidade quanto estarem à parte, sem acrescentar que Jesus não estava com eles.
theological_decisions:
- issue: Presente histórico na narrativa dos Evangelhos
  choice: 'Verter no passado: ''levou ... conduziu'''
  alternative: 'Manter o presente histórico: ''leva ... conduz'''
  rationale: O grego usa o presente histórico para vivacidade, mas, isoladamente e no fluxo narrativo em português, o pretérito perfeito é mais natural e não altera a sequência nem o conteúdo do acontecimento.
- issue: Referente de αὐτοῦ em 'τὸν ἀδελφὸν αὐτοῦ'
  choice: Identificar João como irmão de Tiago
  alternative: Preservar formalmente 'seu irmão'
  rationale: A aposição segue imediatamente João, e o contexto conhecido identifica Tiago e João como irmãos. Em português, 'seu irmão' poderia apontar indevidamente para Jesus ou Pedro; a explicitação comunica a relação pretendida sem implicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, e os verbos foram postos no passado, forma usual da narrativa portuguesa.
