  text: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν οὐδένα εἶδον εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
translation:
  language: pt
  text: E, ao levantarem os olhos, não viram ninguém, a não ser o próprio Jesus — somente ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a não ser o próprio Jesus, somente ele”. O grego emprega tanto um pronome enfático (“o próprio”) como “somente” para reforçar a exclusividade: não viram mais ninguém.'
    reason: Alternativa lexical e explicação da ênfase cumulativa do grego.
lexical_decisions:
- source_word: ἐπάραντες
  choice: erguendo
  rationale: O particípio aoristo indica a ação que precede o verbo principal; a construção com gerúndio é natural em português e mantém a sequência narrativa.
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ funciona como conectivo narrativo leve, sem exigir contraste forte.
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: os olhos
  rationale: Mantém a expressão corporal concreta do grego; em português, o possuidor fica claro pelo sujeito verbal e não precisa ser explicitado.
- source_word: οὐδένα
  choice: ninguém
  rationale: Equivalente português direto e idiomático do pronome negativo usado como objeto de 'viram'.
- source_word: εἶδον
  choice: viram
  rationale: Reproduz de modo simples o aoristo de ὁράω, sem acrescentar ideias de percepção ou localização.
- source_word: εἰ μὴ
  choice: a não ser
  rationale: Depois da negação, a expressão introduz uma exceção; 'a não ser' é clara e natural em português.
- source_word: αὐτὸν
  choice: o próprio
  rationale: A posição do pronome antes do nome próprio lhe confere destaque; 'o próprio' preserva essa ênfase sem artificialidade excessiva.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: μόνον
  choice: somente ele
  rationale: Retoma Jesus e conserva, em português natural, a exclusividade reforçada e a posição enfática final de μόνον.
theological_decisions:
- issue: Ênfase em Jesus como a única pessoa ainda visível depois da visão
  choice: a não ser o próprio Jesus — somente ele
  alternative: a não ser apenas Jesus; a não ser Jesus sozinho
  rationale: O grego acumula εἰ μὴ, o pronome enfático αὐτόν e μόνον. A formulação conserva essa ênfase cumulativa e indica somente quem os discípulos viram, sem acrescentar uma conclusão doutrinária ao relato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita o mais tradicional e menos corrente 'levantando os olhos' e usa a pausa do travessão para transmitir com naturalidade a ênfase final do original.
