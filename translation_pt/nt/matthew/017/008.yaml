review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência narrativa, a negação com exceção (οὐδένα ... εἰ μὴ) e a ênfase cumulativa de αὐτὸν e μόνον. Contudo, o gerúndio «erguendo» tende a apresentar a ação como simultânea à visão, enquanto o particípio aoristo introduz a ação anterior; «ao levantarem» comunica melhor essa relação.
  naturalness: «O próprio Jesus — somente ele» é compreensível e conserva uma ênfase solene sem perder legibilidade. «Ao levantarem os olhos» é mais idiomático e temporalmente mais preciso neste contexto do que «erguendo os olhos».
  terminology: «Jesus» e «o próprio Jesus» são adequados. «A não ser» traduz naturalmente εἰ μὴ. A nota deve conservar a mesma dupla ênfase do texto, sem usar «sozinho», que pode sugerir sobretudo estar desacompanhado, em vez da exclusividade daquilo que foi visto.
  issues:
  - severity: low
    issue: Valor temporal do particípio inicial
    rationale: «Erguendo os olhos» pode ser lido como uma ação concomitante. «Ao levantarem os olhos» expressa com maior clareza a ação preparatória anterior à de «viram», coerente com o aoristo participial ἐπάραντες.
  - severity: low
    issue: Alternativa da nota enfraquece e pode deslocar a nuance da exclusividade
    rationale: «Jesus, sozinho» não reproduz explicitamente o pronome enfático αὐτόν e pode evocar solidão ou ausência de companhia. Uma alternativa com «o próprio Jesus, somente ele» mantém o foco no fato de que nenhuma outra pessoa foi vista.
  revised_text: E, ao levantarem os olhos, não viram ninguém, a não ser o próprio Jesus — somente ele.[a]
