source:
  edition: SBLGNT
  text: καὶ ἀποκτενοῦσιν αὐτόν, καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθήσεται. καὶ ἐλυπήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/023.yaml
  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
translation:
  language: pt
  text: e o matarão, e no terceiro dia ele será ressuscitado.[a] E eles ficaram profundamente tristes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ele ressuscitará». O verbo grego está na voz passiva: «será ressuscitado».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: o matarão
  rationale: Traduz diretamente o futuro ativo e o pronome objeto, sem acrescentar a nuance jurídica de «executar» nem a qualificação moral específica de «assassinar».
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: no terceiro dia
  rationale: Expressão portuguesa natural e tradicional que reproduz com precisão o dativo grego de tempo.
- source_word: ἐγερθήσεται
  choice: será ressuscitado
  rationale: Mantém a voz passiva do futuro grego e expressa claramente a ressurreição, preservando a possível referência implícita à ação de Deus.
- source_word: ἐλυπήθησαν σφόδρα
  choice: ficaram profundamente tristes
  rationale: Combinação corrente e compreensível em português que comunica tanto a reação ocorrida quanto a forte intensidade indicada por σφόδρα.
- source_word: καὶ ... καὶ ... καὶ
  choice: e ... e ... E
  rationale: Conserva o encadeamento paratático simples do texto grego sem introduzir relações adversativas ou temporais não explicitadas.
theological_decisions:
- issue: Voz verbal na predição da ressurreição
  choice: será ressuscitado
  alternative: ressuscitará
  rationale: A forma grega é passiva. Preservar essa voz mantém a formulação do texto e sua possível nuance de ação divina, sem excluir a leitura idiomática de que Jesus ressuscitará.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem dos elementos e a repetição de «e» preservam a estrutura simples do grego; «ficaram profundamente tristes» evita tanto linguagem arcaica quanto formulação excessivamente técnica.
