id: MAT.17.18
reference: Matthew 17:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς, καὶ ἐξῆλθεν ἀπ’ αὐτοῦ τὸ δαιμόνιον· καὶ ἐθεραπεύθη ὁ παῖς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/018.yaml
  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
translation:
  language: pt
  text: E Jesus o repreendeu, e o demônio saiu dele; e o menino ficou curado desde aquela hora.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde aquele momento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: repreendeu
  rationale: Expressa a censura ou ordem enérgica e autoritativa de Jesus sem reduzir o verbo ao sentido mais específico de “ordenou”.
- source_word: αὐτῷ
  choice: o
  rationale: O pronome oblíquo masculino é natural em português e pode retomar tanto “demônio” quanto “menino”; o contexto imediato favorece o demônio como alvo da repreensão, sem tornar explícito o que o grego deixa pronominal.
- source_word: τὸ δαιμόνιον
  choice: o demônio
  rationale: É a correspondência direta e corrente; “espírito impuro” acrescentaria uma expressão ausente do versículo.
- source_word: ἐξῆλθεν ἀπ’ αὐτοῦ
  choice: saiu dele
  rationale: Reproduz de modo conciso e natural a expressão grega de expulsão, mantendo o referente humano de “dele”.
- source_word: ἐθεραπεύθη
  choice: ficou curado
  rationale: Comunica o resultado da ação passiva de curar em português natural, sem limitar a cura a uma formulação estritamente médica.
- source_word: ὁ παῖς
  choice: o menino
  rationale: No contexto, trata-se do filho mencionado pelo pai; “menino” é mais específico do que “criança” e evita o sentido contextualmente inadequado de “servo”.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: desde aquela hora
  rationale: Mantém de perto a expressão temporal do grego e continua clara em português moderno; “desde aquele momento” é uma alternativa mais idiomática.
theological_decisions:
- issue: Referente de αὐτῷ na repreensão de Jesus
  choice: Manter o referente pronominal em “o repreendeu”, com o contexto favorecendo o demônio
  alternative: Explicitar “repreendeu o demônio” ou entender que Jesus repreendeu o menino
  rationale: A frase seguinte, na qual o demônio sai do menino, indica fortemente que a repreensão foi dirigida ao demônio. Contudo, o uso do pronome em português preserva a forma e a discreta ambiguidade gramatical do grego, sem impor uma explicitação desnecessária.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do grego. A repetição de “e” preserva o encadeamento narrativo, enquanto “ficou curado” soa natural e ressalta o resultado duradouro da cura.
