id: MAT.17.20
reference: Matthew 17:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: pt
  text: 'Ele, porém, lhes diz: “Por causa da pouca fé de vocês.[a] Pois em verdade lhes digo: se tiverem fé como um grão de mostarda,[b] dirão a este monte: ‘Passe daqui para lá’, e ele passará; e nada lhes será impossível.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa da fé insuficiente de vocês”. O termo grego indica fé pequena ou deficiente, mais especificamente do que ausência completa de fé.
    reason: lexical_alternative
  - marker: b
    text: Em grego, literalmente, “fé como um grão de mostarda”; a comparação evoca algo muito pequeno.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico grego e a vivacidade narrativa de Mateus; em português, o presente também funciona naturalmente nesse tipo de narração.
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: Por causa da pouca fé de vocês
  rationale: ὀλιγοπιστία indica fé pequena ou insuficiente, não necessariamente ausência total de fé. “Pouca fé” preserva essa nuance em português claro.
- source_word: ἀμὴν
  choice: em verdade
  rationale: Reproduz a fórmula solene que introduz uma declaração enfática de Jesus sem exigir a transliteração “amém”.
- source_word: πίστιν
  choice: fé
  rationale: Neste contexto, refere-se à confiança no poder de Deus. “Fé” é a correspondência portuguesa tradicional, clara e não acrescenta uma interpretação denominacional.
- source_word: ὡς κόκκον σινάπεως
  choice: como um grão de mostarda
  rationale: Preserva diretamente a comparação grega e sua imagem de algo muito pequeno, sem explicitar no corpo do texto mais do que o original afirma.
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: Passe daqui para lá
  rationale: O imperativo de μεταβαίνω ordena uma mudança de lugar. “Passe” conserva o movimento indicado pelo verbo e se liga naturalmente a “ele passará”.
- source_word: μεταβήσεται
  choice: ele passará
  rationale: 'O futuro tem sentido intransitivo: o monte mudará de lugar. O pronome “ele” retoma claramente “monte”.'
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: nada lhes será impossível
  rationale: É a forma idiomática e direta de expressar em português que nada se mostrará impossível para eles.
theological_decisions:
- issue: Sentido de πίστις no contexto de um milagre
  choice: fé
  alternative: confiança
  rationale: O contexto trata da confiança insuficiente dos discípulos diante do poder de Deus. “Fé” mantém o termo teologicamente aberto e não o restringe a uma doutrina específica de fé salvadora nem ao sentido de fidelidade.
- issue: Força de ὀλιγοπιστία
  choice: pouca fé
  alternative: falta de fé
  rationale: A opção principal conserva a ideia de fé deficiente ou pequena, evitando transformar a repreensão em afirmação inequívoca de incredulidade total.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. O presente histórico foi mantido. “Ele, porém” representa o conectivo δέ sem impor uma oposição forte. A formulação conserva a concisão e a tensão do original, especialmente entre “pouca fé” e a fé comparada a um grão de mostarda.
