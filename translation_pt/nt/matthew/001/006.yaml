id: MAT.1.6
reference: Matthew 1:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰεσσαὶ δὲ ἐγέννησεν τὸν Δαυὶδ τὸν βασιλέα. Δαυὶδ ⸀δὲ ἐγέννησεν τὸν Σολομῶνα ἐκ τῆς τοῦ Οὐρίου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/006.yaml
  text: Jesse fathered David the king[a]. David fathered Solomon by the wife of Uriah,
translation:
  language: pt
  text: Jessé gerou Davi, o rei. Davi gerou Salomão da mulher de Urias[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “da [mulher] de Urias”, numa expressão elíptica. Mateus não menciona aqui o nome de Bate-Seba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: gerou
  rationale: Em contexto genealógico, γεννάω indica procriação ou descendência pela linha paterna. “Gerou” é conciso, corrente em genealogias bíblicas em português e preserva essa força sem ampliar o texto.
- source_word: βασιλέα
  choice: o rei
  rationale: A expressão mantém o artigo grego e identifica Davi especificamente como “o rei”, destacando sua condição régia na genealogia.
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: da mulher de Urias
  rationale: O grego traz uma expressão elíptica, literalmente “da [mulher] de Urias”. A formulação portuguesa preserva a elipse, não acrescenta o nome Bate-Seba e mantém a referência deliberada a Urias.
- source_word: Ἰεσσαὶ
  choice: Jessé
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: Δαυὶδ
  choice: Davi
  rationale: Forma corrente e amplamente reconhecida do nome em português, especialmente no uso brasileiro.
- source_word: Σολομῶνα
  choice: Salomão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: Οὐρίου
  choice: Urias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: δέ
  choice: —
  rationale: Aqui δέ funciona como conectivo leve na sequência genealógica. O português não exige sua tradução explícita em cada elo; a justaposição mantém a progressão clara e natural.
theological_decisions:
- issue: Referência indireta de Mateus a Bate-Seba
  choice: Manter “da mulher de Urias”, sem fornecer o nome Bate-Seba.
  alternative: “de Bate-Seba” ou “da que tinha sido mulher de Urias”
  rationale: O texto grego identifica deliberadamente a mulher por sua relação com Urias. Preservar essa forma mantém a ressonância narrativa e moral associada a 2 Samuel, sem neutralizá-la mediante a inserção do nome conhecido nem acrescentar uma indicação temporal ausente da expressão grega.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas nominais familiares ao público brasileiro. “Gerou” preserva a concisão genealógica; “da mulher de Urias” conserva a formulação indireta e a tensão literária do original. O marcador foi colocado junto à expressão que a nota explica.
