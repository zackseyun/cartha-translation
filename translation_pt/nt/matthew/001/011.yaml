  text: Ἰωσίας δὲ ἐγέννησεν τὸν Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ ἐπὶ τῆς μετοικεσίας Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/011.yaml
  text: Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon[a].
translation:
  language: pt
  text: Josias gerou Jeconias e os irmãos dele na época da deportação para a Babilônia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “durante o exílio na Babilônia”. O termo grego pode indicar remoção forçada ou exílio; “deportação” destaca o caráter coercitivo do acontecimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: gerou
  rationale: Na fórmula genealógica de Mateus, γεννάω indica descendência pela linha masculina. “Gerou” é conciso, tradicional sem ser arcaico e preserva a forma direta do grego, sem determinar se cada elo representa necessariamente paternidade biológica imediata.
- source_word: Ἰεχονίαν
  choice: Jeconias
  rationale: Forma portuguesa corrente e reconhecível do nome próprio grego Ἰεχονίας.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: os irmãos dele
  rationale: O grego emprega o masculino plural e, neste contexto genealógico, refere-se a parentes masculinos. “Dele” evita a possível ambiguidade de “seus” em português.
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: na época da deportação para a Babilônia
  rationale: μετοικεσία designa remoção forçada, deportação ou exílio; “deportação” destaca o caráter coercitivo. ἐπί com o genitivo tem valor temporal aqui, e “para a Babilônia” expressa o destino indicado pela construção.
- source_word: δὲ
  choice: não traduzido separadamente
  rationale: δὲ funciona como conectivo leve na sequência genealógica. Omitir um equivalente explícito produz português mais natural sem perda de conteúdo.
theological_decisions:
- issue: Compressão genealógica na linhagem apresentada por Mateus
  choice: Traduzir diretamente a fórmula genealógica como “gerou”, sem resolver no texto principal questões históricas sobre elos omitidos.
  alternative: Explicitar uma relação ancestral mais ampla, como “foi antepassado de”.
  rationale: A linguagem genealógica pode abranger descendência com compressão de gerações, mas a tradução deve preservar a formulação do grego e sua tensão histórica, sem inserir uma harmonização interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Na época da” comunica naturalmente o valor temporal; o artigo em “a Babilônia” segue o uso corrente no português do Brasil.
