source:
  edition: SBLGNT
  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: pt
  text: Eliúde gerou Eleazar; Eleazar gerou Matã; e Matã gerou Jacó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: Eliúde
  rationale: Transliteração adaptada à ortografia e à pronúncia usuais em português, preservando o nome pessoal grego.
- source_word: δὲ
  choice: pontuação; e
  rationale: Na sequência genealógica, δέ é um conectivo leve. O ponto e vírgula expressa naturalmente a progressão nas duas primeiras ocorrências, e «e» explicita a ligação na última sem tornar o texto repetitivo.
- source_word: ἐγέννησεν
  choice: gerou
  rationale: Em contexto genealógico, γεννάω indica procriação ou descendência pela linha paterna. «Gerou» é conciso, corrente no registro bíblico português e mantém a possível abrangência genealógica da fórmula.
- source_word: τὸν
  choice: não traduzido separadamente
  rationale: O artigo grego marca o objeto direto antes do nome próprio, mas em português não se emprega naturalmente artigo nessa construção.
- source_word: Ἐλεάζαρ
  choice: Eleazar
  rationale: Forma tradicional e amplamente reconhecida em português para o nome pessoal.
- source_word: Ματθάν
  choice: Matã
  rationale: Forma portuguesa concisa que representa o nome grego Ματθάν e segue convenções bíblicas lusófonas.
- source_word: Ἰακώβ
  choice: Jacó
  rationale: Forma bíblica tradicional e amplamente reconhecida em português para Ἰακώβ.
theological_decisions:
- issue: Alcance genealógico de ἐγέννησεν
  choice: gerou
  alternative: foi pai de
  rationale: «Gerou» preserva a fórmula genealógica e não obriga o texto a especificar se cada elo representa paternidade imediatamente biológica ou uma relação ancestral apresentada de modo abreviado.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência genealógica clara. A repetição verbal foi preservada por ser estrutural no original; a variação discreta dos conectivos evita rigidez desnecessária.
