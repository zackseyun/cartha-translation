  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: pt
  text: Salmom gerou Boaz de Raabe; Boaz gerou Obede de Rute; e Obede gerou Jessé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγέννησεν
  choice: gerou
  rationale: Na fórmula genealógica, o verbo indica que o homem gerou o descendente. “Gerou” é conciso, digno e tradicional sem ser obscuro; também permite manter explícita a menção à mãe.
- source_word: ἐκ
  choice: com
  rationale: Com o nome da mãe, ἐκ assinala origem ou filiação materna. Em português, “gerou X com Y” expressa naturalmente a participação materna, enquanto a nota preserva a alternativa mais literal “de”.
- source_word: δὲ
  choice: pontuação sequencial; e na última oração
  rationale: Aqui δέ é um conectivo leve, não adversativo. O ponto e vírgula torna fluida a sequência genealógica, e “e” explicita a ligação final.
- source_word: Σαλμὼν
  choice: Salmom
  rationale: Forma bíblica portuguesa estabelecida do nome, favorecendo reconhecimento e continuidade canônica.
- source_word: Βόες
  choice: Boaz
  rationale: Forma bíblica portuguesa consagrada para a personagem do Antigo Testamento à qual o texto se refere.
- source_word: Ῥαχάβ
  choice: Raabe
  rationale: Forma tradicional e amplamente reconhecida em português bíblico.
- source_word: Ἰωβὴδ
  choice: Obede
  rationale: Forma portuguesa estabelecida do nome veterotestamentário, preservando a continuidade entre os Testamentos.
- source_word: Ῥούθ
  choice: Rute
  rationale: Forma portuguesa corrente do nome e do livro bíblico.
- source_word: Ἰεσσαί
  choice: Jessé
  rationale: Forma bíblica portuguesa reconhecida, com a acentuação necessária.
theological_decisions:
- issue: Fórmula genealógica e inclusão das mães
  choice: Manter as referências maternas explícitas por meio de “gerou ... com Raabe” e “gerou ... com Rute”, preservando ao mesmo tempo a linha genealógica paterna.
  alternative: Traduzir mais literalmente “gerou ... de Raabe/de Rute” ou omitir a formulação materna explícita.
  rationale: O grego destaca de modo incomum as mães mediante ἐκ seguido do nome. A tradução não deve apagar esse destaque nem transformar a genealogia paterna numa fórmula genérica.
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes amplamente reconhecidas no uso bíblico brasileiro. Os pontos e vírgulas evitam a repetição pesada de conectivos sem eliminar a progressão do grego.
