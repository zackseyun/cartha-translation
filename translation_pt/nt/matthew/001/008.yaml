id: MAT.1.8
reference: Matthew 1:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀσὰφ⸃ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: pt
  text: Asafe gerou Josafá[a], Josafá gerou Jorão, e Jorão gerou Uzias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “Asa” em vez de “Asafe”; “Asa” também corresponde ao nome do rei de Judá na genealogia do Antigo Testamento.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: Asafe
  rationale: Translitera a forma do nome presente no texto grego da SBLGNT, sem harmonizá-la silenciosamente com o rei Asa do pano de fundo veterotestamentário.
- source_word: δὲ
  choice: e
  rationale: Neste contexto genealógico, funciona como conectivo leve, sem força adversativa; a última ocorrência é expressa por “e”, enquanto as anteriores são naturalmente representadas pela justaposição das orações.
- source_word: ἐγέννησεν
  choice: gerou
  rationale: É a formulação genealógica concisa, digna e amplamente compreensível em português, preservando a relação de descendência paterna indicada pelo verbo grego.
- source_word: Ἰωσαφάτ
  choice: Josafá
  rationale: Forma portuguesa tradicional e reconhecível do nome do rei de Judá.
- source_word: Ἰωράμ
  choice: Jorão
  rationale: Forma portuguesa consagrada correspondente à forma grega curta, sem substituí-la pela forma hebraica mais longa, Jeorão.
- source_word: Ὀζίαν
  choice: Uzias
  rationale: Forma portuguesa tradicional e reconhecível do nome do rei de Judá, preferível à transliteração grega mais direta “Ozias”.
theological_decisions:
- issue: Representação da sequência genealógica com δὲ e ἐγέννησεν repetidos
  choice: Manter cada elo de pai para filho, usando orações coordenadas naturais e “e” antes do último elo.
  alternative: Reproduzir cada δὲ explicitamente com “e” ou separar as três orações por ponto e vírgula.
  rationale: A solução preserva integralmente a estrutura e a sequência da genealogia, evitando uma repetição artificial em português moderno.
- issue: Harmonizar ou não Ἀσὰφ com o nome histórico esperado, Asa
  choice: Manter “Asafe” no texto principal e registrar “Asa” em nota.
  alternative: Empregar “Asa” no texto principal, em harmonia com a genealogia do Antigo Testamento.
  rationale: A prioridade do texto grego exige representar a forma efetivamente atestada na edição-fonte. A nota conserva com transparência a variante manuscrita e a identificação genealógica esperada, sem corrigir silenciosamente o texto principal.
translation_notes:
  register: Português moderno, claro e digno, com formas portuguesas tradicionais dos nomes bíblicos. A repetição de “gerou” mantém o caráter genealógico do versículo, enquanto a coordenação evita rigidez desnecessária.
