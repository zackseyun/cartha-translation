id: MAT.1.4
reference: Matthew 1:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀρὰμ δὲ ἐγέννησεν τὸν Ἀμιναδάβ, Ἀμιναδὰβ δὲ ἐγέννησεν τὸν Ναασσών, Ναασσὼν δὲ ἐγέννησεν τὸν Σαλμών,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: pt
  text: Arã gerou Aminadabe[a]; Aminadabe gerou Naassom; e Naassom gerou Salmom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Rão”. O texto grego traz Arã (Ἀράμ), enquanto a forma hebraica desta genealogia é frequentemente representada como Rão.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρὰμ
  choice: Arã
  rationale: Translitera diretamente a forma grega Ἀράμ, com grafia portuguesa corrente; a forma veterotestamentária alternativa é indicada em nota.
- source_word: δὲ
  choice: geralmente representado pela sequência e pela pontuação; antes do último elo, “e”
  rationale: Na genealogia, δέ faz avançar a sequência sem contraste forte. A repetição integral de “e” seria menos natural em português; ponto e vírgula e um “e” final preservam a ligação.
- source_word: ἐγέννησεν
  choice: gerou
  rationale: Em contexto genealógico, expressa procriação ou descendência pela linha paterna. “Gerou” é conciso, tradicional e ainda compreensível no português moderno.
- source_word: Ἀμιναδάβ
  choice: Aminadabe
  rationale: Forma bíblica portuguesa reconhecível, ajustada à fonologia e à ortografia do idioma.
- source_word: Ναασσών
  choice: Naassom
  rationale: Forma portuguesa convencional que mantém o vínculo reconhecível com o nome bíblico correspondente.
- source_word: Σαλμών
  choice: Salmom
  rationale: Forma portuguesa convencional e reconhecível para o nome próprio grego Σαλμών.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas onomásticas bíblicas correntes. A estrutura repetitiva da genealogia é preservada, mas a pontuação evita uma sequência artificialmente pesada de conectivos.
