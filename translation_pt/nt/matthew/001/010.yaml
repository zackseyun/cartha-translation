  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: pt
  text: Ezequias gerou Manassés; Manassés gerou Amós[a]; e Amós gerou Josias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas traduções trazem “Amom” aqui, harmonizando o nome com o rei de Judá mencionado em 2 Reis 21; o texto grego de Mateus traz “Amós”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: gerou
  rationale: Em uma genealogia, γεννάω indica geração ou descendência pela linha paterna. “Gerou” é conciso, tradicional sem ser arcaico e natural neste gênero textual.
- source_word: Ἑζεκίας
  choice: Ezequias
  rationale: Adota a forma bíblica portuguesa amplamente reconhecida do nome próprio.
- source_word: Μανασσῆς
  choice: Manassés
  rationale: Adota a forma bíblica portuguesa convencional do nome próprio.
- source_word: Ἀμώς
  choice: Amós
  rationale: Segue diretamente a forma Ἀμώς do texto grego SBLGNT, sem harmonizá-la silenciosamente com o nome do rei Amom em 2 Reis 21.
- source_word: Ἰωσίας
  choice: Josias
  rationale: Adota a forma bíblica portuguesa convencional do nome próprio.
- source_word: δέ
  choice: pontuação; e
  rationale: Na sequência genealógica, δέ funciona como conectivo que faz avançar a lista. Os dois primeiros casos são representados pela pontuação, e o último por “e”, preservando fluidez em português.
theological_decisions:
- issue: Diferença entre o nome no texto grego de Mateus e o nome do rei de Judá no Antigo Testamento
  choice: Manter “Amós” no texto principal, conforme o grego Ἀμώς
  alternative: Usar “Amom” para harmonizar a genealogia com 2 Reis 21 e 2 Crônicas 33
  rationale: A tradução prioriza a evidência do texto grego fornecido. A possível identificação histórica e a forma alternativa são informadas em nota, sem corrigir ou harmonizar silenciosamente Mateus.
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais dos nomes bíblicos. A construção repetitiva conserva o caráter genealógico do original. O marcador [a] foi colocado após “Manassés”, em correspondência com a camada inglesa fornecida, embora a nota trate do nome “Amós” que aparece em seguida.
