id: MAT.1.14
reference: Matthew 1:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: pt
  text: Azor gerou Zadoque; Zadoque gerou Aquim; e Aquim gerou Eliúde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: Azor
  rationale: Nome pessoal transliterado segundo a forma tradicional e amplamente reconhecida em português.
- source_word: δέ
  choice: e; nas duas primeiras ocorrências, expresso pela pontuação
  rationale: Na genealogia, δέ funciona como conectivo sequencial leve. O ponto e vírgula comunica a progressão nas duas primeiras orações, e «e» introduz naturalmente a última, sem tornar a repetição pesada.
- source_word: ἐγέννησεν
  choice: gerou
  rationale: No contexto genealógico, γεννάω indica geração ou descendência pela linha paterna. «Gerou» é a formulação portuguesa tradicional, concisa, clara e ainda corrente nesse gênero textual.
- source_word: τὸν
  choice: não traduzido separadamente
  rationale: O artigo acusativo marca cada nome próprio como objeto direto em grego; em português, nomes próprios nesta construção normalmente dispensam artigo.
- source_word: Σαδώκ
  choice: Zadoque
  rationale: Forma portuguesa tradicional do nome bíblico, reconhecível e natural para leitores modernos.
- source_word: Ἀχίμ
  choice: Aquim
  rationale: Transliteração portuguesa tradicional, com «qu» para representar adequadamente o som consonantal antes de «i».
- source_word: Ἐλιούδ
  choice: Eliúde
  rationale: Forma aportuguesada tradicional, com acento para indicar de modo natural a tonicidade na leitura em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com concisão própria de uma genealogia. A repetição de «gerou» preserva a estrutura do grego; os pontos e vírgulas melhoram a legibilidade sem apagar a ligação sequencial.
