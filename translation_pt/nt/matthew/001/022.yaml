  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/022.yaml
  text: All this happened so that what was spoken by the Lord through the prophet might be fulfilled[a], saying,
translation:
  language: pt
  text: 'Tudo isso[a] aconteceu para que se cumprisse o que foi dito pelo Senhor por meio do profeta, que disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ora, tudo isso aconteceu”. A expressão grega τοῦτο δὲ ὅλον enfatiza a totalidade dos acontecimentos que acabaram de ser narrados.'
    reason: alternativa lexical e esclarecimento do conectivo discursivo
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Tudo isso
  rationale: O demonstrativo neutro singular retoma como um todo os acontecimentos anteriores, e ὅλον ressalta sua totalidade. Em português, “tudo isso” expressa essa referência de modo natural. O conectivo δέ marca a continuação narrativa e não exige uma palavra separada.
- source_word: γέγονεν
  choice: aconteceu
  rationale: O perfeito de γίνομαι descreve o que ocorreu; “aconteceu” é claro, atual e adequado ao fluxo narrativo.
- source_word: ἵνα πληρωθῇ
  choice: para que se cumprisse
  rationale: Preserva a construção de finalidade ou resultado, a voz passiva e a fórmula de cumprimento, sem decidir exclusivamente entre propósito divino e resultado narrativo.
- source_word: τὸ ῥηθὲν
  choice: o que foi dito
  rationale: Reproduz naturalmente em português o particípio passivo substantivado.
- source_word: ὑπὸ κυρίου
  choice: pelo Senhor
  rationale: Mantém o Senhor como agente último daquilo que foi dito, sem acrescentar “Deus”, ausente no grego.
- source_word: διὰ τοῦ προφήτου
  choice: por meio do profeta
  rationale: διά com genitivo indica mediação; “por meio do profeta” distingue com clareza o Senhor, que fala, do profeta, que serve de mediador.
- source_word: λέγοντος
  choice: que disse
  rationale: O particípio introduz a citação seguinte e se refere ao profeta. “Que disse” é mais natural em português do que o decalque “dizendo” neste contexto.
theological_decisions:
- issue: Agência na palavra profética
  choice: “dito pelo Senhor por meio do profeta”
  alternative: “dito pelo profeta da parte do Senhor”
  rationale: A formulação conserva a distinção gramatical entre o Senhor como agente último e o profeta como mediador, sem desenvolver além do texto uma doutrina específica da inspiração.
- issue: Fórmula de cumprimento
  choice: “para que se cumprisse”
  alternative: “com o resultado de que se cumpriu”
  rationale: A construção ἵνα com subjuntivo pode envolver propósito e resultado. A tradução mantém essa tensão em vez de restringi-la a apenas um desses sentidos.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase preserva a agência profética do original, e os dois-pontos preparam naturalmente a citação do versículo seguinte.
