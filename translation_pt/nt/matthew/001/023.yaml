  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: pt
  text: “Eis que a virgem[a] conceberá e dará à luz um filho, e lhe darão o nome de Emanuel[b]” — que, traduzido, significa “Deus conosco”.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em Isaías 7:14, passagem aqui citada, o termo hebraico subjacente também pode ser entendido como “jovem mulher”; o grego citado por Mateus usa παρθένος, normalmente “virgem”, em harmonia com o contexto do nascimento narrado neste capítulo.
    reason: lexical_alternative
  - marker: b
    text: O grego diz literalmente “chamarão o nome dele”; trata-se de um plural indefinido, sem especificar quem lhe dará esse nome.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Eis que
  rationale: Preserva a função de chamar a atenção e o tom elevado da citação profética, em uma expressão corrente no registro bíblico em português.
- source_word: ἡ παρθένος
  choice: a virgem
  rationale: παρθένος normalmente designa uma virgem no grego de Mateus, e o contexto imediato apresenta a concepção como extraordinária. A opção também corresponde ao texto grego de Isaías 7:14 citado por Mateus.
- source_word: ἐν γαστρὶ ἕξει
  choice: conceberá
  rationale: Equivalente português conciso e idiomático da expressão que, literalmente, significa ter no ventre; mantém o valor futuro.
- source_word: τέξεται υἱόν
  choice: dará à luz um filho
  rationale: Expressão natural e clara em português para o ato de dar à luz, preservando o objeto explícito ‘um filho’.
- source_word: καλέσουσιν τὸ ὄνομα αὐτοῦ
  choice: lhe darão o nome de
  rationale: Reproduz naturalmente em português o plural indefinido do verbo grego e conserva a referência explícita ao nome, sem introduzir um sujeito determinado.
- source_word: Ἐμμανουήλ
  choice: Emanuel
  rationale: É a transliteração tradicional e amplamente reconhecida em português, além de se harmonizar com a explicação ‘Deus conosco’.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: que, traduzido, significa
  rationale: Formulação portuguesa natural para o particípio explicativo, deixando claro que Mateus fornece o sentido do nome.
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: Deus conosco
  rationale: Tradução direta, consagrada e semanticamente clara da explicação do nome, sem acrescentar uma interpretação doutrinária.
theological_decisions:
- issue: Sentido de παρθένος em uma passagem central para a concepção virginal
  choice: virgem
  alternative: jovem mulher
  rationale: No contexto narrativo de Mateus 1 e no grego da citação, ‘virgem’ é a leitura lexical e contextual mais adequada. A conhecida questão relativa ao termo hebraico de Isaías 7:14 é indicada em nota, sem substituir o sentido mais provável do texto grego de Mateus.
- issue: Alcance teológico da explicação do nome Emanuel
  choice: Traduzir simplesmente como ‘Deus conosco’
  alternative: Expandir a frase com uma explicação explícita sobre a encarnação
  rationale: O próprio versículo interpreta o nome. A tradução preserva seu peso teológico, mas não acrescenta uma formulação doutrinária que não esteja expressa na frase.
- issue: Sujeito indefinido de καλέσουσιν
  choice: Manter o plural indefinido em ‘lhe darão o nome’
  alternative: 'Converter em passiva: ‘ele será chamado’'
  rationale: O grego emprega a terceira pessoa do plural sem identificar os agentes. A formulação escolhida preserva essa indeterminação em português natural.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. ‘Eis que’ conserva o tom profético sem tornar a frase obscura; ‘lhe darão o nome de’ evita uma construção literal pouco natural, preservando ao mesmo tempo o plural indefinido do original.
