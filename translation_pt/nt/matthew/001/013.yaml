id: MAT.1.13
reference: Matthew 1:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: pt
  text: Zorobabel gerou Abiúde[a]; Abiúde gerou Eliaquim; e Eliaquim gerou Azor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tornou-se pai de»; nas genealogias bíblicas, o verbo repetido pode apresentar a linhagem de forma condensada.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: Zorobabel
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio grego, mantendo continuidade com a personagem bíblica.
- source_word: δέ
  choice: — / e
  rationale: Neste encadeamento genealógico, funciona como conectivo leve, sem contraste forte. A omissão após o primeiro nome e o uso de «e» na última oração produzem fluxo natural em português.
- source_word: ἐγέννησεν
  choice: gerou
  rationale: Verbo conciso, digno e corrente na linguagem genealógica bíblica em português; preserva a fórmula repetida sem recorrer ao arcaizante «engendrou».
- source_word: Ἀβιούδ
  choice: Abiúde
  rationale: Forma aportuguesada tradicional do nome, com acento gráfico para indicar naturalmente a tonicidade final.
- source_word: Ἐλιακίμ
  choice: Eliaquim
  rationale: Forma bíblica portuguesa estabelecida, adequada à forma grega e facilmente reconhecível.
- source_word: Ἀζώρ
  choice: Azor
  rationale: Transliteração simples e convencional em português, sem sinais diacríticos desnecessários.
theological_decisions:
- issue: Sentido de γεννάω numa genealogia que pode condensar gerações
  choice: gerou
  alternative: foi antepassado de
  rationale: «Gerou» mantém a fórmula genealógica direta do grego, mas a nota reconhece que genealogias bíblicas podem apresentar a linhagem de modo condensado. «Foi antepassado de» resolveria no texto uma questão que o original deixa aberta.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com nomes nas formas bíblicas tradicionais em português. A repetição de «gerou» conserva o ritmo formular da genealogia; os pontos e vírgulas tornam a sequência clara.
