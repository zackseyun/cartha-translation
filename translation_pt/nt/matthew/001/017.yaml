id: MAT.1.17
reference: Matthew 1:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: pt
  text: Portanto, todas as gerações desde Abraão até Davi foram catorze gerações; desde Davi até a deportação para a Babilônia, catorze gerações; e desde a deportação para a Babilônia até o Messias[a], catorze gerações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”. O termo grego χριστός é traduzido aqui como “Messias” por funcionar como título no ponto culminante da genealogia.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: Portanto, todas as gerações
  rationale: Preserva tanto a força resumitiva e inferencial de οὖν quanto o sentido abrangente de Πᾶσαι, em português natural e digno.
- source_word: ἀπὸ ... ἕως
  choice: desde ... até
  rationale: Expressa com clareza os limites de cada período genealógico e mantém o paralelismo das três partes.
- source_word: γενεαὶ δεκατέσσαρες
  choice: catorze gerações
  rationale: Mantém a expressão nominal repetida e a estrutura retórica do grego; na primeira parte, o verbo 'foram' torna a frase natural em português.
- source_word: μετοικεσίας Βαβυλῶνος
  choice: exílio para a Babilônia
  rationale: μετοικεσία indica deslocamento ou deportação para o exílio. 'Exílio para a Babilônia' conserva o movimento indicado no contexto genealógico e histórico.
- source_word: τοῦ χριστοῦ
  choice: o Messias
  rationale: Com artigo e no clímax da genealogia, χριστός funciona como título; 'Messias' comunica em português o sentido do título, em vez de apenas transliterá-lo.
- source_word: Ἀβραὰμ / Δαυὶδ / Βαβυλῶνος
  choice: Abraão / Davi / Babilônia
  rationale: Empregam-se as formas portuguesas bíblicas amplamente reconhecidas para os nomes próprios.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, o termo é titular e constitui o ponto culminante messiânico da genealogia. 'Messias' torna explícito o valor semântico do título sem acrescentar uma interpretação denominacional.
- issue: Contagem das gerações
  choice: Preservar literalmente a afirmação de três grupos de catorze
  alternative: Explicar ou harmonizar a contagem no corpo do texto
  rationale: O versículo resume a organização literária da genealogia. A tradução não deve inserir no texto uma solução para questões relativas à contagem.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. O paralelismo triplo foi preservado por meio de ponto e vírgula, evitando tornar a frase pesada. O artigo antes de 'Babilônia' segue o uso brasileiro corrente.
