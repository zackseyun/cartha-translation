id: MAT.1.2
reference: Matthew 1:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀβραὰμ ἐγέννησεν τὸν Ἰσαάκ, Ἰσαὰκ δὲ ἐγέννησεν τὸν Ἰακώβ, Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/002.yaml
  text: Abraham fathered Isaac[a], and Isaac fathered Jacob, and Jacob fathered Judah and his brothers,
translation:
  language: pt
  text: Abraão gerou Isaque[a]; Isaque gerou Jacó; e Jacó gerou Judá e os irmãos dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi pai de”. O verbo grego também pode indicar descendência genealógica, sem necessariamente especificar uma relação de pai e filho imediata em todos os casos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: gerou
  rationale: Em uma genealogia, γεννάω expressa procriação ou descendência pela linha paterna. “Gerou” é a forma portuguesa tradicional, concisa e ainda compreensível; preserva melhor a força genealógica do grego do que uma simples fórmula com “foi pai de”.
- source_word: δὲ
  choice: continuação por ponto e vírgula; na última ocorrência, “e”
  rationale: Aqui δέ é um conectivo leve, sem contraste forte. A pontuação e o “e” final reproduzem com naturalidade a progressão da genealogia em português.
- source_word: Ἰούδαν
  choice: Judá
  rationale: O referente é o patriarca Judá, filho de Jacó; esta é a forma portuguesa convencional do nome.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: os irmãos dele
  rationale: A expressão refere-se especificamente aos irmãos homens de Judá, os demais filhos de Jacó. “Dele” evita a possível ambiguidade de “seus” quanto ao antecedente.
- source_word: Ἀβραὰμ / Ἰσαάκ / Ἰακώβ
  choice: Abraão / Isaque / Jacó
  rationale: Foram empregadas as formas portuguesas convencionais dos nomes bíblicos.
theological_decisions:
- issue: Tradução do verbo genealógico
  choice: Usar “gerou”
  alternative: Usar “foi pai de” ou “tornou-se pai de”
  rationale: “Gerou” conserva a ênfase genealógica e paterna do grego sem afirmar que todos os vínculos da genealogia precisem ser entendidos como gerações imediatamente sucessivas.
translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas amplamente reconhecidas. O ponto e vírgula torna a repetição genealógica fluida sem eliminar sua estrutura. A nota preserva a possível amplitude genealógica de γεννάω.
