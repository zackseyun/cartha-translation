id: MAT.1.12
reference: Matthew 1:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: pt
  text: Depois da deportação para a Babilônia[a], Jeconias gerou Salatiel, e Salatiel gerou Zorobabel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do exílio na Babilônia”. O termo grego se refere à remoção forçada do povo para o exílio babilônico.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: Depois
  rationale: μετά com o acusativo indica sequência temporal. O δέ é uma conexão leve que pode ser naturalmente incorporada em português sem tradução separada.
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: da deportação para a Babilônia
  rationale: μετοικεσία designa remoção ou transferência para o exílio. “Deportação” comunica o caráter imposto do deslocamento, enquanto “para a Babilônia” expressa o destino.
- source_word: Ἰεχονίας
  choice: Jeconias
  rationale: Forma portuguesa bíblica reconhecível do nome grego Ἰεχονίας.
- source_word: ἐγέννησεν
  choice: gerou
  rationale: Em genealogias, γεννάω expressa a geração ou sucessão na linhagem paterna. “Gerou” é conciso, tradicional e ainda compreensível no português atual, sem exigir que cada elo seja biologicamente imediato.
- source_word: Σαλαθιήλ
  choice: Salatiel
  rationale: Forma portuguesa bíblica tradicional e reconhecível correspondente a Σαλαθιήλ.
- source_word: δὲ
  choice: e
  rationale: Na segunda oração, δέ conecta de modo leve os elos sucessivos da genealogia; “e” é a ligação mais natural em português.
- source_word: Ζοροβαβέλ
  choice: Zorobabel
  rationale: Forma portuguesa bíblica amplamente reconhecida correspondente a Ζοροβαβέλ.
theological_decisions:
- issue: Sentido de γεννάω em uma genealogia
  choice: Traduzir por “gerou”, como fórmula de sucessão genealógica, sem afirmar que todos os elos sejam biologicamente imediatos.
  alternative: “foi pai de”
  rationale: A linguagem genealógica pode abranger descendência ou sucessão na linhagem. “Gerou” preserva a fórmula masculina do texto e sua concisão, sem resolver além do necessário o grau de proximidade entre as gerações.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas portuguesas tradicionais dos nomes bíblicos. A construção mantém o ritmo conciso e repetitivo próprio da genealogia.
