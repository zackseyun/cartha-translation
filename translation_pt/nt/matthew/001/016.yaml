id: MAT.1.16
reference: Matthew 1:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: pt
  text: E Jacó gerou José, marido de Maria, da qual nasceu Jesus, que é chamado Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Cristo». Aqui, o termo grego Christós funciona como título e significa «Messias» ou «Ungido».
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: E
  rationale: A partícula dá continuidade à genealogia sem introduzir um contraste forte; «E» reproduz essa ligação de modo natural.
- source_word: ἐγέννησεν
  choice: gerou
  rationale: No contexto genealógico, o verbo indica que Jacó foi pai de José. «Gerou» é conciso, digno e mantém a fórmula recorrente da genealogia.
- source_word: τὸν ἄνδρα Μαρίας
  choice: marido de Maria
  rationale: Embora ἀνήρ também possa significar «homem», a construção com «de Maria» indica aqui a relação conjugal.
- source_word: ἐξ ἧς
  choice: da qual
  rationale: O pronome relativo feminino singular remete especificamente a Maria. «Da qual» preserva tanto essa referência feminina quanto a ideia de origem expressa por ἐκ.
- source_word: ἐγεννήθη
  choice: nasceu
  rationale: 'O passivo marca uma mudança deliberada em relação ao ativo «gerou»: o texto não diz que José gerou Jesus, mas que Jesus nasceu de Maria.'
- source_word: ὁ λεγόμενος
  choice: que é chamado
  rationale: A expressão identifica Jesus pelo título que lhe é atribuído, sem transformar a afirmação em mera opinião ou alegação.
- source_word: χριστός
  choice: Messias
  rationale: Neste contexto, χριστός funciona claramente como título. «Messias» comunica em português o sentido titular de «Ungido», em vez de tratar «Cristo» como parte do nome.
theological_decisions:
- issue: Mudança da fórmula genealógica na referência ao nascimento de Jesus
  choice: «Jacó gerou José», mas Jesus «nasceu» de Maria
  alternative: «José gerou Jesus»
  rationale: O grego passa do ativo ἐγέννησεν para o passivo ἐγεννήθη e emprega o relativo feminino ἐξ ἧς. A tradução conserva essa mudança e não atribui a José a geração de Jesus.
- issue: Sentido de χριστός na fórmula de identificação
  choice: Messias
  alternative: Cristo
  rationale: A construção «que é chamado» apresenta χριστός como título. Traduzir por «Messias» torna explícita sua função titular sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Gerou» preserva a cadência genealógica sem recorrer ao arcaísmo «gerou a» ou a uma paráfrase extensa. A ordem «da qual nasceu Jesus» é idiomática e mantém a referência feminina inequívoca a Maria.
