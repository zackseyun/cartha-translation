id: MAT.1.19
reference: Matthew 1:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: pt
  text: E José, marido dela[a], sendo justo e não querendo expô-la à vergonha pública[b], decidiu divorciar-se dela em segredo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «noivo dela». O grego diz literalmente «homem/marido dela», refletindo a força jurídica do noivado judaico.
    reason: lexical_alternative
  - marker: b
    text: Ou «fazer dela um exemplo» ou «desonrá-la publicamente».
    reason: lexical_alternative
  - marker: c
    text: Ou «em particular». Neste contexto, trata-se da dissolução formal do vínculo durante o período do noivado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: marido dela
  rationale: ἀνήρ pode significar «homem» ou «marido». Aqui, o vínculo juridicamente obrigatório do noivado judaico e o uso de ἀπολῦσαι favorecem «marido»; a nota preserva «noivo» como alternativa contextual.
- source_word: δίκαιος
  choice: justo
  rationale: «Justo» é natural em português e preserva a ressonância moral e teológica de δίκαιος sem definir se a ênfase recai na observância da lei, na compaixão ou em ambas.
- source_word: δειγματίσαι
  choice: expô-la à vergonha pública
  rationale: A expressão comunica a ideia de exposição que resulta em desonra pública, sem especificar um procedimento não declarado pelo texto.
- source_word: ἐβουλήθη
  choice: decidiu
  rationale: O verbo indica intenção ponderada ou resolução; «decidiu» expressa de modo claro a deliberação de José.
- source_word: λάθρᾳ
  choice: em segredo
  rationale: O advérbio significa de maneira oculta ou privada. «Em segredo» preserva diretamente essa ideia; «discretamente» seria uma alternativa mais idiomática, porém menos explícita.
- source_word: ἀπολῦσαι
  choice: divorciar-se dela
  rationale: Neste contexto de noivado judaico juridicamente obrigatório, o verbo se refere à dissolução formal do vínculo; «divorciar-se» torna essa força jurídica clara ao leitor moderno.
- source_word: δὲ
  choice: E
  rationale: δέ funciona como conectivo leve que dá continuidade à narrativa; «E» é adequado e natural neste contexto.
- source_word: ὢν καὶ μὴ θέλων
  choice: sendo ... e não querendo
  rationale: A formulação conserva a estrutura participial e apresenta as circunstâncias que explicam a decisão de José.
theological_decisions:
- issue: Caracterização de José como δίκαιος
  choice: «justo», sem explicar no texto principal se isso significa rigor legal, compaixão ou ambos
  alternative: «íntegro» ou uma paráfrase que enfatize exclusivamente a misericórdia
  rationale: O grego associa a justiça de José à sua recusa em envergonhar Maria, mas não reduz explicitamente essa justiça a uma única dimensão. A tradução preserva essa tensão.
- issue: Situação jurídica de José e Maria
  choice: «marido» e «divorciar-se» no texto principal
  alternative: «noivo» e «romper o noivado», ou os termos mais literais «homem» e «mandar embora»
  rationale: Embora ainda estivessem no período do noivado, esse vínculo judaico tinha força jurídica e exigia dissolução formal. Os termos escolhidos comunicam isso, enquanto a nota registra a etapa específica da relação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha de perto o grego sem sacrificar a naturalidade. «Vergonha pública» explicita a dimensão desonrosa contextual de δειγματίσαι; «em segredo» mantém a distinção de λάθρᾳ. Todos os marcadores de nota aparecem no texto principal.
