  text: The book of the genealogy of Jesus the Messiah[a], the son of David[b], the son of Abraham.
translation:
  language: pt
  text: Livro da genealogia[a] de Jesus, o Messias[b], filho de Davi, filho de Abraão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Livro da origem” ou “Livro do nascimento”. A palavra grega pode ter o sentido mais amplo de “gênese” ou “origem”, embora “genealogia” corresponda melhor à linhagem que vem em seguida.
    reason: alternative_reading
  - marker: b
    text: 'Tradicionalmente: “Jesus Cristo”. Aqui, “Messias” traduz o título grego Χριστός.'
    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος
  choice: Livro
  rationale: βίβλος designa livro, rolo ou registro escrito. Neste cabeçalho sem artigo, “Livro” conserva de modo natural e digno a forma nominal do grego.
- source_word: γενέσεως
  choice: da genealogia
  rationale: γένεσις pode significar origem, nascimento ou genealogia. Como o cabeçalho introduz uma linhagem, “genealogia” é o sentido contextual mais imediato, sem excluir as ressonâncias mais amplas registradas em nota.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Forma portuguesa consagrada do nome próprio.
- source_word: χριστοῦ
  choice: o Messias
  rationale: Χριστός funciona aqui como título e significa o Ungido. “O Messias” torna esse valor titular explícito e preserva o contexto régio e judaico.
- source_word: υἱοῦ Δαυὶδ
  choice: filho de Davi
  rationale: A tradução literal preserva a expressão messiânica estabelecida; no contexto genealógico, “filho” também pode indicar descendência.
- source_word: υἱοῦ Ἀβραάμ
  choice: filho de Abraão
  rationale: A tradução literal mantém o paralelismo grego, o idioma genealógico e a ligação pactual com Abraão; aqui “filho” tem sentido amplo de descendente.
theological_decisions:
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Neste cabeçalho, o termo apresenta a identidade messiânica de Jesus e tem claro valor titular. A forma tradicional “Cristo” é possível, mas pode ser entendida por leitores modernos como parte do nome.
- issue: Sentido de γενέσεως no cabeçalho
  choice: genealogia
  alternative: origem ou nascimento
  rationale: A lista de antepassados que vem em seguida favorece “genealogia”; contudo, a amplitude semântica do grego e sua possível evocação de gênese/origem são preservadas em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O cabeçalho conciso acompanha a estrutura do grego; a repetição “filho de” conserva seu paralelismo e peso messiânico-pactual.
