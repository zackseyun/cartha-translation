id: MAT.1.7
reference: Matthew 1:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Σολομὼν δὲ ἐγέννησεν τὸν Ῥοβοάμ, Ῥοβοὰμ δὲ ἐγέννησεν τὸν Ἀβιά, Ἀβιὰ δὲ ἐγέννησεν τὸν ⸂Ἀσάφ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: pt
  text: Salomão gerou Roboão; Roboão gerou Abias; e Abias gerou Asafe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “Asa”, correspondendo ao rei de Judá mencionado em 1 Reis 15 e 2 Crônicas 14–16; o texto grego adotado aqui traz “Asafe”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: gerou
  rationale: Em uma genealogia, γεννάω indica procriação ou descendência pela linha paterna. “Gerou” é a forma tradicional, concisa e ainda compreensível em português, adequada ao ritmo genealógico.
- source_word: δὲ
  choice: pontuação e “e”
  rationale: Aqui δέ é um conectivo leve que dá continuidade à genealogia, sem sentido adversativo. A pontuação entre as duas primeiras orações e “e” na última reproduzem com naturalidade a sequência em português.
- source_word: Σολομών
  choice: Salomão
  rationale: Forma portuguesa consagrada do nome bíblico.
- source_word: Ῥοβοάμ
  choice: Roboão
  rationale: Forma portuguesa consagrada do nome bíblico, mantendo a continuidade com o Antigo Testamento.
- source_word: Ἀβιά
  choice: Abias
  rationale: Forma portuguesa consagrada correspondente ao nome régio do Antigo Testamento.
- source_word: Ἀσάφ
  choice: Asafe
  rationale: O texto grego impresso traz Ἀσάφ. A tradução conserva essa leitura no texto principal, em vez de harmonizá-la silenciosamente com o nome do rei Asa.
theological_decisions:
- issue: Se o nome Ἀσάφ deve ser harmonizado com a lista dos reis do Antigo Testamento e traduzido como “Asa”
  choice: Manter “Asafe” no texto principal
  alternative: Traduzir como “Asa”
  rationale: A edição grega fornecida traz Ἀσάφ (“Asafe”); por isso, a primazia do texto-fonte exige preservar essa leitura. A variante “Asa”, que corresponde ao rei de Judá, é registrada em nota para garantir transparência textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas tradicionais dos nomes bíblicos. A repetição de “gerou” conserva o caráter formular e o ritmo da genealogia.
