id: MAT.1.3
reference: Matthew 1:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: pt
  text: Judá gerou, de Tamar, Perez e Zerá; Perez gerou Hezrom, e Hezrom gerou Arã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas traduções trazem “Ram” aqui, seguindo outra forma de transliteração ou tradição; o texto grego adotado traz “Arã”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: Judá
  rationale: Forma portuguesa tradicional do patriarca e ancestral tribal, evitando confusão com figuras do Novo Testamento chamadas Judas.
- source_word: δὲ
  choice: pontuação e “e”
  rationale: Aqui δέ é um conectivo leve na sequência genealógica, sem contraste forte; a pontuação e o último “e” reproduzem seu encadeamento com naturalidade.
- source_word: ἐγέννησεν
  choice: gerou
  rationale: Em genealogias, γεννάω indica procriação ou descendência pela linha paterna. “Gerou” é conciso, corrente no registro bíblico português e mais direto que uma perífrase.
- source_word: Φαρὲς
  choice: Perez
  rationale: Corresponde ao hebraico פֶּרֶץ e mantém a forma conhecida no Antigo Testamento em português.
- source_word: Ζάρα
  choice: Zerá
  rationale: Corresponde ao hebraico זֶרַח e preserva a continuidade com a forma veterotestamentária comum em português.
- source_word: ἐκ τῆς Θαμάρ
  choice: com Tamar
  rationale: A construção com ἐκ indica a origem materna. “Com Tamar” expressa de modo natural em português que ela era a mãe, sem ampliar o texto.
- source_word: Θαμάρ
  choice: Tamar
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: Ἑσρώμ
  choice: Hezrom
  rationale: Corresponde ao hebraico חֶצְרוֹן e mantém a forma usual nas genealogias do Antigo Testamento em português.
- source_word: Ἀράμ
  choice: Arã
  rationale: Representa diretamente a forma grega Ἀράμ em ortografia portuguesa, sem harmonizá-la silenciosamente com a forma “Rão” encontrada em outras tradições genealógicas.
theological_decisions:
- issue: Harmonização do último nome com a tradição genealógica do Antigo Testamento
  choice: Arã
  alternative: Rão
  rationale: A fonte grega fornecida traz Ἀράμ; por isso, o texto principal segue essa forma. A variante tradicional “Rão” é registrada em nota para preservar a transparência e a continuidade intertextual sem substituir a evidência grega.
translation_notes:
  register: Português moderno, digno e acessível, com cadência genealógica concisa. Os pontos e vírgulas separam claramente as gerações, e os nomes seguem, quando possível, as formas já familiares no Antigo Testamento em português.
