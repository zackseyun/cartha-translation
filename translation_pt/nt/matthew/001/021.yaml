  text: τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: pt
  text: Ela dará à luz um filho, e você lhe dará o nome de Jesus,[a] pois ele salvará o seu povo dos pecados deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jesus é a forma grega correspondente ao hebraico/aramaico Yeshua, nome relacionado a Josué e associado à ideia de “Yahweh salva”; a explicação de Mateus — “pois ele salvará” — reflete esse jogo de palavras.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέξεται
  choice: dará à luz
  rationale: O futuro de τίκτω, neste contexto de parto, é expresso de modo natural e preciso em português por “dará à luz”.
- source_word: δὲ
  choice: —
  rationale: δέ é um conectivo leve; sua omissão evita rigidez e mantém o fluxo natural em português.
- source_word: υἱὸν
  choice: um filho
  rationale: O acusativo sem artigo após τίκτω é naturalmente traduzido como “um filho”.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: você lhe dará o nome de
  rationale: Esta formulação portuguesa comunica com naturalidade a expressão de nomeação sem perder seu caráter diretivo.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Emprega-se a forma tradicional portuguesa do nome neotestamentário; a associação etimológica pertinente é explicada na nota.
- source_word: αὐτὸς
  choice: ele
  rationale: O pronome explícito identifica Jesus como o agente da salvação. Em português, “ele” preserva adequadamente o foco sem acrescentar uma intensificação potencialmente excessiva como “ele mesmo”.
- source_word: γὰρ
  choice: pois
  rationale: Introduz a razão explicativa para o nome e soa natural no registro digno do texto.
- source_word: σώσει
  choice: salvará
  rationale: O verbo σῴζω, seguido de “seu povo” e “dos pecados deles”, tem aqui sentido salvífico direto, bem representado por “salvará”.
- source_word: τὸν λαὸν αὐτοῦ
  choice: o seu povo
  rationale: Preserva a relação possessiva e as possíveis ressonâncias pactuais sem restringir nem ampliar explicitamente o referente.
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: dos pecados deles
  rationale: Expressa separação ou libertação e preserva o plural de ἁμαρτιῶν; “deles” evita possível ambiguidade possessiva de “seus”.
theological_decisions:
- issue: Ênfase de αὐτὸς na obra salvadora de Jesus
  choice: “ele salvará”
  alternative: “ele mesmo salvará”
  rationale: O pronome explícito é preservado, mas sem intensificação adicional. A ordem e o contexto já mantêm Jesus como agente pessoal da salvação.
- issue: Alcance de “o seu povo”
  choice: Manter “o seu povo” sem definição adicional
  alternative: “o seu povo Israel” ou “todos os que lhe pertencem”
  rationale: O contexto imediato tem caráter judaico e pactual, mas o próprio versículo não delimita mais a expressão; a tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” torna explícito o singular de καλέσεις e é natural no português brasileiro; “lhe dará o nome de” evita o pouco idiomático “chamará o nome dele”. O marcador [a] foi colocado imediatamente após “Jesus”, onde sua relação lexical é mais clara.
