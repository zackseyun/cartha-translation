id: MAT.1.18
reference: Matthew 1:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: pt
  text: 'O nascimento de Jesus, o Messias[a], aconteceu assim: Maria, sua mãe, estava prometida em casamento a José[b]; antes de eles se unirem[c], descobriu-se que ela estava grávida por obra do Espírito Santo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Jesus Cristo”. O título grego Χριστός significa “Messias”.
    reason: alternative_reading
  - marker: b
    text: Esse compromisso matrimonial era formal e juridicamente reconhecido, sendo mais vinculante do que o noivado costuma ser hoje.
    reason: cultural_note
  - marker: c
    text: A expressão pode indicar que ainda não tinham consumado a união matrimonial.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: nascimento
  rationale: No contexto, o termo introduz o relato de como Jesus veio ao mundo. “Nascimento” é claro e natural, embora o grego também possa ter o sentido mais amplo de “origem”.
- source_word: Ἰησοῦ χριστοῦ
  choice: Jesus, o Messias
  rationale: Χριστός funciona aqui como título. “Messias” comunica seu significado, e a construção com artigo é idiomática em português.
- source_word: οὕτως ἦν
  choice: aconteceu assim
  rationale: A expressão introduz o modo como o acontecimento se deu, em linguagem portuguesa direta e natural.
- source_word: μνηστευθείσης
  choice: estava prometida em casamento
  rationale: A expressão evita o caráter arcaico de “desposada” e comunica um compromisso matrimonial formal, esclarecido em nota.
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: antes de eles se unirem
  rationale: Preserva o eufemismo e a amplitude do grego, que pode abranger a união conjugal e sua consumação, sem explicitar além do texto.
- source_word: εὑρέθη
  choice: descobriu-se
  rationale: Mantém a perspectiva passiva do grego de que a gravidez veio a ser constatada, sem identificar quem a descobriu.
- source_word: ἐν γαστρὶ ἔχουσα
  choice: estava grávida
  rationale: Equivalente atual e natural do idioma grego que significa literalmente ter no ventre.
- source_word: ἐκ πνεύματος ἁγίου
  choice: por obra do Espírito Santo
  rationale: Expressão portuguesa natural para indicar que a gravidez tinha sua origem no Espírito Santo. A formulação preserva a referência pessoal e divina sem sugerir uma força espiritual indefinida.
theological_decisions:
- issue: Sentido de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: O termo tem força titular nesta introdução narrativa; traduzir seu significado torna essa função transparente ao leitor.
- issue: Referência de πνεύματος ἁγίου
  choice: o Espírito Santo
  alternative: espírito santo
  rationale: No contexto da narrativa de Mateus, a expressão se refere ao Espírito Santo divino. A ausência de artigo no grego não exige uma leitura indefinida.
- issue: Origem da gravidez indicada por ἐκ
  choice: por obra do Espírito Santo
  alternative: do Espírito Santo
  rationale: A formulação expressa a origem divina indicada por ἐκ em português natural, sem desenvolver uma explicação biológica ou teológica que o versículo não fornece.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Prometida em casamento” evita tanto o arcaísmo de “desposada” quanto a possível fraqueza cultural de “noiva”. Os marcadores foram posicionados junto às expressões que explicam.
