  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: pt
  text: Uzias gerou Jotão[a]; Jotão gerou Acaz; e Acaz gerou Ezequias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego ἐγέννησεν também pode ser traduzido por «foi pai de»; aqui se usa «gerou» para preservar a fórmula concisa e repetitiva da genealogia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀζίας
  choice: Uzias
  rationale: Emprega a forma consagrada em português para o rei de Judá correspondente ao nome grego Ὀζίας.
- source_word: δὲ
  choice: pontuação e «e» na última oração
  rationale: Neste encadeamento genealógico, δέ é um conectivo leve. O ponto e vírgula preserva a progressão sem tornar a repetição pesada, e «e» explicita a ligação final.
- source_word: ἐγέννησεν
  choice: gerou
  rationale: Em genealogias, γεννάω indica descendência paterna. «Gerou» é a formulação bíblica tradicional ainda clara em português moderno e mantém a concisão e o ritmo repetitivo do grego.
- source_word: Ἰωαθάμ
  choice: Jotão
  rationale: Forma bíblica portuguesa consagrada para o rei de Judá designado pelo grego Ἰωαθάμ.
- source_word: Ἀχάζ
  choice: Acaz
  rationale: Forma bíblica portuguesa consagrada, em vez de uma transliteração mais estrita da grafia grega.
- source_word: Ἑζεκίαν
  choice: Ezequias
  rationale: Forma bíblica portuguesa consagrada para o rei de Judá correspondente ao grego Ἑζεκίας.
theological_decisions:
- issue: Força genealógica de γεννάω
  choice: gerou
  alternative: foi pai de; tornou-se pai de; foi antepassado de
  rationale: A fórmula estilizada de Mateus apresenta sucessão paterna de modo direto. «Gerou» preserva essa formulação e o ritmo literário sem ampliar interpretativamente para «foi antepassado de», embora genealogias bíblicas possam omitir gerações.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas tradicionais dos nomes bíblicos. A repetição deliberada de «gerou» reproduz a estrutura genealógica, enquanto os pontos e vírgulas tornam a leitura natural.
