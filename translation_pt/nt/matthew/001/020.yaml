id: MAT.1.20
reference: Matthew 1:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: pt
  text: 'Enquanto ele refletia sobre essas coisas, eis que um anjo do Senhor lhe apareceu em sonho e disse: “José, filho de Davi, não tenha medo de receber Maria, sua esposa,[a] pois o que nela foi gerado vem do Espírito Santo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “receber Maria como sua esposa”. A expressão grega se refere a recebê-la consigo no casamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: enquanto ele refletia
  rationale: Expressa a deliberação interior de José sem transformá-la numa decisão já tomada; a construção temporal reproduz o valor do genitivo absoluto.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva o marcador discursivo que introduz de modo vívido a intervenção inesperada na narrativa.
- source_word: ἄγγελος κυρίου
  choice: um anjo do Senhor
  rationale: A ausência de artigo diante de ἄγγελος favorece o indefinido, sem impor a identificação mais específica sugerida pela fórmula 'o Anjo do Senhor'.
- source_word: κατ’ ὄναρ
  choice: em sonho
  rationale: É a forma idiomática e concisa em português para a expressão grega.
- source_word: ἐφάνη
  choice: apareceu
  rationale: Verbo natural para uma aparição reveladora na narrativa.
- source_word: υἱὸς Δαυίδ
  choice: filho de Davi
  rationale: Mantém tanto a referência genealógica quanto a ressonância davídica da forma de tratamento.
- source_word: μὴ φοβηθῇς
  choice: não tenha medo
  rationale: Formulação corrente e digna que comunica a proibição e o sentido emocional do verbo.
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: receber Maria, sua esposa
  rationale: παραλαμβάνω indica aqui acolher Maria consigo no âmbito do casamento; a aposição 'sua esposa' reflete diretamente τὴν γυναῖκά σου sem sugerir que ela só então adquiriria esse status.
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: o que nela foi gerado
  rationale: Conserva a forma neutra e substantivada do particípio e evita estreitar o termo a uma formulação médica específica; no contexto, refere-se ao ser concebido em seu ventre.
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: vem do Espírito Santo
  rationale: Comunica com naturalidade a ideia de fonte ou origem expressa por ἐκ.
theological_decisions:
- issue: Sentido de κυρίου em ἄγγελος κυρίου
  choice: do Senhor
  alternative: de YHWH / o Anjo do Senhor
  rationale: Traduz κύριος de modo convencional sem converter o anjo indefinido do grego numa figura teofânica específica.
- issue: Referência de πνεύματός ... ἁγίου
  choice: do Espírito Santo
  alternative: de um espírito santo / do poder do Espírito Santo
  rationale: No contexto da narrativa de Mateus, a expressão designa o Espírito Santo como origem divina, sem acrescentar a noção de uma força impessoal.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. 'Eis que' preserva deliberadamente a vividez narrativa do original; 'receber Maria, sua esposa' mantém a relação marital já indicada pelo grego, enquanto a nota registra a alternativa idiomática.
