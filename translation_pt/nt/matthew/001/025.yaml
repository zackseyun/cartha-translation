id: MAT.1.25
reference: Matthew 1:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ ἔτεκεν ⸀υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: pt
  text: E não teve relações conjugais com ela até que ela deu à luz um filho; e ele lhe deu o nome de Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Até que” indica o que era verdade até o nascimento de Jesus; por si só, a expressão não determina o que aconteceu depois.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: teve relações conjugais
  rationale: Neste contexto, γινώσκω (“conhecer”) é um eufemismo para relações sexuais. A formulação explícita comunica naturalmente em português o sentido pretendido, sem o possível equívoco de “não a conheceu”.
- source_word: ἕως οὗ
  choice: até que
  rationale: Equivalente temporal corrente, que indica o que era verdade até o parto sem determinar, por si só, o que ocorreu depois.
- source_word: ἔτεκεν
  choice: deu à luz
  rationale: Expressão portuguesa atual e natural para o ato de dar à luz.
- source_word: υἱόν
  choice: um filho
  rationale: O substantivo grego sem artigo é naturalmente expresso de modo indefinido neste contexto.
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: ele lhe deu o nome de Jesus
  rationale: Reproduz idiomaticamente em português o sentido da expressão semítica presente no grego, evitando a construção pouco natural “chamou o nome dele Jesus”.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: É a forma convencional do nome no Novo Testamento em português.
theological_decisions:
- issue: Implicação de “até que” quanto à virgindade posterior de Maria
  choice: Traduzir ἕως οὗ como “até que”, sem afirmar se houve ou não relações conjugais depois do nascimento.
  alternative: Alguns entendem que a expressão sugere o início posterior das relações conjugais; outros sustentam que ela não implica mudança alguma depois do limite temporal mencionado.
  rationale: A expressão grega estabelece o que era verdade até o nascimento de Jesus, mas não resolve por si mesma o que aconteceu depois. A nota preserva essa tensão sem impor uma conclusão denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preferiu-se explicitar o eufemismo sexual grego para evitar ambiguidade involuntária em português; a expressão sobre dar o nome foi vertida de modo idiomático.
