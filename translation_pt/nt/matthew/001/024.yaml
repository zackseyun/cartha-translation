  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: pt
  text: Então José, ao acordar do sono, fez como o anjo do Senhor lhe havia ordenado e tomou sua esposa consigo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “recebeu sua esposa”. O verbo grego pode ter o sentido de tomar ou receber alguém consigo, inclusive em sua casa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς ... ἀπὸ τοῦ ὕπνου
  choice: ao acordar do sono
  rationale: Expressa de modo natural em português a ação anterior do particípio aoristo e conserva a referência explícita ao sono.
- source_word: δὲ
  choice: Então
  rationale: Marca a progressão narrativa, sem introduzir um contraste forte.
- source_word: ἐποίησεν ὡς
  choice: fez como
  rationale: Preserva de maneira clara e direta a ideia de agir em conformidade com a ordem recebida.
- source_word: προσέταξεν
  choice: havia ordenado
  rationale: O verbo indica uma determinação dotada de autoridade; o mais-que-perfeito composto torna clara, em português, a anterioridade da ordem em relação à ação de José.
- source_word: ὁ ἄγγελος κυρίου
  choice: o anjo do Senhor
  rationale: É uma tradução transparente da construção grega e preserva a expressão bíblica reconhecível em português.
- source_word: παρέλαβεν
  choice: recebeu
  rationale: Neste contexto matrimonial, παραλαμβάνω pode indicar receber ou tomar alguém consigo; “recebeu” é natural e evita a possível impressão moderna de posse presente em “tomou”.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: sua esposa
  rationale: O contexto jurídico-matrimonial determina o sentido de γυνή como “esposa”, sem implicar por si só a consumação do casamento.
theological_decisions:
- issue: Sentido de γυνή antes da consumação do casamento
  choice: sua esposa
  alternative: a mulher
  rationale: Mateus apresenta Maria dentro de um vínculo matrimonial reconhecido, embora o versículo seguinte esclareça que ainda não haviam tido relações conjugais. “Esposa” reflete esse enquadramento sem acrescentar consumação.
- issue: Tradução de κύριος em ἄγγελος κυρίου
  choice: o anjo do Senhor
  alternative: o anjo de Yahweh
  rationale: “Senhor” traduz diretamente κύριος no texto grego e preserva a formulação bíblica tradicional sem introduzir no corpo do texto uma reconstrução do nome divino.
- issue: Amplitude semântica de παρέλαβεν
  choice: recebeu, com alternativa em nota
  alternative: tomou consigo / levou para casa
  rationale: O verbo admite mais de uma nuance contextual. A tradução principal é idiomática, enquanto a nota conserva a possibilidade de acolhimento na própria casa sem decidir além do que o grego exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “ao acordar” evita rigidez excessiva, e “recebeu sua esposa” mantém a concisão enquanto a nota registra a amplitude do verbo grego.
