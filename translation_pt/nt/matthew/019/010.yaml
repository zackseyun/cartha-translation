id: MAT.19.10
reference: Matthew 19:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Εἰ οὕτως ἐστὶν ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός, οὐ συμφέρει γαμῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: pt
  text: 'Os discípulos lhe disseram: “Se essa é a situação do homem com sua esposa, não convém casar.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se esse é o caso do homem com uma esposa”. A expressão grega é compacta, e αἰτία também pode ser traduzida como “caso”, “condição” ou “circunstância”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ οἱ μαθηταί
  choice: Os discípulos lhe disseram
  rationale: O presente grego funciona como presente histórico; o pretérito perfeito é a forma narrativa natural em português. «Discípulos» preserva o termo habitual dos Evangelhos.
- source_word: Εἰ οὕτως ἐστὶν ἡ αἰτία
  choice: Se essa é a situação
  rationale: A expressão compacta retoma o ensino anterior de Jesus. Aqui αἰτία indica situação, condição ou caso, não causa em sentido estrito.
- source_word: τοῦ ἀνθρώπου μετὰ τῆς γυναικός
  choice: do homem com sua esposa
  rationale: O contexto matrimonial favorece «esposa» para γυνή. «Homem» mantém a referência masculina explícita do grego; «sua» explicita de modo idiomático a relação conjugal.
- source_word: οὐ συμφέρει
  choice: não convém
  rationale: Em português corrente, «não convém» expressa naturalmente a ideia de não ser vantajoso ou recomendável, sem sugerir impossibilidade moral.
- source_word: γαμῆσαι
  choice: casar
  rationale: O infinitivo simples é natural, claro e corresponde diretamente ao ato de contrair matrimônio.
theological_decisions:
- issue: Linguagem de gênero em ἀνθρώπου ... γυναικός
  choice: do homem com sua esposa
  alternative: da pessoa com seu cônjuge
  rationale: O contexto imediato trata do casamento em termos de homem e mulher, e o texto grego traz o masculino singular em relação a γυνή no sentido de esposa. A tradução preserva esse enquadramento sem neutralizá-lo.
- issue: Força pragmática de οὐ συμφέρει
  choice: não convém casar
  alternative: não é vantajoso casar
  rationale: «Não convém» conserva a avaliação prática dos discípulos, sem transformá-la em proibição ou ensinamento normativo de Jesus.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva a concisão e a reação pragmática dos discípulos. O marcador foi colocado após a frase a que a nota se refere.
