  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Τί οὖν Μωϋσῆς ἐνετείλατο δοῦναι βιβλίον ἀποστασίου καὶ ἀπολῦσαι ⸀αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/007.yaml
  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
translation:
  language: pt
  text: 'Eles lhe disseram: “Por que, então, Moisés ordenou dar uma certidão de divórcio e mandá-la embora[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “divorciá-la”. O verbo grego pode significar “mandar embora” e, neste contexto, funciona como termo para o divórcio.
    reason: Alternativa lexical que explicita o sentido jurídico-contextual do verbo sem eliminar do texto principal sua imagem concreta.
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Eles lhe disseram
  rationale: O presente histórico grego é expresso no passado para manter a fluidez natural da narrativa em português, sem alterar o sentido.
- source_word: Τί οὖν
  choice: Por que, então
  rationale: No contexto, a expressão introduz uma objeção ao ensino anterior de Jesus; a formulação comunica melhor essa força argumentativa do que o literal “Que, então”.
- source_word: ἐνετείλατο
  choice: ordenou
  rationale: O verbo indica uma ordem. A tradução preserva a maneira como os interlocutores formulam a questão, sem antecipar a correção apresentada por Jesus no versículo seguinte.
- source_word: δοῦναι
  choice: dar
  rationale: Reproduz de modo direto o infinitivo que complementa “ordenou”.
- source_word: βιβλίον ἀποστασίου
  choice: uma certidão de divórcio
  rationale: A expressão designa o documento escrito ligado ao divórcio em Deuteronômio 24:1; “certidão de divórcio” é clara e conserva o caráter jurídico do documento.
- source_word: καὶ ἀπολῦσαι αὐτήν
  choice: e mandá-la embora
  rationale: A expressão conserva a imagem de dispensar ou mandar embora a esposa, ao mesmo tempo que o contexto e a menção à certidão deixam claro que se trata de divórcio.
theological_decisions:
- issue: Se a formulação dos interlocutores deve ser harmonizada antecipadamente com a resposta de Jesus no versículo seguinte
  choice: Manter “ordenou” no texto principal
  alternative: “permitiu” ou “deixou”
  rationale: O grego deste versículo diz explicitamente “ordenou”. Embora Jesus caracterize a disposição mosaica de outra maneira no versículo seguinte, a tradução deve preservar aqui a formulação dos interlocutores e a tensão do diálogo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem sintática evita acrescentar “nos”, ausente do grego, e mantém a distinção entre a certidão e o ato de mandar embora.
