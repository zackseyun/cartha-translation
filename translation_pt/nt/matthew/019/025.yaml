id: MAT.19.25
reference: Matthew 19:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ οἱ ⸀μαθηταὶ ἐξεπλήσσοντο σφόδρα λέγοντες· Τίς ἄρα δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: pt
  text: 'Quando ouviram isso, os discípulos ficaram muito espantados e perguntaram: “Quem, então, pode ser salvo?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Quando ouviram isso
  rationale: O particípio aoristo apresenta a circunstância anterior à reação principal. A oração temporal é natural em português, e “isso” retoma explicitamente a declaração anterior de Jesus.
- source_word: δὲ
  choice: '[conexão implícita]'
  rationale: δέ indica continuação ou leve contraste; a oração inicial “Quando ouviram isso” já realiza naturalmente a transição, sem exigir uma conjunção adicional.
- source_word: μαθηταὶ
  choice: os discípulos
  rationale: É a designação corrente e contextualmente precisa para os discípulos de Jesus nos Evangelhos.
- source_word: ἐξεπλήσσοντο
  choice: ficaram ... espantados
  rationale: Expressa a forte reação de choque. Embora o grego use o imperfeito, em português narrativo a construção com “ficaram” comunica de modo natural a reação desencadeada pelo que ouviram.
- source_word: σφόδρα
  choice: profundamente
  rationale: Preserva a forte intensificação do espanto e forma uma combinação natural e digna em português.
- source_word: λέγοντες
  choice: e perguntaram
  rationale: O particípio introduz a fala que contém uma pergunta; convertê-lo em verbo finito produz narrativa natural em português, e “perguntaram” explicita corretamente a função da fala.
- source_word: Τίς
  choice: Quem
  rationale: Pronome interrogativo referente a pessoa, traduzido de forma direta e idiomática.
- source_word: ἄρα
  choice: então
  rationale: Marca a conclusão inferida pelos discípulos a partir da afirmação anterior de Jesus, preservando também o tom de surpresa.
- source_word: δύναται
  choice: pode
  rationale: Expressa capacidade ou possibilidade de modo direto e natural.
- source_word: σωθῆναι
  choice: ser salvo
  rationale: No contexto de entrar no Reino, preserva o sentido soteriológico e a forma passiva sem especificar indevidamente o agente ou o modo da salvação.
theological_decisions:
- issue: Sentido de σωθῆναι no contexto
  choice: ser salvo
  alternative: ser resgatado / ser liberto
  rationale: A pergunta decorre do ensino sobre entrar no Reino e tem alcance soteriológico, não meramente o sentido de livramento temporal. A formulação mantém o peso teológico e a passiva do grego sem impor uma explicação denominacional sobre como a salvação acontece.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a intensidade da reação e a inferência marcada por ἄρα, sem tornar o versículo excessivamente literal.
