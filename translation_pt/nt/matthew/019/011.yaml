  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐ πάντες χωροῦσι τὸν λόγον ⸀τοῦτον ἀλλ’ οἷς δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: pt
  text: 'Mas ele lhes disse: “Nem todos conseguem aceitar esta palavra[a], mas somente aqueles a quem isso foi dado.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esta declaração”, “este ensinamento” ou “este dito”.
    reason: lexical_alternative
  - marker: b
    text: A forma passiva “foi dado” provavelmente implica Deus como aquele que dá, mas o grego não declara explicitamente o agente.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: disse
  rationale: Forma narrativa natural e direta para o aoristo de λέγω.
- source_word: Οὐ πάντες
  choice: Nem todos
  rationale: Expressão portuguesa idiomática que preserva a negação do alcance universal.
- source_word: χωροῦσι
  choice: conseguem aceitar
  rationale: No contexto, χωρέω transmite a ideia de ter capacidade ou espaço interior para acolher a declaração; esta formulação é clara sem apagar a nuance de capacidade.
- source_word: τὸν λόγον τοῦτον
  choice: esta palavra
  rationale: Preserva a ligação lexical com λόγος e remete à declaração anterior; a nota registra alternativas naturais.
- source_word: ἀλλ’ οἷς
  choice: mas somente aqueles a quem
  rationale: Explicita em português corrente a força restritiva do contraste.
- source_word: δέδοται
  choice: isso foi dado
  rationale: Mantém a voz passiva e o agente não expresso. O perfeito grego indica uma dádiva concedida com efeito vigente; o pretérito perfeito passivo é natural neste contexto.
theological_decisions:
- issue: Identidade do agente implícito em δέδοται
  choice: Manter a construção passiva sem nomear quem concede
  alternative: mas somente aqueles a quem Deus concedeu isso
  rationale: Embora seja provável que a passiva implique Deus como agente, o grego não o identifica explicitamente; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Nem todos conseguem aceitar” comunica naturalmente o valor idiomático de χωροῦσι, enquanto “esta palavra” conserva a formulação mais próxima do grego. Os marcadores aparecem no texto principal.
