base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/020.yaml
  text: The young man says to him[a], “All these I have kept[b]. What do I still lack?”
translation:
  language: pt
  text: 'O jovem lhe disse: “Tenho obedecido a tudo isso. O que ainda me falta?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: disse
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma mais natural na narrativa em português, sem mudar a sequência dos acontecimentos.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome dativo é expresso de modo idiomático como objeto indireto de “disse”.
- source_word: ὁ νεανίσκος
  choice: O jovem
  rationale: νεανίσκος designa um homem jovem; “o jovem” é natural e não acrescenta a ideia de governante, ausente neste versículo.
- source_word: Πάντα ταῦτα
  choice: a tudo isso
  rationale: A expressão retoma coletivamente os mandamentos mencionados; com “obedecer”, a preposição “a” é exigida em português.
- source_word: ἐφύλαξα
  choice: Tenho obedecido
  rationale: No contexto de mandamentos, φυλάσσω significa guardar ou observar. “Tenho obedecido” comunica naturalmente uma conduta passada com relevância presente, sem endossar nem contestar a alegação.
- source_word: τί
  choice: O que
  rationale: Introduz diretamente a pergunta de modo claro e idiomático.
- source_word: ἔτι
  choice: ainda
  rationale: Preserva a ideia de algo que permanece ou continua faltando.
- source_word: ὑστερῶ
  choice: me falta
  rationale: ὑστερέω pode indicar falta ou deficiência; “o que ainda me falta?” é conciso, natural e mantém aberta a natureza dessa carência.
theological_decisions:
- issue: Autoavaliação da obediência
  choice: A fala apresenta diretamente a alegação do jovem, sem indicar aprovação, ironia ou censura.
  alternative: Traduzir de modo que sugira que a alegação é equivocada ou exagerada.
  rationale: O grego não julga explicitamente a afirmação neste ponto; a tradução preserva a tensão para que o contexto narrativo a desenvolva.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O pretérito “disse” soa mais natural que a preservação mecânica do presente histórico. “Tenho obedecido” evita o tom mais marcado de “tenho guardado” e expressa com clareza a observância dos mandamentos.
