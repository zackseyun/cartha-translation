  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: pt
  text: 'Ele lhes disse: “Foi por causa da dureza do coração de vocês[a] que Moisés permitiu que vocês se divorciassem de suas esposas[b]; mas, desde o princípio, não tem sido assim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em vista da dureza do coração de vocês”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “mandar embora suas esposas”; neste contexto, a expressão significa divorciar-se delas.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Ele lhes disse
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma natural na narrativa portuguesa, sem alterar o sentido do diálogo.
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: por causa da dureza do coração de vocês
  rationale: A expressão comunica o valor causal de πρός com acusativo e preserva a imagem bíblica concreta de σκληροκαρδία.
- source_word: ἐπέτρεψεν
  choice: permitiu
  rationale: O verbo indica concessão ou permissão, não mandamento nem aprovação positiva.
- source_word: ἀπολῦσαι
  choice: se divorciassem
  rationale: Embora o sentido básico seja mandar embora, no contexto matrimonial o verbo designa o divórcio; a construção reflexiva é idiomática em português.
- source_word: τὰς γυναῖκας ὑμῶν
  choice: suas mulheres
  rationale: No contexto, γυναῖκας significa esposas. “Suas mulheres” é natural e amplamente compreensível em português, preservando a maneira corrente de designar a relação conjugal.
- source_word: ἀπ’ ἀρχῆς
  choice: desde o princípio
  rationale: Mantém a alusão ao princípio da criação no contexto imediato e corresponde de perto à expressão grega.
- source_word: οὐ γέγονεν οὕτως
  choice: não tem sido assim
  rationale: O pretérito perfeito composto reflete o perfeito grego e apresenta uma realidade estabelecida desde o princípio até o ponto do discurso, sem explicitar além do texto.
theological_decisions:
- issue: Se a ação de Moisés deve ser apresentada como mandamento, concessão ou permissão
  choice: Moisés permitiu
  alternative: Moisés ordenou
  rationale: ἐπέτρεψεν expressa permissão. Assim se preserva a distinção feita por Jesus entre a concessão mosaica diante da dureza humana e a realidade original.
- issue: Se a referência ao princípio deve ser explicitada como propósito ou ordem de Deus
  choice: mas, desde o princípio, não tem sido assim
  alternative: mas esse não era o plano de Deus desde a criação
  rationale: A tradução conserva a formulação concisa do grego e deixa que o contexto estabeleça a alusão à criação, sem acrescentar uma interpretação doutrinária ao texto principal.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Emprega “vocês” para o plural de segunda pessoa e evita arcaísmos. A redação preserva a concessão indicada pelo grego e a tensão entre essa concessão e o princípio da criação.
