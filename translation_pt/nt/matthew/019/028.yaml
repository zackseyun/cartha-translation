id: MAT.19.28
reference: Matthew 19:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: pt
  text: 'Jesus lhes disse: “Em verdade lhes digo: na renovação[a], quando o Filho do Homem se sentar no trono da sua glória, vocês que me seguiram também se sentarão em doze tronos, julgando[b] as doze tribos de Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “na regeneração”, “no novo mundo” ou “no renascimento”. Aqui, a expressão provavelmente se refere à futura renovação associada ao reinado do Filho do Homem, e não ao novo nascimento individual.
    reason: lexical_alternative
  - marker: b
    text: “Julgando” também pode ter o sentido de exercer governo ou autoridade.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Em verdade
  rationale: Preserva a fórmula solene e enfática de Jesus em linguagem portuguesa corrente e digna, sem exigir que o leitor interprete o empréstimo semítico “amém”.
- source_word: ἀκολουθήσαντές μοι
  choice: vocês que me seguiram
  rationale: Identifica diretamente os destinatários por terem seguido Jesus e mantém explícito o objeto pessoal “me”.
- source_word: παλιγγενεσίᾳ
  choice: na renovação
  rationale: Mantém a amplitude lexical do termo, que pode indicar renovação, regeneração ou renascimento, enquanto o contexto aponta para a futura renovação ligada ao reinado do Filho do Homem.
- source_word: ὅταν καθίσῃ
  choice: quando ... se sentar
  rationale: Expressa naturalmente em português a referência temporal futura da construção grega com ὅταν e subjuntivo aoristo.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Conserva o título tradicional e suas ressonâncias bíblicas e messiânicas.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: no trono da sua glória
  rationale: Reproduz a construção genitiva e seu tom elevado, sem reduzi-la simplesmente a um adjetivo.
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: vocês ... também se sentarão
  rationale: O advérbio “também” representa καί e preserva o paralelo enfático entre a entronização do Filho do Homem e a dos seguidores.
- source_word: ἐπὶ δώδεκα θρόνους
  choice: em doze tronos
  rationale: É a formulação locativa natural em português para pessoas sentadas em tronos.
- source_word: κρίνοντες
  choice: julgando
  rationale: Preserva o sentido lexical mais direto, sem excluir a possível conotação de exercer autoridade ou governo.
- source_word: φυλὰς τοῦ Ἰσραήλ
  choice: as doze tribos de Israel
  rationale: É a tradução convencional, precisa e imediatamente compreensível da expressão.
theological_decisions:
- issue: Sentido de παλιγγενεσία neste contexto
  choice: renovação futura associada à entronização do Filho do Homem
  alternative: regeneração individual; novo mundo; nova era
  rationale: O contexto imediato trata de entronização e julgamento futuros, não da conversão individual. “Renovação” mantém a referência escatológica sem impor um esquema milenar ou denominacional específico.
- issue: Alcance de κρίνοντες
  choice: julgando
  alternative: governando; exercendo autoridade
  rationale: O verbo exprime diretamente julgamento, embora no contexto régio possa abranger governo. O texto principal mantém o sentido direto, e a nota registra a amplitude possível.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita a artificialidade regional de “vós”; “lhes digo” conserva a formalidade natural. Os marcadores foram colocados junto aos termos que explicam: [a] após “renovação” e [b] após “julgando”.'
