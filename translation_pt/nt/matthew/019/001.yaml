id: MAT.19.1
reference: Matthew 19:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, μετῆρεν ἀπὸ τῆς Γαλιλαίας καὶ ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/001.yaml
  text: And it happened that when Jesus had finished these words[a], he departed from Galilee and came into the region of Judea beyond the Jordan.
translation:
  language: pt
  text: E aconteceu que, quando Jesus terminou essas palavras, partiu da Galileia e chegou à região da Judeia, além do Jordão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «do outro lado do Jordão».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: E aconteceu que
  rationale: Preserva a fórmula narrativa característica de Mateus em português claro, sem recorrer ao arcaico «e sucedeu que».
- source_word: ὅτε ἐτέλεσεν
  choice: quando Jesus terminou
  rationale: Expressa a conclusão do discurso antes da ação seguinte; a sequência temporal fica clara sem necessidade de uma forma verbal composta.
- source_word: τοὺς λόγους τούτους
  choice: essas palavras
  rationale: Refere-se ao discurso imediatamente anterior. «Palavras» preserva a formulação ampla de λόγους, sem sugerir apenas máximas isoladas.
- source_word: μετῆρεν ἀπὸ τῆς Γαλιλαίας
  choice: partiu da Galileia
  rationale: Traduz de modo natural tanto a ideia de deixar um lugar como o ponto de origem indicado por ἀπό.
- source_word: ἦλθεν εἰς
  choice: chegou à
  rationale: Comunica o movimento até a nova região de maneira idiomática em português; «veio para» dependeria mais do ponto de vista do narrador.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: à região da Judeia
  rationale: Neste contexto de viagem, ὅρια designa território ou região, não necessariamente uma linha fronteiriça precisa.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: além do Jordão
  rationale: Mantém a expressão geográfica concisa e tradicional, indicando o lado oposto do rio sem explicitar um ponto de referência que o grego deixa implícito.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se a fórmula narrativa «E aconteceu que», mas o restante da frase segue uma ordem natural. A vírgula antes de «além do Jordão» mantém aberta a relação geográfica da expressão, sem impor uma delimitação territorial mais precisa do que a do grego.
