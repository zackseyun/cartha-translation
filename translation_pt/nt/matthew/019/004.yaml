base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/004.yaml
  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: pt
  text: 'Ele respondeu: “Vocês não leram[a] que aquele que os criou[b] desde o princípio os fez homem e mulher?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não leram…?”'
    reason: Alternativa idiomática que omite o pronome explícito, como é comum em português, sem mudar o sentido.
  - marker: b
    text: 'Ou: “o Criador”. O grego diz literalmente “aquele que criou”.'
    reason: Registra a alternativa lexical natural para o particípio substantivado e esclarece a forma do original.
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ele respondeu
  rationale: A construção com particípio e verbo finito é idiomática no grego; em português, “respondeu” comunica naturalmente a ideia sem a redundância de “respondendo, disse”.
- source_word: Οὐκ ἀνέγνωτε
  choice: Vocês não leram
  rationale: A pergunta negativa repreende os ouvintes por não levarem em conta uma passagem conhecida das Escrituras. O pretérito perfeito é a forma corrente e natural em português.
- source_word: ὁ κτίσας
  choice: aquele que os criou
  rationale: Reproduz de modo transparente o particípio substantivado, sem transformá-lo desnecessariamente no título interpretativo “o Criador”.
- source_word: ἀπ’ ἀρχῆς
  choice: desde o princípio
  rationale: Mantém o eco da linguagem da criação em Gênesis e acompanha de perto a expressão grega.
- source_word: ἄρσεν καὶ θῆλυ
  choice: homem e mulher
  rationale: Em referência a seres humanos, esta é uma formulação portuguesa natural e digna para o par sexuado do texto grego e para a alusão a Gênesis 1:27.
- source_word: ἐποίησεν αὐτούς
  choice: os fez
  rationale: Distingue ποιέω de κτίζω, já traduzido por “criou”, e evita repetição desnecessária.
theological_decisions:
- issue: A declaração da criação em relação a Gênesis 1:27
  choice: Manter no texto principal o par criacional “homem e mulher”, sem paráfrase.
  alternative: “macho e fêmea”
  rationale: Jesus apela diretamente ao relato da criação. “Homem e mulher” preserva a referência aos dois sexos humanos de maneira natural em português, sem acrescentar conclusões doutrinárias que ultrapassem o versículo.
- issue: Relação sintática de ἀπ’ ἀρχῆς
  choice: 'Ligá-lo verbalmente ao ato de criar: “os criou desde o princípio”.'
  alternative: “desde o princípio, aquele que os criou os fez...”
  rationale: A posição da expressão logo após ὁ κτίσας favorece sua ligação com “criou”; a tradução conserva essa proximidade sem eliminar completamente a ressonância temporal sobre toda a declaração.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Vocês” explicita o plural dirigido aos interlocutores; “desde o princípio” preserva o eco de Gênesis.
