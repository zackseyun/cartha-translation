  text: Τίμα τὸν πατέρα καὶ τὴν μητέρα, καὶ Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/019.yaml
  text: Honor your father and mother[a], and love your neighbor as yourself.
translation:
  language: pt
  text: Honre seu pai e sua mãe e ame o seu próximo como a si mesmo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “Honra o teu pai e a tua mãe, e amarás o teu próximo como a ti mesmo.”'
    reason: alternativa lexical e gramatical
lexical_decisions:
- source_word: Τίμα
  choice: Honre
  rationale: Preserva a força imperativa de τιμάω e o eco do mandamento, expressando a honra devida aos pais, não apenas estima interior.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: seu pai e sua mãe
  rationale: Embora o grego use artigos, o possessivo é natural em português na formulação do mandamento e explicita corretamente a relação pressuposta pelo contexto.
- source_word: Ἀγαπήσεις
  choice: ame
  rationale: O futuro do indicativo ocorre em linguagem de mandamento citada da Torá. No texto principal, o imperativo comunica naturalmente essa força normativa e mantém o paralelismo com “Honre”; a forma futura é preservada em nota.
- source_word: τὸν πλησίον σου
  choice: o seu próximo
  rationale: “Próximo” é a tradução estabelecida e precisa neste contexto ético, abrangendo a pessoa com quem se tem relação, sem limitar o sentido à proximidade física.
- source_word: ὡς σεαυτόν
  choice: como a si mesmo
  rationale: Reproduz de modo conciso e idiomático a comparação do grego, sem acrescentar um verbo elíptico nem explicação interpretativa.
theological_decisions:
- issue: Formas verbais na citação dos mandamentos
  choice: 'Empregar dois imperativos: “Honre... e ame...”'
  alternative: “Honra o teu pai e a tua mãe, e amarás o teu próximo como a ti mesmo.”
  rationale: O grego combina um imperativo (Τίμα) com um futuro do indicativo (Ἀγαπήσεις), este último segundo a linguagem convencional dos mandamentos. Dois imperativos transmitem com clareza a mesma força normativa no português atual; a combinação formalmente mais próxima é mantida em nota para não ocultar a diferença gramatical.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com formas de tratamento naturais para leitores brasileiros no texto principal. A nota conserva a formulação mais tradicional e formal, incluindo a alternância entre imperativo e futuro presente no grego.
