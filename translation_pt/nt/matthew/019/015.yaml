  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπιθεὶς ⸂τὰς χεῖρας αὐτοῖς⸃ ἐπορεύθη ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/015.yaml
  text: And after laying his hands on them[a], he went on from there.
translation:
  language: pt
  text: E, depois de pôr as mãos sobre elas, partiu dali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a ligação narrativa simples com o contexto anterior, sem acrescentar uma relação temporal ou causal além da expressa.
- source_word: ἐπιθεὶς
  choice: depois de pôr
  rationale: O particípio aoristo indica aqui uma ação anterior ao verbo principal. A construção é natural em português e preserva a sequência dos acontecimentos.
- source_word: τὰς χεῖρας αὐτοῖς
  choice: as mãos sobre elas
  rationale: Reproduz a expressão concreta de impor ou pôr as mãos sobre alguém. O referente de αὐτοῖς são as crianças mencionadas no contexto, por isso o pronome feminino plural é natural em português.
- source_word: ἐπορεύθη
  choice: partiu
  rationale: No contexto narrativo, comunica de modo claro e digno que Jesus saiu daquele lugar; evita a formulação menos natural 'foi-se'.
- source_word: ἐκεῖθεν
  choice: dali
  rationale: Equivalente português conciso e corrente para o advérbio de lugar 'de lá/daquele lugar'.
theological_decisions:
- issue: Natureza do ato de Jesus ao pôr as mãos
  choice: 'Manter no texto o ato físico concreto: ''pôr as mãos sobre elas''.'
  alternative: Substituir o ato por uma interpretação, como 'abençoá-las'.
  rationale: O grego declara explicitamente a imposição das mãos, enquanto a bênção é inferida pelo contexto. A tradução preserva o que está expresso sem introduzir linguagem sacramental, de ordenação ou uma paráfrase interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Partiu dali' conserva o movimento narrativo de forma natural; não se acrescenta nota porque a alternativa 'foi embora dali' é apenas variação estilística, sem diferença relevante de sentido.
