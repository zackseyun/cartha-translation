id: MAT.19.27
reference: Matthew 19:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: pt
  text: 'Então Pedro lhe respondeu: “Veja, nós deixamos tudo e te seguimos. O que, então, haverá para nós?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: disse
  rationale: A construção semítica literalmente associada a ‘responder’ pode ser expressa naturalmente por ‘disse’ em português, sem exigir que haja uma pergunta explícita imediatamente anterior.
- source_word: Ἰδοὺ
  choice: Veja
  rationale: Mantém a função de chamar a atenção para o que Pedro vai afirmar, em linguagem atual e clara.
- source_word: ἀφήκαμεν πάντα
  choice: deixamos tudo
  rationale: Reproduz diretamente a ideia de abandonar ou deixar para trás todas as coisas, sem acrescentar uma especificação ausente do grego.
- source_word: ἠκολουθήσαμέν σοι
  choice: seguimos o senhor
  rationale: Traduz o aoristo como ação realizada e usa ‘o senhor’ como pronome de tratamento respeitoso e natural dirigido a Jesus, sem transformar κύριος ausente em título.
- source_word: τί ἄρα ἔσται ἡμῖν
  choice: O que, então, haverá para nós?
  rationale: Preserva a formulação aberta do grego quanto ao que os discípulos receberão ou terão, evitando explicitar ‘recompensa’, que não aparece no texto.
theological_decisions:
- issue: Natureza do que caberá aos discípulos
  choice: ‘O que, então, haverá para nós?’
  alternative: ‘O que receberemos, então?’
  rationale: A tradução mantém a amplitude de ἔσται ἡμῖν e não antecipa nem restringe a resposta de Jesus a uma recompensa material ou estritamente meritória.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. ‘Veja’ comunica a força discursiva de Ἰδοὺ sem o tom arcaico de ‘Eis’. O tratamento ‘o senhor’ evita o coloquial ‘você’ e não introduz o título divino ‘Senhor’, pois ele não consta nesta oração grega.
