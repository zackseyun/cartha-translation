  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
translation:
  language: pt
  text: 'Novamente lhes digo: é mais fácil um camelo passar pelo olho de uma agulha do que um rico entrar no reino de Deus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns sugerem «corda» em vez de «camelo», mas o texto grego aqui diz «camelo».
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν δὲ λέγω ὑμῖν
  choice: E novamente lhes digo
  rationale: πάλιν indica repetição, enquanto δέ funciona como conectivo leve. A formulação mantém ambos de modo natural e preserva a fórmula direta λέγω ὑμῖν.
- source_word: εὐκοπώτερόν ἐστιν
  choice: é mais fácil
  rationale: Equivalente português claro e idiomático do comparativo empregado com os infinitivos.
- source_word: κάμηλον
  choice: um camelo
  rationale: O texto grego traz κάμηλον, 'camelo'; a imagem hiperbólica não deve ser atenuada pela conjectura 'corda'.
- source_word: διὰ τρυπήματος ῥαφίδος
  choice: pelo fundo de uma agulha
  rationale: Designa a abertura de uma agulha de costura. 'Fundo de uma agulha' é uma expressão tradicional e compreensível em português brasileiro.
- source_word: εἰσελθεῖν
  choice: passar
  rationale: No primeiro termo da comparação, descreve o movimento através da abertura; 'passar' comunica a imagem com naturalidade.
- source_word: ἢ πλούσιον
  choice: do que um rico
  rationale: O adjetivo masculino singular substantivado refere-se a uma pessoa rica; 'um rico' preserva a forma concisa e representativa.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: entrar no Reino de Deus
  rationale: Preserva a expressão teológica central e traduz εἰς idiomaticamente com 'entrar em'. A inicial maiúscula em 'Reino' assinala o referente específico sem acrescentar interpretação.
theological_decisions:
- issue: Interpretação da imagem do camelo e da agulha
  choice: Manter a comparação hiperbólica direta, que retrata uma dificuldade extrema ou impossibilidade humana, sem explicar a imagem dentro do versículo.
  alternative: Entender 'agulha' como referência a um suposto portão de Jerusalém ou substituir 'camelo' por 'corda'.
  rationale: O grego apresenta diretamente um camelo e a abertura de uma agulha de costura. Não há apoio textual aqui para um portão, e a conjectura 'corda' não corresponde à leitura da edição-fonte. O contexto imediato pode desenvolver a implicação teológica sem que a tradução a antecipe.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção é concisa e conserva a força retórica da hipérbole. O marcador [a] aparece no texto principal.
