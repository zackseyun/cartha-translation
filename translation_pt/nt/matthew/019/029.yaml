id: MAT.19.29
reference: Matthew 19:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: pt
  text: E todo aquele que tiver deixado casas, irmãos, irmãs, pai, mãe, esposa, filhos ou campos por causa do meu nome receberá cem vezes tanto[a] e herdará a vida eterna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: o cêntuplo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: todo aquele que
  rationale: 'Expressa de modo natural em português o sentido distributivo e genérico: cada pessoa que se enquadrar na condição.'
- source_word: ἀφῆκεν
  choice: tiver deixado
  rationale: O futuro composto do subjuntivo é idiomático numa oração relativa genérica ligada às promessas futuras, indicando uma renúncia efetivamente realizada sem acrescentar a carga negativa de “abandonado”.
- source_word: οἰκίας
  choice: casas
  rationale: Conserva o plural concreto do grego e combina com a dimensão patrimonial de “campos”.
- source_word: ἀδελφοὺς ἢ ἀδελφὰς
  choice: irmãos, irmãs
  rationale: Mantém distintos os dois termos de parentesco explicitamente enumerados no grego.
- source_word: πατέρα ἢ μητέρα ἢ γυναῖκα ἢ τέκνα
  choice: pai, mãe, esposa, filhos
  rationale: Reproduz naturalmente a lista de relações familiares; no contexto doméstico, γυνή significa “esposa”.
- source_word: ἀγρούς
  choice: campos
  rationale: Designa terrenos agrícolas e preserva concretamente a dimensão econômica da renúncia.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: por causa do meu nome
  rationale: Mantém a figura teologicamente significativa do “nome” e expressa a motivação da renúncia sem reduzi-la à paráfrase “por minha causa”.
- source_word: ἑκατονταπλασίονα
  choice: o cêntuplo
  rationale: Equivalente português conciso e preciso para aquilo que corresponde a cem vezes a quantidade, evitando a possível ambiguidade aritmética de “cem vezes mais”.
- source_word: ζωὴν αἰώνιον κληρονομήσει
  choice: herdará a vida eterna
  rationale: Preserva tanto a metáfora de receber uma herança quanto a expressão central “vida eterna”.
theological_decisions:
- issue: Sentido de γυνή na lista de renúncias
  choice: esposa
  alternative: mulher
  rationale: A sequência enumera relações familiares e bens domésticos; “esposa” comunica o sentido relacional sem sugerir uma renúncia genérica às mulheres.
- issue: Preservação da expressão “meu nome”
  choice: por causa do meu nome
  alternative: por minha causa
  rationale: A tradução conserva a linguagem do texto sobre o nome de Jesus, sem definir além do necessário toda a sua extensão teológica.
- issue: Natureza da recompensa expressa por ἑκατονταπλασίονα
  choice: o cêntuplo
  alternative: cem vezes tanto
  rationale: A formulação preserva a força quantitativa da promessa sem explicar se ou como ela se concretiza materialmente, comunitariamente ou escatologicamente.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e boa legibilidade brasileira. A enumeração foi mantida enxuta, e “o cêntuplo” conserva a precisão do grego em registro bíblico ainda corrente.
