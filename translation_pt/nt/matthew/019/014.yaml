id: MAT.19.14
reference: Matthew 19:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: pt
  text: 'Mas Jesus disse: “Deixem as crianças vir a mim e não as impeçam de vir a mim, pois o Reino dos céus pertence aos que são como elas.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “pois de tais é o Reino dos céus”. “Os que são como elas” pode incluir não apenas as crianças presentes, mas também pessoas desse tipo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε
  choice: Deixem
  rationale: Neste contexto, o imperativo de ἀφίημι expressa permissão. “Deixem” é direto, natural e mantém a força da ordem.
- source_word: τὰ παιδία
  choice: as crianças
  rationale: παιδία designa crianças, muitas vezes pequenas, mas o termo geral evita explicitar uma idade que o versículo não determina.
- source_word: μὴ κωλύετε
  choice: não as impeçam
  rationale: κωλύω significa impedir, dificultar ou proibir. “Não as impeçam” comunica com clareza a proibição sem especificar além do texto.
- source_word: αὐτὰ ἐλθεῖν πρός με
  choice: as crianças vir a mim
  rationale: Com “deixem”, a construção portuguesa natural emprega o infinitivo “vir”; o pronome em “não as impeçam” retoma as crianças sem repetição pesada.
- source_word: τῶν γὰρ τοιούτων
  choice: pois ... aos que são como elas
  rationale: 'τοιούτων tem força representativa: refere-se às crianças presentes e, potencialmente, a pessoas desse tipo. A formulação preserva essa abertura sem definir em que consiste a semelhança.'
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: o Reino dos céus
  rationale: Expressão característica de Mateus, vertida de modo tradicional, claro e idiomático em português.
- source_word: ἐστὶν
  choice: pertence
  rationale: Na construção com o genitivo τῶν τοιούτων, “pertence” expressa naturalmente em português a relação indicada pelo grego, embora a forma mais literal seja “é”.
theological_decisions:
- issue: Se Jesus se refere exclusivamente às crianças presentes ou também a pessoas do mesmo tipo
  choice: “aos que são como elas”
  alternative: “de tais é o Reino dos céus”
  rationale: A tradução mantém tanto a referência imediata às crianças quanto a possível extensão a pessoas de condição ou caráter semelhante, sem explicar qual qualidade está em vista.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação “Deixem as crianças vir” é natural no uso contemporâneo e evita a formulação mais pesada “deixem que as crianças venham”. O marcador [a] aparece no texto principal.
