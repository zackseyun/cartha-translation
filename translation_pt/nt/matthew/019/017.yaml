source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: pt
  text: 'Ele, porém, lhe disse[a]: “Por que você me pergunta sobre o que é bom? Um só é bom[b]. Mas, se você quer entrar na vida, guarde os mandamentos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos e os relatos paralelos trazem: “Por que você me chama de bom? Ninguém é bom, a não ser um só: Deus.” O texto de Mateus na SBLGNT traz, em vez disso: “Por que você me pergunta sobre o que é bom? Um só é bom.”'
    reason: textual_variant
  - marker: b
    text: 'Lit.: “Um é o bom.” Ou: “Há um só que é bom.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: Por que você me pergunta sobre o que é bom?
  rationale: O neutro singular τοῦ ἀγαθοῦ é entendido como referência àquilo que é bom, em conformidade com a sintaxe do texto de Mateus, sem harmonizá-lo com os paralelos de Marcos e Lucas.
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: Um só é o bom
  rationale: A formulação preserva a estrutura marcada do grego, inclusive o adjetivo substantivado ὁ ἀγαθός, e mantém a ligação verbal com “o que é bom” na frase anterior. A nota oferece uma forma portuguesa mais idiomática.
- source_word: εἰ δὲ θέλεις
  choice: Mas, se você quer
  rationale: θέλω expressa vontade ou desejo; “quer” é corrente e direto. δέ tem aqui leve força adversativa, representada por “Mas”.
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: entrar na vida
  rationale: A expressão aponta para a vida em sentido pleno ou escatológico. “Entrar na vida” é natural em português, preserva a imagem do ingresso e não acrescenta “eterna”, palavra ausente desta oração.
- source_word: τήρησον τὰς ἐντολάς
  choice: guarde os mandamentos
  rationale: No contexto de mandamentos, τηρέω significa observá-los e obedecer-lhes. “Guardar os mandamentos” é uma expressão portuguesa clara e consagrada, sem perder a força do imperativo.
theological_decisions:
- issue: Relação da declaração de Jesus com a bondade divina e a cristologia
  choice: Traduzir a redação de Mateus como pergunta a respeito do que é bom, seguida de “Um só é o bom”, sem apresentar a frase como negação da bondade de Jesus.
  alternative: 'Harmonizar com Marcos e Lucas: “Por que você me chama de bom? Ninguém é bom, a não ser um só: Deus.”'
  rationale: O texto da SBLGNT em Mateus difere da forma encontrada nos relatos paralelos. A tradução conserva essa diferença e sua tensão teológica, sem acrescentar uma conclusão cristológica que a oração não explicita.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “você” para leitura ampla no Brasil. A ordem “Um só é o bom” é deliberadamente marcada para refletir a textura do grego; a nota registra a alternativa mais natural. Evitou-se tanto a harmonização com os paralelos sinóticos quanto a explicitação de “vida eterna”.
