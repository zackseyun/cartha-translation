id: MAT.19.6
reference: Matthew 19:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ σὰρξ μία. ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: pt
  text: Assim, já não são dois, mas uma só carne. Portanto, o que Deus uniu, ninguém separe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Assim
  rationale: Introduz o resultado da afirmação anterior de que os dois se tornam uma só carne, com força inferencial natural em português.
- source_word: οὐκέτι εἰσὶν δύο
  choice: já não são dois
  rationale: Reproduz com clareza a negação temporal e o contraste entre a condição anterior e a nova unidade.
- source_word: σὰρξ μία
  choice: uma só carne
  rationale: Preserva a linguagem de Gênesis evocada por Jesus e sua importância intertextual; “só” torna idiomática em português a ênfase na unidade.
- source_word: ὃ οὖν
  choice: Portanto, o que
  rationale: O pronome relativo neutro se refere à união realizada por Deus, enquanto “portanto” mantém a conclusão inferencial.
- source_word: συνέζευξεν
  choice: uniu
  rationale: Expressa de modo natural e direto a ação de juntar duas pessoas em união matrimonial; evita a imagem menos corrente de “pôr sob o mesmo jugo”.
- source_word: ἄνθρωπος
  choice: ninguém
  rationale: Neste contexto, o substantivo singular tem sentido humano genérico. Na construção proibitiva portuguesa, “ninguém separe” comunica com precisão que nenhum ser humano deve fazê-lo.
- source_word: μὴ χωριζέτω
  choice: ninguém separe
  rationale: O presente imperativo com μή formula uma proibição. O presente do subjuntivo após “ninguém” é uma forma portuguesa concisa, natural e solene de transmitir essa força.
theological_decisions:
- issue: Sentido genérico de ἄνθρωπος na proibição relativa ao casamento
  choice: ninguém
  alternative: o ser humano; homem algum
  rationale: O referente não é especificamente masculino, mas qualquer pessoa. “Ninguém” preserva o alcance universal da proibição sem introduzir uma especificação de gênero ausente do sentido contextual.
- issue: Linguagem da união matrimonial retomada de Gênesis em σὰρξ μία
  choice: uma só carne
  alternative: um só corpo
  rationale: A formulação tradicional preserva tanto a metáfora original quanto a ligação intertextual com Gênesis, sem explicar além do que o texto afirma.
- issue: Agência divina e proibição humana
  choice: o que Deus uniu, ninguém separe
  alternative: aqueles que Deus uniu, ninguém os separe
  rationale: O relativo neutro singular ὃ apresenta a união como uma realidade criada por Deus. A tradução mantém essa formulação e não a reduz apenas às duas pessoas envolvidas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o paralelismo “dois / uma só carne” e a concisão proverbial da declaração de Jesus.
