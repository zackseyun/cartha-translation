source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ νεανίσκος τὸν ⸀λόγον ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/022.yaml
  text: But when the young man heard this word[a], he went away grieving[c][b], for he had many possessions.
translation:
  language: pt
  text: Mas, ao ouvir essa palavra[a], o jovem foi embora entristecido[b], pois tinha muitos bens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «essa declaração». O grego diz literalmente «a palavra» e se refere ao que Jesus acabara de dizer.
    reason: lexical_alternative
  - marker: b
    text: Ou «triste». O particípio grego descreve o estado de tristeza em que ele foi embora.
    reason: lexical_alternative
  - marker: c
    text: Ou «muitas propriedades» ou «muitas posses». O grego enfatiza a quantidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: ao ouvir
  rationale: O particípio aoristo indica a circunstância temporal anterior à partida; «ao ouvir» expressa naturalmente essa sequência em português.
- source_word: δὲ
  choice: Mas
  rationale: A conjunção assinala uma leve contraposição e a mudança narrativa entre a instrução de Jesus e a reação negativa do jovem.
- source_word: ὁ νεανίσκος
  choice: o jovem
  rationale: O substantivo designa um jovem ou rapaz. «O jovem» é natural e não acrescenta a identificação como governante presente em outro relato sinótico.
- source_word: τὸν λόγον
  choice: essas palavras
  rationale: No contexto, λόγος se refere ao que Jesus acaba de dizer. O plural idiomático «essas palavras» transmite essa referência com clareza, sem entender λόγος como título ou mensagem independente.
- source_word: ἀπῆλθεν
  choice: foi embora
  rationale: Expressão corrente e clara para o ato de sair ou partir.
- source_word: λυπούμενος
  choice: entristecido
  rationale: O particípio presente descreve o estado de tristeza que acompanha a partida, preservando a simultaneidade sem tornar a frase artificial.
- source_word: ἦν γὰρ ἔχων
  choice: pois tinha
  rationale: A construção perifrástica indica um estado contínuo de posse; «tinha» é sua expressão natural em português, e γάρ fornece a explicação introduzida por «pois».
- source_word: κτήματα πολλά
  choice: muitos bens
  rationale: κτήματα designa bens, propriedades ou posses, e πολλά enfatiza sua quantidade. «Muitos bens» é conciso, natural e fiel ao plural.
theological_decisions:
- issue: Se deve ser acrescentada a identificação do jovem como governante
  choice: Traduzir νεανίσκος somente como «o jovem»
  alternative: «o jovem governante» ou «o jovem rico»
  rationale: O texto grego deste versículo o chama apenas de jovem. Acrescentar «governante» harmonizaria Mateus com Lucas, e acrescentar «rico» transformaria a informação explicativa sobre seus muitos bens em um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase é natural, e termos tradicionais potencialmente ambíguos, como «grandes possessões», foram evitados.
