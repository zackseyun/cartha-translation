id: MAT.19.16
reference: Matthew 19:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ εἷς προσελθὼν ⸂αὐτῷ εἶπεν⸃· ⸀Διδάσκαλε, τί ἀγαθὸν ποιήσω ἵνα ⸀σχῶ ζωὴν αἰώνιον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
translation:
  language: pt
  text: 'E eis que alguém, tendo-se aproximado dele, disse: “Mestre, que coisa boa[a] devo fazer para que eu tenha a vida eterna?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que boa ação devo fazer...?”. O grego τί ἀγαθὸν pode referir-se a uma “coisa boa” ou, em associação com “fazer”, a uma “boa ação”.
    reason: alternativa lexical
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: E eis que
  rationale: Mantém tanto a ligação narrativa de καί quanto a força de chamada de atenção de ἰδού, com uma formulação digna e reconhecível em português.
- source_word: εἷς
  choice: alguém
  rationale: Preserva a indefinição do grego, que diz literalmente ‘um’, sem identificar antecipadamente a pessoa como homem, jovem ou rica; ‘alguém’ é mais natural em português do que ‘um’ isolado.
- source_word: προσελθὼν
  choice: tendo-se aproximado
  rationale: Reproduz a subordinação do particípio aoristo e indica que a aproximação precedeu a fala.
- source_word: αὐτῷ εἶπεν
  choice: dele, disse
  rationale: Expressa naturalmente o referente de αὐτῷ em conexão com a aproximação e mantém εἶπεν como o verbo principal.
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: É o título português corrente para quem ensina e corresponde ao sentido de διδάσκαλος sem acrescentar conotações indevidas.
- source_word: τί ἀγαθὸν
  choice: que coisa boa
  rationale: Conserva a formulação aberta do neutro singular grego; ‘boa ação’ também é possível por implicação do verbo fazer e é registrada em nota.
- source_word: ποιήσω
  choice: devo fazer
  rationale: Traduz naturalmente a força deliberativa do subjuntivo aoristo na pergunta, sem transformar a fala em uma afirmação doutrinária sobre mérito.
- source_word: ἵνα σχῶ
  choice: para que eu tenha
  rationale: Mantém explicitamente a relação de finalidade ou resultado introduzida por ἵνα e o sentido direto de ἔχω, ‘ter’.
- source_word: ζωὴν αἰώνιον
  choice: a vida eterna
  rationale: É a expressão portuguesa estabelecida, clara e fiel neste contexto.
theological_decisions:
- issue: Identidade da pessoa que se aproxima
  choice: alguém
  alternative: um homem; um jovem rico
  rationale: O versículo usa apenas εἷς e ainda não fornece essas caracterizações; a tradução evita importar detalhes do contexto posterior ou de relatos paralelos.
- issue: Relação entre a ação perguntada e a vida eterna
  choice: que coisa boa devo fazer para que eu tenha a vida eterna?
  alternative: que boa ação devo praticar para obter a vida eterna?
  rationale: A formulação preserva a orientação prática da pergunta e a tensão teológica do texto, sem afirmar nem negar mérito, salvação por obras ou qualquer resolução doutrinária não expressa no grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. ‘E eis que’ retém de propósito a vivacidade narrativa do original; ‘tendo-se aproximado’ mantém a estrutura participial sem tornar a frase obscura.
