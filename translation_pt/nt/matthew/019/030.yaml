lexical_decisions:
- source_word: πολλοὶ
  choice: muitos
  rationale: O adjetivo é substantivado e se refere a um grupo amplo sem identificar seus integrantes; “muitos” mantém a concisão do grego.
- source_word: δὲ
  choice: Mas
  rationale: Marca aqui uma transição com leve contraste em relação à discussão anterior sobre recompensa e posição.
- source_word: ἔσονται
  choice: serão
  rationale: Traduz de modo direto e natural o futuro de εἰμί.
- source_word: πρῶτοι
  choice: primeiros
  rationale: Preserva a ideia abrangente de posição ou precedência e o contraste proverbial com “últimos”.
- source_word: ἔσχατοι
  choice: últimos
  rationale: Mantém a antítese direta com “primeiros”, sem especificar indevidamente o tipo de posição em questão.
- source_word: πολλοὶ ... πρῶτοι ἔσχατοι
  choice: muitos que são primeiros serão últimos
  rationale: A inclusão de “que são” torna a relação predicativa natural em português, sem alterar o sentido do original.
- source_word: καὶ ἔσχατοι πρῶτοι
  choice: e os últimos, primeiros
  rationale: A vírgula assinala a elipse do verbo e conserva a formulação breve, equilibrada e proverbial do grego.
