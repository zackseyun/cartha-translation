  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: pt
  text: 'Ele lhe diz: “Quais?” Jesus disse: “O ‘Não matarás’, ‘Não cometerás adultério’, ‘Não furtarás’, ‘Não darás falso testemunho’,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποίας
  choice: Quais?
  rationale: Reproduz de modo natural a pergunta elíptica do interlocutor sobre quais mandamentos Jesus tem em vista.
- source_word: Τὸ
  choice: 'Estes:'
  rationale: O artigo neutro introduz a enumeração; em português, “Estes:” comunica essa função com naturalidade, sem a construção artificial “Os:”. O plural é inferido pela lista que segue.
- source_word: Οὐ φονεύσεις
  choice: Não mate
  rationale: φονεύω designa matar uma pessoa de modo ilícito, não todo ato de matar; “não mate” é a formulação bíblica corrente e clara neste contexto de mandamento.
- source_word: Οὐ μοιχεύσεις
  choice: não cometa adultério
  rationale: Expressa diretamente o sentido específico de μοιχεύω em português moderno.
- source_word: Οὐ κλέψεις
  choice: não roube
  rationale: Equivalente direto, corrente e conciso de κλέπτω.
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: não dê falso testemunho
  rationale: Preserva a linguagem jurídica e pactual de testemunhar falsamente, em vez de generalizar para simplesmente “não minta”.
theological_decisions:
- issue: Alcance de φονεύσεις
  choice: não mate
  alternative: não assassine
  rationale: O verbo se refere à morte ilícita de uma pessoa. “Não mate” mantém a formulação tradicionalmente reconhecível do mandamento, enquanto o contexto impede que seja entendido como uma proibição indiscriminada de toda forma de tirar a vida.
- issue: Função de Τὸ antes da lista
  choice: 'Estes:'
  alternative: 'Os seguintes:'
  rationale: Mantém a introdução enfática da lista presente no grego, sem transformar o artigo singular em uma expressão portuguesa gramaticalmente estranha.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas do imperativo usadas no Brasil e inteligíveis internacionalmente. A alternância do presente histórico grego para o pretérito narrativo em português evita rigidez sem alterar o conteúdo. A pontuação mantém o versículo aberto para a continuação da lista no versículo seguinte.
