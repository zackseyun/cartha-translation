id: MAT.19.26
reference: Matthew 19:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
translation:
  language: pt
  text: 'Jesus, porém, olhou para eles e lhes disse: “Para os seres humanos isso é impossível, mas para Deus todas as coisas são possíveis.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: olhou para eles
  rationale: O particípio aoristo indica que Jesus dirigiu o olhar aos discípulos. “Olhou para eles” é natural e preserva a força narrativa sem intensificar indevidamente o verbo como “fixou o olhar”.
- source_word: δὲ
  choice: porém
  rationale: A partícula marca contraste moderado com a reação anterior dos discípulos. “Porém” expressa esse contraste em registro corrente e digno.
- source_word: εἶπεν αὐτοῖς
  choice: lhes disse
  rationale: Mantém explícito o destinatário indicado pelo dativo αὐτοῖς e evita uma repetição pesada em português.
- source_word: παρὰ ἀνθρώποις
  choice: Para os seres humanos
  rationale: παρά com dativo exprime esfera ou referência, isto é, o que é possível no âmbito humano. “Seres humanos” comunica claramente o sentido genérico de ἀνθρώποις sem restringi-lo aos homens do sexo masculino.
- source_word: τοῦτο
  choice: isso
  rationale: O demonstrativo retoma a questão mencionada imediatamente antes. “Isso” é a forma mais natural em português nesse contexto discursivo.
- source_word: ἀδύνατόν ἐστιν
  choice: é impossível
  rationale: Tradução direta e idiomática do adjetivo predicativo com a cópula.
- source_word: παρὰ δὲ θεῷ
  choice: mas para Deus
  rationale: Repete a estrutura de παρά com dativo e preserva o contraste retórico entre a esfera humana e Deus.
- source_word: πάντα δυνατά
  choice: todas as coisas são possíveis
  rationale: Preserva o plural πάντα e a formulação abrangente e sentenciosa do grego, sem reduzir a expressão a uma paráfrase.
theological_decisions:
- issue: Sentido genérico de ἀνθρώποις
  choice: seres humanos
  alternative: homens; pessoas
  rationale: Neste contraste com Deus, o plural grego se refere à humanidade em geral. “Seres humanos” torna essa abrangência inequívoca em português moderno sem acrescentar uma interpretação doutrinária.
- issue: Alcance de πάντα δυνατά
  choice: todas as coisas são possíveis
  alternative: tudo é possível
  rationale: A redação preserva a amplitude da afirmação e sua ligação contextual com aquilo que é impossível aos seres humanos, sem inserir qualificações teológicas ausentes do versículo.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A ordem da frase conserva o contraste do grego, enquanto “lhes disse” mantém o destinatário explícito com fluidez.
