  text: And large crowds followed him, and he healed them there.
translation:
  language: pt
  text: E grandes multidões o seguiram, e ele as curou ali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: seguiram
  rationale: O aoristo de ἀκολουθέω descreve, no fluxo narrativo, o ato concreto de ir atrás de Jesus. “Seguiram” é a forma natural em português e não acrescenta por si só um sentido técnico de discipulado.
- source_word: αὐτῷ
  choice: o
  rationale: Embora o grego use o dativo regido por ἀκολουθέω, o português padrão emprega objeto direto com “seguir”; por isso, “o seguiram” expressa naturalmente “seguiram-no”.
- source_word: ὄχλοι πολλοί
  choice: grandes multidões
  rationale: A expressão significa literalmente “muitas multidões”. “Grandes multidões” é idiomática em português e comunica uma grande quantidade de pessoas reunidas.
- source_word: ἐθεράπευσεν
  choice: curou
  rationale: Neste contexto de atividade de Jesus, θεραπεύω designa restaurar pessoas enfermas. “Curou” é a equivalência corrente, clara e abrangente em narrativa evangélica.
- source_word: αὐτούς
  choice: as
  rationale: O pronome retoma ὄχλοι (“multidões”). Em português, a concordância gramatical com o antecedente feminino plural pede “as”, sem excluir os indivíduos que compunham as multidões.
- source_word: ἐκεῖ
  choice: ali
  rationale: O advérbio indica o lugar mencionado no contexto anterior. “Ali” conserva de modo simples e natural essa referência locativa.
- source_word: καὶ ... καὶ
  choice: E ... e
  rationale: A repetição de καί coordena as ações com a parataxe característica da narrativa, sem especificar uma relação mais precisa do que o texto oferece.
