source:
  edition: SBLGNT
  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: pt
  text: 'Fariseus aproximaram-se dele, pondo-o à prova, e perguntaram: “É lícito a um homem divorciar-se de sua mulher por qualquer motivo?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por qualquer razão” ou “por toda e qualquer causa”. A expressão grega formula uma pergunta jurídica ampla sobre os fundamentos permissíveis para o divórcio.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: se aproximaram
  rationale: Expressa de modo natural o movimento em direção a Jesus indicado por προσέρχομαι.
- source_word: πειράζοντες
  choice: para pô-lo à prova
  rationale: Preserva o sentido de testar ou provar; a construção final comunica naturalmente, em português, a intenção adversarial no contexto sem explicitar além do texto uma tentativa de armadilha.
- source_word: ἔξεστιν
  choice: é lícito
  rationale: Mantém o caráter jurídico e religioso da pergunta sobre o que é permitido.
- source_word: ἀνθρώπῳ
  choice: a um homem
  rationale: Conserva a referência masculina concreta, confirmada pela expressão seguinte, “sua mulher”.
- source_word: ἀπολῦσαι
  choice: divorciar-se de
  rationale: Neste contexto matrimonial, ἀπολύω é o termo idiomático para dissolver o casamento; “divorciar-se de” comunica diretamente esse sentido no português atual.
- source_word: γυναῖκα αὐτοῦ
  choice: sua mulher
  rationale: γυνή significa aqui esposa, como mostram o possessivo e o contexto de divórcio; “sua mulher” é claro e corrente em português.
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: por qualquer motivo
  rationale: Reproduz a amplitude da pergunta acerca de toda e qualquer razão alegada para o divórcio, em linguagem natural.
theological_decisions:
- issue: Preservar a amplitude da controvérsia jurídica sobre os motivos admissíveis para o divórcio sem antecipar uma posição doutrinária.
  choice: É lícito a um homem divorciar-se de sua mulher por qualquer motivo?
  alternative: É permitido a um marido repudiar sua mulher por qualquer razão?
  rationale: A formulação mantém a pergunta como desafio jurídico dirigido a Jesus e não resolve antecipadamente a controvérsia. “Por qualquer motivo” conserva o alcance amplo de κατὰ πᾶσαν αἰτίαν, enquanto “divorciar-se” evita que “repudiar” seja entendido apenas como abandono informal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Alguns fariseus” evita uma construção pouco natural sem artigo; “perguntaram” verte idiomaticamente o grego “dizendo” no contexto de uma pergunta. O marcador foi colocado junto à expressão que a nota esclarece.
