id: MAT.19.21
reference: Matthew 19:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Εἰ θέλεις τέλειος εἶναι, ὕπαγε πώλησόν σου τὰ ὑπάρχοντα καὶ ⸀δὸς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
translation:
  language: pt
  text: 'Jesus lhe disse: “Se você quer ser completo[a], vá, venda o que possui e dê aos pobres, e você terá um tesouro nos céus. Depois, venha e siga-me.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perfeito”. A palavra grega pode significar “perfeito”, “completo” ou “maduro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jesus lhe disse
  rationale: Forma narrativa natural em português, preservando tanto o falante quanto o destinatário sem especificar indevidamente o modo da fala.
- source_word: τέλειος
  choice: completo
  rationale: O termo pode significar perfeito, completo ou maduro. Neste contexto, “completo” expressa inteireza e plena dedicação sem restringir antecipadamente a expressão à impecabilidade moral; a alternativa tradicional é mantida em nota.
- source_word: ὕπαγε
  choice: vá
  rationale: Equivalente direto e idiomático do imperativo de partida.
- source_word: πώλησόν σου τὰ ὑπάρχοντα
  choice: venda o que possui
  rationale: Reproduz com naturalidade a referência às propriedades ou aos bens pertencentes ao homem.
- source_word: δὸς πτωχοῖς
  choice: dê aos pobres
  rationale: Traduz diretamente o adjetivo substantivado, designando pessoas pobres.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: você terá um tesouro nos céus
  rationale: Mantém o futuro simples, o substantivo no singular e o plural οὐρανοῖς, que é natural na expressão portuguesa “nos céus”.
- source_word: δεῦρο
  choice: Depois, venha
  rationale: “Venha” preserva o chamado deítico, e “depois” torna explícita em português a sequência indicada pelo conjunto dos imperativos.
- source_word: ἀκολούθει μοι
  choice: siga-me
  rationale: Formulação consagrada e exata da linguagem de discipulado nos Evangelhos.
theological_decisions:
- issue: Sentido de τέλειος no chamado ao discipulado
  choice: completo
  alternative: perfeito; maduro
  rationale: A palavra admite os sentidos de perfeição, completude e maturidade. “Completo” preserva a ideia contextual de inteireza e devoção sem reservas, sem decidir que Jesus esteja formulando aqui uma doutrina abstrata de perfeição sem pecado. “Perfeito”, tradução tradicional e lexicalmente possível, permanece na nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Emprega “você” por clareza contemporânea; conserva “nos céus” para refletir o plural grego e usa “siga-me” como linguagem reconhecível de discipulado.
