  text: καὶ εἶπεν· ⸀Ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ ⸀κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: pt
  text: 'e disse: “Por isso, o homem deixará seu pai e sua mãe e se unirá[a] à sua esposa, e os dois se tornarão uma só carne”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se apegará à sua esposa” ou “será unido à sua esposa”. O verbo grego indica uma ligação estreita.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: Por isso
  rationale: Expressão causal e inferencial natural no português atual, preservando a ligação lógica da citação.
- source_word: καταλείψει
  choice: deixará
  rationale: Reproduz de modo direto o futuro do indicativo e mantém o tom formular da citação bíblica sem arcaísmo.
- source_word: ἄνθρωπος
  choice: o homem
  rationale: Neste contexto matrimonial, o masculino singular designa especificamente o homem em relação à sua esposa; uma forma neutra apagaria essa correspondência presente no texto.
- source_word: κολληθήσεται
  choice: se unirá
  rationale: O futuro passivo de κολλάομαι expressa vínculo ou adesão estreita. “Se unirá” é claro e idiomático, sem restringir o sentido à proximidade física ou apenas emocional.
- source_word: γυναικὶ αὐτοῦ
  choice: à sua esposa
  rationale: Embora γυνή também possa significar “mulher”, o contexto é inequivocamente matrimonial; “esposa” comunica esse sentido com clareza no português internacional.
- source_word: οἱ δύο
  choice: os dois
  rationale: Mantém a expressão numérica explícita do grego, sem condensá-la.
- source_word: εἰς σάρκα μίαν
  choice: se tornarão uma só carne
  rationale: “Se tornarão” expressa adequadamente a construção ἔσονται ... εἰς como resultado ou ingresso numa nova união; “uma só carne” preserva o idioma bíblico e sua densidade relacional.
theological_decisions:
- issue: Linguagem sexuada na citação sobre o casamento
  choice: o homem ... sua esposa
  alternative: a pessoa ... seu cônjuge
  rationale: A formulação grega apresenta especificamente o homem e sua esposa. A tradução preserva essa forma sem convertê-la numa declaração genérica e neutra sobre qualquer pessoa.
- issue: Expressão da união matrimonial
  choice: os dois se tornarão uma só carne
  alternative: os dois serão uma só carne
  rationale: “Se tornarão” conserva a força resultativa de ἔσονται εἰς, sem explicar além do texto a natureza dessa união.
- issue: Pontuação interrogativa
  choice: encerrar com ponto de interrogação
  alternative: encerrar como afirmação independente
  rationale: No contexto, as palavras fazem parte da pergunta iniciada no versículo anterior, e o texto grego fornecido encerra o versículo com o sinal de interrogação grego. A pontuação mantém essa continuidade sintática.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Esposa” evita a possível ambiguidade contemporânea de “sua mulher”; “uma só carne” conserva a linguagem bíblica estabelecida. O marcador da nota foi colocado junto ao verbo ao qual a nota se refere.
