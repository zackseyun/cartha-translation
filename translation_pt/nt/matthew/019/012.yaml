id: MAT.19.12
reference: Matthew 19:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: pt
  text: Pois há eunucos que nasceram assim, desde o ventre de sua mãe; há eunucos que foram feitos eunucos por outras pessoas; e há eunucos que se fizeram eunucos por causa do reino dos céus.[a] Quem puder aceitar isso, que o aceite.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “castraram a si mesmos”. Muitos intérpretes entendem essas palavras em sentido figurado, como a escolha do celibato por causa do reino dos céus.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “Quem puder receber isso, que o receba”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: eunucos
  rationale: Mantém o sentido comum do termo grego e sua repetição nas três categorias, sem substituir o substantivo por uma interpretação como “celibatários”.
- source_word: ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως
  choice: nasceram assim do ventre de sua mãe
  rationale: Preserva a imagem concreta do original e expressa em português corrente que essa condição existia desde o nascimento.
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: foram feitos eunucos por outras pessoas
  rationale: Conserva a ligação lexical com “eunucos”; “outras pessoas” comunica o agente humano de modo natural e inclusivo, sem restringir desnecessariamente ἄνθρωποι a homens do sexo masculino.
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: fizeram de si mesmos eunucos
  rationale: Reproduz a formulação deliberadamente forte do grego sem decidir no corpo do texto se ela deve ser entendida literalmente, como hipérbole ou como referência figurada à renúncia ao casamento.
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: por causa do reino dos céus
  rationale: Expressa de modo natural o motivo ou propósito indicado por διά com acusativo, mantendo a fórmula característica de Mateus.
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: Quem puder aceitar isso, que o aceite
  rationale: Verte idiomaticamente χωρέω como acolher ou aceitar um ensino exigente e preserva a força exortativa do imperativo.
theological_decisions:
- issue: Se εὐνούχισαν ἑαυτοὺς deve ser entendido literalmente ou figuradamente
  choice: Manter no texto a expressão concreta “fizeram de si mesmos eunucos”.
  alternative: “castraram a si mesmos” ou “renunciaram ao casamento”.
  rationale: O próprio versículo não explica se a terceira categoria é literal, hiperbólica ou figurada. A tradução preserva essa tensão, enquanto a nota registra a interpretação frequente relacionada ao celibato.
- issue: Sentido da exortação final ὁ δυνάμενος χωρεῖν χωρείτω
  choice: “Quem puder aceitar isso, que o aceite.”
  alternative: “Quem puder receber isso, que o receba.”
  rationale: “Aceitar” comunica melhor em português atual o uso idiomático de χωρέω neste contexto, sem eliminar a alternativa mais formal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “eunucos” é mantida para refletir a estrutura retórica do grego. Evitou-se tanto o eufemismo interpretativo no texto principal quanto uma formulação excessivamente anatômica.
