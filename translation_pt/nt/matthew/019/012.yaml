  source_fidelity: O texto preserva adequadamente a estrutura tripla, a repetição de εὐνοῦχοι («eunucos»), os agentes humanos da segunda categoria e a ambiguidade deliberada da terceira. A revisão troca apenas uma formulação reflexiva pouco idiomática por «se fizeram eunucos», que corresponde diretamente a εὐνούχισαν ἑαυτούς sem decidir entre leitura literal e figurada.
