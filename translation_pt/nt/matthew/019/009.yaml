id: MAT.19.9
reference: Matthew 19:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: pt
  text: Mas eu lhes digo que quem se divorciar de sua esposa, a não ser por imoralidade sexual[a], e se casar com outra mulher comete adultério; e quem se casar com uma mulher divorciada comete adultério.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «exceto com base em imoralidade sexual». A expressão grega também pode ser traduzida de modo mais específico como «exceto por fornicação» ou entendida por alguns como «exceto por infidelidade sexual».'
    reason: lexical_alternative
  - marker: b
    text: 'Alguns manuscritos omitem: «e quem se casar com uma mulher divorciada comete adultério».'
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Mas eu lhes digo
  rationale: Expressa naturalmente a fala direta e autoritativa de Jesus; «mas» representa o valor levemente adversativo de δέ no contexto.
- source_word: ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: quem se divorciar de sua esposa
  rationale: A construção relativa com ἄν tem força geral e indefinida. No contexto matrimonial, ἀπολύω significa divorciar-se, e γυνή significa esposa.
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: a não ser por imoralidade sexual
  rationale: A locução introduz uma exceção. «Imoralidade sexual» preserva a amplitude semântica de πορνεία sem reduzi-la automaticamente a adultério ou a uma forma sexual específica.
- source_word: καὶ γαμήσῃ ἄλλην
  choice: e se casar com outra mulher
  rationale: O adjetivo feminino ἄλλην pressupõe «outra mulher»; a explicitação é natural e clara em português.
- source_word: μοιχᾶται
  choice: comete adultério
  rationale: É a formulação corrente, clara e semanticamente adequada para a ação indicada pelo verbo grego.
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: e quem se casar com uma mulher divorciada comete adultério
  rationale: A construção participial substantivada tem sentido geral; o particípio perfeito passivo descreve uma mulher que foi divorciada.
theological_decisions:
- issue: Sentido de πορνεία na cláusula de exceção
  choice: imoralidade sexual
  alternative: fornicação; infidelidade sexual; relação sexual ilícita
  rationale: A tradução ampla conserva o alcance lexical do termo grego e evita impor uma interpretação denominacional mais estreita. A nota registra alternativas legítimas e a possibilidade de entender a expressão como fundamento para o divórcio.
- issue: Inclusão da cláusula final καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: incluir no texto principal com nota de variante textual
  alternative: omitir a cláusula
  rationale: O SBLGNT fornecido inclui a cláusula, embora a marque como textualmente variável. A tradução segue o texto-base e informa a ausência em alguns manuscritos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «vocês» implicitamente por meio de «lhes», sem regionalismos marcados. Mantém a forma masculina do caso apresentado pelo grego e preserva tanto a amplitude de πορνεία quanto a variante textual da cláusula final.
