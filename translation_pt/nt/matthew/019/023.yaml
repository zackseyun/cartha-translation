  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Ἀμὴν λέγω ὑμῖν ὅτι ⸂πλούσιος δυσκόλως⸃ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: pt
  text: 'Então Jesus disse aos seus discípulos: “Em verdade lhes digo: um rico entrará com dificuldade no Reino dos céus.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Então
  rationale: Marca a progressão narrativa e faz uma transição natural em português sem omitir a força conectiva.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: aos seus discípulos
  rationale: Preserva o possessivo explícito αὐτοῦ e emprega o termo consagrado e claro para μαθηταί.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Em verdade lhes digo
  rationale: Comunica em português atual o caráter solene e enfático da fórmula de Jesus; o plural de ὑμῖν é expresso por “lhes”.
- source_word: πλούσιος
  choice: um rico
  rationale: O adjetivo substantivado é masculino singular e designa um indivíduo representativo; esta forma mantém tanto a concisão quanto o gênero gramatical do grego.
- source_word: δυσκόλως
  choice: com dificuldade
  rationale: Expressa diretamente o modo indicado pelo advérbio, sem antecipar ou intensificar a formulação do versículo seguinte.
- source_word: εἰσελεύσεται
  choice: entrará
  rationale: Equivalente futuro direto e natural de εἰσέρχομαι neste contexto.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: o Reino dos céus
  rationale: Mantém a expressão característica de Mateus e o plural formal de οὐρανῶν, em formulação tradicional e inteligível em português.
theological_decisions:
- issue: Gênero do adjetivo substantivado πλούσιος
  choice: um rico
  alternative: uma pessoa rica
  rationale: O grego apresenta masculino singular e retrata um indivíduo representativo. A tradução retém essa forma sem ampliar nem restringir a aplicação geral do ensino.
- issue: Sentido da fórmula Ἀμὴν λέγω ὑμῖν
  choice: Em verdade lhes digo
  alternative: Amém, eu lhes digo
  rationale: “Em verdade” transmite a afirmação solene e autorizada de Jesus em linguagem portuguesa natural, enquanto “Amém” preservaria mais diretamente a forma semítica.
- issue: Força de δυσκόλως
  choice: com dificuldade
  alternative: dificilmente
  rationale: “Com dificuldade” preserva o valor modal do advérbio e evita que “dificilmente” seja entendido desde já como quase impossibilidade, tensão desenvolvida no versículo seguinte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção é direta, preserva a solenidade da fala de Jesus e evita arcaísmos. “Reino” recebe inicial maiúscula como convenção editorial para a realidade do governo divino, sem alterar o sentido lexical.
