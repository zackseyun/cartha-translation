revisions:
- from: Então trouxeram crianças a Jesus para que ele lhes impusesse as mãos e orasse; mas os discípulos as repreenderam.[a]
  to: Então levaram crianças a Jesus para que ele lhes impusesse as mãos e orasse; mas os discípulos fizeram uma repreensão.[a]
  rationale: A redação final evita impor, por meio da concordância de gênero portuguesa, um referente ao pronome grego ambíguo. «Fizeram uma repreensão» conserva a reação de censura dos discípulos, enquanto a nota fornece a formulação literal e explicita as duas referências possíveis. Também se usa «levaram crianças a Jesus», uma construção natural que mantém o sujeito não especificado do passivo grego.
