  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: pt
  text: Então levaram crianças a Jesus para que ele lhes impusesse as mãos e orasse; mas os discípulos fizeram uma repreensão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «os repreenderam»; o pronome pode referir-se tanto às crianças quanto às pessoas que as trouxeram.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca a sequência narrativa de modo conciso e natural em português.
- source_word: προσηνέχθησαν αὐτῷ παιδία
  choice: trouxeram crianças a Jesus
  rationale: A construção ativa com sujeito indeterminado é mais natural em português do que a passiva, preservando o fato de que as crianças foram levadas até ele. O nome “Jesus” esclarece o referente pronominal sem alterar o sentido.
- source_word: ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς
  choice: para que ele lhes impusesse as mãos
  rationale: Preserva a finalidade expressa por ἵνα e emprega a expressão portuguesa corrente “impor as mãos”, mantendo o plural do grego.
- source_word: καὶ προσεύξηται
  choice: e orasse
  rationale: Mantém o verbo sem acrescentar um complemento como “por elas”, que não está explícito no grego.
- source_word: οἱ δὲ μαθηταὶ
  choice: mas os discípulos
  rationale: “Mas” comunica o contraste leve introduzido por δέ.
- source_word: ἐπετίμησαν αὐτοῖς
  choice: as repreenderam
  rationale: “Repreenderam” conserva a força de ἐπιτιμάω. O pronome feminino plural mantém possível em português a referência tanto às crianças quanto às pessoas que as trouxeram, embora a leitura imediata possa favorecer “crianças”.
theological_decisions:
- issue: Referente do αὐτοῖς final
  choice: as
  alternative: as crianças; as pessoas que trouxeram as crianças
  rationale: O pronome grego pode referir-se às crianças ou às pessoas que as trouxeram. A tradução não explicita um dos referentes, e a nota registra a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Impor as mãos” conserva a expressão bíblica tradicional sem soar arcaica. O marcador da nota foi colocado após a oração a que se refere.
