  naturalness: O texto é claro e de registro apropriado. «Impor as mãos» é idiomático e adequado. A formulação revista evita um pronome de objeto cuja concordância de gênero força indevidamente um referente.
  terminology: «Crianças», «impor as mãos», «orar», «discípulos» e «repreender» são escolhas fiéis, naturais e teologicamente neutras.
