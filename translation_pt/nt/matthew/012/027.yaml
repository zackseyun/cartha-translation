id: MAT.12.27
reference: Matthew 12:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: pt
  text: E, se eu expulso os demônios por Belzebul[a], por quem os filhos de vocês os expulsam? Por isso, eles serão os juízes de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “Belzebul”; a forma tradicional “Belzebu” também é comum.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: por Belzebul
  rationale: Neste contexto, ἐν tem sentido instrumental, indicando o poder ou agente pelo qual se realiza a expulsão. “Por Belzebul” é natural em português e segue a forma do nome no texto grego.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: expulso os demônios
  rationale: Em contexto de exorcismo, ἐκβάλλω expressa a ação de fazer sair ou expulsar. “Expulsar demônios” é claro, corrente e mantém a força da expressão grega.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: os filhos de vocês
  rationale: A tradução conserva o termo de parentesco υἱοί e a forma plural do original, sem determinar se a referência contextual é a descendentes, discípulos ou membros do próprio grupo dos interlocutores.
- source_word: ἐν τίνι
  choice: por quem
  rationale: O segundo ἐν também tem sentido instrumental. “Por quem” preserva a construção paralela e indica uma pessoa ou poder como agente.
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: A expressão introduz a conclusão do argumento. “Por isso” comunica sua força inferencial em português natural.
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: eles serão os juízes de vocês
  rationale: A formulação preserva o substantivo predicativo κριταί, o tempo futuro e a relação expressa pelo genitivo ὑμῶν, sem transformar a frase em uma paráfrase verbal.
theological_decisions:
- issue: Identidade e grafia de Βεελζεβούλ
  choice: Belzebul
  alternative: Belzebu
  rationale: A tradução translitera a forma Βεελζεβούλ presente no texto grego fornecido, em vez de harmonizá-la com a forma tradicional portuguesa “Belzebu”. A nota registra a variante conhecida sem decidir além da evidência textual apresentada.
- issue: Referente de οἱ υἱοὶ ὑμῶν
  choice: os filhos de vocês
  alternative: os discípulos de vocês / os seus seguidores
  rationale: Embora a expressão possa designar pessoas ligadas ao grupo dos interlocutores, o grego emprega literalmente “filhos”. Preservar essa formulação mantém a abertura semântica e a tensão retórica do argumento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega-se “vocês” para o plural de segunda pessoa e “expulsar demônios” como formulação corrente. A repetição de “por” e a estrutura “serão os juízes de vocês” preservam o paralelismo e a força retórica do original.
