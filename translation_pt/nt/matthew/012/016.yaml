  yaml_path: translation/nt/matthew/012/016.yaml
  text: And he warned them not to make him known,[a]
translation:
  language: pt
  text: E os advertiu severamente para que não o tornassem conhecido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ordenou-lhes com firmeza».
    reason: Alternativa lexical para ἐπετίμησεν, que pode exprimir advertência severa, repreensão ou ordem firme conforme o contexto.
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a coordenação narrativa simples do grego sem acrescentar uma relação temporal ou causal.
- source_word: ἐπετίμησεν
  choice: advertiu severamente
  rationale: O verbo pode indicar repreensão ou uma advertência/ordem firme. Neste contexto, a oração seguinte expressa uma proibição; a formulação escolhida transmite sua força sem pressupor culpa moral nos destinatários.
- source_word: αὐτοῖς
  choice: os
  rationale: Pronome dativo plural que retoma as pessoas mencionadas no contexto; em português, funciona naturalmente como objeto de «advertiu».
- source_word: ἵνα μὴ
  choice: que não
  rationale: Depois de um verbo de advertência ou ordem, introduz naturalmente em português o conteúdo negativo da determinação.
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: o tornassem conhecido
  rationale: Reproduz a expressão idiomática grega no sentido de divulgar ou dar a conhecer Jesus, preservando-o como objeto pessoal.
theological_decisions:
- issue: Natureza da determinação de Jesus sobre a publicidade
  choice: Uma advertência firme para que não o tornassem conhecido
  alternative: Uma repreensão aos destinatários ou uma ordem expressa
  rationale: O grego indica uma determinação forte, mas não declara neste versículo a razão teológica para impedir a divulgação. A tradução preserva essa tensão sem acrescentar uma explicação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Advertiu severamente» preserva a intensidade verbal; «o tornassem conhecido» mantém a construção pessoal e evita limitar o sentido apenas à identidade ou apenas às obras de Jesus.
