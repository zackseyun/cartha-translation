source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: pt
  text: 'Mas ele lhes disse: “Quem de vocês, se tiver uma só ovelha e ela cair numa cova no sábado, não a agarrará e a levantará?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: Quem de vocês
  rationale: Expressa de modo natural em português a pergunta retórica grega. O substantivo ἄνθρωπος tem aqui sentido representativo, já suficientemente comunicado por “quem”, sem acrescentar uma marca masculina pouco natural.
- source_word: ἕξει πρόβατον ἕν
  choice: tendo uma só ovelha
  rationale: O particípio em português integra com fluidez a situação hipotética; “uma só ovelha” preserva a ênfase do numeral ἕν.
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: se ela cair
  rationale: Reproduz naturalmente a condição eventual expressa por ἐάν com o subjuntivo; o pronome feminino retoma “ovelha” em português.
- source_word: τοῖς σάββασιν
  choice: no sábado
  rationale: O plural grego é idiomático e, neste contexto, designa o dia de sábado; o singular português comunica o sentido sem reproduzir mecanicamente a forma plural.
- source_word: εἰς βόθυνον
  choice: numa cova
  rationale: βόθυνος indica uma cavidade ou buraco no solo. “Cova” é claro e amplo, sem especificar indevidamente cisterna ou vala.
- source_word: οὐχὶ κρατήσει αὐτό
  choice: não a agarrará
  rationale: οὐχί introduz uma pergunta que espera resposta afirmativa. “Agarrará” comunica a ação firme de κρατέω de modo corrente e adequado ao resgate do animal.
- source_word: καὶ ἐγερεῖ
  choice: e a levantará para fora
  rationale: Preserva o sentido básico de ἐγείρω, “levantar”, enquanto “para fora” torna explícita, a partir do contexto, a retirada da cova.
theological_decisions:
- issue: Linguagem masculina representativa em ἄνθρωπος
  choice: Quem de vocês
  alternative: Qual homem dentre vocês
  rationale: Embora ἄνθρωπος seja singular e gramaticalmente masculino, a construção inteira funciona como uma pergunta genérica. “Quem de vocês” preserva a referência aos interlocutores e o caráter representativo sem alterar o alcance nem impor uma formulação artificial em português.
- issue: Plural idiomático τοῖς σάββασιν
  choice: no sábado
  alternative: nos sábados
  rationale: O plural grego pode designar idiomaticamente o sábado como dia. O singular mantém o cenário da controvérsia sobre a observância sabática e evita sugerir repetição habitual.
- issue: Sentido contextual de ἐγερεῖ
  choice: a levantará para fora
  alternative: a levantará
  rationale: A expressão explicita a retirada da cova exigida pelo contexto, sem transformar o verbo em termo técnico ou carregar nele uma alusão teológica à ressurreição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para uma pergunta retórica natural, mantendo a singularidade da ovelha, a expectativa de resposta afirmativa e a imagem concreta do resgate no sábado.
