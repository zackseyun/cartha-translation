source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: pt
  text: 'Mas ele respondeu àquele que falava com ele[a]: “Quem é minha mãe, e quem são meus irmãos?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Mas ele, respondendo, disse àquele que falava com ele”.'
    reason: alternativa lexical que reproduz mais de perto a construção participial grega
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Mas ele respondeu
  rationale: A construção participial com εἶπεν é uma expressão grega de influência semítica, literalmente ‘respondendo, disse’. Em português natural, ‘respondeu’ comunica a ideia sem redundância, enquanto ‘Mas’ representa δέ e marca a mudança no discurso.
- source_word: τῷ λέγοντι αὐτῷ
  choice: àquele que falava com ele
  rationale: O particípio presente substantivado no dativo identifica a pessoa que se dirigia a Jesus e preserva o aspecto de ação em curso.
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: Quem é minha mãe
  rationale: Tradução direta e idiomática da pergunta de identidade, mantendo o termo de parentesco e o possessivo.
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: e quem são meus irmãos
  rationale: ‘Quem’ funciona naturalmente em português também com referente plural. ‘Irmãos’ conserva o substantivo masculino plural do texto e seu referente familiar imediato.
theological_decisions:
- issue: Possível suavização interpretativa da pergunta retórica de Jesus sobre identidade familiar
  choice: Manter as perguntas literais sem explicação adicional
  alternative: “Quem conta como minha mãe, e quem conta como meus irmãos?”
  rationale: O contexto seguinte desenvolve o sentido da pergunta, mas este versículo não deve antecipar essa explicação. A formulação direta preserva a tensão narrativa e teológica.
- issue: Tradução de ἀδελφοί quanto ao gênero
  choice: irmãos
  alternative: “irmãos e irmãs” ou “parentes”
  rationale: O referente imediato são os familiares de Jesus apresentados na cena, e o termo grego é masculino plural. ‘Irmãos’ evita ampliar ou alterar o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção principal é natural sem perder o contraste de δέ; a nota registra a forma mais literal do idioma grego.
