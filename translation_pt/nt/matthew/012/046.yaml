  text: Ἔτι ⸀δὲ αὐτοῦ λαλοῦντος τοῖς ὄχλοις ἰδοὺ ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ εἱστήκεισαν ἔξω ζητοῦντες αὐτῷ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/046.yaml
  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: pt
  text: Enquanto ele ainda falava às multidões, eis que sua mãe e seus irmãos[a] estavam do lado de fora, procurando falar com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seus parentes próximos», caso ἀδελφοί seja entendido em sentido mais amplo; o termo grego aqui está no masculino plural e foi traduzido no texto principal como «irmãos».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: Enquanto ele ainda falava
  rationale: A construção de genitivo absoluto indica uma ação simultânea, e ἔτι marca sua continuidade. «Enquanto... ainda» expressa isso com naturalidade; o δέ funciona aqui como transição narrativa leve e não exige tradução separada.
- source_word: τοῖς ὄχλοις
  choice: às multidões
  rationale: Mantém o plural do grego ὄχλοις e emprega uma expressão clara em português moderno.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva a função vívida do marcador discursivo, chamando atenção para a nova ocorrência sem recorrer ao imperativo menos natural «veja».
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: sua mãe e seus irmãos
  rationale: O possessivo é naturalmente aplicado aos dois termos em português. «Irmãos» conserva o masculino plural de ἀδελφοί sem definir além do texto a natureza exata desse parentesco.
- source_word: εἱστήκεισαν ἔξω
  choice: estavam do lado de fora
  rationale: A forma verbal tem sentido estativo e continuativo. «Estavam do lado de fora» é natural e não acrescenta um local, como «a casa», que não aparece explicitamente no versículo.
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: procurando falar com ele
  rationale: «Procurando» conserva a ideia intencional de ζητέω, e «falar com ele» traduz de modo idiomático a construção com o dativo αὐτῷ.
theological_decisions:
- issue: Sentido de ἀδελφοί em relação à família de Jesus
  choice: seus irmãos
  alternative: seus parentes próximos; seus irmãos e irmãs
  rationale: A forma grega é masculina plural e, na superfície narrativa, é adequadamente traduzida por «irmãos». A nota reconhece que o termo pode ser entendido de modo mais amplo em discussões sobre parentesco, sem decidir debates teológicos posteriores nem introduzir «irmãs», que não são especificadas aqui.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Eis que» conserva a vivacidade narrativa do original; «multidões» mantém o plural grego. A sintaxe segue de perto a progressão do versículo sem soar excessivamente literal.
