id: MAT.12.12
reference: Matthew 12:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πόσῳ οὖν διαφέρει ἄνθρωπος προβάτου. ὥστε ἔξεστιν τοῖς σάββασιν καλῶς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: pt
  text: Quanto mais vale, então, uma pessoa do que uma ovelha! Portanto, é lícito fazer o bem aos sábados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “no sábado”. O grego usa o plural “aos sábados”, uma expressão comum para falar da observância do sábado.
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ οὖν διαφέρει
  choice: Quanto mais vale, então
  rationale: A construção introduz um argumento do menor para o maior. “Quanto mais vale” comunica naturalmente a comparação de valor implícita em διαφέρει, enquanto “então” preserva a inferência marcada por οὖν.
- source_word: ἄνθρωπος
  choice: uma pessoa
  rationale: Neste contraste com uma ovelha, o substantivo designa genericamente um ser humano. “Uma pessoa” preserva esse sentido representativo em português atual sem restringi-lo desnecessariamente ao sexo masculino.
- source_word: προβάτου
  choice: do que uma ovelha
  rationale: O genitivo marca o segundo termo da comparação; “do que uma ovelha” é a formulação natural em português.
- source_word: ὥστε
  choice: Portanto
  rationale: Introduz a conclusão decorrente da comparação anterior e torna clara a ligação lógica.
- source_word: ἔξεστιν
  choice: é lícito
  rationale: O contexto trata do que a Lei permite no sábado. “É lícito” conserva a nuance jurídico-ética do verbo.
- source_word: τοῖς σάββασιν
  choice: aos sábados
  rationale: Mantém o plural grego e soa natural em português como referência à prática nos dias de sábado.
- source_word: καλῶς ποιεῖν
  choice: fazer o bem
  rationale: Expressão portuguesa natural e próxima do idioma grego, indicando uma ação boa ou benéfica.
theological_decisions:
- issue: Sentido genérico de ἄνθρωπος
  choice: uma pessoa
  alternative: um homem; um ser humano
  rationale: O contraste é entre qualquer ser humano e uma ovelha. A tradução “uma pessoa” expressa o alcance genérico sem acrescentar uma distinção sexual ausente do argumento.
- issue: Plural de σάββασιν
  choice: aos sábados
  alternative: no sábado; em dias de sábado
  rationale: O plural foi conservado no texto principal, embora possa funcionar idiomaticamente como referência ao sábado em geral. A nota registra a alternativa singular sem resolver além do necessário a forma do original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “É lícito” preserva o caráter da controvérsia sobre a Lei; “aos sábados” mantém a forma plural do grego sem soar artificial. A pontuação exclamativa transmite a força retórica da comparação.
