reference: Matthew 12:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: pt
  text: como entrou na casa de Deus, e eles comeram[a] os pães da Presença[b], que não era lícito nem a ele nem aos que estavam com ele comer, mas somente aos sacerdotes?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “ele comeu” em vez de “eles comeram”.
    reason: textual_variant
  - marker: b
    text: 'Também chamados tradicionalmente de “pães da proposição”: eram os pães consagrados colocados diante de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: como
  rationale: Introduz naturalmente, em português, o episódio citado por Jesus e mantém a forma interrogativa ligada ao contexto anterior.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: entrou na casa de Deus
  rationale: Tradução direta e idiomática; preserva a expressão do texto sem substituir seu referente contextual por “tabernáculo”.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: os pães da Presença
  rationale: Conserva o sentido cultual dos pães consagrados colocados diante de Deus, em linguagem clara e digna.
- source_word: ἔφαγον
  choice: eles comeram
  rationale: Segue a forma plural do texto grego fornecido. O pronome explícito evita que o português associe automaticamente o verbo apenas a Davi.
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: que não era lícito nem a ele nem aos que estavam com ele comer
  rationale: Preserva a força legal e cultual de ἐξόν, bem como a distinção entre Davi e seus acompanhantes, sem resolver a tensão sintática do texto.
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: mas somente aos sacerdotes
  rationale: Expressa de modo natural a exceção exclusiva indicada por εἰ μή e μόνοις.
theological_decisions:
- issue: Força cultual e legal de ἐξὸν
  choice: não era lícito
  alternative: não era permitido
  rationale: “Lícito” mantém a referência a uma restrição reconhecida na Lei, em vez de sugerir apenas uma permissão social ou circunstancial.
- issue: Sujeito textual de ἔφαγον
  choice: eles comeram
  alternative: ele comeu
  rationale: O texto SBLGNT fornecido apresenta o verbo no plural. A variante singular é relevante e foi registrada em nota, sem ser introduzida no texto principal.
- issue: Referente de “casa de Deus”
  choice: casa de Deus
  alternative: tabernáculo
  rationale: A tradução conserva a formulação grega e não explicita no corpo do texto uma identificação contextual que o versículo não enuncia.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação mantém tom digno e bíblico sem arcaísmo excessivo. O plural explícito “eles comeram” reproduz o texto grego fornecido, e a construção com “lícito” preserva o caráter legal e cultual da passagem.
