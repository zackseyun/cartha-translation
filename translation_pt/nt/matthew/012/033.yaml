  source_fidelity: A tradução preserva corretamente a estrutura alternativa, os dois imperativos aoristos, o paralelismo entre árvore e fruto e a conclusão explicativa. Contudo, «estragada» pode sugerir meramente danificada e enfraquece a imagem de deterioração/corrupção de σαπρός. Além disso, a omissão de «seu» na cláusula final deixa de explicitar o possessivo αὐτοῦ, que pode ser mantido sem perda de naturalidade.
  naturalness: «Árvore podre» é expressão natural e inteligível no português moderno dentro da metáfora, e comunica melhor a imagem concreta do que «árvore estragada». «Pelo seu fruto» é igualmente natural e torna explícita a relação metafórica.
  terminology: «Boa», «fruto», «podre», «façam» e «é conhecida» representam adequadamente os termos gregos e mantêm o registro bíblico moderno. As notas preservam a alternativa retórica para ποιήσατε sem transformar o texto principal em paráfrase interpretativa.
