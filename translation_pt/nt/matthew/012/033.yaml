reference: Matthew 12:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: pt
  text: Ou façam a árvore boa e o seu fruto bom, ou façam a árvore podre e o seu fruto podre[a], pois a árvore é conhecida pelo seu fruto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ruim» ou «estragado». O termo grego pode indicar algo deteriorado, corrompido ou imprestável.
    reason: lexical_alternative
  - marker: b
    text: O imperativo repetido, traduzido por «façam», pode ter aqui o sentido retórico de «considerem» ou «mostrem que é»; a forma grega, porém, é imperativa.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσατε
  choice: façam
  rationale: Preserva o imperativo aoristo plural e o paralelismo retórico, sem decidir por uma paráfrase como «considerem» ou «mostrem que é».
- source_word: δένδρον
  choice: árvore
  rationale: Equivalente direto e natural, central para a metáfora.
- source_word: καλός
  choice: bom/boa
  rationale: Mantém tanto a ideia de boa qualidade quanto a possível ressonância moral, sem restringir o sentido a «saudável».
- source_word: καρπός
  choice: fruto
  rationale: Conserva diretamente a imagem metafórica e é expressão bíblica natural em português.
- source_word: σαπρός
  choice: estragado/estragada
  rationale: Aplica-se naturalmente tanto à árvore quanto ao fruto e comunica algo deteriorado, corrompido ou imprestável; evita a estranheza de chamar uma árvore de «podre» sem perder a força da imagem.
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: pois ... pelo fruto
  rationale: «Pois» expressa a relação explicativa de γάρ, e «pelo fruto» traduz ἐκ de modo idiomático no contexto do reconhecimento da árvore.
- source_word: γινώσκεται
  choice: é conhecida
  rationale: Preserva o presente passivo de forma clara e formalmente próxima.
- source_word: αὐτοῦ
  choice: seu
  rationale: Retoma naturalmente «árvore» em português; na frase final, o possessivo pode ser omitido sem ambiguidade relevante.
theological_decisions:
- issue: Força dos imperativos na metáfora de Jesus
  choice: 'Mantidos como imperativos diretos: «façam ... façam».'
  alternative: «Considerem a árvore...» ou «mostrem que a árvore é...»
  rationale: O grego apresenta dois imperativos aoristos. Embora possam ter força retórica de considerar, declarar ou demonstrar, preservar a forma imperativa mantém a tensão e a contundência do argumento sem impor uma interpretação.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo e os imperativos do grego foram preservados. Os marcadores aparecem junto aos elementos que explicam: [a] após a segunda ocorrência de «estragado» e [b] após a conclusão do versículo.'
