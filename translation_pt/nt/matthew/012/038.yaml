    issue: Escopo potencialmente ambíguo de «alguns»
    rationale: Em «alguns dos escribas e fariseus», a coordenação pode ser entendida como «alguns escribas e [todos os] fariseus». Repetir a contração em «alguns dos escribas e dos fariseus» torna claro que se trata de pessoas tomadas desses dois grupos, em conformidade com τινες τῶν γραμματέων καὶ Φαρισαίων.
  - severity: low
    issue: Âncora da nota lexical
    rationale: A nota explica especificamente σημεῖον; portanto, o marcador deve seguir «sinal», não a pontuação final da fala.
