id: MAT.12.38
reference: Matthew 12:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: pt
  text: 'Então alguns dos escribas e dos fariseus lhe responderam: “Mestre, queremos ver um sinal[a] da sua parte.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um sinal milagroso”. A palavra grega pode indicar um sinal de caráter milagroso, mas o texto principal mantém o termo mais amplo “sinal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca naturalmente a sequência narrativa e corresponde ao valor temporal do advérbio grego.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: lhe responderam
  rationale: Preserva o idioma narrativo grego de responder, ainda que não haja uma pergunta imediatamente anterior, e expressa com clareza o destinatário.
- source_word: τινες τῶν γραμματέων καὶ Φαρισαίων
  choice: alguns dos escribas e fariseus
  rationale: Mantém τινες como referência apenas a uma parte desses grupos e conserva as designações históricas tradicionais.
- source_word: λέγοντες
  choice: introdução por dois-pontos
  rationale: Em português natural, o particípio que introduz a fala direta pode ser representado pela pontuação, evitando a construção redundante 'responderam, dizendo'.
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: Forma corrente e digna de tratamento para um mestre ou professor religioso; neste contexto, não exige uma afirmação adicional sobre autoridade.
- source_word: θέλομεν
  choice: queremos
  rationale: Expressa de maneira direta e atual a vontade declarada pelos interlocutores.
- source_word: ἀπὸ σοῦ
  choice: da sua parte
  rationale: Comunica de modo idiomático em português que o sinal deve proceder de Jesus, sem sugerir apenas que seja visto em sua presença.
- source_word: σημεῖον
  choice: um sinal
  rationale: Preserva o sentido lexical amplo do grego e deixa que o contexto comunique sua possível natureza milagrosa.
- source_word: ἰδεῖν
  choice: ver
  rationale: Equivalente direto e natural do infinitivo grego, sem a interpretação adicional implicada por 'presenciar'.
theological_decisions:
- issue: Natureza de σημεῖον no contexto
  choice: sinal
  alternative: sinal milagroso
  rationale: O contexto sugere um feito sobrenatural que autentique Jesus, mas σημεῖον significa literalmente 'sinal'. A tradução principal conserva essa amplitude sem explicitar além do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala direta foi introduzida por dois-pontos para maior naturalidade. 'Escribas' e 'fariseus' preservam as designações históricas usuais.
