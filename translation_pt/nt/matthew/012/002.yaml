id: MAT.12.2
reference: Matthew 12:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: pt
  text: 'Mas os fariseus, ao verem isso, disseram a Jesus: “Olhe! Seus discípulos estão fazendo o que não é permitido fazer no sábado.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste com o desenvolvimento narrativo anterior de modo natural em português.
- source_word: οἱ Φαρισαῖοι
  choice: os fariseus
  rationale: Emprega a designação consagrada e clara para o grupo religioso mencionado.
- source_word: ἰδόντες
  choice: ao verem isso
  rationale: Traduz o particípio aoristo com valor temporal e explicita, por meio de “isso”, a ação dos discípulos indicada pelo contexto.
- source_word: εἶπαν αὐτῷ
  choice: disseram a Jesus
  rationale: Expressa naturalmente a fórmula de fala; o nome “Jesus” esclarece o referente do pronome sem alterar o sentido.
- source_word: Ἰδοὺ
  choice: Olhe!
  rationale: Interjeição atual que chama enfaticamente a atenção para a acusação, sem o tom arcaico de “Eis”.
- source_word: οἱ μαθηταί σου
  choice: Seus discípulos
  rationale: “Discípulos” preserva a relação entre mestre e aprendiz própria do contexto dos Evangelhos.
- source_word: ποιοῦσιν ... ποιεῖν
  choice: estão fazendo ... fazer
  rationale: Mantém a repetição de ποιέω e comunica o aspecto progressivo da ação observada.
- source_word: ὃ οὐκ ἔξεστιν
  choice: o que não é permitido
  rationale: ἔξεστιν se refere ao que é permitido ou lícito; esta formulação preserva o caráter normativo da objeção sem definir a fonte da norma.
- source_word: ἐν σαββάτῳ
  choice: no sábado
  rationale: É a expressão temporal idiomática em português para o dia ou a instituição do sábado neste contexto.
theological_decisions:
- issue: Natureza da objeção dos fariseus
  choice: “não é permitido” em linguagem normativa neutra
  alternative: “não é lícito” ou “é contra a Lei”
  rationale: O versículo relata a acusação, mas não determina aqui se a proibição procede da lei bíblica ou de uma interpretação tradicional. A tradução evita resolver essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Olhe!” conserva a força dêitica de Ἰδοὺ; “não é permitido” soa mais corrente que “não é lícito” sem perder o teor normativo.
