id: MAT.12.50
reference: Matthew 12:50
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: pt
  text: Pois quem fizer a vontade de meu Pai, que está nos céus, esse é meu irmão, minha irmã e minha mãe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: quem
  rationale: A construção relativa indefinida com ἄν exprime uma condição geral e aberta; em português, “quem” comunica naturalmente “todo aquele que”, sem restringir o referente.
- source_word: γὰρ
  choice: Pois
  rationale: Preserva a ligação explicativa com a declaração anterior de Jesus de modo conciso e digno.
- source_word: ποιήσῃ
  choice: fizer
  rationale: Com θέλημα, ποιέω significa pôr em prática ou fazer a vontade; “fizer” preserva essa formulação sem introduzir a interpretação mais estreita de “obedecer”.
- source_word: τὸ θέλημα
  choice: a vontade
  rationale: Equivalente direto que mantém o sentido relacional e teológico da expressão.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: de meu Pai, que está nos céus
  rationale: Reproduz de forma natural a expressão atributiva grega e conserva o plural “céus” de οὐρανοῖς.
- source_word: αὐτός
  choice: esse
  rationale: O pronome demonstrativo retoma enfaticamente a pessoa que faz a vontade do Pai, preservando a ênfase do grego sem impor gênero masculino ao referente genérico.
- source_word: ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ
  choice: meu irmão, minha irmã e minha mãe
  rationale: Mantém separadamente os três termos familiares no singular, como no grego, com os possessivos necessários ao português natural.
- source_word: ἐστίν
  choice: é
  rationale: Preserva a cópula no presente.
theological_decisions:
- issue: Masculino gramatical em uma afirmação de alcance genérico
  choice: quem ... esse é meu irmão, minha irmã e minha mãe
  alternative: todo aquele que ... ele é meu irmão, minha irmã e minha mãe
  rationale: ὅστις e αὐτός estão no masculino singular por concordância gramatical, mas a construção é genericamente inclusiva, como confirma a menção explícita a “irmã” e “mãe”. Em português, “quem ... esse” conserva o singular e a ênfase sem sugerir falsamente que somente um homem pode ser o referente.
- issue: Imagem de parentesco espiritual
  choice: é meu irmão, minha irmã e minha mãe
  alternative: faz parte da minha família
  rationale: A enumeração concreta de Jesus é preservada em vez de ser reduzida a uma paráfrase, mantendo sua força e tensão retórica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pois” mantém a conexão discursiva; “nos céus” segue o plural grego e é expressão bíblica corrente. Não são necessárias notas de rodapé, pois a genericidade de “quem” é natural em português e a enumeração inclui explicitamente os gêneros.
