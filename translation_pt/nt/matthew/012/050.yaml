  source_fidelity: A tradução preserva adequadamente a construção genérica ὅστις ... ἄν (“quem”), a conexão explicativa de γάρ (“Pois”), o sentido de ποιήσῃ τὸ θέλημα (“fizer a vontade”) e a ênfase anafórica de αὐτός (“esse”). A enumeração singular “meu irmão, minha irmã e minha mãe” reproduz os três termos de parentesco do grego sem paráfrase. “Meu Pai, que está nos céus” é uma representação fiel e idiomática de τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
  naturalness: O texto é claro, moderno e de registro bíblico digno, com boa legibilidade no português internacional e brasileiro. “Pois quem fizer ... esse é ...” é uma construção natural e mantém a progressão argumentativa.
