  source_fidelity: 'O texto português preserva com precisão a série de três negações do grego: Jesus não entrará em contenda (οὐκ ἐρίσει), não gritará (οὐδὲ κραυγάσει), e ninguém ouvirá sua voz no espaço público (οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ). “Discutirá”, embora um pouco mais amplo que “contenderá”, comunica adequadamente a ideia contextual de não se envolver em conflito verbal. “Nas ruas” é uma equivalência idiomática aceitável para πλατείαις.'
