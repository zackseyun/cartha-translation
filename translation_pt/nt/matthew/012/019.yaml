id: MAT.12.19
reference: Matthew 12:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: pt
  text: Ele não discutirá nem gritará,[a] e ninguém ouvirá a sua voz nas ruas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele não contenderá nem clamará, e ninguém ouvirá a sua voz nas praças públicas.”'
    reason: Alternativas lexicais que refletem sentidos possíveis de ἐρίζω, κραυγάζω e πλατεῖαι e preservam uma formulação mais tradicional.
lexical_decisions:
- source_word: ἐρίσει
  choice: discutirá
  rationale: O futuro de ἐρίζω indica envolver-se em contenda ou discussão. “Discutirá” é natural no português atual e comunica uma postura não contenciosa sem sugerir mera atividade ou esforço.
- source_word: κραυγάσει
  choice: gritará
  rationale: κραυγάζω denota clamar em voz alta ou gritar. “Gritará” expressa de modo claro a intensidade pública do verbo e mantém o paralelismo.
- source_word: ἀκούσει τις
  choice: ninguém ouvirá
  rationale: A construção grega com negação e pronome indefinido equivale idiomaticamente a “ninguém ouvirá” em português.
- source_word: ἐν ταῖς πλατείαις
  choice: nas ruas
  rationale: πλατεῖαι designa ruas largas ou vias públicas. “Nas ruas” é a formulação mais natural e conserva o cenário público; “nas praças públicas” permanece uma alternativa possível.
- source_word: φωνὴν αὐτοῦ
  choice: a sua voz
  rationale: φωνή significa aqui “voz”; o possessivo retoma com clareza o sujeito do versículo.
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: não… nem… e ninguém…
  rationale: A sequência conserva a força cumulativa das três negações em sintaxe portuguesa fluente.
theological_decisions:
- issue: Relação com a citação do Servo em Isaías e descrição da conduta do Messias
  choice: O versículo retrata o Messias como não contencioso e sem exibição pública ruidosa.
  alternative: Uma tradução mais formal poderia usar “não contenderá nem clamará”, ecoando a linguagem tradicional da citação.
  rationale: O grego caracteriza a maneira de agir de Jesus no cumprimento de Isaías 42:2. A formulação preserva sua postura mansa e não combativa, sem transformar a frase em uma doutrina de silêncio ou passividade absolutos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Discutirá” evita o tom arcaico de “contenderá” no texto principal; “nas ruas” comunica naturalmente o espaço público. A vírgula antes da nota encerra a segunda oração coordenada.
