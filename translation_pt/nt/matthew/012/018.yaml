id: MAT.12.18
reference: Matthew 12:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: pt
  text: Eis o meu servo, a quem escolhi, o meu amado, em quem a minha alma se deleitou.[a] Porei sobre ele o meu Espírito, e ele proclamará justiça[b] às nações.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «em quem a minha alma se agradou».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «julgamento».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «aos gentios».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Eis
  rationale: Conserva a força profética de chamar a atenção e mantém um tom digno, sem deixar de ser reconhecível no português atual.
- source_word: παῖς
  choice: servo
  rationale: No contexto da citação de Isaías, designa o servo de Deus; evita introduzir aqui os sentidos possíveis de «criança» ou «filho».
- source_word: ᾑρέτισα
  choice: escolhi
  rationale: Expressa de modo direto e natural o ato consumado da escolha divina indicado pelo aoristo.
- source_word: ἀγαπητός
  choice: amado
  rationale: Preserva tanto a afeição divina quanto a dignidade da declaração.
- source_word: εἰς ὃν
  choice: em quem
  rationale: No idioma formado com εὐδοκέω, indica de maneira natural a pessoa em quem recai o deleite.
- source_word: εὐδόκησεν ἡ ψυχή μου
  choice: a minha alma se deleitou
  rationale: Mantém o sujeito explícito «a minha alma» e a força afetiva do verbo, sem reduzi-lo simplesmente a «eu me agradei».
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: Porei sobre ele o meu Espírito
  rationale: Segue de perto a linguagem de investidura profética e identifica o Espírito como pertencente a Deus.
- source_word: κρίσιν
  choice: justiça
  rationale: Neste contexto da missão do servo às nações, comunica a ordem justa de Deus que ele anuncia; «julgamento» permanece como alternativa lexical possível.
- source_word: τοῖς ἔθνεσιν
  choice: às nações
  rationale: Preserva o alcance universal da citação profética; o termo também pode designar especificamente os gentios.
- source_word: ἀπαγγελεῖ
  choice: proclamará
  rationale: Expressa o anúncio público e solene próprio do contexto profético.
theological_decisions:
- issue: Identidade messiânica do servo em παῖς
  choice: Traduzir παῖς como «servo», de acordo com a passagem do servo em Isaías.
  alternative: «criança» ou «filho»
  rationale: A citação apresenta Jesus no papel do servo de Deus. «Servo» preserva a ligação intertextual sem inserir neste vocábulo uma ênfase filial que ele não explicita aqui.
- issue: Sentido de κρίσις na missão profética
  choice: Usar «justiça» no texto principal.
  alternative: «julgamento»
  rationale: O contexto enfoca aquilo que o servo levará às nações. «Justiça» comunica adequadamente a manifestação da ordem reta de Deus, enquanto a nota preserva a ambiguidade lexical genuína.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Eis» e «se deleitou» conservam o caráter solene da citação profética sem tornar a frase arcaica. A ordem das notas acompanha sua ocorrência no texto.
