source:
  edition: SBLGNT
  text: ἐκ γὰρ τῶν λόγων σου δικαιωθήσῃ, καὶ ἐκ τῶν λόγων σου καταδικασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: pt
  text: Pois pelas suas palavras você será justificado[a], e pelas suas palavras será condenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “será reconhecido como justo” ou “será absolvido”. O verbo grego pode ter o sentido judicial de receber uma declaração favorável.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: pelas
  rationale: Com o genitivo, indica aqui a base ou evidência do juízo. “Pelas” é natural em português e conserva a ideia de que as palavras servem de base para o veredito.
- source_word: γάρ
  choice: Pois
  rationale: Introduz a explicação da advertência anterior sobre a fala, preservando a ligação argumentativa do texto.
- source_word: λόγων
  choice: palavras
  rationale: Refere-se às expressões faladas da pessoa. “Palavras” é direto, natural e mantém a repetição paralela do grego.
- source_word: σου
  choice: suas
  rationale: O pronome no genitivo indica posse e modifica “palavras” nas duas orações.
- source_word: δικαιωθήσῃ
  choice: você será justificado
  rationale: O futuro passivo de δικαιόω tem sentido forense neste contexto de juízo. “Será justificado” preserva o registro judicial e a ligação verbal com o uso bíblico mais amplo, sem explicitar além do texto.
- source_word: καταδικασθήσῃ
  choice: será condenado
  rationale: O futuro passivo de καταδικάζω é judicial e forma uma antítese deliberada com δικαιωθήσῃ. “Será condenado” expressa claramente esse contraste.
theological_decisions:
- issue: Sentido forense de δικαιόω em relação às palavras e ao juízo
  choice: “Você será justificado”, entendido judicialmente como receber um veredito favorável com base nas palavras apresentadas como evidência.
  alternative: “Você será declarado justo”, “será absolvido” ou “será reconhecido como justo”.
  rationale: O paralelismo explícito com “será condenado” estabelece um contexto de tribunal. A tradução mantém a tensão do versículo — as palavras como base probatória do veredito — sem inserir uma formulação doutrinária mais ampla sobre a justificação.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O uso de “você” torna explícito o singular de σου e dos verbos, enquanto a omissão do segundo “você” evita peso desnecessário sem apagar o paralelismo. A repetição de “pelas suas palavras” foi mantida para reproduzir a ênfase do original.
