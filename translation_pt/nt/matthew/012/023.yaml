  text: καὶ ἐξίσταντο πάντες οἱ ὄχλοι καὶ ἔλεγον· Μήτι οὗτός ἐστιν ὁ υἱὸς Δαυίδ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: pt
  text: 'E todas as multidões estavam maravilhadas e diziam: “Será que este é o Filho de Davi[a]?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O Filho de Davi” é um título messiânico que se refere ao libertador real prometido, descendente de Davi.
    reason: cross_reference
  - marker: b
    text: 'Ou, refletindo mais literalmente a força da pergunta: “Este não é o Filho de Davi, é?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: ficaram maravilhadas
  rationale: Expressa com naturalidade a forte reação de espanto causada pela cura. Embora o imperfeito descreva a reação em curso, o português narrativo admite aqui o pretérito perfeito, enquanto o verbo seguinte preserva a continuidade da cena.
- source_word: πάντες οἱ ὄχλοι
  choice: todas as multidões
  rationale: Mantém tanto a totalidade indicada por πάντες quanto o plural explícito de ὄχλοι, ainda que «toda a multidão» fosse mais idiomático.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito português reproduz naturalmente a fala contínua ou repetida das multidões.
- source_word: Μήτι
  choice: Será que
  rationale: Introduz uma pergunta hesitante e admirada, preservando a inclinação de Μήτι para uma resposta negativa sem transformar a dúvida em negação categórica.
- source_word: ὁ υἱὸς Δαυίδ
  choice: o Filho de Davi
  rationale: Conserva a forma literal e o valor de título messiânico presentes no texto, sem substituí-lo por uma paráfrase interpretativa.
theological_decisions:
- issue: Sentido messiânico de «o Filho de Davi»
  choice: Manter «o Filho de Davi» no texto principal.
  alternative: «o Messias» ou «o herdeiro prometido de Davi»
  rationale: O grego emprega o próprio título, historicamente carregado. Mantê-lo preserva a formulação e a tensão teológica do texto; a nota esclarece sua relevância messiânica.
- issue: Força negativa implícita em Μήτι
  choice: Traduzir por «Será que este é...?».
  alternative: «Este não é o Filho de Davi, é?»
  rationale: A alternativa mais literal destaca que a pergunta tende a esperar resposta negativa, mas «Será que» comunica melhor em português corrente a hesitação admirada da multidão sem eliminar essa ambiguidade; a nota registra a força da construção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Será que» é corrente sem ser coloquial demais; «todas as multidões» conserva deliberadamente o plural grego.
