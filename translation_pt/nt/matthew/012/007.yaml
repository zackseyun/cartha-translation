id: MAT.12.7
reference: Matthew 12:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: pt
  text: 'Mas, se vocês tivessem entendido o que significa: “Quero misericórdia, e não sacrifício”[a], não teriam condenado os inocentes.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jesus cita Oseias 6:6.
    reason: cross_reference
  - marker: b
    text: Ou “os que não têm culpa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: tivessem entendido
  rationale: No período condicional contrário aos fatos, expressa uma compreensão que deveria ter ocorrido antes; em português, “se vocês tivessem entendido” é natural e mantém a repreensão de Jesus.
- source_word: τί ἐστιν
  choice: o que significa
  rationale: Neste contexto de introdução de uma citação bíblica, refere-se ao sentido do texto, não à mera identificação de algo.
- source_word: Ἔλεος
  choice: misericórdia
  rationale: Reproduz o sentido de compaixão e lealdade misericordiosa no contexto da citação de Oseias, sem ampliar indevidamente o termo.
- source_word: θέλω
  choice: Quero
  rationale: É a tradução direta e natural do verbo no português moderno; conserva a força da declaração divina sem artificialidade.
- source_word: θυσίαν
  choice: sacrifício
  rationale: Mantém no singular o contraste profético entre misericórdia e observância sacrificial.
- source_word: κατεδικάσατε
  choice: não teriam condenado
  rationale: Preserva a força judicial do verbo e corresponde naturalmente à consequência irreal da condição anterior.
- source_word: ἀναιτίους
  choice: os inocentes
  rationale: Expressa de modo claro e corrente a ausência de culpa, mantendo a relação forense com “condenado”.
theological_decisions:
- issue: Preservar o contraste profético de Oseias 6:6 sem transformá-lo numa negação geral da legitimidade dos sacrifícios.
  choice: “Quero misericórdia, e não sacrifício”
  alternative: “Quero misericórdia, não sacrifício”
  rationale: 'A formulação mantém o contraste enfático do grego e a tensão teológica do texto: Deus prioriza a misericórdia diante de uma prática ritual desligada da fidelidade, sem inserir uma explicação doutrinária no versículo.'
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com tratamento plural por “vocês”. A ordem dos marcadores acompanha cada elemento pertinente: a referência após a citação e a alternativa lexical após “os inocentes”.'
