id: MAT.12.29
reference: Matthew 12:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: pt
  text: Ou como alguém pode entrar na casa do homem forte e tomar à força os seus bens[a], sem primeiro amarrar[b] o homem forte? E então saqueará a casa dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os seus utensílios” ou “os seus pertences”; o termo grego pode designar literalmente utensílios, recipientes ou, de modo mais amplo, os bens de uma pessoa.
    reason: lexical_alternative
  - marker: b
    text: Ou “prender”; o verbo grego pode significar amarrar ou pôr alguém sob restrição.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ou
  rationale: Introduz uma comparação explicativa alternativa ligada ao argumento anterior, preservando de modo conciso a conexão do grego.
- source_word: πῶς δύναταί τις
  choice: como alguém pode
  rationale: Mantém a forma de pergunta retórica e o sentido genérico do pronome indefinido em português natural.
- source_word: εἰσελθεῖν εἰς τὴν οἰκίαν
  choice: entrar na casa
  rationale: Reproduz diretamente a imagem concreta de entrar numa casa.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: do homem forte / o homem forte
  rationale: Preserva a substantivação masculina e a figura concreta presente no grego, sem explicar alegoricamente sua identidade.
- source_word: τὰ σκεύη αὐτοῦ
  choice: os seus bens
  rationale: Embora σκεύη possa designar literalmente utensílios ou recipientes, no contexto de saque de uma casa refere-se naturalmente aos pertences do proprietário.
- source_word: ἁρπάσαι
  choice: tomar à força
  rationale: Expressa a tomada violenta indicada pelo verbo sem antecipar inteiramente o sentido mais abrangente de διαρπάσει.
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: sem primeiro amarrar
  rationale: Forma idiomática em português que preserva tanto a condição negativa quanto a prioridade temporal; “amarrar” comunica concretamente a imobilização.
- source_word: καὶ τότε
  choice: E então
  rationale: Conserva a conjunção e a progressão temporal explícitas no texto grego, sem acrescentar a ideia de exclusividade de “só então”.
- source_word: διαρπάσει
  choice: saqueará
  rationale: O verbo composto indica pilhar ou despojar amplamente, com força maior que o primeiro verbo de tomada.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: a casa dele
  rationale: Mantém a imagem literal da casa e usa uma retomada pronominal clara e natural.
theological_decisions:
- issue: Linguagem masculina representativa na metáfora
  choice: homem forte / alguém
  alternative: o forte / qualquer pessoa
  rationale: O grego apresenta uma figura masculina concreta, ὁ ἰσχυρός, mas usa um sujeito indefinido para quem entra. A tradução preserva “homem forte” sem tornar “alguém” desnecessariamente marcado por gênero.
- issue: Alcance metafórico de “casa” e “bens”
  choice: Manter a cena concreta de invasão, imobilização e saque
  alternative: Explicitar como domínio espiritual e pessoas ou poderes sob controle
  rationale: O contexto relaciona a figura à autoridade sobre poderes demoníacos, mas o versículo formula uma metáfora. Explicá-la dentro do texto eliminaria sua tensão e acrescentaria interpretação não expressa lexicalmente.
- issue: Relação entre ἁρπάσαι e διαρπάσει
  choice: tomar à força / saqueará
  alternative: roubar / roubará
  rationale: 'A diferenciação evita apagar a progressão verbal do grego: primeiro se menciona a apropriação violenta dos bens; depois, o saque da casa como um todo.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe conserva a pergunta retórica e a sequência da metáfora. “Tomar à força” e “saqueará” distinguem os dois verbos gregos; “casa dele” evita uma repetição possessiva pesada sem perder o referente.
