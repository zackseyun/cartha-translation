id: MAT.12.14
reference: Matthew 12:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂ἐξελθόντες δὲ οἱ Φαρισαῖοι συμβούλιον ἔλαβον κατ’ αὐτοῦ⸃ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/014.yaml
  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: pt
  text: Mas os fariseus saíram e conspiraram contra ele, procurando um modo de destruí-lo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “matá-lo” ou “fazê-lo morrer”. O verbo grego diz “destruí-lo” e, neste contexto, pode expressar intenção letal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: saíram
  rationale: O particípio aoristo tem valor temporal e sequencial; a forma verbal coordenada é natural em português e preserva a saída que antecede a conspiração.
- source_word: δὲ
  choice: Mas
  rationale: Marca a mudança contrastante entre a ação anterior de Jesus e a reação hostil dos fariseus.
- source_word: οἱ Φαρισαῖοι
  choice: os fariseus
  rationale: Forma tradicional e amplamente compreendida em português para o nome desse grupo judaico.
- source_word: συμβούλιον ἔλαβον
  choice: conspiraram
  rationale: A expressão significa literalmente tomar conselho ou deliberar; no contexto hostil, 'conspiraram' comunica de modo natural a deliberação conjunta contra Jesus.
- source_word: κατ’ αὐτοῦ
  choice: contra ele
  rationale: κατά com genitivo tem aqui sentido adversativo.
- source_word: ὅπως
  choice: procurando um modo de
  rationale: Introduz o propósito e o conteúdo deliberativo da conspiração; esta formulação portuguesa preserva a ideia de planejar como realizar o objetivo.
- source_word: ἀπολέσωσιν
  choice: destruí-lo
  rationale: Preserva a amplitude lexical de ἀπόλλυμι, que neste contexto pode indicar eliminação mediante morte, sem substituir no texto principal o verbo mais amplo por um termo explicitamente letal.
theological_decisions:
- issue: Grau de especificidade na tradução de ἀπολέσωσιν
  choice: destruí-lo
  alternative: matá-lo; fazê-lo morrer
  rationale: O contexto aponta para intenção letal, mas o verbo grego é mais amplo que um verbo explícito para matar. A tradução principal mantém essa amplitude, e a nota registra as alternativas contextualmente possíveis.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'Conspiraram' evita o literalismo pouco natural de 'tomaram conselho'; 'procurando um modo de' expressa naturalmente a nuance deliberativa de ὅπως após a ideia de conspiração.
