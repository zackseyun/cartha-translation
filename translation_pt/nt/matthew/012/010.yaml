  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: pt
  text: 'E eis que havia um homem com uma mão ressequida. E lhe perguntaram: “É lícito curar aos sábados[a]?”, a fim de o acusarem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no sábado”. O grego emprega o plural “aos sábados”, uma forma comum de se referir aos dias de sábado.'
    reason: alternativa lexical e esclarecimento do número gramatical
lexical_decisions:
- source_word: ἰδοὺ
  choice: eis que
  rationale: Conserva a função discursiva de chamar a atenção para a cena, em linguagem bíblica ainda clara e corrente.
- source_word: ἄνθρωπος
  choice: um homem
  rationale: O substantivo singular masculino designa aqui um indivíduo do sexo masculino.
- source_word: χεῖρα ἔχων ξηράν
  choice: com uma das mãos ressequida
  rationale: A construção com particípio é vertida de modo natural. “Ressequida” preserva a imagem de ξηράν sem definir de forma indevida um diagnóstico médico específico; “uma das mãos” exprime naturalmente em português a referência a uma mão do homem.
- source_word: ἐπηρώτησαν αὐτόν
  choice: lhe perguntaram
  rationale: Tradução direta e idiomática; a intenção hostil é explicitada no fim do versículo, não sendo necessário carregá-la no verbo “perguntar”.
- source_word: λέγοντες
  choice: introdução direta da fala por dois-pontos
  rationale: O particípio semítico é representado naturalmente em português pela introdução da fala direta, sem o redundante “dizendo”.
- source_word: ἔξεστι
  choice: é lícito
  rationale: Expressa com concisão que a questão diz respeito ao que a lei permite no contexto da controvérsia sobre o sábado.
- source_word: τοῖς σάββασιν
  choice: aos sábados
  rationale: Mantém o plural grego e, ao mesmo tempo, usa uma construção portuguesa natural para dias de sábado em geral.
- source_word: θεραπεύειν
  choice: curar
  rationale: É a tradução comum e natural no contexto das curas realizadas por Jesus.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: Isso para poderem acusá-lo
  rationale: Torna clara a finalidade hostil da pergunta e preserva o sentido acusatório de κατηγορέω. A frase separada evita que a finalidade seja entendida como parte da pergunta citada.
theological_decisions:
- issue: Expressão sabática no contexto de uma controvérsia legal
  choice: aos sábados
  alternative: no sábado
  rationale: O grego emprega o dativo plural τοῖς σάββασιν. O plural é mantido no texto principal de maneira idiomática em português, enquanto a formulação singular comum é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “E eis que” preserva a vivacidade narrativa do original; “é lícito” mantém o caráter jurídico-religioso da pergunta sem acrescentar uma referência explícita à Lei que não aparece no texto grego.
