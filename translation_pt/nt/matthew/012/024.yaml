  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: pt
  text: 'Mas os fariseus, ao ouvirem isso, disseram: “Este homem não expulsa os demônios senão por meio de Belzebul[a], o governante dos demônios.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “Belzebu”.
    reason: Registra a forma tradicional portuguesa do nome, enquanto o texto principal segue a forma Βεελζεβούλ da fonte grega.
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Expressa naturalmente o contraste entre a reação positiva anterior e a acusação dos fariseus.
- source_word: ἀκούσαντες
  choice: ao ouvirem isso
  rationale: Reproduz o valor temporal do particípio aoristo e explicita com naturalidade o objeto implícito no contexto.
- source_word: Οὗτος
  choice: Este homem
  rationale: Conserva o tom depreciativo do demonstrativo no contexto sem acrescentar interpretação.
- source_word: ἐκβάλλει
  choice: expulsa
  rationale: É uma equivalência direta, atual e idiomática para a ação de fazer os demônios sair.
- source_word: τὰ δαιμόνια
  choice: os demônios
  rationale: Mantém o referente explícito do grego e a terminologia comum nos Evangelhos.
- source_word: εἰ μὴ
  choice: senão
  rationale: Apresenta o único meio alegado pelos fariseus, preservando a estrutura restritiva da frase.
- source_word: ἐν τῷ Βεελζεβοὺλ
  choice: por meio de Belzebu
  rationale: Neste contexto, ἐν indica meio ou agência; a formulação comunica isso claramente sem inserir de modo explícito a palavra 'poder'.
- source_word: Βεελζεβοὺλ
  choice: Belzebu
  rationale: Forma portuguesa consagrada do nome representado no texto grego como Βεελζεβούλ; uma nota registra uma transliteração mais estrita da forma grega.
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: o governante dos demônios
  rationale: Traduz a ideia de autoridade de ἄρχων em linguagem moderna, clara e não excessivamente tradicional.
theological_decisions:
- issue: Força do demonstrativo hostil Οὗτος
  choice: Este homem
  alternative: Este; Ele
  rationale: A fala dos fariseus tem tom depreciativo. A escolha preserva essa nuance sem intensificá-la nem introduzir uma conclusão doutrinária.
- issue: Forma do nome Βεελζεβούλ
  choice: Belzebu no texto, com nota sobre Belzebul
  alternative: Belzebul no texto principal
  rationale: Belzebu é a forma portuguesa amplamente reconhecida, enquanto a nota mantém visível que a forma grega desta edição corresponde mais estritamente a Belzebul.
- issue: Valor instrumental de ἐν
  choice: por meio de Belzebu
  alternative: pelo poder de Belzebu
  rationale: A tradução preserva a acusação de agência ou meio sem acrescentar 'poder', termo não expresso no grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem foi levemente ajustada para fluência, sem eliminar o contraste, o tom hostil nem a alegação de que Belzebu seria o meio da expulsão.
