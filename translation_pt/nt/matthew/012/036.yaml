  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: pt
  text: Mas eu lhes digo que as pessoas prestarão contas, no dia do juízo, por toda palavra irresponsável[a] que disserem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ociosa”, “inútil” ou “sem fruto”. O termo grego descreve aquilo que está inativo ou não produz resultado e, neste contexto, pode indicar uma palavra dita sem o devido cuidado.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Mas eu lhes digo
  rationale: O presente λέγω com o pronome de segunda pessoa pede uma declaração direta. δέ tem aqui leve força adversativa no contexto da advertência anterior, bem expressa por “Mas”.
- source_word: πᾶν ῥῆμα
  choice: toda palavra
  rationale: πᾶν no singular tem sentido distributivo, e ῥῆμα designa aqui algo falado. “Toda palavra” é natural e mantém o alcance individual da afirmação.
- source_word: ἀργὸν
  choice: irresponsável
  rationale: O adjetivo pode significar ocioso, inativo ou improdutivo. Neste contexto judicial e ético, “irresponsável” comunica uma fala proferida sem o devido cuidado e evita que “ociosa” seja entendida apenas como conversa trivial.
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: que as pessoas disserem
  rationale: οἱ ἄνθρωποι refere-se genericamente aos seres humanos, portanto “as pessoas” é inclusivo e exato. O futuro λαλήσουσιν numa oração relativa de referência eventual é naturalmente expresso em português pelo futuro do subjuntivo “disserem”.
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: prestarão contas
  rationale: A combinação ἀποδίδωμι + λόγον é uma expressão idiomática de responsabilização. “Prestar contas” é seu equivalente corrente em português; a construção inicial “de toda palavra” explicita aquilo sobre o que se dará a prestação de contas.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: no dia do juízo
  rationale: A expressão temporal é naturalmente traduzida por “no dia”. κρίσις tem sentido judicial; “dia do juízo” é claro, digno e consagrado no uso bíblico.
theological_decisions:
- issue: Força moral de ἀργόν
  choice: “palavra irresponsável”, indicando fala sem o devido cuidado pela qual a pessoa responde diante do juízo
  alternative: “palavra ociosa”, que preserva mais diretamente a imagem lexical de inatividade ou improdutividade
  rationale: O contexto associa a fala à responsabilidade judicial, mas não limita a expressão a palavras abertamente maliciosas. “Irresponsável” preserva essa seriedade sem definir além do texto o tipo exato de fala.
- issue: Alcance genérico de οἱ ἄνθρωποι
  choice: “as pessoas”
  alternative: “os seres humanos” ou o tradicional “os homens”
  rationale: O referente é a humanidade em geral, não apenas pessoas do sexo masculino.
- issue: Relação entre cada palavra e a prestação de contas
  choice: A formulação “de toda palavra... prestarão contas” conserva a responsabilidade por cada ocorrência de fala
  alternative: Repetir explicitamente “prestarão contas por ela”
  rationale: O pronome αὐτοῦ retoma ῥῆμα. Em português, a retomada já fica clara por “de toda palavra”, e repetir “por ela” produziria uma construção pesada sem alterar o sentido.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Lhes digo”, “prestarão contas” e “dia do juízo” mantêm solenidade sem arcaísmo excessivo. A ordem da frase conserva em destaque “toda palavra”, como no grego.
