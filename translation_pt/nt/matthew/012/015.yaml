source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: pt
  text: Mas Jesus, sabendo disso[a], retirou-se dali. E muitos o seguiram, e ele curou todos eles,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus, sabendo, retirou-se dali”. O grego deixa implícito o objeto de “sabendo”; o contexto o fornece a partir do versículo anterior.'
    reason: alternativa lexical
lexical_decisions:
- source_word: γνοὺς
  choice: sabendo disso
  rationale: O particípio aoristo indica que Jesus tomou conhecimento da situação antes de se retirar. “Disso” retoma naturalmente, sem explicitar em excesso, a decisão hostil mencionada no versículo anterior.
- source_word: ἀνεχώρησεν
  choice: retirou-se
  rationale: Em Mateus, o verbo frequentemente descreve um afastamento deliberado diante de perigo ou oposição; “retirou-se” preserva essa nuance sem sugerir covardia.
- source_word: ἐκεῖθεν
  choice: dali
  rationale: Equivalente conciso e natural para o movimento para longe daquele lugar.
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: Muitos o seguiram
  rationale: Mantém o sentido simples de πολλοί, sem transformá-lo indevidamente em “multidões”.
- source_word: ἐθεράπευσεν
  choice: curou
  rationale: É o equivalente corrente e claro de θεραπεύω nos relatos de cura dos Evangelhos.
- source_word: αὐτοὺς πάντας
  choice: todos eles
  rationale: Preserva de modo natural a abrangência expressa por πάντας e deixa claro que se refere aos muitos que o seguiram.
theological_decisions:
- issue: Objeto implícito de γνοὺς
  choice: sabendo disso
  alternative: “sabendo” ou “ao tomar conhecimento disso”
  rationale: O grego não expressa o objeto do verbo; “disso” o retoma do contexto anterior sem definir além do texto exatamente como Jesus obteve esse conhecimento.
- issue: Nuance da saída de Jesus
  choice: retirou-se
  alternative: “partiu” ou “foi embora”
  rationale: A opção conserva a ideia narrativa de afastamento deliberado em resposta à oposição, sem atribuir medo nem acrescentar uma motivação teológica não expressa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem foi levemente ajustada para a fluência, sem ampliar “muitos” para “multidões”. A vírgula final foi mantida porque o versículo continua sintaticamente no contexto seguinte.
