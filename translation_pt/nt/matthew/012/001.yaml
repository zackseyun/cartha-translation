id: MAT.12.1
reference: Matthew 12:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: pt
  text: Naquele tempo, Jesus foi pelos campos de cereal num sábado[a]. Seus discípulos ficaram com fome e começaram a colher espigas e a comer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “nos sábados”; nesse uso idiomático, o plural significa “num sábado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Naquele tempo
  rationale: Mantém o marcador temporal narrativo e expressa καιρός como ocasião ou período, sem sugerir hora exata.
- source_word: ἐπορεύθη
  choice: passou
  rationale: No contexto de movimento através das plantações, “passou” é natural em português e comunica adequadamente o percurso de Jesus.
- source_word: τοῖς σάββασιν
  choice: num sábado
  rationale: O plural grego é idiomático e pode designar um único dia de sábado; “num sábado” é claro e natural no relato.
- source_word: διὰ τῶν σπορίμων
  choice: pelas plantações de cereal
  rationale: σπόριμα refere-se a campos semeados, especialmente de cereais. A expressão é compreensível internacionalmente e evita especificar um cereal não nomeado.
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: Seus discípulos
  rationale: δέ tem aqui função narrativa levemente conectiva; a nova oração em português dispensa uma conjunção explícita.
- source_word: ἐπείνασαν
  choice: ficaram com fome
  rationale: Reproduz naturalmente o valor ingressivo do aoristo, indicando o surgimento da fome.
- source_word: ἤρξαντο
  choice: começaram
  rationale: Expressa diretamente o início das ações indicadas pelos infinitivos seguintes.
- source_word: τίλλειν
  choice: a colher
  rationale: No contexto, significa retirar manualmente as espigas. “Colher” é corrente e claro, embora menos específico que “arrancar”.
- source_word: στάχυας
  choice: espigas
  rationale: Equivalente português usual e preciso para στάχυας, as cabeças onde ficam os grãos.
- source_word: καὶ ἐσθίειν
  choice: e a comer
  rationale: Mantém a coordenação dos dois infinitivos dependentes de “começaram” e soa natural em português.
theological_decisions:
- issue: Interpretação do plural σάββασιν
  choice: num sábado
  alternative: nos sábados
  rationale: Nesse uso grego, o plural pode funcionar idiomaticamente para o dia de sábado. O singular indefinido enquadra o episódio em um sábado específico sem sugerir uma prática repetida.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural tanto no Brasil quanto em âmbito internacional. “Plantações de cereal” preserva a generalidade do grego; “espigas” é vocabulário comum e preciso.
