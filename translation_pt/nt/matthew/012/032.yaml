id: MAT.12.32
reference: Matthew 12:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: pt
  text: E quem disser uma palavra[a] contra o Filho do Homem, isso lhe será perdoado; mas quem falar contra o Espírito Santo não será perdoado, nem nesta era[b] nem na que há de vir.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser traduzida como “falar uma palavra” ou, de modo mais idiomático, “falar”.
    reason: lexical_alternative
  - marker: b
    text: O grego αἰών significa “era” neste contexto; traduções tradicionais também empregam “mundo”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou, de forma mais explícita: “nem na era que há de vir”. No grego, “era” fica subentendido na segunda expressão.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: quem ... mas quem
  rationale: As construções relativas com ἐάν/ἄν expressam uma condição geral e indefinida. Em português, “quem” comunica naturalmente essa abrangência.
- source_word: εἴπῃ λόγον
  choice: disser uma palavra
  rationale: Preserva a presença explícita de λόγον (“palavra”) e mantém o caráter solene da advertência sem tornar a frase artificial.
- source_word: κατὰ
  choice: contra
  rationale: Com o genitivo, no contexto, indica fala hostil dirigida contra alguém; “contra” é direto e idiomático.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a forma consagrada e exata desse título, bem como suas ressonâncias messiânicas e apocalípticas.
- source_word: ἀφεθήσεται αὐτῷ
  choice: será perdoado
  rationale: O passivo futuro refere-se ao perdão concedido à pessoa pelo ato cometido. Esta forma é natural em português e preserva a voz passiva, embora não reproduza literalmente o pronome dativo.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: o Espírito Santo
  rationale: É a designação padrão, atual e reverente em português.
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι
  choice: nem nesta era
  rationale: αἰών tem sentido temporal aqui, em contraste com a era vindoura; “era” evita o sentido espacial que “mundo” poderia sugerir.
- source_word: οὔτε ἐν τῷ μέλλοντι
  choice: nem na que há de vir
  rationale: 'Reproduz de modo natural a elipse grega: o substantivo “era”, expresso na oração anterior, permanece subentendido.'
theological_decisions:
- issue: Contraste temporal entre αἰών e μέλλων
  choice: nem nesta era, nem na que há de vir
  alternative: nem neste mundo, nem no mundo futuro; nem nesta era, nem na era futura
  rationale: O contraste é temporal e escatológico, não espacial. A tradução conserva a elipse do grego sem impor um sistema escatológico específico.
- issue: Natureza da ofensa que não será perdoada
  choice: Preservar a advertência sobre falar contra o Espírito Santo sem acrescentar uma definição doutrinária posterior
  alternative: Definir a ofensa como uma acusação histórica específica contra os exorcismos de Jesus ou como impenitência final
  rationale: Este versículo declara a consequência da ofensa, mas não a define com a precisão dessas interpretações teológicas posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém o paralelismo e a solenidade da advertência, usa “Filho do Homem” e “Espírito Santo” como títulos estabelecidos e conserva a elipse temporal do original.
