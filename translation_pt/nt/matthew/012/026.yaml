id: MAT.12.26
reference: Matthew 12:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: pt
  text: E, se Satanás expulsa Satanás, está dividido contra si mesmo.[a] Como, então, o seu reino permanecerá de pé?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi dividido contra si mesmo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Como, então, poderá o seu reino permanecer de pé?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἰ
  choice: E, se
  rationale: Preserva tanto a ligação argumentativa de καί com o contexto anterior quanto a condição introduzida por εἰ, em português natural.
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: Satanás
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para o nome ou título pessoal Σατανᾶς.
- source_word: ἐκβάλλει
  choice: expulsa
  rationale: Expressa com clareza a ideia de fazer sair ou remover à força e é natural no contexto de exorcismo, sem recorrer a formulação excessivamente técnica.
- source_word: ἐφ’ ἑαυτὸν
  choice: contra si mesmo
  rationale: Reproduz naturalmente a oposição interna indicada por ἐπί com o pronome reflexivo.
- source_word: ἐμερίσθη
  choice: está dividido
  rationale: O aoristo passivo descreve, no argumento hipotético, o estado resultante da divisão. A formulação portuguesa comunica esse resultado presente sem apagar a forma passiva.
- source_word: πῶς οὖν
  choice: Como, então
  rationale: Conserva tanto a pergunta de πῶς quanto a inferência marcada por οὖν.
- source_word: σταθήσεται
  choice: permanecerá de pé
  rationale: Mantém a metáfora de 'estar de pé' e comunica idiomaticamente a ideia de continuar firme ou subsistir.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: o seu reino
  rationale: Reino se ajusta à imagem de um domínio dividido e preserva a formulação tradicional sem excluir a noção de governo.
theological_decisions:
- issue: Referente e efeito da divisão de Satanás contra si mesmo
  choice: 'O versículo é traduzido como um argumento por redução ao absurdo: se Satanás expulsa Satanás, fica dividido contra si mesmo, e seu reino não poderá permanecer.'
  alternative: Explicitar por paráfrase a imagem mais ampla de uma casa dividida.
  rationale: O grego afirma diretamente a lógica da divisão interna e da consequente instabilidade do reino de Satanás. A tradução preserva essa tensão sem acrescentar imagens que não aparecem neste versículo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Expulsa” é claro no contexto; “permanecerá de pé” conserva a metáfora grega. Os marcadores aparecem imediatamente após as expressões às quais se referem.
