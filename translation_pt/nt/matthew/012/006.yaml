  text: λέγω δὲ ὑμῖν ὅτι τοῦ ἱεροῦ μεῖζόν ἐστιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/006.yaml
  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: pt
  text: Mas eu lhes digo que algo maior do que o templo está aqui[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alguém maior do que o templo está aqui” ou “um maior do que o templo está aqui”. O grego emprega uma forma neutra (“maior”), deixando o referente formalmente sem especificação.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “neste lugar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Mas eu lhes digo
  rationale: A fórmula de discurso direto é mantida com naturalidade. δέ introduz aqui um contraste leve com o argumento anterior, bem expresso por “Mas”.
- source_word: ὅτι
  choice: que
  rationale: Introduz explicitamente o conteúdo da declaração de Jesus e preserva a clareza sintática.
- source_word: τοῦ ἱεροῦ
  choice: do que o templo
  rationale: ἱερόν normalmente designa o complexo do templo, e “templo” é a forma corrente e adequada em português.
- source_word: μεῖζόν
  choice: algo maior
  rationale: O comparativo neutro singular é substantivado e não declara formalmente o referente. “Algo maior” preserva o gênero neutro e evita identificar de maneira mais específica aquilo que o grego deixa implícito.
- source_word: ἐστιν
  choice: está
  rationale: Com ὧδε, o português idiomático usa “está aqui” para expressar presença localizada, embora o grego empregue a cópula simples.
- source_word: ὧδε
  choice: aqui
  rationale: Tradução concisa e natural do advérbio locativo; “neste lugar” permanece como alternativa legítima em nota.
theological_decisions:
- issue: Identidade do referente não expresso no comparativo neutro μεῖζόν
  choice: algo maior do que o templo
  alternative: alguém maior do que o templo; um maior do que o templo
  rationale: Embora o contexto aponte fortemente para Jesus e sua autoridade messiânica, a forma grega é neutra, não masculina. A redação principal preserva essa indeterminação formal e evita resolver silenciosamente a tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eu lhes digo” mantém o tom solene sem arcaísmo; “algo maior” conserva a ambiguidade gramatical relevante do original.
