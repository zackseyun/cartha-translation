base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/047.yaml
  text: Then someone said to him[a], “Look, your mother and your brothers are standing outside, seeking to speak to you.”
translation:
  language: pt
  text: 'Então alguém lhe disse[a]: “Olhe! Sua mãe e seus irmãos estão de pé lá fora, procurando falar com você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos omitem este versículo.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: Então alguém lhe disse
  rationale: δέ faz uma conexão narrativa leve, expressa naturalmente por “Então”; τις é indefinido e corresponde a “alguém”.
- source_word: Ἰδοὺ
  choice: Olhe!
  rationale: Preserva a função de chamar a atenção de modo atual e compreensível, sem o tom arcaico de “Eis”.
- source_word: ἡ μήτηρ σου
  choice: sua mãe
  rationale: Tradução direta e natural da construção possessiva.
- source_word: οἱ ἀδελφοί σου
  choice: seus irmãos
  rationale: Mantém a referência masculina explícita do grego sem ampliar o sentido para um grupo misto.
- source_word: ἔξω ἑστήκασιν
  choice: estão lá fora
  rationale: O perfeito de ἵστημι descreve o estado presente resultante de terem se colocado ali. Em português, “estão lá fora” comunica esse estado com mais naturalidade do que “estão de pé lá fora”, sem exigir que a postura física seja enfatizada.
- source_word: ζητοῦντές
  choice: querendo
  rationale: Neste contexto, ζητέω seguido de infinitivo expressa a intenção ou o desejo de realizar a ação. “Querendo” é natural em português e evita o sentido potencialmente estranho de “procurando falar”.
- source_word: σοι λαλῆσαι
  choice: falar com você
  rationale: Expressa naturalmente o infinitivo λαλῆσαι com o dativo σοι; “com você” é idiomático e mantém a interlocução pretendida.
theological_decisions:
- issue: Situação textual de Mateus 12:47
  choice: Incluir o versículo no texto principal, conforme o texto SBLGNT fornecido, com nota sobre sua omissão em parte da tradição manuscrita.
  alternative: Omitir o versículo, seguindo os manuscritos que não o contêm.
  rationale: O SBLGNT apresenta o versículo delimitado como passagem textualmente incerta. Sua inclusão acompanhada de nota preserva tanto o texto-fonte solicitado quanto a transparência sobre a variante, sem resolver silenciosamente a questão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Olhe!” funciona como chamado direto de atenção; “estão lá fora” evita uma ênfase postural pouco natural; e “falar com você” é corrente sem ser coloquial em excesso.
