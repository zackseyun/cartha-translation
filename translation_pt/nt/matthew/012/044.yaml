  source_fidelity: A tradução preserva adequadamente a sequência e o presente histórico de τότε λέγει e εὑρίσκει. “Voltarei para a minha casa, de onde saí” representa com fidelidade a fala direta, incluindo a posse em μου e a imagem de saída em ὅθεν ἐξῆλθον. “Ao chegar, encontra-a” reproduz de modo idiomático a anterioridade do particípio ἐλθόν sem explicitar além do texto.
  naturalness: O português é moderno, claro e amplamente compreensível. “Encontra-a desocupada, varrida e arrumada” é uma construção natural; a concordância feminina retoma inequivocamente “casa”. O presente histórico e o registro narrativo foram bem mantidos.
