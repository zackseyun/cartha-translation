  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: pt
  text: 'Então ele diz: “Voltarei para a minha casa, de onde saí”. E, ao chegar, encontra-a desocupada[a], varrida e arrumada[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vazia”.
    reason: lexical_alternative
  - marker: b
    text: Ou “decorada” ou “adornada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Introduz de modo conciso e natural a ação seguinte na sequência narrativa.
- source_word: λέγει
  choice: ele diz
  rationale: Mantém o presente histórico vívido. O sujeito implícito é o espírito impuro mencionado no contexto anterior; em português, “espírito” é gramaticalmente masculino.
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: Voltarei para a minha casa
  rationale: Preserva tanto a ideia de retorno quanto a reivindicação possessiva do espírito, sem explicar a metáfora.
- source_word: ὅθεν ἐξῆλθον
  choice: de onde saí
  rationale: Expressão portuguesa natural que conserva a imagem concreta de ter saído da casa.
- source_word: ἐλθὸν
  choice: ao chegar
  rationale: Converte o particípio aoristo em uma oração temporal idiomática, mantendo a sequência anterior ao verbo principal.
- source_word: εὑρίσκει
  choice: encontra-a
  rationale: Mantém o presente histórico; o pronome retoma claramente “a casa” e permite expressar os três predicativos no feminino.
- source_word: σχολάζοντα
  choice: desocupada
  rationale: Comunica que a casa está vazia ou disponível, preservando a possível nuance de ausência de ocupante sem reduzi-la apenas à condição física de vazio.
- source_word: σεσαρωμένον
  choice: varrida
  rationale: Reproduz com concisão o estado resultante indicado pelo particípio perfeito passivo.
- source_word: κεκοσμημένον
  choice: arrumada
  rationale: Expressa naturalmente a ideia contextual de uma casa posta em ordem, sem excluir a possibilidade lexical de decoração ou adorno, registrada em nota.
theological_decisions:
- issue: Força metafórica de “casa” na fala do espírito impuro
  choice: Manter “casa” literalmente, sem explicá-la como “pessoa” ou “vida”.
  alternative: “Voltarei para a pessoa da qual saí.”
  rationale: O texto preserva deliberadamente a imagem da casa. Explicitá-la no versículo resolveria interpretativamente uma metáfora que o próprio dito deixa em forma figurada.
- issue: Condição da casa expressa por σχολάζοντα
  choice: Traduzir por “desocupada”, mantendo a ideia de ausência de ocupante.
  alternative: “vazia”
  rationale: “Desocupada” preserva a tensão narrativa de uma casa disponível para o retorno do espírito, sem acrescentar quem deveria ocupá-la; “vazia” continua sendo uma alternativa lexical legítima.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O presente histórico foi preservado. A colocação pronominal em “encontra-a” é formal sem ser arcaica, e a pontuação distingue com clareza a fala citada da continuação narrativa.
