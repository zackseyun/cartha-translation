  text: ⸀ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[a], saying:'
translation:
  language: pt
  text: 'para que se cumprisse o que foi dito por meio do profeta Isaías, que disse:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz uma oração de finalidade ou resultado; «para que» é natural em português e preserva essa abertura sem decidir rigidamente entre propósito e resultado.
- source_word: πληρωθῇ
  choice: se cumprisse
  rationale: O aoristo passivo do subjuntivo após ἵνα é expresso de modo idiomático por «se cumprisse», preservando a fórmula de cumprimento característica de Mateus.
- source_word: τὸ ῥηθὲν
  choice: o que foi dito
  rationale: O particípio substantivado é vertido de forma natural, mantendo o sentido passivo.
- source_word: διὰ
  choice: por meio de
  rationale: Com o genitivo, διά indica aqui agência intermediária; «por meio de» apresenta Isaías como mediador da declaração sem identificá-lo como sua fonte última.
- source_word: Ἠσαΐου
  choice: Isaías
  rationale: Forma tradicional e amplamente reconhecida do nome do profeta em português.
- source_word: τοῦ προφήτου
  choice: do profeta
  rationale: Mantém a identificação apositiva presente no grego, integrada à ordem natural do português.
- source_word: λέγοντος
  choice: ':'
  rationale: O particípio introduz a citação seguinte. Em português atual, os dois-pontos cumprem essa função com mais naturalidade do que a reprodução explícita «dizendo», sem perda de conteúdo proposicional.
theological_decisions:
- issue: Agência profética na fórmula de citação
  choice: por meio do profeta Isaías
  alternative: pelo profeta Isaías
  rationale: «Por meio de» preserva de maneira explícita a agência intermediária indicada por διά com genitivo e deixa aberta a compreensão de Deus como fonte última da mensagem.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A fórmula «para que se cumprisse» conserva o estilo mateano; os dois-pontos introduzem de modo idiomático a citação do versículo seguinte.
