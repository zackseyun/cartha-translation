base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: pt
  text: 'Então ele diz ao homem: “Estenda a mão.” Ele a estendeu, e ela foi restaurada[a], tão saudável quanto a outra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi curada”; o verbo grego enfatiza a restauração a uma condição adequada.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e direto em português.
- source_word: λέγει
  choice: ele diz
  rationale: Mantém o presente histórico grego e a vivacidade característica da narrativa.
- source_word: τῷ ἀνθρώπῳ
  choice: ao homem
  rationale: No contexto, ἄνθρωπος designa um indivíduo masculino específico.
- source_word: Ἔκτεινόν σου τὴν χεῖρα
  choice: Estenda a mão
  rationale: É uma ordem direta e idiomática em português; o possessivo é desnecessário porque o referente é evidente.
- source_word: ἐξέτεινεν
  choice: Ele a estendeu
  rationale: Retoma naturalmente a ordem anterior e preserva a repetição verbal entre ordem e resposta.
- source_word: ἀπεκατεστάθη
  choice: foi restabelecida
  rationale: Expressa a restauração da mão à condição adequada, nuance mais específica do que a ideia geral de cura.
- source_word: ὑγιὴς ὡς ἡ ἄλλη
  choice: ficando saudável como a outra
  rationale: Comunica o resultado da restauração e mantém a comparação implícita com a outra mão.
theological_decisions:
- issue: Natureza da cura descrita
  choice: A mão foi restabelecida e ficou saudável como a outra.
  alternative: A mão foi curada.
  rationale: A formulação conserva a ênfase lexical na restauração de uma condição adequada, sem acrescentar interpretação doutrinária à descrição do milagre.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O presente histórico foi preservado. A expressão “a outra” retoma naturalmente a outra mão do homem.
