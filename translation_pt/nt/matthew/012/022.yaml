  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: pt
  text: Então foi-lhe trazido um homem dominado por um demônio, cego e mudo[a]; e ele o curou, de modo que o homem mudo falou e enxergou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “surdo”. A palavra grega pode indicar alguém surdo ou incapaz de falar; aqui o contexto favorece “mudo”, pois o resultado mencionado é que ele falou e enxergou.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca naturalmente, em português, a progressão temporal da narrativa.
- source_word: προσηνέχθη αὐτῷ
  choice: lhe trouxeram
  rationale: O passivo grego tem agente não especificado; o plural impessoal em português é natural e mantém os responsáveis indefinidos.
- source_word: δαιμονιζόμενος
  choice: dominado por um demônio
  rationale: Preserva explicitamente a agência demoníaca sem recorrer ao pouco natural 'demonizado' nem sugerir uma categoria clínica moderna.
- source_word: τυφλὸς
  choice: cego
  rationale: Equivalente lexical direto e natural.
- source_word: κωφός
  choice: mudo
  rationale: Embora possa significar 'surdo' ou 'mudo', a oração de resultado menciona que o homem passou a falar, favorecendo aqui a incapacidade de falar.
- source_word: ἐθεράπευσεν αὐτόν
  choice: ele o curou
  rationale: Forma clara e tradicional para a cura realizada por Jesus no contexto narrativo.
- source_word: ὥστε
  choice: de modo que
  rationale: Expressa claramente o resultado da cura.
- source_word: τὸν κωφὸν λαλεῖν καὶ βλέπειν
  choice: o homem mudo falava e enxergava
  rationale: Reproduz os dois resultados explícitos, com formulação natural em português e sem acrescentar nuance incoativa.
theological_decisions:
- issue: Natureza da aflição demoníaca
  choice: 'Manter referência explícita a um demônio: ''dominado por um demônio'''
  alternative: Possesso por um demônio; endemoninhado; atormentado
  rationale: O texto grego atribui explicitamente a condição à atuação demoníaca; a tradução não a reduz a uma doença nem impõe uma descrição técnica do grau dessa atuação.
- issue: Sentido de κωφός no contexto
  choice: Traduzir como 'mudo'
  alternative: Surdo; incapaz de falar
  rationale: O termo grego admite mais de um sentido, mas o resultado declarado é que o homem falava e enxergava. A nota preserva a alternativa lexical genuína.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Dominado por um demônio' evita tanto o tecnicismo 'demonizado' quanto possíveis inferências excessivas associadas a formulações mais rígidas; 'mudo' mantém concisão, enquanto a nota registra a ambiguidade lexical.
