  source_fidelity: A referência à aflição demoníaca, à cegueira e à incapacidade de falar é fiel ao grego, e a nota registra adequadamente a alternativa lexical de κωφός. Contudo, προσηνέχθη é passivo, enquanto “lhe trouxeram” introduz um sujeito humano indefinido. Além disso, o imperfeito “falava e enxergava” não representa bem o resultado pontual expresso pela oração com ὥστε.
