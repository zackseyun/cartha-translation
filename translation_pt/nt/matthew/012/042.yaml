id: MAT.12.42
reference: Matthew 12:42
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: pt
  text: A rainha do Sul[a] se levantará no juízo com esta geração e a condenará, porque veio dos confins da terra para ouvir a sabedoria de Salomão. E eis que algo maior do que Salomão está aqui.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A «rainha do Sul» alude à rainha de Sabá (1 Reis 10.1–13; 2 Crônicas 9.1–12), embora o texto grego não mencione Sabá pelo nome.
    reason: cross_reference
  - marker: b
    text: 'Ou: «alguém maior do que Salomão está aqui». O grego emprega uma forma neutra («algo maior»), que pode enfatizar a realidade superior presente em Jesus e em sua atuação.'
    reason: alternative_reading
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: a rainha do Sul
  rationale: Preserva a construção «rainha do Sul» sem explicitar no texto principal que se trata da rainha de Sabá, identificação derivada do contexto do Antigo Testamento.
- source_word: ἐγερθήσεται
  choice: se levantará
  rationale: Expressa de modo natural tanto a ideia de levantar-se quanto a possível nuance de ser levantada no contexto do juízo, sem especificar além do grego.
- source_word: ἐν τῇ κρίσει
  choice: no juízo
  rationale: Mantém a referência definida ao juízo escatológico e soa natural em português.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: com esta geração
  rationale: Traduz o sentido normal de μετά com o genitivo, «com»; a oposição é comunicada pelo verbo seguinte, «condenará».
- source_word: κατακρινεῖ αὐτήν
  choice: a condenará
  rationale: O pronome feminino retoma «geração», também feminino em português, permitindo uma tradução concisa e formalmente transparente.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: dos confins da terra
  rationale: Reproduz a expressão idiomática de distância extrema em linguagem digna e amplamente compreensível.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: para ouvir a sabedoria de Salomão
  rationale: O infinitivo expressa finalidade; a formulação preserva diretamente a construção e a ênfase do grego.
- source_word: ἰδοὺ
  choice: e eis que
  rationale: «Eis que» conserva a força enfática do marcador discursivo em registro bíblico ainda compreensível no português moderno.
- source_word: πλεῖον Σολομῶνος
  choice: algo maior do que Salomão
  rationale: O comparativo grego está no neutro; «algo maior» preserva essa forma e evita convertê-la silenciosamente em uma referência masculina pessoal.
- source_word: ὧδε
  choice: está aqui
  rationale: Tradução direta e idiomática do advérbio, com o verbo necessário em português.
theological_decisions:
- issue: Como traduzir o comparativo neutro πλεῖον em relação a Jesus
  choice: algo maior do que Salomão
  alternative: alguém maior do que Salomão
  rationale: «Algo maior» preserva o neutro grego e a amplitude da afirmação, que pode abranger a pessoa e a atuação de Jesus. «Alguém maior» explicita o referente pessoal, mas resolve uma tensão que o texto grego mantém.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. «Eis que» foi mantido por sua força enfática; «confins da terra» conserva uma expressão bíblica corrente sem soar excessivamente arcaica. Os marcadores de nota foram posicionados junto aos elementos que efetivamente explicam.
