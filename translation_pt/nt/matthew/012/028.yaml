source:
  edition: SBLGNT
  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: pt
  text: Mas, se eu expulso os demônios pelo Espírito de Deus[a], então o Reino de Deus chegou até vocês[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no Espírito de Deus”. A expressão grega pode indicar esfera, meio ou agência; no texto, foi entendida como meio ou agência.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “veio sobre vocês” ou “alcançou vocês”. O verbo grego enfatiza que o Reino de Deus chegou até vocês nas obras de Jesus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mas, se
  rationale: Preserva a condição e o leve contraste introduzido por δέ, com formulação natural em português.
- source_word: ἐν πνεύματι θεοῦ
  choice: pelo Espírito de Deus
  rationale: Entende ἐν com o dativo como meio ou agência neste contexto; a nota mantém a alternativa mais formal “no Espírito de Deus”.
- source_word: ἐγὼ
  choice: eu
  rationale: Mantém o pronome explícito e sua ênfase argumentativa no grego.
- source_word: ἐκβάλλω
  choice: expulso
  rationale: Equivalente atual, claro e vigoroso para a ação de fazer os demônios saírem.
- source_word: τὰ δαιμόνια
  choice: os demônios
  rationale: Traduz diretamente o substantivo e conserva o artigo definido.
- source_word: ἄρα
  choice: então
  rationale: Expressa de modo conciso a conclusão lógica decorrente da condição.
- source_word: ἔφθασεν
  choice: chegou
  rationale: Comunica o sentido de alcançar ou chegar, sem reduzir a afirmação a mera proximidade.
- source_word: ἐφ’ ὑμᾶς
  choice: até vocês
  rationale: Expressa naturalmente em português que o Reino alcançou os ouvintes; a nota registra alternativas que preservam outras nuances possíveis.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: Equivalente consagrado e amplo, capaz de incluir tanto o governo régio de Deus como a esfera de seu domínio.
theological_decisions:
- issue: A chegada do Reino de Deus em relação aos exorcismos de Jesus
  choice: A expulsão dos demônios pelo Espírito evidencia que o Reino de Deus já alcançou os ouvintes de maneira real e presente.
  alternative: O Reino apenas se aproximou, sem ainda ter chegado, ou a frase se refere exclusivamente à consumação futura.
  rationale: O aoristo ἔφθασεν indica chegada ou alcance, e a argumentação trata as obras presentes de Jesus como evidência dessa realidade, sem negar qualquer dimensão futura.
- issue: Referência de “Espírito de Deus”
  choice: Referência ao Espírito de Deus como agente da expulsão dos demônios.
  alternative: Referência apenas a um poder divino impessoal.
  rationale: A expressão πνεύματι θεοῦ, no contexto, identifica o Espírito como a agência divina pela qual Jesus age; a tradução não acrescenta uma explicação dogmática ao versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” comunica naturalmente o plural de ὑμᾶς. A ordem dos marcadores segue as expressões a que cada nota se refere.
