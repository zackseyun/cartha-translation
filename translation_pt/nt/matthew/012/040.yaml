id: MAT.12.40
reference: Matthew 12:40
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: pt
  text: Pois, assim como Jonas esteve no ventre da criatura marinha durante três dias e três noites[a][b], assim o Filho do Homem estará no coração da terra durante três dias e três noites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «grande peixe». A palavra grega designa uma grande criatura marinha e é mais ampla que um termo zoológico específico.
    reason: lexical_alternative
  - marker: b
    text: «Três dias e três noites» pode ser entendido como uma expressão idiomática que inclui partes de três dias; outros a entendem de maneira mais estrita. «No coração da terra» pode referir-se ao sepultamento, à sepultura, às profundezas ou ao domínio dos mortos; a expressão metafórica grega foi mantida no texto.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Pois, assim como
  rationale: Preserva tanto a força explicativa de γάρ como a comparação enfática de ὥσπερ, em português natural.
- source_word: Ἰωνᾶς
  choice: Jonas
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἐν τῇ κοιλίᾳ
  choice: no ventre
  rationale: Traduz naturalmente κοιλία e mantém o tom digno da alusão narrativa.
- source_word: τοῦ κήτους
  choice: da criatura marinha
  rationale: κῆτος designa um grande ser do mar sem exigir uma classificação zoológica específica; a alternativa tradicional é indicada em nota.
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: durante três dias e três noites
  rationale: Mantém integralmente a expressão temporal; 'durante' torna natural em português a construção com 'esteve/estará' sem resolver sua extensão cronológica.
- source_word: οὕτως
  choice: assim
  rationale: Marca de modo conciso e natural a correspondência entre os dois lados da comparação.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Preserva o título bíblico tradicional e sua ressonância teológica.
- source_word: ἔσται
  choice: estará
  rationale: É o futuro direto de εἰμί neste contexto; evita acrescentar a ideia não explícita de permanência.
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: no coração da terra
  rationale: Conserva a metáfora de καρδία e não escolhe silenciosamente entre sepultura, profundezas ou domínio dos mortos.
theological_decisions:
- issue: Sentido de «coração da terra»
  choice: Manter a expressão metafórica «no coração da terra».
  alternative: na sepultura; nas profundezas da terra; no domínio dos mortos
  rationale: O grego não determina inequivocamente uma única expansão interpretativa; a tradução preserva a ambiguidade teológica.
- issue: Força de «três dias e três noites»
  choice: Manter literalmente a expressão temporal.
  alternative: Expressão idiomática que inclui partes de três dias; período estrito de setenta e duas horas
  rationale: O texto declara a fórmula sem explicar como deve ser computada; a tradução não resolve a controvérsia cronológica.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com leitura natural no Brasil. A construção paralela «assim como... assim...» reproduz a comparação grega. As notas foram reunidas em dois marcadores, ambos presentes no texto principal.
