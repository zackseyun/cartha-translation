  text: and in his name the nations will hope[a].
translation:
  language: pt
  text: E as nações esperarão em seu nome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os gentios esperarão em seu nome”.'
    reason: Mantém a alternativa contextual legítima para ἔθνη, sem restringir o sentido principal de “nações”.
lexical_decisions:
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa comum, mantida para preservar a ligação com a citação precedente.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: em seu nome
  rationale: O dativo com ἐλπίζω admite naturalmente esta formulação em português. “Nome” conserva as ideias de identidade, autoridade e pessoa representada sem explicitar apenas uma delas.
- source_word: ἔθνη
  choice: as nações
  rationale: O termo pode designar “nações” ou “gentios”. No contexto da citação de Isaías, “as nações” preserva melhor o horizonte amplo dos povos além de Israel, sem eliminar a possível referência aos gentios.
- source_word: ἐλπιοῦσιν
  choice: esperarão
  rationale: Reproduz diretamente o futuro ativo de ἐλπίζω e mantém o sentido de depositar esperança, bem como o tom futuro da promessa.
theological_decisions:
- issue: Tradução de ἔθνη em uma citação messiânica
  choice: as nações
  alternative: os gentios
  rationale: “As nações” conserva o alcance da citação profética e inclui os povos fora de Israel; “os gentios” continua sendo uma leitura contextual legítima e por isso aparece na nota.
translation_notes:
  register: Português moderno, claro e digno, com formulação concisa. A colocação inicial de “em seu nome” acompanha a ênfase e a ordem do grego; “esperarão” preserva a força lexical e o futuro da promessa.
