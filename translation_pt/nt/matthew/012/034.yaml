id: MAT.12.34
reference: Matthew 12:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: pt
  text: Ninhada de víboras[a], como vocês podem falar coisas boas, sendo maus? Pois a boca fala daquilo que transborda do coração.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Filhos de víboras”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Pois é da abundância do coração que a boca fala”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: Ninhada de víboras
  rationale: A expressão preserva a metáfora contundente de origem e caráter e funciona de modo natural como interpelação em português. “Filhos de víboras” também é possível e fica registrado em nota.
- source_word: πῶς δύνασθε
  choice: como vocês podem
  rationale: Reproduz de maneira idiomática a pergunta retórica, que aponta para incapacidade ou incoerência moral.
- source_word: ἀγαθὰ λαλεῖν
  choice: falar coisas boas
  rationale: Mantém o plural substantivado ἀγαθά e o sentido direto de λαλεῖν em linguagem corrente.
- source_word: πονηροὶ ὄντες
  choice: sendo maus
  rationale: Conserva a construção participial e seu valor circunstancial sem decidir explicitamente entre causa e condição; “maus” mantém o peso moral do termo.
- source_word: ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας
  choice: Pois ... daquilo que transborda do coração
  rationale: Expressa com naturalidade a imagem de algo que, por encher o interior, extravasa na fala. A alternativa nominal “da abundância do coração” é preservada em nota.
- source_word: τῆς καρδίας
  choice: do coração
  rationale: Mantém o termo bíblico para o centro interior da pessoa — pensamentos, vontade e disposições — sem reduzi-lo apenas às emoções.
- source_word: τὸ στόμα λαλεῖ
  choice: a boca fala
  rationale: Reproduz diretamente a personificação e a ligação entre a condição interior e a fala exterior.
theological_decisions:
- issue: Força metafórica de καρδία
  choice: Manter “coração” como designação do interior da pessoa.
  alternative: Traduzir por “íntimo”, “mente” ou “interior”.
  rationale: “Coração” preserva a amplitude antropológica do termo grego e evita restringi-lo somente à emoção ou ao pensamento.
- issue: Caracterização moral em πονηροὶ ὄντες
  choice: Traduzir por “sendo maus”.
  alternative: “Sendo ruins” ou “já que vocês são perversos”.
  rationale: “Maus” conserva o juízo ético do texto sem atenuá-lo como “ruins” nem intensificá-lo ou tornar explicitamente causal o particípio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “vocês” é natural no português brasileiro e inteligível internacionalmente. A sintaxe preserva a contundência da repreensão e a imagem concreta de o conteúdo do coração transbordar na fala.
