id: MAT.12.39
reference: Matthew 12:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: pt
  text: 'Mas ele lhes respondeu: “Uma geração má e adúltera[a] busca um sinal, mas nenhum sinal lhe será dado, a não ser o sinal de Jonas, o profeta[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Adúltera” pode evocar tanto o adultério literal quanto a infidelidade à aliança, à maneira da linguagem dos profetas sobre a infidelidade espiritual.
    reason: cross_reference
  - marker: b
    text: 'Ou: “o sinal do profeta Jonas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: lhes respondeu
  rationale: A construção participial seguida de verbo finito é uma fórmula narrativa comum, com influência semítica. Em português atual, “lhes respondeu” transmite naturalmente o sentido completo sem a rigidez de “respondendo, disse-lhes”.
- source_word: Γενεὰ
  choice: geração
  rationale: Preserva o substantivo coletivo singular e designa adequadamente o grupo contemporâneo caracterizado em termos morais.
- source_word: πονηρὰ
  choice: má
  rationale: É uma tradução direta, clara e idiomática da condenação moral expressa pelo adjetivo grego.
- source_word: μοιχαλὶς
  choice: adúltera
  rationale: Mantém a força literal e metafórica do termo, inclusive sua possível evocação profética da infidelidade à aliança, sem reduzi-lo interpretativamente a “infiel”.
- source_word: σημεῖον
  choice: sinal
  rationale: Reproduz a amplitude do termo grego sem acrescentar “milagroso”, qualificação que o texto não explicita.
- source_word: ἐπιζητεῖ
  choice: busca
  rationale: Expressa de modo direto e natural a procura por um sinal; opções como “exige” tornariam explícita uma intensidade que o contexto pode sugerir, mas que não precisa ser imposta lexicalmente.
- source_word: δοθήσεται
  choice: será dado
  rationale: Corresponde naturalmente ao futuro passivo grego.
- source_word: αὐτῇ
  choice: lhe
  rationale: Retoma “geração”, substantivo singular, de maneira concisa e idiomática em português.
- source_word: εἰ μὴ
  choice: a não ser
  rationale: Na construção negativa, comunica com naturalidade a exceção indicada pelo grego.
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: o sinal de Jonas, o profeta
  rationale: A formulação acompanha de perto a ordem grega e mantém em aberto a natureza exata do sinal, que o contexto subsequente explica.
theological_decisions:
- issue: Sentido de “adúltera” na acusação de Jesus
  choice: Manter “adúltera” no texto principal.
  alternative: infiel
  rationale: O termo pode evocar tanto adultério em sentido moral quanto a imagem profética da infidelidade à aliança. A tradução preserva essa tensão em vez de escolher apenas uma interpretação.
- issue: Natureza do “sinal de Jonas”
  choice: Conservar a expressão sem explicá-la no texto principal.
  alternative: um sinal semelhante ao que aconteceu com Jonas
  rationale: O versículo introduz a expressão, cuja significação é desenvolvida no contexto imediato. Explicá-la aqui anteciparia e restringiria sua interpretação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A inversão formal “respondendo, disse-lhes” foi evitada em favor de uma fórmula narrativa natural. “Mas” foi repetido na segunda oração para tornar clara a contraposição sem alterar o sentido.
