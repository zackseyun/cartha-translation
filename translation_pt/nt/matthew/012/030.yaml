  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: pt
  text: Quem não está comigo está contra mim, e quem não ajunta comigo espalha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: quem não está
  rationale: O artigo com o particípio tem valor substantivado e genérico. “Quem não está” comunica naturalmente essa referência geral em português, sem restringi-la ao gênero masculino.
- source_word: μετ’ ἐμοῦ
  choice: comigo
  rationale: μετά com o genitivo indica associação ou companhia. “Comigo” preserva de modo direto a ideia de alinhamento relacional com Jesus.
- source_word: κατ’ ἐμοῦ
  choice: contra mim
  rationale: κατά com o genitivo expressa oposição; “contra mim” é a equivalência portuguesa clara e corrente.
- source_word: συνάγων
  choice: ajunta
  rationale: O verbo denota reunir ou juntar. “Ajunta” forma um contraste natural com “espalha” e preserva a imagem sem especificar indevidamente se se trata de rebanho, colheita ou pessoas.
- source_word: σκορπίζει
  choice: espalha
  rationale: σκορπίζω significa espalhar ou dispersar. “Espalha” é claro e mantém o paralelismo antitético com “ajunta”.
- source_word: καὶ
  choice: e
  rationale: A conjunção liga duas afirmações paralelas de forma aditiva. “E” reproduz essa coordenação sem introduzir contraste interpretativo.
theological_decisions:
- issue: Força da antítese absoluta de Jesus
  choice: 'Manter a afirmação categórica: quem não está com Jesus está contra ele.'
  alternative: Suavizar a oposição por meio de uma paráfrase que admita neutralidade.
  rationale: O grego apresenta duas cláusulas paralelas e incisivas, sem qualquer atenuante. A tradução preserva essa tensão e não acrescenta conclusões doutrinárias.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A repetição de “quem” conserva o paralelismo do original; “ajunta” e “espalha” mantêm a oposição imagética sem a explicar em excesso.
