  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: pt
  text: 'Mas ele lhes disse: “Vocês não leram o que Davi fez quando Davi e os que estavam com ele tiveram fome?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “quando Davi teve fome, e os que estavam com ele”. No grego, o verbo “teve fome” está no singular e se refere explicitamente a Davi, embora a construção também possa incluir os que estavam com ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Mas ele
  rationale: δέ é uma conexão leve que, neste contexto de resposta à acusação anterior, é expressa naturalmente por “Mas”.
- source_word: εἶπεν αὐτοῖς
  choice: lhes disse
  rationale: Reproduz de modo direto e natural o verbo λέγω com o dativo αὐτοῖς.
- source_word: Οὐκ ἀνέγνωτε
  choice: Vocês não leram
  rationale: A pergunta retórica apela ao conhecimento das Escrituras pelos interlocutores; o pretérito perfeito é idiomático e claro em português.
- source_word: τί ἐποίησεν
  choice: o que ... fez
  rationale: ποιέω tem aqui o sentido histórico simples de “fazer”, sem necessidade de expansão.
- source_word: Δαυὶδ
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: ὅτε ἐπείνασεν
  choice: quando teve fome
  rationale: Expressa de maneira corrente o sentido de πεινάω sem exagerar o aspecto verbal.
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: ele e os que estavam com ele
  rationale: Torna natural em português a coordenação elíptica grega e preserva a referência explícita aos acompanhantes de Davi.
theological_decisions:
- issue: Alcance da fome em ὅτε ἐπείνασεν καὶ οἱ μετ’ αὐτοῦ
  choice: “quando teve fome, ele e os que estavam com ele”
  alternative: “quando ele teve fome, e o que fizeram os que estavam com ele”
  rationale: O verbo singular refere-se explicitamente a Davi, mas a construção permite entender que seus acompanhantes também tiveram fome. A tradução principal comunica essa leitura natural sem ocultar a forma singular do grego, explicada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para a segunda pessoa do plural. A formulação evita tanto arcaísmo quanto paráfrase excessiva e conserva em nota a ambiguidade sintática do grego.
