  text: Ὅταν δὲ τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ οὐχ εὑρίσκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: pt
  text: Quando o espírito impuro sai de uma pessoa, passa por lugares sem água[a], procurando descanso, e não o encontra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lugares áridos”. O grego diz literalmente “lugares sem água”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Quando
  rationale: Introduz uma situação temporal geral. O leve valor de transição de δέ não exige uma conjunção separada em português neste contexto.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: o espírito impuro
  rationale: Reproduz diretamente a expressão grega e mantém sua associação com impureza ritual e moral, sem substituí-la pelo termo mais interpretativo “demônio”.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: sai de uma pessoa
  rationale: O presente traduz naturalmente o aoristo do subjuntivo na construção geral com ὅταν. Aqui ἄνθρωπος designa um ser humano, sem especificar sexo; “uma pessoa” comunica isso com naturalidade.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: passa por lugares sem água
  rationale: “Passa por” expressa o movimento através de uma região, e “sem água” preserva a imagem concreta de ἄνυδρος.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: procurando descanso
  rationale: Mantém a ação simultânea do particípio e traduz ἀνάπαυσις sem especificá-la indevidamente como um local de repouso.
- source_word: καὶ οὐχ εὑρίσκει
  choice: mas não o encontra
  rationale: Embora καί seja normalmente aditivo, o contraste lógico é expresso de modo natural por “mas”; o pronome “o” retoma “descanso”, objeto implícito no grego.
theological_decisions:
- issue: Sentido de πνεῦμα no contexto de exorcismo
  choice: espírito
  alternative: demônio
  rationale: O referente é um espírito maligno, mas o texto grego emprega πνεῦμα. A tradução preserva a formulação da fonte sem trocar o termo por uma identificação interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita arcaísmos e preserva a imagem concreta do texto grego.
