source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: pt
  text: O homem bom tira coisas boas do seu bom tesouro[b][a], e o homem mau tira coisas más do seu mau tesouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a pessoa boa» e «a pessoa má»; o grego emprega ἄνθρωπος no masculino singular em sentido representativo.
    reason: lexical_alternative
  - marker: b
    text: O contexto imediato trata da fala; por isso, «coisas boas» e «coisas más» podem referir-se especialmente a palavras.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθὸς / ἀγαθά
  choice: bom / coisas boas
  rationale: Preserva a repetição lexical e o contraste moral do grego, distinguindo apenas as formas exigidas pela sintaxe portuguesa.
- source_word: ἄνθρωπος
  choice: homem
  rationale: O substantivo grego está no masculino singular e apresenta um indivíduo representativo numa formulação proverbial paralela; uma nota registra a alternativa inclusiva em português.
- source_word: θησαυροῦ
  choice: tesouro
  rationale: Mantém a metáfora de uma reserva interior da qual algo é retirado; «depósito» seria possível, mas tornaria a imagem mais concreta e menos expressiva.
- source_word: ἐκβάλλει
  choice: tira
  rationale: Expressa de modo natural em português o movimento para fora sugerido pelo verbo no contexto do tesouro, sem a força excessiva de «expulsa» ou «lança para fora».
- source_word: ἐκ
  choice: do
  rationale: A contração de «de + o» traduz naturalmente a origem, enquanto «tira» já comunica o movimento para fora.
- source_word: πονηρὸς / πονηρά
  choice: mau / coisas más
  rationale: Mantém a simetria lexical e o contraste moral com «bom / coisas boas» em português corrente; «maligno» ou «perverso» introduziria uma intensidade ou nuance menos uniforme.
theological_decisions:
- issue: Contraste moral e antropológico em forma proverbial
  choice: Manter «coisas boas» e «coisas más» como expressões amplas
  alternative: Explicitar «palavras boas» e «palavras más» por causa do contexto imediato
  rationale: O contexto trata especialmente da fala, mas os adjetivos substantivados neutros plurais não nomeiam explicitamente palavras. A tradução conserva a amplitude do enunciado, e a nota indica a aplicação contextual provável.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo proverbial preservado. A repetição «bom/boas» e «mau/más» reproduz deliberadamente o padrão lexical grego. Os marcadores seguem a posição fornecida no texto de consulta.
