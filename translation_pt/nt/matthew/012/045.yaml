    issue: “Piores do que ele” não explicita a qualidade moral de πονηρότερα.
    rationale: O comparativo grego significa “mais maus/mais perversos”, não apenas em condição ou intensidade genericamente piores. A formulação revista conserva essa qualificação.
  - severity: low
    issue: “Passam a morar” acrescenta levemente a noção incoativa de começar a morar.
    rationale: Embora seja compatível com a sequência de entrar e habitar, “moram ali” reproduz mais diretamente κατοικεῖ e continua natural.
