id: MAT.12.45
reference: Matthew 12:45
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: pt
  text: Então ele vai e leva consigo sete outros espíritos, mais maus do que ele[a]. Eles entram e moram ali; e a condição final daquele homem se torna pior do que a anterior[b]. Assim também acontecerá com esta geração má.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sete espíritos diferentes, mais perversos do que ele”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as últimas coisas daquele homem se tornam piores do que as primeiras”; expressão que indica que sua condição final fica pior do que a anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε πορεύεται
  choice: Então ele vai
  rationale: Mantém a progressão temporal e o presente vívido da narrativa em português natural.
- source_word: παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: leva consigo
  rationale: Expressa de modo idiomático a ideia de tomar outros como acompanhantes.
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: outros sete espíritos
  rationale: ἕτερα indica primariamente espíritos adicionais; a ordem escolhida é natural em português.
- source_word: πονηρότερα ἑαυτοῦ
  choice: piores do que ele
  rationale: No contexto, o comparativo descreve maior malignidade moral. O pronome retoma naturalmente o espírito mencionado.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: Eles entram e passam a morar ali
  rationale: Converte o particípio em verbo finito e comunica κατοικέω como estabelecimento de residência. A forma singular κατοικεῖ do texto impresso é mantida como dificuldade textual/sintática em nota implícita na decisão, sem produzir português anômalo.
- source_word: γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων
  choice: a condição final daquele homem se torna pior do que a anterior
  rationale: Traduz o idiomatismo grego de modo claro, preservando o contraste entre a situação final e a inicial.
- source_word: οὕτως ἔσται καὶ
  choice: Assim também acontecerá
  rationale: Apresenta naturalmente a aplicação futura da comparação à geração mencionada.
- source_word: τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: com esta geração má
  rationale: Preserva a referência demonstrativa e a avaliação moral de πονηρά em linguagem corrente e digna.
theological_decisions:
- issue: Identificação dos πνεύματα
  choice: espíritos
  alternative: demônios
  rationale: O grego emprega πνεύματα; o contexto deixa claro seu caráter maligno, sem que seja necessário substituir o termo por uma designação mais específica.
- issue: Representação de ἀνθρώπου
  choice: daquele homem
  alternative: daquela pessoa
  rationale: Conserva a forma masculina singular da figura apresentada no texto, sem transformar a aplicação posterior em afirmação restrita aos homens.
- issue: Força da aplicação à geração
  choice: Assim também acontecerá com esta geração má
  alternative: Assim será também para esta geração má
  rationale: Mantém a declaração futura e a analogia, sem explicar além do que o texto afirma nem resolver sua tensão teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto usa linguagem corrente, mas digna; preserva a imagem dos espíritos e explicita apenas o necessário para tornar compreensível o idiomatismo grego.
