id: MAT.12.31
reference: Matthew 12:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: pt
  text: 'Por isso, eu lhes digo: todo pecado e toda blasfêmia serão perdoados às pessoas, mas a blasfêmia contra o Espírito[a] não será perdoada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra o Espírito Santo”. Pelo contexto, o referente é o Espírito Santo, embora este versículo diga literalmente apenas “o Espírito”.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural a inferência que liga esta declaração ao contexto anterior.
- source_word: λέγω ὑμῖν
  choice: eu lhes digo
  rationale: Preserva a fórmula de discurso direto e sua força solene em português atual.
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: todo pecado e toda blasfêmia
  rationale: A repetição de «todo/toda» comunica com clareza a força distributiva de πᾶσα e produz concordância natural em português.
- source_word: βλασφημία
  choice: blasfêmia
  rationale: Neste contexto, designa fala ofensiva ou desafiadora contra o que é divino; «blasfêmia» é o equivalente preciso e consagrado.
- source_word: ἀφεθήσεται
  choice: serão perdoados / não será perdoada
  rationale: O passivo futuro de ἀφίημι tem aqui o sentido inequívoco de concessão ou negação de perdão. A concordância foi ajustada aos respectivos sujeitos em português.
- source_word: τοῖς ἀνθρώποις
  choice: às pessoas
  rationale: O dativo indica os beneficiários do perdão. «Pessoas» transmite a referência humana genérica sem restringi-la ao sexo masculino.
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: mas a blasfêmia contra o Espírito
  rationale: 'O genitivo τοῦ πνεύματος é entendido naturalmente como objetivo: o Espírito é o alvo da blasfêmia. «Mas» preserva o contraste marcado por δέ.'
theological_decisions:
- issue: Traduzir πνεύματος como «Espírito» ou explicitar «Espírito Santo» no texto principal
  choice: Espírito
  alternative: Espírito Santo
  rationale: O grego deste versículo traz apenas τοῦ πνεύματος, sem ἁγίου. O contexto identifica o referente como o Espírito Santo, mas o texto principal preserva a forma mais concisa da fonte, e a explicitação contextual aparece em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A estrutura passiva foi mantida para preservar o contraste entre o que será e o que não será perdoado.
