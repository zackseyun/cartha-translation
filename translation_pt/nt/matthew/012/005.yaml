id: MAT.12.5
reference: Matthew 12:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: pt
  text: Ou vocês não leram na Lei que, aos sábados, os sacerdotes no templo profanam o sábado e não têm culpa?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “violam o sábado” ou “quebram o sábado”. O verbo grego tem o sentido de tratar algo como comum ou profano.
    reason: lexical_alternative
  - marker: b
    text: Em grego, “aos sábados”, provavelmente em referência a ocasiões repetidas, e não a um único sábado.
    reason: lexical_alternative
  - marker: c
    text: A “Lei” aqui se refere à Lei de Moisés como Escritura, provavelmente incluindo as normas sobre o serviço sacerdotal no sábado (ver Nm 28:9–10).
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Ou
  rationale: Introduz outro argumento das Escrituras na resposta de Jesus e preserva com naturalidade o fluxo retórico.
- source_word: οὐκ ἀνέγνωτε
  choice: vocês não leram
  rationale: Reproduz a fórmula retórica de Mateus em português corrente; o pretérito perfeito simples corresponde naturalmente ao aoristo grego.
- source_word: ἐν τῷ νόμῳ
  choice: na Lei
  rationale: A inicial maiúscula indica a Lei mosaica como corpo das Escrituras, e não uma lei abstrata.
- source_word: τοῖς σάββασιν
  choice: aos sábados
  rationale: Preserva o plural grego e comunica ocorrências repetidas de serviço sacerdotal em dias de sábado.
- source_word: οἱ ἱερεῖς
  choice: os sacerdotes
  rationale: Designação direta dos sacerdotes que realizavam o serviço do templo.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: ἱερόν designa o complexo do templo; 'no templo' é a forma natural e suficientemente precisa em português.
- source_word: τὸ σάββατον
  choice: o sábado
  rationale: Mantém o singular do objeto direto, referindo-se ao dia ou à instituição do sábado.
- source_word: βεβηλοῦσιν
  choice: profanam
  rationale: O verbo expressa tratar algo sagrado como comum ou profano. 'Profanam' conserva a força provocativa e a tensão da afirmação.
- source_word: ἀναίτιοί εἰσιν
  choice: não têm culpa
  rationale: Expressa ausência de culpabilidade no contexto e soa mais natural no português moderno do que 'são inculpáveis', sem enfraquecer o contraste forense.
theological_decisions:
- issue: Se a declaração deve ser suavizada para evitar a impressão de que os sacerdotes realmente violavam o sábado
  choice: Manter a formulação forte 'profanam o sábado', junto de 'não têm culpa'
  alternative: violam o sábado e são inocentes; quebram o sábado e não são culpados
  rationale: 'O grego cria deliberadamente uma tensão: o trabalho sacerdotal no templo pode ser descrito como profanação do sábado, mas os sacerdotes não incorrem em culpa. A tradução preserva essa tensão em vez de resolvê-la.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome 'vocês' explicita o plural presente na forma verbal grega. A ordem 'os sacerdotes no templo' mantém a compactação do original sem sugerir que sejam sacerdotes pertencentes ao edifício.
