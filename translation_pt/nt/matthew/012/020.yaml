id: MAT.12.20
reference: Matthew 12:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: pt
  text: Não quebrará o caniço machucado, nem apagará o pavio que fumega[a], até que faça a justiça triunfar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o linho fumegante”. O grego se refere literalmente ao linho usado como pavio de uma lamparina.
    reason: lexical_alternative
  - marker: b
    text: Ou “até que faça prevalecer o julgamento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κάλαμον
  choice: caniço
  rationale: Designa uma cana ou haste semelhante; “caniço” preserva com naturalidade a imagem profética em português.
- source_word: συντετριμμένον
  choice: rachado
  rationale: O particípio descreve algo danificado ou esmagado. “Rachado” indica que o caniço está seriamente comprometido, mas ainda não foi totalmente partido, em coerência com “não quebrará”.
- source_word: κατεάξει
  choice: não quebrará
  rationale: κατάγνυμι significa quebrar ou partir; esta formulação é direta e preserva a imagem de delicadeza.
- source_word: λίνον
  choice: pavio
  rationale: Embora o termo designe literalmente linho, aqui se refere ao linho usado como pavio de uma lamparina. “Pavio” comunica claramente o objeto pretendido.
- source_word: τυφόμενον
  choice: que fumega
  rationale: Descreve um pavio que solta fumaça e está quase se apagando. A expressão é clara, natural e mantém viva a imagem.
- source_word: σβέσει
  choice: não apagará
  rationale: σβέννυμι significa extinguir ou apagar; “apagar” é a escolha corrente e adequada para um pavio.
- source_word: ἕως ἂν
  choice: até que
  rationale: A construção aponta para um resultado futuro e é expressa de modo natural por “até que”.
- source_word: ἐκβάλῃ
  choice: leve
  rationale: Neste contexto, ἐκβάλλω tem o sentido de fazer chegar ou conduzir a um resultado decisivo; “leve” forma uma expressão portuguesa natural com “à vitória”.
- source_word: εἰς νῖκος
  choice: à vitória
  rationale: A frase indica o resultado vitorioso ou bem-sucedido da ação.
- source_word: τὴν κρίσιν
  choice: a justiça
  rationale: No contexto da citação de Isaías, κρίσις abrange o estabelecimento da ordem justa, não apenas a emissão de uma sentença judicial.
theological_decisions:
- issue: Sentido de κρίσις na citação sobre o Servo de Isaías
  choice: justiça
  alternative: julgamento
  rationale: “Justiça” expressa melhor a missão do Servo de estabelecer a ordem justa de Deus, enquanto “julgamento” continua sendo uma possibilidade lexical legítima e é registrada em nota.
- issue: Grau de explicitação da imagem de λίνον
  choice: pavio que fumega
  alternative: linho fumegante
  rationale: O grego menciona o linho usado como pavio. A tradução principal torna o referente claro para leitores modernos sem perder a imagem, e a nota preserva a forma mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção paralela mantém o tom poético da citação profética; “pavio que fumega” evita linguagem excessivamente arcaica, e “justiça” conserva a amplitude de κρίσις sem eliminar a alternativa “julgamento”.
