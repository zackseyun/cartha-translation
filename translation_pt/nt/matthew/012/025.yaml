id: MAT.12.25
reference: Matthew 12:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: pt
  text: 'Mas, sabendo o que eles pensavam[a], ele lhes disse: “Todo reino dividido contra si mesmo é devastado[b], e toda cidade ou casa[c] dividida contra si mesma não permanecerá de pé.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os raciocínios deles” ou “as intenções deles”.
    reason: lexical_alternative
  - marker: b
    text: Ou “fica desolado” ou “é arruinado”.
    reason: lexical_alternative
  - marker: c
    text: “Casa” também pode ter aqui o sentido de “família” ou “grupo familiar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: sabendo
  rationale: O particípio aoristo de ὁράω é usado aqui no sentido de conhecimento ou percepção mental. “Sabendo” é natural em português e não especifica como esse conhecimento foi obtido.
- source_word: δὲ
  choice: Mas
  rationale: δέ introduz uma transição com leve contraste; “Mas” expressa adequadamente a mudança argumentativa no contexto.
- source_word: ἐνθυμήσεις
  choice: o que eles pensavam
  rationale: O substantivo pode indicar pensamentos, reflexões ou raciocínios interiores. A formulação verbal é clara e idiomática em português, sem restringir indevidamente o sentido.
- source_word: Πᾶσα βασιλεία
  choice: Todo reino
  rationale: πᾶσα com substantivo singular formula um princípio universal; “Todo reino” conserva esse caráter proverbial.
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: dividido contra si mesmo
  rationale: A expressão indica divisão interna com força adversativa. “Contra si mesmo” preserva esse aspecto e é corrente em português.
- source_word: ἐρημοῦται
  choice: é devastado
  rationale: O verbo descreve o ato ou resultado de tornar algo desolado ou arruinado. “É devastado” preserva a voz passiva e a força da imagem.
- source_word: πόλις ἢ οἰκία
  choice: cidade ou casa
  rationale: πόλις corresponde a “cidade”; οἰκία pode designar tanto a casa física quanto os que nela vivem. “Casa” mantém a forma concreta e a amplitude do termo grego, com nota explicativa.
- source_word: οὐ σταθήσεται
  choice: não permanecerá de pé
  rationale: A forma futura de ἵστημι significa aqui continuar estabelecido ou resistir. “Não permanecerá de pé” conserva a metáfora e comunica naturalmente a ideia de não subsistir.
theological_decisions:
- issue: Natureza do conhecimento de Jesus sobre os pensamentos deles
  choice: A tradução declara apenas que ele sabia o que pensavam, sem explicar a origem desse conhecimento.
  alternative: Explicitar que Jesus conheceu os pensamentos por onisciência sobrenatural, discernimento profético ou dedução humana.
  rationale: O versículo afirma o conhecimento, mas não explica seu mecanismo. A tradução preserva essa abertura e evita acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem inicial evita acrescentar explicitamente o nome “Jesus”, ausente do grego neste versículo, e mantém clara a referência pronominal dada pelo contexto. Os marcadores foram posicionados junto às palavras que explicam.
