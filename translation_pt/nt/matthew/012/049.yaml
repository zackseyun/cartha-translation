id: MAT.12.49
reference: Matthew 12:49
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: pt
  text: 'E, estendendo a mão para os seus discípulos, disse: “Eis minha mãe e meus irmãos[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “irmãos”, no masculino plural; por isso, a tradução não amplia a expressão para “irmãos e irmãs”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτείνας
  choice: estendendo
  rationale: O particípio aoristo descreve a ação que acompanha e antecede imediatamente o verbo principal; o gerúndio transmite com naturalidade o gesto concreto.
- source_word: τὴν χεῖρα
  choice: a mão
  rationale: É o sentido comum de χείρ neste contexto e preserva a concretude do gesto de Jesus.
- source_word: ἐπὶ τοὺς μαθητὰς αὐτοῦ
  choice: para os seus discípulos
  rationale: Com o acusativo, ἐπί indica aqui a direção do gesto; “para” é idiomático e claro em português.
- source_word: Ἰδοὺ
  choice: Eis
  rationale: Mantém de modo conciso e digno a função enfática de chamar a atenção, sem recorrer a uma formulação excessivamente coloquial.
- source_word: ἡ μήτηρ μου
  choice: minha mãe
  rationale: Reproduz diretamente o termo familiar concreto e a construção possessiva natural em português.
- source_word: οἱ ἀδελφοί μου
  choice: meus irmãos
  rationale: Conserva o plural masculino expresso no grego e o paralelismo com “minha mãe”, sem ampliar interpretativamente para “irmãos e irmãs” ou generalizar como “família”.
theological_decisions:
- issue: Linguagem familiar na identificação dos discípulos como parentes de Jesus
  choice: Manter os termos concretos “mãe” e “irmãos”
  alternative: Empregar uma paráfrase inclusiva como “família”, “irmãos e irmãs” ou “parentes”
  rationale: A força retórica da declaração depende da aplicação aos discípulos dos termos familiares concretos. Uma generalização resolveria além do necessário a extensão de ἀδελφοί e enfraqueceria o contraste do contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Eis” preserva a ênfase solene de ἰδού, enquanto “estendendo a mão para” mantém o gesto em linguagem natural. A exclamação comunica a força demonstrativa da fala.
