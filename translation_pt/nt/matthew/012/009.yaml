  text: Καὶ μεταβὰς ἐκεῖθεν ἦλθεν εἰς τὴν συναγωγὴν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/009.yaml
  text: And departing from there, he went into their synagogue.
translation:
  language: pt
  text: E, saindo dali, ele foi à sinagoga deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Preserva a conexão coordenativa simples com o episódio anterior, sem acrescentar uma nuance temporal ausente do grego.
- source_word: μεταβὰς ἐκεῖθεν
  choice: saindo dali
  rationale: Expressa de modo natural em português o particípio aoristo de movimento e o advérbio de origem, indicando a transição a partir do lugar anterior.
- source_word: ἦλθεν
  choice: foi
  rationale: Embora ἔρχομαι possa significar «vir», o movimento narrativo a partir do cenário anterior torna «foi» a forma idiomática em português.
- source_word: εἰς τὴν συναγωγὴν
  choice: à sinagoga
  rationale: A contração «à» comunica naturalmente o movimento em direção à sinagoga. Neste contexto, o português não exige explicitar «para dentro de», embora εἰς denote direção e ingresso.
- source_word: συναγωγὴν
  choice: sinagoga
  rationale: É o termo estabelecido e historicamente adequado para o lugar judaico de reunião e culto.
- source_word: αὐτῶν
  choice: deles
  rationale: Mantém o pronome genitivo plural sem identificar mais precisamente seu referente nem acrescentar conotação polemizante.
theological_decisions:
- issue: Referente de «sinagoga deles»
  choice: Manter «deles», sem identificar explicitamente o grupo.
  alternative: «a sinagoga daquela gente» ou uma formulação que explicite um grupo judaico local
  rationale: O grego traz apenas αὐτῶν e deixa o referente dependente do contexto narrativo. A tradução preserva essa abertura e evita introduzir hostilidade ou distinção sectária não expressa no versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Saindo dali» é mais natural que o formalismo «tendo partido dali», e «foi à sinagoga deles» conserva o movimento e a atribuição do original.
