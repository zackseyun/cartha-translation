review_pass:
  verdict: revise
  source_fidelity: 'O texto traduz com precisão os elementos centrais: ἄνδρες como “homens”, o cenário escatológico de “no juízo”, μετά com genitivo como “com”, κατακρινῶ como “condenarão”, e o neutro πλεῖον como “algo maior”. “Em resposta à pregação de Jonas” expressa adequadamente εἰς τὸ κήρυγμα Ἰωνᾶ.'
  naturalness: O português é moderno, claro e de registro apropriado. A ligação por vírgula antes de “e eis que” acompanha melhor a continuidade retórica do grego do que iniciar uma nova frase.
  terminology: “Juízo”, “arrependidos/se arrependeram”, “pregação” e “eis que” são escolhas estabelecidas e naturais. A nota a, porém, propõe “por causa de”, formulação que pode sugerir causalidade simples e não preserva tão bem a resposta à proclamação indicada pela construção grega.
  issues:
  - severity: low
    issue: 'Alternativa da nota a: “por causa da proclamação de Jonas”'
    rationale: Essa formulação é semanticamente mais ampla e pode deslocar a ideia de arrependimento em resposta à mensagem. “Em resposta à proclamação de Jonas” preserva melhor a relação de εἰς τὸ κήρυγμα e fornece uma alternativa lexical real a “pregação”.
  - severity: low
    issue: Pontuação antes de “e eis que”
    rationale: O grego coordena a declaração final com καὶ ἰδού. Manter a oração no mesmo período em português ressalta sua continuidade enfática.
  revised_text: Os homens de Nínive se levantarão no juízo com esta geração e a condenarão, porque se arrependeram em resposta à pregação de Jonas, e eis que algo maior do que Jonas está aqui[b].
  revised_footnotes:
  - marker: a
    text: 'Ou: “em resposta à proclamação de Jonas”.'
    reason: Alternativa lexical para “pregação” (κήρυγμα), preservando a relação responsiva expressa por εἰς τὸ κήρυγμα.
  - marker: b
    text: 'Ou: “alguém maior do que Jonas está aqui”. O grego emprega uma expressão neutra, literalmente “algo maior do que Jonas”, que pode destacar a realidade maior presente em Jesus, e não apenas uma comparação entre pessoas.'
    reason: Preservação da ambiguidade gramatical e teológica de πλεῖον.
  revision_rationale: A nota a foi corrigida para evitar uma alternativa causal menos precisa. Como essa nota corresponde a uma alternativa de “pregação”, ela deve ser ancorada na expressão “pregação de Jonas”; por isso, o marcador [a] é mantido junto dessa expressão. A pontuação foi ajustada para conservar a progressão coordenada e enfática do original.
