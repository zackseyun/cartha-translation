id: MAT.12.41
reference: Matthew 12:41
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: pt
  text: Os homens de Nínive se levantarão no juízo com esta geração e a condenarão, porque se arrependeram em resposta à pregação de Jonas[a]. E eis que algo maior do que Jonas está aqui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa da proclamação de Jonas”.'
    reason: Alternativa lexical para εἰς τὸ κήρυγμα, cuja construção indica a mensagem de Jonas como ocasião e objeto da resposta de arrependimento.
  - marker: b
    text: 'Ou: “alguém maior do que Jonas está aqui”. O grego emprega uma expressão neutra, literalmente “algo maior do que Jonas”, que pode destacar a realidade maior presente em Jesus, e não apenas uma comparação entre pessoas.'
    reason: Preservação da ambiguidade gramatical e teológica de πλεῖον.
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: Os homens de Nínive
  rationale: Preserva o substantivo masculino explícito ἄνδρες e expressa Νινευῖται de modo natural em português.
- source_word: ἀναστήσονται
  choice: se levantarão
  rationale: Mantém a imagem de levantar-se no cenário do juízo e deixa aberta a possível ressonância de ressurreição.
- source_word: ἐν τῇ κρίσει
  choice: no juízo
  rationale: Designa de maneira direta e tradicional o evento judicial escatológico, sem reduzir κρίσις apenas à sentença condenatória.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: com esta geração
  rationale: Traduz diretamente μετά com genitivo; o caráter adversativo aparece no verbo seguinte, “condenarão”.
- source_word: κατακρινοῦσιν αὐτήν
  choice: a condenarão
  rationale: Traduz κατακρίνω por “condenar” e conserva o pronome feminino cujo antecedente é “esta geração”.
- source_word: μετενόησαν
  choice: se arrependeram
  rationale: Expressa naturalmente a mudança moral e religiosa em resposta à mensagem profética.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: em resposta à pregação de Jonas
  rationale: Torna explícita, sem alterar o sentido, a relação responsiva indicada por εἰς após μετανοέω; “pregação” é corrente e adequada para κήρυγμα.
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Conserva o marcador enfático e solene que chama a atenção para a declaração seguinte.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: algo maior do que Jonas está aqui
  rationale: Preserva o comparativo neutro πλεῖον como “algo maior”, sem normalizá-lo para uma referência exclusivamente pessoal.
theological_decisions:
- issue: Como traduzir πλεῖον Ἰωνᾶ em sua referência a Jesus
  choice: algo maior do que Jonas está aqui
  alternative: alguém maior do que Jonas está aqui
  rationale: O grego emprega uma forma neutra, não uma expressão masculina equivalente a “alguém maior”. “Algo maior” preserva a forma e a tensão do texto, podendo abranger a pessoa, a presença e a missão de Jesus sem restringir a referência.
- issue: Gênero de ἄνδρες
  choice: homens
  alternative: habitantes / pessoas
  rationale: O texto grego usa explicitamente o substantivo masculino ἄνδρες; a tradução não o neutraliza.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “E eis que” conserva a solenidade retórica do original; “em resposta à pregação” comunica naturalmente a relação semântica da construção grega.
