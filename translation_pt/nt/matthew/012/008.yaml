id: MAT.12.8
reference: Matthew 12:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κύριος γάρ ἐστιν τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/008.yaml
  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: pt
  text: Pois o Filho do Homem é Senhor do sábado[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Filho do Homem tem autoridade sobre o sábado”.'
    reason: lexical_alternative
  - marker: b
    text: “Filho do Homem” é a autodesignação característica de Jesus nos Evangelhos; alternativamente, a expressão poderia ser entendida de modo mais genérico como “o ser humano”, embora isso enfraqueça sua provável força de título.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Pois
  rationale: Preserva a função explicativa da conjunção, ligando a afirmação ao argumento anterior, de modo conciso e natural em português.
- source_word: κύριος
  choice: Senhor
  rationale: Mantém o sentido forte de autoridade e o peso cristológico do título; “senhor sobre” ou “dono” seriam mais interpretativos ou menos adequados ao registro.
- source_word: τοῦ σαββάτου
  choice: do sábado
  rationale: Reproduz naturalmente em português o genitivo dependente de κύριος. Em português, o nome do dia e da instituição religiosa é normalmente grafado com inicial minúscula.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Preserva a autodesignação característica de Jesus nos Evangelhos e sua possível ressonância intertextual, sem reduzi-la a uma referência genérica ao ser humano.
- source_word: ἐστιν
  choice: é
  rationale: Verbo copulativo no presente, traduzido diretamente sem expansão.
theological_decisions:
- issue: Força cristológica de κύριος ... τοῦ σαββάτου
  choice: “o Filho do Homem é Senhor do sábado”
  alternative: “o Filho do Homem tem autoridade sobre o sábado”
  rationale: “Senhor” preserva a afirmação forte de autoridade e sua densidade teológica, sem explicitar além do que o texto grego declara.
- issue: Sentido de ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Tratar a expressão como o título “o Filho do Homem”.
  alternative: “o ser humano”
  rationale: A formulação funciona no Evangelho como autodesignação reconhecível de Jesus e pode conter ressonância apocalíptica; a tradução tradicional preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva a ordem enfática do conteúdo e o título tradicional “Filho do Homem”; emprega “sábado” com inicial minúscula segundo o uso ortográfico corrente.
