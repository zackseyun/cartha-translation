source:
  edition: SBLGNT
  text: Οἱ δὲ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι ἔπεισαν τοὺς ὄχλους ἵνα αἰτήσωνται τὸν Βαραββᾶν τὸν δὲ Ἰησοῦν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/020.yaml
  text: But the chief priests and the elders persuaded the crowds to ask for Barabbas[a], but to destroy Jesus.
translation:
  language: pt
  text: Mas os chefes dos sacerdotes e os anciãos persuadiram as multidões a pedir Barrabás, mas a matar Jesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: A conjunção introduz contraste com o desenvolvimento narrativo anterior; “Mas” expressa essa força de modo natural.
- source_word: ἀρχιερεῖς
  choice: chefes dos sacerdotes
  rationale: Designa a liderança sacerdotal de Jerusalém, não apenas um único sumo sacerdote. A expressão é clara e historicamente adequada.
- source_word: πρεσβύτεροι
  choice: anciãos
  rationale: Refere-se a líderes reconhecidos do povo judeu; “anciãos” preserva o sentido institucional e histórico.
- source_word: ἔπεισαν
  choice: persuadiram
  rationale: Traduz diretamente o ato consumado de influenciar as multidões.
- source_word: ὄχλους
  choice: multidões
  rationale: Preserva o plural do grego e o sentido de grupos numerosos reunidos.
- source_word: ἵνα
  choice: a
  rationale: Depois de “persuadiram”, a construção com infinitivo comunica naturalmente em português o conteúdo ou resultado pretendido.
- source_word: αἰτήσωνται
  choice: pedir
  rationale: Expressa de modo corrente a solicitação de que Barrabás fosse escolhido ou libertado.
- source_word: Βαραββᾶν
  choice: Barrabás
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἀπολέσωσιν
  choice: destruir
  rationale: Preserva o valor amplo de causar a ruína ou a morte de alguém, sem substituir no texto principal o verbo grego por uma expressão jurídica mais específica.
- source_word: τὸν δὲ Ἰησοῦν
  choice: mas a destruir Jesus
  rationale: O segundo δέ põe em contraste o destino pedido para Barrabás e o pretendido para Jesus.
theological_decisions:
- issue: Sentido de ἀπολέσωσιν no contexto de execução judicial
  choice: destruir Jesus
  alternative: matar Jesus
  rationale: O verbo grego é mais amplo que um termo técnico de execução e pode significar destruir ou causar a morte. O texto principal preserva essa amplitude, enquanto a nota esclarece o sentido concreto no contexto.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Mantém-se o contraste marcado pelos dois usos de δέ e a amplitude lexical de ἀπόλλυμι. O marcador da nota foi colocado após “Jesus”, termo ao qual a alternativa lexical efetivamente se refere.
