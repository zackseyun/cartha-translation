  text: συμβούλιον δὲ λαβόντες ἠγόρασαν ἐξ αὐτῶν τὸν Ἀγρὸν τοῦ Κεραμέως εἰς ταφὴν τοῖς ξένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/007.yaml
  text: So after taking counsel[b][a], they bought the Potter’s Field with them as a burial place for foreigners.
translation:
  language: pt
  text: Então, depois de deliberarem, compraram com aquelas moedas o Campo do Oleiro como lugar de sepultamento para estrangeiros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «forasteiros».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβούλιον ... λαβόντες
  choice: depois de deliberarem
  rationale: Expressa naturalmente em português o idiomatismo participial «tomar conselho», mantendo a ideia de uma decisão tomada em conjunto.
- source_word: δὲ
  choice: Então
  rationale: Marca a continuação narrativa e a consequência no contexto, sem introduzir um contraste forte.
- source_word: ἠγόρασαν
  choice: compraram
  rationale: Equivalente direto, corrente e natural do aoristo de ἀγοράζω.
- source_word: ἐξ αὐτῶν
  choice: com aquelas moedas
  rationale: O pronome neutro plural retoma as moedas de prata do contexto anterior. A explicitação evita em português uma referência pronominal pouco natural, sem alterar o sentido.
- source_word: τὸν Ἀγρὸν τοῦ Κεραμέως
  choice: o Campo do Oleiro
  rationale: Reproduz naturalmente a construção genitiva e trata a expressão como designação reconhecível do lugar na narrativa.
- source_word: εἰς ταφὴν
  choice: para servir de sepultura
  rationale: Comunica com clareza a finalidade expressa por εἰς com ταφή.
- source_word: τοῖς ξένοις
  choice: aos estrangeiros
  rationale: Neste contexto, ξένοις designa pessoas de fora ou não locais; «estrangeiros» é claro no português moderno, embora «forasteiros» também seja possível.
theological_decisions:
- issue: Referente de αὐτῶν
  choice: Explicitar o referente como «aquelas moedas»
  alternative: Traduzir mais literalmente «com elas» ou de modo coletivo «com aquele dinheiro»
  rationale: O contexto imediato identifica o referente como as moedas de prata devolvidas por Judas. A explicitação é necessária para fluência e clareza em português e não acrescenta uma interpretação teológica.
- issue: Sentido de ξένοις
  choice: estrangeiros
  alternative: forasteiros
  rationale: O termo pode indicar estrangeiros, pessoas de fora ou estranhos. A tradução principal preserva a referência ampla a não locais, e a nota registra a alternativa sem restringir indevidamente o sentido.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. «Deliberarem» preserva o caráter colegiado da decisão; «com aquelas moedas» torna explícita a retomada contextual exigida pela naturalidade do português.
