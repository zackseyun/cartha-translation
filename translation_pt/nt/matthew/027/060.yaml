  text: καὶ ἔθηκεν αὐτὸ ἐν τῷ καινῷ αὐτοῦ μνημείῳ ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ, καὶ προσκυλίσας λίθον μέγαν τῇ θύρᾳ τοῦ μνημείου ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/060.yaml
  text: and placed it in his own new tomb[a], which he had cut into the rock. And after rolling a large stone to the entrance of the tomb, he went away.
translation:
  language: pt
  text: E o colocou em seu próprio túmulo novo, que havia escavado na rocha. Depois de rolar uma grande pedra contra a entrada[a] do túmulo, foi embora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «porta do túmulo». O termo grego pode designar uma porta ou a entrada; «entrada» é mais claro no contexto de um túmulo escavado na rocha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθηκεν
  choice: colocou
  rationale: Expressa de modo natural e digno o ato de pôr o corpo de Jesus no túmulo, sem acrescentar uma postura não explicitada pelo verbo.
- source_word: μνημείῳ / μνημείου
  choice: túmulo
  rationale: No contexto funerário e escavado em rocha, designa claramente uma sepultura construída ou talhada, não apenas uma cova.
- source_word: καινῷ
  choice: novo
  rationale: Preserva o sentido direto de καινός; 'nunca usado' seria uma inferência contextual não declarada neste versículo.
- source_word: αὐτοῦ
  choice: seu próprio
  rationale: Torna clara a posse por José e reproduz de maneira idiomática a ênfase da construção grega.
- source_word: ἐλατόμησεν
  choice: havia escavado
  rationale: Comunica a preparação anterior de um túmulo talhado na rocha; o mais-que-perfeito deixa clara a anterioridade em relação ao sepultamento.
- source_word: ἐν τῇ πέτρᾳ
  choice: na rocha
  rationale: É uma formulação natural em português para um túmulo escavado em rocha sólida e mantém o valor espacial da expressão.
- source_word: προσκυλίσας
  choice: Depois, rolou
  rationale: Representa a ação do particípio aoristo como anterior à partida e produz uma sequência narrativa clara em português.
- source_word: λίθον μέγαν
  choice: uma grande pedra
  rationale: Tradução direta, corrente e sem intensificação indevida de μέγας.
- source_word: τῇ θύρᾳ τοῦ μνημείου
  choice: até a entrada do túmulo
  rationale: θύρα pode indicar porta ou entrada; 'entrada' evita sugerir uma porta com dobradiças e se ajusta ao túmulo escavado na rocha.
- source_word: ἀπῆλθεν
  choice: foi embora
  rationale: Expressa em linguagem moderna e natural a simples partida indicada por ἀπέρχομαι.
