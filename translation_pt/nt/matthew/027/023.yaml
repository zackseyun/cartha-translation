  text: ὁ ⸀δὲ ἔφη· Τί γὰρ κακὸν ἐποίησεν; οἱ δὲ περισσῶς ἔκραζον λέγοντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/023.yaml
  text: But he said[a], “What evil has he done?” But they cried out all the more, saying[b], “Let him be crucified.”
translation:
  language: pt
  text: 'Mas ele disse[a]: “Que mal ele fez?” Eles, porém, gritavam ainda mais, dizendo[b]: “Que seja crucificado!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “Por quê? Que mal ele fez?”'
    reason: lexical_alternative
  - marker: b
    text: 'Em português mais direto: “Crucifiquem-no!” O grego traz literalmente uma ordem na voz passiva: “Que seja crucificado!”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: disse
  rationale: O aoristo de φημί funciona como introdução narrativa simples da fala; “disse” é natural e fiel, sem acrescentar a ideia de resposta contínua.
- source_word: Τί γὰρ κακὸν ἐποίησεν;
  choice: Que mal ele fez?
  rationale: A pergunta idiomática desafia a acusação. Em português, “Que mal ele fez?” comunica naturalmente τί... κακόν; o valor discursivo de γάρ fica implícito na réplica, evitando um “pois” artificial.
- source_word: κακὸν
  choice: mal
  rationale: “Mal” preserva a força moral de κακόν e soa mais direto neste contexto do que “coisa errada”.
- source_word: περισσῶς
  choice: ainda mais
  rationale: A expressão indica intensificação da reação da multidão sem especificar indevidamente se foi apenas em volume ou também em veemência.
- source_word: ἔκραζον
  choice: gritavam
  rationale: O imperfeito é representado naturalmente pelo imperfeito português, indicando ação em andamento ou repetida.
- source_word: λέγοντες
  choice: dizendo
  rationale: O gerúndio expressa a simultaneidade do particípio com os gritos.
- source_word: Σταυρωθήτω
  choice: Que seja crucificado!
  rationale: A construção preserva tanto a força imperativa quanto a voz passiva do imperativo aoristo grego.
- source_word: ὁ δὲ ... οἱ δὲ
  choice: Mas ele ... Eles, porém ...
  rationale: A variação natural em português mantém o contraste marcado pelas duas ocorrências de δέ sem repetir mecanicamente “mas”.
theological_decisions:
- issue: Forma da exigência da multidão quanto à crucificação
  choice: Que seja crucificado!
  alternative: Crucifiquem-no!
  rationale: A forma passiva conserva a estrutura de σταυρωθήτω e evita identificar explicitamente os agentes da execução, algo que o grego não faz nesta ordem.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O imperfeito “gritavam” conserva o aspecto durativo; a exigência final mantém a voz passiva do grego. Todos os marcadores de nota aparecem no texto principal.
