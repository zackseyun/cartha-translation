source:
  edition: SBLGNT
  text: ἔδωκαν αὐτῷ πιεῖν ⸀οἶνον μετὰ χολῆς μεμιγμένον· καὶ γευσάμενος οὐκ ⸀ἠθέλησεν πιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/034.yaml
  text: They gave him wine mixed with gall to drink[a], but after tasting it, he was unwilling to drink.
translation:
  language: pt
  text: Deram-lhe vinho misturado com fel para beber[a]; mas ele, depois de prová-lo, não quis beber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra grega χολή pode significar “fel” ou, de modo mais geral, uma substância amarga. A tradução mantém “fel” para refletir a formulação de Mateus; compare o relato relacionado da paixão em Marcos 15:23, que menciona mirra.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν αὐτῷ πιεῖν
  choice: Deram-lhe ... para beber
  rationale: Reproduz diretamente o verbo δίδωμι, o objeto indireto e o infinitivo de finalidade/complemento, em português natural.
- source_word: οἶνον
  choice: vinho
  rationale: É o sentido comum do termo grego e mantém a especificidade da bebida.
- source_word: μετὰ χολῆς μεμιγμένον
  choice: misturado com fel
  rationale: O particípio passivo modifica 'vinho', e χολή pode designar fel ou, por extensão, uma substância amarga. 'Fel' preserva a forma lexical e a possível ressonância bíblica.
- source_word: καὶ γευσάμενος
  choice: mas ele, depois de prová-lo
  rationale: 'O particípio indica ação anterior: ''depois de provar''. A conjunção é vertida como ''mas'' para expressar naturalmente o contraste narrativo com a decisão de não beber.'
- source_word: οὐκ ἠθέλησεν πιεῖν
  choice: não quis beber
  rationale: Mantém o sentido volitivo de θέλω sem intensificá-lo para 'recusou-se'.
theological_decisions:
- issue: Sentido de χολή e sua relação com a narrativa da paixão e possíveis ressonâncias dos Salmos
  choice: fel
  alternative: substância amarga
  rationale: '''Fel'' conserva a especificidade lexical possível no texto de Mateus e sua ressonância bíblica, enquanto a nota reconhece o sentido mais amplo sem harmonizar o versículo com Marcos 15:23.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção 'não quis beber' é corrente e preserva a nuance de vontade; 'fel' mantém a linguagem bíblica sem arcaísmo excessivo.
