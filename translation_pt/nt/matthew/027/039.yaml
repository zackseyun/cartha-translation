review_pass:
  verdict: revise
  source_fidelity: O particípio substantivado e o imperfeito estão bem representados por «os que passavam» e «insultavam». βλασφημέω, quando tem Jesus como objeto, pode designar injúria/revilemento e não exige, em português, a afirmação mais estreita de blasfêmia contra Deus. O gesto simultâneo é preservado por «balançando a cabeça».
  naturalness: «Blasfemavam contra ele» é compreensível, mas é pouco idiomático e, no português moderno, tende a sugerir indevidamente uma blasfêmia dirigida contra Deus. «O insultavam» é natural, direto e comunica com precisão o abuso verbal no contexto.
  terminology: A nota mantém «blasfemavam contra ele» como alternativa literal possível e explica a amplitude do verbo. «Insultavam» não impõe uma leitura cristológica nem enfraquece o caráter hostil da ação. O singular distributivo em «a cabeça» é idiomático em português.
  issues:
  - severity: medium
    issue: «blasfemavam contra ele» é uma formulação marcada e semanticamente propensa a mal-entendido em português.
    rationale: Embora reflita uma possibilidade lexical do grego, em uso moderno «blasfemar» normalmente evoca fala irreverente contra Deus. Neste contexto, o verbo grego também significa injuriar ou ultrajar uma pessoa; «o insultavam» transmite essa acepção de modo natural. A alternativa mais literal pode ser preservada em nota.
  - severity: low
    issue: «por ali» acrescenta uma indicação locativa não expressa no versículo.
    rationale: O acréscimo é contextual e não altera substancialmente o sentido, mas «os que passavam» já expressa o particípio de modo suficiente e mais econômico.
