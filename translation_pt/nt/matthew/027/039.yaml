  yaml_path: translation/nt/matthew/027/039.yaml
  text: And those passing by were blaspheming him[a], shaking their heads[b],
translation:
  language: pt
  text: E os que passavam o insultavam[a], balançando a cabeça[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «blasfemavam contra ele» ou «o difamavam». O verbo grego pode indicar fala abusiva ou difamatória, não apenas blasfêmia no sentido estrito de falar contra Deus.
    reason: lexical_alternative
  - marker: b
    text: Gesto de desprezo ou zombaria; compare Salmo 22:7.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ δὲ
  choice: E os que
  rationale: 'δέ é um conectivo leve; «E» mantém o fluxo narrativo sem introduzir contraste excessivo. O artigo com o particípio tem valor substantivado: «os que».'
- source_word: παραπορευόμενοι
  choice: passavam por ali
  rationale: O particípio presente descreve pessoas que transitavam junto ao lugar da crucificação. A formulação é natural em português e preserva a ação em curso.
- source_word: ἐβλασφήμουν
  choice: blasfemavam contra
  rationale: O imperfeito expressa ação continuada. «Blasfemavam contra» conserva a força do verbo grego, que também pode designar insulto, difamação ou fala abusiva contra uma pessoa; a nota registra essa amplitude.
- source_word: αὐτὸν
  choice: ele
  rationale: Pronome objeto cujo referente é Jesus; a preposição «contra» é exigida pela construção idiomática escolhida em português.
- source_word: κινοῦντες
  choice: balançando
  rationale: O particípio indica um gesto simultâneo à fala hostil. «Balançando» é corrente e claro em português moderno.
- source_word: τὰς κεφαλὰς αὐτῶν
  choice: a cabeça
  rationale: 'Embora o grego use o plural distributivo, o singular «a cabeça» é a forma coletiva mais natural em português: cada pessoa balançava a própria cabeça.'
theological_decisions:
- issue: Força semântica de βλασφημέω quando dirigido a Jesus na narrativa da paixão
  choice: Manter «blasfemavam contra» no texto principal
  alternative: «insultavam» ou «difamavam»
  rationale: A escolha preserva a linguagem forte de Mateus e sua possível ressonância teológica sem afirmar que o verbo, por si só, resolva uma questão cristológica. A nota evita restringir o sentido à blasfêmia contra Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Passavam por ali» soa mais natural do que uma reprodução rígida do particípio, e «balançando a cabeça» exprime idiomaticamente o gesto distributivo. A vírgula final foi mantida porque o versículo continua na frase seguinte.
