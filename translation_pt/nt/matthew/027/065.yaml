  text: ⸀ἔφη αὐτοῖς ὁ Πιλᾶτος· Ἔχετε κουστωδίαν· ὑπάγετε ἀσφαλίσασθε ὡς οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/065.yaml
  text: Pilate said to them[a], “You have a guard. Go[b], make it secure as you know how.”
translation:
  language: pt
  text: 'Pilatos lhes disse: “Vocês têm uma guarda[a]. Vão e deixem o túmulo seguro como sabem fazer[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Levem uma guarda”; possivelmente, “Vocês têm sua própria guarda”. O grego pode indicar que Pilatos lhes concedeu uma guarda ou que se referiu a uma guarda que já estava à disposição deles.
    reason: alternative_reading
  - marker: b
    text: Ou “tornem-no tão seguro quanto souberem”.
    reason: alternative_rendering
lexical_decisions:
- source_word: ἔφη
  choice: disse
  rationale: Verbo narrativo comum de fala; “disse” é a correspondência natural e digna em português.
- source_word: αὐτοῖς
  choice: lhes
  rationale: O pronome dativo plural indica os destinatários da fala de Pilatos.
- source_word: Ἔχετε
  choice: Vocês têm
  rationale: Preserva o sentido indicativo mais direto de ἔχω e mantém aberta a possibilidade contextual de concessão ou de referência a uma guarda já disponível.
- source_word: κουστωδίαν
  choice: uma guarda
  rationale: O empréstimo latino designa um destacamento de vigilância; “uma guarda” é claro e natural em português.
- source_word: ὑπάγετε
  choice: Vão
  rationale: Imperativo de movimento ou partida, expresso de forma concisa e corrente.
- source_word: ἀσφαλίσασθε
  choice: deixem o túmulo seguro
  rationale: O imperativo médio pede que os interlocutores tornem seguro o referente implícito; explicitar “o túmulo” evita um pronome ambíguo em português sem alterar o referente contextual.
- source_word: ὡς οἴδατε
  choice: como sabem fazer
  rationale: Expressa naturalmente a ideia de agir segundo o próprio conhecimento ou capacidade, sem ampliar para “o melhor que puderem”.
theological_decisions:
- issue: Se Ἔχετε κουστωδίαν concede uma guarda romana ou se refere a uma guarda já disponível aos líderes judeus
  choice: “Vocês têm uma guarda” no texto principal
  alternative: “Levem uma guarda” ou “Vocês têm sua própria guarda”
  rationale: A formulação grega admite tanto uma autorização quanto uma declaração. A tradução principal conserva a ambiguidade em vez de decidir uma questão histórica debatida.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento “vocês” torna explícito o plural grego. A construção mantém tom narrativo digno, preserva a ambiguidade central de Ἔχετε κουστωδίαν e explicita “o túmulo” apenas para clareza referencial.
