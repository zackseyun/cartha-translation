  yaml_path: translation/nt/matthew/027/033.yaml
  text: And when they came to a place called Golgotha (which means Place of a Skull),[a]
translation:
  language: pt
  text: E, quando chegaram a um lugar chamado Gólgota, que é chamado Lugar da Caveira,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «isto é, Lugar da Caveira» ou «que significa Lugar da Caveira». O grego apresenta uma glosa explicativa do nome Gólgota e inclui a expressão «que é chamado».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: quando chegaram
  rationale: O particípio aoristo tem sentido temporal no fluxo narrativo; a oração com «quando» é natural em português e preserva essa relação.
- source_word: τόπον
  choice: um lugar
  rationale: O substantivo significa «lugar», e a construção grega sem artigo é representada naturalmente pelo indefinido em português.
- source_word: λεγόμενον
  choice: chamado
  rationale: Neste uso, o particípio de λέγω indica o nome pelo qual o lugar era conhecido.
- source_word: Γολγοθᾶ
  choice: Gólgota
  rationale: O topônimo é transliterado na forma consagrada e amplamente reconhecida em português.
- source_word: ὅ ἐστιν
  choice: isto é
  rationale: A fórmula introduz uma explicação do nome sem exigir que se decida rigidamente entre equivalência lexical e designação.
- source_word: Κρανίου Τόπος
  choice: Lugar da Caveira
  rationale: A expressão conserva a relação genitiva entre «lugar» e «caveira» e emprega a forma tradicional, clara e natural em português.
- source_word: λεγόμενος
  choice: Lugar da Caveira
  rationale: O segundo «chamado» está semanticamente presente na fórmula explicativa; omiti-lo como verbo separado evita repetição pouco natural em português.
