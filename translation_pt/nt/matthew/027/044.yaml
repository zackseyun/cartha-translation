id: MAT.27.44
reference: Matthew 27:44
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸ δ’ αὐτὸ καὶ οἱ λῃσταὶ οἱ συσταυρωθέντες ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/044.yaml
  text: In the same way[b][a], even the robbers who had been crucified with him were insulting him.
translation:
  language: pt
  text: Do mesmo modo[a], até mesmo os ladrões crucificados com ele o insultavam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a mesma coisa”; a expressão grega indica que eles também o tratavam da mesma maneira.
    reason: lexical_alternative
  - marker: b
    text: Ou “o injuriavam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δ’ αὐτὸ
  choice: Do mesmo modo
  rationale: A expressão τὸ αὐτό, com δέ, tem aqui valor adverbial e retoma o tipo de zombaria descrito anteriormente. “Do mesmo modo” comunica esse sentido idiomático em português natural.
- source_word: καὶ
  choice: até
  rationale: 'Neste contexto, καί tem força enfática e acrescenta um elemento culminante: até mesmo os ladrões participaram dos insultos.'
- source_word: οἱ λῃσταὶ
  choice: os ladrões
  rationale: λῃστής designa normalmente um ladrão ou assaltante. “Ladrões” é claro e tradicional, sem especificar indevidamente que fossem insurgentes políticos.
- source_word: οἱ συσταυρωθέντες σὺν αὐτῷ
  choice: crucificados com ele
  rationale: O particípio passivo identifica os ladrões como aqueles que foram crucificados ao lado de Jesus. A formulação concisa preserva o sentido sem produzir uma construção pesada.
- source_word: ὠνείδιζον
  choice: o insultavam
  rationale: O imperfeito indica ação contínua ou repetida. “Insultavam” é atual, acessível e preserva a ideia de fala ofensiva dirigida contra Jesus.
- source_word: αὐτόν
  choice: o
  rationale: Pronome objeto que retoma Jesus; a forma átona é natural em português escrito e mantém clara a referência.
theological_decisions:
- issue: Possível harmonização com o relato de Lucas, no qual um dos criminosos fala de maneira diferente
  choice: Manter a afirmação de Mateus no plural, aplicando-a aos ladrões crucificados com Jesus nesta cena.
  alternative: Atenuar o plural ou reformular o texto para harmonizá-lo explicitamente com Lucas.
  rationale: O grego emprega o plural οἱ λῃσταί e o verbo no plural. A tradução deve preservar a formulação de Mateus e a tensão narrativa entre os Evangelhos, sem resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Do mesmo modo” evita literalismo pouco natural; “até” preserva a ênfase contextual; “injuriavam” fica registrado como alternativa mais formal.
