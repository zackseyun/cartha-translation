id: MAT.27.6
reference: Matthew 27:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς λαβόντες τὰ ἀργύρια εἶπαν· Οὐκ ἔξεστιν βαλεῖν αὐτὰ εἰς τὸν κορβανᾶν, ἐπεὶ τιμὴ αἵματός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/006.yaml
  text: But the chief priests[a], taking the silver pieces, said, “It is not lawful to put them into the temple treasury[b], since they are the price of blood.”
translation:
  language: pt
  text: 'Mas os principais sacerdotes pegaram as moedas de prata e disseram: “Não é lícito colocá-las no tesouro do templo[a], pois são preço de sangue[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grego corbã, termo que aqui se refere ao tesouro ou aos fundos sagrados do templo.
    reason: lexical_alternative
  - marker: b
    text: Ou “dinheiro de sangue”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: principais sacerdotes
  rationale: No plural, designa as autoridades sacerdotais de maior posição. “Principais sacerdotes” é claro, corrente no uso bíblico em português e evita sugerir vários ocupantes simultâneos do cargo singular de sumo sacerdote.
- source_word: λαβόντες
  choice: pegaram
  rationale: O particípio aoristo indica uma ação ligada ao verbo principal; a forma coordenada é natural em português e mantém a sequência sem tornar a frase pesada.
- source_word: τὰ ἀργύρια
  choice: as moedas de prata
  rationale: Retoma o pagamento em prata mencionado no contexto. “Moedas de prata” comunica concretamente o valor monetário sem identificar uma denominação específica que o grego não nomeia aqui.
- source_word: Οὐκ ἔξεστιν
  choice: Não é lícito
  rationale: Expressa o que é permitido ou proibido segundo a norma religiosa, preservando o tom jurídico da declaração dos sacerdotes.
- source_word: βαλεῖν
  choice: colocá-las
  rationale: Embora βάλλω possa significar “lançar”, neste contexto financeiro o sentido natural é pôr ou depositar as moedas no tesouro.
- source_word: κορβανᾶν
  choice: tesouro do templo
  rationale: O termo se refere ao tesouro ou aos fundos sagrados do templo. A tradução comunica diretamente o referente, enquanto a nota preserva a forma tradicional “corbã”.
- source_word: ἐπεὶ
  choice: pois
  rationale: Introduz de modo conciso e natural a razão apresentada para a proibição.
- source_word: τιμὴ αἵματός
  choice: preço de sangue
  rationale: Mantém a expressão compacta e concreta do grego, inclusive sua tensão moral, sem explicitar além do texto se o sangue é o de Jesus ou o resultado de derramamento de sangue.
theological_decisions:
- issue: Como traduzir κορβανᾶν sem perder sua referência cultual
  choice: tesouro do templo
  alternative: corbã
  rationale: A expressão aponta para fundos sagrados ligados ao templo, e não exige transliteração no corpo do texto. A tradução favorece a compreensão imediata, e a nota registra o termo grego tradicional.
- issue: Como preservar o alcance de τιμὴ αἵματός
  choice: preço de sangue
  alternative: dinheiro de sangue
  rationale: “Preço de sangue” acompanha mais de perto a construção grega e preserva sua possível referência tanto ao preço pago em conexão com a morte quanto à culpa ligada ao sangue, sem resolver a tensão interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe foi levemente reestruturada para soar natural, mantendo o contraste, a sequência das ações e o tom jurídico-religioso do original.
