  text: Mary Magdalene and the other Mary were there, sitting opposite the tomb.
translation:
  language: pt
  text: Maria Madalena e a outra Maria estavam ali, sentadas diante do túmulo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν δὲ ἐκεῖ
  choice: estavam ali
  rationale: Embora ἦν esteja no singular, precede dois sujeitos coordenados; em português natural, a concordância no plural expressa corretamente a presença de ambas. δέ funciona como conexão narrativa leve e não precisa de equivalente explícito neste contexto.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Maria Madalena
  rationale: Forma tradicional e amplamente reconhecida em português para o nome e a identificação da personagem.
- source_word: ἡ ἄλλη Μαρία
  choice: a outra Maria
  rationale: Preserva diretamente a distinção feita por ἄλλη entre esta Maria e Maria Madalena.
- source_word: καθήμεναι
  choice: sentadas
  rationale: O particípio presente descreve a postura contínua das duas mulheres; o feminino plural é natural e explícito em português.
- source_word: ἀπέναντι τοῦ τάφου
  choice: diante do túmulo
  rationale: ἀπέναντι indica posição em frente ou do lado oposto. “Diante do túmulo” é corrente, digno e não exige inferir distância ou obstáculo entre elas e o túmulo.
