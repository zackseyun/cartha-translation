source:
  edition: SBLGNT
  text: καὶ πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ καὶ κάλαμον ⸂ἐν τῇ δεξιᾷ⸃ αὐτοῦ, καὶ γονυπετήσαντες ἔμπροσθεν αὐτοῦ ⸀ἐνέπαιξαν αὐτῷ λέγοντες· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/029.yaml
  text: And after weaving a crown of thorns[a], they put it on his head, and a reed in his right hand; and kneeling before him, they mocked him, saying, “Hail, King of the Jews!”
translation:
  language: pt
  text: 'Depois de trançarem uma coroa de espinhos, puseram-na na cabeça dele e colocaram uma cana em sua mão direita. Então, ajoelharam-se diante dele e zombaram dele, dizendo: “Salve, rei dos judeus!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rei dos judeanos”. O grego Ἰουδαίων pode se referir aos judeanos ou aos judeus; aqui aparece no título régio usado para zombar de Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλέξαντες
  choice: Depois de trançarem
  rationale: O particípio aoristo indica uma ação anterior ao verbo principal; a formulação expressa a sequência com naturalidade em português.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: uma coroa de espinhos
  rationale: “Coroa” comunica a paródia da realeza, enquanto “de espinhos” expressa de modo idiomático o material de que foi feita.
- source_word: ἐπέθηκαν ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: puseram-na na cabeça dele
  rationale: Tradução direta e corrente da ação, com o pronome retomando “coroa” sem ambiguidade.
- source_word: κάλαμον ἐν τῇ δεξιᾷ αὐτοῦ
  choice: colocaram uma cana em sua mão direita
  rationale: “Cana” preserva o objeto concreto, provavelmente usado como cetro de escárnio, sem inserir essa interpretação no texto.
- source_word: γονυπετήσαντες ἔμπροσθεν αὐτοῦ
  choice: ajoelharam-se diante dele
  rationale: Reproduz a postura de falsa homenagem em português natural e digno.
- source_word: ἐνέπαιξαν αὐτῷ
  choice: zombaram
  rationale: Expressa a ação de escarnecer de Jesus; o complemento é recuperável pelo contexto e evita repetição pesada de “dele”.
- source_word: Χαῖρε
  choice: Salve
  rationale: Preserva a forma solene de saudação e sua ironia na aclamação régia simulada.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: rei dos judeus
  rationale: É a forma mais natural e reconhecível para o título acusatório e zombeteiro no relato da paixão, embora o gentílico grego também possa ser entendido como “judeanos” em certos contextos.
theological_decisions:
- issue: Preservação da ironia na aclamação régia
  choice: “Salve, rei dos judeus!”
  alternative: “Saudações, rei dos judeus!”
  rationale: “Salve” mantém o tom cerimonial da homenagem fingida sem explicar ou enfraquecer a ironia dos soldados.
- issue: Sentido de Ἰουδαίων no título
  choice: “judeus”
  alternative: “judeanos”
  rationale: No contexto da paixão, a expressão funciona como título régio e acusatório de alcance etnorreligioso. A alternativa geográfica continua lexicalmente possível e é registrada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O registro narrativo é digno e claro; “Salve” conserva a solenidade irônica da saudação. A divisão em duas frases evita uma sequência excessivamente longa sem alterar as relações entre as ações.
