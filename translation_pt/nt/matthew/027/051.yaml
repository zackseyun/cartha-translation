source:
  edition: SBLGNT
  text: καὶ ἰδοὺ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη ⸂ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο⸃, καὶ ἡ γῆ ἐσείσθη, καὶ αἱ πέτραι ἐσχίσθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/051.yaml
  text: And behold[a], the curtain of the temple was torn in two from top to bottom, and the earth shook, and the rocks were split.
translation:
  language: pt
  text: E eis que o véu do santuário[a] se rasgou de alto a baixo, em dois; a terra tremeu, e as rochas se partiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a cortina do templo”. O termo grego pode designar o véu interior do santuário; “santuário” reflete o sentido mais específico que ναός pode ter neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Preserva o marcador de atenção súbita e a ênfase dramática, em linguagem solene e ainda corrente no registro bíblico português.
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: véu do santuário
  rationale: καταπέτασμα designa a cortina ou o véu, e ναός aponta mais especificamente para o santuário do que para todo o complexo do templo. A expressão é natural e precisa em português.
- source_word: ἐσχίσθη
  choice: se rasgou
  rationale: Expressão idiomática para tecido que conserva a força eventiva do aoristo passivo sem declarar um agente.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: de alto a baixo
  rationale: Equivalente português natural que mantém a direção enfaticamente indicada pelo grego.
- source_word: εἰς δύο
  choice: em dois
  rationale: Construção idiomática em português após 'se rasgou'.
- source_word: ἡ γῆ
  choice: a terra
  rationale: Mantém a amplitude possível do termo no contexto dos sinais que acompanham a morte de Jesus, sem restringi-lo a 'solo' ou 'região'.
- source_word: ἐσείσθη
  choice: tremeu
  rationale: Forma natural em português para descrever o abalo da terra, embora o verbo grego tenha forma passiva.
- source_word: αἱ πέτραι ἐσχίσθησαν
  choice: as rochas se partiram
  rationale: '''Rochas'' comunica massas pétreas, e ''se partiram'' é idiomático em português, ao mesmo tempo que reflete a repetição grega da raiz σχίζω sem exigir a mesma escolha usada para tecido.'
theological_decisions:
- issue: Natureza do sinal no santuário
  choice: Relatar diretamente o rompimento do véu, sem explicar seu significado teológico no texto.
  alternative: Acrescentar uma interpretação como abertura do acesso a Deus ou juízo sobre o sistema do templo.
  rationale: O versículo narra o acontecimento e os sinais associados, mas não explicita seu significado; a tradução deve preservar essa tensão e deixar a interpretação para o contexto e a exposição.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Mantém-se 'e eis que' pela força dramática do original; o restante emprega sintaxe clara, digna e contemporânea.
