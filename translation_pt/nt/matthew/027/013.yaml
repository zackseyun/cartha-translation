lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca naturalmente a sequência narrativa e corresponde ao valor temporal do advérbio.
- source_word: λέγει
  choice: diz
  rationale: Preserva o presente histórico do grego e sua vivacidade narrativa, de modo natural em português.
- source_word: αὐτῷ
  choice: lhe
  rationale: Mantém a referência pronominal explícita sem substituir o pronome pelo nome de Jesus.
- source_word: ὁ Πιλᾶτος
  choice: Pilatos
  rationale: Em português, o nome próprio dispensa o artigo neste contexto.
- source_word: Οὐκ ἀκούεις
  choice: Você não ouve
  rationale: Conserva a forma de pergunta negativa e o sentido básico de ouvir.
- source_word: πόσα
  choice: quantas coisas
  rationale: Reproduz o neutro plural quantitativo sem explicitar interpretativamente 'acusações'.
- source_word: σου
  choice: contra você
  rationale: Com καταμαρτυρέω, o genitivo possui sentido adversativo, que o português expressa naturalmente com 'contra'.
- source_word: καταμαρτυροῦσιν
  choice: testemunham contra
  rationale: Mantém o sentido jurídico-forense de prestar testemunho contra alguém, sem reduzi-lo ao verbo mais interpretativo 'acusar'.
