base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/059.yaml
  text: And Joseph took the body and wrapped it in a clean linen cloth[b][a],
translation:
  language: pt
  text: E José pegou o corpo e o envolveu em um pano de linho limpo[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em uma mortalha limpa de linho». O termo grego pode designar um pano de linho usado no sepultamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: pegou
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal. Em narrativa, a coordenação «pegou... e envolveu» transmite essa sequência de modo natural.
- source_word: τὸ σῶμα
  choice: o corpo
  rationale: Reproduz diretamente o substantivo com artigo, sem acrescentar um possessivo ausente do grego; pelo contexto, trata-se do corpo de Jesus.
- source_word: ἐνετύλιξεν
  choice: envolveu
  rationale: O verbo ἐντυλίσσω significa envolver ou enrolar em algo; «envolveu» é natural e adequado ao contexto de sepultamento.
- source_word: αὐτό
  choice: o
  rationale: O pronome grego é neutro singular e retoma gramaticalmente σῶμα, «corpo». Em português, o pronome oblíquo assume o gênero masculino de «corpo».
- source_word: σινδόνι
  choice: em um pano de linho
  rationale: σινδών designa um tecido de linho e, neste contexto, pode ser especificamente uma mortalha. A formulação escolhida mantém o sentido básico sem impor a especificidade contextual.
- source_word: καθαρᾷ
  choice: limpo
  rationale: No contexto, καθαρός descreve naturalmente o pano como limpo; «puro» seria possível, mas menos idiomático.
- source_word: καὶ ... ὁ Ἰωσὴφ
  choice: E José
  rationale: «E» preserva a ligação narrativa simples expressa por καί sem explicitar uma relação temporal além do texto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. O pronome αὐτό não exige nota própria em português, pois «o» retoma gramaticalmente «corpo» sem criar a oposição entre «it» e «him» presente em inglês.
