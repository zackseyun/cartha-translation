  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ἐνάτην ὥραν ⸀ἀνεβόησεν ὁ Ἰησοῦς φωνῇ μεγάλῃ λέγων· ⸂Ἠλὶ ἠλὶ⸃ λεμὰ σαβαχθάνι; τοῦτ’ ἔστιν· Θεέ μου θεέ μου, ἱνατί με ἐγκατέλιπες;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/046.yaml
  text: About the ninth hour Jesus cried out with a loud voice[a], saying, “Eli, Eli, lema sabachthani?” that is, “My God, my God[b], why have you forsaken me?”
translation:
  language: pt
  text: 'Por volta da hora nona, Jesus clamou em alta voz[a]: “Eli, Eli, lemá sabactâni?”, isto é: “Meu Deus, meu Deus[b], por que me abandonaste?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras fazem eco ao Salmo 22:1.
    reason: cross_reference
  - marker: b
    text: 'Ou: “por que me desamparaste?”. O verbo grego está no aoristo; o pretérito perfeito em português expressa naturalmente a pergunta sobre o abandono sofrido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἐνάτην ὥραν
  choice: Por volta da hora nona
  rationale: περί com acusativo temporal indica aproximação. A formulação preserva o modo antigo de contar as horas sem inserir um marcador discursivo forte para δέ.
- source_word: ἀνεβόησεν ... φωνῇ μεγάλῃ
  choice: clamou em alta voz
  rationale: Reproduz tanto a ideia de um clamor intenso quanto a expressão concreta de volume, em registro solene e natural.
- source_word: Ἠλὶ ἠλὶ λεμὰ σαβαχθάνι
  choice: Eli, Eli, lemá sabactâni?
  rationale: Mantém na linha principal as palavras semíticas preservadas por Mateus, com transliteração legível em português, antes da explicação oferecida pelo próprio texto.
- source_word: τοῦτ’ ἔστιν
  choice: isto é
  rationale: Introduz de modo conciso a tradução explicativa dada no texto grego.
- source_word: Θεέ μου θεέ μου
  choice: Meu Deus, meu Deus
  rationale: Preserva o vocativo repetido e sua ressonância com o Salmo 22:1.
- source_word: ἱνατί με ἐγκατέλιπες
  choice: por que me abandonaste?
  rationale: O pretérito perfeito traduz naturalmente o aoristo grego em português; “abandonaste” comunica com clareza e solenidade o sentido de ἐγκαταλείπω.
theological_decisions:
- issue: Relação do clamor de Jesus com o Salmo 22:1
  choice: Traduzir como clamor real de abandono, preservando o eco do salmo e sem explicar a tensão teológica.
  alternative: Parafrasear o clamor para atenuar a ideia de abandono ou tratá-lo apenas como citação alusiva.
  rationale: O grego apresenta diretamente o clamor e sua tradução, sem qualificação interpretativa. A redação conserva tanto sua força experiencial quanto a ressonância do salmo.
- issue: Manutenção do clamor semítico no texto principal
  choice: Conservar as palavras transliteradas, seguidas da tradução fornecida por Mateus.
  alternative: Apresentar apenas o sentido em português.
  rationale: Mateus registra primeiro o clamor semítico e depois o explica; manter ambos preserva a forma narrativa e ajuda a compreender a reação dos presentes no contexto imediato.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Hora nona” preserva a referência histórica; “clamou em alta voz” mantém a concretude do grego. A transliteração semítica recebe acentos para orientar a leitura em português.
