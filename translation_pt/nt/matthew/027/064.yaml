id: MAT.27.64
reference: Matthew 27:64
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κέλευσον οὖν ἀσφαλισθῆναι τὸν τάφον ἕως τῆς τρίτης ἡμέρας, μήποτε ἐλθόντες οἱ μαθηταὶ ⸀αὐτοῦ κλέψωσιν αὐτὸν καὶ εἴπωσιν τῷ λαῷ· Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἔσται ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/064.yaml
  text: Therefore[a], order the tomb to be secured until the third day, lest his disciples come and steal him and say to the people[b], ‘He has been raised from the dead,’ and the last deception will be worse than the first.
translation:
  language: pt
  text: 'Portanto, ordena que o túmulo seja protegido até o terceiro dia, para que os discípulos dele não venham[a], o roubem e digam ao povo: “Ele foi ressuscitado dentre os mortos”[b]; e o último engano será pior que o primeiro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos acrescentam “à noite” depois de “venham”: “para que os discípulos dele não venham à noite e o roubem”. Aqui se segue a forma mais curta do texto.'
    reason: textual_variant
  - marker: b
    text: O verbo grego está na voz passiva; também pode ser entendido como “Ele foi ressuscitado dentre os mortos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κέλευσον
  choice: ordena
  rationale: O imperativo aoristo pede uma providência oficial e decisiva de Pilatos; “ordena” é direto, natural e preserva sua autoridade.
- source_word: οὖν
  choice: portanto
  rationale: Mantém a relação de inferência com o pedido fundamentado no versículo anterior.
- source_word: ἀσφαλισθῆναι
  choice: seja mantido em segurança
  rationale: Preserva a forma passiva e a ideia ampla de tornar o túmulo seguro, sem limitar o meio à presença de guardas.
- source_word: ἕως τῆς τρίτης ἡμέρας
  choice: até o terceiro dia
  rationale: Expressão temporal natural que mantém a ligação verbal com a predição da ressurreição.
- source_word: μήποτε
  choice: para que ... não
  rationale: Expressa a possibilidade temida que a medida preventiva procura evitar, em português atual e natural.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: os discípulos dele
  rationale: Evita a possível ambiguidade de “seus discípulos”, que em português poderia apontar para Pilatos, e não acrescenta o nome de Jesus onde o grego usa pronome.
- source_word: κλέψωσιν αὐτόν
  choice: o roubem
  rationale: Mantém o pronome pessoal do grego, que se refere a Jesus, sem substituí-lo explicitamente por “o corpo”.
- source_word: Ἠγέρθη
  choice: foi ressuscitado
  rationale: Conserva a voz passiva do aoristo grego e não explicita quem realizou a ação.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: dentre os mortos
  rationale: Representa naturalmente a expressão plural grega no contexto da ressurreição.
- source_word: ἡ ἐσχάτη πλάνη
  choice: o último engano
  rationale: Mantém a avaliação acusatória dos interlocutores e a comparação explícita com o primeiro engano.
theological_decisions:
- issue: Voz da afirmação sobre a ressurreição
  choice: Ele foi ressuscitado dentre os mortos
  alternative: Ele ressuscitou dentre os mortos
  rationale: A tradução conserva a voz passiva de Ἠγέρθη, preservando a formulação teologicamente significativa sem identificar expressamente o agente.
- issue: Referência ao objeto do roubo
  choice: o roubem
  alternative: roubem o corpo
  rationale: O grego diz literalmente “o roubem”, referindo-se pessoalmente a Jesus; explicitar “o corpo” esclareceria a situação, mas achataria a forma intencional do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “os discípulos dele” foi preferida para evitar a ambiguidade referencial de “seus discípulos”; a passiva “foi ressuscitado” preserva a forma do grego.
