id: MAT.27.3
reference: Matthew 27:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τότε ἰδὼν Ἰούδας ὁ ⸀παραδιδοὺς αὐτὸν ὅτι κατεκρίθη μεταμεληθεὶς ⸀ἔστρεψεν τὰ τριάκοντα ἀργύρια τοῖς ἀρχιερεῦσιν ⸀καὶ πρεσβυτέροις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: pt
  text: Então Judas, que o havia traído, ao ver que Jesus tinha sido condenado, sentiu remorso e devolveu as trinta moedas de prata aos chefes dos sacerdotes e aos anciãos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca naturalmente a sequência narrativa e corresponde ao valor temporal do termo grego.
- source_word: ἰδὼν
  choice: ao ver
  rationale: Expressa de modo natural em português o valor temporal do particípio aoristo.
- source_word: Ἰούδας
  choice: Judas
  rationale: Forma tradicional e corrente do nome em português.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: que o havia traído
  rationale: A oração relativa identifica Judas por seu papel; o mais-que-perfeito composto situa a traição antes deste momento narrativo. 'Traído' comunica o sentido contextual de παραδίδωμι.
- source_word: ὅτι κατεκρίθη
  choice: que Jesus tinha sido condenado
  rationale: A voz passiva é preservada. A explicitação de 'Jesus' elimina a possível ambiguidade pronominal em português sem alterar o referente claro no contexto.
- source_word: μεταμεληθεὶς
  choice: sentiu remorso
  rationale: Comunica pesar moral sem afirmar necessariamente o sentido teológico mais pleno que 'arrependeu-se' pode sugerir.
- source_word: ἔστρεψεν
  choice: devolveu
  rationale: No contexto de dinheiro entregue aos líderes, o verbo tem naturalmente o sentido de devolver.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: as trinta moedas de prata
  rationale: Forma clara e atual para peças monetárias de prata, sem especificar uma denominação que o grego não informa.
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: aos chefes dos sacerdotes e aos anciãos
  rationale: Designa de modo compreensível os dois grupos de liderança judaica mencionados no texto.
theological_decisions:
- issue: Sentido de μεταμεληθεὶς na reação de Judas
  choice: sentiu remorso
  alternative: arrependeu-se; mudou de ideia
  rationale: O verbo μεταμέλομαι indica pesar ou remorso e não exige uma afirmação sobre arrependimento espiritual pleno. A tradução preserva a força moral e emocional sem resolver uma questão doutrinária além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi desdobrada de forma natural, preservando a sequência e as relações do grego.
