  text: λέγων· Ἥμαρτον παραδοὺς αἷμα ⸀ἀθῷον. οἱ δὲ εἶπαν· Τί πρὸς ἡμᾶς; σὺ ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/004.yaml
  text: saying, “I have sinned by betraying innocent blood.” But they said, “What is that to us? You will see to it.”
translation:
  language: pt
  text: 'dizendo: “Pequei por ter traído sangue inocente.”[a] Mas eles disseram: “Que temos nós com isso? Cuide você disso.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “tendo traído sangue inocente”.
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente, “você verá”; aqui, uma maneira brusca de dizer: “Isso é responsabilidade sua”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἥμαρτον
  choice: Pequei
  rationale: O aoristo indicativo expressa diretamente a confissão de um ato cometido; o pretérito perfeito simples é natural e preciso em português.
- source_word: παραδοὺς
  choice: traindo
  rationale: O particípio aoristo explica em que consistiu o pecado. No contexto da ação de Judas, “traindo” comunica melhor a entrega desleal do que o literal “entregando”.
- source_word: αἷμα ἀθῷον
  choice: sangue inocente
  rationale: Mantém a expressão compacta do grego, sua ressonância bíblica e a referência implícita, sem acrescentar “Jesus” nem “um inocente”.
- source_word: Τί πρὸς ἡμᾶς;
  choice: Que temos nós com isso?
  rationale: Expressão portuguesa natural que reproduz a recusa brusca de interesse ou responsabilidade presente no idioma grego.
- source_word: σὺ ὄψῃ
  choice: Cuide você disso
  rationale: 'O futuro médio tem aqui força idiomática de incumbência e despedida: o assunto fica sob a responsabilidade do interlocutor. A formulação conserva a ênfase em “você” e soa natural em português.'
theological_decisions:
- issue: Explicitar que Judas se refere a Jesus
  choice: Manter “sangue inocente” sem explicitar o referente
  alternative: o sangue de um inocente / o sangue de Jesus
  rationale: O grego deixa o referente implícito. A tradução preserva tanto a forma da expressão quanto sua força jurídico-moral, sem acrescentar uma identificação não formulada no versículo.
- issue: Força de σὺ ὄψῃ
  choice: Cuide você disso
  alternative: Você verá / Isso é problema seu
  rationale: A frase funciona como rejeição de responsabilidade. “Cuide você disso” preserva a ambiguidade idiomática melhor do que uma previsão literal, sem recorrer ao tom mais coloquial de “Isso é problema seu”.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A fala dos líderes mantém seu tom brusco sem se tornar excessivamente coloquial.
