source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν χλαμύδα καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ καὶ ἀπήγαγον αὐτὸν εἰς τὸ σταυρῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/031.yaml
  text: And when they had mocked him[a], they stripped the cloak off him and put his own clothes on him, and led him away to crucify him.
translation:
  language: pt
  text: Depois de zombarem dele, tiraram-lhe o manto[a], vestiram-no com as suas próprias roupas e levaram-no para o crucificarem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «capa». O grego χλαμύς designa uma capa ou manto exterior, muitas vezes uma veste externa; neste contexto, é a peça usada para zombar de Jesus como rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: zombarem
  rationale: O verbo denota escárnio e ridicularização hostil; “zombar” conserva essa força e soa natural em português atual.
- source_word: χλαμύδα
  choice: o manto
  rationale: χλαμύς designa uma capa ou manto exterior, muitas vezes de caráter militar ou oficial. “Manto” é claro no contexto e não transforma explicitamente a peça numa veste régia.
- source_word: ἐξέδυσαν αὐτὸν τὴν χλαμύδα
  choice: tiraram-lhe o manto
  rationale: A expressão indica que removeram dele a peça de roupa. Embora ἐκδύω possa ter a força de “despir”, esta formulação idiomática deixa claro o objeto removido sem sugerir necessariamente nudez total.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ
  choice: vestiram-no com suas próprias roupas
  rationale: Expressa naturalmente tanto a ação de vestir quanto o possessivo αὐτοῦ, ressaltando o contraste com o manto de escárnio que acabara de ser retirado.
- source_word: ἱμάτια
  choice: roupas
  rationale: É um equivalente moderno, amplo e natural para o plural que designa as peças de vestuário de Jesus.
- source_word: ἀπήγαγον
  choice: o levaram
  rationale: No contexto, indica que conduziram Jesus dali sob custódia; “levaram” é direto e natural em português.
- source_word: εἰς τὸ σταυρῶσαι
  choice: para ser crucificado
  rationale: A construção com εἰς e infinitivo articular expressa finalidade. A voz passiva em português é idiomática e mantém Jesus como objeto da ação, conforme o grego.
