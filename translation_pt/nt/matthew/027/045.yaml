  text: Ἀπὸ δὲ ἕκτης ὥρας σκότος ἐγένετο ἐπὶ πᾶσαν τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/045.yaml
  text: From the sixth hour darkness came over all the land until the ninth hour[a][b].
translation:
  language: pt
  text: Desde a sexta hora, houve trevas sobre toda a terra até a nona hora.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A sexta hora corresponde aproximadamente ao meio-dia, e a nona hora, aproximadamente às três da tarde.
    reason: cultural_note
  - marker: b
    text: 'Ou: “sobre toda a região”. A palavra grega pode significar tanto “terra” quanto “região”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ
  choice: Desde
  rationale: ἀπό marca o ponto inicial. Em português, «desde» introduz naturalmente a extensão temporal até a hora nona; δέ é uma conexão leve que não exige aqui uma conjunção explícita.
- source_word: ἕκτης ὥρας
  choice: a hora sexta
  rationale: Preserva no texto principal a forma antiga de indicar as horas. A equivalência aproximada moderna é explicada em nota.
- source_word: σκότος
  choice: trevas
  rationale: Expressa a escuridão literal com a força solene adequada ao relato, em linguagem bíblica ainda clara para leitores modernos.
- source_word: ἐγένετο
  choice: houve
  rationale: Neste contexto, γίνομαι indica o surgimento de uma condição. «Houve trevas» é natural e direto em português.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: sobre toda a terra
  rationale: γῆ pode designar tanto uma terra ou região quanto a terra em sentido mais amplo. A redação portuguesa permanece lexicalmente aberta, e a alternativa interpretativa é explicitada em nota.
- source_word: ἕως ὥρας ἐνάτης
  choice: até a hora nona
  rationale: Mantém a expressão horária da fonte, deixando sua equivalência moderna aproximada para a nota.
theological_decisions:
- issue: Alcance de γῆ no relato das trevas
  choice: terra, com ambiguidade preservada
  alternative: região ou país; mundo inteiro
  rationale: O substantivo grego é semanticamente amplo. «Toda a terra» permite a leitura territorial ou cósmica sem definir silenciosamente a extensão do fenômeno; a nota torna explícita essa possibilidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. As expressões antigas de horário foram preservadas no texto e esclarecidas em nota; a ambiguidade de γῆ foi mantida.
