source:
  edition: SBLGNT
  text: τότε ἐπληρώθη τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου λέγοντος· Καὶ ἔλαβον τὰ τριάκοντα ἀργύρια, τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/009.yaml
  text: Then what was spoken through Jeremiah the prophet was fulfilled[a], saying, ‘And they took the thirty pieces of silver, the price of the one who had been valued[b], whom they valued from among the sons of Israel,’
translation:
  language: pt
  text: 'Então se cumpriu o que foi dito por meio do profeta Jeremias[a], que disse: “E tomaram as trinta moedas de prata, o preço daquele que foi avaliado, a quem alguns dos filhos de Israel avaliaram[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mateus atribui esta palavra profética a Jeremias. A formulação tem seu paralelo mais próximo em Zacarias 11.12–13. Entre as explicações propostas estão uma citação composta, uma referência a uma coleção profética associada a Jeremias e um problema na transmissão do texto.
    reason: Preservar a dificuldade histórica e intertextual sem alterar a atribuição presente no texto grego.
  - marker: b
    text: 'Ou: “a quem avaliaram dentre os filhos de Israel”. A expressão grega é difícil; “alguns dos filhos de Israel” reflete um provável sentido partitivo.'
    reason: Registrar uma alternativa lexical legítima para a construção ambígua ἀπὸ υἱῶν Ἰσραήλ.
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca de modo conciso a sequência temporal da narrativa.
- source_word: ἐπληρώθη τὸ ῥηθὲν
  choice: se cumpriu o que foi dito
  rationale: Preserva a fórmula de cumprimento característica de Mateus e a voz passiva do grego em português natural.
- source_word: διὰ Ἰερεμίου τοῦ προφήτου
  choice: por meio do profeta Jeremias
  rationale: Expressa a mediação indicada por διά com genitivo sem reduzir Jeremias à mera fonte humana da fala profética.
- source_word: λέγοντος
  choice: que disse
  rationale: Introduz a citação de maneira idiomática e mantém a ligação gramatical com o profeta.
- source_word: ἔλαβον
  choice: tomaram
  rationale: Equivalente direto de λαμβάνω adequado ao contexto da quantia recebida e depois usada.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: as trinta moedas de prata
  rationale: Comunica claramente que ἀργύρια designa unidades monetárias de prata, não apenas o metal.
- source_word: τὴν τιμὴν τοῦ τετιμημένου
  choice: o preço daquele que foi avaliado
  rationale: Mantém tanto o sentido comercial de τιμή quanto a referência pessoal do particípio passivo, em formulação compreensível.
- source_word: ὃν ἐτιμήσαντο
  choice: a quem ... avaliaram
  rationale: Repete o campo lexical de τιμάω, como no grego, sem empregar uma construção excessivamente artificial em português.
- source_word: ἀπὸ υἱῶν Ἰσραήλ
  choice: alguns dos filhos de Israel
  rationale: Representa o provável sentido partitivo da expressão grega difícil e preserva a designação tradicional 'filhos de Israel'.
theological_decisions:
- issue: Atribuição da palavra profética a Jeremias, embora a formulação tenha seu paralelo mais próximo em Zacarias 11.12–13
  choice: Manter no texto principal a atribuição explícita ao profeta Jeremias.
  alternative: Substituir Jeremias por Zacarias ou harmonizar a atribuição no texto principal.
  rationale: O texto grego fornecido nomeia Jeremias. A tradução não deve corrigir nem resolver silenciosamente a tensão histórica e intertextual.
- issue: Sentido da expressão difícil ἀπὸ υἱῶν Ἰσραήλ
  choice: 'Entender a expressão em sentido partitivo: ''alguns dos filhos de Israel''.'
  alternative: 'Traduzir literalmente ''dentre os filhos de Israel'' ou entendê-la como indicação de agente: ''pelos filhos de Israel''.'
  rationale: A leitura partitiva produz uma frase inteligível e é lexicalmente possível, mas a nota preserva a incerteza real do grego.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A ordem e as repetições centrais do grego foram preservadas sempre que não tornavam a frase opaca. A vírgula final indica que a citação continua no versículo seguinte.
