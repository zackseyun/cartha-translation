  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης ἦλθεν ἄνθρωπος πλούσιος ἀπὸ Ἁριμαθαίας, τοὔνομα Ἰωσήφ, ὃς καὶ αὐτὸς ⸀ἐμαθητεύθη τῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/057.yaml
  text: When evening had come[a], a rich man from Arimathea came, named Joseph[b], who himself also had become a disciple of Jesus.
translation:
  language: pt
  text: Ao cair da tarde, chegou um homem rico de Arimateia, chamado José, que ele também havia se tornado discípulo de Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que também havia sido feito discípulo por Jesus”; ou: “que também era discípulo de Jesus”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Ao cair da tarde
  rationale: O genitivo absoluto marca uma transição temporal. A expressão é natural em português e comunica o início da tarde/noite sem acrescentar um advérbio temporal inexistente no grego.
- source_word: ἦλθεν
  choice: chegou
  rationale: Equivalente narrativo natural do aoristo de ἔρχομαι neste contexto.
- source_word: ἄνθρωπος πλούσιος
  choice: um homem rico
  rationale: Tradução direta, corrente e fiel à combinação substantivo-adjetivo.
- source_word: ἀπὸ Ἁριμαθαίας
  choice: de Arimateia
  rationale: Comunica de modo idiomático a procedência indicada por ἀπό.
- source_word: τοὔνομα Ἰωσήφ
  choice: chamado José
  rationale: Forma appositiva concisa e natural para identificar o homem pelo nome.
- source_word: ὃς καὶ αὐτὸς
  choice: que também
  rationale: O advérbio preserva a ideia inclusiva de καί, isto é, que José se contava entre outros discípulos. O valor enfático de αὐτός fica implícito para evitar uma formulação artificial em português.
- source_word: ἐμαθητεύθη τῷ Ἰησοῦ
  choice: havia se tornado discípulo de Jesus
  rationale: Expressa o sentido passivo/resultativo de μαθητεύω e a relação indicada pelo dativo, sem afirmar além do texto o modo específico pelo qual José foi feito discípulo.
theological_decisions:
- issue: Sentido de ἐμαθητεύθη em relação a Jesus
  choice: havia se tornado discípulo de Jesus
  alternative: havia sido feito discípulo por Jesus; era também discípulo de Jesus
  rationale: O passivo pode destacar tanto a entrada no discipulado quanto o fato de ter sido feito discípulo. A tradução escolhida identifica José como alguém que passara a pertencer aos discípulos de Jesus, sem especificar indevidamente o agente ou o processo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção evita literalismo artificial e mantém em nota a ambiguidade do passivo ἐμαθητεύθη.
