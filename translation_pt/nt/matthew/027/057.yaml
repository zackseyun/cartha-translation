  source_fidelity: A tradução comunica adequadamente a circunstância temporal, a chegada de José, sua riqueza, sua procedência e seu discipulado. Contudo, «que também havia se tornado» pode fazer «também» modificar principalmente o ato de tornar-se, enquanto ὃς καὶ αὐτός enfatiza que José, ele também, se incluía entre os discípulos. Uma pequena reordenação torna essa ênfase explícita sem artificialidade.
  naturalness: «Ao cair da tarde», «chegou», «um homem rico de Arimateia» e «chamado José» são naturais e adequados ao registro narrativo. «Que ele também havia se tornado discípulo de Jesus» é claro para leitores brasileiros e internacionais.
  terminology: «Discípulo de Jesus» preserva apropriadamente a relação expressa por τῷ Ἰησοῦ. A nota mantém, sem impor uma interpretação, as possibilidades de um passivo mais literal e de uma formulação de estado.
