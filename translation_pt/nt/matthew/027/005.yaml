  text: καὶ ῥίψας τὰ ἀργύρια ⸂εἰς τὸν ναὸν⸃ ἀνεχώρησεν, καὶ ἀπελθὼν ἀπήγξατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/005.yaml
  text: And throwing the silver into the temple[a], he departed[b], and went and hanged himself.
translation:
  language: pt
  text: E, depois de atirar as moedas de prata para dentro do templo[a], retirou-se e foi enforcar-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para dentro do santuário». O grego usa naós, termo que muitas vezes se refere especificamente ao santuário, e não a todo o complexo do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίψας
  choice: jogando
  rationale: O particípio aoristo indica uma ação anterior ou concomitante ao verbo principal. A forma gerundiva preserva a construção compacta e a sequência fica clara pelo contexto.
- source_word: τὰ ἀργύρια
  choice: as moedas de prata
  rationale: Embora a expressão seja literalmente «a prata», no contexto designa as peças monetárias devolvidas. «Moedas de prata» é natural e concreto em português, sem explicitar novamente a quantidade.
- source_word: εἰς τὸν ναὸν
  choice: para dentro do templo
  rationale: A preposição εἰς expressa movimento para o interior. «Templo» favorece a leitura corrente, enquanto a nota registra que ναός pode apontar mais especificamente para o santuário.
- source_word: ἀνεχώρησεν
  choice: ele se retirou
  rationale: O verbo comunica afastamento ou retirada. «Se retirou» mantém essa nuance e combina com o tom solene da narrativa.
- source_word: ἀπελθὼν
  choice: depois foi
  rationale: Preserva o segundo movimento sem produzir a redundância pouco natural de «retirou-se e foi embora». «Depois» torna explícita a sequência indicada pelo particípio.
- source_word: ἀπήγξατο
  choice: se enforcou
  rationale: A forma média indica ação dirigida contra si mesmo; neste contexto, «se enforcou» é a tradução direta, clara e tradicional.
theological_decisions:
- issue: Sentido específico de ναός em contraste com o complexo geral do templo
  choice: «templo» no texto principal, com a nuance de «santuário» em nota
  alternative: «santuário» ou «santuário do templo»
  rationale: ναός frequentemente designa o edifício sagrado central, não todo o complexo. «Templo» é mais imediatamente compreensível, e a nota conserva a precisão arquitetônica sem decidir além da evidência lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pontuação separa os dois movimentos narrativos sem apagar a distinção entre ἀνεχώρησεν e ἀπελθών. Não se incluiu a nota inglesa [b], pois ela registra sobretudo uma alternativa estilística própria do inglês, sem diferença substantiva a preservar em português.
