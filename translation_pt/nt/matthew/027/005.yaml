  rationale: A revisão substitui o gerúndio por «depois de atirar», para refletir melhor a anterioridade usual do particípio aoristo, e ajusta a sintaxe para maior fluidez. Mantêm-se «moedas de prata», o movimento «para dentro» e a nota sobre ναός/santuário. «Retirou-se e foi enforcar-se» conserva os dois verbos de movimento sem redundância artificial.
