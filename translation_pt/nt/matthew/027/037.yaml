id: MAT.27.37
reference: Matthew 27:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπέθηκαν ἐπάνω τῆς κεφαλῆς αὐτοῦ τὴν αἰτίαν αὐτοῦ γεγραμμένην· Οὗτός ἐστιν Ἰησοῦς ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/037.yaml
  text: 'And they placed above his head the charge against him[a], written: “This is Jesus[b], the King of the Jews.”'
translation:
  language: pt
  text: 'E colocaram acima da cabeça dele a acusação contra ele[a], por escrito: “Este é Jesus, o Rei dos Judeus[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a acusação feita contra ele”. O termo grego tem aqui sentido judicial.
    reason: lexical_alternative
  - marker: b
    text: Ou “o Rei dos Judeanos”. O termo grego pode significar “judeus” ou “judeanos”, conforme o contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: colocaram
  rationale: O aoristo ativo de ἐπιτίθημι descreve o ato concreto de pôr a inscrição em determinado lugar; “colocaram” é natural e preciso em português.
- source_word: ἐπάνω τῆς κεφαλῆς αὐτοῦ
  choice: acima da cabeça dele
  rationale: ἐπάνω com genitivo indica posição acima de algo. A formulação evita sugerir que a inscrição foi posta diretamente sobre a cabeça.
- source_word: τὴν αἰτίαν αὐτοῦ
  choice: a acusação contra ele
  rationale: Neste contexto judicial, αἰτία designa a acusação ou imputação que fundamentava a execução. A expressão comunica esse sentido com clareza.
- source_word: γεγραμμένην
  choice: por escrito
  rationale: O particípio perfeito passivo de γράφω caracteriza a acusação como registrada em forma escrita; “por escrito” integra-se naturalmente à frase.
- source_word: Οὗτός ἐστιν
  choice: Este é
  rationale: Reproduz diretamente o demonstrativo seguido da cópula, mantendo a formulação enfática da inscrição.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Emprega a forma tradicional e corrente do nome em português.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: o Rei dos Judeus
  rationale: Mantém o artigo e apresenta βασιλεύς como título régio. “Judeus” é a tradução convencional e contextualmente adequada na fórmula política da acusação.
theological_decisions:
- issue: Formulação jurídica da inscrição da crucificação
  choice: a acusação contra ele
  alternative: a acusação dele; o motivo da condenação dele
  rationale: A redação preserva o sentido judicial de αἰτία sem acrescentar que a acusação era verdadeira nem explicitar uma condenação que o termo, isoladamente, não enuncia.
- issue: Sentido de Ἰουδαίων no título
  choice: Judeus
  alternative: judeanos
  rationale: Na inscrição régia da narrativa da paixão, “Judeus” conserva a referência tradicional ao povo sobre o qual Jesus supostamente reivindicaria reinar. A possibilidade geográfica ou regional de “judeanos” permanece registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Acima da cabeça dele” evita a ambiguidade física de “sobre a cabeça”, e “por escrito” produz uma construção idiomática sem perder a relação de γεγραμμένην com a acusação.
