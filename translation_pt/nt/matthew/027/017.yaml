  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: συνηγμένων οὖν αὐτῶν εἶπεν αὐτοῖς ὁ Πιλᾶτος· Τίνα θέλετε ἀπολύσω ὑμῖν, ⸂Ἰησοῦν τὸν⸃ Βαραββᾶν ἢ Ἰησοῦν τὸν λεγόμενον χριστόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/017.yaml
  text: 'So when they had gathered together[a], Pilate said to them, “Which one do you want me to release to you: Jesus Barabbas[b], or Jesus who is called Messiah?”'
translation:
  language: pt
  text: 'Assim, quando estavam reunidos, Pilatos lhes perguntou: “Qual dos dois vocês querem que eu solte: Jesus Barrabás[a] ou Jesus, chamado Messias[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem apenas “Barrabás”, em vez de “Jesus Barrabás”.
    reason: textual_variant
  - marker: b
    text: Ou “Cristo”. O título grego é Christos; aqui foi traduzido por “Messias” porque funciona como título.
    reason: alternative_reading
lexical_decisions:
- source_word: συνηγμένων οὖν αὐτῶν
  choice: Assim, quando estavam reunidos
  rationale: A construção absoluta tem valor temporal e apresenta a reunião como já ocorrida no momento da pergunta. “Assim” preserva a progressão narrativa de οὖν sem tornar a frase excessivamente formal.
- source_word: Τίνα θέλετε
  choice: Qual dos dois vocês querem
  rationale: O interrogativo introduz uma escolha entre duas pessoas identificadas. “Qual dos dois” explicita naturalmente essa alternativa binária em português.
- source_word: ἀπολύσω ὑμῖν
  choice: que eu solte
  rationale: No contexto judicial, ἀπολύω significa libertar ou soltar um preso. O destinatário já está claro em “lhes perguntou” e em “vocês”, de modo que repetir “para vocês” seria pesado em português.
- source_word: Ἰησοῦν τὸν Βαραββᾶν
  choice: Jesus Barrabás
  rationale: Segue a leitura impressa no SBLGNT, incluindo Ἰησοῦν, e conserva o contraste retórico entre dois homens chamados Jesus.
- source_word: Ἰησοῦν τὸν λεγόμενον χριστόν
  choice: Jesus, chamado Messias
  rationale: λεγόμενον significa “chamado”, sem a conotação depreciativa de “o suposto”. Aqui χριστός funciona claramente como título, por isso é traduzido por “Messias”.
theological_decisions:
- issue: Tradução de χριστός
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, χριστός é um título na expressão “chamado Messias”, não um elemento semelhante a sobrenome. “Messias” comunica em português o valor titular do termo grego e preserva a formulação sem afirmar nem negar a reivindicação.
- issue: Inclusão de “Jesus” antes de Barrabás
  choice: Jesus Barrabás no texto principal
  alternative: Barrabás
  rationale: A fonte grega fornecida inclui Ἰησοῦν. A tradução segue essa leitura, enquanto a variante sem “Jesus” é registrada em nota.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. Emprega “vocês” por naturalidade no discurso dirigido à multidão e evita construções excessivamente literais ou arcaicas.
