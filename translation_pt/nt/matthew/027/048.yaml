  text: καὶ εὐθέως δραμὼν εἷς ἐξ αὐτῶν καὶ λαβὼν σπόγγον πλήσας τε ὄξους καὶ περιθεὶς καλάμῳ ἐπότιζεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/048.yaml
  text: And immediately one of them ran[a], took a sponge, filled it with sour wine, put it on a reed[b], and gave him a drink.
translation:
  language: pt
  text: E imediatamente um deles correu, pegou uma esponja, encheu-a de vinho azedo[a], colocou-a numa cana e dava-lhe de beber.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vinagre”. O grego ὄξος pode designar vinho azedo ou vinagre de vinho.'
    reason: lexical_alternative
  - marker: b
    text: 'O verbo grego está no imperfeito e apresenta a ação como em curso; também pode sugerir: “tentava dar-lhe de beber”.'
    reason: aspectual_ambiguity
lexical_decisions:
- source_word: εὐθέως
  choice: imediatamente
  rationale: Expressa de modo claro e atual a prontidão da ação.
- source_word: δραμὼν
  choice: correu
  rationale: O particípio aoristo é vertido naturalmente como verbo finito numa sequência narrativa em português.
- source_word: εἷς ἐξ αὐτῶν
  choice: um deles
  rationale: Equivalente idiomático da expressão partitiva, preservando que uma só pessoa do grupo agiu.
- source_word: λαβὼν σπόγγον
  choice: pegou uma esponja
  rationale: Forma natural em português para a ação anterior às seguintes, sem uma construção participial pesada.
- source_word: πλήσας τε ὄξους
  choice: encheu-a de vinho azedo
  rationale: ὄξος designa vinho azedo ou avinagrado; 'vinho azedo' comunica melhor uma bebida ácida do que o moderno 'vinagre', geralmente entendido como condimento.
- source_word: περιθεὶς καλάμῳ
  choice: colocou-a numa cana
  rationale: Mantém o equivalente lexical direto de κάλαμος e expressa a colocação da esponja na cana.
- source_word: ἐπότιζεν αὐτόν
  choice: deu-lhe de beber
  rationale: Expressa idiomaticamente o sentido causativo de ποτίζω. O imperfeito grego pode apresentar a ação em curso ou tentada, nuance registrada em nota para não sobrecarregar o texto.
theological_decisions:
- issue: Natureza da bebida oferecida a Jesus
  choice: vinho azedo
  alternative: vinagre
  rationale: O grego ὄξος admite ambos os modos de descrição. 'Vinho azedo' evita a impressão moderna de vinagre culinário e preserva o caráter de bebida ácida.
- issue: Aspecto de ἐπότιζεν
  choice: deu-lhe de beber
  alternative: tentava dar-lhe de beber / ficou dando-lhe de beber
  rationale: O imperfeito apresenta a ação de modo não pontual, mas o contexto não determina por si só se ela foi repetida, prolongada ou apenas tentada; a tradução principal permanece natural e a ambiguidade é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A cadeia de particípios aoristos foi convertida numa sequência de verbos finitos. Os pronomes em 'encheu-a' e 'colocou-a' retomam 'esponja'; 'deu-lhe de beber' evita ambiguidade sobre o destinatário.
