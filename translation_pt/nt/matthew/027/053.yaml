id: MAT.27.53
reference: Matthew 27:53
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/053.yaml
  text: And coming out of the tombs after his resurrection[c][b][a], they entered the holy city and appeared to many.
translation:
  language: pt
  text: E, saindo dos túmulos depois da ressurreição dele, entraram na cidade santa[b] e apareceram a muitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “A cidade santa” refere-se a Jerusalém.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθόντες
  choice: saindo
  rationale: O particípio aoristo é expresso por uma oração subordinada natural em português, mantendo sua relação com o verbo principal sem tornar a frase excessivamente pesada.
- source_word: μνημείων
  choice: túmulos
  rationale: μνημεῖον designa aqui lugares de sepultamento; “túmulos” se ajusta ao contexto dos túmulos abertos no versículo anterior.
- source_word: μετὰ τὴν ἔγερσιν αὐτοῦ
  choice: depois da ressurreição dele
  rationale: μετά com acusativo tem sentido temporal. “Ressurreição” traduz naturalmente ἔγερσις, e “dele” preserva a referência pronominal ao antecedente contextual, Jesus.
- source_word: εἰσῆλθον
  choice: entraram
  rationale: Equivalente direto, conciso e natural do aoristo narrativo.
- source_word: τὴν ἁγίαν πόλιν
  choice: a cidade santa
  rationale: Preserva a expressão bíblica que designa Jerusalém sem substituir a formulação do texto por uma explicação.
- source_word: ἐνεφανίσθησαν
  choice: apareceram
  rationale: Neste contexto, a forma indica que se tornaram visíveis ou foram vistos; “apareceram” é natural e mantém o sentido.
- source_word: πολλοῖς
  choice: a muitos
  rationale: Mantém a expressão indefinida do dativo plural sem acrescentar “pessoas”, que está implícito.
theological_decisions:
- issue: Relação entre o particípio “saindo dos túmulos” e a expressão temporal “depois da ressurreição dele”
  choice: 'A expressão temporal permanece dentro da oração participial: “saindo dos túmulos depois da ressurreição dele”.'
  alternative: 'Entender que os túmulos foram abertos na morte de Jesus, mas que os santos somente saíram depois da ressurreição; ou reestruturar: “Depois da ressurreição dele, saíram dos túmulos, entraram...”'
  rationale: A ordem grega coloca μετὰ τὴν ἔγερσιν αὐτοῦ após ἐκ τῶν μνημείων e antes do verbo principal. A tradução conserva essa disposição e a tensão cronológica sem impor uma harmonização.
- issue: Referente de αὐτοῦ (“dele”)
  choice: Manter o pronome “dele” no texto principal.
  alternative: Explicitar “de Jesus”.
  rationale: O contexto identifica Jesus como referente, mas o grego usa pronome. A tradução preserva essa forma sem criar ambiguidade relevante em português.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção mantém de perto a ordem sintática grega. Emprega-se apenas a nota [b], pois as alternativas inglesas [a] e [c] tratam sobretudo de fluidez específica do inglês e não são necessárias para esclarecer esta formulação portuguesa.
