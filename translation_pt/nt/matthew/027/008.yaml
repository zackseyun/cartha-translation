lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Expressa de modo natural a relação de consequência com a explicação anterior sobre a compra e o nome do campo.
- source_word: ἐκλήθη
  choice: tem sido chamado
  rationale: O aoristo passivo indica que o campo recebeu esse nome; com “até hoje”, o perfeito composto comunica que a designação iniciada no passado continuava em uso.
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: aquele campo
  rationale: Preserva o sentido comum de ἀγρός e o valor demonstrativo de ἐκεῖνος, além de manter a repetição com o nome do lugar.
- source_word: Ἀγρὸς Αἵματος
  choice: Campo de Sangue
  rationale: Reproduz de maneira transparente a construção com genitivo e conserva a força narrativa do nome próprio.
- source_word: ἕως τῆς σήμερον
  choice: até hoje
  rationale: É uma expressão portuguesa corrente e concisa para indicar que o nome permanecia em uso até o tempo do autor.
