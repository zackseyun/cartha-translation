  text: καὶ τὰ μνημεῖα ἀνεῴχθησαν καὶ πολλὰ σώματα τῶν κεκοιμημένων ἁγίων ⸀ἠγέρθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/052.yaml
  text: And the tombs were opened[a], and many bodies of the saints who had fallen asleep were raised,
translation:
  language: pt
  text: E os túmulos foram abertos, e muitos corpos dos santos que tinham adormecido[a] foram levantados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tinham adormecido” é um eufemismo comum para “tinham morrido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: e
  rationale: Mantém a coordenação simples da narrativa sem acrescentar uma relação temporal mais específica.
- source_word: τὰ μνημεῖα
  choice: os túmulos
  rationale: μνημεῖον designa aqui lugares de sepultamento; “túmulos” é claro, natural e adequado ao contexto.
- source_word: ἀνεῴχθησαν
  choice: foram abertos
  rationale: Reproduz o aoristo passivo sem especificar quem os abriu nem por qual mecanismo.
- source_word: πολλὰ σώματα
  choice: muitos corpos
  rationale: Preserva o sentido simples e neutro de σῶμα, evitando o tom mais duro e interpretativo de “cadáveres”.
- source_word: τῶν κεκοιμημένων
  choice: que haviam adormecido
  rationale: Conserva o conhecido eufemismo para a morte e expressa a anterioridade indicada pelo particípio perfeito.
- source_word: ἁγίων
  choice: dos santos
  rationale: É a forma tradicional e ainda corrente para o substantivo ἅγιοι, sem definir além do texto a identidade dessas pessoas.
- source_word: ἠγέρθησαν
  choice: foram ressuscitados
  rationale: No contexto de corpos de pessoas mortas, esta é a expressão portuguesa mais clara e natural para o passivo de ἐγείρω; não determina se o acontecimento foi uma volta à vida mortal ou a ressurreição final.
theological_decisions:
- issue: Natureza do acontecimento expresso por ἠγέρθησαν
  choice: foram ressuscitados
  alternative: foram levantados
  rationale: “Foram ressuscitados” comunica naturalmente que os mortos receberam vida, como exige o contexto, mas não resolve a questão teológica sobre a natureza ou permanência dessa ressurreição. “Foram levantados” seria formalmente mais amplo, porém em português poderia sugerir apenas movimento corporal.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. Conserva a voz passiva e o eufemismo do grego; o marcador da nota foi colocado junto à expressão que ela explica.
