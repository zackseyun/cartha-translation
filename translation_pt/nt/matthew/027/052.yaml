review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente τὰ μνημεῖα, o aoristo passivo ἀνεῴχθησαν, πολλὰ σώματα e o eufemismo perfeito τῶν κεκοιμημένων. Contudo, omite a conjunção inicial καί e verte ἠγέρθησαν por “foram ressuscitados”, formulação mais específica do que o equivalente neutro “foram levantados” adotado na trilha de auditoria inglesa. A formulação revista preserva a passiva e não define além do texto a natureza precisa do levantamento.
  naturalness: “E os túmulos foram abertos” é português moderno e natural em narrativa solene. “Que tinham adormecido” é ligeiramente mais corrente do que “que haviam adormecido” neste uso, e a nota torna claro o sentido eufemístico. “Foram levantados” mantém uma construção um pouco mais formal, mas é compreensível no contexto e preserva com segurança a amplitude do grego.
  terminology: “Túmulos”, “corpos” e “santos” são adequados e consistentes. “Levantados” para ἠγέρθησαν evita impor “ressuscitados” como descrição técnica mais delimitada, sem negar que o contexto trate de mortos.
  issues:
