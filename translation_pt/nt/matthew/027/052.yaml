    issue: A conjunção inicial καί não foi traduzida.
    rationale: Embora o português por vezes omita uma conjunção inicial, a opção lexical declarada é “e”, e sua inclusão conserva a coordenação narrativa do texto-fonte.
  - severity: medium
    issue: “Foram ressuscitados” estreita o alcance de ἠγέρθησαν em relação à tradução neutra adotada na trilha inglesa.
    rationale: O passivo de ἐγείρω comporta a ideia de serem levantados dentre os mortos; “foram levantados” preserva essa referência contextual sem especificar o tipo ou a natureza definitiva do acontecimento.
  revised_text: E os túmulos foram abertos, e muitos corpos dos santos que tinham adormecido[a] foram levantados.
