  text: ἐν αἷς ἦν Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ἡ τοῦ Ἰακώβου καὶ ⸀Ἰωσὴφ μήτηρ καὶ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/056.yaml
  text: among whom were Mary Magdalene[a], and Mary the mother of James and Joseph, and the mother of the sons of Zebedee.
translation:
  language: pt
  text: entre as quais estavam Maria Madalena, Maria, mãe de Tiago e José[a], e a mãe dos filhos de Zebedeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “Josés” em vez de “José”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐν αἷς
  choice: entre as quais
  rationale: Retoma o grupo de mulheres do versículo anterior e expressa naturalmente, em português, que as mulheres nomeadas faziam parte dele.
- source_word: ἦν
  choice: estavam
  rationale: Embora a forma grega esteja no singular, ela introduz uma lista de mulheres; em português, a concordância plural é natural. “Estavam” também preserva o sentido contextual de presença no local.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Maria Madalena
  rationale: Forma tradicional, clara e corrente em português para o nome acompanhado do identificador geográfico.
- source_word: Μαρία ἡ τοῦ Ἰακώβου καὶ Ἰωσὴφ μήτηρ
  choice: Maria, mãe de Tiago e José
  rationale: A construção identifica Maria por seus filhos. A aposição com vírgula é natural em português e conserva essa relação sem acrescentar informação.
- source_word: Ἰάκωβος
  choice: Tiago
  rationale: Forma convencional do nome no Novo Testamento em português, adequada à identificação desta personagem.
- source_word: Ἰωσὴφ
  choice: José
  rationale: Corresponde à leitura Ἰωσὴφ do SBLGNT. A leitura variante é registrada em nota.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: a mãe dos filhos de Zebedeu
  rationale: Reproduz com clareza e proximidade formal a relação genitiva do grego.
- source_word: Ζεβεδαίου
  choice: Zebedeu
  rationale: Forma portuguesa estabelecida para o nome próprio Ζεβεδαῖος.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A estrutura mantém a ligação relativa com o versículo anterior e evita explicitar o nome da mãe dos filhos de Zebedeu, que o texto grego não fornece.
