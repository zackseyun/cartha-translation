lexical_decisions:
- source_word: σταυρώσαντες
  choice: depois de o crucificarem
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal. A formulação mantém com naturalidade a sequência temporal.
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ é um conectivo leve que dá continuidade à narrativa; “E” preserva esse fluxo sem acrescentar contraste indevido.
- source_word: διεμερίσαντο
  choice: dividiram
  rationale: O verbo descreve a divisão ou distribuição das peças de roupa; “dividiram” comunica diretamente a ação concreta.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: as roupas dele
  rationale: Ἱμάτια designa roupas ou vestes de modo amplo. “As roupas dele” é claro, atual e evita especificar indevidamente apenas vestes exteriores.
- source_word: βάλλοντες κλῆρον
  choice: lançando sortes
  rationale: A expressão descreve o procedimento usado na divisão. “Lançar sortes” é a expressão portuguesa estabelecida e preserva de perto a imagem do grego, cujo κλῆρον está no singular coletivo/idiomático.
theological_decisions:
- issue: Relação do particípio βάλλοντες κλῆρον com o verbo principal διεμερίσαντο
  choice: “dividiram as roupas dele, lançando sortes”
  alternative: “dividiram as roupas dele por meio de sorteio”
  rationale: O particípio explica como a divisão foi realizada. A construção com vírgula preserva a forma participial e alguma abertura sintática do grego, sem obscurecer a relação instrumental.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Roupas” foi preferido a “vestes” por ser mais corrente, enquanto “lançando sortes” conserva a expressão bíblica tradicional sem soar arcaica.
