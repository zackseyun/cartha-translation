  text: And after they crucified him[a], they divided his garments by casting lots.
translation:
  language: pt
  text: E, depois de o crucificarem[a], dividiram as roupas dele, lançando sortes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “E, tendo-o crucificado, dividiram as roupas dele, lançando sortes.”'
