  text: οἱ δὲ πορευθέντες ἠσφαλίσαντο τὸν τάφον σφραγίσαντες τὸν λίθον μετὰ τῆς κουστωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/066.yaml
  text: So they went and secured the tomb by sealing the stone with the guard.
translation:
  language: pt
  text: Assim, eles foram e deixaram o túmulo seguro, selando a pedra com a guarda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na presença da guarda”; possivelmente, “selando a pedra e colocando uma guarda”. A expressão grega é concisa e pode indicar acompanhamento, sem descrever necessariamente uma segunda ação distinta.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πορευθέντες
  choice: Assim, eles foram
  rationale: O particípio aoristo funciona como ação concomitante à principal e pode ser expresso naturalmente por um verbo finito. δέ dá continuidade à narrativa; “Assim” liga o ato deles à ordem recebida sem impor contraste.
- source_word: ἠσφαλίσαντο
  choice: tornaram o túmulo seguro
  rationale: ἀσφαλίζω significa tornar seguro, proteger contra violação ou interferência. A formulação é clara em português e mantém a ideia de medidas concretas de segurança.
- source_word: τὸν τάφον
  choice: o túmulo
  rationale: τάφος designa aqui o lugar onde Jesus foi sepultado; “túmulo” é a expressão corrente e adequada ao contexto.
- source_word: σφραγίσαντες
  choice: selando
  rationale: O particípio aoristo explica o meio ou a ação associada pela qual o túmulo foi protegido. “Selando” preserva a construção participial e sua relação não totalmente especificada com o verbo principal.
- source_word: τὸν λίθον
  choice: a pedra
  rationale: λίθος é a pedra colocada na entrada do túmulo. “A pedra” traduz diretamente o texto sem acrescentar “da entrada”, embora isso esteja implícito no contexto.
- source_word: μετὰ τῆς κουστωδίας
  choice: com a guarda
  rationale: κουστωδία, empréstimo do latim, refere-se a um destacamento de guarda. μετά com genitivo indica normalmente companhia ou associação; “com a guarda” mantém de forma concisa a participação ou presença da guarda sem determinar uma sequência adicional de ações.
theological_decisions:
- issue: Relação de μετὰ τῆς κουστωδίας com o ato de tornar o túmulo seguro
  choice: A pedra foi selada com a guarda presente ou envolvida.
  alternative: Eles selaram a pedra e colocaram uma guarda; ou selaram a pedra na presença da guarda.
  rationale: A frase grega é concisa e não explicita se a guarda foi colocada como uma ação separada, se participou do selamento ou se apenas estava presente. O texto principal conserva essa ambiguidade, e a nota registra as possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Tornaram o túmulo seguro” preserva o sentido concreto do verbo grego; “com a guarda” conserva a concisão e a ambiguidade sintática do original.
