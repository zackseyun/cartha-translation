lexical_decisions:
- source_word: ᾔδει
  choice: sabia
  rationale: Expressa diretamente o conhecimento de Pilatos e mantém uma formulação natural em português.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior, preservando a conexão lógica do grego.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo daquilo que Pilatos sabia.
- source_word: διὰ φθόνον
  choice: por inveja
  rationale: διά com acusativo indica causa, e φθόνος designa inveja ou ressentimento diante da posição ou do êxito de outra pessoa. A expressão é concisa e natural.
- source_word: παρέδωκαν
  choice: haviam entregado
  rationale: Indica que eles entregaram Jesus às autoridades; o mais-que-perfeito composto explicita naturalmente em português que essa ação antecedeu o conhecimento descrito.
- source_word: αὐτόν
  choice: o
  rationale: Pronome objeto que se refere a Jesus.
theological_decisions:
- issue: Motivação dos acusadores de Jesus
  choice: Pilatos reconheceu a inveja como motivo para terem entregado Jesus.
  alternative: Pilatos reconheceu o ciúme como motivo.
  rationale: “Inveja” preserva a força moral e psicológica de φθόνος sem acrescentar uma explicação teológica ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Pois” conserva a função explicativa de γάρ; “haviam entregado” mantém clara a anterioridade da ação.
