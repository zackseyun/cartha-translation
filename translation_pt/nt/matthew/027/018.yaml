  text: For he knew that they had handed him over because of envy[a].
translation:
  language: pt
  text: Pois ele sabia que o tinham entregue por inveja[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “movidos pela inveja” ou “por ciúme”.
