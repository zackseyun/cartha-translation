  text: λέγει αὐτοῖς ὁ Πιλᾶτος· Τί οὖν ποιήσω Ἰησοῦν τὸν λεγόμενον χριστόν; ⸀λέγουσιν πάντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/022.yaml
  text: Pilate said to them[a], “What then should I do with Jesus who is called Messiah?” They all said, “Let him be crucified.”
translation:
  language: pt
  text: 'Pilatos lhes disse: “Então, o que devo fazer com Jesus, chamado Messias[a]?” Todos responderam: “Que ele seja crucificado!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “chamado Cristo”.'
    reason: Registra a tradução tradicional alternativa de Χριστός sem ocultar que o termo funciona aqui como título.
lexical_decisions:
- source_word: Τί οὖν ποιήσω
  choice: Então, o que devo fazer
  rationale: A forma subjuntiva aparece numa pergunta deliberativa; “o que devo fazer” expressa isso naturalmente em português, e “então” preserva a função inferencial de οὖν.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Emprega a forma portuguesa convencional do nome próprio.
- source_word: τὸν λεγόμενον χριστόν
  choice: chamado Messias
  rationale: O particípio passivo atributivo é expresso de modo conciso por “chamado”, enquanto “Messias” traduz Χριστός como título e conserva seu sentido judaico.
- source_word: λέγουσιν πάντες
  choice: Todos responderam
  rationale: O presente histórico é vertido no passado, como é natural na narrativa portuguesa. “Responderam” explicita a função da fala no diálogo sem alterar seu conteúdo, e “todos” preserva a força coletiva de πάντες.
- source_word: Σταυρωθήτω
  choice: Que ele seja crucificado
  rationale: Preserva tanto a força do imperativo de terceira pessoa quanto a voz passiva do verbo grego.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός funciona explicitamente como título atribuído a Jesus, não apenas como parte de um nome. “Messias” comunica o significado do título; a forma tradicional “Cristo” é mantida em nota como alternativa legítima.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e a progressão do diálogo são preservadas; a fala final mantém a construção passiva enfática do original.
