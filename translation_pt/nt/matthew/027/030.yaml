id: MAT.27.30
reference: Matthew 27:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐμπτύσαντες εἰς αὐτὸν ἔλαβον τὸν κάλαμον καὶ ἔτυπτον εἰς τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/030.yaml
  text: And after spitting on him[b][a], they took the reed and kept striking his head.
translation:
  language: pt
  text: E, depois de cuspirem nele, pegaram a cana[a] e continuaram a bater na cabeça dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o bastão». A palavra grega pode designar uma cana ou, por extensão, um bastão semelhante a uma cana.
    reason: lexical_alternative
  - marker: b
    text: Ou «batiam nele, na cabeça». O verbo grego no imperfeito pode destacar uma ação repetida ou contínua.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπτύσαντες εἰς αὐτόν
  choice: depois de cuspirem nele
  rationale: O particípio aoristo apresenta a ação como anterior aos verbos principais; a formulação preserva naturalmente a sequência, e «nele» expressa o sentido idiomático de εἰς com ἐμπτύω.
- source_word: ἔλαβον
  choice: pegaram
  rationale: Equivalente corrente e direto de λαμβάνω neste contexto, indicando que tomaram a cana antes de usá-la para agredir Jesus.
- source_word: κάλαμον
  choice: a cana
  rationale: Preserva o sentido primário de κάλαμος e a ligação com o objeto mencionado anteriormente na cena de falsa entronização, sem interpretar de modo excessivo como «bastão».
- source_word: ἔτυπτον
  choice: continuaram a bater
  rationale: O imperfeito apresenta a agressão como repetida ou em andamento; esta formulação torna esse aspecto claro em português corrente.
- source_word: εἰς τὴν κεφαλὴν αὐτοῦ
  choice: na cabeça dele
  rationale: Com τύπτω, a expressão identifica o alvo dos golpes. «Na cabeça dele» é natural, claro e mantém o caráter concreto da violência.
theological_decisions:
- issue: Representação dos maus-tratos infligidos a Jesus pelos soldados
  choice: Narrar as ações de maneira direta e concreta, preservando a repetição da violência.
  alternative: 'Usar uma construção mais formal: «e, tendo cuspido nele, tomaram a cana e batiam-lhe na cabeça».'
  rationale: O versículo não exige harmonização nem elaboração doutrinária. A tradução mantém a humilhação e a agressão repetida sem suavizar a cena nem acrescentar detalhes ausentes do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Cana» preserva a referência narrativa, enquanto a nota registra a possível extensão semântica. «Continuaram a bater» comunica de forma natural o aspecto iterativo ou durativo do imperfeito.
