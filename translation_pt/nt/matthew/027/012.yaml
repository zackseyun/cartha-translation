  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ κατηγορεῖσθαι αὐτὸν ὑπὸ τῶν ἀρχιερέων ⸀καὶ πρεσβυτέρων οὐδὲν ἀπεκρίνατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/012.yaml
  text: And while he was being accused by the chief priests and elders[a], he answered nothing.
translation:
  language: pt
  text: E, enquanto era acusado pelos principais sacerdotes e anciãos, não respondeu nada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não deu resposta alguma”.'
    reason: Alternativa idiomática para a negação total expressa por οὐδὲν ἀπεκρίνατο.
lexical_decisions:
- source_word: ἐν τῷ κατηγορεῖσθαι
  choice: enquanto era acusado
  rationale: A construção ἐν com infinitivo articular expressa simultaneidade; “enquanto” preserva o valor temporal e o presente passivo durativo de modo natural em português.
- source_word: κατηγορεῖσθαι
  choice: era acusado
  rationale: O infinitivo passivo descreve acusações apresentadas contra Jesus; “acusado” é claro e adequado ao contexto judicial.
- source_word: ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων
  choice: pelos chefes dos sacerdotes e pelos líderes do povo
  rationale: “Chefes dos sacerdotes” representa a liderança sacerdotal, e “líderes do povo” comunica o sentido contextual de πρεσβύτεροι, isto é, os anciãos que exerciam liderança, evitando a associação moderna de “presbíteros” com um cargo eclesiástico.
- source_word: οὐδὲν
  choice: nada
  rationale: Mantém a formulação direta do grego como objeto de “respondeu”, sem transformar a frase em paráfrase.
- source_word: ἀπεκρίνατο
  choice: respondeu
  rationale: O aoristo médio depoente tem o sentido comum de responder; combinado com οὐδέν, resulta naturalmente em “não respondeu nada”.
- source_word: καὶ
  choice: E
  rationale: Preserva a conexão narrativa simples do texto sem introduzir contraste não explícito.
theological_decisions:
- issue: O silêncio de Jesus diante de seus acusadores
  choice: Apresentar o silêncio como fato narrativo, sem acrescentar linguagem explícita de cumprimento profético.
  alternative: Empregar uma formulação interpretativa que evoque diretamente Isaías 53.
  rationale: Embora o silêncio de Jesus possa ressoar com temas proféticos, este versículo não declara explicitamente um cumprimento; a tradução não deve acrescentar essa interpretação.
translation_notes:
  register: Português moderno, digno e de leitura ampla. “Chefes dos sacerdotes” é transparente; “líderes do povo” esclarece o papel sociopolítico dos πρεσβύτεροι no contexto. A colocação “não respondeu nada” é corrente e conserva a estrutura semântica direta do grego.
