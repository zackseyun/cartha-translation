  naturalness: A redação é clara e natural em português moderno. «Principais sacerdotes e anciãos» é uma formulação bíblica corrente, clara para leitores brasileiros e internacionais, e mais direta do que a perífrase explicativa do rascunho.
  terminology: «Principais sacerdotes» traduz com precisão ἀρχιερεῖς como o grupo da liderança sacerdotal, sem sugerir vários ocupantes do único cargo de sumo sacerdote. «Anciãos» preserva πρεσβύτεροι sem impor uma identificação eclesiástica posterior ou explicação sociopolítica adicional.
