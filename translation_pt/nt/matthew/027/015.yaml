review_pass:
  verdict: revise
  source_fidelity: O sentido temporal de κατὰ ... ἑορτήν, o hábito expresso por εἰώθει, o governador, a libertação de um único detento e a seleção pela multidão estão todos adequadamente representados. Porém, «soltar para a multidão um preso» reproduz de modo pouco claro o dativo τῷ ὄχλῳ em português e pode sugerir que o preso era solto no meio da multidão, não que a multidão determinava a escolha.
  naturalness: «Por ocasião da festa» é aceitável, mas «Durante a festa» é mais direto e corrente. «Um preso que a multidão quisesse» é uma formulação natural que evita a construção pesada «um preso, aquele que eles quisessem».
  terminology: «Governador» é apropriado para ἡγεμών. «Prisioneiro» tem registro um pouco mais preciso e neutro que «preso» neste contexto judicial. «Libertar» traduz bem ἀπολύειν sem o tom mais coloquial de «soltar».
  issues:
  - severity: medium
    issue: Construção «soltar para a multidão um preso»
    rationale: Embora tente conservar o dativo, a expressão não é idiomática e é semanticamente ambígua em português. A relação da multidão com a escolha do prisioneiro fica mais clara em «um prisioneiro que a multidão quisesse», sem acrescentar uma justificativa doutrinária ou histórica.
  - severity: low
    issue: «um preso, aquele que eles quisessem»
    rationale: A retomada por «aquele» é redundante depois de «um preso» e torna a frase menos fluente. Uma oração relativa simples preserva a referência singular e a escolha aberta.
  revised_text: Durante a festa, o governador costumava libertar um prisioneiro que a multidão quisesse.
  revised_footnotes: []
  revision_rationale: A revisão conserva o valor temporal de κατά, o aspecto habitual do imperfeito e a seleção de um único prisioneiro pela multidão. Ela substitui uma reprodução sintaticamente artificial do dativo por uma construção portuguesa natural que expressa a função contextual da multidão na escolha, e adota termos judiciais claros e de registro neutro.
