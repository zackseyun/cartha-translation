  text: Κατὰ δὲ ἑορτὴν εἰώθει ὁ ἡγεμὼν ἀπολύειν ἕνα τῷ ὄχλῳ δέσμιον ὃν ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/015.yaml
  text: At the feast the governor was accustomed to release to the crowd one prisoner[a], whom they wanted.
translation:
  language: pt
  text: Durante a festa, o governador costumava libertar um prisioneiro que a multidão quisesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: Por ocasião da festa
  rationale: κατά com o acusativo tem sentido temporal, “por ocasião de/durante”; δέ faz uma transição narrativa leve, que não exige uma palavra separada em português.
- source_word: εἰώθει
  choice: costumava
  rationale: O imperfeito expressa uma prática habitual no passado; “costumava” é natural e explícito em português.
- source_word: ὁ ἡγεμὼν
  choice: o governador
  rationale: No contexto, ἡγεμών designa o governador provincial romano.
- source_word: ἀπολύειν
  choice: soltar
  rationale: No contexto de alguém sob custódia, “soltar” comunica de modo claro e corrente a libertação do preso.
- source_word: ἕνα τῷ ὄχλῳ δέσμιον
  choice: soltar para a multidão um preso
  rationale: Mantém o numeral singular e representa o dativo τῷ ὄχλῳ como beneficiário ou destinatário da soltura, sem acrescentar que ela ocorreu formalmente “a pedido” da multidão.
- source_word: ὃν ἤθελον
  choice: aquele que eles quisessem
  rationale: A oração relativa identifica o preso escolhido pela multidão; o subjuntivo em português expressa naturalmente a escolha aberta implicada no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Festa” preserva a designação contextual sem inserir explicitamente “Páscoa”, embora essa seja a festa indicada pelo contexto. Não se acrescentou nota, pois “festa/festival” não representa uma diferença substantiva que exija esclarecimento neste versículo.
