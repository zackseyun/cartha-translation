revisions:
- from: Por ocasião da festa, o governador costumava soltar para a multidão um preso, aquele que eles quisessem.
  to: Durante a festa, o governador costumava libertar um prisioneiro que a multidão quisesse.
  rationale: A revisão conserva o valor temporal de κατά, o aspecto habitual do imperfeito e a seleção de um único prisioneiro pela multidão. Ela substitui uma reprodução sintaticamente artificial do dativo por uma construção portuguesa natural que expressa a função contextual da multidão na escolha, e adota termos judiciais claros e de registro neutro.
