  text: πέποιθεν ἐπὶ τὸν θεόν, ῥυσάσθω ⸀νῦν εἰ θέλει αὐτόν· εἶπεν γὰρ ὅτι Θεοῦ εἰμι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/043.yaml
  text: He has trusted in God[a]; let God rescue him now, if he wants him, for he said[b], ‘I am the Son of God.’
translation:
  language: pt
  text: 'Ele confiou em Deus[a]; que Deus o livre agora, se o quer, pois ele disse[b]: “Sou o Filho de Deus”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «pôs a sua confiança em Deus».'
    reason: alternative_reading
  - marker: b
    text: 'A zombaria faz eco de perto ao Salmo 22:8, associando Jesus ao justo sofredor desse salmo. Na expressão «se o quer», a alusão também pode sugerir: «se nele tem prazer».'
    reason: cross_reference
lexical_decisions:
- source_word: πέποιθεν
  choice: confiou
  rationale: O perfeito grego expressa confiança estabelecida, resultante de uma ação anterior. Em português, «confiou» é natural neste desafio dirigido a Deus e preserva melhor esse valor do que uma formulação excessivamente explicativa.
- source_word: ἐπὶ τὸν θεόν
  choice: em Deus
  rationale: Com πέποιθα, a preposição indica a pessoa em quem se deposita confiança; «confiar em Deus» é a construção idiomática em português.
- source_word: ῥυσάσθω νῦν
  choice: que Deus o livre agora
  rationale: O imperativo de ῥύομαι pede libertação ou resgate de um perigo. «Livre» é claro, digno e apropriado ao contexto, enquanto a repetição pronominal «que ele o livre» poderia obscurecer o sujeito; «Deus» explicita o referente já presente na frase.
- source_word: εἰ θέλει αὐτόν
  choice: se o quer
  rationale: Mantém o sentido mais direto de θέλω, «querer», sem resolver no texto principal a nuance de agrado ou favor sugerida pela alusão ao Salmo 22:8.
- source_word: εἶπεν γὰρ ὅτι
  choice: pois ele disse
  rationale: O aoristo é adequadamente expresso pelo pretérito perfeito, e ὅτι introduz o conteúdo da declaração, aqui apresentado como citação direta por naturalidade.
- source_word: Θεοῦ εἰμι υἱός
  choice: Sou o Filho de Deus
  rationale: No contexto narrativo de Mateus, a expressão tem força titular e cristológica, não o sentido indefinido de «um filho de Deus».
theological_decisions:
- issue: Sentido de Θεοῦ εἰμι υἱός
  choice: Sou o Filho de Deus
  alternative: Sou Filho de Deus; sou um filho de Deus
  rationale: A construção sem artigo admite discussão gramatical isoladamente, mas o contexto de Mateus apresenta uma reivindicação cristológica reconhecível. O artigo em português comunica a força titular sem acrescentar formulação doutrinária alheia ao texto.
- issue: Nuance de θέλει αὐτόν
  choice: se o quer
  alternative: se nele tem prazer; se dele se agrada
  rationale: O sentido lexical imediato é «querer». A provável alusão ao Salmo 22:8 permite a nuance de favor ou prazer, preservada em nota em vez de ser imposta ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «que Deus o livre» torna explícito o sujeito implícito do imperativo grego. As notas preservam tanto o aspecto de confiança estabelecida quanto a ambiguidade alusiva de θέλω.
