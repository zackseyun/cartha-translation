  text: Τότε σταυροῦνται σὺν αὐτῷ δύο λῃσταί, εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/038.yaml
  text: Then two robbers are crucified with him[a], one on the right and one on the left.
translation:
  language: pt
  text: Então, dois assaltantes são crucificados com ele[a], um à direita e outro à esquerda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bandidos”; o termo grego pode designar ladrões violentos e, em alguns contextos, também pode estar associado à atividade insurgente.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca o evento seguinte na sequência narrativa de modo conciso e natural.
- source_word: σταυροῦνται
  choice: são crucificados
  rationale: Preserva o presente histórico e a voz passiva do grego sem tornar a frase artificial em português.
- source_word: σὺν αὐτῷ
  choice: com ele
  rationale: Expressa diretamente a ideia de acompanhamento indicada por σύν com o dativo.
- source_word: δύο λῃσταί
  choice: dois assaltantes
  rationale: λῃστής costuma designar ladrões violentos ou bandidos. “Assaltantes” comunica com clareza a dimensão de roubo mediante violência, sem impor uma identidade política.
- source_word: εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων
  choice: um à direita e outro à esquerda
  rationale: Reproduz naturalmente em português a expressão espacial idiomática e evita a repetição menos fluida de “um”.
theological_decisions:
- issue: Identidade dos λῃσταί
  choice: assaltantes
  alternative: bandidos; insurgentes
  rationale: O termo pode designar ladrões violentos ou bandidos e, em certos contextos, pode se sobrepor à atividade insurgente; o versículo, porém, não exige essa identificação política mais específica.
translation_notes:
  register: Português moderno, claro e digno, com construção natural tanto no Brasil quanto em outros contextos lusófonos. O presente narrativo foi mantido para refletir a vivacidade do texto grego.
