  text: Τῇ δὲ ἐπαύριον, ἥτις ἐστὶν μετὰ τὴν παρασκευήν, συνήχθησαν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι πρὸς Πιλᾶτον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/062.yaml
  text: On the next day[a], which is after the day of Preparation, the chief priests and the Pharisees gathered before Pilate
translation:
  language: pt
  text: No dia seguinte, isto é, depois do dia da Preparação[a], os chefes dos sacerdotes e os fariseus reuniram-se diante de Pilatos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois da Preparação”. O termo grego pode designar o dia de preparação anterior ao sábado; traduzi-lo como “sexta-feira” seria mais interpretativo do que o texto-fonte exige.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: No dia seguinte
  rationale: A expressão idiomática indica progressão temporal. O valor conectivo leve de δέ fica implícito na fluidez da frase, sem acrescentar um marcador como “Ora” ou “Então”.
- source_word: ἥτις ἐστὶν μετὰ τὴν παρασκευήν
  choice: isto é, depois do dia da Preparação
  rationale: ἥτις introduz aqui uma explicação sobre qual era o dia seguinte. “Isto é” torna essa função explicativa clara em português natural.
- source_word: παρασκευήν
  choice: dia da Preparação
  rationale: No contexto judaico, o termo costuma designar o dia de preparação anterior ao sábado. A formulação preserva a expressão calendárica da fonte sem interpretá-la diretamente como “sexta-feira”.
- source_word: συνήχθησαν
  choice: reuniram-se
  rationale: 'Embora a forma grega seja passiva, tem sentido intransitivo neste contexto: eles se juntaram ou se reuniram.'
- source_word: οἱ ἀρχιερεῖς
  choice: os chefes dos sacerdotes
  rationale: Designa as principais autoridades sacerdotais, e não vários ocupantes simultâneos do cargo singular de sumo sacerdote. A expressão é clara e corrente em português.
- source_word: οἱ Φαρισαῖοι
  choice: os fariseus
  rationale: Forma portuguesa consagrada para o nome desse grupo judaico.
- source_word: πρὸς Πιλᾶτον
  choice: diante de Pilatos
  rationale: πρός com uma pessoa, após um verbo de reunião, pode indicar movimento até ela ou comparecimento perante ela. “Diante de Pilatos” preserva o cenário político e evita sugerir que Pilatos fazia parte do grupo.
- source_word: Πιλᾶτον
  choice: Pilatos
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome Πιλᾶτος.
theological_decisions: []
