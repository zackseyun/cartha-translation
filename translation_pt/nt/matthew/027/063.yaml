  text: λέγοντες· Κύριε, ἐμνήσθημεν ὅτι ἐκεῖνος ὁ πλάνος εἶπεν ἔτι ζῶν· Μετὰ τρεῖς ἡμέρας ἐγείρομαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/063.yaml
  text: saying[a], “Lord, we remember that that deceiver said while he was still alive[b], ‘After three days I rise.’”
translation:
  language: pt
  text: 'dizendo: “Senhor, lembramo-nos de que aquele enganador disse, quando ainda estava vivo: ‘Depois de três dias, ressuscito’.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Depois de três dias, ressuscitarei” ou “Depois de três dias, serei ressuscitado”. O grego emprega uma forma verbal no presente, que também pode ser entendida em sentido passivo.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: dizendo
  rationale: Mantém o particípio presente que liga esta fala ao versículo anterior.
- source_word: Κύριε
  choice: Senhor
  rationale: Reproduz o vocativo respeitoso dirigido a Pilatos; no contexto, funciona como forma de tratamento e não implica atribuição de divindade.
- source_word: ἐμνήσθημεν
  choice: lembramo-nos
  rationale: Embora a forma grega seja aorista, o presente é idiomático em português para uma lembrança agora trazida à atenção e preserva sua relevância no momento da fala.
- source_word: ἐκεῖνος ὁ πλάνος
  choice: aquele enganador
  rationale: “Aquele” conserva o distanciamento depreciativo do demonstrativo, e “enganador” expressa a pessoa que desvia ou engana.
- source_word: ἔτι ζῶν
  choice: quando ainda estava vivo
  rationale: Expressa com clareza e naturalidade a circunstância temporal do particípio grego.
- source_word: Μετὰ τρεῖς ἡμέρας
  choice: Depois de três dias
  rationale: Traduz diretamente μετά com acusativo, sem harmonizar a expressão com “no terceiro dia” de outras passagens.
- source_word: ἐγείρομαι
  choice: ressuscito
  rationale: Conserva a forma de presente do grego em português natural. A forma grega admite matiz médio ou passivo, indicado na nota.
theological_decisions:
- issue: Forma da predição citada sobre a ressurreição de Jesus
  choice: Depois de três dias, ressuscito
  alternative: Depois de três dias, ressuscitarei / serei ressuscitado
  rationale: O grego emprega uma forma de presente, média/passiva. O texto principal mantém o presente de modo legível, enquanto a nota preserva as possibilidades futura e passiva sem decidir silenciosamente entre elas.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e ampla inteligibilidade internacional. A pontuação deixa claro que a frase final é uma citação das palavras atribuídas a Jesus.
