  text: ὁμοίως ⸀καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες μετὰ τῶν γραμματέων καὶ ⸀πρεσβυτέρων ἔλεγον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/041.yaml
  text: Likewise[a], the chief priests also, mocking him with the scribes and elders, were saying,
translation:
  language: pt
  text: 'Do mesmo modo[a], também os chefes dos sacerdotes, zombando dele junto com os escribas e os anciãos, diziam:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “De maneira semelhante, também os chefes dos sacerdotes zombavam dele junto com os escribas e os anciãos, dizendo:”'
    reason: Alternativa lexical e sintática que preserva o valor comparativo de ὁμοίως e torna finita a ação expressa pelo particípio.
lexical_decisions:
- source_word: ὁμοίως
  choice: Do mesmo modo
  rationale: Marca a correspondência com as zombarias imediatamente anteriores e preserva com naturalidade a força comparativa do advérbio.
- source_word: καὶ
  choice: também
  rationale: Tem sentido aditivo, incluindo os chefes dos sacerdotes entre os que zombavam de Jesus.
- source_word: ἀρχιερεῖς
  choice: chefes dos sacerdotes
  rationale: Designa as principais autoridades sacerdotais, e não vários ocupantes simultâneos do cargo singular de sumo sacerdote.
- source_word: ἐμπαίζοντες
  choice: zombando dele
  rationale: Expressa escárnio; o pronome 'dele' explicita o objeto evidente no contexto imediato sem alterar o sentido.
- source_word: μετὰ
  choice: junto com
  rationale: Com o genitivo, indica associação e apresenta escribas e anciãos como participantes da zombaria.
- source_word: γραμματέων
  choice: escribas
  rationale: É a designação direta e tradicional desse grupo no contexto dos Evangelhos, sem a explicitação interpretativa de 'mestres da Lei'.
- source_word: πρεσβυτέρων
  choice: anciãos
  rationale: Preserva o sentido institucional de líderes reconhecidos, não meramente homens de idade avançada.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito retrata a fala em curso ou reiterada, aspecto transmitido naturalmente pelo imperfeito português.
theological_decisions:
- issue: Identificação dos participantes da zombaria
  choice: Os chefes dos sacerdotes, os escribas e os anciãos participam juntos da zombaria contra Jesus.
  alternative: Os chefes dos sacerdotes zombam apenas na presença dos escribas e dos anciãos.
  rationale: A construção μετὰ com genitivo indica mais naturalmente associação na ação, embora 'com' isoladamente pudesse permitir uma leitura menos explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem mantém a estrutura narrativa do grego sem produzir uma frase artificial; os termos institucionais tradicionais foram preservados.
