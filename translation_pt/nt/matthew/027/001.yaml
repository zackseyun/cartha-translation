id: MAT.27.1
reference: Matthew 27:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: pt
  text: Quando amanheceu[a], todos os chefes dos sacerdotes e os anciãos do povo deliberaram[b] contra Jesus, com o propósito de matá-lo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Ao romper do dia”.
    reason: lexical_alternative
  - marker: b
    text: Ou “reuniram-se em conselho”.
    reason: lexical_alternative
  - marker: c
    text: Ou “de modo a matá-lo”.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: Quando amanheceu
  rationale: A construção temporal em genitivo absoluto introduz a transição para a manhã. A formulação é natural em português e preserva o valor temporal; δέ fica representado pela própria transição narrativa.
- source_word: συμβούλιον ἔλαβον
  choice: deliberaram
  rationale: O idioma grego descreve uma consulta ou deliberação conjunta. “Deliberaram” comunica isso com clareza e dignidade, sem sugerir que a decisão ainda não tivesse qualquer direção definida.
- source_word: πάντες
  choice: todos
  rationale: Mantém explicitamente a abrangência atribuída aos grupos de líderes mencionados.
- source_word: οἱ ἀρχιερεῖς
  choice: os chefes dos sacerdotes
  rationale: Designa a liderança sacerdotal de Jerusalém e evita a impressão equivocada de que havia vários ocupantes simultâneos do cargo singular de sumo sacerdote.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: os anciãos do povo
  rationale: Preserva o título formal de liderança e a relação genitiva em português corrente.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: contra Jesus
  rationale: Neste contexto hostil, κατά com o genitivo tem sentido adversativo, não apenas o de assunto ou referência.
- source_word: ὥστε
  choice: com o propósito de
  rationale: Com o infinitivo, a expressão pode apresentar resultado pretendido ou propósito. A escolha explicita naturalmente a intenção letal no contexto, enquanto a nota registra a alternativa menos diretamente final.
- source_word: θανατῶσαι αὐτόν
  choice: matá-lo
  rationale: Expressa de modo direto e atual o sentido causativo de θανατόω, sem acrescentar uma especificação jurídica como “executá-lo” ou substituir o ato pela mera condenação.
theological_decisions:
- issue: Natureza da ação dos líderes contra Jesus
  choice: Apresentar uma deliberação hostil cujo propósito era matar Jesus.
  alternative: Traduzir de maneira mais fraca como uma consulta “a respeito de Jesus” ou mais forte como uma “conspiração”.
  rationale: κατά indica oposição e θανατῶσαι indica intenção letal. “Deliberaram contra Jesus” preserva ambos os elementos sem acrescentar ao substantivo συμβούλιον uma conotação conspiratória que ele, isoladamente, não exige.
- issue: Relação expressa por ὥστε com o infinitivo
  choice: “com o propósito de matá-lo”
  alternative: “de modo a matá-lo”
  rationale: A construção comporta a ideia de resultado visado e, no contexto, a finalidade é saliente. A nota preserva a possibilidade de formular a relação como resultado pretendido sem resolver em excesso a nuance sintática.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Chefes dos sacerdotes” é preferido a “principais sacerdotes” por identificar com mais clareza o grupo dirigente. “Matá-lo” mantém a força do grego sem arcaísmo nem especificação jurídica indevida.
