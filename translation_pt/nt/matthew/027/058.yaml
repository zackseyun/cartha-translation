source:
  edition: SBLGNT
  text: οὗτος προσελθὼν τῷ Πιλάτῳ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ. τότε ὁ Πιλᾶτος ἐκέλευσεν ⸀ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/058.yaml
  text: He went to Pilate and asked for the body of Jesus[a]. Then Pilate ordered it to be given to him.
translation:
  language: pt
  text: Ele foi a Pilatos e pediu o corpo de Jesus. Então Pilatos ordenou que o corpo lhe fosse entregue.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ordenou que o corpo fosse dado” ou “ordenou que o corpo fosse entregue”. O grego não explicita o destinatário; o contexto indica José.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Ele
  rationale: O demonstrativo retoma José de Arimateia, mencionado no versículo anterior. Em português narrativo, o pronome é natural quando o referente está claro.
- source_word: προσελθὼν
  choice: foi a
  rationale: O particípio aoristo indica que José se dirigiu a Pilatos antes de fazer o pedido. “Foi a” expressa esse movimento com clareza e naturalidade.
- source_word: ᾐτήσατο
  choice: pediu
  rationale: Neste contexto, αἰτέω significa pedir ou solicitar algo. “Pediu o corpo” é idiomático e direto em português.
- source_word: σῶμα
  choice: corpo
  rationale: “Corpo” traduz diretamente σῶμα e comunica de modo digno e suficiente que se trata do corpo morto de Jesus, sem o tom clínico de “cadáver”.
- source_word: τότε
  choice: Então
  rationale: Marca a sequência do relato e introduz naturalmente a ação seguinte.
- source_word: ἐκέλευσεν
  choice: ordenou
  rationale: κελεύω denota dar uma ordem. “Ordenou” é conciso e adequado à autoridade administrativa de Pilatos.
- source_word: ἀποδοθῆναι
  choice: que o corpo lhe fosse entregue
  rationale: O infinitivo passivo indica que o corpo deveria ser dado ou entregue. “Entregue” exprime bem a transferência autorizada por Pilatos, e “lhe” torna explícito o destinatário já evidente no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa e ampla legibilidade brasileira. A repetição de “o corpo” na segunda frase evita ambiguidade, enquanto “lhe” explicita apenas o destinatário já implícito no contexto.
