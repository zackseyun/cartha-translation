source:
  edition: SBLGNT
  text: Τότε οἱ στρατιῶται τοῦ ἡγεμόνος παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον συνήγαγον ἐπ’ αὐτὸν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/027.yaml
  text: Then the governor’s soldiers took Jesus into the praetorium and gathered the whole cohort around him[a][b].
translation:
  language: pt
  text: Então os soldados do governador levaram Jesus para dentro do pretório[a] e reuniram toda a coorte ao redor dele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sede do governador”. O termo grego se refere à residência oficial ou ao quartel-general militar do governador romano.
    reason: lexical_alternative
  - marker: b
    text: “Coorte” traduz um termo militar romano; ele pode designar uma unidade de soldados, sem implicar necessariamente que todos os integrantes de uma coorte completa estivessem fisicamente presentes.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Conector temporal natural em português, marcando a sequência imediata dos acontecimentos.
- source_word: οἱ στρατιῶται τοῦ ἡγεμόνος
  choice: os soldados do governador
  rationale: Expressão clara e idiomática que preserva a relação associativa do genitivo com o governador romano.
- source_word: παραλαβόντες τὸν Ἰησοῦν
  choice: levaram Jesus
  rationale: Integra o particípio à oração principal em português natural e expressa que os soldados tomaram Jesus consigo para conduzi-lo ao interior.
- source_word: εἰς τὸ πραιτώριον
  choice: para dentro do pretório
  rationale: Preserva o termo histórico romano e explicita o movimento para o interior indicado por εἰς.
- source_word: συνήγαγον ἐπ’ αὐτὸν
  choice: reuniram ao redor dele
  rationale: No contexto, descreve a concentração dos soldados em torno de Jesus, sem adotar a possível nuance mais hostil de 'contra ele'.
- source_word: ὅλην τὴν σπεῖραν
  choice: toda a coorte
  rationale: Mantém tanto ὅλην, 'toda', como o sentido técnico militar romano de σπεῖρα.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O termo histórico “pretório” e o termo militar “coorte” foram mantidos no texto e esclarecidos por notas.
