  text: καὶ ἐκδύσαντες αὐτὸν ⸂χλαμύδα κοκκίνην περιέθηκαν αὐτῷ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/028.yaml
  text: And after stripping him[a], they put a scarlet cloak on him,
translation:
  language: pt
  text: E, depois de o despirem, puseram sobre ele um manto escarlate[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma veste escarlate”. O termo grego pode designar, de modo mais amplo, uma peça exterior de roupa ou capa.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém o conectivo narrativo simples e direto do grego.
- source_word: ἐκδύσαντες
  choice: depois de o despirem
  rationale: Expressa naturalmente em português a ação antecedente do particípio aoristo, preservando o sentido de tirar as roupas.
- source_word: χλαμύδα
  choice: manto
  rationale: χλαμύς designa uma peça exterior, frequentemente um manto curto associado a soldados ou oficiais. “Manto” é corrente e suficientemente específico sem acrescentar conotações indevidas.
- source_word: κοκκίνην
  choice: escarlate
  rationale: Preserva a tonalidade vermelha viva indicada por κόκκινος e a linguagem tradicionalmente reconhecível da cena.
- source_word: περιέθηκαν αὐτῷ
  choice: puseram sobre ele
  rationale: Traduz de modo natural a construção com περιτίθημι e dativo, retendo a ideia de colocar a peça em torno ou sobre Jesus.
theological_decisions:
- issue: Natureza da peça de roupa na cena de zombaria
  choice: manto escarlate
  alternative: veste escarlate
  rationale: “Manto” preserva o sentido lexical de χλαμύς e a representação da investidura zombeteira sem intensificar artificialmente suas conotações régias.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com fluidez brasileira. A ordem foi ajustada de modo natural, mantendo a sequência das ações do grego.
