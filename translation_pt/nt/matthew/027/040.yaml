  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ὁ καταλύων τὸν ναὸν καὶ ἐν τρισὶν ἡμέραις οἰκοδομῶν, σῶσον σεαυτόν· εἰ υἱὸς εἶ τοῦ θεοῦ, ⸀κατάβηθι ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/040.yaml
  text: and saying[a], “You who would destroy the temple and build it in three days, save yourself! If you are the Son of God, come down from the cross.”
translation:
  language: pt
  text: 'e diziam: “Você que ia destruir o templo e construí-lo em três dias, salve a si mesmo! Se você é o Filho de Deus, desça da cruz.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: e diziam
  rationale: O particípio presente continua a ação narrativa anterior. Em português, a forma verbal finita soa natural e mantém a ideia de fala repetida ou contínua no contexto da zombaria.
- source_word: Ὁ καταλύων
  choice: Você que ia destruir
  rationale: O artigo com o particípio funciona como vocativo. A construção com “ia destruir” comunica a alusão zombeteira à declaração atribuída a Jesus sem apresentá-la simplesmente como fato consumado.
- source_word: καταλύω
  choice: destruir
  rationale: No contexto do templo, “destruir” expressa de modo claro e digno a ideia de derrubar ou demolir.
- source_word: ναός
  choice: templo
  rationale: Embora ναός possa designar mais especificamente o santuário, “templo” é a equivalência natural e reconhecível neste contexto.
- source_word: ἐν τρισὶν ἡμέραις
  choice: em três dias
  rationale: Reproduz de maneira idiomática a expressão temporal grega e preserva a formulação da acusação zombeteira.
- source_word: οἰκοδομῶν
  choice: construí-lo
  rationale: O verbo grego significa literalmente “construir”; o pronome retoma “templo”. Evita-se tornar explícita a noção interpretativa de reconstrução, que não está lexicalmente marcada no verbo.
- source_word: σῶσον σεαυτόν
  choice: salve a si mesmo
  rationale: Traduz diretamente o imperativo aoristo e o pronome reflexivo, preservando a força do desafio.
- source_word: εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Se você é o Filho de Deus
  rationale: Mantém tanto a condição zombeteira quanto o título cristológico em formulação clara e tradicional, sem ampliar nem enfraquecer seu sentido.
- source_word: κατάβηθι
  choice: desça
  rationale: É o imperativo português natural para o movimento para baixo exigido pelo contexto.
- source_word: σταυρός
  choice: cruz
  rationale: É a equivalência padrão e contextualmente adequada na narrativa da paixão.
theological_decisions:
- issue: O título cristológico υἱὸς τοῦ θεοῦ em contexto de zombaria
  choice: o Filho de Deus
  alternative: Filho de Deus / o filho de Deus
  rationale: A tradução conserva o título de forma transparente e reconhecível. A fala dos zombadores desafia a identidade de Jesus; a tradução não valida a zombaria nem acrescenta uma interpretação doutrinária além do texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Você” torna direto o vocativo da zombaria; “ia destruir” evita a rigidez de “você que destrói” e preserva a alusão à acusação anterior. Não se acrescentou nota para “reconstruir”, pois o texto principal traduz literalmente οἰκοδομέω como “construir” e nenhuma alternativa é necessária para a compreensão.
