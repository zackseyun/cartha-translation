  yaml_path: translation/nt/matthew/027/050.yaml
  text: But Jesus cried out again with a loud voice and gave up his spirit[a].
translation:
  language: pt
  text: Mas Jesus clamou outra vez em alta voz e entregou o espírito[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «deu o último suspiro». O grego emprega uma expressão que literalmente significa «deixou ir o espírito» e indica a morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca a continuação com leve contraste ou progressão; «Mas» é natural no contexto e destaca a retomada do foco em Jesus.
- source_word: πάλιν
  choice: outra vez
  rationale: Expressa repetição de modo claro e idiomático em português.
- source_word: κράξας
  choice: clamando
  rationale: O particípio aoristo indica um brado forte ligado à ação principal; «clamando» preserva a construção participial e o tom solene.
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: Traduz naturalmente a expressão de modo, preservando a ênfase no volume da voz.
- source_word: ἀφῆκεν
  choice: entregou
  rationale: No contexto da expressão idiomática com πνεῦμα, «entregou» comunica deixar partir ou liberar, sem reduzir a expressão simplesmente ao ato de respirar.
- source_word: τὸ πνεῦμα
  choice: o espírito
  rationale: Mantém de perto o artigo e o valor lexical de πνεῦμα; em português, «entregou o espírito» é uma expressão compreensível e solene para a morte.
theological_decisions:
- issue: Tradução da expressão de morte ἀφῆκεν τὸ πνεῦμα
  choice: entregou o espírito
  alternative: deu o último suspiro
  rationale: A opção principal preserva o termo «espírito» e a formulação distintiva do grego, sem decidir se πνεῦμα deve ser entendido apenas como «respiração». A alternativa torna explícito o sentido idiomático de morrer, mas perde parte da ressonância lexical e teológica.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem mantém o vínculo entre o clamor e a ação principal, e a nota preserva a alternativa idiomática sem eliminar a ambiguidade de πνεῦμα.
