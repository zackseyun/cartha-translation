    rationale: Uma coordenação verbal em português comunica com mais clareza que Jesus primeiro clamou e então morreu, como no encadeamento narrativo grego.
  - severity: low
    issue: A nota chama «entregou o espírito» de formulação literalmente grega.
    rationale: «Entregou» é uma boa tradução idiomática no contexto, mas ἀφῆκεν significa mais propriamente deixar ir, soltar ou liberar; a nota deve qualificar isso com precisão.
