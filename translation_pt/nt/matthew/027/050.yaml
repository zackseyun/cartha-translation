  source_fidelity: A tradução transmite adequadamente δέ («Mas»), πάλιν («outra vez»), o clamor em voz alta e a expressão de morte ἀφῆκεν τὸ πνεῦμα. Contudo, o gerúndio «clamando» pode sugerir simultaneidade, enquanto o particípio aoristo em contexto narrativo apresenta o clamor como anterior à ação principal.
  naturalness: «Jesus clamou outra vez em alta voz e entregou o espírito» é mais direto e natural no português moderno, preservando a sequência narrativa sem perda de solenidade.
  terminology: «Entregou o espírito» preserva deliberadamente πνεῦμα e não impõe a leitura mais interpretativa «deu o último suspiro». A nota deve evitar afirmar que «entregou» é a formulação literalmente exata do grego, pois ἀφῆκεν tem, mais estritamente, o sentido de deixar ir/soltar/liberar.
  issues:
