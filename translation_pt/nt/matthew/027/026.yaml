- from: Então Pilatos soltou Barrabás para eles, mas mandou açoitar Jesus e o entregou para ser crucificado.[a]
  to: Então Pilatos soltou Barrabás para eles, mas, depois de mandar açoitar Jesus[a], entregou-o para ser crucificado.
  rationale: A revisão explicita a sequência expressa pelo particípio aoristo (“depois de”), mantém a construção causativa idiomática apropriada à ação judicial de Pilatos e desloca a chamada de nota para a expressão correspondente. A alternativa da nota conserva uma opção mais literal e técnica, sem impor que Pilatos tenha executado pessoalmente o castigo.
