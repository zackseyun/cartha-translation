  source_fidelity: A tradução preserva corretamente a libertação de Barrabás, o contraste introduzido por δέ, a flagelação anterior à entrega e a finalidade da crucificação. “Mandou açoitar” é uma forma causativa portuguesa legítima no contexto judicial para o particípio cujo sujeito gramatical é Pilatos. Convém, porém, explicitar no texto a anterioridade indicada por φραγελλώσας e alinhar a nota a esse ponto.
  naturalness: “Então Pilatos soltou Barrabás para eles” é compreensível e natural em português moderno. A formulação revista torna mais clara a sequência narrativa e posiciona a chamada de nota junto da expressão a que ela se refere.
  terminology: “Barrabás”, “Jesus”, “açoitar”, “entregou-o” e “crucificado” são termos adequados, claros e de registro digno. “Flagelar” na nota oferece uma alternativa mais próxima do vocabulário técnico/tradicional sem substituir a redação acessível do texto.
  issues:
