source:
  edition: SBLGNT
  text: τότε ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, τὸν δὲ Ἰησοῦν φραγελλώσας παρέδωκεν ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/026.yaml
  text: Then he released Barabbas to them[a], but after flogging Jesus, he handed him over to be crucified.
translation:
  language: pt
  text: Então Pilatos soltou Barrabás para eles, mas, depois de mandar açoitar Jesus[a], entregou-o para ser crucificado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de flagelar Jesus”. O verbo grego refere-se à flagelação, uma punição romana por meio de chicoteamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca de modo natural a progressão temporal e narrativa.
- source_word: ἀπέλυσεν αὐτοῖς
  choice: soltou ... para eles
  rationale: No contexto judicial, ἀπολύω significa libertar um prisioneiro; o dativo αὐτοῖς apresenta o povo como beneficiário da soltura.
- source_word: τὸν Βαραββᾶν
  choice: Barrabás
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: τὸν δὲ Ἰησοῦν
  choice: mas ... Jesus
  rationale: δέ assinala aqui o contraste entre a libertação de Barrabás e o tratamento dado a Jesus.
- source_word: φραγελλώσας
  choice: mandou açoitar
  rationale: O verbo designa a flagelação romana. Como o sujeito é Pilatos, a construção causativa idiomática evita sugerir necessariamente que ele próprio aplicou os golpes, sem alterar sua responsabilidade judicial.
- source_word: παρέδωκεν
  choice: o entregou
  rationale: Expressa a entrega de Jesus para a execução determinada, preservando o valor judicial do verbo.
- source_word: ἵνα σταυρωθῇ
  choice: para ser crucificado
  rationale: Reproduz de forma concisa e natural a finalidade expressa por ἵνα com o subjuntivo passivo.
theological_decisions:
- issue: Sequência e agência na sentença de Jesus
  choice: Pilatos mandou açoitar Jesus e depois o entregou para ser crucificado.
  alternative: Pilatos entregou Jesus, que depois foi açoitado.
  rationale: O particípio aoristo φραγελλώσας apresenta normalmente uma ação anterior à do verbo principal παρέδωκεν. A formulação preserva a ordem narrativa sem acrescentar uma interpretação doutrinária do procedimento romano.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. “Mandou açoitar” é mais idiomático em português para a ação autorizada por Pilatos; a nota registra a forma mais literal do particípio.
