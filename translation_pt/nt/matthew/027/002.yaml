  text: καὶ δήσαντες αὐτὸν ἀπήγαγον καὶ ⸀παρέδωκαν Πιλάτῳ τῷ ἡγεμόνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/002.yaml
  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: pt
  text: E, depois de o amarrarem, levaram-no embora e o entregaram a Pilatos, o governador.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δήσαντες
  choice: depois de o amarrarem
  rationale: O particípio aoristo indica uma ação anterior aos verbos principais. A formulação explicita essa sequência em português natural e preserva o sentido concreto de prender com amarras.
- source_word: ἀπήγαγον
  choice: levaram-no dali
  rationale: ἀπάγω significa conduzir ou levar para outro lugar. “Levaram-no dali” comunica com clareza o afastamento de Jesus sob custódia, sem acrescentar detalhes não expressos.
- source_word: παρέδωκαν
  choice: o entregaram
  rationale: No contexto judicial da paixão, παραδίδωμι designa entregar alguém à custódia ou autoridade de outra pessoa. “Entregaram” é corrente e mantém tanto a força jurídica imediata quanto a possível ressonância teológica.
- source_word: Πιλάτῳ
  choice: a Pilatos
  rationale: O nome próprio é transliterado segundo o uso português estabelecido, com a regência natural do verbo “entregar”.
- source_word: τῷ ἡγεμόνι
  choice: o governador
  rationale: ἡγεμών é um termo amplo para uma autoridade governante. “Governador” é claro e fiel ao nível de especificidade do grego; “prefeito” seria historicamente mais específico do que o texto.
- source_word: καὶ
  choice: E ... e
  rationale: As conjunções foram mantidas para preservar o encadeamento narrativo e a coordenação das ações.
theological_decisions:
- issue: Sentido de παραδίδωμι no relato da paixão
  choice: o entregaram
  alternative: o puseram nas mãos de
  rationale: “Entregaram” conserva o sentido imediato de transferência à autoridade de Pilatos sem reduzir o verbo a uma explicação puramente jurídica nem impor uma interpretação teológica.
- issue: Título de Pilatos
  choice: governador
  alternative: prefeito
  rationale: Embora “prefeito” possa descrever com maior precisão histórica o cargo romano de Pilatos, o grego ἡγεμών é mais geral. A tradução evita especificar além da fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A próclise em “depois de o amarrarem” evita a contração coloquial “dele” e deixa claro que “o” é objeto do infinitivo. A ênclise em “levaram-no” mantém fluidez narrativa sem soar excessivamente arcaica.
