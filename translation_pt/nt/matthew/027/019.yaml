  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ βήματος ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα· Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ, πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/019.yaml
  text: While he was sitting on the judgment seat[a], his wife sent word to him, saying, “Have nothing to do with that righteous man[b], for I have suffered greatly today in a dream because of him.”
translation:
  language: pt
  text: 'Enquanto ele estava sentado no tribunal, sua esposa mandou-lhe um recado: “Não se envolva com esse homem justo[a], pois hoje sofri muito em sonho por causa dele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esse homem inocente”. O adjetivo grego pode significar “justo” ou, em contexto jurídico, “inocente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Enquanto ele estava sentado
  rationale: O genitivo absoluto com particípio presente descreve uma circunstância simultânea e em andamento; a formulação é natural em português.
- source_word: ἐπὶ τοῦ βήματος
  choice: no tribunal
  rationale: Neste contexto judicial, βῆμα designa o lugar ou assento oficial de onde se pronunciava o julgamento. “No tribunal” comunica naturalmente a função sem sugerir apenas um objeto físico.
- source_word: ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ
  choice: sua esposa mandou-lhe um recado
  rationale: A relação expressa por γυνή é a de esposa, e a construção indica o envio de uma comunicação, provavelmente por mensageiro, sem exigir que o meio seja explicitado.
- source_word: Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ
  choice: Não se envolva com esse homem justo
  rationale: A expressão elíptica adverte Pilatos a não ter participação no caso daquele homem. “Não se envolva” é corrente e preserva a amplitude do idioma, enquanto “justo” mantém a força moral e judicial de δίκαιος.
- source_word: πολλὰ γὰρ ἔπαθον σήμερον
  choice: pois hoje sofri muito
  rationale: πολλὰ πάσχω é uma expressão idiomática de sofrimento intenso. O pretérito perfeito traduz adequadamente o aoristo e mantém a urgência do relato.
- source_word: κατ’ ὄναρ δι’ αὐτόν
  choice: em sonho por causa dele
  rationale: κατ’ ὄναρ é a expressão usual para uma experiência em sonho, e διά com acusativo indica a causa ou razão.
theological_decisions:
- issue: Sentido de δίκαιος aplicado a Jesus
  choice: homem justo
  alternative: homem inocente
  rationale: “Justo” preserva o alcance moral de δίκαιος e também se ajusta ao contexto judicial. “Inocente” é uma leitura contextual legítima, mas estreita o termo a uma declaração jurídica; por isso aparece em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala é direta e natural; evitou-se linguagem jurídica excessivamente técnica e preservou-se a possível dimensão moral e legal de δίκαιος.
