id: MAT.27.11
reference: Matthew 27:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: pt
  text: 'Jesus ficou de pé diante do governador, e este lhe perguntou: “Você é o rei dos judeus[a]?” Jesus respondeu: “Você é quem diz.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos judeanos”. O termo grego pode designar os judeus em sentido amplo ou, em certos contextos, os habitantes da Judeia.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Você mesmo o diz” ou “É como você diz”. Em grego, a resposta de Jesus é breve e um tanto elíptica.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐστάθη
  choice: estava
  rationale: No contexto judicial, expressa de modo natural que Jesus se encontrava diante do governador. Evita sugerir, sem apoio explícito, que alguém o obrigou a ficar em pé, e também evita a ideia de que ele se levantou naquele momento.
- source_word: ἔμπροσθεν
  choice: diante de
  rationale: Equivalente claro e digno para a posição de Jesus perante a autoridade, adequado tanto ao sentido espacial quanto ao cenário judicial.
- source_word: ἡγεμών / ἡγεμόνος
  choice: governador
  rationale: É a designação corrente e historicamente adequada para a autoridade romana neste contexto; “prefeito” seria mais técnico, e “governante”, amplo demais.
- source_word: ἐπηρώτησεν
  choice: perguntou
  rationale: Reproduz com naturalidade o ato de formular a pergunta. O contexto já comunica seu caráter judicial, enquanto “interrogou” poderia acrescentar uma intensidade não exigida pelo verbo.
- source_word: λέγων
  choice: introduzido pelos dois-pontos
  rationale: Em português atual, os dois-pontos introduzem naturalmente as palavras da pergunta e evitam o redundante “perguntou, dizendo”, sem perda de conteúdo.
- source_word: βασιλεὺς
  choice: rei
  rationale: É o equivalente direto e natural. A inicial minúscula segue o uso normal do português para títulos ou funções em construções desse tipo.
- source_word: τῶν Ἰουδαίων
  choice: dos judeus
  rationale: É a forma mais natural e amplamente compreendida para a designação político-étnica usada na acusação romana; “dos judeanos” continua sendo uma possibilidade lexical e é registrada em nota.
- source_word: ἔφη
  choice: respondeu
  rationale: Embora o verbo signifique literalmente “disse”, “respondeu” explicita de maneira natural em português a função da fala no diálogo, sem alterar seu conteúdo.
- source_word: Σὺ λέγεις
  choice: Você é quem diz
  rationale: Mantém a concisão, a ênfase no pronome “você” e o caráter elíptico da expressão grega. Evita transformar a resposta em uma afirmação inequívoca ou em uma negação.
theological_decisions:
- issue: Nuance da resposta de Jesus Σὺ λέγεις
  choice: 'Uma resposta indireta e comedida: “Você é quem diz.”'
  alternative: 'Uma afirmação mais explícita: “É como você diz.”'
  rationale: A formulação grega não nega a designação, mas tampouco a reafirma diretamente nos termos políticos do governador. A tradução conserva essa tensão em vez de resolvê-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura do diálogo foi tornada natural por meio de dois-pontos e pelo pronome “este”, evitando repetição pesada. As notas foram posicionadas junto às expressões a que efetivamente se referem.
