  text: οἱ δὲ λοιποὶ ⸀ἔλεγον· Ἄφες ἴδωμεν εἰ ἔρχεται Ἠλίας σώσων ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/049.yaml
  text: But the rest said[a], “Leave him alone[b]. Let us see whether Elijah is coming to save him.”
translation:
  language: pt
  text: 'Mas os outros disseram: “Deixe-o. Vejamos se Elias vem salvá-lo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Mas os outros
  rationale: “Os outros” expressa naturalmente o grupo restante em contraste com a pessoa que acabara de agir; “mas” preserva a função contrastiva de δέ.
- source_word: ἔλεγον
  choice: disseram
  rationale: Embora o imperfeito possa sugerir fala contínua ou repetida, o pretérito perfeito é idiomático na narrativa portuguesa e evita acentuar indevidamente o aspecto.
- source_word: Ἄφες
  choice: Deixe-o
  rationale: O imperativo singular manda a pessoa que oferecia o vinho azedo parar de interferir. O pronome explicita o objeto implícito pelo contexto sem ampliar o sentido.
- source_word: ἴδωμεν
  choice: Vejamos
  rationale: Equivalente direto e natural do subjuntivo exortativo na primeira pessoa do plural.
- source_word: εἰ ἔρχεται
  choice: se Elias vem
  rationale: “Se” introduz naturalmente a pergunta indireta em português, e “vem” preserva o presente grego e a imediatez da cena, sem convertê-lo explicitamente em futuro.
- source_word: Ἠλίας
  choice: Elias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome do profeta.
- source_word: σώσων αὐτόν
  choice: salvá-lo
  rationale: O particípio futuro indica a finalidade da vinda. “Salvar” preserva o vínculo lexical com σῴζω e, no contexto imediato, denota livramento da morte.
theological_decisions:
- issue: Possíveis conotações teológicas de σῴζω no relato da crucificação
  choice: salvá-lo
  alternative: resgatá-lo
  rationale: Os presentes falam de um livramento visível da cruz, mas “salvar” mantém tanto o sentido comum do verbo quanto a ironia teológica do relato, sem reduzir nem ampliar explicitamente seu alcance.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção concisa conserva a imediatez e a tensão da fala original.
