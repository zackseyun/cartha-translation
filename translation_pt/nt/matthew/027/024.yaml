id: MAT.27.24
reference: Matthew 27:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Πιλᾶτος ὅτι οὐδὲν ὠφελεῖ ἀλλὰ μᾶλλον θόρυβος γίνεται λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας ⸀ἀπέναντι τοῦ ὄχλου λέγων· Ἀθῷός εἰμι ἀπὸ τοῦ ⸀αἵματος τούτου· ὑμεῖς ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/024.yaml
  text: So when Pilate saw that he was gaining nothing[a], but rather that a riot was developing, he took water and washed his hands before the crowd, saying, “I am innocent of this blood[c][b]; you yourselves will see to it.”
translation:
  language: pt
  text: 'Quando Pilatos viu que nada conseguia, mas que, ao contrário, um tumulto estava começando,[a] pegou água e lavou as mãos diante da multidão, dizendo: “Sou inocente deste sangue.[b] Vocês mesmos verão.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “começava um alvoroço” ou “surgia uma desordem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Sou inocente deste sangue”. A expressão significa que Pilatos alegava não ser responsável pela morte em questão.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “Vocês verão”; também pode ser traduzido: “Cuidem disso vocês mesmos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πιλᾶτος
  choice: Quando Pilatos viu
  rationale: O particípio aoristo com δέ dá continuidade à narrativa. Em português, “Quando Pilatos viu” comunica naturalmente a transição sem impor uma oposição forte.
- source_word: οὐδὲν ὠφελεῖ
  choice: não conseguia nada
  rationale: A expressão indica que os esforços de Pilatos não produziam resultado. Esta formulação é clara e idiomática em português.
- source_word: ἀλλὰ μᾶλλον θόρυβος γίνεται
  choice: e que, ao contrário, começava um tumulto
  rationale: θόρυβος pode indicar tumulto, alvoroço ou desordem; γίνεται apresenta a situação como algo que começava a ocorrer.
- source_word: λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας
  choice: pegou água e lavou as mãos
  rationale: Converte os particípios e o verbo principal numa sequência verbal natural, preservando a ação simbólica pública.
- source_word: ἀπέναντι τοῦ ὄχλου
  choice: diante da multidão
  rationale: Expressa tanto a posição quanto o caráter público e visível do gesto.
- source_word: Ἀθῷός εἰμι ἀπὸ τοῦ αἵματος τούτου
  choice: Sou inocente deste sangue
  rationale: Mantém de perto a construção grega e preserva a imagem bíblica de sangue como responsabilidade pela morte, sem acrescentar “homem” ao texto.
- source_word: ὑμεῖς ὄψεσθε
  choice: Vocês é que devem responder por isso
  rationale: A forma idiomática atribui aos interlocutores a responsabilidade de cuidar do assunto; “é que” preserva a ênfase do pronome explícito ὑμεῖς.
theological_decisions:
- issue: Declaração de inocência de Pilatos
  choice: Apresentar a fala como a alegação do próprio Pilatos, sem confirmar que ele era de fato inocente.
  alternative: Explicitar no texto que Pilatos estava rejeitando a responsabilidade pela morte de Jesus.
  rationale: 'O discurso direto preserva a tensão moral e narrativa: registra a reivindicação de Pilatos sem endossá-la nem refutá-la editorialmente.'
- issue: Responsabilidade expressa por ὑμεῖς ὄψεσθε
  choice: Traduzir de modo idiomático como “Vocês é que devem responder por isso”.
  alternative: Traduzir literalmente como “Vocês verão”.
  rationale: No contexto, a expressão transfere responsabilidade aos ouvintes. A tradução torna esse valor pragmático claro sem ampliar a culpa para além do grupo diretamente interpelado.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” corresponde ao plural explícito do grego; “multidão” preserva o cenário público. A ordem dos marcadores segue a ocorrência no texto.
