  naturalness: O português é claro e de registro adequado. “Nada conseguia” e “um tumulto estava começando” soam um pouco mais naturais e mantêm melhor o aspecto em curso do grego do que a construção original com dois “que”. “Vocês mesmos verão” é natural, preserva a ênfase do pronome explícito e evita explicitação interpretativa.
  terminology: “Pilatos”, “multidão”, “tumulto”, “sangue” e “inocente” são escolhas adequadas. “Deste sangue” preserva deliberadamente a formulação do grego sem inserir “deste homem”.
