  text: Ἐξερχόμενοι δὲ εὗρον ἄνθρωπον Κυρηναῖον ὀνόματι Σίμωνα· τοῦτον ἠγγάρευσαν ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/032.yaml
  text: And as they were going out[a], they found a man of Cyrene named Simon[b]. They compelled him to carry his cross.
translation:
  language: pt
  text: Ao saírem, encontraram um homem de Cirene chamado Simão. Obrigaram-no[a] a carregar a cruz de Jesus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “forçaram” ou “requisitaram para o serviço”. O verbo grego se refere a um serviço compulsório imposto por autoridade.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a cruz dele”; o pronome se refere a Jesus.
    reason: referent_clarification
lexical_decisions:
- source_word: Ἐξερχόμενοι
  choice: Ao saírem
  rationale: O particípio presente tem valor temporal e descreve uma ação simultânea à ação principal. “Ao saírem” é natural em português e preserva essa relação temporal.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui, δέ funciona como conectivo narrativo leve. A sequência entre as frases já cumpre essa função em português, sem exigir “e”, “então” ou “mas”.
- source_word: εὗρον
  choice: encontraram
  rationale: Equivalente direto e natural do aoristo de εὑρίσκω neste contexto narrativo.
- source_word: ἄνθρωπον Κυρηναῖον
  choice: um homem de Cirene
  rationale: Κυρηναῖον indica procedência geográfica. “De Cirene” é claro e idiomático em português.
- source_word: ὀνόματι Σίμωνα
  choice: chamado Simão
  rationale: A construção com ὀνόματι e o nome próprio é um modo convencional de indicar o nome da pessoa.
- source_word: τοῦτον
  choice: o
  rationale: O pronome oblíquo retoma Simão com naturalidade. Traduzir literalmente por “a este” daria ênfase desnecessária e soaria menos corrente.
- source_word: ἠγγάρευσαν
  choice: obrigaram
  rationale: O verbo designa serviço compulsório imposto por autoridade. “Obrigaram” comunica diretamente a coerção, sem acrescentar detalhes não explícitos.
- source_word: ἵνα ἄρῃ
  choice: a carregar
  rationale: A construção ἵνα com subjuntivo expressa finalidade. Depois de “obrigaram”, a construção portuguesa “a carregar” é natural; “carregar” expressa adequadamente αἴρω no contexto da marcha para a crucificação.
- source_word: τὸν σταυρὸν
  choice: a cruz
  rationale: “Cruz” é o equivalente convencional e semanticamente adequado; o grego não exige a especificação mais estreita “trave transversal”.
- source_word: αὐτοῦ
  choice: dele
  rationale: Preserva o pronome possessivo do texto grego, em vez de substituir explicitamente o referente por “Jesus”. O contexto identifica a cruz como pertencente a Jesus, embora a forma portuguesa isolada possa parecer ambígua.
theological_decisions:
- issue: Referente de αὐτοῦ (“dele”)
  choice: Manter o pronome “dele” no texto, entendido contextualmente como referência a Jesus.
  alternative: Explicitar “a cruz de Jesus”.
  rationale: O contexto narrativo indica que Simão foi obrigado a carregar a cruz do condenado, Jesus. A tradução mantém a forma pronominal do grego e registra o referente em nota, sem introduzir uma explicitação no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ao saírem” conserva a concisão narrativa; “um homem de Cirene chamado Simão” evita construções artificiais; “obrigaram” mantém a força coerciva do verbo grego. Os marcadores foram colocados junto às expressões que efetivamente explicam.
