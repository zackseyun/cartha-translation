  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι· ⸀βασιλεὺς Ἰσραήλ ἐστιν, καταβάτω νῦν ἀπὸ τοῦ σταυροῦ καὶ πιστεύσομεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/042.yaml
  text: He saved others; he cannot save himself. He is the King of Israel; let him come down now from the cross[a], and we will believe in him.
translation:
  language: pt
  text: Salvou os outros, mas não pode salvar a si mesmo. Ele é o Rei de Israel; que desça agora da cruz[a], e creremos nele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se ele é o Rei de Israel, que desça agora da cruz, e creremos nele.” Algumas traduções tornam explícito o sentido condicional da zombaria, mas o grego declara o título diretamente.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄλλους ἔσωσεν
  choice: Salvou os outros
  rationale: Mantém a concisão do aoristo e o contraste irônico entre “os outros” e “a si mesmo”; “salvar” preserva tanto a ideia de livramento quanto as ressonâncias mais amplas de σῴζω.
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: não pode salvar a si mesmo
  rationale: Expressão natural e clara em português, preservando a incapacidade alegada pelos zombadores e o pronome reflexivo enfático.
- source_word: βασιλεὺς Ἰσραήλ
  choice: o Rei de Israel
  rationale: Reproduz diretamente o título real afirmado de modo zombeteiro, sem introduzir uma condição ausente no grego.
- source_word: καταβάτω νῦν
  choice: Que desça agora
  rationale: O subjuntivo com “que” expressa naturalmente em português o imperativo de terceira pessoa e conserva o tom de desafio imediato.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: da cruz
  rationale: Equivalente direto e idiomático da expressão preposicional grega.
- source_word: πιστεύσομεν ἐπ’ αὐτόν
  choice: creremos nele
  rationale: “Crer em” com referência pessoal comunica adequadamente a confiança dirigida a Jesus; a contração “nele” é corrente e digna.
theological_decisions:
- issue: Formulação da alegação real zombeteira sobre Jesus
  choice: Ele é o Rei de Israel!
  alternative: Se ele é o Rei de Israel
  rationale: O grego apresenta diretamente a oração nominal, sem partícula condicional. A tradução conserva essa forma e deixa que o contexto comunique a ironia, em vez de explicitar uma condição não formulada no texto.
- issue: Força de πιστεύσομεν ἐπ’ αὐτόν
  choice: creremos nele
  alternative: confiaremos nele
  rationale: “Crer nele” preserva a formulação tradicional e natural da fé dirigida a uma pessoa sem limitar o sentido apenas a assentimento intelectual nem resolver toda a extensão semântica como “confiar”.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação é concisa e digna; “mas” explicita a oposição já inerente ao contraste grego, e a exclamação após o título ajuda a transmitir o tom de escárnio sem inserir léxico interpretativo.
