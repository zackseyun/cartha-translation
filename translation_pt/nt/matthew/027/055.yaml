  text: Ἦσαν δὲ ἐκεῖ γυναῖκες πολλαὶ ἀπὸ μακρόθεν θεωροῦσαι, αἵτινες ἠκολούθησαν τῷ Ἰησοῦ ἀπὸ τῆς Γαλιλαίας διακονοῦσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/055.yaml
  text: There were many women there[a], watching from a distance, who had followed Jesus from Galilee[b], serving him.
translation:
  language: pt
  text: Havia ali muitas mulheres, observando de longe[a], que haviam seguido Jesus desde a Galileia e o serviam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: olhando de longe.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: prestavam-lhe assistência. O verbo grego pode indicar serviço prático, cuidado ou apoio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ ἐκεῖ
  choice: Havia ali
  rationale: O imperfeito existencial é expresso naturalmente por “havia”; δέ funciona como conexão leve com o contexto e não exige uma conjunção explícita em português.
- source_word: γυναῖκες πολλαὶ
  choice: muitas mulheres
  rationale: Tradução direta e natural, preservando número e gênero.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: observando de longe
  rationale: O particípio presente indica observação contínua, e a locução mantém a distância espacial expressa no grego.
- source_word: αἵτινες ἠκολούθησαν τῷ Ἰησοῦ
  choice: que haviam seguido Jesus
  rationale: “Seguir” rege objeto direto em português. O mais-que-perfeito composto torna clara a anterioridade desse acompanhamento em relação à cena da crucificação.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: desde a Galileia
  rationale: “Desde” apresenta a Galileia como ponto inicial do acompanhamento, sentido natural da preposição neste contexto narrativo.
- source_word: διακονοῦσαι αὐτῷ
  choice: e o serviam
  rationale: A forma verbal preserva o sentido amplo de serviço contínuo e apoio, sem restringi-lo a tarefas domésticas nem atribuir-lhe um cargo eclesiástico formal.
theological_decisions:
- issue: A natureza do serviço prestado pelas mulheres
  choice: e o serviam
  alternative: prestando-lhe assistência; ministrando a ele
  rationale: διακονέω pode designar serviço concreto, cuidado ou apoio. “Serviam” mantém essa amplitude sem transformar a atividade em função eclesiástica formal.
- issue: A relação temporal entre o seguimento e a cena da crucificação
  choice: haviam seguido Jesus
  alternative: seguiram Jesus
  rationale: O mais-que-perfeito composto esclarece que o seguimento iniciado na Galileia antecedeu a observação presente, sem acrescentar uma conclusão sobre quando esse seguimento terminou.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva a unidade da frase grega, evita linguagem eclesiástica técnica e mantém o valor contínuo da observação e do serviço.
