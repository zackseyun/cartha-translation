  text: καὶ οὐκ ἀπεκρίθη αὐτῷ πρὸς οὐδὲ ἓν ῥῆμα, ὥστε θαυμάζειν τὸν ἡγεμόνα λίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/014.yaml
  text: And he did not answer him with even one word[b][a], so that the governor was greatly amazed.
translation:
  language: pt
  text: E ele não lhe respondeu nem uma só palavra, de modo que o governador ficou muito admirado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: O aoristo de forma passiva e sentido depoente de ἀποκρίνομαι significa aqui “responder”; a formulação é direta e natural em português.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome no dativo indica a pessoa a quem Jesus não respondeu; “lhe” preserva essa relação sem explicitar desnecessariamente Pilatos.
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: nem uma só palavra
  rationale: A expressão enfatiza a ausência total de resposta. “Nem uma só palavra” reproduz com naturalidade a força de οὐδὲ ἕν e toma ῥῆμα em seu sentido comum de “palavra” ou “declaração”.
- source_word: ὥστε
  choice: de modo que
  rationale: Introduz a consequência do silêncio de Jesus; “de modo que” exprime claramente o valor resultativo.
- source_word: θαυμάζειν
  choice: ficou ... admirado
  rationale: O infinitivo depois de ὥστε é naturalmente reestruturado como verbo finito em português. “Ficou admirado” comunica a reação resultante sem excessiva rigidez formal.
- source_word: τὸν ἡγεμόνα
  choice: o governador
  rationale: No contexto provincial romano, ἡγεμών designa o governador, especificamente Pilatos.
- source_word: λίαν
  choice: muito
  rationale: O advérbio intensifica a admiração; “muito” é corrente, claro e mantém o grau forte indicado pelo grego.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva a ênfase do grego no silêncio absoluto de Jesus e a relação consecutiva entre esse silêncio e a admiração do governador.
