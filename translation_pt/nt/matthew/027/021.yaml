base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/021.yaml
  text: But the governor answered them, “Which of the two do you want me to release for you?” And they said, “Barabbas.”
translation:
  language: pt
  text: 'Mas o governador lhes perguntou: “Qual dos dois vocês querem que eu solte para vocês?” Eles responderam: “Barrabás.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς
  choice: Mas o governador lhes perguntou
  rationale: A construção idiomática com particípio e verbo finito introduz a resposta de Pilatos. Como sua fala é uma pergunta, “lhes perguntou” evita o literalismo redundante “respondendo, disse-lhes”; “Mas” representa a transição levemente contrastiva de δέ.
- source_word: Τίνα ... ἀπὸ τῶν δύο
  choice: Qual dos dois
  rationale: A pergunta solicita uma escolha entre duas pessoas já apresentadas; “qual dos dois” é natural e preciso em português contemporâneo.
- source_word: θέλετε
  choice: vocês querem
  rationale: θέλω expressa desejo ou preferência. “Vocês querem” comunica diretamente o plural grego e tem ampla compreensão no português moderno.
- source_word: ἀπολύσω ὑμῖν
  choice: que eu solte
  rationale: No contexto jurídico, ἀπολύω significa pôr em liberdade. A construção com subjuntivo após θέλετε é expressa naturalmente por “querem que eu solte”; o dativo ὑμῖν fica suficientemente comunicado pelo contexto da escolha oferecida ao povo.
- source_word: οἱ δὲ εἶπαν
  choice: Eles responderam
  rationale: O pronome plural retoma a multidão no contexto, e “responderam” expressa naturalmente que a fala reage à pergunta, sem dar peso contrastivo excessivo a δέ.
- source_word: Τὸν Βαραββᾶν
  choice: Barrabás
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português; o artigo acusativo grego não precisa ser reproduzido.
theological_decisions: []
translation_notes:
  register: Português atual, digno e direto, com legibilidade brasileira e compreensão internacional. O uso de “vocês” torna explícito o plural de θέλετε sem recorrer ao regionalismo “vós”. Não são necessárias notas de rodapé neste versículo.
