  text: τινὲς δὲ τῶν ἐκεῖ ⸀ἑστηκότων ἀκούσαντες ἔλεγον ὅτι Ἠλίαν φωνεῖ οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/047.yaml
  text: But some of those standing there[a], when they heard it, were saying[b], “This man is calling Elijah.”
translation:
  language: pt
  text: 'Mas alguns dos que estavam ali de pé, ao ouvirem isso, diziam: “Este homem[a] está chamando Elias”[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “Este está chamando Elias”.
    reason: lexical_alternative
  - marker: b
    text: É provável que os presentes tenham entendido o clamor de Jesus no versículo anterior como um apelo a Elias.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς
  choice: alguns
  rationale: Expressa de modo natural o subconjunto indefinido indicado pelo plural grego.
- source_word: δὲ
  choice: Mas
  rationale: Marca a leve contraposição ou mudança narrativa entre o clamor de Jesus e a reação dos presentes.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: dos que estavam ali
  rationale: Conserva a referência concreta às pessoas presentes no local; em português, não é necessário explicitar a postura física para transmitir naturalmente a expressão.
- source_word: ἀκούσαντες
  choice: ao ouvirem isso
  rationale: Reproduz a anterioridade do particípio aoristo em relação ao verbo principal; “isso” retoma implicitamente o clamor do versículo anterior.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito português preserva o aspecto durativo ou reiterado do imperfeito grego sem impor repetição enfática.
- source_word: ὅτι
  choice: dois-pontos e discurso direto
  rationale: A conjunção introduz o conteúdo do que diziam; o discurso direto é a forma mais natural de apresentá-lo em português.
- source_word: Ἠλίαν
  choice: Elias
  rationale: É a forma portuguesa tradicional e amplamente reconhecida do nome do profeta.
- source_word: φωνεῖ
  choice: está chamando por
  rationale: No contexto, comunica naturalmente a ideia de clamar por alguém ou invocá-lo, sem afirmar que a percepção dos presentes era correta.
- source_word: οὗτος
  choice: Este homem
  rationale: Mantém a força dêitica do demonstrativo em linguagem portuguesa natural; a alternativa mais literal é registrada em nota.
theological_decisions:
- issue: Se a fala dos presentes deve ser formulada como realidade objetiva ou como percepção deles
  choice: 'Apresentar diretamente a afirmação deles: “Este homem está chamando por Elias”.'
  alternative: Explicitar no texto que eles pensavam ou entendiam que Jesus chamava Elias.
  rationale: O grego relata o que eles diziam, sem inserir no enunciado principal uma avaliação explícita da exatidão dessa interpretação. A nota contextualiza o provável mal-entendido sem resolver a tensão dentro do texto.
translation_notes:
  register: Português atual, digno e acessível, com ampla legibilidade brasileira. “Diziam” preserva o aspecto imperfeito; “ao ouvirem isso” liga naturalmente a reação ao clamor anterior. Os marcadores [a] e [b] aparecem no texto junto aos elementos que explicam.
