id: MAT.27.54
reference: Matthew 27:54
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ δὲ ἑκατόνταρχος καὶ οἱ μετ’ αὐτοῦ τηροῦντες τὸν Ἰησοῦν ἰδόντες τὸν σεισμὸν καὶ τὰ ⸀γενόμενα ἐφοβήθησαν σφόδρα λέγοντες· Ἀληθῶς ⸂θεοῦ υἱὸς⸃ ἦν οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/054.yaml
  text: When the centurion and those with him who were guarding Jesus saw the earthquake and the things that had happened[a], they were greatly afraid and said[c][b], “Truly this was the Son of God.”
translation:
  language: pt
  text: 'Quando o centurião e os que estavam com ele, guardando Jesus, viram o terremoto e tudo o que havia acontecido, ficaram com muito medo e disseram: “Verdadeiramente, este era o Filho de Deus.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um filho de Deus”. A expressão grega não tem artigo; neste contexto, o texto principal a entende como um título, em conformidade com a maneira como Mateus apresenta Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἑκατόνταρχος
  choice: centurião
  rationale: Termo português corrente e preciso para o oficial militar romano.
- source_word: τηροῦντες
  choice: guardando
  rationale: No contexto da execução, indica vigiar sob custódia, não apenas observar.
- source_word: ἰδόντες
  choice: quando ... viram
  rationale: Expressa naturalmente em português o valor temporal do particípio aoristo.
- source_word: σεισμόν
  choice: terremoto
  rationale: Sentido contextual direto de σεισμός na narrativa.
- source_word: τὰ γενόμενα
  choice: tudo o que havia acontecido
  rationale: Formulação natural que mantém a referência ampla aos acontecimentos, para além do terremoto.
- source_word: ἐφοβήθησαν σφόδρα
  choice: ficaram com muito medo
  rationale: Português atual e idiomático que preserva a forte intensidade de σφόδρα.
- source_word: Ἀληθῶς
  choice: Verdadeiramente
  rationale: Preserva o tom solene da declaração sem definir em excesso a compreensão teológica dos falantes.
- source_word: θεοῦ υἱὸς
  choice: o Filho de Deus
  rationale: Embora a expressão grega não tenha artigo, o contexto cristológico de Mateus favorece a leitura definida e titular; a possibilidade indefinida é registrada em nota.
- source_word: οὗτος
  choice: este
  rationale: Reproduz de modo direto o demonstrativo e conserva a força imediata da declaração.
theological_decisions:
- issue: Tradução de θεοῦ υἱὸς na declaração do centurião e dos soldados
  choice: o Filho de Deus
  alternative: um filho de Deus
  rationale: A construção sem artigo admite discussão, mas, no contexto narrativo e cristológico de Mateus, a leitura definida/titular é a mais provável. A alternativa indefinida permanece explícita em nota para preservar a tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “os que estavam com ele, guardando Jesus” mantém juntos o grupo e sua atividade sem a ambiguidade de sugerir que apenas parte dele guardava Jesus.
