  source_fidelity: A tradução preserva corretamente o plural de αὐτά, a destinação/aquisição expressa por εἰς τὸν ἀγρόν, «campo do oleiro», e a primeira pessoa μοι. Contudo, «havia ordenado» introduz um mais-que-perfeito que o aoristo συνέταξεν não exige; o perfeito simples português reproduz melhor a forma e evita explicitar uma relação temporal adicional.
  naturalness: «E as deram pelo campo do oleiro» é compreensível e natural em registro bíblico sóbrio. «Conforme o Senhor me ordenou» é mais direto e idiomático do que «conforme o Senhor me havia ordenado», sem perda de dignidade.
  terminology: «Oleiro» e «o Senhor» são escolhas estabelecidas e adequadas. A nota lexical deve apresentar alternativas flexionadas de modo compatível com a construção efetiva da frase.
