  text: καὶ ἔδωκαν αὐτὰ εἰς τὸν ἀγρὸν τοῦ κεραμέως, καθὰ συνέταξέν μοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/010.yaml
  text: and they gave them for the potter's field[b][a], just as the Lord directed me.
translation:
  language: pt
  text: e as deram pelo campo do oleiro, conforme o Senhor me ordenou.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me mandou” ou “me instruiu”, em vez de “me ordenou”.
    reason: lexical_alternative
  - marker: b
    text: Mateus conserva nesta citação ou alusão profética a primeira pessoa, “me”, em vez de adaptar a expressão ao contexto da narrativa.
    reason: cross_reference
lexical_decisions:
- source_word: ἔδωκαν
  choice: deram
  rationale: Preserva o sentido direto do aoristo de δίδωμι. No contexto, refere-se ao emprego das moedas, sem explicitar além do grego que elas foram 'pagas'.
- source_word: αὐτὰ
  choice: as
  rationale: O pronome neutro plural retoma as moedas de prata no contexto; em português, o pronome feminino plural concorda naturalmente com 'moedas'.
- source_word: εἰς τὸν ἀγρὸν
  choice: pelo campo
  rationale: Com δίδωμι neste contexto de aquisição, εἰς exprime a destinação ou contraprestação do dinheiro. 'Pelo campo' comunica naturalmente que as moedas foram dadas em troca dele.
- source_word: τοῦ κεραμέως
  choice: do oleiro
  rationale: 'Traduz naturalmente o genitivo singular e mantém a designação estabelecida no contexto: ''campo do oleiro''.'
- source_word: καθὰ
  choice: conforme
  rationale: Expressa a correspondência introduzida por καθά em português atual e digno.
- source_word: συνέταξέν
  choice: havia ordenado
  rationale: συντάσσω pode significar ordenar, determinar ou instruir. O mais-que-perfeito composto explicita em português a anterioridade implícita no aoristo dentro da citação.
- source_word: μοι
  choice: me
  rationale: Mantém sem harmonização a primeira pessoa singular presente no texto grego.
- source_word: κύριος
  choice: o Senhor
  rationale: Representa κύριος com artigo e conserva o título tradicional e contextual.
theological_decisions:
- issue: Referência do falante na citação ou alusão profética
  choice: Conservar a primeira pessoa, 'me', como no grego.
  alternative: Ajustar a frase ao contexto narrativo ou à redação da fonte veterotestamentária.
  rationale: O texto grego contém μοι ('me'). Preservá-lo mantém a transparência à forma recebida e não resolve silenciosamente a tensão relacionada ao uso da citação por Mateus.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem dos marcadores foi normalizada para [a][b], e ambos aparecem no texto principal. A tradução mantém a primeira pessoa da fonte grega e evita interpretar ἔδωκαν especificamente como 'pagaram'.
