    rationale: «Determinado» e «instruído» não podem substituir diretamente «ordenado» em «o Senhor me havia ordenado». A nota deve oferecer verbos adequadamente conjugados e sintaticamente compatíveis.
  revised_text: e as deram pelo campo do oleiro, conforme o Senhor me ordenou.[a][b]
