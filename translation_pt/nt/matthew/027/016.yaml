base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/016.yaml
  text: At that time they had a notorious prisoner called Jesus Barabbas[a].
translation:
  language: pt
  text: Naquela ocasião, eles tinham um prisioneiro notório chamado Jesus Barrabás[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem apenas “Barrabás”, omitindo “Jesus”.
    reason: textual_variant
lexical_decisions:
- source_word: εἶχον
  choice: eles tinham
  rationale: O imperfeito de ἔχω, com sujeito plural não expresso, indica que certas pessoas — provavelmente as autoridades responsáveis pela custódia — mantinham o homem preso. A formulação conserva essa ideia sem identificar além do texto o sujeito implícito.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: δέ é um conectivo narrativo leve. Em português, a ligação com o contexto já fica natural com a abertura temporal, e traduzi-lo por “ora” ou “mas” daria peso excessivo.
- source_word: τότε
  choice: naquele tempo
  rationale: Preserva de modo claro o valor temporal explícito de τότε.
- source_word: δέσμιον
  choice: prisioneiro
  rationale: Equivalente corrente e preciso para uma pessoa mantida sob custódia neste contexto judicial.
- source_word: ἐπίσημον
  choice: notório
  rationale: Embora possa significar “conhecido” ou “destacado”, no contexto de um prisioneiro a palavra provavelmente indica fama negativa; “notório” comunica essa nuance sem acrescentar um crime específico.
- source_word: λεγόμενον
  choice: chamado
  rationale: Forma natural em português para introduzir o nome ou a designação de alguém.
- source_word: Ἰησοῦν Βαραββᾶν
  choice: Jesus Barrabás
  rationale: Traduz diretamente a leitura do SBLGNT, que inclui Ἰησοῦν. A forma tradicional portuguesa do segundo nome é “Barrabás”; a variante mais curta é registrada em nota.
theological_decisions:
- issue: Forma textual do nome completo de Barrabás
  choice: 'Incluir “Jesus” no texto principal: “Jesus Barrabás”.'
  alternative: Ler apenas “Barrabás”, omitindo “Jesus”.
  rationale: O texto-fonte fornecido, SBLGNT, contém Ἰησοῦν Βαραββᾶν. A tradução segue essa leitura, enquanto a variante manuscrita amplamente conhecida é preservada em nota, sem ocultar a questão textual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Naquele tempo” é natural na narrativa; “eles tinham” mantém o sujeito plural implícito do grego sem especificar indevidamente as autoridades. O marcador [a] aparece no texto principal.
