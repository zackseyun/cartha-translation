source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς πᾶς ὁ λαὸς εἶπεν· Τὸ αἷμα αὐτοῦ ἐφ’ ἡμᾶς καὶ ἐπὶ τὰ τέκνα ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/025.yaml
  text: And all the people answered[a], “His blood be on us and on our children.”
translation:
  language: pt
  text: 'E todo o povo respondeu[a]: “Que o sangue dele caia sobre nós e sobre os nossos filhos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, as pessoas reunidas que falam nesta cena; estas palavras não devem ser entendidas como atribuição de culpa perpétua a todos os judeus de todas as gerações.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: respondeu
  rationale: O particípio aoristo, junto de εἶπεν, funciona idiomaticamente para introduzir uma resposta. Em português, “respondeu” comunica o sentido com naturalidade, sem a construção rígida “tendo respondido, disse”.
- source_word: πᾶς ὁ λαὸς
  choice: todo o povo
  rationale: A construção com πᾶς e o substantivo singular articulado tem sentido coletivo. “Todo o povo” preserva essa forma e se refere, no contexto narrativo, ao grupo reunido na cena.
- source_word: Τὸ αἷμα αὐτοῦ
  choice: o sangue dele
  rationale: A expressão mantém a imagem concreta do sangue e deixa implícita, como no grego, a ideia judicial de responsabilidade pela morte, sem explicá-la no corpo do texto.
- source_word: ἐφ’ ἡμᾶς
  choice: caia sobre nós
  rationale: A frase grega não traz verbo expresso. “Que ... caia sobre nós” supre em português uma formulação idiomática que preserva a força imprecativa ou de assunção de responsabilidade.
- source_word: ἐπὶ τὰ τέκνα ἡμῶν
  choice: e sobre os nossos filhos
  rationale: τέκνα significa naturalmente “filhos”. A repetição de “sobre” conserva o paralelismo e a ênfase da preposição repetida no grego.
theological_decisions:
- issue: Possível leitura antijudaica de πᾶς ὁ λαὸς
  choice: Traduzir como “todo o povo”, entendendo a expressão como referência coletiva às pessoas reunidas na cena narrativa.
  alternative: “toda a multidão” ou uma leitura que estenda a culpa a todos os judeus de todas as gerações
  rationale: O texto relata a resposta do grupo presente na cena. Deve-se preservar sua linguagem coletiva sem transformá-la numa afirmação étnica e trans-histórica de culpa perpétua.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção “Que o sangue dele caia...” é natural e preserva a força solene da declaração; “dele” evita uma capitalização interpretativa não presente no grego.
