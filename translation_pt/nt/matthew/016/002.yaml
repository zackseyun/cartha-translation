base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/002.yaml
  text: But he answered and said to them[a], “When evening comes, you say, ‘Fair weather, for the sky is red.’
translation:
  language: pt
  text: 'Mas ele lhes respondeu: “Ao cair da tarde, vocês dizem: ‘O tempo será bom, pois o céu está avermelhado.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: respondeu
  rationale: A combinação é uma fórmula narrativa semítica. Em português atual, “respondeu” comunica naturalmente tanto a reação quanto a introdução da fala, sem a redundância pouco idiomática de “respondeu e disse”.
- source_word: Ὀψίας γενομένης
  choice: Ao cair da tarde
  rationale: Expressa de modo natural o valor temporal do genitivo absoluto e a chegada do entardecer.
- source_word: λέγετε
  choice: vocês dizem
  rationale: O presente indica uma observação habitual, bem representada pelo presente simples em português.
- source_word: Εὐδία
  choice: O tempo será bom
  rationale: No dito meteorológico, o substantivo indica tempo favorável. A formulação com futuro explicita naturalmente em português a previsão feita ao entardecer.
- source_word: πυρράζει
  choice: está avermelhado
  rationale: Descreve a aparência rubra do céu; “avermelhado” é natural e preserva a ideia sem intensificá-la para “vermelho como fogo”.
- source_word: οὐρανός
  choice: céu
  rationale: No contexto meteorológico, refere-se ao céu visível. Em português, “céu” também conserva naturalmente a amplitude lexical que pode incluir o sentido de morada celeste.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A fórmula grega “tendo respondido, disse” foi vertida de modo idiomático como “respondeu”. Não se acrescentou nota a “céu”, pois a mesma palavra portuguesa já abrange naturalmente os sentidos de céu visível e céu como esfera celeste, enquanto o contexto deixa claro o uso meteorológico.
