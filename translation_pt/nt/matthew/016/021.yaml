id: MAT.16.21
reference: Matthew 16:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: pt
  text: A partir de então, Jesus começou a mostrar aos seus discípulos que era necessário que ele fosse a Jerusalém, sofresse muitas coisas da parte dos anciãos, dos principais sacerdotes e dos escribas, fosse morto e, no terceiro dia, fosse ressuscitado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: A partir de então
  rationale: Marca com naturalidade uma virada narrativa e o início de uma nova etapa no ensino de Jesus.
- source_word: ἤρξατο δεικνύειν
  choice: começou a mostrar
  rationale: Preserva tanto o aspecto ingressivo de ἤρξατο quanto o sentido básico de δεικνύειν, sem ampliar para “explicar”.
- source_word: δεῖ αὐτόν
  choice: era necessário que ele
  rationale: Expressa a necessidade forte indicada por δεῖ sem explicitar no texto a sua origem.
- source_word: εἰς Ἱεροσόλυμα ἀπελθεῖν
  choice: fosse a Jerusalém
  rationale: Forma corrente em português para movimento em direção a um destino; evita o pouco natural “partisse para” neste contexto.
- source_word: πολλὰ παθεῖν
  choice: sofresse muitas coisas
  rationale: Mantém o plural neutro do grego e sua possível ênfase na diversidade dos sofrimentos, embora “sofresse muito” fosse mais idiomático.
- source_word: ἀπὸ τῶν πρεσβυτέρων
  choice: da parte dos líderes do povo
  rationale: No contexto, πρεσβύτεροι designa um grupo de autoridades judaicas, não simplesmente pessoas idosas. A expansão funcional evita a leitura etária comum de “anciãos”.
- source_word: ἀρχιερέων
  choice: chefes dos sacerdotes
  rationale: Representa o grupo dirigente sacerdotal e evita sugerir vários ocupantes simultâneos do cargo singular de sumo sacerdote.
- source_word: γραμματέων
  choice: escribas
  rationale: Equivalente lexical direto e termo bíblico reconhecível em português.
- source_word: ἀποκτανθῆναι
  choice: fosse morto
  rationale: Reproduz de modo claro e natural o infinitivo passivo.
- source_word: τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι
  choice: no terceiro dia, fosse ressuscitado
  rationale: Preserva tanto a referência temporal quanto a voz passiva do verbo grego.
theological_decisions:
- issue: Força de δεῖ na predição da paixão
  choice: era necessário que ele
  alternative: ele tinha de
  rationale: Mantém a necessidade teológica ou narrativa sem determinar se a cláusula aponta especificamente para decreto divino, cumprimento das Escrituras ou outra dimensão.
- issue: Voz de ἐγερθῆναι
  choice: fosse ressuscitado
  alternative: ressuscitasse
  rationale: A forma grega é passiva. A tradução conserva essa voz e não explicita o agente, preservando a formulação e a tensão do texto.
- issue: Relação expressa por ἀπό com os grupos dirigentes
  choice: da parte dos
  alternative: pelas mãos dos
  rationale: “Da parte dos” preserva a relação ampla de origem ou agência indicada pela preposição, sem intensificá-la para a imagem mais interpretativa de “pelas mãos de”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção em série no subjuntivo mantém unidas as ações regidas por “era necessário”. “Líderes do povo” comunica a função contextual de πρεσβύτεροι; “escribas” conserva o termo histórico tradicional.
