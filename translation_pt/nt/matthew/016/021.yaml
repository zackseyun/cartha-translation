  source_fidelity: 'A estrutura da predição é bem preservada, incluindo a necessidade expressa por δεῖ e a voz passiva de «ser ressuscitado». Contudo, «líderes do povo» amplia πρεσβυτέρων: o grego nomeia especificamente os anciãos, sem acrescentar «do povo». «Chefes dos sacerdotes» é compreensível, mas «principais sacerdotes» é a designação histórica e bíblica mais estabelecida para ἀρχιερεῖς.'
  naturalness: A redação é clara e digna. A série de subjuntivos após «era necessário» é natural em português. «Anciãos, principais sacerdotes e escribas» é igualmente fluente e mais preciso no registro histórico.
  terminology: Substituir «líderes do povo» por «anciãos» conserva o título do grupo sem paráfrase funcional. Substituir «chefes dos sacerdotes» por «principais sacerdotes» representa idiomaticamente o plural ἀρχιερεῖς e evita uma formulação menos usual.
