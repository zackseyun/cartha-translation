  - severity: low
    issue: «chefes dos sacerdotes» para ἀρχιερέων
    rationale: Embora inteligível, a expressão é menos idiomática e menos convencional na terminologia bíblica portuguesa do que «principais sacerdotes».
  revised_text: A partir de então, Jesus começou a mostrar aos seus discípulos que era necessário que ele fosse a Jerusalém, sofresse muitas coisas da parte dos anciãos, dos principais sacerdotes e dos escribas, fosse morto e, no terceiro dia, fosse ressuscitado.
