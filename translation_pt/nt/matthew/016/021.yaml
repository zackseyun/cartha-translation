  to: A partir de então, Jesus começou a mostrar aos seus discípulos que era necessário que ele fosse a Jerusalém, sofresse muitas coisas da parte dos anciãos, dos principais sacerdotes e dos escribas, fosse morto e, no terceiro dia, fosse ressuscitado.
  rationale: A revisão elimina a expansão interpretativa de πρεσβυτέρων e emprega a terminologia histórica portuguesa mais consolidada para os grupos mencionados. Mantém-se «era necessário» para δεῖ, «muitas coisas» para πολλὰ, «da parte de» para ἀπό e «fosse ressuscitado» para o passivo ἐγερθῆναι.
