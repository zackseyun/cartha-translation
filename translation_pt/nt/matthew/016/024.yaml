id: MAT.16.24
reference: Matthew 16:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: pt
  text: 'Então Jesus disse aos seus discípulos: “Se alguém quer vir após mim, negue a si mesmo, tome a sua cruz e siga-me.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e fiel.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: aos seus discípulos
  rationale: “Discípulos” preserva a relação de aprendizado e seguimento própria do contexto dos Evangelhos.
- source_word: Εἴ τις θέλει
  choice: Se alguém quer
  rationale: Mantém tanto a condição quanto a ideia de vontade, e “alguém” comunica naturalmente o alcance genérico.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: vir após mim
  rationale: Preserva a imagem de ir atrás de Jesus sem fundi-la antecipadamente com o verbo explícito “seguir” no fim do versículo.
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: negue a si mesmo
  rationale: Expressa o imperativo de renúncia pessoal de maneira direta; a forma com “si mesmo” conserva o singular representativo do grego.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: tome a sua cruz
  rationale: “Tomar a cruz” é natural, solene e preserva a cruz individual atribuída a cada pessoa.
- source_word: ἀκολουθείτω μοι
  choice: siga-me
  rationale: Traduz de modo claro o imperativo presente; o contexto de discipulado comunica a continuidade do seguimento.
theological_decisions:
- issue: Singular gramatical masculino com sentido representativo
  choice: “Se alguém... negue a si mesmo, tome a sua cruz e siga-me”
  alternative: “Se alguém... negue a si própria, tome a própria cruz e siga-me”, ou uma formulação explicitamente plural
  rationale: O português permite conservar o singular genérico sem introduzir o pronome masculino “ele”. “Si mesmo” acompanha a forma singular e representativa do grego, enquanto “alguém” deixa claro que o convite abrange qualquer pessoa.
- issue: Relação entre “vir após mim” e “siga-me”
  choice: Manter as duas expressões distintas
  alternative: Traduzir a primeira como “seguir-me” e repetir a mesma ideia ao final
  rationale: O texto grego primeiro emprega a imagem de vir atrás de Jesus e depois ordena explicitamente segui-lo; conservar a distinção evita apagar a progressão retórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo dos três imperativos foram preservados; não são necessárias notas de rodapé, pois a formulação portuguesa transmite naturalmente o singular representativo.
