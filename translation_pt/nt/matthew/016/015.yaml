id: MAT.16.15
reference: Matthew 16:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/015.yaml
  text: He says to them[a], “But who do you say that I am?”
translation:
  language: pt
  text: 'Ele lhes diz: “Mas vocês, quem dizem que eu sou?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Ele diz
  rationale: Preserva o presente histórico grego e sua vivacidade narrativa; em português, o presente também é natural nesse uso.
- source_word: αὐτοῖς
  choice: lhes
  rationale: Representa de modo conciso e natural o pronome dativo plural como objeto indireto de dizer.
- source_word: Ὑμεῖς
  choice: vocês
  rationale: O pronome explícito é enfático e plural. “Vocês” comunica isso com clareza e ampla legibilidade brasileira.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste entre as opiniões mencionadas anteriormente e a resposta pessoal dos discípulos.
- source_word: τίνα
  choice: quem
  rationale: Equivalente interrogativo natural em português; na construção idiomática, funciona como predicativo em “quem ... eu sou”.
- source_word: με
  choice: eu
  rationale: Embora seja acusativo no discurso indireto grego, a reestruturação idiomática portuguesa com oração finita exige o pronome nominativo “eu”.
- source_word: λέγετε
  choice: dizem
  rationale: Traduz o presente ativo, segunda pessoa do plural, de maneira direta e natural.
- source_word: εἶναι
  choice: que eu sou
  rationale: A construção grega de acusativo com infinitivo é expressa naturalmente em português por uma oração finita introduzida por “que”.
theological_decisions:
- issue: Ênfase na avaliação pessoal dos discípulos
  choice: “Mas vocês, quem dizem que eu sou?”
  alternative: “E vocês, quem dizem que eu sou?”
  rationale: “Mas” preserva a oposição contextual às opiniões alheias, enquanto a presença explícita de “vocês” mantém a ênfase sem antecipar nem inserir a confissão teológica do versículo seguinte.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A colocação “lhes diz” evita uma formulação excessivamente literal, enquanto “vocês” explicita o plural e conserva a ênfase do pronome grego.
