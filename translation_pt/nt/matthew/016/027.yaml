id: MAT.16.27
reference: Matthew 16:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/027.yaml
  text: For the Son of Man is about to come in the glory of his Father with his angels[b][a], and then he will repay each one according to his deed.
translation:
  language: pt
  text: Pois o Filho do Homem está para vir[a] na glória de seu Pai, com os seus anjos, e então retribuirá a cada um segundo a sua conduta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «virá» ou «está para chegar». O grego diz literalmente «está para vir», preservando uma noção de iminência.
    reason: lexical_alternative
  - marker: b
    text: Ou «segundo a sua ação» ou «segundo o que fez». O grego traz o singular «ação/conduta», usado de modo distributivo para o modo de agir de cada pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλει
  choice: está para
  rationale: Preserva de modo natural em português a ideia de ação iminente ou prestes a ocorrer, sem reduzir a expressão a um simples futuro.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz de forma concisa a razão que sustenta a declaração anterior.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a designação tradicional, sua forma literal e suas ressonâncias intertextuais.
- source_word: ἔρχεσθαι
  choice: vir
  rationale: Completa naturalmente «está para» e conserva as associações escatológicas do verbo.
- source_word: ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ
  choice: na glória de seu Pai
  rationale: Mantém a preposição e deixa explícita a relação da glória com o Pai.
- source_word: μετὰ τῶν ἀγγέλων αὐτοῦ
  choice: com os seus anjos
  rationale: Expressa diretamente o acompanhamento indicado por μετά com o genitivo e preserva o possessivo.
- source_word: καὶ τότε
  choice: e então
  rationale: 'Preserva tanto a conexão quanto a sequência temporal: primeiro a vinda, depois a retribuição.'
- source_word: ἀποδώσει
  choice: retribuirá
  rationale: Comunica dar a cada pessoa o que lhe corresponde no contexto de juízo, sem limitar o sentido apenas a recompensa positiva.
- source_word: ἑκάστῳ
  choice: a cada um
  rationale: Preserva a força distributiva e individualizante do dativo singular.
- source_word: κατὰ τὴν πρᾶξιν αὐτοῦ
  choice: segundo a sua conduta
  rationale: πρᾶξις no singular pode designar a ação ou o modo de agir de cada pessoa; «conduta» conserva o singular e comunica naturalmente esse sentido abrangente em português.
theological_decisions:
- issue: Força escatológica de μέλλει na vinda do Filho do Homem
  choice: Manter a nuance de iminência com «está para vir».
  alternative: «virá» ou «está destinado a vir»
  rationale: O grego emprega μέλλω com infinitivo, acrescentando uma noção de ação iminente ou pendente. A tradução preserva essa tensão sem decidir debates mais amplos sobre a cronologia.
- issue: Juízo segundo a ação ou conduta de cada pessoa
  choice: Traduzir como «retribuirá a cada um segundo a sua conduta».
  alternative: «dará a cada um segundo o que fez» ou «retribuirá a cada um segundo a sua ação»
  rationale: A formulação conserva a retribuição individual no juízo sem inserir um sistema doutrinário externo. «Retribuirá» abrange resultado favorável ou desfavorável, e «conduta» representa o singular distributivo de πρᾶξις.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Está para vir» soa natural e mantém a iminência; «retribuirá» evita a ambiguidade de «recompensará», que pode sugerir apenas resultado positivo. Os marcadores foram posicionados imediatamente após as expressões que explicam.
