id: MAT.16.3
reference: Matthew 16:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: pt
  text: 'E, pela manhã: “Hoje haverá tempestade, pois o céu está avermelhado e carregado”. Vocês sabem discernir o aspecto do céu,[a] mas não conseguem discernir os sinais dos tempos.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o rosto do céu”.
    reason: lexical_alternative
  - marker: b
    text: “Os sinais dos tempos” pode referir-se mais especificamente ao significado espiritual do momento presente, incluindo as obras messiânicas de Jesus.
    reason: alternative_reading
  - marker: c
    text: Alguns manuscritos antigos omitem desde “E, pela manhã” até o fim do versículo.
    reason: textual_variant
lexical_decisions:
- source_word: πρωΐ
  choice: pela manhã
  rationale: Expressão temporal adverbial natural em português, em contraste com a observação meteorológica anterior.
- source_word: χειμών
  choice: haverá tempestade
  rationale: Neste contexto, o substantivo indica mau tempo ou tempestade, não a estação do inverno; a forma verbal completa naturalmente a frase nominal grega.
- source_word: πυρράζει
  choice: está avermelhado
  rationale: Transmite a coloração rubra do céu sem intensificar indevidamente o verbo.
- source_word: στυγνάζων
  choice: carregado
  rationale: Descreve o céu sombrio e ameaçador em linguagem meteorológica corrente.
- source_word: πρόσωπον
  choice: aspecto
  rationale: Embora o sentido básico seja “rosto”, aqui designa a aparência visível do céu.
- source_word: γινώσκετε διακρίνειν
  choice: sabem discernir
  rationale: Preserva tanto a ideia de capacidade adquirida quanto a de avaliar ou interpretar corretamente.
- source_word: σημεῖα
  choice: sinais
  rationale: Mantém a terminologia ampla de Mateus, com possíveis nuances evidenciais e reveladoras.
- source_word: καιρῶν
  choice: dos tempos
  rationale: Refere-se a momentos ou períodos significativos, não simplesmente às estações meteorológicas.
- source_word: οὐ δύνασθε
  choice: não conseguem discernir
  rationale: Expressa incapacidade e repete o verbo da primeira oração para tornar claro o contraste implícito no grego.
theological_decisions:
- issue: Sentido de “os sinais dos tempos”
  choice: Manter a expressão ampla, sem restringi-la exclusivamente a sinais escatológicos.
  alternative: “os sinais deste tempo presente” ou “os sinais messiânicos desta era”
  rationale: A repreensão diz respeito à incapacidade de reconhecer a importância espiritual do momento presente, possivelmente incluindo as obras messiânicas de Jesus e implicações escatológicas. O grego não obriga a escolher apenas uma dessas dimensões.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Céu carregado” conserva a imagem meteorológica sem soar técnico; “vocês” oferece clareza corrente para o plural dirigido aos interlocutores.
