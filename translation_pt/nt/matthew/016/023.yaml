  terminology: “Satanás”, “pedra de tropeço” e “coisas de Deus” são escolhas adequadas, reconhecíveis e semanticamente fiéis. “Vá para trás de mim” conserva a dimensão espacial de Ὕπαγε ὀπίσω μου sem resolver a possível ressonância discipular. A nota mantém de modo apropriado a formulação tradicional.
