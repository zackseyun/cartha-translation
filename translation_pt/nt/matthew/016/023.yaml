  source_fidelity: 'O texto preserva bem a sequência e os elementos centrais do grego: Jesus se volta para Pedro, ordena-lhe que vá para trás dele, chama-o de Satanás, caracteriza-o como obstáculo e contrasta o que é de Deus com o que é humano. “Seres humanos” traduz adequadamente ἀνθρώπων neste contraste e não exige nota explicativa. A única melhora recomendada é para φρονεῖς, que denota orientação/disposição mental mais estável que o simples ato de pensar.'
