  to: 'Mas ele se virou e disse a Pedro: “Vá para trás de mim, Satanás![a] Você é uma pedra de tropeço para mim, porque não tem em mente as coisas de Deus, mas as dos seres humanos.”'
  rationale: A revisão limita-se a substituir “não pensa nas coisas de Deus” por “não tem em mente as coisas de Deus”, expressão que representa mais precisamente a orientação mental indicada por φρονεῖς e soa natural em português moderno. Não se altera a ambiguidade teológica do tratamento “Satanás”, nem o contraste amplo entre o que é de Deus e o que é humano.
