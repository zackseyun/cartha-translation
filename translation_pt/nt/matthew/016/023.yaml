id: MAT.16.23
reference: Matthew 16:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: pt
  text: 'Mas ele se virou e disse a Pedro: “Vá para trás de mim, Satanás![a] Você é uma pedra de tropeço para mim, porque não tem em mente as coisas de Deus, mas as dos seres humanos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme a formulação mais tradicional: “Para trás de mim, Satanás!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: se virou
  rationale: Expressa naturalmente em português o particípio aoristo usado com sentido intransitivo e preserva a mudança de direção antes da fala.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Vá para trás de mim
  rationale: Mantém tanto o imperativo de ὕπαγε quanto o sentido espacial de ὀπίσω, sem reduzir a expressão simplesmente a uma ordem de afastamento.
- source_word: Σατανᾶ
  choice: Satanás
  rationale: Preserva o nome ou título no vocativo e a força da repreensão, sem decidir se Pedro é identificado com Satanás ou atua como adversário.
- source_word: σκάνδαλον
  choice: pedra de tropeço
  rationale: Conserva a metáfora de um obstáculo que faz tropeçar; em português bíblico corrente, é mais concreta e precisa que “ofensa”.
- source_word: ἐμοῦ
  choice: para mim
  rationale: Com σκάνδαλον, identifica naturalmente em português a pessoa para quem Pedro constitui obstáculo.
- source_word: φρονεῖς
  choice: pensa
  rationale: No contraste expresso pelo contexto, “pensa nas coisas de” comunica de modo natural a orientação mental e os interesses de Pedro; a construção completa evita a ideia de mero pensamento passageiro.
- source_word: τὰ τοῦ θεοῦ
  choice: as coisas de Deus
  rationale: Preserva a expressão substantivada e o contraste deliberadamente amplo do grego, sem especificar “interesses” ou “planos”.
- source_word: τὰ τῶν ἀνθρώπων
  choice: as dos seres humanos
  rationale: “As” retoma “coisas”, e “seres humanos” transmite o valor genérico de ἀνθρώπων de forma clara no português atual, em contraste com Deus.
theological_decisions:
- issue: Força do tratamento “Satanás” dirigido a Pedro
  choice: Manter “Satanás” como interpelação direta e sem explicação no texto principal.
  alternative: Traduzir como “adversário” ou explicitar que Satanás estaria agindo por meio de Pedro.
  rationale: O grego sustenta uma repreensão incisiva, mas não obriga a tradução a definir a relação exata entre Pedro e Satanás. A forma tradicional preserva a tensão e a ressonância narrativa.
- issue: Sentido de Ὕπαγε ὀπίσω μου
  choice: Preservar a dimensão espacial e discipular com “Vá para trás de mim”.
  alternative: Usar a fórmula tradicional “Para trás de mim” ou interpretar como simples “Afaste-se de mim”.
  rationale: A formulação escolhida permite tanto a força da repreensão quanto a possível ideia de que Pedro deve voltar ao lugar de seguidor, sem impor essa interpretação.
- issue: Referência genérica de ἀνθρώπων
  choice: Traduzir por “seres humanos”.
  alternative: “homens” ou “pessoas”.
  rationale: Nesse contexto, o plural contrasta o âmbito humano em geral com o de Deus, e não pessoas do sexo masculino especificamente. “Seres humanos” preserva com precisão esse contraste.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo do grego foram preservados quando naturais. “Pedra de tropeço” mantém a imagem concreta; “seres humanos” deixa explícito o alcance genérico do contraste.
