id: MAT.16.18
reference: Matthew 16:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: pt
  text: 'E eu também lhe digo: você é Pedro, e sobre esta pedra[a] edificarei a minha igreja; e as portas do Hades[b] não prevalecerão contra ela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Esta pedra” pode ser entendida como referência ao próprio Pedro, à confissão de Pedro, ou a Pedro como aquele que confessa e como representante dos apóstolos.
    reason: alternative_reading
  - marker: b
    text: 'Grego: “Hades”, isto é, o domínio dos mortos. Tradicionalmente, “inferno”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δέ
  choice: E eu também
  rationale: Preserva a ênfase de κἀγώ (“eu também”) e a continuação ou leve contraste marcado por δέ, em resposta à declaração de Pedro.
- source_word: σοι λέγω
  choice: lhe digo
  rationale: Forma natural e digna em português para introduzir a declaração direta, mantendo o sentido de λέγω e o objeto indireto σοι.
- source_word: Πέτρος
  choice: Pedro
  rationale: Emprega a forma tradicional do nome em português e conserva o jogo verbal perceptível entre “Pedro” e “pedra”.
- source_word: ἐπὶ ταύτῃ τῇ πέτρᾳ
  choice: sobre esta pedra
  rationale: Traduz diretamente ἐπί com dativo e preserva a força demonstrativa de ταύτῃ sem definir o referente disputado de “esta pedra”.
- source_word: οἰκοδομήσω
  choice: edificarei
  rationale: Mantém a metáfora de construção de οἰκοδομέω. “Edificarei” é corrente no registro bíblico, inteligível e mais fiel à imagem do que “estabelecerei”.
- source_word: μου τὴν ἐκκλησίαν
  choice: a minha igreja
  rationale: “Igreja” é a expressão portuguesa convencional e contextualmente adequada para a comunidade pertencente a Jesus; o possessivo é preservado de modo explícito.
- source_word: πύλαι ᾅδου
  choice: as portas do Hades
  rationale: “Hades” representa com precisão ᾅδης, o domínio dos mortos, sem confundi-lo automaticamente com a ideia de punição final associada a “inferno”.
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: não prevalecerão contra ela
  rationale: Expressa naturalmente o sentido adversativo de κατισχύω, isto é, vencer, dominar ou mostrar-se mais forte; “ela” retoma “igreja”.
theological_decisions:
- issue: Referente de “esta pedra” (πέτρᾳ)
  choice: A tradução mantém “esta pedra” sem identificar explicitamente seu referente.
  alternative: Entender a pedra como o próprio Pedro, como a confissão de Pedro, ou como Pedro na condição de confessor e representante apostólico.
  rationale: O grego mantém o jogo verbal entre Πέτρος e πέτρα, mas não explicita na frase qual formulação interpretativa deve resolver a relação entre ambos. A tradução preserva essa ambiguidade e a tensão teológica do texto.
- issue: Tradução de ᾅδης
  choice: Hades
  alternative: inferno; domínio dos mortos
  rationale: “Hades” evita importar para o termo as associações específicas de punição final frequentemente ligadas a “inferno” e preserva melhor seu sentido de domínio dos mortos neste contexto.
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Você” evita a solenidade arcaizante de “tu” em grande parte do uso brasileiro, enquanto “edificarei” conserva a metáfora arquitetônica e o tom bíblico. Os marcadores foram colocados junto aos termos que as notas efetivamente esclarecem: [a] após “pedra” e [b] após “Hades”.'
