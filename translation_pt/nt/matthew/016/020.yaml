  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: pt
  text: Então ele ordenou expressamente aos discípulos que não dissessem a ninguém que ele é o Messias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”. O título grego Χριστός é traduzido aqui como “Messias” para preservar seu sentido como título.'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca a sequência da narrativa de modo conciso e natural em português.
- source_word: διεστείλατο
  choice: ordenou expressamente
  rationale: Comunica a força de uma determinação enfática sem sugerir necessariamente uma advertência de perigo.
- source_word: τοῖς μαθηταῖς
  choice: aos discípulos
  rationale: Mantém o grupo definido no grego sem acrescentar o possessivo implícito.
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: que não dissessem a ninguém
  rationale: Expressa naturalmente em português o conteúdo da ordem e a proibição absoluta.
- source_word: ὅτι αὐτός ἐστιν
  choice: que ele era
  rationale: No discurso indireto em português, a concordância temporal com o verbo passado favorece 'era', sem negar que a afirmação continue verdadeira.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Traduz Χριστός como título messiânico reconhecido, em vez de tratá-lo como nome próprio.
theological_decisions:
- issue: Tradução de Χριστός como título
  choice: o Messias
  alternative: o Cristo
  rationale: Neste contexto, Χριστός funciona como título. 'Messias' preserva de forma clara seu sentido régio e ungido de origem judaica, enquanto a alternativa tradicional é registrada em nota.
- issue: Tempo verbal no discurso indireto
  choice: ele era
  alternative: ele é
  rationale: O grego traz ἐστιν no presente, mas o português natural costuma ajustar o tempo após uma ordem narrada no passado. Essa concordância não resolve nem altera a identidade afirmada; 'ele é' continua sendo tradução formalmente possível.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação evita arcaísmos e conserva a força da ordem e o caráter titular de Χριστός.
