  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: pt
  text: 'Mas Jesus lhes disse: “Fiquem atentos e tenham cuidado com o fermento[a] dos fariseus e dos saduceus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “fermento” é uma metáfora que Jesus explica mais adiante em relação ao ensino dos fariseus e dos saduceus.
    reason: esclarecimento_metaforico
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição com leve contraste em relação ao contexto anterior; “Mas” reproduz essa função naturalmente em português.
- source_word: εἶπεν αὐτοῖς
  choice: lhes disse
  rationale: Forma corrente e transparente de expressar o verbo de fala com objeto indireto.
- source_word: Ὁρᾶτε
  choice: Fiquem atentos
  rationale: O imperativo funciona aqui como alerta, não como simples ordem para ver; a formulação comunica essa força em português atual.
- source_word: προσέχετε
  choice: tenham cuidado
  rationale: Reforça o primeiro imperativo e preserva a duplicação retórica da advertência sem soar artificial.
- source_word: ἀπὸ
  choice: com
  rationale: Depois de “tenham cuidado”, o português idiomático pede “com”; essa construção expressa adequadamente a ideia de precaução diante de algo.
- source_word: ζύμης
  choice: fermento
  rationale: “Fermento” é o equivalente natural e amplamente compreensível em português, preservando a imagem figurada sem antecipar sua explicação posterior.
- source_word: Φαρισαίων
  choice: fariseus
  rationale: Forma tradicional e padronizada em português para o nome do grupo.
- source_word: Σαδδουκαίων
  choice: saduceus
  rationale: Forma tradicional e padronizada em português para o nome do grupo.
theological_decisions:
- issue: Sentido metafórico de ζύμη
  choice: Manter “fermento” como metáfora no texto principal.
  alternative: Explicitar como “ensino” ou “influência”.
  rationale: O versículo emprega a imagem figurada, cuja explicação aparece mais adiante no contexto. Preservá-la evita antecipar ou restringir o sentido.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A combinação “Fiquem atentos e tenham cuidado” conserva os dois imperativos gregos e sua ênfase cumulativa.
