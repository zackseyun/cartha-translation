  source_fidelity: A tradução de προσλαβόμενος como “o levou à parte” e de ἤρξατο ἐπιτιμᾶν como “começou a repreendê-lo” reproduz bem a sequência e o sentido do grego. “Isso jamais te acontecerá” transmite adequadamente a negação enfática οὐ μή. Contudo, “Deus tenha misericórdia de ti” torna explícito “Deus”, que não está expresso no enunciado grego elíptico Ἵλεώς σοι e cuja formulação exata é idiomática e discutida.
  naturalness: “Pedro o levou à parte” é mais natural e temporalmente definido do que “Pedro, levando-o à parte”. “Longe de ti, Senhor!” é uma formulação digna, compreensível e idiomática em português moderno para preservar a força da rejeição sem preencher a elipse.
  terminology: “Senhor” preserva corretamente κύριε. Mantêm-se “te/ti” como formas de segunda pessoa coerentes com o registro solene da fala direta; “jamais” exprime com clareza a ênfase de οὐ μή.
