source:
  edition: SBLGNT
  text: καὶ προσλαβόμενος αὐτὸν ὁ Πέτρος ἤρξατο ἐπιτιμᾶν αὐτῷ λέγων· Ἵλεώς σοι, κύριε· οὐ μὴ ἔσται σοι τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/022.yaml
  text: And Peter took him aside and began to rebuke him[a], saying, “Far be it from you, Lord; this will certainly not happen to you.”
translation:
  language: pt
  text: 'E Pedro o levou à parte e começou a repreendê-lo, dizendo: “Longe de ti, Senhor![a] Isso jamais te acontecerá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus tenha misericórdia de ti, Senhor!”; ou: “Deus te livre, Senhor!” A expressão grega é idiomática e elíptica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσλαβόμενος
  choice: levando-o à parte
  rationale: No contexto, o particípio médio indica que Pedro chamou Jesus para junto de si, provavelmente em particular; a expressão portuguesa comunica esse movimento com naturalidade.
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: começou a repreendê-lo
  rationale: Preserva a construção ingressiva com ἄρχομαι e o sentido forte de censura de ἐπιτιμάω.
- source_word: Ἵλεώς σοι
  choice: Deus tenha misericórdia de ti
  rationale: Explicita em português o sentido provável da expressão idiomática e elíptica, que invoca favor ou misericórdia; a nota registra alternativas que não explicitam Deus.
- source_word: κύριε
  choice: Senhor
  rationale: Mantém o valor lexical usual e a ressonância cristológica da forma de tratamento dirigida a Jesus.
- source_word: οὐ μὴ ἔσται σοι τοῦτο
  choice: Isso jamais te acontecerá
  rationale: A combinação οὐ μή com o futuro exprime negação enfática; “jamais” transmite essa força de modo natural e conciso.
theological_decisions:
- issue: Como traduzir o protesto de Pedro sem acrescentar uma interpretação teológica indevida
  choice: Deus tenha misericórdia de ti, Senhor! Isso jamais te acontecerá.
  alternative: Longe de ti isso, Senhor! Isso jamais te acontecerá. / Deus te livre, Senhor! Isso jamais te acontecerá.
  rationale: A expressão grega Ἵλεώς σοι é idiomática e elíptica. O texto principal torna explícita sua provável invocação de misericórdia ou favor divino, enquanto a nota preserva traduções possíveis que refletem sua força de rejeição sem decidir silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “ti” foi mantido por ocorrer em fala direta dirigida a Jesus e soar natural nesta construção; evitou-se linguagem excessivamente arcaica.
