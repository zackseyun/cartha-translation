id: MAT.16.28
reference: Matthew 16:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι εἰσίν τινες ⸂τῶν ὧδε ἑστώτων⸃ οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν τῇ βασιλείᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/028.yaml
  text: Truly I tell you[c][b][a], there are some standing here who will certainly not taste death until they see the Son of Man coming in his kingdom.
translation:
  language: pt
  text: 'Em verdade lhes digo: alguns dos que estão aqui certamente não provarão a morte[a] até que vejam o Filho do Homem vindo em seu reino[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de modo nenhum provarão a morte”; o grego emprega uma negação enfática.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “o Filho do Homem vindo em seu reino” pode se referir à transfiguração, à ressurreição e exaltação, ao juízo sobre Jerusalém ou à vinda final; o próprio texto não especifica qual acontecimento está em vista.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “em seu reinado” ou “em seu governo real”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Em verdade
  rationale: Introduz a declaração como uma afirmação solene e autorizada; a expressão é clara em português atual e preserva o tom bíblico sem depender de transliteração.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Forma natural e direta em português, mantendo a segunda pessoa plural abrangida por ὑμῖν.
- source_word: εἰσίν τινες τῶν ὧδε ἑστώτων
  choice: alguns dos que estão aqui
  rationale: 'Preserva explicitamente o sentido partitivo: trata-se de alguns entre os presentes.'
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: certamente não provarão a morte
  rationale: A combinação οὐ μή com o subjuntivo expressa negação enfática. A tradução mantém essa força e conserva a metáfora vívida de “provar a morte”.
- source_word: ἕως ἂν ἴδωσιν
  choice: até que vejam
  rationale: Equivalente natural da construção temporal voltada para um acontecimento futuro.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém o título empregado por Jesus e suas ressonâncias bíblicas e apocalípticas, sem paráfrase interpretativa.
- source_word: ἐρχόμενον
  choice: vindo
  rationale: Traduz diretamente o particípio que modifica “o Filho do Homem”, sem acrescentar elementos como “com poder”, ausentes do versículo.
- source_word: ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: em seu Reino
  rationale: “Reino” preserva a imagem tradicional e a amplitude semântica de βασιλεία, embora “reinado” ou “governo real” também sejam possíveis.
theological_decisions:
- issue: Referente de “o Filho do Homem vindo em seu Reino”
  choice: Manter a formulação sem identificar um acontecimento específico
  alternative: A transfiguração, a ressurreição/exaltação, Pentecostes, o juízo sobre Jerusalém ou a vinda final
  rationale: O texto grego não especifica inequivocamente o acontecimento. A tradução preserva a ambiguidade e a tensão interpretativa.
- issue: Sentido de βασιλεία
  choice: Reino
  alternative: reinado; governo real
  rationale: “Reino” conserva a imagem concreta e o uso bíblico estabelecido, sem restringir o termo apenas ao exercício abstrato do governo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva expressões bíblicas reconhecíveis (“Em verdade”, “provarão a morte”, “Filho do Homem”) quando continuam claras. A inicial maiúscula em “Reino” sinaliza a referência ao reino do Filho do Homem sem definir se βασιλεία enfatiza domínio, governo ou esfera régia.
