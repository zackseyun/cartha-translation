id: MAT.16.1
reference: Matthew 16:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ Φαρισαῖοι καὶ Σαδδουκαῖοι πειράζοντες ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/001.yaml
  text: And the Pharisees and Sadducees came and[a], testing him, asked him to show them a sign from heaven.
translation:
  language: pt
  text: Os fariseus e os saduceus aproximaram-se e, pondo-o à prova[a], pediram-lhe que lhes mostrasse um sinal do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tentando-o” ou “tentando apanhá-lo numa armadilha”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: se aproximaram
  rationale: O particípio aoristo de προσέρχομαι indica que eles foram até Jesus antes de fazer o pedido; “se aproximaram” expressa isso com naturalidade.
- source_word: Φαρισαῖοι
  choice: fariseus
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do grupo.
- source_word: Σαδδουκαῖοι
  choice: saduceus
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do grupo.
- source_word: πειράζοντες
  choice: para pô-lo à prova
  rationale: Preserva o sentido de testar e a intenção adversarial sugerida pelo contexto, sem explicitar além do grego que pretendiam armar uma cilada.
- source_word: ἐπηρώτησαν
  choice: pediram
  rationale: Com o infinitivo ἐπιδεῖξαι, o verbo introduz naturalmente em português o pedido para que Jesus realizasse uma ação.
- source_word: σημεῖον
  choice: um sinal
  rationale: Mantém o termo amplo do grego, sem acrescentar “milagroso”, embora o contexto possa sugerir um sinal sobrenatural de validação.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vindo do céu
  rationale: Expressa de modo idiomático a origem do sinal indicada por ἐκ.
- source_word: ἐπιδεῖξαι
  choice: mostrasse
  rationale: O infinitivo significa exibir ou mostrar; a oração com “que” é mais natural depois de “pediram” em português.
theological_decisions:
- issue: Nuance hostil do pedido dos fariseus e saduceus
  choice: “para pô-lo à prova”
  alternative: “para tentá-lo” ou “tentando apanhá-lo numa armadilha”
  rationale: A opção conserva a dimensão adversarial de πειράζω sem restringi-la ao sentido moral de induzir ao pecado nem tornar explícita uma armadilha que o texto não nomeia.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem da frase foi ajustada à sintaxe portuguesa sem perder a sequência e a tensão do original.
