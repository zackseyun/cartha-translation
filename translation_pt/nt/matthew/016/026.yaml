id: MAT.16.26
reference: Matthew 16:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: pt
  text: Pois que benefício terá uma pessoa se ganhar o mundo inteiro, mas perder a própria vida? Ou o que alguém dará em troca de sua vida?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alma”, nas duas ocorrências de “vida”. A palavra grega ψυχή pode significar “vida”, “ser” ou “alma”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Pois que
  rationale: Introduz a pergunta retórica e preserva a força explicativa de γάρ, ligando o versículo ao ensino anterior.
- source_word: ὠφεληθήσεται ἄνθρωπος
  choice: que benefício terá uma pessoa
  rationale: Expressa de modo natural em português o sentido passivo de receber proveito; ἄνθρωπος é genérico neste contexto.
- source_word: τὸν κόσμον ὅλον
  choice: o mundo inteiro
  rationale: Reproduz a totalidade enfatizada por ὅλον em linguagem corrente.
- source_word: κερδήσῃ
  choice: ganhar
  rationale: Mantém a metáfora econômica e o contraste com a perda subsequente.
- source_word: τὴν ... ψυχὴν αὐτοῦ ζημιωθῇ
  choice: perder a própria vida
  rationale: ζημιόω indica sofrer perda ou ser privado de algo; ψυχή aqui pode designar a vida, a pessoa ou a alma. 'Vida' funciona naturalmente no texto principal, enquanto 'alma' é preservada em nota.
- source_word: ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ
  choice: em troca de sua vida
  rationale: ἀντάλλαγμα designa aquilo que se dá em troca; a formulação conserva a imagem de intercâmbio sem introduzir especificamente a ideia de resgate.
theological_decisions:
- issue: Sentido de ψυχή na perda definitiva
  choice: vida
  alternative: alma
  rationale: O termo pode abranger a vida ou o próprio ser da pessoa, sem exigir aqui uma distinção técnica entre corpo e alma. A alternativa tradicional e semanticamente possível 'alma' permanece explícita na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A alternância entre 'uma pessoa' e 'alguém' evita rigidez sem alterar o referente humano genérico; a metáfora de ganho, perda e troca foi preservada.
