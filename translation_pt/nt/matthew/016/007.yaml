  text: οἱ δὲ διελογίζοντο ἐν ἑαυτοῖς λέγοντες ὅτι Ἄρτους οὐκ ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/007.yaml
  text: And they were discussing among themselves[a], saying, “We did not bring bread.”
translation:
  language: pt
  text: 'E eles discutiam entre si, dizendo: “Não trouxemos[a] pão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não levamos pão conosco”.'
    reason: Alternativa lexical para οὐκ ἐλάβομεν, preservando mais diretamente o sentido de tomar ou levar consigo.
lexical_decisions:
- source_word: διελογίζοντο
  choice: discutiam
  rationale: O imperfeito indica uma discussão ou ponderação em andamento. “Discutiam” é natural em português e não implica necessariamente uma disputa.
- source_word: ἐν ἑαυτοῖς
  choice: entre si
  rationale: A expressão indica que a conversa ocorria dentro do próprio grupo dos discípulos.
- source_word: λέγοντες
  choice: dizendo
  rationale: O particípio introduz diretamente o conteúdo da discussão e pode ser preservado com naturalidade.
- source_word: ὅτι
  choice: introdução do discurso direto, sem equivalente lexical separado
  rationale: Neste contexto, ὅτι introduz o conteúdo do que diziam. Os dois-pontos e as aspas expressam essa função sem acrescentar a inferência “é porque”, que não está explicitada no grego.
- source_word: Ἄρτους
  choice: pão
  rationale: Embora a forma grega seja plural, refere-se aqui ao pão como provisão; o singular coletivo “pão” é a forma idiomática em português.
- source_word: οὐκ ἐλάβομεν
  choice: não trouxemos
  rationale: No contexto de provisões para uma viagem, λαμβάνω tem o sentido de levar consigo. Em português, “trouxemos” comunica naturalmente que eles não tinham levado pão consigo, embora “levamos conosco” permaneça possível.
- source_word: οἱ δὲ
  choice: Eles
  rationale: δέ é um conectivo narrativo leve. Em português, a continuidade pode ser expressa naturalmente sem um conectivo explícito, evitando uma oposição mais forte do que o grego exige.
