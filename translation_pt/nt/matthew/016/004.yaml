  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: pt
  text: Uma geração má e adúltera[a] busca um sinal, e nenhum sinal lhe será dado, exceto o sinal de Jonas[b]. E, deixando-os, foi embora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “infiel”. O grego diz literalmente “adúltera”, provavelmente evocando a linguagem profética sobre a infidelidade para com Deus.
    reason: lexical_alternative
  - marker: b
    text: Em Mateus 12:39–40, “o sinal de Jonas” é explicado pela comparação entre os três dias e três noites de Jonas e os do Filho do Homem.
    reason: cross_reference
lexical_decisions:
- source_word: Γενεὰ
  choice: geração
  rationale: Preserva o sentido usual de γενεά em Mateus, referindo-se ao grupo contemporâneo caracterizado pela incredulidade, sem o parafrasear como “povo”.
- source_word: πονηρὰ
  choice: má
  rationale: É uma tradução direta e corrente para a corrupção moral expressa por πονηρός; “perversa” seria possível, mas um pouco mais enfática.
- source_word: μοιχαλὶς
  choice: adúltera
  rationale: Mantém a metáfora forte do grego e permite tanto o sentido moral como a alusão profética à infidelidade para com Deus.
- source_word: σημεῖον
  choice: sinal
  rationale: Traduz o termo sem acrescentar “milagroso”, ideia sugerida pelo contexto, mas não explicitada pelo substantivo.
- source_word: ἐπιζητεῖ
  choice: busca
  rationale: Expressa de modo natural a procura insistente por um sinal sem transformar a nuance contextual em “exige”.
- source_word: δοθήσεται αὐτῇ
  choice: lhe será dado
  rationale: Reproduz o futuro passivo com uma construção idiomática em português; “lhe” retoma “geração” com naturalidade.
- source_word: εἰ μὴ
  choice: exceto
  rationale: Apresenta claramente a única exceção à afirmação negativa.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: o sinal de Jonas
  rationale: Mantém a construção genitiva e sua concisão, sem inserir no texto principal uma explicação tipológica.
- source_word: καταλιπὼν αὐτοὺς
  choice: deixando-os
  rationale: Conserva a relação circunstancial do particípio aoristo com o verbo principal em formulação natural.
- source_word: ἀπῆλθεν
  choice: ele foi embora
  rationale: Comunica claramente o afastamento; o pronome explícito evita possível ambiguidade após a forma plural “deixando-os”.
theological_decisions:
- issue: Sentido de “geração adúltera”
  choice: Manter “adúltera” no texto principal.
  alternative: Traduzir de modo interpretativo como “geração infiel”.
  rationale: A expressão provavelmente evoca a linguagem profética da infidelidade para com Deus, mas o grego emprega a metáfora do adultério. Preservá-la conserva sua força e sua amplitude teológica.
- issue: Sentido de “o sinal de Jonas”
  choice: Manter a expressão sem explicação no texto principal.
  alternative: Explicitar que se refere à morte e à ressurreição de Jesus.
  rationale: Mateus 12:39–40 desenvolve a relação tipológica, mas este versículo mantém a expressão concisa; a tradução não deve resolver no corpo do texto o que a formulação grega deixa implícito.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e as metáforas centrais do grego foram preservadas, enquanto “mas” explicita a relação adversativa natural entre a busca do sinal e sua recusa. “Então” dá fluidez narrativa ao último καί sem alterar a sequência dos acontecimentos.
