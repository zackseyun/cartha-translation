id: MAT.16.16
reference: Matthew 16:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Σίμων Πέτρος εἶπεν· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ τοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/016.yaml
  text: Simon Peter answered[a], “You are the Messiah, the Son of the living God.”
translation:
  language: pt
  text: 'Simão Pedro respondeu: “Tu és o Messias,[a] o Filho do Deus vivo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”. O título grego Χριστός pode ser traduzido por “Cristo”; aqui, “Messias” preserva seu sentido de título e seu contexto messiânico judaico.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: respondeu
  rationale: A combinação do particípio ἀποκριθείς com εἶπεν introduz idiomaticamente uma resposta. “Respondeu” evita a redundância pouco natural de “respondendo, disse” e preserva a função narrativa.
- source_word: δὲ
  choice: —
  rationale: A partícula marca continuidade ou leve transição no discurso; em português, o fluxo já fica claro com “Simão Pedro respondeu”, sem necessidade de representação explícita.
- source_word: Σίμων Πέτρος
  choice: Simão Pedro
  rationale: Emprega as formas portuguesas tradicionais e amplamente reconhecidas dos nomes pessoais.
- source_word: Σὺ
  choice: Tu
  rationale: O pronome explícito no grego tem relevo enfático. Sua presença é preservada no início da declaração. “Tu” mantém o tom direto, solene e amplamente inteligível.
- source_word: ὁ χριστὸς
  choice: o Messias
  rationale: Χριστός funciona aqui como título messiânico, não como simples nome próprio. “Messias” torna esse valor titular claro no contexto judaico.
- source_word: ὁ υἱὸς
  choice: o Filho
  rationale: O artigo e o contexto conferem à expressão caráter definido e titular, preservado pela inicial maiúscula em “Filho”.
- source_word: τοῦ θεοῦ τοῦ ζῶντος
  choice: do Deus vivo
  rationale: Reproduz naturalmente a relação genitiva e o particípio atributivo, mantendo a expressão bíblica clara e corrente em português.
theological_decisions:
- issue: Tradução de Χριστός como título ou forma semelhante a nome
  choice: Messias
  alternative: Cristo
  rationale: Na confissão de Pedro, Χριστός tem função inequívoca de título. “Messias” explicita esse sentido sem acrescentar interpretação; “Cristo” permanece como alternativa legítima em nota.
- issue: Força da expressão “Filho de Deus”
  choice: o Filho do Deus vivo
  alternative: —
  rationale: A formulação confessional e titular do grego é preservada sem ser ampliada por categorias doutrinárias posteriores nem reduzida a uma descrição indefinida.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla legibilidade brasileira. A construção é concisa e preserva a ênfase do pronome grego, bem como o caráter titular de “Messias” e “Filho”.
