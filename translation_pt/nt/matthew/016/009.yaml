source:
  edition: SBLGNT
  text: οὔπω νοεῖτε, οὐδὲ μνημονεύετε τοὺς πέντε ἄρτους τῶν πεντακισχιλίων καὶ πόσους κοφίνους ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: pt
  text: Vocês ainda não entendem nem se lembram dos cinco pães para os cinco mil e de quantos cestos recolheram?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὔπω
  choice: ainda não
  rationale: Preserva diretamente a força temporal do advérbio e soa natural na repreensão formulada como pergunta.
- source_word: νοεῖτε
  choice: entendem
  rationale: Neste contexto, o verbo indica compreender o significado dos acontecimentos anteriores, não apenas percebê-los.
- source_word: οὐδὲ
  choice: nem
  rationale: Liga naturalmente, em português, os dois verbos sob a mesma negação.
- source_word: μνημονεύετε
  choice: se lembram
  rationale: Expressa de modo corrente e direto a recordação do milagre anterior.
- source_word: τοὺς πέντε ἄρτους
  choice: dos cinco pães
  rationale: No relato da multiplicação, ἄρτοι designa pães; a regência de “lembrar-se” pede “de” nesta formulação.
- source_word: τῶν πεντακισχιλίων
  choice: para os cinco mil
  rationale: 'Explicita de maneira natural a relação contextual: os cinco pães usados na alimentação dos cinco mil.'
- source_word: πόσους κοφίνους
  choice: de quantos cestos
  rationale: Mantém a pergunta pelo número de recipientes e a imagem concreta de κόφινος.
- source_word: ἐλάβετε
  choice: recolheram
  rationale: Embora λαμβάνω possa significar “tomar” ou “receber”, aqui se refere contextualmente ao recolhimento das sobras nos cestos.
theological_decisions: []
