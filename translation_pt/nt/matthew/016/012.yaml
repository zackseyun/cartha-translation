id: MAT.16.12
reference: Matthew 16:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης ⸂τῶν ἄρτων⸃ ἀλλὰ ἀπὸ τῆς διδαχῆς τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: pt
  text: Então eles entenderam que ele não tinha dito que tomassem cuidado com o fermento dos pães[a], mas com o ensino dos fariseus e dos saduceus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «do pão». O grego emprega aqui um substantivo no plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca de modo natural o momento em que os discípulos finalmente compreenderam o sentido da advertência.
- source_word: συνῆκαν
  choice: eles entenderam
  rationale: O aoristo indica que chegaram à compreensão; «entenderam» é claro, corrente e fiel ao sentido cognitivo.
- source_word: οὐκ εἶπεν
  choice: ele não tinha dito
  rationale: O mais-que-perfeito composto expressa naturalmente, em português, que só então compreenderam o sentido da declaração anterior.
- source_word: προσέχειν ἀπό
  choice: que tomassem cuidado com
  rationale: Neste contexto de advertência, προσέχω com ἀπό comunica a ideia de estar alerta ou em guarda contra algo. A construção escolhida é natural e mantém a força do aviso.
- source_word: τῆς ζύμης
  choice: o fermento
  rationale: «Fermento» é a forma moderna e amplamente compreensível de preservar a imagem concreta e sua função metafórica.
- source_word: τῶν ἄρτων
  choice: dos pães
  rationale: Mantém o plural explícito do grego e a ligação com os pães discutidos no contexto, embora «do pão» também fosse idiomático.
- source_word: τῆς διδαχῆς
  choice: o ensino
  rationale: Expressa o conteúdo ensinado em linguagem moderna e acessível, sem a carga confessional que «doutrina» pode adquirir.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: dos fariseus e dos saduceus
  rationale: Emprega as formas tradicionais e amplamente reconhecidas em português para os nomes desses grupos.
theological_decisions:
- issue: Força metafórica de ζύμη
  choice: Manter «fermento» e deixar que o próprio versículo o identifique com o ensino dos fariseus e dos saduceus.
  alternative: Explicitar no texto principal «hipocrisia», «mau ensino» ou «ensino corrupto».
  rationale: O versículo interpreta a metáfora como «ensino», mas não acrescenta aqui uma qualificação moral específica. A tradução evita importar explicações de passagens paralelas ou resolver além do que o texto declara.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla inteligibilidade brasileira. «Tomassem cuidado com» evita o tom mais arcaico de «se guardassem do», enquanto «ensino» mantém clareza sem jargão eclesiástico.
