  source_fidelity: A redação principal suaviza indevidamente οὐκ ἐλάβετε (“não pegaram/tomaram”, contextualizado como “não levaram”) para o estado resultante “não têm”. Embora esse estado esteja no contexto, o grego expressa a ação passada. Além disso, a posição de “vocês, que têm pouca fé” no fim da pergunta torna menos clara sua função de vocativo dirigido aos discípulos.
  naturalness: 'O português é moderno e compreensível, mas a ordem atual cria uma sequência pesada e potencialmente ambígua: “... que não têm pão, vocês, que têm pouca fé”. Antecipar o vocativo e formular o complemento como assunto da discussão melhora a fluência.'
  terminology: “Pouca fé” transmite adequadamente ὀλιγόπιστοι sem impor interpretação doutrinária. “Pão” é idiomático em português para o plural ἄρτους neste contexto; a nota pode registrar a formulação mais literal.
