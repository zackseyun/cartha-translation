id: MAT.16.8
reference: Matthew 16:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: pt
  text: 'Mas Jesus, percebendo isso, disse: “Por que vocês, que têm pouca fé, estão discutindo entre si sobre o fato de não terem levado pão[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “não pegaram pães” ou “não tomaram pães”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: percebendo isso
  rationale: O particípio aoristo indica que Jesus tomou conhecimento da discussão antes de falar. “Isso” explicita de modo natural o objeto implícito, recuperado do contexto.
- source_word: δὲ
  choice: Mas
  rationale: Marca a leve contraposição e a transição entre a discussão dos discípulos e a reação de Jesus.
- source_word: εἶπεν
  choice: disse
  rationale: É a forma narrativa corrente para introduzir discurso direto, embora o conteúdo seja uma pergunta.
- source_word: Τί
  choice: Por que
  rationale: Neste contexto, τί tem valor adverbial e pergunta a razão da discussão.
- source_word: διαλογίζεσθε
  choice: estão discutindo
  rationale: Expressa a deliberação ou conversa dos discípulos entre si em português atual e claro.
- source_word: ἐν ἑαυτοῖς
  choice: entre si
  rationale: Preserva a referência recíproca aos discípulos sem excluir por completo a nuance de reflexão no próprio grupo.
- source_word: ὀλιγόπιστοι
  choice: vocês, que têm pouca fé
  rationale: Reproduz a repreensão direta e a ideia de fé insuficiente em linguagem natural, sem recorrer a uma designação pouco idiomática como “os de pequena fé”.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo da discussão. Mantém essa relação discursiva, em vez de transformá-la explicitamente em causa com “porque”.
- source_word: ἄρτους
  choice: pão
  rationale: Embora o grego use o plural, o substantivo não contável “pão” é a forma natural em português quando se fala do alimento ou da provisão em geral.
- source_word: οὐκ ἐλάβετε
  choice: não têm
  rationale: 'Exprime naturalmente o estado resultante no contexto: os discípulos estão sem pão. A ação mais literal de tomar ou levar é preservada em nota.'
theological_decisions:
- issue: Força da repreensão ὀλιγόπιστοι
  choice: vocês, que têm pouca fé
  alternative: vocês, de pequena fé
  rationale: A tradução conserva a crítica de Jesus à confiança insuficiente dos discípulos na situação imediata, sem ampliá-la para uma afirmação doutrinária geral nem reduzi-la a mero mal-entendido.
- issue: Relação introduzida por ὅτι
  choice: 'conteúdo da discussão: “que não têm pão”'
  alternative: 'causa da discussão: “porque não têm pão”'
  rationale: A construção admite proximidade semântica entre conteúdo e causa. O texto principal segue a leitura de conteúdo e evita resolver além do necessário a nuance sintática.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Vocês” oferece tratamento plural claro e corrente. A formulação mantém o tom direto e repreensivo de Jesus sem arcaísmo. O marcador [a] foi colocado junto à expressão a que a nota lexical se refere.
