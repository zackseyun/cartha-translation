id: MAT.16.19
reference: Matthew 16:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: pt
  text: Eu lhe darei as chaves do Reino dos céus. Tudo o que você ligar na terra terá sido ligado nos céus[a][b], e tudo o que você desligar na terra terá sido desligado nos céus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “será ligado nos céus” e “será desligado nos céus”. A construção grega, porém, pode indicar com mais precisão: “terá sido ligado” e “terá sido desligado”.'
    reason: alternative_reading
  - marker: b
    text: “Ligar” e “desligar” podem ter o sentido de proibir e permitir, ou de impor e retirar obrigações; a tradução mantém a metáfora grega.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω σοι
  choice: Eu lhe darei
  rationale: O futuro ativo expressa uma promessa direta; “lhe darei” representa naturalmente o objeto indireto singular em português.
- source_word: τὰς κλεῖδας
  choice: as chaves
  rationale: Mantém a imagem concreta e o plural do grego, sem explicar no corpo do texto qual autoridade as chaves representam.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: do Reino dos céus
  rationale: Preserva a expressão característica de Mateus e o plural grego “céus”, que é natural e tradicional em português.
- source_word: ὃ ἐὰν
  choice: tudo o que
  rationale: Reproduz com clareza e naturalidade a construção relativa indefinida nas duas orações.
- source_word: δήσῃς
  choice: ligar
  rationale: Preserva a metáfora grega e sua possível ressonância de proibir ou impor obrigações, sem inserir essa interpretação no texto principal.
- source_word: ἐπὶ τῆς γῆς
  choice: na terra
  rationale: É a formulação portuguesa natural para o contraste espacial com os céus.
- source_word: ἔσται δεδεμένον
  choice: terá sido ligado
  rationale: A perífrase formada pelo futuro de εἰμί e o particípio perfeito passivo indica um estado futuro resultante de ação concluída; o futuro composto português conserva essa nuance.
- source_word: λύσῃς
  choice: desligar
  rationale: Forma um par metafórico claro com “ligar” e evita resolver no texto se o sentido específico é permitir, liberar ou retirar uma obrigação.
- source_word: ἔσται λελυμένον
  choice: terá sido desligado
  rationale: Mantém o paralelismo e representa a construção de futuro com particípio perfeito passivo.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: nos céus
  rationale: Conserva o plural do original e corresponde naturalmente à linguagem mateana em português.
theological_decisions:
- issue: Aspecto e possível implicação teológica da fórmula ligar/desligar
  choice: “terá sido ligado/desligado nos céus”
  alternative: “será ligado/desligado nos céus”
  rationale: A construção grega ἔσται com particípio perfeito passivo favorece um estado futuro decorrente de ação já realizada. A tradução conserva essa força gramatical e a possível correspondência entre a ação terrena e a determinação celeste, sem transformar essa possibilidade em uma doutrina denominacional.
- issue: Sentido das chaves do Reino dos céus
  choice: Manter a metáfora “chaves” sem expansão interpretativa
  alternative: Explicitar “autoridade para admitir e excluir” ou “autoridade de administração”
  rationale: A imagem sugere autoridade, mas o versículo não define aqui todos os seus contornos. Preservar a metáfora evita impor um sistema eclesiológico específico.
- issue: Sentido técnico de ligar e desligar
  choice: Preservar os verbos metafóricos “ligar” e “desligar”
  alternative: Traduzir diretamente por “proibir” e “permitir” ou “impor” e “retirar obrigações”
  rationale: Esses sentidos interpretativos são plausíveis no contexto judaico, mas não esgotam necessariamente a metáfora. A nota informa a possibilidade sem resolver a ambiguidade no texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “você” para o singular σοι/segunda pessoa singular. “Reino” foi grafado com inicial maiúscula por convenção editorial referente ao governo de Deus. O plural “céus” conserva o grego e é natural no uso bíblico em português. Os marcadores foram posicionados junto às expressões que explicam.
