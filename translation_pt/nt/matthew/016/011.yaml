id: MAT.16.11
reference: Matthew 16:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πῶς οὐ νοεῖτε ὅτι οὐ περὶ ⸀ἄρτων εἶπον ὑμῖν; ⸂προσέχετε δὲ⸃ ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: pt
  text: Como vocês não entendem que eu não falei com vocês sobre pão? Mas tenham cuidado com o fermento dos fariseus e dos saduceus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fiquem atentos ao fermento dos fariseus e dos saduceus”.'
    reason: lexical_alternative
  - marker: b
    text: “Fermento” é uma metáfora aqui; no versículo seguinte, ele é explicado como o ensino dos fariseus e dos saduceus.
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: Como vocês não entendem
  rationale: A pergunta repreende a falta de compreensão. “Como vocês não entendem” preserva a forma retórica e soa natural em português moderno.
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: que eu não estava falando com vocês a respeito de pão
  rationale: Embora ἄρτων seja plural, “pão” como nome coletivo é idiomático no contexto. O imperfeito perifrástico em português comunica naturalmente a referência de Jesus ao que havia dito.
- source_word: προσέχετε δὲ
  choice: Mas tenham cuidado
  rationale: προσέχετε tem força de advertência, e δέ marca a passagem corretiva. “Tenham cuidado” é claro, corrente e compatível com a construção seguinte.
- source_word: ἀπὸ τῆς ζύμης
  choice: com o fermento
  rationale: Com προσέχετε, ἀπό indica aquilo contra o qual se deve estar prevenido. “Fermento” preserva a metáfora e é mais corrente no português contemporâneo do que “levedo”.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: dos fariseus e dos saduceus
  rationale: São as formas tradicionais e amplamente reconhecidas em português para esses grupos judaicos; o genitivo indica o fermento associado a eles ou que os caracteriza.
theological_decisions:
- issue: Força metafórica de ζύμη
  choice: Manter “fermento” no texto principal sem explicá-lo como “ensino” neste versículo.
  alternative: Substituir a metáfora por “ensino dos fariseus e dos saduceus”.
  rationale: O versículo seguinte esclarece a metáfora, mas aqui o texto-fonte diz ζύμη. Preservá-la mantém a progressão narrativa e evita antecipar no texto principal a interpretação explicitada depois.
translation_notes:
  register: Português moderno, claro e digno, com formas de ampla compreensão e boa legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa e conserva a metáfora do original.
