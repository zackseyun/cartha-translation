source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ ὁ Ἰησοῦς εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου ἠρώτα τοὺς μαθητὰς αὐτοῦ λέγων· ⸀Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι τὸν υἱὸν τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/013.yaml
  text: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
translation:
  language: pt
  text: 'Quando Jesus chegou à região de Cesareia de Filipe, perguntou aos seus discípulos: “Quem as pessoas dizem ser o Filho do Homem[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filho do Homem” é a autodesignação característica de Jesus; outra tradução possível é “o Ser Humano”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: Quando Jesus chegou
  rationale: O particípio aoristo com δέ introduz a nova cena e estabelece a circunstância temporal. “Quando ... chegou” comunica isso com fluidez, sem acrescentar um advérbio temporal ausente do grego.
- source_word: εἰς τὰ μέρη
  choice: à região
  rationale: μέρη designa aqui o território ou distrito ao redor da cidade, não “partes” em sentido literal.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: Cesareia de Filipe
  rationale: Forma portuguesa consagrada do nome geográfico, que distingue esta cidade de outras chamadas Cesareia.
- source_word: ἠρώτα
  choice: perguntou
  rationale: Embora o imperfeito possa realçar ação em curso, o pretérito perfeito é a forma narrativa mais natural em português para introduzir a pergunta registrada, sem alterar seu conteúdo.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: aos seus discípulos
  rationale: “Discípulos” é o equivalente estabelecido e exato para μαθηταί no contexto dos Evangelhos.
- source_word: λέγων
  choice: ':'
  rationale: O particípio semítico de fala é representado naturalmente em português pela introdução direta da citação com dois-pontos; traduzir “dizendo” seria possível, mas menos idiomático.
- source_word: Τίνα λέγουσιν οἱ ἄνθρωποι
  choice: Quem as pessoas dizem
  rationale: ἄνθρωποι tem sentido humano genérico; “as pessoas” evita restringi-lo a homens do sexo masculino. “Quem” é natural na construção interrogativa portuguesa.
- source_word: εἶναι
  choice: que é
  rationale: No discurso indireto em português, a oração finita com “que é” expressa naturalmente o infinitivo grego εἶναι.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Preserva a autodesignação característica de Jesus, sua formulação tradicional e suas ressonâncias intertextuais, sem reduzir a expressão a uma interpretação única.
theological_decisions:
- issue: Tradução de ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  alternative: o Ser Humano
  rationale: “Filho do Homem” conserva tanto o caráter idiomático e titular da expressão nos Evangelhos quanto sua possível ressonância com Daniel 7. A alternativa explicita a dimensão humana, mas enfraquece a continuidade verbal e intertextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe foi naturalizada sem apagar a identidade tradicional e teologicamente aberta de “Filho do Homem”.
