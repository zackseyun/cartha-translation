  text: οὐδὲ τοὺς ἑπτὰ ἄρτους τῶν τετρακισχιλίων καὶ πόσας σπυρίδας ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/010.yaml
  text: Or the seven loaves for the four thousand[a], and how many large baskets you picked up?
translation:
  language: pt
  text: Nem dos sete pães para os quatro mil e de quantos cestos grandes vocês recolheram?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: Nem
  rationale: Dá continuidade, de modo natural, à sequência de perguntas retóricas de Jesus. Como o versículo é sintaticamente ligado ao anterior, “Nem” preserva melhor essa conexão do que uma formulação independente com “Ou”.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: dos sete pães
  rationale: No contexto da multiplicação, ἄρτοι designa pães concretos; “pães” é a forma corrente e clara em português.
- source_word: τῶν τετρακισχιλίων
  choice: para os quatro mil
  rationale: O genitivo associa os pães ao episódio da alimentação dos quatro mil. “Para” explicita de maneira idiomática essa relação contextual sem acrescentar interpretação indevida.
- source_word: πόσας
  choice: de quantos
  rationale: O interrogativo modifica “cestos grandes”; a preposição “de” integra a segunda lembrança à construção iniciada por “Nem dos sete pães”.
- source_word: σπυρίδας
  choice: cestos grandes
  rationale: σπυρίς indica um cesto de maior capacidade e distingue este episódio daquele em que aparece κόφινος; “cestos grandes” conserva essa diferença lexical.
- source_word: ἐλάβετε
  choice: vocês recolheram
  rationale: No contexto das sobras, “recolheram” comunica naturalmente o ato de juntar e retirar o que restou.
theological_decisions: []
