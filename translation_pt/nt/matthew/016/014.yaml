  text: οἱ δὲ εἶπαν· Οἱ μὲν Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἕτεροι δὲ Ἰερεμίαν ἢ ἕνα τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: pt
  text: 'Eles responderam: “Alguns, João Batista; outros, Elias; e outros, Jeremias ou um dos profetas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Eles responderam
  rationale: No contexto de uma pergunta anterior, εἶπαν pode ser expresso naturalmente por “responderam”; δέ mantém a progressão narrativa sem exigir uma conjunção explícita em português.
- source_word: Οἱ μὲν Ἰωάννην τὸν βαπτιστήν
  choice: Alguns dizem que é João Batista
  rationale: μέν inicia uma distribuição entre grupos. A construção grega é elíptica, mas o português corrente requer a retomada verbal; “que é” explicita apenas a identificação já exigida pela pergunta anterior, sem acrescentar “você” ao texto.
- source_word: ἄλλοι δὲ Ἠλίαν
  choice: outros, Elias
  rationale: A elipse do verbo pode ser preservada com naturalidade em português. “Elias” é a forma tradicional e corrente do nome.
- source_word: ἕτεροι δὲ Ἰερεμίαν
  choice: e outros, Jeremias
  rationale: ἕτεροι introduz mais um grupo; “e outros” reproduz claramente a sequência distributiva. “Jeremias” é a forma portuguesa consagrada.
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: ou um dos profetas
  rationale: Mantém literalmente a alternativa introduzida por ἤ, sem inserir “outros”, palavra ausente do grego.
theological_decisions:
- issue: Objeto implícito das identificações
  choice: Explicitar “que é” sem inserir o pronome “você”
  alternative: '“Alguns dizem: João Batista; outros, Elias...” ou “Alguns dizem que você é João Batista...”'
  rationale: O grego apresenta as identificações de forma elíptica, dependente da pergunta precedente. “Que é” torna a frase idiomática em português e preserva a referência contextual, enquanto evita explicitar o pronome de segunda pessoa que não aparece neste versículo.
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. Os nomes seguem as formas bíblicas correntes: João Batista, Elias e Jeremias. A pontuação com ponto e vírgula distingue os três grupos da resposta.'
