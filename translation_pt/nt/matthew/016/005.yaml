lexical_decisions:
- source_word: ἐλθόντες
  choice: Quando ... chegaram
  rationale: O particípio aoristo é expresso como oração temporal natural em português, preservando sua relação com o verbo principal.
- source_word: οἱ μαθηταὶ
  choice: os discípulos
  rationale: É a designação corrente e contextualmente precisa dos seguidores de Jesus nos Evangelhos.
- source_word: εἰς τὸ πέραν
  choice: ao outro lado
  rationale: Expressão idiomática natural para a chegada à margem oposta do lago.
- source_word: ἐπελάθοντο
  choice: esqueceram-se
  rationale: Traduz diretamente o verbo no aoristo; a sequência narrativa já deixa claro que não levaram os pães antes da chegada.
- source_word: ἄρτους
  choice: pães
  rationale: Preserva o plural concreto do grego, adequado aos pães levados como provisão.
- source_word: λαβεῖν
  choice: de levar
  rationale: Depois de 'esquecer-se', 'levar' expressa naturalmente em português a ideia de tomar consigo para a travessia.
