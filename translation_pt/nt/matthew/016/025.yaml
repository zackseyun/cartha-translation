reference: Matthew 16:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: pt
  text: Pois quem quiser salvar a sua vida a perderá[a]; mas quem perder a sua vida por minha causa a encontrará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «alma» nas duas ocorrências do versículo; a palavra grega psychē pode significar «vida», «o próprio ser» ou «alma», conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: Pois quem ... mas quem
  rationale: As construções relativas com ἐὰν/ἂν expressam condições gerais indefinidas. Em português, «quem» comunica isso naturalmente; «pois» mantém a ligação explicativa de γάρ com o contexto anterior, e «mas» marca o contraste de δέ.
- source_word: θέλῃ
  choice: quiser
  rationale: θέλω indica vontade ou intenção. «Quiser», no futuro do subjuntivo exigido pela construção portuguesa com «quem», é corrente e preserva o caráter condicional.
- source_word: ψυχὴν
  choice: vida
  rationale: Neste dito, ψυχή designa a vida ou o próprio ser da pessoa no paradoxo de salvar, perder e encontrar. «Vida» se ajusta melhor ao contexto de discipulado e morte, enquanto «alma» permanece registrada em nota como alternativa lexical tradicional.
- source_word: σῶσαι
  choice: salvar
  rationale: σῴζω significa salvar ou preservar. «Salvar» conserva a força direta do verbo e o paralelismo com «perder».
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: a perderá / perder
  rationale: ἀπόλλυμι aqui comunica perder a vida, não necessariamente aniquilá-la. «Perderá» reproduz o futuro da primeira oração; «perder» integra naturalmente a condição geral da segunda.
- source_word: ἕνεκεν ἐμοῦ
  choice: por minha causa
  rationale: ἕνεκεν com o genitivo expressa causa ou motivo. «Por minha causa» é natural no português amplo e mantém a referência pessoal a Jesus sem expansão interpretativa.
- source_word: εὑρήσει
  choice: a encontrará
  rationale: εὑρίσκω significa diretamente «encontrar». A escolha conserva o paradoxo verbal e evita substituí-lo por uma interpretação como «ganhar».
- source_word: αὐτοῦ / αὐτήν
  choice: sua / a
  rationale: O possessivo reflexivo «sua» retoma naturalmente o sujeito genérico «quem». Os pronomes átonos femininos retomam «vida» com clareza e concisão.
theological_decisions:
- issue: Tradução de ψυχή no paradoxo do discipulado
  choice: vida
  alternative: alma; o próprio ser
  rationale: O contexto fala de seguir Jesus sob o risco da morte, e os verbos salvar, perder e encontrar favorecem «vida». Contudo, ψυχή tem amplitude semântica e pode ser entendida como «alma» ou «o próprio ser»; a nota preserva essa tensão sem restringir o termo a uma antropologia específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A colocação pronominal «a perderá / a encontrará» mantém referência explícita a «vida» e evita repetição pesada; «por minha causa» é mais amplamente natural que a fórmula lusitana «por amor de mim».
