  text: ⸂ἀποκριθεὶς δὲ⸃ ὁ Ἰησοῦς εἶπεν αὐτῷ· Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: pt
  text: 'Jesus lhe respondeu: “Bem-aventurado é você, Simão Barjonas[a], porque carne e sangue[b] não lhe revelaram isso, mas meu Pai, que está nos céus, revelou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Simão, filho de Jonas”. “Barjonas” preserva a forma patronímica aramaica presente no texto grego.'
    reason: lexical_alternative
  - marker: b
    text: Expressão idiomática que se refere a seres humanos ou a uma fonte meramente humana.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: Jesus lhe respondeu
  rationale: A construção com particípio e verbo finito tem o sentido idiomático de “respondeu e disse”. Em português atual, “lhe respondeu” comunica isso com naturalidade; o valor continuativo de δέ não exige aqui uma conjunção explícita.
- source_word: Μακάριος
  choice: Bem-aventurado
  rationale: Preserva o peso religioso e declarativo do termo, que vai além de um estado psicológico de felicidade.
- source_word: Σίμων Βαριωνᾶ
  choice: Simão Barjonas
  rationale: Translitera no nome a forma patronímica aramaica preservada pelo grego, enquanto a nota oferece seu sentido.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão pela qual Simão é declarado bem-aventurado.
- source_word: σὰρξ καὶ αἷμα
  choice: carne e sangue
  rationale: Mantém a expressão idiomática sem restringi-la indevidamente à razão pessoal de Pedro ou a determinados mestres humanos.
- source_word: ἀπεκάλυψέν σοι
  choice: não lhe revelaram isso
  rationale: “Revelar” preserva a ideia de desvelamento ou comunicação divina. “Isso” explicita em português o objeto subentendido pelo contexto.
- source_word: ἀλλ’ ὁ πατήρ μου
  choice: mas meu Pai
  rationale: Conserva o forte contraste entre uma fonte humana e o Pai.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: que está nos céus
  rationale: Reflete de perto o artigo com a expressão qualificadora e preserva o plural grego de modo natural no registro bíblico português.
theological_decisions:
- issue: Origem da confissão de Pedro
  choice: A tradução contrapõe de modo amplo “carne e sangue” à revelação do Pai.
  alternative: Entender a expressão especificamente como o raciocínio natural de Pedro ou como algum mestre humano.
  rationale: O texto exclui uma origem meramente humana e atribui a revelação ao Pai, mas não identifica qual possível agente ou processo humano está em vista nem formula aqui uma doutrina mais abrangente da inspiração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Bem-aventurado” mantém a densidade religiosa de μακάριος; “nos céus” conserva naturalmente o plural do grego. A ordem e a elipse final preservam o contraste entre a fonte humana e o Pai sem acrescentar uma explicação doutrinária.
