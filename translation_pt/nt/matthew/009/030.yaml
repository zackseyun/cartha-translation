  text: καὶ ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί. καὶ ⸀ἐνεβριμήθη αὐτοῖς ὁ Ἰησοῦς λέγων· Ὁρᾶτε μηδεὶς γινωσκέτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: pt
  text: 'E os olhos deles foram abertos. E Jesus os advertiu severamente[a], dizendo: “Vejam que ninguém fique sabendo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deu-lhes uma ordem rigorosa”. O verbo grego expressa forte emoção e a intensidade da advertência.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῴχθησαν
  choice: se abriram
  rationale: O aoristo passivo de ἀνοίγω forma uma expressão natural em português e preserva a ausência de um agente explicitamente mencionado.
- source_word: οἱ ὀφθαλμοί
  choice: os olhos deles
  rationale: Reproduz com clareza a referência possessiva do grego, em linguagem corrente.
- source_word: ἐνεβριμήθη
  choice: advertiu severamente
  rationale: O verbo comunica forte emoção e uma ordem enfática; esta formulação preserva sua intensidade sem sugerir o motivo da proibição.
- source_word: Ὁρᾶτε
  choice: Cuidado para que
  rationale: Neste contexto, o imperativo introduz uma advertência e não uma ordem literal para olhar; a expressão portuguesa comunica naturalmente a vigilância exigida.
- source_word: μηδεὶς γινωσκέτω
  choice: ninguém fique sabendo
  rationale: Expressa naturalmente a proibição no imperativo de terceira pessoa e, como o grego, não explicita o objeto do conhecimento.
- source_word: λέγων
  choice: dizendo
  rationale: Mantém a ligação participial entre a advertência e as palavras que apresentam seu conteúdo.
theological_decisions:
- issue: Força da ordem de Jesus depois da cura
  choice: Jesus dá uma proibição enfática, sem que o texto explique sua motivação.
  alternative: Jesus os repreendeu ou lhes deu uma ordem rigorosa.
  rationale: A tradução conserva a força emocional e imperativa de ἐμβριμάομαι, mas não introduz uma explicação teológica para o pedido de silêncio.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Então” articula naturalmente a sequência narrativa representada por καί; “fique sabendo” preserva a omissão do objeto no grego sem soar truncado.
