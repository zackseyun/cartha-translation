id: MAT.9.31
reference: Matthew 9:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ἐξελθόντες διεφήμισαν αὐτὸν ἐν ὅλῃ τῇ γῇ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/031.yaml
  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: pt
  text: Mas, depois que saíram, eles espalharam a notícia a respeito dele por toda aquela região.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por toda aquela terra”. A palavra grega γῆ pode significar “terra”, “região” ou “área”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste leve com a ordem de silêncio dada por Jesus no versículo anterior e introduz a reação contrária dos homens.
- source_word: ἐξελθόντες
  choice: depois que saíram
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal; a oração temporal é natural em português e preserva a sequência.
- source_word: διεφήμισαν
  choice: espalharam a notícia
  rationale: O verbo expressa divulgar amplamente ou tornar conhecido; esta formulação comunica o sentido de difusão pública em português corrente.
- source_word: αὐτὸν
  choice: a respeito dele
  rationale: Com a expressão portuguesa 'espalharam a notícia', explicita de modo natural que Jesus era o assunto da divulgação.
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: por toda aquela região
  rationale: A preposição com a totalidade da área tem força distributiva, e γῆ pode designar uma região ou território local neste contexto.
theological_decisions:
- issue: Extensão geográfica de γῆ
  choice: região
  alternative: terra
  rationale: O contexto descreve a divulgação local da notícia sobre Jesus. 'Região' evita sugerir um alcance nacional ou universal, sem eliminar a alternativa lexical genuína 'terra'.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A repetição explícita do pronome 'eles' ajuda a retomar os dois homens sem tornar a frase pesada.
