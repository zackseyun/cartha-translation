  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: pt
  text: 'E Jesus, sabendo o que eles pensavam, disse: “Por que vocês pensam coisas más em seus corações?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδὼς
  choice: sabendo
  rationale: O particípio expressa a consciência que Jesus tinha do raciocínio interior deles; “sabendo” é natural e preserva diretamente essa afirmação.
- source_word: ἐνθυμήσεις
  choice: o que eles pensavam
  rationale: O substantivo denota pensamentos ou reflexões interiores. A formulação verbal é mais natural em português e evita a repetição pouco fluida de “pensamentos/pensam”.
- source_word: Ἱνατί
  choice: Por que
  rationale: Equivalente direto e natural da pergunta sobre motivo ou razão.
- source_word: ἐνθυμεῖσθε
  choice: vocês pensam
  rationale: O presente indica a atividade interior em curso; “pensam” é claro e idiomático no contexto.
- source_word: πονηρὰ
  choice: coisas más
  rationale: O adjetivo neutro plural é substantivado. “Coisas más” torna explícita essa função sem restringir o sentido a intenções ou pensamentos perversos apenas.
- source_word: καρδίαις
  choice: coração
  rationale: “Coração” preserva a metáfora bíblica do centro interior do pensamento e da intenção. O singular distributivo é idiomático em português após “vocês”.
theological_decisions:
- issue: A consciência de Jesus acerca de pensamentos não expressos
  choice: Jesus, sabendo o que eles pensavam
  alternative: Jesus, percebendo o que eles pensavam
  rationale: A tradução conserva a afirmação de que Jesus conhecia o raciocínio interior deles, sem explicar como esse conhecimento se dava nem expandi-lo em uma formulação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para fluência natural, sem eliminar o vínculo entre o conhecimento de Jesus e os pensamentos interiores deles.
