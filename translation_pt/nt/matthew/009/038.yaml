base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/038.yaml
  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: pt
  text: Portanto, orem com insistência ao Senhor da colheita, para que envie trabalhadores à sua colheita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mande para fora” ou “impulsione” trabalhadores. O verbo grego é mais forte que o simples “enviar”, embora aqui se refira a despachar trabalhadores para a colheita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: orem com insistência
  rationale: O imperativo de δέομαι expressa um pedido dirigido a Deus com súplica ou urgência. “Orem com insistência” mantém tanto o contexto de oração quanto essa força, em português natural.
- source_word: οὖν
  choice: Portanto
  rationale: Indica a conclusão decorrente da afirmação anterior de que a colheita é grande e os trabalhadores são poucos.
- source_word: κυρίου
  choice: Senhor
  rationale: Preserva o título κύριος e a ideia de autoridade daquele a quem pertence a colheita, sem especificar além do texto quem é o referente.
- source_word: θερισμοῦ
  choice: colheita
  rationale: É o sentido habitual do termo e conserva a metáfora de recolhimento, sem a substituir por uma interpretação.
- source_word: ὅπως
  choice: para que
  rationale: Introduz naturalmente em português o conteúdo e propósito da oração.
- source_word: ἐκβάλῃ
  choice: envie
  rationale: No contexto, refere-se a despachar trabalhadores para a colheita. “Envie” é claro e natural; a força incomum do verbo grego é preservada em nota.
- source_word: ἐργάτας
  choice: trabalhadores
  rationale: Designa pessoas que trabalham na colheita e é uma opção atual, clara e inclusiva em sentido genérico.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: à sua colheita
  rationale: Expressa o movimento dos trabalhadores para a esfera ou tarefa da colheita e preserva o possessivo, sem acrescentar “campo”, que não está explícito.
theological_decisions:
- issue: Identidade do “Senhor da colheita”
  choice: Manter “Senhor da colheita” sem identificar explicitamente o referente.
  alternative: Especificar o Pai, Jesus ou Deus de modo mais amplo.
  rationale: O versículo não identifica o referente além do título. A formulação preserva a abertura do texto e evita introduzir uma conclusão doutrinária mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora agrícola foi mantida, e a nota registra a força de ἐκβάλλω sem tornar o texto principal artificial.
