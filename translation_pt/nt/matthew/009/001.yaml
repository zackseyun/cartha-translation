reference: Matthew 9:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ⸀ἐμβὰς ⸀εἰς πλοῖον διεπέρασεν καὶ ἦλθεν εἰς τὴν ἰδίαν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: pt
  text: E, depois de entrar num barco, atravessou para o outro lado e chegou à sua própria cidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à sua cidade natal”. O grego diz “à sua própria cidade”, expressão que pode referir-se à cidade associada a ele nesta fase da narrativa, provavelmente Cafarnaum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: entrando
  rationale: O particípio aoristo indica uma ação anterior aos verbos principais; o gerúndio é natural em português e mantém a sequência sem transformar a oração em verbo coordenado.
- source_word: πλοῖον
  choice: um barco
  rationale: Termo geral para embarcação; no contexto do mar da Galileia, “barco” é mais natural e proporcional que “navio”. A ausência de artigo favorece “um barco”.
- source_word: διεπέρασεν
  choice: atravessou para o outro lado
  rationale: διαπεράω descreve a travessia de um lado a outro, especialmente por água; a expressão explicita em português a nuance direcional do verbo.
- source_word: ἦλθεν
  choice: chegou
  rationale: Embora ἔρχομαι possa significar “vir” ou “ir”, aqui “chegou” comunica com naturalidade o ponto final do deslocamento.
- source_word: τὴν ἰδίαν πόλιν
  choice: à sua própria cidade
  rationale: Preserva de forma direta a ideia de pertencimento ou associação expressa por ἴδιος, sem interpretar πόλις necessariamente como cidade natal.
- source_word: Καὶ ... καὶ
  choice: E ... e
  rationale: Mantém as ligações narrativas simples de Mateus, com fluidez aceitável em português contemporâneo.
theological_decisions:
- issue: Referente de “sua própria cidade”
  choice: A cidade não é identificada no texto principal.
  alternative: Entender a expressão especificamente como Cafarnaum ou, de modo mais geral, como sua base na Galileia.
  rationale: O grego não dá o nome da cidade. A formulação mantém a ambiguidade da fonte, embora o contexto narrativo provavelmente aponte para Cafarnaum.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Entrando” conserva a estrutura participial; “sua própria cidade” preserva a ênfase e a ambiguidade do original.
