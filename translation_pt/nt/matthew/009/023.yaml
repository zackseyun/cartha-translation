  text: καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: pt
  text: Quando Jesus chegou à casa do chefe[a] e viu os flautistas[b] e a multidão em alvoroço[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da autoridade” ou “do líder”. Por comparação com os relatos paralelos, também se pode entender “do dirigente da sinagoga”; aqui, porém, Mateus usa apenas o termo geral “chefe”.
    reason: alternative_reading
  - marker: b
    text: Os flautistas faziam parte do lamento fúnebre costumeiro e geralmente eram profissionais.
    reason: cultural_note
  - marker: c
    text: Ou “fazendo grande tumulto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Quando Jesus chegou
  rationale: O particípio aoristo tem aqui valor temporal; esta formulação é natural em português e preserva a sequência narrativa.
- source_word: οἰκίαν
  choice: casa
  rationale: É o sentido direto no contexto narrativo, sem acrescentar a nuance mais afetiva de “lar”.
- source_word: ἄρχοντος
  choice: chefe
  rationale: Preserva a designação geral de alguém em posição de autoridade, sem importar dos relatos paralelos a identificação mais específica de dirigente da sinagoga.
- source_word: ἰδὼν
  choice: viu
  rationale: Verbo narrativo simples e direto, correspondente ao sentido comum do termo.
- source_word: αὐλητὰς
  choice: flautistas
  rationale: Designa os tocadores de flauta presentes no contexto de luto; “flautistas” é claro e corrente em português.
- source_word: ὄχλον
  choice: multidão
  rationale: Equivalente corrente e natural para ὄχλος neste contexto.
- source_word: θορυβούμενον
  choice: em alvoroço
  rationale: Expressa o tumulto ruidoso indicado pelo particípio sem determinar além do texto a emoção ou a atividade específica da multidão.
theological_decisions:
- issue: Identificação do dono da casa
  choice: o chefe
  alternative: a autoridade; o dirigente da sinagoga
  rationale: Mateus emprega apenas o termo geral ἄρχων. A tradução evita harmonizar o versículo com os relatos paralelos; a identificação mais específica fica em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, mantendo a relação temporal e a ambiguidade do título ἄρχων.
