source:
  edition: SBLGNT
  text: καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: pt
  text: 'E, quando o demônio foi expulso, o homem mudo[a] falou. E as multidões ficaram admiradas e disseram: “Nunca se viu algo assim em Israel”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o homem surdo”. A palavra grega pode significar “surdo” ou “mudo”; aqui, o contexto favorece “mudo”, pois a ênfase está no fato de que ele falou.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: depois que ... foi expulso
  rationale: O particípio aoristo passivo em genitivo absoluto indica uma ação anterior à do verbo principal; esta construção expressa essa relação temporal com naturalidade em português.
- source_word: δαιμονίου
  choice: o demônio
  rationale: Em contextos de exorcismo nos Evangelhos, δαιμόνιον é traduzido de modo preciso e corrente por “demônio”.
- source_word: ἐλάλησεν
  choice: falou
  rationale: O aoristo simples de λαλέω afirma que o homem falou, sem exigir o acréscimo interpretativo “começou a falar”.
- source_word: ὁ κωφός
  choice: o homem mudo
  rationale: Embora κωφός possa significar “surdo” ou “mudo”, o resultado imediato — “falou” — favorece aqui a referência à incapacidade de falar. “Homem” é explicitado naturalmente a partir do contexto.
- source_word: ἐθαύμασαν
  choice: ficaram admiradas
  rationale: Expressa com clareza atual a forte reação de assombro indicada pelo verbo.
- source_word: οἱ ὄχλοι
  choice: as multidões
  rationale: Preserva o plural do grego e mantém um registro bíblico digno, mas compreensível.
- source_word: Οὐδέποτε
  choice: Nunca
  rationale: Equivalente direto e idiomático do advérbio absoluto.
- source_word: ἐφάνη
  choice: se viu
  rationale: O passivo de φαίνω pode ter o sentido idiomático de “ser visto”; a forma impessoal portuguesa comunica naturalmente que nada semelhante havia sido presenciado.
- source_word: οὕτως
  choice: algo assim
  rationale: No contexto exclamativo, refere-se a um acontecimento desse tipo ou dessa maneira; “algo assim” explicita idiomaticamente o sujeito subentendido.
- source_word: ἐν τῷ Ἰσραήλ
  choice: em Israel
  rationale: Tradução concisa que pode abranger tanto o povo quanto a esfera de Israel, sem restringir indevidamente o sentido.
theological_decisions:
- issue: Amplitude semântica de κωφός no contexto da cura e do exorcismo
  choice: Traduzir como “homem mudo”
  alternative: “homem surdo”
  rationale: A palavra admite ambos os sentidos, mas a afirmação de que o homem falou destaca a mudez. A alternativa legítima é preservada em nota, sem atribuir ao homem uma segunda condição que o contexto não exige.
- issue: Sentido contextual de ἐφάνη
  choice: “se viu”
  alternative: “apareceu”
  rationale: Ambas as possibilidades pertencem ao campo semântico do verbo. Neste enunciado sobre um acontecimento sem precedentes em Israel, a formulação impessoal “se viu” é mais natural em português e não altera a afirmação teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A coordenação repetida preserva o andamento narrativo do grego sem soar excessivamente arcaica. Empregou-se “multidões” para manter o plural e “ficaram admiradas” em linguagem corrente e digna.
