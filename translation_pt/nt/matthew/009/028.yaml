id: MAT.9.28
reference: Matthew 9:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: pt
  text: 'Quando ele entrou na casa[a], os cegos se aproximaram dele, e Jesus lhes diz: “Vocês creem que eu posso fazer isso?” Eles lhe dizem: “Sim, Senhor[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando ele chegou à casa, os cegos foram até ele”.'
    reason: Tradução alternativa mais próxima da repetição e da estrutura verbal do grego.
  - marker: b
    text: Aqui, “Senhor” também pode ser entendido como a forma respeitosa de tratamento “senhor”.
    reason: κύριε pode indicar cortesia ou reconhecimento mais amplo da autoridade de Jesus.
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: Quando ele entrou na casa
  rationale: O particípio aoristo introduz a ação seguinte em sentido temporal. “Entrou na casa” expressa naturalmente o movimento para dentro indicado por εἰς e evita repetição com o verbo seguinte.
- source_word: προσῆλθον αὐτῷ
  choice: se aproximaram dele
  rationale: προσέρχομαι indica aproximar-se ou chegar-se a alguém. A forma pronominal é clara e natural em português.
- source_word: οἱ τυφλοί
  choice: os cegos
  rationale: O adjetivo substantivado identifica os dois homens cegos mencionados no contexto imediato; “os cegos” é conciso e idiomático.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Jesus lhes diz
  rationale: Mantém o presente histórico do grego e sua vivacidade narrativa sem alterar a sequência dos acontecimentos.
- source_word: Πιστεύετε
  choice: Vocês creem
  rationale: Expressa diretamente a confiança na capacidade de Jesus. “Vocês” torna explícito o plural do verbo grego e oferece boa legibilidade brasileira.
- source_word: ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: que eu posso fazer isso
  rationale: “Posso” traduz δύναμαι de modo natural, enquanto “fazer isso” conserva a referência contextual à cura sem explicá-la além do texto.
- source_word: λέγουσιν αὐτῷ
  choice: Eles lhe dizem
  rationale: Preserva, como na fala anterior, o presente histórico do original.
- source_word: Ναί
  choice: Sim
  rationale: Equivalente direto e natural da partícula afirmativa.
- source_word: κύριε
  choice: Senhor
  rationale: Preserva tanto a forma respeitosa de tratamento quanto a possível percepção da autoridade de Jesus, sem exigir que a fala seja entendida como uma confissão cristológica plenamente desenvolvida.
theological_decisions:
- issue: Sentido de κύριε ao dirigir-se a Jesus
  choice: Senhor
  alternative: senhor, como forma respeitosa de tratamento
  rationale: O termo pode funcionar como tratamento cortês e também sugerir reconhecimento de autoridade. A tradução “Senhor” mantém essa abertura sem resolver a ambiguidade em favor de apenas um sentido.
- issue: Presentes históricos λέγει e λέγουσιν
  choice: diz / dizem
  alternative: disse / disseram
  rationale: A manutenção do presente histórico reflete a textura narrativa do grego. Embora o passado seja mais convencional em narrativa portuguesa, o presente é compreensível e comunica a vivacidade do original.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira. Emprega “vocês” para deixar claro o plural de Πιστεύετε. Os presentes históricos foram mantidos deliberadamente; a pontuação e a colocação pronominal permanecem naturais em registro bíblico contemporâneo.
