source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: pt
  text: 'Ao passar dali, Jesus viu um homem chamado Mateus, sentado no posto de cobrança de impostos, e lhe diz[a]: “Siga-me.” Ele se levantou e o seguiu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lhe disse”; o grego emprega o presente histórico (“lhe diz”) para dar vivacidade à narrativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων ... ἐκεῖθεν
  choice: Ao seguir adiante dali
  rationale: Expressa o particípio presente e o movimento de Jesus para longe do lugar anterior, sem tornar a frase pesada.
- source_word: ἄνθρωπον
  choice: um homem
  rationale: O substantivo se refere aqui a um indivíduo do sexo masculino, identificado como Mateus.
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: sentado no posto de cobrança de impostos
  rationale: Descreve Mateus em seu local de trabalho como cobrador de impostos; “posto” é claro e evita sugerir uma repartição moderna.
- source_word: Μαθθαῖον λεγόμενον
  choice: chamado Mateus
  rationale: Reproduz de maneira natural a expressão que apresenta o nome pelo qual o homem era conhecido.
- source_word: λέγει αὐτῷ
  choice: lhe diz
  rationale: Mantém o presente histórico do grego e sua vivacidade narrativa. O pronome “lhe” comunica o destinatário sem repetição desnecessária.
- source_word: Ἀκολούθει μοι
  choice: Siga-me
  rationale: Imperativo singular direto e natural em português amplo, preservando tanto a ação concreta quanto a implicação de discipulado sem paráfrase.
- source_word: ἀναστὰς
  choice: Ele se levantou
  rationale: Representa o particípio aoristo como ação imediatamente anterior ao verbo principal e soa natural em português moderno.
- source_word: ἠκολούθησεν αὐτῷ
  choice: o seguiu
  rationale: Preserva a resposta concreta de Mateus e a dimensão implícita de discipulado sem explicitação interpretativa.
theological_decisions:
- issue: Natureza do chamado de Jesus a Mateus
  choice: Traduzir simplesmente como “Siga-me”
  alternative: “Venha ser meu discípulo” ou “Junte-se a mim”
  rationale: O contexto implica um chamado ao discipulado, mas a tradução direta mantém a concisão do grego e não acrescenta uma explicação teológica ao texto.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O presente histórico foi mantido apesar da alternância com verbos no passado, pois reproduz um recurso narrativo deliberado do texto grego; a nota oferece a forma narrativa mais comum em português.
