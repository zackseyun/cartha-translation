  text: τότε ἥψατο τῶν ὀφθαλμῶν αὐτῶν λέγων· Κατὰ τὴν πίστιν ὑμῶν γενηθήτω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: pt
  text: 'Então ele tocou nos olhos deles, dizendo: “Que lhes seja feito conforme a fé de vocês[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que lhes aconteça conforme a confiança de vocês”. A palavra grega pístis também pode ser traduzida como “confiança” ou, em alguns contextos, “fidelidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca naturalmente o acontecimento seguinte na sequência narrativa.
- source_word: ἥψατο
  choice: tocou
  rationale: Expressa de modo direto o contato físico indicado por ἅπτομαι.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: nos olhos deles
  rationale: O genitivo regido por ἅπτομαι identifica aquilo que foi tocado; esta é a construção idiomática em português.
- source_word: λέγων
  choice: dizendo
  rationale: Preserva a ligação participial e a simultaneidade com o ato de tocar.
- source_word: Κατὰ
  choice: conforme
  rationale: Transmite correspondência ou medida sem impor uma causalidade mais forte que a expressa pelo grego.
- source_word: τὴν πίστιν ὑμῶν
  choice: a fé que vocês têm
  rationale: Mantém o termo teológico tradicional “fé”, enquanto a formulação explicita naturalmente em português que se trata da fé deles.
- source_word: γενηθήτω
  choice: Que ... seja feito
  rationale: Preserva a força imperativa e a forma passiva do pronunciamento.
- source_word: ὑμῖν
  choice: lhes
  rationale: Representa de modo conciso o dativo de benefício, isto é, aquilo que é feito em favor deles.
theological_decisions:
- issue: Sentido de πίστις na declaração de cura
  choice: fé
  alternative: confiança
  rationale: No contexto, πίστις denota a confiança dos cegos na capacidade de Jesus, mas “fé” é a tradução principal tradicional e permanece semanticamente adequada. A alternativa “confiança” é registrada em nota sem reduzir a possível amplitude do termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa e “lhes” para o dativo. A ordem foi ajustada para soar natural sem apagar a estrutura e a força do grego.
