id: MAT.9.32
reference: Matthew 9:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Αὐτῶν δὲ ἐξερχομένων ἰδοὺ προσήνεγκαν αὐτῷ ⸀ἄνθρωπον κωφὸν δαιμονιζόμενον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/032.yaml
  text: As they were going out[a], behold, they brought to him a mute[c][b], demon-possessed man.
translation:
  language: pt
  text: Enquanto eles saíam, eis que lhe trouxeram um homem mudo[a] e endemoninhado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “surdo”. A palavra grega pode indicar incapacidade de ouvir ou de falar; aqui, a declaração do versículo seguinte de que o homem falou favorece “mudo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “demonizado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: Enquanto eles saíam
  rationale: O genitivo absoluto expressa simultaneidade e δέ marca a transição narrativa. A formulação é natural em português sem acrescentar uma conjunção desnecessária.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva a função de chamar a atenção e a vivacidade narrativa de ἰδού, em registro bíblico ainda claro para leitores modernos.
- source_word: προσήνεγκαν αὐτῷ
  choice: lhe trouxeram
  rationale: Expressa de modo idiomático tanto a ação de trazer quanto o pronome dativo αὐτῷ, cujo referente é Jesus.
- source_word: ἄνθρωπον
  choice: um homem
  rationale: Neste relato de cura, o substantivo designa um indivíduo adulto do sexo masculino; “homem” preserva essa referência.
- source_word: κωφὸν
  choice: mudo
  rationale: κωφός pode indicar surdez ou incapacidade de falar. O contexto imediato favorece “mudo”, pois o versículo seguinte informa que o homem passou a falar.
- source_word: δαιμονιζόμενον
  choice: endemoninhado
  rationale: Termo português reconhecível e conciso para alguém afligido por atuação demoníaca, sem especificar além do que o particípio grego afirma.
theological_decisions:
- issue: Descrição da aflição demoníaca
  choice: endemoninhado
  alternative: demonizado; sob o poder de um demônio
  rationale: A tradução mantém a afirmação direta do texto sobre uma aflição demoníaca real, mas não define sua natureza ou seu mecanismo com precisão maior que a do verbo grego.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Eis que” conserva deliberadamente a vivacidade narrativa do original. A coordenação “mudo e endemoninhado” trata os dois termos gregos como modificadores paralelos de “homem” e evita sugerir uma relação causal não explicitada.
