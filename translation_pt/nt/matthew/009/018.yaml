  source_fidelity: 'A tradução representa com precisão os elementos centrais do grego: a ação em curso de Jesus, o chamamento de atenção de ἰδού (“eis que”), a chegada de um ἄρχων, sua prostração, a morte recém-ocorrida da filha, o pedido de imposição da mão e a declaração confiante de que ela viverá. “Se prostrou diante dele” preserva adequadamente a amplitude de προσεκύνει sem impor uma leitura cultual.'
