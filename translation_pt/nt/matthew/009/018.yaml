source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: pt
  text: 'Enquanto ele lhes dizia essas coisas, eis que chegou um chefe e se prostrou diante dele, dizendo: “Minha filha acaba de morrer. Mas venha, ponha a mão sobre ela, e ela viverá.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: eis que
  rationale: Mantém a função de chamar a atenção para a entrada inesperada do chefe, em linguagem narrativa digna e compreensível.
- source_word: ἄρχων
  choice: chefe
  rationale: O termo é genérico neste versículo e designa alguém em posição de autoridade; “chefe” preserva essa generalidade sem acrescentar aqui a identificação sinagogal presente nos paralelos.
- source_word: προσεκύνει
  choice: se prostrou diante dele
  rationale: Expressa o gesto físico de reverência sem decidir por si só se se trata de homenagem ou adoração.
- source_word: ἄρτι ἐτελεύτησεν
  choice: acaba de morrer
  rationale: Reproduz o sentido temporal imediato de ἄρτι e o valor idiomático de ἐτελεύτησεν.
- source_word: ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν
  choice: ponha a mão sobre ela
  rationale: Tradução natural e próxima da formulação grega, preservando o singular “a mão”.
- source_word: ζήσεται
  choice: ela viverá
  rationale: Mantém a afirmação futura confiante do chefe sem explicitação interpretativa adicional.
theological_decisions:
- issue: Sentido de προσεκύνει
  choice: se prostrou diante dele
  alternative: o adorou
  rationale: O verbo pode indicar reverência, homenagem ou adoração conforme o contexto. A tradução escolhida preserva a ambiguidade e descreve o gesto sem resolver antecipadamente sua natureza teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O tratamento verbal “venha, ponha” é natural e respeitoso. “Eis que” conserva o destaque narrativo do original, embora tenha tonalidade literária.
