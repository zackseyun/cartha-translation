  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: pt
  text: E aconteceu que, enquanto Jesus estava reclinado à mesa na casa[a], eis que muitos cobradores de impostos e pecadores vieram e estavam reclinados à mesa com Jesus e seus discípulos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “estava fazendo uma refeição na casa”. O grego diz mais especificamente “estava reclinado à mesa”, refletindo a postura habitual nas refeições daquela época. O versículo diz apenas “na casa” e não identifica explicitamente de quem ela era.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: E aconteceu que, enquanto
  rationale: Preserva a transição narrativa e introduz naturalmente a circunstância temporal expressa pelo particípio seguinte.
- source_word: αὐτοῦ ἀνακειμένου
  choice: enquanto Jesus estava reclinado à mesa
  rationale: No contexto de uma refeição, ἀνάκειμαι descreve a postura antiga de reclinar-se à mesa. O nome “Jesus” esclarece em português o referente do pronome grego sem alterar sua identidade contextual.
- source_word: ἐν τῇ οἰκίᾳ
  choice: na casa
  rationale: Reproduz a expressão definida sem especificar de quem era a casa, algo que o versículo não declara explicitamente.
- source_word: ἰδοὺ
  choice: não representado por uma palavra isolada
  rationale: O marcador chama a atenção para a chegada inesperada do grupo; em português moderno, essa vivacidade é transmitida com mais naturalidade pela progressão direta da cena, evitando o arcaísmo “eis que”.
- source_word: τελῶναι
  choice: cobradores de impostos
  rationale: Equivalente atual e claro para agentes ligados à cobrança de tributos, preservando a categoria social mencionada no texto.
- source_word: ἁμαρτωλοὶ
  choice: pecadores
  rationale: Mantém o adjetivo substantivado e a categorização social e religiosa do original, sem explicá-la além do texto.
- source_word: ἐλθόντες
  choice: vieram
  rationale: Converte naturalmente o particípio aoristo em verbo finito português, mantendo a sequência narrativa.
- source_word: συνανέκειντο
  choice: se reclinaram à mesa com
  rationale: Preserva tanto a postura histórica da refeição quanto a ideia de participação conjunta à mesa.
- source_word: τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ
  choice: com ele e seus discípulos
  rationale: O pronome evita a repetição pouco natural de “Jesus” depois de o referente ter sido explicitado no início, e μαθηταί é adequadamente vertido por “discípulos”.
theological_decisions:
- issue: Postura durante a refeição e comunhão à mesa
  choice: Manter “reclinado à mesa” e “se reclinaram à mesa com”.
  alternative: “estava comendo” e “comeram com”
  rationale: A formulação conserva a imagem concreta da refeição compartilhada e sua relevância social no contexto, sem acrescentar interpretação doutrinária.
- issue: Identidade do dono da casa
  choice: Traduzir apenas “na casa”.
  alternative: “na casa de Mateus” ou “em sua casa”
  rationale: O grego deste versículo não identifica expressamente o proprietário; especificá-lo resolveria uma ambiguidade que deve ser preservada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção preserva a postura histórica à mesa sem soar excessivamente técnica. Evita identificar o dono da casa e não introduz qualificações confessionais.
