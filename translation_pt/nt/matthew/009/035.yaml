id: MAT.9.35
reference: Matthew 9:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: pt
  text: E Jesus percorria todas as cidades e aldeias, ensinando nas sinagogas deles, proclamando as boas-novas do Reino[a] e curando toda doença e toda enfermidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o evangelho do Reino”.
    reason: lexical_alternative
  - marker: b
    text: Ou “toda doença e toda debilidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: percorria
  rationale: O imperfeito retrata uma atividade itinerante contínua ou habitual; “percorria” expressa isso de modo natural e conciso.
- source_word: πόλεις πάσας καὶ τὰς κώμας
  choice: todas as cidades e aldeias
  rationale: Mantém a distinção entre centros urbanos e povoações menores, bem como o alcance abrangente de πάσας.
- source_word: διδάσκων
  choice: ensinando
  rationale: Reproduz naturalmente o particípio de ação simultânea e contínua.
- source_word: συναγωγαῖς αὐτῶν
  choice: sinagogas deles
  rationale: Preserva o termo histórico-religioso e traduz explicitamente o pronome αὐτῶν, provavelmente referente aos habitantes ou às comunidades mencionadas.
- source_word: κηρύσσων
  choice: proclamando
  rationale: Conserva a ideia de anúncio público própria de κηρύσσω sem restringi-la ao sentido eclesiástico moderno de “pregar”.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: as boas-novas do Reino
  rationale: “Boas-novas” comunica o sentido lexical de εὐαγγέλιον em linguagem acessível; “do Reino” mantém aberta a relação expressa pelo genitivo.
- source_word: θεραπεύων
  choice: curando
  rationale: É uma formulação corrente e apropriada para a restauração da saúde no contexto dos relatos de milagres.
- source_word: πᾶσαν νόσον
  choice: toda doença
  rationale: “Doença” é o equivalente moderno mais direto de νόσος, e “toda” preserva a abrangência do texto.
- source_word: πᾶσαν μαλακίαν
  choice: toda enfermidade
  rationale: μαλακία pode indicar debilidade, enfermidade ou mal; “enfermidade” mantém alguma distinção em relação a νόσος e continua compreensível em português moderno.
theological_decisions:
- issue: Tradução de εὐαγγέλιον
  choice: boas-novas
  alternative: evangelho
  rationale: A forma escolhida torna transparente o sentido de notícia favorável sem diminuir o conteúdo teológico; a alternativa tradicional é preservada em nota.
- issue: Relação genitiva em τῆς βασιλείας
  choice: do Reino
  alternative: acerca do Reino
  rationale: A tradução formal evita definir se o Reino é conteúdo, origem ou esfera das boas-novas, preservando a concisão e a possível amplitude do grego.
- issue: Abrangência de πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: toda doença e toda enfermidade
  alternative: toda doença e toda debilidade
  rationale: A repetição de πᾶσαν é mantida para conservar a ênfase abrangente, sem acrescentar uma explicação doutrinária ao enunciado narrativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção participial foi preservada por gerúndios naturais. “Reino” recebe inicial maiúscula por se referir ao Reino de Deus no contexto, sem expansão interpretativa.
