id: MAT.9.22
reference: Matthew 9:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: pt
  text: 'Mas Jesus, voltando-se e vendo-a, disse: “Tenha coragem, filha; a sua fé[a] salvou você.[b]” E, desde aquela hora, a mulher ficou curada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “fé” também pode ser entendida como “confiança”.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “curou você” ou “deixou você bem”. O verbo grego pode significar salvar, curar ou restabelecer; o texto principal preserva o sentido mais amplo nas palavras de Jesus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς καὶ ἰδὼν αὐτήν
  choice: voltando-se e vendo-a
  rationale: Mantém o fluxo dos dois particípios gregos e expressa de modo natural que Jesus se voltou e dirigiu o olhar para a mulher, sem especificar além do texto a direção do movimento.
- source_word: Θάρσει
  choice: Tenha coragem
  rationale: O imperativo transmite encorajamento e confiança. “Tenha coragem” é claro, atual e digno; evita o menos transparente “tenha bom ânimo”.
- source_word: θύγατερ
  choice: filha
  rationale: Preserva literalmente a forma terna e familiar de tratamento, sem acrescentar qualificadores ausentes do grego.
- source_word: πίστις
  choice: fé
  rationale: É a correspondência principal e tradicional de πίστις neste contexto. “Confiança” continua sendo uma nuance possível e é registrada em nota.
- source_word: σέσωκέν σε
  choice: salvou você
  rationale: O perfeito de σῴζω pode abranger salvação, cura e restauração. “Salvou você” conserva essa amplitude nas palavras de Jesus e soa natural para leitores brasileiros.
- source_word: ἐσώθη
  choice: ficou curada
  rationale: No comentário narrativo, o contexto torna explícito o restabelecimento físico da mulher. “Ficou curada” comunica claramente o resultado sem eliminar a amplitude da ocorrência anterior de σῴζω.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: desde aquela hora
  rationale: Reproduz de perto a expressão temporal grega e permanece clara e solene em português moderno.
theological_decisions:
- issue: Sentido de πίστις
  choice: fé
  alternative: confiança
  rationale: “Fé” preserva o termo teologicamente amplo e sua correspondência usual, enquanto a nota reconhece que aqui ele também pode destacar a confiança da mulher.
- issue: Sentidos de σῴζω nas duas ocorrências
  choice: “salvou você” na fala de Jesus e “ficou curada” na conclusão narrativa
  alternative: “curou você” ou “deixou você bem” na fala; “foi salva” na conclusão
  rationale: 'A diferença de tradução preserva a tensão semântica do verbo: a declaração de Jesus mantém a ressonância mais ampla de salvação, enquanto a conclusão identifica o resultado físico imediato no contexto.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção participial foi mantida sem rigidez excessiva; “você” evita a ambiguidade referencial de “a salvou” e é natural no português brasileiro. A repetição grega de σῴζω foi vertida de formas distintas para conservar tanto sua amplitude teológica quanto o resultado concreto da cura.
