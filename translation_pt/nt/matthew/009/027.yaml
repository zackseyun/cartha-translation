reference: Matthew 9:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ παράγοντι ἐκεῖθεν τῷ Ἰησοῦ ἠκολούθησαν ⸀αὐτῷ δύο τυφλοὶ κράζοντες καὶ λέγοντες· Ἐλέησον ἡμᾶς, ⸀υἱὲ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: pt
  text: 'Enquanto Jesus saía dali, dois cegos o seguiram, clamando: “Tenha misericórdia de nós, Filho de Davi!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filho de Davi” é um título régio e messiânico que identifica Jesus como o herdeiro prometido da linhagem de Davi.
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν τῷ Ἰησοῦ
  choice: Enquanto Jesus saía dali
  rationale: 'O particípio presente indica uma ação simultânea: os homens começaram a segui-lo enquanto ele deixava aquele lugar. A formulação preserva o fluxo narrativo sem sugerir que Jesus apenas passava pelos cegos.'
- source_word: ἠκολούθησαν αὐτῷ
  choice: o seguiram
  rationale: Expressa de modo natural o sentido narrativo de acompanhar fisicamente Jesus.
- source_word: δύο τυφλοὶ
  choice: dois cegos
  rationale: O adjetivo masculino plural é usado substantivamente. Em português, “dois cegos” é claro e natural, sem necessidade de acrescentar “homens”.
- source_word: κράζοντες καὶ λέγοντες
  choice: clamando
  rationale: “Clamando” comunica a voz alta e a urgência do apelo. A introdução dos dois particípios por um único verbo evita uma redundância pouco natural em português, sem perder conteúdo relevante.
- source_word: Ἐλέησον ἡμᾶς
  choice: Tenha misericórdia de nós
  rationale: Reproduz o pedido direto por uma intervenção misericordiosa em português atual e amplamente compreensível.
- source_word: υἱὲ Δαυίδ
  choice: Filho de Davi
  rationale: Mantém literalmente o título tradicional e sua ressonância régia e messiânica, em vez de reduzi-lo a uma simples indicação genealógica.
theological_decisions:
- issue: Significado messiânico de “Filho de Davi”
  choice: Manter “Filho de Davi” no texto principal e explicar sua ressonância em nota.
  alternative: “Descendente de Davi” ou uma expansão como “Filho messiânico de Davi”.
  rationale: O grego apresenta o título sem explicação. A tradução preserva sua formulação e sua força teológica, enquanto a nota oferece o contexto necessário sem inserir interpretação adicional nas palavras do versículo.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Clamando” conserva a intensidade do apelo sem soar coloquial; “Tenha misericórdia” oferece uma forma natural de tratamento respeitoso. O marcador da nota foi colocado junto ao título que ela explica.
