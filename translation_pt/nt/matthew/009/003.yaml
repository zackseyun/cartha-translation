  text: καὶ ἰδού τινες τῶν γραμματέων εἶπαν ἐν ἑαυτοῖς· Οὗτος βλασφημεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/003.yaml
  text: And behold[a], some of the scribes said among themselves, “This man is blaspheming.”
translation:
  language: pt
  text: 'E eis que alguns dos escribas disseram entre si[a]: “Este homem está blasfemando.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “disseram consigo mesmos”. A expressão grega pode indicar uma conversa reservada entre eles ou uma deliberação interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a coordenação narrativa simples do grego.
- source_word: ἰδού
  choice: eis que
  rationale: Preserva a função de chamar a atenção e a vivacidade narrativa, em formulação digna e reconhecível em português.
- source_word: τινες τῶν γραμματέων
  choice: alguns dos escribas
  rationale: Expressa naturalmente o subconjunto indefinido e conserva o termo tradicional e historicamente adequado para γραμματεῖς.
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: disseram entre si
  rationale: Preserva o verbo explícito 'disseram' e a dimensão plural da expressão, sem decidir se houve fala privada ou deliberação interior.
- source_word: Οὗτος
  choice: Este homem
  rationale: Traduz o demonstrativo de modo natural e mantém seu possível tom depreciativo no contexto.
- source_word: βλασφημεῖ
  choice: está blasfemando
  rationale: O presente progressivo é natural na cena narrativa e preserva diretamente a acusação de blasfêmia.
theological_decisions:
- issue: A acusação dos escribas contra Jesus
  choice: Este homem está blasfemando
  alternative: Este homem blasfema; Ele está proferindo blasfêmia
  rationale: Mantém a acusação em toda a sua força sem antecipar a resposta narrativa nem inserir uma explicação teológica posterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Eis que” conserva a marca discursiva do original; “escribas” mantém o referente histórico sem paráfrase interpretativa.
