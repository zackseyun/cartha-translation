  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: pt
  text: 'Pois o que é mais fácil: dizer[a]: “Seus pecados estão perdoados”, ou dizer: “Levante-se e ande”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Seus pecados foram perdoados”. O presente passivo grego pode ser entendido como expressão de um estado resultante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: Pois o que é mais fácil
  rationale: τί com o comparativo εὐκοπώτερον introduz uma escolha entre duas alternativas. Em português, “o que é mais fácil” é a formulação mais natural; “pois” preserva a ligação explicativa de γάρ com o versículo anterior.
- source_word: εἰπεῖν
  choice: dizer
  rationale: O infinitivo indica o simples ato de falar; “dizer” é claro e mantém o paralelismo das duas orações.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Seus pecados estão perdoados
  rationale: O presente passivo, com “pecados” como sujeito gramatical, pode expressar um estado resultante. “Estão perdoados” é natural em português e conserva o valor presente sem sugerir uma ação progressiva.
- source_word: ἁμαρτίαι
  choice: pecados
  rationale: Equivalente padrão e direto no contexto, sem necessidade de ampliar a expressão metaforicamente.
- source_word: Ἔγειρε
  choice: Levante-se
  rationale: O imperativo de ἐγείρω, em contexto de cura, ordena que a pessoa se erga. “Levante-se” é atual, claro e digno.
- source_word: καὶ περιπάτει
  choice: e ande
  rationale: O imperativo presente de περιπατέω pede a ação de caminhar depois de se levantar. “E ande” expressa isso de modo simples e idiomático.
- source_word: σου
  choice: seus
  rationale: O pronome é singular e possessivo; “seus” concorda naturalmente com “pecados” no tratamento direto em português.
theological_decisions:
- issue: Formulação da declaração de perdão feita por Jesus
  choice: Seus pecados estão perdoados
  alternative: Seus pecados foram perdoados
  rationale: O presente passivo grego permite uma leitura de estado resultante, mas não exige que a tradução determine de maneira mais específica o momento do perdão. A formulação escolhida preserva a força da declaração e deixa a questão da autoridade de Jesus ser desenvolvida pelo contexto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O paralelismo retórico foi preservado, assim como a ligação explicativa com o versículo anterior. A pontuação coloca o marcador junto à primeira ocorrência de “dizer”, conforme a nota relacionada à declaração seguinte.
