source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: pt
  text: Nem se põe vinho novo em odres velhos. Caso contrário, os odres se rompem, o vinho se derrama, e os odres ficam arruinados. Mas põe-se vinho novo em odres novos[a], e ambos são preservados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego distingue vinho “novo” (νέος) de odres “novos” (καινός), termo que aqui ressalta que os odres são novos ou estão em condição fresca, própria para receber o vinho.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ βάλλουσιν
  choice: Também não se põe
  rationale: Liga este exemplo negativo ao dito anterior e emprega uma construção impessoal natural em português para uma prática geral.
- source_word: οἶνον νέον
  choice: vinho novo
  rationale: Expressão corrente e direta para vinho recém-produzido; mantém o contraste do texto.
- source_word: ἀσκοὺς παλαιούς
  choice: odres velhos
  rationale: “Odres” designa com precisão os recipientes de pele usados para vinho, e “velhos” traduz diretamente παλαιούς.
- source_word: εἰ δὲ μή γε
  choice: Caso contrário
  rationale: Expressa naturalmente a consequência da prática inadequada.
- source_word: ῥήγνυνται
  choice: se rompem
  rationale: Descreve claramente os odres abrindo-se sob pressão, em registro digno e corrente.
- source_word: ἐκχεῖται
  choice: se derrama
  rationale: Comunica a perda involuntária do vinho quando os odres se rompem.
- source_word: ἀπόλλυνται
  choice: ficam arruinados
  rationale: Indica que os odres se tornam inutilizáveis sem sugerir necessariamente aniquilação absoluta.
- source_word: ἀλλὰ βάλλουσιν
  choice: Em vez disso, põe-se
  rationale: Mantém o contraste corretivo e a formulação geral da prática apropriada.
- source_word: ἀσκοὺς καινούς
  choice: odres novos
  rationale: É a formulação portuguesa mais clara e idiomática; uma nota registra a nuance de καινός como novo ou renovado quanto à condição.
- source_word: ἀμφότεροι συντηροῦνται
  choice: ambos são preservados
  rationale: Mantém a referência conjunta ao vinho e aos odres e reproduz o valor passivo do verbo.
theological_decisions:
- issue: Distinção entre νέος e καινός no mesmo versículo
  choice: Traduzir ambos por “novo” no corpo do texto e registrar em nota a diferença lexical
  alternative: Traduzir οἶνον νέον por “vinho novo” e ἀσκοὺς καινούς por “odres frescos”
  rationale: Embora o grego use adjetivos diferentes, “odres frescos” não é expressão natural nem imediatamente clara em português. A nota preserva a nuance de que καινός aponta para odres novos ou em condição renovada, sem tornar o texto principal artificial.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Odres” conserva o elemento histórico necessário; a construção impessoal evita uma mudança desnecessária para um sujeito específico.
