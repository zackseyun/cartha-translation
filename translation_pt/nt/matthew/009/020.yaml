  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: pt
  text: E eis que uma mulher que sofria de sangramento havia doze anos se aproximou por trás dele e tocou na franja[a][b] da veste dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “borla” ou “barra”; o termo grego pode indicar a franja ou a borda de uma veste, possivelmente incluindo a borla associada à indumentária judaica.
    reason: lexical_alternative
  - marker: b
    text: Veja Números 15:38 e Deuteronômio 22:12 quanto ao contexto das franjas ou borlas nas vestes segundo a Lei de Israel.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: E eis que
  rationale: Mantém a ligação narrativa e a força vívida do marcador de atenção, em linguagem bíblica ainda compreensível no português atual.
- source_word: γυνὴ αἱμορροοῦσα
  choice: uma mulher que sofria de sangramento
  rationale: Expressa de modo natural uma condição contínua de perda de sangue, sem sugerir necessariamente uma hemorragia aguda.
- source_word: δώδεκα ἔτη
  choice: havia doze anos
  rationale: Forma idiomática em português para indicar a duração da condição até aquele momento.
- source_word: προσελθοῦσα ὄπισθεν
  choice: se aproximou por trás dele
  rationale: Reproduz o movimento de aproximação e explicita naturalmente que ela veio pela retaguarda de Jesus.
- source_word: ἥψατο
  choice: tocou
  rationale: É o sentido contextual adequado, sem intensificar o contato como se ela tivesse agarrado a veste.
- source_word: τοῦ κρασπέδου
  choice: na franja
  rationale: Preserva a amplitude do termo, que pode indicar a franja, a borda ou o pendão da roupa, sem impor uma reconstrução técnica no texto principal.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: de sua veste
  rationale: “Veste” é amplo e digno, sem especificar mais do que o termo grego, que designa uma peça de roupa, frequentemente exterior.
theological_decisions:
- issue: Possível significado judaico de κράσπεδον como franja ou pendão ligado à borda da veste
  choice: Traduzir de modo geral como “franja” no texto principal
  alternative: Traduzir como “pendão” para salientar a possível alusão a Números 15:38 e Deuteronômio 22:12, ou como “barra” para destacar apenas a borda da veste
  rationale: “Franja” mantém aberta tanto a referência à extremidade da veste quanto a possível associação com os pendões prescritos na Lei, sem transformar essa possibilidade cultural em certeza interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “E eis que” preserva a vivacidade narrativa do grego; “sangramento” comunica a enfermidade crônica em linguagem corrente. Os marcadores foram colocados imediatamente após “franja”, termo ao qual ambas as notas se referem.
