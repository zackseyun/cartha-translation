  text: ἔλεγεν γὰρ ἐν ἑαυτῇ· Ἐὰν μόνον ἅψωμαι τοῦ ἱματίου αὐτοῦ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/021.yaml
  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: pt
  text: 'Pois ela dizia consigo mesma: “Se eu apenas tocar na roupa dele, serei salva[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serei curada” ou “ficarei bem”. O grego diz “serei salva”, usando um verbo que, neste contexto, também pode se referir à cura.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito apresenta uma fala interior em curso ou repetida; “dizia” conserva naturalmente esse aspecto em português.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação do que ocorre na narrativa, preservando a força explicativa do conectivo.
- source_word: ἐν ἑαυτῇ
  choice: consigo mesma
  rationale: Expressão idiomática clara para pensamento ou fala interior, mantendo o valor reflexivo.
- source_word: Ἐὰν μόνον
  choice: Se eu apenas
  rationale: Expressa uma condição mínima com foco enfático no simples ato de tocar.
- source_word: ἅψωμαι
  choice: tocar
  rationale: No período condicional, o subjuntivo aoristo é expresso naturalmente pelo futuro do subjuntivo português depois de “se”; o verbo significa “tocar” neste contexto.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: na roupa dele
  rationale: ἱμάτιον designa uma peça de roupa, muitas vezes exterior. “Roupa” evita especificar demais como “manto” e soa natural no português corrente.
- source_word: σωθήσομαι
  choice: serei salva
  rationale: O futuro passivo de σῴζω pode indicar salvação, livramento ou cura. O texto principal conserva a formulação ampla “serei salva”, enquanto a nota registra o sentido contextual de cura.
theological_decisions:
- issue: Tradução de σωθήσομαι em um contexto de cura
  choice: serei salva
  alternative: serei curada; ficarei bem
  rationale: Embora o contexto imediato seja a cura física, o grego emprega σῴζω, verbo semanticamente mais amplo que um termo estritamente médico. “Serei salva” preserva essa amplitude e sua possível ressonância teológica sem resolver a tensão do texto; a nota esclarece o sentido contextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Consigo mesma” preserva a fala interior; “roupa” é corrente e não especifica além do grego. A construção condicional é idiomática em português.
