id: MAT.9.14
reference: Matthew 9:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: pt
  text: 'Então os discípulos de João se aproximaram de Jesus e perguntaram: “Por que nós e os fariseus jejuamos frequentemente[a], mas os teus discípulos não jejuam?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “jejuamos muito” ou “jejuamos muitas vezes”; o grego πολλά, com “jejuar”, expressa uma prática frequente.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca de modo natural a sequência narrativa, sem sugerir uma datação mais específica do que o grego.
- source_word: προσέρχονται αὐτῷ
  choice: se aproximaram de Jesus
  rationale: Expressa o movimento em direção a ele de forma corrente em português. O nome 'Jesus' explicita o referente do pronome sem alterar o sentido.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: os discípulos de João
  rationale: Construção possessiva natural em português e forma tradicional do nome Ἰωάννης.
- source_word: λέγοντες
  choice: e perguntaram
  rationale: No contexto, o conteúdo introduzido é uma pergunta. A coordenação produz português natural e conserva a ação simultânea do particípio.
- source_word: Διὰ τί
  choice: Por que
  rationale: Equivalente interrogativo direto e idiomático para uma pergunta sobre a razão.
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: nós e os fariseus
  rationale: Mantém o pronome enfático e a associação explícita dos dois grupos na comparação.
- source_word: νηστεύομεν
  choice: jejuamos
  rationale: Termo religioso corrente que designa a abstinência de alimento como prática devocional.
- source_word: πολλά
  choice: frequentemente
  rationale: Usado adverbialmente com 'jejuar', indica prática repetida ou frequente; esta formulação é clara e natural.
- source_word: οἱ δὲ μαθηταί σου
  choice: mas os teus discípulos
  rationale: '''Mas'' transmite o contraste marcado por δέ; ''teus'' preserva a referência direta ao interlocutor e evita possível ambiguidade de ''seus''.'
- source_word: οὐ νηστεύουσιν
  choice: não jejuam
  rationale: O presente expressa aqui uma prática habitual, em contraste com o jejum frequente dos outros grupos.
theological_decisions:
- issue: Natureza da queixa sobre o jejum
  choice: Apresentar a pergunta como comparação entre práticas religiosas habituais.
  alternative: Entendê-la como acusação explícita de violação de um dever, ou como referência exclusiva a uma única ocasião de jejum.
  rationale: Os verbos no presente e o advérbio πολλά apontam para um padrão de prática. A tradução preserva a tensão da pergunta sem acrescentar condenação doutrinária nem restringir o sentido a um único episódio.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A fala direta usa 'teus' para evitar a ambiguidade de 'seus', sem recorrer a uma formulação excessivamente coloquial.
