    issue: “o remendo se desprende da roupa”
    rationale: Essa formulação pode significar somente que o remendo se solta. αἴρει, no contexto, descreve o remendo que puxa/arranca da roupa, levando ao rasgo pior. “Puxa a roupa” preserva melhor a força causal sem especificar indevidamente o modo exato do dano.
