source:
  edition: SBLGNT
  text: οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: pt
  text: Mas ninguém põe um remendo de tecido não encolhido[a] numa roupa velha, pois o remendo puxa a roupa, e o rasgo fica pior.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de tecido não submetido à fulagem”; o grego descreve um tecido que ainda não passou por esse acabamento, processo que o encolhe e, assim, faz o remendo puxar a roupa velha.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δὲ
  choice: Mas ninguém
  rationale: δὲ introduz uma transição levemente contrastiva, e οὐδεὶς expressa uma negação universal sem marca de gênero.
- source_word: ἐπιβάλλει ἐπίβλημα
  choice: põe um remendo
  rationale: A expressão descreve a aplicação de uma peça para reparar a roupa; a formulação é natural em português sem especificar além do texto que ela seja costurada.
- source_word: ῥάκους ἀγνάφου
  choice: de tecido não encolhido
  rationale: ἄγναφος descreve tecido ainda não submetido ao acabamento que o faria encolher. A escolha comunica de modo claro o mecanismo da ilustração.
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: numa roupa velha
  rationale: ἱμάτιον pode designar uma peça de vestuário; “roupa” é amplo, claro e corrente.
- source_word: αἴρει ... ἀπὸ τοῦ ἱματίου
  choice: se desprende da roupa
  rationale: No contexto, αἴρει indica que o remendo se afasta da roupa sob tensão. “Se desprende” preserva o efeito sem impor que o próprio remendo rasgue.
- source_word: τὸ πλήρωμα αὐτοῦ
  choice: o remendo
  rationale: Literalmente, a expressão é “o seu enchimento/complemento”, mas aqui retoma a peça usada para preencher o rasgo, isto é, o remendo.
- source_word: καὶ χεῖρον σχίσμα γίνεται
  choice: e o rasgo fica pior
  rationale: A tradução conserva o comparativo χεῖρον e expressa naturalmente o estado resultante indicado por γίνεται.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Roupa” evita o tom excessivamente técnico de “vestimenta”, e “tecido não encolhido” torna acessível a imagem sem eliminar a alternativa lexical indicada em nota.
