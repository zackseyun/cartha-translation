  source_fidelity: 'A tradução preserva bem a negação universal, o contraste, a imagem do remendo de tecido não encolhido e o resultado de um rasgo pior. Contudo, “o remendo se desprende da roupa” enfraquece αἴρει ... ἀπὸ τοῦ ἱματίου: no encadeamento da imagem, o remendo novo exerce tração sobre a roupa velha, causando ou agravando o rasgo; não se trata meramente de o remendo soltar-se.'
  naturalness: O texto é claro, moderno e natural em português de ampla compreensão. “Puxa a roupa” comunica a relação causal de modo mais direto e idiomático do que “se desprende da roupa”.
  terminology: “Remendo”, “tecido não encolhido”, “roupa velha” e “rasgo” são escolhas adequadas. A nota pode identificar com maior precisão a alternativa técnica para ἀγνάφου, explicando-a sem exigir que o leitor conheça o termo especializado.
