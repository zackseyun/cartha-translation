  yaml_path: translation/nt/matthew/009/019.yaml
  text: And Jesus rose and followed him, and his disciples did too.
translation:
  language: pt
  text: E Jesus se levantou e o seguiu, e seus discípulos também.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: se levantou
  rationale: O particípio aoristo passivo de ἐγείρω tem aqui sentido intransitivo e introduz a ação seguinte. “Se levantou” é natural em português e expressa o movimento de levantar-se para ir.
- source_word: ἠκολούθει
  choice: seguiu
  rationale: O imperfeito de ἀκολουθέω pode retratar uma ação em curso, mas, nesta sequência narrativa, o pretérito perfeito comunica naturalmente o acontecimento sem acentuar em excesso seu aspecto progressivo.
- source_word: αὐτῷ
  choice: o
  rationale: O dativo é regido por ἀκολουθέω; em português, o complemento direto de “seguir” é expresso naturalmente por “o”. O antecedente é o dirigente mencionado no versículo anterior.
- source_word: μαθηταὶ
  choice: discípulos
  rationale: “Discípulos” é a tradução corrente e contextualmente precisa de μαθηταί nos Evangelhos, preservando a relação entre mestre e aprendizes-seguidores.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: e seus discípulos também
  rationale: O grego não repete o verbo na segunda oração. A elipse com “também” é clara e natural em português; “seus” se refere a Jesus.
