id: MAT.9.12
reference: Matthew 9:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: pt
  text: 'Mas ele, ao ouvir isso, disse: “Os que têm saúde não precisam de médico, mas os doentes, sim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας
  choice: Mas ele, ao ouvir isso
  rationale: O particípio aoristo tem valor circunstancial, naturalmente expresso por “ao ouvir”. O pronome “ele” retoma Jesus no contexto, e “isso” explicita em português o objeto implícito do que foi ouvido. δέ introduz uma resposta em leve contraste, daí “Mas”.
- source_word: εἶπεν
  choice: disse
  rationale: Tradução direta e natural do verbo comum de fala, sem acrescentar a ideia mais específica de “respondeu”.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: não precisam de
  rationale: Expressa de modo corrente em português o sentido do idioma grego “não têm necessidade de”, evitando uma formulação mais pesada.
- source_word: οἱ ἰσχύοντες
  choice: os que têm saúde
  rationale: Embora ἰσχύω possa significar “ser forte”, o contraste médico com os doentes indica aqui aqueles que estão bem ou têm saúde. A escolha preserva a imagem e soa natural em português.
- source_word: ἰατροῦ
  choice: médico
  rationale: Equivalente português corrente de ἰατρός; depois de “precisar de”, o substantivo sem artigo é idiomático e mantém o caráter proverbial da frase.
- source_word: ἀλλὰ οἱ κακῶς ἔχοντες
  choice: mas sim os doentes
  rationale: κακῶς ἔχειν é um idioma para estar enfermo. “Mas sim” torna explícito o contraste corretivo de ἀλλά, enquanto “os doentes” comunica o sentido com clareza.
theological_decisions:
- issue: Sentido físico da imagem e sua aplicação espiritual no contexto
  choice: 'Manter a declaração em termos médicos: pessoas com saúde, médico e doentes.'
  alternative: Explicitar na tradução que Jesus se refere aos pecadores e à necessidade espiritual deles.
  rationale: O versículo formula um provérbio por meio de uma imagem médica; é o contexto que fornece sua aplicação espiritual. Não explicitar essa aplicação no texto preserva a metáfora e a tensão do original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Os que têm saúde” é mais idiomático neste contraste do que “os fortes”, e “médico” é preferível a termos mais formais ou arcaizantes.
