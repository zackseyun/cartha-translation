id: MAT.9.13
reference: Matthew 9:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: pt
  text: 'Mas vão e aprendam o que significa: “Quero misericórdia, e não sacrifício.”[a] Pois não vim chamar os justos,[b] mas os pecadores.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Citação de Oseias 6:6.
    reason: cross_reference
  - marker: b
    text: Ou, possivelmente, “os que se consideram justos”; o grego diz apenas “os justos”.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: vão
  rationale: O particípio aoristo funciona idiomaticamente com o imperativo seguinte; “vão e aprendam” reproduz com naturalidade a ordem e seu tom de repreensão.
- source_word: μάθετε
  choice: aprendam
  rationale: Mantém a força imperativa de adquirir entendimento, sem substituir o processo de aprender por uma paráfrase explicativa.
- source_word: τί ἐστιν
  choice: o que significa
  rationale: Expressão idiomática que introduz o sentido da citação; esta formulação é natural em português, embora literalmente seja “o que é isto”.
- source_word: Ἔλεος
  choice: misericórdia
  rationale: Equivalente tradicional e semanticamente amplo, preservando tanto a dimensão ética quanto a ressonância pactual da citação de Oseias.
- source_word: θέλω
  choice: quero
  rationale: Traduz diretamente a vontade divina expressa pelo verbo, em linguagem atual e digna; “desejo” seria possível, mas menos espontâneo.
- source_word: θυσίαν
  choice: sacrifício
  rationale: Correspondência direta e convencional, mantendo o singular do texto grego.
- source_word: ἦλθον
  choice: não vim
  rationale: O aoristo refere-se de modo conciso à missão de Jesus e é naturalmente vertido pelo pretérito perfeito em português.
- source_word: καλέσαι
  choice: chamar
  rationale: Preserva a amplitude do verbo, que pode envolver convocação e convite, sem decidir entre essas nuances.
- source_word: δικαίους
  choice: os justos
  rationale: Mantém a forma substantivada e a ambiguidade do grego quanto a serem realmente justos ou se considerarem justos.
- source_word: ἁμαρτωλούς
  choice: os pecadores
  rationale: Equivalente direto que conserva o contraste moral incisivo com “os justos”.
theological_decisions:
- issue: Força da citação de Oseias 6:6
  choice: 'Conservar o contraste direto: “Quero misericórdia, e não sacrifício”.'
  alternative: Parafrasear como rejeição absoluta de todo sacrifício ou suavizar como mera preferência circunstancial.
  rationale: A formulação profética contrapõe misericórdia e sacrifício para repreender prioridades erradas, sem que a tradução deva construir uma doutrina mais ampla do que o texto afirma.
- issue: Referência de “os justos”
  choice: Traduzir literalmente como “os justos”.
  alternative: Explicitar “os que se consideram justos” ou “os que têm justiça própria”.
  rationale: O contexto pode sugerir ironia, mas o grego não a explicita. A tradução preserva a tensão entre uma referência literal e uma possível crítica à autopercepção dos interlocutores.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais no plural adequadas ao discurso dirigido aos fariseus. A citação mantém concisão proverbial e o contraste do original. Optou-se por não acrescentar nota para a alternativa estritamente literal de τί ἐστιν, pois “o que significa” comunica naturalmente o valor idiomático sem perda relevante.
