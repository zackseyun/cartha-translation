id: MAT.9.36
reference: Matthew 9:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: pt
  text: Ao ver as multidões, ele teve compaixão delas, porque estavam maltratadas e abatidas,[a] como ovelhas sem pastor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aflitas e desamparadas”. Os termos gregos também podem ser entendidos, de modo mais interpretativo, como descrevendo pessoas desgastadas e incapazes de cuidar de si mesmas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Ao ver
  rationale: O particípio aoristo é expresso naturalmente como uma oração temporal; δέ é um conectivo narrativo leve que não exige tradução explícita em português.
- source_word: τοὺς ὄχλους
  choice: as multidões
  rationale: Designa grandes grupos de pessoas; “multidões” é corrente, claro e preserva o plural.
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: ele teve compaixão delas
  rationale: Comunica a compaixão profunda expressa pelo verbo grego em linguagem natural e digna.
- source_word: ὅτι
  choice: porque
  rationale: Introduz claramente a razão da compaixão de Jesus.
- source_word: ἐσκυλμένοι
  choice: maltratadas
  rationale: O particípio pode indicar pessoas afligidas, molestadas ou desgastadas por maus-tratos; “maltratadas” conserva essa força sem exagerar a imagem.
- source_word: ἐρριμμένοι
  choice: abatidas
  rationale: O particípio de ῥίπτω evoca terem sido lançadas ao chão; “abatidas” preserva tanto a imagem de prostração quanto seu efeito emocional em português natural.
- source_word: ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα
  choice: como ovelhas sem pastor
  rationale: Reproduz de modo idiomático e direto a comparação e a vulnerabilidade de um rebanho sem quem o conduza.
theological_decisions:
- issue: Linguagem da compaixão de Jesus
  choice: ele teve compaixão delas
  alternative: ele se compadeceu delas
  rationale: A formulação escolhida preserva a intensidade da misericórdia de Jesus em linguagem transparente, sem acrescentar uma interpretação doutrinária.
- issue: Condição das multidões
  choice: maltratadas e abatidas
  alternative: aflitas e desamparadas
  rationale: A opção principal permanece próxima das imagens lexicais dos particípios gregos, enquanto a alternativa mais interpretativa é registrada em nota para preservar a amplitude semântica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é simples e digno; evita-se tanto o arcaísmo quanto a explicitação interpretativa excessiva.
source_grounding:
  english_pob_role: consult_only
