id: MAT.9.15
reference: Matthew 9:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: pt
  text: 'E Jesus lhes disse: “Será que os acompanhantes do noivo podem ficar de luto enquanto o noivo está com eles?[a] Mas virão dias em que o noivo lhes será tirado[b]; então jejuarão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os filhos da câmara nupcial”, expressão que designa os companheiros do noivo ou seus acompanhantes na celebração do casamento.
    reason: lexical_alternative
  - marker: b
    text: Ou “for afastado deles”. A forma passiva sugere mais do que uma partida comum.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: os acompanhantes do noivo
  rationale: A expressão, literalmente “filhos da câmara nupcial”, é um semitismo que designa os companheiros do noivo ou participantes próximos da celebração. “Acompanhantes do noivo” comunica o papel social com clareza em português atual.
- source_word: πενθεῖν
  choice: ficar de luto
  rationale: Expressa lamentação ou pesar associado à perda e mantém o contraste com o jejum. A locução é natural e digna em português.
- source_word: ἐφ’ ὅσον
  choice: enquanto
  rationale: 'Reproduz de modo natural o sentido temporal durativo: durante todo o tempo em que o noivo está presente.'
- source_word: νυμφίος
  choice: noivo
  rationale: É o termo corrente em português para o homem que se casa e preserva a imagem nupcial sem explicitar suas possíveis implicações cristológicas.
- source_word: ἀπαρθῇ
  choice: lhes será tirado
  rationale: Preserva a voz passiva e a possível ideia de remoção imposta, mais forte do que uma simples partida, sem explicar além do que o texto afirma.
- source_word: νηστεύσουσιν
  choice: jejuarão
  rationale: Verbo futuro direto e idiomático, correspondente ao sentido inequívoco de praticar jejum.
- source_word: Μὴ δύνανται ... ;
  choice: Será que ... podem ...?
  rationale: A pergunta retórica introduzida por μή espera resposta negativa. Esta formulação conserva a força interrogativa sem recorrer a uma construção artificial em português.
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Mas virão dias
  rationale: Formulação portuguesa natural que mantém a referência indefinida a dias futuros e o contraste leve de δέ.
theological_decisions:
- issue: Possível significado cristológico da imagem do noivo
  choice: Manter “noivo” como metáfora, sem identificar explicitamente Jesus como noivo messiânico.
  alternative: Expandir interpretativamente a tradução para explicar que Jesus é o noivo messiânico.
  rationale: O próprio versículo permite que a identificação seja inferida, mas não explicita seu alcance teológico. A tradução preserva a imagem e sua tensão sem acrescentar interpretação doutrinária.
- issue: Possível alusão à morte de Jesus em ἀπαρθῇ
  choice: Traduzir pela passiva forte “lhes será tirado”.
  alternative: Usar a expressão neutra “for embora” ou explicitar “for morto”.
  rationale: A forma grega sugere remoção, possivelmente violenta, mas não menciona diretamente a morte. A redação escolhida conserva a sugestão sem torná-la uma explicação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação conserva dignidade narrativa, clareza oral e a força da pergunta retórica. “Noivo” é preferido a termos mais arcaicos, e o semitismo é traduzido idiomaticamente, com a forma literal registrada em nota.
