id: MAT.9.11
reference: Matthew 9:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ Φαρισαῖοι ⸀ἔλεγον τοῖς μαθηταῖς αὐτοῦ· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίει ὁ διδάσκαλος ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: pt
  text: 'Ao verem isso[a], os fariseus diziam aos discípulos dele: “Por que o mestre de vocês come com cobradores de impostos e pecadores?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “E, vendo isso, os fariseus diziam aos discípulos dele...”. O particípio grego deixa implícito o objeto de “ver”, que, no contexto, é a cena da refeição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Ao verem isso
  rationale: O particípio aoristo de ὁράω recebe valor temporal natural em português. “Isso” explicita o objeto implícito no grego e remete à refeição descrita no contexto.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito grego apresenta a fala sob aspecto durativo ou em desenvolvimento; “diziam” preserva esse aspecto sem tornar a frase artificial.
- source_word: μαθηταῖς
  choice: discípulos
  rationale: É o termo corrente nos Evangelhos e preserva a relação entre mestre e discípulo.
- source_word: Διὰ τί
  choice: Por que
  rationale: Forma interrogativa idiomática e direta em português.
- source_word: τελωνῶν
  choice: cobradores de impostos
  rationale: Expressão clara e atual para os agentes de arrecadação socialmente estigmatizados daquele contexto.
- source_word: ἁμαρτωλῶν
  choice: pecadores
  rationale: Correspondência direta e tradicional que mantém tanto a dimensão moral quanto a designação social presente no contexto.
- source_word: ἐσθίει
  choice: come
  rationale: Traduz o sentido básico e o presente da pergunta sem acrescentar formalidade ou interpretação.
- source_word: διδάσκαλος
  choice: mestre
  rationale: Em português, “mestre” exprime naturalmente o papel de quem ensina e combina bem com a relação indicada por “discípulos”, sem importar o título específico “rabi”.
theological_decisions:
- issue: Explicitação do objeto de ἰδόντες
  choice: Acrescentar “isso” no texto
  alternative: “E, vendo, os fariseus...” ou “Ao verem, os fariseus...”
  rationale: O grego deixa o objeto implícito, referindo-se à cena da refeição. O português natural favorece sua explicitação; “isso” esclarece a referência sem resolver qualquer questão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Mestre de vocês” evita regionalismos marcados; “cobradores de impostos” é transparente para leitores contemporâneos. O imperfeito “diziam” mantém a nuance aspectual do original.
