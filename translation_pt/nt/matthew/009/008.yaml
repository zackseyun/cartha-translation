id: MAT.9.8
reference: Matthew 9:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: pt
  text: Ao verem isso, porém, as multidões ficaram com medo[a] e glorificaram a Deus, que havia dado tal autoridade aos homens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foram tomados de temor reverente”. O verbo grego significa mais literalmente “ficaram com medo”, mas aqui o temor pode incluir assombro reverente.
    reason: lexical_alternative
  - marker: b
    text: Ou “às pessoas” ou “aos seres humanos”. O grego diz “aos homens”, expressão que pode representar a humanidade em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Ao verem isso
  rationale: O particípio aoristo é expresso naturalmente como oração temporal. “Isso” explicita o objeto implícito — o acontecimento que acabavam de presenciar — sem definir além do contexto se a ênfase recai na cura, no perdão ou em ambos.
- source_word: δὲ
  choice: porém
  rationale: Marca a transição para a reação das multidões e preserva uma leve nuance de contraste, com colocação natural em português.
- source_word: οἱ ὄχλοι
  choice: as multidões
  rationale: Preserva o plural grego em linguagem atual e digna.
- source_word: ἐφοβήθησαν
  choice: ficaram com medo
  rationale: Mantém o sentido lexical direto de φοβέομαι e não reduz interpretativamente a reação a mera admiração reverente.
- source_word: ἐδόξασαν
  choice: glorificaram
  rationale: Conserva o peso teológico e a correspondência lexical de δοξάζω, sendo também expressão corrente no registro bíblico moderno.
- source_word: τὸν θεὸν
  choice: a Deus
  rationale: É o objeto direto de “glorificaram”; a regência com “a” é natural em português.
- source_word: τὸν δόντα
  choice: que havia dado
  rationale: Transforma o particípio atributivo em oração relativa idiomática e apresenta a concessão da autoridade como anterior à reação das multidões.
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: Expressa melhor a ideia de direito ou autoridade conferida do que a noção mais genérica de poder.
- source_word: τοιαύτην
  choice: tal
  rationale: Equivalente conciso e natural para a qualidade demonstrativa de τοιαύτην.
- source_word: τοῖς ἀνθρώποις
  choice: aos homens
  rationale: Preserva a forma masculina plural do grego e a tensão narrativa de a multidão falar de autoridade dada “aos homens” ao reagir ao ato de Jesus; a possível referência representativa à humanidade é indicada em nota.
theological_decisions:
- issue: Se a reação da multidão deve ser traduzida como medo ou suavizada para assombro reverente
  choice: ficaram com medo
  alternative: ficaram tomados de reverência; ficaram admirados
  rationale: O verbo grego denota diretamente temor, embora o contexto de glorificar a Deus permita que esse temor inclua reverência. O texto principal preserva a tensão, e a nota registra a nuance possível.
- issue: Alcance de τοῖς ἀνθρώποις
  choice: aos homens
  alternative: às pessoas; aos seres humanos
  rationale: O substantivo grego está no masculino plural, mas pode representar os seres humanos em geral. A tradução mantém a forma do original sem decidir que a referência seja exclusivamente masculina, esclarecendo a possibilidade inclusiva em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A ordem da oração foi ajustada para fluência sem eliminar o plural “multidões”, o sentido forte de temor nem a formulação teologicamente tensa “aos homens”.
