id: MAT.9.25
reference: Matthew 9:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: pt
  text: Mas, depois que a multidão foi posta para fora, ele entrou, tomou a menina pela mão, e ela se levantou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ela foi levantada”. O verbo grego pode ser entendido de ambas as maneiras.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Mas, depois que
  rationale: ὅτε introduz a relação temporal, e δέ marca uma transição narrativa leve. Em português, “Mas, depois que” expressa com naturalidade que a ação seguinte ocorreu após a retirada da multidão.
- source_word: ἐξεβλήθη
  choice: foi posta para fora
  rationale: O aoristo passivo de ἐκβάλλω indica que a multidão foi retirada do local. A formulação preserva a voz passiva sem sugerir necessariamente violência ou evocar linguagem de exorcismo.
- source_word: ὁ ὄχλος
  choice: a multidão
  rationale: ὄχλος designa aqui o grupo de pessoas reunidas; “a multidão” é claro e corrente.
- source_word: εἰσελθὼν
  choice: ele entrou
  rationale: O particípio aoristo indica uma ação anterior ou sequencial à ação principal. A oração coordenada é mais natural em português do que uma reprodução rígida do particípio.
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: tomou a menina pela mão
  rationale: κρατέω com genitivo significa segurar ou tomar. A repetição de “a menina” evita a sequência potencialmente ambígua de pronomes e corresponde ao referente feminino de αὐτῆς.
- source_word: ἠγέρθη
  choice: ela se levantou
  rationale: Embora a forma grega seja passiva, ἐγείρω no aoristo passivo pode ter sentido intransitivo, “levantar-se”. A tradução é natural e preserva em nota a possibilidade de entender “foi levantada”.
- source_word: τὸ κοράσιον
  choice: a menina
  rationale: κοράσιον designa uma menina ou jovem; “a menina” é moderno, preciso e suficiente no contexto.
theological_decisions:
- issue: Sentido e voz de ἠγέρθη no contexto de restauração à vida
  choice: ela se levantou
  alternative: ela foi levantada
  rationale: A forma passiva admite uma tradução passiva explícita, que pode sugerir ação externa, mas também funciona idiomaticamente com sentido intransitivo. O texto principal usa o português mais natural, enquanto a nota conserva a ambiguidade de voz e agência sem resolver indevidamente sua dimensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem narrativa foi mantida, e a repetição de “a menina” torna explícito o referente antes da oração final. O marcador [a] aparece após a expressão à qual a alternativa se refere.
