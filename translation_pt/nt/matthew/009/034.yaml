  text: οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: pt
  text: 'Mas os fariseus diziam: “É pelo chefe dos demônios que ele expulsa os demônios.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste entre a reação positiva anterior e a interpretação hostil dos fariseus.
- source_word: οἱ Φαρισαῖοι
  choice: os fariseus
  rationale: Forma corrente em português para o nome do grupo judaico, preservando o artigo grego.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito grego sugere fala em curso ou repetida; o imperfeito português conserva naturalmente esse aspecto.
- source_word: Ἐν τῷ ἄρχοντι
  choice: É pelo chefe
  rationale: ἐν com dativo tem aqui sentido instrumental; a construção enfática em português expressa que, segundo a acusação, o chefe dos demônios seria a fonte do poder de Jesus.
- source_word: ἄρχοντι
  choice: chefe
  rationale: Comunica autoridade sobre os demônios em linguagem atual e natural, sem a possível conotação nobiliárquica de “príncipe”.
- source_word: τῶν δαιμονίων
  choice: dos demônios
  rationale: Preserva o genitivo e identifica aquele que exerce autoridade sobre os seres demoníacos.
- source_word: ἐκβάλλει
  choice: expulsa
  rationale: Equivalente claro e corrente de ἐκβάλλω no contexto de exorcismo.
- source_word: τὰ δαιμόνια
  choice: os demônios
  rationale: Traduz diretamente o substantivo grego e preserva seu conteúdo sobrenatural específico.
theological_decisions:
- issue: Tradução de δαιμόνια no contexto de exorcismo
  choice: demônios
  alternative: espíritos maus
  rationale: O texto usa especificamente δαιμόνια, não πνεύματα; “demônios” é o equivalente lexical mais preciso e não atenua a alegação sobrenatural.
- issue: Fonte alegada do poder de Jesus
  choice: pelo chefe dos demônios
  alternative: em união com o chefe dos demônios
  rationale: O uso instrumental de ἐν indica meio ou agência. A tradução preserva a acusação dos fariseus sem endossá-la nem explicá-la além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Chefe” é mais natural no uso atual do que “príncipe”, e “expulsa” é a formulação corrente no contexto. Nenhuma nota é necessária, pois não há variante textual ou ambiguidade lexical que exija registro editorial neste versículo.
