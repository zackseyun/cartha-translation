source:
  edition: SBLGNT
  text: τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: pt
  text: 'Então ele diz[a] aos seus discípulos: “A colheita é grande[b], mas os trabalhadores são poucos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego emprega um presente histórico: “ele diz”. Algumas traduções vertem “ele disse”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “A colheita é abundante”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca de modo conciso e natural a sequência narrativa.
- source_word: λέγει
  choice: ele diz
  rationale: Preserva o presente histórico grego e sua vivacidade narrativa; em português, essa forma continua natural.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: aos seus discípulos
  rationale: Mantém o possessivo explícito αὐτοῦ e emprega a tradução corrente de μαθηταῖς.
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: '... mas ...'
  rationale: A construção μέν...δέ estabelece contraste. Em português, “mas” comunica esse contraste naturalmente, sem a rigidez de “por um lado... por outro”.
- source_word: θερισμός
  choice: colheita
  rationale: Preserva a metáfora agrícola e é a equivalência consagrada e clara no contexto.
- source_word: πολύς
  choice: grande
  rationale: Com “colheita”, expressa naturalmente grande quantidade ou abundância; “abundante” também é possível.
- source_word: ἐργάται
  choice: trabalhadores
  rationale: Termo moderno, claro e abrangente para os que trabalham na colheita.
- source_word: ὀλίγοι
  choice: poucos
  rationale: Equivalente direto que mantém o contraste quantitativo com a grande colheita, sem acrescentar a ideia interpretativa de “poucos demais”.
theological_decisions:
- issue: Força metafórica da declaração sobre a colheita
  choice: Manter a metáfora agrícola sem explicitar no texto traduzido aquilo a que ela se refere.
  alternative: Parafrasear a colheita como pessoas prontas para receber a mensagem ou o ministério de Jesus.
  rationale: O versículo apresenta a imagem sem explicar diretamente seu referente. Preservá-la evita inserir uma interpretação no texto e mantém a tensão e o desenvolvimento do contexto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O presente histórico foi mantido. A ordem e a concisão do dito foram preservadas, e os marcadores de nota foram posicionados junto aos termos a que efetivamente se referem.
