source:
  edition: SBLGNT
  text: ⸀ἔλεγεν· Ἀναχωρεῖτε, οὐ γὰρ ἀπέθανεν τὸ κοράσιον ἀλλὰ καθεύδει· καὶ κατεγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: pt
  text: 'Ele dizia: “Retirem-se, pois a menina não morreu, mas está dormindo”. E riam dele.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “zombavam dele”. O verbo grego descreve rir de alguém em tom de deboche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ele dizia
  rationale: O imperfeito indica fala em andamento ou repetida na cena; “dizia” preserva esse aspecto de modo natural em português.
- source_word: Ἀναχωρεῖτε
  choice: Retirem-se
  rationale: O imperativo plural ordena aos presentes que se afastem; “retirem-se” é claro, digno e mantém a força da ordem.
- source_word: οὐ γὰρ
  choice: pois ... não
  rationale: γάρ apresenta a razão da ordem anterior; “pois” reproduz essa relação de maneira concisa.
- source_word: ἀπέθανεν
  choice: não morreu
  rationale: O aoristo apresenta a morte como acontecimento; o pretérito perfeito é a forma mais direta e natural em português.
- source_word: τὸ κοράσιον
  choice: a menina
  rationale: κοράσιον designa uma menina ou jovem; “a menina” é natural e não acrescenta uma ênfase diminutiva desnecessária.
- source_word: ἀλλὰ καθεύδει
  choice: mas está dormindo
  rationale: O presente descreve a ação ou condição atual e mantém literalmente o contraste provocador formulado por Jesus.
- source_word: κατεγέλων αὐτοῦ
  choice: riam dele
  rationale: O verbo descreve riso dirigido contra alguém, normalmente com sentido de zombaria; o imperfeito “riam” preserva o aspecto contínuo e a imagem lexical.
theological_decisions:
- issue: A declaração de que a menina “não morreu, mas está dormindo”
  choice: Manter no texto principal a linguagem literal “está dormindo”, sem explicação interpretativa.
  alternative: Acrescentar “apenas” ou explicar que dormir é uma metáfora para a morte.
  rationale: A formulação grega preserva uma tensão narrativa e teológica deliberada. A tradução não deve decidir se a fala é metafórica, antecipatória ou deve ser entendida de outra forma.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Retirem-se” conserva a força do imperativo sem soar excessivamente coloquial; “riam dele” mantém a imagem do original, enquanto a nota explicita o sentido de zombaria.
