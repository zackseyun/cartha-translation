  yaml_path: translation/nt/matthew/009/026.yaml
  text: And this report went out into all that region[a].
translation:
  language: pt
  text: E essa notícia se espalhou por toda aquela região[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «por toda aquela terra» ou «por todo aquele território». A palavra grega γῆ pode designar terra, território ou região; aqui, provavelmente se refere à área ao redor, não à terra inteira.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a ligação narrativa simples e direta do grego.
- source_word: ἐξῆλθεν
  choice: se espalhou
  rationale: Embora o sentido literal seja «saiu», em português «a notícia se espalhou» expressa de modo natural a imagem de uma informação que parte de um lugar e passa a circular.
- source_word: ἡ φήμη αὕτη
  choice: essa notícia
  rationale: φήμη indica uma notícia ou relato em circulação, sem necessariamente sugerir falta de veracidade; «essa» retoma naturalmente o acontecimento acabado de narrar.
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: por toda aquela região
  rationale: γῆ pode significar terra, território ou região. O contexto local favorece «região», e «por toda» comunica a extensão total de maneira idiomática.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação idiomática evita que «rumor» sugira falsidade e preserva na nota a amplitude semântica de γῆ.
