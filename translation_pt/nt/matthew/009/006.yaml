id: MAT.9.6
reference: Matthew 9:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: pt
  text: 'Mas, para que vocês saibam que o Filho do Homem[a] tem autoridade na terra para perdoar pecados — então diz ao paralítico: “Levante-se, pegue a sua cama[b] e vá para casa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Ser Humano”. Mantém-se a tradução tradicional “Filho do Homem” porque ela preserva o título usado por Jesus e sua provável ressonância com Daniel 7.
    reason: lexical_alternative
  - marker: b
    text: Ou “esteira” ou “leito”. O grego κλίνη pode designar uma cama, um leito ou uma esteira para dormir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: Mas, para que vocês saibam
  rationale: Preserva a transição contrastiva de δέ e a finalidade expressa por ἵνα, em português natural.
- source_word: ἐξουσίαν ἔχει
  choice: tem autoridade
  rationale: ἐξουσία indica autoridade ou direito legítimo, e não apenas capacidade ou poder.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a autodesignação tradicional de Jesus e sua provável ressonância com Daniel 7.
- source_word: ἐπὶ τῆς γῆς
  choice: na terra
  rationale: Expressa de modo direto a esfera terrestre indicada pela construção grega.
- source_word: ἀφιέναι ἁμαρτίας
  choice: para perdoar pecados
  rationale: No contexto, ἀφίημι significa perdoar ou remitir; esta é a formulação portuguesa mais clara e estabelecida.
- source_word: τότε λέγει
  choice: então diz
  rationale: Conserva o presente histórico grego e sua vivacidade narrativa.
- source_word: τῷ παραλυτικῷ
  choice: ao paralítico
  rationale: Reproduz de forma concisa o adjetivo substantivado, sem acrescentar um substantivo ausente no grego.
- source_word: Ἐγερθεὶς
  choice: Levante-se
  rationale: Embora formalmente seja um particípio aoristo, funciona no encadeamento como ordem; a forma imperativa é natural em português.
- source_word: ἆρόν
  choice: pegue
  rationale: No contexto, αἴρω significa levantar e levar consigo; “pegue” é claro e combina naturalmente com “cama”.
- source_word: κλίνην
  choice: cama
  rationale: κλίνη pode designar cama, leito ou esteira; “cama” é a opção ampla e natural, mantendo a alternativa em nota.
- source_word: ὕπαγε εἰς τὸν οἶκόν σου
  choice: vá para casa
  rationale: Traduz idiomaticamente a ordem e o destino; em português, “para casa” comunica naturalmente o sentido de οἶκόν σου.
theological_decisions:
- issue: Título cristológico ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  alternative: o Ser Humano
  rationale: A tradução tradicional preserva o caráter titular da expressão, sua ambiguidade e sua provável ligação intertextual com Daniel 7.
- issue: Natureza de ἐξουσία no perdão dos pecados
  choice: autoridade
  alternative: poder
  rationale: O texto salienta a autoridade legítima para perdoar, e não meramente a capacidade de realizar o ato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural implícito em εἰδῆτε, preserva o presente histórico em “diz” e usa “vá para casa” como expressão idiomática sem perder o sentido do original.
