id: MAT.9.2
reference: Matthew 9:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: pt
  text: 'E eis que estavam trazendo-lhe um paralítico deitado numa cama. Ao ver a fé deles[a], Jesus disse ao paralítico: “Coragem[b], filho! Seus pecados estão perdoados[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O plural “deles” pode incluir o paralítico e os que o trouxeram, ou referir-se aos que o trouxeram como grupo.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “Tenha ânimo”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “foram perdoados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Preserva a função vívida do marcador discursivo, que chama a atenção para a nova cena, sem recorrer ao mais coloquial “olhem”.
- source_word: προσέφερον
  choice: trouxeram
  rationale: Neste contexto narrativo, o pretérito perfeito expressa com naturalidade em português a ação apresentada pelo imperfeito grego; “estavam trazendo” destacaria a progressão da ação mais do que o contexto exige.
- source_word: παραλυτικὸν
  choice: um paralítico
  rationale: Reproduz de modo conciso o adjetivo grego empregado como substantivo e é uma designação clara no português corrente.
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: deitado numa cama
  rationale: Expressa naturalmente a posição da pessoa. “Cama” é lexicalmente mais segura para κλίνη do que “esteira”, embora o objeto possa ter sido portátil.
- source_word: πίστιν
  choice: fé
  rationale: É a correspondência portuguesa usual para πίστις e, no contexto, inclui a confiança demonstrada pela ação do grupo.
- source_word: Θάρσει
  choice: Coragem
  rationale: Forma idiomática e direta de encorajamento em português, preservando a força do imperativo de tranquilização.
- source_word: τέκνον
  choice: filho
  rationale: Como forma afetuosa de tratamento dirigida ao paralítico, “filho” é natural em português e comunica a ternura de τέκνον sem acrescentar o possessivo “meu”.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Seus pecados estão perdoados
  rationale: A construção passiva no presente preserva a declaração direta de perdão e mantém não expresso o agente da ação, como no grego.
- source_word: ἁμαρτίαι
  choice: pecados
  rationale: Mantém o sentido concreto e plural das transgressões, sem paráfrase desnecessária.
theological_decisions:
- issue: Alcance de τὴν πίστιν αὐτῶν
  choice: “a fé deles”, sem identificar precisamente todos os incluídos no pronome plural
  alternative: Restringir a fé aos que carregavam o paralítico, ou atribuí-la apenas ao paralítico
  rationale: O plural grego se refere naturalmente ao grupo associado ao paralítico e inclui pelo menos os que o trouxeram, mas o texto não esclarece se o próprio paralítico está incluído. A tradução conserva essa abertura.
- issue: Força da declaração de perdão
  choice: 'Declaração passiva: “Seus pecados estão perdoados”'
  alternative: Explicitar Deus como agente ou formular a frase como ação performativa de Jesus
  rationale: O grego anuncia o perdão com o agente não expresso. A formulação passiva preserva tanto a declaração quanto a tensão narrativa acerca da autoridade de Jesus, sem inserir uma explicação teológica no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “E eis que” conserva deliberadamente o relevo narrativo de ἰδοὺ; o restante da frase usa sintaxe corrente. A pontuação da fala torna natural a forma afetuosa de tratamento sem alterar o conteúdo.
