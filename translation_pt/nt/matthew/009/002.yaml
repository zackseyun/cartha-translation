  to: 'E eis que estavam trazendo-lhe um paralítico deitado numa cama. Ao ver a fé deles[a], Jesus disse ao paralítico: “Coragem[b], filho! Seus pecados estão perdoados[c].”'
  rationale: A única revisão necessária é “trouxeram” para “estavam trazendo”, a fim de refletir de forma mais precisa o imperfeito προσέφερον. A colocação pronominal “trazendo-lhe” é natural no registro narrativo e mantém claro que o paralítico era levado a Jesus. As notas mantêm os respectivos marcadores e preservam a ambiguidade do plural αὐτῶν e a alternativa aspectual para a declaração de perdão.
