  naturalness: O registro é claro, moderno e apropriado. “E eis que” reproduz com dignidade o relevo narrativo de ἰδού; “Coragem, filho!” é uma fala natural e afetuosa em português. “Estavam trazendo” é idiomático e evita neutralizar o aspecto verbal grego.
  terminology: “Paralítico”, “fé”, “pecados” e “perdoados” são escolhas estáveis e compreensíveis. “Filho” é aceitável como tratamento afetuoso neste contexto, pois o particípio/adjetivo substantivado παραλυτικόν é masculino, sem exigir que se acrescente um possessivo ou outra explicação. A voz passiva de “estão perdoados” preserva corretamente o agente não expresso.
