id: MAT.7.17
reference: Matthew 7:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως πᾶν δένδρον ἀγαθὸν καρποὺς καλοὺς ποιεῖ, τὸ δὲ σαπρὸν δένδρον καρποὺς πονηροὺς ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: pt
  text: Assim, toda árvore boa produz frutos bons, mas a árvore podre[a] produz frutos ruins[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estragada”, “deteriorada” ou “corrupta”.
    reason: lexical_alternative
  - marker: b
    text: Ou “frutos maus”. O termo grego também pode ter o sentido de “malignos”, mas “ruins” se encaixa naturalmente na imagem agrícola sem eliminar sua implicação moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Assim
  rationale: Mantém a força conclusiva ou comparativa da expressão grega e soa natural em português moderno.
- source_word: πᾶν δένδρον
  choice: toda árvore
  rationale: 'O singular com πᾶν tem sentido distributivo e proverbial: cada árvore considerada segundo sua espécie ou qualidade.'
- source_word: ἀγαθὸν
  choice: boa
  rationale: Preserva a descrição ampla e simples da qualidade da árvore, sem explicitar além do texto se ela é saudável ou moralmente boa.
- source_word: καρποὺς καλοὺς
  choice: frutos bons
  rationale: καλός pode indicar aquilo que é bom, belo ou excelente; aqui, “bons” é idiomático e se ajusta à avaliação dos frutos.
- source_word: ποιεῖ
  choice: produz
  rationale: Embora ποιέω tenha o sentido básico de fazer, “produzir frutos” é uma expressão natural em português e conserva claramente a relação causal.
- source_word: τὸ δὲ
  choice: mas a
  rationale: δέ introduz o contraste entre as duas árvores, expresso naturalmente por “mas”.
- source_word: σαπρὸν
  choice: podre
  rationale: σαπρός descreve algo deteriorado, apodrecido ou imprestável. “Podre” mantém a imagem concreta e a intensidade do termo.
- source_word: καρποὺς πονηροὺς
  choice: frutos ruins
  rationale: πονηρός pode significar mau, maligno ou ruim. Na metáfora agrícola, “frutos ruins” é natural e ainda permite que o contexto comunique a dimensão moral.
theological_decisions:
- issue: Força agrícola e força moral da metáfora
  choice: Manter a imagem concreta da árvore e dos frutos sem explicar sua aplicação moral dentro do versículo.
  alternative: Traduzir com termos interpretativos, como “árvore corrupta” e “frutos maus”.
  rationale: No contexto, Jesus fala de falsos profetas, mas o versículo apresenta a metáfora sem explicá-la. A tradução conserva essa tensão e deixa a aplicação moral ser determinada pelo contexto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Assim” conserva a ligação com o contexto anterior; “produz frutos” é natural sem recorrer ao mais marcado “dá frutos”. A repetição de “árvore”, “frutos” e “produz” acompanha o paralelismo do grego.
