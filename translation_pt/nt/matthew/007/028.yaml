  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: pt
  text: E aconteceu que, quando Jesus terminou estas palavras[a], as multidões ficavam maravilhadas com o seu ensino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estes ensinamentos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: E aconteceu que, quando
  rationale: Preserva a fórmula narrativa e a construção temporal do grego em português natural, sem recorrer ao arcaico «e sucedeu que» nem reduzir tudo simplesmente a «quando».
- source_word: ἐτέλεσεν
  choice: terminou
  rationale: Expressa de modo corrente e preciso que Jesus levou o discurso à conclusão; o pretérito perfeito é natural depois de «quando».
- source_word: τοὺς λόγους τούτους
  choice: estas palavras
  rationale: Mantém o demonstrativo e a amplitude semântica de λόγους, com nota para a alternativa contextual «estes ensinamentos».
- source_word: ἐξεπλήσσοντο
  choice: ficaram maravilhadas
  rationale: Comunica a forte reação coletiva indicada pelo verbo; a construção portuguesa é clara e digna, embora o imperfeito grego apresente essa reação em desenvolvimento.
- source_word: οἱ ὄχλοι
  choice: as multidões
  rationale: Conserva o plural do texto grego e evita reduzi-lo ao singular «a multidão».
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: com o seu ensino
  rationale: Em português, «maravilhar-se com» expressa naturalmente o motivo ou objeto da reação, preservando a relação indicada por ἐπί com dativo.
theological_decisions:
- issue: Referência ao discurso de Jesus
  choice: «estas palavras» remete ao ensino imediatamente anterior sem lhe dar um título interpretativo.
  alternative: «estes ensinamentos» ou «este sermão»
  rationale: «Estas palavras» reproduz diretamente o grego; «estes ensinamentos» é possível, mas mais interpretativo, e «este sermão» introduziria uma designação ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A locução «o seu ensino» evita ambiguidade relevante no contexto, pois o referente é Jesus.
