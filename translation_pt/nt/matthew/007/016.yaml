  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: pt
  text: Vocês os reconhecerão pelos seus frutos.[a] Por acaso se colhem uvas de espinheiros ou figos de plantas espinhosas?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês os conhecerão pelos seus frutos”.'
    reason: lexical_alternative
  - marker: b
    text: 'A pergunta espera uma resposta negativa: não se colhem uvas de espinheiros nem figos de plantas espinhosas.'
    reason: rhetorical_clarification
lexical_decisions:
- source_word: καρπῶν
  choice: frutos
  rationale: Mantém o plural explícito e a metáfora agrícola, sem reduzi-la interpretativamente a ações ou resultados.
- source_word: ἐπιγνώσεσθε
  choice: reconhecerão
  rationale: Expressa a identificação feita com base em evidências observáveis; é natural em português e não exagera o sentido como conhecer plenamente.
- source_word: μήτι
  choice: Por acaso
  rationale: Introduz com naturalidade uma pergunta retórica que espera resposta negativa.
- source_word: συλλέγουσιν
  choice: se colhem
  rationale: É a forma idiomática em português para a obtenção de uvas e figos e preserva a imagem agrícola.
- source_word: ἀκανθῶν
  choice: espinheiros
  rationale: Representa plantas ou arbustos espinhosos, em contraste com a videira que produz uvas.
- source_word: σταφυλάς
  choice: uvas
  rationale: Equivalente direto e corrente do substantivo grego no plural.
- source_word: τριβόλων
  choice: plantas espinhosas
  rationale: O termo designa uma planta daninha provida de espinhos; a expressão ampla evita identificar com certeza uma espécie botânica específica.
- source_word: σῦκα
  choice: figos
  rationale: Equivalente direto e corrente do substantivo grego no plural.
- source_word: αὐτῶν / αὐτούς
  choice: seus / os
  rationale: Preserva a referência pessoal aos indivíduos mencionados no contexto, mantendo a ligação entre os frutos deles e o reconhecimento deles.
theological_decisions:
- issue: Força metafórica de “frutos” no discernimento de pessoas
  choice: Conservar a metáfora “frutos”.
  alternative: Explicitar como “ações” ou “resultados”.
  rationale: A imagem agrícola é central ao argumento e permite que o contexto determine o alcance dos frutos, sem impor uma interpretação mais estreita.
- issue: Identificação botânica de τρίβολοι
  choice: Usar o termo geral “plantas espinhosas”.
  alternative: Traduzir por “abrolhos” ou “cardos”.
  rationale: A identificação exata da planta é incerta; a formulação geral conserva o contraste entre uma planta espinhosa e uma figueira sem criar precisão indevida.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural de segunda pessoa. A construção impessoal “se colhem” é amplamente natural e evita introduzir um sujeito ausente do grego. O paralelismo e a metáfora agrícola foram preservados.
