  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: pt
  text: Ou que homem entre vocês[a], se seu filho lhe pedir pão, por acaso lhe dará uma pedra?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em formulação inclusiva: “que pessoa entre vocês”; o grego usa “homem” em sentido representativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ou
  rationale: Introduz a comparação retórica seguinte e mantém o fluxo do argumento.
- source_word: τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος
  choice: que homem entre vocês
  rationale: Reproduz de modo natural a construção partitiva e conserva o substantivo masculino singular empregado representativamente no grego.
- source_word: ὃν αἰτήσει ὁ υἱὸς αὐτοῦ
  choice: se seu filho lhe pedir
  rationale: Reestrutura a oração relativa segundo o idioma português. O futuro grego em uma situação hipotética é expresso naturalmente pelo futuro do subjuntivo, “pedir”.
- source_word: ἄρτον
  choice: pão
  rationale: É o equivalente direto e adequado ao contexto; “alimento” seria amplo demais e “um pão” poderia sugerir especificidade desnecessária.
- source_word: μὴ λίθον ἐπιδώσει αὐτῷ
  choice: por acaso lhe dará uma pedra?
  rationale: “Por acaso” sinaliza em português que a pergunta retórica espera resposta negativa, sem inserir uma negação explícita ausente da proposição lexical.
theological_decisions:
- issue: Linguagem masculina representativa
  choice: que homem entre vocês
  alternative: que pessoa entre vocês
  rationale: O texto grego emprega ἄνθρωπος no singular masculino em sentido representativo. A tradução conserva essa forma no texto e registra em nota uma alternativa inclusiva natural em português.
translation_notes:
  register: Português moderno, digno e de leitura ampla. “Por acaso” preserva a expectativa negativa da pergunta retórica; “se seu filho lhe pedir” soa natural e mantém a estrutura hipotética futura.
