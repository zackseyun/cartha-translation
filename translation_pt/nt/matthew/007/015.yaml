source:
  edition: SBLGNT
  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: pt
  text: Tenham cuidado com os falsos profetas[a], que vêm até vocês em vestes de ovelhas[b], mas por dentro são lobos vorazes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Fiquem atentos aos falsos profetas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “em vestes de ovelhas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Tenham cuidado com
  rationale: O imperativo presente plural pede vigilância contínua, e a construção com ἀπό indica aquilo contra o qual se deve estar alerta. A expressão é natural e mantém a força da advertência.
- source_word: ψευδοπροφητῶν
  choice: falsos profetas
  rationale: Equivalente corrente e preciso para os que se apresentam como profetas, mas são falsos ou falam falsamente.
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: que vêm até vocês
  rationale: Reproduz com naturalidade a aproximação descrita no presente e preserva a referência plural explícita aos ouvintes.
- source_word: ἐν ἐνδύμασι προβάτων
  choice: vestidos como ovelhas
  rationale: Expressa de modo claro e idiomático a aparência externa enganosa, sem sugerir que sejam literalmente roupas usadas por ovelhas.
- source_word: ἔσωθεν δέ εἰσιν
  choice: mas por dentro são
  rationale: Mantém o contraste enfático entre aparência exterior e realidade interior.
- source_word: λύκοι ἅρπαγες
  choice: lobos vorazes
  rationale: ἅρπαγες caracteriza agentes predatórios que agarram e espoliam; 'vorazes' conserva a imagem forte e é a combinação mais natural em português.
theological_decisions:
- issue: Natureza da advertência contra líderes religiosos enganadores
  choice: Manter a imagem como advertência moral e espiritual geral contra falsos profetas.
  alternative: Restringir a referência a mestres heréticos segundo categorias doutrinárias ou eclesiásticas posteriores.
  rationale: O grego contrasta a aparência inofensiva com a realidade predatória, sem especificar uma instituição, denominação ou controvérsia posterior.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. 'Vocês' torna explícito o plural de ὑμᾶς; 'tenham cuidado' comunica uma vigilância contínua sem tom arcaico.
