source:
  edition: SBLGNT
  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: pt
  text: Não deem o que é santo aos cães[a] nem lancem suas pérolas diante dos porcos[b], para que não as pisoteiem e, voltando-se, despedacem vocês[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que é sagrado”. A expressão grega é ampla e não identifica especificamente aquilo que é santo.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradicionalmente: “nem atirem suas pérolas aos porcos”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “dilacerem vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: o que é santo
  rationale: O adjetivo neutro singular substantivado tem referência ampla. “O que é santo” é natural em português e não especifica indevidamente se se trata de ensino sagrado, objeto consagrado ou outra realidade santa.
- source_word: τοῖς κυσίν
  choice: aos cães
  rationale: Mantém de forma direta a metáfora forte e culturalmente ofensiva do grego, sem suavizá-la nem interpretá-la.
- source_word: βάλητε
  choice: lancem
  rationale: “Lancem” exprime naturalmente βάλλω neste contexto e preserva o tom proverbial e digno da frase.
- source_word: τοὺς μαργαρίτας ὑμῶν
  choice: suas pérolas
  rationale: Reproduz o sentido lexical comum, o plural e o pronome possessivo.
- source_word: ἔμπροσθεν τῶν χοίρων
  choice: diante dos porcos
  rationale: Tradução clara e atual que conserva tanto a relação espacial quanto a metáfora original.
- source_word: μήποτε
  choice: para que ... não
  rationale: Expressa em português corrente a advertência de finalidade ou resultado negativo, sem tornar rígida a relação lógica.
- source_word: καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν
  choice: eles não as pisoteiem
  rationale: “Pisotear” já incorpora a ação feita com os pés; repetir “com os pés” produziria redundância desnecessária em português. O pronome feminino retoma naturalmente “pérolas”.
- source_word: στραφέντες
  choice: voltando-se
  rationale: 'Conserva a ação circunstancial do particípio aoristo e a sequência da imagem: depois de pisotear as pérolas, os porcos se voltam contra as pessoas.'
- source_word: ῥήξωσιν ὑμᾶς
  choice: despedacem vocês
  rationale: Comunica a violência de rasgar ou dilacerar sem enfraquecer o verbo para o sentido genérico de “atacar”. “Vocês” deixa claro o plural de ὑμᾶς e é amplamente compreensível.
theological_decisions:
- issue: Sentido das metáforas “o que é santo”, “cães”, “pérolas” e “porcos”
  choice: Manter as metáforas sem explicação interpretativa no texto.
  alternative: Identificar explicitamente “o que é santo” e as “pérolas” com o ensino sagrado ou a mensagem do Reino, e os “cães” e “porcos” com pessoas perversas ou hostis.
  rationale: O versículo não define com precisão os referentes das imagens. Mantê-las intactas preserva sua amplitude e tensão teológica, sem impor uma interpretação denominacional ou excessivamente estreita.
- issue: Relação expressa por μήποτε
  choice: 'Traduzir como advertência negativa: “para que eles não...”.'
  alternative: Usar “caso contrário” ou “para não acontecer que”.
  rationale: A formulação escolhida preserva a possibilidade de finalidade ou resultado temido e funciona naturalmente no contexto, sem resolver além do necessário a nuance sintática.
translation_notes:
  register: Português moderno, digno e de compreensão ampla, com legibilidade brasileira. O imperativo plural foi vertido por “não deem” e “nem lancem”, evitando formas regionais de segunda pessoa. As metáforas foram conservadas sem expansão explicativa. “Despedacem vocês” explicita naturalmente o objeto plural e mantém a violência da imagem.
