id: MAT.7.8
reference: Matthew 7:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: pt
  text: Pois todo aquele que pede recebe, quem busca encontra, e a quem bate será aberto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego não declara explicitamente o que será aberto; a imagem sugere uma porta.
    reason: A tradução preserva o sujeito não especificado do verbo grego, em vez de acrescentar “a porta” ao texto principal.
lexical_decisions:
- source_word: πᾶς
  choice: todo aquele
  rationale: Usado substantivamente com o particípio, expressa uma classe geral e mantém o alcance universal da afirmação em português natural.
- source_word: γὰρ
  choice: Pois
  rationale: Preserva a função explicativa que liga esta afirmação à exortação anterior.
- source_word: ὁ αἰτῶν
  choice: aquele que pede
  rationale: Reproduz de modo claro a construção substantiva e seu sentido geral ou habitual.
- source_word: λαμβάνει
  choice: recebe
  rationale: É o equivalente comum neste contexto e mantém o paralelismo, sem o tom coloquial de alternativas como “consegue”.
- source_word: ὁ ζητῶν
  choice: quem busca
  rationale: Expressão natural e concisa que preserva a ação geral do particípio presente.
- source_word: εὑρίσκει
  choice: encontra
  rationale: Mantém a correspondência direta e memorável entre buscar e encontrar.
- source_word: τῷ κρούοντι
  choice: a quem bate
  rationale: Preserva o dativo de referência ou benefício e prepara a construção passiva seguinte sem acrescentar um objeto não expresso.
- source_word: ἀνοιγήσεται
  choice: será aberto
  rationale: Conserva o futuro passivo e deixa sem especificação aquilo que será aberto, como no grego.
theological_decisions:
- issue: Alcance e força da promessa
  choice: Manter a garantia geral em termos universais, sem qualificações inseridas na tradução.
  alternative: Entender a frase como garantia absoluta de que todo pedido específico será atendido exatamente como formulado, ou restringi-la explicitamente a certos pedidos espirituais.
  rationale: O texto emprega linguagem universal, mas não define aqui todas as condições ou implicações da promessa. A tradução mantém essa amplitude e a tensão interpretativa sem impor uma limitação nem uma absolutização.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo simples do dito foi preservado, e a omissão do sujeito em “será aberto” reproduz deliberadamente a formulação grega.
