id: MAT.7.25
reference: Matthew 7:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἔπεσεν, τεθεμελίωτο γὰρ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: pt
  text: E a chuva caiu, e vieram os rios[a], e os ventos sopraram e bateram contra aquela casa; ela, porém, não caiu, pois havia sido alicerçada sobre a rocha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as enchentes”; em sentido mais literal, o grego diz “os rios”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: a chuva caiu
  rationale: Em português, “a chuva caiu” expressa com naturalidade o movimento descendente de καταβαίνω sem enfraquecer a imagem.
- source_word: οἱ ποταμοί
  choice: os rios
  rationale: Mantém o sentido lexical mais direto de ποταμοί. A alternativa contextual “enchentes” é registrada em nota, sem substituir silenciosamente a imagem grega.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: os ventos sopraram
  rationale: Tradução direta, corrente e natural de πνέω quando o sujeito são os ventos.
- source_word: προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ
  choice: bateram contra aquela casa
  rationale: No contexto da tempestade, “bateram contra” comunica de modo idiomático o impacto indicado por προσπίπτω, cujo sentido básico é cair ou lançar-se contra.
- source_word: οὐκ ἔπεσεν
  choice: não caiu
  rationale: Preserva a formulação direta do grego e evita tornar explícita a ideia mais forte de desabamento.
- source_word: τεθεμελίωτο
  choice: havia sido alicerçada
  rationale: Reproduz o mais-que-perfeito passivo e conserva a imagem de uma fundação estabelecida anteriormente.
- source_word: ἐπὶ τὴν πέτραν
  choice: sobre a rocha
  rationale: Mantém a imagem concreta e a especificidade de πέτρα, sem acrescentar a noção mais restrita de rocha matriz.
theological_decisions:
- issue: Imagem parabólica do alicerce
  choice: sobre a rocha
  alternative: sobre a rocha firme
  rationale: O versículo apresenta a imagem sem identificar explicitamente a rocha nem acrescentar um qualificativo. A tradução preserva essa abertura e evita inserir uma interpretação teológica no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “e” foi mantida para refletir o encadeamento enfático do grego. O pronome “ela” esclarece naturalmente que a casa não caiu.
