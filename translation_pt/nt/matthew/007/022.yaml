source:
  edition: SBLGNT
  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: pt
  text: 'Muitos me dirão naquele dia: “Senhor, Senhor, não profetizamos em teu nome, expulsamos demônios em teu nome e fizemos muitos feitos poderosos[a] em teu nome?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “muitos milagres” ou “muitas obras de poder”. A expressão grega diz literalmente “muitos poderes” e, nos Evangelhos, muitas vezes se refere a feitos milagrosos.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Muitos
  rationale: O adjetivo masculino plural sem artigo é usado substantivamente. “Muitos” é natural em português e não acrescenta um substantivo ausente no grego.
- source_word: ἐροῦσίν μοι
  choice: me dirão
  rationale: O futuro de λέγω com o pronome no dativo é expresso de modo direto e idiomático por “me dirão”.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: naquele dia
  rationale: É a expressão temporal corrente em português e conserva a força escatológica sem explicitar “dia do juízo”, que não aparece no texto grego.
- source_word: Κύριε κύριε
  choice: Senhor, Senhor
  rationale: Mantém a repetição enfática do vocativo e preserva tanto o sentido habitual do título quanto seu peso cristológico.
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: não profetizamos
  rationale: A pergunta negativa espera confirmação. “Profetizamos” é o equivalente direto, reconhecível e não interpretativamente ampliado de προφητεύω.
- source_word: τῷ σῷ ὀνόματι
  choice: em teu nome
  rationale: Expressa de forma consagrada e precisa uma ação realizada sob a autoridade ou mediante a invocação do nome de alguém. A repetição nas três orações é preservada.
- source_word: δαιμόνια ἐξεβάλομεν
  choice: expulsamos demônios
  rationale: ἐκβάλλω com δαιμόνια designa a expulsão de demônios; “expulsamos” é claro e natural no português atual.
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: fizemos muitas obras poderosas
  rationale: δύναμις pode indicar feitos de poder ou milagres. “Obras poderosas” conserva a ligação lexical com poder sem restringir antecipadamente o sentido a “milagres”.
theological_decisions:
- issue: Tradução de κύριος na fala dirigida a Jesus
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” preserva o sentido normal do título e sua possível relevância cristológica sem impor uma explicação doutrinária adicional.
- issue: Força escatológica de ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: naquele dia
  alternative: no dia do juízo
  rationale: O contexto aponta para o juízo final, mas o grego diz apenas “naquele dia”. A formulação bíblica e sua tensão implícita são mantidas.
- issue: Sentido de δυνάμεις πολλὰς
  choice: muitas obras poderosas
  alternative: muitos milagres
  rationale: A escolha mantém a imagem de poder presente em δύναμις e deixa em nota a tradução contextual mais explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se “teu” para manter uma forma direta e reverente sem recorrer ao registro mais arcaico de “vós”. A repetição de “em teu nome” acompanha a ênfase retórica do grego.
