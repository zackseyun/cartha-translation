reference: Matthew 7:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: pt
  text: 'Ou como você dirá ao seu irmão[a]: ‘Deixe-me tirar o cisco do seu olho’, e veja: a trave está no seu próprio olho?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “irmão”; o masculino singular pode representar um companheiro ou condiscípulo.
    reason: cultural_note
  - marker: b
    text: Ou “viga” ou “madeiro” para “trave” (grego δοκός), uma grande peça de madeira.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ πῶς ἐρεῖς
  choice: Ou como você dirá
  rationale: Preserva a alternativa retórica introduzida por ἤ, a pergunta com πῶς e o valor futuro de ἐρεῖς em português natural.
- source_word: τῷ ἀδελφῷ σου
  choice: ao seu irmão
  rationale: Mantém o substantivo masculino singular do texto grego e a relação direta expressa pelo possessivo.
- source_word: Ἄφες ἐκβάλω
  choice: Deixe-me tirar
  rationale: Ἄφες introduz idiomaticamente um pedido de permissão, enquanto ἐκβάλω descreve aqui a retirada de algo do olho.
- source_word: τὸ κάρφος
  choice: o cisco
  rationale: Em português, “cisco” designa naturalmente uma pequena partícula que pode entrar no olho e preserva o contraste hiperbólico com a trave.
- source_word: καὶ ἰδοὺ
  choice: quando
  rationale: No fluxo da pergunta retórica, “quando” transmite naturalmente a circunstância surpreendente para a qual ἰδού chama atenção, sem recorrer ao arcaizante “eis”.
- source_word: ἡ δοκὸς
  choice: a trave
  rationale: “Trave” corresponde a uma grande peça estrutural de madeira e mantém com precisão o exagerado contraste visual.
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: está no seu próprio olho
  rationale: Mantém a localização do grego; “próprio” torna explícito em português o contraste contextual com o olho do irmão.
theological_decisions:
- issue: Referência de ἀδελφῷ
  choice: irmão
  alternative: irmão ou irmã; semelhante; companheiro de fé
  rationale: O grego traz o masculino singular em uma situação hipotética direta. A tradução conserva essa forma sem excluir por explicitação nem ampliar interpretativamente o referente.
- issue: Contraste hiperbólico κάρφος / δοκός
  choice: cisco / trave
  alternative: farpa / viga; argueiro / trave
  rationale: A escolha preserva tanto a enorme desproporção da imagem de Jesus quanto sua clareza para leitores atuais.
- issue: Força discursiva de καὶ ἰδού
  choice: quando
  alternative: e veja; e eis que
  rationale: “Quando” integra a surpresa ao desafio retórico de modo idiomático. A alternativa “e eis que” é mais formal e mais explícita, mas menos corrente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” evita a ambiguidade regional de “tu” e mantém o singular. “Cisco” é corrente no contexto do olho; “trave” conserva a imagem estrutural de δοκός.
