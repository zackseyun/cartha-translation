id: MAT.7.7
reference: Matthew 7:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: pt
  text: Peçam[a], e lhes será dado; busquem, e encontrarão; batam, e a porta lhes será aberta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Os imperativos presentes gregos também podem ser entendidos em sentido contínuo: “Continuem pedindo... continuem buscando... continuem batendo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: Peçam
  rationale: Imperativo presente ativo, segunda pessoa do plural. “Peçam” é natural no português moderno e preserva a força do mandamento sem tornar obrigatória no texto principal a possível nuance contínua do presente grego.
- source_word: δοθήσεται
  choice: será dado
  rationale: Futuro passivo de δίδωμι. A tradução mantém a voz passiva e deixa implícito o agente, como no grego.
- source_word: ὑμῖν
  choice: lhes
  rationale: O pronome dativo plural é expresso de modo natural como “lhes” nas duas construções passivas, com referência aos destinatários do discurso.
- source_word: ζητεῖτε
  choice: busquem
  rationale: Imperativo presente ativo. “Busquem” comunica com clareza tanto a procura literal quanto a figurada e é mais corrente no português moderno do que “procurai”.
- source_word: εὑρήσετε
  choice: encontrarão
  rationale: Futuro ativo, traduzido diretamente e em paralelismo com as demais promessas.
- source_word: κρούετε
  choice: batam
  rationale: Imperativo presente ativo. No contexto de uma porta implícita, “batam” é a expressão idiomática natural em português; a nuance potencial de continuidade é registrada em nota.
- source_word: ἀνοιγήσεται
  choice: será aberto
  rationale: Futuro passivo de ἀνοίγω. A formulação conserva a voz passiva do grego, sem converter o verbo em intransitivo.
- source_word: καὶ
  choice: e
  rationale: A conjunção coordenativa é repetida para preservar o ritmo e o paralelismo das três sentenças, sem acrescentar uma ideia temporal ou consecutiva.
theological_decisions:
- issue: Aspecto dos três imperativos no presente
  choice: 'Traduzir por imperativos simples: “Peçam”, “busquem” e “batam”.'
  alternative: 'Explicitar a continuidade: “Continuem pedindo... continuem buscando... continuem batendo”.'
  rationale: O presente imperativo grego admite uma leitura contínua ou reiterada, mas não exige que ela seja explicitada. O texto principal preserva comandos naturais e diretos, enquanto a nota mantém disponível a alternativa aspectual sem transformar uma nuance possível em interpretação obrigatória.
- issue: Agente das formas passivas
  choice: Manter “será dado” e “será aberto”, sem nomear o agente.
  alternative: Explicitar Deus como aquele que dá e abre.
  rationale: Embora o contexto possa sugerir Deus como agente implícito, o grego não o nomeia neste versículo. Preservar as passivas evita resolver de forma explícita o que o texto deixa implícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais de terceira pessoa do plural usadas para o destinatário plural. O paralelismo conciso e a voz passiva do original foram preservados.
