  text: ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/029.yaml
  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: pt
  text: pois ele os ensinava como quem tinha autoridade[a], e não como os escribas deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “com autoridade”.'
    reason: Alternativa lexical que expressa naturalmente o sentido, embora torne menos explícita a construção comparativa pessoal do grego.
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: pois ele os ensinava
  rationale: A construção perifrástica no imperfeito (ἦν + particípio presente) expressa ação contínua no passado. “Pois” preserva o valor explicativo de γάρ e liga o versículo à admiração das multidões no contexto anterior.
- source_word: αὐτούς
  choice: os
  rationale: Pronome objeto que retoma os ouvintes mencionados no contexto; a colocação proclítica é natural no português moderno.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: como quem tem autoridade
  rationale: Reflete de modo natural a comparação pessoal do grego e preserva ἐξουσία como autoridade legítima, sem reduzi-la a mera confiança ou força retórica.
- source_word: καὶ οὐχ ὡς
  choice: e não como
  rationale: Mantém explicitamente o contraste comparativo do texto grego.
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: os escribas deles
  rationale: “Escribas” é o equivalente histórico direto para os especialistas reconhecidos na Lei; “deles” preserva αὐτῶν e sua provável referência às autoridades religiosas dos ouvintes.
theological_decisions:
- issue: Natureza da autoridade de Jesus ao ensinar
  choice: Apresentar descritivamente Jesus “como quem tem autoridade”.
  alternative: Explicitar autoridade divina ou enfraquecer a expressão para simples segurança retórica.
  rationale: O versículo afirma e contrasta a autoridade real de Jesus, mas não especifica aqui todo o fundamento teológico dessa autoridade. A formulação conserva a força e a tensão do texto sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A forma “os escribas deles” é deliberadamente literal para conservar o pronome do texto crítico, ainda que “os seus escribas” também seja possível.
