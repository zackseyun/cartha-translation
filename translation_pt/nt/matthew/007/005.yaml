  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: pt
  text: Hipócrita, tire primeiro a trave do seu próprio olho e então você enxergará claramente para tirar o cisco do olho do seu irmão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκριτά
  choice: Hipócrita
  rationale: Vocativo singular de repreensão direta; preserva de modo natural a força incisiva do grego.
- source_word: ἔκβαλε / ἐκβαλεῖν
  choice: tire / para tirar
  rationale: No contexto da imagem física, «tirar» é corrente e claro; a repetição conserva a correspondência entre o imperativo e o infinitivo.
- source_word: πρῶτον
  choice: primeiro
  rationale: Expressa diretamente a prioridade na sequência.
- source_word: δοκόν
  choice: trave
  rationale: Designa uma grande peça de madeira estrutural e mantém o contraste hiperbólico com o pequeno κάρφος.
- source_word: ὀφθαλμοῦ
  choice: olho
  rationale: Equivalente comum e exato no contexto da metáfora corporal.
- source_word: διαβλέψεις
  choice: você enxergará claramente
  rationale: Preserva a ideia intensificada de ver com clareza expressa pelo verbo composto.
- source_word: κάρφος
  choice: cisco
  rationale: Termo idiomático em português para uma pequena partícula no olho, mantendo o contraste com «trave».
- source_word: ἀδελφοῦ
  choice: do seu irmão
  rationale: Mantém o substantivo masculino singular do texto grego e a relação comunitária indicada no contexto.
theological_decisions:
- issue: Termo relacional masculino ἀδελφοῦ
  choice: do seu irmão
  alternative: de outra pessoa; do seu próximo
  rationale: O grego emprega o masculino singular «irmão». A tradução preserva essa forma sem a neutralizar e sem restringir além do que o contexto permite.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. «Seu próprio olho» explicita naturalmente o contraste reflexivo já presente na oposição entre «seu» e «do seu irmão», sem alterar o sentido. Não foram acrescentadas notas porque «trave» e «cisco» transmitem com clareza a imagem e o contraste lexical.
