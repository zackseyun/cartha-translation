id: MAT.7.2
reference: Matthew 7:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: pt
  text: Pois, com o julgamento com que vocês julgam, vocês serão julgados; e, com a medida com que medem, lhes será medido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lhes será medido de volta”. O grego não traz explicitamente “de volta”, embora o sentido recíproco esteja implícito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματι / κρίνετε / κριθήσεσθε
  choice: julgamento / julgam / serão julgados
  rationale: Preserva a repetição cognata e o sentido amplo de avaliar ou julgar, sem restringi-lo a condenar.
- source_word: μέτρῳ / μετρεῖτε / μετρηθήσεται
  choice: medida / medem / será medido
  rationale: Mantém o paralelismo e o jogo verbal proverbial do grego.
- source_word: μετρηθήσεται ὑμῖν
  choice: será medido a vocês
  rationale: Reproduz o passivo com o dativo e não acrescenta ao texto principal a ideia de 'de volta', embora ela esteja implícita na reciprocidade.
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: com ... com que
  rationale: Expressa instrumento ou padrão em português natural, preservando a estrutura paralela.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com a proibição do versículo anterior.
theological_decisions:
- issue: Agente do julgamento recíproco
  choice: Manter os verbos na voz passiva sem identificar o agente
  alternative: Explicitar que Deus ou outras pessoas executarão o julgamento
  rationale: O grego não declara o agente; a formulação conserva a abertura interpretativa e a tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com plural 'vocês' de ampla legibilidade brasileira. A repetição deliberada de 'julgamento/julgar' e 'medida/medir' preserva a força retórica do original.
