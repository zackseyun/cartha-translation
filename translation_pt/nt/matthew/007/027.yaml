  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ, καὶ ἔπεσεν, καὶ ἦν ἡ πτῶσις αὐτῆς μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/027.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it fell—and its fall was great.
translation:
  language: pt
  text: E a chuva caiu, e os rios vieram[a], e os ventos sopraram e bateram contra aquela casa; ela caiu, e a sua queda foi grande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «vieram as enchentes». O substantivo grego significa mais literalmente «rios», mas, neste contexto, pode evocar águas de inundação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: a chuva caiu
  rationale: Embora κατέβη expresse literalmente movimento para baixo, «a chuva caiu» é a formulação natural em português e preserva adequadamente a imagem.
- source_word: ἦλθον οἱ ποταμοί
  choice: os rios vieram
  rationale: ποταμοί significa normalmente «rios»; mantém-se a expressão concreta do grego, enquanto a nota registra o sentido contextual possível de águas de inundação.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: os ventos sopraram
  rationale: Tradução direta, clara e idiomática de πνέω com ἄνεμοι.
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: se lançaram contra aquela casa
  rationale: No contexto da tempestade, προσκόπτω descreve o choque dos ventos contra a casa. «Se lançaram contra» preserva a força e a direção sem sugerir que os ventos literalmente tropeçaram.
- source_word: ἔπεσεν
  choice: ela caiu
  rationale: Mantém o verbo simples πίπτω e evita a explicitação interpretativa «desabou».
- source_word: ἦν ἡ πτῶσις αὐτῆς μεγάλη
  choice: grande foi a sua queda
  rationale: Preserva o substantivo cognato πτῶσις e dá relevo natural em português à grandeza da queda.
theological_decisions:
- issue: Intensidade da imagem de juízo no encerramento da parábola
  choice: grande foi a sua queda
  alternative: seu desabamento foi catastrófico
  rationale: O texto afirma a magnitude da queda da casa, mas não explicita aqui a aplicação escatológica. A tradução conserva a força da advertência sem acrescentar uma conclusão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência narrativa preservada. A formulação evita arcaísmos excessivos, embora «grande foi a sua queda» mantenha solenidade e ênfase adequadas ao fecho da parábola.
