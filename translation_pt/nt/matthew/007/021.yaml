id: MAT.7.21
reference: Matthew 7:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: pt
  text: 'Nem todo aquele que me diz: “Senhor, Senhor” entrará no Reino dos céus[a], mas aquele que faz a vontade de meu Pai, que está nos céus[b], entrará.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mateus emprega com frequência a expressão “Reino dos céus”, onde outros contextos dizem “Reino de Deus”.
    reason: lexical_alternative
  - marker: b
    text: O grego emprega “céus” no plural, tanto aqui como na expressão “Reino dos céus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: Nem todo aquele que me diz
  rationale: 'Οὐ com πᾶς expressa negação parcial: “nem todo”, e não “ninguém”. A oração relativa traduz naturalmente o particípio presente λέγων, mantendo seu sentido geral.'
- source_word: Κύριε κύριε
  choice: Senhor, Senhor
  rationale: Preserva o título κύριος e a repetição enfática do vocativo.
- source_word: εἰσελεύσεται
  choice: entrará
  rationale: Equivalente natural do futuro de εἰσέρχομαι; a forma grega não exige que se explicite em português qualquer nuance de voz média.
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: no Reino dos céus
  rationale: “Reino dos céus” é a expressão portuguesa consagrada e inteligível para a formulação característica de Mateus. A contração “no” é idiomática com o verbo entrar.
- source_word: ἀλλ’ ὁ ποιῶν
  choice: mas aquele que faz
  rationale: Traduz o particípio presente substantivado, preservando o contraste singular e habitual entre dizer e fazer.
- source_word: τὸ θέλημα
  choice: a vontade
  rationale: Mantém a abrangência teológica e ética de θέλημα sem parafraseá-lo de modo restritivo.
- source_word: τοῦ πατρός μου
  choice: de meu Pai
  rationale: Reproduz diretamente a relação filial expressa por Jesus.
- source_word: τοῦ ἐν τοῖς οὐρανοῖς
  choice: que está nos céus
  rationale: Conserva o plural do grego e liga corretamente a expressão atributiva a “meu Pai”.
theological_decisions:
- issue: Entrada no Reino em relação à confissão verbal e à obediência
  choice: Preservar o contraste entre chamar Jesus de Senhor e fazer a vontade do Pai.
  alternative: Interpretar o versículo como uma exposição completa da salvação por obras ou, no sentido oposto, da suficiência da confissão verbal.
  rationale: O grego afirma claramente o contraste entre dizer e fazer, mas este versículo isolado não formula um sistema completo de justificação ou salvação.
- issue: Verbo elíptico na segunda oração
  choice: Repetir “entrará” no fim da oração.
  alternative: 'Deixar o verbo subentendido: “mas aquele que faz a vontade de meu Pai, que está nos céus”.'
  rationale: O verbo é elíptico no grego, mas sua repetição em português esclarece a contraposição sem acrescentar conteúdo interpretativo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Nem todo aquele” preserva com precisão a negação parcial; “Reino” recebe maiúscula por funcionar como designação teológica. As aspas e os dois-pontos tornam o discurso direto claro.
