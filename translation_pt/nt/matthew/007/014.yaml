source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: pt
  text: Porque estreita é a porta, e apertado o caminho que leva à vida, e poucos são os que o encontram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενή
  choice: estreita
  rationale: Mantém a imagem espacial da porta com correspondência direta e natural em português.
- source_word: τεθλιμμένη
  choice: apertado
  rationale: O particípio de θλίβω descreve algo comprimido ou estreitado; “apertado” preserva essa imagem aplicada ao caminho, sem reduzi-la apenas à ideia abstrata de dificuldade.
- source_word: ἀπάγουσα εἰς τὴν ζωήν
  choice: que leva à vida
  rationale: Expressão idiomática e fiel ao sentido direcional do grego.
- source_word: ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν
  choice: poucos são os que o encontram
  rationale: Conserva a ênfase da construção grega. O pronome retoma “caminho”; a mudança para o masculino decorre do gênero da palavra em português.
theological_decisions:
- issue: Sentido de τεθλιμμένη
  choice: apertado
  alternative: difícil
  rationale: “Apertado” retém a metáfora concreta de constrição presente no verbo grego, embora a imagem também implique dificuldade; evita explicitar apenas uma consequência da metáfora.
translation_notes:
  register: Português moderno, claro e digno, com estrutura levemente solene adequada ao ensino de Jesus. A formulação preserva o paralelismo entre “porta” e “caminho”.
