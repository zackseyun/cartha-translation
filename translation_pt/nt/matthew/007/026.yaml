id: MAT.7.26
reference: Matthew 7:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: pt
  text: E todo aquele que ouve estas minhas palavras e não as pratica será comparado a um homem insensato[a], que construiu a sua casa sobre a areia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma pessoa insensata”. O grego diz literalmente “um homem insensato”, empregando linguagem masculina representativa na comparação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: todo aquele que ouve
  rationale: O particípio presente substantivado tem sentido genérico. A formulação é natural e preserva a abrangência de πᾶς.
- source_word: μου τοὺς λόγους τούτους
  choice: estas minhas palavras
  rationale: Mantém a ênfase demonstrativa e a relação possessiva, em formulação clara e corrente em português.
- source_word: μὴ ποιῶν αὐτούς
  choice: não as pratica
  rationale: Neste contexto, ποιέω indica pôr em prática ou cumprir as palavras ouvidas. A tradução evita o pouco natural 'não as faz' sem ampliar indevidamente o sentido.
- source_word: ὁμοιωθήσεται
  choice: será comparado a
  rationale: Reproduz a forma passiva futura e o sentido explícito de comparação do verbo grego.
- source_word: ἀνδρὶ μωρῷ
  choice: um homem insensato
  rationale: ἀνήρ designa especificamente um homem, usado aqui de modo representativo; 'insensato' expressa μωρός com dignidade e naturalidade, sem a aspereza coloquial de 'estúpido'.
- source_word: ὅστις
  choice: que
  rationale: Introduz naturalmente, em português, a oração relativa explicativa da comparação.
- source_word: ᾠκοδόμησεν
  choice: construiu
  rationale: Expressa diretamente o aoristo de οἰκοδομέω e combina naturalmente com 'casa'.
- source_word: αὐτοῦ τὴν οἰκίαν
  choice: a sua casa
  rationale: οἰκία é a construção física da imagem; 'casa' preserva isso, e o possessivo traduz αὐτοῦ.
- source_word: ἐπὶ τὴν ἄμμον
  choice: sobre a areia
  rationale: Transmite a localização ou base da construção, preservando a imagem da fundação instável.
theological_decisions:
- issue: Linguagem masculina representativa na comparação
  choice: um homem insensato
  alternative: uma pessoa insensata
  rationale: O grego emprega o substantivo masculino específico ἀνήρ. A tradução conserva esse dado textual, enquanto a nota esclarece que o homem funciona como figura representativa na comparação.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. 'Não as pratica' comunica idiomaticamente a obediência às palavras, enquanto 'será comparado a' preserva a voz passiva do original.
