reference: Matthew 7:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: pt
  text: Portanto, todo aquele que ouve estas minhas palavras e as pratica será comparado a um homem prudente, que construiu sua casa sobre a rocha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será semelhante a” ou “será como”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Portanto, todo aquele que
  rationale: Πᾶς com ὅστις tem sentido distributivo e genérico; “todo aquele que” é natural em português. οὖν é inferencial, e “portanto” mantém a ligação lógica com o ensino anterior.
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: ouve estas minhas palavras
  rationale: “Palavras” traduz λόγους com transparência, e “estas minhas” preserva de modo idiomático tanto o demonstrativo quanto o genitivo μου.
- source_word: καὶ ποιεῖ αὐτούς
  choice: e as pratica
  rationale: Neste contexto, ποιεῖ significa fazer o que foi ouvido. “As pratica” comunica esse sentido de modo mais natural em português do que o literal “as faz”, sem acrescentar uma explicação extensa.
- source_word: ὁμοιωθήσεται
  choice: será comparado a
  rationale: O futuro passivo é preservado, bem como o ato explícito de estabelecer uma comparação. A expressão também evita decidir entre a ideia puramente descritiva de “será como” e a forma passiva do grego.
- source_word: ἀνδρὶ φρονίμῳ
  choice: um homem prudente
  rationale: ἀνήρ designa aqui um homem, enquanto φρόνιμος ressalta sensatez prática e bom juízo; “prudente” se ajusta especialmente ao contraste da parábola.
- source_word: ᾠκοδόμησεν
  choice: construiu
  rationale: Equivalente direto e corrente para o ato de edificar a casa.
- source_word: αὐτοῦ τὴν οἰκίαν
  choice: sua casa
  rationale: A expressão portuguesa preserva a posse e a imagem concreta da construção. No contexto imediato, “sua” remete naturalmente ao homem prudente.
- source_word: ἐπὶ τὴν πέτραν
  choice: sobre a rocha
  rationale: “Sobre a rocha” reproduz diretamente a imagem da casa assentada em base rochosa, sem especificar além do grego que se trata de rocha matriz.
theological_decisions:
- issue: Linguagem masculina na figura comparativa
  choice: um homem prudente
  alternative: uma pessoa prudente
  rationale: O substantivo grego ἀνήρ é especificamente masculino na figura, embora a aplicação inicial seja universal (“todo aquele que”). A tradução mantém essa distinção sem restringir o alcance do ensino.
- issue: Relação entre ouvir e obedecer
  choice: ouve estas minhas palavras e as pratica
  alternative: ouve estas minhas palavras e as faz
  rationale: “Pratica” torna claro o valor contextual de ποιεῖ como cumprimento do ensino, sem transformar o versículo numa formulação teológica mais específica do que o original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Todo aquele que” e “sobre a rocha” preservam o tom bíblico sem arcaísmo excessivo; “as pratica” favorece compreensão imediata.
