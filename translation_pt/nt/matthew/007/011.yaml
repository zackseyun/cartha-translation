id: MAT.7.11
reference: Matthew 7:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: pt
  text: Portanto, se vocês, sendo maus, sabem dar boas dádivas aos seus filhos, quanto mais o Pai de vocês, que está nos céus,[a] dará coisas boas[b] aos que lhe pedem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme a forma tradicional, “que está no céu”. O grego emprega o plural: “nos céus”.'
    reason: lexical_alternative
  - marker: b
    text: Algumas traduções trazem “dará boas dádivas”, mas nesta oração o grego diz simplesmente “dará coisas boas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ οὖν ὑμεῖς πονηροὶ ὄντες
  choice: Portanto, se vocês, sendo maus
  rationale: Mantém a estrutura condicional e o valor descritivo/concessivo do particípio, sem suavizar πονηροί nem ampliá-lo para uma formulação doutrinária mais abrangente.
- source_word: οἴδατε ... διδόναι
  choice: sabem dar
  rationale: Em português, a construção com infinitivo expressa naturalmente a capacidade prática indicada pelo grego, sem necessidade de acrescentar “como”.
- source_word: δόματα ἀγαθὰ
  choice: boas dádivas
  rationale: “Dádivas” distingue os presentes dados aos filhos das “coisas boas” da oração seguinte e conserva um registro digno e inteligível.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: aos seus filhos
  rationale: “Filhos” funciona aqui de modo inclusivo para τέκνα e é a formulação portuguesa mais natural.
- source_word: πόσῳ μᾶλλον
  choice: quanto mais
  rationale: É a expressão idiomática portuguesa que preserva o argumento do menor para o maior.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: o Pai de vocês, que está nos céus
  rationale: Conserva Pai como núcleo e traduz explicitamente a qualificação locativa, mantendo o plural de οὐρανοῖς.
- source_word: δώσει ἀγαθὰ
  choice: dará coisas boas
  rationale: ἀγαθά é substantivado nesta oração; “coisas boas” evita inserir “dádivas”, substantivo que o grego não repete.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: aos que lhe pedem
  rationale: Traduz de modo natural o particípio substantivado e mantém seu sentido geral, sem especificar indevidamente o objeto do pedido.
theological_decisions:
- issue: Força antropológica de πονηροὶ ὄντες
  choice: sendo maus
  alternative: embora sejam imperfeitos; embora sejam pecadores
  rationale: A formulação direta preserva a avaliação de Jesus e o contraste com a bondade superior do Pai, sem reduzi-la a mera imperfeição nem expandi-la em uma formulação doutrinária.
- issue: Plural de ὁ ἐν τοῖς οὐρανοῖς
  choice: que está nos céus
  alternative: que está no céu; Pai celestial
  rationale: Mantém o plural da expressão grega e sua forma locativa, em vez de substituí-la por um adjetivo teológico tradicional.
- issue: Diferença entre δόματα ἀγαθὰ e δώσει ἀγαθὰ
  choice: boas dádivas ... dará coisas boas
  alternative: boas dádivas ... dará boas dádivas
  rationale: Preserva a diferença formal do texto, no qual “dádivas” ocorre apenas na primeira oração, sem harmonizar silenciosamente as duas expressões.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vocês” evita uma forma regional marcada; “dádivas” conserva o tom bíblico sem obscurecer o sentido. A ordem retórica e o contraste do original foram mantidos.
