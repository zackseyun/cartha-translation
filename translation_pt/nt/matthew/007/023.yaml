id: MAT.7.23
reference: Matthew 7:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: pt
  text: 'E então lhes declararei: “Nunca conheci vocês[a]. Afastem-se de mim, vocês que praticam a iniquidade[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nunca reconheci vocês”. No grego, “conhecer” pode indicar reconhecimento e relacionamento pessoal, não apenas ciência intelectual.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a transgressão da lei” ou “o que é contrário à lei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: E então
  rationale: Preserva tanto a ligação com o contexto anterior quanto a progressão temporal.
- source_word: ὁμολογήσω
  choice: declararei
  rationale: Neste contexto solene e judicial, o verbo indica uma afirmação aberta e explícita, não a confissão de uma falta.
- source_word: Οὐδέποτε
  choice: Nunca
  rationale: Expressa de modo natural e enfático a negação absoluta do advérbio grego.
- source_word: ἔγνων
  choice: conheci
  rationale: Mantém a linguagem relacional do grego sem reduzi-la a mero conhecimento intelectual nem interpretá-la como aprovação.
- source_word: ἀποχωρεῖτε
  choice: Afastem-se
  rationale: Transmite a ordem de retirada ou expulsão em português atual, preservando o tom solene.
- source_word: ἐργαζόμενοι
  choice: vocês que praticam
  rationale: O particípio descreve atividade característica ou contínua; “praticam” comunica isso de maneira idiomática.
- source_word: ἀνομίαν
  choice: iniquidade
  rationale: Preserva a força moral e legal do termo, que indica conduta contrária à lei ou à ordem de Deus; a nota oferece alternativas mais transparentes.
theological_decisions:
- issue: Sentido de “Nunca conheci vocês”
  choice: Mantida a formulação relacional direta “Nunca conheci vocês”.
  alternative: “Nunca reconheci vocês” ou “Nunca aprovei vocês”.
  rationale: O grego emprega o verbo “conhecer” e deixa implícita sua dimensão relacional e judicial. Uma paráfrase como “nunca foram realmente meus” resolveria uma questão teológica que o texto não explicita.
- issue: Força de ἀνομία
  choice: “iniquidade”
  alternative: “transgressão da lei”, “desobediência à lei” ou “maldade”.
  rationale: “Iniquidade” conserva a categoria moral-legal do original sem restringi-la a uma formulação doutrinária específica; a nota esclarece seu sentido.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Vocês” evita a ambiguidade regional de formas verbais sem pronome; “afastem-se” é atual e digno, sem o tom arcaizante de “apartai-vos”.
