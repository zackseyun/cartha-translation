  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: pt
  text: Mas por que você vê o cisco no olho do seu irmão[a], porém não percebe a trave no seu próprio olho[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lasca”, “palhinha” ou “partícula de palha” para “cisco” (κάρφος).
    reason: lexical_alternative
  - marker: b
    text: Ou “viga” para “trave” (δοκός).
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: por que
  rationale: Nesta construção interrogativa com βλέπεις, τί tem valor idiomático de causa e introduz a pergunta retórica com naturalidade em português.
- source_word: δὲ
  choice: Mas
  rationale: Marca contraste leve com o ensino anterior e também entre a atenção dada ao outro e a falta de percepção de si mesmo.
- source_word: βλέπεις
  choice: vê
  rationale: Preserva a imagem concreta e permite distingui-lo de κατανοεῖς.
- source_word: κάρφος
  choice: cisco
  rationale: Designa uma partícula pequena e seca; “cisco” é corrente em português na imagem de algo no olho e contrasta claramente com “trave”.
- source_word: ἀδελφοῦ
  choice: irmão
  rationale: Mantém o substantivo masculino singular do texto grego sem neutralizá-lo.
- source_word: σῷ
  choice: seu próprio
  rationale: Explicita a ênfase contrastiva do possessivo grego.
- source_word: δοκόν
  choice: trave
  rationale: Refere-se a uma grande peça estrutural de madeira; “trave” preserva tanto o sentido arquitetônico quanto a hipérbole.
- source_word: οὐ κατανοεῖς
  choice: não percebe
  rationale: κατανοέω envolve notar, observar ou reconhecer atentamente; “não percebe” mantém a distinção retórica em relação a “vê”.
- source_word: ὀφθαλμῷ
  choice: olho
  rationale: Equivalente português direto para ὀφθαλμός nesta imagem concreta e metafórica.
theological_decisions:
- issue: Termo de parentesco masculino ἀδελφοῦ
  choice: irmão
  alternative: irmão ou irmã; semelhante
  rationale: Embora a aplicação do ensino seja geral, o texto-fonte emprega o masculino singular. “Irmão” conserva essa forma sem introduzir uma especificação interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional ampla. A ordem foi ajustada ao uso corrente do português, preservando o contraste entre “vê” e “percebe” e a hipérbole entre “cisco” e “trave”.
