  text: πᾶν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/019.yaml
  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: pt
  text: Toda árvore que não produz bom fruto é cortada e lançada ao fogo[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que não dá bom fruto”.'
    reason: lexical_alternative
  - marker: b
    text: O “fogo” é uma imagem de juízo; o próprio versículo não especifica com maior precisão se a ênfase é temporal, escatológica ou ambas.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: Toda árvore
  rationale: πᾶν com o substantivo singular tem sentido distributivo, referindo-se a cada árvore; “toda árvore” preserva com naturalidade a força proverbial.
- source_word: μὴ ποιοῦν
  choice: que não produz
  rationale: O particípio presente caracteriza a ação da árvore. “Produz” corresponde diretamente a ποιέω e é natural em português; “dá” continua sendo uma alternativa idiomática.
- source_word: καρπὸν καλὸν
  choice: bom fruto
  rationale: καλός expressa aqui o que é bom, saudável ou apropriado. “Bom fruto” conserva o sentido moral e avaliativo do contexto.
- source_word: ἐκκόπτεται
  choice: é cortada
  rationale: O presente passivo indica o que acontece com essa árvore. Em português, “cortar uma árvore” comunica naturalmente sua derrubada sem acrescentar intensidade desnecessária.
- source_word: εἰς πῦρ βάλλεται
  choice: é lançada ao fogo
  rationale: A construção passiva expressa que a árvore é lançada para dentro do fogo. “Ao fogo” é idiomático e preserva a imagem de juízo sem precisar seu referente.
theological_decisions:
- issue: Imagem de juízo representada pelo fogo
  choice: Manter a metáfora de a árvore ser cortada e lançada ao fogo, sem definir exatamente a que o fogo se refere.
  alternative: Juízo temporal; juízo escatológico; inferno.
  rationale: O versículo comunica claramente juízo por meio de uma imagem agrícola, mas não determina por si só o momento ou o alcance exato desse juízo. A tradução preserva a advertência e a tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Lançada” mantém o tom bíblico sem soar arcaico; “ao fogo” é mais natural em português do que uma reprodução rígida da preposição grega.
