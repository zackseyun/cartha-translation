  text: Do not judge[a], so that you may not be judged.
translation:
  language: pt
  text: Não julguem[a], para que vocês não sejam julgados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Não condenem, para que vocês não sejam condenados». O verbo grego pode, em alguns contextos, ter o sentido de condenar, mas «julgar» é mais amplo e preserva a repetição lexical do versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: Não
  rationale: Com o imperativo presente κρίνετε, μή introduz uma proibição; em português, «não» antes do verbo transmite naturalmente essa força.
- source_word: κρίνετε
  choice: julguem
  rationale: κρίνω possui sentido amplo, que pode incluir julgar, avaliar ou condenar. «Julguem» preserva essa amplitude e a repetição lexical com κριθῆτε.
- source_word: ἵνα
  choice: para que
  rationale: ἵνα com o subjuntivo exprime aqui finalidade ou resultado; «para que» mantém a relação entre as duas orações de modo claro e natural.
- source_word: μὴ
  choice: não
  rationale: O segundo μή nega o subjuntivo passivo seguinte e é traduzido diretamente por «não».
- source_word: κριθῆτε
  choice: sejam julgados
  rationale: O aoristo passivo subjuntivo de κρίνω é vertido com a mesma raiz usada para κρίνετε, preservando o paralelismo retórico sem restringir o sentido a condenação.
theological_decisions:
- issue: Alcance de κρίνω na proibição de Jesus
  choice: Manter o termo amplo «julgar», sem restringi-lo interpretativamente a «condenar».
  alternative: Não condenem, para que vocês não sejam condenados.
  rationale: O contexto imediato esclarece a espécie de julgamento advertida, mas este versículo isolado não define todos os limites da avaliação moral. A escolha preserva a tensão teológica e permite que o contexto determine o alcance da proibição.
translation_notes:
  register: Português moderno, digno e acessível, com «vocês» para explicitar naturalmente a segunda pessoa do plural e favorecer ampla legibilidade brasileira. O paralelismo «julguem/julgados» reproduz a estrutura concisa do grego.
