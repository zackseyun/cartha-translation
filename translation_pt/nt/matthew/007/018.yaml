id: MAT.7.18
reference: Matthew 7:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: pt
  text: Uma árvore boa não pode produzir frutos ruins, nem uma árvore podre pode produzir frutos bons.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: uma árvore boa
  rationale: ἀγαθός tem o sentido comum de “bom”. “Árvore boa” conserva tanto a imagem literal quanto a avaliação moral do contexto, sem interpretar antecipadamente o termo como “saudável”.
- source_word: οὐ δύναται ... ποιεῖν
  choice: não pode produzir
  rationale: δύναται expressa capacidade ou possibilidade; com a negação, indica impossibilidade. ποιεῖν com καρπούς significa idiomaticamente produzir frutos.
- source_word: καρποὺς πονηρούς
  choice: frutos ruins
  rationale: πονηρός pode significar mau, ruim ou maligno. No campo metafórico da qualidade dos frutos, “ruins” é natural em português e mantém a amplitude da avaliação sem torná-la excessivamente abstrata.
- source_word: οὐδέ
  choice: nem
  rationale: οὐδέ introduz uma segunda negação paralela. “Nem” reproduz de modo claro e conciso o equilíbrio entre as duas orações.
- source_word: δένδρον σαπρόν
  choice: uma árvore podre
  rationale: σαπρός designa algo apodrecido, deteriorado ou corrupto. “Podre” preserva a força concreta e vívida da imagem.
- source_word: καρποὺς καλούς
  choice: frutos bons
  rationale: καλός descreve aqui frutos de boa qualidade. “Frutos bons” é natural e mantém o contraste direto com “frutos ruins”.
theological_decisions:
- issue: Natureza da impossibilidade na metáfora
  choice: Manter a afirmação categórica com “não pode”
  alternative: “normalmente não produz” ou “não deveria produzir”
  rationale: O grego οὐ δύναται expressa incapacidade, não mera improbabilidade ou obrigação. A tradução conserva a força retórica e moral da declaração sem acrescentar conclusões doutrinárias à metáfora.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O paralelismo do grego foi preservado. Não se acrescentaram notas porque as alternativas lexicais possíveis não são necessárias para compreender o versículo, e “boa/podre” e “ruins/bons” comunicam adequadamente os contrastes do original.
