review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz com precisão o imperativo plural, o contraste entre a porta estreita e a porta larga/caminho espaçoso, e o destino expresso por εἰς τὴν ἀπώλειαν. Contudo, αὐτῆς na oração final é formalmente ambíguo entre antecedentes femininos no contexto; vertê-lo por “essa porta” fixa um referente que o grego não explicita inequivocamente.
  naturalness: O registro é atual, claro e adequadamente solene. “Amplo é o caminho” é mais completo e fluente do que a elipse em “amplo o caminho”, preservando a inversão enfática.
  terminology: “Porta estreita”, “destruição” e “caminho” são escolhas naturais e semanticamente adequadas. A alternativa “espaçoso” documenta bem o campo lexical de εὐρύχωρος.
  issues:
  - severity: medium
    issue: “essa porta” resolve o referente de αὐτῆς
    rationale: Embora “porta” seja uma leitura possível e contextualmente forte, o pronome feminino grego não nomeia o antecedente e pode ser relacionado também ao “caminho”. Uma tradução de equivalência ótima deve manter essa indeterminação quando o texto-fonte não a resolve com segurança.
  - severity: low
    issue: Elipse de “é” em “amplo o caminho”
    rationale: A elipse é compreensível, mas “amplo é o caminho” soa mais acabado em português atual e conserva a ordem enfática do grego.
  revised_text: Entrem pela porta estreita, pois larga é a porta e amplo[a] é o caminho que leva à destruição,[b] e muitos são os que entram por ela.
  revised_footnotes:
  - marker: a
    text: 'Ou: “espaçoso”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “à ruína” ou “à perdição”.'
    reason: lexical_alternative
  revision_rationale: A revisão preserva a ambiguidade anafórica de δι’ αὐτῆς com “por ela”, sem impor “porta” como antecedente explícito, e torna a segunda predicação mais natural com “amplo é o caminho”. As notas e seus marcadores permanecem corretamente ancorados.
