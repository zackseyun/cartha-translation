source:
  edition: SBLGNT
  text: Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι πλατεῖα ⸂ἡ πύλη⸃ καὶ εὐρύχωρος ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: pt
  text: Entrem pela porta estreita, pois larga é a porta e amplo[a] é o caminho que leva à destruição,[b] e muitos são os que entram por ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “espaçoso”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “à ruína” ou “à perdição”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: Entrem
  rationale: Imperativo aoristo ativo na segunda pessoa do plural. “Entrem” comunica de modo direto e natural a ordem dirigida aos ouvintes.
- source_word: διὰ τῆς στενῆς πύλης
  choice: pela porta estreita
  rationale: διά com genitivo indica passagem através de algo. Em português, “entrar pela porta” expressa esse movimento com naturalidade, e “estreita” mantém o contraste espacial do texto.
- source_word: ὅτι
  choice: pois
  rationale: Introduz a explicação que fundamenta a ordem anterior; “pois” preserva essa relação de maneira concisa e digna.
- source_word: πλατεῖα ἡ πύλη
  choice: larga é a porta
  rationale: “Larga” é o equivalente espacial natural de πλατεῖα neste contraste. A ordem predicativa conserva a ênfase da formulação grega sem prejudicar a clareza.
- source_word: εὐρύχωρος ἡ ὁδός
  choice: amplo o caminho
  rationale: εὐρύχωρος descreve algo largo, amplo ou espaçoso. “Amplo” soa natural aplicado a “caminho” e mantém a distinção lexical em relação à porta “larga”.
- source_word: ἡ ἀπάγουσα
  choice: que leva
  rationale: A oração relativa traduz naturalmente o particípio presente e preserva a ideia de direção para um destino.
- source_word: εἰς τὴν ἀπώλειαν
  choice: à destruição
  rationale: ἀπώλεια pode indicar destruição, ruína ou perdição. “Destruição” transmite a gravidade do destino sem definir além do que o versículo declara.
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: muitos são os que entram por essa porta
  rationale: A formulação mantém a ênfase em “muitos”. Embora o grego use o pronome feminino αὐτῆς, explicitar “essa porta” evita que o português o associe indevidamente a “destruição” e expressa o referente exigido pela imagem de entrar por uma porta.
theological_decisions:
- issue: Sentido de ἀπώλεια na advertência de Jesus
  choice: destruição
  alternative: ruína; perdição
  rationale: O termo indica um fim desastroso, mas o versículo não define aqui toda a natureza teológica desse fim. “Destruição” preserva a seriedade e a tensão do texto sem impor uma especificação doutrinária adicional.
- issue: Referente de αὐτῆς na oração final
  choice: essa porta
  alternative: ela
  rationale: A concordância feminina do grego permite a retomada de πύλη, e a construção “entrar por” aponta naturalmente para a porta. A explicitação em português evita uma associação acidental com “destruição”, também feminina, sem alterar a imagem central.
translation_notes:
  register: Português atual, claro e solene, com ampla legibilidade brasileira. A inversão em “larga é a porta” conserva a ênfase retórica do grego; a elipse de “é” em “amplo o caminho” evita repetição pesada. “Essa porta” torna explícito o referente do pronome grego para impedir ambiguidade enganosa em português.
