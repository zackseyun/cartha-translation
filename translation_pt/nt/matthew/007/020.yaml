  text: ἄρα γε ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/020.yaml
  text: So then[a], you will recognize them by their fruits.
translation:
  language: pt
  text: Portanto[a], vocês os reconhecerão pelos seus frutos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Assim, de fato, pelos seus frutos vocês os conhecerão.”'
    reason: Alternativa lexical que preserva de modo mais explícito a leve ênfase de ἄρα γε e a possibilidade de traduzir ἐπιγνώσεσθε por “conhecerão”.
lexical_decisions:
- source_word: ἄρα γε
  choice: Portanto
  rationale: A expressão introduz uma conclusão inferencial com leve ênfase. “Portanto” comunica essa força de modo claro, natural e digno em português.
- source_word: ἀπὸ
  choice: pelos
  rationale: Com ἐπιγνώσεσθε, a preposição indica a evidência ou base pela qual ocorre o reconhecimento; “pelos” é a formulação idiomática em português.
- source_word: καρπῶν
  choice: frutos
  rationale: Preserva o plural explícito e a metáfora do texto grego, em continuidade com o contexto imediato.
- source_word: αὐτῶν
  choice: seus
  rationale: O pronome genitivo modifica “frutos”; “seus” é natural aqui e, no contexto, refere-se às pessoas reconhecidas.
- source_word: ἐπιγνώσεσθε
  choice: vocês reconhecerão
  rationale: O futuro da segunda pessoa do plural indica que os ouvintes identificarão essas pessoas com base em evidências observáveis. “Reconhecerão” expressa isso com precisão.
- source_word: αὐτούς
  choice: os
  rationale: O pronome acusativo retoma as pessoas mencionadas no contexto e é expresso naturalmente pelo pronome objeto “os”.
theological_decisions:
- issue: Uso metafórico de “frutos” na avaliação de pessoas
  choice: Manter a metáfora “frutos” sem explicá-la no texto principal.
  alternative: “ações” ou “resultados”
  rationale: O contexto aponta para manifestações observáveis, mas o texto emprega a metáfora dos frutos. Preservá-la mantém a conexão literária e evita restringir seu alcance interpretativo.
translation_notes:
  register: Português moderno, claro e amplamente compreensível, com boa legibilidade brasileira. O uso de “vocês” explicita a segunda pessoa do plural; a ordem da frase é natural, e a metáfora bíblica permanece intacta.
