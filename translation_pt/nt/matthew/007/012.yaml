id: MAT.7.12
reference: Matthew 7:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: pt
  text: Portanto, em tudo, façam às pessoas[a] o que vocês querem que elas façam a vocês; pois esta é a Lei e os Profetas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os seres humanos”. O grego usa ἄνθρωποι em sentido genérico, referindo-se às pessoas em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: em tudo
  rationale: O acusativo neutro plural, ligado a ὅσα, dá à instrução alcance abrangente. “Em tudo” é natural em português e preserva essa universalidade.
- source_word: οὖν
  choice: Portanto
  rationale: Expressa a inferência que conecta esta máxima ao ensino anterior.
- source_word: ὅσα ἐὰν θέλητε
  choice: o que vocês querem
  rationale: A construção relativa com ἐὰν generaliza o objeto do desejo; esta formulação é clara e idiomática sem enfraquecer seu alcance.
- source_word: ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι
  choice: que elas façam a vocês
  rationale: Após θέλητε, ἵνα com o subjuntivo indica a ação desejada. O pronome “elas” retoma “pessoas”, tradução inclusiva do substantivo grego genérico.
- source_word: οἱ ἄνθρωποι
  choice: as pessoas
  rationale: Embora tenha forma gramatical masculina, o termo designa genericamente seres humanos neste contexto, não apenas homens.
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: façam às pessoas ... o que
  rationale: A oração foi reorganizada de modo natural em português, mantendo a reciprocidade de οὕτως καί e a força imperativa de ποιεῖτε.
- source_word: οὗτος γάρ ἐστιν
  choice: pois esta é
  rationale: Mantém de forma concisa tanto a explicação introduzida por γάρ quanto a construção equativa.
- source_word: ὁ νόμος καὶ οἱ προφῆται
  choice: a Lei e os Profetas
  rationale: Preserva a fórmula judaica reconhecida que resume as Escrituras; as maiúsculas distinguem esse uso de uma referência genérica a lei e profetas.
theological_decisions:
- issue: Sentido genérico de ἄνθρωποι
  choice: as pessoas
  alternative: os homens
  rationale: A máxima trata universalmente das relações humanas. “As pessoas” comunica o referente genérico sem sugerir uma limitação ao sexo masculino.
- issue: Alcance de “a Lei e os Profetas”
  choice: manter a fórmula como resumo das Escrituras
  alternative: parafrasear como “todo o ensino ético das Escrituras”
  rationale: A expressão grega é uma fórmula judaica e mateana estabelecida. Mantê-la preserva sua ressonância intertextual e evita restringi-la por interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações foi ajustada para evitar repetição pesada e produzir uma máxima natural, sem alterar o alcance universal nem a reciprocidade do original.
