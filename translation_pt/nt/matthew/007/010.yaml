  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: pt
  text: Ou, se ele pedir um peixe, não lhe dará uma cobra?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma serpente».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ καὶ
  choice: Ou, se
  rationale: Introduz o segundo exemplo de uma sequência retórica. Em português, «Ou, se» preserva naturalmente a continuação disjuntiva sem traduzir καί de modo excessivamente literal.
- source_word: ἰχθὺν
  choice: um peixe
  rationale: É o objeto direto no acusativo singular, com o sentido comum de peixe como alimento.
- source_word: αἰτήσει
  choice: pedir
  rationale: Embora seja futuro do indicativo, integra uma situação hipotética genérica; a construção portuguesa «se ... pedir» expressa o sentido com naturalidade.
- source_word: μὴ
  choice: será que ...?
  rationale: Marca uma pergunta que espera resposta negativa. «Será que lhe dará...?» comunica em português a força retórica sem convertê-la em afirmação.
- source_word: ὄφιν
  choice: uma cobra
  rationale: Termo corrente e natural em português moderno para o animal; «serpente» também é lexicalmente possível, mas tem registro mais elevado ou tradicional.
- source_word: ἐπιδώσει
  choice: dará
  rationale: No contexto, significa dar ou entregar. «Dará» é a opção mais clara e preserva a forma futura do texto grego.
- source_word: αὐτῷ
  choice: lhe
  rationale: Pronome dativo que expressa naturalmente em português o destinatário da ação.
theological_decisions:
- issue: Força da pergunta retórica
  choice: 'Manter uma pergunta que espera resposta negativa: «será que lhe dará uma cobra?»'
  alternative: 'Traduzir como afirmação: «não lhe dará uma cobra»'
  rationale: O μή na pergunta indica que se espera uma resposta negativa. Preservar essa forma mantém a força do argumento retórico de Jesus.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A inversão natural «será que lhe dará» conserva a pergunta retórica; «cobra» evita o tom excessivamente tradicional de «serpente».
