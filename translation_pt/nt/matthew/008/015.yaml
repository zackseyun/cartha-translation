    rationale: A sequência é ligada por καί (“e”), sem marcador temporal equivalente a “então”; a adição não é necessária.
  - severity: medium
    issue: “Passou a servi-lo” privilegia o valor ingressivo do imperfeito διηκόνει.
    rationale: O imperfeito pode admitir leitura ingressiva, mas também pode simplesmente descrever a ação em desenvolvimento. A tradução principal deve evitar resolver essa ambiguidade; a possibilidade ingressiva pode permanecer em nota.
