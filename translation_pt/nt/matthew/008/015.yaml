- from: E ele tocou na mão dela, e a febre a deixou. Então ela se levantou e passou a servi-lo.[a]
  to: E ele tocou na mão dela, e a febre a deixou, e ela se levantou e o servia.[a]
  rationale: A revisão remove o marcador temporal não expresso (“Então”) e substitui a formulação explicitamente ingressiva por “o servia”, que representa de modo mais direto o imperfeito grego sem excluir, pela nota, a leitura de que ela começou a servi-lo.
