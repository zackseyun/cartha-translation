source:
  edition: SBLGNT
  text: καὶ ἥψατο τῆς χειρὸς αὐτῆς, καὶ ἀφῆκεν αὐτὴν ὁ πυρετός, καὶ ἠγέρθη καὶ διηκόνει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: pt
  text: E ele tocou na mão dela, e a febre a deixou, e ela se levantou e o servia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “começou a servi-lo”. O imperfeito grego pode descrever uma ação em curso, mas também pode sugerir o início dessa ação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥψατο
  choice: tocou
  rationale: O médio de ἅπτω, com genitivo, significa aqui tocar ou entrar em contato; “tocou na mão dela” é natural em português e não exagera a ação.
- source_word: τῆς χειρὸς αὐτῆς
  choice: na mão dela
  rationale: χείρ designa normalmente a mão. A regência idiomática portuguesa de “tocar” permite reproduzir naturalmente a construção grega com “na mão dela”.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: a febre a deixou
  rationale: ἀφίημι significa aqui deixar ou afastar-se. A formulação mantém a febre como sujeito, preservando a leve personificação do grego.
- source_word: πυρετός
  choice: febre
  rationale: O substantivo denota diretamente febre, sem exigir ampliação para “doença febril”.
- source_word: ἠγέρθη
  choice: ela se levantou
  rationale: Embora a forma seja passiva, ἐγείρω pode ter sentido intransitivo neste contexto; a expressão descreve de modo comum o ato de levantar-se depois da cura.
- source_word: διηκόνει αὐτῷ
  choice: passou a servi-lo
  rationale: διακονέω significa servir ou atender. O imperfeito admite uma leitura ingressiva ou progressiva, expressa naturalmente por “passou a servi-lo”, embora também possa indicar simplesmente ação continuada.
theological_decisions:
- issue: Possível leitura teológica excessiva de ἠγέρθη
  choice: ela se levantou
  alternative: ela foi levantada
  rationale: O contexto imediato descreve a mulher levantando-se depois de ser curada. A tradução evita introduzir uma associação explícita com ressurreição que o relato não exige.
- issue: Valor aspectual do imperfeito διηκόνει
  choice: passou a servi-lo
  alternative: servia-o / o servia
  rationale: A redação principal comunica com naturalidade o possível valor ingressivo do imperfeito, enquanto a nota preserva a possibilidade legítima de ação continuada sem decidir a ambiguidade de forma absoluta.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Tocou na mão dela” segue a regência corrente; “a febre a deixou” conserva a estrutura do original; “passou a servi-lo” é idiomático, e a nota registra a ambiguidade aspectual.
