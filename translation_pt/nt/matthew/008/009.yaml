id: MAT.8.9
reference: Matthew 8:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: pt
  text: 'Pois eu também sou homem sujeito à autoridade e tenho soldados sob o meu comando. Digo a um: “Vá!”, e ele vai; a outro: “Venha!”, e ele vem; e ao meu servo[a]: “Faça isto!”, e ele faz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “escravo” (grego: doulos).'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Pois
  rationale: Introduz a explicação do centurião de modo natural e preserva a força causal de γάρ sem traduzir καί de forma pesada.
- source_word: ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν
  choice: sou homem sujeito à autoridade
  rationale: Expressa com clareza que o centurião integra uma cadeia de comando e exerce autoridade delegada.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: tenho soldados sob o meu comando
  rationale: Transmite a posição subordinada dos soldados em português corrente, preservando a analogia militar.
- source_word: λέγω τούτῳ ... καὶ ἄλλῳ
  choice: Digo a um ... a outro
  rationale: A construção distributiva soa natural em português e mantém o paralelismo dos exemplos.
- source_word: Πορεύθητι / Ἔρχου / Ποίησον τοῦτο
  choice: Vá / Venha / Faça isto
  rationale: Imperativos diretos reproduzem a simplicidade e a autoridade das ordens gregas.
- source_word: δοῦλος
  choice: servo
  rationale: No contexto doméstico e no foco sobre obediência à autoridade, “servo” é uma formulação digna e compreensível; “escravo” permanece como alternativa lexical em nota.
theological_decisions:
- issue: Sentido de δοῦλος no exemplo do centurião
  choice: servo
  alternative: escravo
  rationale: O termo pode designar uma pessoa escravizada ou um servo subordinado. Como o ponto imediato é a estrutura de autoridade, “servo” funciona no texto, enquanto a nota conserva a realidade lexical mais forte.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Sujeito à autoridade” evita a possível estranheza de “debaixo de autoridade”, e “sob o meu comando” explicita naturalmente a relação militar sem alterar o sentido.
