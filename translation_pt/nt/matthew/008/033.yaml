source:
  edition: SBLGNT
  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: pt
  text: Então os que cuidavam da manada fugiram e, depois de irem para a cidade, contaram tudo, inclusive o que havia acontecido com os homens dominados por demônios[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “e as coisas relativas aos homens dominados por demônios”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: Então os que cuidavam da manada
  rationale: O particípio substantivado designa os que alimentavam ou pastoreavam os porcos. “Os que cuidavam da manada” é claro e natural; “então” expressa o avanço narrativo marcado por δέ.
- source_word: ἔφυγον
  choice: fugiram
  rationale: Traduz diretamente o aoristo de φεύγω e preserva a vivacidade da narrativa.
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: ao entrarem na cidade
  rationale: Expressa naturalmente a ação anterior ou concomitante do particípio aoristo e o movimento para dentro da cidade indicado por εἰς.
- source_word: ἀπήγγειλαν πάντα
  choice: contaram tudo
  rationale: ἀπαγγέλλω significa comunicar ou relatar; “contaram” é idiomático no contexto, e “tudo” preserva a abrangência de πάντα.
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: inclusive o que havia acontecido com os homens dominados por demônios
  rationale: A construção elíptica significa literalmente “e as coisas relativas aos dominados por demônios”. A formulação explicita de modo natural a referência aos acontecimentos, enquanto a nota conserva a forma mais literal.
- source_word: δαιμονιζομένων
  choice: homens dominados por demônios
  rationale: A expressão comunica que eles estavam sob poder demoníaco sem impor distinções técnicas posteriores. “Homens” é recuperado do contexto imediato, no qual Mateus menciona dois indivíduos.
theological_decisions:
- issue: Como traduzir δαιμονιζομένων sem acrescentar precisão doutrinária ausente do texto
  choice: homens dominados por demônios
  alternative: homens possuídos por demônios
  rationale: “Dominados por demônios” afirma claramente a realidade da aflição e do poder demoníaco no relato, mas evita fazer do termo uma categoria técnica mais definida do que o grego exige.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção elíptica grega é esclarecida no texto, e sua ambiguidade formal é preservada em nota.
