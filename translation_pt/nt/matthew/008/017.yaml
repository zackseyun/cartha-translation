id: MAT.8.17
reference: Matthew 8:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: pt
  text: 'para que se cumprisse o que foi dito por meio do profeta Isaías: “Ele mesmo tomou as nossas enfermidades e carregou as nossas doenças.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Enfermidades” também pode ser traduzido como “fraquezas”; e “carregou”, como “levou” ou “levou sobre si”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: para que se cumprisse
  rationale: Expressa de modo natural em português a finalidade ou o resultado da fórmula de cumprimento, preservando o subjuntivo e o motivo mateano do cumprimento profético.
- source_word: τὸ ῥηθὲν
  choice: o que foi dito
  rationale: Equivalente idiomático e fiel do particípio substantivado.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: por meio do profeta Isaías
  rationale: Preserva o valor de agência ou instrumentalidade de διά com genitivo, sem sugerir que Isaías seja necessariamente a fonte última da fala.
- source_word: λέγοντος
  choice: ':'
  rationale: Em português, os dois-pontos introduzem a citação com mais naturalidade do que a reprodução explícita de 'dizendo', sem perda de conteúdo.
- source_word: Αὐτὸς
  choice: Ele mesmo
  rationale: Mantém a ênfase do pronome grego.
- source_word: τὰς ἀσθενείας ἡμῶν
  choice: as nossas enfermidades
  rationale: No contexto imediato de curas, 'enfermidades' comunica aflições físicas, mas conserva alguma amplitude semântica de ἀσθένεια.
- source_word: ἔλαβεν
  choice: tomou sobre si
  rationale: Mantém a ideia de tomar e torna inteligível sua relação com os sofrimentos citados; evita confundi-lo com o verbo seguinte.
- source_word: τὰς νόσους
  choice: as nossas doenças
  rationale: νόσος designa especificamente doença; a escolha é clara e corrente.
- source_word: ἐβάστασεν
  choice: carregou
  rationale: Representa diretamente o sentido de levar ou carregar, preservando a imagem da citação de Isaías.
theological_decisions:
- issue: Sentido da citação de Isaías 53:4 no contexto das curas de Jesus
  choice: Empregar termos de aflição física — 'enfermidades' e 'doenças' — e conservar a linguagem de tomar sobre si e carregar.
  alternative: Traduzir com termos mais amplos ou tradicionais, como 'fraquezas', 'padecimentos' ou 'levou'.
  rationale: Mateus aplica a citação à atividade de cura de Jesus. A tradução deve refletir esse contexto sem reduzir toda a força da citação a uma formulação doutrinária específica nem apagar sua imagem de alguém que assume e carrega as aflições.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem 'profeta Isaías' é mais natural em português. Os dois-pontos substituem o particípio introdutório λέγοντος de maneira idiomática. O marcador foi colocado após a citação, à qual a nota lexical se refere.
