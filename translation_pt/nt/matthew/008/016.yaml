id: MAT.8.16
reference: Matthew 8:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης προσήνεγκαν αὐτῷ δαιμονιζομένους πολλούς· καὶ ἐξέβαλεν τὰ πνεύματα λόγῳ, καὶ πάντας τοὺς κακῶς ἔχοντας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: pt
  text: Ao cair da tarde, trouxeram-lhe muitos que estavam sob o poder de demônios[a]. Ele expulsou os espíritos com uma palavra e curou todos os que estavam doentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “muitos possessos de demônios”. O particípio grego se refere a pessoas sob influência ou domínio demoníaco.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Ao cair da tarde
  rationale: Expressa naturalmente em português o genitivo absoluto temporal, preservando a transição para o entardecer.
- source_word: προσήνεγκαν αὐτῷ
  choice: trouxeram-lhe
  rationale: Representa de modo conciso e idiomático o ato de levar as pessoas até Jesus.
- source_word: δαιμονιζομένους πολλούς
  choice: muitos que estavam sob o poder de demônios
  rationale: Comunica influência ou domínio demoníaco sem impor a ideia moderna de posse como propriedade, preservando a abrangência do particípio grego.
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: expulsou os espíritos
  rationale: Mantém o objeto explícito do grego e o sentido de expulsão próprio do contexto de exorcismo.
- source_word: λόγῳ
  choice: com uma palavra
  rationale: Preserva o dativo instrumental e a ênfase na autoridade eficaz da palavra de Jesus, sem acrescentar o possessivo ausente no grego.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: todos os que estavam doentes
  rationale: Traduz com clareza a expressão idiomática grega para pessoas enfermas.
- source_word: ἐθεράπευσεν
  choice: curou
  rationale: É a forma natural e corrente em português para θεραπεύω em relatos de cura.
theological_decisions:
- issue: Natureza de δαιμονιζομένους e τὰ πνεύματα
  choice: 'Preservar a aflição demoníaca como categoria narrativa real: “sob o poder de demônios” e “os espíritos”.'
  alternative: Interpretar como doença mental ou usar “possessos de demônios”.
  rationale: O versículo distingue a expulsão dos espíritos da cura dos doentes. A tradução conserva essa distinção e evita tanto psicologizar o relato quanto definir de modo excessivamente rígido a natureza do domínio demoníaco.
- issue: Força instrumental de λόγῳ
  choice: com uma palavra
  alternative: por sua palavra; por uma ordem
  rationale: A formulação mantém a concisão e a ambiguidade lexical do original, destacando a autoridade de Jesus sem explicitação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Ao cair da tarde” é idiomático; “trouxeram-lhe” conserva concisão literária sem soar arcaico. A redação evita terminologia clínica ou denominacional.
