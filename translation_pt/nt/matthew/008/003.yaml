source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: pt
  text: 'E, estendendo a mão, ele o tocou e disse: “Quero[a]; seja purificado.” E imediatamente ele ficou purificado[c] da lepra[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Estou disposto”.
    reason: lexical_alternative
  - marker: b
    text: O termo grego traduzido por “lepra” podia designar diversas doenças graves da pele, não apenas a enfermidade hoje conhecida como hanseníase.
    reason: cultural_note
  - marker: c
    text: Literalmente, “a lepra dele foi purificada”.
    reason: source_syntax
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: estendendo a mão
  rationale: Reproduz de modo natural o gesto concreto expresso pelo particípio aoristo, apresentando-o como ação que acompanha e antecede o toque.
- source_word: ἥψατο αὐτοῦ
  choice: ele o tocou
  rationale: ἅπτομαι com genitivo significa normalmente “tocar”; a formulação portuguesa é clara e direta.
- source_word: Θέλω
  choice: Quero
  rationale: Expressa de forma breve e natural a vontade afirmativa de Jesus em resposta ao pedido anterior. A nota registra a alternativa “Estou disposto”, que explicita a disposição sem reduzir a fala a uma referência ao futuro.
- source_word: καθαρίσθητι
  choice: seja purificado
  rationale: Mantém o passivo e a linguagem de purificação, que abrange tanto a restauração física quanto a dimensão de pureza, sem a reduzir simplesmente a “seja curado”.
- source_word: εὐθέως
  choice: imediatamente
  rationale: Preserva a ênfase do texto na instantaneidade do resultado.
- source_word: ἐκαθαρίσθη
  choice: ficou purificado
  rationale: Mantém a correspondência lexical com καθαρίσθητι e conserva a linguagem de purificação; a construção pessoal é mais natural em português, enquanto a sintaxe grega é registrada em nota.
- source_word: ἡ λέπρα
  choice: a lepra
  rationale: Conserva o termo bíblico tradicional e reconhecível; uma nota esclarece que λέπρα abrangia enfermidades de pele além da hanseníase moderna.
theological_decisions:
- issue: Linguagem de pureza e cura em καθαρίζω
  choice: Empregar “purificar” tanto na ordem quanto no resultado
  alternative: Empregar “curar” ou “ficar curado”
  rationale: O verbo grego apresenta a ação como purificação, com dimensões física e ritual. “Curar” sozinho eliminaria parte dessa tensão semântica.
- issue: Sentido de Θέλω na resposta de Jesus
  choice: Quero
  alternative: Estou disposto
  rationale: “Quero” corresponde diretamente à afirmação volitiva e funciona como resposta natural ao pedido anterior; a alternativa explicativa é preservada em nota.
- issue: Sujeito gramatical da oração final
  choice: Usar a construção portuguesa natural “ele ficou purificado da lepra”
  alternative: Traduzir literalmente “a lepra dele foi purificada”
  rationale: No grego, “a lepra dele” é o sujeito, mas a reprodução literal é pouco natural e pode sugerir que a própria doença foi purificada, não removida. A nota conserva a forma do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fala de Jesus permanece breve e enfática. “Purificado” preserva a linguagem de pureza do grego, enquanto as notas esclarecem a amplitude histórica de “lepra” e a sintaxe incomum da oração final.
