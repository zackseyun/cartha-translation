id: MAT.8.21
reference: Matthew 8:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: pt
  text: 'Então outro dos discípulos lhe disse: “Senhor, permita-me[a] primeiro ir embora e sepultar meu pai[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deixe-me”.
    reason: lexical_alternative
  - marker: b
    text: O pedido pode referir-se tanto a um sepultamento imediato quanto, de modo mais amplo, ao cumprimento do dever filial até a morte do pai; o grego não especifica.
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος
  choice: outro
  rationale: Indica mais uma pessoa, distinta do interlocutor anterior; “outro” é natural e mantém essa distinção.
- source_word: δὲ
  choice: Então
  rationale: Aqui funciona como conectivo narrativo leve, fazendo o relato avançar sem introduzir um contraste forte.
- source_word: τῶν μαθητῶν
  choice: dos discípulos
  rationale: O genitivo identifica o homem como integrante do grupo dos discípulos.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva tanto o tratamento respeitoso dirigido a Jesus quanto sua possível relevância teológica.
- source_word: ἐπίτρεψόν μοι
  choice: permita-me
  rationale: Expressa claramente um pedido respeitoso de autorização; “deixe-me” também seria possível.
- source_word: πρῶτον
  choice: primeiro
  rationale: Mantém a prioridade temporal solicitada pelo discípulo.
- source_word: ἀπελθεῖν
  choice: ir embora
  rationale: Reproduz a ideia de afastar-se do lugar ou da situação presente, presente em ἀπέρχομαι.
- source_word: θάψαι
  choice: sepultar
  rationale: É uma tradução direta e digna do infinitivo, natural no contexto funerário.
- source_word: τὸν πατέρα μου
  choice: meu pai
  rationale: Tradução direta da expressão grega.
theological_decisions:
- issue: Sentido do pedido para sepultar o pai
  choice: Apresentar simplesmente o pedido para ir e sepultar o pai, sem definir se ele acabara de morrer.
  alternative: Entender a frase como o dever mais amplo de permanecer em casa até a futura morte do pai.
  rationale: O grego não informa se o sepultamento era iminente nem se a expressão abrangia uma obrigação filial prolongada; a tradução preserva essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Permita-me” conserva o tom respeitoso do pedido; “sepultar” é corrente no registro bíblico sem soar arcaico. Os marcadores foram colocados junto às expressões que explicam.
source_grounding:
  english_pob_role: consult_only
