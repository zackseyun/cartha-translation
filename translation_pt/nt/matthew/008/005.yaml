  text: 'Quando Jesus entrou em Cafarnaum, um centurião aproximou-se dele e lhe suplicou:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: Quando Jesus entrou
  rationale: O genitivo absoluto com particípio aoristo é expresso naturalmente por uma oração temporal. O nome «Jesus», recuperado do contexto, evita uma abertura pronominal menos clara em português sem alterar o referente.
- source_word: εἰς Καφαρναοὺμ
  choice: em Cafarnaum
  rationale: A construção com εἰς após o verbo de entrada é traduzida idiomaticamente em português; «Cafarnaum» é a forma tradicional e amplamente reconhecida do topônimo.
- source_word: προσῆλθεν αὐτῷ
  choice: aproximou-se dele
  rationale: Expressa diretamente o sentido de προσέρχομαι como chegar perto ou dirigir-se a alguém, preservando o movimento narrativo.
- source_word: ἑκατόνταρχος
  choice: um centurião
  rationale: «Centurião» é o termo português preciso e consagrado para o oficial que comandava aproximadamente uma centúria.
- source_word: παρακαλῶν αὐτὸν
  choice: e lhe suplicou
  rationale: Neste contexto, παρακαλέω introduz um pedido insistente. A coordenação com verbo finito é natural em português e os dois pronomes gregos são representados por «dele» e «lhe». Os dois-pontos preparam a fala direta do versículo seguinte.
