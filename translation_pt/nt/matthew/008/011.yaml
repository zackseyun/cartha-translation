id: MAT.8.11
reference: Matthew 8:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: pt
  text: Mas eu lhes digo que muitos virão do Oriente e do Ocidente e tomarão lugar à mesa com Abraão, Isaque e Jacó no Reino dos céus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “se reclinarão”; no mundo antigo, as pessoas costumavam reclinar-se para comer em banquetes.
    reason: cultural_note
  - marker: b
    text: “Do Oriente e do Ocidente” indica pessoas vindas de regiões distantes e provavelmente inclui pessoas de fora de Israel.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Mas eu lhes digo
  rationale: δέ assinala aqui uma transição com leve contraste em relação ao que precede; “Mas eu lhes digo” é natural e preserva esse movimento discursivo.
- source_word: πολλοὶ
  choice: muitos
  rationale: O adjetivo é substantivado. “Muitos” reproduz de forma concisa o grego sem especificar indevidamente quem são.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: do Oriente e do Ocidente
  rationale: Os plurais gregos designam regiões ou direções. A expressão portuguesa é clara, idiomática e mantém o amplo alcance geográfico.
- source_word: ἥξουσιν
  choice: virão
  rationale: ἥκω significa vir ou chegar; “virão” se ajusta naturalmente à menção das regiões de origem.
- source_word: ἀνακλιθήσονται
  choice: tomarão lugar à mesa
  rationale: O verbo descreve reclinar-se para uma refeição. A formulação comunica ao leitor moderno a participação no banquete sem exigir que a postura antiga pareça ser o ponto central.
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: com Abraão, Isaque e Jacó
  rationale: μετά com genitivo expressa companhia e, no contexto, comunhão à mesa. Os nomes seguem formas portuguesas consagradas.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: no Reino dos céus
  rationale: Preserva a expressão característica de Mateus em português natural. A inicial maiúscula em “Reino” destaca o uso titular sem acrescentar conteúdo ao texto.
theological_decisions:
- issue: Imagem do banquete e comunhão escatológica
  choice: Manter explicitamente a ideia de ocupar lugar à mesa.
  alternative: “se reclinarão” ou simplesmente “se assentarão”
  rationale: A cena envolve participação em um banquete, não mera proximidade espacial. “Tomarão lugar à mesa” conserva essa força, enquanto a nota registra mais literalmente a postura antiga.
- issue: Identidade dos muitos vindos do Oriente e do Ocidente
  choice: Conservar a descrição geográfica sem inserir “gentios” no texto.
  alternative: “muitos gentios virão do Oriente e do Ocidente”
  rationale: O contexto pode sugerir a inclusão de pessoas de fora de Israel, mas o grego diz apenas “muitos”. A tradução não torna explícito aquilo que permanece implícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tomarão lugar à mesa” torna acessível a prática antiga sem apagar a imagem do banquete; as notas preservam a forma mais literal e a provável implicação geográfica.
