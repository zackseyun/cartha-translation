base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/007.yaml
  text: And he says to him[a], “I will come and heal him.”
translation:
  language: pt
  text: 'E ele lhe diz[a]: “Eu irei e o curarei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Devo ir e curá-lo?” Alguns intérpretes entendem as palavras de Jesus como uma pergunta por causa do contexto, mas a formulação grega é lida naturalmente como uma declaração.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a ligação narrativa simples, sem acrescentar valor temporal ou conclusivo que não esteja explícito no grego.
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico do texto grego, recurso natural também na narrativa em português.
- source_word: αὐτῷ
  choice: lhe
  rationale: Expressa de modo conciso e natural o objeto indireto de λέγει.
- source_word: Ἐγὼ
  choice: Eu
  rationale: Conserva o pronome explícito e sua possível ênfase moderada, sem ampliá-la artificialmente.
- source_word: ἐλθὼν
  choice: irei e
  rationale: 'O particípio aoristo ligado ao verbo futuro indica ação acompanhante ou anterior; a coordenação é uma formulação natural em português e preserva a sequência: ir e curar.'
- source_word: θεραπεύσω
  choice: curarei
  rationale: No contexto de enfermidade, comunica com clareza a ação de sanar. O futuro preserva a forma verbal grega.
- source_word: αὐτόν
  choice: o
  rationale: Pronome objeto masculino que retoma naturalmente o servo enfermo mencionado no contexto.
theological_decisions:
- issue: Se as palavras de Jesus devem ser traduzidas como declaração ou pergunta
  choice: 'Declaração: “Eu irei e o curarei.”'
  alternative: 'Pergunta: “Eu irei curá-lo?” ou “Devo ir curá-lo?”'
  rationale: A formulação grega não contém partícula interrogativa e é lida mais naturalmente como declaração. A interpretação interrogativa é possível a partir do contexto, por isso é registrada em nota sem substituir o sentido mais direto do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com presente histórico e ordem fluente. A construção “Eu irei e o curarei” preserva tanto a ênfase discreta do pronome explícito quanto a sequência verbal do grego.
