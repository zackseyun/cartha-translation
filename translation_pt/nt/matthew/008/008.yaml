  source_fidelity: 'A tradução reproduz adequadamente o sentido do grego: o centurião responde, chama Jesus de “Senhor”, declara-se indigno de recebê-lo sob seu teto, pede-lhe que fale, e expressa confiança na cura de seu παῖς. “Servo” é uma escolha contextual defensável, desde que a amplitude semântica seja preservada em nota.'
  naturalness: O texto é claro, digno e muito legível em português brasileiro e internacional. “Dize” mantém um registro solene apropriado, embora “dize apenas uma palavra” possa ser ligeiramente ajustado para uma ordem mais direta.
  terminology: “Centurião”, “Senhor”, “digno”, “teto”, “servo” e “será curado” são escolhas precisas. A nota sobre παῖς preserva corretamente a ambiguidade lexical. A nota textual deve explicitar a leitura variante em vez de fazer uma afirmação genérica.
  issues:
  - severity: low
    issue: Nota textual genérica em [a]
    rationale: Os colchetes na edição-fonte assinalam incerteza textual em καὶ ἀποκριθεὶς. A nota deve identificar de modo concreto a alternativa relevante, em vez de apenas afirmar que há variação nas palavras introdutórias.
  - severity: low
    issue: Formulação da nota [b]
    rationale: “O grego diz literalmente ‘dize com uma palavra’” é uma explicação pouco natural e potencialmente enganosa do dativo λόγῳ. A nota pode registrar a alternativa idiomática sem alegar uma literalidade inadequada.
  revised_text: 'O centurião respondeu[a]: “Senhor, não sou digno de que entres debaixo do meu teto. Mas apenas dize uma palavra[b], e meu servo[c] será curado.”'
  revised_footnotes:
