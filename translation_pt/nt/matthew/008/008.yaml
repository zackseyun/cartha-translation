reference: Matthew 8:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: pt
  text: 'O centurião respondeu[a]: “Senhor, não sou digno de que entres debaixo do meu teto. Mas dize apenas uma palavra[b], e meu servo[c] será curado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Há variação textual nas palavras introdutórias traduzidas por “respondeu”.
    reason: textual_variant
  - marker: b
    text: Ou “dize a palavra”. O grego diz literalmente “dize com uma palavra”.
    reason: lexical_alternative
  - marker: c
    text: Ou “menino” ou “criança”; o termo grego pode designar uma criança, um jovem ou um servo, conforme o contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ἀποκριθεὶς … ἔφη
  choice: respondeu
  rationale: A construção combina um particípio com um verbo de fala. Em português, “respondeu” expressa naturalmente a introdução da fala sem a redundância de “respondendo, disse”.
- source_word: ἑκατόνταρχος
  choice: centurião
  rationale: É o termo português tradicional e preciso para o oficial que comandava aproximadamente cem soldados.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva tanto o tratamento respeitoso dirigido a Jesus quanto a possível ressonância cristológica do termo.
- source_word: ἱκανός
  choice: digno
  rationale: Neste contexto, o termo expressa mérito ou condição considerada apropriada, e não mera capacidade.
- source_word: ὑπὸ τὴν στέγην
  choice: debaixo do meu teto
  rationale: Mantém a imagem concreta e idiomática do grego, em vez de reduzi-la simplesmente a “em minha casa”.
- source_word: μόνον εἰπὲ λόγῳ
  choice: dize apenas uma palavra
  rationale: Preserva o imperativo, a restrição indicada por μόνον e a referência explícita à palavra falada, em português claro e digno.
- source_word: ἰαθήσεται
  choice: será curado
  rationale: Traduz de modo direto o futuro passivo de ἰάομαι no contexto de cura.
- source_word: παῖς
  choice: servo
  rationale: O contexto do centurião e o paralelo narrativo favorecem “servo”, embora o termo grego também possa designar menino ou criança; essa amplitude é registrada em nota.
theological_decisions:
- issue: Sentido de κύριος no tratamento dirigido a Jesus
  choice: Senhor
  alternative: senhor; mestre
  rationale: “Senhor” mantém o tratamento respeitoso e permite a possível dimensão cristológica sem obrigar o leitor a entendê-lo apenas como título divino.
- issue: Identidade indicada por παῖς
  choice: servo
  alternative: menino; criança
  rationale: “Servo” é favorecido pelo contexto social e pelo paralelo de Lucas 7, mas a ambiguidade lexical genuína é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla inteligibilidade internacional e boa legibilidade brasileira. A segunda pessoa do singular mantém a fala direta e solene sem recorrer a uma paráfrase. “Debaixo do meu teto” preserva a imagem do original; “servo” conserva o cenário histórico, com a ambiguidade explicada em nota.
