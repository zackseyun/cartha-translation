  text: Quando ele desceu do monte, grandes multidões o seguiram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: Quando ele desceu
  rationale: O genitivo absoluto com particípio aoristo é expresso naturalmente por uma oração temporal. «Quando» preserva a sequência narrativa sem especificar em excesso a relação temporal; δέ funciona aqui como conexão leve e não exige tradução separada.
- source_word: ἀπὸ τοῦ ὄρους
  choice: do monte
  rationale: ὄρος pode designar monte ou montanha. «Do monte» é natural no contexto bíblico-narrativo e retoma o cenário definido do discurso anterior.
- source_word: ἠκολούθησαν αὐτῷ
  choice: o seguiram
  rationale: ἀκολουθέω com complemento no dativo significa seguir alguém. Em português atual, a construção idiomática é «seguir» com objeto direto.
- source_word: ὄχλοι πολλοί
  choice: grandes multidões
  rationale: A expressão indica multidões numerosas ou de grande tamanho. «Grandes multidões» é natural em português e preserva o plural de ὄχλοι sem reduzi-lo simplesmente a «muita gente».
