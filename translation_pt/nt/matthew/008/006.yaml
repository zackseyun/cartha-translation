  text: καὶ λέγων· Κύριε, ὁ παῖς μου βέβληται ἐν τῇ οἰκίᾳ παραλυτικός, δεινῶς βασανιζόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: pt
  text: 'e dizendo: “Senhor, o meu servo[a] está deitado em casa, paralisado e sofrendo terrivelmente[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “menino” ou “criança”. A palavra grega pode se referir a um servo ou a uma criança, embora “servo” pareça mais adequado ao contexto do centurião.
    reason: lexical_alternative
  - marker: b
    text: Ou “sendo severamente atormentado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: e dizendo
  rationale: Mantém de modo natural a ligação participial do grego com o versículo anterior.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva tanto a possibilidade de uma forma respeitosa de tratamento quanto uma compreensão mais elevada de Jesus.
- source_word: ὁ παῖς μου
  choice: o meu servo
  rationale: παῖς pode designar servo, menino ou filho; no contexto do centurião, “servo” é a opção mais provável, sem apagar as alternativas lexicais.
- source_word: βέβληται ἐν τῇ οἰκίᾳ
  choice: está de cama em casa
  rationale: Expressa o estado resultante indicado pelo perfeito passivo de βάλλω de maneira idiomática e clara em português.
- source_word: παραλυτικός
  choice: paralítico
  rationale: Reproduz diretamente a condição descrita pelo adjetivo grego e se integra com naturalidade à construção portuguesa.
- source_word: δεινῶς βασανιζόμενος
  choice: sofrendo terrivelmente
  rationale: Comunica a intensidade da aflição em linguagem atual, enquanto a alternativa mais literal é registrada em nota.
theological_decisions:
- issue: Sentido de Κύριε como forma de tratamento dirigida a Jesus
  choice: Senhor
  alternative: senhor (como tratamento equivalente a “senhor meu” ou “senhor”, sem força titular definida)
  rationale: “Senhor” mantém aberta a tensão entre tratamento respeitoso e reconhecimento teologicamente mais elevado, sem impor uma leitura exclusiva.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Está de cama” evita uma reprodução rígida de βέβληται e comunica claramente o estado do enfermo. Os marcadores [a] e [b] aparecem no texto principal; [b] foi colocado ao fim da oração porque comenta a expressão final.
