  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: pt
  text: 'E eis que eles gritaram: “Que temos nós a ver com você?[a] Filho de Deus, você veio aqui antes do tempo determinado[b] para nos atormentar?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “O que há entre nós e você?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “antes do tempo”. O grego pode se referir a um tempo determinado por Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: E eis que
  rationale: Preserva o marcador discursivo e sua força vívida de chamar a atenção, em linguagem bíblica ainda amplamente compreensível.
- source_word: ἔκραξαν λέγοντες
  choice: eles gritaram
  rationale: O verbo κράζω indica um grito forte. Em português, omitir o particípio redundante “dizendo” produz uma frase mais natural sem perder conteúdo relevante.
- source_word: Τί ἡμῖν καὶ σοί
  choice: Que temos nós a ver com você
  rationale: Reproduz de modo inteligível o idiomatismo de distanciamento e confronto, mantendo sua estrutura mais próxima do grego do que alternativas mais interpretativas.
- source_word: υἱὲ τοῦ θεοῦ
  choice: Filho de Deus
  rationale: Traduz diretamente o título cristológico usado na interpelação a Jesus.
- source_word: ἦλθες ὧδε
  choice: Você veio aqui
  rationale: Mantém o aoristo como passado simples, natural em português, e preserva o valor locativo de ὧδε.
- source_word: πρὸ καιροῦ
  choice: antes do tempo determinado
  rationale: καιρός pode designar um momento fixado ou oportuno; “tempo determinado” conserva a provável nuance escatológica sem explicar quem o determinou.
- source_word: βασανίσαι ἡμᾶς
  choice: para nos atormentar
  rationale: Expressa a finalidade do infinitivo e o sentido de sofrimento severo associado ao juízo, sem restringi-lo indevidamente à tortura física.
theological_decisions:
- issue: Reconhecimento da identidade de Jesus pelos demônios
  choice: Filho de Deus
  alternative: filho de Deus
  rationale: O título é explícito no texto e funciona como forma direta de tratamento; a tradução não o enfraquece nem o amplia.
- issue: Nuance escatológica de καιρός
  choice: antes do tempo determinado
  alternative: antes do tempo
  rationale: A fala pressupõe um momento definido para o tormento, mas o texto não desenvolve um esquema escatológico; a formulação preserva essa tensão.
- issue: Força do idiomatismo Τί ἡμῖν καὶ σοί
  choice: Que temos nós a ver com você
  alternative: O que você quer conosco?
  rationale: A opção escolhida mantém a reciprocidade e o distanciamento presentes no idiomatismo, enquanto a alternativa explicita mais fortemente uma intenção atribuída a Jesus.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Você” evita o regionalismo de “tu”; “eis que” conserva deliberadamente a vivacidade do marcador grego. Os marcadores de nota aparecem no texto junto aos trechos pertinentes.
