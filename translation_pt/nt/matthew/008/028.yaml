id: MAT.8.28
reference: Matthew 8:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: pt
  text: Quando ele chegou ao outro lado, à região dos gadarenos,[a] vieram ao seu encontro dois homens dominados por demônios, saindo dos túmulos. Eram tão ferozes que ninguém conseguia passar por aquele caminho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “gergesenos” ou “gerasenos” em vez de “gadarenos”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Quando ele chegou
  rationale: O genitivo absoluto é expresso naturalmente como oração temporal, preservando a sequência narrativa.
- source_word: τὸ πέραν
  choice: ao outro lado
  rationale: A expressão designa o lado oposto do lago no contexto e tem equivalente idiomático direto em português.
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: à região dos gadarenos
  rationale: χώρα indica região ou território; o gentílico segue a forma Γαδαρηνῶν do texto crítico.
- source_word: ὑπήντησαν αὐτῷ
  choice: vieram ao seu encontro
  rationale: A formulação natural preserva a ideia de que os dois homens se encontraram com Jesus, sem sugerir um encontro casual.
- source_word: δύο δαιμονιζόμενοι
  choice: dois homens dominados por demônios
  rationale: A expressão comunica sujeição a agentes demoníacos pessoais sem depender do tecnicismo pouco natural “demonizados” nem acrescentar uma teoria específica sobre a natureza dessa sujeição.
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: saindo dos túmulos
  rationale: A frase participial descreve a procedência dos homens; “túmulos” é claro e adequado ao cenário funerário.
- source_word: χαλεποὶ λίαν
  choice: tão ferozes
  rationale: χαλεπός neste contexto caracteriza pessoas perigosas e agressivas; “ferozes” preserva essa amplitude melhor que uma referência específica a atos violentos. O intensificador λίαν, ligado ao resultado introduzido por ὥστε, é expresso por “tão... que”.
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν
  choice: que ninguém conseguia passar
  rationale: A construção expressa resultado, e ἰσχύω indica aqui capacidade prática, traduzida de modo corrente por “conseguia”.
- source_word: διὰ τῆς ὁδοῦ ἐκείνης
  choice: por aquele caminho
  rationale: διά com o genitivo indica o trajeto pelo qual se passa; “caminho” é natural e não pressupõe uma estrada formal.
theological_decisions:
- issue: Linguagem para a aflição demoníaca
  choice: dominados por demônios
  alternative: possuídos por demônios; demonizados
  rationale: A tradução mantém a agência demoníaca pessoal e a sujeição dos homens indicada por δαιμονιζόμενοι, sem transformar o particípio em um termo técnico de alcance doutrinário mais preciso do que o grego exige.
- issue: Variação textual do topônimo
  choice: gadarenos
  alternative: gergesenos; gerasenos
  rationale: O texto principal segue Γαδαρηνῶν no SBLGNT; as formas variantes relevantes da tradição manuscrita são registradas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para evitar uma sequência pesada de particípios. O ponto após “túmulos” deixa claro que “ferozes” descreve os dois homens, não os túmulos. O único marcador de nota aparece no texto principal.
