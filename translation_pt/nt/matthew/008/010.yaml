id: MAT.8.10
reference: Matthew 8:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: pt
  text: 'Ao ouvir isso, Jesus ficou admirado e disse aos que o seguiam: “Em verdade lhes digo: não encontrei em Israel ninguém com tamanha fé.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: Ao ouvir isso
  rationale: O particípio aoristo apresenta a circunstância anterior à ação principal. “Isso” é retomado naturalmente do contexto, isto é, das palavras anteriores do centurião.
- source_word: ἐθαύμασεν
  choice: ficou admirado
  rationale: Expressa assombro ou admiração de modo claro e atual, sem acrescentar a ideia de ignorância ou erro.
- source_word: τοῖς ἀκολουθοῦσιν
  choice: aos que o seguiam
  rationale: O particípio presente se refere às pessoas que acompanhavam Jesus naquele momento, sem necessariamente lhes atribuir uma designação institucional.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Em verdade lhes digo
  rationale: Preserva o caráter solene e enfático da fórmula de Jesus em português corrente e digno.
- source_word: παρ’ οὐδενὶ
  choice: ninguém
  rationale: 'Com o verbo “encontrar”, a construção portuguesa natural reorganiza a expressão associativa grega como objeto pessoal: “não encontrei ... ninguém”.'
- source_word: τοσαύτην πίστιν
  choice: tamanha fé
  rationale: “Tamanha” comunica explicitamente o grau destacado por τοσαύτην, mantendo πίστις como “fé”.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: em Israel
  rationale: Reproduz de modo direto a referência locativa e corporativa ao povo de Israel.
- source_word: εὗρον
  choice: não encontrei
  rationale: O aoristo é vertido naturalmente pelo pretérito perfeito em português; a negação de οὐδενί é expressa antes do verbo.
theological_decisions:
- issue: Sentido de πίστις
  choice: fé
  alternative: confiança
  rationale: O contexto ressalta a confiança do centurião na autoridade de Jesus, mas “fé” preserva o termo teológico amplo e a formulação tradicional sem restringir indevidamente sua nuance.
- issue: Admiração de Jesus
  choice: ficou admirado
  alternative: maravilhou-se
  rationale: A tradução conserva a reação narrativa expressa por ἐθαύμασεν sem tentar resolver sistematicamente suas implicações cristológicas; “ficou admirado” é mais atual e transparente.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem final foi ajustada à sintaxe natural do português, sem perda da ênfase do grego: a ausência de fé comparável em Israel permanece explícita.'
