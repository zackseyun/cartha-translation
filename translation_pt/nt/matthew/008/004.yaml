id: MAT.8.4
reference: Matthew 8:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: pt
  text: 'E Jesus lhe disse: “Tenha cuidado para não contar isso a ninguém. Mas vá, apresente-se ao sacerdote e ofereça a oferta que Moisés ordenou,[a] como testemunho para eles.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta ordem corresponde ao procedimento estabelecido por Moisés para a pessoa purificada da lepra; veja Levítico 14.
    reason: cross_reference
  - marker: b
    text: Ou “para servir de testemunho a eles”. A frase pode indicar uma prova apresentada aos sacerdotes; alguns também a entendem como um testemunho implícito contra os que não creriam.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα μηδενὶ εἴπῃς
  choice: Tenha cuidado para não contar isso a ninguém
  rationale: O imperativo ὅρα introduz uma advertência enfática, e a construção com μηδενί e o subjuntivo exprime proibição. A formulação é natural em português e mantém a força da ordem.
- source_word: ὕπαγε
  choice: vá
  rationale: Equivalente direto e corrente do imperativo de movimento.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: apresente-se ao sacerdote
  rationale: Expressa naturalmente em português o comparecimento pessoal para a inspeção sacerdotal, sem perder o sentido reflexivo da construção grega.
- source_word: προσένεγκον τὸ δῶρον
  choice: ofereça a oferta
  rationale: No contexto cultual, προσφέρω indica apresentar como oferta, e δῶρον designa a dádiva ou oferta prescrita. A formulação torna claro o caráter ritual.
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: que Moisés ordenou
  rationale: Mantém de modo direto a noção de ordem ou prescrição expressa por προστάσσω.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: como testemunho para eles
  rationale: Preserva tanto a finalidade ou resultado da expressão com εἰς quanto a indefinição do referente de αὐτοῖς e da possível força de μαρτύριον.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jesus lhe disse
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma narrativa natural em português.
theological_decisions:
- issue: Referente e força de εἰς μαρτύριον αὐτοῖς
  choice: como testemunho para eles
  alternative: como prova para os sacerdotes; como testemunho contra eles
  rationale: O texto grego não identifica explicitamente quem são “eles”, nem determina se o testemunho é favorável, comprobatório ou acusatório. A tradução conserva essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Apresente-se” comunica com naturalidade o comparecimento para inspeção; “como testemunho para eles” conserva deliberadamente a ambiguidade do original.
