  text: οἱ δὲ δαίμονες παρεκάλουν αὐτὸν λέγοντες· Εἰ ἐκβάλλεις ἡμᾶς, ⸂ἀπόστειλον ἡμᾶς⸃ εἰς τὴν ἀγέλην τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/031.yaml
  text: And the demons kept begging him[a], saying, “If you cast us out[b], send us into the herd of pigs.”
translation:
  language: pt
  text: 'E os demônios lhe suplicavam[a], dizendo: “Se nos expulsas, manda-nos para a manada de porcos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “continuavam suplicando-lhe” ou “insistiam em lhe pedir”; o verbo grego está no imperfeito e sugere ação contínua ou repetida.
    reason: lexical_alternative
lexical_decisions:
- source_word: δαίμονες
  choice: demônios
  rationale: Equivalente português corrente e preciso, preservando a referência a seres espirituais malignos pessoais.
- source_word: παρεκάλουν
  choice: lhe suplicavam
  rationale: O pretérito imperfeito expressa ação continuada ou repetida; “suplicavam” comunica um pedido insistente sem sobrecarregar o texto.
- source_word: λέγοντες
  choice: dizendo
  rationale: Mantém naturalmente o particípio que introduz o discurso direto.
- source_word: Εἰ
  choice: Se
  rationale: Preserva a forma condicional do grego sem reinterpretá-la como causal.
- source_word: ἐκβάλλεις
  choice: nos expulsas
  rationale: “Expulsar” é natural em português e transmite com precisão a remoção forçada indicada por ἐκβάλλω neste contexto.
- source_word: ἀπόστειλον ἡμᾶς
  choice: manda-nos
  rationale: Expressa de modo direto e idiomático o imperativo aoristo e mantém explícito o objeto plural.
- source_word: ἀγέλην τῶν χοίρων
  choice: manada de porcos
  rationale: Forma clara e contemporânea para o grupo de animais referido no texto.
- source_word: οἱ δὲ
  choice: E os
  rationale: Marca a continuação narrativa sem impor um contraste mais forte do que o grego exige.
theological_decisions:
- issue: Designação dos espíritos malignos
  choice: demônios
  alternative: espíritos demoníacos
  rationale: “Demônios” conserva a apresentação textual de seres malignos pessoais que falam com Jesus, sem acrescentar explicação doutrinária.
- issue: Valor da condição introduzida por Εἰ
  choice: Se nos expulsas
  alternative: Já que nos expulsas
  rationale: A tradução mantém a condição formal e a tensão do enunciado, evitando decidir que os demônios tratavam a expulsão como fato consumado.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O pronome enclítico em “lhe suplicavam” e “manda-nos” preserva concisão e formalidade moderada sem soar arcaico. “Porcos” foi preferido a “suínos” por ser mais natural na narrativa.
