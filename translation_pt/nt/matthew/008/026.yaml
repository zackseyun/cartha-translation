  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: pt
  text: 'E ele lhes disse: “Por que vocês são medrosos, vocês de pouca fé?” Então se levantou, repreendeu os ventos e o mar, e houve uma grande calmaria.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: com tanto medo
  rationale: Expressa de modo natural a condição de temor e falta de coragem indicada pelo adjetivo, sem recorrer ao mais acusatório “covardes”.
- source_word: ὀλιγόπιστοι
  choice: homens de pouca fé
  rationale: Preserva a censura direta e a ideia de fé insuficiente. “Homens” torna natural o vocativo substantivado neste contexto, sem restringir o sentido a uma categoria doutrinária.
- source_word: ἐπετίμησεν
  choice: repreendeu
  rationale: Mantém o verbo forte de censura ou ordem autoritativa usado no texto grego.
- source_word: γαλήνη μεγάλη
  choice: uma grande calmaria
  rationale: Reproduz a intensidade de μεγάλη e descreve naturalmente a completa tranquilização do mar.
theological_decisions:
- issue: Relação entre medo e pouca fé
  choice: Manter a censura em duas partes, sem explicar causalmente uma pela outra.
  alternative: Traduzir de modo interpretativo, como “Por que vocês têm medo? Vocês não têm fé suficiente”.
  rationale: O grego justapõe a pergunta e o vocativo; a tradução preserva essa tensão sem acrescentar uma formulação doutrinária.
- issue: Autoridade de Jesus sobre os elementos
  choice: Traduzir literalmente que ele “repreendeu os ventos e o mar”.
  alternative: Suavizar para “ordenou que os ventos e o mar se acalmassem”.
  rationale: “Repreendeu” conserva a personificação e a força narrativa do verbo, sem explicar a natureza dessa autoridade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês” adequado à legibilidade brasileira. A ordem narrativa e o contraste entre o medo dos discípulos e a grande calmaria foram preservados.
