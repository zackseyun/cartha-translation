  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: pt
  text: 'Mas Jesus lhe diz: “Siga-me e deixe que os mortos sepultem os seus próprios mortos.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A primeira ocorrência de “mortos” é muitas vezes entendida em sentido metafórico: os que estão espiritualmente insensíveis podem sepultar os que morreram fisicamente.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste moderado entre o pedido anterior e a resposta corretiva de Jesus, sem tornar a oposição excessivamente forte.
- source_word: λέγει αὐτῷ
  choice: lhe diz
  rationale: Preserva o presente histórico grego e sua vivacidade narrativa; o pronome oblíquo expressa naturalmente o destinatário em português.
- source_word: Ἀκολούθει μοι
  choice: Siga-me
  rationale: Imperativo direto e idiomático que comunica tanto o ato de seguir quanto o chamado ao discipulado.
- source_word: ἄφες
  choice: deixe que
  rationale: Neste contexto, introduz naturalmente em português a ação confiada a outros, mantendo a contundência da ordem de Jesus.
- source_word: νεκροὺς ... νεκρούς
  choice: os mortos ... mortos
  rationale: Mantém a repetição deliberada do mesmo termo grego e preserva o jogo de palavras e a tensão entre possíveis sentidos metafórico e literal.
- source_word: θάψαι
  choice: sepultem
  rationale: Depois de “deixe que”, a forma verbal finita é a construção portuguesa mais natural; “sepultar” mantém um registro digno e amplamente compreensível.
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: os seus próprios mortos
  rationale: “Próprios” preserva a ênfase reflexiva de ἑαυτῶν; “seus” retoma os mortos mencionados como sujeito.
theological_decisions:
- issue: Sentido da primeira ocorrência de “mortos”
  choice: O texto principal conserva “os mortos ... os seus próprios mortos”, sem acrescentar “espiritualmente”.
  alternative: Explicitar a primeira ocorrência como “os espiritualmente mortos” e entender a segunda como referência aos fisicamente mortos.
  rationale: O grego emprega a mesma palavra nas duas ocorrências, criando uma formulação provocadora e ambígua. Explicitar o sentido metafórico no texto resolveria uma tensão que a fonte deixa aberta; a interpretação provável é indicada apenas em nota.
translation_notes:
  register: Português moderno, digno e de leitura natural, com boa compreensão no Brasil e ampla inteligibilidade internacional. O presente histórico “diz” conserva a vivacidade do original; “sepultar” evita coloquialismo excessivo e se ajusta ao contexto funerário.
