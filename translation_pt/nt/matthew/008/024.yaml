id: MAT.8.24
reference: Matthew 8:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς μέγας ἐγένετο ἐν τῇ θαλάσσῃ, ὥστε τὸ πλοῖον καλύπτεσθαι ὑπὸ τῶν κυμάτων, αὐτὸς δὲ ἐκάθευδεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: pt
  text: E eis que se levantou no mar uma grande tempestade[a], de modo que o barco era coberto pelas ondas[b]; ele, porém, dormia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido como “tempestade” significa literalmente “abalo” e muitas vezes se refere a um terremoto; aqui, o contexto indica uma violenta agitação do mar.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “era inundado pelas ondas”.'
    reason: translation_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva a função discursiva de chamar a atenção e a vivacidade repentina da cena, em linguagem bíblica ainda compreensível em português.
- source_word: σεισμὸς μέγας
  choice: uma grande tempestade
  rationale: Embora σεισμός frequentemente designe terremoto ou abalo, o contexto marítimo — mar, barco e ondas — indica uma violenta agitação do mar. “Grande tempestade” comunica esse sentido naturalmente.
- source_word: ἐγένετο
  choice: se levantou
  rationale: Com “tempestade” como sujeito, a expressão é idiomática em português e transmite o início súbito do acontecimento.
- source_word: ἐν τῇ θαλάσσῃ
  choice: no mar
  rationale: Mantém o termo da fonte e expressa de modo natural o local do acontecimento, sem substituí-lo pela identificação geográfica “lago”.
- source_word: ὥστε
  choice: de modo que
  rationale: Introduz claramente o resultado da violência da tempestade.
- source_word: τὸ πλοῖον
  choice: o barco
  rationale: No cenário do mar da Galileia, “barco” é mais natural e adequado do que “navio”.
- source_word: καλύπτεσθαι
  choice: era coberto
  rationale: Preserva diretamente a imagem do verbo grego e seu aspecto contínuo no passado, sem explicitar além do texto que o barco se enchia de água.
- source_word: ὑπὸ τῶν κυμάτων
  choice: pelas ondas
  rationale: 'Expressa o agente ou meio da construção passiva: eram as ondas que cobriam o barco.'
- source_word: αὐτὸς δὲ
  choice: ele, porém
  rationale: Comunica o contraste enfático entre o perigo ao redor e a ação contínua de Jesus, sem acrescentar um “ele mesmo” excessivo em português.
- source_word: ἐκάθευδεν
  choice: dormia
  rationale: O imperfeito português representa de maneira natural a ação contínua indicada pelo imperfeito grego.
theological_decisions:
- issue: Natureza do acontecimento descrito por σεισμός
  choice: tempestade
  alternative: terremoto ou grande abalo
  rationale: Esta é uma decisão lexical e contextual, não doutrinária. A imagem marítima circundante indica uma violenta perturbação no mar; “tempestade” evita sugerir indevidamente um terremoto terrestre.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. “E eis que” conserva a vivacidade do marcador narrativo; “ele, porém, dormia” mantém o contraste e o aspecto contínuo. A redação evita tanto arcaísmo excessivo quanto coloquialismo.
