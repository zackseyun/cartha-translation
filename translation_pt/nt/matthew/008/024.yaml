  source_fidelity: 'O texto representa com fidelidade o grego: «E eis que» preserva o marcador narrativo ἰδού; «uma grande tempestade» exprime adequadamente σεισμὸς μέγας no contexto marítimo; «se levantou no mar» traduz naturalmente ἐγένετο ἐν τῇ θαλάσσῃ; e «o barco era coberto pelas ondas» mantém a voz passiva e a imagem contínua de καλύπτεσθαι ὑπὸ τῶν κυμάτων. «Ele, porém, dormia» conserva tanto o contraste de αὐτὸς δέ como o valor imperfectivo de ἐκάθευδεν.'
