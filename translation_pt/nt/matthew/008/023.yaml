id: MAT.8.23
reference: Matthew 8:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐμβάντι αὐτῷ ⸀εἰς πλοῖον ἠκολούθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/023.yaml
  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: pt
  text: Quando ele entrou[b] no barco[a], seus discípulos o seguiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «num barco». O grego não traz artigo antes de «barco»; o contexto também permite entender uma embarcação específica.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «Ao entrar»; ou, mais formalmente, «Depois que entrou».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντι
  choice: quando ele entrou
  rationale: O particípio aoristo indica uma ação temporal relacionada à ação principal, provavelmente anterior a ela. A oração com «quando» é natural em português e preserva alguma flexibilidade temporal; «entrou» expressa de modo claro o embarque na embarcação.
- source_word: πλοῖον
  choice: o barco
  rationale: πλοῖον pode designar barco ou navio. No cenário do mar da Galileia, «barco» é a opção moderna mais natural. Embora o grego não use artigo neste sintagma, «no barco» se ajusta à continuidade narrativa em português; a leitura indefinida é registrada em nota.
- source_word: ἠκολούθησαν
  choice: seguiram
  rationale: «Seguiram» comunica o movimento físico e, ao mesmo tempo, preserva a possível ressonância de discipulado frequente no uso mateano de ἀκολουθέω, sem explicitá-la além do texto.
- source_word: μαθηταὶ
  choice: discípulos
  rationale: «Discípulos» é o termo consagrado e adequado para os aprendizes e seguidores de Jesus, preservando tanto a relação de ensino quanto a de compromisso pessoal.
- source_word: αὐτῷ ... αὐτῷ ... αὐτοῦ
  choice: ele / o / seus
  rationale: Os pronomes se referem a Jesus no contexto. Em português, «ele» funciona como sujeito da oração temporal, «o» como objeto de «seguiram» e «seus» expressa a relação dos discípulos com ele.
theological_decisions:
- issue: Possível nuance de discipulado em ἀκολουθέω
  choice: Manter «seguiram» sem paráfrase teológica explícita.
  alternative: «foram com ele» ou «tornaram-se seus seguidores»
  rationale: O sentido imediato é o deslocamento físico dos discípulos atrás de Jesus, mas «seguir» também conserva a ressonância de discipulado presente no Evangelho de Mateus. Assim, a tradução mantém a tensão sem impor uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. A formulação evita solenidade artificial e mantém a concisão narrativa do grego.
