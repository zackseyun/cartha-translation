id: MAT.8.20
reference: Matthew 8:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: pt
  text: 'E Jesus lhe diz: “As raposas têm tocas, e as aves do céu têm ninhos, mas o Filho do Homem não tem onde reclinar a cabeça.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: diz
  rationale: Preserva o presente histórico grego, que é natural na narrativa em português e mantém a vivacidade do relato.
- source_word: ἀλώπεκες
  choice: raposas
  rationale: Equivalente lexical direto e corrente do substantivo plural.
- source_word: φωλεούς
  choice: tocas
  rationale: Em referência a raposas, “tocas” é a expressão natural em português para seus abrigos, sem restringir indevidamente a imagem.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: aves do céu
  rationale: Reproduz de maneira clara e digna a construção grega; “céu” conserva a imagem de οὐρανός.
- source_word: κατασκηνώσεις
  choice: ninhos
  rationale: Embora possa designar lugares de pouso ou abrigo, “ninhos” é a correspondência contextual mais natural para aves e preserva o contraste entre moradias e a falta de lugar de Jesus.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a autodesignação de Jesus, sua forma tradicional e suas possíveis ressonâncias teológicas, sem resolver a ambiguidade por paráfrase.
- source_word: οὐκ ἔχει ποῦ
  choice: não tem onde
  rationale: Expressão idiomática em português que corresponde de perto à construção grega negada.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: repousar a cabeça
  rationale: Expressão corrente que conserva a imagem concreta de inclinar ou deitar a cabeça para descansar.
theological_decisions:
- issue: Tradução da autodesignação de Jesus ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  alternative: o Ser Humano
  rationale: “Filho do Homem” preserva a formulação da fonte, o uso estabelecido como autodesignação e suas possíveis ressonâncias em Daniel 7. A alternativa interpreta mais diretamente a expressão e reduz parte de sua tensão semântica e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O presente narrativo foi mantido. Não foram acrescentadas notas porque as principais alternativas lexicais não são necessárias para compreender o versículo, e a ambiguidade teológica central foi preservada no próprio texto.
