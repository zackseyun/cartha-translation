  text: ἦν δὲ μακρὰν ἀπ’ αὐτῶν ἀγέλη χοίρων πολλῶν βοσκομένη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/030.yaml
  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: pt
  text: A certa distância deles[a], uma grande manada de porcos estava se alimentando.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “longe deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: estava
  rationale: ἦν sustenta a construção perifrástica com o particípio βοσκομένη. A força conectiva leve de δέ fica implícita no fluxo narrativo, sem acrescentar um marcador temporal inexistente.
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: a certa distância deles
  rationale: A expressão indica distância espacial. Esta formulação é natural em português e mantém alguma abertura quanto ao grau exato de afastamento.
- source_word: ἀγέλη
  choice: manada
  rationale: Designa um agrupamento de animais; “manada” é uma opção corrente e clara para um grande grupo de porcos.
- source_word: χοίρων
  choice: de porcos
  rationale: “Porcos” é a equivalência moderna, direta e amplamente compreensível.
- source_word: πολλῶν
  choice: grande
  rationale: Embora o termo signifique literalmente “muitos”, com o substantivo coletivo ἀγέλη o português idiomático expressa a quantidade como “uma grande manada”.
- source_word: βοσκομένη
  choice: estava se alimentando
  rationale: O particípio médio descreve os animais comendo. “Se alimentando” é natural para porcos e evita a associação mais estreita de “pastando” com animais que comem capim.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa natural. A ordem inicial do adjunto de distância dá fluidez sem alterar o sentido; a alternativa mais forte “longe deles” é preservada em nota.
