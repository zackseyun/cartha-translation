id: MAT.8.34
reference: Matthew 8:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: pt
  text: E eis que toda a cidade saiu ao encontro de Jesus; quando o viram, suplicaram-lhe que se retirasse da região deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do território deles”; mais literalmente, “dos limites deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva a função discursiva de chamar a atenção e a vivacidade narrativa, em linguagem bíblica ainda compreensível no português atual.
- source_word: πᾶσα ἡ πόλις
  choice: toda a cidade
  rationale: Reproduz naturalmente o sentido coletivo da população da cidade, sem exigir que cada indivíduo esteja necessariamente incluído.
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Expressa diretamente o movimento para fora da cidade indicado pelo aoristo de ἐξέρχομαι.
- source_word: εἰς ὑπάντησιν
  choice: ao encontro de
  rationale: É a forma idiomática e precisa de indicar que saíram com o propósito de encontrar Jesus.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Adota a forma tradicional e corrente do nome em português.
- source_word: ἰδόντες αὐτὸν
  choice: quando o viram
  rationale: Traduz o particípio aoristo com valor temporal de modo fluente, preservando a sequência narrativa.
- source_word: παρεκάλεσαν
  choice: suplicaram-lhe
  rationale: Comunica a intensidade do pedido melhor que uma formulação neutra como “pediram”, sem acrescentar o motivo da súplica.
- source_word: ὅπως μεταβῇ
  choice: que se retirasse
  rationale: Expressa naturalmente o conteúdo da súplica e o sentido de deixar aquele lugar, mantendo um registro digno.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: da região deles
  rationale: Embora ὅρια possa designar literalmente limites ou fronteiras, no contexto refere-se ao território ou distrito pertencente à população.
theological_decisions:
- issue: Motivo do pedido dos habitantes
  choice: O texto apenas informa que suplicaram a Jesus que se retirasse da região.
  alternative: Explicitar medo do poder de Jesus, indignação pela perda dos porcos ou alarme geral diante do acontecimento.
  rationale: O grego não declara o motivo. A tradução preserva a tensão narrativa e evita introduzir uma interpretação no texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “E eis que” conserva o marcador narrativo grego sem excessiva literalidade; “suplicaram-lhe” mantém a força do pedido. O marcador da nota foi colocado junto a “região deles”, expressão a que a alternativa lexical se refere.
