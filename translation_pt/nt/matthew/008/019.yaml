id: MAT.8.19
reference: Matthew 8:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ προσελθὼν εἷς γραμματεὺς εἶπεν αὐτῷ· Διδάσκαλε, ἀκολουθήσω σοι ὅπου ἐὰν ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/019.yaml
  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: pt
  text: 'Um escriba se aproximou e lhe disse: “Mestre, eu o seguirei aonde quer que vá[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aonde quer que parta” ou “aonde quer que vá embora”. O verbo grego pode indicar mais especificamente afastar-se ou partir, embora aqui funcione naturalmente como “ir”.
    reason: alternativa lexical
lexical_decisions:
- source_word: προσελθὼν
  choice: se aproximou
  rationale: O particípio aoristo indica que o escriba se dirigiu até Jesus antes de falar. “Se aproximou” é natural e preserva claramente esse movimento.
- source_word: εἷς
  choice: um
  rationale: O numeral introduz um indivíduo. Em português, “um escriba” conserva essa referência sem a formulação menos natural “certo escriba”.
- source_word: γραμματεὺς
  choice: escriba
  rationale: É o termo tradicional e preciso para o especialista judaico nas Escrituras e na Lei, sem ampliar interpretativamente o texto para “mestre da Lei”.
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: Como forma de tratamento, “Mestre” comunica naturalmente a função de quem ensina e é a equivalência consagrada em português, sem transliterar “Rabi”.
- source_word: ἀκολουθήσω
  choice: eu o seguirei
  rationale: O futuro do indicativo expressa uma declaração firme de intenção. A formulação preserva tanto o sentido concreto de acompanhar quanto a possível dimensão de discipulado.
- source_word: ὅπου ἐὰν
  choice: aonde quer que
  rationale: A expressão grega tem sentido relativo indefinido. Como o verbo envolve deslocamento, “aonde quer que” comunica naturalmente o destino aberto da promessa.
- source_word: ἀπέρχῃ
  choice: vá
  rationale: Embora o verbo possa especificar partir ou ir embora, neste contexto “vá” é a forma portuguesa mais natural e mantém o sentido geral de deslocamento.
theological_decisions:
- issue: Título διδάσκαλος dirigido a Jesus
  choice: Mestre
  alternative: Rabi; Professor
  rationale: “Mestre” traduz o título respeitoso ligado ao ensino sem impor uma afirmação cristológica mais forte do que o grego exige. “Rabi” seria uma transliteração de outro título, e “Professor” soaria moderno e institucional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português. O pronome “o” evita acrescentar ao texto grego uma forma explícita de tratamento como “o senhor”, enquanto o vocativo “Mestre” deixa claro que Jesus é o destinatário.
