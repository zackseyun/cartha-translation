id: MAT.8.25
reference: Matthew 8:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀προσελθόντες ἤγειραν αὐτὸν λέγοντες· Κύριε, ⸀σῶσον, ἀπολλύμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: pt
  text: 'E, aproximando-se, eles o acordaram, dizendo: “Senhor, salva-nos! Estamos perecendo!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “socorre-nos”. O imperativo grego σῶσον pode indicar o livramento imediato de um perigo, além do sentido mais amplo de “salvar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: aproximando-se
  rationale: O particípio aoristo de προσέρχομαι indica que eles se dirigiram até Jesus antes de acordá-lo. “Aproximando-se” preserva esse movimento sem acrescentar informação.
- source_word: ἤγειραν
  choice: acordaram
  rationale: Neste contexto, ἐγείρω se refere concretamente a despertar alguém do sono, e não a levantar ou ressuscitar.
- source_word: λέγοντες
  choice: dizendo
  rationale: O particípio introduz diretamente as palavras dos discípulos; “dizendo” evita acrescentar uma intensidade emocional que o verbo, por si só, não explicita.
- source_word: Κύριε
  choice: Senhor
  rationale: O vocativo κύριε admite desde uma forma respeitosa de tratamento até um peso cristológico mais profundo. “Senhor” conserva essa amplitude.
- source_word: σῶσον
  choice: salva-nos
  rationale: O imperativo aoristo de σῴζω expressa aqui um pedido urgente de livramento diante do perigo. O objeto “nos”, implícito no grego e evidente pela primeira pessoa plural seguinte, é necessário em português.
- source_word: ἀπολλύμεθα
  choice: estamos perecendo
  rationale: A forma presente exprime ruína ou morte iminente. “Estamos perecendo” preserva o aspecto progressivo e a urgência do pedido.
theological_decisions:
- issue: Sentido do título κύριος dirigido a Jesus
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” mantém tanto o valor de tratamento respeitoso quanto a possível profundidade cristológica, sem decidir entre esses matizes.
- issue: Explicitação do objeto de σῶσον
  choice: salva-nos
  alternative: salva
  rationale: Embora o verbo grego não traga um pronome objeto separado, o contexto e “estamos perecendo” tornam inequívoca a referência aos discípulos; o português natural pede a explicitação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem das ações e a urgência da fala foram preservadas; manteve-se “perecendo” por sua precisão aspectual e tonalidade bíblica ainda compreensível.
