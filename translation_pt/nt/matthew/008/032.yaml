id: MAT.8.32
reference: Matthew 8:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: pt
  text: 'E ele lhes disse: “Vão.” Então eles saíram e entraram nos porcos. E eis que toda a manada se precipitou pela encosta íngreme[a] para dentro do mar e morreu nas águas.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelo precipício”. O termo grego pode designar uma encosta íngreme, um barranco ou um precipício.
    reason: lexical_alternative
  - marker: b
    text: Ou “se afogou nas águas”. Mais literalmente, o grego diz “morreu nas águas”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Vão
  rationale: Imperativo breve e direto, preservando a concisão da ordem de Jesus em português atual.
- source_word: ἐξελθόντες
  choice: saíram
  rationale: Expressa de modo natural a saída dos demônios, sem tornar explícito no versículo aquilo que o grego deixa como sujeito contextual.
- source_word: ἀπῆλθον εἰς τοὺς χοίρους
  choice: entraram nos porcos
  rationale: Comunica naturalmente em português o movimento para dentro dos animais indicado pela preposição εἰς.
- source_word: χοίρους
  choice: porcos
  rationale: Equivalente comum, claro e contemporâneo, preferível ao termo mais técnico 'suínos'.
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Mantém o marcador discursivo que chama atenção para o acontecimento súbito e vívido.
- source_word: πᾶσα ἡ ἀγέλη
  choice: toda a manada
  rationale: Preserva tanto o substantivo coletivo quanto a ideia de totalidade.
- source_word: ὥρμησεν
  choice: se precipitou
  rationale: Transmite o movimento súbito e impetuoso da manada e combina naturalmente com a descida pela encosta.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: pela encosta íngreme
  rationale: κρημνός pode indicar encosta muito inclinada, barranco ou precipício; a escolha evita impor a imagem mais específica de uma parede vertical.
- source_word: θάλασσαν
  choice: mar
  rationale: Reproduz diretamente θάλασσα, sem substituir o termo do texto por uma identificação geográfica explicativa como 'lago'.
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: morreu nas águas
  rationale: Segue de perto a formulação grega, que declara a morte nas águas sem empregar explicitamente um verbo que signifique 'afogar-se'.
theological_decisions:
- issue: Grau de especificidade ao descrever a morte da manada
  choice: morreu nas águas
  alternative: afogou-se nas águas
  rationale: Embora o contexto indique afogamento, o grego diz literalmente que a manada morreu nas águas. A redação principal preserva o que está expresso, sem transformar a inferência narrativa em afirmação explícita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem curta “Vão” conserva a força narrativa; “e eis que” retém a vivacidade do marcador grego. A concordância no singular em “se precipitou” e “morreu” acompanha o coletivo “manada”.
