source:
  edition: SBLGNT
  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: pt
  text: Mas os filhos do Reino serão lançados para as trevas exteriores.[a] Ali haverá choro e ranger de dentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filhos do Reino” é uma expressão que se refere àqueles considerados herdeiros naturais ou membros esperados do Reino.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ τῆς βασιλείας
  choice: Mas os filhos do Reino
  rationale: '“Mas” expressa o contraste de δέ com os que vêm de longe e participam do Reino no versículo anterior. “Filhos do Reino” preserva o idioma grego e sua ironia: aqueles considerados herdeiros naturais ou membros esperados acabam excluídos.'
- source_word: ἐκβληθήσονται
  choice: serão lançados para fora
  rationale: O futuro passivo de ἐκβάλλω comunica expulsão vigorosa. A formulação é clara em português moderno e mantém tanto a força verbal quanto a ideia explícita de exclusão.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: nas trevas exteriores
  rationale: Mantém a expressão característica de Mateus e a imagem espacial de escuridão situada do lado de fora, sem substituí-la por uma interpretação doutrinária.
- source_word: ἐκεῖ
  choice: Ali
  rationale: A posição inicial preserva a ênfase locativa do grego e evita uma construção repetitiva.
- source_word: ὁ κλαυθμὸς
  choice: choro
  rationale: “Choro” é natural, digno e suficientemente amplo para κλαυθμός, sem intensificar necessariamente para “lamentação” ou “pranto”.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: ranger de dentes
  rationale: É a expressão bíblica consolidada em português e corresponde de perto à construção grega.
theological_decisions:
- issue: Imagem de exclusão e juízo
  choice: Conservar “lançados para fora”, “trevas exteriores”, “choro” e “ranger de dentes”.
  alternative: Explicitar como “inferno” ou “castigo eterno”.
  rationale: O texto apresenta imagens severas de exclusão e angústia, mas não emprega aqui um termo específico para “inferno” nem formula diretamente a duração do castigo. A tradução preserva a imagem e a tensão do original.
- issue: Sentido idiomático e gênero de υἱοὶ τῆς βασιλείας
  choice: filhos do Reino
  alternative: herdeiros do Reino; membros do Reino; filhos e filhas do Reino
  rationale: A tradução formal conserva o masculino plural e o idioma sem restringir por explicação o seu referente. A nota esclarece que a expressão designa os considerados herdeiros naturais ou membros esperados.
translation_notes:
  register: Português contemporâneo, claro e solene, com ampla legibilidade brasileira. A inicial maiúscula em “Reino” funciona como referência contextual ao reino de Deus, sem acrescentar uma formulação ausente do grego. A ordem “Ali haverá...” reproduz naturalmente a ênfase de ἐκεῖ.
