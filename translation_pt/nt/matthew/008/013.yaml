  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: pt
  text: 'Então Jesus disse ao centurião: “Vá; que lhe aconteça conforme você creu.” E o servo[a] foi curado naquela hora.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “menino” ou “criança”. A palavra grega παῖς pode designar um servo ou uma pessoa jovem. Neste contexto, “servo” provavelmente se refere ao subordinado do centurião.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: centurião
  rationale: Termo preciso e consagrado para o oficial romano que comandava aproximadamente cem soldados.
- source_word: Ὕπαγε
  choice: Vá
  rationale: Imperativo direto e natural em português moderno, sem acrescentar conteúdo ausente do grego.
- source_word: ὡς ἐπίστευσας
  choice: conforme você creu
  rationale: Preserva a construção verbal e pessoal do aoristo ἐπίστευσας, em vez de transformá-la no substantivo interpretativo “fé”.
- source_word: γενηθήτω σοι
  choice: Que lhe aconteça
  rationale: Expressa de modo natural a força jussiva do imperativo passivo de γίνομαι e mantém σοι como benefício ou referência pessoal.
- source_word: παῖς
  choice: servo
  rationale: No contexto do centurião e de seu subordinado, “servo” é a leitura mais provável; a possível referência a um menino ou filho é mantida em nota.
- source_word: ἰάθη
  choice: foi curado
  rationale: Equivalente claro e convencional do passivo de ἰάομαι, que indica cura ou restauração.
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: naquela mesma hora
  rationale: Preserva a expressão temporal do grego e comunica a estreita coincidência temporal sem convertê-la explicitamente em “naquele exato instante”.
theological_decisions:
- issue: Tradução da linguagem de πιστεύω
  choice: creu
  alternative: confiou; teve fé
  rationale: “Creu” mantém a forma verbal do original e a formulação tradicional, sem resolver o ato de crer apenas como assentimento intelectual nem o parafrasear como substantivo.
- issue: Relação entre a crença do centurião e o resultado
  choice: conforme você creu
  alternative: segundo a sua fé
  rationale: A tradução conserva a relação expressa por ὡς sem desenvolver uma teoria causal ou meritória da fé que o texto não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” para leitura natural no Brasil. A ordem da última frase foi ajustada para fluência, sem alterar a relação temporal. O marcador [a] aparece imediatamente após o termo ambíguo.
