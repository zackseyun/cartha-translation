id: MAT.8.27
reference: Matthew 8:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ἄνθρωποι ἐθαύμασαν λέγοντες· Ποταπός ἐστιν οὗτος ὅτι καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα ⸂αὐτῷ ὑπακούουσιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/027.yaml
  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: pt
  text: 'Os homens ficaram admirados e disseram: “Que tipo de homem é este, que até os ventos e o mar lhe obedecem?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: Os homens
  rationale: O substantivo masculino plural refere-se, no contexto, aos homens no barco; a tradução mantém essa referência específica sem generalizá-la para toda a humanidade.
- source_word: ἐθαύμασαν
  choice: ficaram admirados
  rationale: Expressa de modo natural e atual a reação pontual de assombro e admiração indicada pelo aoristo.
- source_word: λέγοντες
  choice: e disseram
  rationale: A coordenação é mais natural na narrativa portuguesa do que a reprodução literal do particípio, sem alterar sua relação com a admiração.
- source_word: Ποταπός ἐστιν οὗτος
  choice: Que tipo de homem é este
  rationale: Ποταπός pergunta pela natureza ou qualidade da pessoa. A explicitação de “homem”, implícita no grego e sustentada pelo contexto, produz uma pergunta clara e idiomática em português.
- source_word: ὅτι
  choice: a quem
  rationale: Nesta construção exclamativa-interrogativa, “a quem” liga naturalmente a identidade de Jesus ao fato surpreendente da obediência dos elementos, preservando o sentido explicativo sem uma formulação portuguesa rígida.
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: até os ventos e o mar
  rationale: “Até” comunica a força enfática do primeiro καί, destacando que inclusive as forças naturais lhe obedecem.
- source_word: αὐτῷ ὑπακούουσιν
  choice: obedecem
  rationale: ὑπακούω denota obedecer ou acatar; “obedecem” preserva a imagem de autoridade pessoal exercida sobre os ventos e o mar.
theological_decisions:
- issue: Força cristológica da pergunta
  choice: Manter a pergunta aberta e direta, preservando a extraordinária autoridade de Jesus sobre a criação sem explicá-la doutrinariamente.
  alternative: Tornar explícita uma conclusão sobre a identidade divina de Jesus ou reduzir a fala a simples surpresa diante de um milagre.
  rationale: O versículo suscita a questão da identidade de Jesus por meio da obediência dos ventos e do mar, mas não formula aqui a resposta; a tradução conserva essa tensão narrativa e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ficaram admirados” evita o tom arcaico de “maravilharam-se”, e “que tipo de homem” comunica com clareza a pergunta qualitativa do grego.
