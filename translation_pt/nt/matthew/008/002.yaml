id: MAT.8.2
reference: Matthew 8:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ λεπρὸς ⸀προσελθὼν προσεκύνει αὐτῷ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: pt
  text: 'E eis que um homem com lepra se aproximou e se prostrou diante dele[a], dizendo: “Senhor, se quiseres, podes me purificar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o adorou”; o verbo grego pode indicar prostrar-se em reverência, prestar homenagem ou adorar, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Preserva a função de chamar a atenção e a vivacidade narrativa do grego; embora marcada, a expressão é clara e reconhecível em português bíblico moderno.
- source_word: λεπρὸς
  choice: um homem com lepra
  rationale: Expressa o adjetivo substantivado sem reduzir a pessoa à sua enfermidade. “Lepra” conserva o termo tradicional, embora a designação antiga possa abranger diferentes doenças de pele.
- source_word: προσελθὼν
  choice: se aproximou
  rationale: Comunica explicitamente o movimento em direção a Jesus e soa natural na narrativa portuguesa.
- source_word: προσεκύνει
  choice: se prostrou diante dele
  rationale: Preserva o gesto corporal de profunda reverência sem decidir antecipadamente se o contexto exige o sentido pleno de adoração.
- source_word: Κύριε
  choice: Senhor
  rationale: Mantém tanto o tratamento respeitoso dirigido a Jesus quanto sua possível densidade cristológica.
- source_word: ἐὰν θέλῃς
  choice: se quiseres
  rationale: Forma natural e digna em português, preservando a condição relativa à vontade de Jesus.
- source_word: δύνασαί
  choice: podes
  rationale: Expressa de modo direto e idiomático a capacidade ou o poder afirmado pelo homem.
- source_word: καθαρίσαι
  choice: me purificar
  rationale: Mantém a dimensão física e ritual de καθαρίζω no contexto da lepra, que “me curar” enfraqueceria.
theological_decisions:
- issue: Sentido de προσκυνέω dirigido a Jesus
  choice: se prostrou diante dele
  alternative: o adorou
  rationale: O verbo pode indicar prostração reverente, homenagem ou adoração. A tradução principal descreve o gesto sem eliminar sua possível dimensão de culto; a nota registra a alternativa teologicamente significativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “E eis que” conserva deliberadamente a marca narrativa do original; “se quiseres” mantém solenidade sem soar arcaico.
