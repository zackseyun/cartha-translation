  source_fidelity: 'A tradução reproduz adequadamente todos os elementos centrais do grego: a partícula de destaque em “E eis que”, a aproximação do homem, seu gesto reverente, a forma de tratamento “Senhor”, a condição ligada à vontade de Jesus, sua capacidade e o pedido de purificação. “Um homem com lepra” é uma formulação respeitosa e semanticamente adequada para λεπρός. “Se prostrou diante dele” conserva o gesto expresso por προσεκύνει sem impor a leitura mais específica de adoração.'
  naturalness: O texto é claro, fluente e de registro bíblico moderno compreensível internacionalmente, com boa legibilidade brasileira. “E eis que” é deliberadamente marcado, mas é idiomático no registro narrativo das Escrituras e transmite a força discursiva de ἰδού. “Se quiseres” e “podes me purificar” soam naturais e dignos.
  terminology: “Senhor” preserva apropriadamente a amplitude de Κύριε. “Purificar” mantém as dimensões física e de pureza associadas a καθαρίσαι, sem reduzi-las a mera cura. A nota de rodapé para “se prostrou diante dele” apresenta de modo equilibrado a alternativa “o adorou”, sem resolver indevidamente a ambiguidade lexical de προσκυνέω.
