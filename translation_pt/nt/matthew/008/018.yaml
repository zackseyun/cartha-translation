  source_fidelity: A tradução reproduz adequadamente a sequência temporal de Ἰδὼν δέ, o plural de πολλοὺς ὄχλους, a força de ἐκέλευσεν e o destino expresso por εἰς τὸ πέραν. Contudo, o infinitivo flexionado «irem» introduz número plural para o sujeito de ἀπελθεῖν, enquanto o infinitivo grego não o explicita.
  naturalness: «Quando Jesus viu muitas multidões ao seu redor» é claro e natural, embora o plural deliberadamente marcado de «muitas multidões» soe menos usual do que formulações que o reduziriam a uma multidão singular. «Deu ordens para ir para o outro lado» é idiomático e evita precisar quem deveria ir.
  terminology: «Jesus», «multidões» e «deu ordens» são apropriados. «O outro lado» traduz τὸ πέραν de modo mais direto do que «a outra margem», sem depender de explicitação geográfica contextual.
