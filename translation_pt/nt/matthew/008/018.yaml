    rationale: O infinitivo ἀπελθεῖν não traz marca de número nem identifica o destinatário da ordem. Embora o contexto possa sugerir várias pessoas, o português «irem» fixa essa inferência na tradução. O infinitivo não flexionado preserva melhor a abertura do grego.
