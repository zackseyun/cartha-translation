  text: Ἰδὼν δὲ ὁ Ἰησοῦς ⸂πολλοὺς ὄχλους⸃ περὶ αὐτὸν ἐκέλευσεν ἀπελθεῖν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/018.yaml
  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: pt
  text: Quando Jesus viu muitas multidões ao seu redor, deu ordens para ir para o outro lado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Quando ... viu
  rationale: O particípio aoristo introduz a circunstância temporal da ordem seguinte; “quando viu” é natural em português. δέ funciona aqui como conector discursivo e não exige uma palavra específica.
- source_word: πολλοὺς ὄχλους
  choice: muitas multidões
  rationale: Mantém o plural enfático e um pouco incomum do grego, sem reduzi-lo simplesmente a “uma grande multidão”.
- source_word: ἐκέλευσεν
  choice: deu ordens
  rationale: Expressa a força autoritativa do verbo, mais forte que um simples “disse”.
- source_word: ἀπελθεῖν εἰς τὸ πέραν
  choice: para irem à outra margem
  rationale: No contexto da travessia do lago, τὸ πέραν designa a margem oposta. O infinitivo plural contextual “irem” deixa o sujeito da ação sem identificação explícita, como no grego.
theological_decisions:
- issue: Sujeito implícito de ἀπελθεῖν
  choice: para irem
  alternative: para partir / para que partissem
  rationale: O texto grego não nomeia explicitamente quem deve ir. A formulação evita acrescentar “os discípulos” ou “todos”, preservando essa abertura contextual.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural. Preserva-se a expressão marcada “muitas multidões” por corresponder ao plural do texto-fonte.
