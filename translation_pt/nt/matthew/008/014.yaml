  text: Καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν Πέτρου εἶδεν τὴν πενθερὰν αὐτοῦ βεβλημένην καὶ πυρέσσουσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/014.yaml
  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: pt
  text: Quando Jesus entrou na casa de Pedro, viu a sogra de Pedro deitada e com febre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deitada e febril”. O grego descreve-a como estando deitada e com febre; “na cama” fica implícito no contexto, mas não é expresso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Quando Jesus entrou
  rationale: O particípio aoristo tem valor temporal; “quando ... entrou” expressa naturalmente a sequência e combina com o destino introduzido por εἰς.
- source_word: οἰκίαν Πέτρου
  choice: casa de Pedro
  rationale: Reproduz de modo claro e corrente a relação possessiva do genitivo, mantendo o sentido concreto de οἰκία.
- source_word: πενθερὰν αὐτοῦ
  choice: a sogra dele
  rationale: πενθερά significa especificamente “sogra”. “Dele” retoma Pedro; essa formulação natural em português reduz a possibilidade de tomar Jesus como referente.
- source_word: βεβλημένην
  choice: deitada
  rationale: O particípio perfeito passivo descreve o estado em que ela se encontrava. “Deitada” é idiomático e não acrescenta explicitamente “na cama”, detalhe apenas implícito pelo contexto.
- source_word: πυρέσσουσαν
  choice: com febre
  rationale: Expressa de maneira direta e natural a condição contínua indicada pelo particípio presente, sem intensificar o grau da enfermidade.
theological_decisions:
- issue: Referente de αὐτοῦ em πενθερὰν αὐτοῦ
  choice: O pronome se refere a Pedro; a mulher é a sogra de Pedro.
  alternative: Uma formulação ambígua em português poderia fazer o leitor associar o pronome a Jesus.
  rationale: A sintaxe e o contexto ligam o possessivo a Pedro. A tradução esclarece apenas essa relação gramatical, sem extrair conclusões doutrinárias adicionais.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem narrativa foi preservada, e a redação evita tanto o arcaísmo quanto explicitações não presentes no grego.
