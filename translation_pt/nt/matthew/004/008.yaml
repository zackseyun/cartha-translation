  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: pt
  text: Mais uma vez, o diabo o leva a um monte muito alto e lhe mostra todos os reinos do mundo e a glória deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o esplendor deles”.'
    reason: Alternativa lexical contextual para δόξα, que aqui pode indicar a magnificência visível dos reinos.
lexical_decisions:
- source_word: Πάλιν
  choice: Mais uma vez
  rationale: Marca a repetição na sequência das tentações de modo natural e claro em português.
- source_word: παραλαμβάνει
  choice: o leva
  rationale: Reproduz o presente histórico da narrativa e expressa o movimento sem acrescentar detalhes não explicitados no grego.
- source_word: ὁ διάβολος
  choice: o diabo
  rationale: É a designação tradicional, clara e contextualmente adequada para διάβολος.
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: a um monte muito alto
  rationale: Preserva o movimento indicado por εἰς e a intensificação de ὑψηλόν por λίαν em português natural.
- source_word: δείκνυσιν
  choice: lhe mostra
  rationale: Traduz diretamente o ato de mostrar, mantendo também o presente histórico.
- source_word: πάσας τὰς βασιλείας
  choice: todos os reinos
  rationale: Conserva a abrangência de πάσας e o sentido político e régio de βασιλείας.
- source_word: τοῦ κόσμου
  choice: do mundo
  rationale: É a tradução ampla e natural de κόσμος neste contexto.
- source_word: τὴν δόξαν αὐτῶν
  choice: a glória deles
  rationale: Preserva a correspondência lexical de δόξα e sua possível ressonância, enquanto a nota registra o sentido contextual de esplendor visível.
theological_decisions:
- issue: Natureza da cena no monte durante a tentação
  choice: Narrar diretamente que o diabo leva Jesus ao monte e lhe mostra os reinos, sem explicar o modo da visão.
  alternative: Especificar que foi uma visão sobrenatural ou uma observação geográfica literal.
  rationale: O grego não define como todos os reinos foram mostrados; a tradução preserva essa ambiguidade sem impor uma explicação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os presentes históricos “leva” e “mostra” mantêm a vivacidade da narrativa grega. O pronome “lhe” evita repetição pesada sem criar ambiguidade.
