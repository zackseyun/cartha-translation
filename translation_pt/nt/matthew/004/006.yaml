id: MAT.4.6
reference: Matthew 4:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: pt
  text: 'E ele lhe disse: “Se você é o Filho de Deus, atire-se para baixo[a], pois está escrito: ‘Ele dará ordens aos seus anjos a seu respeito’ e ‘Eles o carregarão nas mãos[b], para que não bata o pé contra uma pedra.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais tradicionalmente: “lance-se para baixo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o erguerão nas mãos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: disse
  rationale: O presente grego funciona como presente histórico na narrativa; o pretérito perfeito é mais natural em português e preserva o sentido narrativo.
- source_word: Εἰ
  choice: Se
  rationale: Mantém a forma condicional e o caráter de desafio da fala, sem transformar a condição em afirmação.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: o Filho de Deus
  rationale: No contexto de Mateus, a expressão tem força titular e cristológica; o artigo em português é necessário para expressá-la naturalmente.
- source_word: βάλε σεαυτὸν κάτω
  choice: jogue-se para baixo
  rationale: Expressa de modo claro e atual o imperativo aoristo, o pronome reflexivo e o advérbio de direção.
- source_word: γέγραπται
  choice: está escrito
  rationale: Fórmula portuguesa consagrada para introduzir uma citação das Escrituras, preservando a força resultativa do perfeito grego.
- source_word: ἐντελεῖται
  choice: dará ordens
  rationale: Comunica a ideia de uma determinação autorizada e reproduz o valor futuro da forma grega.
- source_word: περὶ σοῦ
  choice: a seu respeito
  rationale: Representa diretamente περί com genitivo e evita ampliar a frase para uma promessa genérica de benefício.
- source_word: ἐπὶ χειρῶν
  choice: nas mãos
  rationale: É a formulação idiomática em português para a imagem de ser carregado e protegido pelas mãos dos anjos.
- source_word: ἀροῦσίν σε
  choice: o carregarão
  rationale: αἴρω pode significar levantar ou carregar; aqui, em combinação com ‘nas mãos’, ‘carregarão’ transmite naturalmente a imagem protetora.
- source_word: μήποτε προσκόψῃς
  choice: para que você não bata
  rationale: Expressa a prevenção indicada por μήποτε com o subjuntivo; προσκόπτω, neste contexto, descreve o pé chocando-se contra algo.
- source_word: πρὸς λίθον
  choice: numa pedra
  rationale: A contração ‘numa’ é natural em português e conserva o sentido indefinido do substantivo grego sem artigo.
- source_word: τὸν πόδα σου
  choice: o pé
  rationale: Mantém o singular do texto grego; o possuidor já fica claro pela construção com ‘você’.
theological_decisions:
- issue: Força cristológica de ‘Filho de Deus’ no desafio do tentador
  choice: Traduzir como o título ‘o Filho de Deus’
  alternative: Traduzir sem artigo como ‘Filho de Deus’ ou de modo genérico como ‘um filho de Deus’
  rationale: No contexto narrativo de Mateus, a expressão funciona como designação reconhecível de Jesus. A tradução preserva essa força sem acrescentar explicação doutrinária ao versículo.
- issue: Uso das Escrituras pelo tentador
  choice: Manter a citação como parte direta da fala, sem correção ou comentário no texto principal
  alternative: Acrescentar uma ressalva interpretativa à citação
  rationale: O texto apresenta o tentador citando as Escrituras. Inserir uma avaliação na tradução resolveria uma tensão narrativa que o original deixa para o contexto.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, sem vocabulário excessivamente tradicional. O tratamento por ‘você’ favorece clareza contemporânea. A estrutura paralela das duas partes da citação foi preservada, assim como o singular ‘pé’ e a força condicional de ‘Se’.
