id: MAT.4.15
reference: Matthew 4:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ, ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, Γαλιλαία τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: pt
  text: Terra de Zebulom e terra de Naftali, caminho do mar, além do Jordão, Galileia dos gentios[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Galileia das nações”.
    reason: Alternativa lexical para τῶν ἐθνῶν.
lexical_decisions:
- source_word: Γῆ / γῆ
  choice: Terra / terra
  rationale: Mantém o sentido geográfico e a repetição paralela do grego; a inicial maiúscula decorre apenas do início da citação.
- source_word: Ζαβουλὼν
  choice: Zebulom
  rationale: Forma consagrada e amplamente reconhecida em português para o nome tribal e territorial.
- source_word: Νεφθαλίμ
  choice: Naftali
  rationale: Forma bíblica corrente em português para o nome tribal e territorial.
- source_word: ὁδὸν θαλάσσης
  choice: caminho do mar
  rationale: Preserva a formulação concisa e a ambiguidade da citação profética, que pode indicar uma rota conhecida ou a região relacionada ao mar.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: além do Jordão
  rationale: Reproduz o idioma geográfico sem fixar de modo indevido o ponto de vista do observador.
- source_word: Γαλιλαία
  choice: Galileia
  rationale: Forma padrão do nome regional em português moderno.
- source_word: τῶν ἐθνῶν
  choice: dos gentios
  rationale: No contexto judaico de Mateus e da citação de Isaías, indica sobretudo povos não judeus; a alternativa lexical 'das nações' é registrada em nota.
theological_decisions:
- issue: Sentido de ἐθνῶν na citação de Isaías
  choice: gentios
  alternative: nações
  rationale: “Gentios” comunica a provável oposição etnorreligiosa entre judeus e não judeus no contexto de Mateus, sem eliminar a alternativa lexical mais ampla, preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura poética e formal apropriada a uma citação profética. Conserva-se o travessão final porque a citação continua no versículo seguinte.
