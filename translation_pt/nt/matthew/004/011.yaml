id: MAT.4.11
reference: Matthew 4:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε ἀφίησιν αὐτὸν ὁ διάβολος, καὶ ἰδοὺ ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: pt
  text: Então o diabo o deixou, e eis que anjos se aproximaram e o serviam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ministravam a ele”. O verbo grego pode significar “servir” ou “ministrar”; o tempo imperfeito sugere uma ação em curso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e direto em português.
- source_word: ἀφίησιν
  choice: deixou
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, mais natural na narrativa portuguesa; no contexto, o verbo indica que o diabo se afastou de Jesus.
- source_word: αὐτὸν
  choice: o
  rationale: Pronome objeto que retoma Jesus.
- source_word: ὁ διάβολος
  choice: o diabo
  rationale: No relato da tentação, διάβολος funciona como designação pessoal de Satanás; a tradução tradicional e clara evita a ambiguidade de uma versão puramente etimológica como 'o caluniador'.
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa que liga as ações seguintes.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva o marcador de atenção e a vivacidade repentina da cena, em registro digno e compreensível.
- source_word: ἄγγελοι
  choice: anjos
  rationale: O contexto indica seres celestiais, não mensageiros humanos.
- source_word: προσῆλθον
  choice: se aproximaram
  rationale: Expressa diretamente o movimento de chegar para perto de Jesus, preservando o valor do verbo grego.
- source_word: διηκόνουν
  choice: serviam
  rationale: O imperfeito retrata uma ação em curso; 'serviam' é claro, natural e mantém a amplitude do verbo, que também pode ser traduzido por 'ministravam'.
- source_word: αὐτῷ
  choice: o
  rationale: O dativo identifica Jesus como beneficiário do serviço; em português, o objeto direto com 'servir' é idiomático e claro.
theological_decisions:
- issue: Tradução de διάβολος como designação pessoal no relato da tentação
  choice: o diabo
  alternative: o caluniador
  rationale: Embora o termo tenha relação lexical com calúnia, aqui ele designa a personagem já identificada no relato. 'O diabo' mantém a referência clara sem acrescentar conteúdo doutrinário.
- issue: Natureza do serviço prestado pelos anjos
  choice: o serviam
  alternative: ministravam a ele
  rationale: O verbo grego não especifica exatamente a forma do cuidado. A tradução mantém essa generalidade e não define além do texto em que consistiu o serviço angelical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva-se “eis que” para representar a força discursiva de ἰδού; a ordem das orações acompanha a progressão do grego sem produzir uma construção artificial.
