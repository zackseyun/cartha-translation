  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: pt
  text: Eles imediatamente deixaram o barco e o pai deles e o seguiram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: '[sem equivalente explícito]'
  rationale: Aqui δέ é um conectivo narrativo leve. Em português, iniciar diretamente com «Eles» dá continuidade natural ao relato sem acrescentar contraste ou sequência mais fortes que o grego.
- source_word: εὐθέως
  choice: imediatamente
  rationale: Preserva a ideia enfática de prontidão e corresponde ao uso recorrente desse termo em Mateus, em linguagem clara e atual.
- source_word: ἀφέντες
  choice: deixaram
  rationale: O particípio aoristo indica ação anterior ao verbo principal. A coordenação «deixaram... e seguiram» expressa isso com naturalidade, sem a força excessiva de «abandonaram».
- source_word: τὸ πλοῖον
  choice: o barco
  rationale: No contexto da pesca no lago, «barco» é mais específico e natural que «navio».
- source_word: τὸν πατέρα αὐτῶν
  choice: o pai
  rationale: O sujeito plural já identifica os dois irmãos, tornando natural em português a construção «deixaram o barco e o pai». Evita a repetição algo pesada de «o pai deles», sem perder a relação familiar indicada pelo contexto imediato.
- source_word: ἠκολούθησαν αὐτῷ
  choice: o seguiram
  rationale: Traduz de modo idiomático tanto o movimento de ir após Jesus quanto a nuance de discipulado presente no contexto dos Evangelhos.
- source_word: οἱ
  choice: Eles
  rationale: O artigo substantivado retoma os dois irmãos mencionados anteriormente; o pronome explícito é claro e natural em português.
theological_decisions:
- issue: Resposta ao chamado e separação familiar
  choice: O versículo descreve diretamente a saída imediata do barco e do pai para seguir Jesus, sem definir a duração dessa separação.
  alternative: Traduzir ἀφέντες por «abandonaram», sugerindo de forma mais forte uma ruptura permanente.
  rationale: «Deixaram» mantém a decisão e o custo familiar destacados pela narrativa, mas não acrescenta ao verbo grego uma afirmação inequívoca de abandono definitivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem simples mantém o ritmo rápido da narrativa e a ênfase em «imediatamente».
