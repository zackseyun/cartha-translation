    text: 'Ou, em termos interpretativos: “escuridão profunda”. A expressão “sombra da morte” foi mantida porque o grego menciona explicitamente a morte e ecoa uma conhecida imagem bíblica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς
  choice: povo
  rationale: “Povo” é o equivalente coletivo mais natural e não restringe indevidamente o sentido a uma nação política ou a uma etnia.
- source_word: καθήμενος / καθημένοις
  choice: sentado / sentados
  rationale: Mantém a imagem concreta, o paralelismo e a ressonância da citação de Isaías; “habitava” seria possível, mas menos formalmente próximo.
- source_word: σκοτίᾳ
  choice: trevas
  rationale: “Trevas” é uma expressão bíblica corrente e preserva tanto o sentido concreto quanto o metafórico, sem definir sua natureza.
- source_word: φῶς εἶδεν μέγα
  choice: viu uma grande luz
  rationale: Reproduz naturalmente o aoristo como passado simples e conserva a força da manifestação luminosa.
- source_word: χώρᾳ
  choice: região
  rationale: Expressa o sentido geográfico sem sugerir um Estado-nação moderno.
- source_word: σκιᾷ θανάτου
  choice: sombra da morte
  rationale: Preserva explicitamente θανάτου, “morte”, bem como a conhecida imagem bíblica, sem substituí-la interpretativamente por “escuridão profunda”.
- source_word: ἀνέτειλεν
  choice: raiou
  rationale: Evoca naturalmente em português o surgimento da luz, como o nascer de um astro.
- source_word: αὐτοῖς
  choice: sobre os que estavam sentados
  rationale: Com “raiou”, a preposição “sobre” expressa de modo idiomático os destinatários; a repetição explicita o referente e mantém o paralelismo.
theological_decisions:
- issue: Natureza das imagens de trevas e luz
  choice: Manter as imagens sem definir as trevas como exclusivamente espirituais, morais, políticas ou existenciais, nem identificar explicitamente a luz nesta oração.
  alternative: Explicitar as trevas como pecado ou ignorância dos gentios e a luz como a revelação salvadora do Messias.
  rationale: A citação profética possui ampla carga teológica, mas esta oração grega não delimita o significado das metáforas. A tradução preserva essa abertura e tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, preservando o paralelismo e a imagem profética. O marcador [a] aparece no texto principal.
