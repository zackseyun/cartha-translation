  text: Ἀκούσας ⸀δὲ ὅτι Ἰωάννης παρεδόθη ἀνεχώρησεν εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/012.yaml
  text: When he heard that John had been handed over[a], he withdrew into Galilee.
translation:
  language: pt
  text: Quando ouviu que João tinha sido entregue[a], Jesus retirou-se para a Galileia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente neste contexto, «tinha sido preso».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: Quando ouviu
  rationale: O particípio aoristo tem valor temporal em relação ao verbo principal. A formulação é natural em português; o sujeito implícito é explicitado como Jesus na oração principal para evitar ambiguidade.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui δέ funciona como conectivo narrativo leve. Em português, a transição é comunicada naturalmente sem acrescentar «ora» ou «mas», que poderiam dar peso excessivo ao termo.
- source_word: Ἰωάννης
  choice: João
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: παρεδόθη
  choice: tinha sido entregue
  rationale: Preserva a amplitude de παραδίδωμι e a relação temporal anterior ao ato de Jesus, sem restringir o verbo, no texto principal, ao sentido contextual de prisão.
- source_word: ἀνεχώρησεν
  choice: retirou-se
  rationale: Expressa afastamento em resposta às circunstâncias sem sugerir necessariamente fuga ou medo.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: para a Galileia
  rationale: Representa de modo idiomático o movimento indicado por εἰς; «para» é mais natural em português moderno do que «para dentro da Galileia».
theological_decisions:
- issue: Sentido de παραδίδωμι em relação a João
  choice: tinha sido entregue
  alternative: tinha sido preso
  rationale: O verbo grego é mais amplo que um termo técnico para prisão e pode carregar, em Mateus, a ideia de alguém ser entregue ao poder de outros. O texto principal conserva essa amplitude, enquanto a nota registra a especificação contextual.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. «Galileia» segue a ortografia vigente sem acento. A explicitação de «Jesus» na oração principal esclarece o sujeito que o grego deixa implícito pelo contexto.
