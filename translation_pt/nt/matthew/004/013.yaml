base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: pt
  text: E, deixando Nazara[a], foi morar em Cafarnaum, junto ao mar, na região de Zebulom e Naftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, “Nazara”; muitas traduções trazem “Nazaré”.
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπὼν
  choice: deixando
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal; “deixando” é natural em português e preserva a ideia de partida.
- source_word: Ναζαρὰ
  choice: Nazar
  rationale: Representa em português a forma grega Ναζαρά deste versículo, em vez de substituí-la silenciosamente pela forma mais conhecida “Nazaré”.
- source_word: ἐλθὼν
  choice: foi
  rationale: No contexto de deixar Nazar e mudar-se para Cafarnaum, “foi” expressa de modo idiomático o deslocamento sequencial indicado pelo particípio aoristo.
- source_word: κατῴκησεν
  choice: passou a morar
  rationale: Comunica que Jesus estabeleceu residência ali, e não apenas que permaneceu temporariamente no local.
- source_word: Καφαρναοὺμ
  choice: Cafarnaum
  rationale: Forma portuguesa tradicional e amplamente reconhecida do topônimo.
- source_word: τὴν παραθαλασσίαν
  choice: junto ao mar
  rationale: Expressa de maneira clara e natural a localização de Cafarnaum à margem do mar, sem sugerir necessariamente um litoral oceânico.
- source_word: ἐν ὁρίοις
  choice: na região de
  rationale: ὅρια pode designar limites, território ou distrito; neste contexto, “região” comunica naturalmente a área associada às duas tribos.
- source_word: Ζαβουλὼν
  choice: Zebulom
  rationale: Forma portuguesa bíblica corrente do nome tribal e geográfico.
- source_word: Νεφθαλίμ
  choice: Naftali
  rationale: Forma portuguesa bíblica corrente do nome tribal e geográfico.
