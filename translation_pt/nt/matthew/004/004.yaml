id: MAT.4.4
reference: Matthew 4:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Γέγραπται· Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ἄνθρωπος, ἀλλ’ ⸀ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: pt
  text: 'Mas ele respondeu: “Está escrito: ‘O homem[a] não viverá somente de pão, mas de toda palavra que procede pela boca de Deus[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o ser humano”. O grego emprega uma forma masculina singular com sentido representativo, referindo-se aos seres humanos em geral.
    reason: lexical_alternative
  - marker: b
    text: Muitas traduções dizem “da boca de Deus”. O grego traz literalmente a ideia de “pela boca de Deus”, preservando a imagem de cada palavra proferida por Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: respondeu
  rationale: A expressão narrativa, influenciada pelo uso semítico, significa literalmente “tendo respondido, disse”; “respondeu” comunica o sentido com naturalidade e sem redundância desnecessária.
- source_word: Γέγραπται
  choice: Está escrito
  rationale: Fórmula consagrada para introduzir uma citação das Escrituras; o presente de estado em português reflete adequadamente o resultado duradouro expresso pelo perfeito grego.
- source_word: ἄρτῳ μόνῳ
  choice: somente de pão
  rationale: Mantém o sentido lexical concreto de ἄρτος e expressa naturalmente em português a ideia restritiva de μόνος.
- source_word: ζήσεται
  choice: viverá
  rationale: O futuro grego é vertido pelo futuro simples, preservando a forma declarativa da citação.
- source_word: ὁ ἄνθρωπος
  choice: O homem
  rationale: Aqui o singular masculino tem força representativa e se refere ao ser humano em geral; “o homem” conserva a forma da expressão bíblica, e a nota esclarece seu alcance inclusivo.
- source_word: παντὶ ῥήματι
  choice: toda palavra
  rationale: ῥῆμα designa aqui aquilo que Deus profere; “palavra” é natural, tradicional e semanticamente adequada.
- source_word: ἐκπορευομένῳ
  choice: que procede
  rationale: A oração relativa reproduz com clareza o particípio que caracteriza a palavra como proveniente da fala divina.
- source_word: διὰ στόματος θεοῦ
  choice: pela boca de Deus
  rationale: “Pela” preserva o valor de διά com o genitivo e a imagem de a palavra passar pela boca de Deus, sem substituir silenciosamente a preposição por uma formulação apenas de origem.
theological_decisions:
- issue: Sentido genérico de ὁ ἄνθρωπος
  choice: O homem
  alternative: O ser humano; a pessoa
  rationale: A declaração diz respeito à humanidade em geral, não apenas a um indivíduo masculino. A forma representativa foi mantida no texto e seu alcance foi explicitado em nota, sem restringir nem ampliar a afirmação.
- issue: Força da fórmula Γέγραπται
  choice: Está escrito
  alternative: Ficou escrito
  rationale: A fórmula convencional preserva a apresentação da citação como texto escrito de validade contínua, sem acrescentar uma interpretação doutrinária.
- issue: Imagem de διὰ στόματος θεοῦ
  choice: pela boca de Deus
  alternative: da boca de Deus
  rationale: A escolha conserva o valor mediador de διά e a metáfora da fala divina, embora a alternativa com “da” seja mais familiar em português.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A redação mantém a fórmula bíblica tradicional “Está escrito” e o termo concreto “pão”, ao mesmo tempo que esclarece em nota o sentido genérico de “o homem”. A expressão “pela boca de Deus” é deliberadamente mais formal para conservar a construção e a imagem do grego.
