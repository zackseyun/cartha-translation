  text: καὶ νηστεύσας ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα ὕστερον ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/002.yaml
  text: And after fasting forty days and forty nights[a], he was hungry.
translation:
  language: pt
  text: E, depois de jejuar quarenta dias e quarenta noites, teve fome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Tendo jejuado quarenta dias e quarenta noites, depois teve fome».'
    reason: Alternativa mais formal que mantém ὕστερον como advérbio separado e reproduz mais de perto a sequência do grego.
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a ligação narrativa simples de καί sem acrescentar uma nuance temporal mais específica.
- source_word: νηστεύσας
  choice: depois de jejuar
  rationale: O particípio aoristo expressa naturalmente uma ação anterior à do verbo principal; a formulação é clara e idiomática em português.
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: quarenta dias e quarenta noites
  rationale: O acusativo indica extensão de tempo. Em português, a duração fica clara sem a preposição «por» e conserva a cadência bíblica tradicional.
- source_word: ὕστερον
  choice: depois
  rationale: Marca o momento posterior ao jejum. Foi integrado à oração participial para evitar a repetição pouco natural de «depois» e «depois disso» no texto principal.
- source_word: ἐπείνασεν
  choice: teve fome
  rationale: Expressão natural e digna em português para a experiência real da fome; também pode representar o surgimento desse estado no contexto.
theological_decisions:
- issue: Ênfase narrativa na necessidade humana real de Jesus após o jejum
  choice: teve fome
  alternative: ficou com fome
  rationale: «Teve fome» comunica claramente a fome real de Jesus sem transformar a tradução em formulação doutrinária nem acentuar além do necessário o início do estado.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção evita arcaísmos; a nota preserva a possibilidade de representar separadamente o particípio νηστεύσας e o advérbio ὕστερον.
