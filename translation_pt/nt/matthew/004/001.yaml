id: MAT.4.1
reference: Matthew 4:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: pt
  text: Então Jesus foi conduzido pelo Espírito ao deserto, para ser tentado pelo diabo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para ser posto à prova”; o verbo grego pode significar tanto “tentar” como “pôr à prova”, embora o contexto imediato favoreça “ser tentado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Conector temporal natural que apresenta o acontecimento seguinte na sequência narrativa.
- source_word: ἀνήχθη
  choice: foi conduzido
  rationale: Preserva a voz passiva e expressa de modo natural em português que o Espírito guiou Jesus; a nuance direcional de subida não precisa ser explicitada, pois soaria pouco idiomática neste contexto.
- source_word: εἰς τὴν ἔρημον
  choice: ao deserto
  rationale: ἔρημος designa uma região desabitada ou erma; “deserto” é claro, tradicional e apropriado ao cenário da narrativa.
- source_word: ὑπὸ τοῦ πνεύματος
  choice: pelo Espírito
  rationale: O artigo e o contexto imediato do batismo identificam o referente como o Espírito de Deus; a inicial maiúscula sinaliza essa referência sem acrescentar “Santo” ao texto grego.
- source_word: πειρασθῆναι
  choice: para ser tentado
  rationale: Embora o verbo possa significar tanto testar como tentar, a atuação do diabo no contexto imediato favorece “tentado”; a outra possibilidade é preservada em nota.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: pelo diabo
  rationale: Neste contexto, διάβολος funciona como título do adversário pessoal; “diabo” é a tradução corrente e clara em português.
theological_decisions:
- issue: Identificação de τοῦ πνεύματος
  choice: “o Espírito” refere-se ao Espírito de Deus
  alternative: um espírito ou o espírito humano
  rationale: O contexto imediatamente anterior, no qual o Espírito desce sobre Jesus em seu batismo, sustenta claramente essa identificação, sem necessidade de acrescentar “Santo” ao texto principal.
- issue: Sentido de πειρασθῆναι
  choice: “ser tentado”
  alternative: “ser posto à prova”
  rationale: O agente é o diabo, e os versículos seguintes descrevem incitações ao mal; ainda assim, o campo semântico grego inclui a ideia de pôr à prova, preservada na nota para não eliminar a tensão lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Foi conduzido” evita a rigidez de “foi levado para cima”, e “ao deserto” mantém a formulação concisa e natural.
