  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: pt
  text: Ele percorria toda a Galileia, ensinando nas sinagogas deles, proclamando as boas-novas do reino[a] e curando toda doença e toda enfermidade entre o povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o evangelho do reino”.'
    reason: Alternativa lexical tradicional para εὐαγγέλιον.
lexical_decisions:
- source_word: περιῆγεν
  choice: percorria
  rationale: O imperfeito retrata uma atividade itinerante contínua; “percorria” expressa com naturalidade tanto o movimento como sua extensão pela região.
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: toda a Galileia
  rationale: Com um verbo de movimento, a expressão indica percurso por toda a região; em português, “percorria toda a Galileia” comunica esse sentido distributivo sem exigir a tradução literal de ἐν.
- source_word: διδάσκων
  choice: ensinando
  rationale: O particípio presente indica uma ação contemporânea ao verbo principal e é reproduzido naturalmente pelo gerúndio.
- source_word: συναγωγαῖς αὐτῶν
  choice: sinagogas deles
  rationale: “Sinagogas” mantém a referência histórica judaica, e “deles” preserva o possessivo explícito αὐτῶν, referido às comunidades da Galileia.
- source_word: κηρύσσων
  choice: proclamando
  rationale: O verbo designa anúncio público e autorizado; “proclamando” conserva essa força e permanece claro no português atual.
- source_word: τὸ εὐαγγέλιον
  choice: as boas-novas
  rationale: A expressão traduz diretamente o sentido lexical de uma notícia boa e evita depender do termo eclesiástico tradicional; “evangelho” é registrado em nota como alternativa.
- source_word: τῆς βασιλείας
  choice: do Reino
  rationale: O genitivo é mantido de modo conciso, sem decidir de forma excessiva entre boas-novas pertencentes ao Reino e boas-novas a respeito dele.
- source_word: θεραπεύων
  choice: curando
  rationale: No contexto, o verbo denota a restauração efetiva da saúde; “curando” é natural e preciso.
- source_word: πᾶσαν νόσον
  choice: toda doença
  rationale: A tradução preserva o primeiro πᾶσαν e usa “doença” para manter alguma distinção em relação ao substantivo seguinte.
- source_word: πᾶσαν μαλακίαν
  choice: toda enfermidade
  rationale: “Enfermidade” abrange debilidade ou padecimento físico e conserva, junto de “doença”, a dupla formulação enfática do grego.
- source_word: ἐν τῷ λαῷ
  choice: entre o povo
  rationale: A expressão indica o âmbito humano em que as curas aconteciam; “entre o povo” é idiomático e não acrescenta uma especificação ausente do texto.
theological_decisions:
- issue: Tradução de εὐαγγέλιον
  choice: as boas-novas
  alternative: o evangelho
  rationale: “Boas-novas” torna transparente o sentido lexical sem alterar o conteúdo teológico; a forma tradicional é preservada em nota.
- issue: Relação de τῆς βασιλείας com εὐαγγέλιον
  choice: do Reino
  alternative: a respeito do Reino
  rationale: A construção com “do” preserva a concisão e a amplitude do genitivo grego, evitando restringi-lo apenas ao conteúdo da proclamação.
- issue: Extensão das curas em πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: toda doença e toda enfermidade
  alternative: todo tipo de doença e enfermidade
  rationale: A repetição de “toda” corresponde aos dois usos de πᾶσαν e mantém a ênfase abrangente do texto sem formular uma explicação adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperfeito “percorria” conserva o caráter contínuo da ação, e os gerúndios reproduzem as ações simultâneas. A inicial maiúscula em “Reino” favorece a identificação do referente teológico sem acrescentar conteúdo ao substantivo grego.
