id: MAT.4.5
reference: Matthew 4:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τότε παραλαμβάνει αὐτὸν ὁ διάβολος εἰς τὴν ἁγίαν πόλιν, καὶ ⸀ἔστησεν αὐτὸν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/005.yaml
  text: Then the devil takes him into the holy city and sets him on the pinnacle of the temple[b][a],
translation:
  language: pt
  text: Então o diabo o leva à cidade santa[a] e o coloca no pináculo do templo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, Jerusalém.
    reason: cross_reference
  - marker: b
    text: Ou «na ala do templo»; o grego pode se referir a uma extremidade saliente ou a um ponto elevado do complexo do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca de modo natural a sequência temporal da narrativa.
- source_word: παραλαμβάνει
  choice: leva
  rationale: O presente histórico dá vivacidade à narrativa; neste contexto, «leva» expressa naturalmente o deslocamento de Jesus com o diabo.
- source_word: ὁ διάβολος
  choice: o diabo
  rationale: Aqui διάβολος funciona como designação pessoal e «o diabo» é a tradução portuguesa estabelecida.
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: à cidade santa
  rationale: Expressa o movimento até a cidade e conserva a designação grega sem substituí-la no texto principal por «Jerusalém».
- source_word: ἔστησεν
  choice: o coloca
  rationale: 'O aoristo de ἵστημι é transitivo e causativo neste contexto: o diabo faz Jesus ficar de pé em determinado lugar. «Coloca» comunica isso com naturalidade.'
- source_word: ἐπὶ τὸ πτερύγιον
  choice: no pináculo
  rationale: πτερύγιον pode indicar uma extremidade saliente ou elevada. «Pináculo» conserva a tradução tradicional e plausível, enquanto a incerteza arquitetônica é registrada em nota.
- source_word: τοῦ ἱεροῦ
  choice: do templo
  rationale: ἱερόν designa o conjunto do templo, não especificamente o santuário interior; «templo» é natural no texto, e seu sentido amplo é esclarecido na nota.
theological_decisions:
- issue: Identificação da «cidade santa»
  choice: Manter «cidade santa» no texto principal.
  alternative: Jerusalém
  rationale: O grego emprega a designação honorífica, não o nome próprio. A nota identifica a cidade sem apagar a formulação original.
- issue: Sentido de πτερύγιον τοῦ ἱεροῦ
  choice: Traduzir por «pináculo do templo».
  alternative: «ala do templo» ou «ponto mais alto do complexo do templo»
  rationale: A localização arquitetônica exata é incerta. A opção tradicional permanece plausível, e a nota preserva transparentemente as alternativas.
translation_notes:
  register: Português moderno, claro e digno, com presente histórico para preservar a vivacidade narrativa. «À cidade santa» tem leitura natural ampla, e «complexo do templo» aparece apenas na nota para explicitar o alcance de ἱερόν.
