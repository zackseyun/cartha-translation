  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: pt
  text: 'Desde então, Jesus começou a proclamar, dizendo: “Arrependam-se, pois o Reino dos céus[b] aproximou-se[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “está próximo”. O perfeito grego indica uma aproximação já ocorrida, com efeito presente.'
    reason: lexical_alternative
  - marker: b
    text: 'A expressão grega está no plural: “o Reino dos céus”. Mateus usa com frequência essa expressão, enquanto outras passagens muitas vezes dizem “o Reino de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Desde então
  rationale: Marca uma transição narrativa e sugere a continuidade da atividade iniciada nesse momento, em português natural.
- source_word: ἤρξατο
  choice: começou
  rationale: Equivalente direto e corrente para o início da ação expressa pelo infinitivo.
- source_word: κηρύσσειν καὶ λέγειν
  choice: começou a proclamar
  rationale: Em português, a fala citada explicita naturalmente o conteúdo da proclamação; evita a formulação redundante “proclamar e dizer” sem perder informação relevante.
- source_word: Μετανοεῖτε
  choice: Arrependam-se
  rationale: Preserva o chamado a uma mudança profunda de mente, orientação e vida, sem reduzi-lo a mera reconsideração intelectual.
- source_word: ἤγγικεν
  choice: está próximo
  rationale: Expressão idiomática que comunica o estado presente de proximidade resultante indicado pelo perfeito grego; a alternativa mais aspectualmente explícita é registrada em nota.
- source_word: βασιλεία
  choice: Reino
  rationale: Termo reconhecível e abrangente, capaz de incluir tanto o governo real quanto o domínio de Deus no contexto.
- source_word: τῶν οὐρανῶν
  choice: dos céus
  rationale: Mantém o plural característico da expressão de Mateus e soa natural na tradição e no uso bíblico em português.
theological_decisions:
- issue: Sentido de Μετανοεῖτε
  choice: Arrependam-se
  alternative: Mudem de atitude; convertam-se
  rationale: “Arrependam-se” conserva o peso moral e espiritual do imperativo, sem restringi-lo a emoção de remorso nem impor uma formulação denominacional.
- issue: Forma de βασιλεία τῶν οὐρανῶν
  choice: o Reino dos céus
  alternative: o reinado dos céus; o Reino do céu
  rationale: Preserva a expressão distintiva de Mateus e sua abertura semântica entre governo e domínio, mantendo também o plural do grego.
- issue: Aspecto de ἤγγικεν
  choice: está próximo
  alternative: aproximou-se; chegou perto
  rationale: A formulação principal é clara e idiomática; a nota preserva a nuance do perfeito, segundo a qual essa proximidade chegou e continua vigente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A estrutura foi tornada idiomática sem enfraquecer a proclamação pública nem resolver indevidamente a amplitude teológica de “Reino”. Todos os marcadores de nota aparecem no texto principal.
