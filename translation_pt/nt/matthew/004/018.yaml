  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν δύο ἀδελφούς, Σίμωνα τὸν λεγόμενον Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ, βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: pt
  text: 'Enquanto caminhava à beira do mar da Galileia, viu dois irmãos: Simão, chamado Pedro, e André, irmão dele. Eles lançavam uma rede[a] ao mar, pois eram pescadores.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma rede de arremesso”; o termo grego se refere a uma rede lançada para pescar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περιπατῶν
  choice: Enquanto caminhava
  rationale: O particípio presente indica uma ação em andamento e contemporânea ao verbo principal; a oração temporal soa natural em português.
- source_word: παρὰ τὴν θάλασσαν
  choice: à beira do mar
  rationale: παρά com acusativo expressa aqui movimento ao longo ou junto de um lugar; «à beira» comunica isso com clareza.
- source_word: θάλασσαν τῆς Γαλιλαίας
  choice: mar da Galileia
  rationale: Mantém a designação geográfica tradicional e reflete diretamente o substantivo grego θάλασσα.
- source_word: εἶδεν
  choice: viu
  rationale: O aoristo de ὁράω apresenta o acontecimento de modo simples na narrativa.
- source_word: δύο ἀδελφούς
  choice: dois irmãos
  rationale: O contexto identifica dois parentes do sexo masculino, Simão e André.
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: Simão, chamado Pedro
  rationale: Reproduz de forma concisa e natural a expressão participial que informa o nome pelo qual Simão era chamado.
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: André, irmão dele
  rationale: A expressão apositiva identifica André por sua relação com Simão; «dele» evita a possível leitura de que ambos seriam irmãos de uma terceira pessoa.
- source_word: βάλλοντας
  choice: Eles lançavam
  rationale: O particípio presente descreve a ação em andamento quando os irmãos foram vistos. Uma nova oração melhora a fluidez sem alterar a relação temporal.
- source_word: ἀμφίβληστρον
  choice: uma rede
  rationale: O termo designa especificamente uma rede lançada para pescar; a tradução geral mantém a leitura simples, e a especificidade é registrada em nota.
- source_word: εἰς τὴν θάλασσαν
  choice: ao mar
  rationale: Em português, «lançar uma rede ao mar» expressa naturalmente o movimento indicado por εἰς sem sugerir mera localização.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: pois eram pescadores
  rationale: «Pois» preserva a função explicativa de γάρ, e «pescadores» corresponde ao referente masculino plural neste contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A divisão em duas frases reduz o acúmulo de orações e mantém a sequência narrativa e a simultaneidade das ações. O marcador da nota foi colocado junto de «rede», termo ao qual a nota lexical efetivamente se refere.
