id: MAT.4.3
reference: Matthew 4:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ⸂ὁ πειράζων εἶπεν αὐτῷ⸃· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ ἵνα οἱ λίθοι οὗτοι ἄρτοι γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: pt
  text: 'Então o tentador se aproximou e lhe disse: “Se você é o Filho de Deus[a], mande que estas pedras se tornem pães.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Já que você é o Filho de Deus”. A condição grega pode funcionar como um desafio, sem necessariamente expressar dúvida.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν
  choice: se aproximou
  rationale: O particípio aoristo de προσέρχομαι indica movimento em direção a Jesus antes do verbo principal; “se aproximou” é natural e preserva explicitamente esse movimento.
- source_word: ὁ πειράζων
  choice: o tentador
  rationale: O particípio presente substantivado designa aquele que tenta; “o tentador” é claro, corrente e adequado ao contexto narrativo.
- source_word: εἶπεν αὐτῷ
  choice: lhe disse
  rationale: Forma portuguesa natural e fiel para o verbo de fala com objeto indireto.
- source_word: Εἰ
  choice: Se
  rationale: Mantém a forma condicional grega e não decide se há dúvida, desafio ou pressuposição retórica.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: o Filho de Deus
  rationale: Apesar de υἱός não ter artigo, sua posição predicativa e o contexto de Mateus indicam o título definido, não uma filiação genérica.
- source_word: εἰπὲ ἵνα
  choice: mande que
  rationale: No contexto, o imperativo de λέγω seguido de ἵνα expressa uma ordem verbal eficaz. “Mande que” comunica isso naturalmente sem explicitar um mecanismo além do texto.
- source_word: οἱ λίθοι οὗτοι
  choice: estas pedras
  rationale: Preserva o substantivo e a força demonstrativa da expressão grega.
- source_word: ἄρτοι
  choice: pães
  rationale: O plural concreto do grego é natural em português como “pães” e preserva o número, ao contrário do inglês idiomático “bread”.
- source_word: γένωνται
  choice: se tornem
  rationale: Tradução direta e idiomática do aoristo subjuntivo de γίνομαι, preservando a ideia de mudança de estado.
theological_decisions:
- issue: Força da oração condicional Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: “Se você é o Filho de Deus”
  alternative: “Já que você é o Filho de Deus” ou “Se de fato você é o Filho de Deus”
  rationale: A formulação simples com “Se” preserva a ambiguidade entre condição, pressuposição e desafio retórico, sem atribuir ao tentador uma dúvida ou concessão não explicitada.
- issue: Título cristológico υἱὸς τοῦ θεοῦ
  choice: “o Filho de Deus”
  alternative: “um filho de Deus”
  rationale: A construção predicativa e o contexto de Mateus apresentam uma identificação titular e singular de Jesus; a tradução definida preserva essa referência sem ampliá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “você” para fala direta natural e “pães” para conservar o plural grego. O marcador [a] aparece imediatamente após a oração cuja nuance explica.
