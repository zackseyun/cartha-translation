  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: pt
  text: 'para que se cumprisse o que foi dito por meio do profeta Isaías:

    '
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade ou o resultado do acontecimento narrado. «Para que» é natural em português e preserva a força teleológica da construção.
- source_word: πληρωθῇ
  choice: se cumprisse
  rationale: O aoristo passivo do subjuntivo de πληρόω, em oração com ἵνα, é expresso idiomaticamente pelo imperfeito do subjuntivo pronominal, preservando a voz passiva e a linguagem característica de cumprimento das Escrituras em Mateus.
- source_word: τὸ ῥηθὲν
  choice: o que foi dito
  rationale: O artigo neutro com o particípio passivo tem função substantivada. «O que foi dito» traduz a expressão com clareza e naturalidade.
- source_word: διὰ
  choice: por meio de
  rationale: Com o genitivo, διά apresenta Isaías como mediador da mensagem profética. «Por meio de» torna essa mediação explícita sem acrescentar uma interpretação.
- source_word: Ἠσαΐου
  choice: Isaías
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome do profeta.
- source_word: τοῦ προφήτου
  choice: do profeta
  rationale: Mantém a identificação explícita da função de Isaías, importante na fórmula mateana de cumprimento.
- source_word: λέγοντος
  choice: ':'
  rationale: O particípio introduz a citação que vem a seguir. Em português corrente, os dois-pontos desempenham essa função de modo mais natural do que o calque «dizendo», sem perda de conteúdo proposicional.
theological_decisions:
- issue: Fórmula de cumprimento em Mateus
  choice: Traduzir πληρωθῇ por «se cumprisse» e conservar explicitamente o motivo do cumprimento.
  alternative: Traduzir de modo mais dinâmico como «se tornasse realidade».
  rationale: «Cumprir-se» preserva a ligação deliberada de Mateus com as Escrituras e sua linguagem teológica, sem explicar além do que o texto afirma.
- issue: Mediação profética
  choice: Traduzir διὰ Ἠσαΐου por «por meio do profeta Isaías».
  alternative: Traduzir por «pelo profeta Isaías».
  rationale: «Por meio de» conserva mais claramente a ideia de mediação, sem definir de maneira adicional quem é o agente último da fala.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem foi ajustada para «profeta Isaías», natural em português. O particípio λέγοντος foi representado funcionalmente pelos dois-pontos, evitando o pouco natural «dizendo» no fim da fórmula.
