  text: καὶ λέγει αὐτοῖς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: pt
  text: 'E ele lhes diz: “Venham após mim, e eu farei de vocês pescadores de gente[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pescadores de pessoas”. Tradicionalmente, “pescadores de homens”; aqui, o grego se refere aos seres humanos em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico grego, recurso narrativo comum nos Evangelhos e compreensível em português.
- source_word: Δεῦτε
  choice: Venham
  rationale: Reproduz diretamente o chamado imperativo dirigido a mais de uma pessoa, sem antecipar por si só a ideia expressa por ὀπίσω μου.
- source_word: ὀπίσω μου
  choice: após mim
  rationale: Preserva a imagem de ir atrás de Jesus e sua força discipular, mantendo-a distinta do imperativo “Venham”.
- source_word: ποιήσω
  choice: eu farei de vocês
  rationale: Expressa a ação futura e transformadora prometida por Jesus; a construção “fazer de alguém” é natural em português neste complemento predicativo.
- source_word: ἁλιεῖς
  choice: pescadores
  rationale: É o equivalente lexical direto e conserva a metáfora da pesca.
- source_word: ἀνθρώπων
  choice: de gente
  rationale: Neste contexto, ἄνθρωπος designa seres humanos em geral, não somente pessoas do sexo masculino. “Gente” comunica esse alcance genérico de modo natural e corrente em português.
theological_decisions:
- issue: Alcance humano genérico de ἁλιεῖς ἀνθρώπων
  choice: pescadores de gente
  alternative: pescadores de homens; pescadores de pessoas
  rationale: O plural ἀνθρώπων refere-se genericamente a seres humanos. “De gente” preserva esse sentido sem restringi-lo aos homens; a formulação tradicional é registrada em nota para transparência lexical e histórica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Após mim” conserva a imagem do texto grego sem transformar toda a expressão simplesmente em “Sigam-me”; “pescadores de gente” mantém a metáfora e comunica naturalmente o sentido humano genérico.
