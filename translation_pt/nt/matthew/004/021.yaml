review_pass:
  verdict: revise
  source_fidelity: 'O sentido central é preservado: Jesus vê Tiago e João no barco com Zebedeu enquanto consertam redes e os chama. Contudo, a transformação de «no barco ... consertando» em uma oração independente («Eles estavam...») é desnecessária e enfraquece a ligação sintática direta dos particípios gregos com os dois irmãos. A expressão «seguindo adiante dali» também soa pouco idiomática.'
  naturalness: A redação é compreensível, mas «seguindo adiante dali» é uma sequência pesada em português. A construção revista é mais fluente e mantém o período narrativo sem introduzir uma frase independente não exigida pelo original.
  terminology: «Tiago», «João», «Zebedeu», «barco», «consertando as redes» e «chamou» são escolhas adequadas. «Pai deles» evita a possível leitura de que Zebedeu seja pai apenas de João.
  issues:
  - severity: low
    issue: «seguindo adiante dali» é pouco natural em português moderno.
    rationale: Embora reflita os dois elementos gregos προβὰς e ἐκεῖθεν, a ordem produz uma formulação rígida. «Indo mais adiante» comunica idiomaticamente o prosseguimento a partir do local anterior.
  - severity: low
    issue: A frase independente «Eles estavam no barco...» não é necessária.
    rationale: No grego, «no barco», «com Zebedeu» e «consertando as redes» caracterizam diretamente Tiago e João. Mantê-los na mesma oração preserva melhor essa relação e evita acrescentar uma transição discursiva.
  - severity: low
    issue: «Zebedeu, seu pai» pode ter escopo pronominal momentaneamente singular.
    rationale: O grego diz explicitamente «o pai deles». «Zebedeu, pai deles» conserva essa referência plural de modo claro.
  revised_text: 'E, indo mais adiante, viu outros dois irmãos: Tiago, filho de Zebedeu, e João, irmão dele, no barco com Zebedeu, pai deles, consertando as redes deles; e os chamou.'
