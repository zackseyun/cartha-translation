  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: pt
  text: 'E, indo mais adiante, viu outros dois irmãos: Tiago, filho de Zebedeu, e João, irmão dele, no barco com Zebedeu, pai deles, consertando as redes deles; e os chamou.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: seguindo adiante dali
  rationale: Expressa o avanço a partir do lugar anterior e conserva o valor circunstancial do particípio aoristo em português natural.
- source_word: εἶδεν
  choice: viu
  rationale: Mantém o sentido narrativo simples de ὁράω, sem intensificá-lo para “notou” ou expressão semelhante.
- source_word: ἄλλους δύο ἀδελφούς
  choice: outros dois irmãos
  rationale: Preserva tanto o número quanto a ideia de que essa dupla se soma aos irmãos mencionados anteriormente.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Tiago, filho de Zebedeu
  rationale: Usa a forma tradicional portuguesa do nome e explicita de modo idiomático a relação filial indicada pelo genitivo grego.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: João, irmão dele
  rationale: Identifica João como irmão de Tiago sem deixar ambíguo, em português, o referente do pronome.
- source_word: ἐν τῷ πλοίῳ
  choice: no barco
  rationale: No contexto da pesca, “barco” é mais preciso e corrente do que “navio”.
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: com Zebedeu, seu pai
  rationale: Traduz a ideia de companhia e conserva o destaque dado primeiro ao nome de Zebedeu, com uma aposição natural em português.
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: consertando as redes
  rationale: No contexto pesqueiro, καταρτίζω descreve pôr as redes novamente em boas condições; “consertando” comunica isso com clareza.
- source_word: ἐκάλεσεν αὐτούς
  choice: Jesus os chamou
  rationale: “Chamou” preserva a formulação simples e o motivo do chamado no Evangelho. O sujeito “Jesus”, implícito no grego, é explicitado após a divisão do longo período para evitar que o leitor o confunda com Zebedeu.
theological_decisions:
- issue: Implicação de discipulado em ἐκάλεσεν
  choice: Jesus os chamou
  alternative: Jesus os chamou para segui-lo
  rationale: O contexto indica um chamado ao discipulado, mas o versículo diz apenas que ele os chamou. A tradução não acrescenta o complemento interpretativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O longo período grego foi dividido em duas frases para clareza; o sujeito “Jesus” foi explicitado na segunda frase, pois “ele” poderia parecer referir-se a Zebedeu. Não são necessárias notas de rodapé.
