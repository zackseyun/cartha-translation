revisions:
- from: 'E, seguindo adiante dali, viu outros dois irmãos: Tiago, filho de Zebedeu, e João, irmão dele. Eles estavam no barco com Zebedeu, seu pai, consertando as redes; e Jesus os chamou.'
  to: 'E, indo mais adiante, viu outros dois irmãos: Tiago, filho de Zebedeu, e João, irmão dele, no barco com Zebedeu, pai deles, consertando as redes deles; e os chamou.'
  rationale: A revisão melhora a fluência de abertura, preserva a caracterização contínua dos dois irmãos no barco e torna explícita, sem acréscimo interpretativo, a referência plural de «pai deles». «Os chamou» mantém o sujeito narrativo já estabelecido e não amplia o chamado para «para segui-lo».
