  source_fidelity: O sentido é globalmente fiel, mas «deixando» (particípio presente em português) pode sugerir ação simultânea ou em curso, enquanto o particípio aoristo ἀφέντες apresenta o deixar as redes como ação anterior ao seguimento. Uma coordenação verbal exprime essa sequência com maior clareza.
  naturalness: «E eles, deixando imediatamente as redes, o seguiram» é compreensível, porém a construção participial soa mais literária e é ligeiramente menos direta em português moderno. A coordenação é mais fluente e clara para leitores internacionais, inclusive brasileiros.
  terminology: «Redes» corresponde adequadamente a δίκτυα no contexto; «o seguiram» é uma formulação correta e digna que preserva a amplitude de ἠκολούθησαν αὐτῷ, sem explicitar indevidamente uma interpretação de discipulado.
