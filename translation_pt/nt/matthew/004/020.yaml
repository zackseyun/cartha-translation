    rationale: O gerúndio português pode comunicar simultaneidade, ao passo que ἀφέντες é um particípio aoristo cuja ação é antecedente à de «seguiram». «Imediatamente deixaram ... e o seguiram» preserva melhor a sequência narrativa.
