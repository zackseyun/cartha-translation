  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: pt
  text: E eles imediatamente deixaram as redes e o seguiram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ é um conectivo leve que faz a narrativa avançar. “E” preserva a coordenação simples sem introduzir um contraste indevido.
- source_word: εὐθέως
  choice: imediatamente
  rationale: εὐθέως ressalta a prontidão da resposta; “imediatamente” reproduz sua força de modo claro e corrente.
- source_word: ἀφέντες
  choice: deixando
  rationale: O particípio aoristo indica uma ação ligada e logicamente anterior ao verbo principal. A construção “deixando imediatamente as redes, o seguiram” é natural em português e mantém a relação entre as ações sem reforçar o sentido para “abandonando”.
- source_word: τὰ δίκτυα
  choice: as redes
  rationale: No contexto, δίκτυα são redes de pesca. “As redes” corresponde ao artigo grego e basta para a compreensão, sem acrescentar “suas” ou “de pesca”.
- source_word: ἠκολούθησαν αὐτῷ
  choice: o seguiram
  rationale: ἀκολουθέω com o dativo significa seguir alguém. “O seguiram” preserva tanto o movimento literal quanto a nuance emergente de discipulado.
theological_decisions:
- issue: Nuance de discipulado em ἠκολούθησαν αὐτῷ
  choice: o seguiram
  alternative: foram atrás dele
  rationale: O verbo pode indicar tanto seguir fisicamente quanto vincular-se a alguém como discípulo no contexto dos Evangelhos. “O seguiram” mantém essa amplitude narrativa e teológica sem explicitar mais do que o texto afirma.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi ajustada de modo idiomático, preservando a sequência imediata entre deixar as redes e seguir Jesus.
