  text: καὶ ⸀εἶπεν αὐτῷ· Ταῦτά ⸂σοι πάντα⸃ δώσω, ἐὰν πεσὼν προσκυνήσῃς μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/009.yaml
  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: pt
  text: 'E lhe disse: “Eu lhe darei todas estas coisas, se você se prostrar e me adorar.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se curvar diante de mim” ou “me prestar homenagem”. O verbo grego pode indicar prostração ou homenagem, mas, neste contexto, “adorar” parece ser o sentido mais adequado.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a coordenação simples e o fluxo narrativo sem acrescentar uma nuance temporal ausente da conjunção.
- source_word: εἶπεν αὐτῷ
  choice: lhe disse
  rationale: Preserva os pronomes do grego sem inserir nomes não presentes nesta oração; a construção é natural em português.
- source_word: Ταῦτά σοι πάντα δώσω
  choice: Eu lhe darei todas estas coisas
  rationale: Conserva a promessa futura, o objeto indireto e a abrangência de πάντα, além do plural demonstrativo Ταῦτά, que remete aos reinos e à glória mostrados no versículo anterior.
- source_word: ἐὰν
  choice: se
  rationale: Expressa diretamente a condição introduzida pela conjunção grega.
- source_word: πεσὼν
  choice: se prostrar
  rationale: Comunica de modo natural o gesto corporal de abaixar-se ou lançar-se ao chão que precede e acompanha a ação principal.
- source_word: προσκυνήσῃς μοι
  choice: me adorar
  rationale: No contexto da tentação e da resposta sobre adorar somente a Deus no versículo seguinte, “adorar” traduz melhor a força religiosa da exigência, sem apagar em nota o alcance mais amplo do verbo.
theological_decisions:
- issue: Sentido de προσκυνέω na exigência feita a Jesus
  choice: me adorar
  alternative: curvar-se diante de mim; prestar-me homenagem
  rationale: A resposta de Jesus no versículo seguinte torna explícita a exclusividade da adoração devida a Deus, favorecendo aqui o sentido religioso. A nota preserva a amplitude lexical do verbo e a relação entre gesto de prostração, homenagem e adoração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Lhe disse” evita inserir referentes nominais ausentes no grego; “se prostrar” mantém o gesto corporal sem recorrer à expressão menos natural “cair por terra”.
