  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Πάλιν γέγραπται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: pt
  text: 'Jesus lhe disse: “Também está escrito: ‘Não ponha à prova o Senhor, seu Deus.’”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não teste o Senhor, seu Deus.” O verbo grego também pode ser traduzido como “testar”.'
    reason: lexical_alternative
  - marker: b
    text: Citação de Deuteronômio 6:16. No texto grego, “Senhor” reflete a forma usada pela Septuaginta para representar o nome divino.
    reason: cross_reference
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jesus lhe disse
  rationale: A construção introduz a fala de modo simples; “lhe disse” expressa naturalmente em português o dativo αὐτῷ sem acrescentar ênfase.
- source_word: Πάλιν
  choice: Também
  rationale: No contexto, introduz uma citação bíblica em contraponto à anterior. “Também” comunica com naturalidade que há outra passagem aplicável, sem sugerir que a mesma frase foi escrita novamente.
- source_word: γέγραπται
  choice: está escrito
  rationale: 'Preserva a fórmula tradicional de citação das Escrituras e o valor resultativo do perfeito: foi escrito e permanece escrito.'
- source_word: Οὐκ ἐκπειράσεις
  choice: Não ponha ... à prova
  rationale: O futuro indicativo grego funciona como proibição. “Não ponha à prova” reproduz o sentido de ἐκπειράζω em português corrente e dignificado.
- source_word: κύριον τὸν θεόν σου
  choice: o Senhor, seu Deus
  rationale: Mantém κύριος como “Senhor” e representa τὸν θεόν σου como aposição. A vírgula torna clara essa relação em português.
theological_decisions:
- issue: Tradução de κύριος na citação referente ao Deus de Israel
  choice: Senhor
  alternative: SENHOR
  rationale: O texto-fonte imediato é o grego κύριος, reproduzindo a formulação da Septuaginta. “Senhor” traduz diretamente o grego; a relação com o nome divino no texto hebraico é indicada em nota.
- issue: Força da resposta introduzida por Πάλιν
  choice: Também está escrito
  alternative: Por outro lado, está escrito
  rationale: “Também” preserva a adição de uma segunda citação que responde ao uso anterior das Escrituras, sem tornar explícita uma oposição lógica maior do que a expressa pelo advérbio.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém dignidade bíblica sem arcaísmo; emprega “seu Deus”, compatível com o tratamento indireto da fala e natural em português brasileiro.
