source:
  edition: SBLGNT
  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοὶ ἀπὸ τῆς Γαλιλαίας καὶ Δεκαπόλεως καὶ Ἱεροσολύμων καὶ Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/025.yaml
  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: pt
  text: E grandes multidões o seguiram, vindas da Galileia, da Decápolis, de Jerusalém, da Judeia e de além do Jordão[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «da região do outro lado do Jordão».'
    reason: Alternativa lexical que explicita o sentido geográfico de πέραν τοῦ Ἰορδάνου sem determinar mais precisamente a região.
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: seguiram
  rationale: Equivalente narrativo natural de ἀκολουθέω, que mantém tanto a ideia concreta de acompanhar Jesus quanto a possível dimensão de interesse discipular, sem pressupor compromisso pleno.
- source_word: ὄχλοι πολλοὶ
  choice: grandes multidões
  rationale: Expressão idiomática em português que comunica o grande número ou porte dos ajuntamentos, evitando a formulação pouco natural «muitas multidões».
- source_word: ἀπὸ
  choice: vindas de
  rationale: Marca a origem geográfica das multidões. O particípio «vindas» torna natural em português a relação de procedência que o grego expressa com ἀπό depois do verbo.
- source_word: Γαλιλαίας
  choice: Galileia
  rationale: Forma portuguesa corrente do nome da região.
- source_word: Δεκαπόλεως
  choice: Decápolis
  rationale: Forma portuguesa estabelecida para a região ou conjunto das dez cidades.
- source_word: Ἱεροσολύμων
  choice: Jerusalém
  rationale: Forma portuguesa corrente do topônimo, naturalmente usada no singular.
- source_word: Ἰουδαίας
  choice: Judeia
  rationale: Forma portuguesa corrente do nome da região.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: de além do Jordão
  rationale: Preserva a referência espacial a terras situadas além ou do outro lado do rio Jordão e mantém a ideia de procedência regida por ἀπό.
- source_word: καὶ ... καὶ ... καὶ
  choice: e ... de ... de ... e
  rationale: A enumeração cumulativa é preservada de modo idiomático; em português, a repetição de «de» identifica claramente cada lugar de origem, enquanto «e» introduz o último elemento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem geral da frase grega foi mantida, e «vindas» foi acrescentado para ligar naturalmente as multidões à lista de suas regiões de origem.
