  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: pt
  text: E a notícia a seu respeito se espalhou por toda a Síria, e lhe trouxeram todos os que estavam doentes, acometidos por várias enfermidades e dores, os oprimidos por demônios[a], os que tinham convulsões[b] e os paralíticos; e ele os curou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os possuídos por demônios” ou “os endemoninhados”.
    reason: lexical_alternative
  - marker: b
    text: Grego σεληνιαζομένους, tradicionalmente “os epiléticos”; mais literalmente, pessoas consideradas afetadas pela lua.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἀκοὴ αὐτοῦ
  choice: as notícias a respeito dele
  rationale: No contexto, ἀκοή indica aquilo que se ouvia a respeito de Jesus, isto é, as notícias que circulavam, e não a faculdade da audição. O plural idiomático soa natural em português.
- source_word: ἀπῆλθεν
  choice: se espalharam
  rationale: Embora o verbo expresse literalmente movimento para fora, com “notícias” o português corrente usa naturalmente “se espalharam”, preservando a imagem de ampla divulgação.
- source_word: εἰς ὅλην τὴν Συρίαν
  choice: por toda a Síria
  rationale: Expressa de modo natural a extensão regional indicada pelo grego.
- source_word: προσήνεγκαν αὐτῷ
  choice: lhe trouxeram
  rationale: Neste contexto, προσφέρω descreve pessoas sendo levadas até Jesus; “lhe trouxeram” é claro e idiomático.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: todos os que estavam doentes
  rationale: A expressão idiomática κακῶς ἔχειν significa estar mal de saúde ou doente.
- source_word: ποικίλαις νόσοις καὶ βασάνοις συνεχομένους
  choice: acometidos por várias enfermidades e dores
  rationale: συνέχω apresenta essas pessoas como afligidas ou dominadas por males diversos; βάσανοι, neste contexto de enfermidade, pode indicar dores intensas. A formulação evita sugerir necessariamente tortura infligida por terceiros.
- source_word: δαιμονιζομένους
  choice: os oprimidos por demônios
  rationale: Preserva explicitamente o referente sobrenatural sem impor ao particípio grego uma categoria técnica moderna mais estreita. Alternativas tradicionais são registradas em nota.
- source_word: σεληνιαζομένους
  choice: os que tinham convulsões
  rationale: Comunica ao leitor moderno a manifestação provável, sem afirmar como causa a associação etimológica antiga com a lua. A forma mais literal e a tradução tradicional são preservadas em nota.
- source_word: παραλυτικούς
  choice: os paralíticos
  rationale: Equivalente português direto e reconhecível para pessoas com paralisia.
- source_word: ἐθεράπευσεν αὐτούς
  choice: ele os curou
  rationale: θεραπεύω significa aqui curar; o pronome retoma todas as pessoas levadas a Jesus.
theological_decisions:
- issue: Como traduzir δαιμονιζομένους sem eliminar a realidade da ação demoníaca nem definir além do que o grego exige
  choice: os oprimidos por demônios
  alternative: os possuídos por demônios; os endemoninhados
  rationale: A tradução mantém o agente sobrenatural explícito, mas evita fazer do termo grego uma classificação técnica rígida. A nota conserva opções tradicionais que podem exprimir um grau mais forte de domínio.
- issue: Como traduzir σεληνιαζομένους sem endossar uma etiologia lunar antiga
  choice: os que tinham convulsões
  alternative: os epiléticos; os afetados pela lua
  rationale: A escolha principal apresenta a condição observável em linguagem acessível. A nota mantém tanto a tradução tradicional quanto o sentido etimologicamente mais literal, preservando a transparência da decisão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Enfermidades” mantém um tom bíblico moderado sem arcaísmo, enquanto “dores”, “convulsões” e “paralíticos” permanecem claros para leitores comuns. A pontuação distingue a declaração sobre a difusão das notícias da chegada dos enfermos e usa ponto e vírgula antes da cura para evitar uma sequência excessiva de coordenações.
