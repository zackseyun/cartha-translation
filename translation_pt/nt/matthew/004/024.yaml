  naturalness: O texto é claro e de registro moderno. A revisão mantém a fluência em português e evita acrescentar uma relação temporal que não está explicitada no grego.
  terminology: “Oprimidos por demônios”, “convulsões”, “enfermidades”, “dores” e “paralíticos” são escolhas aceitáveis e inteligíveis. As notas preservam adequadamente as alternativas relevantes para δαιμονιζομένους e σεληνιαζομένους.
