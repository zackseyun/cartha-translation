source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: pt
  text: 'Então Jesus lhe diz: “Vá embora, Satanás! Pois está escrito: ‘Adore[a] o Senhor, seu Deus, e sirva[b] somente a ele.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Prostre-se diante do Senhor, seu Deus”. O verbo grego pode indicar, mais literalmente, prostrar-se ou curvar-se em reverência.'
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido por “sirva” pode referir-se especificamente ao serviço sagrado ou religioso prestado a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca a sequência narrativa de modo conciso e natural em português.
- source_word: λέγει
  choice: diz
  rationale: Preserva o presente histórico grego e a vivacidade da narrativa.
- source_word: Ὕπαγε
  choice: Vá embora
  rationale: Expressa com clareza a ordem enfática de se retirar, sem tom arcaico.
- source_word: Σατανᾶ
  choice: Satanás
  rationale: Mantém a forma consagrada do nome ou título em português e seu uso vocativo.
- source_word: γέγραπται
  choice: está escrito
  rationale: Reproduz a fórmula perfeita passiva usada para introduzir uma citação das Escrituras.
- source_word: Κύριον τὸν θεόν σου
  choice: o Senhor, seu Deus
  rationale: A vírgula deixa clara a relação apositiva entre “Senhor” e “seu Deus”, em português corrente.
- source_word: προσκυνήσεις
  choice: Adore
  rationale: No contexto da devoção dirigida a Deus, “adorar” comunica naturalmente o sentido religioso; o sentido corporal mais literal é registrado em nota.
- source_word: αὐτῷ μόνῳ
  choice: somente a ele
  rationale: A ordem escolhida ressalta de modo natural em português a exclusividade do destinatário do serviço.
- source_word: λατρεύσεις
  choice: sirva
  rationale: Preserva a distinção em relação a προσκυνήσεις, embora o verbo possa designar especificamente serviço sagrado ou religioso.
theological_decisions:
- issue: Distinção entre προσκυνέω e λατρεύω
  choice: Traduzir προσκυνήσεις por “adore” e λατρεύσεις por “sirva”
  alternative: Traduzir ambos com linguagem de adoração, ou traduzir προσκυνήσεις por “prosternar-se diante de”
  rationale: Os dois verbos são relacionados, mas distintos. A tradução mantém tanto a adoração quanto o serviço devotado, sem fundi-los nem impor uma delimitação teológica mais estreita que a do texto.
- issue: Exclusividade em αὐτῷ μόνῳ
  choice: “somente a ele”
  alternative: “a ele somente”
  rationale: Ambas são possíveis, mas “somente a ele” expressa com maior naturalidade a exclusividade do objeto em português moderno.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O presente histórico foi mantido em “diz”; a citação bíblica usa imperativos naturais em português, equivalentes ao futuro volitivo do grego.
