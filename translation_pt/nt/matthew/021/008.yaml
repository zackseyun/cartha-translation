base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/008.yaml
  text: Most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
translation:
  language: pt
  text: A maior parte da multidão estendeu suas capas na estrada[a], e outros cortavam ramos das árvores e os espalhavam na estrada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «suas vestes».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  choice: A maior parte da multidão
  rationale: πλεῖστος com o substantivo coletivo ὄχλος indica a maior parte da multidão. A formulação preserva o sentido quantitativo sem sugerir apenas uma multidão maior.
- source_word: ἔστρωσαν
  choice: estendeu
  rationale: O verbo significa estender ou dispor sobre uma superfície. O singular concorda naturalmente, em português, com o núcleo coletivo «parte».
- source_word: ἑαυτῶν τὰ ἱμάτια
  choice: suas capas
  rationale: ἱμάτια designa aqui vestes exteriores; «capas» é concreto e natural no contexto. O possessivo comunica adequadamente ἑαυτῶν.
- source_word: ἐν τῇ ὁδῷ
  choice: pelo caminho
  rationale: No contexto, indica a superfície da via diante de Jesus. «Pelo caminho» é idiomático em português e mantém a imagem física.
- source_word: ἄλλοι δὲ
  choice: enquanto outros
  rationale: Apresenta outro grupo e uma ação simultânea na cena. «Enquanto» torna natural a progressão sem impor contraste forte.
- source_word: ἔκοπτον
  choice: cortavam
  rationale: O imperfeito grego retrata uma ação em andamento; o pretérito imperfeito português preserva esse aspecto.
- source_word: κλάδους ἀπὸ τῶν δένδρων
  choice: ramos das árvores
  rationale: «Ramos» é uma correspondência corrente e digna para κλάδους; «das árvores» expressa naturalmente a origem indicada por ἀπό.
- source_word: καὶ ἐστρώννυον
  choice: e os espalhavam
  rationale: O pretérito imperfeito mantém a ação em curso. O pronome «os» retoma claramente os ramos.
