reference: Matthew 21:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ γεωργοὶ ἰδόντες τὸν υἱὸν εἶπον ἐν ἑαυτοῖς· Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτὸν καὶ ⸀σχῶμεν τὴν κληρονομίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: pt
  text: 'Mas, quando os lavradores arrendatários viram o filho, disseram entre si: “Este é o herdeiro. Venham, vamos matá-lo e ficar com a herança dele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γεωργοὶ
  choice: lavradores arrendatários
  rationale: No contexto da parábola, são lavradores que cultivam a vinha mediante arrendamento, não simples trabalhadores rurais. A expressão explicita essa relação social com o proprietário.
- source_word: ἰδόντες
  choice: quando ... viram
  rationale: A oração temporal comunica em português natural a sequência expressa pelo particípio aoristo.
- source_word: τὸν υἱόν
  choice: o filho
  rationale: Reproduz diretamente o artigo e o substantivo gregos, sem acrescentar possessivo; a relação com o proprietário já está clara no contexto.
- source_word: ἐν ἑαυτοῖς
  choice: entre si
  rationale: Expressa de modo conciso e idiomático que conversavam dentro do próprio grupo.
- source_word: κληρονόμος
  choice: herdeiro
  rationale: É o equivalente jurídico e corrente de κληρονόμος.
- source_word: δεῦτε
  choice: Venham
  rationale: Funciona como convocação exortativa dirigida ao grupo e soa natural no português contemporâneo.
- source_word: ἀποκτείνωμεν
  choice: vamos matá-lo
  rationale: Reproduz naturalmente o subjuntivo exortativo, sem acrescentar a qualificação jurídica e moral explícita de 'assassinar'.
- source_word: σχῶμεν
  choice: ficar com
  rationale: Embora provenha de ἔχω, 'ter', no contexto indica obter para si a herança após matar o herdeiro. 'Ficar com' preserva esse sentido aquisitivo em linguagem natural sem tornar explícita uma ideia de força que o verbo não lexicaliza por si só.
- source_word: κληρονομίαν αὐτοῦ
  choice: a herança dele
  rationale: Mantém o sentido direto de κληρονομία e torna explícito o pronome αὐτοῦ; 'dele' evita possível ambiguidade sonora de 'sua'.
theological_decisions:
- issue: Referência parabólica ao filho
  choice: Traduzir simplesmente como 'o filho'.
  alternative: Explicitar na tradução que o filho representa Jesus.
  rationale: Embora a narrativa de Mateus conduza a uma leitura cristológica, o versículo permanece no nível da história contada. A formulação simples preserva a tensão da parábola sem inserir sua interpretação no texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. 'Lavradores arrendatários' explicita com precisão o papel dos γεωργοί; 'Venham, vamos...' reproduz uma convocação coletiva natural. Não se inclui nota, pois 'ficar com' representa de forma transparente o sentido contextual de σχῶμεν.
