  text: ⸂προσελθὼν δὲ⸃ τῷ ⸀δευτέρῳ εἶπεν ὡσαύτως· ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Ἐγώ, κύριε· καὶ οὐκ⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/030.yaml
  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
translation:
  language: pt
  text: 'Depois, aproximou-se do segundo e lhe disse a mesma coisa. Ele respondeu: “Irei, senhor[a]”, mas não foi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “Eu, senhor” — uma resposta elíptica que significa “Eu vou” ou “Irei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: aproximou-se
  rationale: O particípio aoristo de προσέρχομαι descreve o pai dirigindo-se ao segundo filho; “aproximou-se” expressa naturalmente esse movimento sem acrescentar conteúdo.
- source_word: δὲ
  choice: Depois / mas
  rationale: Na primeira ocorrência, δέ promove a progressão narrativa; no desfecho, o contraste é expresso idiomaticamente em português por “mas”, correspondendo ao valor contextual da construção com καί e negação.
- source_word: τῷ δευτέρῳ
  choice: do segundo
  rationale: Mantém a concisão do grego, no qual “filho” fica implícito pelo contexto imediato.
- source_word: ὡσαύτως
  choice: a mesma coisa
  rationale: Refere-se à mesma ordem dada ao primeiro filho e soa natural no português narrativo.
- source_word: ἀποκριθεὶς εἶπεν
  choice: respondeu
  rationale: Traduz idiomaticamente a fórmula grega sem a redundância pouco natural de “respondendo, disse”.
- source_word: Ἐγώ
  choice: Sim
  rationale: O pronome enfático isolado constitui uma resposta elíptica de assentimento. “Sim” comunica naturalmente em português a anuência prometida, enquanto a nota preserva a forma literal e suas possíveis explicitações.
- source_word: κύριε
  choice: senhor
  rationale: Aqui é uma forma respeitosa de tratamento dirigida ao pai humano; “senhor” preserva a deferência sem exigir referência divina.
- source_word: καὶ οὐκ ἀπῆλθεν
  choice: mas não foi
  rationale: O adversativo português torna explícito o contraste pragmático entre a resposta afirmativa e a falta de ação, central à parábola.
theological_decisions:
- issue: Sentido de κύριε no tratamento dirigido ao pai
  choice: senhor
  alternative: Senhor; mestre
  rationale: O contexto apresenta um filho falando respeitosamente com seu pai humano. A tradução em minúscula evita impor um título divino ou messiânico, sem eliminar o tom deferente do vocativo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A resposta elíptica foi naturalizada como “Sim, senhor”, e a forma incomum do grego foi preservada em nota. A pontuação e o contraste final favorecem leitura oral fluente.
