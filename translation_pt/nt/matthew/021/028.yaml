base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: pt
  text: 'Mas o que vocês acham? Um homem tinha dois filhos.[a] Aproximou-se do primeiro e disse: “Filho, vá trabalhar hoje na vinha.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego usa aqui termos gerais para “filhos” ou “crianças”, não palavras que especifiquem “filhos homens”. O mesmo vale para “Filho” na fala seguinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: Mas o que vocês acham?
  rationale: Expressa naturalmente o pedido de avaliação dirigido a várias pessoas; “Mas” conserva a leve força conectiva de δέ.
- source_word: ἄνθρωπος
  choice: Um homem
  rationale: Neste contexto narrativo, o substantivo se refere naturalmente a um homem, pai dos dois filhos.
- source_word: τέκνα δύο
  choice: dois filhos
  rationale: Em português, “filhos” é a forma relacional natural para os filhos de alguém e pode funcionar coletivamente, embora o grego use o termo geral para “crianças/filhos”, sem especificar “filhos homens”; a nota preserva essa distinção.
- source_word: προσελθὼν τῷ πρώτῳ
  choice: Aproximou-se do primeiro
  rationale: Transforma o particípio em verbo coordenado para produzir narrativa natural em português, mantendo a ação anterior à fala e a referência ordinal.
- source_word: Τέκνον
  choice: Filho
  rationale: É a forma de tratamento familiar e idiomática em português; o grego é literalmente o termo geral “criança/filho”, sem usar a palavra específica para “filho homem”.
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: vá trabalhar hoje
  rationale: Reproduz com clareza os dois imperativos e o advérbio temporal em ordem natural no português contemporâneo.
- source_word: ἐν τῷ ἀμπελῶνι
  choice: na vinha
  rationale: “Vinha” é o equivalente português corrente de ἀμπελών e conserva a imagem agrícola da parábola.
theological_decisions:
- issue: Se τέκνα/τέκνον deve ser entendido especificamente como “filhos homens”
  choice: filhos / Filho, com esclarecimento em nota
  alternative: crianças / Criança; ou filhos homens / Filho
  rationale: O grego emprega termos gerais de relação filial, não υἱοί/υἱέ, que especificariam “filhos homens”. Como “duas crianças” e o vocativo “Criança” seriam pouco naturais neste contexto em português, o texto usa a formulação familiar idiomática e a nota impede que se atribua ao grego uma especificação masculina inexistente.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para explicitar o plural de ὑμῖν. “Vinha” mantém a terminologia bíblica corrente sem soar arcaica. A pontuação e o discurso direto seguem o uso editorial contemporâneo.
