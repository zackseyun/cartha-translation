  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: pt
  text: 'Mas, se dissermos: “Dos seres humanos”[a], temos medo da multidão, pois todos consideram João um profeta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “De origem humana”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: Mas, se dissermos
  rationale: A construção ἐὰν com o subjuntivo aoristo apresenta uma possibilidade condicional na deliberação. “Mas, se dissermos” é natural em português e mantém essa força.
- source_word: Ἐξ ἀνθρώπων
  choice: Dos seres humanos
  rationale: A expressão indica fonte ou origem humana e contrasta diretamente com “do céu” no contexto anterior. “Seres humanos” comunica o sentido genérico de ἀνθρώπων sem sugerir referência exclusiva a pessoas do sexo masculino.
- source_word: φοβούμεθα τὸν ὄχλον
  choice: temos medo da multidão
  rationale: A formulação corrente expressa de modo direto o temor diante da multidão reunida.
- source_word: πάντες
  choice: todos
  rationale: Mantém a abrangência da afirmação grega e retoma naturalmente os integrantes da multidão.
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: consideram João um profeta
  rationale: A construção idiomática com ἔχω e ὡς indica considerar ou ter alguém na qualidade mencionada. A tradução conserva esse sentido avaliativo em português natural.
theological_decisions:
- issue: Contraste entre origem celestial e origem humana
  choice: Dos seres humanos
  alternative: De origem humana
  rationale: A escolha preserva a resposta elíptica e o contraste conciso com “do céu”, sem restringir ἀνθρώπων a homens do sexo masculino. A nota registra uma explicitação legítima da ideia de origem.
- issue: Avaliação popular de João
  choice: todos consideram João um profeta
  alternative: todos têm João por profeta
  rationale: A tradução relata a convicção da multidão sem ampliá-la nem transformá-la em comentário doutrinário do tradutor.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Multidão” mantém a referência coletiva, e “temos medo” evita solenidade desnecessária.
