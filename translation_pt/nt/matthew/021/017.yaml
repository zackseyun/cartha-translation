  text: καὶ καταλιπὼν αὐτοὺς ἐξῆλθεν ἔξω τῆς πόλεως εἰς Βηθανίαν, καὶ ηὐλίσθη ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/017.yaml
  text: And leaving them[a], he went out of the city to Bethany and stayed there overnight.
translation:
  language: pt
  text: Depois de deixá-los, saiu da cidade e foi para Betânia, onde passou a noite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλιπὼν
  choice: deixando
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal. “Deixando” é natural em português e mantém a ligação sintática sem a rigidez de “tendo deixado”.
- source_word: αὐτοὺς
  choice: os
  rationale: O pronome retoma as pessoas mencionadas no contexto imediato; a forma átona “os” é direta e não acrescenta identificação interpretativa.
- source_word: ἐξῆλθεν ἔξω τῆς πόλεως
  choice: saiu da cidade
  rationale: A combinação do verbo de saída com ἔξω reforça o movimento para fora; “saiu da cidade” expressa isso de maneira clara e idiomática, sem redundância artificial.
- source_word: πόλεως
  choice: cidade
  rationale: No contexto, o termo se refere a Jerusalém; “cidade” é a equivalência normal de πόλις.
- source_word: εἰς Βηθανίαν
  choice: em direção a Betânia
  rationale: εἰς indica movimento rumo a um lugar. “Em direção a Betânia” preserva explicitamente o valor direcional e soa natural em português.
- source_word: ηὐλίσθη
  choice: passou a noite
  rationale: O verbo αὐλίζομαι significa alojar-se ou permanecer durante a noite. “Passou a noite” comunica com clareza essa nuance temporal em linguagem corrente.
- source_word: ἐκεῖ
  choice: ali
  rationale: O advérbio locativo remete a Betânia; “ali” é uma forma natural de indicar o lugar recém-mencionado.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do grego sem sacrificar a naturalidade. Não se acrescentou nota, pois “passou a noite” comunica de modo suficiente o sentido lexical de ηὐλίσθη; as alternativas “ficou hospedado” e “pernoitou” não alteram substancialmente a interpretação.
