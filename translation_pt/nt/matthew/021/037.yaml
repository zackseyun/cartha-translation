  text: ὕστερον δὲ ἀπέστειλεν πρὸς αὐτοὺς τὸν υἱὸν αὐτοῦ λέγων· Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/037.yaml
  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
translation:
  language: pt
  text: 'Mas, mais tarde, enviou-lhes seu filho, dizendo: “Eles respeitarão meu filho.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕστερον
  choice: por último
  rationale: No fluxo da parábola, o advérbio indica a ação posterior na sequência e, neste contexto, a última tentativa do proprietário. “Por último” é natural em português e não acrescenta a ideia mais forte de consumação expressa por outras construções.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição com leve contraste entre o envio anterior dos servos e o envio, agora, do filho.
- source_word: ἀπέστειλεν πρὸς αὐτοὺς
  choice: enviou-lhes
  rationale: Expressa de modo idiomático em português tanto o ato de enviar como os destinatários, sem atribuir ao verbo sentido técnico.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: seu filho
  rationale: Equivalente natural da expressão grega, sem acrescentar “próprio”, “amado” ou qualquer título não presente no texto.
- source_word: λέγων
  choice: dizendo
  rationale: Mantém de modo transparente o particípio que introduz as palavras do proprietário.
- source_word: Ἐντραπήσονται
  choice: respeitarão
  rationale: Com objeto direto pessoal neste contexto, ἐντρέπω denota mostrar consideração, deferência ou respeito. “Respeitarão” é claro, atual e preserva o sentido social da afirmação.
- source_word: τὸν υἱόν μου
  choice: meu filho
  rationale: Preserva de modo direto e natural a relação pessoal expressa pelo possessivo grego.
theological_decisions:
- issue: Representação do filho na parábola sem explicitar em excesso a referência cristológica
  choice: seu filho / meu filho
  alternative: seu Filho / meu Filho; seu filho amado
  rationale: Embora o filho da parábola aponte para Jesus no contexto, o versículo emprega υἱός em linguagem narrativa comum, sem ἀγαπητός. A forma em minúscula preserva a narrativa e permite que a implicação cristológica surja do contexto, sem inserção interpretativa.
- issue: Expectativa do proprietário expressa pelo futuro
  choice: “Eles respeitarão meu filho”
  alternative: “Talvez respeitem meu filho”
  rationale: O grego usa o futuro indicativo, não uma formulação de possibilidade. A tradução mantém a expectativa afirmativa do personagem sem tentar harmonizá-la com sua presciência ou transformá-la em declaração doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A ordem foi ajustada à sintaxe idiomática portuguesa, preservando o contraste narrativo e a fala direta.
