  text: καὶ λαβόντες αὐτὸν ἐξέβαλον ἔξω τοῦ ἀμπελῶνος καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/039.yaml
  text: And they took him[a], threw him out of the vineyard, and killed him.
translation:
  language: pt
  text: Eles o pegaram, o lançaram para fora da vinha e o mataram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: pegaram
  rationale: O particípio aoristo de λαμβάνω introduz a sequência de ações. “Pegaram” é natural e preserva o sentido básico sem acrescentar explicitamente a ideia de violência de “agarraram” ou “prenderam”.
- source_word: ἐξέβαλον
  choice: lançaram para fora
  rationale: ἐκβάλλω indica aqui expulsão física. “Lançaram para fora” comunica a ação com clareza e dignidade, sem a possível informalidade de “jogaram para fora”.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: para fora da vinha
  rationale: A expressão indica movimento do interior para o exterior da vinha e se liga naturalmente ao verbo escolhido.
- source_word: ἀμπελῶνος
  choice: vinha
  rationale: ἀμπελών designa uma plantação de videiras. “Vinha” é o termo bíblico tradicional, preciso e amplamente compreensível em português.
- source_word: ἀπέκτειναν
  choice: mataram
  rationale: ἀποκτείνω significa matar. A opção é direta e não acrescenta a qualificação jurídica ou moral presente em alternativas como “executaram” ou “assassinaram”.
theological_decisions:
- issue: Ordem narrativa da expulsão e da morte em relação aos relatos paralelos
  choice: Manter que o filho foi lançado para fora da vinha e depois morto.
  alternative: Harmonizar com Marcos e Lucas, sugerindo que ele foi morto antes de ser lançado para fora.
  rationale: 'A ordem do texto grego de Mateus é explícita: λαβόντες ... ἐξέβαλον ... καὶ ἀπέκτειναν. A tradução preserva a sequência própria deste relato sem harmonizá-la com os paralelos.'
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e inteligível internacionalmente. A repetição do pronome “o” torna inequívoco o objeto de cada ação e evita uma formulação excessivamente literária.
