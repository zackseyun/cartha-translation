base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: pt
  text: 'dizendo-lhes: “Vão ao povoado em frente de vocês[a]. Imediatamente encontrarão uma jumenta amarrada e, com ela, um jumentinho[b]. Soltem os dois e tragam-nos para mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao povoado do outro lado de vocês”.
    reason: lexical_alternative
  - marker: b
    text: O termo grego indica um animal jovem; pelo contexto, trata-se de um jumento jovem.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορεύεσθε
  choice: Vão
  rationale: O imperativo, neste comando narrativo, é expresso de modo direto e natural por “Vão”.
- source_word: κώμην
  choice: povoado
  rationale: κώμη designa uma povoação menor que uma cidade; “povoado” é claro e amplamente compreensível em português.
- source_word: κατέναντι ὑμῶν
  choice: que está diante de vocês
  rationale: Preserva o sentido espacial de algo situado em frente ou do outro lado, sem determinar além do que o grego permite.
- source_word: εὐθέως
  choice: Logo
  rationale: Transmite a prontidão temporal de εὐθέως de forma natural no contexto, com o sentido de “imediatamente”.
- source_word: ὄνον δεδεμένην
  choice: uma jumenta amarrada
  rationale: O particípio feminino singular mostra que o animal é fêmea; “jumenta” também torna natural a referência posterior a αὐτῆς.
- source_word: πῶλον
  choice: um jumentinho
  rationale: πῶλος é um animal jovem e, neste contexto, um jovem jumento; “jumentinho” comunica espécie e idade sem ambiguidade.
- source_word: μετ’ αὐτῆς
  choice: com ela
  rationale: Mantém o pronome feminino singular que retoma a jumenta e preserva a associação entre os animais.
- source_word: λύσαντες
  choice: Desamarrem os dois
  rationale: O particípio aoristo ligado ao imperativo seguinte expressa uma ação preparatória. Em português natural, uma ordem coordenada preserva bem a sequência; “os dois” explicita o objeto plural implícito.
- source_word: ἀγάγετέ μοι
  choice: tragam-nos para mim
  rationale: O imperativo plural de ἄγω pede que os animais sejam conduzidos até Jesus; “tragam-nos” é idiomático e mantém ambos como objeto.
- source_word: λέγων αὐτοῖς
  choice: dizendo-lhes
  rationale: Mantém de perto a construção participial que introduz a fala de Jesus e se encaixa na continuidade sintática do versículo anterior.
theological_decisions: []
