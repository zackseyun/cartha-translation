  terminology: «Jumenta» e «jumentinho» são escolhas naturais e contextualmente precisas para ὄνον e πῶλον. «Desamarrem» é possível, mas «soltem» abrange naturalmente o ato de desatar/soltar (λύσαντες) sem sugerir um método específico.
