source:
  edition: SBLGNT
  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: pt
  text: 'Quando ele entrou em Jerusalém, toda a cidade ficou agitada[a] e dizia: “Quem é este?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi abalada”. O verbo grego pode indicar um abalo físico ou, como aqui, uma forte comoção pública.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: Quando ele entrou
  rationale: O genitivo absoluto tem valor temporal e é expresso por uma oração natural em português, sem definir de modo indevido se a reação ocorreu durante ou logo após a entrada.
- source_word: Ἱεροσόλυμα
  choice: Jerusalém
  rationale: Forma consagrada em português para o nome da cidade.
- source_word: ἐσείσθη
  choice: ficou agitada
  rationale: O verbo σείω significa literalmente sacudir ou abalar, mas aqui descreve figuradamente a comoção pública provocada pela entrada de Jesus. “Ficou agitada” comunica esse sentido em português atual e preserva a ideia de perturbação.
- source_word: πᾶσα ἡ πόλις
  choice: toda a cidade
  rationale: Expressão portuguesa idiomática que conserva a abrangência coletiva do grego.
- source_word: λέγουσα
  choice: e dizia
  rationale: O particípio concorda com “cidade”, uma coletividade singular. O imperfeito apresenta naturalmente o que se dizia pela cidade, sem substituir o verbo por “perguntava”.
- source_word: Τίς ἐστιν οὗτος;
  choice: Quem é este?
  rationale: Tradução direta e natural, sem acrescentar “homem”, termo que não aparece no grego.
theological_decisions:
- issue: Sentido literal ou figurado da reação da cidade
  choice: ficou agitada
  alternative: foi abalada
  rationale: O contexto retrata a reação coletiva da cidade à entrada de Jesus, e não afirma explicitamente um abalo físico. A tradução principal comunica a comoção pública, enquanto a nota preserva a imagem e a alternativa lexical do original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém a personificação coletiva de “toda a cidade” e preserva em nota a força metafórica do verbo grego.
