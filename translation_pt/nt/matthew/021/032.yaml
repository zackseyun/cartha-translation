source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: pt
  text: Pois João veio até vocês no caminho da justiça[a], e vocês não acreditaram nele; mas os cobradores de impostos e as prostitutas acreditaram nele. Vocês, porém, mesmo depois de verem isso, não mudaram de ideia para acreditar nele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de modo justo” ou “no caminho da retidão”. A expressão grega pode descrever tanto a vida e o ministério de João como o caminho justo que ele proclamava.
    reason: lexical_alternative
  - marker: b
    text: Ou “não se arrependeram para acreditar nele” ou “não mudaram de atitude para confiar nele”. O verbo grego usado aqui sugere mais especificamente mudança de ideia ou pesar e não é o verbo mais comum traduzido por “arrepender-se”.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com a repreensão anterior de modo natural em português.
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: no caminho da justiça
  rationale: Preserva a metáfora de ὁδός e a ambiguidade entre a conduta e o ministério proclamado por João.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  choice: não acreditaram nele / acreditaram nele
  rationale: O verbo πιστεύω com dativo indica aqui dar crédito ou confiar em uma pessoa e em sua mensagem; a repetição mantém o contraste do grego.
- source_word: τελῶναι
  choice: cobradores de impostos
  rationale: Equivalente moderno, claro e amplamente compreensível.
- source_word: πόρναι
  choice: prostitutas
  rationale: Equivalente lexical direto que preserva a força social e moral do termo no contexto.
- source_word: ἰδόντες
  choice: mesmo depois de verem isso
  rationale: Expressa a relação temporal e concessiva implícita; “isso” retoma a resposta dos cobradores de impostos e das prostitutas.
- source_word: οὐδὲ μετεμελήθητε ὕστερον
  choice: mesmo depois ... não mudaram de ideia
  rationale: Reproduz a ênfase de οὐδέ e ὕστερον sem confundir μεταμέλομαι com o verbo mais comum para arrepender-se, μετανοέω.
theological_decisions:
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: “Justiça” é uma correspondência tradicional e abrangente para δικαιοσύνη; a nota preserva a possibilidade de referência ao modo justo de viver ou ao caminho justo anunciado por João.
- issue: Sentido de πιστεύω com αὐτῷ
  choice: acreditar nele
  alternative: confiar nele
  rationale: A formulação comunica que deram crédito a João e à sua mensagem sem introduzir a expressão teológica mais específica “crer em”.
- issue: Sentido de μεταμέλομαι
  choice: mudar de ideia
  alternative: arrepender-se
  rationale: Preserva a nuance específica de mudança de disposição ou pesar, sem equipará-lo automaticamente a μετανοέω.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “vocês”, natural tanto para leitores brasileiros como amplamente inteligível no português internacional. A estrutura conserva o contraste enfático entre os líderes e os grupos marginalizados.
