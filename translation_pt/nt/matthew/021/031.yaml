id: MAT.21.31
reference: Matthew 21:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: pt
  text: 'Qual dos dois fez a vontade do pai? Eles responderam: “O primeiro.” Jesus lhes disse: “Em verdade lhes digo que os cobradores de impostos e as prostitutas vão à frente de vocês para o Reino de Deus.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estão entrando no Reino de Deus antes de vocês”. O grego diz literalmente que eles “vão à frente de vocês”, enfatizando a precedência sem necessariamente afirmar a exclusão definitiva dos interlocutores.
    reason: Leitura alternativa que esclarece o possível sentido contextual e preserva a tensão do verbo grego.
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: Qual dos dois
  rationale: Expressão interrogativa natural em português que preserva o sentido partitivo de ἐκ com δύο.
- source_word: ἐποίησεν
  choice: fez
  rationale: Equivalente direto e idiomático na expressão portuguesa “fazer a vontade”.
- source_word: τὸ θέλημα τοῦ πατρός
  choice: a vontade do pai
  rationale: Mantém a formulação grega e deixa claro que, neste ponto da parábola, o referente imediato é o pai mencionado nela.
- source_word: Ὁ πρῶτος
  choice: O primeiro
  rationale: Resposta elíptica, concisa e natural, correspondente ao grego.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Em verdade lhes digo
  rationale: Preserva o caráter solene da fórmula de Jesus em linguagem digna e amplamente compreensível.
- source_word: τελῶναι
  choice: cobradores de impostos
  rationale: Termo moderno e claro para os agentes de arrecadação socialmente desprezados no contexto dos Evangelhos.
- source_word: πόρναι
  choice: prostitutas
  rationale: Equivalente específico, atual e mais preciso do que uma categoria moral genérica.
- source_word: προάγουσιν ὑμᾶς
  choice: vão à frente de vocês
  rationale: Preserva a imagem de precedência e o aspecto presente do verbo sem afirmar explicitamente a exclusão definitiva dos interlocutores.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: para o Reino de Deus
  rationale: Expressa naturalmente a direção indicada por εἰς e conserva a formulação teológica completa.
theological_decisions:
- issue: Sentido de προάγουσιν ὑμᾶς em relação à entrada no Reino
  choice: vão à frente de vocês para o Reino de Deus
  alternative: estão entrando no Reino de Deus antes de vocês
  rationale: A opção principal mantém a metáfora de ir adiante e enfatiza a precedência, sem transformar a advertência em uma declaração inequívoca de exclusão final. A alternativa explicita a entrada, uma possibilidade contextual legítima, mas interpretativamente mais definida.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais como “vocês” e “lhes”. Evita o termo menos transparente “publicanos” em favor de “cobradores de impostos” e conserva a força solene da fala de Jesus.
