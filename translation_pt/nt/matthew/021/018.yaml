  text: ⸀Πρωῒ δὲ ⸀ἐπανάγων εἰς τὴν πόλιν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/018.yaml
  text: Early in the morning, as he was returning to the city, he became hungry.
translation:
  language: pt
  text: De manhã cedo, enquanto voltava para a cidade, ele ficou com fome.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  choice: De manhã cedo
  rationale: Expressa o início do dia em português natural e preserva a ênfase temporal do advérbio grego.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui funciona como conectivo narrativo leve; a sequência é natural em português sem acrescentar «então», «ora» ou uma oposição indevida.
- source_word: ἐπανάγων
  choice: quando voltava
  rationale: O particípio presente descreve uma ação em curso e contemporânea à fome; «quando voltava» é claro e idiomático.
- source_word: εἰς τὴν πόλιν
  choice: para a cidade
  rationale: Preserva o sentido de movimento em direção à cidade sem afirmar que ele já havia entrado nela.
- source_word: ἐπείνασεν
  choice: sentiu fome
  rationale: Formulação corrente que apresenta a fome como experiência ocorrida naquele momento, sem o tom arcaico de «teve fome» em certos contextos nem uma construção pouco natural como «ficou faminto».
theological_decisions:
- issue: Implicação cristológica da fome de Jesus
  choice: Apresentar diretamente sua experiência real de fome
  alternative: Suavizar ou explicar a referência à fome
  rationale: A narrativa afirma de modo simples a fome genuína de Jesus. A tradução preserva esse testemunho de sua humanidade sem acrescentar comentário doutrinário.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O pronome «ele» mantém explícito o sujeito retomado do contexto, como no inglês de consulta, sem inserir o nome de Jesus onde o grego não o repete.
