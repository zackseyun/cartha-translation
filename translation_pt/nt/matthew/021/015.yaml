id: MAT.21.15
reference: Matthew 21:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
translation:
  language: pt
  text: 'Mas, quando os principais sacerdotes e os escribas viram as maravilhas que ele fez e as crianças que gritavam no templo[a], dizendo: “Hosana[b] ao Filho de Davi!”, ficaram indignados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido como “templo” refere-se ao complexo ou recinto do templo, não especificamente ao santuário interior.
    reason: cultural_note
  - marker: b
    text: “Hosana” é uma aclamação de origem hebraica que significa algo como “Salva, por favor” ou “Salva agora”; nessa época, também era usada como grito de louvor.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: quando ... viram
  rationale: O particípio aoristo apresenta a circunstância da ação principal; a oração temporal é natural em português e conserva essa relação.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição com leve contraste em relação à cena anterior.
- source_word: ἀρχιερεῖς
  choice: principais sacerdotes
  rationale: Designa as autoridades sacerdotais de maior posição, não vários sumos sacerdotes em exercício.
- source_word: γραμματεῖς
  choice: escribas
  rationale: É a tradução direta e tradicional para os especialistas na Lei, sem acrescentar uma explicação interpretativa ao texto.
- source_word: τὰ θαυμάσια
  choice: as maravilhas
  rationale: O adjetivo substantivado abrange feitos extraordinários sem restringi-los explicitamente a milagres.
- source_word: ἐποίησεν
  choice: fez
  rationale: Reproduz de modo simples o aoristo e combina naturalmente com o objeto amplo 'as maravilhas'.
- source_word: παῖδας
  choice: crianças
  rationale: Neste contexto, o sentido mais provável é o de crianças; 'servos' seria improvável e 'meninos' restringiria desnecessariamente o referente.
- source_word: κράζοντας
  choice: gritavam
  rationale: Comunica uma aclamação pública em voz alta sem sugerir, por si só, hostilidade.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: É a formulação corrente em português; neste uso, ἱερόν indica o complexo ou recinto do templo, esclarecido em nota.
- source_word: λέγοντας
  choice: dizendo
  rationale: Mantém a relação participial com a aclamação das crianças e evita uma coordenação pesada em português.
- source_word: Ὡσαννὰ
  choice: Hosana
  rationale: A transliteração consagrada preserva tanto a origem como súplica por salvação quanto seu uso como aclamação de louvor; a amplitude semântica é explicada em nota.
- source_word: τῷ υἱῷ Δαυίδ
  choice: ao Filho de Davi
  rationale: O dativo é expresso naturalmente por 'ao', e o título messiânico é mantido de forma literal.
theological_decisions:
- issue: Sentido messiânico de 'Filho de Davi'
  choice: Filho de Davi
  alternative: herdeiro de Davi; filho de Davi
  rationale: A expressão funciona em Mateus como título messiânico reconhecível; uma paráfrase enfraqueceria sua relevância narrativa e teológica.
- issue: Sentido de Ὡσαννά
  choice: Hosana no texto, com explicação em nota
  alternative: Salva, por favor; Salva agora
  rationale: A forma transliterada preserva a tensão entre a súplica originária por salvação e a aclamação de louvor que o termo passou a expressar.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase conserva a progressão do grego, enquanto 'quando ... viram' e 'dizendo' evitam construções participiais pouco naturais. A pontuação destaca a aclamação sem alterar sua função sintática.
