source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: pt
  text: E Jesus entrou no recinto do templo e expulsou todos os que vendiam e compravam ali.[a] Virou as mesas dos cambistas e os assentos dos que vendiam pombas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «no templo» ou «nos pátios do templo»; a palavra grega se refere ao complexo mais amplo do templo, não especificamente ao santuário interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: pátio do templo
  rationale: Refere-se ao complexo ou recinto do templo, em contraste com o santuário interior (ναός). No contexto, o singular coletivo «pátio do templo» comunica o espaço onde ocorria o comércio sem sugerir que Jesus entrou no santuário propriamente dito.
- source_word: ἐξέβαλεν
  choice: expulsou
  rationale: Expressa de modo natural e vigoroso a retirada forçada e decidida indicada pelo verbo.
- source_word: πάντας
  choice: todos
  rationale: Mantém explicitamente o alcance do adjetivo sobre os que vendiam e compravam.
- source_word: τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: os que ali vendiam e compravam
  rationale: Preserva as duas atividades dos particípios presentes; «ali» torna natural em português a relação com ἐν τῷ ἱερῷ sem repetir de forma pesada «no pátio do templo».
- source_word: τράπεζας
  choice: mesas
  rationale: É o equivalente comum e adequado para as mesas usadas nas operações de câmbio.
- source_word: κολλυβιστῶν
  choice: cambistas
  rationale: Termo corrente em português para pessoas que trocam moedas, claro no contexto do templo.
- source_word: κατέστρεψεν
  choice: derrubou
  rationale: No contexto de mesas, indica fazê-las virar ou tombar; «derrubou» é vívido e natural, sem sugerir necessariamente que foram destruídas.
- source_word: καθέδρας
  choice: assentos
  rationale: Mantém o sentido amplo de lugares para sentar e o registro narrativo digno.
- source_word: περιστεράς
  choice: pombas
  rationale: Equivalente natural em português para περιστεράς e apropriado ao contexto de animais destinados a ofertas.
theological_decisions:
- issue: Alcance de ἱερόν em relação à ação de Jesus
  choice: Jesus entrou no pátio ou recinto do templo, não especificamente no santuário interior.
  alternative: Traduzir genericamente como «templo», sem explicitar a distinção espacial.
  rationale: 'A distinção é histórica e espacial: ἱερόν designa aqui o complexo mais amplo, em contraste com ναός. A tradução evita sugerir acesso ao lugar santo sem acrescentar uma conclusão doutrinária.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em duas frases reduz o peso da coordenação grega sem alterar a sequência das ações. «Pátio do templo» esclarece o espaço, enquanto a nota preserva alternativas legítimas.
