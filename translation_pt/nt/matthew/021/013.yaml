id: MAT.21.13
reference: Matthew 21:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Γέγραπται· Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται, ὑμεῖς δὲ αὐτὸν ⸀ποιεῖτε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: pt
  text: 'E lhes diz: “Está escrito[a]: ‘Minha casa será chamada casa de oração’, mas vocês estão fazendo dela um covil de ladrões[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jesus combina Isaías 56:7 com Jeremias 7:11.
    reason: cross_reference
  - marker: b
    text: Ou “salteadores”. O termo grego pode se referir a ladrões ou a assaltantes violentos.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico grego, que dá vivacidade à narrativa, sem alisá-lo para o passado.
- source_word: Γέγραπται
  choice: Está escrito
  rationale: Fórmula portuguesa consagrada para introduzir uma citação das Escrituras; o perfeito passivo grego apresenta o texto como escrito e ainda vigente.
- source_word: οἶκός μου
  choice: Minha casa
  rationale: Preserva a imagem e a formulação escriturística de ‘casa’, evitando substituir o termo por ‘templo’, que seria mais interpretativo.
- source_word: οἶκος προσευχῆς
  choice: casa de oração
  rationale: Reproduz de modo natural e reconhecível a construção genitiva e a linguagem de Isaías 56:7.
- source_word: κληθήσεται
  choice: será chamada
  rationale: Tradução direta do futuro passivo, em português atual.
- source_word: ποιεῖτε
  choice: estão fazendo
  rationale: Expressa a ação presente em curso no contexto e permanece próxima do verbo grego, sem explicitar além do texto a ideia de ‘transformar’.
- source_word: σπήλαιον
  choice: covil
  rationale: Em português, ‘covil’ comunica naturalmente um esconderijo ou abrigo de criminosos e preserva o eco profético de Jeremias 7:11.
- source_word: λῃστῶν
  choice: ladrões
  rationale: É o equivalente amplo e natural no contexto; o termo grego também pode designar assaltantes violentos ou salteadores, possibilidade registrada em nota.
theological_decisions:
- issue: Citação e alusão ao Antigo Testamento
  choice: Preservar a formulação reconhecível de Isaías 56:7 (‘Minha casa será chamada casa de oração’) e Jeremias 7:11 (‘covil de ladrões’).
  alternative: Empregar uma paráfrase contemporânea mais livre que torne menos visíveis as ligações intertextuais.
  rationale: A declaração de Jesus combina linguagem profética de duas passagens; manter esses ecos permite que a relação com as Escrituras permaneça transparente, sem resolver ou ampliar a acusação além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O presente histórico ‘diz’ conserva a vivacidade de Mateus; ‘vocês’ oferece uma forma plural clara e corrente. As citações mantêm linguagem bíblica reconhecível sem arcaísmos.
