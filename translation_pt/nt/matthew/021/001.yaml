id: MAT.21.1
reference: Matthew 21:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤγγισαν εἰς Ἱεροσόλυμα καὶ ἦλθον εἰς Βηθφαγὴ ⸀εἰς τὸ Ὄρος τῶν Ἐλαιῶν, τότε ⸀Ἰησοῦς ἀπέστειλεν δύο μαθητὰς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/001.yaml
  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
translation:
  language: pt
  text: Quando se aproximaram de Jerusalém e chegaram a Betfagé, junto ao monte das Oliveiras[a], então Jesus enviou dois discípulos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “... chegaram a Betfagé, ao monte das Oliveiras”.'
    reason: A segunda expressão com εἰς admite uma leitura mais diretamente direcional/aposicional; a nota preserva essa possibilidade sem tornar a frase principal menos natural em português.
lexical_decisions:
- source_word: ἤγγισαν
  choice: se aproximaram
  rationale: O aoristo de ἐγγίζω indica aproximação espacial; a forma pronominal é natural em português e mantém o movimento em direção a Jerusalém.
- source_word: Ἱεροσόλυμα
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome do lugar.
- source_word: ἦλθον
  choice: chegaram
  rationale: Neste contexto, ἔρχομαι descreve a chegada a Betfagé; “chegaram” distingue naturalmente esse movimento da aproximação expressa pelo verbo anterior.
- source_word: Βηθφαγὴ
  choice: Betfagé
  rationale: Transliteração tradicional e amplamente reconhecida em português.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: no monte das Oliveiras
  rationale: A expressão situa Betfagé em relação ao monte das Oliveiras. “No” comunica de modo idiomático a localização, sem sugerir que o grupo chegou primeiro a Betfagé e depois entrou no monte.
- source_word: τότε
  choice: Jesus enviou
  rationale: A sequência narrativa indicada por τότε é transmitida naturalmente pela ordem das orações em português; traduzir também por “então” seria possível, mas desnecessário e menos fluente.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Equivalente direto e corrente para o ato de mandar os discípulos cumprir uma tarefa.
- source_word: δύο μαθητὰς
  choice: dois discípulos
  rationale: Tradução direta do numeral e do substantivo no contexto narrativo dos Evangelhos.
theological_decisions:
- issue: Sujeito narrativo dos verbos no plural antes de Jesus ser nomeado
  choice: Manter o sujeito implícito em “se aproximaram” e “chegaram”, nomeando Jesus somente quando o grego o faz.
  alternative: 'Explicitar: “Jesus e seus discípulos se aproximaram...”'
  rationale: Os verbos gregos no plural pressupõem um grupo, mas o versículo não repete explicitamente “Jesus e seus discípulos”. A tradução preserva essa economia narrativa sem acrescentar um sujeito composto.
- issue: Relação geográfica de Betfagé com o monte das Oliveiras
  choice: “Betfagé, no monte das Oliveiras”
  alternative: “Betfagé, até o monte das Oliveiras” ou “Betfagé, junto ao monte das Oliveiras”
  rationale: O segundo εἰς pode ser entendido como indicação geográfica ligada a Betfagé. A opção escolhida mantém a localização sem impor uma etapa adicional de deslocamento.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção evita explicitar sujeitos ausentes do texto grego e usa a forma tradicional dos topônimos.
