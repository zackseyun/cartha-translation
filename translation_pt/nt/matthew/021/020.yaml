  text: καὶ ἰδόντες οἱ μαθηταὶ ἐθαύμασαν λέγοντες· Πῶς παραχρῆμα ἐξηράνθη ἡ συκῆ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/020.yaml
  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: pt
  text: 'Ao verem isso, os discípulos ficaram admirados e perguntaram: “Como a figueira secou de imediato?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: Ao verem isso
  rationale: O particípio aoristo é expresso temporalmente. “Isso” retoma de modo natural o estado da figueira mencionado no contexto, sem limitar a referência apenas à árvore.
- source_word: ἐθαύμασαν
  choice: ficaram admirados
  rationale: Expressa o espanto dos discípulos em português atual e digno; “maravilharam-se” seria possível, mas soa menos corrente.
- source_word: λέγοντες
  choice: e perguntaram
  rationale: Embora literalmente signifique “dizendo”, introduz aqui uma pergunta direta; esta formulação reproduz naturalmente a função discursiva em português.
- source_word: Πῶς
  choice: Como
  rationale: Mantém a pergunta sobre o modo ou a causa do acontecimento sem explicá-la além do texto.
- source_word: παραχρῆμα
  choice: de imediato
  rationale: Preserva diretamente o valor temporal de algo ocorrido imediatamente ou de uma vez, em registro natural e sóbrio.
- source_word: ἐξηράνθη
  choice: secou
  rationale: No contexto de uma árvore, o aoristo passivo pode ser traduzido naturalmente pelo verbo intransitivo “secar”; “ficou seca” e “definhou” são alternativas possíveis.
- source_word: ἡ συκῆ
  choice: a figueira
  rationale: Equivalente português específico e comum para a árvore indicada por συκῆ.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A ordem e o encadeamento foram ajustados à sintaxe portuguesa, preservando o espanto e a pergunta dos discípulos. Não se reproduziu a nota inglesa, pois ela está associada a “it”, mas seu conteúdo repete uma alternativa para a pergunta e não esclarece uma variante real necessária no texto português.
