  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: pt
  text: 'Ouçam outra parábola: Havia um proprietário de terras que plantou uma vinha, colocou uma cerca ao redor dela[b], cavou nela um lagar e construiu uma torre[a], e a arrendou a lavradores[c], e foi embora.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A imagem de plantar uma vinha, cercá-la, cavar nela um lagar e construir uma torre remete a Isaías 5:1–2.
    reason: cross_reference
  - marker: b
    text: Ou “colocou uma sebe ao redor dela”. O termo grego pode designar uma barreira de delimitação, como uma cerca ou uma sebe.
    reason: lexical_alternative
  - marker: c
    text: Ou “alugou a vinha a agricultores”. A expressão se refere ao arrendamento da vinha a cultivadores que trabalhariam nela.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: Ouçam outra parábola
  rationale: O imperativo aoristo plural ἀκούσατε é expresso naturalmente por “Ouçam”, e “parábola” é o termo corrente e preciso para παραβολή neste contexto.
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: Havia um proprietário de terras
  rationale: A construção introdutória é vertida de modo idiomático por “Havia”. No cenário agrícola, “proprietário de terras” comunica com clareza o papel de οἰκοδεσπότης como dono da propriedade.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: plantou uma vinha
  rationale: Mantém o sentido concreto de φυτεύω e ἀμπελών, bem como a imagem agrícola que remete a Isaías 5.
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: colocou uma cerca ao redor dela
  rationale: φραγμός designa uma barreira de proteção ou delimitação, que podia ser cerca ou sebe. “Cerca” é clara e não especifica indevidamente o material.
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: cavou nela um lagar
  rationale: “Lagar” é o termo português tradicional e ainda compreensível para a instalação em que as uvas eram prensadas; “cavou” representa diretamente ὤρυξεν.
- source_word: ᾠκοδόμησεν πύργον
  choice: construiu uma torre
  rationale: Traduz πύργος sem acrescentar a função provável, mas não explicitada, de vigilância.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: arrendou a vinha a lavradores
  rationale: O médio ἐξέδετο indica arrendamento. “Lavradores” expressa γεωργοί como cultivadores responsáveis pela vinha; a repetição de “a vinha” evita a ambiguidade pronominal em português.
- source_word: ἀπεδήμησεν
  choice: partiu para longe
  rationale: Expressa a ideia de deixar a própria região e ausentar-se, sem acrescentar um destino específico.
theological_decisions:
- issue: Alusão da imagem da vinha a Isaías 5
  choice: Manter no texto as imagens agrícolas concretas e indicar a alusão em nota.
  alternative: Empregar formulação mais arcaizante ou inserir no texto uma referência explícita a Isaías.
  rationale: A correspondência com Isaías 5:1–2 é relevante, mas deve emergir das imagens presentes no grego, sem transformar uma alusão em explicação interpretativa no corpo do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vinha”, “lagar” e “lavradores” preservam a concretude e o tom bíblico sem recorrer a sintaxe arcaica. Os marcadores foram colocados imediatamente após os elementos a que suas notas se referem.
