id: MAT.21.27
reference: Matthew 21:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: pt
  text: 'Eles responderam a Jesus: “Não sabemos.” Ele, por sua vez, lhes disse: “Nem eu lhes digo com que autoridade faço estas coisas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: responderam
  rationale: O particípio introduz a resposta deles; em português, a forma verbal finita produz uma frase natural e preserva a função discursiva.
- source_word: Οὐκ οἴδαμεν
  choice: Não sabemos
  rationale: Tradução direta da negação do verbo de conhecimento, adequada ao diálogo formal.
- source_word: ἔφη
  choice: disse
  rationale: Verbo de fala comum, natural e sem carga interpretativa adicional.
- source_word: καὶ αὐτός
  choice: Então ele ... também
  rationale: Expressa a resposta recíproca de Jesus; “também” mantém a correspondência entre a recusa deles e a dele, enquanto “então” torna clara a progressão do diálogo.
- source_word: Οὐδὲ ἐγὼ
  choice: Eu também não
  rationale: 'Forma idiomática em português para a reciprocidade negativa: visto que eles não respondem, Jesus também não declara sua autoridade.'
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Preserva o presente grego e traduz naturalmente o objeto indireto plural.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: com que autoridade
  rationale: Expressão portuguesa natural para indicar a autoridade com base na qual alguém age, sem reduzi-la a mera capacidade.
- source_word: ταῦτα
  choice: estas coisas
  rationale: Mantém o demonstrativo plural, que remete às ações de Jesus em discussão.
- source_word: ποιῶ
  choice: faço
  rationale: O presente simples corresponde naturalmente ao presente grego e descreve as ações de Jesus no contexto imediato.
theological_decisions:
- issue: Sentido de ἐξουσία na resposta de Jesus
  choice: autoridade
  alternative: direito; poder
  rationale: No contexto da controvérsia, a questão é a legitimidade ou fonte da atuação de Jesus. “Autoridade” preserva essa força jurídica e teológica sem sugerir apenas capacidade.
- issue: Valor temporal e pragmático de λέγω em Οὐδὲ ἐγὼ λέγω ὑμῖν
  choice: Eu também não lhes digo
  alternative: Eu também não lhes direi
  rationale: A forma escolhida preserva o presente do texto grego, que em contexto funciona como recusa de revelar a informação. O futuro seria idiomático, mas explicitaria uma nuance temporal não marcada morfologicamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi suavemente reorganizada para naturalidade, sem eliminar a reciprocidade enfática da resposta de Jesus nem o plural “estas coisas”.
