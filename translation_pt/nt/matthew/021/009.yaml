  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: pt
  text: 'As multidões que iam à frente dele e as que o seguiam gritavam, dizendo: “Hosana[a] ao Filho de Davi![b] Bendito é aquele que vem em nome do Senhor![c] Hosana nas alturas!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosana” é uma aclamação derivada do hebraico, com sentido semelhante a “salva, por favor” ou “salva agora”; aqui, porém, também funciona como um grito de louvor.
    reason: lexical_alternative
  - marker: b
    text: “Filho de Davi” é um título régio messiânico.
    reason: cultural_note
  - marker: c
    text: Estas palavras ecoam o Salmo 118:26; ali, “Senhor” corresponde ao nome divino YHWH no texto hebraico.
    reason: cross_reference
lexical_decisions:
- source_word: ὄχλοι
  choice: multidões
  rationale: “Multidões” expressa naturalmente grupos numerosos de pessoas e mantém o plural do grego.
- source_word: προάγοντες αὐτόν
  choice: iam à frente dele
  rationale: Descreve com clareza os que avançavam diante de Jesus na procissão, sem sugerir que o conduziam formalmente.
- source_word: ἀκολουθοῦντες
  choice: as que o seguiam
  rationale: Mantém o contraste processional entre os grupos que estavam à frente e atrás de Jesus.
- source_word: ἔκραζον λέγοντες
  choice: gritavam, dizendo
  rationale: O imperfeito “gritavam” preserva a ação contínua, e “dizendo” representa o particípio λέγοντες sem alterar a forma narrativa.
- source_word: Ὡσαννά
  choice: Hosana
  rationale: A transliteração consagrada preserva seu caráter de aclamação litúrgica; o sentido hebraico subjacente é explicado em nota.
- source_word: τῷ υἱῷ Δαυίδ
  choice: ao Filho de Davi
  rationale: A preposição “a” expressa naturalmente o dativo da aclamação e conserva o título davídico presente no texto.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Bendito o que vem
  rationale: Forma concisa e idiomática que preserva o particípio substantivado e o referente singular.
- source_word: ἐν ὀνόματι κυρίου
  choice: em nome do Senhor
  rationale: Mantém a formulação bíblica tradicional, a alusão ao salmo e a ideia de representação ou autoridade sem explicitar além do texto.
- source_word: κυρίου
  choice: Senhor
  rationale: Traduz diretamente o grego κύριος; a relação com o nome divino no texto hebraico do salmo é indicada em nota.
- source_word: ἐν τοῖς ὑψίστοις
  choice: nas alturas
  rationale: Expressão portuguesa natural e litúrgica que aponta para a esfera celestial mais elevada sem especificá-la além do grego.
theological_decisions:
- issue: Título régio messiânico em τῷ υἱῷ Δαυίδ
  choice: Conservar “Filho de Davi” como título no texto principal.
  alternative: Traduzir interpretativamente como “Messias”.
  rationale: O grego emprega explicitamente o título davídico; preservá-lo mantém a textura histórica e teológica sem substituir o texto por sua interpretação.
- issue: Sentido de Ὡσαννά
  choice: Manter “Hosana” no texto principal e explicar seu sentido de origem em nota.
  alternative: Traduzir diretamente como “Salva-nos, por favor” ou “Salva agora”.
  rationale: Neste contexto, o termo funciona como aclamação litúrgica e também carrega sua origem como súplica; a transliteração com nota conserva ambas as dimensões.
- issue: Referência de κυρίου na citação do Salmo 118
  choice: Traduzir como “Senhor” e registrar em nota o pano de fundo de YHWH.
  alternative: Usar “SENHOR” no texto principal.
  rationale: O texto grego traz κύριος. A nota preserva a conexão com o nome divino no salmo hebraico sem substituir a forma da fonte grega.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção processional e o aspecto contínuo do clamor foram preservados; as expressões litúrgicas tradicionais “Hosana”, “Filho de Davi” e “nas alturas” foram mantidas por sua clareza e ressonância bíblica.
