  text: Καὶ προσῆλθον αὐτῷ ⸂τυφλοὶ καὶ χωλοὶ⸃ ἐν τῷ ἱερῷ, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/014.yaml
  text: And the blind and the lame came to him in the temple[a], and he healed them.
translation:
  language: pt
  text: E pessoas cegas e pessoas com dificuldade para andar se aproximaram dele no templo[a], e ele as curou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego ἱερόν se refere ao complexo ou aos recintos do templo, não especificamente ao santuário interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: se aproximaram
  rationale: Expressa naturalmente o movimento em direção a Jesus indicado por προσέρχομαι, sem acrescentar uma ideia ausente no grego.
- source_word: τυφλοὶ
  choice: cegos
  rationale: O adjetivo substantivado plural refere-se a pessoas cegas; a forma concisa preserva o paralelismo da frase grega.
- source_word: χωλοὶ
  choice: pessoas com deficiência para andar
  rationale: Comunica em português atual a limitação de mobilidade indicada por χωλός, evitando termos que hoje podem soar pejorativos ou imprecisos.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: É a formulação portuguesa mais natural; a nota esclarece que ἱερόν designa o complexo ou recinto do templo, e não especificamente o santuário interior.
- source_word: ἐθεράπευσεν
  choice: curou
  rationale: No contexto dos relatos de milagres, θεραπεύω indica restaurar a saúde; “curou” é claro e idiomático.
theological_decisions:
- issue: Local das curas indicado por ἱερόν
  choice: Jesus os curou no complexo do templo.
  alternative: Jesus os curou nos pátios do templo.
  rationale: ἱερόν normalmente se refere ao conjunto do templo, não ao santuário interior. O texto usa a expressão natural “no templo”, enquanto a nota preserva a precisão espacial sem definir um pátio específico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Pessoas com deficiência para andar” prioriza linguagem respeitosa e compreensível; “no templo” mantém fluidez, com a precisão lexical na nota.
