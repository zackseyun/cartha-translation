  text: πορευθέντες δὲ οἱ μαθηταὶ καὶ ποιήσαντες καθὼς ⸀συνέταξεν αὐτοῖς ὁ Ἰησοῦς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/006.yaml
  text: So the disciples went and did just as Jesus had instructed them[a].
translation:
  language: pt
  text: Os discípulos foram e fizeram exatamente como Jesus os havia instruído.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «havia ordenado». O verbo grego pode indicar tanto dar ordens como dar instruções; neste contexto, «instruído» se ajusta melhor às orientações específicas dadas por Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθέντες
  choice: foram
  rationale: O particípio aoristo tem função adverbial e antecede a ação seguinte; em narrativa portuguesa, a coordenação com «foram» é natural e preserva a sequência.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: A partícula marca a continuação narrativa; a ligação ao contexto já fica clara em português sem um conectivo explícito, evitando um «então» ou «por isso» mais interpretativo.
- source_word: μαθηταὶ
  choice: os discípulos
  rationale: É a designação corrente e contextualmente adequada para os seguidores de Jesus nos Evangelhos.
- source_word: ποιήσαντες
  choice: fizeram
  rationale: O segundo particípio aoristo coordena-se naturalmente com o primeiro como verbo finito em português; «fizeram» mantém a formulação simples do grego.
- source_word: καθὼς
  choice: exatamente como
  rationale: Expressa com clareza a correspondência entre a ação dos discípulos e as instruções de Jesus, sem acrescentar conteúdo.
- source_word: συνέταξεν
  choice: havia instruído
  rationale: O verbo pode indicar ordenar ou dar instruções. O contexto imediato contém orientações específicas, e o mais-que-perfeito composto esclarece que elas precederam o cumprimento.
- source_word: αὐτοῖς
  choice: lhes
  rationale: Pronome de objeto indireto natural com «instruir» nesta construção.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: O artigo grego diante do nome próprio não precisa ser reproduzido em português.
