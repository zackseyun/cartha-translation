  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his slaves; one they beat[a], another they killed, and another they stoned.
translation:
  language: pt
  text: 'E os lavradores agarraram os escravos[a] dele: espancaram um, mataram outro e apedrejaram outro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos”. A palavra grega pode ter ambos os sentidos, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: lavradores
  rationale: No contexto da parábola da vinha, designa os homens que cultivavam a propriedade alheia como arrendatários. “Lavradores” é natural em português e, pelo contexto, comunica essa função sem uma expressão pesada.
- source_word: λαβόντες
  choice: agarraram
  rationale: O particípio aoristo indica uma ação anterior aos três atos seguintes. “Agarraram” transmite de modo natural a captura hostil, sem especificar indevidamente prisão formal.
- source_word: δούλους
  choice: escravos
  rationale: Preserva o sentido social básico de δοῦλος e a relação de sujeição ao proprietário. Como “servos” também é possível neste contexto de agentes enviados, a alternativa é registrada em nota.
- source_word: ἔδειραν
  choice: espancaram
  rationale: Expressa uma surra ou agressão física repetida, sentido próprio do verbo, sem limitar o instrumento ou o método como faria “açoitaram”.
- source_word: ἀπέκτειναν
  choice: mataram
  rationale: Correspondência direta e natural, sem acrescentar a qualificação jurídico-moral de “assassinaram”.
- source_word: ἐλιθοβόλησαν
  choice: apedrejaram
  rationale: Verbo português preciso e corrente para atacar ou matar mediante o lançamento de pedras.
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: um ... outro ... outro
  rationale: Reproduz claramente a distribuição de tratamentos diferentes entre os escravos, em ordem fiel ao grego.
theological_decisions:
- issue: Tradução de δοῦλος na narrativa parabólica
  choice: escravos
  alternative: servos
  rationale: “Escravos” mantém visível a condição de sujeição expressa pelo termo grego, enquanto “servos” pode salientar a função de enviados do proprietário. A tradução principal evita suavizar a relação social; a nota preserva a alternativa contextual legítima.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação finita substitui naturalmente o particípio grego. “Lavradores” se encaixa no contexto da vinha; “agarraram” torna explícito o caráter hostil já demonstrado pelas ações seguintes.
