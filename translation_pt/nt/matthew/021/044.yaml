  text: ⸂Καὶ ὁ πεσὼν ἐπὶ τὸν λίθον τοῦτον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ λικμήσει αὐτόν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
translation:
  language: pt
  text: E quem cair sobre esta pedra será despedaçado; mas aquele sobre quem ela cair, ela o reduzirá a pó.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo está ausente em alguns manuscritos de Mateus, embora tenha paralelo em Lucas 20:18.
    reason: textual_variant
  - marker: b
    text: 'Ou: “ela o esmagará”; o verbo também pode evocar a ideia de dispersar como palha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πεσὼν
  choice: quem cair
  rationale: O particípio substantivado tem sentido genérico; “quem cair” é natural em português e preserva a força proverbial.
- source_word: ἐπὶ τὸν λίθον τοῦτον
  choice: sobre esta pedra
  rationale: Mantém a imagem concreta de λίθος e sua ligação com o contexto imediato.
- source_word: συνθλασθήσεται
  choice: será despedaçado
  rationale: Expressa o futuro passivo e a ideia de ser quebrado em pedaços, sem enfraquecer a gravidade da imagem.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: mas aquele sobre quem ela cair
  rationale: 'Preserva a inversão: agora a pedra é o sujeito que cai, e a construção relativa indefinida é vertida de modo claro.'
- source_word: λικμήσει
  choice: reduzirá a pó
  rationale: Comunica vividamente a força do verbo, que pode descrever esmagar ou pulverizar, e o distingue de συνθλασθήσεται.
- source_word: αὐτόν
  choice: o
  rationale: O pronome masculino singular retoma a pessoa representada genericamente por “aquele”.
theological_decisions:
- issue: Imagem da pedra e metáfora de juízo
  choice: Manter a pedra concreta e os dois movimentos de impacto sem identificar explicitamente a pedra no texto do versículo.
  alternative: Explicitar “Messias” ou “Jesus”, ou uniformizar os dois verbos como uma única ideia de destruição.
  rationale: O contexto fornece a aplicação da imagem, mas o versículo conserva forma proverbial; a tradução não deve inserir uma interpretação teológica na redação.
- issue: Referência masculina singular genérica
  choice: Usar “aquele” e o pronome “o”.
  alternative: Empregar uma formulação plural ou impessoal.
  rationale: A construção grega é masculina singular e genericamente representativa; o português pode preservar essa forma com naturalidade.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe proverbial. “Será despedaçado” e “reduzirá a pó” preservam a diferença e a progressão entre os dois verbos gregos.
