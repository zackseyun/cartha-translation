id: MAT.21.21
reference: Matthew 21:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: pt
  text: 'Mas Jesus lhes respondeu: “Em verdade lhes digo: se vocês tiverem fé e não duvidarem[a], não somente farão o que foi feito à figueira, mas, até mesmo se disserem a este monte: ‘Seja levantado e lançado ao mar’, isso acontecerá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não vacilarem” ou “não ficarem divididos interiormente”.
    reason: Alternativas lexicais para διακριθῆτε, que pode descrever dúvida, hesitação ou divisão interior.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Mas Jesus lhes respondeu
  rationale: Reproduz de modo natural a resposta de Jesus e o valor levemente contrastivo ou transitivo de δέ, sem uma construção participial artificial em português.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Em verdade lhes digo
  rationale: Mantém o caráter solene e enfático da fórmula de Jesus em linguagem digna e amplamente compreensível.
- source_word: ἐὰν ἔχητε πίστιν
  choice: se vocês tiverem fé
  rationale: Neste contexto, πίστις indica confiança em Deus; “fé” é a correspondência portuguesa natural e tradicional sem introduzir a ideia distinta de fidelidade.
- source_word: μὴ διακριθῆτε
  choice: não duvidarem
  rationale: Expressa claramente a hesitação interior indicada pelo verbo neste contexto; a possibilidade de vacilar ou ficar dividido é preservada em nota.
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: não somente farão o que foi feito à figueira
  rationale: Explicita com naturalidade a expressão grega elíptica, remetendo ao acontecimento com a figueira no contexto imediato.
- source_word: κἂν τῷ ὄρει τούτῳ εἴπητε
  choice: mas, ainda que digam a este monte
  rationale: “Ainda que” comunica a extensão enfática de καὶ ἐάν ao exemplo maior, e “este monte” preserva o demonstrativo e a imagem concreta.
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: Seja levantado e lançado ao mar
  rationale: Conserva os dois imperativos passivos e a imagem física vívida, com formulação corrente em português.
- source_word: γενήσεται
  choice: isso acontecerá
  rationale: Traduz diretamente a ocorrência futura do acontecimento e fornece um referente natural para a oração citada.
theological_decisions:
- issue: Sentido de πίστις em uma declaração sobre ação extraordinária
  choice: fé
  alternative: confiança; fidelidade
  rationale: O contexto favorece confiança em Deus, não fidelidade como qualidade de caráter. “Fé” mantém o termo teológico sem restringir indevidamente seu sentido.
- issue: Natureza da declaração sobre mover um monte
  choice: Preservar a imagem enfática sem decidir se deve ser lida estritamente como milagre literal ou apenas como metáfora
  alternative: Promessa estritamente literal de deslocamento milagroso; simples metáfora para superar dificuldades
  rationale: A tradução retém a formulação concreta e vigorosa do grego, deixando aberta a tensão interpretativa do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para o plural de segunda pessoa. A sintaxe acompanha de perto o grego, mas evita construções pouco naturais. O marcador [a] aparece imediatamente após a expressão anotada.
