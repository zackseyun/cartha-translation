  text: καὶ πάντα ὅσα ⸀ἂν αἰτήσητε ἐν τῇ προσευχῇ πιστεύοντες λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/022.yaml
  text: And whatever you ask in prayer[a], believing[b], you will receive.
translation:
  language: pt
  text: E tudo o que vocês pedirem[a] em oração, crendo[b], vocês receberão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “qualquer coisa que vocês pedirem” ou “todas as coisas que pedirem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “confiando”; o particípio grego indica que se crê enquanto se ora.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: tudo o que
  rationale: A combinação é uma expressão abrangente que significa “tudo o que” ou “qualquer coisa que”. “Tudo o que” é natural em português e preserva o alcance aberto da expressão.
- source_word: ἂν αἰτήσητε
  choice: vocês pedirem
  rationale: ἄν com o subjuntivo aoristo forma aqui uma oração relativa indefinida. O futuro do subjuntivo em português expressa isso naturalmente, sem acrescentar uma incerteza que o contexto não exige.
- source_word: ἐν τῇ προσευχῇ
  choice: em oração
  rationale: A expressão idiomática “em oração” conserva o substantivo grego e soa natural em português; o artigo grego não exige a forma “na oração”.
- source_word: πιστεύοντες
  choice: crendo
  rationale: O particípio presente indica uma ação concomitante ao pedir. “Crendo” preserva de modo conciso a forma participial e a ligação entre oração e fé, sem convertê-la numa condição explícita.
- source_word: λήμψεσθε
  choice: vocês receberão
  rationale: O futuro de λαμβάνω é traduzido naturalmente por “receberão”; não é necessário marcar de modo especial a voz média neste contexto.
theological_decisions:
- issue: Relação entre a fé e a oração atendida
  choice: crendo
  alternative: se vocês crerem
  rationale: O texto associa claramente a oração à fé, mas usa um particípio, não uma oração condicional explícita. “Crendo” mantém essa forma e evita definir além do texto como se dá ou qual é o alcance da resposta à oração.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural de segunda pessoa, visando ampla legibilidade internacional e brasileira. A construção mantém a abrangência da promessa e a tensão teológica do original sem acrescentar qualificações.
