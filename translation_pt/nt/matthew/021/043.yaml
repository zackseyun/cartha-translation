  verdict: approve
  source_fidelity: A tradução preserva a inferência de διὰ τοῦτο, o endereço plural, os dois futuros passivos e a transferência da «basileia» de Deus. «Um povo» é uma tradução lexicalmente legítima de ἔθνει e mantém sem resolução a identidade do destinatário. «Os frutos do Reino» explicita de modo fiel o referente mais natural de αὐτῆς, a saber, «o Reino de Deus».
  naturalness: O português é moderno, claro e natural para leitores brasileiros e internacionais. «Por isso, eu lhes digo» e «será tirado de vocês e dado» têm boa fluidez e mantêm o registro solene, mas acessível, do discurso.
  terminology: «Reino de Deus» é consistente e apropriado para βασιλεία τοῦ θεοῦ. «Povo» evita a conotação estatal que «nação» poderia sugerir, enquanto a nota registra adequadamente a alternativa lexical. «Que produza os frutos do Reino» comunica de forma idiomática a caracterização dada pelo particípio ποιοῦντι.
