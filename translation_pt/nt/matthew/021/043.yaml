  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
translation:
  language: pt
  text: 'Por isso, eu lhes digo: o Reino de Deus será tirado de vocês e dado a um povo[a] que produza os frutos do Reino.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a uma nação”. O grego ἔθνει pode designar uma nação ou um povo; aqui, o grupo coletivo é identificado por produzir os frutos do Reino, sem que o termo, por si só, especifique mais precisamente quem ele é.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Introduz naturalmente a conclusão decorrente da parábola e da citação anteriores, preservando a força inferencial.
- source_word: λέγω ὑμῖν
  choice: eu lhes digo
  rationale: Fórmula direta e corrente em português, que mantém a ênfase pessoal e o endereço plural.
- source_word: ἀρθήσεται ἀφ’ ὑμῶν
  choice: será tirado de vocês
  rationale: Preserva o futuro passivo e a ideia de remoção e perda expressa pelo verbo com a preposição de separação.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: Expressão bíblica estabelecida que conserva a amplitude de βασιλεία, abrangendo reinado e domínio sem reduzi-la a uma paráfrase.
- source_word: δοθήσεται
  choice: e dado
  rationale: Mantém o futuro passivo coordenado; em português, o auxiliar já expresso pode ser naturalmente subentendido.
- source_word: ἔθνει
  choice: a um povo
  rationale: No singular, ἔθνος pode designar uma nação ou um povo como corpo coletivo. “Povo” é natural neste contexto e evita sugerir necessariamente um Estado nacional ou identificar de modo indevido o grupo.
- source_word: ποιοῦντι
  choice: que produza
  rationale: Expressa a ação característica do destinatário coletivo e combina naturalmente com a metáfora dos frutos.
- source_word: τοὺς καρποὺς αὐτῆς
  choice: os frutos do Reino
  rationale: Explicita o referente mais natural do pronome feminino αὐτῆς, a βασιλεία, evitando em português a possível leitura de que os frutos pertencem ao povo. Conserva o plural do grego.
theological_decisions:
- issue: Identidade do povo designado por ἔθνει
  choice: Mantida genericamente como “um povo”, definido apenas por produzir os frutos do Reino.
  alternative: Identificá-lo explicitamente como a Igreja, os gentios ou um Israel renovado.
  rationale: O grego indica um corpo coletivo frutífero, mas não impõe por si só uma dessas identificações teológicas mais específicas.
- issue: Sentido de “o Reino de Deus” nesta declaração de juízo
  choice: Conservada a expressão “o Reino de Deus”.
  alternative: Parafrasear como “o privilégio de pertencer ao povo de Deus” ou apenas “o governo de Deus”.
  rationale: A formulação direta preserva toda a amplitude teológica da expressão grega e não restringe antecipadamente a natureza daquilo que é retirado e dado.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Vocês” torna explícito o plural de ὑμῖν e ὑμῶν. A repetição de “Reino” no fim evita uma ambiguidade referencial pouco natural em português.
