source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι ἔλεγον· Οὗτός ἐστιν ⸂ὁ προφήτης Ἰησοῦς⸃ ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: pt
  text: 'E as multidões diziam: “Este é o profeta Jesus, de Nazaré da Galileia.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um profeta”. O grego traz “o profeta”, expressão que pode refletir a identificação de Jesus pelas multidões como uma figura profética reconhecida.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: E as multidões
  rationale: Mantém o plural de ὄχλοι e representa δέ como conexão narrativa leve; “multidões” é natural e dignificado em português.
- source_word: ἔλεγον
  choice: diziam
  rationale: O pretérito imperfeito preserva naturalmente o aspecto contínuo ou repetido do imperfeito grego.
- source_word: Οὗτός ἐστιν
  choice: Este é
  rationale: Equivalência direta e idiomática para a construção identificadora com demonstrativo e cópula.
- source_word: ὁ προφήτης
  choice: o profeta
  rationale: Conserva o artigo definido do grego e a possível identificação de Jesus como figura profética reconhecida, sem tornar essa associação mais explícita.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Emprega a forma portuguesa estabelecida do nome próprio.
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: de Nazaré da Galileia
  rationale: Reproduz de modo conciso a identificação pela procedência e conserva a relação geográfica do genitivo τῆς Γαλιλαίας; a formulação é corrente em português bíblico moderno.
theological_decisions:
- issue: Se ὁ προφήτης deve ser traduzido com artigo definido ou indefinido
  choice: o profeta
  alternative: um profeta
  rationale: O texto grego traz o artigo definido e pode evocar uma figura profética reconhecida ou esperada. A tradução mantém essa possibilidade e a tensão teológica, enquanto a nota registra a leitura indefinida possível.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O registro é claro e dignificado; o imperfeito “diziam” preserva o aspecto verbal grego sem explicitação excessiva.
