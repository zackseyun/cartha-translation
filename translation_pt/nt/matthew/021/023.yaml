id: MAT.21.23
reference: Matthew 21:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: pt
  text: 'Quando Jesus entrou no templo[a], os principais sacerdotes e os anciãos do povo aproximaram-se dele enquanto ensinava e perguntaram: “Com que autoridade você faz estas coisas? E quem lhe deu essa autoridade?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego se refere ao conjunto do templo ou aos seus pátios, não especificamente ao santuário interior.
    reason: Nota cultural e lexical que distingue ἱερόν de ναός.
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Quando Jesus entrou
  rationale: O genitivo absoluto tem valor temporal. Repetir “Jesus” em vez de usar apenas “ele” produz uma abertura natural e clara em português, sem alterar o referente.
- source_word: ἱερὸν
  choice: templo
  rationale: Ἱερόν designa o conjunto ou recinto do templo, não especificamente o santuário interior. “Templo” é a forma corrente e legível; a extensão do termo é esclarecida em nota.
- source_word: προσῆλθον αὐτῷ
  choice: aproximaram-se dele
  rationale: Expressa de maneira natural o movimento de chegar junto a Jesus, sem acrescentar intenção não indicada no grego.
- source_word: διδάσκοντι
  choice: enquanto ensinava
  rationale: O particípio presente indica simultaneidade com a aproximação dos líderes.
- source_word: οἱ ἀρχιερεῖς
  choice: os principais sacerdotes
  rationale: O plural se refere às autoridades sacerdotais dirigentes, e não a vários ocupantes simultâneos do cargo singular de sumo sacerdote.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: os anciãos do povo
  rationale: Preserva a designação tradicional e compreensível dos líderes reconhecidos do povo.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: Com que autoridade
  rationale: A construção questiona a autorização ou o direito que fundamentava as ações de Jesus. “Com que autoridade” é idiomático e mantém essa força.
- source_word: ταῦτα ποιεῖς
  choice: você faz estas coisas
  rationale: O presente português comunica naturalmente a ação em curso e habitual sob contestação, sem precisar explicitar quais atos os interlocutores tinham em vista.
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: quem lhe deu essa autoridade
  rationale: O pretérito perfeito representa com naturalidade o ato de conceder a autoridade, enquanto “lhe” mantém registro digno e amplamente compreensível.
theological_decisions:
- issue: Sentido de ἐξουσία no desafio dos líderes
  choice: autoridade
  alternative: direito; poder
  rationale: O contexto trata da legitimidade e autorização das ações e do ensino de Jesus, não apenas de capacidade ou força. “Autoridade” conserva tanto a dimensão institucional quanto a possível tensão teológica, sem resolvê-la em favor de uma interpretação específica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Emprega “você” na fala direta por naturalidade no português brasileiro; “lhe” evita repetição e preserva um tom respeitoso. A ordem narrativa e as duas perguntas do original foram mantidas.
source_grounding:
  english_pob_role: consult_only
