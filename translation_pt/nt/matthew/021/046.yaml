id: MAT.21.46
reference: Matthew 21:46
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
translation:
  language: pt
  text: Embora procurassem prendê-lo, tiveram medo das multidões, porque elas o consideravam um profeta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητοῦντες
  choice: embora procurassem
  rationale: O particípio presente expressa uma intenção em curso; no contexto, a relação concessiva comunica que desejavam agir contra Jesus, mas o medo os conteve.
- source_word: κρατῆσαι
  choice: prendê-lo
  rationale: Neste contexto hostil, o verbo se refere a deter ou capturar Jesus, não apenas a segurá-lo fisicamente.
- source_word: ἐφοβήθησαν
  choice: tiveram medo
  rationale: Expressa de modo natural o aoristo e mantém as multidões como aquilo que eles temiam, sem impor uma nuance ingressiva.
- source_word: τοὺς ὄχλους
  choice: das multidões
  rationale: Preserva o plural grego e designa naturalmente os grupos de pessoas reunidos.
- source_word: ἐπεὶ
  choice: porque
  rationale: Introduz com clareza a razão pela qual temeram as multidões.
- source_word: εἰς προφήτην αὐτὸν εἶχον
  choice: elas o consideravam um profeta
  rationale: A construção idiomática significa ter ou considerar alguém como algo. O pronome explícito esclarece que a avaliação era das multidões.
- source_word: προφήτην
  choice: um profeta
  rationale: O substantivo sem artigo apresenta Jesus, segundo a percepção das multidões, como pertencente à categoria dos profetas.
theological_decisions:
- issue: Como expressar a avaliação das multidões sem reduzir nem ampliar a identidade de Jesus
  choice: elas o consideravam um profeta
  alternative: elas o tinham por profeta
  rationale: A formulação relata a percepção das multidões, sem afirmar que essa descrição esgota a identidade de Jesus nem negar seu caráter profético.
translation_notes:
  register: Português atual, digno e amplamente compreensível. “Prendê-lo” comunica a detenção pretendida; “elas” retoma explicitamente “as multidões” e evita ambiguidade de sujeito.
