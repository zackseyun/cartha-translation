  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἐρωτήσω ὑμᾶς κἀγὼ λόγον ἕνα, ὃν ἐὰν εἴπητέ μοι κἀγὼ ὑμῖν ἐρῶ ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: pt
  text: 'Mas Jesus lhes respondeu: “Eu também farei uma pergunta[a]. Se vocês me responderem, eu também lhes direi com que autoridade faço estas coisas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma questão”, ou, mais literalmente, “uma palavra”; a expressão grega λόγον ἕνα pode indicar uma pergunta ou um assunto em discussão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Mas Jesus lhes respondeu
  rationale: A construção idiomática com o particípio ἀποκριθείς e o verbo εἶπεν é expressa naturalmente por um único verbo em português; δέ marca aqui uma transição com leve contraste.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: Eu também farei uma pergunta
  rationale: O futuro de ἐρωτάω introduz uma contrapergunta, e κἀγώ ressalta a reciprocidade. Em português corrente, “fazer uma pergunta” é mais natural do que “perguntarei uma pergunta”.
- source_word: λόγον ἕνα
  choice: uma pergunta
  rationale: Embora λόγος possa significar literalmente “palavra” ou, neste caso, “questão/assunto”, o contexto interrogativo favorece “pergunta” como equivalente claro; a nota preserva as alternativas lexicais.
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: Se vocês me responderem
  rationale: Literalmente, a expressão é “a qual, se disserem a mim”; no contexto, refere-se a dar a resposta à pergunta. A formulação evita uma relativa pesada e conserva a condição.
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: eu também lhes direi
  rationale: Mantém o paralelismo recíproco do segundo κἀγώ e representa naturalmente λέγω como “dizer” neste contexto.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: com que autoridade
  rationale: A preposição ἐν com ἐξουσία indica a autoridade em virtude da qual Jesus age; “com que autoridade” é a formulação idiomática em português.
- source_word: ταῦτα ποιῶ
  choice: faço estas coisas
  rationale: Preserva o demonstrativo plural ταῦτα e o presente ποιῶ, referindo-se às ações de Jesus que estavam sendo questionadas.
