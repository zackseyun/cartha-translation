source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: pt
  text: 'Se alguém lhes disser alguma coisa, vocês dirão: “O Senhor[a] precisa deles”; e os enviará imediatamente.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o senhor” ou “o dono”. O termo grego também pode designar um senhor, mestre ou dono, conforme o contexto.'
    reason: lexical_alternative
  - marker: b
    text: O sujeito de “enviará” está implícito no grego. No contexto, pode referir-se à pessoa que falar com os discípulos; também se entende, por alguns, que se refere ao Senhor.
    reason: referential_ambiguity
lexical_decisions:
- source_word: ἐάν τις
  choice: se alguém
  rationale: Reproduz de modo natural a condição indefinida e aberta do grego.
- source_word: ὑμῖν
  choice: lhes
  rationale: Representa o dativo plural dirigido aos discípulos; o referente fica claro com “vocês” na oração seguinte.
- source_word: εἴπῃ τι
  choice: disser alguma coisa
  rationale: Mantém o sentido amplo de qualquer fala, objeção ou pergunta, sem restringi-lo a “perguntar”.
- source_word: ἐρεῖτε
  choice: vocês dirão
  rationale: Conserva a forma futura do grego e seu valor instrutivo, com clareza para o leitor moderno.
- source_word: Ὁ κύριος
  choice: O Senhor
  rationale: Preserva o título κύριος e sua possível força cristológica, sem eliminar a possibilidade contextual de “dono” ou “senhor” dos animais.
- source_word: χρείαν ἔχει
  choice: precisa
  rationale: Expressa de maneira direta e idiomática em português a locução grega “tem necessidade”.
- source_word: αὐτῶν
  choice: deles
  rationale: O pronome masculino plural retoma naturalmente os dois animais mencionados no contexto.
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Comunica com precisão a ideia de ação sem demora.
- source_word: ἀποστελεῖ αὐτούς
  choice: ele os enviará
  rationale: Mantém o verbo simples “enviar” e a ambiguidade do sujeito de terceira pessoa, sem acrescentar a noção não explícita de devolução.
theological_decisions:
- issue: Sentido e referente de Ὁ κύριος
  choice: O Senhor
  alternative: O dono
  rationale: “O Senhor” conserva tanto a autoridade de Jesus quanto a força potencial do título cristológico. “O dono” é contextualmente possível caso κύριος designe o proprietário dos animais, e por isso aparece em nota.
- issue: Sujeito de ἀποστελεῖ
  choice: ele os enviará
  alternative: o Senhor os enviará
  rationale: O grego não expressa novamente o sujeito. No fluxo narrativo, “ele” pode referir-se mais naturalmente à pessoa que abordar os discípulos, mas a referência ao Senhor também é gramaticalmente possível; a tradução evita decidir silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para explicitar o plural. A formulação mantém a ordem e a tensão do grego sem recorrer a construções excessivamente literais como “tem necessidade deles”.
