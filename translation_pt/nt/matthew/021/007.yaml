source:
  edition: SBLGNT
  text: ἤγαγον τὴν ὄνον καὶ τὸν πῶλον, καὶ ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια, καὶ ἐπεκάθισεν ἐπάνω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: pt
  text: Trouxeram a jumenta e o jumentinho, puseram suas capas sobre eles, e ele se sentou sobre elas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele se sentou sobre eles”, isto é, sobre os dois animais. O pronome grego está no plural e pode se referir às capas ou aos dois animais.'
    reason: ambiguidade sintática do referente de αὐτῶν
lexical_decisions:
- source_word: ἤγαγον
  choice: Trouxeram
  rationale: O aoristo de ἄγω pode significar conduzir ou trazer. No contexto, “trouxeram” expressa naturalmente que os discípulos levaram os animais até Jesus.
- source_word: τὴν ὄνον
  choice: a jumenta
  rationale: O substantivo ὄνος designa um jumento; o artigo feminino explicita que aqui se trata da mãe do animal jovem. “Jumenta” preserva essa informação de modo claro e corrente.
- source_word: τὸν πῶλον
  choice: o jumentinho
  rationale: πῶλος indica um animal jovem e, neste contexto, um jumento jovem. “Jumentinho” evita a possível associação de “potro” exclusivamente com cavalos e mostra naturalmente a relação com a jumenta.
- source_word: ἐπέθηκαν ἐπ’ αὐτῶν τὰ ἱμάτια
  choice: puseram sobre eles suas capas
  rationale: ἱμάτια se refere a vestes exteriores. “Capas” é natural nesta cena, e “suas” explicita em português que pertenciam aos discípulos, conforme o contexto. O plural “eles” retoma os dois animais.
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: ele se sentou sobre elas
  rationale: O pronome grego é plural e pode retomar as capas, seu antecedente plural mais próximo, ou, sintaticamente, os animais. O feminino plural em português aponta naturalmente para “capas” e evita sugerir que Jesus se sentou simultaneamente nos dois animais, sem eliminar em nota a ambiguidade do grego.
theological_decisions:
- issue: Referente do pronome plural final αὐτῶν
  choice: “sobre elas”, entendendo o pronome como referência às capas
  alternative: “sobre eles”, preservando uma referência possível aos animais
  rationale: A forma grega é genuinamente ambígua porque tanto os animais quanto as capas estão no plural. Em português, porém, o gênero gramatical exige maior explicitação. A referência às capas produz uma frase narrativa natural e é indicada na nota junto com a alternativa formalmente possível, sem atribuir peso doutrinário à decisão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Jumenta” e “jumentinho” comunicam de maneira corrente o sexo e a idade dos animais; “capas” é mais natural que “vestes exteriores”. A nota preserva a ambiguidade que o gênero gramatical do português não permite reproduzir integralmente no texto principal.
