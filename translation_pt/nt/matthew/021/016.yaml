  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: pt
  text: 'E lhe disseram: “Você está ouvindo o que estes estão dizendo?” Jesus lhes diz: “Sim. Vocês nunca leram: ‘Da boca de crianças e de bebês de peito preparaste louvor’?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Jesus cita o Salmo 8:2 segundo a tradição grega das Escrituras. O texto hebraico costuma ser traduzido: “Da boca de crianças e de bebês de peito estabeleceste força”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις
  choice: Você está ouvindo
  rationale: O presente do indicativo em pergunta direta é expresso naturalmente pelo progressivo em português e preserva o tom de contestação dirigido a Jesus.
- source_word: τί οὗτοι λέγουσιν
  choice: o que estes estão dizendo
  rationale: O progressivo representa bem o presente λέγουσιν; “estes” conserva a referência direta e possivelmente depreciativa de οὗτοι sem acrescentar um substantivo ausente do grego.
- source_word: λέγει
  choice: respondeu
  rationale: Embora o grego use o presente histórico, o pretérito é mais natural na narrativa portuguesa; o contexto mostra que se trata de uma resposta.
- source_word: Ναί
  choice: Sim
  rationale: Equivalente direto e natural da resposta afirmativa simples.
- source_word: οὐδέποτε ἀνέγνωτε
  choice: Vocês nunca leram
  rationale: Forma idiomática em português para a pergunta retórica sobre o conhecimento das Escrituras, preservando seu tom de repreensão.
- source_word: Ἐκ στόματος
  choice: Da boca de
  rationale: Reproduz de modo conciso e natural a expressão preposicional grega.
- source_word: νηπίων
  choice: crianças
  rationale: νήπιος designa crianças muito pequenas; “crianças”, em contraste com “bebês de peito”, evita uma repetição pouco clara e mantém a distinção entre os dois grupos.
- source_word: θηλαζόντων
  choice: bebês de peito
  rationale: Expressão clara e atual para os que ainda mamam, preservando a imagem concreta do particípio grego.
- source_word: κατηρτίσω
  choice: preparaste
  rationale: Mantém a forma da citação grega de Mateus e o sentido de produzir ou dispor algo, sem importar a redação hebraica do salmo.
- source_word: αἶνον
  choice: louvor
  rationale: Equivalente direto do substantivo abstrato grego e forma natural em português.
theological_decisions:
- issue: Redação da citação do Salmo 8 no argumento de Jesus
  choice: 'Manter no texto principal a redação grega de Mateus: “preparaste louvor”'
  alternative: 'Usar a redação baseada no hebraico: “estabeleceste força”'
  rationale: Mateus cita a tradição escriturística grega. A tradução deve representar o texto de Mateus sem harmonizá-lo silenciosamente com a forma hebraica; a diferença relevante é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você/vocês” para a segunda pessoa no diálogo e conserva a segunda pessoa singular tradicional “preparaste” dentro da citação bíblica, onde o interlocutor é Deus. A nota distingue com transparência as formas grega e hebraica do salmo.
