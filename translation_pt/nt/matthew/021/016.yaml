  to: 'E lhe disseram: “Você está ouvindo o que estes estão dizendo?” Jesus lhes diz: “Sim. Vocês nunca leram: ‘Da boca de crianças e de bebês de peito preparaste louvor’?”[a]'
  rationale: A única revisão necessária é «Jesus lhes diz» em lugar de «Jesus lhes respondeu», para conservar o presente histórico λέγει e evitar explicitar além do que o verbo grego afirma. Mantêm-se a formulação da citação, a diferença textual registrada na nota e todos os seus respectivos sentidos.
