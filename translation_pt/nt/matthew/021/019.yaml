source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: pt
  text: 'Ao ver uma figueira à beira do caminho, ele se aproximou dela e não encontrou nela nada, a não ser folhas — somente folhas. Então lhe disse: “Que nunca mais venha fruto de você.”[a] E a figueira secou imediatamente.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “Que você nunca mais dê fruto”.'
    reason: Alternativa lexical e idiomática para ἐκ σοῦ καρπὸς γένηται.
lexical_decisions:
- source_word: συκῆν μίαν
  choice: uma figueira
  rationale: Neste contexto, μίαν introduz naturalmente um referente indefinido; “uma figueira” mantém o sentido sem dar ênfase indevida ao numeral.
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: à beira do caminho
  rationale: Expressa de modo idiomático a localização da árvore junto ao caminho, evitando sugerir que ela estivesse no meio dele.
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: se aproximou dela
  rationale: Comunica com naturalidade o movimento em direção à figueira indicado por ἦλθεν com ἐπί.
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ
  choice: não encontrou nada nela
  rationale: “Nela” é natural em português para aquilo que se encontra nos ramos da árvore e conserva a preposição grega sem rigidez.
- source_word: εἰ μὴ φύλλα μόνον
  choice: a não ser folhas — somente folhas
  rationale: A retomada “somente folhas” preserva a ênfase de μόνον sem tornar a frase obscura.
- source_word: λέγει αὐτῇ
  choice: lhe disse
  rationale: O presente histórico grego é vertido no pretérito, forma narrativa corrente em português; o pronome mantém a figueira como destinatária.
- source_word: Μηκέτι ... εἰς τὸν αἰῶνα
  choice: nunca mais
  rationale: A expressão portuguesa reúne de maneira idiomática a cessação indicada por Μηκέτι e seu caráter permanente reforçado por εἰς τὸν αἰῶνα.
- source_word: ἐκ σοῦ καρπὸς γένηται
  choice: venha fruto de você
  rationale: Preserva a imagem de fruto procedente da árvore e a forma de pronunciamento, sem substituir diretamente a construção por “dar fruto” no texto principal.
- source_word: ἐξηράνθη παραχρῆμα
  choice: secou imediatamente
  rationale: “Secou” é claro e natural para a figueira, e “imediatamente” mantém a força temporal de παραχρῆμα.
theological_decisions:
- issue: Força do pronunciamento de Jesus à figueira
  choice: “Que nunca mais venha fruto de você”
  alternative: “Você nunca mais dará fruto”
  rationale: O subjuntivo γένηται com Μηκέτι favorece um pronunciamento jussivo ou imprecatório. A tradução mantém essa força sem convertê-la numa simples previsão nem acrescentar uma interpretação simbólica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição enfática sobre as folhas foi preservada de forma natural, e o pronunciamento mantém a solenidade e a ambiguidade gramatical do grego.
