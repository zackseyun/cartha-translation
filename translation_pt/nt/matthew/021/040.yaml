id: MAT.21.40
reference: Matthew 21:40
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅταν οὖν ἔλθῃ ὁ κύριος τοῦ ἀμπελῶνος, τί ποιήσει τοῖς γεωργοῖς ἐκείνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
translation:
  language: pt
  text: Portanto, quando vier o dono da vinha[a], o que ele fará com aqueles agricultores[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “senhor da vinha”. A palavra grega é kýrios, muitas vezes traduzida por “Senhor”, mas aqui se refere ao proprietário da vinha dentro da parábola.
    reason: lexical_alternative
  - marker: b
    text: Ou “agricultores arrendatários”. O contexto mais amplo da parábola mostra que eles cultivavam a vinha como arrendatários, embora a palavra grega, por si só, signifique de modo mais geral “agricultores” ou “cultivadores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: quando
  rationale: Com o subjuntivo ἔλθῃ, introduz a ocasião futura esperada na parábola; “quando” é natural e preserva esse sentido.
- source_word: οὖν
  choice: portanto
  rationale: Marca a conclusão ou inferência decorrente da situação narrada anteriormente, e não apenas uma sequência temporal.
- source_word: ἔλθῃ
  choice: vier
  rationale: 'O aoristo do subjuntivo depois de ὅταν é expresso naturalmente em português pelo futuro do subjuntivo: “quando vier”.'
- source_word: κύριος
  choice: dono
  rationale: No contexto da parábola, designa quem possui a vinha. “Dono” comunica com clareza esse sentido sem introduzir aqui um título divino.
- source_word: ἀμπελῶνος
  choice: vinha
  rationale: Equivalente corrente e preciso de ἀμπελών neste contexto agrícola.
- source_word: τί ποιήσει
  choice: o que ele fará
  rationale: Conserva a pergunta sobre a ação futura do dono; o pronome explícito produz uma formulação clara e natural em português.
- source_word: γεωργοῖς
  choice: agricultores
  rationale: O termo grego significa, de modo geral, agricultores ou cultivadores. O contexto mais amplo indica que trabalham a vinha como arrendatários, informação preservada em nota.
- source_word: ἐκείνοις
  choice: aqueles
  rationale: Preserva a especificidade e o leve distanciamento do demonstrativo grego.
theological_decisions:
- issue: Tradução de κύριος no contexto da parábola
  choice: dono
  alternative: senhor
  rationale: Embora κύριος possa ser traduzido por “Senhor”, aqui se refere, no plano narrativo, ao proprietário humano da vinha. “Dono” evita impor ao termo um valor titular ou cristológico que esta frase não explicita.
- issue: Identidade dos γεωργοί
  choice: agricultores no texto, com a condição de arrendatários em nota
  alternative: agricultores arrendatários
  rationale: A condição de arrendatários decorre claramente do contexto da parábola, mas não está codificada de forma explícita no substantivo γεωργοί. A tradução mantém a amplitude lexical e a nota esclarece o papel narrativo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Quando vier” reproduz naturalmente a construção temporal grega, e “o que ele fará com” é a formulação idiomática para a ação dirigida aos agricultores.
