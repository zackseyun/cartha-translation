  source_fidelity: 'A tradução reproduz com precisão a fórmula de cumprimento: “Isso aconteceu” corresponde adequadamente a Τοῦτο ... γέγονεν; “para que se cumprisse” mantém a construção ἵνα com subjuntivo passivo; e “o que foi dito por meio do profeta” preserva tanto o particípio passivo substantivado quanto a mediação indicada por διά com genitivo. A omissão de um equivalente autônomo para δέ é aceitável, pois sua força conectiva leve é naturalmente absorvida no português. Os dois-pontos cumprem de modo idiomático a função introdutória de λέγοντος antes da citação subsequente.'
