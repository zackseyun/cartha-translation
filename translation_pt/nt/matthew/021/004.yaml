  text: Τοῦτο ⸀δὲ γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/004.yaml
  text: 'This happened so that what was spoken through the prophet might be fulfilled[a], saying:'
translation:
  language: pt
  text: 'Isso aconteceu para que se cumprisse o que foi dito por meio do profeta[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelo profeta”. O grego diz mais literalmente “por meio do profeta”, destacando a mediação profética.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: Isso
  rationale: O demonstrativo neutro singular retoma como um todo a ação narrada imediatamente antes; “Isso” é natural em português nesse contexto.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui δέ tem leve função conectiva e não exige um marcador explícito em português; omiti-lo evita introduzir contraste ou temporalidade indevidos.
- source_word: γέγονεν
  choice: aconteceu
  rationale: O perfeito de γίνομαι nesta fórmula de cumprimento pode ser traduzido idiomaticamente como um acontecimento narrativo, sem perder sua relevância para o contexto.
- source_word: ἵνα πληρωθῇ
  choice: para que se cumprisse
  rationale: Preserva a construção de propósito/resultado com subjuntivo e soa natural no português narrativo.
- source_word: τὸ ῥηθὲν
  choice: o que foi dito
  rationale: Reproduz de modo idiomático o particípio passivo substantivado.
- source_word: διὰ τοῦ προφήτου
  choice: por meio do profeta
  rationale: διά com genitivo indica mediação ou agência; “por meio do profeta” preserva claramente essa nuance.
- source_word: λέγοντος
  choice: ':'
  rationale: Em português, os dois-pontos introduzem de modo mais natural a citação que vem em seguida; traduzir literalmente por “dizendo” produziria uma ligação menos fluida e potencialmente ambígua.
theological_decisions:
- issue: Fórmula de cumprimento e mediação profética
  choice: “o que foi dito por meio do profeta”
  alternative: “o que foi dito pelo profeta”
  rationale: A formulação escolhida preserva a possibilidade de que a fala tenha uma fonte divina e o profeta seja seu mediador, sem tornar explícito algo que o texto não declara nesta oração.
- issue: Relação de propósito e resultado em ἵνα
  choice: “para que se cumprisse”
  alternative: “e assim se cumpriu”
  rationale: Mantém a força télica da construção grega e não reduz a expressão a mero resultado narrativo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem é natural, e os dois-pontos introduzem a citação subsequente sem o calque pouco idiomático “dizendo”.
