id: MAT.21.42
reference: Matthew 21:42
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: pt
  text: 'Jesus lhes disse: “Vocês nunca leram nas Escrituras: ‘A pedra que os construtores rejeitaram, essa se tornou a pedra angular[a]. Isso veio do Senhor[b] e é maravilhoso aos nossos olhos’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedra de remate”; literalmente, “cabeça do canto”.
    reason: lexical_alternative
  - marker: b
    text: O grego diz “do Senhor”; o texto hebraico citado traz “do SENHOR” (YHWH).
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγει
  choice: disse
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma natural na narrativa portuguesa, sem perda de sentido.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: Vocês nunca leram
  rationale: Preserva a força da pergunta retórica e se expressa de modo corrente e claro em português.
- source_word: γραφαῖς
  choice: nas Escrituras
  rationale: Neste contexto, o termo designa os escritos sagrados de Israel; “Escrituras” é a forma consagrada e transparente.
- source_word: Λίθον
  choice: A pedra
  rationale: Embora sem artigo no grego, a pedra é definida no contexto da citação, e o artigo é natural em português.
- source_word: ἀπεδοκίμασαν
  choice: rejeitaram
  rationale: Comunica de maneira concisa a ideia de considerar imprópria e recusar.
- source_word: οἱ οἰκοδομοῦντες
  choice: os construtores
  rationale: O particípio substantivado se refere aos que constroem; “construtores” mantém a metáfora com naturalidade.
- source_word: οὗτος
  choice: essa
  rationale: Retoma “a pedra” com concordância feminina e conserva a ênfase do demonstrativo grego.
- source_word: ἐγενήθη εἰς
  choice: se tornou
  rationale: Expressa a mudança para uma nova condição ou função sem acrescentar interpretação.
- source_word: κεφαλὴν γωνίας
  choice: a pedra angular
  rationale: É a equivalência portuguesa mais clara para a principal pedra do ângulo; a possível leitura “pedra de remate” fica registrada em nota.
- source_word: παρὰ κυρίου
  choice: veio do Senhor
  rationale: A preposição com genitivo indica origem ou procedência; a construção portuguesa mantém esse sentido.
- source_word: θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν
  choice: é maravilhoso aos nossos olhos
  rationale: Conserva a imagem e o tom elevado da citação em linguagem compreensível.
theological_decisions:
- issue: Tradução de κύριος na citação do Salmo
  choice: Senhor
  alternative: SENHOR
  rationale: O texto grego traz κυρίου, traduzido diretamente por “Senhor”. Como o texto hebraico citado contém o nome divino YHWH, essa informação é preservada em nota.
- issue: Aplicação messiânica da imagem da pedra
  choice: Manter a metáfora sem explicação interpretativa
  alternative: Identificar explicitamente a pedra como o Messias
  rationale: O contexto aplica a citação a Jesus, mas o versículo mantém a forma metafórica do Salmo; explicitar a identificação dentro da tradução iria além do que a frase declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento plural “vocês” torna explícito o referente plural de αὐτοῖς sem marcar regionalmente o texto com “vós”. A estrutura da citação e sua tensão metafórica foram preservadas.
