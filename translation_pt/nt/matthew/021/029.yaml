base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/029.yaml
  text: But he answered[b][a], ‘I do not want to.’ But later he changed his mind and went.
translation:
  language: pt
  text: 'Mas ele respondeu: “Não quero.” Depois, porém, mudou de ideia[a] e foi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “arrependeu-se”, “lamentou o que havia dito” ou “voltou atrás”. O termo grego pode indicar pesar que leva a uma mudança de atitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: respondeu
  rationale: A fórmula participial narrativa é expressa naturalmente em português por um verbo finito, sem perda de sentido.
- source_word: Οὐ θέλω
  choice: Não quero
  rationale: Preserva o sentido direto de vontade ou disposição pessoal, com linguagem corrente, sem tornar a recusa mais absoluta do que o grego exige.
- source_word: ὕστερον
  choice: Depois
  rationale: Indica de modo claro e natural que a mudança e a ação ocorreram posteriormente.
- source_word: μεταμεληθεὶς
  choice: mudou de ideia
  rationale: Comunica a reversão de intenção que levou à ação, sem impor o sentido teológico mais específico de “arrependeu-se”; a nota preserva as nuances de pesar e reconsideração.
- source_word: ἀπῆλθεν
  choice: foi
  rationale: No contexto, refere-se naturalmente a ir cumprir o que havia sido pedido, e não apenas a partir.
theological_decisions:
- issue: Sentido de μεταμεληθεὶς no contexto da parábola
  choice: mudou de ideia
  alternative: arrependeu-se; lamentou o que havia dito; voltou atrás
  rationale: O texto descreve a passagem da recusa à obediência. “Mudou de ideia” preserva essa reversão sem especificar uma noção penitencial mais forte, enquanto a nota registra a possível presença de pesar.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Depois, porém” mantém o contraste expresso por δέ sem reproduzir de modo rígido a estrutura grega.
