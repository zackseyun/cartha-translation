  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἴπατε τῇ θυγατρὶ Σιών· Ἰδοὺ ὁ βασιλεύς σου ἔρχεταί σοι πραῢς καὶ ἐπιβεβηκὼς ἐπὶ ὄνον καὶ ⸀ἐπὶ πῶλον υἱὸν ὑποζυγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: pt
  text: 'Digam à filha de Sião: “Veja! O seu rei vem até você, manso[a] e montado numa jumenta e num jumentinho[b], cria de um animal de carga.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “humilde”. O grego πραΰς pode significar “manso”, “gentil” ou “humilde” e retoma Zacarias 9:9.
    reason: lexical_alternative
  - marker: b
    text: 'Mateus preserva a formulação profética com duas expressões ligadas: “numa jumenta e num jumentinho, cria de um animal de carga”.'
    reason: cross_reference
lexical_decisions:
- source_word: Εἴπατε
  choice: Digam
  rationale: Imperativo aoristo plural de λέγω; “Digam” preserva de modo natural a ordem dirigida a mais de uma pessoa.
- source_word: τῇ θυγατρὶ Σιών
  choice: à filha de Sião
  rationale: Mantém a personificação profética, sem reduzi-la aos habitantes de Jerusalém.
- source_word: Ἰδοὺ
  choice: Veja!
  rationale: Partícula que chama enfaticamente a atenção; “Veja!” é atual, clara e adequada ao discurso dirigido à personagem coletiva “filha de Sião”.
- source_word: ὁ βασιλεύς σου
  choice: O seu rei
  rationale: Reproduz diretamente a construção possessiva e conserva sua força régia e messiânica.
- source_word: ἔρχεταί σοι
  choice: vem até você
  rationale: Expressa a chegada vívida do rei e deixa claro que ele se dirige à filha de Sião.
- source_word: πραῢς
  choice: manso
  rationale: Abrange a ideia de mansidão e gentileza sem sugerir fraqueza; “humilde” permanece uma alternativa legítima no eco de Zacarias 9:9.
- source_word: ἐπιβεβηκὼς
  choice: montado
  rationale: O particípio perfeito indica o estado de quem montou e está sobre o animal.
- source_word: ἐπὶ ὄνον
  choice: numa jumenta
  rationale: ὄνος pode designar o asno sem marcar o sexo por si só; no contexto da citação profética e do paralelismo com a cria, “jumenta” comunica naturalmente o animal adulto.
- source_word: πῶλον
  choice: num jumentinho
  rationale: πῶλος designa um animal jovem; o contexto o identifica como cria de animal de carga. “Jumentinho” é claro e evita a possível associação de “potro” apenas com cavalo.
- source_word: υἱὸν ὑποζυγίου
  choice: cria de um animal de carga
  rationale: Traduz o semitismo literalmente correspondente a “filho de” por uma expressão portuguesa natural, preservando a categoria ampla de animal usado para carregar peso.
theological_decisions:
- issue: Citação messiânica de Zacarias 9:9 e possível harmonização com o texto profético
  choice: 'Preservar a formulação grega de Mateus, inclusive as duas expressões animais: “numa jumenta e num jumentinho, cria de um animal de carga”.'
  alternative: Fundir as expressões como descrição de um só animal ou ajustar toda a redação à forma conhecida de Zacarias 9:9.
  rationale: A tradução deve representar o texto grego de Mateus e sua tensão interpretativa, sem resolver silenciosamente a relação entre as duas expressões nem harmonizá-lo a outra forma textual.
- issue: Sentido de πραῢς
  choice: manso
  alternative: humilde
  rationale: Ambos os sentidos são possíveis. “Manso” conserva a caracterização não coerciva do rei; a nota registra “humilde” por sua relevância lexical e profética.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A personificação “filha de Sião” e a duplicação profética dos animais foram mantidas; evitaram-se tanto o arcaísmo “eis” quanto uma paráfrase que eliminasse a ambiguidade do texto.
