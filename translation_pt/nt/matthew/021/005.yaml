  source_fidelity: A tradução representa adequadamente o imperativo plural, a personificação singular «filha de Sião», a vinda do rei «até você», o qualificativo πραΰς e o particípio perfeito «montado». «Jumenta» é uma opção defensável para ὄνον no contexto da formulação profética, e a duplicação das expressões referentes aos animais é preservada, sem harmonização interpretativa.
  naturalness: O português é moderno, claro e de registro bíblico digno. «Veja!» funciona naturalmente como apelo à atenção dirigido à personificação singular «filha de Sião». A sequência deliberadamente incomum «montado numa jumenta e num jumentinho» reflete a redação duplicada de Mateus e é esclarecida pela nota.
  terminology: «Filha de Sião», «rei», «manso», «jumenta», «jumentinho» e «animal de carga» são escolhas compreensíveis e semanticamente adequadas. A nota de «manso» preserva corretamente «humilde» como alternativa relevante para πραΰς e para o eco de Zacarias 9:9.
