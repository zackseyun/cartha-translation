id: MAT.21.45
reference: Matthew 21:45
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἀκούσαντες οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι τὰς παραβολὰς αὐτοῦ ἔγνωσαν ὅτι περὶ αὐτῶν λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/045.yaml
  text: And when the chief priests and the Pharisees heard his parables[a], they knew that he was speaking about them.
translation:
  language: pt
  text: Quando os chefes dos sacerdotes e os fariseus ouviram as parábolas dele, perceberam que ele falava a respeito deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas traduções trazem “contra eles”, explicitando a crítica implícita no contexto; o grego diz “a respeito deles” ou “acerca deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: quando [...] ouviram
  rationale: O particípio aoristo anterior ao verbo principal é expresso naturalmente como oração temporal, preservando a sequência dos acontecimentos.
- source_word: ἀρχιερεῖς
  choice: chefes dos sacerdotes
  rationale: Designa a liderança sacerdotal principal, e não vários ocupantes simultâneos do cargo singular de sumo sacerdote. A expressão é clara em português moderno.
- source_word: Φαρισαῖοι
  choice: fariseus
  rationale: Forma tradicional e amplamente reconhecida em português para o nome desse grupo judaico.
- source_word: παραβολὰς
  choice: parábolas
  rationale: Termo consagrado e exato para as narrativas e comparações figuradas de Jesus neste contexto.
- source_word: ἔγνωσαν
  choice: perceberam
  rationale: O aoristo de γινώσκω indica aqui que chegaram a reconhecer ou compreender a referência das parábolas; “perceberam” comunica essa tomada de consciência com naturalidade.
- source_word: περὶ αὐτῶν
  choice: a respeito deles
  rationale: περί com genitivo significa normalmente “a respeito de” ou “acerca de”. A escolha evita introduzir no texto principal o sentido mais forte de “contra”, embora a crítica esteja implícita no contexto.
- source_word: λέγει
  choice: ele falava
  rationale: O presente grego no discurso indireto é vertido idiomaticamente pelo imperfeito em português, indicando que o conteúdo das parábolas dizia respeito a eles.
theological_decisions:
- issue: Explicitar se as parábolas de Jesus eram dirigidas contra os líderes
  choice: ele falava a respeito deles
  alternative: ele falava contra eles
  rationale: O contexto revela uma crítica aos líderes, mas o grego codifica diretamente “a respeito deles” (περὶ αὐτῶν), não o valor adversativo mais forte de “contra eles”. A tradução preserva essa distinção.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Chefes dos sacerdotes” evita a possível impressão de que havia vários sumos sacerdotes em exercício. “As parábolas dele” mantém a referência pronominal do grego sem acrescentar o nome de Jesus ao versículo.
