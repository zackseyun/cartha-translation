source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους πλείονας τῶν πρώτων, καὶ ἐποίησαν αὐτοῖς ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: pt
  text: Enviou novamente outros servos[a], em maior número que os primeiros, e fizeram com eles a mesma coisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escravos”. A palavra grega δούλους pode significar “servos” ou “escravos”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: de novo
  rationale: Marca a repetição da ação e soa natural na sequência narrativa; sua posição junto de “enviou” evita uma abertura menos fluida.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Equivalente narrativo direto do aoristo de ἀποστέλλω; “mandou” também seria possível, mas “enviou” expressa com clareza o ato de despachar emissários.
- source_word: ἄλλους δούλους
  choice: outros servos
  rationale: δοῦλος pode designar servo ou escravo. No contexto da parábola, a função de enviados do proprietário está em primeiro plano; “servos” oferece leitura natural, e a alternativa lexical é registrada em nota.
- source_word: πλείονας τῶν πρώτων
  choice: em maior número que os primeiros
  rationale: A construção comparativa indica que o segundo grupo era numericamente maior que o primeiro, não que seus integrantes fossem superiores.
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  choice: fizeram com eles a mesma coisa
  rationale: Preserva a formulação anafórica do grego e remete ao tratamento descrito no versículo anterior sem repeti-lo nem explicá-lo em excesso.
theological_decisions:
- issue: Tradução de δοῦλος na parábola
  choice: servos
  alternative: escravos
  rationale: O termo grego comporta ambos os sentidos. Aqui, a narrativa destaca os homens como agentes enviados pelo proprietário, enquanto sua condição jurídica não é o foco explícito. A nota mantém visível a alternativa sem impor uma interpretação denominacional.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e compreensão internacional. “Em maior número” explicita corretamente a comparação quantitativa, e “a mesma coisa” mantém a referência ao versículo anterior.
