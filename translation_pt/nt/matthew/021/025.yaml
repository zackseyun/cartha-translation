id: MAT.21.25
reference: Matthew 21:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: pt
  text: 'O batismo de João — de onde vinha? Do céu[a] ou dos seres humanos[b]? Eles, porém, ponderavam entre si, dizendo: “Se dissermos: ‘Do céu’, ele nos dirá: ‘Então, por que vocês não acreditaram nele?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de Deus”; “do céu” é uma forma reverencial de indicar origem ou autorização divina.
    reason: lexical_alternative
  - marker: b
    text: Isto é, de origem humana; o grego não se refere especificamente a pessoas do sexo masculino.
    reason: lexical_clarification
lexical_decisions:
- source_word: βάπτισμα
  choice: batismo
  rationale: O substantivo designa o rito e, neste contexto, a atividade batismal de João como um todo; “batismo” é a forma consagrada e natural em português.
- source_word: τὸ Ἰωάννου
  choice: de João
  rationale: O genitivo associa o batismo a João sem especificar além do texto se a ênfase recai no rito, no ministério ou na autoridade dele.
- source_word: πόθεν ἦν
  choice: de onde vinha
  rationale: A pergunta trata da fonte ou origem do batismo. “De onde vinha” é natural em português e preserva esse sentido, sem transformar a pergunta em uma explicação interpretativa.
- source_word: ἐξ οὐρανοῦ
  choice: do céu
  rationale: Mantém a expressão grega e seu uso reverencial para indicar origem ou autorização divina.
- source_word: ἐξ ἀνθρώπων
  choice: dos seres humanos
  rationale: ἀνθρώπων se refere genericamente à humanidade, não especificamente a homens do sexo masculino; a formulação preserva o contraste entre origem divina e origem meramente humana.
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: ponderavam entre si
  rationale: O imperfeito retrata uma deliberação em andamento, e “entre si” mostra que discutiam internamente como grupo.
- source_word: Ἐὰν εἴπωμεν
  choice: Se dissermos
  rationale: Expressa naturalmente em português a condição formulada com o subjuntivo grego.
- source_word: ἐρεῖ ἡμῖν
  choice: ele nos dirá
  rationale: Introduz fala direta de modo idiomático, preservando o valor futuro.
- source_word: Διὰ τί οὖν
  choice: Então, por que
  rationale: Conserva a força inferencial de οὖν em português corrente.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: vocês não acreditaram nele
  rationale: πιστεύω com o dativo indica acreditar na pessoa, incluindo aceitar sua mensagem e autoridade; “acreditaram nele” preserva essa amplitude.
theological_decisions:
- issue: Sentido de “do céu”
  choice: Manter “do céu” no texto principal.
  alternative: “de Deus”
  rationale: A expressão indica origem ou autorização divina por meio de uma formulação reverencial. Mantê-la preserva tanto a imagem do original quanto seu contraste retórico com a origem humana.
- issue: Sentido genérico de ἀνθρώπων
  choice: Traduzir por “seres humanos”.
  alternative: “homens” ou “pessoas”
  rationale: A oposição é entre origem divina e humana, não entre Deus e indivíduos do sexo masculino. A escolha torna explícito o sentido genérico sem alterar o argumento.
- issue: Alcance de πιστεύω aplicado a João
  choice: “acreditaram nele”
  alternative: “confiaram nele”
  rationale: O contexto envolve aceitar a mensagem e a autoridade profética de João. “Acreditaram nele” mantém essa tensão sem limitar o verbo à confiança pessoal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” oferece uma forma plural natural; “ponderavam entre si” conserva o caráter deliberativo da cena. Os marcadores foram colocados junto às expressões que explicam.
