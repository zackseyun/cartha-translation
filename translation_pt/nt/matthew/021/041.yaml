  text: λέγουσιν αὐτῷ· Κακοὺς κακῶς ἀπολέσει αὐτούς, καὶ τὸν ἀμπελῶνα ἐκδώσεται ἄλλοις γεωργοῖς, οἵτινες ἀποδώσουσιν αὐτῷ τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: pt
  text: 'Eles lhe disseram: “Ele destruirá miseravelmente aqueles malvados[a] e arrendará a vinha a outros lavradores[b], que lhe entregarão os frutos nas épocas próprias[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego emprega um adjetivo e um advérbio da mesma raiz, num jogo de palavras que intensifica o juízo; também pode ser traduzido: “Ele destruirá de modo terrível aqueles homens maus.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a outros arrendatários”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “que lhe entregarão a produção nos tempos devidos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Eles lhe disseram
  rationale: O presente grego funciona como presente histórico na narrativa; o pretérito é mais natural em português e mantém o fluxo narrativo.
- source_word: Κακοὺς κακῶς ἀπολέσει αὐτούς
  choice: Ele dará um fim terrível àqueles homens perversos
  rationale: A formulação transmite tanto a censura moral quanto a intensidade do jogo de palavras entre o adjetivo e o advérbio gregos, sem recorrer à construção pouco natural “destruirá perversamente os perversos”.
- source_word: τὸν ἀμπελῶνα
  choice: a vinha
  rationale: Equivalente corrente de ἀμπελών, preservando a imagem agrícola e sua ressonância bíblica.
- source_word: ἐκδώσεται
  choice: arrendará
  rationale: No contexto agrícola, o verbo indica ceder a propriedade mediante arrendamento; “arrendará” expressa com precisão essa relação.
- source_word: ἄλλοις γεωργοῖς
  choice: a outros lavradores
  rationale: “Lavradores” designa naturalmente os cultivadores da vinha; a condição de arrendatários já está comunicada pelo verbo “arrendará”.
- source_word: ἀποδώσουσιν αὐτῷ
  choice: lhe entregarão
  rationale: O verbo expressa dar ou entregar o que é devido; a escolha mantém a obrigação decorrente do arrendamento sem tornar explícita uma forma específica de pagamento.
- source_word: τοὺς καρποὺς
  choice: os frutos
  rationale: Preserva a imagem agrícola literal e sua possível ressonância metafórica.
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: nas épocas próprias
  rationale: Mantém o plural do grego e comunica os períodos apropriados ou determinados para cada fruto.
theological_decisions:
- issue: A severidade e a natureza do juízo na resposta dos ouvintes
  choice: Ele dará um fim terrível àqueles homens perversos
  alternative: Ele destruirá de modo terrível aqueles homens maus
  rationale: A tradução preserva a força do juízo e a censura moral do original, sem especificar além do texto a modalidade ou o alcance teológico da destruição.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vinha”, “arrendará” e “lavradores” conservam o cenário agrícola sem arcaísmo excessivo; as notas registram as alternativas lexicais e o jogo de palavras grego.
