  source_fidelity: 'A tradução representa adequadamente a estrutura e o sentido do grego: a aproximação da época apropriada, o envio dos servos, os cultivadores-arrendatários e a finalidade de obter os frutos do proprietário. “Tempo da colheita” é uma contextualização agrícola natural de ὁ καιρὸς τῶν καρπῶν, sem afirmar que a colheita já estivesse concluída. “Os frutos que lhe pertenciam” comunica de modo claro o possessivo αὐτοῦ.'
