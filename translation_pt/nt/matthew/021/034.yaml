id: MAT.21.34
reference: Matthew 21:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτε δὲ ἤγγισεν ὁ καιρὸς τῶν καρπῶν, ἀπέστειλεν τοὺς δούλους αὐτοῦ πρὸς τοὺς γεωργοὺς λαβεῖν τοὺς καρποὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/034.yaml
  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
translation:
  language: pt
  text: Mas, quando se aproximou o tempo da colheita, ele enviou seus servos[a] aos lavradores arrendatários[b] para receber os frutos que lhe pertenciam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus escravos”. A palavra grega pode significar tanto “servos” como “escravos”; aqui, o destaque recai sobre a função deles como representantes do proprietário.
    reason: lexical_alternative
  - marker: b
    text: Ou “agricultores”, “arrendatários” ou “vinhateiros”. O termo grego se refere a cultivadores; neste contexto, eles cultivavam a vinha de outro homem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Mas, quando
  rationale: ὅτε introduz a oração temporal, e δέ marca uma transição narrativa suave, com leve contraste.
- source_word: ἤγγισεν ὁ καιρὸς τῶν καρπῶν
  choice: se aproximou o tempo da colheita
  rationale: A expressão indica que chegou perto a época própria dos frutos; em português, “tempo da colheita” comunica naturalmente o contexto agrícola sem exigir que a colheita já tivesse começado.
- source_word: τοὺς δούλους αὐτοῦ
  choice: seus servos
  rationale: δοῦλος pode designar servo ou escravo. Aqui, “servos” destaca de modo natural a função deles como representantes do proprietário, enquanto a alternativa literal é registrada em nota.
- source_word: πρὸς τοὺς γεωργοὺς
  choice: aos lavradores arrendatários
  rationale: γεωργοί são cultivadores; no contexto da parábola, trabalham a vinha de outro homem. “Lavradores arrendatários” torna explícita essa relação sem reduzi-los a simples trabalhadores contratados.
- source_word: λαβεῖν τοὺς καρποὺς αὐτοῦ
  choice: para receber os frutos que lhe pertenciam
  rationale: λαβεῖν pode significar tomar ou receber. A formulação expressa que o proprietário buscava a parte da produção que era sua, preservando o plural καρπούς e o possessivo αὐτοῦ.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Tempo da colheita” evita a expressão pouco natural “tempo dos frutos”; “frutos que lhe pertenciam” esclarece o possessivo sem especificar indevidamente se se tratava de toda a produção ou da parcela devida ao proprietário.
