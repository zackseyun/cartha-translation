id: MAT.11.1
reference: Matthew 11:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: pt
  text: Depois que Jesus terminou de dar instruções aos seus doze discípulos[a], partiu dali para ensinar e pregar nas cidades deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de dar ordens aos seus doze discípulos”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “cidades deles” é ambígua no grego; pode se referir às cidades dos discípulos ou, de modo mais geral, às cidades do povo daquela região.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Depois que
  rationale: A fórmula narrativa semitizante introduz a transição temporal. “Depois que” comunica de modo natural em português a conclusão da instrução antes da ação seguinte, sem reproduzir de forma pesada “e aconteceu que, quando”.
- source_word: ἐτέλεσεν
  choice: terminou
  rationale: Expressa a conclusão da ação anterior; em combinação com “depois que”, a anterioridade fica clara sem necessidade de uma forma verbal composta.
- source_word: διατάσσων
  choice: de dar instruções
  rationale: O particípio indica orientação dotada de autoridade. “Dar instruções” se ajusta ao contexto do envio dos Doze e preserva “dar ordens” como alternativa lexical possível em nota.
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: aos seus doze discípulos
  rationale: Formulação corrente e fiel; “discípulos” é o equivalente estabelecido de μαθηταί no contexto dos Evangelhos.
- source_word: μετέβη ἐκεῖθεν
  choice: partiu dali
  rationale: Expressa de maneira concisa e natural o deslocamento de Jesus para fora do lugar anterior.
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: para ensinar e pregar
  rationale: O infinitivo articular exprime propósito. A tradução conserva a distinção entre ensinar e proclamar publicamente.
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: nas cidades deles
  rationale: Mantém o pronome plural e sua referência não especificada. “Cidades” traduz diretamente πόλεσιν, embora o termo também possa abranger localidades menores.
theological_decisions:
- issue: Referente de αὐτῶν em ἐν ταῖς πόλεσιν αὐτῶν
  choice: Manter “nas cidades deles”, sem identificar o referente.
  alternative: “nas cidades dos discípulos”, “nas cidades dos judeus” ou “nas cidades daquela região”
  rationale: O grego não explicita o antecedente do pronome. A tradução preserva essa ambiguidade em vez de impor uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem dos marcadores segue sua ocorrência no texto. “Partiu dali” evita uma formulação excessivamente literal, e “nas cidades deles” conserva deliberadamente a ambiguidade do original.
