id: MAT.11.2
reference: Matthew 11:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: pt
  text: Quando João, na prisão, ouviu falar das obras do Messias[a], enviou seus discípulos
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cristo”.'
    reason: Registra a tradução tradicional alternativa de Χριστός sem resolver além do necessário sua função titular.
lexical_decisions:
- source_word: δὲ
  choice: não representado por uma palavra isolada
  rationale: A partícula marca a transição narrativa; em português, o fluxo é natural sem acrescentar um advérbio temporal como “então” ou “naquele momento”.
- source_word: ἀκούσας
  choice: Quando João... ouviu falar
  rationale: O particípio aoristo é expresso naturalmente por uma oração temporal, preservando a anterioridade da ação em relação ao envio.
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: na prisão
  rationale: Forma idiomática e clara em português para indicar onde João estava.
- source_word: τὰ ἔργα
  choice: as obras
  rationale: Preserva a amplitude de ἔργα e sua referência aos feitos e à atuação do Messias.
- source_word: τοῦ χριστοῦ
  choice: do Messias
  rationale: Χριστός funciona aqui como título; “Messias” comunica seu sentido de ungido e mantém o contexto judaico.
- source_word: πέμψας
  choice: enviou
  rationale: O particípio coordena a ação principal que prossegue no versículo seguinte; o objeto enviado são os discípulos, expressos na frase seguinte.
- source_word: διὰ τῶν μαθητῶν αὐτοῦ
  choice: seus discípulos
  rationale: διά com genitivo pode marcar intermediários, mas com πέμπω a construção significa naturalmente que João enviou a mensagem por meio deles, isto é, enviou os próprios discípulos. A formulação portuguesa evita o pouco natural “enviou por meio de seus discípulos” sem objeto explícito.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: O termo funciona como título neste contexto. “Messias” torna explícito o valor titular e o pano de fundo judaico, enquanto “Cristo” permanece uma tradução tradicional legítima.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A frase permanece sintaticamente aberta, como no texto grego, pois a mensagem enviada aparece no versículo seguinte.
