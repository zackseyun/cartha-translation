source:
  edition: SBLGNT
  text: πάντες γὰρ οἱ προφῆται καὶ ὁ νόμος ἕως Ἰωάννου ἐπροφήτευσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/013.yaml
  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: pt
  text: Pois todos os Profetas e a Lei profetizaram até João[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «até chegar a João» ou «até o tempo de João». A expressão pode apresentar João como a culminação do testemunho profético ou como o marco de sua transição.
    reason: 'Leitura alternativa: a expressão temporal grega admite mais de uma nuance quanto à relação de João com o período mencionado.'
lexical_decisions:
- source_word: πάντες
  choice: todos
  rationale: Modifica coletivamente «os Profetas» e indica a totalidade do grupo; «todos» é a forma mais natural em português.
- source_word: γὰρ
  choice: pois
  rationale: Introduz a explicação ou fundamento do que precede, preservando a conexão argumentativa sem torná-la mais específica do que o grego.
- source_word: οἱ προφῆται
  choice: os Profetas
  rationale: Designa os profetas como conjunto e, em paralelo com «a Lei», remete ao testemunho reconhecido das Escrituras de Israel.
- source_word: ὁ νόμος
  choice: a Lei
  rationale: Neste par com «os Profetas», refere-se à Torá como corpus das Escrituras, não à lei em sentido genérico.
- source_word: ἕως Ἰωάννου
  choice: até João
  rationale: Expressa de modo conciso o limite temporal e mantém aberta a questão de João ser a culminação desse testemunho ou o marco de sua transição.
- source_word: ἐπροφήτευσαν
  choice: profetizaram
  rationale: Verte diretamente o aoristo ativo e preserva a personificação pela qual tanto os Profetas como a Lei exercem testemunho profético.
theological_decisions:
- issue: Se ὁ νόμος deve ser entendido genericamente ou como referência às Escrituras
  choice: a Lei
  alternative: a lei
  rationale: O paralelo «os Profetas e a Lei» aponta para o corpus reconhecido das Escrituras de Israel; a inicial maiúscula ajuda o leitor moderno a perceber essa referência sem acrescentar conteúdo.
- issue: Se ἕως Ἰωάννου inclui João na era profética ou apenas o apresenta como seu limite
  choice: até João
  alternative: até o tempo de João
  rationale: A formulação grega não resolve plenamente a relação de João com o limite indicado. A tradução conserva a ambiguidade e evita impor uma conclusão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Pois» mantém a ligação explicativa; as maiúsculas em «Profetas» e «Lei» sinalizam os conjuntos reconhecidos das Escrituras no contexto.
