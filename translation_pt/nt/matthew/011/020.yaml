  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: pt
  text: Então ele começou a censurar as cidades onde havia ocorrido a maior parte dos seus atos poderosos[a], porque elas não se arrependeram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “milagres” ou “obras de poder” (grego: dynameis).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca naturalmente, em português contemporâneo, a progressão temporal da narrativa.
- source_word: ἤρξατο ὀνειδίζειν
  choice: começou a repreender
  rationale: Preserva o aspecto ingressivo de ἤρξατο e expressa a censura contida em ὀνειδίζειν sem intensificá-la para uma condenação formal.
- source_word: τὰς πόλεις ἐν αἷς
  choice: as cidades onde
  rationale: “Cidades” é a correspondência comum de πόλεις, e “onde” torna a oração relativa natural sem perder seu sentido locativo.
- source_word: ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: havia realizado a maioria de seus atos poderosos
  rationale: A formulação ativa explicita Jesus, já indicado por αὐτοῦ, como agente contextual; “a maioria” conserva com precisão o superlativo πλεῖσται, e “atos poderosos” mantém a relação de δυνάμεις com poder.
- source_word: ὅτι οὐ μετενόησαν
  choice: porque elas não se arrependeram
  rationale: “Porque” introduz claramente a causa da repreensão; “não se arrependeram” preserva o sentido moral e espiritual de μετανοέω no contexto.
theological_decisions:
- issue: Sentido de δυνάμεις no contexto dos feitos de Jesus
  choice: atos poderosos
  alternative: milagres; obras de poder
  rationale: “Atos poderosos” conserva a ênfase lexical no poder manifestado e evita reduzir o termo grego a uma categoria mais estreita, embora “milagres” seja uma alternativa contextual válida.
- issue: Sentido de μετενόησαν
  choice: não se arrependeram
  alternative: não mudaram de atitude; não voltaram atrás
  rationale: O texto descreve a falta de uma resposta moral e espiritual aos atos de Jesus. “Arrependeram” transmite esse peso sem acrescentar uma formulação doutrinária particular.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção evita arcaísmos, preserva a progressão narrativa e mantém a força teológica de “arrependeram”.
