- from: Então ele começou a repreender as cidades onde havia realizado a maioria de seus atos poderosos[a], porque elas não se arrependeram.
  to: Então ele começou a censurar as cidades onde havia ocorrido a maior parte dos seus atos poderosos[a], porque elas não se arrependeram.
  rationale: A revisão substitui a agência explicitada por uma formulação de ocorrência mais próxima de ἐγένοντο e ajusta “repreender” para “censurar”, que reproduz mais precisamente a reprovação expressa por ὀνειδίζειν. Mantêm-se “atos poderosos” e “arrependeram”, bem fundamentados lexical e contextualmente.
