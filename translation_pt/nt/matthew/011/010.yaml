id: MAT.11.10
reference: Matthew 11:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀οὗτός ἐστιν περὶ οὗ γέγραπται· Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: pt
  text: 'Este é aquele a respeito de quem está escrito: “Eis que envio o meu mensageiro diante da tua face[a], o qual preparará o teu caminho diante de ti.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “diante de ti” ou “à tua frente”. O grego conserva a expressão concreta “diante da tua face” na citação das Escrituras.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: Este é aquele
  rationale: Mantém a identificação enfática do demonstrativo grego e soa natural em português, sem acrescentar uma caracterização como “homem”.
- source_word: περὶ οὗ
  choice: a respeito de quem
  rationale: Expressa com clareza o sentido referencial de περί com o genitivo e se integra naturalmente à fórmula introdutória da citação.
- source_word: γέγραπται
  choice: está escrito
  rationale: É a fórmula portuguesa consagrada para introduzir uma citação das Escrituras e preserva o valor resultativo do perfeito passivo.
- source_word: Ἰδοὺ
  choice: Eis que
  rationale: Conserva o tom solene e profético da citação sem recorrer ao coloquial “olha”.
- source_word: ἀποστέλλω
  choice: envio
  rationale: Reproduz diretamente o presente grego, que no contexto da promessa possui força vívida e prospectiva.
- source_word: ἄγγελόν
  choice: mensageiro
  rationale: O referente contextual é João Batista, um precursor humano; “mensageiro” preserva aqui o sentido adequado de ἄγγελος sem sugerir necessariamente um ser celestial.
- source_word: πρὸ προσώπου σου
  choice: diante da tua face
  rationale: Preserva a expressão concreta do grego e a textura formal da citação bíblica; a nota oferece uma formulação portuguesa mais idiomática.
- source_word: κατασκευάσει
  choice: preparará
  rationale: Verte de maneira concisa e natural o futuro do verbo que significa preparar ou deixar pronto.
- source_word: τὴν ὁδόν σου
  choice: o teu caminho
  rationale: “Caminho” mantém tanto a imagem concreta de uma via quanto sua possível ressonância metafórica.
- source_word: ἔμπροσθέν σου
  choice: diante de ti
  rationale: Equivalente claro e solene para a expressão espacial, mantendo-a distinta da referência anterior à “face”.
theological_decisions:
- issue: Reprodução das duas expressões preposicionais da citação bíblica
  choice: Manter tanto “diante da tua face” quanto “diante de ti” no texto principal
  alternative: Simplificar ou fundir as duas expressões como “à tua frente”
  rationale: O grego contém πρὸ προσώπου σου e ἔμπροσθέν σου. Preservar ambas mantém o paralelismo enfático e a textura da citação, sem resolver por suavização uma repetição presente na fonte.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação de registro própria de uma citação profética. “Eis que” e “está escrito” preservam a solenidade; “diante da tua face” é deliberadamente mais formal e recebe esclarecimento em nota.
