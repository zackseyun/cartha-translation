review_pass:
  verdict: revise
  source_fidelity: O texto principal traduz com fidelidade a construção temporal, «reino dos céus», a leitura passiva plausível de βιάζεται e a ação enérgica de ἁρπάζουσιν. A nota preserva adequadamente a alternativa média/intransitiva para βιάζεται. Contudo, «homens determinados» enfraquece indevidamente βιασταί, que conserva a ideia de pessoas violentas ou que empregam força; determinação, por si só, não é o sentido lexical em questão.
  naturalness: O português do texto principal é moderno, claro e adequado a registro bíblico contemporâneo. «Sofre violência» e «se apoderam dele» são naturais e mantêm o tom conciso do original.
  terminology: «João Batista» e «reino dos céus» são formas estabelecidas e apropriadas. «Homens violentos» representa bem βιασταὶ e deve ser mantido também na alternativa, pois a leitura alternativa recai sobre βιάζεται, não exige suavizar o substantivo seguinte.
  issues:
  - severity: medium
    issue: A nota traduz βιασταὶ como «homens determinados».
    rationale: «Determinados» introduz uma nuance psicológica que não corresponde suficientemente ao campo semântico de βιασταί («violentos», «que usam de força»). Isso pode fazer a nota parecer uma interpretação doutrinariamente suavizada, em vez de registrar a ambiguidade gramatical de βιάζεται.
  revised_text: Mas, desde os dias de João Batista até agora, o reino dos céus sofre violência, e homens violentos se apoderam dele.[a]
