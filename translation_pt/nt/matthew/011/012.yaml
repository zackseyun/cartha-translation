id: MAT.11.12
reference: Matthew 11:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: pt
  text: Mas, desde os dias de João Batista até agora, o reino dos céus sofre violência, e homens violentos se apoderam dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o reino dos céus avança com força, e homens violentos se apoderam dele”. O verbo grego traduzido como “sofre violência” também pode ser entendido em sentido médio.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: Mas, desde
  rationale: ἀπό indica o ponto inicial, e δέ introduz uma transição ou contraste leve. “Mas, desde” preserva ambos de modo natural em português.
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: os dias de João Batista
  rationale: Mantém o idiomatismo temporal do grego sem substituí-lo pela formulação mais interpretativa “o tempo de João Batista”.
- source_word: ἕως ἄρτι
  choice: até agora
  rationale: Expressão portuguesa corrente que comunica a continuidade desde os dias de João até o presente do discurso.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: o reino dos céus
  rationale: É a forma consagrada e natural em português para a expressão característica de Mateus, preservando o plural formal de οὐρανῶν.
- source_word: βιάζεται
  choice: sofre violência
  rationale: Adota no texto principal o sentido passivo, que se articula naturalmente com a referência subsequente aos violentos, sem ocultar na nota a leitura média/intransitiva possível.
- source_word: βιασταὶ
  choice: homens violentos
  rationale: Expressa o caráter violento ou coercivo do substantivo e preserva o masculino plural gramatical do texto grego.
- source_word: ἁρπάζουσιν αὐτήν
  choice: se apoderam dele
  rationale: Comunica uma tomada enérgica ou pela força em português natural; o pronome masculino retoma “reino” conforme a gramática portuguesa.
theological_decisions:
- issue: Sentido de βιάζεται em relação ao reino dos céus
  choice: 'Sentido passivo no texto principal: “o reino dos céus sofre violência”'
  alternative: 'Sentido médio/intransitivo: “o reino dos céus avança com força”'
  rationale: A forma grega admite uma leitura passiva e outra média/intransitiva. A leitura passiva combina bem com “homens violentos se apoderam dele”, mas a alternativa possui apoio lexical relevante; por isso, a ambiguidade é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo e a tensão do grego, evitando explicar no corpo do versículo uma ambiguidade que pertence ao próprio texto-fonte.
