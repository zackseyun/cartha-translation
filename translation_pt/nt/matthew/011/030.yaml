  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: pt
  text: Pois o meu jugo é suave[a], e a minha carga é leve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: bondoso, agradável, benéfico. O termo grego também pode sugerir algo adequado ou bom de levar.'
    reason: χρηστός abrange as noções de bondade, benignidade, agradabilidade e adequação; a nota preserva essas nuances sem sobrecarregar o texto.
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a relação explicativa com a afirmação anterior.
- source_word: ζυγός
  choice: jugo
  rationale: Preserva a metáfora concreta de submissão e discipulado, bem estabelecida em português bíblico e ainda compreensível.
- source_word: χρηστός
  choice: bondoso
  rationale: Expressa o sentido de algo benigno, bom e favorável, sem reduzir o termo apenas à ideia de facilidade.
- source_word: φορτίον
  choice: carga
  rationale: Termo natural em português para o peso carregado e adequado ao paralelismo com 'jugo'.
- source_word: ἐλαφρόν
  choice: leve
  rationale: Equivalente direto que preserva o contraste implícito com uma carga pesada.
theological_decisions:
- issue: Sentido de χρηστός aplicado ao jugo de Jesus
  choice: bondoso
  alternative: suave; fácil; agradável
  rationale: A tradução 'bondoso' preserva a qualidade benigna do jugo e evita resolver o texto como se Jesus dissesse apenas que o discipulado não exige esforço. Também acompanha a revisão adjudicada do texto de consulta.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura concisa próxima do grego. 'Jugo' é mantido por sua força metafórica e reconhecimento amplo; a nota esclarece a ambiguidade legítima de χρηστός.
