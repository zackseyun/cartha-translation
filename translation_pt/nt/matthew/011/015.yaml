lexical_decisions:
- source_word: ὁ ἔχων
  choice: Quem tem
  rationale: O artigo com o particípio presente tem função substantiva e sentido genérico. “Quem tem” expressa isso de modo natural em português, sem restringir a referência a um indivíduo específico.
- source_word: ὦτα
  choice: ouvidos
  rationale: O substantivo grego está no plural, e “ouvidos” preserva tanto a forma quanto o sentido idiomático de capacidade para perceber atentamente.
- source_word: ἀκουέτω
  choice: ouça
  rationale: O presente imperativo ativo na terceira pessoa é traduzido naturalmente pelo subjuntivo com valor imperativo “ouça”, preservando a abrangência semântica de ouvir, escutar e acolher o que foi dito.
theological_decisions:
- issue: Expressão genérica no masculino singular
  choice: Quem tem ouvidos, ouça.
  alternative: Aquele que tem ouvidos, ouça.
  rationale: Embora o grego empregue uma construção gramaticalmente masculina e singular, ela é genericamente inclusiva. “Quem” preserva o singular e a referência universal em português natural, sem introduzir uma exclusão de gênero inexistente no sentido da frase.
translation_notes:
  register: Formulação breve, solene e corrente, com a expressão bíblica reconhecível “ter ouvidos” e um imperativo natural no português moderno.
