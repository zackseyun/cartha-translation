id: MAT.11.25
reference: Matthew 11:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: pt
  text: 'Naquele tempo, Jesus respondeu: “Eu te louvo[a], Pai, Senhor do céu e da terra, porque escondeste estas coisas dos sábios e entendidos e as revelaste às criancinhas[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eu te agradeço”. O verbo grego pode expressar gratidão, louvor ou reconhecimento público.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “aos bebês” ou “aos pequeninos”. Aqui, a imagem provavelmente se refere aos que recebem a revelação com a receptividade de uma criança.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Naquele tempo
  rationale: Expressão temporal natural em português, que preserva o enquadramento narrativo sem indicar uma imediatidade maior que a do grego.
- source_word: ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν
  choice: Jesus respondeu
  rationale: A fórmula grega combina 'responder' e 'dizer', mas em português moderno 'respondeu' comunica naturalmente a construção sem a redundância pouco idiomática de 'respondeu e disse'.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Eu te louvo
  rationale: No contexto de uma oração ao Pai, o verbo exprime reconhecimento público acompanhado de louvor ou gratidão. 'Eu te louvo' preserva o tom doxológico; a alternativa 'eu te agradeço' é registrada em nota.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Pai, Senhor do céu e da terra
  rationale: Preserva diretamente a sequência de vocativos e a afirmação da soberania divina.
- source_word: ὅτι
  choice: porque
  rationale: Apresenta de modo claro a razão ou o conteúdo que fundamenta o louvor de Jesus.
- source_word: ἔκρυψας
  choice: escondeste
  rationale: Tradução direta do aoristo ativo, conservando o Pai como agente da ação.
- source_word: ταῦτα ... αὐτά
  choice: estas coisas ... as
  rationale: Mantém aberta a referência do demonstrativo, enquanto o pronome átono retoma naturalmente 'estas coisas' em português.
- source_word: ἀπὸ σοφῶν καὶ συνετῶν
  choice: dos sábios e entendidos
  rationale: Reproduz de maneira concisa os adjetivos substantivados e o contraste entre sabedoria e entendimento, com formulação corrente no português bíblico e moderno.
- source_word: ἀπεκάλυψας
  choice: revelaste
  rationale: Equivalente habitual e preciso para a ação de tornar conhecido aquilo que estava oculto.
- source_word: νηπίοις
  choice: às criancinhas
  rationale: Preserva a imagem concreta e seu provável emprego metafórico, sem substituí-la por uma interpretação abstrata como 'aos humildes'.
theological_decisions:
- issue: Ação divina de esconder e revelar
  choice: “escondeste ... e as revelaste”
  alternative: “permitiste que ficassem escondidas ... e as revelaste”
  rationale: Os verbos gregos são ativos e têm o Pai como sujeito. A tradução conserva essa atribuição direta e a tensão teológica do texto, sem convertê-la em linguagem meramente permissiva.
- issue: Sentido de νηπίοις
  choice: “às criancinhas”
  alternative: “aos bebês” ou “aos humildes”
  rationale: A escolha mantém a metáfora infantil e não a reduz nem a um sentido estritamente etário nem a uma explicação teológica interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'te' em oração direta, formas verbais tradicionais porém correntes ('escondeste', 'revelaste') e evita tanto arcaísmos como paráfrases interpretativas.
