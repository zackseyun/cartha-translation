  text: εἶπεν αὐτῷ· Σὺ εἶ ὁ ἐρχόμενος ἢ ἕτερον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/003.yaml
  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: pt
  text: 'e lhe perguntou: “É você aquele que vem[a], ou devemos esperar outro?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aquele que está para vir” ou “o que havia de vir”. A expressão grega pode funcionar como título messiânico.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: e lhe perguntou
  rationale: Embora a expressão diga literalmente “e lhe disse”, em português é natural empregar “perguntou” ao introduzir uma pergunta direta; o “e” mantém a continuidade narrativa com o versículo anterior.
- source_word: Σὺ εἶ
  choice: É você
  rationale: A ordem “É você” forma uma pergunta natural em português e preserva a ênfase do pronome grego explícito σύ.
- source_word: ὁ ἐρχόμενος
  choice: aquele que vem
  rationale: O particípio presente com artigo é substantivado e, no contexto, pode ter força de título messiânico. “Aquele que vem” preserva a expressão grega sem explicitar além do texto que se trata do Messias.
- source_word: ἢ
  choice: ou
  rationale: Conjunção disjuntiva que introduz a alternativa.
- source_word: ἕτερον
  choice: outro
  rationale: Expressa outra pessoa ou alguém diferente; “outro” é conciso e natural neste contexto.
- source_word: προσδοκῶμεν
  choice: devemos esperar
  rationale: No contexto da pergunta deliberativa, o presente do indicativo grego adquire o sentido idiomático de “devemos esperar”; “esperar” preserva tanto a expectativa quanto a ideia de aguardar.
theological_decisions:
- issue: Força messiânica ou titular de ὁ ἐρχόμενος
  choice: aquele que vem
  alternative: o que havia de vir; aquele que está para vir; o Esperado
  rationale: O artigo e o contexto favorecem uma referência reconhecível à figura messiânica esperada, mas o grego não emprega diretamente o termo “Messias”. A tradução mantém a formulação participial e deixa sua força titular ser percebida pelo contexto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita tanto uma literalidade pouco natural (“disse-lhe”) quanto a explicitação interpretativa “Messias” no texto principal.
