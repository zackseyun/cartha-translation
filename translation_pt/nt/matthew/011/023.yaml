id: MAT.11.23
reference: Matthew 11:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: pt
  text: E você, Cafarnaum, será elevada até o céu? Descerá ao Hades.[a] Pois, se em Sodoma tivessem acontecido as obras poderosas que aconteceram em você, ela teria permanecido até hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à morada dos mortos”. Em grego, Hades, não Geena.'
    reason: Esclarece a alternativa lexical e impede que “Hades” seja confundido com outro termo grego relacionado ao juízo.
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Cafarnaum
  rationale: Adota a forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: será elevada até o céu?
  rationale: Entende μή com o futuro passivo como pergunta retórica que pressupõe resposta negativa. “Elevada” preserva tanto a voz passiva quanto a imagem espacial, sem transformar a pergunta em uma afirmação explícita.
- source_word: ἕως ᾅδου καταβήσῃ
  choice: Descerá ao Hades
  rationale: “Descerá” traduz diretamente o movimento de καταβαίνω. Mantém-se “Hades” para preservar o termo grego e evitar sua identificação automática com Geena ou com concepções posteriores associadas a “inferno”.
- source_word: δυνάμεις
  choice: obras poderosas
  rationale: Expressa tanto os atos concretos quanto o poder neles manifestado, sem reduzir necessariamente o termo à categoria moderna de “milagres”.
- source_word: ἐγενήθησαν ... αἱ δυνάμεις αἱ γενόμεναι
  choice: tivessem acontecido ... as obras poderosas que aconteceram
  rationale: A repetição de “acontecido/aconteceram” reflete o emprego repetido de γίνομαι e comunica naturalmente os eventos ocorridos nas duas cidades.
- source_word: ἔμεινεν ἂν
  choice: ela teria permanecido
  rationale: O condicional composto expressa a consequência irreal do período contrafactual; o pronome singular retoma Sodoma como cidade.
- source_word: μέχρι τῆς σήμερον
  choice: até hoje
  rationale: Forma corrente e direta que preserva o limite temporal do original.
theological_decisions:
- issue: Sentido de ᾅδης
  choice: Hades
  alternative: morada dos mortos; inferno
  rationale: A transliteração conserva a distinção lexical entre ᾅδης e termos como γέεννα, sem resolver no texto principal questões posteriores sobre o estado dos mortos ou o juízo final.
- issue: Forma da primeira declaração dirigida a Cafarnaum
  choice: 'pergunta retórica: “será elevada até o céu?”'
  alternative: 'afirmação negativa: “não será elevada até o céu”'
  rationale: μή com a forma verbal futura favorece uma pergunta que espera resposta negativa. A tradução mantém a força retórica e a ambiguidade pragmática do enunciado em vez de converter a resposta pressuposta em declaração.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” e formas verbais na terceira pessoa. O feminino “elevada” trata Cafarnaum como cidade. A ordem e as imagens espaciais do grego foram preservadas sem sacrificar a naturalidade.
