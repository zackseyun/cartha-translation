  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: pt
  text: 'O Filho do Homem veio comendo e bebendo, e dizem: “Vejam! Um comilão e beberrão, amigo de cobradores de impostos e pecadores!” E a sabedoria foi justificada por suas obras.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sabedoria foi reconhecida como justa por seus atos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Alguns manuscritos trazem “filhos” em vez de “obras”: “a sabedoria foi justificada por seus filhos”.'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: O Filho do Homem
  rationale: Preserva a forma tradicional e o pano de fundo semítico do título, bem como sua ressonância messiânica e teológica, sem explicá-lo por paráfrase.
- source_word: ἐσθίων καὶ πίνων
  choice: comendo e bebendo
  rationale: Reproduz diretamente as atividades habituais descritas pelos particípios e mantém o contraste contextual com a conduta ascética de João, sem exagerar com uma ideia de banquete.
- source_word: Ἰδοὺ
  choice: Vejam!
  rationale: Equivalente exclamativo atual e natural que conserva a força da acusação pública.
- source_word: φάγος
  choice: comilão
  rationale: Termo substantivado, conciso e pejorativo, adequado ao insulto do texto grego.
- source_word: οἰνοπότης
  choice: beberrão
  rationale: Expressa a acusação de consumo excessivo de bebida, e não a afirmação neutra de que ele bebia vinho.
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: amigo de cobradores de impostos e pecadores
  rationale: Preserva a construção e a força socioreligiosa dos dois rótulos; “cobradores de impostos” é claro para leitores modernos.
- source_word: ἐδικαιώθη
  choice: foi justificada
  rationale: Mantém a proximidade formal com δικαιόω e sua ligação com o vocabulário bíblico mais amplo; a nota registra uma formulação mais idiomática para o sentido contextual.
- source_word: ἡ σοφία
  choice: a sabedoria
  rationale: Conserva a expressão personificada sem identificar explicitamente a sabedoria com Jesus, com o plano divino ou com outra realidade teológica.
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: por suas obras
  rationale: Segue a leitura ἔργων do SBLGNT e expressa naturalmente o meio ou a evidência pela qual a sabedoria é reconhecida como justa.
theological_decisions:
- issue: Identidade da “sabedoria” na frase final
  choice: Manter a expressão personificada “a sabedoria” sem identificação explícita.
  alternative: Explicitar que a sabedoria é Jesus ou o plano salvador de Deus.
  rationale: O texto não define de modo expresso a identidade da sabedoria; preservar a personificação mantém sua tensão literária e teológica.
- issue: Forma textual da frase final
  choice: Adotar “obras”, conforme ἔργων no SBLGNT.
  alternative: Adotar “filhos”, conforme τέκνων em alguns manuscritos e no paralelo de Lucas 7:35.
  rationale: O texto-fonte fornecido traz ἔργων; a variante relevante é preservada em nota para transparência textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Comilão e beberrão” conserva o tom acusatório; “Vejam!” substitui uma fórmula arcaica como “Eis”. Os marcadores foram colocados na frase final, à qual suas respectivas notas efetivamente se referem.
