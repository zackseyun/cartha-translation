  text: Yes[a], Father, because this was pleasing in your sight.
translation:
  language: pt
  text: Sim[a], Pai, porque assim foi do teu agrado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois assim foi do teu bom agrado” ou “Pois isso foi agradável diante de ti”.'
