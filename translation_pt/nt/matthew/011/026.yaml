lexical_decisions:
- source_word: ναί
  choice: Sim
  rationale: Expressa assentimento direto no contexto da oração e corresponde naturalmente ao valor afirmativo do grego.
- source_word: ὁ πατήρ
  choice: Pai
  rationale: O nominativo com artigo funciona como forma de tratamento; “Pai” é natural, atual e digno em português.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão do assentimento expresso por “Sim”, preservando de modo claro a força causal.
- source_word: οὕτως
  choice: assim
  rationale: Retoma a maneira de agir do Pai descrita no versículo anterior sem explicitar além do texto.
- source_word: εὐδοκία ἐγένετο
  choice: foi do teu agrado
  rationale: Expressa de maneira idiomática que aquilo agradou ao Pai, sem impor o sentido mais específico de decreto ou propósito.
- source_word: ἔμπροσθέν σου
  choice: do teu agrado
  rationale: A construção portuguesa integra a perspectiva indicada por “diante de ti” numa expressão natural de aprovação pessoal.
theological_decisions:
- issue: Se εὐδοκία deve ser traduzido como prazer/aprovação ou como propósito/decreto divino
  choice: “foi do teu agrado”, preservando a ideia de prazer ou aprovação do Pai
  alternative: “foi a tua boa vontade” ou “assim te aprouve”
  rationale: O grego permite a noção de boa vontade ou prazer, mas não exige que se explicite um decreto. A formulação escolhida mantém a afirmação sobre o agrado do Pai sem encerrar debates mais amplos sobre providência ou eleição.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. “Foi do teu agrado” evita o arcaísmo de “assim te aprouve”, mantendo dignidade e naturalidade. O pronome “teu” acompanha o tratamento direto e íntimo “Pai”.
