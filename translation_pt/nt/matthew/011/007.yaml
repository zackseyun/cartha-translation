reference: Matthew 11:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: pt
  text: 'Enquanto eles iam embora, Jesus começou a falar às multidões a respeito de João: “O que vocês foram ver no deserto? Um caniço agitado pelo vento?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: Enquanto eles iam embora
  rationale: O genitivo absoluto indica uma ação simultânea. “Eles” retoma naturalmente os discípulos de João no contexto imediato, sem acrescentar ao texto a identificação explícita.
- source_word: ἤρξατο ... λέγειν
  choice: começou a falar
  rationale: Reproduz a construção ingressiva ἄρχομαι + infinitivo de maneira natural em português.
- source_word: τοῖς ὄχλοις
  choice: às multidões
  rationale: Mantém o plural do grego e emprega uma expressão corrente e digna.
- source_word: περὶ Ἰωάννου
  choice: a respeito de João
  rationale: Representa περί com genitivo como indicação do assunto do discurso.
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: O que vocês foram ver no deserto?
  rationale: Τί pergunta “o que?”, não “por quê?”. “Foram ver” comunica com naturalidade o propósito expresso pelo infinitivo θεάσασθαι; “deserto” é a designação portuguesa usual para a região erma da Judeia.
- source_word: κάλαμον
  choice: um caniço
  rationale: Equivalente comum de κάλαμος e adequado à imagem de uma planta flexível movida pelo vento.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: agitado pelo vento
  rationale: Preserva a construção passiva e a ideia de movimento ou abalo, com formulação idiomática em português.
theological_decisions:
- issue: Referente de Τούτων no genitivo absoluto
  choice: Traduzir pelo pronome “eles”, cujo referente contextual são os discípulos de João
  alternative: Explicitar “os discípulos de João” ou “esses homens”
  rationale: O pronome mantém a coesão com o contexto imediato sem inserir uma identificação que não está lexicalmente expressa neste versículo.
- issue: Força retórica da imagem do caniço
  choice: Manter a pergunta sem explicar no corpo do texto
  alternative: Explicitar que a imagem representa inconstância
  rationale: A pergunta provavelmente espera resposta negativa e contrasta João com algo instável, mas a tradução deve preservar a força figurada e não transformar a interpretação em texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento plural “vocês” é claro e corrente; a formulação conserva o tom retórico e digno do discurso.
