source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: pt
  text: Mas o que vocês foram ver? Um profeta? Sim, eu lhes digo, e mais do que um profeta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alguém maior do que um profeta”. Mais literalmente, o grego diz “mais do que um profeta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca o contraste com a sequência anterior de perguntas retóricas e soa natural em português moderno.
- source_word: τί ἐξήλθατε
  choice: o que vocês foram
  rationale: τί funciona como acusativo, “o que”, e não como advérbio, “por que”; a formulação pergunta qual pessoa ou realidade foram ver.
- source_word: ἰδεῖν
  choice: ver
  rationale: Infinitivo de finalidade após ἐξήλθατε; “ver” é claro, corrente e fiel.
- source_word: προφήτην
  choice: um profeta
  rationale: O singular sem artigo tem sentido naturalmente indefinido nesta pergunta retórica.
- source_word: ναί
  choice: Sim
  rationale: Resposta afirmativa direta à pergunta retórica, em linguagem simples e enfática.
- source_word: λέγω ὑμῖν
  choice: eu lhes digo
  rationale: Preserva a fórmula discursiva comum e mantém um registro natural e digno.
- source_word: καὶ περισσότερον προφήτου
  choice: e mais do que um profeta
  rationale: Mantém de perto a comparação expressa por περισσότερον com o genitivo, sem acrescentar um sujeito explícito ou explicar em que sentido João é superior.
theological_decisions:
- issue: Identidade e posição de João Batista na declaração de Jesus
  choice: mais do que um profeta
  alternative: alguém maior do que um profeta
  rationale: A formulação eleva João além da categoria de profeta, mas não especifica nesta oração em que sentido. A tradução preserva a força e a concisão do grego sem resolver a tensão interpretativa.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Vocês” e “lhes” oferecem clareza contemporânea sem perder dignidade; a expressão comparativa permanece deliberadamente concisa para refletir o original.
