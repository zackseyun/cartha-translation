source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: pt
  text: 'Mas eu digo a vocês: no dia do juízo, será mais suportável[a] para Tiro e Sidom do que para vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «mais tolerável».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Mas
  rationale: Introduz o forte contraste com a denúncia anterior de modo natural e direto em português moderno.
- source_word: λέγω ὑμῖν
  choice: eu digo a vocês
  rationale: Preserva a fórmula enfática de fala direta e explicita o plural de ὑμῖν com uma construção amplamente compreensível.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: para Tiro e Sidom
  rationale: A preposição «para» representa naturalmente o dativo das partes para as quais o juízo será comparativamente mais suportável.
- source_word: ἀνεκτότερον
  choice: mais suportável
  rationale: Expressa com clareza o comparativo daquilo que pode ser suportado, mantendo o tom solene do contexto de juízo.
- source_word: ἔσται
  choice: será
  rationale: Traduz de modo direto e idiomático o futuro copulativo.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: no dia do juízo
  rationale: É a formulação portuguesa natural para o momento do juízo escatológico e permanece próxima da expressão grega.
- source_word: κρίσεως
  choice: juízo
  rationale: Preserva o sentido judicial amplo de κρίσις sem restringi-lo antecipadamente ao resultado de condenação.
- source_word: ἢ ὑμῖν
  choice: do que para vocês
  rationale: Completa a comparação e mantém explícito o plural dos destinatários.
theological_decisions:
- issue: Natureza do juízo futuro
  choice: no dia do juízo
  alternative: num dia de juízo
  rationale: Embora a expressão grega não tenha artigo, neste contexto de Mateus ela aponta idiomaticamente para o reconhecido juízo escatológico. A tradução não acrescenta detalhes sobre sua natureza ou resultado.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com boa legibilidade brasileira. «Vocês» torna inequívoco o plural dos dois pronomes ὑμῖν. A ordem «no dia do juízo, será...» é natural em português e mantém em destaque o enquadramento temporal.
