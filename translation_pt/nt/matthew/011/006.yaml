  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ μακάριός ἐστιν ὃς ⸀ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/006.yaml
  text: And blessed is the one who is not offended by me[a].
translation:
  language: pt
  text: E feliz é quem não tropeça por minha causa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se escandaliza comigo” ou “não encontra em mim motivo para tropeçar”.'
    reason: Alternativas lexicais para σκανδαλισθῇ ἐν ἐμοί, que pode descrever tropeço, escândalo ou a reação de quem encontra em Jesus uma causa de queda.
lexical_decisions:
- source_word: καί
  choice: E
  rationale: Preserva a ligação direta desta declaração com a resposta de Jesus nos versículos anteriores.
- source_word: μακάριος
  choice: feliz
  rationale: É a forma corrente e compreensível nas bem-aventuranças em português moderno; expressa a condição favorecida por Deus, e não apenas uma emoção passageira.
- source_word: ὃς ἐὰν μὴ
  choice: quem não
  rationale: Comunica de modo natural a referência genérica e condicional a qualquer pessoa, sem tornar explícito um gênero que o português não precisa marcar aqui.
- source_word: σκανδαλισθῇ
  choice: não tropeça
  rationale: Mantém a metáfora de encontrar uma causa de queda, evitando reduzir o sentido a mero desgosto ou ofensa emocional. Embora a forma grega seja passiva, o português emprega naturalmente a construção intransitiva com esse valor metafórico.
- source_word: ἐν ἐμοί
  choice: por minha causa
  rationale: Expressa Jesus como a ocasião do tropeço. A relação também pode ser formulada como 'comigo' ou 'em mim', possibilidades registradas na nota.
theological_decisions:
- issue: Amplitude de σκανδαλισθῇ em relação a Jesus
  choice: 'Manter no texto a imagem do tropeço: “não tropeça por minha causa”.'
  alternative: “não se escandaliza comigo” ou “não encontra em mim motivo para tropeçar”
  rationale: A imagem pode abranger rejeição, perda de confiança ou queda por causa do que Jesus diz e faz. A tradução principal conserva essa tensão sem limitar o sentido a uma reação emocional.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Feliz” evita o arcaísmo de “bem-aventurado”, enquanto “tropeça” preserva a imagem expressiva do grego.
