source:
  edition: SBLGNT
  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: pt
  text: Tomem sobre vocês o meu jugo e aprendam de mim, pois sou manso e humilde de coração[a], e vocês encontrarão descanso para as suas almas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «gentil e humilde de coração».'
    reason: Alternativa lexical para πραΰς, ancorada na autodescrição de Jesus; «manso» permanece como tradução principal.
lexical_decisions:
- source_word: ἄρατε
  choice: Tomem
  rationale: O imperativo aoristo plural de αἴρω, na expressão com “jugo”, indica assumir ou aceitar o jugo; “tomem sobre vocês” preserva a imagem e soa natural em português.
- source_word: τὸν ζυγόν μου ἐφ’ ὑμᾶς
  choice: sobre vocês o meu jugo
  rationale: Mantém a metáfora concreta do jugo e traduz ἐπί com acusativo como a imposição voluntariamente assumida sobre os discípulos.
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: aprendam de mim
  rationale: Tradução direta e idiomática, capaz de abranger tanto receber instrução quanto seguir Jesus como discípulo.
- source_word: ὅτι
  choice: pois
  rationale: Introduz naturalmente a explicação de por que Jesus pode ser tomado como mestre, sem tornar a relação lógica mais rígida do que o grego exige.
- source_word: πραΰς
  choice: manso
  rationale: “Manso” expressa brandura e ausência de aspereza sem implicar fraqueza e é uma formulação bíblica ainda clara em português contemporâneo.
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: humilde de coração
  rationale: Preserva a qualidade interior indicada pelo dativo τῇ καρδίᾳ em uma expressão portuguesa natural e digna.
- source_word: εὑρήσετε ἀνάπαυσιν
  choice: vocês encontrarão descanso
  rationale: Reproduz de modo direto o futuro promissivo e mantém “descanso”, termo central e biblicamente ressonante.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: para a sua alma
  rationale: O dativo é expresso naturalmente com “para”; o singular distributivo “a sua alma” dirige a promessa a cada integrante do grupo e conserva ψυχή como a vida ou pessoa interior.
theological_decisions:
- issue: A autodescrição de Jesus em πραΰς ... καὶ ταπεινὸς τῇ καρδίᾳ
  choice: sou manso e humilde de coração
  alternative: sou gentil e humilde de coração
  rationale: “Manso” e “humilde de coração” preservam a autodescrição pessoal e seu peso teológico, sem sugerir fraqueza nem introduzir uma interpretação doutrinária adicional.
- issue: Sentido de ψυχή em ταῖς ψυχαῖς ὑμῶν
  choice: para a sua alma
  alternative: para vocês mesmos
  rationale: “Alma” mantém a imagem tradicional e o sentido da pessoa em sua dimensão interior, sem impor uma separação técnica entre corpo e alma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural e mantém as metáforas centrais de “jugo”, “coração”, “descanso” e “alma”. Não há marcadores de nota porque nenhuma nota é necessária neste versículo; a nota inglesa fornecida parece deslocada, pois seu conteúdo corresponde à expressão posterior, não a “aprendam de mim”.
