id: MAT.11.11
reference: Matthew 11:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: pt
  text: 'Em verdade lhes digo: entre os nascidos de mulher[b], não surgiu[a] ninguém maior do que João Batista; contudo, o menor[c] no Reino dos céus é maior do que ele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «não foi levantado ninguém maior». O verbo grego pode significar «surgir/levantar-se» ou «ser levantado»; aqui provavelmente se refere ao aparecimento de alguém na história, não à ressurreição.
    reason: lexical_alternative
  - marker: b
    text: «Nascidos de mulher» é uma expressão semítica que significa os seres humanos.
    reason: cultural_note
  - marker: c
    text: Ou «aquele que é menor». O grego emprega literalmente uma forma comparativa, mas aqui pode indicar a pessoa de menor posição ou importância no Reino dos céus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Em verdade lhes digo
  rationale: Expressa de modo natural e solene a fórmula autoritativa de Jesus, sem recorrer à transliteração menos clara «amém» no discurso corrente.
- source_word: οὐκ ἐγήγερται
  choice: não surgiu
  rationale: Comunica que ninguém apareceu ou se levantou no curso da história, preservando o valor resultante do perfeito e evitando sugerir diretamente uma ressurreição.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: entre os nascidos de mulher
  rationale: Mantém a expressão semítica concreta que abrange os seres humanos, sem substituí-la pela interpretação «entre os mortais».
- source_word: μείζων Ἰωάννου τοῦ βαπτιστοῦ
  choice: ninguém maior do que João Batista
  rationale: Torna explícito em português o sentido da construção comparativa negativa e usa a designação tradicional e reconhecível de João.
- source_word: ὁ δὲ μικρότερος
  choice: contudo, o menor
  rationale: Embora μικρότερος seja formalmente comparativo, no contexto designa naturalmente a pessoa de menor posição ou importância; «contudo» marca a forte inversão do enunciado.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: no Reino dos céus
  rationale: É a forma portuguesa consagrada e natural da expressão característica de Mateus, mantendo o plural de οὐρανῶν.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: é maior do que ele
  rationale: Preserva diretamente a comparação paradoxal sem especificar em que sentido essa pessoa é maior.
theological_decisions:
- issue: A grandeza de João em comparação com a pessoa de menor posição no Reino
  choice: Manter a afirmação paradoxal sem explicar a natureza dessa grandeza.
  alternative: Explicar a comparação como diferença entre eras da história da salvação, privilégios da nova aliança, santidade pessoal ou posição dos discípulos.
  rationale: O versículo não declara em que aspecto o menor no Reino é maior do que João; explicitar uma teoria eliminaria uma tensão genuína do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, enquanto se conservaram a expressão semítica, a fórmula solene e a tensão teológica do original.
