id: MAT.11.8
reference: Matthew 11:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: pt
  text: 'Mas o que vocês foram ver? Um homem vestido com roupas finas[a]? Vejam: os que usam roupas finas estão nas casas dos reis[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “roupas macias”. A expressão se refere a vestes delicadas ou luxuosas.
    reason: lexical_alternative
  - marker: b
    text: Ou “nos palácios reais”. O grego diz mais literalmente “nas casas dos reis”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Mantém o contraste adversativo com a pergunta retórica anterior de Jesus, de modo natural em português.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: o que vocês foram ver
  rationale: Reproduz o pronome interrogativo τί e expressa naturalmente a ideia de sair com o propósito de ver.
- source_word: ἄνθρωπον
  choice: um homem
  rationale: Preserva o singular masculino e se ajusta à referência imediata a João Batista.
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: vestido com roupas finas
  rationale: O grego diz literalmente que o homem está vestido com coisas ou roupas 'macias'; em português, 'roupas finas' comunica com mais naturalidade a conotação contextual de vestes delicadas e luxuosas, sem exagerá-la.
- source_word: ἰδοὺ
  choice: Vejam
  rationale: Forma moderna e direta de chamar a atenção dos ouvintes; o plural concorda com o público indicado por 'vocês'.
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: os que usam roupas finas
  rationale: φοροῦντες sugere uso habitual; a repetição de 'roupas finas' mantém a correspondência lexical com μαλακοῖς.
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: estão nas casas dos reis
  rationale: Conserva a formulação concreta e plural do grego; 'palácios reais' seria uma explicitação interpretativa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com 'vocês' para o plural. A tradução prioriza naturalidade sem apagar a imagem concreta do grego; as notas registram tanto a literalidade de 'macias' quanto a alternativa idiomática 'palácios reais'.
