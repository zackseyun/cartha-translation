source:
  edition: SBLGNT
  text: τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: pt
  text: Os cegos veem, os que não podem andar andam, os leprosos são purificados, os surdos ouvem, os mortos são ressuscitados, e aos pobres são anunciadas boas notícias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A lista faz eco a Isaías 35:5–6 e 61:1, reunindo sinais associados à obra do Messias. A expressão traduzida por «são anunciadas boas notícias» está na voz passiva; também pode ser traduzida por «o evangelho é pregado aos pobres».
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: Os cegos veem
  rationale: No contexto de cura, ἀναβλέπω indica receber ou recuperar a visão. A formulação concisa reproduz o estilo da lista e não pressupõe que toda pessoa tenha visto anteriormente.
- source_word: χωλοὶ περιπατοῦσιν
  choice: os que não podem andar passam a andar
  rationale: Expressa em português atual a incapacidade física indicada por χωλοί e a restauração indicada por περιπατοῦσιν, evitando um substantivo potencialmente depreciativo.
- source_word: λεπροὶ καθαρίζονται
  choice: os leprosos são purificados
  rationale: Mantém a terminologia histórica do contexto evangélico e preserva em καθαρίζονται tanto a dimensão corporal quanto a de pureza, em vez de reduzi-la a simples cura.
- source_word: κωφοὶ ἀκούουσιν
  choice: os surdos ouvem
  rationale: Embora κωφός possa significar surdo ou mudo, o verbo ἀκούουσιν determina aqui o sentido de surdez.
- source_word: νεκροὶ ἐγείρονται
  choice: os mortos são ressuscitados
  rationale: O passivo português conserva a ação exercida sobre os mortos; “ressuscitados” comunica com naturalidade o sentido do verbo no contexto de milagres.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: aos pobres são anunciadas boas-novas
  rationale: Preserva os pobres como destinatários do anúncio e mantém o sentido verbal de εὐαγγελίζομαι sem recorrer ao jargão “evangelizados”.
theological_decisions:
- issue: Sentido e voz de εὐαγγελίζονται
  choice: aos pobres são anunciadas boas-novas
  alternative: os pobres ouvem as boas-novas; o evangelho é pregado aos pobres
  rationale: A opção conserva a forma passiva e a ligação lexical com boas-novas, sem limitar a expressão a um uso eclesiástico técnico posterior.
- issue: Relação da lista com as profecias de Isaías
  choice: Manter no texto apenas as declarações dos sinais e registrar a alusão em nota
  alternative: Acrescentar no corpo do versículo que esses sinais cumprem Isaías
  rationale: A linguagem evoca Isaías 35:5–6 e 61:1, mas o versículo não contém uma fórmula explícita de cumprimento. A tradução preserva a ressonância sem inserir interpretação no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A cadência paralela da enumeração grega foi preservada. Empregou-se “os que não podem andar” para clareza e respeito, enquanto “leprosos” foi mantido como termo histórico convencional do cenário bíblico.
