  yaml_path: translation/nt/matthew/011/014.yaml
  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: pt
  text: E, se vocês estão dispostos a aceitar isso[a], ele é Elias, aquele que há de vir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se vocês estão dispostos a receber isso”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, João Batista é identificado com Elias, o precursor prometido; compare Malaquias 4:5 e Mateus 17:10–13.
