lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva de modo natural a ligação do versículo com o contexto anterior.
- source_word: εἰ θέλετε δέξασθαι
  choice: se vocês estão dispostos a aceitar isso
  rationale: θέλετε com o infinitivo exprime disposição; “aceitar isso” comunica em português atual a receptividade à afirmação de Jesus, suprindo naturalmente o objeto implícito.
- source_word: αὐτός
  choice: ele
  rationale: Retoma João Batista de maneira clara e natural, sem impor uma ênfase que o contexto não exige.
- source_word: ἐστιν Ἠλίας
  choice: é Elias
  rationale: Mantém a identificação direta feita pelo grego, sem reduzi-la a mera semelhança ou explicá-la no corpo do texto.
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: aquele que havia de vir
  rationale: Reproduz a expectativa profética de uma vinda futura a partir do ponto de vista da promessa e liga diretamente essa expressão a Elias.
theological_decisions:
- issue: Identificação de João Batista com Elias
  choice: ele é Elias, aquele que havia de vir
  alternative: ele cumpre o papel de Elias; ele é como Elias
  rationale: O grego formula a identificação diretamente, mas a introduz com um apelo condicional à aceitação dos ouvintes. A redação preserva tanto a força da afirmação quanto a tensão interpretativa, sem definir em que sentido João é Elias.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural “vocês” torna explícita a segunda pessoa do plural. “Havia de vir” conserva o tom de expectativa profética sem resolver a natureza da identificação de João com Elias.
