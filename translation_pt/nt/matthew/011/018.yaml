  text: ἦλθεν γὰρ Ἰωάννης μήτε ἐσθίων μήτε πίνων, καὶ λέγουσιν· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: pt
  text: 'Pois João veio, não comendo nem bebendo, e dizem: “Ele tem um demônio.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν
  choice: veio
  rationale: O aoristo de ἔρχομαι apresenta a vinda de João à cena; “veio” é direto, natural e mantém o sentido básico do verbo.
- source_word: γὰρ
  choice: pois
  rationale: γάρ introduz a explicação da afirmação anterior. “Pois” preserva essa relação explicativa em português corrente e digno.
- source_word: Ἰωάννης
  choice: João
  rationale: Forma portuguesa tradicional e amplamente reconhecida de Ἰωάννης; o contexto identifica João Batista.
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: não comendo nem bebendo
  rationale: A construção mantém a expressão comprimida sobre o modo de vida ascético de João sem acrescentar “pão” ou “vinho”, termos ausentes neste versículo.
- source_word: καὶ λέγουσιν
  choice: e dizem
  rationale: Conserva o presente vívido e generalizante de λέγουσιν, bem como o sujeito indeterminado expresso pela terceira pessoa do plural.
- source_word: Δαιμόνιον ἔχει
  choice: Ele tem um demônio
  rationale: Reproduz de perto a expressão grega e soa natural em português, sem expandi-la interpretativamente para “está possuído por um demônio”.
theological_decisions:
- issue: Forma da acusação expressa por Δαιμόνιον ἔχει
  choice: Ele tem um demônio
  alternative: Ele está possuído por um demônio
  rationale: O texto relata a acusação feita contra João, não uma afirmação do narrador. A formulação mais próxima do grego preserva essa distinção e evita acrescentar um grau de interpretação não explicitado.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A coordenação “não comendo nem bebendo” preserva a concisão e a estranheza retórica deliberada do original.
