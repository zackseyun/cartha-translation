base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: pt
  text: 'Eles dizem: “Tocamos flauta para vocês, e vocês não dançaram; entoamos uma lamentação, e vocês não bateram no peito[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isto é, não fizeram o gesto de luto. Também se pode traduzir: “vocês não prantearam”.'
    reason: cultural_note
lexical_decisions:
- source_word: λέγουσιν
  choice: Eles dizem
  rationale: O presente mantém viva a fala das crianças dentro da comparação.
- source_word: Ηὐλήσαμεν
  choice: Tocamos flauta
  rationale: O verbo αὐλέω indica especificamente tocar flauta ou instrumento de sopro semelhante; a formulação é clara e natural em português.
- source_word: ὑμῖν
  choice: para vocês
  rationale: Expressa de modo idiomático que a execução musical era dirigida aos outros participantes.
- source_word: ὠρχήσασθε
  choice: vocês não dançaram
  rationale: Reproduz naturalmente o sentido do verbo, sem impor nuance reflexiva à forma média.
- source_word: ἐθρηνήσαμεν
  choice: entoamos uma lamentação
  rationale: Preserva o caráter performático e fúnebre de θρηνέω, em paralelo com tocar flauta.
- source_word: ἐκόψασθε
  choice: vocês não bateram no peito
  rationale: Neste contexto, a forma média de κόπτω designa o gesto corporal de luto, especialmente bater no peito; a tradução mantém a imagem concreta do original.
