id: MAT.11.27
reference: Matthew 11:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: pt
  text: Tudo me foi entregue por meu Pai, e ninguém conhece[a] o Filho, a não ser o Pai; tampouco alguém conhece o Pai, a não ser o Filho e aquele a quem o Filho quiser revelar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “conhece plenamente” nas duas ocorrências; o verbo grego pode, conforme o contexto, indicar conhecimento pleno ou profundo.
    reason: lexical_alternative
  - marker: b
    text: Isto é, revelar o Pai. O objeto está implícito no grego.
    reason: referent_clarification
lexical_decisions:
- source_word: Πάντα
  choice: Tudo
  rationale: O plural neutro tem sentido abrangente. “Tudo” é natural em português e preserva a amplitude sem especificar indevidamente o que foi entregue.
- source_word: παρεδόθη
  choice: foi entregue
  rationale: O aoristo passivo indica uma entrega realizada pelo Pai. A forma portuguesa é direta e mantém a transferência de autoridade ou incumbência sem acrescentar uma interpretação específica.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: por meu Pai
  rationale: Mantém a relação pessoal expressa no grego; a inicial maiúscula assinala o uso titular em referência a Deus.
- source_word: ἐπιγινώσκει
  choice: conhece
  rationale: No contexto, o verbo expressa conhecimento pessoal e exclusivo. “Conhece” evita impor uma intensificação que o composto grego não exige necessariamente; a possibilidade de “conhece plenamente” é registrada em nota.
- source_word: εἰ μὴ
  choice: a não ser
  rationale: Nas duas construções negativas, esta expressão comunica de modo natural a exclusão marcada pelo grego.
- source_word: οὐδὲ ... τις ἐπιγινώσκει
  choice: tampouco alguém conhece
  rationale: Preserva a coordenação negativa e o paralelismo com a afirmação anterior sem produzir a sequência pouco natural “nem ninguém”.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: aquele a quem o Filho quiser revelar
  rationale: “Quiser” conserva a iniciativa volitiva do Filho; “revelar” traduz diretamente a ideia de desvelar ou dar a conhecer. O objeto não expresso em português é claramente o Pai, mencionado imediatamente antes.
theological_decisions:
- issue: Força de ἐπιγινώσκω no conhecimento recíproco do Pai e do Filho
  choice: conhece
  alternative: conhece plenamente
  rationale: O contexto salienta a exclusividade desse conhecimento, mas o verbo composto não requer por si só o advérbio “plenamente”. O texto principal preserva a formulação sóbria, e a nota registra a possível nuance intensiva.
- issue: Iniciativa volitiva em βούληται
  choice: quiser
  alternative: decidir revelar
  rationale: “Quiser” atribui ao Filho iniciativa real na revelação sem converter o verbo em mero desejo nem desenvolver uma doutrina denominacional sobre essa escolha.
- issue: Objeto de ἀποκαλύψαι
  choice: objeto implícito, referente ao Pai
  alternative: revelá-lo
  rationale: O grego não traz objeto pronominal expresso. O português permite a mesma elipse com referente claro, evitando acrescentar ao texto principal uma palavra apenas inferida da sintaxe.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com boa legibilidade brasileira. “Tampouco alguém” conserva o paralelismo negativo sem soar arcaico; o ponto e vírgula torna clara a estrutura recíproca das duas declarações.
