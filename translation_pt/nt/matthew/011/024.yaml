id: MAT.11.24
reference: Matthew 11:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: pt
  text: Mas digo a vocês que, no dia do juízo, será mais suportável para a terra de Sodoma do que para você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mais tolerável”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Mas
  rationale: Introduz uma forte contraposição e transição; “Mas” é natural e preserva a força adversativa no contexto.
- source_word: λέγω ὑμῖν
  choice: eu lhe digo
  rationale: A fórmula de fala direta é vertida de modo corrente; “lhe” preserva o destinatário singular indicado pelo contexto e por σοί no fim do versículo.
- source_word: γῇ Σοδόμων
  choice: para a terra de Sodoma
  rationale: Mantém explícito γῇ, “terra/território”, sem reduzir a expressão apenas ao nome da cidade.
- source_word: ἀνεκτότερον
  choice: mais suportável
  rationale: Expressa o comparativo de ἀνεκτός em português atual e digno; “mais tolerável” também é possível.
- source_word: ἔσται
  choice: será
  rationale: Reproduz diretamente o futuro simples da cópula grega.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: no dia do juízo
  rationale: Preserva a construção temporal e o sentido de κρίσις como juízo, sem acrescentar explicação escatológica ao texto.
- source_word: ἢ σοί
  choice: do que para você
  rationale: Conserva o pronome singular e a comparação com a cidade personificada, sem transformá-lo em referência plural aos habitantes.
theological_decisions:
- issue: Referente do singular σοί
  choice: Manter a segunda pessoa do singular, “você”, como fala dirigida à cidade personificada.
  alternative: Expandir para “vocês” ou “os seus habitantes”.
  rationale: O grego emprega o singular e continua a interpelação profética à cidade no contexto. A tradução preserva essa força retórica e não resolve a personificação por meio de uma paráfrase.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Você” torna inequívoco o singular da cidade personificada; “lhe” mantém essa concordância. A ordem foi ajustada naturalmente em português, preservando a ênfase no dia do juízo e a comparação explícita.
