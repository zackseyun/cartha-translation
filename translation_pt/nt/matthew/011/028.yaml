  text: Δεῦτε πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: pt
  text: Venham a mim todos os que trabalham arduamente e estão sobrecarregados[a], e eu lhes darei descanso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que receberam uma carga e continuam sob ela”. A forma grega indica um estado presente resultante de uma carga recebida.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eu os revigorarei”. O verbo grego pode significar fazer alguém descansar ou revigorá-lo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε πρός με
  choice: Venham a mim
  rationale: Expressa de modo natural em português o imperativo de convite e o movimento em direção à pessoa de Jesus.
- source_word: πάντες
  choice: todos vocês
  rationale: Preserva o alcance abrangente do convite e deixa claro o plural no português corrente.
- source_word: οἱ κοπιῶντες
  choice: que estão cansados de tanto trabalhar
  rationale: Comunica tanto o esforço contínuo quanto o cansaço decorrente dele, sentidos presentes no particípio grego, em linguagem acessível.
- source_word: πεφορτισμένοι
  choice: sobrecarregados
  rationale: Reflete o estado presente resultante de terem recebido uma carga, conforme o particípio perfeito passivo.
- source_word: κἀγὼ
  choice: e eu
  rationale: Mantém o sujeito explícito e a leve ênfase ou contraposição do grego sem exagerá-la.
- source_word: ἀναπαύσω ὑμᾶς
  choice: eu lhes darei descanso
  rationale: É uma formulação portuguesa natural que preserva a promessa ampla de fazer descansar, sem restringi-la a alívio físico, emocional ou espiritual.
theological_decisions:
- issue: Natureza do descanso prometido em ἀναπαύσω
  choice: eu lhes darei descanso
  alternative: eu os revigorarei
  rationale: A formulação mantém amplo o sentido do descanso prometido, sem decidir se ele é físico, emocional, espiritual ou escatológico.
translation_notes:
  register: Português moderno, digno e acessível, com construção de ampla legibilidade brasileira. “Todos vocês” esclarece o plural; “lhes darei descanso” evita tanto arcaísmo quanto especificação teológica indevida.
