  text: Τίνι δὲ ὁμοιώσω τὴν γενεὰν ταύτην; ὁμοία ἐστὶν παιδίοις ⸂καθημένοις ἐν ταῖς ἀγοραῖς ἃ προσφωνοῦντα τοῖς ἑτέροις⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/016.yaml
  text: But to what shall I compare this generation? It is like children sitting in the marketplaces[a], calling out to the others[b],
translation:
  language: pt
  text: Mas com que compararei esta geração? Ela é semelhante a crianças sentadas nas praças de mercado[a], chamando as outras[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas praças públicas”. O termo grego se refere a áreas públicas de mercado, onde as pessoas também se reuniam.
    reason: lexical_alternative
  - marker: b
    text: Ou “chamando outras crianças”. O texto grego diz apenas “as outras”, cuja identidade é indicada pelo contexto da comparação.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνι δὲ ὁμοιώσω
  choice: Mas com que compararei
  rationale: A construção com dativo pergunta pelo termo de comparação. “Com que compararei” é natural em português e preserva o futuro retórico; δέ introduz uma transição levemente contrastiva.
- source_word: τὴν γενεὰν ταύτην
  choice: esta geração
  rationale: γενεά designa aqui a geração contemporânea considerada coletivamente; a formulação tradicional também é clara no português atual.
- source_word: ὁμοία ἐστὶν
  choice: Ela é semelhante a
  rationale: Expressa diretamente a relação de semelhança e mantém um registro digno e corrente.
- source_word: παιδίοις
  choice: crianças
  rationale: O termo se refere genericamente a crianças; não é necessário explicitar uma nuance diminutiva.
- source_word: καθημένοις ἐν ταῖς ἀγοραῖς
  choice: sentadas nas praças públicas
  rationale: ἀγορά era uma área pública de mercado e convivência. “Praças públicas” comunica melhor o cenário antigo do que o moderno “mercados”.
- source_word: ἃ προσφωνοῦντα
  choice: chamando
  rationale: O particípio descreve as crianças dirigindo a voz a outras; “chamando” é conciso e natural.
- source_word: τοῖς ἑτέροις
  choice: as outras
  rationale: O grego diz literalmente “às outras”; em português, o gênero feminino retoma naturalmente “crianças”, sem precisar repetir o substantivo.
