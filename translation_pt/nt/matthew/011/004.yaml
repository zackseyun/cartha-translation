  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ ἀκούετε καὶ βλέπετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/004.yaml
  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: pt
  text: 'E Jesus lhes respondeu: “Vão e contem a João o que vocês estão ouvindo e vendo:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a ligação narrativa simples do texto grego sem acrescentar uma nuance temporal.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: Jesus lhes respondeu
  rationale: A fórmula narrativa grega, literalmente ‘respondendo, disse-lhes’, é expressa de modo natural e fiel em português; os dois verbos formam aqui uma introdução idiomática à resposta.
- source_word: Πορευθέντες
  choice: Vão
  rationale: 'O particípio aoristo, ligado ao imperativo seguinte, tem força de ordem e indica a ação preliminar: ir.'
- source_word: ἀπαγγείλατε
  choice: contem
  rationale: No contexto, significa transmitir a João um relato do que seus mensageiros presenciam. ‘Contem’ é claro e natural, preservando a ideia de comunicar a informação de volta.
- source_word: Ἰωάννῃ
  choice: a João
  rationale: O dativo indica o destinatário da comunicação e é naturalmente vertido com ‘a’.
- source_word: ἃ ἀκούετε καὶ βλέπετε
  choice: o que vocês estão ouvindo e vendo
  rationale: Preserva o objeto relativo e a experiência presente e contínua dos mensageiros; ‘vocês’ torna explícito o plural já marcado nos verbos gregos.
theological_decisions:
- issue: Fórmula narrativa ἀποκριθεὶς ... εἶπεν
  choice: Jesus lhes respondeu
  alternative: Jesus, respondendo, disse-lhes
  rationale: A forma condensada reproduz a função discursiva da expressão grega em português corrente sem eliminar qualquer conteúdo teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega ‘vocês’ para deixar inequívoco o destinatário plural. A construção ‘estão ouvindo e vendo’ comunica o aspecto presente no contexto. O dois-pontos final preserva a continuidade da fala no versículo seguinte.
