id: MAT.11.21
reference: Matthew 11:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: pt
  text: Ai de você, Corazim! Ai de você, Betsaida! Pois, se as obras poderosas[a] realizadas entre vocês tivessem acontecido em Tiro e Sidom, Tiro e Sidom já teriam se arrependido há muito tempo, em pano de saco e cinzas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “milagres”; em grego, “obras de poder”.
    reason: Alternativa lexical para αἱ δυνάμεις.
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Ai de você
  rationale: Preserva tanto o tom profético de denúncia quanto o de lamento, em uma expressão corrente e digna em português.
- source_word: Χοραζίν
  choice: Corazim
  rationale: Emprega a forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: Βηθσαϊδά
  choice: Betsaida
  rationale: Emprega a forma tradicional do topônimo em português.
- source_word: ὅτι
  choice: Pois
  rationale: Introduz naturalmente a razão da declaração de juízo.
- source_word: αἱ δυνάμεις
  choice: as obras poderosas
  rationale: Mantém a ligação lexical com poder e descreve atos de poder divino sem reduzir de imediato o sentido à categoria moderna de milagres.
- source_word: ἐγένοντο ... αἱ γενόμεναι
  choice: tivessem acontecido ... realizadas
  rationale: Expressa com naturalidade a condição contrária aos fatos e evita uma repetição pesada, sem perder a relação entre os dois usos de γίνομαι.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: O plural se refere aos habitantes das cidades e indica obras ocorridas no meio deles, não dentro deles.
- source_word: πάλαι ἂν ... μετενόησαν
  choice: há muito tempo elas teriam se arrependido
  rationale: Representa a consequência contrária aos fatos e traduz μετανοέω pelo termo português natural para a mudança moral e religiosa exigida no contexto.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: com pano de saco e cinzas
  rationale: Conserva a imagem cultural de luto, humilhação e arrependimento em formulação compreensível em português.
theological_decisions:
- issue: Natureza da comparação de Jesus com Tiro e Sidom
  choice: Uma afirmação contrafactual que realça a maior culpabilidade das cidades que presenciaram as obras poderosas e não se arrependeram.
  alternative: Uma hipérbole meramente retórica, sem comparação real de juízo.
  rationale: A tradução mantém a força da comparação e a tensão do contrafactual, sem acrescentar conclusões doutrinárias que ultrapassem o texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. O pronome singular trata cada cidade como interlocutora coletiva; o plural em “entre vocês” e “elas teriam” se refere aos habitantes de Corazim e Betsaida e, na comparação, aos de Tiro e Sidom.
