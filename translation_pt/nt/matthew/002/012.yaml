  text: καὶ χρηματισθέντες κατ’ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην δι’ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: pt
  text: E, tendo sido avisados[a] em sonho para não voltarem a Herodes, regressaram à sua terra por outro caminho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «tendo recebido um aviso divino». O passivo grego sugere que o aviso veio de Deus, embora Deus não seja mencionado explicitamente neste versículo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «por outra rota».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: tendo sido avisados
  rationale: O particípio passivo comunica que eles receberam um aviso, com agência divina implícita no contexto, sem acrescentar explicitamente «por Deus» ao texto.
- source_word: κατ’ ὄναρ
  choice: em sonho
  rationale: Expressão portuguesa natural para a revelação recebida durante um sonho e correspondente ao uso de Mateus.
- source_word: μὴ ἀνακάμψαι
  choice: para não voltarem
  rationale: O infinitivo com μή expressa o conteúdo negativo do aviso; «não voltarem» é claro e adequado ao contexto de viagem.
- source_word: πρὸς Ἡρῴδην
  choice: a Herodes
  rationale: πρός com acusativo indica movimento em direção à pessoa; «voltar a Herodes» é idiomático e preserva o sentido.
- source_word: δι’ ἄλλης ὁδοῦ
  choice: por outro caminho
  rationale: ὁδός designa aqui o caminho ou itinerário concreto. «Por outro caminho» é natural, amplamente compreensível e próximo da forma grega.
- source_word: ἀνεχώρησαν
  choice: regressaram
  rationale: No contexto, o verbo descreve a partida que os leva de volta à sua própria terra. «Regressaram» torna a sequência de viagem clara sem sugerir necessariamente fuga.
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: à sua terra
  rationale: χώρα pode significar terra, país ou região; «sua terra» expressa de modo natural o destino de origem sem definir com precisão maior do que a do grego.
theological_decisions:
- issue: Agente divino implícito no aviso
  choice: 'Manter a construção passiva: «tendo sido avisados»'
  alternative: «tendo sido avisados por Deus» ou «tendo recebido um aviso divino»
  rationale: O contexto e o emprego de χρηματίζω sugerem fortemente origem divina, mas Deus não é nomeado de forma explícita neste versículo. A tradução mantém a implicação sem inserir um agente expresso.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade no Brasil e compreensão internacional. «Regressaram» e «à sua terra» evitam formulações excessivamente literais, enquanto «por outro caminho» preserva a concretude da narrativa.
