id: MAT.2.6
reference: Matthew 2:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: pt
  text: E você, Belém, terra de Judá, de modo algum é a menor entre os governantes de Judá; pois de você sairá um governante que pastoreará[a] o meu povo, Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Pastoreará» também pode ter o sentido de «governará», unindo a imagem do cuidado pastoral à autoridade régia.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ
  choice: terra
  rationale: Em aposição a Belém e seguida de «de Judá», designa a terra ou região associada a Judá, não o solo ou o planeta.
- source_word: οὐδαμῶς
  choice: de modo algum
  rationale: Preserva a negação enfática do advérbio, mais forte que um simples «não».
- source_word: ἐλαχίστη
  choice: a menor
  rationale: Comunica posição ou importância relativa no contexto, sem transformar explicitamente a ideia em «menos importante».
- source_word: ἡγεμόσιν
  choice: governantes
  rationale: Mantém o sentido amplo de figuras ou unidades dirigentes de Judá, sem impor um cargo político mais específico.
- source_word: ἐξελεύσεται
  choice: sairá
  rationale: Reproduz de maneira natural o sentido de sair ou proceder de Belém, especialmente com a construção precedente «de você».
- source_word: ἡγούμενος
  choice: um governante
  rationale: O particípio substantivado descreve alguém que exerce liderança ou governo; «governante» preserva a dimensão régia.
- source_word: ποιμανεῖ
  choice: pastoreará
  rationale: Mantém a imagem concreta do pastor e, ao mesmo tempo, permite sua extensão metafórica à liderança e ao governo.
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: o meu povo, Israel
  rationale: Conserva a expressão de relação pactual e torna clara, pela vírgula, a aposição identificadora de Israel.
theological_decisions:
- issue: Nuances régia e pastoral na descrição daquele que virá
  choice: Traduzir ἡγούμενος por «um governante» e ποιμανεῖ por «pastoreará».
  alternative: Uniformizar as duas expressões em linguagem exclusivamente política («líder» / «governará») ou exclusivamente pastoral.
  rationale: O texto reúne governo e pastoreio. Preservar ambas as imagens evita reduzir a figura prometida apenas ao poder régio ou apenas ao cuidado pastoral.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega «você» para naturalidade contemporânea e mantém a estrutura solene da citação. A formulação incomum «entre os governantes de Judá» foi preservada por corresponder ao grego, sem substituir silenciosamente «governantes» por cidades, clãs ou regiões.
