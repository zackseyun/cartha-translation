id: MAT.2.16
reference: Matthew 2:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: pt
  text: Então Herodes, ao perceber que havia sido enganado[a] pelos magos[b], ficou muito irado. Enviou homens para matar todos os meninos em Belém e em toda a região ao redor, de dois anos de idade ou menos, conforme o tempo que havia apurado junto aos magos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “havia sido feito de tolo”; o verbo grego também pode significar “zombar de alguém”.'
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “sábios”. O termo grego é magos e se refere a sábios-astrólogos orientais.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Conector temporal natural que mantém a sequência narrativa.
- source_word: ἰδὼν ὅτι
  choice: ao perceber que
  rationale: Expressa com naturalidade a percepção de Herodes e a relação circunstancial do particípio com a ação principal.
- source_word: ἐνεπαίχθη
  choice: havia sido enganado
  rationale: No contexto, os magos não voltaram a Herodes e, assim, frustraram seu plano; “enganado” comunica essa força contextual. A possibilidade mais literal, “feito de tolo” ou “zombado”, é registrada em nota.
- source_word: ὑπὸ τῶν μάγων
  choice: pelos magos
  rationale: Preserva o termo histórico-cultural μάγοι sem substituí-lo pela designação tradicional e mais interpretativa “sábios”.
- source_word: ἐθυμώθη λίαν
  choice: ficou muito irado
  rationale: Reproduz o ingresso no estado de ira e a intensificação marcada por λίαν, em registro digno e corrente.
- source_word: ἀποστείλας ἀνεῖλεν
  choice: Enviou homens para matar
  rationale: Torna explícitos em português os agentes implícitos enviados por Herodes e preserva a relação entre o envio e a matança, sem sugerir que ele a executou pessoalmente.
- source_word: πάντας τοὺς παῖδας
  choice: todos os meninos
  rationale: Neste contexto, παῖδας designa as crianças do sexo masculino visadas pela busca do menino Jesus.
- source_word: ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: de Belém e de todos os seus arredores
  rationale: “Arredores” comunica naturalmente o território circundante indicado por ὅρια.
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: de dois anos de idade ou menos
  rationale: Expressa com clareza o limite etário máximo inclusivo.
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων
  choice: conforme o tempo que havia apurado junto aos magos
  rationale: Mantém a ideia de conformidade com a informação temporal que Herodes determinara cuidadosamente por meio dos magos.
theological_decisions:
- issue: Identidade dos μάγοι
  choice: magos
  alternative: sábios
  rationale: “Magos” representa mais diretamente a designação grega dos sábios-astrólogos orientais e evita importar imagens tradicionais posteriores; a alternativa familiar é indicada em nota.
- issue: Sentido contextual de ἐνεπαίχθη
  choice: havia sido enganado
  alternative: havia sido feito de tolo / havia sido zombado
  rationale: O contexto enfatiza que Herodes teve seu plano frustrado quando os magos não voltaram. A tradução principal comunica esse efeito, enquanto a nota preserva a amplitude lexical e a possível ideia de afronta.
- issue: Agência de Herodes na matança
  choice: Enviou homens para matar
  alternative: mandou matar
  rationale: A formulação representa tanto ἀποστείλας quanto ἀνεῖλεν e deixa claro que Herodes foi o responsável pela ordem e pelo envio dos executores, sem afirmar que matou pessoalmente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases evita uma coordenação excessivamente longa. “Muito irado” conserva a intensidade do grego sem recorrer a linguagem arcaica; “de dois anos de idade ou menos” é internacionalmente claro.
