  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: pt
  text: Depois de ouvirem o rei, eles seguiram viagem. E eis que a estrela que tinham visto no oriente[a] ia adiante deles, até que chegou e parou sobre o lugar em que estava o menino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ao nascer dela». A expressão grega pode referir-se tanto ao oriente como região ou direção quanto ao nascer de uma estrela.
    reason: Leitura alternativa decorrente da ambiguidade lexical de ἐν τῇ ἀνατολῇ.
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: Depois de ouvirem o rei
  rationale: O particípio aoristo indica uma ação anterior à partida, e o genitivo com ἀκούω identifica a pessoa ouvida. A formulação mantém “o rei”, sem acrescentar “Herodes” a partir do contexto.
- source_word: ἐπορεύθησαν
  choice: eles seguiram viagem
  rationale: Expressa de modo natural o movimento narrativo de partir e prosseguir o caminho, sem acrescentar detalhes ausentes do grego.
- source_word: ἰδοὺ
  choice: E eis que
  rationale: Conserva o marcador discursivo que chama a atenção para o aparecimento surpreendente da estrela, em registro digno e ainda compreensível.
- source_word: ἀστὴρ
  choice: estrela
  rationale: É o equivalente direto e normal no contexto.
- source_word: ὃν εἶδον
  choice: que tinham visto
  rationale: O mais-que-perfeito composto deixa clara, em português natural, a anterioridade dessa visão em relação ao movimento descrito agora.
- source_word: ἐν τῇ ἀνατολῇ
  choice: no oriente
  rationale: Mantém a leitura geográfica tradicional e natural, enquanto a possível referência astronômica ao nascimento da estrela é preservada em nota.
- source_word: προῆγεν αὐτούς
  choice: ia adiante deles
  rationale: Preserva a imagem de a estrela avançar à frente deles sem definir além do texto como se dava essa orientação.
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: até que chegou e parou
  rationale: Reproduz em português corrente a sequência de chegada e cessação do movimento expressa pelo particípio e pelo verbo principal.
- source_word: ἐπάνω οὗ ἦν
  choice: sobre o lugar onde estava
  rationale: Explicita naturalmente em português a referência locativa implícita no relativo grego, sem alterar seu sentido.
- source_word: τὸ παιδίον
  choice: o menino
  rationale: παιδίον designa aqui uma criança; “o menino” é natural no contexto e mantém a referência masculina, sem acrescentar uma faixa etária específica.
theological_decisions:
- issue: Sentido de ἐν τῇ ἀνατολῇ na narrativa da estrela
  choice: no oriente
  alternative: quando ela surgiu
  rationale: A expressão grega pode indicar o oriente como região ou direção, mas também pode ter sentido astronômico e referir-se ao nascer ou surgimento de um astro. O texto principal adota a leitura geográfica conhecida, e a nota conserva a alternativa legítima sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “E eis que” preserva a vivacidade narrativa do original; “parou” comunica de forma natural o sentido contextual de ἐστάθη.
