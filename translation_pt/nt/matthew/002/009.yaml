  rationale: A única revisão necessária é na nota, para expressar com precisão a alternativa astronômica de ἐν τῇ ἀνατολῇ. Fez-se também um ajuste estilístico mínimo de «onde» para «em que», sem mudança de sentido. O texto não resolve a ambiguidade nem acrescenta uma explicação interpretativa sobre o fenômeno da estrela.
