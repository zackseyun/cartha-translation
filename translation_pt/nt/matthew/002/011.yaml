reference: Matthew 2:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: pt
  text: 'Ao entrarem na casa, viram o menino com Maria, sua mãe. Então, prostraram-se e lhe prestaram homenagem[a]. Abriram seus tesouros e lhe ofereceram presentes: ouro, olíbano e mirra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o adoraram”. O verbo grego pode indicar adoração ou um ato de profunda reverência e homenagem, conforme o contexto.'
    reason: Leitura alternativa que preserva a amplitude semântica e a tensão teológica de προσκυνέω.
lexical_decisions:
- source_word: οἰκίαν
  choice: casa
  rationale: Tradução direta e natural para a moradia concreta indicada no contexto.
- source_word: παιδίον
  choice: menino
  rationale: No contexto, refere-se ao menino Jesus; a escolha é natural em português e não acrescenta uma idade específica.
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: com Maria, sua mãe
  rationale: Preserva a construção com μετά e identifica Maria de modo claro como mãe do menino.
- source_word: πεσόντες
  choice: prostraram-se
  rationale: Expressa com naturalidade o gesto corporal de lançar-se ao chão diante de alguém, sem reduzi-lo a mero ajoelhar-se.
- source_word: προσεκύνησαν
  choice: prestaram homenagem
  rationale: Mantém a possibilidade de reverência régia sem excluir a leitura mais forte de adoração, registrada em nota.
- source_word: θησαυροὺς
  choice: tesouros
  rationale: Conserva a amplitude do termo grego, que pode referir-se aos bens valiosos ou aos recipientes em que eram guardados, sem especificar 'baús'.
- source_word: προσήνεγκαν
  choice: ofereceram
  rationale: Verbo natural para a apresentação formal de dádivas.
- source_word: δῶρα
  choice: presentes
  rationale: Equivalente claro e pouco interpretativo para as dádivas apresentadas.
- source_word: λίβανον
  choice: olíbano
  rationale: Designa precisamente a resina aromática específica, em vez do termo mais amplo 'incenso'.
- source_word: σμύρναν
  choice: mirra
  rationale: Equivalente português tradicional e preciso do termo grego.
theological_decisions:
- issue: Sentido de προσκυνέω em relação ao menino Jesus
  choice: prestaram homenagem
  alternative: o adoraram
  rationale: O verbo pode indicar tanto adoração quanto reverência ou homenagem mediante prostração. O texto principal preserva a tensão entre homenagem régia e adoração, e a nota registra explicitamente a leitura mais forte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A sequência de particípios gregos foi distribuída em frases curtas para clareza, sem alterar a ordem narrativa. 'Olíbano' privilegia a precisão lexical; a nota foi colocada junto de 'homenagem', expressão a que efetivamente se refere.
