source:
  edition: SBLGNT
  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: pt
  text: Mas, depois que Herodes morreu, eis que um anjo do Senhor[a] aparece em sonho a José, no Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o anjo do Senhor”. O grego não traz artigo antes de “anjo”.'
    reason: Preserva a alternativa tradicional e sua possível associação intertextual, sem fazê-la prevalecer sobre a forma mais direta do texto grego.
lexical_decisions:
- source_word: Τελευτήσαντος δὲ τοῦ Ἡρῴδου
  choice: Mas, depois que Herodes morreu
  rationale: O particípio aoristo em genitivo absoluto tem sentido temporal. “Depois que Herodes morreu” expressa com naturalidade a anterioridade da morte, enquanto “mas” conserva a transição levemente contrastiva de δέ.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Mantém o marcador vívido de atenção narrativa e o tom literário de Mateus sem soar excessivamente coloquial.
- source_word: ἄγγελος κυρίου
  choice: um anjo do Senhor
  rationale: A ausência de artigo diante de ἄγγελος favorece a apresentação indefinida “um anjo”; “do Senhor” é a forma portuguesa idiomática para o genitivo κυρίου.
- source_word: φαίνεται
  choice: aparece
  rationale: Preserva o presente histórico grego e sua vivacidade narrativa.
- source_word: κατ’ ὄναρ
  choice: em sonho
  rationale: Equivalente português natural para a expressão que indica uma revelação recebida durante um sonho.
- source_word: τῷ Ἰωσὴφ
  choice: a José
  rationale: O dativo identifica a pessoa a quem o anjo aparece; “José” é a forma tradicional e corrente do nome em português.
- source_word: ἐν Αἰγύπτῳ
  choice: no Egito
  rationale: Expressa de modo direto a localização de José no momento do sonho.
theological_decisions:
- issue: Sentido de κύριος em ἄγγελος κυρίου
  choice: Senhor
  alternative: senhor; soberano
  rationale: No contexto mateano, “Senhor” preserva o título divino e a ligação com o uso bíblico da expressão, sem acrescentar uma identificação além do que o texto afirma.
- issue: Definição de ἄγγελος sem artigo
  choice: um anjo do Senhor
  alternative: o anjo do Senhor
  rationale: O grego não traz artigo antes de ἄγγελος, portanto a forma indefinida é a leitura mais direta. A alternativa definida é possível em português por influência da expressão bíblica tradicional, mas pode sugerir uma identidade específica que este versículo não exige.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Eis que” conserva a vivacidade literária do original; o presente “aparece” reproduz deliberadamente o presente histórico grego. A vírgula em “José, no Egito” deixa claro que a expressão locativa situa José, não o sonho.
