  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: pt
  text: Ao ouvir isso, o rei Herodes ficou perturbado[a], e, com ele, toda Jerusalém[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ficou alarmado».'
