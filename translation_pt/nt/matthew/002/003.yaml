    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: Ao ouvir isso
  rationale: 'O particípio aoristo tem valor temporal. A formulação explicita de modo natural em português o objeto implícito no contexto: a notícia trazida pelos magos.'
- source_word: δὲ
  choice: incorporado à construção temporal
  rationale: A partícula funciona como conectivo leve; seu valor discursivo é transmitido naturalmente pela abertura «Ao ouvir isso», sem acrescentar uma conjunção independente.
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: o rei Herodes
  rationale: Mantém o título e o nome na ordem mais natural em português contemporâneo.
- source_word: ἐταράχθη
  choice: ficou perturbado
  rationale: Expressa a perturbação interior ou o alarme indicado pelo aoristo passivo de ταράσσω, sem definir além do texto a intensidade ou a causa emocional.
- source_word: πᾶσα Ἱεροσόλυμα
  choice: toda Jerusalém
  rationale: Preserva a metonímia do grego, que usa o nome da cidade para se referir coletivamente aos seus habitantes, sem restringir a referência a um grupo específico.
- source_word: μετ’ αὐτοῦ
  choice: com ele
  rationale: Reproduz diretamente a associação entre a perturbação de Herodes e a de Jerusalém.
theological_decisions:
- issue: Alcance de πᾶσα Ἱεροσόλυμα
  choice: Manter a referência corporativa e metonímica a «toda Jerusalém»
  alternative: Entender a expressão como generalização ou hipérbole referente a muitos habitantes, ou limitá-la especialmente às lideranças da cidade
  rationale: O texto grego nomeia a cidade como um todo. A tradução conserva essa tensão narrativa e não introduz uma delimitação sociológica que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A metonímia do original foi preservada no texto principal.
