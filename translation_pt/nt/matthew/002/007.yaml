  source_fidelity: A estrutura e os principais termos estão bem representados. Contudo, «procurou saber» pode sugerir apenas uma tentativa de obter informação, enquanto ἠκρίβωσεν comunica que Herodes apurou/determinou cuidadosamente a informação. «Mandou chamar secretamente» também reproduz com mais precisão a força deliberada de καλέσας e λάθρᾳ.
  naturalness: A redação é clara e natural. A revisão proposta preserva esse registro moderno, mas torna mais idiomática e específica a relação entre Herodes, os magos e a informação apurada.
