lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca a sequência temporal da narrativa de modo natural e claro em português.
- source_word: Ἡρῴδης
  choice: Herodes
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: λάθρᾳ
  choice: em segredo
  rationale: Expressa a natureza oculta da ação de Herodes em linguagem corrente e digna.
- source_word: καλέσας
  choice: chamou
  rationale: Reformula naturalmente o particípio aoristo como ação anterior coordenada ao verbo principal, sem perder a sequência dos acontecimentos.
- source_word: τοὺς μάγους
  choice: os magos
  rationale: É a correspondência mais direta de μάγοι e evita identificar essas figuras de modo mais específico do que o texto permite.
- source_word: ἠκρίβωσεν
  choice: procurou saber com exatidão
  rationale: Preserva a ideia de averiguar cuidadosamente e com precisão, sem afirmar necessariamente que Herodes chegou a uma conclusão infalível.
- source_word: παρ’ αὐτῶν
  choice: deles
  rationale: Representa παρά com genitivo como indicação da fonte da informação.
- source_word: τὸν χρόνον τοῦ φαινομένου ἀστέρος
  choice: quando a estrela havia aparecido
  rationale: Converte a construção genitiva com particípio em uma oração temporal natural em português e situa o aparecimento antes da investigação de Herodes.
