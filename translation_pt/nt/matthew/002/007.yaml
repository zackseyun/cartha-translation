- from: Então Herodes chamou os magos[a] em segredo e procurou saber deles com exatidão quando a estrela havia aparecido.
  to: Então Herodes mandou chamar secretamente os magos[a] e apurou com precisão, por meio deles, o tempo em que a estrela havia aparecido.
  rationale: A revisão explicita o caráter deliberado e secreto da convocação e traduz ἠκρίβωσεν por «apurou com precisão», preservando a ideia de obtenção cuidadosa da informação. A oração «o tempo em que a estrela havia aparecido» conserva a referência temporal do particípio grego. A nota foi simplificada para evitar uma especificação interpretativa não necessária.
