  text: Then Herod secretly summoned the magi and determined from them the time when the star had appeared,[a]
translation:
  language: pt
  text: Então Herodes mandou chamar secretamente os magos[a] e apurou com precisão, por meio deles, o tempo em que a estrela havia aparecido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os sábios”. O termo grego μάγοι refere-se mais especificamente a magos, isto é, estudiosos orientais ligados à astrologia.
