  issues:
  - severity: medium
    issue: «procurou saber deles com exatidão» atenua o aspecto resultativo de ἠκρίβωσεν.
    rationale: O verbo grego denota apurar ou determinar cuidadosamente a informação. «Procurou saber» pode indicar uma investigação sem deixar claro que a informação foi efetivamente obtida.
  - severity: low
