id: MAT.2.22
reference: Matthew 2:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: pt
  text: Mas, quando ouviu que Arquelau reinava sobre a Judeia no lugar de seu pai Herodes, teve medo de ir para lá. E, advertido em sonho[a], retirou-se para as regiões da Galileia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «instruído»; o verbo frequentemente indica uma advertência ou instrução divina.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: quando ouviu
  rationale: O particípio aoristo apresenta a circunstância anterior à ação principal; «quando ouviu» expressa naturalmente esse valor temporal.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste entre a intenção anterior de José e o obstáculo causado pela notícia sobre Arquelau.
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: reinava sobre a Judeia
  rationale: Preserva a nuance régia de βασιλεύω e verte naturalmente o genitivo do território governado.
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: no lugar de seu pai Herodes
  rationale: ἀντί indica aqui substituição ou sucessão, sem precisar explicitar além do texto que Arquelau sucedeu ao pai.
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: teve medo de ir para lá
  rationale: Formulação corrente e clara que preserva o medo como motivo para não seguir ao destino pretendido.
- source_word: χρηματισθεὶς
  choice: advertido
  rationale: O particípio passivo indica que José recebeu uma advertência ou instrução; o agente permanece implícito, como no grego.
- source_word: κατ’ ὄναρ
  choice: em sonho
  rationale: Expressão portuguesa natural para a fórmula mateana de comunicação reveladora durante o sono.
- source_word: ἀνεχώρησεν
  choice: retirou-se
  rationale: Conserva a ideia de uma partida deliberada em resposta ao perigo ou à orientação recebida.
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: para as regiões da Galileia
  rationale: Mantém o plural μέρη e apresenta a Galileia como uma área composta de distritos ou localidades.
theological_decisions:
- issue: Explicitação do agente da advertência em χρηματισθείς
  choice: Manter «advertido» sem acrescentar «por Deus».
  alternative: «advertido por Deus» ou «depois de receber instrução divina»
  rationale: No uso de Mateus, o verbo frequentemente sugere comunicação divina, mas o agente não é expresso neste versículo. A tradução preserva essa implicitude e registra a nuance em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Arquelau», «Judeia» e «Galileia» seguem formas consagradas. A vírgula final foi mantida porque o versículo continua sintaticamente no seguinte.
