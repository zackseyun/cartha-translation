reference: Matthew 2:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγοντες· Ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: pt
  text: 'dizendo: “Onde está aquele que nasceu rei dos judeus? Pois vimos a sua estrela no Oriente[a] e viemos prestar-lhe homenagem.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quando ela surgiu”. A expressão grega ἐν τῇ ἀνατολῇ pode significar “no Oriente” ou referir-se ao nascer da estrela.
    reason: alternative_reading
  - marker: b
    text: Ou “adorá-lo”. O verbo grego pode indicar tanto homenagem prestada a um rei quanto adoração, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: dizendo
  rationale: O particípio presente introduz diretamente as palavras dos magos; “dizendo” preserva essa função narrativa de modo claro e natural.
- source_word: Ποῦ ἐστιν
  choice: Onde está
  rationale: Reproduz sem expansão a pergunta locativa direta do grego.
- source_word: ὁ τεχθεὶς
  choice: aquele que nasceu
  rationale: O particípio aoristo passivo substantivado destaca o nascimento sem acrescentar a ideia mais específica de que seja “recém-nascido”.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: rei dos judeus
  rationale: É a forma portuguesa natural do título régio e conserva sua força política e messiânica.
- source_word: εἴδομεν γὰρ
  choice: Pois vimos
  rationale: γάρ apresenta a razão da pergunta, e o aoristo εἴδομεν é expresso naturalmente pelo pretérito perfeito em português.
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: a sua estrela
  rationale: O pronome no genitivo tem sentido possessivo; a formulação não especifica a natureza do sinal celeste.
- source_word: ἐν τῇ ἀνατολῇ
  choice: no Oriente
  rationale: ἀνατολή pode indicar a direção oriental ou o nascer de um astro. “No Oriente” é uma leitura contextual e tradicionalmente plausível, enquanto a ambiguidade real é preservada em nota.
- source_word: ἤλθομεν
  choice: viemos
  rationale: 'O pretérito perfeito é natural na fala direta: a vinda já ocorreu e culmina na presença dos magos naquele momento.'
- source_word: προσκυνῆσαι αὐτῷ
  choice: prestar-lhe homenagem
  rationale: προσκυνέω pode abranger prostração, homenagem régia ou adoração. Como o contexto imediato identifica a criança como rei, esta opção preserva a reverência régia sem eliminar a possibilidade teológica mais ampla, indicada em nota.
theological_decisions:
- issue: Sentido de προσκυνῆσαι em relação ao menino Jesus
  choice: prestar-lhe homenagem
  alternative: adorá-lo
  rationale: O campo semântico permite tanto homenagem prestada a um rei quanto adoração. O título “rei dos judeus” favorece a homenagem régia no contexto imediato, mas a nota conserva a tensão e não nega o peso cristológico que o verbo pode adquirir no conjunto de Mateus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a estrutura direta da pergunta e preserva em notas as ambiguidades astronômica e teológica do grego.
