id: MAT.2.13
reference: Matthew 2:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: pt
  text: 'Depois que eles partiram, eis que um anjo do Senhor[a] apareceu em sonho a José e disse: “Levante-se, leve o menino e sua mãe, fuja para o Egito e fique lá até que eu lhe diga, pois Herodes está prestes a procurar o menino para matá-lo[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, conforme a expressão bíblica tradicional, “o anjo do Senhor”. O grego não traz artigo antes de “anjo”.
    reason: alternative_reading
  - marker: b
    text: 'Em sentido mais literal: “destruí-lo”; aqui, isto é, causar a morte dele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: Depois que eles partiram
  rationale: O genitivo absoluto indica uma ação anterior à principal. A formulação é natural em português e mantém a sequência temporal; pelo contexto, “eles” são os visitantes mencionados anteriormente.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva o marcador narrativo vívido de Mateus e assinala a intervenção repentina, mantendo um registro bíblico digno e compreensível.
- source_word: ἄγγελος κυρίου
  choice: um anjo do Senhor
  rationale: A construção grega não tem artigo; “um anjo do Senhor” é a tradução mais direta, sem identificar necessariamente essa figura como uma manifestação única e já conhecida.
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσὴφ
  choice: apareceu em sonho a José
  rationale: Embora φαίνεται esteja no presente histórico, o passado é mais natural na narrativa portuguesa. κατ’ ὄναρ é uma expressão idiomática que significa “em sonho”.
- source_word: λέγων
  choice: e disse
  rationale: O particípio introduz a fala direta. A coordenação verbal é mais natural em português do que o decalque “dizendo”.
- source_word: Ἐγερθεὶς
  choice: Levante-se
  rationale: Embora formalmente seja um particípio, integra uma sequência de ordens e tem força imperativa no contexto.
- source_word: παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ
  choice: pegue o menino e a mãe dele
  rationale: παραλαμβάνω aqui significa levar consigo. “Pegue” comunica de modo natural o ato de tomar ambos sob seus cuidados para partir; “a mãe dele” conserva a referência do pronome ao menino.
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: fuja para o Egito
  rationale: “Fuja” preserva a urgência e o perigo expressos pelo verbo grego.
- source_word: ἴσθι ἐκεῖ
  choice: fique lá
  rationale: Literalmente “esteja lá”, mas no contexto a expressão ordena permanência; “fique lá” é idiomático e preciso.
- source_word: ἕως ἂν εἴπω σοι
  choice: até que eu lhe diga
  rationale: A construção estabelece um limite futuro ainda indefinido. A tradução mantém essa abertura e soa natural em português.
- source_word: μέλλει γὰρ Ἡρῴδης ζητεῖν
  choice: pois Herodes está prestes a procurar
  rationale: μέλλει com infinitivo indica uma ação iminente ou esperada. “Está prestes a” explicita essa iminência sem transformar a afirmação em mera intenção.
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: para matá-lo
  rationale: ἀπόλλυμι pode significar destruir ou causar a morte. Neste contexto, o objetivo de Herodes é matar o menino; a tradução comunica diretamente esse sentido.
theological_decisions:
- issue: Tradução de κύριος em ἄγγελος κυρίου
  choice: Senhor
  alternative: senhor / amo
  rationale: “Senhor” é a forma convencional e contextualmente adequada para o título divino, sem impor uma identificação mais específica do anjo.
- issue: Definição de ἄγγελος κυρίου
  choice: um anjo do Senhor
  alternative: o anjo do Senhor
  rationale: A ausência do artigo favorece a leitura indefinida. A alternativa tradicional continua possível como modo de ouvir a expressão bíblica recorrente, por isso é registrada em nota sem ser imposta no texto.
- issue: Sentido de ἀπολέσαι aplicado ao menino
  choice: matá-lo
  alternative: destruí-lo
  rationale: No contexto, “destruir” significa causar a morte. “Matá-lo” torna explícita a ameaça concreta sem acrescentar um sentido teológico além do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto mantém dignidade narrativa com “eis que”, mas evita formas arcaicas como “ergue-te”. A sequência de ordens é direta e urgente. Os pronomes foram formulados para clareza oral e escrita, sem regionalismos fortes.
