id: MAT.2.15
reference: Matthew 2:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: pt
  text: 'e ficou ali até a morte de Herodes, para que se cumprisse o que foi dito pelo Senhor por meio do profeta: “Do Egito chamei o meu filho.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mateus cita Oseias 11:1, que no contexto original se refere a Israel como filho de Deus; aqui, ele apresenta Jesus como o cumprimento dessa Escritura.
    reason: cross_reference
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: ficou ali
  rationale: No contexto narrativo, o imperfeito de εἰμί com ἐκεῖ indica permanência; “ficou ali” é natural em português e não acrescenta a formalidade de “permaneceu”.
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: até a morte de Herodes
  rationale: τελευτή designa aqui o fim da vida; a construção nominal portuguesa corresponde de perto ao grego e é idiomática.
- source_word: ἵνα πληρωθῇ
  choice: para que se cumprisse
  rationale: Preserva a fórmula mateana de cumprimento e sua possível força de propósito ou resultado, sem reduzi-la a um simples infinitivo.
- source_word: τὸ ῥηθὲν
  choice: o que foi dito
  rationale: Expressa de modo idiomático o particípio passivo substantivado, mantendo a referência à palavra pronunciada.
- source_word: ὑπὸ κυρίου
  choice: pelo Senhor
  rationale: Identifica o Senhor como a fonte última da declaração sem acrescentar “Deus”, ausente no grego.
- source_word: διὰ τοῦ προφήτου
  choice: por meio do profeta
  rationale: 'Preserva a agência mediada indicada por διά com genitivo: o Senhor fala por intermédio do profeta.'
- source_word: λέγοντος
  choice: ':'
  rationale: Em português atual, os dois-pontos introduzem a citação de maneira mais natural do que a reprodução explícita de “dizendo”, sem perda de conteúdo discursivo.
- source_word: Ἐξ Αἰγύπτου
  choice: Do Egito
  rationale: “Do Egito” é a formulação portuguesa natural para procedência e conserva a ideia de saída expressa por ἐξ.
- source_word: ἐκάλεσα
  choice: chamei
  rationale: καλέω significa chamar, aqui com a ideia contextual de chamar para fora; a opção mantém a ligação verbal com Oseias 11:1.
- source_word: τὸν υἱόν μου
  choice: o meu Filho
  rationale: υἱός significa especificamente “filho”; a forma mantém a linguagem filial essencial à citação e à aplicação feita por Mateus.
theological_decisions:
- issue: Fórmula de cumprimento e citação de Oseias 11:1
  choice: Manter a afirmação de que a ida e a volta de Jesus do Egito cumprem a palavra profética, sem definir no texto o mecanismo desse cumprimento.
  alternative: Entender a passagem exclusivamente como predição direta ou explicitá-la como recapitulação tipológica de Israel.
  rationale: Mateus afirma o cumprimento, mas a tradução não deve impor uma teoria específica. A formulação preserva a tensão entre o contexto original de Oseias, referente a Israel, e a aplicação cristológica de Mateus.
- issue: κύριος na fórmula de cumprimento
  choice: Senhor
  alternative: SENHOR
  rationale: O texto grego traz κύριος; “Senhor” traduz diretamente essa forma sem introduzir no corpo do texto uma representação tipográfica do nome divino derivada do contexto hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha de perto o grego sem reproduzir de modo artificial o particípio λέγοντος. A inicial maiúscula em “Filho” sinaliza o referente imediato em Mateus, sem alterar o sentido lexical de υἱός.
