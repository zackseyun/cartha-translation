id: MAT.2.4
reference: Matthew 2:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: pt
  text: E, reunindo todos os principais sacerdotes e escribas do povo, perguntava-lhes onde o Messias[a] deveria nascer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”. O título grego Χριστός significa “Ungido” e, neste contexto, refere-se ao Messias esperado.'
    reason: Registra a tradução alternativa tradicional do título e esclarece seu sentido sem resolver indevidamente a variação lexical no texto principal.
lexical_decisions:
- source_word: συναγαγὼν
  choice: reunindo
  rationale: O particípio aoristo indica uma ação ligada e normalmente anterior à pergunta; o gerúndio é natural em português e preserva a construção participial sem tornar a sequência excessivamente explícita.
- source_word: πάντας
  choice: todos
  rationale: Preserva a abrangência expressa pelo adjetivo grego.
- source_word: ἀρχιερεῖς
  choice: principais sacerdotes
  rationale: Designa a liderança sacerdotal superior, não vários ocupantes simultâneos do cargo singular de sumo sacerdote.
- source_word: γραμματεῖς
  choice: escribas
  rationale: É a correspondência direta e tradicional, ainda compreensível no contexto bíblico, sem substituir o termo por uma explicação interpretativa.
- source_word: τοῦ λαοῦ
  choice: do povo
  rationale: Mantém o genitivo de modo direto, sem acrescentar no texto principal uma identificação étnica implícita no contexto.
- source_word: ἐπυνθάνετο
  choice: perguntava-lhes
  rationale: O imperfeito é refletido por “perguntava”, preservando o aspecto durativo da consulta; o pronome absorve naturalmente παρ’ αὐτῶν em português.
- source_word: ποῦ
  choice: onde
  rationale: Equivalente direto do advérbio interrogativo.
- source_word: ὁ χριστὸς
  choice: o Messias
  rationale: Neste contexto, Χριστός funciona como título do governante ungido esperado nas profecias judaicas; “Messias” preserva essa moldura.
- source_word: γεννᾶται
  choice: deveria nascer
  rationale: O presente passivo ocorre numa pergunta indireta sobre o nascimento esperado. “Deveria nascer” comunica a orientação prospectiva e a expectativa profética de modo natural no enquadramento passado do português.
theological_decisions:
- issue: Tradução de Χριστός como título
  choice: o Messias
  alternative: o Cristo
  rationale: Herodes pergunta pelo governante ungido esperado segundo a profecia judaica. “Messias” traduz o título e conserva com clareza esse contexto, enquanto “Cristo” também é uma tradução possível e é registrado em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem sintática permanece próxima do grego, mas a formulação evita rigidez. “Principais sacerdotes” é preferido a “sumos sacerdotes” para não sugerir vários titulares simultâneos do ofício singular.
