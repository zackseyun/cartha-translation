  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca a sequência temporal da narrativa de modo natural e conciso.
- source_word: ἐπληρώθη
  choice: se cumpriu
  rationale: Preserva a fórmula de cumprimento característica de Mateus e corresponde naturalmente ao aoristo passivo em português.
- source_word: τὸ ῥηθὲν
  choice: o que havia sido dito
  rationale: Reproduz o particípio substantivado de forma idiomática; o mais-que-perfeito composto indica que a fala profética antecedeu os acontecimentos narrados.
- source_word: διὰ Ἰερεμίου
  choice: por meio do profeta Jeremias
  rationale: Expressa a mediação ou agência indicada por διά com genitivo, sem reduzir Jeremias à fonte última da mensagem.
- source_word: τοῦ προφήτου
  choice: profeta
  rationale: Mantém a identificação de Jeremias por sua função, em construção natural em português.
- source_word: λέγοντος
  choice: nos seguintes termos
  rationale: Introduz naturalmente a citação que vem a seguir sem criar a impressão gramatical de que o cumprimento é quem fala.
theological_decisions:
- issue: Fórmula de cumprimento em Mateus
  choice: Manter explicitamente «se cumpriu»
  alternative: aconteceu para cumprir
  rationale: O texto apresenta o acontecimento como cumprimento da palavra profética; a formulação preserva essa afirmação teológico-literária sem acrescentar uma relação final que não está explícita.
- issue: Agência na fala profética
  choice: «por meio do profeta Jeremias»
  alternative: «pelo profeta Jeremias»
  rationale: «Por meio de» preserva com maior clareza Jeremias como mediador da fala, mantendo aberta a identificação implícita de sua fonte última.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para uma fórmula de citação natural, e os dois-pontos mantêm o vínculo com a fala citada no versículo seguinte.
