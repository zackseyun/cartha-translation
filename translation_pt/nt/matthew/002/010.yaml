lexical_decisions:
- source_word: ἰδόντες
  choice: Quando viram
  rationale: O particípio aoristo tem valor temporal em relação ao verbo principal. “Quando viram” expressa essa relação com naturalidade em português.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui, δέ é um conectivo narrativo leve. Em português, a progressão é natural sem um “e” inicial, evitando uma formulação menos fluida.
- source_word: τὸν ἀστέρα
  choice: a estrela
  rationale: ἀστήρ significa “estrela”, e o artigo definido aponta para a estrela específica já mencionada no contexto.
- source_word: ἐχάρησαν
  choice: ficaram alegres
  rationale: A forma de χαίρω tem sentido ativo e indica que eles se alegraram. “Ficaram alegres” é corrente, claro e preserva o aspecto ingressivo possível do aoristo.
- source_word: χαρὰν μεγάλην σφόδρα
  choice: extremamente alegres
  rationale: A construção com acusativo cognato, adjetivo e advérbio é fortemente enfática. A combinação com o verbo em português transmite a intensidade sem reproduzir de modo artificial a repetição lexical grega.
