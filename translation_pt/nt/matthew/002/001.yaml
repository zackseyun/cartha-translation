id: MAT.2.1
reference: Matthew 2:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: pt
  text: Depois que Jesus nasceu em Belém da Judeia, nos dias do rei Herodes, eis que sábios[a] vindos do Oriente chegaram a Jerusalém,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “magos”. O termo grego se refere a homens instruídos do Oriente, provavelmente ligados à astrologia ou à sabedoria de corte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: Depois que Jesus nasceu
  rationale: O genitivo absoluto estabelece uma circunstância temporal anterior à ação principal. A formulação comunica essa sequência com naturalidade; δέ funciona como transição narrativa leve e não exige uma palavra separada em português.
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: Belém da Judeia
  rationale: Emprega a forma portuguesa consagrada do topônimo e preserva a especificação geográfica que distingue esta Belém de outras localidades.
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: nos dias do rei Herodes
  rationale: Mantém a forma narrativa do idioma grego e situa o acontecimento historicamente sem recorrer a linguagem arcaica.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva a função de chamar a atenção para a chegada inesperada dos personagens e mantém o relevo narrativo do termo.
- source_word: μάγοι
  choice: sábios
  rationale: Comunica de modo acessível que eram homens instruídos do Oriente, sem atribuir-lhes condição de reis nem fixar seu número. A alternativa mais formal, “magos”, aparece na nota.
- source_word: ἀπὸ ἀνατολῶν
  choice: vindos do Oriente
  rationale: Expressa em português natural a procedência indicada pelo plural grego, que se refere às regiões orientais.
- source_word: παρεγένοντο εἰς Ἱεροσόλυμα
  choice: chegaram a Jerusalém
  rationale: O verbo indica chegada ou comparecimento ao local; com verbo de movimento, “chegaram a Jerusalém” é idiomático e preserva a direção marcada por εἰς.
theological_decisions:
- issue: Tradução de μάγοι sem incorporar tradições posteriores
  choice: sábios
  alternative: magos
  rationale: O termo designa figuras instruídas do Oriente, provavelmente ligadas à astrologia ou à sabedoria de corte. “Sábios” evita apresentá-los como reis ou determinar quantos eram, enquanto a nota preserva o termo técnico alternativo.
translation_notes:
  register: Português moderno, digno e acessível, com leve cadência narrativa bíblica em “nos dias” e “eis que”. A pontuação final mantém a continuidade sintática com o versículo seguinte.
