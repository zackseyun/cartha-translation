  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe coordenada acompanha o ritmo narrativo do grego; “a mãe dele” foi empregado para eliminar uma ambiguidade pronominal criada pelo português, não presente no referente grego.
