source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: pt
  text: Então ele se levantou, tomou o menino e a mãe dele e entrou na terra de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Então
  rationale: Aqui, δέ dá continuidade à narrativa, sem marcar contraste forte. “Então” expressa com naturalidade a progressão dos acontecimentos.
- source_word: ἐγερθεὶς
  choice: se levantou
  rationale: O particípio aoristo passivo tem sentido intransitivo neste contexto. A forma verbal coordenada é natural em português e preserva a sequência da ação.
- source_word: παρέλαβε
  choice: tomou
  rationale: παραλαμβάνω significa aqui levar alguém consigo. “Tomou” mantém a formulação concisa e digna recorrente na narrativa da infância, sem introduzir informação ausente do grego.
- source_word: τὸ παιδίον
  choice: o menino
  rationale: παιδίον designa uma criança. No contexto, “o menino” é claro e natural em português, sem acrescentar uma faixa etária mais específica.
- source_word: τὴν μητέρα αὐτοῦ
  choice: a mãe dele
  rationale: O pronome αὐτοῦ refere-se naturalmente ao menino. “A mãe dele” evita em português a possível leitura de que se trata da mãe de José.
- source_word: εἰσῆλθεν
  choice: entrou
  rationale: εἰσέρχομαι significa entrar ou ir para dentro. “Entrou” reproduz de modo direto o movimento indicado pelo verbo.
- source_word: εἰς γῆν Ἰσραήλ
  choice: na terra de Israel
  rationale: A expressão indica o território de Israel. Com o verbo “entrar”, a contração “na” é idiomática em português e conserva o sentido geográfico e nacional.
theological_decisions: []
