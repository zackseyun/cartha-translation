source:
  edition: SBLGNT
  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: pt
  text: 'Depois de enviá-los a Belém, ele disse: “Vão e procurem cuidadosamente o menino. Quando o encontrarem, avisem-me, para que eu também vá e o adore.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prestar-lhe homenagem” ou “prostrar-me diante dele”. O verbo grego pode indicar tanto adoração quanto um ato de reverência diante de uma figura régia.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: Depois de enviá-los
  rationale: O particípio aoristo indica uma ação anterior ao verbo principal εἶπεν; a formulação preserva essa sequência de modo natural em português.
- source_word: Πορευθέντες
  choice: Vão
  rationale: O particípio tem força imperativa em ligação com ἐξετάσατε. “Vão e procurem” é idiomático e mantém a ordem dada por Herodes.
- source_word: ἐξετάσατε ἀκριβῶς
  choice: procurem cuidadosamente
  rationale: A combinação expressa busca ou investigação exata e diligente. A tradução é clara no contexto da localização do menino.
- source_word: περὶ τοῦ παιδίου
  choice: o menino
  rationale: Com o verbo de busca, περί introduz aquilo que deve ser procurado. Em português, o objeto direto produz a construção mais natural.
- source_word: παιδίου
  choice: menino
  rationale: παιδίον designa uma criança. “Menino” é natural no contexto narrativo e não acrescenta uma idade mais específica do que o termo permite.
- source_word: ἐπὰν δὲ εὕρητε
  choice: Quando o encontrarem
  rationale: A construção apresenta uma contingência esperada no contexto da instrução. “Quando” reproduz isso naturalmente sem transformar a ação em certeza narrativa.
- source_word: ἀπαγγείλατέ μοι
  choice: avisem-me
  rationale: O verbo comunica a ideia de trazer informação ou dar notícia. “Avisem-me” é corrente e preserva o pedido de retorno com a informação.
- source_word: ὅπως
  choice: para que
  rationale: A expressão introduz a finalidade alegada por Herodes.
- source_word: κἀγὼ
  choice: eu também
  rationale: A crase de καί e ἐγώ inclui enfaticamente Herodes na intenção declarada dos visitantes.
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: vá adorá-lo
  rationale: O particípio seguido do subjuntivo é expresso naturalmente como ação coordenada. “Adorar” está dentro do campo semântico de προσκυνέω, enquanto a nota conserva as alternativas de reverência ou homenagem.
theological_decisions:
- issue: Sentido de προσκυνήσω αὐτῷ com referência ao menino Jesus
  choice: adorá-lo
  alternative: prestar-lhe homenagem; prostrar-me diante dele
  rationale: προσκυνέω pode indicar tanto adoração quanto reverência prestada a uma figura régia. “Adorá-lo” preserva a possível força teológica do vocabulário de Mateus sem ocultar, graças à nota, a amplitude lexical. A intenção declarada por Herodes é enganosa, mas isso não exige enfraquecer o verbo em sua fala.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O pronome explícito “ele” evita uma transição abrupta, e “Vão” concorda naturalmente com o destinatário plural. O marcador da nota foi colocado após “adorá-lo”, termo ao qual a alternativa lexical efetivamente se refere.
