  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: pt
  text: 'dizendo: “Levante-se, leve consigo o menino e a mãe dele e vá para a terra de Israel, pois estão mortos os que buscavam a vida do menino.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais explicitamente: “os que procuravam tirar a vida do menino”. A expressão “buscar a vida” significa procurar matar alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: dizendo
  rationale: Mantém o particípio presente que liga a fala do anjo ao versículo anterior.
- source_word: Ἐγερθείς
  choice: Levante-se
  rationale: O particípio aoristo tem valor idiomático associado à ordem seguinte; a forma escolhida é natural em português e preserva a força imperativa.
- source_word: παράλαβε
  choice: pegue
  rationale: Neste contexto, παραλαμβάνω significa tomar alguém consigo. “Pegue” é claro e corrente; a sequência com “vá” deixa implícito que José deve levá-los com ele.
- source_word: τὸ παιδίον
  choice: o menino
  rationale: παιδίον designa aqui uma criança; “o menino” é natural no contexto narrativo e não acrescenta uma faixa etária específica.
- source_word: τὴν μητέρα αὐτοῦ
  choice: a mãe dele
  rationale: Expressa de modo claro e natural que se trata da mãe do menino, sem tornar Maria o complemento principal da ordem.
- source_word: πορεύου
  choice: vá
  rationale: Equivale diretamente à ordem simples expressa pelo imperativo de πορεύομαι.
- source_word: εἰς γῆν Ἰσραήλ
  choice: para a terra de Israel
  rationale: Preserva a referência territorial de γῆ e soa idiomático em português.
- source_word: τεθνήκασιν
  choice: já morreram
  rationale: O perfeito indica uma morte ocorrida cujo resultado permanece. “Já morreram” comunica naturalmente tanto o acontecimento quanto sua relevância presente.
- source_word: οἱ ζητοῦντες
  choice: os que procuravam
  rationale: O imperfeito em português apresenta a busca como atividade anterior em curso, adequada ao contexto, sem sugerir que ela ainda continua após a morte dessas pessoas.
- source_word: τὴν ψυχὴν τοῦ παιδίου
  choice: tirar a vida do menino
  rationale: Na expressão idiomática, ψυχή significa “vida”, e buscar a vida de alguém significa tentar matá-lo. “Procuravam tirar a vida” preserva esse sentido sem introduzir a noção de alma imaterial.
theological_decisions:
- issue: Sentido de ψυχή em um contexto de ameaça mortal
  choice: vida
  alternative: alma
  rationale: A expressão se refere à tentativa de matar o menino. “Alma” introduziria uma distinção antropológica ou teológica que não pertence ao sentido imediato da passagem.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Dizendo” conserva a ligação sintática com o versículo anterior; “a mãe dele” evita ambiguidade possessiva; “já morreram” expressa naturalmente o resultado presente do perfeito grego.
