  text: οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: pt
  text: 'Eles lhe responderam: “Em Belém da Judeia, pois assim está escrito por meio do profeta:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Eles
  rationale: O artigo substantivado retoma os chefes dos sacerdotes e escribas do versículo anterior. Em português, o pronome basta para manter a continuidade; a leve conexão de δέ é naturalmente expressa pelo fluxo da narrativa.
- source_word: εἶπαν αὐτῷ
  choice: lhe responderam
  rationale: Embora literalmente seja 'disseram a ele', o contexto apresenta uma resposta à pergunta de Herodes; 'lhe responderam' é natural e não acrescenta conteúdo indevido.
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: Em Belém da Judeia
  rationale: A preposição indica localização, e o genitivo identifica qual Belém está em vista. 'Belém da Judeia' preserva essa função de modo idiomático.
- source_word: οὕτως γὰρ
  choice: pois assim
  rationale: γάρ introduz a justificativa da resposta, enquanto οὕτως aponta para a citação que vem a seguir.
- source_word: γέγραπται
  choice: está escrito
  rationale: O perfeito passivo é uma fórmula convencional de citação das Escrituras. 'Está escrito' expressa em português natural o resultado presente de algo registrado anteriormente.
- source_word: διὰ τοῦ προφήτου
  choice: por meio do profeta
  rationale: διά com genitivo indica mediação ou agência; 'por meio do profeta' preserva de forma clara o profeta como instrumento da comunicação.
theological_decisions:
- issue: Fórmula de mediação profética
  choice: por meio do profeta
  alternative: pelo profeta
  rationale: A formulação preserva explicitamente a ideia de mediação presente em διά com genitivo, sem inserir uma explicação doutrinária no texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A pontuação mantém a resposta e sua justificativa dentro da mesma fala, preparando a citação do versículo seguinte.
