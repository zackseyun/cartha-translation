  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Φωνὴ ἐν Ῥαμὰ ⸀ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: pt
  text: '“Ouviu-se uma voz em Ramá, choro e grande lamentação[a]: Raquel chorava por seus filhos e não queria ser consolada[b], porque eles já não existem[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pranto e muita lamentação”.
    reason: lexical_alternative
  - marker: b
    text: Ou “recusava-se a ser consolada”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “porque eles não são”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φωνὴ
  choice: uma voz
  rationale: φονή pode designar voz ou som; “voz” preserva o tom pessoal e profético da citação e se liga naturalmente à figura de Raquel.
- source_word: ἐν Ῥαμὰ
  choice: em Ramá
  rationale: A preposição ἐν com o nome de lugar é naturalmente traduzida por “em”; “Ramá” segue a forma portuguesa convencional do nome próprio.
- source_word: ἠκούσθη
  choice: ouviu-se
  rationale: O aoristo passivo de ἀκούω significa “foi ouvida”; a construção impessoal portuguesa “ouviu-se” é natural e mantém o caráter de relato.
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: choro e grande lamentação
  rationale: κλαυθμός indica choro audível ou pranto, enquanto ὀδυρμός expressa lamentação; πολύς intensifica o segundo termo. A formulação conserva os dois substantivos e a intensidade sem acrescentar uma nuance não explícita.
- source_word: Ῥαχὴλ κλαίουσα
  choice: Raquel chorava
  rationale: O particípio presente retrata uma ação em curso. A forma verbal finita é mais natural em português, sem explicitar além do texto a função simbólica de Raquel.
- source_word: τὰ τέκνα αὐτῆς
  choice: por seus filhos
  rationale: τέκνα é um termo abrangente para filhos ou crianças, sem limitar o sexo; “seus filhos” é a expressão portuguesa natural neste contexto.
- source_word: οὐκ ἤθελεν
  choice: não queria
  rationale: θέλω expressa querer ou estar disposto. “Não queria” permanece próximo do grego e evita a força um pouco maior de “recusava-se”.
- source_word: παρακληθῆναι
  choice: ser consolada
  rationale: Neste contexto, o infinitivo passivo de παρακαλέω se refere a receber consolo; “ser consolada” é claro, corrente e solene.
- source_word: ὅτι οὐκ εἰσίν
  choice: porque eles já não existem
  rationale: A expressão grega, literalmente “porque eles não são”, comunica que os filhos já não estão presentes ou vivos. “Já não existem” preserva a formulação austera sem inserir explicitamente “morreram”.
theological_decisions:
- issue: A natureza da figura de Raquel na citação
  choice: Manter Raquel como figura materna e profética da citação de Jeremias, sem explicar seu simbolismo no texto principal.
  alternative: Identificá-la explicitamente com as mães de Israel ou tratá-la apenas como uma mãe histórica literal.
  rationale: Mateus apresenta a citação de modo tipológico, mas o grego simplesmente nomeia Raquel. A tradução preserva essa tensão e deixa a relação simbólica sem resolução interpretativa.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução emprega equivalência ótima: conserva a estrutura poética e a aspereza da lamentação, mas usa sintaxe portuguesa natural. Todos os marcadores de nota aparecem no texto principal.'
