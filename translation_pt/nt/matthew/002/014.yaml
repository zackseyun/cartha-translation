source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: pt
  text: Então ele se levantou, tomou consigo o menino e a mãe do menino durante a noite e partiu para o Egito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Então
  rationale: Conector narrativo leve que dá continuidade à ação e, no contexto, também sugere a resposta de José à ordem recebida.
- source_word: ἐγερθεὶς
  choice: se levantou
  rationale: Expressa de modo natural em português a ação anterior indicada pelo particípio aoristo, sem a rigidez de uma construção como “tendo-se levantado”.
- source_word: παρέλαβε
  choice: tomou consigo
  rationale: Neste contexto, παραλαμβάνω significa levar pessoas consigo; “tomou consigo” explicita esse sentido sem sugerir mera recepção.
- source_word: τὸ παιδίον
  choice: o menino
  rationale: παιδίον designa aqui uma criança; “o menino” é claro, natural e coerente com o referente masculino no contexto.
- source_word: τὴν μητέρα αὐτοῦ
  choice: a mãe dele
  rationale: O pronome refere-se naturalmente ao menino. “A mãe dele” preserva essa relação de maneira acessível e evita apresentar Maria como esposa de José neste ponto, algo que o grego não enfatiza.
- source_word: νυκτὸς
  choice: ainda de noite
  rationale: O genitivo temporal indica que a ação ocorreu durante a noite. “Ainda de noite” é idiomático e transmite a prontidão da saída sem acrescentar uma causa.
- source_word: ἀνεχώρησεν
  choice: partiu
  rationale: ἀναχωρέω indica afastar-se ou partir. “Partiu” comunica com naturalidade o deslocamento intencional, sem explicitar além do texto a ideia de fuga.
- source_word: εἰς Αἴγυπτον
  choice: para o Egito
  rationale: εἰς marca movimento em direção a um destino; “para o Egito” é a formulação corrente e exata em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente. Conservou-se o pronome “ele”, em vez de inserir o nome José, porque o sujeito permanece implícito no grego e é recuperado do contexto. Não se reproduziu a nota inglesa fornecida, pois seu marcador aparece associado a “got up”, enquanto o conteúdo trata de “to Egypt”; além disso, “para o Egito” traduz diretamente εἰς Αἴγυπτον e não exige nota lexical em português.
