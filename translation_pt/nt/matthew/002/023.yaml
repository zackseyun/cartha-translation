id: MAT.2.23
reference: Matthew 2:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: pt
  text: 'E, chegando, foi morar numa cidade chamada Nazaré[a], para que se cumprisse o que foi dito por meio dos profetas: “Ele será chamado Nazareno.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Nazoreu”. O pano de fundo profético exato de “Ele será chamado Nazareno” é discutido; Mateus talvez esteja resumindo temas dos profetas, em vez de citar um único texto específico.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: chegando
  rationale: O particípio aoristo expressa uma ação anterior ou concomitante à principal; “chegando” preserva a forma participial e soa natural em português.
- source_word: κατῴκησεν
  choice: foi morar
  rationale: κατοικέω indica fixar residência ou habitar. “Foi morar” comunica naturalmente a mudança para Nazaré sem recorrer ao arcaizante “habitou” nem exagerar a permanência com “estabeleceu-se”.
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: numa cidade chamada Nazaré
  rationale: Com verbo de residência, εἰς é expresso idiomaticamente por “em”; πόλις é mantido como “cidade”, e “chamada Nazaré” reproduz com clareza λεγομένην Ναζαρέτ.
- source_word: ὅπως πληρωθῇ
  choice: para que se cumprisse
  rationale: A construção final com ὅπως e subjuntivo é bem representada por “para que” mais o imperfeito do subjuntivo, preservando a fórmula de cumprimento de Mateus.
- source_word: τὸ ῥηθὲν
  choice: o que foi dito
  rationale: Tradução natural do particípio substantivado, sem acrescentar anterioridade não explicitada.
- source_word: διὰ τῶν προφητῶν
  choice: por meio dos profetas
  rationale: διά com genitivo indica mediação ou agência; “por meio dos profetas” preserva essa nuance e o plural do texto grego.
- source_word: Ναζωραῖος
  choice: Nazareno
  rationale: “Nazareno” é a designação portuguesa corrente ligada a Nazaré. A alternativa formal “Nazoreu” é registrada em nota porque pode preservar melhor a forma grega e a discussão sobre o pano de fundo profético.
- source_word: κληθήσεται
  choice: será chamado
  rationale: Mantém o futuro passivo de καλέω e o estilo da declaração profética.
theological_decisions:
- issue: Natureza da citação de cumprimento sem paralelo exato em um único texto do Antigo Testamento
  choice: Manter no texto a referência plural aos “profetas”, sem identificar uma passagem específica.
  alternative: Vincular explicitamente a frase a Isaías 11:1 ou interpretá-la no texto como resumo do tema profético da humilhação do Messias.
  rationale: O grego usa o plural τῶν προφητῶν, o que permite entender a frase como testemunho composto ou resumo temático. A tradução deve conservar essa abertura em vez de impor uma identificação discutida.
- issue: Sentido de Ναζωραῖος
  choice: Nazareno
  alternative: Nazoreu; nazireu
  rationale: No contexto, a designação está ligada à residência em Nazaré. “Nazireu” sugeriria indevidamente o voto religioso expresso por outro termo grego. “Nazoreu” permanece como alternativa lexical em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Foi morar” é idiomático e comunica mudança de residência; a fórmula profética conserva tom solene sem arcaísmo.
