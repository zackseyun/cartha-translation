  yaml_path: translation/nt/matthew/013/051.yaml
  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: pt
  text: '“Entenderam todas estas coisas?”[a] Eles lhe disseram: “Sim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Entendem todas estas coisas?”'
    reason: Alternativa aspectual possível para Συνήκατε em português corrente.
lexical_decisions:
- source_word: Συνήκατε
  choice: Entenderam
  rationale: O aoristo indicativo, em forma interrogativa, olha naturalmente para a compreensão alcançada até aquele momento. A forma sem pronome explícito é clara no contexto e funciona bem em diferentes variedades do português.
- source_word: ταῦτα πάντα
  choice: todas estas coisas
  rationale: Reproduz explicitamente o demonstrativo neutro plural com πᾶς e remete aos ensinamentos e às parábolas anteriores.
- source_word: λέγουσιν αὐτῷ
  choice: Eles lhe disseram
  rationale: Embora o grego use o presente histórico, o pretérito é mais natural na narrativa portuguesa. O pronome indireto preserva αὐτῷ.
- source_word: Ναί
  choice: Sim
  rationale: Traduz somente a partícula afirmativa presente no texto, sem acrescentar qualquer título.
theological_decisions:
- issue: Possível acréscimo de um título reverencial à resposta dos discípulos
  choice: Manter apenas “Sim”.
  alternative: “Sim, Senhor.”
  rationale: O texto grego contém apenas Ναί. Acrescentar “Senhor” introduziria conteúdo devocional ausente da fonte.
translation_notes:
  register: Português moderno, natural e digno, com boa legibilidade brasileira e compreensão internacional. A pergunta conserva a força de compreensão alcançada até esse ponto, enquanto a nota registra a leitura presente possível.
