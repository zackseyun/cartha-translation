  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ⸀ἀνθρώπῳ ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: pt
  text: Novamente, o Reino dos céus é semelhante a um comerciante que procura pérolas finas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλιν
  choice: Novamente
  rationale: Introduz outra comparação na sequência de parábolas do Reino e preserva de modo natural o fluxo do discurso.
- source_word: ὁμοία ἐστὶν
  choice: é semelhante a
  rationale: Expressa com clareza e dignidade a fórmula de comparação parabólica, sem acrescentar interpretação.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: o Reino dos céus
  rationale: Mantém a expressão característica de Mateus em uma forma consagrada e natural em português.
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: um comerciante
  rationale: ἔμπορος identifica suficientemente a pessoa; traduzir também ἀνθρώπῳ como “homem” seria possível, mas redundante em português.
- source_word: ζητοῦντι
  choice: que procura
  rationale: A oração relativa comunica de modo natural a atividade contínua expressa pelo particípio presente.
- source_word: καλοὺς μαργαρίτας
  choice: pérolas finas
  rationale: Neste contexto comercial, καλός indica qualidade ou excelência; “finas” preserva esse sentido sem limitar a ideia à beleza visual.
theological_decisions:
- issue: Alcance da comparação na fórmula da parábola
  choice: O Reino é comparado diretamente a um comerciante que procura pérolas finas.
  alternative: O Reino é semelhante à situação ou ao processo que envolve um comerciante em busca de pérolas finas.
  rationale: A construção grega apresenta ἀνθρώπῳ ἐμπόρῳ como o referente imediato da comparação. A tradução conserva essa estrutura sem definir de maneira indevida todos os elementos da correspondência parabólica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Reino” recebe inicial maiúscula por se referir ao governo régio de Deus; a sintaxe permanece simples e adequada ao gênero parabólico.
