  text: Τότε ἀφεὶς τοὺς ὄχλους ἦλθεν εἰς τὴν ⸀οἰκίαν. καὶ προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ λέγοντες· ⸀Διασάφησον ἡμῖν τὴν παραβολὴν τῶν ζιζανίων τοῦ ἀγροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: pt
  text: 'Então, depois de deixar as multidões, ele entrou na casa. E seus discípulos se aproximaram dele e disseram: “Explique-nos a parábola do joio[a] no campo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a parábola das ervas daninhas no campo”. O termo grego pode designar mais especificamente o joio, uma planta daninha parecida com o trigo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca naturalmente, em português, a sequência temporal da narrativa.
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: depois de deixar as multidões
  rationale: Explicita de modo idiomático a relação temporal do particípio aoristo e preserva o plural de ὄχλους.
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: entrou em casa
  rationale: Expressa com naturalidade o movimento para o interior; em português, a expressão idiomática normalmente dispensa o artigo sem tornar a casa indefinida.
- source_word: προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ
  choice: seus discípulos se aproximaram dele
  rationale: Representa claramente προσέρχομαι e mantém a identificação possessiva dos discípulos.
- source_word: λέγοντες
  choice: e disseram
  rationale: A coordenação é mais natural em narrativa portuguesa do que a reprodução rígida do particípio, sem mudar a relação com o verbo principal.
- source_word: Διασάφησον ἡμῖν
  choice: Explique-nos
  rationale: Equivalente direto, claro e atual do imperativo que pede esclarecimento.
- source_word: τὴν παραβολὴν
  choice: a parábola
  rationale: Termo corrente e consolidado para παραβολή no contexto dos Evangelhos.
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: do joio no campo
  rationale: Joio é o equivalente português tradicional e ainda compreensível para ζιζάνια; 'no campo' comunica naturalmente a relação sem forçar uma cadeia de genitivos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem narrativa foi mantida, enquanto os particípios gregos foram vertidos por construções idiomáticas. O marcador [a] foi colocado imediatamente após a expressão à qual se refere.
