  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐβλάστησεν ὁ χόρτος καὶ καρπὸν ἐποίησεν, τότε ἐφάνη καὶ τὰ ζιζάνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/026.yaml
  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: pt
  text: Quando, porém, as plantas brotaram e produziram grãos, apareceram também as ervas daninhas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “joio”; o termo talvez designe especificamente essa planta, que se parece com o trigo durante o crescimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Quando, porém
  rationale: ὅτε introduz a oração temporal, e δέ funciona como conectivo leve, com discreto contraste em relação à cena anterior.
- source_word: ἐβλάστησεν
  choice: brotaram
  rationale: O aoristo de βλαστάνω indica que as plantas lançaram brotos ou começaram a crescer; “brotaram” é claro e natural no contexto agrícola.
- source_word: ὁ χόρτος
  choice: as plantas
  rationale: χόρτος pode designar relva, vegetação ou a plantação em crescimento. “As plantas” comunica o sentido contextual sem especificar prematuramente o trigo.
- source_word: καρπὸν ἐποίησεν
  choice: produziram grãos
  rationale: A expressão significa literalmente “produziu fruto”, isto é, deu sua produção. Como a parábola trata de uma plantação de trigo, “grãos” expressa naturalmente o rendimento agrícola.
- source_word: τότε
  choice: '[expresso pela sequência verbal]'
  rationale: A progressão temporal de τότε é transmitida de modo natural pela oração seguinte após “quando”; acrescentar “então” seria possível, mas desnecessário em português.
- source_word: ἐφάνη
  choice: apareceram
  rationale: Aqui φαίνω tem o sentido intransitivo de tornar-se visível ou evidente; “apareceram” é conciso e idiomático.
- source_word: καὶ τὰ ζιζάνια
  choice: também as ervas daninhas
  rationale: ζιζάνια designa plantas indesejáveis no campo, possivelmente o joio em sentido botânico específico. O plural genérico “ervas daninhas” é acessível, e καί tem valor aditivo, traduzido por “também”.
theological_decisions:
- issue: Identificação específica de ζιζάνια
  choice: “ervas daninhas” no texto principal
  alternative: “joio”
  rationale: O termo pode referir-se especificamente ao joio, mas o versículo não exige identificação botânica precisa. A tradução principal preserva o sentido geral e acessível, enquanto a nota registra a alternativa tradicional e mais específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “Quando, porém” preserva a transição narrativa sem soar excessivamente literal; a concordância no plural torna natural a referência coletiva às plantas.
