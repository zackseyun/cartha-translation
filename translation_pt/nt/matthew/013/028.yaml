  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: pt
  text: 'Ele lhes disse: “Foi um inimigo que fez isso.” Então os escravos[a] lhe perguntaram: “O senhor quer que a gente vá recolhê-los?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos”. O termo grego pode designar escravos ou servos, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: disse
  rationale: Verbo comum de fala, traduzido de modo direto e natural na narrativa.
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: um inimigo
  rationale: A expressão literalmente individualiza o agente como uma pessoa inimiga; em português, “um inimigo” comunica isso naturalmente.
- source_word: τοῦτο ἐποίησεν
  choice: foi ... que fez isso
  rationale: A construção clivada mantém a identificação enfática do responsável e traduz o aoristo por um passado natural.
- source_word: δοῦλοι
  choice: escravos
  rationale: Preserva com transparência a condição social subordinada indicada por δοῦλοι, sem ocultá-la sob um termo mais brando; “servos” consta na nota como alternativa contextual.
- source_word: Θέλεις
  choice: O senhor quer
  rationale: Expressa a vontade em português contemporâneo; “o senhor” torna explícita e natural a relação respeitosa com o proprietário.
- source_word: οὖν
  choice: Então
  rationale: Marca aqui a consequência prática e a progressão do diálogo sem impor uma inferência excessivamente formal.
- source_word: ἀπελθόντες
  choice: que a gente vá
  rationale: O particípio, subordinado ao subjuntivo exortativo, indica o deslocamento anterior à ação principal; a formulação é idiomática e inclusiva quanto aos falantes.
- source_word: συλλέξωμεν
  choice: arrancá-los
  rationale: No contexto imediato do joio entre o trigo e da ordem posterior para não o arrancar, o verbo envolve juntar as plantas para removê-las; “arrancar” comunica naturalmente a ação agrícola, embora seja mais contextual que o sentido básico “recolher”.
- source_word: αὐτά
  choice: -los
  rationale: O pronome neutro plural retoma o joio mencionado no contexto; em português, a retomada assume o gênero gramatical masculino de “joio”.
theological_decisions:
- issue: Tradução de δοῦλοι no contexto da parábola
  choice: escravos
  alternative: servos
  rationale: “Escravos” preserva a realidade social e a relação de dependência inerentes ao termo grego. Como “servos” é possível no contexto doméstico e tradicional em traduções bíblicas, a alternativa é registrada em nota sem decidir a interpretação da parábola.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “O senhor” sinaliza respeito sem recorrer ao pouco natural “tu”. “A gente” evita o formalismo de “nós irmos” e representa com clareza que os próprios escravos se oferecem para a tarefa. A formulação “Foi um inimigo que...” conserva a ênfase identificadora do grego.
