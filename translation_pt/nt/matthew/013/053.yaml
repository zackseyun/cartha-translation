lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: Quando
  rationale: A expressão funciona aqui como transição narrativa e introduz uma oração temporal. Em português atual, «Quando» preserva naturalmente a relação temporal sem reproduzir de modo rígido o semitismo «E aconteceu que, quando».
- source_word: ἐτέλεσεν
  choice: terminou
  rationale: O verbo τελέω indica levar algo ao fim. «Terminou» é claro e natural; a sequência temporal fica suficientemente marcada pela oração com «quando», sem necessidade de uma forma composta.
- source_word: παραβολὰς
  choice: parábolas
  rationale: «Parábolas» é o termo consagrado e preciso para esse gênero de ensino no contexto dos Evangelhos.
- source_word: ταύτας
  choice: essas
  rationale: O demonstrativo remete às parábolas apresentadas imediatamente antes. «Essas» é natural no português brasileiro e mantém a referência ao conjunto precedente.
- source_word: μετῆρεν
  choice: partiu
  rationale: μεταίρω descreve a saída ou deslocamento de um lugar. «Partiu» preserva esse sentido sem especificar indevidamente o modo ou o destino.
- source_word: ἐκεῖθεν
  choice: dali
  rationale: «Dali» expressa de maneira concisa e idiomática o sentido espacial de «daquele lugar».
