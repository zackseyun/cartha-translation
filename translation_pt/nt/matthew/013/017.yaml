id: MAT.13.17
reference: Matthew 13:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: pt
  text: Pois em verdade lhes digo que muitos profetas e justos[a] ansiaram ver o que vocês veem e não viram, e ouvir o que vocês ouvem e não ouviram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pessoas justas”. No grego, o adjetivo está empregado como substantivo e se refere a pessoas caracterizadas pela justiça.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: em verdade
  rationale: Na fórmula solene ἀμὴν λέγω ὑμῖν, “em verdade” comunica a asseveração enfática de modo digno e compreensível, sem depender da transliteração “amém”.
- source_word: γὰρ
  choice: pois
  rationale: Introduz a explicação que sustenta a declaração anterior e preserva a ligação discursiva do grego.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Forma direta e natural em português, mantendo a fórmula de pronunciamento de Jesus.
- source_word: πολλοὶ προφῆται καὶ δίκαιοι
  choice: muitos profetas e justos
  rationale: “Justos” emprega o adjetivo de modo substantivado, como no grego, e o coordena com “profetas” sem fundir os dois grupos.
- source_word: ἐπεθύμησαν
  choice: ansiaram
  rationale: Expressa desejo intenso e positivo, adequado ao contexto, com maior força que o simples “desejaram”.
- source_word: ἰδεῖν ἃ βλέπετε
  choice: ver o que vocês veem
  rationale: Mantém a construção relativa e o contraste temporal entre o anseio passado e a experiência presente dos ouvintes.
- source_word: οὐκ εἶδαν
  choice: não viram
  rationale: O objeto permanece naturalmente subentendido em português, assim como é recuperável da oração relativa anterior.
- source_word: ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: ouvir o que vocês ouvem, mas não ouviram
  rationale: Preserva o paralelismo com “ver” e usa “mas” para tornar explícito em português o contraste produzido pela negação coordenada.
theological_decisions:
- issue: Alcance de δίκαιοι
  choice: “justos”, como categoria substantivada ao lado dos profetas
  alternative: “pessoas justas” ou “os justos”
  rationale: O plural substantivado designa pessoas caracterizadas pela justiça e pode abranger fiéis de gerações anteriores além dos profetas. A tradução não restringe nem redefine o grupo.
- issue: Identidade daquilo que foi visto e ouvido
  choice: Manter “o que vocês veem” e “o que vocês ouvem” sem explicitar o referente
  alternative: Acrescentar “o Messias”, “Jesus” ou “os mistérios do Reino”
  rationale: Embora o contexto aponte para a revelação do Reino no ministério de Jesus, o versículo deixa os objetos implícitos. A redação preserva essa abertura textual.
- issue: Relação entre desejar e não experimentar
  choice: Preservar o contraste histórico sem acrescentar explicação sobre morte, época ou cumprimento
  alternative: Parafrasear que eles morreram antes de ver o cumprimento
  rationale: O texto afirma apenas que desejaram ver e ouvir, mas não o fizeram; explicações históricas ou teológicas adicionais excederiam o enunciado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa e “lhes digo” como forma natural da fórmula solene. O paralelismo entre ver e ouvir foi mantido, assim como a repetição enfática das formas verbais.
