id: MAT.13.43
reference: Matthew 13:43
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τότε οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: pt
  text: Então os justos brilharão[a] como o sol no reino de seu Pai. Quem tem ouvidos, ouça.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “resplandecerão”.'
    reason: lexical_alternative
  - marker: b
    text: No grego, a exortação está no singular e funciona como um chamado dirigido a cada pessoa para que ouça e dê atenção.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca de modo natural a sequência temporal e escatológica iniciada na explicação anterior.
- source_word: οἱ δίκαιοι
  choice: os justos
  rationale: Equivalente substantivado corrente que preserva as dimensões moral e relacional do termo sem as restringir.
- source_word: ἐκλάμψουσιν
  choice: brilharão
  rationale: Expressa com clareza o futuro de ἐκλάμπω; a comparação com o sol já comunica a intensidade do brilho.
- source_word: ὡς ὁ ἥλιος
  choice: como o sol
  rationale: Forma idiomática e fiel de introduzir a comparação em português.
- source_word: ἐν τῇ βασιλείᾳ
  choice: no reino
  rationale: A construção locativa favorece 'reino', preservando aqui a ideia de esfera sem excluir o sentido de governo real.
- source_word: τοῦ πατρὸς αὐτῶν
  choice: de seu Pai
  rationale: Reproduz a relação indicada pelo genitivo sem acrescentar 'celestial', ausente do versículo.
- source_word: ὁ ἔχων ὦτα
  choice: Quem tem ouvidos
  rationale: Construção portuguesa natural que mantém a referência representativa no singular e o plural concreto 'ouvidos'.
- source_word: ἀκουέτω
  choice: ouça
  rationale: Imperativo de terceira pessoa no singular, conciso e solene, que pode abranger tanto ouvir quanto dar atenção.
theological_decisions:
- issue: Forma representativa singular na exortação final
  choice: Quem tem ouvidos, ouça
  alternative: Aquele que tem ouvidos, ouça
  rationale: '''Quem'' preserva o valor singular e representativo da construção grega sem introduzir uma especificação de sexo que o português não exige.'
- issue: Sentido de βασιλεία neste contexto
  choice: reino
  alternative: reinado
  rationale: A preposição locativa e a imagem escatológica favorecem a esfera do reino do Pai, sem negar a dimensão de seu governo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação evita arcaísmos, acréscimos explicativos no texto principal e capitalização de 'reino' que pudesse sugerir uma distinção não marcada no grego.
