  text: καὶ αἱ ἀδελφαὶ αὐτοῦ οὐχὶ πᾶσαι πρὸς ἡμᾶς εἰσιν; πόθεν οὖν τούτῳ ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: pt
  text: E não estão todas as irmãs dele entre nós? De onde, então, vêm a este homem todas essas coisas?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parentes do sexo feminino”. A palavra grega normalmente significa “irmãs” neste contexto, mas alguns a interpretam de maneira mais ampla à luz de debates teológicos posteriores.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: irmãs
  rationale: É o sentido familiar comum do termo e se ajusta à referência, no contexto, aos membros da família de Jesus conhecidos na comunidade.
- source_word: οὐχὶ πᾶσαι
  choice: não estão todas
  rationale: Preserva a pergunta retórica que espera resposta afirmativa e mantém a ênfase na totalidade das irmãs.
- source_word: πρὸς ἡμᾶς
  choice: entre nós
  rationale: Expressa naturalmente a presença e a associação delas com a comunidade local.
- source_word: πόθεν
  choice: De onde
  rationale: Mantém a pergunta sobre a origem ou fonte da sabedoria e das obras mencionadas no contexto.
- source_word: οὖν
  choice: então
  rationale: Marca de forma natural a conclusão inferida pelos moradores.
- source_word: τούτῳ
  choice: este homem
  rationale: Conserva a referência demonstrativa a Jesus e seu tom contextual levemente depreciativo.
- source_word: ταῦτα πάντα
  choice: todas essas coisas
  rationale: Reproduz diretamente a expressão plural abrangente, que remete à sabedoria e às obras poderosas do contexto.
theological_decisions:
- issue: Natureza da referência às irmãs de Jesus
  choice: Traduzir ἀδελφαὶ em seu sentido lexical comum como “irmãs”.
  alternative: “parentes do sexo feminino” ou “primas”
  rationale: O contexto familiar favorece o sentido ordinário, e a tradução não deve resolver debates teológicos posteriores por meio de uma ampliação não exigida pelo texto grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Entre nós” soa natural para a presença na comunidade; “este homem” preserva o valor demonstrativo e o tom retórico do original.
