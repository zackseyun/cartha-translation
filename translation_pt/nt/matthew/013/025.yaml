  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: pt
  text: Mas, enquanto os homens dormiam, veio o inimigo dele, semeou joio no meio do trigo e foi embora.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: os homens
  rationale: Mantém o referente humano masculino do contexto agrícola e corresponde diretamente ao plural grego, sem ampliar para uma expressão neutra.
- source_word: ζιζάνια
  choice: joio
  rationale: Termo tradicional e preciso em português para a planta daninha semelhante ao trigo enquanto jovem; preserva a imagem agrícola da parábola.
- source_word: ἀνὰ μέσον τοῦ σίτου
  choice: no meio do trigo
  rationale: Reproduz naturalmente a ideia de que o joio foi espalhado entre a plantação de trigo.
- source_word: ἀπῆλθεν
  choice: foi embora
  rationale: Expressão corrente que comunica claramente a partida do inimigo após a semeadura.
