id: MAT.13.30
reference: Matthew 13:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: pt
  text: 'Deixem que ambos cresçam juntos até a colheita. No tempo da colheita, direi aos ceifeiros: ‘Juntem primeiro o joio[a] e amarrem-no em feixes para queimá-lo; mas recolham o trigo no meu celeiro.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ervas daninhas”; tradicionalmente identificado como “joio”.
    reason: ζιζάνια pode designar ervas daninhas nocivas e é tradicionalmente associado ao joio; a nota preserva essa alternativa lexical e fica ancorada no termo a que se refere.
lexical_decisions:
- source_word: ἄφετε
  choice: Deixem
  rationale: 'O imperativo tem sentido permissivo: deixar ou permitir que algo aconteça. “Deixem” é direto e natural em português.'
- source_word: συναυξάνεσθαι ἀμφότερα
  choice: que ambos cresçam juntos
  rationale: Preserva tanto a ideia de crescimento conjunto expressa pelo verbo composto quanto a referência explícita aos dois tipos de planta.
- source_word: μέχρι τοῦ θερισμοῦ
  choice: até a colheita
  rationale: Mantém a colheita como o evento definido até o qual os dois devem crescer juntos.
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: No tempo da colheita
  rationale: Reproduz de perto a referência ao momento próprio ou determinado da colheita, em linguagem portuguesa clara.
- source_word: θερισταῖς
  choice: ceifeiros
  rationale: Termo agrícola preciso para os trabalhadores que fazem a colheita; é tradicional, inteligível e adequado ao registro da parábola.
- source_word: Συλλέξατε πρῶτον
  choice: Juntem primeiro
  rationale: Expressa com clareza a ordem e a sequência da ação, distinguindo-a naturalmente do verbo posterior.
- source_word: τὰ ζιζάνια
  choice: o joio
  rationale: “Joio” é o equivalente português estabelecido para a planta daninha semelhante ao trigo e preserva a imagem específica da parábola.
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: amarrem-no em feixes
  rationale: Conserva a ação concreta de atar o joio, coletivamente referido no singular em português, formando feixes.
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: para queimá-lo
  rationale: A construção grega expressa finalidade. A formulação evita acrescentar uma interpretação além da imagem agrícola.
- source_word: τὸν δὲ σῖτον συναγάγετε εἰς τὴν ἀποθήκην μου
  choice: mas recolham o trigo no meu celeiro
  rationale: “Recolham” diferencia este verbo do anterior, enquanto “celeiro” comunica naturalmente o depósito agrícola indicado por ἀποθήκη.
theological_decisions:
- issue: Imagem parabólica da separação final
  choice: Manter apenas a imagem agrícola no texto
  alternative: Explicitar aqui o juízo final ou traduzir a queima como destruição definitiva
  rationale: A interpretação escatológica é apresentada mais adiante no capítulo. Este versículo deve conservar a parábola como foi narrada, sem antecipar nem ampliar sua explicação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Joio”, “ceifeiros” e “celeiro” preservam a concretude agrícola e o caráter tradicional da imagem sem recorrer a linguagem arcaizante.
