  text: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: pt
  text: 'Contou-lhes outra parábola: “O Reino dos céus é como o fermento[a] que uma mulher pegou e escondeu[b] em três medidas de farinha[c], até que tudo ficasse fermentado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “levedura”. O termo grego se refere a um agente usado para fazer a massa fermentar.
    reason: lexical_alternative
  - marker: b
    text: Ou “misturou” ou “incorporou”; literalmente, “escondeu”.
    reason: lexical_alternative
  - marker: c
    text: Em grego, “três seás de farinha”, uma grande quantidade.
    reason: cultural_note
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: Contou-lhes outra parábola
  rationale: Expressa naturalmente em português a introdução narrativa e preserva o sentido adicional de ἄλλην.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: o Reino dos céus
  rationale: Mantém a expressão característica de Mateus em forma consagrada, clara e fiel ao plural grego de influência semítica.
- source_word: ζύμῃ
  choice: fermento
  rationale: É o termo português comum para o agente que faz a massa fermentar e conserva a imagem metafórica sem lhe atribuir valor positivo ou negativo.
- source_word: ἣν λαβοῦσα γυνὴ
  choice: que uma mulher pegou
  rationale: Converte o particípio grego em uma sequência verbal natural, sem alterar a ordem das ações.
- source_word: ἐνέκρυψεν εἰς
  choice: escondeu em
  rationale: Preserva a força literal de ἐγκρύπτω, em vez de substituí-la silenciosamente por uma interpretação culinária como “misturou”.
- source_word: ἀλεύρου σάτα τρία
  choice: três medidas de farinha
  rationale: Comunica de modo acessível a medida seca, enquanto a designação histórica “satos” e a grande quantidade são explicadas em nota.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: até que toda a massa ficou fermentada
  rationale: Reproduz o resultado passivo e a totalidade indicada por ὅλον; “massa” explicita de maneira natural o conjunto de farinha preparado.
theological_decisions:
- issue: Conotação de ζύμη na parábola do Reino
  choice: Traduzir de modo neutro como “fermento”
  alternative: Interpretar o fermento como necessariamente positivo ou negativo e ajustar a redação segundo essa leitura
  rationale: A comparação destaca a ação oculta e abrangente do fermento. A tradução conserva a imagem sem resolver debates teológicos com base no uso do fermento em outras passagens.
- issue: Sentido de ἐνέκρυψεν
  choice: Manter “escondeu” no texto principal
  alternative: Traduzir como “misturou” ou “incorporou”
  rationale: O verbo grego significa literalmente esconder ou ocultar em algo. A formulação preserva a possível ênfase na ação oculta, enquanto os equivalentes culinários ficam registrados em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a concisão da parábola, preserva a imagem concreta e evita linguagem técnica no texto principal.
