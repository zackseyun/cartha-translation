  naturalness: «Contou-lhes outra parábola» e «O Reino dos céus é como» são naturais, dignos e amplamente compreensíveis. «Até que tudo ficasse fermentado» é fluente em português moderno e não introduz um referente adicional.
  terminology: «Reino dos céus» preserva a formulação mateana; «fermento» é a escolha portuguesa mais corrente e teologicamente neutra para ζύμη. A nota lexical é ajustada para uma alternativa efetiva e atual («levedura»). «Seás» é a forma histórica mais reconhecível para a unidade, explicada como grande quantidade.
