id: MAT.13.38
reference: Matthew 13:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: pt
  text: O campo é o mundo, e a boa semente são os filhos do Reino. O joio[a] são os filhos do Maligno[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais genericamente, “ervas daninhas”. O joio é uma planta semelhante ao trigo.
    reason: lexical_alternative
  - marker: b
    text: '“Filhos” é aqui uma expressão relacional e representativa: refere-se às pessoas que pertencem ao Reino ou ao Maligno, respectivamente.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀγρός
  choice: campo
  rationale: É a equivalência natural no contexto agrícola e preserva a imagem da parábola.
- source_word: κόσμος
  choice: mundo
  rationale: Expressa de modo amplo e convencional a esfera em que ocorre a semeadura.
- source_word: καλὸν σπέρμα
  choice: boa semente
  rationale: Mantém a metáfora agrícola e o contraste com o joio.
- source_word: οὗτοί εἰσιν
  choice: são
  rationale: Em português, a construção identifica naturalmente as pessoas representadas pelo substantivo coletivo singular 'semente', sem exigir um demonstrativo explícito.
- source_word: υἱοὶ τῆς βασιλείας
  choice: filhos do Reino
  rationale: Preserva a expressão relacional masculina do grego e a terminologia característica de Mateus.
- source_word: ζιζάνια
  choice: joio
  rationale: É o termo português consagrado e ainda compreensível para a erva daninha semelhante ao trigo; mantém a especificidade da imagem melhor que o genérico 'ervas daninhas'.
- source_word: υἱοὶ τοῦ πονηροῦ
  choice: filhos do Maligno
  rationale: O artigo e o masculino singular favorecem um referente pessoal; 'Maligno' é uma formulação natural em português.
theological_decisions:
- issue: Se τοῦ πονηροῦ indica o mal de forma impessoal ou uma figura pessoal
  choice: do Maligno
  alternative: do mal
  rationale: A forma grega com artigo, no masculino singular e após 'filhos', favorece a leitura pessoal sem identificar além do que o texto afirma.
- issue: Se υἱοὶ deve ser traduzido de forma inclusiva
  choice: filhos
  alternative: pessoas que pertencem ao Reino / ao Maligno
  rationale: A tradução mantém o masculino plural explícito e a força relacional do idioma bíblico; uma nota esclarece seu alcance representativo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A coordenação simples acompanha as explicações paralelas do grego. 'Reino' e 'Maligno' recebem maiúscula por funcionarem, no contexto, como designações definidas.
