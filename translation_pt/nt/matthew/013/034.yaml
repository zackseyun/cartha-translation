source:
  edition: SBLGNT
  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: pt
  text: Jesus falou todas essas coisas às multidões por meio de parábolas; e, sem parábola, não lhes falava nada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem parábola, não lhes disse nada”. O imperfeito grego pode indicar uma prática habitual ou uma ação passada vista em seu desenvolvimento.'
    reason: alternativa aspectual
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: todas essas coisas
  rationale: Preserva tanto a força demonstrativa de Ταῦτα quanto a abrangência de πάντα, em português natural.
- source_word: ἐλάλησεν
  choice: falou
  rationale: O aoristo resume o ato discursivo de Jesus; “falou” corresponde naturalmente a λαλέω e contrasta adequadamente com o imperfeito posterior.
- source_word: ἐν παραβολαῖς
  choice: por meio de parábolas
  rationale: Expressa o valor de meio ou modo de ἐν com o dativo e evita que “em parábolas” soe menos natural para alguns leitores.
- source_word: τοῖς ὄχλοις
  choice: às multidões
  rationale: Mantém o plural do grego e usa uma formulação clara e corrente.
- source_word: χωρὶς παραβολῆς
  choice: sem parábola
  rationale: Mantém o sentido de χωρίς e o singular παραβολῆς, sem generalizá-lo para o plural.
- source_word: οὐδὲν ἐλάλει αὐτοῖς
  choice: não lhes falava nada
  rationale: A construção é idiomática em português, preserva o referente pronominal e permite que o imperfeito ἐλάλει comunique ação habitual ou continuada.
theological_decisions:
- issue: Força narrativa do imperfeito ἐλάλει na segunda oração
  choice: não lhes falava nada
  alternative: não lhes disse nada
  rationale: O imperfeito pode apresentar a prática característica de Jesus ao dirigir-se às multidões nesse contexto. A tradução no imperfeito preserva essa nuance sem transformar a afirmação em uma regra absoluta para todo o ministério de Jesus.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Às multidões” conserva o plural; “por meio de parábolas” torna explícito o valor instrumental ou modal da expressão grega. O ponto e vírgula ajuda a separar a declaração resumitiva da explicação subsequente.
