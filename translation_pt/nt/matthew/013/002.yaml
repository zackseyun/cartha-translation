base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/002.yaml
  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: pt
  text: E grandes multidões se reuniram em volta dele, de modo que ele entrou num barco[a] e se sentou, e toda a multidão estava de pé na margem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “embarcou num barco”.
    reason: lexical_alternative
  - marker: b
    text: Ou “na praia” ou “na orla”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: se reuniram
  rationale: 'O aoristo passivo tem aqui sentido naturalmente intransitivo: as multidões convergiram para junto de Jesus. “Se reuniram” é claro e idiomático em português.'
- source_word: πρὸς αὐτόν
  choice: junto dele
  rationale: A preposição πρός com acusativo indica movimento em direção a Jesus; “junto dele” comunica tanto a aproximação quanto a proximidade resultante sem acrescentar a ideia explícita de que o cercaram.
- source_word: ὄχλοι πολλοί
  choice: grandes multidões
  rationale: A expressão pode destacar multidões numerosas ou de grande tamanho. “Grandes multidões” é natural e preserva o plural do grego.
- source_word: ὥστε
  choice: de modo que
  rationale: Introduz a consequência da reunião das multidões e mantém clara a relação de resultado.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: entrou num barco
  rationale: A construção descreve Jesus entrando ou embarcando em uma embarcação. “Entrou num barco” é natural, atual e diretamente compreensível.
- source_word: καθῆσθαι
  choice: se sentou
  rationale: Expressa a ação de tomar assento no barco; a forma pronominal é idiomática em português.
- source_word: πᾶς ὁ ὄχλος
  choice: toda a multidão
  rationale: Preserva a mudança do plural anterior para a referência coletiva singular do texto grego.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: na margem
  rationale: αἰγιαλός designa a faixa de terra junto à água. “Na margem” é neutro e adequado ao cenário do lago, sem a possível conotação recreativa moderna de “praia”.
- source_word: εἱστήκει
  choice: estava de pé
  rationale: A forma verbal descreve o estado contínuo da multidão em pé. “Estava de pé” representa melhor esse aspecto cênico do que o simples “ficou” ou “parou”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A construção conserva a progressão narrativa e o contraste espacial entre Jesus sentado no barco e a multidão em pé na margem. Os marcadores foram posicionados junto às expressões às quais suas notas efetivamente se referem.
