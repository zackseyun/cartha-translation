  text: καὶ ἐσκανδαλίζοντο ἐν αὐτῷ. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ ⸀πατρίδι καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: pt
  text: 'E eles ficavam ofendidos com ele.[a] Mas Jesus lhes disse: “Um profeta não fica sem honra, a não ser em sua terra natal[b] e em sua própria casa.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se escandalizavam por causa dele”; literalmente, “eram levados a tropeçar nele”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “lugar de origem”, “terra” ou “pátria”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “entre os de sua casa”. A palavra grega pode se referir à casa ou às pessoas do círculo doméstico e familiar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: se escandalizavam por causa dele
  rationale: A expressão indica que Jesus se tornou motivo de rejeição ou tropeço para eles. A formulação conserva a imagem lexical do grego, é compreensível em português bíblico corrente e evita sugerir mero choque emocional.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Mas Jesus lhes disse
  rationale: δέ introduz um contraste leve entre a reação deles e a resposta de Jesus; “Mas” torna essa mudança discursiva clara e natural.
- source_word: προφήτης
  choice: profeta
  rationale: Equivalente direto, tradicional e plenamente reconhecível do termo grego.
- source_word: οὐκ ἔστιν ... ἄτιμος εἰ μὴ
  choice: só fica sem honra
  rationale: Esta formulação portuguesa expressa naturalmente a construção grega “não ... senão”, preservando o caráter proverbial e o contraste entre honra e falta de honra.
- source_word: πατρίδι
  choice: própria terra
  rationale: No contexto, πατρίς designa o lugar de origem de uma pessoa. “Própria terra” preserva uma abrangência maior que “cidade natal” e não força a referência a uma nação.
- source_word: οἰκίᾳ αὐτοῦ
  choice: sua própria casa
  rationale: οἰκία pode indicar tanto a casa quanto o círculo doméstico ou familiar. A tradução mantém essa polissemia em linguagem natural, esclarecida em nota.
theological_decisions:
- issue: Alcance do provérbio de Jesus sobre a rejeição de um profeta
  choice: Manter uma declaração proverbial geral sobre a falta de honra no ambiente de origem e no círculo doméstico.
  alternative: Explicitar que Jesus fala especificamente da incredulidade de seus familiares ou formular uma doutrina geral sobre toda rejeição a Jesus.
  rationale: O grego apresenta um provérbio aplicado à situação narrativa. A tradução preserva a tensão social de honra e rejeição sem acrescentar uma interpretação doutrinária não expressa no versículo.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A redação conserva o tom proverbial, a imagem de escândalo/tropeço e a ambiguidade de οἰκία entre espaço doméstico e círculo familiar.
