  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: pt
  text: Quanto ao que foi semeado entre os espinhos, este é aquele que ouve a palavra; mas as preocupações desta era[a] e o engano da riqueza[b] sufocam a palavra, e ele se torna infrutífero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «as preocupações deste mundo». Em sentido mais literal, o grego diz «a preocupação desta era».'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «o engano das riquezas».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: Quanto ao que foi semeado entre os espinhos
  rationale: Preserva a forma passiva e a imagem da semeadura, enquanto introduz naturalmente em português este caso da explicação da parábola. O masculino singular é retomado pessoalmente na sequência.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: aquele que ouve a palavra
  rationale: A oração relativa é natural em português e mantém λόγος como «a palavra», isto é, a mensagem proclamada no contexto.
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: as preocupações desta era
  rationale: O plural idiomático expressa o valor coletivo de μέριμνα, e «era» preserva o sentido temporal e moral de αἰών sem o transformar diretamente em «mundo».
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: o engano da riqueza
  rationale: Mantém a construção genitiva e apresenta a riqueza como enganosa, sem acrescentar uma explicação teológica ao texto.
- source_word: συμπνίγει
  choice: sufocam
  rationale: O verbo conserva a metáfora agrícola vívida de plantas espinhosas que impedem o crescimento. O plural concorda naturalmente com os dois elementos coordenados em português.
- source_word: ἄκαρπος γίνεται
  choice: ele se torna infrutífero
  rationale: A retomada pessoal corresponde a «aquele que ouve» e evita sugerir que a própria palavra seja intrinsecamente infrutífera.
theological_decisions:
- issue: Sentido de αἰών
  choice: desta era
  alternative: deste mundo
  rationale: «Era» representa mais precisamente o aspecto temporal de αἰών e preserva a tensão neotestamentária entre a era presente e outra era, sem impor ao substantivo o sentido espacial de κόσμος.
- issue: Referente pessoal ou impessoal no fim da explicação
  choice: ele se torna infrutífero
  alternative: ela se torna infrutífera; a palavra fica infrutífera
  rationale: A explicação identifica o semeado com «aquele que ouve a palavra». A forma pessoal preserva essa identificação e não atribui esterilidade intrínseca à palavra.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. «Quanto ao» torna clara a transição explicativa; «infrutífero» preserva a metáfora de fruto, e as notas registram alternativas legítimas sem resolver indevidamente a ambiguidade lexical.
