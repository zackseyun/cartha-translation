  yaml_path: translation/nt/matthew/013/009.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: pt
  text: Quem tem ouvidos, ouça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Quem tem
  rationale: O artigo com o particípio presente funciona substantivamente e designa, de modo genérico, qualquer pessoa que tenha ouvidos. “Quem tem” é natural em português, mantém o singular genérico e evita introduzir marca de gênero ausente no sentido referencial da expressão.
- source_word: ὦτα
  choice: ouvidos
  rationale: O substantivo grego está no plural. “Ouvidos” reproduz diretamente o número e preserva a conhecida expressão idiomática.
- source_word: ἀκουέτω
  choice: ouça
  rationale: O imperativo presente ativo na terceira pessoa do singular é expresso naturalmente pelo presente do subjuntivo com força imperativa em português. “Ouça” conserva tanto o sentido básico de ouvir quanto a implicação contextual de prestar atenção e acolher a mensagem.
theological_decisions:
- issue: Forma masculina singular genérica
  choice: Quem tem ouvidos, ouça.
  alternative: Aquele que tem ouvidos, ouça.
  rationale: O grego usa uma construção masculina singular com referência genérica. “Quem” preserva essa referência singular e inclusiva sem transformar a frase em plural nem restringi-la aos homens; também soa mais natural no português contemporâneo.
translation_notes:
  register: Formulação breve, solene e corrente, compreensível em português moderno amplo e com boa legibilidade brasileira. A construção preserva o paralelismo singular e a força exortativa do original.
