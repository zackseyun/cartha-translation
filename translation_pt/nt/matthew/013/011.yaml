id: MAT.13.11
reference: Matthew 13:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: pt
  text: 'Ele lhes respondeu: “Porque a vocês foi dado[b] conhecer os mistérios[a] do Reino dos céus, mas àqueles não foi dado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os segredos”.
    reason: lexical_alternative
  - marker: b
    text: A forma passiva “foi dado” deixa implícito quem dá; o sentido é que esse conhecimento é concedido por Deus.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: respondeu
  rationale: A combinação de particípio e verbo finito é uma fórmula grega de sentido unitário; “respondeu” transmite a ideia com naturalidade, sem a redundância de “respondendo, disse”.
- source_word: Ὅτι
  choice: Porque
  rationale: No contexto, Jesus responde à pergunta dos discípulos sobre o motivo de falar em parábolas; “Porque” introduz naturalmente a razão apresentada, sem excluir a função de introduzir o conteúdo da resposta.
- source_word: ὑμῖν δέδοται
  choice: a vocês foi dado
  rationale: Mantém o contraste enfático de destinatários e conserva a voz passiva e o agente implícito. “Vocês” oferece leitura ampla e natural em português moderno.
- source_word: γνῶναι
  choice: conhecer
  rationale: Reproduz o sentido básico de γινώσκω sem substituir a ideia por uma interpretação mais estreita como “compreender”.
- source_word: τὰ μυστήρια
  choice: os mistérios
  rationale: Preserva a categoria bíblica de realidades divinas antes ocultas e agora reveladas; “segredos” é possível, mas reduz parte dessa nuance.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: do Reino dos céus
  rationale: É a forma portuguesa natural e consagrada da expressão característica de Mateus, mantendo o plural do grego.
- source_word: ἐκείνοις δὲ οὐ δέδοται
  choice: mas àqueles não foi dado
  rationale: “Àqueles” conserva a força contrastiva e distal de ἐκείνοις, enquanto a repetição de “foi dado” mantém o paralelismo retórico.
theological_decisions:
- issue: Agente divino implícito na forma passiva δέδοται
  choice: Manter “foi dado” sem identificar expressamente quem deu
  alternative: “Deus deu a vocês” ou “foi dado por Deus”
  rationale: Embora o agente provavelmente seja Deus, o grego o deixa implícito. A voz passiva preserva essa formulação e evita explicitar no texto aquilo que a fonte não declara.
- issue: Sentido de μυστήρια no contexto do Reino
  choice: Traduzir por “mistérios”
  alternative: “segredos” ou “verdades ocultas”
  rationale: “Mistérios” conserva a tensão entre ocultação e revelação e evita limitar o termo a uma explicação interpretativa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para o plural de segunda pessoa. A ordem “a vocês foi dado” preserva a ênfase contrastiva do grego; “àqueles” mantém a distinção em relação aos discípulos. Os marcadores foram posicionados junto aos termos que efetivamente explicam.
