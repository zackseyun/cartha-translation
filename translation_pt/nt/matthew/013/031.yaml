  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: pt
  text: 'Ele lhes apresentou outra parábola, dizendo: “O reino dos céus é semelhante a um grão de mostarda que um homem pegou e semeou em seu campo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: apresentou
  rationale: Neste contexto, παρατίθημι significa expor ou apresentar algo a um público. “Apresentou” é natural em português e conserva a ideia de pôr a parábola diante dos ouvintes.
- source_word: παραβολὴν
  choice: parábola
  rationale: É o termo consagrado e preciso para παραβολή no ensino sinótico, preservando o gênero da narrativa comparativa.
- source_word: Ὁμοία ἐστὶν
  choice: é semelhante a
  rationale: Reproduz com naturalidade a fórmula comparativa grega e mantém um registro digno e corrente.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: o reino dos céus
  rationale: Preserva a expressão característica de Mateus e mantém abertas as dimensões de domínio e governo presentes em βασιλεία.
- source_word: κόκκῳ σινάπεως
  choice: um grão de mostarda
  rationale: κόκκος designa grão ou semente. “Grão de mostarda” é uma expressão clara e tradicional em português para esta imagem.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: que um homem pegou
  rationale: A construção participial é vertida naturalmente como oração finita. “Um homem” preserva o ator individual masculino do relato, e “pegou” expressa de modo direto λαβών.
- source_word: ἔσπειρεν
  choice: semeou
  rationale: σπείρω significa especificamente lançar ou semear semente; “semeou” é mais preciso que “plantou”.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: em seu campo
  rationale: “Campo” corresponde adequadamente a ἀγρός no cenário agrícola, e “seu” conserva o possessivo αὐτοῦ.
theological_decisions:
- issue: Tradução da expressão mateana βασιλεία τῶν οὐρανῶν
  choice: o reino dos céus
  alternative: o reinado dos céus; o reino do céu
  rationale: “O reino dos céus” conserva a formulação característica de Mateus sem reduzir βασιλεία apenas ao exercício abstrato de governar nem transformar a expressão numa simples referência espacial.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe foi mantida próxima ao grego, mas sem rigidez artificial. Não são necessárias notas de rodapé neste versículo.
