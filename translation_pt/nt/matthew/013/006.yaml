base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/006.yaml
  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: pt
  text: Mas, quando o sol nasceu, ela foi queimada pelo calor e, por não ter raiz, murchou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «secou».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: Mas, quando o sol nasceu
  rationale: O genitivo absoluto expressa uma circunstância temporal; «mas» preserva o contraste ou prosseguimento leve de δέ.
- source_word: ἐκαυματίσθη
  choice: ela foi queimada pelo calor
  rationale: O passivo de καυματίζω descreve o dano causado pelo calor intenso; a formulação é clara e natural no contexto de uma planta exposta ao sol.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: por não ter
  rationale: διά com infinitivo articular indica causa; a construção portuguesa mantém essa relação de modo conciso.
- source_word: ῥίζαν
  choice: raiz
  rationale: Preserva o singular do grego e é idiomático em português.
- source_word: ἐξηράνθη
  choice: murchou
  rationale: No contexto vegetal, ξηραίνω pode descrever a planta que perde o viço e seca; «murchou» comunica naturalmente o resultado sem eliminar a alternativa lexical «secou».
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com estrutura causal natural. O pronome «ela» retoma a planta ou semente implícita no contexto. O marcador foi colocado junto a «murchou», termo ao qual pertence a alternativa lexical.
