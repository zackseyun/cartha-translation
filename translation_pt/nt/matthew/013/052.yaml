source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: pt
  text: 'Então ele lhes disse: “Por isso, todo escriba que foi instruído para o Reino dos céus[a] é semelhante ao dono de uma casa[b], que tira do seu tesouro[c] coisas novas e velhas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que se tornou discípulo do Reino dos céus”. O particípio grego pode indicar alguém que foi feito discípulo ou que recebeu formação; a relação com “o Reino dos céus” admite mais de uma compreensão.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “um senhor da casa”; isto é, o chefe de um lar ou de uma casa.
    reason: lexical_alternative
  - marker: c
    text: “Tesouro” também pode designar o lugar onde bens valiosos são guardados, como um depósito ou uma tesouraria.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural a inferência ligada ao diálogo anterior e preserva a conexão lógica do grego.
- source_word: πᾶς γραμματεὺς
  choice: todo escriba
  rationale: Mantém o termo histórico direto, sem restringi-lo antecipadamente a “mestre da Lei”.
- source_word: μαθητευθεὶς
  choice: que se tornou discípulo
  rationale: O particípio passivo de μαθητεύω indica que alguém foi feito discípulo ou recebeu formação discipular; esta formulação preserva esse sentido distintivo melhor que o genérico “instruído”.
- source_word: τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: para o Reino dos céus
  rationale: O dativo incomum pode indicar orientação ou referência. “Para” conserva essa relação sem definir em excesso se o escriba é discípulo do Reino ou foi preparado em função dele.
- source_word: ὅμοιός ἐστιν
  choice: é semelhante a
  rationale: Forma clara e digna de introduzir a comparação, próxima da estrutura grega.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: ao responsável por uma casa
  rationale: Comunica em português atual a função de chefe ou administrador do lar, evitando tanto o arcaísmo “dono de casa” nesse sentido quanto a ideia moderna restrita de proprietário imobiliário.
- source_word: ἐκβάλλει
  choice: tira
  rationale: No contexto de bens guardados, significa fazer sair ou retirar; “tira” é natural e não sugere expulsão violenta.
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: do seu tesouro
  rationale: Preserva a dupla possibilidade de bens valiosos e reserva onde são guardados, mantendo o possessivo do grego.
- source_word: καινὰ καὶ παλαιά
  choice: coisas novas e velhas
  rationale: Explicita naturalmente em português o substantivo implícito nos adjetivos neutros plurais e mantém a ordem do original.
theological_decisions:
- issue: Sentido de μαθητευθεὶς e sua relação com o Reino
  choice: um escriba que se tornou discípulo para o Reino dos céus
  alternative: um escriba instruído acerca do Reino dos céus; um escriba que se tornou discípulo do Reino dos céus
  rationale: A redação mantém a formação discipular indicada pelo verbo e preserva a ambiguidade da relação expressa pelo dativo, sem reduzir a frase a conversão, educação acadêmica ou cargo religioso.
- issue: Identidade e função do οἰκοδεσπότης
  choice: responsável por uma casa
  alternative: chefe de família; dono da casa
  rationale: A escolha conserva a função de autoridade e administração doméstica própria da metáfora, sem extrair dela uma afirmação doutrinária ou social adicional.
- issue: Relação entre as coisas novas e velhas
  choice: manter apenas a imagem, sem identificar seus referentes
  alternative: explicitar como novos e antigos ensinamentos, ou como Novo e Antigo Testamentos
  rationale: O texto não identifica expressamente as coisas novas e velhas. A tradução preserva a tensão e evita impor uma interpretação posterior.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. “Reino” recebe inicial maiúscula por convenção editorial referente ao Reino dos céus. A estrutura retém a imagem histórica do escriba e evita explicar no corpo do versículo aquilo que o grego deixa aberto.
