  source_fidelity: A formulação «que se tornou discípulo para o Reino» reproduz de modo demasiado literal uma relação que não é idiomática em português e pode sugerir uma finalidade pessoal pouco clara. O particípio passivo μαθητευθείς comporta bem «instruído»/«formado», enquanto a nota preserva a alternativa de “feito discípulo”. «Tira do seu tesouro coisas novas e velhas» representa adequadamente ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
  naturalness: «Foi instruído para o Reino dos céus» é claro, natural e conserva a orientação do dativo sem resolver indevidamente a sua relação semântica. «Dono de uma casa» é uma designação mais direta e corrente para a figura metafórica do οἰκοδεσπότης do que «responsável por uma casa».
  terminology: «Escriba», «Reino dos céus», «tesouro», «novas e velhas» mantêm adequadamente a terminologia e a imagem mateana. A nota sobre «dono de uma casa» esclarece que se trata do chefe/senhor do lar, e não meramente de propriedade imobiliária moderna.
