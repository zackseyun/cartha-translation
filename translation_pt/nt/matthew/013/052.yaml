    issue: «que se tornou discípulo para o Reino dos céus»
    rationale: Embora procure preservar o dativo incomum, «tornar-se discípulo para» não é uma combinação natural em português e deixa a relação sintática e semântica opaca. «Foi instruído para» traduz de modo idiomático a voz passiva e a orientação ao Reino; a alternativa discipular deve ficar em nota.
  - severity: low
    issue: «responsável por uma casa» enfraquece οἰκοδεσπότης
    rationale: A expressão pode indicar apenas alguém encarregado de uma residência. O grego designa o senhor ou chefe do lar. «Dono de uma casa», explicado em nota, comunica melhor a função metafórica em português corrente.
