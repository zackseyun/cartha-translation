  text: Καὶ προσελθόντες οἱ μαθηταὶ εἶπαν αὐτῷ· Διὰ τί ἐν παραβολαῖς λαλεῖς αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/010.yaml
  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: pt
  text: 'Então os discípulos se aproximaram[a] e lhe disseram: “Por que você lhes fala em parábolas?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se achegaram”; o particípio grego destaca que os discípulos primeiro se aproximaram de Jesus e depois falaram.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Então
  rationale: Neste contexto, a conjunção faz avançar a narrativa. “Então” expressa essa sequência de modo natural em português, sem acrescentar conteúdo.
- source_word: προσελθόντες
  choice: se aproximaram
  rationale: O particípio aoristo indica que os discípulos se achegaram a Jesus antes de falar. “Se aproximaram” preserva claramente esse movimento.
- source_word: οἱ μαθηταὶ
  choice: os discípulos
  rationale: O artigo identifica o grupo já conhecido; “de Jesus” ou “seus” é contextual, mas não está expresso no grego.
- source_word: εἶπαν αὐτῷ
  choice: lhe disseram
  rationale: Mantém o sentido básico de λέγω ao introduzir a pergunta, com formulação natural e próxima do grego.
- source_word: Διὰ τί
  choice: Por que
  rationale: É a forma interrogativa direta e idiomática em português para pedir a razão de algo.
- source_word: ἐν παραβολαῖς
  choice: por meio de parábolas
  rationale: A preposição ἐν indica aqui modo ou meio. A formulação evita a possível estranheza de “em parábolas” e comunica com clareza que as parábolas são o meio empregado.
- source_word: λαλεῖς
  choice: você fala
  rationale: Reproduz o presente e a segunda pessoa do singular em português moderno, com ampla legibilidade brasileira.
- source_word: αὐτοῖς
  choice: com eles
  rationale: Em português, “falar com alguém” é a construção mais natural para indicar os interlocutores, embora o grego também possa ser vertido mais literalmente por “a eles”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega “você” para a segunda pessoa singular e mantém “os discípulos” sem inserir o possessivo implícito. O marcador [a] foi colocado após a oração de aproximação e fala, à qual a nota se refere.
