id: MAT.13.15
reference: Matthew 13:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: pt
  text: Pois o coração deste povo se tornou insensível, seus ouvidos ouviram com dificuldade[a], e eles fecharam os olhos, para que não vejam com os olhos, nem ouçam com os ouvidos, nem entendam com o coração, nem se voltem[b] — e eu os curarei.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «ouviram pesadamente».
    reason: lexical_alternative
  - marker: b
    text: Ou «retornem».
    reason: lexical_alternative
  - marker: c
    text: Citação de Isaías 6:9–10.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: se tornou insensível
  rationale: O verbo significa literalmente tornar-se espesso ou gordo; com «coração», descreve perda de sensibilidade ou discernimento. «Insensível» comunica o sentido idiomático sem introduzir linguagem denominacional.
- source_word: καρδία
  choice: coração
  rationale: Mantém a imagem bíblica do centro interior da compreensão e da disposição, reforçada no próprio versículo por «entendam com o coração».
- source_word: λαοῦ τούτου
  choice: deste povo
  rationale: 'Preserva o demonstrativo e segue uma construção natural em português: «o coração deste povo».'
- source_word: βαρέως ἤκουσαν
  choice: ouviram com dificuldade
  rationale: Reproduz o aoristo e comunica de modo natural a imagem adverbial de ouvir «pesadamente», isto é, com dificuldade.
- source_word: ἐκάμμυσαν
  choice: fecharam
  rationale: Preserva o aoristo ativo e, portanto, a ação deliberada atribuída ao próprio povo.
- source_word: μήποτε
  choice: para que não
  rationale: Mantém a força negativa de propósito ou resultado sem decidir a tensão exegética entre essas categorias.
- source_word: ἴδωσιν ... ἀκούσωσιν ... συνῶσιν ... ἐπιστρέψωσιν
  choice: vejam ... ouçam ... entendam ... se voltem
  rationale: A sequência no subjuntivo é preservada de forma idiomática sob «para que não», sem converter os verbos em paráfrase.
- source_word: ἐπιστρέψωσιν
  choice: se voltem
  rationale: Expressa a ideia de voltar-se ou retornar sem importar a formulação eclesiástica «se convertam».
- source_word: ἰάσομαι
  choice: eu os curarei
  rationale: Traduz diretamente o futuro grego e preserva a promessa de cura sem transformá-la em condicional.
theological_decisions:
- issue: Tensão entre juízo divino e responsabilidade humana na oração introduzida por μήποτε
  choice: para que não vejam ... nem se voltem — e eu os curarei
  alternative: para não acontecer que vejam ... se voltem, e eu os cure
  rationale: A redação mantém a força superficial da construção grega e a ação humana explícita em «fecharam os olhos», sem resolver se a oração deve ser entendida principalmente como propósito, resultado ou descrição judicial irônica.
- issue: Sentido de ἐπιστρέψωσιν
  choice: se voltem
  alternative: retornem; se convertam
  rationale: «Se voltem» conserva a imagem direcional e sua possível dimensão de arrependimento, sem restringir o termo a uma formulação doutrinária posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de «olhos», «ouvidos» e «coração» foi mantida por sua função retórica. A construção «para que não ... nem ...» conserva a tensão do texto-fonte; o travessão antes da oração final ajuda a sinalizar a mudança para a resposta divina sem convertê-la em uma condição contrafactual.
