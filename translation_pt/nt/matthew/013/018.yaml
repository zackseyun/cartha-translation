  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: vocês (expresso na forma verbal «escutem»)
  rationale: O pronome explícito é enfático e contrasta os discípulos com os de fora. Em português, o imperativo plural já identifica os destinatários; «Portanto, escutem» conserva naturalmente o destaque sem exigir o pronome «vocês».
- source_word: οὖν
  choice: Portanto
  rationale: 'Marca a inferência decorrente dos versículos anteriores: visto que aos discípulos foi dado conhecer os mistérios, eles devem ouvir a explicação.'
- source_word: ἀκούσατε
  choice: escutem
  rationale: Imperativo aoristo ativo, segunda pessoa do plural. «Escutem» preserva o chamado direto à atenção sem introduzir explicitamente a ideia de compreender, embora ela seja sugerida pelo contexto.
- source_word: παραβολὴν
  choice: parábola
  rationale: É o termo português consagrado e preciso para παραβολή neste contexto de ensino sinóptico.
- source_word: τοῦ σπείραντος
  choice: daquele que semeou
  rationale: Reproduz naturalmente o particípio aoristo substantivado, incluindo seu aspecto retrospectivo, e evita transformá-lo desnecessariamente no título fixo «o semeador».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativo plural de ampla legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, preservando a relação inferencial de οὖν e a referência verbal daquele que realizou a semeadura.
