  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: pt
  text: Quando ela ficou cheia, puxaram-na para a margem, sentaram-se e recolheram os peixes bons em recipientes[a], mas jogaram fora os estragados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vasilhas”. O termo grego é uma designação geral para recipientes, não necessariamente cestos.
    reason: lexical_alternative
  - marker: b
    text: Ou “os ruins” ou “os imprestáveis”. A palavra grega pode significar “podres”, “estragados” ou, de modo mais geral, “sem valor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: ela / -na
  rationale: O pronome retoma a rede mencionada no versículo anterior. A construção grega relativa foi reorganizada em uma frase natural em português, mantendo o referente feminino.
- source_word: ἐπληρώθη
  choice: ficou cheia
  rationale: O aoristo passivo de πληρόω descreve a rede que se encheu; “ficou cheia” é direto e idiomático no contexto.
- source_word: ἀναβιβάσαντες
  choice: puxaram-na
  rationale: Expressa o movimento de trazer a rede da água para terra sem acrescentar detalhes ausentes do texto.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: para a margem
  rationale: αἰγιαλός designa a margem ou praia. “Margem” funciona naturalmente no contexto e não pressupõe uma praia arenosa.
- source_word: καθίσαντες
  choice: sentaram-se
  rationale: Mantém a ação sucessiva do particípio aoristo em português corrente.
- source_word: συνέλεξαν
  choice: recolheram
  rationale: O verbo significa reunir ou ajuntar. “Recolheram” descreve naturalmente a seleção e colocação dos peixes.
- source_word: τὰ καλά
  choice: os peixes bons
  rationale: O substantivo “peixes” está implícito no grego e é explicitado para clareza em português, sem alterar a imagem.
- source_word: εἰς ἄγγη
  choice: em recipientes
  rationale: ἄγγη é um termo geral para recipientes ou vasilhas; “recipientes” evita especificar indevidamente cestos.
- source_word: τὰ δὲ σαπρά
  choice: mas os estragados
  rationale: σαπρός pode indicar aquilo que está podre, estragado, ruim ou imprestável. “Estragados” preserva a imagem concreta e a força negativa sem sugerir necessariamente decomposição avançada.
- source_word: ἔξω ἔβαλον
  choice: jogaram fora
  rationale: É a forma idiomática moderna de expressar o descarte indicado pela combinação verbal grega.
theological_decisions:
- issue: Interpretação da separação descrita na parábola
  choice: Manter a cena concreta da pesca e da separação dos peixes.
  alternative: Empregar linguagem interpretativa que antecipe explicitamente o juízo final.
  rationale: Este versículo apresenta a imagem da parábola; sua explicação teológica aparece nos versículos seguintes. A tradução não deve inserir essa explicação antecipadamente.
translation_notes:
  register: 'Português moderno, digno e acessível, com boa legibilidade brasileira. A sintaxe foi reorganizada para evitar uma construção relativa artificial, e os agentes permanecem implícitos, como no grego. Os marcadores foram ligados aos termos que efetivamente explicam: [a] a “recipientes” e [b] a “estragados”.'
