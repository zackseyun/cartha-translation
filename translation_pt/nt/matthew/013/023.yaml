source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: pt
  text: 'Mas o que foi semeado em terra boa[a] é aquele que ouve a palavra e a compreende. Esse, sim, dá fruto e produz: em um caso, cem; em outro, sessenta; e em outro, trinta[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “sobre o solo bom”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “um cem, outro sessenta e outro trinta”; isto é, rendimentos variados da colheita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: em terra boa
  rationale: No contexto agrícola, γῆ designa o solo ou terreno que recebe a semente. A expressão portuguesa “em terra boa” é natural e comunica terra apropriada e fértil, sem atribuir necessariamente uma qualidade moral ao solo.
- source_word: σπαρείς
  choice: foi semeado
  rationale: O particípio aoristo passivo mantém a imagem da semeadura. Embora a pessoa representada pela semente esteja em foco, a formulação preserva a identificação metafórica do texto grego sem explicá-la além do necessário.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: aquele que ouve a palavra
  rationale: O particípio presente descreve uma ação característica. “A palavra” preserva a linguagem recorrente do evangelho e continua clara em português.
- source_word: συνιείς
  choice: a compreende
  rationale: Aqui συνίημι indica entender o sentido da palavra ouvida. O pronome “a” retoma naturalmente “a palavra”.
- source_word: δὴ
  choice: sim
  rationale: A expressão “Esse, sim” representa de modo idiomático a ênfase introduzida por δή, sem tornar a frase artificial.
- source_word: καρποφορεῖ
  choice: dá fruto
  rationale: Mantém a metáfora agrícola central à parábola e é expressão corrente e digna em português.
- source_word: ποιεῖ
  choice: produz
  rationale: No contexto, ποιέω se refere à produção da colheita. Traduzir o verbo separadamente preserva a sequência “dá fruto e produz” do grego.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: um, cem; outro, sessenta; e outro, trinta
  rationale: A construção distributiva distingue rendimentos variados. A tradução conserva a forma elíptica do grego, enquanto a nota esclarece que se trata da proporção da colheita.
theological_decisions:
- issue: Natureza da resposta à palavra na parábola
  choice: Descrever quem ouve, compreende e dá fruto em medidas variadas.
  alternative: Explicitar perseverança, conversão verdadeira ou regeneração.
  rationale: O texto afirma ouvir, compreender e frutificar, mas não formula diretamente essas categorias doutrinárias posteriores. A tradução mantém as categorias e a tensão próprias do versículo.
- issue: Identificação entre a semente semeada e a pessoa que ouve
  choice: Manter “o que foi semeado ... é aquele que ouve”.
  alternative: Parafrasear como “a semente semeada ... representa aquele que ouve”.
  rationale: A redação escolhida conserva a passagem metafórica e a construção pessoal do grego, sem inserir o verbo interpretativo “representar”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Terra boa” soa mais natural no contexto rural do que uma formulação excessivamente técnica; “Esse, sim” comunica de forma idiomática a ênfase de δή. A pontuação explicita a distribuição dos rendimentos sem eliminar a concisão do original.
