  naturalness: O texto é claro e de registro apropriado. Contudo, “um, cem; outro, sessenta” é excessivamente elíptico em português moderno e pode momentaneamente soar como uma enumeração sem relação sintática. “Em um caso ... em outro ...” mantém a concisão e torna a distribuição imediatamente compreensível.
  terminology: “Palavra”, “compreende” e “dá fruto” são escolhas naturais e adequadas ao uso evangélico e à metáfora agrícola. “Esse, sim” transmite com sobriedade a ênfase de δή. A nota sobre os números deve evitar chamar de literalmente portuguesa uma reformulação que não reproduz a estrutura grega de modo estrito.
