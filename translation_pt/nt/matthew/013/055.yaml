source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: pt
  text: Não é este o filho do carpinteiro? A mãe dele não se chama Maria, e seus irmãos[a] não são Tiago, José[b], Simão e Judas?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parentes” ou “familiares”. A palavra grega normalmente significa “irmãos”, mas alguns a entendem em sentido mais amplo neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos trazem “Josés” em vez de “José”.
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: carpinteiro
  rationale: τέκτων designa um artesão que trabalha com madeira ou construção. “Carpinteiro” é a forma tradicional e natural em português, embora “construtor” ou “artesão” também caibam no campo semântico.
- source_word: υἱός
  choice: filho
  rationale: O contexto familiar imediato exige o sentido filial comum.
- source_word: λέγεται
  choice: se chama
  rationale: O passivo grego, neste contexto de identificação pelo nome, corresponde naturalmente ao português “se chama”.
- source_word: Μαριὰμ
  choice: Maria
  rationale: É a forma portuguesa consagrada do nome.
- source_word: ἀδελφοὶ
  choice: irmãos
  rationale: É o sentido lexical ordinário. A tradução principal não deve resolver a controvérsia posterior sobre o grau exato de parentesco; a possibilidade de uso familiar mais amplo é registrada em nota.
- source_word: Ἰάκωβος
  choice: Tiago
  rationale: Forma portuguesa tradicional e amplamente reconhecida para Ἰάκωβος no Novo Testamento.
- source_word: Ἰωσὴφ
  choice: José
  rationale: Corresponde à leitura do SBLGNT; a variante “Josés” é preservada em nota.
- source_word: Σίμων
  choice: Simão
  rationale: Forma portuguesa convencional do nome.
- source_word: Ἰούδας
  choice: Judas
  rationale: Forma portuguesa convencional que representa diretamente o nome grego neste contexto.
- source_word: οὐχ ... ;
  choice: Não é este...? ... não se chama...? ... não são...?
  rationale: As partículas introduzem perguntas retóricas que esperam resposta afirmativa. A formulação portuguesa mantém esse caráter e distribui naturalmente a segunda pergunta grega em duas perguntas coordenadas.
theological_decisions:
- issue: Sentido de ἀδελφοὶ αὐτοῦ na relação familiar com Jesus
  choice: “seus irmãos” no texto principal
  alternative: “seus parentes” ou “seus familiares” em sentido mais amplo
  rationale: “Irmãos” preserva o sentido normal da palavra grega sem decidir se eram irmãos biológicos, meio-irmãos ou parentes em sentido mais amplo. A nota conserva a ambiguidade interpretativa relevante.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição em perguntas breves reproduz a força retórica do original sem soar artificial. Os marcadores seguem imediatamente os termos a que se referem.
