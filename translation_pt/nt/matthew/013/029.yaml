base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: pt
  text: 'Mas ele disse: “Não, pois, ao recolherem as ervas daninhas[a], vocês poderiam arrancar o trigo junto com elas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “joio”; mais especificamente, talvez “azevém”, uma erva daninha que pode se parecer com o trigo nos primeiros estágios de crescimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: respondeu
  rationale: O presente histórico grego é vertido pelo passado narrativo natural em português; no contexto, a fala responde à pergunta dos servos.
- source_word: Οὔ
  choice: Não
  rationale: Reproduz de modo direto e natural a resposta negativa.
- source_word: μήποτε
  choice: para que... não
  rationale: Expressa a advertência preventiva e o possível resultado indesejado sem tornar a construção excessivamente formal.
- source_word: συλλέγοντες
  choice: ao recolherem
  rationale: Conserva a simultaneidade do particípio e deixa claro que os servos são os agentes.
- source_word: ζιζάνια
  choice: ervas daninhas
  rationale: É uma expressão moderna e amplamente compreensível; evita o termo tradicional menos transparente, sem impor uma identificação botânica além do que o texto exige.
- source_word: ἐκριζώσητε
  choice: arranquem
  rationale: No contexto agrícola, comunica naturalmente a retirada da planta pela raiz; a ideia é reforçada pelo risco de remover também o trigo.
- source_word: ἅμα αὐτοῖς
  choice: também... com elas
  rationale: Transmite que o trigo poderia ser removido juntamente com as ervas daninhas.
- source_word: σῖτον
  choice: trigo
  rationale: No contraste agrícola da parábola, a referência específica ao trigo é mais provável e mais clara que o genérico “cereal”.
theological_decisions:
- issue: Tradução de ζιζάνια na parábola
  choice: ervas daninhas
  alternative: joio; possivelmente azevém
  rationale: A opção principal privilegia compreensão moderna e preserva a generalidade do termo no texto, enquanto a nota registra a tradução tradicional e a possível identificação botânica sem a transformar em certeza.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A construção “para que... não” preserva a força preventiva de μήποτε; “respondeu” soa mais natural que “disse” após a pergunta do versículo anterior.
