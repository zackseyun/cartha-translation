  source_fidelity: A tradução transmite adequadamente a negativa, a ação de recolher as ervas daninhas, o risco de arrancar o trigo e a simultaneidade expressa por ἅμα αὐτοῖς. Contudo, «respondeu» acrescenta a nuance de resposta que não está expressa em φησιν; embora o contexto seja dialogal, «disse» é a correspondência narrativa mais direta. A construção «para que ... não» é possível, mas soa menos natural e pode enfraquecer a advertência de μήποτε; uma formulação de risco potencial a explicita melhor.
  naturalness: «Mas ele disse» e «pois, ao recolherem ... vocês poderiam arrancar...» formam uma frase clara, idiomática e digna em português moderno, preservando o destinatário plural sem recorrer a formulação excessivamente formal.
  terminology: «Ervas daninhas» é uma boa opção ampla para ζιζάνια. A nota preserva corretamente «joio» e a identificação possível, não certa, como «azevém». «Arrancar» é aceitável no contexto e, com «junto com elas», comunica suficientemente o risco de desenraizar o trigo.
  issues:
