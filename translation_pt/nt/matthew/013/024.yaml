id: MAT.13.24
reference: Matthew 13:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ ⸀σπείραντι καλὸν σπέρμα ἐν τῷ ἀγρῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: pt
  text: 'Ele lhes apresentou outra parábola, dizendo: “O reino dos céus é semelhante a um homem que semeou boa semente em seu campo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: outra parábola
  rationale: Introduz mais uma parábola na sequência; a expressão é direta e natural em português.
- source_word: παρέθηκεν αὐτοῖς
  choice: lhes apresentou
  rationale: Neste contexto, παρατίθημι significa expor ou apresentar um ensinamento. A formulação comunica isso com clareza, sem preservar de modo artificial a metáfora concreta de pôr algo diante de alguém.
- source_word: λέγων
  choice: dizendo
  rationale: Mantém a ligação participial entre a introdução narrativa e a fala citada.
- source_word: Ὡμοιώθη
  choice: é semelhante a
  rationale: Embora a forma grega seja aoristo passivo, na fórmula parabólica de Mateus ela introduz uma comparação; esta expressão é natural e preserva melhor que 'tornou-se semelhante' a função contextual do verbo.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: o reino dos céus
  rationale: Expressão característica de Mateus, tradicional e idiomática em português; o plural também corresponde formalmente a οὐρανῶν.
- source_word: ἀνθρώπῳ
  choice: um homem
  rationale: O substantivo masculino singular designa a figura masculina da parábola.
- source_word: σπείραντι
  choice: que semeou
  rationale: A oração relativa traduz com naturalidade o particípio aoristo e apresenta a ação concluída.
- source_word: καλὸν σπέρμα
  choice: boa semente
  rationale: Expressão agrícola natural que indica semente de boa qualidade e prepara o contraste posterior com o joio.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: em seu campo
  rationale: Tradução direta e idiomática; o possessivo se refere ao homem.
theological_decisions:
- issue: Fórmula de Mateus para o reino
  choice: o reino dos céus
  alternative: o reino do céu
  rationale: Preserva a expressão própria de Mateus e sua referência ao governo divino sem introduzir uma interpretação denominacional.
- issue: Força de Ὡμοιώθη na introdução da parábola
  choice: é semelhante a
  alternative: tornou-se semelhante a
  rationale: O aoristo passivo poderia ser reproduzido mais formalmente, mas aqui funciona como fórmula de comparação parabólica. A opção escolhida evita sugerir que o reino sofreu uma mudança ontológica ou histórica que o texto não precisa afirmar.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Apresentou' evita uma construção excessivamente literal; 'é semelhante a' conserva o tom bíblico sem soar arcaico.
source_grounding:
  english_pob_role: consult_only
