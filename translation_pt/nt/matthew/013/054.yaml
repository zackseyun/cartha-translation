id: MAT.13.54
reference: Matthew 13:54
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: pt
  text: 'Ao chegar à sua terra natal, ele os ensinava na sinagoga deles, a ponto de ficarem admirados e dizerem: “De onde este homem tirou esta sabedoria e estas obras poderosas[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “poderes”; isto é, feitos de poder, geralmente entendidos como milagres.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: terra natal
  rationale: No contexto, refere-se ao lugar de origem de Jesus, onde ele era conhecido, e não a um país. “Terra natal” preserva o sentido local sem especificar indevidamente “cidade”.
- source_word: ἐδίδασκεν
  choice: ensinava
  rationale: O pretérito imperfeito representa naturalmente em português a ação passada em andamento indicada pelo imperfeito grego.
- source_word: συναγωγῇ
  choice: sinagoga
  rationale: Neste contexto judaico, o termo designa a sinagoga como lugar e instituição de reunião e ensino.
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: a ponto de ficarem admirados e dizerem
  rationale: A construção expressa o resultado do ensino de Jesus. “A ponto de” e os infinitivos flexionados reproduzem esse valor com naturalidade em português.
- source_word: Πόθεν
  choice: De onde ... tirou
  rationale: A pergunta trata da origem ou fonte da sabedoria e das obras. A formulação é idiomática em português e mantém o tom de questionamento.
- source_word: τούτῳ
  choice: este homem
  rationale: O demonstrativo pode transmitir certo distanciamento na fala dos moradores. “Este homem” torna o referente explícito e preserva esse tom.
- source_word: σοφία
  choice: sabedoria
  rationale: Equivalente direto e natural, referente à percepção e ao ensino extraordinários reconhecidos pelos ouvintes.
- source_word: δυνάμεις
  choice: obras poderosas
  rationale: O plural pode designar manifestações ou feitos de poder, especialmente milagres. “Obras poderosas” comunica esse uso metonímico com mais clareza do que o isolado “poderes”, sem reduzir o termo simplesmente a “milagres”.
theological_decisions:
- issue: Sentido de δυνάμεις em referência aos feitos extraordinários de Jesus
  choice: obras poderosas
  alternative: poderes; milagres
  rationale: A tradução mantém a ligação lexical com poder e indica que se trata de feitos, sem impor “milagres” como termo técnico nem sugerir, como poderia fazer “poderes” em português, meras capacidades pessoais.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Terra natal” evita tanto o sentido nacional de “pátria” quanto a especificação não expressa de “cidade natal”. A construção “a ponto de ficarem... e dizerem” preserva a relação de resultado e soa natural.
