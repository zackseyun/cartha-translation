  terminology: «Palavra do reino», «Maligno», «coração» e «semeado» são escolhas consistentes com o vocabulário bíblico e com o registro do versículo. A inicial maiúscula em «Maligno» funciona como designação pessoal contextual, sem acrescentar uma identificação denominacional. As notas estão ancoradas nas expressões pertinentes e oferecem alternativas lexicais legítimas.
