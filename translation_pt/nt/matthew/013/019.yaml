id: MAT.13.19
reference: Matthew 13:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: pt
  text: Quando alguém ouve a palavra do reino e não a entende, o Maligno[a] vem e arranca o que foi semeado no coração dele. Esse é o que foi semeado à beira do caminho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o perverso”.
    reason: lexical_alternative
  - marker: b
    text: Ou “junto ao caminho” ou “à margem da estrada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: quando alguém ouve
  rationale: A construção grega com particípio no genitivo expressa aqui uma situação geral. A formulação portuguesa é natural e mantém a aplicação distributiva a qualquer pessoa.
- source_word: λόγον τῆς βασιλείας
  choice: a palavra do reino
  rationale: “Palavra” preserva a ligação metafórica entre a mensagem e a semente, enquanto “do reino” reproduz sem explicação indevida a relação genitiva do grego.
- source_word: μὴ συνιέντος
  choice: não a entende
  rationale: O verbo indica não compreender ou não captar o sentido. O pronome “a” retoma naturalmente “a palavra” em português.
- source_word: ὁ πονηρὸς
  choice: o Maligno
  rationale: O adjetivo substantivado com artigo designa, no contexto, um agente pessoal mau. “O Maligno” é claro, conciso e não identifica a figura além do que o texto afirma.
- source_word: ἁρπάζει
  choice: arranca
  rationale: O verbo comunica retirada súbita e vigorosa. “Arranca” conserva essa força e funciona bem dentro da imagem da semeadura.
- source_word: τὸ ἐσπαρμένον
  choice: o que foi semeado
  rationale: Reproduz o particípio perfeito passivo substantivado sem tornar explícita a identidade da semente além do próprio texto.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: no coração dele
  rationale: Mantém o termo antropológico bíblico “coração” e o referente singular masculino do grego, em português corrente.
- source_word: οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: Esse é o que foi semeado à beira do caminho
  rationale: Preserva a identificação metonímica, deliberadamente incomum, entre a pessoa, a semente e o lugar da semeadura, sem explicar ou harmonizar a imagem.
theological_decisions:
- issue: Identidade de ὁ πονηρός
  choice: um agente pessoal mau (“o Maligno”)
  alternative: o mal entendido como força abstrata
  rationale: O sujeito vem e retira aquilo que foi semeado, ações que favorecem a leitura pessoal. A tradução não o nomeia mais especificamente do que o grego.
- issue: Referente de αὐτοῦ
  choice: “dele”, singular masculino representativo
  alternative: “dela”, concordando semanticamente com “pessoa”, ou omissão do pronome
  rationale: “Alguém” estabelece o sentido genérico, enquanto “dele” conserva o número e o gênero gramaticais do pronome grego sem prejudicar a naturalidade.
- issue: Identificação do ouvinte com aquilo que é semeado
  choice: manter “Esse é o que foi semeado”
  alternative: explicitar “Esse é como a semente semeada” ou identificar a pessoa apenas com o solo
  rationale: A formulação grega associa diretamente a pessoa ao elemento semeado. A tradução preserva essa tensão da metáfora em vez de resolvê-la.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Maligno” recebe inicial maiúscula por funcionar como designação pessoal; “reino” permanece em minúscula, conforme a forma comum do substantivo e sem acrescentar uma distinção ausente do grego. Os marcadores foram colocados junto às expressões às quais suas notas efetivamente se referem.
source_grounding:
  english_pob_role: consult_only
