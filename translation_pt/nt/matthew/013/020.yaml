source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: pt
  text: Quanto àquele que foi semeado em terreno pedregoso[a], este é aquele que ouve a palavra e imediatamente a recebe com alegria,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “aquele que foi semeado em lugares pedregosos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: Quanto ao que foi semeado em terreno pedregoso
  rationale: A construção participial substantivada retoma a imagem da semeadura e, ao mesmo tempo, aponta para a pessoa representada. “Quanto ao” expressa a transição suave de δέ; “terreno pedregoso” é natural em português e mantém a imagem agrícola.
- source_word: πετρώδη
  choice: terreno pedregoso
  rationale: O adjetivo designa lugares ou solo rochoso/pedregoso. A formulação escolhida é clara e idiomática no contexto da parábola.
- source_word: σπαρείς
  choice: foi semeado
  rationale: O particípio aoristo passivo de σπείρω é vertido por uma forma passiva concisa, preservando a metáfora agrícola.
- source_word: οὗτός ἐστιν
  choice: este é
  rationale: Mantém a identificação direta do grego sem explicitar interpretativamente “representa”.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: aquele que ouve a palavra
  rationale: A oração relativa é idiomática em português e “a palavra” preserva a formulação e a ressonância temática do texto.
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Equivalente claro e corrente que conserva a ênfase na rapidez da reação.
- source_word: μετὰ χαρᾶς
  choice: com alegria
  rationale: Tradução natural que preserva o substantivo χαρά.
- source_word: λαμβάνων αὐτόν
  choice: a recebe
  rationale: λαμβάνω tem aqui o sentido de receber ou acolher; o pronome feminino retoma naturalmente “a palavra” em português.
theological_decisions:
- issue: Referente daquele que foi semeado na explicação da parábola
  choice: “o que foi semeado em terreno pedregoso”, seguido da identificação “este é aquele que...”
  alternative: “a semente semeada em terreno pedregoso representa a pessoa que...”
  rationale: O grego comprime a metáfora ao falar daquele que foi semeado e depois identificá-lo como quem ouve. A tradução preserva essa tensão, sem convertê-la numa paráfrase explicativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura permanece próxima do grego sem soar excessivamente literal; a vírgula final foi mantida porque o versículo prossegue sintaticamente no contexto.
