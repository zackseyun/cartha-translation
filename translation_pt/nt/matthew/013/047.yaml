  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν σαγήνῃ βληθείσῃ εἰς τὴν θάλασσαν καὶ ἐκ παντὸς γένους συναγαγούσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: pt
  text: Novamente, o reino dos céus é semelhante a uma rede de arrasto[a] lançada ao mar e que recolheu peixes[b] de toda espécie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma rede”; o termo grego se refere mais especificamente a uma grande rede de arrasto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “recolheu de toda espécie”; “peixes” está implícito na imagem da pesca.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Novamente
  rationale: Marca a apresentação de outra parábola na sequência e mantém de forma concisa a ideia de repetição.
- source_word: ὁμοία ἐστὶν
  choice: é semelhante a
  rationale: Expressa naturalmente em português a fórmula comparativa usada nas parábolas do reino.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: o reino dos céus
  rationale: Preserva a expressão característica de Mateus sem substituí-la interpretativamente por “reino de Deus”.
- source_word: σαγήνῃ
  choice: uma rede de arrasto
  rationale: O termo designa uma rede grande que é arrastada pela água; esta opção é mais precisa que o termo genérico “rede”.
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: lançada ao mar
  rationale: Mantém a imagem concreta e a referência literal ao mar, em construção idiomática portuguesa.
- source_word: καὶ ἐκ παντὸς γένους συναγαγούσῃ
  choice: que recolheu peixes de toda espécie
  rationale: “Recolheu” representa a ação concluída do particípio aoristo; “peixes” é explicitado por clareza, embora esteja apenas implícito na imagem grega.
theological_decisions:
- issue: Sentido de “reino dos céus”
  choice: Manter “reino dos céus”
  alternative: reino de Deus; reinado dos céus
  rationale: A formulação própria de Mateus deve ser preservada, sem harmonização nem explicação doutrinária introduzida no texto.
- issue: Alcance de “toda espécie”
  choice: Preservar a formulação abrangente e não especificar seu referente teológico
  alternative: Explicitar grupos de pessoas ou categorias morais
  rationale: Neste versículo, a parábola apresenta a imagem da captura de peixes de toda espécie; sua aplicação é desenvolvida nos versículos seguintes e não deve ser antecipada aqui.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção preserva a imagem marítima e a expressão característica de Mateus, ao mesmo tempo que explicita apenas o objeto exigido pela fluidez em português, devidamente assinalado em nota.
