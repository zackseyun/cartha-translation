  text: ⸂εὑρὼν δὲ⸃ ἕνα πολύτιμον μαργαρίτην ἀπελθὼν πέπρακεν πάντα ὅσα εἶχεν καὶ ἠγόρασεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/046.yaml
  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: pt
  text: e, tendo encontrado uma pérola de grande valor[a], foi embora, vendeu tudo o que tinha e a comprou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «uma pérola preciosa».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: e, tendo encontrado
  rationale: O particípio aoristo indica uma ação anterior às ações principais; δέ funciona aqui como conexão leve, bem representada por «e».
- source_word: ἕνα
  choice: uma
  rationale: O numeral grego é preservado pelo artigo indefinido «uma», que neste contexto expressa naturalmente uma única pérola; traduzi-lo por «uma só» acrescentaria ênfase não necessariamente presente.
- source_word: πολύτιμον
  choice: de grande valor
  rationale: Expressa com clareza o valor excepcional da pérola em português moderno, preservando como alternativa a formulação «preciosa».
- source_word: μαργαρίτην
  choice: pérola
  rationale: Equivalente lexical padrão e natural.
- source_word: ἀπελθὼν
  choice: foi
  rationale: O particípio é vertido como verbo finito para formar uma sequência narrativa natural. «Foi» comunica o afastamento contextual sem a rigidez de «retirou-se».
- source_word: πέπρακεν
  choice: vendeu
  rationale: O perfeito grego apresenta a venda como ação concluída; o pretérito perfeito português é a forma narrativa natural.
- source_word: πάντα ὅσα εἶχεν
  choice: tudo o que tinha
  rationale: Formulação corrente que preserva a totalidade explícita da expressão grega.
- source_word: ἠγόρασεν
  choice: comprou
  rationale: Equivalente direto, claro e natural.
- source_word: αὐτόν
  choice: a
  rationale: O pronome retoma «pérola»; em português, a concordância feminina exige «a».
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação «foi, vendeu... e comprou» conserva a progressão rápida das ações sem tornar a sintaxe artificial.
