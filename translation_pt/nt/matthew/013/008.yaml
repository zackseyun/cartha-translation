- from: 'Mas outras sementes caíram em terra boa e davam fruto: umas cem vezes mais, outras sessenta e outras trinta.'
  to: 'Mas outras sementes caíram em terra boa e davam fruto: umas davam cem por um, outras sessenta por um e outras trinta por um.'
  rationale: A revisão substitui a expressão ambígua «vezes mais» por «por um», que exprime diretamente os diferentes rendimentos indicados pelos numerais gregos. A repetição de «davam» e de «por um» torna explícita em português a distribuição de colheitas, sem alterar o aspecto imperfectivo nem a metáfora agrícola.
