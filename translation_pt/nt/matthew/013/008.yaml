  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὴν γῆν τὴν καλὴν καὶ ἐδίδου καρπόν, ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/008.yaml
  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: pt
  text: 'Mas outras sementes caíram em terra boa e davam fruto: umas davam cem por um, outras sessenta por um e outras trinta por um.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλα
  choice: outras sementes
  rationale: O adjetivo neutro plural é substantivado e retoma as sementes do contexto; explicitar “sementes” torna a referência natural em português.
- source_word: δὲ
  choice: Mas
  rationale: A conjunção introduz contraste com os resultados negativos descritos anteriormente.
- source_word: ἔπεσεν
  choice: caíram
  rationale: Preserva o sentido literal de “cair”; o plural em português concorda com “outras sementes”.
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: em terra boa
  rationale: Expressão agrícola corrente e digna; “boa” comunica que a terra era adequada e fértil.
- source_word: ἐδίδου καρπόν
  choice: davam fruto
  rationale: O imperfeito expressa ação continuada ou resultante; a locução preserva a imagem agrícola e soa natural em português.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: umas cem vezes mais, outras sessenta e outras trinta
  rationale: Reproduz a distribuição entre rendimentos diferentes. “Vezes mais” explicita de modo idiomático a multiplicação da produção, subentendida nos numerais gregos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e amplamente compreensível, com leitura natural no Brasil. Mantém a progressão narrativa, o aspecto imperfeito e a metáfora agrícola sem arcaísmos.
