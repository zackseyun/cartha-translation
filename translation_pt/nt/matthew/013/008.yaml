    issue: «umas cem vezes mais, outras sessenta e outras trinta»
    rationale: «Cem vezes mais» pode ter o sentido matemático de aumento de cem vezes, em vez do rendimento «cem por um» subentendido no grego; a omissão de uma expressão equivalente nos dois membros seguintes também torna a escala menos nítida.
