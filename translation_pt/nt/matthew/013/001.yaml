  text: ⸀Ἐν τῇ ἡμέρᾳ ἐκείνῃ ἐξελθὼν ὁ Ἰησοῦς ⸀τῆς οἰκίας ἐκάθητο παρὰ τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/001.yaml
  text: On that day Jesus went out of the house and sat beside the sea[a][b].
translation:
  language: pt
  text: Naquele dia, Jesus saiu da casa e estava sentado junto ao mar[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Naquele mesmo dia”, caso a expressão seja entendida como ênfase na continuidade com o contexto anterior, e não apenas como indicação de tempo.
    reason: alternative_reading
  - marker: b
    text: Ou “perto do mar”. A expressão grega indica um lugar próximo ao mar, sem especificar a distância exata da margem.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: Naquele dia
  rationale: Expressão temporal idiomática e fiel em português. Mantém a referência ao dia em questão sem acrescentar explicitamente a ideia de “mesmo”, embora o contexto possa sugerir continuidade.
- source_word: ἐξελθὼν
  choice: saiu
  rationale: O particípio aoristo indica uma ação anterior ou associada à ação principal. A coordenação com verbo finito é natural em português e preserva a sequência narrativa.
- source_word: τῆς οἰκίας
  choice: de casa
  rationale: Com o verbo “sair”, o genitivo indica o lugar de onde Jesus saiu. “Sair de casa” é a formulação corrente em português e não exige artigo, embora o grego tenha artigo definido.
- source_word: ἐκάθητο
  choice: sentou-se
  rationale: O imperfeito apresenta Jesus sentado como parte da cena. Em português narrativo, “sentou-se” exprime de modo natural a ação que leva a essa posição; “estava sentado” preservaria mais diretamente o aspecto durativo, mas criaria uma sequência menos fluida depois de “saiu”.
- source_word: παρὰ τὴν θάλασσαν
  choice: junto ao mar
  rationale: παρά com acusativo indica posição nas proximidades do mar, sem definir a distância exata da margem. “Junto ao mar” é natural e menos específico que “à beira-mar”.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Nome pessoal transliterado segundo o uso português consagrado.
