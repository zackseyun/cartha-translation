id: MAT.13.32
reference: Matthew 13:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: pt
  text: que é, de fato, menor do que todas as sementes, mas, quando tiver crescido, é maior do que as plantas da horta e se torna uma árvore, de modo que as aves do céu[a] vêm e fazem ninho em seus galhos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as aves do ar”, tradução tradicional de τὰ πετεινὰ τοῦ οὐρανοῦ.
    reason: lexical_alternative
  - marker: b
    text: A imagem das aves alojadas nos galhos pode evocar retratos do Antigo Testamento em que uma grande árvore representa um reino (por exemplo, Ezequiel 17:23; Daniel 4:12), mas o versículo não declara explicitamente esse simbolismo.
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον ... πάντων τῶν σπερμάτων
  choice: menor do que todas as sementes
  rationale: Preserva a forma comparativa do grego e explicita naturalmente a comparação, sem restringir “sementes” a uma categoria agrícola técnica.
- source_word: μέν ... δέ
  choice: de fato ... mas
  rationale: Mantém o contraste discursivo entre o começo pequeno e o resultado maior em português corrente.
- source_word: ὅταν ... αὐξηθῇ
  choice: quando cresce
  rationale: Expressa de modo natural o crescimento considerado como condição para o estado seguinte; evita a construção pouco idiomática “quando tiver sido crescida”.
- source_word: μεῖζον τῶν λαχάνων
  choice: maior do que as plantas da horta
  rationale: “Plantas da horta” abrange as plantas cultivadas indicadas por λάχανα, sem limitar o sentido a verduras ou ervas.
- source_word: γίνεται δένδρον
  choice: se torna uma árvore
  rationale: Conserva diretamente a imagem vívida do texto, sem atenuá-la para “parece uma árvore” ou “fica semelhante a uma árvore”.
- source_word: ὥστε ἐλθεῖν
  choice: de modo que ... vêm
  rationale: Comunica a relação de resultado expressa por ὥστε com infinitivo.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: as aves do céu
  rationale: Reproduz de perto a expressão grega e é uma formulação natural e reconhecível em português.
- source_word: κατασκηνοῦν
  choice: fazem ninho
  rationale: No contexto de aves e galhos, comunica claramente a ideia de se alojar ou nidificar.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: em seus galhos
  rationale: Tradução locativa direta; “seus” retoma naturalmente a árvore em português.
theological_decisions:
- issue: Possível alusão às imagens veterotestamentárias de aves abrigadas numa grande árvore
  choice: Manter literalmente a imagem, sem explicá-la no texto principal.
  alternative: Identificar explicitamente as aves como nações ou povos acolhidos no Reino de Deus.
  rationale: A formulação pode evocar imagens de Ezequiel 17:23 e Daniel 4:12, mas o versículo não interpreta explicitamente seus elementos. A tradução preserva essa ressonância e deixa aberta a questão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção inicia com “que” porque o versículo continua a descrição da semente mencionada no contexto anterior. Preferiu-se “plantas da horta” a termos mais estreitos como “verduras” ou “ervas”.
