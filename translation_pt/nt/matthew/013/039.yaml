  to: O inimigo que as semeou é o diabo; a colheita é o fim da era[a], e os que colhem são os anjos.
  rationale: A revisão remove uma explicitação demonstrativa não presente no texto grego e substitui uma perífrase mais pesada por uma formulação atual, direta e semanticamente equivalente para θερισταί. A nota é ajustada para acompanhar “da era”, preservando as alternativas lexicais e a referência tradicional.
