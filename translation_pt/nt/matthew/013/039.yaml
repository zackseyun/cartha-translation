    issue: O demonstrativo em “o fim desta era” não está expresso no grego.
    rationale: αἰῶνος significa literalmente “da era”. Embora “desta era” seja uma explicitação contextual compreensível, “da era” preserva melhor a formulação-fonte sem perda de clareza.
  - severity: low
    issue: “Os que fazem a colheita” é uma perífrase pouco enxuta para θερισταί.
    rationale: “Os que colhem” comunica diretamente a função dos ceifeiros/colhedores em português moderno e mantém a concisão da imagem agrícola.
  revised_text: O inimigo que as semeou é o diabo; a colheita é o fim da era[a], e os que colhem são os anjos.
