  text: ὁ δὲ ἐχθρὸς ὁ σπείρας αὐτά ἐστιν ὁ διάβολος· ὁ δὲ θερισμὸς συντέλεια ⸀αἰῶνός ἐστιν, οἱ δὲ θερισταὶ ἄγγελοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: pt
  text: O inimigo que as semeou é o diabo; a colheita é o fim da era[a], e os que colhem são os anjos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a consumação da era”; tradicionalmente, “o fim do mundo”.
    reason: alternativa lexical
lexical_decisions:
- source_word: ἐχθρὸς
  choice: inimigo
  rationale: Equivalente corrente e claro, que preserva a oposição pessoal no contexto da explicação da parábola.
- source_word: ὁ σπείρας
  choice: que as semeou
  rationale: O particípio aoristo identifica o inimigo pela ação realizada; “semeou” mantém a imagem agrícola da parábola.
- source_word: αὐτά
  choice: as
  rationale: O pronome retoma as ervas daninhas, expressão feminina em português, e evita repetição desnecessária.
- source_word: διάβολος
  choice: o diabo
  rationale: Neste contexto, funciona como designação pessoal reconhecida; a tradução etimológica “caluniador” obscureceria o referente.
- source_word: θερισμός
  choice: a colheita
  rationale: É a forma nominal mais natural em português e preserva a metáfora agrícola.
- source_word: συντέλεια αἰῶνος
  choice: o fim desta era
  rationale: “Era” preserva o sentido temporal de αἰών sem sugerir necessariamente a destruição do mundo material; “desta” torna natural em português a referência à era presente implícita no contexto.
- source_word: θερισταί
  choice: os que fazem a colheita
  rationale: Forma transparente e atual, que preserva a função agrícola sem recorrer ao menos comum “ceifeiros”.
- source_word: ἄγγελοι
  choice: os anjos
  rationale: O contexto escatológico aponta para seres celestiais, não apenas mensageiros humanos.
- source_word: δέ
  choice: coordenação e pontuação
  rationale: As ocorrências sucessivas marcam a progressão da explicação; em português, a coordenação e o ponto e vírgula reproduzem essa função com naturalidade.
theological_decisions:
- issue: Sentido de αἰών em συντέλεια αἰῶνος
  choice: o fim desta era
  alternative: a consumação desta era; o fim do mundo
  rationale: A opção preserva o horizonte escatológico e o caráter temporal de αἰών, sem impor a ideia de aniquilação da criação. A nota mantém tanto a nuance de culminação de συντέλεια quanto a formulação tradicional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a estrutura explicativa do grego, a metáfora agrícola e a distinção entre “era” e “mundo”.
