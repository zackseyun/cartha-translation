  text: οὐκ ἔχει δὲ ῥίζαν ἐν ἑαυτῷ ἀλλὰ πρόσκαιρός ἐστιν, γενομένης δὲ θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον εὐθὺς σκανδαλίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: pt
  text: Mas não tem raiz em si mesmo e dura pouco. Quando surge aflição ou perseguição por causa da palavra, logo tropeça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cai” ou “se ofende”; o verbo grego pode indicar tropeçar, cair ou tomar ofensa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτῷ
  choice: raiz em si mesmo
  rationale: Preserva a metáfora agrícola e a força reflexiva da expressão grega, com formulação natural em português.
- source_word: πρόσκαιρός
  choice: dura pouco
  rationale: Expressa que a pessoa permanece apenas por tempo limitado e soa mais natural aqui do que o adjetivo isolado “temporário”.
- source_word: γενομένης ... θλίψεως ἢ διωγμοῦ
  choice: quando surge aflição ou perseguição
  rationale: Traduz o genitivo absoluto como oração temporal; “aflição” mantém a ideia de pressão e sofrimento, e “perseguição” é o equivalente preciso e corrente.
- source_word: διὰ τὸν λόγον
  choice: por causa da palavra
  rationale: Mantém a ligação lexical com λόγος e a referência à mensagem proclamada na parábola.
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Conserva a ênfase na rapidez da reação.
- source_word: σκανδαλίζεται
  choice: abandona a fé
  rationale: No contexto, comunica a ruptura prática provocada pela pressão, sem definir um sistema doutrinário; a amplitude do verbo grego é indicada em nota.
theological_decisions:
- issue: Sentido de σκανδαλίζεται no contexto do discipulado
  choice: abandona a fé
  alternative: tropeça; se escandaliza
  rationale: O contexto descreve alguém que acolhe a palavra, mas não persevera sob aflição ou perseguição. “Abandona a fé” torna claro o resultado contextual, enquanto a nota preserva os sentidos mais literais e a tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em duas frases evita uma construção pesada sem alterar a relação lógica do grego. O sujeito permanece implícito, como é natural em português e coerente com o contexto anterior.
