source:
  edition: SBLGNT
  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: pt
  text: Portanto, assim como o joio[a] é recolhido e queimado no fogo, assim será no fim da era[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, uma erva daninha nociva, provavelmente o azevém; também se pode traduzir por “ervas daninhas”.
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “no fim do mundo”. O grego diz “da era”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: Portanto, assim como
  rationale: Preserva tanto a inferência ou continuação marcada por οὖν quanto a comparação introduzida por ὥσπερ, em português natural.
- source_word: συλλέγεται
  choice: é recolhido
  rationale: O singular concorda naturalmente com o coletivo singular português “joio” e mantém a voz passiva da forma grega.
- source_word: τὰ ζιζάνια
  choice: o joio
  rationale: “Joio” é o termo português tradicional e ainda compreensível neste contexto, além de designar a erva daninha provavelmente evocada pelo grego; a nota esclarece seu sentido.
- source_word: πυρὶ καίεται
  choice: queimado no fogo
  rationale: Expressa de modo claro o verbo καίω e a referência explícita ao fogo, sem intensificar o sentido como faria “consumido”.
- source_word: οὕτως ἔσται
  choice: assim será
  rationale: Reproduz de maneira concisa a correspondência da comparação e o valor futuro de ἔσται.
- source_word: ἐν τῇ συντελείᾳ
  choice: no fim
  rationale: “No fim” é idiomático e acessível, comunicando a culminação indicada por συντέλεια sem recorrer ao termo mais técnico “consumação”.
- source_word: τοῦ αἰῶνος
  choice: desta era
  rationale: “Era” preserva o sentido temporal de αἰών e evita confundi-lo com o cosmos físico; “desta” explicita naturalmente em português a era cujo fim está em vista no contexto.
theological_decisions:
- issue: Expressão escatológica τοῦ αἰῶνος
  choice: desta era
  alternative: do mundo
  rationale: A tradução mantém a dimensão temporal e histórico-redentiva de αἰών sem identificar o evento simplesmente com a destruição do mundo físico nem impor um esquema escatológico específico.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Mantém a estrutura comparativa do grego e usa notas para esclarecer “joio” e a amplitude de αἰών.
