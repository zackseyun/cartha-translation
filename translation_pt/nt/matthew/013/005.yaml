  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰ πετρώδη ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ εὐθέως ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: pt
  text: Outras sementes caíram em terreno rochoso[a], onde não havia muita terra, e brotaram imediatamente, porque a terra não era profunda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sobre os lugares rochosos”; a expressão indica uma camada rasa de terra sobre a rocha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: Outras sementes
  rationale: O adjetivo neutro plural retoma de forma elíptica as sementes do versículo anterior. O substantivo é explicitado em português para dar clareza, e o plural concorda naturalmente com o referente implícito.
- source_word: ἔπεσεν
  choice: caíram
  rationale: Preserva o sentido direto de 'cair' na imagem da parábola, sem substituí-lo pela interpretação mais específica 'foram semeadas'.
- source_word: ἐπὶ τὰ πετρώδη
  choice: em terreno rochoso
  rationale: Expressão natural em português para lugares pedregosos ou rochosos, entendidos no contexto como uma camada rasa de terra sobre rocha.
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: onde não havia muita terra
  rationale: A construção impessoal é idiomática em português e evita uma referência pronominal ambígua. 'Terra' é corrente e natural no contexto agrícola.
- source_word: καὶ εὐθέως ἐξανέτειλεν
  choice: e brotaram imediatamente
  rationale: No contexto agrícola, ἐξανέτειλεν descreve a germinação ou emergência da planta; 'brotaram' comunica isso com clareza, e 'imediatamente' preserva a força temporal de εὐθέως.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: porque a terra não era profunda
  rationale: A oração causal traduz diretamente διά com o infinitivo articulado. A formulação comunica de modo natural que a camada de solo tinha pouca profundidade.
theological_decisions: []
