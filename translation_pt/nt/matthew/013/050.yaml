source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: pt
  text: E os lançarão na fornalha de fogo[a]. Ali haverá choro e ranger de dentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “fornalha ardente”. O grego diz literalmente “fornalha de fogo”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: βαλοῦσιν
  choice: lançarão
  rationale: O futuro ativo de βάλλω expressa aqui a ação de lançar alguém para dentro de um lugar. “Lançarão” é natural, digno e mantém a força do ato sem recorrer a linguagem excessivamente coloquial.
- source_word: αὐτοὺς
  choice: os
  rationale: O pronome acusativo masculino plural retoma os maus mencionados no contexto anterior; o pronome objeto “os” reproduz essa referência de modo conciso.
- source_word: κάμινον τοῦ πυρός
  choice: fornalha de fogo
  rationale: A expressão conserva de perto a construção genitiva grega e sua imagem concreta. “Fornalha ardente” seria mais idiomático, mas explicitaria como adjetivo o que o grego apresenta como “de fogo”.
- source_word: ἐκεῖ
  choice: Ali
  rationale: O advérbio indica enfaticamente o lugar mencionado. “Ali” é direto e natural em português, preservando a referência locativa.
- source_word: ἔσται
  choice: haverá
  rationale: A construção existencial portuguesa com “haverá” corresponde naturalmente ao futuro de εἰμί seguido pelos substantivos nominativos.
- source_word: ὁ κλαυθμὸς
  choice: choro
  rationale: κλαυθμός designa choro ou lamentação. “Choro” é claro, corrente e não intensifica indevidamente o termo como poderia ocorrer com “pranto” ou “gritos de lamentação”.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: ranger de dentes
  rationale: “Ranger de dentes” é a formulação portuguesa consagrada e semanticamente adequada para a expressão, mantendo suas associações de angústia e juízo.
theological_decisions:
- issue: Imagens de juízo em contexto escatológico
  choice: Manter as imagens concretas “fornalha de fogo”, “choro” e “ranger de dentes” sem atenuação nem explicação interpretativa.
  alternative: Empregar “fornalha ardente” ou parafrasear a última oração como uma descrição explícita da angústia das pessoas.
  rationale: O texto apresenta imagens severas de juízo na explicação da parábola. Preservá-las mantém a força e a tensão teológica do original sem determinar além do texto a natureza exata dessas imagens.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva o paralelismo solene e a imagem tradicional do texto, evitando tanto arcaísmos quanto expansão interpretativa.
