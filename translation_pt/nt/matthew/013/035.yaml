  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: pt
  text: 'para que se cumprisse o que foi dito por meio do profeta, dizendo:


    “აბrirei a boca em parábolas;

    proferirei coisas ocultas desde a fundação[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “desde a fundação do mundo”.
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: para que se cumprisse
  rationale: Preserva a relação de propósito/resultado e a fórmula de cumprimento característica de Mateus, em português natural.
- source_word: τὸ ῥηθὲν διὰ τοῦ προφήτου
  choice: o que foi dito por meio do profeta
  rationale: Traduz de modo idiomático o particípio substantivado e mantém διά com sentido de mediação.
- source_word: Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου
  choice: Abrirei a boca em parábolas
  rationale: Conserva a imagem poética e o termo mateano “parábolas” sem tornar a expressão artificial em português.
- source_word: ἐρεύξομαι
  choice: proclamarei
  rationale: O verbo sugere fazer sair ou proferir palavras. “Proclamarei” comunica fala pública e solene em português atual, sem a conotação fisiológica que uma tradução estritamente literal poderia adquirir.
- source_word: κεκρυμμένα
  choice: coisas ocultas
  rationale: Mantém o particípio passivo substantivado e seu sentido resultativo, sem interpretar as coisas como “segredos”.
- source_word: ἀπὸ καταβολῆς
  choice: desde a fundação
  rationale: Segue o texto crítico apresentado, que não contém κόσμου (“do mundo”), e preserva sua expressão elíptica; a variante mais extensa é registrada em nota.
theological_decisions:
- issue: Identificação do profeta na fórmula de citação
  choice: por meio do profeta
  alternative: por meio de Asafe, o profeta
  rationale: O texto grego fornecido diz apenas “do profeta”. A tradução não acrescenta uma identificação ausente nem harmoniza a fórmula.
- issue: Extensão da expressão temporal ἀπὸ καταβολῆς
  choice: desde a fundação
  alternative: desde a fundação do mundo
  rationale: O SBLGNT fornecido não traz κόσμου (“do mundo”). A leitura expandida, conhecida de outros manuscritos e traduções, fica na nota para não eliminar a variante textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A citação foi disposta poeticamente. “Proclamarei” evita uma formulação arcaica ou de sentido fisiológico, enquanto “desde a fundação” conserva deliberadamente a elipse do texto crítico.
