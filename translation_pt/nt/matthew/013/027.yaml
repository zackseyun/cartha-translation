  text: προσελθόντες δὲ οἱ δοῦλοι τοῦ οἰκοδεσπότου εἶπον αὐτῷ· Κύριε, οὐχὶ καλὸν σπέρμα ⸀ἔσπειρας ἐν τῷ σῷ ἀγρῷ; πόθεν οὖν ἔχει ζιζάνια;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: pt
  text: 'Então os escravos do dono da casa aproximaram-se dele e lhe disseram: “Senhor, não semeaste boa semente no teu campo? De onde, então, vem o joio[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ervas daninhas”; o termo grego provavelmente se refere ao joio, uma erva daninha que, nos primeiros estágios de crescimento, se parece com o trigo.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: se aproximaram
  rationale: O particípio aoristo indica a ação anterior que acompanha o verbo principal; “se aproximaram” expressa naturalmente o movimento em direção ao dono da casa.
- source_word: δοῦλοι
  choice: escravos
  rationale: Preserva de modo transparente a condição social vinculada ao senhor da casa, sem suavizá-la para “servos” ou “empregados”.
- source_word: οἰκοδεσπότου
  choice: dono da casa
  rationale: Expressa com clareza atual a ideia do chefe ou proprietário da casa e mantém sua relação de autoridade sobre os escravos.
- source_word: Κύριε
  choice: Senhor
  rationale: É a forma respeitosa usual de tratamento para κύριος e, neste diálogo parabólico, dirige-se ao dono da casa sem exigir uma afirmação cristológica direta.
- source_word: οὐχὶ καλὸν σπέρμα ἔσπειρας
  choice: não semeaste boa semente
  rationale: Mantém a pergunta que espera resposta afirmativa, bem como o vocabulário agrícola específico de semear.
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: no teu campo
  rationale: Reproduz claramente a posse indicada por σῷ, em registro digno e amplamente compreensível.
- source_word: πόθεν οὖν ἔχει ζιζάνια
  choice: De onde, então, veio o joio
  rationale: Formula em português natural a pergunta sobre a origem das plantas nocivas. “Joio” é a designação tradicional e relativamente específica dessa erva semelhante ao trigo, enquanto a nota preserva a alternativa genérica.
theological_decisions:
- issue: Tradução de δοῦλοι no contexto doméstico da parábola
  choice: escravos
  alternative: servos
  rationale: A relação social de pessoas sujeitas ao dono da casa é relevante no cenário narrativo; “escravos” evita atenuar o sentido do termo grego, sem transformar o versículo em comentário doutrinário sobre a escravidão.
- issue: Tradução do vocativo κύριε
  choice: Senhor
  alternative: Meu senhor; patrão
  rationale: “Senhor” mantém a forma normal de tratamento respeitoso e a possível ressonância do termo, sem impor aqui uma leitura cristológica que o diálogo parabólico, por si só, não explicita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas de segunda pessoa coerentes (“semeaste”, “teu”). A ordem e a progressão do grego foram preservadas sem produzir uma pergunta final artificial em português.
