source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: pt
  text: O reino dos céus é como um tesouro escondido num campo, que um homem encontrou e tornou a esconder; e, por causa da sua alegria, vai, vende tudo o que tem e compra aquele campo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμοία ἐστὶν
  choice: é como
  rationale: Fórmula comparativa natural em português, que preserva o caráter de símile da parábola.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: o reino dos céus
  rationale: Expressão consagrada e natural em português para a fórmula característica de Mateus, preservando βασιλεία e o plural formal de οὐρανῶν.
- source_word: θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: um tesouro escondido num campo
  rationale: O dativo anartro após a fórmula comparativa favorece a apresentação indefinida; o particípio perfeito passivo descreve o estado contínuo do tesouro como escondido.
- source_word: ὃν εὑρὼν ἄνθρωπος
  choice: que um homem encontrou
  rationale: Reordenação idiomática em português que mantém 'tesouro' como antecedente e traduz o substantivo masculino singular ἄνθρωπος sem neutralização desnecessária.
- source_word: ἔκρυψεν
  choice: tornou a esconder
  rationale: O tesouro já estava escondido quando foi encontrado; esta formulação natural explicita que o homem o escondeu novamente, sentido contextual do aoristo.
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: por causa de sua alegria
  rationale: Torna clara a força causal da preposição ἀπό neste contexto, sem reduzir a alegria a mero estado emocional concomitante.
- source_word: ὑπάγει καὶ πωλεῖ πάντα ὅσα ἔχει
  choice: ele vai, vende tudo o que tem
  rationale: Preserva os presentes narrativos vívidos e a abrangência de πάντα ὅσα ἔχει em português corrente.
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: compra aquele campo
  rationale: Mantém a linguagem comercial simples e traduz o demonstrativo ἐκεῖνον, destacando o campo específico.
theological_decisions:
- issue: Sentido de βασιλεία
  choice: reino
  alternative: reinado
  rationale: βασιλεία pode designar tanto o domínio quanto o exercício de governar. 'Reino' é natural nesta comparação e conserva a amplitude tradicional do termo sem excluir a ideia dinâmica do governo de Deus.
- issue: Referência de ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: a alegria do homem motiva a venda de tudo e a compra do campo
  alternative: a alegria estaria ligada apenas ao ato de esconder novamente o tesouro
  rationale: A posição e a sequência sintática ligam naturalmente a expressão causal aos verbos seguintes; a tradução conserva essa relação sem acrescentar uma interpretação alegórica.
- issue: Gênero de ἄνθρωπος
  choice: um homem
  alternative: uma pessoa
  rationale: O referente narrativo está no masculino singular; 'um homem' preserva essa forma e continua funcionando como personagem representativo da parábola.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'num' como contração corrente de 'em um' e mantém a expressão bíblica reconhecível 'reino dos céus'. A pontuação esclarece a progressão narrativa sem fragmentar o versículo.
