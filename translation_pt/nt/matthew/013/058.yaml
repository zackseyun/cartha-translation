  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐποίησεν ἐκεῖ δυνάμεις πολλὰς διὰ τὴν ἀπιστίαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/058.yaml
  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: pt
  text: E não fez ali muitos atos poderosos, por causa da incredulidade deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “muitos milagres” ou “muitas obras de poder”. O termo grego se refere a atos de poder e, neste contexto, indica obras milagrosas.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: E não fez
  rationale: καί dá continuidade à narrativa, οὐκ nega o verbo no aoristo, e ποιέω significa de modo amplo “fazer”. A formulação preserva a afirmação de que ele não realizou tais atos, sem transformá-la em incapacidade.
- source_word: ἐκεῖ
  choice: ali
  rationale: Advérbio de lugar que remete à localidade mencionada no contexto; “ali” é natural em português narrativo.
- source_word: δυνάμεις πολλὰς
  choice: muitos atos poderosos
  rationale: δύναμις, neste contexto dos Evangelhos, designa manifestações ou feitos de poder. “Atos poderosos” mantém a ligação lexical com poder, enquanto “muitos” traduz πολλὰς.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: por causa da incredulidade deles
  rationale: διά com acusativo indica causa. ἀπιστία expressa incredulidade ou falta de fé; “incredulidade” conserva diretamente a força negativa do substantivo no contexto da rejeição.
theological_decisions:
- issue: Se o versículo afirma incapacidade ou simplesmente a não realização de muitos atos poderosos diante da incredulidade
  choice: “não fez ali muitos atos poderosos”
  alternative: “não pôde fazer ali muitos milagres”
  rationale: O grego traz οὐκ ἐποίησεν (“não fez”), e não uma expressão de incapacidade. A tradução mantém a afirmação no nível da ação e não acrescenta uma conclusão teológica mais forte do que a formulada por Mateus.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Atos poderosos” preserva o campo semântico de δύναμις sem recorrer de imediato ao termo mais interpretativo “milagres”.
