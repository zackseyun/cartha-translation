id: MAT.13.13
reference: Matthew 13:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: pt
  text: Por isso lhes falo em parábolas, porque, vendo, não veem; e, ouvindo, não ouvem nem entendem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural e direto a relação causal introduzida pela locução grega, sem reforçá-la indevidamente como uma conclusão lógica.
- source_word: ἐν παραβολαῖς
  choice: por meio de parábolas
  rationale: Indica com clareza o modo pelo qual Jesus fala; é uma formulação corrente em português e preserva o valor instrumental ou modal de ἐν com o dativo.
- source_word: αὐτοῖς λαλῶ
  choice: lhes falo
  rationale: Reproduz de forma concisa o pronome dativo e o presente do verbo, em ordem natural no português moderno.
- source_word: ὅτι
  choice: porque
  rationale: Mantém o sentido causal pelo qual a oração seguinte explica a razão de Jesus falar por parábolas.
- source_word: βλέποντες οὐ βλέπουσιν
  choice: vendo, não veem
  rationale: Preserva formalmente o paralelismo paradoxal do grego sem explicitar como concessiva uma relação que permanece implícita no texto-fonte.
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: ouvindo, não ouvem
  rationale: Conserva a construção e o paralelismo da oração anterior, distinguindo o ato exterior da percepção efetiva sem acrescentar uma interpretação.
- source_word: οὐδὲ συνίουσιν
  choice: nem entendem
  rationale: Dá continuidade à série negativa e traduz συνίημι pelo verbo português mais claro para apreender o sentido ou significado.
theological_decisions:
- issue: Força dos particípios βλέποντες e ἀκούοντες
  choice: Mantidos formalmente como “vendo” e “ouvindo”
  alternative: 'Explicitar a concessão: “embora vejam” e “embora ouçam”'
  rationale: A leitura concessiva é plausível no contexto, mas não está marcada lexicalmente. A formulação escolhida conserva tanto o paradoxo quanto a ambiguidade sintática do grego, sem resolver a tensão entre percepção exterior e compreensão.
- issue: Sentido de συνίουσιν no contexto
  choice: “entendem”
  alternative: “compreendem” ou “percebem”
  rationale: “Entendem” comunica de maneira acessível a falta de apreensão do significado, sem introduzir uma afirmação doutrinária adicional sobre a causa ou a culpabilidade dessa falta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação destaca o paralelismo sem alterar a relação causal do período. Não foram necessárias notas de rodapé.
