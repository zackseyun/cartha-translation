source:
  edition: SBLGNT
  text: καὶ ἐν τῷ σπείρειν αὐτὸν ἃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ⸂ἐλθόντα τὰ πετεινὰ⸃ κατέφαγεν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/004.yaml
  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: pt
  text: Enquanto ele semeava[a], algumas sementes caíram à beira do caminho, e as aves vieram e as devoraram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “algumas coisas caíram à beira do caminho”; “sementes” é acrescentado com base no contexto do semeador.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: Enquanto ele semeava
  rationale: A construção ἐν com infinitivo articular expressa simultaneidade temporal. “Enquanto ele semeava” é natural em português e preserva o aspecto durativo da ação.
- source_word: ἃ μὲν
  choice: algumas sementes
  rationale: O pronome relativo neutro plural significa literalmente “algumas coisas”, mas retoma contextualmente aquilo que o semeador espalhava. “Sementes” explicita de modo natural o referente implícito.
- source_word: ἔπεσεν
  choice: caíram
  rationale: O aoristo narrativo é adequadamente expresso pelo pretérito perfeito. O plural segue o referente explicitado “algumas sementes”, embora o verbo grego esteja formalmente no singular.
- source_word: παρὰ τὴν ὁδόν
  choice: à beira do caminho
  rationale: παρά com acusativo indica aqui uma posição junto ao caminho. “À beira do caminho” é idiomático e mantém a imagem agrícola sem recorrer a linguagem arcaica.
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: as aves vieram
  rationale: O particípio aoristo adverbial é vertido naturalmente como verbo finito em sequência. πετεινά designa aves ou criaturas voadoras; “aves” é preciso e não acrescenta “do céu”, ausente neste versículo.
- source_word: κατέφαγεν
  choice: devoraram
  rationale: κατεσθίω comunica a ideia intensificada de comer por completo. “Devoraram” preserva essa força e soa natural no contexto.
- source_word: αὐτά
  choice: as
  rationale: O pronome retoma as sementes caídas. O pronome oblíquo feminino plural evita repetição desnecessária e corresponde ao referente explicitado em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “À beira do caminho” preserva a relação espacial do grego; “aves” evita importar de passagens paralelas a expressão “do céu”.
