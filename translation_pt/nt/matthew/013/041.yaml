  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: pt
  text: O Filho do Homem enviará os seus anjos, e eles recolherão do seu reino tudo o que leva ao pecado[a] e os que praticam a iniquidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «todos os motivos de tropeço». O termo grego pode indicar pessoas, coisas ou influências que levam alguém a pecar ou a abandonar a fé.
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir por «os que cometem a iniquidade». A expressão sugere uma conduta contínua ou característica.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: enviará
  rationale: O futuro de ἀποστέλλω indica o envio dos anjos como agentes do Filho do Homem; «enviará» é natural e preserva esse sentido sem acrescentar uma ideia ausente do texto.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: O Filho do Homem
  rationale: Mantém o título tradicional, sua forma semítica e sua ressonância com a figura de Daniel 7.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: os seus anjos
  rationale: Neste cenário escatológico de juízo, ἄγγελοι designa seres celestiais, não mensageiros humanos.
- source_word: συλλέξουσιν ἐκ
  choice: retirarão de
  rationale: συλλέγω significa reunir ou recolher, enquanto ἐκ salienta a remoção de dentro do reino. No conjunto da frase, «retirarão de» comunica naturalmente ambos os aspectos em português.
- source_word: πάντα τὰ σκάνδαλα
  choice: tudo o que leva ao pecado
  rationale: σκάνδαλα pode abranger pessoas, coisas ou influências que fazem outros pecar ou abandonar a fé. A formulação evita reduzir o termo a uma ofensa emocional e preserva sua amplitude.
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: os que praticam a iniquidade
  rationale: O particípio presente sugere conduta contínua ou característica. «Praticam» expressa esse aspecto, e «iniquidade» conserva a noção moral e teológica de ἀνομία.
theological_decisions:
- issue: Sentido titular de ὁ υἱὸς τοῦ ἀνθρώπου
  choice: O Filho do Homem
  alternative: O Ser Humano
  rationale: A tradução tradicional preserva tanto a autodesignação de Jesus em Mateus quanto a provável alusão apocalíptica a Daniel 7, sem decidir além do texto a natureza exata dessa relação.
- issue: Alcance de πάντα τὰ σκάνδαλα
  choice: tudo o que leva ao pecado
  alternative: todos os motivos de tropeço
  rationale: O neutro plural pode referir-se amplamente a pessoas, influências ou coisas que induzem à queda. A escolha mantém essa abertura, sem restringir o juízo apenas a indivíduos nem apenas a objetos.
- issue: Força moral de ἀνομία
  choice: iniquidade
  alternative: desrespeito à lei
  rationale: «Iniquidade» conserva o peso moral do termo sem explicitar qual lei está em vista, questão que o versículo não resolve por si só.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem direta foi preferida. «Retirarão do seu reino» comunica de modo idiomático a remoção expressa por συλλέξουσιν ἐκ; «iniquidade» mantém o registro bíblico sem tornar a frase arcaica.
