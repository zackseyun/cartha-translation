source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: pt
  text: e os lançarão na fornalha de fogo. Ali haverá choro e ranger de dentes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαλοῦσιν
  choice: lançarão
  rationale: O futuro ativo de βάλλω expressa a ação de lançar ou jogar. “Lançarão” conserva a força da expulsão e se ajusta ao registro bíblico digno sem ser obscuro.
- source_word: αὐτούς
  choice: os
  rationale: O pronome acusativo plural retoma diretamente o grupo mencionado no contexto anterior, sem necessidade de repetir o referente.
- source_word: κάμινον τοῦ πυρός
  choice: fornalha de fogo
  rationale: Mantém de perto a construção genitiva grega e a imagem concreta de uma fornalha associada ao fogo, em formulação natural e reconhecível em português.
- source_word: ἐκεῖ
  choice: Ali
  rationale: Preserva de maneira concisa a referência locativa ao lugar que acaba de ser mencionado.
- source_word: κλαυθμός
  choice: choro
  rationale: “Choro” é uma tradução clara e corrente, adequada à fórmula recorrente em Mateus, sem intensificá-la necessariamente como “lamento” ou “pranto”.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: ranger de dentes
  rationale: Expressão portuguesa tradicional, natural e semanticamente fiel ao idioma grego, sem restringir a angústia retratada apenas à tristeza ou à ira.
- source_word: καὶ
  choice: e
  rationale: Mantém o conectivo inicial e a continuidade com a declaração precedente.
theological_decisions:
- issue: Natureza da imagem de juízo em “fornalha de fogo”
  choice: Conservar a metáfora concreta do juízo escatológico sem atenuá-la nem defini-la além do texto.
  alternative: Parafrasear como “fogo do inferno” ou ampliar para “fornalha ardente”.
  rationale: O grego apresenta uma imagem vívida, mas não emprega aqui terminologia doutrinária posterior. A tradução preserva sua severidade e sua abertura metafórica.
- issue: Sentido de “choro e ranger de dentes”
  choice: Preservar integralmente a fórmula mateana como expressão de angústia sob juízo.
  alternative: Interpretar o ranger de dentes exclusivamente como raiva ou toda a expressão exclusivamente como tristeza.
  rationale: A expressão pode envolver sofrimento, pesar e possível hostilidade; a tradução não resolve essa tensão além do que o texto permite.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A formulação é concisa e digna; “fornalha de fogo” mantém proximidade formal com o grego, enquanto “Ali haverá” reproduz naturalmente a ênfase locativa. Não são necessárias notas de rodapé, pois as alternativas não afetam de modo substancial a compreensão do versículo.
