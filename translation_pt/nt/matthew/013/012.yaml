id: MAT.13.12
reference: Matthew 13:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: pt
  text: Pois a quem tem[a] será dado, e abundará; mas a quem não tem, até o que tem lhe será tirado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego não especifica o que a pessoa “tem” nem o que lhe será dado; no contexto, a expressão se relaciona à receptividade ao ensino de Jesus.
    reason: ambiguity_note
lexical_decisions:
- source_word: ὅστις
  choice: a quem / quem
  rationale: O pronome relativo indefinido introduz um princípio geral. “Quem” é natural em português, mantém o sentido distributivo e não restringe a afirmação a um grupo específico.
- source_word: γὰρ
  choice: Pois
  rationale: Preserva a função explicativa que liga este versículo à declaração anterior.
- source_word: ἔχει
  choice: tem
  rationale: Tradução direta do verbo de posse; o objeto permanece implícito, como no grego.
- source_word: δοθήσεται αὐτῷ
  choice: a quem tem, será dado
  rationale: Mantém a voz passiva e o destinatário. Não se acrescenta “mais”, pois isso está implícito no contexto, mas não aparece expresso no texto grego.
- source_word: περισσευθήσεται
  choice: terá em abundância
  rationale: Expressa em português corrente o estado resultante de abundar, sem tornar a frase excessivamente literal.
- source_word: δὲ
  choice: mas
  rationale: Marca claramente o contraste entre as duas partes do princípio.
- source_word: καὶ ὃ ἔχει
  choice: até o que tem
  rationale: “Até” comunica o valor intensificador de καί e ressalta o caráter paradoxal da perda.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: lhe será tirado
  rationale: Reproduz de modo idiomático a voz passiva e a ideia de remoção de algo pertencente à pessoa.
theological_decisions:
- issue: Objeto implícito de “tem” e “será dado”
  choice: O objeto foi deixado sem especificação.
  alternative: Explicitar “entendimento”, “conhecimento”, “receptividade” ou “compreensão dos mistérios do Reino”.
  rationale: Embora o contexto relacione a máxima à recepção do ensino de Jesus e aos mistérios do Reino, o grego não declara o objeto. A tradução preserva essa abertura e a tensão proverbial.
- issue: Masculino singular genérico
  choice: Empregou-se “quem” e o pronome dativo “lhe”.
  alternative: “Aquele que” e “dele”.
  rationale: A construção portuguesa com “quem” preserva a referência singular e genérica do grego sem introduzir pluralização nem tornar o masculino gramatical mais enfático do que o necessário.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe proverbial concisa. “Pois” conserva a ligação explicativa com o contexto; “lhe será tirado” soa natural tanto no Brasil quanto em outras variedades internacionais do português.
