id: MAT.13.16
reference: Matthew 13:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑμῶν δὲ μακάριοι οἱ ὀφθαλμοὶ ὅτι βλέπουσιν, καὶ τὰ ὦτα ὑμῶν ὅτι ⸀ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: pt
  text: Mas felizes são os olhos de vocês, porque veem, e os ouvidos de vocês, porque ouvem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois veem [...] pois ouvem”. A conjunção grega pode ser traduzida das duas maneiras neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Expressa o contraste com os que, nos versículos anteriores, veem e ouvem sem perceber nem compreender.
- source_word: μακάριοι
  choice: felizes
  rationale: Em português corrente, comunica de modo natural a condição favorecida e digna de celebração própria de uma bem-aventurança; aqui não se limita a um sentimento passageiro.
- source_word: οἱ ὀφθαλμοὶ ὑμῶν
  choice: os olhos de vocês
  rationale: Reproduz naturalmente o possessivo e mantém em destaque os olhos dos discípulos.
- source_word: ὅτι βλέπουσιν
  choice: porque veem
  rationale: Entende ὅτι em sentido causal, apresentando a razão pela qual os olhos são chamados felizes, sem ampliar o verbo para 'compreendem'.
- source_word: τὰ ὦτα ὑμῶν
  choice: os ouvidos de vocês
  rationale: Formulação natural e paralela a 'os olhos de vocês'.
- source_word: ὅτι ἀκούουσιν
  choice: porque ouvem
  rationale: Mantém o sentido causal de ὅτι e o verbo sensorial simples, deixando que o contexto comunique sua dimensão mais profunda.
- source_word: βλέπουσιν / ἀκούουσιν
  choice: veem / ouvem
  rationale: Preserva a simplicidade e o paralelismo do grego, sem explicitar como 'percebem' ou 'compreendem' aquilo que o texto deixa implícito.
theological_decisions:
- issue: Se a visão e a audição devem ser explicitamente apresentadas como espirituais
  choice: 'Manter a linguagem sensorial literal: ''veem'' e ''ouvem''.'
  alternative: Traduzir de forma interpretativa como 'percebem' e 'compreendem'.
  rationale: Embora o contexto contraste os discípulos com os que veem e ouvem sem compreender, este versículo usa apenas os verbos 'ver' e 'ouvir'. A tradução conserva essa tensão e permite que o contexto forneça a implicação espiritual.
- issue: Sentido de μακάριοι
  choice: Traduzir como 'felizes', entendendo a palavra como declaração objetiva de condição favorecida.
  alternative: Traduzir como 'abençoados' ou 'bem-aventurados'.
  rationale: '''Felizes'' é claro e idiomático para leitores modernos, sem exigir que a palavra descreva apenas emoção subjetiva; o contexto de declaração solene preserva a ideia de privilégio concedido.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de 'vocês' evita a artificialidade regional de 'vossos' e mantém a referência plural. O paralelismo compacto do grego foi preservado.
