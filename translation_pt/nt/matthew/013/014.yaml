  source_fidelity: A tradução representa adequadamente o presente passivo de ἀναπληροῦται em “se cumpre”, o dativo αὐτοῖς em “neles” e a fórmula de cumprimento profético. A citação mantém a ênfase das duas construções duplicadas e a negação intensiva de οὐ μή mediante “de fato/certamente” e “jamais”. “Perceberão” comunica apropriadamente a distinção contextual entre o ato de ver e a percepção compreensiva, sem impor uma explicação teológica.
  naturalness: O português é moderno, claro e digno. “E neles se cumpre a profecia de Isaías” é natural e suficientemente próximo do grego. O paralelismo de “ouvirão ... entenderão” e “verão ... perceberão” é fluente para leitores brasileiros e internacionais.
