id: MAT.13.14
reference: Matthew 13:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀναπληροῦται αὐτοῖς ἡ προφητεία Ἠσαΐου ἡ λέγουσα· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: pt
  text: 'E neles se cumpre a profecia de Isaías, que diz: “De fato, ouvirão, mas jamais entenderão; e certamente verão, mas jamais perceberão”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “Ouvindo, ouvirão... e, vendo, verão”, uma forma enfática de estilo hebraico reproduzida no grego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: se cumpre
  rationale: O presente passivo é expresso naturalmente em português pela construção pronominal no presente. A formulação preserva a ideia de cumprimento profético sem intensificá-la como “se cumpre plenamente” nem exigir uma forma progressiva pouco natural aqui.
- source_word: αὐτοῖς
  choice: neles
  rationale: O dativo indica que a profecia encontra cumprimento nessas pessoas; “neles” é conciso, natural e mantém essa relação.
- source_word: προφητεία Ἠσαΐου
  choice: a profecia de Isaías
  rationale: Reproduz com naturalidade a relação genitiva do grego.
- source_word: ἡ λέγουσα
  choice: que diz
  rationale: Introduz a citação de modo idiomático e preserva a função do particípio atributivo.
- source_word: Ἀκοῇ ἀκούσετε
  choice: De fato, ouvirão
  rationale: Comunica a ênfase da construção semítica reproduzida no grego sem recorrer a uma duplicação artificial em português. A forma mais literal é registrada na nota.
- source_word: οὐ μὴ συνῆτε
  choice: mas jamais entenderão
  rationale: “Jamais” transmite a negação enfática de οὐ μή; “mas” torna explícito em português o contraste presente na sequência.
- source_word: βλέποντες βλέψετε
  choice: certamente verão
  rationale: Transmite a ênfase da repetição verbal e mantém o paralelismo com a primeira oração em português corrente.
- source_word: οὐ μὴ ἴδητε
  choice: mas jamais perceberão
  rationale: “Perceberão” distingue a percepção interior do simples ato de ver expresso por βλέπω, enquanto “jamais” preserva a força da negação enfática.
theological_decisions:
- issue: Natureza do cumprimento profético
  choice: A profecia “se cumpre” nessas pessoas.
  alternative: A profecia apenas se exemplifica nelas ou se cumpre nelas de maneira exaustiva e definitiva.
  rationale: A tradução mantém a fórmula de cumprimento do texto sem explicar o mecanismo do endurecimento nem impor uma leitura determinista, meramente ilustrativa ou de consumação total.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e vocabulário amplamente compreensível no mundo lusófono. Os verbos sem pronome sujeito evitam regionalizar desnecessariamente a forma de tratamento. A pontuação realça o paralelismo da citação.
