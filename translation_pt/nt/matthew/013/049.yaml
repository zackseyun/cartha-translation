source:
  edition: SBLGNT
  text: οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ αἰῶνος· ἐξελεύσονται οἱ ἄγγελοι καὶ ἀφοριοῦσιν τοὺς πονηροὺς ἐκ μέσου τῶν δικαίων
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: pt
  text: Assim será no fim da era:[a] os anjos sairão e separarão os maus do meio dos justos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na consumação da era”. O grego diz “era” (αἰών), não “mundo”.
    reason: Registra a nuance de συντέλεια e esclarece que αἰών se refere a “era”, não ao mundo físico.
lexical_decisions:
- source_word: οὕτως ἔσται
  choice: Assim será
  rationale: Expressa de modo natural e conciso a conclusão explicativa da parábola e preserva o valor futuro da frase grega.
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: no fim desta era
  rationale: “Fim” comunica com clareza a conclusão ou consumação indicada por συντέλεια; “era” traduz αἰών sem sugerir necessariamente a destruição do mundo físico. O demonstrativo “desta” explicita em português a era presente pressuposta pelo contexto.
- source_word: ἐξελεύσονται
  choice: sairão
  rationale: Equivalente direto e idiomático do futuro de ἐξέρχομαι.
- source_word: οἱ ἄγγελοι
  choice: os anjos
  rationale: No cenário de juízo final, ἄγγελοι designa seres celestiais, não mensageiros humanos.
- source_word: ἀφοριοῦσιν
  choice: separarão
  rationale: Preserva a ação de apartar pessoas que se encontram em um grupo misto.
- source_word: τοὺς πονηροὺς
  choice: os maus
  rationale: Traduz o adjetivo substantivado como uma classe de pessoas moralmente más, em linguagem corrente e digna.
- source_word: ἐκ μέσου τῶν δικαίων
  choice: do meio dos justos
  rationale: Conserva a imagem espacial de retirar os maus de dentro do grupo dos justos, com formulação natural em português.
theological_decisions:
- issue: Sentido de αἰών na expressão escatológica
  choice: era
  alternative: mundo
  rationale: O substantivo grego significa aqui “era” ou “época”, não κόσμος (“mundo”). A tradução evita introduzir uma afirmação sobre a aniquilação do cosmos que o texto não exige.
- issue: Identidade de οἱ ἄγγελοι
  choice: anjos celestiais
  alternative: mensageiros humanos
  rationale: O contexto da explicação escatológica da parábola aponta para agentes celestiais do juízo.
- issue: Valor de συντέλεια
  choice: fim
  alternative: consumação
  rationale: “Fim” é claro para leitores comuns e mantém a referência à conclusão da era; a nota registra “consumação” como alternativa que ressalta o aspecto de culminação.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem da frase acompanha de perto o grego sem produzir construção artificial; “maus” e “justos” preservam o contraste moral substantivado.
