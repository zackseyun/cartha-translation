base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/007.yaml
  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: pt
  text: Outras sementes caíram entre os espinhos[a], e os espinhos cresceram e as sufocaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «caíram sobre os espinhos»; «entre os espinhos» expressa de modo mais natural o contexto agrícola.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: Outras sementes
  rationale: O adjetivo neutro plural é substantivado e retoma implicitamente as sementes mencionadas no contexto. Explicitar “sementes” torna a referência clara e natural em português sem acrescentar conteúdo novo.
- source_word: δὲ
  choice: e
  rationale: Aqui δέ é um conectivo leve que dá continuidade à sequência da parábola, sem indicar contraste forte.
- source_word: ἔπεσεν
  choice: caíram
  rationale: Embora a forma grega esteja no singular por concordar com o neutro plural ἄλλα, em português “Outras sementes” exige o plural. “Caíram” preserva o sentido direto de πίπτω, sem substituí-lo por “foram semeadas”.
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: entre os espinhos
  rationale: Embora ἐπί com acusativo possa ser vertido literalmente por “sobre”, o contexto agrícola indica sementes caindo no meio de vegetação espinhosa; “entre os espinhos” é idiomático e fiel ao sentido contextual.
- source_word: ἀκάνθας / ἄκανθαι
  choice: espinhos
  rationale: “Espinhos” é a designação tradicional, clara e abrangente para as plantas espinhosas presentes no terreno e que depois cresceram.
- source_word: ἀνέβησαν
  choice: cresceram
  rationale: No contexto vegetal, ἀναβαίνω descreve os espinhos que brotam ou sobem. “Cresceram” comunica naturalmente esse desenvolvimento em português.
- source_word: ἔπνιξαν
  choice: sufocaram
  rationale: πνίγω significa sufocar ou estrangular. “Sufocaram” preserva a metáfora agrícola vívida e é corrente em português.
- source_word: αὐτά
  choice: as
  rationale: O pronome neutro plural retoma as sementes; em português, o pronome feminino plural concorda com “sementes”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. A repetição de “os espinhos” preserva a estrutura e a ênfase do grego.
