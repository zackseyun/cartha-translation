  text: He answered[a], “The one who sows the good seed is the Son of Man.”
translation:
  language: pt
  text: 'Ele respondeu: “Quem semeia a boa semente é o Filho do Homem[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Ser Humano”. O título grego “Filho do Homem” remete a Daniel 7 e é mantido aqui por sua ressonância estabelecida nos Evangelhos e na teologia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ele respondeu
  rationale: A combinação do particípio ἀποκριθείς com o verbo finito εἶπεν forma uma introdução idiomática de resposta. “Ele respondeu” comunica naturalmente a função discursiva sem reproduzir a redundância formal “respondendo, disse”.
- source_word: Ὁ σπείρων
  choice: Quem semeia
  rationale: O particípio presente substantivado identifica a pessoa por sua ação. “Quem semeia” é corrente em português e preserva o valor verbal da expressão.
- source_word: τὸ καλὸν σπέρμα
  choice: a boa semente
  rationale: Neste contexto, καλός qualifica a semente como boa, apropriada ou de boa qualidade. O singular coletivo do grego é preservado naturalmente em português.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: A formulação consagrada preserva o título usado por Jesus nos Evangelhos e sua ressonância com Daniel 7, sem reduzi-lo a uma simples designação genérica de humanidade.
theological_decisions:
- issue: Tradução do título cristológico υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  alternative: o Ser Humano
  rationale: “Filho do Homem” conserva a forma tradicional, as conexões canônicas e as possíveis conotações apocalípticas e messiânicas. A alternativa pode tornar a dimensão humana mais transparente, mas tende a enfraquecer o caráter titular e a intertextualidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A introdução da fala é idiomática; o título cristológico tradicional é mantido e sua alternativa é registrada em nota.
