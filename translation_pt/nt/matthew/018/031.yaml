  text: ἰδόντες ⸀οὖν οἱ σύνδουλοι αὐτοῦ τὰ γενόμενα ἐλυπήθησαν σφόδρα, καὶ ἐλθόντες διεσάφησαν τῷ κυρίῳ ἑαυτῶν πάντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow slaves saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
translation:
  language: pt
  text: Então, quando seus companheiros escravos[a] viram o que havia acontecido, ficaram profundamente entristecidos. Foram até o senhor deles[b] e lhe relataram tudo o que havia acontecido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “seus companheiros escravos”; isto é, outros escravos do mesmo senhor. Também se pode traduzir por “seus conservos”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “dono deles” ou “mestre deles”. A palavra grega κύριος pode designar um senhor, dono ou mestre, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a progressão narrativa e a consequência do episódio anterior de modo natural em português, sem tornar a inferência mais explícita do que o contexto exige.
- source_word: σύνδουλοι
  choice: os escravos que serviam com ele
  rationale: Expressa de forma clara e atual que eram escravos sob o mesmo senhor. Evita o termo pouco corrente “conservos”, sem atenuar a condição servil indicada pelo composto grego.
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: o que havia acontecido / tudo o que havia acontecido
  rationale: Reproduz idiomaticamente o particípio substantivado e preserva, na segunda ocorrência, a intensificação introduzida por πάντα.
- source_word: ἐλυπήθησαν σφόδρα
  choice: ficaram profundamente entristecidos
  rationale: Comunica a forte tristeza ou aflição expressa por λυπέω e intensificada por σφόδρα.
- source_word: ἐλθόντες
  choice: Foram até
  rationale: Converte o particípio de ação anterior em uma sequência narrativa natural em português e explicita apenas o movimento contextual em direção ao senhor.
- source_word: διεσάφησαν
  choice: lhe relataram
  rationale: O verbo indica comunicar ou expor com clareza e detalhe; “relataram”, junto de “tudo”, transmite adequadamente essa força sem redundância.
- source_word: τῷ κυρίῳ ἑαυτῶν
  choice: ao senhor deles
  rationale: “Senhor” corresponde a κύριος e, em minúscula, identifica claramente o superior humano da parábola; “deles” preserva o reflexivo possessivo.
theological_decisions:
- issue: Tradução do termo da família de δοῦλος em um contexto social parabólico
  choice: os escravos que serviam com ele
  alternative: seus conservos; seus companheiros de serviço
  rationale: A condição de escravidão sob o mesmo senhor participa da lógica da parábola. A tradução mantém essa condição sem recorrer a um termo eufemístico ou pouco compreensível.
- issue: Tradução de κύριος para um superior humano
  choice: senhor
  alternative: dono; mestre
  rationale: “Senhor” preserva a correspondência lexical com κύριος e funciona naturalmente para o personagem humano da parábola, sem sugerir aqui uma referência divina direta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A estrutura foi dividida em duas frases para preservar a sequência narrativa sem reproduzir de modo rígido a longa coordenação grega. Os termos “escravos” e “senhor” mantêm a relação social central da parábola.
