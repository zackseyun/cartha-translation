id: MAT.18.7
reference: Matthew 18:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων· ἀνάγκη ⸀γὰρ ἐλθεῖν τὰ σκάνδαλα, πλὴν οὐαὶ τῷ ⸀ἀνθρώπῳ δι’ οὗ τὸ σκάνδαλον ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: pt
  text: Ai do mundo por causa das pedras de tropeço[a]! Pois é necessário que venham as pedras de tropeço; mas ai do homem por meio de quem vem a pedra de tropeço!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofensas”, “causas de pecado” ou “armadilhas”. O termo grego σκάνδαλον refere-se a algo que leva uma pessoa a tropeçar, seja por ofensa, sedução ou ocasião de pecado.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: Ai de
  rationale: Preserva a força profética e judicial de denúncia e mantém a repetição retórica nas duas ocorrências.
- source_word: κόσμῳ
  choice: mundo
  rationale: Refere-se amplamente ao mundo humano; a formulação natural em português mantém essa abrangência sem restringi-la à criação física.
- source_word: ἀπὸ
  choice: por causa de
  rationale: Neste contexto, exprime causa ou motivo do ai pronunciado sobre o mundo.
- source_word: σκάνδαλα / σκάνδαλον
  choice: pedras de tropeço / pedra de tropeço
  rationale: 'Preserva a metáfora do grego e sua amplitude: aquilo que leva alguém a tropeçar, incluindo ofensa, sedução ou ocasião de pecado. Mantém também a distinção entre plural e singular.'
- source_word: ἀνάγκη
  choice: é necessário
  rationale: Mantém a afirmação impessoal de necessidade sem definir se sua base é lógica, providencial ou circunstancial.
- source_word: γάρ
  choice: pois
  rationale: Introduz naturalmente a explicação da declaração anterior.
- source_word: ἐλθεῖν ... ἔρχεται
  choice: venham ... vem
  rationale: Conserva a repetição verbal e a imagem dinâmica do original.
- source_word: πλήν
  choice: mas
  rationale: Marca com clareza a forte transição adversativa entre a inevitabilidade das pedras de tropeço e a responsabilidade do agente.
- source_word: ἀνθρώπῳ
  choice: homem
  rationale: Mantém o masculino singular gramatical do texto grego, empregado aqui de forma representativa.
- source_word: δι’ οὗ
  choice: por meio de quem
  rationale: Expressa a pessoa como meio ou agente pelo qual surge a pedra de tropeço.
theological_decisions:
- issue: Natureza da necessidade em ἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα
  choice: Afirma-se que é necessário que as pedras de tropeço venham, sem especificar a causa dessa necessidade.
  alternative: “É inevitável que venham”, enfatizando a inevitabilidade prática, ou “têm de vir”, potencialmente sugerindo com mais força um decreto divino.
  rationale: O grego declara necessidade, mas não explica seu fundamento. A tradução preserva essa tensão e não atribui explicitamente a Deus a causalidade.
- issue: Força representativa de ἀνθρώπῳ
  choice: O texto principal conserva “homem”, com sentido representativo.
  alternative: “Pessoa” ou “aquele”.
  rationale: O substantivo grego está no masculino singular, embora a advertência se aplique genericamente a qualquer indivíduo por meio de quem venha a pedra de tropeço.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Ai de” conserva o tom solene e profético; “pedra de tropeço” preserva a metáfora tradicional sem eliminar sua amplitude semântica. A pontuação destaca as duas declarações de denúncia.
