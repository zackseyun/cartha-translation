id: MAT.18.35
reference: Matthew 18:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: pt
  text: Assim também meu Pai celestial fará com vocês, se cada um não perdoar de coração ao seu irmão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seu irmão” traduz o masculino singular grego; no contexto, a expressão representa cada irmão ou irmã na fé.
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Assim também
  rationale: Introduz a aplicação da parábola anterior, preservando de modo natural a força comparativa e inferencial.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: meu Pai celestial
  rationale: Mantém a posse expressa por «meu» e o adjetivo οὐράνιος em formulação corrente e digna.
- source_word: ποιήσει ὑμῖν
  choice: fará com vocês
  rationale: Preserva a formulação ampla de ποιέω e sua referência ao que o senhor da parábola fez, sem explicitar além do texto a natureza do juízo.
- source_word: ἐὰν μὴ
  choice: se ... não
  rationale: Reproduz de forma transparente a condição negativa.
- source_word: ἀφῆτε
  choice: perdoar
  rationale: No contexto de ofensa interpessoal e da imagem de dívida, ἀφίημι tem o sentido claro de perdoar.
- source_word: ἕκαστος
  choice: cada um
  rationale: Conserva o singular distributivo, aplicando a exigência individualmente aos ouvintes.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: ao seu irmão
  rationale: Mantém o masculino singular do grego; a função representativa no contexto é esclarecida em nota.
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: de coração
  rationale: É a expressão idiomática natural em português para a sinceridade interior indicada pelo grego plural «dos corações de vocês», sem acrescentar intensidade não expressa.
theological_decisions:
- issue: Alcance e força da advertência
  choice: Advertência direta de que o Pai agirá de modo correspondente ao senhor da parábola
  alternative: Suavizar como «tratará vocês dessa maneira» ou especificar condenação eterna/perda de recompensas
  rationale: O versículo apresenta uma condição solene e remete ao juízo narrado, mas não define aqui sua categoria sistemático-teológica; a tradução mantém a gravidade sem resolver a tensão.
- issue: Linguagem masculina em ἀδελφῷ
  choice: ao seu irmão
  alternative: ao seu irmão ou à sua irmã; ao próximo; a outro discípulo
  rationale: O substantivo grego está no masculino singular. A tradução o preserva e registra em nota seu uso representativo no contexto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Vocês» comunica naturalmente o plural ὑμῖν/ὑμῶν. «De coração» evita a construção pouco idiomática «dos seus corações», preservando o sentido de perdão interior e sincero.
