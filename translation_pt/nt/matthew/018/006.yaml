id: MAT.18.6
reference: Matthew 18:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: pt
  text: Mas quem fizer tropeçar[a] um destes pequeninos que creem em mim, seria melhor para ele que uma pedra de moinho movida por um jumento[b] lhe fosse pendurada ao pescoço e que ele fosse afogado em alto-mar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fizer pecar um destes pequeninos que creem em mim”. O verbo grego pode significar levar alguém a tropeçar, pecar ou cair da fé.
    reason: lexical_alternative
  - marker: b
    text: Isto é, uma grande pedra de moinho girada por um jumento, e não a pequena pedra de moinho manual.
    reason: cultural_note
  - marker: c
    text: Ou “nas profundezas do mar”. O grego se refere mais especificamente ao mar aberto.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: fizer tropeçar
  rationale: 'Preserva a metáfora do grego e sua amplitude: levar alguém ao pecado, à queda espiritual ou ao afastamento, sem restringir antecipadamente o sentido.'
- source_word: μικρῶν τούτων
  choice: destes pequeninos
  rationale: Mantém a expressão aberta tanto à criança presente no contexto quanto aos discípulos humildes ou vulneráveis, sem limitar o referente apenas pela idade.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: que creem em mim
  rationale: É uma tradução direta, natural e corrente da construção grega, identificando os pequeninos como pessoas que depositam fé em Jesus.
- source_word: συμφέρει αὐτῷ
  choice: seria melhor para ele
  rationale: Expressa idiomaticamente a vantagem comparativa da terrível hipótese apresentada no aviso.
- source_word: μύλος ὀνικὸς
  choice: uma pedra de moinho movida por jumento
  rationale: Explicita que se trata da grande pedra de moinho acionada por um animal, não da pequena pedra de moinho manual.
- source_word: εἰς τὸν τράχηλον αὐτοῦ
  choice: ao pescoço
  rationale: Formulação portuguesa natural para o ato de pendurar a pedra no pescoço da pessoa.
- source_word: καταποντισθῇ
  choice: fosse afogado
  rationale: Comunica com clareza o resultado de ser submerso nas águas profundas.
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  choice: em alto-mar
  rationale: πέλαγος designa a extensão aberta e profunda do mar, longe da costa; “alto-mar” é preciso e idiomático.
theological_decisions:
- issue: Alcance de “pequeninos”
  choice: Manter “destes pequeninos que creem em mim”, sem restringir a expressão somente a crianças.
  alternative: “destas criancinhas que creem em mim”
  rationale: Embora o contexto imediato apresente uma criança, a qualificação “que creem em mim” permite uma referência mais ampla a discípulos humildes ou vulneráveis. A tradução conserva essa tensão.
- issue: Alcance de σκανδαλίζω
  choice: Usar a metáfora “fizer tropeçar”.
  alternative: “fizer pecar”
  rationale: O verbo pode envolver induzir ao pecado, provocar queda espiritual ou levar ao afastamento. A opção metafórica preserva essa amplitude em vez de fixar apenas uma consequência.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Pequeninos” conserva a linguagem figurada tradicional sem restringi-la a crianças; “alto-mar” comunica de modo corrente a imagem do mar aberto.
