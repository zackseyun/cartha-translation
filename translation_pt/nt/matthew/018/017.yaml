id: MAT.18.17
reference: Matthew 18:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: pt
  text: Mas, se ele se recusar a ouvi-los, conte o caso à assembleia.[a] E, se também se recusar a ouvir a assembleia, seja ele para você como o gentio e o cobrador de impostos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “à igreja” ou “à congregação” (grego: ekklēsia).'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  choice: se recusar a ouvir
  rationale: No contexto de correção comunitária, o verbo indica não apenas deixar de ouvir, mas recusar-se a dar ouvidos; a formulação preserva essa nuance volitiva sem intensificá-la para “desobedecer”.
- source_word: εἰπὸν τῇ ἐκκλησίᾳ
  choice: conte o caso à assembleia
  rationale: O imperativo pede que a questão seja comunicada à comunidade. “O caso” explicita de modo mínimo o objeto implícito no contexto e soa natural em português.
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: assembleia
  rationale: “Assembleia” conserva o sentido de comunidade reunida e evita impor ao texto conotações institucionais posteriores; as alternativas tradicionais são registradas em nota.
- source_word: ἔστω σοι
  choice: seja ele para você
  rationale: Mantém a força imperativa e o dativo singular σοι, sem transformar a expressão em uma ordem mais explícita de tratamento.
- source_word: ὥσπερ
  choice: como
  rationale: Reproduz diretamente a comparação do grego.
- source_word: ὁ ἐθνικός
  choice: o gentio
  rationale: No contexto judaico, designa representativamente quem está fora da comunidade da aliança; o artigo é preservado como categoria típica.
- source_word: ὁ τελώνης
  choice: o cobrador de impostos
  rationale: Equivalente atual e claro de τελώνης, mantendo o artigo e a categoria representativa.
theological_decisions:
- issue: Tradução de ἐκκλησία no contexto disciplinar de Mateus
  choice: assembleia
  alternative: igreja; congregação
  rationale: A opção principal preserva o sentido básico de comunidade reunida sem introduzir uma forma eclesiástica denominacional; as traduções tradicionais continuam disponíveis em nota.
- issue: Força de considerar o impenitente alguém de fora
  choice: seja ele para você como o gentio e o cobrador de impostos
  alternative: trate-o como gentio e cobrador de impostos; considere-o alguém de fora
  rationale: A redação conserva o símile e a formulação aberta do original, sem convertê-los em um procedimento eclesiástico mais desenvolvido do que o próprio versículo declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Dar ouvidos” seria idiomático, mas “ouvir” mantém a repetição e maior proximidade lexical. O singular “você” reflete σοι e evita a ambiguidade regional de “tu”.
