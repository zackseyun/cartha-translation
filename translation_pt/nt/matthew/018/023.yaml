id: MAT.18.23
reference: Matthew 18:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his slaves[a][b].
translation:
  language: pt
  text: Por isso, o reino dos céus foi comparado a um rei que quis acertar contas com os seus escravos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «servos» ou «servos vinculados»; o grego δοῦλοι designa escravos e enfatiza sua condição de sujeição ao rei.
    reason: alternative_reading
  - marker: b
    text: Ou «tornou-se semelhante a». Literalmente, «foi assemelhado a».
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural a relação inferencial e causal com o ensino anterior.
- source_word: ὡμοιώθη
  choice: foi comparado a
  rationale: Preserva a forma passiva do aoristo de ὁμοιόω e introduz com clareza a comparação; evita a formulação pouco natural «tornou-se semelhante».
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: o reino dos céus
  rationale: Mantém a expressão característica de Mateus em sua forma portuguesa consagrada e inteligível.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: a um rei
  rationale: βασιλεῖ especifica ἀνθρώπῳ; em português, «um rei» transmite naturalmente o sentido sem a redundância de «um homem, um rei».
- source_word: ἠθέλησεν
  choice: quis
  rationale: Comunica diretamente a vontade ou intenção expressa por θέλω e se ajusta ao registro narrativo.
- source_word: συνᾶραι λόγον
  choice: acertar contas
  rationale: Equivalente idiomático português para a prestação e liquidação de contas no contexto econômico e judicial da parábola.
- source_word: μετὰ τῶν δούλων αὐτοῦ
  choice: com os seus escravos
  rationale: Torna explícita a condição vinculada e subordinada indicada por δοῦλοι no contexto da autoridade absoluta do rei, sem suavizá-la para «servos».
theological_decisions:
- issue: Tradução de δοῦλοι no contexto régio e econômico da parábola
  choice: escravos
  alternative: servos ou servos vinculados
  rationale: A autoridade do rei, a dívida e o poder exercido sobre essas pessoas tornam relevante a condição de escravidão. A nota registra alternativas possíveis sem apagar a força social do termo grego.
- issue: Forma da comparação do reino
  choice: foi comparado a
  alternative: tornou-se semelhante a; é semelhante a
  rationale: A escolha conserva a voz passiva de ὡμοιώθη. A nota preserva alternativas lexicais sem transformar a expressão simplesmente em uma cópula atemporal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Acertar contas» é idiomático e claro; «escravos» preserva a realidade social do termo grego. Os marcadores aparecem no texto na ordem correspondente às notas.
