  text: Τότε προσελθὼν ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, ποσάκις ἁμαρτήσει εἰς ἐμὲ ὁ ἀδελφός μου καὶ ἀφήσω αὐτῷ; ἕως ἑπτάκις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: pt
  text: 'Então Pedro se aproximou dele e disse: “Senhor, quantas vezes meu irmão pecará contra mim e eu lhe perdoarei? Até sete vezes?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu irmão ou minha irmã”; o grego diz literalmente “meu irmão” (masculino singular), expressão que, neste contexto, pode referir-se mais amplamente a outro discípulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca naturalmente a sequência narrativa e temporal.
- source_word: προσελθὼν αὐτῷ ὁ Πέτρος εἶπεν
  choice: Pedro se aproximou dele e disse
  rationale: Reproduz a ação anterior do particípio aoristo e mantém o verbo de fala sem substituí-lo pelo interpretativo “perguntou”.
- source_word: Κύριε
  choice: Senhor
  rationale: Forma vocativa tradicional e natural, preservando tanto o respeito quanto a possível ressonância teológica.
- source_word: ποσάκις
  choice: quantas vezes
  rationale: Expressa frequência numérica e prepara a proposta explícita de sete vezes.
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: pecará contra mim
  rationale: Mantém o futuro do grego e traduz idiomaticamente a ofensa dirigida contra Pedro.
- source_word: ὁ ἀδελφός μου
  choice: meu irmão
  rationale: Preserva o masculino singular da expressão grega, sem ampliar silenciosamente seu referente.
- source_word: καὶ ἀφήσω αὐτῷ
  choice: e eu o perdoarei
  rationale: Mantém a coordenação e o futuro verbal; “perdoar” expressa adequadamente ἀφίημι neste contexto ético.
- source_word: ἕως ἑπτάκις
  choice: Até sete vezes?
  rationale: Apresenta de modo conciso e natural o limite máximo sugerido por Pedro.
theological_decisions:
- issue: Alcance contextual de ἀδελφός
  choice: meu irmão
  alternative: meu irmão ou minha irmã; outro discípulo
  rationale: O texto grego emprega o masculino singular. Embora a palavra possa designar mais amplamente outro membro da comunidade de discípulos, essa amplitude possível é indicada em nota, e não inserida na tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem das orações e os futuros foram preservados para manter a forma e a tensão da pergunta grega.
