id: MAT.18.13
reference: Matthew 18:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐὰν γένηται εὑρεῖν αὐτό, ἀμὴν λέγω ὑμῖν ὅτι χαίρει ἐπ’ αὐτῷ μᾶλλον ἢ ἐπὶ τοῖς ἐνενήκοντα ἐννέα τοῖς μὴ πεπλανημένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: pt
  text: 'E, se acontecer de encontrá-la[a], em verdade lhes digo: ele se alegra mais por ela do que pelas noventa e nove que não se desviaram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “se suceder que ele a encontre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém o conectivo simples e a continuidade da ilustração de Jesus.
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: se acontecer de encontrá-la
  rationale: Preserva tanto a contingência quanto a ideia explícita de ocorrência da construção grega, em português natural.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: em verdade lhes digo
  rationale: Reproduz a fórmula solene e enfática de Jesus em linguagem digna e amplamente compreensível.
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: ele se alegra mais por ela
  rationale: O verbo expressa alegria, e a preposição apresenta a ovelha encontrada como motivo dessa alegria.
- source_word: μᾶλλον ἢ
  choice: mais ... do que
  rationale: Expressa diretamente a comparação sem sugerir exclusão.
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: pelas noventa e nove
  rationale: Mantém implícito o substantivo 'ovelhas', como no grego, sendo o referente claro pelo contexto.
- source_word: τοῖς μὴ πεπλανημένοις
  choice: que não se desviaram
  rationale: Comunica o estado resultante de não terem saído do caminho e se ajusta naturalmente à imagem das ovelhas.
theological_decisions:
- issue: Força interpretativa da comparação da alegria do pastor
  choice: O pastor se alegra mais pela ovelha recuperada do que pelas noventa e nove que não se desviaram.
  alternative: Abrandar a comparação para evitar qualquer ideia de preferência, ou entendê-la como declaração de menor valor das noventa e nove.
  rationale: A comparação real indicada por μᾶλλον ἢ deve ser mantida. O texto não afirma falta de cuidado pelas noventa e nove nem explica valores relativos; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e de ampla legibilidade, com colocação pronominal natural para leitores brasileiros. O feminino em “encontrá-la” e “por ela” retoma “ovelha” no contexto imediato. A fórmula “em verdade lhes digo” conserva a solenidade sem recorrer ao empréstimo “amém”.
