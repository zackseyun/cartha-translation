  source_fidelity: A tradução preserva bem a sequência narrativa, a dívida de cem denários, a agressão física e a exigência de pagamento. “Tudo o que estiver devendo” comunica adequadamente a abertura indefinida de εἴ τι ὀφείλεις, com a alternativa mais literal registrada em nota. “Sufocá-lo” é possível, mas “estrangulá-lo” reproduz mais precisamente a violência física de ἔπνιγεν neste contexto.
  naturalness: “Companheiros de escravidão” é compreensível, mas soa abstrato e pouco idiomático em português moderno. “Companheiros, também escravos” é mais natural, mantém explicitamente a condição compartilhada e evita o pouco usual “conservos”. A ligação “e, agarrando-o” reflete naturalmente o particípio κρατήσας sem a adição discursiva de “Então”.
  terminology: “Escravo” é apropriado para δοῦλος nesta parábola e deve ser mantido. “Denários” conserva corretamente o termo monetário histórico; a nota cultural é adequada. A nota lexical está devidamente ancorada na fala de exigência.
