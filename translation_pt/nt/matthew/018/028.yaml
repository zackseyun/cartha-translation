source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that slave went out[a], he found one of his fellow slaves who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
translation:
  language: pt
  text: 'Mas aquele escravo, ao sair, encontrou um de seus companheiros, também escravo, que lhe devia cem denários[a]. E, agarrando-o, começou a estrangulá-lo, dizendo: “Pague tudo o que estiver devendo[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um denário correspondia normalmente ao pagamento de um dia de trabalho de um trabalhador ou soldado.
    reason: cultural_note
  - marker: b
    text: 'Mais literalmente: “Pague, se deve alguma coisa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: escravo
  rationale: Preserva a condição de escravizado e a relação coercitiva central à parábola, sem suavizá-la como “servo”.
- source_word: ἐξελθὼν δὲ
  choice: Mas aquele escravo, ao sair
  rationale: Expressa naturalmente em português a transição narrativa marcada por δέ e a relação temporal do particípio aoristo.
- source_word: συνδούλων
  choice: companheiros de escravidão
  rationale: Comunica que pertenciam à mesma condição e mantém o sentido do prefixo σύν-, evitando o termo pouco corrente “conservo”.
- source_word: ὤφειλεν
  choice: devia
  rationale: É a forma corrente e direta para uma dívida financeira em português.
- source_word: ἑκατὸν δηνάρια
  choice: cem denários
  rationale: Mantém a moeda histórica e, assim, o contraste narrativo com a dívida imensa mencionada anteriormente.
- source_word: κρατήσας
  choice: o agarrou
  rationale: Transmite de modo claro a ação física enérgica do particípio.
- source_word: ἔπνιγεν
  choice: começou a sufocá-lo
  rationale: A construção inceptiva comunica naturalmente o aspecto imperfeito e o início de uma agressão contínua.
- source_word: Ἀπόδος
  choice: Pague
  rationale: Em contexto de dívida, formula de maneira direta e incisiva a ordem de quitar o que era devido.
- source_word: εἴ τι ὀφείλεις
  choice: tudo o que estiver devendo
  rationale: Conserva em português natural a força indefinida de εἴ τι sem transformar a expressão numa referência estritamente definida; a forma mais literal fica registrada em nota.
theological_decisions:
- issue: Tradução de δοῦλος numa narrativa parabólica
  choice: escravo / companheiros de escravidão
  alternative: servo / conservos
  rationale: A condição jurídica e social de escravizado, bem como o exercício de poder coercitivo, são relevantes nesta cena; “servo” suavizaria essa realidade, e “conservo” é pouco transparente para leitores atuais.
- issue: Força indefinida de εἴ τι ὀφείλεις
  choice: tudo o que estiver devendo
  alternative: o que você deve / se deve alguma coisa
  rationale: A escolha mantém a formulação aberta da exigência sem resolver a expressão como referência apenas a uma quantia definida; a ambiguidade formal é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evitou-se “conservo”, por ser pouco corrente, e preservou-se “denários” como termo histórico explicado em nota.
