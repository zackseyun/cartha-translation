  - severity: low
    issue: “sufocá-lo” é menos específico que “estrangulá-lo” para a ação violenta descrita.
    rationale: No contexto de agarrar a pessoa e apertar-lhe o pescoço, “estrangulá-lo” é a opção portuguesa mais direta para ἔπνιγεν, sem alterar o aspecto inceptivo expresso por “começou a”.
