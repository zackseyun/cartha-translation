- source_word: προσκαλεσάμενος
  choice: chamando
  rationale: O particípio aoristo indica que Jesus chamou a criança para junto de si; em português, “chamando” expressa isso naturalmente sem acrescentar informação.
- source_word: παιδίον
  choice: uma criança
  rationale: Tradução comum e não marcada para o substantivo, preservando a referência indefinida.
- source_word: ἔστησεν
  choice: colocou-a
  rationale: O verbo causativo significa fazer alguém ficar de pé ou posicioná-lo; “colocou-a” é natural em português e preserva a ação sem sugerir que Jesus apenas se levantou.
- source_word: ἐν μέσῳ αὐτῶν
  choice: no meio deles
  rationale: Equivalente idiomático direto da expressão grega, referindo-se ao centro do grupo.
