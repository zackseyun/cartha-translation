source:
  edition: SBLGNT
  text: τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ· Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked slave[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: pt
  text: 'Então, seu senhor o chamou e lhe disse: “Escravo perverso[a], eu lhe perdoei toda aquela dívida[b] porque você me suplicou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”. O grego δοῦλος pode significar “servo” ou “escravo”; aqui, “escravo” destaca a relação de sujeição ao senhor, central à parábola.
    reason: lexical_alternative
  - marker: b
    text: Ou “cancelei toda aquela dívida”. O verbo grego pode indicar tanto perdoar quanto liberar alguém de uma dívida ou remiti-la.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Funciona como conector temporal e narrativo natural na sequência da parábola.
- source_word: προσκαλεσάμενος
  choice: mandou chamá-lo
  rationale: Expressa o ato de chamar alguém à própria presença e preserva, em português corrente, a autoridade do senhor.
- source_word: ὁ κύριος αὐτοῦ
  choice: seu senhor
  rationale: No contexto, κύριος designa o senhor do escravo, não um título divino. A formulação é concisa e natural.
- source_word: λέγει αὐτῷ
  choice: lhe disse
  rationale: O presente histórico grego é vertido pelo passado, forma normal da narrativa em português.
- source_word: Δοῦλε πονηρέ
  choice: Escravo perverso
  rationale: “Escravo” torna explícita a relação de sujeição central à parábola; “perverso” comunica a censura moral forte de πονηρός sem soar arcaico.
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: toda aquela dívida
  rationale: Reproduz naturalmente tanto a totalidade expressa por πᾶσαν quanto a referência retrospectiva de ἐκείνην.
- source_word: ἀφῆκά σοι
  choice: eu lhe perdoei
  rationale: Mantém a imagem da remissão da dívida e, ao mesmo tempo, a ressonância de perdão que o verbo ἀφίημι carrega em Mateus.
- source_word: ἐπεὶ
  choice: porque
  rationale: Introduz de modo claro e direto a razão da ação do senhor.
- source_word: παρεκάλεσάς με
  choice: você me suplicou
  rationale: Comunica um pedido insistente e humilde, adequado ao contexto, sem ampliar o sentido do verbo.
theological_decisions:
- issue: Tradução de δοῦλος na relação senhor–escravo da parábola
  choice: escravo
  alternative: servo
  rationale: A dependência jurídica e econômica da personagem em relação ao seu senhor é relevante para a força narrativa. “Escravo” torna essa condição transparente, enquanto “servo” poderia suavizá-la.
- issue: Tradução de ἀφίημι no contexto de dívida
  choice: perdoei
  alternative: cancelei / remiti
  rationale: A referência imediata é a remissão de uma dívida, mas o vocabulário também estabelece a ligação da parábola com o perdão. “Perdoei” preserva essa sobreposição sem eliminar o sentido financeiro, explicitado por “dívida”.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A fala direta usa vocabulário forte, mas corrente. Conservou-se a tensão entre a imagem financeira da dívida e o tema teológico do perdão.
