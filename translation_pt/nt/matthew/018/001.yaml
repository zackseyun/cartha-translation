source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ὥρᾳ προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ λέγοντες· Τίς ἄρα μείζων ἐστὶν ἐν τῇ βασιλείᾳ τῶν οὐρανῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: pt
  text: 'Naquela hora, os discípulos se aproximaram de Jesus e perguntaram: “Quem, então, é maior no Reino dos céus?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Naquela hora
  rationale: Reproduz naturalmente a expressão temporal grega e sua ligação com o contexto anterior.
- source_word: προσῆλθον
  choice: se aproximaram
  rationale: Expressa o movimento em direção a Jesus indicado pelo verbo προσέρχομαι.
- source_word: λέγοντες
  choice: e perguntaram
  rationale: Embora literalmente seja “dizendo”, a fala introduzida é uma pergunta; a coordenação produz português corrente sem alterar o sentido.
- source_word: Τίς ἄρα
  choice: Quem, então
  rationale: “Então” preserva a força inferencial ou consequencial de ἄρα, sem eliminar sua leve ambiguidade discursiva.
- source_word: μείζων
  choice: maior
  rationale: Mantém o comparativo grego, em vez de convertê-lo no superlativo “o maior”, preservando a forma e a tensão do texto-fonte.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: no Reino dos céus
  rationale: Formulação natural e reconhecível em português para a expressão característica de Mateus; “Reino” recebe maiúscula por referência ao domínio régio de Deus.
theological_decisions:
- issue: Valor comparativo de μείζων
  choice: maior
  alternative: o maior
  rationale: O grego usa formalmente o comparativo. Embora comparativos possam assumir sentido superlativo em certos contextos, a tradução preserva a redação comparativa e não resolve além do necessário a pergunta dos discípulos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente naturalizada, e o comparativo “maior” foi preservado de modo deliberado.
