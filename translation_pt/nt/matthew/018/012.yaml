source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: pt
  text: O que vocês acham? Se um homem tiver cem ovelhas, e uma delas se desviar[a], será que ele não deixará as noventa e nove nos montes[b] e irá em busca da que está se desviando[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se afastar” ou “vaguear”. O verbo grego também pode, em certos contextos, significar “ser desencaminhada”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nas montanhas”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “a que está se desviando”; tradicionalmente, “a perdida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: O que vocês acham?
  rationale: Expressão idiomática que convida diretamente os ouvintes a julgar a situação; o plural “vocês” torna explícito o ὑμῖν.
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ
  choice: Se um homem tiver
  rationale: A construção com γίνομαι e dativo expressa posse ou circunstância. “Um homem” preserva a forma masculina singular genérica do grego.
- source_word: ἑκατὸν πρόβατα
  choice: cem ovelhas
  rationale: Equivalência direta e natural em português.
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: uma delas se desviar
  rationale: O passivo de πλανάω pode indicar desviar-se, vaguear ou ser desencaminhado. A forma pronominal preserva a ambiguidade de agência sem tornar explícita uma causa externa.
- source_word: οὐχὶ ἀφήσει
  choice: será que ele não deixará
  rationale: οὐχί introduz uma pergunta que espera resposta afirmativa; “deixará” conserva o futuro e evita a força excessiva de “abandonará”.
- source_word: τὰ ἐνενήκοντα ἐννέα
  choice: as noventa e nove
  rationale: Forma numeral padrão, com o referente “ovelhas” naturalmente subentendido.
- source_word: ἐπὶ τὰ ὄρη
  choice: nos montes
  rationale: Mantém a imagem topográfica concreta de ὄρη; “montes” é natural e digno em português, sem exigir grandes montanhas.
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: e irá procurar
  rationale: O particípio de movimento seguido do verbo principal é expresso naturalmente como ação coordenada. “Procurar” comunica ζητέω de modo corrente.
- source_word: τὸ πλανώμενον
  choice: a que está se desviando
  rationale: Preserva o aspecto presente do particípio e repete a raiz conceitual de πλανηθῇ, sem substituí-la por “perdida”, vocábulo que poderia sugerir outra formulação grega.
theological_decisions:
- issue: Masculino genérico em ἀνθρώπῳ
  choice: um homem
  alternative: alguém / uma pessoa
  rationale: A tradução mantém a forma masculina singular representativa do original sem restringir artificialmente a aplicação da comparação.
- issue: Nuance de πλανάω na metáfora da ovelha
  choice: se desviar / a que está se desviando
  alternative: se afastar; vaguear; ser desencaminhada; a perdida
  rationale: A opção conserva tanto a imagem pastoril quanto sua possível ressonância moral, sem determinar se houve simples vagueação, culpa própria ou ação externa.
- issue: Força retórica de οὐχί
  choice: será que ele não deixará... e irá procurar...?
  alternative: ele não deixará... e irá procurar?
  rationale: A formulação portuguesa indica claramente que se espera uma resposta afirmativa, preservando a pergunta retórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A colocação pronominal e o uso de “vocês” favorecem clareza oral; “montes” preserva o cenário sem soar excessivamente técnico. Os marcadores foram posicionados junto aos termos a que se referem e seguem ordem alfabética.
