  yaml_path: translation/nt/matthew/018/011.yaml
  text: For the Son[a] of Man came to save the lost.
translation:
  language: pt
  text: Pois o Filho do Homem veio salvar o que estava perdido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo não aparece nos manuscritos gregos mais antigos, entre eles os códices Sinaítico e Vaticano, do século IV, nem em antigas traduções coptas. Contudo, está presente no Códice Beza, do século V, na tradição majoritária bizantina e na Vulgata latina. É possível que copistas posteriores o tenham acrescentado para harmonizar esta passagem com Lucas 19:10.
    reason: textual_critical
lexical_decisions:
- source_word: σῴζω
  choice: salvar
  rationale: 'Mantém o sentido usual do verbo em contexto de salvação: livrar do perigo ou da perdição.'
- source_word: τὸ ἀπολωλός
  choice: o que estava perdido
  rationale: Reproduz o particípio perfeito substantivado, neutro singular, preservando sua forma abrangente e o estado resultante de estar perdido.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Expressão titular consagrada e formalmente correspondente ao grego.
theological_decisions:
- issue: Referente de τὸ ἀπολωλός
  choice: o que estava perdido
  alternative: os perdidos
  rationale: O grego emprega neutro singular substantivado; a tradução escolhida evita restringir explicitamente o referente, embora no contexto se aplique a pessoas.
translation_notes:
  register: Português moderno, claro e digno, com ordem natural. “Pois” traduz γάρ e conecta o versículo à argumentação anterior; “estava perdido” comunica em linguagem corrente o estado expresso pelo perfeito grego.
