  text: οὐκ ἔδει καὶ σὲ ἐλεῆσαι τὸν σύνδουλόν σου, ὡς κἀγὼ σὲ ἠλέησα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/033.yaml
  text: Should you not also have had mercy on your fellow slave[a], as I also had mercy on you?
translation:
  language: pt
  text: Você não devia também ter tido misericórdia de seu companheiro de escravidão[a], assim como eu também tive misericórdia de você?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seu conservo», «seu companheiro de serviço» ou «seu coescravo». O grego σύνδουλος indica alguém sujeito ao mesmo senhor; «companheiro de escravidão» preserva aqui a ideia de condição servil compartilhada.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: Você não devia
  rationale: O imperfeito impessoal ἔδει expressa obrigação moral. Em português, a pergunta retórica com «não devia» transmite de modo natural a censura e a obrigação não cumprida.
- source_word: καὶ
  choice: também
  rationale: Assinala a correspondência entre a misericórdia esperada do escravo e a misericórdia que ele já havia recebido.
- source_word: σὲ
  choice: você
  rationale: Objeto semântico do infinitivo; «você» oferece leitura moderna e amplamente compreensível.
- source_word: ἐλεῆσαι / ἠλέησα
  choice: ter tido misericórdia / tive misericórdia
  rationale: A repetição de «misericórdia» preserva a correspondência lexical do verbo ἐλεέω nas duas formas e mantém seu peso ético e teológico.
- source_word: τὸν σύνδουλόν σου
  choice: seu companheiro de escravidão
  rationale: Σύνδουλος designa alguém que é escravo do mesmo senhor. «Companheiro de escravidão» preserva tanto a condição servil quanto a ideia do prefixo σύν-, evitando a possível leitura de que se trata simplesmente de um colega de serviço.
- source_word: ὡς
  choice: assim como
  rationale: Introduz claramente a comparação entre a misericórdia que se exigia e a que já havia sido concedida.
- source_word: κἀγὼ
  choice: eu
  rationale: A noção aditiva de κἀγώ é comunicada pelo paralelo «também... assim como eu»; acrescentar outro «também» seria possível, mas menos fluente em português.
theological_decisions:
- issue: Tradução do termo da família de δοῦλος em σύνδουλος
  choice: companheiro de escravidão
  alternative: conservo; companheiro de serviço; coescravo
  rationale: No cenário da parábola, a sujeição comum ao mesmo senhor é relevante. A opção mantém explícita a condição de escravo sem tornar o português excessivamente técnico; a nota registra alternativas tradicionais e mais literais.
translation_notes:
  register: Português moderno, digno e acessível, com «você» por clareza internacional e legibilidade brasileira. A formulação conserva a força da pergunta de censura e a repetição de «misericórdia».
