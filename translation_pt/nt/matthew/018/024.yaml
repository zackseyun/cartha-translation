  text: ἀρξαμένου δὲ αὐτοῦ συναίρειν ⸀προσηνέχθη ⸂αὐτῷ εἷς⸃ ὀφειλέτης μυρίων ταλάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: pt
  text: Quando ele começou a acertar as contas, foi-lhe trazido um devedor que devia dez mil talentos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O talento era uma unidade monetária de valor muito elevado; na situação retratada pela parábola, “dez mil talentos” representa uma dívida inimaginavelmente grande.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ
  choice: Quando ele começou
  rationale: O genitivo absoluto introduz a circunstância temporal da ação principal; esta formulação é natural em português e não especifica além do texto a sequência temporal.
- source_word: συναίρειν
  choice: a acertar as contas
  rationale: No contexto financeiro, o verbo se refere ao exame e ajuste de contas. A expressão é corrente em português e preserva a imagem contábil da parábola.
- source_word: προσηνέχθη αὐτῷ
  choice: foi-lhe trazido
  rationale: O aoristo passivo indica que outras pessoas conduziram o devedor até ele. A construção conserva tanto a passividade quanto o valor do dativo αὐτῷ.
- source_word: εἷς ὀφειλέτης
  choice: um devedor
  rationale: Em português, o artigo indefinido introduz naturalmente um caso particular entre vários e pode representar εἷς sem a ênfase potencialmente indevida de 'um só devedor'.
- source_word: μυρίων ταλάντων
  choice: dez mil talentos
  rationale: μύριοι designa literalmente dez mil e também sugere uma quantidade imensa. Mantém-se a unidade histórica, pois uma conversão monetária moderna seria incerta e poderia reduzir o efeito retórico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Acertar as contas' é idiomático sem perder o cenário financeiro; 'foi-lhe trazido' mantém concisão e leve solenidade narrativa.
