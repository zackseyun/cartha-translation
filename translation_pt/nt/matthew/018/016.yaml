reference: Matthew 18:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀκούσῃ, παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο, ἵνα ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν σταθῇ πᾶν ῥῆμα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: pt
  text: Mas, se ele não lhe der ouvidos, leve com você mais uma ou duas pessoas, para que, pela boca de duas ou três testemunhas,[a] toda questão seja estabelecida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alusão a Deuteronômio 19:15. A expressão “pela boca de” também pode ser traduzida como “pelo testemunho de”.
    reason: lexical_alternative; cross_reference
lexical_decisions:
- source_word: ἀκούσῃ
  choice: ouvir
  rationale: No contexto, significa ouvir com disposição para atender, não apenas perceber um som. Em português, “não ouvir” conserva de modo natural essa possibilidade de sentido responsivo.
- source_word: παράλαβε μετὰ σοῦ
  choice: leve com você
  rationale: Expressa claramente a ordem concreta de fazer com que outras pessoas acompanhem quem aborda o irmão.
- source_word: ἔτι ἕνα ἢ δύο
  choice: mais uma ou duas pessoas
  rationale: “Mais” representa ἔτι, e “pessoas” explicita de maneira natural os acompanhantes adicionais sem restringir sua função.
- source_word: ἵνα
  choice: para que
  rationale: Preserva a força de finalidade da conjunção.
- source_word: ἐπὶ στόματος
  choice: pela boca de
  rationale: Mantém o idioma semítico e jurídico que alude a Deuteronômio 19:15, permanecendo compreensível em português.
- source_word: μαρτύρων
  choice: testemunhas
  rationale: É o equivalente jurídico normal e adequado ao contexto.
- source_word: σταθῇ
  choice: seja estabelecida
  rationale: No contexto jurídico, o verbo indica que algo fica validado ou confirmado; a forma passiva preserva a construção grega.
- source_word: πᾶν ῥῆμα
  choice: toda questão
  rationale: Embora a expressão possa ser vertida literalmente como “toda palavra”, aqui tem sentido jurídico mais amplo de assunto ou questão em consideração.
theological_decisions:
- issue: Alusão à fórmula jurídica de Deuteronômio 19:15 no contexto de disciplina comunitária
  choice: Preservar “pela boca de duas ou três testemunhas” e traduzir πᾶν ῥῆμα como “toda questão”.
  alternative: “Pelo testemunho de duas ou três testemunhas, toda acusação seja confirmada.”
  rationale: A escolha conserva a alusão veterotestamentária e sua força jurídica sem limitar indevidamente o referente a uma acusação formal nem resolver se as testemunhas confirmam a ofensa original, a recusa em ouvir ou toda a interação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Leve” e “você” dão naturalidade à instrução; o idioma bíblico-jurídico “pela boca de” é preservado e esclarecido em nota.
