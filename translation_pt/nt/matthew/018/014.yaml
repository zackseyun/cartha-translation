id: MAT.18.14
reference: Matthew 18:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: pt
  text: Da mesma forma, não é da vontade do Pai de vocês, que está nos céus, que um só destes pequeninos pereça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que um só destes pequeninos se perca». O verbo grego pode significar tanto «perecer» como «perder-se»; o contexto imediato da ovelha perdida favorece esse último sentido.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Da mesma forma
  rationale: Liga naturalmente a declaração à comparação da ovelha perdida que a precede, preservando a força contextual de οὕτως.
- source_word: οὐκ ἔστιν θέλημα ἔμπροσθεν τοῦ πατρὸς ὑμῶν
  choice: não é da vontade do Pai de vocês
  rationale: Expressa em português corrente a intenção ou o desejo do Pai. Embora ἔμπροσθεν signifique literalmente «diante de», a locução grega é mais naturalmente comunicada aqui como aquilo que não corresponde à vontade do Pai.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: que está nos céus
  rationale: Conserva a construção relativa e o plural do grego sem comprometer a naturalidade em português.
- source_word: ἵνα ἀπόληται
  choice: que pereça
  rationale: Mantém a gravidade possível de ἀπόλλυμι, sem excluir a nuance contextual de perder-se, registrada em nota.
- source_word: ἓν
  choice: um só
  rationale: 'Torna natural em português a ênfase contextual no indivíduo singular: nenhum sequer deve perecer, sem alterar o referente.'
- source_word: τῶν μικρῶν τούτων
  choice: destes pequeninos
  rationale: Preserva a expressão relacional e metafórica, sem restringi-la indevidamente a crianças pequenas.
theological_decisions:
- issue: Sentido de ἀπόληται à luz da ovelha perdida
  choice: que pereça
  alternative: que se perca
  rationale: O verbo pode indicar tanto perecer quanto estar ou ficar perdido. O texto principal conserva a força da advertência, enquanto a nota mantém a ligação lexical com a parábola precedente sem resolver a tensão teológica.
- issue: Referência de τῶν μικρῶν τούτων
  choice: destes pequeninos
  alternative: destas crianças pequenas
  rationale: O contexto de Mateus 18 permite uma referência mais ampla aos pequenos ou vulneráveis ligados a Jesus; por isso, a tradução não limita a expressão exclusivamente pela idade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Pai de vocês» evita regionalismo excessivo e corresponde ao plural ὑμῶν; «pequeninos» conserva a imagem tradicional sem especificar apenas crianças.
