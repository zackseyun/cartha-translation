id: MAT.18.8
reference: Matthew 18:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: pt
  text: E, se a sua mão ou o seu pé faz você tropeçar[a], corte-a ou corte-o e jogue-a ou jogue-o para longe de você. É melhor para você entrar na vida mutilado ou manco do que, tendo duas mãos ou dois pés, ser lançado no fogo eterno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faz você pecar”. O verbo grego evoca literalmente a ideia de fazer tropeçar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  choice: faz você tropeçar
  rationale: Preserva a metáfora grega de tropeço, que neste contexto aponta para queda moral, sem substituir a imagem por uma explicação.
- source_word: ἔκκοψον
  choice: corte-o
  rationale: Reproduz o imperativo forte e concreto de cortar fora a mão ou o pé.
- source_word: βάλε ἀπὸ σοῦ
  choice: jogue-o para longe de você
  rationale: Expressa tanto o ato enérgico de lançar quanto o afastamento indicado por ἀπό σοῦ.
- source_word: καλόν σοί ἐστιν
  choice: É melhor para você
  rationale: No contraste introduzido por ἤ, καλόν tem naturalmente valor comparativo em português.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: entrar na vida
  rationale: Mantém 'vida' sem acrescentar 'eterna', deixando que o contexto comunique sua dimensão escatológica.
- source_word: κυλλὸν
  choice: mutilado
  rationale: No contexto de uma mão cortada, designa com precisão a perda ou mutilação de um membro.
- source_word: χωλόν
  choice: manco
  rationale: Equivalente direto e corrente para a limitação ligada ao pé ou à perna.
- source_word: ἔχοντα
  choice: tendo
  rationale: Representa explicitamente o particípio grego e preserva o contraste com a condição anterior.
- source_word: βληθῆναι
  choice: ser lançado
  rationale: Traduz claramente o infinitivo passivo e conserva a força da imagem de juízo.
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: o fogo eterno
  rationale: É a formulação portuguesa natural e semanticamente adequada para αἰώνιος neste contexto de juízo.
theological_decisions:
- issue: Se σκανδαλίζει deve ser moralizado como 'faz pecar' ou manter a metáfora do tropeço
  choice: faz você tropeçar
  alternative: faz você pecar
  rationale: A tradução conserva a metáfora presente no grego; a implicação moral permanece perceptível no contexto e é esclarecida em nota.
- issue: O sentido de 'vida' em εἰς τὴν ζωὴν
  choice: manter 'vida' sem explicitação
  alternative: vida eterna
  rationale: Embora a referência seja escatológica, o texto grego diz apenas 'vida'; o contraste com o fogo eterno fornece o peso teológico.
- issue: A natureza da ordem de mutilação corporal
  choice: traduzir literalmente sem resolver se é hipérbole
  alternative: parafrasear como chamado figurado ao arrependimento radical
  rationale: A linguagem imperativa e severa do texto deve ser preservada, sem inserir no corpo da tradução uma interpretação do recurso retórico.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e internacionalmente. O tratamento por 'você' evita construções excessivamente formais; 'manco' e 'mutilado' mantêm precisão concreta sem linguagem arcaica.
