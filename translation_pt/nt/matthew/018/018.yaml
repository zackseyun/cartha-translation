reference: Matthew 18:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: pt
  text: 'Em verdade lhes digo: tudo o que vocês ligarem na terra terá sido ligado no céu, e tudo o que vocês desligarem na terra terá sido desligado no céu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais tradicional: “será ligado no céu [...] será desligado no céu”. A construção grega também pode ser traduzida assim, mas a formulação no texto reflete o verbo no futuro com um particípio perfeito, que pode indicar um estado já estabelecido no céu.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Em verdade
  rationale: Introduz uma declaração solene e autorizada. “Em verdade” é claro, digno e preserva a fórmula característica sem deixar “amém” opaco no discurso direto.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Expressa naturalmente a primeira pessoa e o destinatário plural em português corrente.
- source_word: ὅσα ἐὰν
  choice: tudo o que
  rationale: Transmite a referência geral e indefinida da construção grega de modo idiomático.
- source_word: δήσητε
  choice: ligarem
  rationale: Preserva a metáfora de δέω e sua amplitude contextual, sem restringi-la de antemão a “proibir” ou a uma interpretação jurídica específica.
- source_word: ἐπὶ τῆς γῆς
  choice: na terra
  rationale: Forma portuguesa natural para o contraste entre a esfera terrena e a celestial.
- source_word: ἔσται δεδεμένα
  choice: terá sido ligado
  rationale: O futuro de εἰμί com particípio perfeito passivo pode ser representado pelo futuro composto, ressaltando um estado resultante de ação anterior sem eliminar a ambiguidade da construção.
- source_word: ἐν οὐρανῷ
  choice: no céu
  rationale: Equivalente idiomático do singular grego para a esfera celestial.
- source_word: λύσητε
  choice: desligarem
  rationale: Mantém em português a oposição metafórica direta com “ligarem” e evita reduzir o sentido exclusivamente a “permitir”, “soltar” ou “absolver”.
- source_word: ἔσται λελυμένα
  choice: terá sido desligado
  rationale: Reproduz paralelamente o futuro com particípio perfeito passivo e seu possível sentido de estado já estabelecido.
theological_decisions:
- issue: Força temporal e teológica da fórmula de ligar e desligar
  choice: “terá sido ligado/desligado no céu”
  alternative: “será ligado/desligado no céu”
  rationale: A perífrase grega ἔσται com particípio perfeito passivo admite uma tradução de futuro perfeito, que pode indicar um estado já estabelecido no céu. A formulação preserva a relação tensa entre a ação terrena e a realidade celestial sem impor uma teoria denominacional sobre autoridade e ratificação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. O plural “vocês” torna explícito que ὑμῖν e os verbos estão no plural. “Ligar/desligar” conserva o par metafórico tradicional e evita interpretação denominacional excessiva.
