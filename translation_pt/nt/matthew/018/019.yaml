id: MAT.18.19
reference: Matthew 18:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
translation:
  language: pt
  text: 'Digo-lhes ainda, em verdade: se dois de vocês[a], na terra, concordarem a respeito de qualquer coisa que pedirem[c], isso lhes será feito por meu Pai que está no céu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dois dentre vocês estiverem de acordo».'
    reason: lexical_alternative
  - marker: b
    text: Em grego, «nos céus»; traduzido de modo idiomático como «no céu».
    reason: lexical_alternative
  - marker: c
    text: No contexto, esta declaração vem logo depois do ensino de Jesus sobre a autoridade e a disciplina da comunidade (18.15–18), embora as palavras deste versículo falem de modo amplo sobre pedidos feitos de comum acordo.
    reason: cross_reference
lexical_decisions:
- source_word: Πάλιν
  choice: ainda
  rationale: Assinala uma declaração adicional ligada ao ensino anterior; em «Digo-lhes ainda», mantém a progressão do discurso de modo natural em português.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: digo-lhes, em verdade
  rationale: Preserva a força solene e enfática da fórmula de Jesus sem exigir a transliteração «amém».
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  choice: se dois de vocês concordarem
  rationale: συμφωνέω indica estar de acordo, e ἐξ ὑμῶν identifica os dois como pertencentes ao grupo dos ouvintes.
- source_word: ἐπὶ τῆς γῆς
  choice: na terra
  rationale: Equivalente português corrente, preservando o contraste espacial com o Pai no céu.
- source_word: περὶ παντὸς πράγματος
  choice: a respeito de qualquer coisa
  rationale: Mantém a amplitude de πρᾶγμα, que pode designar uma coisa, questão ou assunto, em linguagem acessível.
- source_word: οὗ ἐὰν αἰτήσωνται
  choice: que pedirem
  rationale: Reproduz de modo natural a construção relativa indefinida e o sentido de pedir ou solicitar, sem acrescentar explicitamente «em oração».
- source_word: γενήσεται αὐτοῖς
  choice: isso lhes será feito
  rationale: Mantém a formulação impessoal/passiva e sua ligação com a expressão seguinte, que apresenta o Pai como agente, sem transformar o texto numa paráfrase explicativa.
- source_word: παρὰ τοῦ πατρός μου
  choice: por meu Pai
  rationale: Com γενήσεται, παρά com genitivo pode indicar fonte ou agência; «por meu Pai» expressa naturalmente a agência nesta construção.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: que está no céu
  rationale: Emprega o idiomatismo português usual para o plural grego οὐρανοῖς, registrando a forma literal em nota.
theological_decisions:
- issue: Alcance da promessa no contexto
  choice: Traduzir a declaração sem inserir restrições ou ampliações doutrinárias que não estejam expressas no grego.
  alternative: Restringir explicitamente a promessa às decisões de disciplina comunitária, ou apresentá-la como garantia irrestrita para qualquer pedido em oração.
  rationale: O contexto imediato trata da correção comunitária e da autoridade da comunidade (18.15–18), enquanto αἰτέω fala de pedir. A redação do versículo, porém, é ampla. A tradução conserva essa amplitude e a tensão contextual; a nota informa o contexto sem resolver a questão no corpo do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada apenas onde necessário para a fluidez, e a formulação preserva a solenidade, a amplitude do pedido e a tensão com o contexto imediato.
