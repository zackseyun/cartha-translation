id: MAT.18.9
reference: Matthew 18:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: pt
  text: E, se o seu olho faz você tropeçar[a], arranque-o e jogue-o para longe de você. É melhor para você entrar na vida com um só olho do que, tendo os dois olhos, ser lançado na Geena[b] de fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “leva você a pecar”. O verbo grego pode significar fazer alguém tropeçar, cair ou pecar.
    reason: lexical_alternative
  - marker: b
    text: “Geena” refere-se ao lugar do juízo final; tradicionalmente, o termo é traduzido como “inferno”.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: faz você tropeçar
  rationale: Preserva a metáfora de tropeçar e cair, sem restringir prematuramente o sentido à tentação interior; no contexto, também pode indicar levar alguém a pecar.
- source_word: ἔξελε
  choice: arranque-o
  rationale: O imperativo aoristo é enérgico, e “arranque-o” comunica com naturalidade a severidade deliberadamente chocante da imagem.
- source_word: βάλε ἀπὸ σοῦ
  choice: jogue-o para longe de você
  rationale: Expressa uma remoção decidida e completa em português corrente.
- source_word: καλόν σοί ἐστιν
  choice: É melhor para você
  rationale: 'No contraste introduzido por ἤ, καλόν tem valor comparativo: indica o que é preferível, e não apenas o que é bom.'
- source_word: μονόφθαλμον
  choice: com um só olho
  rationale: Reproduz o sentido de “caolho” de modo claro, natural e não pejorativo.
- source_word: εἰς τὴν ζωὴν
  choice: entrar na vida
  rationale: Mantém “vida” sem acrescentar “eterna”, adjetivo ausente no texto grego, embora a expressão tenha alcance escatológico no contexto.
- source_word: βληθῆναι
  choice: ser lançado
  rationale: Representa diretamente o infinitivo passivo e conserva a força da ação.
- source_word: γέενναν
  choice: Geena
  rationale: Mantém o termo específico grego, em sua forma portuguesa tradicional, sem o substituir pelo conceito teológico mais amplo de “inferno”.
- source_word: τοῦ πυρός
  choice: de fogo
  rationale: Preserva de maneira direta e natural a construção genitiva e sua imagem vívida.
theological_decisions:
- issue: Tradução de γέεννα
  choice: Geena
  alternative: inferno
  rationale: O texto emprega o termo específico γέεννα. Conservá-lo evita reduzir suas associações históricas judaicas e escatológicas a um termo teológico mais abrangente.
- issue: Tradução de εἰς τὴν ζωήν
  choice: entrar na vida
  alternative: entrar na vida eterna
  rationale: Embora a referência provavelmente seja à vida escatológica, o grego não traz o adjetivo “eterna”; a redação preserva essa concisão e sua tensão teológica.
- issue: Força da imagem de arrancar o olho
  choice: manter a linguagem concreta e severa
  alternative: explicitar no corpo do texto que se trata de hipérbole
  rationale: A tradução deve reproduzir a imagem de Jesus sem inserir no texto uma classificação retórica ou uma aplicação interpretativa que o original não declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se a metáfora do tropeço, a contundência dos imperativos e a concisão escatológica de “vida”. O pronome de tratamento “você” favorece clareza internacional com naturalidade no Brasil; as formas enclíticas “arranque-o” e “jogue-o” preservam o registro escrito digno.
