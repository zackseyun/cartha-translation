id: MAT.18.5
reference: Matthew 18:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἐὰν δέξηται ⸂ἓν παιδίον τοιοῦτο⸃ ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
translation:
  language: pt
  text: E quem receber uma criança como esta em meu nome recebe a mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «acolher». O verbo grego pode significar «receber», «acolher» ou «aceitar».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: quem
  rationale: A combinação do pronome relativo com ἐάν expressa uma condição geral e indefinida. Em português, «quem» comunica isso de modo natural; o valor abrangente é mantido pela formulação proverbial.
- source_word: δέξηται / δέχεται
  choice: receber / recebe
  rationale: «Receber» preserva a repetição do mesmo verbo grego nas duas orações e deixa explícita a identificação entre receber a criança e receber Jesus. «Acolher» também seria possível e talvez mais idiomático no contexto, mas perderia parte da correspondência lexical caso não fosse repetido.
- source_word: ἓν παιδίον τοιοῦτο
  choice: uma criança como esta
  rationale: A expressão se refere à criança apresentada por Jesus e, por extensão, a uma criança dessa espécie ou condição. «Uma criança como esta» é mais natural em português do que o literal «uma tal criança» e não acrescenta «pequena», adjetivo ausente neste versículo.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: em meu nome
  rationale: A expressão indica que a recepção ocorre em referência ao nome, à autoridade ou à lealdade a Jesus. «Em meu nome» preserva essa amplitude sem fixar apenas uma dessas nuances.
- source_word: ἐμὲ
  choice: a mim
  rationale: A forma pronominal grega é enfática. «Recebe a mim», embora um pouco marcada, conserva melhor a ênfase do que o simples «me recebe» e reforça a correspondência final.
theological_decisions:
- issue: Identificação representativa entre a criança e Jesus
  choice: Receber uma criança como esta em nome de Jesus equivale a receber o próprio Jesus.
  alternative: Entender a ação apenas como uma maneira de honrar Jesus.
  rationale: A repetição de δέχομαι, com a mudança do objeto de «uma criança como esta» para o enfático «a mim», estabelece uma identificação representativa forte. A tradução a preserva sem acrescentar implicações sacramentais ou eclesiológicas que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação inicial «E» reflete καί e mantém a ligação com o contexto. Não se acrescentou «pequena», pois μικρόν não aparece neste versículo; como a tradução principal já diz apenas «criança», não é necessária uma nota específica sobre essa ausência.
