  source_fidelity: 'O texto traduz adequadamente todos os elementos centrais do grego: a generalidade indefinida de ὃς ἐὰν («quem»), a repetição de δέχομαι («receber ... recebe»), ἓν παιδίον τοιοῦτο («uma criança como esta»), ἐπὶ τῷ ὀνόματί μου («em meu nome») e a conclusão com ἐμέ («a mim»). Não acrescenta «pequena», termo que não ocorre no versículo.'
  naturalness: A redação é clara, moderna e digna em português de ampla compreensão. «E quem receber uma criança como esta em meu nome recebe a mim» mantém uma cadência bíblica natural sem se tornar excessivamente literal. «Recebe a mim» é uma formulação marcada, mas aceitável e apropriada para conservar o relevo conclusivo da construção.
  terminology: «Criança», «receber» e «em meu nome» são escolhas estáveis e adequadas. A nota sobre «acolher» registra uma alternativa lexical legítima sem enfraquecer a repetição verbal deliberadamente preservada no texto principal.
