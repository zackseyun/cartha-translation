id: MAT.18.25
reference: Matthew 18:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: pt
  text: Mas, como ele não tinha com que pagar, o senhor ordenou que ele, sua mulher, seus filhos e tudo o que possuía fossem vendidos, e que a dívida fosse paga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: Mas, como ele não tinha com que pagar
  rationale: O genitivo absoluto indica a circunstância causal, e a construção idiomática portuguesa “não tinha com que pagar” expressa falta de recursos para quitar a dívida sem afirmar incapacidade de outra natureza.
- source_word: ἐκέλευσεν
  choice: ordenou
  rationale: Expressa uma ordem dada com autoridade e se ajusta naturalmente ao contexto.
- source_word: ὁ κύριος
  choice: o senhor
  rationale: Neste contexto, κύριος designa o superior humano do servo na parábola. A minúscula evita tratá-lo como título divino direto, enquanto “senhor” preserva o valor lexical e soa natural em português.
- source_word: πραθῆναι καὶ τὴν γυναῖκα καὶ τὰ τέκνα
  choice: que fossem vendidos ele, sua mulher e seus filhos
  rationale: O infinitivo passivo dependente de “ordenou” é vertido como oração completiva. A coordenação deixa claro que a venda abrangia o devedor e sua família.
- source_word: πάντα ὅσα ἔχει
  choice: tudo o que possuía
  rationale: Reproduz a totalidade dos bens do devedor em português natural; o imperfeito harmoniza a perspectiva narrativa passada.
- source_word: καὶ ἀποδοθῆναι
  choice: e que a dívida fosse paga
  rationale: O segundo infinitivo passivo retoma o contexto explícito da dívida. Explicitar “a dívida” torna o referente natural em português sem alterar o sentido.
theological_decisions:
- issue: Sentido de κύριος dentro da parábola
  choice: o senhor
  alternative: o patrão / o seu senhor
  rationale: Trata-se do superior humano do servo na cena narrativa, não de um título divino direto. “O senhor” conserva a amplitude lexical; a grafia minúscula sinaliza o uso contextual.
- issue: Natureza da incapacidade de pagar
  choice: não tinha com que pagar
  alternative: não podia pagar
  rationale: A formulação preserva a ideia de ausência de recursos sugerida por μὴ ἔχοντος, evitando transformar a expressão em incapacidade absoluta ou inespecífica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. “Sua mulher” é empregado no sentido corrente de esposa; “senhor” permanece em minúscula por se referir ao superior humano na parábola.
