id: MAT.18.10
reference: Matthew 18:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: pt
  text: Tenham cuidado para não desprezar nenhum destes pequeninos[a], pois eu lhes digo que os anjos deles[b], nos céus[c], veem continuamente o rosto de meu Pai, que está nos céus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não tratem com desprezo nem sequer um destes pequeninos”. A expressão pode abranger crianças e também pessoas humildes ou consideradas sem importância.'
    reason: lexical_alternative
  - marker: b
    text: “Os anjos deles” pode indicar anjos associados a estes pequeninos ou que os representam; por si só, o versículo não define toda a doutrina dos anjos da guarda.
    reason: alternative_reading
  - marker: c
    text: 'Grego: “nos céus”. A expressão aparece duas vezes no versículo e também pode ser traduzida idiomaticamente como “no céu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Tenham cuidado
  rationale: O imperativo presente introduz uma advertência. A expressão é natural em português e comunica atenção vigilante.
- source_word: μὴ καταφρονήσητε
  choice: para não desprezar
  rationale: A construção com μή expressa proibição, e καταφρονέω significa desprezar ou considerar alguém insignificante.
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: nenhum destes pequeninos
  rationale: Em uma proibição, 'não desprezar nenhum' expressa naturalmente o sentido de 'não desprezar um só'. 'Pequeninos' preserva a possível referência tanto a crianças quanto a pessoas humildes ou de pouca importância social.
- source_word: λέγω γὰρ ὑμῖν
  choice: pois eu lhes digo
  rationale: Formulação atual e clara que mantém a função explicativa de γάρ e a ênfase da declaração de Jesus.
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: os anjos deles
  rationale: Mantém diretamente a relação possessiva do grego sem definir se se trata de anjos da guarda individuais, representantes ou anjos associados a eles.
- source_word: ἐν οὐρανοῖς
  choice: nos céus
  rationale: Preserva o plural formal do grego e soa natural no registro bíblico digno do português.
- source_word: διὰ παντὸς
  choice: continuamente
  rationale: A locução indica continuidade ou constância; 'continuamente' mantém essa força sem acrescentar interpretação.
- source_word: βλέπουσι τὸ πρόσωπον
  choice: veem continuamente o rosto
  rationale: '''Veem o rosto'' preserva a imagem de acesso direto à presença divina.'
- source_word: τοῦ πατρός μου
  choice: de meu Pai
  rationale: Mantém a linguagem filial explícita de Jesus sem inserir qualificadores não presentes no sintagma.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: que está nos céus
  rationale: Reproduz a expressão atributiva que localiza o Pai, preservando o plural do original.
theological_decisions:
- issue: Sentido de “os anjos deles”
  choice: Manter literalmente “os anjos deles”, sem formular uma doutrina de anjos da guarda individuais.
  alternative: Interpretar como anjos da guarda pessoais ou, de modo mais geral, como anjos associados aos pequeninos ou que os representam.
  rationale: O texto afirma a relação entre os anjos e os pequeninos, mas não explica sua natureza exata. A tradução preserva essa tensão.
- issue: Referente de “pequeninos”
  choice: Usar “pequeninos” sem restringir o referente exclusivamente a crianças.
  alternative: Traduzir como “criancinhas” ou explicitar “discípulos humildes”.
  rationale: O contexto inclui uma criança, mas a expressão pode estender-se aos humildes e vulneráveis entre os discípulos. A formulação ampla evita encerrar a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o plural 'céus' para refletir a forma grega e conserva 'pequeninos' e 'os anjos deles' sem estreitar ambiguidades relevantes.
