lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jesus lhe diz
  rationale: Mantém o presente histórico grego e o pronome dativo, produzindo uma formulação natural e vívida em português.
- source_word: Οὐ λέγω σοι
  choice: Não lhe digo
  rationale: Reproduz diretamente o presente indicativo e o objeto indireto, sem substituir o pronome por Pedro.
- source_word: ἕως ἑπτάκις
  choice: até sete vezes
  rationale: Neste contexto numérico, “até” expressa com clareza o limite proposto, e “sete vezes” traduz o advérbio de frequência.
- source_word: ἀλλὰ
  choice: mas
  rationale: Expressa de modo simples o contraste adversativo estabelecido por Jesus.
- source_word: ἕως ἑβδομηκοντάκις ἑπτά
  choice: até setenta e sete vezes
  rationale: A expressão grega admite mais de uma análise; “setenta e sete vezes” é uma leitura direta possível, enquanto a alternativa tradicional é preservada em nota.
theological_decisions:
- issue: Expressão numérica ambígua no ensino de Jesus sobre o perdão
  choice: setenta e sete vezes
  alternative: setenta vezes sete
  rationale: A sintaxe de ἑβδομηκοντάκις ἑπτά permite ambas as interpretações. O texto principal adota “setenta e sete vezes” e a nota conserva a alternativa tradicional, sem transformar a declaração em um comentário interpretativo nem definir um limite teológico rígido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O presente histórico foi preservado; evitou-se explicitar “Pedro”, pois o grego emprega pronome.
