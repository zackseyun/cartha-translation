  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ κύριος τοῦ δούλου ἐκείνου ἀπέλυσεν αὐτόν, καὶ τὸ δάνειον ἀφῆκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that slave[a], moved with compassion[b], released him and forgave him the debt.
translation:
  language: pt
  text: Então, o senhor[a] daquele escravo, movido de compaixão, deixou-o ir e perdoou-lhe a dívida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dono”. O grego refere-se aqui ao senhor humano da parábola, não diretamente a Deus.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “o empréstimo” ou “o que havia sido emprestado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: movido de compaixão
  rationale: Expressa a profunda compaixão indicada pelo particípio de σπλαγχνίζομαι, em linguagem portuguesa natural e digna.
- source_word: δὲ
  choice: Então
  rationale: Neste contexto, δέ assinala a progressão da narrativa; “Então” comunica essa sequência com naturalidade.
- source_word: κύριος
  choice: senhor
  rationale: Refere-se ao senhor humano do escravo dentro da parábola. A inicial minúscula evita transformá-lo diretamente em título divino, enquanto preserva a relação expressa no grego.
- source_word: δοῦλου
  choice: escravo
  rationale: A condição de sujeição e a relação assimétrica de autoridade são relevantes nesta parábola; “escravo” preserva essa concretude social melhor que “servo”.
- source_word: ἀπέλυσεν αὐτόν
  choice: soltou-o
  rationale: Comunica que o senhor o deixou livre para ir, sem afirmar necessariamente uma manumissão definitiva, que o contexto não explicita.
- source_word: τὸ δάνειον
  choice: a dívida
  rationale: Embora δάνειον designe mais especificamente um empréstimo ou aquilo que foi emprestado, neste contexto trata-se da obrigação financeira que é perdoada; “dívida” produz a formulação portuguesa mais natural, com a precisão lexical preservada em nota.
- source_word: ἀφῆκεν αὐτῷ
  choice: perdoou-lhe
  rationale: ἀφίημι pode indicar perdoar, remitir ou cancelar. Com “a dívida” como objeto, “perdoou-lhe” mantém tanto a imagem financeira da parábola quanto sua ressonância com o tema do perdão em Mateus.
theological_decisions:
- issue: Possível leitura de κύριος como título divino
  choice: “senhor”, com inicial minúscula, referindo-se ao senhor humano da parábola
  alternative: “Senhor” como título divino; ou “dono”
  rationale: O referente narrativo imediato é o homem que exerce autoridade sobre o escravo. A tradução não deve identificar diretamente essa personagem com Deus, embora preserve a analogia teológica mais ampla da parábola.
- issue: Representação social de δοῦλος
  choice: “escravo”
  alternative: “servo”
  rationale: A relação de domínio e sujeição é significativa no contexto da dívida e da autoridade; suavizá-la como “servo” reduziria um aspecto concreto do texto.
- issue: Relação entre remissão financeira e perdão
  choice: “perdoou-lhe a dívida”
  alternative: “cancelou-lhe o empréstimo”
  rationale: A formulação escolhida preserva a obrigação financeira concreta e também a ressonância temática de ἀφίημι em Mateus, sem apagar que δάνειον é especificamente algo emprestado.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Movido de compaixão” conserva a força afetiva do original; “soltou-o” evita sugerir de modo indevido uma manumissão formal. As notas preservam a precisão e as ambiguidades lexicais relevantes.
