source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ δοῦλος προσεκύνει αὐτῷ λέγων· ⸀Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ πάντα ⸂ἀποδώσω σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the slave fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: pt
  text: 'Então o escravo caiu diante dele e se prostrou[a], dizendo: “Tenha paciência comigo, e eu lhe pagarei tudo”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “curvou-se profundamente diante dele”. O verbo grego também pode ser traduzido por “adorar” em outros contextos, mas aqui descreve um gesto de submissão respeitosa diante de um senhor humano.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσὼν
  choice: caiu
  rationale: O particípio aoristo de πίπτω descreve o movimento físico que antecede a súplica. “Caiu” é claro e, em conjunto com “se prostrou”, comunica a postura de profunda submissão.
- source_word: οὖν
  choice: Então
  rationale: Expressa de modo natural a consequência narrativa do que foi dito no versículo anterior, sem tornar a conexão excessivamente formal.
- source_word: δοῦλος
  choice: escravo
  rationale: O contexto ressalta a sujeição completa do homem ao senhor e a possibilidade de ele ser vendido por causa da dívida. “Escravo” preserva essa realidade social melhor que o termo mais brando “servo”.
- source_word: προσεκύνει
  choice: se prostrou
  rationale: Neste contexto, προσκυνέω indica homenagem e submissão corporal diante de um senhor humano, não necessariamente adoração religiosa. O pretérito perfeito produz uma narrativa natural em português, enquanto a nota preserva a amplitude lexical do verbo.
- source_word: λέγων
  choice: dizendo
  rationale: O particípio introduz diretamente as palavras do escravo. A natureza suplicante da fala fica evidente pela postura e pelo pedido, sem necessidade de acrescentar um verbo interpretativo.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Tenha paciência comigo
  rationale: A expressão pede tolerância e adiamento da cobrança. Esta formulação é corrente, clara e adequada ao contexto de dívida.
- source_word: πάντα
  choice: tudo
  rationale: O neutro plural tem sentido abrangente e se refere à totalidade da dívida; “tudo” é a forma mais natural em português.
- source_word: ἀποδώσω σοι
  choice: eu lhe pagarei
  rationale: No contexto financeiro, ἀποδίδωμι significa pagar ou restituir o que se deve. “Eu lhe pagarei tudo” expressa com clareza a promessa de pagamento integral.
theological_decisions:
- issue: Sentido de προσκυνέω diante de um senhor humano
  choice: Ato de prostração e homenagem
  alternative: “adorou-o”
  rationale: Dentro da parábola, o gesto é dirigido a um rei ou senhor humano e expressa submissão e súplica. Traduzir por “adorou-o” poderia introduzir uma conotação religiosa mais forte do que o contexto exige; a nota mantém visível a amplitude semântica do verbo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Escravo” preserva a condição social indicada por δοῦλος; “lhe pagarei tudo” soa natural e mantém a promessa enfática de quitação integral.
