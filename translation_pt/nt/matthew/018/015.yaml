id: MAT.18.15
reference: Matthew 18:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: pt
  text: Mas, se o seu irmão pecar contra você[a], vá e mostre-lhe o erro[b], em particular, só entre você e ele. Se ele lhe der ouvidos, você ganhou o seu irmão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos omitem “contra você”, ficando: “Se o seu irmão pecar”.'
    reason: textual_variant
  - marker: b
    text: Ou “repreenda-o” ou “aponte-lhe a falta”.
    reason: lexical_alternative
  - marker: c
    text: “Irmão” está no masculino singular; neste contexto, o termo pode referir-se de modo mais amplo a outro discípulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: pecar
  rationale: Preserva a força moral e religiosa de ἁμαρτάνω. O presente do subjuntivo em português expressa naturalmente a condição geral introduzida por ἐὰν com o aoristo do subjuntivo.
- source_word: εἰς σέ
  choice: contra você
  rationale: É o equivalente idiomático da relação adversativa indicada por εἰς com acusativo neste contexto. A expressão é mantida por constar do SBLGNT, e sua variação textual é registrada em nota.
- source_word: ἀδελφός σου
  choice: seu irmão
  rationale: Mantém o masculino singular do grego e sua linguagem de parentesco, sem substituir a forma da fonte por uma explicação interpretativa.
- source_word: ὕπαγε
  choice: vá
  rationale: Imperativo conciso e natural que introduz a ação requerida.
- source_word: ἔλεγξον
  choice: mostre-lhe o erro
  rationale: Expressa a ideia de trazer a falta à luz e fazê-la ver ao ofensor. É mais clara no português corrente que “repreenda-o” e menos potencialmente áspera que “censure-o”.
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: em particular, só entre você e ele
  rationale: Comunica tanto a privacidade quanto a exclusividade enfatizadas pela expressão grega, em formulação natural no português moderno.
- source_word: ἀκούσῃ
  choice: lhe der ouvidos
  rationale: Indica ouvir com receptividade, sem reduzir o sentido à mera percepção auditiva nem ampliá-lo para obediência completa.
- source_word: ἐκέρδησας
  choice: você ganhou
  rationale: Preserva a metáfora de κερδαίνω, sem acrescentar a ideia de “ganhar de volta”, que não está explicitada no verbo.
theological_decisions:
- issue: Alcance de ἀδελφός no contexto dos discípulos
  choice: seu irmão
  alternative: seu irmão ou sua irmã; outro discípulo
  rationale: A tradução conserva o masculino singular da fonte. A possível aplicação mais ampla à comunidade de discípulos é indicada em nota, sem ser inserida interpretativamente no texto.
- issue: Situação textual de εἰς σέ
  choice: incluir “contra você” no texto principal
  alternative: 'omitir a expressão: “se o seu irmão pecar”'
  rationale: O SBLGNT fornecido inclui εἰς σέ. Como a variante pode alterar o alcance da instrução, a leitura mais curta é preservada em nota.
- issue: Força de ἀκούω na reconciliação
  choice: lhe der ouvidos
  alternative: o ouvir; lhe obedecer
  rationale: A formulação conserva a tensão entre ouvir e acolher a correção, sem tornar explícita uma obediência plena que o verbo, por si só, não exige.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O tratamento por “você” evita arcaísmo; “lhe der ouvidos” mantém um tom bíblico ainda corrente. A construção “em particular, só entre você e ele” torna explícita, sem excesso interpretativo, a privacidade exigida pelo grego.
