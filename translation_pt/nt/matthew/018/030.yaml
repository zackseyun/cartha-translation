id: MAT.18.30
reference: Matthew 18:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἤθελεν, ἀλλὰ ἀπελθὼν ἔβαλεν αὐτὸν εἰς φυλακὴν ἕως ⸀οὗ ἀποδῷ τὸ ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/030.yaml
  text: But he was not willing[a]; instead[c][b], he went away and threw him into prison until he should pay what was owed.
translation:
  language: pt
  text: Mas ele não quis[a]. Pelo contrário, foi embora e o lançou na prisão[b], até que pagasse o que devia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se recusou”; em grego, literalmente, “não quis”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o pôs na prisão”. O verbo grego é mais forte, literalmente “lançou” ou “jogou na prisão”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a quantia devida” ou “a dívida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Mas ele
  rationale: O artigo substantivado retoma o primeiro servo, e δέ introduz contraste; em português, o pronome explícito produz uma frase natural.
- source_word: οὐκ ἤθελεν
  choice: não quis
  rationale: Preserva de modo conciso e idiomático a nuance volitiva de θέλω, sem explicitar além do grego a ideia mais forte de recusa.
- source_word: ἀλλὰ
  choice: Pelo contrário
  rationale: Expressa o contraste forte entre não atender ao pedido e tomar a atitude oposta.
- source_word: ἀπελθὼν
  choice: foi embora
  rationale: Converte o particípio aoristo em verbo finito natural em português e mantém a sequência da ação.
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  choice: o lançou na prisão
  rationale: Mantém a força de βάλλω sem recorrer à formulação menos digna ou potencialmente física demais 'jogou-o'.
- source_word: ἕως οὗ
  choice: até que
  rationale: Introduz naturalmente em português o limite temporal do encarceramento.
- source_word: ἀποδῷ
  choice: pagasse
  rationale: O pretérito imperfeito do subjuntivo após 'até que' é idiomático e representa a ação esperada que estabelecia o limite da prisão.
- source_word: τὸ ὀφειλόμενον
  choice: o que devia
  rationale: Reproduz o particípio substantivado, literalmente aquilo que era devido, sem restringi-lo obrigatoriamente a uma formulação nominal.
