  source_fidelity: 'O texto traduz com precisão todos os elementos essenciais do grego: o contraste de δέ e ἀλλά, a recusa volitiva de οὐκ ἤθελεν, a sequência expressa por ἀπελθών, a força de ἔβαλεν, o limite temporal de ἕως οὗ e o sentido substantivado de τὸ ὀφειλόμενον. “Até que pagasse” é uma construção portuguesa natural para o subjuntivo após “até que” e preserva a ação esperada como termo da prisão.'
  naturalness: A redação é clara, moderna e digna. “Mas ele não quis. Pelo contrário, foi embora e o lançou na prisão” tem boa fluidez em português internacional e é plenamente legível no Brasil. A pausa após “quis” não prejudica a conexão adversativa subsequente.
