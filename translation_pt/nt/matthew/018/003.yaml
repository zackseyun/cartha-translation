id: MAT.18.3
reference: Matthew 18:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: pt
  text: 'E disse: “Em verdade lhes digo: se vocês não se voltarem[a] e não se tornarem como as crianças[b], de modo nenhum entrarão[c] no Reino dos céus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O verbo também pode ser entendido em sentido passivo. Tradicionalmente: “não se converterem”.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “como as crianças”. O artigo grego pode apresentar as crianças como uma classe conhecida e talvez retome a criança que Jesus havia colocado no meio deles.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “jamais entrarão”. O grego emprega uma negação enfática.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Em verdade
  rationale: Reproduz de maneira clara e digna a fórmula solene que introduz uma declaração autorizada de Jesus, sem deixar o hebraísmo opaco para o leitor comum.
- source_word: στραφῆτε
  choice: se vocês não se voltarem
  rationale: Preserva a ideia de uma mudança decisiva de direção e a possível nuance intransitiva ou passiva do aoristo passivo, sem impor o termo teológico técnico “converter-se”.
- source_word: γένησθε
  choice: não se tornarem
  rationale: Expressa naturalmente a mudança de condição indicada por γίνομαι e mantém a coordenação com o verbo anterior.
- source_word: ὡς τὰ παιδία
  choice: como as crianças
  rationale: Traduz παιδία sem acrescentar qualidades como inocência ou humildade; o artigo pode apontar para as crianças como classe reconhecível e também ecoar a criança colocada por Jesus no meio dos discípulos.
- source_word: οὐ μὴ εἰσέλθητε
  choice: de modo nenhum entrarão
  rationale: Comunica em português atual a negação grega enfática οὐ μή, evitando tanto enfraquecê-la quanto recorrer a uma construção arcaica.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: Reino dos céus
  rationale: É a forma portuguesa consagrada e natural da expressão característica de Mateus, mantendo o plural do complemento grego na expressão idiomática.
theological_decisions:
- issue: Sentido da linguagem de mudança em στραφῆτε
  choice: “se voltarem”, sem tratá-lo como termo técnico
  alternative: “se converterem” ou “forem transformados”
  rationale: O grego exige uma mudança decisiva, mas não determina aqui a terminologia técnica de uma tradição teológica nem explicita de modo inequívoco a agência; a tradução e a nota preservam essa abertura.
- issue: Qualidade pressuposta na comparação com as crianças
  choice: Manter simplesmente “como as crianças”
  alternative: Explicitar “inocentes”, “humildes” ou “confiantes como crianças”
  rationale: O versículo faz a comparação, mas não especifica por si só qual característica infantil está em vista. A tradução não deve resolver essa tensão interpretativa.
- issue: Força da condição para entrar no Reino
  choice: Preservar a negação enfática em “de modo nenhum entrarão”
  alternative: “não entrarão”
  rationale: A construção οὐ μή é enfática. A formulação escolhida conserva essa força sem ampliar a afirmação para além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural e “lhes” como objeto indireto natural. “Em verdade” conserva a solenidade da fórmula de Jesus. A repetição de “não” diante dos dois verbos torna clara a abrangência da condição em português. As notas preservam a possível voz passiva de στραφῆτε, a referência aberta de τὰ παιδία e a força enfática de οὐ μή.
