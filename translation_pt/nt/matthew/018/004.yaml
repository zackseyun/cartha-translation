  rationale: Mantém o comparativo substantivado do grego, que expressa posição de maior grandeza.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: o Reino dos céus
  rationale: Conserva a formulação característica de Mateus sem substituir 'céus' por uma interpretação.
