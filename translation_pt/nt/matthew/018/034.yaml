  text: καὶ ὀργισθεὶς ὁ κύριος αὐτοῦ παρέδωκεν αὐτὸν τοῖς βασανισταῖς ἕως οὗ ἀποδῷ πᾶν τὸ ⸀ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
translation:
  language: pt
  text: E, indignado, o senhor dele o entregou aos torturadores, até que pagasse tudo o que devia.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Senhor”. O grego usa kýrios, que aqui se refere ao senhor do servo dentro da parábola.
    reason: alternative_reading
  - marker: b
    text: Ou “algozes” ou “atormentadores”; num sentido menos forte, “carcereiros”. O termo grego se refere a quem inflige tortura ou tormento, não apenas a guardas comuns.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: indignado
  rationale: O particípio aoristo tem função adverbial e descreve a reação irada do senhor. “Indignado” é natural em português e comunica uma ira provocada pela conduta anterior.
- source_word: κύριος
  choice: senhor
  rationale: No contexto da parábola, designa o superior humano do servo. “Senhor” preserva a relação de autoridade e a correspondência lexical com κύριος sem exigir que seja entendido aqui como título divino.
- source_word: παρέδωκεν
  choice: entregou
  rationale: Expressa a transferência da pessoa ao poder ou à custódia de outros e mantém o tom judicial do contexto.
- source_word: βασανισταῖς
  choice: torturadores
  rationale: O termo designa aqueles que infligem tortura ou tormento, sendo mais forte que uma referência genérica a carcereiros.
- source_word: ἕως οὗ
  choice: até que
  rationale: Reproduz naturalmente a construção temporal que estabelece o ponto final previsto.
- source_word: ἀποδῷ
  choice: pagasse
  rationale: O subjuntivo depois de ἕως οὗ apresenta o pagamento como o limite prospectivo da punição; o imperfeito do subjuntivo é a forma idiomática em português após o verbo principal no passado.
- source_word: πᾶν τὸ ὀφειλόμενον
  choice: tudo o que devia
  rationale: Mantém a amplitude da expressão substantivada e evita inserir explicitamente “dívida”, embora essa seja a realidade no contexto.
theological_decisions:
- issue: Se κύριος deve ser vertido como título divino ou como designação do superior humano na parábola
  choice: senhor
  alternative: Senhor; patrão; mestre
  rationale: A referência imediata é ao senhor do servo dentro da parábola. A minúscula assinala esse sentido narrativo sem impedir que o leitor reconheça as implicações teológicas da parábola.
- issue: A intensidade de βασανισταῖς no contexto de punição
  choice: torturadores
  alternative: algozes; atormentadores; carcereiros
  rationale: “Torturadores” preserva a força lexical e a severidade da advertência, sem transformar a linguagem da parábola numa definição de questões mais amplas sobre o juízo final.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, mantendo a progressão do grego. “Senhor” aparece em minúscula por sua função narrativa neste versículo.
