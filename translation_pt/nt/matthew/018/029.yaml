  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow slave fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: pt
  text: 'Então, o escravo que era seu companheiro caiu e lhe suplicava: “Tenha paciência comigo, e eu lhe pagarei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύνδουλος
  choice: companheiro de escravidão
  rationale: Expressa alguém submetido ao mesmo senhor e preserva a condição de escravidão saliente na parábola, com formulação natural em português.
- source_word: πεσὼν
  choice: caiu diante dele
  rationale: Conserva o gesto físico de humilhação e súplica; “diante dele” explicita naturalmente a relação espacial implícita no contexto.
- source_word: οὖν
  choice: Então
  rationale: Faz avançar a narrativa e funciona em português como conector sequencial natural.
- source_word: παρεκάλει
  choice: lhe suplicava
  rationale: O imperfeito indica uma súplica insistente ou continuada, e “suplicava” comunica adequadamente sua urgência.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Tenha paciência comigo
  rationale: É a formulação idiomática moderna para o pedido de tolerância ou espera dirigido a alguém.
- source_word: ἀποδώσω
  choice: eu lhe pagarei
  rationale: No contexto de uma dívida, “pagar” é natural e preciso; o pronome “lhe” preserva o destinatário expresso por σοι.
theological_decisions:
- issue: Tradução da linguagem de escravidão em σύνδουλος
  choice: companheiro de escravidão
  alternative: conservo; companheiro de serviço
  rationale: A expressão mantém a realidade social de pessoas escravizadas sob o mesmo senhor sem suavizá-la para mera prestação de serviço. Evita também o pouco conhecido “conservo” no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A construção mantém a súplica no imperfeito e evita vocabulário arcaico. Não há notas, portanto nenhum marcador é necessário.
