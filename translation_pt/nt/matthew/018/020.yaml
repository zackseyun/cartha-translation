  text: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/020.yaml
  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: pt
  text: Pois onde dois ou três estão reunidos em meu nome, ali estou no meio deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗ
  choice: onde
  rationale: Introduz uma oração locativa e mantém, de modo natural em português, a correlação com ἐκεῖ (“onde... ali”).
- source_word: γάρ
  choice: pois
  rationale: Preserva a função explicativa que liga esta afirmação ao contexto anterior.
- source_word: δύο ἢ τρεῖς
  choice: dois ou três
  rationale: Reproduz diretamente a expressão numérica grega.
- source_word: συνηγμένοι
  choice: estão reunidos
  rationale: Expressa naturalmente o estado resultante indicado pelo particípio perfeito passivo, sem especificar indevidamente quem os reuniu.
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: em meu nome
  rationale: É a formulação idiomática e tradicionalmente inteligível em português, mantendo em aberto nuances de referência, autoridade e lealdade associadas ao nome de Jesus.
- source_word: ἐκεῖ
  choice: ali
  rationale: 'Conserva a correlação locativa enfática do grego: “onde... ali”.'
- source_word: εἰμι
  choice: estou
  rationale: No contexto locativo, “estou” é a forma portuguesa natural do presente de εἰμί e evita acrescentar a interpretação explícita “estou presente”.
- source_word: ἐν μέσῳ αὐτῶν
  choice: no meio deles
  rationale: Preserva a imagem espacial do grego com linguagem corrente, clara e digna; “entre eles” também seria possível.
theological_decisions:
- issue: Implicação cristológica da presença de Jesus entre os discípulos reunidos
  choice: Traduzir diretamente como “ali estou no meio deles”.
  alternative: “Ali estou presente entre eles”, ou formulações vinculadas a uma doutrina sacramental ou eclesiológica específica.
  rationale: O texto afirma a presença de Jesus, mas não define seu modo metafísico. A tradução mantém a força da afirmação sem introduzir formulações confessionais posteriores.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção é concisa e digna; “no meio deles” mantém a imagem do original sem soar arcaica.
