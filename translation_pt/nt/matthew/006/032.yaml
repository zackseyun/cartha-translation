  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πάντα γὰρ ταῦτα τὰ ἔθνη ⸀ἐπιζητοῦσιν· οἶδεν γὰρ ὁ πατὴρ ὑμῶν ὁ οὐράνιος ὅτι χρῄζετε τούτων ἁπάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: pt
  text: Pois os gentios[a] buscam com empenho[b] todas essas coisas; pois o Pai celestial de vocês sabe que vocês precisam de todas essas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as nações” ou “os pagãos”. O termo grego pode designar as nações em geral, mas aqui provavelmente se refere aos que não pertenciam ao povo da aliança.
    reason: alternative_reading
  - marker: b
    text: Ou “buscam insistentemente” ou “procuram com empenho”. O verbo sugere uma busca dedicada ou persistente.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: os gentios
  rationale: No contexto, designa os não judeus em contraste com os discípulos de Jesus. “Gentios” preserva essa distinção histórico-social sem acrescentar a conotação depreciativa que “pagãos” pode ter.
- source_word: ἐπιζητοῦσιν
  choice: são buscadas com empenho
  rationale: A expressão comunica uma busca insistente ou dedicada. A construção passiva mantém o foco inicial do grego em “todas essas coisas” e produz uma formulação natural em português.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: o Pai celestial de vocês
  rationale: Formulação atual e clara que preserva tanto a relação expressa por ὑμῶν como a qualificação celestial.
- source_word: οἶδεν
  choice: sabe
  rationale: Embora οἶδα tenha forma de perfeito, possui sentido presente neste uso.
- source_word: χρῄζετε
  choice: vocês precisam
  rationale: Equivalente moderno, direto e natural do verbo grego.
- source_word: πάντα γὰρ ταῦτα ... τούτων ἁπάντων
  choice: todas essas coisas ... todas elas
  rationale: Preserva a abrangência e a retomada enfática do original, evitando uma repetição pesada em português.
- source_word: γὰρ ... γὰρ
  choice: pois ... pois
  rationale: Mantém explicitamente a dupla relação explicativa do texto grego.
theological_decisions:
- issue: Referente de τὰ ἔθνη no ensino de Jesus
  choice: os gentios
  alternative: as nações; os pagãos
  rationale: “Os gentios” conserva o contraste histórico entre os discípulos e os povos não judeus, sem transformar esse contraste numa condenação moral absoluta.
- issue: Intensidade de ἐπιζητοῦσιν
  choice: buscadas com empenho
  alternative: buscadas; procuradas insistentemente
  rationale: A tradução expressa a busca dedicada sugerida pelo verbo, sem elevar o sentido a uma ansiedade ou esforço extremo que o contexto não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para a segunda pessoa do plural e preserva a dupla explicação introduzida por γάρ.
