reference: Matthew 6:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου, ὡς ἐν οὐρανῷ καὶ ⸀ἐπὶ γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: pt
  text: Venha o teu reino; seja feita a tua vontade[a], assim no céu como na terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: «Venha o teu reino; seja feita a tua vontade, assim no céu como na terra», entendendo-se que «assim no céu como na terra» se aplica às duas petições.'
    reason: Leitura alternativa quanto ao alcance da expressão comparativa.
lexical_decisions:
- source_word: ἐλθέτω
  choice: Venha
  rationale: O imperativo aoristo na terceira pessoa expressa uma petição dirigida a Deus. Em português, «Venha o teu reino» preserva naturalmente a força volitiva e o tom de oração.
- source_word: βασιλεία
  choice: reino
  rationale: O termo pode designar tanto o domínio régio quanto o reino. «Reino» é claro, tradicional e adequado ao contexto de Mateus, sem excluir a ideia do governo real de Deus.
- source_word: γενηθήτω
  choice: seja feita
  rationale: O imperativo aoristo passivo de γίνομαι, junto de θέλημα, indica que a vontade de Deus se realize. «Seja feita» é idiomático, fiel e digno em português.
- source_word: θέλημα
  choice: vontade
  rationale: Abrange aquilo que alguém quer, deseja ou determina. «Vontade» conserva a amplitude lexical e o peso teológico sem especificação indevida.
- source_word: ὡς
  choice: assim ... como
  rationale: Introduz uma comparação. A construção portuguesa «assim no céu como também na terra» reproduz de modo natural a correlação implícita no grego.
- source_word: ἐν οὐρανῷ
  choice: no céu
  rationale: O singular com ἐν refere-se aqui à esfera celestial; «no céu» é a forma corrente e contextualmente apropriada.
- source_word: ἐπὶ γῆς
  choice: na terra
  rationale: Embora ἐπί com o genitivo tenha sentido locativo de «sobre», a expressão idiomática portuguesa para o contraste entre céu e terra é «na terra».
- source_word: καὶ
  choice: também
  rationale: Na comparação ὡς ... καί, «também» explicita naturalmente o segundo membro da correlação sem acrescentar conteúdo à sintaxe grega.
theological_decisions:
- issue: Alcance da expressão comparativa ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς
  choice: 'No texto principal, a expressão é ligada à petição mais próxima: «seja feita a tua vontade».'
  alternative: 'Entender «assim no céu como também na terra» como referente às duas petições anteriores: a vinda do reino e a realização da vontade de Deus.'
  rationale: A pontuação das edições gregas modernas é editorial. A ligação imediata com a oração precedente é gramaticalmente natural, mas a sintaxe permite um alcance mais amplo; por isso, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém a forma de oração na terceira pessoa («Venha», «seja feita») e evita tanto arcaísmos desnecessários quanto paráfrases interpretativas.
