  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: pt
  text: Mas busquem primeiro o Reino de Deus e a sua justiça[a], e todas essas coisas serão acrescentadas a vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”. A palavra grega pode indicar tanto justiça quanto retidão; aqui abrange a relação correta com Deus e a conduta de acordo com a vontade dele, não apenas a justiça judicial ou social.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: busquem
  rationale: O imperativo presente plural expressa uma orientação contínua de busca ativa. Em português, “busquem” é natural e conciso; a continuidade fica implícita no contexto, sem necessidade de explicitar “continuem buscando”.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste com a preocupação e a busca por necessidades materiais mencionadas no contexto anterior.
- source_word: πρῶτον
  choice: primeiro
  rationale: Preserva tanto a forma lexical quanto a ideia de prioridade, sem ampliar interpretativamente para “acima de tudo”.
- source_word: βασιλείαν
  choice: Reino
  rationale: “Reino” é a tradução tradicional e natural em Mateus, abrangendo tanto o domínio quanto o governo real de Deus. A inicial maiúscula favorece a leitura clara da expressão teológica estabelecida.
- source_word: δικαιοσύνην
  choice: justiça
  rationale: Em português, “justiça” conserva de modo natural a amplitude de δικαιοσύνη, incluindo retidão diante de Deus e conduta conforme a vontade dele; a nota registra “retidão” como alternativa útil.
- source_word: αὐτοῦ
  choice: dele
  rationale: Mantém o pronome do grego e sua referência contextual a Deus, sem substituir explicitamente por “de Deus”.
- source_word: ταῦτα πάντα
  choice: todas essas coisas
  rationale: Retoma claramente as necessidades materiais do contexto imediato — comida, bebida e roupa — e preserva a força demonstrativa.
- source_word: προστεθήσεται
  choice: serão acrescentadas
  rationale: Reproduz o futuro passivo e mantém a imagem verbal de algo acrescentado à busca prioritária.
- source_word: ὑμῖν
  choice: a vocês
  rationale: É a forma amplamente compreensível e natural para o dativo plural no português moderno internacional, com boa legibilidade brasileira.
theological_decisions:
- issue: Tradução de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: O termo grego pode indicar justiça ou retidão. Neste contexto mateano, abrange a conformidade com a vontade de Deus e a conduta correta, não apenas justiça judicial ou social. “Justiça” é a forma bíblica mais natural em português, enquanto a nota preserva a alternativa sem estreitar o sentido.
- issue: Referente de αὐτοῦ
  choice: dele
  alternative: de Deus
  rationale: O pronome é preservado como pronome, à semelhança do grego. O contexto identifica seu referente como Deus, sem necessidade de explicitação no texto principal.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Emprega “vocês” para o plural e conserva a concisão e o paralelismo do grego.
