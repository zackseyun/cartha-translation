  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: pt
  text: Portanto, não se preocupem com o amanhã, pois o amanhã se preocupará consigo mesmo. Bastam a cada dia os seus próprios problemas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Bastam a cada dia os seus próprios males.” A palavra grega também pode significar “mal”, mas aqui provavelmente se refere aos problemas ou às dificuldades do dia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε
  choice: não se preocupem
  rationale: No contexto de Mateus 6:25–34, o verbo se refere à preocupação ansiosa. A expressão é natural em português moderno e mantém a forma de proibição dirigida ao plural.
- source_word: εἰς τὴν αὔριον
  choice: com o amanhã
  rationale: Com μεριμνάω, a preposição indica aquilo para o qual se dirige a preocupação. “Com o amanhã” é idiomático e preserva a referência ao futuro.
- source_word: ἡ αὔριον
  choice: o amanhã
  rationale: O substantivo com artigo personifica o dia futuro. “O amanhã” preserva essa personificação de modo natural em português.
- source_word: μεριμνήσει αὑτῆς
  choice: se preocupará consigo mesmo
  rationale: Mantém a repetição do mesmo verbo e a personificação retórica. “Consigo mesmo” representa o pronome reflexivo feminino grego, concordando em português com “o amanhã”.
- source_word: ἀρκετὸν τῇ ἡμέρᾳ
  choice: Cada dia já tem ... suficientes
  rationale: A construção portuguesa comunica idiomaticamente que a carga própria de cada dia basta. “Já” explicita a força pragmática de suficiência sem acrescentar uma ideia estranha ao contexto.
- source_word: ἡ κακία αὐτῆς
  choice: problemas
  rationale: Embora κακία também possa significar “mal”, aqui designa com maior probabilidade a adversidade ou aflição própria do dia. “Problemas” é claro, corrente e adequado ao ensino sobre preocupação.
theological_decisions:
- issue: Sentido de κακία na máxima final
  choice: problemas
  alternative: mal
  rationale: O contexto trata da ansiedade diante das dificuldades futuras; por isso, o sentido contextual mais provável é adversidade ou aflição. A alternativa literal “mal” é preservada em nota para não apagar a amplitude lexical do grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “preocupar” e a personificação de “o amanhã” foram preservadas. A ordem final foi ajustada à naturalidade do português sem eliminar o sentido distributivo de cada dia.
