  text: τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/011.yaml
  text: Give us today our daily bread[a].
translation:
  language: pt
  text: Dá-nos hoje o nosso pão de cada dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o pão para hoje», «o pão para o dia que vem» ou «o pão de que precisamos». O adjetivo grego ἐπιούσιον é raro, e seu sentido exato é discutido.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ἄρτον ἡμῶν
  choice: o nosso pão
  rationale: ἄρτος designa literalmente pão e, embora possa representar alimento ou sustento de modo mais amplo, a imagem concreta deve ser preservada. O genitivo ἡμῶν é expresso naturalmente pelo possessivo «nosso».
- source_word: τὸν ἐπιούσιον
  choice: de cada dia
  rationale: ἐπιούσιος é um adjetivo raro e de sentido discutido. «De cada dia» é a formulação portuguesa mais reconhecida e comunica com naturalidade a dependência contínua de Deus, sem eliminar as principais possibilidades lexicais, registradas na nota.
- source_word: δὸς ἡμῖν
  choice: Dá-nos
  rationale: O imperativo aoristo de δίδωμι pede uma formulação direta. «Dá-nos» reproduz de modo conciso o verbo e o objeto indireto e é natural no registro de oração.
- source_word: σήμερον
  choice: hoje
  rationale: σήμερον significa diretamente «hoje»; a escolha preserva sua força temporal em português atual.
theological_decisions:
- issue: Sentido de ἐπιούσιον na oração do Senhor
  choice: de cada dia
  alternative: para hoje; para o dia que vem; necessário ao sustento
  rationale: O termo pode indicar o pão do presente dia, do dia seguinte ou o pão necessário. A tradução principal mantém a formulação tradicional e inteligível em português, enquanto a nota preserva a genuína incerteza lexical sem impor uma interpretação teológica específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Dá-nos» conserva a concisão e o caráter comunitário da petição; «pão de cada dia» mantém a expressão consagrada sem ocultar a ambiguidade do grego, explicitada em nota.
