  source_fidelity: A tradução transmite adequadamente a instrução sobre o jejum, o contraste com os hipócritas e a fórmula idiomática de recompensa plenamente recebida. Contudo, «para que as pessoas percebam que estão jejuando» desloca levemente a construção grega passiva («para que sejam vistos ... jejuando») para a percepção de um fato; uma formulação de visibilidade pública é mais próxima do original.
  naturalness: O registro é moderno, claro e apropriado. «Desfiguram o rosto» soa um pouco genérico em português e deixa menos explícita a referência aos rostos deles; «desfiguram o próprio rosto» preserva a imagem e é natural.
  terminology: «Jejuarem», «hipócritas», «Em verdade lhes digo» e «recompensa» são escolhas corretas e de registro bíblico atual. «As pessoas» representa adequadamente o sentido humano geral de τοῖς ἀνθρώποις.
