  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: pt
  text: 'E, sempre que jejuarem, não fiquem com aparência sombria como os hipócritas, pois eles desfiguram o próprio rosto para que as pessoas os vejam jejuando. Em verdade lhes digo: eles já receberam integralmente a sua recompensa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: E, sempre que jejuarem
  rationale: Ὅταν com o subjuntivo apresenta uma situação indefinida e recorrente; «sempre que» explicita esse valor. δέ conecta esta instrução às anteriores sem exigir contraste forte.
- source_word: μὴ γίνεσθε ... σκυθρωποί
  choice: não fiquem com aparência sombria
  rationale: Preserva a nuance ingressiva de γίνομαι e liga σκυθρωποί à expressão exterior deliberadamente abatida, em português natural.
- source_word: ὡς οἱ ὑποκριταὶ
  choice: como os hipócritas
  rationale: Equivalente comparativo direto e corrente.
- source_word: ἀφανίζουσιν ... τὰ πρόσωπα αὐτῶν
  choice: eles desfiguram o rosto
  rationale: Mantém a imagem concreta e o sentido contextual de alterar ou maltratar a aparência facial para evidenciar o jejum.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: para que as pessoas percebam que estão jejuando
  rationale: Expressa a finalidade marcada por ὅπως; φανῶσιν admite a ideia de tornar-se manifesto ou ser percebido, e ἄνθρωποι designa aqui as pessoas em geral.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Em verdade lhes digo
  rationale: Fórmula solene, digna e transparente, que conserva a força declarativa de ἀμήν.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: eles já receberam integralmente a sua recompensa
  rationale: 'ἀπέχω funciona como expressão de quitação: a recompensa já foi recebida por completo, sem saldo adicional implícito.'
theological_decisions:
- issue: Referente de τοῖς ἀνθρώποις
  choice: as pessoas
  alternative: os homens
  rationale: Neste contexto, ἄνθρωποι tem referência humana geral. «As pessoas» comunica naturalmente essa abrangência no português atual, sem acrescentar uma restrição masculina ausente da intenção do texto.
- issue: Força idiomática de ἀπέχουσιν
  choice: já receberam integralmente a sua recompensa
  alternative: têm a sua recompensa
  rationale: A formulação explicita a ideia comercial de recebimento completo e preserva o contraste contextual entre reconhecimento humano imediato e qualquer recompensa posterior.
- issue: Manifestação pública do jejum em φανῶσιν
  choice: para que as pessoas percebam que estão jejuando
  alternative: para parecer às pessoas que estão jejuando
  rationale: A opção escolhida evita sugerir necessariamente que o jejum seja falso; o alvo da crítica é tornar a prática visível para obter reconhecimento.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega «jejuarem», termo bíblico corrente e preciso; evita tanto coloquialismo excessivo quanto sintaxe arcaizante.
