id: MAT.6.1
reference: Matthew 6:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: pt
  text: Mas tenham cuidado para não praticar a justiça de vocês[a] diante das pessoas, com o propósito de serem vistos por elas; caso contrário, vocês não têm recompensa da parte do Pai de vocês, que está nos céus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os atos de justiça de vocês”. Uma variante textual traz “a esmola de vocês”.
    reason: Alternativa lexical e variante textual relevantes para o alcance de δικαιοσύνην.
  - marker: b
    text: Em grego, literalmente “nos céus”; algumas traduções empregam o singular “no céu”.
    reason: Preservação do plural da expressão grega.
lexical_decisions:
- source_word: Προσέχετε
  choice: tenham cuidado
  rationale: O imperativo presente plural expressa vigilância contínua. A formulação é natural em português moderno e mantém a força de advertência.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição com tom de contraste para a advertência deste versículo.
- source_word: δικαιοσύνην
  choice: justiça
  rationale: Mantém o sentido amplo do termo no texto crítico, aqui entendido como prática do que é justo, sem restringi-lo à esmola. A expressão concreta “atos de justiça” e a variante “esmola” são registradas em nota.
- source_word: μὴ ποιεῖν
  choice: não praticar
  rationale: O infinitivo com μή indica a ação que deve ser evitada; “praticar” comunica conduta religiosa ou moral de maneira mais natural do que o simples “fazer”.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: diante das pessoas
  rationale: Refere-se genericamente a observadores humanos, não apenas a homens do sexo masculino.
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: com o propósito de serem vistos por elas
  rationale: Preserva explicitamente tanto a finalidade da ação quanto a voz passiva do grego.
- source_word: εἰ δὲ μή γε
  choice: caso contrário
  rationale: Expressa de modo idiomático em português a consequência condicional da advertência.
- source_word: μισθὸν
  choice: recompensa
  rationale: No contexto da retribuição divina, “recompensa” é claro e evita a conotação estritamente trabalhista de “salário”.
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: junto ao Pai de vocês
  rationale: παρά com o dativo pode indicar proximidade ou esfera relacional. “Junto ao” preserva essa nuance sem excluir a ideia de que a recompensa procede do Pai.
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: que está nos céus
  rationale: Mantém o plural do grego e uma formulação compreensível e digna em português.
theological_decisions:
- issue: Alcance de δικαιοσύνην
  choice: “justiça” em sentido amplo, abrangendo a prática do que é justo
  alternative: “atos de justiça” ou “esmola”
  rationale: O texto da SBLGNT traz δικαιοσύνην, cujo alcance é mais amplo que a esmola. O contexto imediato pode favorecer ações piedosas concretas, mas essa especificação não deve ser imposta ao texto principal; a variante textual é preservada em nota.
- issue: Sentido de παρὰ τῷ πατρὶ ὑμῶν
  choice: “junto ao Pai de vocês”
  alternative: “da parte do Pai de vocês”
  rationale: A construção pode destacar a presença ou esfera do Pai e, no contexto da recompensa, também permitir uma nuance de origem. A tradução escolhida conserva essa tensão em vez de resolver a preposição exclusivamente como fonte.
- issue: Plural τοῖς οὐρανοῖς
  choice: “nos céus”
  alternative: “no céu”
  rationale: O plural reproduz a forma grega e o estilo característico de Mateus sem acrescentar uma construção cosmológica específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Emprega “vocês” para tornar explícito o plural dos verbos e pronomes gregos. Mantém “justiça” no texto principal, o presente em “não têm” e o plural “céus”.
