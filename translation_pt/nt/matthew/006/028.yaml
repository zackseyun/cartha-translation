  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: pt
  text: E por que vocês se preocupam com a roupa? Observem como crescem os lírios do campo:[a] eles não trabalham nem fiam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as flores silvestres do campo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: com a roupa
  rationale: O singular ἐνδύματος tem sentido coletivo neste contexto de provisão material; “a roupa” é natural em português e evita restringir o sentido a uma peça específica.
- source_word: τί μεριμνᾶτε
  choice: por que vocês se preocupam
  rationale: Aqui μεριμνάω expressa preocupação inquieta. “Preocupam-se” seria igualmente possível, mas “vocês se preocupam” tem ampla clareza e naturalidade.
- source_word: καταμάθετε
  choice: observem
  rationale: O imperativo pede observação atenta que conduz à compreensão. “Observem” comunica isso de modo conciso e natural; “considerem” também seria possível.
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: os lírios do campo
  rationale: κρίνα designa mais diretamente lírios, e τοῦ ἀγροῦ indica o campo ou ambiente aberto. A expressão tradicional continua clara e fiel.
- source_word: πῶς αὐξάνουσιν
  choice: como crescem
  rationale: αὐξάνω descreve aqui o crescimento natural das plantas; “crescem” é o equivalente direto e idiomático.
- source_word: οὐ κοπιῶσιν
  choice: não trabalham
  rationale: κοπιάω sugere trabalho árduo ou fatigante. Neste paralelismo, “trabalham” preserva o contraste com a provisão de Deus sem soar artificial.
- source_word: οὐδὲ νήθουσιν
  choice: nem fiam
  rationale: νήθω significa fiar fibras para produzir fio. “Fiam” conserva de forma breve e exata o paralelo grego.
theological_decisions:
- issue: Sentido de μεριμνάω no ensino de Jesus sobre a provisão
  choice: se preocupam
  alternative: ficam ansiosos
  rationale: O verbo indica preocupação inquieta, não simples atenção. “Preocupam-se” é natural e abrangente em português, sem transformar o versículo numa afirmação clínica sobre ansiedade.
- issue: Identificação de κρίνα
  choice: lírios
  alternative: flores silvestres
  rationale: “Lírios” é o sentido lexical mais direto. Como a identificação botânica pode ser mais ampla ou incerta, a alternativa é registrada em nota sem substituir o termo do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “vocês”. A ordem foi levemente ajustada para formar uma frase natural em português, sem perder a sequência lógica do grego.
