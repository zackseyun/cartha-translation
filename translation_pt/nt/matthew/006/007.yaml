id: MAT.6.7
reference: Matthew 6:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: pt
  text: E, quando orarem, não amontoem palavras vazias como os gentios[a], pois eles pensam que serão ouvidos por falarem muito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os pagãos”. O termo grego se refere literalmente aos gentios, isto é, aos povos que não faziam parte do povo da aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι
  choice: quando orarem
  rationale: O particípio é adverbial e introduz naturalmente a circunstância da ordem; esta formulação é corrente e clara em português.
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ dá continuidade às instruções de Jesus sem exigir um contraste forte.
- source_word: μὴ βατταλογήσητε
  choice: não amontoem palavras vazias
  rationale: O verbo raro provavelmente descreve fala vazia, mecânica ou verbosa. A escolha comunica tanto o excesso quanto a falta de conteúdo, sem sugerir que toda repetição sincera seja proibida.
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: como os gentios
  rationale: No contexto judaico, ἐθνικοί designa os não judeus, os povos de fora do povo da aliança; “gentios” mantém essa referência com menor carga interpretativa que “pagãos”.
- source_word: δοκοῦσιν
  choice: eles pensam
  rationale: Expressa de modo natural e preciso a suposição deles a respeito da oração.
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: por falarem muito
  rationale: A expressão indica que a abundância de palavras é, na visão deles, a causa ou o meio de serem ouvidos. A formulação é natural em português e conserva essa relação.
- source_word: εἰσακουσθήσονται
  choice: serão ouvidos
  rationale: Preserva o sentido passivo de receber audiência favorável sem acrescentar explicitamente a ideia mais forte de ter o pedido atendido.
theological_decisions:
- issue: Se Jesus proíbe toda repetição na oração ou especificamente a fala vazia e verbosa
  choice: A tradução “não amontoem palavras vazias” apresenta a proibição como dirigida à verbosidade vazia.
  alternative: “não fiquem repetindo palavras sem sentido” ou “não balbuciem”
  rationale: O verbo grego é raro e seu alcance exato é incerto. A formulação preserva a crítica à fala vazia, mecânica ou excessiva usada para obter atenção divina, sem transformar o versículo numa proibição inequívoca de toda oração repetida e sincera.
translation_notes:
  register: Português moderno, claro e digno, com construção compreensível tanto no Brasil quanto em outros contextos lusófonos. “Amontoem palavras vazias” conserva a imagem e evita o caráter excessivamente coloquial de “não fiquem tagarelando”. O marcador [a] aparece no texto principal.
