id: MAT.6.4
reference: Matthew 6:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: pt
  text: para que a sua ajuda aos pobres[a] fique em segredo; e seu Pai, que vê em segredo, recompensará[b] você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «esmola». O termo grego se refere especificamente à ajuda dada aos pobres.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «retribuirá».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: para que
  rationale: Introduz a finalidade e liga naturalmente o versículo à instrução anterior.
- source_word: ᾖ
  choice: fique
  rationale: Expressa de modo natural em português o subjuntivo exigido pela oração de finalidade, indicando que a ajuda deve permanecer fora da vista pública.
- source_word: ἐλεημοσύνη
  choice: ajuda aos pobres
  rationale: Comunica claramente o sentido específico de dar aos necessitados, sem recorrer ao termo tradicional e hoje por vezes depreciativo «esmola».
- source_word: ἐν τῷ κρυπτῷ
  choice: em segredo
  rationale: Reproduz com clareza a ideia de algo oculto da vista pública e preserva a repetição da mesma expressão nas duas orações.
- source_word: ὁ πατήρ σου
  choice: seu Pai
  rationale: Traduz o texto sem acrescentar «celestial», adjetivo que não aparece neste versículo.
- source_word: ὁ βλέπων
  choice: que vê
  rationale: Converte naturalmente o particípio substantivado grego em oração relativa, mantendo seu sentido perceptivo.
- source_word: ἀποδώσει
  choice: recompensará
  rationale: No contexto, expressa a resposta favorável de Deus sem definir a natureza ou o momento da recompensa.
- source_word: σοι
  choice: você
  rationale: Torna explícito e natural em português brasileiro o destinatário singular da recompensa.
theological_decisions:
- issue: Natureza da retribuição divina em ἀποδώσει
  choice: recompensará você
  alternative: lhe retribuirá
  rationale: «Recompensará» preserva a promessa de uma resposta favorável de Deus, mas não determina se ela será temporal, eterna, material ou espiritual. «Retribuirá» mantém mais diretamente a noção lexical de devolver conforme a ação.
translation_notes:
  register: Português moderno, digno e acessível, com ampla inteligibilidade e leitura natural no Brasil. A repetição de «em segredo» foi mantida por corresponder à estrutura enfática do grego.
