  source_fidelity: A tradução preserva adequadamente a relação de finalidade em «para que», o subjuntivo em «fique», o sentido concreto de ἐλεημοσύνη como ajuda dada aos pobres e a repetição enfática de «em segredo». «Seu Pai, que vê em segredo» representa naturalmente ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ, sem acrescentar «celestial». «Recompensará você» transmite de modo apropriado o sentido favorável contextual de ἀποδώσει σοι, sem definir a natureza da recompensa.
  naturalness: O texto é moderno, claro e de registro digno. «Ajuda aos pobres», «em segredo» e «recompensará você» são amplamente compreensíveis, com boa legibilidade brasileira e aceitável alcance internacional. A repetição de «em segredo» é natural e reflete deliberadamente a estrutura grega.
