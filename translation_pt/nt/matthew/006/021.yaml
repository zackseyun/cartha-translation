  text: ὅπου γάρ ἐστιν ὁ θησαυρός ⸀σου, ἐκεῖ ἔσται καὶ ἡ καρδία ⸁σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: pt
  text: Pois, onde está o seu tesouro, aí também estará o seu coração.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: onde
  rationale: Introduz uma oração relativa locativa e mantém com naturalidade a correlação «onde... aí».
- source_word: γάρ
  choice: pois
  rationale: Preserva a ligação explicativa com a instrução anterior sobre acumular tesouros.
- source_word: θησαυρός
  choice: tesouro
  rationale: Equivalente direto e corrente, capaz de conservar tanto o sentido concreto quanto a força metafórica no contexto.
- source_word: σου
  choice: seu
  rationale: Expressa a posse em relação a «tesouro» e «coração». Embora «seu» possa ser ambíguo fora de contexto, aqui a fala dirigida ao leitor torna a referência natural e clara.
- source_word: ἐκεῖ
  choice: aí
  rationale: Retoma «onde» de modo compacto e idiomático, preservando o paralelismo locativo do grego.
- source_word: ἔσται
  choice: estará
  rationale: Mantém explicitamente o futuro do verbo grego, sem convertê-lo em presente proverbial.
- source_word: καρδία
  choice: coração
  rationale: Termo tradicional e semanticamente amplo, abrangendo desejos, lealdade e orientação interior sem restringir o sentido a sentimentos.
- source_word: καὶ
  choice: também
  rationale: Conserva a relação aditiva entre a localização do tesouro e a do coração.
theological_decisions:
- issue: Força temporal de ἔσται em uma máxima de caráter sapiencial
  choice: 'Manter o futuro explícito: «estará»'
  alternative: 'Usar o presente: «está», apresentando a frase como princípio atemporal'
  rationale: O texto grego emprega uma forma futura. Preservá-la mantém a possível ideia dinâmica de que o coração acompanhará o lugar em que o tesouro estiver, sem reduzir a afirmação a uma descrição puramente estática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «onde estiver... estará» reproduz o futuro grego de maneira natural em português; o futuro do subjuntivo na oração introduzida por «onde» decorre da sintaxe portuguesa, enquanto «estará» corresponde diretamente a ἔσται.
