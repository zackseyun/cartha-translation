  source_fidelity: A tradução reproduz adequadamente a inferência de οὖν, a proibição, a comparação com o grupo referido no contexto, o conhecimento prévio do Pai e a anterioridade temporal. Contudo, «antes que o peçam a ele» introduz um objeto direto explícito («o») que não está expresso no grego e pode sugerir que se pede uma necessidade específica; αὐτόν é a pessoa a quem se dirige o pedido.
  naturalness: «Portanto, não se tornem semelhantes a eles» é claro e apropriado em português moderno. «Antes de lhe pedirem» é mais idiomático e evita a construção algo pesada «o peçam a ele».
