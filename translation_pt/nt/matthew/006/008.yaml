  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: pt
  text: Portanto, não se tornem semelhantes a eles, pois o Pai de vocês sabe do que vocês precisam antes de lhe pedirem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν
  choice: Portanto, não
  rationale: Preserva a inferência de οὖν e a proibição introduzida por μή, ligando o versículo à advertência anterior.
- source_word: ὁμοιωθῆτε
  choice: se tornem semelhantes
  rationale: Expressa de modo natural o aoristo passivo subjuntivo em uma proibição e mantém a ideia de conformar-se ao padrão deles.
- source_word: αὐτοῖς
  choice: a eles
  rationale: Retoma naturalmente as pessoas mencionadas no contexto imediato, sem explicitação desnecessária.
- source_word: οἶδεν
  choice: sabe
  rationale: Embora οἶδα tenha forma de perfeito, seu valor aqui é presente.
- source_word: ὁ πατὴρ ὑμῶν
  choice: o Pai de vocês
  rationale: Traduz exatamente a expressão grega, sem acrescentar “celestial”, ausente neste versículo.
- source_word: ὧν χρείαν ἔχετε
  choice: do que vocês precisam
  rationale: Construção portuguesa corrente e precisa para exprimir o conteúdo da necessidade.
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: antes que o peçam a ele
  rationale: Marca claramente a anterioridade temporal e conserva αὐτόν como objeto pessoal do pedido.
theological_decisions:
- issue: O conhecimento prévio de Deus em relação à oração
  choice: Afirmar diretamente que o Pai já conhece as necessidades antes do pedido.
  alternative: Acrescentar uma explicação de que a oração é relacional, e não informativa, ou explicitar uma doutrina de presciência exaustiva.
  rationale: O texto afirma o conhecimento prévio do Pai, mas não explica por que ainda se deve orar; a tradução preserva essa tensão sem impor uma solução doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” comunica naturalmente o plural de ὑμῶν e ὑμᾶς. Não foi necessária nota de rodapé, pois “se tornem semelhantes” preserva adequadamente a nuance de ὁμοιωθῆτε no corpo do texto.
