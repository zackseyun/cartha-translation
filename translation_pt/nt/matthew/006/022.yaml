id: MAT.6.22
reference: Matthew 6:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ⸂ᾖ ὁ ὀφθαλμός σου ἁπλοῦς⸃, ὅλον τὸ σῶμά σου φωτεινὸν ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: pt
  text: O olho é a lâmpada do corpo. Portanto, se o seu olho for saudável[a], todo o seu corpo ficará cheio de luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “simples”, “singular”, “límpido” ou “íntegro”; a palavra grega também pode transmitir a ideia de não estar dividido e, em alguns contextos, de ser generoso.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: lâmpada
  rationale: Designa normalmente uma lâmpada concreta, preservando a metáfora do olho como fonte de iluminação do corpo.
- source_word: σῶμα
  choice: corpo
  rationale: Equivalente direto e natural, adequado à imagem corporal do versículo.
- source_word: ὀφθαλμός
  choice: olho
  rationale: Mantém tanto a imagem física quanto sua dimensão metafórica.
- source_word: ἐὰν οὖν
  choice: Portanto, se
  rationale: Preserva o valor inferencial de οὖν e introduz naturalmente a condição expressa por ἐὰν.
- source_word: ἁπλοῦς
  choice: saudável
  rationale: No contraste entre um olho que ilumina e um olho ruim, descreve de modo claro o olho que funciona bem. A amplitude semântica do termo é preservada em nota.
- source_word: ὅλον
  choice: todo
  rationale: Expressa naturalmente o sentido abrangente do adjetivo no português atual.
- source_word: φωτεινὸν
  choice: cheio de luz
  rationale: Reproduz de modo idiomático a imagem de iluminação que alcança o corpo inteiro.
- source_word: ἔσται
  choice: ficará
  rationale: Conserva o valor futuro e soa natural com o predicativo “cheio de luz”.
theological_decisions:
- issue: Sentido de ἁπλοῦς na metáfora do olho
  choice: saudável no texto principal
  alternative: simples, singular, límpido, íntegro ou generoso
  rationale: O contexto imediato favorece a ideia de um olho em bom estado, em contraste com o “olho ruim” do versículo seguinte. Como o termo também pode sugerir singeleza, inteireza ou generosidade em outros contextos, a nota preserva essa tensão sem impor uma interpretação específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ficará cheio de luz” mantém o futuro grego e torna natural a imagem, sem resolver além do necessário a ambiguidade de ἁπλοῦς.
