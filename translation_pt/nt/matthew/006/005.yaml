id: MAT.6.5
reference: Matthew 6:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: pt
  text: 'E, quando orarem, não sejam como os hipócritas, pois eles gostam de ficar em pé e orar nas sinagogas e nas esquinas das ruas largas, para serem vistos pelas pessoas. Em verdade lhes digo: eles já receberam integralmente a sua recompensa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eles têm a sua recompensa”. O verbo grego pode indicar que um pagamento foi recebido por inteiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: quando orarem
  rationale: Expressa uma situação geral e recorrente de modo natural em português; o contexto deixa claro que não se trata de uma única ocasião.
- source_word: οὐκ ἔσεσθε ὡς
  choice: não sejam como
  rationale: Transmite a força instrutiva e proibitiva do futuro grego em português atual, sem a rigidez de uma reprodução formal como “não serão como”.
- source_word: ὑποκριταί
  choice: hipócritas
  rationale: É o equivalente corrente e contextualmente preciso para quem exibe devoção a fim de causar impressão.
- source_word: φιλοῦσιν
  choice: gostam
  rationale: Indica inclinação e prazer habitual na prática descrita. “Amam” seria possível, mas soaria excessivamente literal neste contexto em português.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: nas sinagogas
  rationale: Preserva a especificidade histórica e religiosa do ambiente judaico.
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: nas esquinas das ruas largas
  rationale: Mantém a referência às esquinas de vias públicas amplas, evitando reduzir πλατεῖαι simplesmente a “ruas”.
- source_word: ἑστῶτες προσεύχεσθαι
  choice: ficar em pé e orar
  rationale: Conserva a sequência e a imagem do grego, deixando claro que a crítica recai sobre a exibição pública, não sobre a postura em si.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: para serem vistos pelas pessoas
  rationale: Expressa diretamente a finalidade e traduz ἀνθρώποις em sentido humano genérico, sem restringi-lo a homens do sexo masculino.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Em verdade lhes digo
  rationale: Preserva o caráter solene da fórmula de Jesus em linguagem digna e amplamente compreensível.
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: já receberam integralmente a sua recompensa
  rationale: O verbo ἀπέχω pode funcionar como termo comercial para o recebimento completo de um pagamento; “já” comunica que a aprovação pública constitui a recompensa que obtiveram.
theological_decisions:
- issue: Sentido genérico de ἀνθρώποις
  choice: pessoas
  alternative: homens
  rationale: No contexto, o substantivo abrange observadores humanos em geral. “Pessoas” preserva essa extensão sem introduzir uma limitação masculina.
- issue: Força de ἀπέχουσι na declaração sobre a recompensa
  choice: já receberam integralmente a sua recompensa
  alternative: têm a sua recompensa
  rationale: A formulação principal comunica a possível nuance comercial de pagamento quitado, mas a nota registra a tradução menos interpretativa e preserva a faixa semântica do verbo.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas verbais no plural sem explicitar “vocês”. A expressão “ruas largas” mantém a imagem histórica das vias públicas amplas; “ficar em pé e orar” preserva a ordem do grego sem sugerir que a postura, por si só, seja condenada.
