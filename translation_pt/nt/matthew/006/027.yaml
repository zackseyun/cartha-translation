  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: pt
  text: E quem de vocês, por se preocupar, pode acrescentar um côvado à duração da própria vida?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à própria estatura”. A palavra grega pode indicar idade ou duração da vida, mas também estatura.'
    reason: Preserva a ambiguidade lexical genuína de ἡλικία sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: E quem de vocês
  rationale: A expressão é uma pergunta idiomática com o sentido de “quem entre vocês”. δέ funciona aqui como conexão leve com o ensino anterior, bem representada por “E”.
- source_word: μεριμνῶν
  choice: por se preocupar
  rationale: O particípio indica o meio pelo qual se tentaria obter o resultado. “Por se preocupar” é natural em português e mantém o sentido de ansiedade ou preocupação presente no contexto.
- source_word: δύναται προσθεῖναι
  choice: pode acrescentar
  rationale: Preserva de modo claro e corrente as ideias gregas de capacidade e adição.
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: à duração da própria vida
  rationale: ἡλικία pode designar idade, duração da vida ou estatura. No contexto da preocupação com a vida, “duração da própria vida” comunica bem a leitura escolhida; “própria” retoma naturalmente o sujeito genérico em português.
- source_word: πῆχυν ἕνα
  choice: um côvado
  rationale: Mantém a medida concreta do original e a imagem deliberadamente metafórica de acrescentar uma medida de comprimento à vida.
theological_decisions:
- issue: Sentido de ἡλικία neste dito
  choice: duração da vida
  alternative: estatura
  rationale: A leitura ligada à duração da vida se harmoniza com o contexto imediato sobre a preocupação com a vida e conserva a tensão da imagem de medi-la em côvados. Como “estatura” também é lexicalmente possível e tradicional, essa alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita linguagem excessivamente técnica; “côvado” é mantido por ser parte essencial da imagem do original.
