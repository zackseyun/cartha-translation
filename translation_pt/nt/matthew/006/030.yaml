id: MAT.6.30
reference: Matthew 6:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: pt
  text: Mas, se Deus veste assim a erva do campo, que hoje existe e amanhã é lançada no forno[a], não vestirá muito mais vocês, que têm pouca fé?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “forno” era usado para assar; ervas e plantas secas do campo podiam servir de combustível.
    reason: cultural_note
  - marker: b
    text: 'Ou: “vocês de pouca fé”. O termo grego é um vocativo plural, uma forma de tratamento direto que repreende a confiança insuficiente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χόρτον τοῦ ἀγροῦ
  choice: a erva do campo
  rationale: χόρτος pode designar erva, capim ou vegetação rasteira. “Erva do campo” é natural em português e mantém a imagem ampla da vegetação passageira sem especificar flores.
- source_word: σήμερον ὄντα
  choice: que hoje existe
  rationale: Reproduz de modo idiomático o particípio ὄντα (“sendo/existindo”) e destaca a existência presente e breve da erva sem acrescentar a ideia específica de estar viva.
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: amanhã é lançada no forno
  rationale: κλίβανος é um forno, especialmente de assar, e não necessariamente uma fornalha. A voz passiva e o contraste temporal são preservados.
- source_word: οὕτως ἀμφιέννυσιν
  choice: veste assim
  rationale: ἀμφιέννυμι significa vestir ou cobrir. “Veste assim” conserva a metáfora desenvolvida no contexto e a posição enfática de οὕτως.
- source_word: οὐ πολλῷ μᾶλλον
  choice: não vestirá muito mais
  rationale: Mantém a pergunta retórica e o argumento do menor para o maior em português corrente, suprindo naturalmente o verbo subentendido diante de ὑμᾶς.
- source_word: ὑμᾶς
  choice: vocês
  rationale: O pronome é plural. “Vocês” oferece ampla legibilidade brasileira e deixa claro que Jesus se dirige ao grupo de discípulos.
- source_word: ὀλιγόπιστοι
  choice: gente de pouca fé
  rationale: O vocativo plural exprime uma repreensão direta por confiança insuficiente. “Gente de pouca fé” é atual, compreensível e evita tanto o arcaísmo de “ó” quanto uma leitura como simples descrição indireta.
- source_word: εἰ δὲ
  choice: Mas, se
  rationale: δέ introduz uma leve transição contrastiva no desenvolvimento do argumento; “Mas, se” preserva essa relação com naturalidade.
theological_decisions:
- issue: Argumento sobre a provisão divina, do menor para o maior
  choice: Manter como pergunta retórica a afirmação de que Deus cuidará ainda mais dos discípulos do que da erva passageira.
  alternative: Converter a pergunta em afirmação declarativa.
  rationale: A construção grega com οὐ e o vocativo final sustenta uma pergunta que espera resposta positiva. Essa forma conserva a exortação de Jesus sem ampliar a afirmação para além do texto.
- issue: Sentido de ὀλιγόπιστοι
  choice: Entender como repreensão direta por fé ou confiança insuficiente.
  alternative: Tratar como rótulo absoluto de ausência de fé.
  rationale: O composto indica pouca fé, não necessariamente inexistência de fé. A tradução preserva a tensão entre a condição de discípulos e sua confiança inadequada.
translation_notes:
  register: 'Português moderno, digno e de leitura ampla, com preferência por “vocês” para explicitar o plural. A construção mantém a imagem concreta do campo e do forno, a pergunta retórica e a repreensão final. Os marcadores foram associados ao conteúdo pertinente: a nota cultural ao forno e a alternativa lexical ao vocativo.'
