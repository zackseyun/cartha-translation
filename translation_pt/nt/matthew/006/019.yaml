source:
  edition: SBLGNT
  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: pt
  text: Não acumulem para vocês tesouros na terra, onde a traça e a deterioração os destroem, e onde ladrões arrombam e roubam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: Não acumulem
  rationale: O imperativo presente com μή expressa proibição; “acumular” comunica naturalmente a ideia de ajuntar e guardar riquezas.
- source_word: ὑμῖν
  choice: para vocês
  rationale: O dativo tem sentido reflexivo ou de benefício, indicando que a acumulação é feita para os próprios ouvintes.
- source_word: θησαυροὺς
  choice: tesouros
  rationale: Equivalente direto que preserva a relação lexical com o verbo e abrange bens terrenos valorizados, não apenas dinheiro.
- source_word: ἐπὶ τῆς γῆς
  choice: na terra
  rationale: Forma idiomática em português que mantém o contraste espacial com o céu no versículo seguinte.
- source_word: σὴς
  choice: traça
  rationale: Designa a traça que danifica roupas e outros bens armazenados.
- source_word: βρῶσις
  choice: deterioração
  rationale: O substantivo pode indicar consumo, corrosão ou desgaste; “deterioração” preserva essa amplitude melhor que o tradicional “ferrugem”.
- source_word: ἀφανίζει
  choice: destroem
  rationale: O verbo indica fazer desaparecer, arruinar ou destruir; o plural português concorda naturalmente com os dois agentes coordenados.
- source_word: κλέπται
  choice: ladrões
  rationale: Equivalente lexical direto e corrente.
- source_word: διορύσσουσιν
  choice: arrombam
  rationale: Embora literalmente signifique “escavam através”, descreve a invasão mediante a abertura de uma passagem na parede; “arrombam” comunica com naturalidade a ação criminosa sem restringi-la a uma porta.
- source_word: κλέπτουσιν
  choice: roubam
  rationale: Equivalente verbal direto e idiomático em português.
theological_decisions:
- issue: Alcance de ἐπὶ τῆς γῆς
  choice: na terra
  alternative: sobre a terra
  rationale: “Na terra” mantém o contraste concreto com o céu no contexto imediato e evita introduzir uma distinção teológica não explicitada pelo texto.
- issue: Sentido de βρῶσις
  choice: deterioração
  alternative: ferrugem
  rationale: “Ferrugem” é uma interpretação tradicional possível, mas o termo grego é mais amplo e pode denotar aquilo que consome ou causa desgaste. “Deterioração” preserva melhor essa abrangência.
translation_notes:
  register: Português moderno, claro e digno, com forma plural inclusiva “vocês”, de ampla legibilidade brasileira. A construção mantém o paralelismo das duas orações introduzidas por “onde” e evita linguagem arcaica.
