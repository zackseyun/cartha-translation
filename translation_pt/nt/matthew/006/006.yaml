reference: Matthew 6:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: pt
  text: Mas você, quando orar, entre no seu quarto particular[a] e, depois de fechar a porta, ore ao seu Pai, que está em secreto; e seu Pai, que vê em secreto, recompensará[b] você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cômodo interno”, “quarto reservado” ou “depósito”. O termo grego se refere a um cômodo interior usado para privacidade ou armazenamento.
    reason: lexical_alternative
  - marker: b
    text: Ou “retribuirá a você”. O verbo grego pode significar “dar em retorno”, “retribuir” ou “recompensar”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Mas você
  rationale: O pronome enfático, junto com δέ, estabelece contraste com os hipócritas mencionados no versículo anterior. A formulação preserva essa ênfase de modo natural em português.
- source_word: ὅταν προσεύχῃ
  choice: quando orar
  rationale: ὅταν com o subjuntivo expressa uma circunstância temporal geral ou recorrente. 'Quando orar' é natural e mantém esse sentido.
- source_word: εἴσελθε εἰς τὸ ταμεῖόν σου
  choice: entre no seu quarto reservado
  rationale: O imperativo indica entrar em um espaço interior. ταμεῖον pode designar um cômodo interno usado para armazenamento ou privacidade; 'quarto reservado' comunica sobretudo o isolamento exigido pelo contexto sem sugerir o sentido moderno de guarda-roupa.
- source_word: κλείσας τὴν θύραν σου
  choice: depois de fechar a porta
  rationale: O particípio aoristo apresenta o fechamento da porta como anterior à oração. A tradução explicita naturalmente essa sequência.
- source_word: πρόσευξαι τῷ πατρί σου
  choice: ore a seu Pai
  rationale: Mantém o imperativo simples e a designação relacional do texto, sem acrescentar 'celestial', ausente neste versículo.
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: que está em secreto
  rationale: Preserva a ideia de ocultamento e a ambiguidade entre presença no lugar secreto e presença não manifesta, além de permitir a repetição retórica da expressão.
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: que vê em secreto
  rationale: Mantém de forma concisa a repetição de ἐν τῷ κρυπτῷ, sem acrescentar um objeto como 'o que é feito'.
- source_word: ἀποδώσει σοι
  choice: recompensará você
  rationale: No contexto, ἀποδίδωμι descreve a resposta favorável do Pai e pode ser traduzido por 'recompensar', embora também admita o sentido de 'retribuir'; a alternativa é registrada em nota.
theological_decisions:
- issue: Sentido da expressão repetida ἐν τῷ κρυπτῷ
  choice: em secreto nas duas ocorrências
  alternative: no lugar secreto; em particular; o que é feito em secreto
  rationale: A repetição destaca o contraste entre a oração oculta e a exibição pública. A mesma expressão em português conserva a ligação retórica e evita restringir o grego a um sentido exclusivamente locativo ou adverbial.
- issue: Designação de Deus como πατήρ
  choice: Pai
  alternative: Pai celestial
  rationale: O texto diz simplesmente 'seu Pai'. A tradução mantém a linguagem relacional de Jesus sem importar uma expansão de outros contextos.
- issue: Natureza da resposta expressa por ἀποδώσει
  choice: recompensará
  alternative: retribuirá; dará em retorno
  rationale: A escolha comunica uma resposta divina favorável sem especificar em que consiste a recompensa. A nota preserva a amplitude lexical do verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal e as formas verbais evitam regionalismos marcados. 'Quarto reservado' é acompanhado de nota para preservar a extensão semântica de ταμεῖον; 'em secreto' mantém deliberadamente a repetição e a ambiguidade do original.
