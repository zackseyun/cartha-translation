  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: pt
  text: 'Observem as aves do céu[a]: elas não semeiam, não colhem nem ajuntam em celeiros; e o Pai celestial de vocês as alimenta. Será que vocês não valem muito mais do que elas?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “as aves do firmamento” ou, tradicionalmente, “as aves do ar”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Será que vocês não têm muito mais valor do que elas?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: Observem
  rationale: O imperativo aoristo convoca os ouvintes a dirigir atentamente o olhar para as aves. “Observem” é natural em português e comunica mais claramente essa atenção deliberada do que o simples “olhem”.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: as aves do céu
  rationale: “Aves” traduz o substantivo referente a criaturas voadoras, e “do céu” preserva de modo direto τοῦ οὐρανοῦ, entendido aqui como o espaço visível acima da terra.
- source_word: ὅτι
  choice: ': elas'
  rationale: Neste contexto, ὅτι introduz aquilo que deve ser observado nas aves. Os dois-pontos e a retomada pronominal produzem uma construção natural em português sem decidir rigidamente entre o valor explicativo (“porque”) e o declarativo (“que”).
- source_word: οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν
  choice: não semeiam, não colhem nem ajuntam
  rationale: A formulação mantém a sequência agrícola e a repetição negativa do grego, com coordenação corrente em português.
- source_word: εἰς ἀποθήκας
  choice: em celeiros
  rationale: “Celeiros” designa naturalmente locais onde se guarda a produção agrícola e preserva a imagem rural.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: o Pai celestial de vocês
  rationale: A expressão conserva tanto a relação de Pai quanto a qualificação celestial. “De vocês” oferece ampla clareza e legibilidade brasileira.
- source_word: τρέφει
  choice: alimenta
  rationale: O verbo indica que Deus fornece alimento às aves; “alimenta” é direto, corrente e semanticamente preciso.
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: Será que vocês não valem muito mais do que elas?
  rationale: A pergunta retórica espera resposta afirmativa. “Valem muito mais” expressa com naturalidade a superioridade comparativa indicada por μᾶλλον διαφέρετε, sem acrescentar a razão teológica dessa diferença.
theological_decisions:
- issue: O valor relativo dos seres humanos e das aves no argumento de Jesus
  choice: A pergunta afirma que os ouvintes têm valor muito maior do que as aves diante do cuidado de Deus, sem explicar a base doutrinária desse valor.
  alternative: Explicitar que esse valor decorre da imagem de Deus ou exclusivamente de uma relação de aliança.
  rationale: O versículo estabelece a comparação, mas não fornece sua fundamentação teológica. A tradução preserva a afirmação sem importar uma explicação externa.
- issue: Relação entre o trabalho das aves e a provisão divina
  choice: Manter lado a lado a ausência das atividades agrícolas humanas e o ato do Pai de alimentar as aves.
  alternative: Parafrasear como se as aves não realizassem qualquer atividade ou como se o texto condenasse o planejamento humano.
  rationale: O texto menciona especificamente semear, colher e armazenar; não formula uma doutrina completa sobre trabalho ou planejamento. A tradução evita ampliar a afirmação.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa inteligibilidade brasileira. O plural “vocês” corresponde aos destinatários plurais. Os dois-pontos evitam a construção pouco natural “observem... que elas” e preservam a possível nuance declarativa ou explicativa de ὅτι. “No entanto” torna clara a contraposição implícita antes da provisão do Pai, sem alterar o argumento.
