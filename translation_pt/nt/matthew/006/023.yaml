id: MAT.6.23
reference: Matthew 6:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: pt
  text: Mas, se o seu olho for mau[a], todo o seu corpo ficará em trevas. Portanto, se a luz que há em você é escuridão, quão grande é essa escuridão!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “maligno”, “doente” ou “defeituoso”; possivelmente “mesquinho”, considerando o uso idiomático de “olho” e o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρός
  choice: mau
  rationale: “Mau” preserva a amplitude do termo grego, que pode indicar algo ruim, maligno, defeituoso ou, no idioma do “olho”, uma disposição mesquinha. Evita limitar a metáfora a apenas uma dessas nuances.
- source_word: σκοτεινός
  choice: em trevas
  rationale: A expressão predicativa portuguesa “ficará em trevas” comunica naturalmente o estado de escuridão do corpo sem perder a força metafórica do adjetivo grego.
- source_word: φῶς
  choice: luz
  rationale: Tradução direta que mantém intacta a contraposição metafórica entre luz e escuridão.
- source_word: σκότος
  choice: escuridão
  rationale: Mantém a imagem e a repetição culminante do texto grego, em contraste com “luz”.
- source_word: πόσον
  choice: quão grande
  rationale: Na oração exclamativa elíptica, expressa intensidade ou grau; “quão grande” reproduz com naturalidade a força da advertência.
- source_word: ὀφθαλμός
  choice: olho
  rationale: Preserva a imagem corporal empregada para falar de percepção, intenção e orientação moral.
- source_word: ὅλον τὸ σῶμά σου
  choice: todo o seu corpo
  rationale: Formulação direta e natural que conserva a ênfase totalizante de ὅλον.
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: a luz que há em você
  rationale: Reproduz claramente a construção grega sem interpretá-la como uma doutrina específica de “luz interior”.
theological_decisions:
- issue: Sentido da metáfora do “olho mau”
  choice: Manter no texto a expressão ampla “olho mau”.
  alternative: “olho maligno”, “olho doente/defeituoso” ou “olho mesquinho”.
  rationale: O contexto de Mateus 6:19–24 admite nuances sobrepostas de corrupção moral, percepção distorcida e possível avareza ou falta de generosidade. A tradução principal preserva essa tensão, e a nota registra as possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Seu/você” oferece naturalidade contemporânea; a cadência solene da exclamação final é preservada. O marcador [a] aparece imediatamente após a expressão a que se refere.
