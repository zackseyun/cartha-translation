  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: pt
  text: E não nos conduzas à tentação,[a] mas livra-nos do Maligno.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «provação» ou «prova». A palavra grega pode se referir tanto à tentação como a uma prova ou provação.
    reason: lexical_alternative
  - marker: b
    text: Ou «do mal». A expressão grega pode ser entendida pessoalmente («o Maligno») ou impessoalmente («o mal»).
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: não nos conduzas
  rationale: Preserva a forma direta do pedido em oração e o sentido básico de levar ou conduzir para uma situação, sem introduzir a paráfrase interpretativa «não permitas que».
- source_word: πειρασμόν
  choice: tentação
  rationale: É a tradução natural e consagrada no contexto da oração, enquanto a nota preserva o alcance semântico que também inclui prova ou provação.
- source_word: ῥῦσαι
  choice: livra-nos
  rationale: Expressa de modo idiomático, digno e corrente o pedido de resgate ativo dirigido a Deus.
- source_word: τοῦ πονηροῦ
  choice: do Maligno
  rationale: A forma grega com artigo admite referência pessoal ao maligno e também o sentido impessoal de mal. A leitura pessoal é adotada no texto, sem ocultar a alternativa genuína, registrada em nota.
theological_decisions:
- issue: Referência de τοῦ πονηροῦ
  choice: do Maligno
  alternative: do mal
  rationale: O genitivo grego pode ser masculino, designando o Maligno, ou neutro, designando o mal. O texto principal mantém a leitura pessoal, contextualmente plausível, e a nota conserva explicitamente a ambiguidade teológica e gramatical.
- issue: Alcance de πειρασμός
  choice: tentação
  alternative: provação ou prova
  rationale: O termo pode indicar tanto incitação ao pecado como uma experiência de teste. «Tentação» funciona naturalmente no texto principal, mas não esgota o sentido possível do grego.
translation_notes:
  register: Português moderno, claro e solene, com cadência adequada à oração e ampla legibilidade brasileira. Emprega «conduzas» e «livra-nos» por serem formas naturais e dignas, sem recorrer a paráfrases que resolvam as ambiguidades do original.
