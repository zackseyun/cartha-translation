  text: καὶ ἄφες ἡμῖν τὰ ὀφειλήματα ἡμῶν, ὡς καὶ ἡμεῖς ⸀ἀφήκαμεν τοῖς ὀφειλέταις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/012.yaml
  text: And forgive us our debts[b][a], as we also have forgiven our debtors.
translation:
  language: pt
  text: E perdoa-nos as nossas dívidas[a], assim como nós também já perdoamos[b] aos nossos devedores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ofensas»; mais literalmente, «dívidas». O grego mantém a imagem daquilo que é devido, referindo-se aqui a pecados ou ofensas.
    reason: lexical_alternative
  - marker: b
    text: Ou simplesmente «perdoamos». O verbo grego apresenta a ação como realizada; «já» explicita essa nuance, pois em português «perdoamos» pode ser tanto presente quanto pretérito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: perdoa
  rationale: O imperativo aoristo de ἀφίημι, em uma oração e junto de dívidas morais, pede perdão; «perdoa» é natural e preserva a força do pedido sem reduzi-lo a uma liberação meramente financeira.
- source_word: τὰ ὀφειλήματα
  choice: as nossas dívidas
  rationale: ὀφειλήματα significa literalmente aquilo que é devido. «Dívidas» conserva a metáfora do original e sua ligação lexical com «devedores», enquanto o contexto aponta para pecados ou ofensas.
- source_word: ὡς
  choice: assim como
  rationale: Introduz uma comparação entre o perdão pedido a Deus e o perdão concedido por quem ora. «Assim como» expressa claramente essa relação sem definir além do texto a natureza exata dela.
- source_word: καὶ ἡμεῖς
  choice: nós também
  rationale: A combinação do segundo καί com o pronome explícito ἡμεῖς dá destaque inclusivo ao sujeito humano; «nós também» preserva essa ênfase em português natural.
- source_word: ἀφήκαμεν
  choice: já perdoamos
  rationale: O aoristo indicativo apresenta o perdão concedido como ação realizada. Como «perdoamos» em português pode ser presente ou pretérito, «já» torna perceptível a perspectiva de ação concluída, sem recorrer ao menos natural «temos perdoado».
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: aos nossos devedores
  rationale: «Devedores» mantém o cognato e a coerência da metáfora com «dívidas»; no contexto, refere-se às pessoas que ofenderam ou pecaram contra quem ora.
theological_decisions:
- issue: Metáfora moral de ὀφειλήματα
  choice: Manter «dívidas» no texto principal como metáfora de pecados ou ofensas.
  alternative: «ofensas» ou «pecados»
  rationale: O grego emprega linguagem de dívida, não o termo geral para pecado. Preservar essa imagem mantém a transparência ao original e evita substituir a metáfora por sua interpretação, que é indicada em nota.
- issue: Aspecto temporal de ἀφήκαμεν
  choice: Traduzir por «já perdoamos», apresentando a ação como realizada.
  alternative: «perdoamos» ou «temos perdoado»
  rationale: O aoristo permite uma tradução pelo pretérito simples. O advérbio «já» evita a ambiguidade morfológica de «perdoamos» em português e expressa conclusão, sem transformar o verbo em uma ação necessariamente contínua ou repetida.
- issue: Relação indicada por ὡς
  choice: Conservar a comparação em «assim como», sem explicar se ela expressa medida, correspondência, condição ou evidência.
  alternative: Paráfrases como «na medida em que» ou «porque»
  rationale: O texto estabelece uma relação entre o perdão divino pedido e o perdão humano concedido, mas não a define aqui com maior precisão. Uma paráfrase resolveria indevidamente uma tensão teológica genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo entre «dívidas» e «devedores» e evita linguagem litúrgica arcaizante. A colocação pronominal «perdoa-nos» mantém um tom solene, mas corrente em textos bíblicos.
