id: MAT.6.24
reference: Matthew 6:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: pt
  text: Ninguém pode servir a dois senhores, pois ou odiará um e amará o outro, ou se apegará a um e desprezará o outro. Vocês não podem servir a Deus e a Mamom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «riqueza» ou «dinheiro». O grego emprega o termo emprestado «Mamom», que pode personificar as riquezas como um senhor rival.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Ninguém
  rationale: Expressa de modo natural e direto a negação universal do pronome grego.
- source_word: δύναται / δύνασθε
  choice: pode / não podem
  rationale: O verbo indica capacidade ou possibilidade; em português atual, «poder» comunica isso com clareza e preserva a repetição do texto.
- source_word: δυσὶ κυρίοις
  choice: a dois senhores
  rationale: No contexto de δουλεύειν, κύριοι são aqueles a quem servos estão sujeitos. «Senhores» preserva tanto a relação de autoridade quanto a imagem social do dito.
- source_word: δουλεύειν
  choice: servir
  rationale: Embora o verbo esteja ligado ao serviço de um escravo, a expressão idiomática «servir a dois senhores» transmite naturalmente essa relação no contexto.
- source_word: μισήσει / ἀγαπήσει
  choice: odiará / amará
  rationale: Mantém sem atenuação o forte contraste verbal do original entre ódio e amor.
- source_word: ἑνὸς ἀνθέξεται
  choice: se apegará a um
  rationale: ἀντέχομαι comunica a ideia de agarrar-se firmemente, manter-se ligado ou dedicar-se a alguém; «se apegará» preserva a imagem e soa natural.
- source_word: καταφρονήσει
  choice: desprezará
  rationale: Reproduz a ideia de tratar o outro com desdém ou considerá-lo inferior.
- source_word: θεῷ
  choice: a Deus
  rationale: Tradução direta do objeto dativo de δουλεύειν.
- source_word: μαμωνᾷ
  choice: a Mamom
  rationale: Preserva o empréstimo aramaico e sua força retórica como senhor rival, enquanto a nota esclarece seu sentido econômico.
theological_decisions:
- issue: Sentido de κύριος no contexto social
  choice: senhores
  alternative: donos
  rationale: O plural ocorre na imagem de serviço e sujeição. «Senhores» mantém a linguagem relacional do original sem confundir a palavra com um título divino neste ponto.
- issue: Representação de μαμωνᾶς
  choice: Mamom
  alternative: riqueza; dinheiro
  rationale: A manutenção do termo emprestado preserva a possível personificação das riquezas como senhor rival de Deus, sem reduzir antecipadamente sua amplitude semântica.
- issue: Força de μισήσει
  choice: odiará
  alternative: amará menos
  rationale: O contraste explícito com «amará» e o paralelo com «desprezará» favorecem conservar a formulação forte, sem resolver o dito como mera preferência comparativa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com «vocês» para o plural explícito na frase final e construções correntes tanto no Brasil quanto em grande parte do mundo lusófono. A formulação conserva o paralelismo e a tensão enfática do original.
