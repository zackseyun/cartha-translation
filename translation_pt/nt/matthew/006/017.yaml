source:
  edition: SBLGNT
  text: σὺ δὲ νηστεύων ἄλειψαί σου τὴν κεφαλὴν καὶ τὸ πρόσωπόν σου νίψαι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/017.yaml
  text: But you[a], when you fast, anoint your head and wash your face[b],
translation:
  language: pt
  text: Mas você, quando jejuar, passe óleo na cabeça[a] e lave o rosto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “unja a cabeça”. O verbo grego pode se referir à aplicação de óleo como parte dos cuidados pessoais habituais.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, mantenha a aparência habitual, em vez de tornar seu jejum evidente aos outros.
    reason: cultural_note
lexical_decisions:
- source_word: σὺ δὲ
  choice: Mas você
  rationale: O pronome expresso e enfático, junto de δέ, contrasta diretamente o discípulo com os hipócritas mencionados no contexto anterior.
- source_word: νηστεύων
  choice: quando jejuar
  rationale: O particípio presente tem valor circunstancial temporal; esta formulação é natural em português e mantém a ideia de uma situação recorrente.
- source_word: ἄλειψαί σου τὴν κεφαλήν
  choice: passe óleo na cabeça
  rationale: ἀλείφω designa aplicar óleo e, neste contexto, alude ao cuidado pessoal habitual. A formulação comunica o gesto com mais clareza ao leitor moderno do que o possível, mas religiosamente carregado, verbo “ungir”.
- source_word: καὶ
  choice: e
  rationale: Mantém a coordenação simples entre as duas ordens.
- source_word: τὸ πρόσωπόν σου νίψαι
  choice: lave o rosto
  rationale: νίπτω costuma indicar a lavagem de uma parte do corpo; “lave o rosto” é direto, natural e fiel.
theological_decisions:
- issue: Natureza da orientação sobre a aparência durante o jejum
  choice: A redação descreve cuidados pessoais comuns durante o jejum, sem explicitar no corpo do versículo a finalidade desses gestos.
  alternative: Entender a aplicação de óleo como unção ritual, ou a ordem como proibição de todo jejum público.
  rationale: O contexto imediato contrasta essa conduta com a aparência desfigurada dos hipócritas. Ainda assim, o versículo em si ordena os gestos sem definir a aplicação de óleo como rito nem proibir expressamente o jejum em público.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O singular “você” preserva a interpelação direta e enfática; “passe óleo” evita que um costume cotidiano seja entendido automaticamente como rito religioso.
