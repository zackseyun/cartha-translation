  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀφῆτε τοῖς ⸀ἀνθρώποις, οὐδὲ ὁ πατὴρ ὑμῶν ἀφήσει τὰ παραπτώματα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: pt
  text: Mas se vocês não perdoarem as pessoas, o Pai de vocês também não perdoará as transgressões de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: Mas, se ... não
  rationale: ἐάν introduz a condição, δέ assinala contraste com o versículo anterior, e μή a nega. A formulação é natural em português e preserva a estrutura condicional.
- source_word: ἀφῆτε
  choice: perdoarem
  rationale: Neste contexto de faltas interpessoais, ἀφίημι significa perdoar. A escolha também mantém a repetição lexical com ἀφήσει.
- source_word: τοῖς ἀνθρώποις
  choice: às pessoas
  rationale: ἄνθρωποι é genérico e não se limita aos homens. “Às pessoas” é explícito, inclusivo e corrente em português.
- source_word: οὐδὲ
  choice: também ... não
  rationale: Em uma construção negativa deste tipo, “também ... não” expressa com naturalidade a correspondência enfática de οὐδέ entre as duas orações.
- source_word: ὁ πατὴρ ὑμῶν
  choice: o Pai de vocês
  rationale: Traduz literalmente “o Pai de vocês”, sem acrescentar “celestial”, adjetivo ausente do texto grego deste versículo.
- source_word: ἀφήσει
  choice: perdoará
  rationale: Mantém o mesmo verbo português usado para ἀφῆτε, preservando o paralelismo e a reciprocidade do enunciado.
- source_word: τὰ παραπτώματα ὑμῶν
  choice: as suas transgressões
  rationale: παραπτώματα designa desvios, faltas ou transgressões. “Transgressões” conserva o peso moral do termo e é mais claro no português moderno amplo do que “ofensas” ou “delitos” neste contexto.
theological_decisions:
- issue: Relação condicional entre o perdão humano e o perdão divino
  choice: 'Preservar diretamente a condição: se não perdoarem, o Pai também não perdoará.'
  alternative: Reformular a falta de perdão humano como simples evidência de uma condição espiritual, ou restringir o perdão divino à perda de comunhão.
  rationale: O grego apresenta uma declaração condicional direta. A tradução conserva a tensão teológica sem impor uma sistematização externa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” torna explícito o valor de ὑμῶν e evita a ambiguidade regional de “seu/sua”. Não há marcadores de nota porque nenhuma nota é necessária para esta redação.
