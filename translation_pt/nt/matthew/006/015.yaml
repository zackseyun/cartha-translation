review_pass:
  verdict: revise
  source_fidelity: A redação preserva a condição introduzida por ἐὰν δὲ μή, o sentido interpessoal de ἀφίημι como «perdoar», a referência genérica de τοῖς ἀνθρώποις, a negação correlativa de οὐδέ e a repetição verbal entre ἀφῆτε e ἀφήσει. «Pai» não recebe o acréscimo indevido de «celestial».
  naturalness: «Perdoarem às pessoas» é possível, mas «perdoarem as pessoas» é mais corrente e direta no português moderno de ampla circulação, sobretudo com legibilidade brasileira. Retirar a vírgula imediatamente após «Mas» melhora a fluidez. «As suas transgressões» pode gerar uma referência possessiva momentaneamente menos nítida; «as transgressões de vocês» a explicita.
  terminology: «Transgressões» é uma equivalente adequada e compreensível para παραπτώματα neste contexto. «Pai de vocês» mantém dignidade, clareza e o plural expresso no grego. Não é necessária nota lexical, pois a escolha é clara no texto.
  issues:
  - severity: low
    issue: Regência e naturalidade em «perdoarem às pessoas».
    rationale: Embora a construção com objeto indireto seja defensável, «perdoar alguém» é a formulação mais idiomática e imediata para o perdão interpessoal no português contemporâneo.
  - severity: low
    issue: Possível ambiguidade em «as suas transgressões».
    rationale: Depois de «às pessoas», «suas» pode exigir uma breve desambiguação de referente. «De vocês» corresponde explicitamente a ὑμῶν e é mais claro.
  revised_text: Mas se vocês não perdoarem as pessoas, o Pai de vocês também não perdoará as transgressões de vocês.
