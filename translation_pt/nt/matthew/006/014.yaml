id: MAT.6.14
reference: Matthew 6:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: pt
  text: Pois, se vocês perdoarem às pessoas as ofensas delas[a], o Pai celestial de vocês também perdoará vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “transgressões”, “faltas” ou “atos errados”. O termo grego pode indicar uma falha moral ou um passo em falso.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Pois, se
  rationale: “Pois” preserva a força explicativa de γάρ, ligando o versículo à oração anterior; “se” expressa naturalmente a condição introduzida por ἐάν com o subjuntivo aoristo.
- source_word: ἀφῆτε ... ἀφήσει
  choice: perdoarem ... perdoará
  rationale: Neste contexto de faltas morais e relacionais, ἀφίημι significa “perdoar”. Repetir o mesmo verbo preserva a correspondência verbal do grego.
- source_word: τοῖς ἀνθρώποις
  choice: às pessoas
  rationale: ἄνθρωποι designa seres humanos em geral, não apenas homens; “pessoas” é inclusivo, claro e atual.
- source_word: τὰ παραπτώματα αὐτῶν
  choice: as ofensas delas
  rationale: παράπτωμα indica uma falta, transgressão ou passo em falso. “Ofensas” preserva aqui o sentido moral e relacional; “delas” evita a ambiguidade que “suas” teria em português.
- source_word: καὶ ὑμῖν
  choice: também perdoará vocês
  rationale: “Também” preserva a correspondência expressa por καί. O objeto direto “vocês” é natural no português brasileiro amplamente legível.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: o Pai celestial de vocês
  rationale: Formulação natural que conserva tanto a relação pessoal expressa por “de vocês” quanto a qualificação “celestial”.
theological_decisions:
- issue: Relação condicional entre o perdão humano e o perdão divino
  choice: 'Apresentar diretamente a condição: se vocês perdoarem, o Pai também perdoará vocês.'
  alternative: Explicitar que o perdão humano merece o perdão divino, ou que serve apenas como prova de um perdão divino anterior.
  rationale: O grego formula uma condição real sem explicar aqui sua relação com outras afirmações teológicas. A tradução preserva essa tensão e não impõe uma solução doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O plural “vocês” torna explícito que tanto o verbo quanto o pronome grego estão no plural. A colocação “Pai celestial de vocês” é natural e mantém os elementos do original.
