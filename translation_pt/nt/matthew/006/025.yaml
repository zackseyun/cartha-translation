id: MAT.6.25
reference: Matthew 6:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: pt
  text: 'Por isso, eu lhes digo: não se preocupem com a sua vida[a], quanto ao que vão comer, nem com o seu corpo, quanto ao que vão vestir. A vida não é mais do que o alimento, e o corpo, mais do que a roupa?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alma”. Aqui, o contexto de comer e vestir favorece “vida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Por isso
  rationale: Mantém a inferência em relação ao ensino anterior com uma expressão natural e clara em português.
- source_word: μεριμνᾶτε
  choice: não se preocupem
  rationale: Expressa cuidado inquieto ou ansiedade; é corrente e compreensível sem sugerir que toda forma de prudência seja proibida.
- source_word: ψυχῇ
  choice: vida
  rationale: O contexto de comer e de sustentar a existência favorece 'vida', embora o termo também possa ser traduzido por 'alma'.
- source_word: τί φάγητε
  choice: quanto ao que vão comer
  rationale: Transmite naturalmente em português a preocupação voltada para uma necessidade futura.
- source_word: σώματι
  choice: corpo
  rationale: Refere-se diretamente ao corpo físico em relação à roupa.
- source_word: τί ἐνδύσησθε
  choice: quanto ao que vão vestir
  rationale: Formulação idiomática para a preocupação futura com aquilo que se vestirá.
- source_word: οὐχὶ
  choice: não é
  rationale: Introduz uma pergunta retórica que pressupõe resposta afirmativa.
- source_word: πλεῖόν
  choice: mais do que
  rationale: Preserva a comparação ampla sem explicitar indevidamente valor, grandeza ou importância.
- source_word: τροφῆς
  choice: alimento
  rationale: Designa aquilo que nutre e sustenta a vida; 'alimento' mantém registro digno e acessível.
- source_word: ἐνδύματος
  choice: roupa
  rationale: Termo coletivo natural no português moderno, em paralelo claro com 'alimento'.
theological_decisions:
- issue: Sentido de ψυχή no ensino de Jesus
  choice: vida
  alternative: alma
  rationale: Como o contexto trata de comer, corpo e vestimenta, ψυχή designa aqui a vida ou a existência da pessoa, não necessariamente uma alma imaterial. A alternativa legítima é registrada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O plural de tratamento 'vocês' é expresso pelas formas 'lhes' e 'se preocupem'. A sintaxe conserva o paralelismo do grego sem soar artificial.
