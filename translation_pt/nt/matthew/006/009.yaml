  text: Οὕτως οὖν προσεύχεσθε ὑμεῖς· Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς· ἁγιασθήτω τὸ ὄνομά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/009.yaml
  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: pt
  text: 'Portanto, orem assim: “Pai nosso, que estás nos céus[a], seja santificado o teu nome[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme a forma tradicional no singular: “no céu”. O grego traz “nos céus”, no plural.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, que o teu nome seja reconhecido e honrado como santo.
    reason: clarification
lexical_decisions:
- source_word: Οὕτως
  choice: assim
  rationale: Introduz a maneira ou o modelo da oração; “assim” é natural e mantém a força instrutiva.
- source_word: οὖν
  choice: Portanto
  rationale: Mantém a conexão inferencial com o ensino anterior, sem omitir a partícula.
- source_word: προσεύχεσθε ὑμεῖς
  choice: orem
  rationale: O imperativo plural comunica diretamente a instrução. Em português, a forma verbal já identifica os destinatários; explicitar “vocês” soaria desnecessariamente marcado neste contexto.
- source_word: Πάτερ ἡμῶν
  choice: Pai nosso
  rationale: Forma vocativa natural que preserva tanto a invocação direta quanto o caráter comunitário do pronome plural.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: que estás nos céus
  rationale: A oração relativa expressa naturalmente em português a construção grega com artigo, e “céus” preserva o plural do texto-fonte.
- source_word: ἁγιασθήτω
  choice: seja santificado
  rationale: Preserva a forma passiva e a força de petição do imperativo grego. Embora tradicional, “santificado” continua compreensível e evita reduzir o sentido apenas à atitude humana de considerar santo.
- source_word: τὸ ὄνομά σου
  choice: o teu nome
  rationale: Mantém o substantivo “nome” e a segunda pessoa da invocação, sem explicitar além do texto suas associações com caráter, reputação ou revelação.
theological_decisions:
- issue: A localização do Pai e o plural τοῖς οὐρανοῖς
  choice: Pai nosso, que estás nos céus
  alternative: Pai nosso, que estás no céu
  rationale: O plural “céus” corresponde à forma grega e mantém juntas a proximidade expressa por “Pai” e a transcendência divina, sem reformular a expressão como o adjetivo interpretativo “celestial”.
- issue: O alcance de ἁγιασθήτω
  choice: seja santificado o teu nome
  alternative: que o teu nome seja reconhecido como santo
  rationale: '“Seja santificado” conserva a voz passiva e a amplitude da petição: o texto pede que o nome de Deus seja reconhecido, honrado e manifestado como santo, sem especificar no corpo do versículo quem realiza a ação.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Orem” evita regionalizar o texto com “vocês” ou “vós”; “teu” acompanha de modo natural a invocação direta tradicional. A ordem “seja santificado o teu nome” mantém solenidade sem recorrer a vocabulário arcaico. A vírgula final indica que a oração continua no versículo seguinte.
