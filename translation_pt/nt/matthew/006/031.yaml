  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: pt
  text: 'Portanto, não se preocupem[a], dizendo: “O que vamos comer? Ou o que vamos beber? Ou o que vamos vestir?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não fiquem ansiosos”.'
    reason: Alternativa lexical que torna explícito o sentido de inquietação ansiosa de μεριμνάω neste contexto.
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: Portanto, não se preocupem
  rationale: “Não se preocupem” comunica em português atual a proibição da inquietação ansiosa quanto às necessidades materiais. “Portanto” preserva o valor inferencial de οὖν e liga a ordem ao argumento anterior.
- source_word: λέγοντες
  choice: dizendo
  rationale: Mantém de modo direto a forma participial e introduz as perguntas que expressam a preocupação.
- source_word: Τί
  choice: O que
  rationale: Equivalente natural em português para as perguntas diretas sobre alimento, bebida e roupa.
- source_word: φάγωμεν
  choice: vamos comer
  rationale: A construção com “vamos” exprime naturalmente em português a pergunta deliberativa voltada à provisão futura.
- source_word: πίωμεν
  choice: vamos beber
  rationale: Preserva o paralelismo com φάγωμεν e expressa de maneira idiomática a preocupação com a provisão futura.
- source_word: περιβαλώμεθα
  choice: vamos vestir
  rationale: No contexto, o verbo se refere ao uso de roupas. “O que vamos vestir?” é natural e evita uma tradução reflexiva rígida.
- source_word: ἤ ... ἤ ... ἤ
  choice: ou ... ou ... ou
  rationale: Preserva a estrutura disjuntiva repetida da lista grega.
theological_decisions:
- issue: Natureza da proibição de Jesus a respeito das necessidades materiais
  choice: Traduzir μεριμνήσητε como proibição da preocupação ansiosa, sem sugerir uma condenação de todo planejamento responsável.
  alternative: “não fiquem ansiosos” ou “não se inquietem”
  rationale: O contexto imediato trata da ansiedade pela provisão, não de uma proibição absoluta da prudência. “Não se preocupem” mantém a força da ordem sem resolver além do texto a relação entre confiança e planejamento.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O plural “vocês” fica implícito nas formas verbais. As três perguntas e a repetição de “ou” preservam o ritmo do original.
