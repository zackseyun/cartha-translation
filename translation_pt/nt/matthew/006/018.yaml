  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: pt
  text: para que você não seja visto jejuando pelas pessoas, mas por seu Pai, que está em secreto[a]; e seu Pai, que vê em secreto, recompensará você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «no lugar secreto». A expressão grega também pode designar aquilo que está oculto ou fora da vista pública.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: para que
  rationale: Introduz a finalidade da orientação anterior e preserva naturalmente a força final da conjunção grega.
- source_word: μὴ φανῇς ... νηστεύων
  choice: você seja visto jejuando não
  rationale: A construção com o subjuntivo passivo de φαίνω e o particípio νηστεύων indica ser visto ou percebido enquanto se jejua. A posição da negação foi ajustada para formar em português o contraste claro «não pelas pessoas, mas por seu Pai».
- source_word: τοῖς ἀνθρώποις
  choice: pelas pessoas
  rationale: ἄνθρωποι refere-se aqui genericamente aos observadores humanos, sem restringir a referência a homens do sexo masculino.
- source_word: ἀλλὰ τῷ πατρί σου
  choice: mas por seu Pai
  rationale: Mantém o contraste entre os observadores humanos e o Pai, adaptando os dativos gregos à construção passiva natural em português.
- source_word: τῷ ἐν τῷ κρυφαίῳ
  choice: que está em secreto
  rationale: Preserva a formulação concisa e a ligação verbal com a repetição de ἐν τῷ κρυφαίῳ na oração seguinte, sem especificar indevidamente um local físico.
- source_word: ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: que vê em secreto
  rationale: Mantém a expressão grega sem acrescentar o objeto interpretativo «o que é feito» e conserva a repetição retórica.
- source_word: ἀποδώσει σοι
  choice: recompensará você
  rationale: No contexto da resposta divina à devoção, ἀποδίδωμι tem o sentido contextual de retribuir ou recompensar; esta formulação é clara e natural.
theological_decisions:
- issue: Referência genérica de ἀνθρώποις
  choice: pessoas
  alternative: homens; outros
  rationale: O plural grego designa os seres humanos que poderiam observar o jejum, não especificamente pessoas do sexo masculino. «Pessoas» comunica diretamente essa extensão genérica.
- issue: Sentido de ἐν τῷ κρυφαίῳ nas duas ocorrências
  choice: em secreto
  alternative: no lugar secreto; em particular; oculto
  rationale: A repetição foi mantida para ligar a presença não pública do Pai ao seu olhar. A tradução evita decidir se a expressão é estritamente espacial ou se descreve de modo mais amplo a esfera do oculto.
- issue: Escopo do contraste μὴ ... ἀλλά
  choice: ser visto jejuando não pelas pessoas, mas pelo Pai
  alternative: não parecer às pessoas estar jejuando, mas ao Pai
  rationale: A ordem portuguesa torna explícito que o contraste recai sobre quem percebe o jejum, preservando a finalidade do texto sem transformar o Pai em mero destinatário da prática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular «você» corresponde ao endereço individual do grego. A repetição «em secreto» é deliberada e reproduz o vínculo retórico do original.
