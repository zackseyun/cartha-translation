  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: pt
  text: Mas eu lhes digo que nem mesmo Salomão, em toda a sua glória, se vestiu como uma destas flores.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em todo o seu esplendor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Mas eu lhes digo
  rationale: O verbo λέγω com o dativo ὑμῖν corresponde naturalmente a “eu lhes digo”. δέ estabelece aqui um contraste leve com a observação anterior, bem expresso por “Mas”.
- source_word: οὐδὲ
  choice: nem mesmo
  rationale: 'Preserva a negação enfática: nem sequer Salomão alcançou o padrão da comparação.'
- source_word: Σολομὼν
  choice: Salomão
  rationale: Forma portuguesa consagrada do nome próprio.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: em toda a sua glória
  rationale: Mantém a ressonância bíblica de δόξα, que neste contexto designa a magnificência ou o esplendor régio de Salomão.
- source_word: περιεβάλετο
  choice: se vestiu
  rationale: A forma verbal média pode ser expressa naturalmente em português por “se vestiu”, sem pressupor um agente externo e preservando a imagem do vestuário.
- source_word: ὡς ἓν τούτων
  choice: como uma destas flores
  rationale: O singular neutro ἓν retoma um elemento do conjunto mencionado no contexto. A explicitação “flores” torna a referência natural e clara em português sem alterar a comparação.
theological_decisions:
- issue: Sentido de δόξα aplicado a Salomão
  choice: glória, no sentido contextual de magnificência régia
  alternative: esplendor
  rationale: “Glória” é lexicalmente adequada e conserva a conhecida ressonância bíblica, enquanto o contexto deixa claro que se trata da aparência magnífica de um rei, não de glória divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Lhes” evita regionalizar excessivamente o pronome; “se vestiu” é mais natural do que uma passiva rígida. A referência a flores foi explicitada a partir do contexto imediato.
