id: MAT.6.20
reference: Matthew 6:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: pt
  text: Mas acumulem para vocês mesmos tesouros no céu, onde nem a traça nem a deterioração[a] destroem, e onde os ladrões não arrombam[b] nem roubam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ferrugem”. A palavra grega pode referir-se, de modo mais amplo, ao desgaste, consumo ou corrosão que destrói algo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “escavam através”. A expressão provavelmente alude a ladrões que abriam passagem pelas paredes de uma casa.
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: acumulem
  rationale: O imperativo preserva a exortação direta, e “acumulem” comunica naturalmente a ideia de reunir e guardar tesouros.
- source_word: δὲ
  choice: Mas
  rationale: Expressa o contraste com a proibição de acumular tesouros na terra, no versículo anterior.
- source_word: ὑμῖν
  choice: para vocês mesmos
  rationale: Preserva o sentido de vantagem pessoal do dativo e torna explícita a força reflexiva da expressão.
- source_word: θησαυροὺς
  choice: tesouros
  rationale: Mantém o plural grego e a metáfora central do contexto.
- source_word: ἐν οὐρανῷ
  choice: no céu
  rationale: Equivalente locativo natural em português para o singular grego.
- source_word: σὴς
  choice: traça
  rationale: Designa a traça que consome roupas e outros bens guardados.
- source_word: βρῶσις
  choice: deterioração
  rationale: O termo pode indicar aquilo que consome ou corrói; “deterioração” preserva esse alcance mais amplo sem restringi-lo à ferrugem.
- source_word: ἀφανίζει
  choice: destroem
  rationale: Comunica com clareza a ideia de fazer perecer ou desaparecer; o plural concorda naturalmente com os dois agentes mencionados.
- source_word: κλέπται
  choice: ladrões
  rationale: Correspondência direta e corrente para o substantivo plural.
- source_word: διορύσσουσιν
  choice: arrombam
  rationale: Expressa de modo idiomático a invasão praticada pelos ladrões, enquanto a imagem literal de escavar ou atravessar a parede é preservada em nota.
- source_word: κλέπτουσιν
  choice: roubam
  rationale: Tradução direta, simples e natural do verbo.
theological_decisions:
- issue: Natureza dos “tesouros no céu”
  choice: Manter a metáfora “tesouros no céu” sem explicação interpretativa no texto.
  alternative: “recompensas celestiais” ou “riquezas espirituais”
  rationale: O grego não define aqui a natureza exata desses tesouros. Preservar a metáfora evita impor uma doutrina específica de mérito, recompensa ou riqueza espiritual.
- issue: Alcance de βρῶσις
  choice: “deterioração”, em sentido abrangente
  alternative: “ferrugem” ou “corrosão”
  rationale: A escolha conserva a ideia geral de consumo e destruição dos bens terrenos, sem limitar indevidamente o termo a objetos metálicos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Acumulem” evita formulações arcaicas; “arrombam” comunica naturalmente a ação no texto principal, enquanto a imagem cultural literal é mantida em nota. Os marcadores foram posicionados junto aos termos aos quais suas notas efetivamente se referem.
source_grounding:
  english_pob_role: consult_only
