id: MAT.6.2
reference: Matthew 6:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: pt
  text: 'Portanto, quando você der esmola, não toque trombeta à sua frente[a], como fazem os hipócritas nas sinagogas e nas ruas, para serem glorificados pelas pessoas[b]. Em verdade lhes digo: eles já receberam toda a sua recompensa[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não anuncie isso ao som de trombeta”. O grego diz literalmente “não toque trombeta à sua frente”; a imagem pode ser hiperbólica ou metafórica.
    reason: lexical_alternative
  - marker: b
    text: Ou “para serem elogiados” ou “honrados pelas pessoas”. O verbo grego significa literalmente “ser glorificado”.
    reason: lexical_alternative
  - marker: c
    text: 'A expressão reflete um uso comercial: eles já receberam por completo tudo o que terão como recompensa.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Portanto, quando
  rationale: Ὅταν com o subjuntivo introduz uma circunstância geral ou repetida; em português, “quando” é natural e suficiente. “Portanto” conserva a conexão inferencial ou continuativa de οὖν com o contexto anterior.
- source_word: ποιῇς ἐλεημοσύνην
  choice: der esmola
  rationale: A expressão idiomática designa a ajuda material aos necessitados. “Dar esmola” é conciso, reconhecível e historicamente preciso, sem excluir o sentido de ação misericordiosa.
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: não toque trombeta diante de si
  rationale: Mantém a imagem explícita e vívida do grego, sem decidir se ela é literal, metafórica ou hiperbólica. “Diante de si” expressa naturalmente a referência ao próprio agente.
- source_word: ὑποκριταὶ
  choice: hipócritas
  rationale: É o equivalente corrente e adequado para os que exibem sua piedade a fim de obter reconhecimento público.
- source_word: συναγωγαῖς καὶ ῥύμαις
  choice: sinagogas e nas ruas
  rationale: “Sinagogas” identifica corretamente o ambiente judaico; “ruas” é a forma moderna e natural de representar ῥύμαις neste contexto público.
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: para serem glorificados pelas pessoas
  rationale: Preserva tanto a finalidade expressa por ὅπως quanto a força de δοξάζω. “Pessoas” representa o sentido humano genérico de ἀνθρώπων sem marca masculina indevida.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Em verdade lhes digo
  rationale: Fórmula solene e direta, digna e idiomática em português, que conserva a força asseverativa de ἀμήν.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: eles já receberam toda a sua recompensa
  rationale: 'Explicita o valor comercial de ἀπέχω: dar recibo ou ter recebido por completo. “Já” e “toda” comunicam que essa é a totalidade da recompensa que terão.'
theological_decisions:
- issue: Força de δοξασθῶσιν
  choice: glorificados pelas pessoas
  alternative: elogiados pelas pessoas; honrados pelas pessoas
  rationale: A opção mais forte preserva a tensão retórica entre a glória recebida dos seres humanos e a recompensa divina no contexto, sem reduzir o verbo a mero elogio.
- issue: Sentido genérico de ἀνθρώπων
  choice: pessoas
  alternative: homens; outros
  rationale: O termo se refere genericamente aos observadores humanos, não especificamente a indivíduos do sexo masculino.
- issue: Caráter da imagem da trombeta
  choice: manter literalmente “não toque trombeta”
  alternative: não anuncie o que faz; não faça alarde
  rationale: O texto não esclarece se a imagem é literal, hiperbólica ou metafórica. A tradução conserva deliberadamente essa ambiguidade.
- issue: Plenitude da recompensa em ἀπέχουσιν
  choice: já receberam toda a sua recompensa
  alternative: têm a sua recompensa; receberam a sua recompensa
  rationale: A formulação torna perceptível o sentido idiomático comercial do verbo sem acrescentar uma definição teológica da natureza da recompensa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção evita arcaísmos desnecessários, conserva a imagem retórica da trombeta e mantém o termo forte “glorificados”. O singular “você” corresponde ao destinatário individual da oração temporal, enquanto “lhes digo” representa o plural ὑμῖν dirigido ao conjunto dos ouvintes.
