reference: Matthew 6:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: σοῦ δὲ ποιοῦντος ἐλεημοσύνην μὴ γνώτω ἡ ἀριστερά σου τί ποιεῖ ἡ δεξιά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/003.yaml
  text: But when you give to the needy[a], do not let your left hand know what your right hand is doing,
translation:
  language: pt
  text: Mas, quando você der aos necessitados[a], que a sua mão esquerda não saiba o que a direita está fazendo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quando você der esmola”; o termo grego se refere à ajuda caridosa dada aos pobres.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: Mas, quando você der
  rationale: A construção genitiva absoluta com δέ contrasta esta orientação com a anterior. Em português corrente, “Mas, quando você der” comunica naturalmente tanto o contraste quanto a circunstância temporal; “der” explicita o sentido de ποιέω junto de ἐλεημοσύνην.
- source_word: ἐλεημοσύνην
  choice: aos necessitados
  rationale: O termo designa esmola ou ajuda caridosa aos pobres. “Dar aos necessitados” é claro e atual, enquanto a nota preserva a alternativa lexical mais formal.
- source_word: μὴ γνώτω
  choice: que ... não saiba
  rationale: O imperativo aoristo negativo de terceira pessoa é expresso de modo idiomático em português por “que ... não saiba”, preservando a personificação das mãos.
- source_word: ἡ ἀριστερά σου
  choice: a sua mão esquerda
  rationale: Tradução direta que conserva a imagem memorável e o paralelismo do dito.
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: o que a direita está fazendo
  rationale: A forma progressiva representa naturalmente a ação em curso indicada pelo presente ποιεῖ. A elipse de “mão” antes de “direita” é corrente em português e não obscurece o sentido.
theological_decisions:
- issue: Interpretação do dito sobre as mãos esquerda e direita
  choice: Manter a metáfora como exortação enfática à discrição e à ausência de ostentação ao ajudar os necessitados.
  alternative: Transformá-la numa afirmação geral sobre humildade ou numa proibição absoluta de toda ajuda feita em público.
  rationale: O texto emprega personificação e linguagem hiperbólica. Preservar a imagem evita impor ao versículo uma formulação doutrinária mais rígida do que ele próprio apresenta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “você” comunica diretamente o singular σοῦ; “a sua mão” evita ambiguidade possessiva. A metáfora e sua tensão retórica foram preservadas.
