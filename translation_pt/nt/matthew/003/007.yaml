id: MAT.3.7
reference: Matthew 3:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: pt
  text: 'Mas, ao ver muitos dos fariseus e saduceus vindo para o batismo de João, disse-lhes: “Ninhada de víboras[a], quem alertou vocês para que fugissem da ira que está por vir[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Filhos de víboras”.'
    reason: alternativa_lexical
  - marker: b
    text: 'Ou: “da ira vindoura”.'
    reason: alternativa_lexical
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Mas, ao ver
  rationale: A construção participial aorista com δέ é expressa naturalmente por uma oração temporal; “mas” mantém a leve transição contrastiva no fluxo narrativo.
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: muitos dos fariseus e saduceus
  rationale: 'Preserva a construção partitiva: trata-se de muitos dentre esses grupos, sem afirmar que todos os seus integrantes estavam presentes.'
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: vindo para o batismo que ele realizava
  rationale: Expressa o movimento em direção ao batismo de João e evita a ambiguidade referencial que “seu batismo” teria em português, sem afirmar explicitamente que eles chegaram a ser batizados.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Ninhada de víboras
  rationale: Reproduz de modo vivo e idiomático a imagem de pessoas geradas por víboras. A alternativa mais formal “Filhos de víboras” é registrada em nota.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: quem alertou vocês
  rationale: No contexto de uma fuga diante da ira iminente, ὑποδείκνυμι tem força de advertência; “alertou” comunica isso em português corrente.
- source_word: φυγεῖν ἀπὸ
  choice: para que fugissem de
  rationale: Mantém a imagem concreta e urgente da fuga, em uma construção portuguesa natural depois de “alertou vocês”.
- source_word: τῆς μελλούσης ὀργῆς
  choice: da ira que está por vir
  rationale: Preserva ὀργή como “ira” e a orientação futura de μέλλω, sem reduzir a expressão a termos mais interpretativos como “juízo” ou “castigo”.
theological_decisions:
- issue: Alcance da repreensão aos fariseus e saduceus
  choice: A repreensão é dirigida aos muitos integrantes desses grupos que se aproximavam.
  alternative: Entender a frase como caracterização indistinta de todos os fariseus e saduceus.
  rationale: A construção partitiva grega indica um subconjunto e não autoriza ampliar a referência a todos os membros dos dois grupos.
- issue: Força escatológica de ὀργή
  choice: ira
  alternative: juízo ou castigo
  rationale: “Ira” conserva a gravidade teológica e a provável dimensão escatológica do termo, sem identificar antecipadamente a forma específica que essa ira assumirá.
- issue: Intenção dos que vinham ao batismo
  choice: Eles se aproximavam do batismo de João.
  alternative: Eles necessariamente vinham para receber pessoalmente o batismo.
  rationale: O texto diz que vinham em direção ao batismo, mas neste versículo não declara de maneira inequívoca que todos pretendiam recebê-lo ou que de fato foram batizados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa. A formulação evita o ambíguo “seu batismo” e mantém a dureza profética da fala, bem como a tensão quanto às intenções dos líderes que se aproximavam.
