id: MAT.3.15
reference: Matthew 3:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν ⸂πρὸς αὐτόν⸃· Ἄφες ἄρτι, οὕτως γὰρ πρέπον ἐστὶν ἡμῖν πληρῶσαι πᾶσαν δικαιοσύνην. τότε ἀφίησιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: pt
  text: 'Mas Jesus lhe respondeu: “Deixe assim por enquanto, pois deste modo convém que cumpramos toda a justiça[a]”. Então João consentiu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a retidão”. A palavra grega pode indicar justiça ou retidão; aqui se refere amplamente ao que está de acordo com a vontade justa de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: Mas Jesus lhe respondeu
  rationale: A construção grega equivale naturalmente a “respondeu”; δέ marca contraste com a objeção de João no versículo anterior, e πρὸς αὐτόν é representado pelo pronome “lhe”.
- source_word: Ἄφες ἄρτι
  choice: Deixe assim por enquanto
  rationale: Neste contexto, ἀφίημι significa permitir ou deixar que a ação prossiga, não perdoar; ἄρτι expressa a circunstância presente e temporária.
- source_word: οὕτως γὰρ
  choice: pois deste modo
  rationale: 'Preserva a referência demonstrativa ao modo em questão: João batizar Jesus.'
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: convém que
  rationale: “Convém” comunica de modo natural e digno aquilo que é apropriado ou correto, mantendo o sujeito inclusivo na forma verbal “cumpramos”.
- source_word: πληρῶσαι
  choice: cumpramos
  rationale: O verbo “cumprir” preserva a ressonância de πληρόω em Mateus, ligada à realização da vontade e do propósito divinos.
- source_word: πᾶσαν δικαιοσύνην
  choice: toda a justiça
  rationale: É a correspondência portuguesa tradicional e semanticamente ampla de δικαιοσύνη, sem reduzir a expressão ao cumprimento de exigências legais; a nota esclarece a possível nuance de retidão.
- source_word: τότε ἀφίησιν αὐτόν
  choice: Então João consentiu
  rationale: O presente histórico é vertido naturalmente no passado. O nome “João”, recuperado do contexto, evita a ambiguidade dos dois pronomes masculinos e expressa que ele cedeu ao pedido de Jesus, sem acrescentar que o batismo já ocorreu neste ponto.
theological_decisions:
- issue: Sentido de “toda a justiça”
  choice: Referência ampla ao cumprimento daquilo que está de acordo com a justa vontade de Deus nessa ocasião
  alternative: Cumprimento de toda exigência legal, ou realização de toda retidão
  rationale: A formulação preserva a amplitude teológica da expressão de Mateus e sua ligação imediata com o batismo de Jesus, sem restringi-la à observância legal nem desenvolver uma doutrina não explicitada no versículo.
translation_notes:
  register: Português moderno, corrente e digno, com legibilidade brasileira e compreensão internacional. “Deixe assim por enquanto” soa natural no diálogo; “convém que cumpramos” conserva a solenidade moderada e a inclusão de Jesus e João na ação apropriada.
