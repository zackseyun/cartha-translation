id: MAT.3.10
reference: Matthew 3:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: pt
  text: O machado já está posto junto à raiz das árvores.[a] Portanto, toda árvore que não produz bom fruto é cortada e lançada ao fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «já se encontra junto à raiz das árvores».'
    reason: Alternativa lexical para κεῖται, destacando o estado ou a posição do machado.
lexical_decisions:
- source_word: ἤδη δὲ
  choice: já
  rationale: ἤδη comunica a iminência do juízo; em português, «já» preserva essa força temporal. δέ é levemente conectivo e não exige uma conjunção explícita, evitando um início menos natural como «E já».
- source_word: ἡ ἀξίνη
  choice: o machado
  rationale: Equivalente corrente e preciso para a ferramenta de corte na metáfora.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: está posto junto à raiz das árvores
  rationale: Preserva tanto o estado expresso por κεῖται quanto a posição do machado, pronto para ser usado. «Junto à» comunica proximidade sem sugerir que ele já golpeou a raiz.
- source_word: πᾶν οὖν δένδρον
  choice: Portanto, toda árvore
  rationale: οὖν introduz a consequência lógica da imagem anterior; «portanto» torna essa inferência clara.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: que não produz bom fruto
  rationale: A oração relativa reproduz naturalmente em português a função do particípio e mantém o sentido característico de produzir fruto bom.
- source_word: ἐκκόπτεται
  choice: é cortada
  rationale: No contexto arbóreo, indica que a árvore é abatida. «Cortada» é natural e evita acrescentar um advérbio ausente no grego.
- source_word: καὶ εἰς πῦρ βάλλεται
  choice: e lançada ao fogo
  rationale: «Lançada ao fogo» é português atual e digno, preservando a força passiva de βάλλεται e a imagem de juízo.
theological_decisions:
- issue: Natureza da imagem do fogo
  choice: Mantida como «o fogo», sem explicação interpretativa.
  alternative: juízo escatológico; juízo temporal; fogo do inferno
  rationale: O texto apresenta uma imagem inequívoca de juízo, mas não especifica aqui sua natureza exata. A tradução conserva a tensão teológica sem estreitá-la.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a metáfora agrícola e a urgência do original, sem expansão doutrinária.
