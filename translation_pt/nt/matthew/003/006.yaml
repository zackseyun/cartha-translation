source:
  edition: SBLGNT
  text: καὶ ἐβαπτίζοντο ἐν τῷ Ἰορδάνῃ ⸀ποταμῷ ὑπ’ αὐτοῦ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: pt
  text: e eram batizados por ele no rio Jordão[a], confessando os seus pecados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “foram batizados”; o imperfeito grego pode enfatizar uma ação contínua ou repetida: “eram batizados”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: eram batizados
  rationale: O imperfeito passivo apresenta a ação em curso ou repetida no fluxo narrativo. “Eram batizados” expressa isso naturalmente em português e mantém o termo ritual sem especificar o modo.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: no rio Jordão
  rationale: A construção com ἐν é locativa, e ποταμῷ identifica explicitamente o Jordão como rio. “No rio Jordão” é a forma natural em português.
- source_word: ὑπ’ αὐτοῦ
  choice: por ele
  rationale: Ὑπό com genitivo indica o agente pessoal. O pronome remete a João no contexto imediato, mas é preservado como pronome.
- source_word: ἐξομολογούμενοι
  choice: confessando
  rationale: O particípio descreve uma ação simultânea ao batismo e indica o reconhecimento verbal dos pecados.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: os seus pecados
  rationale: Mantém o objeto no plural e a relação possessiva, referindo-se aos pecados que eles confessavam.
- source_word: καὶ
  choice: e
  rationale: Conserva a ligação narrativa simples com o versículo anterior.
theological_decisions:
- issue: Terminologia e modo do batismo
  choice: batizados
  alternative: imersos; lavados
  rationale: O texto afirma que eram batizados no Jordão, mas não define explicitamente o modo. O termo tradicional e corrente preserva essa abertura sem introduzir uma conclusão denominacional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção natural tanto para leitores brasileiros quanto internacionais. O aspecto do imperfeito é preservado sem tornar a frase artificial.
