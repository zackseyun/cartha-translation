source:
  edition: SBLGNT
  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: pt
  text: Então Jesus vem da Galileia ao Jordão, até João, para ser batizado por ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca a progressão temporal da narrativa de modo conciso e natural.
- source_word: παραγίνεται
  choice: vem
  rationale: Preserva o presente histórico e a vivacidade narrativa do grego; no contexto, comunica a chegada de Jesus.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: da Galileia
  rationale: ἀπό indica o ponto de origem; a formulação é natural em português.
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: ao Jordão
  rationale: ἐπί com acusativo indica movimento em direção a um lugar. O nome 'Jordão' basta no contexto, sem acrescentar 'rio' ao texto.
- source_word: πρὸς τὸν Ἰωάννην
  choice: até João
  rationale: πρός com acusativo indica movimento em direção a uma pessoa. 'Até João' distingue naturalmente o encontro pessoal do destino geográfico anterior.
- source_word: τοῦ βαπτισθῆναι
  choice: para ser batizado
  rationale: O infinitivo articular expressa propósito; 'para ser batizado' torna essa relação clara e idiomática.
- source_word: ὑπ’ αὐτοῦ
  choice: por ele
  rationale: ὑπό com genitivo assinala o agente pessoal; o pronome mantém a forma explícita do grego sem repetir interpretativamente o nome de João.
theological_decisions:
- issue: Presente histórico em παραγίνεται
  choice: 'Manter o presente narrativo: ''vem'''
  alternative: 'Empregar o passado simples: ''veio'''
  rationale: O presente conserva a vivacidade deliberada da narração grega sem modificar o conteúdo teológico.
- issue: Identificação de João
  choice: Usar somente 'João'
  alternative: Acrescentar 'João Batista'
  rationale: O versículo traz apenas o nome João; o título não é acrescentado, embora o contexto identifique a pessoa.
- issue: Finalidade do deslocamento de Jesus
  choice: 'Traduzir explicitamente como propósito: ''para ser batizado'''
  alternative: Usar uma construção menos explícita, como 'a fim de receber o batismo'
  rationale: A construção τοῦ com infinitivo indica finalidade. A tradução escolhida preserva também a voz passiva, sem desenvolver implicações teológicas além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O presente histórico foi mantido. A sequência 'ao Jordão, até João' reproduz os dois complementos direcionais sem a cadência artificial de repetir a mesma preposição.
