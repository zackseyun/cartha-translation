source:
  edition: SBLGNT
  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: pt
  text: 'E eis que uma voz vinda dos céus[a] disse: “Este é o meu Filho amado, em quem me agrado[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do céu”. O grego emprega o plural, “dos céus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com quem estou muito satisfeito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: E eis que
  rationale: Mantém a função de chamar solenemente a atenção para um acontecimento significativo, sem reduzir ἰδού a uma simples indicação visual.
- source_word: φωνὴ
  choice: uma voz
  rationale: Neste contexto, φωνή designa uma voz articulada, pois introduz uma declaração direta.
- source_word: ἐκ τῶν οὐρανῶν
  choice: vinda dos céus
  rationale: Preserva o plural do texto grego e expressa de modo natural em português a origem da voz.
- source_word: λέγουσα
  choice: disse
  rationale: O particípio introduz as palavras da voz; a forma verbal finita é mais natural em português do que a construção literal “uma voz... dizendo”.
- source_word: Οὗτός ἐστιν
  choice: Este é
  rationale: Equivalente direto e idiomático da identificação enfática feita pelo demonstrativo com o verbo copulativo.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: o meu Filho amado
  rationale: Conserva tanto a relação filial explicitada no grego quanto o sentido afetivo e solene de ἀγαπητός.
- source_word: ἐν ᾧ εὐδόκησα
  choice: em quem tenho prazer
  rationale: Preserva a construção “em quem” e comunica de maneira digna e compreensível a aprovação e o deleite expressos por εὐδοκέω, sem forçar o aspecto do aoristo em uma fórmula temporal rígida.
theological_decisions:
- issue: A declaração divina sobre a filiação de Jesus
  choice: o meu Filho amado
  alternative: o meu Filho muito amado
  rationale: A tradução mantém a afirmação explícita de filiação e amor sem acrescentar uma explicação sobre a natureza dessa relação nem favorecer uma leitura adotiva.
- issue: O plural οὐρανῶν
  choice: dos céus
  alternative: do céu
  rationale: O plural corresponde formalmente ao texto grego e é inteligível em português; o singular tradicional é registrado como alternativa idiomática.
- issue: A aprovação expressa por εὐδόκησα
  choice: em quem tenho prazer
  alternative: com quem estou muito satisfeito
  rationale: A formulação escolhida conserva a imagem e a relação sintática do original, deixando a alternativa explicitar em linguagem corrente a ideia de aprovação divina.
translation_notes:
  register: Português atual, solene e amplamente compreensível. “E eis que” preserva o destaque discursivo do original; “tenho prazer” evita tanto o arcaísmo de “me comprazo” quanto uma paráfrase excessivamente coloquial.
