  naturalness: «E eis que», embora solene, é compreensível e condiz com a função discursiva marcada de ἰδού. «Uma voz vinda dos céus disse» é natural. A troca de «em quem tenho prazer» por «em quem me agrado» melhora a fluência e evita uma formulação que, no português atual, pode soar menos idiomática ou ter associações indevidas.
  terminology: «Filho amado» preserva corretamente ὁ υἱός μου ὁ ἀγαπητός, com a capitalização contextual adequada. «Dos céus» conserva o plural grego sem comprometer a compreensão. «Me agrado» comunica aprovação e deleite sem introduzir interpretação doutrinária adicional.
