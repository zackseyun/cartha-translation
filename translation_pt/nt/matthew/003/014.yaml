id: MAT.3.14
reference: Matthew 3:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: pt
  text: 'João, porém, continuava tentando impedi-lo[a], dizendo: “Eu é que preciso ser batizado por você, e você vem a mim?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tentava impedi-lo”. O verbo grego no imperfeito pode indicar ação repetida ou contínua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: continuava tentando impedi-lo
  rationale: O imperfeito apresenta a resistência de João como ação em curso ou reiterada. A formulação comunica esse aspecto sem reduzi-lo a um passado pontual.
- source_word: λέγων
  choice: dizendo
  rationale: Preserva a forma participial e liga diretamente a tentativa de impedir Jesus à explicação verbal de João.
- source_word: Ἐγὼ χρείαν ἔχω
  choice: Eu é que preciso
  rationale: A expressão χρείαν ἔχω significa ‘preciso’, e o pronome explícito Ἐγώ recebe destaque natural em português por meio de ‘Eu é que’.
- source_word: ὑπὸ σοῦ βαπτισθῆναι
  choice: ser batizado por você
  rationale: 'O infinitivo passivo é mantido, e ὑπό com genitivo indica o agente pessoal: ‘por você’. ‘Batizado’ evita especificar além do texto o modo do rito.'
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: e você vem a mim?
  rationale: Mantém a pergunta retórica e o contraste marcado pelo pronome σὺ, sem acrescentar um conectivo interpretativo como ‘mesmo assim’.
- source_word: δὲ
  choice: porém
  rationale: Expressa o contraste moderado com a aproximação de Jesus narrada no contexto anterior, em registro natural e digno.
theological_decisions:
- issue: A objeção de João a batizar Jesus
  choice: Apresentar diretamente a consciência de João de que ele próprio precisava receber o batismo de Jesus, sem explicar no versículo o fundamento teológico dessa afirmação.
  alternative: Definir explicitamente a objeção como baseada na impecabilidade de Jesus ou somente em sua autoridade superior.
  rationale: O texto evidencia a inversão percebida por João e a superioridade de Jesus, mas não explicita aqui toda a razão teológica. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A colocação ‘João, porém’ mantém o contraste com dignidade; ‘Eu é que preciso’ reproduz a ênfase do pronome grego sem soar arcaico.
