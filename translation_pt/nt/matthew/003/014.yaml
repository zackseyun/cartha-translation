  source_fidelity: 'O texto traduz com precisão os elementos centrais do grego: o contraste de δέ («porém»), o aspecto imperfeito de διεκώλυεν («continuava tentando impedi-lo»), a ligação participial («dizendo»), a ênfase de ἐγώ («Eu é que»), o infinitivo passivo com agente expresso («ser batizado por você») e a pergunta retórica final no presente («você vem a mim?»). Não acrescenta explicação teológica estranha ao versículo.'
  naturalness: A redação é moderna, clara e natural para leitores brasileiros e internacionais. «Continuava tentando impedi-lo» comunica bem a ação continuada/reiterada, embora «tentava impedi-lo» também fosse possível. «Eu é que preciso» expressa a ênfase de modo idiomático sem registro artificial.
  terminology: «Batizado» é o termo estabelecido e semanticamente adequado, sem especificar indevidamente o modo do rito. O tratamento por «você» mantém coerência interna e boa legibilidade em português contemporâneo. Os nomes e as demais escolhas terminológicas estão corretos.
