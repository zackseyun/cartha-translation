id: MAT.3.9
reference: Matthew 3:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: pt
  text: 'E não presumam dizer entre vocês[a]: “Temos Abraão como pai”, pois eu lhes digo que Deus é capaz de, destas pedras, suscitar filhos para Abraão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dizer dentro de si mesmos”. A expressão grega pode se referir tanto ao que dizem interiormente quanto ao que dizem entre si como grupo.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: não presumam
  rationale: A proibição adverte contra assumir uma confiança infundada; “presumam” comunica melhor essa autossuficiência do que o simples “pensem”.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: dizer entre vocês
  rationale: O plural reflexivo pode indicar tanto fala no interior do grupo quanto fala interior; a opção principal ressalta a alegação coletiva, e a nota preserva a outra possibilidade.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Temos Abraão como pai
  rationale: Mantém a reivindicação enfática de descendência e privilégio ancestral em português atual e natural.
- source_word: λέγω γὰρ ὑμῖν
  choice: pois eu lhes digo
  rationale: Preserva a função explicativa de γάρ e traduz naturalmente a fórmula discursiva.
- source_word: δύναται
  choice: é capaz de
  rationale: Expressa explicitamente capacidade e poder, mantendo o tom solene.
- source_word: ἐκ τῶν λίθων τούτων
  choice: destas pedras
  rationale: Reproduz de modo conciso e natural a origem indicada por ἐκ sem alterar a imagem.
- source_word: ἐγεῖραι
  choice: suscitar
  rationale: No contexto, significa fazer surgir ou prover descendentes, sem exigir uma referência à ressurreição; “suscitar” preserva a força verbal e a ressonância bíblica.
- source_word: τέκνα
  choice: filhos
  rationale: Em português, “filhos” pode abranger os descendentes de ambos os sexos e é mais natural nesta formulação genealógica; não restringe o sentido a filhos homens.
- source_word: τῷ Ἀβραάμ
  choice: para Abraão
  rationale: Expressa a relação dos filhos com Abraão como sua descendência, de forma idiomática.
theological_decisions:
- issue: Sentido da descendência abraâmica na advertência de João
  choice: A frase rejeita a confiança na descendência física de Abraão como garantia suficiente diante de Deus, sem negar a paternidade histórica de Abraão em relação a Israel.
  alternative: Entender a fala apenas como hipérbole sem crítica ao privilégio da linhagem, ou como afirmação da substituição de Israel étnico.
  rationale: O texto censura diretamente a confiança na ancestralidade, mas não formula as conclusões teológicas mais amplas dessas leituras alternativas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Não presumam” conserva o tom incisivo da repreensão; “suscitar” mantém a força e a ressonância do verbo grego sem tornar a frase excessivamente técnica.
