  source_fidelity: A tradução preserva com precisão a proibição de uma presunção infundada (μὴ δόξητε), a ambiguidade de λέγειν ἐν ἑαυτοῖς por meio da nota, a reivindicação de Abraão como pai e a afirmação da capacidade divina de suscitar descendentes a partir das pedras. “Suscitar filhos para Abraão” comunica adequadamente ἐγεῖραι τέκνα τῷ Ἀβραάμ, sem introduzir uma leitura de ressurreição.
