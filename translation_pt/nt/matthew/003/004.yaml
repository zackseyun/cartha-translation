source:
  edition: SBLGNT
  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: pt
  text: O próprio João usava uma roupa feita de pelos de camelo e um cinto de couro em volta da cintura[a][b], e seu alimento era gafanhotos e mel silvestre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A roupa de João lembra a aparência do profeta Elias em 2 Reis 1:8, um pano de fundo importante para a maneira como Mateus apresenta João.
    reason: cross_reference
  - marker: b
    text: 'Ou: «sua roupa era de pelos de camelo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: O próprio João
  rationale: αὐτός tem valor enfático; «o próprio João» preserva essa ênfase. O δέ funciona como conexão leve e não exige uma palavra inicial específica em português.
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: usava uma roupa
  rationale: Embora εἶχεν signifique literalmente «tinha», no contexto descreve a vestimenta habitual de João. «Usava» é natural e evita sugerir mera posse.
- source_word: ἀπὸ τριχῶν καμήλου
  choice: feita de pelos de camelo
  rationale: ἀπό indica aqui o material da roupa. «Pelos de camelo» expressa com clareza que se trata da fibra animal, sem sugerir couro.
- source_word: ζώνην δερματίνην
  choice: um cinto de couro
  rationale: Equivalente direto, atual e amplamente compreensível para o cinto ou faixa feita de couro.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: em volta da cintura
  rationale: «Cintura» comunica o sentido de ὀσφύς em português corrente, sem o tom arcaico de «lombos».
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: e seu alimento era
  rationale: Mantém a construção descritiva do grego e representa τροφή de modo digno e claro.
- source_word: ἀκρίδες
  choice: gafanhotos
  rationale: É o sentido lexical comum do termo grego; não há fundamento contextual para substituir o inseto por outro alimento.
- source_word: μέλι ἄγριον
  choice: mel silvestre
  rationale: Expressa o mel encontrado ou produzido em ambiente não cultivado; «silvestre» é conciso e natural no registro bíblico moderno.
theological_decisions:
- issue: Descrição profética austera e possível evocação de Elias
  choice: Traduzir diretamente a roupa e a alimentação de João, deixando a associação com Elias para a nota.
  alternative: Inserir no texto linguagem que identifique João mais explicitamente com Elias.
  rationale: Mateus apresenta os elementos concretos da aparência e da dieta de João sem explicar aqui a alusão. A tradução preserva essa forma narrativa e evita transformar uma conexão intertextual em afirmação explícita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Roupa» é mais corrente que «veste», e «cintura» evita o arcaísmo de «lombos». As notas aparecem na ordem em que se relacionam com a descrição da vestimenta.
