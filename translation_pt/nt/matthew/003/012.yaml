id: MAT.3.12
reference: Matthew 3:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: pt
  text: Sua pá de joeirar[a] está em sua mão, e ele limpará completamente a sua eira. Recolherá o seu trigo para o celeiro[b], mas queimará a palha com fogo que não se apaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «forquilha de joeirar». Traduções mais antigas também usam «ventilabro».
    reason: lexical_alternative
  - marker: b
    text: Ou «depósito de grãos».
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: pá de joeirar
  rationale: Designa o instrumento agrícola usado para lançar ao ar o material debulhado e separar o grão da palha. A expressão é exata e compreensível em português, enquanto o tradicional «ventilabro» é pouco corrente.
- source_word: διακαθαριεῖ
  choice: limpará completamente
  rationale: O verbo composto intensifica a ação e indica uma limpeza completa da eira.
- source_word: ἅλωνα
  choice: eira
  rationale: É o termo português preciso para o lugar onde os cereais eram debulhados e joeirados.
- source_word: σῖτον
  choice: trigo
  rationale: Embora possa designar cereal ou grão em sentido mais amplo, «trigo» é natural neste contraste concreto com a palha.
- source_word: ἀποθήκην
  choice: celeiro
  rationale: Indica um lugar de armazenamento; «celeiro» preserva naturalmente o contexto agrícola, sem exigir uma construção específica.
- source_word: ἄχυρον
  choice: palha
  rationale: No contexto da joeira, refere-se ao material sem valor separado do grão; «palha» é a forma corrente e idiomática em português.
- source_word: κατακαύσει
  choice: queimará
  rationale: O resultado consumador sugerido pelo composto é sustentado pelo contexto e pelo fogo inextinguível; «queimará» evita uma formulação portuguesa artificial.
- source_word: πυρὶ ἀσβέστῳ
  choice: com fogo que não se apaga
  rationale: Expressa de modo claro e natural tanto o valor instrumental do dativo como a qualidade de um fogo impossível de extinguir.
- source_word: οὗ
  choice: Ele tem
  rationale: O relativo genitivo retoma aquele que vem no versículo anterior. A reformulação possessiva com «Ele tem na mão» produz português natural sem alterar o referente.
theological_decisions:
- issue: Imagem do juízo na separação entre trigo e palha
  choice: Manter a metáfora agrícola concreta e a linguagem futura de juízo
  alternative: Explicitar no texto que trigo e palha representam, respectivamente, justos e ímpios
  rationale: O versículo apresenta a imagem sem identificar diretamente seus referentes. A tradução preserva sua severidade e tensão teológica sem acrescentar uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Conservam-se os termos agrícolas «joeirar», «eira» e «celeiro» por sua precisão contextual; as notas esclarecem alternativas menos correntes ou mais gerais.
