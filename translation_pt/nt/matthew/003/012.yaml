  naturalness: «Sua pá de joeirar está em sua mão» é natural, digno e amplamente compreensível. «Para o celeiro» é mais idiomático neste contexto do que «no celeiro», sem alterar o sentido.
  terminology: «Pá de joeirar», «eira», «trigo», «celeiro» e «palha» são escolhas adequadas. «Palha» é a designação bíblica portuguesa corrente para ἄχυρον nesta metáfora, embora possa abranger sentidos agrícolas mais amplos em outros contextos. «Fogo que não se apaga» comunica bem πυρὶ ἀσβέστῳ.
