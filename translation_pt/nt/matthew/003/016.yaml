id: MAT.3.16
reference: Matthew 3:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: pt
  text: Depois de ser batizado, Jesus subiu imediatamente da água[a]. E eis que os céus foram abertos, e ele viu o Espírito de Deus descendo como uma pomba[b] e vindo sobre ele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “subiu para fora da água”. O grego diz literalmente “subiu da água” (ἀνέβη ἀπὸ τοῦ ὕδατος).'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como se fosse uma pomba”. O termo grego indica comparação ou semelhança.'
    reason: alternative_reading
  - marker: c
    text: Algumas traduções dizem “pousando sobre ele”, mas o verbo grego significa mais literalmente “vindo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: Depois de ser batizado, Jesus
  rationale: O particípio aoristo passivo indica uma ação anterior à do verbo principal. A formulação conserva a voz passiva e apresenta com clareza a sequência narrativa; δέ funciona aqui como conexão leve, sem exigir uma conjunção explícita em português.
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Preserva a ideia de sequência pronta e direta em linguagem atual.
- source_word: ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: subiu da água
  rationale: Representa de perto o movimento ascendente de ἀναβαίνω e a preposição ἀπό, sem tornar explícito mais do que o grego afirma.
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Mantém a função vívida de chamar a atenção do leitor, em registro bíblico ainda compreensível.
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: os céus foram abertos
  rationale: Conserva tanto o plural de οἱ οὐρανοί quanto a forma passiva do verbo, sem identificar expressamente quem os abriu.
- source_word: πνεῦμα θεοῦ
  choice: o Espírito de Deus
  rationale: Preserva a construção genitiva e sua referência contextual, sem substituir a expressão pelo título mais interpretativo 'Espírito Santo'.
- source_word: καταβαῖνον ὡσεὶ περιστερὰν
  choice: descendo como uma pomba
  rationale: O particípio expressa movimento em curso, e ὡσεὶ marca comparação, não identificação literal.
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: vindo sobre ele
  rationale: Traduz de modo transparente o verbo comum 'vir' com ἐπί, evitando a especificação interpretativa de que o Espírito teria 'pousado'.
theological_decisions:
- issue: Se πνεῦμα θεοῦ deve ser traduzido genericamente ou como referência ao Espírito Santo
  choice: o Espírito de Deus
  alternative: um espírito de Deus; o Espírito Santo
  rationale: O contexto favorece fortemente a referência ao Espírito Santo, mas a tradução mantém a expressão exata do texto grego e não troca 'de Deus' por 'Santo'.
- issue: Se ὡσεὶ περιστερὰν identifica o Espírito como uma pomba ou estabelece uma comparação
  choice: como uma pomba
  alternative: em forma de pomba; sendo uma pomba
  rationale: A partícula comparativa ὡσεὶ exige que se preserve a semelhança sem afirmar que o Espírito era literalmente uma pomba.
- issue: Se a abertura dos céus deve ter agente expresso
  choice: foram abertos
  alternative: Deus abriu os céus; os céus se abriram
  rationale: A forma passiva conserva a ausência de agente explícito no grego e evita resolver uma ambiguidade teológica que o texto mantém.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantêm-se o marcador enfático “eis que”, o plural “os céus” e a passiva “foram abertos” por sua relevância literária e semântica. As notas ficam junto às expressões a que efetivamente se referem.
