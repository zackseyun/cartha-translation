lexical_decisions:
- source_word: ποιήσατε
  choice: produzam
  rationale: Imperativo aoristo ativo na segunda pessoa do plural. “Produzam” preserva a força da ordem e combina naturalmente com a imagem de “fruto”; “deem” ou “façam” seriam menos precisos neste contexto.
- source_word: οὖν
  choice: Portanto
  rationale: Expressa a inferência decorrente da advertência anterior e mantém clara a ligação lógica.
- source_word: καρπὸν
  choice: fruto
  rationale: Equivalente usual de καρπός, empregado aqui metaforicamente para o resultado visível na conduta. Mantém-se o singular coletivo do grego.
- source_word: ἄξιον
  choice: digno de
  rationale: Com o genitivo, indica correspondência ou adequação. “Digno de” conserva a formulação direta do grego, enquanto a nota esclarece o sentido possível de conformidade.
- source_word: μετανοίας
  choice: arrependimento
  rationale: Termo português estabelecido e natural para μετάνοια neste contexto, abrangendo uma mudança interior que se manifesta numa reorientação da vida.
theological_decisions:
- issue: Sentido de καρπὸν ἄξιον τῆς μετανοίας
  choice: Uma ordem para produzir conduta visível digna do arrependimento
  alternative: Uma ordem para produzir fruto que corresponda ao arrependimento
  rationale: A construção indica adequação ou correspondência, não que as obras obtenham ou mereçam o arrependimento. A tradução mantém a tensão moral do texto sem transformar o fruto em causa meritória do arrependimento.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O imperativo plural “produzam” comunica diretamente a exortação coletiva, e o singular “fruto” preserva a imagem e a forma do texto grego.
