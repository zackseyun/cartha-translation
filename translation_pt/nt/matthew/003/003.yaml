id: MAT.3.3
reference: Matthew 3:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: pt
  text: 'Pois este é aquele de quem se falou por meio do profeta Isaías, que disse: “Voz de alguém que clama no deserto:[a] ‘Preparem o caminho do Senhor[b]; endireitem as suas veredas.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Voz de alguém que clama: ‘No deserto, preparem o caminho do Senhor; endireitem as suas veredas.’”'
    reason: A expressão grega “no deserto” pode ser ligada tanto a “clama” quanto a “preparem”.
  - marker: b
    text: Ou “do SENHOR”. A citação remete a Isaías 40:3, onde o texto hebraico traz o nome divino YHWH.
    reason: A nota preserva a relação entre o grego κυρίου e o nome divino presente no texto hebraico de Isaías.
lexical_decisions:
- source_word: οὗτος γάρ ἐστιν
  choice: Pois este é
  rationale: “Este” conserva a força demonstrativa de οὗτος, que aponta para João Batista no contexto imediato; “pois” expressa a função explicativa de γάρ.
- source_word: ὁ ῥηθεὶς διὰ Ἠσαΐου τοῦ προφήτου
  choice: aquele de quem se falou por meio do profeta Isaías
  rationale: A formulação preserva o particípio passivo substantivado e traduz διά com genitivo como agência intermediária, sem reduzir a expressão a “aquele de quem Isaías falou”.
- source_word: λέγοντος
  choice: que disse
  rationale: O particípio introduz as palavras atribuídas ao profeta; a oração relativa é natural em português e mantém Isaías como referente gramatical.
- source_word: Φωνὴ βοῶντος
  choice: Voz de alguém que clama
  rationale: A expressão conserva a relação genitiva entre “voz” e quem clama, evitando tanto acrescentar uma identificação quanto transformar o sintagma em uma oração independente.
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: “Deserto” é corrente e compreensível em português bíblico moderno para a região erma associada ao ministério de João; a possível ligação sintática alternativa é registrada em nota.
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: Preparem o caminho do Senhor
  rationale: Os imperativos no plural reproduzem a forma verbal grega; “caminho” mantém a imagem profética e “Senhor” traduz diretamente κυρίου no texto grego.
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: endireitem as suas veredas
  rationale: “Endireitem” comunica de modo conciso a ação de tornar retas; “veredas” conserva a imagem poética de caminhos menores e o pronome mantém o referente pessoal.
theological_decisions:
- issue: Tradução de κυρίου numa citação de Isaías 40:3, cujo texto hebraico contém o nome divino YHWH
  choice: Senhor
  alternative: SENHOR
  rationale: O texto grego de Mateus traz κυρίου, traduzido diretamente por “Senhor”. A nota informa a base hebraica da citação sem substituir silenciosamente a forma do texto grego nem obscurecer sua relevância cristológica.
- issue: Ligação sintática de “no deserto”
  choice: “no deserto” modifica “clama”
  alternative: “no deserto” modifica “preparem”
  rationale: A pontuação adotada segue a leitura natural no contexto imediato do ministério de João, mas o grego permite que a expressão seja ligada à ordem seguinte, como no paralelismo de Isaías; a ambiguidade é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. A construção “por meio do profeta Isaías” conserva a mediação profética do grego; “veredas” mantém o tom poético da citação sem tornar o versículo arcaico.
