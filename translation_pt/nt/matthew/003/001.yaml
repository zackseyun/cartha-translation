id: MAT.3.1
reference: Matthew 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ἐκείναις παραγίνεται Ἰωάννης ὁ βαπτιστὴς κηρύσσων ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/001.yaml
  text: In those days John the Baptist came[a], preaching in the wilderness of Judea[b],
translation:
  language: pt
  text: Naqueles dias, João Batista[a] apareceu[b], pregando no deserto da Judeia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «João, o Batizador».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «veio». O grego emprega aqui um presente histórico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: Naqueles dias
  rationale: A expressão preposicional indica tempo. O δέ funciona como conexão narrativa leve e não exige uma conjunção explícita em português.
- source_word: παραγίνεται
  choice: apareceu
  rationale: O presente histórico introduz João na narrativa. O pretérito é natural em português, e «apareceu» comunica sua entrada em cena sem sugerir necessariamente algo miraculoso.
- source_word: Ἰωάννης
  choice: João
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ὁ βαπτιστὴς
  choice: Batista
  rationale: É o título identificador consagrado e natural em português; «o Batizador» explicita mais diretamente a função verbal e é registrado em nota.
- source_word: κηρύσσων
  choice: pregando
  rationale: O particípio descreve uma ação simultânea à entrada de João em cena. «Pregando» é claro, corrente e adequado ao seu ministério de proclamação.
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: ἔρημος designa uma região desabitada ou erma. «Deserto» é a forma bíblica corrente em português e, neste contexto, não precisa indicar especificamente uma extensão arenosa.
- source_word: τῆς Ἰουδαίας
  choice: da Judeia
  rationale: Refere-se à região da Judeia, não à tribo de Judá.
theological_decisions:
- issue: Tradução do título βαπτιστής
  choice: Batista
  alternative: o Batizador
  rationale: Trata-se de uma decisão lexical, não denominacional. «Batista» é o epíteto tradicional e reconhecível em português, enquanto a alternativa torna mais transparente a atividade de batizar.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem foi ajustada para fluência natural, sem perder a introdução narrativa de João. A vírgula final foi preservada porque o versículo continua na unidade sintática seguinte.
