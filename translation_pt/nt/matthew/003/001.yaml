  source_fidelity: «Naqueles dias» traduz adequadamente Ἐν δὲ ταῖς ἡμέραις ἐκείναις, com a força conectiva leve de δέ absorvida de modo natural. «João Batista apareceu, pregando no deserto da Judeia» conserva o sujeito, o epíteto, o presente histórico vertido idiomaticamente no passado, o particípio concomitante e a localização geográfica. «Apareceu» é uma alternativa lexical legítima para παραγίνεται e não introduz, por si, uma conotação milagrosa necessária.
  naturalness: O texto é claro, corrente e digno em português moderno de ampla compreensão. «João Batista», «pregando» e «deserto da Judeia» são formulações estabelecidas e naturais. A vírgula final é apropriada, pois a frase prossegue no versículo seguinte.
