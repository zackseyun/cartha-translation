  text: ⸀καὶ λέγων· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/002.yaml
  text: and saying[a], “Repent[b], for the kingdom of heaven has drawn near.”
translation:
  language: pt
  text: 'e dizendo: “Arrependam-se[a], pois o reino dos céus[b] se aproximou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mudem sua maneira de pensar”. O verbo grego μετανοέω indica uma mudança profunda de mente e orientação, não apenas o sentimento de culpa.'
    reason: lexical_alternative
  - marker: b
    text: O grego usa o plural “dos céus”, uma formulação característica de Mateus.
    reason: lexical_clarification
lexical_decisions:
- source_word: καὶ λέγων
  choice: e dizia
  rationale: O particípio presente retoma João, sujeito do versículo anterior. Em português, a forma finita no imperfeito liga a fala à narrativa com naturalidade, sem acrescentar a ideia mais específica de pregação ou proclamação.
- source_word: Μετανοεῖτε
  choice: Arrependam-se
  rationale: O imperativo plural de μετανοέω convoca os ouvintes a uma mudança profunda de mente, orientação e conduta. “Arrependam-se” é a expressão portuguesa natural e historicamente estabelecida, enquanto a nota preserva a dimensão de mudança de pensamento que uma leitura meramente emotiva poderia obscurecer.
- source_word: γὰρ
  choice: pois
  rationale: Introduz a razão do chamado e mantém o tom conciso da proclamação.
- source_word: ἤγγικεν
  choice: se aproximou
  rationale: O perfeito de ἐγγίζω indica que o reino se aproximou e, como resultado, agora está perto. “Se aproximou” preserva melhor esse movimento consumado do que o simples “está próximo”.
- source_word: ἡ βασιλεία
  choice: o reino
  rationale: βασιλεία pode designar tanto o governo régio quanto o domínio real. “Reino” conserva a formulação característica de Mateus e sua amplitude sem reduzir o termo à ideia abstrata de reinado.
- source_word: τῶν οὐρανῶν
  choice: dos céus
  rationale: O plural grego é reproduzido naturalmente na expressão portuguesa tradicional “reino dos céus”, preservando a dicção própria de Mateus.
theological_decisions:
- issue: Sentido de μετανοεῖτε
  choice: Arrependam-se
  alternative: Mudem sua maneira de pensar
  rationale: A tradução principal mantém o chamado bíblico abrangente ao arrependimento, que envolve reorientação interior e prática, sem limitá-lo a culpa emocional. A alternativa explicita a dimensão cognitiva, mas poderia estreitar o sentido ao pensamento apenas.
- issue: Sentido de “reino dos céus”
  choice: reino dos céus
  alternative: reinado dos céus; reino de Deus
  rationale: Mantém a expressão característica de Mateus e não a substitui por uma interpretação. “Reinado” destaca o exercício da soberania, e “reino de Deus” corresponde a paralelos sinóticos, mas nenhum deles reproduz exatamente a formulação deste texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Arrependam-se” preserva o registro de proclamação; “e dizia” integra naturalmente o particípio grego à continuação narrativa. Mantiveram-se minúsculas em “reino dos céus” por se tratar de uma expressão descritiva, não de nome próprio.
