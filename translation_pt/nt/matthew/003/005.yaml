id: MAT.3.5
reference: Matthew 3:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε ἐξεπορεύετο πρὸς αὐτὸν Ἱεροσόλυμα καὶ πᾶσα ἡ Ἰουδαία καὶ πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/005.yaml
  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: pt
  text: Então, Jerusalém, toda a Judeia e toda a região ao redor do Jordão iam até ele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O verbo grego está no imperfeito e pode indicar ação contínua ou repetida: «continuavam indo até ele».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca naturalmente a progressão temporal e narrativa em relação ao ministério de João descrito antes.
- source_word: ἐξεπορεύετο
  choice: iam
  rationale: O imperfeito apresenta uma ação contínua ou repetida no passado; o plural segue os três referentes geográficos coordenados, entendidos como seus habitantes.
- source_word: πρὸς αὐτόν
  choice: até ele
  rationale: Com verbo de movimento, πρός com acusativo indica deslocamento em direção a uma pessoa; «até ele» é natural em português.
- source_word: Ἱεροσόλυμα
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome geográfico, usada metonimicamente para os habitantes da cidade.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: toda a Judeia
  rationale: Preserva a expressão geográfica abrangente e a ênfase de πᾶσα com artigo.
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: toda a região ao redor do Jordão
  rationale: Tradução clara e idiomática de περίχωρος, mantendo a referência geográfica ao rio Jordão.
- source_word: καὶ ... καὶ
  choice: e ... e
  rationale: Mantém a coordenação cumulativa dos três referentes geográficos.
theological_decisions:
- issue: Alcance das totalizações geográficas
  choice: Manter «toda» como expressão geográfica ampla, sem explicitar que cada indivíduo participou
  alternative: Parafrasear como «pessoas de Jerusalém, de toda a Judeia e de toda a região ao redor do Jordão»
  rationale: O texto descreve retoricamente a resposta generalizada ao ministério de João. A formulação preserva a amplitude do original sem transformar a expressão em uma afirmação matemática sobre cada habitante.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A concordância no plural torna explícita a leitura metonímica dos nomes de lugares como seus habitantes, já exigida pelo sentido da frase.
