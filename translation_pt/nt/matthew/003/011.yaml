  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: pt
  text: Eu batizo vocês em água para o arrependimento[a], mas aquele que vem depois de mim é mais forte do que eu, cujas sandálias não sou digno de carregar. Ele mesmo batizará vocês no Espírito Santo e em fogo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Para o arrependimento” também pode ser entendido como “com vistas ao arrependimento”. A expressão grega indica direção ou finalidade, sem especificar se o arrependimento precede o batismo, resulta dele ou é simbolizado por ele.
    reason: lexical_alternative
  - marker: b
    text: '“Fogo” pode indicar purificação ou juízo; a expressão grega deixa a imagem em aberto aqui, e o contexto deve orientar sua interpretação. Nas duas ocorrências, “em” também pode ser traduzido por “com”: “com água” e “com o Espírito Santo e fogo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: batizo / batizará
  rationale: Mantém o termo cristão estabelecido sem definir o modo do rito como imersão.
- source_word: ἐν ὕδατι
  choice: em água
  rationale: Reproduz de perto a construção grega com ἐν e mantém o paralelismo com “no Espírito Santo e em fogo”; “com água” também é possível.
- source_word: εἰς μετάνοιαν
  choice: para o arrependimento
  rationale: Preserva de modo conciso a orientação expressa por εἰς sem determinar se o arrependimento precede o batismo, resulta dele ou é por ele assinalado.
- source_word: ὁ δὲ ὀπίσω μου ἐρχόμενος
  choice: mas aquele que vem depois de mim
  rationale: Expressa naturalmente o particípio substantivado e a relação sequencial indicada por ὀπίσω μου.
- source_word: ἰσχυρότερός μού
  choice: é mais forte do que eu
  rationale: Tradução direta e corrente do comparativo, sem o tom hoje menos comum de “mais poderoso” ou “mais forte do que eu sou”.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: não sou digno
  rationale: No contexto de humildade, “digno” comunica melhor a força idiomática de ἱκανός do que uma formulação meramente ligada à capacidade.
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: carregar as sandálias dele
  rationale: βαστάσαι significa carregar ou levar, não tirar; “sandálias” é historicamente apropriado e o possessivo é inferido naturalmente da construção relativa.
- source_word: αὐτὸς
  choice: Ele mesmo
  rationale: Conserva a ênfase do pronome e o contraste com a ação de João.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: no Espírito Santo
  rationale: Entende a expressão como referência ao Espírito Santo e preserva a construção com ἐν; o artigo é natural em português.
- source_word: καὶ πυρί
  choice: e em fogo
  rationale: Repõe a preposição compartilhada pela coordenação em grego para produzir uma formulação clara em português, sem definir se o fogo representa purificação ou juízo.
theological_decisions:
- issue: Sentido de “Espírito Santo e fogo”
  choice: Manter “no Espírito Santo e em fogo” sem explicação interpretativa no texto principal.
  alternative: “no Espírito Santo e no fogo purificador” ou “no Espírito Santo e no fogo do juízo”
  rationale: A expressão admite discussão, e o contexto próximo permite relacionar o fogo à purificação ou ao juízo. A tradução mantém essa tensão.
- issue: Referente de πνεύματι ἁγίῳ
  choice: Espírito Santo
  alternative: espírito santo ou poder santo
  rationale: Neste contexto de Mateus, a expressão é mais naturalmente entendida como referência ao Espírito Santo, sem expandi-la para uma formulação doutrinária ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês”, natural no português brasileiro e inteligível internacionalmente. Conserva “em água” e “em fogo” para refletir o paralelismo grego, registrando em nota a alternativa instrumental com “com”.
