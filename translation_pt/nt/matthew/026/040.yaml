source:
  edition: SBLGNT
  text: καὶ ἔρχεται πρὸς τοὺς μαθητὰς καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Οὕτως οὐκ ἰσχύσατε μίαν ὥραν γρηγορῆσαι μετ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/040.yaml
  text: And he comes to the disciples and finds them sleeping[a], and he says to Peter, “So[b], were you not able to stay awake with me for one hour?”
translation:
  language: pt
  text: 'E ele vem até os discípulos e os encontra dormindo, e diz a Pedro: “Então, vocês não foram capazes de ficar acordados comigo por uma hora?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vigiar comigo por uma hora?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: vai até
  rationale: Mantém o presente histórico grego e expressa de modo natural o movimento em direção aos discípulos.
- source_word: πρὸς τοὺς μαθητὰς
  choice: até os discípulos
  rationale: Tradução idiomática de πρός com verbo de movimento, indicando aproximação e destino.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: os encontra dormindo
  rationale: Reproduz a construção verbal do particípio e o contraste imediato com o chamado a permanecer acordado.
- source_word: λέγει τῷ Πέτρῳ
  choice: diz a Pedro
  rationale: Conserva o presente histórico e a identificação explícita de Pedro como a pessoa a quem Jesus dirige a fala.
- source_word: Οὕτως
  choice: Então
  rationale: Neste contexto, introduz com naturalidade a surpresa e a repreensão implícitas, sem tornar o sentido excessivamente explicativo.
- source_word: οὐκ ἰσχύσατε
  choice: vocês não foram capazes
  rationale: Expressa a ideia de capacidade de ἰσχύω e torna explícito o plural da forma verbal grega.
- source_word: μίαν ὥραν
  choice: por uma hora
  rationale: O acusativo indica duração; esta é a formulação natural em português.
- source_word: γρηγορῆσαι
  choice: ficar acordados
  rationale: No contraste direto com os discípulos dormindo, comunica claramente o sentido concreto de γρηγορέω, preservando em nota a nuance de vigilância.
- source_word: μετ’ ἐμοῦ
  choice: comigo
  rationale: Expressa de maneira direta e natural a ideia de acompanhamento.
theological_decisions:
- issue: Jesus fala a Pedro, mas emprega o verbo ἰσχύσατε na segunda pessoa do plural
  choice: Manter Pedro como destinatário explícito e usar o plural “vocês” na repreensão
  alternative: Uniformizar a frase no singular, como se a pergunta fosse dirigida somente a Pedro
  rationale: 'O texto grego conserva uma mudança real de número: Jesus fala a Pedro, mas sua pergunta abrange mais de um discípulo. A tradução mantém essa tensão sem explicar que Pedro representa o grupo.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os presentes históricos foram mantidos para preservar a vivacidade narrativa. “Vocês” explicita naturalmente o plural da pergunta, apesar de Pedro ser o destinatário nomeado.
