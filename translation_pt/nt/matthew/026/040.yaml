    rationale: O primeiro “Então” traduz somente o conectivo καί, enquanto o segundo traduz οὕτως; a repetição imediata soa pesada em português. “E diz a Pedro” preserva a coordenação do original e melhora a leitura.
  - severity: low
    issue: Formulação da nota lexical
    rationale: “Vigiar comigo por uma hora” é uma alternativa mais natural para γρηγορῆσαι e mantém a nuance de vigilância sem sugerir uma explicação adicional.
