  source_fidelity: A tradução preserva adequadamente os presentes históricos, o contraste entre os discípulos dormindo e o apelo a permanecer acordados, e, sobretudo, a tensão do grego entre o destinatário singular nomeado (Pedro) e o verbo no plural (“vocês”). Contudo, “vem” corresponde mais diretamente ao presente histórico ἔρχεται do que “vai”, sem alterar a naturalidade portuguesa.
  naturalness: 'O registro é claro e contemporâneo. A sequência “Então diz a Pedro: ‘Então,...’” cria uma repetição desnecessária de “Então”, embora o primeiro corresponda apenas ao conectivo narrativo καί e o segundo represente οὕτως. Substituir o primeiro por “e” deixa a frase mais fluida.'
  terminology: “Discípulos”, “Pedro”, “dormindo”, “ficar acordados” e “comigo” são escolhas naturais e fiéis. Na nota, “vigiar” é uma alternativa portuguesa mais idiomática e diretamente ligada à nuance de γρηγορέω do que “manter-se vigilantes”.
