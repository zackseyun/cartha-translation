  text: λέγοντες· Προφήτευσον ἡμῖν, χριστέ, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/068.yaml
  text: 'saying[a], “Prophesy to us, Messiah: who is it that struck you?”'
translation:
  language: pt
  text: 'dizendo: “Profetize para nós, Messias[a]: quem foi que bateu em você?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cristo”. O título grego Χριστός é traduzido aqui como “Messias” porque está sendo usado como título, e não como uma forma semelhante a nome próprio.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: dizendo
  rationale: O particípio presente introduz diretamente a fala dos que zombavam de Jesus; “dizendo” preserva a forma e se encaixa no fluxo da frase iniciada no versículo anterior.
- source_word: Προφήτευσον
  choice: Profetize
  rationale: O imperativo aoristo é uma ordem usada em tom de zombaria. “Profetize” conserva tanto o verbo quanto a ironia, sem explicitar além do texto como a identificação deveria ocorrer.
- source_word: ἡμῖν
  choice: para nós
  rationale: O dativo indica os destinatários da profecia exigida. “Para nós” é corrente e natural em português.
- source_word: χριστέ
  choice: Messias
  rationale: Χριστός está no vocativo e funciona claramente como título. “Messias” comunica o sentido do título e realça a força messiânica da provocação.
- source_word: τίς ἐστιν
  choice: quem foi
  rationale: Na pergunta de identificação, o português idiomático usa naturalmente “quem foi”, pois o golpe já havia ocorrido.
- source_word: ὁ παίσας
  choice: que bateu
  rationale: O particípio aoristo substantivado significa “aquele que bateu”. A construção “quem foi que bateu” reproduz de maneira natural a pergunta de identificação e mantém o ato concreto.
- source_word: σε
  choice: em você
  rationale: Representa diretamente o pronome de segunda pessoa singular e produz uma formulação clara e corrente no português moderno, especialmente no Brasil.
theological_decisions:
- issue: Tradução de Χριστός como título
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, o vocativo χριστέ é uma designação titular usada sarcasticamente, não uma forma semelhante a nome próprio. “Messias” traduz o sentido do título, enquanto “Cristo” é preservado em nota como alternativa tradicional.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros. O fragmento “dizendo” preserva a ligação sintática com o versículo anterior. A fala mantém o tom de zombaria sem acrescentar explicações interpretativas.
