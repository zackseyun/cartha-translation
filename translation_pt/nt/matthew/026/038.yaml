id: MAT.26.38
reference: Matthew 26:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε λέγει ⸀αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/038.yaml
  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: pt
  text: 'Então ele lhes diz: “Minha alma está profundamente triste, até a morte.[a] Fiquem aqui e mantenham-se vigilantes comigo.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a ponto de morrer”.
    reason: lexical_alternative
  - marker: b
    text: Ou “fiquem acordados comigo”. O verbo grego pode indicar tanto permanecer acordado quanto manter-se vigilante.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Conector temporal natural em português, preservando a sequência narrativa.
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico grego e sua vivacidade narrativa, uso também natural em português.
- source_word: Περίλυπός
  choice: profundamente triste
  rationale: Comunica a intensidade de περίλυπος em linguagem clara, digna e corrente; também pode ser entendido como ‘tomada de tristeza’.
- source_word: ἡ ψυχή μου
  choice: Minha alma
  rationale: Preserva o substantivo explícito ψυχή e a expressão solene de angústia interior, sem impor uma antropologia técnica.
- source_word: ἕως θανάτου
  choice: até a morte
  rationale: Reproduz de modo conciso a construção grega e preserva sua possível ambiguidade entre intensidade extrema e ponto de morte.
- source_word: μείνατε ὧδε
  choice: Fiquem aqui
  rationale: Equivalente moderno e natural do imperativo de permanecer naquele lugar.
- source_word: γρηγορεῖτε
  choice: mantenham-se vigilantes
  rationale: Abrange a vigilância atenta pedida no contexto, sem excluir o sentido concreto de permanecer acordado.
- source_word: μετ’ ἐμοῦ
  choice: comigo
  rationale: Expressa diretamente a ideia de acompanhamento indicada por μετά com genitivo.
theological_decisions:
- issue: Tradução de ψυχή na fala de Jesus
  choice: Minha alma
  alternative: Estou profundamente triste
  rationale: Conserva o termo explícito do texto e dá plena expressão à angústia humana de Jesus, sem transformar ‘alma’ em definição doutrinária técnica.
- issue: Sentido de γρηγορεῖτε no contexto
  choice: mantenham-se vigilantes
  alternative: fiquem acordados
  rationale: O verbo pode indicar tanto não dormir quanto exercer vigilância; o texto principal preserva o alcance mais amplo, e a nota registra o sentido concreto.
- issue: Força de ἕως θανάτου
  choice: até a morte
  alternative: a ponto de morrer
  rationale: A formulação principal mantém a expressão compacta e ambígua do grego; a alternativa explicita a ideia de intensidade extrema sem torná-la obrigatória.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O presente histórico foi preservado. ‘Fiquem’ evita a formalidade regional de ‘permanecei’, enquanto ‘mantenham-se vigilantes’ conserva o tom solene e o duplo alcance contextual do verbo.
