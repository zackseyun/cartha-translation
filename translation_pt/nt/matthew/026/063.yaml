  text: ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/063.yaml
  text: 'But Jesus kept silent[a]. And the high priest said to him, “I put you under oath by the living God: tell us if you are the Messiah[b], the Son of God.”'
translation:
  language: pt
  text: 'Mas Jesus continuava em silêncio. E o sumo sacerdote lhe disse: “Eu o ponho sob juramento pelo Deus vivo[a]: diga-nos se você é o Messias[b], o Filho de Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu o conjuro pelo Deus vivo”. O grego emprega uma fórmula solene de juramento.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Cristo”. O título grego é Christos; aqui foi traduzido como “Messias” porque funciona como título, não como nome.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσιώπα
  choice: continuava em silêncio
  rationale: O imperfeito indica uma atitude contínua; a formulação comunica essa duração de modo natural e digno em português.
- source_word: ἀρχιερεὺς
  choice: sumo sacerdote
  rationale: É a designação tradicional, clara e precisa do principal ofício sacerdotal judaico neste contexto judicial.
- source_word: Ἐξορκίζω σε
  choice: Eu o ponho sob juramento
  rationale: Neste contexto, o verbo expressa uma intimação solene mediante juramento, não exorcismo. A escolha preserva a força jurídica e permanece compreensível.
- source_word: κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: pelo Deus vivo
  rationale: Com ἐξορκίζω, a expressão invoca Deus como fundamento solene do juramento; “pelo Deus vivo” reproduz naturalmente essa força.
- source_word: ἵνα ἡμῖν εἴπῃς
  choice: diga-nos
  rationale: A construção introduz o conteúdo exigido pela intimação; o imperativo é a forma mais natural de expressá-lo em português.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Aqui Χριστός funciona claramente como título do ungido esperado, e não como nome próprio. “Messias” preserva esse contexto judaico e titular.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: o Filho de Deus
  rationale: A tradução direta conserva a forma definida e todo o peso cristológico da pergunta, sem explicá-la além do texto.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Mas Jesus
  rationale: δέ assinala contraste moderado com as acusações anteriores; “Mas Jesus” mantém essa progressão narrativa.
theological_decisions:
- issue: Tradução de Χριστός na pergunta cristológica direta
  choice: Messias
  alternative: Cristo
  rationale: O artigo e o contexto mostram que o termo funciona como título. A tradução principal explicita o sentido messiânico, enquanto a nota preserva a alternativa tradicional “Cristo”.
- issue: Força de Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: 'Fórmula solene de juramento: “Eu o ponho sob juramento pelo Deus vivo”'
  alternative: “Eu o conjuro pelo Deus vivo”
  rationale: A invocação formal de Deus no cenário judicial exige mais do que uma ordem simples. A redação escolhida comunica essa força sem sugerir o sentido moderno de exorcizar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” de modo respeitoso e natural no discurso direto. A pontuação evidencia a fórmula de juramento e a exigência que ela introduz.
