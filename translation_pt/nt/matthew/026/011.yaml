source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/011.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: pt
  text: Pois vocês sempre têm os pobres com vocês[a], mas nem sempre têm a mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as pessoas pobres”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: sempre
  rationale: O advérbio indica presença ou disponibilidade contínua e sua repetição é preservada nas duas orações.
- source_word: γὰρ
  choice: pois
  rationale: Introduz a razão da declaração anterior; “pois” mantém de forma natural e concisa a ligação explicativa.
- source_word: τοὺς πτωχοὺς
  choice: os pobres
  rationale: O plural substantivado refere-se coletivamente às pessoas pobres; “os pobres” é uma formulação corrente e digna em português.
- source_word: ἔχετε
  choice: têm
  rationale: Neste contexto, o verbo expressa presença ou disponibilidade, não posse; “têm” preserva a construção paralela das duas orações.
- source_word: μεθ’ ἑαυτῶν
  choice: consigo
  rationale: A expressão indica a presença dos pobres junto aos discípulos. “Consigo” é natural em português e corresponde ao pronome reflexivo grego.
- source_word: ἐμὲ
  choice: a mim
  rationale: O pronome enfático é objeto de ἔχετε. “A mim” preserva o contraste explícito com “os pobres” e soa natural após “ter” neste paralelismo.
- source_word: δὲ
  choice: mas
  rationale: Marca o contraste entre a presença contínua dos pobres e a presença temporalmente limitada de Jesus.
- source_word: οὐ πάντοτε
  choice: nem sempre
  rationale: No contraste coordenado, “nem sempre” é a forma idiomática portuguesa de negar a repetição de πάντοτε sem sugerir ausência absoluta.
theological_decisions:
- issue: Implicação da presença de Jesus
  choice: Manter o contraste temporal entre a presença contínua dos pobres e a presença física limitada de Jesus entre os discípulos.
  alternative: Entender a declaração como uma minimização do cuidado com os pobres.
  rationale: O grego estabelece um contraste temporal e não faz uma avaliação moral negativa dos pobres. A tradução preserva o momento singular da presença de Jesus sem acrescentar uma rejeição da misericórdia ou da ajuda aos necessitados.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” torna explícito o plural dos verbos gregos; “consigo” evita a formulação menos natural “com vocês mesmos”. O paralelismo e o contraste do original foram preservados.
