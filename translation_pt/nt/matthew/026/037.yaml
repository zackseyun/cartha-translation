source:
  edition: SBLGNT
  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: pt
  text: E, levando consigo Pedro e os dois filhos de Zebedeu, começou a sentir tristeza e profunda angústia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “começou a ficar triste e aflito”.'
    reason: Alternativa lexical que traduz os dois infinitivos gregos com adjetivos mais diretos, preservando o mesmo sentido básico.
lexical_decisions:
- source_word: παραλαβὼν
  choice: levando consigo
  rationale: O particípio aoristo de παραλαμβάνω indica que Jesus levou esses discípulos escolhidos em sua companhia; “consigo” expressa essa relação com naturalidade em português.
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: os dois filhos de Zebedeu
  rationale: Preserva a identificação literal do grego sem acrescentar os nomes Tiago e João, que não aparecem neste versículo.
- source_word: ἤρξατο
  choice: começou
  rationale: Mantém explicitamente o aspecto ingressivo da construção grega com os infinitivos complementares.
- source_word: λυπεῖσθαι
  choice: sentir tristeza
  rationale: Comunica de modo claro e digno a experiência real de pesar indicada pelo verbo, evitando tanto a atenuação quanto o exagero.
- source_word: ἀδημονεῖν
  choice: profunda angústia
  rationale: Expressa o intenso sofrimento interior denotado pelo verbo e distingue sua força da tristeza já mencionada, sem introduzir a ideia de desespero.
- source_word: καὶ ... καὶ
  choice: e ... e
  rationale: A coordenação simples preserva a acumulação do grego e mantém fluidez natural em português.
theological_decisions:
- issue: Descrição do estado emocional de Jesus à luz da cristologia
  choice: Traduzir diretamente os dois verbos como tristeza real e profunda angústia humana
  alternative: Atenuar sua vulnerabilidade emocional ou intensificar o texto para “terror” ou “desespero”
  rationale: O texto apresenta o sofrimento emocional genuíno de Jesus. A tradução preserva essa realidade e a tensão cristológica sem enfraquecer sua humanidade nem ultrapassar a evidência lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Levando consigo” é idiomático; “sentir tristeza e profunda angústia” conserva a solenidade e a progressão emocional do original. O marcador foi colocado após a expressão emocional à qual a nota se refere.
