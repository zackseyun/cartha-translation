  text: μετὰ μικρὸν δὲ προσελθόντες οἱ ἑστῶτες εἶπον τῷ Πέτρῳ· Ἀληθῶς καὶ σὺ ἐξ αὐτῶν εἶ, καὶ γὰρ ἡ λαλιά σου δῆλόν σε ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/073.yaml
  text: After a little while[a], those standing there came up and said to Peter, “Surely you also are one of them, for even your accent makes you evident.”
translation:
  language: pt
  text: 'Pouco depois, os que estavam ali se aproximaram e disseram a Pedro: “Com certeza você também é um deles, pois até o seu jeito de falar o denuncia.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ μικρὸν
  choice: Pouco depois
  rationale: Expressão temporal idiomática que indica um breve intervalo; é natural e concisa em português.
- source_word: δὲ
  choice: —
  rationale: Conectivo narrativo leve, adequadamente expresso pela progressão da frase, sem necessidade de palavra separada.
- source_word: προσελθόντες
  choice: se aproximaram
  rationale: Reproduz com naturalidade o movimento em direção a Pedro expresso pelo particípio aoristo.
- source_word: οἱ ἑστῶτες
  choice: os que estavam ali
  rationale: Conserva a referência às pessoas presentes nas proximidades sem impor a caracterização mais interpretativa de 'espectadores' ou 'circunstantes'.
- source_word: εἶπον τῷ Πέτρῳ
  choice: disseram a Pedro
  rationale: Equivalência direta, clara e corrente da construção grega.
- source_word: Ἀληθῶς
  choice: Com certeza
  rationale: Expressa a afirmação confiante dos interlocutores em linguagem natural de diálogo.
- source_word: καὶ σὺ
  choice: você também
  rationale: Preserva a inclusão enfática de Pedro no grupo mencionado.
- source_word: ἐξ αὐτῶν
  choice: um deles
  rationale: Forma portuguesa idiomática para pertencimento ou associação ao grupo.
- source_word: καὶ γὰρ
  choice: pois até
  rationale: '''Pois'' introduz a razão da afirmação, e ''até'' comunica a força enfática de καί.'
- source_word: ἡ λαλιά σου
  choice: o seu jeito de falar
  rationale: λαλιά pode designar fala, modo de falar ou sotaque. 'Jeito de falar' preserva essa amplitude sem afirmar mais especificamente que se trata apenas do sotaque.
- source_word: δῆλόν σε ποιεῖ
  choice: o denuncia
  rationale: Equivalente idiomático que comunica que a maneira de falar torna reconhecível a associação de Pedro com o grupo; o pronome retoma Pedro.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O diálogo mantém tom acusatório natural. Preferiu-se 'jeito de falar' a 'sotaque' para preservar a amplitude lexical de λαλιά; 'o denuncia' evita a construção pouco natural 'o torna evidente'.
