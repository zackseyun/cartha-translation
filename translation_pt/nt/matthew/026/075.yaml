reference: Matthew 26:75
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐμνήσθη ὁ Πέτρος τοῦ ⸀ῥήματος Ἰησοῦ ⸀εἰρηκότος ὅτι Πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με, καὶ ἐξελθὼν ἔξω ἔκλαυσεν πικρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: pt
  text: 'Então Pedro se lembrou do que Jesus havia dito: “Antes que um galo cante[a], você me negará três vezes.” E saiu para fora e chorou amargamente.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Antes que o galo cante”. O grego não usa artigo, mas em português tanto a forma indefinida quanto a definida podem ser idiomáticas neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθη
  choice: se lembrou
  rationale: Expressa de modo natural em português o ato de Pedro recordar naquele momento, sem impor um sentido passivo que o contexto não exige.
- source_word: τοῦ ῥήματος Ἰησοῦ εἰρηκότος
  choice: do que Jesus havia dito
  rationale: Traduz idiomaticamente a referência ao pronunciamento anterior de Jesus; evita a formulação menos natural “da palavra que Jesus havia falado” e conserva a anterioridade do particípio perfeito.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Antes que um galo cante
  rationale: A oração temporal é natural em português, e o indefinido “um galo” reflete adequadamente o substantivo grego sem artigo.
- source_word: τρὶς
  choice: três vezes
  rationale: É a formulação moderna, clara e direta.
- source_word: ἀπαρνήσῃ
  choice: você me negará
  rationale: “Negar” transmite com clareza a rejeição de qualquer vínculo com Jesus e corresponde ao uso contextual de ἀπαρνέομαι.
- source_word: ἐξελθὼν ἔξω
  choice: saindo dali
  rationale: Reproduz naturalmente o movimento de Pedro para fora da cena, sem a redundância pouco idiomática de uma tradução mecânica do particípio e do advérbio.
- source_word: ἔκλαυσεν πικρῶς
  choice: chorou amargamente
  rationale: Mantém a força emocional do grego em linguagem atual e digna, sem acrescentar explicitamente uma interpretação psicológica.
theological_decisions:
- issue: Referência a Jesus sem título
  choice: Jesus
  alternative: o Senhor Jesus
  rationale: O texto grego traz somente Ἰησοῦ; não se acrescenta um título cristológico ausente da fonte.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” torna direta a fala dirigida a Pedro; “havia dito” e “saindo dali” evitam construções rígidas sem perder o sentido narrativo.
