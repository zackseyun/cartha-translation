id: MAT.26.31
reference: Matthew 26:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς· Πάντες ὑμεῖς σκανδαλισθήσεσθε ἐν ἐμοὶ ἐν τῇ νυκτὶ ταύτῃ, γέγραπται γάρ· Πατάξω τὸν ποιμένα, καὶ ⸀διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/031.yaml
  text: 'Then Jesus says to them[a], “You will all fall away because of me this night, for it is written: ‘I will strike the shepherd[c][b], and the sheep of the flock will be scattered.’”'
translation:
  language: pt
  text: 'Então Jesus lhes diz: “Todos vocês tropeçarão por minha causa nesta noite[a], pois está escrito: ‘Ferirei o pastor, e as ovelhas do rebanho serão dispersas’”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cairão” ou “se afastarão”. O verbo grego pode indicar tropeçar, ser levado a tropeçar ou abandonar a fidelidade; neste contexto, aponta para a deserção de Jesus.
    reason: lexical_alternative
  - marker: b
    text: Citação de Zacarias 13:7.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca naturalmente a sequência narrativa e corresponde ao advérbio temporal grego.
- source_word: λέγει
  choice: diz
  rationale: Preserva o presente histórico do grego e sua vivacidade narrativa.
- source_word: Πάντες ὑμεῖς
  choice: Todos vocês
  rationale: Mantém a ênfase explícita da combinação grega em todos os discípulos.
- source_word: σκανδαλισθήσεσθε
  choice: tropeçarão
  rationale: Preserva a metáfora e a amplitude do verbo grego, enquanto o contexto deixa claro que o tropeço se manifestará na deserção de Jesus.
- source_word: ἐν ἐμοὶ
  choice: por minha causa
  rationale: Expressa em português a relação causal com Jesus pretendida no contexto.
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: nesta noite
  rationale: Segue de perto a forma grega em registro natural e digno; 'hoje à noite' também seria possível.
- source_word: γέγραπται γάρ
  choice: pois está escrito
  rationale: Fórmula portuguesa corrente para introduzir uma citação das Escrituras, preservando o perfeito passivo.
- source_word: Πατάξω
  choice: Ferirei
  rationale: Comunica o ato de golpear sem acrescentar explicitamente o resultado de matar ou derrubar.
- source_word: τὸν ποιμένα
  choice: o pastor
  rationale: Preserva diretamente a imagem pastoril da citação.
- source_word: διασκορπισθήσονται
  choice: serão dispersas
  rationale: Mantém o futuro passivo e transmite com naturalidade a separação das ovelhas.
- source_word: τὰ πρόβατα τῆς ποίμνης
  choice: as ovelhas do rebanho
  rationale: Conserva os dois substantivos presentes no grego, sem reduzir a expressão a apenas 'as ovelhas'.
theological_decisions:
- issue: Sentido de σκανδαλισθήσεσθε em relação a Jesus
  choice: Os discípulos tropeçarão em sua fidelidade a Jesus e o abandonarão diante do que lhe acontecerá.
  alternative: Os discípulos apenas se sentirão ofendidos por Jesus, ou cometerão um tropeço moral genérico.
  rationale: O contexto imediato da dispersão das ovelhas favorece a deserção, mas 'tropeçarão' preserva a metáfora e evita transformar a previsão em uma afirmação técnica sobre apostasia final.
- issue: Presente histórico λέγει
  choice: diz
  alternative: disse
  rationale: O presente mantém a textura narrativa do texto grego sem alterar o conteúdo teológico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O presente histórico foi preservado. A formulação 'nesta noite' mantém a proximidade com o grego sem soar arcaica; 'todos vocês' preserva a ênfase do original.
source_grounding:
  english_pob_role: consult_only
