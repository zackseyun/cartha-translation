  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε ἔρχεται πρὸς τοὺς ⸀μαθητὰς καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἰδοὺ ἤγγικεν ἡ ὥρα καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: pt
  text: 'Então ele vai até os discípulos e lhes diz: “Durmam agora e descansem[a]. Vejam, chegou a hora[b], e o Filho do Homem está sendo entregue nas mãos de pecadores[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês ainda estão dormindo e descansando?” A frase grega pode ser entendida como uma pergunta retórica; também pode ter força irônica ou concessiva.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “a hora se aproximou” ou “a hora está próxima”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “está sendo traído”. O verbo grego tem o sentido mais amplo de ser entregue ou passado às mãos de alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Conector temporal natural que dá sequência à narrativa.
- source_word: ἔρχεται πρὸς τοὺς μαθητάς
  choice: ele vai até os discípulos
  rationale: Reproduz o presente histórico e expressa de modo natural o movimento em direção aos discípulos; no contexto português, “vai até” evita sugerir que o narrador esteja junto deles.
- source_word: λέγει αὐτοῖς
  choice: lhes diz
  rationale: Mantém o presente histórico e traduz com concisão a relação entre o verbo e seu objeto indireto.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Durmam agora e descansem
  rationale: Preserva na linha principal a forma superficial de ordem, bem como sua provável força irônica ou concessiva, sem convertê-la silenciosamente em pergunta.
- source_word: ἰδού
  choice: Vejam
  rationale: Interjeição atual e digna que chama solenemente a atenção dos discípulos.
- source_word: ἤγγικεν ἡ ὥρα
  choice: chegou a hora
  rationale: O perfeito de ἐγγίζω indica que a hora antes próxima agora está iminente ou presente; esta é uma formulação portuguesa natural, com a alternativa mais formal registrada em nota.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a designação cristologicamente relevante em sua forma tradicional e transparente.
- source_word: παραδίδοται
  choice: está sendo entregue
  rationale: Preserva o passivo e a amplitude de παραδίδωμι, sem restringir o sentido ao ato de trair.
- source_word: εἰς χεῖρας ἁμαρτωλῶν
  choice: nas mãos de pecadores
  rationale: Conserva a imagem concreta e idiomática do grego em português natural.
theological_decisions:
- issue: Força de Καθεύδετε ... καὶ ἀναπαύεσθε
  choice: “Durmam agora e descansem”, com a possível leitura interrogativa indicada em nota.
  alternative: “Vocês ainda estão dormindo e descansando?”
  rationale: A formulação grega admite uma ordem irônica ou concessiva e também pode ser entendida como pergunta retórica. O texto principal preserva a forma verbal, e a nota mantém aberta a ambiguidade contextual.
- issue: Sentido de παραδίδοται no contexto da paixão
  choice: “está sendo entregue”
  alternative: “está sendo traído”
  rationale: “Entregue” abrange a traição, a prisão e a entrega de Jesus sem reduzir o verbo apenas à ação de Judas nem definir de modo explícito o agente do passivo.
- issue: Valor temporal de ἤγγικεν ἡ ὥρα
  choice: “chegou a hora”
  alternative: “a hora se aproximou” ou “a hora está próxima”
  rationale: A tradução principal comunica de modo natural o ponto culminante anunciado no contexto, enquanto a nota preserva a expressão lexical de proximidade do verbo grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os presentes históricos foram mantidos. A ordem dos marcadores segue os termos anotados no texto, e todas as ambiguidades relevantes são explicitadas sem sobrecarregar a leitura principal.
