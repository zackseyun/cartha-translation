id: MAT.26.39
reference: Matthew 26:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀προελθὼν μικρὸν ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ προσευχόμενος καὶ λέγων· Πάτερ μου, εἰ δυνατόν ἐστιν, παρελθάτω ἀπ’ ἐμοῦ τὸ ποτήριον τοῦτο· πλὴν οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: pt
  text: 'E, avançando um pouco, caiu com o rosto em terra[a], orando e dizendo: “Meu Pai, se é possível, que este cálice[b] passe de mim; contudo, não como eu quero, mas como tu queres.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “prostrou-se”.'
    reason: lexical_alternative
  - marker: b
    text: Na Bíblia, o “cálice” pode representar uma porção destinada a alguém, especialmente sofrimento ou juízo; compare Mateus 20:22 e 26:42.
    reason: cross_reference
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: avançando um pouco
  rationale: Expressa o movimento por uma curta distância adiante, preservando o valor do particípio aoristo em uma construção natural em português.
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: caiu com o rosto em terra
  rationale: Mantém a postura corporal vívida indicada pelo idioma grego e comunica naturalmente a prostração, sem reduzir a expressão a uma interpretação abstrata.
- source_word: προσευχόμενος καὶ λέγων
  choice: orando e dizendo
  rationale: Conserva as ações simultâneas expressas pelos particípios presentes e acompanha de perto o fluxo narrativo do grego.
- source_word: Πάτερ μου
  choice: Meu Pai
  rationale: É a forma vocativa natural em português e preserva tanto a proximidade quanto a reverência, sem acrescentar carga afetiva ausente do texto.
- source_word: εἰ δυνατόν ἐστιν
  choice: se é possível
  rationale: Traduz integralmente a oração condicional, sem inserir um referente que o grego não explicita.
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: que este cálice passe de mim
  rationale: A construção com 'que' transmite naturalmente em português o pedido expresso pelo imperativo aoristo, enquanto 'passe de mim' preserva a imagem e a direção do grego.
- source_word: τὸ ποτήριον τοῦτο
  choice: este cálice
  rationale: Retém a imagem literal e seu peso intertextual bíblico. 'Cálice' é corrente no registro bíblico em português e evita explicar prematuramente a metáfora.
- source_word: πλὴν
  choice: contudo
  rationale: Marca com clareza a forte ressalva ao pedido anterior, em linguagem atual e digna.
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: não como eu quero, mas como tu queres
  rationale: Preserva o contraste entre as vontades e torna explícito no segundo membro o verbo elíptico no grego. 'Quero/queres' é a expressão verbal natural em português, sem enfraquecer a solenidade da oração.
theological_decisions:
- issue: A metáfora do cálice na oração de Jesus
  choice: Mantida no texto principal a imagem literal “este cálice”.
  alternative: esta aflição; este sofrimento; este destino
  rationale: ποτήριον funciona metaforicamente, com ecos bíblicos de uma porção designada, especialmente sofrimento e juízo. Preservar “cálice” conserva a profundidade intertextual sem fixar no texto principal apenas uma dimensão da imagem.
- issue: A vontade de Jesus em relação à vontade do Pai
  choice: Traduzido como “não como eu quero, mas como tu queres”.
  alternative: não seja feita a minha vontade, mas a tua
  rationale: A formulação escolhida acompanha a estrutura comparativa ὡς... ὡς do original e preserva a realidade da vontade expressa por Jesus em submissão ao Pai, sem importar a redação mais explícita de passagens paralelas.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. O tratamento “tu” foi mantido na oração por ser natural no registro bíblico e por distinguir claramente a segunda pessoa. A sintaxe evita arcaísmos desnecessários, preservando a imagem corporal, a metáfora do cálice e a tensão entre o pedido de Jesus e sua submissão ao Pai.
