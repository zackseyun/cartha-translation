  source_fidelity: 'O texto reproduz com precisão os elementos centrais do grego: o avanço por curta distância, a queda com o rosto em terra, a oração, a invocação «Meu Pai», a condição «se é possível», a preservação da metáfora de «este cálice», a ressalva introduzida por πλήν e o contraste entre o querer de Jesus e o do Pai. «Caiu com o rosto em terra» comunica adequadamente ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ, sem impor interpretação doutrinária.'
  naturalness: A redação é clara, solene e natural em português contemporâneo de ampla compreensão. «Avançando um pouco» e «que este cálice passe de mim» mantêm boa fluência narrativa e registro bíblico moderado. O emprego de «tu» dentro da oração é coerente e inteligível no registro adotado.
  terminology: «Cálice» é a escolha adequada para ποτήριον, preservando a imagem bíblica sem a reduzir a uma explicação. «Meu Pai» corresponde bem a Πάτερ μου. «Contudo» transmite apropriadamente a qualificação forte de πλήν. «Não como eu quero, mas como tu queres» conserva a estrutura comparativa do original e evita harmonização com formulações paralelas.
