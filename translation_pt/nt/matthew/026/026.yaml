id: MAT.26.26
reference: Matthew 26:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ⸀ἄρτον καὶ ⸀εὐλογήσας ἔκλασεν καὶ ⸂δοὺς τοῖς μαθηταῖς⸃ εἶπεν· Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: pt
  text: 'Enquanto comiam[a], Jesus tomou o pão e, depois de proferir a bênção[b], partiu-o, deu-o aos discípulos e disse: “Tomem, comam[c]; isto é o meu corpo.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ao comerem”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “tendo abençoado”; alguns entendem a ação como dar graças pelo pão.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Peguem e comam”.'
    reason: lexical_alternative
  - marker: d
    text: 'O grego diz literalmente: “isto é o meu corpo”. Alguns interpretam a frase como “isto significa/representa o meu corpo”, mas a tradução preserva a formulação do texto-fonte.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: Enquanto comiam
  rationale: O genitivo absoluto estabelece uma ação em andamento como cenário temporal. “Enquanto comiam” é natural em português e comunica essa simultaneidade; δέ tem aqui força conectiva leve e não exige uma conjunção adversativa.
- source_word: λαβὼν
  choice: tomou
  rationale: O particípio aoristo indica uma ação anterior na sequência narrativa. Convertê-lo em verbo finito produz português natural sem perder a ordem dos acontecimentos.
- source_word: ἄρτον
  choice: o pão
  rationale: ἄρτος designa pão e, neste contexto, pode referir-se ao pão servido à mesa. O artigo definido é idiomático em português e não pretende acrescentar uma identificação teológica ausente do grego.
- source_word: εὐλογήσας
  choice: depois de proferir a bênção
  rationale: A formulação preserva o ato de abençoar sem tornar explícito um objeto que o grego não expressa. Também evita substituir diretamente εὐλογέω por “dar graças”, embora as ideias possam se aproximar neste contexto.
- source_word: ἔκλασεν
  choice: partiu-o
  rationale: O verbo significa “partir” ou “quebrar”. O pronome retoma naturalmente “o pão” em português.
- source_word: δοὺς τοῖς μαθηταῖς
  choice: deu-o aos discípulos
  rationale: O particípio é vertido como verbo coordenado para manter a sequência narrativa fluente. “Aos discípulos” traduz o grupo conhecido sem acrescentar “seus”, que não está expresso.
- source_word: Λάβετε φάγετε
  choice: Tomem, comam
  rationale: Os dois imperativos aoristos aparecem sem conjunção no grego. A vírgula conserva essa sucessão direta e o plural corresponde aos destinatários.
- source_word: τοῦτό ἐστιν
  choice: isto é
  rationale: A cópula ἐστιν é traduzida diretamente por “é”, sem a substituir por uma interpretação como “significa” ou “representa”.
- source_word: τὸ σῶμά μου
  choice: o meu corpo
  rationale: Tradução direta de σῶμα com o possessivo. A presença do artigo antes do possessivo é natural e amplamente compreensível em português.
theological_decisions:
- issue: Formulação eucarística na declaração de Jesus
  choice: “isto é o meu corpo”
  alternative: “isto significa o meu corpo” ou “isto representa o meu corpo”
  rationale: O grego emprega a cópula simples ἐστιν. A tradução mantém a formulação da fonte e sua tensão teológica, sem incorporar ao texto uma interpretação sacramental específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A colocação pronominal em “partiu-o, deu-o” conserva um registro narrativo formal sem arcaísmo excessivo; “Tomem, comam” é direto e natural no plural.
