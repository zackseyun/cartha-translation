id: MAT.26.56
reference: Matthew 26:56
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῶσιν αἱ γραφαὶ τῶν προφητῶν. τότε οἱ μαθηταὶ πάντες ἀφέντες αὐτὸν ἔφυγον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/056.yaml
  text: But all this has happened so that the Scriptures of the prophets might be fulfilled[a]. Then all the disciples left him and fled.
translation:
  language: pt
  text: Mas tudo isso aconteceu para que se cumprissem as Escrituras dos profetas. Então todos os discípulos o abandonaram e fugiram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Mas tudo isso
  rationale: A expressão remete naturalmente à totalidade dos acontecimentos anteriores; “mas” preserva o valor conectivo levemente adversativo de δέ.
- source_word: γέγονεν
  choice: aconteceu
  rationale: O perfeito apresenta o ocorrido como fato consumado com relevância para a situação presente; em português, “aconteceu” é a formulação narrativa mais natural.
- source_word: ἵνα πληρωθῶσιν
  choice: para que se cumprissem
  rationale: Preserva a construção de finalidade ou resultado com subjuntivo, sem decidir além do que o grego permite.
- source_word: αἱ γραφαὶ τῶν προφητῶν
  choice: as Escrituras dos profetas
  rationale: “Escrituras” indica os escritos sagrados, e o genitivo “dos profetas” permanece conciso, sem acrescentar “ditas” ou “escritas”.
- source_word: τότε
  choice: Então
  rationale: Marca de modo claro e natural a sequência narrativa.
- source_word: οἱ μαθηταὶ πάντες
  choice: todos os discípulos
  rationale: Mantém a totalidade enfática expressa por πάντες sem acrescentar o possessivo “seus”, ausente no grego.
- source_word: ἀφέντες αὐτὸν
  choice: o abandonaram
  rationale: No contexto da fuga, ἀφίημι tem o sentido forte de deixar para trás ou abandonar; a oração coordenada é natural em português e comunica adequadamente a ação anterior à fuga.
- source_word: ἔφυγον
  choice: fugiram
  rationale: Equivalente direto, preciso e de registro digno para o verbo φεύγω.
theological_decisions:
- issue: Cumprimento das Escrituras proféticas
  choice: para que se cumprissem as Escrituras dos profetas
  alternative: para que se tornasse realidade o que os profetas escreveram
  rationale: A formulação mantém explicitamente o vocabulário de cumprimento e a referência às Escrituras, importantes no texto de Mateus, sem transformar o genitivo em uma explicação interpretativa.
translation_notes:
  register: Português contemporâneo, claro e digno, com ampla legibilidade brasileira. A tradução preserva a concisão do grego e sua possível nuance de finalidade ou resultado. “Abandonaram” explicita no corpo do texto a força contextual de ἀφέντες, evitando uma nota desnecessária.
