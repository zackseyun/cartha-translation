reference: Matthew 26:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγω δὲ ⸀ὑμῖν, οὐ μὴ πίω ἀπ’ ἄρτι ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω μεθ’ ὑμῶν καινὸν ἐν τῇ βασιλείᾳ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: pt
  text: 'Mas eu lhes digo: de agora em diante, certamente não beberei deste fruto da videira até aquele dia em que o beberei novo[a] com vocês no reino de meu Pai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “novamente”. O adjetivo grego pode indicar novidade de espécie ou qualidade, e a expressão talvez sugira que ele o beberá de uma nova maneira no reino futuro.'
    reason: alternativa lexical
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Mas eu lhes digo
  rationale: δέ introduz uma transição levemente contrastiva; “Mas eu lhes digo” é natural e não exagera a oposição.
- source_word: οὐ μὴ πίω
  choice: certamente não beberei
  rationale: A construção οὐ μή com o subjuntivo aoristo expressa negação futura enfática; a formulação mantém essa força sem recorrer a linguagem arcaica.
- source_word: ἀπ’ ἄρτι
  choice: de agora em diante
  rationale: Marca o momento presente como ponto inicial de um período que se estende para o futuro.
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: deste fruto da videira
  rationale: Preserva a expressão concreta do grego e sua ressonância tradicional, sem substituí-la interpretativamente por “vinho”.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: até aquele dia
  rationale: Mantém o demonstrativo e sua referência enfática a um dia futuro definido.
- source_word: ὅταν αὐτὸ πίνω
  choice: em que o beberei
  rationale: ὅταν com o subjuntivo aponta aqui para um acontecimento futuro; o pronome retoma o fruto da videira, isto é, o conteúdo do cálice.
- source_word: καινὸν
  choice: novo
  rationale: Mantém a forma adjetival e a possível ideia de novidade em espécie ou qualidade, sem decidir se a expressão significa “novamente” ou “de uma maneira nova”.
- source_word: μεθ’ ὑμῶν
  choice: com vocês
  rationale: Expressa de modo claro e corrente a companhia indicada pela preposição.
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: no reino de meu Pai
  rationale: Conserva a construção solene e a referência pessoal de Jesus a “meu Pai”.
theological_decisions:
- issue: Explicitar o conteúdo do cálice como vinho ou preservar a expressão original
  choice: Preservar “fruto da videira” no texto principal
  alternative: vinho
  rationale: O grego emprega “fruto/produto da videira”, não οἶνος (“vinho”). A expressão preservada evita acrescentar especificidade sacramental ou simbólica além do texto.
- issue: Sentido de καινὸν na refeição futura do reino
  choice: Usar “novo” no texto principal sem definir a natureza exata dessa novidade
  alternative: novamente; de uma maneira nova
  rationale: O adjetivo pode indicar novidade de espécie ou qualidade, e o contexto não resolve plenamente a nuance. A tradução conserva essa tensão e registra a alternativa em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Vocês” foi usado como forma corrente de segunda pessoa plural. A construção deliberadamente compacta “o beberei novo” preserva a relação gramatical e a ambiguidade do grego, esclarecida pela nota.
