  text: γνοὺς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Τί κόπους παρέχετε τῇ γυναικί; ἔργον γὰρ καλὸν ἠργάσατο εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: pt
  text: 'Mas Jesus, sabendo disso, lhes disse: “Por que vocês incomodam a mulher? Ela fez uma bela ação para mim”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ela fez uma boa obra em meu favor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: percebendo isso
  rationale: O particípio aoristo de γινώσκω é circunstancial; “percebendo isso” explicita de modo natural que Jesus tomou conhecimento da crítica feita à mulher.
- source_word: δὲ
  choice: Mas
  rationale: δέ assinala aqui uma transição com leve contraste entre a censura dos discípulos e a resposta corretiva de Jesus.
- source_word: Τί κόπους παρέχετε τῇ γυναικί
  choice: Por que vocês estão incomodando a mulher?
  rationale: A expressão idiomática formada por κόπους e παρέχετε indica causar incômodo, aflição ou dificuldade; esta formulação é direta e natural em português.
- source_word: ἔργον καλὸν
  choice: uma bela ação
  rationale: καλός pode unir as ideias de bondade, nobreza e beleza apropriada. “Bela ação” conserva essa avaliação positiva sem soar artificial.
- source_word: ἠργάσατο
  choice: praticou
  rationale: O aoristo descreve a ação concluída; “praticou” combina naturalmente com “ação” e mantém o sentido de realizar ou fazer.
- source_word: εἰς ἐμέ
  choice: para comigo
  rationale: A expressão preserva a orientação relacional de εἰς ἐμέ e indica que a ação foi dirigida a Jesus, sem excluir a nuance de benefício.
theological_decisions:
- issue: Avaliação da ação da mulher
  choice: uma bela ação
  alternative: uma boa obra; uma ação nobre
  rationale: A tradução conserva a aprovação expressa por καλόν e sua possível nuance estética e moral, sem introduzir noções confessionais de mérito ou eficácia sacramental.
- issue: Relação da ação com Jesus em εἰς ἐμέ
  choice: para comigo
  alternative: por mim; em meu favor
  rationale: “Para comigo” mantém aberta a relação de direção, referência e benefício possível no grego, evitando reduzir a expressão a uma única nuance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. “Bela ação” soa mais natural do que “bela obra” neste contexto e preserva a amplitude semântica de ἔργον καλόν.
