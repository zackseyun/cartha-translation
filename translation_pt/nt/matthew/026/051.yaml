id: MAT.26.51
reference: Matthew 26:51
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἷς τῶν μετὰ Ἰησοῦ ἐκτείνας τὴν χεῖρα ἀπέσπασεν τὴν μάχαιραν αὐτοῦ καὶ πατάξας τὸν δοῦλον τοῦ ἀρχιερέως ἀφεῖλεν αὐτοῦ τὸ ὠτίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/051.yaml
  text: And behold[a], one of those with Jesus stretched out his hand, drew his sword, and struck the high priest’s slave, and cut off his ear.
translation:
  language: pt
  text: E eis que um dos que estavam com Jesus estendeu a mão, sacou sua espada, golpeou o escravo[a] do sumo sacerdote e lhe cortou a orelha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”.
    reason: Alternativa lexical para δοῦλος.
lexical_decisions:
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva a vivacidade e a súbita mudança de foco introduzidas pelo marcador narrativo, em uma expressão digna e ainda compreensível no português atual.
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: um dos que estavam com Jesus
  rationale: Reproduz naturalmente a construção partitiva sem identificar a pessoa além do que o texto afirma.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: estendeu a mão
  rationale: Mantém o gesto físico e apresenta a ação anterior ao verbo principal em sequência natural em português.
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: sacou sua espada
  rationale: “Sacar a espada” é a expressão idiomática portuguesa para retirá-la e prepará-la para o uso, preservando também o possessivo do grego.
- source_word: μάχαιραν
  choice: espada
  rationale: É o equivalente amplo e tradicional; “punhal” ou “espada curta” imporiam uma precisão que o contexto não exige.
- source_word: πατάξας
  choice: golpeou
  rationale: Comunica com clareza o golpe violento desferido com a arma, sem recorrer a linguagem arcaica.
- source_word: δοῦλον
  choice: escravo
  rationale: Reflete diretamente a condição social expressa por δοῦλος, sem suavizá-la; “servo” permanece registrado como alternativa possível.
- source_word: ἀρχιερέως
  choice: sumo sacerdote
  rationale: É a designação portuguesa corrente e precisa para ἀρχιερεύς neste contexto judaico.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: lhe cortou a orelha
  rationale: Expressa de modo natural o resultado do golpe e mantém o último verbo finito da sequência grega.
- source_word: ὠτίον
  choice: orelha
  rationale: O diminutivo grego funciona aqui como designação comum da orelha; “lóbulo” seria específico demais.
theological_decisions:
- issue: Tradução de δοῦλος em um contexto social concreto
  choice: escravo
  alternative: servo
  rationale: A cena descreve a condição subordinada do homem ligado ao sumo sacerdote. “Escravo” conserva essa realidade social, enquanto “servo” pode suavizá-la; a alternativa é indicada em nota por ser possível em português bíblico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “E eis que” conserva a vivacidade narrativa de καὶ ἰδοὺ; a cadeia verbal direta reproduz o ritmo rápido da ação.
