  yaml_path: translation/nt/matthew/026/072.yaml
  text: 'And again he denied it with an oath: “I do not know the man.”[a]'
translation:
  language: pt
  text: 'E, novamente, negou com juramento: “Não conheço o homem.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a coordenação narrativa simples do grego sem acrescentar uma nuance temporal específica.
- source_word: πάλιν
  choice: novamente
  rationale: Expressa de modo natural e direto a repetição da negação de Pedro.
- source_word: ἠρνήσατο
  choice: negou
  rationale: O verbo significa negar ou repudiar. Em português, a oração que apresenta o conteúdo da negação completa naturalmente o verbo, sem necessidade de inserir o objeto pronominal “isso”.
- source_word: μετὰ ὅρκου
  choice: com juramento
  rationale: 'Expressa o acompanhamento indicado pela preposição com genitivo: Pedro negou recorrendo a um juramento. Evita a possível ideia de uma situação judicial formal sugerida por “sob juramento”.'
- source_word: ὅτι
  choice: ':'
  rationale: Introduz o conteúdo da negação; em português, os dois-pontos seguidos de discurso direto reproduzem essa função com naturalidade.
- source_word: Οὐκ οἶδα
  choice: Não conheço
  rationale: É a forma idiomática para negar conhecimento ou familiaridade com uma pessoa; “não sei” não funciona naturalmente com objeto pessoal neste contexto.
- source_word: τὸν ἄνθρωπον
  choice: esse homem
  rationale: Refere-se a um indivíduo masculino. O artigo grego pode ter valor anafórico, e “esse homem” é a formulação natural em português que conserva o tom de distanciamento de Pedro.
theological_decisions:
- issue: Referência de “τὸν ἄνθρωπον” na negação de Pedro
  choice: Manter “esse homem” em vez de substituir por “ele” ou “Jesus”.
  alternative: “ele” ou “Jesus”
  rationale: O grego emprega explicitamente “o homem”, linguagem que ressalta o distanciamento de Pedro. Nomear Jesus ou usar apenas um pronome eliminaria parte dessa força retórica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Com juramento” preserva o sentido sem sugerir um procedimento judicial formal; “esse homem” soa natural no discurso direto e mantém o distanciamento retórico do original.
