lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca naturalmente, em português, o avanço para o acontecimento seguinte da narrativa.
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: cuspiram no rosto dele
  rationale: A expressão grega descreve diretamente o ato de cuspir no rosto; esta formulação é natural e conserva a força humilhante da ação.
- source_word: ἐκολάφισαν αὐτόν
  choice: lhe deram socos
  rationale: κολαφίζω indica golpes dados com o punho. A formulação explicita o tipo de agressão em linguagem corrente e clara.
- source_word: οἱ δὲ ἐράπισαν
  choice: outros lhe deram bofetadas
  rationale: O artigo substantivado indica outro grupo, e ῥαπίζω costuma designar um golpe com a mão aberta. O objeto 'lhe' é recuperado naturalmente do contexto.
- source_word: δέ
  choice: outros
  rationale: A transição é leve, não fortemente adversativa; o ponto principal é distinguir os que praticaram a segunda ação.
theological_decisions:
- issue: Descrição dos abusos infligidos a Jesus diante do conselho
  choice: Traduzir concretamente as ações como cuspir, dar socos e dar bofetadas.
  alternative: Empregar uma descrição genérica, como 'maltrataram' ou 'bateram nele'.
  rationale: O texto enumera atos específicos de humilhação e violência. A tradução concreta preserva sua força narrativa sem acrescentar interpretação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Deram socos' e 'deram bofetadas' distinguem claramente golpes com o punho e com a mão aberta, sem linguagem arcaica.
