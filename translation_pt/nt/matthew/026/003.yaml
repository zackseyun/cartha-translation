  text: Τότε συνήχθησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως τοῦ λεγομένου Καϊάφα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/003.yaml
  text: Then the chief priests and the elders of the people were gathered in the courtyard of the high priest[a], who was called Caiaphas[b],
translation:
  language: pt
  text: Então os principais sacerdotes e os anciãos do povo se reuniram no pátio da casa do sumo sacerdote, chamado Caifás,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca naturalmente a sequência temporal e narrativa.
- source_word: συνήχθησαν
  choice: se reuniram
  rationale: Expressa em português natural o ajuntamento do grupo; embora o verbo grego tenha forma passiva, aqui pode ter sentido intransitivo, sem exigir uma formulação passiva artificial.
- source_word: ἀρχιερεῖς
  choice: principais sacerdotes
  rationale: Designa as autoridades sacerdotais dirigentes, não vários ocupantes simultâneos do cargo singular de sumo sacerdote.
- source_word: πρεσβύτεροι τοῦ λαοῦ
  choice: os anciãos do povo
  rationale: Reproduz de modo claro a relação genitiva e o título tradicional de líderes reconhecidos do povo.
- source_word: εἰς τὴν αὐλὴν
  choice: no pátio da casa
  rationale: Com o verbo de reunião, destaca naturalmente o local resultante. αὐλή refere-se aqui ao pátio associado à residência do sumo sacerdote; 'da casa' torna essa relação clara sem elevar o local necessariamente a um palácio.
- source_word: τοῦ ἀρχιερέως
  choice: do sumo sacerdote
  rationale: Equivalente português preciso para o ocupante singular do cargo.
- source_word: τοῦ λεγομένου Καϊάφα
  choice: chamado Caifás
  rationale: Conserva de forma concisa e idiomática a identificação participial pelo nome.
