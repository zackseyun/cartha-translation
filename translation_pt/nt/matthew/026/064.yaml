id: MAT.26.64
reference: Matthew 26:64
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: pt
  text: 'Jesus lhe disse: “Você mesmo o disse.[a] Contudo, eu digo a vocês: de agora em diante, vocês verão o Filho do Homem sentado à direita do Poder[b] e vindo sobre as nuvens do céu.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Foi você quem disse”. A expressão grega é uma resposta afirmativa formulada de maneira idiomática.'
    reason: lexical_alternative
  - marker: b
    text: “Poder” é uma forma reverente de se referir a Deus.
    reason: cultural_note
  - marker: c
    text: Há aqui uma alusão a Daniel 7:13 e Salmo 110:1.
    reason: cross_reference
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: Você mesmo o disse
  rationale: Preserva a forma peculiar da resposta grega e sua força afirmativa sem reduzi-la a um simples “sim”. O pronome enfático é refletido por “você mesmo”.
- source_word: πλὴν
  choice: Contudo
  rationale: Marca com naturalidade uma transição adversativa forte entre a resposta imediata e a declaração solene seguinte.
- source_word: ἀπ’ ἄρτι
  choice: de agora em diante
  rationale: Expressa o início, a partir daquele momento, de uma nova realidade, sem restringir a frase ao instante imediato.
- source_word: ὄψεσθε
  choice: vocês verão
  rationale: Traduz diretamente o futuro de ὁράω e explicita em português que o plural se refere aos ouvintes presentes.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a designação consagrada e sua ressonância com Daniel 7.
- source_word: καθήμενον
  choice: sentado
  rationale: Conserva o sentido do particípio e, no contexto, comunica entronização sem acrescentar esse conceito ao texto.
- source_word: ἐκ δεξιῶν
  choice: à direita de
  rationale: É a expressão portuguesa natural para a posição de honra, autoridade e proximidade indicada pelo grego.
- source_word: τῆς δυνάμεως
  choice: do Poder
  rationale: Mantém a circunlocução reverencial do original para Deus, sem substituir interpretativamente o termo por “Deus”.
- source_word: ἐρχόμενον
  choice: vindo
  rationale: Reproduz o particípio e preserva sua conexão sintática com “o Filho do Homem”, bem como a alusão a Daniel 7.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: sobre as nuvens do céu
  rationale: Representa de modo transparente a preposição ἐπί com genitivo e conserva a linguagem alusiva de Daniel 7:13.
theological_decisions:
- issue: Força da resposta Σὺ εἶπας ao sumo sacerdote
  choice: Uma resposta afirmativa formulada como “Você mesmo o disse”
  alternative: Um “sim” direto ou uma resposta evasiva
  rationale: A expressão funciona como afirmação no contexto, mas sua forma deliberada deve ser preservada; tratá-la como evasão enfraqueceria sua força contextual.
- issue: Referente de “Poder” (τῆς δυνάμεως)
  choice: Manter “Poder” como circunlocução reverencial para Deus
  alternative: Explicitar “Deus” ou traduzir “o Poderoso”
  rationale: Embora o referente seja Deus, a tradução conserva a reserva reverencial e a formulação específica do grego.
- issue: Relação temporal entre entronização e vinda
  choice: Manter juntos “sentado à direita do Poder” e “vindo sobre as nuvens”, sem impor um esquema temporal
  alternative: Interpretar toda a declaração como cumprimento imediato ou exclusivamente como segunda vinda futura
  rationale: Os dois particípios integram aquilo que os ouvintes verão. A formulação preserva a tensão entre exaltação, vindicação e consumação escatológica.
translation_notes:
  register: 'Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Você/vocês” evita a ambiguidade numérica de “lhe” dentro da fala: a resposta inicial é singular, dirigida ao sumo sacerdote, enquanto a declaração seguinte usa o plural. A ordem dos marcadores segue sua ocorrência no texto.'
