id: MAT.26.42
reference: Matthew 26:42
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πάλιν ἐκ δευτέρου ἀπελθὼν προσηύξατο λέγων· Πάτερ μου, εἰ οὐ δύναται ⸀τοῦτο ⸀παρελθεῖν ἐὰν μὴ αὐτὸ πίω, γενηθήτω τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
translation:
  language: pt
  text: 'Novamente, pela segunda vez, ele se afastou e orou, dizendo: “Meu Pai, se isto não pode passar sem que eu o beba, seja feita a tua vontade.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Isto” e “o” se referem ao cálice de sofrimento mencionado no versículo 39; aqui, porém, o grego diz apenas “isto” e “o”.
    reason: cross_reference
lexical_decisions:
- source_word: πάλιν ἐκ δευτέρου
  choice: Novamente, pela segunda vez
  rationale: Preserva os dois elementos de repetição do grego sem os fundir, em formulação natural e clara em português.
- source_word: ἀπελθὼν προσηύξατο
  choice: ele se afastou e orou
  rationale: Converte o particípio aoristo seguido do verbo principal em ações coordenadas, conforme o fluxo natural da narrativa em português.
- source_word: Πάτερ μου
  choice: Meu Pai
  rationale: Reproduz diretamente o vocativo e o pronome possessivo, mantendo a intimidade filial sem acrescentar nuances ausentes do texto.
- source_word: εἰ οὐ δύναται τοῦτο παρελθεῖν
  choice: se isto não pode passar
  rationale: Mantém τοῦτο como demonstrativo e expressa de modo conciso a impossibilidade indicada por οὐ δύναται.
- source_word: ἐὰν μὴ αὐτὸ πίω
  choice: sem que eu o beba
  rationale: Expressa naturalmente em português a condição necessária de ἐὰν μή e retoma o demonstrativo neutro pelo pronome objeto, sem inserir explicitamente 'cálice'.
- source_word: γενηθήτω τὸ θέλημά σου
  choice: seja feita a tua vontade
  rationale: Preserva a força imperativa da oração e a correspondência verbal com Mateus 6:10.
theological_decisions:
- issue: Explicitar 'cálice' para τοῦτο / αὐτό
  choice: Manter 'isto' e 'o' no texto principal
  alternative: Traduzir 'este cálice' e 'dele'
  rationale: O contexto imediato identifica o referente como o cálice mencionado em Mateus 26:39, mas o substantivo ποτήριον não se repete neste versículo. A tradução preserva essa forma do grego sem perder a conexão contextual.
- issue: Forma da oração de submissão de Jesus
  choice: seja feita a tua vontade
  alternative: que a tua vontade se cumpra
  rationale: A opção mantém a força volitiva e a ressonância intratextual com Mateus 6:10, sem suavizar a tensão entre o sofrimento iminente e a submissão de Jesus.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O uso de “tua” acompanha o tratamento direto e reverente da oração; a redação conserva a concisão e a ambiguidade referencial do grego.
