  text: τότε ἤρξατο καταθεματίζειν καὶ ὀμνύειν ὅτι Οὐκ οἶδα τὸν ἄνθρωπον. καὶ ⸀εὐθέως ἀλέκτωρ ἐφώνησεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: pt
  text: 'Então ele começou a invocar maldições e a jurar[a]: “Não conheço o homem.” E imediatamente um galo cantou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “começou a invocar maldições e a jurar”. É provável que tenha invocado maldições sobre si mesmo para reforçar sua negação.
    reason: Alternativa lexical e esclarecimento do provável sentido contextual de καταθεματίζειν em associação com ὀμνύειν.
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca de modo natural a sequência temporal da narrativa.
- source_word: ἤρξατο
  choice: começou
  rationale: Preserva o aspecto ingressivo e a escalada da negação de Pedro.
- source_word: καταθεματίζειν
  choice: a invocar maldições
  rationale: Expressa a ideia de proferir ou invocar maldições no contexto de uma afirmação reforçada por juramento, sem acrescentar no texto principal sobre quem recaíam.
- source_word: ὀμνύειν
  choice: a jurar
  rationale: Refere-se a prestar juramento, e não simplesmente a usar linguagem vulgar.
- source_word: Οὐκ οἶδα τὸν ἄνθρωπον
  choice: Não conheço esse homem
  rationale: Reproduz a negação de conhecimento ou relação pessoal; “esse homem” é idiomático em português no contexto e comunica o distanciamento expresso por Pedro.
- source_word: καὶ εὐθέως
  choice: E imediatamente
  rationale: Mantém a ligação narrativa e a instantaneidade do cumprimento da predição.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: um galo cantou
  rationale: É a expressão portuguesa corrente para o som emitido por um galo; o substantivo grego é anartro.
theological_decisions:
- issue: Sentido de καταθεματίζειν na negação de Pedro
  choice: Traduzir no texto como “invocar maldições”, deixando o alvo implícito.
  alternative: “amaldiçoar”; ou explicitar “invocar maldições sobre si mesmo”.
  rationale: Em associação com “jurar”, o verbo provavelmente descreve uma imprecação que reforça a negação, possivelmente dirigida contra o próprio Pedro caso estivesse mentindo. Como o grego não explicita o alvo, essa interpretação fica na nota, evitando tanto reduzir o ato a palavrões quanto inserir no texto principal um reflexivo ausente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Invocar maldições” evita que “amaldiçoar” seja entendido como dirigir uma maldição contra Jesus, enquanto a nota preserva a provável força autoimprecatória sem torná-la explícita no grego.
