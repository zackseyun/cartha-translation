id: MAT.26.19
reference: Matthew 26:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐποίησαν οἱ μαθηταὶ ὡς συνέταξεν αὐτοῖς ὁ Ἰησοῦς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/019.yaml
  text: And the disciples did as Jesus had directed them[a], and they prepared the Passover.
translation:
  language: pt
  text: E os discípulos fizeram como Jesus lhes havia ordenado e prepararam a Páscoa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a refeição da Páscoa”. A palavra grega pode referir-se à celebração da Páscoa de modo mais amplo, incluindo a refeição preparada para ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: fizeram
  rationale: Com ὡς συνέταξεν, o verbo comum ποιέω expressa que os discípulos agiram de acordo com a orientação recebida; “fizeram como” é natural e fiel.
- source_word: οἱ μαθηταὶ
  choice: os discípulos
  rationale: Tradução consagrada e clara nos Evangelhos para os seguidores que aprendem de Jesus.
- source_word: ὡς
  choice: como
  rationale: Marca conformidade entre a ação dos discípulos e aquilo que Jesus determinara.
- source_word: συνέταξεν
  choice: havia ordenado
  rationale: συντάσσω pode significar ordenar, determinar ou instruir. “Havia ordenado” preserva a autoridade de Jesus, e o mais-que-perfeito composto deixa clara a anterioridade da instrução.
- source_word: ἡτοίμασαν
  choice: prepararam
  rationale: Equivalente direto, corrente e adequado para ἑτοιμάζω neste contexto.
- source_word: τὸ πάσχα
  choice: a Páscoa
  rationale: Mantém a amplitude de πάσχα, que pode designar a celebração pascal e, por extensão contextual, a refeição ligada a ela, sem restringir o sentido no texto principal.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Forma tradicional e universalmente reconhecida do nome em português.
theological_decisions:
- issue: Alcance semântico de τὸ πάσχα
  choice: a Páscoa
  alternative: a refeição da Páscoa; o cordeiro pascal
  rationale: Neste contexto, os preparativos incluem especialmente a refeição, mas o grego não limita explicitamente o referente à refeição nem ao cordeiro. A formulação ampla preserva a ambiguidade legítima, esclarecida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “fizeram como Jesus lhes havia ordenado” é natural e conserva a sequência temporal do relato.
