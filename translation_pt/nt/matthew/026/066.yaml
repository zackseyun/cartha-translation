lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: O que vocês acham?
  rationale: A expressão idiomática pede a opinião ou o juízo dos ouvintes. Esta formulação é natural em português contemporâneo e preserva a força direta da pergunta.
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: Eles responderam
  rationale: O particípio seguido de εἶπαν é expresso naturalmente por um verbo finito. O δέ é levemente conectivo e não exige conjunção explícita em português.
- source_word: ἔνοχος θανάτου
  choice: réu de morte
  rationale: No contexto judicial, a expressão declara que Jesus foi considerado culpado e sujeito à morte. A formulação compacta preserva o caráter de veredicto e a ambiguidade entre culpa, merecimento e sujeição à pena, esclarecida na nota.
- source_word: ἐστίν
  choice: Ele é
  rationale: O pronome, necessário para uma frase natural em português, torna explícito que o veredicto se refere a Jesus.
theological_decisions:
- issue: Força judicial do veredicto do conselho
  choice: Ele é réu de morte
  alternative: Ele merece a morte; Ele está sujeito à morte
  rationale: A tradução apresenta a condenação pronunciada pelo conselho sem transformá-la numa afirmação do narrador sobre a culpa real de Jesus diante de Deus. A nota conserva as principais possibilidades da expressão jurídica grega.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O diálogo foi pontuado com travessões, e a expressão jurídica foi mantida de modo conciso.
