id: MAT.26.36
reference: Matthew 26:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: pt
  text: 'Então Jesus vai com eles a um lugar chamado Getsêmani e diz aos discípulos: “Sentem-se aqui enquanto eu vou ali orar.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Conector temporal natural que mantém a sequência narrativa.
- source_word: ἔρχεται
  choice: vai
  rationale: O presente histórico grego é preservado para dar vivacidade; no contexto do deslocamento até Getsêmani, 'vai com eles' soa natural em português.
- source_word: μετ’ αὐτῶν
  choice: com eles
  rationale: Expressa diretamente a ideia de acompanhamento de μετά com o genitivo.
- source_word: χωρίον
  choice: lugar
  rationale: Mantém a amplitude semântica do termo, sem importar de João a identificação específica como jardim.
- source_word: λεγόμενον Γεθσημανί
  choice: chamado Getsêmani
  rationale: Fórmula corrente e natural para indicar o nome do local; o nome próprio é transliterado segundo o uso português.
- source_word: λέγει τοῖς μαθηταῖς
  choice: diz aos discípulos
  rationale: Preserva o presente histórico e traduz naturalmente o objeto indireto.
- source_word: Καθίσατε αὐτοῦ
  choice: Sentem-se aqui
  rationale: O imperativo simples e o advérbio locativo são expressos em português corrente e digno.
- source_word: ἕως οὗ
  choice: enquanto
  rationale: Embora literalmente possa ser 'até que', neste contexto 'enquanto' comunica naturalmente que eles devem permanecer ali durante a ida e a oração de Jesus.
- source_word: ἀπελθὼν ἐκεῖ προσεύξωμαι
  choice: eu vou ali orar
  rationale: A construção participial seguida do subjuntivo é vertida como sequência verbal idiomática; 'ali' mantém o contraste espacial com 'aqui'.
theological_decisions:
- issue: Natureza de Getsêmani
  choice: lugar
  alternative: jardim
  rationale: Mateus emprega χωρίον, termo amplo. 'Jardim' acrescentaria uma especificação proveniente de João 18:1, em vez de conservar a formulação própria de Mateus.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Os presentes históricos foram mantidos para conservar a vivacidade narrativa. Não se acrescentou nota, pois 'enquanto' é uma equivalência contextual natural de ἕως οὗ em português e não elimina uma ambiguidade teologicamente relevante.
