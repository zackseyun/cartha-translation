id: MAT.26.53
reference: Matthew 26:53
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἢ δοκεῖς ὅτι οὐ ⸀δύναμαι παρακαλέσαι τὸν πατέρα μου, καὶ παραστήσει μοι ⸂ἄρτι πλείω⸃ δώδεκα λεγιῶνας ἀγγέλων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: pt
  text: Ou você pensa que não posso pedir ao meu Pai[a], e que ele colocará agora mesmo à minha disposição[b] mais de doze legiões[c] de anjos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rogar ao meu Pai” ou “recorrer ao meu Pai”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “colocará ao meu lado”; isto é, tornará disponíveis para me auxiliar.
    reason: lexical_alternative
  - marker: c
    text: A legião era uma grande unidade do exército romano; a expressão enfatiza uma força celestial esmagadoramente numerosa.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: Ou
  rationale: Introduz a alternativa retórica que dá continuidade à repreensão de Jesus.
- source_word: δοκεῖς
  choice: você pensa
  rationale: Forma direta e natural de expressar a pergunta retórica no português moderno.
- source_word: οὐ δύναμαι
  choice: não posso
  rationale: Preserva a ideia de capacidade ou poder, sem transformá-la em falta de vontade ou de permissão.
- source_word: παρακαλέσαι
  choice: pedir
  rationale: No contexto, indica dirigir ao Pai uma súplica ou solicitação urgente; “pedir” é claro e natural, enquanto a nota conserva alternativas mais marcadas.
- source_word: τὸν πατέρα μου
  choice: ao meu Pai
  rationale: Mantém a referência filial direta de Jesus a Deus; a inicial maiúscula segue o uso bíblico corrente em português.
- source_word: παραστήσει μοι
  choice: colocará à minha disposição
  rationale: Expressa a ideia de pôr ao lado de Jesus, tornando disponível para auxiliá-lo, sem reduzir o verbo a simplesmente “enviar”.
- source_word: ἄρτι
  choice: agora mesmo
  rationale: Comunica a disponibilidade imediata da ajuda no momento presente.
- source_word: πλείω δώδεκα
  choice: mais de doze
  rationale: Reproduz de maneira direta a comparação quantitativa do grego.
- source_word: λεγιῶνας
  choice: legiões
  rationale: Conserva a imagem militar romana e a ideia de uma força extraordinariamente numerosa.
- source_word: ἀγγέλων
  choice: de anjos
  rationale: O contexto indica seres celestiais, não mensageiros humanos.
theological_decisions:
- issue: Se a declaração de Jesus expressa incapacidade, falta de permissão ou falta de vontade para obter ajuda divina
  choice: “não posso pedir ao meu Pai”
  alternative: Uma formulação livre que sugerisse que Jesus não quer ou não tem permissão para pedir ajuda
  rationale: δύναμαι diz respeito à capacidade. A pergunta retórica afirma que Jesus tem pleno poder de recorrer ao Pai, preservando a tensão de que sua prisão não decorre de impotência, sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A segunda pessoa foi vertida por “você”, de uso corrente no Brasil, sem coloquialismos. A construção mantém o caráter retórico da pergunta e a imagem militar do original.
