id: MAT.26.12
reference: Matthew 26:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: βαλοῦσα γὰρ αὕτη τὸ μύρον τοῦτο ἐπὶ τοῦ σώματός μου πρὸς τὸ ἐνταφιάσαι με ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/012.yaml
  text: For when she poured this perfume on my body[b][a], she did it to prepare me for burial.
translation:
  language: pt
  text: Pois, ao derramar este perfume sobre o meu corpo, ela fez isso para me preparar para o sepultamento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para o meu sepultamento». O verbo grego pode referir-se à preparação do corpo para o sepultamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσα
  choice: ao derramar
  rationale: O particípio aoristo de βάλλω, neste contexto, descreve a aplicação do perfume. «Ao derramar» expressa naturalmente em português a relação circunstancial com o verbo principal, sem recorrer ao sentido literal inadequado de «lançar».
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação de Jesus para o ato da mulher e conserva de modo conciso a força explicativa de γάρ.
- source_word: αὕτη
  choice: ela
  rationale: Embora o demonstrativo possa ser traduzido literalmente como «esta mulher», o referente já está claro; «ela» é natural e suficiente em português.
- source_word: τὸ μύρον τοῦτο
  choice: este perfume
  rationale: μύρον designa óleo ou unguento perfumado. «Perfume» é claro e atual, e o demonstrativo «este» preserva τοῦτο.
- source_word: ἐπὶ τοῦ σώματός μου
  choice: sobre o meu corpo
  rationale: ἐπί com o genitivo indica aplicação ou contato sobre o corpo; «sobre o meu corpo» reproduz isso de modo natural e digno.
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: para me preparar para o sepultamento
  rationale: πρός com infinitivo articular expressa finalidade, e ἐνταφιάζω pode incluir a preparação funerária do corpo. A formulação torna essa nuance clara sem afirmar que a mulher realizou literalmente o sepultamento.
- source_word: ἐποίησεν
  choice: ela fez isso
  rationale: ποιέω retoma a ação descrita pelo particípio. «Fez isso» mantém a estrutura do grego e liga o derramamento à finalidade indicada.
theological_decisions:
- issue: Sentido de ἐνταφιάζω em relação à morte de Jesus
  choice: O ato da mulher é interpretado como preparação de Jesus para o sepultamento.
  alternative: O ato foi simplesmente «para o meu sepultamento», sem explicitar a preparação do corpo.
  rationale: O verbo abrange a preparação funerária ou o sepultamento. «Preparar para o sepultamento» preserva a antecipação da morte de Jesus e evita sugerir que ela própria efetuou seu enterro.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Sepultamento» foi preferido a «enterro» pelo registro do contexto, sem arcaísmo. A ordem da frase preserva a explicação introduzida por γάρ e mantém a finalidade do gesto.
