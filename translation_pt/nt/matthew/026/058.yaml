  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἠκολούθει αὐτῷ ἀπὸ μακρόθεν ἕως τῆς αὐλῆς τοῦ ἀρχιερέως, καὶ εἰσελθὼν ἔσω ἐκάθητο μετὰ τῶν ὑπηρετῶν ἰδεῖν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: pt
  text: Mas Pedro o seguia de longe, até o pátio do sumo sacerdote. Depois de entrar, ficou sentado com os guardas[a] para ver o desfecho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servidores”, “auxiliares” ou “agentes”. O termo grego ὑπηρέται pode designar subordinados ou assistentes oficiais; a função exata deles neste contexto não é especificada.
    reason: lexical_alternative
  - marker: b
    text: Ou “o fim”. A expressão grega τὸ τέλος significa literalmente “o fim”, mas aqui provavelmente se refere ao desfecho do que aconteceria com Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: seguia
  rationale: O pretérito imperfeito expressa uma ação contínua de Pedro no pano de fundo da narrativa.
- source_word: ἀπὸ μακρόθεν
  choice: de longe
  rationale: Expressão natural em português que preserva a ideia de distância física.
- source_word: ἕως τῆς αὐλῆς
  choice: até o pátio
  rationale: ἕως indica o limite alcançado, e αὐλή designa aqui o pátio interno da residência.
- source_word: τοῦ ἀρχιερέως
  choice: do sumo sacerdote
  rationale: Equivalente consagrado e adequado ao contexto da narrativa da paixão.
- source_word: εἰσελθὼν ἔσω
  choice: Depois de entrar
  rationale: A construção participial indica que a entrada ocorreu antes da ação principal; em português, o verbo 'entrar' já comunica naturalmente o movimento para dentro.
- source_word: ἐκάθητο
  choice: ficou sentado
  rationale: O pretérito imperfeito grego retrata Pedro em posição contínua; 'ficou sentado' é natural em português e preserva melhor essa duração do que o simples 'sentou-se'.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: com os guardas
  rationale: No contexto da prisão e do pátio do sumo sacerdote, o termo se refere a subordinados ou agentes a serviço das autoridades; 'guardas' comunica sua função provável, enquanto a nota preserva a amplitude lexical.
- source_word: ἰδεῖν
  choice: para ver
  rationale: O infinitivo exprime propósito, traduzido diretamente pela construção 'para ver'.
- source_word: τὸ τέλος
  choice: o desfecho
  rationale: Neste contexto, τέλος aponta provavelmente para o resultado final dos acontecimentos, e 'desfecho' comunica isso com clareza sem afastar-se da noção de fim.
