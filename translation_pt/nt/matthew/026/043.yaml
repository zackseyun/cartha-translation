  text: καὶ ἐλθὼν ⸂πάλιν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ βεβαρημένοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/043.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down.
translation:
  language: pt
  text: E, ao voltar, encontrou-os dormindo, pois os olhos deles estavam pesados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: voltando
  rationale: O particípio aoristo adverbial indica o retorno de Jesus antes da ação principal; “voltando” é natural no contexto e preserva o fluxo participial.
- source_word: πάλιν
  choice: novamente
  rationale: Expressa repetição de modo claro e corrente.
- source_word: εὗρεν
  choice: encontrou-os
  rationale: Reproduz o uso narrativo comum de εὑρίσκω e explicita naturalmente o objeto pronominal.
- source_word: καθεύδοντας
  choice: dormindo
  rationale: O particípio presente descreve a ação em andamento no momento em que Jesus os encontrou.
- source_word: ἦσαν γὰρ
  choice: pois ... estavam
  rationale: “Pois” conserva a relação explicativa introduzida por γάρ, enquanto “estavam” apresenta o estado resultante.
- source_word: οἱ ὀφθαλμοὶ
  choice: os olhos deles
  rationale: Formulação natural e clara em português para αὐτῶν οἱ ὀφθαλμοί.
- source_word: βεβαρημένοι
  choice: pesados
  rationale: O particípio perfeito passivo descreve o estado persistente dos olhos. Em português, “os olhos estavam pesados” é idiomático, preserva a imagem grega e comunica a sonolência sem explicá-la em excesso.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A repetição contextual é expressa por “voltando” e “novamente” sem eliminar a estrutura do grego. Não se acrescentou nota, pois “os olhos estavam pesados” preserva diretamente a imagem e o sentido lexical do original.
