  text: Οἱ δὲ κρατήσαντες τὸν Ἰησοῦν ἀπήγαγον πρὸς Καϊάφαν τὸν ἀρχιερέα, ὅπου οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι συνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/057.yaml
  text: Those who had seized Jesus led him away to Caiaphas the high priest[a], where the scribes and the elders had gathered.
translation:
  language: pt
  text: Os que haviam prendido Jesus o levaram a Caifás, o sumo sacerdote, onde os escribas e os anciãos haviam se reunido[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “haviam sido reunidos”. Neste contexto, o verbo grego pode indicar tanto que eles se reuniram como que foram reunidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Os que
  rationale: O artigo com o particípio é expresso naturalmente como “os que”. A força branda e continuativa de δέ fica implícita no avanço da narrativa, sem acrescentar um marcador temporal inexistente.
- source_word: κρατήσαντες
  choice: haviam prendido
  rationale: O particípio aoristo indica uma ação anterior à de levar Jesus. “Prendido” comunica de modo natural a apreensão no contexto, sem enfatizar uma formulação jurídica técnica.
- source_word: ἀπήγαγον
  choice: o levaram
  rationale: Expressa o movimento sob custódia indicado por ἀπάγω e mantém uma ordem natural no português brasileiro contemporâneo.
- source_word: πρὸς Καϊάφαν
  choice: a Caifás
  rationale: πρός com acusativo indica movimento em direção a uma pessoa. A tradução não acrescenta “à casa de”, informação que não está explícita no grego.
- source_word: τὸν ἀρχιερέα
  choice: o sumo sacerdote
  rationale: É o título tradicional e preciso de Caifás nesse contexto.
- source_word: ὅπου
  choice: onde
  rationale: Reproduz de modo direto e natural o advérbio relativo locativo.
- source_word: οἱ γραμματεῖς
  choice: os escribas
  rationale: “Escribas” é o termo estabelecido e exato para esses especialistas religiosos e jurídicos no contexto dos Evangelhos.
- source_word: οἱ πρεσβύτεροι
  choice: os anciãos
  rationale: Designa os líderes judeus reconhecidos e preserva a terminologia histórica do texto.
- source_word: συνήχθησαν
  choice: haviam se reunido
  rationale: A forma verbal pode ser entendida com sentido intransitivo nesse contexto. O mais-que-perfeito composto deixa claro que eles já estavam reunidos quando Jesus foi levado a Caifás.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem pronominal de boa legibilidade brasileira. A formulação evita acrescentar um local específico, como a casa de Caifás, e preserva em nota a possível leitura passiva de συνήχθησαν.
