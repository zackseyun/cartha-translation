id: MAT.26.33
reference: Matthew 26:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Εἰ πάντες σκανδαλισθήσονται ἐν σοί, ⸀ἐγὼ οὐδέποτε σκανδαλισθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: pt
  text: 'Mas Pedro lhe respondeu: “Ainda que todos venham a se afastar[a] por tua causa, eu jamais me afastarei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tropeçar”, “escandalizar-se” ou “ser levado a tropeçar”. O verbo grego pode indicar ser derrubado, sentir-se ofendido ou afastar-se da lealdade a alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: Mas Pedro lhe respondeu
  rationale: A construção narrativa literalmente equivalente a “respondendo, disse-lhe” é expressa com naturalidade em português por “lhe respondeu”. “Mas” representa o contraste introduzido por δέ com a afirmação anterior de Jesus.
- source_word: Εἰ πάντες
  choice: Ainda que todos
  rationale: Embora εἰ seja formalmente condicional, aqui a frase tem força concessiva e contrasta “todos” com o enfático “eu” de Pedro.
- source_word: σκανδαλισθήσονται / σκανδαλισθήσομαι
  choice: venham a se afastar / me afastarei
  rationale: No contexto do fracasso dos discípulos sob pressão, o verbo aponta para tropeçar a ponto de abandonar a lealdade a Jesus. “Afastar-se” comunica essa dimensão relacional sem transformar a expressão em uma afirmação técnica sobre apostasia definitiva; a nota preserva a metáfora e as demais possibilidades lexicais.
- source_word: ἐν σοί
  choice: por tua causa
  rationale: Com σκανδαλίζω, a expressão indica que Jesus é a ocasião ou causa do tropeço, não localização literal “em ti”.
- source_word: ἐγὼ οὐδέποτε
  choice: eu jamais
  rationale: O pronome explícito ἐγώ é contrastivo, e “eu jamais” conserva tanto a ênfase pessoal de Pedro quanto a negação temporal enfática de οὐδέποτε.
theological_decisions:
- issue: Sentido de σκανδαλίζω no contexto do fracasso no discipulado
  choice: se afastar
  alternative: tropeçar; escandalizar-se; ser levado a tropeçar
  rationale: “Se afastar” expressa uma ruptura de lealdade mais forte que um simples erro momentâneo, mas evita decidir se Pedro fala de apostasia final. A nota registra a amplitude metafórica do verbo grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção concessiva natural. O tratamento por “tu” aparece apenas nas formas oblíquas e possessivas (“lhe”, “tua”), evitando regionalismo verbal marcado; a fala mantém a ênfase confiante de Pedro.
