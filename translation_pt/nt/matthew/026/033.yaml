  verdict: approve
  source_fidelity: A tradução representa com fidelidade a construção narrativa «Pedro lhe respondeu», o contraste de δέ («Mas»), a força concessiva de εἰ πάντες («Ainda que todos»), a ênfase contrastiva de ἐγώ («eu») e a negação enfática οὐδέποτε («jamais»). «Afastar-se por tua causa» é uma interpretação contextual defensável de σκανδαλίζω ἐν σοί, e a nota preserva adequadamente outras possibilidades sem resolver a ambiguidade lexical em sentido doutrinário.
  naturalness: O texto é claro, fluente e de registro bíblico moderno acessível. «Ainda que todos venham a se afastar» é uma construção natural; o emprego de «tua» na fala dirigida a Jesus mantém dignidade sem exigir flexão verbal marcada de segunda pessoa. «Lhe» no enunciado narrativo refere-se naturalmente a Jesus em terceira pessoa.
  terminology: «Afastar-se» comunica de modo apropriado, neste contexto, o tropeço que conduz ao abandono de lealdade, sem impor a noção de apostasia definitiva. A nota lexical oferece «tropeçar», «escandalizar-se» e a nuance passiva, resguardando a extensão semântica de σκανδαλίζω.
