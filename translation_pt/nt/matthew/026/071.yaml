  text: 'Mas, quando ele saiu para o portão, outra mulher o viu e diz aos que estavam ali: “Este homem estava com Jesus, o Nazareno.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλῶνα
  choice: portão
