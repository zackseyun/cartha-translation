- source_word: λέγει
  choice: disse
  rationale: Embora o grego use o presente histórico (“diz”), o pretérito mantém a progressão narrativa de modo natural em português; a mudança não altera o conteúdo do ato de fala.
- source_word: τοῦ Ναζωραίου
  choice: o Nazareno
  rationale: Preserva o gentílico/título identificador aplicado a Jesus, em formulação portuguesa tradicional e compreensível.
