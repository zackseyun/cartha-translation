id: MAT.26.27
reference: Matthew 26:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων· Πίετε ἐξ αὐτοῦ πάντες,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/027.yaml
  text: And having taken a cup and given thanks[a], he gave it to them, saying, “Drink from it[c][b], all of you,”
translation:
  language: pt
  text: 'E, depois de tomar um cálice e dar graças, deu-o a eles, dizendo: “Bebam dele, todos vocês.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: tomando
  rationale: O particípio aoristo apresenta uma ação anterior à do verbo principal; “tomando” conserva o fluxo participial de modo natural em português.
- source_word: ποτήριον
  choice: um cálice
  rationale: O substantivo grego não tem artigo. “Um cálice” preserva essa forma, enquanto “cálice” é adequado ao recipiente de vinho no contexto da refeição.
- source_word: εὐχαριστήσας
  choice: dando graças
  rationale: Traduz diretamente a ideia de agradecer, sem introduzir linguagem sacramental posterior; em sequência com “tomando”, o contexto deixa clara a anterioridade em relação a “entregou”.
- source_word: ἔδωκεν αὐτοῖς
  choice: entregou-o a eles
  rationale: “Entregou” expressa naturalmente dar o cálice aos discípulos, e o pronome retoma explicitamente “um cálice”.
- source_word: λέγων
  choice: dizendo
  rationale: Mantém o particípio presente que introduz a fala direta.
- source_word: Πίετε
  choice: Bebam
  rationale: Imperativo plural direto e natural no português moderno.
- source_word: ἐξ αὐτοῦ
  choice: dele
  rationale: Expressa de maneira idiomática a origem ou recipiente do qual se bebe.
- source_word: πάντες
  choice: todos vocês
  rationale: Deixa claro que “todos” se refere aos destinatários da ordem, e não à quantidade do conteúdo a ser bebida.
theological_decisions:
- issue: Possíveis conotações eucarísticas ou sacramentais de εὐχαριστήσας
  choice: dando graças
  alternative: abençoando-o
  rationale: O verbo significa dar graças. A tradução conserva o sentido lexical sem impor uma formulação doutrinária posterior.
- issue: Escopo de πάντες na ordem
  choice: todos vocês
  alternative: tudo
  rationale: Sintaticamente, πάντες designa todos os destinatários da ordem. A tradução evita a leitura equivocada de que a ordem seria beber todo o conteúdo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Cálice” mantém o registro bíblico corrente sem soar arcaico; “todos vocês” explicita com naturalidade o plural de πάντες.
