  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Ἰούδας ὁ παραδιδοὺς αὐτὸν εἶπεν· Μήτι ἐγώ εἰμι, ῥαββί; λέγει αὐτῷ· Σὺ εἶπας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: pt
  text: 'Então Judas, aquele que o estava traindo, perguntou: “Por acaso sou eu, Rabi?” Jesus lhe respondeu: “Você mesmo disse.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: aquele que o estava traindo
  rationale: O particípio presente identifica Judas como o agente da traição em curso; a forma progressiva transmite esse aspecto com naturalidade.
- source_word: Μήτι ἐγώ εἰμι
  choice: Por acaso sou eu
  rationale: μήτι introduz uma pergunta que espera resposta negativa, mas em português a formulação mantém a ironia e a tensão sem acrescentar uma negação pesada.
- source_word: ῥαββί
  choice: Rabi
  rationale: Preserva o título semítico reconhecível e distingue a forma de tratamento usada por Judas.
- source_word: Σὺ εἶπας
  choice: Você mesmo disse
  rationale: Reproduz a resposta idiomática, indireta e deliberadamente não expandida de Jesus, com ênfase adequada no pronome σύ.
theological_decisions:
- issue: O grau de explicitação da resposta de Jesus
  choice: Você mesmo disse.
  alternative: Sim, sou eu / É como você disse.
  rationale: O grego não contém um 'sim' explícito. A tradução conserva a forma alusiva e sua tensão, evitando transformar a resposta em afirmação mais direta do que o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. O redundante semitismo “respondendo, disse” foi vertido naturalmente por “perguntou”, conforme a função contextual da fala, e o sujeito “Jesus” foi explicitado para clareza referencial.
