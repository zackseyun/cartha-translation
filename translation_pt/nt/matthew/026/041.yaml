review_pass:
  verdict: approve
  source_fidelity: A tradução reproduz com fidelidade os dois imperativos presentes («Vigiem e orem»), a finalidade negativa («para que não entrem em tentação») e o contraste concessivo entre espírito e carne. «Vigiem» preserva adequadamente tanto o contexto imediato de permanecer acordado quanto a vigilância implicada por γρηγορεῖτε. «Entrem em tentação» mantém a metáfora de εἰσέλθητε εἰς πειρασμόν sem a interpretar como «caiam».
  naturalness: O português é moderno, claro e apropriado ao registro bíblico. «O espírito, de fato, está disposto, mas a carne é fraca» é natural e conserva a força contrastiva de μέν...δέ. Os imperativos plurais são adequados à variedade-alvo.
  terminology: «Tentação» é uma escolha contextual defensável para πειρασμόν, e a nota registra de modo suficiente as alternativas «provação» e «prova» e a dupla possibilidade semântica. «Espírito» em minúscula e «carne» preservam a ambiguidade e o contraste antropológico do texto, sem impor uma leitura doutrinária.
