id: MAT.26.41
reference: Matthew 26:41
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: pt
  text: Vigiem e orem[a], para que não entrem em tentação. O espírito, de fato, está disposto, mas a carne é fraca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “provação” ou “prova”. O termo grego pode se referir tanto à sedução para pecar quanto a uma situação que põe alguém à prova.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Vigiem
  rationale: O imperativo plural significa manter-se acordado e vigilante. No contexto do Getsêmani, “Vigiem” abrange tanto a necessidade física de não dormir quanto a vigilância espiritual.
- source_word: προσεύχεσθε
  choice: orem
  rationale: Imperativo plural presente, traduzido pelo comando natural e corrente em português.
- source_word: ἵνα μὴ εἰσέλθητε
  choice: para que não entrem
  rationale: Preserva a construção de finalidade/prevenção e a imagem grega de entrar numa situação de tentação ou prova, sem substituí-la pela interpretação “cair”.
- source_word: πειρασμόν
  choice: tentação
  rationale: No contexto imediato, refere-se adequadamente ao perigo de falhar moralmente sob pressão. A amplitude semântica de prova ou provação é registrada em nota.
- source_word: τὸ μὲν πνεῦμα πρόθυμον
  choice: O espírito, de fato, está disposto
  rationale: “Espírito” preserva o contraste com “carne”; “está disposto” expressa prontidão ou boa vontade. “De fato” representa de modo natural a primeira parte do contraste μέν...δέ.
- source_word: ἡ δὲ σὰρξ ἀσθενής
  choice: mas a carne é fraca
  rationale: “Carne” conserva a imagem bíblica e a tensão com “espírito”, enquanto “fraca” comunica diretamente a fragilidade humana indicada por ἀσθενής.
theological_decisions:
- issue: Referente de πνεῦμα
  choice: espírito humano ou disposição interior, com inicial minúscula
  alternative: Espírito Santo
  rationale: O contraste com a carne e a situação dos discípulos — intenção sincera, mas incapacidade prática — favorecem o espírito humano. A minúscula evita introduzir uma afirmação pneumatológica que o texto não explicita.
- issue: Sentido de σάρξ
  choice: carne
  alternative: corpo; natureza pecaminosa
  rationale: Aqui a expressão destaca a fragilidade humana e corporal, não necessariamente uma categoria desenvolvida de natureza pecaminosa. A tradução literal preserva a tensão e evita interpretação excessiva.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural. “Vigiem” é natural no contexto bíblico e mantém os sentidos físico e espiritual. A formulação conserva as metáforas de “entrar”, “espírito” e “carne” sem explicá-las demais.
