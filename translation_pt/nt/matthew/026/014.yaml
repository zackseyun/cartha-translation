  text: Τότε πορευθεὶς εἷς τῶν δώδεκα, ὁ λεγόμενος Ἰούδας Ἰσκαριώτης, πρὸς τοὺς ἀρχιερεῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/014.yaml
  text: Then one of the twelve[a], the one called Judas Iscariot, went to the chief priests,
translation:
  language: pt
  text: Então, um dos doze[a], aquele que era chamado Judas Iscariotes, foi até os principais sacerdotes,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um dos Doze”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marcador temporal que introduz o acontecimento seguinte e preserva com naturalidade o fluxo narrativo.
- source_word: πορευθεὶς
  choice: foi
  rationale: O particípio aoristo de πορεύομαι tem função adverbial; em português corrente, a forma finita comunica naturalmente o deslocamento em direção aos sacerdotes.
- source_word: εἷς τῶν δώδεκα
  choice: um dos doze
  rationale: Expressão partitiva direta. A inicial minúscula evita acrescentar ao grego uma capitalização interpretativa, sem obscurecer a referência ao grupo dos doze discípulos.
- source_word: ὁ λεγόμενος
  choice: aquele que era chamado
  rationale: Reproduz a identificação apositiva e o valor passivo da expressão grega em linguagem natural e dignificada.
- source_word: Ἰούδας Ἰσκαριώτης
  choice: Judas Iscariotes
  rationale: Emprega as formas tradicionais e amplamente reconhecidas em português para o nome e o epíteto.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: até os principais sacerdotes
  rationale: πρός com acusativo indica movimento em direção a pessoas. 'Principais sacerdotes' designa as autoridades sacerdotais superiores e evita sugerir vários ocupantes simultâneos do cargo singular de sumo sacerdote.
theological_decisions:
- issue: Forma gráfica da designação τῶν δώδεκα
  choice: um dos doze
  alternative: um dos Doze
  rationale: A minúscula não impõe uma capitalização ausente do texto grego, embora a leitura como designação reconhecida do grupo seja legítima e seja registrada em nota.
translation_notes:
  register: Português moderno, natural e dignificado, de ampla compreensão internacional e boa legibilidade brasileira. A vírgula final foi mantida porque o versículo continua sintaticamente no seguinte.
