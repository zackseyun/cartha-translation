  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: pt
  text: O Filho do Homem vai, conforme está escrito a respeito dele, mas ai daquele homem por meio de quem o Filho do Homem é traído.[a] Melhor seria para ele se aquele homem não tivesse nascido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é entregue”. O verbo grego pode significar tanto “trair” como, mais literalmente, “entregar”; aqui, “é traído” foi escolhido porque está em vista a deslealdade de Judas.'
    reason: alternativa lexical
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ... δὲ
  choice: O Filho do Homem ... mas
  rationale: Mantém o título consagrado “Filho do Homem” e expressa de modo natural, por meio de “mas”, o contraste correlativo entre μὲν e δὲ, sem tornar a frase artificial com um advérbio como “de fato”.
- source_word: ὑπάγει
  choice: vai
  rationale: Preserva o presente e a relativa abertura semântica do verbo, sem explicitar “morre” ou limitar o sentido a uma simples partida.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: conforme está escrito a respeito dele
  rationale: “Está escrito” é a formulação portuguesa corrente para o perfeito passivo γέγραπται e comunica o resultado permanente do que foi escrito; “a respeito dele” traduz claramente περὶ αὐτοῦ.
- source_word: οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: mas ai daquele homem
  rationale: “Ai” conserva a força profética e judicial de οὐαί, enquanto “daquele homem” é a construção idiomática portuguesa correspondente e mantém a referência masculina específica.
- source_word: δι’ οὗ
  choice: por meio de quem
  rationale: Representa a agência ou instrumentalidade de διά com genitivo sem eliminar a nuance mediada da expressão.
- source_word: παραδίδοται
  choice: é traído
  rationale: No contexto imediato da ação de Judas, “é traído” comunica naturalmente a deslealdade envolvida. A alternativa mais literal, “é entregue”, é registrada em nota para preservar a amplitude lexical.
- source_word: καλὸν ἦν αὐτῷ
  choice: Melhor seria para ele
  rationale: A formulação idiomática expressa a preferência contrafactual pretendida no contexto. Embora καλόν seja literalmente “bom”, “melhor seria” é mais natural em português diante da comparação implícita com ter nascido.
- source_word: εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος
  choice: se aquele homem não tivesse nascido
  rationale: O mais-que-perfeito composto do subjuntivo expressa naturalmente a condição irreal referente ao passado, e a repetição de “aquele homem” preserva a ênfase distanciadora de ἐκεῖνος.
theological_decisions:
- issue: Relação entre o cumprimento das Escrituras e a responsabilidade humana
  choice: Preservar lado a lado que o Filho do Homem segue conforme está escrito e que o homem que o trai está sob um pronunciamento de desgraça.
  alternative: Resolver a tensão em favor de um determinismo que reduza a culpa de Judas, ou em favor de uma leitura puramente humana que enfraqueça o cumprimento das Escrituras.
  rationale: O grego afirma ambas as realidades sem explicar sua relação. A tradução não deve reduzir nenhuma delas nem introduzir uma solução teológica externa ao versículo.
- issue: Força da declaração sobre não ter nascido
  choice: Traduzir a frase como uma declaração severa de juízo, sem definir além do texto suas implicações doutrinárias.
  alternative: Trat原á-la apenas como hipérbole retórica ou transformá-la em prova explícita de uma doutrina detalhada sobre o destino final de Judas.
  rationale: A declaração ressalta quão terrível é a condição daquele homem, mas o versículo não desenvolve uma doutrina sistemática específica a partir disso.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português. “Ai daquele homem” conserva o tom solene e judicial sem arcaísmo excessivo; “Melhor seria para ele” comunica de forma idiomática a condição contrafactual.
