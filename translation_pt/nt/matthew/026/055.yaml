  source_fidelity: A tradução reproduz adequadamente a estrutura e o contraste central do versículo. Contudo, “vieram” não expressa o componente de movimento para fora em ἐξήλθατε; “saíram” o preserva sem prejudicar a naturalidade. “Bandido” é um equivalente principal mais amplo para λῃστής do que “assaltante”, que pode sugerir mais especificamente um roubo por abordagem.
  naturalness: O texto é claro e de registro apropriado. “Vocês saíram com espadas e porretes” é natural em português contemporâneo e mantém mais de perto a imagem do original. “Dia após dia, eu ficava sentado ensinando” conserva bem o valor imperfeito e a ação concomitante.
  terminology: “Prender” para συλλαβεῖν e “agarrar” para κρατεῖν preservam uma distinção útil entre os dois verbos. “Bandido”, com alternativas em nota, mantém a amplitude de λῃστής sem impor a conotação política de “insurgente”.
