  - severity: low
    issue: “Assaltante” pode ser mais estreito que λῃστής.
    rationale: Em português atual, “assaltante” frequentemente evoca quem pratica assalto; λῃστής pode abranger bandido ou salteador violento. “Bandido” é mais abrangente, e a nota pode manter as demais possibilidades.
