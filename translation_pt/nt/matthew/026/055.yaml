source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ὥρᾳ εἶπεν ὁ Ἰησοῦς τοῖς ὄχλοις· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με; καθ’ ⸀ἡμέραν ⸂ἐν τῷ ἱερῷ ἐκαθεζόμην διδάσκων⸃ καὶ οὐκ ἐκρατήσατέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: pt
  text: 'Naquela hora, Jesus disse às multidões: “Vocês saíram com espadas e porretes para me prender, como se eu fosse um bandido?[a] Dia após dia, eu ficava sentado ensinando no templo, e vocês não me agarraram.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “assaltante”, “salteador” ou “insurgente”. O termo grego pode indicar mais que um ladrão comum, incluindo um criminoso violento ou, em alguns contextos, um rebelde.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Naquela hora
  rationale: Preserva a referência temporal imediata do grego em português natural e digno.
- source_word: τοῖς ὄχλοις
  choice: às multidões
  rationale: Mantém o plural de ὄχλοις; “multidões” é claro e corrente.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: como se eu fosse um assaltante
  rationale: Expressa naturalmente a comparação implícita no idioma grego. “Assaltante” comunica um criminoso violento sem restringir indevidamente o termo ao sentido político de insurgente.
- source_word: ἐξήλθατε
  choice: Vocês vieram
  rationale: Do ponto de vista de Jesus, “vieram” é natural; não é necessário explicitar “saíram”, que soaria menos idiomático em português neste contexto.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: com espadas e porretes
  rationale: “Espadas” é a equivalência convencional de μάχαιραι; “porretes” comunica que os objetos de madeira eram usados como armas.
- source_word: συλλαβεῖν με
  choice: para me prender
  rationale: No contexto da ação organizada contra Jesus, “prender” transmite claramente o sentido de detenção hostil.
- source_word: καθ’ ἡμέραν
  choice: Dia após dia
  rationale: Reproduz a força distributiva e a ênfase retórica da expressão grega.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: Forma natural em português para o complexo do templo; evita acrescentar “pátios” ao texto principal, embora ἱερόν possa abranger todo o recinto.
- source_word: ἐκαθεζόμην διδάσκων
  choice: eu ficava sentado ensinando
  rationale: “Ficava” comunica o aspecto habitual e contínuo do imperfeito, enquanto “ensinando” preserva a simultaneidade do particípio.
- source_word: οὐκ ἐκρατήσατέ με
  choice: vocês não me agarraram
  rationale: “Agarraram” conserva a ideia concreta de tomar ou dominar e distingue κρατέω do anterior συλλαμβάνω, traduzido por “prender”.
theological_decisions:
- issue: Amplitude semântica de λῃστής
  choice: assaltante
  alternative: bandido, salteador ou insurgente
  rationale: O termo pode designar um criminoso violento ou, em certos contextos, um rebelde. O texto enfatiza que Jesus estava sendo tratado como alguém perigoso; a nota preserva a amplitude sem impor uma interpretação política específica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega “vocês” por se dirigir a uma coletividade, mantém tom digno e conserva o contraste entre a abordagem armada e o ensino público de Jesus.
