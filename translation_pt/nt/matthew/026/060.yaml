  text: and they did not find any[a], though many false witnesses had come forward. But later two came forward
translation:
  language: pt
  text: e não encontraram nada[a], embora muitas testemunhas falsas tivessem se apresentado. Mais tarde, porém, apresentaram-se duas
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não encontraram nenhum testemunho»; o grego deixa o objeto implícito, referindo-se ao testemunho ou à acusação que procuravam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὗρον
  choice: não encontraram nenhuma prova válida
  rationale: O objeto de εὗρον está implícito e remete à busca de testemunho incriminador no versículo anterior. A expressão comunica naturalmente que nada aproveitável para a acusação foi encontrado, sem sugerir que nenhuma testemunha apareceu.
- source_word: πολλῶν προσελθόντων ψευδομαρτύρων
  choice: embora muitas testemunhas falsas tivessem se apresentado
  rationale: O genitivo absoluto tem sentido concessivo no contexto. O mais-que-perfeito composto situa a apresentação das testemunhas em relação à busca frustrada, e «testemunhas falsas» preserva o contexto judicial.
- source_word: ὕστερον δὲ
  choice: Mais tarde, porém
  rationale: «Mais tarde» marca a etapa posterior do processo, enquanto «porém» preserva a leve transição adversativa de δέ.
- source_word: προσελθόντες δύο
  choice: apresentaram-se duas
  rationale: No contexto de uma audiência, «apresentar-se» é mais idiomático do que o espacial «aproximar-se». O feminino concorda com o referente explícito «testemunhas» da oração anterior.
