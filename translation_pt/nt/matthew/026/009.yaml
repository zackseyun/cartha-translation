  text: For this could have been sold for a great deal and given to the poor[a].
translation:
  language: pt
  text: Pois isso poderia ter sido vendido por um preço alto e dado aos pobres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por muito» ou «por alto preço». O grego emprega um genitivo de preço. Embora o contexto possa sugerir o valor obtido na venda, o texto não menciona explicitamente «o dinheiro» no segundo verbo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: poderia ter sido
  rationale: O imperfeito de δύναμαι com os infinitivos expressa uma possibilidade passada não realizada; esta formulação é natural em português.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa da conjunção, ligando a afirmação à queixa anterior.
- source_word: τοῦτο
  choice: isso
  rationale: Preserva o demonstrativo neutro e sua referência ao que acaba de ser mencionado, sem explicitar no texto um substantivo ausente no grego.
- source_word: πραθῆναι
  choice: ter sido vendido
  rationale: O infinitivo aoristo passivo de πιπράσκω, subordinado a ἐδύνατο, indica a venda como possibilidade passada não concretizada.
- source_word: πολλοῦ
  choice: por um preço alto
  rationale: O genitivo de preço indica que o objeto poderia ter sido vendido por uma quantia elevada; a expressão é clara e corrente em português.
- source_word: καὶ δοθῆναι
  choice: e o dinheiro dado
  rationale: Embora o grego coordene literalmente 'ser vendido e ser dado', o referente implícito do segundo infinitivo é naturalmente o valor obtido com a venda. A explicitação evita sugerir que o próprio objeto seria dado aos pobres.
- source_word: πτωχοῖς
  choice: aos pobres
  rationale: O adjetivo substantivado no dativo plural designa coletivamente pessoas pobres; 'aos pobres' é conciso e idiomático.
theological_decisions: []
