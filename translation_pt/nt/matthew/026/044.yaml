  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἀπελθὼν⸃ προσηύξατο ἐκ τρίτου τὸν αὐτὸν λόγον εἰπὼν ⸀πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/044.yaml
  text: And leaving them again[a], he went away and prayed a third time, saying the same thing again.
translation:
  language: pt
  text: E, deixando-os novamente, afastou-se e orou pela terceira vez, dizendo de novo a mesma coisa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “as mesmas palavras”. Grego: “a mesma palavra/declaração”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: deixando-os
  rationale: O particípio aoristo de ἀφίημι indica que Jesus deixou os discípulos naquele lugar; a construção participial é natural e clara em português.
- source_word: πάλιν ἀπελθὼν
  choice: afastou-se novamente
  rationale: ἀπέρχομαι expressa o movimento para longe dos discípulos, e πάλιν marca que a ação se repetiu.
- source_word: προσηύξατο
  choice: orou
  rationale: Tradução direta e corrente do verbo deponente προσεύχομαι no contexto narrativo.
- source_word: ἐκ τρίτου
  choice: pela terceira vez
  rationale: Expressão idiomática que indica a terceira ocasião em que a oração foi feita.
- source_word: τὸν αὐτὸν λόγον
  choice: a mesma coisa
  rationale: λόγον está no singular e aqui se refere ao conteúdo repetido da oração; “a mesma coisa” é natural em português, enquanto “as mesmas palavras” explicita uma alternativa possível.
- source_word: εἰπὼν πάλιν
  choice: dizendo de novo
  rationale: Mantém o particípio de λέγω e representa o segundo πάλιν do texto grego, preservando a ênfase na repetição.
theological_decisions:
- issue: Repetição da oração de Jesus
  choice: Preservar tanto a terceira ocasião da oração quanto a repetição de seu conteúdo.
  alternative: Omitir “de novo” no fim como redundância estilística.
  rationale: O grego contém dois usos de πάλιν, além de ἐκ τρίτου; conservar esses elementos mantém a ênfase narrativa sem acrescentar uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição de “novamente” e “de novo” é intencional, pois corresponde às duas ocorrências de πάλιν no texto grego.
