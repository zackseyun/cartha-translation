  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς πάντας τοὺς λόγους τούτους, εἶπεν τοῖς μαθηταῖς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/001.yaml
  text: And when Jesus had finished all these words[a], he said to his disciples,
translation:
  language: pt
  text: 'Quando Jesus terminou de dizer todas essas palavras[a], disse aos seus discípulos:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: «E aconteceu que, quando Jesus terminou todas essas palavras, disse aos seus discípulos».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Quando
  rationale: A fórmula narrativa de sabor semítico introduz a oração temporal. Em português atual, «Quando» conserva com naturalidade a transição e a relação temporal, sem a rigidez de «E aconteceu que, quando».
- source_word: ἐτέλεσεν
  choice: terminou de dizer
  rationale: O verbo indica conclusão; com «palavras» como objeto, «terminou de dizer» expressa naturalmente em português que Jesus concluiu todo o discurso, sem alterar a sequência temporal.
- source_word: πάντας τοὺς λόγους τούτους
  choice: todas essas palavras
  rationale: Mantém o valor lexical de λόγους e a fórmula de encerramento de discurso característica de Mateus. «Todas essas coisas» seria menos preciso.
- source_word: εἶπεν
  choice: disse
  rationale: Equivalente narrativo direto de λέγω, sem acrescentar uma nuance ausente no grego.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: aos seus discípulos
  rationale: Preserva o possessivo explícito αὐτοῦ e emprega a tradução consagrada e clara de μαθηταί.
