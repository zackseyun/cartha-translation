  text: μετὰ δὲ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/032.yaml
  text: But after I am raised up[a], I will go ahead of you into Galilee.
translation:
  language: pt
  text: Mas, depois que eu for ressuscitado[a], irei adiante de vocês para a Galileia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois que eu ressuscitar”. O grego emprega mais literalmente uma forma passiva: “depois que eu for ressuscitado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: Mas, depois que
  rationale: A construção μετά com infinitivo articular indica sequência temporal, e δέ introduz aqui um contraste leve com a dispersão anunciada no versículo anterior.
- source_word: τὸ ἐγερθῆναί με
  choice: eu for ressuscitado
  rationale: Preserva a forma passiva do infinitivo aoristo de ἐγείρω e soa natural em português; a formulação pode sugerir a ação divina sem explicitá-la além do texto.
- source_word: προάξω ὑμᾶς
  choice: irei adiante de vocês
  rationale: Expressa o sentido contextual de ir antes dos discípulos, sem acrescentar necessariamente a ideia de liderança formal. 'Vocês' torna claro e natural o plural.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: para a Galileia
  rationale: Em português corrente, 'para a Galileia' comunica naturalmente o movimento em direção à região indicado por εἰς.
theological_decisions:
- issue: Forma passiva na referência à ressurreição
  choice: depois que eu for ressuscitado
  alternative: depois que eu ressuscitar
  rationale: A tradução conserva a voz passiva do grego, evitando apagar sua possível implicação de agência divina, mas sem identificar expressamente o agente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase mantém o contraste e a sequência temporal do grego, enquanto 'irei adiante de vocês' evita a rigidez de 'precederei vocês'.
