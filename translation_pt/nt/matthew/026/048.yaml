  text: ὁ δὲ παραδιδοὺς αὐτὸν ἔδωκεν αὐτοῖς σημεῖον λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/048.yaml
  text: The one betraying him had given them a sign[a], saying, “The one I kiss is he[b]; seize him.”
translation:
  language: pt
  text: 'Aquele que o traía[a] lhes havia dado um sinal[b], dizendo: “Aquele que eu beijar é ele; agarrem-no.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aquele que o entregava”.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma marca”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδιδοὺς
  choice: o traía
  rationale: No contexto da paixão, o verbo descreve a traição de Judas, e não uma entrega neutra. A construção “aquele que o traía” preserva o particípio presente substantivado e sua força moral contextual.
- source_word: σημεῖον
  choice: sinal
  rationale: O termo designa aqui um gesto de identificação previamente combinado. “Sinal” é natural em português e mantém a amplitude semântica do grego.
- source_word: Ὃν ἂν φιλήσω
  choice: Aquele que eu beijar
  rationale: A oração relativa indefinida com ἄν e o subjuntivo aoristo é expressa naturalmente pelo futuro do subjuntivo em português.
- source_word: φιλήσω
  choice: beijar
  rationale: O verbo indica diretamente o ato de beijar; explicitar “cumprimentar com um beijo” acrescentaria uma ideia deixada implícita no original.
- source_word: αὐτός ἐστιν
  choice: é ele
  rationale: A formulação breve conserva a identificação enfática e compacta do grego.
- source_word: κρατήσατε
  choice: agarrem-no
  rationale: O imperativo comunica tomar e manter alguém sob controle com firmeza. “Agarrem-no” preserva a dimensão física sem substituir o verbo por um termo jurídico mais específico como “prendam-no”.
theological_decisions:
- issue: Força moral de παραδιδοὺς em referência a Judas
  choice: “aquele que o traía”
  alternative: “aquele que o entregava”
  rationale: O contexto narrativo identifica a entrega de Jesus por Judas como traição. A tradução explicita essa força contextual sem acrescentar uma interpretação doutrinária externa.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. O mais-que-perfeito composto “havia dado” reproduz a anterioridade de ἔδωκεν em relação à cena narrada; “agarrem-no” mantém a força concreta do imperativo.
