  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: pt
  text: 'Em verdade lhes digo: onde quer que estas boas-novas sejam proclamadas em todo o mundo, também será contado o que esta mulher fez, em memória dela.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “este evangelho”; e também: “também se falará do que esta mulher fez, como memorial dela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Em verdade
  rationale: Introduz uma afirmação solene de Jesus; a expressão é clara, digna e tradicional em português, sem recorrer à transliteração “amém”.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Reproduz de modo natural a fórmula de discurso direto e mantém o endereço plural.
- source_word: ὅπου ἐὰν
  choice: onde quer que
  rationale: Expressa adequadamente o sentido locativo indefinido da construção grega.
- source_word: κηρυχθῇ
  choice: sejam proclamadas
  rationale: Preserva a ideia de anúncio público de κηρύσσω e concorda com “boas-novas” no plural gramatical em português.
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: estas boas-novas
  rationale: Comunica diretamente o sentido de εὐαγγέλιον em linguagem moderna e mantém o demonstrativo; “este evangelho” continua sendo uma alternativa tradicional válida.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: em todo o mundo
  rationale: Formulação portuguesa natural que preserva o alcance universal da expressão.
- source_word: λαληθήσεται
  choice: será contado
  rationale: Com o ato da mulher como conteúdo, “será contado” é idiomático e conserva o sentido futuro passivo de algo que será relatado.
- source_word: ὃ ἐποίησεν αὕτη
  choice: o que esta mulher fez
  rationale: O pronome relativo neutro aponta para o ato, e o demonstrativo feminino identifica a mulher mencionada no contexto.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: em memória dela
  rationale: Expressa de modo natural a finalidade ou resultado comemorativo da frase sem definir além do necessário a nuance de εἰς.
theological_decisions:
- issue: Tradução de εὐαγγέλιον
  choice: boas-novas
  alternative: evangelho
  rationale: “Boas-novas” torna explícito o sentido lexical grego em português acessível; “evangelho” é a forma tradicional e pode sugerir mais diretamente o uso cristão técnico, por isso é preservada em nota.
- issue: Relação de εἰς μνημόσυνον αὐτῆς com o relato do ato
  choice: em memória dela
  alternative: como memorial dela
  rationale: A tradução conserva a força comemorativa e a possível nuance de finalidade ou resultado, sem transformar a declaração em uma formulação doutrinária mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Em verdade lhes digo” mantém a solenidade da fórmula; “boas-novas” privilegia transparência lexical, e a nota registra as alternativas tradicionais e a ambiguidade possível da oração final.
