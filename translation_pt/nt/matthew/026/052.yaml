  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· Ἀπόστρεψον ⸂τὴν μάχαιράν σου⸃ εἰς τὸν τόπον αὐτῆς, πάντες γὰρ οἱ λαβόντες μάχαιραν ἐν μαχαίρῃ ⸀ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: pt
  text: 'Então Jesus lhe disse: “Devolva a sua espada ao seu lugar, pois todos os que tomam a espada[a] perecerão pela espada.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “recorrem à espada”; a expressão pode significar recorrer à força violenta, e não apenas pegar numa arma.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Introduz naturalmente o acontecimento seguinte na sequência narrativa.
- source_word: λέγει αὐτῷ
  choice: Jesus lhe disse
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, mais natural na narrativa portuguesa; o sujeito explícito preserva a clareza.
- source_word: Ἀπόστρεψον τὴν μάχαιράν σου εἰς τὸν τόπον αὐτῆς
  choice: Guarde a sua espada no lugar dela
  rationale: Expressa a ordem imediata de devolver a arma ao lugar onde ficava, provavelmente a bainha, sem inserir no texto um substantivo que o grego não traz.
- source_word: μάχαιρα
  choice: espada
  rationale: Embora possa designar uma faca, adaga ou espada curta, “espada” é a equivalência convencional e clara neste contexto.
- source_word: πάντες γὰρ οἱ λαβόντες μάχαιραν
  choice: pois todos os que tomam a espada
  rationale: A construção é geral e proverbial. A expressão pode indicar recorrer à violência armada, mas a formulação literal preserva sua abertura semântica.
- source_word: ἐν μαχαίρῃ ἀπολοῦνται
  choice: pela espada morrerão
  rationale: O dativo tem sentido instrumental. Neste contexto, ἀπόλλυμι indica morrer ou perecer; “morrerão” comunica isso com clareza e mantém o paralelismo proverbial.
theological_decisions:
- issue: Alcance da declaração de Jesus sobre a espada
  choice: 'Manter a formulação como princípio geral: “todos os que tomam a espada...”.'
  alternative: Entendê-la como proibição absoluta de todo uso da força ou como previsão restrita àquela situação imediata.
  rationale: A construção grega é gnômica e generalizante. A tradução preserva essa amplitude sem impor uma conclusão denominacional sobre toda forma de força.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Guarde” soa natural como ordem para recolocar a arma, enquanto “no lugar dela” evita acrescentar “bainha”, termo não expresso no grego. A colocação “pela espada morrerão” conserva o paralelismo solene e enfático do provérbio.
