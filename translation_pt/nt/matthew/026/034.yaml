source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι ἐν ταύτῃ τῇ νυκτὶ πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/034.yaml
  text: Jesus said to him, “Truly I tell you, in this very night, before a rooster crows, you will deny me three times.”
translation:
  language: pt
  text: 'Jesus lhe disse: “Em verdade lhe digo: nesta mesma noite,[a] antes que um galo cante,[b] você me negará três vezes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “esta noite”. Grego: “nesta noite”, com ênfase no demonstrativo “esta”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “antes que o galo cante”. O grego não exige aqui nem o artigo definido nem o indefinido em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jesus lhe disse
  rationale: Reproduz naturalmente a fórmula narrativa e mantém o destinatário pronominal sem tornar o verbo mais enfático do que o grego.
- source_word: Ἀμὴν λέγω σοι
  choice: Em verdade lhe digo
  rationale: Expressão solene e corrente em português bíblico, que preserva a força afirmativa de Ἀμὴν e o endereço pessoal no singular.
- source_word: ἐν ταύτῃ τῇ νυκτί
  choice: ainda esta noite
  rationale: Formulação natural em português que conserva a referência enfática à noite presente e, no contexto, o sentido de que isso ocorrerá antes que ela termine.
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: antes que um galo cante
  rationale: Converte naturalmente a construção infinitiva grega em oração temporal; o substantivo grego não tem artigo, de modo que o indefinido é uma opção direta, sem excluir a alternativa definida.
- source_word: τρὶς
  choice: três vezes
  rationale: Equivalente moderno, claro e exato do advérbio grego.
- source_word: ἀπαρνήσῃ με
  choice: você me negará
  rationale: Mantém o objeto pessoal explícito e traduz o futuro como uma declaração direta da negação que Pedro cometerá.
theological_decisions:
- issue: Fórmula introdutória de Jesus Ἀμὴν λέγω σοι
  choice: Em verdade lhe digo
  alternative: Amém, eu lhe digo; Eu lhe asseguro
  rationale: Preserva a solenidade e a autoridade da declaração sem deixar o hebraísmo sem tradução nem acrescentar uma nuance explicativa mais forte.
- issue: Sentido de ἀπαρνήσῃ με
  choice: você me negará
  alternative: você renegará de mim; você dirá que não me conhece
  rationale: “Negará” conserva a formulação concisa e a amplitude do verbo grego, sem explicitar antecipadamente a forma concreta que a negação assumirá na narrativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “você” para tornar inequívoco o singular de σοι e ἀπαρνήσῃ; mantém a fórmula solene “Em verdade lhe digo”. Os marcadores [a] e [b] aparecem no texto principal.
