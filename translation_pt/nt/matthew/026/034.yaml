  source_fidelity: A tradução transmite corretamente a declaração solene, a referência temporal à noite em curso, o canto de um galo e a tripla negação. Contudo, “ainda esta noite” acrescenta de modo mais explícito a noção de que o evento ocorrerá antes do fim da noite; embora seja compatível com o contexto, esse elemento não é expresso por ἐν ταύτῃ τῇ νυκτί. “Nesta mesma noite” preserva de modo mais direto a construção e a ênfase demonstrativa.
  naturalness: “Nesta mesma noite” é natural, claro e digno em português moderno. A combinação de “lhe” na fórmula solene com “você” na previsão é amplamente inteligível no registro bíblico brasileiro e não impede a leitura internacional.
  terminology: “Em verdade lhe digo” preserva adequadamente o peso de Ἀμήν λέγω σοι; “me negará” é a opção concisa e estabelecida para ἀπαρνήσῃ με. “Um galo” é uma possibilidade legítima para o substantivo grego sem artigo.
