id: MAT.26.59
reference: Matthew 26:59
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς ⸀καὶ τὸ συνέδριον ὅλον ἐζήτουν ψευδομαρτυρίαν κατὰ τοῦ Ἰησοῦ ὅπως ⸂αὐτὸν θανατώσωσιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/059.yaml
  text: The chief priests and the whole council were seeking false testimony against Jesus so that they might put him to death[b][a],
translation:
  language: pt
  text: Os principais sacerdotes e todo o conselho[a] procuravam falso testemunho[b] contra Jesus, a fim de matá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo o Sinédrio”. O termo grego designa o conselho governante judaico.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “uma testemunha falsa”. Neste contexto judicial, o termo grego pode ser entendido como o falso depoimento ou como a falsa testemunha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: não expresso por um conectivo independente
  rationale: Aqui, δέ funciona como uma transição narrativa suave. O português não exige um conectivo, e opções como “mas” ou “porém” acentuariam demais o contraste.
- source_word: ἀρχιερεῖς
  choice: principais sacerdotes
  rationale: Expressão tradicional e clara para a liderança sacerdotal, sem sugerir que todos ocupavam simultaneamente o cargo singular de sumo sacerdote.
- source_word: συνέδριον ὅλον
  choice: todo o conselho
  rationale: Traduz o nome da instituição e preserva a ênfase de ὅλον no corpo inteiro; uma nota identifica o conselho como o Sinédrio.
- source_word: ἐζήτουν
  choice: procuravam
  rationale: O imperfeito indica uma busca em andamento; “procuravam” comunica naturalmente esse aspecto progressivo.
- source_word: ψευδομαρτυρίαν
  choice: falso testemunho
  rationale: Mantém o sentido judicial de depoimento ou testemunho falso, sem especificar além do termo grego se o foco recai no conteúdo ou na testemunha.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: contra Jesus
  rationale: Expressa de modo idiomático a oposição judicial indicada por κατά com o genitivo.
- source_word: ὅπως
  choice: a fim de
  rationale: Introduz claramente a finalidade da busca, preservando a força da oração de propósito.
- source_word: αὐτὸν θανατώσωσιν
  choice: matá-lo
  rationale: Traduz diretamente a ação de causar a morte de Jesus. O contexto já fornece o caráter judicial, sem necessidade de acrescentar “executar” ou “condenar”.
theological_decisions:
- issue: Intenção judicial dos líderes
  choice: A busca contínua por falso testemunho é apresentada como tendo a finalidade explícita de matar Jesus.
  alternative: “para poderem condená-lo à morte”
  rationale: A alternativa explicita uma etapa judicial plausível, mas “condenar” não aparece no grego. A tradução conserva tanto a ação deliberada quanto a finalidade mortal sem acrescentar esse procedimento.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “A fim de” mantém o tom solene da cena judicial sem soar arcaico; “matá-lo” evita acrescentar ao grego uma condenação ou execução formal.
