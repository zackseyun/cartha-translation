id: MAT.26.61
reference: Matthew 26:61
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπαν· Οὗτος ἔφη· Δύναμαι καταλῦσαι τὸν ναὸν τοῦ θεοῦ καὶ διὰ τριῶν ἡμερῶν ⸀οἰκοδομῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/061.yaml
  text: They said[a], “This man said[b], ‘I am able to destroy the temple of God and to build it in three days.’”
translation:
  language: pt
  text: 'Eles disseram: “Este homem disse: ‘Posso destruir o templo de Deus e construí-lo em três dias[a].’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dentro de três dias”. A expressão grega pode indicar a conclusão da ação durante esse período.'
    reason: lexical_alternative
  - marker: b
    text: João 2:19–21 identifica a declaração de Jesus a respeito do templo como uma referência ao corpo dele.
    reason: cross_reference
lexical_decisions:
- source_word: εἶπαν
  choice: Eles disseram
  rationale: O aoristo apresenta a acusação das testemunhas como um acontecimento passado simples; esta é a forma narrativa natural em português.
- source_word: Οὗτος
  choice: Este homem
  rationale: Preserva a força dêitica e potencialmente depreciativa da expressão no contexto acusatório, sem a rigidez de “este” usado sozinho.
- source_word: ἔφη
  choice: disse
  rationale: Relata de modo neutro a fala atribuída a Jesus, sem acrescentar a ideia mais forte de que ele teria alegado ou declarado algo solenemente.
- source_word: Δύναμαι
  choice: Posso
  rationale: Expressa naturalmente em português a capacidade indicada pelo verbo grego, sem perder o sentido de “sou capaz”.
- source_word: καταλῦσαι
  choice: destruir
  rationale: No contexto de um edifício, o infinitivo pode significar destruir ou derrubar; “destruir” reproduz com clareza a formulação hostil da acusação.
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: o templo de Deus
  rationale: “Templo” é a forma clara e corrente de designar o ναός neste contexto, e “de Deus” conserva a construção genitiva.
- source_word: διὰ τριῶν ἡμερῶν
  choice: em três dias
  rationale: A expressão com διά e genitivo indica um período de tempo; “em três dias” é natural e mantém alguma abertura entre duração e conclusão dentro desse prazo.
- source_word: οἰκοδομῆσαι
  choice: construí-lo
  rationale: Mantém o sentido básico de “construir” e explicita em português o objeto retomado, sem introduzir no verbo o elemento interpretativo de “reconstruir”.
theological_decisions:
- issue: Referência de “o templo de Deus” na acusação
  choice: Traduzir a acusação em seu sentido direto, como referência ao templo, deixando a interpretação cristológica para a nota.
  alternative: Fazer a tradução aludir explicitamente ao corpo de Jesus e à ressurreição.
  rationale: Mateus registra aqui o depoimento acusatório das testemunhas. A tradução deve reproduzir o que elas afirmaram, sem harmonizar silenciosamente o texto com a explicação de João 2:21.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Posso” foi preferido a “sou capaz de” por naturalidade, e “construí-lo” preserva mais de perto o verbo grego do que “reconstruí-lo”.
