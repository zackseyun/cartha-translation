source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Ἑταῖρε, ἐφ’ ⸀ὃ πάρει. τότε προσελθόντες ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν καὶ ἐκράτησαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/050.yaml
  text: But Jesus said to him[a], “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized him.
translation:
  language: pt
  text: 'Mas Jesus lhe disse: “Amigo, faça o que você veio fazer.”[a] Então eles se aproximaram, agarraram Jesus e o prenderam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Amigo, para que você veio?” A expressão grega é concisa e pode ser entendida como uma pergunta.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Amigo
  rationale: Forma vocativa natural em português para a maneira contida como Jesus se dirige a Judas; não implica necessariamente amizade íntima.
- source_word: ἐφ’ ὃ πάρει
  choice: faça o que você veio fazer
  rationale: Expressa naturalmente a compreensão elíptica da frase como uma permissão ou confrontação do propósito de Judas, sem ocultar em nota a possível leitura interrogativa.
- source_word: προσελθόντες
  choice: se aproximaram
  rationale: Indica o movimento do grupo em direção a Jesus e mantém com clareza a sequência narrativa.
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: agarraram Jesus
  rationale: Comunica em português atual a ação física e hostil de pôr as mãos sobre Jesus, evitando a possível ambiguidade moderna de uma tradução excessivamente literal.
- source_word: ἐκράτησαν αὐτόν
  choice: o prenderam
  rationale: No contexto da captura, transmite que o mantiveram sob domínio; a ação física inicial já é expressa por “agarraram”.
- source_word: δὲ
  choice: Mas
  rationale: Marca a leve contraposição ou transição entre a ação de Judas e a resposta de Jesus.
theological_decisions:
- issue: Interpretação da resposta de Jesus a Judas
  choice: “Amigo, faça o que você veio fazer.”
  alternative: “Amigo, para que você veio?”
  rationale: A leitura principal preserva a força elíptica de permissão ou confrontação reconhecida no contexto, enquanto a nota mantém a leitura interrogativa genuinamente possível. “Amigo” conserva o tom contido sem torná-lo artificialmente afetuoso ou condenatório.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” soa natural no discurso direto, e a formulação evita tanto arcaísmos quanto explicações interpretativas no corpo do versículo.
