  source_fidelity: 'O texto traduz com fidelidade os principais elementos do grego: a ação em curso de Jesus (ἔτι αὐτοῦ λαλοῦντος), o marcador narrativo ἰδού, Judas como um dos doze, a grande multidão, as espadas e os ξύλα entendidos contextualmente como porretes, e a procedência indicada por ἀπό. “Da parte dos” conserva adequadamente a abertura de ἀπό sem explicitar indevidamente um ato de envio.'
  naturalness: A redação é clara, fluente e apropriada ao português moderno de ampla compreensão. “Eis que”, “uma grande multidão” e “anciãos do povo” mantêm registro bíblico digno sem artificialidade. A construção “e com ele veio uma grande multidão” é natural e deixa claro que a multidão acompanhava Judas.
  terminology: “Principais sacerdotes” é uma boa equivalência estabelecida para ἀρχιερεῖς e evita a imprecisão de tratar todos como sumos sacerdotes. “Porretes” é adequado no contexto de armas, e a nota oferece a alternativa mais literal “paus”. Os marcadores das notas no texto português correspondem corretamente aos respectivos assuntos.
