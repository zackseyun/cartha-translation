id: MAT.26.47
reference: Matthew 26:47
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἔτι αὐτοῦ λαλοῦντος ἰδοὺ Ἰούδας εἷς τῶν δώδεκα ἦλθεν καὶ μετ’ αὐτοῦ ὄχλος πολὺς μετὰ μαχαιρῶν καὶ ξύλων ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: pt
  text: Enquanto ele ainda falava, eis que chegou Judas, um dos doze, e com ele veio uma grande multidão armada de espadas e porretes[a], da parte dos principais sacerdotes e dos anciãos do povo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “paus”. O termo grego significa literalmente pedaços de madeira, aqui provavelmente usados como porretes.
    reason: lexical_alternative
  - marker: b
    text: Ou “enviada pelos principais sacerdotes e pelos anciãos do povo”. O grego diz mais literalmente “da parte dos principais sacerdotes e dos anciãos do povo”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Enquanto ele ainda falava
  rationale: O genitivo absoluto indica uma ação simultânea; “enquanto” expressa naturalmente a relação temporal, e “ainda” preserva ἔτι.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Mantém o marcador discursivo de vivacidade e imediatismo sem acrescentar a ideia mais específica de algo súbito.
- source_word: Ἰούδας
  choice: Judas
  rationale: Forma tradicional e corrente do nome em português.
- source_word: εἷς τῶν δώδεκα
  choice: um dos doze
  rationale: Reproduz diretamente a expressão partitiva, sem transformá-la desnecessariamente em título formal.
- source_word: ἦλθεν
  choice: chegou
  rationale: Equivalente narrativo natural de ἔρχομαι neste contexto, em que Judas alcança o local onde Jesus estava.
- source_word: ὄχλος πολὺς
  choice: uma grande multidão
  rationale: Preserva a ideia quantitativa de πολύς sem introduzir em “multidão” a hostilidade mais explícita de termos como “turba”.
- source_word: μετὰ μαχαιρῶν
  choice: armada de espadas
  rationale: μάχαιρα designa uma espada ou arma de lâmina semelhante; “espadas” é suficientemente amplo. “Armada de” torna clara e natural em português a função instrumental de μετὰ neste contexto.
- source_word: καὶ ξύλων
  choice: e porretes
  rationale: Embora ξύλον signifique literalmente madeira ou pedaço de madeira, o plural neste contexto designa objetos usados como armas; “porretes” comunica essa função, com a alternativa literal registrada em nota.
- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: da parte dos principais sacerdotes e dos anciãos do povo
  rationale: “Da parte de” preserva a noção de origem ou representação expressa por ἀπό sem inserir explicitamente um verbo como “enviar”. “Principais sacerdotes” evita sugerir que todos fossem sumos sacerdotes em exercício.
theological_decisions:
- issue: Se a tradução deve declarar que a multidão foi oficialmente enviada pelos líderes
  choice: da parte dos principais sacerdotes e dos anciãos do povo
  alternative: enviada pelos principais sacerdotes e pelos anciãos do povo
  rationale: O contexto sugere autorização ou comissão, mas o grego emprega apenas ἀπό, que marca origem ou procedência, sem verbo explícito de envio. A redação principal mantém essa abertura sem negar a implicação contextual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. “Eis que” conserva a vivacidade narrativa do original; “principais sacerdotes” e “anciãos do povo” mantêm terminologia bíblica reconhecível sem impor uma interpretação denominacional.
