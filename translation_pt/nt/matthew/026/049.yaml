  text: And immediately he came up to Jesus and said[a], “Greetings[b], Rabbi,” and kissed him.
translation:
  language: pt
  text: 'E imediatamente se aproximou de Jesus e disse: “Saudações[a], Rabi!”, e o beijou[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Salve, Rabi!”. Literalmente, a expressão também pode significar “Alegre-se”.'
    reason: lexical_alternative
  - marker: b
    text: 'O verbo grego pode indicar um beijo enfático ou repetido: “beijou-o efusivamente” ou “beijou-o repetidas vezes”.'
