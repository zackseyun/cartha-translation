lexical_decisions:
- source_word: εὐθέως
  choice: imediatamente
  rationale: Expressa prontidão e mantém a urgência narrativa em português moderno.
- source_word: προσελθὼν τῷ Ἰησοῦ
  choice: aproximando-se de Jesus
  rationale: Reproduz de modo natural o movimento de Judas em direção a Jesus e a relação temporal do particípio com o verbo principal.
- source_word: Χαῖρε
  choice: Salve
  rationale: Funciona como saudação direta, com tom digno, sem transformar a expressão em uma ordem literal para que Jesus se alegre.
- source_word: ῥαββί
  choice: Rabi
  rationale: Preserva o título semítico transliterado pelo texto grego, reconhecível em português.
- source_word: κατεφίλησεν αὐτόν
  choice: o beijou
  rationale: Mantém a formulação concisa do relato; a possível força intensiva ou iterativa do verbo é registrada em nota, sem ser imposta ao texto principal.
theological_decisions:
- issue: Sentido da saudação Χαῖρε
  choice: Salve
  alternative: Saudações; Alegre-se
  rationale: No contexto, trata-se de uma saudação convencional, não de uma aclamação teológica. A tradução permite que a ironia da traição surja da própria narrativa.
- issue: Força do verbo κατεφίλησεν
  choice: o beijou
  alternative: beijou-o efusivamente; beijou-o repetidas vezes
  rationale: O verbo composto pode indicar intensidade ou repetição, mas esse aspecto não é inequívoco. A tradução principal preserva a ambiguidade, e a nota informa as possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. “Rabi” preserva o título do original; “Salve” mantém uma saudação formal reconhecível. As notas retêm nuances lexicais genuínas sem sobrecarregar o texto principal.
