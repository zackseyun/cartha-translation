  text: Τοῦ δὲ Ἰησοῦ γενομένου ἐν Βηθανίᾳ ἐν οἰκίᾳ Σίμωνος τοῦ λεπροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/006.yaml
  text: While Jesus was in Bethany[a], in the house of Simon the leper[b],
translation:
  language: pt
  text: Enquanto Jesus estava em Betânia[a], na casa de Simão, o leproso[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Quando Jesus estava em Betânia”. O grego emprega uma construção que estabelece temporalmente a cena.
    reason: lexical_alternative
  - marker: b
    text: “Leproso” reproduz o termo grego usado como epíteto de Simão; por si só, ele não informa se Simão ainda tinha essa condição ou se a tivera anteriormente. O termo antigo também não corresponde necessariamente ao diagnóstico moderno da hanseníase.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: Enquanto Jesus estava
  rationale: A construção de genitivo absoluto estabelece a circunstância temporal. “Enquanto Jesus estava” é natural em português e preserva a relação circunstancial sem traduzir γίνομαι de modo excessivamente literal.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui δέ funciona como conectivo narrativo leve. O fluxo da oração temporal em português já marca a transição, e acrescentar “ora” ou “então” daria destaque desnecessário.
- source_word: ἐν Βηθανίᾳ
  choice: em Betânia
  rationale: Tradução locativa direta de ἐν com o nome do lugar.
- source_word: ἐν οἰκίᾳ
  choice: na casa
  rationale: οἰκία designa aqui o local físico. “Na casa” é a formulação mais clara e idiomática em português.
- source_word: Σίμωνος
  choice: de Simão
  rationale: O genitivo identifica o dono ou residente associado à casa.
- source_word: τοῦ λεπροῦ
  choice: o leproso
  rationale: Mantém o epíteto identificador empregado pelo texto grego. A expressão não determina se Simão ainda sofria da doença nem permite um diagnóstico médico moderno preciso; essa cautela é explicitada em nota.
theological_decisions:
- issue: Possível inferência sobre a condição de Simão a partir do epíteto “o leproso”
  choice: Conservar “Simão, o leproso” sem afirmar se a condição era presente ou passada.
  alternative: “Simão, que tinha sido leproso” ou “Simão, um homem com doença de pele”
  rationale: O grego apresenta apenas um epíteto identificador. Não se deve acrescentar uma cura anterior nem impor precisão diagnóstica moderna que o texto não oferece.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A vírgula final foi mantida porque o versículo é sintaticamente completado pelo seguinte.
