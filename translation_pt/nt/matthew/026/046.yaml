  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ἤγγικεν ὁ παραδιδούς με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/046.yaml
  text: Get up[a], let us go. Look, the one betraying me has come near.
translation:
  language: pt
  text: Levantem-se, vamos. Vejam, aquele que está me traindo[a] se aproximou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “aquele que me está entregando” ou “aquele que me entrega”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Levantem-se
  rationale: Imperativo presente na segunda pessoa do plural. No contexto, Jesus manda os discípulos se levantarem do sono ou repouso; esta forma é natural e clara em português.
- source_word: ἄγωμεν
  choice: vamos
  rationale: Subjuntivo presente na primeira pessoa do plural, com valor exortativo. “Vamos” expressa de modo idiomático o convite à ação conjunta.
- source_word: ἰδού
  choice: Vejam
  rationale: Partícula que chama vividamente a atenção para o que segue. O plural concorda com os discípulos interpelados e mantém um registro moderno.
- source_word: ἤγγικεν
  choice: se aproximou
  rationale: Perfeito ativo de ἐγγίζω, indicando uma aproximação já realizada e relevante no presente. “Se aproximou” evita afirmar mais do que o texto, como faria “chegou”.
- source_word: ὁ παραδιδούς
  choice: aquele que está me traindo
  rationale: Particípio presente substantivado. A forma verbal mantém a ação em foco; “traindo” comunica a deslealdade relacional no contexto da paixão, enquanto a alternativa mais literal é preservada em nota.
- source_word: με
  choice: me
  rationale: Pronome objeto que se refere a Jesus, traduzido diretamente.
theological_decisions:
- issue: Sentido de παραδιδούς no contexto da paixão
  choice: aquele que está me traindo
  alternative: aquele que está me entregando
  rationale: O verbo pode significar literalmente “entregar” ou “passar às mãos de alguém”, mas, em relação à ação de Judas, também carrega a força moral de traição. O texto principal comunica essa força contextual, e a nota preserva a formulação mais literal.
translation_notes:
  register: Português moderno, digno e acessível, com formas plurais naturais para a fala dirigida aos discípulos. A tradução preserva o aspecto verbal e evita o tom arcaico de alternativas como “Eis” ou “Erguei-vos”.
