  text: πῶς οὖν πληρωθῶσιν αἱ γραφαὶ ὅτι οὕτως δεῖ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/054.yaml
  text: How then would the Scriptures be fulfilled[a], that it must happen this way?
translation:
  language: pt
  text: Como, então, se cumpririam as Escrituras, que dizem que é necessário que aconteça assim?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶς οὖν
  choice: Como, então
  rationale: Preserva a pergunta retórica e a ligação lógica com a fala anterior em português natural.
- source_word: πληρωθῶσιν
  choice: se cumpririam
  rationale: 'O futuro do pretérito transmite a possibilidade implícita na pergunta retórica: se houvesse resistência, como poderia ocorrer o cumprimento?'
- source_word: αἱ γραφαὶ
  choice: as Escrituras
  rationale: Designa os escritos sagrados de Israel; a inicial maiúscula deixa claro esse referente reconhecido.
- source_word: ὅτι
  choice: que dizem que
  rationale: Explicita de modo natural em português que a oração seguinte apresenta o conteúdo atribuído às Escrituras, sem mudar sua função.
- source_word: οὕτως
  choice: assim
  rationale: Retoma de maneira concisa o modo como os acontecimentos estão se desenrolando.
- source_word: δεῖ γενέσθαι
  choice: é necessário que aconteça
  rationale: Mantém a força da necessidade expressa por δεῖ e verte γίνομαι em linguagem atual, sem acrescentar a origem dessa necessidade.
theological_decisions:
- issue: Natureza da necessidade expressa por δεῖ
  choice: é necessário que aconteça
  alternative: tem de acontecer segundo o plano de Deus
  rationale: A relação com o cumprimento das Escrituras sugere necessidade divina, mas o grego não explicita aqui “plano de Deus”; a tradução preserva essa tensão sem ampliá-la doutrinariamente.
- issue: Relação de ὅτι com “as Escrituras”
  choice: que dizem que
  alternative: porque é necessário que aconteça assim
  rationale: A leitura como oração de conteúdo é adequada ao contexto. A inserção idiomática de “dizem” torna a relação inteligível em português sem especificar quais textos bíblicos estão em vista.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação conserva o caráter retórico da pergunta; “assim” evita o tom arcaico de “deste modo” ou “assim suceder”.
