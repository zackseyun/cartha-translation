  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ ἠγανάκτησαν λέγοντες· Εἰς τί ἡ ἀπώλεια αὕτη;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/008.yaml
  text: But when the disciples saw it[a], they were indignant, saying, “Why this waste?”
translation:
  language: pt
  text: 'Mas, ao verem aquilo, os discípulos ficaram indignados e disseram: “Para que este desperdício?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: ao verem aquilo
  rationale: O particípio aoristo é expresso naturalmente com valor temporal. “Aquilo” explicita em português o objeto implícito no grego, retomando o ato de ungir.
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição com leve contraste entre o ato da mulher e a reação negativa dos discípulos.
- source_word: οἱ μαθηταὶ
  choice: os discípulos
  rationale: É a tradução corrente e direta; não se acrescenta “dele”, pois o possessivo não está expresso no grego.
- source_word: ἠγανάκτησαν
  choice: ficaram indignados
  rationale: Preserva a ideia de forte desagrado e reprovação contida em ἀγανακτέω.
- source_word: λέγοντες
  choice: e disseram
  rationale: A coordenação é mais natural no português narrativo e transmite adequadamente a ação simultânea introduzida pelo particípio.
- source_word: Εἰς τί
  choice: Para que
  rationale: Mantém de perto a pergunta sobre finalidade ou propósito, sem reduzi-la apenas a um “por quê” causal.
- source_word: ἡ ἀπώλεια αὕτη
  choice: este desperdício
  rationale: No contexto do perfume derramado, ἀπώλεια designa algo considerado perdido ou esbanjado; “desperdício” é claro e idiomático.
theological_decisions: []
