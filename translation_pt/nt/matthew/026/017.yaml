  naturalness: «No primeiro dia dos Pães sem Fermento» e «aproximaram-se de Jesus» são naturais em registro bíblico contemporâneo. «Onde você quer que preparemos a Páscoa para você comer?» é mais fluente e claro para leitores brasileiros e internacionais do que a redação atual.
  terminology: «Pães sem Fermento», «discípulos», «Jesus» e «Páscoa» são termos adequados. A nota lexical sobre «a refeição da Páscoa» continua sendo útil, pois «Páscoa» pode designar, no contexto, a refeição pascal.
