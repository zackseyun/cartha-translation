reference: Matthew 26:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τῇ δὲ πρώτῃ τῶν ἀζύμων προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ ⸀λέγοντες· Ποῦ θέλεις ⸀ἑτοιμάσωμέν σοι φαγεῖν τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/017.yaml
  text: On the first day of Unleavened Bread[a], the disciples came to Jesus, saying[b], “Where do you want us to prepare for you to eat the Passover?”
translation:
  language: pt
  text: 'No primeiro dia dos Pães sem Fermento[a], os discípulos aproximaram-se de Jesus, dizendo: “Onde você quer que preparemos a Páscoa para você comer[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão reproduz diretamente a formulação grega. Questões sobre a cronologia da Páscoa não devem ser resolvidas apenas pela tradução.
    reason: cultural_note
  - marker: b
    text: Ou, mais explicitamente, “a refeição da Páscoa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ πρώτῃ
  choice: No primeiro dia
  rationale: A construção dativa é temporal. O δέ funciona como conectivo leve e não exige uma palavra separada em português neste contexto.
- source_word: τῶν ἀζύμων
  choice: dos Pães sem Fermento
  rationale: O adjetivo substantivado no plural designa o período festivo judaico. A formulação preserva a referência tradicional sem acrescentar explicitamente “festa”.
- source_word: προσῆλθον
  choice: aproximaram-se
  rationale: Expressa com precisão o movimento em direção a Jesus e soa natural em português escrito contemporâneo.
- source_word: οἱ μαθηταὶ
  choice: os discípulos
  rationale: Mantém o artigo e não acrescenta o possessivo “seus”, ausente do grego.
- source_word: λέγοντες
  choice: dizendo
  rationale: Preserva o particípio contemporâneo ao verbo principal sem especificar além do texto que eles estavam “perguntando”.
- source_word: Ποῦ θέλεις
  choice: Onde você quer
  rationale: θέλω expressa vontade ou desejo; “você quer” é direto, atual e amplamente compreensível, sobretudo no português brasileiro.
- source_word: ἑτοιμάσωμέν σοι
  choice: que preparemos para você
  rationale: O subjuntivo deliberativo é naturalmente representado por “que preparemos”, e σοι é mantido como “para você”.
- source_word: φαγεῖν τὸ πάσχα
  choice: comer a Páscoa
  rationale: Mantém a formulação compacta do grego. No contexto, “Páscoa” designa a refeição pascal, mas essa explicitação fica em nota para não reduzir a amplitude lexical no texto principal.
theological_decisions:
- issue: A expressão cronológica “o primeiro dia dos Pães sem Fermento” em relação ao momento da refeição pascal
  choice: Conservar literalmente a expressão festiva do grego.
  alternative: Interpretar como “o dia anterior à Festa dos Pães sem Fermento” ou substituir por “o primeiro dia da Páscoa”.
  rationale: O texto grego diz “no primeiro dia dos Pães sem Fermento”. A tradução não deve resolver por harmonização uma questão cronológica debatida.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Você” evita a flexão regional “queres” e torna explícito o sujeito; a repetição de “para você” preserva σοι e deixa claro que a preparação era para Jesus comer. As notas foram posicionadas junto às expressões que efetivamente explicam.
