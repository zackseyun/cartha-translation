revisions:
- from: Vocês sabem que, depois de dois dias, acontece a Páscoa, e o Filho do Homem é entregue para ser crucificado.[a]
  to: Vocês sabem que, daqui a dois dias, chega a Páscoa, e o Filho do Homem é entregue[a] para ser crucificado.
  rationale: A revisão substitui uma formulação portuguesa pouco idiomática por «daqui a dois dias, chega a Páscoa», que mantém a referência ao prazo de dois dias e o sentido de ocorrência iminente. Também reposiciona a âncora para vinculá-la diretamente a «é entregue», o termo que a nota discute. Não há alteração doutrinária nem redução da amplitude semântica do passivo grego.
