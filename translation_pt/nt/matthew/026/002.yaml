    issue: Formulação pouco natural para γίνεται
    rationale: Em português contemporâneo, «acontece a Páscoa» soa incomum. «Chega a Páscoa» expressa com naturalidade a proximidade/ocorrência da festa no contexto.
  - severity: low
    issue: Âncora da nota distante do termo explicado
    rationale: A nota explica παραδίδοται («é entregue»); a âncora deve seguir esse termo, e não aparecer ao fim da oração após «crucificado».
  revised_text: Vocês sabem que, daqui a dois dias, chega a Páscoa, e o Filho do Homem é entregue[a] para ser crucificado.
