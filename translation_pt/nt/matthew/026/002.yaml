review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente os elementos centrais do grego: o plural de Οἴδατε, a referência temporal, «a Páscoa», o título «o Filho do Homem», o passivo amplo de παραδίδοται e a finalidade «para ser crucificado». «Acontece a Páscoa», porém, é pouco idiomático em português neste contexto; «chega a Páscoa» comunica naturalmente a ocorrência iminente expressa por γίνεται.'
  naturalness: «Vocês sabem» e «o Filho do Homem» são claros e apropriados ao registro. A reformulação temporal «daqui a dois dias chega a Páscoa» é mais natural para leitores brasileiros e internacionais do que «depois de dois dias, acontece a Páscoa», sem alterar o sentido temporal pretendido.
  terminology: «Páscoa», «Filho do Homem», «é entregue» e «crucificado» estão corretos e preservam tanto a terminologia bíblica estabelecida quanto a amplitude de παραδίδοται. A nota conserva corretamente «é traído» como alternativa mais restrita.
  issues:
