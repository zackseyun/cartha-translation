  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οἴδατε ὅτι μετὰ δύο ἡμέρας τὸ πάσχα γίνεται, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς τὸ σταυρωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/002.yaml
  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: pt
  text: Vocês sabem que, daqui a dois dias, chega a Páscoa, e o Filho do Homem é entregue[a] para ser crucificado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é traído”. O verbo grego pode indicar traição, mas, em sentido mais amplo, significa “é entregue”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδατε
  choice: Vocês sabem
  rationale: O perfeito οἴδατε tem sentido presente e está na segunda pessoa do plural. “Vocês sabem” é claro, corrente e amplamente compreensível em português.
- source_word: μετὰ δύο ἡμέρας
  choice: depois de dois dias
  rationale: Mantém de perto o valor temporal de μετά com acusativo. Embora “daqui a dois dias” seja mais idiomático em certos contextos, a formulação escolhida preserva a expressão grega sem perder clareza.
- source_word: τὸ πάσχα
  choice: a Páscoa
  rationale: Designa a Páscoa judaica; o artigo é expresso naturalmente em português, sem acrescentar “festa”, ausente do grego.
- source_word: γίνεται
  choice: acontece
  rationale: Neste contexto, γίνομαι indica a ocorrência da Páscoa. “Acontece” conserva o sentido verbal sem acrescentar explicitamente “festa” ou reduzir a expressão à mera aproximação temporal.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Forma bíblica estabelecida para a autodesignação de Jesus, preservando sua ressonância e possível alcance teológico.
- source_word: παραδίδοται
  choice: é entregue
  rationale: O presente passivo pode descrever como certa e iminente a ação futura. “É entregue” preserva o sentido amplo de παραδίδωμι, que pode envolver traição, mas não se limita a ela.
- source_word: εἰς τὸ σταυρωθῆναι
  choice: para ser crucificado
  rationale: A construção εἰς com infinitivo articular expressa finalidade ou resultado; esta tradução é direta e natural.
theological_decisions:
- issue: Sentido de παραδίδοται na predição da paixão
  choice: é entregue
  alternative: é traído
  rationale: O contexto inclui a traição de Judas, mas o verbo grego é mais amplo e também pode indicar ser entregue às autoridades ou entregue à morte. A escolha mantém essa amplitude e a tensão entre os agentes humanos e o desenrolar da paixão.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. O plural “vocês” explicita o número do verbo grego. A ordem da frase acompanha de perto o original, e o presente “é entregue” conserva o caráter vívido e iminente da predição.
