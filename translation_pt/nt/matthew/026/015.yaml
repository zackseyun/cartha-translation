  - severity: medium
    issue: «Lhe pesaram» é pouco natural no português moderno.
    rationale: Apesar de refletir a imagem concreta adotada na trilha inglesa, a expressão não é idiomática para uma transação monetária no português atual. «Lhe pagaram» transmite o sentido contextual de ἔστησαν αὐτῷ sem criar estranheza desnecessária.
  - severity: low
    issue: A nota lexical está ancorada no sintagma monetário, mas a principal alternativa lexical da trilha de auditoria — «trair» para παραδώσω — não foi registrada.
    rationale: Uma nota em «entregarei» preserva a amplitude do verbo grego e permite ao leitor reconhecer a alternativa contextual sem transformá-la na tradução principal.
