  text: εἶπεν· Τί θέλετέ μοι δοῦναι κἀγὼ ὑμῖν παραδώσω αὐτόν; οἱ δὲ ἔστησαν αὐτῷ τριάκοντα ἀργύρια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/015.yaml
  text: He said[a], “What are you willing to give me, and I will hand him over to you?” And they weighed out for him thirty pieces of silver.
translation:
  language: pt
  text: 'Ele disse: “O que vocês estão dispostos a me dar? E eu o entregarei a vocês.”[a] Então eles lhe pagaram trinta peças de prata.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eu o traírei a vocês”. O verbo grego pode significar “entregar”, “passar às mãos de alguém” ou, neste contexto, “trair”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: O que vocês estão dispostos a me dar
  rationale: Expressa a nuance volitiva de θέλω e soa natural no contexto de negociação, sem reduzir a pergunta a uma simples previsão do pagamento.
- source_word: κἀγὼ ὑμῖν παραδώσω αὐτόν
  choice: para que eu o entregue a vocês
  rationale: “Entregue” preserva a amplitude de παραδίδωμι, que pode significar entregar, pôr nas mãos de alguém ou, neste contexto, trair. A construção portuguesa explicita naturalmente a relação proposta por Judas sem alterar o sentido.
- source_word: οἱ δὲ
  choice: Então eles
  rationale: Neste fluxo narrativo, δέ introduz a resposta à proposta. “Então” comunica a sequência e a consequência imediata sem sugerir forte contraste.
- source_word: ἔστησαν αὐτῷ
  choice: lhe pesaram
  rationale: Mantém a imagem comercial concreta do pagamento em prata e corresponde a uma compreensão antiga e bem atestada do idiomatismo; evita o termo genérico “pagaram”.
- source_word: τριάκοντα ἀργύρια
  choice: trinta moedas de prata
  rationale: ἀργύρια designa peças de dinheiro de prata. “Moedas de prata” é claro em português moderno e não especifica uma denominação ausente do grego.
theological_decisions:
- issue: Sentido de παραδώσω na oferta de Judas
  choice: entregue
  alternative: traia
  rationale: “Entregue” conserva a amplitude lexical do verbo grego e permite que o caráter de traição resulte do contexto, em vez de ser inserido diretamente no verbo.
- issue: Relação sintática entre a oferta de pagamento e a entrega
  choice: para que eu o entregue a vocês
  alternative: e eu o entregarei a vocês
  rationale: O grego usa uma coordenação que, no contexto da negociação, exprime a contrapartida proposta. A formulação com “para que” é idiomática em português, embora a alternativa preserve mais diretamente a coordenação formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. “Entregue” evita impor no verbo a interpretação moral de “trair”, embora essa ideia esteja clara no contexto. A nota esclarece a forma literal e a indefinição da unidade monetária.
