  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ὁ ἐμβάψας μετ’ ἐμοῦ ⸂τὴν χεῖρα ἐν τῷ τρυβλίῳ⸃ οὗτός με παραδώσει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/023.yaml
  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: pt
  text: 'Ele respondeu: “Aquele que mergulhou a mão comigo na tigela[a] é quem me trairá[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no prato”.
    reason: lexical_alternative
  - marker: b
    text: Ou “me entregará”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ele respondeu
  rationale: A construção com particípio e verbo finito é uma expressão grega de influência semítica. Em português atual, “respondeu” comunica naturalmente o sentido sem reproduzir de modo rígido os dois verbos.
- source_word: ἐμβάψας
  choice: molhou
  rationale: O particípio aoristo apresenta a ação identificadora como realizada. “Molhou” expressa de modo claro o ato de introduzir a mão no recipiente, sem acrescentar um objeto ausente no grego.
- source_word: μετ’ ἐμοῦ
  choice: comigo
  rationale: Equivalente natural de μετά com genitivo, que aqui indica companhia ou participação simultânea.
- source_word: τὴν χεῖρα
  choice: a mão
  rationale: O artigo grego com parte do corpo pode ser traduzido naturalmente pelo artigo em português; o possuidor fica claro pelo sujeito de “molhou”.
- source_word: ἐν τῷ τρυβλίῳ
  choice: na tigela
  rationale: τρύβλιον designa um recipiente para comida, uma tigela ou prato fundo. “Tigela” é claro e contemporâneo; “prato” permanece como alternativa em nota.
- source_word: οὗτός
  choice: é quem
  rationale: A construção clivada em português preserva a ênfase identificadora do demonstrativo sem a rigidez de “este” ou “esse” neste contexto.
- source_word: παραδώσει
  choice: me trairá
  rationale: Embora o verbo possa significar literalmente “entregar”, no contexto da ação de Judas assume o sentido de entrega traiçoeira. “Trairá” comunica essa força contextual, e a alternativa lexical é registrada em nota.
theological_decisions:
- issue: Sentido de παραδίδωμι no contexto de Judas
  choice: me trairá
  alternative: me entregará
  rationale: O verbo tem o sentido amplo de entregar ou passar alguém às mãos de outro, mas o contexto relacional e narrativo caracteriza o ato como traição. A tradução principal expressa essa força sem introduzir uma doutrina adicional; a opção mais literal é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem da frase mantém a identificação enfática do traidor, e as notas preservam alternativas lexicais genuínas.
