  text: ὁ δὲ ἠρνήσατο ⸀ἔμπροσθεν πάντων λέγων· Οὐκ οἶδα τί λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: pt
  text: 'Mas ele negou diante de todos, dizendo: “Não sei o que você está dizendo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: negou
  rationale: O verbo descreve a negação de Pedro em resposta à acusação anterior. Em português, o objeto pode permanecer implícito naturalmente, como no grego, sem especificar além do texto o que ou quem ele negou.
- source_word: ἔμπροσθεν πάντων
  choice: diante de todos
  rationale: Expressa de modo natural tanto a presença do grupo quanto o caráter público da negação.
- source_word: λέγων
  choice: dizendo
  rationale: Preserva de maneira clara e natural a construção participial do grego.
- source_word: Οὐκ οἶδα
  choice: Não sei
  rationale: É a correspondência direta e idiomática da forma grega negada.
- source_word: τί λέγεις
  choice: do que você está falando
  rationale: No contexto, esta formulação portuguesa comunica naturalmente a alegação de Pedro de não compreender a acusação; o sentido literal é 'o que você está dizendo'.
theological_decisions:
- issue: Natureza da negação de Pedro
  choice: Pedro nega publicamente, deixando implícito o objeto da negação.
  alternative: Explicitar que Pedro negou Jesus ou negou a acusação.
  rationale: O grego emprega ἠρνήσατο sem objeto expresso. A tradução portuguesa mantém essa abertura sem acrescentar uma identificação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “você” representa o singular λέγεις e é natural no diálogo; “diante de todos” conserva o caráter público da cena.
