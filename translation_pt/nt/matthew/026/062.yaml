  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Οὐδὲν ἀποκρίνῃ; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: pt
  text: 'Então o sumo sacerdote se levantou e lhe disse: “Você não responde nada? O que estes homens estão testemunhando contra você?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: se levantou
  rationale: Expressa de modo natural a ação física do sumo sacerdote antes de falar, preservando a força dramática da cena.
- source_word: ὁ ἀρχιερεὺς
  choice: o sumo sacerdote
  rationale: É a designação portuguesa consagrada e precisa para o ocupante desse ofício judaico.
- source_word: εἶπεν αὐτῷ
  choice: lhe disse
  rationale: Mantém o pronome do grego sem substituir seu referente pelo nome de Jesus.
- source_word: Οὐδὲν ἀποκρίνῃ;
  choice: Você não responde nada?
  rationale: Formula a pergunta direta em português corrente, preservando tanto a negação enfática quanto o aspecto presente da interpelação.
- source_word: τί
  choice: O que
  rationale: Conserva a interrogação direta e a abertura semântica do pronome grego, sem especificar indevidamente o conteúdo do depoimento.
- source_word: οὗτοί
  choice: estes homens
  rationale: Explicita de forma natural o referente masculino plural presente na cena, isto é, as testemunhas ou acusadores.
- source_word: σου καταμαρτυροῦσιν
  choice: estão testemunhando contra você
  rationale: Preserva o sentido forense e adversativo do verbo com o genitivo, bem como o caráter atual da ação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A construção mantém as duas perguntas do texto grego e evita transformar o testemunho em mera acusação ou paráfrase do que foi dito.
