  text: προσῆλθεν αὐτῷ γυνὴ ⸂ἔχουσα ἀλάβαστρον μύρου⸃ βαρυτίμου καὶ κατέχεεν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ ἀνακειμένου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
translation:
  language: pt
  text: Uma mulher se aproximou dele trazendo um frasco de alabastro com perfume muito caro[a] e o derramou sobre a cabeça dele enquanto ele estava reclinado à mesa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um frasco de alabastro com unguento muito caro”. A palavra grega μύρον pode indicar óleo perfumado ou unguento, não apenas perfume líquido no sentido moderno.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, reclinado na postura costumeira para tomar uma refeição.
    reason: cultural_note
lexical_decisions:
- source_word: προσῆλθεν αὐτῷ
  choice: se aproximou dele
  rationale: Expressa de modo natural o movimento da mulher em direção a Jesus, preservando o sentido de προσέρχομαι e do dativo αὐτῷ.
- source_word: γυνή
  choice: uma mulher
  rationale: O substantivo é indefinido e o versículo não acrescenta nenhuma identificação.
- source_word: ἔχουσα
  choice: trazendo
  rationale: O particípio indica que ela veio em posse do recipiente; “trazendo” é natural no contexto e evita o rígido “tendo”.
- source_word: ἀλάβαστρον μύρου
  choice: um frasco de alabastro com perfume
  rationale: ἀλάβαστρον designa um recipiente de alabastro, e μύρον uma substância aromática que podia ser óleo perfumado ou unguento. “Frasco” e “perfume” comunicam o sentido principal em português atual, com a amplitude lexical registrada em nota.
- source_word: βαρυτίμου
  choice: muito caro
  rationale: Transmite a ideia intensiva de grande valor de modo claro e idiomático.
- source_word: κατέχεεν
  choice: derramou
  rationale: καταχέω indica derramar sobre algo; o complemento seguinte explicita o destino da substância.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: sobre a cabeça dele
  rationale: Representa diretamente a localização e o contato indicados por ἐπί com o genitivo.
- source_word: ἀνακειμένου
  choice: enquanto ele estava reclinado à mesa
  rationale: O particípio descreve a postura costumeira durante uma refeição. A menção da mesa torna a cena compreensível ao leitor moderno sem alterar seu sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Se aproximou” e “muito caro” evitam rigidez excessiva; “reclinado à mesa” preserva o cenário cultural. Os marcadores foram colocados junto aos termos que explicam.
