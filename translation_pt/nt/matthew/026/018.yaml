source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑπάγετε εἰς τὴν πόλιν πρὸς τὸν δεῖνα καὶ εἴπατε αὐτῷ· Ὁ διδάσκαλος λέγει· Ὁ καιρός μου ἐγγύς ἐστιν· πρὸς σὲ ποιῶ τὸ πάσχα μετὰ τῶν μαθητῶν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/018.yaml
  text: He said[a], “Go into the city to a certain man and tell him, ‘The Teacher says, “My time is near[c][b]. I am keeping the Passover with you with my disciples.”’”
translation:
  language: pt
  text: 'Ele disse: “Vão à cidade, dirijam-se a certo homem e digam-lhe: ‘O Mestre diz: “O meu tempo está próximo. Vou celebrar a Páscoa com você, junto com os meus discípulos.”’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Vão
  rationale: Imperativo plural de movimento; “Vão” é direto, natural e não acrescenta uma ênfase de afastamento ausente do contexto.
- source_word: πρὸς τὸν δεῖνα
  choice: procurem certo homem
  rationale: A expressão indica uma pessoa específica, mas deliberadamente não identificada. Em português, “procurem certo homem” comunica naturalmente que devem dirigir-se a essa pessoa sem introduzir um nome.
- source_word: Ὁ διδάσκαλος
  choice: O Mestre
  rationale: “Mestre” é a forma corrente e digna de designar Jesus como aquele que ensina; aqui funciona como título reconhecível sem confundi-lo com “Senhor”.
- source_word: Ὁ καιρός μου ἐγγύς ἐστιν
  choice: O meu tempo está próximo
  rationale: Mantém a amplitude de καιρός como momento significativo sem especificar se se trata estritamente da morte, da refeição pascal ou da culminação mais ampla da missão de Jesus.
- source_word: πρὸς σὲ
  choice: com você
  rationale: Preserva de perto a expressão grega, que não menciona explicitamente uma casa. No contexto, pode implicar “em sua casa”, mas a tradução mantém a formulação relacional e deixa a implicação ao leitor.
- source_word: ποιῶ τὸ πάσχα
  choice: Celebrarei a Páscoa
  rationale: ποιέω com πάσχα é uma expressão idiomática para celebrar ou observar a Páscoa. O presente grego pode expressar uma ação iminente e decidida; o futuro é natural em português nesta mensagem sobre o que Jesus está prestes a fazer.
- source_word: τὸ πάσχα
  choice: a Páscoa
  rationale: Designação portuguesa estabelecida para a festa judaica nesse contexto.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: junto com os meus discípulos
  rationale: “Discípulos” preserva a relação característica entre Jesus e seus seguidores; “junto com” evita a sequência pouco elegante de dois complementos introduzidos apenas por “com”.
theological_decisions:
- issue: Sentido do καιρός que se aproxima
  choice: O meu tempo está próximo
  alternative: O meu tempo determinado está próximo; A minha hora está próxima
  rationale: O versículo afirma a proximidade de um momento decisivo, mas não define sozinho todo o seu alcance. A tradução evita restringi-lo exclusivamente à morte de Jesus, à ceia pascal ou a outro aspecto específico.
- issue: Local ou relação expressa por πρὸς σέ
  choice: com você
  alternative: em sua casa; em sua casa, com você
  rationale: Embora o contexto de hospitalidade sugira a casa ou o espaço do destinatário, o grego diz literalmente “com você” ou “junto de você”. A escolha evita tornar explícito o que permanece implícito no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O discurso direto foi organizado com aspas aninhadas. “Certo homem” mantém a referência intencionalmente não especificada; “junto com” dá fluidez à frase sem alterar as relações expressas no grego.
