lexical_decisions:
- source_word: συνεβουλεύσαντο
  choice: conspiraram
  rationale: O verbo indica que deliberaram juntos e, neste contexto hostil, transmite naturalmente a ideia de uma trama conjunta.
- source_word: ἵνα
  choice: para
  rationale: Expressa a finalidade da conspiração de modo claro e natural em português, sem acrescentar certeza quanto ao êxito do plano.
- source_word: δόλῳ
  choice: à traição
  rationale: O dativo indica o meio ou modo marcado por dolo, ardil ou engano; “à traição” é idiomático e preserva o caráter clandestino e desleal da ação.
- source_word: κρατήσωσιν
  choice: prender
  rationale: No contexto, significa apoderar-se de Jesus ou detê-lo; “prender” comunica diretamente a ação pretendida.
- source_word: ἀποκτείνωσιν
  choice: matá-lo
  rationale: Equivalente direto e corrente do verbo grego, com o pronome retomando Jesus.
