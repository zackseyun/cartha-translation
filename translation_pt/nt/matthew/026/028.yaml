id: MAT.26.28
reference: Matthew 26:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν τὸ αἷμά ⸀μου ⸀τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/028.yaml
  text: For this is my blood of the covenant[b][a], which is poured out for many for the forgiveness of sins.
translation:
  language: pt
  text: Pois isto é o meu sangue da aliança[a], derramado em favor de muitos[b] para o perdão dos pecados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “o meu sangue da nova aliança”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “por muitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: isto
  rationale: Traduz diretamente o pronome demonstrativo neutro, que se refere ao que Jesus apresenta na refeição; não acrescenta “cálice”, ausente desta oração grega.
- source_word: γάρ
  choice: pois
  rationale: Preserva a função explicativa que liga a declaração à ordem anterior para beber, em português natural e digno.
- source_word: τὸ αἷμά μου
  choice: o meu sangue
  rationale: Tradução direta que mantém as ressonâncias sacrificiais e pactuais de αἷμα.
- source_word: τῆς διαθήκης
  choice: da aliança
  rationale: Segue o texto da SBLGNT, que não contém καινῆς (“nova”), sem importar a leitura de manuscritos alternativos ou de passagens paralelas.
- source_word: περὶ πολλῶν
  choice: em favor de muitos
  rationale: Neste contexto sacrificial, περί com o genitivo pode expressar benefício ou representação. A formulação é clara e preserva “muitos” sem o substituir por “todos”.
- source_word: ἐκχυννόμενον
  choice: derramado
  rationale: O particípio passivo modifica “sangue”. A forma reduzida é idiomática em português e conserva a imagem sacrificial de algo vertido.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: para o perdão dos pecados
  rationale: Expressa com clareza a orientação para finalidade ou resultado indicada por εἰς, usando terminologia corrente e acessível.
theological_decisions:
- issue: Inclusão de “nova” em “aliança”
  choice: da aliança
  alternative: da nova aliança
  rationale: O texto grego fornecido não traz καινῆς. A tradução segue a leitura-base e registra em nota a variante comum, sem harmonizar o versículo com tradições paralelas.
- issue: Sentido de περὶ πολλῶν na linguagem da expiação
  choice: em favor de muitos
  alternative: por muitos
  rationale: Mantém o substantivo quantitativo “muitos” e explicita o valor benefativo plausível de περί, sem resolver debates teológicos mais amplos sobre a extensão da expiação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom permanece digno e adequado à fala solene da narrativa, evitando tanto arcaísmos como paráfrases doutrinárias.
