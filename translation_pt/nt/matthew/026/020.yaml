lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Ao anoitecer
  rationale: O genitivo absoluto estabelece o momento da cena. “Ao anoitecer” é natural, conciso e preserva o sentido temporal.
- source_word: ἀνέκειτο
  choice: ele se reclinou à mesa
  rationale: O verbo descreve a postura reclinada usada durante uma refeição. “À mesa” explicita naturalmente em português o contexto implícito no verbo grego.
- source_word: μετὰ
  choice: com
  rationale: Com o genitivo, μετά expressa companhia; “com” é a equivalência direta e natural.
- source_word: τῶν δώδεκα μαθητῶν
  choice: os doze discípulos
  rationale: μαθητῶν consta no texto da SBLGNT e é traduzido por “discípulos”, termo consagrado e preciso no contexto dos Evangelhos.
