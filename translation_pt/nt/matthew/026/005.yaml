base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/005.yaml
  text: But they were saying[a], “Not during the feast[b], lest there be an uproar among the people.”
translation:
  language: pt
  text: 'Mas diziam: “Não durante a festa, para que não haja tumulto entre o povo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito retrata a fala em curso no contexto da deliberação; “diziam” preserva esse aspecto com naturalidade em português.
- source_word: δέ
  choice: Mas
  rationale: Marca um contraste leve com o plano mencionado no versículo anterior e introduz a cautela dos líderes.
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: Não durante a festa
  rationale: A expressão elíptica comunica a decisão de não agir naquele período; ἐν tem sentido temporal, e “festa” é natural no contexto da Páscoa.
- source_word: ἵνα μὴ
  choice: para que não
  rationale: Preserva a nuance de finalidade preventiva da construção grega em linguagem portuguesa corrente.
- source_word: θόρυβος
  choice: tumulto
  rationale: Designa agitação ou desordem pública; “tumulto” expressa a ameaça de distúrbio popular sem necessariamente implicar uma revolta de grande escala.
- source_word: γένηται
  choice: haja
  rationale: Com θόρυβος como sujeito conceitual, γίνομαι significa surgir ou ocorrer; “haja” produz uma construção idiomática em português.
- source_word: ἐν τῷ λαῷ
  choice: entre o povo
  rationale: Expressa de modo natural que o tumulto poderia surgir no meio da população reunida.
