lexical_decisions:
- source_word: ἀπὸ τότε
  choice: daquele momento em diante
  rationale: Expressa naturalmente o ponto inicial e a continuidade temporal indicados por ἀπό + τότε.
- source_word: ἐζήτει
  choice: procurava
  rationale: O imperfeito indica uma busca contínua ou repetida; “procurava” preserva esse aspecto com naturalidade.
- source_word: εὐκαιρίαν
  choice: uma oportunidade
  rationale: Comunica uma ocasião adequada ou favorável, cujo caráter favorável fica claro no contexto.
- source_word: ἵνα
  choice: para
  rationale: Introduz a finalidade da busca de Judas de modo conciso e natural em português.
- source_word: αὐτὸν παραδῷ
  choice: entregá-lo
  rationale: Preserva o sentido básico de παραδίδωμι, “entregar”, sem restringi-lo no texto principal ao sentido contextual de “trair”.
theological_decisions:
- issue: Tradução de παραδῷ no contexto da ação de Judas
  choice: entregá-lo
  alternative: traí-lo
  rationale: Embora a ação de Judas constitua traição, o verbo grego tem o sentido mais amplo de entregar alguém. O texto principal conserva esse sentido lexical, e a nota registra a alternativa contextual.
