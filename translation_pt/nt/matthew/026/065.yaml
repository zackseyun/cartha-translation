reference: Matthew 26:65
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: pt
  text: 'Então o sumo sacerdote rasgou as próprias vestes[a] e disse: “Ele blasfemou! Que necessidade ainda temos de testemunhas?[b] Vejam, agora vocês ouviram a blasfêmia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rasgar as vestes era um sinal público de choque, pesar ou indignação.
    reason: cultural_note
  - marker: b
    text: 'Ou: “Por que ainda precisamos de testemunhas?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Conector temporal natural que mantém a sequência narrativa.
- source_word: ὁ ἀρχιερεὺς
  choice: o sumo sacerdote
  rationale: Designação portuguesa convencional e precisa para o ocupante singular desse ofício.
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: rasgou as próprias vestes
  rationale: “Rasgou” expressa diretamente a ação; “vestes” preserva o registro público e solene de ἱμάτια, enquanto “próprias” esclarece a referência reflexiva sem especificar indevidamente vestes sacerdotais.
- source_word: λέγων
  choice: e disse
  rationale: Converte o particípio simultâneo em coordenação idiomática, sem alterar a relação entre gesto e fala.
- source_word: Ἐβλασφήμησεν
  choice: Ele blasfemou
  rationale: Mantém o termo jurídico-religioso e a força exclamativa da acusação no pretérito perfeito natural em português.
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: Que necessidade ainda temos de testemunhas?
  rationale: Reproduz de perto a construção com χρείαν e conserva explicitamente o valor de ἔτι.
- source_word: ἴδε
  choice: Vejam
  rationale: Interjeição imperativa atual que chama a atenção dos ouvintes; a forma plural harmoniza com o grupo indicado por ἠκούσατε.
- source_word: νῦν ἠκούσατε
  choice: agora vocês ouviram
  rationale: Mantém a ênfase temporal de νῦν e o destinatário plural explícito, sem acrescentar “acabaram de” ao texto.
- source_word: τὴν βλασφημίαν
  choice: a blasfêmia
  rationale: Conserva o artigo definido e o teor jurídico-teológico da caracterização feita pelo sumo sacerdote.
theological_decisions:
- issue: A acusação expressa por βλασφημέω / βλασφημία
  choice: “blasfemou” / “a blasfêmia” como fala do sumo sacerdote
  alternative: “falou de modo irreverente” / “declaração blasfema”
  rationale: Os termos tradicionais preservam a gravidade religiosa e jurídica da acusação. As aspas e a atribuição da fala deixam claro que se trata do juízo do sumo sacerdote, não de uma confirmação explícita do narrador.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação da pergunta conserva proximidade formal com o grego, enquanto a nota oferece uma alternativa mais idiomática. Os marcadores foram colocados junto ao conteúdo a que cada nota efetivamente se refere.
