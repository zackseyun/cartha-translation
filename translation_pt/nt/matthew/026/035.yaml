  source_fidelity: A tradução preserva adequadamente a condição concessiva (Κἂν), a necessidade (δέῃ), o acompanhamento na morte (σὺν σοὶ ἀποθανεῖν), a negação enfática futura (οὐ μή) e a adesão dos demais discípulos. Contudo, «também disseram isso» fica menos preciso e menos idiomático para ὁμοίως ... εἶπαν, que indica que eles fizeram a mesma declaração.
  naturalness: «Pedro lhe disse» e «Mesmo que eu tenha de morrer com você» são naturais e adequados ao registro. «Da mesma forma, todos os discípulos disseram o mesmo» é mais fluente e idiomático do que «Da mesma forma, todos os discípulos também disseram isso», sem perda de sentido.
  terminology: «Discípulos» e «negar» são termos estabelecidos e apropriados no contexto evangélico. «De modo nenhum» transmite com dignidade a força de οὐ μή. A nota lexical está corretamente ancorada na negação enfática.
