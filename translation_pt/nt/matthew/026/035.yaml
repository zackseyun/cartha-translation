base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: pt
  text: 'Pedro lhe disse: “Mesmo que eu tenha de morrer com você, de modo nenhum negarei você[a].” Da mesma forma, todos os discípulos disseram o mesmo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “jamais negarei você”. O grego emprega uma negação enfática (οὐ μή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: lhe disse
  rationale: O presente histórico grego é vertido pelo passado, mais natural na narrativa portuguesa; “lhe” preserva o destinatário sem repetição pesada.
- source_word: Κἂν δέῃ με
  choice: Mesmo que eu tenha de
  rationale: A construção introduz uma condição concessiva e expressa necessidade; esta formulação é natural e mantém ambas as ideias.
- source_word: σὺν σοὶ ἀποθανεῖν
  choice: morrer com você
  rationale: Preserva de modo direto a ideia de morrer em companhia de Jesus, com linguagem corrente e legível no português brasileiro.
- source_word: οὐ μή
  choice: de modo nenhum
  rationale: A dupla negação grega é enfática; “de modo nenhum” conserva essa força sem reduzir a expressão a uma negação simples.
- source_word: ἀπαρνήσομαι
  choice: negarei você
  rationale: No contexto, o verbo significa negar ou repudiar a ligação com Jesus. “Negar” preserva a conexão lexical com a posterior negação de Pedro, enquanto o objeto explícito evita ambiguidade.
- source_word: ὁμοίως
  choice: Da mesma forma
  rationale: Reproduz diretamente a ideia de que os demais discípulos fizeram uma declaração semelhante.
- source_word: πάντες οἱ μαθηταὶ εἶπαν
  choice: todos os discípulos também disseram
  rationale: Mantém a totalidade expressa por πάντες e o sentido simples de εἶπαν; “também” reflete καί.
theological_decisions:
- issue: Força da afirmação de Pedro de que não negaria Jesus
  choice: de modo nenhum negarei você
  alternative: jamais negarei você
  rationale: οὐ μή expressa uma negação futura enfática. A tradução escolhida mantém a veemência e a autoconfiança de Pedro sem explicar teologicamente sua posterior falha nem eliminar a tensão narrativa.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Você” evita o tom arcaizante de “tu/contigo”; a sintaxe permanece próxima do grego sem soar excessivamente literal.
