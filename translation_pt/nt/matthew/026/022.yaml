base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/022.yaml
  text: And being deeply grieved[a], they began to say to him one by one, “Surely not I[b], Lord?”
translation:
  language: pt
  text: 'E, profundamente entristecidos, começaram a dizer-lhe, um por um: “Acaso sou eu, Senhor?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A palavra grega que introduz a pergunta indica que quem pergunta espera uma resposta negativa: “Certamente não sou eu, Senhor?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπούμενοι σφόδρα
  choice: profundamente entristecidos
  rationale: O particípio presente descreve o estado emocional contínuo dos discípulos, e σφόδρα o intensifica. A expressão é natural em português e preserva a força da tristeza.
- source_word: ἤρξαντο λέγειν αὐτῷ
  choice: começaram a dizer-lhe
  rationale: Mantém o valor ingressivo da construção e representa de modo conciso o objeto indireto αὐτῷ.
- source_word: εἷς ἕκαστος
  choice: um por um
  rationale: A expressão distributiva enfatiza que cada discípulo respondeu individualmente; “um por um” comunica isso de forma idiomática.
- source_word: Μήτι ἐγώ εἰμι
  choice: Acaso sou eu
  rationale: Μήτι introduz uma pergunta que espera resposta negativa. “Acaso sou eu?” preserva a expectativa sem tornar a fala artificial em português.
- source_word: κύριε
  choice: Senhor
  rationale: “Senhor” conserva o valor de κύριε como forma de tratamento dirigida a Jesus e sua relevância narrativa e teológica.
theological_decisions:
- issue: Sentido de κύριε ao dirigir-se a Jesus
  choice: Senhor
  alternative: senhor; mestre
  rationale: Embora κύριε possa, em certos contextos, funcionar como tratamento respeitoso, “Senhor” preserva aqui tanto a forma de tratamento quanto o peso cristológico possível, sem explicitar mais do que o grego.
- issue: Força pragmática de Μήτι
  choice: Acaso sou eu?
  alternative: Sou eu?; Não sou eu, certo?
  rationale: A formulação mantém a pergunta e sua expectativa de resposta negativa, sem transformar essa expectativa em uma afirmação categórica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Acaso” é ligeiramente elevado, mas permanece corrente e reproduz de modo conciso a expectativa negativa da pergunta grega.
