  text: Ὁ δὲ Πέτρος ⸂ἐκάθητο ἔξω⸃ ἐν τῇ αὐλῇ· καὶ προσῆλθεν αὐτῷ μία παιδίσκη λέγουσα· Καὶ σὺ ἦσθα μετὰ Ἰησοῦ τοῦ Γαλιλαίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/069.yaml
  text: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
translation:
  language: pt
  text: 'Pedro estava sentado do lado de fora, no pátio, e uma criada[a] se aproximou dele e disse: “Você também estava com Jesus, o galileu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma jovem serva” ou “uma escrava”. O termo grego παιδίσκη pode designar uma jovem serva, às vezes em condição de escravidão.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: quando
  rationale: A partícula faz uma transição narrativa leve. Em português, a ligação com “quando” integra naturalmente esta cena ao relato sem introduzir um “agora” temporal inexistente no grego.
- source_word: ἐκάθητο ἔξω
  choice: estava sentado do lado de fora
  rationale: O imperfeito descreve uma situação em curso; “estava sentado” preserva esse aspecto. “Do lado de fora” situa Pedro fora do recinto interior, mas ainda no pátio.
- source_word: ἐν τῇ αὐλῇ
  choice: no pátio
  rationale: αὐλή designa aqui o pátio aberto da residência do sumo sacerdote; “pátio” é claro e natural.
- source_word: προσῆλθεν αὐτῷ
  choice: se aproximou dele
  rationale: Expressa aproximação física de maneira natural e fiel.
- source_word: μία παιδίσκη
  choice: uma criada
  rationale: παιδίσκη pode indicar uma jovem serva, inclusive escravizada. “Criada” comunica sua função doméstica sem afirmar além do contexto seu estatuto jurídico; μία introduz a personagem naturalmente como “uma”.
- source_word: λέγουσα
  choice: e disse
  rationale: Embora seja particípio no grego, a coordenação finita é mais idiomática em português e mantém a sequência da ação.
- source_word: Καὶ σὺ
  choice: Você também
  rationale: καί com o pronome enfático σὺ inclui Pedro entre outras pessoas associadas a Jesus; “Você também” preserva essa ênfase.
- source_word: ἦσθα μετὰ
  choice: estava com
  rationale: Tradução direta da relação expressa, sem ampliar interpretativamente para “era seguidor de”.
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: Jesus, o galileu
  rationale: Preserva o gentílico usado como identificação de Jesus. A vírgula torna o aposto natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” reproduz naturalmente a interpelação direta; “criada” é conciso, enquanto a nota preserva a amplitude social de παιδίσκη.
