  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: pt
  text: E, depois de cantarem um hino[a], saíram para o Monte das Oliveiras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois de cantarem louvores”. O verbo grego pode se referir de modo geral a cantar louvores, embora “cantar um hino” se ajuste ao contexto imediato da refeição e ao uso comum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμνήσαντες
  choice: depois de cantarem um hino
  rationale: O particípio aoristo de ὑμνέω indica uma ação anterior à saída e se refere a cantar louvor ou hinos. A formulação é natural em português e se ajusta ao contexto imediato da refeição, sem especificar qual cântico foi entoado.
- source_word: ἐξῆλθον
  choice: saíram
  rationale: O aoristo de ἐξέρχομαι significa diretamente sair ou partir. “Saíram” preserva o sentido básico e é idiomático no contexto narrativo.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: para o monte das Oliveiras
  rationale: Reproduz a designação geográfica tradicional e semanticamente transparente; εἰς expressa o movimento em direção ao local.
- source_word: καὶ
  choice: E
  rationale: Mantém a coordenação simples do texto grego, ligando a ação ao relato anterior sem acrescentar uma nuance temporal não explicitada pela conjunção.
