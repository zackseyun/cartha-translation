base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/021.yaml
  text: And while they were eating[a], he said, “Truly I tell you, one of you will betray me.”
translation:
  language: pt
  text: 'Enquanto comiam, ele disse: “Em verdade digo a vocês: um de vocês me trairá[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “me entregará”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: Enquanto comiam
  rationale: O genitivo absoluto indica uma ação simultânea. A formulação é natural em português e conserva claramente a relação temporal.
- source_word: Ἀμὴν
  choice: Em verdade
  rationale: Neste uso introdutório característico das declarações de Jesus, ἀμήν funciona como afirmação solene. “Em verdade” transmite essa força com dignidade e clareza.
- source_word: λέγω ὑμῖν
  choice: digo a vocês
  rationale: Preserva tanto o verbo de fala quanto o destinatário plural, em linguagem atual e amplamente compreensível.
- source_word: εἷς ἐξ ὑμῶν
  choice: um de vocês
  rationale: Expressa de modo direto e natural a construção partitiva grega.
- source_word: παραδώσει
  choice: me trairá
  rationale: Embora o verbo possa significar literalmente “entregará”, neste contexto designa a entrega traiçoeira de Jesus por alguém do próprio grupo. “Trairá” comunica naturalmente o sentido contextual, e a nota preserva a amplitude lexical.
- source_word: με
  choice: me
  rationale: Mantém sem expansão o pronome que tem Jesus como objeto direto.
theological_decisions:
- issue: Sentido de παραδώσει no contexto da paixão
  choice: me trairá
  alternative: me entregará
  rationale: O verbo grego é lexicalmente mais amplo do que “trair”, mas o contexto narrativo destaca a deslealdade de um discípulo ao entregar Jesus. A tradução principal comunica essa dimensão relacional sem ocultar, graças à nota, o sentido mais literal e a conexão com o tema da entrega.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Em verdade” preserva a solenidade da fórmula de Jesus; “a vocês” evita uma forma excessivamente lusitana ou arcaica. O marcador da nota foi colocado após “trairá”, termo ao qual a alternativa lexical se refere.
