id: MAT.20.1
reference: Matthew 20:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: pt
  text: Pois o reino dos céus é semelhante a um homem, proprietário de uma casa, que saiu bem cedo para contratar trabalhadores para a sua vinha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: a um homem, dono de casa
  rationale: Mantém os dois elementos do grego — o termo genérico para homem e a função de chefe ou proprietário da casa — sem reduzir a expressão apenas a “proprietário”.
- source_word: ἅμα πρωῒ
  choice: bem cedo
  rationale: Expressa naturalmente a ideia de sair logo no início da manhã, sem acrescentar uma hora específica.
- source_word: μισθώσασθαι ἐργάτας
  choice: contratar trabalhadores
  rationale: Comunica de modo corrente a contratação de trabalhadores mediante pagamento, como indica o contexto.
- source_word: ἀμπελῶνα
  choice: vinha
  rationale: Equivalente português tradicional, claro e preciso para uma plantação de videiras.
theological_decisions:
- issue: Comparação com o reino dos céus
  choice: o reino dos céus é semelhante a um homem, dono de casa
  alternative: o reino dos céus é semelhante a um dono de casa
  rationale: Preserva a formulação explícita ἀνθρώπῳ οἰκοδεσπότῃ e não redefine o ponto exato da comparação, que se desenvolve ao longo da parábola.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Dono de casa” conserva a imagem social do texto antigo sem recorrer ao menos corrente “pai de família”.
