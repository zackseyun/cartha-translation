  text: ⸀οὐκ ἔξεστίν μοι ⸂ὃ θέλω ποιῆσαι⸃ ἐν τοῖς ἐμοῖς; ⸀ἢ ὁ ὀφθαλμός σου πονηρός ἐστιν ὅτι ἐγὼ ἀγαθός εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/015.yaml
  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: pt
  text: Não tenho o direito de fazer o que quero com o que é meu? Ou o seu olho é mau porque eu sou bom?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Você está com inveja porque eu sou bom?» A expressão «o seu olho é mau» indica inveja ou ressentimento diante da generosidade de outra pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστίν
  choice: é permitido
  rationale: Expressa aquilo que é lícito ou permitido. A construção impessoal «não me é permitido» preserva a nuance de legitimidade e funciona naturalmente em português.
- source_word: ὃ θέλω ποιῆσαι
  choice: fazer o que quero
  rationale: Reproduz de modo claro e atual a ideia de vontade pessoal expressa por θέλω, sem tom arcaico.
- source_word: ἐν τοῖς ἐμοῖς
  choice: com o que é meu
  rationale: Comunica de forma idiomática a posse e o direito de dispor dos próprios bens no contexto da parábola.
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: o seu olho é mau
  rationale: Preserva a imagem semítica refletida no grego e o contraste verbal com «bom», deixando a explicação de inveja ou ressentimento para a nota.
- source_word: ἀγαθός
  choice: bom
  rationale: Mantém o sentido lexical direto e o contraste explícito entre o olho «mau» do trabalhador e a bondade do proprietário, sem restringir o termo a «generoso».
theological_decisions:
- issue: Se a expressão ὁ ὀφθαλμός σου πονηρός deve ser interpretada no texto principal
  choice: Preservar a expressão figurada «o seu olho é mau»
  alternative: «você está com inveja» ou «você se ressente porque sou generoso»
  rationale: A formulação literal conserva a imagem cultural e a tensão entre o «olho mau» e o proprietário «bom». A nota esclarece o sentido provável sem impor uma única paráfrase ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «seu» de modo natural e mantém a metáfora original, explicada em nota.
