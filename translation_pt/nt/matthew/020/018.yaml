source:
  edition: SBLGNT
  text: Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
translation:
  language: pt
  text: “Vejam[a], estamos subindo para Jerusalém, e o Filho do Homem[c] será entregue[b] aos chefes dos sacerdotes e aos escribas, e eles o condenarão à morte.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eis que”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido por “será entregue” também pode significar “será traído” em um contexto mais específico.
    reason: lexical_alternative
  - marker: c
    text: “Filho do Homem” é uma autodesignação característica de Jesus e pode evocar Daniel 7:13–14.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Vejam
  rationale: Preserva a função de chamar a atenção em português atual e natural; “Eis” é uma alternativa mais tradicional.
- source_word: ἀναβαίνομεν
  choice: estamos subindo
  rationale: Reproduz o presente do movimento em curso e conserva a ideia geográfica e convencional de subir a Jerusalém.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a forma consagrada da autodesignação de Jesus e sua possível ressonância de Daniel 7:13–14.
- source_word: παραδοθήσεται
  choice: será entregue
  rationale: Expressa a transferência para o poder de outros sem restringir o sentido à traição de Judas.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: aos chefes dos sacerdotes
  rationale: Indica as principais autoridades sacerdotais e evita sugerir a existência simultânea de vários sumos sacerdotes no exercício do cargo.
- source_word: γραμματεῦσιν
  choice: aos escribas
  rationale: É o equivalente lexical direto e permanece compreensível em português bíblico atual.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: Eles o condenarão à morte
  rationale: Traduz naturalmente o sentido judicial da sentença e torna explícito o sujeito já indicado pela forma verbal grega.
theological_decisions:
- issue: Tradução do título cristológico ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  alternative: o Ser Humano
  rationale: Preserva o título tradicional e textualmente fundamentado, bem como sua possível alusão a Daniel, sem reduzi-lo a uma expressão antropológica genérica.
- issue: Amplitude semântica de παραδοθήσεται
  choice: será entregue
  alternative: será traído
  rationale: Mantém a amplitude do passivo grego, que descreve a entrega às autoridades hostis sem identificar neste versículo o agente ou limitar o ato à traição.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com boa legibilidade brasileira. “Vejam” dirige naturalmente a atenção dos discípulos; “chefes dos sacerdotes” esclarece a função do plural grego. A divisão em duas frases favorece a leitura sem alterar a coordenação e a progressão do original.
