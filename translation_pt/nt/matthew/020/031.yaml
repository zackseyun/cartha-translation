id: MAT.20.31
reference: Matthew 20:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ὄχλος ἐπετίμησεν αὐτοῖς ἵνα σιωπήσωσιν· οἱ δὲ μεῖζον ⸀ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: pt
  text: 'Mas a multidão os repreendeu para que se calassem. Eles, porém, gritaram ainda mais[a]: “Senhor, tem misericórdia de nós, Filho de Davi[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mais alto”. O comparativo grego pode indicar maior intensidade em geral (“ainda mais”) ou, especificamente, maior volume de voz.
    reason: lexical_alternative
  - marker: b
    text: “Filho de Davi” é um título messiânico, não apenas uma indicação de ascendência.
    reason: cultural_note
lexical_decisions:
- source_word: ὄχλος
  choice: a multidão
  rationale: “Multidão” é uma tradução natural de ὄχλος e corresponde ao cenário narrativo.
- source_word: ἐπετίμησεν
  choice: repreendeu
  rationale: Preserva a ideia de censura enérgica sem explicitar além do que o verbo grego afirma.
- source_word: ἵνα σιωπήσωσιν
  choice: para que se calassem
  rationale: Expressa de modo natural a finalidade da tentativa da multidão de silenciá-los.
- source_word: μεῖζον
  choice: ainda mais
  rationale: Conserva a força comparativa sem restringi-la necessariamente ao volume da voz.
- source_word: ἔκραξαν
  choice: gritaram
  rationale: Comunica com clareza o clamor alto e urgente indicado por κράζω.
- source_word: Κύριε
  choice: Senhor
  rationale: Mantém tanto o tratamento respeitoso quanto sua possível ressonância cristológica.
- source_word: ἐλέησον ἡμᾶς
  choice: tem misericórdia de nós
  rationale: É uma formulação corrente, digna e fiel ao imperativo grego.
- source_word: υἱὸς Δαυίδ
  choice: Filho de Davi
  rationale: Preserva literalmente o título régio e messiânico, em vez de reduzi-lo a uma mera indicação genealógica.
theological_decisions:
- issue: Título messiânico aplicado a Jesus
  choice: Filho de Davi
  alternative: descendente de Davi
  rationale: Em Mateus, a expressão possui força titular, régia e messiânica; a tradução literal preserva essas dimensões sem desenvolvê-las no corpo do texto.
- issue: κύριος como forma de tratamento dirigida a Jesus
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” conserva a ambiguidade entre tratamento respeitoso e afirmação de possível peso cristológico, ao passo que “Mestre” estreitaria o sentido.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada naturalmente para o português, e a repetição contrastiva de δέ foi representada por “Mas” e “porém”.
