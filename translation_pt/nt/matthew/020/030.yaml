reference: Matthew 20:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: pt
  text: 'E eis que dois cegos, sentados à beira do caminho, ao ouvirem que Jesus estava passando, gritaram: “Senhor, tem misericórdia de nós, Filho de Davi!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Preserva a função de chamar a atenção e a vivacidade narrativa, em registro digno e reconhecível em português.
- source_word: δύο τυφλοὶ
  choice: dois cegos
  rationale: O masculino plural designa aqui dois homens específicos; a formulação é direta e natural no contexto narrativo.
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: sentados à beira do caminho
  rationale: Reproduz com naturalidade a posição dos homens e sua localização junto à via.
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: ao ouvirem que Jesus estava passando
  rationale: Expressa o valor temporal do particípio aoristo e traduz παράγει de modo idiomático neste contexto.
- source_word: ἔκραξαν λέγοντες
  choice: gritaram
  rationale: Mantém a intensidade de κράζω; o verbo de fala pode ficar implícito em português sem perda de conteúdo, pois a fala direta vem logo depois.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva a forma reverente de tratamento e sua possível força cristológica, especialmente em associação com o título messiânico seguinte.
- source_word: ἐλέησον ἡμᾶς
  choice: tem misericórdia de nós
  rationale: É uma formulação corrente, clara e tradicional para o apelo por compaixão e ajuda.
- source_word: υἱὸς Δαυίδ
  choice: Filho de Davi
  rationale: Conserva literalmente o título davídico e sua ressonância régio-messiânica em Mateus.
theological_decisions:
- issue: Sentido de κύριος no tratamento dirigido a Jesus
  choice: Senhor
  alternative: senhor; mestre
  rationale: A associação com “Filho de Davi” confere ao tratamento peso reverente e messiânico. “Senhor” preserva essa força sem definir além do que o contexto permite.
- issue: Força messiânica de υἱὸς Δαυίδ
  choice: Filho de Davi
  alternative: descendente de Davi
  rationale: A tradução mantém o título reconhecível e suas conotações reais e messiânicas, em vez de reduzi-lo a uma simples informação genealógica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “E eis que” conserva o marcador discursivo enfático do grego; “à beira do caminho” e “estava passando” dão fluidez contemporânea. A pontuação da fala trata “Filho de Davi” como vocativo dirigido a Jesus.
