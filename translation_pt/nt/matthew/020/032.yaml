  text: καὶ στὰς ὁ Ἰησοῦς ἐφώνησεν αὐτοὺς καὶ εἶπεν· Τί θέλετε ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: pt
  text: 'Jesus parou, chamou-os e disse: “O que vocês querem que eu faça por vocês?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: parou
  rationale: O particípio aoristo de ἵστημι indica aqui que Jesus interrompeu seu deslocamento. “Parou” é natural e preciso em português.
- source_word: ἐφώνησεν
  choice: chamou
  rationale: φωνέω significa chamar ou convocar. “Chamou” preserva de modo simples e corrente a ação de Jesus ao dirigir-se aos homens.
- source_word: αὐτοὺς
  choice: os dois
  rationale: O pronome acusativo plural retoma os dois cegos do contexto imediato. “Os dois” torna o referente claro em português sem acrescentar informação nova.
- source_word: Τί θέλετε
  choice: O que vocês querem
  rationale: A formulação reproduz de maneira direta e idiomática o pronome interrogativo e o verbo θέλω, mantendo o tom pessoal da pergunta.
- source_word: ποιήσω ὑμῖν
  choice: que eu faça por vocês
  rationale: O subjuntivo ποιήσω completa θέλετε, e o dativo ὑμῖν tem sentido benefactivo. A construção é natural em português e conserva explicitamente o sujeito “eu”.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: O nome próprio é vertido na forma portuguesa tradicional; o artigo grego não precisa ser reproduzido.
theological_decisions:
- issue: Tom e força da pergunta de Jesus
  choice: 'Uma pergunta direta e acolhedora: “O que vocês querem que eu faça por vocês?”'
  alternative: “Que desejam que eu faça por vocês?”
  rationale: A redação escolhida preserva o envolvimento pessoal de Jesus e a força simples do grego, sem formalidade artificial nem interpretação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” adequado ao referente plural e boa legibilidade brasileira. A coordenação grega foi vertida com pontuação e com “perguntou” em lugar do literal “disse”, pois introduz uma pergunta direta de modo natural sem alterar seu conteúdo.
