base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/033.yaml
  text: They said to him[a], “Lord, let our eyes be opened.”
translation:
  language: pt
  text: 'Eles lhe disseram: “Senhor[a], que os nossos olhos sejam abertos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou apenas uma forma respeitosa de tratamento: “senhor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: Eles lhe disseram
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma natural na narrativa portuguesa; o pronome dativo αὐτῷ é expresso por “lhe”.
- source_word: Κύριε
  choice: Senhor
  rationale: O vocativo κύριε pode comunicar tanto reconhecimento de autoridade quanto tratamento respeitoso. “Senhor” preserva essa amplitude em português.
- source_word: ἵνα
  choice: que
  rationale: Introduz o conteúdo do pedido em construção elíptica, mantida de modo claro e digno em português.
- source_word: ἀνοιγῶσιν
  choice: sejam abertos
  rationale: Preserva a voz passiva e o modo subjuntivo do aoristo passivo grego, sem identificar explicitamente o agente.
- source_word: οἱ ὀφθαλμοὶ ἡμῶν
  choice: os nossos olhos
  rationale: Reproduz naturalmente o substantivo articulado acompanhado do genitivo possessivo.
theological_decisions:
- issue: Sentido de κύριος como forma de dirigir-se a Jesus
  choice: Senhor
  alternative: senhor, como tratamento respeitoso equivalente a “senhor” ou “senhor meu”
  rationale: A tradução principal mantém o título tradicional e sua possível força cristológica, enquanto a nota reconhece que, isoladamente, o vocativo também pode funcionar como tratamento respeitoso.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação elíptica “que os nossos olhos sejam abertos” conserva a estrutura e a passividade do grego, embora seja um pouco mais formal que a fala cotidiana.
