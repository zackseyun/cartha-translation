  text: ⸂Καὶ ἀναβαίνων ὁ⸃ Ἰησοῦς εἰς Ἱεροσόλυμα παρέλαβεν τοὺς δώδεκα ⸀μαθητὰς κατ’ ἰδίαν, ⸂καὶ ἐν τῇ ὁδῷ⸃ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/017.yaml
  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: pt
  text: 'Enquanto Jesus subia para Jerusalém, levou os doze discípulos à parte e, no caminho, disse-lhes:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: Enquanto subia
  rationale: O particípio presente indica uma ação em curso e simultânea à ação principal. “Subia” preserva o sentido geográfico e convencional da subida para Jerusalém.
- source_word: εἰς Ἱεροσόλυμα
  choice: para Jerusalém
  rationale: Com nome de cidade, εἰς expressa aqui direção e destino; “para” é a forma natural em português.
- source_word: παρέλαβεν
  choice: chamou à parte
  rationale: O verbo significa tomar ou levar consigo; em combinação com κατ’ ἰδίαν, a expressão natural “chamou à parte” comunica que Jesus separou os discípulos dos demais para falar em particular.
- source_word: τοὺς δώδεκα μαθητὰς
  choice: os doze discípulos
  rationale: Representa tanto o numeral quanto μαθητάς, mantendo a designação explícita do grupo presente no texto grego.
- source_word: κατ’ ἰδίαν
  choice: à parte
  rationale: A locução indica separação dos outros e um contexto privado; “à parte” conserva esse sentido espacial e relacional sem redundância.
- source_word: ἐν τῇ ὁδῷ
  choice: no caminho
  rationale: Forma idiomática e concisa que preserva o cenário da viagem.
- source_word: εἶπεν αὐτοῖς
  choice: lhes disse
  rationale: Equivalente natural e próximo do verbo comum de fala λέγω, deixando o conteúdo para o versículo seguinte.
