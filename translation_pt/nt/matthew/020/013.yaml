  text: ὁ δὲ ἀποκριθεὶς ⸂ἑνὶ αὐτῶν εἶπεν⸃· Ἑταῖρε, οὐκ ἀδικῶ σε· οὐχὶ δηναρίου συνεφώνησάς μοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: pt
  text: 'Mas ele respondeu a um deles: “Amigo, não estou sendo injusto com você. Você não combinou comigo um denário[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O denário era uma moeda romana de prata, geralmente considerada o pagamento habitual por um dia de trabalho de um trabalhador.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: respondeu
  rationale: O particípio seguido de εἶπεν constitui uma fórmula de resposta. Em português atual, “respondeu” transmite a função da construção sem a redundância pouco natural de “respondendo, disse”.
- source_word: ἑνὶ αὐτῶν
  choice: a um deles
  rationale: 'Preserva o dativo singular com o genitivo partitivo: a resposta é dirigida a um indivíduo do grupo.'
- source_word: Ἑταῖρε
  choice: Amigo
  rationale: É o equivalente vocativo mais natural em português. No contexto, pode ter tom contido ou distanciado, sem necessariamente indicar intimidade.
- source_word: οὐκ ἀδικῶ σε
  choice: não estou sendo injusto com você
  rationale: Expressa a ação presente de tratar alguém injustamente e mantém explícito o objeto pessoal σε. “Não estou prejudicando você” seria possível, mas enfatizaria mais o dano do que a injustiça.
- source_word: οὐχὶ
  choice: Você não... ?
  rationale: A pergunta negativa espera resposta afirmativa. Essa construção conserva a força retórica em português claro e atual.
- source_word: δηναρίου
  choice: o valor de um denário
  rationale: O genitivo indica o preço ou salário acordado. A formulação explicita naturalmente essa relação em português, preservando o nome histórico da moeda.
- source_word: συνεφώνησάς μοι
  choice: combinou comigo
  rationale: Refere-se ao acordo feito anteriormente. “Combinar comigo” é corrente e compreensível, além de manter a relação entre as duas partes.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A sintaxe grega foi ajustada onde uma reprodução literal produziria redundância ou estranheza em português.
