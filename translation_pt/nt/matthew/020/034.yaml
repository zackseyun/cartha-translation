source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ Ἰησοῦς ἥψατο τῶν ⸀ὀμμάτων αὐτῶν, καὶ εὐθέως ⸀ἀνέβλεψαν καὶ ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/034.yaml
  text: And Jesus[a], moved with compassion, touched their eyes, and immediately they received their sight and followed him.
translation:
  language: pt
  text: Movido por compaixão, Jesus tocou nos olhos deles. Imediatamente, eles recuperaram a visão[a] e o seguiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “voltaram a ver”. O verbo grego também pode significar literalmente “olhar para cima”, mas, neste contexto, refere-se à restauração da visão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: Movido de compaixão
  rationale: O particípio expressa compaixão profunda; esta formulação é natural, digna e preserva sua força afetiva.
- source_word: δὲ
  choice: relação narrativa expressa pela sequência das frases
  rationale: Aqui δέ é um conectivo narrativo leve. Em português, a progressão fica natural sem uma conjunção explícita no início.
- source_word: ἥψατο
  choice: tocou
  rationale: No contexto da cura, o verbo indica contato físico; “tocou” é claro e idiomático.
- source_word: τῶν ὀμμάτων αὐτῶν
  choice: nos olhos deles
  rationale: O genitivo regido pelo verbo grego é expresso naturalmente em português pela construção “tocar nos olhos deles”.
- source_word: εὐθέως
  choice: Imediatamente
  rationale: Preserva a ênfase no resultado instantâneo da ação de Jesus.
- source_word: ἀνέβλεψαν
  choice: recuperaram a visão
  rationale: No contexto de cura de cegos, o verbo indica que passaram a enxergar ou voltaram a enxergar; a formulação comunica claramente a restauração sem especificar se já haviam enxergado antes.
- source_word: ἠκολούθησαν αὐτῷ
  choice: o seguiram
  rationale: Preserva tanto o sentido concreto de acompanhar Jesus quanto a possível ressonância de discipulado, sem tornar essa implicação explícita demais.
theological_decisions:
- issue: Natureza do resultado da cura em ἀνέβλεψαν
  choice: recuperaram a visão
  alternative: voltaram a ver; ergueram os olhos
  rationale: O contexto de milagre e o advérbio “imediatamente” indicam uma cura real e instantânea. A tradução expressa a restauração da visão, enquanto a nota registra a amplitude lexical do verbo.
- issue: Sentido de ἠκολούθησαν αὐτῷ
  choice: o seguiram
  alternative: tornaram-se discípulos dele
  rationale: O texto afirma que eles seguiram Jesus, mas não define expressamente a profundidade ou a duração desse seguimento. A tradução mantém essa abertura.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A divisão em duas frases torna clara a sequência entre o gesto de Jesus e seu resultado imediato, sem alterar o conteúdo.
