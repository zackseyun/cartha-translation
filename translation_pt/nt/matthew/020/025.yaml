source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: pt
  text: 'Mas Jesus os chamou para junto de si e disse: “Vocês sabem que os governantes dos gentios[a] os dominam, e os grandes[b] exercem poder sobre eles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das nações”.
    reason: alternative_reading
  - marker: b
    text: Ou “os poderosos” ou “os altos oficiais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: os chamou para junto de si
  rationale: O particípio aoristo médio indica que Jesus chamou os discípulos para perto de si antes de falar; a formulação é natural em português e preserva essa nuance.
- source_word: Οἴδατε
  choice: Vocês sabem
  rationale: Embora οἶδα tenha forma perfeita, possui sentido presente aqui. “Vocês sabem” é idiomático, claro e adequado ao discurso direto.
- source_word: ἄρχοντες
  choice: governantes
  rationale: O termo designa pessoas que governam ou exercem domínio político; “governantes” é amplo e corrente.
- source_word: τῶν ἐθνῶν
  choice: dos gentios
  rationale: No contexto judaico da fala de Jesus, ἔθνη designa naturalmente os povos não judeus. A nota preserva a alternativa lexical “nações”.
- source_word: κατακυριεύουσιν
  choice: dominam sobre
  rationale: O verbo composto exprime exercício de senhorio ou domínio, frequentemente com força negativa. “Dominam sobre” comunica essa ideia sem exagerá-la como “tiranizam”.
- source_word: οἱ μεγάλοι
  choice: os grandes
  rationale: O adjetivo substantivado se refere aos social ou politicamente proeminentes. “Os grandes” preserva a forma concisa e a imagem do grego; a nota oferece equivalentes portugueses mais explícitos.
- source_word: κατεξουσιάζουσιν
  choice: exercem poder sobre
  rationale: A expressão comunica o exercício de autoridade ou poder sobre outros e mantém o paralelismo com “dominam sobre”.
- source_word: αὐτῶν
  choice: eles
  rationale: Nas duas ocorrências, o pronome retoma os gentios ou povos submetidos aos governantes e aos grandes.
theological_decisions:
- issue: Sentido de ἐθνῶν no contexto judaico da fala de Jesus
  choice: gentios
  alternative: nações
  rationale: “Gentios” preserva o contraste contextual entre o modo de governar dos povos não judeus e a conduta que Jesus exige dos discípulos, enquanto a nota mantém a amplitude lexical possível de “nações”.
- issue: Forma de traduzir οἱ μεγάλοι
  choice: os grandes
  alternative: os poderosos; os altos oficiais
  rationale: A escolha conserva o adjetivo substantivado masculino e a concisão do original sem especificar indevidamente um cargo. As alternativas esclarecem que se trata de pessoas proeminentes ou autoridades.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”, natural para leitores brasileiros e inteligível internacionalmente. A estrutura paralela do grego foi preservada, assim como a conotação crítica dos dois verbos de domínio, sem intensificá-los além da evidência lexical.
