  source_fidelity: A oração temporal e a reação de indignação refletem adequadamente Καὶ ἀκούσαντες ... ἠγανάκτησαν. Contudo, περί com genitivo é mais literalmente 'a respeito de/sobre'; 'com' tende a especificar em português que os dois irmãos eram o alvo direto da indignação, nuance plausível pelo contexto, mas não exigida pela formulação grega.
