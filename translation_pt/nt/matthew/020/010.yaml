  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: pt
  text: Quando chegaram os que tinham sido contratados primeiro[a], pensaram que receberiam mais; mas eles também receberam um denário cada um.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “os primeiros”; a expressão se refere aos trabalhadores contratados primeiro na parábola.
    reason: lexical_alternative
  - marker: b
    text: O denário era uma moeda romana e correspondia à diária comum de um trabalhador.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: quando chegaram
  rationale: O particípio aoristo tem valor temporal e introduz naturalmente a chegada do grupo no fluxo narrativo.
- source_word: οἱ πρῶτοι
  choice: os que tinham sido contratados primeiro
  rationale: O substantivo adjetival plural refere-se ao primeiro grupo de trabalhadores da parábola. A explicitação de 'contratados' recupera o referente contextual sem sugerir posição ou superioridade.
- source_word: ἐνόμισαν
  choice: pensaram
  rationale: Expressa a suposição ou expectativa dos trabalhadores em linguagem corrente, sem indicar certeza.
- source_word: πλεῖον
  choice: mais
  rationale: O comparativo neutro indica uma quantia maior e é traduzido de modo natural e conciso.
- source_word: λήμψονται
  choice: receberiam
  rationale: O futuro dentro do pensamento relatado após um verbo no passado é naturalmente expresso pelo futuro do pretérito em português.
- source_word: τὸ ἀνὰ δηνάριον
  choice: um denário cada um
  rationale: ἀνά com acusativo tem sentido distributivo; a formulação deixa claro que cada trabalhador recebeu individualmente a mesma quantia.
- source_word: καὶ αὐτοί
  choice: eles também
  rationale: 'Preserva a ênfase aditiva e o contraste surpreendente: os contratados primeiro receberam a mesma diária que os demais.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. A explicitação contextual em “contratados primeiro” evita a ambiguidade artificial de “os primeiros”, enquanto a nota preserva a forma mais literal. O ponto e vírgula mantém o contraste narrativo sem intensificá-lo além do grego.
