  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: pt
  text: 'Ao cair da tarde, o senhor da vinha diz ao seu administrador: “Chame os trabalhadores e pague-lhes o salário, começando pelos últimos e indo até os primeiros.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Ao cair da tarde
  rationale: Expressa de modo natural a chegada do período da tarde/noite, preservando a circunstância temporal do grego.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: o senhor da vinha
  rationale: Mantém o sentido comum de proprietário ou senhor da vinha, sem introduzir título divino.
- source_word: τῷ ἐπιτρόπῳ αὐτοῦ
  choice: ao seu administrador
  rationale: ἐπίτροπος designa aqui o encarregado responsável pela administração; “administrador” é claro e atual.
- source_word: ἀπόδος αὐτοῖς τὸν μισθὸν
  choice: pague-lhes o salário
  rationale: ἀποδίδωμι traz a ideia de entregar o que é devido, e μισθός é a remuneração pelo trabalho.
- source_word: ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: começando pelos últimos e indo até os primeiros
  rationale: Preserva a ordem enfática do pagamento e explicita naturalmente o valor de ἕως.
theological_decisions:
- issue: Presente histórico em λέγει
  choice: diz
  alternative: disse
  rationale: Mantém o presente narrativo do texto grego e a vivacidade observada na camada inglesa auditada.
- issue: Possível leitura simbólica de κύριος
  choice: senhor da vinha em sentido narrativo
  alternative: Senhor da vinha como título teológico
  rationale: O contexto imediato identifica o proprietário da vinha dentro da parábola; a tradução não deve impor uma identificação teológica além do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção natural no Brasil e inteligível internacionalmente. O discurso direto usa formas claras sem excesso de formalidade.
