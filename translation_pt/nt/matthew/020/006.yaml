base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/006.yaml
  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
translation:
  language: pt
  text: 'Por volta da décima primeira hora, ele saiu e encontrou outros ali parados. E lhes diz: “Por que vocês estão aqui parados o dia todo, sem trabalhar?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ociosos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  choice: Por volta da décima primeira hora
  rationale: περί com acusativo indica aproximação. A formulação preserva o modo antigo de contar as horas e a moldura temporal da parábola.
- source_word: ἐξελθὼν εὗρεν
  choice: ele saiu e encontrou
  rationale: O particípio aoristo indica ação anterior ou estreitamente ligada ao verbo principal; a coordenação é natural em português e mantém a sequência.
- source_word: ἄλλους ἑστῶτας
  choice: outros ali parados
  rationale: ἄλλους é substantivado e não exige acrescentar 'homens'. O perfeito ἑστῶτας descreve o estado em que eles se encontravam; 'parados' é idiomático no contexto.
- source_word: καὶ λέγει αὐτοῖς
  choice: Então lhes diz
  rationale: Mantém o presente histórico λέγει, que confere vivacidade à narrativa; 'então' expressa naturalmente a progressão sem alterar o sentido.
- source_word: Τί ὧδε ἑστήκατε ὅλην τὴν ἡμέραν
  choice: Por que vocês ficaram aqui o dia todo
  rationale: τί tem valor idiomático de 'por que'. 'Ficaram aqui' comunica o estado prolongado do perfeito ἑστήκατε em português corrente.
- source_word: ἀργοί
  choice: sem trabalhar
  rationale: No contexto dos trabalhadores aguardando contratação, exprime com clareza a inatividade indicada por ἀργοί, sem introduzir a categoria socioeconômica de desemprego.
