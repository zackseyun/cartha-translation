  text: Καὶ ἐκπορευομένων αὐτῶν ἀπὸ Ἰεριχὼ ἠκολούθησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/029.yaml
  text: And as they were going out from Jericho[a], a large crowd followed him.
translation:
  language: pt
  text: Quando eles saíam de Jericó, uma grande multidão o seguiu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκπορευομένων
  choice: quando eles saíam
  rationale: O particípio presente genitivo plural tem função temporal e aspecto durativo; “quando eles saíam” transmite naturalmente a ação em andamento.
- source_word: ἀπὸ Ἰεριχὼ
  choice: de Jericó
  rationale: A preposição ἀπό indica movimento para longe de um lugar; em português, “sair de Jericó” expressa isso de modo idiomático.
- source_word: ἠκολούθησεν
  choice: seguiu
  rationale: O aoristo ativo de ἀκολουθέω descreve a multidão indo atrás de Jesus; “seguiu” é a equivalência direta e natural.
- source_word: αὐτῷ
  choice: o
  rationale: O pronome dativo singular retoma naturalmente Jesus. A tradução conserva a mudança do plural “eles” para o singular “o”.
- source_word: ὄχλος πολύς
  choice: uma grande multidão
  rationale: A expressão indica uma multidão numerosa; esta formulação é clara, corrente e digna em português.
theological_decisions:
- issue: Referente do pronome singular αὐτῷ após a oração participial no plural
  choice: A multidão seguiu Jesus (“o”).
  alternative: A multidão seguiu o grupo (“os”).
  rationale: O grego passa do plural αὐτῶν ao singular αὐτῷ, destacando Jesus como referente. A tradução preserva essa mudança em vez de uniformizá-la.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção mantém a ação temporal em andamento e preserva a alternância grega entre o sujeito plural e o referente singular, sem acrescentar explicações ao versículo.
