source:
  edition: SBLGNT
  text: οὐχ οὕτως ⸀ἔσται ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν μέγας γενέσθαι ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/026.yaml
  text: It shall not be so among you[a]. But whoever wants to become great among you shall be your servant,
translation:
  language: pt
  text: Não será assim entre vocês.[a] Pelo contrário, quem quiser tornar-se grande entre vocês será servo de vocês,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não é assim entre vocês.” O grego emprega um verbo no futuro (“será”), que pode indicar como as coisas não devem ser entre os seguidores de Jesus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: Não será assim entre vocês
  rationale: Mantém o futuro ἔσται e sua força normativa e prospectiva, enquanto «entre vocês» expressa naturalmente o contexto comunitário de ἐν ὑμῖν.
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: Pelo contrário, quem quiser
  rationale: «Quem quiser» comunica a condição genérica e indefinida de ὃς ἂν com o subjuntivo e preserva o sentido volitivo de θέλῃ. «Pelo contrário» torna clara a oposição enfática.
- source_word: μέγας γενέσθαι
  choice: tornar-se grande
  rationale: «Tornar-se» preserva o aspecto ingressivo de γενέσθαι, em vez de reduzi-lo ao estado de simplesmente «ser» grande.
- source_word: διάκονος
  choice: servo
  rationale: No contexto, διάκονος designa alguém que serve. «Servo» preserva a linguagem concreta de serviço sem sugerir necessariamente o ofício eclesiástico posterior de diácono.
- source_word: ὑμῶν
  choice: de vocês
  rationale: A construção «servo de vocês» expressa de modo natural a relação indicada pelo genitivo ὑμῶν.
theological_decisions:
- issue: Natureza da grandeza na comunidade dos seguidores de Jesus
  choice: Apresentar a declaração como uma inversão normativa da hierarquia dominante, preservando a linguagem concreta de serviço
  alternative: Traduzir διάκονος como o ofício eclesiástico «diácono» ou parafrasear o ensino apenas como humildade genérica
  rationale: O contexto contrasta o modo de governar dos gentios com o padrão de Jesus para os discípulos. «Servo» evita tanto institucionalizar o termo quanto enfraquecer a imagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O futuro foi preservado para manter a nuance do texto grego; «vocês» evita regionalismo excessivo e comunica claramente o plural.
