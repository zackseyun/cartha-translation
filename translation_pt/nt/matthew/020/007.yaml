lexical_decisions:
- source_word: λέγουσιν
  choice: Eles lhe responderam
  rationale: O presente histórico grego é vertido pelo pretérito para manter a fluidez narrativa em português; “responderam” explicita naturalmente a função da fala no diálogo.
- source_word: Ὅτι
  choice: Porque
  rationale: Introduz a razão pela qual ainda estavam ali e corresponde de modo idiomático ao valor explicativo da resposta.
- source_word: οὐδεὶς
  choice: ninguém
  rationale: Equivalente português direto, claro e corrente.
- source_word: ἐμισθώσατο
  choice: nos contratou
  rationale: O verbo denota contratar alguém para trabalhar; o pretérito perfeito é natural em português e abrange o período até aquele momento.
- source_word: λέγει
  choice: Ele lhes disse
  rationale: O presente histórico é traduzido pelo pretérito para uma narração portuguesa uniforme e natural.
- source_word: Ὑπάγετε
  choice: Vão
  rationale: Imperativo plural direto e idiomático, adequado à ordem para se dirigirem ao local de trabalho.
- source_word: καὶ ὑμεῖς
  choice: vocês também
  rationale: Preserva a inclusão enfática desse grupo entre os que foram enviados anteriormente.
- source_word: ἀμπελῶνα
  choice: vinha
  rationale: Termo português tradicional, corrente e preciso para um terreno cultivado com videiras.
