  yaml_path: translation/nt/matthew/020/007.yaml
  text: They said to him[a], “Because no one has hired us.” He says to them, “You also go into the vineyard.”
translation:
  language: pt
  text: 'Disseram-lhe[a]: “Porque ninguém nos contratou.” Ele lhes disse: “Vão vocês também para a vinha.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego emprega o presente histórico tanto em “dizem” como em “diz”; em português, também seria possível traduzir: “Eles lhe dizem [...] Ele lhes diz”.'
