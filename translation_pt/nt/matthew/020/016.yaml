lexical_decisions:
- source_word: οὕτως
  choice: Assim
  rationale: Introduz naturalmente a conclusão ou o resultado da parábola e preserva a força inferencial do grego.
- source_word: ἔσονται
  choice: serão
  rationale: Traduz diretamente o futuro de εἰμί em português atual.
- source_word: οἱ ἔσχατοι
  choice: os últimos
  rationale: O adjetivo substantivado é vertido de modo direto, sem restringir a referência a valor social, ordem cronológica, recompensa ou salvação.
- source_word: πρῶτοι
  choice: primeiros
  rationale: Preserva a formulação concisa e o paralelismo antitético do dito.
- source_word: καὶ
  choice: e
  rationale: Mantém a coordenação simples do grego, sem acrescentar uma força adversativa não expressa.
- source_word: οἱ πρῶτοι
  choice: os primeiros
  rationale: Conserva a construção substantivada e o equilíbrio com «os últimos».
- source_word: ἔσχατοι
  choice: últimos
  rationale: Completa a inversão retórica e lexical em paralelo exato com a primeira oração.
theological_decisions:
- issue: Natureza da inversão declarada
  choice: Apresentar o enunciado como um provérbio conciso de inversão, sem especificar em que sentido os últimos serão primeiros.
  alternative: Interpretá-lo especificamente como inversão social, de recompensa no discipulado ou da ordem de salvação.
  rationale: O texto grego não delimita aqui a referência de «últimos» e «primeiros»; a tradução preserva sua amplitude e tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A elipse de «serão» na segunda oração reproduz com naturalidade a concisão do grego; a vírgula após «primeiros» assinala essa elipse.
