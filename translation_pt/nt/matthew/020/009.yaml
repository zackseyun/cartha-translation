  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: pt
  text: E os que chegaram por volta da décima primeira hora receberam um denário cada um.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O denário era uma moeda romana de prata, geralmente considerada o pagamento típico por um dia de trabalho de um trabalhador.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva o conectivo narrativo simples, sem acrescentar uma nuance temporal não explicitada.
- source_word: ἐλθόντες
  choice: quando chegaram
  rationale: Expressa o particípio aoristo de maneira natural em português e o vincula ao momento do pagamento.
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: os que tinham vindo por volta da décima primeira hora
  rationale: Identifica o grupo pela hora em que veio; «por volta de» preserva o valor temporal aproximativo de περὶ, sem inserir «contratados», que está apenas implícito no contexto.
- source_word: ἔλαβον
  choice: recebeu
  rationale: No contexto do pagamento de salários, «recebeu» comunica naturalmente que o dinheiro lhes foi entregue.
- source_word: ἀνὰ
  choice: cada um
  rationale: 'Torna explícito em português o sentido distributivo: um denário por pessoa.'
- source_word: δηνάριον
  choice: um denário
  rationale: Mantém o nome histórico da moeda presente no grego; seu valor aproximado é explicado em nota.
