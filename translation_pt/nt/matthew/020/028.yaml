id: MAT.20.28
reference: Matthew 20:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥσπερ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: pt
  text: assim como o Filho do Homem não veio para ser servido, mas para servir e dar a sua vida como resgate por muitos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais explicitamente, “como resgate em lugar de muitos”.
    reason: alternativa lexical que explicita a possível força substitutiva de ἀντί
lexical_decisions:
- source_word: ὥσπερ
  choice: assim como
  rationale: Introduz a comparação com o ensino anterior e preserva de modo natural a força comparativa.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a designação tradicional de Jesus e suas ressonâncias bíblicas, inclusive as de Daniel.
- source_word: οὐκ ἦλθεν
  choice: não veio
  rationale: Reproduz com clareza o aoristo indicativo sem acrescentar localização ou aspecto não expressos no grego.
- source_word: διακονηθῆναι
  choice: ser servido
  rationale: Expressa o infinitivo passivo em linguagem corrente, sem o tom eclesiástico que 'ser ministrado' poderia sugerir.
- source_word: ἀλλὰ διακονῆσαι
  choice: mas para servir
  rationale: Preserva o contraste verbal direto entre ser servido e servir.
- source_word: καὶ δοῦναι
  choice: e dar
  rationale: Coordena-se naturalmente com 'servir' e conserva o sentido simples do verbo sem explicitação interpretativa indevida.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: a sua vida
  rationale: Neste contexto, ψυχή designa a vida entregue até a morte, e não apenas uma alma imaterial.
- source_word: λύτρον
  choice: resgate
  rationale: Designa o preço dado para obter libertação; 'resgate' é conciso, corrente e preserva a metáfora redentora.
- source_word: ἀντὶ πολλῶν
  choice: por muitos
  rationale: É uma formulação portuguesa natural que mantém a representação em favor de muitos; a nuance substitutiva mais explícita de ἀντί é registrada em nota.
theological_decisions:
- issue: Força de ἀντί na declaração sobre o resgate
  choice: '''por muitos'' no texto principal'
  alternative: '''em lugar de muitos'''
  rationale: A frase apresenta a morte de Jesus em termos representativos e substitutivos. 'Por muitos' é natural e não exclui essa dimensão, enquanto a nota preserva a força mais explícita de troca ou substituição que ἀντί pode carregar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva o paralelismo 'ser servido/servir' e a designação bíblica estabelecida 'Filho do Homem'. O marcador foi colocado junto à expressão a que a nota se refere.
