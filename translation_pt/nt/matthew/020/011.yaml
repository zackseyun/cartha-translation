  text: And after receiving it[a], they began grumbling against the master of the house,
translation:
  language: pt
  text: Depois de receberem o pagamento,[a] começaram a reclamar contra o dono da propriedade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tendo recebido, reclamavam contra o dono da casa.”'
    reason: Preserva a possibilidade de não explicitar o objeto de λαβόντες, de entender o imperfeito como ação contínua e de traduzir οἰκοδεσπότης mais literalmente.
lexical_decisions:
- source_word: λαβόντες
  choice: Depois de receberem o pagamento
  rationale: O particípio aoristo indica ação anterior à do verbo principal. O objeto está implícito no grego e é explicitado como “o pagamento” a partir do contexto, para dar clareza sem restringi-lo desnecessariamente ao denário.
- source_word: δὲ
  choice: não traduzido separadamente
  rationale: Aqui δέ funciona como conectivo narrativo leve. A sequência já é expressa naturalmente em português por “Depois de”, sem necessidade de acrescentar “e” ou “mas”.
- source_word: ἐγόγγυζον
  choice: começaram a reclamar
  rationale: O imperfeito pode retratar ação em curso ou seu início. “Começaram a reclamar” comunica naturalmente a reação que se inicia após o recebimento; “reclamar” preserva a ideia de descontentamento, embora seja menos imagético que “murmurar”.
- source_word: κατὰ
  choice: contra
  rationale: Com o genitivo, κατά expressa aqui oposição ou queixa dirigida contra alguém.
- source_word: τοῦ οἰκοδεσπότου
  choice: o dono da propriedade
  rationale: No contexto da parábola, οἰκοδεσπότης designa o responsável pela casa e pela propriedade. Esta formulação é corrente e adequada ao cenário agrícola, sem o tom arcaico de “senhor da casa” ou “chefe de família”.
