review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a pergunta, os dois filhos, as posições à direita e à esquerda e o Reino. Contudo, “Ordena” torna mais forte o imperativo εἰπέ, que é simplesmente “dize/diga”; o contexto pode implicar que a declaração tenha efeito, mas isso não deve ser incorporado ao verbo traduzido. “Ele lhe perguntou” também explicita uma nuance interrogativa que o grego comunica pela pergunta, enquanto o verbo é “disse”.
  naturalness: O texto é claro e fluente. “Diga que” é moderno e natural em português brasileiro e internacional, e permite conservar a formulação menos especificada do grego. A repetição de “lhe disse” é aceitável na narrativa e mais próxima do original.
  terminology: “Reino” corresponde bem a βασιλεία e a nota preserva, sem decidir, os sentidos possíveis de “reinado” e “governo real”. “À sua direita/esquerda” mantém o paralelismo espacial e honorífico.
  issues:
  - severity: medium
    issue: “Ordena” traduz εἰπέ de modo excessivamente forte.
    rationale: λέγω significa primariamente “dizer”. Embora a solicitação espere que a palavra de Jesus determine o arranjo, “ordenar” interpreta essa força pragmática e reduz a abertura do original.
  - severity: low
    issue: “Ele lhe perguntou” substitui o verbo narrativo “disse”.
    rationale: A pergunta é inequívoca no discurso direto, mas o grego introduz a fala com εἶπεν, “disse”. A revisão conserva ambos os níveis.
  revised_text: 'Ele lhe disse: “O que você quer?” Ela lhe disse: “Diga que estes meus dois filhos se sentem, um à sua direita e um à sua esquerda, em seu Reino.”[a]'
  revised_footnotes:
