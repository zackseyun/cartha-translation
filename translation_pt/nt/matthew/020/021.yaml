revisions:
- from: 'Ele lhe perguntou: “O que você quer?” Ela respondeu: “Ordena que estes meus dois filhos se sentem no teu Reino, um à tua direita e o outro à tua esquerda.”[a][b]'
  to: 'Ele lhe disse: “O que você quer?” Ela lhe disse: “Diga que estes meus dois filhos se sentem, um à sua direita e um à sua esquerda, em seu Reino.”[a]'
  rationale: A revisão substitui “Ordena” por “Diga”, evitando atribuir ao simples εἰπέ uma força imperativa que o texto não expressa lexicalmente. Também traduz εἶπεν como “lhe disse”. A nota anterior sobre “Literalmente, ‘Dize que’” deixa de ser necessária, pois a tradução adotada já reproduz esse valor verbal; a nota sobre “Reino” é mantida e corretamente ancorada.
