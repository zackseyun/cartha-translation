  text: ὁ δὲ εἶπεν αὐτῇ· Τί θέλεις; λέγει αὐτῷ· Εἰπὲ ἵνα καθίσωσιν οὗτοι οἱ δύο υἱοί μου εἷς ἐκ δεξιῶν ⸀σου καὶ εἷς ἐξ εὐωνύμων σου ἐν τῇ βασιλείᾳ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: pt
  text: 'Ele lhe disse: “O que você quer?” Ela lhe disse: “Diga que estes meus dois filhos se sentem, um à sua direita e um à sua esquerda, em seu Reino.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Reino” também pode ser entendido como “reinado” ou “governo real”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλεις
  choice: O que você quer?
  rationale: Expressa de modo direto e natural a pergunta sobre o pedido que ela deseja fazer.
- source_word: Εἰπὲ
  choice: Ordena
  rationale: Embora o verbo signifique literalmente “dize”, neste contexto o pronunciamento solicitado teria força de determinação; “ordena” produz em português uma construção natural com a oração seguinte. A alternativa literal é registrada em nota.
- source_word: ἵνα καθίσωσιν
  choice: que ... se sentem
  rationale: A oração com ἵνα apresenta o conteúdo do pedido; o presente do subjuntivo português é natural depois do imperativo “ordena”.
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: estes meus dois filhos
  rationale: Mantém tanto o demonstrativo οὗτοι quanto a referência pessoal μου em uma formulação portuguesa clara e enfática.
- source_word: εἷς ἐκ δεξιῶν σου καὶ εἷς ἐξ εὐωνύμων σου
  choice: um à tua direita e o outro à tua esquerda
  rationale: Traduz idiomaticamente as posições laterais e explicita “o outro” para formar um paralelo natural em português, sem alterar o sentido.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: no teu Reino
  rationale: “Reino” é a tradução corrente e natural de βασιλεία neste contexto régio, sem excluir o sentido de reinado ou governo real.
theological_decisions:
- issue: Natureza dos lugares solicitados em relação à realeza de Jesus
  choice: Traduzir como lugares à direita e à esquerda “no teu Reino”, sem definir a fase ou natureza desse Reino.
  alternative: Interpretar explicitamente como reino messiânico terreno ou como Reino celestial consumado.
  rationale: O grego apresenta posições de honra no Reino de Jesus, mas não determina aqui um esquema escatológico específico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Emprega “você” na fala de Jesus e “teu” na resposta da mulher, formas correntes no português brasileiro; conserva a linguagem régia sem arcaísmo excessivo.
