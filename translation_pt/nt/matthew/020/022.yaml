  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ μέλλω ⸀πίνειν; λέγουσιν αὐτῷ· Δυνάμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: pt
  text: 'Jesus, porém, respondeu: “Vocês não sabem o que estão pedindo. Podem beber o cálice que eu estou prestes a beber?” Eles lhe disseram: “Podemos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Jesus, porém, respondeu
  rationale: Representa a fórmula narrativa de modo natural em português. “Porém” comunica o leve contraste de δέ; “respondeu” abrange adequadamente o idiomatismo grego que literalmente combina “respondendo” e “disse”, sem produzir a formulação pesada “respondeu e disse”.
- source_word: Οὐκ οἴδατε
  choice: Vocês não sabem
  rationale: Mantém o sentido primário de οἶδα, sem substituí-lo pela interpretação mais específica “não entendem”.
- source_word: τί αἰτεῖσθε
  choice: o que estão pedindo
  rationale: Expressa com naturalidade a ação presente de solicitar algo e preserva o objeto indefinido da pergunta.
- source_word: δύνασθε
  choice: Podem
  rationale: Em português corrente, “podem” expressa capacidade de forma direta e solene o bastante no contexto; evita a construção menos idiomática “são capazes de”.
- source_word: πιεῖν τὸ ποτήριον
  choice: beber o cálice
  rationale: Tradução direta que conserva a metáfora bíblica do cálice, sem explicá-la no corpo do texto como sofrimento ou morte.
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: que eu estou prestes a beber
  rationale: “Estou prestes a” preserva a orientação futura e a proximidade sugerida por μέλλω com infinitivo.
- source_word: λέγουσιν αὐτῷ
  choice: Eles lhe disseram
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma narrativa natural em português; “lhe” representa αὐτῷ.
- source_word: Δυνάμεθα
  choice: Podemos
  rationale: Repete o verbo empregado na pergunta e preserva a afirmação concisa de capacidade.
theological_decisions:
- issue: Força metafórica de τὸ ποτήριον (“o cálice”)
  choice: Manter “o cálice” no texto principal sem explicá-lo.
  alternative: “o sofrimento pelo qual estou prestes a passar” ou “o cálice de sofrimento que estou prestes a beber”
  rationale: A imagem é teologicamente significativa e, no contexto narrativo, aponta para o destino e sofrimento iminentes de Jesus sem ser reduzida a uma única explicação. A tradução conserva essa abertura e tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa, evitando tanto regionalismo excessivo quanto ambiguidade. A metáfora “cálice” é suficientemente reconhecível no registro bíblico e foi mantida sem nota, pois nenhuma alternativa textual ou informação indispensável exige marcador.
