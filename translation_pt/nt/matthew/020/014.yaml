  text: ἆρον τὸ σὸν καὶ ὕπαγε· θέλω δὲ τούτῳ τῷ ἐσχάτῳ δοῦναι ὡς καὶ σοί·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: pt
  text: Tome o que é seu e vá. Mas quero dar a este último tanto quanto a você.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἆρον
  choice: Tome
  rationale: O imperativo de αἴρω, neste contexto, ordena ao trabalhador que tome aquilo que lhe pertence. “Tome” é direto e natural, sem acrescentar a ideia mais específica de receber pagamento.
- source_word: τὸ σὸν
  choice: o que é seu
  rationale: A expressão substantivada significa literalmente aquilo que pertence à pessoa. “O que é seu” preserva essa amplitude; “seu pagamento” seria possível pelo contexto, mas mais específico que o grego.
- source_word: ὕπαγε
  choice: vá embora
  rationale: O imperativo funciona aqui como despedida. “Vá embora” comunica isso claramente em português, sem necessariamente atribuir hostilidade ao tom.
- source_word: θέλω δὲ
  choice: Mas quero
  rationale: θέλω expressa vontade ou intenção, e δέ introduz contraste moderado com a exigência anterior do trabalhador.
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: a este último
  rationale: A expressão identifica o trabalhador que ficou por último. Em português, “este último” é pessoal e natural no contexto, sem precisar acrescentar “homem” ao texto principal.
- source_word: δοῦναι
  choice: dar
  rationale: O infinitivo de δίδωμι significa “dar”. Embora o contexto envolva pagamento, “dar” conserva a formulação do grego e destaca a liberdade do proprietário.
- source_word: ὡς καὶ σοί
  choice: o mesmo que dei a você
  rationale: A comparação indica que o último receberá quantia igual à dada ao interlocutor. A repetição de “dei” torna explícito, em português natural, o verbo subentendido na expressão grega.
theological_decisions:
- issue: Forma de indicar o trabalhador masculino mencionado por τούτῳ τῷ ἐσχάτῳ
  choice: este último
  alternative: este último homem
  rationale: As formas gregas são masculinas e se referem a um trabalhador individual, mas o português permite que “este último” mantenha essa referência pessoal e masculina pelo contexto, sem acrescentar um substantivo ausente do original.
- issue: Explicitação da igualdade em ὡς καὶ σοί
  choice: o mesmo que dei a você
  alternative: tanto quanto a você
  rationale: A construção grega comunica tratamento igual. A tradução explicita apenas a elipse verbal necessária para fluência, sem definir a quantia nem transformar a generosidade do proprietário em uma afirmação doutrinária mais ampla.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vá embora” reproduz a força de despedida do imperativo sem tornar o tom desnecessariamente agressivo; “você” mantém a fala direta em registro corrente.
