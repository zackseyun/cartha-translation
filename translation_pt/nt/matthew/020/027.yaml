  text: καὶ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν εἶναι πρῶτος ⸀ἔσται ὑμῶν δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/027.yaml
  text: And whoever wants to be first among you will be your slave[a].
translation:
  language: pt
  text: E quem quiser ser o primeiro entre vocês será escravo de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”. A palavra grega é doulos, termo mais forte que o empregado no versículo anterior e que muitas vezes designa um escravo ou alguém em condição de servidão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: quem quiser
  rationale: A construção indefinida com ἄν e o subjuntivo é expressa naturalmente por “quem quiser”, preservando tanto a generalidade quanto o sentido volitivo.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: No contexto de posição social dentro da comunidade, “entre vocês” comunica de modo idiomático a relação interna ao grupo.
- source_word: εἶναι πρῶτος
  choice: ser o primeiro
  rationale: Tradução direta e natural da aspiração à posição de maior destaque.
- source_word: ἔσται
  choice: será
  rationale: Preserva formalmente o futuro indicativo, deixando que o contexto transmita sua força normativa, sem convertê-lo explicitamente em “deverá ser”.
- source_word: ὑμῶν
  choice: de vocês
  rationale: 'Mantém a relação genitiva: aquele que busca o primeiro lugar se coloca como escravo dos demais.'
- source_word: δοῦλος
  choice: escravo
  rationale: É mais forte que διάκονος no versículo anterior e preserva a intensificação retórica e a condição de sujeição evocada pelo termo grego.
theological_decisions:
- issue: Tradução de δοῦλος numa declaração sobre o discipulado
  choice: escravo
  alternative: servo
  rationale: “Escravo” preserva a radical inversão de posição e a intensificação em relação ao termo de serviço usado no versículo anterior. A alternativa “servo” é possível, mas pode atenuar a força social e retórica do grego.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural sobretudo no Brasil e ampla compreensão internacional. “Vocês” evita regionalismos marcados; a construção mantém a concisão e o paralelismo do original.
