source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὗτοι οἱ ἔσχατοι μίαν ὥραν ἐποίησαν, καὶ ἴσους ⸂αὐτοὺς ἡμῖν⸃ ἐποίησας τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας καὶ τὸν καύσωνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: pt
  text: 'dizendo: “Estes últimos trabalharam uma hora, e você os tornou iguais a nós[a], que suportamos o peso do dia e o calor escaldante.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os tratou como iguais a nós”.'
    reason: Alternativa lexical para ἴσους ... ἐποίησας que explicita o sentido de tratamento sem alterar a alegação dos trabalhadores.
lexical_decisions:
- source_word: λέγοντες
  choice: dizendo
  rationale: O particípio presente plural se liga à oração narrativa anterior; “dizendo” preserva esse fluxo sintático de modo natural em português.
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: Estes últimos
  rationale: Refere-se aos trabalhadores contratados por último e mantém de forma concisa o contraste do grego.
- source_word: μίαν ὥραν ἐποίησαν
  choice: trabalharam uma hora
  rationale: Com uma expressão de tempo, ποιέω tem aqui o sentido idiomático de trabalhar ou passar esse período trabalhando.
- source_word: ἴσους αὐτοὺς ἡμῖν ἐποίησας
  choice: o senhor os igualou a nós
  rationale: Expressa diretamente que o proprietário os colocou em condição igual à dos demais; “o senhor” é uma forma natural e respeitosa de tratamento no contexto brasileiro.
- source_word: τοῖς βαστάσασι
  choice: que suportamos
  rationale: βαστάζω pode significar carregar ou suportar; neste contexto laboral, “suportamos” comunica tanto o esforço quanto a resistência exigida.
- source_word: τὸ βάρος τῆς ἡμέρας
  choice: o peso do dia
  rationale: Preserva a imagem concreta de βάρος e sugere a carga de uma jornada inteira de trabalho.
- source_word: τὸν καύσωνα
  choice: o calor escaldante
  rationale: καύσων designa calor intenso e opressivo; “calor escaldante” transmite adequadamente essa força.
theological_decisions:
- issue: Queixa parabólica sobre igualdade e justiça
  choice: Apresentar diretamente o protesto dos trabalhadores, sem explicar se o tratamento foi justo ou injusto.
  alternative: Empregar uma formulação interpretativa que acuse explicitamente o proprietário de injustiça.
  rationale: O versículo relata a percepção dos trabalhadores dentro da parábola; a tradução deve conservar a força e a tensão da queixa sem antecipar sua interpretação teológica.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, com vocabulário amplamente compreensível. A forma de tratamento “o senhor” evita tanto o coloquialismo de “você” quanto a marca arcaizante de “tu ... igualaste”.
