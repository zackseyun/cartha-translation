id: MAT.20.19
reference: Matthew 20:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι, καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
translation:
  language: pt
  text: e o entregarão aos gentios para que zombem dele, o açoitem e o crucifiquem; e, no terceiro dia, ele será ressuscitado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ele ressuscitará». O verbo grego está na voz passiva («será ressuscitado»), expressão comum para a ressurreição que pode sugerir a ação de Deus.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  choice: entregarão
  rationale: Expressa de modo natural a transferência de Jesus ao poder de autoridades hostis, sem acrescentar a ideia mais específica de traição.
- source_word: τοῖς ἔθνεσιν
  choice: aos gentios
  rationale: Neste contexto judaico da predição da paixão, refere-se aos não judeus, especialmente às autoridades romanas, e não às nações em geral.
- source_word: εἰς τὸ ἐμπαῖξαι
  choice: para que zombem dele
  rationale: A construção indica propósito ou resultado; a oração com «para que» é corrente em português e explicita naturalmente o objeto compartilhado.
- source_word: μαστιγῶσαι
  choice: o açoitem
  rationale: «Açoitar» comunica com precisão o castigo corporal judicial, mantendo um registro digno e amplamente compreensível.
- source_word: σταυρῶσαι
  choice: o crucifiquem
  rationale: Traduz diretamente o verbo grego e retoma de forma natural, em português, o objeto da série de ações.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: no terceiro dia
  rationale: É a forma temporal idiomática e tradicionalmente reconhecível em português.
- source_word: ἐγερθήσεται
  choice: ele será ressuscitado
  rationale: Preserva a voz passiva futura do grego e sua possível nuance de ação divina, sem excluir outras afirmações bíblicas sobre a agência de Cristo.
theological_decisions:
- issue: Voz do verbo da ressurreição
  choice: ele será ressuscitado
  alternative: ele ressuscitará
  rationale: A forma grega é passiva. A tradução passiva mantém a formulação e a tensão teológica do texto, podendo sugerir a ação de Deus sem definir de modo exclusivo a agência envolvida.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sequência «zombem dele, o açoitem e o crucifiquem» evita rigidez sintática e mantém as três ações coordenadas. «Gentios» conserva o referente histórico-religioso específico do contexto.
