  text: καὶ ἐξελθὼν περὶ τρίτην ὥραν εἶδεν ἄλλους ἑστῶτας ἐν τῇ ἀγορᾷ ἀργούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
translation:
  language: pt
  text: Saindo por volta da terceira hora[a], viu outros que estavam em pé, ociosos[b], na praça do mercado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por volta das nove da manhã”. A expressão “terceira hora” segue a contagem judaica das horas do dia a partir do nascer do sol.
    reason: cultural_note
  - marker: b
    text: Ou “sem trabalho”. O termo grego indica que eles estavam ociosos, isto é, não estavam trabalhando.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Saindo
  rationale: O particípio aoristo indica uma ação que acompanha e antecede naturalmente o ato de ver; a forma portuguesa é fluente sem tornar excessivamente explícita a sequência.
- source_word: περὶ τρίτην ὥραν
  choice: por volta da terceira hora
  rationale: Preserva no texto principal a forma antiga de contar as horas e traduz περί como aproximação.
- source_word: εἶδεν
  choice: viu
  rationale: Equivalente narrativo simples e direto do aoristo de ὁράω.
- source_word: ἄλλους
  choice: outros
  rationale: O adjetivo substantivado não explicita 'homens'; a tradução evita acrescentar essa informação.
- source_word: ἑστῶτας
  choice: que estavam
  rationale: Em conjunto com 'desocupados', exprime de modo natural o estado indicado pelo particípio perfeito, sem exigir a reprodução rígida de 'em pé'.
- source_word: ἀγορᾷ
  choice: praça do mercado
  rationale: Designa o espaço público de comércio e encontro onde trabalhadores aguardavam contratação; a expressão é clara em português internacional.
- source_word: ἀργούς
  choice: desocupados
  rationale: Transmite que não estavam trabalhando naquele momento, sem importar necessariamente a categoria econômica moderna de desemprego.
theological_decisions: []
