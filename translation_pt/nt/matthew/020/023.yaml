source:
  edition: SBLGNT
  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: pt
  text: 'Ele lhes disse: “De fato, vocês beberão o meu cálice[a], mas sentar-se à minha direita e à minha esquerda não cabe a mim conceder; é para aqueles para quem isso foi preparado por meu Pai.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “cálice” representa aqui o sofrimento ou o destino designado a Jesus, do qual seus discípulos também participariam.
    reason: metaphor_explanation
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Ele lhes disse
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, mais natural na narrativa em português, sem alterar o sentido.
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: De fato, vocês beberão o meu cálice
  rationale: Mantém a imagem do cálice sem interpretá-la no corpo do texto. “De fato” expressa a afirmação enfática e prepara o contraste marcado por μὲν... δὲ.
- source_word: καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: sentar-se à minha direita e à minha esquerda
  rationale: Expressão natural em português para os lugares de honra ao lado de Jesus, preservando as duas posições mencionadas no grego.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: não cabe a mim conceder
  rationale: “Conceder” é idiomático para a atribuição de lugares de honra; “não cabe a mim” reproduz diretamente a delimitação expressa no texto, sem acrescentar explicações doutrinárias.
- source_word: ἀλλ’ οἷς ἡτοίμασται
  choice: e sim àqueles para quem isso foi preparado
  rationale: Explicita apenas o mínimo exigido pela elipse grega. O perfeito passivo é preservado por “foi preparado”, indicando uma preparação já realizada.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: por meu Pai
  rationale: Tradução direta do agente da voz passiva, sem acrescentar “somente”, palavra que não aparece no grego.
theological_decisions:
- issue: Implicação cristológica de Jesus afirmar que os lugares não cabem a ele conceder
  choice: Preservar a afirmação de modo direto, sem qualificações explicativas.
  alternative: Acrescentar algo como “independentemente do Pai” ou parafrasear a frase para harmonizá-la teologicamente.
  rationale: O texto distingue a concessão dos lugares dentro do propósito do Pai. A tradução mantém a tensão teológica do original, sem diminuir nem explicar a autoridade de Jesus por meio de palavras ausentes.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa e conserva a metáfora central do original.
