  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τότε προσῆλθεν αὐτῷ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου μετὰ τῶν υἱῶν αὐτῆς προσκυνοῦσα καὶ αἰτοῦσά τι ⸀παρ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
translation:
  language: pt
  text: Então a mãe dos filhos de Zebedeu aproximou-se dele com seus filhos e, curvando-se diante dele[a], pediu-lhe algo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “adorando-o”; o verbo grego pode significar curvar-se com reverência, prestar homenagem ou adorar, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Conector temporal natural que introduz o acontecimento seguinte na sequência narrativa.
- source_word: προσῆλθεν αὐτῷ
  choice: aproximou-se dele
  rationale: Expressa com clareza o movimento em direção a Jesus e corresponde diretamente ao sentido de προσέρχομαι com o dativo.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: a mãe dos filhos de Zebedeu
  rationale: Mantém de modo transparente a construção genitiva e a identificação relacional da mulher.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: com seus filhos
  rationale: μετά com o genitivo indica acompanhamento; a formulação é concisa e natural em português.
- source_word: προσκυνοῦσα
  choice: curvando-se diante dele
  rationale: Preserva o gesto físico e reverencial sem impor exclusivamente o sentido teológico mais forte de adoração.
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: e pediu-lhe algo
  rationale: Comunica naturalmente o pedido dirigido a Jesus; o pretérito finito evita uma sequência pesada de gerúndios sem alterar a relação circunstancial dos particípios gregos.
theological_decisions:
- issue: Sentido de προσκυνοῦσα em relação a Jesus
  choice: curvando-se diante dele
  alternative: adorando-o; prestando-lhe homenagem
  rationale: προσκυνέω pode indicar prostração reverente, homenagem ou adoração. O texto principal conserva o sentido físico-reverencial mais amplo, e a nota registra a possibilidade de adoração, preservando a ambiguidade teológica do termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi levemente naturalizada, sem perder o conteúdo nem a ambiguidade do grego.
