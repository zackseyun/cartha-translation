source:
  edition: SBLGNT
  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: pt
  text: Depois de combinar com os trabalhadores o pagamento de um denário pelo dia[a], ele os enviou para a sua vinha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um denário era o salário diário comum de um trabalhador.
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: Depois de combinar
  rationale: O particípio aoristo indica uma ação anterior ao verbo principal. A formulação é natural em português e comunica que o valor foi acertado entre as partes.
- source_word: δὲ
  choice: —
  rationale: Aqui, δέ funciona como conectivo narrativo leve; não precisa ser expresso separadamente, pois a oração inicial já estabelece uma ligação natural com o contexto.
- source_word: ἐργατῶν
  choice: trabalhadores
  rationale: Termo atual, claro e apropriado ao contexto de contratação para trabalho na vinha.
- source_word: ἐκ δηναρίου
  choice: o pagamento de um denário
  rationale: A expressão indica o valor salarial acordado. A explicitação de 'pagamento' torna a relação idiomática clara sem substituir a moeda antiga por um equivalente moderno.
- source_word: τὴν ἡμέραν
  choice: pelo dia
  rationale: Expressa a duração a que se aplicava o salário, sem acrescentar que se tratava necessariamente do dia inteiro além do que o grego afirma.
- source_word: ἀπέστειλεν
  choice: ele os enviou
  rationale: Tradução direta e natural do verbo narrativo, com o objeto pronominal preservado.
- source_word: ἀμπελῶνα
  choice: vinha
  rationale: Equivalente português comum e preciso para uma plantação de uvas.
- source_word: αὐτοῦ
  choice: sua
  rationale: Preserva a indicação de que a vinha pertencia ao proprietário mencionado no contexto.
