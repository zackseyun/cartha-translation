  text: οἱ δὲ ἀπῆλθον. ⸀πάλιν ἐξελθὼν περὶ ἕκτην καὶ ἐνάτην ὥραν ἐποίησεν ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/005.yaml
  text: So they went away. Going out again about the sixth and ninth hour[a], he did likewise.
translation:
  language: pt
  text: Eles foram embora. Ele saiu novamente por volta da sexta e da nona hora[a] e fez o mesmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, por volta do meio-dia e das três da tarde, segundo a contagem judaica das horas.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: E eles foram
  rationale: οἱ retoma os trabalhadores anteriormente mencionados; δέ é uma ligação narrativa leve, e ἀπῆλθον indica que eles foram embora. A formulação é direta e natural no contexto.
- source_word: πάλιν
  choice: novamente
  rationale: Expressa de modo claro a repetição da ação.
- source_word: ἐξελθὼν
  choice: Saindo
  rationale: Preserva a construção participial e sua relação temporal com o verbo principal sem especificá-la em excesso.
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: por volta da sexta e da nona hora
  rationale: Mantém a forma cultural antiga de contar as horas; 'por volta de' traduz περὶ, e a equivalência moderna é explicada em nota.
- source_word: ἐποίησεν ὡσαύτως
  choice: ele fez o mesmo
  rationale: Transmite de forma natural e concisa que ele repetiu a ação anterior, preservando a força comparativa de ὡσαύτως.
