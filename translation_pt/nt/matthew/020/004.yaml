  text: καὶ ἐκείνοις εἶπεν· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ἀμπελῶνα, καὶ ὃ ἐὰν ᾖ δίκαιον δώσω ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: pt
  text: 'E disse a eles: “Vão também vocês para a vinha, e eu lhes darei o que for justo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνοις
  choice: a eles
  rationale: O demonstrativo no dativo plural retoma os outros trabalhadores mencionados no contexto; a forma pronominal é clara e natural em português.
- source_word: εἶπεν
  choice: disse
  rationale: Equivalente narrativo comum de λέγω, adequado para introduzir discurso direto sem acrescentar força não expressa no grego.
- source_word: Ὑπάγετε
  choice: Vão
  rationale: O imperativo plural funciona aqui como ordem direta para que se dirijam à vinha; “Vão” é natural e fiel.
- source_word: καὶ ὑμεῖς
  choice: também vocês
  rationale: 'Preserva a inclusão e a ênfase do pronome expresso: esses trabalhadores também são enviados, assim como os anteriores.'
- source_word: ἀμπελῶνα
  choice: vinha
  rationale: Equivalente português corrente de ἀμπελών e termo tradicionalmente claro para a plantação de uvas no cenário da parábola.
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: o que for justo
  rationale: Reproduz naturalmente a construção relativa indefinida e preserva o sentido ético de δίκαιον sem reduzi-lo a mera percepção subjetiva de equidade.
- source_word: δώσω ὑμῖν
  choice: eu lhes darei
  rationale: Mantém o sentido básico de δίδωμι, “dar”, embora o contexto envolva remuneração; evita substituir o verbo por “pagar”, que seria contextual, mas menos formalmente correspondente.
theological_decisions:
- issue: Tradução de δίκαιον no contexto da remuneração dos trabalhadores
  choice: justo
  alternative: certo; adequado; equitativo
  rationale: “Justo” conserva a dimensão moral e objetiva do termo grego e funciona naturalmente no contexto de remuneração, sem resolver além do texto como essa justiça será concretizada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação “também vocês” conserva a ênfase do grego; “eu lhes darei” mantém explicitamente o sujeito da promessa e evita o regionalismo de “vos darei”.
