  text: πάντα δὲ ταῦτα ἀρχὴ ὠδίνων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/008.yaml
  text: But all these things are the beginning of birth pains[a].
translation:
  language: pt
  text: Mas todas essas coisas são o princípio das dores de parto[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dores do trabalho de parto”. O grego evoca as dores do parto como metáfora para o estágio inicial da aflição que virá.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: todas
  rationale: Em conjunto com ταῦτα, forma “todas essas coisas”, retomando a totalidade dos acontecimentos mencionados anteriormente.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma leve contraposição ou transição entre os acontecimentos anteriores e a avaliação de Jesus; “mas” expressa naturalmente essa mudança discursiva.
- source_word: ταῦτα
  choice: essas coisas
  rationale: O demonstrativo retoma os acontecimentos já mencionados. Em português, “essas coisas” explicita com naturalidade essa referência retrospectiva.
- source_word: ἀρχὴ
  choice: o princípio
  rationale: Indica a fase inicial de um processo. “O princípio” preserva o tom digno e a formulação predicativa natural, sem sugerir que os acontecimentos sejam o desfecho.
- source_word: ὠδίνων
  choice: dores de parto
  rationale: Designa as dores associadas ao parto e mantém de modo claro e corrente a metáfora de sofrimento que assinala o início de um processo.
theological_decisions:
- issue: Força metafórica de ὠδίνων
  choice: Manter a metáfora do parto como “dores de parto”.
  alternative: Traduzir de modo não metafórico como “sofrimentos” ou “aflições”.
  rationale: A metáfora apresenta os acontecimentos anteriores como o estágio inicial de um processo, e não como o próprio fim. Preservá-la mantém a tensão escatológica do texto sem impor um esquema doutrinário mais específico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Dores de parto” é uma expressão corrente e preserva a imagem concreta do original; “princípio” mantém concisão e solenidade sem soar arcaico.
