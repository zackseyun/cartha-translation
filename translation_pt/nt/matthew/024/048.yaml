source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ κακὸς δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ⸂μου ὁ κύριος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/048.yaml
  text: But if that wicked servant says in his heart[b][a], ‘My master is delaying,’
translation:
  language: pt
  text: 'Mas, se aquele servo mau[a] disser em seu coração: “Meu senhor[b] está demorando”,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “escravo mau”. A palavra grega também pode designar um escravo.'
    reason: lexical_alternative
  - marker: b
    text: No contexto doméstico da parábola, “senhor” tem o sentido de dono ou patrão da casa.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Mas, se
  rationale: A combinação introduz uma situação condicional e, com δέ, uma leve contraposição ao caso anterior. “Mas, se” é natural e preserva ambas as funções.
- source_word: εἴπῃ
  choice: disser
  rationale: O aoristo do subjuntivo depois de ἐὰν é expresso naturalmente em português pelo futuro do subjuntivo numa condição eventual.
- source_word: ὁ κακὸς δοῦλος ἐκεῖνος
  choice: aquele servo mau
  rationale: “Mau” comunica a avaliação moral de κακός; “servo” se ajusta ao papel doméstico enfatizado na parábola, enquanto “aquele” preserva a força demonstrativa de ἐκεῖνος.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: em seu coração
  rationale: Preserva a metáfora semítica e grega para pensamento interior, em linguagem bíblica ainda clara e corrente.
- source_word: Χρονίζει
  choice: está demorando
  rationale: A construção progressiva comunica a demora em curso percebida pelo servo, sem afirmar que o senhor tenha falhado em chegar no tempo devido.
- source_word: μου ὁ κύριος
  choice: Meu senhor
  rationale: “Senhor” expressa naturalmente a relação entre o servo e seu superior e também preserva a possível ressonância do referente maior da parábola, sem explicitá-la.
theological_decisions:
- issue: Sentido de κύριος no contexto doméstico da parábola
  choice: senhor
  alternative: patrão
  rationale: “Senhor” é adequado à relação narrativa entre δοῦλος e κύριος e preserva a ressonância teológica possível no discurso sobre a vinda do Filho do Homem. “Patrão” tornaria o nível doméstico explícito demais e reduziria essa tensão.
- issue: Tradução de δοῦλος
  choice: servo
  alternative: escravo
  rationale: O contexto enfatiza a responsabilidade confiada a um integrante subordinado da casa. “Servo” comunica esse papel com naturalidade; “escravo” continua sendo uma possibilidade lexical genuína e é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a metáfora “em seu coração” e a ambiguidade produtiva de “senhor”, evitando tanto linguagem arcaica quanto uma explicação teológica inserida no texto.
