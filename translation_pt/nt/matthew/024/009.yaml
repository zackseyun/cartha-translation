id: MAT.24.9
reference: Matthew 24:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τότε παραδώσουσιν ὑμᾶς εἰς θλῖψιν καὶ ἀποκτενοῦσιν ὑμᾶς, καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων τῶν ἐθνῶν διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/009.yaml
  text: Then they will hand you over to affliction and kill you[c][b][a], and you will be hated by all the nations because of my name.
translation:
  language: pt
  text: Então, os entregarão à tribulação[a] e os matarão; e vocês serão odiados por todas as nações[b] por causa do meu nome.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à aflição” ou “à perseguição”. A palavra grega pode indicar angústia, opressão ou tribulação.
    reason: lexical_alternative
  - marker: b
    text: Ou “por todos os povos”; menos provavelmente neste contexto, “por todos os gentios”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “por causa do meu nome”; isto é, por sua lealdade a Jesus e por aquilo que o nome dele representa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca a sequência temporal no discurso de Jesus de modo conciso e natural.
- source_word: παραδώσουσιν ὑμᾶς
  choice: entregarão vocês
  rationale: Preserva a construção ativa e o sentido de entregar alguém ao poder de outros, sem acrescentar a ideia específica de traição.
- source_word: εἰς θλῖψιν
  choice: à tribulação
  rationale: Mantém tanto o sentido de aflição e opressão quanto a possível ressonância escatológica do termo neste discurso.
- source_word: ἀποκτενοῦσιν ὑμᾶς
  choice: os matarão
  rationale: Tradução direta do futuro ativo, sem acrescentar a nuance moral específica de assassinato.
- source_word: ἔσεσθε μισούμενοι
  choice: vocês serão odiados
  rationale: Expressa naturalmente em português a construção perifrástica grega de sentido passivo futuro.
- source_word: ὑπὸ πάντων τῶν ἐθνῶν
  choice: por todas as nações
  rationale: Comunica o alcance universal da hostilidade; neste contexto, 'nações' é preferível a 'gentios'.
- source_word: διὰ τὸ ὄνομά μου
  choice: por causa do meu nome
  rationale: Preserva a linguagem bíblica do 'nome' e expressa claramente a causa, sem substituir a expressão por uma interpretação.
theological_decisions:
- issue: Sentido de θλῖψις no discurso escatológico
  choice: tribulação
  alternative: aflição; perseguição; sofrimento
  rationale: “Tribulação” conserva a tensão entre sofrimento e opressão concretos e uma possível dimensão escatológica, sem impor um sistema específico dos últimos tempos.
- issue: Sentido de ἔθνη
  choice: nações
  alternative: gentios
  rationale: A expressão “todas as nações” indica mais naturalmente hostilidade de alcance universal; “gentios” introduziria um contraste étnico que o contexto não exige.
- issue: Sentido de “meu nome”
  choice: preservar a expressão literal
  alternative: por serem meus seguidores
  rationale: A formulação mantém a riqueza representativa de “nome”, que abrange a pessoa, a autoridade e aquilo que Jesus representa, sem reduzir o sentido a uma única explicação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “vocês” torna explícito o plural do grego; o ponto e vírgula organiza as duas partes coordenadas sem alterar sua relação.
