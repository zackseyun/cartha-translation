  text: Two women will be grinding at the mill[c][b][a]; one is taken and one is left.
translation:
  language: pt
  text: Duas mulheres[a] estarão moendo no moinho[b]; uma será levada, e a outra será deixada.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Duas mulheres moendo no moinho». O particípio grego está no feminino plural, indicando especificamente mulheres.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «num moinho manual» ou «com uma mó». O termo grego também pode designar mais especificamente o aparelho ou a pedra usada para moer.'
    reason: lexical_alternative
  - marker: c
    text: O grego diz simplesmente «uma é levada e uma é deixada», sem especificar aqui se ser levada significa salvação ou juízo.
    reason: alternative_reading
lexical_decisions:
- source_word: δύο ἀλήθουσαι
  choice: Duas mulheres estarão moendo
  rationale: O particípio presente ativo ἀλήθουσαι é feminino plural e não traz substantivo expresso; em português, explicitar «mulheres» transmite naturalmente essa informação gramatical. A construção progressiva apresenta a ação em curso no cenário futuro do contexto.
- source_word: ἐν τῷ μύλῳ
  choice: no moinho
  rationale: μύλος pode designar o moinho ou a pedra de moinho. «No moinho» é natural e evita especificar além do que o grego exige.
- source_word: μία παραλαμβάνεται
  choice: uma será levada
  rationale: O presente passivo é vertido com valor futuro em razão do contexto escatológico. «Será levada» preserva a concisão e não determina se a ação significa salvação ou juízo.
- source_word: καὶ μία ἀφίεται
  choice: e a outra será deixada
  rationale: Embora o grego repita μία («uma»), «a outra» expressa em português corrente a distribuição entre as duas mulheres. «E» conserva a coordenação simples de καί; «será deixada» evita as conotações adicionais de «deixada para trás» ou a força excessiva de «abandonada».
theological_decisions:
- issue: Explicitação do sujeito feminino indicado pelo particípio
  choice: Duas mulheres
  alternative: Duas estarão moendo
  rationale: A forma feminina plural ἀλήθουσαι identifica as pessoas como mulheres; explicitar isso em português conserva uma informação real do texto grego.
- issue: Sentido escatológico de «será levada» e «será deixada»
  choice: Manter as ações sem indicar se correspondem à salvação ou ao juízo
  alternative: Explicitar que uma é levada em juízo e a outra poupada, ou que uma é levada para a salvação e a outra deixada para o juízo
  rationale: O versículo afirma a separação, mas não define expressamente o destino ou o valor teológico de cada ação. A redação preserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva o paralelismo e a ambiguidade do grego sem introduzir terminologia denominacional.
