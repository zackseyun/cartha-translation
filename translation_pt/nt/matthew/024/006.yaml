id: MAT.24.6
reference: Matthew 24:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: pt
  text: E vocês ouvirão falar de guerras e de notícias de guerras.[a] Cuidado para não ficarem alarmados, pois é necessário que isso aconteça, mas ainda não é o fim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “rumores de guerras”. A expressão grega pode indicar notícias, relatos ou rumores.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μελλήσετε
  choice: ouvirão
  rationale: A construção futura com μέλλω apresenta algo esperado ou por acontecer. Em português, o futuro simples é natural e suficiente neste contexto; formas como “estarão para ouvir” sugeririam uma iminência mais forte do que o texto exige.
- source_word: ἀκούειν
  choice: ouvirão falar de
  rationale: Com guerras e notícias como objetos, “ouvir falar de” comunica naturalmente a recepção de informações, não a audição direta dos conflitos.
- source_word: πολέμους
  choice: guerras
  rationale: πόλεμος normalmente designa guerra ou conflito armado amplo, não apenas uma batalha isolada.
- source_word: ἀκοὰς πολέμων
  choice: notícias de guerras
  rationale: ἀκοή pode indicar aquilo que se ouve, uma notícia ou um relato. “Notícias” mantém a expressão ampla sem pressupor que a informação seja falsa.
- source_word: ὁρᾶτε, μὴ θροεῖσθε
  choice: Cuidado para não ficarem alarmados
  rationale: O imperativo ὁρᾶτε introduz uma advertência, e θροεῖσθε descreve perturbação ou alarme. A formulação é clara, atual e preserva a força exortativa.
- source_word: δεῖ γὰρ γενέσθαι
  choice: pois é necessário que isso aconteça
  rationale: δεῖ expressa necessidade, e γενέσθαι, neste contexto, significa acontecer. “Isso” retoma de modo natural o quadro mencionado sem especificá-lo além do grego.
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: mas ainda não é o fim
  rationale: A formulação reproduz com clareza a declaração temporal e mantém “o fim” tão amplo quanto no texto grego.
theological_decisions:
- issue: Alcance escatológico de τὸ τέλος
  choice: o fim
  alternative: a consumação; o fim definitivo
  rationale: “O fim” preserva a amplitude da expressão grega e não a prende a nenhum esquema milenarista, tribulacional ou cronológico específico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo; “Cuidado para não...” transmite a advertência de forma natural. O marcador da nota foi colocado após a frase à qual a alternativa lexical se refere.
