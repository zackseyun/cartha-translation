id: MAT.24.34
reference: Matthew 24:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα ταῦτα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: pt
  text: 'Em verdade lhes digo: esta geração certamente não passará até que todas estas coisas aconteçam.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «este povo» ou «esta raça». A palavra grega pode ser entendida de modo mais amplo, mas «geração» é a tradução mais direta aqui.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Em verdade
  rationale: Na fórmula solene ἀμὴν λέγω ὑμῖν, «Em verdade lhes digo» é natural, digna e preserva a força asseverativa.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Expressa de modo idiomático a primeira pessoa e o plural de ὑμῖν, mantendo a interpelação direta.
- source_word: ὅτι
  choice: introduzido por dois-pontos
  rationale: Em português, os dois-pontos introduzem naturalmente o conteúdo da declaração solene; traduzir ὅτι por «que» também seria possível, mas resultaria em formulação menos fluida após «Em verdade lhes digo».
- source_word: οὐ μὴ παρέλθῃ
  choice: certamente não passará
  rationale: A combinação οὐ μή com o subjuntivo aoristo forma uma negação enfática; «certamente não» conserva essa força sem recorrer a linguagem arcaica.
- source_word: ἡ γενεὰ αὕτη
  choice: esta geração
  rationale: É a correspondência lexical mais direta e preserva a tensão interpretativa do discurso escatológico.
- source_word: ἕως ἂν
  choice: até que
  rationale: Representa com clareza o limite futuro expresso pela conjunção com ἄν.
- source_word: πάντα ταῦτα
  choice: todas estas coisas
  rationale: Mantém explicitamente o neutro plural e sua referência ao conjunto de acontecimentos mencionado no discurso.
- source_word: γένηται
  choice: aconteçam
  rationale: Neste contexto, γίνομαι descreve a ocorrência dos eventos; «aconteçam» é claro e natural em português moderno.
theological_decisions:
- issue: Sentido de ἡ γενεὰ αὕτη no discurso escatológico
  choice: Traduzir lexicalmente por «esta geração», sem expansão interpretativa.
  alternative: «este povo» ou «esta raça»
  rationale: «Esta geração» é o sentido mais direto no contexto e não impõe uma estrutura escatológica específica. As possibilidades mais amplas são registradas em nota, sem resolver na tradução uma questão debatida.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A formulação é solene sem ser arcaica; «lhes digo» evita marca regional excessiva, e «certamente não passará» preserva a ênfase do grego.
