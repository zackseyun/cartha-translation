  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε ποίᾳ ⸀ἡμέρᾳ ὁ κύριος ὑμῶν ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/042.yaml
  text: Therefore stay awake[c][b][a], because you do not know on what day your Lord is coming.
translation:
  language: pt
  text: Portanto, mantenham-se vigilantes[a], porque vocês não sabem em que dia o seu Senhor vem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fiquem acordados”, “mantenham-se atentos” ou “vigiem”.
    reason: lexical_alternative
  - marker: b
    text: Ou “virá”. O grego emprega uma forma verbal no presente.
    reason: alternative_reading
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: mantenham-se vigilantes
  rationale: O imperativo presente plural pede vigilância contínua. A formulação conserva a imagem de permanecer desperto e soa natural em português contemporâneo.
- source_word: οὖν
  choice: Portanto
  rationale: Marca a conclusão decorrente do ensino anterior.
- source_word: ὅτι
  choice: porque
  rationale: Introduz diretamente a razão da ordem.
- source_word: οὐκ οἴδατε
  choice: vocês não sabem
  rationale: Reproduz sem acréscimo a negação do verbo de conhecimento e usa uma forma plural amplamente clara.
- source_word: ποίᾳ ἡμέρᾳ
  choice: em que dia
  rationale: Expressa naturalmente em português o dativo temporal e preserva a referência a um dia desconhecido.
- source_word: ὁ κύριος ὑμῶν
  choice: o seu Senhor
  rationale: Construção idiomática que conserva tanto a autoridade de κύριος quanto a relação indicada pelo possessivo plural.
- source_word: ἔρχεται
  choice: vem
  rationale: Mantém a forma presente do grego e sua vivacidade, sem convertê-la silenciosamente em futuro explícito.
theological_decisions:
- issue: Força escatológica do presente ἔρχεται
  choice: vem
  alternative: virá
  rationale: O presente português preserva a forma e a urgência do grego, ao passo que a nota registra a possível tradução futura sem impor uma cronologia mais precisa.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e inteligibilidade internacional. O plural “vocês” evita uma forma regionalmente restrita; “mantenham-se vigilantes” preserva a metáfora e o aspecto contínuo do imperativo.
