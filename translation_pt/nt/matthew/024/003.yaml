id: MAT.24.3
reference: Matthew 24:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
translation:
  language: pt
  text: 'Enquanto ele estava sentado no Monte das Oliveiras, os discípulos aproximaram-se dele em particular e disseram: “Diga-nos: quando acontecerão essas coisas, e qual será o sinal da sua vinda[a] e do fim da era[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “presença” ou “chegada”.
    reason: lexical_alternative
  - marker: b
    text: Ou “consumação da era”; tradicionalmente, “fim do mundo”.
    reason: alternative_reading
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Enquanto ele estava sentado
  rationale: O genitivo absoluto expressa uma circunstância temporal em curso; esta formulação preserva o aspecto durativo com naturalidade em português.
- source_word: ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: no monte das Oliveiras
  rationale: Emprega o nome geográfico consagrado em português e traduz adequadamente a preposição no contexto de localização.
- source_word: προσῆλθον αὐτῷ
  choice: aproximaram-se dele
  rationale: Expressa claramente o movimento em direção a Jesus e corresponde ao uso narrativo de προσέρχομαι.
- source_word: κατ’ ἰδίαν
  choice: em particular
  rationale: Locução idiomática que comunica que os discípulos falaram com Jesus à parte dos demais.
- source_word: λέγοντες· Εἰπὸν ἡμῖν
  choice: 'e disseram: “Diga-nos”'
  rationale: Mantém o verbo introdutório e verte o imperativo por uma forma natural e respeitosa no português moderno.
- source_word: πότε ταῦτα ἔσται
  choice: quando acontecerão essas coisas
  rationale: Em português, “acontecerão” comunica com naturalidade o sentido contextual de ἔσται sem perder a referência ampla a “essas coisas”.
- source_word: σημεῖον
  choice: sinal
  rationale: Equivalente corrente e preciso no contexto do discurso escatológico.
- source_word: παρουσίας
  choice: vinda
  rationale: No contexto prospectivo da pergunta, “vinda” comunica com clareza a chegada futura, embora o termo também possa significar “presença” ou “chegada”.
- source_word: συντελείας τοῦ αἰῶνος
  choice: fim da era
  rationale: Preserva a referência à conclusão de uma era, sem transformar αἰών no mundo físico nem impor uma descrição cosmológica mais forte que o grego.
theological_decisions:
- issue: Sentido de παρουσία no discurso escatológico
  choice: vinda
  alternative: presença; chegada
  rationale: “Vinda” é natural para a expectativa futura neste contexto, mas a nota conserva a amplitude lexical do termo sem definir pormenores sobre a natureza ou o momento do acontecimento.
- issue: Sentido de συντελείας τοῦ αἰῶνος
  choice: fim da era
  alternative: consumação da era; fim do mundo
  rationale: O grego se refere ao término ou à consumação de uma era. A tradução principal evita identificar diretamente αἰών com o mundo físico, enquanto a nota registra tanto uma alternativa formal quanto a formulação tradicional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase foi levemente ajustada para fluidez, sem eliminar a estrutura temporal, o caráter privado da conversa nem a coordenação entre a vinda e o fim da era.
