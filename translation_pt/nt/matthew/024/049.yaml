id: MAT.24.49
reference: Matthew 24:49
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἄρξηται τύπτειν τοὺς συνδούλους ⸂αὐτοῦ, ἐσθίῃ δὲ καὶ πίνῃ⸃ μετὰ τῶν μεθυόντων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/049.yaml
  text: and begins to beat his fellow slaves[a], and eats and drinks with drunkards[b],
translation:
  language: pt
  text: e começar a espancar os seus companheiros de escravidão[a], e a comer e beber com os que se embriagam[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus companheiros de serviço”. O grego significa literalmente pessoas que compartilham a condição de escravos sob o mesmo senhor.
    reason: alternative_reading
  - marker: b
    text: Ou “com os bêbados”. O particípio grego pode designar pessoas caracterizadas pela embriaguez.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρξηται τύπτειν
  choice: começar a espancar
  rationale: A construção com ἄρξηται e o infinitivo marca o início da ação; “espancar” comunica melhor que “bater” a violência reiterada sugerida pelo contexto.
- source_word: τοὺς συνδούλους αὐτοῦ
  choice: os seus companheiros de escravidão
  rationale: σύνδουλος designa alguém que compartilha a condição de escravo sob o mesmo senhor. A formulação preserva essa condição comum e soa mais natural em português do que “coescravos”.
- source_word: ἐσθίῃ δὲ καὶ πίνῃ
  choice: e a comer e beber
  rationale: Os presentes do subjuntivo descrevem a conduta em curso; a coordenação em português mantém o paralelismo com “começar a espancar” e não acrescenta a ideia de banquete.
- source_word: μετὰ τῶν μεθυόντων
  choice: com os que se embriagam
  rationale: O particípio presente retrata pessoas envolvidas ou caracterizadas pelo ato de embriagar-se, preservando a forma verbal sem convertê-la necessariamente em um rótulo nominal.
- source_word: δὲ
  choice: e
  rationale: Neste contexto, δέ acrescenta outra conduta, sem exigir contraste forte; “e” produz uma sequência natural.
theological_decisions:
- issue: Representação do termo da família de δοῦλος em συνδούλους
  choice: companheiros de escravidão
  alternative: companheiros de serviço
  rationale: A relação com um senhor comum faz parte da imagem parabólica. “Companheiros de escravidão” conserva a condição social explícita no grego, sem suavizá-la para simples serviço.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a continuidade sintática do versículo anterior e preserva tanto a dureza da violência quanto a condição compartilhada sob um senhor.
