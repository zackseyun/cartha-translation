id: MAT.24.5
reference: Matthew 24:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: pt
  text: 'Pois muitos virão em meu nome, dizendo: “Eu sou o Messias[a]”, e desviarão muitos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu sou o Cristo”. O título grego é ὁ χριστός.'
    reason: Registra a alternativa tradicional e a forma grega do título.
lexical_decisions:
- source_word: πολλοὶ
  choice: muitos
  rationale: Equivalente quantitativo direto e natural em português.
- source_word: γὰρ
  choice: pois
  rationale: Preserva a função explicativa da conjunção em relação à advertência anterior.
- source_word: ἐλεύσονται
  choice: virão
  rationale: Futuro idiomático de ἔρχομαι, expresso naturalmente pelo futuro simples em português.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: em meu nome
  rationale: Expressão portuguesa corrente que conserva a ideia de invocar o nome, a identidade ou a autoridade de Jesus, sem restringir a ambiguidade da locução grega.
- source_word: λέγοντες
  choice: dizendo
  rationale: Mantém o valor participial e introduz diretamente o conteúdo da alegação, sem acrescentar interpretação.
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: Eu sou o Messias
  rationale: Aqui χριστός funciona como título reivindicado por falsos pretendentes; “Messias” comunica esse sentido titular com clareza em português.
- source_word: πλανήσουσιν
  choice: desviarão
  rationale: Conserva a imagem de levar para fora do caminho e inclui, sem a limitar, a noção de engano.
- source_word: πολλοὺς
  choice: muitos
  rationale: O adjetivo substantivado é claro e natural em português, sem necessidade de acrescentar “pessoas”.
theological_decisions:
- issue: Tradução de Χριστός na alegação de falsos pretendentes
  choice: Messias
  alternative: Cristo
  rationale: O artigo e o contexto indicam um título — “o Ungido/Messias” — e não um nome próprio. “Messias” torna explícita a natureza da reivindicação, enquanto a nota registra a tradução tradicional “Cristo”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pois” mantém a ligação explicativa; “desviarão” preserva a metáfora de πλανάω. O marcador [a] aparece imediatamente após “Messias”.
