id: MAT.24.14
reference: Matthew 24:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν, καὶ τότε ἥξει τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: pt
  text: E esta boa notícia do Reino será proclamada em todo o mundo[a], como testemunho a todas as nações[b]; então virá o fim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em todo o mundo habitado”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a todos os povos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: serão proclamadas
  rationale: O futuro passivo de κηρύσσω indica anúncio público. “Serão proclamadas” conserva essa força e evita restringir o termo à pregação em contexto eclesiástico.
- source_word: εὐαγγέλιον
  choice: boas-novas
  rationale: Expressa de modo transparente o sentido básico de “notícia boa”, mantendo a relevância teológica do termo no contexto. A forma plural lexicalizada concorda naturalmente com o uso corrente em português.
- source_word: τῆς βασιλείας
  choice: do Reino
  rationale: 'Preserva a construção genitiva e sua ambiguidade natural: as boas-novas pertencem ao Reino e dizem respeito a ele. A inicial maiúscula sinaliza, no contexto de Mateus, o Reino de Deus sem acrescentar palavras ausentes do grego.'
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: em todo o mundo
  rationale: É a formulação portuguesa mais natural para a abrangência de οἰκουμένη, que designa o mundo habitado. A nota registra a alternativa formalmente mais precisa.
- source_word: εἰς μαρτύριον
  choice: como testemunho
  rationale: Conserva a força de finalidade ou resultado da expressão sem decidir se o testemunho é favorável ou contrário aos ouvintes.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: a todas as nações
  rationale: Mantém a amplitude e a ressonância bíblica de ἔθνη sem reduzi-lo tecnicamente aos gentios. “Todos os povos” permanece uma alternativa possível.
- source_word: ἥξει
  choice: virá
  rationale: Equivalente natural e direto de ἥκω neste contexto escatológico.
- source_word: τὸ τέλος
  choice: o fim
  rationale: Tradução simples e suficientemente ampla, sem importar conceitos técnicos como “consumação” ou um esquema específico dos últimos tempos.
theological_decisions:
- issue: Alcance de οἰκουμένη e ἔθνη na declaração escatológica
  choice: Usar linguagem de alcance universal — “em todo o mundo” e “a todas as nações” — sem definir uma geografia ou cronologia de cumprimento específica.
  alternative: “em todo o mundo habitado” e/ou “a todos os povos”, com maior explicitação das nuances geográfica e étnica.
  rationale: O texto relaciona a proclamação de alcance amplo com a chegada do fim, mas não especifica aqui se “mundo” deve ser delimitado ao horizonte do primeiro século nem fornece um calendário escatológico. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Boas-novas” prioriza transparência sobre o termo eclesiástico “evangelho”; “serão proclamadas” comunica anúncio público e autorizado. A pontuação mantém a progressão do grego sem tornar a frase pesada.
