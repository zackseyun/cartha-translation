  yaml_path: translation/nt/matthew/024/017.yaml
  text: Let the one on the housetop not go down to take the things out of his house,[a]
translation:
  language: pt
  text: Quem estiver no terraço[a] não desça para pegar as coisas de sua casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o teto plano e utilizável de uma casa.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: Quem estiver no terraço
  rationale: 'A expressão articular funciona como substantivo e tem sentido representativo: quem estiver sobre a casa. A formulação é natural em português e não acrescenta uma especificação de gênero desnecessária.'
- source_word: δώματος
  choice: terraço
  rationale: No contexto arquitetônico do século I, δῶμα designa o teto plano e utilizável da casa. “Terraço” comunica melhor essa realidade ao leitor moderno do que “telhado”, que pode sugerir uma cobertura inclinada.
- source_word: μὴ καταβάτω
  choice: não desça
  rationale: O imperativo negativo expressa uma ordem urgente. “Não desça” reproduz diretamente o movimento desde o terraço para o interior ou o nível inferior da casa.
- source_word: ἆραι
  choice: para tirar
  rationale: O infinitivo indica finalidade. Neste contexto, αἴρω significa pegar ou retirar objetos; “tirar” combina naturalmente com a construção “de casa”.
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: de casa o que há nela
  rationale: O neutro plural substantivado é elíptico e se refere às coisas ou aos bens que estão na casa. A tradução preserva a generalidade sem explicitar “pertences”, que seria um pouco mais interpretativo.
- source_word: οἰκίας
  choice: casa
  rationale: “Casa” mantém o sentido físico concreto exigido pelo contexto de descer do terraço para buscar objetos.
- source_word: αὐτοῦ
  choice: nela
  rationale: Em português, a referência à própria casa do sujeito fica clara pelo contexto. “Nela” evita a sequência pouco natural “sua casa”, cuja referência pode ser ambígua no português brasileiro, sem alterar o sentido representativo do grego.
theological_decisions:
- issue: Referência masculina representativa
  choice: Usar “quem” e deixar implícita a relação possessiva com a casa
  alternative: “Aquele que estiver no terraço não desça para tirar as coisas de sua casa”
  rationale: O masculino singular grego tem força representativa, não uma afirmação teológica restrita aos homens. Em português, “quem” transmite naturalmente essa generalidade, enquanto a própria casa do sujeito permanece inequívoca no contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Terraço” é usado em sentido arquitetônico antigo e esclarecido em nota; a ordem breve preserva a urgência do contexto.
