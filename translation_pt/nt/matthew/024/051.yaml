id: MAT.24.51
reference: Matthew 24:51
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/051.yaml
  text: and will cut him in two and assign his place with the hypocrites[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: pt
  text: e o cortará ao meio[a] e lhe dará a sua parte com os hipócritas[b]. Ali haverá choro e ranger de dentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “o castigará severamente”. O verbo grego significa literalmente “cortar em dois”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “porá a parte dele com os hipócritas”; isto é, lhe atribuirá a mesma sorte ou o mesmo destino.
    reason: lexical_alternative
lexical_decisions:
- source_word: διχοτομήσει
  choice: o cortará ao meio
  rationale: Preserva o sentido concreto e contundente do verbo grego, sem substituí-lo no texto principal por uma explicação metafórica.
- source_word: μέρος
  choice: a sua parte
  rationale: Reproduz diretamente a ideia de porção ou sorte atribuída, deixando em aberto se a expressão indica lugar, destino ou quinhão.
- source_word: ὑποκριτῶν
  choice: hipócritas
  rationale: É o equivalente corrente e mantém a força temática estabelecida desse termo em Mateus.
- source_word: ἐκεῖ
  choice: Ali
  rationale: Retoma de modo natural, em português, a condição ou destino junto aos hipócritas mencionado imediatamente antes.
- source_word: κλαυθμὸς
  choice: choro
  rationale: É a formulação tradicional, clara e adequada para a expressão recorrente em Mateus.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: ranger de dentes
  rationale: Expressão portuguesa consagrada que preserva a imagem vívida e a coerência com a fórmula recorrente em Mateus.
theological_decisions:
- issue: Se διχοτομήσει deve ser suavizado como fórmula figurada de punição
  choice: 'Manter no texto principal a imagem concreta: “o cortará ao meio”'
  alternative: “o castigará severamente”
  rationale: O verbo tem sentido lexical concreto, e a continuação do versículo já descreve o destino judicial. A tradução evita decidir se a imagem deve ser entendida literalmente ou como hipérbole de punição extrema.
- issue: Como expressar τὸ μέρος αὐτοῦ ... θήσει
  choice: “lhe dará a sua parte com os hipócritas”
  alternative: “lhe designará um lugar com os hipócritas”
  rationale: “Parte” acompanha mais de perto μέρος e preserva a ambiguidade entre quinhão, sorte, destino e lugar, sem impor uma interpretação espacial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a força severa do original e usa a fórmula bíblica corrente “choro e ranger de dentes”.
