  text: ἀμὴν λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/047.yaml
  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: pt
  text: Em verdade, digo a vocês que ele o encarregará de todos os seus bens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sobre tudo o que possui».'
    reason: Alternativa lexical que reproduz mais literalmente τοῖς ὑπάρχουσιν αὐτοῦ e preserva a construção com «sobre».
lexical_decisions:
- source_word: ἀμὴν
  choice: Em verdade
  rationale: Introduz uma declaração solene e autorizada; é uma formulação digna e amplamente compreensível em português.
- source_word: λέγω ὑμῖν
  choice: digo a vocês
  rationale: Preserva de modo natural a fórmula direta do grego e mantém o plural de ὑμῖν.
- source_word: ὅτι
  choice: que
  rationale: Introduz explicitamente o conteúdo da declaração, em correspondência natural com a sintaxe portuguesa.
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: de todos os seus bens
  rationale: Com o verbo escolhido, «encarregar de» expressa a autoridade e responsabilidade sobre tudo o que pertence ao senhor; «bens» é conciso e natural. A formulação mais literal é preservada em nota.
- source_word: καταστήσει
  choice: encarregará
  rationale: Neste contexto, καθίστημι indica designar alguém para uma posição de responsabilidade, não mera colocação física. «Encarregará» comunica a atribuição administrativa e combina naturalmente com «de todos os seus bens».
- source_word: αὐτόν
  choice: o
  rationale: Retoma o servo fiel e prudente do contexto anterior e preserva o masculino singular do grego.
theological_decisions:
- issue: Natureza da recompensa ou responsabilidade confiada pelo senhor
  choice: Traduzir diretamente como a atribuição de responsabilidade sobre todos os bens do senhor.
  alternative: Interpretar a nomeação especificamente como autoridade eclesial ou como recompensa celestial no fim dos tempos.
  rationale: O versículo descreve, dentro da lógica da parábola, uma promoção a uma responsabilidade mais ampla. A tradução não deve incorporar uma sistematização teológica que o próprio enunciado não explicita.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com boa legibilidade brasileira. «Em verdade» conserva a solenidade da fórmula de Jesus; «vocês» evita regionalismo excessivo e torna explícito o plural. A ordem pronominal «ele o encarregará» é natural na escrita formal contemporânea.
