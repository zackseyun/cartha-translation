source:
  edition: SBLGNT
  text: καὶ ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ μετὰ ⸀σάλπιγγος μεγάλης, καὶ ἐπισυνάξουσιν τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρων οὐρανῶν ἕως ⸀τῶν ἄκρων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
translation:
  language: pt
  text: E ele enviará os seus anjos com uma grande trombeta[a], e eles reunirão os seus escolhidos[b] dos quatro ventos[c], de uma extremidade dos céus à outra[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com uma trombeta forte” ou “com um grande toque de trombeta”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eleitos”.'
    reason: lexical_alternative
  - marker: c
    text: A expressão “os quatro ventos” indica todas as direções, até os lugares mais distantes.
    reason: cultural_note
  - marker: d
    text: 'Literalmente: “das extremidades dos céus até as extremidades deles”; a expressão significa de um extremo ao outro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: enviará
  rationale: O futuro de ἀποστέλλω indica que ele mandará seus anjos; “enviará” é natural em português e preserva a ideia de comissão sem formalidade excessiva.
- source_word: ἀγγέλους
  choice: anjos
  rationale: Neste contexto escatológico, o referente são seres celestiais, não mensageiros humanos.
- source_word: μετὰ σάλπιγγος μεγάλης
  choice: ao som de uma grande trombeta
  rationale: A expressão associa o envio ao toque da trombeta. “Grande” preserva diretamente μεγάλη e deixa em aberto se a grandeza diz respeito à intensidade sonora ou ao caráter da trombeta.
- source_word: ἐπισυνάξουσιν
  choice: reunirão
  rationale: O futuro plural tem os anjos como sujeito. “Reunirão” expressa de modo claro a ação de ajuntar em um só conjunto.
- source_word: ἐκλεκτούς
  choice: escolhidos
  rationale: “Escolhidos” comunica o sentido lexical em linguagem corrente e evita impor ao versículo uma formulação sistemático-teológica específica.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: dos quatro ventos
  rationale: Mantém a imagem bíblica e o sentido idiomático de todas as direções.
- source_word: ἀπ’ ἄκρων οὐρανῶν ἕως τῶν ἄκρων αὐτῶν
  choice: de uma extremidade dos céus à outra
  rationale: Preserva o plural οὐρανῶν e traduz naturalmente o merismo que indica toda a extensão, de um extremo ao outro.
theological_decisions:
- issue: Tradução de ἐκλεκτούς no contexto escatológico
  choice: escolhidos
  alternative: eleitos
  rationale: “Escolhidos” preserva o sentido do termo sem resolver o versículo segundo uma tradição doutrinária específica; “eleitos” permanece como alternativa lexical tradicional.
- issue: Alcance da imagem da reunião
  choice: dos quatro ventos, de uma extremidade dos céus à outra
  alternative: das quatro direções, de um extremo da terra ao outro
  rationale: A formulação conserva a imagem cósmica e abrangente do grego, sem restringi-la por meio de uma paráfrase geográfica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação mantém as imagens de “trombeta”, “quatro ventos” e “céus”, enquanto as notas registram alternativas lexicais e esclarecem os idiomas sem inseri-los como paráfrases no texto principal.
