id: MAT.24.29
reference: Matthew 24:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/029.yaml
  text: But immediately after the tribulation of those days[a], the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven[b], and the powers of the heavens will be shaken.
translation:
  language: pt
  text: Mas, imediatamente depois da tribulação daqueles dias, o sol escurecerá, a lua não dará a sua luz, as estrelas cairão do céu[a], e os poderes dos céus serão abalados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do firmamento”.
    reason: lexical_alternative
  - marker: b
    text: “Os poderes dos céus” pode referir-se a forças cósmicas, corpos celestes ou poderes celestiais; a expressão grega permanece ampla.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐθέως δὲ
  choice: Mas, imediatamente
  rationale: Preserva a forte indicação temporal de Εὐθέως e usa δὲ como transição com leve contraste, em português atual e solene.
- source_word: μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων
  choice: depois da tribulação daqueles dias
  rationale: Mantém a relação genitiva do grego e o peso escatológico de θλῖψις sem reformular desnecessariamente a expressão.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: o sol escurecerá
  rationale: É uma formulação natural em português para o futuro passivo grego; comunica o resultado sem acrescentar um agente não expresso.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: a lua não dará a sua luz
  rationale: Reproduz de modo claro e próximo a imagem de a lua não dar seu brilho.
- source_word: οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ
  choice: as estrelas cairão do céu
  rationale: Traduz diretamente o futuro e usa “céu”, que em português pode designar tanto o firmamento visível quanto a esfera celeste; a nota registra a possibilidade contextual de “firmamento”.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: os poderes dos céus
  rationale: Mantém o plural de οὐρανῶν e a amplitude semântica de δυνάμεις, evitando decidir se a expressão indica forças cósmicas, corpos celestes ou poderes celestiais.
- source_word: σαλευθήσονται
  choice: serão abalados
  rationale: Representa com naturalidade o futuro passivo e conserva a força da imagem profética.
theological_decisions:
- issue: Natureza dos sinais cósmicos no discurso apocalíptico
  choice: Manter diretamente as imagens proféticas, sem determinar se descrevem fenômenos astronômicos literais, linguagem simbólica ou ambos.
  alternative: Explicitar uma leitura exclusivamente literal ou exclusivamente simbólica.
  rationale: O texto grego não resolve essa questão; a tradução deve preservar sua tensão e amplitude interpretativa.
- issue: Referente de “os poderes dos céus”
  choice: Conservar a expressão ampla no texto e esclarecer sua possível extensão em nota.
  alternative: Traduzir especificamente como “corpos celestes”, “forças cósmicas” ou “poderes celestiais”.
  rationale: Cada alternativa restringiria uma expressão grega que admite mais de um referente no contexto apocalíptico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A cadência profética foi preservada por meio de orações coordenadas e futuros simples; evitou-se linguagem arcaica e interpretação denominacional.
