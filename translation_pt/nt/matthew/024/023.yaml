reference: Matthew 24:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε ἐάν τις ὑμῖν εἴπῃ· Ἰδοὺ ὧδε ὁ χριστός, ἤ· Ὧδε, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: pt
  text: 'Então, se alguém disser a vocês: “Vejam, aqui está o Messias!”, ou: “Aqui!”, não acreditem.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca a sequência dentro do discurso escatológico e soa natural em português atual.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: se alguém disser a vocês
  rationale: Preserva a condição e o sujeito indefinido, com formulação clara e amplamente compreensível.
- source_word: Ἰδοὺ
  choice: Vejam
  rationale: Funciona como chamado de atenção dirigido ao grupo, sem o ar arcaico de “Eis”.
- source_word: ὧδε
  choice: aqui / ali
  rationale: O termo significa literalmente “aqui”. Na segunda ocorrência, a expressão portuguesa “Ele está ali!” comunica de modo natural a indicação de outro lugar implícita no contraste discursivo, embora a repetição literal permaneça uma alternativa.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: O artigo e o contexto de identificação mostram que Χριστός funciona como título do ungido esperado, não como nome próprio.
- source_word: μὴ πιστεύσητε
  choice: não acreditem
  rationale: Preserva a proibição sem acrescentar um objeto pessoal ausente do grego; em português, o conteúdo da alegação fica naturalmente subentendido.
theological_decisions:
- issue: Tradução de ὁ χριστός
  choice: o Messias
  alternative: o Cristo
  rationale: Neste contexto, a expressão designa o título e a identidade do ungido esperado. “Messias” torna essa função titular clara, enquanto “o Cristo” é uma alternativa tradicional legítima.
- issue: Referente implícito na segunda fala
  choice: Ele está ali!
  alternative: Aqui! / Ele está aqui!
  rationale: O grego traz apenas Ὧδε, literalmente “aqui”, numa expressão elíptica. A tradução explicita o Messias como referente e usa uma indicação natural em português, sem transformar a alegação em uma afirmação teológica adicional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas plurais brasileiras (“a vocês”, “vejam”, “acreditem”). A elipse da segunda fala foi explicitada para clareza; a ambiguidade espacial do original é registrada nas decisões lexicais e teológicas.
