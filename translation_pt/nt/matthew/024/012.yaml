source:
  edition: SBLGNT
  text: καὶ διὰ τὸ πληθυνθῆναι τὴν ἀνομίαν ψυγήσεται ἡ ἀγάπη τῶν πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/012.yaml
  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: pt
  text: E, por se multiplicar a transgressão da lei[a], o amor de muitos[b] esfriará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por aumentar a iniquidade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o amor dos muitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: por se multiplicar
  rationale: A construção διά com infinitivo articular expressa causa. Em português, “por se multiplicar” preserva de modo natural a força verbal de πληθυνθῆναι e, no contexto profético, admite referência futura sem exigir uma forma perifrástica pesada.
- source_word: ἀνομίαν
  choice: transgressão da lei
  rationale: ἀνομία designa desrespeito ou violação da lei, especialmente da lei de Deus. “Transgressão da lei” comunica esse sentido com clareza em português corrente; “iniquidade” seria mais tradicional, porém menos transparente, e “maldade” seria mais ampla.
- source_word: ψυγήσεται
  choice: esfriará
  rationale: A forma futura preserva a metáfora de perda de calor afetivo. “Esfriará” é natural, digna e mais direta que “se tornará frio”.
- source_word: ἀγάπη
  choice: amor
  rationale: “Amor” é o equivalente direto e consagrado de ἀγάπη, sem definir além do texto a natureza ou o grupo envolvido.
- source_word: τῶν πολλῶν
  choice: de muitos
  rationale: “De muitos” conserva o alcance amplo e indefinido da expressão grega sem transformá-la em afirmação estatística como “da maioria”.
theological_decisions:
- issue: Alcance de “o amor de muitos”
  choice: Mantida a formulação ampla “o amor de muitos”.
  alternative: “o amor entre os que creem” ou “o amor das pessoas em geral”
  rationale: O grego não identifica explicitamente se o grupo é a humanidade, discípulos professos ou um conjunto misto. A tradução preserva essa tensão interpretativa.
- issue: Sentido de ἀνομία
  choice: “transgressão da lei”
  alternative: “maldade” ou “iniquidade”
  rationale: A escolha mantém visível a relação lexical com a lei sem especificar um código legal ou uma doutrina denominacional particular.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase acompanha o encadeamento causal do grego. “Transgressão da lei” foi preferida a “iniquidade” por transparência, e “esfriará” conserva de forma concisa a metáfora original.
