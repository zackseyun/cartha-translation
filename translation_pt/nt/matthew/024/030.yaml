reference: Matthew 24:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: pt
  text: E então aparecerá no céu[a] o sinal do Filho do Homem, e então todas as tribos da terra se lamentarão[b], e verão o Filho do Homem vindo sobre as nuvens do céu, com poder e grande glória.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no céu visível”. A palavra grega pode se referir ao céu como esfera celestial ou ao céu visível.
    reason: lexical_alternative
  - marker: b
    text: Ou “todas as tribos do país”. A palavra grega traduzida por “terra” também pode significar “país” ou “território”.
    reason: alternative_reading
  - marker: c
    text: A expressão “vindo sobre as nuvens do céu” retoma Daniel 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: aparecerá
  rationale: O futuro de φαίνω tem aqui sentido intransitivo de tornar-se visível; “aparecerá” é natural e preserva a manifestação visível.
- source_word: τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: o sinal do Filho do Homem
  rationale: '“Sinal” traduz diretamente σημεῖον, e a construção com “do” mantém a ambiguidade do genitivo: pode ser um sinal associado ao Filho do Homem ou, possivelmente, o próprio Filho do Homem como sinal.'
- source_word: ἐν τῷ οὐρανῷ
  choice: no céu
  rationale: οὐρανός pode designar o céu como esfera celeste ou o céu visível; “no céu” conserva o registro apocalíptico, e a nota registra “no firmamento” como alternativa contextual.
- source_word: κόψονται
  choice: se lamentarão
  rationale: Neste uso, o verbo se refere ao lamento de pesar. “Se lamentarão” comunica o sentido sem impor no texto principal um gesto específico, como bater no peito.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: todas as tribos da terra
  rationale: “Tribos” reflete diretamente φυλαί e conserva possíveis ecos proféticos; “terra” é o sentido mais provável no contexto cósmico, embora “país” ou “terra de Israel” permaneça possível.
- source_word: ὄψονται
  choice: verão
  rationale: Tradução direta e corrente do futuro de ὁράω.
- source_word: ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: vindo sobre as nuvens do céu
  rationale: A formulação preserva a imagem espacial e o forte eco de Daniel 7:13 sem torná-la excessivamente arcaica.
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: com poder e grande glória
  rationale: Mantém a relação gramatical mais direta, em que πολλῆς qualifica “glória”, e soa natural em português.
theological_decisions:
- issue: Sentido de “o sinal do Filho do Homem”
  choice: Mantida a formulação genitiva “o sinal do Filho do Homem”.
  alternative: “o sinal pertencente ao Filho do Homem” ou “o sinal, isto é, o próprio Filho do Homem”
  rationale: O grego não determina se o sinal pertence a ele, anuncia sua chegada ou é sua própria manifestação; a tradução não resolve essa questão escatológica debatida.
- issue: Alcance de γῆ em “todas as tribos da terra”
  choice: “terra”, com alcance potencialmente universal.
  alternative: “país” ou “terra de Israel”
  rationale: O contexto cósmico favorece “terra”, mas o possível pano de fundo profético permite uma referência mais localizada; a nota preserva essa possibilidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para soar natural em português, sem eliminar a repetição enfática de “então”. Os marcadores de nota foram posicionados junto às expressões que explicam.
