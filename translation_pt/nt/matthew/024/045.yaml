  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise slave[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: pt
  text: Quem é, pois, o escravo[a] fiel e prudente que o senhor[b] pôs à frente dos servos de sua casa, para lhes dar alimento no tempo certo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “servo”. O termo grego pode designar um escravo ou servo; “escravo” preserva aqui o sentido mais forte de alguém sujeito à autoridade de um senhor.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Senhor”. No cenário doméstico da parábola, o termo grego é entendido em primeiro plano como o senhor da casa.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τίς ἄρα
  choice: Quem é, pois
  rationale: A pergunta retórica e a força inferencial ou continuativa de ἄρα são preservadas de modo natural em português.
- source_word: πιστὸς
  choice: fiel
  rationale: Expressa confiabilidade no cumprimento da tarefa e mantém a ressonância moral do termo grego.
- source_word: δοῦλος
  choice: escravo
  rationale: Preserva o sentido forte de alguém sujeito à autoridade de um senhor; a alternativa mais branda é registrada em nota.
- source_word: φρόνιμος
  choice: prudente
  rationale: Destaca a sabedoria prática e o bom senso implicados por φρόνιμος, de maneira idiomática em português.
- source_word: κατέστησεν ... ἐπὶ
  choice: encarregou de
  rationale: Comunica com naturalidade a designação para uma posição de responsabilidade e autoridade sobre outros.
- source_word: κύριος
  choice: senhor
  rationale: No cenário doméstico da parábola, designa o senhor da casa e dos escravos; em português, a forma também preserva discretamente a possível ressonância titular.
- source_word: οἰκετείας
  choice: pessoal de sua casa
  rationale: Refere-se ao conjunto de pessoas ligadas ao serviço doméstico; esta formulação esclarece o referente plural retomado por 'lhes' sem restringi-lo indevidamente.
- source_word: τοῦ δοῦναι
  choice: para lhes dar
  rationale: A construção final com infinitivo expressa o propósito da designação.
- source_word: τροφὴν
  choice: alimento
  rationale: Traduz o sentido geral de comida ou sustento sem especificar indevidamente porções ou rações.
- source_word: ἐν καιρῷ
  choice: no tempo certo
  rationale: Preserva a ideia de ocasião apropriada, e não apenas de tempo cronológico.
theological_decisions:
- issue: Sentido de κύριος na imagem doméstica
  choice: senhor
  alternative: Senhor
  rationale: A inicial minúscula representa em primeiro plano o senhor da casa dentro da parábola, sem eliminar a possibilidade de que a figura aponte, por analogia, para o Senhor.
- issue: Força social de δοῦλος
  choice: escravo
  alternative: servo
  rationale: O termo grego indica submissão à autoridade de um proprietário ou senhor. 'Escravo' mantém essa força, enquanto a nota conserva a alternativa tradicional 'servo'.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação mantém a pergunta retórica e a metáfora social do texto-fonte. Os marcadores foram colocados junto às expressões a que suas notas se referem.
