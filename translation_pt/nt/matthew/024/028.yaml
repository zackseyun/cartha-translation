id: MAT.24.28
reference: Matthew 24:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ὅπου ἐὰν ᾖ τὸ πτῶμα, ἐκεῖ συναχθήσονται οἱ ἀετοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/028.yaml
  text: Wherever the corpse is[a], there the vultures will gather.
translation:
  language: pt
  text: Onde quer que esteja o cadáver, ali se reunirão os abutres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “águias”. A palavra grega pode designar águias, mas “abutres” se ajusta melhor à imagem de aves reunidas ao redor de um cadáver.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: Onde quer que esteja
  rationale: A combinação de ὅπου com ἐάν e o subjuntivo ᾖ tem sentido relativo indefinido. “Onde quer que esteja” preserva essa força de modo natural em português.
- source_word: πτῶμα
  choice: cadáver
  rationale: O termo designa um corpo caído ou morto. “Cadáver” é preciso, corrente e não restringe indevidamente a imagem a um animal, como poderia ocorrer com “carcaça”.
- source_word: ἐκεῖ
  choice: ali
  rationale: “Ali” retoma de maneira clara e natural o lugar indefinido introduzido por “onde quer que”.
- source_word: συναχθήσονται
  choice: se ajuntarão
  rationale: Embora a forma grega seja futuro passivo, com aves como sujeito o português reflexivo/intransitivo comunica naturalmente a ideia de congregar-se, sem sugerir necessariamente um agente externo.
- source_word: ἀετοί
  choice: abutres
  rationale: ἀετός costuma significar “águia”, mas o contexto de aves que se juntam ao redor de um cadáver favorece “abutres”. A alternativa lexical genuína é preservada em nota.
theological_decisions:
- issue: Interpretação da imagem proverbial
  choice: Traduzir diretamente a imagem, sem identificar seus referentes escatológicos.
  alternative: Entendê-la especificamente como juízo inevitável, visibilidade da vinda do Filho do Homem, destruição de Jerusalém ou alusão aos estandartes romanos.
  rationale: O texto grego não explica o que o cadáver e as aves simbolizam. A tradução preserva a imagem e sua tensão interpretativa, sem inserir uma leitura teológica específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Se ajuntarão” conserva o tom proverbial sem soar excessivamente técnico; “onde quer que esteja” expressa com clareza a indefinição do original.
