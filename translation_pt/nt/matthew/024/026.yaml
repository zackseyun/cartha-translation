id: MAT.24.26
reference: Matthew 24:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν οὖν εἴπωσιν ὑμῖν· Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: pt
  text: 'Portanto, se disserem a vocês: “Vejam, ele está no deserto”, não saiam; “Vejam, ele está nos aposentos internos[a]”, não acreditem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos depósitos” ou “nos aposentos secretos”. A palavra grega pode se referir a cômodos interiores, privados ou usados para guardar coisas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Portanto, se
  rationale: Preserva tanto a conexão inferencial de οὖν com a advertência anterior quanto a condição introduzida por ἐάν, em português natural.
- source_word: εἴπωσιν ὑμῖν
  choice: disserem a vocês
  rationale: Mantém o plural indefinido do grego e expressa de modo direto o objeto indireto ὑμῖν.
- source_word: Ἰδοὺ
  choice: Vejam
  rationale: Funciona como chamado imediato à atenção, sem o tom arcaico de “Eis”.
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: ἔρημος pode indicar deserto ou região erma; “deserto” é claro, corrente e adequado ao uso bíblico em português.
- source_word: ἐστίν
  choice: ele está
  rationale: O sujeito está implícito no grego e é recuperado do contexto; o pronome é necessário em português, sem acrescentar um título cristológico.
- source_word: μὴ ἐξέλθητε
  choice: não saiam
  rationale: Traduz diretamente a proibição e conserva a ideia de deslocar-se para fora em busca dele.
- source_word: ἐν τοῖς ταμείοις
  choice: nos aposentos internos
  rationale: Expressa os cômodos interiores ou privados indicados por ταμεῖον sem impor a ideia específica de depósito nem intensificar indevidamente o caráter secreto.
- source_word: μὴ πιστεύσητε
  choice: não acreditem
  rationale: A construção portuguesa permite deixar implícito o objeto, como no grego, referindo-se naturalmente à afirmação citada.
theological_decisions:
- issue: Referente implícito de ἐστίν
  choice: ele está
  alternative: o Messias está / ele está lá
  rationale: O contexto fornece o referente, mas o versículo não o nomeia. O pronome preserva essa implicitude e evita inserir um título ou explicação no texto.
- issue: Relação entre os dois anúncios citados
  choice: Duas citações paralelas separadas por ponto e vírgula, sem acrescentar “ou”
  alternative: Inserir “ou” antes da segunda citação
  rationale: O grego repete Ἰδού sem conjunção disjuntiva explícita. A pontuação mantém o paralelismo e a tensão sintática do original sem adicionar uma relação não marcada lexicalmente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural de tratamento “vocês” torna explícito o destinatário plural. As aspas e o ponto e vírgula preservam os dois anúncios paralelos sob a mesma condição.
