lexical_decisions:
- source_word: ἰδού
  choice: Vejam
  rationale: Interjeição que chama a atenção dos ouvintes; o plural corresponde ao grupo a quem Jesus se dirige e soa natural em português atual.
- source_word: προείρηκα
  choice: avisei de antemão
  rationale: O perfeito indica uma declaração prévia ainda relevante. “Avisei” comunica, no contexto, tanto o ato de dizer antes quanto sua função de advertência; “de antemão” preserva explicitamente o elemento temporal do prefixo προ-.
- source_word: ὑμῖν
  choice: vocês
  rationale: Equivalente plural claro e amplamente compreensível para o dativo de segunda pessoa.
