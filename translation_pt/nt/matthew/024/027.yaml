  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: pt
  text: Pois, assim como o relâmpago vem do leste e é visto até o oeste, assim será a vinda do Filho do Homem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «presença». A palavra grega παρουσία pode significar «presença» ou «chegada», mas, neste contexto, refere-se à futura vinda do Filho do Homem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Pois, assim como
  rationale: Preserva tanto o valor explicativo de γάρ quanto a comparação introduzida por ὥσπερ, em português natural.
- source_word: ἡ ἀστραπή
  choice: o relâmpago
  rationale: Designa naturalmente o fenômeno do relâmpago empregado na comparação.
- source_word: ἐξέρχεται
  choice: sai
  rationale: Mantém a ideia de sair ou proceder de um ponto de origem, sem substituir o verbo pelo mais interpretativo «aparece».
- source_word: ἀπὸ ἀνατολῶν
  choice: do leste
  rationale: No contraste direcional com δυσμῶν, ἀνατολῶν indica o leste.
- source_word: φαίνεται
  choice: é visto
  rationale: Reproduz o valor passivo e ressalta o caráter visível da comparação sem ampliar o sentido para «brilha».
- source_word: ἕως δυσμῶν
  choice: até o oeste
  rationale: Preserva a extensão marcada por ἕως e o contraste completo entre leste e oeste.
- source_word: οὕτως ἔσται
  choice: assim será
  rationale: Conserva a estrutura comparativa e o valor futuro da oração.
- source_word: παρουσία
  choice: vinda
  rationale: Neste contexto escatológico, refere-se à futura chegada ou manifestação do Filho do Homem; «vinda» é clara e tradicional, enquanto a alternativa lexical «presença» é registrada em nota.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: do Filho do Homem
  rationale: Mantém a expressão titular consagrada e sua ressonância intertextual, especialmente com Daniel 7.
theological_decisions:
- issue: Tradução de παρουσία em uma declaração escatológica
  choice: vinda
  alternative: presença; chegada
  rationale: A comparação com o relâmpago apresenta a παρουσία como um acontecimento futuro e publicamente perceptível. «Vinda» comunica esse sentido contextual sem impor um esquema escatológico específico; a possibilidade lexical «presença» permanece na nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o paralelismo da comparação grega e evita explicitação doutrinária além do contexto.
