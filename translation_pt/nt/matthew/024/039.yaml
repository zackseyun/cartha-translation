source:
  edition: SBLGNT
  text: καὶ οὐκ ἔγνωσαν ἕως ἦλθεν ὁ κατακλυσμὸς καὶ ἦρεν ἅπαντας, οὕτως ἔσται ⸀καὶ ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: pt
  text: E eles não perceberam até que veio o dilúvio e levou a todos; assim também será a vinda do Filho do Homem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: não perceberam
  rationale: No contexto, a expressão indica que não reconheceram nem se deram conta do que estava para acontecer; “não perceberam” comunica isso naturalmente sem acrescentar uma ideia ausente.
- source_word: ὁ κατακλυσμός
  choice: o dilúvio
  rationale: Equivalente tradicional, claro e preciso para a inundação do relato de Noé.
- source_word: ἦρεν ἅπαντας
  choice: levou a todos
  rationale: Preserva o sentido básico de αἴρω, que aqui descreve o dilúvio removendo todos, sem explicitar além do texto o modo ou o resultado.
- source_word: οὕτως ἔσται καὶ
  choice: assim também será
  rationale: Reproduz a comparação e mantém o valor inclusivo de καί na construção.
- source_word: ἡ παρουσία
  choice: a vinda
  rationale: Neste contexto escatológico, “vinda” é a forma portuguesa mais natural para παρουσία, conservando a referência à chegada manifesta do Filho do Homem.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: do Filho do Homem
  rationale: Mantém a designação cristológica consagrada e sua ligação com o pano de fundo bíblico.
theological_decisions:
- issue: Natureza do desconhecimento antes do dilúvio
  choice: não perceberam
  alternative: não souberam
  rationale: A tradução evita decidir se faltava informação, compreensão ou reconhecimento responsável; conserva a amplitude contextual de γινώσκω.
- issue: Sentido de ἦρεν no juízo do dilúvio
  choice: levou a todos
  alternative: varreu a todos
  rationale: “Levou” mantém a metáfora menos especificada do grego e evita importar uma formulação interpretativa mais vívida, embora “varreu” seja contextualmente possível.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem e a concisão da frase preservam o paralelismo do original.
