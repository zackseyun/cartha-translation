id: MAT.24.43
reference: Matthew 24:43
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐκεῖνο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ φυλακῇ ὁ κλέπτης ἔρχεται, ἐγρηγόρησεν ἂν καὶ οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/043.yaml
  text: 'But know this: if the master of the house had known in what watch the thief was coming[b][a], he would have stayed awake and would not have let his house be broken into.'
translation:
  language: pt
  text: 'Mas saibam disto: se o dono da casa soubesse em qual vigília da noite o ladrão viria, teria ficado acordado e não teria deixado que sua casa fosse arrombada.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “fosse escavada” ou “perfurada”, aludindo a casas antigas cuja parede ou cobertura podia ser aberta para permitir a entrada de um ladrão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: Mas saibam disto
  rationale: Preserva a mudança discursiva marcada por δέ e o apelo direto, usando uma formulação corrente e digna em português.
- source_word: ὁ οἰκοδεσπότης
  choice: o dono da casa
  rationale: Expressa naturalmente o responsável pela casa, sem a rigidez de “chefe de família” nem pressupostos jurídicos excessivos de propriedade.
- source_word: ποίᾳ φυλακῇ
  choice: em qual vigília da noite
  rationale: Mantém a referência cultural à divisão noturna em vigílias e explicita “da noite” para que o sentido temporal seja imediatamente compreensível.
- source_word: ὁ κλέπτης ἔρχεται
  choice: o ladrão viria
  rationale: No período condicional contrafactual, o futuro do pretérito é idiomático em português e comunica a vinda prevista do ladrão sem reproduzir mecanicamente o presente grego.
- source_word: ἐγρηγόρησεν ἂν
  choice: teria ficado acordado
  rationale: Conserva a imagem concreta de permanecer desperto diante de uma invasão noturna.
- source_word: οὐκ ἂν εἴασεν
  choice: não teria deixado
  rationale: É a equivalência natural e direta do verbo de permissão neste contexto.
- source_word: διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: que sua casa fosse arrombada
  rationale: Comunica de modo idiomático a entrada criminosa, enquanto a imagem literal de escavar ou perfurar a parede é preservada em nota.
theological_decisions:
- issue: Representação do οἰκοδεσπότης na ilustração
  choice: o dono da casa
  alternative: o chefe da casa
  rationale: A expressão funciona como personagem de uma comparação, não como título doutrinário. A opção escolhida é clara e natural, sem acrescentar uma interpretação teológica.
- issue: Tratamento da imagem antiga de invasão
  choice: fosse arrombada
  alternative: fosse escavada/perfurada
  rationale: A tradução principal dá o sentido contextual em português moderno, e a nota conserva o detalhe histórico e lexical da construção antiga.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O plural “saibam” reproduz a fala dirigida aos discípulos. “Vigília da noite” conserva o dado cultural no corpo do texto; “arrombada” evita uma formulação literal pouco natural, com a nuance histórica registrada em nota.
