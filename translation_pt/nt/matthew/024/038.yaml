  source_fidelity: A tradução preserva adequadamente a comparação explicativa, as atividades cotidianas sem conotação moral acrescentada, o limite temporal e a entrada de Noé na arca. Contudo, «todos» introduz uma universalidade que não está expressa no grego. A formulação «davam outros em casamento» é compreensível, mas pouco natural e acrescenta «outros»; «davam em casamento» conserva a distinção verbal e permite a elipse normal do objeto em português.
  naturalness: «Pois, assim como» e a sequência final são naturais no registro bíblico moderno. A redação revista elimina «todos» e «outros», tornando a frase mais concisa e idiomática sem perder a construção participial do original.
  terminology: «Dilúvio», «Noé» e «arca» são os termos estabelecidos e adequados. «Casavam-se» / «davam em casamento» conserva a diferenciação entre γαμοῦντες e γαμίζοντες. A nota registra de modo equilibrado a alternativa sem decidir além do que o uso permite.
  issues:
