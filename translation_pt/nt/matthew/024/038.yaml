source:
  edition: SBLGNT
  text: ⸀ὡς γὰρ ἦσαν ἐν ταῖς ⸀ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ ⸀γαμίζοντες, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/038.yaml
  text: For as in the days before the flood they were eating and drinking[a], marrying and giving in marriage, until the day Noah entered the ark,
translation:
  language: pt
  text: Pois, assim como nos dias anteriores ao dilúvio comiam e bebiam, casavam-se e davam em casamento[a], até o dia em que Noé entrou na arca,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «casavam-se e eram dados em casamento». O grego distingue γαμοῦντες de γαμίζοντες; este último pode referir-se a dar alguém em casamento ou a ser dado em casamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς γὰρ
  choice: Pois, assim como
  rationale: Preserva tanto a força explicativa de γάρ quanto o sentido comparativo de ὡς, ligando naturalmente o versículo ao contexto anterior.
- source_word: ἦσαν ... τρώγοντες καὶ πίνοντες
  choice: todos comiam e bebiam
  rationale: O imperfeito com particípios descreve atividades contínuas. O sujeito explícito «todos» torna a construção natural em português e retoma as pessoas daqueles dias sem lhes atribuir avaliação moral.
- source_word: ἐν ταῖς ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ
  choice: nos dias antes do dilúvio
  rationale: Expressa com clareza a relação temporal; «dilúvio» é o termo português consagrado no relato de Noé.
- source_word: γαμοῦντες
  choice: casavam-se
  rationale: Traduz o ato de contrair casamento de modo conciso e corrente.
- source_word: γαμίζοντες
  choice: davam outros em casamento
  rationale: Mantém a distinção lexical em relação a γαμοῦντες e comunica a ação de providenciar ou conceder alguém em casamento.
- source_word: ἄχρι ἧς ἡμέρας
  choice: até o dia em que
  rationale: Marca de maneira idiomática o ponto final das atividades contínuas.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: Noé entrou na arca
  rationale: Reproduz o acontecimento decisivo com linguagem natural e conserva «arca», termo estabelecido para κιβωτός no relato de Noé.
theological_decisions:
- issue: Se as atividades devem ser apresentadas como excessos pecaminosos ou como a continuidade da vida cotidiana antes do juízo
  choice: As atividades são descritas de forma neutra, como ações humanas comuns.
  alternative: Empregar palavras que sugiram glutonaria, embriaguez ou negligência moral.
  rationale: Os particípios gregos não contêm qualificadores morais explícitos. No contexto, a ênfase recai sobre a normalidade que prosseguia até a chegada repentina do juízo.
- issue: Sentido de γαμίζοντες
  choice: «davam outros em casamento», com nota sobre a alternativa
  alternative: «eram dados em casamento»
  rationale: A forma pode ser entendida como fazer alguém casar ou, em certos usos e tradições textuais de tradução, como ser dado em casamento. A tradução principal mantém a leitura ativa mais direta sem ocultar a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Dilúvio» e «arca» preservam a conexão reconhecível com o relato de Noé. A vírgula final foi mantida porque o versículo continua sintaticamente no versículo seguinte.
