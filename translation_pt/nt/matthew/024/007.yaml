id: MAT.24.7
reference: Matthew 24:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: pt
  text: Pois nação se levantará contra nação[a], e reino contra reino; haverá fomes e terremotos em vários lugares[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se insurgirá contra”. A expressão grega indica o surgimento de hostilidade entre povos.
    reason: lexical_alternative
  - marker: b
    text: Ou “em diferentes lugares” ou “de lugar em lugar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: se levantará
  rationale: O futuro de ἐγείρω, nesta construção, descreve o surgimento de hostilidade. A forma pronominal é natural em português e não introduz um agente que o texto não menciona.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com o contexto anterior sem tornar a relação mais causal do que o grego exige.
- source_word: ἔθνος
  choice: nação
  rationale: No paralelismo com βασιλεία, designa um povo entendido como coletividade em conflito; “nação” preserva tanto a dimensão coletiva quanto a política.
- source_word: ἐπὶ ἔθνος
  choice: contra nação
  rationale: Com o acusativo, ἐπί tem aqui sentido hostil; “contra” expressa esse valor de modo idiomático.
- source_word: βασιλεία
  choice: reino
  rationale: Refere-se a uma entidade ou domínio político, em paralelo com “nação”, e conserva o registro do discurso.
- source_word: ἔσονται
  choice: haverá
  rationale: Traduz de modo natural em português o uso existencial de εἰμί.
- source_word: λιμοὶ
  choice: fomes
  rationale: O plural indica ocorrências de grave escassez de alimento. “Fomes” preserva o número e é compreensível no registro bíblico moderno.
- source_word: σεισμοὶ
  choice: terremotos
  rationale: Neste contexto, σεισμός designa abalos sísmicos; “terremotos” é o equivalente claro e corrente.
- source_word: κατὰ τόπους
  choice: em vários lugares
  rationale: A expressão tem força distributiva e indica ocorrências em diferentes localidades, sem especificá-las.
theological_decisions:
- issue: Alcance de ἔθνος no anúncio de conflitos
  choice: nação
  alternative: povo
  rationale: O paralelismo imediato com “reino” favorece uma coletividade de dimensão social e política. A escolha evita restringir o termo a gentios ou apenas à etnia.
- issue: Força da forma futura ἐγερθήσεται
  choice: se levantará contra
  alternative: será levantada contra
  rationale: A construção descreve o começo da hostilidade, mas não identifica quem a provoca. A tradução evita transformar a forma verbal em um passivo divino explícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pois” conserva a conexão discursiva; “se levantará contra” mantém o caráter solene sem soar arcaico. O plural “fomes” segue o grego e é natural neste contexto.
