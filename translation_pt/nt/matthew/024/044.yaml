  text: διὰ τοῦτο καὶ ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ⸂οὐ δοκεῖτε ὥρᾳ⸃ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: pt
  text: Por isso, vocês também estejam preparados, porque o Filho do Homem vem numa hora em que vocês não esperam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “numa hora em que vocês não supõem”. O verbo grego pode significar “pensar”, “supor” ou, neste contexto, “esperar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Retoma a advertência anterior e expressa de modo natural em português a relação inferencial e causal.
- source_word: καὶ ὑμεῖς
  choice: vocês também
  rationale: Preserva a inclusão enfática de καί e do pronome explícito, com ampla legibilidade brasileira.
- source_word: γίνεσθε ἕτοιμοι
  choice: devem estar preparados
  rationale: Comunica a força do imperativo presente e a postura contínua de prontidão sem recorrer ao pouco natural 'tornem-se preparados'.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão da ordem de estar preparado.
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: numa hora em que vocês não esperam
  rationale: Reproduz a expressão temporal e traduz δοκεῖτε pelo sentido contextual de expectativa, preservando em nota o sentido mais literal de pensar ou supor.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém o título tradicional e formalmente próximo do grego, inclusive sua ressonância bíblica e cristológica.
- source_word: ἔρχεται
  choice: vem
  rationale: Conserva o presente vívido do grego, que neste contexto aponta para um acontecimento futuro, e soa mais natural em português do que uma forma progressiva.
theological_decisions:
- issue: Tradução do título cristológico ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  alternative: o Humano
  rationale: A formulação tradicional preserva a forma do título, sua provável ressonância em Daniel e sua profundidade teológica sem interpretá-lo por paráfrase.
- issue: Valor temporal de ἔρχεται
  choice: vem
  alternative: virá
  rationale: O presente pode ter referência futura, mas manter o presente preserva a vivacidade e a tensão do enunciado grego sem tornar explícita uma categoria verbal que o texto não usa.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por “vocês” para ampla legibilidade brasileira. “Estar preparados” mantém concordância inclusiva convencional e linguagem natural. O presente “vem” conserva a vivacidade do original.
