id: MAT.24.21
reference: Matthew 24:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔσται γὰρ τότε θλῖψις μεγάλη οἵα οὐ γέγονεν ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν οὐδ’ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: pt
  text: Pois então haverá grande tribulação[a], como nunca houve desde o princípio do mundo até agora, nem jamais haverá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grande aflição”, “grande sofrimento” ou “grande angústia”. A palavra grega pode indicar dificuldade extrema, pressão ou opressão.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ τότε
  choice: Pois então
  rationale: Preserva a função explicativa de γάρ e a referência temporal de τότε de modo natural em português.
- source_word: ἔσται
  choice: haverá
  rationale: A construção existencial portuguesa expressa com clareza a ocorrência futura cujo sujeito é θλῖψις μεγάλη.
- source_word: θλῖψις μεγάλη
  choice: grande tribulação
  rationale: “Tribulação” comunica sofrimento, aflição ou pressão intensa e preserva a ressonância escatológica do termo sem especificar uma interpretação doutrinária.
- source_word: οἵα οὐ γέγονεν
  choice: como nunca houve
  rationale: Expressa idiomaticamente a comparação qualitativa e o caráter sem precedente indicado pelo pronome οἵα e pelo perfeito γέγονεν negado.
- source_word: ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν
  choice: desde o princípio do mundo até agora
  rationale: Mantém os limites temporais e traduz κόσμος diretamente por “mundo”, sem expandi-lo para “criação”.
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: nem jamais haverá
  rationale: Reproduz a enfática negação futura οὐ μή com formulação portuguesa concisa; “jamais” comunica a força absoluta da negação sem precisar acrescentar “de novo”.
theological_decisions:
- issue: Sentido escatologicamente carregado de θλῖψις
  choice: tribulação
  alternative: aflição; sofrimento; angústia
  rationale: No contexto do discurso de Jesus, “tribulação” conserva a gravidade e a ressonância intertextual do grego, sem impor uma estrutura escatológica denominacional.
- issue: Alcance da negação futura enfática
  choice: nem jamais haverá
  alternative: e nunca mais acontecerá
  rationale: A tradução escolhida preserva a afirmação de singularidade futura e a forte negação do grego, evitando inserir explicitamente o advérbio “de novo”, que não aparece como palavra independente no texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o encadeamento explicativo do versículo e usa “tribulação” no texto principal por sua precisão contextual e familiaridade bíblica, esclarecendo alternativas na nota.
