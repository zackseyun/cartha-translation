base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/018.yaml
  text: And let the one in the field not turn back to take his cloak[a].
translation:
  language: pt
  text: E quem estiver no campo não volte para buscar a sua capa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua veste” ou “sua veste exterior”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: quem estiver no campo
  rationale: A expressão articular designa genericamente a pessoa que se encontra no campo. “Quem estiver” é natural em português, mantém o valor representativo e não restringe indevidamente a referência aos homens.
- source_word: μὴ ἐπιστρεψάτω ὀπίσω
  choice: não volte
  rationale: O imperativo aoristo com μή expressa uma proibição urgente. Em português, “não volte” comunica de modo direto tanto a força imperativa como a ideia de retornar, já contida pela combinação verbal.
- source_word: ἆραι
  choice: para buscar
  rationale: O infinitivo indica a finalidade de voltar. Neste contexto, “buscar” expressa naturalmente a ação de retornar para pegar ou recuperar algo deixado para trás.
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: a sua capa
  rationale: ἱμάτιον costuma designar uma peça de roupa, especialmente a veste exterior. “Capa” é uma opção concreta e adequada ao contexto, enquanto a nota preserva alternativas lexicais mais amplas.
theological_decisions:
- issue: Representação de gênero no artigo substantivado masculino
  choice: quem estiver no campo
  alternative: o homem que estiver no campo
  rationale: O masculino grego tem sentido genérico e representativo neste aviso. “Quem estiver” evita limitar a ordem aos homens sem apagar o foco em cada pessoa na situação descrita.
translation_notes:
  register: Português moderno, claro e digno, com construção idiomática amplamente compreensível no Brasil e em outros contextos lusófonos. A coordenação inicial com “E” preserva καί e a continuidade com o versículo anterior.
