  text: μακάριος ὁ δοῦλος ἐκεῖνος ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ⸂οὕτως ποιοῦντα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: pt
  text: Feliz aquele servo que o seu senhor, quando vier, encontrar agindo assim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: Feliz
  rationale: Expressa de modo natural o estado digno de aprovação e favor indicado pela bem-aventurança, sem tornar a frase excessivamente eclesiástica.
- source_word: δοῦλος
  choice: servo
  rationale: Preserva o termo tradicional e a relação de sujeição no contexto da parábola; 'escravo' explicitaria mais fortemente a condição social, mas soaria mais rígido neste dito proverbial.
- source_word: κύριος
  choice: senhor
  rationale: Mantém a relação de autoridade do personagem sobre o servo e também a possível ressonância cristológica, sem reduzi-lo a mero patrão.
- source_word: οὕτως ποιοῦντα
  choice: agindo assim
  rationale: Retoma naturalmente a conduta descrita no contexto anterior e corresponde ao particípio de ποιέω.
theological_decisions:
- issue: Ressonância cristológica de κύριος
  choice: senhor
  alternative: patrão
  rationale: O contexto imediato admite o senhor de uma casa, enquanto o discurso aponta também para a vinda do Filho do Homem. 'Senhor' conserva ambos os níveis sem resolver a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ordem sintática natural. A construção 'quando vier' mantém o sujeito implícito claramente ligado a 'seu senhor'.
