  text: καὶ πολλοὶ ψευδοπροφῆται ἐγερθήσονται καὶ πλανήσουσιν πολλούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/011.yaml
  text: And many false prophets will arise and will lead many astray[a][b].
translation:
  language: pt
  text: E muitos falsos profetas surgirão e desviarão a muitos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enganarão a muitos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “serão levantados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: muitos
  rationale: Equivalente quantitativo direto e natural em português, sem intensificação indevida.
- source_word: ψευδοπροφῆται
  choice: falsos profetas
  rationale: Expressão consagrada e precisa para profetas falsos ou enganadores, preservando a ressonância bíblica.
- source_word: ἐγερθήσονται
  choice: surgirão
  rationale: Neste contexto, exprime naturalmente o aparecimento ou a emergência dessas figuras e evita sugerir necessariamente ressurreição, embora a forma grega seja passiva.
- source_word: πλανήσουσιν
  choice: desviarão
  rationale: Preserva a imagem de fazer alguém sair do caminho e mantém amplo o sentido de enganar ou induzir ao erro.
- source_word: πολλούς
  choice: a muitos
  rationale: Objeto direto pessoal expresso de forma clara e idiomática, correspondendo ao segundo uso de πολύς.
- source_word: καὶ ... καὶ
  choice: E ... e
  rationale: Mantém a coordenação simples e cumulativa das duas ações futuras no grego.
theological_decisions:
- issue: Natureza do desvio expresso por πλανήσουσιν
  choice: A tradução afirma de modo amplo que os falsos profetas desviarão muitas pessoas.
  alternative: Especificar que o engano será doutrinário, moral ou escatológico.
  rationale: O verbo grego não limita o desvio a uma dessas categorias; a formulação preserva essa abrangência e a tensão teológica.
- issue: Valor passivo de ἐγερθήσονται
  choice: surgirão
  alternative: serão levantados
  rationale: “Surgirão” é o sentido contextual mais natural, mas a nota conserva a possibilidade de uma tradução formalmente passiva sem identificar quem os levanta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a repetição das conjunções acompanham de perto o grego, enquanto “surgirão” e “desviarão” oferecem naturalidade sem eliminar alternativas lexicais genuínas.
