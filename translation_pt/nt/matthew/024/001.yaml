id: MAT.24.1
reference: Matthew 24:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ὁ Ἰησοῦς ⸂ἀπὸ τοῦ ἱεροῦ ἐπορεύετο⸃, καὶ προσῆλθον οἱ μαθηταὶ αὐτοῦ ἐπιδεῖξαι αὐτῷ τὰς οἰκοδομὰς τοῦ ἱεροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/001.yaml
  text: And Jesus went out from the temple and was going away[a], and his disciples came to show him the buildings of the temple.
translation:
  language: pt
  text: Jesus saiu do templo e ia embora[a], e os seus discípulos se aproximaram para lhe mostrar as construções do templo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra grega traduzida como “templo” refere-se ao complexo ou recinto do templo, não especificamente ao santuário interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: saiu
  rationale: 'O particípio aoristo indica uma ação anterior à do verbo principal: Jesus saiu e então estava indo embora. “Saiu” preserva de modo natural o sentido direcional.'
- source_word: ἱεροῦ
  choice: templo
  rationale: Ἱερόν designa aqui o conjunto ou recinto do templo, e não especificamente o santuário interior. “Templo” é a forma corrente e legível; a precisão lexical é registrada em nota.
- source_word: ἐπορεύετο
  choice: estava indo embora
  rationale: O imperfeito apresenta o deslocamento como ação em curso. A construção progressiva conserva esse aspecto e indica que Jesus se afastava do templo.
- source_word: προσῆλθον
  choice: se aproximaram
  rationale: O aoristo de προσέρχομαι descreve os discípulos chegando perto de Jesus. “Se aproximaram” é claro e preciso no contexto.
- source_word: ἐπιδεῖξαι
  choice: para lhe mostrar
  rationale: O infinitivo expressa a finalidade da aproximação dos discípulos. “Para lhe mostrar” reproduz essa relação de propósito em português natural.
- source_word: οἰκοδομὰς
  choice: construções
  rationale: Οἰκοδομάς refere-se aos edifícios ou estruturas construídas do complexo do templo. “Construções” abrange naturalmente o conjunto arquitetônico sem acrescentar elementos ausentes do texto.
- source_word: τοῦ ἱεροῦ
  choice: do templo
  rationale: O genitivo identifica as construções como pertencentes ao complexo do templo. A repetição de “templo” acompanha a formulação e a ênfase do grego.
theological_decisions:
- issue: Distinção entre ἱερόν e ναός
  choice: templo, com esclarecimento em nota
  alternative: complexo do templo; recinto do templo
  rationale: O termo ἱερόν abrange a área ou o complexo do templo, não apenas o santuário interior. Manter “templo” no texto favorece a leitura corrente, enquanto a nota conserva a distinção lexical sem impor uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada com “quando” para comunicar com naturalidade a progressão narrativa, preservando a ação em curso indicada pelo imperfeito grego.
