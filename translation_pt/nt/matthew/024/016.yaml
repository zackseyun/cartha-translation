lexical_decisions:
- source_word: τότε
  choice: então
  rationale: Marca a sequência temporal no discurso de Jesus de modo conciso e natural.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: os que estiverem na Judeia
  rationale: O artigo com a expressão preposicional tem função substantiva e se refere às pessoas que estiverem naquela região; esta formulação é clara e idiomática em português.
- source_word: Ἰουδαίᾳ
  choice: Judeia
  rationale: Forma portuguesa convencional do nome geográfico.
- source_word: φευγέτωσαν
  choice: devem fugir
  rationale: O imperativo presente ativo na terceira pessoa do plural expressa uma ordem urgente; “devem fugir” comunica essa força com naturalidade, sem transformar a frase em mera descrição.
- source_word: ἐπὶ τὰ ὄρη
  choice: para os montes
  rationale: Com o verbo de movimento, ἐπί com acusativo indica deslocamento em direção a um destino. “Montes” preserva melhor o sentido de ὄρη do que “colinas”.
theological_decisions:
- issue: Força do imperativo em uma advertência escatológica
  choice: 'Ordem direta e urgente: “devem fugir”'
  alternative: “fujam para os montes”
  rationale: A tradução mantém a urgência prática da advertência de Jesus sem acrescentar uma interpretação escatológica específica. A nota registra uma forma imperativa portuguesa mais direta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Judeia” e “montes” mantêm o registro bíblico corrente sem arcaísmo excessivo.
