id: MAT.24.35
reference: Matthew 24:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: pt
  text: O céu e a terra passarão, mas as minhas palavras de modo nenhum passarão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “jamais passarão”. O grego emprega uma negação enfática (οὐ μή).
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: o céu
  rationale: No par escatológico com γῆ, designa o céu como parte da ordem criada, e não apenas o céu visível. “O céu e a terra” é a expressão portuguesa natural que conserva o alcance cósmico.
- source_word: ἡ γῆ
  choice: a terra
  rationale: Neste par fixo, γῆ se refere à terra ou ao mundo, não a uma região específica.
- source_word: παρελεύσεται
  choice: passarão
  rationale: O verbo expressa o desaparecimento ou fim da ordem criada presente. Em português, o plural concorda naturalmente com o sujeito composto “o céu e a terra”.
- source_word: δὲ
  choice: mas
  rationale: Marca o contraste entre a transitoriedade do céu e da terra e a permanência das palavras de Jesus.
- source_word: οἱ λόγοι μου
  choice: as minhas palavras
  rationale: Refere-se às declarações ou aos ensinamentos de Jesus; “palavras” mantém o sentido amplo e direto.
- source_word: οὐ μὴ παρέλθωσιν
  choice: de modo nenhum passarão
  rationale: A construção οὐ μή com o subjuntivo aoristo é uma negação enfática. “De modo nenhum” transmite essa força de modo claro, solene e atual.
theological_decisions:
- issue: Força da afirmação de Jesus sobre a permanência de suas palavras
  choice: Manter o contraste enfático entre a ordem criada, que passará, e as palavras de Jesus, que de modo nenhum passarão.
  alternative: Explicitar implicações doutrinárias acerca da autoridade divina de Jesus ou traduzir simplesmente “nunca passarão”.
  rationale: O texto faz uma afirmação forte sobre a permanência e a certeza das palavras de Jesus, mas não explicita aqui todas as suas implicações doutrinárias. A tradução conserva o peso teológico sem acrescentar uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação evita arcaísmos e preserva o paralelismo e a solenidade do original.
