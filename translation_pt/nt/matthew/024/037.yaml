base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/037.yaml
  text: For just as the days of Noah were[a], so the coming of the Son of Man will be.
translation:
  language: pt
  text: Pois, assim como foram os dias de Noé, assim também será a vinda[a] do Filho do Homem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “presença”. A palavra grega pode indicar “presença” ou “chegada”; aqui, refere-se à futura vinda do Filho do Homem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ ... οὕτως
  choice: assim como ... assim também
  rationale: Preserva a estrutura correlativa enfática da comparação em português natural.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com o contexto anterior.
- source_word: αἱ ἡμέραι τοῦ Νῶε
  choice: foram os dias de Noé
  rationale: O grego omite o predicado na primeira parte da comparação; acrescentar “foram” completa a construção de modo mínimo e claro em português.
- source_word: Νῶε
  choice: Noé
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἔσται
  choice: será
  rationale: Traduz diretamente o futuro de εἰμί sem acrescentar interpretação.
- source_word: παρουσία
  choice: vinda
  rationale: Neste contexto escatológico, comunica com clareza a chegada futura do Filho do Homem, enquanto a alternativa lexical “presença” é registrada em nota.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: do Filho do Homem
  rationale: Preserva a designação consagrada, bem como sua ressonância bíblica e seu peso teológico.
theological_decisions:
- issue: Tradução de παρουσία em uma declaração escatológica
  choice: vinda
  alternative: presença; chegada
  rationale: “Vinda” expressa de modo natural o sentido eventivo da futura manifestação do Filho do Homem sem eliminar a amplitude lexical do termo, indicada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A repetição “assim como ... assim também” reproduz a correlação do grego; “Pois” conserva a função explicativa do versículo.
