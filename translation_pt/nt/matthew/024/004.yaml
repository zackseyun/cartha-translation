  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/004.yaml
  text: And Jesus answered them[a], “See that no one leads you astray.”
translation:
  language: pt
  text: 'Jesus lhes respondeu: “Tenham cuidado para que ninguém os engane.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: Jesus lhes respondeu
  rationale: A construção narrativa grega combina o particípio de ἀποκρίνομαι com εἶπεν; em português natural, “respondeu” preserva tanto a natureza responsiva quanto o ato de falar, sem a redundância de “respondendo, disse-lhes”.
- source_word: Βλέπετε
  choice: Tenham cuidado
  rationale: Neste contexto, o imperativo presente plural tem sentido idiomático de vigilância e cautela. “Tenham cuidado” é claro, atual e liga-se naturalmente à oração introduzida por μή.
- source_word: μή τις ... πλανήσῃ
  choice: para que ninguém os engane
  rationale: Após o imperativo, μή com o subjuntivo exprime prevenção. πλανάω abrange enganar, desviar ou induzir ao erro; “engane” é natural em português e adequado ao contexto de falsas alegações, sem excluir a ideia de desvio.
theological_decisions:
- issue: Amplitude da advertência expressa por πλανήσῃ
  choice: “engane”, entendido como induzir ao erro ou desviar
  alternative: “desvie” ou “induza ao erro”
  rationale: A formulação mantém a advertência geral contra falsa orientação e engano, sem restringi-la a erro meramente intelectual nem explicitar uma apostasia que o verbo, sozinho, não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “tenham” e os pronomes “lhes/os” refletem que Jesus se dirige aos discípulos. Não se acrescentou nota, pois “engane” expressa de modo suficientemente natural a amplitude contextual de πλανάω.
