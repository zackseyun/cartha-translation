  text: Ὅταν οὖν ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου ⸀ἑστὸς ἐν τόπῳ ἁγίῳ, ὁ ἀναγινώσκων νοείτω,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/015.yaml
  text: So when you see the abomination of desolation spoken of through Daniel the prophet standing in a holy place—let the reader understand—[a][b]
translation:
  language: pt
  text: Portanto, quando vocês virem a abominação da desolação, anunciada por meio do profeta Daniel, em pé num lugar santo — quem lê, entenda —,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais tradicionalmente, “no lugar santo”.
    reason: alternative_reading
  - marker: b
    text: Ou “a abominação devastadora” ou “a abominação que causa desolação”, em alusão a Daniel.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Portanto, quando
  rationale: A expressão introduz uma circunstância futura e, ao mesmo tempo, liga a advertência ao discurso anterior. “Portanto, quando” é natural e preserva ambas as funções.
- source_word: ἴδητε
  choice: vocês virem
  rationale: O aoristo do subjuntivo em uma oração temporal futura é expresso naturalmente em português pelo futuro do subjuntivo.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: a abominação da desolação
  rationale: Mantém a construção genitiva e a reconhecida alusão a Daniel sem decidir se a abominação produz desolação ou é caracterizada por ela.
- source_word: τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου
  choice: da qual se falou por meio do profeta Daniel
  rationale: A formulação explicita de modo natural que a expressão foi proferida profeticamente e preserva διά como mediação ou agência.
- source_word: ἑστὸς
  choice: em pé
  rationale: Traduz diretamente o particípio perfeito de ἵστημι, sem substituí-lo pela interpretação possível “instalada” ou “colocada”.
- source_word: ἐν τόπῳ ἁγίῳ
  choice: num lugar santo
  rationale: Reflete a ausência de artigo no grego e evita identificar obrigatoriamente o lugar com uma parte específica do templo.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: quem lê, entenda
  rationale: Reproduz concisamente a exortação parentética e mantém a força imperativa de νοείτω.
theological_decisions:
- issue: Definição de τόπῳ ἁγίῳ e possível referência específica ao templo
  choice: num lugar santo
  alternative: no lugar santo
  rationale: Embora o contexto possa evocar o templo ou um lugar consagrado específico, a expressão grega não tem artigo. O texto principal preserva essa abertura, e a leitura tradicional mais definida aparece em nota.
- issue: Sentido da expressão de Daniel βδέλυγμα τῆς ἐρημώσεως
  choice: a abominação da desolação
  alternative: a abominação devastadora; a abominação que causa desolação
  rationale: A tradução formal conserva a ambiguidade do genitivo e a ligação verbal com Daniel, sem impor uma única explicação causal ou qualitativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa. A ordem foi ajustada para fluência, sem eliminar a ambiguidade da expressão de Daniel. Os marcadores [a] e [b] aparecem no texto principal.
