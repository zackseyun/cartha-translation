review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a construção temporal futura, a expressão daniélica, o lugar santo anartro e a exortação ao leitor. Porém, a sequência «da qual se falou por meio do profeta Daniel, em pé» permite que «em pé» se ligue sintaticamente a Daniel, quando no grego ἑστὸς concorda com «a abominação» (gramaticalmente neutra em grego).
  naturalness: O português é moderno e claro em geral. É necessária uma pequena reordenação para eliminar a leitura de que Daniel está «em pé».
  terminology: «Abominação da desolação» mantém de modo apropriado a formulação estabelecida e a alusão a Daniel. «Num lugar santo» preserva prudentemente a indefinição formal do grego; as notas apresentam alternativas legítimas sem fechar a interpretação.
  issues:
  - severity: medium
    issue: Ambiguidade de ligação de «em pé»
    rationale: Em «da qual se falou por meio do profeta Daniel, em pé num lugar santo», o sintagma «em pé» pode modificar imediatamente «o profeta Daniel». No texto grego, ἑστὸς refere-se a τὸ βδέλυγμα, «a abominação». A ordem deve deixar essa ligação inequívoca.
  revised_text: Portanto, quando vocês virem a abominação da desolação, anunciada por meio do profeta Daniel, em pé num lugar santo — quem lê, entenda —,[a][b]
  revised_footnotes:
  - marker: a
    text: Ou, mais tradicionalmente, “no lugar santo”.
    reason: alternative_reading
  - marker: b
    text: Ou “a abominação devastadora” ou “a abominação que causa desolação”, em alusão a Daniel.
    reason: lexical_alternative
  revision_rationale: A reordenação e a substituição de «da qual se falou» por «anunciada» fazem com que «em pé num lugar santo» se relacione naturalmente com «a abominação da desolação», como no grego, sem interpretar «em pé» como «instalada» ou especificar o lugar. Mantêm-se as duas notas e seus marcadores.
