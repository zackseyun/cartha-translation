  text: καὶ τότε σκανδαλισθήσονται πολλοὶ καὶ ἀλλήλους παραδώσουσιν καὶ μισήσουσιν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/010.yaml
  text: And then many will fall away[b][a], and they will betray one another and hate one another.
translation:
  language: pt
  text: E então muitos tropeçarão[a], trairão uns aos outros[b] e odiarão uns aos outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serão levados a tropeçar”, “cairão” ou “se escandalizarão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “entregarão uns aos outros”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: então
  rationale: Advérbio temporal que marca a sequência no discurso de Jesus; “então” é direto e natural.
- source_word: σκανδαλισθήσονται
  choice: abandonarão a fé
  rationale: Neste contexto de perseguição, o verbo indica queda ou afastamento sob pressão. A expressão comunica a gravidade da ruptura sem definir um sistema doutrinário específico; a nota preserva as alternativas lexicais.
- source_word: πολλοὶ
  choice: muitos
  rationale: Adjetivo substantivado de sentido quantitativo; “muitos” é a tradução mais direta.
- source_word: ἀλλήλους
  choice: uns aos outros
  rationale: Preserva com clareza o sentido recíproco do pronome nas duas ocorrências.
- source_word: παραδώσουσιν
  choice: trairão
  rationale: Embora o verbo possa significar literalmente “entregar”, o contexto de hostilidade entre pessoas favorece o sentido de traição; a alternativa mais literal é mantida em nota.
- source_word: μισήσουσιν
  choice: odiarão
  rationale: Tradução direta do futuro de μισέω, que expressa hostilidade ativa.
- source_word: καὶ τότε ... καὶ ... καὶ ...
  choice: E então ... , ... e ...
  rationale: O “E” inicial conserva a continuidade com o discurso anterior. Em português, a coordenação sem repetir todos os “e” mantém a progressão cumulativa de modo mais natural.
theological_decisions:
- issue: Sentido de σκανδαλισθήσονται no contexto de perseguição escatológica
  choice: abandonarão a fé
  alternative: tropeçarão; se escandalizarão
  rationale: O contexto sugere afastamento sério, seguido de traição e ódio. “Abandonarão a fé” torna explícito o domínio implícito da defecção, mas a nota conserva a amplitude do verbo grego e evita apresentar essa interpretação contextual como única possibilidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém o ritmo crescente do versículo e preserva em notas a ambiguidade dos verbos gregos.
