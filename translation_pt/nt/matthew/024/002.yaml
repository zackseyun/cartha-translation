base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: pt
  text: 'Mas ele lhes respondeu: “Vocês não veem todas estas coisas? Em verdade lhes digo: não ficará aqui pedra sobre pedra que não seja derrubada.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “demolida”. O verbo grego pode indicar desmantelamento ou demolição; “derrubada” preserva a imagem das pedras removidas de seu lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: lhes respondeu
  rationale: A construção com particípio e verbo finito é uma expressão grega de influência semítica. Em português atual, “lhes respondeu” comunica naturalmente o sentido completo sem reproduzir de modo rígido a duplicação verbal.
- source_word: Οὐ βλέπετε
  choice: Vocês não estão vendo
  rationale: A pergunta retórica espera concordância e se refere tanto à visão concreta quanto à percepção do que está diante deles. A forma progressiva é natural no contexto imediato.
- source_word: ταῦτα πάντα
  choice: tudo isto
  rationale: O neutro plural grego abrange o conjunto das construções do templo mencionado no contexto; “tudo isto” é uma formulação natural e explícita em português.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Em verdade lhes digo
  rationale: Preserva o caráter solene e enfático da fórmula de Jesus em linguagem digna e amplamente reconhecível.
- source_word: οὐ μὴ ἀφεθῇ
  choice: não ficará
  rationale: A construção grega expressa negação enfática. Em português, “não ficará”, reforçado por “pedra sobre pedra”, transmite com naturalidade a certeza da predição.
- source_word: ὧδε
  choice: aqui
  rationale: Mantém a referência espacial direta ao local do templo.
- source_word: λίθος ἐπὶ λίθον
  choice: pedra sobre pedra
  rationale: Conserva a imagem e a formulação idiomática do grego, expressando o desmantelamento completo.
- source_word: καταλυθήσεται
  choice: seja derrubada
  rationale: No contexto de uma construção, o verbo indica demolição ou desmantelamento. “Derrubada” preserva a imagem concreta das pedras removidas de seu lugar.
theological_decisions:
- issue: Alcance e força da predição de Jesus a respeito do templo
  choice: Apresentar uma predição concreta de destruição estrutural completa, sem vinculá-la a um sistema escatológico específico.
  alternative: Entender a declaração principalmente como símbolo de juízo ou subordiná-la a uma estrutura escatológica posterior específica.
  rationale: A linguagem sobre pedras que não permanecerão umas sobre as outras é concreta e arquitetônica. A tradução preserva essa força sem acrescentar uma interpretação doutrinária que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e claro, com boa legibilidade brasileira e compreensão internacional. “Vocês” explicita o plural de ὑμῖν e evita ambiguidade; “Em verdade lhes digo” mantém o tom solene sem arcaísmo excessivo.
