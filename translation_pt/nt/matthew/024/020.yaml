  text: προσεύχεσθε δὲ ἵνα μὴ γένηται ἡ φυγὴ ὑμῶν χειμῶνος μηδὲ σαββάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/020.yaml
  text: But pray that your flight may not happen in winter or on a Sabbath[a].
translation:
  language: pt
  text: Mas orem para que a fuga de vocês não aconteça no inverno nem num sábado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no sábado”.'
    reason: Tradução alternativa possível para o dativo anartro σαββάτῳ.
lexical_decisions:
- source_word: προσεύχεσθε
  choice: orem
  rationale: Imperativo presente na segunda pessoa do plural. “Orem” é a forma natural e digna em português; a possível ideia de ação contínua permanece implícita, sem ser exagerada.
- source_word: δὲ
  choice: Mas
  rationale: Marca leve contraste ou transição em relação à advertência anterior; “Mas” preserva com clareza essa mudança discursiva.
- source_word: ἵνα μὴ γένηται
  choice: para que ... não aconteça
  rationale: Depois de προσεύχεσθε, ἵνα com o subjuntivo expressa o conteúdo ou propósito da oração. “Para que ... não aconteça” é natural em português e mantém o sentido eventivo de γίνομαι.
- source_word: ἡ φυγὴ ὑμῶν
  choice: a fuga de vocês
  rationale: φυγή designa o ato de fugir. “A fuga de vocês” é claro para leitores brasileiros e internacionais e não pressupõe que a fuga será necessariamente bem-sucedida, como poderia sugerir “escape”.
- source_word: χειμῶνος
  choice: no inverno
  rationale: Genitivo temporal referente à estação; “no inverno” é a formulação idiomática em português.
- source_word: μηδὲ σαββάτῳ
  choice: nem num sábado
  rationale: μηδέ acrescenta uma segunda circunstância negativa, e σαββάτῳ é dativo temporal sem artigo. “Nem num sábado” preserva essa indefinição formal sem perder a referência ao dia judaico de descanso.
theological_decisions:
- issue: Tradução de σαββάτῳ com artigo definido ou indefinido
  choice: num sábado
  alternative: no sábado
  rationale: O grego não traz artigo, de modo que “num sábado” reflete mais diretamente sua forma e preserva a possibilidade de referência a qualquer ocorrência desse dia. A tradução tradicional “no sábado” também é linguisticamente possível, pois nomes de dias podem ser definidos sem artigo em grego; por isso, aparece em nota, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Vocês” explicita naturalmente o plural de ὑμῶν; “orem” mantém concisão e tom exortativo.
