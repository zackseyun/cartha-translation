id: MAT.24.22
reference: Matthew 24:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: pt
  text: E, se aqueles dias não tivessem sido encurtados[a], nenhum ser humano[b] seria salvo; mas, por causa dos eleitos, aqueles dias serão encurtados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abreviados”. O verbo grego descreve a redução da duração daqueles dias.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “nenhuma carne”. É uma expressão bíblica que, neste contexto, significa nenhum ser humano.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: não tivessem sido encurtados / serão encurtados
  rationale: κολοβόω indica reduzir ou cortar a duração. “Encurtados” é claro e idiomático em português, conserva a força temporal do verbo e mantém o paralelismo entre a condição contrária ao fato e o futuro.
- source_word: οὐκ ἂν ἐσώθη
  choice: seria salvo
  rationale: A construção grega expressa o resultado de uma condição contrária ao fato. “Salvo” preserva a amplitude de σῴζω; neste contexto, a preservação da vida está em primeiro plano, sem excluir por tradução outras ressonâncias do verbo.
- source_word: πᾶσα σάρξ
  choice: nenhum ser humano
  rationale: Sob a negação, o idioma grego “toda carne” significa que nenhum ser humano permaneceria vivo. A formulação escolhida comunica naturalmente esse sentido em português, enquanto a nota registra a expressão literal.
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: mas, por causa dos eleitos
  rationale: διά com acusativo indica aqui motivo ou consideração. “Por causa dos eleitos” preserva essa relação sem especificar além do texto como a redução dos dias se relaciona com eles.
- source_word: τοὺς ἐκλεκτούς
  choice: os eleitos
  rationale: “Eleitos” é o equivalente lexical preciso e tradicional, sem identificar interpretativamente o grupo como Israel, a igreja ou um remanescente específico.
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: aqueles dias
  rationale: Tradução direta e natural que conserva a força demonstrativa de ἐκεῖναι.
- source_word: καὶ εἰ μὴ
  choice: E, se ... não
  rationale: Mantém a coordenação e a estrutura condicional explícitas do grego.
theological_decisions:
- issue: Identidade dos “eleitos” no discurso escatológico
  choice: Manter “os eleitos” sem explicação interpretativa no corpo do texto.
  alternative: “o povo escolhido de Deus”, “os crentes” ou “o remanescente fiel”
  rationale: O versículo designa o grupo como ἐκλεκτοί, mas não define aqui toda a sua extensão teológica. A tradução evita resolver debates sobre Israel, a igreja ou um remanescente.
- issue: Sentido de σῴζω neste contexto
  choice: Traduzir por “salvo”, deixando o contexto indicar a preservação física da vida.
  alternative: “sobreviveria” ou “seria mantido vivo”
  rationale: A tribulação torna a sobrevivência o sentido contextual imediato, mas “sobreviveria” estreitaria o campo semântico do verbo. “Salvo” mantém a formulação da fonte sem impor uma leitura exclusivamente física ou exclusivamente soteriológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Encurtados” é mais corrente que “abreviados”; “nenhum ser humano” comunica o idioma grego sem a estranheza que “nenhuma carne” teria para muitos leitores atuais. A pontuação conserva a progressão lógica e o contraste do original.
