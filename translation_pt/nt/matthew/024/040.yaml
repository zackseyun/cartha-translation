base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: pt
  text: Então, dois homens estarão no campo; um será levado[a], e o outro será deixado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “será levado para junto de alguém”. O verbo, por si só, não especifica se alguém é levado para ser salvo ou para ser julgado.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Advérbio temporal que liga a cena ao contexto escatológico anterior; “Então” é direto e natural.
- source_word: δύο ἔσονται
  choice: dois homens estarão
  rationale: Embora ἄνδρες não esteja expresso, os dois εἷς masculinos e o paralelo feminino do versículo seguinte indicam dois homens. Em português, explicitar “homens” torna a referência natural e preserva essa distinção contextual.
- source_word: ἐν τῷ ἀγρῷ
  choice: no campo
  rationale: Equivalência locativa direta e idiomática.
- source_word: εἷς ... εἷς
  choice: um ... o outro
  rationale: O primeiro numeral estabelece o contraste, e “o outro” expressa naturalmente em português o segundo integrante do par sem alterar o sentido.
- source_word: παραλαμβάνεται
  choice: será levado
  rationale: O presente passivo aparece numa cena futura; o futuro em português é natural. “Levado” conserva a ambiguidade quanto a resgate ou juízo.
- source_word: ἀφίεται
  choice: será deixado
  rationale: Tradução direta do passivo no contexto. Evita “deixado para trás”, expressão carregada de associações escatológicas modernas.
theological_decisions:
- issue: Se παραλαμβάνεται indica resgate/salvação ou juízo
  choice: Manter a formulação neutra “será levado”
  alternative: Explicitar “levado para a salvação” ou “levado para o juízo”
  rationale: O verbo e o contexto não obrigam a tradução a resolver a identidade do destino; a ambiguidade teológica genuína deve ser preservada.
- issue: Se a referência masculina deve ser explicitada
  choice: “dois homens”
  alternative: “duas pessoas” ou apenas “dois”
  rationale: Os pronomes numerais masculinos e o paralelo feminino no versículo seguinte sustentam uma cena masculina. “Duas pessoas” apagaria essa distinção, enquanto apenas “dois” seria menos natural e menos claro em português.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e o contraste conciso do grego foram preservados, usando futuro verbal adequado à cena escatológica.
