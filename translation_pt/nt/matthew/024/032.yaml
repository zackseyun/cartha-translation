  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ἤδη ὁ κλάδος αὐτῆς γένηται ἁπαλὸς καὶ τὰ φύλλα ἐκφύῃ, γινώσκετε ὅτι ἐγγὺς τὸ θέρος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
translation:
  language: pt
  text: 'Aprendam com a figueira esta parábola[a]: quando seu ramo já se torna tenro e começa a brotar folhas[b], vocês sabem que o verão[c] está próximo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esta lição” ou “esta ilustração”.
    reason: lexical_alternative
  - marker: b
    text: Ou “faz brotar folhas”.
    reason: lexical_alternative
  - marker: c
    text: O termo grego pode significar “verão” e, em alguns contextos, a época da colheita; aqui, o sentido sazonal combina melhor com a imagem da figueira.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: com a figueira
  rationale: A preposição ἀπό com o genitivo indica a fonte da qual se aprende. Em português, “aprendam com a figueira” expressa essa relação com naturalidade; o leve valor conectivo de δέ não exige aqui uma palavra temporal como “agora”.
- source_word: μάθετε
  choice: Aprendam
  rationale: O imperativo aoristo de μανθάνω apresenta uma ordem direta para que os ouvintes tirem ensinamento da figueira.
- source_word: τὴν παραβολήν
  choice: esta parábola
  rationale: “Parábola” preserva o termo característico dos Evangelhos e o caráter comparativo da ilustração. O demonstrativo “esta” torna natural em português a referência à comparação que vem em seguida, sem alterar seu sentido.
- source_word: ὅταν ἤδη
  choice: quando ... já
  rationale: ὅταν introduz uma situação temporal geral, e ἤδη assinala que o processo já começou. A formulação conserva ambos os elementos sem tornar a frase artificial.
- source_word: ὁ κλάδος αὐτῆς γένηται ἁπαλὸς
  choice: seu ramo já fica tenro
  rationale: γένηται indica mudança de estado, e ἁπαλός descreve a maciez ou flexibilidade do crescimento novo. “Tenro” é natural e apropriado à imagem botânica.
- source_word: καὶ τὰ φύλλα ἐκφύῃ
  choice: e produz folhas
  rationale: ἐκφύῃ descreve o despontar ou surgimento das folhas. “Produz folhas” é claro e natural, mantendo o ramo como referente implícito da ação.
- source_word: γινώσκετε
  choice: vocês sabem
  rationale: O presente do indicativo na segunda pessoa do plural exprime o conhecimento habitual decorrente do sinal observado, não uma nova ordem.
- source_word: ἐγγὺς τὸ θέρος
  choice: o verão está próximo
  rationale: Neste contexto de sinais sazonais da figueira, θέρος designa naturalmente o verão. “Está próximo” reproduz de modo idiomático a ideia de proximidade.
theological_decisions:
- issue: Significado da imagem da figueira
  choice: A figueira é mantida como imagem sazonal, sem identificação simbólica explícita.
  alternative: Interpretar na própria tradução a figueira como símbolo de Israel ou reduzi-la expressamente a um exemplo genérico da natureza.
  rationale: O versículo apresenta uma analogia observável entre sinais e proximidade. A identificação simbólica mais ampla da figueira não é explicitada nesta frase e, por isso, não deve ser imposta pela tradução.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Emprega “vocês” para tornar explícita a segunda pessoa do plural e evita inserir uma interpretação escatológica não declarada no versículo.
