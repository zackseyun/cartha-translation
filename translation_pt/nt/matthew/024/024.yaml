  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε ⸀πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/024.yaml
  text: For false messiahs and false prophets will arise[a], and they will perform great signs and wonders so as to lead astray, if possible[c][b], even the elect.
translation:
  language: pt
  text: Pois surgirão falsos messias[a] e falsos profetas, e realizarão grandes sinais e maravilhas para desviar, se possível[c], até os eleitos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falsos cristos”. O grego usa o título Christós; aqui, “messias” destaca seu sentido titular.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “os escolhidos”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “se fosse possível”. O grego diz simplesmente “se possível”, sem explicitar a implicação teológica.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: surgirão
  rationale: Neste contexto, o futuro passivo de ἐγείρω é idiomático para pessoas que aparecem ou entram em cena; “surgirão” é natural e não sugere ressurreição.
- source_word: ψευδόχριστοι
  choice: falsos messias
  rationale: Χριστός funciona aqui como título; “messias” preserva esse sentido e o contexto judaico, enquanto ψευδο- é traduzido diretamente por “falsos”.
- source_word: ψευδοπροφῆται
  choice: falsos profetas
  rationale: Tradução direta e corrente do substantivo composto.
- source_word: δώσουσιν
  choice: realizarão
  rationale: Embora δίδωμι signifique literalmente “dar”, com “sinais e maravilhas” a expressão idiomática em português é “realizar”.
- source_word: σημεῖα μεγάλα καὶ τέρατα
  choice: grandes sinais e maravilhas
  rationale: Mantém a distinção lexical e a conhecida associação bíblica, sem reduzir σημεῖα a “milagres”.
- source_word: ὥστε πλανῆσαι
  choice: para desviar
  rationale: A formulação expressa propósito ou resultado pretendido sem decidir rigidamente entre essas nuances; “desviar” conserva a ideia de fazer alguém sair do caminho.
- source_word: εἰ δυνατὸν
  choice: se possível
  rationale: Reproduz de modo conciso a condição grega, sem acrescentar uma força contrafactual que o texto não explicita.
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: até os eleitos
  rationale: Aqui καί tem força ascensiva, bem expressa por “até”; “os eleitos” é termo corrente e formalmente próximo de ἐκλεκτούς.
theological_decisions:
- issue: Sentido titular de ψευδόχριστοι
  choice: falsos messias
  alternative: falsos cristos
  rationale: “Messias” comunica que se trata de pretendentes falsos ao título, evitando tratar Χριστός como nome próprio neste contexto.
- issue: Força de εἰ δυνατὸν em relação aos eleitos
  choice: se possível
  alternative: se fosse possível
  rationale: A redação mantém a condição concisa do grego e não resolve por tradução a questão teológica sobre a possibilidade de os eleitos serem desviados.
- issue: Sentido de πλανῆσαι
  choice: desviar
  alternative: enganar
  rationale: “Desviar” preserva a imagem de levar alguém para fora do caminho, embora o verbo também possa ser entendido como enganar.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem das notas no texto segue o ponto exato a que cada uma se refere; todos os marcadores estão presentes.
