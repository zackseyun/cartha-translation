  text: ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/013.yaml
  text: But the one who endures to the end will be saved[a][b].
translation:
  language: pt
  text: Mas aquele que perseverar até o fim será salvo[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até ao fim”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “será livrado”. O grego pode indicar livramento ou salvação; a formulação mais ampla foi mantida porque o contexto não exige que o sentido seja restringido.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... ὑπομείνας
  choice: aquele que perseverar
  rationale: O artigo com o particípio aoristo funciona substantivamente e designa a pessoa que permanece firme. A oração relativa com futuro do subjuntivo é natural em português e representa adequadamente a condição temporal implícita, sem restringir o referente por gênero.
- source_word: δὲ
  choice: Mas
  rationale: A conjunção assinala um contraste moderado com os avisos anteriores sobre abandono e esfriamento do amor.
- source_word: ὑπομείνας (ὑπομένω)
  choice: perseverar
  rationale: O verbo expressa permanecer firme sob provação, suportar ou perseverar. Aqui, «perseverar» é claro, corrente e conserva a ideia de continuidade fiel diante da pressão.
- source_word: εἰς τέλος
  choice: até o fim
  rationale: A expressão indica continuidade até um ponto final. «Até o fim» é a formulação portuguesa mais natural; «até ao fim» é uma variante regional igualmente possível.
- source_word: οὗτος
  choice: expresso pela estrutura «aquele que... será»
  rationale: O demonstrativo retoma enfaticamente a pessoa descrita pelo particípio. Em português, «aquele que... será salvo» preserva essa retomada de modo natural, sem o literalismo pesado de «esse será salvo».
- source_word: σωθήσεται
  choice: será salvo
  rationale: O futuro passivo de σῴζω pode indicar salvação ou livramento. «Será salvo» mantém a amplitude escatológica do termo sem decidir se o foco é salvação final, livramento na tribulação ou ambos.
theological_decisions:
- issue: Sentido de σωθήσεται no contexto escatológico da perseverança
  choice: será salvo
  alternative: será livrado
  rationale: O contexto não determina de maneira inequívoca se se trata exclusivamente de salvação escatológica final, de livramento em meio à tribulação ou de ambos. A tradução mantém essa tensão e não introduz uma conclusão denominacional sobre perseverança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Até o fim» segue o uso brasileiro e internacional mais difundido; a variante «até ao fim» é registrada em nota. A formulação evita tanto um calque rígido do demonstrativo grego quanto uma explicação doutrinária inserida no texto.
