  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης καὶ ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν ⸂οὐδὲ ὁ υἱός⸃, εἰ μὴ ὁ ⸀πατὴρ μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/036.yaml
  text: But concerning that day and hour[a], no one knows—not even the angels of heaven, nor the Son—except the Father alone.
translation:
  language: pt
  text: Mas, quanto àquele dia e àquela hora, ninguém sabe, nem os anjos dos céus, nem o Filho[a], mas somente o Pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos omitem «nem o Filho». O texto principal segue a leitura da SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Mas, quanto a
  rationale: περί com o genitivo introduz o assunto, e δέ assinala uma transição com leve força contrastiva. “Mas, quanto a” preserva ambas as funções em português natural.
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: àquele dia e àquela hora
  rationale: Os genitivos dependem de περί. Embora haja um só demonstrativo no grego, sua aplicação ao conjunto coordenado fica clara e idiomática em português com a repetição de “àquela”.
- source_word: οὐδεὶς οἶδεν
  choice: ninguém sabe
  rationale: οὐδείς expressa negação universal, e οἶδα tem aqui sentido presente de “saber”. A formulação é direta e corrente.
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: nem os anjos dos céus
  rationale: οὐδέ acrescenta outro elemento negativo. “Nem” mantém com naturalidade a progressão da frase; “dos céus” conserva o plural do texto grego sem recorrer à paráfrase “celestiais”.
- source_word: οὐδὲ ὁ υἱός
  choice: nem o Filho
  rationale: A expressão coordena-se com os demais elementos negativos. O artigo indica um título reconhecido, por isso “Filho” recebe inicial maiúscula.
- source_word: εἰ μὴ
  choice: mas somente
  rationale: Depois de uma afirmação negativa, εἰ μή introduz a exceção. Em português, “mas somente” exprime essa exceção de modo claro no fim da enumeração.
- source_word: ὁ πατὴρ μόνος
  choice: o Pai
  rationale: Com “somente” já traduzindo a força restritiva de μόνος, “o Pai” completa a exceção sem redundância. “Pai” é grafado com inicial maiúscula por funcionar como título divino.
theological_decisions:
- issue: Implicação cristológica de “nem o Filho”
  choice: Manter integralmente “nem o Filho” no texto principal, sem atenuação nem explicação adicional.
  alternative: Omitir a expressão conforme parte da tradição manuscrita, ou parafraseá-la de modo a reduzir a tensão com a divindade do Filho.
  rationale: O texto da SBLGNT inclui οὐδὲ ὁ υἱός. A tradução preserva a afirmação e sua tensão teológica, sem tentar resolvê-la por omissão ou paráfrase.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. A construção mantém a progressão enfática do grego e preserva a variante textual em nota.
