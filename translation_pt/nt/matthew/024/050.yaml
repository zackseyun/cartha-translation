  text: the master of that slave will come on a day he does not expect and at an hour he does not know[b][a],
translation:
  language: pt
  text: O senhor[a] daquele escravo[b] virá num dia em que ele não o espera e numa hora que ele desconhece,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dono”. Aqui, “senhor” se refere ao superior humano na parábola.
    reason: lexical_alternative
  - marker: b
    text: Ou “servo”. O termo grego descreve alguém em uma relação de serviço vinculada; “escravo” ressalta a condição social presente neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξει
  choice: virá
  rationale: O futuro de ἥκω indica a vinda ou chegada; “virá” é direto e natural no contexto do retorno inesperado do senhor.
- source_word: κύριος
  choice: senhor
  rationale: No contexto imediato, designa o superior humano do escravo na parábola. “Senhor” preserva a relação social expressa pelo grego sem exigir que o termo seja lido aqui como título divino.
- source_word: δοῦλου
  choice: escravo
  rationale: δοῦλος designa alguém em condição de serviço compulsório e vinculado. Como a relação senhor–escravo é central na cena, “escravo” preserva melhor sua força social do que “servo”.
- source_word: ἐκείνου
  choice: daquele
  rationale: O demonstrativo retoma o escravo específico mencionado no contexto.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: num dia em que ele não o espera
  rationale: Mantém a referência temporal indefinida e torna natural em português a ideia de que o escravo não espera a vinda do senhor naquele dia.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: numa hora que ele não sabe
  rationale: Preserva o paralelismo entre “dia” e “hora” e o sentido simples de desconhecimento expresso por γινώσκω.
theological_decisions:
- issue: Sentido de κύριος no contexto doméstico da parábola
  choice: senhor
  alternative: dono
  rationale: Embora κύριος possa funcionar como título divino, nesta frase seu referente imediato é o superior humano do escravo. A tradução conserva a imagem narrativa sem eliminar a aplicação escatológica mais ampla da parábola.
- issue: Representação de δοῦλος
  choice: escravo
  alternative: servo
  rationale: A estrutura doméstica contrapõe explicitamente κύριος e δοῦλος. “Escravo” comunica a condição vinculada e a assimetria de autoridade sem suavizar a realidade social do termo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva a construção paralela “num dia... numa hora...” e mantém em minúscula “senhor” por se tratar do personagem humano no nível imediato da parábola.
