  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/019.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a].
translation:
  language: pt
  text: Ai das grávidas e das que amamentam naqueles dias!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ
  choice: ai
  rationale: Preserva a força exclamativa e profética de lamento diante da aflição iminente; em português bíblico atual, «ai» é mais direto e natural que uma paráfrase.
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição com leve contraste em relação à advertência anterior, sem torná-lo excessivamente forte.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: das que estiverem grávidas
  rationale: Traduz de modo idiomático a expressão grega «ter no ventre» e mantém a referência feminina indicada pelas formas gramaticais.
- source_word: ταῖς θηλαζούσαις
  choice: das que estiverem amamentando
  rationale: Expressa naturalmente a ação de θηλάζω. O objeto permanece implícito, como no grego, mas é claro no contexto.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: naqueles dias
  rationale: Equivalente temporal direto, corrente e digno em português.
theological_decisions:
- issue: Referente dos dativos e particípios femininos
  choice: Empregar «as que estiverem grávidas» e «as que estiverem amamentando», sem acrescentar o substantivo «mulheres».
  alternative: «as mulheres grávidas» e «as mulheres que estiverem amamentando»
  rationale: As formas gregas são femininas e identificam claramente as pessoas em vista. A construção escolhida preserva essa precisão sem acrescentar um substantivo ausente do texto e mantém o foco nas condições de especial vulnerabilidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a exclamação enfática do grego e usa o futuro do subjuntivo, natural em português para a situação projetada pelo discurso.
