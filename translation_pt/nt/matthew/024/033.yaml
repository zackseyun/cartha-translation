id: MAT.24.33
reference: Matthew 24:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ⸂πάντα ταῦτα⸃, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: pt
  text: Assim também vocês, quando virem todas essas coisas, saibam que está perto[a], às portas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ele está perto”. O grego não declara explicitamente o sujeito.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Assim também vocês
  rationale: Preserva a comparação com a ilustração anterior da figueira e a ênfase nos discípulos, em português natural e amplamente compreensível.
- source_word: ὅταν ἴδητε
  choice: quando virem
  rationale: Expressa naturalmente a construção temporal futura com ὅταν e o subjuntivo aoristo, sem sugerir repetição habitual.
- source_word: πάντα ταῦτα
  choice: todas essas coisas
  rationale: Mantém de modo explícito o plural neutro do grego, evitando acrescentar a interpretação mais específica de 'acontecimentos'.
- source_word: γινώσκετε
  choice: saibam
  rationale: Conserva a força imperativa da forma verbal e é idiomático no português contemporâneo.
- source_word: ἐγγύς
  choice: perto
  rationale: Equivalente direto e natural para a ideia de proximidade.
- source_word: ἐπὶ θύραις
  choice: às portas
  rationale: Preserva o plural grego e a expressão idiomática de extrema proximidade; 'às portas' é corrente e digna em português.
- source_word: ἐγγύς ἐστιν
  choice: está perto
  rationale: O português permite omitir o sujeito, como o grego, preservando melhor a ambiguidade entre uma referência pessoal e uma referência ao acontecimento ou à consumação.
theological_decisions:
- issue: Sujeito implícito de ἐγγύς ἐστιν
  choice: 'Manter o sujeito não expresso: ''está perto'''
  alternative: '''ele está perto'' ou ''isso está perto'''
  rationale: O texto grego não declara o sujeito. A omissão em português preserva a ambiguidade genuína sem decidir se a referência é ao Filho do Homem, aos acontecimentos, ao Reino ou à consumação.
translation_notes:
  register: Português moderno, digno e de leitura natural, com uso de 'vocês' para clareza ampla. A formulação conserva a concisão do grego, o imperativo e a imagem plural 'às portas'.
