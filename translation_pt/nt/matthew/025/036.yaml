  text: γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: pt
  text: Estive nu, e vocês me vestiram; estive doente, e vocês me visitaram[a]; estive na prisão, e vocês vieram até mim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cuidaram de mim”; o verbo grego pode incluir a ideia de visitar com atenção e cuidado.
    reason: lexical_alternative
  - marker: b
    text: Ou “vieram me ver”. Literalmente, “vieram até mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: nu
  rationale: É a correspondência direta e tradicional; no contexto, pode implicar falta de roupa adequada, e faz par naturalmente com “me vestiram”.
- source_word: περιεβάλετέ
  choice: me vestiram
  rationale: O verbo περιβάλλω indica pôr roupa ao redor ou sobre alguém; “vestiram” é natural e conciso em português.
- source_word: ἠσθένησα
  choice: estive doente
  rationale: Embora o verbo possa significar fraqueza em sentido mais amplo, neste contexto de assistência misericordiosa a referência mais provável é à doença.
- source_word: ἐπεσκέψασθέ
  choice: cuidaram de mim
  rationale: ἐπισκέπτομαι pode designar uma visita motivada por atenção e cuidado. Em português corrente, “visitaram-me” pode soar apenas social; “cuidaram de mim” comunica a dimensão de solicitude sem perder o contexto concreto.
- source_word: φυλακῇ
  choice: prisão
  rationale: φυλακή designa aqui um lugar de confinamento; “prisão” é o termo português padrão e suficientemente amplo.
- source_word: ἤλθατε πρός με
  choice: vieram me ver
  rationale: A expressão significa literalmente “vieram até mim”. “Vieram me ver” é uma formulação portuguesa natural no contexto de alguém preso, mantendo a ação distinta da assistência ao doente.
theological_decisions:
- issue: Grau de explicitação nas ações de misericórdia
  choice: Manter ações concretas e paralelas, traduzindo ἐπεσκέψασθέ με como “cuidaram de mim” e ἤλθατε πρός με como “vieram me ver”.
  alternative: 'Traduzir de modo mais estritamente formal: “visitaram-me” e “vieram até mim”.'
  rationale: O texto apresenta atos tangíveis de misericórdia, sem explicar seu alcance teológico. As escolhas preservam essa concretude e distinguem as duas ações; notas registram as formas mais literais e evitam ocultar a amplitude lexical.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com construção pronominal de boa legibilidade brasileira. A repetição de “estive” conserva o paralelismo, e as notas preservam a relação com a forma grega.
