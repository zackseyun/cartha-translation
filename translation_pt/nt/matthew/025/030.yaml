id: MAT.25.30
reference: Matthew 25:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὸν ἀχρεῖον δοῦλον ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/030.yaml
  text: And throw the worthless slave into the outer darkness[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: pt
  text: E lancem o escravo inútil nas trevas exteriores[a]. Ali haverá choro e ranger de dentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”. A palavra grega doulos pode significar “servo” ou “escravo”; aqui se usa “escravo” porque a condição de sujeição ao senhor se destaca no contexto da parábola.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀχρεῖον
  choice: inútil
  rationale: Expressa a avaliação de que o escravo não teve utilidade para o senhor no contexto da parábola, preservando a severidade sem sugerir que a pessoa careça de valor intrínseco.
- source_word: δοῦλον
  choice: escravo
  rationale: No cenário da parábola, a condição de sujeição ao senhor é saliente; “escravo” representa mais diretamente a relação social indicada por δοῦλος.
- source_word: ἐκβάλετε
  choice: lancem
  rationale: O imperativo aoristo é enérgico; “lancem” comunica uma expulsão abrupta em linguagem digna e corrente.
- source_word: σκότος τὸ ἐξώτερον
  choice: as trevas exteriores
  rationale: Preserva a expressão característica de Mateus e sua imagem de exclusão, sem acrescentar uma identificação doutrinária não explicitada no versículo.
- source_word: ἐκεῖ
  choice: Ali
  rationale: Retoma de maneira natural e enfática o lugar mencionado imediatamente antes.
- source_word: κλαυθμὸς
  choice: choro
  rationale: É uma tradução natural e consagrada para a manifestação de aflição indicada pelo substantivo.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: ranger de dentes
  rationale: Mantém a expressão idiomática tradicional, capaz de transmitir angústia e/ou ira sem decidir entre essas nuances.
theological_decisions:
- issue: Natureza da imagem de juízo na parábola
  choice: Manter as imagens de exclusão e aflição sem definir no texto traduzido se elas designam diretamente o juízo final, o inferno ou outra forma de punição.
  alternative: Explicitar que se trata do inferno ou, no sentido oposto, reduzir a imagem a uma exclusão apenas temporal ou metafórica.
  rationale: A linguagem é uma fórmula mateana de juízo, mas o versículo apresenta imagens, não uma explicação doutrinária completa; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo do grego são preservados sem rigidez; “trevas exteriores” e “ranger de dentes” mantêm as imagens características e reconhecíveis de Mateus.
