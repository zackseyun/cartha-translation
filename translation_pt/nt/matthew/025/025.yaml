id: MAT.25.25
reference: Matthew 25:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ φοβηθεὶς ἀπελθὼν ἔκρυψα τὸ τάλαντόν σου ἐν τῇ γῇ· ἴδε ἔχεις τὸ σόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/025.yaml
  text: And being afraid[a], I went away and hid your talent in the ground. Look, you have what is yours.
translation:
  language: pt
  text: E, com medo, fui e escondi o seu talento[a] no chão. Veja, aqui está o que é seu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma grande quantia de dinheiro”; o talento era uma unidade monetária de alto valor, não uma referência a uma capacidade natural.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθεὶς
  choice: com medo
  rationale: O particípio aoristo de φοβέομαι expressa a circunstância e o motivo declarado pelo servo. “Com medo” é natural em português e não transforma esse medo em temor reverencial.
- source_word: ἀπελθὼν
  choice: fui
  rationale: O particípio aoristo integra a sequência de ações anterior ao verbo principal. “Fui e escondi” mantém a ordem dos acontecimentos em português natural.
- source_word: ἔκρυψα
  choice: escondi
  rationale: Traduz diretamente κρύπτω como esconder ou ocultar. A ideia de enterrar já decorre de “no chão”, sem precisar ser acrescentada ao verbo.
- source_word: τὸ τάλαντόν σου
  choice: o seu talento
  rationale: “Talento” preserva o termo histórico para uma unidade de grande valor, enquanto a nota esclarece que aqui se trata de dinheiro, não de aptidão natural.
- source_word: ἐν τῇ γῇ
  choice: no chão
  rationale: Neste contexto, γῆ designa o solo onde o dinheiro foi escondido. “No chão” é claro, corrente e adequado à cena.
- source_word: ἴδε
  choice: Veja
  rationale: Mantém a função de chamar a atenção do interlocutor em linguagem moderna e digna, sem o arcaísmo de “eis” ou “vede”.
- source_word: ἔχεις τὸ σόν
  choice: aqui está o que é seu
  rationale: A formulação portuguesa expressa naturalmente a construção elíptica grega e preserva a ênfase na propriedade do senhor.
theological_decisions:
- issue: Sentido de τάλαντον numa parábola frequentemente associada a capacidades naturais
  choice: Manter “talento” no texto como termo monetário histórico e esclarecer seu sentido numa nota.
  alternative: “uma grande quantia de dinheiro”
  rationale: O grego se refere a uma unidade de peso ou dinheiro de alto valor, não a uma capacidade inata. A manutenção do termo histórico preserva a forma literária da parábola, e a nota impede a leitura anacrônica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sequência “fui e escondi” reproduz naturalmente a relação entre o particípio e o verbo principal; “Veja” conserva o chamado de atenção direto.
