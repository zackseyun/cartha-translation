  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: pt
  text: 'E o que tinha recebido os cinco talentos[a] aproximou-se e trouxe outros cinco talentos, dizendo: “Senhor[b], entregaste-me cinco talentos; olha, ganhei outros cinco talentos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um talento era uma grande unidade de peso e de valor monetário.
    reason: cultural_note
  - marker: b
    text: 'Ou “Mestre”. Grego: Kyrios.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν
  choice: aproximou-se
  rationale: O particípio aoristo de προσέρχομαι descreve a aproximação do servo para prestar contas; a forma coordenada é mais natural em português e preserva a sequência da cena.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: o que tinha recebido os cinco talentos
  rationale: A construção participial substantivada identifica o servo pelo recebimento anterior; o mais-que-perfeito composto expressa claramente essa anterioridade sem acrescentar “homem” ou “servo” ao texto.
- source_word: τάλαντα
  choice: talentos
  rationale: Mantém o termo histórico para uma grande unidade de peso e valor monetário, sem restringir indevidamente o material ou a quantia; a nota esclarece o sentido antigo.
- source_word: προσήνεγκεν
  choice: trouxe
  rationale: Neste contexto, προσφέρω indica trazer a quantia adicional diante do senhor; “trouxe” é direto e evita a possível conotação cultual de “ofereceu”.
- source_word: ἄλλα πέντε τάλαντα
  choice: outros cinco
  rationale: ἄλλα indica uma quantia adicional igual. A elipse de “talentos” na primeira ocorrência portuguesa evita repetição pesada, enquanto o objeto continua inequívoco; a repetição completa é preservada na fala.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva o vocativo κύριε e tanto seu sentido social na parábola quanto sua possível ressonância narrativa mais ampla.
- source_word: παρέδωκας
  choice: entregaste-me
  rationale: Traduz de perto a ideia de entregar ou passar algo a alguém, sem explicitar como “confiaste” uma noção apenas implícita.
- source_word: ἴδε
  choice: olha
  rationale: Funciona como chamamento de atenção direto e atual, preservando a força dêitica do imperativo grego sem recorrer ao mais arcaizante “eis”.
- source_word: ἐκέρδησα
  choice: ganhei
  rationale: κερδαίνω significa obter ganho ou lucro; “ganhei” é preciso e natural, sem sugerir pagamento por trabalho, como poderia ocorrer com “mereci” ou “recebi”.
theological_decisions:
- issue: Tradução de κύριος no tratamento dentro da parábola
  choice: Senhor
  alternative: Patrão; mestre
  rationale: No nível da narrativa, o termo designa o senhor do servo, mas “Senhor” mantém a correspondência lexical e a possível ressonância teológica de Mateus sem afirmar que o vocábulo, isoladamente, seja uma identificação cristológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O uso de “entregaste-me” e “olha” mantém coerência na segunda pessoa do singular e conserva o tom de fala direta sem arcaísmo excessivo.
