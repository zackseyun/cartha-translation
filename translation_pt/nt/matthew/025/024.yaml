  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν· Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: pt
  text: 'Então, aproximou-se também aquele que tinha recebido um talento e disse: “Senhor, eu sabia que és um homem duro[a], que colhes onde não semeaste e recolhes de onde não espalhaste[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “severo” ou “áspero”. A palavra grega pode expressar dureza, severidade ou aspereza.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “recolhes de onde não espalhaste”. O objeto do verbo “espalhar” não é expresso no grego; pelo contexto agrícola, pode estar implícita a ideia de semente.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: aproximou-se
  rationale: O particípio aoristo introduz o movimento do servo antes de falar. “Aproximou-se” expressa com clareza a ação de chegar diante do senhor.
- source_word: δὲ καὶ
  choice: Então ... também
  rationale: “Então” marca o avanço da narrativa, e “também” inclui este servo entre os que se apresentaram.
- source_word: ὁ τὸ ἓν τάλαντον εἰληφὼς
  choice: aquele que tinha recebido um talento
  rationale: Preserva a construção identificadora e representa o aspecto anterior do particípio perfeito sem acrescentar “homem” ou “servo” neste ponto.
- source_word: τάλαντον
  choice: talento
  rationale: Mantém o termo monetário antigo e sua ressonância na parábola, sem substituí-lo por uma estimativa moderna de valor.
- source_word: Κύριε
  choice: Senhor
  rationale: É uma forma natural e respeitosa de tratamento no contexto da parábola e preserva a correspondência tradicional de κύριος.
- source_word: ἔγνων σε ὅτι
  choice: eu sabia que és
  rationale: Em português, esta construção transmite naturalmente a alegação do servo sobre o caráter do senhor. Evita o pouco idiomático “eu te conheci, que és” sem ampliar o sentido.
- source_word: σκληρὸς
  choice: duro
  rationale: “Duro” conserva a metáfora e a amplitude de σκληρός, que pode indicar dureza, severidade ou aspereza, sem intensificar automaticamente a acusação.
- source_word: θερίζων ὅπου οὐκ ἔσπειρας
  choice: que colhes onde não semeaste
  rationale: Mantém a imagem agrícola e o paralelismo entre colher e semear.
- source_word: συνάγων ὅθεν οὐ διεσκόρπισας
  choice: e ajuntas de onde não espalhaste
  rationale: Segue de perto a formulação grega, inclusive a noção de origem em ὅθεν, sem acrescentar um objeto como “semente”, ausente do texto.
theological_decisions:
- issue: Tratamento de κύριος dentro da parábola
  choice: Senhor
  alternative: patrão
  rationale: “Senhor” preserva a forma de tratamento do grego e não impede que, no nível narrativo, a palavra designe o senhor dos servos.
- issue: Caracterização do senhor pelo servo
  choice: A acusação é apresentada como fala e percepção do servo, com “homem duro”.
  alternative: homem severo ou cruel
  rationale: “Duro” preserva a tensão quanto à veracidade e ao alcance da acusação, sem endossá-la nem agravá-la interpretativamente.
- issue: Objeto implícito de διεσκόρπισας
  choice: Não explicitar o objeto no texto principal.
  alternative: acrescentar “semente”
  rationale: O contexto agrícola pode sugerir sementes, mas o grego não nomeia o objeto. A tradução preserva essa abertura e esclarece a questão em nota.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com formas de segunda pessoa singular (“és”, “semeaste”, “espalhaste”) para manter concordância natural com o vocativo “Senhor”. A sintaxe final permanece deliberadamente próxima do grego para não suprir um objeto ausente.
