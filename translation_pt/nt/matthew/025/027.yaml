source:
  edition: SBLGNT
  text: ἔδει ⸂σε οὖν⸃ βαλεῖν ⸂τὰ ἀργύριά⸃ μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/027.yaml
  text: Therefore[a], you should have deposited my money with the bankers, and when I came, I would have received what was mine with interest.
translation:
  language: pt
  text: Portanto, você deveria ter depositado o meu dinheiro com os banqueiros; e, ao voltar, eu teria recebido o que era meu com juros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδει
  choice: você deveria ter
  rationale: O imperfeito impessoal expressa o que era exigido ou apropriado no passado; a formulação preserva a força de censura em português natural.
- source_word: οὖν
  choice: Portanto
  rationale: Marca a conclusão inferida da acusação anterior e mantém clara a progressão lógica.
- source_word: βαλεῖν
  choice: depositado
  rationale: Embora o verbo tenha o sentido básico de pôr ou colocar, sua combinação com banqueiros e juros indica aqui a ação financeira de depositar.
- source_word: τὰ ἀργύριά μου
  choice: o meu dinheiro
  rationale: ἀργύριον pode designar prata ou dinheiro; no contexto comercial da parábola, “dinheiro” comunica com naturalidade o sentido funcional.
- source_word: τραπεζίταις
  choice: os banqueiros
  rationale: O termo designa pessoas que lidavam com câmbio ou operações bancárias; a referência a depósito e juros favorece “banqueiros”.
- source_word: ἐλθὼν ἐγὼ
  choice: ao voltar
  rationale: O particípio aoristo indica uma circunstância temporal anterior ao recebimento; “ao voltar” é natural no contexto do retorno do senhor.
- source_word: ἐκομισάμην ἂν
  choice: eu teria recebido
  rationale: A forma média com ἄν apresenta o resultado que teria ocorrido numa situação contrária ao fato; o português condicional composto preserva esse valor.
- source_word: τὸ ἐμὸν
  choice: o que era meu
  rationale: O possessivo substantivado enfatiza aquilo que pertencia ao senhor.
- source_word: σὺν τόκῳ
  choice: com juros
  rationale: τόκος designa aqui o rendimento do dinheiro depositado; “juros” é o termo moderno, claro e neutro.
theological_decisions:
- issue: Linguagem financeira da parábola e possível interpretação moral dos juros
  choice: Traduzir os termos financeiros diretamente e de modo neutro, como parte da imagem da parábola.
  alternative: Empregar “usura” para evocar debates morais tradicionais sobre empréstimos.
  rationale: O versículo não formula uma avaliação geral da cobrança de juros; uma tradução neutra evita importar debates teológicos posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” corresponde ao singular σε. A pontuação conserva a relação entre a obrigação não cumprida e o resultado hipotético.
