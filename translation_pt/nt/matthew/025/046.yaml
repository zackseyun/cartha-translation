base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/046.yaml
  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: pt
  text: E estes irão para o castigo eterno[a], mas os justos, para a vida eterna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “castigo da era” [...] “vida da era”. O sentido do adjetivo grego αἰώνιος é debatido em alguns contextos; aqui, porém, a mesma palavra qualifica tanto “castigo” quanto “vida”, e por isso a tradução preserva o paralelismo usando “eterno” nas duas orações.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: irão
  rationale: O futuro médio de ἀπέρχομαι indica que partirão ou irão para o destino mencionado. “Irão” é natural em português e, com o complemento introduzido por “para”, preserva o sentido de movimento sem acréscimo interpretativo.
- source_word: οὗτοι
  choice: estes
  rationale: O pronome demonstrativo retoma o grupo descrito anteriormente e mantém de modo conciso o contraste com “os justos”.
- source_word: κόλασιν
  choice: castigo
  rationale: Neste contexto de juízo, κόλασις designa uma consequência punitiva. “Castigo” é claro, corrente e adequado ao registro bíblico em português.
- source_word: αἰώνιον
  choice: eterno
  rationale: O mesmo adjetivo qualifica tanto “castigo” quanto “vida”. “Eterno” é a tradução portuguesa mais natural neste contexto e preserva a simetria do grego nas duas orações.
- source_word: δίκαιοι
  choice: os justos
  rationale: O adjetivo substantivado designa pessoas caracterizadas ou reconhecidas como justas. “Os justos” é idiomático e conserva o sentido moral e judicial.
- source_word: ζωὴν
  choice: vida
  rationale: Equivalente direto e natural de ζωή, sem necessidade de explicitação adicional.
- source_word: δὲ
  choice: mas
  rationale: A conjunção marca o contraste entre os dois grupos e seus respectivos destinos; “mas” expressa claramente essa força adversativa.
theological_decisions:
- issue: Tradução de αἰώνιον nas expressões paralelas κόλασιν αἰώνιον e ζωὴν αἰώνιον
  choice: Traduzir αἰώνιον por “eterno” nas duas orações
  alternative: “Duradouro por uma era” ou “da era” nas duas orações
  rationale: Como o mesmo adjetivo modifica “castigo” e “vida”, a tradução mantém o paralelismo sem atribuir silenciosamente duração ou qualidade diferente aos dois destinos. “Eterno” é a opção mais natural e tradicional em português, enquanto a alternativa lexical debatida é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A elipse do verbo na segunda oração reproduz naturalmente o paralelismo conciso do grego; a vírgula após “os justos” assinala a omissão de “irão”.
