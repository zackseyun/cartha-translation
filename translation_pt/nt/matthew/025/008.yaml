  text: αἱ δὲ μωραὶ ταῖς φρονίμοις εἶπαν· Δότε ἡμῖν ἐκ τοῦ ἐλαίου ὑμῶν, ὅτι αἱ λαμπάδες ἡμῶν σβέννυνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/008.yaml
  text: But the foolish said to the wise[a], ‘Give us some of your oil, because our lamps are going out.’
translation:
  language: pt
  text: 'Mas as insensatas disseram às prudentes: “Deem-nos um pouco do seu óleo, porque nossas lâmpadas[a] estão se apagando.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tochas”. O termo grego λαμπάδες pode se referir a uma fonte portátil de luz alimentada por fogo; a identificação exata depende de como se entende a cena.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωραὶ
  choice: as insensatas
  rationale: Adjetivo substantivado que retoma as virgens da parábola. “Insensatas” mantém o contraste moral e prático com φρονίμοις e é corrente no registro bíblico português.
- source_word: φρονίμοις
  choice: às prudentes
  rationale: Neste contexto, designa sabedoria prática e preparo. “Prudentes” expressa essa nuance com naturalidade e forma um contraste claro com “insensatas”.
- source_word: Δότε
  choice: Deem-nos
  rationale: Imperativo aoristo plural de δίδωμι. A forma “deem” comunica diretamente o pedido dirigido ao grupo; o pronome “-nos” representa ἡμῖν.
- source_word: ἐκ τοῦ ἐλαίου ὑμῶν
  choice: um pouco do seu óleo
  rationale: A construção com ἐκ tem sentido partitivo. “Um pouco do seu óleo” torna explícita, de modo natural, a solicitação de uma porção da reserva delas.
- source_word: λαμπάδες
  choice: lâmpadas
  rationale: λαμπάς pode designar uma lâmpada ou uma tocha. “Lâmpadas” é natural no contexto do óleo e amplamente compreensível, enquanto a alternativa lexical é preservada em nota.
- source_word: σβέννυνται
  choice: estão se apagando
  rationale: O presente retrata o processo em andamento. “Estão se apagando” preserva esse aspecto e é idiomático em português.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão do pedido; “porque” expressa claramente a relação causal em português contemporâneo.
