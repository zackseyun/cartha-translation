  text: ⸂αἱ γὰρ⸃ μωραὶ λαβοῦσαι τὰς λαμπάδας αὐτῶν οὐκ ἔλαβον μεθ’ ἑαυτῶν ἔλαιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/003.yaml
  text: For the foolish[a], when they took their lamps, did not take oil with them.
translation:
  language: pt
  text: Pois as insensatas, ao pegarem suas lamparinas[a], não levaram óleo consigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tochas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e preserva de modo natural a força conectiva do grego.
- source_word: μωραὶ
  choice: as insensatas
  rationale: O adjetivo feminino plural retoma as moças virgens mencionadas no contexto; a forma substantivada evita repetição desnecessária e mantém a caracterização.
- source_word: λαβοῦσαι
  choice: ao pegarem
  rationale: Expressa naturalmente o particípio aoristo com valor temporal e mantém a relação com a ação principal.
- source_word: λαμπάδας
  choice: lamparinas
  rationale: É uma tradução corrente de λαμπάς neste contexto e combina naturalmente com a menção ao óleo, embora “tochas” também seja possível.
- source_word: οὐκ ἔλαβον
  choice: não levaram
  rationale: Em português, “levar” comunica com naturalidade que elas não trouxeram consigo uma provisão de óleo; evita a repetição pouco idiomática de “pegar”.
- source_word: μεθ’ ἑαυτῶν
  choice: consigo
  rationale: Equivalente português conciso e idiomático da expressão reflexiva.
- source_word: ἔλαιον
  choice: óleo
  rationale: Tradução direta do substantivo, que no contexto designa o combustível das lamparinas ou tochas.
