  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those slaves comes and settles accounts with them.
translation:
  language: pt
  text: Depois de muito tempo, o senhor daqueles escravos[a] chega e acerta contas com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o dono daqueles servos chega e acerta contas com eles”. O grego κύριος pode significar “senhor” ou “dono”, e δοῦλοι pode ser traduzido por “escravos” ou “servos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: Depois de muito tempo
  rationale: μετά com o acusativo χρόνον indica sucessão temporal. O δέ é um conectivo leve, e a progressão narrativa já fica natural em português sem acrescentar “então” ou “ora”.
- source_word: ἔρχεται
  choice: volta
  rationale: O presente histórico grego dá vivacidade à narrativa. No contexto, o senhor havia viajado (25.14–15), de modo que “volta” exprime naturalmente sua chegada de regresso sem abandonar o presente narrativo.
- source_word: ὁ κύριος
  choice: o senhor
  rationale: Aqui κύριος designa o homem que exerce autoridade sobre os escravos da parábola. “Senhor” é natural em português para essa relação e preserva a possível ressonância mais ampla do termo sem transformá-lo explicitamente em título cristológico.
- source_word: τῶν δούλων ἐκείνων
  choice: daqueles escravos
  rationale: δοῦλος pode ser traduzido por “servo” ou “escravo”; neste cenário econômico doméstico, a condição de sujeição é relevante, e “escravos” a comunica de modo mais preciso.
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: acerta contas com eles
  rationale: A expressão idiomática significa fazer ou ajustar contas com alguém. “Acerta contas” é português corrente e mantém o sentido contábil imediato da parábola, embora a expressão também possa sugerir prestação de contas.
theological_decisions:
- issue: Tradução de κύριος na parábola
  choice: o senhor
  alternative: o dono; o mestre
  rationale: O referente imediato é o homem da parábola, não uma ocorrência inequívoca do título divino. “Senhor” expressa a autoridade social e preserva a ambiguidade potencial do grego; o contexto fornece a significação parabólica sem impô-la lexicalmente.
- issue: Tradução de δοῦλος
  choice: escravos
  alternative: servos
  rationale: A relação de domínio e a administração de bens confiados tornam saliente a condição não livre indicada por δοῦλοι. “Servos” seria possível, mas suavizaria essa dimensão social.
translation_notes:
  register: Português moderno, claro e digno, com presente narrativo. “Acerta contas” conserva a imagem econômica da parábola; a nota registra alternativas relevantes para κύριος e δοῦλοι.
