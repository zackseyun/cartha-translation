  text: τότε ἠγέρθησαν πᾶσαι αἱ παρθένοι ἐκεῖναι καὶ ἐκόσμησαν τὰς λαμπάδας ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/007.yaml
  text: Then all those virgins got up and trimmed their lamps[a].
translation:
  language: pt
  text: Então todas aquelas virgens se levantaram e prepararam suas lamparinas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tochas”, em vez de “lamparinas” (grego λαμπάδας); o termo pode designar uma fonte de luz portátil, e o contexto de óleo e preparação permite ambas as traduções.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca naturalmente o próximo acontecimento da sequência narrativa.
- source_word: ἠγέρθησαν
  choice: se levantaram
  rationale: No contexto de terem adormecido, indica que se ergueram do sono; a forma portuguesa é natural e não força o sentido alternativo de que foram despertadas.
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: todas aquelas virgens
  rationale: Preserva a totalidade, o demonstrativo e o sentido lexical específico de παρθένοι no contexto de casamento.
- source_word: ἐκόσμησαν
  choice: prepararam
  rationale: κοσμέω significa pôr em ordem ou deixar pronto. Aqui descreve o cuidado necessário para que as fontes de luz fossem usadas, sem acrescentar detalhes não explicitados, como cortar o pavio.
- source_word: λαμπάδας
  choice: lamparinas
  rationale: λαμπάς pode designar lamparina ou tocha. 'Lamparinas' combina bem com a menção ao óleo no contexto e é mais clara em português corrente; a alternativa genuína é preservada em nota.
- source_word: ἑαυτῶν
  choice: suas
  rationale: Expressa de modo natural a posse reflexiva no plural; 'suas próprias' acrescentaria uma ênfase desnecessária.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. 'Lamparinas' evita a possível associação moderna de 'lâmpadas' com iluminação elétrica; 'prepararam' preserva a ação contextual sem explicitar um procedimento técnico não declarado no grego.
