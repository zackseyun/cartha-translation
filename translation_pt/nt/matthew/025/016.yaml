  text: ⸀πορευθεὶς ὁ τὰ πέντε τάλαντα λαβὼν ἠργάσατο ἐν αὐτοῖς καὶ ⸀ἐκέρδησεν ἄλλα ⸀πέντε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/016.yaml
  text: The one who had received the five talents went and worked with them[b][a], and gained another five.
translation:
  language: pt
  text: Aquele que tinha recebido os cinco talentos[b] foi e trabalhou com eles[a], e ganhou outros cinco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi embora e trabalhou com eles”; o grego descreve o emprego ativo do dinheiro para obter lucro.'
    reason: lexical_alternative
  - marker: b
    text: Um talento era uma unidade monetária de grande valor, não uma aptidão natural.
    reason: cultural_note
lexical_decisions:
- source_word: πορευθεὶς
  choice: foi
  rationale: O particípio aoristo pode ser expresso naturalmente em português por um verbo coordenado. Não se acrescenta “imediatamente”, pois essa ideia não está explícita no grego.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: aquele que tinha recebido os cinco talentos
  rationale: A construção participial com artigo identifica o servo pelo que recebeu; o mais-que-perfeito composto deixa clara a anterioridade do recebimento.
- source_word: τάλαντα
  choice: talentos
  rationale: Mantém o termo histórico e tradicional, enquanto a nota esclarece que se trata de uma grande unidade monetária, não de uma aptidão natural.
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: trabalhou com eles
  rationale: Reproduz de modo direto a ideia de empregar ativamente os valores recebidos, sem limitar o modo de obtenção do lucro à atividade específica de comércio.
- source_word: ἐκέρδησεν
  choice: ganhou
  rationale: No contexto financeiro, expressa com naturalidade a obtenção de lucro ou aumento.
- source_word: ἄλλα πέντε
  choice: outros cinco
  rationale: Forma portuguesa natural que preserva o sentido aditivo da expressão grega.
