  text: ὁ δὲ τὸ ἓν λαβὼν ἀπελθὼν ὤρυξεν ⸀γῆν καὶ ⸀ἔκρυψεν τὸ ἀργύριον τοῦ κυρίου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/018.yaml
  text: But the one who had received the one talent went away[a], dug in the ground, and hid his master's money.
translation:
  language: pt
  text: Mas o que tinha recebido um talento foi embora, cavou na terra e escondeu o dinheiro[a] do seu senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «a prata do seu senhor».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Mas o que
  rationale: δέ introduz contraste com os servos anteriores, e o artigo substantivado identifica o servo pelo que recebeu.
- source_word: τὸ ἓν
  choice: um talento
  rationale: O grego traz literalmente «o um», retomando por elipse o talento mencionado em Mateus 25:15; explicitar «talento» dá clareza sem acrescentar conteúdo novo.
- source_word: λαβὼν
  choice: tinha recebido
  rationale: O particípio indica uma ação anterior às ações principais e, no contexto, o servo recebeu do senhor o valor que lhe foi confiado.
- source_word: ἀπελθὼν
  choice: foi embora
  rationale: Expressa de maneira natural o movimento de afastamento anterior às ações seguintes.
- source_word: ὤρυξεν γῆν
  choice: cavou no chão
  rationale: Reproduz de modo idiomático e sóbrio o ato de escavar a terra, sem explicitar desnecessariamente que abriu um buraco.
- source_word: ἔκρυψεν
  choice: escondeu
  rationale: É o equivalente comum e direto de κρύπτω neste contexto.
- source_word: τὸ ἀργύριον
  choice: o dinheiro
  rationale: ἀργύριον pode significar prata ou dinheiro; no contexto dos valores confiados aos servos, «dinheiro» comunica melhor a função, enquanto a nota preserva o sentido material literal.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: do seu senhor
  rationale: κύριος designa aqui a autoridade humana do servo dentro da parábola. «Senhor» é natural em português e preserva a relação de subordinação sem exigir que a expressão seja lida como título divino.
theological_decisions:
- issue: Tradução de κύριος em referência humana dentro da parábola
  choice: senhor
  alternative: mestre
  rationale: O referente imediato é o superior humano do servo no mundo narrativo. «Senhor» preserva a amplitude lexical de κύριος e é idiomático na expressão «seu senhor», sem resolver a possível ressonância parabólica como se fosse uma identificação divina explícita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A construção conserva o contraste narrativo, a sequência das ações e a distinção entre o talento recebido e o dinheiro escondido.
