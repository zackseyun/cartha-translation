id: MAT.25.29
reference: Matthew 25:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· ⸂τοῦ δὲ⸃ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/029.yaml
  text: For to everyone who has[a], more will be given, and he will have an abundance; but from the one who does not have, even what he has will be taken away from him.
translation:
  language: pt
  text: Pois, a todo aquele que tem, será dado, e ele terá em abundância; mas, daquele que não tem, até o que tem será tirado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ γὰρ ἔχοντι παντὶ
  choice: Pois a todo o que tem
  rationale: A construção com particípio articular e παντί tem sentido substantivo e distributivo. A formulação preserva o singular genérico e a ligação explicativa de γάρ com o contexto anterior.
- source_word: δοθήσεται
  choice: será dado
  rationale: Mantém com naturalidade o futuro passivo de δίδωμι, sem explicitar o agente.
- source_word: καὶ περισσευθήσεται
  choice: e ele terá em abundância
  rationale: Expressa o resultado de possuir em excesso ou abundantemente. Em português corrente, «terá em abundância» comunica o sentido com mais naturalidade que «abundará» neste contexto.
- source_word: τοῦ δὲ μὴ ἔχοντος
  choice: mas daquele que não tem
  rationale: Preserva o contraste introduzido por δέ e o particípio substantivado no singular representativo.
- source_word: καὶ ὃ ἔχει
  choice: até o que tem
  rationale: 'Aqui καί tem força ascensiva: «até/mesmo». «Até» realça naturalmente em português o caráter paradoxal da afirmação.'
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: lhe será tirado
  rationale: Mantém o futuro passivo e a ideia de remoção/separação. O pronome «lhe» evita uma repetição pesada sem alterar a referência.
theological_decisions:
- issue: Referência masculina genérica nas construções participiais
  choice: Preservar o singular representativo com «todo o que», «ele» e «daquele»
  alternative: Empregar o plural genérico («todos os que têm») ou reformular para evitar pronomes
  rationale: O grego emprega formas masculinas singulares com valor genérico. A tradução conserva a estrutura singular da máxima sem restringir seu alcance a homens.
- issue: Agente dos futuros passivos
  choice: Conservar os passivos «será dado» e «será tirado» sem nomear o agente
  alternative: Explicitar Deus ou o senhor da parábola como agente
  rationale: O texto grego não identifica expressamente o agente; explicitá-lo resolveria uma ambiguidade que deve permanecer.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação mantém o paralelismo e o contraste do original, evitando arcaísmos e explicações interpretativas inseridas no versículo.
