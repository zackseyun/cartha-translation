  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: pt
  text: 'Mas seu senhor lhe respondeu: “Servo mau e preguiçoso, você sabia que colho onde não semeei e recolho de onde não espalhei?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Servo mau e preguiçoso, você sabia que colho onde não semeei e recolho de onde não espalhei.” O grego também pode ser entendido como uma declaração, e não como uma pergunta retórica. A palavra traduzida por “servo” também pode significar “escravo”, conforme o contexto.'
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Mas ... respondeu
  rationale: A fórmula narrativa com δέ admite uma transição levemente adversativa; esta construção é natural em português e evita o redundante «respondeu e disse».
- source_word: ὁ κύριος αὐτοῦ
  choice: o senhor dele
  rationale: No contexto da parábola, κύριος designa aquele que exerce autoridade sobre o servo. «Senhor» preserva a relação hierárquica sem transformar a expressão em título cristológico direto.
- source_word: Πονηρὲ
  choice: mau
  rationale: Aqui πονηρός expressa uma censura moral. «Mau» é claro, atual e apropriado ao registro, embora «perverso» fosse uma alternativa mais forte.
- source_word: δοῦλε
  choice: servo
  rationale: δοῦλος pode designar servo ou escravo. «Servo» é tradicional, inteligível e adequado à linguagem parabólica, mas mantém-se a possibilidade histórica e lexical de «escravo» em nota.
- source_word: ὀκνηρέ
  choice: preguiçoso
  rationale: ὀκνηρός caracteriza quem reluta em agir ou não se empenha; «preguiçoso» comunica diretamente essa censura em português atual.
- source_word: ᾔδεις
  choice: você sabia
  rationale: A forma de οἶδα indica conhecimento atribuído ao servo. «Você sabia» é natural e preserva a ambiguidade pragmática entre declaração irônica e pergunta retórica por meio da pontuação.
- source_word: θερίζω ὅπου οὐκ ἔσπειρα
  choice: colho onde não semeei
  rationale: Mantém de modo conciso a imagem agrícola e o contraste entre colher e semear.
- source_word: συνάγω ὅθεν οὐ διεσκόρπισα
  choice: recolho de onde não espalhei
  rationale: «Recolho» representa συνάγω, enquanto «de onde» preserva o valor de procedência de ὅθεν. Não se acrescenta «semente», pois o objeto não está expresso no grego, preservando a imagem deliberadamente compacta.
theological_decisions:
- issue: Força da fala final e pontuação
  choice: 'Pergunta retórica: «você sabia que...?»'
  alternative: 'Declaração: «Você sabia que colho onde não semeei e recolho de onde não espalhei.»'
  rationale: O grego não traz sinal de interrogação e permite ambas as leituras. A pergunta retórica se ajusta à resposta irônica do senhor, que volta contra o servo a alegação do versículo anterior; a leitura declarativa é registrada em nota para não eliminar a ambiguidade.
- issue: Referência de κύριος na parábola
  choice: «o senhor dele», em sentido narrativo
  alternative: «o mestre dele» ou leitura explicitamente cristológica de «Senhor»
  rationale: Neste nível do relato, o termo identifica o superior do servo. A tradução não impõe nem exclui uma aplicação cristológica da parábola.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com «você» para a segunda pessoa singular. A formulação evita «respondeu e disse», pouco natural em português, e conserva a concisão e a tensão da imagem agrícola. O único marcador, [a], aparece no texto principal e reúne duas alternativas estreitamente ligadas à interpretação da fala.
