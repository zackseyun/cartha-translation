  text: καὶ ᾧ μὲν ἔδωκεν πέντε τάλαντα ᾧ δὲ δύο ᾧ δὲ ἕν, ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν, καὶ ἀπεδήμησεν. εὐθέως
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/015.yaml
  text: And to one he gave five talents[a], to another two, and to another one, to each according to his own ability[b]; and he went away immediately.
translation:
  language: pt
  text: E a um deu cinco talentos[a], a outro, dois, e a outro, um, a cada um segundo a sua própria capacidade; e partiu imediatamente.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um talento era uma grande unidade de peso usada como medida de valor monetário; aqui não significa uma aptidão ou habilidade natural.
    reason: lexical_clarification
  - marker: b
    text: 'Ou, ligando o advérbio ao início do versículo seguinte: «Partiu. Imediatamente, o que havia recebido...»'
    reason: textual_syntactic_ambiguity
lexical_decisions:
- source_word: τάλαντα
  choice: talentos
  rationale: Mantém o termo histórico para uma grande unidade de peso e, por extensão, de valor monetário. A nota impede que o leitor o confunda com aptidão natural no sentido moderno.
- source_word: ᾧ μὲν ... ᾧ δὲ ... ᾧ δὲ
  choice: a um ... a outro ... e a outro
  rationale: Reproduz de modo natural em português a distribuição contrastiva entre os três servos.
- source_word: ἕν
  choice: um
  rationale: O substantivo «talento» fica elíptico, como no grego, e é facilmente recuperado do contexto.
- source_word: ἑκάστῳ
  choice: a cada um
  rationale: Expressa diretamente a força distributiva do dativo singular.
- source_word: κατὰ τὴν ἰδίαν δύναμιν
  choice: conforme a sua própria capacidade
  rationale: Neste contexto, δύναμις indica capacidade pessoal, não poder miraculoso. A formulação singular conserva a construção distributiva sem identificar «talento» com aptidão.
- source_word: ἀπεδήμησεν
  choice: partiu
  rationale: Verbo natural e conciso para a partida do senhor; o contexto anterior já estabelece a viagem.
- source_word: εὐθέως
  choice: imediatamente
  rationale: Preserva o valor temporal do advérbio, enquanto a nota registra a possível ligação com o que segue.
- source_word: καὶ
  choice: A
  rationale: A abertura continua naturalmente a frase e a narrativa do versículo anterior sem acrescentar uma relação interpretativa.
theological_decisions:
- issue: Sentido de τάλαντα na parábola
  choice: talentos como unidades de peso e valor monetário
  alternative: grandes quantias de dinheiro
  rationale: O contexto trata de bens confiados aos servos. A tradução conserva o termo histórico, mas esclarece que aqui não significa aptidões naturais.
- issue: Referência singular na expressão distributiva
  choice: a cada um conforme a sua própria capacidade
  alternative: a cada qual conforme a própria capacidade
  rationale: A formulação mantém o singular distributivo de ἑκάστῳ e ἰδίαν, sem converter a declaração em plural nem acrescentar uma interpretação teológica.
- issue: Ligação sintática de εὐθέως
  choice: 'com a partida: «partiu imediatamente»'
  alternative: 'com a ação do versículo seguinte: «Imediatamente, o que havia recebido...»'
  rationale: A ausência de pontuação nos manuscritos antigos permite ambas as ligações. A ordem transmitida admite a ligação com ἀπεδήμησεν, adotada no texto, mas a alternativa é genuína e fica preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Mantém-se «talentos» por sua precisão histórica e familiaridade, acompanhado de esclarecimento indispensável. As vírgulas marcam com naturalidade a sequência distributiva.
