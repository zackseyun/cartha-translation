source:
  edition: SBLGNT
  text: τότε ἀποκριθήσεται αὐτοῖς λέγων· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: pt
  text: 'Então ele lhes responderá: “Em verdade lhes digo: na medida em que vocês não fizeram isso por um destes pequeninos[a], também não o fizeram por mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Estes pequeninos” pode referir-se especificamente aos discípulos de Jesus ou, de modo mais amplo, aos humildes e necessitados; a tradução conserva a expressão do texto sem definir seu referente.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca a sequência temporal na cena do julgamento de modo natural e direto.
- source_word: ἀποκριθήσεται αὐτοῖς λέγων
  choice: ele lhes responderá
  rationale: Expressa o futuro de ἀποκρίνομαι e incorpora o particípio de fala sem a redundância pouco natural de «responderá, dizendo».
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Em verdade lhes digo
  rationale: Preserva a fórmula solene e enfática de Jesus em português atual e digno.
- source_word: ἐφ’ ὅσον
  choice: na medida em que
  rationale: Conserva a nuance de medida ou correspondência da expressão, sem reduzi-la simplesmente a «porque».
- source_word: οὐκ ἐποιήσατε
  choice: vocês não fizeram isso por
  rationale: O objeto implícito é recuperado do contexto anterior; «por» comunica naturalmente a ação em benefício de alguém.
- source_word: ἑνὶ τούτων τῶν ἐλαχίστων
  choice: um destes menores
  rationale: Mantém o singular representativo ἑνί e o superlativo substantivado ἐλαχίστων, sem identificar além do que o texto declara quem integra o grupo.
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: também não o fizeram por mim
  rationale: Reproduz a conclusão negativa correlata e a identificação enfática com Jesus, usando uma formulação natural em português.
theological_decisions:
- issue: Identidade dos «menores»
  choice: A tradução mantém a expressão aberta e a identificação direta entre o que não foi feito por um deles e o que não foi feito por Jesus.
  alternative: Interpretar explicitamente os «menores» como os discípulos ou mensageiros de Jesus, ou de modo mais amplo como pessoas humildes e necessitadas.
  rationale: O versículo estabelece a identificação com Jesus, mas não resolve sozinho o referente preciso do grupo; a tradução não deve impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A contração «lhes» evita marcar gênero no pronome indireto; «vocês» torna explícito o plural de ὑμῖν. A fórmula «Em verdade» conserva a solenidade tradicional sem recorrer ao menos transparente «Amém» no início da declaração.
