  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀμὴν λέγω ὑμῖν, οὐκ οἶδα ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/012.yaml
  text: But he answered[a], ‘Truly I tell you, I do not know you.’
translation:
  language: pt
  text: 'Mas ele respondeu: “Em verdade lhes digo: não conheço vocês[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não reconheço vocês”. O grego diz mais literalmente “não conheço vocês”, expressão que, neste contexto, pode indicar não reconhecimento em sentido relacional.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Mas ele respondeu
  rationale: A construção com particípio e verbo finito é uma fórmula narrativa; em português natural, “respondeu” transmite o sentido sem redundância. “Mas” preserva o contraste marcado por δέ.
- source_word: Ἀμὴν
  choice: Em verdade
  rationale: Na fórmula solene Ἀμὴν λέγω ὑμῖν, “Em verdade” é transparente, digna e tradicional sem exigir que o leitor interprete o empréstimo “Amém”.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Expressa naturalmente a fala direta e solene; “lhes” representa o plural de ὑμῖν.
- source_word: οὐκ οἶδα
  choice: não conheço
  rationale: Preserva o sentido lexical básico de οἶδα e mantém aberta a força contextual de não reconhecimento ou rejeição relacional.
- source_word: ὑμᾶς
  choice: vocês
  rationale: Torna explícito, em português moderno de ampla legibilidade brasileira, que o objeto está no plural.
theological_decisions:
- issue: Força de “não conheço vocês” na parábola
  choice: Manter a formulação simples e relacionalmente forte “não conheço vocês”.
  alternative: “não reconheço vocês” ou “não tenho relacionamento com vocês”
  rationale: O contexto comunica exclusão e repúdio relacional, mas ampliar a frase resolveria uma tensão que o grego deixa implícita e importaria interpretação teológica para o texto principal.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Vocês” evita a ambiguidade numérica do pronome oblíquo isolado e representa claramente o plural grego; “Em verdade lhes digo” conserva a solenidade da fórmula sem soar excessivamente arcaico.
