base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/004.yaml
  text: But the wise took oil in their containers with their lamps[a].
translation:
  language: pt
  text: Mas as prudentes levaram óleo em recipientes, junto com as suas lamparinas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tochas”, em vez de “lamparinas” (grego lampadas); conforme o contexto, o termo pode designar uma tocha ou uma lamparina.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνιμοι
  choice: prudentes
  rationale: Expressa sabedoria prática e mantém o contraste com as insensatas no contexto, sem reduzir o sentido a simplesmente 'preparadas'.
- source_word: ἔλαβον
  choice: levaram
  rationale: No contexto narrativo, indica que trouxeram consigo o óleo; 'levaram' é natural em português e não sugere que o receberam de alguém.
- source_word: ἔλαιον
  choice: óleo
  rationale: Preserva o termo geral do grego; especificar 'azeite' seria possível, mas acrescentaria uma precisão que o texto não exige.
- source_word: ἀγγείοις
  choice: recipientes
  rationale: Mantém o sentido genérico de objetos destinados a conter algo, sem determinar forma ou material.
- source_word: λαμπάδων
  choice: lamparinas
  rationale: É uma tradução natural para um dispositivo de iluminação alimentado por óleo; o termo grego também pode designar tochas, alternativa registrada em nota.
- source_word: ἑαυτῶν
  choice: suas
  rationale: Comunica naturalmente a posse reflexiva em português; 'suas próprias' daria uma ênfase dispensável no texto principal.
- source_word: μετὰ τῶν λαμπάδων ἑαυτῶν
  choice: junto com as suas lamparinas
  rationale: 'Reproduz claramente a ideia de acompanhamento: o óleo foi levado além das lamparinas e juntamente com elas.'
