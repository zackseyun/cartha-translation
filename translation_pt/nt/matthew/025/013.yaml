id: MAT.25.13
reference: Matthew 25:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε τὴν ἡμέραν οὐδὲ τὴν ⸀ὥραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/013.yaml
  text: Therefore[a], stay awake, because you do not know the day or the hour.
translation:
  language: pt
  text: Portanto, mantenham-se vigilantes[a], porque vocês não sabem o dia nem a hora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fiquem acordados” ou “vigiem”. O imperativo grego indica vigilância contínua.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: mantenham-se vigilantes
  rationale: O presente imperativo plural expressa vigilância contínua. A formulação é natural em português atual e comunica prontidão sem reduzir o sentido a permanecer fisicamente acordado.
- source_word: οὖν
  choice: Portanto
  rationale: Marca a conclusão prática extraída da parábola precedente.
- source_word: ὅτι
  choice: porque
  rationale: Introduz de modo natural e direto a razão da ordem.
- source_word: οὐκ οἴδατε
  choice: vocês não sabem
  rationale: Reproduz diretamente a negação e a segunda pessoa do plural em português de ampla legibilidade brasileira, sem acrescentar qualquer ideia de incerteza parcial.
- source_word: τὴν ἡμέραν
  choice: o dia
  rationale: Mantém o artigo definido e não explicita além do texto a que acontecimento o dia se refere.
- source_word: οὐδὲ τὴν ὥραν
  choice: nem a hora
  rationale: Preserva a coordenação negativa de οὐδέ de maneira idiomática em português.
theological_decisions:
- issue: Imagem imperativa de vigilância
  choice: mantenham-se vigilantes
  alternative: fiquem acordados; vigiem
  rationale: Conserva a exortação à prontidão contínua e sua conexão com a imagem da parábola, evitando tanto uma leitura meramente física quanto a imposição de um sistema escatológico específico.
- issue: Alcance de “o dia nem a hora”
  choice: manter a expressão sem expansão interpretativa
  alternative: o dia nem a hora da vinda do Filho do Homem; o momento determinado
  rationale: Embora o contexto mais amplo ilumine a referência, o versículo não identifica expressamente o acontecimento. A tradução preserva essa contenção e a tensão própria do texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Vocês” torna explícito o plural do verbo grego; “mantenham-se vigilantes” oferece naturalidade sem perder o chamado contínuo à prontidão.
