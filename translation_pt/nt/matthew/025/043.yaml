source:
  edition: SBLGNT
  text: ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: pt
  text: Eu era estrangeiro, e vocês não me acolheram[a]; estava nu, e vocês não me vestiram; estava doente e na prisão, e vocês não me visitaram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não me receberam” ou “não me abrigaram”. O verbo grego significa literalmente “reunir”, mas aqui se refere a acolher um estrangeiro com hospitalidade.
    reason: lexical_alternative
  - marker: b
    text: O verbo também pode indicar cuidar de alguém ou dar-lhe atenção, não apenas fazer uma visita social.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: estrangeiro
  rationale: No contexto, designa alguém de fora do círculo familiar ou comunitário que precisava de acolhimento. “Estrangeiro” é direto e natural, sem pressupor que a pessoa já fosse hóspede.
- source_word: συνηγάγετέ
  choice: acolheram
  rationale: Embora συνάγω signifique literalmente “reunir”, nesta construção com ξένος refere-se a receber alguém com hospitalidade. “Acolheram” expressa naturalmente essa ação em português.
- source_word: γυμνός
  choice: sem roupa
  rationale: O adjetivo pode indicar nudez ou falta de roupa adequada. “Sem roupa” conserva a força da privação e soa natural no paralelo com “vestiram”.
- source_word: περιεβάλετέ
  choice: vestiram
  rationale: O verbo significa literalmente pôr algo ao redor e, neste contexto, vestir ou dar roupa. “Vestiram” é conciso e idiomático.
- source_word: ἀσθενής
  choice: doente
  rationale: Embora também possa significar “fraco”, neste catálogo de necessidades concretas o sentido de enfermidade é o mais provável.
- source_word: ἐν φυλακῇ
  choice: na prisão
  rationale: φυλακή aqui se refere ao estado ou lugar de encarceramento. “Na prisão” é a formulação portuguesa corrente e abrangente.
- source_word: ἐπεσκέψασθέ
  choice: cuidaram de
  rationale: ἐπισκέπτομαι pode significar visitar alguém com interesse ativo e cuidado. “Cuidaram de” torna explícita essa atenção compassiva e funciona tanto para a doença quanto para a prisão, que estão coordenadas sob um único verbo grego.
theological_decisions:
- issue: Alcance de ἐπεσκέψασθέ με na sequência “doente e na prisão”
  choice: cuidaram de mim
  alternative: visitaram-me
  rationale: O grego usa um único verbo depois dos dois estados e pode comunicar uma visita marcada por solicitude, não uma simples visita social. “Cuidaram de mim” preserva a dimensão misericordiosa sem limitar a ação à presença física; a alternativa mais formal é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural explícito. A repetição de “estava” explicita naturalmente em português as construções elípticas gregas. A pontuação mantém os três pares de necessidade e omissão.
