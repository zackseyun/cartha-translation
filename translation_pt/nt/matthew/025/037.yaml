id: MAT.25.37
reference: Matthew 25:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: pt
  text: 'Então os justos lhe responderão: “Senhor, quando te vimos com fome e te demos de comer, ou com sede e te demos de beber?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca a sequência temporal do discurso de modo conciso e natural.
- source_word: ἀποκριθήσονται αὐτῷ
  choice: lhe responderão
  rationale: O futuro de ἀποκρίνομαι tem sentido ativo, e o pronome dativo αὐτῷ é naturalmente expresso por “lhe”.
- source_word: οἱ δίκαιοι
  choice: os justos
  rationale: O adjetivo substantivado identifica o grupo reconhecido como justo na cena; “os justos” é a formulação corrente e digna em português.
- source_word: λέγοντες
  choice: introdução do discurso direto por dois-pontos
  rationale: Em português, o particípio que introduz a fala pode ser representado naturalmente pela pontuação, sem o redundante “dizendo”.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva tanto o tratamento respeitoso quanto a ressonância cristológica do título dirigido a Jesus.
- source_word: πότε σε εἴδομεν
  choice: quando te vimos
  rationale: Reproduz diretamente a pergunta temporal e o objeto de “vimos” em português natural.
- source_word: πεινῶντα καὶ ἐθρέψαμεν
  choice: com fome e te demos de comer
  rationale: “Com fome” expressa naturalmente o particípio predicativo, e “dar de comer” comunica de forma concreta e idiomática o ato de alimentar.
- source_word: διψῶντα καὶ ἐποτίσαμεν
  choice: com sede e te demos de beber
  rationale: Mantém o paralelismo com a frase anterior e traduz ἐποτίσαμεν pela expressão portuguesa comum e semanticamente direta “dar de beber”.
theological_decisions:
- issue: Sentido de κύριος no vocativo dirigido a Jesus
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” preserva o valor normal do título e sua possível ressonância cristológica, sem tornar explícito mais do que o texto afirma.
- issue: Identidade e condição de οἱ δίκαιοι
  choice: os justos
  alternative: aqueles que são justos
  rationale: A forma substantivada do grego é mantida sem explicar se a justiça é atribuída, reconhecida ou inerente, preservando a formulação teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com construção amplamente compreensível e boa legibilidade brasileira. O discurso direto evita a reprodução mecânica de λέγοντες, e as expressões paralelas “dar de comer” e “dar de beber” mantêm a concretude e o ritmo do original.
