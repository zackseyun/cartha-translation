  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: χρονίζοντος δὲ τοῦ νυμφίου ἐνύσταξαν πᾶσαι καὶ ἐκάθευδον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/005.yaml
  text: But while the bridegroom was delayed[b][a], they all became drowsy and fell asleep.
translation:
  language: pt
  text: Mas, como o noivo estava demorando[a], todas ficaram sonolentas e adormeceram.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como o noivo levava muito tempo para chegar”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todas ficaram sonolentas e estavam dormindo”. O grego distingue o início da sonolência (ἐνύσταξαν) do estado de dormir (ἐκάθευδον).'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρονίζοντος
  choice: estava demorando
  rationale: O particípio presente de χρονίζω, na construção genitiva absoluta, indica que o noivo levava mais tempo do que o esperado. “Estava demorando” é natural em português e preserva a ideia de demora sem sugerir necessariamente uma causa externa.
- source_word: δὲ
  choice: Mas
  rationale: 'δέ introduz uma leve mudança ou contraste narrativo: a espera das jovens é seguida pela demora do noivo e pelo sono.'
- source_word: νυμφίου
  choice: o noivo
  rationale: νυμφίος designa especificamente o homem que vai se casar. “Noivo” é o termo corrente e preciso em português para a cena de casamento.
- source_word: ἐνύσταξαν
  choice: ficaram sonolentas
  rationale: O aoristo de νυστάζω marca o início da sonolência. A expressão distingue esse primeiro estágio do sono propriamente dito expresso pelo verbo seguinte.
- source_word: πᾶσαι
  choice: todas
  rationale: O feminino plural retoma todas as dez virgens da parábola e mantém enfaticamente a inclusão de ambas as partes do grupo.
- source_word: ἐκάθευδον
  choice: adormeceram
  rationale: 'καθεύδω significa dormir. “Adormeceram” comunica naturalmente a progressão da sonolência ao sono; uma nota registra que o imperfeito grego também permite destacar o estado contínuo: “estavam dormindo”.'
theological_decisions:
- issue: Imagem parabólica do noivo
  choice: Manter “o noivo” como imagem narrativa, sem explicitar na tradução uma identificação cristológica.
  alternative: Acrescentar uma identificação interpretativa do noivo com Cristo.
  rationale: Embora a imagem tenha ressonância teológica no contexto de Mateus, o versículo apresenta diretamente a cena da parábola. A tradução preserva essa imagem e deixa sua interpretação ao contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a sequência entre sonolência e sono e evita o arcaísmo “tardava”.
