  yaml_path: translation/nt/matthew/025/039.yaml
  text: And when did we see you sick or in prison and come to you?[a]
translation:
  language: pt
  text: E quando foi que vimos você doente ou na prisão e fomos até você?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «visitamos você». Mais literalmente, o grego diz: «fomos até você».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: quando foi que
  rationale: Introduz naturalmente, em português, uma pergunta direta sobre a ocasião passada, sem alterar o sentido temporal.
- source_word: δέ
  choice: E
  rationale: Funciona aqui como conectivo leve na sequência de perguntas; «E» preserva essa continuidade sem sugerir contraste forte.
- source_word: εἴδομεν
  choice: vimos
  rationale: O aoristo indica uma ação passada; «vimos» é a forma interrogativa natural em português.
- source_word: ἀσθενοῦντα
  choice: doente
  rationale: No contexto de necessidades concretas, o particípio descreve enfermidade física; «doente» é claro e corrente.
- source_word: ἐν φυλακῇ
  choice: na prisão
  rationale: φυλακή designa aqui um lugar de confinamento; «na prisão» é a expressão ampla e usual em português.
- source_word: ἤλθομεν πρός σε
  choice: fomos até você
  rationale: A expressão significa literalmente aproximar-se ou ir até a pessoa. Em português, por se tratar de deslocamento dos falantes em direção ao interlocutor, «fomos até você» é mais natural que «viemos até você» e mantém a simplicidade do grego.
theological_decisions:
- issue: Se ἤλθομεν πρός σε deve ser traduzido de modo idiomático como «visitamos você» ou mais diretamente como movimento em direção à pessoa
  choice: fomos até você
  alternative: visitamos você
  rationale: O contexto envolve misericórdia para com o Filho do Homem identificado com os necessitados, mas a expressão grega não emprega especificamente um verbo que signifique «visitar». A tradução principal preserva o movimento simples até a pessoa, e a nota registra a alternativa idiomática.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O uso de «você» mantém a referência singular explícita e natural; «quando foi que» dá fluidez à pergunta sem acrescentar conteúdo interpretativo.
