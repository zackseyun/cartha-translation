id: MAT.25.31
reference: Matthew 25:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες ⸀οἱ ἄγγελοι μετ’ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/031.yaml
  text: But when the Son of Man comes in his glory[a], and all the angels with him, then he will sit on his glorious throne.
translation:
  language: pt
  text: Mas, quando o Filho do Homem vier em sua glória, e todos os anjos com ele, então se sentará em seu trono glorioso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “no trono da sua glória”.
    reason: Registra a forma mais literal do genitivo θρόνου δόξης αὐτοῦ, cuja tradução idiomática no texto principal é “em seu trono glorioso”.
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Mas, quando
  rationale: Ὅταν introduz um acontecimento futuro específico neste contexto escatológico; “quando” é natural em português. δέ marca uma transição com leve contraste, bem expressa por “mas”.
- source_word: ἔλθῃ
  choice: vier
  rationale: O aoristo do subjuntivo depois de ὅταν aponta para um acontecimento futuro. Em português, “quando ... vier” exige naturalmente o futuro do subjuntivo.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém o título consagrado, sua ligação com Daniel 7 e seu peso cristológico, sem substituí-lo por uma paráfrase interpretativa.
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: em sua glória
  rationale: “Glória” conserva tanto a ideia de majestade manifesta quanto a ressonância bíblica de δόξα.
- source_word: πάντες οἱ ἄγγελοι
  choice: todos os anjos
  rationale: Segue o texto grego apresentado, que traz o artigo, mas nenhum possessivo explícito; evita acrescentar “seus” com base apenas no contexto ou em paralelos.
- source_word: μετ’ αὐτοῦ
  choice: com ele
  rationale: Expressa de modo direto e natural a ideia de acompanhamento.
- source_word: τότε καθίσει
  choice: então se sentará
  rationale: “Então” preserva a sequência temporal. A construção pronominal “se sentará” é a forma portuguesa natural para a ação de tomar assento, sem alterar a voz ativa do grego.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: em seu trono glorioso
  rationale: ἐπί com genitivo indica posição sobre/no trono. A expressão atributiva “trono glorioso” comunica em português corrente o sentido do genitivo “trono da sua glória”; a forma mais literal é registrada em nota.
theological_decisions:
- issue: Título cristológico ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  alternative: o Ser Humano
  rationale: A formulação tradicional preserva a ambiguidade e a força intertextual do título, especialmente sua relação com Daniel 7 e com o papel régio e judicial de Jesus.
- issue: Sentido de θρόνου δόξης αὐτοῦ
  choice: seu trono glorioso
  alternative: o trono da sua glória
  rationale: A tradução principal é idiomática e conserva a ideia de um trono caracterizado pela glória do Filho do Homem; a nota mantém visível a estrutura mais formal do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha de perto o grego, mas usa o futuro do subjuntivo e a construção pronominal naturais em português.
