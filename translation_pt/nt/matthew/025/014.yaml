id: MAT.25.14
reference: Matthew 25:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὥσπερ γὰρ ἄνθρωπος ἀποδημῶν ἐκάλεσεν τοὺς ἰδίους δούλους καὶ παρέδωκεν αὐτοῖς τὰ ὑπάρχοντα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/014.yaml
  text: For it is like a man going on a journey[a], who called his own slaves and entrusted his possessions to them.
translation:
  language: pt
  text: Pois é como um homem que, ao partir em viagem, chamou seus próprios escravos[a] e lhes confiou os seus bens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos”. A palavra grega doulos pode designar um servo ou um escravo, conforme o contexto; aqui, “escravos” foi escolhido porque a autoridade e a posse do senhor estão em destaque.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: Pois é como
  rationale: Introduz uma comparação explicativa ligada ao contexto anterior. O verbo “é” é suprido naturalmente em português para explicitar a construção elíptica grega.
- source_word: ἄνθρωπος
  choice: um homem
  rationale: Neste contexto, o substantivo designa a figura masculina concreta da parábola, e não a humanidade em sentido genérico.
- source_word: ἀποδημῶν
  choice: ao partir em viagem
  rationale: Expressa a partida para outro lugar sem especificar indevidamente que se trate de outro país; a construção temporal se encaixa com naturalidade na sequência narrativa.
- source_word: ἐκάλεσεν
  choice: chamou
  rationale: É o equivalente direto e corrente; “convocou” seria possível, mas acrescentaria formalidade desnecessária.
- source_word: τοὺς ἰδίους δούλους
  choice: seus próprios escravos
  rationale: δοῦλος pode designar servo ou escravo conforme o contexto. Aqui, a autoridade do senhor e a relação de posse são salientes; ἰδίους reforça a vinculação pessoal, reproduzida por “próprios”.
- source_word: παρέδωκεν
  choice: confiou
  rationale: No contexto da administração de bens, transmite não apenas a entrega, mas também a responsabilidade atribuída aos escravos.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: os seus bens
  rationale: Designa aquilo que pertencia ao homem. “Bens” é claro, idiomático e apropriado ao contexto patrimonial.
theological_decisions:
- issue: Tradução de δοῦλος no contexto doméstico da parábola
  choice: escravos
  alternative: servos
  rationale: “Escravos” preserva a realidade social e jurídica indicada pelo termo quando a autoridade e a posse do senhor estão em destaque. A nota registra “servos” como alternativa lexical possível, sem suavizar silenciosamente o texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para evitar ambiguidade e manter fluidez narrativa, sem apagar a ligação explicativa com o versículo anterior.
