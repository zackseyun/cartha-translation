id: MAT.25.11
reference: Matthew 25:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὕστερον δὲ ἔρχονται καὶ αἱ λοιπαὶ παρθένοι λέγουσαι· Κύριε κύριε, ἄνοιξον ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/011.yaml
  text: Later[a], the other virgins also come, saying, ‘Lord, lord[c][b], open to us.’
translation:
  language: pt
  text: 'Mais tarde, vêm também as outras virgens[a] e dizem: “Senhor, Senhor[b], abra para nós[c]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as virgens restantes”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “senhor” ou “mestre”. Em grego: “Kýrie, kýrie”.'
    reason: alternative_reading
  - marker: c
    text: O grego diz simplesmente “abra para nós”; “a porta” está implícito no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: Mais tarde
  rationale: Marca a ação subsequente na narrativa de modo natural e claro em português.
- source_word: δὲ
  choice: —
  rationale: A transição leve expressa por δέ já é comunicada por “Mais tarde”; uma conjunção explícita deixaria a frase menos fluente.
- source_word: ἔρχονται
  choice: vêm
  rationale: Preserva o presente narrativo vívido do grego, sem interpretá-lo mais especificamente como “chegam”.
- source_word: καὶ
  choice: também
  rationale: 'Expressa o valor aditivo: essas virgens se juntam às personagens que já chegaram.'
- source_word: αἱ λοιπαὶ παρθένοι
  choice: as outras virgens
  rationale: É uma formulação concisa e natural que mantém tanto o sentido de λοιπαί quanto a designação direta παρθένοι.
- source_word: λέγουσαι
  choice: e dizem
  rationale: Converte o particípio grego numa coordenação idiomática em português, preservando a simultaneidade narrativa.
- source_word: Κύριε κύριε
  choice: Senhor, Senhor
  rationale: Mantém a repetição enfática e preserva tanto o possível sentido de tratamento respeitoso quanto a ressonância teológica de κύριος em Mateus.
- source_word: ἄνοιξον ἡμῖν
  choice: abra para nós
  rationale: Traduz o imperativo e o dativo de benefício/acesso sem acrescentar “a porta”, objeto apenas implícito no contexto. A forma “abra” combina naturalmente com o tratamento “Senhor” no português moderno.
theological_decisions:
- issue: Tradução de κύριος no vocativo
  choice: Senhor
  alternative: senhor; mestre
  rationale: “Senhor” conserva a ambiguidade entre um tratamento respeitoso dentro da parábola e a possível ressonância cristológica no contexto mais amplo de Mateus, sem reduzir o termo a apenas um desses sentidos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O presente narrativo foi mantido, e a elipse do objeto de “abra” preserva a formulação do grego.
