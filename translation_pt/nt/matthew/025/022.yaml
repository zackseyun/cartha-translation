id: MAT.25.22
reference: Matthew 25:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: προσελθὼν ⸀δὲ καὶ ὁ τὰ δύο ⸀τάλαντα εἶπεν· Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: pt
  text: 'Então, aproximou-se também o que tinha recebido os dois talentos e disse: “Senhor[a], o senhor me entregou dois talentos. Veja: ganhei outros dois talentos[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Patrão”. O título grego kýrios, geralmente traduzido como “Senhor”, também pode funcionar nesta parábola como tratamento respeitoso dirigido a um patrão.
    reason: alternative_reading
  - marker: b
    text: Um talento era uma grande unidade de peso e de valor monetário, não uma aptidão natural.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: aproximou-se
  rationale: O particípio aoristo de προσέρχομαι descreve o servo chegando diante do senhor para prestar contas; “aproximou-se” preserva esse movimento com naturalidade.
- source_word: δὲ καὶ
  choice: Então ... também
  rationale: A combinação dá continuidade à narrativa e acrescenta este servo à sequência dos que prestam contas.
- source_word: ὁ τὰ δύο τάλαντα
  choice: o que tinha recebido os dois talentos
  rationale: A expressão substantivada identifica o servo pela quantia que lhe fora confiada; “tinha recebido” explicita naturalmente a relação já estabelecida pelo contexto.
- source_word: Κύριε
  choice: Senhor
  rationale: O vocativo κύριε pode designar tanto “Senhor” como uma forma respeitosa de tratar um senhor ou patrão. “Senhor” mantém a correspondência lexical e funciona no contexto da parábola.
- source_word: παρέδωκας
  choice: entregou
  rationale: παραδίδωμι significa entregar ou passar algo às mãos de alguém. “Entregou” conserva a imagem concreta sem excluir a ideia contextual de confiar uma quantia.
- source_word: μοι
  choice: me
  rationale: O dativo indica o destinatário; o pronome átono é a forma mais natural em português.
- source_word: ἴδε
  choice: Veja
  rationale: O imperativo chama a atenção para o resultado apresentado pelo servo; “Veja” é atual e preserva sua força dêitica.
- source_word: ἄλλα δύο τάλαντα
  choice: outros dois talentos
  rationale: ἄλλα com o numeral indica uma quantidade adicional igual; “outros dois” é uma formulação portuguesa clara e idiomática.
- source_word: ἐκέρδησα
  choice: ganhei
  rationale: κερδαίνω expressa obter ganho ou lucro. “Ganhei” preserva o sentido sem especificar além do texto o método comercial empregado.
- source_word: τάλαντα
  choice: talentos
  rationale: τάλαντον era uma grande unidade de peso e, por extensão, de valor monetário. A transliteração tradicional preserva o termo histórico, esclarecido em nota para evitar o sentido moderno de aptidão natural.
theological_decisions:
- issue: Tradução de κύριος como tratamento dentro da parábola
  choice: Senhor
  alternative: Patrão; Mestre
  rationale: No cenário social da parábola, o termo pode ser dirigido ao dono ou patrão, mas “Senhor” corresponde diretamente a κύριος e preserva a possível ressonância mais ampla sem afirmar que ela seja obrigatória neste ponto.
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa natural. O segundo uso de “o senhor” é mantido como pronome de tratamento em minúscula, coerente com a fala do servo no contexto parabólico. As notas preservam tanto a amplitude de κύριος quanto o sentido monetário histórico de talento.
