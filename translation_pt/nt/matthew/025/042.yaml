  text: ἐπείνασα γὰρ καὶ οὐκ ἐδώκατέ μοι φαγεῖν, ⸀ἐδίψησα καὶ οὐκ ἐποτίσατέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/042.yaml
  text: For I was hungry and you gave me nothing to eat[a]; I was thirsty and you gave me nothing to drink.
translation:
  language: pt
  text: Pois tive fome, e vocês não me deram de comer[a]; tive sede, e não me deram de beber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não me deram nada para comer”; de modo semelhante, “não me deram nada para beber”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: tive fome
  rationale: O aoristo descreve o estado passado de Jesus. “Tive fome” é a expressão natural e corrente em português.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a razão da sentença no contexto. “Pois” conserva de modo conciso a força explicativa.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: vocês não me deram de comer
  rationale: Preserva a negação, o objeto pessoal μοι e o infinitivo φαγεῖν numa construção portuguesa natural e próxima do grego.
- source_word: ἐδίψησα
  choice: tive sede
  rationale: Expressão idiomática em português, paralela a “tive fome” e fiel ao estado passado indicado pelo aoristo.
- source_word: ἐποτίσατέ με
  choice: não me deram de beber
  rationale: Neste contexto, ποτίζω significa dar bebida a alguém. A formulação mantém o foco pessoal e o paralelismo com “deram de comer”.
theological_decisions:
- issue: Grau de literalidade nas orações sobre a provisão negada
  choice: “não me deram de comer ... não me deram de beber”
  alternative: “não me deram nada para comer ... não me deram nada para beber”
  rationale: A opção escolhida é idiomática em português e acompanha mais de perto a construção verbal grega, sem acrescentar o pronome indefinido “nada”. Também preserva o destaque dado à omissão pessoal no contexto do juízo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa, evitando tanto o arcaísmo de “vós” quanto uma formulação regionalmente marcada.
