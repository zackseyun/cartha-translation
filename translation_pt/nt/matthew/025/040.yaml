  naturalness: A redação é em geral clara e de registro apropriado, mas “a um destes meus irmãos, aos menores deles” soa truncado em português moderno. “Um destes meus irmãos mais humildes” é mais fluente, preservando o sentido social/posicional amplo no contexto.
  terminology: '“Rei”, “Em verdade”, “irmãos” e “a mim” preservam adequadamente o título, a solenidade, o masculino plural e a ênfase do grego. As notas devem ser separadas e ancoradas nos respectivos termos: a alternativa de “Amém” na fórmula e a ambiguidade interpretativa em “irmãos”.'
