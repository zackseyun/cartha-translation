source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: pt
  text: 'E o Rei lhes responderá: “Em verdade[a] lhes digo: na medida em que vocês fizeram isso a um destes meus irmãos mais humildes[b], a mim o fizeram.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Amém, eu lhes digo”.'
    reason: lexical_alternative
  - marker: b
    text: “Irmãos” traduz o termo grego masculino plural. A expressão “estes meus irmãos” pode referir-se especificamente aos discípulos de Jesus, aos que creem nele em geral ou, em sentido mais amplo, às pessoas vulneráveis; o texto preserva a expressão sem decidir essa questão interpretativa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ... ἐρεῖ
  choice: responderá
  rationale: 'O particípio aoristo unido ao futuro de λέγω forma uma expressão responsiva que o português comunica naturalmente com um único verbo: “responderá”.'
- source_word: ὁ βασιλεὺς
  choice: o Rei
  rationale: Mantém o título explícito e a maiúscula sinaliza sua função referencial no contexto da parábola, sem substituir o título por uma interpretação.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Em verdade lhes digo
  rationale: Reproduz de modo digno e compreensível a fórmula solene de Jesus; a nota registra a forma mais literal com “Amém”.
- source_word: ἐφ’ ὅσον
  choice: sempre que
  rationale: No contexto, a expressão introduz os casos em que a ação feita a um dos menores conta como feita ao Rei. “Sempre que” é natural em português e conserva essa relação sem transformar o objeto do ato em uma generalização livre.
- source_word: ἐποιήσατε
  choice: vocês fizeram isso / o fizeram
  rationale: O pronome retoma os atos mencionados no contexto; a repetição verbal e o paralelismo do grego são preservados de maneira idiomática.
- source_word: ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων
  choice: a um destes meus irmãos, aos menores deles
  rationale: Mantém o valor individualizante de ἑνί, o demonstrativo, o masculino plural de ἀδελφῶν e o superlativo substantivado, sem decidir quem são os “irmãos”.
- source_word: ἐμοὶ
  choice: a mim
  rationale: Preserva diretamente o dativo e a identificação enfática entre o ato dirigido ao irmão e o ato dirigido ao Rei.
theological_decisions:
- issue: Referente de “estes meus irmãos”
  choice: Conservar a expressão sem identificar explicitamente o grupo.
  alternative: Especificar discípulos ou missionários de Jesus, os fiéis em geral, ou todas as pessoas vulneráveis.
  rationale: O versículo não resolve por si só a discussão sobre o referente; a tradução preserva a formulação e a tensão interpretativa.
- issue: Gênero de ἀδελφῶν
  choice: irmãos
  alternative: irmãos e irmãs; semelhantes
  rationale: O termo grego está no masculino plural. Expandi-lo ou neutralizá-lo resolveria parcialmente uma questão de alcance que o texto não explicita.
- issue: Sentido de τῶν ἐλαχίστων
  choice: aos menores deles
  alternative: aos menos importantes; aos mais humildes; aos pequeninos
  rationale: “Menores” conserva a amplitude comparativa do grego quanto a condição, posição ou importância, sem limitar o sentido à idade, pobreza ou humildade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês/lhes” para a segunda pessoa plural. A ordem foi ajustada à sintaxe natural do português, preservando o paralelismo, a ênfase em “a mim” e a ambiguidade interpretativa central.
