revisions:
- from: 'Seu senhor lhe disse: “Muito bem, servo bom e fiel[a]! Você foi fiel no pouco; eu o colocarei sobre muito. Entre na alegria do seu senhor.”'
  to: 'Seu senhor lhe disse: “Muito bem, servo bom e fiel[a]! Você foi fiel em poucas coisas; eu o encarregarei de muitas coisas. Entre na alegria do seu senhor.”'
  rationale: A revisão substitui “no pouco” e “sobre muito” por “em poucas coisas” e “de muitas coisas”, explicitando o paralelismo plural do grego e tornando natural e inequívoca a ideia de responsabilidades confiadas. “Encarregarei” comunica adequadamente a nomeação expressa por καταστήσω. As demais escolhas são mantidas.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:56:12Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a fala de aprovação, a fidelidade em responsabilidades menores, a futura designação para responsabilidades maiores e o convite a entrar na alegria do senhor. Contudo, “eu o colocarei sobre muito” não exprime com precisão e clareza o plural ἐπὶ πολλῶν (“sobre muitas coisas/responsabilidades”) nem a força de nomeação de καταστήσω.
  naturalness: O registro é claro, moderno e adequado. “Servo bom e fiel” é aceitável em registro bíblico, e “Entre na alegria do seu senhor” preserva bem a imagem do grego. A formulação “colocarei sobre muito”, porém, soa pouco natural no português atual e fica semanticamente imprecisa.
  terminology: “Senhor” para κύριος e “servo” para δοῦλος são escolhas defensáveis no nível narrativo da parábola. A nota sobre “escravo” preserva apropriadamente a alternativa lexical de δοῦλος sem impor uma leitura doutrinária.
  issues:
  - severity: medium
    issue: “eu o colocarei sobre muito”
    rationale: ἐπὶ πολλῶν está em paralelo com ἐπὶ ὀλίγα e se refere a muitas coisas ou responsabilidades; καταστήσω denota designar/encarregar de uma função. “Sobre muito” pode ser entendido como posição física ou como quantidade abstrata e não comunica claramente a designação para responsabilidades maiores.
  revised_text: 'Seu senhor lhe disse: “Muito bem, servo bom e fiel[a]! Você foi fiel em poucas coisas; eu o encarregarei de muitas coisas. Entre na alegria do seu senhor.”'
  revised_footnotes:
