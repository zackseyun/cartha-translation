id: MAT.25.21
reference: Matthew 25:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: pt
  text: 'Seu senhor lhe disse: “Muito bem, servo bom e fiel[a]! Você foi fiel em poucas coisas; eu o encarregarei de muitas coisas. Entre na alegria do seu senhor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escravo bom e fiel”. A palavra grega doulos pode significar “servo” ou “escravo”, conforme o contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: disse
  rationale: Forma narrativa padrão e natural para introduzir discurso direto.
- source_word: κύριος
  choice: senhor
  rationale: Em português, “senhor” expressa naturalmente a autoridade daquele a quem o servo pertence e preserva a possível ressonância teológica de κύριος sem torná-la explícita demais.
- source_word: δοῦλε
  choice: servo
  rationale: “Servo” é a forma corrente e digna neste contexto parabólico; “escravo” continua sendo uma possibilidade lexical relevante e é registrada em nota.
- source_word: Εὖ
  choice: Muito bem
  rationale: Expressão idiomática de aprovação que corresponde ao uso exclamativo do advérbio εὖ.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: bom e fiel
  rationale: Reproduz diretamente os dois atributos e mantém a formulação conhecida e clara em português.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: Você foi fiel no pouco
  rationale: Formulação natural em português que conserva o contraste quantitativo entre pouca e muita responsabilidade.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: eu o colocarei sobre muito
  rationale: Preserva o paralelismo com “no pouco” e a ideia de designação para responsabilidade maior, sem especificar objetos ausentes no grego.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Entre na alegria
  rationale: Mantém a imagem espacial do imperativo e da preposição, sem reduzi-la à simples ideia de compartilhar.
theological_decisions:
- issue: κύριος pode designar tanto o senhor da relação social na parábola quanto evocar o título “Senhor”
  choice: senhor, em minúscula
  alternative: Senhor; mestre
  rationale: O referente imediato é o senhor do servo dentro da parábola. A minúscula evita transformar a fala em título cristológico explícito, enquanto “senhor” preserva a ambiguidade lexical e a possível ressonância teológica.
- issue: Amplitude semântica de δοῦλος
  choice: servo no texto, com “escravo” em nota
  alternative: escravo
  rationale: “Servo” é natural no registro da parábola em português e comunica subordinação; a nota conserva a condição social mais forte que δοῦλος também pode indicar.
- issue: Sentido de entrar na alegria do senhor
  choice: 'preservar a metáfora: “Entre na alegria”'
  alternative: Venha participar da alegria
  rationale: A tradução não define se a alegria é uma celebração, a felicidade do senhor ou uma realidade escatológica; mantém a abertura da expressão grega.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O tratamento por “você” evita solenidade arcaizante; “seu senhor” mantém a relação hierárquica da parábola. Não se acrescentou nota para κύριος, pois “senhor” em português preserva melhor que “mestre” tanto a relação social imediata quanto a possível ressonância teológica.
