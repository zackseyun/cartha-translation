    text: Ou “escravo bom e fiel”. A palavra grega doulos pode significar “servo” ou “escravo”, conforme o contexto.
    reason: alternative_reading
  revision_rationale: A revisão substitui “no pouco” e “sobre muito” por “em poucas coisas” e “de muitas coisas”, explicitando o paralelismo plural do grego e tornando natural e inequívoca a ideia de responsabilidades confiadas. “Encarregarei” comunica adequadamente a nomeação expressa por καταστήσω. As demais escolhas são mantidas.
