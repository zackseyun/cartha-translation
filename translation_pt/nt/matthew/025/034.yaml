  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/034.yaml
  text: Then the King will say to those on his right[a], ‘Come, you who are blessed by my Father[b], inherit the kingdom prepared for you from the foundation of the world.’
translation:
  language: pt
  text: 'Então o Rei dirá aos que estiverem à sua direita: “Venham, vocês que são abençoados por meu Pai[a]; recebam como herança o Reino preparado para vocês desde a fundação do mundo[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “vocês, os abençoados de meu Pai”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a partir da fundação do mundo”; isto é, desde que o mundo foi fundado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca de modo natural a sequência temporal dentro da cena do juízo.
- source_word: ἐρεῖ
  choice: dirá
  rationale: Futuro de λέγω, introduzindo diretamente a fala do Rei.
- source_word: ὁ βασιλεὺς
  choice: o Rei
  rationale: Título definido do juiz real nesta cena; a inicial maiúscula sinaliza seu uso titular sem acrescentar uma identificação ausente da frase.
- source_word: τοῖς ἐκ δεξιῶν αὐτοῦ
  choice: aos que estiverem à sua direita
  rationale: Expressa com clareza a posição do grupo ao lado direito do Rei; o futuro verbal harmoniza naturalmente com a cena futura sem alterar o sentido espacial.
- source_word: Δεῦτε
  choice: Venham
  rationale: Convocação imperativa dirigida a um grupo; a forma plural é natural no português contemporâneo.
- source_word: οἱ εὐλογημένοι τοῦ πατρός μου
  choice: vocês que são abençoados por meu Pai
  rationale: Torna natural o particípio perfeito passivo substantivado e entende o genitivo como fonte ou agente da bênção, preservando em nota a formulação mais literal.
- source_word: κληρονομήσατε
  choice: recebam como herança
  rationale: Preserva explicitamente a ideia familiar e pactual de herdar, com formulação corrente e solene em português.
- source_word: τὴν ... βασιλείαν
  choice: o Reino
  rationale: No contexto de algo preparado e recebido como herança, 'Reino' comunica melhor o domínio escatológico sem excluir a noção de governo real.
- source_word: τὴν ἡτοιμασμένην ὑμῖν βασιλείαν
  choice: o Reino preparado para vocês
  rationale: A construção concisa conserva o particípio perfeito passivo e a ideia de uma preparação já realizada em favor dos destinatários.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: desde a fundação do mundo
  rationale: Reproduz a metáfora bíblica de lançar os fundamentos do mundo e liga naturalmente a expressão temporal ao Reino preparado.
theological_decisions:
- issue: Agência ou relação na expressão εὐλογημένοι τοῦ πατρός μου
  choice: abençoados por meu Pai
  alternative: abençoados de meu Pai
  rationale: O genitivo identifica naturalmente a fonte ou o agente da bênção. A tradução principal é clara no português moderno, enquanto a alternativa mais formalmente literal é registrada em nota.
- issue: Sentido de βασιλεία no contexto da herança escatológica
  choice: Reino
  alternative: reinado
  rationale: A combinação com 'recebam como herança' e 'preparado para vocês' favorece a dimensão de reino ou domínio recebido, embora o termo grego também possa designar o exercício do governo.
- issue: Ligação sintática de ἀπὸ καταβολῆς κόσμου
  choice: A expressão modifica 'preparado para vocês'.
  alternative: Entendê-la de modo mais amplo como circunstância de toda a convocação.
  rationale: A proximidade com o particípio 'preparado' favorece essa ligação, sem desenvolver além do texto qualquer sistema doutrinário sobre eleição ou predestinação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'vocês' para explicitar o plural e mantém 'fundação do mundo' por sua força metafórica e continuidade bíblica. A pontuação favorece a leitura oral da declaração solene.
