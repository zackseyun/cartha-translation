  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἄρατε οὖν ἀπ’ αὐτοῦ τὸ τάλαντον καὶ δότε τῷ ἔχοντι τὰ δέκα τάλαντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/028.yaml
  text: Therefore take the talent from him and give it to the one who has the ten talents[a][b].
translation:
  language: pt
  text: Portanto, tirem dele o talento[a] e deem-no àquele que tem os dez talentos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retirem dele”. O verbo grego expressa aqui a ordem de remover algo da posse de alguém.
    reason: lexical_alternative
  - marker: b
    text: Um “talento” era uma grande unidade de peso e, por extensão, de dinheiro.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρατε
  choice: tirem
  rationale: Imperativo aoristo ativo, no plural, de αἴρω. No contexto, ordena retirar do servo aquilo que estava em sua posse; “tirem” é natural e preserva a força do comando.
- source_word: οὖν
  choice: Portanto
  rationale: Indica a conclusão decorrente do juízo anterior e mantém explícita a ligação lógica.
- source_word: ἀπ’ αὐτοῦ
  choice: dele
  rationale: ἀπό com o genitivo expressa separação; “dele” comunica de modo direto que o talento deve ser retirado do servo.
- source_word: τὸ τάλαντον
  choice: o talento
  rationale: Preserva o termo histórico para uma grande unidade de peso e, por extensão, de dinheiro, sem interpretar a parábola como referência direta a aptidões naturais.
- source_word: δότε
  choice: deem-no
  rationale: Imperativo aoristo ativo, no plural, de δίδωμι. “Deem-no” mantém o comando e explicita naturalmente em português que o objeto dado é o talento.
- source_word: τῷ ἔχοντι
  choice: àquele que tem
  rationale: O particípio com artigo funciona como substantivo. “Àquele que tem” é idiomático e não acrescenta uma identificação ausente do grego.
- source_word: τὰ δέκα τάλαντα
  choice: os dez talentos
  rationale: O artigo definido aponta para a quantia específica já mencionada na narrativa.
theological_decisions:
- issue: Sentido de τάλαντον no contexto da parábola
  choice: Manter o termo histórico “talento”, explicado como unidade de peso e de dinheiro.
  alternative: “dinheiro” ou “grande quantia”
  rationale: O texto trata de valores confiados e de prestação de contas. Manter “talento” conserva o cenário histórico e a ligação literária da parábola, enquanto a nota impede que o leitor entenda automaticamente o termo como aptidão natural.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas verbais plurais naturais no português brasileiro. A colocação pronominal em “deem-no” mantém clareza e registro escrito sem excessiva solenidade. Os marcadores aparecem junto aos elementos que cada nota esclarece.
