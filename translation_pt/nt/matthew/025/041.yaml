  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: pt
  text: 'Então ele dirá também aos que estiverem à esquerda: “Afastem-se de mim, malditos, para o fogo eterno, preparado para o diabo e seus anjos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca naturalmente a sequência temporal na cena do juízo.
- source_word: ἐρεῖ
  choice: dirá
  rationale: Preserva de modo direto o futuro de λέγω, sem acrescentar força ao ato de fala.
- source_word: τοῖς ἐξ εὐωνύμων
  choice: aos que estiverem à esquerda
  rationale: Expressa em português corrente o grupo situado à esquerda do rei no contexto imediato.
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: Afastem-se de mim
  rationale: Comunica com clareza a ordem de deixar a presença do falante e mantém a ideia de separação.
- source_word: οἱ κατηραμένοι
  choice: malditos
  rationale: Reproduz de forma concisa e forte o particípio perfeito passivo usado como vocativo.
- source_word: εἰς τὸ πῦρ τὸ αἰώνιον
  choice: para o fogo eterno
  rationale: A preposição portuguesa 'para' indica o destino do movimento; 'eterno' é a equivalência normal de αἰώνιον neste contexto de juízo.
- source_word: τὸ ἡτοιμασμένον
  choice: preparado
  rationale: Mantém o estado resultante de uma preparação anterior indicado pelo particípio perfeito passivo.
- source_word: τῷ διαβόλῳ
  choice: para o diabo
  rationale: Neste contexto, διάβολος funciona como designação pessoal estabelecida, não como descrição genérica.
- source_word: τοῖς ἀγγέλοις αὐτοῦ
  choice: seus anjos
  rationale: No cenário escatológico, refere-se a seres sobrenaturais associados ao diabo, não a mensageiros humanos.
theological_decisions:
- issue: Sentido de αἰώνιον no contexto do juízo
  choice: eterno
  alternative: duradouro; pertencente à era
  rationale: '''Eterno'' representa o sentido contextual mais natural sem inserir uma explicação doutrinária além do texto.'
- issue: Referentes de διάβολος e ἄγγελοι
  choice: o diabo e seus anjos
  alternative: o caluniador e seus mensageiros
  rationale: A formulação é uma designação convencional do diabo e dos seres angelicais que lhe estão associados neste contexto escatológico.
- issue: Força de οἱ κατηραμένοι
  choice: malditos
  alternative: vocês que foram amaldiçoados
  rationale: '''Malditos'' conserva a força da interpelação e a forma passiva implícita, sem especificar no texto quem pronunciou a maldição.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O discurso direto mantém solenidade sem recorrer a formas arcaicas. Não há nota textual ou lexical indispensável neste versículo; por isso, não foram inseridos marcadores.
