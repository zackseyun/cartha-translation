  text: Τότε ὁμοιωθήσεται ἡ βασιλεία τῶν οὐρανῶν δέκα παρθένοις, αἵτινες λαβοῦσαι τὰς λαμπάδας ⸀ἑαυτῶν ἐξῆλθον εἰς ⸀ὑπάντησιν τοῦ νυμφίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/001.yaml
  text: Then the kingdom of heaven will be like ten virgins[c][b][a], who took their lamps and went out to meet the bridegroom.
translation:
  language: pt
  text: Então, o Reino dos céus será semelhante a dez virgens[a] que pegaram suas lâmpadas[b] e saíram ao encontro do noivo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será comparado a dez virgens”. O verbo grego está na voz passiva: “será comparado a” ou “será equiparado a”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tochas”. O termo grego pode designar uma fonte de luz portátil usada numa procissão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca a sequência temporal e liga naturalmente a parábola ao contexto anterior.
- source_word: ὁμοιωθήσεται
  choice: será semelhante a
  rationale: Expressa em português natural a comparação futura do verbo grego, enquanto a nota preserva sua forma passiva explícita.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: o Reino dos céus
  rationale: Forma consagrada e natural em português para a expressão característica de Mateus, mantendo o plural do grego.
- source_word: δέκα παρθένοις
  choice: dez virgens
  rationale: Preserva diretamente o sentido de παρθένος no contexto nupcial, sem ampliá-lo para uma descrição social menos específica.
- source_word: λαβοῦσαι τὰς λαμπάδας ἑαυτῶν
  choice: pegaram suas lâmpadas
  rationale: Converte o particípio aoristo em verbo finito, de modo natural, e mantém a sequência da ação. “Lâmpadas” é adequado ao contexto do azeite mencionado na parábola.
- source_word: ἐξῆλθον εἰς ὑπάντησιν
  choice: saíram ao encontro
  rationale: Reproduz de modo claro e idiomático o movimento para fora com a finalidade de receber ou encontrar alguém.
- source_word: τοῦ νυμφίου
  choice: do noivo
  rationale: “Noivo” é o termo corrente e preciso em português para o homem no contexto da celebração de casamento.
theological_decisions:
- issue: Fórmula de comparação da parábola
  choice: o Reino dos céus será semelhante a dez virgens
  alternative: o Reino dos céus será comparado a dez virgens
  rationale: A redação principal é natural em português e conserva a comparação e sua referência futura. A nota registra a voz passiva do grego, evitando ocultar a nuance gramatical.
- issue: Sentido de παρθένοις
  choice: virgens
  alternative: jovens solteiras
  rationale: “Virgens” mantém a especificidade lexical e a imagem nupcial do texto sem substituir o termo por uma descrição interpretativa mais ampla.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “será semelhante a” evita rigidez excessiva, enquanto as notas preservam as alternativas lexicais e a nuance da voz passiva.
