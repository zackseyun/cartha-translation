id: MAT.25.23
reference: Matthew 25:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: pt
  text: 'Seu senhor lhe disse: “Muito bem, servo[a] bom e fiel! Você foi fiel em poucas coisas; eu o colocarei à frente de muitas coisas. Entre na alegria do seu senhor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escravo”. A palavra grega δοῦλος pode designar um servo ou um escravo, conforme o contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ κύριος αὐτοῦ
  choice: Seu senhor lhe disse
  rationale: Mantém a ordem narrativa em português natural. “Senhor” expressa a relação de autoridade dentro da parábola sem impor, pela capitalização, um título divino direto.
- source_word: Εὖ
  choice: Muito bem!
  rationale: Forma idiomática de elogio e aprovação em português, adequada à exclamação dirigida ao servo.
- source_word: δοῦλε
  choice: servo
  rationale: “Servo” é corrente no registro bíblico, compreensível e preserva a relação hierárquica; “escravo” explicita com mais força a condição social possível no grego e é registrado em nota.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: bom e fiel
  rationale: Preserva os dois adjetivos e a ligação lexical de πιστέ com πιστός na oração seguinte.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: Você foi fiel no pouco
  rationale: Expressão portuguesa natural que conserva a ideia de fidelidade numa responsabilidade limitada, sem acrescentar um objeto não expresso pelo grego.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: eu o colocarei sobre muito
  rationale: Preserva o paralelismo entre ὀλίγα e πολλῶν e o sentido de designar alguém para responsabilidade maior.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Entre na alegria
  rationale: Mantém a metáfora espacial do imperativo e não a reduz interpretativamente a “participe” ou “compartilhe”.
- source_word: τοῦ κυρίου σου
  choice: do seu senhor
  rationale: Reproduz o mesmo referente e vocabulário da primeira ocorrência de κύριος, com coerência interna.
theological_decisions:
- issue: Tradução de κύριος no cenário parabólico
  choice: senhor
  alternative: mestre; Senhor
  rationale: No plano narrativo, κύριος designa o superior humano do servo. “Senhor” é natural em português e mantém a possível ressonância teológica da parábola, enquanto a inicial minúscula evita transformar silenciosamente a palavra em título divino direto.
- issue: Tradução de δοῦλος
  choice: servo
  alternative: escravo
  rationale: O contexto enfatiza a fidelidade na administração, mas δοῦλος pode designar alguém escravizado. O texto principal usa a forma mais natural no registro da parábola, e a nota preserva explicitamente a alternativa historicamente mais forte.
- issue: Sentido de εἴσελθε εἰς τὴν χαρὰν
  choice: Entre na alegria
  alternative: Participe da alegria
  rationale: A formulação conserva a imagem verbal do grego e deixa aberta a natureza exata da alegria, em vez de explicar antecipadamente como participação em uma celebração ou em uma recompensa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega “você” para a segunda pessoa e “o” como objeto direto, evitando regionalismos marcados. O paralelismo “no pouco / sobre muito” segue de perto o grego, preservando sua concisão e tensão sem acrescentar “coisas”.
