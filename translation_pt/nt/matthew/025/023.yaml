  to: 'Seu senhor lhe disse: “Muito bem, servo[a] bom e fiel! Você foi fiel em poucas coisas; eu o colocarei à frente de muitas coisas. Entre na alegria do seu senhor.”'
  rationale: A revisão explicita o paralelismo plural “poucas coisas / muitas coisas” e substitui uma construção pouco natural por “colocarei à frente de”, que comunica a nomeação para responsabilidade maior. A nota foi ancorada diretamente no termo traduzido e simplificada para apresentar somente a alternativa pertinente.
