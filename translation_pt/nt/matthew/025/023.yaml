review_pass:
  verdict: revise
  source_fidelity: 'O sentido central está bem preservado: κύριος é adequadamente entendido como o superior humano da parábola, δοῦλος como “servo” com a alternativa “escravo” em nota, e “entre na alegria” mantém a imagem de εἴσελθε εἰς τὴν χαράν. Contudo, os plurais substantivados ὀλίγα e πολλῶν indicam “poucas coisas” e “muitas coisas”; a formulação “no pouco / sobre muito” pode ser aceitável em registro bíblico, mas a segunda parte fica pouco natural e menos explícita em português moderno.'
  naturalness: “Eu o colocarei sobre muito” não é uma formulação fluente no português moderno internacional. “Eu o colocarei à frente de muitas coisas” transmite naturalmente a designação para maior responsabilidade. A âncora da nota deve seguir diretamente “servo”, o termo a que a alternativa se aplica, e não a exclamação inteira.
  terminology: “Senhor” é coerente para κύριος no plano narrativo da parábola e a minúscula é apropriada. “Servo bom e fiel” preserva o registro elevado e a repetição lexical de πιστός. A nota sobre “escravo” é suficiente e não impõe uma leitura teológica.
  issues:
