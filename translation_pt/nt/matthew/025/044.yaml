  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: pt
  text: 'Então eles também responderão: “Senhor, quando o vimos com fome, com sede, estrangeiro, sem roupa, doente ou na prisão e não o servimos[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não cuidamos do senhor” ou “não lhe prestamos assistência”. O verbo grego também pode ter esses sentidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca naturalmente a sequência temporal na cena do julgamento.
- source_word: ἀποκριθήσονται καὶ αὐτοὶ
  choice: eles também responderão
  rationale: Preserva o futuro e a ênfase inclusiva de καὶ αὐτοί, indicando que este grupo, assim como o anterior, responde.
- source_word: Κύριε
  choice: Senhor
  rationale: É o vocativo corrente de κύριος e mantém tanto o tratamento respeitoso quanto sua ressonância cristológica.
- source_word: πεινῶντα ἢ διψῶντα
  choice: com fome, com sede
  rationale: Expressões idiomáticas e claras em português para os particípios predicativos.
- source_word: ξένον
  choice: como estrangeiro
  rationale: Comunica alguém de fora que necessita de acolhimento, sem limitar o sentido à condição legal ou étnica.
- source_word: γυμνὸν
  choice: sem roupa
  rationale: Expressa de modo natural a falta de vestimenta; evita que 'nu' sugira necessariamente nudez absoluta, embora essa seja uma alternativa lexical possível.
- source_word: ἀσθενῆ
  choice: doente
  rationale: Neste catálogo de necessidades físicas e sociais, o sentido contextual mais provável é enfermidade.
- source_word: ἐν φυλακῇ
  choice: na prisão
  rationale: Equivalente direto e corrente da expressão locativa grega.
- source_word: διηκονήσαμέν σοι
  choice: não o servimos
  rationale: Mantém a amplitude de διακονέω e a ideia de auxílio prático prestado ao Senhor, sem restringi-la ao ministério eclesiástico.
theological_decisions:
- issue: Título κύριος dirigido a Jesus
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” preserva o tratamento respeitoso e a possível ressonância cristológica sem explicitar além do texto.
- issue: Sentido de διακονέω na conclusão
  choice: servimos
  alternative: cuidamos do senhor; prestamos assistência ao senhor
  rationale: “Servimos” conserva a abrangência do verbo e a ligação entre as obras concretas de misericórdia e o serviço prestado ao rei.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Na fala direta, “o senhor” explicita naturalmente o pronome objeto de segunda pessoa formal e evita a ambiguidade gráfica de “você” aplicada ao título “Senhor”.
