source:
  edition: SBLGNT
  text: μέσης δὲ νυκτὸς κραυγὴ γέγονεν· Ἰδοὺ ὁ ⸀νυμφίος, ἐξέρχεσθε εἰς ἀπάντησιν ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/006.yaml
  text: 'But at midnight a cry rang out: ‘Look[b][a], the bridegroom! Come out to meet him.’'
translation:
  language: pt
  text: 'Mas, à meia-noite, ouviu-se um grito: “Olhem: o noivo! Saiam ao encontro dele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: Mas, à meia-noite
  rationale: A construção genitiva é uma expressão temporal idiomática. “À meia-noite” é natural e exata; “mas” representa δέ como transição narrativa com leve contraste.
- source_word: κραυγὴ γέγονεν
  choice: ouviu-se um grito
  rationale: O perfeito de γίνομαι apresenta a ocorrência súbita do anúncio. A formulação portuguesa é natural e mantém o impacto da cena sem traduzir literalmente como “um grito aconteceu”.
- source_word: Ἰδού
  choice: Olhem
  rationale: Funciona como chamado de atenção dirigido ao grupo. “Olhem” preserva a força dêitica em português atual, sem o tom arcaizante de “eis”.
- source_word: ὁ νυμφίος
  choice: o noivo
  rationale: νυμφίος designa especificamente o noivo no contexto de casamento. “Noivo” é a forma corrente e clara em português.
- source_word: ἐξέρχεσθε
  choice: Saiam
  rationale: O imperativo plural ordena que as pessoas saiam. “Saiam” é direto e idiomático, sem acrescentar uma perspectiva espacial não explicitada.
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: ao encontro dele
  rationale: A expressão idiomática indica sair para encontrar ou receber alguém. “Ao encontro dele” conserva de modo conciso a imagem do cortejo nupcial.
theological_decisions:
- issue: Referente parabólico de νυμφίος
  choice: Traduzir simplesmente como “o noivo”, em minúscula
  alternative: “o Noivo”, explicitando tipograficamente a identificação cristológica
  rationale: Embora o contexto mais amplo permita identificar o noivo com Jesus, o versículo o apresenta no plano narrativo da parábola. A minúscula preserva esse nível literário e não incorpora a interpretação à tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala direta usa plural explícito (“Olhem”, “Saiam”), correspondente ao público coletivo. Não foram incluídas notas porque as alternativas lexicais não afetam substancialmente o sentido e “eis” seria sobretudo uma opção de registro.
