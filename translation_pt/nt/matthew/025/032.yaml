  text: καὶ ⸀συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: pt
  text: E todas as nações serão reunidas diante dele[a], e ele as separará umas das outras, assim como o pastor separa as ovelhas dos cabritos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os povos”; em grego, “todas as nações” (πάντα τὰ ἔθνη).
    reason: lexical_alternative
  - marker: b
    text: A palavra grega ἐρίφων pode referir-se mais especificamente a cabritos, ou filhotes de cabra.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: serão reunidas
  rationale: Preserva o futuro passivo do grego sem explicitar um agente e soa natural em português.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: diante dele
  rationale: Expressão corrente e digna que mantém tanto a posição perante ele quanto a tonalidade de uma cena de julgamento.
- source_word: πάντα τὰ ἔθνη
  choice: todas as nações
  rationale: Conserva a forma e a amplitude lexical do grego, sem restringir o referente aos gentios nem interpretar antecipadamente como indivíduos.
- source_word: ἀφορίσει
  choice: separará
  rationale: Expressa diretamente a divisão de um grupo em relação a outro.
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: as separará umas das outras
  rationale: O pronome feminino concorda naturalmente com 'nações', e a construção preserva a ideia de separação recíproca dentro do conjunto reunido.
- source_word: ὥσπερ
  choice: assim como
  rationale: Introduz com clareza e naturalidade a comparação.
- source_word: ὁ ποιμὴν
  choice: o pastor
  rationale: Mantém o artigo grego e funciona naturalmente como referência genérica em português.
- source_word: τὰ πρόβατα
  choice: as ovelhas
  rationale: Retém a imagem concreta do grego em vez de substituí-la pelo coletivo 'rebanho'.
- source_word: τῶν ἐρίφων
  choice: os cabritos
  rationale: ἔριφος pode designar especificamente um bode jovem; 'cabritos' preserva essa nuance e forma em português o contraste pastoril natural com 'ovelhas'.
theological_decisions:
- issue: Alcance de πάντα τὰ ἔθνη
  choice: todas as nações
  alternative: todos os povos; todos os gentios
  rationale: A tradução mantém a amplitude lexical e a possível dimensão coletiva da expressão, sem limitar o juízo aos gentios nem resolver se 'nações' deve ser entendido estritamente como povos ou distributivamente como pessoas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para 'ele as separará' a fim de evitar ambiguidade pronominal, sem alterar a estrutura lógica do grego. 'Cabritos' foi preferido a 'bodes' por refletir a nuance etária de ἐρίφων.
