  yaml_path: translation/nt/matthew/025/002.yaml
  text: And five of them were foolish, and five were wise.
translation:
  language: pt
  text: Cinco delas eram insensatas, e cinco, prudentes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: cinco
  rationale: Numeral cardinal direto; a repetição preserva o equilíbrio e o contraste da frase grega.
- source_word: δὲ
  choice: não traduzido por palavra isolada
  rationale: Aqui, δέ funciona como conectivo discursivo leve. Em português, a continuidade com o versículo anterior fica natural sem um conectivo inicial explícito.
- source_word: ἐξ αὐτῶν
  choice: delas
  rationale: 'Expressa de modo idiomático a relação partitiva: cinco dentre as dez jovens mencionadas anteriormente.'
- source_word: ἦσαν
  choice: eram
  rationale: O imperfeito de εἰμί atua como cópula numa descrição; o imperfeito português é natural nesse contexto narrativo.
- source_word: μωραὶ
  choice: insensatas
  rationale: Comunica falta de bom senso ou discernimento e mantém o contraste com φρόνιμοι em linguagem atual e digna.
- source_word: καὶ πέντε φρόνιμοι
  choice: e cinco, prudentes
  rationale: φρόνιμος designa quem age com bom senso e previdência. “Prudentes” preserva essa nuance; a vírgula marca a elipse natural de “eram” em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e amplamente compreensível, com boa legibilidade brasileira. A construção paralela conserva a concisão do grego; “insensatas” e “prudentes” mantém o contraste moral-prático sem acrescentar interpretação denominacional.
