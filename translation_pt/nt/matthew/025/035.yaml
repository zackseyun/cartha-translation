  text: ἐπείνασα γὰρ καὶ ἐδώκατέ μοι φαγεῖν, ἐδίψησα καὶ ἐποτίσατέ με, ξένος ἤμην καὶ συνηγάγετέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/035.yaml
  text: For I was hungry and you gave me something to eat[a]; I was thirsty and you gave me something to drink; I was a stranger and you welcomed me,
translation:
  language: pt
  text: Pois eu estava com fome, e vocês me deram de comer; estava com sede, e vocês me deram de beber; era estrangeiro, e vocês me acolheram[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês me receberam”. O verbo grego significa literalmente “reunir” ou “juntar”, mas aqui se refere a acolher hospitaleiramente um estrangeiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: eu estava com fome
  rationale: Expressa em português corrente o estado passado indicado pelo aoristo de πεινάω, sem a rigidez de «tive fome».
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa de γάρ em relação à declaração anterior e soa natural no início da frase.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: vocês me deram de comer
  rationale: A construção portuguesa «dar de comer» corresponde naturalmente a δίδωμι com dativo e infinitivo, sem precisar acrescentar um objeto indefinido.
- source_word: ἐδίψησα
  choice: estava com sede
  rationale: Comunica de modo idiomático a experiência passada expressa pelo aoristo de διψάω.
- source_word: ἐποτίσατέ με
  choice: vocês me deram de beber
  rationale: Preserva o paralelismo com «deram de comer» e transmite o sentido contextual de ποτίζω, isto é, prover bebida.
- source_word: ξένος
  choice: estrangeiro
  rationale: Neste contexto, designa alguém de fora, sem vínculos locais nem acolhimento habitual. «Estrangeiro» preserva a alteridade social do termo, sem definir estatuto jurídico moderno.
- source_word: συνηγάγετέ με
  choice: vocês me acolheram
  rationale: Embora συνάγω signifique literalmente reunir, com ξένος o contexto indica receber alguém com hospitalidade. «Acolheram» expressa isso de maneira natural e digna.
theological_decisions:
- issue: Sentido hospitaleiro de ξένος ... συνηγάγετέ με
  choice: «era estrangeiro, e vocês me acolheram»
  alternative: «era forasteiro, e vocês me receberam»
  rationale: A formulação mantém o foco na recepção misericordiosa de quem está de fora, sem restringir o termo a uma categoria política ou jurídica contemporânea. A nota conserva o valor mais literal do verbo.
translation_notes:
  register: Português moderno, claro e digno, com «vocês» para o plural de segunda pessoa e construções idiomáticas amplamente compreensíveis no Brasil e no restante do mundo lusófono. O paralelismo das três ações foi preservado.
