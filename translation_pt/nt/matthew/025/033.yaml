  text: καὶ στήσει τὰ μὲν πρόβατα ἐκ δεξιῶν αὐτοῦ τὰ δὲ ἐρίφια ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/033.yaml
  text: And he will place the sheep at his right hand[b][a], but the goats at the left.
translation:
  language: pt
  text: E colocará as ovelhas à sua direita, mas os cabritos à esquerda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os bodes jovens”. O termo grego designa cabritos.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσει
  choice: colocará
  rationale: 'O futuro ativo de ἵστημι é causativo neste contexto: fazer ficar em determinada posição. “Colocará” é natural e preserva a ação deliberada.'
- source_word: τὰ μὲν πρόβατα
  choice: as ovelhas
  rationale: πρόβατα é o termo comum para ovelhas; o artigo identifica o grupo já apresentado na cena.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: à sua direita
  rationale: A construção ἐκ + genitivo é idiomática e indica posição ao lado direito dele, não movimento a partir desse lado.
- source_word: τὰ δὲ ἐρίφια
  choice: mas os cabritos
  rationale: ἐρίφια designa especificamente cabritos, isto é, bodes jovens. “Cabritos” preserva essa nuance melhor que o termo mais geral “bodes” e permanece claro em português.
- source_word: ἐξ εὐωνύμων
  choice: à esquerda
  rationale: A expressão idiomática indica posição no lado esquerdo. O possessivo não é repetido no grego e fica naturalmente implícito em português.
- source_word: μὲν ... δὲ
  choice: '..., mas ...'
  rationale: A correlação estabelece contraste entre os dois grupos; “mas” o expressa de maneira clara e natural.
theological_decisions:
- issue: Preservação das conotações simbólicas de direita e esquerda
  choice: 'Traduzir apenas a posição espacial: “à sua direita ... à esquerda”'
  alternative: Explicitar “no lugar de favor ... no lugar de desfavor”
  rationale: O versículo descreve o posicionamento dos grupos. Embora o contexto dê valor simbólico aos lados, explicitá-lo aqui acrescentaria interpretação não declarada na frase grega.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação “E” mantém a continuidade narrativa; “à sua direita ... à esquerda” verte naturalmente o idioma espacial grego.
