id: MAT.25.38
reference: Matthew 25:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πότε δέ σε εἴδομεν ξένον καὶ συνηγάγομεν, ἢ γυμνὸν καὶ περιεβάλομεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/038.yaml
  text: And when did we see you as a stranger and take you in[c][b][a], or naked and clothe you?
translation:
  language: pt
  text: E quando foi que te vimos como forasteiro[a] e te acolhemos[b], ou sem roupa[c] e te vestimos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estrangeiro”. O termo grego pode indicar alguém desconhecido ou de fora do círculo social; aqui, trata-se de alguém que necessita de hospitalidade.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “te reunimos” ou “te recebemos”; neste contexto, o sentido é acolher alguém, oferecendo-lhe hospitalidade.
    reason: lexical_alternative
  - marker: c
    text: Ou “com roupa insuficiente”. O termo grego pode se referir tanto à nudez quanto à falta de vestuário adequado.
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: quando foi que
  rationale: Expressa de modo natural em português a pergunta pelo momento em que a ação teria ocorrido.
- source_word: δέ
  choice: E
  rationale: Liga esta pergunta à sequência anterior de maneira leve, sem introduzir um contraste forte.
- source_word: σε
  choice: te
  rationale: Mantém a referência direta e singular ao rei na parábola, com uma construção fluente em português.
- source_word: εἴδομεν
  choice: vimos
  rationale: Preserva o valor passado do aoristo e se encaixa naturalmente na construção interrogativa.
- source_word: ξένον
  choice: como forasteiro
  rationale: Indica alguém de fora ou desconhecido que necessita de hospitalidade, sem limitar o sentido à nacionalidade.
- source_word: συνηγάγομεν
  choice: te acolhemos
  rationale: Embora o verbo possa significar literalmente reunir ou receber, neste contexto descreve receber alguém com hospitalidade.
- source_word: ἢ
  choice: ou
  rationale: Mantém a conjunção disjuntiva que introduz a segunda situação.
- source_word: γυμνὸν
  choice: sem roupa
  rationale: Comunica com clareza o sentido básico, deixando em nota a possibilidade de roupa insuficiente.
- source_word: περιεβάλομεν
  choice: te vestimos
  rationale: Expressa de forma concisa e natural o ato de pôr roupa em alguém.
theological_decisions:
- issue: O sentido de ξένος no contexto de hospitalidade e juízo
  choice: forasteiro
  alternative: estrangeiro
  rationale: “Forasteiro” preserva a ideia social de alguém de fora, desconhecido e necessitado de acolhimento, sem impor uma categoria moderna de nacionalidade.
- issue: A amplitude semântica de γυμνός
  choice: sem roupa
  alternative: com roupa insuficiente
  rationale: O texto principal mantém o sentido mais direto, enquanto a nota preserva a possibilidade contextual de falta de vestuário adequado.
translation_notes:
  register: Português moderno, digno e acessível, com construção pronominal amplamente compreensível. “Forasteiro” foi preferido a “estranho”, que hoje pode sugerir algo esquisito, e a “estrangeiro”, que pode restringir indevidamente o sentido à nacionalidade.
