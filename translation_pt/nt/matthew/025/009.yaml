source:
  edition: SBLGNT
  text: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι· Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ ἡμῖν καὶ ὑμῖν· ⸀πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας καὶ ἀγοράσατε ἑαυταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: pt
  text: 'Mas as prudentes responderam: “Não[a], pois talvez não haja o bastante para nós e para vocês. Vão, em vez disso, aos que vendem e comprem para vocês mesmas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego combina μήποτε, uma expressão de receio (“para que talvez não”), com οὐ μή, uma negação enfática. A construção manifesta forte preocupação de que o suprimento não seja suficiente para ambos os grupos.
    reason: Explica a construção grega incomum e sua ênfase sem impor ao português principal uma formulação artificial ou oferecer uma alternativa formal imprecisa.
lexical_decisions:
- source_word: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι
  choice: Mas as prudentes responderam
  rationale: “Responderam” expressa naturalmente a fórmula narrativa grega; “as prudentes” preserva o adjetivo substantivado feminino sem repetir um substantivo já dado pelo contexto. O particípio λέγουσαι não precisa ser reproduzido por “dizendo”, que soaria redundante em português.
- source_word: Μήποτε οὐ μὴ ἀρκέσῃ
  choice: Não, pois talvez não haja o bastante
  rationale: A resposta começa com uma recusa implícita e apresenta forte preocupação de que o óleo não seja suficiente. A formulação portuguesa é natural, enquanto a nota registra a força incomum da negação grega.
- source_word: ἡμῖν καὶ ὑμῖν
  choice: para nós e para vocês
  rationale: Expressa com clareza os dativos de interesse e usa “vocês”, de ampla legibilidade brasileira.
- source_word: πορεύεσθε μᾶλλον
  choice: Vão, em vez disso
  rationale: Transmite tanto o imperativo de movimento como a alternativa marcada por μᾶλλον.
- source_word: πρὸς τοὺς πωλοῦντας
  choice: aos que vendem
  rationale: Conserva o particípio substantivado sem acrescentar explicitamente “óleo”, embora este seja entendido pelo contexto.
- source_word: ἀγοράσατε ἑαυταῖς
  choice: comprem para vocês mesmas
  rationale: O feminino “mesmas” preserva o referente feminino do pronome reflexivo e deixa claro que a compra seria para uso delas próprias.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e direto, com boa legibilidade brasileira. Emprega “vocês” e concordância na terceira pessoa do plural. As falas usam imperativos naturais e mantêm explicitamente o gênero feminino quando exigido pelo grego.
