  text: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι ἦλθεν ὁ νυμφίος, καὶ αἱ ἕτοιμοι εἰσῆλθον μετ’ αὐτοῦ εἰς τοὺς γάμους, καὶ ἐκλείσθη ἡ θύρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
translation:
  language: pt
  text: Mas, enquanto elas saíam para comprar, veio o noivo. As que estavam preparadas entraram com ele para a festa de casamento[a], e a porta foi fechada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o banquete de casamento” ou simplesmente “para o casamento”. O plural grego pode se referir à celebração nupcial como um todo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι
  choice: Mas, enquanto elas saíam para comprar
  rationale: A construção genitiva absoluta expressa uma ação simultânea. “Saíam para comprar” preserva tanto a ideia de afastamento em ἀπέρχομαι quanto a finalidade indicada pelo infinitivo ἀγοράσαι, sem acrescentar o objeto “óleo”, que não aparece neste versículo.
- source_word: ὁ νυμφίος
  choice: o noivo
  rationale: “Noivo” é a designação portuguesa natural e precisa para o homem no contexto do casamento, preservando a imagem da parábola sem explicitação interpretativa.
- source_word: αἱ ἕτοιμοι
  choice: as que estavam preparadas
  rationale: O adjetivo feminino plural é substantivado e se refere às jovens preparadas. A formulação mantém o referente feminino e expressa adequadamente a ideia de prontidão.
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: entraram com ele
  rationale: Tradução direta e idiomática do movimento narrativo expresso pelo aoristo.
- source_word: εἰς τοὺς γάμους
  choice: para a festa de casamento
  rationale: O plural grego pode designar a celebração nupcial como um todo. “Festa de casamento” é claro e natural no português atual, sem sugerir vários casamentos.
- source_word: ἐκλείσθη ἡ θύρα
  choice: a porta foi fechada
  rationale: O aoristo passivo é reproduzido de modo direto, mantendo o agente implícito e a solenidade conclusiva da cena.
theological_decisions:
- issue: Imagem nupcial no contexto da parábola
  choice: Manter “noivo” e “festa de casamento” como elementos narrativos, sem explicitar uma identificação cristológica
  alternative: Inserir na tradução uma interpretação teológica do noivo ou empregar linguagem mais explicitamente escatológica
  rationale: A interpretação teológica deve surgir do contexto da parábola; o versículo não explicita a identidade simbólica do noivo. A tradução preserva a imagem e a tensão do texto sem expansão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Saíam para comprar” conserva o objeto implícito do original; “festa de casamento” evita o tom arcaizante de “bodas”. O marcador da nota foi colocado junto à expressão que ela esclarece.
