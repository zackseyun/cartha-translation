base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/011.yaml
  text: While they were going[a], behold[b], some of the guard came into the city and reported to the chief priests everything that had happened.
translation:
  language: pt
  text: Enquanto elas estavam a caminho[a], eis que[b] alguns da guarda chegaram à cidade e relataram aos principais sacerdotes tudo o que havia acontecido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Enquanto elas iam”. O grego usa uma construção que estabelece o período em que ocorreu o acontecimento seguinte.'
    reason: lexical_alternative
  - marker: b
    text: “Eis que” traduz o marcador de atenção grego ἰδού, que assinala uma mudança repentina ou digna de nota na narrativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευομένων δὲ αὐτῶν
  choice: Enquanto elas iam
  rationale: O genitivo absoluto estabelece a ação em andamento como pano de fundo temporal, e δέ marca a transição narrativa. O pronome foi expresso no feminino porque, no contexto imediato, retoma as mulheres mencionadas nos versículos anteriores.
- source_word: ἰδού
  choice: eis que
  rationale: Mantém o marcador de atenção do grego e assinala uma mudança repentina ou digna de nota na narrativa.
- source_word: τινες τῆς κουστωδίας
  choice: alguns membros da guarda
  rationale: κουστωδία designa o destacamento de guarda colocado junto ao túmulo. A formulação deixa claro que somente parte do grupo foi à cidade.
- source_word: ἐλθόντες εἰς τὴν πόλιν
  choice: chegaram à cidade
  rationale: O particípio aoristo indica uma ação anterior à comunicação do relato. Em português, a oração coordenada comunica naturalmente essa sequência sem conservar uma construção participial rígida.
- source_word: ἀπήγγειλαν
  choice: relataram
  rationale: O verbo descreve a transmissão de uma informação ou relatório; “relataram” convém ao ato de informar autoridades sobre os acontecimentos.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: aos principais sacerdotes
  rationale: Expressão corrente para o plural ἀρχιερεῖς no contexto da liderança sacerdotal judaica do período.
- source_word: ἅπαντα τὰ γενόμενα
  choice: tudo o que havia acontecido
  rationale: Preserva tanto a ideia abrangente de ἅπαντα quanto a referência retrospectiva aos acontecimentos já ocorridos.
