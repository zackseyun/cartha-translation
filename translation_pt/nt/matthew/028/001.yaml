id: MAT.28.1
reference: Matthew 28:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὀψὲ δὲ σαββάτων, τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων, ἦλθεν ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία θεωρῆσαι τὸν τάφον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/001.yaml
  text: After the Sabbath[a], as it was dawning toward the first day of the week, Mary Magdalene and the other Mary came to look at the tomb.
translation:
  language: pt
  text: Depois do sábado[a], ao amanhecer do primeiro dia da semana, Maria Madalena e a outra Maria vieram ver o túmulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “No fim do sábado, ao amanhecer do primeiro dia da semana”. A expressão grega inicial pode ser entendida tanto como “depois do sábado” quanto como “no fim do sábado”.'
    reason: Leitura alternativa decorrente da ambiguidade da expressão grega ὀψὲ σαββάτων.
lexical_decisions:
- source_word: Ὀψὲ δὲ σαββάτων
  choice: Depois do sábado
  rationale: ὀψέ com o genitivo pode indicar tempo posterior a um acontecimento. Neste contexto, a expressão provavelmente situa a visita depois de terminado o sábado. Embora σαββάτων esteja formalmente no plural, aqui funciona como designação idiomática do sábado. A ambiguidade real de ὀψέ é preservada em nota.
- source_word: τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων
  choice: ao amanhecer do primeiro dia da semana
  rationale: ἐπιφώσκω indica aqui o surgimento da luz do dia, e μίαν σαββάτων é a forma idiomática de designar o primeiro dia da semana. A formulação portuguesa expressa naturalmente a transição para esse dia.
- source_word: ἦλθεν
  choice: vieram
  rationale: O singular grego com o sujeito composto é vertido pelo plural exigido pelo português corrente. “Vieram” mantém o movimento narrativo expresso por ἔρχομαι.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Maria Madalena
  rationale: Emprega a forma tradicional e corrente do nome em português.
- source_word: ἡ ἄλλη Μαρία
  choice: a outra Maria
  rationale: Preserva diretamente a distinção narrativa indicada por ἄλλη, sem identificar essa Maria além do que o texto diz.
- source_word: θεωρῆσαι
  choice: ver
  rationale: θεωρέω pode indicar olhar ou observar com atenção. “Ver” é natural neste contexto e não exagera a ação como uma inspeção formal.
- source_word: τὸν τάφον
  choice: o túmulo
  rationale: τάφος designa aqui o lugar onde Jesus foi sepultado; “túmulo” é o equivalente moderno mais claro.
theological_decisions:
- issue: Expressão temporal no início da narrativa da ressurreição
  choice: A visita é situada depois do sábado, ao amanhecer do primeiro dia da semana.
  alternative: A abertura também pode ser entendida como “No fim do sábado”, situando a primeira expressão ainda no sábado.
  rationale: A construção grega ὀψὲ σαββάτων admite discussão. O contexto e a combinação das indicações temporais favorecem “depois do sábado”, mas a tradução não elimina a leitura alternativa, que é apresentada em nota sem harmonização externa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação evita arcaísmos e mantém a ambiguidade temporal genuína por meio de nota.
