reference: Matthew 28:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τοῦ φόβου αὐτοῦ ἐσείσθησαν οἱ τηροῦντες καὶ ἐγενήθησαν ⸀ὡς νεκροί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/004.yaml
  text: And from fear of him the guards shook and became like dead men[a].
translation:
  language: pt
  text: E, de medo dele, os guardas tremeram e ficaram como mortos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por causa do medo que sentiram dele, os guardas foram sacudidos e ficaram como mortos.”'
    reason: Alternativa lexical que explicita o valor causal de ἀπό e preserva mais diretamente a forma passiva de ἐσείσθησαν.
lexical_decisions:
- source_word: ἀπὸ
  choice: de
  rationale: Com o genitivo, indica aqui a origem ou causa da reação; “de medo” é uma construção natural em português e mantém de perto a estrutura grega.
- source_word: δὲ
  choice: E
  rationale: Conectivo narrativo leve, que dá continuidade ao relato sem introduzir um contraste forte.
- source_word: φόβου
  choice: medo
  rationale: Equivalente direto e neutro de φόβος; “terror” intensificaria lexicalmente o termo além do necessário.
- source_word: αὐτοῦ
  choice: dele
  rationale: Mantém o pronome masculino e sua referência mais provável ao anjo mencionado no contexto imediato, sem explicitar no texto o antecedente.
- source_word: ἐσείσθησαν
  choice: tremeram
  rationale: Expressa de modo idiomático em português a reação física indicada por σείω; “foram sacudidos” seria excessivamente literal neste contexto.
- source_word: οἱ τηροῦντες
  choice: os guardas
  rationale: O particípio substantivado significa literalmente “os que vigiavam”; no contexto, “os guardas” é claro, conciso e natural.
- source_word: ἐγενήθησαν
  choice: ficaram
  rationale: Indica mudança de estado em português corrente. “Tornaram-se” seria possível, mas menos natural para esta reação súbita.
- source_word: ὡς
  choice: como
  rationale: Introduz uma comparação, sem afirmar que os guardas realmente morreram.
- source_word: νεκροί
  choice: mortos
  rationale: O adjetivo masculino plural concorda naturalmente com “guardas” e preserva a comparação concisa do grego.
theological_decisions:
- issue: Referente de αὐτοῦ (“dele”)
  choice: O pronome é preservado e, pelo contexto, refere-se mais provavelmente ao anjo descrito no versículo anterior.
  alternative: Entender o medo como reação mais geral ao acontecimento celestial em seu conjunto.
  rationale: O antecedente pessoal mais próximo é o anjo, cuja aparência acaba de ser descrita. Preservar “dele” mantém a coesão textual sem tornar explícito no corpo do versículo o que o grego deixa pronominal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A formulação conserva o pronome ambíguo quanto ao antecedente explícito e a comparação “como mortos”.
