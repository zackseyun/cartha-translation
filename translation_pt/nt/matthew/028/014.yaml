id: MAT.28.14
reference: Matthew 28:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀκουσθῇ τοῦτο ⸀ἐπὶ τοῦ ἡγεμόνος, ἡμεῖς πείσομεν ⸀αὐτὸν καὶ ὑμᾶς ἀμερίμνους ποιήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/014.yaml
  text: And if this is heard by the governor, we will persuade him and keep you out of trouble.
translation:
  language: pt
  text: E, se isso chegar ao conhecimento do governador,[a] nós o convenceremos e livraremos vocês de qualquer preocupação.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se isso for relatado ao governador”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “faremos vocês livres de preocupação”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσθῇ τοῦτο ἐπὶ τοῦ ἡγεμόνος
  choice: isso chegar ao conhecimento do governador
  rationale: A expressão passiva indica, de modo idiomático, que o assunto chega à atenção do governador. Esta formulação é natural em português e evita a possível leitura agentiva e pouco clara de “for ouvido pelo governador”.
- source_word: ἡγεμόνος
  choice: governador
  rationale: No contexto romano de Mateus, designa o governador provincial, isto é, Pilatos.
- source_word: πείσομεν αὐτόν
  choice: nós o convenceremos
  rationale: Preserva o sentido transparente de πείθω, “persuadir, convencer”, sem explicitar indevidamente como os líderes o fariam.
- source_word: ὑμᾶς ἀμερίμνους ποιήσομεν
  choice: livraremos vocês de qualquer preocupação
  rationale: Expressa naturalmente em português a construção resultativa “faremos vocês livres de preocupação”. O contexto sugere possíveis consequências disciplinares, mas o texto grego formula o resultado em termos de ausência de cuidado ou ansiedade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Vocês” traduz o plural ὑμᾶς. A formulação principal conserva a imagem lexical de ausência de preocupação, enquanto a nota registra de modo mais literal a construção grega.
