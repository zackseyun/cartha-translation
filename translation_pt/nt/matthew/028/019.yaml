id: MAT.28.19
reference: Matthew 28:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πορευθέντες ⸀οὖν μαθητεύσατε πάντα τὰ ἔθνη, ⸀βαπτίζοντες αὐτοὺς εἰς τὸ ὄνομα τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/019.yaml
  text: Therefore[a], go and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit,
translation:
  language: pt
  text: Portanto, vão e façam discípulos de todas as nações, batizando-os no nome[a] do Pai, do Filho e do Espírito Santo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “para dentro do nome”, expressão que pode enfatizar a entrada em uma relação ou identificação.
    reason: Preservar a força direcional de εἰς e a ambiguidade teológica que a formulação portuguesa natural “no nome” não expressa plenamente.
lexical_decisions:
- source_word: πορευθέντες
  choice: vão
  rationale: Embora seja formalmente um particípio aoristo, neste contexto acompanha o imperativo principal com força de comissão. “Vão” comunica isso de modo natural e atual; “tendo ido” seria rígido, e “enquanto vão” poderia fazer a ordem parecer incidental.
- source_word: οὖν
  choice: Portanto
  rationale: Expressa a inferência baseada na declaração de autoridade de Jesus no versículo anterior.
- source_word: μαθητεύσατε
  choice: façam discípulos
  rationale: 'Preserva o sentido causativo do verbo: levar pessoas a se tornarem discípulos. É mais claro no português corrente do que empregar “discipular” como verbo.'
- source_word: πάντα τὰ ἔθνη
  choice: todas as nações
  rationale: Mantém o alcance universal de ἔθνη como nações ou povos, sem restringi-lo apenas aos não judeus.
- source_word: βαπτίζοντες
  choice: batizando-os
  rationale: Mantém o termo reconhecido para o rito cristão sem decidir, pela tradução, uma modalidade específica de batismo.
- source_word: εἰς τὸ ὄνομα
  choice: no nome
  rationale: É uma formulação portuguesa natural para a expressão batismal. A nota registra a força direcional mais literal de εἰς, evitando que a tradução principal se torne artificial.
- source_word: τοῦ πατρὸς
  choice: do Pai
  rationale: A inicial maiúscula indica que se trata de um título divino nesta fórmula coordenada.
- source_word: τοῦ υἱοῦ
  choice: do Filho
  rationale: A inicial maiúscula preserva o caráter de título divino em coordenação com Pai e Espírito Santo.
- source_word: τοῦ ἁγίου πνεύματος
  choice: do Espírito Santo
  rationale: É a designação corrente e digna do referente pessoal divino no português moderno.
theological_decisions:
- issue: Tradução da preposição batismal εἰς na fórmula triádica
  choice: no nome, com nota sobre o sentido literal “para dentro do nome”
  alternative: para dentro do nome; em nome
  rationale: εἰς normalmente apresenta direção ou entrada e pode sugerir relação ou identificação. Contudo, “para dentro do nome” é pouco natural em português, enquanto “no nome” preserva a fórmula reconhecível. A nota mantém visível a textura do grego sem impor uma teoria sacramental específica.
- issue: Leitura pessoal e uso de maiúsculas em Pai, Filho e Espírito Santo
  choice: Pai, Filho e Espírito Santo
  alternative: pai, filho e espírito santo
  rationale: O único “nome” seguido de três genitivos coordenados constitui uma fórmula batismal triádica. As maiúsculas refletem títulos divinos pessoais sem ampliar o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vão e façam” em vez do mais solene “ide e fazei”, sem enfraquecer a força da comissão. Mantém a vírgula final porque o trecho fornecido continua no versículo seguinte da frase grega.
