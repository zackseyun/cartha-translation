  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου μετὰ φόβου καὶ χαρᾶς μεγάλης ἔδραμον ἀπαγγεῖλαι τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/008.yaml
  text: And leaving the tomb quickly[a], with fear and great joy, they ran to report to his disciples.
translation:
  language: pt
  text: E, saindo depressa do túmulo, com temor e grande alegria, elas correram para contar aos discípulos dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com reverência e grande alegria”. Neste contexto, a palavra grega traduzida como “temor” também pode incluir a ideia de assombro reverente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσαι
  choice: saindo
  rationale: O particípio aoristo indica que as mulheres se afastaram do túmulo; “saindo” é natural em português e mantém a relação circunstancial com a ação principal.
- source_word: ταχὺ
  choice: depressa
  rationale: Expressa a rapidez da partida de modo claro e corrente.
- source_word: μνημείου
  choice: túmulo
  rationale: No contexto do sepultamento e da ressurreição, designa claramente o lugar onde Jesus fora sepultado.
- source_word: μετὰ φόβου καὶ χαρᾶς μεγάλης
  choice: com temor e grande alegria
  rationale: Preserva lado a lado as duas reações emocionais apresentadas por Mateus, sem reduzir φόβος apenas a medo negativo nem apenas a reverência.
- source_word: ἔδραμον
  choice: elas correram
  rationale: Mantém a ação física vívida e explícita do aoristo de τρέχω.
- source_word: ἀπαγγεῖλαι
  choice: para contar
  rationale: O infinitivo expressa propósito. “Contar” comunica naturalmente a transmissão da notícia sem acrescentar um objeto direto ausente do grego.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: aos discípulos dele
  rationale: “Discípulos” preserva o termo relacional característico dos Evangelhos; “dele” retoma Jesus no contexto e evita que “seus” seja momentaneamente associado às mulheres.
theological_decisions:
- issue: A tensão emocional na reação das mulheres
  choice: com temor e grande alegria
  alternative: com reverência e grande alegria
  rationale: φόβος pode incluir assombro reverente neste contexto, mas “temor” conserva melhor a amplitude e a tensão do termo grego, sem decidir por apenas uma nuance.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada com naturalidade, mantendo a rapidez, a dupla reação emocional e a corrida das mulheres. O marcador foi colocado após a oração para que a nota se refira claramente à expressão “com temor e grande alegria”.
