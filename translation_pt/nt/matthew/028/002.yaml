id: MAT.28.2
reference: Matthew 28:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς ἐγένετο μέγας· ἄγγελος γὰρ κυρίου καταβὰς ἐξ οὐρανοῦ ⸀καὶ προσελθὼν ἀπεκύλισε τὸν ⸀λίθον καὶ ἐκάθητο ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/002.yaml
  text: And behold, there was a great earthquake, for an angel of the Lord had come down from heaven and came up and rolled away the stone and was sitting on it.
translation:
  language: pt
  text: E eis que houve um grande terremoto, pois um anjo do Senhor desceu do céu, aproximou-se, rolou a pedra e estava sentado sobre ela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Preserva o marcador enfático e narrativo do grego em linguagem bíblica digna e ainda compreensível.
- source_word: σεισμὸς ... μέγας
  choice: um grande terremoto
  rationale: Tradução direta e natural da expressão grega.
- source_word: ἄγγελος ... κυρίου
  choice: um anjo do Senhor
  rationale: Mantém a construção anartrosa e a designação tradicional, sem acrescentar especificação ausente no texto.
- source_word: καταβὰς ἐξ οὐρανοῦ
  choice: desceu do céu
  rationale: O particípio aoristo indica ação anterior ou circunstancial em relação aos verbos principais; o português permite expressá-la naturalmente como verbo coordenado.
- source_word: προσελθὼν
  choice: aproximou-se
  rationale: Representa o sentido contextual de chegar perto, sem o possível equívoco espacial de 'subiu'.
- source_word: ἀπεκύλισε
  choice: removeu
  rationale: Expressa com naturalidade o ato de rolar a pedra para fora de sua posição; 'rolou para o lado' seria uma alternativa mais explícita.
- source_word: ἐκάθητο ἐπάνω αὐτοῦ
  choice: sentou-se sobre ela
  rationale: Mantém a referência inequívoca à pedra e traduz a posição do anjo com clareza.
theological_decisions:
- issue: Relação causal introduzida por γάρ
  choice: pois
  alternative: porque
  rationale: Preserva a explicação de que o terremoto está relacionado à descida e à ação do anjo, sem desenvolver além do que o texto afirma.
- issue: Sequência temporal dos aoristos e do imperfeito
  choice: desceu do céu, aproximou-se, removeu a pedra e sentou-se sobre ela
  alternative: tinha descido do céu, aproximou-se, removeu a pedra e estava sentado sobre ela
  rationale: A sequência verbal portuguesa conserva o progresso narrativo. Embora o particípio possa ser vertido como ação anterior e o imperfeito destaque um estado em curso, o contexto não exige mais-que-perfeito nem uma perífrase progressiva.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Conserva 'e eis que' por seu valor discursivo enfático, mas evita construções pouco naturais como 'veio para perto'. Não foram necessárias notas de rodapé.
