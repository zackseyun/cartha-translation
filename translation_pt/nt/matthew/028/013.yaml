id: MAT.28.13
reference: Matthew 28:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγοντες· Εἴπατε ὅτι Οἱ μαθηταὶ αὐτοῦ νυκτὸς ἐλθόντες ἔκλεψαν αὐτὸν ἡμῶν κοιμωμένων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/013.yaml
  text: saying[a], “Say[b], ‘His disciples came by night and stole him while we were sleeping.’”
translation:
  language: pt
  text: 'dizendo: “Digam: ‘Os discípulos dele vieram durante a noite[a] e o roubaram[b] enquanto estávamos dormindo.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à noite”. O grego νυκτός funciona adverbialmente e indica quando eles vieram.
    reason: lexical_alternative
  - marker: b
    text: Em grego, “o” (isto é, “a ele”), não “o corpo dele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: dizendo
  rationale: O particípio presente introduz o conteúdo da instrução; “dizendo” preserva de modo natural a ligação narrativa.
- source_word: Εἴπατε
  choice: Digam
  rationale: O imperativo aoristo na segunda pessoa do plural expressa uma ordem direta; “Digam” mantém tanto a força imperativa quanto o número plural.
- source_word: ὅτι
  choice: representado pelos dois-pontos e pela citação direta
  rationale: ὅτι introduz o conteúdo do que deve ser dito. Em português natural, essa função pode ser expressa pela pontuação, sem acrescentar “que” antes de uma fala direta.
- source_word: Οἱ μαθηταὶ αὐτοῦ
  choice: Os discípulos dele
  rationale: A construção possessiva refere-se claramente a Jesus. “Dele” é corrente, evita uma formulação artificial e não acrescenta reverência tipográfica ausente do grego.
- source_word: νυκτὸς
  choice: durante a noite
  rationale: O genitivo adverbial indica quando eles teriam vindo. “Durante a noite” comunica com clareza esse valor temporal.
- source_word: ἐλθόντες
  choice: vieram
  rationale: 'O particípio aoristo descreve ação anterior à de roubar; em português, a sequência natural é expressa por dois verbos coordenados: “vieram ... e ... roubaram”.'
- source_word: ἔκλεψαν
  choice: roubaram
  rationale: Equivalente direto e corrente do aoristo ativo que designa o ato de furtar ou levar algo clandestinamente.
- source_word: αὐτὸν
  choice: o
  rationale: O pronome pessoal retoma Jesus. O objeto pronominal “o” preserva a referência pessoal sem introduzir a explicação “o corpo dele”.
- source_word: ἡμῶν κοιμωμένων
  choice: enquanto estávamos dormindo
  rationale: A construção de genitivo absoluto expressa uma circunstância simultânea; esta formulação é clara e idiomática em português moderno.
theological_decisions:
- issue: Referente de αὐτόν no relato fabricado
  choice: Manter o pronome pessoal “o”
  alternative: “o corpo dele”
  rationale: O texto grego emprega o pronome pessoal αὐτόν, não uma expressão para “corpo”. A expansão interpretativa não é necessária, pois o contexto identifica o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade no Brasil. A fala direta dentro da instrução preserva a estrutura do original, e os marcadores de nota aparecem junto às expressões às quais efetivamente se referem.
