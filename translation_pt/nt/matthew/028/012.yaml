  text: καὶ συναχθέντες μετὰ τῶν πρεσβυτέρων συμβούλιόν τε λαβόντες ἀργύρια ἱκανὰ ἔδωκαν τοῖς στρατιώταις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/012.yaml
  text: And after gathering with the elders and taking counsel[a], they gave a considerable sum of silver to the soldiers,
translation:
  language: pt
  text: Depois de se reunirem com os anciãos e deliberarem, deram aos soldados uma quantia considerável de prata[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma grande quantia de dinheiro em prata”. O grego literalmente se refere a “prata considerável”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθέντες
  choice: depois de se reunirem
  rationale: O particípio aoristo passivo tem aqui sentido de reunião do grupo. A formulação explicita naturalmente em português a sequência anterior ao verbo principal.
- source_word: μετὰ τῶν πρεσβυτέρων
  choice: com os anciãos
  rationale: μετά com o genitivo indica associação; “anciãos” é a designação corrente desses líderes no contexto.
- source_word: συμβούλιόν τε λαβόντες
  choice: e deliberarem
  rationale: A expressão idiomática συμβούλιον λαμβάνω indica consultar-se e chegar a uma decisão conjunta. “Deliberarem” preserva esse sentido sem sugerir que apenas receberam conselho de terceiros.
- source_word: ἀργύρια
  choice: uma quantia ... em prata
  rationale: O plural pode designar prata usada como dinheiro. “Quantia em prata” mantém a referência explícita ao metal e soa natural com o qualificativo de quantidade.
- source_word: ἱκανὰ
  choice: considerável
  rationale: Neste contexto, o adjetivo caracteriza a grande quantidade do pagamento, não apenas sua suficiência.
- source_word: ἔδωκαν
  choice: deram
  rationale: Tradução direta e natural do aoristo de δίδωμι.
- source_word: τοῖς στρατιώταις
  choice: aos soldados
  rationale: Preserva o sentido lexical de στρατιώταις; embora atuassem como guardas, o texto os chama de soldados.
theological_decisions:
- issue: Identificação do sujeito implícito
  choice: O sujeito de “se reunirem”, “deliberarem” e “deram” permanece implícito e retoma os principais sacerdotes do versículo anterior.
  alternative: Repetir explicitamente “os principais sacerdotes” ou deixar o grupo sem referente contextual definido.
  rationale: As formas verbais gregas estão no masculino plural e dão continuidade ao referente ativo de Mateus 28:11. Não se acrescenta ao versículo um substantivo que o grego não repete.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Deliberarem” comunica uma consulta conjunta orientada a uma decisão; “quantia considerável em prata” preserva a imagem lexical do grego sem recorrer ao pouco natural “pratas”.
