  text: καὶ ἰδόντες αὐτὸν ⸀προσεκύνησαν, οἱ δὲ ἐδίστασαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/017.yaml
  text: And when they saw him[a], they worshiped him, but some doubted.
translation:
  language: pt
  text: Quando o viram, eles o adoraram, mas alguns hesitaram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “duvidaram” ou “vacilaram”. O grego pode indicar incerteza ou hesitação, não necessariamente incredulidade consolidada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: quando o viram
  rationale: O particípio aoristo de ὁράω é expresso naturalmente como oração temporal, preservando sua relação com os verbos principais.
- source_word: προσεκύνησαν
  choice: o adoraram
  rationale: προσκυνέω pode indicar prostração, homenagem ou adoração; no contexto do encontro com Jesus ressuscitado, “adoraram” comunica adequadamente a força reverencial e teológica do ato.
- source_word: οἱ δὲ
  choice: mas alguns
  rationale: A construção é contrastiva e elíptica, indicando parte do grupo; “mas alguns” torna essa relação clara em português sem identificar quem eram.
- source_word: ἐδίστασαν
  choice: hesitaram
  rationale: διστάζω descreve dúvida, vacilação ou hesitação. “Hesitaram” preserva a ideia de incerteza momentânea sem sugerir necessariamente incredulidade consolidada.
theological_decisions:
- issue: Força de προσκυνέω em relação ao Jesus ressuscitado
  choice: adoraram
  alternative: prostraram-se diante dele; prestaram-lhe homenagem
  rationale: O contexto da ressurreição e o uso do verbo dirigido a Jesus sustentam “adoraram”, sem eliminar o componente corporal de prostração que o termo pode envolver.
- issue: Nuance de διστάζω
  choice: hesitaram
  alternative: duvidaram; vacilaram
  rationale: O termo grego admite dúvida ou vacilação. “Hesitaram” conserva a tensão narrativa sem caracterizar a atitude como incredulidade firme; a nota registra as alternativas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O pronome explícito “eles” evita que “alguns” pareça contrastar com o objeto “o”, e a nota mantém a amplitude semântica de διστάζω.
