source:
  edition: SBLGNT
  text: διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ ἰδοὺ ἐγὼ μεθ’ ὑμῶν εἰμι πάσας τὰς ἡμέρας ἕως τῆς συντελείας τοῦ ⸀αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/020.yaml
  text: teaching them to keep all that I commanded you. And behold[a], I am with you all the days, until the end of the age.
translation:
  language: pt
  text: ensinando-os a guardar tudo o que ordenei a vocês. E eis que estou com vocês todos os dias, até a consumação da era.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até o fim da era”; tradicionalmente, “até o fim do mundo”. O grego fala da consumação da era (αἰών), não especificamente do mundo físico.
    reason: Esclarece a alternativa tradicional e a distinção lexical entre “era” e o mundo físico.
lexical_decisions:
- source_word: διδάσκοντες
  choice: ensinando-os
  rationale: Mantém o particípio presente e expressa a ação contínua pela qual se formam discípulos.
- source_word: τηρεῖν
  choice: a guardar
  rationale: “Guardar” abrange observar e obedecer aos mandamentos, sem reduzir o sentido à mera conformidade externa.
- source_word: πάντα ὅσα
  choice: tudo o que
  rationale: Formulação portuguesa natural que preserva o alcance abrangente da expressão grega.
- source_word: ἐνετειλάμην
  choice: ordenei
  rationale: Comunica de modo claro a autoridade do verbo ἐντέλλομαι, sem a aspereza de “dei ordens”.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva o marcador enfático e solene, em português digno e reconhecível.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: estou com vocês
  rationale: Representa diretamente a presença prometida por Jesus; “vocês” favorece ampla legibilidade brasileira.
- source_word: πάσας τὰς ἡμέρας
  choice: todos os dias
  rationale: Conserva a imagem literal de presença dia após dia e soa mais natural em português do que “todos os dias [inteiros]” ou simplesmente “sempre”.
- source_word: συντελείας
  choice: consumação
  rationale: Expressa o sentido de conclusão plena ou culminação, não apenas uma interrupção abrupta.
- source_word: αἰῶνος
  choice: desta era
  rationale: “Era” traduz αἰών sem confundi-lo com o mundo físico; “desta” torna natural em português a referência à era vigente implícita no contexto escatológico.
theological_decisions:
- issue: Sentido de ἕως τῆς συντελείας τοῦ αἰῶνος
  choice: até a consumação desta era
  alternative: até o fim desta era; tradicionalmente, até o fim do mundo
  rationale: A formulação preserva a culminação escatológica indicada por συντέλεια e traduz αἰών como período ou era, sem sugerir especificamente a destruição do mundo físico.
- issue: Alcance temporal da promessa “estou com vocês”
  choice: todos os dias, até a consumação desta era
  alternative: sempre, até o fim dos tempos
  rationale: Mantém a expressão concreta “todos os dias” e o limite temporal formulado no grego, sem inferir além do que o texto declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Eis que” preserva a solenidade enfática do original; “vocês” evita regionalismo excessivo; “consumação desta era” mantém a precisão escatológica, apoiada por nota explicativa.
