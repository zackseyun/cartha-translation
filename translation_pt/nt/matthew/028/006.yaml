  text: οὐκ ἔστιν ὧδε, ἠγέρθη γὰρ καθὼς εἶπεν· δεῦτε ἴδετε τὸν τόπον ὅπου ⸀ἔκειτο·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/006.yaml
  text: He is not here[a], for he has been raised, just as he said. Come[b], see the place where he was lying.
translation:
  language: pt
  text: Ele não está aqui, pois foi ressuscitado, assim como disse. Venham, vejam o lugar onde ele estava deitado[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “onde ele jazia” ou “onde havia sido colocado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: Ele não está aqui
  rationale: A expressão grega indica localização; o pronome é explicitado em português porque o referente está claro no contexto.
- source_word: ἠγέρθη
  choice: foi ressuscitado
  rationale: Preserva a voz passiva do aoristo grego e soa natural em português, sem transformar a declaração em voz ativa.
- source_word: γὰρ
  choice: pois
  rationale: Introduz de modo conciso a razão de ele não estar ali.
- source_word: καθὼς εἶπεν
  choice: assim como disse
  rationale: Expressa a correspondência entre a ressurreição e o que Jesus havia anunciado, sem tornar explícito no verbo português algo que o contexto já esclarece.
- source_word: δεῦτε
  choice: Venham
  rationale: É um chamado dirigido às mulheres; o plural torna os destinatários naturais e claros em português.
- source_word: ἴδετε
  choice: vejam
  rationale: Transmite o imperativo de inspeção imediata em linguagem atual e digna.
- source_word: τὸν τόπον
  choice: o lugar
  rationale: É a equivalência mais direta e natural para o espaço físico dentro do túmulo.
- source_word: ὅπου ἔκειτο
  choice: onde ele jazia
  rationale: Mantém o sentido estativo do imperfeito de κεῖμαι e evita acrescentar uma ação passiva explícita de colocá-lo ali.
theological_decisions:
- issue: Voz e agência na declaração da ressurreição
  choice: foi ressuscitado
  alternative: ressuscitou
  rationale: A forma grega é passiva. A tradução conserva essa voz e a nuance de uma ação realizada sobre Jesus, sem negar outras formulações neotestamentárias sobre sua agência.
- issue: Sentido estativo de ὅπου ἔκειτο
  choice: onde ele jazia
  alternative: onde ele havia sido colocado
  rationale: O grego descreve o estado de estar deitado ou posto, sem formular explicitamente o ato anterior de sepultamento; a alternativa pode explicar o contexto, mas acrescenta essa ação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Foi ressuscitado” preserva a voz passiva; “jazia” é conciso e digno, embora a nota ofereça opções mais correntes. Os imperativos plurais refletem que a fala se dirige às mulheres mencionadas no contexto.
