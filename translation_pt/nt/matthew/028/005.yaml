  text: ἀποκριθεὶς δὲ ὁ ἄγγελος εἶπεν ταῖς γυναιξίν· Μὴ φοβεῖσθε ὑμεῖς, οἶδα γὰρ ὅτι Ἰησοῦν τὸν ἐσταυρωμένον ζητεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/005.yaml
  text: But the angel answered and said to the women[a], “Do not be afraid[b]; for I know that you are seeking Jesus who has been crucified.”
translation:
  language: pt
  text: 'Mas o anjo respondeu às mulheres: “Vocês não tenham medo[a], pois sei que estão procurando Jesus, aquele que foi crucificado[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz explicitamente o pronome “vocês” para dar ênfase: a tranquilização é dirigida de modo particular às mulheres.'
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “Jesus, o crucificado” ou “Jesus, que foi crucificado”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἄγγελος εἶπεν
  choice: Mas o anjo respondeu
  rationale: A combinação idiomática de particípio e verbo de fala pode ser expressa naturalmente em português por “respondeu”, sem a redundância pouco idiomática “respondeu e disse”; δέ é preservado como transição contrastiva por “Mas”.
- source_word: ταῖς γυναιξίν
  choice: às mulheres
  rationale: É a designação direta e natural das mulheres presentes na narrativa.
- source_word: Μὴ φοβεῖσθε ὑμεῖς
  choice: Não tenham medo, vocês
  rationale: “Não tenham medo” é a forma corrente de tranquilização, e o pronome explícito “vocês” procura conservar a ênfase de ὑμεῖς, explicada em nota.
- source_word: οἶδα γὰρ ὅτι
  choice: pois sei que
  rationale: “Pois” mantém a função explicativa de γάρ, enquanto “sei que” introduz naturalmente o conteúdo conhecido.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: τὸν ἐσταυρωμένον
  choice: aquele que foi crucificado
  rationale: O particípio perfeito passivo é substantivado e atributivo; esta formulação preserva a identificação de Jesus como aquele que sofreu a crucificação, com resultado ainda relevante, sem tornar o português excessivamente pesado.
- source_word: ζητεῖτε
  choice: estão procurando
  rationale: O presente indica a ação em curso; “procurando” é mais natural no português comum do que “buscando” neste contexto concreto.
theological_decisions:
- issue: Ênfase do pronome explícito ὑμεῖς na tranquilização do anjo
  choice: Manter “vocês” no texto e explicar sua ênfase em nota.
  alternative: 'Omitir o pronome: “Não tenham medo”.'
  rationale: O grego salienta as mulheres como destinatárias particulares da tranquilização. A tradução mantém essa ênfase sem definir de modo indevido com quem elas estariam sendo contrastadas.
- issue: Força de τὸν ἐσταυρωμένον
  choice: “aquele que foi crucificado”
  alternative: “o crucificado” ou “que foi crucificado”
  rationale: A formulação conserva o valor identificador do particípio passivo sem acrescentar uma interpretação doutrinária ao aspecto perfeito.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A fórmula grega redundante de fala foi condensada de modo idiomático, enquanto a ênfase incomum do pronome foi preservada no texto e esclarecida em nota.
