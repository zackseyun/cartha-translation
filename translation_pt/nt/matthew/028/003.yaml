  text: ἦν δὲ ἡ εἰδέα αὐτοῦ ⸀ὡς ἀστραπὴ καὶ τὸ ἔνδυμα αὐτοῦ λευκὸν ὡς χιών.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/003.yaml
  text: His appearance was like lightning[a], and his clothing white as snow.
translation:
  language: pt
  text: Sua aparência era como um relâmpago[a], e sua roupa, branca como a neve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “forma” ou “aspecto”, em vez de “aparência”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui, δέ funciona como conectivo narrativo leve. Em português, a continuidade com o versículo anterior é natural sem um conectivo explícito; “mas” sugeriria contraste excessivo.
- source_word: εἰδέα
  choice: aparência
  rationale: Refere-se ao aspecto visível ou à forma exterior. “Aparência” é natural, precisa e preserva a amplitude do termo.
- source_word: ὡς ἀστραπή
  choice: como um relâmpago
  rationale: ὡς introduz uma comparação. “Como um relâmpago” preserva a imagem e soa natural em português.
- source_word: ἔνδυμα
  choice: roupa
  rationale: É um termo geral para vestimenta. “Roupa” é claro e atual, sem especificar indevidamente manto ou túnica.
- source_word: λευκόν
  choice: branca
  rationale: Expressa simplesmente a cor branca. O feminino concorda com “roupa”, sem acrescentar uma intensidade ausente do grego.
- source_word: ὡς χιών
  choice: como a neve
  rationale: Preserva a segunda comparação, na qual a brancura da roupa é comparada à neve.
theological_decisions:
- issue: Referente de αὐτοῦ
  choice: Manter os possessivos “sua” sem explicitar o referente no versículo.
  alternative: Substituir os possessivos por “do anjo” ou interpretá-los como referência a Jesus.
  rationale: No contexto imediato, os pronomes retomam o anjo do Senhor mencionado no versículo 2, não Jesus. A tradução conserva a forma pronominal do grego e evita inserir um substantivo que não aparece neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A elipse do verbo em “e sua roupa, branca” acompanha a estrutura grega e permanece natural em português; a vírgula marca essa elipse.
