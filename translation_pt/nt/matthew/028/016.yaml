source:
  edition: SBLGNT
  text: Οἱ δὲ ἕνδεκα μαθηταὶ ἐπορεύθησαν εἰς τὴν Γαλιλαίαν εἰς τὸ ὄρος οὗ ἐτάξατο αὐτοῖς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/016.yaml
  text: The eleven disciples went to Galilee[a], to the mountain where Jesus had directed them,
translation:
  language: pt
  text: Os onze discípulos foram para a Galileia, ao monte que Jesus lhes havia indicado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que Jesus lhes havia designado”. O verbo grego também pode ter o sentido de determinar, ordenar ou marcar previamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: sem equivalente explícito
  rationale: δέ funciona aqui como conectivo leve de transição narrativa. Em português, iniciar diretamente com o sujeito produz fluxo natural sem criar um contraste mais forte com “mas” nem uma sequência temporal explícita com “então”.
- source_word: ἕνδεκα μαθηταὶ
  choice: os onze discípulos
  rationale: Preserva tanto o número específico do grupo após a ausência de Judas quanto o termo tradicional e claro para μαθηταί no contexto dos Evangelhos.
- source_word: ἐπορεύθησαν
  choice: foram
  rationale: É a forma mais natural e suficientemente precisa para o movimento narrado; alternativas como “viajaram” acrescentariam uma ênfase desnecessária na viagem.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: para a Galileia
  rationale: Expressa de modo idiomático o movimento em direção à região indicado por εἰς.
- source_word: εἰς τὸ ὄρος
  choice: ao monte
  rationale: ὄρος pode designar monte ou montanha. “Monte” é natural em português bíblico contemporâneo e, com o artigo e a oração relativa, mantém a referência a um lugar específico.
- source_word: οὗ ἐτάξατο αὐτοῖς
  choice: que Jesus lhes havia indicado
  rationale: A construção comunica que Jesus havia determinado ou indicado previamente aquele lugar. O mais-que-perfeito composto preserva a anterioridade, e “indicado” evita impor ao verbo um sentido excessivamente formal ou autoritário.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Forma portuguesa convencional do nome próprio.
theological_decisions:
- issue: Natureza da determinação prévia de Jesus
  choice: “Jesus lhes havia indicado”
  alternative: “Jesus lhes havia designado” ou “Jesus havia marcado com eles”
  rationale: O contexto aponta para a determinação prévia do local de encontro. “Indicado” preserva esse sentido narrativo sem transformar o verbo em uma nomeação eclesiástica nem intensificá-lo como uma ordem formal.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A formulação evita um conectivo inicial desnecessário e mantém a ambiguidade lexical de ἐτάξατο em nota.
