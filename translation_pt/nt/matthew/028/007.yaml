source:
  edition: SBLGNT
  text: καὶ ταχὺ πορευθεῖσαι εἴπατε τοῖς μαθηταῖς αὐτοῦ ὅτι Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἰδοὺ προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν, ἐκεῖ αὐτὸν ὄψεσθε· ἰδοὺ εἶπον ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/007.yaml
  text: And go quickly and tell his disciples, ‘He has been raised from the dead, and look, he is going ahead of you into Galilee. There you will see him.’ Look, I have told you.
translation:
  language: pt
  text: 'Vão depressa e digam aos discípulos dele: “Ele foi ressuscitado dentre os mortos e, vejam, vai adiante de vocês para a Galileia. Lá vocês o verão.” Vejam, eu lhes disse.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχὺ πορευθεῖσαι
  choice: Vão depressa
  rationale: Expressa de modo natural tanto o movimento ordenado pelo particípio quanto a urgência de ταχύ.
- source_word: Ἠγέρθη ἀπὸ τῶν νεκρῶν
  choice: Ele foi ressuscitado dentre os mortos
  rationale: Preserva a forma passiva do grego e a expressão que apresenta Jesus como levantado do domínio dos mortos.
- source_word: προάγει ὑμᾶς
  choice: vai adiante de vocês
  rationale: Mantém o sentido espacial de preceder o grupo, sem restringi-lo a simples chegada anterior.
- source_word: ἰδοὺ
  choice: vejam
  rationale: Interjeição corrente que chama a atenção e reproduz sua repetição no versículo sem o tom arcaico de “eis”.
theological_decisions:
- issue: Agente da ressurreição no passivo Ἠγέρθη
  choice: Ele foi ressuscitado
  alternative: Ele ressuscitou
  rationale: O passivo preserva a formulação do texto e não explicita o agente, mantendo a abertura teológica do original.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis e boa legibilidade brasileira. O plural “vocês” comunica naturalmente que a ordem é dirigida às mulheres; a repetição de “vejam” conserva a ênfase discursiva do grego.
