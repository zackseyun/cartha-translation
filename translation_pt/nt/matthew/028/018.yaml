  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ Ἰησοῦς ἐλάλησεν αὐτοῖς λέγων· Ἐδόθη μοι πᾶσα ἐξουσία ἐν οὐρανῷ καὶ ἐπὶ ⸀τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/018.yaml
  text: And Jesus came near and spoke to them[a], saying[b], “All authority in heaven and on earth has been given to me.”
translation:
  language: pt
  text: 'E Jesus se aproximou e lhes falou, dizendo: “Toda a autoridade[a] no céu e na terra me foi dada.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “poder”. A palavra grega também pode ser traduzida assim, mas aqui indica especialmente autoridade, direito ou domínio legítimo, e não apenas força ou capacidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: se aproximou
  rationale: O particípio aoristo indica que Jesus se dirigiu para mais perto dos discípulos antes de falar; “se aproximou” preserva de modo natural esse sentido espacial.
- source_word: ἐλάλησεν αὐτοῖς λέγων
  choice: falou com eles, dizendo
  rationale: A formulação conserva tanto o verbo λαλέω (“falar”) como o particípio λέγων (“dizendo”), sem confundir suas funções.
- source_word: Ἐδόθη μοι
  choice: me foi dada
  rationale: O pretérito perfeito passivo expressa em português um ato concluído pelo qual Jesus recebeu a autoridade. Diferentemente do present perfect inglês, “tem sido dada” sugeriria repetição ou continuidade e não seria adequado aqui.
- source_word: πᾶσα ἐξουσία
  choice: toda a autoridade
  rationale: Com o substantivo abstrato singular, πᾶσα indica totalidade. ἐξουσία designa autoridade, direito ou domínio legítimo, mais precisamente do que mera força.
- source_word: ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς
  choice: no céu e na terra
  rationale: Expressão portuguesa corrente que preserva os dois âmbitos abrangidos pela autoridade universal declarada por Jesus.
theological_decisions:
- issue: Natureza da autoridade universal de Jesus
  choice: Toda a autoridade no céu e na terra me foi dada
  alternative: Todo o poder no céu e na terra me foi dado
  rationale: Mantém-se a voz passiva de Ἐδόθη, preservando a afirmação de que a autoridade foi concedida a Jesus, sem substituir essa relação por uma declaração abstrata de posse inerente. “Autoridade” comunica melhor o governo legítimo expresso por ἐξουσία, enquanto “poder” pode ser entendido apenas como capacidade ou força.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A ordem da frase mantém a progressão do grego, e “falou com eles, dizendo” preserva sua estrutura sem recorrer a linguagem arcaica.
