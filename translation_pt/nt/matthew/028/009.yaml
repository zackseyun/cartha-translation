  source_fidelity: 'A tradução preserva a sequência narrativa e os elementos centrais do grego: o marcador de atenção (ἰδού), o encontro, a saudação plural, a aproximação das mulheres e a reverência a Jesus. Contudo, “abraçaram os pés dele” sugere envolver os pés num abraço, enquanto ἐκράτησαν ... τοὺς πόδας significa mais precisamente que elas os seguraram ou agarraram.'
  naturalness: “E eis que”, “veio ao encontro delas”, “se aproximaram” e “o adoraram” são claros, naturais e adequados a um registro bíblico moderno. “Seguraram os pés dele” é idiomático e mais exato que “abraçaram os pés dele”. “Saudações!” comunica melhor a função convencional de χαίρετε neste contexto; a alternativa literal permanece em nota.
  terminology: “Adoraram” é uma opção contextual e lexicalmente defensável para προσεκύνησαν no cenário pós-ressurreição. A nota preserva, sem resolver dogmaticamente, as alternativas de prostração e homenagem.
