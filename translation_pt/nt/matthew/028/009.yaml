base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/009.yaml
  text: And behold[a], Jesus met them, saying, “Greetings!” And they came up, took hold of his feet[b], and worshiped him.
translation:
  language: pt
  text: 'E eis que Jesus veio ao encontro delas e disse: “Saudações!”[a] Elas se aproximaram, seguraram os pés dele e o adoraram.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Alegrem-se!” O grego traz literalmente um imperativo plural, mas, neste contexto, a expressão também funciona como saudação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “prostraram-se diante dele” ou “prestaram-lhe homenagem”. O verbo grego pode indicar prostração ou homenagem; neste contexto, provavelmente tem o sentido mais forte de adoração.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Preserva o marcador de atenção e a vivacidade narrativa do grego, em uma formulação bíblica ainda clara em português.
- source_word: ὑπήντησεν
  choice: veio ao encontro delas
  rationale: Expressa naturalmente o encontro de Jesus com as mulheres no caminho, sem sugerir mero acaso.
- source_word: Χαίρετε
  choice: Alegrem-se!
  rationale: Mantém a forma literal de imperativo plural e sua ligação temática com a alegria, embora a expressão também funcionasse como saudação; essa possibilidade é indicada em nota.
- source_word: προσελθοῦσαι
  choice: se aproximaram
  rationale: Representa com clareza o movimento em direção a Jesus anterior às ações seguintes.
- source_word: ἐκράτησαν αὐτοῦ τοὺς πόδας
  choice: abraçaram os pés dele
  rationale: Em português, descreve de modo natural e concreto o ato de segurar firmemente os pés de alguém em postura de reverência, sem a aspereza de 'agarraram'.
- source_word: προσεκύνησαν αὐτῷ
  choice: o adoraram
  rationale: No contexto da ressurreição e da apresentação de Jesus em Mateus, comunica adequadamente a força religiosa provável do gesto, preservando em nota a amplitude lexical de prostração ou homenagem.
theological_decisions:
- issue: Sentido de προσκυνέω dirigido a Jesus ressuscitado
  choice: o adoraram
  alternative: prostraram-se diante dele / prestaram-lhe homenagem
  rationale: O contexto pós-ressurreição favorece o sentido forte de adoração, mas o verbo grego também pode designar prostração ou homenagem; a nota preserva essa tensão lexical sem enfraquecer o sentido contextual provável.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “E eis que” conserva a ênfase narrativa; “abraçaram os pés” soa mais natural no contexto devocional do que “agarraram”. Os pronomes evitam construções excessivamente formais.
