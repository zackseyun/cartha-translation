source:
  edition: SBLGNT
  text: τότε λέγει αὐταῖς ὁ Ἰησοῦς· Μὴ φοβεῖσθε· ὑπάγετε ἀπαγγείλατε τοῖς ἀδελφοῖς μου ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν, κἀκεῖ με ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/010.yaml
  text: Then Jesus said to them[a], “Do not be afraid. Go, tell my brothers to go to Galilee[c][b], and there they will see me.”
translation:
  language: pt
  text: 'Então Jesus lhes disse: “Não tenham medo. Vão e digam aos meus irmãos[a] que vão para a Galileia; lá me verão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Meus irmãos” refere-se aqui aos discípulos de Jesus. O grego emprega um substantivo masculino plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε λέγει αὐταῖς
  choice: Então Jesus lhes disse
  rationale: “Então” marca naturalmente a sequência narrativa. O presente histórico λέγει é vertido pelo pretérito, corrente na narrativa portuguesa; “lhes” retoma as mulheres sem explicitação desnecessária.
- source_word: Μὴ φοβεῖσθε
  choice: Não tenham medo
  rationale: Forma idiomática, clara e atual para a proibição grega.
- source_word: ὑπάγετε ἀπαγγείλατε
  choice: Vão e digam
  rationale: Os dois imperativos são preservados. “Digam” comunica naturalmente o ato de transmitir a mensagem, sem a rigidez de “relatem”.
- source_word: τοῖς ἀδελφοῖς μου
  choice: aos meus irmãos
  rationale: Mantém o substantivo masculino plural explícito e a linguagem familiar de Jesus, sem substituí-lo pela glosa interpretativa “discípulos”.
- source_word: ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν
  choice: que sigam para a Galileia
  rationale: O subjuntivo introduz o conteúdo da instrução indireta. “Sigam para” é natural em português e conserva a ideia de deslocamento.
- source_word: κἀκεῖ με ὄψονται
  choice: lá eles me verão
  rationale: Traduz diretamente a indicação de lugar e o futuro de ὁράω, evitando a interpretação mais estreita “se encontrarão comigo”.
theological_decisions:
- issue: Referente de “meus irmãos”
  choice: Conservar “meus irmãos” no texto, entendendo que no contexto se refere aos discípulos de Jesus.
  alternative: Traduzir diretamente como “meus discípulos” ou ampliar para “meus irmãos e irmãs”.
  rationale: O contexto imediato aponta para os discípulos, mas a expressão familiar do grego deve permanecer, preservando sua força teológica e o gênero gramatical masculino plural sem resolver no texto mais do que a fonte resolve.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita formalismo excessivo e preserva a concisão e a relação familiar expressa no grego.
