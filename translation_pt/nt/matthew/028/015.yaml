source:
  edition: SBLGNT
  text: οἱ δὲ λαβόντες ⸀τὰ ἀργύρια ἐποίησαν ὡς ἐδιδάχθησαν. Καὶ διεφημίσθη ὁ λόγος οὗτος παρὰ Ἰουδαίοις μέχρι τῆς σήμερον ⸀ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/015.yaml
  text: So they took the silver and did as they had been instructed[a]. And this story has been spread among the Jews to this day.
translation:
  language: pt
  text: Eles receberam o dinheiro e fizeram como tinham sido instruídos. E esse relato[a] se espalhou entre os judeus até o dia de hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “essa história” ou “essa notícia”. A palavra grega também pode significar “palavra”, “mensagem” ou “relato”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: receberam
  rationale: No contexto, os guardas aceitam o dinheiro que lhes foi dado no versículo anterior. “Receberam” exprime naturalmente essa ação sem sugerir que o tomaram à força.
- source_word: τὰ ἀργύρια
  choice: o dinheiro
  rationale: Embora ἀργύρια se relacione literalmente à prata, aqui designa o pagamento entregue aos guardas. “O dinheiro” é claro e natural, sem especificar indevidamente a forma das moedas.
- source_word: ἐποίησαν
  choice: fizeram
  rationale: Mantém o sentido comum de ποιέω e a ligação direta com a instrução recebida.
- source_word: ὡς ἐδιδάχθησαν
  choice: como tinham sido instruídos
  rationale: O passivo de διδάσκω, neste contexto, refere-se às orientações dadas aos guardas sobre o que deveriam dizer.
- source_word: διεφημίσθη
  choice: se espalhou
  rationale: O verbo indica ampla divulgação de uma notícia ou relato. A forma pronominal é idiomática em português e, com “até o dia de hoje”, comunica sua continuidade.
- source_word: ὁ λόγος οὗτος
  choice: esse relato
  rationale: λόγος possui ampla extensão semântica. Aqui se refere à versão dos acontecimentos divulgada pelos guardas; “relato” é natural e preserva a possibilidade de se tratar de uma notícia ou narrativa.
- source_word: παρὰ Ἰουδαίοις
  choice: entre os judeus
  rationale: παρά com o dativo indica circulação no meio da comunidade judaica. A tradução é direta e não amplia a afirmação para além do cenário narrativo.
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: até o dia de hoje
  rationale: Reproduz de modo claro a expressão idiomática que aponta para o tempo do autor.
theological_decisions:
- issue: Alcance de Ἰουδαίοις em um contexto narrativo potencialmente sujeito a leitura antijudaica
  choice: entre os judeus
  alternative: entre o povo judeu; entre os judeanos
  rationale: A expressão descreve onde o relato circulava no contexto apresentado por Mateus. “Judeus” é a correspondência lexical mais direta; “judeanos” restringiria indevidamente o sentido à identidade regional. A tradução não atribui a afirmação a todos os judeus de todas as épocas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Tinham sido instruídos” conserva a anterioridade da orientação, e “até o dia de hoje” mantém a referência temporal do narrador.
