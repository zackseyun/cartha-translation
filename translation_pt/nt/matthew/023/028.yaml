id: MAT.23.28
reference: Matthew 23:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: pt
  text: Do mesmo modo, vocês também, por fora, parecem justos aos olhos das pessoas, mas, por dentro, estão cheios de hipocrisia e desrespeito à lei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Do mesmo modo
  rationale: Retoma naturalmente, em português, a comparação anterior com os túmulos caiados.
- source_word: ἔξωθεν ... ἔσωθεν
  choice: por fora ... por dentro
  rationale: Forma um contraste claro, natural e acessível entre aparência externa e realidade interior.
- source_word: φαίνεσθε τοῖς ἀνθρώποις δίκαιοι
  choice: parecem justos aos olhos das pessoas
  rationale: Expressa a percepção dos observadores sem afirmar que a justiça seja real; “pessoas” traduz o uso genérico de ἀνθρώποις.
- source_word: μεστοὶ
  choice: estão cheios de
  rationale: Equivalente direto e idiomático do adjetivo grego, mantendo o contraste com “parecem”.
- source_word: ὑποκρίσεως
  choice: hipocrisia
  rationale: Preserva o sentido de duplicidade moral e religiosa no contexto da denúncia de Jesus.
- source_word: ἀνομίας
  choice: desrespeito à lei
  rationale: Comunica de modo corrente a ideia de conduta contrária à lei, sem reduzir o termo a maldade genérica.
theological_decisions:
- issue: Se δίκαιοι indica justiça real ou apenas aparente
  choice: Justiça apenas aparente na percepção das pessoas
  alternative: Justiça moral real
  rationale: φαίνεσθε, junto ao contraste com a condição interior, apresenta a justiça como aparência diante dos observadores, não como realidade afirmada por Jesus.
- issue: Sentido de ἀνομία
  choice: Desrespeito à lei
  alternative: Maldade ou iniquidade em sentido genérico
  rationale: A escolha conserva a relação lexical com a lei e evita importar uma interpretação denominacional sobre a natureza precisa dessa lei.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” traduz o plural de segunda pessoa de modo natural; “aos olhos das pessoas” explicita idiomaticamente o dativo de referência. Não há marcadores de nota porque nenhuma nota é necessária nesta versão.
