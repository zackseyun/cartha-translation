  text: πάντα οὖν ὅσα ⸀ἐὰν εἴπωσιν ὑμῖν ⸂ποιήσατε καὶ τηρεῖτε⸃, κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, λέγουσιν γὰρ καὶ οὐ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: pt
  text: Portanto, façam e observem tudo o que eles lhes disserem; mas não façam conforme as obras deles[a], pois eles dizem e não fazem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não ajam como eles agem”.'
    reason: Alternativa mais idiomática para a expressão κατὰ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, que literalmente descreve agir segundo as obras deles.
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: Portanto, ... tudo o que
  rationale: οὖν introduz uma conclusão, e πάντα com ὅσα ἐὰν forma uma expressão abrangente. “Tudo o que” comunica essa totalidade de modo natural em português.
- source_word: εἴπωσιν ὑμῖν
  choice: eles lhes disserem
  rationale: Mantém o sentido comum de λέγω como “dizer” e a direção da fala aos ouvintes, sem acrescentar a ideia mais específica de ensino formal.
- source_word: ποιήσατε καὶ τηρεῖτε
  choice: façam e observem
  rationale: “Façam” traduz diretamente ποιήσατε; “observem” expressa τηρεῖτε no sentido de cumprir ou guardar, preservando a distinção entre os dois verbos sem perder naturalidade.
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν
  choice: mas não façam conforme as obras deles
  rationale: κατά indica conformidade com um padrão, e “obras” conserva o substantivo concreto ἔργα e sua ligação com a linguagem de ação presente no versículo.
- source_word: μὴ ποιεῖτε
  choice: não façam
  rationale: A repetição de “façam” reproduz o eco retórico de ποιέω e apresenta a proibição de tomar as ações deles como modelo.
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: pois eles dizem e não fazem
  rationale: Preserva a formulação breve e incisiva do grego, bem como o contraste entre falar e fazer, sem inserir objetos que não estão expressos.
theological_decisions:
- issue: Explicitar a autoridade de ensino dos escribas e fariseus mencionada no contexto anterior
  choice: Manter o referente implícito e traduzir somente o que o versículo declara.
  alternative: Expandir para “tudo o que eles ensinarem a vocês” ou “tudo o que disserem da cadeira de Moisés”.
  rationale: O contexto imediato identifica os referentes, mas o versículo não repete essas informações. Mantê-las implícitas evita inserir explicação interpretativa no texto.
- issue: Suavizar a repetição dos verbos de ação
  choice: Preservar a sequência “façam e observem... não façam... dizem e não fazem”.
  alternative: Variar com expressões como “pratiquem”, “não os imitem” ou “pregam, mas não praticam”.
  rationale: A repetição de ποιέω é um recurso retórico importante que expõe a incoerência entre fala e conduta; preservá-la mantém a tensão do original.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. “Observem” foi preferido a “guardem” por ser mais natural neste contexto de cumprimento, enquanto “obras” conserva a formulação e a ligação verbal do original. O ponto e vírgula destaca o contraste central sem fragmentar a frase.
