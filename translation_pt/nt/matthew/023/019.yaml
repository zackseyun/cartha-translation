source:
  edition: SBLGNT
  text: ⸀τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ τὸ θυσιαστήριον τὸ ἁγιάζον τὸ δῶρον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: pt
  text: 'Cegos! Pois qual é maior: a oferta[a] ou o altar que santifica[b] a oferta?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dádiva”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “torna santa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοί
  choice: Cegos!
  rationale: Adjetivo no vocativo plural usado substantivamente como repreensão direta. “Cegos!” é natural em português e não acrescenta “tolos”, termo presente no versículo 17, mas não aqui.
- source_word: τί γὰρ μεῖζον
  choice: Pois qual é maior
  rationale: “Qual” introduz naturalmente a comparação entre duas realidades, “pois” preserva a força explicativa de γάρ, e “maior” mantém o sentido comparativo de μεῖζον sem interpretá-lo como apenas “mais importante”.
- source_word: τὸ δῶρον
  choice: a oferta
  rationale: Embora δῶρον possa significar literalmente “presente” ou “dádiva”, no contexto do templo designa uma oferta. “Oferta” comunica esse sentido cultual de modo claro e corrente em português; “dádiva” é registrada como alternativa.
- source_word: θυσιαστήριον
  choice: o altar
  rationale: Equivalente convencional, claro e preciso para θυσιαστήριον em contexto cultual.
- source_word: τὸ ἁγιάζον
  choice: que santifica
  rationale: O particípio presente modifica “altar”. “Santifica” preserva tanto a ação contínua expressa no argumento quanto o peso cultual e teológico de ἁγιάζω.
theological_decisions:
- issue: A linguagem cultual de ἁγιάζω na relação entre o altar e a oferta
  choice: que santifica a oferta
  alternative: que torna santa a oferta; que consagra a oferta
  rationale: 'A formulação mantém a lógica do argumento: o altar confere santidade à oferta. “Santifica” preserva essa força teológica sem reduzir a ação a uma formalidade ritual nem explicar além do texto.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A exclamação após “Cegos!” transmite o vocativo incisivo; os dois-pontos apresentam com naturalidade as alternativas da pergunta comparativa. Os marcadores foram posicionados junto às palavras às quais suas notas efetivamente se referem.
