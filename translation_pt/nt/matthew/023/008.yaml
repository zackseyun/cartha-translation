id: MAT.23.8
reference: Matthew 23:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ μὴ κληθῆτε· Ῥαββί, εἷς γάρ ἐστιν ὑμῶν ὁ ⸀διδάσκαλος, πάντες δὲ ὑμεῖς ἀδελφοί ἐστε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/008.yaml
  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: pt
  text: Mas vocês não devem ser chamados de “Rabi”[a], pois um só é o Mestre de vocês, e todos vocês são irmãos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Mestre”. O título “Rabi”, transliterado no grego, tem o sentido de mestre, mas a transliteração preserva o contexto judaico e evita confundi-lo com a palavra traduzida por “Mestre” logo depois.
    reason: lexical_alternative
  - marker: b
    text: “Irmãos” traduz o plural masculino ἀδελφοί. Neste contexto, o termo pode referir-se coletivamente aos discípulos.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: não devem ser chamados
  rationale: Expressa naturalmente em português a proibição com μή e o subjuntivo passivo aoristo, preservando tanto a voz passiva quanto a força da instrução.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Mantém o título transliterado presente no texto grego e preserva o contexto judaico, sem fundi-lo com διδάσκαλος na oração seguinte.
- source_word: εἷς
  choice: um só
  rationale: A construção idiomática portuguesa comunica a singularidade enfática de εἷς sem acrescentar uma explicação doutrinária.
- source_word: ὁ διδάσκαλος
  choice: o Mestre de vocês
  rationale: O artigo e o genitivo ὑμῶν formam uma relação definida; esta redação é natural e mantém o título distinto de “Rabi”. A inicial maiúscula sinaliza o uso titular no contexto, sem identificar além do que o versículo declara.
- source_word: πάντες δὲ ὑμεῖς
  choice: todos vocês são
  rationale: Preserva a ênfase coletiva de πάντες e do pronome explícito ὑμεῖς em ordem natural para leitores de português.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Conserva o plural masculino e a metáfora familiar do grego; uma nota registra que, no contexto, o termo pode designar coletivamente os discípulos.
theological_decisions:
- issue: Se Jesus proíbe de modo absoluto todo título humano honorífico ou se trata da busca de posição entre os discípulos
  choice: Preservar a proibição direta sem ampliar nem restringir sua aplicação
  alternative: Interpretá-la como proibição absoluta de qualquer título semelhante, ou somente como crítica à ambição hipócrita
  rationale: O grego apresenta uma proibição e sua razão, mas não explicita todas as aplicações posteriores; a tradução não deve impor uma conclusão denominacional.
- issue: Identidade do único Mestre
  choice: Traduzir a afirmação relacional sem inserir um nome ou referente ausente do versículo
  alternative: Explicitar “Cristo”, conforme variante textual e tradições manuscritas presentes em outras edições
  rationale: O texto principal do SBLGNT fornecido lê ὁ διδάσκαλος, sem Χριστός. A tradução segue essa evidência e não incorpora a variante ao corpo do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo e reproduz com clareza a segunda pessoa do plural; “Mas” mantém o contraste inicial de δέ.
