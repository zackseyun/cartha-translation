revisions:
- from: para que venha sobre vocês todo o sangue justo derramado sobre a terra[a], desde o sangue do justo Abel até o sangue de Zacarias, filho de Baraquias[b], a quem vocês assassinaram entre o santuário e o altar.
  to: para que todo o sangue de justos derramado sobre a terra[a] venha sobre vocês, desde o sangue do justo Abel até o sangue de Zacarias, filho de Berequias[b], a quem vocês assassinaram entre o santuário e o altar.
  rationale: A revisão elimina uma ambiguidade relevante do português em «sangue justo», preservando a metonímia do grego mediante «sangue de justos». Também adota «Berequias», forma onomástica portuguesa estabelecida, e torna a nota de γῆ mais concisa, mantendo a ambiguidade lexical. Não se altera a tensão histórica quanto à identidade de Zacarias.
