id: MAT.23.35
reference: Matthew 23:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅπως ἔλθῃ ἐφ’ ὑμᾶς πᾶν αἷμα δίκαιον ἐκχυννόμενον ἐπὶ τῆς γῆς ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου, ὃν ἐφονεύσατε μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: pt
  text: para que todo o sangue de justos derramado sobre a terra[a] venha sobre vocês, desde o sangue do justo Abel até o sangue de Zacarias, filho de Berequias[b], a quem vocês assassinaram entre o santuário e o altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre o país”. A palavra grega pode significar tanto “terra” quanto “país”.
    reason: lexical_alternative
  - marker: b
    text: A identidade de “Zacarias, filho de Berequias” é debatida. Alguns o associam ao profeta Zacarias; outros, a Zacarias, filho de Joiada (2Cr 24.20–22). A tradução segue o texto grego tal como está escrito.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: para que
  rationale: Introduz a finalidade ou o resultado ligado à denúncia anterior e preserva naturalmente a força télica em português.
- source_word: ἔλθῃ ἐφ’ ὑμᾶς
  choice: venha sobre vocês
  rationale: O subjuntivo depois de ὅπως é mantido, e 'sobre vocês' preserva tanto a construção com ἐπί quanto o sentido judicial de culpa de sangue que recai sobre eles.
- source_word: πᾶν αἷμα δίκαιον
  choice: todo o sangue justo
  rationale: Mantém o singular coletivo e a expressão metonímica, na qual 'justo' caracteriza o sangue como o de pessoas justas ou inocentes.
- source_word: ἐκχυννόμενον
  choice: derramado
  rationale: O particípio passivo é vertido de modo idiomático sem perder a imagem de sangue derramado; o contexto permite que a forma portuguesa abranja o derramamento considerado em seu conjunto.
- source_word: ἐπὶ τῆς γῆς
  choice: sobre a terra
  rationale: γῆ pode significar 'terra' em sentido amplo ou 'território/país'. O alcance desde Abel favorece aqui 'terra', mantendo-se a alternativa em nota.
- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: desde o sangue do justo Abel
  rationale: Preserva a construção genitiva e o qualificativo δίκαιος com dicção portuguesa natural e digna.
- source_word: ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου
  choice: até o sangue de Zacarias, filho de Baraquias
  rationale: Reproduz naturalmente a correlação ἀπό...ἕως e translitera os nomes segundo formas bíblicas correntes em português.
- source_word: ὃν ἐφονεύσατε
  choice: a quem vocês assassinaram
  rationale: φονεύω expressa matar de modo criminoso, não apenas causar genericamente a morte; 'assassinaram' conserva a acusação moral.
- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: entre o santuário e o altar
  rationale: ναός designa especificamente o santuário ou edifício central, não todo o complexo do templo; θυσιαστήριον corresponde diretamente a 'altar'.
theological_decisions:
- issue: Identidade de Zacarias, filho de Baraquias
  choice: Manter o nome conforme o texto grego, sem harmonização ou emenda.
  alternative: Identificá-lo com o profeta Zacarias, filho de Baraquias, ou com Zacarias, filho de Joiada, tratando 'filho de Baraquias' como dificuldade textual ou tradicional.
  rationale: A tradução deve representar o texto grego tal como está e não resolver silenciosamente uma identificação histórica debatida; a tensão é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da oração é natural em português, mas conserva a relação de finalidade/resultado e o peso judicial do original. Emprega-se 'vocês' como plural explícito e contemporâneo; 'santuário' distingue ναός do complexo inteiro do templo.
source_grounding:
  english_pob_role: consult_only
