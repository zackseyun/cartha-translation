review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a estrutura de finalidade com «para que», o subjuntivo de ἔλθῃ, o alcance «desde... até», a acusação forte de ἐφονεύσατε e a distinção de ναός como «santuário». A identificação historicamente disputada de Zacarias é corretamente mantida sem harmonização. Contudo, «sangue justo» é ambíguo em português contemporâneo, podendo qualificar o sangue como “justo/correto”, em vez de transmitir a metonímia grega: sangue de pessoas justas. A forma portuguesa corrente do nome Βαραχίας também é «Berequias», não «Baraquias».'
  naturalness: «Todo o sangue justo» soa pouco idiomático e semanticamente equívoco. «Todo o sangue de justos derramado» é claro, natural e mantém o singular coletivo de αἷμα. A ordem «para que todo o sangue ... venha sobre vocês» é mais fluente em português sem perda de sentido ou de ênfase judicial.
  terminology: «Santuário», «altar», «assassinaram», «justo Abel» e «Joiada» são adequados. «Berequias» é a forma bíblica portuguesa mais reconhecível e mais próxima da transliteração convencional de Βαραχίας. A nota sobre γῆ preserva apropriadamente a alternativa «terra/país».
  issues:
  - severity: medium
    issue: «todo o sangue justo» é semanticamente ambíguo em português
    rationale: Embora reproduza formalmente a posição de δίκαιον, em português «sangue justo» pode ser entendido como sangue “justo” em si. O grego usa «justo» metonimicamente para o sangue dos justos; «todo o sangue de justos derramado» comunica isso com clareza sem alterar o referente.
  - severity: low
    issue: «Baraquias» não é a forma bíblica portuguesa usual do nome
    rationale: Para Βαραχίας, «Berequias» é a forma corrente em traduções e referências bíblicas portuguesas. A alteração melhora a consistência onomástica sem resolver a identificação debatida.
