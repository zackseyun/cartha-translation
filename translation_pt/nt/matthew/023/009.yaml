  text: καὶ πατέρα μὴ καλέσητε ὑμῶν ἐπὶ τῆς γῆς, εἷς γάρ ἐστιν ⸂ὑμῶν ὁ πατὴρ⸃ ὁ ⸀οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/009.yaml
  text: And call no man on earth your father[a], for one is your Father[b], the heavenly One.
translation:
  language: pt
  text: E não chamem ninguém na terra de pai de vocês, pois um só é o Pai de vocês, o Pai celestial.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois vocês têm um só Pai, o Pai celestial”; ou: “pois um só é o Pai de vocês, aquele que está no céu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα μὴ καλέσητε ὑμῶν
  choice: não chamem ninguém ... de seu pai
  rationale: O aoristo subjuntivo com μή expressa proibição. A construção portuguesa “chamar alguém de” comunica naturalmente o uso designativo ou honorífico, sem acrescentar uma explicação interpretativa ao texto.
- source_word: ἐπὶ τῆς γῆς
  choice: na terra
  rationale: Expressão portuguesa corrente que preserva a esfera terrena e seu contraste com o qualificativo celestial.
- source_word: εἷς
  choice: um só
  rationale: Em português, “um só” expressa de modo natural a exclusividade indicada por εἷς neste contexto, sem enfraquecer a afirmação.
- source_word: ὑμῶν ὁ πατήρ
  choice: o Pai de vocês
  rationale: Reproduz o genitivo plural e mantém a relação pessoal expressa pelo texto grego. “Vocês” oferece leitura clara e amplamente compreensível no português moderno.
- source_word: ὁ οὐράνιος
  choice: o celestial
  rationale: Mantém o adjetivo substantivado e a formulação marcada do grego, em vez de explicá-lo como “que está no céu” ou repetir “Pai”.
theological_decisions:
- issue: Alcance da proibição de Jesus
  choice: Manter a proibição direta de chamar alguém na terra de “seu pai”, sem definir no próprio texto se ela se limita a um título espiritual ou honorífico.
  alternative: Explicitar “pai espiritual” ou suavizar a frase como mera hipérbole; no outro extremo, acrescentar que se proíbe todo uso humano da palavra “pai”.
  rationale: O grego formula uma proibição incisiva, mas o versículo isolado não resolve expressamente sua relação com a paternidade biológica e outros usos sociais. A tradução deve preservar essa tensão, deixando a interpretação ao contexto.
- issue: Sentido de ὁ οὐράνιος
  choice: Traduzir como o adjetivo substantivado “o celestial”.
  alternative: “o Pai celestial” ou “aquele que está no céu”.
  rationale: A opção principal conserva a estrutura incomum e a possível função identificadora do adjetivo sem transformar a expressão em uma oração locativa.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. “Não chamem ninguém ... de seu pai” é idiomático e mantém a força da proibição; “o celestial” preserva deliberadamente a formulação marcada do original. O marcador [a] aparece no texto principal.
