  verdict: revise
  source_fidelity: 'O sentido central está preservado: a proibição é direta, refere-se a pessoas «na terra» e a fundamentação afirma a unicidade do Pai dos destinatários. Contudo, «seu pai» pode ser ambíguo em português moderno (pai da pessoa tratada, de outra pessoa, ou forma de tratamento), e «o celestial», embora tente reproduzir a substantivação grega, não é uma designação natural nem suficientemente clara em português para Deus neste contexto.'
  naturalness: «Não chamem ninguém na terra de seu pai» é compreensível, mas «seu» introduz uma ambiguidade evitável. «O celestial» soa artificial e pode sugerir um ser celestial indeterminado; «o Pai celestial» é claro, digno e idiomático, sem alterar a afirmação de que o único Pai é Deus.
  terminology: «Pai» deve permanecer, tanto para a força do dito quanto para a correspondência entre as duas ocorrências de πατήρ. «Pai celestial» é terminologia bíblica portuguesa estabelecida e traduz adequadamente ὁ οὐράνιος no contexto, ainda que repita o substantivo que o grego deixa subentendido.
  issues:
  - severity: medium
    issue: Ambiguidade de «seu pai»
    rationale: Em português atual, especialmente com «ninguém», «seu» pode não remeter imediatamente a «vocês». «Pai de vocês» torna explícito o genitivo plural ὑμῶν e preserva a relação que o texto repete na segunda oração.
  - severity: medium
    issue: «o celestial» é pouco natural e potencialmente obscuro
    rationale: A substantivação do adjetivo é formalmente possível, mas não funciona naturalmente como título divino em português moderno. «O Pai celestial» comunica com clareza o referente e o contraste com «na terra», sem impor uma interpretação doutrinária adicional.
