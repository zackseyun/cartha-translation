id: MAT.23.20
reference: Matthew 23:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ οὖν ὀμόσας ἐν τῷ θυσιαστηρίῳ ὀμνύει ἐν αὐτῷ καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/020.yaml
  text: Therefore[a], the one who swears by the altar swears by it and by everything on it.
translation:
  language: pt
  text: Portanto, quem jura pelo altar jura por ele e por tudo o que está sobre ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e por todas as coisas que estão sobre ele”. A expressão grega é mais ampla do que uma única “oferta” e pode incluir tudo o que é colocado sobre o altar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὖν ὀμόσας
  choice: Portanto, quem jura
  rationale: O particípio aoristo substantivado tem sentido genérico, bem expresso em português por “quem jura”. “Portanto” traduz οὖν como conexão inferencial com o argumento anterior.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: pelo altar
  rationale: Embora ἐν tenha sentido espacial em outros contextos, com ὀμνύω introduz aquilo pelo qual se jura; “pelo altar” é a formulação idiomática natural em português.
- source_word: ὀμνύει
  choice: jura
  rationale: O presente exprime uma afirmação geral e preserva a repetição do verbo no texto grego.
- source_word: ἐν αὐτῷ
  choice: por ele
  rationale: O pronome retoma “altar”; “por” mantém a construção idiomática própria de juramentos.
- source_word: καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: e por tudo o que está sobre ele
  rationale: A expressão substantivada é abrangente e designa tudo o que se encontra sobre o altar. “Sobre ele” preserva o valor espacial sem restringir a frase somente às ofertas.
theological_decisions:
- issue: Referente de “tudo o que está sobre ele”
  choice: Referência geral a tudo o que está sobre o altar, sem especificar ofertas ou dádivas no texto principal.
  alternative: “todas as ofertas sobre ele” ou “tudo o que está acima dele”
  rationale: O contexto menciona a oferta nos versículos anteriores, mas a formulação grega deste versículo é mais ampla. Mantê-la geral preserva a extensão e a tensão do original sem impor uma identificação mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A repetição de “jura” e a cadeia “pelo altar... por ele” foram preservadas para refletir a estrutura argumentativa do grego.
