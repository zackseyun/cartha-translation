base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/006.yaml
  text: And they love the places of honor at banquets and the best seats in the synagogues[c][b][a],
translation:
  language: pt
  text: Eles amam o lugar de honra nos banquetes[a][b] e os assentos de maior destaque nas sinagogas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o primeiro lugar à mesa”. Nas refeições formais do mundo antigo, os participantes se reclinavam, e certas posições indicavam maior honra.'
    reason: lexical_alternative
  - marker: b
    text: Nos banquetes do antigo mundo mediterrâneo, os lugares tornavam visível a posição social; portanto, a expressão destaca o desejo de prestígio público, não apenas de conforto.
    reason: cultural_note
  - marker: c
    text: 'Ou: “os primeiros assentos” ou “os assentos de honra”. O grego enfatiza os lugares de maior posição e precedência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοῦσι
  choice: amam
  rationale: O presente de φιλέω expressa forte preferência; “amam” é direto, natural e preserva a força crítica da fala de Jesus.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui δέ funciona como conectivo leve na continuação da descrição. Em português, a ligação com o contexto pode ficar implícita sem perda de sentido nem criação de um contraste excessivo.
- source_word: τὴν πρωτοκλισίαν
  choice: o lugar de honra
  rationale: O singular grego designa a posição mais honrosa à mesa, originalmente associada ao lugar de destaque entre os que se reclinavam para comer. A formulação comunica de modo natural seu valor social.
- source_word: ἐν τοῖς δείπνοις
  choice: nos banquetes
  rationale: Neste contexto de prestígio público, δείπνοις aponta para refeições formais; “banquetes” comunica melhor esse cenário do que o genérico “jantares”.
- source_word: τὰς πρωτοκαθεδρίας
  choice: os assentos de maior destaque
  rationale: O termo denota assentos de primazia ou maior status. A escolha preserva a ênfase em reconhecimento público, sem sugerir apenas conforto ou localização física.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: nas sinagogas
  rationale: Tradução locativa direta e natural, mantendo o ambiente institucional das assembleias judaicas.
theological_decisions: []
