id: MAT.23.12
reference: Matthew 23:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅστις δὲ ὑψώσει ἑαυτὸν ταπεινωθήσεται, καὶ ὅστις ταπεινώσει ἑαυτὸν ⸀ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/012.yaml
  text: But whoever exalts himself will be humbled[b][a], and whoever humbles himself will be exalted.
translation:
  language: pt
  text: Mas quem exaltar a si mesmo será humilhado[a], e quem humilhar a si mesmo será exaltado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será rebaixado” ... “será elevado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: quem
  rationale: O pronome relativo indefinido introduz um princípio geral; em português, «quem» expressa isso de modo natural e proverbial.
- source_word: δὲ
  choice: Mas
  rationale: Marca contraste com o contexto anterior e introduz com naturalidade a inversão apresentada no provérbio.
- source_word: ὑψώσει ἑαυτὸν
  choice: exaltar a si mesmo
  rationale: Preserva o sentido de autoexaltação e a forma reflexiva, além de manter a correspondência lexical com «será exaltado».
- source_word: ταπεινωθήσεται
  choice: será humilhado
  rationale: Mantém o futuro passivo sem identificar o agente, como no grego.
- source_word: καὶ
  choice: e
  rationale: Reproduz a coordenação simples entre as duas orações paralelas.
- source_word: ταπεινώσει ἑαυτὸν
  choice: humilhar a si mesmo
  rationale: Expressa claramente a ação reflexiva voluntária e conserva o paralelismo com a primeira oração.
- source_word: ὑψωθήσεται
  choice: será exaltado
  rationale: Mantém o futuro passivo e o contraste lexical simétrico entre exaltar e ser exaltado.
theological_decisions:
- issue: Agente dos verbos passivos
  choice: Manter as formas passivas sem nomear o agente
  alternative: 'Explicitar Deus como sujeito: «Deus o humilhará... Deus o exaltará»'
  rationale: O grego não identifica expressamente o agente. A forma passiva preserva essa abertura, embora a ação divina possa estar implícita.
- issue: Representação genérica do masculino singular
  choice: Usar a construção genérica «quem... a si mesmo»
  alternative: Empregar formas marcadas por gênero, como «aquele que... a si próprio»
  rationale: «Quem» conserva a referência geral a qualquer pessoa, enquanto «a si mesmo» mantém uma construção reflexiva idiomática e próxima da estrutura singular do grego sem restringir o princípio aos homens.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo proverbial. A formulação é amplamente compreensível no Brasil e em outras comunidades lusófonas; evita explicitar o agente dos passivos.
