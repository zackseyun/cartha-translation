id: MAT.23.5
reference: Matthew 23:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσι ⸀γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσι τὰ ⸀κράσπεδα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: pt
  text: Mas fazem todas as suas obras para serem vistos pelas pessoas, pois alargam seus filactérios[a] e aumentam suas franjas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “caixinhas com textos sagrados”. Eram pequenos estojos de couro que continham trechos das Escrituras e eram usados por alguns judeus em obediência a passagens como Deuteronômio 6:8.'
    reason: Nota cultural que explica um termo histórico possivelmente desconhecido.
  - marker: b
    text: 'Ou: “borlas”. Veja Números 15:38–39, a respeito das franjas usadas nas roupas.'
    reason: Registra uma alternativa lexical e fornece o contexto da prática.
lexical_decisions:
- source_word: πάντα τὰ ἔργα
  choice: todas as suas obras
  rationale: Preserva a totalidade expressa por πάντα e o sentido amplo de ἔργα, sem limitar a referência a uma categoria específica de ações.
- source_word: δὲ
  choice: Mas
  rationale: Expressa o contraste com a instrução anterior e introduz a denúncia da motivação deles.
- source_word: ποιοῦσιν
  choice: fazem
  rationale: É a equivalência corrente e natural de ποιέω quando usado com ἔργα.
- source_word: πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις
  choice: para serem vistos pelas pessoas
  rationale: Mantém tanto a finalidade da construção grega quanto a referência inclusiva a observadores humanos em geral.
- source_word: γὰρ
  choice: pois
  rationale: Introduz naturalmente, em português, a explicação que exemplifica a acusação precedente.
- source_word: πλατύνουσι
  choice: alargam
  rationale: Reproduz a ideia física de tornar mais largo.
- source_word: φυλακτήρια
  choice: filactérios
  rationale: Emprega o termo histórico preciso para os pequenos estojos com textos das Escrituras; uma nota esclarece o referente cultural.
- source_word: μεγαλύνουσι
  choice: aumentam
  rationale: Conserva o sentido geral de tornar maior sem especificar apenas comprimento ou largura, dimensões não explicitadas pelo verbo grego.
- source_word: κράσπεδα
  choice: franjas
  rationale: No contexto da vestimenta judaica, designa as franjas ou borlas prescritas na Torá; “franjas” é claro e consagrado em português.
theological_decisions:
- issue: Descrição de elementos da prática religiosa judaica sem torná-los objeto da crítica
  choice: Manter “filactérios” e “franjas” como designações neutras dos objetos, situando a crítica no propósito de exibição e no aumento ostensivo deles.
  alternative: Substituir “filactérios” por uma paráfrase como “caixinhas de oração” ou empregar termos que sugiram superstição.
  rationale: O texto censura a motivação de ser visto e a exibição ostensiva, não declara ilegítimos em si os objetos ligados à observância judaica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A estrutura mantém o contraste e a explicação do grego, enquanto as notas esclarecem os referentes culturais sem sobrecarregar o versículo.
