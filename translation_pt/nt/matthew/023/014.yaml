id: MAT.23.14
reference: Matthew 23:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: robinson-pierpont-2005-byzantine
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κατεσθίετε τὰς οἰκίας τῶν χηρῶν, καὶ προφάσει μακρὰ προσευχόμενοι· διὰ τοῦτο λήψεσθε περισσότερον κρίμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: pt
  text: Ai de vocês, escribas e fariseus, hipócritas! Pois devoram os bens das viúvas e, como pretexto, fazem longas orações. Por isso, receberão condenação mais severa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo não consta nos manuscritos gregos mais antigos, entre eles o Sinaítico e o Vaticano, do século 4, nem em antigas traduções coptas. Ele é preservado, porém, na tradição majoritária bizantina, na Antiga Latina, na Vulgata e nas versões siríacas. É provável que tenha sido acrescentado por copistas posteriores para harmonizar esta passagem com declarações semelhantes em Marcos 12:40 e Lucas 20:47. Entre os manuscritos que o incluem, há variação quanto à sua posição antes ou depois do versículo 13.
    reason: textual_critical
lexical_decisions:
- source_word: κατεσθίετε (κατεσθίω)
  choice: devoram os bens
  rationale: Preserva a metáfora forte de “devorar” e explicita naturalmente que οἰκίας, neste contexto, se refere ao patrimônio ou aos recursos das viúvas, não apenas às construções onde moravam.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: os bens das viúvas
  rationale: “Casas” pode designar o patrimônio familiar; “os bens” comunica com clareza a exploração econômica das viúvas sem restringir o sentido a imóveis.
- source_word: προφάσει
  choice: como pretexto
  rationale: Expressa uma justificativa aparente usada para encobrir a exploração, mantendo a acusação do grego sem acrescentar um motivo específico.
- source_word: περισσότερον
  choice: mais severa
  rationale: Com κρίμα, o comparativo aponta para um grau maior de punição; “mais severa” é idiomático e claro em português.
- source_word: κρίμα
  choice: condenação
  rationale: Embora também possa significar “julgamento” ou “sentença”, o contexto é inequivocamente punitivo, favorecendo “condenação”.
theological_decisions:
- issue: Grau comparativo da condenação
  choice: condenação mais severa
  alternative: maior condenação
  rationale: Mantém a ideia textual de gradação na sentença sem explicar sua natureza nem construir uma doutrina além do verso.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Ai de vocês” preserva a fórmula profética de denúncia; “escribas” mantém o termo bíblico reconhecível; a sintaxe foi levemente reorganizada para fluidez, sem atenuar a acusação.
