  text: ὁ δὲ μείζων ὑμῶν ἔσται ὑμῶν διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/011.yaml
  text: But the greatest among you will be your servant[a].
translation:
  language: pt
  text: Mas o maior entre vocês será servo de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “o maior de vocês será servo de vocês”. O comparativo grego pode ser usado de modo idiomático para indicar a pessoa de posição mais elevada dentro do grupo.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζων
  choice: o maior
  rationale: O comparativo pode ter sentido superlativo idiomático neste contexto de posição dentro do grupo; “o maior” é natural em português e preserva a linguagem de grandeza.
- source_word: ὑμῶν (primeira ocorrência)
  choice: entre vocês
  rationale: 'Expressa de modo idiomático o genitivo partitivo: aquele que é maior dentro do grupo ao qual Jesus se dirige.'
- source_word: ἔσται
  choice: será
  rationale: Traduz diretamente o futuro de εἰμί em português moderno.
- source_word: ὑμῶν (segunda ocorrência)
  choice: de vocês
  rationale: Mantém a relação com διάκονος de maneira clara e natural, sem recorrer ao possessivo “vosso”, menos corrente no português brasileiro.
- source_word: διάκονος
  choice: servo
  rationale: Aqui designa quem serve aos outros, não um cargo eclesiástico técnico. “Servo” preserva a força da inversão de posição social; “diácono” importaria indevidamente um ofício posterior.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste com a busca de títulos e posição descrita no contexto anterior.
theological_decisions:
- issue: A relação entre grandeza e serviço no ensino de Jesus
  choice: “o maior entre vocês será servo de vocês”
  alternative: “o que for maior entre vocês será o ministro de vocês”
  rationale: 'A formulação mantém a inversão ética de posição: a verdadeira grandeza se manifesta no serviço. Evita tanto suavizar a tensão quanto introduzir linguagem de cargo eclesiástico.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita formas arcaicas; “servo” conserva a força social e teológica do contraste sem sugerir o ofício técnico de diácono.
