base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/002.yaml
  text: saying[a], “The scribes and the Pharisees sit in Moses’ seat.”
translation:
  language: pt
  text: 'dizendo: “Os escribas e os fariseus se assentaram na cadeira de Moisés.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estão sentados na cadeira de Moisés” ou “sentam-se na cadeira de Moisés”. O verbo grego também pode ser entendido de maneira mais neutra; “se assentaram” preserva a possível nuance de terem passado a ocupar uma posição de autoridade.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: dizendo
  rationale: Preserva o particípio presente que liga a fala de Jesus ao versículo anterior.
- source_word: Ἐπὶ τῆς Μωϋσέως καθέδρας
  choice: na cadeira de Moisés
  rationale: Expressa naturalmente em português a imagem de uma posição reconhecida de ensino e autoridade associada a Moisés.
- source_word: ἐκάθισαν
  choice: se assentaram
  rationale: Reproduz o aoristo de modo natural e mantém a possível ideia de terem ocupado essa posição, sem tornar explícita uma nomeação ou usurpação que o grego não declara.
- source_word: οἱ γραμματεῖς
  choice: os escribas
  rationale: Termo tradicional e preciso para os especialistas reconhecidos na Lei.
- source_word: οἱ Φαρισαῖοι
  choice: os fariseus
  rationale: Forma portuguesa consagrada para o nome desse grupo.
theological_decisions:
- issue: Se ἐκάθισαν descreve apenas a ocupação presente da cadeira de Moisés ou sugere que os líderes assumiram essa posição
  choice: se assentaram
  alternative: estão sentados; sentam-se
  rationale: A forma escolhida conserva a possível nuance de entrada ou instalação numa posição de autoridade, mas não acrescenta a ideia mais forte de que o fizeram por iniciativa própria; a nota registra a leitura neutra.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário bíblico amplamente reconhecível. “Cadeira de Moisés” mantém a metáfora histórica de autoridade docente; “se assentaram” preserva a ambiguidade do aoristo sem introduzir explicitamente uma acusação de auto-investidura.
