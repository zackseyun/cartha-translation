id: MAT.23.31
reference: Matthew 23:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥστε μαρτυρεῖτε ἑαυτοῖς ὅτι υἱοί ἐστε τῶν φονευσάντων τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/031.yaml
  text: So you testify against yourselves that you are sons of those who murdered the prophets[a].
translation:
  language: pt
  text: Assim, vocês testemunham contra si mesmos que são filhos dos que assassinaram os profetas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “testemunham a si mesmos”. A expressão grega pode ser traduzida mais literalmente dessa forma, embora, no contexto, o testemunho os incrimine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Assim
  rationale: Introduz a conclusão ou inferência decorrente do argumento anterior, em português natural e digno.
- source_word: μαρτυρεῖτε
  choice: testemunham
  rationale: Preserva o sentido de prestar testemunho e sua nuance forense no contexto.
- source_word: ἑαυτοῖς
  choice: contra si mesmos
  rationale: Embora o dativo possa ser traduzido mais literalmente como “a si mesmos”, o contexto mostra que o testemunho os incrimina; a nota preserva a alternativa formal.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo do testemunho, não uma oração causal.
- source_word: υἱοί
  choice: filhos
  rationale: Mantém a linguagem familiar masculina do grego e sua força retórica, abrangendo tanto a linhagem quanto a solidariedade moral.
- source_word: τῶν φονευσάντων
  choice: dos que assassinaram
  rationale: Expressa a ação concluída e o caráter criminoso da morte dos profetas, mais precisamente que o neutro “mataram”.
- source_word: τοὺς προφήτας
  choice: os profetas
  rationale: Correspondência direta e natural para o grupo reconhecido dos mensageiros de Deus.
theological_decisions:
- issue: Se υἱοί deve ser traduzido literalmente como “filhos” ou interpretado de modo mais amplo como “descendentes”.
  choice: filhos
  alternative: descendentes
  rationale: “Filhos” preserva a metáfora familiar e a acusação retórica do texto, que sugere linhagem e identificação moral sem explicitar além do grego.
- issue: Se ἑαυτοῖς deve permanecer formalmente “a si mesmos” ou ser contextualizado como testemunho acusatório.
  choice: contra si mesmos
  alternative: a si mesmos
  rationale: O contexto é condenatório, mas a ambiguidade formal do dativo é preservada em nota para evitar ocultar a estrutura do original.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O plural “vocês” comunica diretamente a segunda pessoa plural sem regionalismo excessivo; “assim” mantém a ligação inferencial com o contexto anterior.
