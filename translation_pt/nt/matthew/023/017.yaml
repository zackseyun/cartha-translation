source:
  edition: SBLGNT
  text: μωροὶ καὶ τυφλοί, τίς γὰρ μείζων ἐστίν, ὁ χρυσὸς ἢ ὁ ναὸς ὁ ⸀ἁγιάσας τὸν χρυσόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: pt
  text: 'Tolos e cegos! Pois o que é maior: o ouro ou o templo[b] que santificou[a] o ouro?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que tornou santo o ouro”.'
    reason: lexical_alternative
  - marker: b
    text: O termo grego pode designar mais especificamente o santuário, isto é, o edifício sagrado do templo.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: Tolos
  rationale: Vocativo plural direto e contundente; “tolos” preserva a repreensão sem recorrer a linguagem vulgar ou clínica.
- source_word: τυφλοί
  choice: cegos
  rationale: Vocativo plural coordenado; em português, o substantivo adjetival “cegos” é natural e mantém a forma masculina plural do texto.
- source_word: τίς γὰρ μείζων ἐστίν
  choice: Pois o que é maior
  rationale: “Pois” conserva a força explicativa de γάρ; “o que” introduz naturalmente em português a comparação entre as duas opções expressas.
- source_word: ὁ χρυσὸς
  choice: o ouro
  rationale: O artigo definido aponta para o ouro específico em discussão no contexto dos juramentos.
- source_word: ὁ ναὸς
  choice: o santuário
  rationale: ναός designa mais especificamente o edifício sagrado ou santuário do templo, em contraste com o complexo inteiro; “santuário” comunica essa precisão em português.
- source_word: ὁ ἁγιάσας
  choice: que santificou
  rationale: O particípio aoristo ativo é vertido de modo formal pelo pretérito perfeito, preservando a ideia cultual de conferir caráter santo ao ouro.
- source_word: τὸν χρυσόν
  choice: o ouro
  rationale: A repetição explícita reproduz o paralelismo retórico grego, em vez de substituir o objeto por um pronome.
theological_decisions:
- issue: Tradução do termo cultual ἁγιάζω no contexto do santuário
  choice: santificou
  alternative: tornou santo / consagrou
  rationale: “Santificou” preserva o registro religioso e a lógica de que o santuário confere caráter sagrado ao ouro, sem explicar além do que o texto afirma.
- issue: Valor temporal do particípio aoristo ὁ ἁγιάσας
  choice: que santificou
  alternative: que santifica
  rationale: O pretérito acompanha mais diretamente a forma aorista e apresenta a santificação do ouro como decorrente de sua relação com o santuário; o presente poderia expressar naturalmente uma verdade geral, mas reduziria a correspondência formal.
translation_notes:
  register: Português moderno, claro e digno, com força retórica preservada. “Tolos e cegos!” soa natural como interpelação direta. Optou-se por “santuário” no texto principal para refletir a especificidade de ναός; as notas registram a alternativa lexical de ἁγιάζω e o alcance arquitetônico do termo.
