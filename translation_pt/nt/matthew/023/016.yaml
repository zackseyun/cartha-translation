  text: Οὐαὶ ὑμῖν, ὁδηγοὶ τυφλοὶ οἱ λέγοντες· Ὃς ἂν ὀμόσῃ ἐν τῷ ναῷ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ χρυσῷ τοῦ ναοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: pt
  text: 'Ai de vocês, guias cegos, que dizem: “Quem jurar pelo santuário não fica obrigado[a]; mas quem jurar pelo ouro do santuário fica obrigado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “não é nada”, isto é, esse juramento é considerado não obrigatório.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: Ai de vocês
  rationale: Preserva a fórmula profética de denúncia e juízo em português natural e solene.
- source_word: ὁδηγοὶ τυφλοὶ
  choice: guias cegos
  rationale: Reproduz diretamente a metáfora de pessoas que pretendem conduzir outras, embora sejam cegas.
- source_word: οἱ λέγοντες
  choice: que dizem
  rationale: Traduz naturalmente o particípio articular por uma oração relativa.
- source_word: Ὃς ἂν ὀμόσῃ
  choice: Quem jurar
  rationale: A construção indefinida com ἄν e subjuntivo expressa uma condição geral; o futuro do subjuntivo é idiomático em português.
- source_word: ἐν τῷ ναῷ
  choice: pelo santuário
  rationale: Embora ἐν possa significar literalmente 'em', aqui integra uma fórmula de juramento e corresponde em português a 'jurar por'. ναός designa especificamente o santuário, não todo o complexo do templo.
- source_word: οὐδέν ἐστιν
  choice: não fica obrigado
  rationale: Explicita com naturalidade a elipse 'não é nada' no contexto de juramentos, sem alterar o contraste jurídico-moral do texto; a forma grega literal é preservada em nota.
- source_word: χρυσῷ τοῦ ναοῦ
  choice: ouro do santuário
  rationale: Mantém a relação genitiva e o contraste entre o próprio santuário e seu ouro.
- source_word: ὀφείλει
  choice: fica obrigado
  rationale: No contexto, o verbo indica que a pessoa está sujeita ao cumprimento do juramento; a formulação conserva a elipse quanto ao objeto da obrigação.
theological_decisions:
- issue: Linguagem elíptica sobre a validade dos juramentos
  choice: Traduzir οὐδέν ἐστιν como 'não fica obrigado' e ὀφείλει como 'fica obrigado'.
  alternative: 'Traduzir de modo mais formal: ''não é nada ... deve''.'
  rationale: O contraste trata da suposta força vinculante de diferentes juramentos. A tradução torna esse contraste inteligível, mas não acrescenta uma avaliação doutrinária geral sobre juramentos.
- issue: Referente de ναός
  choice: santuário
  alternative: templo
  rationale: ναός aponta mais precisamente para o edifício sagrado ou santuário, distinção relevante porque o versículo contrasta esse lugar com o ouro ligado a ele.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. 'Vocês' evita regionalismo excessivo; 'Ai de vocês' preserva a força profética. As aspas marcam a fala citada.
