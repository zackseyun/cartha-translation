base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/007.yaml
  text: and greetings in the marketplaces, and to be called by men, ‘Rabbi.’
translation:
  language: pt
  text: e de receber saudações nas praças e ser chamados pelas pessoas de “Rabi”.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπασμοὺς
  choice: saudações
  rationale: Expressa as saudações públicas e respeitosas buscadas pelos escribas e fariseus no contexto.
- source_word: ἀγοραῖς
  choice: praças
  rationale: Refere-se aos espaços públicos de comércio e convivência das cidades antigas; “praças” é natural e historicamente adequado.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: pelas pessoas
  rationale: O plural genérico ἀνθρώπων designa seres humanos em geral, sem exigir referência exclusiva a homens do sexo masculino.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Preserva o título semítico transliterado, reconhecível em português e mantido pelo texto grego.
theological_decisions:
- issue: Sentido do título “Rabi”
  choice: Manter “Rabi” sem explicação inserida no versículo
  alternative: Traduzir como “Mestre”
  rationale: A transliteração conserva a forma distintiva usada no original e evita reduzir o título ao campo semântico de uma única tradução portuguesa.
translation_notes:
  register: Português moderno, digno e fluente. A construção continua a enumeração iniciada nos versículos anteriores; por isso começa com “e”. “Ser chamados ... de” é idiomático em português e reproduz o infinitivo passivo καλεῖσθαι.
