lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a coordenação grega e a continuação retórica da denúncia anterior.
- source_word: ὑμεῖς
  choice: vocês
  rationale: O pronome explícito é enfático; «vocês» é natural e amplamente compreensível, mantendo o plural.
- source_word: πληρώσατε
  choice: completem
  rationale: Mantém o aoristo imperativo na segunda pessoa do plural e comunica a ideia de levar algo à sua medida completa.
- source_word: τὸ μέτρον
  choice: a medida
  rationale: Preserva a metáfora de uma quantidade acumulada que chega ao limite, sem explicitar no texto principal que se trata da culpa.
- source_word: τῶν πατέρων ὑμῶν
  choice: de seus pais
  rationale: Conserva o sentido literal e a continuidade retórica com a linhagem mencionada no contexto; aqui «pais» significa antepassados.
theological_decisions:
- issue: 'Força da declaração de Jesus: ordem imperativa ou previsão irônica'
  choice: 'Imperativo com força irônica e judicial: «completem a medida de seus pais».'
  alternative: «Vocês estão completando» ou «completarão a medida de seus pais».
  rationale: A forma πληρώσατε é aoristo ativo imperativo, segunda pessoa do plural. A tradução mantém a forma de ordem e preserva sua tensão retórica como denúncia, em vez de convertê-la numa simples previsão.
translation_notes:
  register: Português moderno, digno e de leitura natural, com boa legibilidade brasileira. «Completem a medida» preserva a metáfora sem soar excessivamente arcaico; a nota esclarece que «pais» se refere aos antepassados e que a medida é a culpa acumulada.
