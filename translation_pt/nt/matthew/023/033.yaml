  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὄφεις γεννήματα ἐχιδνῶν, πῶς φύγητε ἀπὸ τῆς κρίσεως τῆς γεέννης;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: pt
  text: Cobras, descendência de víboras! Como vocês escaparão do julgamento da Geena?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do julgamento do inferno”. Grego: “Geena”.'
    reason: Registra a equivalência portuguesa comum sem substituir no texto principal o termo específico do original.
lexical_decisions:
- source_word: ὄφεις
  choice: Cobras
  rationale: Vocativo de denúncia direto e natural em português; preserva a imagem de serpentes sem recorrer ao tom mais literário de “serpentes”.
- source_word: γεννήματα
  choice: descendência
  rationale: Expressa aquilo que foi gerado ou produzido e mantém de forma transparente a construção com o genitivo seguinte.
- source_word: ἐχιδνῶν
  choice: víboras
  rationale: Preserva a referência específica a serpentes peçonhentas e a intensidade da denúncia.
- source_word: πῶς
  choice: Como
  rationale: Introduz a pergunta retórica sem decidir explicitamente entre incapacidade e simples futuridade.
- source_word: φύγητε
  choice: escaparão
  rationale: O futuro em português comunica com naturalidade a perspectiva de fuga evocada pela forma grega e se combina bem com “do julgamento”.
- source_word: κρίσεως
  choice: julgamento
  rationale: Mantém o sentido judicial amplo; “condenação” anteciparia de modo interpretativo o resultado do julgamento.
- source_word: γεέννης
  choice: Geena
  rationale: Usa a forma portuguesa tradicional do topônimo grego, preservando sua especificidade histórica e escatológica em vez de reduzi-lo diretamente a “inferno”.
theological_decisions:
- issue: Tradução de γέεννα
  choice: Geena
  alternative: inferno
  rationale: “Geena” preserva o termo específico e seu pano de fundo judaico; a equivalência comum “inferno” é registrada em nota sem importar silenciosamente todas as associações teológicas posteriores.
- issue: Força retórica de πῶς φύγητε
  choice: Como vocês escaparão
  alternative: Como vocês poderão escapar
  rationale: A formulação escolhida conserva a orientação futura e a pergunta retórica, sem explicitar a incapacidade por meio de “poderão”, ideia que o contexto pode sugerir, mas que não está lexicalmente expressa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” torna explícito o plural da segunda pessoa. A aliteração tradicional de “serpentes, raça de víboras” foi evitada em favor de uma representação lexical mais transparente de γεννήματα.
