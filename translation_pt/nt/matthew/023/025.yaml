  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: pt
  text: Ai de vocês, escribas e fariseus, hipócritas! Pois vocês limpam o lado de fora do copo e do prato, mas por dentro eles estão cheios de ganância e falta de domínio próprio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas por dentro eles estão cheios de roubo/extorsão e falta de domínio próprio”. Os termos gregos podem indicar apropriação exploradora e excesso sem controle.'
    reason: alternativa lexical
lexical_decisions:
- source_word: Οὐαὶ
  choice: Ai de vocês
  rationale: Preserva a força de denúncia profética da expressão grega e é idiomático em português bíblico atual.
- source_word: γραμματεῖς
  choice: escribas
  rationale: Termo tradicional e preciso para os especialistas na Lei neste contexto, sem ampliar interpretativamente para “mestres da Lei”.
- source_word: Φαρισαῖοι
  choice: fariseus
  rationale: Forma portuguesa estabelecida para o nome do grupo.
- source_word: ὑποκριταί
  choice: hipócritas
  rationale: Equivalente corrente que comunica com precisão a impostura moral e religiosa denunciada.
- source_word: καθαρίζετε
  choice: limpam
  rationale: Verbo natural e contemporâneo que mantém o presente ativo.
- source_word: τὸ ἔξωθεν
  choice: o lado de fora
  rationale: Expressão clara e idiomática que preserva o contraste espacial com “por dentro”.
- source_word: ποτηρίου
  choice: copo
  rationale: Equivalente comum para um recipiente usado para beber.
- source_word: παροψίδος
  choice: prato
  rationale: Designação ampla e compreensível de um recipiente de mesa, sem especificar indevidamente seu formato.
- source_word: ἔσωθεν
  choice: por dentro
  rationale: Mantém de modo natural o contraste entre exterior e interior.
- source_word: γέμουσιν
  choice: eles estão cheios
  rationale: Conserva o plural do verbo grego, remetendo conjuntamente ao copo e ao prato, em vez de explicitar os líderes como referente da metáfora.
- source_word: ἁρπαγῆς
  choice: ganância
  rationale: No contexto da denúncia moral, expressa a avidez possessiva, enquanto a nota registra os sentidos mais fortes de roubo, saque ou extorsão.
- source_word: ἀκρασίας
  choice: descontrole
  rationale: Comunica a falta de domínio sobre os próprios desejos e comportamentos; é conciso, atual e preserva amplitude maior que uma forma estritamente ligada ao prazer.
theological_decisions:
- issue: Referente metafórico da impureza interior
  choice: 'Manter a imagem no nível do copo e do prato: “por dentro eles estão cheios”'
  alternative: “mas por dentro vocês estão cheios de ganância e descontrole”
  rationale: O plural grego mantém formalmente os recipientes como sujeito, embora a aplicação aos líderes seja evidente. Preservar essa construção evita inserir no texto uma explicitação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ai de vocês” preserva o tom profético; “escribas” e “fariseus” mantêm a terminologia histórica estabelecida. O pronome plural “eles” foi conservado para refletir a sintaxe grega e não desfazer a metáfora.
