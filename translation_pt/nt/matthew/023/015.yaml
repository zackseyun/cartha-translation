id: MAT.23.15
reference: Matthew 23:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: pt
  text: Ai de vocês, escribas e fariseus, hipócritas! Pois percorrem o mar e a terra para fazer um só prosélito[a] e, quando ele se torna um, vocês fazem dele um filho da Geena[b], duas vezes mais do que vocês mesmos o são.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, alguém convertido ao judaísmo.
    reason: lexical_clarification
  - marker: b
    text: Ou “um filho do inferno”. Geena é o termo grego usado aqui.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: Ai de vocês
  rationale: Preserva a força de denúncia profética de οὐαί em uma formulação natural e tradicional em português.
- source_word: γραμματεῖς
  choice: escribas
  rationale: Designação histórica, concisa e reconhecida para o grupo de estudiosos e intérpretes da lei.
- source_word: Φαρισαῖοι
  choice: fariseus
  rationale: Forma portuguesa consagrada para o grupo judaico mencionado.
- source_word: ὑποκριταί
  choice: hipócritas
  rationale: Equivalente corrente que expressa a denúncia de fingimento moral e religioso.
- source_word: περιάγετε τὴν θάλασσαν καὶ τὴν ξηράν
  choice: percorrem o mar e a terra
  rationale: Comunica o amplo deslocamento e esforço indicados pela expressão, com fluidez em português.
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: para fazer um só prosélito
  rationale: Mantém o termo histórico específico προσήλυτος e a ênfase de ἕνα; uma nota esclarece seu sentido para leitores atuais.
- source_word: ὅταν γένηται
  choice: quando ele se torna um
  rationale: Explicita naturalmente o complemento implícito — tornar-se prosélito — e preserva a referência masculina singular do grego.
- source_word: υἱὸν γεέννης
  choice: um filho da Geena
  rationale: Preserva tanto o idioma semítico 'filho de' quanto o termo grego γεέννα, sem substituí-lo silenciosamente pelo conceito mais generalizado de inferno.
- source_word: διπλότερον ὑμῶν
  choice: duas vezes mais do que vocês mesmos
  rationale: Representa de modo claro a força comparativa de διπλότερον e mantém o contraste enfático com os destinatários.
theological_decisions:
- issue: Tradução de γεέννα
  choice: Geena
  alternative: inferno
  rationale: O texto grego emprega γεέννα, termo de fundo histórico e escatológico judaico. A tradução o conserva no corpo do texto, enquanto a nota oferece o equivalente tradicional.
- issue: Expressão semítica υἱὸν γεέννης
  choice: filho da Geena
  alternative: destinado à Geena
  rationale: A forma literal preserva a imagem e a tensão retórica do original, sem explicar no corpo do texto exatamente em que sentido a pessoa pertence à Geena.
- issue: Referência masculina singular depois de προσήλυτον
  choice: quando ele se torna um ... dele
  alternative: quando alguém se torna prosélito ... dessa pessoa
  rationale: O grego usa formas masculinas singulares; a tradução as mantém de modo natural, sem generalização que apague a forma do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se os termos históricos “escribas”, “prosélito” e “Geena”, com notas breves para assegurar acessibilidade. A segunda pessoa plural é expressa por “vocês”, forma natural no português brasileiro e inteligível internacionalmente.
