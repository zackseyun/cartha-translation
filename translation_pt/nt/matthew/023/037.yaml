  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ⸀ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου, ὃν τρόπον ⸂ὄρνις ἐπισυνάγει⸃ τὰ νοσσία ⸀αὐτῆς ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: pt
  text: Jerusalém, Jerusalém, você que mata os profetas e apedreja os que lhe foram enviados — quantas vezes quis reunir seus filhos, como a galinha reúne seus pintinhos debaixo de suas asas, e vocês não quiseram? [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto passa do singular, ao falar com Jerusalém como cidade personificada (“você que mata”), para o plural em “vocês não quiseram”, referindo-se às pessoas associadas a ela.
    reason: grammatical_clarification
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Jerusalém, Jerusalém
  rationale: Mantém o nome tradicional em português, a repetição enfática e o tom de lamento e apelo direto.
- source_word: ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα
  choice: você que mata os profetas e apedreja
  rationale: Os particípios presentes caracterizam a Jerusalém personificada; a oração relativa com “você” é natural em português e preserva o paralelismo.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: os que lhe são enviados
  rationale: Conserva a voz passiva e a referência à cidade personificada, sem identificar além do que o texto diz quem os envia.
- source_word: ποσάκις ἠθέλησα
  choice: Quantas vezes quis
  rationale: Expressa de modo corrente tanto a frequência lamentada quanto a vontade ou o desejo do falante, sem intensificação doutrinária.
- source_word: ἐπισυναγαγεῖν τὰ τέκνα σου
  choice: reunir seus filhos
  rationale: “Reunir” comunica o ato de juntar, e “filhos” mantém a metáfora relacional da cidade e seus habitantes.
- source_word: ὃν τρόπον ὄρνις ἐπισυνάγει τὰ νοσσία αὐτῆς
  choice: como a galinha reúne seus pintinhos
  rationale: Embora ὄρνις possa designar uma ave em sentido amplo, a imagem materna dos filhotes sob as asas favorece “galinha”; “pintinhos” verte naturalmente νοσσία no contexto.
- source_word: ὑπὸ τὰς πτέρυγας
  choice: debaixo das asas
  rationale: Reproduz com clareza a imagem concreta de abrigo e proteção.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: mas vocês não quiseram
  rationale: O plural do verbo muda do tratamento singular da cidade para seus filhos ou habitantes. “Mas” torna explícito em português o contraste contextual expresso pela coordenação grega.
theological_decisions:
- issue: Contraste volitivo entre Jesus e Jerusalém
  choice: quis ... não quiseram
  alternative: desejei ... vocês se recusaram
  rationale: Repete a mesma raiz verbal em português e preserva a tensão entre a vontade de Jesus e a indisposição dos destinatários, sem resolver debates sobre vontade divina, responsabilidade humana ou cristologia.
- issue: Mudança do singular para o plural
  choice: você que mata ... vocês não quiseram
  alternative: tu que matas ... não quiseste
  rationale: O grego primeiro personifica Jerusalém no singular e depois emprega o plural ἠθελήσατε, provavelmente abrangendo seus habitantes. A tradução preserva essa mudança significativa.
- issue: Identidade de “seus filhos”
  choice: seus filhos
  alternative: seus habitantes
  rationale: Mantém a metáfora do texto e não restringe o referente a um grupo interpretativamente definido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “você/vocês” para preservar naturalmente a mudança do singular para o plural. A exclamação após a descrição de Jerusalém e o contraste com “mas” transmitem o lamento sem tornar a construção artificial.
