  naturalness: “Você/vocês” é uma solução moderna, clara e apropriada para manter a alternância singular–plural. A frase flui de modo mais natural e fiel como uma pergunta contínua, sem a exclamação após “enviados”. “Debaixo de suas asas” explicita naturalmente o possessivo presente no grego.
  terminology: “Jerusalém”, “profetas”, “apedreja”, “filhos”, “galinha” e “pintinhos” são adequados. “Galinha” é uma especificação contextual segura para ὄρνις nesta imagem maternal.
