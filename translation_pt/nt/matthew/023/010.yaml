id: MAT.23.10
reference: Matthew 23:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μηδὲ κληθῆτε καθηγηταί, ⸂ὅτι καθηγητὴς ὑμῶν ἐστιν εἷς⸃ ὁ χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/010.yaml
  text: And do not be called instructors[a], because your instructor is one—the Messiah.
translation:
  language: pt
  text: 'Também não sejam chamados de guias, pois o guia de vocês é um só: o Messias.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Cristo”.
    reason: Registra a tradução tradicional alternativa do título grego Χριστός.
lexical_decisions:
- source_word: μηδὲ
  choice: Também não
  rationale: Dá continuidade natural, em português moderno, à sequência de proibições do contexto e preserva a força conectiva.
- source_word: κληθῆτε
  choice: sejam chamados
  rationale: O passivo de καλέω refere-se aqui a receber um título ou designação; a formulação é direta e idiomática.
- source_word: καθηγηταί / καθηγητής
  choice: guias / guia
  rationale: καθηγητής pode designar quem conduz, orienta ou instrui. “Guia” preserva essa amplitude e evita confusão com διδάσκαλος (“mestre”) no contexto próximo.
- source_word: ὅτι
  choice: pois
  rationale: Introduz com clareza a razão da proibição, em registro natural e digno.
- source_word: ὑμῶν
  choice: de vocês
  rationale: Forma possessiva clara, amplamente compreensível e de boa legibilidade brasileira.
- source_word: ἐστιν εἷς
  choice: um só é
  rationale: Preserva a ênfase grega na singularidade sem acrescentar uma exclusividade mais forte do que a expressa no texto.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: O artigo e o contexto indicam o emprego de Χριστός como título; “Messias” comunica seu sentido e mantém o contexto judaico.
theological_decisions:
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: o Cristo
  rationale: Neste versículo, Χριστός funciona claramente como título. Traduzir por “Messias” explicita o valor do termo sem transformá-lo em nome próprio.
- issue: Alcance de καθηγητής
  choice: guia
  alternative: instrutor; líder; mestre
  rationale: “Guia” retém a ideia de alguém que conduz e orienta, sem identificar o termo com διδάσκαλος, usado no contexto próximo, nem restringi-lo à liderança institucional.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com legibilidade brasileira. A ordem “um só é o guia de vocês” conserva a ênfase na unicidade; os dois-pontos apresentam “o Messias” como identificação desse único guia.
