  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Φαρισαῖε τυφλέ, καθάρισον πρῶτον τὸ ἐντὸς τοῦ ποτηρίου ⸂καὶ τῆς παροψίδος⸃, ἵνα γένηται καὶ τὸ ἐκτὸς ⸀αὐτοῦ καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/026.yaml
  text: Blind Pharisee[a], first clean the inside of the cup and the dish, so that its outside also may become clean.
translation:
  language: pt
  text: Fariseu cego, limpe primeiro o interior do copo e da travessa[a], para que também o exterior fique limpo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «prato», «tigela» ou «bandeja»; o termo grego indica um recipiente usado para servir comida.
    reason: Alternativa lexical para παροψίς, cujo formato exato não é especificado.
lexical_decisions:
- source_word: Φαρισαῖε τυφλέ
  choice: Fariseu cego
  rationale: Mantém o vocativo singular direto e a metáfora incisiva de cegueira, com ordem natural e digna em português.
- source_word: καθάρισον πρῶτον
  choice: limpe primeiro
  rationale: O imperativo comunica uma ação decisiva, enquanto «primeiro» preserva a prioridade lógica e sequencial.
- source_word: τὸ ἐντὸς τοῦ ποτηρίου
  choice: o interior do copo
  rationale: «Interior» expressa com naturalidade a parte de dentro, e «copo» é o equivalente comum para o recipiente de beber.
- source_word: καὶ τῆς παροψίδος
  choice: e da travessa
  rationale: παροψίς designa um recipiente usado para servir comida; «travessa» preserva essa ideia sem determinar demais seu formato.
- source_word: ἵνα γένηται
  choice: para que ... fique
  rationale: «Fique» preserva o sentido resultativo de γίνομαι e soa mais natural em português do que uma tradução rígida com «se torne».
- source_word: καὶ τὸ ἐκτὸς αὐτοῦ καθαρόν
  choice: também o exterior fique limpo
  rationale: Mantém o paralelismo entre interior e exterior e o valor aditivo de καί. A omissão de um possessivo explícito em português evita forçar a referência do singular αὐτοῦ após a menção de dois recipientes, sem perder o sentido.
theological_decisions:
- issue: Imagem concreta dos recipientes ou explicitação da aplicação moral
  choice: Manter a imagem literal de limpar o interior e o exterior do copo e da travessa.
  alternative: Explicitar a metáfora como purificação da vida interior e exterior.
  rationale: O grego apresenta a repreensão por meio de uma imagem concreta e deixa sua aplicação moral implícita. Explicá-la no texto principal reduziria a força retórica e acrescentaria interpretação.
translation_notes:
  register: Português moderno, claro e amplamente compreensível, com legibilidade brasileira. O tom direto da repreensão é preservado sem arcaísmo. «Exterior» equilibra naturalmente «interior», e «fique limpo» mantém tanto a imagem física quanto sua ressonância moral.
