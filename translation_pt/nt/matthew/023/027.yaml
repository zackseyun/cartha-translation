id: MAT.23.27
reference: Matthew 23:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: pt
  text: Ai de vocês, escribas e fariseus, hipócritas! Pois vocês se parecem com túmulos caiados[a], que por fora parecem bonitos, mas por dentro estão cheios de ossos de mortos e de toda espécie de impureza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “túmulos revestidos de cal”.'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “impureza” pode abranger tanto a contaminação ritual quanto a corrupção moral.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαὶ
  choice: Ai de vocês
  rationale: Preserva a fórmula profética de denúncia e juízo em português natural, sem reduzi-la a uma simples expressão de tristeza.
- source_word: γραμματεῖς
  choice: escribas
  rationale: É a designação histórica consagrada para os especialistas judeus nas Escrituras e na Lei, mantendo maior correspondência formal que uma paráfrase como “mestres da Lei”.
- source_word: Φαρισαῖοι
  choice: fariseus
  rationale: Forma portuguesa estabelecida para o nome do grupo.
- source_word: ὑποκριταί
  choice: hipócritas
  rationale: No contexto, denuncia a discrepância entre aparência religiosa e realidade interior; a palavra é clara, corrente e retoricamente forte.
- source_word: παρομοιάζετε
  choice: vocês se parecem com
  rationale: Expressa de modo idiomático a comparação direta feita pelo verbo, sem recorrer a uma construção passiva pouco natural.
- source_word: τάφοις κεκονιαμένοις
  choice: túmulos caiados
  rationale: “Túmulos” retrata locais de sepultamento visíveis, e “caiados” comunica o revestimento com cal que lhes dava aparência branca.
- source_word: ἔξωθεν μὲν ... ἔσωθεν δὲ
  choice: por fora ... mas por dentro
  rationale: Reproduz com clareza e força o contraste retórico entre aparência exterior e realidade interior.
- source_word: φαίνονται ὡραῖοι
  choice: parecem bonitos
  rationale: Mantém a ênfase na aparência visual, em vez de afirmar beleza essencial; “bonitos” é corrente e adequado ao referente concreto.
- source_word: γέμουσιν
  choice: estão cheios de
  rationale: Equivalente português natural para a ideia presente de estar repleto.
- source_word: ὀστέων νεκρῶν
  choice: ossos de mortos
  rationale: Verte naturalmente a construção genitiva e deixa claro que se trata dos ossos de pessoas mortas.
- source_word: πάσης ἀκαθαρσίας
  choice: toda espécie de impureza
  rationale: O singular grego com πᾶς abrange plenamente a impureza; esta formulação natural preserva sua amplitude sem restringi-la ao ritual ou ao moral.
theological_decisions:
- issue: Natureza de ἀκαθαρσία na metáfora
  choice: impureza
  alternative: impureza ritual; corrupção moral
  rationale: Os túmulos evocam contaminação ritual no contexto judaico, enquanto a denúncia de Jesus também aponta para corrupção interior. O termo amplo preserva ambas as ressonâncias sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis e boa legibilidade brasileira. O tratamento “vocês” evita arcaísmo; a cadência antitética “por fora... mas por dentro” conserva a força retórica do original.
