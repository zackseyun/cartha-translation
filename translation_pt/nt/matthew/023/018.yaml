id: MAT.23.18
reference: Matthew 23:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καί· Ὃς ⸀ἂν ὀμόσῃ ἐν τῷ θυσιαστηρίῳ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ δώρῳ τῷ ἐπάνω αὐτοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: pt
  text: 'E: “Quem jurar pelo altar, isso não vale nada[a]; mas quem jurar pela oferta[b] que está sobre ele fica obrigado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, segundo o ensino que Jesus está condenando, um juramento pelo altar “não vale nada”, enquanto um juramento pela oferta colocada sobre ele é considerado obrigatório.
    reason: cultural_note
  - marker: b
    text: Ou “pelo presente”. A palavra grega pode designar uma dádiva apresentada a Deus no templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: E
  rationale: Mantém o conectivo simples que dá continuidade à série de ensinamentos citados e condenados por Jesus.
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: Quem jurar ... mas quem jurar
  rationale: A construção com ὅς, ἄν e subjuntivo aoristo expressa uma condição geral indefinida; esta formulação é natural em português e preserva sua força genérica.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: pelo altar
  rationale: Com o verbo 'jurar', ἐν introduz aquilo pelo qual se jura; 'pelo altar' corresponde ao uso idiomático português.
- source_word: θυσιαστήριον
  choice: altar
  rationale: É o termo português corrente e preciso para o altar sacrificial no contexto do templo.
- source_word: οὐδέν ἐστιν
  choice: isso não vale nada
  rationale: Expressa naturalmente em português a alegação casuística de que tal juramento não tem validade, sem apresentá-la como juízo do narrador.
- source_word: ἐν τῷ δώρῳ
  choice: pela oferta
  rationale: No contexto do templo, δῶρον designa o que é apresentado a Deus; 'oferta' é mais natural e imediatamente compreensível em português do que o equivalente mais literal 'presente'.
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: que está sobre ele
  rationale: Preserva a relação espacial indicada por ἐπάνω e deixa claro que o pronome retoma o altar.
- source_word: ὀφείλει
  choice: fica obrigado
  rationale: Comunica a obrigação moral e jurídica associada ao juramento, mantendo sem explicitação o objeto da obrigação, como no grego.
theological_decisions:
- issue: Objeto implícito da obrigação na fórmula de juramento
  choice: fica obrigado
  alternative: fica obrigado a cumprir o juramento
  rationale: O grego não declara o objeto de ὀφείλει. A tradução mantém essa concisão e não acrescenta ao texto a explicação de que a pessoa deve cumprir o juramento, embora isso esteja implícito no contexto.
- issue: Voz citada que declara o juramento sem valor
  choice: isso não vale nada
  alternative: não é nada
  rationale: A formulação transmite a posição que Jesus está citando para condenar, sem sugerir que ele próprio aprova essa distinção; a nota torna explícito o enquadramento discursivo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura paralela e a concisão do original foram mantidas. Os marcadores das notas foram ordenados conforme sua primeira ocorrência no texto português.
