  source_fidelity: A tradução preserva com precisão a estrutura condicional genérica de ὃς ἂν ... ὀμόσῃ, o uso idiomático de «pelo» com juramentos, o contraste entre οὐδέν ἐστιν e ὀφείλει e a referência espacial da oferta sobre o altar. «Fica obrigado» mantém adequadamente sem explicitar o objeto que o grego deixa implícito.
  naturalness: O texto é claro, conciso e natural em português moderno de ampla compreensão. «Isso não vale nada» comunica bem, no contexto de uma fórmula de juramento, o sentido de que o juramento é tido como sem valor vinculante. A pontuação introdutória «E:» reproduz de modo aceitável a continuação de uma série de enunciados citados.
  terminology: «Altar» e «oferta» são apropriados ao contexto cultual. A nota lexical de «oferta» explica de maneira suficiente a alternativa mais literal «presente» e o emprego de δῶρον para uma dádiva apresentada a Deus.
