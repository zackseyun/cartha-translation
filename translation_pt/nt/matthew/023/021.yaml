  text: καὶ ὁ ὀμόσας ἐν τῷ ναῷ ὀμνύει ἐν αὐτῷ καὶ ἐν τῷ ⸀κατοικοῦντι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/021.yaml
  text: And whoever swears by the temple swears by it and by the One dwelling in it[a].
translation:
  language: pt
  text: E quem jura pelo templo jura por ele e por aquele que nele habita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no templo [...] nele”; a preposição grega significa literalmente “em”, mas, nesta fórmula de juramento, tem o sentido de “por”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: quem jura
  rationale: O particípio aoristo substantivado tem sentido genérico. “Quem jura” é natural em português atual e não introduz marcação masculina desnecessária.
- source_word: ἐν τῷ ναῷ
  choice: pelo templo
  rationale: Embora ἐν signifique normalmente “em”, nesta fórmula de juramento indica aquilo que é invocado; “pelo templo” expressa esse uso idiomático em português.
- source_word: ναῷ
  choice: templo
  rationale: ναός designa o santuário ou templo propriamente dito. “Templo” é claro, corrente e adequado ao contexto do templo de Jerusalém.
- source_word: ὀμνύει
  choice: jura
  rationale: O presente do indicativo enuncia o princípio geral decorrente do juramento, de forma concisa.
- source_word: ἐν αὐτῷ
  choice: por ele
  rationale: Repete-se o uso de ἐν próprio da fórmula de juramento; o pronome retoma “templo”.
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: aquele que nele habita
  rationale: O particípio presente substantivado refere-se, pelo contexto, a Deus como aquele que habita no templo. A formulação preserva a imagem de habitação e deixa a identificação contextual sem depender de maiúscula reverencial.
theological_decisions:
- issue: Identificação daquele que habita no templo
  choice: “aquele que nele habita”, com referente divino implícito no contexto
  alternative: “Aquele que nele habita”, com maiúscula reverencial explícita
  rationale: O contexto identifica o referente como Deus, mas o grego não possui uma distinção gráfica equivalente à maiúscula reverencial. A redação preserva a referência contextual sem acrescentar uma sinalização interpretativa tipográfica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a estrutura paralela do grego e traduz idiomaticamente a fórmula de juramento.
