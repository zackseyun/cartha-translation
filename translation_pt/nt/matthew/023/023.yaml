id: MAT.23.23
reference: Matthew 23:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: pt
  text: 'Ai de vocês, escribas e fariseus, hipócritas! Pois vocês dão o dízimo da hortelã, do endro e do cominho, mas têm negligenciado as questões mais importantes da Lei: a justiça, a misericórdia e a fé[a]. Estas coisas vocês deviam praticar, sem negligenciar aquelas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fidelidade”. A palavra grega pode significar fé, confiança ou fidelidade; neste contexto ético, muitos a entendem como fidelidade à aliança.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: Ai de vocês
  rationale: Preserva a fórmula profética de denúncia e juízo, em português natural e solene.
- source_word: γραμματεῖς
  choice: escribas
  rationale: Termo tradicional e preciso no contexto dos Evangelhos, sem ampliar interpretativamente para “mestres da Lei”.
- source_word: ὑποκριταί
  choice: hipócritas
  rationale: Expressa de modo direto e idiomático o sentido ético da acusação.
- source_word: ἀποδεκατοῦτε
  choice: dão o dízimo
  rationale: Comunica claramente a entrega da décima parte e preserva a nuance legal e religiosa.
- source_word: ἡδύοσμον
  choice: hortelã
  rationale: Equivalente português corrente para a erva mencionada.
- source_word: ἄνηθον
  choice: endro
  rationale: Nome português padrão da erva referida.
- source_word: κύμινον
  choice: cominho
  rationale: Equivalente português corrente e exato.
- source_word: ἀφήκατε
  choice: têm negligenciado
  rationale: No contexto, o verbo indica deixar de lado ou não cumprir; a forma verbal ressalta a conduta continuada com efeitos presentes.
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: as questões mais importantes da Lei
  rationale: Torna explícito o sentido metafórico de “mais pesadas” sem perder a comparação de importância.
- source_word: κρίσιν
  choice: justiça
  rationale: Na tríade ética, designa a prática do que é justo, mais naturalmente que “julgamento”.
- source_word: ἔλεος
  choice: misericórdia
  rationale: Equivalente bíblico corrente, adequado à dimensão ética e relacional do termo.
- source_word: πίστιν
  choice: fé
  rationale: Preserva o equivalente mais direto e a ambiguidade lexical; “fidelidade” é indicada em nota por ser plausível neste contexto ético.
- source_word: ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ἀφιέναι
  choice: Estas coisas vocês deviam praticar, sem negligenciar aquelas
  rationale: Reproduz a obrigação das prioridades maiores sem sugerir que as práticas menores deveriam ser abandonadas.
theological_decisions:
- issue: Sentido de πίστιν na tríade ética
  choice: fé
  alternative: fidelidade
  rationale: O termo grego pode indicar fé, confiança ou fidelidade. O contexto ético favorece para muitos leitores o sentido de fidelidade, mas não o exige de forma inequívoca; por isso, mantém-se “fé” no texto e registra-se a alternativa em nota.
- issue: Relação entre os deveres mais importantes e o dízimo das ervas
  choice: A justiça, a misericórdia e a fé recebem prioridade, sem anular as outras práticas mencionadas
  alternative: Entender a frase como rejeição do dízimo minucioso
  rationale: A cláusula final afirma expressamente que aquelas outras coisas não deveriam ser negligenciadas, preservando a tensão do texto sem transformar a crítica à desproporção em abolição.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Mantém tom digno e profético. Usa “vocês” por clareza contemporânea, “Lei” com inicial maiúscula como referência à Lei mosaica e nomes comuns das ervas.
