source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ οὐρανῷ ὀμνύει ἐν τῷ θρόνῳ τοῦ θεοῦ καὶ ἐν τῷ καθημένῳ ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: pt
  text: E quem jura pelo céu jura pelo trono de Deus e por aquele que está sentado nele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele que se assenta nele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: quem jura
  rationale: O particípio aoristo substantivado tem sentido genérico; em português, «quem jura» expressa naturalmente o princípio geral, sem impor referência exclusiva ao passado.
- source_word: ἐν
  choice: por/pelo
  rationale: Nas fórmulas de juramento, ἐν com dativo indica aquilo pelo qual se jura; «por», contraído em «pelo» quando necessário, é o equivalente idiomático em português.
- source_word: οὐρανῷ
  choice: céu
  rationale: Neste contexto religioso judaico, οὐρανός designa o céu, associado imediatamente ao trono de Deus, e não apenas o firmamento físico.
- source_word: ὀμνύει
  choice: jura
  rationale: O presente do indicativo enuncia uma verdade geral, adequadamente expressa pelo presente simples em português.
- source_word: θρόνῳ τοῦ θεοῦ
  choice: trono de Deus
  rationale: Preserva a construção genitiva explícita e o tom solene do grego.
- source_word: τῷ καθημένῳ
  choice: aquele que está sentado
  rationale: Expressa de modo natural o particípio substantivado de κάθημαι e mantém a referência reverente àquele que ocupa o trono, sem substituí-lo explicitamente por «Deus».
- source_word: ἐπάνω αὐτοῦ
  choice: nele
  rationale: No contexto do trono, indica que a pessoa está sentada nele; «nele» é claro e natural em português, sem sugerir separação espacial, como poderia ocorrer com «acima dele».
theological_decisions:
- issue: Referente de «aquele que está sentado nele»
  choice: Circunlóquio reverente para Deus entronizado no céu
  alternative: Uma referência mais indefinida a «aquele que está sentado ali»
  rationale: A expressão imediatamente anterior, «trono de Deus», esclarece o referente, e a lógica do versículo é que jurar pelo céu envolve o próprio Deus. A tradução preserva o circunlóquio do grego em vez de substituí-lo por «Deus».
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de «jura» e «pelo» preserva a estrutura e a força retórica do original; «está sentado» soa natural sem perder a imagem de entronização.
