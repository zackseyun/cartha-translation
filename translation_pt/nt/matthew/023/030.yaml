  naturalness: «Nos dias dos nossos pais» pode ser entendido modernamente como referência aos próprios pais imediatos e, em português brasileiro, «pais» também pode abranger pai e mãe. «Antepassados» comunica de modo claro o referente histórico. A construção revista é fluente, solene sem ser arcaica, e compreensível internacionalmente.
  terminology: «Profetas» é correto e estabelecido. «Participado com eles» conserva o valor de participação conjunta de κοινωνοί; a nota mantém alternativas que incluem a nuance de cumplicidade. «Antepassados» é uma adaptação idiomática apropriada para os «pais» históricos invocados no contexto.
