  text: καὶ λέγετε· Εἰ ⸀ἤμεθα ἐν ταῖς ἡμέραις τῶν πατέρων ἡμῶν, οὐκ ἂν ⸁ἤμεθα ⸂αὐτῶν κοινωνοὶ⸃ ἐν τῷ αἵματι τῶν προφητῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/030.yaml
  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: pt
  text: 'e dizem: “Se tivéssemos vivido nos dias de nossos antepassados, não teríamos participado com eles[a] do derramamento do sangue[b] dos profetas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tomado parte com eles” ou “sido seus cúmplices”; o termo grego pode indicar participação conjunta ou cumplicidade.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “no sangue dos profetas”; isto é, no derramamento do sangue deles. Eles afirmam que não teriam compartilhado a culpa de seus antepassados.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγετε
  choice: dizem
  rationale: O presente do indicativo, na segunda pessoa do plural, mantém a interpelação direta de Jesus; “dizem” é natural e exato em português.
- source_word: Εἰ ἤμεθα
  choice: Se tivéssemos vivido
  rationale: A construção introduz uma condição contrária aos fatos no passado. “Tivéssemos vivido” explicita naturalmente a ideia de estar presente naquela época.
- source_word: ἐν ταῖς ἡμέραις
  choice: nos dias
  rationale: Preserva a expressão temporal do grego e uma cadência bíblica ainda clara no português moderno.
- source_word: τῶν πατέρων ἡμῶν
  choice: dos nossos pais
  rationale: Mantém o sentido literal de πατέρων e a referência aos antepassados masculinos invocados pelos interlocutores; no contexto, “pais” significa antepassados.
- source_word: οὐκ ἂν ἤμεθα
  choice: não teríamos
  rationale: Expressa de modo idiomático a consequência irreal de uma condição passada.
- source_word: αὐτῶν κοινωνοὶ
  choice: tomado parte com eles
  rationale: Comunica participação conjunta e possível cumplicidade sem intensificar o grego para o termo mais acusatório “cúmplices”.
- source_word: ἐν τῷ αἵματι
  choice: no sangue
  rationale: Conserva a imagem concreta e deliberadamente condensada do original, em vez de substituí-la no texto por “no derramamento do sangue” ou “no assassinato”.
- source_word: τῶν προφητῶν
  choice: dos profetas
  rationale: Equivalente estabelecido, direto e inequívoco de προφητῶν.
theological_decisions:
- issue: Grau de cumplicidade expresso por κοινωνοὶ ἐν τῷ αἵματι
  choice: “tomado parte com eles no sangue dos profetas”
  alternative: “sido cúmplices deles no assassinato dos profetas” ou “compartilhado com eles a culpa pelo sangue dos profetas”
  rationale: A formulação escolhida mantém tanto a participação moral quanto a metáfora do sangue, sem resolver por paráfrase toda a força jurídica e teológica da expressão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão “nos dias dos nossos pais” preserva a cadência do original; “pais” é entendida contextualmente como antepassados. As notas foram posicionadas junto às expressões que efetivamente explicam.
