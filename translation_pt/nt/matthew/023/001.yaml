  text: 'Então Jesus falou às multidões e aos seus discípulos:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Advérbio temporal que marca a sequência narrativa; “Então” é natural, conciso e preserva a ligação com o contexto anterior.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: O artigo diante do nome próprio é normal na narrativa grega e não precisa ser reproduzido em português.
- source_word: ἐλάλησεν
  choice: falou
  rationale: O aoristo de λαλέω indica aqui o ato simples de falar. “Falou” mantém a formulação direta sem acrescentar a nuance mais específica de “dirigiu-se”.
- source_word: τοῖς ὄχλοις
  choice: às multidões
  rationale: O dativo plural designa os grupos de pessoas reunidas. “Multidões” preserva o plural do grego e é corrente em português bíblico moderno.
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa simples que liga os dois grupos de ouvintes.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: aos seus discípulos
  rationale: O dativo plural com genitivo possessivo é expresso naturalmente em português por “aos seus discípulos”; “discípulos” é o equivalente estabelecido e preciso de μαθηταί neste contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com leitura natural no Brasil. Os dois destinatários são mantidos no plural, conforme o grego. Os dois-pontos sinalizam que o discurso continua no versículo seguinte, sem acrescentar conteúdo ao texto.
