  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι οἰκοδομεῖτε τοὺς τάφους τῶν προφητῶν καὶ κοσμεῖτε τὰ μνημεῖα τῶν δικαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/029.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites, because you build the tombs of the prophets and decorate the monuments of the righteous[b],
translation:
  language: pt
  text: Ai de vocês, escribas e fariseus, hipócritas, porque constroem os túmulos dos profetas e ornamentam os monumentos[a] dos justos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “memoriais” ou “túmulos”. O termo grego pode designar monumentos funerários ou sepulturas; aqui, “monumentos” o distingue de “túmulos” na primeira parte do versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί
  choice: Ai de vocês
  rationale: Preserva a fórmula profética de denúncia e juízo em português natural e solene.
- source_word: γραμματεῖς
  choice: escribas
  rationale: Designação tradicional e precisa dos especialistas judeus nas Escrituras e na Lei, sem ampliar interpretativamente o termo.
- source_word: Φαρισαῖοι
  choice: fariseus
  rationale: Forma consagrada em português para o nome do grupo.
- source_word: ὑποκριταί
  choice: hipócritas
  rationale: Expressa de modo direto a acusação de fingimento moral e religioso presente no contexto.
- source_word: ὅτι
  choice: porque
  rationale: Introduz explicitamente a causa da denúncia, conforme o valor causal do termo no contexto.
- source_word: οἰκοδομεῖτε
  choice: constroem
  rationale: Mantém o presente de valor habitual sem acrescentar a ideia não exigida de reconstrução.
- source_word: τάφους
  choice: túmulos
  rationale: Adequado a sepulturas construídas e à ação de construir expressa pelo verbo.
- source_word: προφητῶν
  choice: dos profetas
  rationale: Reproduz naturalmente a relação genitiva de posse ou associação.
- source_word: κοσμεῖτε
  choice: ornamentam
  rationale: Comunica a ação de adornar ou embelezar, mantendo um registro digno e corrente.
- source_word: μνημεῖα
  choice: monumentos
  rationale: Conserva a nuance comemorativa e distingue o termo de τάφους, embora também possa designar monumentos funerários ou túmulos.
- source_word: δικαίων
  choice: dos justos
  rationale: Traduz o adjetivo substantivado de forma concisa e preserva sua categoria moral e teológica.
theological_decisions:
- issue: Sentido de δικαίων neste contexto mateano
  choice: os justos
  alternative: as pessoas justas
  rationale: A forma substantivada se refere aos fiéis ou moralmente íntegros do passado de Israel; “os justos” preserva a formulação teológica do texto sem importar uma definição doutrinária posterior.
translation_notes:
  register: Português moderno, amplamente compreensível e com legibilidade brasileira. A frase mantém a força profética de denúncia; “vocês” favorece naturalidade internacional com leitura brasileira. A vírgula antes de “porque” liga a denúncia diretamente à sua causa, e a exclamação final preserva a intensidade retórica.
