source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, οὐ μή με ἴδητε ἀπ’ ἄρτι ἕως ἂν εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
translation:
  language: pt
  text: 'Pois eu lhes digo: de agora em diante, vocês certamente não me verão até que digam[a]: “Bendito o que vem em nome do Senhor!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Citação ou alusão ao Salmo 118:26.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Pois eu lhes digo
  rationale: Preserva a força explicativa de γάρ e traduz naturalmente a fórmula de declaração direta com ὑμῖν.
- source_word: οὐ μή με ἴδητε
  choice: vocês certamente não me verão
  rationale: A combinação οὐ μή com o subjuntivo aoristo expressa negação enfática; “certamente não” mantém essa ênfase sem sugerir que a impossibilidade seja necessariamente eterna.
- source_word: ἀπ’ ἄρτι
  choice: de agora em diante
  rationale: Expressa com clareza um período que começa no momento presente.
- source_word: ἕως ἂν εἴπητε
  choice: até que digam
  rationale: Mantém o limite futuro ou contingente indicado por ἕως ἄν com o subjuntivo, sem definir quando ou como ele se cumprirá.
- source_word: Εὐλογημένος
  choice: Bendito
  rationale: Reproduz a forma tradicional e semanticamente adequada da aclamação bíblica, preservando sua ressonância com o Salmo 118:26.
- source_word: ὁ ἐρχόμενος
  choice: o que vem
  rationale: Representa naturalmente o particípio substantivado, sem reforçar indevidamente uma leitura titular específica.
- source_word: ἐν ὀνόματι κυρίου
  choice: em nome do Senhor
  rationale: Preserva a estrutura da expressão e sua cadência bíblica; κύριος é traduzido por “Senhor”.
theological_decisions:
- issue: Momento e sentido do futuro ato de ver e da aclamação
  choice: Manter a declaração como ausência enfática até uma futura aclamação, sem identificar o acontecimento preciso.
  alternative: Explicitar a entrada triunfal, a segunda vinda ou um futuro arrependimento de Israel.
  rationale: O texto grego não determina explicitamente qual acontecimento histórico ou escatológico está em vista; a tradução preserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural ὑμῖν e cadência bíblica natural na citação. A ênfase de οὐ μή foi incorporada no texto principal, por isso não exige nota lexical.
