id: MAT.23.13
reference: Matthew 23:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐαὶ ⸀δὲ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κλείετε τὴν βασιλείαν τῶν οὐρανῶν ἔμπροσθεν τῶν ἀνθρώπων· ὑμεῖς γὰρ οὐκ εἰσέρχεσθε, οὐδὲ τοὺς εἰσερχομένους ἀφίετε ⸀εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/013.yaml
  text: But woe to you[a], scribes and Pharisees, hypocrites! For you shut the kingdom of heaven before people; for you do not enter[c][b], nor do you allow those who are entering to enter.
translation:
  language: pt
  text: Mas ai de vocês, escribas e fariseus, hipócritas! Pois vocês fecham o Reino dos céus diante das pessoas; vocês mesmos não entram, nem deixam entrar os que estão entrando.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que tentam entrar”. O particípio grego pode indicar pessoas em processo de entrar ou que procuram entrar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: ai de vocês
  rationale: Preserva a força de denúncia profética de οὐαί em uma expressão portuguesa natural e solene.
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição com leve contraste, de modo compatível com a continuação da série de advertências.
- source_word: γραμματεῖς
  choice: escribas
  rationale: Termo tradicional e preciso para os especialistas na Lei neste contexto dos Evangelhos.
- source_word: Φαρισαῖοι
  choice: fariseus
  rationale: Forma consagrada em português para o nome do grupo.
- source_word: ὑποκριταί
  choice: hipócritas
  rationale: Comunica adequadamente a ideia contextual de fingimento moral e religioso.
- source_word: κλείετε
  choice: fecham
  rationale: Mantém a metáfora de impedir o acesso ao Reino e soa natural com o objeto direto em português.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: o Reino dos céus
  rationale: Preserva a expressão característica de Mateus e o plural formal do grego, em formulação consagrada e natural em português.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: diante das pessoas
  rationale: Conserva a imagem de uma entrada fechada diante de outros, sem restringir ἀνθρώπων ao sexo masculino.
- source_word: εἰσέρχεσθε
  choice: entram
  rationale: Expressa de modo direto a metáfora de acesso ao Reino.
- source_word: τοὺς εἰσερχομένους
  choice: os que estão entrando
  rationale: Mantém o aspecto presente do particípio e sua possível referência a pessoas em processo de entrar.
- source_word: ἀφίετε εἰσελθεῖν
  choice: deixam entrar
  rationale: Construção portuguesa natural que representa o sentido permissivo de ἀφίημι e conserva explicitamente o infinitivo 'entrar'.
theological_decisions:
- issue: Expressão mateana βασιλεία τῶν οὐρανῶν
  choice: o Reino dos céus
  alternative: o Reino do céu
  rationale: A escolha preserva a forma plural do grego e a expressão consagrada em português, sem pressupor uma distinção teológica em relação ao 'Reino de Deus'.
- issue: Aspecto de τοὺς εἰσερχομένους
  choice: os que estão entrando
  alternative: os que tentam entrar
  rationale: A tradução principal conserva a imagem de entrada em curso sem decidir se o particípio descreve entrada efetiva ou tentativa; a alternativa interpretativa é registrada em nota.
- issue: Referência genérica de ἀνθρώπων
  choice: pessoas
  alternative: seres humanos
  rationale: Representa a referência humana genérica sem sugerir que somente homens estejam em vista.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se os termos bíblicos reconhecíveis “escribas”, “fariseus” e “Reino dos céus”. A repetição do campo verbal “entram/entrar/entrando” reflete deliberadamente a insistência do grego, sem tornar a frase artificial.
