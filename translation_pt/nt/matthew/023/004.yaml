source:
  edition: SBLGNT
  text: δεσμεύουσιν ⸀δὲ φορτία ⸀βαρέα καὶ ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων, ⸂αὐτοὶ δὲ τῷ⸃ δακτύλῳ αὐτῶν οὐ θέλουσιν κινῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/004.yaml
  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: pt
  text: Eles amarram cargas pesadas e as colocam sobre os ombros das pessoas, mas eles mesmos não querem movê-las nem com um dedo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: amarram
  rationale: Expressa de modo natural o ato de prender ou atar as cargas, preservando a imagem concreta.
- source_word: φορτία βαρέα
  choice: cargas pesadas
  rationale: Mantém tanto a imagem literal de peso quanto a força metafórica de exigências opressivas.
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους
  choice: as colocam sobre os ombros
  rationale: Reproduz claramente a ação e conserva a imagem corporal do grego.
- source_word: τῶν ἀνθρώπων
  choice: das pessoas
  rationale: ἄνθρωποι tem aqui sentido genérico, referente aos seres humanos em geral; 'pessoas' comunica isso naturalmente em português moderno.
- source_word: αὐτοὶ δὲ
  choice: mas eles mesmos
  rationale: Preserva a ênfase do pronome e o contraste entre o que impõem aos outros e o que se recusam a fazer.
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: nem com um dedo
  rationale: Forma idiomática em português que conserva a imagem do mínimo esforço, sem alterar seu sentido.
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: não querem movê-las
  rationale: Mantém a ênfase de θέλω na vontade e traduz κινέω diretamente como 'mover', indicando recusa deliberada, não incapacidade.
theological_decisions:
- issue: Interpretação das cargas como literais ou metafóricas
  choice: Conservar a imagem concreta de 'cargas pesadas' sem explicitar seu referente.
  alternative: Explicá-las como exigências legais, regras religiosas ou obrigações impostas.
  rationale: O contexto aponta para obrigações opressivas impostas pelos escribas e fariseus, mas o versículo não identifica expressamente as cargas. Preservar a metáfora evita estreitar a interpretação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Pessoas' comunica sem ambiguidade o sentido humano genérico de ἀνθρώπων. A construção 'nem com um dedo' é idiomática e reforça naturalmente a ideia de que não fazem sequer o menor esforço.
