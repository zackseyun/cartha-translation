base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/024.yaml
  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: pt
  text: Guias cegos, que coam para retirar o mosquito[a], mas engolem o camelo!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “filtram para retirar o mosquito”. O verbo grego se refere a coar um líquido para remover uma impureza.'
    reason: alternativa lexical
lexical_decisions:
- source_word: ὁδηγοὶ
  choice: guias
  rationale: O substantivo designa quem conduz ou orienta outras pessoas. “Guias” preserva de modo natural a metáfora aplicada aos líderes religiosos.
- source_word: τυφλοί
  choice: cegos
  rationale: Mantém diretamente a imagem forte da incapacidade espiritual de perceber.
- source_word: οἱ διϋλίζοντες
  choice: que coam para retirar
  rationale: O verbo descreve o ato de passar um líquido por um coador ou filtro a fim de remover uma impureza. A formulação explicita em português que o inseto é retirado, não coado para passar adiante.
- source_word: τὸν κώνωπα
  choice: o mosquito
  rationale: κώνωψ designa um mosquito ou inseto pequeno semelhante. “Mosquito” é claro e corrente em português, e o artigo preserva o contraste proverbial com “o camelo”.
- source_word: τὴν δὲ κάμηλον
  choice: mas ... o camelo
  rationale: “Camelo” corresponde diretamente a κάμηλος, e “mas” expressa o contraste marcado por δέ.
- source_word: καταπίνοντες
  choice: engolem
  rationale: Traduz de forma direta e vívida a ação de engolir, preservando a hipérbole sem acrescentar tom coloquial.
theological_decisions:
- issue: Força metafórica da imagem de impureza ritual
  choice: Manter a imagem concreta de retirar um pequeno inseto ao coar e engolir um camelo.
  alternative: Interpretar explicitamente a imagem como contraste entre falhas pequenas e grandes.
  rationale: A repreensão depende da desproporção absurda entre o cuidado minucioso com uma impureza mínima e a aceitação de outra enorme. Preservar a imagem evita resolver em paráfrase a aplicação moral e religiosa do dito.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A estrutura vocativa e a imagem hiperbólica do grego foram preservadas.
