source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: pt
  text: Por isso, eis que envio a vocês profetas, sábios e mestres da Lei. Dentre eles, vocês matarão e crucificarão alguns; dentre eles, açoitarão alguns nas sinagogas de vocês e os perseguirão de cidade em cidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: vejam
  rationale: Preserva a chamada enfática à atenção em linguagem portuguesa atual e natural.
- source_word: γραμματεῖς
  choice: mestres da Lei
  rationale: No contexto judaico de Mateus, comunica ao leitor moderno a função de especialistas e instrutores nas Escrituras e na Lei, melhor do que o sentido profissional moderno de “escribas”.
- source_word: μαστιγώσετε
  choice: açoitarão
  rationale: Expressa com precisão a punição física por golpes, mantendo o registro digno do texto.
- source_word: διώξετε
  choice: perseguirão
  rationale: Mantém o sentido direto de perseguição continuada de um lugar para outro.
theological_decisions:
- issue: Identidade e autoridade daquele que envia
  choice: eu envio
  alternative: eu enviarei
  rationale: O presente grego ἀποστέλλω retrata o envio como ação declarada pelo próprio Jesus; a tradução mantém tempo e ênfase sem explicação doutrinária adicional.
- issue: Distribuição das ações entre os enviados
  choice: Alguns deles...; outros...
  alternative: Dentre eles... e dentre eles...
  rationale: Reproduz naturalmente os dois grupos introduzidos por ἐξ αὐτῶν, sem afirmar que sejam grupos necessariamente excludentes.
translation_notes:
  register: Português moderno, amplamente internacional, com boa legibilidade brasileira. O plural “vejam” concorda com os destinatários coletivos; “a vocês” evita regionalismo excessivo, e a repetição “de vocês” conserva a ênfase de “vossas sinagogas” sem tom arcaico.
