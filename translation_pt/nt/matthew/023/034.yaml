review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz corretamente a sequência de enviados, as quatro ações e os complementos espaciais. Contudo, a alternância «Alguns deles ...; outros ...» tende a apresentar os dois subconjuntos como distintos, enquanto as duas ocorrências de ἐξ αὐτῶν simplesmente retomam «dentre eles» e não exigem exclusão entre os grupos.
  naturalness: O texto é geralmente claro e contemporâneo. «Por isso, eis que» oferece uma correspondência mais idiomática e marcadamente enfática para διὰ τοῦτο ἰδού do que «Por isso, vejam:», sem recorrer a registro excessivamente arcaico.
  terminology: «Profetas, sábios e mestres da Lei» é uma representação aceitável de προφήτας καὶ σοφοὺς καὶ γραμματεῖς no contexto de Mateus. «Açoitarão» e «perseguirão» são precisos e adequados ao registro.
  issues:
  - severity: medium
    issue: «outros» após «Alguns deles»
    rationale: A redação pode comunicar que os açoitados e perseguidos necessariamente não são os mesmos que serão mortos e crucificados. O grego repete ἐξ αὐτῶν («dentre eles») sem estabelecer essa distinção excludente.
  - severity: low
    issue: «vejam» para ἰδού
    rationale: Embora compreensível, «Por isso, vejam:» soa menos integrado à construção declarativa. «Eis que» preserva a partícula de chamada de atenção e se encaixa naturalmente na frase.
  revised_text: Por isso, eis que envio a vocês profetas, sábios e mestres da Lei. Dentre eles, vocês matarão e crucificarão alguns; dentre eles, açoitarão alguns nas sinagogas de vocês e os perseguirão de cidade em cidade.
