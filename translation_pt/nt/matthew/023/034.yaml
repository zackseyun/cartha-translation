- from: 'Por isso, vejam: eu envio a vocês profetas, sábios e mestres da Lei. Alguns deles vocês matarão e crucificarão; outros vocês açoitarão nas sinagogas de vocês e perseguirão de cidade em cidade.'
  to: Por isso, eis que envio a vocês profetas, sábios e mestres da Lei. Dentre eles, vocês matarão e crucificarão alguns; dentre eles, açoitarão alguns nas sinagogas de vocês e os perseguirão de cidade em cidade.
