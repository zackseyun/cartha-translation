  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ὑμῶν ⸀ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/038.yaml
  text: Look[a], your house is left to you desolate.
translation:
  language: pt
  text: 'Vejam: a casa[a] de vocês lhes é deixada deserta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o templo de vocês»; a expressão «a casa de vocês» pode referir-se especificamente ao templo, embora o grego seja mais amplo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Vejam
  rationale: Emprega um chamado de atenção atual e solene, dirigido ao público plural, sem recorrer ao mais arcaizante «eis».
- source_word: ἀφίεται
  choice: é deixada
  rationale: Preserva a forma passiva e o aspecto de abandono sem explicitar um agente nem intensificar interpretativamente para «é destruída».
- source_word: ὑμῖν
  choice: lhes
  rationale: Mantém o dativo grego e a ideia de que a casa fica entregue a eles, embora a construção conserve certa abertura semântica.
- source_word: ὁ οἶκος ὑμῶν
  choice: a casa de vocês
  rationale: Traduz literalmente a expressão e evita restringir no texto principal sua referência ao templo, a Jerusalém ou à casa de Israel.
- source_word: ἔρημος
  choice: deserta
  rationale: Reproduz o sentido de abandono e desolação no contexto profético, mantendo a concordância com «casa».
theological_decisions:
- issue: Referente de «a casa de vocês»
  choice: Mantida a expressão ampla «a casa de vocês» no texto principal.
  alternative: «o templo de vocês», «Jerusalém» ou «a casa de Israel»
  rationale: O contexto aponta fortemente para Jerusalém e, em especial, para o templo, mas o grego diz apenas «casa». A formulação ampla preserva a força metafórica e a tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Vejam» funciona como chamado de atenção solene; «de vocês» evita tanto a ambiguidade regional de «vossa» quanto um registro excessivamente arcaico.
