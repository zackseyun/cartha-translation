  text: ἀμὴν λέγω ὑμῖν, ⸀ἥξει ⸂ταῦτα πάντα⸃ ἐπὶ τὴν γενεὰν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/036.yaml
  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: pt
  text: 'Em verdade lhes digo: todas estas coisas virão sobre esta geração[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “esta geração” também tem sido entendida como “estas pessoas” ou, de modo mais amplo, como uma geração incrédula; porém, o grego diz mais diretamente “esta geração”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Em verdade
  rationale: Na fórmula solene ἀμὴν λέγω ὑμῖν, introduz uma declaração enfática e autorizada. “Em verdade” preserva a dignidade e a força da expressão em português corrente.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Reproduz diretamente o verbo e o pronome dativo, com colocação natural em português e cadência solene.
- source_word: ἥξει
  choice: virão
  rationale: O futuro de ἥκω indica que as realidades mencionadas chegarão ou sobrevirão. A concordância no plural é natural em português com “todas estas coisas”.
- source_word: ταῦτα πάντα
  choice: todas estas coisas
  rationale: Mantém explicitamente o demonstrativo neutro plural e a ideia de totalidade, remetendo ao conjunto mencionado no contexto anterior.
- source_word: ἐπὶ
  choice: sobre
  rationale: Com acusativo, expressa aqui aquilo que vem sobre alguém; “sobre” preserva o tom solene sem acrescentar uma ideia de hostilidade não explicitada pela preposição.
- source_word: γενεὰν ταύτην
  choice: esta geração
  rationale: É a correspondência lexical mais direta e conserva aberta a discussão sobre o alcance do referente.
theological_decisions:
- issue: Referente de γενεὰν ταύτην (“esta geração”)
  choice: esta geração
  alternative: estas pessoas; uma geração incrédula mais ampla; este tempo
  rationale: A tradução mantém a formulação temporal e direta do grego, sem impor uma interpretação escatológica ou eclesiológica específica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A fórmula “Em verdade lhes digo” conserva a solenidade do dito sem soar excessivamente arcaica. O marcador [a] aparece imediatamente após a expressão a que se refere.
