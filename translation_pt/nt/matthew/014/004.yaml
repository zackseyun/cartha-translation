    issue: “ficar com ela” para ἔχειν αὐτήν
    rationale: A expressão portuguesa é semanticamente mais vaga e de registro mais coloquial que o original; pode denotar simplesmente namorar ou envolver-se com alguém. “Tê-la” conserva a expressão grega e deixa que o contexto determine sua referência conjugal.
  - severity: low
    issue: “vinha dizendo a ele”
    rationale: Embora defensável para o imperfeito, a construção é menos idiomática do que “lhe dizia”. O imperfeito simples em português pode comunicar a ação habitual, repetida ou em curso sem perda relevante.
