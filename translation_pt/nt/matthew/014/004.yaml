  verdict: revise
  source_fidelity: 'A tradução de γάρ, do imperfeito de ἔλεγεν e da construção impessoal com ἔξεστιν está em boa direção. Contudo, “ficar com ela” é mais amplo e coloquial: pode sugerir apenas um relacionamento amoroso ou encontro, enquanto ἔχειν αὐτήν, neste contexto matrimonial, mantém a noção de tê-la/retê-la como mulher. “Tê-la” preserva a formulação do grego sem explicitar além dele “como esposa”.'
  naturalness: “João vinha dizendo a ele” é compreensível, mas soa algo pesado. “João lhe dizia” expressa naturalmente o imperfeito em português e conserva a ideia de fala repetida ou continuada conforme o contexto. “Não lhe é permitido tê-la” é claro, moderno e suficientemente formal.
  terminology: “Não lhe é permitido” transmite adequadamente a força de permissibilidade/ilicitude de οὐκ ἔξεστίν, sem recorrer à formulação um pouco mais marcada “não lhe é lícito”. A substituição de “ficar com ela” por “tê-la” evita reduzir ou alterar o teor moral-jurídico da repreensão.
  issues:
