  text: 'Pois João lhe dizia: “Não lhe é permitido tê-la.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: vinha dizendo
  rationale: O imperfeito apresenta a fala como contínua ou repetida no passado; “vinha dizendo” expressa essa força de modo natural em português.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação do que foi narrado no contexto anterior.
- source_word: αὐτῷ
  choice: a ele
  rationale: Explicita o objeto indireto de λέγω sem inserir no texto o nome de Herodes.
- source_word: ὁ Ἰωάννης
  choice: João
  rationale: Reproduz a designação simples do texto grego; o contexto já identifica João.
- source_word: Οὐκ ἔξεστίν σοι
  choice: Não lhe é permitido
  rationale: Expressa a ideia de permissibilidade ou licitude de ἔξεστιν e mantém a censura moral-jurídica, em formulação portuguesa natural.
- source_word: ἔχειν αὐτήν
  choice: ficar com ela
  rationale: No contexto, ἔχειν diz respeito a manter a mulher como esposa ou companheira. “Ficar com ela” comunica esse sentido relacional em português atual sem acrescentar explicitamente “como esposa”.
theological_decisions:
- issue: Natureza da censura de João
  choice: “Não lhe é permitido ficar com ela”
  alternative: “Não lhe é lícito tê-la”
  rationale: A tradução preserva a proibição moral e legal expressa por ἔξεστιν, sem explicar além do texto qual norma está sendo invocada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vinha dizendo” preserva o aspecto durativo do imperfeito; “não lhe é permitido” evita o caráter mais arcaico de “não lhe é lícito”.
