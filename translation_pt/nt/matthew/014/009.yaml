  text: καὶ ⸂λυπηθεὶς ὁ βασιλεὺς διὰ⸃ τοὺς ὅρκους καὶ τοὺς συνανακειμένους ἐκέλευσεν δοθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: pt
  text: O rei ficou triste, mas, por causa dos juramentos que havia feito e dos que estavam à mesa com ele[a], ordenou que fosse dado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os que estavam reclinados à mesa com ele». O grego reflete a postura habitual nas refeições daquele período.'
    reason: cultural_note
  - marker: b
    text: O grego deixa implícito o objeto de «fosse dado»; trata-se do que foi pedido no contexto anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: ficou triste, mas
  rationale: O particípio aoristo passivo indica que o rei se entristeceu; a construção com «mas» expressa naturalmente o valor concessivo sugerido pelo contexto sem apagar a tensão entre sua tristeza e sua ordem.
- source_word: ὁ βασιλεὺς
  choice: O rei
  rationale: Tradução direta e contextualmente apropriada de βασιλεύς.
- source_word: διὰ τοὺς ὅρκους
  choice: por causa dos juramentos que havia feito
  rationale: διά com acusativo indica causa. A oração explicita de modo natural que eram juramentos feitos pelo próprio rei, informação clara no contexto.
- source_word: τοὺς συνανακειμένους
  choice: os que estavam à mesa com ele
  rationale: O particípio designa os que reclinavam juntos durante a refeição. A formulação preserva a cena social em português atual, enquanto a nota registra o costume antigo.
- source_word: ἐκέλευσεν
  choice: ordenou
  rationale: Equivalente conciso e digno para κελεύω, que significa mandar ou dar uma ordem.
- source_word: δοθῆναι
  choice: que fosse dado
  rationale: Preserva a forma passiva e deixa implícito o objeto, como no grego, remetendo ao pedido do contexto anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe foi ajustada para soar natural, preservando a concessão contextual, a causalidade dos juramentos, a referência aos demais convivas e a elipse do objeto no infinitivo passivo.
