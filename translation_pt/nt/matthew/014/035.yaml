translation:
  language: pt
  text: E, quando os homens daquele lugar o reconheceram, mandaram avisar toda aquela região vizinha[a] e trouxeram-lhe todos os que estavam doentes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «enviaram mensageiros por toda aquela região vizinha». O grego diz apenas «enviaram», sem declarar o objeto; «mandaram avisar» explicita o sentido exigido pelo português.'
