lexical_decisions:
- source_word: ἐπιγνόντες
  choice: reconheceram
  rationale: O particípio aoristo indica que os homens identificaram Jesus ao vê-lo; «reconheceram» expressa isso de modo natural no contexto narrativo.
- source_word: οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: os homens daquele lugar
  rationale: Mantém o sentido especificamente masculino de ἄνδρες e traduz τόπος como a localidade onde Jesus havia chegado.
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: enviaram por toda aquela região ao redor
  rationale: Preserva a ausência, no grego, de um objeto explícito para «enviaram», enquanto περίχωρος designa a área circundante. A nota esclarece as possibilidades implícitas.
- source_word: προσήνεγκαν αὐτῷ
  choice: trouxeram até ele
  rationale: No contexto, προσφέρω descreve levar pessoas a Jesus, não uma oferta cultual; «até ele» é claro e idiomático.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: todos os que estavam doentes
  rationale: κακῶς ἔχειν é uma expressão idiomática para estar doente ou passar mal; a formulação escolhida comunica o sentido com naturalidade.
