translation_notes:
  register: Português contemporâneo, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A construção principal conserva a elipse do grego em «enviaram», explicada em nota, sem resolver silenciosamente se foram enviados mensageiros ou um aviso.
