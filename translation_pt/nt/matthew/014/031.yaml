  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: pt
  text: 'Imediatamente, Jesus estendeu a mão, segurou-o e lhe disse: “Homem de pouca fé, por que você duvidou[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vacilou”. O verbo grego também pode indicar hesitação ou vacilação, além de dúvida.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Imediatamente
  rationale: Transmite com clareza a ação imediata e preserva a urgência narrativa.
- source_word: δὲ
  choice: —
  rationale: A partícula tem função continuativa ou levemente adversativa; omiti-la produz português natural sem perder a ligação contextual.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: estendeu a mão
  rationale: Mantém a imagem concreta e representa naturalmente a ação anterior expressa pelo particípio.
- source_word: ἐπελάβετο αὐτοῦ
  choice: segurou-o
  rationale: Expressa de modo conciso o ato de agarrar ou tomar alguém com firmeza, sem acrescentar detalhes sobre a maneira.
- source_word: λέγει αὐτῷ
  choice: lhe disse
  rationale: O pretérito é a forma mais natural na narrativa portuguesa, embora o grego empregue o presente histórico.
- source_word: Ὀλιγόπιστε
  choice: Homem de pouca fé
  rationale: Forma vocativa natural em português que preserva a ideia de fé deficiente, sem sugerir ausência total de fé.
- source_word: εἰς τί
  choice: por que
  rationale: Equivalente idiomático da expressão interrogativa neste contexto.
- source_word: ἐδίστασας
  choice: duvidou
  rationale: É uma tradução clara e conhecida; a nota preserva a possível nuance de hesitação ou vacilação.
theological_decisions:
- issue: Sentido de Ὀλιγόπιστε em relação a πίστις
  choice: Homem de pouca fé
  alternative: Você que tem pouca fé
  rationale: Mantém o foco na insuficiência da fé de Pedro, não em incredulidade total, falta de coragem ou deslealdade.
- issue: Amplitude semântica de ἐδίστασας
  choice: duvidou
  alternative: vacilou
  rationale: “Duvidou” comunica claramente o sentido principal no contexto, enquanto a nota registra que o termo também pode indicar hesitação ou vacilação.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A colocação pronominal é natural, e o tratamento por “você” torna a fala direta clara sem banalizá-la.
