id: MAT.14.32
reference: Matthew 14:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀ἀναβάντων αὐτῶν εἰς τὸ πλοῖον ἐκόπασεν ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/032.yaml
  text: And when they got into the boat[a], the wind ceased.
translation:
  language: pt
  text: E, quando eles entraram no barco[a], o vento cessou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “depois que eles subiram para o barco”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a ligação narrativa simples expressa por καί, sem acrescentar uma marca temporal mais interpretativa como “Então”.
- source_word: ἀναβάντων αὐτῶν
  choice: quando eles entraram
  rationale: O genitivo absoluto é expresso naturalmente em português por uma oração temporal. Embora ἀναβαίνω tenha o sentido básico de “subir”, junto de εἰς τὸ πλοῖον, neste contexto, “entraram” comunica de modo idiomático o embarque sem alterar a sequência narrativa.
- source_word: εἰς τὸ πλοῖον
  choice: no barco
  rationale: πλοῖον designa aqui a embarcação usada no mar da Galileia; “barco” é claro, atual e adequado ao porte da embarcação. Com o verbo “entraram”, a preposição εἰς é naturalmente representada pela contração “no” em português.
- source_word: ἐκόπασεν
  choice: cessou
  rationale: κοπάζω indica que o vento parou ou amainou. “Cessou” preserva a concisão e a força pontual do aoristo, sem introduzir uma ideia de processo gradual.
- source_word: ὁ ἄνεμος
  choice: o vento
  rationale: Tradução direta e natural do sujeito nominativo com artigo.
theological_decisions:
- issue: Implicação narrativa da autoridade de Jesus sobre a natureza
  choice: Relatar simplesmente que o vento cessou quando eles entraram no barco.
  alternative: Acrescentar linguagem interpretativa que destaque explicitamente uma intervenção milagrosa ou a autoridade de Jesus.
  rationale: O contexto permite perceber a relevância teológica do acontecimento, mas o versículo não explica diretamente a causa nem explicita essa interpretação. A tradução mantém a formulação narrativa e sua tensão sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Entraram no barco” é a formulação idiomática principal; a nota preserva o sentido mais formal de ἀναβαίνω e a anterioridade possível do particípio aoristo.
