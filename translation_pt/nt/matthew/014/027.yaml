source:
  edition: SBLGNT
  text: ⸀εὐθὺς δὲ ἐλάλησεν ⸂αὐτοῖς ὁ Ἰησοῦς⸃ λέγων· Θαρσεῖτε, ἐγώ εἰμι· μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: pt
  text: 'Mas Jesus lhes falou imediatamente: “Coragem! Sou eu.[a] Não tenham medo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Eu sou”. Aqui, o grego pode funcionar como simples autoidentificação, embora alguns percebam uma possível alusão à autoidentificação divina.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς δὲ
  choice: Mas ... imediatamente
  rationale: δὲ marca uma transição com leve contraste em relação ao medo dos discípulos no versículo anterior; εὐθύς expressa prontidão temporal, comunicada naturalmente por “imediatamente”.
- source_word: ἐλάλησεν αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: Jesus ... falou com eles
  rationale: A formulação portuguesa transmite naturalmente o ato de falar e introduz o discurso direto sem reproduzir o redundante “falou... dizendo”, desnecessário em português corrente.
- source_word: Θαρσεῖτε
  choice: Coragem!
  rationale: Forma exortativa plural, breve e idiomática, que comunica o chamado a recobrar o ânimo.
- source_word: ἐγώ εἰμι
  choice: Sou eu
  rationale: No contexto imediato, funciona naturalmente como autoidentificação de Jesus aos discípulos assustados. A nota preserva a forma mais literal e sua possível ressonância teológica.
- source_word: μὴ φοβεῖσθε
  choice: Não tenham medo
  rationale: Expressão corrente, clara e dirigida ao grupo, sem impor ao aspecto verbal o sentido mais específico de “parem de ter medo”.
theological_decisions:
- issue: Se ἐγώ εἰμι deve ser vertido apenas como autoidentificação ou como eco explícito da fórmula divina “Eu sou”
  choice: O texto principal traz “Sou eu”, o sentido contextual e idiomático.
  alternative: “Eu sou.”
  rationale: Jesus está tranquilizando os discípulos ao identificar-se. A nota conserva a tradução mais literal, permitindo que o leitor perceba uma possível ressonância da autoidentificação divina sem torná-la explícita além do que o grego exige.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Coragem!” mantém a força direta da exortação; a sintaxe evita o pouco natural “falou... dizendo”. O marcador [a] aparece imediatamente após a expressão a que se refere.
