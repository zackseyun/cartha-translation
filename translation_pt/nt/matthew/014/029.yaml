id: MAT.14.29
reference: Matthew 14:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: pt
  text: 'Ele disse: “Venha!” Então Pedro desceu do barco, andou sobre a água e foi em direção a Jesus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “e chegou até Jesus”. O grego também pode ser entendido como indicando chegada, embora a expressão destaque o movimento na direção de Jesus.
    reason: Tradução alternativa da construção ἦλθεν πρός, que pode indicar tanto movimento em direção a alguém quanto chegada até essa pessoa.
lexical_decisions:
- source_word: Ἐλθέ
  choice: Venha
  rationale: O imperativo aoristo de ἔρχομαι é uma convocação direta. “Venha” é conciso, natural e respeita a forma de tratamento adequada no diálogo.
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: desceu do barco
  rationale: O particípio καταβάς indica que Pedro desceu antes de andar sobre a água. A forma finita coordenada comunica essa sequência com naturalidade em português.
- source_word: πλοίου
  choice: barco
  rationale: No contexto do lago da Galileia, “barco” é o equivalente moderno e contextual de πλοῖον; “navio” sugeriria uma embarcação maior.
- source_word: περιεπάτησεν
  choice: andou
  rationale: Neste contexto, περιπατέω descreve simplesmente o ato de andar, sem exigir a ideia de começar a andar ou de caminhar de um lado para outro.
- source_word: ἐπὶ τὰ ὕδατα
  choice: sobre a água
  rationale: A expressão indica movimento sustentado sobre a superfície. O singular coletivo “água” é mais corrente em português moderno, embora o grego empregue o plural.
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: e foi em direção a Jesus
  rationale: πρός destaca o movimento na direção de Jesus sem afirmar inequivocamente que Pedro chegou até ele. “Foi” soa natural a partir da perspectiva narrativa e “em direção a” preserva essa nuance.
- source_word: δὲ
  choice: Então
  rationale: δέ funciona aqui como conectivo narrativo leve. “Então” liga naturalmente a ordem de Jesus à ação subsequente de Pedro, sem introduzir contraste indevido.
theological_decisions:
- issue: Extensão do movimento de Pedro em direção a Jesus
  choice: foi em direção a Jesus
  alternative: chegou até Jesus
  rationale: A construção ἦλθεν πρός pode ser entendida como chegada, mas πρός também realça a direção do movimento. A tradução escolhida preserva a progressão e a tensão da narrativa sem afirmar um ponto de chegada que a formulação grega não torna inequívoco.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala direta permanece breve e enfática; a narrativa evita construções participiais artificiais e conserva a sequência das ações.
