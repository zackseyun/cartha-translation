  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: pt
  text: 'Ao cair da tarde, os discípulos se aproximaram dele e disseram: “O lugar é deserto[a], e já está ficando tarde[b]. Mande as multidões embora, para que possam ir aos povoados e comprar comida para si.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Este é um lugar ermo.”'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “a hora já passou”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Ao cair da tarde
  rationale: A construção genitiva absoluta marca uma transição temporal. A formulação é natural em português e conserva o sentido de chegada da tarde; δέ funciona aqui como progressão narrativa, sem exigir um advérbio explícito como “então”.
- source_word: προσῆλθον αὐτῷ
  choice: se aproximaram dele
  rationale: προσέρχομαι significa aproximar-se ou chegar junto de alguém. “Se aproximaram dele” é claro e natural no contexto narrativo.
- source_word: οἱ μαθηταὶ
  choice: os discípulos
  rationale: O artigo identifica o grupo já conhecido. Não se acrescenta o possessivo “seus”, ausente do texto grego.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: O lugar é deserto
  rationale: ἔρημος descreve aqui um lugar ermo, pouco habitado ou afastado de povoações. “Deserto” preserva a concisão e não precisa indicar um deserto geográfico.
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: já está ficando tarde
  rationale: A expressão literalmente afirma que “a hora já passou”, mas no contexto indica que o dia está avançado. A tradução comunica esse sentido idiomático em português, enquanto a nota preserva a forma literal.
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: Mande as multidões embora
  rationale: ἀπολύω significa aqui despedir ou mandar embora. A escolha é direta, corrente e adequada ao pedido prático dos discípulos.
- source_word: ἵνα ἀπελθόντες
  choice: para que possam ir
  rationale: A combinação da oração de finalidade com o particípio expressa a ação pretendida. A formulação portuguesa integra naturalmente a sequência sem alterar sua finalidade.
- source_word: εἰς τὰς κώμας
  choice: aos povoados
  rationale: κώμη designa uma aldeia ou povoado. “Povoados” evita associações regionais indevidas e não acrescenta “próximos”, ideia apenas implícita no contexto.
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: comprar comida para si mesmas
  rationale: βρώματα significa alimentos ou comida, e “para si mesmas” conserva o valor reflexivo de ἑαυτοῖς, tendo “multidões” como referente gramatical.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A tradução emprega equivalência ótima: mantém a estrutura e os detalhes relevantes do grego, mas verte idiomaticamente a indicação de que o dia já estava avançado. Os marcadores das notas foram posicionados junto às expressões a que efetivamente se referem.'
