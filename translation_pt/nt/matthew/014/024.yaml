id: MAT.14.24
reference: Matthew 14:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸ δὲ πλοῖον ἤδη ⸂σταδίους πολλοὺς ἀπὸ τῆς γῆς ἀπεῖχεν⸃, βασανιζόμενον ὑπὸ τῶν κυμάτων, ἦν γὰρ ἐναντίος ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: pt
  text: Mas o barco já estava a muitos estádios de distância da terra[a][b], sendo açoitado pelas ondas[c], pois o vento era contrário.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «da margem». O grego diz literalmente «da terra».
    reason: lexical_alternative
  - marker: b
    text: O estádio era uma antiga unidade de distância, equivalente a cerca de 185 metros.
    reason: cultural_note
  - marker: c
    text: Ou «sendo sacudido violentamente pelas ondas».
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: barco
  rationale: No contexto da travessia do mar da Galileia, «barco» é o termo moderno mais natural e não sugere uma embarcação maior do que o contexto permite.
- source_word: ἤδη
  choice: já
  rationale: Expressa de modo direto que essa situação se havia estabelecido naquele ponto da narrativa.
- source_word: σταδίους πολλοὺς
  choice: muitos estádios
  rationale: Mantém no texto a antiga unidade de distância presente no grego, enquanto a nota explica seu valor aproximado.
- source_word: ἀπὸ τῆς γῆς ἀπεῖχεν
  choice: estava a muitos estádios de distância da terra
  rationale: Reproduz a relação espacial de ἀπέχω em português natural e conserva «terra» como correspondência transparente de γῆ.
- source_word: βασανιζόμενον
  choice: sendo açoitado
  rationale: No contexto marítimo, comunica a ação forte e contínua das ondas sobre o barco, preservando a intensidade do verbo sem lhe atribuir sofrimento psicológico.
- source_word: ὑπὸ τῶν κυμάτων
  choice: pelas ondas
  rationale: Tradução direta e idiomática do agente que atua sobre o barco.
- source_word: ἐναντίος
  choice: contrário
  rationale: Descreve naturalmente um vento adverso ao avanço do barco, sem precisar explicitar em português um complemento que o grego deixa implícito.
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição com leve contraste entre Jesus em terra e a difícil situação do barco.
- source_word: γάρ
  choice: pois
  rationale: 'Mantém de modo conciso a relação explicativa: o vento contrário explica por que as ondas açoitavam o barco.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A medida antiga foi preservada por transparência ao texto-fonte e explicada em nota.
