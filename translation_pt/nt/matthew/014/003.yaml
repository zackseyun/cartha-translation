  source_fidelity: A tradução transmite corretamente a relação explicativa de γάρ, a prisão de João, o ato de amarrá-lo, o encarceramento e o motivo ligado a Herodias. A identificação de Filipe como irmão de Herodes é preservada. Uma revisão leve melhora a explicitude do objeto de «colocado» e emprega «esposa», o sentido contextual inequívoco de γυναῖκα nesta construção relacional.
  naturalness: «Havia prendido João, amarrado-o e colocado na prisão» permite elipse do objeto, mas «e o colocado na prisão» torna a coordenação mais clara e natural. «Esposa de seu irmão Filipe» é claro em português internacional e mantém boa legibilidade brasileira.
  terminology: «Esposa» é preferível a «mulher» neste contexto, pois γυναῖκα significa especificamente a esposa de Filipe, sem acrescentar qualquer avaliação moral da relação. «Amarrado» e «prisão» são adequados e não especificam indevidamente o meio de contenção.
  issues:
