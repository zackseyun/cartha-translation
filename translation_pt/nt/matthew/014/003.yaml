    rationale: O grego repete αὐτόν após o verbo de amarrar e o sentido requer João também como objeto de «colocar na prisão». A explicitação por «o colocado» melhora a clareza sem alterar o sentido.
  - severity: low
    issue: «Mulher» é menos preciso que «esposa» na expressão relacional.
    rationale: Embora «mulher de» possa significar esposa em português, o contexto e a construção grega indicam especificamente que Herodias era esposa de Filipe. «Esposa» é mais inequívoco, sem antecipar o juízo do versículo seguinte.
