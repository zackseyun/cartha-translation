source:
  edition: SBLGNT
  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: pt
  text: Pois Herodes tinha prendido João[a], amarrado-o e o colocado na prisão por causa de Herodias, esposa de seu irmão Filipe,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «tendo agarrado João [...] o colocou na prisão».'
    reason: Registra uma alternativa mais formal para o particípio κρατήσας e para a construção de encarceramento.
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Preserva a função explicativa que liga o versículo ao contexto anterior e soa natural em português.
- source_word: κρατήσας
  choice: havia prendido
  rationale: Exprime como ação anterior o particípio aoristo e, no contexto de custódia, comunica melhor o sentido do que o literal «agarrado».
- source_word: ἔδησεν
  choice: amarrado-o
  rationale: Mantém o sentido concreto de prender com ligaduras sem especificar indevidamente correntes ou outro meio.
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: colocado na prisão
  rationale: Traduz de modo claro e idiomático a ação de encarcerar, conservando a sequência verbal do grego.
- source_word: διὰ Ἡρῳδιάδα
  choice: por causa de Herodias
  rationale: διά com acusativo expressa aqui causa ou motivo.
- source_word: γυναῖκα
  choice: mulher
  rationale: Neste contexto relacional, «mulher» pode significar esposa e preserva com naturalidade a identificação feita pelo texto.
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: de seu irmão Filipe
  rationale: Deixa claro, em ordem natural no português, que Filipe era irmão de Herodes.
theological_decisions:
- issue: Enquadramento histórico-moral da relação de Herodias com Filipe
  choice: «Herodias, mulher de seu irmão Filipe»
  alternative: «Herodias, esposa de seu irmão Filipe»
  rationale: A tradução identifica a relação sem antecipar explicitamente o juízo sobre sua ilegitimidade, que aparece no versículo seguinte. «Mulher» também preserva a leve amplitude lexical de γυνή, embora o contexto indique esposa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O mais-que-perfeito composto expressa naturalmente a anterioridade narrativa. A vírgula final foi preservada porque o versículo continua sintaticamente no versículo seguinte.
