base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: pt
  text: 'Mas Jesus lhes disse: “Eles não precisam ir embora; vocês mesmos deem algo para eles comerem.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca um contraste leve com a proposta anterior dos discípulos de mandar a multidão embora.
- source_word: Οὐ χρείαν ἔχουσιν ἀπελθεῖν
  choice: Eles não precisam ir embora
  rationale: Expressa de modo natural em português a construção idiomática ἔχω χρείαν seguida do infinitivo, preservando a referência plural à multidão.
- source_word: δότε αὐτοῖς
  choice: deem algo para eles
  rationale: O imperativo plural é mantido; “algo” é explicitado em português para completar naturalmente a construção com φαγεῖν.
- source_word: ὑμεῖς
  choice: vocês mesmos
  rationale: Preserva a ênfase do pronome pessoal explícito no grego, destacando os discípulos como os agentes da ordem.
- source_word: φαγεῖν
  choice: comerem
  rationale: 'O infinitivo aoristo de ἐσθίω indica a finalidade ou conteúdo daquilo que deve ser dado: algo para comer.'
theological_decisions:
- issue: Ênfase no papel dos discípulos na ordem de Jesus
  choice: vocês mesmos deem
  alternative: vocês deem
  rationale: A forma enfática traduz o pronome explícito ὑμεῖς sem acrescentar uma interpretação teológica à ordem.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ir embora” e “algo para eles comerem” são naturais na fala narrativa contemporânea; o ponto e vírgula conserva a ligação estreita entre a recusa da proposta dos discípulos e a ordem de Jesus.
