  text: Καὶ εὐθέως ⸀ἠνάγκασεν τοὺς μαθητὰς ἐμβῆναι ⸀εἰς πλοῖον καὶ προάγειν αὐτὸν εἰς τὸ πέραν, ἕως οὗ ἀπολύσῃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: pt
  text: E imediatamente ele obrigou os discípulos a entrar no barco e ir adiante dele para a outra margem, até que despedisse as multidões.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθέως
  choice: imediatamente
  rationale: Expressa de modo claro a prontidão e a rápida transição narrativa do advérbio grego.
- source_word: ἠνάγκασεν
  choice: obrigou
  rationale: Preserva a ideia de forte insistência ou constrangimento presente em ἀναγκάζω, sem acrescentar a noção de violência física.
- source_word: τοὺς μαθητάς
  choice: os discípulos
  rationale: Reproduz o artigo e identifica o grupo já conhecido, sem inserir o possessivo “seus”, que está apenas implícito no contexto.
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: a entrar no barco
  rationale: É uma formulação natural em português para o ato de embarcar; o artigo definido é apropriado porque o contexto aponta para um barco específico.
- source_word: προάγειν αὐτόν
  choice: ir adiante dele
  rationale: Mantém o sentido de partir antes de Jesus e seguir à sua frente, preservando αὐτόν como complemento.
- source_word: εἰς τὸ πέραν
  choice: para a outra margem
  rationale: Traduz naturalmente a expressão que designa o lado oposto do lago.
- source_word: ἕως οὗ ἀπολύσῃ
  choice: até que despedisse
  rationale: O subjuntivo em português conserva a perspectiva futura da ação em relação ao verbo principal.
- source_word: τοὺς ὄχλους
  choice: as multidões
  rationale: Mantém o plural explícito do grego e emprega vocabulário atual e compreensível.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com proximidade à estrutura do grego sem sacrificar a fluidez. O pronome “ele” evita acrescentar o nome de Jesus, não expresso neste versículo, e sua referência é fornecida pelo contexto.
