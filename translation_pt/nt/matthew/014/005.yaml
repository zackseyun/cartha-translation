  text: καὶ θέλων αὐτὸν ἀποκτεῖναι ἐφοβήθη τὸν ὄχλον, ὅτι ὡς προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/005.yaml
  text: And wanting to kill him[a], he feared the crowd[b], because they regarded him as a prophet.
translation:
  language: pt
  text: E, embora quisesse matá-lo,[a] teve medo da multidão, porque o consideravam um profeta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “E, querendo matá-lo, teve medo da multidão”. Neste contexto, o particípio pode ser entendido em sentido concessivo: “embora quisesse matá-lo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tinham-no como profeta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: embora quisesse
  rationale: 'O particípio expressa, no contexto, uma circunstância concessiva: apesar de querer matá-lo, ele não agiu por medo da multidão. A formulação é natural em português e explicita a relação contextual sem alterar o sentido.'
- source_word: ἀποκτεῖναι
  choice: matá-lo
  rationale: O infinitivo significa matar ou tirar a vida. “Matá-lo” é direto e não acrescenta a qualificação moral específica de “assassiná-lo”.
- source_word: ἐφοβήθη
  choice: teve medo
  rationale: Tradução corrente e clara de φοβέομαι no aoristo, mais natural no português moderno do que “temeu” neste contexto.
- source_word: τὸν ὄχλον
  choice: da multidão
  rationale: ὄχλος designa a massa de pessoas reunidas. “Multidão” preserva o sentido coletivo e o tom narrativo.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão do medo e é vertido pela conjunção causal mais clara em português contemporâneo.
- source_word: ὡς προφήτην
  choice: um profeta
  rationale: A construção indica a condição ou categoria em que João era considerado. O artigo indefinido é necessário para uma formulação portuguesa natural e não implica incerteza.
- source_word: αὐτὸν εἶχον
  choice: o consideravam
  rationale: ἔχω com predicativo pode significar ter alguém por algo ou considerá-lo como tal. “O consideravam” comunica o idioma grego com clareza e ampla legibilidade.
theological_decisions:
- issue: Identidade do sujeito e do objeto implícita no contexto narrativo grego
  choice: Manter as referências implícitas, sem inserir os nomes Herodes e João no texto do versículo
  alternative: Embora Herodes quisesse matar João, teve medo da multidão, porque ela o considerava um profeta.
  rationale: O grego emprega formas pronominais e depende do contexto imediato para identificar Herodes e João. Não acrescentar os nomes preserva a forma do texto-fonte e evita explicitação desnecessária.
- issue: Valor circunstancial do particípio θέλων
  choice: 'Entendê-lo concessivamente: “Embora quisesse”'
  alternative: 'Tradução mais formal: “E, querendo matá-lo, teve medo...”'
  rationale: O desejo de matar contrasta com o medo que impede a ação. A leitura concessiva torna essa relação contextual natural em português, enquanto a nota preserva a estrutura participial mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal em “matá-lo” é padrão e natural; “o consideravam” evita a formalidade de “consideravam-no”. A oração concessiva favorece fluidez sem ocultar a construção mais literal, registrada em nota.
