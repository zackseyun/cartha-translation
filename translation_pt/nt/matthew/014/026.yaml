id: MAT.14.26
reference: Matthew 14:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: pt
  text: 'Mas, quando os discípulos o viram andando sobre o mar, ficaram apavorados e disseram: “É um fantasma!”[a] E gritaram de medo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma aparição” ou “um espectro”.
    reason: Alternativas lexicais para φάντασμα, que descreve uma aparição percebida como sobrenatural.
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca uma leve transição contrastiva entre a aproximação de Jesus e a reação assustada dos discípulos.
- source_word: μαθηταὶ
  choice: os discípulos
  rationale: O artigo grego identifica um grupo definido; o contexto deixa claro que são os discípulos de Jesus.
- source_word: ἰδόντες αὐτόν
  choice: quando os discípulos o viram
  rationale: A oração temporal expressa com naturalidade o particípio aoristo e mantém a sequência da ação.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: andando sobre o mar
  rationale: Preserva a referência explícita ao mar e exprime que ele caminhava sobre sua superfície.
- source_word: ἐταράχθησαν
  choice: ficaram apavorados
  rationale: No contexto, a perturbação é intensa e vem acompanhada de medo e gritos; esta formulação comunica essa força sem alterar o sentido.
- source_word: λέγοντες
  choice: e disseram
  rationale: Integra de modo natural em português o particípio simultâneo que introduz a exclamação.
- source_word: Φάντασμά ἐστιν
  choice: É um fantasma!
  rationale: “Fantasma” é a equivalência moderna mais direta para a aparição sobrenatural que os discípulos julgaram estar vendo, sem endossar a conclusão deles.
- source_word: ἀπὸ τοῦ φόβου
  choice: de medo
  rationale: Expressa de forma concisa e idiomática a causa ou origem do grito.
- source_word: ἔκραξαν
  choice: gritaram
  rationale: Transmite o brado forte indicado por κράζω sem especificar além do que o texto afirma.
theological_decisions:
- issue: Natureza de φάντασμα na exclamação dos discípulos
  choice: fantasma
  alternative: aparição; espectro
  rationale: A frase relata a interpretação amedrontada e equivocada dos discípulos, não faz uma afirmação ontológica sobre espíritos. “Fantasma” mantém essa perspectiva narrativa em linguagem acessível.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Sobre o mar” acompanha de perto a formulação grega; “ficaram apavorados” reproduz a intensidade contextual de ἐταράχθησαν. O marcador da nota foi colocado após “fantasma”, termo ao qual a alternativa lexical se refere.
