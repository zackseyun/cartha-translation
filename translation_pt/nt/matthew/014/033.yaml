id: MAT.14.33
reference: Matthew 14:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ἐν τῷ ⸀πλοίῳ προσεκύνησαν αὐτῷ λέγοντες· Ἀληθῶς θεοῦ υἱὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: pt
  text: 'Então os que estavam no barco o adoraram[a], dizendo: “Verdadeiramente, você é o Filho de Deus.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se prostraram diante dele” ou “lhe prestaram homenagem”. O verbo grego pode indicar reverência expressa por ajoelhar-se ou prostrar-se; neste contexto, “adoraram” expressa melhor sua força.
    reason: lexical_alternative
  - marker: b
    text: Ou “você é Filho de Deus”. A expressão grega não traz artigo antes de “Deus”, mas, neste contexto, funciona como título, não como se significasse apenas “um filho de Deus”.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Então os que
  rationale: δέ é um conectivo leve; “Então” expressa com naturalidade a progressão narrativa, e οἱ é substantivado, referindo-se aos que estavam no barco.
- source_word: ἐν τῷ πλοίῳ
  choice: estavam no barco
  rationale: A explicitação idiomática de “estavam” produz português natural e preserva a localização indicada pela expressão grega.
- source_word: προσεκύνησαν αὐτῷ
  choice: o adoraram
  rationale: προσκυνέω pode indicar prostração, homenagem ou adoração. Neste contexto, após a autoridade de Jesus sobre o mar e junto da confissão seguinte, “adoraram” comunica melhor sua força provável.
- source_word: λέγοντες
  choice: dizendo
  rationale: O particípio é preservado de modo natural em português e introduz diretamente a fala.
- source_word: Ἀληθῶς
  choice: Verdadeiramente
  rationale: Expressa uma afirmação solene e mantém o tom confessional, sem a coloquialidade de “realmente”.
- source_word: θεοῦ υἱὸς
  choice: o Filho de Deus
  rationale: Embora θεοῦ não tenha artigo, a construção predicativa no contexto tem força definida ou qualitativa e funciona como título; a forma indefinida enfraqueceria a confissão.
- source_word: εἶ
  choice: você é
  rationale: A ordem é ajustada ao português corrente, com “você” oferecendo ampla legibilidade brasileira sem alterar o sentido.
theological_decisions:
- issue: Força de προσκυνέω dirigido a Jesus
  choice: o adoraram
  alternative: se prostraram diante dele / lhe prestaram homenagem
  rationale: O campo semântico inclui prostração e homenagem, mas a manifestação de autoridade sobre o mar e a confissão de Jesus como Filho de Deus favorecem “adoraram”. A nota preserva a amplitude lexical genuína.
- issue: Definitude de θεοῦ υἱὸς
  choice: o Filho de Deus
  alternative: Filho de Deus / um filho de Deus
  rationale: A ausência do artigo no grego não torna automaticamente a expressão indefinida. Neste contexto mateano, ela funciona como título e predicação qualitativa/definida; ainda assim, a nota registra a forma alternativa natural “Filho de Deus”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Verdadeiramente” mantém o peso solene da confissão; “você” evita uma inversão artificial e soa natural no discurso direto. Todos os marcadores de nota aparecem no texto principal.
