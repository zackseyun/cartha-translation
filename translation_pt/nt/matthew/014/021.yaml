source:
  edition: SBLGNT
  text: οἱ δὲ ἐσθίοντες ἦσαν ἄνδρες ὡσεὶ πεντακισχίλιοι χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: pt
  text: Os que comeram eram cerca de cinco mil homens, sem contar as mulheres e as crianças.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “além das mulheres e das crianças”.'
    reason: Alternativa lexical para χωρὶς, que pode ser expresso de modo mais literal por “além de”, embora “sem contar” deixe mais claro que elas não estão incluídas nos cinco mil.
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: Os que comeram
  rationale: O particípio presente substantivado designa os que participaram da refeição. A formulação é natural em português e não força uma distinção aspectual. O δέ funciona como transição narrativa leve e não precisa de equivalente explícito neste contexto.
- source_word: ἦσαν
  choice: eram
  rationale: O imperfeito de εἰμί forma aqui uma declaração copulativa simples sobre o número dos que comeram; “eram” é o equivalente natural.
- source_word: ἄνδρες
  choice: homens
  rationale: ἀνήρ se refere especificamente a pessoas do sexo masculino, e não a pessoas em geral; a menção separada de mulheres e crianças confirma essa distinção.
- source_word: ὡσεὶ πεντακισχίλιοι
  choice: cerca de cinco mil
  rationale: ὡσεί indica aproximação, expressa com naturalidade por “cerca de”, enquanto πεντακισχίλιοι fornece o número “cinco mil”.
- source_word: χωρὶς γυναικῶν καὶ παιδίων
  choice: sem contar as mulheres e as crianças
  rationale: χωρίς com o genitivo indica que mulheres e crianças não estão incluídas no total mencionado. “Sem contar” torna essa relação inequívoca e corrente em português.
theological_decisions:
- issue: Termo de contagem específico para homens numa multidão mista
  choice: Traduzir ἄνδρες por “homens” e conservar a exclusão explícita de mulheres e crianças do número indicado.
  alternative: Traduzir ἄνδρες por “pessoas” ou “indivíduos”.
  rationale: O grego conta especificamente os homens e depois menciona mulheres e crianças separadamente. Usar um termo genérico apagaria uma distinção lexical e histórico-social presente no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os artigos em “as mulheres e as crianças” dão naturalidade à frase sem acrescentar uma delimitação ausente do contexto. A nota foi colocada após a expressão a que se refere.
