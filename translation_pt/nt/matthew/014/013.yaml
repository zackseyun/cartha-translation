  source_fidelity: A tradução transmite adequadamente a retirada de Jesus, o transporte de barco, o lugar isolado, a privacidade, o seguimento das multidões a pé e a origem nas cidades. Contudo, a segunda ocorrência de ἀκούσαντες fica excessivamente elíptica em “quando as multidões souberam”; em português, a retomada de “disso” torna explícito o conteúdo que o grego deixa dependente do contexto. A nota lexical para ἔρημον τόπον, presente na trilha de auditoria inglesa, também deve ser preservada.
  naturalness: “Retirou-se”, “de barco”, “a sós”, “multidões” e “a pé” são naturais e adequados ao registro. “Quando as multidões souberam disso” é mais fluente e completo do que “quando as multidões souberam”.
  terminology: “Lugar deserto” é uma equivalência bíblica corrente e aceitável para ἔρημον τόπον, desde que a nota esclareça que não exige um deserto arenoso. “Cidades” para πόλεων é defensável; a alternativa “povoações” deve permanecer em nota. “Partindo das cidades” comunica bem a procedência do deslocamento.
