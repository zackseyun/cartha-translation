  - severity: medium
    issue: Falta a nota lexical correspondente a ἔρημον τόπον.
    rationale: A trilha de auditoria inglesa registra a ambiguidade de “desolate place”; “lugar deserto” pode ser entendido como deserto geográfico em português. Uma nota breve preserva o sentido de lugar isolado ou desabitado.
