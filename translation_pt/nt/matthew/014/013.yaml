reference: Matthew 14:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: pt
  text: Quando Jesus soube disso, retirou-se dali de barco para um lugar deserto[a], a sós. Mas, quando as multidões souberam disso, seguiram-no a pé, partindo das cidades.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lugar desabitado” ou “lugar isolado”. O grego descreve uma área isolada ou pouco habitada, não necessariamente um deserto arenoso.
    reason: lexical_alternative
  - marker: b
    text: Ou “povoações”. A palavra grega pode designar cidades ou localidades menores, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ
  choice: Quando Jesus soube
  rationale: O particípio aoristo tem valor temporal; δέ introduz o desenvolvimento narrativo sem exigir um conectivo forte em português.
- source_word: ἀνεχώρησεν
  choice: retirou-se
  rationale: Preserva a ideia de afastamento ou retirada sem definir o motivo de Jesus.
- source_word: ἐν πλοίῳ
  choice: de barco
  rationale: Expressão natural em português para o meio de transporte.
- source_word: εἰς ἔρημον τόπον
  choice: para um lugar deserto
  rationale: Aqui, ἔρημος indica sobretudo um lugar isolado ou desabitado, não necessariamente um deserto arenoso.
- source_word: κατ’ ἰδίαν
  choice: a sós
  rationale: Comunica de modo conciso que Jesus buscou estar separado dos outros, sem afirmar que não havia ninguém com ele no barco.
- source_word: οἱ ὄχλοι
  choice: as multidões
  rationale: Mantém o plural do grego em linguagem portuguesa corrente e digna.
- source_word: πεζῇ
  choice: a pé
  rationale: Equivalente direto e idiomático do modo de deslocamento.
- source_word: ἀπὸ τῶν πόλεων
  choice: partindo das cidades
  rationale: πόλις pode designar cidades ou povoações; 'cidades' é a equivalência portuguesa usual, enquanto 'partindo' esclarece a relação espacial sem alterar o sentido.
theological_decisions:
- issue: Motivo da retirada de Jesus
  choice: Traduzir ἀνεχώρησεν por “retirou-se” sem declarar seu motivo.
  alternative: Explicitar que Jesus fugiu por segurança, buscou o luto ou se retirou para orar.
  rationale: O versículo relaciona a retirada ao que Jesus ouviu, mas não especifica sua motivação; a tradução preserva essa abertura interpretativa.
- issue: Sentido de κατ’ ἰδίαν
  choice: “a sós” como propósito ou caráter da retirada.
  alternative: “sozinho”, entendido de modo absoluto.
  rationale: A expressão indica privacidade ou separação; não obriga a concluir que Jesus viajou sem discípulos ou acompanhantes.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada no fim para evitar a leitura equivocada de que as cidades foram percorridas a pé. “Lugar deserto” conserva a formulação bíblica corrente, entendida como lugar isolado ou desabitado.
