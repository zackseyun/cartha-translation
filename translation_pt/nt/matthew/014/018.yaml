  rationale: Conjunção adversativa leve que expressa naturalmente o contraste entre a objeção dos discípulos e a resposta de Jesus.
- source_word: εἶπεν
  choice: ele disse
  rationale: Tradução direta do aoristo de λέγω, sem acrescentar ao verbo uma nuance de ordem.
- source_word: Φέρετέ
  choice: Tragam
  rationale: Imperativo presente ativo na segunda pessoa do plural; “tragam” comunica de modo natural a ordem dirigida aos discípulos.
- source_word: μοι
  choice: para mim
  rationale: Expressa de modo idiomático o dativo e mantém o foco pessoal da ordem em Jesus.
- source_word: ὧδε
  choice: aqui
  rationale: Preserva diretamente o sentido espacial do advérbio.
- source_word: αὐτούς
  choice: -nos
  rationale: O pronome masculino plural retoma contextualmente os pães e os peixes; a forma pronominal evita explicitação desnecessária no texto principal.
