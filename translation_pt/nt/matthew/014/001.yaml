lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Naquele tempo
  rationale: Expressão temporal idiomática, natural em português e fiel ao sentido do grego.
- source_word: ἤκουσεν
  choice: ouviu
  rationale: Reproduz diretamente o aoristo de ἀκούω; em conjunto com τὴν ἀκοὴν, a expressão portuguesa natural é “ouviu falar”.
- source_word: Ἡρῴδης
  choice: Herodes
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ὁ τετραάρχης
  choice: o tetrarca
  rationale: Mantém o título político específico e sua precisão histórica, sem o substituir por uma paráfrase.
- source_word: τὴν ἀκοὴν Ἰησοῦ
  choice: falar de Jesus
  rationale: Neste contexto, ἀκοή designa aquilo que se ouve, isto é, notícias ou relatos. A locução “ouvir falar de” comunica isso de modo corrente e conciso em português.
