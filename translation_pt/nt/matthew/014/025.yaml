source:
  edition: SBLGNT
  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: pt
  text: Na quarta vigília da noite[b], Jesus foi até eles, caminhando sobre o mar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “caminhando por cima do mar”. Alguns entendem a expressão como “caminhando à beira do mar”, mas o contexto favorece fortemente o deslocamento sobre a própria água.'
    reason: alternative_reading
  - marker: b
    text: A “quarta vigília da noite” era a última vigília, aproximadamente entre três e seis horas da manhã, segundo o sistema romano.
    reason: cultural_note
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: Na quarta vigília da noite
  rationale: O dativo tem valor temporal. “Vigília” preserva a divisão histórica da noite, enquanto a nota esclarece o horário aproximado.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: A partícula faz uma transição narrativa leve; em português, a progressão é natural sem acrescentar “e” ou “então”.
- source_word: ἦλθεν πρὸς αὐτούς
  choice: Jesus foi até eles
  rationale: A construção indica movimento em direção aos discípulos. “Foi até eles” é idiomático em português e evita a estranheza dêitica de “veio até eles” neste contexto isolado. O sujeito “Jesus” é explicitado para clareza, pois está implícito no verbo grego e é identificado pelo contexto.
- source_word: περιπατῶν
  choice: caminhando
  rationale: O particípio presente exprime uma ação simultânea à do verbo principal e é naturalmente reproduzido pelo gerúndio.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: sobre o mar
  rationale: Com o verbo de caminhar, a expressão indica deslocamento sobre a superfície da água. “Mar” mantém a forma lexical de θάλασσα; “sobre” comunica com clareza o sentido contextual.
theological_decisions:
- issue: Descrição milagrosa do deslocamento de Jesus sobre a água
  choice: caminhando sobre o mar
  alternative: caminhando à beira do mar
  rationale: A sintaxe e o contexto favorecem fortemente o deslocamento sobre a água. A tradução conserva o sentido direto e a força milagrosa do relato sem acrescentar explicações ao texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vigília” preserva o contexto histórico e é explicada em nota; “foi até eles” soa natural em narrativa portuguesa. Os marcadores aparecem junto às expressões que esclarecem.
