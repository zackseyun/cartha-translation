  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, εἰ σὺ εἶ, κέλευσόν με ⸂ἐλθεῖν πρὸς σὲ⸃ ἐπὶ τὰ ὕδατα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: pt
  text: 'Pedro, porém, lhe respondeu: “Senhor, se és tu, manda-me ir até ti sobre as águas[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre a água”. O grego traz “águas”, no plural.'
    reason: Registra a alternativa idiomática no singular enquanto explica que o texto grego emprega o plural.
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ
  choice: porém, lhe respondeu
  rationale: A construção é uma fórmula narrativa comum. “Porém” mantém a conexão levemente contrastiva de δέ, enquanto “lhe respondeu” expressa naturalmente em português o particípio ἀποκριθείς com seu objeto dativo.
- source_word: ὁ Πέτρος
  choice: Pedro
  rationale: Forma tradicional e amplamente reconhecida do nome pessoal em português.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva tanto o tratamento respeitoso quanto o possível peso cristológico de κύριος, sem reduzi-lo a mera cortesia.
- source_word: εἰ σὺ εἶ
  choice: se és tu
  rationale: 'Expressa de modo natural a identificação pessoal em questão: Pedro pergunta se a figura é realmente Jesus.'
- source_word: κέλευσόν
  choice: manda-me
  rationale: O imperativo de κελεύω indica uma ordem autorizada. “Manda” é claro e natural, preservando a força do verbo sem soar excessivamente formal.
- source_word: με ἐλθεῖν πρὸς σὲ
  choice: ir até ti
  rationale: Em português, do ponto de vista de Pedro, “ir até ti” é natural para o movimento em direção a Jesus e traduz conjuntamente o infinitivo com πρὸς σέ.
- source_word: ἐπὶ τὰ ὕδατα
  choice: sobre as águas
  rationale: Mantém o plural explícito do grego τὰ ὕδατα e a imagem vívida da cena; a forma singular, mais idiomática em alguns contextos, é registrada em nota.
theological_decisions:
- issue: Força do tratamento κύριε dirigido a Jesus
  choice: Senhor
  alternative: Mestre; senhor como simples tratamento cortês
  rationale: Em Mateus, κύριος dirigido a Jesus pode carregar mais do que mera polidez. “Senhor” conserva essa possibilidade teológica sem determinar além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Conservou-se “ti” por combinar naturalmente com “Senhor” e evitar regionalizar a fala com “você”; “ir até ti” oferece fluidez contemporânea sem perder a direção indicada pelo grego.
