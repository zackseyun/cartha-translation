  text: ἡ δὲ προβιβασθεῖσα ὑπὸ τῆς μητρὸς αὐτῆς· Δός μοι, φησίν, ὧδε ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: pt
  text: 'Ela, porém, induzida por sua mãe, diz: “Dê-me aqui, numa bandeja, a cabeça de João, o Batizador[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, conforme a forma tradicional, “João Batista”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: induzida
  rationale: Expressa a influência prévia exercida pela mãe sobre a jovem, preservando a voz passiva sem especificar além do texto se houve instrução formal ou insistência.
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: por sua mãe
  rationale: Ὑπό com genitivo identifica o agente da construção passiva; “por sua mãe” é a forma direta e natural em português.
- source_word: Δός μοι
  choice: Dê-me
  rationale: Reproduz de modo natural o imperativo aoristo e mantém a ordem direta da exigência.
- source_word: φησίν
  choice: diz
  rationale: Mantém o presente histórico grego e sua vivacidade narrativa.
- source_word: ὧδε
  choice: aqui
  rationale: Preserva o valor dêitico do advérbio, que destaca o lugar e possivelmente a imediatidade do pedido.
- source_word: ἐπὶ πίνακι
  choice: numa bandeja
  rationale: No contexto do banquete, πίναξ designa uma travessa ou bandeja de servir; “bandeja” é clara e corrente em português.
- source_word: τὴν κεφαλὴν
  choice: a cabeça
  rationale: Tradução direta que conserva a especificidade brutal da narrativa.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: João, o Batizador
  rationale: “Batizador” conserva a força descritiva do substantivo grego de agente, enquanto a forma tradicional é registrada em nota.
theological_decisions:
- issue: Tradução do título βαπτιστής de João
  choice: João, o Batizador
  alternative: João Batista
  rationale: O grego apresenta um título ligado à atividade de João. “O Batizador” torna esse sentido transparente; “João Batista”, consagrado pela tradição e mais familiar aos leitores, permanece como alternativa em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O presente histórico “diz” preserva a vivacidade do grego; “numa bandeja” soa natural no contexto de um banquete.
