  text: Por isso, ele prometeu sob juramento dar a ela tudo o que pedisse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “qualquer coisa que ela pedisse”. O grego emprega uma oração relativa indefinida (ὃ ἐὰν αἰτήσηται), que expressa um pedido futuro em aberto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Por isso
  rationale: Introduz a consequência do contexto anterior e preserva de modo natural a força inferencial e resultativa.
- source_word: μετὰ ὅρκου
  choice: sob juramento
  rationale: Expressa que a promessa foi feita mediante juramento; é uma formulação corrente, clara e digna em português.
- source_word: ὡμολόγησεν
  choice: prometeu
  rationale: Neste contexto, o verbo indica assumir um compromisso firme, não confessar; “prometeu” combina naturalmente com o infinitivo seguinte.
- source_word: αὐτῇ
  choice: a ela
  rationale: Mantém explícito o objeto indireto feminino e evita possível ambiguidade na sequência da frase.
- source_word: δοῦναι
  choice: dar
  rationale: Reproduz diretamente o infinitivo que expressa o conteúdo da promessa.
- source_word: ὃ ἐὰν αἰτήσηται
  choice: tudo o que pedisse
  rationale: A construção relativa indefinida com ἐάν e subjuntivo apresenta um pedido futuro em aberto; o imperfeito do subjuntivo é a forma portuguesa natural após a promessa no passado.
