  yaml_path: translation/nt/matthew/014/017.yaml
  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: pt
  text: 'Mas eles lhe disseram: “Aqui só temos cinco pães e dois peixes.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mas eles
  rationale: O artigo retoma os discípulos como sujeito, e δέ introduz um contraste leve com a instrução anterior de Jesus.
- source_word: λέγουσιν αὐτῷ
  choice: lhe disseram
  rationale: Embora o grego use o presente histórico, o pretérito é mais natural na narrativa em português; o pronome dativo expressa de modo claro o destinatário.
- source_word: Οὐκ ἔχομεν ὧδε εἰ μὴ
  choice: Aqui só temos
  rationale: A formulação positiva com “só” comunica naturalmente em português a construção grega negativa seguida de εἰ μή, sem alterar seu sentido exclusivo.
- source_word: πέντε ἄρτους
  choice: cinco pães
  rationale: Em português, “pães” é a forma comum e contextual para unidades de pão, sem necessidade de acrescentar “pedaços” ou “filões”.
- source_word: δύο ἰχθύας
  choice: dois peixes
  rationale: Tradução direta e corrente do plural grego.
