  to: E, depois de mandar que as multidões se acomodassem na relva, tomou os cinco pães e os dois peixes, ergueu os olhos para o céu, abençoou[a] e, tendo partido os pães, deu-os aos discípulos, e os discípulos os deram às multidões.
