id: MAT.14.19
reference: Matthew 14:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: pt
  text: E, depois de mandar que as multidões se acomodassem na relva, tomou os cinco pães e os dois peixes, ergueu os olhos para o céu, abençoou[a] e, tendo partido os pães, deu-os aos discípulos, e os discípulos os deram às multidões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz simplesmente «abençoou», sem indicar explicitamente o objeto. Pode referir-se a bendizer a Deus ou a abençoar os pães e os peixes.
    reason: Preserva a ambiguidade do objeto não expresso de εὐλόγησεν.
lexical_decisions:
- source_word: κελεύσας
  choice: depois de mandar
  rationale: Expressa a ordem e a anterioridade do particípio aoristo em português narrativo natural.
- source_word: τοὺς ὄχλους
  choice: as multidões
  rationale: Preserva o plural e corresponde de modo corrente aos grupos reunidos.
- source_word: ἀνακλιθῆναι
  choice: se acomodassem
  rationale: Comunica a ideia de tomar posição reclinada para comer sem sugerir, no português atual, que todos devessem literalmente deitar-se.
- source_word: ἐπὶ τοῦ χόρτου
  choice: na relva
  rationale: Indica o lugar de modo conciso, sem acrescentar a ideia de relva verde, ausente em Mateus.
- source_word: λαβὼν
  choice: tomou
  rationale: Transforma o particípio em verbo finito para dar fluidez narrativa, mantendo a sequência da ação.
- source_word: τοὺς πέντε ἄρτους
  choice: os cinco pães
  rationale: Em português, pães é a forma idiomática e suficientemente concreta para os pães inteiros do relato.
- source_word: τοὺς δύο ἰχθύας
  choice: os dois peixes
  rationale: Equivalência direta e natural do plural no contexto.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: ergueu os olhos para o céu
  rationale: Expressão portuguesa natural que preserva tanto o gesto de olhar para cima quanto sua direção.
- source_word: εὐλόγησεν
  choice: pronunciou a bênção
  rationale: Mantém o objeto não declarado e representa o uso idiomático no contexto de uma refeição, evitando decidir se Jesus abençoou Deus ou os alimentos.
- source_word: κλάσας
  choice: tendo partido os pães
  rationale: Mantém a ação anterior à entrega e explicita o objeto implícito a partir do contexto imediato.
- source_word: ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους
  choice: deu-os aos discípulos
  rationale: O pronome retoma os pães partidos e evita repetição desnecessária.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: e os discípulos os deram às multidões
  rationale: Explicita em português o verbo elíptico no grego para garantir clareza.
theological_decisions:
- issue: Objeto de εὐλόγησεν
  choice: pronunciou a bênção
  alternative: abençoou Deus / abençoou os pães e os peixes
  rationale: O grego não declara o objeto. A formulação escolhida preserva essa indeterminação em vez de atribuir explicitamente a bênção a Deus ou aos alimentos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Relva” preserva a referência à vegetação sem importar o adjetivo “verde”; “se acomodassem” comunica naturalmente a postura de refeição antiga.
