    text: 'Ou: «desembarcaram em Genesaré». O grego combina «sobre a terra» com «para dentro de Genesaré», indicando a chegada à terra ou à margem na região de Genesaré.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπεράσαντες
  choice: depois de atravessarem
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal. A formulação preserva a ideia de travessia, natural no contexto da viagem de barco, sem explicitar além do texto o meio ou o ponto de partida.
- source_word: ἦλθον
  choice: chegaram
  rationale: Neste contexto de deslocamento até um destino, «chegaram» expressa de modo natural o sentido de ἔρχομαι e combina bem com a locução seguinte.
- source_word: ἐπὶ τὴν γῆν
  choice: à terra
  rationale: A expressão significa literalmente «sobre/para a terra». «À terra» comunica a chegada desde a água sem substituir γῆ de maneira interpretativa por «margem».
- source_word: εἰς Γεννησαρέτ
  choice: de Genesaré
  rationale: Em combinação com ἐπὶ τὴν γῆν, a expressão identifica Genesaré como a região à qual pertencia a terra alcançada. A nota preserva a construção grega menos regular e sua possível representação alternativa.
- source_word: Γεννησαρέτ
  choice: Genesaré
  rationale: Forma tradicional e amplamente reconhecível em português para o topônimo grego Γεννησαρέτ.
