id: MAT.14.12
reference: Matthew 14:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: pt
  text: E os discípulos dele vieram, levaram o corpo[a] e o sepultaram; depois foram contar a Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cadáver”. A palavra grega designa um corpo morto.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: vieram
  rationale: O particípio aoristo introduz a ação dos discípulos após a morte de João. “Vieram” é natural no contexto e evita a formalidade desnecessária de “aproximaram-se”.
- source_word: μαθηταὶ αὐτοῦ
  choice: os discípulos dele
  rationale: Refere-se, pelo contexto imediato, aos discípulos de João Batista. “Discípulos” preserva a nuance relacional e formativa de μαθηταί; “dele” mantém a referência pronominal do grego sem substituir o antecedente pelo nome.
- source_word: ἦραν
  choice: levaram
  rationale: Embora αἴρω possa significar levantar ou pegar, no contexto do sepultamento indica que tomaram o corpo para transportá-lo. “Levaram” expressa isso naturalmente sem acrescentar detalhes.
- source_word: πτῶμα
  choice: corpo
  rationale: πτῶμα designa especificamente um corpo morto. “Corpo” é digno e natural na narrativa, enquanto a nota preserva a força lexical explícita de “cadáver”.
- source_word: ἔθαψαν αὐτόν
  choice: o sepultaram
  rationale: θάπτω significa sepultar ou enterrar. “O sepultaram” é direto, digno e não introduz a ideia de um túmulo, ausente no versículo.
- source_word: ἐλθόντες
  choice: depois foram
  rationale: O particípio assinala movimento e a ação seguinte. “Depois foram” apresenta de modo natural, em português, a sequência narrativa.
- source_word: ἀπήγγειλαν
  choice: contar
  rationale: ἀπαγγέλλω significa relatar, comunicar ou anunciar. Na construção “foram contar a Jesus”, o português permite deixar implícito o conteúdo da notícia, assim como o grego.
- source_word: τῷ Ἰησοῦ
  choice: a Jesus
  rationale: “Jesus” é a forma portuguesa tradicional e amplamente reconhecida de Ἰησοῦς.
theological_decisions:
- issue: Identidade de “os discípulos dele”
  choice: A expressão é mantida pronominalmente e, no contexto, refere-se aos discípulos de João Batista.
  alternative: Explicitar “os discípulos de João” ou entender a expressão como referência aos discípulos de Jesus.
  rationale: O contexto imediato trata da morte e do sepultamento de João Batista, tornando João o antecedente natural de αὐτοῦ. Manter “dele” preserva a forma e a coesão do grego sem resolver o referente dentro do próprio texto por explicitação.
translation_notes:
  register: Português moderno, corrente e digno, com boa legibilidade brasileira e compreensão internacional. “Sepultaram” mantém o tom narrativo respeitoso; “foram contar” evita uma formulação excessivamente formal.
