source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: pt
  text: Depois de dispensar as multidões, ele subiu ao monte, a sós[a], para orar. Ao cair da tarde, estava ali sozinho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em particular” (κατ’ ἰδίαν).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσας
  choice: Depois de dispensar
  rationale: O particípio aoristo indica uma ação anterior à subida. “Dispensar” comunica naturalmente que Jesus mandou as pessoas embora, sem acrescentar uma ideia de rejeição.
- source_word: τοὺς ὄχλους
  choice: as multidões
  rationale: Preserva o plural do grego e designa de modo claro os grupos de pessoas reunidas.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: subiu ao monte
  rationale: Expressa de forma idiomática o movimento ascendente em direção à região elevada, mantendo a referência topográfica.
- source_word: κατ’ ἰδίαν
  choice: a sós
  rationale: A expressão pode indicar estar separado dos demais ou em particular. “A sós” é natural e evita repetir “sozinho”, usado na oração seguinte.
- source_word: προσεύξασθαι
  choice: para orar
  rationale: O infinitivo exprime a finalidade da subida.
- source_word: ὀψίας δὲ γενομένης
  choice: Ao cair da tarde
  rationale: O genitivo absoluto estabelece a circunstância temporal. A formulação é corrente e mantém a transição para o período vespertino.
- source_word: μόνος ἦν ἐκεῖ
  choice: estava ali sozinho
  rationale: Mantém tanto a indicação de lugar quanto a ênfase explícita na solidão de Jesus.
theological_decisions: []
