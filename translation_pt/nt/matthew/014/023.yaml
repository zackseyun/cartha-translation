  source_fidelity: 'O texto traduz com precisão a sequência do grego: o particípio aoristo ἀπολύσας é adequadamente expresso por “Depois de dispensar”; o plural τοὺς ὄχλους é preservado em “as multidões”; e a finalidade de προσεύξασθαι é claramente indicada por “para orar”. “Subiu ao monte” representa naturalmente ἀνέβη εἰς τὸ ὄρος. A construção temporal “Ao cair da tarde” comunica de modo aceitável o genitivo absoluto ὀψίας δὲ γενομένης, e “estava ali sozinho” mantém μόνος, ἦν e ἐκεῖ.'
