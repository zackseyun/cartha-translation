  text: ⸂γενεσίοις δὲ γενομένοις⸃ τοῦ Ἡρῴδου ὠρχήσατο ἡ θυγάτηρ τῆς Ἡρῳδιάδος ἐν τῷ μέσῳ καὶ ἤρεσεν τῷ Ἡρῴδῃ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/006.yaml
  text: But when Herod’s birthday came[a], the daughter of Herodias danced in the midst and pleased Herod[b],
translation:
  language: pt
  text: Mas, quando se celebrava o aniversário de Herodes[a], a filha de Herodias dançou no meio[b] e agradou a Herodes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando chegou o aniversário de Herodes” ou “durante o banquete de aniversário de Herodes”. O grego se refere à ocasião da comemoração do aniversário.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “no meio da reunião”. Literalmente, “no meio”; o referente não é explicitado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενεσίοις ... γενομένοις
  choice: quando chegou o aniversário de Herodes
  rationale: A construção temporal se refere à ocasião em que se celebrava o aniversário de Herodes. A formulação é natural em português e a nota registra a possibilidade de explicitar a celebração ou o banquete.
- source_word: δὲ
  choice: Mas
  rationale: Marca o avanço da narrativa com leve contraste em relação ao contexto anterior.
- source_word: ὠρχήσατο
  choice: dançou
  rationale: Traduz diretamente o aoristo de ὀρχέομαι, sem acrescentar detalhes sobre a natureza da dança.
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: a filha de Herodias
  rationale: Preserva a relação genitiva e não introduz o nome tradicional da filha, ausente no texto.
- source_word: ἐν τῷ μέσῳ
  choice: no meio dos convidados
  rationale: Expressa idiomaticamente que ela dançou no centro da reunião; a nota preserva a forma mais literal e a abertura do referente.
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: agradou a Herodes
  rationale: Verte naturalmente ἀρέσκω com dativo, sem especificar em que sentido Herodes se agradou.
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: Herodes
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
theological_decisions: []
