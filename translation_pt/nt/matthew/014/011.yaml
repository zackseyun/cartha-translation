  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: pt
  text: A cabeça dele foi trazida numa bandeja[a] e entregue à menina, e ela a levou à mãe dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: numa travessa ou num prato de servir. O grego πίναξ se refere a um recipiente largo usado para servir alimentos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνέχθη
  choice: foi trazida
  rationale: Preserva o aoristo passivo de φέρω e expressa com naturalidade o deslocamento da cabeça até o local da entrega.
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: a cabeça dele
  rationale: Tradução direta e clara, sem suavizar a descrição explícita do grego. “Dele” tem leitura natural no português contemporâneo.
- source_word: ἐπὶ πίνακι
  choice: numa bandeja
  rationale: πίναξ designa uma bandeja, travessa ou prato usado para servir. “Numa bandeja” é a formulação mais natural em português para indicar que a cabeça foi apresentada sobre ela.
- source_word: ἐδόθη
  choice: entregue
  rationale: No contexto, o passivo de δίδωμι descreve a transferência da cabeça à menina. “Entregue” é idiomático e mantém a construção passiva compartilhada com “foi trazida”.
- source_word: τῷ κορασίῳ
  choice: à menina
  rationale: κοράσιον se refere a uma menina ou jovem do sexo feminino. “Menina” é claro, atual e evita o tom arcaico de “donzela”.
- source_word: ἤνεγκεν
  choice: ela a levou
  rationale: O aoristo ativo de φέρω indica que a menina levou a cabeça à mãe. O pronome “a” explicita o objeto já mencionado, como exige o português natural.
- source_word: τῇ μητρὶ αὐτῆς
  choice: à mãe dela
  rationale: Expressa claramente que se trata da mãe da menina e evita a possível ambiguidade do possessivo “sua” no português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem narrativa próxima à do grego. A coordenação repetida por “e” preserva o ritmo simples do relato, enquanto “entregue” e “levou” mantêm a fluidez idiomática.
