source:
  edition: SBLGNT
  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: pt
  text: 'E disse aos seus servos: “Este é João Batista. Ele foi ressuscitado dentre os mortos, e por isso os poderes[a] atuam nele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os poderes miraculosos”; de modo mais interpretativo, “os milagres”. O grego diz “os poderes” (αἱ δυνάμεις), referindo-se a poderes sobrenaturais manifestados em obras poderosas.
    reason: lexical_alternative
lexical_decisions:
- source_word: παισὶν
  choice: servos
  rationale: παῖς pode designar criança, servo ou assistente. No contexto da casa ou corte de Herodes, “servos” expressa a relação social sem especificar indevidamente o cargo.
- source_word: ὁ βαπτιστής
  choice: João Batista
  rationale: “Batista” é o epíteto consagrado e natural em português para aquele que batiza, sem alterar o sentido do grego.
- source_word: ἠγέρθη
  choice: foi ressuscitado
  rationale: O aoristo passivo de ἐγείρω pede formulação passiva. “Foi ressuscitado” é idiomático em português e evita sugerir que João ressuscitou por si mesmo.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: dentre os mortos
  rationale: A expressão conserva a ideia de alguém ser retirado do conjunto dos mortos e é natural no registro bíblico moderno.
- source_word: διὰ τοῦτο
  choice: por isso
  rationale: Expressa de modo claro e corrente a relação causal indicada pela locução grega.
- source_word: αἱ δυνάμεις
  choice: esses poderes
  rationale: δύναμεις aponta aqui para poderes sobrenaturais manifestos em obras extraordinárias. “Poderes” mantém o substantivo e evita reduzi-lo interpretativamente aos atos resultantes; “esses” retoma naturalmente os feitos mencionados no contexto.
- source_word: ἐνεργοῦσιν
  choice: atuam
  rationale: ἐνεργέω indica atividade eficaz. “Atuam” é conciso, atual e preserva o aspecto de operação contínua.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Mantém o sentido mais direto de ἐν como esfera ou lugar da atuação, sem adotar o interpretativo “por meio dele”.
theological_decisions:
- issue: Natureza do retorno de João
  choice: Ele foi ressuscitado dentre os mortos
  alternative: Ele ressuscitou dentre os mortos
  rationale: A forma passiva grega é preservada, sem sugerir que João tenha ressuscitado a si mesmo nem identificar explicitamente o agente.
- issue: Sentido de δυνάμεις no contexto
  choice: esses poderes atuam nele
  alternative: esses poderes miraculosos atuam nele; esses milagres se realizam por meio dele
  rationale: O contexto favorece poder sobrenatural manifesto em feitos poderosos, mas o texto principal conserva “poderes” e “nele”, mantendo a formulação e a tensão do grego sem explicitação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as relações causais do grego foram mantidas sem rigidez artificial; o discurso direto soa natural. O marcador foi colocado junto a “poderes”, termo ao qual a nota lexical se refere.
