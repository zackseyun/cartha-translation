review_pass:
  verdict: revise
  source_fidelity: 'O sentido central é bem reproduzido: a saída/desembarque no contexto narrativo, a grande multidão, a compaixão e a cura. Contudo, o grego usa o plural αὐτοῖς («por eles») e τοὺς ἀρρώστους αὐτῶν («os doentes deles»), enquanto «dela» desloca a referência para a multidão como coletivo e «os seus doentes» pode ser lido como possessivo de Jesus.'
  naturalness: «Quando desembarcou, Jesus viu...» é natural. A revisão proposta mantém linguagem moderna e clara, mas torna explícita a referência humana plural e elimina a ambiguidade de «seus».
  terminology: «Desembarcar», «grande multidão», «teve compaixão» e «curou» são escolhas adequadas, naturais e fiéis. «Os doentes entre eles» verte de modo idiomático o adjetivo substantivado grego com seu possessivo plural.
  issues:
  - severity: low
    issue: Referência singular em «teve compaixão dela»
    rationale: Embora «multidão» seja gramaticalmente singular em português, ἐπ’ αὐτοῖς retoma as pessoas da multidão no plural. «Deles» preserva essa referência e se harmoniza com a continuação.
  - severity: medium
    issue: Ambiguidade de «curou os seus doentes»
    rationale: Depois de «Jesus», o possessivo «seus» pode ser entendido como referente a Jesus, não à multidão. «Curou os doentes entre eles» comunica claramente que eram membros enfermos daquele grupo, sem alterar o sentido.
  revised_text: Ao desembarcar[a], Jesus viu uma grande multidão; teve compaixão deles e curou os doentes entre eles.
  revised_footnotes:
  - marker: a
    text: Ou, mais literalmente, “tendo saído” ou “quando saiu”. Neste contexto, provavelmente se refere a Jesus saindo do barco e chegando à margem.
    reason: lexical_alternative
  revision_rationale: 'A revisão preserva a opção contextual «desembarcar», mas substitui referências potencialmente ambíguas por formulações que refletem o plural do grego: Jesus teve compaixão das pessoas da multidão e curou os enfermos que estavam entre elas. A nota amplia de forma precisa as alternativas literais do particípio ἐξελθών.'
