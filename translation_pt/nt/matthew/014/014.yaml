source:
  edition: SBLGNT
  text: καὶ ⸀ἐξελθὼν εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ αὐτοῖς καὶ ἐθεράπευσεν τοὺς ἀρρώστους αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/014.yaml
  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: pt
  text: Ao desembarcar[a], Jesus viu uma grande multidão; teve compaixão deles e curou os doentes entre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “tendo saído” ou “quando saiu”. Neste contexto, provavelmente se refere a Jesus saindo do barco e chegando à margem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Quando desembarcou
  rationale: O particípio significa literalmente “tendo saído”, mas, no contexto da chegada de barco, “desembarcou” expressa a ação de modo natural e preciso em português.
- source_word: εἶδεν
  choice: viu
  rationale: Equivalente direto e corrente do aoristo de ὁράω.
- source_word: πολὺν ὄχλον
  choice: uma grande multidão
  rationale: Preserva tanto a ideia coletiva de ὄχλος quanto a força quantitativa de πολύς, em linguagem clara e digna.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: teve compaixão dela
  rationale: Comunica a profunda compaixão indicada por σπλαγχνίζομαι sem intensificação interpretativa; o singular “dela” retoma naturalmente “multidão” em português.
- source_word: ἐθεράπευσεν
  choice: curou
  rationale: Neste contexto, θεραπεύω designa cura física; “curou” é a formulação bíblica e cotidiana mais natural em português.
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: os seus doentes
  rationale: Reproduz de maneira compacta o adjetivo substantivado e o pronome possessivo gregos, referindo-se aos doentes pertencentes ou ligados à multidão.
theological_decisions:
- issue: A resposta emocional de Jesus
  choice: teve compaixão dela
  alternative: foi movido de compaixão por eles
  rationale: A formulação preserva a compaixão de Jesus como motivo narrativo para as curas, sem acrescentar uma descrição mais intensa do processo emocional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O nome “Jesus” foi explicitado para evitar ambiguidade natural em português, embora o grego empregue apenas a forma verbal de terceira pessoa. A coordenação simples acompanha o ritmo narrativo do original.
