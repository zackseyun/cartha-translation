- from: Quando desembarcou[a], Jesus viu uma grande multidão, teve compaixão dela e curou os seus doentes.
  to: Ao desembarcar[a], Jesus viu uma grande multidão; teve compaixão deles e curou os doentes entre eles.
  rationale: 'A revisão preserva a opção contextual «desembarcar», mas substitui referências potencialmente ambíguas por formulações que refletem o plural do grego: Jesus teve compaixão das pessoas da multidão e curou os enfermos que estavam entre elas. A nota amplia de forma precisa as alternativas literais do particípio ἐξελθών.'
