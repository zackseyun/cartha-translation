  text: καὶ παρεκάλουν αὐτὸν ἵνα μόνον ἅψωνται τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ· καὶ ὅσοι ἥψαντο διεσώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: pt
  text: E suplicavam-lhe que pudessem tocar apenas na borda de sua veste[a]; e todos os que tocaram nessa borda foram curados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na orla” ou “na franja”; o termo grego pode indicar a borda ou a franja de uma veste, possivelmente incluindo uma borla.
    reason: lexical_alternative
  - marker: b
    text: Ou “foram restabelecidos” ou “foram salvos”; o verbo grego pode significar curar, preservar, resgatar ou salvar, mas aqui o contexto aponta para a cura física.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: suplicavam
  rationale: O imperfeito indica súplica contínua ou repetida; “suplicavam” transmite urgência e mantém um registro natural e digno.
- source_word: ἵνα μόνον ἅψωνται
  choice: que os deixasse tocar apenas
  rationale: A construção com ἵνα e o subjuntivo expressa o conteúdo do pedido. Em português, “que os deixasse” torna natural a ideia de permissão implícita, enquanto “apenas” ressalta que buscavam somente o contato.
- source_word: τοῦ κρασπέδου
  choice: na borda
  rationale: κράσπεδον pode indicar a borda, orla, franja ou até o pendão de uma veste. “Borda” é clara e não especifica mais do que o texto permite.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: de sua veste
  rationale: ἱμάτιον designa de modo geral uma peça de roupa, frequentemente exterior. “Veste” preserva essa amplitude sem impor “manto” ou “túnica”.
- source_word: ὅσοι
  choice: todos os que
  rationale: Expressa de modo idiomático em português o valor abrangente e distributivo de ὅσοι.
- source_word: ἥψαντο
  choice: nela tocaram
  rationale: O verbo significa “tocar”; o pronome retoma naturalmente a borda da veste no contexto imediato.
- source_word: διεσώθησαν
  choice: ficaram curados
  rationale: Embora διασῴζω possa significar salvar, resgatar ou preservar, neste contexto de enfermidades o sentido imediato é recuperação física. “Ficaram curados” é claro e preserva o resultado da ação.
theological_decisions:
- issue: Sentido de διεσώθησαν no contexto do milagre
  choice: cura física (“ficaram curados”)
  alternative: “foram salvos”, “foram restabelecidos” ou “ficaram bem”
  rationale: O campo semântico do verbo admite salvação ou resgate em sentido mais amplo, mas o contexto imediato trata de pessoas doentes buscando cura. A tradução principal comunica esse sentido contextual sem transformar a frase numa afirmação explícita sobre salvação espiritual; a nota preserva a amplitude lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Suplicavam” preserva a força do pedido contínuo; “veste” evita especificidade indevida. As notas mantêm a ambiguidade lexical de κράσπεδον e διασῴζω sem obscurecer o sentido contextual.
