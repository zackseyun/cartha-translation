  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: pt
  text: 'Mas, ao ver o vento forte[a], ficou com medo e, começando a afundar, gritou: “Senhor, salva-me[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o vento violento”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “resgata-me”. O verbo grego pode indicar tanto o livramento de um perigo imediato quanto a salvação em sentido mais amplo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων
  choice: ao ver
  rationale: O particípio presente expressa uma percepção simultânea à reação de Pedro; “ao ver” mantém essa relação de modo natural em português.
- source_word: δὲ
  choice: Mas
  rationale: Marca a virada contrastante entre Pedro andar sobre a água e passar a temer.
- source_word: τὸν ἄνεμον ἰσχυρόν
  choice: o vento forte
  rationale: Traduz diretamente o substantivo e seu adjetivo, com formulação corrente; “vento violento” permanece como alternativa possível.
- source_word: ἐφοβήθη
  choice: ficou com medo
  rationale: Comunica naturalmente o início do medo indicado pelo aoristo no desenvolvimento narrativo.
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: começando a afundar
  rationale: Preserva o aspecto inicial da ação sem exagerá-la como afogamento consumado.
- source_word: ἔκραξεν λέγων
  choice: gritou
  rationale: “Gritou” transmite o apelo alto e urgente; os dois termos gregos são representados idiomaticamente pela introdução direta da fala, evitando o redundante “gritou, dizendo”.
- source_word: Κύριε
  choice: Senhor
  rationale: É a forma natural de tratamento e preserva o possível peso cristológico de κύριος sem o ampliar.
- source_word: σῶσόν με
  choice: salva-me
  rationale: Expressa o imperativo urgente e mantém tanto o sentido imediato de livramento do perigo quanto a amplitude semântica de σῴζω.
theological_decisions:
- issue: Tradução de κύριος como forma de tratamento dirigida a Jesus
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” é lexicalmente adequado e conserva a força cristológica possível da forma de tratamento sem impor uma explicação ao texto.
- issue: Tradução de σῴζω em situação de perigo físico imediato
  choice: salva-me
  alternative: resgata-me
  rationale: “Salva-me” cabe naturalmente no perigo imediato e, ao mesmo tempo, preserva a ressonância semântica mais ampla do verbo grego.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A colocação pronominal em “salva-me” preserva o tom bíblico sem soar arcaica. O marcador [b] foi ligado à expressão “salva-me”, à qual sua nota lexical efetivamente se refere.
