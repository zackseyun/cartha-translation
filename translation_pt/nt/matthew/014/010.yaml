  text: And he sent and beheaded John in the prison[a].
translation:
  language: pt
  text: E Herodes enviou alguém para decapitar João na prisão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “e, tendo enviado, decapitou João na prisão”. O particípio grego indica um envio anterior; a ação é atribuída a Herodes na narrativa, embora seja realizada por meio de um agente.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Então
  rationale: O conectivo dá continuidade à sequência narrativa; “Então” expressa naturalmente essa progressão em português, sem alterar o conteúdo do acontecimento.
- source_word: πέμψας
  choice: mandou
  rationale: O particípio aoristo de πέμπω indica que Herodes enviou alguém para executar a ação. No contexto, “mandou” comunica de modo idiomático tanto o envio de um agente quanto a autoridade de Herodes sobre o ato.
- source_word: ἀπεκεφάλισεν
  choice: decapitar
  rationale: ἀποκεφαλίζω significa especificamente cortar a cabeça, isto é, decapitar. A construção “mandou decapitar” conserva a atribuição do ato a Herodes sem sugerir que ele o executou pessoalmente.
- source_word: τὸν Ἰωάννην
  choice: João
  rationale: O texto traz apenas o nome próprio, e o contexto imediato já identifica João; acrescentar “Batista” seria explicativo, mas não está expresso neste versículo.
- source_word: ἐν τῇ φυλακῇ
  choice: na prisão
  rationale: φυλακή designa aqui o lugar de confinamento. “Na prisão” é claro, atual e preserva a localização concreta indicada pelo grego.
theological_decisions:
- issue: Agência de Herodes na execução
  choice: “Herodes mandou decapitar” apresenta Herodes como responsável pelo ato realizado por um agente.
  alternative: “Tendo enviado alguém, ele decapitou João” reproduziria mais formalmente a estrutura grega, mas poderia sugerir em português que Herodes realizou pessoalmente a execução.
  rationale: O grego atribui a ação principal ao sujeito, embora o particípio πέμψας indique mediação. A tradução mantém a responsabilidade de Herodes sem resolver a frase de modo historicamente enganoso.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O nome “Herodes”, implícito no sujeito grego e explícito no contexto, foi repetido para evitar ambiguidade em português.
