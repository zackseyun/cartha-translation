  naturalness: A redação revista permanece moderna, clara e natural em português internacional, com boa legibilidade brasileira. “Enviou alguém para decapitar” explicita de modo idiomático o agente necessariamente pressuposto pelo verbo “enviar”, sem sugerir que Herodes realizou pessoalmente a execução.
  terminology: “Decapitar” reproduz com precisão ἀποκεφαλίζω; “João” preserva o nome tal como aparece no versículo; e “na prisão” traduz adequadamente ἐν τῇ φυλακῇ.
