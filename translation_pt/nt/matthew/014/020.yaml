  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ἦραν τὸ περισσεῦον τῶν κλασμάτων δώδεκα κοφίνους πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/020.yaml
  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: pt
  text: Todos comeram e ficaram satisfeitos, e recolheram doze cestos cheios dos pedaços que sobraram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fragmentos”. O termo grego pode se referir a pedaços quebrados que sobraram depois da refeição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον πάντες
  choice: Todos comeram
  rationale: O aoristo de ἐσθίω indica a ação narrativa simples, e πάντες preserva a abrangência universal do grupo.
- source_word: ἐχορτάσθησαν
  choice: ficaram satisfeitos
  rationale: O passivo de χορτάζω expressa que todos comeram até se saciar; esta formulação é natural em português e mantém a ideia de plena satisfação.
- source_word: ἦραν
  choice: recolheram
  rationale: Embora αἴρω possa significar levantar ou pegar, no contexto da coleta das sobras, “recolheram” comunica naturalmente a ação pretendida.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: dos pedaços que sobraram
  rationale: A expressão designa aquilo que restou dos pedaços quebrados. A formulação mantém a relação entre as sobras e os pedaços em português corrente.
- source_word: δώδεκα κοφίνους πλήρεις
  choice: doze cestos cheios
  rationale: Tradução direta que preserva o número, o recipiente e sua condição de estar cheio.
theological_decisions:
- issue: A alimentação milagrosa descrita em termos de plena saciedade
  choice: ficaram satisfeitos
  alternative: ficaram saciados
  rationale: A tradução relata o resultado completo da alimentação sem acrescentar interpretação teológica ao sentido explícito do grego.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O marcador da nota foi colocado junto a “pedaços que sobraram”, termo ao qual a alternativa lexical efetivamente se refere.
