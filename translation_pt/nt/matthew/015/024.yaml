  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἀπεστάλην εἰ μὴ εἰς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/024.yaml
  text: But he answered[a], “I was sent only to the lost sheep of the house of Israel.”
translation:
  language: pt
  text: 'Mas ele respondeu[a]: “Não fui enviado senão às ovelhas perdidas da casa de Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “Fui enviado somente às ovelhas perdidas da casa de Israel.”'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: respondeu
  rationale: A construção com particípio aoristo e verbo finito é expressa de modo natural em português pelo verbo simples “respondeu”, sem perda de sentido.
- source_word: Οὐκ ἀπεστάλην
  choice: Não fui enviado
  rationale: O aoristo passivo de ἀποστέλλω indica envio ou comissão; o pretérito perfeito passivo é natural no contexto narrativo.
- source_word: εἰ μὴ
  choice: senão
  rationale: Nesta construção, marca exceção e limitação. “Não... senão” preserva de perto tanto a forma negativa quanto a força restritiva do grego.
- source_word: πρόβατα
  choice: ovelhas
  rationale: Mantém a metáfora pastoril do texto, sem a substituir por uma explicação interpretativa.
- source_word: ἀπολωλότα
  choice: perdidas
  rationale: Como qualificativo metafórico de ovelhas, “perdidas” comunica adequadamente a ideia de estarem extraviadas, sem sugerir destruição final.
- source_word: οἴκου Ἰσραήλ
  choice: da casa de Israel
  rationale: Preserva a expressão bíblica de caráter nacional e pactual, inteligível em português e mais fiel que uma paráfrase.
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição com leve contraste em relação ao apelo apresentado no contexto imediato.
theological_decisions:
- issue: Alcance da missão declarada por Jesus neste dito
  choice: 'Manter explicitamente a limitação: “Não fui enviado senão...”'
  alternative: Parafrasear como mera prioridade de Israel ou incorporar aqui a posterior missão às nações.
  rationale: A construção grega Οὐκ ... εἰ μὴ é expressamente restritiva. A tradução conserva a tensão narrativa e teológica sem a suavizar nem a resolver por meio de outros textos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação principal privilegia a correspondência formal da construção restritiva grega; a nota oferece a formulação portuguesa mais idiomática.
