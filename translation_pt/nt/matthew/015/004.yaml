  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: pt
  text: 'Pois Deus disse: “Honre seu pai e sua mãe” e: “Quem amaldiçoar o pai ou a mãe deve morrer”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem falar mal do pai ou da mãe deve morrer”.'
    reason: Registra a alternativa lexical mais ampla para κακολογέω, sem explicitar a agência da pena, que θανάτῳ τελευτάτω não especifica diretamente.
lexical_decisions:
- source_word: ὁ γὰρ θεὸς
  choice: Pois Deus
  rationale: γάρ introduz a justificativa do argumento de Jesus; “Pois Deus” conserva essa relação explicativa de modo natural.
- source_word: εἶπεν
  choice: disse
  rationale: O verbo introduz citações das Escrituras; “disse” mantém seu sentido simples sem intensificá-lo para “ordenou”.
- source_word: Τίμα
  choice: Honre
  rationale: τιμάω exige que se dê a devida honra; “honre” preserva o peso ético do mandamento e é corrente em português.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: seu pai e sua mãe
  rationale: O possessivo, presente no mandamento veterotestamentário citado, torna a formulação portuguesa natural e clara.
- source_word: Ὁ κακολογῶν
  choice: Quem amaldiçoar
  rationale: κακολογέω pode significar falar mal, insultar ou amaldiçoar. No contexto da fórmula legal citada, “amaldiçoar” expressa com clareza a gravidade do ato, enquanto a nota registra uma alternativa mais abrangente.
- source_word: πατέρα ἢ μητέρα
  choice: o pai ou a mãe
  rationale: A formulação genérica com artigos definidos é idiomática em português e não acrescenta um possessivo ausente nesta cláusula grega.
- source_word: θανάτῳ τελευτάτω
  choice: certamente morrerá
  rationale: A expressão constitui uma fórmula solene de pena de morte. Esta versão conserva a força enfática sem tornar explícito o agente da execução, que o grego não especifica diretamente.
theological_decisions:
- issue: Formulação da pena legal na citação da lei
  choice: certamente morrerá
  alternative: deverá ser morto
  rationale: A tradução mantém a severidade da pena e a ênfase da fórmula θανάτῳ τελευτάτω, sem resolver a ambiguidade quanto à agência humana mediante uma forma passiva explícita.
- issue: Amplitude semântica de κακολογῶν
  choice: amaldiçoar
  alternative: falar mal de
  rationale: O contexto jurídico favorece “amaldiçoar”, mas o verbo também comporta o sentido mais amplo de falar de modo injurioso; a alternativa é preservada em nota, sem reduzir a tensão lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação distingue as duas citações, e a formulação preserva o tom solene da fala de Jesus e da lei citada.
