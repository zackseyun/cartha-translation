id: MAT.15.11
reference: Matthew 15:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: pt
  text: Não é o que entra pela boca que torna o ser humano impuro[a], mas o que sai da boca — isso é o que torna o ser humano impuro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que contamina o ser humano”. O verbo grego se refere a tornar alguém impuro ou profanado, especialmente no contexto da pureza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῖ
  choice: torna ... impuro
  rationale: No contexto das discussões sobre pureza, o verbo significa tornar alguém impuro ou profanado. A formulação preserva a dimensão ritual e moral sem sugerir mera sujeira física.
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: o que entra pela boca
  rationale: O particípio substantivado é traduzido naturalmente como “o que entra”; “pela boca” expressa de modo idiomático o movimento para dentro indicado por εἰς.
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: o que sai da boca
  rationale: A expressão reproduz com clareza e naturalidade o particípio substantivado e a ideia de movimento para fora marcada por ἐκ.
- source_word: ἄνθρωπον
  choice: o ser humano
  rationale: ἄνθρωπος designa aqui genericamente uma pessoa humana, não um indivíduo do sexo masculino em particular; “o ser humano” mantém o singular representativo e a abrangência do original.
- source_word: τοῦτο
  choice: isso é o que
  rationale: A explicitação do demonstrativo conserva a ênfase grega sobre aquilo que sai da boca como a verdadeira fonte de impureza.
- source_word: οὐ ... ἀλλὰ
  choice: Não é ... mas ...
  rationale: A construção portuguesa preserva diretamente o forte contraste do original.
theological_decisions:
- issue: Linguagem de pureza em κοινόω
  choice: torna ... impuro
  alternative: contamina; profana
  rationale: “Torna impuro” conserva de maneira transparente a ressonância ritual e moral do contexto, sem limitar a afirmação à higiene nem resolver a tensão entre impureza cerimonial e interior.
- issue: Sentido genérico de ἄνθρωπον
  choice: o ser humano
  alternative: o homem; a pessoa
  rationale: Neste dito, o substantivo singular tem força representativa e se refere a qualquer pessoa. “O ser humano” mantém o referente humano genérico sem introduzir uma restrição masculina ausente do sentido contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém o paralelismo e a antítese do grego; o travessão destaca a retomada enfática de τοῦτο.
