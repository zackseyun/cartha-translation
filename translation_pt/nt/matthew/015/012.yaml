  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ ⸀μαθηταὶ ⸀λέγουσιν αὐτῷ· Οἶδας ὅτι οἱ Φαρισαῖοι ἀκούσαντες τὸν λόγον ἐσκανδαλίσθησαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/012.yaml
  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: pt
  text: 'Então os discípulos se aproximaram e lhe disseram: “Você sabe que os fariseus ficaram ofendidos[a] ao ouvirem esta palavra[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sentiram-se ofendidos”; mais literalmente, “foram levados a tropeçar”.
    reason: lexical_alternative
  - marker: b
    text: “Esta palavra” se refere ao que Jesus havia acabado de dizer.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Conector temporal natural em narrativa, indicando o acontecimento seguinte.
- source_word: προσελθόντες
  choice: se aproximaram
  rationale: Preserva com naturalidade o sentido do particípio de προσέρχομαι e evita reduzir o movimento a um simples ‘vieram’.
- source_word: οἱ μαθηταὶ
  choice: os discípulos
  rationale: Corresponde ao substantivo definido no grego, sem acrescentar o possessivo ‘seus’.
- source_word: λέγουσιν αὐτῷ
  choice: lhe disseram
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma narrativa natural em português.
- source_word: Οἶδας
  choice: Você sabe
  rationale: Tradução direta e atual da pergunta; mantém a interrogação sem intensificá-la como ‘Você percebe’.
- source_word: οἱ Φαρισαῖοι
  choice: os fariseus
  rationale: Forma portuguesa convencional para o nome do grupo.
- source_word: ἀκούσαντες τὸν λόγον
  choice: quando ouviram essas palavras
  rationale: No contexto, λόγος designa o que Jesus acabara de dizer. O plural idiomático ‘essas palavras’ soa natural em português e preserva a referência ao pronunciamento anterior.
- source_word: ἐσκανδαλίσθησαν
  choice: ficaram ofendidos
  rationale: Expressa de modo idiomático a reação negativa dos fariseus, preservando em nota as alternativas mais próximas da imagem lexical.
theological_decisions:
- issue: Sentido de σκανδαλίζω neste contexto de reação ao ensino de Jesus
  choice: ficaram ofendidos
  alternative: sentiram-se ofendidos; tropeçaram
  rationale: O contexto imediato aponta para a reação dos fariseus ao que ouviram. A tradução principal evita transformar a expressão em uma afirmação específica sobre apostasia ou queda moral, enquanto a nota conserva a imagem de tropeço presente no verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal ‘lhe disseram’ mantém fluidez sem soar excessivamente coloquial; ‘Você sabe’ reproduz a pergunta direta em registro corrente.
