  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Διὰ τί οἱ μαθηταί σου παραβαίνουσιν τὴν παράδοσιν τῶν πρεσβυτέρων; οὐ γὰρ νίπτονται τὰς χεῖρας ⸀αὐτῶν ὅταν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: pt
  text: Por que os seus discípulos violam a tradição dos anciãos? Pois não lavam as mãos quando comem pão[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a prática de lavar as mãos exigida pela tradição dos anciãos, e não uma simples questão de higiene comum.
    reason: cultural_note
  - marker: b
    text: Ou “quando fazem uma refeição”; em grego, “pão” pode, em alguns contextos, representar o alimento ou a refeição em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: Por que
  rationale: Forma interrogativa natural em português para pedir a razão de uma conduta.
- source_word: παραβαίνουσιν
  choice: transgridem
  rationale: Expressa a violação de uma norma recebida e preserva a força do verbo no contexto, sem sugerir apenas um costume casual.
- source_word: τὴν παράδοσιν
  choice: a tradição
  rationale: Traduz diretamente a ideia de um ensino ou prática transmitida e dotada de autoridade.
- source_word: τῶν πρεσβυτέρων
  choice: dos anciãos
  rationale: Designa autoridades ou antepassados reconhecidos ligados à tradição judaica, não simplesmente pessoas idosas.
- source_word: νίπτονται τὰς χεῖρας αὐτῶν
  choice: lavam as mãos
  rationale: Construção natural em português; o possessivo é dispensável porque a referência às próprias mãos é inequívoca.
- source_word: ὅταν
  choice: quando
  rationale: Com o presente do subjuntivo grego, introduz uma situação habitual; “quando” transmite isso naturalmente no contexto.
- source_word: ἄρτον
  choice: pão
  rationale: Mantém o sentido lexical explícito do grego, deixando em nota a possibilidade metonímica de refeição ou alimento.
- source_word: ἐσθίωσιν
  choice: comem
  rationale: O presente simples expressa com naturalidade a ação habitual indicada pela construção grega.
theological_decisions:
- issue: Natureza da lavagem das mãos
  choice: Apresentar no texto principal a prática como parte da tradição dos anciãos, sem qualificá-la explicitamente como ritual ou higiênica.
  alternative: Traduzir de modo interpretativo como “fazem a lavagem ritual das mãos” ou entender a frase como simples higiene.
  rationale: O próprio versículo enquadra a controvérsia como transgressão da tradição dos anciãos. A nota fornece o contexto necessário sem resolver além do texto a natureza exata da prática.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Transgridem” preserva a força normativa do conflito; “pão” mantém a forma concreta do original, enquanto as notas esclarecem o contexto cultural e a alternativa lexical.
