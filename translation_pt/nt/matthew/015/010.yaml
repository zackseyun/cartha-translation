  text: And calling the crowd to him[a], he said to them, “Listen and understand.”
translation:
  language: pt
  text: 'E, chamando a multidão para junto de si, disse-lhes: “Ouçam e entendam.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Preserva a coordenação narrativa simples do grego, sem acrescentar uma relação temporal mais específica.
- source_word: προσκαλεσάμενος
  choice: chamando ... para junto de si
  rationale: O particípio aoristo médio indica que Jesus chamou a multidão para perto dele. A formulação mantém a relação com o verbo principal sem explicitar desnecessariamente ‘depois de’.
- source_word: τὸν ὄχλον
  choice: a multidão
  rationale: Expressa de modo natural e corrente um grupo reunido de pessoas, preservando o referente definido do contexto.
- source_word: εἶπεν αὐτοῖς
  choice: disse-lhes
  rationale: Tradução direta e digna da construção grega, com o pronome plural indicando os destinatários.
- source_word: Ἀκούετε
  choice: Ouçam
  rationale: O imperativo presente plural pede atenção ao que será dito; ‘Ouçam’ é natural em português e mantém a força imperativa.
- source_word: συνίετε
  choice: entendam
  rationale: Indica captar intelectualmente o sentido do ensino, em distinção do simples ato de ouvir.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural imperativo ‘Ouçam’ evita formas regionais ou arcaizantes; ‘para junto de si’ explicita naturalmente a direção do verbo médio grego.
