lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a conexão narrativa simples com a ação anterior.
- source_word: παραγγείλας
  choice: depois de mandar
  rationale: Expressa a anterioridade do particípio aoristo em relação ao verbo principal do versículo seguinte e conserva a força diretiva sem soar excessivamente severo.
- source_word: τῷ ὄχλῳ
  choice: a multidão
  rationale: Representa naturalmente o objeto indireto dativo e se ajusta ao cenário narrativo.
- source_word: ἀναπεσεῖν
  choice: que ... se acomodasse
  rationale: No contexto de uma refeição, o verbo indica tomar lugar, tradicionalmente reclinado; 'se acomodasse' comunica essa ação em português atual sem sugerir simplesmente deitar-se.
- source_word: ἐπὶ τὴν γῆν
  choice: no chão
  rationale: Neste contexto, γῆ designa a superfície onde a multidão toma lugar, não a terra em sentido global.
