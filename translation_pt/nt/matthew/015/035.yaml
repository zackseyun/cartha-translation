  text: And after instructing the crowd to recline on the ground,[a]
translation:
  language: pt
  text: E, depois de mandar que a multidão se acomodasse no chão,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se sentasse no chão”. O verbo grego pode indicar tomar lugar para uma refeição, muitas vezes com a ideia de se reclinar.
