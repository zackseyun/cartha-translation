id: MAT.15.23
reference: Matthew 15:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ⸀ἠρώτουν αὐτὸν λέγοντες· Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: pt
  text: 'Mas ele não lhe respondeu palavra alguma. E os discípulos se aproximaram e insistiam com ele: “Manda-a embora[a], pois ela está gritando atrás de nós[b]”.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Dispensa-a”. As palavras dos discípulos não deixam explícito se queriam que Jesus atendesse ao pedido dela e depois a mandasse embora, ou apenas que a afastasse deles.
    reason: alternative_reading
  - marker: b
    text: O grego pode indicar tanto a posição (“atrás de nós”) como o movimento de quem segue alguém (“no nosso encalço”).
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἀπεκρίθη αὐτῇ λόγον
  choice: não lhe respondeu palavra alguma
  rationale: 'Reproduz de modo natural em português a ênfase do idioma grego: Jesus não deu resposta alguma à mulher.'
- source_word: προσελθόντες
  choice: se aproximaram
  rationale: Expressa claramente o movimento dos discípulos em direção a Jesus, sem acrescentar informação ao texto.
- source_word: ἠρώτουν
  choice: insistiam com ele
  rationale: O imperfeito indica uma solicitação continuada ou repetida. A formulação comunica essa persistência sem intensificá-la indevidamente como súplica.
- source_word: Ἀπόλυσον αὐτήν
  choice: Manda-a embora
  rationale: É uma expressão corrente que mantém em aberto se os discípulos queriam que Jesus atendesse ao pedido dela antes de dispensá-la ou apenas que a afastasse.
- source_word: κράζει
  choice: vem gritando
  rationale: Comunica o clamor alto e continuado no contexto de alguém que segue o grupo.
- source_word: ὄπισθεν ἡμῶν
  choice: atrás de nós
  rationale: Conserva o sentido espacial mais direto; em português, a expressão também pode sugerir que ela vinha seguindo o grupo.
theological_decisions:
- issue: A intenção dos discípulos em Ἀπόλυσον αὐτήν
  choice: Manter a ordem neutra como “Manda-a embora”.
  alternative: Explicitar “Atende ao pedido dela e manda-a embora” ou “Expulsa-a daqui”.
  rationale: A ordem grega não esclarece se eles queriam que Jesus concedesse o pedido da mulher ou simplesmente a dispensasse. A tradução preserva essa tensão narrativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Insistiam” preserva o aspecto continuado do imperfeito; “vem gritando” soa natural na cena e comunica ação em curso. Os marcadores de nota foram colocados junto às expressões a que efetivamente se referem.
