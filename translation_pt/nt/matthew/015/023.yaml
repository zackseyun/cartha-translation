  source_fidelity: A primeira frase traduz com precisão a recusa de Jesus em responder. “Se aproximaram e insistiam com ele” representa adequadamente o particípio de aproximação e o imperfeito iterativo ἠρώτουν. Contudo, “ela vem gritando” introduz de modo mais definido a noção de deslocamento em direção ao grupo; κράζει afirma que ela clama, e ὄπισθεν ἡμῶν pode indicar posição ou seguimento, sem exigir o verbo “vir”.
  naturalness: O texto é claro, atual e de registro digno. “Ela está gritando atrás de nós” é igualmente natural em português internacional com boa legibilidade brasileira e evita a inferência adicional contida em “vem gritando”.
  terminology: “Não lhe respondeu palavra alguma”, “Manda-a embora” e “insistiam com ele” são escolhas adequadas. A nota sobre “Manda-a embora” preserva corretamente a intenção ambígua dos discípulos, e a nota de ὄπισθεν conserva as duas possibilidades semânticas.
