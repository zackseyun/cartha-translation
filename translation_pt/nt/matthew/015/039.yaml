  text: καὶ ἀπολύσας τοὺς ὄχλους ἐνέβη εἰς τὸ πλοῖον, καὶ ἦλθεν εἰς τὰ ὅρια ⸀Μαγαδάν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/039.yaml
  text: And after dismissing the crowds[a], he got into the boat and came to the region of Magadan.
translation:
  language: pt
  text: Depois de despedir as multidões, ele entrou no barco e foi para a região de Magadã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “Magdala” em vez de “Magadã”.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπολύσας
  choice: Depois de despedir
  rationale: O particípio aoristo indica uma ação anterior à entrada no barco. “Depois de despedir” expressa essa sequência com naturalidade, sem acrescentar sentidos ao grego.
- source_word: τοὺς ὄχλους
  choice: as multidões
  rationale: Mantém o plural do grego e emprega uma expressão clara e corrente em português.
- source_word: ἐνέβη εἰς τὸ πλοῖον
  choice: entrou no barco
  rationale: É uma forma natural e concreta de expressar o ato de embarcar, preservando a construção narrativa simples.
- source_word: ἦλθεν εἰς
  choice: foi para
  rationale: Embora ἔρχομαι possa corresponder literalmente a “vir”, em uma narrativa de deslocamento sem um ponto de referência dêitico explícito, “foi para” é mais natural em português e comunica fielmente o movimento até o destino.
- source_word: τὰ ὅρια
  choice: a região
  rationale: O plural grego, literalmente relacionado a limites ou territórios, designa aqui uma área geográfica; “região” transmite o sentido idiomático sem sugerir apenas linhas de fronteira.
- source_word: Μαγαδάν
  choice: Magadã
  rationale: Segue a forma Μαγαδάν do texto grego fornecido, adaptando o nome à grafia e à pronúncia correntes em português. A variante “Magdala” é registrada em nota.
theological_decisions:
- issue: Forma textual do nome geográfico no fim do versículo
  choice: Magadã
  alternative: Magdala
  rationale: O texto principal segue diretamente a leitura Μαγαδάν da edição SBLGNT. A leitura variante, conhecida na tradição manuscrita, é preservada em nota para transparência; trata-se de uma questão textual e geográfica, não de uma opção doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa e ampla legibilidade brasileira. O pronome “ele” explicita o sujeito naturalmente em português, sem alterar o referente. A nota foi colocada junto de “Magadã”, o termo ao qual a variante textual se refere.
