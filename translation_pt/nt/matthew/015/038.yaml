reference: Matthew 15:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ἐσθίοντες ἦσαν τετρακισχίλιοι ἄνδρες χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/038.yaml
  text: Those who had eaten were four thousand men[a], besides women and children.
translation:
  language: pt
  text: Os que comeram eram quatro mil homens, sem contar as mulheres e as crianças.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: além das mulheres e das crianças.'
    reason: Alternativa lexical para χωρὶς, preservando o sentido de que elas não estavam incluídas nos quatro mil.
lexical_decisions:
- source_word: οἱ δὲ
  choice: Os que
  rationale: O artigo com o particípio é traduzido de modo substantivado por “os que”. δέ é um conectivo leve, cujo valor discursivo não exige aqui uma conjunção explícita em português.
- source_word: ἐσθίοντες
  choice: comeram
  rationale: Embora seja formalmente um particípio presente, no contexto designa os que participaram da refeição já concluída; o pretérito perfeito é natural e fiel em português.
- source_word: ἦσαν
  choice: eram
  rationale: Mantém a cópula simples que introduz a quantidade.
- source_word: τετρακισχίλιοι
  choice: quatro mil
  rationale: Correspondência direta do numeral cardinal grego.
- source_word: ἄνδρες
  choice: homens
  rationale: ἀνήρ se refere especificamente a homens, não genericamente a pessoas; a distinção é confirmada pela menção separada de mulheres e crianças.
- source_word: χωρὶς
  choice: sem contar
  rationale: Neste contexto, indica que as mulheres e as crianças não estavam incluídas no total declarado; “sem contar” comunica isso com clareza em português corrente.
- source_word: γυναικῶν
  choice: as mulheres
  rationale: O sentido genérico “mulheres” é adequado à fórmula de contagem e não restringe a referência a esposas.
- source_word: καὶ παιδίων
  choice: e as crianças
  rationale: “Crianças” transmite naturalmente o sentido geral de παιδίον sem impor uma faixa etária mais estreita.
theological_decisions:
- issue: Fórmula de contagem com distinção de gênero
  choice: Manter “homens” e mencionar separadamente mulheres e crianças.
  alternative: Usar “pessoas” como termo inclusivo.
  rationale: O grego especifica ἄνδρες (“homens”) e depois distingue mulheres e crianças. “Pessoas” apagaria uma distinção lexical expressa no texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a contagem específica de homens e explicita naturalmente que mulheres e crianças não estavam incluídas nesse número.
