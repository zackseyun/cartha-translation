  terminology: «Os que não falavam falando» preserva adequadamente a decisão contextual para κωφούς, com a alternativa «surdos» anotada. «Os que tinham membros incapacitados, curados» é uma designação mais ampla e respeitosa para κυλλούς ὑγιεῖς; «glorificou o Deus de Israel» mantém o valor de δοξάζω.
