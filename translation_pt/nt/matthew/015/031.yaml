id: MAT.15.31
reference: Matthew 15:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥστε ⸂τὸν ὄχλον⸃ θαυμάσαι βλέποντας κωφοὺς λαλοῦντας ⸂κυλλοὺς ὑγιεῖς⸃ ⸀καὶ χωλοὺς περιπατοῦντας καὶ τυφλοὺς βλέποντας· καὶ ἐδόξασαν τὸν θεὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: pt
  text: De modo que a multidão ficou admirada ao ver os que não falavam falando[a], os que tinham membros incapacitados, curados[b], os mancos andando e os cegos enxergando; e glorificou o Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os surdos falando”. A palavra grega pode se referir a pessoas surdas ou que não falam; aqui, a menção de que estavam falando favorece o segundo sentido.
    reason: lexical_alternative
  - marker: b
    text: Ou “os mutilados restaurados” ou “os que tinham membros deformados, saudáveis”. O termo grego descreve pessoas com membros incapacitados, deformados ou mutilados; não especifica a natureza exata da limitação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Assim
  rationale: Introduz de modo natural o resultado das curas anteriores, preservando a força consecutiva.
- source_word: τὸν ὄχλον
  choice: a multidão
  rationale: Equivalente corrente e digno para o grupo reunido.
- source_word: θαυμάσαι
  choice: ficou admirada
  rationale: Expressa a reação de assombro da multidão em português natural.
- source_word: βλέποντας
  choice: ao ver
  rationale: Liga claramente o espanto da multidão ao que ela presenciava.
- source_word: κωφοὺς λαλοῦντας
  choice: os que não falavam falando
  rationale: O contraste com λαλοῦντας favorece a incapacidade de falar, embora κωφός também possa indicar surdez.
- source_word: κυλλοὺς ὑγιεῖς
  choice: os que tinham membros atrofiados curados
  rationale: Torna explícita a referência a membros incapacitados e traduz ὑγιεῖς como o estado restaurado, sem confundir esse grupo com os mancos mencionados em seguida.
- source_word: χωλοὺς περιπατοῦντας
  choice: os mancos andando
  rationale: Reproduz de maneira direta o contraste entre a limitação anterior e a capacidade restaurada.
- source_word: τυφλοὺς βλέποντας
  choice: os cegos enxergando
  rationale: Mantém a formulação concreta e paralela do grego.
- source_word: ἐδόξασαν
  choice: glorificaram
  rationale: Preserva o sentido forte de atribuir glória a Deus, além da ideia geral de louvor.
- source_word: τὸν θεὸν Ἰσραήλ
  choice: o Deus de Israel
  rationale: Tradução direta da designação divina no texto.
theological_decisions:
- issue: Sentido de κωφούς em κωφοὺς λαλοῦντας
  choice: os que não falavam falando
  alternative: os surdos falando
  rationale: κωφός pode designar alguém surdo ou sem fala; o particípio 'falando' favorece aqui a restauração da fala, mas a nota preserva a alternativa lexical genuína.
- issue: Sentido de δοξάζω em relação a Deus
  choice: glorificaram o Deus de Israel
  alternative: louvaram o Deus de Israel
  rationale: '''Glorificaram'' conserva mais diretamente a linguagem de atribuição de glória presente no verbo grego.'
- issue: Descrição de κυλλούς
  choice: os que tinham membros atrofiados curados
  alternative: os mutilados restaurados / os que tinham membros incapacitados curados
  rationale: A expressão evita identificar esse grupo simplesmente como 'aleijados', pois os mancos aparecem separadamente, e mantém aberta a extensão exata da deficiência física.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém o paralelismo da lista grega, evita linguagem excessivamente técnica e conserva em notas as ambiguidades de κωφός e κυλλός.
