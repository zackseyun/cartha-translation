  yaml_path: translation/nt/matthew/015/006.yaml
  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: pt
  text: certamente não precisa honrar seu pai[b]. E vocês anularam a palavra de Deus[a] por causa da tradição de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “o mandamento de Deus” em vez de “a palavra de Deus”.
    reason: textual_variant
  - marker: b
    text: Aqui, “honrar” provavelmente inclui o dever prático de prover o necessário aos pais, e não apenas tratá-los com respeito.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: certamente não precisa
  rationale: A dupla negação é enfática. Neste contexto, a formulação expressa a dispensa da obrigação atribuída à tradição, e não apenas uma previsão futura.
- source_word: τιμήσει
  choice: honrar
  rationale: Preserva o sentido comum de τιμάω e a ligação verbal com o mandamento sobre os pais, sem reduzir o termo à ajuda material.
- source_word: τὸν πατέρα αὐτοῦ
  choice: seu pai
  rationale: Segue o singular explícito do texto grego, sem ampliá-lo para incluir a mãe com base no contexto próximo.
- source_word: ἠκυρώσατε
  choice: anularam
  rationale: Expressa com clareza a ideia de tornar inválido ou sem efeito.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: Traduz diretamente a leitura λόγον adotada pelo SBLGNT; a variante 'mandamento' é registrada em nota.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: por causa da tradição de vocês
  rationale: διά com acusativo indica aqui causa ou motivo; a formulação é natural e deixa claro que a tradição deles ocasiona a anulação.
theological_decisions:
- issue: Explicitar que honrar inclui sustentar materialmente os pais
  choice: Manter 'honrar' no texto principal e explicar a implicação prática em nota.
  alternative: Traduzir por 'sustentar' ou 'cuidar de'.
  rationale: O contexto envolve provisão material, mas o verbo grego é mais amplo e ecoa o mandamento; a nota esclarece sem estreitar o texto.
- issue: Harmonizar o versículo com o contexto ou com variantes manuscritas
  choice: Traduzir 'seu pai' e 'a palavra de Deus', conforme o texto grego fornecido.
  alternative: Usar 'pai ou mãe' e/ou 'o mandamento de Deus'.
  rationale: A tradução segue a forma textual do SBLGNT e preserva em nota a variante relevante, em vez de incorporá-la ao texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. 'Vocês' torna natural o plural de ὑμῶν; 'por causa da tradição de vocês' evita a possível leitura final de 'em favor da tradição'. Os marcadores foram colocados junto às expressões a que se referem.
