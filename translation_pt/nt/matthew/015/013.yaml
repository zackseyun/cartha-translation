source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/013.yaml
  text: But he answered and said[a], “Every plant that my heavenly Father did not plant will be uprooted.”
translation:
  language: pt
  text: 'Mas ele respondeu: “Toda planta que meu Pai celestial não plantou será arrancada pela raiz.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: respondeu
  rationale: A combinação dos dois verbos é uma fórmula narrativa de influência semítica. Em português atual, “respondeu” transmite naturalmente a fórmula inteira; “respondeu e disse” seria possível, mas soaria redundante e mais rígido.
- source_word: Πᾶσα
  choice: Toda
  rationale: O singular distributivo é expresso naturalmente por “toda”, em concordância com o substantivo singular seguinte.
- source_word: φυτεία
  choice: planta
  rationale: O substantivo pode indicar uma planta ou aquilo que foi plantado. “Planta” é natural no contexto e combina claramente com a ação posterior de arrancar pela raiz, sem determinar o referente da metáfora.
- source_word: ἐφύτευσεν
  choice: plantou
  rationale: Preserva diretamente a metáfora agrícola e a relação lexical com φυτεία.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: meu Pai celestial
  rationale: Expressão idiomática e digna em português, que conserva tanto a relação possessiva quanto a qualificação celestial.
- source_word: ἐκριζωθήσεται
  choice: será arrancada pela raiz
  rationale: Comunica com clareza o futuro passivo e explicita a imagem contida no verbo de remover desde a raiz; é mais corrente em português do que “será desenraizada”.
theological_decisions:
- issue: Referente metafórico de “toda planta”
  choice: Manter a metáfora como “Toda planta”, sem identificar seu referente.
  alternative: Traduzir interpretativamente como “todo ensinamento”, “toda tradição” ou “toda pessoa”.
  rationale: O grego não define de modo explícito se a imagem se refere a ensinamentos, tradições ou pessoas. Preservar a metáfora mantém a ambiguidade e a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fórmula grega ἀποκριθεὶς εἶπεν foi vertida de modo natural por “respondeu”, enquanto a metáfora agrícola foi preservada integralmente.
