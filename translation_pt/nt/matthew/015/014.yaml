  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἄφετε αὐτούς· ⸂τυφλοί εἰσιν ὁδηγοὶ τυφλῶν⸃· τυφλὸς δὲ τυφλὸν ἐὰν ὁδηγῇ, ἀμφότεροι εἰς βόθυνον πεσοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: pt
  text: Deixem-nos; eles são guias cegos de cegos.[a] E, se um cego guiar outro cego,[b] ambos cairão numa cova.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos omitem: “eles são guias cegos de cegos”.'
    reason: textual_variant
  - marker: b
    text: O singular masculino tem valor representativo no provérbio; a afirmação se aplica de modo geral, não apenas a homens.
    reason: cultural_note
  - marker: c
    text: 'Ou: “num fosso” ou “num buraco”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: Deixem-nos
  rationale: O imperativo aoristo de ἀφίημι, com o pronome, significa aqui deixá-los, não perdoá-los. A formulação é concisa, natural e mantém a força de afastamento da ordem.
- source_word: τυφλοί
  choice: cegos
  rationale: Mantém sem explicação adicional a metáfora de falta de percepção espiritual.
- source_word: ὁδηγοὶ τυφλῶν
  choice: guias cegos de cegos
  rationale: Conserva tanto ὁδηγός como “guia” quanto o genitivo compacto τυφλῶν, preservando a repetição e a imagem proverbial.
- source_word: δὲ
  choice: E
  rationale: Neste contexto, δέ introduz o desenvolvimento da imagem com contraste leve. “E” produz em português uma ligação natural sem tornar a oposição mais forte do que o grego exige.
- source_word: τυφλὸς ... τυφλὸν
  choice: um cego ... outro cego
  rationale: Reproduz o singular representativo do provérbio. “Outro” evita a repetição pouco natural de “um cego” e deixa clara a relação entre as duas pessoas sem alterar o sentido.
- source_word: ἐὰν ὁδηγῇ
  choice: se ... guiar
  rationale: A construção com ἐάν e subjuntivo expressa uma condição geral; o futuro do subjuntivo é idiomático em português depois de “se” e mantém a raiz lexical de “guias”.
- source_word: ἀμφότεροι
  choice: ambos
  rationale: Equivalente direto, conciso e natural, que inclui as duas pessoas mencionadas.
- source_word: εἰς βόθυνον
  choice: numa cova
  rationale: βόθυνος pode designar cova, fosso ou buraco. “Cova” conserva a imagem ampla de uma depressão em que alguém cai.
- source_word: πεσοῦνται
  choice: cairão
  rationale: Expressa diretamente o resultado futuro enunciado pelo verbo grego.
theological_decisions:
- issue: Força metafórica de “cegos”
  choice: Manter “cegos” sem acrescentar uma explicação espiritual no texto principal.
  alternative: “espiritualmente cegos” ou “líderes sem discernimento”
  rationale: O grego apresenta uma metáfora vívida e não explicita seu referente. Expandi-la resolveria interpretativamente uma imagem que o texto preserva.
- issue: Gênero e alcance do provérbio
  choice: Usar o substantivo masculino singular “um cego ... outro cego”, com nota sobre seu valor representativo.
  alternative: “uma pessoa cega ... outra pessoa cega”
  rationale: O grego emprega o masculino singular em formulação proverbial e representativa. A tradução conserva essa forma, enquanto a nota esclarece que a aplicação é geral.
- issue: Relação entre as orações marcada por δέ
  choice: Traduzir por “E”.
  alternative: “Mas”
  rationale: δὲ pode marcar contraste leve ou simples progressão. Aqui a segunda oração desenvolve em forma proverbial a afirmação anterior; “E” mantém essa continuidade sem excluir a nuance de transição.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A redação conserva a concisão proverbial, a repetição de “cego” e a metáfora do original. Todos os marcadores de nota aparecem no texto principal.
