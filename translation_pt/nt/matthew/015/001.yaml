base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/001.yaml
  text: Then Pharisees and scribes from Jerusalem come to Jesus[a], saying[b],
translation:
  language: pt
  text: 'Então, fariseus e escribas[b] de Jerusalém aproximam-se de Jesus[a] e dizem:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dirigem-se a Jesus».'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, «escribas» também pode ser entendido como «especialistas na Lei» ou «mestres da Lei».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Funciona como marcador temporal e discursivo, introduzindo o episódio seguinte de modo natural e conciso.
- source_word: προσέρχονται
  choice: aproximam-se de
  rationale: Expressa o movimento em direção a Jesus e conserva o presente histórico do grego; a forma pronominal é natural em português.
- source_word: τῷ Ἰησοῦ
  choice: de Jesus
  rationale: Com «aproximar-se», a regência portuguesa exige «de» para indicar a pessoa de quem eles se aproximam.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: vindos de Jerusalém
  rationale: Indica claramente a origem dos fariseus e escribas sem acrescentar a ideia não expressa de que fossem uma delegação oficial.
- source_word: Φαρισαῖοι
  choice: fariseus
  rationale: Designação histórica e religiosa consagrada em português.
- source_word: γραμματεῖς
  choice: escribas
  rationale: Preserva o termo histórico tradicional e sua amplitude lexical; a função de especialistas ou mestres da Lei é apresentada em nota.
- source_word: καὶ
  choice: e
  rationale: Coordena de modo simples os dois grupos e, em português, também liga a aproximação ao ato de falar.
- source_word: λέγοντες
  choice: e dizem
  rationale: Transforma o particípio grego em oração coordenada natural em português, conserva o presente histórico e introduz diretamente a fala do versículo seguinte.
theological_decisions:
- issue: Presente histórico na narrativa
  choice: Conservar o presente («aproximam-se», «dizem»)
  alternative: Empregar o pretérito («aproximaram-se», «disseram»)
  rationale: O grego usa o presente histórico para dar vivacidade ao relato. O presente também é compreensível e natural neste contexto em português, por isso foi preservado.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, sem mudar a relação entre os grupos, sua procedência e sua aproximação de Jesus.
