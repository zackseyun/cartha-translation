base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: pt
  text: 'E os discípulos lhe disseram: “De onde conseguiremos, neste lugar deserto, tantos pães que deem para saciar uma multidão tão grande?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: disseram
  rationale: O presente histórico grego é vertido naturalmente pelo pretérito perfeito na narrativa em português.
- source_word: οἱ μαθηταί
  choice: os discípulos
  rationale: O artigo identifica o grupo já conhecido no contexto; não é necessário acrescentar “seus”, ausente do grego.
- source_word: Πόθεν ἡμῖν
  choice: De onde conseguiremos
  rationale: Expressa de modo idiomático a pergunta pela origem ou obtenção do alimento, incorporando o dativo ἡμῖν na primeira pessoa do plural.
- source_word: ἐν ἐρημίᾳ
  choice: neste lugar deserto
  rationale: ἐρημία designa uma região erma ou desabitada; “lugar deserto” é claro sem sugerir necessariamente um deserto arenoso, e “neste” explicita naturalmente a situação imediata.
- source_word: ἄρτοι τοσοῦτοι
  choice: tantos pães
  rationale: Preserva o plural concreto ἄρτοι e a correlação quantitativa de τοσοῦτοι com ὄχλον τοσοῦτον.
- source_word: ὥστε χορτάσαι
  choice: que deem para saciar
  rationale: Reproduz em português corrente a ideia de quantidade suficiente para produzir o resultado indicado pelo infinitivo.
- source_word: χορτάσαι
  choice: saciar
  rationale: O verbo indica alimentar até a satisfação, não apenas oferecer comida.
- source_word: ὄχλον τοσοῦτον
  choice: uma multidão tão grande
  rationale: Traduz de forma natural o substantivo coletivo e a intensidade de τοσοῦτον.
