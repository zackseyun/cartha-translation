  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: pt
  text: 'Então Jesus lhe respondeu: “Ó mulher, grande é a sua fé![a] Seja feito para você conforme deseja.” E a filha dela foi curada desde aquela hora.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grande é a sua confiança”. A palavra grega πίστις também pode transmitir a ideia de confiança ou fidelidade, embora “fé” seja a tradução mais adequada aqui.
    reason: lexical_alternative
  - marker: b
    text: Ou “desde aquele momento”. O grego diz literalmente “desde aquela hora”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca a sequência temporal e liga a resposta de Jesus ao diálogo anterior de modo natural em português.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτῇ
  choice: lhe respondeu
  rationale: A combinação grega é uma fórmula narrativa de introdução da fala; uma única forma verbal evita uma duplicação pouco natural e preserva αὐτῇ por meio de “lhe”.
- source_word: Ὦ γύναι
  choice: Ó mulher
  rationale: Preserva tanto a partícula enfática do vocativo quanto o sentido direto de γύναι. No contexto, é uma forma solene de tratamento, não uma expressão de desprezo.
- source_word: μεγάλη σου ἡ πίστις
  choice: grande é a sua fé
  rationale: Mantém a ênfase da ordem grega, que coloca “grande” em destaque, sem deixar de soar natural e digna em português.
- source_word: πίστις
  choice: fé
  rationale: É a correspondência padrão neste contexto, no qual Jesus elogia a confiança demonstrada pela mulher; “confiança” continua sendo uma nuance lexical possível e é registrada em nota.
- source_word: γενηθήτω σοι
  choice: Seja feito para você
  rationale: Conserva a forma passiva e a força imperativa e declarativa do pronunciamento de Jesus; “para você” expressa o valor beneficiário do dativo σοι.
- source_word: ὡς θέλεις
  choice: como deseja
  rationale: Expressa a vontade ou o desejo da mulher em registro natural e respeitoso.
- source_word: ἰάθη
  choice: foi curada
  rationale: Traduz diretamente o aoristo passivo de ἰάομαι no contexto de cura.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: desde aquela hora
  rationale: Preserva a expressão temporal do grego, inclusive sua referência literal a “hora”, enquanto a nota registra a equivalência idiomática “momento”.
theological_decisions:
- issue: Sentido de πίστις no elogio de Jesus
  choice: fé
  alternative: confiança
  rationale: O contexto destaca a dependência confiante da mulher em Jesus. “Fé” preserva a formulação teologicamente reconhecível sem excluir a nuance relacional de “confiança”, apresentada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O texto mantém um tom digno e levemente solene no vocativo “Ó mulher” e na declaração “Seja feito para você”, sem introduzir explicações denominacionais.
