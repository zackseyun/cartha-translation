id: MAT.15.32
reference: Matthew 15:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: pt
  text: 'Então Jesus chamou seus discípulos para junto de si e disse: “Tenho compaixão da multidão, porque já faz três dias que permanecem comigo e não têm o que comer. Não quero mandá-los embora sem comer[a], para que não desfaleçam pelo caminho[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em jejum”. Aqui, a expressão indica que estavam sem alimento, não necessariamente que praticavam um jejum religioso.
    reason: lexical_alternative
  - marker: b
    text: Ou “percam as forças pelo caminho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: chamou ... para junto de si
  rationale: 'Preserva a nuance direcional do particípio médio: Jesus chama os discípulos para perto de si.'
- source_word: Σπλαγχνίζομαι
  choice: Tenho compaixão
  rationale: Expressa de modo natural e digno a profunda compaixão indicada pelo verbo grego.
- source_word: ὄχλον
  choice: multidão
  rationale: Equivalente corrente e adequado ao grupo numeroso reunido em torno de Jesus.
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: já faz três dias que permanecem comigo
  rationale: Reproduz tanto a duração quanto a ideia de continuarem junto de Jesus, em português natural.
- source_word: τί φάγωσιν
  choice: não têm o que comer
  rationale: Equivalente idiomático claro para a falta de alimento.
- source_word: ἀπολῦσαι
  choice: mandá-los embora
  rationale: Corresponde naturalmente ao ato de dispensar a multidão reunida.
- source_word: νήστεις
  choice: sem comer
  rationale: Mantém a ideia de estarem sem alimento sem sugerir necessariamente um jejum religioso voluntário.
- source_word: μήποτε
  choice: para que não
  rationale: Expressa em português corrente o resultado temido, sem recorrer a uma construção arcaizante.
- source_word: ἐκλυθῶσιν
  choice: desfaleçam
  rationale: Comunica a possibilidade de perderem as forças ou desmaiarem durante o trajeto.
- source_word: ἐν τῇ ὁδῷ
  choice: pelo caminho
  rationale: Forma idiomática que se refere ao percurso de volta.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações foi mantida próxima do grego, mas com construções idiomáticas naturais. Evitou-se interpretar νήστεις como jejum religioso e preservou-se em ἐκλυθῶσιν a possibilidade de desfalecimento ou perda grave de forças.
