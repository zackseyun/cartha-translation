id: MAT.15.27
reference: Matthew 15:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ δὲ εἶπεν· Ναί, κύριε, καὶ γὰρ τὰ κυνάρια ἐσθίει ἀπὸ τῶν ψιχίων τῶν πιπτόντων ἀπὸ τῆς τραπέζης τῶν κυρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/027.yaml
  text: She said[a], “Yes, Lord[b], for even the little dogs eat from the crumbs that fall from their masters’ table.”
translation:
  language: pt
  text: 'Ela, porém, disse: “Sim, Senhor[a], pois até os cachorrinhos comem das migalhas que caem da mesa de seus donos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Senhor” também pode ser entendido aqui como uma forma respeitosa de tratamento; o termo grego permite ambas as nuances.
    reason: alternative_reading
lexical_decisions:
- source_word: Ναί
  choice: Sim
  rationale: É a resposta afirmativa mais direta e natural em português, preservando a concordância da mulher com a declaração anterior de Jesus.
- source_word: κύριε
  choice: Senhor
  rationale: Preserva tanto a forma respeitosa de tratamento quanto a possível profundidade cristológica do termo no Evangelho de Mateus.
- source_word: καὶ γὰρ
  choice: pois até
  rationale: “Pois” comunica a função explicativa, e “até” expressa a força aditiva e intensificadora do argumento.
- source_word: κυνάρια
  choice: cachorrinhos
  rationale: Reproduz a forma diminutiva grega e sugere pequenos cães domésticos, sem transformar a imagem especificamente em filhotes.
- source_word: ἐσθίει
  choice: comem
  rationale: O sujeito neutro plural grego admite verbo no singular, mas o português exige naturalmente a concordância no plural.
- source_word: ψιχίων
  choice: migalhas
  rationale: É o equivalente corrente e preciso para pequenos fragmentos de comida que caem da mesa.
- source_word: τῶν πιπτόντων
  choice: que caem
  rationale: A oração relativa é natural em português e preserva o sentido geral ou contínuo do particípio presente.
- source_word: τραπέζης
  choice: mesa
  rationale: Mantém o sentido comum do termo e a imagem doméstica central à comparação.
- source_word: τῶν κυρίων αὐτῶν
  choice: de seus donos
  rationale: No interior da metáfora, o termo designa as pessoas a quem pertencem os cães. “Donos” é claro e idiomático em português, distinguindo esse uso do tratamento “Senhor” dirigido a Jesus.
theological_decisions:
- issue: Tradução de κύριε no tratamento direto a Jesus
  choice: Senhor
  alternative: senhor; meu senhor
  rationale: “Senhor” conserva a possibilidade de ser tanto um tratamento respeitoso quanto um reconhecimento mais profundo da autoridade de Jesus, sem decidir silenciosamente entre essas nuances.
- issue: Força diminutiva de κυνάρια
  choice: cachorrinhos
  alternative: cães; cachorros; cães domésticos; filhotes
  rationale: A forma diminutiva deve ser visível, pois evita tornar a metáfora mais áspera do que o grego, mas “cachorrinhos” não exige que sejam filhotes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “Ela, porém, disse” reflete o contraste marcado por δέ sem soar artificial. “Cachorrinhos” preserva o diminutivo; “donos” é mais natural que “senhores” na relação com animais e evita uma repetição ambígua.
