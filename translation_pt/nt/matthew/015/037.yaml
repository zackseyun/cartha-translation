source:
  edition: SBLGNT
  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ⸂τὸ περισσεῦον τῶν κλασμάτων ἦραν⸃ ἑπτὰ σπυρίδας πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/037.yaml
  text: And they all ate and were satisfied[a], and they picked up seven full baskets of the leftover pieces.
translation:
  language: pt
  text: Todos comeram e ficaram satisfeitos, e recolheram sete cestos[a] cheios dos pedaços que sobraram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego aqui traduzido como “cestos” pode designar cestos grandes, maiores que os mencionados em alguns outros relatos de multiplicação de alimentos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: comeram
  rationale: O aoristo de ἐσθίω significa diretamente “comeram”; como o grego não expressa objeto, a tradução também o omite.
- source_word: πάντες
  choice: Todos
  rationale: Preserva o alcance universal da referência à multidão e soa natural em português.
- source_word: ἐχορτάσθησαν
  choice: ficaram satisfeitos
  rationale: χορτάζω, neste contexto, indica que comeram até ficarem saciados; “ficaram satisfeitos” comunica isso em linguagem corrente sem ampliar indevidamente o texto.
- source_word: τὸ περισσεῦον
  choice: que sobraram
  rationale: O particípio substantivado designa aquilo que restou; em português, sua relação com κλασμάτων é expressa naturalmente pela oração “dos pedaços que sobraram”.
- source_word: κλασμάτων
  choice: pedaços
  rationale: Refere-se aos pedaços quebrados de alimento, provavelmente pão, que restaram; “pedaços” é claro e atual.
- source_word: ἦραν
  choice: recolheram
  rationale: αἴρω pode significar levantar ou apanhar; no contexto da coleta das sobras, “recolheram” é a opção mais natural.
- source_word: ἑπτὰ
  choice: sete
  rationale: Tradução direta do numeral cardinal.
- source_word: σπυρίδας
  choice: cestos
  rationale: σπυρίς designa um cesto e pode indicar um recipiente relativamente grande; “cestos” mantém a leitura fluida, enquanto a possível nuance de tamanho é registrada em nota.
- source_word: πλήρεις
  choice: cheios
  rationale: Adjetivo predicativo que descreve os sete cestos como cheios; a tradução é direta.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e ampla legibilidade brasileira. A formulação conserva a sequência narrativa e não explicita que os pedaços eram de pão, pois isso não aparece neste versículo.
