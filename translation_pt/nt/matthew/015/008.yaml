base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: pt
  text: Este povo me honra com os lábios, mas o coração deles está longe de mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os corações deles”. O grego traz “coração” no singular, provavelmente em sentido coletivo, referindo-se ao povo como um todo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: Este povo
  rationale: Preserva o demonstrativo οὗτος e o sentido coletivo de λαός, além de manter o tom da citação profética.
- source_word: τοῖς χείλεσίν
  choice: com os lábios
  rationale: O dativo tem valor instrumental. A formulação conserva a imagem corporal concreta sem substituí-la por “palavras” ou “fala”.
- source_word: με
  choice: me
  rationale: É o objeto direto de τιμᾷ e se traduz naturalmente pelo pronome “me”.
- source_word: τιμᾷ
  choice: honra
  rationale: Expressa a ideia de prestar honra, sem intensificar o sentido para “glorifica”.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: mas o coração deles
  rationale: Mantém o singular καρδία e seu provável uso coletivo, enquanto δέ introduz o contraste expresso por “mas”.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: está longe de mim
  rationale: Forma portuguesa natural que comunica tanto a distância figurada quanto a separação relacional indicada pela construção grega.
theological_decisions:
- issue: Singular coletivo “coração” ou plural distributivo
  choice: 'Manter o singular: “o coração deles”'
  alternative: “os corações deles”
  rationale: O grego emprega καρδία no singular e apresenta o povo coletivamente como tendo uma disposição interior comum. A tradução conserva essa força retórica sem excluir que a afirmação se aplique aos indivíduos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “O coração deles” preserva o singular coletivo do original sem soar excessivamente rígido; a alternativa idiomática no plural é registrada em nota.
