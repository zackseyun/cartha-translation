  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἔστιν καλὸν λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ βαλεῖν τοῖς κυναρίοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/026.yaml
  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: pt
  text: 'Mas ele respondeu: “Não é certo tomar o pão dos filhos e jogá-lo aos cachorrinhos[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cães domésticos” ou “filhotes”; o grego emprega uma forma diminutiva de “cães”, possivelmente com a nuance de cães pequenos ou domésticos.
    reason: Alternativa lexical para κυναρίοις e explicação cautelosa de sua forma diminutiva.
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: respondeu
  rationale: A construção com particípio e verbo finito é uma expressão grega comum, influenciada pelo uso semítico. Em português, “respondeu” transmite de modo natural sua força responsiva.
- source_word: καλὸν
  choice: certo
  rationale: Neste contexto, καλόν indica o que é apropriado ou correto, não apenas o que é moralmente bom. “Certo” expressa o sentido idiomático em português atual.
- source_word: λαβεῖν
  choice: tomar
  rationale: O infinitivo indica pegar ou tomar algo; “tomar” preserva o sentido direto e combina naturalmente com a imagem do pão.
- source_word: ἄρτον
  choice: pão
  rationale: “Pão” é o equivalente lexical direto e mantém intacta a imagem metafórica.
- source_word: τέκνων
  choice: dos filhos
  rationale: τέκνα designa os filhos de modo inclusivo quanto ao gênero. “Dos filhos” preserva tanto a relação familiar quanto a construção genitiva.
- source_word: βαλεῖν
  choice: jogá-lo
  rationale: βάλλω significa literalmente lançar ou jogar. “Jogá-lo” conserva a vivacidade da imagem e explicita de modo natural em português que o objeto é o pão.
- source_word: κυναρίοις
  choice: aos cachorrinhos
  rationale: A forma diminutiva pode sugerir cães pequenos ou domésticos. “Cachorrinhos” preserva o diminutivo sem substituir a metáfora por uma explicação.
theological_decisions:
- issue: Como traduzir a metáfora dos filhos e dos cães sem atenuar sua força nem explicar implicitamente seus referentes étnicos ou seu tom.
  choice: Manter diretamente “o pão dos filhos” e “aos cachorrinhos”.
  alternative: Traduzir como “o pão das crianças” e “aos cães de casa”, ou suavizar “jogar” para “dar”.
  rationale: O versículo não identifica explicitamente os referentes da metáfora nem resolve sua tensão. A tradução conserva suas imagens e sua força, deixando a interpretação ao contexto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Jogá-lo” é mais corrente do que “lançá-lo”, enquanto “tomar o pão” mantém um tom adequado ao provérbio. O marcador da nota foi colocado junto ao termo a que ela se refere.
