id: MAT.15.18
reference: Matthew 15:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὰ δὲ ἐκπορευόμενα ἐκ τοῦ στόματος ἐκ τῆς καρδίας ἐξέρχεται, κἀκεῖνα κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: pt
  text: Mas as coisas que saem da boca vêm do coração, e são elas que tornam o ser humano impuro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contaminam o homem”. O grego emprega “o homem” no singular como representante do ser humano em geral.'
    reason: Registra a alternativa lexical para κοινοῖ e a forma representativa singular de τὸν ἄνθρωπον.
lexical_decisions:
- source_word: τὰ ... ἐκπορευόμενα
  choice: as coisas que saem
  rationale: O particípio neutro plural é substantivado e se refere, de modo geral, ao que é expresso pela boca. A formulação mantém o plural e a imagem concreta, sem restringir prematuramente o sentido apenas a palavras.
- source_word: ἐκ τοῦ στόματος
  choice: da boca
  rationale: Tradução direta e natural que preserva a imagem corporal e, no contexto, aponta para aquilo que a pessoa expressa.
- source_word: ἐκ τῆς καρδίας
  choice: do coração
  rationale: Mantém a metáfora bíblica do coração como centro da vida interior, incluindo pensamentos, desejos e intenções morais.
- source_word: ἐξέρχεται
  choice: vêm
  rationale: Embora o verbo grego esteja no singular com sujeito neutro plural, o português exige aqui concordância plural. “Vêm do coração” expressa naturalmente a origem.
- source_word: κἀκεῖνα
  choice: e são elas
  rationale: Retoma enfaticamente “as coisas que saem da boca” e preserva a força anafórica de “e aquelas” em português corrente.
- source_word: κοινοῖ
  choice: tornam ... impuro
  rationale: No contexto de pureza e impureza, o verbo significa tornar alguém impuro ou contaminado. A construção explicita o resultado sem reduzir o termo a sujeira física.
- source_word: τὸν ἄνθρωπον
  choice: o ser humano
  rationale: Ἄνθρωπος é usado como singular representativo e se refere genericamente à pessoa humana, não especificamente a um indivíduo do sexo masculino. “O ser humano” conserva o singular e torna explícito esse alcance geral.
theological_decisions:
- issue: Origem interior da impureza moral
  choice: A impureza é apresentada como procedente do coração e manifestada pelo que sai da boca.
  alternative: Entender o versículo apenas como referência técnica à impureza ritual produzida pela fala.
  rationale: O contraste do contexto é entre o que entra pela boca e o que procede do interior. “Coração” e “tornam impuro” preservam tanto a linguagem de pureza quanto sua aplicação moral, sem dissolver a tensão entre ambas.
- issue: Alcance de τὸν ἄνθρωπον
  choice: o ser humano
  alternative: o homem
  rationale: O substantivo singular tem função representativa e genérica. A opção principal comunica esse alcance com clareza no português moderno, enquanto a forma mais literal “o homem” é registrada na nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição concreta de “coisas” conserva o plural grego; “são elas” evita uma construção excessivamente literal e mantém a ênfase do pronome grego.
