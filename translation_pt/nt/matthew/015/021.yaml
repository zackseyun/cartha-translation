base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/021.yaml
  text: And Jesus went out from there and withdrew to the region of Tyre and Sidon[a].
translation:
  language: pt
  text: E, saindo dali, Jesus retirou-se para a região de Tiro e Sidom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “partiu para o território de Tiro e Sidom”. O verbo grego também admite uma tradução mais neutra, mas “retirou-se” reflete seu uso recorrente em Mateus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Mantém a ligação narrativa simples com o contexto anterior, sem acrescentar ênfase interpretativa.
- source_word: ἐξελθὼν
  choice: saindo
  rationale: O particípio aoristo indica uma ação associada e anterior ao verbo principal. A forma portuguesa é natural e preserva a imagem concreta de sair.
- source_word: ἐκεῖθεν
  choice: dali
  rationale: Expressa de modo idiomático a partida do lugar mencionado no contexto anterior.
- source_word: ἀνεχώρησεν
  choice: retirou-se
  rationale: Preserva a nuance recorrente de ἀναχωρέω em Mateus — afastar-se ou retirar-se — sem sugerir necessariamente fuga ou derrota.
- source_word: εἰς τὰ μέρη
  choice: para a região
  rationale: Comunica deslocamento para a área ligada às duas cidades, sem afirmar que Jesus entrou especificamente nelas.
- source_word: Τύρου καὶ Σιδῶνος
  choice: de Tiro e Sidom
  rationale: Os genitivos identificam a região associada às cidades fenícias. Empregam-se as formas portuguesas tradicionais e amplamente reconhecidas dos topônimos.
theological_decisions:
- issue: Nuance narrativa do deslocamento de Jesus para uma região associada aos gentios
  choice: Traduzir ἀνεχώρησεν por “retirou-se”, sem explicitar o motivo.
  alternative: Traduzir de modo mais neutro por “partiu” ou, mais intensamente, por “recuou”.
  rationale: O verbo pode sugerir uma retirada deliberada no uso de Mateus, mas o versículo não declara a razão do deslocamento. A tradução preserva essa nuance sem atribuir a Jesus uma motivação psicológica ou teológica não expressa.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla inteligibilidade brasileira. “Retirou-se” conserva a nuance do verbo sem soar arcaico; “região” evita o literalismo pouco natural de “partes”.
