  text: ὑποκριταί, καλῶς ἐπροφήτευσεν περὶ ὑμῶν Ἠσαΐας λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: pt
  text: 'Hipócritas! Isaías profetizou corretamente a respeito de vocês, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκριταί
  choice: Hipócritas!
  rationale: Vocativo plural e repreensão direta. “Hipócritas” preserva a força moral e religiosa do termo; o ponto de exclamação torna explícita, em português natural, a intensidade do chamado sem acrescentar conteúdo lexical.
- source_word: καλῶς
  choice: corretamente
  rationale: Advérbio que qualifica ἐπροφήτευσεν e indica que a profecia de Isaías se aplica de modo acertado aos interlocutores. “Corretamente” é claro e atual; “bem” poderia ser entendido apenas como avaliação de estilo ou modo.
- source_word: ἐπροφήτευσεν
  choice: profetizou
  rationale: Forma verbal direta e consagrada em português, preservando o registro profético e a identificação de Isaías como profeta.
- source_word: περὶ ὑμῶν
  choice: a respeito de vocês
  rationale: Expressa naturalmente περί com genitivo no português internacional de leitura brasileira. Mantém a referência aos interlocutores sem a formalidade mais marcada de “acerca de vós”.
- source_word: Ἠσαΐας
  choice: Isaías
  rationale: Forma tradicional e amplamente reconhecida do nome do profeta em português.
- source_word: λέγων
  choice: 'dizendo:'
  rationale: O particípio presente introduz a citação seguinte. “Dizendo:” reproduz essa função de modo conciso e natural.
theological_decisions:
- issue: Força da interpelação de Jesus
  choice: 'Repreensão condenatória direta: “Hipócritas!”'
  alternative: Uma formulação atenuada, como “Fingidos” ou “Vocês são hipócritas”
  rationale: O vocativo grego ὑποκριταί formula uma acusação moral-religiosa forte. Atenuá-lo enfraqueceria o juízo de Jesus e sua ligação com a citação de Isaías.
- issue: Sentido de καλῶς aplicado à profecia
  choice: “profetizou corretamente a respeito de vocês”
  alternative: “profetizou bem a respeito de vocês”
  rationale: A escolha comunica que as palavras proféticas se aplicam acertadamente aos interlocutores, sem sugerir que Jesus avalia apenas a qualidade retórica da profecia.
translation_notes:
  register: Português moderno, digno e direto, com ampla inteligibilidade internacional e leitura natural no Brasil. Evita “vós” e construções excessivamente formais. A pontuação destaca a força do vocativo e os dois-pontos introduzem a citação subsequente.
