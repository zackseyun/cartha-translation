  text: Καὶ μεταβὰς ἐκεῖθεν ὁ Ἰησοῦς ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας, καὶ ἀναβὰς εἰς τὸ ὄρος ἐκάθητο ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/029.yaml
  text: And departing from there[a], Jesus came along the Sea of Galilee, and after going up on the mountain[b], he sat there.
translation:
  language: pt
  text: Saindo dali, Jesus seguiu ao longo do mar da Galileia[a] e, depois de subir ao monte, estava sentado ali[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi para junto do mar da Galileia”. A preposição grega pode indicar tanto movimento ao longo da margem como chegada a um lugar junto dela.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sentou-se ali”. O verbo grego está no imperfeito e pode destacar o estado contínuo de estar sentado; em português, o passado simples também é possível neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: Saindo dali
  rationale: O particípio aoristo indica a partida do lugar anterior antes da ação principal. “Saindo dali” conserva a sequência narrativa de modo natural e conciso em português.
- source_word: ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: seguiu ao longo do mar da Galileia
  rationale: Com um verbo de movimento, παρά com acusativo pode indicar deslocamento ao longo de um lugar ou chegada às suas proximidades. “Seguiu ao longo” expressa o movimento sem transformar a expressão em localização puramente estática.
- source_word: ἀναβὰς εἰς τὸ ὄρος
  choice: depois de subir ao monte
  rationale: O particípio aoristo apresenta a subida como anterior ao estado descrito em seguida. “Subir ao monte” é idiomático em português e mantém o artigo grego sem sugerir que se trate necessariamente de um monte nomeado.
- source_word: ἐκάθητο ἐκεῖ
  choice: ficou sentado ali
  rationale: O imperfeito de κάθημαι descreve Jesus em estado contínuo de estar sentado. “Ficou sentado” preserva melhor essa duração no contexto sequencial do que o simples “sentou-se”, sem a estranheza que “estava sentado” poderia produzir após “depois de subir”.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluidez brasileira. “Mar da Galileia” preserva a designação tradicional; “ali” retoma naturalmente o monte. As notas mantêm abertas as ambiguidades legítimas da preposição παρά e do aspecto imperfeito de ἐκάθητο.
