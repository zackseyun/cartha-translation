  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: Mas Pedro lhe disse
  rationale: A construção semítica ‘respondendo... disse’ é condensada em português natural. ‘Mas’ representa o desenvolvimento levemente contrastivo de δέ, e ‘lhe’ preserva αὐτῷ sem tornar a frase pesada.
- source_word: Φράσον
  choice: Explica-nos
  rationale: O imperativo de φράζω pede que o sentido seja exposto ou esclarecido; ‘explica-nos’ expressa isso com clareza e naturalidade.
- source_word: τὴν παραβολὴν ταύτην
  choice: esta parábola
  rationale: ‘Parábola’ preserva a terminologia característica dos Evangelhos, enquanto ‘esta’ aponta para a declaração figurada imediatamente anterior.
