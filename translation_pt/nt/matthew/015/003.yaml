id: MAT.15.3
reference: Matthew 15:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: pt
  text: 'Mas ele lhes respondeu: “Por que vocês também transgridem o mandamento de Deus por causa da tradição de vocês?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Mas ele lhes respondeu
  rationale: A construção participial seguida de verbo finito é uma expressão grega de influência semítica. Em português, “lhes respondeu” comunica naturalmente os dois elementos sem a redundância pouco idiomática de “respondendo, disse-lhes”; δέ marca a resposta adversativa.
- source_word: Διὰ τί
  choice: Por que
  rationale: Equivalente interrogativo natural para a pergunta de causa ou motivo.
- source_word: καὶ ὑμεῖς
  choice: vocês também
  rationale: 'Preserva a correspondência retórica com a acusação anterior: os interlocutores igualmente incorrem em transgressão.'
- source_word: παραβαίνετε
  choice: transgridem
  rationale: Expressa ultrapassar ou violar uma ordem. “Transgridem” mantém a força jurídica e religiosa do verbo e continua compreensível no registro bíblico moderno.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: o mandamento de Deus
  rationale: “Mandamento” preserva o registro bíblico e o contraste explícito entre a ordem divina e a tradição dos interlocutores.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: por causa da tradição de vocês
  rationale: διά com acusativo indica aqui causa ou motivo. A formulação é natural e evita atribuir, de modo mais interpretativo, a ideia de benefício ou finalidade que “em favor de” poderia sugerir.
theological_decisions:
- issue: Contraste entre a autoridade divina e a tradição humana
  choice: manter “mandamento de Deus” em contraste com “tradição de vocês”
  alternative: usar “ordem de Deus” e “costume de vocês”
  rationale: A tradução conserva o contraste direto do texto sem transformar a repreensão específica dessa tradição numa condenação geral de toda tradição.
- issue: Valor de διὰ com acusativo
  choice: por causa da tradição de vocês
  alternative: em favor da tradição de vocês
  rationale: A leitura causal é gramaticalmente sólida e preserva a relação entre a tradição e a transgressão sem decidir que o ato foi necessariamente praticado para promover ou proteger a tradição.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O pronome “vocês” explicita o plural de ὑμεῖς; “tradição de vocês” evita a possível ambiguidade regional de “sua tradição”. Nenhum marcador de nota foi inserido porque a alternativa inglesa fornecida não corresponde à posição do marcador e não acrescenta uma distinção relevante em português.
