id: MAT.15.19
reference: Matthew 15:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῆς καρδίας ἐξέρχονται διαλογισμοὶ πονηροί, φόνοι, μοιχεῖαι, πορνεῖαι, κλοπαί, ψευδομαρτυρίαι, βλασφημίαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/019.yaml
  text: For out of the heart come evil thoughts[a], murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.
translation:
  language: pt
  text: Pois do coração saem maus pensamentos, assassinatos, adultérios, imoralidades sexuais, furtos, falsos testemunhos e difamações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “blasfêmias”. O termo grego pode se referir tanto à difamação de pessoas quanto à fala blasfema contra Deus, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ τῆς καρδίας
  choice: Pois do coração
  rationale: “Pois” preserva a força explicativa de γάρ, e “do coração” mantém a imagem de origem expressa por ἐκ e o sentido bíblico de καρδία como o interior da pessoa.
- source_word: ἐξέρχονται
  choice: saem
  rationale: Expressa de modo natural e direto a ideia de algo que procede ou emerge de uma fonte interior.
- source_word: διαλογισμοὶ πονηροί
  choice: maus pensamentos
  rationale: Preserva a amplitude de διαλογισμοί, que pode indicar pensamentos, raciocínios ou deliberações, sem restringi-lo a planos premeditados.
- source_word: φόνοι
  choice: assassinatos
  rationale: Comunica atos ilícitos de matar com maior precisão moral do que o termo mais amplo “mortes” e com mais clareza comum do que “homicídios”.
- source_word: μοιχεῖαι
  choice: adultérios
  rationale: Equivalente direto que conserva o plural e a estrutura da lista de vícios.
- source_word: πορνεῖαι
  choice: imoralidades sexuais
  rationale: Representa a abrangência do termo para condutas sexuais ilícitas e conserva seu plural, evitando o sentido excessivamente estreito de “fornicações”.
- source_word: κλοπαί
  choice: furtos
  rationale: Equivalente conciso e corrente para atos de subtração, preservando o plural da lista.
- source_word: ψευδομαρτυρίαι
  choice: falsos testemunhos
  rationale: Mantém tanto o plural quanto a dimensão testemunhal ou jurídica do termo.
- source_word: βλασφημίαι
  choice: difamações
  rationale: Neste catálogo geral de males, o termo pode designar fala injuriosa ou difamatória contra pessoas. A alternativa tradicional “blasfêmias”, especialmente aplicável à fala contra Deus, é mantida em nota para preservar a ambiguidade lexical.
theological_decisions:
- issue: Alcance de βλασφημίαι na lista de vícios
  choice: difamações
  alternative: blasfêmias
  rationale: O contexto não especifica que a fala seja dirigida contra Deus. “Difamações” comunica o sentido interpessoal possível, enquanto a nota conserva explicitamente o sentido religioso tradicional e evita resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase preserva a imagem do coração como fonte, e os substantivos no plural mantêm o ritmo do catálogo grego.
