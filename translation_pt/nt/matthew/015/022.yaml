- from: 'E eis que uma mulher cananeia, que tinha saído daquela região, clamava: “Senhor, Filho de Davi, tem misericórdia de mim! Minha filha está terrivelmente atormentada por um demônio.”[a]'
  to: 'E eis que uma mulher cananeia, vinda daquelas regiões, clamava, dizendo: “Senhor, Filho de Davi, tem misericórdia de mim! Minha filha está terrivelmente atormentada por um demônio.”[a]'
