review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a mulher como «cananeia», o apelo messiânico «Senhor, Filho de Davi», o imperativo por misericórdia e o aspecto durativo de ἔκραζεν em «clamava». Contudo, «que tinha saído daquela região» introduz uma anterioridade desnecessária e reduz o plural τῶν ὁρίων ἐκείνων; «vinda daquelas regiões» representa de modo mais direto e natural a procedência expressa pelo particípio ἐξελθοῦσα.
  naturalness: O registro é claro, digno e amplamente legível. «E eis que» é uma opção marcada, mas apropriada para conservar a função chamativa de ἰδού. A revisão elimina a construção algo pesada «que tinha saído» sem perder a fluência.
  terminology: «Cananeia», «Senhor» e «Filho de Davi» são escolhas corretas. Para δαιμονίζεται, «atormentada por um demônio» é uma possibilidade interpretativamente prudente, desde que a nota preserve a alternativa convencional «endemoninhada/possessa por um demônio» e não apresente a opção principal como descrição clínica definitiva.
  issues:
  - severity: medium
    issue: «que tinha saído daquela região» para ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα
    rationale: O mais-que-perfeito sugere uma ação já concluída em relação ao clamor, nuance que o particípio aoristo não exige; além disso, «daquela região» neutraliza o plural do grego. «Vinda daquelas regiões» conserva a procedência e é idiomático.
  - severity: low
    issue: A tradução não explicita λέγουσα
    rationale: «Clamava» já pode introduzir diretamente a fala em português, portanto não é omissão de sentido material. Ainda assim, «clamava, dizendo» reproduz a articulação narrativa do grego sem comprometer a naturalidade.
