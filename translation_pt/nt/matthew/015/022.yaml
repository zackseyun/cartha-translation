source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/022.yaml
  text: And behold[a], a Canaanite woman from those regions came out and was crying out, saying, “Have mercy on me, Lord, Son of David; my daughter is badly demon-possessed.”
translation:
  language: pt
  text: 'E eis que uma mulher cananeia, vinda daquelas regiões, clamava, dizendo: “Senhor, Filho de Davi, tem misericórdia de mim! Minha filha está terrivelmente atormentada por um demônio.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Minha filha está terrivelmente endemoninhada” ou “está sob severa opressão demoníaca”.'
    reason: Alternativas lexicais para δαιμονίζεται, cujo sentido atribui a condição à ação demoníaca sem especificar plenamente sua natureza.
lexical_decisions:
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Preserva a função de chamar a atenção e a vivacidade narrativa do marcador, em formulação bíblica ainda compreensível em português.
- source_word: Χαναναία
  choice: mulher cananeia
  rationale: Reproduz a designação específica de Mateus e sua evocação da memória histórica de Israel, sem importar “siro-fenícia” do paralelo em Marcos.
- source_word: ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα
  choice: que tinha saído daquela região
  rationale: Expressa naturalmente a ação anterior do particípio aoristo e entende ὅρια como território ou região; o singular coletivo é idiomático em português.
- source_word: ἔκραζεν
  choice: clamava
  rationale: O pretérito imperfeito conserva o aspecto contínuo ou repetido do verbo grego e comunica a intensidade do apelo.
- source_word: Ἐλέησόν με
  choice: tem misericórdia de mim
  rationale: Formulação corrente, digna e reconhecível que preserva o vocabulário bíblico de misericórdia e a urgência do imperativo.
- source_word: κύριε
  choice: Senhor
  rationale: No apelo unido a “Filho de Davi”, mantém a possível força reverencial e messiânica sem reduzi-la a mero tratamento cortês.
- source_word: υἱὸς Δαυίδ
  choice: Filho de Davi
  rationale: Tradução direta que preserva o título davídico e sua relevância messiânica.
- source_word: κακῶς δαιμονίζεται
  choice: está terrivelmente atormentada por um demônio
  rationale: Representa a intensidade de κακῶς e a agência demoníaca indicada por δαιμονίζεται, evitando definir com precisão indevida a natureza da aflição.
theological_decisions:
- issue: Sentido de κύριε no apelo messiânico
  choice: Senhor
  alternative: senhor; mestre
  rationale: A associação imediata com “Filho de Davi” favorece uma forma reverencial elevada. “Senhor” preserva a amplitude possível do grego sem afirmar que a mulher já expressava uma cristologia plenamente desenvolvida.
- issue: Natureza da condição expressa por δαιμονίζεται
  choice: atormentada por um demônio
  alternative: possessa por um demônio
  rationale: O verbo atribui claramente a condição à ação demoníaca, mas não descreve sua fenomenologia com a precisão sugerida por algumas noções modernas de “possessão”. A alternativa tradicional é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “E eis que” mantém deliberadamente a marca narrativa de ἰδοὺ; “clamava” preserva o aspecto contínuo. A ordem do vocativo foi ajustada para soar natural em português, sem alterar a relação entre “Senhor” e “Filho de Davi”.
