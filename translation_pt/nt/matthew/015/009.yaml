  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/009.yaml
  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: pt
  text: Mas é em vão que me adoram, ensinando como doutrinas mandamentos humanos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ensinando mandamentos humanos como doutrinas”.'
    reason: alternative_reading
lexical_decisions:
- source_word: μάτην
  choice: em vão
  rationale: Expressa falta de propósito ou resultado e preserva o tom profético de censura.
- source_word: δὲ
  choice: Mas
  rationale: Marca continuação com leve contraste; “Mas” comunica naturalmente a força de repreensão no contexto.
- source_word: σέβονταί
  choice: adoram
  rationale: O verbo indica reverência ou culto dirigido a uma divindade; “adoram” é claro e idiomático em português.
- source_word: με
  choice: me
  rationale: Mantém diretamente o pronome que, na citação de Isaías, tem Deus como referente.
- source_word: διδάσκοντες
  choice: ensinando
  rationale: Preserva a ligação participial, apresentando a circunstância que caracteriza e explica a adoração vã.
- source_word: διδασκαλίας
  choice: como doutrinas
  rationale: 'Torna clara, em português natural, a relação sintática comprimida: mandamentos humanos recebem status de doutrina.'
- source_word: ἐντάλματα
  choice: mandamentos
  rationale: Conserva o sentido formal e religioso de prescrições autorizadas, além do eco da fonte profética.
- source_word: ἀνθρώπων
  choice: humanos
  rationale: O termo é genérico e contrasta a origem humana com a divina; “humanos” transmite isso sem sugerir referência exclusiva a homens do sexo masculino.
theological_decisions:
- issue: Relação entre διδασκαλίας e ἐντάλματα ἀνθρώπων
  choice: ensinando como doutrinas mandamentos humanos
  alternative: ensinando doutrinas que são mandamentos humanos
  rationale: A formulação escolhida comunica que prescrições de origem humana são ensinadas com autoridade doutrinária, sem ampliar o conteúdo da sintaxe grega comprimida.
- issue: Força genérica de ἀνθρώπων
  choice: humanos
  alternative: de pessoas
  rationale: “Humanos” preserva com precisão o contraste teológico entre aquilo que procede dos seres humanos e aquilo que procede de Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem é natural sem eliminar a relação participial nem a tensão entre autoridade divina e tradição humana.
