id: MAT.15.17
reference: Matthew 15:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀οὐ νοεῖτε ὅτι πᾶν τὸ εἰσπορευόμενον εἰς τὸ στόμα εἰς τὴν κοιλίαν χωρεῖ καὶ εἰς ἀφεδρῶνα ἐκβάλλεται;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/017.yaml
  text: Do you not understand that everything entering into the mouth goes into the stomach and is expelled into the latrine?[a]
translation:
  language: pt
  text: Vocês não entendem que tudo o que entra pela boca vai para o estômago e depois é expelido na latrina?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tudo o que entra pela boca... é eliminado na privada”, ou “vai para o esgoto”.'
    reason: Alternativas lexicais para ἀφεδρών e para a expressão do processo de excreção.
lexical_decisions:
- source_word: νοεῖτε
  choice: entendem
  rationale: Refere-se à compreensão mental do argumento de Jesus; “entendem” é natural e preserva o tom de repreensão da pergunta.
- source_word: πᾶν τὸ εἰσπορευόμενον
  choice: tudo o que entra
  rationale: A construção participial substantivada, neutra e genérica, abrange qualquer coisa ingerida.
- source_word: εἰς τὸ στόμα
  choice: pela boca
  rationale: Embora εἰς expresse movimento para dentro, “entra pela boca” é a formulação fisiológica mais natural em português e conserva a imagem de ingresso.
- source_word: κοιλίαν
  choice: estômago
  rationale: Neste contexto digestivo, “estômago” comunica com clareza o sentido de κοιλία, sem a imprecisão de “ventre”.
- source_word: χωρεῖ
  choice: vai para
  rationale: No contexto, descreve o alimento seguindo para o estômago; “vai para” é claro, corrente e semanticamente adequado.
- source_word: ἀφεδρῶνα
  choice: latrina
  rationale: Designa o lugar de excreção; “latrina” é historicamente plausível, preciso e digno.
- source_word: ἐκβάλλεται
  choice: é expelido
  rationale: Preserva a voz passiva e a ideia física de eliminação expressa pelo verbo.
theological_decisions:
- issue: Relação da declaração de Jesus com as leis de pureza ritual
  choice: Traduzir de modo direto a afirmação fisiológica, sem acrescentar uma fórmula explícita de revogação das leis alimentares.
  alternative: Expandir interpretativamente o versículo para dizer que, assim, todos os alimentos são declarados puros.
  rationale: O versículo descreve o processo digestivo como parte do argumento sobre o que contamina, mas não contém a observação interpretativa de Marcos 7:19. A tradução não deve importar uma conclusão que Mateus não explicita aqui.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O plural “vocês” torna explícita a segunda pessoa plural do grego sem recorrer ao pouco corrente “vós”. “Latrina” evita tanto um coloquialismo excessivo quanto um anacronismo tecnológico.
