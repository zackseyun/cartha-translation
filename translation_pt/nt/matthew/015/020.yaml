id: MAT.15.20
reference: Matthew 15:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ταῦτά ἐστιν τὰ κοινοῦντα τὸν ἄνθρωπον, τὸ δὲ ἀνίπτοις χερσὶν φαγεῖν οὐ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/020.yaml
  text: These are the things that defile the man[b][a], but to eat with unwashed hands does not defile the man.
translation:
  language: pt
  text: São essas as coisas que tornam a pessoa impura[a]; mas comer com as mãos não lavadas não torna a pessoa impura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contaminam a pessoa”. O verbo grego pode indicar tornar alguém ritualmente impuro; aqui, “tornam impura” conserva tanto o contexto de pureza ritual quanto o sentido moral mais amplo do ensino de Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῦντα / κοινοῖ
  choice: tornam / torna ... impura
  rationale: No contexto da controvérsia sobre pureza, κοινόω significa tornar alguém impuro, com alcance tanto ritual quanto moral. A formulação é natural em português e mantém a mesma expressão nas duas ocorrências.
- source_word: ἄνθρωπον
  choice: a pessoa
  rationale: O singular articulado tem sentido representativo e geral. “A pessoa” preserva o singular e comunica claramente que a afirmação vale para qualquer ser humano, sem restringi-la ao sexo masculino.
- source_word: ἀνίπτοις χερσὶν
  choice: sem lavar as mãos
  rationale: Expressão corrente e clara em português para mãos não lavadas, adequada à questão contextual da lavagem ritual.
- source_word: φαγεῖν
  choice: comer
  rationale: O infinitivo português reproduz de modo direto e natural o infinitivo grego.
- source_word: ταῦτά ἐστιν τὰ
  choice: São essas as coisas que
  rationale: Preserva a ênfase demonstrativa e a construção predicativa em linguagem portuguesa natural.
- source_word: δέ
  choice: mas
  rationale: Marca explicitamente o contraste entre aquilo que de fato torna alguém impuro e comer sem lavar as mãos.
theological_decisions:
- issue: Sentido de κοινόω na discussão sobre pureza
  choice: “tornar impura”
  alternative: “contaminar”
  rationale: “Tornar impura” conserva de maneira transparente o pano de fundo ritual, sem excluir a dimensão moral desenvolvida por Jesus no contexto. “Contaminar” é possível, mas pode sugerir sobretudo transmissão física de sujeira ou doença.
- issue: Singular genérico ἄνθρωπον
  choice: “a pessoa”
  alternative: “o homem”
  rationale: O grego emprega um singular representativo para formular uma verdade geral sobre o ser humano. “A pessoa” mantém esse valor singular e genérico em português atual, sem transformar a referência em plural nem atribuir ao termo uma especificidade masculina ausente do sentido contextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “torna a pessoa impura” preserva o contraste retórico do original. O marcador [a] aparece imediatamente após a primeira ocorrência relevante.
