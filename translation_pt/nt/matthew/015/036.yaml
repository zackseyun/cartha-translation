id: MAT.15.36
reference: Matthew 15:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: pt
  text: Ele pegou os sete pães e os peixes e, depois de dar graças[a], partiu-os e foi dando-os aos discípulos; e os discípulos, às multidões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tendo dado graças”. O particípio grego pode ser traduzido mais formalmente dessa maneira.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν
  choice: pegou
  rationale: No contexto, λαμβάνω inicia a ação de Jesus com os alimentos. “Pegou” é natural e concreto em português atual.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: os sete pães
  rationale: Ἄρτος designa aqui unidades concretas de pão. Em português, “sete pães” é mais idiomático do que “sete pães de forma” ou “sete pães inteiros”, que acrescentariam especificidade.
- source_word: τοὺς ἰχθύας
  choice: os peixes
  rationale: O plural “peixes” reproduz naturalmente o substantivo grego e mantém o artigo definido.
- source_word: εὐχαριστήσας
  choice: depois de dar graças
  rationale: O particípio aoristo expressa uma ação anterior a ἔκλασεν. A formulação deixa implícito o destinatário da gratidão, como no grego.
- source_word: ἔκλασεν
  choice: partiu-os
  rationale: “Partiu” comunica a ação de dividir o alimento para distribuição. O pronome explicita em português o objeto recuperado do contexto, sem inserir um novo referente nominal.
- source_word: ἐδίδου
  choice: foi dando-os
  rationale: A perífrase conserva o aspecto progressivo ou reiterado do imperfeito, indicando a distribuição continuada.
- source_word: τοῖς μαθηταῖς
  choice: aos discípulos
  rationale: O dativo identifica os destinatários. Não se acrescenta “seus”, ausente do texto grego.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: e os discípulos, às multidões
  rationale: Mantém-se a elipse do verbo presente no grego, facilmente recuperável da oração anterior. “Multidões” preserva o plural de ὄχλοι.
theological_decisions:
- issue: Possível ressonância eucarística de εὐχαριστήσας
  choice: Traduzir a ação narrativa comum como “depois de dar graças”, sem ampliação sacramental.
  alternative: Empregar linguagem mais litúrgica para realçar possíveis ecos eucarísticos.
  rationale: A formulação pode evocar padrões associados à Ceia do Senhor, mas o versículo narra diretamente uma ação de graças sobre alimentos. A tradução não deve impor uma interpretação sacramental além do que o grego afirma.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A pontuação com ponto e vírgula ajuda a tornar clara a distribuição em duas etapas, preservando a elipse da segunda oração.
