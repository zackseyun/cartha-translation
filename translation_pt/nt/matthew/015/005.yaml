  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: pt
  text: 'Mas vocês dizem: “Quem disser ao pai ou à mãe: ‘É uma oferta[a] tudo aquilo que você poderia receber de mim como ajuda’,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dádiva”. A ideia é que aquilo que poderia ser usado para ajudar os pais é declarado dedicado a Deus; compare Marcos 7:11, que usa o termo “corbã”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Mas vocês dizem
  rationale: δὲ estabelece contraste com o mandamento citado anteriormente; o presente λέγετε descreve o que eles ensinam ou afirmam habitualmente. “Vocês” oferece ampla legibilidade brasileira.
- source_word: Ὃς ἂν εἴπῃ
  choice: Quem disser
  rationale: O relativo com ἄν e o subjuntivo aoristo exprime uma condição geral indefinida; “quem disser” é natural e mantém essa força.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: ao pai ou à mãe
  rationale: Os dativos indicam os destinatários. Em português, o possessivo é dispensável e a formulação permanece genérica e clara.
- source_word: Δῶρον
  choice: oferta
  rationale: δῶρον pode significar “presente”, “dádiva” ou “oferta”. Neste contexto, trata-se de algo declarado dedicado a Deus; “oferta” comunica essa dimensão cultual sem inserir o termo “corbã”, ausente em Mateus.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: aquilo que você poderia receber de mim como ajuda
  rationale: A formulação preserva a origem expressa por ἐξ ἐμοῦ e o benefício potencial de ὠφεληθῇς, ao mesmo tempo que evita uma construção passiva pouco natural em português.
theological_decisions:
- issue: Inserir ou não o termo técnico “corbã” no texto de Mateus
  choice: Manter “oferta” no texto principal
  alternative: “corbã” ou “oferta dedicada a Deus”
  rationale: Mateus emprega δῶρον, e não κορβᾶν, termo presente em Marcos 7:11. A tradução mantém a escolha lexical de Mateus, deixando a implicação da dedicação a Deus para a nota.
translation_notes:
  register: Português moderno, digno e de leitura natural, com “vocês” para clareza ampla. A ordem da fala foi ajustada ao português sem eliminar a relação entre a oferta declarada e a ajuda que os pais poderiam receber.
