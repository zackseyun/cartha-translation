  text: καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πόσους ἄρτους ἔχετε; οἱ δὲ εἶπαν· Ἑπτά, καὶ ὀλίγα ἰχθύδια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/034.yaml
  text: And Jesus said to them[a], “How many loaves do you have?” And they said, “Seven, and a few small fish.”
translation:
  language: pt
  text: 'Jesus lhes perguntou: “Quantos pães vocês têm?” Eles responderam: “Sete e alguns peixinhos[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “peixes”; o grego usa uma forma diminutiva, que pode sugerir peixes pequenos.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: perguntou
  rationale: Embora o grego empregue o presente histórico, literalmente “diz”, o discurso direto é uma pergunta; “perguntou” expressa com naturalidade sua função no português narrativo moderno.
- source_word: Πόσους ἄρτους
  choice: Quantos pães
  rationale: ἄρτους está no plural e designa unidades de pão; em português, “pães” é a forma contável natural.
- source_word: ἔχετε
  choice: vocês têm
  rationale: Forma corrente e amplamente compreensível no português moderno, preservando a segunda pessoa do plural dirigida aos discípulos.
- source_word: οἱ δὲ εἶπαν
  choice: Eles responderam
  rationale: δέ introduz a sequência narrativa, e “responderam” torna explícita, sem alterar o sentido, a função de εἶπαν após uma pergunta.
- source_word: Ἑπτά
  choice: Sete
  rationale: Tradução direta do numeral.
- source_word: ὀλίγα
  choice: alguns
  rationale: Equivalente idiomático que indica uma pequena quantidade indefinida; a noção de tamanho está expressa no diminutivo seguinte.
- source_word: ἰχθύδια
  choice: peixinhos
  rationale: O diminutivo português preserva a forma diminutiva do substantivo grego, que pode sugerir peixes pequenos.
