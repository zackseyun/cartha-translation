id: MAT.15.30
reference: Matthew 15:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ προσῆλθον αὐτῷ ὄχλοι πολλοὶ ἔχοντες μεθ’ ἑαυτῶν ⸂κωφούς, τυφλούς, χωλούς, κυλλούς⸃, καὶ ἑτέρους πολλούς, καὶ ἔρριψαν αὐτοὺς παρὰ τοὺς πόδας ⸀αὐτοῦ, καὶ ἐθεράπευσεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/030.yaml
  text: And large crowds came to him[a], bringing with them the mute, the blind, the lame, the crippled, and many others, and they laid them at his feet[b], and he healed them.
translation:
  language: pt
  text: E grandes multidões se aproximaram dele, trazendo consigo pessoas surdas[a], cegas, mancas, com deficiências nos membros[b] e muitas outras. Elas as colocaram aos pés de Jesus, e ele as curou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pessoas mudas”; o grego κωφούς pode se referir a pessoas surdas, mudas ou com ambas as condições, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “com membros atrofiados ou deformados”; o grego κυλλούς refere-se de modo amplo a pessoas cujos membros eram deficientes, deformados ou funcionalmente comprometidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: se aproximaram
  rationale: Expressa naturalmente o movimento em direção a Jesus e corresponde ao sentido comum de προσέρχομαι.
- source_word: ὄχλοι πολλοὶ
  choice: grandes multidões
  rationale: Forma idiomática que comunica tanto a pluralidade quanto a grande quantidade de pessoas.
- source_word: ἔχοντες μεθ’ ἑαυτῶν
  choice: trazendo consigo
  rationale: 'Torna explícita, de modo natural, a força circunstancial do particípio: as multidões vieram acompanhadas das pessoas necessitadas.'
- source_word: κωφούς
  choice: pessoas surdas
  rationale: κωφός pode indicar surdez, incapacidade de falar ou ambas; 'surdas' é uma leitura lexical legítima, e a ambiguidade é preservada em nota.
- source_word: τυφλούς
  choice: cegas
  rationale: Equivalente corrente e direto de τυφλός no contexto da lista de pessoas enfermas.
- source_word: χωλούς
  choice: mancas
  rationale: Equivalente conciso de χωλός, indicando pessoas com dificuldade ou incapacidade de andar normalmente.
- source_word: κυλλούς
  choice: com deficiências nos membros
  rationale: Comunica de forma atual e respeitosa a referência ampla de κυλλός a membros atrofiados, deformados ou funcionalmente comprometidos, sem limitar o termo a uma causa específica.
- source_word: ἑτέρους πολλούς
  choice: muitas outras
  rationale: Retoma naturalmente 'pessoas' e abrange os demais necessitados não enumerados.
- source_word: ἔρριψαν
  choice: colocaram
  rationale: Embora o verbo possa significar literalmente 'lançar', neste contexto 'colocaram' evita sugerir brutalidade sem eliminar o gesto decidido indicado pela narrativa.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: aos pés de Jesus
  rationale: Expressão portuguesa natural para a posição junto aos pés; a repetição do nome esclarece a mudança do referente pronominal no período.
- source_word: ἐθεράπευσεν
  choice: curou
  rationale: Equivalente natural e consagrado de θεραπεύω nas narrativas de cura.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Empregaram-se expressões centradas nas pessoas para evitar termos hoje percebidos como depreciativos. A segunda frase explicita 'Jesus' para impedir que 'seus pés' seja entendido como referência às multidões.
