  text: But she came and knelt before him[a], saying, “Lord, help me.”
translation:
  language: pt
  text: 'Mas ela se aproximou e se ajoelhou diante dele[a], dizendo: “Senhor, ajude-me!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o adorou”. O verbo grego pode indicar curvar-se em reverência, prestar homenagem ou adorar, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste com a fala anterior de Jesus e destaca a persistência da mulher.
- source_word: ἐλθοῦσα
  choice: ela se aproximou
  rationale: O particípio aoristo indica o movimento da mulher em direção a Jesus; a forma finita é natural em português.
- source_word: προσεκύνει αὐτῷ
  choice: se ajoelhou diante dele
  rationale: Expressa concretamente a postura de reverência sem determinar se o gesto deve ser entendido estritamente como adoração; a alternativa é preservada em nota.
- source_word: λέγουσα
  choice: dizendo
  rationale: Introduz de modo direto e natural as palavras da mulher.
- source_word: Κύριε
  choice: Senhor
  rationale: Mantém o tratamento respeitoso e teologicamente significativo dirigido a Jesus.
- source_word: βοήθει μοι
  choice: ajude-me
  rationale: Reproduz de forma breve, direta e urgente o imperativo presente e o pronome dativo.
theological_decisions:
- issue: Sentido de προσκυνέω dirigido a Jesus
  choice: se ajoelhou diante dele
  alternative: o adorou
  rationale: O verbo pode denotar prostrar-se em reverência, prestar homenagem ou adorar. O texto principal preserva o gesto visível sem resolver além do contexto a compreensão teológica da mulher, enquanto a nota registra a leitura legítima mais forte.
translation_notes:
  register: Português moderno, digno e de leitura natural, com vocabulário amplamente compreensível. “Ajude-me!” preserva a concisão e a urgência do pedido.
