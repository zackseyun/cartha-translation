  source_fidelity: O texto traduz adequadamente πᾶς ὁ προάγων como “Todo aquele que avança”, mantendo a imagem de seguir adiante sem substituir a leitura do SBLGNT pela variante mais explicitamente condenatória. “Não permanece”, “no ensino”, “do Messias”, “não tem Deus” e a correlação “tanto o Pai como o Filho” correspondem bem ao grego e preservam suas ambiguidades relevantes.
