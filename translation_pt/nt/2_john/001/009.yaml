id: 2JN.1.9
reference: 2 John 1:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πᾶς ὁ ⸀προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει· ὁ μένων ἐν τῇ ⸀διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/009.yaml
  text: Everyone who goes on ahead and does not remain in the teaching of Messiah does not have God[a]. The one who remains in the teaching[b], this one has both the Father and the Son.
translation:
  language: pt
  text: Todo aquele que avança e não permanece no ensino do Messias não tem Deus.[a] Aquele que permanece no ensino[b] tem tanto o Pai como o Filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vai longe demais” ou “corre adiante”; alguns manuscritos trazem “transgride” em vez de “avança”.
    reason: textual_variant
  - marker: b
    text: A expressão “o ensino do Messias” pode significar tanto “o ensino dado pelo Messias” como “o ensino a respeito do Messias”.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ προάγων
  choice: Todo aquele que avança
  rationale: A construção com particípio substantivado tem sentido genérico. “Avança” preserva a metáfora de ir adiante, sem impor no texto principal os sentidos interpretativos “vai longe demais” ou “transgride”.
- source_word: μὴ μένων
  choice: não permanece
  rationale: “Permanecer” é natural em português atual e conserva o importante vocabulário joanino de μένω.
- source_word: ἐν τῇ διδαχῇ
  choice: no ensino
  rationale: “Ensino” é claro e acessível, além de menos eclesiástico que “doutrina”. A repetição mantém o paralelismo do grego.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Χριστός funciona aqui como título. A construção “do Messias” mantém aberta a possibilidade de se referir tanto ao ensino dado pelo Messias quanto ao ensino a respeito dele.
- source_word: θεὸν οὐκ ἔχει
  choice: não tem Deus
  rationale: A formulação direta preserva a linguagem forte de João sem ampliá-la para “não tem comunhão com Deus”.
- source_word: ὁ μένων ἐν τῇ διδαχῇ
  choice: Aquele que permanece no ensino
  rationale: Reproduz naturalmente o particípio substantivado e o contraste paralelo da primeira oração.
- source_word: οὗτος
  choice: expresso pela estrutura enfática “Aquele que... tem”
  rationale: Em português, repetir “esse” ou “este” depois do sujeito seria pouco natural. A construção focalizada preserva adequadamente a ênfase sem rigidez.
- source_word: καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει
  choice: tem tanto o Pai como o Filho
  rationale: A correlação “tanto... como...” representa naturalmente καὶ...καὶ e preserva os títulos pessoais.
theological_decisions:
- issue: Sentido de προάγων nesta forma textual
  choice: avança
  alternative: vai longe demais; corre adiante; transgride
  rationale: O SBLGNT traz προάγων, não a variante παραβαίνων. A tradução conserva a metáfora sem introduzir no texto principal uma condenação mais explícita que a forma grega.
- issue: Sentido de “o ensino do Messias”
  choice: Mantida a construção genitiva compacta
  alternative: o ensino dado pelo Messias; o ensino a respeito do Messias
  rationale: O genitivo grego admite as duas relações, e o texto não exige que a tradução elimine essa ambiguidade.
- issue: Título cristológico Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός é tratado como título, e “Messias” torna explícito seu valor titular sem importar uma leitura denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preferiu-se “ensino” a “doutrina” e uma sintaxe natural na segunda oração, sem perder o paralelismo e a ênfase do original.
