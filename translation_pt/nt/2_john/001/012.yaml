id: 2JN.1.12
reference: 2 John 1:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πολλὰ ἔχων ὑμῖν γράφειν οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος, ἀλλὰ ἐλπίζω ⸀γενέσθαι πρὸς ὑμᾶς καὶ στόμα πρὸς στόμα λαλῆσαι, ἵνα ἡ χαρὰ ⸀ὑμῶν ⸂πεπληρωμένη ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/012.yaml
  text: Though I have many things to write to you[a], I did not want to do so with paper and ink. Instead, I hope to come to you and speak face to face, so that your joy may be made complete.
translation:
  language: pt
  text: Embora eu tenha muitas coisas para escrever a vocês, não quis fazê-lo com papel e tinta. Em vez disso, espero ir até vocês e conversar face a face, para que a alegria de vocês seja completa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem «a nossa alegria» em vez de «a alegria de vocês».
    reason: textual_variant
lexical_decisions:
- source_word: Πολλὰ ἔχων ὑμῖν γράφειν
  choice: Embora eu tenha muitas coisas para escrever a vocês
  rationale: A oração concessiva é natural em português e conserva o plural neutro Πολλά, bem como o sentido de destinatário expresso por ὑμῖν.
- source_word: οὐκ ἐβουλήθην
  choice: não quis
  rationale: Expressa de modo conciso e corrente a vontade ou intenção indicada por βούλομαι no aoristo.
- source_word: διὰ χάρτου καὶ μέλανος
  choice: com papel e tinta
  rationale: διά com genitivo indica meio; «com» é a forma instrumental mais natural em português, sem exigir o termo mais técnico «papiro».
- source_word: ἀλλὰ ἐλπίζω γενέσθαι πρὸς ὑμᾶς
  choice: Em vez disso, espero ir até vocês
  rationale: A expressão indica tornar-se presente junto aos destinatários; «ir até vocês» preserva o movimento em direção a eles e soa natural no contexto epistolar.
- source_word: στόμα πρὸς στόμα λαλῆσαι
  choice: conversar face a face
  rationale: A tradução idiomática comunica uma conversa pessoal e direta; a reprodução literal «boca a boca» teria outro sentido no português moderno.
- source_word: ἵνα ἡ χαρὰ ὑμῶν πεπληρωμένη ᾖ
  choice: para que a alegria de vocês seja completa
  rationale: Mantém a finalidade de ἵνα, segue a leitura ὑμῶν do texto-base e representa o estado de plenitude expresso pela perífrase perfeita.
theological_decisions:
- issue: Variante pronominal sobre de quem é a alegria
  choice: a alegria de vocês
  alternative: a nossa alegria
  rationale: O SBLGNT traz ὑμῶν («de vocês»), adotado no texto principal. A leitura ἡμῶν («nossa») possui relevância interpretativa e, por isso, é registrada em nota sem resolver silenciosamente a variante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «vocês» para o plural e evita tanto arcaísmos quanto coloquialismo excessivo.
