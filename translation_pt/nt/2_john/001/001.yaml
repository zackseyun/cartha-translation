id: 2JN.1.1
reference: 2 John 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ πρεσβύτερος ἐκλεκτῇ κυρίᾳ καὶ τοῖς τέκνοις αὐτῆς, οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ, καὶ οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες οἱ ἐγνωκότες τὴν ἀλήθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/001.yaml
  text: The elder[a], to the chosen lady and her children, whom I love in truth—and not I alone[b], but also all who have come to know the truth—
translation:
  language: pt
  text: O ancião[a], à senhora escolhida e aos filhos dela, a quem amo em verdade[b] — e não somente eu, mas também todos os que vieram a conhecer a verdade —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “o presbítero”. Alguns entendem “senhora” como uma referência figurada a uma igreja local; outros consideram “Kyria” um nome pessoal.
    reason: alternative_reading
  - marker: b
    text: Ou “verdadeiramente”; a expressão também pode ter o sentido joanino de “na verdade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: O presbítero
  rationale: Na abertura da carta, o termo funciona mais naturalmente como título ou designação reconhecida, não apenas como referência à idade. “Presbítero” é corrente e inteligível em português e mantém a dimensão de liderança do termo grego.
- source_word: ἐκλεκτῇ
  choice: escolhida
  rationale: Equivalente natural de ἐκλεκτός, aplicável tanto a uma mulher específica quanto, metaforicamente, a uma comunidade personificada.
- source_word: κυρίᾳ
  choice: senhora
  rationale: É o equivalente comum e digno de κυρία neste endereço epistolar, sem decidir se se trata de uma mulher ou de uma igreja personificada.
- source_word: τοῖς τέκνοις αὐτῆς
  choice: aos filhos dela
  rationale: τέκνα designa os filhos ou as crianças de modo geral, sem especificar sexo. “Dela” conserva o referente gramatical feminino e também permite a leitura metafórica.
- source_word: οὓς
  choice: a quem
  rationale: A forma grega masculina plural refere-se naturalmente aos filhos ou ao conjunto de pessoas destinatárias. “A quem” mantém a referência pessoal sem impor uma reestruturação explicativa.
- source_word: ἀγαπῶ
  choice: amo
  rationale: Tradução direta e natural, sem acrescentar uma intensidade ausente no grego.
- source_word: ἐν ἀληθείᾳ
  choice: em verdade
  rationale: Preserva tanto a possível ideia adverbial de sinceridade quanto a ressonância joanina de viver ou amar na esfera da verdade.
- source_word: οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες
  choice: e não somente eu, mas também todos
  rationale: Reproduz de modo natural o contraste enfático entre o autor e todos os demais que conhecem a verdade.
- source_word: οἱ ἐγνωκότες
  choice: os que vieram a conhecer
  rationale: Expressa o estado presente resultante de terem chegado ao conhecimento, refletindo o aspecto do particípio perfeito.
- source_word: τὴν ἀλήθειαν
  choice: a verdade
  rationale: Mantém o sentido comum e a densidade teológica característica dos escritos joaninos.
theological_decisions:
- issue: Identidade de ἐκλεκτῇ κυρίᾳ
  choice: “à senhora escolhida”, como endereço que permanece aberto tanto a uma mulher específica quanto a uma comunidade personificada
  alternative: “à eleita”, “à igreja escolhida” ou “à Kyria escolhida”
  rationale: O grego admite uma mulher cristã e seus filhos, uma igreja local e seus membros ou, menos provavelmente, Kyria como nome pessoal. A redação principal conserva a ambiguidade em vez de decidir entre essas leituras.
- issue: Sentido de ἐν ἀληθείᾳ
  choice: “em verdade”
  alternative: “verdadeiramente” ou “na verdade”
  rationale: A expressão pode indicar sinceridade, mas no contexto joanino também pode denotar a esfera da verdade. “Em verdade” preserva as duas possibilidades sem inserir um artigo ausente no grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe preserva o caráter epistolar e a frase inacabada que prossegue no versículo seguinte. Os travessões demarcam o comentário parentético sem encerrar a oração.
