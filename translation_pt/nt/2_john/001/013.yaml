  text: The children of your chosen sister greet you.
translation:
  language: pt
  text: Os filhos da sua irmã escolhida saúdam você.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεταί σε
  choice: mandam saudações
  rationale: Expressa de modo natural em português a saudação dirigida à destinatária, preservando o sentido do singular coletivo grego com sujeito neutro plural.
- source_word: τὰ τέκνα
  choice: Os filhos
  rationale: Tradução corrente e abrangente no contexto familiar; o artigo definido foi preservado.
- source_word: τῆς ἀδελφῆς σου
  choice: da sua irmã
  rationale: Mantém a relação expressa pelo genitivo e emprega uma forma amplamente natural no português moderno.
- source_word: τῆς ἐκλεκτῆς
  choice: escolhida
  rationale: Reproduz o particípio adjetivado ἐκλεκτή sem recorrer ao termo mais técnico e menos corrente 'eleita'.
theological_decisions:
- issue: Possível sentido figurado de 'irmã' e 'filhos' para uma igreja e seus membros
  choice: Manter a linguagem familiar do original sem explicá-la no texto
  alternative: Explicitar 'igreja irmã' e 'membros'
  rationale: O grego preserva uma ambiguidade plausível entre relações familiares literais e uma personificação eclesial; explicitá-la resolveria indevidamente a tensão.
- issue: Valor de ἐκλεκτή
  choice: escolhida
  alternative: eleita
  rationale: Ambas são possíveis, mas 'escolhida' comunica o sentido básico em linguagem moderna sem acrescentar conotação doutrinária específica.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A ordem foi ajustada ao uso idiomático do português, sem perder a ambiguidade referencial do original.
