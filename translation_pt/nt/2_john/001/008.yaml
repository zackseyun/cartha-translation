  text: βλέπετε ἑαυτούς, ἵνα μὴ ⸀ἀπολέσητε ἃ ⸀εἰργασάμεθα, ἀλλὰ μισθὸν πλήρη ⸀ἀπολάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/008.yaml
  text: Watch yourselves[a], so that you may not lose what we have worked for, but may receive a full reward.
translation:
  language: pt
  text: Tenham cuidado com vocês mesmos, para que não percam aquilo pelo qual trabalhamos,[a] mas recebam a recompensa completa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “aquilo pelo qual vocês trabalharam”, em vez de “aquilo pelo qual trabalhamos”.
    reason: textual_variant
lexical_decisions:
- source_word: βλέπετε ἑαυτούς
  choice: Cuidem de vocês mesmos
  rationale: O imperativo presente plural pede vigilância contínua, e o pronome reflexivo mantém a advertência dirigida aos leitores. A formulação é natural, clara e conserva a força exortativa.
- source_word: ἵνα μὴ ἀπολέσητε
  choice: para que não percam
  rationale: A construção com ἵνα e o subjuntivo expressa o resultado ou propósito que se deseja evitar. Neste contexto, ἀπόλλυμι indica perder ou deixar escapar o fruto do trabalho, não destruir.
- source_word: ἃ εἰργασάμεθα
  choice: aquilo pelo qual trabalhamos
  rationale: A tradução segue a primeira pessoa do plural do texto fornecido e comunica trabalho realizado com resultados ainda em vista. A variante na segunda pessoa do plural é registrada em nota.
- source_word: μισθὸν πλήρη
  choice: a recompensa completa
  rationale: No contexto exortativo, μισθός significa naturalmente recompensa, enquanto πλήρης ressalta que ela deve ser recebida integralmente.
- source_word: ἀπολάβητε
  choice: recebam
  rationale: O verbo denota receber ou obter. Embora possa, em certos contextos, incluir a ideia de receber de volta, essa nuance não é suficientemente explícita aqui para ser acrescentada ao texto.
theological_decisions:
- issue: Pessoa verbal de εἰργασάμεθα
  choice: trabalhamos
  alternative: trabalharam
  rationale: O SBLGNT fornecido traz a primeira pessoa do plural, indicando o trabalho dos autores ou obreiros entre os leitores. Alguns manuscritos trazem a segunda pessoa do plural, referindo-se ao trabalho dos próprios leitores; essa variante é preservada em nota, sem substituir o texto-base.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Cuidem de vocês mesmos” evita a rigidez de uma tradução literal como “olhem para vocês mesmos” e mantém o chamado à vigilância. “Recompensa completa” conserva a relação direta entre μισθόν e πλήρη.
