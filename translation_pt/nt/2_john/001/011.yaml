  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ ⸂λέγων γὰρ⸃ αὐτῷ χαίρειν κοινωνεῖ τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/011.yaml
  text: For the one who says to him[a], “Greetings,” shares in his evil works.
translation:
  language: pt
  text: 'Pois quem lhe diz: “Saudações”[a] participa de suas obras más.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Salve”. O grego χαίρειν era uma fórmula convencional de saudação; neste contexto, sugere acolhimento ou aprovação, e não apenas uma troca casual de gentilezas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: quem diz
  rationale: O artigo com o particípio presente tem função substantiva e sentido genérico. “Quem diz” expressa isso naturalmente em português sem restringir o referente.
- source_word: γάρ
  choice: Pois
  rationale: Introduz a razão da proibição do versículo anterior e preserva de modo conciso a força explicativa.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome dativo retoma a pessoa mencionada no contexto anterior. “Lhe” mantém a referência sem acrescentar uma identificação interpretativa.
- source_word: χαίρειν
  choice: “Saudações”
  rationale: Depois de λέγων, o infinitivo funciona como fórmula convencional de saudação. “Saudações” mantém esse valor idiomático melhor que o literal “alegrar-se”, enquanto “bem-vindo” seria mais interpretativo.
- source_word: κοινωνεῖ
  choice: participa de
  rationale: Com o dativo, κοινωνέω indica participação ou associação. “Participa de” comunica claramente a implicação de cumplicidade sem importar um sentido eclesiástico mais estreito.
- source_word: τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς
  choice: suas obras más
  rationale: 'A expressão dativa designa aquilo de que se participa: as obras da pessoa, caracterizadas como más. “Obras” preserva a correspondência com ἔργα, e “más” traduz naturalmente o sentido moral de πονηρός.'
theological_decisions:
- issue: Se a saudação indica mera cortesia ou acolhimento que implica apoio e cumplicidade
  choice: Manter no texto a fórmula de saudação, deixando o contexto imediato mostrar que, ao acolher e apoiar o falso mestre, a pessoa participa de suas obras más.
  alternative: Entender o versículo como proibição absoluta de qualquer saudação cortês em toda circunstância.
  rationale: χαίρειν é lexicalmente uma fórmula de saudação, enquanto κοινωνεῖ e a referência do versículo 10 a receber essa pessoa em casa apontam para participação e apoio à sua atividade. A tradução não amplia o texto principal, e a nota esclarece a força contextual sem transformar a inferência em tradução.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pois” mantém a ligação argumentativa; “quem lhe diz” é natural e conserva a referência genérica; “obras más” preserva a proximidade lexical com o grego. O marcador [a] aparece imediatamente após a expressão comentada.
