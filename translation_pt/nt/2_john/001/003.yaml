  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔσται μεθ’ ἡμῶν χάρις ἔλεος εἰρήνη παρὰ θεοῦ πατρός, καὶ ⸀παρὰ Ἰησοῦ Χριστοῦ τοῦ υἱοῦ τοῦ πατρός, ἐν ἀληθείᾳ καὶ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/003.yaml
  text: Grace[a], mercy, and peace will be with us from God the Father and from Jesus the Messiah, the Father's Son[b], in truth and love.
translation:
  language: pt
  text: A graça, a misericórdia e a paz estarão conosco, da parte de Deus Pai e de Jesus, o Messias[a], o Filho do Pai[b], em verdade e amor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus Cristo”. O título grego Χριστός pode ser transliterado como “Cristo”; aqui é traduzido como “Messias” para comunicar seu sentido como título.'
    reason: alternativa lexical
  - marker: b
    text: A expressão grega está em aposição e identifica Jesus, o Messias, como “o Filho do Pai”.
    reason: esclarecimento sintático
lexical_decisions:
- source_word: ἔσται μεθ’ ἡμῶν
  choice: estarão conosco
  rationale: Embora o grego use o verbo no singular, os três substantivos coordenados formam em português um sujeito composto que pede naturalmente o plural. O futuro indicativo é preservado, e μετά com genitivo é traduzido por “conosco”.
- source_word: χάρις ἔλεος εἰρήνη
  choice: a graça, a misericórdia e a paz
  rationale: Mantém a sequência da fórmula epistolar grega. Os artigos tornam a enumeração natural em português sem alterar o sentido dos substantivos abstratos.
- source_word: παρὰ θεοῦ πατρός
  choice: da parte de Deus Pai
  rationale: παρά com genitivo indica origem ou fonte. “Da parte de” expressa essa relação com clareza e não acrescenta o possessivo “nosso”, ausente do grego.
- source_word: παρὰ Ἰησοῦ Χριστοῦ
  choice: de Jesus, o Messias
  rationale: A preposição continua a construção “da parte de”. Χριστός funciona como título e, por isso, é traduzido como “Messias”; a vírgula e o artigo produzem uma formulação idiomática em português.
- source_word: τοῦ υἱοῦ τοῦ πατρός
  choice: o Filho do Pai
  rationale: A expressão está em aposição a Jesus, o Messias, e o identifica explicitamente como Filho do Pai, preservando as relações definidas do grego.
- source_word: ἐν ἀληθείᾳ καὶ ἀγάπῃ
  choice: em verdade e amor
  rationale: Conserva a preposição ἐν e o caráter qualitativo dos substantivos sem artigo, sem decidir além do texto se a expressão descreve a esfera, o modo ou as qualidades em que as bênçãos são experimentadas.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: o Messias
  alternative: Cristo
  rationale: Χριστός é um título aplicado a Jesus. “Messias” comunica o sentido do título, enquanto “Cristo”, forma tradicional transliterada, é registrado em nota como alternativa.
- issue: Relação de τοῦ υἱοῦ τοῦ πατρός com Jesus
  choice: Aposição que identifica Jesus, o Messias, como o Filho do Pai
  alternative: Tomar a expressão apenas como uma descrição mais solta após o nome
  rationale: A estrutura genitiva segue imediatamente “Jesus, o Messias” e o identifica de modo natural. A tradução mantém essa força cristológica sem acrescentar formulações doutrinárias externas ao versículo.
- issue: Sentido de ἐν ἀληθείᾳ καὶ ἀγάπῃ
  choice: em verdade e amor
  alternative: com verdade e amor
  rationale: A tradução formal preserva ἐν e deixa aberta a relação precisa da expressão com a bênção, evitando reduzi-la apenas a modo ou acompanhamento.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Da parte de” é uma formulação epistolar natural para indicar fonte; “em verdade e amor” preserva a concisão e a possível amplitude semântica do original.
