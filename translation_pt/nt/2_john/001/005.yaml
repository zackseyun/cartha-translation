  - severity: low
    issue: A alternativa da nota «à igreja» não corresponde à função vocativa de κυρία.
    rationale: κυρία é vocativo. Caso seja uma personificação da comunidade, a alternativa portuguesa deve ser «ó igreja» ou simplesmente «igreja», e não uma expressão introduzida por «a».
