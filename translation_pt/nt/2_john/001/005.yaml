  source_fidelity: 'O sentido central é fiel ao grego: o autor faz um pedido à «senhora», esclarece que não escreve um mandamento novo e identifica o mandamento mantido desde o princípio como o amor mútuo. «Desde o princípio» preserva adequadamente ἀπ’ ἀρχῆς, e «amemos uns aos outros» expressa bem o subjuntivo ἀγαπῶμεν.'
  naturalness: A redação é em geral natural e de registro apropriado. Contudo, a elipse em «mas aquele que temos» fica ligeiramente truncada após «não como quem lhe escreve», pois «aquele» retoma «mandamento» sem repetir a construção verbal. Uma repetição discreta torna o contraste mais claro e fluente.
  terminology: «Senhora» é a tradução lexical adequada de κυρία e preserva a ambiguidade quanto à destinatária. «Novo mandamento» e «amemos uns aos outros» são escolhas consistentes e claras. A nota deve apresentar a alternativa figurada como vocativo («ó igreja»), não como objeto indireto («à igreja»).
