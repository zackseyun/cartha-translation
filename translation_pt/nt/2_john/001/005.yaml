source:
  edition: SBLGNT
  text: καὶ νῦν ἐρωτῶ σε, κυρία, οὐχ ὡς ἐντολὴν ⸂καινὴν γράφων σοι⸃ ἀλλὰ ἣν εἴχομεν ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/005.yaml
  text: 'And now I ask you[a], lady, not as though I were writing to you a new commandment, but the one we have had from the beginning: that we love one another.'
translation:
  language: pt
  text: 'E agora lhe peço, senhora[a], não como quem lhe escreve um novo mandamento, mas como quem lhe escreve o mandamento que temos desde o princípio: que amemos uns aos outros.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “ó igreja”, se “senhora” for entendido em sentido figurado; alternativamente, alguns entendem Kyria como nome próprio.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: peço
  rationale: Neste contexto epistolar, ἐρωτάω expressa um pedido. “Peço” é natural em português e evita intensificar o verbo como “exorto”.
- source_word: κυρία
  choice: senhora
  rationale: É o vocativo singular de “senhora”. A tradução lexical direta preserva a possibilidade de se tratar de uma mulher, de uma referência figurada à igreja ou, menos provavelmente, de um nome próprio.
- source_word: ἐντολὴν καινὴν
  choice: um novo mandamento
  rationale: É a correspondência corrente e preserva o eco da linguagem joanina.
- source_word: γράφων σοι
  choice: como quem lhe escreve
  rationale: A construção traduz de modo idiomático o particípio dentro do contraste οὐχ ὡς… ἀλλά, sem acrescentar força ao original.
- source_word: ἣν εἴχομεν
  choice: aquele que temos
  rationale: Embora εἴχομεν seja imperfeito, com “desde o princípio” a formulação portuguesa comunica naturalmente uma posse iniciada no passado e ainda vigente.
- source_word: ἀπ’ ἀρχῆς
  choice: desde o princípio
  rationale: Expressão portuguesa natural que mantém a continuidade literária e teológica da fórmula joanina.
- source_word: ἵνα ἀγαπῶμεν ἀλλήλους
  choice: que amemos uns aos outros
  rationale: O subjuntivo depois de ἵνα apresenta o conteúdo do mandamento e conserva sua nuance exortativa.
theological_decisions:
- issue: Referente de κυρία
  choice: Traduzir literalmente como “senhora”, sem identificar a destinatária.
  alternative: Entender “senhora” como referência figurada a uma igreja local ou tomar Kyria como nome próprio.
  rationale: O grego admite mais de uma interpretação; o texto principal deve preservar essa ambiguidade genuína em vez de resolvê-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento “lhe” evita marcar regionalmente “tu” ou “você” e mantém o singular do grego.
