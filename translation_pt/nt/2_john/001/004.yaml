id: 2JN.1.4
reference: 2 John 1:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐχάρην λίαν ὅτι εὕρηκα ἐκ τῶν τέκνων σου περιπατοῦντας ἐν ἀληθείᾳ, καθὼς ἐντολὴν ἐλάβομεν παρὰ τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/004.yaml
  text: I rejoiced greatly that I have found some of your children walking in the truth[b][a], just as we received a commandment from the Father.
translation:
  language: pt
  text: Alegrei-me muito por ter encontrado alguns dos seus filhos andando na verdade[a][b], assim como recebemos um mandamento da parte do Pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dentre os seus filhos”. A expressão grega indica pessoas pertencentes ao grupo, sem necessariamente incluir todos.
    reason: lexical_alternative
  - marker: b
    text: Ou “andando em verdade”. A expressão provavelmente se refere não apenas à sinceridade, mas a viver de acordo com a verdade revelada.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην λίαν
  choice: Alegrei-me muito
  rationale: O aoristo de χαίρω expressa a reação de alegria, e λίαν a intensifica. A formulação é direta, digna e natural em português atual.
- source_word: εὕρηκα
  choice: por ter encontrado
  rationale: O infinitivo composto preserva, dentro de uma construção portuguesa natural, a anterioridade e o valor resultante do perfeito grego.
- source_word: ἐκ τῶν τέκνων σου
  choice: alguns dos seus filhos
  rationale: A construção partitiva ἐκ + genitivo indica pessoas dentre um grupo, sem afirmar que todos os filhos estejam incluídos.
- source_word: τέκνων
  choice: filhos
  rationale: τέκνα abrange os descendentes sem restringir o sexo. Em português, o plural masculino genérico é a forma familiar mais natural neste contexto.
- source_word: περιπατοῦντας
  choice: andando
  rationale: Mantém a metáfora joanina do caminhar como modo de viver, em vez de reduzi-la diretamente a uma paráfrase ética.
- source_word: ἐν ἀληθείᾳ
  choice: na verdade
  rationale: A formulação exprime a verdade como esfera e norma da conduta, coerente com o uso joanino, sem excluir a leitura formalmente possível de agir com veracidade.
- source_word: καθὼς
  choice: assim como
  rationale: Marca claramente a correspondência entre a conduta dos filhos e o mandamento recebido.
- source_word: ἐντολὴν
  choice: um mandamento
  rationale: Preserva o termo joanino de peso ético e teológico; o artigo indefinido é exigido pela naturalidade do português, embora o grego não tenha artigo.
- source_word: ἐλάβομεν
  choice: recebemos
  rationale: O pretérito perfeito traduz naturalmente o aoristo e mantém a primeira pessoa do plural do texto.
- source_word: παρὰ τοῦ πατρός
  choice: da parte do Pai
  rationale: Expressa com naturalidade a procedência pessoal marcada por παρά e conserva o título simples do original sem acrescentar “Deus”.
theological_decisions:
- issue: Referente de “o Pai”
  choice: Manter “o Pai” sem expansão
  alternative: “Deus, o Pai”
  rationale: O grego diz apenas τοῦ πατρός. O contexto joanino identifica o referente, mas a tradução não deve acrescentar uma explicitação ausente do texto.
- issue: Extensão de “seus filhos”
  choice: “alguns dos seus filhos”
  alternative: “seus filhos”
  rationale: O partitivo ἐκ indica um subconjunto. A tradução evita afirmar que o autor encontrou todos eles andando na verdade.
- issue: Sentido de “andar na verdade”
  choice: Conservar a metáfora e a possível referência à verdade revelada
  alternative: “viver sinceramente”
  rationale: No vocabulário joanino, a expressão provavelmente descreve uma vida conforme a verdade, não apenas sinceridade subjetiva; a redação mantém a densidade e a tensão do original.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto conserva a metáfora bíblica “andar”, usa “mandamento” pelo peso do vocabulário joanino e evita expansões confessionais. Os marcadores seguem imediatamente a expressão a que ambas as notas se referem.
