  text: because of the truth that remains in us and will be with us forever[a].
translation:
  language: pt
  text: por causa da verdade que permanece em nós e estará conosco para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que habita em nós”.'
    reason: Alternativa lexical para μένω, ressaltando a presença contínua da verdade.
lexical_decisions:
- source_word: διὰ
  choice: por causa de
  rationale: Com o acusativo, διά expressa aqui causa ou razão, indicando o fundamento do amor mencionado no versículo anterior.
- source_word: ἀλήθειαν
  choice: verdade
  rationale: Mantém o sentido direto de ἀλήθεια e sua amplitude teológica no uso joanino, sem explicá-la de modo interpretativo.
- source_word: τὴν μένουσαν
  choice: que permanece
  rationale: O particípio presente de μένω comunica presença contínua ou persistência. “Permanece” é natural e conserva esse aspecto durativo.
- source_word: ἐν ἡμῖν
  choice: em nós
  rationale: Traduz diretamente ἐν com o dativo e preserva a ideia joanina da presença interior da verdade, sem excluir sua dimensão comunitária.
- source_word: καὶ μεθ’ ἡμῶν ἔσται
  choice: e estará conosco
  rationale: μετά com o genitivo significa “com”, e ἔσται é o futuro de “ser/estar”. “Estará conosco” é a formulação idiomática em português, sem acrescentar ao verbo a noção de permanência já expressa antes.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: A expressão idiomática indica duração perpétua; “para sempre” é seu equivalente claro e natural em português.
theological_decisions:
- issue: Sentido teológico joanino de “verdade”
  choice: Conservar simplesmente “verdade”, sem especificar seu referente.
  alternative: “a verdade do evangelho” ou “o ensino verdadeiro”
  rationale: O contexto admite uma rica dimensão joanina, mas o substantivo grego não determina explicitamente se se refere à mensagem do evangelho, a Cristo ou à realidade da revelação de Deus. A formulação ampla preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem e as relações sintáticas do grego foram preservadas sem rigidez artificial.
