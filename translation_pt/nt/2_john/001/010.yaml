base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/010.yaml
  text: If anyone comes to you and does not bring this teaching, do not receive him into your house, and do not say a greeting to him.
translation:
  language: pt
  text: Se alguém vier até vocês e não trouxer este ensinamento[b], não o recebam em casa nem o cumprimentem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não lhe digam uma saudação”.
    reason: lexical_alternative
  - marker: b
    text: No contexto, a advertência diz respeito a quem chega sem “este ensinamento”, provavelmente um mestre itinerante cuja mensagem se afasta da confissão apostólica descrita nos versículos próximos.
    reason: cross_reference
lexical_decisions:
- source_word: εἴ τις
  choice: Se alguém
  rationale: Expressa de forma natural a condição indefinida e geral do grego.
- source_word: ἔρχεται πρὸς ὑμᾶς
  choice: for até vocês
  rationale: Verte diretamente o movimento em direção aos destinatários, sem acrescentar uma visita ou contexto eclesial que não esteja explícito.
- source_word: ταύτην τὴν διδαχήν
  choice: este ensinamento
  rationale: Mantém o demonstrativo e traduz διδαχή em linguagem clara e atual, sem o tom mais técnico de “doutrina”.
- source_word: οὐ φέρει
  choice: não levar
  rationale: Preserva a imagem verbal de trazer ou levar consigo um ensinamento; em português, “levar ... até vocês” se ajusta naturalmente à perspectiva dos destinatários.
- source_word: μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν
  choice: não o recebam em casa
  rationale: Conserva o sentido concreto de recepção e hospitalidade, sem decidir se οἰκία se refere a uma residência particular ou a outro ambiente doméstico.
- source_word: χαίρειν αὐτῷ μὴ λέγετε
  choice: nem lhe digam uma saudação
  rationale: Reflete a forma lexical do grego, literalmente ligada a “dizer” uma saudação, em vez de reduzi-la ao mais idiomático “não o cumprimentem”.
theological_decisions:
- issue: Alcance da proibição referente à pessoa que não leva este ensinamento
  choice: Manter as ações concretas de não receber em casa e não dizer uma saudação, no contexto de alguém que chega sem o ensinamento mencionado.
  alternative: Interpretar como proibição absoluta de todo contato social, ou restringi-la explicitamente ao acolhimento oficial de um mestre itinerante pela igreja.
  rationale: O contexto sugere mestres itinerantes e possível apoio ou reconhecimento de sua mensagem, mas o versículo não explicita todo o alcance da proibição. A tradução preserva essa tensão.
- issue: Gênero de αὐτόν / αὐτῷ
  choice: não o ... lhe
  alternative: não recebam essa pessoa ... nem a cumprimentem
  rationale: Os pronomes gregos estão no masculino singular. A formulação portuguesa os conserva sem acrescentar uma identificação mais específica do referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo; “em casa” soa mais natural do que “para dentro da casa”. Os marcadores foram colocados ao final do versículo porque as notas comentam, respectivamente, a saudação e o contexto geral da advertência.
