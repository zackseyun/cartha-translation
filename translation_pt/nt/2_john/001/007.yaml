  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι πολλοὶ πλάνοι ⸀ἐξῆλθον εἰς τὸν κόσμον, οἱ μὴ ὁμολογοῦντες Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί· οὗτός ἐστιν ὁ πλάνος καὶ ὁ ἀντίχριστος.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/007.yaml
  text: For many deceivers have gone out into the world[a], those who do not confess Jesus the Messiah coming in the flesh[b]. This is the deceiver and the antichrist.
translation:
  language: pt
  text: Pois muitos enganadores saíram para o mundo, os que não confessam Jesus, o Messias, que vem em carne.[a] Esse é o enganador e o anticristo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “Jesus Cristo, que vem em carne”. Também se pode traduzir “que veio em carne”; o grego emprega literalmente um particípio presente: “vindo em carne”.'
    reason: Registra a alternativa tradicional para Χριστός e a alternativa interpretativa que verte o particípio presente como referência à vinda histórica, sem ocultar a forma do grego.
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão da exortação anterior e mantém com naturalidade a força explicativa da conjunção.
- source_word: πολλοὶ πλάνοι
  choice: muitos enganadores
  rationale: πλάνος designa aqui pessoas que induzem outras ao erro; “enganadores” também permite a retomada lexical no singular.
- source_word: ἐξῆλθον εἰς τὸν κόσμον
  choice: saíram pelo mundo
  rationale: A expressão portuguesa comunica a entrada em circulação pública e a difusão dos enganadores sem atribuir a κόσμος o sentido interpretativo de “sistema mundial”.
- source_word: οἱ μὴ ὁμολογοῦντες
  choice: os que não confessam
  rationale: O particípio articulado é substantivado. “Confessam” preserva o sentido declarativo e público de ὁμολογέω.
- source_word: Ἰησοῦν Χριστόν
  choice: Jesus, o Messias
  rationale: Χριστός tem força titular na fórmula cristológica; a aposição com artigo é idiomática em português e evita tratar “Messias” meramente como sobrenome.
- source_word: ἐρχόμενον
  choice: vindo
  rationale: Preserva o particípio presente e sua relação direta com Jesus, sem convertê-lo silenciosamente no perfeito “que veio”.
- source_word: ἐν σαρκί
  choice: em carne
  rationale: Mantém a expressão concreta e teologicamente significativa, que afirma a humanidade corpórea real de Jesus sem parafraseá-la como “natureza pecaminosa”.
- source_word: οὗτός ἐστιν
  choice: Esse é
  rationale: O demonstrativo singular individualiza qualquer pessoa assim caracterizada; “esse” retoma de modo natural o referente descrito anteriormente.
- source_word: ὁ πλάνος
  choice: o enganador
  rationale: Mantém a correspondência lexical com πλάνοι no início do versículo.
- source_word: ὁ ἀντίχριστος
  choice: o anticristo
  rationale: É a forma consagrada e precisa em português para o termo joanino ἀντίχριστος.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, o termo integra o conteúdo da confissão sobre a identidade de Jesus e conserva clara força titular. A alternativa tradicional é registrada em nota.
- issue: Força de ἐρχόμενον ἐν σαρκί
  choice: vindo em carne
  alternative: que veio em carne
  rationale: O grego emprega um particípio presente. A tradução preserva essa forma e a tensão temporal da expressão, sem negar sua referência à encarnação histórica nem reduzi-la explicitamente a um evento passado.
- issue: Sentido de σάρξ
  choice: carne, no sentido de humanidade corpórea real
  alternative: natureza pecaminosa
  rationale: Neste contexto cristológico, σάρξ se refere à existência humana concreta e corpórea, não à corrupção moral.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Pois” mantém a ligação argumentativa; “saíram pelo mundo” é idiomático sem perder o sentido de difusão pública. A vírgula em “Jesus, o Messias” marca a função titular. A formulação menos habitual “vindo em carne” foi mantida por precisão e recebe esclarecimento em nota.
