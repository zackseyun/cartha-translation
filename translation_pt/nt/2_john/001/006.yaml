reference: 2 John 1:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἀγάπη, ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ· αὕτη ⸂ἡ ἐντολή ἐστιν⸃, καθὼς ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἐν αὐτῇ περιπατῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/006.yaml
  text: 'And this is love: that we walk according to his commandments. This is the commandment[a], just as you heard from the beginning, that you should walk in it.'
translation:
  language: pt
  text: 'E o amor é isto: que andemos segundo os seus mandamentos. Este é o mandamento[a], como vocês ouviram desde o princípio: que andem nele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Este é o mandamento, como vocês ouviram desde o princípio: que andem no amor”. O pronome traduzido como “nele” pode se referir ao “amor”, e não ao “mandamento”.'
    reason: Preserva a ambiguidade gramatical e conceitual do pronome feminino αὐτῇ.
lexical_decisions:
- source_word: ἀγάπη
  choice: amor
  rationale: Equivalente natural e consagrado de ἀγάπη, preservando a ligação lexical com o uso joanino no contexto.
- source_word: ἵνα περιπατῶμεν
  choice: que andemos
  rationale: A oração explica em que consiste o amor na prática; o subjuntivo preserva adequadamente a construção com ἵνα.
- source_word: περιπατέω
  choice: andar
  rationale: Preserva a metáfora ética joanina e sua repetição nas duas orações, sem reduzi-la simplesmente a 'viver'.
- source_word: κατὰ τὰς ἐντολὰς αὐτοῦ
  choice: segundo os seus mandamentos
  rationale: Expressa conformidade com os mandamentos, mantém o plural e soa natural em português bíblico moderno.
- source_word: ἐντολάς / ἐντολή
  choice: mandamentos / mandamento
  rationale: Mantém a conexão lexical e a mudança retoricamente significativa do plural para o singular.
- source_word: καθὼς ἠκούσατε ἀπ’ ἀρχῆς
  choice: como vocês ouviram desde o princípio
  rationale: Preserva o aoristo de ἀκούω e a expressão joanina ἀπ’ ἀρχῆς em linguagem clara e corrente.
- source_word: ἵνα ἐν αὐτῇ περιπατῆτε
  choice: que andem nele
  rationale: Mantém a metáfora de andar e toma o pronome feminino grego como referência ao antecedente imediato, 'mandamento'; em português, a concordância passa naturalmente ao masculino.
theological_decisions:
- issue: Referente de αὐτῇ na oração final
  choice: O pronome se refere ao singular 'mandamento', antecedente imediato.
  alternative: O pronome pode se referir a 'amor', no início do versículo.
  rationale: ἐντολή e ἀγάπη são ambos substantivos femininos singulares em grego. A proximidade gramatical favorece 'mandamento', mas a ligação conceitual com 'amor' é genuína e deve permanecer visível em nota, sem resolução dogmática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Usa 'vocês' para o plural de segunda pessoa e conserva a metáfora joanina de 'andar'.
