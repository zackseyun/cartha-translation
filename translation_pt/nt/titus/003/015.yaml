  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀσπάζονταί σε οἱ μετ’ ἐμοῦ πάντες. ἄσπασαι τοὺς φιλοῦντας ἡμᾶς ἐν πίστει. ἡ χάρις μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/015.yaml
  text: All who are with me greet you[a]. Greet those who love us in faith. Grace be with all of you.
translation:
  language: pt
  text: Todos os que estão comigo mandam saudações a você. Cumprimente os que nos amam na fé[a]. A graça esteja com todos vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na fé” no sentido de “na fé cristã”; alternativamente, “com fidelidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονταί
  choice: mandam saudações
  rationale: No contexto de encerramento de uma carta, expressa de modo natural em português que os companheiros de Paulo enviam suas saudações a Tito.
- source_word: οἱ μετ’ ἐμοῦ πάντες
  choice: Todos os que estão comigo
  rationale: Preserva tanto a totalidade indicada por πάντες como a relação expressa por μετά com o genitivo.
- source_word: ἄσπασαι
  choice: Cumprimente
  rationale: Imperativo claro e corrente que comunica diretamente o sentido epistolar de transmitir uma saudação.
- source_word: φιλοῦντας
  choice: amam
  rationale: Expressa de forma direta a afeição pessoal indicada por φιλέω, sem enfraquecê-la para simples estima ou simpatia.
- source_word: ἐν πίστει
  choice: na fé
  rationale: Mantém a formulação concisa e a ambiguidade do grego quanto à fé como esfera compartilhada, à fé cristã ou, menos provavelmente, à fidelidade.
- source_word: ἡ χάρις
  choice: A graça
  rationale: Preserva a fórmula paulina de bênção e o sentido teológico de χάρις.
- source_word: μετὰ πάντων ὑμῶν
  choice: esteja com todos vocês
  rationale: Torna explícito o verbo subentendido da bênção e preserva πάντων, com uma forma plural natural e amplamente compreensível em português.
theological_decisions:
- issue: Sentido de πίστις em ἐν πίστει
  choice: fé
  alternative: a fé cristã; fidelidade
  rationale: “Fé” é o equivalente mais direto e permite entender o amor como situado na fé compartilhada. Como o grego também admite uma referência à fé cristã e, possivelmente, à fidelidade, essas possibilidades são preservadas em nota sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas de tratamento de ampla compreensão brasileira. “Mandam saudações” evita a rigidez de “saúdam”, enquanto “Cumprimente” preserva a força do imperativo sem alternar entre formas de tratamento.
