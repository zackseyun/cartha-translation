id: TIT.3.8
reference: Titus 3:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος, καὶ περὶ τούτων βούλομαί σε διαβεβαιοῦσθαι, ἵνα φροντίζωσιν καλῶν ἔργων προΐστασθαι οἱ πεπιστευκότες θεῷ. ταῦτά ⸀ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/008.yaml
  text: This saying is trustworthy[a], and concerning these things I want you to insist confidently, so that those who have believed God may be careful to devote themselves to good works[b]. These things are good and beneficial for people.
translation:
  language: pt
  text: Esta declaração é digna de confiança. Quero que você insista firmemente nessas coisas[a], para que os que creram em Deus[b] tenham o cuidado de se dedicar às boas obras. Essas coisas são boas e úteis para as pessoas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “afirme essas coisas com convicção”.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser entendido como “confiaram em Deus” ou, mais literalmente, “deram crédito a Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: Esta declaração é digna de confiança
  rationale: A fórmula apresenta como confiável a mensagem ou afirmação precedente. “Declaração” comunica o sentido contextual de λόγος com naturalidade, enquanto “digna de confiança” preserva o valor de πιστός.
- source_word: περὶ τούτων βούλομαί σε διαβεβαιοῦσθαι
  choice: Quero que você insista firmemente nessas coisas
  rationale: A formulação conserva a vontade pessoal expressa por βούλομαι e a força enfática de διαβεβαιόομαι. “Insista firmemente” é corrente e deixa aberta a nuance entre afirmar com convicção e enfatizar repetidamente.
- source_word: ἵνα φροντίζωσιν
  choice: para que ... tenham o cuidado
  rationale: φροντίζω indica atenção deliberada e cuidadosa. A expressão portuguesa introduz naturalmente a finalidade da exortação.
- source_word: καλῶν ἔργων προΐστασθαι
  choice: se dedicar às boas obras
  rationale: Neste contexto, προΐστασθαι descreve empenho ativo e contínuo, não necessariamente liderança institucional. “Dedicar-se” preserva esse compromisso, e “boas obras” mantém a terminologia ética da carta.
- source_word: οἱ πεπιστευκότες θεῷ
  choice: os que creram em Deus
  rationale: O particípio perfeito identifica aqueles que passaram a crer e permanecem caracterizados por essa fé. “Creram em Deus” é português natural; a nota registra as nuances possíveis do dativo θεῷ.
- source_word: ταῦτά ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις
  choice: Essas coisas são boas e úteis para as pessoas
  rationale: O plural português explicita o referente de ταῦτα; “boas e úteis” distingue valor moral de benefício prático, e “pessoas” traduz o sentido humano genérico de ἀνθρώποις.
theological_decisions:
- issue: Relação entre fé e boas obras
  choice: A fé em Deus precede, e a dedicação às boas obras aparece como finalidade prática da exortação.
  alternative: Entender as boas obras como fundamento meritório da salvação.
  rationale: A ordem e a sintaxe gregas descrevem os crentes como aqueles que devem cuidar de praticar boas obras; o texto não apresenta tais obras como causa de sua condição de crentes.
- issue: Sentido de πιστεύω com o dativo θεῷ
  choice: creram em Deus
  alternative: creram no que Deus disse; confiaram em Deus
  rationale: O dativo pode realçar acreditar em Deus, dar crédito ao que ele diz ou confiar nele. A tradução principal emprega a expressão portuguesa mais natural, e a nota preserva a amplitude da construção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Evitou-se tanto o arcaísmo “fiel é esta palavra” quanto uma paráfrase que transformasse a exortação às boas obras em linguagem meritória.
