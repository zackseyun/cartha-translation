  text: αἱρετικὸν ἄνθρωπον μετὰ μίαν καὶ δευτέραν νουθεσίαν παραιτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/010.yaml
  text: Reject a divisive person after a first and second warning,[a]
translation:
  language: pt
  text: Rejeite a pessoa que causa divisões, depois de uma primeira e uma segunda advertência.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “facciosa”; em traduções tradicionais, “herege”. O termo grego provavelmente se refere a uma pessoa que promove facções ou divisões sectárias.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱρετικὸν
  choice: que causa divisões
  rationale: No grego koiné, o termo descreve provavelmente alguém que fomenta facções ou divisões. A formulação explicita esse sentido sem importar a noção eclesiástica posterior e mais técnica de “herege”.
- source_word: ἄνθρωπον
  choice: a pessoa
  rationale: Embora o substantivo esteja no masculino singular, aqui designa genericamente um indivíduo; “a pessoa” é natural em português e evita acrescentar uma especificação de sexo não exigida pelo contexto.
- source_word: μετὰ μίαν καὶ δευτέραν νουθεσίαν
  choice: depois de uma primeira e uma segunda advertência
  rationale: Preserva a sequência de duas intervenções corretivas anteriores à rejeição. “Advertência” comunica de modo atual a força corretiva de νουθεσία.
- source_word: παραιτοῦ
  choice: Rejeite
  rationale: O imperativo pede que se recuse ou afaste essa pessoa após advertências reiteradas; “Rejeite” expressa de maneira concisa a ação disciplinar decisiva.
theological_decisions:
- issue: Se αἱρετικὸν deve receber o sentido doutrinário posterior de “herege” ou seu provável sentido contextual de alguém que fomenta facções
  choice: que causa divisões
  alternative: facciosa; herege
  rationale: A escolha preserva o provável sentido do século I e o foco comunitário da passagem, sem impor uma categoria técnica posterior de heresia. A nota registra as alternativas lexical e tradicional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “que causa divisões” é mais idiomática e transparente do que o adjetivo “divisionista”, enquanto a nota conserva as alternativas relevantes.
