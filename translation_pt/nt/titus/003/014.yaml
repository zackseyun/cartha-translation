reference: Titus 3:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μανθανέτωσαν δὲ καὶ οἱ ἡμέτεροι καλῶν ἔργων προΐστασθαι εἰς τὰς ἀναγκαίας χρείας, ἵνα μὴ ὦσιν ἄκαρποι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/014.yaml
  text: And let our people also learn to engage in good works for necessary needs[c][b][a], so that they may not be unfruitful.
translation:
  language: pt
  text: E que os nossos também aprendam a se dedicar às boas obras para atender às necessidades urgentes,[a] a fim de que não sejam infrutíferos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para suprir as necessidades essenciais». «Se dedicar» também pode ser entendido como «tomar a iniciativa» ou «estar à frente» nas boas obras.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μανθανέτωσαν
  choice: aprendam
  rationale: O imperativo presente na terceira pessoa do plural mantém a força de exortação; em português, «que ... aprendam» é natural e não intensifica indevidamente a ordem.
- source_word: οἱ ἡμέτεροι
  choice: os nossos
  rationale: Reproduz de modo conciso a expressão relacional grega e, no contexto, refere-se às pessoas da comunidade cristã ligada a Paulo e Tito, sem restrição de gênero.
- source_word: καλῶν ἔργων
  choice: boas obras
  rationale: Tradução transparente que preserva o vocabulário recorrente de Tito para ações moralmente boas e úteis.
- source_word: προΐστασθαι
  choice: se dedicar
  rationale: Neste contexto, o infinitivo indica empenho ativo e constante nas boas obras. A nota preserva a possibilidade lexical de tomar a iniciativa ou estar à frente.
- source_word: εἰς τὰς ἀναγκαίας χρείας
  choice: para atender às necessidades urgentes
  rationale: A formulação comunica naturalmente que as boas obras se destinam a suprir necessidades reais e prementes; «urgentes» expressa a força de ἀναγκαίας sem a redundância de «necessidades necessárias».
- source_word: ἵνα μὴ ὦσιν ἄκαρποι
  choice: a fim de que não sejam infrutíferos
  rationale: Preserva tanto a finalidade da oração com ἵνα quanto a metáfora de ausência de fruto em ἄκαρποι.
theological_decisions:
- issue: Alcance de οἱ ἡμέτεροι
  choice: os nossos, isto é, as pessoas da comunidade cristã associada a Paulo e Tito
  alternative: os nossos homens; o nosso povo em contraste explícito com os de fora
  rationale: A expressão é comunitária e relacional, mas não exige limitação aos homens nem explicita, por si só, um contraste doutrinário rígido com pessoas de fora.
- issue: Sentido de προΐστασθαι
  choice: dedicação ativa às boas obras
  alternative: liderar ou tomar a iniciativa nas boas obras
  rationale: Com καλῶν ἔργων, o contexto favorece envolvimento diligente, mas o campo semântico do verbo permite a ideia de estar à frente; essa tensão é mantida na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Os nossos» conserva a concisão comunitária do grego; «atender às necessidades urgentes» evita uma redundância pouco natural. A única nota reúne as ambiguidades lexicais relevantes sem sobrecarregar o versículo.
