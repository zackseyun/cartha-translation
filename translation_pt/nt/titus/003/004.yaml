  text: ὅτε δὲ ἡ χρηστότης καὶ ἡ φιλανθρωπία ἐπεφάνη τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/004.yaml
  text: But when the kindness and love for humanity of God our Savior appeared,[a]
translation:
  language: pt
  text: Mas, quando a bondade de Deus, nosso Salvador, e seu amor pela humanidade se manifestaram,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amor pelos seres humanos”; o termo grego indica benevolência ou amor para com as pessoas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Mas, quando
  rationale: ὅτε introduz a oração temporal, e δέ marca uma transição com leve contraste em relação à condição humana descrita anteriormente.
- source_word: χρηστότης
  choice: bondade
  rationale: No contexto, designa uma disposição benigna e benevolente. “Bondade” é natural e digna em português, mantendo-se distinta do “amor pela humanidade”.
- source_word: φιλανθρωπία
  choice: amor ... pela humanidade
  rationale: O termo indica benevolência ou amor dirigido aos seres humanos. A formulação é clara no português atual e evita tanto o sentido moderno restrito de “filantropia” quanto linguagem marcada por gênero.
- source_word: ἐπεφάνη
  choice: se manifestaram
  rationale: O verbo expressa aparecimento ou manifestação. O plural em português faz concordância natural com os dois sujeitos coordenados, “a bondade e o amor”, sem alterar o sentido do singular grego, cuja concordância pode se orientar pelo conjunto ou pelo sujeito mais próximo.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: de Deus, nosso Salvador
  rationale: A expressão genitiva modifica conjuntamente “bondade” e “amor”. A ordem portuguesa preserva Deus como referente do título “nosso Salvador”; as vírgulas tornam clara a aposição.
theological_decisions:
- issue: Referente de “Deus, nosso Salvador”
  choice: Preservar o título aplicado a Deus neste versículo, sem inserir uma identificação explicativa no texto.
  alternative: Explicitar “Deus Pai, nosso Salvador” ou entender o título de modo não específico quanto à pessoa.
  rationale: O contexto das Cartas Pastorais frequentemente aplica “Deus, nosso Salvador” ao Pai, enquanto Tito 3:6 menciona Jesus Cristo de modo distinto. A tradução conserva a formulação do original e não resolve além do que o versículo declara.
translation_notes:
  register: Português moderno, amplo e digno, com boa legibilidade brasileira. Evitou-se “filantropia” por seu sentido técnico contemporâneo. O deslocamento de “pela humanidade” após a expressão sobre Deus produz uma frase mais natural, embora exija vírgulas para deixar claro que o amor pertence a Deus e se dirige à humanidade.
