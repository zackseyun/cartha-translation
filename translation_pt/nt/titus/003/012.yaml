id: TIT.3.12
reference: Titus 3:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὅταν πέμψω Ἀρτεμᾶν πρὸς σὲ ἢ Τυχικόν, σπούδασον ἐλθεῖν πρός με εἰς Νικόπολιν, ἐκεῖ γὰρ κέκρικα παραχειμάσαι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/012.yaml
  text: When I send Artemas or Tychicus to you[a], make every effort to come to me at Nicopolis[b], for I have decided to spend the winter there.
translation:
  language: pt
  text: Quando eu lhe enviar Ártemas ou Tíquico, faça todo o possível para vir ao meu encontro em Nicópolis, pois decidi passar o inverno ali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν πέμψω
  choice: Quando eu lhe enviar
  rationale: A construção com ὅταν e o subjuntivo aoristo aponta para um acontecimento futuro esperado. Em português, o futuro do subjuntivo depois de “quando” expressa isso de modo natural.
- source_word: Ἀρτεμᾶν
  choice: Ártemas
  rationale: Transliteração consagrada e ajustada à ortografia portuguesa.
- source_word: ἢ Τυχικόν
  choice: ou Tíquico
  rationale: ἤ apresenta dois possíveis enviados; o nome é transliterado segundo o uso corrente em português.
- source_word: σπούδασον
  choice: faça todo o possível
  rationale: O imperativo comunica empenho diligente e também prontidão, sem reduzi-lo apenas à ideia de pressa.
- source_word: ἐλθεῖν πρός με
  choice: vir ao meu encontro
  rationale: O movimento é em direção ao remetente. A formulação portuguesa evita a repetição pouco elegante de “vir a mim a Nicópolis” e preserva a direção pessoal.
- source_word: εἰς Νικόπολιν
  choice: em Nicópolis
  rationale: Embora εἰς indique direção, essa direção já está expressa por “vir ao meu encontro”; “em Nicópolis” identifica naturalmente o lugar do encontro.
- source_word: γὰρ
  choice: pois
  rationale: Introduz a razão do pedido em registro atual e digno.
- source_word: κέκρικα
  choice: decidi
  rationale: O perfeito apresenta uma decisão já tomada e ainda vigente. O pretérito perfeito português transmite naturalmente esse resultado presente.
- source_word: παραχειμάσαι
  choice: passar o inverno
  rationale: Equivalente idiomático claro do infinitivo que significa permanecer em algum lugar durante o inverno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, sem eliminar a contingência sobre qual dos dois mensageiros seria enviado nem a firmeza da decisão de Paulo.
