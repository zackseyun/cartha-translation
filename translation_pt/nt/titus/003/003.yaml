id: TIT.3.3
reference: Titus 3:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἦμεν γάρ ποτε καὶ ἡμεῖς ἀνόητοι, ἀπειθεῖς, πλανώμενοι, δουλεύοντες ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις, ἐν κακίᾳ καὶ φθόνῳ διάγοντες, στυγητοί, μισοῦντες ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/003.yaml
  text: For we ourselves also were once foolish[a], disobedient, being led astray, enslaved to various desires and pleasures, spending our lives in malice and envy, hateful[b], hating one another.
translation:
  language: pt
  text: Pois nós mesmos também éramos, no passado, insensatos, desobedientes, enganados[a], escravizados por vários desejos e prazeres, vivendo em maldade e inveja, detestáveis[b] e odiando uns aos outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desencaminhados”.
    reason: lexical_alternative
  - marker: b
    text: Ou “odiados”. O adjetivo grego pode ser entendido em sentido ativo (“detestáveis”) ou passivo (“odiados”).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦμεν γάρ ποτε καὶ ἡμεῖς
  choice: Pois nós mesmos também éramos, no passado
  rationale: “Pois” preserva a conexão explicativa de γάρ; “nós mesmos também” mantém a ênfase inclusiva de καὶ ἡμεῖς; “no passado” expressa ποτε com naturalidade em português.
- source_word: ἀνόητοι
  choice: insensatos
  rationale: Expressa falta de entendimento e discernimento moral, conservando o tom digno da lista de vícios.
- source_word: ἀπειθεῖς
  choice: desobedientes
  rationale: Representa o sentido contextual de recusa em se deixar persuadir e consequente desobediência.
- source_word: πλανώμενοι
  choice: enganados
  rationale: O particípio admite sentido passivo ou médio; “enganados” é conciso e natural, enquanto a alternativa “desencaminhados” preserva mais explicitamente a imagem de desvio e consta em nota.
- source_word: δουλεύοντες
  choice: escravizados
  rationale: Preserva a força da linguagem de escravidão e a sujeição a desejos e prazeres, em vez de enfraquecê-la para simples serviço.
- source_word: ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις
  choice: por vários desejos e prazeres
  rationale: “Desejos” evita restringir ἐπιθυμίαις ao âmbito sexual; “vários” comunica ποικίλαις e aplica-se naturalmente ao conjunto coordenado.
- source_word: ἐν κακίᾳ καὶ φθόνῳ διάγοντες
  choice: vivendo em maldade e inveja
  rationale: “Vivendo” transmite a conduta continuada indicada por διάγοντες. “Maldade” mantém a amplitude possível de κακία sem limitar o termo apenas à intenção maliciosa.
- source_word: στυγητοί
  choice: detestáveis
  rationale: Mantém a leitura ativa, isto é, pessoas dignas de aversão. Como o adjetivo também pode ser entendido passivamente, “odiados”, essa ambiguidade é registrada em nota.
- source_word: μισοῦντες ἀλλήλους
  choice: odiando uns aos outros
  rationale: Tradução direta e idiomática do particípio com o pronome recíproco.
theological_decisions:
- issue: Força da linguagem de δουλεύοντες quando desejos e prazeres são os senhores
  choice: escravizados por vários desejos e prazeres
  alternative: servindo a vários desejos e prazeres
  rationale: “Escravizados” conserva a imagem forte de sujeição moral presente no verbo sem acrescentar um sistema doutrinário ao texto.
- issue: Voz e sentido de στυγητοί
  choice: detestáveis
  alternative: odiados
  rationale: A leitura ativa se encaixa na caracterização ética da antiga maneira de viver e forma uma sequência natural com “odiando uns aos outros”; a possibilidade passiva permanece explícita na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração conserva o ritmo da lista grega; termos fortes como “escravizados” não foram suavizados, e ambiguidades reais foram preservadas em notas.
