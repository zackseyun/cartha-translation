source:
  edition: SBLGNT
  text: μηδένα βλασφημεῖν, ἀμάχους εἶναι, ἐπιεικεῖς, πᾶσαν ἐνδεικνυμένους πραΰτητα πρὸς πάντας ἀνθρώπους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/002.yaml
  text: to slander no one[a], to be peaceable, gentle[c][b], showing all meekness toward all people.
translation:
  language: pt
  text: que não difamem ninguém[a], não sejam briguentos[b], sejam gentis e demonstrem toda a mansidão[c] para com todas as pessoas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não falem mal de ninguém”. O verbo pode abranger fala injuriosa de modo mais amplo que a difamação em sentido estrito.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sejam pacíficos” ou “não sejam contenciosos”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “toda a gentileza”. “Mansidão” foi usada para distinguir πραΰτης de ἐπιεικεῖς (“gentis”) na frase anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδένα
  choice: ninguém
  rationale: Objeto de βλασφημεῖν; preserva de modo natural e direto o alcance universal da proibição.
- source_word: βλασφημεῖν
  choice: difamem
  rationale: Neste contexto de conduta interpessoal, refere-se a falar de alguém de modo injurioso ou prejudicial, não a blasfemar contra Deus. “Difamar” é claro, embora o verbo grego possa abranger de forma mais ampla o ato de falar mal.
- source_word: ἀμάχους
  choice: não sejam briguentos
  rationale: Expressa de maneira corrente a ideia negativa de não procurar brigas ou contendas, preservando a forma semântica do adjetivo grego.
- source_word: εἶναι
  choice: sejam
  rationale: O infinitivo integra a série de exortações dependente do verbo do versículo anterior; em português, a forma pessoal no subjuntivo produz uma continuação natural.
- source_word: ἐπιεικεῖς
  choice: cordiais
  rationale: Comunica uma disposição branda, razoável e condescendente sem repetir “mansidão”, escolhida para πραΰτητα. “Amáveis” ou “moderados” também seriam possíveis.
- source_word: πᾶσαν
  choice: toda a
  rationale: Intensifica a abrangência da qualidade indicada por πραΰτητα e é idiomático diante do substantivo abstrato em português.
- source_word: ἐνδεικνυμένους
  choice: demonstrem
  rationale: Verbo corrente que transmite a manifestação visível dessa atitude; a forma pessoal coordena naturalmente a expressão com as exortações anteriores.
- source_word: πραΰτητα
  choice: mansidão
  rationale: Preserva a ideia de força controlada, brandura e humildade, além de manter distinção lexical em relação a ἐπιεικεῖς.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: para com todas as pessoas
  rationale: “Para com” expressa a orientação da conduta, e “todas as pessoas” traduz o sentido humano genérico de ἀνθρώπους sem sugerir referência exclusiva a homens.
theological_decisions:
- issue: Sentido interpessoal de βλασφημεῖν
  choice: difamem
  alternative: falem mal de
  rationale: Como μηδένα designa pessoas, o verbo descreve fala injuriosa contra outros, não blasfêmia dirigida a Deus. A nota conserva o alcance lexical mais amplo.
- issue: Relação entre ἐπιεικεῖς e πραΰτητα
  choice: cordiais / mansidão
  alternative: amáveis / gentileza
  rationale: Empregar termos distintos evita apagar a distinção entre as duas palavras gregas, sem impor uma separação teológica rígida entre qualidades semanticamente próximas.
- issue: Referência genérica de ἀνθρώπους
  choice: todas as pessoas
  alternative: todos os seres humanos
  rationale: O substantivo é gramaticalmente masculino, mas semanticamente genérico; a tradução inclui explicitamente toda pessoa, como requer o alcance do original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A estrutura pessoal com “que” retoma naturalmente a exortação iniciada no versículo anterior. “Briguentos” é corrente sem ser vulgar; “cordiais” e “mansidão” preservam a proximidade e, ao mesmo tempo, a distinção dos dois termos gregos.
