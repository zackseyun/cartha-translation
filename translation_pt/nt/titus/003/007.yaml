id: TIT.3.7
reference: Titus 3:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα δικαιωθέντες τῇ ἐκείνου χάριτι κληρονόμοι ⸀γενηθῶμεν κατ’ ἐλπίδα ζωῆς αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/007.yaml
  text: so that[a], having been justified by his grace[b], we might become heirs according to the hope of eternal life.
translation:
  language: pt
  text: para que, tendo sido justificados[a] por sua graça, nos tornássemos herdeiros segundo a esperança da vida eterna.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Justificados» também pode ser traduzido por «declarados justos».
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «na esperança da vida eterna».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade ou o resultado da ação salvadora descrita no contexto e é a formulação mais natural em português.
- source_word: δικαιωθέντες
  choice: tendo sido justificados
  rationale: Preserva a voz passiva e apresenta a justificação como anterior, em termos lógicos ou temporais, a nos tornarmos herdeiros.
- source_word: τῇ ἐκείνου χάριτι
  choice: por sua graça
  rationale: O dativo tem valor instrumental. A forma possessiva mantém a referência masculina implícita sem identificar mais explicitamente do que o grego quem é o referente.
- source_word: κληρονόμοι
  choice: herdeiros
  rationale: Conserva a imagem bíblica e pactual de receber uma herança.
- source_word: γενηθῶμεν
  choice: nos tornássemos
  rationale: Expressa a entrada em uma nova condição e, depois de «para que», emprega naturalmente o subjuntivo exigido pela sintaxe portuguesa no contexto passado.
- source_word: κατ’ ἐλπίδα
  choice: segundo a esperança
  rationale: Preserva de modo relativamente transparente a preposição κατά e a relação, deliberadamente não estreitada, entre a condição de herdeiros e a esperança.
- source_word: ζωῆς αἰωνίου
  choice: da vida eterna
  rationale: Mantém a expressão bíblica consagrada e permite que o genitivo indique o conteúdo ou objeto da esperança.
theological_decisions:
- issue: Sentido de δικαιωθέντες no contexto da salvação
  choice: justificados
  alternative: declarados justos
  rationale: «Justificados» mantém a conexão lexical e teológica com δικαιόω sem definir no próprio texto o mecanismo ou todas as dimensões do ato.
- issue: Referente de ἐκείνου
  choice: sua
  alternative: dele / daquele
  rationale: A forma escolhida evita explicitar como Deus ou Jesus Cristo um referente que o versículo deixa implícito, preservando a tensão contextual.
- issue: Relação expressa por κατ’ ἐλπίδα
  choice: segundo a esperança da vida eterna
  alternative: na esperança da vida eterna
  rationale: A redação principal conserva a forma relacional de κατά sem decidir se a esperança descreve a esfera, a norma ou a expectativa associada à herança; a alternativa idiomática é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção «tendo sido justificados» conserva a relação do particípio grego, enquanto «nos tornássemos» produz uma oração final natural em português. As notas registram alternativas relevantes sem impor uma interpretação denominacional.
