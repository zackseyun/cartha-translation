  text: Ὑπομίμνῃσκε αὐτοὺς ⸀ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι πειθαρχεῖν, πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/001.yaml
  text: Remind them to be subject to rulers and authorities[a], to be obedient, to be ready for every good work,
translation:
  language: pt
  text: Lembre-os de que se sujeitem aos governantes e às autoridades, que obedeçam e que estejam prontos para toda boa obra,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπομίμνῃσκε
  choice: Lembre
  rationale: O imperativo presente dirigido a Tito pede que continue trazendo essa instrução à memória da comunidade. “Lembre” é natural em português e permite que o aspecto continuativo fique implícito.
- source_word: αὐτοὺς
  choice: a todos
  rationale: O pronome retoma os fiéis mencionados no contexto. “A todos” é uma retomada natural em português e não altera o alcance plural do original.
- source_word: ἀρχαῖς
  choice: governantes
  rationale: Neste contexto cívico, o termo se refere a quem exerce governo, não a poderes cósmicos. “Governantes” preserva o componente pessoal da expressão.
- source_word: ἐξουσίαις
  choice: autoridades
  rationale: Em paralelo com ἀρχαῖς, designa autoridades ou poderes constituídos. A tradução mantém os dois termos distintos.
- source_word: ὑποτάσσεσθαι
  choice: se sujeitem
  rationale: Expressa colocar-se sob a ordem ou autoridade de alguém. “Sujeitar-se” conserva o tom cívico e a forma reflexiva do infinitivo grego sem sugerir servilismo irrestrito.
- source_word: πειθαρχεῖν
  choice: obedeçam
  rationale: O verbo indica obediência a quem exerce autoridade. “Obedeçam” é direto, atual e forma uma sequência natural de exortações em português.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: para toda boa obra
  rationale: πρός com o acusativo indica orientação ou prontidão para agir. “Toda boa obra” preserva a formulação ética tradicional e continua compreensível hoje.
- source_word: ἑτοίμους εἶναι
  choice: estejam prontos
  rationale: A expressão descreve um estado de prontidão. “Estejam prontos” é conciso e idiomático.
theological_decisions:
- issue: Alcance da submissão às estruturas civis
  choice: Apresentar uma exortação geral à submissão e à obediência aos governantes e autoridades, sem acrescentar que essa obediência seja absoluta em toda circunstância imaginável.
  alternative: Traduzir ou expandir a frase de modo a sugerir obediência incondicional ao poder civil.
  rationale: Os termos ἀρχαῖς e ἐξουσίαις apontam, neste contexto, para estruturas civis de governo. A tradução mantém a força da exortação, mas não resolve no texto uma questão de limites que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A coordenação “que se sujeitem..., que obedeçam e estejam...” torna clara a sequência de infinitivos dependentes de “Lembre”. Não foram necessárias notas de rodapé.
