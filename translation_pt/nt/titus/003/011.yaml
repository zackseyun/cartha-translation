id: TIT.3.11
reference: Titus 3:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰδὼς ὅτι ἐξέστραπται ὁ τοιοῦτος καὶ ἁμαρτάνει, ὢν αὐτοκατάκριτος.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/011.yaml
  text: knowing that such a person is warped and is sinning[c][b][a], being self-condemned.
translation:
  language: pt
  text: sabendo que tal pessoa[b] está desviada[a] e vive pecando, estando condenada por si mesma[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se desviou” ou “está pervertida”. O verbo grego no perfeito indica um estado resultante de um desvio anterior.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “alguém assim”; a expressão grega está no masculino singular.
    reason: lexical_alternative
  - marker: c
    text: Ou “autocondenada”. O termo pode indicar que a pessoa é condenada por seus próprios atos ou por seu próprio testemunho contra si.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: sabendo
  rationale: Mantém a forma participial e sua ligação com a instrução do versículo anterior, sem definir além do texto se a relação é causal ou circunstancial.
- source_word: ἐξέστραπται
  choice: está desviada
  rationale: O perfeito expressa um estado presente resultante de um desvio anterior. “Está desviada” comunica esse estado sem a possível conotação sexual moderna de “pervertida”.
- source_word: ὁ τοιοῦτος
  choice: tal pessoa
  rationale: Retoma de modo natural, em português, o indivíduo faccioso mencionado no contexto. Embora a expressão grega esteja no masculino singular, aqui o masculino é gramatical e a referência é genericamente individual.
- source_word: ἁμαρτάνει
  choice: vive pecando
  rationale: Expressa com naturalidade o aspecto durativo do presente grego, sem transformar a frase numa afirmação mais ampla sobre uma condição permanente.
- source_word: ὢν
  choice: estando
  rationale: Preserva a construção participial que liga a descrição final ao restante da oração.
- source_word: αὐτοκατάκριτος
  choice: condenada por si mesma
  rationale: 'Conserva a força reflexiva do adjetivo: a própria conduta ou o próprio testemunho da pessoa a deixa sob condenação, sem especificar um juízo formal ou escatológico.'
theological_decisions:
- issue: Referência de gênero em ὁ τοιοῦτος
  choice: tal pessoa
  alternative: tal homem
  rationale: A forma grega é masculina singular, mas funciona como referência ao indivíduo desse tipo. “Tal pessoa” é uma expressão portuguesa natural e não altera o caráter singular da referência.
- issue: Sentido de αὐτοκατάκριτος
  choice: condenada por si mesma
  alternative: autocondenada
  rationale: A formulação preserva a ambiguidade entre condenação evidenciada pela própria conduta e condenação decorrente do próprio testemunho, sem importar uma doutrina mais desenvolvida de juízo final.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Vive pecando” comunica a ação em curso; “está desviada” evita uma conotação moderna indevida sem perder o estado resultante expresso pelo perfeito grego.
