lexical_decisions:
- source_word: οὗ
  choice: o qual
  rationale: O pronome relativo retoma «o Espírito Santo» no versículo anterior. «O qual» concorda com esse antecedente masculino e mantém de modo claro a referência pessoal, sem forçar em português uma distinção equivalente ao inglês “whom/which”.
- source_word: ἐξέχεεν
  choice: derramou
  rationale: É o sentido direto e corrente de ἐκχέω e preserva a imagem bíblica do Espírito sendo derramado.
- source_word: ἐφ’ ἡμᾶς
  choice: sobre nós
  rationale: ἐπί com acusativo expressa aqui direção ou extensão sobre os destinatários; «sobre nós» é natural e preciso em português.
- source_word: πλουσίως
  choice: ricamente
  rationale: Preserva a ideia lexical de riqueza e abundância, além de soar digna e compreensível no contexto.
- source_word: διὰ
  choice: por meio de
  rationale: διά com genitivo indica mediação ou agência. «Por meio de» explicita essa relação com naturalidade.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Χριστός é entendido aqui como título e traduzido pelo seu sentido, «Messias». O artigo e as vírgulas tornam a construção idiomática em português.
- source_word: τοῦ σωτῆρος ἡμῶν
  choice: nosso Salvador
  rationale: Reproduz naturalmente o título σωτήρ e o genitivo possessivo ἡμῶν.
theological_decisions:
- issue: Referente do pronome relativo οὗ
  choice: O pronome retoma o Espírito Santo mencionado em Tito 3:5, de modo que Deus derrama o Espírito sobre nós.
  alternative: Usar o relativo mais simples «que», sem destacar formalmente o antecedente.
  rationale: O antecedente imediato é «Espírito Santo». A forma «o qual» torna essa ligação clara sem resolver além do que a sintaxe e o contexto sustentam.
- issue: Tradução de Χριστοῦ como título
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: Neste contexto, Χριστός conserva valor titular junto de «nosso Salvador». «Messias» comunica o significado do título, enquanto a forma tradicional é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da oração acompanha o vínculo com o versículo anterior; «por meio de» evita ambiguidade quanto à mediação, e a aposição «Jesus, o Messias, nosso Salvador» apresenta os dois títulos com naturalidade.
