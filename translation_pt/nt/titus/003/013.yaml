base_translation:
  language: en
  yaml_path: translation/nt/titus/003/013.yaml
  text: Diligently send Zenas the lawyer and Apollos on their way[a], so that they may lack nothing.
translation:
  language: pt
  text: Ajude diligentemente Zenas, o jurista, e Apolo a seguirem viagem[a], para que nada lhes falte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Providencie diligentemente a partida de Zenas, o jurista, e Apolo”. O verbo pode incluir dar aos viajantes o apoio prático necessário, e não apenas despedi-los.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζηνᾶν
  choice: Zenas
  rationale: Transliteração tradicional e amplamente reconhecida em português para o nome próprio grego.
- source_word: τὸν νομικόν
  choice: o jurista
  rationale: νομικός designa alguém versado em direito ou lei. “Jurista” é conciso, natural e evita decidir se se trata especificamente da lei civil romana ou da lei judaica.
- source_word: Ἀπολλῶν
  choice: Apolo
  rationale: Forma tradicional do nome próprio em traduções portuguesas e distinta do nome da divindade apenas pelo contexto.
- source_word: σπουδαίως
  choice: com dedicação
  rationale: O advérbio exprime empenho, zelo e atenção séria; “com dedicação” soa natural em português e não restringe o sentido à pressa.
- source_word: πρόπεμψον
  choice: Ajude ... a prosseguirem viagem
  rationale: Em contexto de viagem, προπέμπω pode incluir encaminhar viajantes e lhes prestar apoio prático. A formulação torna esse sentido disponível sem especificar provisões não mencionadas explicitamente.
- source_word: ἵνα μηδὲν αὐτοῖς λείπῃ
  choice: para que nada lhes falte
  rationale: Preserva de maneira direta a oração de finalidade e a abrangência de μηδέν, sem limitar antecipadamente aquilo de que poderiam precisar.
theological_decisions:
- issue: Sentido de νομικός aplicado a Zenas
  choice: o jurista
  alternative: o especialista na Lei
  rationale: O contexto não determina com segurança se a especialidade de Zenas era o direito em sentido profissional geral ou especificamente a Lei judaica. “Jurista” preserva melhor essa abertura sem introduzir uma identificação teológica.
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática natural. “Com dedicação” comunica zelo sem sugerir apenas rapidez; “prossseguirem viagem” explicita o contexto itinerante do verbo. A vírgula marca “o jurista” como aposto de Zenas.
