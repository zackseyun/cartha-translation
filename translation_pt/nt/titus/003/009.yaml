source:
  edition: SBLGNT
  text: μωρὰς δὲ ζητήσεις καὶ γενεαλογίας καὶ ⸀ἔρεις καὶ μάχας νομικὰς περιΐστασο, εἰσὶν γὰρ ἀνωφελεῖς καὶ μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/009.yaml
  text: But avoid foolish controversies and genealogies and strife and quarrels about the law[b][a], for they are unprofitable and futile.
translation:
  language: pt
  text: Mas evite discussões insensatas[a], genealogias, discórdias e brigas a respeito da lei[b], pois são inúteis e vazias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “controvérsias” ou “especulações”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “brigas relativas à lei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς ζητήσεις
  choice: discussões insensatas
  rationale: A expressão se refere a investigações ou debates de caráter insensato e contencioso. “Discussões insensatas” é natural em português e preserva tanto a natureza da atividade quanto sua avaliação negativa.
- source_word: γενεαλογίας
  choice: genealogias
  rationale: Tradução direta que evita identificar no texto principal uma reconstrução histórica específica.
- source_word: ἔρεις
  choice: discórdias
  rationale: O termo denota contenda e desunião. “Discórdias” o distingue das “brigas” mencionadas em seguida, embora preserve a sobreposição semântica.
- source_word: μάχας νομικὰς
  choice: brigas a respeito da Lei
  rationale: O substantivo indica conflitos, aqui provavelmente verbais, e o adjetivo especifica sua relação com a lei. A formulação evita a ideia moderna de processos ou litígios judiciais.
- source_word: περιΐστασο
  choice: evite
  rationale: O imperativo médio pede que Tito se mantenha afastado dessas coisas. “Evite” expressa isso de maneira concisa e natural.
- source_word: ἀνωφελεῖς
  choice: inúteis
  rationale: Expressa aquilo que não traz benefício ou proveito, em linguagem corrente.
- source_word: μάταιοι
  choice: vazias
  rationale: O termo comunica vacuidade e falta de propósito. “Vazias” complementa “inúteis” sem reduzir ambos os adjetivos à mesma ideia.
theological_decisions:
- issue: Natureza das “genealogias” e das “brigas a respeito da Lei”
  choice: Manter os termos genéricos, sem identificar uma corrente histórica ou doutrinária específica.
  alternative: Interpretar as genealogias como debates judaicos sobre linhagem ou como especulações míticas protognósticas.
  rationale: O versículo não define essas práticas com precisão suficiente para que a tradução imponha uma reconstrução histórica particular.
- issue: Referente de νομικὰς
  choice: Entender o adjetivo como relativo à Lei, isto é, brigas cujo assunto é a Lei.
  alternative: Traduzir como “brigas jurídicas”, o que poderia sugerir disputas judiciais.
  rationale: No contexto das Epístolas Pastorais, a referência temática à Lei é mais provável e evita uma associação anacrônica com processos legais modernos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A inicial maiúscula em “Lei” sinaliza a provável referência à lei religiosa, sem especificar no texto principal um sistema histórico além do que o contexto permite.
