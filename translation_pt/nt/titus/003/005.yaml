  text: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ⸀ἃ ἐποιήσαμεν ἡμεῖς ἀλλὰ κατὰ ⸂τὸ αὐτοῦ ἔλεος⸃ ἔσωσεν ἡμᾶς διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/005.yaml
  text: not from works done in righteousness, which we ourselves did, but according to his mercy he saved us, through the washing of regeneration and renewal by the Holy Spirit,
translation:
  language: pt
  text: não por obras que nós mesmos praticamos em justiça[a], mas, segundo a sua misericórdia, ele nos salvou por meio da lavagem da regeneração[b] e da renovação pelo Espírito Santo[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em retidão”. A palavra grega pode indicar justiça ou retidão.
    reason: alternative_reading
  - marker: b
    text: “Lavagem” pode referir-se ao batismo, à imagem de purificação ou a ambos; o grego não exige que essa questão seja decidida explicitamente na tradução.
    reason: lexical_alternative
  - marker: c
    text: Ou “renovação do Espírito Santo”. A construção grega permite pequenas diferenças na maneira de relacionar o Espírito Santo à renovação.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: não por obras
  rationale: Em português, “por” exprime naturalmente a base ou o meio negado por ἐκ neste contraste, sem sugerir que as obras sejam a origem da salvação.
- source_word: τῶν ἐν δικαιοσύνῃ
  choice: praticadas em justiça
  rationale: A expressão preposicional caracteriza as obras; “praticadas” torna a relação idiomática em português. “Justiça” conserva a amplitude semântica de δικαιοσύνη, inclusive a ideia de conduta justa.
- source_word: ἃ ἐποιήσαμεν ἡμεῖς
  choice: por nós mesmos
  rationale: A formulação evita a repetição pesada de “obras que nós mesmos fizemos” e preserva a ênfase do pronome explícito ἡμεῖς sobre a ação humana.
- source_word: κατὰ τὸ αὐτοῦ ἔλεος
  choice: segundo a sua misericórdia
  rationale: “Segundo” reflete de perto κατά como padrão ou fundamento e mantém o contraste entre as obras humanas e a misericórdia divina.
- source_word: ἔσωσεν ἡμᾶς
  choice: ele nos salvou
  rationale: “Salvou” é a equivalência corrente e adequada de σῴζω neste contexto soteriológico.
- source_word: διὰ λουτροῦ
  choice: mediante o lavar
  rationale: “Mediante” comunica o valor instrumental de διά com genitivo. O substantivo “lavar” preserva a imagem de λουτρόν sem inserir explicitamente “batismo” ou reduzir a expressão a uma metáfora.
- source_word: παλιγγενεσίας
  choice: da regeneração
  rationale: “Regeneração” conserva a precisão e o peso teológico tradicional de παλιγγενεσία, cujo sentido básico envolve novo nascimento ou renascimento.
- source_word: καὶ ἀνακαινώσεως
  choice: e a renovação
  rationale: O substantivo “renovação” reproduz a coordenação nominal do grego e é natural em português.
- source_word: πνεύματος ἁγίου
  choice: pelo Espírito Santo
  rationale: “Pelo” apresenta o Espírito Santo como agente ou fonte da renovação, leitura provável do genitivo, sem ampliar explicitamente sua relação aos dois substantivos anteriores.
theological_decisions:
- issue: Sentido de δικαιοσύνη no contexto
  choice: justiça
  alternative: retidão
  rationale: Em português, “justiça” é o correspondente mais direto e amplo de δικαιοσύνη. Aqui descreve a esfera ou qualidade das obras; “retidão” seria possível, mas estreitaria ligeiramente o campo semântico.
- issue: Sentido de διὰ λουτροῦ παλιγγενεσίας
  choice: 'linguagem instrumental sem explicitar um mecanismo sacramental: “mediante o lavar da regeneração”'
  alternative: “mediante o lavar batismal do novo nascimento” ou “mediante a purificação do renascimento”
  rationale: λουτρόν pode evocar o batismo, a purificação ou ambos. O texto principal mantém “lavar” e não introduz “batismo”, preservando a tensão interpretativa do grego.
- issue: Relação de πνεύματος ἁγίου com os genitivos anteriores
  choice: 'ligar mais diretamente a agência do Espírito à renovação: “a renovação pelo Espírito Santo”'
  alternative: “a renovação do Espírito Santo”
  rationale: A proximidade sintática favorece a relação com ἀνακαινώσεως. “Pelo Espírito Santo” comunica agência ou fonte, enquanto a nota registra a construção genitiva mais formal e sua possível amplitude.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem mantém o contraste enfático entre obras humanas e misericórdia divina. “O lavar” é deliberadamente mais formal que “a lavagem”, pois evita conotações domésticas e preserva a imagem teológica sem resolver sua referência.
