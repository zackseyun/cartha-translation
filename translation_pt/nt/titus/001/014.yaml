id: TIT.1.14
reference: Titus 1:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ προσέχοντες Ἰουδαϊκοῖς μύθοις καὶ ἐντολαῖς ἀνθρώπων ἀποστρεφομένων τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/014.yaml
  text: not paying attention to Jewish myths and commandments of people who turn away from the truth[a].
translation:
  language: pt
  text: não dando atenção a mitos judaicos nem a mandamentos de pessoas que se desviam da verdade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se dedicando a mitos judaicos nem a preceitos humanos vindos de pessoas que se desviam da verdade”.'
    reason: Alternativa lexical para μὴ προσέχοντες e ἐντολαῖς ἀνθρώπων, preservando a ligação do particípio com “pessoas”.
lexical_decisions:
- source_word: μὴ προσέχοντες
  choice: não dando atenção a
  rationale: O particípio presente dá continuidade à exortação do contexto e descreve aquilo a que os ouvintes não devem dirigir a mente. A expressão é natural em português e mantém a ideia de prestar atenção ou dedicar-se a algo.
- source_word: Ἰουδαϊκοῖς μύθοις
  choice: mitos judaicos
  rationale: μῦθος designa histórias inventadas ou lendas, e Ἰουδαϊκοῖς caracteriza esses mitos como judaicos em natureza ou origem. “Mitos judaicos” é claro e contemporâneo.
- source_word: ἐντολαῖς ἀνθρώπων
  choice: mandamentos de pessoas
  rationale: A formulação conserva o sentido de ordens ou preceitos de origem meramente humana, sem empregar linguagem masculina que poderia ser entendida de modo restritivo.
- source_word: ἀποστρεφομένων
  choice: que se desviam de
  rationale: O particípio genitivo plural liga-se mais naturalmente a ἀνθρώπων. “Desviar-se” preserva a imagem de afastamento ou rejeição presente no verbo.
- source_word: τὴν ἀλήθειαν
  choice: a verdade
  rationale: Tradução direta e convencional, sem explicitar além do texto que se trata da verdade do evangelho.
theological_decisions:
- issue: Referente do particípio genitivo ἀποστρεφομένων
  choice: 'O particípio modifica “pessoas”: “mandamentos de pessoas que se desviam da verdade”.'
  alternative: Entender o particípio de maneira mais ampla, associando tanto os mitos quanto os mandamentos às pessoas que se desviam da verdade.
  rationale: A concordância no genitivo plural e a proximidade de ἀνθρώπων tornam essa a ligação gramatical mais natural, sem acrescentar uma afirmação doutrinária não expressa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Mitos judaicos” e “mandamentos de pessoas” mantêm proximidade com o grego; “não dando atenção” evita o tom arcaico de “não dando ouvidos” ou “não atendendo”.
