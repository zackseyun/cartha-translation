id: TIT.1.1
reference: Titus 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παῦλος δοῦλος θεοῦ, ἀπόστολος δὲ Ἰησοῦ Χριστοῦ κατὰ πίστιν ἐκλεκτῶν θεοῦ καὶ ἐπίγνωσιν ἀληθείας τῆς κατ’ εὐσέβειαν
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/001.yaml
  text: Paul[a], a slave of God and an apostle of Jesus the Messiah, for the faith of God’s chosen ones and the knowledge of the truth that accords with godliness[c][b],
translation:
  language: pt
  text: Paulo, escravo de Deus e apóstolo de Jesus, o Messias, com vistas à fé dos escolhidos de Deus[a] e ao conhecimento[b] da verdade que está de acordo com a devoção a Deus[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eleitos de Deus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pleno conhecimento”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a verdade que conduz à devoção a Deus”.'
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: escravo
  rationale: Preserva a ideia de pertencimento completo e submissão a Deus, mais forte do que “servo”, sem suavizar a autodesignação de Paulo.
- source_word: ἀπόστολος
  choice: apóstolo
  rationale: É o termo consagrado e preciso para o ofício comissionado de Paulo.
- source_word: δὲ
  choice: e
  rationale: Aqui a partícula liga duas autodesignações sem indicar contraste forte; “e” é natural em português.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título e emprega o artigo necessário para uma formulação idiomática em português.
- source_word: κατὰ
  choice: com vistas a
  rationale: Expressa a orientação ou finalidade do apostolado de Paulo, preservando a flexibilidade da construção grega sem impor uma relação estritamente causal.
- source_word: πίστιν
  choice: fé
  rationale: Neste contexto, designa naturalmente a resposta de confiança dos escolhidos de Deus.
- source_word: ἐκλεκτῶν θεοῦ
  choice: escolhidos de Deus
  rationale: Comunica claramente a escolha divina em linguagem acessível, sem acrescentar um sistema teológico específico.
- source_word: ἐπίγνωσιν
  choice: conhecimento
  rationale: É a tradução natural no contexto; a possível nuance intensiva é preservada em nota.
- source_word: ἀληθείας
  choice: a verdade
  rationale: Representa o substantivo articulado grego e aponta para a verdade reconhecida pelos fiéis.
- source_word: τῆς κατ’ εὐσέβειαν
  choice: que está de acordo com a devoção a Deus
  rationale: Mantém a relação de conformidade expressa por κατά sem decidir que a verdade necessariamente produz essa devoção.
- source_word: εὐσέβειαν
  choice: devoção a Deus
  rationale: Expressa em linguagem atual a reverência e a conduta orientadas para Deus, evitando a possível leitura moderna de “piedade” como mera compaixão.
theological_decisions:
- issue: Sentido de ἐκλεκτῶν θεοῦ
  choice: escolhidos de Deus
  alternative: eleitos de Deus
  rationale: A formulação preserva a ação divina de escolher, mas permanece clara e não importa uma definição denominacional da eleição.
- issue: Relação de κατὰ com πίστιν e ἐπίγνωσιν
  choice: com vistas à fé ... e ao conhecimento
  alternative: segundo a fé ... e o conhecimento
  rationale: A construção grega admite referência, norma ou orientação. A opção principal comunica a provável orientação do apostolado de Paulo sem eliminar por completo a flexibilidade sintática.
- issue: Relação entre verdade e εὐσέβεια
  choice: a verdade que está de acordo com a devoção a Deus
  alternative: a verdade que conduz à devoção a Deus
  rationale: A tradução principal conserva a relação ampla expressa por κατά e não transforma implicitamente essa relação em causalidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Escravo” mantém a força de δοῦλος; “devoção a Deus” evita a ambiguidade contemporânea de “piedade”. A vírgula final foi mantida porque o versículo continua sintaticamente em Tito 1:2.
