source:
  edition: SBLGNT
  text: ἐφανέρωσεν δὲ καιροῖς ἰδίοις, τὸν λόγον αὐτοῦ ἐν κηρύγματι ὃ ἐπιστεύθην ἐγὼ κατ’ ἐπιταγὴν τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/003.yaml
  text: but in his own times he revealed his word through the proclamation with which I was entrusted[a], according to the command of God our Savior[c][b],
translation:
  language: pt
  text: mas revelou, nos seus próprios tempos[a], a sua palavra por meio da proclamação[b] que me foi confiada[c], segundo a ordem de Deus, nosso Salvador,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos tempos apropriados”. Literalmente: “nos seus próprios tempos”; a expressão pode indicar os tempos estabelecidos por Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por meio da pregação”. O termo grego pode referir-se tanto ao ato de proclamar quanto à mensagem proclamada.'
    reason: lexical_alternative
  - marker: c
    text: 'A oração relativa também pode ser ligada a “a sua palavra”: “a sua palavra [...] que me foi confiada”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφανέρωσεν
  choice: revelou
  rationale: O aoristo ativo indica que Deus, sujeito implícito retomado do contexto anterior, tornou conhecida abertamente a sua palavra. “Revelou” é natural e preserva a ideia de algo antes oculto que foi manifestado.
- source_word: καιροῖς ἰδίοις
  choice: nos tempos determinados por ele
  rationale: A expressão refere-se a ocasiões próprias ou designadas, no contexto, por Deus. A formulação comunica em português corrente tanto a adequação desses tempos quanto sua relação com o agir soberano de Deus.
- source_word: τὸν λόγον αὐτοῦ
  choice: a sua palavra
  rationale: λόγος designa aqui a mensagem comunicada por Deus, ligada à promessa mencionada no contexto. “Sua palavra” conserva a correspondência lexical e o tom bíblico sem deixar de ser compreensível.
- source_word: ἐν κηρύγματι
  choice: por meio da proclamação
  rationale: ἐν tem valor instrumental neste contexto, e κήρυγμα pode indicar tanto o ato de proclamar quanto o conteúdo proclamado. “Por meio da proclamação” preserva essa amplitude melhor que uma referência exclusiva à atividade de pregar.
- source_word: ὃ
  choice: que
  rationale: O pronome relativo neutro singular pode retomar κήρυγμα, seu antecedente mais próximo, embora λόγον também seja gramaticalmente possível. Em português, “que” permite uma construção natural, e a nota registra a outra vinculação possível.
- source_word: ἐπιστεύθην
  choice: me foi confiada
  rationale: O aoristo passivo de πιστεύω nesta construção significa receber algo em confiança ou como encargo, e não “crer”. A formulação explicita a responsabilidade confiada a Paulo.
- source_word: κατ’ ἐπιταγὴν
  choice: segundo a ordem
  rationale: κατά com o acusativo expressa conformidade com uma diretiva dotada de autoridade. “Segundo a ordem” é conciso, natural e mantém essa força.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: de Deus, nosso Salvador
  rationale: A expressão genitiva apresenta “nosso Salvador” como título em aposição a Deus. A vírgula torna essa relação clara em português e evita uma ordem de palavras artificial.
theological_decisions:
- issue: Sujeito implícito de ἐφανέρωσεν e sentido de καιροῖς ἰδίοις
  choice: 'Deus é o sujeito: ele revelou sua palavra nos tempos determinados por ele.'
  alternative: 'Tradução impessoal: “no tempo devido, ela foi revelada”.'
  rationale: O contexto anterior tem Deus como agente daquele que prometeu antes dos tempos eternos. Manter Deus como sujeito pessoal preserva a progressão entre promessa e revelação, enquanto a nota conserva a possibilidade lexical de entender a expressão como “tempos apropriados”.
- issue: Antecedente do pronome relativo ὃ
  choice: 'O pronome retoma prioritariamente “a proclamação”: ela foi confiada a Paulo.'
  alternative: 'O pronome pode retomar “a sua palavra”: “a sua palavra [...] que me foi confiada”.'
  rationale: κήρυγμα é o antecedente imediato e combina naturalmente com o sentido passivo de ἐπιστεύθην. Contudo, λόγον também é neutro singular no grego e continua sintaticamente possível; por isso, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Proclamação” mantém a amplitude semântica do termo grego; “segundo a ordem” conserva o tom de autoridade. A estrutura e a vírgula final refletem que o versículo integra a longa saudação iniciada no versículo 1 e continuada no versículo 4.
