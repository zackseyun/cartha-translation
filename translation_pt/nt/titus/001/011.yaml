id: TIT.1.11
reference: Titus 1:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὓς δεῖ ἐπιστομίζειν, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/011.yaml
  text: They must be silenced[c][b][a], since they are upsetting whole households by teaching what they ought not for the sake of shameful gain.
translation:
  language: pt
  text: É preciso fazê-los calar[a], pois estão desestruturando famílias inteiras[b], ensinando o que não devem em busca de ganho desonesto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “tapar-lhes a boca”.'
    reason: lexical_alternative
  - marker: b
    text: “Famílias inteiras” refere-se provavelmente às unidades domésticas, que podiam incluir familiares, dependentes e outras pessoas da casa, e não apenas aos edifícios.
    reason: cultural_note
  - marker: c
    text: 'Ou: “lucro vergonhoso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς δεῖ ἐπιστομίζειν
  choice: É preciso fazê-los calar
  rationale: Reproduz a necessidade expressa por δεῖ e o sentido idiomático de ἐπιστομίζειν, literalmente relacionado a fechar a boca, sem sugerir um método físico ou civil não especificado.
- source_word: οἵτινες
  choice: pois
  rationale: 'Expressa com naturalidade o valor explicativo ou causal da oração relativa: a atuação dessas pessoas fundamenta a necessidade de fazê-las calar.'
- source_word: ὅλους οἴκους
  choice: famílias inteiras
  rationale: Neste contexto, οἶκος designa mais provavelmente a unidade doméstica — família e demais integrantes da casa —, e não o edifício.
- source_word: ἀνατρέπουσιν
  choice: estão desestruturando
  rationale: Comunica a ideia de transtornar, subverter ou arruinar a ordem de unidades familiares, sem exigir a noção de destruição total.
- source_word: διδάσκοντες ἃ μὴ δεῖ
  choice: ensinando o que não devem
  rationale: Mantém a construção concisa e a reprovação moral do conteúdo ensinado.
- source_word: αἰσχροῦ κέρδους χάριν
  choice: por causa de lucro vergonhoso
  rationale: Preserva tanto a motivação expressa por χάριν quanto a condenação ética de αἰσχρός aplicada ao ganho.
theological_decisions:
- issue: Natureza da medida contra os falsos mestres
  choice: É preciso fazê-los calar
  alternative: É preciso tapar-lhes a boca
  rationale: A tradução conserva a obrigação de interromper o ensino nocivo, mas não acrescenta qualquer punição física, civil ou eclesiástica que o grego não especifique.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Fazê-los calar” mantém a força do original sem soar excessivamente literal; “desestruturando famílias inteiras” torna explícito o impacto social de ἀνατρέπουσιν sobre οἶκοι.
