id: TIT.1.15
reference: Titus 1:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀πάντα καθαρὰ τοῖς καθαροῖς· τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις οὐδὲν καθαρόν, ἀλλὰ μεμίανται αὐτῶν καὶ ὁ νοῦς καὶ ἡ συνείδησις.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/015.yaml
  text: All things are pure to the pure; but to those who are defiled and unbelieving[a], nothing is pure. Instead, both their mind and their conscience are defiled.
translation:
  language: pt
  text: Todas as coisas são puras para os puros; mas, para os que estão contaminados e não creem, nada é puro.[a] Pelo contrário, tanto a mente como a consciência deles estão contaminadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “limpas” e “limpo” ao longo do versículo; o termo grego pode ter conotações tanto rituais como morais.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: Todas as coisas
  rationale: O neutro plural tem sentido abrangente; a formulação preserva o alcance amplo e o caráter proverbial da frase.
- source_word: καθαρά / καθαρόν / καθαροῖς
  choice: puras / puro / os puros
  rationale: “Puro” preserva melhor do que “limpo” tanto as possíveis conotações rituais como as morais, mantendo a repetição do termo grego.
- source_word: τοῖς δὲ μεμιαμμένοις
  choice: para os que estão contaminados
  rationale: O particípio perfeito descreve um estado resultante de contaminação; “estão contaminados” transmite esse valor de modo natural.
- source_word: ἀπίστοις
  choice: não creem
  rationale: Neste contexto, o termo aponta mais diretamente para a incredulidade do que para infidelidade; a forma verbal é clara e idiomática.
- source_word: οὐδὲν καθαρόν
  choice: nada é puro
  rationale: Mantém o paralelismo com a primeira oração e o mesmo campo semântico de καθαρός.
- source_word: ἀλλὰ
  choice: Pelo contrário
  rationale: 'Expressa o contraste forte e introduz a verdadeira fonte do problema: a condição interior dessas pessoas.'
- source_word: μεμίανται
  choice: estão contaminadas
  rationale: O perfeito indica um estado resultante; a escolha também conserva a ligação lexical com “estão contaminados” na oração anterior.
- source_word: νοῦς
  choice: mente
  rationale: É a tradução corrente e natural para a faculdade de pensar e perceber.
- source_word: συνείδησις
  choice: consciência
  rationale: Termo usual para a faculdade de avaliação e percepção moral.
- source_word: καὶ ... καὶ
  choice: tanto ... como
  rationale: Reproduz naturalmente a ênfase do par correlativo grego sobre as duas faculdades.
theological_decisions:
- issue: Alcance da linguagem de pureza
  choice: Traduzir καθαρός por “puro” em todas as ocorrências
  alternative: Traduzir por “limpo”, destacando categorias cerimoniais
  rationale: O contexto envolve preocupações relativas à pureza e a preceitos judaicos, mas a afirmação alcança também a condição moral e interior das pessoas. “Puro” preserva essa amplitude sem restringir o sentido.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo e a repetição lexical do grego foram preservados sem sacrificar a naturalidade.
