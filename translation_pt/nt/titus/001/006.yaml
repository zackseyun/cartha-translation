id: TIT.1.6
reference: Titus 1:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἴ τίς ἐστιν ἀνέγκλητος, μιᾶς γυναικὸς ἀνήρ, τέκνα ἔχων πιστά, μὴ ἐν κατηγορίᾳ ἀσωτίας ἢ ἀνυπότακτα.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/006.yaml
  text: if anyone is above reproach[a], the husband of one wife[c][b], having faithful children not under accusation of debauchery or insubordinate.
translation:
  language: pt
  text: se alguém for irrepreensível, marido de uma só mulher[a], tendo filhos fiéis[b], que não estejam sob acusação de vida dissoluta[c] nem sejam insubordinados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “homem de uma só mulher”.
    reason: lexical_alternative
  - marker: b
    text: Ou “filhos crentes”. O grego πιστά pode significar “fiéis” ou “crentes”.
    reason: alternative_reading
  - marker: c
    text: Ou “libertinagem” ou “vida desenfreada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέγκλητος
  choice: irrepreensível
  rationale: Expressa a ideia de não estar sujeito a uma acusação legítima e soa natural no contexto de qualificações para a liderança, sem exigir perfeição absoluta.
- source_word: μιᾶς γυναικὸς ἀνήρ
  choice: marido de uma só mulher
  rationale: Mantém de modo transparente a formulação masculina e conjugal do grego, sem decidir questões debatidas sobre estado civil, fidelidade sexual ou novo casamento.
- source_word: τέκνα
  choice: filhos
  rationale: É a forma comum e natural de designar os filhos no contexto de uma casa ou família.
- source_word: πιστά
  choice: fiéis
  rationale: Preserva o sentido amplo de pessoas fiéis ou dignas de confiança; o sentido possível de 'crentes' é mantido em nota.
- source_word: ἐν κατηγορίᾳ
  choice: sob acusação
  rationale: Conserva a nuance forense de estar sujeito a uma acusação, em vez de transformar a expressão diretamente numa descrição do comportamento.
- source_word: ἀσωτίας
  choice: vida dissoluta
  rationale: Comunica conduta moralmente desenfreada, irresponsável e excessiva em português atual e compreensível.
- source_word: ἀνυπότακτα
  choice: insubordinados
  rationale: Preserva a ideia de recusa à submissão ou à ordem devida no contexto familiar.
theological_decisions:
- issue: Sentido de πιστά em τέκνα ἔχων πιστά
  choice: filhos fiéis
  alternative: filhos crentes
  rationale: πιστά pode descrever fidelidade ou confiabilidade, mas também pode significar que os filhos são crentes. O texto principal mantém a leitura mais ampla, e a nota preserva a alternativa teologicamente relevante.
- issue: Força de μιᾶς γυναικὸς ἀνήρ
  choice: marido de uma só mulher
  alternative: homem de uma só mulher
  rationale: A tradução transparente evita resolver no próprio texto as questões debatidas de estado civil, fidelidade conjugal e novo casamento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura acompanha de perto o grego, mas usa uma oração relativa para deixar claro que tanto a acusação de vida dissoluta quanto a insubordinação dizem respeito aos filhos.
