  text: εἶπέν τις ἐξ αὐτῶν, ἴδιος αὐτῶν προφήτης, Κρῆτες ἀεὶ ψεῦσται, κακὰ θηρία, γαστέρες ἀργαί·
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/012.yaml
  text: One of them[a], their own prophet, said, “Cretans are always liars, evil beasts, lazy gluttons.”
translation:
  language: pt
  text: 'Um deles, um profeta do próprio povo, disse: “Os cretenses são sempre mentirosos, feras malignas, glutões preguiçosos[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “barrigas preguiçosas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπέν τις ἐξ αὐτῶν
  choice: Um deles ... disse
  rationale: Preserva tanto o pronome indefinido τις quanto o sentido partitivo de ἐξ αὐτῶν, em formulação natural em português.
- source_word: ἴδιος αὐτῶν προφήτης
  choice: seu próprio profeta
  rationale: Expressa a ênfase de ἴδιος e identifica o citado como um profeta pertencente ao próprio povo cretense.
- source_word: Κρῆτες ἀεὶ ψεῦσται
  choice: Os cretenses são sempre mentirosos
  rationale: Traduz diretamente o gentílico, o valor contínuo de ἀεί e o sentido inequívoco de ψεῦσται.
- source_word: κακὰ θηρία
  choice: feras malignas
  rationale: Mantém a imagem animal e a avaliação moral de κακά, sem reduzir a força insultuosa da citação.
- source_word: γαστέρες ἀργαί
  choice: glutões preguiçosos
  rationale: A expressão literal é “barrigas preguiçosas”; a formulação escolhida comunica em português corrente pessoas dadas à comida e avessas ao trabalho, preservando a força do insulto.
theological_decisions:
- issue: Citação de um estereótipo étnico severo
  choice: Traduzir a declaração diretamente e apresentá-la claramente como citação atribuída a um profeta dos próprios cretenses
  alternative: Amenizar ou parafrasear as acusações contra os cretenses
  rationale: O grego emprega linguagem direta e áspera. A moldura citacional deve ser preservada, sem suavizar o conteúdo nem transformá-lo silenciosamente numa afirmação doutrinária desvinculada de seu contexto retórico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Feras malignas” conserva a metáfora do original; “glutões preguiçosos” torna inteligível a expressão idiomática, enquanto a nota registra sua forma literal.
