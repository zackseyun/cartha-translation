id: TIT.1.8
reference: Titus 1:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ φιλόξενον, φιλάγαθον, σώφρονα, δίκαιον, ὅσιον, ἐγκρατῆ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/008.yaml
  text: but hospitable[a], loving what is good, self-controlled, upright, holy, and disciplined[d][c][b],
translation:
  language: pt
  text: mas hospitaleiro, amigo do bem, sensato, justo[a], santo[b] e disciplinado[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “reto”.
    reason: lexical_alternative
  - marker: b
    text: Ou “piedoso” ou “devoto”.
    reason: lexical_alternative
  - marker: c
    text: 'O grego emprega aqui duas virtudes relacionadas: σώφρονα indica sensatez, equilíbrio e moderação; ἐγκρατῆ enfatiza o domínio exercido sobre si mesmo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: mas
  rationale: Conjunção adversativa que contrasta estas qualidades com os vícios do versículo anterior; “mas” é a forma mais natural e concisa em português.
- source_word: φιλόξενον
  choice: hospitaleiro
  rationale: Expressa acolhimento generoso a hóspedes e desconhecidos; “hospitaleiro” é claro e idiomático.
- source_word: φιλάγαθον
  choice: amigo do bem
  rationale: 'Preserva de modo natural a ideia do adjetivo composto: alguém que ama aquilo que é bom.'
- source_word: σώφρονα
  choice: sensato
  rationale: Comunica lucidez, moderação e bom senso, sem confundir esta virtude com ἐγκρατῆ, que enfatiza o domínio dos impulsos.
- source_word: δίκαιον
  choice: justo
  rationale: Termo corrente que abrange retidão moral e conduta correta; preserva a formulação tradicional sem restringi-la ao âmbito judicial.
- source_word: ὅσιον
  choice: santo
  rationale: Transmite a devoção e a conformidade com o que é sagrado, mantendo o peso religioso do termo grego.
- source_word: ἐγκρατῆ
  choice: disciplinado
  rationale: Destaca o exercício de domínio sobre desejos e impulsos e mantém a distinção em relação a σώφρονα.
theological_decisions:
- issue: Distinção entre σώφρονα e ἐγκρατῆ
  choice: Traduzir σώφρονα por “sensato” e ἐγκρατῆ por “disciplinado”.
  alternative: Traduzir por “controlado” e “disciplinado”, ou por “sensato” e “autocontrolado”.
  rationale: Os dois adjetivos pertencem a campos semânticos próximos, mas não são idênticos. “Sensato” realça a mente equilibrada e a moderação; “disciplinado” realça o domínio exercido sobre si mesmo.
- issue: Sentido de ὅσιον
  choice: santo
  alternative: piedoso ou devoto
  rationale: “Santo” conserva a dimensão religiosa do termo, enquanto a nota registra alternativas que enfatizam mais diretamente a devoção.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A enumeração concisa acompanha o estilo do original. “Amigo do bem” soa mais natural em português do que uma reprodução abstrata como “amante do que é bom”, e “sensato” evita apagar a distinção entre as duas virtudes gregas relacionadas ao autocontrole.
