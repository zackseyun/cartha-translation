  text: Τούτου χάριν ⸀ἀπέλιπόν σε ἐν Κρήτῃ ἵνα τὰ λείποντα ἐπιδιορθώσῃ, καὶ καταστήσῃς κατὰ πόλιν πρεσβυτέρους, ὡς ἐγώ σοι διεταξάμην,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/005.yaml
  text: For this reason I left you in Crete[a], so that you might set in order what remained and appoint elders in every city[c][b], as I directed you.
translation:
  language: pt
  text: 'Foi por esta razão que deixei você em Creta: para que pusesse em ordem o que ainda faltava[a] e nomeasse anciãos em cada cidade[b], conforme eu lhe dei instruções[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que permanecia por fazer”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “cidade por cidade”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “conforme eu lhe ordenei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Foi por esta razão
  rationale: Expressa de modo natural e claro a relação causal indicada por χάριν com o genitivo.
- source_word: ἀπέλιπόν σε ἐν Κρήτῃ
  choice: deixei você em Creta
  rationale: Reproduz diretamente a ação passada e a localização, sem acrescentar ênfase desnecessária à ideia de deixar alguém para trás.
- source_word: ἵνα
  choice: para que
  rationale: Mantém o sentido de propósito da oração grega em português corrente.
- source_word: τὰ λείποντα
  choice: o que ainda faltava
  rationale: Abrange tanto o que permanecia por fazer quanto o que estava incompleto, sem especificar além do texto.
- source_word: ἐπιδιορθώσῃ
  choice: pusesse em ordem
  rationale: Comunica a ideia de corrigir e organizar aquilo que ainda necessitava de atenção.
- source_word: καταστήσῃς
  choice: nomeasse
  rationale: No contexto de liderança comunitária, indica designar pessoas para uma função reconhecida.
- source_word: κατὰ πόλιν
  choice: em cada cidade
  rationale: Expressa claramente a força distributiva de κατά com o substantivo no singular.
- source_word: πρεσβυτέρους
  choice: anciãos
  rationale: Refere-se aqui a líderes reconhecidos das comunidades, preservando a terminologia neotestamentária sem impor uma estrutura denominacional posterior.
- source_word: ὡς ἐγώ σοι διεταξάμην
  choice: conforme eu lhe determinei
  rationale: Mantém a autoridade da orientação dada por Paulo sem necessariamente intensificá-la até o tom mais forte de uma ordem explícita.
theological_decisions:
- issue: Terminologia do ofício eclesial em πρεσβυτέρους
  choice: anciãos
  alternative: presbíteros
  rationale: “Anciãos” preserva o sentido lexical e identifica líderes comunitários sem pressupor que o cargo corresponda exatamente a qualquer estrutura denominacional posterior.
- issue: Força de διεταξάμην
  choice: determinei
  alternative: ordenei
  rationale: O verbo denota uma instrução autorizada. “Determinei” conserva essa autoridade, enquanto “ordenei” explicita uma força imperativa mais marcada, embora lexicalmente possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. O uso de “você” favorece clareza contemporânea; “anciãos” mantém a linguagem bíblica sem recorrer ao termo eclesiástico mais técnico “presbíteros”.
