source:
  edition: SBLGNT
  text: ἀντεχόμενον τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου, ἵνα δυνατὸς ᾖ καὶ παρακαλεῖν ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ καὶ τοὺς ἀντιλέγοντας ἐλέγχειν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/009.yaml
  text: holding firmly to the trustworthy word in accordance with the teaching[b][a], so that he may be able both to exhort by sound teaching and to rebuke those who contradict it.
translation:
  language: pt
  text: firmemente apegado à palavra digna de confiança, de acordo com o ensino, para que seja capaz tanto de exortar por meio do ensino sadio como de repreender os que o contradizem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “refutar os que o contradizem”. O verbo grego pode significar expor o erro ou demonstrar que alguém está errado, além de repreender.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντεχόμενον
  choice: apegado a
  rationale: Expressa adesão firme e perseverante de modo natural em português, no contexto das qualificações do dirigente.
- source_word: πιστοῦ λόγου
  choice: a palavra fiel
  rationale: πιστός pode indicar aquilo que é digno de confiança; “palavra fiel” preserva a forma concisa da expressão grega e é corrente no contexto bíblico.
- source_word: κατὰ τὴν διδαχήν
  choice: que está de acordo com o ensino
  rationale: κατά com acusativo indica conformidade. A formulação também preserva a relação entre a palavra proclamada e o ensino cristão reconhecido.
- source_word: παρακαλεῖν
  choice: encorajar
  rationale: O verbo abrange encorajar, exortar e instar. “Encorajar” é claro e natural, sem excluir a dimensão de apelo presente no contexto pastoral.
- source_word: ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ
  choice: por meio do ensino sadio
  rationale: ἐν pode indicar o meio pelo qual se encoraja, e ὑγιαίνω comunica figuradamente o que é saudável ou correto. “Ensino sadio” preserva essa imagem sem recorrer a jargão excessivo.
- source_word: ἀντιλέγοντας
  choice: os que o contradizem
  rationale: O particípio designa os que falam contra a mensagem. O pronome retoma naturalmente “ensino” ou, em sentido amplo, a palavra fiel.
- source_word: ἐλέγχειν
  choice: corrigir
  rationale: O verbo pode incluir expor o erro, demonstrar que alguém está errado e repreender. “Corrigir” conserva a finalidade pastoral sem decidir exclusivamente entre repreensão e refutação; a nota registra essas nuances.
- source_word: δυνατὸς ᾖ
  choice: seja capaz
  rationale: Reproduz de modo idiomático a capacidade visada pela oração de propósito introduzida por ἵνα.
theological_decisions:
- issue: Relação entre “a palavra fiel” e “o ensino”
  choice: A palavra à qual o dirigente se apega está em conformidade com o ensino cristão reconhecido.
  alternative: Entender a expressão como referência genérica a uma instrução moral confiável.
  rationale: O artigo em τὴν διδαχήν e o contexto das Cartas Pastorais favorecem uma referência a um corpo reconhecido de ensino, sem exigir categorias dogmáticas posteriores.
- issue: Sentido de ἐλέγχειν diante dos opositores
  choice: corrigir
  alternative: refutar ou repreender
  rationale: O contexto envolve confronto com pessoas que contradizem o ensino. “Corrigir” mantém a força pastoral abrangente, enquanto a nota preserva os sentidos de demonstrar o erro e repreender.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Apegado”, “ensino sadio” e “corrigir” evitam tecnicismo excessivo. A pontuação conserva o fluxo de uma qualificação que continua o contexto anterior.
