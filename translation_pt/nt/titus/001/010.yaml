source:
  edition: SBLGNT
  text: Εἰσὶν γὰρ πολλοὶ ⸀καὶ ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται, μάλιστα οἱ ἐκ ⸀τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/010.yaml
  text: For there are many rebellious people[a], empty talkers and deceivers, especially those of the circumcision,
translation:
  language: pt
  text: Pois há muitos insubordinados, faladores de coisas vazias e enganadores, especialmente os da circuncisão[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os do grupo da circuncisão” ou “os que vêm da circuncisão”. A expressão provavelmente se refere a opositores judeus ou judaizantes, mas o grego é menos explícito.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Mantém de modo natural a ligação explicativa com a instrução anterior.
- source_word: πολλοὶ
  choice: muitos
  rationale: Preserva diretamente a ideia quantitativa; o referente humano fica claro pelos qualificativos seguintes.
- source_word: ἀνυπότακτοι
  choice: insubordinados
  rationale: Expressa a recusa de se submeter à autoridade legítima e mantém a força do adjetivo substantivado.
- source_word: ματαιολόγοι
  choice: que se entregam a conversas vazias
  rationale: Comunica em português corrente que essas pessoas produzem fala inútil e sem conteúdo, preservando a avaliação negativa do composto grego.
- source_word: φρεναπάται
  choice: enganam os outros
  rationale: Forma idiomática que expressa a ação de iludir ou desviar a mente de outras pessoas, sem recorrer a um composto artificial.
- source_word: μάλιστα
  choice: especialmente
  rationale: Destaca um subconjunto dentro do grupo maior sem sugerir que seja o único.
- source_word: οἱ ἐκ τῆς περιτομῆς
  choice: os da circuncisão
  rationale: Reproduz de maneira compacta a expressão grega e evita identificar de forma mais específica o grupo no texto principal.
theological_decisions:
- issue: Referente de οἱ ἐκ τῆς περιτομῆς
  choice: os da circuncisão
  alternative: os do grupo da circuncisão; os de origem judaica
  rationale: A expressão provavelmente se refere a opositores judeus ou judaizantes, mas o grego não explicita uma organização partidária nem identifica simplesmente todos os judeus. A tradução mantém essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação verbal de ματαιολόγοι e φρεναπάται evita substantivos pouco naturais, enquanto “insubordinados” conserva a precisão do termo grego. A vírgula final foi mantida porque o versículo continua sintaticamente no versículo seguinte.
