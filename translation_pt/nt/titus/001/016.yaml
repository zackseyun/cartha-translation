revisions:
- from: Eles declaram que conhecem a Deus[a], mas o negam por suas obras[b]. São detestáveis[c], desobedientes e incapazes de realizar qualquer boa obra[d].
  to: Afirmam conhecer Deus[a], mas o negam por suas obras[b]. São detestáveis[c], desobedientes e inaptos para toda boa obra[d].
  rationale: A revisão melhora a fluência do início e substitui a expansão «incapazes de realizar qualquer boa obra» por «inaptos para toda boa obra», que corresponde mais de perto a ἀδόκιμοι πρὸς πᾶν ἔργον ἀγαθόν. Os quatro marcadores permanecem ancorados no texto, e as notas oferecem alternativas lexicais sem alterar o sentido.
