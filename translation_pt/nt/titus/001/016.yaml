review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente o contraste entre a profissão verbal de conhecer Deus e a negação demonstrada pelas obras. Contudo, «incapazes de realizar qualquer boa obra» explicita «realizar» e desloca levemente ἀδόκιμοι, que significa não ser aprovado, qualificado ou apto em relação a toda boa obra.
  naturalness: «Afirmam conhecer Deus» é mais natural no português moderno de ampla compreensão, especialmente para leitores brasileiros, do que «declaram que conhecem a Deus». «Inaptos para toda boa obra» é conciso, preserva o registro ético solene do versículo e reproduz melhor a relação de πρὸς com ἀδόκιμοι.
  terminology: «Afirmam», «negam», «obras», «detestáveis», «desobedientes» e «boa obra» são escolhas adequadas. «Inaptos» mantém a ideia de inadequação/desqualificação de ἀδόκιμοι sem impor uma interpretação doutrinária.
  issues:
  - severity: low
    issue: «Incapazes de realizar qualquer boa obra» é uma paráfrase um pouco mais forte e expandida de ἀδόκιμοι πρὸς πᾶν ἔργον ἀγαθόν.
    rationale: O grego caracteriza essas pessoas como não aprovadas ou inaptas em relação a toda boa obra; não afirma de modo explícito a impossibilidade de executar uma obra boa. «Inaptos para toda boa obra» preserva mais diretamente a formulação e a ambiguidade do original.
  - severity: low
    issue: «Declaram que conhecem a Deus» é menos fluente para o português moderno de legibilidade brasileira.
    rationale: «Afirmam conhecer Deus» exprime naturalmente a construção de ὁμολογοῦσιν εἰδέναι e conserva a noção de alegação pública, sem sugerir sinceridade.
  revised_text: Afirmam conhecer Deus[a], mas o negam por suas obras[b]. São detestáveis[c], desobedientes e inaptos para toda boa obra[d].
