base_translation:
  language: en
  yaml_path: translation/nt/titus/001/016.yaml
  text: They profess to know God[a], but by their works they deny him[d][c][b], being detestable and disobedient and unfit for every good work.
translation:
  language: pt
  text: Afirmam conhecer Deus[a], mas o negam por suas obras[b]. São detestáveis[c], desobedientes e inaptos para toda boa obra[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Declaram conhecer Deus».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «mas o negam por seus atos».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «abomináveis».'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: «desqualificados para toda boa obra».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: a Deus
  rationale: Objeto direto de «declaram que conhecem»; a preposição «a» é natural em português diante do objeto pessoal e mantém Deus como referente retomado depois.
- source_word: ὁμολογοῦσιν
  choice: declaram
  rationale: No contraste entre afirmação verbal e conduta, «declaram» comunica uma profissão pública sem pressupor que seja sincera.
- source_word: εἰδέναι
  choice: que conhecem
  rationale: A oração finita é a forma mais natural em português para o infinitivo complementar grego e preserva o sentido de conhecimento alegado.
- source_word: τοῖς δὲ ἔργοις
  choice: por suas obras
  rationale: 'Expressa o provável dativo de meio: as obras ou ações constituem o modo pelo qual negam a Deus.'
- source_word: ἀρνοῦνται
  choice: o negam
  rationale: Retoma naturalmente «Deus» como objeto implícito e mantém o forte contraste entre declaração e prática.
- source_word: βδελυκτοὶ
  choice: detestáveis
  rationale: Preserva a severidade da repulsa moral sem recorrer a uma formulação arcaica.
- source_word: ὄντες
  choice: São
  rationale: A divisão em nova frase reproduz de modo natural em português a função descritiva do particípio grego.
- source_word: ἀπειθεῖς
  choice: desobedientes
  rationale: No contexto ético das Pastorais, indica recusa de obedecer, não apenas falta de persuasão.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: de realizar qualquer boa obra
  rationale: Com ἀδόκιμοι, exprime falta de aptidão em relação a toda obra boa; «qualquer» é idiomático sob a ideia negativa de incapacidade.
- source_word: ἀδόκιμοι
  choice: incapazes
  rationale: Comunica que não passam no teste e não estão aptos para boas obras, em linguagem moderna e clara.
theological_decisions:
- issue: Relação entre a declaração verbal e a negação prática
  choice: Afirmam conhecer a Deus, mas suas obras constituem uma negação dele.
  alternative: Entender a segunda oração como negação da verdade de Deus em sentido geral.
  rationale: «Deus» é o objeto expresso da primeira oração e é naturalmente retomado como objeto implícito de «negam». A tradução mantém a tensão entre profissão verbal e conduta sem acrescentar uma formulação doutrinária mais ampla.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Obras» conserva a conexão lexical com «boa obra», enquanto a nota oferece «atos». A segunda frase evita um particípio pesado em português. Todos os marcadores aparecem no texto principal.
