id: TIT.1.7
reference: Titus 1:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: δεῖ γὰρ τὸν ἐπίσκοπον ἀνέγκλητον εἶναι ὡς θεοῦ οἰκονόμον, μὴ αὐθάδη, μὴ ὀργίλον, μὴ πάροινον, μὴ πλήκτην, μὴ αἰσχροκερδῆ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/007.yaml
  text: For an overseer must be above reproach as God's steward[a], not self-willed, not quick-tempered, not given to wine, not violent, not greedy for shameful gain[b],
translation:
  language: pt
  text: Pois é necessário que o supervisor[a], como administrador de Deus, seja irrepreensível, não arrogante, não propenso à ira, não dado ao vinho, não violento, nem ávido por lucro vergonhoso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «bispo». O termo grego designa alguém que supervisiona; «supervisor» evita introduzir conotações posteriores de um cargo eclesiástico que podem estar associadas a «bispo».
    reason: alternative_reading
  - marker: b
    text: Ou «ávido por lucro desonesto». O grego enfatiza o lucro buscado de maneira moralmente vergonhosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: é necessário
  rationale: Expressa claramente a necessidade ou obrigação indicada pelo grego e se integra de modo natural à construção portuguesa.
- source_word: γὰρ
  choice: Pois
  rationale: Preserva a ligação explicativa com o versículo anterior.
- source_word: ἐπίσκοπον
  choice: supervisor
  rationale: Traduz o sentido funcional de quem exerce supervisão sem importar automaticamente conotações eclesiásticas posteriores associadas a «bispo».
- source_word: ἀνέγκλητον
  choice: irrepreensível
  rationale: Comunica que a pessoa não deve estar sujeita a uma acusação válida, sem sugerir perfeição absoluta.
- source_word: ὡς θεοῦ οἰκονόμον
  choice: como administrador de Deus
  rationale: Conserva a ideia de alguém encarregado de administrar em nome de Deus e responsável diante dele.
- source_word: αὐθάδη
  choice: arrogante
  rationale: Exprime de modo corrente a atitude obstinada de quem busca impor a própria vontade; «obstinado» é possível, mas não explicita tão bem o componente de presunção.
- source_word: ὀργίλον
  choice: propenso à ira
  rationale: Indica uma disposição habitual para se irar, e não apenas um episódio isolado.
- source_word: πάροινον
  choice: dado ao vinho
  rationale: Preserva a referência ao excesso relacionado ao vinho sem restringir o sentido à condição mais forte de embriaguez habitual.
- source_word: πλήκτην
  choice: violento
  rationale: Transmite em português atual a conduta agressiva ou de quem agride.
- source_word: αἰσχροκερδῆ
  choice: ávido por lucro vergonhoso
  rationale: Mantém tanto o desejo de ganho quanto seu caráter moralmente vergonhoso, que pode ser mais amplo que lucro estritamente desonesto.
theological_decisions:
- issue: Tradução de ἐπίσκοπος no contexto de uma função eclesial
  choice: supervisor
  alternative: bispo
  rationale: «Supervisor» representa o sentido lexical e funcional do termo sem definir uma estrutura hierárquica posterior que o próprio versículo não especifica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A enumeração mantém o fluxo do grego; «nem» encerra naturalmente a série de qualificações negativas.
