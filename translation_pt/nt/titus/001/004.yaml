id: TIT.1.4
reference: Titus 1:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τίτῳ γνησίῳ τέκνῳ κατὰ κοινὴν πίστιν· χάρις ⸀καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τοῦ σωτῆρος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/004.yaml
  text: 'To Titus[b][a], my true child according to our common faith: grace and peace from God the Father and Messiah Jesus our Savior.'
translation:
  language: pt
  text: 'A Tito, meu verdadeiro filho segundo a fé que temos em comum[a]: graça e paz da parte de Deus Pai e do Messias Jesus[b], nosso Salvador.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fé compartilhada”.'
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “Cristo Jesus”; aqui, Χριστός é traduzido como o título “Messias”.'
    reason: alternative_reading
lexical_decisions:
- source_word: γνησίῳ τέκνῳ
  choice: meu verdadeiro filho
  rationale: A expressão afirma a autenticidade do vínculo espiritual entre Paulo e Tito, não uma filiação biológica. “Verdadeiro filho” é natural em português; “meu” torna explícita a relação implícita na saudação.
- source_word: κατὰ κοινὴν πίστιν
  choice: segundo a fé que temos em comum
  rationale: Mantém o valor relacional ou normativo de κατά e expressa naturalmente que a fé é compartilhada por Paulo e Tito.
- source_word: πίστιν
  choice: fé
  rationale: Neste contexto, refere-se à fé cristã compartilhada, e “fé” é a equivalência corrente e semanticamente adequada.
- source_word: χάρις καὶ εἰρήνη
  choice: graça e paz
  rationale: Preserva os termos consagrados da bênção epistolar paulina com clareza e dignidade.
- source_word: ἀπὸ θεοῦ πατρὸς
  choice: da parte de Deus Pai
  rationale: “Da parte de” comunica naturalmente a origem indicada por ἀπό. Como o grego não traz “nosso” junto de πατρός, a tradução evita acrescentá-lo.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Messias Jesus
  rationale: Traduz Χριστός como título, preservando seu conteúdo semântico em vez de apenas transliterá-lo; a alternativa tradicional é indicada em nota.
- source_word: τοῦ σωτῆρος ἡμῶν
  choice: nosso Salvador
  rationale: A expressão em aposição identifica diretamente o Messias Jesus como o Salvador de Paulo, Tito e da comunidade de fé.
theological_decisions:
- issue: Tradução do título Χριστός em Χριστοῦ Ἰησοῦ
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: “Messias” preserva de forma transparente a força titular de Χριστός; “Cristo Jesus” é a forma tradicional e é registrada em nota.
- issue: Referente de τοῦ σωτῆρος ἡμῶν
  choice: “nosso Salvador” identifica o Messias Jesus
  alternative: Entender a designação de modo mais amplo em relação à fonte coordenada da graça e da paz
  rationale: A sequência Χριστοῦ Ἰησοῦ τοῦ σωτῆρος ἡμῶν liga mais naturalmente a expressão articular em aposição a “Messias Jesus”. A pontuação e a posição da frase preservam essa sintaxe.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção epistolar natural. “Messias Jesus” é menos tradicional que “Cristo Jesus”, mas conserva deliberadamente o valor do título grego; a forma tradicional aparece em nota.
