id: TIT.1.13
reference: Titus 1:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ μαρτυρία αὕτη ἐστὶν ἀληθής. δι’ ἣν αἰτίαν ἔλεγχε αὐτοὺς ἀποτόμως, ἵνα ὑγιαίνωσιν ἐν τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/013.yaml
  text: This testimony is true. For this reason[a], rebuke them sharply, so that they may be sound in the faith,
translation:
  language: pt
  text: Esse testemunho é verdadeiro. Por essa razão, repreenda-os com severidade, para que sejam sadios na fé,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega pode significar que sejam sadios em sua fé ou que sejam firmes na fé cristã entendida como corpo de crença.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρία
  choice: testemunho
  rationale: No contexto, refere-se à declaração citada sobre os cretenses e conserva sua nuance de atestação.
- source_word: ἀληθής
  choice: verdadeiro
  rationale: Adjetivo predicativo que afirma que o testemunho corresponde à realidade; esta é a formulação portuguesa mais direta.
- source_word: δι’ ἣν αἰτίαν
  choice: Por essa razão
  rationale: Expressa naturalmente em português a inferência causal baseada na afirmação anterior.
- source_word: ἔλεγχε
  choice: repreenda-os
  rationale: O imperativo pede confronto corretivo direto; “repreender” conserva mais força do que simplesmente “corrigir”.
- source_word: ἀποτόμως
  choice: com severidade
  rationale: Comunica o modo incisivo e rigoroso da repreensão sem sugerir necessariamente punição.
- source_word: ὑγιαίνωσιν
  choice: sejam sadios
  rationale: Preserva a metáfora de saúde usada figuradamente para integridade espiritual ou doutrinária.
- source_word: ἐν τῇ πίστει
  choice: na fé
  rationale: A expressão portuguesa preserva a ambiguidade entre a fé professada/vivida e a fé cristã entendida como corpo de crença, sem impor no texto principal uma explicitação ausente no grego.
theological_decisions:
- issue: Sentido de ἐν τῇ πίστει
  choice: na fé
  alternative: quanto à fé cristã entendida como corpo de crença
  rationale: Embora o artigo e o contexto das Pastorais permitam referência à fé cristã como conteúdo doutrinário, a construção também pode descrever saúde na experiência ou exercício da fé. A tradução concisa “na fé” mantém ambas as possibilidades, e a nota explicita a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Com severidade” soa natural e mantém a força de ἀποτόμως; “sadios na fé” conserva a metáfora do original. A vírgula final foi mantida porque o versículo continua sintaticamente no versículo seguinte.
