  text: ἐπ’ ἐλπίδι ζωῆς αἰωνίου, ἣν ἐπηγγείλατο ὁ ἀψευδὴς θεὸς πρὸ χρόνων αἰωνίων
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/002.yaml
  text: in the hope of eternal life[a], which the God who does not lie promised before the ages began
translation:
  language: pt
  text: na esperança da vida eterna, que o Deus que não mente prometeu antes do início das eras[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “antes que o tempo começasse”. Em sentido mais literal, o grego diz “antes de tempos eternos” ou “antes de tempos duradouros”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπ’ ἐλπίδι
  choice: na esperança
  rationale: A expressão portuguesa é natural e mantém a relação ampla de esfera ou circunstância expressa por ἐπί com o dativo, sem definir de modo excessivo uma relação causal.
- source_word: ζωῆς αἰωνίου
  choice: da vida eterna
  rationale: O genitivo indica naturalmente o conteúdo da esperança. “Vida eterna” é uma formulação clara e consagrada, que preserva tanto a duração quanto a ressonância teológica.
- source_word: ἣν
  choice: que
  rationale: O pronome relativo feminino singular retoma mais naturalmente “vida eterna”, também feminino singular em português.
- source_word: ἐπηγγείλατο
  choice: prometeu
  rationale: Traduz de modo direto, natural e suficiente o aoristo médio de ἐπαγγέλλομαι, sem uma perífrase desnecessária.
- source_word: ὁ ἀψευδὴς θεὸς
  choice: o Deus que não mente
  rationale: Expressa diretamente a qualidade de Deus afirmada por ἀψευδής, evitando tanto o pouco natural “Deus não mentiroso” quanto a intensificação interpretativa “Deus que não pode mentir”.
- source_word: πρὸ χρόνων αἰωνίων
  choice: antes do início das eras
  rationale: Comunica o sentido pré-temporal da expressão em português corrente e mantém a referência às eras, sem definir os mecanismos metafísicos da promessa. A forma mais literal é registrada em nota.
theological_decisions:
- issue: A promessa divina e a expressão temporal πρὸ χρόνων αἰωνίων
  choice: A promessa é situada antes do início das eras, sem indicar a quem foi feita nem explicar sua natureza intradivina ou decretiva.
  alternative: antes que o tempo começasse; desde toda a eternidade
  rationale: O grego afirma a anterioridade da promessa em relação aos tempos ou eras, mas não especifica seu destinatário nem sua mecânica teológica. A tradução conserva essa tensão.
- issue: A descrição de Deus como ἀψευδής
  choice: o Deus que não mente
  alternative: o Deus que não pode mentir; o Deus verdadeiro
  rationale: A opção escolhida preserva a afirmação moral direta do adjetivo sem acrescentar a noção modal de incapacidade, que, embora teologicamente tradicional, é mais forte que a formulação lexical do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção acompanha a sintaxe do período maior iniciado no versículo 1; por isso, o fragmento começa com letra minúscula. A nota foi colocada junto à expressão temporal que ela esclarece.
