id: TIT.2.12
reference: Titus 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: παιδεύουσα ἡμᾶς, ἵνα ἀρνησάμενοι τὴν ἀσέβειαν καὶ τὰς κοσμικὰς ἐπιθυμίας σωφρόνως καὶ δικαίως καὶ εὐσεβῶς ζήσωμεν ἐν τῷ νῦν αἰῶνι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/012.yaml
  text: training us[a], so that, having renounced ungodliness and worldly desires, we might live self-controlled, righteous, and godly lives in the present age[c][b],
translation:
  language: pt
  text: educando-nos[a] para que, tendo renunciado à impiedade e aos desejos mundanos[b], vivamos com domínio próprio, justiça e devoção a Deus[c] na era presente,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “instruindo-nos” ou “disciplinando-nos”; o grego inclui a ideia de formação educativa e moral.
    reason: lexical_alternative
  - marker: b
    text: Ou “paixões mundanas”.
    reason: lexical_alternative
  - marker: c
    text: 'O grego emprega três advérbios: “com domínio próprio, justamente e piedosamente”, descrevendo uma vida marcada pelo domínio próprio, pela justiça e pela devoção a Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύουσα
  choice: educando-nos
  rationale: O particípio descreve a ação formativa da graça mencionada no versículo anterior. “Educando-nos” abrange ensino e formação moral sem sugerir apenas transmissão de informações nem necessariamente castigo.
- source_word: ἵνα
  choice: para que
  rationale: Expressa naturalmente em português a finalidade ou o resultado pretendido.
- source_word: ἀρνησάμενοι
  choice: tendo renunciado
  rationale: O particípio aoristo indica uma rejeição decidida, apresentada como anterior à maneira de viver descrita pelo verbo principal.
- source_word: ἀσέβειαν
  choice: impiedade
  rationale: Preserva a dimensão moral e religiosa de uma vida sem reverência por Deus.
- source_word: κοσμικὰς ἐπιθυμίας
  choice: desejos mundanos
  rationale: Refere-se a desejos característicos da ordem presente afastada de Deus. A expressão é clara e não intensifica indevidamente o sentido como poderia ocorrer com “paixões”.
- source_word: σωφρόνως
  choice: com domínio próprio
  rationale: Comunica conduta sóbria e disciplinada, mantendo um tema ético recorrente em Tito.
- source_word: δικαίως
  choice: com justiça
  rationale: Indica viver de acordo com o que é reto; a formulação nominal é natural dentro da tríade portuguesa.
- source_word: εὐσεβῶς
  choice: com devoção a Deus
  rationale: Torna explícita a orientação reverente para Deus sem recorrer ao menos corrente “piedosamente”.
- source_word: ζήσωμεν
  choice: vivamos
  rationale: O subjuntivo português após “para que” preserva adequadamente a construção grega de finalidade.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: na era presente
  rationale: Mantém o sentido de αἰών como a ordem ou era atual, em contraste implícito com a era futura.
theological_decisions:
- issue: Tríade ética σωφρόνως καὶ δικαίως καὶ εὐσεβῶς
  choice: “com domínio próprio, justiça e devoção a Deus”
  alternative: “de modo sensato, justo e piedoso”
  rationale: Os três advérbios gregos modificam “vivamos”. A tradução os apresenta como três qualidades coordenadas da vida, preservando a estrutura ética sem produzir uma sequência adverbial pesada em português.
- issue: Relação temporal de ἀρνησάμενοι com ζήσωμεν
  choice: “tendo renunciado ... vivamos”
  alternative: “renunciando ... vivamos”
  rationale: A formulação mantém a força antecedente provável do particípio aoristo, sem transformar a renúncia e a vida ética em etapas teologicamente separadas de maneira absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a ligação sintática com a graça mencionada no versículo anterior por meio do particípio inicial e mantém a vírgula final por se tratar de um segmento que continua no versículo seguinte.
