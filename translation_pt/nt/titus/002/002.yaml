  terminology: «Homens mais velhos», «moderados», «dignos», «fé», «amor» e «perseverança» são escolhas adequadas. «Com domínio próprio» é uma expressão estabelecida e clara para σώφρονας, preservando a distinção em relação a «moderados» (νηφαλίους).
