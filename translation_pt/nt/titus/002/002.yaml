id: TIT.2.2
reference: Titus 2:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πρεσβύτας νηφαλίους εἶναι, σεμνούς, σώφρονας, ὑγιαίνοντας τῇ πίστει, τῇ ἀγάπῃ, τῇ ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/002.yaml
  text: Older men are to be temperate[a], dignified, self-controlled, sound in faith, in love, and in steadfastness.
translation:
  language: pt
  text: Os homens mais velhos devem ser moderados, dignos, com domínio próprio, sadios na fé[a], no amor e na perseverança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sadios na fidelidade”. A palavra grega πίστις pode significar “fé” ou “fidelidade”, conforme o contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: πρεσβύτας
  choice: homens mais velhos
  rationale: No contexto de instruções a grupos etários, refere-se a homens de idade avançada, não ao ofício eclesiástico de presbítero.
- source_word: νηφαλίους
  choice: moderados
  rationale: Expressa sobriedade e equilíbrio, sem restringir o sentido apenas à abstinência de vinho.
- source_word: σεμνούς
  choice: dignos
  rationale: Comunica uma conduta nobre e respeitável em português atual e conciso.
- source_word: σώφρονας
  choice: controlados
  rationale: Neste elenco de virtudes, indica domínio de si e juízo disciplinado; evita a repetição menos elegante de 'autocontrolados' após 'moderados'.
- source_word: ὑγιαίνοντας
  choice: sadios
  rationale: Preserva a metáfora de saúde aplicada às virtudes cristãs e rege naturalmente a sequência introduzida por 'na' e 'no'.
- source_word: τῇ πίστει
  choice: na fé
  rationale: Mantém o sentido usual de πίστις como fé, sem eliminar a possibilidade contextual de fidelidade, registrada em nota.
- source_word: τῇ ἀγάπῃ
  choice: no amor
  rationale: Equivalente direto e natural de ἀγάπη, em paralelismo com as demais virtudes.
- source_word: τῇ ὑπομονῇ
  choice: na perseverança
  rationale: Comunica constância paciente diante de dificuldades de modo claro e corrente.
- source_word: εἶναι
  choice: devem ser
  rationale: Torna explícita, em português natural, a força instrutiva do infinitivo dependente da exortação do contexto anterior.
theological_decisions:
- issue: Sentido de πίστις na lista de virtudes
  choice: fé
  alternative: fidelidade
  rationale: A tríade permite entender πίστις como fé ou fidelidade. O texto principal conserva 'fé', enquanto a nota preserva a alternativa legítima sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o caráter conciso da lista de virtudes e o paralelismo entre fé, amor e perseverança.
