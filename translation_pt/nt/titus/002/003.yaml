  text: Πρεσβύτιδας ὡσαύτως ἐν καταστήματι ἱεροπρεπεῖς, μὴ διαβόλους ⸀μηδὲ οἴνῳ πολλῷ δεδουλωμένας, καλοδιδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/003.yaml
  text: Older women likewise are to be reverent in behavior[a], not slanderers nor enslaved to much wine, teachers of what is good[b],
translation:
  language: pt
  text: As mulheres mais velhas, semelhantemente, devem ser reverentes no comportamento, não caluniadoras nem escravizadas a muito vinho, mestras do que é bom,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρεσβύτιδας
  choice: As mulheres mais velhas
  rationale: Refere-se especificamente a mulheres de idade mais avançada, em paralelo com os homens mais velhos do contexto anterior. A expressão é natural e evita o tom potencialmente pejorativo ou excessivamente etário de “mulheres idosas”.
- source_word: ὡσαύτως
  choice: semelhantemente
  rationale: Preserva a ligação com a exortação anterior e soa digna e clara em português.
- source_word: ἐν καταστήματι ἱεροπρεπεῖς
  choice: reverentes no comportamento
  rationale: κατάστημα denota porte ou conduta visível, e ἱεροπρεπής indica aquilo que convém ao sagrado. A formulação comunica ambos os elementos sem se tornar artificial.
- source_word: μὴ διαβόλους
  choice: não caluniadoras
  rationale: Neste catálogo ético, διάβολος descreve pessoas que fazem acusações difamatórias, não o Diabo. “Caluniadoras” preserva de modo direto o sentido moral do termo.
- source_word: μηδὲ οἴνῳ πολλῷ δεδουλωμένας
  choice: nem escravizadas a muito vinho
  rationale: O particípio perfeito passivo de δουλόω apresenta a sujeição ao vinho como escravidão. A tradução mantém essa imagem forte, em vez de substituí-la pela interpretação “dependentes” ou “viciadas”.
- source_word: καλοδιδασκάλους
  choice: mestras do que é bom
  rationale: O raro adjetivo composto caracteriza quem ensina coisas boas. “Mestras do que é bom” mantém a força descritiva do termo e deixa claro que “bom” qualifica o conteúdo ensinado, não apenas a habilidade de ensinar.
theological_decisions:
- issue: A imagem de escravidão na exortação acerca do vinho
  choice: Manter “escravizadas a muito vinho”
  alternative: “viciadas em muito vinho” ou “dominadas por muito vinho”
  rationale: O grego emprega explicitamente a linguagem de escravização para retratar o domínio exercido pelo vinho. Preservar a metáfora mantém a intensidade ética do texto sem diagnosticar, em termos modernos, uma condição clínica.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A construção elíptica grega foi explicitada com “devem ser”, conforme a sintaxe natural do português. O paralelismo da lista foi preservado, assim como a linguagem forte de escravidão.
