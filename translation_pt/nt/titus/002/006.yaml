  text: Τοὺς νεωτέρους ὡσαύτως παρακάλει σωφρονεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/006.yaml
  text: Likewise[b][a], urge the younger men to be self-controlled.
translation:
  language: pt
  text: Da mesma forma, exorte os homens mais jovens[a] a terem domínio próprio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os jovens”. O grego se refere especificamente a homens mais jovens, não às pessoas jovens em geral.
    reason: lexical_alternative
  - marker: b
    text: Ou “a serem sensatos” ou “a terem uma mente equilibrada”. O grego ressalta o bom senso acompanhado de autodisciplina.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοὺς νεωτέρους
  choice: os homens mais jovens
  rationale: O acusativo masculino plural com artigo se refere especificamente aos homens mais jovens, em paralelo com os grupos distinguidos por idade e sexo no contexto. A formulação evita que o masculino português seja entendido genericamente como todas as pessoas jovens.
- source_word: ὡσαύτως
  choice: Da mesma forma
  rationale: Expressa com naturalidade a ligação desta exortação com as instruções paralelas anteriores.
- source_word: παρακάλει
  choice: exorte
  rationale: O imperativo presente dirigido a Tito comunica uma ação contínua de aconselhar com insistência. “Exorte” preserva a força do verbo e é adequado ao registro digno do texto.
- source_word: σωφρονεῖν
  choice: a terem domínio próprio
  rationale: O infinitivo indica o conteúdo da exortação e, neste contexto, reúne as ideias de juízo equilibrado, sensatez e autodisciplina. “Ter domínio próprio” comunica de modo claro o aspecto comportamental central.
theological_decisions:
- issue: Referência de gênero em νεωτέρους
  choice: referência específica aos homens mais jovens
  alternative: referência genérica às pessoas mais jovens
  rationale: A forma grega é masculina, e a estrutura imediata trata separadamente grupos definidos por sexo e idade. A tradução preserva essa especificidade sem generalizar o referente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Da mesma forma” mantém a continuidade retórica; “homens mais jovens” explicita o referente masculino; “domínio próprio” usa linguagem corrente e preserva a ênfase ética do termo grego.
