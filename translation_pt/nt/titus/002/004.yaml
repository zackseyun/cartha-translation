  text: ἵνα ⸀σωφρονίζωσι τὰς νέας φιλάνδρους εἶναι, φιλοτέκνους,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/004.yaml
  text: so that they may train the younger women to be loving toward their husbands and loving toward their children[c][b][a],
translation:
  language: pt
  text: para que orientem as mulheres mais jovens[a] a amar seus maridos e seus filhos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as jovens”. O grego diz literalmente “as mais jovens”, em contraste com as mulheres mais velhas mencionadas no contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “a serem amorosas com seus maridos e seus filhos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade da instrução dada às mulheres mais velhas e expressa naturalmente em português a força do subjuntivo grego.
- source_word: σωφρονίζωσι
  choice: orientem
  rationale: O verbo pode indicar levar alguém a agir com sensatez, aconselhar ou formar. “Orientem” comunica instrução prática e formativa sem restringir o sentido ao ensino intelectual.
- source_word: τὰς νέας
  choice: as mulheres mais jovens
  rationale: O adjetivo feminino substantivado designa as mais jovens em contraste com as mulheres idosas do contexto. A explicitação de “mulheres” é necessária e natural em português.
- source_word: φιλάνδρους
  choice: a amar o marido
  rationale: O adjetivo descreve afeição pelo próprio marido. A construção verbal é a forma mais direta e natural de expressar essa qualidade em português.
- source_word: εἶναι
  choice: a
  rationale: O infinitivo grego, ligado aos adjetivos seguintes, é expresso idiomaticamente pela construção “orientem ... a amar”.
- source_word: φιλοτέκνους
  choice: e os filhos
  rationale: Em coordenação com “amar o marido”, transmite de modo conciso o amor pelos próprios filhos e preserva o paralelismo do par grego.
theological_decisions:
- issue: Alcance da referência às mulheres mais jovens no contexto doméstico
  choice: “as mulheres mais jovens”, sem restringir a expressão a “esposas”
  alternative: “as esposas mais jovens”
  rationale: O grego se refere literalmente às mais jovens, embora os qualificativos seguintes pressuponham, no caso em vista, marido e filhos. A tradução preserva essa referência contextual sem fazer do versículo uma definição exaustiva da condição feminina.
- issue: Caráter do amor ao marido e aos filhos
  choice: “amar o marido e os filhos”
  alternative: “ser amorosas com o marido e com os filhos”
  rationale: A formulação verbal comunica naturalmente as qualidades expressas pelos dois adjetivos gregos, sem reduzir o amor a mero sentimento nem acrescentar deveres não declarados no texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Orientem” evita tanto a rigidez de “disciplinem” quanto a limitação cognitiva de “ensinem”; a construção “amar o marido e os filhos” mantém concisão e naturalidade.
