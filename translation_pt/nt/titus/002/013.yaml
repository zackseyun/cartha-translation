id: TIT.2.13
reference: Titus 2:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: προσδεχόμενοι τὴν μακαρίαν ἐλπίδα καὶ ἐπιφάνειαν τῆς δόξης τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/013.yaml
  text: as we await the blessed hope and the appearing of the glory of our great God and Savior[a], Jesus the Messiah,
translation:
  language: pt
  text: enquanto aguardamos a bendita esperança e a manifestação da glória do nosso grande Deus e Salvador[a], Jesus, o Messias,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, menos provavelmente, “a glória do grande Deus e do nosso Salvador, Jesus, o Messias”, entendendo “Deus” e “Salvador” como referências a duas pessoas distintas, e não como uma única designação de Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: προσδεχόμενοι
  choice: enquanto aguardamos
  rationale: O particípio retoma a exortação anterior e expressa expectativa contínua; a oração com “enquanto” é natural em português e preserva essa ligação.
- source_word: μακαρίαν
  choice: bendita
  rationale: Mantém o sentido elevado e favorável do termo no contexto escatológico, sem a conotação trivial que “feliz” poderia adquirir.
- source_word: ἐλπίδα
  choice: esperança
  rationale: Equivalente direto e corrente; aqui designa aquilo que se espera com confiança, não mero desejo incerto.
- source_word: ἐπιφάνειαν
  choice: manifestação
  rationale: Expressa a aparição pública e visível em linguagem portuguesa clara, evitando o tecnicismo “epifania”.
- source_word: δόξης
  choice: glória
  rationale: Equivalente direto que preserva a construção genitiva “manifestação da glória”.
- source_word: μεγάλου
  choice: grande
  rationale: Tradução direta do adjetivo que qualifica “Deus”.
- source_word: θεοῦ
  choice: Deus
  rationale: Equivalente padrão; na leitura principal, integra com “Salvador” uma designação única de Jesus.
- source_word: σωτῆρος
  choice: Salvador
  rationale: Termo consagrado e natural em português para σωτήρ neste contexto.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como o título “Messias” e emprega o artigo exigido pela forma idiomática em português.
theological_decisions:
- issue: Se “nosso grande Deus e Salvador, Jesus, o Messias” designa uma só pessoa ou se “o grande Deus” e “nosso Salvador Jesus, o Messias” designam duas pessoas
  choice: 'Uma só pessoa: Jesus, o Messias, é identificado como “nosso grande Deus e Salvador”.'
  alternative: 'Duas pessoas: “o grande Deus” e “nosso Salvador, Jesus, o Messias”.'
  rationale: No grego, um único artigo rege dois substantivos pessoais singulares ligados por καί, e o nome “Jesus, o Messias” vem em seguida; a leitura mais natural é de um único referente. A alternativa, embora menos provável, é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Manifestação” evita tanto o tecnicismo “epifania” quanto uma formulação excessivamente coloquial. A pontuação apresenta “Jesus, o Messias” como aposto identificador, sem apagar a alternativa sintática registrada na nota.
