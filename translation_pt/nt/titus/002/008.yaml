  text: λόγον ὑγιῆ ἀκατάγνωστον, ἵνα ὁ ἐξ ἐναντίας ἐντραπῇ μηδὲν ἔχων ⸂λέγειν περὶ ἡμῶν⸃ φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/008.yaml
  text: sound speech that cannot be condemned[a], so that the one who opposes us may be put to shame[c][b], having nothing evil to say about us.
translation:
  language: pt
  text: linguagem sadia[a], que não possa ser condenada[b], para que o adversário[c] fique envergonhado, não tendo nada de mau a dizer a nosso respeito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “palavra sadia” ou “mensagem sadia”.
    reason: lexical_alternative
  - marker: b
    text: Ou “irrepreensível” ou “que não dê motivo para censura”.
    reason: lexical_alternative
  - marker: c
    text: Em grego, “aquele que está do lado oposto”, isto é, um oponente.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον ὑγιῆ
  choice: linguagem sadia
  rationale: Neste contexto, λόγος abrange o conteúdo e a maneira de falar no ensino, enquanto ὑγιής emprega a metáfora de saúde para indicar integridade doutrinária e moral. “Linguagem sadia” é natural em português e evita limitar a expressão a uma única palavra.
- source_word: ἀκατάγνωστον
  choice: que não possa ser condenada
  rationale: O adjetivo indica aquilo contra o qual não cabe censura ou condenação válida. A oração relativa comunica essa nuance com clareza e naturalidade.
- source_word: ἵνα
  choice: para que
  rationale: Preserva o valor de finalidade, sem excluir a nuance de resultado presente no contexto.
- source_word: ὁ ἐξ ἐναντίας
  choice: o adversário
  rationale: A expressão significa literalmente alguém “do lado oposto”. “O adversário” é conciso e idiomático, sem especificar além do texto quem seja essa pessoa.
- source_word: ἐντραπῇ
  choice: fique envergonhado
  rationale: Expressa o resultado de ser levado à vergonha diante da ausência de fundamento para acusar. A formulação portuguesa mantém aberta a relação entre vergonha interior e desonra pública.
- source_word: μηδὲν ἔχων λέγειν
  choice: não tendo nada ... a dizer
  rationale: Reproduz naturalmente a construção participial e a ideia de não dispor de acusação válida.
- source_word: περὶ ἡμῶν
  choice: a nosso respeito
  rationale: Mantém a primeira pessoa do plural do grego sem restringir nem ampliar seu referente.
- source_word: φαῦλον
  choice: mau
  rationale: O termo pode designar algo moralmente mau, vil ou censurável. “Mau” soa natural com “dizer” e conserva a amplitude da acusação negativa.
theological_decisions:
- issue: Alcance da primeira pessoa do plural em περὶ ἡμῶν
  choice: a nosso respeito
  alternative: a seu respeito; a respeito dos cristãos; a respeito de nosso ensino
  rationale: O grego usa a primeira pessoa do plural. Preservá-la evita identificar de modo indevido o grupo apenas com Tito, com toda a comunidade cristã ou exclusivamente com o ensino.
- issue: Nuance de ἐντραπῇ
  choice: fique envergonhado
  alternative: seja envergonhado; sinta vergonha
  rationale: A forma pode destacar tanto a vergonha experimentada pelo adversário quanto o fato de ele ser publicamente desmentido. A tradução não reduz a expressão a mero constrangimento emocional nem impõe uma leitura estritamente externa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém o caráter de continuação sintática do versículo anterior, evita linguagem denominacional e conserva tanto o plural “nosso” quanto a tensão semântica ligada à vergonha do adversário.
