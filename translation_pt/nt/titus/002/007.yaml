translation:
  language: pt
  text: Em tudo, apresente-se como exemplo de boas obras[a]; em seu ensino, mostre integridade[b] e dignidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em todos os aspectos, mostre-se um modelo de boas obras”.'
    reason: Registra as alternativas legítimas para περὶ πάντα, σεαυτὸν παρεχόμενος e τύπον.
  - marker: b
    text: 'Ou: “incorruptibilidade”, “pureza” ou “ausência de corrupção”.'
    reason: ἀφθορία pode indicar a qualidade daquilo que não foi corrompido ou adulterado; neste contexto, também pode ser entendida como pureza ou integridade no ensino.
  - marker: c
    text: 'Ou: “seriedade respeitável”.'
    reason: σεμνότης combina seriedade, respeitabilidade e dignidade.
lexical_decisions:
- source_word: περὶ πάντα
  choice: Em tudo
  rationale: A expressão funciona adverbialmente e indica a abrangência da conduta de Tito. “Em tudo” é natural em português e mantém a amplitude do grego.
- source_word: σεαυτὸν παρεχόμενος
  choice: apresente-se
  rationale: Preserva a força reflexiva e a participação ativa de Tito em se mostrar aos outros de determinada maneira.
- source_word: τύπον
  choice: exemplo
  rationale: Neste contexto ético, designa um modelo digno de imitação; “exemplo” é a formulação mais clara e corrente.
- source_word: καλῶν ἔργων
  choice: de boas obras
  rationale: Reproduz diretamente a relação genitiva e conserva uma expressão bíblica compreensível no português atual.
- source_word: ἐν τῇ διδασκαλίᾳ
  choice: em seu ensino
  rationale: No contexto, refere-se naturalmente à atividade de Tito como mestre. O possessivo implícito evita a formulação menos natural “no ensino” sem reduzir o termo a doutrina formal.
- source_word: ἀφθορίαν
  choice: integridade
  rationale: O substantivo expressa ausência de corrupção ou adulteração. No contexto do ensino, “integridade” comunica de modo natural sua qualidade íntegra e não corrompida, preservando a amplitude ética e doutrinária.
- source_word: σεμνότητα
  choice: dignidade
  rationale: Expressa uma seriedade respeitável; “dignidade” é corrente e mantém tanto a sobriedade quanto o caráter digno de respeito.
theological_decisions:
- issue: Se διδασκαλία deve ser traduzido com terminologia eclesiástica
  choice: “ensino”, em vez de “doutrina”
  alternative: “doutrina” ou “o ensino”
  rationale: O termo abrange aqui a atividade e o conteúdo da instrução de Tito. “Ensino” mantém essa amplitude sem restringi-lo a uma formulação dogmática.
- issue: Como interpretar ἀφθορίαν em relação ao ensino
  choice: “integridade”
  alternative: “incorruptibilidade”, “pureza” ou “ausência de corrupção”
  rationale: O grego aponta para aquilo que não é corrompido. “Integridade” é idiomático em português e pode qualificar tanto a conduta do mestre quanto a qualidade de seu ensino, sem decidir de modo indevido entre essas nuances.
- issue: Relação sintática dos substantivos com ἐν τῇ διδασκαλίᾳ
  choice: 'Explicitar verbalmente: “em seu ensino, mostre integridade e dignidade”'
  alternative: 'Construção nominal: “em seu ensino, integridade e dignidade”'
  rationale: O grego apresenta os substantivos como qualidades a serem manifestadas. A explicitação de “mostre” produz português natural e não acrescenta uma exigência teológica estranha ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperativo reflexivo “apresente-se” e a explicitação “mostre” reproduzem naturalmente a força do particípio grego. As notas preservam as principais ambiguidades lexicais sem sobrecarregar o texto principal.
