  text: ὃς ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν ἵνα λυτρώσηται ἡμᾶς ἀπὸ πάσης ἀνομίας καὶ καθαρίσῃ ἑαυτῷ λαὸν περιούσιον, ζηλωτὴν καλῶν ἔργων.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/014.yaml
  text: who gave himself for us[a], so that he might redeem us from all lawlessness and purify for himself a people for his own possession, zealous for good works.
translation:
  language: pt
  text: que se entregou por nós, para nos resgatar de toda transgressão da lei e purificar para si um povo exclusivamente seu[a], zeloso de boas obras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um povo precioso para ele” ou “um povo especial”. A expressão grega preserva o sentido pactual de um povo que lhe pertence de maneira particular.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν ἑαυτὸν
  choice: se entregou
  rationale: Expressa com naturalidade a entrega voluntária de si mesmo, preservando a força reflexiva da expressão grega.
- source_word: ὑπὲρ ἡμῶν
  choice: por nós
  rationale: Mantém de forma concisa a amplitude benefativa e a possível nuance substitutiva, sem impor ao versículo um modelo específico de expiação.
- source_word: ἵνα λυτρώσηται
  choice: para nos resgatar
  rationale: “Resgatar” comunica libertação mediante redenção e conserva a ressonância redentora do verbo λυτρόομαι em linguagem corrente.
- source_word: ἀπὸ πάσης ἀνομίας
  choice: de toda transgressão da lei
  rationale: Torna explícita a relação de ἀνομία com a violação da lei, evitando tanto o sentido moderno de mera ilegalidade civil quanto o termo mais amplo “maldade”.
- source_word: καθαρίσῃ
  choice: purificar
  rationale: Preserva a dimensão moral e cultual do verbo no contexto da formação de um povo santo.
- source_word: ἑαυτῷ
  choice: para si
  rationale: Comunica que a purificação tem em vista um povo pertencente ao próprio Cristo.
- source_word: λαὸν περιούσιον
  choice: um povo exclusivamente seu
  rationale: Conserva de modo natural a ideia pactual de posse especial, evocada pelo uso da expressão na Septuaginta, sem reduzi-la ao sentido vago de “especial”.
- source_word: ζηλωτὴν καλῶν ἔργων
  choice: zeloso por boas obras
  rationale: Segue de perto o grego e exprime dedicação ardente à prática do bem em registro digno e compreensível.
theological_decisions:
- issue: Sentido de ὑπὲρ ἡμῶν na entrega de Cristo
  choice: por nós
  alternative: em nosso lugar
  rationale: A formulação escolhida abrange o benefício e admite a nuance substitutiva sem resolver além do que esta preposição, isoladamente, exige.
- issue: Nuance pactual de λαὸν περιούσιον
  choice: um povo exclusivamente seu
  alternative: um povo precioso; um povo especial
  rationale: A tradução preserva a ideia de pertencimento particular presente na linguagem pactual do Antigo Testamento grego, enquanto a nota registra outras possibilidades legítimas.
- issue: Referente de ἑαυτῷ
  choice: Cristo purifica um povo para si
  alternative: Deus purifica um povo para si
  rationale: O pronome reflexivo retoma naturalmente o sujeito do relativo, Cristo, sem desfazer a relação deste texto com a linguagem pactual aplicada a Deus no Antigo Testamento.
translation_notes:
  register: Português moderno, corrente e digno, com ampla legibilidade brasileira. “Se entregou” é mais idiomático que “deu a si mesmo”; “transgressão da lei” evita que “ilegalidade” seja entendida apenas em sentido jurídico civil. A construção conserva o encadeamento final do grego e mantém a linguagem ética de “boas obras”.
