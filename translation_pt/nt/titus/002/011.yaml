  text: Ἐπεφάνη γὰρ ἡ χάρις τοῦ ⸀θεοῦ σωτήριος πᾶσιν ἀνθρώποις
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/011.yaml
  text: For the grace of God has appeared[b][a], bringing salvation to all people.
translation:
  language: pt
  text: Pois a graça de Deus se manifestou, trazendo salvação a todas as pessoas[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “se manifestou, salvando todas as pessoas” ou “se manifestou a todas as pessoas”. O adjetivo grego σωτήριος (“salvadora”, “que traz salvação”) e a expressão no dativo πᾶσιν ἀνθρώποις podem ser relacionados sintaticamente de mais de uma maneira.'
    reason: lexical_alternative
  - marker: b
    text: “Pessoas” traduz o grego anthrōpois em sentido genérico, referindo-se aos seres humanos, e não somente aos homens do sexo masculino.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεφάνη
  choice: se manifestou
  rationale: 'O aoristo de ἐπιφαίνω tem aqui sentido intransitivo: “apareceu”, “tornou-se manifesta”. “Se manifestou” é natural e digno em português, preservando a ideia de uma manifestação histórica da graça divina.'
- source_word: γὰρ
  choice: Pois
  rationale: γάρ introduz a razão ou explicação das exortações anteriores. “Pois” mantém essa ligação argumentativa de maneira clara.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: a graça de Deus
  rationale: “Graça” é a tradução consagrada e adequada de χάρις, e o genitivo τοῦ θεοῦ é representado de modo transparente por “de Deus”.
- source_word: σωτήριος
  choice: trazendo salvação
  rationale: O adjetivo σωτήριος caracteriza a graça como salvadora ou portadora de salvação. A construção verbal é idiomática em português e evita o termo técnico “salvífica”.
- source_word: πᾶσιν ἀνθρώποις
  choice: a todas as pessoas
  rationale: ἄνθρωποι refere-se genericamente aos seres humanos, e não apenas aos homens do sexo masculino. Com “trazendo salvação”, a preposição “a” expressa naturalmente o dativo, sem estreitar o alcance universal da frase.
theological_decisions:
- issue: Alcance de πᾶσιν ἀνθρώποις em relação à salvação
  choice: a todas as pessoas
  alternative: para todas as pessoas; a toda a humanidade; a pessoas de todo tipo
  rationale: A tradução conserva a amplitude universal da expressão grega sem decidir se ela designa cada indivíduo sem exceção ou pessoas de todos os grupos mencionados no contexto. Também não especifica uma teoria sobre como essa salvação é recebida ou aplicada.
- issue: Relação sintática entre σωτήριος e πᾶσιν ἀνθρώποις
  choice: trazendo salvação a todas as pessoas
  alternative: salvadora para todas as pessoas; manifestou-se a todas as pessoas
  rationale: A formulação principal entende σωτήριος como qualificando a graça e o dativo como indicando aqueles a quem a salvação se dirige. A nota preserva outras relações sintáticas possíveis sem resolver além do que o grego permite.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Se manifestou” conserva o tom teológico sem soar arcaico; “todas as pessoas” comunica de modo inclusivo o sentido genérico do grego.
