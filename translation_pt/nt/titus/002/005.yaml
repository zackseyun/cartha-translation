id: TIT.2.5
reference: Titus 2:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: σώφρονας, ἁγνάς, ⸀οἰκουργούς, ἀγαθάς, ὑποτασσομένας τοῖς ἰδίοις ἀνδράσιν, ἵνα μὴ ὁ λόγος τοῦ θεοῦ βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/005.yaml
  text: self-controlled[a], pure, working at home, kind, being subject to their own husbands[c][b], so that the word of God may not be slandered.
translation:
  language: pt
  text: sensatas, puras, dedicadas ao trabalho doméstico[a], bondosas, sujeitas ao próprio marido[b], para que a palavra de Deus não seja difamada[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ocupadas em casa” ou “que cuidem do lar”. O termo grego é raro e se refere ao empenho no trabalho e nas responsabilidades domésticas.
    reason: lexical_alternative
  - marker: b
    text: Ou “que se submetam ao próprio marido”.
    reason: lexical_alternative
  - marker: c
    text: Ou “não seja insultada”; mais literalmente, “não seja blasfemada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σώφρονας
  choice: sensatas
  rationale: O termo descreve bom senso que se manifesta em prudência e domínio de si. “Sensatas” é natural em português e, no contexto desta lista de virtudes, preserva tanto o aspecto mental quanto o comportamental.
- source_word: ἁγνάς
  choice: puras
  rationale: Expressa pureza sobretudo moral. “Puras” mantém a amplitude do termo sem restringi-lo apenas à castidade sexual.
- source_word: οἰκουργούς
  choice: dedicadas ao trabalho doméstico
  rationale: O raro adjetivo associa casa e trabalho e indica empenho nas responsabilidades domésticas. Esta formulação preserva a ideia de trabalho sem sugerir confinamento ao lar.
- source_word: ἀγαθάς
  choice: bondosas
  rationale: Embora o sentido básico seja “boas”, na lista de condutas o termo aponta naturalmente para a bondade demonstrada no trato com outros; “bondosas” é claro e idiomático.
- source_word: ὑποτασσομένας
  choice: sujeitas
  rationale: O particípio denota subordinação ou sujeição dentro de uma relação ordenada. “Sujeitas” permanece próximo do grego sem acrescentar uma teoria mais ampla sobre os papéis conjugais.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: ao próprio marido
  rationale: Neste contexto conjugal, ἀνήρ significa “marido”. O distributivo singular é natural em português, e “próprio” preserva ἰδίοις, limitando a referência ao marido de cada uma.
- source_word: ἵνα μὴ
  choice: para que ... não
  rationale: A construção introduz finalidade. “Para que ... não” transmite diretamente essa força em português corrente.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: É a correspondência direta e consagrada da expressão, aqui referente à mensagem divina e à sua reputação pública.
- source_word: βλασφημῆται
  choice: seja difamada
  rationale: O verbo pode indicar fala insultuosa, caluniosa ou irreverente. Com “a palavra de Deus” como sujeito paciente, “seja difamada” comunica claramente que a mensagem pode ser desacreditada por fala hostil, sem limitar o sentido à acepção religiosa moderna de “blasfemar”.
theological_decisions:
- issue: Traduzir οἰκουργούς sem transformar responsabilidade doméstica em confinamento ao lar
  choice: dedicadas ao trabalho doméstico
  alternative: que cuidem do lar; ocupadas em casa
  rationale: O termo raro enfatiza atividade e trabalho ligados à casa. A tradução conserva essa responsabilidade concreta, mas não afirma que a mulher deva permanecer exclusivamente dentro de casa.
- issue: Preservar a sujeição conjugal expressa por ὑποτασσομένας sem impor um sistema doutrinário mais amplo
  choice: sujeitas ao próprio marido
  alternative: que se submetam ao próprio marido
  rationale: “Sujeitas” mantém a relação ordenada indicada no grego. “Ao próprio marido” restringe explicitamente o âmbito à relação conjugal de cada mulher; o versículo, por si só, não define todos os contornos dessa sujeição.
- issue: Representar βλασφημῆται quando o objeto lógico é a palavra de Deus
  choice: não seja difamada
  alternative: não seja blasfemada; não seja insultada
  rationale: “Difamada” expressa o descrédito público lançado sobre a mensagem de Deus. A nota conserva a tradução mais formal e a possibilidade de fala insultuosa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega o plural feminino exigido pelo contexto anterior. O singular distributivo “ao próprio marido” soa mais natural que “aos próprios maridos” sem alterar o sentido. As notas preservam alternativas lexicais genuínas e evitam ampliar o texto para uma norma de confinamento doméstico ou para um sistema denominacional de papéis conjugais.
