id: TIT.2.1
reference: Titus 2:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Σὺ δὲ λάλει ἃ πρέπει τῇ ὑγιαινούσῃ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/001.yaml
  text: But as for you[a], speak the things that are fitting for sound teaching.
translation:
  language: pt
  text: Você, porém, fale o que está de acordo com o ensino sadio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a doutrina sadia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Você, porém
  rationale: O pronome explícito Σὺ, junto de δὲ, estabelece contraste com os falsos mestres mencionados antes. “Você, porém” preserva essa ênfase de modo natural em português.
- source_word: λάλει
  choice: fale
  rationale: O imperativo de λαλέω tem o sentido amplo de falar ou dizer. “Fale” preserva a ordem sem restringi-la apenas ao ato formal de ensinar.
- source_word: ἃ
  choice: o que
  rationale: Embora o grego empregue um relativo neutro plural, “o que” expressa o conteúdo de maneira mais natural em português moderno, sem perda relevante de sentido.
- source_word: πρέπει
  choice: é apropriado a
  rationale: πρέπει indica aquilo que convém, é adequado ou corresponde a algo. “É apropriado a” conserva a noção de conformidade e adequação.
- source_word: ὑγιαινούσῃ
  choice: sadio
  rationale: O particípio é usado metaforicamente para aquilo que tem saúde ou integridade. “Sadio” mantém a metáfora e combina naturalmente com “ensino”.
- source_word: διδασκαλίᾳ
  choice: ensino
  rationale: διδασκαλία pode indicar tanto o ensino ministrado quanto seu conteúdo. “Ensino” é claro, corrente e menos técnico que “doutrina”, preservando ambas as possibilidades.
theological_decisions:
- issue: Tradução de τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: ensino sadio
  alternative: doutrina sadia
  rationale: “Ensino sadio” preserva a metáfora de saúde e abrange tanto o ato quanto o conteúdo da instrução apostólica, sem reduzir a expressão a um termo técnico. A alternativa “doutrina sadia” explicita mais diretamente o conteúdo doutrinário e por isso é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A inversão “Você, porém” conserva o contraste enfático do grego; “ensino sadio” mantém a metáfora sem recorrer desnecessariamente a jargão eclesiástico.
