  text: Δούλους ἰδίοις δεσπόταις ὑποτάσσεσθαι ἐν πᾶσιν, εὐαρέστους εἶναι, μὴ ἀντιλέγοντας,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/009.yaml
  text: Slaves are to submit to their own masters in everything[a], to be pleasing, not argumentative[b],
translation:
  language: pt
  text: Que os escravos[a] se sujeitem em tudo aos seus próprios senhores, sendo-lhes agradáveis e não os contradizendo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos”; o termo grego pode designar pessoas que servem, mas aqui provavelmente se refere à condição de escravidão.
    reason: alternative_reading
  - marker: b
    text: Ou “não retrucando” ou “não falando contra eles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δούλους
  choice: os escravos
  rationale: Neste código doméstico, δοῦλος designa pessoas submetidas à autoridade de δεσπόταις e provavelmente em condição de escravidão; “escravos” preserva essa realidade social sem suavizá-la.
- source_word: ἰδίοις δεσπόταις
  choice: aos seus próprios senhores
  rationale: δεσπότης indica quem exerce autoridade senhorial e, neste contexto, domínio sobre escravos; “senhores” é natural em português, e “seus próprios” conserva ἰδίοις.
- source_word: ὑποτάσσεσθαι
  choice: se sujeitem
  rationale: O infinitivo presente médio/passivo exprime a conduta ordenada no contexto da exortação; “se sujeitem” comunica a subordinação voluntária ou assumida sem acrescentar justificativa à instituição.
- source_word: ἐν πᾶσιν
  choice: em tudo
  rationale: Mantém de forma concisa a abrangência de πᾶσιν, sem explicitar limitações que o versículo não declara.
- source_word: εὐαρέστους εἶναι
  choice: procurando agradá-los
  rationale: εὐάρεστος significa agradável ou aceitável. A formulação verbal é mais natural em português e, pelo contexto, explicita que os senhores são o referente implícito, sem alterar o sentido.
- source_word: μὴ ἀντιλέγοντας
  choice: não os contradizendo
  rationale: ἀντιλέγω pode significar contradizer, retrucar ou falar contra. “Não os contradizendo” preserva o aspecto verbal e mantém registro digno, sem o tom coloquial de “não respondendo mal”.
theological_decisions:
- issue: Tradução de δοῦλος no código doméstico
  choice: escravos
  alternative: servos
  rationale: A associação com δεσπόταις torna saliente a condição social de escravidão. “Servos” poderia encobrir essa realidade; a tradução descreve o contexto antigo sem endossar a instituição.
- issue: Abrangência de ἐν πᾶσιν
  choice: em tudo
  alternative: em todos os aspectos
  rationale: A expressão abrangente do grego é preservada sem inserir no próprio texto qualificações éticas ou teológicas não expressas neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém a sequência exortativa dependente do contexto anterior; por isso termina com vírgula. “Senhores” é empregado no sentido social histórico, e não como título divino.
