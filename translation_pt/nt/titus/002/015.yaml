id: TIT.2.15
reference: Titus 2:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ταῦτα λάλει καὶ παρακάλει καὶ ἔλεγχε μετὰ πάσης ἐπιταγῆς· μηδείς σου περιφρονείτω.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/015.yaml
  text: Speak these things[a], and exhort and rebuke with all authority. Let no one disregard you.
translation:
  language: pt
  text: Fale essas coisas, exorte e repreenda com toda a autoridade. Que ninguém o desconsidere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o despreze” ou “o trate com menosprezo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: essas coisas
  rationale: O demonstrativo neutro plural retoma de modo amplo as instruções anteriores. “Essas coisas” preserva essa referência sem restringi-la apenas a ensinos ou assuntos específicos.
- source_word: λάλει
  choice: fale
  rationale: O imperativo presente pede comunicação verbal contínua. “Fale” é direto e não reduz o verbo ao sentido mais específico de “ensine”.
- source_word: παρακάλει
  choice: exorte
  rationale: O verbo pode significar encorajar, apelar ou exortar. Neste contexto pastoral e ao lado de “repreenda”, “exorte” preserva sua força de apelo moral e orientação.
- source_word: ἔλεγχε
  choice: repreenda
  rationale: O verbo envolve expor o erro e corrigi-lo. “Repreenda” comunica de modo natural a força corretiva do imperativo.
- source_word: μετὰ πάσης ἐπιταγῆς
  choice: com toda a autoridade
  rationale: ἐπιταγή pode indicar ordem, comando ou autoridade. A expressão comunica o pleno peso com que Tito deve desempenhar essas ações, sem sugerir poder pessoal autônomo.
- source_word: μηδείς
  choice: ninguém
  rationale: Equivalente português claro e corrente para o sujeito indefinido negativo da proibição.
- source_word: σου
  choice: o
  rationale: O pronome genitivo refere-se pessoalmente a Tito. Em português, o pronome objeto masculino “o” expressa essa relação com concisão e clareza no contexto.
- source_word: περιφρονείτω
  choice: desconsidere
  rationale: O verbo significa considerar alguém de pouca importância, desprezar ou não lhe dar a devida consideração. “Desconsidere” mantém como texto principal a ideia de não levar Tito a sério; sentidos mais fortes são registrados na nota.
theological_decisions:
- issue: Força da posição ministerial de Tito em μετὰ πάσης ἐπιταγῆς
  choice: Tito deve falar, exortar e repreender com toda a autoridade ligada à missão e às instruções que recebeu.
  alternative: A expressão poderia ser entendida apenas como uma ordem para falar em tom imperativo ou como referência exclusiva à autoridade da mensagem.
  rationale: A locução modifica naturalmente os imperativos e indica o peso pleno com que Tito deve cumprir essas tarefas. “Com toda a autoridade” preserva essa força sem transformar a autoridade ministerial contextual em poder pessoal independente.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. Os três imperativos foram mantidos distintos, e a alternativa lexical mais forte para περιφρονέω foi preservada em nota.
