source:
  edition: SBLGNT
  text: μὴ νοσφιζομένους, ἀλλὰ ⸂πᾶσαν πίστιν⸃ ἐνδεικνυμένους ἀγαθήν, ἵνα τὴν διδασκαλίαν ⸀τὴν τοῦ σωτῆρος ἡμῶν θεοῦ κοσμῶσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/010.yaml
  text: not pilfering[a], but showing all good faith, so that in everything they may adorn the teaching of God our Savior.
translation:
  language: pt
  text: não furtando, mas demonstrando completa fidelidade, para que em tudo tornem atraente o ensino de Deus, nosso Salvador.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νοσφιζομένους
  choice: não furtando
  rationale: O particípio indica apropriar-se para si do que pertence a outro. “Furtar” é claro e adequado ao contexto de servos encarregados dos bens de seus senhores, sem a especificidade excessiva de “desviar” ou “apropriar-se indevidamente”.
- source_word: πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν
  choice: demonstrando completa fidelidade
  rationale: Neste contexto ético, πίστις expressa fidelidade, lealdade ou confiabilidade no serviço. πᾶσαν intensifica a qualidade como plena ou completa, e ἀγαθήν a caracteriza positivamente. A formulação portuguesa transmite o sentido natural da expressão inteira.
- source_word: κοσμῶσιν
  choice: tornem atraente
  rationale: O verbo significa adornar ou embelezar. “Tornem atraente” preserva a metáfora funcionalmente e soa mais natural no português atual do que “adornem” aplicado a um ensino.
- source_word: διδασκαλίαν
  choice: o ensino
  rationale: “Ensino” representa διδασκαλία com clareza e linguagem acessível, sem a carga confessional que “doutrina” pode adquirir.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: de Deus, nosso Salvador
  rationale: A formulação conserva diretamente o título atribuído a Deus e evita introduzir nesta cláusula uma identificação referencial que o texto não explicita.
- source_word: ἐν πᾶσιν
  choice: em tudo
  rationale: Expressa de modo conciso e natural o alcance abrangente da conduta mencionada.
theological_decisions:
- issue: Sentido de πίστις neste contexto ético
  choice: fidelidade
  alternative: fé; confiabilidade; lealdade
  rationale: Embora πίστις frequentemente signifique “fé”, a oposição ao furto e a relação de serviço tornam “fidelidade” o sentido contextual mais provável. Traduzir esse valor no texto principal evita a expressão pouco idiomática e potencialmente ambígua “toda boa fé”.
- issue: Referente de “Deus, nosso Salvador”
  choice: Manter o título aplicado a Deus conforme a sintaxe do versículo
  alternative: Entender o título à luz do uso mais amplo de “Salvador” também para Cristo nas Cartas Pastorais
  rationale: A tradução deve refletir o que esta cláusula afirma explicitamente, sem resolver nela relações cristológicas desenvolvidas no contexto mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura participial grega foi mantida de forma concisa. Preferiu-se “tornem atraente” a “adornem” para conservar a força metafórica de κοσμέω em linguagem corrente.
