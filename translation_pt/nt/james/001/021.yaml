  naturalness: O registro é moderno, claro e apropriado. “Todo excesso de maldade” é natural e comunica adequadamente a noção de excesso/abundância sem acrescentar a imagem de algo que se espalha. “As almas de vocês” é idiomático e mantém o plural do original.
  terminology: “Impureza”, “mansidão”, “palavra implantada” e “salvar” são escolhas adequadas. “Almas” conserva a amplitude e o peso de ψυχάς, enquanto a nota indica alternativas legítimas.
