id: JAS.1.21
reference: James 1:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὸ ἀποθέμενοι πᾶσαν ῥυπαρίαν καὶ περισσείαν κακίας ἐν πραΰτητι δέξασθε τὸν ἔμφυτον λόγον τὸν δυνάμενον σῶσαι τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/021.yaml
  text: Therefore, having put away all filthiness and the overflow of wickedness, receive with meekness the implanted word, which is able to save your souls.
translation:
  language: pt
  text: Por isso, livrem-se de toda impureza e de todo excesso de maldade[a] e recebam com mansidão[b] a palavra implantada[c], que é capaz de salvar as almas de vocês[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a abundância do mal” ou “o transbordamento de maldade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “com brandura” ou “com humildade”.
    reason: lexical_alternative
  - marker: c
    text: Ou “a palavra inata”; tradicionalmente, “a palavra enxertada”.
    reason: lexical_alternative
  - marker: d
    text: Ou “a vida de vocês” ou “vocês mesmos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Expressa de modo natural a inferência em relação à exortação anterior.
- source_word: ἀποθέμενοι
  choice: livrem-se
  rationale: O particípio aoristo acompanha o imperativo principal e descreve uma ação necessária à recepção da palavra; a forma coordenada é idiomática em português e preserva a força exortativa.
- source_word: πᾶσαν ῥυπαρίαν
  choice: toda impureza
  rationale: Mantém o sentido moral de sujeira ou imundície sem recorrer a uma formulação pouco natural.
- source_word: περισσείαν κακίας
  choice: toda a maldade que se alastra
  rationale: Preserva a noção de maldade abundante, excedente ou proliferante e oferece em português uma imagem clara do mal que se espalha.
- source_word: ἐν πραΰτητι
  choice: com mansidão
  rationale: Conserva a postura de brandura, humildade e docilidade indicada por πραΰτης, em registro bíblico ainda compreensível.
- source_word: δέξασθε
  choice: recebam
  rationale: Traduz diretamente o imperativo de acolher ou aceitar, sem acrescentar um mecanismo interpretativo.
- source_word: τὸν ἔμφυτον λόγον
  choice: a palavra implantada
  rationale: Mantém a imagem de algo posto e arraigado no interior, sem decidir se o foco recai no ato de implantação ou em sua presença atual.
- source_word: τὸν δυνάμενον σῶσαι
  choice: que é capaz de salvar
  rationale: Preserva a afirmação de capacidade do particípio grego e sua relação com 'a palavra'.
- source_word: τὰς ψυχὰς ὑμῶν
  choice: a alma de vocês
  rationale: Em português, o singular distributivo é natural para a alma de cada integrante do grupo e conserva o peso teológico de ψυχή.
theological_decisions:
- issue: Sentido de ψυχὰς ὑμῶν no contexto de salvação
  choice: a alma de vocês
  alternative: a vida de vocês; vocês mesmos
  rationale: A escolha preserva o peso tradicional e teológico de ψυχή sem negar que, no grego, o termo também possa designar a vida ou a própria pessoa.
- issue: Sentido de ἔμφυτον λόγον
  choice: a palavra implantada
  alternative: a palavra inata; a palavra enxertada
  rationale: A formulação mantém aberta a possibilidade de a palavra ter sido implantada por Deus e agora estar arraigada nos ouvintes, sem especificar além do texto.
- issue: Relação entre ἀποθέμενοι e δέξασθε
  choice: 'dois imperativos coordenados: ''livrem-se... e recebam'''
  alternative: 'oração participial: ''tendo-se livrado..., recebam'''
  rationale: A coordenação comunica naturalmente em português a ação circunstancial ligada ao imperativo, sem impor uma separação cronológica rígida entre abandonar o mal e receber a palavra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural 'vocês' evita regionalismo excessivo. 'Mansidão' e 'palavra implantada' preservam o registro bíblico sem arcaísmo opaco.
