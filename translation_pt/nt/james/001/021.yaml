  rationale: A revisão substitui uma imagem não presente no grego (“que se alastra”) por “excesso”, que traduz diretamente περισσεία sem resolver indevidamente a nuance entre excesso, abundância e transbordamento; as alternativas permanecem na nota. Também restaura no texto português o plural de τὰς ψυχὰς. As demais escolhas do rascunho são fiéis, naturais e teologicamente não impositivas.
