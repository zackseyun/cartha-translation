  text: ἀνὴρ δίψυχος, ἀκατάστατος ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/008.yaml
  text: a double-minded man[a], unstable in all his ways.
translation:
  language: pt
  text: homem de ânimo dividido[a], instável em todos os seus caminhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pessoa de ânimo dividido, instável em todos os seus caminhos”. O grego está no masculino singular, mas provavelmente tem sentido representativo.'
    reason: Alternativa lexical e esclarecimento da força genérica do masculino.
lexical_decisions:
- source_word: ἀνὴρ
  choice: homem
  rationale: Mantém a forma masculina singular do grego e sua função representativa no contexto, retomando quem pede no versículo anterior. A formulação não restringe o sentido aos homens.
- source_word: δίψυχος
  choice: de ânimo dividido
  rationale: O adjetivo raro sugere literalmente alguém de 'duas almas'. 'De ânimo dividido' comunica em português atual a divisão interior e a lealdade vacilante, sem a estranheza de uma tradução literal como 'de alma dupla'.
- source_word: ἀκατάστατος
  choice: instável
  rationale: Expressa falta de firmeza e constância, que é o sentido pertinente ao contexto; evita conotações de desordem social ou moral que poderiam exceder o grego.
- source_word: ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ
  choice: em todos os seus caminhos
  rationale: Preserva a metáfora bíblica de ὁδοῖς para o conjunto dos rumos, decisões e conduta da pessoa, em linguagem natural e digna.
theological_decisions:
- issue: Linguagem masculina com força representativa
  choice: Manter 'homem' no texto principal
  alternative: pessoa de ânimo dividido, instável em todos os seus caminhos
  rationale: O grego emprega o masculino singular, mas no contexto a referência é genérica. O texto principal conserva a forma da fonte, enquanto a nota esclarece que a aplicação não se limita ao sexo masculino.
- issue: Sentido de δίψυχος
  choice: de ânimo dividido
  alternative: de alma dupla
  rationale: A opção escolhida preserva a tensão de uma interioridade dividida sem transformar a imagem lexical em uma afirmação antropológica técnica sobre duas almas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A expressão 'de ânimo dividido' é idiomática e evita tanto o arcaísmo quanto uma literalidade opaca; 'caminhos' conserva a metáfora da fonte.
