id: JAS.1.22
reference: James 1:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Γίνεσθε δὲ ποιηταὶ λόγου καὶ μὴ ⸂ἀκροαταὶ μόνον⸃ παραλογιζόμενοι ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/022.yaml
  text: But be doers of the word[a], and not hearers only, deceiving yourselves.
translation:
  language: pt
  text: Mas sejam praticantes da palavra, e não apenas ouvintes, enganando a si mesmos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “iludindo a si mesmos” ou “levando a si mesmos ao erro por um raciocínio falso”.
    reason: alternativa lexical
lexical_decisions:
- source_word: Γίνεσθε
  choice: sejam
  rationale: O imperativo presente, na segunda pessoa do plural, expressa uma exortação a uma conduta contínua. “Sejam” é natural e mantém a força imperativa.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição com contraste em relação à exortação anterior; “Mas” comunica adequadamente esse movimento.
- source_word: ποιηταὶ
  choice: praticantes
  rationale: Expressa pessoas que põem em prática o que ouvem e preserva o contraste com “ouvintes” em linguagem portuguesa atual.
- source_word: λόγου
  choice: da palavra
  rationale: Mantém a ligação com a “palavra implantada” de Tiago 1:21 e sua ressonância bíblica, sem restringir indevidamente o sentido a “ensino” ou “mensagem”.
- source_word: ἀκροαταὶ μόνον
  choice: apenas ouvintes
  rationale: Preserva tanto o substantivo quanto a limitação indicada por μόνον, com formulação natural em português.
- source_word: παραλογιζόμενοι
  choice: enganando
  rationale: Comunica claramente a autodecepção, embora o verbo grego também possa sugerir chegar ao erro por raciocínio falso; essa nuance é registrada em nota.
- source_word: ἑαυτούς
  choice: a si mesmos
  rationale: É o equivalente reflexivo natural em português para um referente plural e evita a possível ambiguidade regional de “vocês mesmos”.
theological_decisions:
- issue: Sentido de λόγος em Tiago 1:22
  choice: “a palavra”, entendida como a mensagem de Deus recebida e mencionada no contexto imediato
  alternative: “a mensagem” ou “o ensino”
  rationale: “A palavra” preserva a continuidade com Tiago 1:21 e a ressonância bíblico-teológica do termo sem impor uma definição doutrinária mais estreita.
- issue: Força do imperativo Γίνεσθε
  choice: 'Exortação contínua: “sejam praticantes”'
  alternative: 'Sentido ingressivo: “tornem-se praticantes”'
  rationale: O imperativo presente favorece uma prática contínua. “Sejam” preserva essa força sem excluir totalmente a ideia de passar a viver dessa maneira.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Praticantes” soa mais natural que “fazedores” e mantém o contraste retórico com “ouvintes”. O marcador [a] foi colocado após a expressão à qual a nota se refere.
