id: JAS.1.18
reference: James 1:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: βουληθεὶς ἀπεκύησεν ἡμᾶς λόγῳ ἀληθείας, εἰς τὸ εἶναι ἡμᾶς ἀπαρχήν τινα τῶν αὐτοῦ κτισμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/018.yaml
  text: Having willed it[a], he gave birth to us by the word of truth[b], so that we might be a kind of firstfruits of his creatures.
translation:
  language: pt
  text: Porque assim quis[a], ele nos deu à luz pela palavra da verdade, para que fôssemos uma espécie de primícias[b] entre as suas criaturas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por sua própria vontade, ele nos deu à luz pela palavra da verdade”.'
    reason: alternative_reading
  - marker: b
    text: “Primícias” eram a primeira porção da colheita, separada e oferecida a Deus; aqui, a imagem apresenta os crentes como uma porção inicial e consagrada entre as criaturas de Deus.
    reason: cultural_note
lexical_decisions:
- source_word: βουληθεὶς
  choice: Porque assim quis
  rationale: O particípio aoristo de βούλομαι expressa a vontade divina anterior à ação principal e, no contexto, provavelmente tem valor causal. A formulação é natural em português, ressalta a iniciativa de Deus e não introduz um sistema doutrinário específico.
- source_word: ἀπεκύησεν
  choice: ele nos deu à luz
  rationale: Preserva a imagem concreta de dar à luz e a ligação verbal com Tiago 1:15, onde o desejo dá à luz o pecado. Evita restringir a metáfora a uma imagem exclusivamente paterna.
- source_word: λόγῳ ἀληθείας
  choice: pela palavra da verdade
  rationale: O dativo tem valor instrumental, indicando o meio. A expressão mantém a forma bíblica e permite que o contexto identifique a palavra como a mensagem verdadeira, sem explicitação indevida.
- source_word: εἰς τὸ εἶναι ἡμᾶς
  choice: para que fôssemos
  rationale: A construção εἰς com infinitivo articular comunica propósito ou resultado. Esta forma preserva a força final sem decidir além do grego a relação exata entre intenção e resultado.
- source_word: ἀπαρχήν
  choice: primícias
  rationale: Mantém a metáfora agrícola e cultual da primeira porção da colheita, separada e oferecida a Deus, bem como suas ressonâncias bíblicas.
- source_word: τινα
  choice: uma espécie de
  rationale: τινα qualifica o predicativo e indica que os crentes são primícias em certo sentido, não uma porção numericamente indefinida.
- source_word: τῶν αὐτοῦ κτισμάτων
  choice: entre as suas criaturas
  rationale: κτίσματα designa seres ou coisas criadas no plural. A preposição 'entre' comunica com naturalidade a relação partitiva do genitivo, sem limitar o referente apenas à humanidade.
theological_decisions:
- issue: Iniciativa divina no novo nascimento
  choice: A vontade de Deus é apresentada como a razão de ele nos dar à luz.
  alternative: “Por sua própria vontade, ele nos gerou” ou uma formulação que associe explicitamente o texto a uma doutrina específica da regeneração.
  rationale: O grego põe a vontade divina antes da ação principal e lhe confere provável valor causal, mas não desenvolve aqui um sistema completo de predestinação ou regeneração.
- issue: Imagem de nascimento aplicada a Deus
  choice: “ele nos deu à luz”
  alternative: “ele nos gerou” ou “ele nos fez nascer”
  rationale: A tradução conserva a imagem lexical e o eco de Tiago 1:15. O verbo grego não exige que a imagem seja convertida em linguagem exclusivamente paterna.
- issue: Âmbito de κτισμάτων
  choice: “entre as suas criaturas” permanece amplo.
  alternative: “entre toda a humanidade” ou “entre as pessoas que ele criou”
  rationale: O texto não restringe explicitamente as criaturas aos seres humanos; a formulação ampla preserva essa abertura.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Deu à luz” preserva deliberadamente a metáfora vívida do original; “uma espécie de primícias” mantém tanto a qualificação de τινα quanto a imagem bíblica, explicada em nota.
