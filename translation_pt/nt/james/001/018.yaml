  naturalness: O português é moderno, claro e de registro bíblico digno. «Porque assim quis» e «para que fôssemos» são construções naturais no contexto. «Ele nos deu à luz» é uma formulação deliberadamente vívida e algo incomum quando aplicada a Deus, mas é justificável para preservar a metáfora concreta do original, sem tornar o texto ininteligível.
  terminology: «Palavra da verdade», «primícias» e «criaturas» são escolhas precisas e estabelecidas. «Uma espécie de» comunica de modo adequado o efeito qualificativo de τινα. A nota sobre «primícias» explica a imagem agrícola e cultual sem impor uma interpretação doutrinária.
