id: JAS.1.6
reference: James 1:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: αἰτείτω δὲ ἐν πίστει, μηδὲν διακρινόμενος, ὁ γὰρ διακρινόμενος ἔοικεν κλύδωνι θαλάσσης ἀνεμιζομένῳ καὶ ῥιπιζομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/006.yaml
  text: But let him ask in faith[a], doubting nothing, for the one who doubts is like a wave of the sea, driven by the wind and tossed about.
translation:
  language: pt
  text: Peça, porém, com fé[a], sem duvidar, pois quem duvida é semelhante a uma onda do mar, impelida pelo vento e agitada de um lado para outro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com confiança». Aqui, a palavra grega traduzida por «fé» também pode transmitir a ideia de confiança em Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτείτω
  choice: Peça
  rationale: O imperativo presente na terceira pessoa expressa uma exortação; em português, o presente do subjuntivo usado como imperativo é natural. O contexto imediato é o pedido de sabedoria a Deus.
- source_word: δὲ
  choice: porém
  rationale: Marca uma leve contraposição ou desenvolvimento em relação à promessa do versículo anterior; «porém» mantém a transição sem torná-la excessivamente forte.
- source_word: ἐν πίστει
  choice: com fé
  rationale: Embora a forma grega seja literalmente «em fé», «com fé» é a expressão mais natural em português para indicar a disposição confiante com que se pede, preservando o termo teológico «fé».
- source_word: μηδὲν διακρινόμενος
  choice: sem duvidar
  rationale: Neste contexto, διακρίνω descreve hesitação interior ou dúvida. A formulação negativa comunica o sentido de μηδέν de maneira clara e idiomática.
- source_word: ὁ γὰρ διακρινόμενος
  choice: pois quem duvida
  rationale: O particípio substantivado tem sentido genérico. «Quem duvida» evita uma especificação masculina ausente da função representativa da construção grega.
- source_word: ἔοικεν
  choice: é semelhante a
  rationale: Equivalente comparativo natural e digno, que introduz claramente a imagem.
- source_word: κλύδωνι θαλάσσης
  choice: uma onda do mar
  rationale: κλύδων designa uma onda ou vaga marítima; a expressão escolhida é clara para leitores modernos.
- source_word: ἀνεμιζομένῳ
  choice: impelida pelo vento
  rationale: O particípio passivo descreve a onda movida pelo vento; «impelida» conserva a força da imagem em registro digno.
- source_word: ῥιπιζομένῳ
  choice: agitada de um lado para outro
  rationale: O particípio comunica movimento instável provocado por forças externas. A expressão explicita essa oscilação sem acrescentar uma direção específica não presente no grego.
theological_decisions:
- issue: Sentido de πίστις no contexto da oração
  choice: fé
  alternative: confiança
  rationale: «Fé» preserva a continuidade lexical e teológica habitual de πίστις, enquanto o contexto envolve confiança em Deus. A alternativa «confiança» é registrada em nota para não ocultar essa nuance.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A construção é direta e digna; evita linguagem arcaica, marcação desnecessária de gênero e resolução indevida da sobreposição semântica entre fé e confiança.
