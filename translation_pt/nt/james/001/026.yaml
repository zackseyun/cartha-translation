source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ θρησκὸς ⸀εἶναι μὴ χαλιναγωγῶν γλῶσσαν ⸀αὐτοῦ ἀλλὰ ἀπατῶν καρδίαν ⸀αὐτοῦ, τούτου μάταιος ἡ θρησκεία.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/026.yaml
  text: If anyone thinks he is religious while not bridling his tongue but deceiving his heart[c][b][a], this person's religion is worthless.
translation:
  language: pt
  text: Se alguém pensa que é religioso[a], mas não põe freio na língua[b] e engana o próprio coração, a religião dessa pessoa é inútil.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “acha que é religioso”.'
    reason: lexical_alternative
  - marker: b
    text: O grego traz literalmente a imagem de “refrear a língua”, como quem controla um animal com um freio.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “vazia”, “sem valor” ou “sem proveito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖ
  choice: pensa
  rationale: Expressa a avaliação que a pessoa faz de si mesma; o contexto critica sua própria percepção de ser religiosa.
- source_word: θρησκὸς
  choice: religioso
  rationale: Preserva o sentido de alguém ligado à prática ou observância religiosa, sem restringi-lo à piedade interior.
- source_word: μὴ χαλιναγωγῶν γλῶσσαν αὐτοῦ
  choice: não põe freio na língua
  rationale: Mantém de modo natural em português a imagem concreta do freio usado para controlar um animal e a ligação temática com Tiago 3.
- source_word: ἀπατῶν καρδίαν αὐτοῦ
  choice: engana o próprio coração
  rationale: Conserva o termo bíblico concreto 'coração' como referência à pessoa interior e deixa claro que se trata do coração do próprio sujeito.
- source_word: τούτου
  choice: dessa pessoa
  rationale: Reproduz a força demonstrativa e retoma naturalmente a pessoa que acaba de ser descrita.
- source_word: μάταιος
  choice: inútil
  rationale: Comunica em português atual a ideia de algo sem proveito ou eficácia, evitando o possível sentido moderno de vaidade pessoal.
- source_word: ἡ θρησκεία
  choice: a religião
  rationale: É o equivalente direto e preserva a ligação lexical com 'religioso', referindo-se aqui à prática religiosa professada.
theological_decisions:
- issue: Referência genérica de gênero
  choice: Se alguém pensa que é religioso
  alternative: Se alguém se considera uma pessoa religiosa
  rationale: O masculino singular acompanha a forma representativa e genérica do grego, enquanto 'alguém' deixa claro que a afirmação se aplica de modo geral.
- issue: Sentido de θρησκός/θρησκεία
  choice: religioso / religião
  alternative: devoto / devoção; praticante / prática religiosa
  rationale: Preserva a relação lexical entre os dois termos e a ênfase na religião professada ou praticada, sem importar uma concepção denominacional específica.
- issue: Imagem do controle da fala
  choice: põe freio na língua
  alternative: controla a língua
  rationale: Mantém a metáfora deliberada do original sem reduzir a expressão a uma paráfrase abstrata.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores segue as expressões que explicam: [a] após a autoavaliação religiosa, [b] após a metáfora do freio e [c] após ''inútil''.'
