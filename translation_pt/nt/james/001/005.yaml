id: JAS.1.5
reference: James 1:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἰ δέ τις ὑμῶν λείπεται σοφίας, αἰτείτω παρὰ τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς καὶ ⸀μὴ ὀνειδίζοντος, καὶ δοθήσεται αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/005.yaml
  text: But if any of you lacks wisdom[a], let him ask of God, who gives to all generously and without reproach[b], and it will be given to him.
translation:
  language: pt
  text: Mas, se algum de vocês tem falta de sabedoria, peça-a a Deus, que dá a todos generosamente e sem censurar[a], e ela lhe será dada.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sem lançar em rosto».'
    reason: lexical_alternative
  - marker: b
    text: O grego emprega formas no singular para representar qualquer pessoa entre os destinatários.
    reason: cultural_note
lexical_decisions:
- source_word: Εἰ δέ
  choice: Mas, se
  rationale: δέ introduz um desenvolvimento levemente contrastivo em relação ao contexto anterior; «Mas, se» conserva essa ligação sem torná-la excessivamente forte.
- source_word: τις ὑμῶν
  choice: algum de vocês
  rationale: A expressão indefinida com genitivo partitivo dirige-se de modo natural e direto a qualquer pessoa entre os destinatários.
- source_word: λείπεται σοφίας
  choice: tem falta de sabedoria
  rationale: Expressa de modo corrente a ideia de carecer de algo e mantém «sabedoria» sem restringi-la explicitamente à sabedoria prática para enfrentar provações.
- source_word: αἰτείτω
  choice: peça-a
  rationale: O imperativo de terceira pessoa é transmitido diretamente; o pronome retoma «sabedoria» e evita uma formulação pouco natural em português.
- source_word: παρὰ τοῦ διδόντος θεοῦ
  choice: a Deus, que dá
  rationale: Com αἰτέω, παρά com genitivo indica a fonte de quem se pede; em português, «pedir algo a Deus» é a construção natural. O particípio descreve Deus como aquele que dá.
- source_word: πᾶσιν
  choice: a todos
  rationale: Preserva o alcance amplo e indefinido do plural grego sem acrescentar restrições.
- source_word: ἁπλῶς
  choice: generosamente
  rationale: No contexto da dádiva divina, o advérbio comunica melhor uma disposição franca e liberal para dar do que a tradução literal «simplesmente».
- source_word: μὴ ὀνειδίζοντος
  choice: sem censurar
  rationale: Conserva a ideia de que Deus não repreende, humilha nem lança em rosto a necessidade de quem pede, em linguagem atual e digna.
- source_word: δοθήσεται αὐτῷ
  choice: ela lhe será dada
  rationale: O futuro passivo mantém a promessa e o referente feminino «sabedoria» torna explícito o sujeito de forma natural. «Lhe» corresponde ao singular representativo αὐτῷ sem marcar gênero em português.
theological_decisions:
- issue: Singular representativo
  choice: algum de vocês ... peça-a ... lhe será dada
  alternative: qualquer um de vocês ... peça ... será dada a ele
  rationale: O grego apresenta uma pessoa singular representativa. O português mantém o singular sem precisar introduzir gênero masculino onde o próprio sistema pronominal permite uma forma não marcada.
- issue: Sentido de ἁπλῶς na maneira de Deus dar
  choice: generosamente
  alternative: com simplicidade / liberalmente
  rationale: «Generosamente» comunica a provável força contextual de uma dádiva franca e sem reserva, sem sugerir uma promessa materialista ou de prosperidade.
- issue: Força de μὴ ὀνειδίζοντος
  choice: sem censurar
  alternative: sem lançar em rosto / sem repreender
  rationale: A tradução preserva a afirmação de que Deus não envergonha nem recrimina quem lhe pede, enquanto a nota registra uma alternativa idiomática mais vívida.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A construção «pedir algo a Deus» segue o uso idiomático do português; «ela» retoma explicitamente «sabedoria». Todos os marcadores das notas aparecem no texto.
