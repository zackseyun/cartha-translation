id: JAS.1.4
reference: James 1:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ δὲ ὑπομονὴ ἔργον τέλειον ἐχέτω, ἵνα ἦτε τέλειοι καὶ ὁλόκληροι, ἐν μηδενὶ λειπόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/004.yaml
  text: And let endurance have its perfect work[a], so that you may be mature and complete, lacking in nothing.
translation:
  language: pt
  text: E deixem que a perseverança realize plenamente a sua obra[a], para que vocês sejam maduros e completos, sem lhes faltar coisa alguma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “complete a sua obra”; a expressão grega descreve uma obra levada ao seu fim ou resultado pretendido.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴ
  choice: perseverança
  rationale: Designa a firme persistência em meio às provações. “Perseverança” é natural em português e comunica melhor uma constância ativa do que “paciência”, que pode soar passiva.
- source_word: ἔργον τέλειον ἐχέτω
  choice: deixem que ... realize plenamente a sua obra
  rationale: A construção imperativa pede que a perseverança leve sua atuação ao resultado pretendido. A formulação evita o pouco natural “tenha uma obra perfeita”, mas conserva tanto a ideia de obra quanto a de completude.
- source_word: ἵνα ἦτε
  choice: para que vocês sejam
  rationale: Expressa de modo claro a finalidade ou o resultado visado, preservando a referência plural aos leitores.
- source_word: τέλειοι
  choice: maduros
  rationale: Aplicado a pessoas neste contexto, o termo aponta para aquilo que chegou ao desenvolvimento pretendido. “Maduros” evita impor a ideia de impecabilidade absoluta sem eliminar a noção de plenitude.
- source_word: ὁλόκληροι
  choice: íntegros
  rationale: Ressalta inteireza e integridade em todas as partes. “Íntegros” distingue o termo de τέλειοι e forma uma combinação natural com “maduros”.
- source_word: ἐν μηδενὶ λειπόμενοι
  choice: sem lhes faltar coisa alguma
  rationale: 'Reproduz de maneira idiomática a abrangência da expressão grega: não estar em falta em aspecto algum.'
- source_word: δὲ
  choice: E
  rationale: Aqui a conjunção dá continuidade ao raciocínio do versículo anterior, sem exigir contraste forte.
theological_decisions:
- issue: Sentido de τέλειοι no contexto da formação espiritual
  choice: maduros
  alternative: perfeitos
  rationale: 'O contexto apresenta o resultado pretendido da perseverança: desenvolvimento pleno e inteireza. “Maduros” mantém essa força exortativa sem decidir que o texto ensina impecabilidade absoluta.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A redação privilegia naturalidade sem apagar a relação entre maturidade, inteireza e ausência de deficiência.
