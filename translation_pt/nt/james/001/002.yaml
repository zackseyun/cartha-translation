  text: Πᾶσαν χαρὰν ἡγήσασθε, ἀδελφοί μου, ὅταν πειρασμοῖς περιπέσητε ποικίλοις,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/002.yaml
  text: Consider it all joy[a], my brothers, whenever you fall into various trials[b],
translation:
  language: pt
  text: Considerem motivo de plena alegria, meus irmãos[a], sempre que se depararem com diversas provações[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “meus irmãos”; neste tipo de vocativo, o masculino plural provavelmente se dirige a toda a comunidade de fiéis.
    reason: alternative_reading
  - marker: b
    text: A palavra grega pode significar “provações”, “testes” ou, em alguns contextos, “tentações”. Aqui, refere-se mais provavelmente a dificuldades que põem a fé à prova.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσαν χαρὰν
  choice: motivo de plena alegria
  rationale: A expressão funciona como complemento predicativo de ἡγήσασθε. Em português, “considerar motivo de plena alegria” transmite naturalmente a avaliação exigida pelo imperativo e evita o pouco idiomático “considerar tudo alegria”.
- source_word: ἡγήσασθε
  choice: Considerem
  rationale: 'O imperativo aoristo plural de ἡγέομαι pede uma avaliação consciente: considerar, julgar ou ter por. “Considerem” preserva com clareza a força imperativa.'
- source_word: ἀδελφοί μου
  choice: meus irmãos e irmãs
  rationale: No vocativo epistolar, o masculino plural pode dirigir-se à comunidade inteira. A formulação inclusiva explicita em português atual os destinatários prováveis, enquanto a forma mais literal é registrada em nota.
- source_word: ὅταν
  choice: quando
  rationale: Com o subjuntivo περιπέσητε, ὅταν tem valor temporal indefinido, “quando” ou “sempre que”. Neste contexto proverbial, “quando” é natural e não implica que a situação ocorra apenas uma vez.
- source_word: πειρασμοῖς
  choice: provações
  rationale: O contexto imediato aponta para adversidades que põem a fé à prova, não principalmente para incentivos interiores ao pecado. “Provações” preserva essa ideia, e a amplitude lexical é indicada em nota.
- source_word: περιπέσητε
  choice: passarem por
  rationale: Embora o verbo possa significar literalmente “cair em”, aqui descreve encontrar-se cercado por diversas provações. “Passarem por” é uma expressão corrente e digna em português, sem sugerir culpa moral.
- source_word: ποικίλοις
  choice: de vários tipos
  rationale: O adjetivo indica variedade ou diversidade. “De vários tipos” expressa isso com clareza em linguagem comum.
theological_decisions:
- issue: Alcance inclusivo de ἀδελφοί no vocativo epistolar
  choice: “meus irmãos e irmãs” no texto principal, com a forma gramatical literal em nota
  alternative: “meus irmãos” no texto principal, com a abrangência inclusiva em nota
  rationale: O masculino plural grego é a forma lexical usada, mas, neste tipo de endereço comunitário, provavelmente inclui homens e mulheres. O português explícito evita que leitores modernos entendam o chamado como restrito aos homens, sem ocultar a forma do original.
- issue: Sentido de πειρασμοῖς neste contexto
  choice: provações externas que testam a fé
  alternative: tentações morais
  rationale: Os versículos 3–4 explicam que essas experiências produzem perseverança, ao passo que 1:13–14 distingue a tentação moral. Ainda assim, a amplitude do termo grego é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação evita arcaísmos e conserva a tensão lexical por meio das notas.
