  text: κατενόησεν γὰρ ἑαυτὸν καὶ ἀπελήλυθεν καὶ εὐθέως ἐπελάθετο ὁποῖος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/024.yaml
  text: For he looked at himself and went away[a], and immediately forgot what kind of person he was.
translation:
  language: pt
  text: Pois a pessoa olhou para si mesma, foi embora[a] e imediatamente esqueceu como era.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que tipo de pessoa era”. A expressão grega se refere ao tipo ou à qualidade da pessoa que era.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατενόησεν
  choice: olha para
  rationale: No contexto concreto do espelho, κατανοέω indica observar ou contemplar. “Olha para” é natural em português e mantém a ironia de uma observação que não produz lembrança duradoura.
- source_word: γὰρ
  choice: Pois
  rationale: γάρ introduz a explicação da comparação anterior. “Pois” preserva de modo claro e digno essa ligação explicativa.
- source_word: ἑαυτὸν
  choice: si mesma
  rationale: O pronome reflexivo significa literalmente “a si mesmo”. Como o exemplo tem alcance genérico, a formulação concorda com “a pessoa” sem acrescentar “rosto”, que não aparece neste versículo.
- source_word: ἀπελήλυθεν
  choice: vai embora
  rationale: Embora seja uma forma perfeita de ἀπέρχομαι, integra uma sequência vívida de ações. O presente em português acompanha naturalmente “olha” e “esquece” na descrição proverbial.
- source_word: εὐθέως
  choice: imediatamente
  rationale: Preserva diretamente a ideia de prontidão expressa por εὐθέως.
- source_word: ἐπελάθετο
  choice: esquece
  rationale: É o equivalente corrente e direto de ἐπιλανθάνομαι neste contexto.
- source_word: ὁποῖος ἦν
  choice: como era
  rationale: ὁποῖος descreve qualidade ou aspecto. “Como era” preserva essa noção e se ajusta naturalmente à imagem de alguém que acabou de se observar no espelho.
theological_decisions:
- issue: Masculino genérico na analogia do espelho
  choice: a pessoa ... si mesma ... como era
  alternative: ele ... a si mesmo ... que tipo de pessoa era
  rationale: O masculino singular grego apresenta um exemplo representativo, não limitado aos homens. “A pessoa” comunica o alcance genérico com naturalidade, sem alterar o sentido da analogia.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sequência no presente dá à comparação caráter vívido e proverbial, embora os verbos gregos estejam em formas passadas; a relação temporal e lógica permanece intacta.
