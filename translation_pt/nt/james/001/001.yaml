id: JAS.1.1
reference: James 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰάκωβος θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ δοῦλος ταῖς δώδεκα φυλαῖς ταῖς ἐν τῇ διασπορᾷ χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/001.yaml
  text: 'James[a], a slave of God and of the Lord Jesus the Messiah[c][b], to the twelve tribes in the Dispersion: greetings.'
translation:
  language: pt
  text: 'Tiago[a], escravo[b] de Deus e do Senhor Jesus, o Messias[c], às doze tribos que vivem na Dispersão[d]: saudações.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Jacó”. O nome grego Ἰάκωβος corresponde historicamente a Jacó, mas “Tiago” é a forma tradicional em português para o autor desta carta.
    reason: lexical_alternative
  - marker: b
    text: Ou “servo”. O grego δοῦλος designa alguém que pertence a um senhor; “escravo” preserva aqui esse sentido mais forte.
    reason: lexical_alternative
  - marker: c
    text: Ou “Jesus Cristo”. O título grego Χριστός pode ser traduzido como “Messias” ou, no uso mais semelhante a um nome, como “Cristo”.
    reason: alternative_reading
  - marker: d
    text: “Dispersão” era uma designação dos judeus que viviam fora da terra de Israel.
    reason: cultural_note
lexical_decisions:
- source_word: Ἰάκωβος
  choice: Tiago
  rationale: É a forma tradicional e amplamente reconhecida em português para o autor desta carta, embora o nome grego corresponda historicamente a Jacó.
- source_word: θεοῦ
  choice: de Deus
  rationale: Reproduz diretamente o genitivo possessivo ligado a δοῦλος, sem ampliação interpretativa.
- source_word: κυρίου
  choice: Senhor
  rationale: Preserva o título cristológico estabelecido e a ideia de autoridade expressa por κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título, em vez de tratá-lo apenas como parte de um nome; o artigo torna a expressão titular idiomática em português.
- source_word: δοῦλος
  choice: escravo
  rationale: Conserva o sentido forte de pertencimento e sujeição a um senhor presente no termo grego; a alternativa menos forte é indicada em nota.
- source_word: ταῖς δώδεκα φυλαῖς
  choice: às doze tribos
  rationale: Mantém a linguagem israelita e a construção dativa de destinatário.
- source_word: ταῖς ἐν τῇ διασπορᾷ
  choice: que vivem na Dispersão
  rationale: Expressa em português natural a construção atributiva grega e preserva o uso judaico semitécnico de διασπορά.
- source_word: χαίρειν
  choice: saudações
  rationale: Traduz a fórmula epistolar grega de abertura, evitando o literalismo inadequado de 'alegrar-se'.
theological_decisions:
- issue: Valor titular de Χριστοῦ
  choice: o Messias
  alternative: Cristo
  rationale: A tradução explicita o sentido do título grego sem negar que 'Cristo' seja a forma tradicional e mais semelhante a um nome em português.
- issue: Força de δοῦλος na autoidentificação de Tiago
  choice: escravo
  alternative: servo
  rationale: A escolha preserva a noção de pertencimento total a Deus e ao Senhor Jesus, enquanto a nota registra a alternativa tradicional de registro mais brando.
- issue: Referente das doze tribos na Dispersão
  choice: preservar a formulação israelita sem identificar explicitamente os destinatários
  alternative: parafrasear como os judeus que vivem fora da terra de Israel
  rationale: O texto pode evocar tanto comunidades judaicas dispersas quanto uma aplicação teológica mais ampla; a tradução não resolve essa tensão, e a nota explica apenas o pano de fundo histórico da expressão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem e a concisão da saudação epistolar foram preservadas, mas a construção atributiva foi vertida naturalmente como “que vivem na Dispersão”. A pontuação distingue “o Messias” como título de Jesus.
