id: JAS.1.25
reference: James 1:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ παρακύψας εἰς νόμον τέλειον τὸν τῆς ἐλευθερίας καὶ παραμείνας, ⸀οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος ἀλλὰ ποιητὴς ἔργου, οὗτος μακάριος ἐν τῇ ποιήσει αὐτοῦ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/025.yaml
  text: But the one who has looked intently into the perfect law[a], the law of freedom[c][b], and has continued in it—not becoming a forgetful hearer but a doer of the work—this one will be blessed in his doing.
translation:
  language: pt
  text: Mas quem examina atentamente a lei perfeita, a lei da liberdade, e nela permanece — não como ouvinte que se esquece, mas como praticante da ação[a] — será abençoado em seu agir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “praticante de ação” ou “praticante de obra”; também pode ser entendido como “alguém que age”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: examina atentamente
  rationale: O verbo evoca inclinar-se para olhar de perto e, neste contexto, uma atenção cuidadosa; “examina atentamente” preserva essa intensidade em português natural.
- source_word: νόμον τέλειον τὸν τῆς ἐλευθερίας
  choice: a lei perfeita, a lei da liberdade
  rationale: A repetição de “lei” preserva a estrutura apositiva do grego e mantém aberta a relação teológica entre lei e liberdade.
- source_word: παραμείνας
  choice: nela permanece
  rationale: Expressa continuidade e perseverança em relação à lei mencionada, sem acrescentar uma nuance denominacional de obediência específica.
- source_word: οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος
  choice: não como ouvinte que se esquece
  rationale: Traduz de modo idiomático o genitivo incomum “de esquecimento”, preservando o contraste entre ouvir e praticar.
- source_word: ποιητὴς ἔργου
  choice: praticante da obra
  rationale: Mantém explicitamente ἔργου (“obra”, “ação”) e a ligação lexical com o ato de fazer, embora a expressão grega admita formulações mais idiomáticas.
- source_word: μακάριος
  choice: feliz
  rationale: Neste enunciado de bem-aventurança, “feliz” comunica de modo atual o estado favorável concedido por Deus, sem reduzi-lo a uma emoção passageira.
- source_word: ἐν τῇ ποιήσει αὐτοῦ
  choice: naquilo que faz
  rationale: Formulação portuguesa natural para “em seu fazer”, mantendo a ênfase no agir concreto e a ligação semântica com “praticante”.
- source_word: ὁ ... οὗτος
  choice: quem ... será
  rationale: O relativo indefinido “quem” transmite o singular representativo e genérico sem restringir a referência aos homens.
theological_decisions:
- issue: Sentido de “lei da liberdade”
  choice: Preservar a expressão “a lei da liberdade” sem explicar sua referência.
  alternative: “a lei que dá liberdade” ou uma identificação explícita com o evangelho ou com a lei moral
  rationale: O grego não resolve se a ênfase recai sobre o evangelho, sobre a instrução divina cumprida ou sobre a lei moral; a formulação mantém essa tensão.
- issue: Natureza da bênção expressa por μακάριος
  choice: “será feliz”
  alternative: “será abençoado” ou “será bem-aventurado”
  rationale: “Feliz” é compreensível e adequado à fórmula de bem-aventurança, sem especificar indevidamente se a bênção é apenas presente, material ou escatológica.
- issue: Referência humana no masculino singular grego
  choice: Usar o genérico singular “quem”.
  alternative: “o homem que” ou “aquele que”
  rationale: A construção é representativa, não exclusivamente masculina; “quem” preserva sua aplicação geral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação realça o contraste entre o ouvinte esquecido e quem pratica, e a única nota registra a expressão grega incomum sem sobrecarregar o versículo.
