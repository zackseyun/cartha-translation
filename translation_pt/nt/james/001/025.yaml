revisions:
- from: Mas quem examina atentamente a lei perfeita, a lei da liberdade, e nela permanece — não como ouvinte que se esquece, mas como praticante da obra[a] — será feliz naquilo que faz.
  to: Mas quem examina atentamente a lei perfeita, a lei da liberdade, e nela permanece — não como ouvinte que se esquece, mas como praticante da ação[a] — será abençoado em seu agir.
  rationale: A revisão elimina o artigo definido indevidamente introduzido em «da obra», conserva a distinção lexical de ἔργου em relação ao contexto de ouvir, e substitui «feliz» por «abençoado» para refletir com maior precisão o registro de μακάριος. As demais escolhas são fiéis, naturais e preservam as ambiguidades teológicas do texto.
