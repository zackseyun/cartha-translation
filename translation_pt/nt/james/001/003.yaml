id: JAS.1.3
reference: James 1:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: γινώσκοντες ὅτι τὸ δοκίμιον ὑμῶν τῆς πίστεως κατεργάζεται ὑπομονήν·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/003.yaml
  text: because you know that the testing of your faith produces endurance[a][b].
translation:
  language: pt
  text: pois vocês sabem que a provação da sua fé produz perseverança[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a genuinidade comprovada da sua fé». O termo grego pode indicar tanto o processo de pôr à prova quanto a qualidade revelada pela prova.
    reason: lexical_alternative
  - marker: b
    text: Ou «constância» ou «firmeza».
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκοντες
  choice: pois vocês sabem
  rationale: 'O particípio presente liga-se ao contexto imperativo do versículo 2 e tem valor causal: os leitores podem considerar as provações motivo de alegria porque sabem qual resultado elas produzem.'
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo daquilo que os leitores sabem; o valor causal já está expresso por «pois».
- source_word: τὸ δοκίμιον
  choice: a provação
  rationale: O termo pode designar tanto o processo de pôr à prova quanto a genuinidade comprovada. «Provação» é natural no contexto imediato de dificuldades, sem eliminar a alternativa resultativa, registrada em nota.
- source_word: ὑμῶν τῆς πίστεως
  choice: da sua fé
  rationale: A construção genitiva indica que a fé dos leitores é submetida à prova. «Fé» é a opção clara e tradicional neste contexto.
- source_word: κατεργάζεται
  choice: produz
  rationale: Expressa de modo direto e atual que a provação efetua ou gera determinado resultado.
- source_word: ὑπομονήν
  choice: perseverança
  rationale: Comunica a constância ativa diante de dificuldades. É corrente e compreensível em português, enquanto «resistência» poderia sugerir sobretudo capacidade passiva.
theological_decisions:
- issue: Sentido de πίστις
  choice: fé
  alternative: confiança; fidelidade
  rationale: Neste contexto, o termo se refere à fé dos leitores submetida à prova. «Fé» preserva a amplitude do grego sem impor a ideia mais específica de fidelidade.
- issue: Sentido de δοκίμιον
  choice: processo de provação
  alternative: genuinidade comprovada
  rationale: O contexto das provações favorece o processo pelo qual a fé é testada, mas o substantivo grego também pode apontar para a qualidade comprovada pelo teste; essa ambiguidade genuína é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural «vocês» torna explícito o referente plural do grego. «Pois» mantém a ligação causal com o versículo anterior, e as notas preservam as alternativas lexicais reais.
