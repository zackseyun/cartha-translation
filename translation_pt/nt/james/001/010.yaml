reference: James 1:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ πλούσιος ἐν τῇ ταπεινώσει αὐτοῦ, ὅτι ὡς ἄνθος χόρτου παρελεύσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/010.yaml
  text: and the rich man in his humiliation[b][a], because like a flower of grass he will pass away.
translation:
  language: pt
  text: e o rico, em sua humilhação[a], porque passará como a flor da erva[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, suprindo a elipse com base no versículo anterior: “mas o rico glorie-se em sua humilhação”.'
    reason: alternative_reading
  - marker: b
    text: “Flor da erva” traduz literalmente a imagem grega e ressalta como o rico desaparece depressa, à semelhança da vegetação em flor.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλούσιος
  choice: e o rico
  rationale: O artigo com o adjetivo substantivado designa o homem rico, enquanto δέ mantém a ligação com a exortação paralela do versículo anterior. “E” preserva essa continuidade sem acentuar excessivamente o contraste.
- source_word: ἐν τῇ ταπεινώσει αὐτοῦ
  choice: em sua humilhação
  rationale: ταπείνωσις pode indicar rebaixamento, condição humilde ou humilhação. Aqui, a explicação sobre a transitoriedade do rico favorece a ideia de ser rebaixado, não apenas a virtude interior da humildade.
- source_word: ὅτι
  choice: porque
  rationale: 'Introduz diretamente a razão para o rico gloriar-se em sua humilhação: sua condição e sua vida são passageiras.'
- source_word: ὡς ἄνθος χόρτου
  choice: como a flor da erva
  rationale: A formulação conserva a imagem concreta e a construção genitiva do grego, além de sua ressonância bíblica, sem acrescentar “campo” nem substituir a expressão por uma espécie específica de flor.
- source_word: παρελεύσεται
  choice: passará
  rationale: O futuro de παρέρχομαι expressa aqui transitoriedade e desaparecimento. “Passará” é conciso, natural e mantém aberta a abrangência da imagem, que pode incluir tanto a posição do rico quanto sua própria vida.
theological_decisions:
- issue: Elipse do verbo do versículo anterior
  choice: Manter no texto a construção elíptica, sem repetir “glorie-se”.
  alternative: 'Explicitar: “mas o rico glorie-se em sua humilhação”.'
  rationale: O grego depende sintaticamente da exortação do versículo 9, mas não repete o verbo. Preservar a elipse mantém a tradução auditável e deixa a alternativa explícita em nota.
- issue: Sentido da humilhação do rico
  choice: Entender a expressão como o rebaixamento do rico diante da transitoriedade de sua condição e de sua vida.
  alternative: Entendê-la principalmente como humildade voluntária ou apenas como baixa posição social.
  rationale: A oração causal que segue aponta para a efemeridade do rico. A tradução conserva a tensão sem impor uma explicação doutrinária mais ampla.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe fragmentária é intencional, pois reproduz a dependência do versículo anterior. “Flor da erva” é menos idiomático, mas preserva a imagem bíblica do original; a nota esclarece sua força.
