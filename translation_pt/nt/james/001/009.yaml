translation:
  language: pt
  text: Mas o irmão de condição humilde se glorie em sua exaltação[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o irmão ou a irmã de posição social baixa”. O grego traz o masculino singular “irmão”, que pode representar qualquer pessoa da comunidade de fé.
    reason: lexical_alternative
  - marker: b
    text: Ou “em sua posição elevada”. A expressão pode se referir à condição honrosa da pessoa humilde diante de Deus, possivelmente incluindo uma inversão presente e futura.
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχάσθω
  choice: se glorie
  rationale: O imperativo presente médio pede uma exortação. “Gloriar-se” preserva a força de καυχάομαι e, pelo complemento, deixa claro que não se trata de autoexaltação.
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição com leve contraste e introduz o contraste entre a pessoa de condição humilde e o rico nos versículos 9–10.
- source_word: ὁ ἀδελφὸς
  choice: o irmão
  rationale: Preserva o masculino singular do grego e o uso comunitário de ἀδελφός para um irmão na fé; a possível função representativa é indicada em nota.
- source_word: ὁ ταπεινὸς
  choice: de condição humilde
  rationale: Expressa posição social baixa sem limitar o sentido exclusivamente à pobreza econômica nem à virtude interior da humildade.
- source_word: ἐν τῷ ὕψει αὐτοῦ
  choice: em sua exaltação
  rationale: “Exaltação” preserva a imagem de altura e a inversão de condição sugerida pelo contexto, sem decidir se ela é presente, futura, social ou espiritual.
theological_decisions:
- issue: Sentido da “exaltação” do irmão de condição humilde
  choice: Manter “exaltação” como a dignidade ou condição elevada que lhe cabe diante de Deus, com possíveis dimensões presentes e futuras.
  alternative: Interpretar especificamente como ascensão social presente, condição espiritual diante de Deus ou exaltação escatológica futura.
  rationale: O contraste com o rico e a linguagem de inversão nos versículos 9–10 sustentam mais de uma dimensão; a tradução não deve restringir a expressão a apenas uma delas.
- issue: Gênero de ἀδελφός
  choice: Traduzir no texto principal por “irmão”.
  alternative: “irmão ou irmã” ou “pessoa que crê”.
  rationale: A forma grega é masculina singular, embora possa representar qualquer membro da comunidade cristã; a nota preserva essa possível abrangência.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “De condição humilde” soa mais natural que “humilde” substantivado e preserva a dimensão social de ταπεινός; “se glorie” mantém a força lexical e o tom exortativo.
