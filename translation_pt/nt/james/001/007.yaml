  text: μὴ γὰρ οἰέσθω ὁ ἄνθρωπος ἐκεῖνος ὅτι λήμψεταί τι παρὰ τοῦ κυρίου
base_translation:
  language: en
  yaml_path: translation/nt/james/001/007.yaml
  text: For that man must not suppose that he will receive anything from the Lord,[a]
translation:
  language: pt
  text: Pois esse homem não pense que receberá alguma coisa do Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “essa pessoa”. O grego está no masculino singular (“esse homem”), mas se refere de modo representativo ao indivíduo que duvida, descrito no versículo anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γὰρ
  choice: Pois ... não pense
  rationale: γάρ estabelece a explicação ligada ao versículo anterior; «pois» preserva essa conexão. μή com o imperativo de terceira pessoa é expresso naturalmente pela construção proibitiva «não pense».
- source_word: οἰέσθω
  choice: pense
  rationale: οἴομαι significa pensar ou supor. «Pense» é corrente e digno em português e mantém o ato mental sem transformá-lo em mera expectativa.
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: esse homem
  rationale: A expressão grega é masculina singular e retoma o indivíduo que duvida no contexto anterior. «Esse homem» conserva tanto a forma quanto a referência discursiva; a função representativa é esclarecida em nota.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo do pensamento e é naturalmente conservado em português.
- source_word: λήμψεταί
  choice: receberá
  rationale: Futuro de λαμβάνω; «receberá» transmite com precisão a ação e combina naturalmente com a indicação de fonte.
- source_word: τι
  choice: alguma coisa
  rationale: Sob o alcance da negação de «não pense», «alguma coisa» produz em português o sentido de que não deve supor que receberá coisa alguma.
- source_word: παρὰ τοῦ κυρίου
  choice: do Senhor
  rationale: παρά com genitivo indica origem ou fonte. «Do Senhor» é a formulação portuguesa natural e mantém κύριος como título sem explicitar além do texto quem é seu referente.
theological_decisions:
- issue: Referente de τοῦ κυρίου
  choice: o Senhor
  alternative: Deus; o Senhor Deus
  rationale: O grego emprega κύριος sem especificação adicional. «O Senhor» preserva a formulação e a possível tensão referencial, sem inserir uma identificação mais explícita.
- issue: Gênero e função representativa de ὁ ἄνθρωπος ἐκεῖνος
  choice: esse homem
  alternative: essa pessoa; esse indivíduo
  rationale: A expressão é masculina singular no grego. A tradução conserva essa marca, enquanto a nota esclarece que o homem mencionado representa qualquer indivíduo que duvida conforme o versículo anterior.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção «não pense» preserva de modo natural a força proibitiva; «alguma coisa» evita rigidez excessiva, e «Senhor» mantém o título sem interpretação adicional.
