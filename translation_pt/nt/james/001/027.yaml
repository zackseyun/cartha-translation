id: JAS.1.27
reference: James 1:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: θρησκεία καθαρὰ καὶ ἀμίαντος παρὰ ⸀τῷ θεῷ καὶ πατρὶ αὕτη ἐστίν, ἐπισκέπτεσθαι ὀρφανοὺς καὶ χήρας ἐν τῇ θλίψει αὐτῶν, ἄσπιλον ἑαυτὸν τηρεῖν ἀπὸ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/027.yaml
  text: 'Religion that is pure and undefiled before God the Father is this: to care for orphans and widows in their affliction[b][a], and to keep oneself unstained from the world.'
translation:
  language: pt
  text: 'A religião pura e sem mácula diante de Deus, o Pai, é esta: cuidar dos órfãos e das viúvas em sua aflição[a] e manter-se sem mancha do mundo[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “visitar os órfãos e as viúvas em sua aflição”; o verbo grego pode incluir tanto visitá-los como prestar-lhes cuidado ativo.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “o mundo” se refere à ordem moralmente corrompida que se opõe a Deus, não à criação em si.
    reason: cultural_note
lexical_decisions:
- source_word: θρησκεία
  choice: religião
  rationale: O termo se refere à prática ou devoção religiosa manifesta, não apenas à fé interior. “Religião” é natural em português e preserva o foco de Tiago na piedade vivida.
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: pura e sem mácula
  rationale: A combinação preserva o paralelismo enfático e as conotações morais e cultuais dos dois adjetivos, em linguagem digna e compreensível.
- source_word: παρὰ τῷ θεῷ καὶ πατρὶ
  choice: diante de Deus, o Pai
  rationale: παρά com o dativo indica avaliação perante alguém. A formulação entende θεῷ e πατρὶ como referência ao mesmo ser e evita sugerir dois referentes distintos.
- source_word: ἐπισκέπτεσθαι
  choice: cuidar
  rationale: Neste contexto, o verbo envolve atenção prática e auxílio, não uma visita meramente social. A nota preserva a tradução mais literal “visitar” e sua amplitude semântica.
- source_word: ὀρφανοὺς καὶ χήρας
  choice: dos órfãos e das viúvas
  rationale: Equivalentes diretos e correntes para os grupos socialmente vulneráveis mencionados no texto.
- source_word: ἐν τῇ θλίψει αὐτῶν
  choice: em sua aflição
  rationale: “Aflição” conserva a gravidade de θλῖψις, que pode envolver sofrimento, angústia e adversidade.
- source_word: ἄσπιλον ἑαυτὸν τηρεῖν
  choice: manter-se sem mancha
  rationale: A expressão conserva a imagem de evitar contaminação moral e comunica naturalmente o sentido genérico de ἑαυτόν.
- source_word: ἀπὸ τοῦ κόσμου
  choice: do mundo
  rationale: Mantém a expressão concisa e teologicamente carregada do grego, sem substituir o texto por uma explicação interpretativa.
theological_decisions:
- issue: Sentido ético de κόσμος
  choice: Manter “o mundo” no texto principal, entendido no contexto como a ordem moralmente corrompida e contrária a Deus.
  alternative: “a corrupção do mundo” ou “a ordem deste mundo”
  rationale: A explicitação no corpo do versículo estreitaria a expressão além do que o grego diz. A nota evita que ela seja confundida com a criação material em si, sem eliminar a tensão teológica.
- issue: Força genérica de ἑαυτὸν
  choice: Usar a construção impessoal “manter-se”.
  alternative: “manter a si mesmo” ou uma forma explicitamente masculina
  rationale: Embora a forma grega seja masculina singular, a máxima se aplica genericamente. A construção portuguesa comunica essa abrangência sem alterar o sentido.
- issue: Relação entre θεῷ e πατρὶ
  choice: Traduzir “Deus, o Pai” como títulos do mesmo referente.
  alternative: “Deus e Pai”
  rationale: A construção grega com um só artigo favorece a leitura apositiva, embora “Deus e Pai” seja formalmente possível. A vírgula torna a relação clara em português sem acrescentar “nosso”, ausente do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e acessível. “Sem mácula” preserva a tonalidade moral e cultual sem recorrer a sintaxe arcaica; “manter-se” expressa de modo conciso a máxima de alcance geral.
