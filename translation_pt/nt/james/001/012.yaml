id: JAS.1.12
reference: James 1:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν, ὅτι δόκιμος γενόμενος λήμψεται τὸν στέφανον τῆς ζωῆς, ὃν ⸀ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/012.yaml
  text: Blessed is the man who endures trial[a], because after he has been approved, he will receive the crown of life[b], which he promised to those who love him.
translation:
  language: pt
  text: Feliz o homem que persevera na provação[a], porque, depois de ser aprovado, receberá a coroa da vida[b], que ele prometeu aos que o amam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tentação» ou «teste»; a palavra grega pode abranger tanto uma provação quanto uma tentação, mas aqui o contexto destaca a perseverança durante a prova.
    reason: lexical_alternative
  - marker: b
    text: A palavra grega traduzida por «coroa» pode se referir à coroa de vitória dada ao vencedor, e não necessariamente a uma coroa real.
    reason: cultural_note
lexical_decisions:
- source_word: Μακάριος
  choice: Feliz
  rationale: Em português bíblico atual, «Feliz» introduz naturalmente uma bem-aventurança e descreve a condição favorecida por Deus, sem se limitar a uma emoção passageira.
- source_word: ἀνὴρ
  choice: o homem
  rationale: Preserva o substantivo masculino singular do grego, empregado aqui de modo representativo.
- source_word: ὑπομένει
  choice: persevera
  rationale: Expressa constância e resistência continuada sob pressão; é mais natural aqui do que uma formulação pesada como «permanece firme debaixo de».
- source_word: πειρασμόν
  choice: provação
  rationale: O contexto imediato destaca suportar uma experiência que põe a pessoa à prova. A nota conserva o alcance semântico que também pode incluir tentação.
- source_word: δόκιμος γενόμενος
  choice: depois de ser aprovado
  rationale: Comunica tanto a relação temporal do particípio quanto o resultado positivo de ter passado pela prova.
- source_word: λήμψεται
  choice: receberá
  rationale: Reproduz diretamente o futuro e se ajusta à ideia de uma recompensa prometida.
- source_word: στέφανον
  choice: coroa
  rationale: É a equivalência tradicional e inteligível; uma nota esclarece que o termo pode designar a coroa de vitória, não necessariamente uma coroa real.
- source_word: τῆς ζωῆς
  choice: da vida
  rationale: Mantém o genitivo grego sem decidir se a vida constitui a coroa ou é o prêmio associado a ela.
- source_word: ἐπηγγείλατο
  choice: ele prometeu
  rationale: Representa o aoristo com o pretérito perfeito. O pronome preserva a referência implícita do grego, naturalmente entendida como Deus no contexto.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: aos que o amam
  rationale: Traduz naturalmente o dativo e o particípio presente, que caracteriza aqueles que amam a Deus.
theological_decisions:
- issue: Sentido de πειρασμός em Tiago 1:12
  choice: provação
  alternative: tentação ou teste
  rationale: A perseverança, a aprovação e a recompensa salientam aqui uma situação de prova suportada com fidelidade. A nota evita eliminar a amplitude lexical do termo, especialmente relevante no contexto mais amplo do capítulo.
- issue: Relação expressa por τῆς ζωῆς
  choice: da vida
  alternative: que é a vida ou que dá vida
  rationale: A formulação genitiva preserva a concisão e a possível ambiguidade do original, sem impor uma explicação identificativa ou resultativa.
- issue: Referente do sujeito de ἐπηγγείλατο
  choice: ele, entendido contextualmente como Deus
  alternative: explicitar «Deus prometeu»
  rationale: O grego não nomeia o sujeito nesta oração. Manter «ele» evita acrescentar um nome ao texto, embora o contexto indique naturalmente Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, preservando a estrutura de bem-aventurança e as ambiguidades relevantes do grego.
