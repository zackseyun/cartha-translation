  text: ἕκαστος δὲ πειράζεται ὑπὸ τῆς ἰδίας ἐπιθυμίας ἐξελκόμενος καὶ δελεαζόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/014.yaml
  text: But each one is tempted by his own desire[b][a], being drawn away and enticed.
translation:
  language: pt
  text: Mas cada um é tentado pelo seu próprio desejo[a], sendo por ele arrastado e seduzido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pela sua própria cobiça” ou “pelo seu próprio anseio”. O termo grego pode indicar um desejo forte em sentido amplo, não apenas desejo sexual.
    reason: lexical_alternative
  - marker: b
    text: Os dois verbos evocam a imagem de alguém atraído para longe e engodado, como uma presa ou um peixe levado a uma armadilha.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: cada um
  rationale: Preserva a força distributiva e singular do grego em português natural.
- source_word: δὲ
  choice: Mas
  rationale: 'Marca o contraste moderado com o versículo anterior: Deus não tenta ninguém; cada pessoa é tentada pelo próprio desejo.'
- source_word: πειράζεται
  choice: é tentado
  rationale: Neste contexto, o verbo indica incitação ao pecado, e não simplesmente prova ou teste.
- source_word: ὑπὸ τῆς ἰδίας ἐπιθυμίας
  choice: pelo seu próprio desejo
  rationale: Expressa a fonte imediata da tentação e mantém a ênfase reflexiva de ἰδίας. “Desejo” é amplo e não restringe o sentido à esfera sexual.
- source_word: ἐξελκόμενος
  choice: sendo arrastado para fora
  rationale: Conserva a imagem de alguém ou algo puxado para fora, sem apagar a metáfora subjacente.
- source_word: καὶ δελεαζόμενος
  choice: e atraído pela isca
  rationale: Torna perceptível a imagem de uma isca usada para atrair a presa, presente no verbo grego, em linguagem clara e corrente.
theological_decisions:
- issue: Fonte da tentação em relação a Deus
  choice: A tentação é atribuída ao desejo próprio de cada pessoa, não a Deus.
  alternative: Entender o trecho apenas como referência neutra a provações externas.
  rationale: O contexto imediato de Tiago 1:13 nega que Deus tente alguém, enquanto 1:14 identifica o desejo pessoal como fonte próxima da tentação. A tradução preserva esse contraste sem formular uma doutrina mais abrangente de causalidade.
- issue: Singular representativo e gênero gramatical
  choice: “cada um” e “seu próprio”
  alternative: “cada pessoa” e “seus próprios desejos”
  rationale: A construção mantém o singular distributivo masculino do grego, que tem função representativa, e evita transformar o desejo singular em plural.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o contraste com o versículo anterior, o singular distributivo e a metáfora de caça ou pesca. Todos os marcadores de nota aparecem no texto principal.
