  source_fidelity: A oração principal reproduz corretamente o contraste com o versículo anterior, o singular distributivo e a atribuição da tentação ao desejo próprio. Contudo, «para fora» explicita de modo excessivamente literal um elemento que não soa natural em português, e «pela isca» introduz no texto principal um objeto que o grego apenas sugere metaforicamente por δελεαζόμενος.
  naturalness: «Sendo arrastado para fora e atraído pela isca» é pouco idiomático e torna a sequência de imagens pesada. «Sendo por ele arrastado e seduzido» é claro, moderno e preserva os dois particípios sem acrescentar um referente explícito para a isca.
  terminology: «Desejo» é uma boa tradução ampla de ἐπιθυμία neste contexto. «Seduzido» comunica adequadamente a ideia de aliciamento/engodo de δελεαζόμενος sem restringi-la ao âmbito sexual; a nota preserva a imagem cinegética ou de pesca.
