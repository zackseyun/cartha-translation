  text: Πᾶσα δόσις ἀγαθὴ καὶ πᾶν δώρημα τέλειον ἄνωθέν ἐστιν, καταβαῖνον ἀπὸ τοῦ πατρὸς τῶν φώτων, παρ’ ᾧ οὐκ ἔνι παραλλαγὴ ἢ τροπῆς ἀποσκίασμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/017.yaml
  text: Every good gift and every perfect gift is from above[a], coming down from the Father of lights[b], with whom there is no variation or shadow of turning.
translation:
  language: pt
  text: Toda boa dádiva[a] e todo dom perfeito vêm do alto, descendo do Pai das luzes, em quem não há variação nem sombra de mudança.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Todo ato de dar o que é bom”. O primeiro substantivo pode enfatizar o ato de dar, enquanto o segundo enfatiza aquilo que é dado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sombra produzida pela mudança” ou “sombra cambiante”. A expressão provavelmente alude às sombras que mudam com o movimento das luzes celestes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα δόσις ἀγαθὴ
  choice: Toda boa dádiva
  rationale: δόσις pode designar tanto o ato de dar quanto aquilo que é dado. “Dádiva” é natural em português e mantém a possibilidade do sentido concreto, enquanto a nota registra a nuance de ação.
- source_word: πᾶν δώρημα τέλειον
  choice: todo dom perfeito
  rationale: δώρημα enfatiza aquilo que é dado. “Dom” diferencia o termo de δόσις sem prejudicar o paralelismo; “perfeito” preserva a ideia de algo completo e plenamente bom.
- source_word: ἄνωθέν ἐστιν
  choice: vêm do alto
  rationale: “Do alto” expressa diretamente a origem indicada por ἄνωθεν. O plural verbal é exigido pela coordenação natural dos dois sujeitos em português.
- source_word: καταβαῖνον
  choice: descendo
  rationale: O particípio presente descreve o movimento a partir da origem divina. “Descendo” preserva de modo conciso a imagem espacial do grego.
- source_word: ἀπὸ τοῦ πατρὸς τῶν φώτων
  choice: do Pai das luzes
  rationale: A tradução mantém a metáfora genitiva e sua provável alusão às luzes celestes sem explicá-la no corpo do texto.
- source_word: παρ’ ᾧ
  choice: em quem
  rationale: A expressão indica relação ou presença junto de Deus. “Em quem” introduz de modo claro e idiomático a afirmação seguinte em português.
- source_word: οὐκ ἔνι παραλλαγὴ
  choice: não há variação
  rationale: A construção existencial é reproduzida naturalmente por “não há”; “variação” conserva a possível ligação com as mudanças observáveis nos astros.
- source_word: ἢ τροπῆς ἀποσκίασμα
  choice: nem sombra de mudança
  rationale: Depois da negação, “nem” coordena naturalmente os termos. A formulação preserva a imagem compacta e a relação genitiva ambígua do grego, sem determinar no texto principal exatamente como a mudança produz ou caracteriza a sombra.
theological_decisions:
- issue: A imagem do “Pai das luzes” e a constância divina
  choice: Manter tanto a metáfora cósmica quanto a afirmação de ausência de variação, sem convertê-las numa formulação doutrinária abstrata.
  alternative: Explicitar “luzes” como astros celestes ou resumir a oração final como “Deus nunca muda”.
  rationale: O texto contrasta o Pai, fonte das boas dádivas, com a mutabilidade associada às luzes e sombras criadas. A tradução conserva essa imagem e sua tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Dádiva” e “dom” mantêm a distinção lexical e o paralelismo; “Pai das luzes” e “sombra de mudança” preservam as imagens do original.
