id: JAS.1.13
reference: James 1:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μηδεὶς πειραζόμενος λεγέτω ὅτι Ἀπὸ θεοῦ πειράζομαι· ὁ γὰρ θεὸς ἀπείραστός ἐστιν κακῶν, πειράζει δὲ αὐτὸς οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/013.yaml
  text: Let no one who is being tempted say[a], “I am being tempted by God,” for God is untemptable by evil, and he himself tempts no one.
translation:
  language: pt
  text: 'Ninguém, ao ser tentado, diga: “Estou sendo tentado por Deus”, pois Deus não pode ser tentado pelo mal[a] e ele mesmo não tenta ninguém.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Deus é insuscetível às coisas más”. A expressão grega é rara e difícil; também pode ser entendida como “Deus não pode ser tentado por males”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς ... λεγέτω
  choice: Ninguém ... diga
  rationale: Reproduz de modo natural em português a proibição expressa pelo pronome indefinido negativo e pelo imperativo de terceira pessoa.
- source_word: πειραζόμενος
  choice: ao ser tentado
  rationale: Mantém o valor passivo e circunstancial do particípio presente; neste contexto, refere-se à sedução para o mal, não a uma prova em sentido amplo.
- source_word: Ἀπὸ θεοῦ πειράζομαι
  choice: Estou sendo tentado por Deus
  rationale: A construção com ἀπό indica aqui a origem ou agência alegada, expressa idiomaticamente por “por Deus”; a forma progressiva preserva o aspecto presente passivo.
- source_word: ἀπείραστός ἐστιν κακῶν
  choice: não pode ser tentado pelo mal
  rationale: 'Expressa em português claro o sentido contextual do adjetivo raro ἀπείραστος: Deus não é suscetível à tentação proveniente do mal. A nota registra uma alternativa mais literal que preserva a forma adjetival e o plural grego.'
- source_word: πειράζει
  choice: tenta
  rationale: O contexto de desejo, pecado e mal favorece “tentar”, no sentido de induzir ao mal, em vez do sentido mais amplo de “pôr à prova”.
- source_word: αὐτὸς οὐδένα
  choice: ele mesmo não tenta ninguém
  rationale: “Ele mesmo” preserva a ênfase do pronome αὐτός, e “ninguém” traduz diretamente o objeto negativo οὐδένα.
theological_decisions:
- issue: Sentido de πειράζω ao longo do versículo
  choice: Usar “tentar/ser tentado” em todas as ocorrências.
  alternative: Usar “provar/ser provado” em uma ou mais ocorrências.
  rationale: O contexto imediato trata da atração para o pecado e nega que Deus seja sua fonte. “Tentar” comunica esse sentido sem negar que, em outros contextos bíblicos, Deus possa pôr pessoas à prova.
- issue: Sentido de ἀπείραστός ἐστιν κακῶν
  choice: “Deus não pode ser tentado pelo mal”, com alternativa literal em nota.
  alternative: “Deus é insuscetível às coisas más” ou “Deus não tem experiência do mal”.
  rationale: A formulação escolhida representa a leitura contextual mais provável sem transformar a expressão rara em uma afirmação mais ampla sobre toda relação possível entre Deus e o mal. A nota conserva a dificuldade lexical e o plural do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe natural para leitores brasileiros. “Ao ser tentado” evita a construção pesada “quem está sendo tentado”, enquanto “ele mesmo” conserva a ênfase explícita do grego.
