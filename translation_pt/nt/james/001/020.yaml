  text: ὀργὴ γὰρ ἀνδρὸς δικαιοσύνην θεοῦ ⸂οὐκ ἐργάζεται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/020.yaml
  text: For a man's anger does not produce God's righteousness.
translation:
  language: pt
  text: Pois a ira humana não produz a justiça de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργὴ ἀνδρός
  choice: a ira humana
  rationale: Expressa de modo natural o valor genérico de ἀνήρ neste contexto, sem restringir a afirmação aos homens do sexo masculino.
- source_word: δικαιοσύνην θεοῦ
  choice: a justiça de Deus
  rationale: 'Preserva a construção genitiva e sua possível amplitude: a justiça que pertence a Deus, que ele requer ou que realiza.'
- source_word: οὐκ ἐργάζεται
  choice: não produz
  rationale: Transmite com clareza o sentido de realizar, efetuar ou produzir um resultado, adequado ao objeto δικαιοσύνην.
- source_word: γάρ
  choice: Pois
  rationale: Mantém a relação explicativa com a exortação do versículo anterior.
theological_decisions:
- issue: Sentido de δικαιοσύνη θεοῦ
  choice: a justiça de Deus
  alternative: a justiça que Deus requer
  rationale: A formulação escolhida conserva a ambiguidade genuína do genitivo, sem limitar a expressão apenas ao padrão moral exigido por Deus.
- issue: Referência genérica de ἀνδρός
  choice: humana
  alternative: de um homem
  rationale: No argumento, a ira é atribuída genericamente ao ser humano; “humana” comunica esse alcance sem introduzir uma distinção de gênero ausente do propósito do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A frase mantém a concisão e a relação causal do grego.
