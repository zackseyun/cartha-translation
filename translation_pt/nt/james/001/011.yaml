id: JAS.1.11
reference: James 1:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀνέτειλεν γὰρ ὁ ἥλιος σὺν τῷ καύσωνι καὶ ἐξήρανεν τὸν χόρτον, καὶ τὸ ἄνθος αὐτοῦ ἐξέπεσεν καὶ ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ ἀπώλετο· οὕτως καὶ ὁ πλούσιος ἐν ταῖς πορείαις αὐτοῦ μαρανθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/011.yaml
  text: For the sun rose with its scorching heat and dried up the grass[a], and its flower fell off and the beauty of its appearance perished[b]; so also the rich man will wither away in the midst of his pursuits.
translation:
  language: pt
  text: Pois o sol nasceu com seu calor abrasador[a] e secou a erva; sua flor caiu, e a beleza de seu aspecto desapareceu. Assim também o rico murchará em meio às suas atividades[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com o vento abrasador”; o grego καύσων pode se referir ao calor ardente e, em certos contextos, ao vento quente associado a ele.
    reason: lexical_alternative
  - marker: b
    text: Ou “em suas jornadas”. O termo grego pode se referir literalmente a viagens ou, de modo mais amplo, ao curso das atividades e dos empreendimentos de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέτειλεν
  choice: nasceu
  rationale: O aoristo apresenta de modo vívido o nascer do sol; “nasceu” é natural em português e conserva o valor passado.
- source_word: σὺν τῷ καύσωνι
  choice: com seu calor abrasador
  rationale: καύσων pode designar calor ardente ou o vento quente associado a ele. Como o sol é o sujeito, esta formulação é clara e natural, sem eliminar a alternativa lexical registrada em nota.
- source_word: ἐξήρανεν τὸν χόρτον
  choice: secou a erva
  rationale: Mantém a imagem concreta do efeito do calor sobre a vegetação; “erva” corresponde bem ao uso amplo de χόρτος.
- source_word: τὸ ἄνθος αὐτοῦ ἐξέπεσεν
  choice: a flor dela caiu
  rationale: Conserva o movimento físico expresso por ἐκπίπτω e explicita naturalmente em português que a flor pertence à erva.
- source_word: ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ
  choice: a beleza de sua aparência
  rationale: εὐπρέπεια indica beleza ou formosura, enquanto πρόσωπον, neste contexto vegetal, refere-se naturalmente ao aspecto exterior, não a um rosto literal.
- source_word: ἀπώλετο
  choice: desapareceu
  rationale: A forma expressa a perda ou desaparecimento da beleza; “desapareceu” comunica isso em português atual sem sugerir necessariamente destruição violenta.
- source_word: ὁ πλούσιος
  choice: o rico
  rationale: Preserva o masculino singular representativo do grego e soa mais natural e conciso em português do que “o homem rico”.
- source_word: ἐν ταῖς πορείαις αὐτοῦ
  choice: em meio às suas atividades
  rationale: πορεία pode indicar jornadas ou, por extensão, o curso das ações e ocupações de alguém. “Atividades” comunica o sentido contextual amplo, enquanto a leitura literal fica registrada em nota.
- source_word: μαρανθήσεται
  choice: murchará
  rationale: Mantém diretamente a metáfora vegetal e a afirmação futura da inevitável decadência do rico.
theological_decisions:
- issue: Referência masculina em ὁ πλούσιος
  choice: o rico
  alternative: a pessoa rica; aquele que é rico
  rationale: O masculino singular representativo do texto é conservado sem restringir a aplicação moral da advertência apenas aos homens.
- issue: Alcance de πορείαις na advertência ao rico
  choice: atividades
  alternative: jornadas; caminhos; empreendimentos
  rationale: O contexto aponta para o rico em pleno curso de suas ocupações, mas o sentido literal de deslocamentos permanece possível e é preservado em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva a sequência imagética do grego e usa “erva” no sentido coletivo. Os marcadores de nota aparecem imediatamente após os trechos aos quais se referem.
