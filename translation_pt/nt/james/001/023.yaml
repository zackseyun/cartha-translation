id: JAS.1.23
reference: James 1:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι εἴ τις ἀκροατὴς λόγου ἐστὶν καὶ οὐ ποιητής, οὗτος ἔοικεν ἀνδρὶ κατανοοῦντι τὸ πρόσωπον τῆς γενέσεως αὐτοῦ ἐν ἐσόπτρῳ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/023.yaml
  text: For if anyone is a hearer of the word and not a doer, this one is like a man carefully looking at the face of his birth[a] in a mirror,
translation:
  language: pt
  text: Pois, se alguém é ouvinte da palavra e não praticante, é semelhante a um homem que observa atentamente, num espelho, o rosto que lhe é natural desde o nascimento[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o rosto de seu nascimento”; isto é, seu rosto natural, com o qual nasceu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροατὴς
  choice: ouvinte
  rationale: Preserva a forma substantiva e o contraste verbal e ético com ποιητής.
- source_word: λόγου
  choice: da palavra
  rationale: É a correspondência direta de λόγος e mantém a continuidade com o contexto de Tiago.
- source_word: ποιητής
  choice: praticante
  rationale: Expressa de modo natural em português aquele que põe a palavra em prática, preservando a força substantiva.
- source_word: ἔοικεν
  choice: é semelhante a
  rationale: Traduz naturalmente o perfeito com sentido presente e introduz com clareza a comparação.
- source_word: ἀνδρὶ
  choice: um homem
  rationale: Mantém o substantivo especificamente masculino ἀνήρ, embora a aplicação da comparação seja geral.
- source_word: κατανοοῦντι
  choice: observa atentamente
  rationale: Comunica a observação deliberada e cuidadosa expressa por κατανοέω, não um simples olhar passageiro.
- source_word: τὸ πρόσωπον τῆς γενέσεως αὐτοῦ
  choice: o rosto que lhe é natural desde o nascimento
  rationale: Reproduz em português inteligível o sentido da expressão grega literalmente ligada ao nascimento, sem perder sua peculiaridade.
- source_word: ἐν ἐσόπτρῳ
  choice: num espelho
  rationale: Forma corrente e clara em português moderno.
theological_decisions:
- issue: Linguagem representativa masculina em ἀνδρὶ
  choice: um homem
  alternative: uma pessoa
  rationale: O grego emprega o termo especificamente masculino ἀνήρ; a tradução preserva essa forma sem restringir a aplicação genérica da comparação.
- issue: Sentido de τῆς γενέσεως αὐτοῦ
  choice: que lhe é natural desde o nascimento
  alternative: de seu nascimento
  rationale: A formulação escolhida comunica o sentido contextual da expressão e mantém explícita a referência ao nascimento; a forma estritamente literal é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Praticante” evita o pouco natural “fazedor”, e “observa atentamente” conserva a força de κατανοοῦντι. A vírgula final foi mantida porque o versículo prossegue sintaticamente no contexto.
