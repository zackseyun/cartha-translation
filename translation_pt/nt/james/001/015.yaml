id: JAS.1.15
reference: James 1:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶτα ἡ ἐπιθυμία συλλαβοῦσα τίκτει ἁμαρτίαν, ἡ δὲ ἁμαρτία ἀποτελεσθεῖσα ἀποκύει θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/015.yaml
  text: Then desire[a], after it has conceived, gives birth to sin; and sin, when it is fully grown[b], brings forth death.
translation:
  language: pt
  text: Então o desejo, depois de conceber[a], dá à luz o pecado; e o pecado, quando chega à plena maturidade[b], dá à luz a morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo concebido”. O particípio grego liga estreitamente ao desejo a imagem da concepção.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quando se completa” ou “quando alcança a maturidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Então
  rationale: Marca a sequência no desenvolvimento que vai da tentação à morte, com formulação natural em português.
- source_word: ἐπιθυμία
  choice: o desejo
  rationale: “Desejo” preserva a amplitude do termo grego no contexto; “luxúria” seria estreito e excessivamente sexualizado, e “cobiça” poderia restringir indevidamente o sentido.
- source_word: συλλαβοῦσα
  choice: depois de conceber
  rationale: Expressa a anterioridade do particípio aoristo em relação ao verbo principal e mantém clara a imagem da concepção.
- source_word: τίκτει
  choice: dá à luz
  rationale: Mantém de modo vivo e natural a metáfora do parto.
- source_word: ἁμαρτίαν
  choice: o pecado
  rationale: Equivalente corrente e exato para o mal moral produzido pelo desejo.
- source_word: δὲ
  choice: e
  rationale: Aqui a conjunção dá continuidade à progressão, sem exigir contraste forte.
- source_word: ἀποτελεσθεῖσα
  choice: quando chega à plena maturidade
  rationale: Comunica a ideia de completar o desenvolvimento e se harmoniza com a metáfora orgânica, sem reduzir o termo a uma noção meramente técnica de conclusão.
- source_word: ἀποκύει
  choice: gera
  rationale: Preserva a linguagem reprodutiva e evita repetir imediatamente “dá à luz”; é uma expressão natural e vigorosa em português.
- source_word: θάνατον
  choice: a morte
  rationale: Tradução direta que conserva o alcance deliberadamente não especificado do grego.
theological_decisions:
- issue: Natureza da metáfora que liga desejo, pecado e morte
  choice: Preservar a personificação e a sequência de concepção, nascimento e maturação.
  alternative: Parafrasear como “o desejo leva ao pecado, e o pecado leva à morte”.
  rationale: Uma formulação apenas causal eliminaria a força retórica e a progressão orgânica da imagem usada por Tiago.
- issue: Sentido de θάνατος
  choice: Traduzir simplesmente como “morte”.
  alternative: Especificar “morte espiritual”, “morte física” ou “morte eterna”.
  rationale: O texto grego não qualifica a morte; especificá-la importaria uma delimitação doutrinária que o versículo deixa em aberto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a metáfora reprodutiva e a ambiguidade do alcance de “morte”, sem acrescentar interpretação denominacional.
