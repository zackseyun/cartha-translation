  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ πλανᾶσθε, ἀδελφοί μου ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/016.yaml
  text: Do not be deceived[a], my beloved brothers.
translation:
  language: pt
  text: Não se enganem, meus amados irmãos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; a palavra grega traduzida como “irmãos” pode dirigir-se coletivamente aos demais fiéis, incluindo as mulheres.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: Não
  rationale: Com o imperativo presente, μή introduz uma proibição. “Não” transmite a ordem de modo direto, sem acrescentar uma nuance aspectual que o contexto não exige.
- source_word: πλανᾶσθε
  choice: se enganem
  rationale: A forma pode ter sentido médio ou passivo, com a ideia de cair em erro ou ser enganado. “Não se enganem” é natural em português, ajusta-se ao contexto de uma crença falsa e evita especificar um agente externo.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: O vocativo masculino plural significa literalmente “irmãos” e, neste contexto comunitário, pode abranger conjuntamente homens e mulheres; essa extensão é esclarecida em nota.
- source_word: μου
  choice: meus
  rationale: O possessivo expressa a proximidade pastoral de Tiago e concorda naturalmente com “irmãos” em português.
- source_word: ἀγαπητοί
  choice: amados
  rationale: Preserva o tom afetuoso e o sentido de ἀγαπητοί com linguagem digna, clara e corrente.
theological_decisions:
- issue: Forma de tratamento dirigida à comunidade cristã
  choice: Manter “irmãos” no texto principal e esclarecer em nota seu possível referente inclusivo.
  alternative: “irmãos e irmãs”
  rationale: O grego emprega o masculino plural ἀδελφοί, provavelmente como forma coletiva de tratamento a uma comunidade mista. A tradução mantém a forma marcada do texto-fonte sem ocultar seu alcance contextual.
translation_notes:
  register: Português moderno, claro e pastoral, com ampla legibilidade brasileira. A construção “Não se enganem” preserva de modo natural a advertência enfática, e “meus amados irmãos” mantém o calor do vocativo grego.
