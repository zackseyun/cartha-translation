- from: 'Saibam disto[a], meus amados irmãos[b]: cada pessoa seja pronta para ouvir, tardia para falar e tardia para se irar.'
  to: 'Saibam disto[a], meus amados irmãos[b]: todo ser humano seja pronto para ouvir, lento para falar e lento para se irar.'
  rationale: A revisão substitui “tardia” por “lento”, que verte βραδύς com maior precisão e naturalidade, e emprega “todo ser humano” para expressar o singular genérico de πᾶς ἄνθρωπος. Mantêm-se a leitura imperativa de abertura, sua alternativa em nota, o tom afetuoso do vocativo e as âncoras existentes.
