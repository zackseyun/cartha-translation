review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a estrutura exortativa, o paralelismo e a ambiguidade de Ἴστε, registrada em nota. Contudo, “tardia” tende a significar “que chega tarde” no português moderno e não comunica com a mesma clareza a disposição de ser lento/demorado para falar ou irar-se expressa por βραδύς.
  naturalness: “Lento para falar e lento para se irar” é mais claro, idiomático e amplamente compreensível do que “tardia para falar e tardia para se irar”. “Todo ser humano” permite manter o singular genérico de πᾶς ἄνθρωπος sem a marcação feminina exigida por “cada pessoa” nos adjetivos.
  terminology: “Amados irmãos” corresponde bem a ἀδελφοί μου ἀγαπητοί. “Todo ser humano” traduz ἄνθρωπος em seu valor humano genérico, sem sugerir que a exortação se limita a homens.
  issues:
  - severity: medium
    issue: “Tardia para falar e tardia para se irar” é semanticamente menos preciso e menos natural no português contemporâneo.
    rationale: βραδύς denota ser lento ou demorado quanto a uma ação/disposição. Em português atual, “tardio/tardia” costuma evocar algo que ocorre depois do tempo esperado; “lento” preserva melhor o sentido e o paralelismo.
  - severity: low
    issue: A concordância feminina em “cada pessoa ... pronta ... tardia” é gramatical, mas torna menos transparente o singular humano genérico da formulação grega.
    rationale: “Todo ser humano ... pronto ... lento” é natural, internacionalmente compreensível e espelha com maior proximidade πᾶς ἄνθρωπος, cujo referente é genérico.
