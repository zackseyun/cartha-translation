  text: ⸀Ἴστε, ἀδελφοί μου ἀγαπητοί. ἔστω ⸀δὲ πᾶς ἄνθρωπος ταχὺς εἰς τὸ ἀκοῦσαι, βραδὺς εἰς τὸ λαλῆσαι, βραδὺς εἰς ὀργήν,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/019.yaml
  text: 'Know this[a], my beloved brothers: let every man be quick to hear, slow to speak, slow to anger[c][b],'
translation:
  language: pt
  text: 'Saibam disto[a], meus amados irmãos[b]: todo ser humano seja pronto para ouvir, lento para falar e lento para se irar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês sabem disto”. A forma grega pode ser entendida como indicativo, em vez de imperativo.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “meus amados irmãos e irmãs”. O grego diz “irmãos”, mas provavelmente se dirige a toda a comunidade de fiéis.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴστε
  choice: Saibam disto
  rationale: A forma pode ser entendida como imperativo ou indicativo. O imperativo se ajusta bem ao fluxo exortativo; “disto” é uma explicitação idiomática do referente discursivo.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: meus amados irmãos
  rationale: Mantém a forma masculina plural do grego e o tom afetuoso e digno de ἀγαπητοί; no contexto, “irmãos” provavelmente abrange toda a comunidade cristã.
- source_word: ἔστω δὲ πᾶς ἄνθρωπος
  choice: cada pessoa seja
  rationale: ἔστω exprime uma exortação na terceira pessoa. πᾶς ἄνθρωπος tem sentido humano genérico; “cada pessoa” comunica esse alcance com naturalidade em português sem restringi-lo aos homens.
- source_word: ταχὺς εἰς τὸ ἀκοῦσαι
  choice: pronta para ouvir
  rationale: Expressa de modo natural a disposição rápida e atenta para ouvir, preservando a estrutura paralela da exortação.
- source_word: βραδὺς εἰς τὸ λαλῆσαι
  choice: tardia para falar
  rationale: Tradução direta que preserva o contraste formal entre ταχύς e βραδύς e o paralelismo da frase.
- source_word: βραδὺς εἰς ὀργήν
  choice: tardia para se irar
  rationale: Verte naturalmente o idioma grego e indica demora em chegar à ira, sem introduzir uma noção mais específica de cólera judicial.
theological_decisions:
- issue: Valor modal de Ἴστε
  choice: 'Imperativo: “Saibam disto”'
  alternative: 'Indicativo: “Vocês sabem disto”'
  rationale: Ambas as análises gramaticais são possíveis. O imperativo harmoniza com as exortações seguintes, mas a leitura indicativa é preservada em nota.
- issue: Linguagem representativa de gênero
  choice: “irmãos” no vocativo e “cada pessoa” na exortação
  alternative: “irmãos e irmãs” e/ou “cada homem”
  rationale: O vocativo mantém a forma lexical e comunitária tradicional do grego, com nota sobre seu provável alcance misto. Em πᾶς ἄνθρωπος, ἄνθρωπος é genérico; “cada pessoa” expressa com precisão seu referente universal no português atual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O paralelismo foi mantido por “pronta... tardia... tardia”, e a ambiguidade gramatical da abertura foi registrada em nota.
