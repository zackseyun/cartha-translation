id: JAS.5.9
reference: James 5:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ στενάζετε, ⸂ἀδελφοί, κατ’ ἀλλήλων⸃, ἵνα μὴ κριθῆτε· ἰδοὺ ὁ κριτὴς πρὸ τῶν θυρῶν ἕστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/009.yaml
  text: Do not grumble against one another[a], brothers, so that you may not be judged. Look, the Judge is standing at the doors.
translation:
  language: pt
  text: 'Não se queixem uns contra os outros, irmãos[a], para que não sejam julgados. Vejam: o Juiz está às portas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido como “irmãos” pode dirigir-se coletivamente aos fiéis, incluindo homens e mulheres, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: στενάζετε
  choice: se queixem
  rationale: Com κατ’ ἀλλήλων, o verbo indica queixa ressentida dirigida a outros, não apenas um gemido interior. “Queixar-se contra” comunica essa dimensão interpessoal em português natural.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva a forma masculina plural do vocativo grego, que neste contexto pode dirigir-se ao conjunto dos fiéis, incluindo mulheres; essa abrangência é esclarecida em nota.
- source_word: κατ’ ἀλλήλων
  choice: uns contra os outros
  rationale: κατά com o genitivo expressa aqui oposição ou hostilidade recíproca; a formulação conserva tanto a direção adversativa quanto a reciprocidade.
- source_word: κριθῆτε
  choice: sejam julgados
  rationale: Mantém o sentido amplo de κρίνω sem antecipar que o resultado do julgamento seja condenação. A construção com “para que não” representa adequadamente ἵνα μή.
- source_word: κριτής
  choice: Juiz
  rationale: O título aponta para o juiz divino e escatológico. A maiúscula sinaliza o uso titular sem identificar além do que o grego declara.
- source_word: πρὸ τῶν θυρῶν
  choice: às portas
  rationale: Conserva o plural θυρῶν e a expressão idiomática de proximidade e iminência.
- source_word: ἕστηκεν
  choice: está
  rationale: No predicado “está às portas”, comunica o estado presente resultante expresso pelo perfeito grego; a posição de prontidão é veiculada naturalmente pelo idioma sem a rigidez de “está de pé às portas”.
theological_decisions:
- issue: Referente de “o Juiz”
  choice: Juiz divino e escatológico, deixado sem identificação adicional
  alternative: Identificá-lo explicitamente como o Senhor, Cristo ou Deus
  rationale: O contexto da vinda do Senhor favorece uma referência divina e escatológica, possivelmente ao Senhor/Cristo, mas o texto diz apenas “o Juiz”. A tradução preserva essa tensão sem resolver o referente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Não se queixem” evita o caráter excessivamente coloquial de “não resmunguem”; “Vejam” reproduz a chamada enfática ἰδού de modo natural. O plural “às portas” preserva uma característica expressiva do original.
