  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδοὺ ὁ μισθὸς τῶν ἐργατῶν τῶν ἀμησάντων τὰς χώρας ὑμῶν ὁ ⸀ἀφυστερημένος ἀφ’ ὑμῶν κράζει, καὶ αἱ βοαὶ τῶν θερισάντων εἰς τὰ ὦτα Κυρίου Σαβαὼθ ⸀εἰσεληλύθασιν·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/004.yaml
  text: Look[a], the wages of the workers who harvested your fields, which have been withheld by you, are crying out, and the cries of those who did the harvesting have entered into the ears of the Lord of Hosts.
translation:
  language: pt
  text: 'Vejam: o salário dos trabalhadores que ceifaram os campos de vocês, retido por vocês, clama; e os gritos dos que fizeram a colheita chegaram aos ouvidos do Senhor dos Exércitos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Senhor Sabaote”. O grego translitera o título hebraico Σαβαώθ, tradicionalmente transliterado em algumas traduções.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Vejam
  rationale: Interjeição enfática que chama a atenção dos destinatários; o plural concorda naturalmente com o tratamento dirigido ao grupo e evita o arcaísmo de “Eis”.
- source_word: μισθὸς
  choice: o salário
  rationale: Designa a remuneração devida aos trabalhadores; o singular preserva a forma e a concordância do grego.
- source_word: ἐργατῶν
  choice: dos trabalhadores
  rationale: Termo geral, claro e atual para pessoas empregadas no trabalho agrícola.
- source_word: ἀμησάντων
  choice: que ceifaram
  rationale: Refere-se ao corte ou à colheita das plantações; “ceifaram” mantém a imagem agrícola e distingue este verbo de θερίζω na oração seguinte.
- source_word: χώρας
  choice: os campos
  rationale: No contexto, indica as terras cultivadas pertencentes aos ricos proprietários.
- source_word: ἀφυστερημένος ἀφ’ ὑμῶν
  choice: retido por vocês
  rationale: Preserva a construção passiva e a acusação direta de que a remuneração devida foi indevidamente retida.
- source_word: κράζει
  choice: clama
  rationale: Mantém o singular do sujeito “salário” e a personificação vívida da remuneração injustamente retida.
- source_word: βοαὶ
  choice: os gritos
  rationale: Expressa clamores urgentes por socorro e justiça.
- source_word: θερισάντων
  choice: dos que fizeram a colheita
  rationale: Tradução natural do particípio substantivado e suficientemente distinta do verbo anterior, sem recorrer ao termo menos corrente “ceifeiros”.
- source_word: εἰς τὰ ὦτα
  choice: aos ouvidos
  rationale: Conserva a imagem bíblica de os clamores entrarem na audiência divina, em formulação natural em português.
- source_word: Κυρίου Σαβαὼθ
  choice: Senhor dos Exércitos
  rationale: Traduz o título divino de fundo hebraico de modo compreensível, preservando sua forma tradicional em português.
- source_word: εἰσεληλύθασιν
  choice: chegaram
  rationale: 'Expressa de modo idiomático o perfeito grego: os gritos chegaram aos ouvidos do Senhor e permanecem diante dele.'
theological_decisions:
- issue: Tradução do título divino Κυρίου Σαβαὼθ
  choice: Senhor dos Exércitos
  alternative: Senhor Sabaote
  rationale: Σαβαώθ representa um título hebraico associado a exércitos ou hostes. Traduzir o título comunica seu sentido ao leitor moderno; a transliteração tradicional é registrada em nota sem impor interpretação adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a acusação direta, a personificação do salário e a imagem dos clamores chegando aos ouvidos de Deus.
