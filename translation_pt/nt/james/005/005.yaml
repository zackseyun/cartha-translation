id: JAS.5.5
reference: James 5:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐτρυφήσατε ἐπὶ τῆς γῆς καὶ ἐσπαταλήσατε, ἐθρέψατε τὰς καρδίας ⸀ὑμῶν ἐν ἡμέρᾳ σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/005.yaml
  text: You have lived in luxury on the earth and indulged yourselves[d][c][b][a]; you have fattened your hearts in a day of slaughter.
translation:
  language: pt
  text: Vocês viveram no luxo na terra e se entregaram aos prazeres; engordaram o coração de vocês em dia de matança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o dia da matança”. A imagem é a de animais engordados antes do abate e provavelmente aponta para o juízo que se aproxima.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτρυφήσατε
  choice: viveram na luxúria
  rationale: Expressa uma vida marcada pelo luxo e pela busca de prazer, mantendo a força de censura do aoristo sem recorrer a linguagem arcaica.
- source_word: ἐπὶ τῆς γῆς
  choice: sobre a terra
  rationale: Preserva o sentido amplo de γῆ e a formulação solene da denúncia.
- source_word: ἐσπαταλήσατε
  choice: se entregaram aos prazeres
  rationale: Comunica vida autoindulgente e extravagante em português atual, intensificando a ideia do verbo anterior.
- source_word: ἐθρέψατε
  choice: engordaram
  rationale: No contexto da matança, o verbo evoca deliberadamente animais engordados antes do abate; 'engordaram' preserva essa ironia ameaçadora.
- source_word: τὰς καρδίας ὑμῶν
  choice: o coração de vocês
  rationale: Mantém a metáfora antropológica do grego. O singular distributivo é natural em português e se refere ao coração de cada destinatário.
- source_word: ἐν ἡμέρᾳ σφαγῆς
  choice: em dia de matança
  rationale: Segue de perto ἐν, conserva a imagem abrupta e não explicita no texto principal se o dia é presente, futuro ou finalidade.
theological_decisions:
- issue: Força metafórica de 'dia de matança'
  choice: Manter a imagem de matança e a provável alusão a juízo iminente sem explicitar o referente no texto principal.
  alternative: Traduzir 'para o dia da matança' ou declarar diretamente que se trata do juízo divino.
  rationale: O contexto sugere fortemente juízo, mas a expressão grega permanece imagética e admite tensão entre engordar-se no próprio dia da matança e engordar-se para esse dia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento por 'vocês' torna explícita a segunda pessoa do plural; a construção preserva o paralelismo acusatório e a imagem severa do original.
