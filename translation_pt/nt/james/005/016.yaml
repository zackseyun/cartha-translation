  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐξομολογεῖσθε ⸀οὖν ἀλλήλοις ⸂τὰς ἁμαρτίας⸃ καὶ ⸀εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/016.yaml
  text: Therefore[a], confess your sins to one another and pray for one another, so that you may be healed. The prayer of a righteous person is very powerful as it is at work.
translation:
  language: pt
  text: Portanto, confessem os seus pecados uns aos outros e orem uns pelos outros, para que sejam curados. A oração de uma pessoa justa é muito poderosa quando está em ação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «A súplica de uma pessoa justa tem grande força quando atua.»'
    reason: Alternativa lexical e sintática para δέησις, πολὺ ἰσχύει e o particípio ambíguo ἐνεργουμένη.
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: confessem
  rationale: O imperativo pede reconhecimento aberto; com «pecados», «confessem» expressa naturalmente a dimensão moral e interpessoal sem pressupor um contexto sacramental formal.
- source_word: οὖν
  choice: Portanto
  rationale: Preserva a inferência em relação ao contexto anterior, que trata de oração, pecado e restauração.
- source_word: ἀλλήλοις
  choice: uns aos outros
  rationale: Explicita a reciprocidade indicada pelo pronome grego e mantém a confissão como prática mútua na comunidade.
- source_word: τὰς ἁμαρτίας
  choice: os seus pecados
  rationale: O possessivo, embora implícito no grego, é exigido pelo uso natural do português neste mandamento recíproco; «pecados» traduz diretamente ἁμαρτίας.
- source_word: εὔχεσθε
  choice: orem
  rationale: Equivalente direto e corrente do imperativo, em paralelo com «confessem».
- source_word: ὑπὲρ ἀλλήλων
  choice: uns pelos outros
  rationale: Expressa de modo idiomático o sentido intercessório de ὑπέρ com genitivo.
- source_word: ὅπως ἰαθῆτε
  choice: para que sejam curados
  rationale: Mantém a construção de propósito ou resultado e conserva o sentido amplo de cura sem restringi-lo apenas ao corpo ou ao espírito.
- source_word: πολὺ ἰσχύει
  choice: é muito poderosa
  rationale: Comunica a grande força ou eficácia da oração em português atual, sem especificar indevidamente um resultado concreto.
- source_word: δέησις
  choice: oração
  rationale: É a forma mais clara e abrangente no contexto; a nuance mais específica de «súplica» é preservada na nota.
- source_word: δικαίου
  choice: de uma pessoa justa
  rationale: O adjetivo substantivado tem sentido humano genérico; «pessoa» evita limitar a afirmação ao sexo masculino.
- source_word: ἐνεργουμένη
  choice: quando está em ação
  rationale: Preserva a ideia de atuação eficaz do particípio e evita decidir de modo rígido entre uma leitura média («atuando») e uma leitura passiva («sendo posta em ação»).
theological_decisions:
- issue: Se o versículo ordena confissão sacramental ao clero ou confissão mútua entre os fiéis
  choice: confissão mútua, «uns aos outros»
  alternative: confissão mediada por ministros ordenados
  rationale: O pronome recíproco ἀλλήλοις indica explicitamente mutualidade entre os membros da comunidade. A tradução não acrescenta uma estrutura clerical que o versículo não explicita.
- issue: Alcance da cura em ἰαθῆτε
  choice: «sejam curados», sem delimitar o tipo de cura
  alternative: cura exclusivamente física ou exclusivamente espiritual
  rationale: A doença física domina o contexto imediato, mas a referência aos pecados amplia o quadro. A formulação preserva essa tensão.
- issue: Referência de gênero em δικαίου
  choice: «uma pessoa justa»
  alternative: «um homem justo»
  rationale: Embora a forma grega seja masculina singular, o uso é proverbial e genérico; a formulação escolhida representa esse alcance sem excluir mulheres.
- issue: Sentido e voz de ἐνεργουμένη
  choice: «quando está em ação»
  alternative: «quando atua», «quando é posta em ação» ou «sendo eficaz»
  rationale: A construção grega admite nuances média e passiva e também pode destacar eficácia. A tradução principal e a nota mantêm a abertura sem introduzir uma explicação teológica sobre a origem dessa atuação.
translation_notes:
  register: Português moderno, claro e digno, com imperativos plurais naturais para leitores brasileiros e compreensão ampla no mundo lusófono. A repetição «uns aos outros/uns pelos outros» conserva o paralelismo e a mutualidade do grego. A nota acompanha a oração final, à qual pertence a alternativa.
