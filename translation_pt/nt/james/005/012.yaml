  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πρὸ πάντων δέ, ἀδελφοί μου, μὴ ὀμνύετε, μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον· ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ, ἵνα μὴ ⸂ὑπὸ κρίσιν⸃ πέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/012.yaml
  text: But above all[a], my brothers, do not swear, either by heaven or by earth or by any other oath. Instead, let your yes be yes and your no, no[b], so that you may not fall under judgment.
translation:
  language: pt
  text: Mas, acima de tudo, meus irmãos[a], não jurem, nem pelo céu, nem pela terra, nem por qualquer outro juramento. Em vez disso, que o “sim” de vocês seja sim, e o “não”, não, para que não venham a cair sob juízo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meus irmãos e minhas irmãs”. O grego diz “irmãos” e provavelmente se dirige a toda a comunidade de fiéis.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para que não caiam sob condenação”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: acima de tudo
  rationale: Expressão portuguesa natural que preserva a ênfase e a ideia de prioridade do grego.
- source_word: ἀδελφοί μου
  choice: meus irmãos
  rationale: Preserva a forma masculina plural do texto grego, que provavelmente se dirige de modo representativo a toda a comunidade; a abrangência é esclarecida em nota.
- source_word: μὴ ὀμνύετε
  choice: não jurem
  rationale: Indica uma proibição geral de prestar juramentos; o contexto deixa claro que não se trata simplesmente de linguagem profana.
- source_word: μήτε τὸν οὐρανὸν μήτε τὴν γῆν
  choice: nem pelo céu, nem pela terra
  rationale: Formulação idiomática em português que mantém os dois objetos pelos quais se poderia jurar.
- source_word: μήτε ἄλλον τινὰ ὅρκον
  choice: nem por qualquer outro juramento
  rationale: Preserva o caráter abrangente da proibição, sem restringi-la a uma modalidade específica de juramento.
- source_word: ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: Em vez disso, que o “sim” de vocês seja sim, e o “não”, não
  rationale: Mantém a concisão proverbial da expressão grega e explicita naturalmente o contraste marcado por δέ.
- source_word: ἵνα μὴ ὑπὸ κρίσιν πέσητε
  choice: para que não caiam sob juízo
  rationale: Conserva tanto a metáfora de πέσητε quanto o sentido amplo de κρίσις, sem especificar indevidamente condenação final.
theological_decisions:
- issue: Se κρίσις deve ser traduzido por “juízo” ou pelo termo mais forte “condenação”
  choice: juízo
  alternative: condenação
  rationale: κρίσις pode designar juízo em sentido amplo e não exige por si só a noção mais específica de condenação. A alternativa é registrada em nota para preservar a possibilidade sem estreitar o texto principal.
- issue: Como traduzir ἀδελφοί em uma provável referência à comunidade inteira
  choice: meus irmãos
  alternative: meus irmãos e minhas irmãs
  rationale: A tradução mantém a forma masculina plural do grego, enquanto a nota esclarece seu provável uso representativo e inclusivo na comunidade cristã.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Jurem” é entendido no sentido de prestar juramento, esclarecido pelos complementos. As aspas em “sim” e “não” ajudam a apresentar as próprias palavras como substantivos, sem perder a concisão do dito.
