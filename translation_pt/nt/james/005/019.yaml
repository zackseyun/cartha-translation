  text: Ἀδελφοί ⸀μου, ἐάν τις ἐν ὑμῖν πλανηθῇ ἀπὸ τῆς ἀληθείας καὶ ἐπιστρέψῃ τις αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/james/005/019.yaml
  text: My brothers[a], if anyone among you wanders from the truth and someone turns him back[c][b],
translation:
  language: pt
  text: Meus irmãos[a], se alguém entre vocês se desviar da verdade[b] e alguém o fizer voltar[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus irmãos e irmãs”; o grego emprega o masculino plural como forma de tratamento, que pode incluir toda a comunidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “for desencaminhado da verdade”, “se afastar da verdade” ou “for enganado e se afastar da verdade”.
    reason: lexical_alternative
  - marker: c
    text: Ou “o trouxer de volta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: Meus irmãos
  rationale: Preserva a forma masculina plural e o tom de tratamento direto do grego; no contexto, pode abranger toda a comunidade, conforme indicado em nota.
- source_word: ἐάν τις ἐν ὑμῖν
  choice: se alguém entre vocês
  rationale: Expressa de modo natural a condição e o caráter indefinido e singular de τις.
- source_word: πλανηθῇ ἀπὸ τῆς ἀληθείας
  choice: se desviar da verdade
  rationale: Em português corrente, a forma pronominal expressa naturalmente o afastamento moral ou espiritual sem determinar se houve engano externo ou iniciativa própria; mantém a ambiguidade contextual do passivo grego.
- source_word: καὶ ἐπιστρέψῃ τις αὐτόν
  choice: e outra pessoa o fizer voltar
  rationale: Distingue com clareza o segundo τις do primeiro e preserva a imagem de fazer alguém retornar, bem como o objeto masculino singular αὐτόν.
theological_decisions:
- issue: Linguagem de gênero no tratamento e no pronome
  choice: Manter “irmãos” e “o” no texto principal
  alternative: “irmãos e irmãs” e uma reformulação sem gênero
  rationale: As formas gregas são masculinas, embora “irmãos” possa designar a comunidade inteira. A nota torna explícito esse possível alcance inclusivo sem alterar a forma do texto principal.
- issue: Nuance de πλανηθῇ
  choice: “se desviar”
  alternative: “for desencaminhado”, “se afastar” ou “for enganado”
  rationale: O verbo pode descrever tanto desvio quanto engano. “Se desviar” é idiomático e não resolve indevidamente a questão da agência, enquanto a nota registra outras nuances possíveis.
- issue: Força de ἐπιστρέψῃ
  choice: “o fizer voltar”
  alternative: “o trouxer de volta” ou “o converter”
  rationale: A escolha conserva a imagem de retorno e evita restringir o verbo ao sentido técnico de conversão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula final foi mantida porque o versículo continua sintaticamente em Tiago 5:20.
