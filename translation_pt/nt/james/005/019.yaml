  source_fidelity: O texto principal transmite adequadamente a condição, o afastamento da verdade e a ação de fazer a pessoa retornar. “Se desviar” é uma opção idiomática que preserva a ambiguidade contextual de πλανηθῇ, embora atenue a forma passiva. “Outra pessoa” introduz uma distinção que o segundo τις não explicita; “alguém” é mais estritamente fiel.
  naturalness: O português é claro, moderno e apropriado ao registro epistolar. “Alguém ... e alguém” é natural neste paralelismo e evita a inferência adicional de que se trata necessariamente de uma pessoa diferente.
  terminology: “Meus irmãos” preserva a forma masculina do vocativo grego, com nota explicando seu possível alcance comunitário. “Verdade” e “fizer voltar” são adequados e não impõem uma interpretação teológica técnica.
