id: JAS.5.14
reference: James 5:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀσθενεῖ τις ἐν ὑμῖν; προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας, καὶ προσευξάσθωσαν ἐπ’ αὐτὸν ἀλείψαντες ⸀αὐτὸν ἐλαίῳ ἐν τῷ ὀνόματι τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/014.yaml
  text: Is anyone among you sick? Let him call for the elders of the church[a], and let them pray over him[b], anointing him with oil in the name of the Lord.
translation:
  language: pt
  text: Há alguém doente[a] entre vocês? Que chame os presbíteros da igreja, e que eles orem sobre essa pessoa, ungindo-a com óleo[b] em nome do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fraco”. O verbo grego pode indicar fraqueza em sentido mais amplo, mas aqui provavelmente se refere a doença, em vista da oração, da aplicação de óleo e do contexto de cura no versículo seguinte.
    reason: lexical_alternative
  - marker: b
    text: A aplicação de óleo pode ser entendida como medicinal, simbólica ou ambas; o próprio texto não especifica sua função.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενεῖ
  choice: doente
  rationale: Embora o verbo possa indicar fraqueza em sentido mais amplo, o contexto de oração, aplicação de óleo e cura no versículo seguinte favorece doença física.
- source_word: τις
  choice: alguém
  rationale: Preserva o sentido indefinido e inclusivo do pronome grego em português natural.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: Expressa de modo corrente a presença da pessoa no meio da comunidade destinatária.
- source_word: προσκαλεσάσθω
  choice: Que chame
  rationale: Mantém a força imperativa da terceira pessoa sem introduzir gênero não explicitado pelo pronome indefinido.
- source_word: τοὺς πρεσβυτέρους τῆς ἐκκλησίας
  choice: os presbíteros da igreja
  rationale: No contexto, πρεσβύτεροι designa líderes reconhecidos da comunidade, não apenas homens idosos; 'presbíteros' preserva o título semântico e 'igreja' traduz naturalmente ἐκκλησία.
- source_word: προσευξάσθωσαν ἐπ’ αὐτόν
  choice: eles orem sobre essa pessoa
  rationale: Preserva a força imperativa e a construção espacial/direcional de ἐπί, ao mesmo tempo que mantém clara a referência à pessoa enferma.
- source_word: ἀλείψαντες αὐτὸν ἐλαίῳ
  choice: ungindo-a com óleo
  rationale: Expressa a aplicação de óleo sem decidir se sua função é medicinal, simbólica ou ambas.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου
  choice: em nome do Senhor
  rationale: Conserva o idioma bíblico e sua associação com a pessoa e a autoridade do Senhor, sem explicitar além do grego.
theological_decisions:
- issue: Sentido de ἀσθενεῖ no contexto
  choice: doença física como sentido principal
  alternative: fraqueza geral ou espiritual
  rationale: A oração dos presbíteros, a aplicação de óleo e a referência à restauração no versículo seguinte tornam a doença física o sentido mais provável, embora a nota preserve a amplitude lexical.
- issue: Função da unção com óleo
  choice: descrição neutra da ação
  alternative: tratamento medicinal, ato simbólico ou rito sacramental
  rationale: O texto declara que o óleo é aplicado, mas não explica o mecanismo nem define sua natureza teológica; a tradução evita impor uma leitura denominacional.
- issue: Gênero dos referentes singulares
  choice: formulação inclusiva com 'alguém' e 'essa pessoa'
  alternative: empregar pronomes masculinos genéricos
  rationale: O pronome τις é indefinido e não exige referência exclusivamente masculina. A formulação portuguesa comunica naturalmente a abrangência do texto sem alterar quem pode estar doente.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. 'Presbíteros' preserva o título comunitário do grego; 'essa pessoa' evita um masculino genérico desnecessário e mantém clara a referência. As notas aparecem junto aos termos a que se referem.
source_grounding:
  english_pob_role: consult_only
