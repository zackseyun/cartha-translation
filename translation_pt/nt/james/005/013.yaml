  text: Κακοπαθεῖ τις ἐν ὑμῖν; προσευχέσθω· εὐθυμεῖ τις; ψαλλέτω.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/013.yaml
  text: Is anyone among you suffering? Let him pray[a]. Is anyone cheerful? Let him sing praise.
translation:
  language: pt
  text: Alguém entre vocês está sofrendo? Que ore. Alguém está de bom ânimo? Que cante louvores.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que cante salmos”; o verbo grego pode referir-se especificamente a cantar salmos ou, de modo mais amplo, a cantar louvores.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κακοπαθεῖ
  choice: sofrendo
  rationale: O verbo κακοπαθέω indica passar por sofrimento, adversidade ou dificuldades. “Sofrendo” é natural e abrangente, sem limitar o sentido a doença ou perseguição.
- source_word: τις
  choice: alguém
  rationale: O pronome indefinido singular tem sentido genérico. “Alguém” conserva tanto a singularidade quanto a inclusão natural em português.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: A expressão situa a pessoa hipotética dentro da comunidade destinatária. “Entre vocês” é direta, clara e natural.
- source_word: προσευχέσθω
  choice: que ore
  rationale: O imperativo presente na terceira pessoa expressa uma exortação individual e contínua. “Que ore” preserva de modo idiomático a força imperativa e o singular.
- source_word: εὐθυμεῖ
  choice: de bom ânimo
  rationale: O verbo εὐθυμέω descreve alguém animado ou em bom estado de espírito. “De bom ânimo” mantém esse sentido sem reduzi-lo simplesmente a felicidade momentânea.
- source_word: ψαλλέτω
  choice: que cante louvores
  rationale: Neste contexto, ψάλλω indica louvor cantado dirigido a Deus. “Que cante louvores” comunica claramente o sentido devocional, sem excluir a possibilidade mais específica de cantar salmos.
theological_decisions:
- issue: Exortações genéricas no singular
  choice: Manter o singular por meio de “alguém” e das formas “que ore” e “que cante”
  alternative: Empregar formas plurais ou explicitar “ele”
  rationale: O grego combina τις com imperativos na terceira pessoa do singular. A construção portuguesa conserva o caráter representativo e singular sem introduzir uma restrição masculina ausente do sentido genérico.
- issue: Sentido de ψαλλέτω
  choice: que cante louvores
  alternative: que cante salmos
  rationale: O verbo pode designar especificamente o canto de salmos, mas também tem o sentido mais amplo de cantar louvores. A tradução principal preserva o ato de louvor dirigido a Deus sem transformar o texto numa prescrição litúrgica mais estreita; a alternativa lexical é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A repetição “Há alguém...” reproduz o paralelismo retórico do grego; “de bom ânimo” conserva a nuance de bom estado de espírito.
