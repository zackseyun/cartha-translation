id: JAS.5.10
reference: James 5:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑπόδειγμα λάβετε, ⸀ἀδελφοί, τῆς κακοπαθίας καὶ τῆς μακροθυμίας τοὺς προφήτας, οἳ ἐλάλησαν ⸀ἐν τῷ ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/010.yaml
  text: Brothers[a], take the prophets who spoke in the name of the Lord as an example of suffering and patience.
translation:
  language: pt
  text: Irmãos[a], tomem como exemplo de sofrimento e paciência os profetas que falaram em nome do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” traduz o masculino plural ἀδελφοί; neste contexto, Tiago provavelmente se dirige a toda a comunidade de fiéis, incluindo as mulheres.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα λάβετε
  choice: tomem como exemplo
  rationale: A combinação idiomática expressa o imperativo de considerar os profetas um modelo a ser imitado, preservando de modo natural a força do grego.
- source_word: ἀδελφοί
  choice: Irmãos
  rationale: Mantém a forma masculina plural do vocativo grego; uma nota esclarece que, no contexto, a comunidade inteira provavelmente está incluída.
- source_word: κακοπαθίας
  choice: sofrimento
  rationale: Designa a experiência de adversidade ou aflição; “sofrimento” é amplo, claro e natural em português.
- source_word: μακροθυμίας
  choice: paciência
  rationale: Comunica a disposição de suportar demoradamente dificuldades sem desistir; é a opção corrente e acessível neste contexto.
- source_word: τοὺς προφήτας
  choice: os profetas
  rationale: Identifica diretamente aqueles que devem ser tomados como exemplo.
- source_word: ἐλάλησαν
  choice: falaram
  rationale: Preserva o sentido simples e comum de λαλέω sem acrescentar a nuance mais específica de “proclamaram”.
- source_word: ἐν τῷ ὀνόματι κυρίου
  choice: em nome do Senhor
  rationale: Conserva a expressão bíblica que indica representação e autoridade, sem explicá-la excessivamente no texto.
theological_decisions:
- issue: Vocativo masculino ἀδελφοί dirigido à comunidade
  choice: “Irmãos” no texto, com nota sobre seu provável alcance inclusivo
  alternative: “Irmãos e irmãs”
  rationale: A tradução preserva a forma gramatical masculina do original e esclarece em nota que o uso epistolar provavelmente abrange também as mulheres da comunidade.
- issue: Relação dos profetas com ὑπόδειγμα e os genitivos κακοπαθίας καὶ μακροθυμίας
  choice: “tomem como exemplo de sofrimento e paciência os profetas”
  alternative: “tomem os profetas como exemplo no sofrimento e na paciência”
  rationale: A redação mantém os profetas como objeto do imperativo e conserva os dois genitivos como os aspectos nos quais eles servem de exemplo, sem resolver além do necessário a relação semântica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “tomem como exemplo ... os profetas” preserva a relação sintática do grego e soa natural; “em nome do Senhor” mantém o idioma bíblico tradicional ainda corrente.
