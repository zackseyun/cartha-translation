id: JAS.5.15
reference: James 5:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/015.yaml
  text: And the prayer of faith will save the one who is sick[a], and the Lord will raise him up. And if he has committed sins[c][b], he will be forgiven.
translation:
  language: pt
  text: E a oração da fé[b] salvará quem está doente[a], e o Senhor o levantará. E, se tiver cometido pecados[c], será perdoado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “curará” ou “restabelecerá”; o verbo grego significa literalmente “salvará”.
    reason: lexical_alternative
  - marker: b
    text: “Oração da fé” também pode ser entendida como oração marcada pela confiança ou, com menor probabilidade neste contexto, pela fidelidade.
    reason: lexical_alternative
  - marker: c
    text: Ou “mesmo que tenha cometido pecados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχὴ
  choice: oração
  rationale: No contexto dos presbíteros orando pela pessoa enferma (v. 14), o termo indica oração, não voto.
- source_word: πίστεως
  choice: da fé
  rationale: Preserva a forma do genitivo grego e, neste contexto, indica mais naturalmente uma oração caracterizada pela fé ou confiança em Deus.
- source_word: σώσει
  choice: salvará
  rationale: Mantém o sentido básico e a amplitude de σῴζω; no contexto de enfermidade, o verbo inclui a ideia de cura ou restabelecimento.
- source_word: τὸν κάμνοντα
  choice: quem está doente
  rationale: Embora κάμνω possa denotar cansaço ou fraqueza, o contexto imediato de enfermidade, unção e levantar favorece o sentido de estar doente.
- source_word: ἐγερεῖ
  choice: levantará
  rationale: Conserva a imagem verbal de ἐγείρω e permite entender o restabelecimento do leito sem reduzir outras possíveis ressonâncias do verbo.
- source_word: κύριος
  choice: Senhor
  rationale: É a tradução portuguesa consagrada para κύριος neste uso divino e preserva a agência divina da afirmação.
- source_word: κἂν ἁμαρτίας ᾖ πεποιηκώς
  choice: se tiver cometido pecados
  rationale: Expressa com naturalidade a condição concessiva e mantém o pecado como possibilidade, sem sugerir que toda doença decorra de pecados pessoais.
- source_word: ἀφεθήσεται αὐτῷ
  choice: será perdoado
  rationale: Formulação idiomática em português que preserva o passivo e comunica que a pessoa receberá perdão pelos pecados.
theological_decisions:
- issue: Se σώσει deve ser limitado à cura física ou conservar o sentido mais amplo de salvação e restauração
  choice: salvará
  alternative: curará; restabelecerá
  rationale: A enfermidade torna presente o sentido de cura, mas o verbo grego escolhido por Tiago possui maior amplitude. “Salvará” conserva essa tensão lexical e teológica.
- issue: Se o versículo promete cura automática por meio da oração
  choice: Manter os futuros afirmativos do texto sem acrescentar qualificações
  alternative: poderá restabelecer; certamente curará em todos os casos
  rationale: A tradução não enfraquece a afirmação grega nem acrescenta uma doutrina de cura garantida em todas as circunstâncias.
- issue: Se a enfermidade é apresentada como sempre causada por pecado pessoal
  choice: Manter a oração sobre os pecados como condicional
  alternative: Sugerir uma relação causal universal entre pecado pessoal e enfermidade
  rationale: A construção grega apresenta a prática de pecados como possibilidade; não declara que toda enfermidade seja consequência direta de pecado pessoal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Quem está doente” evita um substantivo excessivamente formal; “levantará” preserva a imagem do original. A colocação dos marcadores segue diretamente as expressões a que cada nota se refere.
