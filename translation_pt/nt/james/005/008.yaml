  text: μακροθυμήσατε καὶ ὑμεῖς, στηρίξατε τὰς καρδίας ὑμῶν, ὅτι ἡ παρουσία τοῦ κυρίου ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/008.yaml
  text: You also be patient; strengthen your hearts[a], because the coming of the Lord has drawn near.
translation:
  language: pt
  text: Sejam pacientes, vocês também; fortaleçam seus corações, pois a vinda[a] do Senhor está próxima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a presença do Senhor”. A palavra grega pode significar “presença” ou “vinda”; neste contexto, refere-se à chegada escatológica do Senhor.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακροθυμήσατε
  choice: Sejam pacientes
  rationale: O imperativo aoristo plural pede perseverança paciente em meio à dificuldade. A formulação é clara e natural em português moderno.
- source_word: καὶ ὑμεῖς
  choice: também vocês
  rationale: 'Preserva a ligação enfática com o exemplo anterior: assim como o agricultor espera com paciência, os leitores também devem fazê-lo.'
- source_word: στηρίξατε
  choice: fortaleçam
  rationale: Expressa a ideia de tornar firme ou consolidar, formando uma construção idiomática com “o coração”.
- source_word: τὰς καρδίας ὑμῶν
  choice: o coração
  rationale: Mantém a metáfora bíblica do coração como centro da disposição interior e da coragem. O singular distributivo é natural em português para uma exortação coletiva.
- source_word: ὅτι
  choice: pois
  rationale: Introduz de maneira natural a razão das duas exortações.
- source_word: ἡ παρουσία
  choice: a vinda
  rationale: Embora παρουσία também possa significar “presença”, no contexto escatológico de Tiago 5:7–8 refere-se à chegada do Senhor.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: Preserva o título κύριος em seu uso cristológico e escatológico habitual no Novo Testamento.
- source_word: ἤγγικεν
  choice: está próxima
  rationale: 'Comunica de modo natural o estado presente resultante expresso pelo perfeito grego: a vinda se aproximou e agora está perto.'
theological_decisions:
- issue: Sentido de παρουσία na declaração escatológica sobre o Senhor
  choice: a vinda do Senhor
  alternative: a presença do Senhor
  rationale: O contexto imediato, voltado para a espera paciente pela chegada futura do Senhor, favorece “vinda”; a nota preserva a alternativa lexical genuína.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Também vocês” preserva a ênfase sem soar rígido; “fortaleçam o coração” conserva a metáfora bíblica em uma construção portuguesa natural.
