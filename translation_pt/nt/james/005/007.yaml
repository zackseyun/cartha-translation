id: JAS.5.7
reference: James 5:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μακροθυμήσατε οὖν, ἀδελφοί, ἕως τῆς παρουσίας τοῦ κυρίου. ἰδοὺ ὁ γεωργὸς ἐκδέχεται τὸν τίμιον καρπὸν τῆς γῆς, μακροθυμῶν ἐπ’ ⸀αὐτῷ ἕως ⸀λάβῃ πρόϊμον καὶ ὄψιμον.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/007.yaml
  text: Be patient[a], therefore, brothers, until the coming of the Lord. Look, the farmer waits for the precious fruit of the earth[b], being patient over it until it receives the early and late rains.
translation:
  language: pt
  text: 'Portanto, irmãos[a], sejam pacientes até a vinda[b] do Senhor. Vejam: o agricultor espera o precioso fruto da terra, esperando pacientemente por ele até receber as primeiras e as últimas chuvas.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o grego diz “irmãos”, forma frequentemente usada para se dirigir a toda a comunidade de fé.
    reason: alternative_reading
  - marker: b
    text: Ou “presença”; neste contexto, a palavra grega provavelmente se refere à futura chegada do Senhor.
    reason: lexical_alternative
  - marker: c
    text: Isto é, as chuvas do começo e do fim da estação chuvosa, necessárias ao desenvolvimento e ao amadurecimento da colheita.
    reason: cultural_clarification
lexical_decisions:
- source_word: Μακροθυμήσατε
  choice: sejam pacientes
  rationale: O imperativo pede perseverança paciente. A formulação é natural em português moderno e permite conservar a repetição da mesma raiz verbal mais adiante.
- source_word: οὖν
  choice: Portanto
  rationale: Mantém a relação de conclusão com a advertência e a exortação anteriores.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Reproduz o vocativo masculino plural do grego; uma nota esclarece seu emprego comunitário abrangente.
- source_word: παρουσίας
  choice: vinda
  rationale: Neste contexto escatológico, refere-se naturalmente à futura chegada do Senhor; a possibilidade lexical de “presença” é registrada em nota.
- source_word: ἰδοὺ
  choice: Vejam
  rationale: Preserva de modo corrente e digno a força do chamado de atenção que introduz o exemplo.
- source_word: γεωργὸς
  choice: agricultor
  rationale: Equivalente amplo e natural para quem cultiva a terra, sem restringir a imagem a uma cultura específica.
- source_word: ἐκδέχεται
  choice: espera
  rationale: Expressa expectativa prolongada e se ajusta ao tema da paciência.
- source_word: τίμιον καρπὸν τῆς γῆς
  choice: o precioso fruto da terra
  rationale: Conserva a imagem agrícola ampla e o sentido de valor e desejabilidade da colheita.
- source_word: μακροθυμῶν ἐπ’ αὐτῷ
  choice: por causa dele, mantém-se paciente
  rationale: Retoma a ideia da exortação inicial e liga a paciência do agricultor ao fruto esperado; “dele” retoma “fruto”.
- source_word: πρόϊμον καὶ ὄψιμον
  choice: as primeiras e as últimas chuvas
  rationale: O grego substantiva adjetivos que, no contexto agrícola, designam as chuvas do começo e do fim da estação; a explicitação de “chuvas” é exigida pelo sentido contextual.
theological_decisions:
- issue: Alcance de ἀδελφοί
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A forma masculina do texto é mantida, sem negar que o modo de tratamento normalmente inclui toda a comunidade de fé.
- issue: παρουσία τοῦ κυρίου
  choice: a vinda do Senhor
  alternative: a presença do Senhor
  rationale: “Vinda” comunica melhor a expectativa futura neste contexto, sem impor um esquema escatológico mais específico do que o texto.
- issue: Sujeito de λάβῃ
  choice: o agricultor recebe as chuvas
  alternative: o fruto ou a terra recebe as chuvas
  rationale: A forma verbal singular retoma mais naturalmente “o agricultor”, sujeito explícito da oração, embora o sentido agrícola envolva evidentemente a terra e a plantação recebendo a chuva.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de μακροθυμ- foi refletida por “pacientes” e “mantém-se paciente”. Evitaram-se os termos tradicionais, mas hoje pouco correntes, “chuvas temporãs e serôdias”.
