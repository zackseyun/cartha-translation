revisions:
- from: 'Portanto, irmãos[a], sejam pacientes até a vinda[b] do Senhor. Vejam: o agricultor espera o precioso fruto da terra e, por causa dele, mantém-se paciente até receber as primeiras e as últimas chuvas.[c]'
  to: 'Portanto, irmãos[a], sejam pacientes até a vinda[b] do Senhor. Vejam: o agricultor espera o precioso fruto da terra, esperando pacientemente por ele até receber as primeiras e as últimas chuvas.[c]'
  rationale: A revisão substitui a relação causal indevida de “por causa dele” por “esperando pacientemente por ele”, que expressa a paciente expectativa do agricultor em relação ao fruto. A repetição entre “sejam pacientes” e “pacientemente” preserva, de modo natural, o eco de μακροθυμήσατε/μακροθυμῶν. Mantém-se “até receber”, cujo sujeito gramatical é o agricultor, leitura plenamente possível e preferível na construção grega.
