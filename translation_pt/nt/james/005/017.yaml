source:
  edition: SBLGNT
  text: Ἠλίας ἄνθρωπος ἦν ὁμοιοπαθὴς ἡμῖν, καὶ προσευχῇ προσηύξατο τοῦ μὴ βρέξαι, καὶ οὐκ ἔβρεξεν ἐπὶ τῆς γῆς ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/017.yaml
  text: Elijah was a man with a nature like ours[a], and he prayed earnestly that it would not rain, and it did not rain on the land for three years and six months.
translation:
  language: pt
  text: Elias era um homem como nós[a]. Ele orou com fervor para que não chovesse, e não choveu sobre a terra durante três anos e seis meses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Elias era um homem com uma natureza como a nossa”; ou: “Elias tinha os mesmos sentimentos e paixões que nós”.'
    reason: Alternativas lexicais para ὁμοιοπαθὴς, cujo sentido pode destacar amplamente a condição humana compartilhada ou, mais especificamente, sentimentos e paixões semelhantes.
lexical_decisions:
- source_word: Ἠλίας
  choice: Elias
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do profeta.
- source_word: ἄνθρωπος
  choice: um homem
  rationale: Identifica Elias como ser humano e também preserva naturalmente o fato de que se trata de uma pessoa do sexo masculino.
- source_word: ὁμοιοπαθὴς ἡμῖν
  choice: da mesma condição que nós
  rationale: Expressa a humanidade compartilhada, com suas experiências, limitações e disposições, sem restringir o sentido apenas a sentimentos ou paixões.
- source_word: προσευχῇ προσηύξατο
  choice: orou com fervor
  rationale: A construção cognata intensifica o ato de orar; esta formulação comunica a ênfase de modo natural em português.
- source_word: τοῦ μὴ βρέξαι
  choice: para que não chovesse
  rationale: Transmite de modo idiomático o conteúdo ou propósito da oração, preservando sem resolver a nuance entre ambos.
- source_word: οὐκ ἔβρεξεν
  choice: não choveu
  rationale: Construção impessoal natural em português, correspondente ao verbo grego no contexto.
- source_word: ἐπὶ τῆς γῆς
  choice: sobre a terra
  rationale: Mantém a amplitude lexical de γῆ, que pode se referir à terra ou à região afetada, sem acrescentar um demonstrativo ausente no grego.
- source_word: ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ
  choice: durante três anos e seis meses
  rationale: Expressa naturalmente em português o acusativo de duração.
theological_decisions:
- issue: Sentido de ὁμοιοπαθὴς ao descrever a humanidade de Elias
  choice: Elias compartilhava a mesma condição humana dos leitores.
  alternative: Elias tinha os mesmos sentimentos ou as mesmas paixões que nós.
  rationale: A formulação principal conserva o sentido amplo do adjetivo e o propósito encorajador da comparação, sem reduzir a semelhança apenas à esfera emocional.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A divisão em duas frases evita uma estrutura excessivamente longa sem alterar a progressão do argumento.
