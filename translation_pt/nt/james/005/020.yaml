id: JAS.5.20
reference: James 5:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀γινωσκέτω ὅτι ὁ ἐπιστρέψας ἁμαρτωλὸν ἐκ πλάνης ὁδοῦ αὐτοῦ σώσει ψυχὴν ⸀αὐτοῦ ἐκ θανάτου καὶ καλύψει πλῆθος ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/020.yaml
  text: let him know that whoever turns a sinner back from the error of his way will save his soul from death and will cover a multitude of sins[a][b].
translation:
  language: pt
  text: saiba que aquele que fizer um pecador voltar do erro de seu caminho salvará sua alma da morte[a][b] e cobrirá uma multidão de pecados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «salvará sua vida da morte». A palavra grega pode significar «alma» ou «vida».
    reason: lexical_alternative
  - marker: b
    text: O pronome «sua» pode referir-se ao pecador que é reconduzido; alguns entendem que se refere a quem o faz voltar.
    reason: alternative_reading
lexical_decisions:
- source_word: γινωσκέτω
  choice: saiba
  rationale: O imperativo presente na terceira pessoa do singular é expresso de modo direto e natural em português, mantendo a força de exortação.
- source_word: ὁ ἐπιστρέψας
  choice: quem fizer ... voltar
  rationale: O particípio aoristo com artigo tem sentido substantivado e genérico. A formulação comunica a ação de reconduzir alguém que se desviou, sem recorrer ao termo técnico e potencialmente denominacional «converter».
- source_word: ἁμαρτωλὸν
  choice: um pecador
  rationale: O acusativo singular sem artigo é genérico; «um pecador» é a forma idiomática correspondente em português.
- source_word: ἐκ πλάνης ὁδοῦ αὐτοῦ
  choice: do erro do seu caminho
  rationale: Preserva tanto o sentido de erro ou desvio em πλάνη quanto a imagem de ὁδός como caminho ou modo de viver.
- source_word: σώσει
  choice: salvará
  rationale: Mantém o valor do futuro de σῴζω e seu peso teológico sem restringi-lo a uma modalidade específica de livramento.
- source_word: ψυχὴν αὐτοῦ
  choice: sua alma
  rationale: «Alma» preserva o sentido lexical tradicional de ψυχή, enquanto «sua» mantém no texto principal a ambiguidade do antecedente de αὐτοῦ.
- source_word: ἐκ θανάτου
  choice: da morte
  rationale: Tradução direta que não decide se a morte em vista é física, espiritual ou entendida de maneira mais abrangente.
- source_word: καλύψει
  choice: cobrirá
  rationale: Conserva a metáfora bíblica de cobrir pecados sem substituí-la por uma explicação interpretativa.
- source_word: πλῆθος ἁμαρτιῶν
  choice: uma multidão de pecados
  rationale: Reproduz o substantivo coletivo πλῆθος e mantém o tom elevado, mas compreensível, da expressão.
theological_decisions:
- issue: Antecedente de αὐτοῦ em ψυχὴν αὐτοῦ
  choice: O pronome é traduzido por «sua» sem identificar expressamente o referente.
  alternative: A alma do pecador reconduzido; ou, segundo outra interpretação, a alma de quem o faz voltar.
  rationale: A construção grega permite relacionar o pronome ao pecador e, embora menos provavelmente, à pessoa que o reconduz. O texto principal conserva essa tensão, e a nota registra as duas possibilidades.
- issue: Sentido de ψυχή e θάνατος
  choice: «alma» e «morte» são mantidos em termos amplos.
  alternative: «vida ... da morte»; ou uma explicitação como «alma ... da morte espiritual».
  rationale: O enunciado pode envolver preservação da vida, salvação espiritual ou ambas. A tradução evita limitar o alcance do original a um único esquema doutrinário.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção «fizer ... voltar» evita o tecnicismo religioso de «converter», enquanto «erro do seu caminho», «salvará», «alma» e «cobrirá» preservam as imagens e a abertura semântica do grego.
