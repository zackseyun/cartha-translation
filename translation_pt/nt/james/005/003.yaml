source:
  edition: SBLGNT
  text: ὁ χρυσὸς ὑμῶν καὶ ὁ ἄργυρος κατίωται, καὶ ὁ ἰὸς αὐτῶν εἰς μαρτύριον ὑμῖν ἔσται καὶ φάγεται τὰς σάρκας ὑμῶν· ὡς πῦρ ἐθησαυρίσατε ἐν ἐσχάταις ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/003.yaml
  text: Your gold and silver have rusted[a], and their corrosion will be evidence against you and will eat your flesh like fire[b]. You have stored up treasure in the last days.
translation:
  language: pt
  text: O ouro e a prata de vocês estão corroídos, e a corrosão deles servirá de prova contra vocês e devorará a carne de vocês como fogo.[a] Vocês acumularam tesouros nos últimos dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e devorará a carne de vocês. Vocês acumularam tesouros como fogo nos últimos dias”. Alguns ligam “como fogo” à oração final, embora a ligação com “devorará” pareça mais natural.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατίωται
  choice: estão corroídos
  rationale: O perfeito expressa um estado presente resultante de um processo anterior. “Corroídos” abrange a deterioração de ouro e prata sem restringi-la tecnicamente à ferrugem.
- source_word: ὁ ἰὸς αὐτῶν
  choice: a corrosão deles
  rationale: No contexto de metais, ἰός designa o produto ou efeito corrosivo; “corrosão” mantém a imagem e soa natural em português atual.
- source_word: εἰς μαρτύριον ὑμῖν
  choice: servirá de prova contra vocês
  rationale: A expressão tem força forense. “Prova contra vocês” comunica de modo claro que a própria riqueza deteriorada os incriminará.
- source_word: φάγεται τὰς σάρκας ὑμῶν
  choice: devorará a carne de vocês
  rationale: “Devorará” preserva a imagem concreta, violenta e metafórica de φάγεται; “carne” traduz σάρκας sem substituir a figura por “corpos”.
- source_word: ὡς πῦρ
  choice: como fogo
  rationale: A expressão é ligada, no texto principal, ao verbo precedente, formando a comparação “devorará ... como fogo”.
- source_word: ἐθησαυρίσατε
  choice: acumularam tesouros
  rationale: O verbo contém a ideia de guardar ou acumular tesouro. Esta formulação conserva o conteúdo lexical sem acrescentar explicitamente a nuance interpretativa de “entesourar avidamente”.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: nos últimos dias
  rationale: É a formulação direta e reconhecível para a expressão escatológica, sem acrescentar um demonstrativo ausente do grego.
theological_decisions:
- issue: Relação sintática de ὡς πῦρ
  choice: 'Ligado à oração anterior: a corrosão “devorará a carne de vocês como fogo”.'
  alternative: 'Ligado à oração seguinte: “Vocês acumularam como fogo — ou fogo — nos últimos dias”.'
  rationale: A proximidade sintática e a coerência da imagem favorecem a ligação com φάγεται. Como a pontuação não fazia parte do texto grego original e existe uma leitura alternativa histórica, a ambiguidade genuína é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” explicita o destinatário plural. “Corroídos/corrosão” evita a imprecisão comum de dizer que ouro e prata “enferrujaram”, ao mesmo tempo que preserva a imagem profética de riqueza deteriorada. O marcador [a] aparece no texto principal.
