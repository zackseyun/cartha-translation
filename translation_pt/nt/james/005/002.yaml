lexical_decisions:
- source_word: πλοῦτος
  choice: riqueza
  rationale: “Riqueza” é o equivalente moderno e abrangente para os bens materiais acumulados dos ricos denunciados por Tiago.
- source_word: σέσηπεν
  choice: apodreceu
  rationale: O perfeito grego retrata uma deterioração consumada cujo resultado permanece; “apodreceu” conserva a imagem concreta e vívida.
- source_word: ἱμάτια
  choice: roupas
  rationale: “Roupas” comunica de modo natural e atual a referência ampla a peças de vestuário, sem a formalidade de “vestes”.
- source_word: σητόβρωτα
  choice: comidas pelas traças
  rationale: A expressão reproduz claramente a imagem concreta do adjetivo composto grego e é idiomática em português.
- source_word: γέγονεν
  choice: ficaram
  rationale: “Ficaram” expressa a passagem ao estado resultante indicado pelo perfeito de γίνομαι, com mais naturalidade do que uma formulação literal como “tornaram-se”.
