  text: κατεδικάσατε, ἐφονεύσατε τὸν δίκαιον. οὐκ ἀντιτάσσεται ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/005/006.yaml
  text: You condemned[a], you murdered the righteous one[b]. He does not resist you.
translation:
  language: pt
  text: Vocês condenaram e assassinaram o justo. Ele não resiste a vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele não resiste a vocês?” O texto grego pode ser pontuado como uma pergunta retórica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδικάσατε
  choice: vocês condenaram
  rationale: O aoristo ativo, na segunda pessoa do plural, é vertido naturalmente pelo pretérito perfeito. “Condenaram” preserva o sentido judicial e a força direta da acusação.
- source_word: ἐφονεύσατε
  choice: assassinaram
  rationale: φονεύω denota matar, frequentemente com a carga moral de homicídio. “Assassinaram” mantém a gravidade da denúncia, sem neutralizá-la como simples ato de matar.
- source_word: τὸν δίκαιον
  choice: o justo
  rationale: O adjetivo masculino singular substantivado significa literalmente “o justo”. A formulação concisa preserva tanto a leitura representativa de uma pessoa justa oprimida quanto a possível ressonância de um título cristológico, sem decidir entre elas.
- source_word: οὐκ ἀντιτάσσεται ὑμῖν
  choice: Ele não oferece resistência a vocês
  rationale: ἀντιτάσσομαι significa colocar-se contra, opor-se ou resistir. A tradução declarativa comunica a provável força retórica da pergunta grega; “oferece resistência” soa natural em português e mantém o referente singular.
theological_decisions:
- issue: Referente de “o justo”
  choice: Manter “o justo” sem identificar explicitamente o referente
  alternative: Entender como uma pessoa justa representativa, ou especificamente como Jesus, “o Justo”
  rationale: O contexto imediato denuncia ricos opressores e permite que o singular represente a pessoa justa oprimida. Ao mesmo tempo, a expressão pode evocar Jesus como “o Justo”. A tradução conserva deliberadamente essa tensão.
- issue: Força da oração final
  choice: 'Declaração: “Ele não oferece resistência a vocês”'
  alternative: 'Pergunta: “Ele não oferece resistência a vocês?”'
  rationale: A edição grega pontua a oração como pergunta com οὐ, mas ela pode funcionar retoricamente para expressar a ausência de resistência. A declaração é mais clara no português corrente, enquanto a forma interrogativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira e compreensão internacional. “Vocês” explicita naturalmente a segunda pessoa do plural. A coordenação com “e” evita uma sequência truncada sem enfraquecer a dupla acusação.
