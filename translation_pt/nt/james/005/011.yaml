id: JAS.5.11
reference: James 5:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδοὺ μακαρίζομεν τοὺς ⸀ὑπομείναντας· τὴν ὑπομονὴν Ἰὼβ ἠκούσατε, καὶ τὸ τέλος κυρίου ⸀εἴδετε, ὅτι πολύσπλαγχνός ἐστιν ⸂ὁ κύριος⸃ καὶ οἰκτίρμων.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/011.yaml
  text: Behold, we count those who have endured as blessed. You have heard of Job’s endurance, and you have seen the Lord’s outcome, that the Lord is very compassionate and merciful.
translation:
  language: pt
  text: 'Vejam: consideramos felizes os que perseveraram. Vocês ouviram falar da perseverança de Jó e viram o desfecho do Senhor, pois o Senhor é cheio de compaixão e misericórdia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: Vejam
  rationale: Interjeição natural em português moderno que chama a atenção dos leitores sem a rigidez de “eis”.
- source_word: μακαρίζομεν
  choice: consideramos felizes
  rationale: Expressa a ideia de declarar ou reconhecer alguém como favorecido e feliz, preservando o “nós” do verbo grego.
- source_word: ὑπομείναντας / ὑπομονήν
  choice: os que perseveraram / perseverança
  rationale: Mantém a ligação lexical entre o verbo e o substantivo, destacando a constância sob provação.
- source_word: τὸ τέλος κυρίου
  choice: o desfecho que o Senhor lhe deu
  rationale: τέλος aqui aponta para o resultado final da provação de Jó; a formulação explicita de modo natural a relação com o Senhor sem traduzir como “propósito”, sentido possível mas menos diretamente contextual.
- source_word: πολύσπλαγχνος
  choice: cheio de compaixão
  rationale: Reproduz a força intensiva do termo, que descreve profunda ternura e compaixão.
- source_word: οἰκτίρμων
  choice: misericórdia
  rationale: Na construção “cheio de”, o substantivo forma uma expressão portuguesa natural e preserva a distinção em relação a “compaixão”.
theological_decisions:
- issue: Sentido de τὸ τέλος κυρίου
  choice: o desfecho que o Senhor lhe deu
  alternative: o propósito do Senhor; o fim do Senhor
  rationale: O contexto evoca o resultado da perseverança de Jó e a ação compassiva do Senhor. A tradução evita impor a leitura abstrata de “propósito” e também evita o ambíguo “fim do Senhor”, que em português poderia sugerir a morte do Senhor.
- issue: Referência de κυρίου
  choice: Senhor
  alternative: o senhor
  rationale: No contexto de Jó e da afirmação sobre compaixão e misericórdia, a referência é ao Deus de Israel; a capitalização segue o uso português para o título divino.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural “vocês”, de ampla legibilidade brasileira. A repetição de “perseveraram/perseverança” preserva a coesão do grego. Não há marcadores de nota porque nenhuma nota foi necessária.
