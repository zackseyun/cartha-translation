id: JAS.5.18
reference: James 5:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πάλιν προσηύξατο, καὶ ὁ οὐρανὸς ⸂ὑετὸν ἔδωκεν⸃ καὶ ἡ γῆ ἐβλάστησεν τὸν καρπὸν αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/018.yaml
  text: And he prayed again[a], and the sky gave rain[b], and the earth produced its fruit.
translation:
  language: pt
  text: E orou de novo, e o céu deu chuva, e a terra produziu o seu fruto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a terra fez brotar o seu fruto” ou “a terra produziu a sua colheita”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: de novo
  rationale: Marca a repetição da oração de Elias; é uma forma natural e concisa em português.
- source_word: προσηύξατο
  choice: orou
  rationale: O aoristo de προσεύχομαι significa simplesmente que ele orou; não se acrescenta aqui a ideia de intensidade, expressa no versículo anterior.
- source_word: ὁ οὐρανὸς
  choice: o céu
  rationale: No contexto meteorológico, designa o céu visível. Em português, “céu” preserva naturalmente tanto o termo grego quanto o sentido contextual.
- source_word: ὑετὸν ἔδωκεν
  choice: deu chuva
  rationale: Reproduz de perto a expressão grega e continua clara e digna em português, sem substituir a agência verbal por “mandou” ou “fez cair”.
- source_word: ἡ γῆ
  choice: a terra
  rationale: Mantém o paralelismo com “o céu” e abrange o sentido agrícola de solo ou terra cultivada.
- source_word: ἐβλάστησεν
  choice: produziu
  rationale: Com καρπός como objeto, “produziu” comunica naturalmente o resultado agrícola do brotar e crescer.
- source_word: τὸν καρπὸν αὐτῆς
  choice: o seu fruto
  rationale: Preserva a formulação ampla do grego; no contexto, “fruto” inclui a produção agrícola sem restringi-la a uma única colheita.
theological_decisions:
- issue: A oração de Elias e a resposta divina
  choice: Descrever o resultado observável da oração sem explicitar uma agência divina que esta frase deixa implícita.
  alternative: “Deus mandou chuva, e a terra produziu...”
  rationale: O contexto indica a resposta de Deus, mas a redação do versículo afirma que o céu deu chuva e a terra produziu seu fruto. A tradução preserva essa forma de expressão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural para brasileiros. A construção mantém o tom simples e digno do original. O marcador [a] está ligado à expressão final, que admite alternativas agrícolas mais explícitas.
