id: JAS.5.1
reference: James 5:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἄγε νῦν οἱ πλούσιοι, κλαύσατε ὀλολύζοντες ἐπὶ ταῖς ταλαιπωρίαις ὑμῶν ταῖς ἐπερχομέναις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/001.yaml
  text: Come now[a], you rich, weep[b], wailing over the miseries that are coming upon you.
translation:
  language: pt
  text: Agora, vocês que são ricos, chorem, lamentando em alta voz por causa das desgraças que estão vindo sobre vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Desgraças” também pode ser traduzido por “calamidades”, “aflições” ou “misérias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: Agora
  rationale: Funciona como marcador discursivo incisivo que introduz uma convocação ou denúncia. Em português corrente, “Agora” preserva a brusquidão sem recorrer a uma expressão artificial como “Vinde agora”.
- source_word: οἱ πλούσιοι
  choice: vocês que são ricos
  rationale: O nominativo tem função vocativa. A formulação explicita naturalmente o chamado direto em português e mantém o referente amplo.
- source_word: κλαύσατε
  choice: chorem
  rationale: O imperativo aoristo ordena lamento manifesto; “chorem” é direto, claro e solene.
- source_word: ὀλολύζοντες
  choice: lamentando em alta voz
  rationale: O particípio descreve lamento intenso e audível. A expressão comunica melhor esse valor do que apenas “lamentando”, enquanto evita a conotação animal que “uivando” pode ter no português contemporâneo.
- source_word: ἐπὶ ταῖς ταλαιπωρίαις
  choice: por causa das desgraças
  rationale: ἐπί com dativo indica aqui a causa ou ocasião do lamento. “Por causa de” é idiomático e “desgraças” comunica aflições ou calamidades severas.
- source_word: ὑμῶν ταῖς ἐπερχομέναις
  choice: que estão vindo sobre vocês
  rationale: O particípio presente modifica as desgraças e as apresenta como ameaças em aproximação. “Sobre vocês” expressa o dativo possessivo afetado de modo natural, sem transformar as desgraças em simples posse.
theological_decisions:
- issue: Tom e referente da interpelação aos ricos
  choice: Denúncia profética dirigida aos ricos diante de desgraças iminentes, sem especificar neste versículo se são crentes ou descrentes.
  alternative: Restringir a fala a proprietários opressores descrentes ou a membros ricos da comunidade cristã.
  rationale: O texto interpela diretamente os ricos e anuncia as desgraças que virão sobre eles, mas este versículo isolado não define seu vínculo com a comunidade da fé. A tradução preserva essa abertura e o tom de juízo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição sonora de “chorem, lamentando em alta voz” preserva a intensificação do grego. O marcador de nota [a] aparece no texto principal.
