  text: ἐὰν γὰρ εἰσέλθῃ ⸀εἰς συναγωγὴν ὑμῶν ἀνὴρ χρυσοδακτύλιος ἐν ἐσθῆτι λαμπρᾷ, εἰσέλθῃ δὲ καὶ πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/002.yaml
  text: For if a man wearing gold rings and bright clothing enters into your assembly[a], and a poor man in filthy clothing also enters,
translation:
  language: pt
  text: Pois, se entrar na reunião de vocês[a] um homem com anéis de ouro, vestindo roupa esplêndida, e entrar também um homem pobre, vestindo roupa suja,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sinagoga”; o termo grego synagōgē também pode significar “assembleia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγήν
  choice: reunião
  rationale: Neste contexto, designa o encontro da comunidade. “Reunião” é natural em português e evita sugerir necessariamente uma instituição judaica formal; a alternativa literal é preservada em nota.
- source_word: ἀνὴρ
  choice: um homem
  rationale: O grego emprega explicitamente um substantivo masculino singular para o primeiro indivíduo do exemplo.
- source_word: χρυσοδακτύλιος
  choice: com anéis de ouro
  rationale: O adjetivo descreve alguém adornado de ouro nos dedos. A formulação é natural e preserva a imagem de riqueza ostensiva sem impor que se trate de apenas um anel.
- source_word: ἐσθῆτι λαμπρᾷ
  choice: roupa esplêndida
  rationale: λαμπρός pode indicar algo brilhante, magnífico ou requintado; “esplêndida” conserva tanto o destaque visual quanto a impressão social da vestimenta.
- source_word: πτωχὸς
  choice: um pobre
  rationale: O adjetivo substantivado está no masculino singular e forma o contraste retórico com “um homem” rico.
- source_word: ῥυπαρᾷ ἐσθῆτι
  choice: roupa suja
  rationale: ῥυπαρός indica sujeira ou imundície. “Suja” comunica diretamente essa condição em português atual, sem substituí-la pela ideia distinta de roupa meramente gasta.
- source_word: εἰσέλθῃ ... εἰσέλθῃ
  choice: entrar ... entrar também
  rationale: A repetição do mesmo verbo preserva o paralelismo deliberado do cenário hipotético grego.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz uma ilustração explicativa ligada à proibição da parcialidade no contexto anterior.
theological_decisions:
- issue: Sentido de συναγωγή em uma carta dirigida a uma comunidade cristã
  choice: reunião
  alternative: sinagoga
  rationale: O termo pode designar tanto uma sinagoga quanto uma assembleia ou reunião. O contexto favorece o encontro comunitário, mas não autoriza apagar a terminologia judaica potencialmente significativa; por isso, “sinagoga” consta na nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a estrutura condicional e o paralelismo do grego. “Roupa esplêndida” evita reduzir λαμπρός apenas à cor ou ao brilho físico; “roupa suja” preserva a força concreta de ῥυπαρός.
