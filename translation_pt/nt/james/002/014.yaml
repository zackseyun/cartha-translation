id: JAS.2.14
reference: James 2:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Τί ὄφελος, ἀδελφοί μου, ἐὰν πίστιν λέγῃ τις ἔχειν ἔργα δὲ μὴ ἔχῃ; μὴ δύναται ἡ πίστις σῶσαι αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/014.yaml
  text: What good is it[a], my brothers[c][b], if someone says he has faith but does not have works? Can that faith save him?
translation:
  language: pt
  text: De que adianta, meus irmãos,[a] alguém dizer que tem fé, mas não ter obras? Será que essa fé pode salvá-lo?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus irmãos e minhas irmãs”. O grego emprega o plural masculino “irmãos” como forma representativa de se dirigir à comunidade dos fiéis.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “Será que tal fé pode salvá-lo?”; literalmente, “Será que a fé pode salvá-lo?”. O artigo grego retoma o tipo de fé que acabou de ser mencionado: uma fé declarada, mas sem obras.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὄφελος
  choice: De que adianta
  rationale: Expressão idiomática e natural em português para a pergunta retórica sobre proveito ou benefício prático.
- source_word: ἀδελφοί μου
  choice: meus irmãos
  rationale: Mantém a forma masculina plural do grego como modo representativo de dirigir-se à comunidade cristã; a abrangência é esclarecida em nota.
- source_word: πίστιν
  choice: fé
  rationale: É a correspondência habitual de πίστις e, neste contexto, designa a fé que alguém afirma possuir.
- source_word: λέγῃ τις ἔχειν
  choice: alguém dizer que tem
  rationale: Reproduz de perto a formulação grega sem intensificá-la para 'alegar' ou 'afirmar possuir'.
- source_word: ἔργα
  choice: obras
  rationale: Preserva o termo tradicional e a ligação lexical com o argumento de Tiago 2 acerca de fé e obras.
- source_word: μὴ ἔχῃ
  choice: não ter
  rationale: Mantém a negação da posse em paralelo direto com 'dizer que tem fé'.
- source_word: μὴ δύναται
  choice: Será que ... pode
  rationale: Formula uma pergunta retórica que, em português, sugere naturalmente a resposta negativa esperada pelo uso grego de μή.
- source_word: ἡ πίστις
  choice: essa fé
  rationale: Expressa a força anafórica do artigo grego, remetendo à fé recém-descrita, professada sem obras, sem transformar a frase numa negação genérica de toda fé.
- source_word: σῶσαι αὐτόν
  choice: salvá-lo
  rationale: Mantém o sentido soteriológico usual de σῴζω e o referente masculino singular do original.
theological_decisions:
- issue: Relação entre fé e obras na pergunta retórica
  choice: A pergunta refere-se à fé específica que alguém diz ter, mas que não é acompanhada de obras.
  alternative: 'Traduzir genericamente: ''Pode a fé salvá-lo?'''
  rationale: O artigo em ἡ πίστις retoma a fé mencionada imediatamente antes. 'Essa fé' preserva a tensão do argumento sem impor uma solução doutrinária externa nem fazer uma afirmação indiscriminada sobre a fé.
- issue: Forma de tratamento e referência de gênero
  choice: Manter 'meus irmãos' e 'salvá-lo' no texto principal.
  alternative: Usar 'meus irmãos e minhas irmãs' e uma referência neutra.
  rationale: A tradução conserva as formas masculinas do grego, empregadas representativamente, enquanto a nota esclarece que a comunidade de fiéis como um todo está em vista.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. 'De que adianta' comunica diretamente a força retórica; 'obras' conserva a terminologia e a continuidade do argumento. A colocação pronominal em 'salvá-lo' mantém registro escrito corrente sem soar arcaica.
