id: JAS.2.10
reference: James 2:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅστις γὰρ ὅλον τὸν νόμον ⸂τηρήσῃ, πταίσῃ⸃ δὲ ἐν ἑνί, γέγονεν πάντων ἔνοχος.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/010.yaml
  text: For whoever keeps the whole law but stumbles in one point has become guilty of all of it[a][b].
translation:
  language: pt
  text: Pois quem guardar toda a lei, mas tropeçar em um só ponto[a], torna-se culpado de toda ela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “falhar em uma só coisa” ou “violar uma só parte dela”. O grego diz literalmente “tropeçar em um”, usando uma metáfora para a falha moral.
    reason: lexical_alternative
  - marker: b
    text: Ou “torna-se responsável por toda ela”. A expressão indica que violar uma parte torna a pessoa responsável em relação à lei inteira.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅστις
  choice: quem
  rationale: Pronome relativo indefinido que introduz um princípio geral; “quem” é natural em português e preserva seu alcance universal.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior, preservando de modo conciso a conexão lógica.
- source_word: ὅλον τὸν νόμον
  choice: toda a lei
  rationale: Expressa a totalidade da lei de maneira clara e idiomática em português.
- source_word: τηρήσῃ
  choice: guardar
  rationale: No contexto de mandamentos, τηρέω significa guardar, observar ou cumprir; “guardar” conserva a formulação bíblica corrente sem perder clareza.
- source_word: πταίσῃ
  choice: tropeçar
  rationale: Preserva a metáfora grega do tropeço aplicada à falha moral ou transgressão.
- source_word: ἐν ἑνί
  choice: em um só ponto
  rationale: Indica uma única matéria ou exigência da lei; “só” torna explícita a singularidade enfatizada pelo contexto.
- source_word: γέγονεν
  choice: torna-se
  rationale: Comunica a entrada em um estado resultante. Embora o perfeito grego também permita “tornou-se”, o presente português funciona naturalmente na formulação de um princípio geral.
- source_word: πάντων
  choice: de toda ela
  rationale: Retoma a lei como um todo e expressa responsabilidade em relação à sua totalidade, sem sugerir necessariamente que cada mandamento foi violado individualmente.
- source_word: ἔνοχος
  choice: culpado
  rationale: Transmite com clareza a culpabilidade ou sujeição à responsabilidade no contexto moral e jurídico.
theological_decisions:
- issue: Alcance da culpabilidade em relação à lei
  choice: A violação de um só ponto torna a pessoa culpada em relação à lei inteira.
  alternative: A pessoa teria cometido individualmente todas as transgressões, ou todos os pecados teriam exatamente a mesma gravidade.
  rationale: πάντων ἔνοχος indica responsabilidade perante o todo, mas não afirma que cada mandamento tenha sido individualmente violado nem que todas as transgressões sejam idênticas em gravidade. A tradução mantém essa tensão sem impor uma formulação doutrinária posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Guardar a lei” mantém uma expressão bíblica conhecida; “tropeçar” preserva a metáfora do original. Os marcadores de ambas as notas aparecem no texto principal.
