id: JAS.2.19
reference: James 2:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: σὺ πιστεύεις ὅτι ⸂εἷς ἐστιν ὁ θεός⸃; καλῶς ποιεῖς· καὶ τὰ δαιμόνια πιστεύουσιν καὶ φρίσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/019.yaml
  text: You believe that God is one[a]; you do well[b]. Even the demons believe—and shudder.
translation:
  language: pt
  text: Você crê que Deus é um só[a]; faz bem. Até os demônios creem — e estremecem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que há um só Deus”. O grego admite as duas formulações; “Deus é um só” segue mais de perto sua construção e pode evocar a confissão judaica da unicidade de Deus.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “tremem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ πιστεύεις
  choice: Você crê
  rationale: O pronome explícito mantém a interpelação direta e enfática no singular. “Crê” introduz naturalmente, em português, o conteúdo afirmado pela oração seguinte e preserva a repetição de πιστεύω no versículo.
- source_word: ὅτι εἷς ἐστιν ὁ θεός
  choice: que Deus é um só
  rationale: Segue de perto a construção predicativa grega e preserva a possível ressonância da confissão judaica da unicidade de Deus. “Um só” soa mais natural em português do que simplesmente “um” e não acrescenta a ideia distinta de que Deus esteja sozinho.
- source_word: καλῶς ποιεῖς
  choice: faz bem
  rationale: Expressão portuguesa breve e corrente que reproduz a aprovação inicial, possivelmente irônica no contexto, sem explicitar um tom que o grego deixa ao leitor inferir.
- source_word: καὶ τὰ δαιμόνια
  choice: Até os demônios
  rationale: '“Até” comunica a força ascendente de καί e realça o argumento: esse mesmo tipo de crença também existe entre os demônios.'
- source_word: πιστεύουσιν
  choice: creem
  rationale: Repete o mesmo verbo empregado para πιστεύεις, repetição essencial ao contraste retórico de Tiago.
- source_word: φρίσσουσιν
  choice: estremecem
  rationale: Expressa uma reação intensa e involuntária de medo, adequada ao sentido de φρίσσω. “Tremem” é possível, mas um pouco menos vívido.
theological_decisions:
- issue: Forma da confissão monoteísta εἷς ἐστιν ὁ θεός
  choice: Deus é um só
  alternative: há um só Deus
  rationale: A opção escolhida conserva a forma predicativa do grego e sua provável evocação da confissão da unicidade de Deus, sem transformar a frase numa afirmação primariamente existencial.
- issue: Contraste entre a crença humana e a dos demônios
  choice: Até os demônios creem — e estremecem
  alternative: Também os demônios creem e tremem
  rationale: '“Até” torna clara a força retórica de καί, enquanto o travessão destaca a consequência aterradora sem acrescentar conteúdo. A redação preserva a tensão do texto: a correção de uma afirmação doutrinária, por si só, não distingue a pessoa dos demônios.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Mantém-se a interpelação no singular, a repetição de “crer” e a concisão contundente do original. O marcador [b] foi colocado junto de “estremecem”, termo ao qual a alternativa lexical se refere.
