id: JAS.2.6
reference: James 2:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ ἠτιμάσατε τὸν πτωχόν. οὐχ οἱ πλούσιοι καταδυναστεύουσιν ὑμῶν, καὶ αὐτοὶ ἕλκουσιν ὑμᾶς εἰς κριτήρια;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/006.yaml
  text: But you have dishonored the poor man[b][a]. Is it not the rich who oppress you and themselves drag you into courts?
translation:
  language: pt
  text: Mas vocês desonraram o pobre.[a] Não são os ricos que oprimem vocês e que são eles mesmos que arrastam vocês aos tribunais?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a pessoa pobre” ou, em sentido mais geral, “os pobres”. O grego está no singular e provavelmente retoma o exemplo específico dos versículos anteriores, ao mesmo tempo que representa os pobres de modo mais amplo.
    reason: lexical_alternative
  - marker: b
    text: Ou “às cortes de justiça”. O termo grego se refere a tribunais judiciais.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠτιμάσατε
  choice: desonraram
  rationale: Preserva a dimensão de honra e vergonha do verbo, comunicando que o pobre foi tratado sem a dignidade devida.
- source_word: τὸν πτωχόν
  choice: o pobre
  rationale: Mantém o singular substantivado e sua ligação com o homem pobre apresentado nos versículos anteriores, sem impedir seu valor representativo.
- source_word: οἱ πλούσιοι
  choice: os ricos
  rationale: Equivalente natural e conciso para o adjetivo substantivado, preservando a referência ao grupo social.
- source_word: καταδυναστεύουσιν
  choice: oprimem
  rationale: Expressa o exercício abusivo e hostil de poder sem especificar indevidamente a forma da opressão.
- source_word: ἕλκουσιν
  choice: arrastam
  rationale: Conserva a imagem vívida de condução forçada no contexto de uma ação judicial.
- source_word: κριτήρια
  choice: tribunais
  rationale: Designa com clareza os órgãos ou locais judiciais envolvidos no contexto.
- source_word: καὶ αὐτοὶ
  choice: e que eles mesmos
  rationale: 'Torna explícita em português a ênfase do pronome grego: são justamente os ricos que praticam essa ação.'
- source_word: οὐχ ... ;
  choice: Não são ...?
  rationale: Reproduz naturalmente a pergunta retórica que espera resposta afirmativa.
theological_decisions:
- issue: Referência do singular τὸν πτωχόν
  choice: Um pobre representativo no cenário da reunião, com aplicação mais ampla aos pobres
  alternative: Um singular coletivo com o sentido genérico de “os pobres”
  rationale: O contexto imediato descreve um homem pobre específico (2.2–3); conservar o singular mantém o fluxo do argumento, sem eliminar seu alcance representativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o contraste enfático de δέ, a pergunta retórica e a força coerciva de ἕλκουσιν. Os marcadores foram posicionados imediatamente após os termos a que se referem.
