id: JAS.2.23
reference: James 2:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα· Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην, καὶ φίλος θεοῦ ἐκλήθη.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/023.yaml
  text: And the Scripture was fulfilled that says[a], “Abraham believed God, and it was counted to him as righteousness,” and he was called a friend of God.
translation:
  language: pt
  text: 'E cumpriu-se a Escritura que diz: “Abraão creu em Deus, e isso lhe foi atribuído como justiça”[a]; e ele foi chamado amigo de Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “levado em conta”; o verbo grego também pode ser traduzido por “creditado”.
    reason: Registra alternativas legítimas para λογίζομαι, cuja imagem pode envolver cálculo, crédito ou atribuição.
lexical_decisions:
- source_word: ἐπληρώθη
  choice: cumpriu-se
  rationale: Expressa naturalmente em português o passivo em uma fórmula de cumprimento das Escrituras, sem explicar além do texto como esse cumprimento ocorreu.
- source_word: ἡ γραφὴ ἡ λέγουσα
  choice: a Escritura que diz
  rationale: Mantém o singular definido e a fórmula de citação, com redação corrente e digna.
- source_word: Ἐπίστευσεν ... Ἀβραὰμ τῷ θεῷ
  choice: Abraão creu em Deus
  rationale: É a formulação portuguesa tradicional e concisa para πιστεύω com dativo neste contexto, preservando a ideia de Abraão dar crédito a Deus sem acrescentar uma paráfrase interpretativa.
- source_word: ἐλογίσθη αὐτῷ
  choice: isso lhe foi atribuído
  rationale: O pronome “isso” torna explícito em português o sujeito implícito, isto é, o fato de Abraão crer. “Foi atribuído” conserva a nuance de imputação ou contabilização do verbo sem soar excessivamente técnico.
- source_word: εἰς δικαιοσύνην
  choice: como justiça
  rationale: Reproduz de modo direto a função predicativa da expressão e preserva a terminologia consolidada da citação de Gênesis.
- source_word: φίλος θεοῦ
  choice: amigo de Deus
  rationale: Mantém de forma natural a relação expressa pelo genitivo, sem especificar além do grego a natureza dessa designação.
- source_word: ἐκλήθη
  choice: foi chamado
  rationale: Preserva a amplitude do passivo de καλέω, que pode indicar designação ou reconhecimento.
theological_decisions:
- issue: Relação entre a fé e as obras de Abraão no argumento de Tiago
  choice: Preservar a afirmação de que a Escritura se cumpriu, sem explicar no próprio versículo de que modo a ação obediente de Abraão se relaciona com sua fé.
  alternative: Resolver explicitamente a tensão em favor de uma leitura exclusivamente forense ou fazer das obras um substituto da fé.
  rationale: O texto liga a citação de Gênesis 15:6 ao argumento imediato de Tiago, mas não formula aqui uma solução sistemática para debates posteriores sobre justificação.
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: “Justiça” mantém o termo bíblico reconhecível e se ajusta à citação de Gênesis, enquanto “retidão” poderia estreitar o sentido à qualidade moral.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A sintaxe é solene sem ser arcaica. O ponto e vírgula após a citação ajuda a distinguir a segunda afirmação coordenada.
