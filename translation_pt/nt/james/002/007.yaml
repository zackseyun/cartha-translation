  text: Do not they themselves blaspheme the good name that was called upon you?[a][b]
translation:
  language: pt
  text: Não são eles mesmos que blasfemam contra o bom nome que foi invocado sobre vocês?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o nome honroso» ou «o nome nobre».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «pronunciado sobre vocês»; a expressão provavelmente se refere ao nome que identifica os fiéis e talvez evoque linguagem de aliança ou de batismo.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ αὐτοὶ
  choice: Não são eles mesmos que
  rationale: A pergunta retórica espera resposta afirmativa, e «eles mesmos» preserva a ênfase de αὐτοὶ nos ricos mencionados anteriormente.
- source_word: βλασφημοῦσιν
  choice: blasfemam contra
  rationale: O verbo pode significar difamar ou falar de modo insultuoso, mas, tendo como objeto o nome ligado à identidade dos fiéis e provavelmente ao Senhor, «blasfemam contra» preserva sua força religiosa e desonrosa.
- source_word: τὸ καλὸν ὄνομα
  choice: o bom nome
  rationale: A expressão preserva a formulação grega e permite os sentidos de nome honroso, nobre ou digno sem identificar de maneira excessivamente explícita seu referente.
- source_word: τὸ ἐπικληθὲν ἐφ’ ὑμᾶς
  choice: invocado sobre vocês
  rationale: A construção indica que um nome foi pronunciado ou invocado sobre alguém. Esta formulação conserva tanto a passividade quanto a imagem espacial do original, sem reduzi-la simplesmente ao nome pelo qual os fiéis são chamados.
theological_decisions:
- issue: Referente de «o bom nome»
  choice: Manter uma referência ampla ao nome honroso invocado sobre os fiéis, provavelmente o nome de Jesus ou do Senhor associado a eles.
  alternative: Explicitar «o nome de Cristo», «o nome de Deus» ou «o nome de cristãos».
  rationale: O grego não identifica diretamente o nome, embora Tiago 2:1 torne provável a referência cristológica. A tradução mantém a tensão e evita tornar explícito o que o texto deixa implícito.
- issue: Possível linguagem pactual ou batismal
  choice: Preservar a expressão «invocado sobre vocês».
  alternative: Parafrasear como «pelo qual vocês são chamados».
  rationale: A construção pode evocar identificação comunitária, linguagem de aliança ou o nome pronunciado no batismo. A formulação escolhida conserva essas possibilidades sem decidir entre elas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Vocês» oferece clareza internacional e naturalidade no Brasil; «invocado sobre» retém deliberadamente a imagem incomum do grego.
