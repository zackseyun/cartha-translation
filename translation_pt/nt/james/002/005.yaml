id: JAS.2.5
reference: James 2:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀκούσατε, ἀδελφοί μου ἀγαπητοί. οὐχ ὁ θεὸς ἐξελέξατο τοὺς πτωχοὺς ⸂τῷ κόσμῳ⸃ πλουσίους ἐν πίστει καὶ κληρονόμους τῆς βασιλείας ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/005.yaml
  text: 'Listen[c][b][a], my beloved brothers: has not God chosen those who are poor in the world to be rich in faith and heirs of the kingdom that he promised to those who love him?'
translation:
  language: pt
  text: 'Escutem, meus amados irmãos[a]: não escolheu Deus os pobres segundo o mundo[b] para serem ricos na fé[c] e herdeiros do Reino que ele prometeu aos que o amam?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus amados irmãos e irmãs”; o grego diz “irmãos”, termo que pode abranger toda a comunidade cristã.
    reason: alternative_reading
  - marker: b
    text: Ou “pobres aos olhos do mundo” ou “pobres pelos padrões do mundo”.
    reason: lexical_alternative
  - marker: c
    text: “Fé” também pode ser traduzida por “confiança” ou, com menor probabilidade aqui, “fidelidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατε
  choice: Escutem
  rationale: Imperativo aoristo plural que chama enfaticamente a atenção dos destinatários. “Escutem” é direto, natural e amplamente compreensível em português.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: meus amados irmãos
  rationale: Preserva o masculino plural do grego e traduz ἀγαπητοί de modo digno e afetivo. Como o vocativo provavelmente abrange toda a comunidade cristã, a possibilidade inclusiva é indicada em nota.
- source_word: οὐχ ὁ θεὸς ἐξελέξατο
  choice: não escolheu Deus
  rationale: Mantém a pergunta retórica, que espera resposta afirmativa, e verte ἐξελέξατο pelo termo comum “escolheu”, sem acrescentar um sistema doutrinário.
- source_word: τοὺς πτωχοὺς τῷ κόσμῳ
  choice: os pobres segundo o mundo
  rationale: 'Conserva a relação ambígua do dativo τῷ κόσμῳ, entendida como esfera ou critério: pobres no que diz respeito ao mundo ou segundo seus padrões.'
- source_word: πλουσίους ἐν πίστει
  choice: ricos na fé
  rationale: Reproduz o contraste entre pobreza segundo o mundo e riqueza no âmbito da πίστις. “Fé” é a acepção mais provável no contexto, sem excluir totalmente “confiança” ou “fidelidade”.
- source_word: κληρονόμους τῆς βασιλείας
  choice: herdeiros do Reino
  rationale: “Herdeiros” preserva a imagem jurídico-familiar de κληρονόμοι. “Reino” mantém a referência teológica sem explicá-la além do texto.
- source_word: ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν
  choice: que ele prometeu aos que o amam
  rationale: Formulação portuguesa natural que conserva o Reino como objeto da promessa e os que amam a Deus como seus destinatários.
theological_decisions:
- issue: Possível sobreinterpretação doutrinária da escolha divina
  choice: Traduzir ἐξελέξατο simplesmente por “escolheu”.
  alternative: Empregar linguagem interpretativa que explicite predestinação ou uma ordem salvífica.
  rationale: O versículo afirma a escolha de Deus no argumento contra a parcialidade, mas não define aqui um sistema de eleição. A tradução preserva a afirmação sem resolver debates posteriores.
- issue: Abrangência de ἀδελφοί
  choice: Manter “irmãos” no texto e registrar em nota a provável inclusão de mulheres.
  alternative: Usar “irmãos e irmãs” diretamente no texto.
  rationale: O substantivo grego está no masculino plural, embora possa funcionar como forma coletiva para toda a comunidade. A nota preserva simultaneamente a forma e o provável alcance.
- issue: Sentido de πίστις
  choice: Usar “fé” no texto principal.
  alternative: Traduzir por “confiança” ou, com menor probabilidade neste contexto, “fidelidade”.
  rationale: Na expressão “ricos na fé”, o sentido mais natural é fé ou confiança em Deus. A opção não transforma a palavra em mérito moral, e as possibilidades lexicais secundárias ficam documentadas.
- issue: Relação entre pobreza e o mundo em τῷ κόσμῳ
  choice: Traduzir “pobres segundo o mundo”, preservando a noção de critério ou esfera.
  alternative: Traduzir “pobres aos olhos do mundo” ou “pobres em bens deste mundo”.
  rationale: O dativo permite mais de uma nuance. A formulação escolhida evita limitar a pobreza apenas à percepção social ou apenas à falta de bens materiais.
translation_notes:
  register: Português moderno, digno e de leitura natural, com boa legibilidade brasileira e compreensão internacional. A ordem “não escolheu Deus” sustenta o tom retórico solene sem se tornar arcaica. As notas preservam ambiguidades reais de gênero referencial, do dativo τῷ κόσμῳ e de πίστις.
