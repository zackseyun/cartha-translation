id: JAS.2.8
reference: James 2:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἰ μέντοι νόμον τελεῖτε βασιλικὸν κατὰ τὴν γραφήν Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν, καλῶς ποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/james/002/008.yaml
  text: If[a], however, you are fulfilling the royal law according to the Scripture, “You shall love your neighbor as yourself,” you are doing well.
translation:
  language: pt
  text: 'Se, contudo, vocês cumprem a lei régia[a] segundo a Escritura: “Ame o seu próximo como a si mesmo”, fazem bem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lei real”. A expressão grega pode destacar uma origem régia, sua posição superior ou sua relação com o reino.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μέντοι
  choice: Se, contudo
  rationale: Mantém a força condicional de εἰ e a leve contraposição ou ressalva de μέντοι em português atual.
- source_word: νόμον ... βασιλικὸν
  choice: a lei régia
  rationale: Preserva de modo conciso o sentido de uma lei caracterizada como real, sem decidir se o adjetivo destaca sua origem no Rei, sua associação com o reino ou sua posição superior.
- source_word: τελεῖτε
  choice: cumprem
  rationale: Expressa a execução efetiva da exigência da lei e reproduz naturalmente o presente grego.
- source_word: κατὰ τὴν γραφήν
  choice: segundo a Escritura
  rationale: Conserva o singular com artigo e indica conformidade com o texto escriturístico citado.
- source_word: Ἀγαπήσεις
  choice: Ame
  rationale: Traduz o futuro grego com função imperativa por uma forma de mandamento natural em português, preservando o valor de ordem da citação de Levítico 19:18.
- source_word: τὸν πλησίον σου
  choice: o seu próximo
  rationale: Emprega a expressão bíblica estabelecida para a pessoa com quem se tem uma responsabilidade ética.
- source_word: ὡς σεαυτόν
  choice: como a si mesmo
  rationale: Mantém a comparação concisa do grego sem acrescentar um verbo ausente.
- source_word: καλῶς ποιεῖτε
  choice: fazem bem
  rationale: Transmite de forma direta e idiomática a aprovação da conduta expressa no presente.
theological_decisions:
- issue: Sentido de “lei régia”
  choice: Uma lei caracterizada como régia, sem especificar no texto se isso aponta principalmente para sua origem, sua posição suprema ou sua relação com o reino.
  alternative: “Lei do Rei”, “lei suprema” ou “lei do reino”.
  rationale: O adjetivo βασιλικός comporta essas associações, mas o texto grego não obriga a escolher apenas uma; a formulação principal preserva essa amplitude teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês” coerente com os verbos plurais dirigidos aos leitores. “Lei régia” conserva a formulação marcada do grego; a nota esclarece a alternativa mais comum “lei real” e a ambiguidade genuína.
