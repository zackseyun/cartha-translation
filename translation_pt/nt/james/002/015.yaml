base_translation:
  language: en
  yaml_path: translation/nt/james/002/015.yaml
  text: If a brother or sister is poorly clothed and lacking daily food,[a]
translation:
  language: pt
  text: Se um irmão ou uma irmã estiver sem roupa adequada[a] e sem o alimento de cada dia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «estiver nu». O termo grego pode indicar nudez literal, mas aqui provavelmente se refere à falta de roupa adequada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: Se
  rationale: Introduz de modo natural uma condição hipotética, preservando a força do grego.
- source_word: ἀδελφὸς ἢ ἀδελφή
  choice: um irmão ou uma irmã
  rationale: Reproduz diretamente o par masculino e feminino e mantém a linguagem familiar usada por Tiago.
- source_word: γυμνοὶ
  choice: sem roupa adequada
  rationale: Neste contexto de privação, provavelmente indica vestuário insuficiente, sem excluir o sentido literal de nudez, registrado em nota.
- source_word: ὑπάρχωσιν
  choice: estiver
  rationale: Funciona como verbo copulativo numa condição hipotética; o singular concorda distributivamente com «um irmão ou uma irmã».
- source_word: λειπόμενοι
  choice: sem
  rationale: Expressa com naturalidade a carência contínua indicada pelo particípio, sem tornar a frase pesada.
- source_word: τῆς ἐφημέρου τροφῆς
  choice: o alimento de cada dia
  rationale: Comunica claramente a provisão alimentar cotidiana e básica, mantendo o sentido de ἐφήμερος e τροφή.
theological_decisions:
- issue: Alcance de ἀδελφὸς ἢ ἀδελφή na comunidade cristã
  choice: Manter «um irmão ou uma irmã», provavelmente em referência a outros crentes no contexto.
  alternative: Entender a expressão de modo mais amplo como qualquer pessoa necessitada.
  rationale: A tradução conserva a linguagem familiar explícita de Tiago sem restringi-la ou ampliá-la interpretativamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Sem roupa adequada» soa mais natural e preciso do que «malvestido» neste contexto; «o alimento de cada dia» comunica a subsistência cotidiana. A vírgula final foi mantida porque o versículo forma a prótase da condição que continua no versículo seguinte.
