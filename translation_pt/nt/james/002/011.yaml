id: JAS.2.11
reference: James 2:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰπών Μὴ ⸀μοιχεύσῃς εἶπεν καί Μὴ ⸀φονεύσῃς· εἰ δὲ οὐ ⸂μοιχεύεις φονεύεις⸃ δέ, γέγονας παραβάτης νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/011.yaml
  text: For he who said, “Do not commit adultery,” also said, “Do not murder.” Now if you do not commit adultery but do murder, you have become a transgressor of the law.
translation:
  language: pt
  text: 'Pois aquele que disse: “Não cometa adultério” também disse: “Não assassine”. Ora, se você não comete adultério, mas assassina, você se tornou transgressor da lei.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... εἰπών
  choice: aquele que disse
  rationale: O particípio com artigo funciona como substantivo. A formulação preserva a referência pessoal ao autor dos mandamentos sem explicitar “Deus”, palavra não presente no grego.
- source_word: Μὴ μοιχεύσῃς
  choice: Não cometa adultério
  rationale: A construção proibitiva ecoa o mandamento. Esta forma é clara e natural no português moderno, mantendo o sentido específico de μοιχεύω.
- source_word: καί
  choice: também
  rationale: Destaca que o mesmo autor do primeiro mandamento pronunciou igualmente o segundo, ponto central do argumento.
- source_word: Μὴ φονεύσῃς
  choice: Não mate
  rationale: Na formulação consagrada do mandamento em português, “não mate” é natural e imediatamente reconhecível. No contexto, φονεύω designa matar ilicitamente, isto é, cometer homicídio, não toda e qualquer ação de tirar uma vida.
- source_word: εἰ δὲ
  choice: Ora, se
  rationale: Introduz com naturalidade a aplicação hipotética e mantém o avanço argumentativo.
- source_word: οὐ μοιχεύεις φονεύεις δέ
  choice: você não comete adultério, mas mata
  rationale: Os presentes indicativos expressam um caso geral; “mas” reproduz o contraste marcado por δέ.
- source_word: γέγονας
  choice: tornou-se
  rationale: 'O perfeito de γίνομαι indica a entrada em um estado que permanece como resultado: a pessoa passou a ser transgressora.'
- source_word: παραβάτης νόμου
  choice: transgressor da lei
  rationale: Preserva o registro jurídico-moral e a referência à lei como unidade, em vez de limitar a transgressão ao mandamento específico violado.
theological_decisions:
- issue: Identidade de quem pronunciou os mandamentos
  choice: “aquele que disse”, sem acrescentar “Deus”
  alternative: “Deus, que disse”
  rationale: O contexto identifica Deus como o legislador, mas o grego emprega uma expressão substantivada. A tradução não explicita além do texto.
- issue: Alcance da transgressão
  choice: “transgressor da lei”
  alternative: “transgressor desse mandamento”
  rationale: 'A redação mantém a força do argumento de Tiago: quebrar um mandamento faz da pessoa transgressora da lei, considerada como um todo.'
- issue: Sentido do mandamento Μὴ φονεύσῃς
  choice: “Não mate” no texto, entendido como proibição de homicídio
  alternative: “Não cometa homicídio”
  rationale: “Não mate” preserva a formulação bíblica amplamente reconhecida em português, enquanto o verbo grego e o contexto delimitam a ação ilícita de matar; a tradução não deve transformar o mandamento em uma afirmação sobre toda retirada de vida.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. O singular “você” torna explícita a segunda pessoa singular do exemplo sem recorrer ao regional “tu”. As citações mantêm tom direto de mandamento.
