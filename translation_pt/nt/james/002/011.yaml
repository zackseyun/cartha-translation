  naturalness: O texto é claro e tem registro apropriado. «Não assassine» e «mas assassina» permanecem diretos e naturais no português moderno, ao mesmo tempo que especificam melhor o sentido do verbo grego. «Você se tornou» é mais explícito e corrente para leitores brasileiros e internacionais do que a forma elíptica «tornou-se» após «você».
