  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀλλ’ ἐρεῖ τις· Σὺ πίστιν ἔχεις κἀγὼ ἔργα ἔχω. δεῖξόν μοι τὴν πίστιν σου ⸀χωρὶς τῶν ⸀ἔργων, κἀγώ ⸂σοι δείξω⸃ ἐκ τῶν ἔργων μου τὴν ⸀πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/018.yaml
  text: But someone will say[a], “You have faith, and I have works.” Show me your faith apart from works[c][b], and I will show you my faith by my works.
translation:
  language: pt
  text: 'Mas alguém dirá: “Você tem fé, e eu tenho obras.” Mostre-me a sua fé sem obras[a], e eu lhe mostrarei a minha fé por meio das minhas obras[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à parte das obras”. A expressão grega pode indicar tanto ausência quanto separação.
    reason: lexical_alternative
  - marker: b
    text: Ou “a partir das minhas obras”. A preposição grega pode indicar origem, base ou meio; aqui, as obras tornam a fé visível.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλ’
  choice: Mas
  rationale: Introduz a objeção hipotética em contraste com o argumento anterior, de modo breve e natural.
- source_word: ἐρεῖ τις
  choice: alguém dirá
  rationale: Preserva o futuro do indicativo e o estilo de interlocutor hipotético usado na argumentação.
- source_word: πίστιν / πίστιν
  choice: fé
  rationale: É o equivalente usual de πίστις neste contexto e mantém aberta a tensão entre a fé alegada e as obras que a tornam visível.
- source_word: ἔργα / ἔργων
  choice: obras
  rationale: Mantém o termo tradicional e a coerência conceitual no argumento de Tiago sobre fé e obras.
- source_word: δεῖξόν μοι
  choice: Mostre-me
  rationale: Reproduz de maneira direta e idiomática o imperativo que exige demonstração concreta.
- source_word: χωρὶς τῶν ἔργων
  choice: sem as obras
  rationale: Expressa naturalmente a ideia de separação ou ausência indicada por χωρίς, sem acrescentar conceitos ausentes do texto.
- source_word: κἀγώ σοι δείξω
  choice: e eu lhe mostrarei
  rationale: Conserva o paralelismo e o valor futuro da resposta enfática; “lhe” oferece leitura natural e amplamente compreensível.
- source_word: ἐκ τῶν ἔργων μου
  choice: por meio das minhas obras
  rationale: 'Comunica o valor instrumental ou evidencial de ἐκ neste contexto: as obras são o meio pelo qual a fé se torna perceptível.'
theological_decisions:
- issue: Sentido de πίστις no debate sobre fé e obras
  choice: fé
  alternative: confiança; fidelidade
  rationale: “Fé” preserva o vocabulário central e não decide antecipadamente se Tiago trata de crença professada, confiança efetiva ou fidelidade.
- issue: Extensão da fala do interlocutor hipotético
  choice: A citação termina depois de “eu tenho obras”
  alternative: A fala introduzida por “alguém dirá” pode abranger também o desafio que se segue
  rationale: A pontuação não fazia parte dos manuscritos gregos mais antigos, e a extensão exata da fala é discutida. A divisão adotada oferece uma leitura clara e tradicional sem alterar as palavras do texto.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e vocabulário bíblico amplamente reconhecível. O paralelismo entre “sua fé” e “minha fé”, bem como a repetição de “obras”, foi preservado. A pontuação segue uma leitura possível da diatribe, sem introduzir explicação interpretativa no corpo do versículo.
