id: JAS.2.26
reference: James 2:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν, οὕτως καὶ ἡ πίστις ⸀χωρὶς ἔργων νεκρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/026.yaml
  text: For just as the body without the spirit is dead[b][a], so also faith without works is dead.
translation:
  language: pt
  text: Pois, assim como o corpo sem o espírito[a] está morto, assim também a fé[b] sem obras está morta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sopro”. A palavra grega pode significar “espírito” ou “sopro”.
    reason: lexical_alternative
  - marker: b
    text: Ou “fidelidade” ou “confiança”. A palavra grega também pode ter esses sentidos; aqui, o texto principal traz “fé”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ
  choice: assim como
  rationale: Introduz com clareza e naturalidade a primeira parte da comparação.
- source_word: γὰρ
  choice: Pois
  rationale: Preserva o valor explicativo que liga o versículo ao argumento anterior.
- source_word: σῶμα
  choice: corpo
  rationale: Equivalente direto para o corpo físico neste contexto.
- source_word: χωρὶς πνεύματος
  choice: sem o espírito
  rationale: Mantém o sentido de ausência expresso por χωρίς e a acepção antropológica comum de πνεῦμα, sem excluir a alternativa 'sopro'.
- source_word: νεκρόν / νεκρά
  choice: está morto / está morta
  rationale: Preserva a repetição retórica do adjetivo grego e emprega a concordância natural em português com 'corpo' e 'fé'.
- source_word: οὕτως καὶ
  choice: assim também
  rationale: Marca explicitamente a correspondência entre as duas partes da comparação.
- source_word: πίστις
  choice: fé
  rationale: É o equivalente principal no contexto e preserva a formulação teologicamente conhecida sem resolver por paráfrase a possível nuance de fidelidade.
- source_word: χωρὶς ἔργων
  choice: sem obras
  rationale: Tradução direta que mantém a ligação lexical com o argumento de Tiago sobre fé e obras.
theological_decisions:
- issue: Sentido de πνεύματος na analogia
  choice: espírito
  alternative: sopro
  rationale: '''Espírito'' preserva a amplitude antropológica do termo grego; ''sopro'' também é lexicalmente possível e se ajusta à imagem de um corpo sem vida, por isso é registrado em nota.'
- issue: Sentido de πίστις em Tiago 2:26
  choice: fé
  alternative: fidelidade ou confiança
  rationale: '''Fé'' é a tradução principal mais adequada ao argumento imediato. As outras possibilidades pertencem ao campo semântico do termo, mas não devem substituir silenciosamente a leitura principal.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção paralela “assim como... assim também” conserva a força retórica do grego, e “está morto/morta” soa mais natural em português contemporâneo do que uma reprodução rigidamente formal com “é”.
