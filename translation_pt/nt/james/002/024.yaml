id: JAS.2.24
reference: James 2:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ὁρᾶτε ὅτι ἐξ ἔργων δικαιοῦται ἄνθρωπος καὶ οὐκ ἐκ πίστεως μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/024.yaml
  text: You see that a man is justified by works and not by faith alone[a][b][c].
translation:
  language: pt
  text: Vocês veem que uma pessoa é justificada pelas obras e não somente pela fé.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “é reconhecida como justa” ou “é vindicada”. A formulação de Tiago é mantida sem resolver o debate interpretativo sobre sua relação com outros usos de “justificar” no Novo Testamento.
    reason: alternative_reading
  - marker: b
    text: O termo grego traduzido como “fé” também pode, conforme o contexto, significar “fidelidade” ou “confiança”; aqui, “fé” é a tradução principal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Vocês veem
  rationale: Preserva o presente do indicativo e o apelo direto à audiência; é uma formulação natural e clara em português.
- source_word: ἐξ ἔργων
  choice: pelas obras
  rationale: Comunica de modo idiomático a ideia de base ou meio expressa por ἐξ com o genitivo neste argumento.
- source_word: δικαιοῦται
  choice: é justificada
  rationale: Mantém o peso lexical e teológico de δικαιόω e a continuidade com outros contextos, sem decidir no texto principal entre os sentidos forense e demonstrativo/vindicatório.
- source_word: ἄνθρωπος
  choice: uma pessoa
  rationale: Neste contexto, o substantivo singular tem sentido representativo e se refere ao ser humano em geral; 'uma pessoa' expressa naturalmente essa abrangência em português sem sugerir exclusividade masculina.
- source_word: πίστεως
  choice: fé
  rationale: É a tradução padrão de πίστις e expressa adequadamente o contraste do versículo entre obras e fé considerada isoladamente.
- source_word: μόνον
  choice: somente
  rationale: Preserva a exclusividade indicada por μόνον e produz a formulação portuguesa natural 'não somente pela fé'.
theological_decisions:
- issue: Sentido de δικαιοῦται em relação à doutrina da justificação
  choice: Manter 'é justificada' no texto principal.
  alternative: '''é reconhecida como justa'' ou ''é vindicada'''
  rationale: A formulação conserva a tensão genuína entre o uso de Tiago e outros usos neotestamentários de δικαιόω, sem impor uma harmonização interpretativa. A nota registra sentidos contextualmente possíveis.
- issue: Referência genérica de ἄνθρωπος
  choice: Traduzir como 'uma pessoa'.
  alternative: '''um ser humano'' ou, formalmente, ''um homem'''
  rationale: Embora ἄνθρωπος seja gramaticalmente masculino singular, aqui sua referência é humana e genérica. Em português atual, 'uma pessoa' transmite com precisão essa função representativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural explícito 'vocês' torna claro o destinatário de ὁρᾶτε. A ordem e o contraste do grego são preservados sem rigidez artificial.
