  text: Ἀδελφοί μου, μὴ ἐν προσωπολημψίαις ἔχετε τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῆς δόξης;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/001.yaml
  text: My brothers[d][c][b][a], do not hold the faith of our Lord Jesus the Messiah with partiality.
translation:
  language: pt
  text: Meus irmãos[a], não mantenham a fé em nosso Senhor Jesus, o Messias glorioso[b], mostrando favoritismo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus irmãos e minhas irmãs”; o grego diz literalmente “irmãos”, mas a exortação se dirige à comunidade de fiéis como um todo.
    reason: lexical_alternative
  - marker: b
    text: 'A construção grega também pode ser entendida como “a fé de nosso Senhor Jesus, o Messias”. A expressão “da glória” também pode ser ligada a “Senhor” ou a toda a expressão: “nosso Senhor Jesus, o Messias, o Senhor da glória”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: Meus irmãos
  rationale: Mantém o vocativo masculino plural do grego; o contexto comunitário mais amplo é indicado em nota.
- source_word: μὴ ... ἔχετε
  choice: não mantenham
  rationale: O imperativo presente com μή expressa proibição; “manter a fé” comunica de modo natural a ideia de professá-la ou vivê-la de determinada maneira.
- source_word: ἐν προσωπολημψίαις
  choice: mostrando favoritismo
  rationale: Expressa em português corrente a conduta de favorecer pessoas com base em sua posição ou aparência; o plural grego é vertido idiomaticamente.
- source_word: τὴν πίστιν
  choice: a fé
  rationale: Preserva o artigo e o sentido religioso de πίστις no contexto.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: em nosso Senhor Jesus, o Messias
  rationale: Em português, “fé em” é a formulação natural para o genitivo objetivo; “Messias” conserva o valor titular de Χριστός.
- source_word: τῆς δόξης
  choice: da glória
  rationale: Mantém a construção genitiva solene e evita decidir silenciosamente entre “Messias da glória”, “Senhor da glória” e “glorioso Senhor”.
theological_decisions:
- issue: Relação do genitivo em τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: a fé em nosso Senhor Jesus, o Messias
  alternative: a fé de nosso Senhor Jesus, o Messias
  rationale: A leitura objetiva é a mais clara e idiomática em português, mas a nota preserva a forma genitiva e sua possível ambiguidade.
- issue: Relação de τῆς δόξης
  choice: o Messias da glória
  alternative: nosso glorioso Senhor Jesus, o Messias; nosso Senhor Jesus, o Messias, o Senhor da glória
  rationale: A posição do genitivo permite mais de uma associação sintática. O texto principal conserva a sequência mais próxima da ordem grega, enquanto a nota registra as alternativas relevantes.
- issue: Valor de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Neste encadeamento titular, Χριστός conserva claramente seu valor messiânico; o artigo torna a expressão idiomática em português.
- issue: Alcance de Ἀδελφοί
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A tradução principal conserva o masculino gramatical do grego, e a nota esclarece que a comunidade cristã inteira está sendo interpelada.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com vocabulário de boa legibilidade brasileira. “Mostrando favoritismo” evita o arcaísmo de “acepção de pessoas”; as notas preservam as ambiguidades sintáticas e semânticas relevantes.
