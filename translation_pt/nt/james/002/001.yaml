  naturalness: «Meus irmãos» e «mostrando favoritismo» são claros e adequados ao registro. «Senhor Jesus, o Messias da glória» é pouco idiomático e cria uma associação semântica obscura. «Senhor Jesus, o Messias glorioso» é natural em português moderno e mantém o tom elevado.
  terminology: «Irmãos», «fé», «Senhor», «Messias» e «favoritismo» são escolhas adequadas. O artigo em «o Messias» torna o título natural em português. A nota deve preservar tanto a possível relação «fé de» quanto as alternativas sintáticas de τῆς δόξης.
