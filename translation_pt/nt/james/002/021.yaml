id: JAS.2.21
reference: James 2:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀβραὰμ ὁ πατὴρ ἡμῶν οὐκ ἐξ ἔργων ἐδικαιώθη, ἀνενέγκας Ἰσαὰκ τὸν υἱὸν αὐτοῦ ἐπὶ τὸ θυσιαστήριον;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/021.yaml
  text: Was not Abraham our father justified by works when he offered up Isaac his son on the altar?[a]
translation:
  language: pt
  text: Não foi Abraão, nosso pai, justificado pelas obras quando ofereceu seu filho Isaque sobre o altar?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reconhecido como justo” ou “teve sua justiça comprovada”. O verbo grego pode ter sentido declarativo ou demonstrativo, conforme o contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: πατὴρ ἡμῶν
  choice: nosso pai
  rationale: Preserva a metáfora familiar e a linguagem de identidade da aliança, sem a atenuar para “nosso antepassado”.
- source_word: ἐξ ἔργων
  choice: pelas obras
  rationale: Expressa de modo natural em português a ideia de meio ou fundamento indicada por ἐξ com o genitivo e mantém a formulação teológica do? No. Use rationale clean.
- source_word: ἐδικαιώθη
  choice: foi justificado
  rationale: Mantém o vínculo lexical com a discussão sobre justificação e preserva a tensão entre sentidos declarativo e demonstrativo.
- source_word: ἀνενέγκας
  choice: quando ofereceu
  rationale: Traduz o particípio aoristo com valor temporal natural no contexto e conserva a ideia de oferta sacrificial.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: seu filho Isaque
  rationale: Emprega a ordem mais natural em português, sem perder nenhuma informação do grego.
- source_word: θυσιαστήριον
  choice: o altar
  rationale: Equivalente corrente e direto para o altar sacrificial.
- source_word: οὐκ ... ἐδικαιώθη;
  choice: Não foi ... justificado?
  rationale: Preserva a pergunta retórica grega, que espera resposta afirmativa, em sintaxe portuguesa natural.
theological_decisions:
- issue: Sentido de δικαιόω em Tiago 2:21 em relação às obras
  choice: Traduzir como “foi justificado” no texto principal.
  alternative: “foi reconhecido como justo” ou “teve sua justiça comprovada”
  rationale: “Justificado” preserva a conexão lexical com o tema mais amplo da justificação sem impor exclusivamente um sentido forense ou demonstrativo; as possibilidades contextuais ficam registradas em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Isaque” segue a forma bíblica corrente no português do Brasil; a construção mantém a concisão e a força retórica do original.
