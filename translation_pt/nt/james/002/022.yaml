id: JAS.2.22
reference: James 2:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: βλέπεις ὅτι ἡ πίστις συνήργει τοῖς ἔργοις αὐτοῦ καὶ ἐκ τῶν ἔργων ἡ πίστις ἐτελειώθη,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/022.yaml
  text: You see that faith was working together with his works[b][a], and by the works faith was brought to completion.
translation:
  language: pt
  text: Você vê que a fé cooperava com as obras dele e que, pelas obras, a fé foi levada à plenitude.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi aperfeiçoada” ou “foi completada”; o verbo grego pode indicar que algo alcançou seu fim pretendido, sua integridade ou maturidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπεις
  choice: Você vê
  rationale: Preserva o presente indicativo e o apelo retórico direto, na segunda pessoa do singular, de modo natural em português.
- source_word: ἡ πίστις
  choice: a fé
  rationale: É o equivalente principal e tradicional neste argumento de Tiago, sem restringir o termo a uma interpretação denominacional.
- source_word: συνήργει
  choice: cooperava
  rationale: O pretérito imperfeito expressa ação contínua no passado, e “cooperava” conserva a noção de atuação conjunta presente em συνεργέω.
- source_word: τοῖς ἔργοις αὐτοῦ
  choice: com as obras dele
  rationale: A preposição “com” corresponde naturalmente ao dativo regido pelo verbo; “obras” mantém a terminologia central do contexto. “Dele” retém a referência a Abraão sem introduzir o nome no versículo.
- source_word: ἐκ τῶν ἔργων
  choice: pelas obras
  rationale: Neste contexto, ἐκ pode indicar o meio ou a fonte por que a fé alcançou sua plenitude; “pelas obras” preserva essa relação de maneira idiomática.
- source_word: ἐτελειώθη
  choice: foi levada à plenitude
  rationale: Traduz o aoristo passivo e comunica a ideia de alcançar o fim, a integridade ou a maturidade pretendida, evitando sugerir necessariamente perfeição moral absoluta.
theological_decisions:
- issue: Relação entre fé e obras no argumento de Tiago
  choice: A fé cooperava com as obras, e pelas obras foi levada à plenitude.
  alternative: As obras apenas demonstravam a fé; ou as obras completavam a fé no sentido de fazê-la amadurecer.
  rationale: O grego afirma cooperação e consumação, mas não apresenta aqui uma explicação sistemática completa sobre a justificação. A tradução conserva essa tensão sem impor uma leitura denominacional.
- issue: Sentido de πίστις
  choice: fé
  alternative: fidelidade; confiança
  rationale: “Fé” corresponde ao sentido discursivo mais provável e à terminologia reconhecível no contexto, sem excluir por explicação indevida nuances relacionadas.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. “Cooperava” preserva a ação conjunta e o aspecto contínuo; “levada à plenitude” transmite a consumação sem resolver além do texto a relação teológica entre fé e obras.
