  text: Será que vocês não fizeram distinções entre si e se tornaram juízes movidos por maus pensamentos?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês não fizeram distinções discriminatórias entre si?” O verbo também pode ter o sentido de “ficar divididos” ou, em outros contextos, “duvidar”; aqui, porém, o contexto favorece a ideia de fazer distinções discriminatórias.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “juízes de maus pensamentos” ou “de maus raciocínios”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκρίθητε
  choice: fizeram distinções
  rationale: No contexto imediato de Tiago 2:1–3, o verbo se refere a estabelecer distinções discriminatórias entre ricos e pobres. A formulação preserva a ligação com o tratamento parcial sem adotar aqui o sentido de “duvidar”, encontrado em outros contextos.
- source_word: ἐν ἑαυτοῖς
  choice: entre si
  rationale: 'A expressão admite o sentido interior de “dentro de vocês”, mas o cenário comunitário favorece o sentido relacional: distinções feitas no meio da própria comunidade.'
- source_word: ἐγένεσθε
  choice: se tornaram
  rationale: 'Expressa naturalmente o resultado da ação anterior: ao fazerem distinções, passaram a agir como determinado tipo de juízes.'
- source_word: κριταὶ
  choice: juízes
  rationale: Equivalente direto que mantém a força moral e judicial da repreensão.
- source_word: διαλογισμῶν πονηρῶν
  choice: movidos por maus pensamentos
  rationale: A construção grega é literalmente “juízes de maus pensamentos/raciocínios”. A tradução explicita de modo natural que esses pensamentos caracterizam e orientam o julgamento, sem reduzi-los apenas a motivos.
- source_word: οὐ
  choice: Será que ... não
  rationale: Preserva em português corrente a força da pergunta retórica, que espera uma resposta afirmativa.
theological_decisions:
- issue: Sentido de διακρίνω em relação à parcialidade
  choice: A pergunta repreende distinções discriminatórias dentro da comunidade.
  alternative: A pergunta descreve uma divisão ou dúvida interior.
  rationale: O contraste entre o rico e o pobre nos versículos 1–3 favorece o sentido social de discriminar. A alternativa permanece lexicalmente possível e é registrada em nota, sem substituir a leitura exigida pelo contexto imediato.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Será que” dá naturalidade à pergunta retórica; “entre si” mantém o foco comunitário. As notas preservam a ambiguidade lexical real e a forma mais literal do genitivo.
