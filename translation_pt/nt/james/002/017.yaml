  text: οὕτως καὶ ἡ πίστις, ἐὰν μὴ ⸂ἔχῃ ἔργα⸃, νεκρά ἐστιν καθ’ ἑαυτήν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/017.yaml
  text: So also faith[a], if it does not have works, is dead by itself.
translation:
  language: pt
  text: Assim também a fé[a], se não tiver obras, está morta por si só.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “confiança”; menos provavelmente aqui, “fidelidade”. A palavra grega pístis pode ter esses sentidos, mas “fé” se encaixa melhor no argumento de Tiago neste versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Assim também
  rationale: Preserva de modo conciso a comparação e a inferência em relação à ilustração anterior.
- source_word: ἡ πίστις
  choice: a fé
  rationale: No argumento de Tiago, refere-se à fé professada; mantém a amplitude do termo e a tensão teológica do contexto.
- source_word: ἐὰν μὴ ἔχῃ
  choice: se não tiver
  rationale: Equivalente português natural da construção condicional com ἐὰν μή e subjuntivo.
- source_word: ἔργα
  choice: obras
  rationale: Mantém a ligação lexical com o argumento circundante sobre fé e obras, sem restringir o sentido a uma categoria específica de ações.
- source_word: νεκρά ἐστιν
  choice: está morta
  rationale: Conserva a metáfora forte do grego e expressa naturalmente o estado da fé descrita.
- source_word: καθ’ ἑαυτήν
  choice: em si mesma
  rationale: Representa a fé considerada isoladamente, sem acrescentar uma explicação doutrinária.
theological_decisions:
- issue: Tradução de πίστις em uma passagem central ao debate sobre fé e obras
  choice: fé
  alternative: confiança; fidelidade
  rationale: “Fé” se ajusta melhor ao argumento imediato de Tiago e preserva a tensão entre a profissão de fé e as obras que devem acompanhá-la, sem impor uma solução denominacional.
- issue: Sentido de καθ’ ἑαυτήν
  choice: em si mesma
  alternative: por si só
  rationale: A formulação mantém a ideia de fé isolada das obras e evita expandir o texto para uma afirmação teológica mais específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Assim também” mantém a conexão argumentativa; “obras” preserva a terminologia central da passagem.
