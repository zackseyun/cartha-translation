  text: θέλεις δὲ γνῶναι, ὦ ἄνθρωπε κενέ, ὅτι ἡ πίστις χωρὶς τῶν ἔργων ⸀ἀργή ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/020.yaml
  text: But do you want to know[a], O foolish man[b], that faith apart from works is useless?
translation:
  language: pt
  text: Mas você quer saber, ó homem vazio[a], que a fé sem obras é inútil[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “homem insensato”. O grego diz literalmente “homem vazio”, expressão que sugere falta de entendimento ou de substância.
    reason: lexical_alternative
  - marker: b
    text: Ou “inativa”, “improdutiva” ou “ineficaz”. O termo grego descreve aquilo que não opera nem produz resultado.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλεις δὲ γνῶναι
  choice: Mas você quer saber
  rationale: θέλω com o infinitivo expressa vontade ou disposição, γνῶναι significa “saber/conhecer”, e δέ introduz aqui uma transição adversativa, bem representada por “mas”.
- source_word: ὦ ἄνθρωπε κενέ
  choice: ó homem vazio
  rationale: Mantém o vocativo singular e preserva a imagem concreta de κενός, “vazio”, sem substituí-la silenciosamente por uma interpretação como “insensato”.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo daquilo que o interlocutor deve saber.
- source_word: ἡ πίστις
  choice: a fé
  rationale: “Fé” é o equivalente normal de πίστις neste argumento e evita decidir além do texto se se trata de confiança, fidelidade ou mera profissão verbal.
- source_word: χωρὶς τῶν ἔργων
  choice: sem obras
  rationale: χωρίς com genitivo indica ausência ou separação. “Sem obras” é claro, natural em português e mantém a terminologia central do argumento de Tiago.
- source_word: ἀργή ἐστιν
  choice: é inútil
  rationale: ἀργός descreve o que está inativo, improdutivo ou sem efeito. “É inútil” comunica de modo claro a força prática do termo, enquanto alternativas mais formais são registradas em nota.
theological_decisions:
- issue: Relação entre fé e obras no argumento de Tiago
  choice: Afirmar diretamente que a fé sem obras é inútil.
  alternative: Traduzir ἀργή por “inativa” ou intensificar para “morta”.
  rationale: O versículo emprega ἀργή, não νεκρά. A tradução conserva a afirmação incisiva de Tiago sem enfraquecê-la nem assimilá-la à expressão “morta” dos versículos próximos, e sem impor uma harmonização denominacional.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O vocativo “ó homem vazio” é deliberadamente mais formal e imagético, por refletir de perto o grego; a nota oferece a formulação idiomática “homem insensato”.
