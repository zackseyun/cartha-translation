source:
  edition: SBLGNT
  text: ἡ γὰρ κρίσις ἀνέλεος τῷ μὴ ποιήσαντι ἔλεος· κατακαυχᾶται ⸀ἔλεος κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/013.yaml
  text: For judgment is without mercy to the one who has shown no mercy[a]; mercy triumphs over judgment.
translation:
  language: pt
  text: Pois o juízo é sem misericórdia para quem não demonstrou misericórdia; a misericórdia triunfa sobre o juízo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «A misericórdia se gloria sobre o juízo». O verbo grego pode transmitir a ideia de gloriar-se ou exultar sobre; no texto, foi traduzido de modo idiomático por «triunfa sobre».'
    reason: alternativa lexical
lexical_decisions:
- source_word: κρίσις / κρίσεως
  choice: juízo
  rationale: Mantém o sentido de avaliação judicial, especialmente divina, sem restringi-lo indevidamente a condenação, e preserva a repetição interna do termo no versículo.
- source_word: ἀνέλεος
  choice: sem misericórdia
  rationale: Expressa com clareza o caráter do juízo e conserva a ligação lexical com ἔλεος, repetido no restante do versículo.
- source_word: τῷ μὴ ποιήσαντι ἔλεος
  choice: para quem não demonstrou misericórdia
  rationale: A construção com ποιέω e ἔλεος significa agir com misericórdia ou demonstrá-la. Esta formulação é natural em português e mantém a reciprocidade moral do contexto.
- source_word: κατακαυχᾶται
  choice: triunfa sobre
  rationale: O verbo pode significar gloriar-se ou exultar sobre alguém ou algo; aqui, «triunfa sobre» comunica de modo idiomático sua força retórica, enquanto a nota registra a imagem lexical mais literal.
- source_word: ἔλεος
  choice: misericórdia
  rationale: É o equivalente corrente e adequado ao contexto, além de preservar a repetição que estrutura o contraste do versículo.
theological_decisions:
- issue: Sentido da cláusula final κατακαυχᾶται ἔλεος κρίσεως
  choice: A misericórdia triunfa sobre o juízo.
  alternative: A misericórdia se gloria sobre o juízo.
  rationale: A formulação conserva a cláusula como princípio geral e aforístico, sem decidir se a ênfase recai na misericórdia de Deus, na misericórdia atuante no juízo ou na misericórdia demonstrada pelos fiéis. Assim, mantém-se a tensão entre advertência e esperança, sem introduzir uma doutrina mecanicista de mérito.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe concisa acompanha o caráter proverbial do grego; a repetição de «misericórdia» e «juízo» foi preservada deliberadamente.
