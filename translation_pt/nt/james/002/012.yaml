  text: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε ὡς διὰ νόμου ἐλευθερίας μέλλοντες κρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/012.yaml
  text: So speak and so act as those who are going to be judged through the law of freedom.
translation:
  language: pt
  text: Assim falem e assim ajam, como pessoas que serão julgadas por meio da lei da liberdade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε
  choice: Assim falem e assim ajam
  rationale: Preserva o paralelismo enfático dos dois imperativos presentes, com linguagem natural e digna em português.
- source_word: ὡς ... μέλλοντες κρίνεσθαι
  choice: como pessoas que serão julgadas
  rationale: Expressa a condição em que os destinatários devem falar e agir; o futuro perifrástico grego indica julgamento vindouro, sem exigir a tradução mais pesada 'estão prestes a ser julgadas'.
- source_word: διὰ νόμου ἐλευθερίας
  choice: por meio da lei da liberdade
  rationale: Mantém o valor instrumental ou mediador de διά com genitivo e evita substituí-lo por um simples 'pela', que poderia ser entendido exclusivamente como agente. O genitivo 'da liberdade' preserva a formulação compacta do original.
theological_decisions:
- issue: Relação da lei da liberdade com o julgamento
  choice: por meio da lei da liberdade
  alternative: pela lei da liberdade
  rationale: O texto usa διά com genitivo. A tradução mantém a relação mediadora/instrumental sem explicar de que modo a lei participa do julgamento, preservando a tensão teológica do original.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. O plural inclusivo 'pessoas' torna explícito o referente de μέλλοντες sem acrescentar conteúdo doutrinário; os imperativos 'falem' e 'ajam' conservam a exortação direta.
