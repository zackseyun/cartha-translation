  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂ἐπιβλέψητε δὲ⸃ ἐπὶ τὸν φοροῦντα τὴν ἐσθῆτα τὴν λαμπρὰν καὶ ⸀εἴπητε· Σὺ κάθου ὧδε καλῶς, καὶ τῷ πτωχῷ εἴπητε· Σὺ στῆθι ⸂ἢ κάθου ἐκεῖ⸃ ὑπὸ τὸ ὑποπόδιόν μου,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/003.yaml
  text: and if you pay attention to the one wearing the bright clothing and say[a], “You sit here in a good place,” and say to the poor man, “You stand there[b], or sit under my footstool,”
translation:
  language: pt
  text: 'e vocês derem atenção àquele que veste roupa vistosa[a] e disserem: “Você, sente-se aqui, neste bom lugar”, e disserem ao pobre: “Você, fique de pé ou sente-se ali[b], debaixo do meu apoio para os pés”,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a roupa brilhante” ou “a roupa esplêndida”.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos omitem “ou sente-se ali”; o texto impresso inclui essas palavras.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιβλέψητε
  choice: derem atenção
  rationale: O verbo indica voltar a atenção para alguém e, neste contexto, dar-lhe consideração favorável. A formulação preserva essa implicação sem antecipar a acusação explícita de favoritismo.
- source_word: φοροῦντα
  choice: veste
  rationale: É a forma portuguesa direta e natural para o particípio que descreve alguém usando uma roupa.
- source_word: ἐσθῆτα τὴν λαμπράν
  choice: a roupa vistosa
  rationale: ἐσθής designa roupa ou veste, e λαμπρός pode indicar algo brilhante, esplêndido ou impressionante. “Vistosa” comunica uma aparência que chama atenção sem restringir o sentido apenas ao brilho literal.
- source_word: Σὺ κάθου ὧδε καλῶς
  choice: Você, sente-se aqui, neste bom lugar
  rationale: Mantém o imperativo e torna natural em português o valor de καλῶς, que qualifica favoravelmente o lugar oferecido.
- source_word: τῷ πτωχῷ
  choice: ao pobre
  rationale: O adjetivo substantivado masculino singular aponta para o homem pobre específico da cena. “Ao pobre” é conciso, natural e preserva o gênero gramatical.
- source_word: στῆθι
  choice: fique de pé
  rationale: O imperativo ordena que a pessoa permaneça ou tome posição em pé; “fique de pé” é idiomático no contraste com sentar-se.
- source_word: ἢ κάθου ἐκεῖ
  choice: ou sente-se ali
  rationale: Preserva a ordem impressa do texto grego e a força distanciadora de ἐκεῖ.
- source_word: ὑπὸ τὸ ὑποπόδιόν μου
  choice: abaixo do apoio para os meus pés
  rationale: ὑπό com acusativo tem aqui o sentido de “debaixo de/abaixo de”. A expressão conserva a imagem deliberadamente humilhante; “apoio para os pés” é mais corrente do que “escabelo”.
theological_decisions:
- issue: Linguagem de parcialidade social
  choice: Narrar concretamente a atenção e os lugares contrastantes dados aos dois homens
  alternative: Explicitar no versículo “tratarem com favoritismo” ou “derem preferência”
  rationale: O contexto condena a parcialidade, mas este versículo mostra o comportamento concreto. A tradução deixa a conclusão teológica surgir da cena, sem inserir terminologia interpretativa adicional.
- issue: Gênero de τῷ πτωχῷ
  choice: ao pobre
  alternative: à pessoa pobre
  rationale: A expressão grega está no masculino singular e retrata um visitante individual. A opção mantém essa forma sem tornar o português pesado.
- issue: Imagem de submissão em ὑπὸ τὸ ὑποπόδιόν μου
  choice: abaixo do apoio para os meus pés
  alternative: junto ao apoio para os meus pés
  rationale: “Abaixo” conserva a preposição grega e a humilhação social da ordem, sem suavizar a tensão da imagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” dá continuidade natural à construção condicional do contexto. Evitou-se “escabelo”, hoje pouco corrente, e também uma paráfrase doutrinária como “mostrar favoritismo”. Todos os marcadores de nota aparecem no texto principal.
