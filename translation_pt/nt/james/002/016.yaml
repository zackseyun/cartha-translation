  text: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν· Ὑπάγετε ἐν εἰρήνῃ, θερμαίνεσθε καὶ χορτάζεσθε, μὴ δῶτε δὲ αὐτοῖς τὰ ἐπιτήδεια τοῦ σώματος, ⸀τί ὄφελος;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/016.yaml
  text: and one of you says to them[a], “Go in peace; keep warm and be filled,” but you do not give them the necessities of the body, what benefit is that?
translation:
  language: pt
  text: 'Se um de vocês lhes disser: “Vão em paz; fiquem aquecidos e saciados[a]”, mas não lhes derem o necessário para o corpo, que proveito há?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “sejam aquecidos e saciados”. As formas gregas podem ser entendidas em sentido passivo ou médio.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπῃ δέ τις ... ἐξ ὑμῶν
  choice: e um de vocês lhes disser
  rationale: Apresenta naturalmente o exemplo hipotético e preserva o sentido partitivo de ἐξ ὑμῶν. A conjunção “e” mantém a ligação com o contexto sem acentuar demais o contraste de δέ.
- source_word: Ὑπάγετε ἐν εἰρήνῃ
  choice: Vão em paz
  rationale: Equivalente português natural da fórmula convencional de despedida ou bênção, preservando sua força irônica no contexto.
- source_word: θερμαίνεσθε καὶ χορτάζεσθε
  choice: fiquem aquecidos e saciados
  rationale: Expressa os estados desejados sem determinar de modo rígido se as formas gregas têm sentido passivo ou médio. “Saciados” conserva a ideia de ter a necessidade de alimento plenamente satisfeita.
- source_word: μὴ δῶτε δὲ αὐτοῖς
  choice: mas vocês não lhes derem
  rationale: O plural explícito preserva a mudança do indivíduo que fala para a comunidade que deixa de agir; “mas” comunica o contraste entre palavras piedosas e omissão prática.
- source_word: τὰ ἐπιτήδεια τοῦ σώματος
  choice: o necessário para o corpo
  rationale: Tradução clara e corrente para as provisões indispensáveis às necessidades físicas, mantendo a referência concreta ao corpo.
- source_word: τί ὄφελος;
  choice: que proveito há nisso?
  rationale: Mantém o valor prático de ὄφελος e formula em português natural a pergunta retórica.
theological_decisions:
- issue: Sentido médio ou passivo de θερμαίνεσθε e χορτάζεσθε
  choice: fiquem aquecidos e saciados
  alternative: aqueçam-se e saciem-se; sejam aquecidos e saciados
  rationale: A formulação principal evita decidir se os necessitados devem agir sobre si mesmos ou receber de outros calor e alimento. Assim, preserva-se a tensão gramatical, enquanto o argumento central continua sendo a inutilidade de palavras desacompanhadas de ajuda material.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “vocês” torna claro o plural do texto grego; “proveito” preserva o tom retórico sem soar excessivamente técnico.
