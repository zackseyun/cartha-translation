base_translation:
  language: en
  yaml_path: translation/nt/james/002/009.yaml
  text: But if you show partiality[d][c][b][a], you commit sin and are convicted by the law as transgressors.
translation:
  language: pt
  text: Mas, se vocês tratam as pessoas com parcialidade[a], cometem pecado e são declarados culpados pela lei como transgressores[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mostram favoritismo”. O verbo grego se refere a julgar ou tratar as pessoas de acordo com aparência, posição ou condição exterior.
    reason: lexical_alternative
  - marker: b
    text: Ou “são convencidos de culpa pela lei como infratores”. O termo traduzido por “declarados culpados” também pode ter o sentido de ter o erro exposto ou ser repreendido.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mas, se
  rationale: Preserva tanto a condição introduzida por εἰ quanto o contraste ou a continuação leve marcada por δέ.
- source_word: προσωπολημπτεῖτε
  choice: tratam as pessoas com parcialidade
  rationale: Expressa de modo claro o ato de julgar ou tratar alguém segundo aparência, posição ou condição exterior, sem reproduzir de forma rígida o idioma subjacente.
- source_word: ἁμαρτίαν ἐργάζεσθε
  choice: cometem pecado
  rationale: A combinação idiomática significa praticar ou cometer pecado; o presente foi vertido naturalmente como uma afirmação geral na condição.
- source_word: ἐλεγχόμενοι
  choice: são condenados
  rationale: No contexto jurídico de lei e transgressores, comunica que a lei demonstra a culpa. A nota registra sentidos próximos para não restringir indevidamente o alcance do particípio.
- source_word: ὑπὸ τοῦ νόμου
  choice: pela lei
  rationale: Mantém o agente da forma passiva e não especifica além do grego se se trata, em sentido estrito, da Lei mosaica.
- source_word: ὡς παραβάται
  choice: como transgressores
  rationale: Conserva o sentido de pessoas que ultrapassam um limite normativo e mantém o registro jurídico e bíblico do termo.
theological_decisions:
- issue: Natureza da lei no argumento ético de Tiago
  choice: lei
  alternative: Lei; lei de Deus; Lei mosaica
  rationale: O grego apresenta a lei como o padrão que revela a parcialidade como pecado, mas o versículo não exige uma identificação teológica mais estreita. A formulação evita importar um sistema denominacional.
- issue: Força de ἐλεγχόμενοι
  choice: são condenados
  alternative: são convencidos da culpa; são desmascarados; são repreendidos
  rationale: A escolha ressalta a constatação de culpa no contexto jurídico, enquanto a nota preserva a amplitude lexical do particípio.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A construção na segunda pessoa do plural segue o referente explícito no grego sem recorrer a formas regionais como “vós”. Mantém-se “lei” em minúscula para preservar a abrangência do original.
