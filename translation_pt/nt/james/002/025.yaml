id: JAS.2.25
reference: James 2:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ῥαὰβ ἡ πόρνη οὐκ ἐξ ἔργων ἐδικαιώθη, ὑποδεξαμένη τοὺς ἀγγέλους καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/025.yaml
  text: And likewise[b][a], was not Rahab the prostitute also justified by works when she welcomed the messengers and sent them out by another way?
translation:
  language: pt
  text: Do mesmo modo, também Raabe, a prostituta, não foi justificada pelas obras[a] quando acolheu os mensageiros[b] e os fez sair por outro caminho?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «declarada justa» ou «reconhecida como justa». O grego diz «justificada»; a tradução mantém essa formulação sem resolver a discussão teológica sobre a nuance do termo neste versículo.
    reason: lexical_alternative
  - marker: b
    text: 'Grego: «mensageiros». O contexto se refere aos homens acolhidos por Raabe (Josué 2), não a anjos celestiais.'
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: Do mesmo modo, também
  rationale: Marca a comparação com o exemplo anterior, o de Abraão, e acrescenta Raabe como segundo caso, preservando de modo natural a força comparativa e aditiva.
- source_word: Ῥαὰβ
  choice: Raabe
  rationale: Segue a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἡ πόρνη
  choice: a prostituta
  rationale: Expressa diretamente o sentido de πόρνη em linguagem moderna, sem recorrer ao termo mais arcaico «meretriz».
- source_word: οὐκ ... ἐδικαιώθη
  choice: não foi justificada
  rationale: Mantém o equivalente lexical e teológico mais direto de δικαιόω, sem decidir se aqui o sentido específico é declarar justa ou demonstrar que era justa.
- source_word: ἐξ ἔργων
  choice: pelas obras
  rationale: Comunica de forma idiomática a ideia de meio ou base expressa por ἐκ com o genitivo e mantém a ligação verbal com o argumento de Tiago 2.
- source_word: ὑποδεξαμένη
  choice: quando acolheu
  rationale: O verbo indica recepção hospitaleira; «acolheu» é natural e mais preciso no contexto do que o simples «recebeu».
- source_word: τοὺς ἀγγέλους
  choice: os mensageiros
  rationale: ἄγγελος pode designar anjo ou mensageiro. Aqui, o contexto de Josué 2 identifica pessoas humanas, sem exigir a especificação interpretativa «espiões» no texto principal.
- source_word: καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα
  choice: e os fez sair por outro caminho
  rationale: Neste contexto, ἐκβάλλω indica fazer sair ou encaminhar, não expulsar à força; a formulação também preserva ἑτέρᾳ ὁδῷ, «por outro caminho».
theological_decisions:
- issue: Sentido de δικαιόω em Tiago 2:25 na relação entre fé e obras
  choice: Manter «foi justificada» no texto principal, sem restringir o termo à justificação forense inicial nem à vindicação posterior.
  alternative: «foi declarada justa» ou «mostrou ser justa»
  rationale: A formulação de Tiago conserva uma tensão teológica deliberada ao relacionar justificação e obras. A tradução retém o termo central e registra as principais nuances possíveis em nota, sem impor um sistema interpretativo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Prostituta» evita o arcaísmo de «meretriz»; «acolheu» expressa hospitalidade; a pergunta retórica e a tensão de «justificada pelas obras» foram preservadas.
