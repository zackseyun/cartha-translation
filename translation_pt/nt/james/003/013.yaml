  text: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν; δειξάτω ἐκ τῆς καλῆς ἀναστροφῆς τὰ ἔργα αὐτοῦ ἐν πραΰτητι σοφίας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/013.yaml
  text: Who is wise and understanding among you? Let him show his works by his good conduct[b][a], in the meekness of wisdom.
translation:
  language: pt
  text: Quem entre vocês é sábio e entendido? Mostre, por sua boa conduta, as suas obras, com a mansidão que vem da sabedoria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na mansidão da sabedoria”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν
  choice: Quem entre vocês é sábio e entendido?
  rationale: Reproduz a pergunta retórica e verte ἐπιστήμων por “entendido”, termo natural no contexto de discernimento prático e moral.
- source_word: δειξάτω
  choice: Mostre
  rationale: Preserva a força do imperativo aoristo na terceira pessoa do singular; em português, a forma não exige pronome masculino e pode ter naturalmente valor representativo.
- source_word: ἐκ τῆς καλῆς ἀναστροφῆς
  choice: por sua boa conduta
  rationale: “Conduta” expressa o comportamento ou modo de viver indicado por ἀναστροφή; “por” comunica que as obras se evidenciam mediante essa conduta.
- source_word: τὰ ἔργα αὐτοῦ
  choice: as suas obras
  rationale: “Obras” mantém a ligação lexical com o tema recorrente de ἔργα em Tiago; “suas” representa αὐτοῦ.
- source_word: ἐν πραΰτητι σοφίας
  choice: com a mansidão que vem da sabedoria
  rationale: Torna natural em português a relação genitiva condensada, entendendo a mansidão como procedente ou caracterizada pela sabedoria, sem eliminar a alternativa formal.
theological_decisions:
- issue: Relação entre mansidão e sabedoria
  choice: com a mansidão que vem da sabedoria
  alternative: na mansidão da sabedoria
  rationale: O genitivo σοφίας admite uma formulação mais literal e ambígua; a redação principal comunica de modo claro a provável ideia de uma mansidão produzida ou marcada pela sabedoria, e a alternativa é preservada em nota.
- issue: Singular representativo de δειξάτω
  choice: Mostre
  alternative: Que tal pessoa mostre
  rationale: A terceira pessoa singular do grego dirige a exortação a qualquer pessoa que se considere sábia e entendida. A forma portuguesa “mostre” conserva o singular sem introduzir gênero que o verbo português não marca.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” comunica naturalmente o plural ὑμῖν; “conduta”, “obras” e “mansidão” preservam o vocabulário moral e sapiencial do texto.
