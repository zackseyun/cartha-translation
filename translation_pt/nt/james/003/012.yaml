id: JAS.3.12
reference: James 3:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ δύναται, ἀδελφοί μου, συκῆ ἐλαίας ποιῆσαι ἢ ἄμπελος σῦκα; ⸂οὔτε ἁλυκὸν⸃ γλυκὺ ποιῆσαι ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/012.yaml
  text: My brothers[a], can a fig tree produce olives[c][b], or a grapevine figs? Neither can salt water produce fresh water.
translation:
  language: pt
  text: Meus irmãos[a], acaso uma figueira pode produzir azeitonas, ou uma videira, figos? Tampouco água salgada pode produzir água doce[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Meus irmãos e irmãs». O grego diz «irmãos», uma forma masculina plural que pode dirigir-se a um grupo misto.
    reason: lexical_alternative
  - marker: b
    text: 'A última oração é elíptica no grego e, à luz da imagem da fonte no versículo anterior, também pode ser entendida assim: «Tampouco uma fonte salgada pode produzir água doce».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί μου
  choice: Meus irmãos
  rationale: Preserva a forma masculina plural do vocativo grego, que neste contexto pode dirigir-se à comunidade inteira; a possibilidade inclusiva é indicada em nota.
- source_word: μὴ δύναται
  choice: acaso ... pode
  rationale: A pergunta retórica introduzida por μή espera resposta negativa; «acaso» torna essa expectativa natural e clara em português sem converter a pergunta em afirmação.
- source_word: συκῆ
  choice: figueira
  rationale: Designa a árvore, e «figueira» é o equivalente português direto e corrente.
- source_word: ἐλαίας ποιῆσαι
  choice: produzir azeitonas
  rationale: Neste contexto, ποιέω indica dar ou produzir fruto; a formulação é clara e mantém o paralelismo com a cláusula final.
- source_word: ἄμπελος
  choice: videira
  rationale: Identifica naturalmente em português a planta que produz uvas e preserva a imagem agrícola.
- source_word: σῦκα
  choice: figos
  rationale: Equivalente direto do plural grego referente ao fruto.
- source_word: οὔτε ἁλυκὸν
  choice: Tampouco água salgada
  rationale: A construção grega é elíptica, com o adjetivo «salgado» usado substantivamente. «Água salgada» completa a elipse sem especificar desnecessariamente uma fonte.
- source_word: γλυκὺ ποιῆσαι ὕδωρ
  choice: pode produzir água doce
  rationale: Embora γλυκύς signifique literalmente «doce», aplicado à água contrasta com «salgada» e corresponde naturalmente a «água doce» em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Água doce» é a expressão idiomática portuguesa para água não salgada. A pontuação conserva a pergunta retórica seguida de uma conclusão negativa paralela.
