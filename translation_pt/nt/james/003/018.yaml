  text: καρπὸς ⸀δὲ δικαιοσύνης ἐν εἰρήνῃ σπείρεται τοῖς ποιοῦσιν εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/018.yaml
  text: And the fruit of righteousness is sown in peace by those who make peace[a][b].
translation:
  language: pt
  text: E o fruto da justiça é semeado em paz pelos que promovem a paz[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o fruto da retidão”. A palavra grega pode abranger tanto a conduta moralmente correta quanto relações justas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para os que promovem a paz”. O dativo grego admite essa interpretação, embora “pelos que promovem a paz” combine melhor com o verbo passivo neste contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: καρπὸς
  choice: fruto
  rationale: Preserva de modo natural a metáfora agrícola e a forma lexical do singular grego; “colheita” é possível pelo contexto, mas explicitaria uma etapa diferente da imagem.
- source_word: δὲ
  choice: E
  rationale: Aqui δέ funciona como conexão leve com a descrição anterior da sabedoria do alto, sem exigir contraste forte.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: “Justiça” é corrente e abrangente em português, podendo incluir retidão moral e relações justas; mantém aberta a nuance exata do genitivo.
- source_word: ἐν εἰρήνῃ
  choice: em paz
  rationale: Reprodução concisa e natural que preserva a possível ideia de maneira ou esfera em que ocorre a semeadura.
- source_word: σπείρεται
  choice: é semeado
  rationale: Representa diretamente o presente passivo e conserva a metáfora da semeadura.
- source_word: τοῖς ποιοῦσιν εἰρήνην
  choice: pelos que promovem a paz
  rationale: O dativo junto ao verbo passivo favorece a leitura de agente. “Promovem a paz” expressa em português corrente a ação de produzir ou estabelecer paz, sem reduzi-la a mera disposição interior.
theological_decisions:
- issue: Sentido de “fruto da justiça”
  choice: Manter a construção genitiva “fruto da justiça”, sem definir se o fruto consiste em justiça, é caracterizado por ela ou a produz.
  alternative: “colheita de justiça” ou “fruto que produz justiça”
  rationale: O contexto associa a sabedoria do alto, a paz e a justiça, mas a relação exata indicada pelo genitivo δικαιοσύνης permanece aberta; a formulação conserva essa tensão.
- issue: Função do dativo τοῖς ποιοῦσιν εἰρήνην
  choice: 'Agente: “pelos que promovem a paz”.'
  alternative: 'Beneficiário: “para os que promovem a paz”.'
  rationale: Com σπείρεται no passivo, a leitura agentiva é a mais natural, embora o dativo também permita uma interpretação de benefício; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Promovem a paz” soa mais natural do que o decalque “fazem a paz” e mantém o sentido ativo da expressão grega.
