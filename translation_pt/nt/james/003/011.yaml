lexical_decisions:
- source_word: μήτι
  choice: Por acaso ...?
  rationale: Introduz uma pergunta retórica que espera resposta negativa. Em português, “Por acaso...?” preserva essa força de modo natural, sem inserir uma negação ausente da forma grega.
- source_word: πηγή
  choice: fonte
  rationale: Designa uma nascente ou fonte de água. “Fonte” é claro e corrente em português amplo e se ajusta naturalmente à imagem.
- source_word: ἐκ τῆς αὐτῆς ὀπῆς
  choice: pela mesma abertura
  rationale: ὀπή indica uma abertura ou orifício. “Abertura” mantém a imagem física sem a estranheza de “buraco”; “pela” expressa naturalmente a saída da água.
- source_word: βρύει
  choice: faz jorrar
  rationale: O verbo descreve o brotar ou jorrar de líquido. “Faz jorrar” conserva a vivacidade da imagem e funciona naturalmente com “fonte”.
- source_word: τὸ γλυκύ
  choice: água doce
  rationale: O adjetivo substantivado significa literalmente “o doce” no contexto da água. Explicitar “água” torna a frase natural; “doce” preserva o contraste lexical direto com “amarga”, sem interpretar como “potável” ou “fresca”.
- source_word: τὸ πικρόν
  choice: água amarga
  rationale: O adjetivo substantivado significa “o amargo” e se refere à água. “Água amarga” preserva o contraste expresso no grego.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A pergunta retórica conserva a expectativa de resposta negativa de μήτι. A repetição de “água” esclarece os adjetivos substantivados, enquanto a nota registra a forma mais literal.
