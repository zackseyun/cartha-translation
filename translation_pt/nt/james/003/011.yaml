  text: Does a spring pour out both sweet and bitter water from the same opening?[a]
translation:
  language: pt
  text: Por acaso uma fonte jorra, da mesma abertura, água doce e água amarga?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Por acaso a fonte jorra o doce e o amargo da mesma abertura?”'
