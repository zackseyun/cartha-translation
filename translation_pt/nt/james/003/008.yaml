  text: τὴν δὲ γλῶσσαν οὐδεὶς ⸂δαμάσαι δύναται ἀνθρώπων⸃· ⸀ἀκατάστατον κακόν, μεστὴ ἰοῦ θανατηφόρου.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/008.yaml
  text: But no one among men is able to tame the tongue[a]. It is a restless evil[b], full of deadly poison.
translation:
  language: pt
  text: Mas ninguém dentre os seres humanos é capaz de domar a língua. Ela é um mal irrequieto[a], cheia de veneno mortal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “instável” ou “indisciplinado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσαν
  choice: a língua
  rationale: Mantém a imagem concreta já estabelecida no contexto para representar a fala humana.
- source_word: οὐδεὶς ... ἀνθρώπων
  choice: ninguém dentre os seres humanos
  rationale: Expressa o genitivo partitivo (“ninguém dos seres humanos”) de modo natural e inclusivo em português, sem alterar a referência universal.
- source_word: δαμάσαι δύναται
  choice: é capaz de domar
  rationale: Preserva tanto a ideia de capacidade quanto o vínculo verbal com a domesticação dos animais nos versículos anteriores.
- source_word: ἀκατάστατον
  choice: inconstante
  rationale: Comunica a instabilidade e a falta de controle denotadas pelo adjetivo, preservando sua amplitude sem reduzi-lo apenas a agitação.
- source_word: κακόν
  choice: mal
  rationale: Retém a força moral e destrutiva do substantivo grego.
- source_word: μεστὴ ἰοῦ θανατηφόρου
  choice: cheia de veneno mortal
  rationale: Formulação natural que conserva a imagem da língua repleta de uma substância capaz de causar a morte.
theological_decisions:
- issue: Alcance humano de οὐδεὶς ... ἀνθρώπων
  choice: ninguém dentre os seres humanos
  alternative: nenhum homem
  rationale: O grego emprega linguagem humana genérica e uma construção partitiva; a formulação escolhida preserva a universalidade sem sugerir uma restrição ao sexo masculino.
- issue: Nuance de ἀκατάστατον
  choice: inconstante
  alternative: irrequieto; indomável
  rationale: “Inconstante” mantém a noção lexical de instabilidade ou desordem. “Indomável” criaria repetição interpretativa com “domar” e poderia tornar a afirmação mais absoluta do que o adjetivo isoladamente exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva o contraste inicial e a metáfora concreta da língua.
