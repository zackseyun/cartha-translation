id: JAS.3.16
reference: James 3:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅπου γὰρ ζῆλος καὶ ἐριθεία, ἐκεῖ ἀκαταστασία καὶ πᾶν φαῦλον πρᾶγμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/016.yaml
  text: For where jealousy and selfish ambition are[b][a], there is disorder and every vile practice.
translation:
  language: pt
  text: Pois, onde há inveja[a] e ambição egoísta, aí há desordem e todo tipo de prática má[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ciúme». O termo grego também pode significar «zelo», mas aqui o contexto é claramente negativo.
    reason: lexical_alternative
  - marker: b
    text: Ou «toda prática vil»; mais literalmente, «toda coisa má/vil».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: onde
  rationale: Introduz uma condição locativa geral e mantém, com ἐκεῖ, a estrutura proverbial «onde... aí...».
- source_word: γὰρ
  choice: pois
  rationale: Preserva a ligação explicativa com o versículo anterior de maneira natural e digna em português.
- source_word: ζῆλος
  choice: inveja
  rationale: O contexto imediato exige o sentido negativo do termo. «Inveja» é claro no português contemporâneo; «ciúme» também é possível, enquanto «zelo» sugeriria aqui um sentido inadequadamente positivo.
- source_word: ἐριθεία
  choice: ambição egoísta
  rationale: Expressa a busca interesseira de vantagem e o espírito de rivalidade ou facção implícitos no termo.
- source_word: ἐκεῖ
  choice: aí
  rationale: Corresponde naturalmente a ὅπου e preserva a construção «onde... aí...».
- source_word: ἀκαταστασία
  choice: desordem
  rationale: Designa perturbação, instabilidade ou tumulto, especialmente no âmbito comunitário, e não mera confusão mental.
- source_word: πᾶν
  choice: todo tipo de
  rationale: Com o substantivo singular, esta formulação comunica idiomaticamente a abrangência distributiva em português sem sugerir apenas uma prática isolada.
- source_word: φαῦλον
  choice: má
  rationale: Transmite a avaliação moral negativa do adjetivo; «vil» ou «perversa» seriam alternativas mais fortes.
- source_word: πρᾶγμα
  choice: prática
  rationale: No contexto de vícios e conduta, «prática» expressa naturalmente atos ou atividades, evitando o literalismo pouco claro de «coisa».
theological_decisions:
- issue: Força moral de ζῆλος no contexto
  choice: Termo negativo traduzido como «inveja»
  alternative: «Ciúme»; ou, lexicalmente mas não neste contexto, «zelo»
  rationale: Tiago 3:14-15 apresenta ζῆλος como característica da sabedoria terrena e não espiritual. A tradução deve preservar esse valor negativo sem transformar o termo em uma virtude.
- issue: Abrangência de πᾶν φαῦλον πρᾶγμα
  choice: «todo tipo de prática má»
  alternative: «toda prática má» ou, mais literalmente, «toda coisa má/vil»
  rationale: A formulação escolhida comunica condutas moralmente más de toda espécie, mantendo a força abrangente da expressão sem restringi-la a uma categoria doutrinária específica.
translation_notes:
  register: Português moderno, claro e amplamente compreensível, com boa legibilidade brasileira. A construção «onde... aí...» conserva o paralelismo grego; «ambição egoísta» mantém a linguagem moral sem soar arcaica. Todos os marcadores de nota aparecem no texto.
