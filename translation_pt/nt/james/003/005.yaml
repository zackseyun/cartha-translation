  text: οὕτως καὶ ἡ γλῶσσα μικρὸν μέλος ἐστὶν καὶ ⸂μεγάλα αὐχεῖ⸃. Ἰδοὺ ⸀ἡλίκον πῦρ ἡλίκην ὕλην ἀνάπτει·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/005.yaml
  text: So also the tongue is a small member[a], and yet it boasts of great things[b]. See how small a fire sets ablaze so great a forest.
translation:
  language: pt
  text: Assim também a língua é um pequeno membro e se gaba de grandes coisas. Vejam como um fogo pequeno[a] incendeia uma floresta tão grande[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Vejam como um grande fogo incendeia uma floresta tão grande». A expressão grega pode ser entendida como uma exclamação sobre a grandeza do fogo; o texto principal, porém, segue a ideia de uma causa pequena que produz um grande efeito, em harmonia com a comparação imediata da língua com um pequeno membro.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «uma quantidade tão grande de madeira» ou «uma mata tão grande». A palavra grega pode indicar de modo amplo material combustível, madeira ou região arborizada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα
  choice: língua
  rationale: Preserva a imagem concreta da parte do corpo, que sustenta a comparação com «pequeno membro», sem substituí-la pela interpretação «fala».
- source_word: μικρὸν μέλος
  choice: um pequeno membro
  rationale: Mantém de forma concisa a metáfora corporal e a ligação com as comparações anteriores. «Uma pequena parte do corpo» seria mais explícito, mas também mais interpretativo.
- source_word: μεγάλα αὐχεῖ
  choice: se gaba de grandes coisas
  rationale: Reproduz o sentido de fazer afirmações grandiosas ou orgulhosas e conserva a tensão entre o tamanho pequeno da língua e a grandeza do que ela reivindica.
- source_word: Ἰδοὺ
  choice: Vejam
  rationale: Expressa em português moderno o chamado enfático para prestar atenção à ilustração seguinte.
- source_word: ἡλίκον πῦρ
  choice: como um fogo pequeno
  rationale: No contexto, destaca a desproporção entre uma causa pequena e um efeito enorme, em paralelo com a língua como pequeno membro. A formulação grega também admite uma leitura exclamativa diferente, registrada em nota.
- source_word: ἡλίκην ὕλην
  choice: uma floresta tão grande
  rationale: ὕλη pode designar mata, madeira ou material combustível. «Floresta» comunica com clareza e naturalidade a grande extensão atingida pelo fogo, sem reduzir a imagem a madeira já cortada.
- source_word: ἀνάπτει
  choice: incendeia
  rationale: Verbo vivo e corrente que comunica claramente que o fogo põe toda a floresta em chamas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Mas» torna natural o valor contrastivo da segunda oração. «Vejam» evita o arcaísmo de «Eis» e conserva a função de chamar a atenção. A pontuação exclamativa realça a força retórica da ilustração.
