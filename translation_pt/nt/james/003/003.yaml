  text: ⸂εἰ δὲ⸃ τῶν ἵππων τοὺς χαλινοὺς εἰς τὰ στόματα βάλλομεν ⸀εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν, καὶ ὅλον τὸ σῶμα αὐτῶν μετάγομεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/003.yaml
  text: If we put bits into the mouths of horses so that they obey us[a], we also guide their whole bodies.
translation:
  language: pt
  text: Se colocamos freios na boca dos cavalos para que nos obedeçam[a], também dirigimos o corpo inteiro deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «bridões», embora a referência imediata seja mais precisamente ao freio colocado na boca do cavalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Se
  rationale: Introduz uma condição ilustrativa. Em português, «Se» comunica naturalmente a força condicional; o valor conectivo leve de δέ pode ficar implícito sem acrescentar um marcador temporal inexistente.
- source_word: χαλινοὺς
  choice: freios
  rationale: No contexto de algo colocado na boca do cavalo, refere-se à peça bucal usada para controlá-lo. «Freios» é corrente e natural em português.
- source_word: εἰς τὰ στόματα
  choice: na boca
  rationale: Com βάλλομεν, a expressão indica colocação para dentro da boca. O singular distributivo «na boca dos cavalos» é idiomático em português.
- source_word: βάλλομεν
  choice: colocamos
  rationale: Expressa de modo natural o ato de pôr a peça na boca dos cavalos, sem a conotação indevida de «lançar».
- source_word: εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν
  choice: para que nos obedeçam
  rationale: Preserva o valor de finalidade da construção com εἰς e infinitivo e traduz πείθεσθαι com dativo como obediência.
- source_word: μετάγομεν
  choice: dirigimos
  rationale: O verbo descreve conduzir ou direcionar o movimento; «dirigimos» se ajusta à imagem do controle do cavalo.
- source_word: ὅλον τὸ σῶμα αὐτῶν
  choice: o corpo inteiro deles
  rationale: Mantém o singular distributivo do grego e soa natural, indicando o corpo inteiro de cada cavalo.
