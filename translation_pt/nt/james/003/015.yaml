id: JAS.3.15
reference: James 3:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐκ ἔστιν αὕτη ἡ σοφία ἄνωθεν κατερχομένη, ἀλλὰ ἐπίγειος, ψυχική, δαιμονιώδης·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/015.yaml
  text: This wisdom is not coming down from above[a], but is earthly, unspiritual, demonic.
translation:
  language: pt
  text: Essa sabedoria não é a que desce do alto, mas é terrena, natural[a] e demoníaca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não espiritual”. O adjetivo grego pode indicar aquilo que pertence apenas à vida natural, em contraste com o que é espiritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη ἡ σοφία
  choice: Essa sabedoria
  rationale: O demonstrativo retoma a espécie de sabedoria descrita no contexto anterior. “Essa sabedoria” é direto e natural em português.
- source_word: ἄνωθεν
  choice: do alto
  rationale: Preserva a expressão espacial e sua ressonância de origem divina em Tiago, sem explicitar interpretativamente “do céu”.
- source_word: κατερχομένη
  choice: a que desce
  rationale: Reproduz o particípio presente que caracteriza a sabedoria e mantém, em português natural, a imagem do que vem descendo do alto.
- source_word: ἐπίγειος
  choice: terrena
  rationale: Mantém o contraste lexical com “do alto” e evita a nuance adicional que “mundana” poderia introduzir.
- source_word: ψυχική
  choice: natural
  rationale: Expressa o que pertence à vida meramente natural, em contraste com o que é espiritual. Como o termo grego admite nuances difíceis de reunir numa só palavra, a nota registra a alternativa “não espiritual”.
- source_word: δαιμονιώδης
  choice: demoníaca
  rationale: Equivalente português claro e conciso para aquilo que pertence aos demônios ou é caracterizado por eles.
theological_decisions:
- issue: Sentido de ψυχική no contraste espiritual e moral
  choice: natural
  alternative: não espiritual
  rationale: “Natural” preserva melhor a ligação lexical com a esfera da vida meramente humana sem definir além do texto a relação precisa com o Espírito. A nota esclarece que, no contexto, há contraste com o espiritual, preservando a tensão sem importar um sistema doutrinário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “não é a que desce do alto” mantém a imagem verbal do grego; a sequência de três adjetivos conserva a força acumulativa do original.
