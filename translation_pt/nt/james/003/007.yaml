id: JAS.3.7
reference: James 3:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πᾶσα γὰρ φύσις θηρίων τε καὶ πετεινῶν ἑρπετῶν τε καὶ ἐναλίων δαμάζεται καὶ δεδάμασται τῇ φύσει τῇ ἀνθρωπίνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/007.yaml
  text: For every kind of beast and bird[a], of reptile and sea creature, is being tamed and has been tamed by humankind.
translation:
  language: pt
  text: Pois toda espécie de animais selvagens e de aves, de répteis e de criaturas marinhas, vem sendo domada e já foi domada pela humanidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pela natureza humana” ou “pelo gênero humano”. A expressão grega τῇ φύσει τῇ ἀνθρωπίνῃ pode ser entendida coletivamente, referindo-se à humanidade, ou de modo mais abstrato, referindo-se à natureza ou esfera humana; o texto principal adota o sentido coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ... φύσις
  choice: toda espécie
  rationale: No catálogo zoológico, φύσις tem o sentido idiomático de espécie ou tipo; o singular também preserva a construção distributiva de πᾶσα.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e mantém de modo natural a ligação argumentativa.
- source_word: θηρίων
  choice: animais selvagens
  rationale: Expressa claramente o sentido comum de θηρίον como animal ou fera selvagem, sem o tom potencialmente arcaico de “feras”.
- source_word: πετεινῶν
  choice: aves
  rationale: É a designação portuguesa natural e concisa para as criaturas voadoras mencionadas no catálogo.
- source_word: ἑρπετῶν
  choice: répteis
  rationale: É a categoria moderna usual, embora o termo grego possa abranger mais amplamente criaturas rastejantes.
- source_word: ἐναλίων
  choice: criaturas marinhas
  rationale: Mantém a amplitude do substantivo adjetival grego, que designa seres que vivem no mar.
- source_word: δαμάζεται
  choice: vem sendo domada
  rationale: A locução ressalta o processo contínuo ou geral expresso pelo presente passivo e contrasta com a ação já realizada.
- source_word: δεδάμασται
  choice: já foi domada
  rationale: Comunica uma ação realizada com resultado presente; “tem sido domada” em português tenderia a sugerir repetição continuada e reduziria o contraste aspectual.
- source_word: τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: pela humanidade
  rationale: Toma a expressão coletivamente, como referência aos seres humanos enquanto agentes, em linguagem atual e inclusiva, sem ocultar a leitura mais abstrata possível.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração conserva as quatro classes do grego, e a combinação “vem sendo domada e já foi domada” procura reproduzir o contraste entre o presente passivo e o perfeito passivo sem soar artificial.
