id: JAS.3.1
reference: James 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μὴ πολλοὶ διδάσκαλοι γίνεσθε, ἀδελφοί μου, εἰδότες ὅτι μεῖζον κρίμα λημψόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/001.yaml
  text: Not many of you should become teachers[a], my brothers, knowing that we will receive a greater judgment.
translation:
  language: pt
  text: Meus irmãos, não sejam muitos de vocês a se tornarem mestres, pois sabem que receberemos um julgamento maior.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” aqui provavelmente se dirige a toda a comunidade, incluindo as irmãs.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ πολλοὶ
  choice: não sejam muitos de vocês
  rationale: A combinação de μή com o imperativo presente γίνεσθε expressa proibição ou exortação. A formulação mantém a referência direta à audiência e soa natural em português.
- source_word: διδάσκαλοι
  choice: mestres
  rationale: No contexto comunitário, designa aqueles que ensinam. “Mestres” é uma equivalência corrente e não pressupõe, por si só, um cargo formal além do texto.
- source_word: γίνεσθε
  choice: sejam
  rationale: Embora γίνομαι possa significar “tornar-se”, com o predicativo διδάσκαλοι a expressão portuguesa “não sejam muitos de vocês mestres” comunica de modo natural a advertência contra assumir esse papel.
- source_word: ἀδελφοί μου
  choice: meus irmãos
  rationale: Preserva a forma masculina do grego e o tom afetivo do vocativo; uma nota registra que a expressão provavelmente abrange toda a comunidade, incluindo as irmãs.
- source_word: εἰδότες
  choice: pois sabem
  rationale: 'Explicita com naturalidade o valor causal provável do particípio, sem acrescentar conteúdo: a consciência do juízo fundamenta a exortação.'
- source_word: μεῖζον
  choice: maior
  rationale: Mantém o sentido comparativo básico do adjetivo e evita interpretar antecipadamente a natureza do aumento como rigor ou severidade.
- source_word: κρίμα
  choice: julgamento
  rationale: Preserva a amplitude semântica de κρίμα, que pode indicar julgamento, veredito ou condenação, sem impor aqui a noção mais específica de condenação final.
- source_word: λημψόμεθα
  choice: nós receberemos
  rationale: Reproduz o futuro e a primeira pessoa do plural, pela qual o autor aparentemente se inclui entre os que ensinam.
theological_decisions:
- issue: Abrangência de ἀδελφοί μου numa comunidade mista
  choice: “meus irmãos” no texto, com nota sobre o provável sentido comunitário inclusivo
  alternative: “meus irmãos e irmãs”
  rationale: A tradução conserva a forma lexical do grego, enquanto a nota evita que leitores modernos entendam a exortação como necessariamente restrita aos homens.
- issue: Força de κρίμα na advertência aos mestres
  choice: “julgamento”
  alternative: “condenação” ou “sentença”
  rationale: O versículo afirma responsabilidade maior, mas κρίμα não exige que o tradutor especifique condenação final. “Julgamento” preserva a tensão teológica.
- issue: Natureza da comparação em μεῖζον κρίμα
  choice: “julgamento maior”
  alternative: “julgamento mais rigoroso”
  rationale: “Maior” corresponde diretamente ao comparativo μεῖζον e deixa em aberto se a grandeza diz respeito ao rigor, à severidade ou à responsabilidade implicada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem inicia pelo vocativo para evitar uma construção excessivamente pesada, sem alterar a lógica da advertência. O pronome explícito “nós” ressalta que Tiago se inclui entre os que receberão o julgamento.
