review_pass:
  verdict: revise
  source_fidelity: A advertência, o plural dirigido à comunidade, a inclusão de Tiago em «receberemos» e «julgamento maior» são bem preservados. Contudo, «não sejam ... mestres» atenua o valor ingressivo de γίνεσθε («tornem-se»), que se refere a assumir/tornar-se professor, não meramente a ser professor.
  naturalness: A redação é clara, mas «não sejam muitos de vocês mestres» pode soar como uma descrição ou como uma formulação sintaticamente pesada. «Não sejam muitos de vocês a se tornarem mestres» é natural no português brasileiro de registro cuidado e comunica a exortação com maior precisão.
  terminology: «Mestres», «irmãos», «julgamento maior» e a nota sobre o provável alcance comunitário de «irmãos» são adequados. «Julgamento maior» mantém de forma prudente a amplitude de μεῖζον κρίμα.
  issues:
  - severity: medium
    issue: O verbo γίνεσθε não é plenamente expresso como «tornar-se».
    rationale: γίνεσθε é um imperativo presente de γίνομαι e, neste contexto, adverte contra passar a ocupar o papel de mestre. A formulação atual com «sejam» pode ser entendida apenas como «ser», sem o aspecto de ingresso no papel.
  revised_text: Meus irmãos, não sejam muitos de vocês a se tornarem mestres, pois sabem que receberemos um julgamento maior.[a]
