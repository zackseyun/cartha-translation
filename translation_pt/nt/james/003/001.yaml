- from: Meus irmãos, não sejam muitos de vocês mestres, pois sabem que nós receberemos um julgamento maior.[a]
  to: Meus irmãos, não sejam muitos de vocês a se tornarem mestres, pois sabem que receberemos um julgamento maior.[a]
  rationale: A revisão substitui «sejam ... mestres» por «a se tornarem mestres» para representar explicitamente o sentido de γίνεσθε, preservando a advertência contra muitos membros assumirem a função de ensinar. Mantêm-se o registro, a inclusividade anotada, o plural de primeira pessoa e a ambiguidade prudente de «julgamento maior».
