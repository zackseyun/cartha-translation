source:
  edition: SBLGNT
  text: εἰ δὲ ζῆλον πικρὸν ἔχετε καὶ ἐριθείαν ἐν τῇ καρδίᾳ ὑμῶν, μὴ κατακαυχᾶσθε καὶ ψεύδεσθε κατὰ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/014.yaml
  text: But if you have bitter jealousy and selfish ambition in your hearts[d][c][b][a], do not boast and lie against the truth.
translation:
  language: pt
  text: Mas, se vocês têm inveja amarga[a] e ambição egoísta[b] em seus corações[c], não se vangloriem nem mintam contra a verdade[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ciúme amargo” ou “zelo amargo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “rivalidade” ou “espírito faccioso”.
    reason: lexical_alternative
  - marker: c
    text: Ou “no coração”.
    reason: previous_rendering
  - marker: d
    text: Ou “sejam falsos para com a verdade” ou “mintam em oposição à verdade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῆλον πικρὸν
  choice: inveja amarga
  rationale: No contexto negativo e em paralelo com ἐριθεία, ζῆλος indica sobretudo inveja ou ciúme hostil; “inveja amarga” é natural e preserva diretamente πικρόν.
- source_word: ἐριθείαν
  choice: ambição egoísta
  rationale: Expressa a busca interesseira de posição ou vantagem, com potencial de rivalidade e divisão.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: no coração
  rationale: O grego traz καρδίᾳ no singular com pronome plural, uma construção distributiva. Em português, “no coração” conserva essa forma e é naturalmente entendido como o coração de cada pessoa.
- source_word: μὴ κατακαυχᾶσθε
  choice: não se vangloriem
  rationale: O verbo denota gloriar-se ou exaltar-se de modo arrogante; a forma escolhida é clara, digna e concisa.
- source_word: ψεύδεσθε κατὰ τῆς ἀληθείας
  choice: nem mintam contra a verdade
  rationale: “Mintam” preserva o valor verbal de ψεύδεσθε, enquanto “contra” representa a oposição expressa por κατά com genitivo.
- source_word: εἰ δὲ
  choice: Mas, se
  rationale: Marca adequadamente o contraste com a descrição anterior da sabedoria do alto.
theological_decisions:
- issue: Natureza de “a verdade”
  choice: a verdade
  alternative: a verdade do evangelho; o verdadeiro caminho da sabedoria; a sinceridade
  rationale: A expressão permanece ampla, sem restringi-la a uma fórmula doutrinária específica nem reduzi-la à mera honestidade pessoal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural “vocês” explicita os destinatários, enquanto o singular distributivo “no coração” preserva a construção grega. As notas mantêm alternativas lexicais genuínas sem sobrecarregar o texto principal.
