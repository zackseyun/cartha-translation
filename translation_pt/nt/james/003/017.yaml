  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ δὲ ἄνωθεν σοφία πρῶτον μὲν ἁγνή ἐστιν, ἔπειτα εἰρηνική, ἐπιεικής, εὐπειθής, μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν, ⸀ἀδιάκριτος, ἀνυπόκριτος·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/017.yaml
  text: But the wisdom from above is first pure[a], then peaceable, gentle, open to reason, full of mercy and good fruits, impartial, sincere.
translation:
  language: pt
  text: Mas a sabedoria que vem do alto é, antes de tudo, pura; depois, pacífica, gentil, disposta a ouvir, cheia de misericórdia e de bons frutos, imparcial[a] e sincera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem parcialidade”. O adjetivo grego também pode ser entendido como “sem divisão” ou “sem incerteza ou dúvida”.
    reason: 'Alternativa lexical: ἀδιάκριτος possui mais de uma interpretação plausível no contexto de Tiago.'
lexical_decisions:
- source_word: ἄνωθεν
  choice: que vem do alto
  rationale: Preserva a imagem espacial do grego e o contraste contextual com a sabedoria terrena de Tiago 3:15, sem explicitar além do texto com “do céu”.
- source_word: σοφία
  choice: sabedoria
  rationale: Equivalente direto e natural; no contexto, designa a espécie de sabedoria descrita por suas qualidades.
- source_word: πρῶτον μὲν
  choice: antes de tudo
  rationale: Expressa a prioridade assinalada pela construção grega e introduz naturalmente a enumeração em português.
- source_word: ἁγνή
  choice: pura
  rationale: Comunica pureza moral e integridade sem restringir o termo ao sentido de castidade.
- source_word: ἔπειτα
  choice: depois
  rationale: Mantém a progressão entre a primeira qualidade e as seguintes.
- source_word: εἰρηνική
  choice: pacífica
  rationale: Indica uma disposição que promove a paz, e não apenas um estado de tranquilidade.
- source_word: ἐπιεικής
  choice: gentil
  rationale: Termo claro e corrente que comunica brandura e consideração, embora o grego também possa envolver moderação e condescendência.
- source_word: εὐπειθής
  choice: disposta a ouvir
  rationale: O adjetivo raro descreve receptividade e ausência de obstinação. A expressão evita sugerir credulidade ou submissão irrefletida.
- source_word: μεστὴ ἐλέους
  choice: cheia de misericórdia
  rationale: Reproduz de modo direto a ideia de abundância da construção grega.
- source_word: καρπῶν ἀγαθῶν
  choice: bons frutos
  rationale: Mantém o plural e a metáfora dos resultados visíveis, em vez de interpretá-la como “boas obras”.
- source_word: ἀδιάκριτος
  choice: imparcial
  rationale: No catálogo ético e diante da preocupação de Tiago com o favoritismo, “imparcial” é uma leitura contextual forte; a ambiguidade lexical é preservada em nota.
- source_word: ἀνυπόκριτος
  choice: sincera
  rationale: Expressa de maneira natural a ausência de fingimento ou hipocrisia.
theological_decisions:
- issue: Sentido de ἀδιάκριτος
  choice: imparcial
  alternative: íntegra, sem divisão; sem incerteza ou dúvida
  rationale: 'O termo admite relação com distinção ou parcialidade, mas também pode sugerir ausência de divisão interior ou de dúvida. Tiago oferece apoio contextual a ambas as linhas: condena o favoritismo em 2:1–4 e trata da pessoa dividida e da dúvida em 1:6–8 e 4:8. O texto principal adota a leitura social e ética mais provável, enquanto a nota conserva as demais possibilidades.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura conserva a progressão “antes de tudo... depois”, mantém a metáfora de “frutos” e posiciona a nota junto ao termo realmente ambíguo, “imparcial”.
