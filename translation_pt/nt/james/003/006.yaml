  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἡ γλῶσσα πῦρ, ὁ κόσμος τῆς ⸀ἀδικίας ἡ γλῶσσα καθίσταται ἐν τοῖς μέλεσιν ἡμῶν, ἡ σπιλοῦσα ὅλον τὸ σῶμα καὶ φλογίζουσα τὸν τροχὸν τῆς γενέσεως καὶ φλογιζομένη ὑπὸ τῆς γεέννης.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/006.yaml
  text: And the tongue is a fire. The tongue is set among our members as a world of unrighteousness, staining the whole body and setting on fire the wheel of birth, and being set on fire by Gehenna.
translation:
  language: pt
  text: E a língua é fogo. A língua está situada entre as partes do nosso corpo como um mundo de injustiça, manchando[a] o corpo inteiro, incendiando a roda do nascimento[b] e sendo incendiada pela Geena[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contaminando o corpo inteiro”.
    reason: lexical_alternative
  - marker: b
    text: Expressão grega difícil; também pode ser entendida como “o curso da vida” ou “o ciclo da vida”.
    reason: lexical_alternative
  - marker: c
    text: Geena é o termo grego; tradicionalmente traduzido por “inferno”.
    reason: alternative_reading
lexical_decisions:
- source_word: γλῶσσα
  choice: língua
  rationale: Preserva a imagem concreta do órgão do corpo usada por Tiago, ao mesmo tempo que implica a fala por metonímia.
- source_word: πῦρ
  choice: fogo
  rationale: Em português, o predicativo sem artigo é natural e mantém direta a metáfora destrutiva.
- source_word: ὁ κόσμος τῆς ἀδικίας
  choice: um mundo de injustiça
  rationale: Mantém a expressão vívida e abrangente, sem reduzi-la a uma paráfrase como 'cheia de maldade'; o artigo grego não exige artigo definido neste predicativo em português.
- source_word: καθίσταται ἐν τοῖς μέλεσιν ἡμῶν
  choice: se encontra entre os membros do nosso corpo
  rationale: Expressa de modo natural a posição ou condição da língua entre as partes do corpo, sem sugerir necessariamente nomeação formal; 'do nosso corpo' explicita o referente anatômico já presente no contexto.
- source_word: σπιλοῦσα
  choice: mancha
  rationale: Conserva a imagem de nódoa e sua dimensão de contaminação moral; a alternativa 'contamina' aparece em nota.
- source_word: ὅλον τὸ σῶμα
  choice: o corpo inteiro
  rationale: Tradução direta que preserva a força totalizante de ὅλον.
- source_word: φλογίζουσα
  choice: incendeia
  rationale: Mantém com concisão a imagem do fogo e a ação causativa do particípio.
- source_word: τὸν τροχὸν τῆς γενέσεως
  choice: a roda da existência
  rationale: Preserva a metáfora incomum de τροχός e traduz γένεσις aqui em seu sentido amplo de existência ou vida originada, sem transformar silenciosamente a expressão em uma interpretação.
- source_word: φλογιζομένη
  choice: é incendiada
  rationale: Preserva a voz passiva e mostra que a atividade destrutiva da língua recebe impulso de uma fonte externa.
- source_word: ὑπὸ τῆς γεέννης
  choice: pela Geena
  rationale: Translitera o termo grego específico, preservando sua precisão histórica e conceitual; a tradução tradicional é indicada em nota.
theological_decisions:
- issue: Sentido de τὸν τροχὸν τῆς γενέσεως
  choice: a roda da existência
  alternative: o curso da vida; o ciclo da vida; a roda do nascimento
  rationale: A expressão grega é difícil e metaforicamente incomum. A tradução principal conserva 'roda' e evita decidir entre todas as possíveis extensões de γένεσις; a nota registra opções interpretativas mais naturais.
- issue: Tradução de γέεννα
  choice: Geena
  alternative: inferno
  rationale: O texto emprega o termo específico γέεννα. Mantê-lo evita fundi-lo sem explicação com uma categoria teológica mais ampla, enquanto a nota oferece a forma tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação preserva as imagens concretas e a estranheza deliberada do grego, esclarecendo em notas as principais alternativas sem resolver indevidamente suas ambiguidades.
