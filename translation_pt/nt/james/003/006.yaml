  naturalness: O português é claro e de registro adequado. A revisão torna a sequência verbal mais coesa e mais próxima da progressão do original, sem sacrificar a legibilidade.
  terminology: “Língua”, “fogo”, “mundo de injustiça” e “Geena” são escolhas adequadas. “Partes do nosso corpo” comunica μέλη com mais precisão para leitores atuais do que “membros”, que pode sugerir apenas braços e pernas.
