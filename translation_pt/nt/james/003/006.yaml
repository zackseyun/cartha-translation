revisions:
- from: 'E a língua é fogo. A língua se encontra entre os membros do nosso corpo como um mundo de injustiça: ela mancha[a] o corpo inteiro, incendeia a roda da existência[b] e é incendiada pela Geena[c].'
  to: E a língua é fogo. A língua está situada entre as partes do nosso corpo como um mundo de injustiça, manchando[a] o corpo inteiro, incendiando a roda do nascimento[b] e sendo incendiada pela Geena[c].
  rationale: A revisão substitui a interpretação mais ampla “roda da existência” pela formulação mais literal “roda do nascimento”, preservando em nota as alternativas interpretativas. Também recompõe a sequência de particípios do grego em português e usa “partes do nosso corpo” para o sentido anatômico inclusivo de μέλη.
