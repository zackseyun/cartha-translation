  source_fidelity: O texto comunica com precisão o contraste do original entre navios grandes, ventos fortes e um leme muito pequeno que determina seu rumo. “Vejam também os navios” preserva adequadamente a função apelativa de ἰδοὺ καὶ, e “impelidos por ventos fortes” representa bem a construção passiva. A formulação principal “para onde quer aquele que os conduz” é uma explicitação idiomática legítima da construção incomum em que ἡ ὁρμή é o sujeito de βούλεται; a nota conserva essa particularidade lexical e sintática.
