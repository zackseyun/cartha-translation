reference: James 3:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδοὺ καὶ τὰ πλοῖα, τηλικαῦτα ὄντα καὶ ὑπὸ ⸂ἀνέμων σκληρῶν⸃ ἐλαυνόμενα, μετάγεται ὑπὸ ἐλαχίστου πηδαλίου ὅπου ⸂ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/004.yaml
  text: 'Look also at the ships: though they are so large and are driven by strong winds[a], they are steered by a very small rudder wherever the inclination of the one steering wills.'
translation:
  language: pt
  text: 'Vejam também os navios: embora sejam tão grandes e impelidos por ventos fortes, são dirigidos por um leme muito pequeno para onde quer aquele que os conduz.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “para onde quer a inclinação daquele que os conduz”. Também se pode traduzir: “para onde aquele que os conduz quer ir”.'
    reason: Preserva a construção incomum do grego com ὁρμή (“inclinação” ou “impulso”) e apresenta uma alternativa idiomática.
lexical_decisions:
- source_word: ἰδοὺ καὶ τὰ πλοῖα
  choice: Vejam também os navios
  rationale: Usa uma chamada de atenção natural no português moderno e apresenta o segundo exemplo em paralelo com o versículo anterior.
- source_word: τηλικαῦτα ὄντα
  choice: embora sejam tão grandes
  rationale: Expressa o tamanho impressionante dos navios e torna explícito o contraste concessivo com o leme muito pequeno.
- source_word: ὑπὸ ἀνέμων σκληρῶν ἐλαυνόμενα
  choice: impelidos por ventos fortes
  rationale: Mantém a construção passiva; “fortes” é idiomático para σκληρῶν aplicado a ventos, e “impelidos” comunica a força que move os navios.
- source_word: μετάγεται
  choice: são dirigidos
  rationale: No contexto náutico, indica que os navios têm seu curso controlado. O plural é exigido pela concordância natural em português, embora o grego use verbo singular com sujeito neutro plural.
- source_word: ὑπὸ ἐλαχίστου πηδαλίου
  choice: por um leme muito pequeno
  rationale: Comunica o valor intensivo do superlativo ἐλαχίστου sem sugerir necessariamente o menor leme possível em termos absolutos.
- source_word: ὅπου ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται
  choice: para onde quer aquele que os conduz
  rationale: Expressa com clareza o destino determinado pela vontade de quem governa o navio, enquanto a nota preserva a formulação incomum e mais literal do grego.
theological_decisions:
- issue: Grau de literalidade na descrição da vontade de quem conduz o navio
  choice: para onde quer aquele que os conduz
  alternative: para onde quer a inclinação daquele que os conduz
  rationale: A construção grega personifica de modo incomum a ὁρμή (“inclinação”, “impulso”) como sujeito de βούλεται (“quer”). O texto principal transmite naturalmente a ideia em português sem introduzir um título técnico como “piloto” ou “timoneiro”; a nota conserva a textura e a possível ênfase do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vejam” funciona como chamada direta de atenção; “impelidos”, “dirigidos” e “leme” mantêm com clareza a imagem náutica. A nota acompanha a cláusula a que efetivamente se refere.
