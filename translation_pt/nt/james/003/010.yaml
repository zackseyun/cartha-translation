  text: ἐκ τοῦ αὐτοῦ στόματος ἐξέρχεται εὐλογία καὶ κατάρα. οὐ χρή, ἀδελφοί μου, ταῦτα οὕτως γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/010.yaml
  text: From the same mouth come blessing and cursing. My brothers[a], these things ought not to be so.
translation:
  language: pt
  text: Da mesma boca saem bênção e maldição. Meus irmãos[a], essas coisas não devem ser assim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Meus irmãos e minhas irmãs»; o grego diz «irmãos», mas, neste contexto, Tiago provavelmente se dirige a toda a comunidade dos que creem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ αὐτοῦ στόματος
  choice: Da mesma boca
  rationale: Expressa de modo natural em português a origem das duas formas de fala e preserva a imagem concreta da boca como fonte.
- source_word: ἐξέρχεται
  choice: saem
  rationale: Embora o verbo grego esteja no singular, os dois sujeitos coordenados, «bênção e maldição», favorecem naturalmente o plural em português.
- source_word: εὐλογία
  choice: bênção
  rationale: No contexto da fala, designa uma bênção pronunciada; mantém o contraste direto com «maldição».
- source_word: κατάρα
  choice: maldição
  rationale: Representa diretamente a fala que amaldiçoa e forma um par claro e idiomático com «bênção».
- source_word: οὐ χρή
  choice: não deve
  rationale: Comunica a forte avaliação moral de que isso não é apropriado nem deve ocorrer, sem introduzir uma explicação ausente do grego.
- source_word: ἀδελφοί μου
  choice: Meus irmãos
  rationale: Conserva a forma masculina plural do grego; a provável inclusão de mulheres na comunidade é indicada em nota.
- source_word: ταῦτα οὕτως γίνεσθαι
  choice: isso não deve ser assim
  rationale: O pronome singular coletivo «isso» retoma com naturalidade, em português, a situação recém-descrita, enquanto «assim» preserva οὕτως.
theological_decisions:
- issue: Alcance de gênero em ἀδελφοί μου
  choice: Meus irmãos
  alternative: Meus irmãos e minhas irmãs
  rationale: A tradução principal mantém a forma masculina do texto grego, enquanto a nota registra que, no contexto, a expressão provavelmente se dirige a toda a comunidade cristã.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural sobretudo no uso brasileiro. A construção concisa preserva o paralelismo e a força da repreensão.
