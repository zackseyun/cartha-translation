id: JAS.3.9
reference: James 3:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν αὐτῇ εὐλογοῦμεν τὸν ⸀κύριον καὶ πατέρα, καὶ ἐν αὐτῇ καταρώμεθα τοὺς ἀνθρώπους τοὺς καθ’ ὁμοίωσιν θεοῦ γεγονότας·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/009.yaml
  text: With it we bless the Lord and Father[b][a], and with it we curse people who have been made according to the likeness of God.
translation:
  language: pt
  text: Com ela bendizemos o Senhor e Pai[a], e com ela amaldiçoamos os seres humanos[b], feitos à semelhança de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «o Senhor e Pai»; a expressão pode ser entendida em sentido apositivo, «o Senhor, que é Pai», ou como uma designação coordenada de Deus.
    reason: alternative_reading
  - marker: b
    text: Ou «as pessoas»; o termo grego se refere aqui à humanidade em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: com ela
  rationale: Retoma a língua no contexto anterior e expressa de modo natural em português o uso instrumental indicado pela preposição.
- source_word: εὐλογοῦμεν
  choice: bendizemos
  rationale: Preserva o sentido de dirigir bênção ou louvor a Deus e mantém o contraste lexical e moral com «amaldiçoamos».
- source_word: τὸν κύριον καὶ πατέρα
  choice: o Senhor e Pai
  rationale: Reproduz de perto a coordenação grega sem inserir um segundo artigo, preservando a possível relação apositiva entre os títulos.
- source_word: καταρώμεθα
  choice: amaldiçoamos
  rationale: É o equivalente direto e corrente, mantendo a força do contraste com «bendizemos».
- source_word: τοὺς ἀνθρώπους
  choice: os seres humanos
  rationale: Comunica claramente a referência genérica à humanidade, sem restringi-la aos homens do sexo masculino.
- source_word: καθ’ ὁμοίωσιν θεοῦ
  choice: à semelhança de Deus
  rationale: Formulação natural e digna em português, que conserva a linguagem de correspondência e a alusão à criação.
- source_word: γεγονότας
  choice: feitos
  rationale: Expressa o estado resultante e a agência divina implícita no contexto da criação, sem tornar a frase pesada.
theological_decisions:
- issue: Referência genérica de ἀνθρώπους
  choice: os seres humanos
  alternative: as pessoas; os homens
  rationale: O referente é a humanidade em geral. «Seres humanos» torna explícita essa abrangência e evita uma leitura exclusivamente masculina.
- issue: Relação entre «Senhor» e «Pai»
  choice: o Senhor e Pai
  alternative: o Senhor, que é Pai; o Senhor e o Pai
  rationale: A construção grega pode ser entendida de maneira apositiva ou como uma designação coordenada. A tradução conserva essa tensão sem decidir além do texto.
- issue: Alusão à criação na semelhança de Deus
  choice: feitos à semelhança de Deus
  alternative: que vieram a existir segundo a semelhança de Deus
  rationale: A formulação mantém a alusão à criação e a dignidade concedida por Deus, sem ampliar o texto com terminologia doutrinária adicional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Bendizemos» e «amaldiçoamos» preservam o contraste retórico; «seres humanos» explicita a referência inclusiva; a sintaxe «o Senhor e Pai» mantém a ambiguidade genuína do grego.
