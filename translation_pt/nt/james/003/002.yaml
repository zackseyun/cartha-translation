id: JAS.3.2
reference: James 3:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πολλὰ γὰρ πταίομεν ἅπαντες. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/002.yaml
  text: For we all stumble in many ways[a]. If anyone does not stumble in word, this one is a mature man[c][b], able also to bridle the whole body.
translation:
  language: pt
  text: Pois todos nós tropeçamos de muitas maneiras. Se alguém não tropeça no falar[a], esse é um homem maduro[b][c], capaz também de pôr freio no corpo inteiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, “em palavra”, isto é, na fala ou naquilo que diz.
    reason: lexical_alternative
  - marker: b
    text: Ou “perfeito” ou “completo”. Aqui, o termo grego provavelmente se refere à maturidade e à inteireza moral, não à ausência absoluta de pecado.
    reason: lexical_alternative
  - marker: c
    text: O grego diz “homem”; aqui, a palavra tem força representativa numa afirmação de aplicação geral.
    reason: cultural_note
lexical_decisions:
- source_word: πολλὰ
  choice: de muitas maneiras
  rationale: O acusativo neutro plural tem valor adverbial e indica os muitos aspectos ou modos em que todos falham; esta formulação é natural em português e preserva a amplitude da expressão.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa da frase em relação à advertência anterior sobre os mestres.
- source_word: πταίομεν / πταίει
  choice: tropeçamos / tropeça
  rationale: Preserva a metáfora de tropeçar usada para a falha moral, sem reduzi-la diretamente ao termo interpretativo “pecar”.
- source_word: ἅπαντες
  choice: todos nós
  rationale: Expressa com clareza a inclusão enfática do próprio autor.
- source_word: εἴ τις
  choice: Se alguém
  rationale: Reproduz a condição indefinida e sua aplicação geral.
- source_word: ἐν λόγῳ
  choice: no falar
  rationale: Neste contexto, λόγος se refere à fala ou ao que se diz. “No falar” é idiomático e mantém a formulação compacta.
- source_word: οὗτος
  choice: esse
  rationale: Preserva a força demonstrativa que aponta para a pessoa hipotética recém-descrita.
- source_word: τέλειος
  choice: maduro
  rationale: No contexto ético de Tiago, comunica integridade e maturidade de caráter sem sugerir necessariamente impecabilidade absoluta.
- source_word: ἀνήρ
  choice: homem
  rationale: Mantém o substantivo masculino explícito do grego; a expressão inicial “se alguém” mostra que a afirmação tem alcance geral.
- source_word: δυνατὸς
  choice: capaz
  rationale: Expressa diretamente a capacidade de governar também o restante da conduta.
- source_word: χαλιναγωγῆσαι
  choice: pôr freio
  rationale: Preserva de modo claro e natural a imagem do freio, que será desenvolvida nos versículos seguintes.
- source_word: καὶ ὅλον τὸ σῶμα
  choice: também ... o corpo inteiro
  rationale: “Também” mantém a força aditiva de καί, e “corpo inteiro” traduz naturalmente a totalidade expressa no grego.
theological_decisions:
- issue: Sentido de τέλειος no contexto ético
  choice: maduro
  alternative: perfeito; completo
  rationale: A referência imediata ao fato de que todos tropeçam torna improvável que o termo afirme impecabilidade absoluta. “Maduro” expressa o desenvolvimento e a inteireza moral, enquanto a nota preserva as alternativas lexicais legítimas.
- issue: Força representativa de ἀνήρ
  choice: homem, com aplicação geral
  alternative: pessoa
  rationale: O texto grego emprega explicitamente ἀνήρ, “homem”. A tradução mantém essa forma, sem restringir o princípio aos homens, pois εἴ τις significa “se alguém”.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A redação conserva as metáforas de tropeçar e pôr freio, bem como a conexão explicativa com o contexto anterior. “No falar” evita o pouco natural “em palavra”, explicado em nota; “homem maduro” preserva tanto o substantivo masculino do original quanto o sentido contextual de τέλειος.
