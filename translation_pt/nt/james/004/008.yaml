id: JAS.4.8
reference: James 4:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγγίσατε τῷ θεῷ, καὶ ⸀ἐγγιεῖ ὑμῖν. καθαρίσατε χεῖρας, ἁμαρτωλοί, καὶ ἁγνίσατε καρδίας, δίψυχοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/008.yaml
  text: Draw near to God[a], and he will draw near to you. Cleanse your hands, sinners, and purify your hearts, double-minded people.
translation:
  language: pt
  text: Aproximem-se de Deus, e ele se aproximará de vocês. Limpem as mãos, pecadores, e purifiquem os corações, vocês que têm a lealdade dividida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “de duas almas”. O termo descreve pessoas divididas em sua lealdade ou disposição interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίσατε
  choice: Aproximem-se
  rationale: Imperativo aoristo ativo, na segunda pessoa do plural. A forma pronominal é natural em português e preserva o sentido relacional e espiritual de aproximar-se de Deus.
- source_word: τῷ θεῷ
  choice: de Deus
  rationale: Com o verbo português escolhido, a regência natural é “aproximar-se de”; a tradução mantém Deus como aquele de quem os leitores devem se aproximar.
- source_word: ἐγγιεῖ
  choice: ele se aproximará
  rationale: Futuro ativo, na terceira pessoa do singular, tendo Deus como sujeito implícito. A repetição de “aproximar-se” conserva o paralelismo verbal do grego.
- source_word: καθαρίσατε
  choice: Limpem
  rationale: Imperativo aoristo ativo. “Limpem” é corrente e preserva tanto a imagem concreta quanto suas ressonâncias rituais e morais.
- source_word: χεῖρας
  choice: as mãos
  rationale: Mantém a imagem corporal, que sugere a conduta exterior sem substituí-la por uma explicação interpretativa.
- source_word: ἁμαρτωλοί
  choice: pecadores
  rationale: Vocativo plural direto, preservando a força incisiva da repreensão.
- source_word: ἁγνίσατε
  choice: purifiquem
  rationale: Distingue ἁγνίσατε de καθαρίσατε e conserva a passagem da limpeza das mãos à purificação interior.
- source_word: καρδίας
  choice: o coração
  rationale: O singular coletivo é mais idiomático em português na exortação dirigida ao grupo e representa o centro interior de cada pessoa, sem perder o sentido distributivo do plural grego.
- source_word: δίψυχοι
  choice: vocês que têm a lealdade dividida
  rationale: Expressa em linguagem clara a divisão interior de compromisso ou fidelidade indicada pelo adjetivo grego. A imagem etimológica mais literal é preservada em nota.
theological_decisions:
- issue: Imagem corporal e sentido moral da exortação
  choice: Manter “mãos” e “coração” no texto principal
  alternative: Explicitar como ações exteriores e motivações interiores
  rationale: As imagens podem carregar simultaneamente ressonâncias rituais e éticas. Mantê-las evita reduzir a tensão e a riqueza da linguagem de Tiago a uma única explicação.
- issue: Sentido de δίψυχοι
  choice: “vocês que têm a lealdade dividida” no texto principal
  alternative: “inconstantes”, “indecisos” ou, literalmente, “de alma dupla”
  rationale: A escolha comunica a divisão interior de fidelidade sem restringir o termo a mera indecisão psicológica. A nota conserva a imagem grega vívida e sua ambiguidade antropológica.
translation_notes:
  register: Português moderno, claro e digno, com formas plurais de ampla legibilidade brasileira. O paralelismo de “aproximem-se/se aproximará” e o contraste entre mãos e coração foram preservados. O marcador da nota foi colocado junto à expressão que traduz δίψυχοι, à qual a nota lexical efetivamente se refere.
