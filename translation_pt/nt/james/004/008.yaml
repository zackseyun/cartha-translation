  terminology: “Limpem” e “purifiquem” preservam a distinção lexical entre καθαρίσατε e ἁγνίσατε. A nota deve apresentar a imagem etimológica como expressão, não como uma oração acrescentada; “de duas almas” é a formulação mais literalmente correspondente, acompanhada de esclarecimento semântico.
