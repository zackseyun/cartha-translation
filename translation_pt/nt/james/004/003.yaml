id: JAS.4.3
reference: James 4:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: αἰτεῖτε καὶ οὐ λαμβάνετε, διότι κακῶς αἰτεῖσθε, ἵνα ἐν ταῖς ἡδοναῖς ὑμῶν δαπανήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/003.yaml
  text: You ask and do not receive[a], because you ask wrongly[b], so that you may spend it on your pleasures.
translation:
  language: pt
  text: Vocês pedem e não recebem, porque pedem de modo errado, para gastar em seus prazeres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para gastar com seus prazeres”. A palavra traduzida por “prazeres” também pode indicar desejos ou paixões voltados à autossatisfação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτεῖτε
  choice: vocês pedem
  rationale: O presente ativo na segunda pessoa do plural é expresso naturalmente por “vocês pedem”; o objeto permanece implícito, como no grego.
- source_word: οὐ λαμβάνετε
  choice: não recebem
  rationale: “Receber” conserva a relação direta entre pedir e receber e corresponde ao registro digno do contexto.
- source_word: διότι κακῶς αἰτεῖσθε
  choice: porque pedem de modo errado
  rationale: “De modo errado” preserva o sentido amplo de κακῶς sem reduzi-lo apenas a motivos, embora a oração seguinte esclareça a finalidade indevida.
- source_word: ἵνα
  choice: para
  rationale: Neste contexto, ἵνα introduz a finalidade do pedido; “para” é natural em português e mantém a força final.
- source_word: ἐν ταῖς ἡδοναῖς ὑμῶν
  choice: com os seus próprios prazeres
  rationale: ἡδονή designa prazeres ou desejos voltados à satisfação pessoal. Com δαπανάω, “gastar com” é português natural; “próprios” torna claro o valor possessivo de ὑμῶν sem explicitar uma doutrina adicional.
- source_word: δαπανήσητε
  choice: gastar
  rationale: O verbo significa gastar ou despender. “Gastar” é neutro e evita intensificar indevidamente o sentido com “desperdiçar” ou “esbanjar”.
theological_decisions:
- issue: Explicitar que os pedidos são dirigidos a Deus em oração
  choice: 'Manter o destinatário implícito: “Vocês pedem e não recebem”'
  alternative: “Vocês pedem a Deus e não recebem”
  rationale: O contexto sugere oração, mas o versículo grego não nomeia Deus como objeto; mantê-lo implícito evita acrescentar ao texto.
- issue: Restringir κακῶς a motivos errados
  choice: Traduzir de forma ampla como “de modo errado”
  alternative: “com motivos errados”
  rationale: κακῶς pode indicar pedir mal ou de maneira errada em sentido mais amplo; a finalidade egoísta é apresentada explicitamente na oração seguinte.
- issue: Valor de ἵνα na oração final
  choice: Preservar a finalidade com “para gastar”
  alternative: 'Entender principalmente como resultado: “de modo que gastem”'
  rationale: A construção expressa naturalmente a finalidade pretendida pelos que pedem, sem excluir a proximidade contextual entre propósito e resultado.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural “vocês” evita regionalismo excessivo; a repetição de “pedem” conserva o paralelismo do grego.
