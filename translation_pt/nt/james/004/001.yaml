reference: James 4:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πόθεν πόλεμοι καὶ ⸀πόθεν μάχαι ἐν ὑμῖν; οὐκ ἐντεῦθεν, ἐκ τῶν ἡδονῶν ὑμῶν τῶν στρατευομένων ἐν τοῖς μέλεσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/001.yaml
  text: From where come wars and from where come fights among you? Is it not from here—from your pleasures that wage war in your members?[a][b][c]
translation:
  language: pt
  text: De onde vêm as guerras e de onde vêm as brigas[a] entre vocês[b]? Não vêm elas daí — dos prazeres de vocês, que guerreiam em seus membros[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conflitos... disputas”. O grego emprega termos militares, literalmente “guerras” e “combates”, para as desavenças dentro da comunidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “dentro de vocês”. O grego pode indicar tanto conflitos entre os leitores como conflitos no interior deles. O versículo relaciona a discórdia exterior aos desejos interiores.
    reason: alternative_reading
  - marker: c
    text: “Membros” é literal; pode referir-se às partes do corpo ou, de modo mais amplo, às faculdades dentro da pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν
  choice: De onde vêm
  rationale: Preserva a pergunta pela origem e a repetição enfática do advérbio grego, em português natural.
- source_word: πόλεμοι
  choice: guerras
  rationale: Mantém o sentido literal e a forte imagem militar usada metaforicamente para conflitos graves na comunidade.
- source_word: μάχαι
  choice: brigas
  rationale: Distingue o termo de πόλεμοι e comunica de modo corrente os confrontos entre pessoas, sem apagar a imagem de conflito.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: Expressa o sentido comunitário mais provável no contexto imediato, sem excluir a alternativa interior, registrada em nota.
- source_word: οὐκ ἐντεῦθεν
  choice: Não vêm justamente disto
  rationale: Reproduz a pergunta retórica que espera resposta afirmativa e aponta para a fonte mencionada em seguida.
- source_word: ἡδονῶν
  choice: prazeres
  rationale: É o equivalente lexical direto e conserva a possível conotação de prazeres voltados à autossatisfação sem substituí-la por uma interpretação como 'paixões' ou 'desejos'.
- source_word: στρατευομένων
  choice: que guerreiam
  rationale: Preserva a ação contínua e a imagem militar, retomando o campo semântico de 'guerras'.
- source_word: ἐν τοῖς μέλεσιν ὑμῶν
  choice: nos membros do corpo de vocês
  rationale: Conserva a metáfora corporal de μέλη, acrescentando 'do corpo' para tornar o sentido de 'membros' imediatamente compreensível no português atual, sem decidir quais faculdades estão em vista.
theological_decisions:
- issue: Se os conflitos iniciais são apenas paixões interiores ou disputas comunitárias
  choice: Traduzir o primeiro ἐν ὑμῖν como 'entre vocês' e a frase final como 'nos membros do corpo de vocês'.
  alternative: Traduzir o primeiro como 'dentro de vocês' e/ou a frase final de modo amplo como 'dentro de vocês'.
  rationale: Assim se mantém a ligação retórica entre a discórdia exterior na comunidade e os prazeres que combatem no interior da pessoa, sem reduzir o versículo a uma dimensão exclusivamente social ou psicológica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A repetição retórica de 'De onde vêm' e as imagens militares foram preservadas; 'vocês' oferece referência plural clara e natural.
