  text: ἢ δοκεῖτε ὅτι κενῶς ἡ γραφὴ λέγει· Πρὸς φθόνον ἐπιποθεῖ τὸ πνεῦμα ὃ ⸀κατῴκισεν ἐν ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/005.yaml
  text: Or do you think that the Scripture speaks in vain? The Spirit whom he caused to dwell in us yearns jealously[a].
translation:
  language: pt
  text: Ou vocês pensam que a Escritura fala em vão? O Espírito que ele fez habitar em nós anseia com ciúme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o espírito que ele fez habitar em nós anseia com inveja”. O grego pode referir-se tanto ao Espírito Santo quanto ao espírito humano; a expressão traduzida por “com ciúme” também pode significar “com inveja”. O objeto de “anseia” não está expresso no grego.'
    reason: alternative_reading
lexical_decisions:
- source_word: κενῶς
  choice: em vão
  rationale: Modifica «fala» e expressa a ideia de falar sem efeito, sem propósito ou inutilmente; «em vão» é natural e digno em português.
- source_word: ἡ γραφὴ
  choice: a Escritura
  rationale: O singular com artigo designa a Escritura como revelação escrita dotada de autoridade.
- source_word: Πρὸς φθόνον
  choice: com zelo
  rationale: A expressão é difícil e pode indicar ciúme zeloso ou inveja. No texto principal, «com zelo» permite uma leitura positiva coerente com o Espírito Santo, sem ocultar na nota a possibilidade negativa.
- source_word: ἐπιποθεῖ
  choice: anseia por nós
  rationale: O verbo denota desejo intenso. «Anseia» preserva essa força; «por nós» torna explícito em português o objeto implícito no contexto, embora a sintaxe grega permaneça difícil.
- source_word: τὸ πνεῦμα
  choice: O Espírito
  rationale: A inicial maiúscula adota no texto principal a leitura de que se trata do Espírito Santo, mas a referência ao espírito humano é gramaticalmente possível e é registrada em nota.
- source_word: κατῴκισεν
  choice: fez habitar
  rationale: Preserva a força causativa do verbo e o aspecto pontual do aoristo, deixando implícito, como no grego, que Deus é o agente.
- source_word: ἐν ἡμῖν
  choice: em nós
  rationale: Expressa naturalmente a habitação interior; «entre nós» seria possível, mas é menos provável nesta leitura.
theological_decisions:
- issue: Referente de τὸ πνεῦμα
  choice: O Espírito Santo que Deus fez habitar em nós
  alternative: o espírito humano que Deus fez habitar em nós
  rationale: A gramática admite ambas as leituras. O texto principal adota a referência ao Espírito Santo por sua consonância com a linguagem neotestamentária de habitação divina, enquanto a nota preserva a alternativa real.
- issue: Valor moral de Πρὸς φθόνον
  choice: com zelo
  alternative: com inveja
  rationale: Se o sujeito é o Espírito Santo, «com zelo» comunica uma reivindicação zelosa e legítima, sem atribuir vício moral a Deus. Como φθόνος frequentemente significa inveja, essa possibilidade é mantida na nota.
- issue: Objeto de ἐπιποθεῖ
  choice: por nós
  alternative: 'sem objeto expresso: «anseia com zelo»'
  rationale: O grego não apresenta objeto explícito. «Por nós» produz uma frase portuguesa mais clara e corresponde à leitura do zelo divino por seu povo, mas a nota assinala a construção alternativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. O plural «vocês» representa o destinatário plural sem regionalismo excessivo. A nota conserva as ambiguidades lexical, sintática e teológica do difícil texto grego.
