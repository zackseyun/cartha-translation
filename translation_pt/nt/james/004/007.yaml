  text: ὑποτάγητε οὖν τῷ θεῷ· ἀντίστητε δὲ τῷ διαβόλῳ, καὶ φεύξεται ἀφ’ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/007.yaml
  text: Submit yourselves[a], therefore, to God. But resist the devil, and he will flee from you.
translation:
  language: pt
  text: Portanto, sujeitem-se[a] a Deus. Mas resistam ao diabo, e ele fugirá de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estejam sujeitos a Deus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτάγητε
  choice: sujeitem-se
  rationale: O imperativo aoristo passivo tem força reflexiva nesta exortação. “Sujeitem-se” expressa de modo natural a ação voluntária de se colocar sob a autoridade de Deus.
- source_word: οὖν
  choice: portanto
  rationale: Marca a conclusão ou inferência decorrente do argumento anterior e preserva claramente a ligação lógica.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: O dativo funciona como complemento de ὑποτάγητε; “a Deus” é a construção portuguesa direta e natural.
- source_word: ἀντίστητε
  choice: resistam
  rationale: O imperativo aoristo ativo significa opor-se ou manter-se firme contra alguém; “resistam” é conciso e adequado à exortação moral.
- source_word: δὲ
  choice: mas
  rationale: Marca contraste entre a sujeição a Deus e a oposição ao diabo.
- source_word: τῷ διαβόλῳ
  choice: ao diabo
  rationale: Aqui διάβολος, com artigo, funciona como designação pessoal do adversário; “o diabo” é a tradução estabelecida e contextualmente adequada.
- source_word: καὶ
  choice: e
  rationale: Liga a ordem à consequência prometida sem explicitar uma relação mais forte do que a forma grega exige.
- source_word: φεύξεται
  choice: ele fugirá
  rationale: O futuro de φεύγω apresenta o resultado da resistência. O pronome explicita em português que o sujeito continua sendo o diabo.
- source_word: ἀφ’ ὑμῶν
  choice: de vocês
  rationale: ἀπό com o genitivo indica afastamento. “Fugirá de vocês” é claro, natural e amplamente compreensível.
theological_decisions:
- issue: Sentido de διάβολος
  choice: “o diabo” como adversário pessoal
  alternative: “o caluniador”, entendido de modo mais genérico ou impessoal
  rationale: O substantivo é articular e aparece em uma exortação de conflito espiritual. A formulação preserva a leitura pessoal indicada pelo contexto e pelo uso lexical, sem acrescentar qualificações ausentes do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais (“sujeitem-se”, “resistam”, “vocês”). A pontuação mantém as duas exortações e a consequência prometida. A nota preserva a alternativa mais formal para o valor passivo de ὑποτάγητε.
