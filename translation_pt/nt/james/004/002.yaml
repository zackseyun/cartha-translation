  text: ἐπιθυμεῖτε, καὶ οὐκ ἔχετε· φονεύετε καὶ ζηλοῦτε, καὶ οὐ δύνασθε ἐπιτυχεῖν· μάχεσθε καὶ πολεμεῖτε. οὐκ ἔχετε διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/002.yaml
  text: You desire and do not have[a]; you murder and envy and are not able to obtain; you fight and wage war[d][c][b]. You do not have because you do not ask.
translation:
  language: pt
  text: Vocês desejam[a] e não têm; assassinam[b] e sentem inveja[c], e não conseguem obter; brigam e fazem guerra. Vocês não têm porque não pedem[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cobiçam”. O grego indica um desejo forte, frequentemente impróprio neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “matam”. O verbo grego costuma ter o sentido mais específico de “assassinar”. Alguns entendem a expressão de modo retórico, mas a tradução preserva a força lexical do termo.
    reason: lexical_alternative
  - marker: c
    text: Ou “sentem ciúme”.
    reason: lexical_alternative
  - marker: d
    text: Pelo contexto, aquele a quem devem pedir é Deus, embora o grego não o declare explicitamente neste versículo.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμεῖτε
  choice: vocês desejam
  rationale: O verbo indica desejo forte e, neste contexto, moralmente desordenado. “Desejam” preserva a amplitude lexical sem restringir o sentido ao desejo sexual nem antecipar uma interpretação específica como “cobiçam”.
- source_word: οὐκ ἔχετε
  choice: não têm
  rationale: Tradução direta e idiomática de ἔχω na construção negativa.
- source_word: φονεύετε
  choice: assassinam
  rationale: φονεύω normalmente designa matar de modo criminoso, isto é, assassinar, e não apenas matar em sentido genérico. A escolha conserva a força moral e retórica do original.
- source_word: ζηλοῦτε
  choice: sentem inveja
  rationale: ζηλόω pode indicar zelo, ciúme ou inveja. O contexto hostil e o paralelo com o desejo frustrado favorecem o sentido negativo de invejar.
- source_word: οὐ δύνασθε ἐπιτυχεῖν
  choice: não conseguem obter
  rationale: A expressão comunica a incapacidade de alcançar ou obter aquilo que se deseja; esta formulação é clara e natural em português.
- source_word: μάχεσθε
  choice: brigam
  rationale: μάχομαι pode designar luta ou contenda. “Brigam” expressa conflito interpessoal com naturalidade e mantém a distinção em relação ao verbo mais forte que vem em seguida.
- source_word: πολεμεῖτε
  choice: fazem guerra
  rationale: πολεμέω evoca guerra ou campanha hostil. “Fazem guerra” preserva a intensificação em relação a “brigam” e soa natural em português contemporâneo.
- source_word: διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς
  choice: porque não pedem
  rationale: A construção com διά e infinitivo articular tem valor causal. O objeto do pedido permanece implícito, como no grego.
theological_decisions:
- issue: Se φονεύετε deve ser suavizado por ser possivelmente retórico ou metafórico
  choice: Manter “assassinam” no texto principal
  alternative: “matam” ou uma explicitação interpretativa como “cometem assassinato no coração”
  rationale: O verbo grego é forte. Uma leitura metafórica, hiperbólica ou alusiva pertence à interpretação; a tradução conserva a formulação direta e incisiva de Tiago.
- issue: Se o objeto implícito de αἰτεῖσθαι deve ser explicitado
  choice: Manter “não pedem”, sem objeto expresso
  alternative: “não pedem a Deus”
  rationale: O contexto indica que Deus é aquele a quem se pede, mas o texto grego deste versículo não o nomeia. A tradução preserva essa implicitude.
- issue: Se ζηλοῦτε deve ser entendido como zelo, ciúme ou inveja
  choice: Traduzir por “sentem inveja”
  alternative: “sentem ciúme” ou “desejam ardentemente”
  rationale: O desejo frustrado e a sequência de hostilidade favorecem o valor negativo de inveja, sem eliminar em nota a alternativa próxima ligada ao ciúme.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para a segunda pessoa do plural e formas verbais de ampla legibilidade no Brasil e compreensão internacional. A pontuação acompanha a progressão das cláusulas gregas, e o par “brigam e fazem guerra” preserva a intensificação sem soar artificial.
