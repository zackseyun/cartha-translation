  text: οἵτινες οὐκ ἐπίστασθε ⸀τὸ τῆς αὔριον ⸀ποία ἡ ζωὴ ὑμῶν· ἀτμὶς γάρ ⸀ἐστε ⸀ἡ πρὸς ὀλίγον φαινομένη, ⸀ἔπειτα καὶ ἀφανιζομένη·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/014.yaml
  text: You do not know what tomorrow will bring[a]. What is your life? For you are a mist that appears for a little while and then vanishes.
translation:
  language: pt
  text: Vocês não sabem o que acontecerá amanhã. O que é a vida de vocês? Vocês são uma névoa[a] que aparece por pouco tempo e depois desaparece.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vapor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστασθε
  choice: sabem
  rationale: O verbo indica saber ou compreender; no contexto da incerteza humana quanto ao futuro, “sabem” é a opção mais direta e natural.
- source_word: τὸ τῆς αὔριον
  choice: o que acontecerá amanhã
  rationale: A expressão grega é elíptica e aponta para aquilo que pertence ao dia seguinte; a formulação explicita naturalmente a ideia em português sem definir quais serão os acontecimentos.
- source_word: ποία ἡ ζωὴ ὑμῶν
  choice: O que é a vida de vocês?
  rationale: Mantém a pergunta retórica breve sobre a natureza da vida humana e preserva sua força, sem transformá-la numa afirmação interpretativa.
- source_word: ἀτμὶς
  choice: névoa
  rationale: “Névoa” comunica de modo vívido algo tênue, transitório e de curta duração; “vapor” permanece uma alternativa lexical legítima, registrada em nota.
- source_word: πρὸς ὀλίγον
  choice: por pouco tempo
  rationale: Expressa com clareza e naturalidade a breve duração indicada pela frase grega.
- source_word: φαινομένη
  choice: aparece
  rationale: Reproduz a ideia de tornar-se visível e funciona naturalmente com a imagem da névoa.
- source_word: ἔπειτα καὶ ἀφανιζομένη
  choice: e depois desaparece
  rationale: Preserva a sequência temporal e o contraste entre a aparição breve e o subsequente desaparecimento.
theological_decisions:
- issue: Descrição metafórica da transitoriedade da vida humana
  choice: Manter a imagem da névoa como declaração retórica sobre a brevidade e a incerteza da vida.
  alternative: Explicitar a metáfora como “a vida de vocês é passageira”.
  rationale: A imagem concreta preserva a força literária e a tensão teológica do texto no contexto da presunção quanto aos planos futuros, sem acrescentar afirmações doutrinárias sobre morte ou juízo.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para ampla legibilidade brasileira. A construção é concisa e mantém as duas perguntas/afirmações retóricas do grego, bem como a metáfora sem explicá-la em excesso.
