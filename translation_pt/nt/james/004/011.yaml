id: JAS.4.11
reference: James 4:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μὴ καταλαλεῖτε ἀλλήλων, ἀδελφοί· ὁ καταλαλῶν ἀδελφοῦ ⸀ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ καταλαλεῖ νόμου καὶ κρίνει νόμον· εἰ δὲ νόμον κρίνεις, οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/011.yaml
  text: Do not speak against one another[a], brothers. The one who speaks against a brother or judges his brother speaks against the law and judges the law. But if you judge the law[b], you are not a doer of the law but a judge.
translation:
  language: pt
  text: Não falem mal uns dos outros[a], irmãos[b]. Quem fala mal de um irmão ou julga seu irmão fala mal da lei e julga a lei. Mas, se você julga a lei, não é cumpridor da lei, mas juiz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não difamem uns aos outros”; o verbo grego pode indicar falar contra alguém de maneira hostil ou difamatória.
    reason: lexical_alternative
  - marker: b
    text: “Irmãos” é a forma masculina plural no grego e, neste contexto, provavelmente inclui toda a comunidade, isto é, irmãos e irmãs.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαλεῖτε / καταλαλῶν / καταλαλεῖ
  choice: falar mal de
  rationale: Expressa fala hostil ou difamatória contra alguém, soa natural em português e preserva a repetição verbal ao longo do versículo sem restringir o sentido à calúnia formal.
- source_word: ἀλλήλων
  choice: uns dos outros
  rationale: Equivalente recíproco corrente e natural no contexto da exortação.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva a forma masculina plural e a metáfora familiar do grego; uma nota esclarece que a comunidade inteira provavelmente está incluída.
- source_word: ἀδελφοῦ / τὸν ἀδελφὸν αὐτοῦ
  choice: um irmão / seu irmão
  rationale: Mantém a consistência lexical e a linguagem familiar característica de Tiago, sem substituir o termo por uma explicação interpretativa como 'outro cristão'.
- source_word: ἢ
  choice: ou
  rationale: Mantém a relação disjuntiva entre falar mal do irmão e julgá-lo, de acordo com o texto grego fornecido.
- source_word: κρίνων / κρίνει / κρίνεις
  choice: julga / julgar
  rationale: Preserva a repetição lexical e a amplitude do verbo; 'condenar' estreitaria indevidamente o sentido.
- source_word: νόμου / νόμον
  choice: a lei
  rationale: O artigo definido é natural em português e indica a instrução divina em vista, sem especificá-la além do que o versículo permite.
- source_word: ποιητὴς
  choice: cumpridor
  rationale: Em português bíblico corrente, 'cumpridor da lei' comunica de modo natural aquele que põe a lei em prática e mantém o contraste com 'juiz'.
- source_word: κριτής
  choice: juiz
  rationale: Tradução direta do substantivo, preservando o contraste incisivo com 'cumpridor da lei'.
theological_decisions:
- issue: Alcance de ἀδελφοί na exortação à comunidade
  choice: Traduzir por 'irmãos' no texto principal e explicar em nota o provável sentido inclusivo.
  alternative: irmãos e irmãs
  rationale: A forma grega é masculina plural, mas provavelmente se dirige a toda a comunidade. A solução conserva a forma do texto e torna explícito seu provável alcance sem alterá-la silenciosamente.
- issue: Referente de 'a lei'
  choice: Manter apenas 'a lei', sem especificação adicional.
  alternative: a lei de Moisés; a lei régia; a lei de Deus
  rationale: O contexto de Tiago sugere a instrução divina, possivelmente em especial o mandamento do amor ao próximo, mas este versículo não delimita expressamente o referente.
- issue: Natureza do julgamento condenado
  choice: Manter o verbo amplo 'julgar'.
  alternative: condenar; emitir juízo contra
  rationale: O grego não exige que se restrinja a ação à condenação formal. A formulação preserva a tensão entre julgar o irmão e colocar-se como juiz da lei.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A repetição de 'falar mal', 'julgar' e 'lei' foi mantida para reproduzir a estrutura argumentativa do grego. 'Você' representa o singular retórico da segunda metade do versículo.
