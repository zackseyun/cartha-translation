  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἷς ⸀ἐστιν νομοθέτης ⸂καὶ κριτής⸃, ὁ δυνάμενος σῶσαι καὶ ἀπολέσαι· σὺ δὲ τίς εἶ, ⸂ὁ κρίνων⸃ τὸν ⸀πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/012.yaml
  text: There is one Lawgiver and Judge, the one who is able to save and to destroy. But who are you, judging your neighbor?
translation:
  language: pt
  text: Há um só Legislador e Juiz, aquele que pode salvar e destruir. Mas quem é você, que julga o próximo?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νομοθέτης
  choice: Legislador
  rationale: Equivalente direto e natural para quem estabelece a lei; preserva a força singular do termo grego.
- source_word: κριτής
  choice: Juiz
  rationale: Mantém a função judicial expressa no grego e sua coordenação com “Legislador”.
- source_word: ἀπολέσαι
  choice: destruir
  rationale: Reproduz o contraste forte com “salvar” sem suavizar o alcance do verbo.
- source_word: ὁ κρίνων
  choice: que julga
  rationale: Traduz o particípio substantivado de modo natural e mantém o foco na pessoa que está praticando o julgamento.
- source_word: πλησίον
  choice: o próximo
  rationale: Expressão bíblica corrente e abrangente para a pessoa com quem se mantém relação de proximidade.
theological_decisions:
- issue: Identidade do único Legislador e Juiz
  choice: Manter implícita, como no texto grego
  alternative: Explicitar “Deus”
  rationale: O referente é reconhecível pelo contexto, mas o versículo não o nomeia; explicitá-lo seria interpretação incorporada ao texto.
- issue: Força de ἀπολέσαι
  choice: “destruir”
  alternative: “condenar” ou “fazer perecer”
  rationale: “Destruir” preserva a amplitude e a tensão teológica do verbo, sem restringi-lo ao ato judicial de condenar.
- issue: Construção final com particípio
  choice: “quem é você, que julga o próximo?”
  alternative: “quem é você para julgar o próximo?”
  rationale: A oração relativa representa mais de perto ὁ κρίνων e ressalta a ação efetiva de julgar, sem convertê-la apenas em questão de autorização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A capitalização de “Legislador” e “Juiz” sinaliza títulos no contexto sem acrescentar o nome do referente.
