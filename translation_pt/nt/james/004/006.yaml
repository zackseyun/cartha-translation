id: JAS.4.6
reference: James 4:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μείζονα δὲ δίδωσιν χάριν· διὸ λέγει· Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/006.yaml
  text: But he gives greater grace. Therefore it says[a], “God opposes the proud, but gives grace to the humble.”
translation:
  language: pt
  text: 'Mas ele concede maior graça. Por isso, diz[a]: “Deus se opõe aos orgulhosos, mas concede graça aos humildes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por isso, ele diz” ou “Por isso, a Escritura diz”. No grego, o sujeito de “diz” está implícito.'
    reason: alternative_reading
lexical_decisions:
- source_word: μείζονα
  choice: maior
  rationale: Preserva a força comparativa do adjetivo e forma, com “graça”, uma expressão natural em português.
- source_word: δίδωσιν χάριν
  choice: concede graça
  rationale: “Concede” comunica com naturalidade a ação de dar uma dádiva e permite repetir a mesma expressão nas duas ocorrências para preservar o efeito retórico.
- source_word: διὸ
  choice: Por isso
  rationale: Expressa de modo claro e corrente a inferência que parte da afirmação anterior.
- source_word: λέγει
  choice: está escrito
  rationale: Sinaliza naturalmente uma citação bíblica sem identificar de modo rígido o sujeito implícito do verbo grego; a nota registra as alternativas mais literais.
- source_word: ὑπερηφάνοις
  choice: aos orgulhosos
  rationale: Traduz o adjetivo substantivado e mantém o contraste ético com “os humildes”; “arrogantes” seria possível, mas um pouco mais estreito.
- source_word: ἀντιτάσσεται
  choice: se opõe
  rationale: Comunica claramente a oposição ativa de Deus em português contemporâneo.
- source_word: ταπεινοῖς
  choice: aos humildes
  rationale: Traduz o adjetivo substantivado em seu sentido ético contextual, sem enfatizar indevidamente condição social.
- source_word: δὲ
  choice: Mas
  rationale: Preserva a força contrastiva tanto na abertura do versículo quanto no interior da citação.
theological_decisions:
- issue: Sujeito da fórmula de citação λέγει
  choice: Por isso, está escrito
  alternative: Por isso, ele diz; Por isso, a Escritura diz
  rationale: O grego deixa implícito o sujeito de “diz”. A formulação escolhida identifica a frase como citação bíblica sem decidir se o sujeito gramatical pretendido é Deus ou a Escritura; a ambiguidade é explicitada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “concede graça” reproduz deliberadamente a repetição grega. A citação segue a forma de Provérbios 3:34 refletida pela tradição grega.
