id: JAS.4.13
reference: James 4:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἄγε νῦν οἱ λέγοντες· Σήμερον ⸀ἢ αὔριον ⸀πορευσόμεθα εἰς τήνδε τὴν πόλιν καὶ ⸀ποιήσομεν ἐκεῖ ⸀ἐνιαυτὸν καὶ ⸀ἐμπορευσόμεθα καὶ ⸀κερδήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/013.yaml
  text: Come now[a], you who say, “Today or tomorrow we will go into this city and spend a year there and do business and make a profit.”
translation:
  language: pt
  text: 'Agora, escutem, vocês que dizem: “Hoje ou amanhã iremos para esta cidade[a], passaremos um ano ali, faremos negócios e teremos lucro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “para tal cidade”. O grego diz “esta cidade”, usando um demonstrativo para uma cidade específica no plano dos falantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: Agora, escutem
  rationale: A expressão funciona como uma chamada enfática à atenção que introduz uma repreensão. Esta formulação é natural em português atual e preserva sua força direta.
- source_word: οἱ λέγοντες
  choice: vocês que dizem
  rationale: O particípio substantivado funciona como vocativo e se dirige diretamente aos interlocutores.
- source_word: Σήμερον ἢ αὔριον
  choice: Hoje ou amanhã
  rationale: ἤ é disjuntivo e expressa uma de duas possibilidades próximas no planejamento apresentado.
- source_word: πορευσόμεθα
  choice: iremos
  rationale: O futuro de πορεύομαι indica deslocamento de modo simples; “iremos” é natural e preciso no contexto.
- source_word: εἰς τήνδε τὴν πόλιν
  choice: para esta cidade
  rationale: O demonstrativo τήνδε aponta para uma cidade específica no plano dos falantes; “para” expressa naturalmente o destino em português.
- source_word: ποιήσομεν ἐκεῖ ἐνιαυτόν
  choice: passaremos um ano ali
  rationale: ποιέω com acusativo de duração é idiomático e significa passar determinado período de tempo.
- source_word: ἐμπορευσόμεθα
  choice: faremos negócios
  rationale: O verbo denota atividade comercial; a expressão é clara, moderna e suficientemente ampla.
- source_word: κερδήσομεν
  choice: teremos lucro
  rationale: No contexto comercial, κερδαίνω se refere ao ganho financeiro. “Teremos lucro” mantém a intenção confiante do futuro verbal.
theological_decisions:
- issue: Tom da repreensão apostrófica
  choice: 'Discurso direto: “vocês que dizem”'
  alternative: 'Descrição impessoal: “os que dizem”'
  rationale: Tiago confronta diretamente os que fazem planos presunçosos. A forma escolhida preserva a força retórica sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A sequência de futuros preserva o tom seguro e presunçoso dos planos citados.
