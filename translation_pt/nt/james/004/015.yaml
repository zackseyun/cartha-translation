id: JAS.4.15
reference: James 4:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀντὶ τοῦ λέγειν ὑμᾶς· Ἐὰν ὁ κύριος ⸀θελήσῃ, καὶ ⸀ζήσομεν καὶ ⸀ποιήσομεν τοῦτο ἢ ἐκεῖνο.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/015.yaml
  text: Instead, you ought to say, “If the Lord wills, we will live and also do this or that.”
translation:
  language: pt
  text: 'Em vez disso, vocês deveriam dizer[a]: “Se o Senhor quiser, viveremos e faremos isto ou aquilo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “em vez de vocês dizerem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τοῦ λέγειν ὑμᾶς
  choice: Em vez disso, vocês deveriam dizer
  rationale: A construção significa literalmente “em vez de vocês dizerem”. A formulação escolhida expressa em português natural a força corretiva implícita no contraste com o versículo anterior.
- source_word: Ἐὰν
  choice: Se
  rationale: Introduz uma condição com o subjuntivo aoristo θελήσῃ; “se” é o equivalente natural em português.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Preserva a designação grega sem especificar além do texto quem é o referente.
- source_word: θελήσῃ
  choice: quiser
  rationale: Expressa a vontade do Senhor de modo natural e digno em português; “se o Senhor quiser” é uma formulação corrente sem perder o sentido de volição divina.
- source_word: καὶ ζήσομεν
  choice: viveremos
  rationale: O futuro indica que até a continuidade da vida depende da vontade do Senhor.
- source_word: καὶ ποιήσομεν
  choice: e faremos
  rationale: “Faremos” traduz diretamente ποιήσομεν. O segundo καί é representado por “e”; acrescentar “também” seria possível, mas criaria uma ênfase desnecessária em português.
- source_word: τοῦτο ἢ ἐκεῖνο
  choice: isto ou aquilo
  rationale: Par idiomático que mantém a referência indefinida a diferentes atividades planejadas.
theological_decisions:
- issue: Referente e força de ὁ κύριος na condição
  choice: o Senhor
  alternative: Deus; o Senhor Jesus
  rationale: O grego diz apenas ὁ κύριος. A tradução conserva a ambiguidade referencial e a ênfase na dependência da vontade divina, sem decidir se Tiago tem especificamente o Pai ou Jesus em vista.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” torna explícito o sujeito plural de ὑμᾶς; “se o Senhor quiser” é idiomático e fiel ao sentido. O marcador da nota foi colocado ao fim do versículo por comentar a construção introdutória inteira.
