id: JAS.4.10
reference: James 4:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ταπεινώθητε ἐνώπιον ⸀κυρίου, καὶ ὑψώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/010.yaml
  text: Humble yourselves before the Lord[b][a], and he will exalt you.
translation:
  language: pt
  text: Humilhem-se diante do Senhor[a], e ele os exaltará[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na presença do Senhor”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os elevará”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώθητε
  choice: Humilhem-se
  rationale: O imperativo aoristo passivo pode ter força reflexiva neste contexto exortativo. A forma portuguesa é natural, preserva o chamado à humilhação voluntária e explicita o destinatário plural.
- source_word: ἐνώπιον
  choice: diante de
  rationale: Expressa de modo conciso e natural tanto a ideia relacional quanto a de estar na presença de alguém.
- source_word: κυρίου
  choice: do Senhor
  rationale: Mantém o título definido e não especifica além do grego se a referência é a Deus ou a Jesus.
- source_word: ὑψώσει
  choice: exaltará
  rationale: Preserva o sentido metafórico de elevar ou honrar, em contraste direto com humilhar-se.
- source_word: ὑμᾶς
  choice: os
  rationale: Pronome objeto masculino genérico que retoma naturalmente o grupo plural tratado pelo imperativo; o plural também está explícito em “Humilhem-se”.
theological_decisions:
- issue: Referente de “Senhor”
  choice: Senhor, sem especificar o referente
  alternative: Deus; o Senhor Jesus
  rationale: A expressão grega não exige decidir entre Deus e Jesus. Manter “Senhor” conserva a ambiguidade genuína do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A colocação pronominal e o futuro simples conservam a concisão e a relação promessa-resposta do original.
