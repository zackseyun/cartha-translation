id: JAS.4.9
reference: James 4:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ταλαιπωρήσατε καὶ πενθήσατε καὶ κλαύσατε· ὁ γέλως ὑμῶν εἰς πένθος ⸀μετατραπήτω καὶ ἡ χαρὰ εἰς κατήφειαν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/009.yaml
  text: Be miserable and mourn and weep[b][a]. Let your laughter be turned into mourning and your joy into gloom.
translation:
  language: pt
  text: Aflijam-se[a], lamentem e chorem. Que o riso de vocês se transforme em luto, e a alegria, em abatimento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Sintam-se miseráveis”. O verbo grego pode indicar estar em aflição ou miséria.
    reason: lexical_alternative
  - marker: b
    text: Ou “em tristeza sombria”. O termo grego descreve um estado cabisbaixo e entristecido.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαιπωρήσατε
  choice: Aflijam-se
  rationale: O imperativo expressa a entrada consciente numa condição de aflição ou miséria. “Aflijam-se” conserva a força da ordem e evita confundi-la com os verbos seguintes, que tratam especificamente de lamentar e chorar.
- source_word: πενθήσατε
  choice: lamentem
  rationale: Expressa pesar profundo, especialmente apropriado ao contexto de arrependimento, e mantém distinção natural em relação a “chorem”.
- source_word: κλαύσατε
  choice: chorem
  rationale: Equivalente direto e corrente para o ato concreto de derramar lágrimas, preservando a progressão dos três imperativos.
- source_word: ὁ γέλως ὑμῶν
  choice: o riso de vocês
  rationale: Formulação natural e amplamente compreensível em português, preservando o substantivo concreto e o possessivo plural.
- source_word: εἰς πένθος
  choice: em luto
  rationale: “Luto” comunica pesar profundo e mantém o campo semântico de πενθέω/πένθος, sem reduzir a expressão a mera tristeza.
- source_word: μετατραπήτω
  choice: se transforme
  rationale: O imperativo passivo descreve uma mudança de estado. A construção com “que ... se transforme” é natural em português e conserva a força exortativa.
- source_word: ἡ χαρὰ
  choice: a alegria
  rationale: Mantém o substantivo concreto do grego. O paralelismo permite entender que se trata da alegria dos destinatários sem repetir obrigatoriamente o possessivo.
- source_word: εἰς κατήφειαν
  choice: em abatimento
  rationale: O termo indica uma condição sombria e cabisbaixa. “Abatimento” é atual, digno e mais preciso que uma referência genérica à tristeza.
theological_decisions:
- issue: Linguagem de arrependimento e intensidade emocional
  choice: Manter os imperativos como uma convocação severa à aflição, ao lamento e ao choro.
  alternative: Suavizar a passagem como simples chamado à seriedade ou sobriedade.
  rationale: No contexto de Tiago 4:6–10, a sequência integra um apelo à humilhação diante de Deus. A tradução conserva essa intensidade sem acrescentar uma formulação doutrinária que não esteja explícita no versículo.
translation_notes:
  register: Português moderno, solene e acessível, com “vocês” para leitura natural no Brasil e ampla inteligibilidade internacional. A tríade verbal e o paralelismo da segunda frase foram preservados.
