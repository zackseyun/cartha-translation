  text: εἰδότι οὖν καλὸν ποιεῖν καὶ μὴ ποιοῦντι, ἁμαρτία αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/017.yaml
  text: So[a], for the one who knows to do good and does not do it, it is sin for him.
translation:
  language: pt
  text: Portanto, para quem sabe fazer o bem e não o faz, isso é pecado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδότι
  choice: quem sabe
  rationale: O particípio dativo singular é substantivado e tem sentido genérico. «Quem sabe» preserva a referência pessoal sem tornar pesada a construção em português.
- source_word: οὖν
  choice: Portanto
  rationale: Expressa de modo claro a conclusão inferida da discussão anterior e mantém a ligação lógica com o contexto.
- source_word: καλὸν ποιεῖν
  choice: fazer o bem
  rationale: A expressão indica praticar aquilo que é moralmente bom ou correto. «Fazer o bem» é direta, ampla e idiomática.
- source_word: καὶ μὴ ποιοῦντι
  choice: e não o faz
  rationale: Mantém o contraste entre conhecer o bem e deixar de praticá-lo. O pronome «o» retoma naturalmente «o bem».
- source_word: ἁμαρτία αὐτῷ ἐστιν
  choice: comete pecado
  rationale: Comunica em português corrente que a omissão é pecado para a pessoa que age assim. A nota preserva uma representação mais formal da construção grega e do dativo de referência.
theological_decisions:
- issue: Natureza da afirmação sobre o bem omitido
  choice: A falha consciente em fazer o bem é pecado, formulada como princípio geral e ligada ao contexto anterior por «Portanto».
  alternative: Restringir a afirmação exclusivamente ao planejamento presunçoso do contexto imediato.
  rationale: Embora o contexto trate de planos arrogantes e autônomos, a formulação é ampla. A tradução conserva tanto a conexão contextual quanto o alcance ético geral, sem impor um sistema doutrinário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação principal privilegia naturalidade sem perder o caráter geral e pessoal da advertência; a nota registra a forma mais literal.
