  text: νῦν δὲ καυχᾶσθε ἐν ταῖς ἀλαζονείαις ὑμῶν· πᾶσα καύχησις τοιαύτη πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/016.yaml
  text: But as it is[a], you boast in your arrogance. All such boasting is evil.
translation:
  language: pt
  text: Mas agora vocês se vangloriam de suas pretensões arrogantes. Toda vanglória desse tipo é má.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Mas agora
  rationale: Preserva de modo natural o contraste com a atitude de dependência do Senhor apresentada no versículo anterior.
- source_word: καυχᾶσθε
  choice: vocês se vangloriam
  rationale: Expressa diretamente a ideia de ostentar ou gloriar-se e mantém a ligação lexical com καύχησις na frase seguinte.
- source_word: ἐν ταῖς ἀλαζονείαις ὑμῶν
  choice: de suas pretensões arrogantes
  rationale: ἀλαζονεία pode indicar arrogância, presunção ou alegações pretensiosas. O plural é preservado, sem restringir indevidamente a expressão a planos comerciais.
- source_word: πᾶσα καύχησις τοιαύτη
  choice: Toda vanglória desse tipo
  rationale: Reproduz o sentido generalizador de πᾶσα e a qualificação de τοιαύτη, ao mesmo tempo que mantém a relação com o verbo anterior.
- source_word: πονηρά
  choice: má
  rationale: Comunica a avaliação moral expressa pelo adjetivo grego, em concordância natural com o substantivo feminino 'vanglória'.
theological_decisions:
- issue: Natureza da vanglória condenada
  choice: A condenação recai sobre a autoconfiança arrogante expressa nas pretensões humanas mencionadas no contexto.
  alternative: Uma condenação geral de toda forma de autoconfiança, ou apenas do planejamento comercial.
  rationale: O contexto imediato trata de planos feitos sem reconhecer a dependência do Senhor, mas a formulação final generaliza a avaliação para toda vanglória dessa natureza.
translation_notes:
  register: Português moderno, claro e digno, com construção natural tanto no Brasil quanto em outros contextos lusófonos. 'Pretensões arrogantes' conserva a amplitude lexical e o plural do grego; 'vanglória' mantém a conexão semântica entre o verbo e o substantivo.
