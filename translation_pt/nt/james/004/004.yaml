id: JAS.4.4
reference: James 4:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀μοιχαλίδες, οὐκ οἴδατε ὅτι ἡ φιλία τοῦ κόσμου ἔχθρα τοῦ θεοῦ ἐστιν; ὃς ⸀ἐὰν οὖν βουληθῇ φίλος εἶναι τοῦ κόσμου, ἐχθρὸς τοῦ θεοῦ καθίσταται.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/004.yaml
  text: Adulteresses[a], do you not know that friendship with the world is hostility toward God? Therefore[d][c][b], whoever wants to be a friend of the world makes himself an enemy of God.
translation:
  language: pt
  text: Adúlteras[a], vocês não sabem que a amizade com o mundo[b] é inimizade contra Deus[c]? Portanto, quem quiser ser amigo do mundo torna-se inimigo de Deus[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O termo feminino plural provavelmente é metafórico e evoca a linguagem profética da infidelidade do povo a Deus. Também se pode explicitar: “Pessoas adúlteras”.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “o mundo” se refere à ordem humana em oposição a Deus, não à criação em si.
    reason: cultural_note
  - marker: c
    text: 'Ou: “inimizade com Deus”.'
    reason: alternative_reading
  - marker: d
    text: 'Ou: “é constituído inimigo de Deus”.'
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχαλίδες
  choice: Adúlteras
  rationale: Preserva o vocativo feminino plural e a força concreta da metáfora, sem substituí-la no texto principal por uma explicação como “pessoas infiéis”.
- source_word: οὐκ οἴδατε
  choice: vocês não sabem
  rationale: Formulação portuguesa natural que mantém a força retórica da pergunta negativa.
- source_word: φιλία
  choice: amizade
  rationale: Corresponde diretamente ao substantivo e preserva a ligação lexical com φίλος, traduzido depois por “amigo”.
- source_word: κόσμου
  choice: com o mundo
  rationale: Mantém a expressão ampla do grego sem inserir no texto principal uma paráfrase interpretativa sobre a ordem humana contrária a Deus.
- source_word: ἔχθρα τοῦ θεοῦ
  choice: inimizade contra Deus
  rationale: Expressa com clareza a leitura do genitivo como objetivo, isto é, inimizade dirigida contra Deus, preservando em nota a possibilidade de uma relação de inimizade com Deus.
- source_word: ὃς ἐὰν οὖν
  choice: Portanto, quem
  rationale: “Portanto” comunica a inferência de οὖν, e “quem” introduz naturalmente a referência geral e indefinida.
- source_word: βουληθῇ
  choice: quiser
  rationale: Transmite a vontade deliberada expressa por βούλομαι sem tornar a frase artificial.
- source_word: φίλος εἶναι τοῦ κόσμου
  choice: ser amigo do mundo
  rationale: Preserva a construção nominal e o contraste lexical entre amizade com o mundo e inimizade contra Deus.
- source_word: ἐχθρὸς τοῦ θεοῦ
  choice: inimigo de Deus
  rationale: Tradução direta e enfática do adjetivo usado substantivamente, em paralelo com “amigo do mundo”.
- source_word: καθίσταται
  choice: constitui-se
  rationale: Comunica a entrada deliberada numa condição ou posição e conserva a participação moral do sujeito, sem excluir a alternativa mais simples “torna-se”.
theological_decisions:
- issue: Força metafórica de μοιχαλίδες
  choice: Manter “Adúlteras” no texto principal, entendendo que o contexto aponta para infidelidade espiritual ou pactual.
  alternative: “Pessoas adúlteras” ou “pessoas infiéis”.
  rationale: O uso provavelmente ecoa a linguagem profética de infidelidade a Deus, mas substituir a imagem por uma explicação eliminaria a metáfora incisiva e a forma feminina marcada do grego.
- issue: Sentido de κόσμος
  choice: Traduzir simplesmente por “o mundo”.
  alternative: “A ordem humana contrária a Deus” ou “o sistema do mundo”.
  rationale: No contexto, o termo indica a esfera humana em oposição a Deus, não a criação material em si; ainda assim, a tradução principal deve preservar a amplitude do termo grego.
- issue: Relação expressa em ἔχθρα τοῦ θεοῦ
  choice: “Inimizade contra Deus”, tomando o genitivo como objetivo.
  alternative: “Inimizade com Deus”, deixando a relação mais aberta ou recíproca.
  rationale: O contraste com a escolha de ser amigo do mundo favorece a ideia de hostilidade dirigida contra Deus, mas a construção grega admite formulação menos direcional.
- issue: Força de καθίσταται
  choice: “Constitui-se inimigo de Deus”, destacando a condição resultante da escolha do sujeito.
  alternative: “Torna-se inimigo de Deus”.
  rationale: A forma pode descrever a entrada numa condição; “constitui-se” preserva a agência sugerida pelo desejo deliberado sem afirmar um mecanismo teológico além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para tornar explícito o plural do discurso. A imagem forte de “Adúlteras” e os paralelos “amizade/amigo” e “inimizade/inimigo” foram preservados. “Constitui-se” é formal, mas corrente e adequado ao tom exortativo.
