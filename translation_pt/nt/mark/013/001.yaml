source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ ἐκ τοῦ ἱεροῦ λέγει αὐτῷ εἷς τῶν μαθητῶν αὐτοῦ· Διδάσκαλε, ἴδε ποταποὶ λίθοι καὶ ποταπαὶ οἰκοδομαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/001.yaml
  text: And as he was going out of the temple[a], one of his disciples says to him, “Teacher[b], look—what wonderful stones and what wonderful buildings!”
translation:
  language: pt
  text: 'Quando ele estava saindo do templo[a], um dos seus discípulos lhe diz: “Mestre, veja que pedras impressionantes e que construções impressionantes[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego ἱερόν se refere ao conjunto ou recinto do templo, não especificamente ao santuário interior.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «que grandes pedras e que grandes construções!» O adjetivo grego expressa surpresa ou admiração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ
  choice: Quando ele estava saindo
  rationale: O genitivo absoluto com particípio presente indica uma ação em andamento e contemporânea à fala; esta formulação é natural em português e preserva esse aspecto.
- source_word: τοῦ ἱεροῦ
  choice: do templo
  rationale: Ἱερόν designa aqui o conjunto ou recinto do templo, não especificamente o santuário interior; “templo” é a forma corrente e legível, com a precisão registrada em nota.
- source_word: λέγει
  choice: diz
  rationale: Preserva o presente histórico característico da narrativa vívida de Marcos.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: um dos seus discípulos
  rationale: Reproduz de modo direto e natural a expressão partitiva grega.
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: Em português, “Mestre” é um vocativo corrente para alguém reconhecido como professor e mantém a dignidade do tratamento.
- source_word: ἴδε
  choice: veja
  rationale: O imperativo chama a atenção do interlocutor; “veja” é natural, respeitoso e não arcaico.
- source_word: ποταποὶ ... καὶ ποταπαὶ
  choice: que ... e que ... impressionantes
  rationale: A construção exclamativa expressa admiração diante da qualidade e grandeza; “impressionantes” comunica essa reação sem especificar indevidamente apenas o tamanho.
- source_word: λίθοι
  choice: pedras
  rationale: Equivalente direto que se refere às pedras usadas nas construções do templo.
- source_word: οἰκοδομαί
  choice: construções
  rationale: Abrange naturalmente os vários edifícios e estruturas do complexo do templo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O presente histórico “diz” preserva a vivacidade narrativa de Marcos. A exclamação foi formulada de modo idiomático, sem eliminar a admiração expressa pelo grego.
