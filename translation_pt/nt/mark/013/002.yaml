  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὁ ⸀Ἰησοῦς εἶπεν αὐτῷ· Βλέπεις ταύτας τὰς μεγάλας οἰκοδομάς; οὐ μὴ ἀφεθῇ ⸀ὧδε λίθος ἐπὶ ⸀λίθον ὃς οὐ μὴ καταλυθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/002.yaml
  text: And Jesus said to him[c][b][a], “Do you see these great buildings? Not one stone will be left here upon another that will not be torn down.”
translation:
  language: pt
  text: 'Jesus lhe disse: “Você está vendo estas grandes construções?[a] Não ficará aqui pedra sobre pedra[b] que não seja derrubada.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estas grandes construções do templo”. O contexto é o complexo do templo, embora o grego diga simplesmente “construções”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “não ficará pedra sobre pedra” indica destruição completa.
    reason: cultural_note
  - marker: c
    text: 'Ou: “demolida” ou “destruída”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπεις
  choice: Você está vendo
  rationale: O presente indicativo tem força interrogativa no contexto. A forma progressiva soa natural em português e mantém a atenção voltada para as construções diante deles, sem transformar a pergunta em ordem.
- source_word: μεγάλας οἰκοδομάς
  choice: grandes construções
  rationale: “Construções” traduz o plural οἰκοδομάς sem acrescentar “do templo”, que está implícito no contexto. “Grandes” preserva tanto a dimensão física quanto a imponência sugerida por μεγάλας.
- source_word: οὐ μὴ ἀφεθῇ
  choice: Não ficará
  rationale: A combinação οὐ μή com o subjuntivo expressa uma negação futura enfática. A formulação categórica “Não ficará” comunica essa certeza de modo atual e natural em português.
- source_word: ὧδε
  choice: aqui
  rationale: Traduz diretamente o advérbio de lugar e preserva a referência imediata ao local observado.
- source_word: λίθος ἐπὶ λίθον
  choice: pedra sobre pedra
  rationale: Mantém a imagem idiomática de destruição completa em uma expressão corrente e clara em português.
- source_word: καταλυθῇ
  choice: seja derrubada
  rationale: Neste contexto arquitetônico, καταλύω indica desmantelar ou demolir. “Derrubada” comunica com clareza a destruição física das construções.
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: Jesus lhe disse
  rationale: Reproduz a introdução narrativa sem acrescentar a ideia de resposta. O καί funciona aqui como ligação narrativa e pode ficar implícito em português para maior naturalidade.
theological_decisions:
- issue: Alcance da predição de Jesus sobre o complexo do templo
  choice: Manter “construções” no texto principal
  alternative: “construções do templo”
  rationale: O contexto identifica as construções como pertencentes ao complexo do templo, mas o grego usa apenas οἰκοδομάς. A tradução evita explicitar no texto principal algo que está contextual, mas não lexicalmente, presente.
- issue: Força da negação profética
  choice: 'Expressar a declaração como certeza categórica: “Não ficará”'
  alternative: “De modo nenhum ficará”
  rationale: οὐ μή marca forte negação futura. Em português, a declaração direta no futuro já transmite certeza e solenidade sem uma formulação pesada, embora a alternativa torne a ênfase gramatical mais explícita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento por “você” torna a pergunta natural; a formulação preserva a imagem concreta e a estrutura enfática da profecia sem linguagem arcaica.
