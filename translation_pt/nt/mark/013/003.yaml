  text: Καὶ καθημένου αὐτοῦ εἰς τὸ Ὄρος τῶν Ἐλαιῶν κατέναντι τοῦ ἱεροῦ ⸀ἐπηρώτα αὐτὸν κατ’ ἰδίαν Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/003.yaml
  text: And as he was sitting on the Mount of Olives opposite the temple, Peter and James and John and Andrew were asking him privately,
translation:
  language: pt
  text: 'Enquanto ele estava sentado no monte das Oliveiras, em frente ao templo[a], Pedro, Tiago, João e André lhe perguntavam em particular:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra grega ἱερόν se refere ao conjunto ou recinto do templo, não especificamente ao santuário interior (ναός).
    reason: lexical_alternative
lexical_decisions:
- source_word: καθημένου αὐτοῦ
  choice: enquanto ele estava sentado
  rationale: O genitivo absoluto com particípio presente apresenta uma circunstância em andamento; esta formulação a expressa com naturalidade em português.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: no monte das Oliveiras
  rationale: Com um verbo de posição, εἰς indica aqui localização. «Monte das Oliveiras» é a designação geográfica tradicional e clara em português.
- source_word: κατέναντι τοῦ ἱεροῦ
  choice: em frente ao templo
  rationale: κατέναντι indica posição diante de ou defronte a algo. «Em frente ao templo» é natural e mantém a relação espacial sem afirmar mais do que o texto.
- source_word: ἐπηρώτα
  choice: lhe perguntavam
  rationale: O imperfeito grego apresenta a ação em curso. O plural em português concorda naturalmente com os quatro sujeitos pospostos, enquanto «perguntavam» preserva o aspecto imperfectivo.
- source_word: κατ’ ἰδίαν
  choice: em particular
  rationale: A expressão indica que a conversa ocorreu separadamente dos demais, de modo privado.
- source_word: Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας
  choice: Pedro, Tiago, João e André
  rationale: Empregam-se as formas portuguesas tradicionais dos nomes. A enumeração com vírgulas é mais natural no português atual do que reproduzir todas as conjunções gregas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O imperfeito foi mantido em «perguntavam», e os nomes foram apresentados segundo o uso português corrente. O sinal de dois-pontos prepara naturalmente a pergunta direta do versículo seguinte.
