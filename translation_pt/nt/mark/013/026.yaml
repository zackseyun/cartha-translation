  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλαις μετὰ δυνάμεως πολλῆς καὶ δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/026.yaml
  text: And then they will see the Son of Man coming in the clouds with great power and glory[a].
translation:
  language: pt
  text: E então verão o Filho do Homem vindo nas nuvens, com grande poder e glória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vindo com as nuvens”. O grego diz literalmente “em nuvens”, mas a alternativa realça a provável alusão a Daniel 7:13.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: verão
  rationale: O futuro de ὁράω tem aqui sentido direto. “Verão” é natural em português e preserva o caráter visível do acontecimento sem acrescentar interpretação.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém o título bíblico reconhecido e sua ressonância com Daniel 7, sem o reduzir a uma referência genérica ao ser humano.
- source_word: ἐρχόμενον
  choice: vindo
  rationale: Reproduz naturalmente o particípio presente que modifica “o Filho do Homem” e preserva a linguagem da vinda apocalíptica.
- source_word: ἐν νεφέλαις
  choice: nas nuvens
  rationale: Embora o grego diga literalmente “em nuvens”, “nas nuvens” é a formulação idiomática e digna em português. A alternativa “com as nuvens”, que realça a provável alusão a Daniel 7:13, é mantida em nota.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: com grande poder
  rationale: Traduz idiomaticamente a ideia de acompanhamento e intensidade expressa por μετά com o genitivo e πολλῆς.
- source_word: καὶ δόξης
  choice: e glória
  rationale: “Glória” preserva o sentido bíblico de majestade manifesta e a linguagem intertextual do contexto.
theological_decisions:
- issue: Título apocalíptico e imagem das nuvens
  choice: Manter “o Filho do Homem” e a imagem de sua vinda nas nuvens sem explicação interpretativa no texto principal.
  alternative: Traduzir o título como “o Ser Humano” ou explicitar no texto a alusão a Daniel 7:13.
  rationale: O versículo evoca fortemente Daniel 7:13, mas a tradução deve conservar a alusão e sua tensão cristológica e escatológica, em vez de resolvê-la por paráfrase.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha o grego sem soar artificial; o título tradicional e o vocabulário bíblico são preservados.
