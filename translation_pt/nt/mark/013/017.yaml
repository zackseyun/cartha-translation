  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/017.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a][b].
translation:
  language: pt
  text: Mas ai das que estiverem grávidas e das que estiverem amamentando naqueles dias!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: ai
  rationale: Preserva a força profética e exclamativa de lamento e advertência; em português bíblico corrente, “ai” comunica com concisão a gravidade da aflição vindoura.
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição e o desenvolvimento em relação à advertência anterior, sem impor um contraste excessivamente forte.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: das que estiverem grávidas
  rationale: Traduz idiomaticamente a expressão literal “ter no ventre”, mantendo a referência feminina plural de forma natural e moderna.
- source_word: γαστρί
  choice: grávidas
  rationale: O sentido de γαστήρ está incorporado ao idioma ἐν γαστρὶ ἔχω; traduzir o conjunto como “estar grávida” evita uma formulação artificial.
- source_word: θηλαζούσαις
  choice: das que estiverem amamentando
  rationale: Expressa naturalmente a ação de dar de mamar. O objeto, implícito no grego, pode permanecer implícito em português sem perda de clareza.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: naqueles dias
  rationale: É uma formulação temporal direta e idiomática, preservando a ligação com o contexto anterior.
theological_decisions: []
