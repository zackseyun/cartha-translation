base_translation:
  language: en
  yaml_path: translation/nt/mark/013/005.yaml
  text: Then Jesus began to say to them[a], “See to it that no one leads you astray.”
translation:
  language: pt
  text: 'Então Jesus começou a dizer a eles: “Tenham cuidado para que ninguém os desencaminhe[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os engane»; ou: «os leve a se desviar».'
    reason: πλανάω pode denotar enganar e levar alguém para fora do caminho correto.
lexical_decisions:
- source_word: δὲ
  choice: Então
  rationale: Conector narrativo leve que dá continuidade à cena sem introduzir um contraste forte.
- source_word: ἤρξατο λέγειν
  choice: começou a dizer
  rationale: Reproduz de modo natural a construção narrativa do grego e não acrescenta a ideia de que Jesus respondeu, ausente neste versículo.
- source_word: αὐτοῖς
  choice: a eles
  rationale: Mantém o pronome explícito do grego sem substituir seu referente contextual por “aos discípulos”.
- source_word: Βλέπετε
  choice: Cuidado
  rationale: Expressa em português corrente a força contínua de advertência do imperativo presente e se liga naturalmente à oração seguinte.
- source_word: μή τις ὑμᾶς πλανήσῃ
  choice: para que ninguém os engane
  rationale: A construção adverte contra algo que deve ser evitado. “Engane” é natural e abrange o ato de induzir ao erro, embora o verbo também possa realçar o desvio do caminho correto.
theological_decisions:
- issue: Amplitude da advertência em πλανήσῃ
  choice: Advertência contra o engano que pode induzir ao erro ou desviar
  alternative: Advertência restrita à falsidade intelectual
  rationale: πλανάω pode envolver tanto enganar quanto levar alguém a se desviar. A tradução principal usa uma formulação portuguesa natural, e a nota preserva explicitamente a imagem alternativa de desvio.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita arcaísmos como “vede” e “acautelai-vos”, preserva o pronome plural de αὐτοῖς e não explicita no texto principal que o referente são os discípulos.
