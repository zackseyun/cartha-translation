  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται καὶ δώσουσιν σημεῖα καὶ τέρατα πρὸς τὸ ἀποπλανᾶν εἰ ⸀δυνατὸν τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/022.yaml
  text: For false messiahs and false prophets will arise and will give signs and wonders in order to lead astray[a], if possible[c][b], the elect.
translation:
  language: pt
  text: Pois surgirão falsos messias[a] e falsos profetas, e realizarão sinais e prodígios a fim de desviar, se possível[b], os eleitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “falsos cristos”. O termo grego é formado com Christós, usado aqui como título com o sentido de “Messias”.
    reason: alternative_reading
  - marker: b
    text: Ou “se fosse possível”. A formulação grega não resolve explicitamente se os eleitos podem de fato ser desviados; ela declara o propósito dos enganadores sob essa condição.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: surgirão
  rationale: Neste contexto, o futuro passivo de ἐγείρω descreve idiomaticamente o aparecimento ou a emergência dessas pessoas. “Surgirão” é natural em português e evita sugerir indevidamente que Deus as levantará.
- source_word: γὰρ
  choice: pois
  rationale: γάρ introduz a explicação da advertência anterior. “Pois” conserva essa ligação argumentativa de modo conciso e digno.
- source_word: ψευδόχριστοι
  choice: falsos messias
  rationale: O composto designa pretendentes falsos ao título messiânico. “Falsos messias” comunica o sentido de Χριστός como título no contexto judaico e é mais transparente que “falsos cristos” para leitores atuais.
- source_word: ψευδοπροφῆται
  choice: falsos profetas
  rationale: Equivalente direto, corrente e claro do substantivo composto grego.
- source_word: δώσουσιν σημεῖα καὶ τέρατα
  choice: realizarão sinais e prodígios
  rationale: Embora δώσουσιν signifique literalmente “darão”, em português a colocação natural para a produção ou execução de sinais é “realizarão”. “Sinais e prodígios” preserva a fórmula grega sem acrescentar explicitamente “milagrosos”.
- source_word: πρὸς τὸ ἀποπλανᾶν
  choice: a fim de desviar
  rationale: A construção com πρὸς τό e infinitivo expressa propósito. “Desviar” preserva a ideia de levar alguém para longe do caminho ou da verdade, sem reduzi-la apenas a uma falsidade intelectual.
- source_word: εἰ δυνατόν
  choice: se possível
  rationale: Tradução direta e concisa que mantém aberta a condição expressa pelo grego, sem afirmar nem negar que os eleitos possam de fato ser desviados.
- source_word: τοὺς ἐκλεκτούς
  choice: os eleitos
  rationale: “Os eleitos” é uma expressão portuguesa estabelecida e conserva o peso teológico de ἐκλεκτούς sem especificar aqui a natureza, o momento ou os efeitos da eleição.
theological_decisions:
- issue: Sentido titular de ψευδόχριστοι
  choice: falsos messias
  alternative: falsos cristos
  rationale: O composto emprega Χριστός no sentido de título, “Messias”. A opção escolhida torna inteligível a alegação dos impostores sem transformar “Cristo” em nome próprio dentro do composto.
- issue: Possibilidade de os eleitos serem desviados em εἰ δυνατόν
  choice: se possível
  alternative: se fosse possível
  rationale: O grego apresenta uma condição breve e não declara expressamente se ela pode concretizar-se. “Se fosse possível” poderia insinuar com mais força que isso é impossível; “se possível” preserva a tensão do texto.
- issue: Relação sintática de εἰ δυνατόν com o propósito de enganar
  choice: a fim de desviar, se possível, os eleitos
  alternative: a fim de desviar os eleitos, se possível
  rationale: A ordem escolhida acompanha de perto a sequência grega e mantém “se possível” junto ao alvo do propósito. A formulação não decide além do texto se a condição limita o ato de desviar, o alcance aos eleitos ou a realização do propósito.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Realizarão” evita o decalque pouco natural “darão sinais”, enquanto “sinais e prodígios”, “os eleitos” e a ordem final conservam a ressonância e a tensão do original.
