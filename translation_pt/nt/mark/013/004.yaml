  text: Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ⸂ταῦτα συντελεῖσθαι πάντα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/004.yaml
  text: Tell us[a], when will these things be, and what will be the sign when all these things are about to be accomplished?
translation:
  language: pt
  text: '“Diga-nos: quando acontecerão essas coisas, e qual será o sinal quando todas essas coisas estiverem prestes a se cumprir?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando todas essas coisas se cumprirem”. O grego emprega μέλλω com um infinitivo, construção que pode indicar mais especificamente que algo está prestes a acontecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰπὸν ἡμῖν
  choice: Diga-nos
  rationale: O imperativo aoristo singular, dirigido a Jesus, seguido do pronome dativo, é expresso de modo natural e digno em português.
- source_word: πότε ταῦτα ἔσται
  choice: quando acontecerão essas coisas
  rationale: Embora ἔσται seja literalmente “serão”, neste contexto a formulação idiomática em português é “acontecerão”; “essas coisas” preserva o plural e a referência ao anúncio anterior.
- source_word: καὶ τί τὸ σημεῖον
  choice: e qual será o sinal
  rationale: “Sinal” é o equivalente corrente de σημεῖον. O futuro “será” é suprido naturalmente a partir do contexto da pergunta.
- source_word: ὅταν μέλλῃ
  choice: de que ... estão prestes a
  rationale: A construção portuguesa “sinal de que” comunica com naturalidade a relação entre o sinal e a situação futura, enquanto “estão prestes a” preserva a força prospectiva ou iminente de μέλλω com infinitivo.
- source_word: ταῦτα συντελεῖσθαι πάντα
  choice: todas elas ... se cumprir
  rationale: “Todas elas” retoma “essas coisas” sem repetição pesada. “Cumprir-se” preserva a ideia de conclusão ou consumação do passivo συντελεῖσθαι sem explicitar indevidamente cumprimento profético.
theological_decisions:
- issue: Força escatológica de μέλλῃ com infinitivo
  choice: estão prestes a se cumprir
  alternative: vierem a se cumprir; se cumprirem
  rationale: A tradução mantém a nuance de ação iminente ou em vias de ocorrer presente em μέλλω, sem transformá-la numa afirmação doutrinária mais ampla sobre a cronologia escatológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento singular “Diga-nos” corresponde ao fato de os discípulos dirigirem a pergunta a Jesus. A redação conserva o tom direto e solene do discurso.
