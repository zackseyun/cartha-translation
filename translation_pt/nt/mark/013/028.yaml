  verdict: revise
  source_fidelity: 'A tradução reproduz adequadamente a ordem principal: aprender da figueira, reconhecer o sinal e concluir que o verão está próximo. Contudo, “começa a soltar folhas” acrescenta a ideia aspectual de começo, não expressa por ἐκφύῃ, e “soltar folhas” pode sugerir queda de folhas em português, em vez de brotamento.'
  naturalness: O registro é claro e atual. “Quando seu ramo já se torna tenro” é compreensível, mas a construção com subjuntivo e a imagem de brotar folhas soam mais naturais e precisas no português moderno.
  terminology: “Parábola”, “figueira”, “ramo”, “folhas” e “verão” são escolhas apropriadas. A nota preserva alternativas lexicais legítimas para παραβολή sem deslocar o termo principal.
  issues:
