  to: 'Aprendam com a figueira esta parábola[a]: quando o seu ramo já estiver tenro e brotar folhas, vocês sabem que o verão está próximo.'
  rationale: A revisão limita-se a substituir uma expressão que podia acrescentar aspecto e sugerir a queda das folhas por “brotar folhas”, correspondente a ἐκφύῃ, e a ajustar a oração temporal para uma formulação portuguesa mais natural. Mantêm-se “parábola”, a relação de aprendizagem com a figueira, o plural “vocês sabem” e a proximidade do verão.
