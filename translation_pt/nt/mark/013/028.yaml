  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ⸂ἤδη ὁ κλάδος αὐτῆς⸃ ἁπαλὸς γένηται καὶ ἐκφύῃ τὰ φύλλα, γινώσκετε ὅτι ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/028.yaml
  text: 'Learn the parable from the fig tree: when its branch has already become tender and puts out leaves[a], you know that summer is near.'
translation:
  language: pt
  text: 'Aprendam com a figueira esta parábola[a]: quando o seu ramo já estiver tenro e brotar folhas, vocês sabem que o verão está próximo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lição” ou “ilustração”.'
    reason: Alternativas lexicais para παραβολή neste contexto.
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: com a figueira
  rationale: A preposição ἀπό com o genitivo indica a fonte da aprendizagem. Em português corrente, “aprender com a figueira” expressa isso naturalmente. O δέ é uma ligação discursiva leve e não exige uma palavra específica neste contexto.
- source_word: μάθετε
  choice: Aprendam
  rationale: O imperativo aoristo de μανθάνω convoca os ouvintes a receber uma instrução. “Aprendam” é direto, atual e adequado ao plural.
- source_word: τὴν παραβολήν
  choice: esta parábola
  rationale: παραβολή designa aqui uma comparação ilustrativa. “Parábola” preserva o vocabulário característico dos Evangelhos; “esta” introduz naturalmente em português a explicação que vem em seguida.
- source_word: ὅταν
  choice: quando
  rationale: ὅταν com o subjuntivo introduz uma condição temporal geral; “quando” comunica isso de modo natural.
- source_word: ἤδη ὁ κλάδος αὐτῆς ἁπαλὸς γένηται
  choice: quando seu ramo já se torna tenro
  rationale: Mantém o singular genérico de κλάδος, a nuance temporal de ἤδη e o sentido de crescimento novo, macio ou tenro, expresso por ἁπαλός.
- source_word: ἐκφύῃ τὰ φύλλα
  choice: começa a soltar folhas
  rationale: ἐκφύω descreve o surgimento ou brotar das folhas. “Soltar folhas” é uma expressão botânica clara e corrente; “começa a” explicita naturalmente o início visível desse processo sem alterar a imagem.
- source_word: γινώσκετε
  choice: vocês sabem
  rationale: A forma é indicativa presente no contexto, descrevendo o reconhecimento habitual do sinal, e não dando uma nova ordem.
- source_word: ἐγγὺς τὸ θέρος ἐστίν
  choice: o verão está próximo
  rationale: ἐγγύς indica proximidade temporal, e θέρος tem aqui seu sentido sazonal comum, “verão”.
theological_decisions:
- issue: Sentido de παραβολή neste contexto
  choice: parábola
  alternative: lição; ilustração
  rationale: A tradução principal conserva o termo habitual dos Evangelhos sem impor à breve comparação uma interpretação alegórica adicional. A nota registra os sentidos contextuais possíveis.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis e boa legibilidade brasileira. Usa “vocês” para o plural de segunda pessoa implícito nos verbos gregos e evita tanto arcaísmos como explicações interpretativas no corpo do versículo.
