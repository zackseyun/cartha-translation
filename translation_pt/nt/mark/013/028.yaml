    rationale: O verbo grego significa brotar ou produzir folhas; não explicita o início do processo. Além disso, “soltar folhas” pode ser entendido como deixar cair folhas. “Brotar folhas” conserva a imagem e evita ambas as dificuldades.
  - severity: low
    issue: Modo verbal em “quando seu ramo já se torna tenro”
    rationale: Em uma condição temporal geral projetada para a ocorrência do sinal, “quando o seu ramo já estiver tenro” é mais idiomático e reflete melhor o valor do subjuntivo grego, mantendo a nuance de estado já alcançado dada por ἤδη.
