  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη μέχρις οὗ ⸂ταῦτα πάντα⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/030.yaml
  text: Truly I say to you that this generation will certainly not pass away until all these things happen[a][b].
translation:
  language: pt
  text: 'Em verdade lhes digo: esta geração certamente não passará até que todas essas coisas aconteçam[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «este povo» ou «esta raça»; o grego γενεά pode ter sentidos mais amplos, embora «geração» seja a tradução mais natural aqui.
    reason: lexical_alternative
  - marker: b
    text: A expressão «certamente não passará» traduz uma negação enfática no grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Em verdade
  rationale: Introduz uma declaração solene e autorizada. A expressão é digna, compreensível e preserva a força discursiva do termo grego.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Reproduz de modo natural em português a fórmula de declaração dirigida aos ouvintes.
- source_word: οὐ μὴ παρέλθῃ
  choice: certamente não passará
  rationale: A combinação οὐ μή com o subjuntivo aoristo expressa uma negação enfática; «certamente não» comunica essa força sem sugerir duração ilimitada além do ponto temporal indicado.
- source_word: ἡ γενεὰ αὕτη
  choice: esta geração
  rationale: É o sentido mais natural no contexto temporal e discursivo, preservando a conhecida tensão interpretativa sem impor uma solução escatológica.
- source_word: μέχρις οὗ
  choice: até que
  rationale: Marca de modo claro e conciso o limite temporal expresso pelo grego.
- source_word: ταῦτα πάντα
  choice: todas essas coisas
  rationale: Mantém explicitamente tanto o demonstrativo plural quanto a ideia de totalidade.
- source_word: γένηται
  choice: aconteçam
  rationale: No contexto, γίνομαι se refere à ocorrência dos acontecimentos mencionados; «aconteçam» é corrente e preciso.
theological_decisions:
- issue: Sentido de «esta geração» (ἡ γενεὰ αὕτη) no discurso escatológico
  choice: Traduzir diretamente como «esta geração», sem expansão interpretativa.
  alternative: «este povo» ou «esta raça»; também se propõe a geração futura que presencia o início dos sinais.
  rationale: A expressão grega corresponde mais naturalmente a «esta geração». Como sua referência é amplamente debatida, a tradução conserva a formulação e a tensão do texto, sem favorecer um sistema escatológico específico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Em verdade» mantém o caráter solene da declaração; «lhes digo» evita rigidez excessiva. A ordem da frase segue naturalmente o português sem perder os elementos e as ênfases do grego.
