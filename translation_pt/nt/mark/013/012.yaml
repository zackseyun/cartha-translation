source:
  edition: SBLGNT
  text: ⸂καὶ παραδώσει⸃ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/012.yaml
  text: And brother will hand over brother to death[a], and a father his child[b], and children will rise up against parents and put them to death.
translation:
  language: pt
  text: Um irmão entregará seu irmão à morte[a], e um pai entregará seu filho à morte. Os filhos se levantarão contra os pais e os matarão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “trairá”; o verbo grego pode significar “entregar”, “entregar às autoridades” ou, neste contexto, “trair”.
    reason: lexical_alternative
  - marker: b
    text: Ou “farão com que sejam mortos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: entregará
  rationale: O verbo παραδίδωμι tem o sentido concreto de entregar alguém ao poder de outros. Neste contexto, a entrega resulta em morte; “entregará” preserva esse sentido sem tornar explícita, no texto principal, a nuance interpretativa de traição.
- source_word: ἀδελφὸς ἀδελφὸν
  choice: um irmão ... o próprio irmão
  rationale: Mantém o termo masculino específico e a repetição enfática do grego. “O próprio irmão” expressa com naturalidade em português a relação familiar implícita.
- source_word: εἰς θάνατον
  choice: à morte
  rationale: Reproduz de modo conciso o resultado ou destino indicado pela preposição εἰς.
- source_word: πατὴρ τέκνον
  choice: um pai ... seu filho
  rationale: “Pai” conserva o termo masculino πατήρ. Neste uso relacional, “filho” pode designar um descendente sem especificar que seja menino, e a inserção de “seu” torna explícita a relação naturalmente implícita no grego.
- source_word: τέκνα
  choice: os filhos
  rationale: Em referência a descendentes dentro da família, “filhos” é a forma plural natural e abrangente em português, podendo incluir filhos e filhas.
- source_word: ἐπαναστήσονται ἐπὶ
  choice: se levantarão contra
  rationale: Preserva a imagem vívida de uma ação hostil dirigida contra os pais, sem reduzi-la apenas a desobediência ou afastamento.
- source_word: γονεῖς
  choice: os pais
  rationale: O plural γονεῖς designa pai e mãe ou os genitores em conjunto; “os pais” é o equivalente corrente em português.
- source_word: θανατώσουσιν αὐτούς
  choice: os matarão
  rationale: Traduz diretamente o verbo θανατόω e seu objeto. A alternativa causativa é registrada em nota para preservar a possível ideia de fazer com que sejam executados.
theological_decisions:
- issue: Termos familiares marcados por gênero e termos semanticamente abrangentes
  choice: Conservar “irmão” e “pai” onde o grego emprega formas masculinas específicas, e usar “filho(s)” no sentido relacional abrangente corrente em português.
  alternative: Neutralizar como “uma pessoa entregará seu irmão ou sua irmã” e “um dos pais entregará seu filho ou sua filha”.
  rationale: A tradução mantém as distinções lexicais do grego sem acrescentar pares de gênero ausentes do texto. Em português, o plural “filhos” e, em certos contextos relacionais, o singular “filho” podem abranger ambos os sexos.
- issue: Agência na morte dos pais
  choice: “os matarão”, como formulação direta.
  alternative: “farão com que sejam mortos”, como formulação causativa.
  rationale: O verbo θανατόω pode descrever tanto matar quanto levar alguém a ser morto. O texto principal adota a expressão portuguesa mais direta, enquanto a nota conserva a possibilidade causativa relevante no contexto de perseguição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição dos vínculos familiares e a progressão para a morte foram mantidas. A pontuação separa as duas etapas da declaração sem alterar sua coordenação.
