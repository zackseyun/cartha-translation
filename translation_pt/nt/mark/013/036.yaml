  text: lest, coming suddenly, he find you sleeping.
translation:
  language: pt
  text: para que, vindo de repente, ele não encontre vocês dormindo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ
  choice: para que... não
  rationale: No contexto da exortação precedente, expressa a finalidade preventiva ou o resultado que deve ser evitado, de modo natural em português.
- source_word: ἐλθὼν ἐξαίφνης
  choice: venha de repente
  rationale: O particípio aoristo circunstancial com o advérbio é vertido como oração verbal fluente, preservando a ideia de chegada súbita.
- source_word: εὕρῃ ὑμᾶς καθεύδοντας
  choice: encontre vocês dormindo
  rationale: Mantém a construção de encontrar alguém em determinado estado e traduz ὑμᾶς explicitamente no plural, com ampla legibilidade brasileira.
theological_decisions:
- issue: Sentido figurado ou literal de καθεύδοντας
  choice: dormindo
  alternative: desatentos
  rationale: A tradução conserva a imagem concreta e sua abertura metafórica no discurso, sem interpretar antecipadamente o sono como negligência espiritual.
- issue: Sujeito implícito de ἐλθών e εὕρῃ
  choice: ele
  alternative: o senhor da casa
  rationale: O grego deixa o sujeito implícito, mas o português requer clareza; o pronome retoma naturalmente o senhor da casa mencionado no contexto, preservando a aplicação escatológica sem expandi-la no versículo.
translation_notes:
  register: Português moderno, digno e direto, com 'vocês' para marcar inequivocamente o plural de ὑμᾶς. A ordem foi ajustada à sintaxe idiomática portuguesa sem perder a chegada repentina nem o estado de sono.
