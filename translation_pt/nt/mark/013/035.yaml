id: MRK.13.35
reference: Mark 13:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, οὐκ οἴδατε γὰρ πότε ὁ κύριος τῆς οἰκίας ἔρχεται, ⸀ἢ ὀψὲ ἢ ⸀μεσονύκτιον ἢ ἀλεκτοροφωνίας ἢ πρωΐ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/035.yaml
  text: 'Therefore stay awake[a], for you do not know when the master of the house is coming: whether in the evening, or at midnight, or at cockcrow[b], or in the morning.'
translation:
  language: pt
  text: 'Portanto, mantenham-se vigilantes[a], pois vocês não sabem quando vem o senhor da casa: se ao anoitecer, à meia-noite, ao cantar do galo[b] ou de manhã.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fiquem vigiando”. A ordem transmite a ideia de permanecer alerta e atento.
    reason: lexical_alternative
  - marker: b
    text: O “cantar do galo” designa uma das vigílias da noite, marcada pelo canto do galo.
    reason: cultural_note
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: mantenham-se vigilantes
  rationale: O imperativo exige atenção contínua e prontidão. A formulação comunica tanto a ideia literal de permanecer acordado quanto o sentido contextual de estar alerta, sem reduzir a ordem à vigília física.
- source_word: οὖν
  choice: Portanto
  rationale: Preserva de modo claro a inferência em relação ao ensino anterior.
- source_word: οὐκ οἴδατε
  choice: vocês não sabem
  rationale: Tradução direta da forma verbal negada, sem acrescentar uma ideia de incerteza que não está expressa no grego.
- source_word: πότε
  choice: quando
  rationale: Equivalente temporal simples, natural e suficiente em português.
- source_word: ὁ κύριος τῆς οἰκίας
  choice: o senhor da casa
  rationale: Mantém a ideia de autoridade doméstica de κύριος e conserva a possível ressonância mais ampla da imagem, sem transformar a expressão diretamente em título divino nem especificar propriedade como faria “dono”.
- source_word: ἔρχεται
  choice: vem
  rationale: O presente grego, usado para a chegada esperada, é reproduzido naturalmente pelo presente em português.
- source_word: ὀψὲ
  choice: ao anoitecer
  rationale: No encadeamento das vigílias noturnas, indica o primeiro período da noite, não apenas um momento vagamente tardio.
- source_word: μεσονύκτιον
  choice: à meia-noite
  rationale: Expressão temporal corrente e precisa para o segundo período mencionado.
- source_word: ἀλεκτοροφωνίας
  choice: ao cantar do galo
  rationale: Expressão portuguesa clara e natural que preserva a referência ao período noturno identificado pelo canto do galo.
- source_word: πρωΐ
  choice: de manhã
  rationale: Conserva a referência ampla ao último período da noite ou começo da manhã sem restringi-la necessariamente ao instante do amanhecer.
theological_decisions:
- issue: Como traduzir κύριος numa imagem doméstica que pode aludir indiretamente a Jesus
  choice: senhor da casa
  alternative: dono da casa; Senhor da casa
  rationale: A inicial minúscula apresenta o sentido imediato de autoridade dentro da imagem doméstica. Ao mesmo tempo, “senhor” preserva melhor que “dono” a amplitude semântica de κύριος e não elimina a possível aplicação cristológica da parábola.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas naturais para leitores brasileiros. A sequência temporal foi expressa de modo idiomático, preservando a estrutura das quatro vigílias e a tensão entre a cena doméstica e sua possível aplicação cristológica.
