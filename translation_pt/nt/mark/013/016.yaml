  text: καὶ ὁ εἰς τὸν ⸀ἀγρὸν μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω ἆραι τὸ ἱμάτιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/016.yaml
  text: And the one in the field must not turn back to get his cloak[a].
translation:
  language: pt
  text: E quem estiver no campo não volte para buscar sua capa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “veste exterior”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰς τὸν ἀγρόν
  choice: quem estiver no campo
  rationale: A construção articular substantivada designa genericamente a pessoa que se encontra no campo. A formulação é natural em português e não introduz uma restrição masculina ausente do sentido referencial.
- source_word: ἀγρός
  choice: campo
  rationale: Neste contexto de fuga, ἀγρός indica um campo ou terreno cultivado; “campo” é a correspondência mais direta e amplamente compreensível.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: não volte
  rationale: O imperativo aoristo com μή expressa uma proibição urgente. “Não volte” transmite naturalmente a ideia idiomática de retornar ao que ficou para trás.
- source_word: ἆραι
  choice: para buscar
  rationale: O infinitivo indica a finalidade de voltar. Neste contexto, αἴρω tem o sentido prático de pegar ou recuperar algo deixado para trás; “buscar” é idiomático em português.
- source_word: ἱμάτιον
  choice: capa
  rationale: Ἱμάτιον designa uma peça exterior de roupa, frequentemente uma capa ou manto. “Capa” é conciso e claro, enquanto a nota registra a alternativa mais abrangente.
- source_word: αὐτοῦ
  choice: sua
  rationale: O possessivo singular corresponde ao pronome grego e retoma genericamente “quem”, preservando o número singular sem tornar a referência exclusivamente masculina.
theological_decisions:
- issue: Referência genérica masculina
  choice: Manter a referência genérica no singular com “quem estiver ... sua capa”.
  alternative: “Aquele que estiver ... sua capa” ou pluralizar como “os que estiverem ... suas capas”.
  rationale: O grego emprega uma expressão articular masculina singular e um pronome masculino singular, mas a referência é genericamente representativa. “Quem ... sua” preserva o singular e a abrangência sem acrescentar uma limitação a homens.
translation_notes:
  register: Português moderno, claro e digno, de leitura natural no Brasil e inteligível internacionalmente. A ordem e a concisão preservam a urgência da proibição.
