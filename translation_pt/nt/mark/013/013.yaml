source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου. ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/013.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: pt
  text: E vocês serão odiados por todos por causa do meu nome. Mas quem perseverar até o fim[a] será salvo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “permanecer firme até o fim”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “será libertado”. O verbo grego pode indicar livramento ou salvação; o contexto não restringe inteiramente seu alcance.'
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι
  choice: odiados
  rationale: Com ἔσεσθε, o particípio forma uma expressão futura, vertida naturalmente em português como “serão odiados”.
- source_word: ὑπὸ πάντων
  choice: por todos
  rationale: Mantém a formulação abrangente e enfática do grego sem acrescentar qualificações ausentes no texto.
- source_word: διὰ τὸ ὄνομά μου
  choice: por causa do meu nome
  rationale: διά com acusativo indica causa. A expressão é clara e preserva “nome” como referência à pessoa, autoridade e identificação com Jesus.
- source_word: ὁ δὲ ὑπομείνας
  choice: Mas quem perseverar
  rationale: O particípio aoristo substantivado descreve aquele que permanece firme sob pressão. “Perseverar” é natural em português e comunica bem essa continuidade sem impor uma formulação doutrinária técnica.
- source_word: εἰς τέλος
  choice: até o fim
  rationale: Expressa continuidade até um ponto final, preservando a abertura contextual quanto a qual fim está em vista.
- source_word: οὗτος
  choice: incorporado na construção “quem... será”
  rationale: O pronome resumptivo enfatiza o sujeito no grego, mas sua tradução explícita como “esse” produziria uma construção marcada e menos natural em português. A estrutura “quem... será” conserva adequadamente o foco.
- source_word: σωθήσεται
  choice: será salvo
  rationale: σῴζω pode indicar livramento ou salvação em sentido mais amplo. “Será salvo” preserva o peso teológico e a amplitude sem restringir o sentido.
theological_decisions:
- issue: Sentido de σωθήσεται na declaração sobre perseverança
  choice: será salvo
  alternative: será libertado / será resgatado
  rationale: A tradução mantém a amplitude do verbo grego entre livramento e salvação plena, sem reduzi-lo a uma libertação meramente temporal nem vinculá-lo a uma doutrina denominacional específica.
- issue: Alcance de πάντων
  choice: por todos
  alternative: por todos eles / por toda gente
  rationale: Conserva a universalidade retórica da afirmação e deixa que o contexto determine seu alcance, sem suavizá-la ou torná-la matematicamente explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção resumptiva grega foi suavizada para um português natural. Os marcadores aparecem no fim da frase a que se referem.
