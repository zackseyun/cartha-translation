id: MRK.13.14
reference: Mark 13:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως ⸀ἑστηκότα ὅπου οὐ δεῖ, ὁ ἀναγινώσκων νοείτω, τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/014.yaml
  text: But when you see the abomination of desolation standing where it ought not to be (let the reader understand)[a], then let those in Judea flee to the mountains[b],
translation:
  language: pt
  text: Mas, quando vocês virem a abominação da desolação em pé onde não deve estar (quem lê, entenda)[a], então os que estiverem na Judeia fujam para os montes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O particípio grego traduzido por “em pé” está no masculino, embora “abominação” seja uma palavra neutra em grego; isso pode sugerir uma pessoa por trás da expressão. Assim, também se pode entender: “de pé onde ele não deve estar”.'
    reason: alternative_reading
  - marker: b
    text: A expressão “abominação da desolação” retoma a linguagem de Daniel (ver Dn 9:27; 11:31; 12:11).
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Mas, quando
  rationale: Ὅταν introduz uma circunstância temporal contingente, e δέ funciona como conexão leve; “Mas, quando” mantém a progressão e uma discreta mudança de foco.
- source_word: ἴδητε
  choice: vocês virem
  rationale: O aoristo do subjuntivo de ὁράω, após “quando”, é expresso naturalmente em português pelo futuro do subjuntivo.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: a abominação da desolação
  rationale: Preserva de modo próximo a expressão apocalíptica e sua forte ressonância em Daniel, sem definir se se trata de objeto, ato ou pessoa.
- source_word: ἑστηκότα
  choice: em pé
  rationale: O particípio perfeito de ἵστημι descreve o estado presente decorrente de ter sido colocado ou se estabelecido; “em pé” conserva a imagem sem acrescentar a interpretação “instalada”.
- source_word: ὅπου οὐ δεῖ
  choice: onde não deve estar
  rationale: δεῖ expressa necessidade ou adequação. A formulação portuguesa é natural e não explicita no texto principal o gênero do referente, preservando a ambiguidade do grego.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: quem lê, entenda
  rationale: Reproduz com concisão a exortação parentética e mantém a força imperativa de νοείτω.
- source_word: τότε
  choice: então
  rationale: Marca a ação consequente que deve ocorrer diante do sinal mencionado.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: os que estiverem na Judeia
  rationale: Expressa naturalmente a localização indicada pela frase substantivada e combina com a situação futura introduzida por “quando”.
- source_word: φευγέτωσαν
  choice: fujam
  rationale: O presente imperativo da terceira pessoa do plural comunica uma ordem urgente; “fujam” é direto e idiomático.
- source_word: εἰς τὰ ὄρη
  choice: para os montes
  rationale: ὄρη pode designar montes ou montanhas; “montes” é corrente no registro bíblico em português e adequado à topografia sem exagerar a elevação.
theological_decisions:
- issue: Interpretação da expressão daniélica βδέλυγμα τῆς ἐρημώσεως
  choice: Manter “a abominação da desolação” sem identificar seu referente histórico.
  alternative: “o sacrilégio devastador” ou “a abominação que causa desolação”
  rationale: A expressão pode apontar para um objeto, ato ou agente sacrílego. A tradução conserva sua força alusiva e a tensão interpretativa em vez de resolver a questão.
- issue: Particípio masculino ἑστηκότα relacionado ao substantivo neutro βδέλυγμα
  choice: Usar “onde não deve estar”, formulação sem marca de gênero explícita em português, e registrar em nota a possível referência pessoal.
  alternative: “onde ele não deve estar”
  rationale: A forma masculina pode sugerir uma pessoa por trás da expressão neutra ou uma personificação. Como a construção é genuinamente ambígua, o texto principal permanece fluente e a nota preserva a possibilidade pessoal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” torna explícito o plural de ἴδητε; “quem lê, entenda” preserva a concisão solene da advertência. A formulação “onde não deve estar” evita impor gênero ao referente no texto principal.
