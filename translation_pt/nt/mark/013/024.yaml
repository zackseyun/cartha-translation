source:
  edition: SBLGNT
  text: Ἀλλὰ ἐν ἐκείναις ταῖς ἡμέραις μετὰ τὴν θλῖψιν ἐκείνην ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/024.yaml
  text: But in those days[a], after that tribulation, the sun will be darkened, and the moon will not give its light,
translation:
  language: pt
  text: Mas, naqueles dias, depois daquela tribulação[a], o sol escurecerá, e a lua não dará a sua luz,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aflição” ou “angústia”.'
    reason: Alternativas lexicais legítimas para θλῖψις, cujo sentido inclui pressão, sofrimento e grave aflição.
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Mas
  rationale: Marca o forte contraste ou a transição em relação ao que vem antes, de modo conciso e natural em português.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: naqueles dias
  rationale: Reproduz a expressão temporal e conserva seu tom escatológico sem explicitação indevida.
- source_word: μετὰ τὴν θλῖψιν ἐκείνην
  choice: depois daquela tribulação
  rationale: μετά com acusativo tem sentido temporal, e “tribulação” preserva a intensidade e as ressonâncias apocalípticas de θλῖψις; “daquela” mantém a referência específica do demonstrativo.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: o sol escurecerá
  rationale: Expressa com naturalidade o futuro passivo grego em português; o verbo “escurecer” pode ter valor intransitivo ou passivo sem exigir uma construção pesada.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: a lua não dará a sua luz
  rationale: Mantém a imagem vívida de “dar” e traduz φέγγος de forma direta e compreensível como “luz”.
theological_decisions:
- issue: Sentido de θλῖψις no discurso apocalíptico
  choice: tribulação
  alternative: aflição; angústia
  rationale: “Tribulação” conserva o peso do termo e sua ressonância no contexto imediato, sem definir por si só um esquema escatológico específico; as alternativas lexicais legítimas são registradas em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação preserva a estrutura temporal, a imagem cósmica e a tensão escatológica do grego.
