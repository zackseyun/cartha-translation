id: MRK.13.8
reference: Mark 13:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, ⸀ἔσονται σεισμοὶ κατὰ τόπους, ⸁ἔσονται ⸀λιμοί· ⸀ἀρχὴ ὠδίνων ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/008.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom. There will be earthquakes in various places; there will be famines. These are the beginning of birth pains.
translation:
  language: pt
  text: Pois nação se levantará contra nação, e reino contra reino. Haverá terremotos em vários lugares; haverá fomes. Essas coisas são o princípio das dores de parto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dores do trabalho de parto”. A expressão grega retrata as dores associadas ao parto e as usa como metáfora dos sofrimentos que precedem o que virá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: se levantará
  rationale: O futuro passivo de ἐγείρω tem aqui sentido idiomático de insurgir-se ou entrar em conflito; a forma pronominal é natural em português e preserva esse sentido.
- source_word: ἔθνος ... ἐπ’ ἔθνος
  choice: nação ... contra nação
  rationale: No paralelismo com βασιλεία, ἔθνος aponta naturalmente para povos ou nações em conflito; esta formulação conserva o caráter geopolítico e a construção enfática.
- source_word: βασιλεία ... ἐπὶ βασιλείαν
  choice: reino contra reino
  rationale: βασιλεία designa aqui um domínio político; “reino” preserva o paralelismo com “nação”.
- source_word: σεισμοὶ
  choice: terremotos
  rationale: É o equivalente português claro e comum para abalos sísmicos neste contexto.
- source_word: κατὰ τόπους
  choice: em vários lugares
  rationale: Expressa naturalmente a força distributiva de κατά com o plural τόπους.
- source_word: λιμοί
  choice: fomes
  rationale: λιμός denota fome coletiva ou escassez extrema, não apenas fome individual; o plural “fomes” é conciso e tradicionalmente inteligível.
- source_word: ἀρχὴ
  choice: o princípio
  rationale: Embora anartro no grego, funciona predicativamente; o artigo em português é idiomático e indica o início, não a totalidade, do processo.
- source_word: ὠδίνων
  choice: das dores de parto
  rationale: Preserva a imagem concreta dos sofrimentos do parto e sua força metafórica, em linguagem atual e clara.
- source_word: ταῦτα
  choice: Essas coisas são
  rationale: Retoma explicitamente os acontecimentos mencionados e evita uma concordância pouco natural em português diante do verbo grego no singular.
theological_decisions:
- issue: Metáfora apocalíptica em ἀρχὴ ὠδίνων
  choice: “o princípio das dores de parto”, apresentando esses acontecimentos como sofrimentos iniciais que precedem o que virá
  alternative: Reduzir a expressão a “o começo dos sofrimentos” ou especificar um esquema escatológico particular
  rationale: A tradução mantém a metáfora e sua tensão temporal sem explicar além do texto nem vinculá-la a um sistema escatológico denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o paralelismo do grego e a metáfora do parto. O marcador foi colocado após a expressão à qual a nota efetivamente se refere.
