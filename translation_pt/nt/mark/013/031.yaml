  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ ⸀μὴ ⸁παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/031.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: pt
  text: O céu e a terra passarão, mas as minhas palavras jamais passarão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «de modo nenhum passarão» ou «certamente não passarão». O grego emprega uma negação enfática.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: o céu
  rationale: No par cósmico com «a terra», οὐρανός designa o céu como parte da ordem criada, e não apenas o céu visível.
- source_word: ἡ γῆ
  choice: a terra
  rationale: No binômio estabelecido «o céu e a terra», γῆ se refere à terra ou ao mundo, não a uma região específica.
- source_word: παρελεύσονται
  choice: passarão
  rationale: παρέρχομαι aqui comunica deixar de existir ou chegar ao fim; «passarão» preserva a formulação concisa e a força escatológica sem explicar indevidamente o modo.
- source_word: δὲ
  choice: mas
  rationale: δέ estabelece contraste entre a transitoriedade do céu e da terra e a permanência das palavras de Jesus.
- source_word: οἱ λόγοι μου
  choice: as minhas palavras
  rationale: λόγοι se refere às declarações ou palavras proferidas por Jesus; esta tradução é direta, natural e mantém o plural.
- source_word: οὐ μὴ παρελεύσονται
  choice: jamais passarão
  rationale: A construção οὐ μή com o futuro expressa negação enfática. «Jamais passarão» torna essa força clara em português atual e digno.
theological_decisions:
- issue: Força da negação enfática a respeito das palavras de Jesus
  choice: jamais passarão
  alternative: de modo nenhum passarão; certamente não passarão
  rationale: A tradução explicita a forte negação grega e preserva o contraste entre a transitoriedade da ordem criada e a permanência das palavras de Jesus, sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção paralela e a repetição de «passarão» conservam a concisão e o contraste do grego.
