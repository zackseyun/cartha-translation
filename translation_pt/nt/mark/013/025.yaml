source:
  edition: SBLGNT
  text: καὶ οἱ ἀστέρες ⸂ἔσονται ἐκ τοῦ οὐρανοῦ πίπτοντες⸃, καὶ αἱ δυνάμεις αἱ ἐν τοῖς οὐρανοῖς σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/025.yaml
  text: And the stars will be falling from heaven[b][a], and the powers in the heavens will be shaken.
translation:
  language: pt
  text: E as estrelas estarão caindo do céu[a], e os poderes que estão nos céus serão abalados.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «do céu visível». O grego οὐρανός pode designar tanto o céu como domínio celestial quanto o céu visível.
    reason: lexical_alternative
  - marker: b
    text: «Os poderes que estão nos céus» pode referir-se a poderes celestes, forças cósmicas ou estruturas dos céus; o grego não é mais específico.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστέρες
  choice: estrelas
  rationale: É o sentido comum e direto do termo no contexto cósmico e apocalíptico.
- source_word: ἔσονται ... πίπτοντες
  choice: estarão caindo
  rationale: Reproduz de modo natural em português a construção perifrástica futura e preserva seu aspecto vívido ou contínuo, em vez de reduzi-la ao simples «cairão».
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: do céu
  rationale: «Céu» conserva o registro cósmico elevado e, em português, também pode designar o céu visível; a nota registra essa amplitude lexical.
- source_word: δυνάμεις
  choice: poderes
  rationale: Mantém a amplitude do grego, que pode apontar para poderes celestes, forças cósmicas ou estruturas dos céus, sem impor uma identificação específica.
- source_word: αἱ ἐν τοῖς οὐρανοῖς
  choice: que estão nos céus
  rationale: Reflete a construção atributiva e o plural grego, mantendo o alcance cósmico da expressão.
- source_word: σαλευθήσονται
  choice: serão abalados
  rationale: Tradução direta e idiomática do futuro passivo, apropriada ao contexto escatológico.
theological_decisions:
- issue: Sentido de «os poderes que estão nos céus»
  choice: Formulação genérica, sem identificar os poderes como seres angelicais, astros ou forças cósmicas.
  alternative: «os poderes celestes» ou «as forças dos céus»
  rationale: A expressão grega é ampla e o contexto apocalíptico não elimina sua ambiguidade; a tradução não deve resolver aquilo que o texto deixa em aberto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem coordenada do grego foi preservada. «Estarão caindo» mantém o aspecto perifrástico, e «nos céus» conserva o plural do original sem tornar a frase excessivamente técnica.
