id: MRK.13.19
reference: Mark 13:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔσονται γὰρ αἱ ἡμέραι ἐκεῖναι θλῖψις οἵα οὐ γέγονεν τοιαύτη ἀπ’ ἀρχῆς κτίσεως ⸀ἣν ἔκτισεν ὁ θεὸς ἕως τοῦ νῦν καὶ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/019.yaml
  text: For those days will be a tribulation such as has not been from the beginning of the creation that God created until now[a], and never will be.
translation:
  language: pt
  text: Pois aqueles dias serão uma tribulação como nunca houve desde o princípio da criação que Deus criou até agora[a], e nunca mais haverá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma tribulação como não houve desde o princípio da criação que Deus criou até agora, e nunca haverá”.'
    reason: Alternativa mais formal, que preserva separadamente as duas negações do grego e evita tornar “mais” explícito na última oração.
lexical_decisions:
- source_word: θλῖψις
  choice: tribulação
  rationale: No discurso escatológico, designa aflição extrema; “tribulação” conserva a gravidade e a ressonância apocalíptica, permanecendo compreensível em português.
- source_word: οἵα οὐ γέγονεν τοιαύτη
  choice: como nunca houve
  rationale: Reproduz de modo natural a comparação enfática e a singularidade dessa tribulação, sem a redundância pouco idiomática do grego.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: desde o princípio da criação
  rationale: Mantém explicitamente κτίσεως e introduz naturalmente a oração relativa seguinte.
- source_word: ἣν ἔκτισεν ὁ θεὸς
  choice: que Deus criou
  rationale: Preserva a formulação enfática do original e identifica Deus como o Criador, sem substituí-la pela expressão mais genérica “do mundo”.
- source_word: ἕως τοῦ νῦν
  choice: até agora
  rationale: Equivalente temporal direto, corrente e preciso em português.
- source_word: οὐ μὴ γένηται
  choice: nunca mais haverá
  rationale: Expressa a negação futura enfática de οὐ μή e retoma naturalmente o verbo existencial usado antes; “mais” comunica que algo semelhante não voltará a ocorrer.
- source_word: ἔσονται ... αἱ ἡμέραι ἐκεῖναι θλῖψις
  choice: aqueles dias serão uma tribulação
  rationale: Conserva a construção predicativa comprimida do grego, apresentando aqueles dias como o próprio período de tribulação.
theological_decisions:
- issue: Alcance da linguagem da criação
  choice: “desde o princípio da criação que Deus criou”
  alternative: “desde o princípio do mundo”
  rationale: κτίσις e κτίζω aparecem explicitamente, com Deus como sujeito. A redação preserva o alcance criacional sem restringi-lo a um começo local, histórico ou pactual.
- issue: Caráter incomparável da tribulação
  choice: “como nunca houve... e nunca mais haverá”
  alternative: Entender a comparação como mera hipérbole local ou vinculá-la a um esquema escatológico específico
  rationale: A tradução mantém a força temporal e enfática da declaração sem decidir sua relação com qualquer sistema escatológico denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “criação que Deus criou” é intencional, pois reflete a formulação do grego. O marcador [a] aparece no texto principal.
