source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ⸂ἐκολόβωσεν κύριος⸃ τὰς ἡμέρας, οὐκ ἂν ἐσώθη πᾶσα σάρξ. ἀλλὰ διὰ τοὺς ἐκλεκτοὺς οὓς ἐξελέξατο ἐκολόβωσεν τὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/020.yaml
  text: And if the Lord had not cut short the days[a], no flesh would have been saved. But for the sake of the elect, whom he chose, he cut short the days.
translation:
  language: pt
  text: E, se o Senhor não tivesse abreviado aqueles dias, ninguém teria sido salvo.[a] Mas, por causa dos eleitos, a quem escolheu, ele abreviou aqueles dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “nenhuma carne teria sido salva”; isto é, nenhum ser humano sobreviveria.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολόβωσεν
  choice: abreviado / abreviou
  rationale: O verbo κολοβόω significa encurtar ou abreviar. Em português, «abreviar aqueles dias» é natural, mantém a força temporal da expressão e permite traduzir as duas ocorrências de modo consistente.
- source_word: κύριος
  choice: o Senhor
  rationale: Traduz o referente definido expresso por κύριος de maneira convencional, clara e digna.
- source_word: τὰς ἡμέρας
  choice: aqueles dias
  rationale: O demonstrativo torna natural em português a referência aos dias de aflição mencionados no contexto, sem definir além do que o texto permite.
- source_word: οὐκ ἂν ἐσώθη
  choice: ninguém seria salvo
  rationale: A construção com ἄν exprime um resultado hipotético contrário ao fato. «Seria salvo» preserva o valor lexical de σῴζω e, no contexto, pode designar a preservação da vida.
- source_word: πᾶσα σάρξ
  choice: ninguém
  rationale: Literalmente, a expressão é «toda carne», mas sob a negação significa idiomaticamente que nenhum ser humano seria salvo. «Ninguém» comunica esse sentido com clareza no português atual; a forma literal é preservada em nota.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: por causa dos eleitos
  rationale: διά com acusativo indica aqui motivo ou consideração em favor deles. «Por causa dos eleitos» é corrente e não impõe uma explicação doutrinária adicional.
- source_word: ἐκλεκτούς
  choice: eleitos
  rationale: «Eleitos» preserva o termo bíblico e sua densidade teológica, sem decidir debates sobre a natureza individual ou coletiva da eleição.
- source_word: οὓς ἐξελέξατο
  choice: a quem escolheu
  rationale: Traduz transparentemente a oração relativa e evita a repetição pouco natural de «eleitos, a quem elegeu».
theological_decisions:
- issue: Sentido de «salvo» no contexto
  choice: Manter «salvo», entendendo que o sentido imediato é a preservação da vida humana durante a aflição.
  alternative: Traduzir «sobreviveria» ou interpretar como referência exclusiva à salvação espiritual.
  rationale: O contexto imediato trata da morte durante dias calamitosos. Ainda assim, «salvo» preserva a amplitude lexical de σῴζω sem transformar o versículo numa afirmação específica sobre salvação eterna.
- issue: Referente dos «eleitos»
  choice: Conservar «os eleitos» sem especificar a natureza da eleição.
  alternative: Explicitar uma eleição corporativa ou uma predestinação individual.
  rationale: O versículo identifica pessoas escolhidas por Deus, mas não resolve aqui debates teológicos mais amplos. A tradução preserva essa tensão.
- issue: Sujeito implícito de ἐξελέξατο e da segunda ocorrência de ἐκολόβωσεν
  choice: Preservar em português o pronome implícito «ele», cujo referente contextual é «o Senhor».
  alternative: Repetir «o Senhor» ou explicitar «Deus».
  rationale: O grego deixa o sujeito implícito após mencionar κύριος. «Ele» mantém a coesão sem acrescentar identificação além do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. «Eleitos» mantém o vocabulário bíblico tradicional; «ninguém» evita uma expressão literal opaca, enquanto a nota registra «nenhuma carne».
