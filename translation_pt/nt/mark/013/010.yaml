  text: καὶ εἰς πάντα τὰ ἔθνη ⸂πρῶτον δεῖ⸃ κηρυχθῆναι τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/010.yaml
  text: And the good news must first be proclaimed to all the nations[a][b].
translation:
  language: pt
  text: E é necessário que primeiro as boas-novas[a] sejam proclamadas a todas as nações[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o evangelho”. O termo grego εὐαγγέλιον significa literalmente “boa notícia”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “entre todas as nações”; em alguns contextos, o termo grego ἔθνη também pode significar “gentios”.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a conexão com o discurso anterior sem introduzir contraste inexistente.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: a todas as nações
  rationale: Expressa a direção e a abrangência universal da proclamação; preserva o sentido étnico-nacional sem restringir ἔθνη a não judeus.
- source_word: πρῶτον
  choice: primeiro
  rationale: Conserva de modo conciso a prioridade temporal indicada pelo advérbio.
- source_word: δεῖ
  choice: é necessário que
  rationale: Transmite a necessidade forte expressa por δεῖ com naturalidade em português, sem explicitar como divina uma necessidade cuja origem não é declarada no versículo.
- source_word: κηρυχθῆναι
  choice: sejam proclamadas
  rationale: O infinitivo aoristo passivo indica proclamação pública; a construção passiva preserva a forma do grego e é idiomática em português.
- source_word: τὸ εὐαγγέλιον
  choice: as boas-novas
  rationale: Comunica diretamente o sentido de εὐαγγέλιον em linguagem moderna e inteligível; a concordância no plural segue a forma portuguesa consagrada 'boas-novas', embora o termo grego seja singular.
theological_decisions:
- issue: Alcance de ἔθνη
  choice: todas as nações
  alternative: todos os gentios
  rationale: A escolha preserva a abrangência global mais provável no contexto escatológico e evita impor uma oposição específica entre judeus e gentios; a possibilidade lexical alternativa é registrada em nota.
- issue: Força de δεῖ
  choice: é necessário que
  alternative: deve
  rationale: Preserva a ideia de necessidade, possivelmente relacionada ao propósito divino na narrativa de Marcos, sem explicitar essa origem além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Boas-novas” mantém transparência semântica e “sejam proclamadas” conserva o caráter público e passivo da expressão grega.
