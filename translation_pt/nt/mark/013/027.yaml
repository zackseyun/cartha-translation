id: MRK.13.27
reference: Mark 13:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τότε ἀποστελεῖ τοὺς ⸀ἀγγέλους καὶ ἐπισυνάξει τοὺς ⸀ἐκλεκτοὺς ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/027.yaml
  text: And then he will send out the angels and gather the chosen ones from the four winds[c][b][a], from the end of the earth to the end of heaven.
translation:
  language: pt
  text: E então ele enviará os anjos e reunirá os escolhidos[a] dos quatro ventos[b], desde a extremidade da terra até a extremidade do céu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, numa formulação mais tradicional, “os eleitos”.
    reason: lexical_alternative
  - marker: b
    text: “Dos quatro ventos” é uma expressão que significa “de todas as direções”.
    reason: cultural_note
  - marker: c
    text: A frase final também pode ser expressa de modo mais interpretativo como “desde o ponto mais distante da terra até o ponto mais distante do céu”; algumas traduções dizem “de uma extremidade do céu à outra”.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: então
  rationale: Advérbio temporal que marca a sequência no discurso escatológico; “então” é natural e preciso em português.
- source_word: ἀποστελεῖ
  choice: enviará
  rationale: O futuro de ἀποστέλλω indica que ele enviará agentes para cumprir uma missão. “Enviará” comunica isso com clareza sem acrescentar uma ideia ausente do texto.
- source_word: ἀγγέλους
  choice: os anjos
  rationale: Neste contexto apocalíptico, o referente mais provável são seres celestiais, e não mensageiros humanos.
- source_word: ἐπισυνάξει
  choice: reunirá
  rationale: Traduz de modo natural o ato de ajuntar pessoas dispersas, sem a redundância de “reunirá juntos”.
- source_word: ἐκλεκτούς
  choice: os escolhidos
  rationale: O adjetivo substantivado designa aqueles que foram escolhidos. “Os escolhidos” é claro para leitores atuais e evita transformar o termo em jargão teológico técnico.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: dos quatro ventos
  rationale: Conserva a imagem bíblica das quatro direções e, no contexto, indica procedência de todas as partes.
- source_word: ἀπ’ ἄκρου γῆς
  choice: desde a extremidade da terra
  rationale: ἄκρον indica limite ou ponto extremo. “Extremidade” preserva a imagem espacial e prepara o paralelismo da frase seguinte.
- source_word: ἕως ἄκρου οὐρανοῦ
  choice: até a extremidade do céu
  rationale: Mantém o paralelismo e a abrangência cósmica da formulação grega. “Céu” preserva a ambiguidade de οὐρανός entre a extensão celeste e o céu em sentido religioso.
- source_word: καὶ τότε ... καὶ
  choice: E então ... e
  rationale: Conserva as duas conjunções e o fluxo coordenado característico da narrativa de Marcos.
theological_decisions:
- issue: Sentido de ἐκλεκτούς no contexto escatológico
  choice: os escolhidos
  alternative: os eleitos
  rationale: A tradução mantém a ideia de escolha divina sem fazer do termo, por si só, uma afirmação de um sistema doutrinário posterior. A alternativa tradicional continua lexicalmente possível.
- issue: Alcance da reunião descrita
  choice: dos quatro ventos, desde a extremidade da terra até a extremidade do céu
  alternative: de todas as direções, de uma ponta do mundo à outra
  rationale: A formulação escolhida preserva tanto a imagem dos ventos quanto a expressão abrangente e incomum que une terra e céu, sem reduzi-la a uma paráfrase interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. Preserva-se o encadeamento de Marcos, a imagem dos quatro ventos e a formulação cósmica incomum do original, explicando alternativas apenas em notas.
