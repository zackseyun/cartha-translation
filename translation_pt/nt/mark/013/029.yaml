source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ⸂ἴδητε ταῦτα⸃ γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/029.yaml
  text: So also you[a], when you see these things happening, know that it is near, at the doors.
translation:
  language: pt
  text: Assim também vocês, quando virem essas coisas acontecendo, saibam que está perto, às portas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele está perto”. O grego não declara explicitamente o sujeito.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Assim também vocês
  rationale: “Assim” liga a afirmação à comparação da figueira, e “também vocês” mantém a correspondência enfática com os observadores da comparação.
- source_word: ὅταν ἴδητε
  choice: quando virem
  rationale: ὅταν com o subjuntivo aoristo expressa uma contingência futura; “quando virem” é natural e exato em português.
- source_word: ταῦτα γινόμενα
  choice: essas coisas acontecendo
  rationale: Mantém o plural de ταῦτα e traduz γινόμενα de modo claro e corrente, como eventos que estão se realizando.
- source_word: γινώσκετε
  choice: saibam
  rationale: O imperativo pede que os discípulos reconheçam a conclusão indicada pelos sinais; “saibam” preserva diretamente essa força.
- source_word: ὅτι ἐγγύς ἐστιν
  choice: que está perto
  rationale: O grego não expressa o sujeito. O português permite omiti-lo, preservando melhor a ambiguidade entre um referente pessoal e um acontecimento ou cumprimento próximo.
- source_word: ἐπὶ θύραις
  choice: às portas
  rationale: Conserva o plural θύραις e emprega uma expressão portuguesa compreensível para a proximidade extrema.
theological_decisions:
- issue: Sujeito implícito de ἐστιν (“está perto”)
  choice: Manter o sujeito sem expressão em “está perto”.
  alternative: Explicitar “ele está perto” ou “isso está perto”.
  rationale: Como o grego não declara o sujeito e o português admite sujeito oculto, a tradução pode preservar a ambiguidade genuína sem decidir se o referente é o Filho do Homem ou a culminação anunciada. A nota registra a alternativa pessoal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a sequência do argumento e a ambiguidade sintática do original; “às portas” mantém a imagem plural grega.
