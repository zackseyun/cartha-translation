id: MRK.13.6
reference: Mark 13:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀πολλοὶ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες ὅτι Ἐγώ εἰμι, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/006.yaml
  text: Many will come in my name[a], saying, ‘I am he,’ and they will lead many astray.
translation:
  language: pt
  text: 'Muitos virão em meu nome, dizendo: “Sou eu”[a], e enganarão a muitos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “Eu sou”. O grego não traz um predicativo explícito.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Muitos
  rationale: O adjetivo substantivado refere-se de modo indefinido a numerosas pessoas; “Muitos” é conciso e natural.
- source_word: ἐλεύσονται
  choice: virão
  rationale: O futuro de ἔρχομαι é expresso diretamente por “virão”, adequado ao contexto de pessoas que se apresentarão.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: em meu nome
  rationale: A expressão pode indicar reivindicação de autoridade ou associação com o nome de Jesus; “em meu nome” preserva o idioma bíblico sem restringir indevidamente o sentido.
- source_word: λέγοντες
  choice: dizendo
  rationale: Mantém o valor direto do particípio, que acompanha e esclarece como essas pessoas virão.
- source_word: ὅτι Ἐγώ εἰμι
  choice: Sou eu
  rationale: Em português, “Sou eu” preserva a ausência de predicativo explícito no grego e soa natural como reivindicação de identidade, sem acrescentar “o Cristo” ou outro título.
- source_word: πολλοὺς
  choice: a muitos
  rationale: Representa de maneira concisa o adjetivo substantivado no acusativo e mantém a correspondência com “Muitos” no início do versículo.
- source_word: πλανήσουσιν
  choice: enganarão
  rationale: Neste contexto de falsos pretendentes, πλανάω designa levar pessoas ao erro; “enganarão” é claro, atual e natural em português.
theological_decisions:
- issue: Sentido de Ἐγώ εἰμι na fala dos falsos pretendentes
  choice: Sou eu
  alternative: Eu sou
  rationale: “Sou eu” comunica naturalmente uma reivindicação de identidade no contexto, mas não especifica qual título está implícito. A forma mais literal “Eu sou” é mantida em nota para preservar a estrutura aberta do grego e sua possível tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “em meu nome” conserva a formulação tradicional e semanticamente aberta; “enganarão” evita uma expressão excessivamente literal como “desviarão” e comunica com clareza o efeito de πλανάω.
