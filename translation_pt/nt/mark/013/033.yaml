  text: βλέπετε ⸀ἀγρυπνεῖτε, οὐκ οἴδατε γὰρ πότε ὁ καιρός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/033.yaml
  text: Be on guard; stay awake[a], for you do not know when the time is.
translation:
  language: pt
  text: Fiquem atentos; mantenham-se despertos, pois vocês não sabem quando será o momento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o tempo”, “o tempo determinado” ou “a ocasião”. O termo grego pode indicar um tempo decisivo, apropriado ou determinado.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: Fiquem atentos
  rationale: O imperativo é usado aqui como advertência para estar alerta, não no sentido meramente visual. A formulação distingue esta ordem da metáfora de permanecer desperto que vem em seguida.
- source_word: ἀγρυπνεῖτε
  choice: mantenham-se despertos
  rationale: Preserva a imagem de não dormir e, ao mesmo tempo, comunica vigilância contínua em português natural.
- source_word: οὐκ οἴδατε
  choice: vocês não sabem
  rationale: Traduz diretamente a negação do verbo de conhecimento, sem acrescentar a ideia de incerteza relativa.
- source_word: γὰρ
  choice: pois
  rationale: Introduz de modo conciso e natural a razão das duas ordens anteriores.
- source_word: πότε
  choice: quando
  rationale: Equivalente português direto e idiomático do advérbio interrogativo temporal.
- source_word: ὁ καιρός
  choice: o tempo determinado
  rationale: καιρός pode indicar um momento decisivo ou apropriado, não simplesmente tempo em sentido abstrato. 'Tempo determinado' torna perceptível essa nuance sem especificar quem o determinou.
- source_word: ἐστιν
  choice: será
  rationale: Embora o grego use literalmente o presente 'é', em português a pergunta implícita sobre a ocorrência futura desse momento é expressa naturalmente por 'será'.
theological_decisions:
- issue: Nuance escatológica de καιρός
  choice: o tempo determinado
  alternative: o tempo; o momento; a ocasião
  rationale: No discurso escatológico, o termo pode apontar para um momento decisivo ou estabelecido. A tradução conserva essa força, mas evita explicitar 'por Deus', algo que o substantivo isolado não declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas no plural dirigidas aos discípulos. 'Mantenham-se despertos' conserva a metáfora e evita repetir simplesmente 'fiquem atentos'.
