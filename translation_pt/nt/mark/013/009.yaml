review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a advertência, a entrega a instâncias judiciais, os espancamentos nas sinagogas, a apresentação perante autoridades e a finalidade de testemunho. Contudo, «tenham cuidado consigo mesmos» soa como autocuidado e não reproduz com naturalidade a vigilância imperativa de βλέπετε ἑαυτούς. «Comparecerão» também atenua a voz passiva de σταθήσεσθε, que no contexto sugere serem postos perante autoridades.
  naturalness: A redação é globalmente clara, mas «Mas vocês, tenham cuidado consigo mesmos» é pouco idiomática neste sentido em português moderno. Uma formulação com «mantenham-se vigilantes» é mais natural e conserva a ênfase reflexiva. A ligação das ações melhora com coordenação explícita.
  terminology: «Tribunais» comunica mais claramente a função judicial de συνέδρια no português atual do que «conselhos», sem identificar indevidamente esses organismos com o Sinédrio de Jerusalém. «Sinagogas», «governadores», «reis» e «testemunho» são adequados. A nota preserva corretamente a possível nuance adversativa de αὐτοῖς.
  issues:
  - severity: medium
    issue: A expressão «tenham cuidado consigo mesmos» é semanticamente e idiomaticamente inadequada neste contexto.
    rationale: Em português, a expressão tende a significar cuidar do próprio bem-estar. O grego βλέπετε ... ἑαυτούς exige alerta/vigilância dos próprios discípulos diante do perigo.
  - severity: low
    issue: «Comparecerão diante de governadores e reis» não explicita a passividade de σταθήσεσθε.
    rationale: Embora seja uma interpretação possível no contexto jurídico, «serão levados à presença» conserva melhor a apresentação imposta sugerida pelo futuro passivo.
  - severity: low
    issue: «Conselhos» pode ser entendido como órgãos meramente consultivos.
    rationale: No contexto de entrega e punição, συνέδρια designa instâncias deliberativas/judiciais; «tribunais» é mais imediatamente compreensível e não sobre-especifica.
  revised_text: Mas vocês, mantenham-se vigilantes. Eles os entregarão aos tribunais, e vocês serão espancados nas sinagogas; serão levados à presença de governadores e reis por minha causa, para lhes dar testemunho.[a]
