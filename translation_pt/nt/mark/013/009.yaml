revisions:
- from: Mas vocês, tenham cuidado consigo mesmos. Eles os entregarão aos conselhos, vocês serão espancados nas sinagogas e comparecerão diante de governadores e reis por minha causa, para lhes servir de testemunho.[a]
  to: Mas vocês, mantenham-se vigilantes. Eles os entregarão aos tribunais, e vocês serão espancados nas sinagogas; serão levados à presença de governadores e reis por minha causa, para lhes dar testemunho.[a]
  rationale: A revisão substitui uma expressão portuguesa que sugere autocuidado por uma advertência de vigilância, preservando a ênfase dirigida aos próprios discípulos. Também torna explícita a apresentação passiva perante autoridades e esclarece a natureza judicial de συνέδρια. Mantém-se aberta, na nota, a questão de o testemunho ser dirigido às autoridades ou poder ter força acusatória contra elas.
