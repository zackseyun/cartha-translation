  text: βλέπετε δὲ ὑμεῖς ἑαυτούς· ⸀παραδώσουσιν ὑμᾶς εἰς συνέδρια καὶ εἰς συναγωγὰς δαρήσεσθε καὶ ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/009.yaml
  text: But watch yourselves. They will hand you over to councils[a], and you will be beaten in synagogues, and you will stand before governors and kings because of me, as a testimony to them.
translation:
  language: pt
  text: Mas vocês, mantenham-se vigilantes. Eles os entregarão aos tribunais, e vocês serão espancados nas sinagogas; serão levados à presença de governadores e reis por minha causa, para lhes dar testemunho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «como testemunho para eles»; a expressão também pode ter o sentido de «como testemunho contra eles».
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε δὲ ὑμεῖς ἑαυτούς
  choice: Mas vocês, tenham cuidado consigo mesmos
  rationale: O imperativo presente transmite vigilância contínua, e a formulação conserva tanto a ênfase do pronome explícito quanto o sentido reflexivo, em português atual.
- source_word: παραδώσουσιν
  choice: entregarão
  rationale: No contexto de perseguição judicial, indica que os discípulos serão entregues às autoridades; a escolha é clara e não acrescenta necessariamente a ideia de traição.
- source_word: συνέδρια
  choice: conselhos
  rationale: O plural aponta para conselhos locais com funções governativas ou judiciais, e não necessariamente apenas para o Sinédrio de Jerusalém.
- source_word: συναγωγάς
  choice: sinagogas
  rationale: Mantém a designação usual dos locais e instituições judaicas em que poderiam ocorrer medidas disciplinares.
- source_word: δαρήσεσθε
  choice: serão espancados
  rationale: Expressa diretamente o futuro passivo e a violência física sem especificar indevidamente o instrumento ou a forma do castigo.
- source_word: ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε
  choice: comparecerão diante de governadores e reis
  rationale: Comunica uma apresentação formal perante autoridades e preserva a distinção entre governadores e reis, com fluência natural em português.
- source_word: ἕνεκεν ἐμοῦ
  choice: por minha causa
  rationale: 'Mantém claramente o sentido causal: a ligação dos discípulos com Jesus será o motivo da perseguição.'
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: para lhes servir de testemunho
  rationale: Preserva a ideia de que essas aparições se tornam ocasião de testemunho dirigido às autoridades, sem impor no texto principal um sentido exclusivamente condenatório.
theological_decisions:
- issue: Sentido de εἰς μαρτύριον αὐτοῖς
  choice: As aparições forçadas dos discípulos diante das autoridades servirão de testemunho para elas.
  alternative: O testemunho funcionará contra essas autoridades, em sentido acusatório ou condenatório.
  rationale: A expressão admite uma orientação às autoridades e, conforme o contexto, pode adquirir força adversativa. O texto principal mantém o sentido mais amplo, enquanto a nota registra a possibilidade de testemunho contra elas.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A repetição de «vocês» e o reflexivo conservam a ênfase do grego; «conselhos» evita restringir o plural ao Sinédrio de Jerusalém.
