reference: Mark 13:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς ἄνθρωπος ἀπόδημος ἀφεὶς τὴν οἰκίαν αὐτοῦ καὶ δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν, ⸀ἑκάστῳ τὸ ἔργον αὐτοῦ, καὶ τῷ θυρωρῷ ἐνετείλατο ἵνα γρηγορῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/034.yaml
  text: It is like a man away on a journey[a], who left his house and gave authority to his slaves, to each one his work, and commanded the doorkeeper to stay awake.
translation:
  language: pt
  text: 'É como um homem que viajou para longe: ele deixou sua casa, deu autoridade aos seus escravos[a], atribuiu a cada um o seu trabalho e ordenou ao porteiro que permanecesse vigilante.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos”. O grego usa douloi, termo que aqui se refere a escravos domésticos sujeitos à autoridade de um senhor.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: É como
  rationale: Explicita em português natural a comparação implícita, ligando a ilustração à exortação anterior.
- source_word: ἄνθρωπος ἀπόδημος
  choice: um homem que viajou para longe
  rationale: Preserva a referência a um homem e expressa o estado de estar ausente de casa em viagem.
- source_word: ἀφεὶς τὴν οἰκίαν αὐτοῦ
  choice: ele deixou sua casa
  rationale: Converte o particípio aoristo em oração coordenada clara, sem alterar a sequência narrativa.
- source_word: δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν
  choice: deu autoridade aos seus escravos
  rationale: Mantém o sentido básico de δίδωμι e o valor de autoridade delegada de ἐξουσία; 'escravos' representa diretamente o estatuto expresso por δοῦλοι.
- source_word: ἑκάστῳ τὸ ἔργον αὐτοῦ
  choice: atribuiu a cada um o seu trabalho
  rationale: Torna explícita a construção elíptica grega de modo idiomático, preservando a distribuição individual do trabalho.
- source_word: τῷ θυρωρῷ
  choice: ao porteiro
  rationale: '''Porteiro'' designa naturalmente em português quem guarda ou vigia a entrada de uma casa.'
- source_word: ἐνετείλατο ἵνα γρηγορῇ
  choice: ordenou ao porteiro que permanecesse vigilante
  rationale: Preserva a força de ordem de ἐντέλλομαι e comunica o sentido contextual de γρηγορέω — manter-se acordado, alerta e de vigia — em linguagem natural.
theological_decisions:
- issue: Tradução de δοῦλος no contexto doméstico da ilustração
  choice: escravos
  alternative: servos
  rationale: O termo grego indica pessoas sujeitas à autoridade de um senhor e, neste quadro doméstico, a relação servil é relevante. 'Escravos' evita suavizar essa realidade; a alternativa tradicional 'servos' é registrada em nota.
- issue: Sentido de γρηγορέω no discurso escatológico
  choice: permanecesse vigilante
  alternative: ficasse acordado
  rationale: O verbo pode designar literalmente permanecer acordado e, por extensão, manter-se alerta. O contexto do porteiro e a exortação do discurso sustentam ambos os aspectos; o texto usa a formulação contextual e a nota preserva o sentido literal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção foi ligeiramente reordenada para fluência, sem eliminar a sequência do grego. 'Permanecesse vigilante' evita a possível impressão de que a ordem dizia respeito apenas a não dormir, embora conserve o sentido de alerta próprio do verbo no contexto.
