id: MRK.13.21
reference: Mark 13:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀καὶ τότε ἐάν τις ὑμῖν εἴπῃ· ⸀Ἴδε ὧδε ὁ ⸀χριστός, ⸁Ἴδε ἐκεῖ, μὴ πιστεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/021.yaml
  text: And then[a], if anyone says to you, ‘Look, here is the Messiah!’ or, ‘Look, there!’ do not believe it.
translation:
  language: pt
  text: 'E então, se alguém disser a vocês: “Olhem, aqui está o Messias[a]!” ou: “Olhem, ali está ele!”, não acreditem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”.'
    reason: Registra a tradução tradicional alternativa do título grego ὁ χριστός.
lexical_decisions:
- source_word: καὶ τότε
  choice: E então
  rationale: Preserva tanto a ligação com o discurso anterior, expressa por καί, quanto a referência temporal de τότε, em português natural.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: se alguém disser a vocês
  rationale: Reproduz a condição geral e o pronome indefinido τις; “a vocês” é claro e amplamente compreensível no português contemporâneo.
- source_word: Ἴδε
  choice: Olhem
  rationale: Funciona como chamado enfático à atenção, sem o tom arcaico de “Eis”.
- source_word: ὧδε
  choice: aqui
  rationale: Equivalente direto do advérbio de proximidade, em contraste com ἐκεῖ.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Neste contexto, o artigo e a alegação escatológica mostram que Χριστός funciona como título do ungido esperado, não como nome próprio.
- source_word: ἐκεῖ
  choice: ali está ele
  rationale: “Ali” conserva o contraste espacial com “aqui”; “está ele” explicita naturalmente em português a elipse presente no grego sem alterar seu referente.
- source_word: μὴ πιστεύετε
  choice: não acreditem
  rationale: Mantém o objeto implícito como no grego, permitindo que a proibição se aplique à alegação feita, sem a restringir apenas à pessoa que fala.
theological_decisions:
- issue: Tradução de Χριστός como título
  choice: Messias
  alternative: Cristo
  rationale: A expressão articulada ὁ χριστός designa aqui o ungido esperado em alegações sobre sua localização. “Messias” preserva claramente essa função titular; “Cristo” continua sendo uma tradução tradicional válida e consta em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O plural “vocês” torna explícito o destinatário plural ὑμῖν; “Olhem” comunica de modo natural a força do chamado de atenção.
