base_translation:
  language: en
  yaml_path: translation/nt/mark/013/018.yaml
  text: But pray that it may not happen in winter[a].
translation:
  language: pt
  text: Mas orem para que isso não aconteça no inverno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito à luz do contexto: “para que a fuga de vocês não aconteça no inverno”. O grego de Marcos é mais elíptico que o texto paralelo de Mateus 24:20.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: orem
  rationale: Imperativo presente médio/depoente na segunda pessoa do plural. “Orem” expressa naturalmente o comando e o número plural em português, sem explicitar em excesso uma ideia aspectual como “continuem orando”.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma conexão ou transição leve. “Mas” preserva adequadamente o matiz de contraste com a advertência anterior.
- source_word: ἵνα μὴ
  choice: para que ... não
  rationale: Introduz o conteúdo ou propósito da oração com negação. Esta construção é corrente e natural em português.
- source_word: γένηται
  choice: isso não aconteça
  rationale: Aoristo médio subjuntivo de γίνομαι. O demonstrativo neutro “isso” retoma de modo impessoal e elíptico o acontecimento ou circunstância previsto no contexto, sem acrescentar “a fuga de vocês”, ausente no texto de Marcos.
- source_word: χειμῶνος
  choice: no inverno
  rationale: Genitivo temporal usado adverbialmente. “No inverno” é a forma portuguesa concisa e idiomática.
theological_decisions:
- issue: Referente implícito de γένηται
  choice: Preservar a formulação elíptica de Marcos com “isso não aconteça”
  alternative: Explicitar “para que a fuga de vocês não aconteça no inverno”
  rationale: O grego de Marcos não traz expressamente “a fuga de vocês”, ao contrário de Mateus 24:20. A tradução evita importar palavras do paralelo e mantém a brevidade e a ambiguidade contextual do texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O imperativo plural “orem” é natural; “isso” mantém a elipse do original sem soar obscuro demais. O marcador [a] aparece no texto principal.
