  text: ⸀ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω μηδὲ εἰσελθάτω ⸂τι ἆραι⸃ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/015.yaml
  text: Let the one on the housetop not go down[a], nor enter to take anything out of his house.
translation:
  language: pt
  text: Quem estiver no terraço não desça nem entre em sua casa para tirar coisa alguma dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego se refere ao teto plano e acessível de uma casa, muitas vezes usado como espaço de convivência.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: Quem estiver no terraço
  rationale: A expressão articular tem sentido substantivado e geral. Em português, “quem estiver” transmite naturalmente a instrução dirigida a qualquer pessoa nessa situação.
- source_word: δώματος
  choice: terraço
  rationale: No contexto da Judeia, designa o teto plano e acessível da casa, muitas vezes utilizado como espaço de convivência. “Terraço” comunica melhor essa realidade arquitetônica do que o termo genérico “telhado”.
- source_word: μὴ καταβάτω
  choice: não desça
  rationale: O imperativo presente de terceira pessoa expressa uma proibição urgente; “não desça” é direto, natural e preserva o movimento para baixo.
- source_word: μηδὲ εἰσελθάτω
  choice: nem entre em casa
  rationale: μηδέ coordena a segunda proibição. O destino, implícito no verbo e esclarecido por “da casa dele”, é explicitado de forma natural em português sem alterar o sentido.
- source_word: τι ἆραι
  choice: para tirar de lá coisa alguma
  rationale: O infinitivo exprime propósito, e o pronome indefinido abrange qualquer objeto. “Tirar de lá coisa alguma” mantém tanto a ideia de entrar para buscar algo quanto a força abrangente da proibição.
- source_word: ἐκ τῆς οἰκίας αὐτοῦ
  choice: de lá
  rationale: “De lá” retoma naturalmente “casa” e expressa o movimento para fora indicado por ἐκ, evitando uma repetição pesada em português.
theological_decisions:
- issue: Masculino singular representativo numa instrução de alcance geral
  choice: Formulação geral com “quem”, seguida de referência locativa (“de lá”)
  alternative: “da casa dele”
  rationale: O grego emprega masculino singular com força representativa. Em português, “quem” preserva o singular e o alcance geral; a retomada locativa evita introduzir gênero onde ele não é necessário, sem mudar o referente nem a aplicação universal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Terraço” foi preferido a “telhado” para representar a cobertura plana e utilizável das casas do contexto, e a sequência de proibições foi mantida de modo direto e urgente.
