  text: ⸀ὃ δὲ ὑμῖν λέγω πᾶσιν λέγω· γρηγορεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/037.yaml
  text: 'And what I say to you I say to all: stay awake[a].'
translation:
  language: pt
  text: 'E o que digo a vocês, digo a todos: fiquem atentos[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vigiem” ou “permaneçam acordados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: o que
  rationale: O pronome relativo neutro singular é usado de modo substantivado; “o que” expressa com naturalidade seu sentido amplo e resumitivo.
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ funciona como conexão leve, não como contraste forte; “E” liga naturalmente a frase ao discurso anterior.
- source_word: ὑμῖν
  choice: a vocês
  rationale: O dativo da segunda pessoa do plural se refere primeiro aos discípulos presentes; “a vocês” torna explícito o plural em português.
- source_word: λέγω ... λέγω
  choice: digo ... digo
  rationale: A repetição foi mantida para preservar a ênfase e a estrutura retórica do grego.
- source_word: πᾶσιν
  choice: a todos
  rationale: Mantém de forma concisa a abrangência inclusiva do dativo plural sem acrescentar um substantivo ausente do texto.
- source_word: γρηγορεῖτε
  choice: fiquem atentos
  rationale: O imperativo presente plural pede vigilância contínua. “Fiquem atentos” comunica naturalmente a exortação, enquanto a nota preserva as imagens alternativas de vigiar e permanecer acordado.
theological_decisions:
- issue: Alcance da exortação de Jesus
  choice: A declaração dirigida aos discípulos é explicitamente estendida a todos.
  alternative: A exortação poderia ser entendida como limitada aos ouvintes imediatos no contexto narrativo.
  rationale: O grego contrapõe explicitamente “a vocês” e “a todos”; a tradução conserva essa ampliação universal sem definir além do texto quem está incluído em “todos”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Fiquem atentos” evita que “acordados” seja entendido apenas em sentido físico, enquanto a nota conserva tanto a metáfora do despertar quanto a ideia de vigilância contínua.
