id: MRK.13.32
reference: Mark 13:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης ἢ ⸀τῆς ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι ⸀ἐν οὐρανῷ οὐδὲ ὁ υἱός, εἰ μὴ ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/032.yaml
  text: But concerning that day or hour[a], no one knows—not even the angels in heaven, nor the Son, but only the Father.
translation:
  language: pt
  text: Mas, quanto àquele dia ou àquela hora, ninguém sabe — nem os anjos no céu, nem o Filho[a], mas somente o Pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns intérpretes entendem “nem o Filho” com referência à missão encarnada do Filho ou à sua natureza humana; a tradução preserva a formulação do texto grego sem acrescentar essa explicação ao texto principal.
    reason: alternativa interpretativa
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Mas, quanto a
  rationale: περί com o genitivo introduz o assunto, enquanto δέ marca uma transição com leve contraste. “Mas, quanto a” conserva ambas as funções de modo natural em português.
- source_word: τῆς ἡμέρας ἐκείνης ἢ τῆς ὥρας
  choice: àquele dia ou àquela hora
  rationale: Os dois sintagmas genitivos distinguem o dia da hora. A repetição de “àquela” reproduz com clareza os artigos e evita que “hora” pareça indefinida.
- source_word: οὐδεὶς οἶδεν
  choice: ninguém sabe
  rationale: 'οὐδείς é um pronome negativo, e οἶδα, embora tenha forma de perfeito, apresenta aqui o sentido corrente de presente: “saber”.'
- source_word: οὐδὲ οἱ ἄγγελοι ἐν οὐρανῷ
  choice: nem os anjos no céu
  rationale: οὐδέ prolonga enfaticamente a negação; “nem” expressa naturalmente a série negativa. ἐν οὐρανῷ é entendido em sentido locativo.
- source_word: οὐδὲ ὁ υἱός
  choice: nem o Filho
  rationale: A repetição de οὐδέ continua a série negativa. “O Filho” mantém o título cristológico e a formulação direta do grego, sem paráfrase explicativa.
- source_word: εἰ μὴ ὁ πατήρ
  choice: mas somente o Pai
  rationale: Depois de uma negação, εἰ μή introduz a única exceção. “Mas somente o Pai” comunica essa exclusividade com clareza e naturalidade.
theological_decisions:
- issue: A afirmação cristológica de que o Filho não sabe o dia ou a hora
  choice: Manter a formulação direta “nem o Filho”, sem atenuação ou acréscimo explicativo no texto principal.
  alternative: Acrescentar no texto qualificações interpretativas como “em sua humanidade” ou “em sua missão encarnada”.
  rationale: O texto grego inclui explicitamente οὐδὲ ὁ υἱός. A tradução preserva a tensão teológica do enunciado e não insere no texto uma harmonização doutrinária que o original não expressa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “quanto a” marca naturalmente a mudança de assunto; “no céu” é mais corrente que “nos céus” neste contexto, sem alterar o sentido locativo.
