source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀ἀκούσητε πολέμους καὶ ἀκοὰς πολέμων, μὴ θροεῖσθε· ⸀δεῖ γενέσθαι, ἀλλ’ οὔπω τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/007.yaml
  text: And when you hear of wars and reports of wars[a], do not be alarmed; these things must happen, but the end is not yet.
translation:
  language: pt
  text: E, quando vocês ouvirem falar de guerras e de notícias de guerras[a], não fiquem alarmados; é necessário que isso aconteça, mas ainda não é o fim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rumores de guerras”. O termo grego pode se referir a notícias, relatos ou rumores que se ouvem sobre guerras.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: E, quando
  rationale: ὅταν introduz uma circunstância temporal futura ou eventual, enquanto δέ funciona aqui como conectivo leve. “E, quando” mantém a ligação com o contexto sem impor um contraste forte.
- source_word: ἀκούσητε
  choice: vocês ouvirem falar de
  rationale: O aoristo do subjuntivo regido por ὅταν é expresso naturalmente em português pelo futuro do subjuntivo. “Ouvir falar de” é idiomático diante de guerras e notícias.
- source_word: πολέμους
  choice: guerras
  rationale: Equivalente direto e corrente de πόλεμος no plural.
- source_word: ἀκοὰς πολέμων
  choice: notícias de guerras
  rationale: ἀκοή pode designar aquilo que se ouve, incluindo notícia, relato ou rumor. “Notícias” é amplo e natural, sem pressupor que a informação seja falsa ou não confirmada; a alternativa tradicional é preservada em nota.
- source_word: μὴ θροεῖσθε
  choice: não fiquem alarmados
  rationale: θροέομαι indica perturbação, alarme ou agitação. A formulação comunica claramente a proibição de entrar em estado de pânico.
- source_word: δεῖ γενέσθαι
  choice: É necessário que isso aconteça
  rationale: δεῖ expressa necessidade, e γενέσθαι significa acontecer ou vir a ocorrer. “Isso” retoma de modo natural as guerras e as notícias mencionadas, sem explicitar além do texto a natureza dessa necessidade.
- source_word: ἀλλ’ οὔπω τὸ τέλος
  choice: mas ainda não será o fim
  rationale: A forma portuguesa futura se ajusta ao contexto prospectivo da instrução e conserva a afirmação de que tais acontecimentos não equivalem ainda ao fim.
theological_decisions:
- issue: Necessidade escatológica em δεῖ γενέσθαι
  choice: É necessário que isso aconteça
  alternative: Isso tem de acontecer
  rationale: A tradução preserva a força da necessidade profética ou divina afirmada pelo texto, sem definir seu mecanismo nem importar um sistema escatológico específico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “vocês” para explicitar o plural do verbo grego e favorecer legibilidade brasileira sem regionalismo marcado. A pontuação divide a advertência em duas frases para clareza, preservando a sequência lógica do original.
