  text: ὑμεῖς δὲ βλέπετε· ⸀προείρηκα ὑμῖν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/023.yaml
  text: But you[a], watch out[b]; I have told you all things beforehand.
translation:
  language: pt
  text: Mas vocês, fiquem atentos[a]; eu lhes disse tudo de antemão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estejam de sobreaviso” ou “tenham cuidado”.
    reason: lexical_alternative
  - marker: b
    text: Ou “eu os avisei de tudo com antecedência”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: vocês
  rationale: O pronome de segunda pessoa do plural é explícito e contrastivo. “Vocês” preserva essa ênfase e tem leitura natural no português brasileiro.
- source_word: δὲ
  choice: Mas
  rationale: Marca contraste com o contexto anterior e introduz a advertência dirigida aos discípulos.
- source_word: βλέπετε
  choice: fiquem atentos
  rationale: O imperativo presente funciona aqui como advertência para manter vigilância. A expressão é natural, digna e conserva o caráter contínuo da exortação.
- source_word: προείρηκα
  choice: disse de antemão
  rationale: O perfeito assinala uma declaração prévia que continua relevante, e o verbo composto expressa falar antecipadamente.
- source_word: ὑμῖν
  choice: lhes
  rationale: O dativo indica os destinatários da fala; “lhes disse” é uma formulação clara e corrente em registro escrito amplo.
- source_word: πάντα
  choice: tudo
  rationale: O neutro plural pode ser traduzido naturalmente por “tudo”, sem decidir se a referência abrange todos os detalhes possíveis ou tudo o que é pertinente ao contexto.
theological_decisions:
- issue: Alcance de πάντα e função da advertência
  choice: Manter “tudo” sem explicitar o alcance e apresentar a declaração prévia como fundamento contextual da vigilância.
  alternative: Parafrasear como “tudo o que vocês precisam saber” ou limitar a referência apenas às advertências imediatamente anteriores.
  rationale: O grego deixa o referente de πάντα dependente do contexto. A tradução não deve transformar a frase numa afirmação de revelação exaustiva nem restringi-la além do que o texto diz.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A forma plural “vocês” torna explícita a ênfase de ὑμεῖς; “fiquem atentos” comunica a advertência sem coloquialismo excessivo.
