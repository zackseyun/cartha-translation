id: MRK.13.11
reference: Mark 13:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂καὶ ὅταν⸃ ⸀ἄγωσιν ὑμᾶς παραδιδόντες, μὴ προμεριμνᾶτε τί ⸀λαλήσητε, ἀλλ’ ὃ ἐὰν δοθῇ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τοῦτο λαλεῖτε, οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τὸ ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/011.yaml
  text: And when they lead you away and hand you over[a], do not worry beforehand about what you should say; but whatever is given to you in that hour, speak that. For it is not you who are speaking[b], but the Holy Spirit.
translation:
  language: pt
  text: E, quando os levarem e os entregarem[a], não se preocupem de antemão com o que dizer; mas digam o que lhes for dado naquela hora, pois não são vocês que estão falando, mas o Espírito Santo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os levarem, entregando-os”.'
    reason: A forma grega traz um verbo principal, “levarem”, seguido de um particípio, “entregando”; no texto, os dois foram coordenados para maior naturalidade em português.
lexical_decisions:
- source_word: καὶ ὅταν
  choice: E, quando
  rationale: Mantém a ligação com o discurso anterior e apresenta a situação futura esperada sem tornar a frase rígida.
- source_word: ἄγωσιν ὑμᾶς παραδιδόντες
  choice: levarem vocês e os entregarem
  rationale: 'Expressa de modo natural os dois aspectos do evento coercivo: conduzir os discípulos e entregá-los. A coordenação verbal verte com fluidez o verbo principal seguido do particípio, sem restringir παραδίδωμι a uma traição pessoal.'
- source_word: μὴ προμεριμνᾶτε
  choice: não se preocupem de antemão
  rationale: Preserva tanto a ideia de preocupação ansiosa quanto o elemento temporal do prefixo προ-.
- source_word: τί λαλήσητε
  choice: com o que dizer
  rationale: É a formulação idiomática em português para a preparação antecipada de uma fala; λαλέω admite tanto “falar” quanto “dizer” neste contexto.
- source_word: ὃ ἐὰν δοθῇ ὑμῖν
  choice: o que lhes for dado
  rationale: Mantém a construção passiva e indefinida, sem explicitar quem dá as palavras além do que o próprio versículo declara.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: naquela hora
  rationale: Conserva a expressão temporal solene e direta do grego.
- source_word: τοῦτο λαλεῖτε
  choice: digam
  rationale: Retoma naturalmente em português “o que lhes for dado”; evita a construção pouco idiomática “falem isso” sem enfraquecer a ordem de comunicar precisamente o que for recebido.
- source_word: οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες
  choice: pois não são vocês que estão falando
  rationale: Preserva a ênfase em ὑμεῖς e a construção participial, além de preparar o contraste com o Espírito Santo.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: o Espírito Santo
  rationale: É a designação consagrada e atual em português, correspondente ao título grego.
theological_decisions:
- issue: Agência da fala inspirada durante a perseguição
  choice: A fala é dada aos discípulos e atribuída, em última instância, ao Espírito Santo, embora eles continuem recebendo a ordem de falar.
  alternative: Entender os discípulos como instrumentos inteiramente passivos, ou reduzir o Espírito Santo a uma influência divina genérica.
  rationale: A tradução conserva a tensão do grego entre a participação humana — “digam” — e a agência divina — “não são vocês... mas o Espírito Santo” — sem impor um modelo de ditado mecânico nem enfraquecer a referência pessoal ao Espírito.
- issue: Agente implícito de “lhes for dado”
  choice: Manter a voz passiva sem acrescentar “por Deus” ou “pelo Espírito Santo”.
  alternative: Explicitar Deus ou o Espírito Santo como agente daquilo que é dado.
  rationale: Embora o contexto indique provisão divina e a cláusula seguinte mencione o Espírito Santo, o grego deixa o agente da forma passiva sem expressão explícita.
translation_notes:
  register: Português moderno, digno e de leitura natural, com “vocês” para ampla clareza brasileira. A redação evita arcaísmos como “não premediteis” e mantém “naquela hora” para conservar o tom solene do original.
