  text: καὶ ἐὰν βασιλεία ἐφ’ ἑαυτὴν μερισθῇ, οὐ δύναται σταθῆναι ἡ βασιλεία ἐκείνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/024.yaml
  text: And if a kingdom is divided against itself, that kingdom cannot stand.
translation:
  language: pt
  text: E, se um reino estiver dividido contra si mesmo, esse reino não pode permanecer de pé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a ligação direta com o argumento precedente de modo natural em português.
- source_word: ἐὰν
  choice: se
  rationale: Introduz adequadamente a condição expressa com o subjuntivo.
- source_word: βασιλεία
  choice: reino
  rationale: Mantém a imagem político-social de uma entidade coletiva, em vez da ideia abstrata de governo ou reinado.
- source_word: ἐφ’ ἑαυτὴν
  choice: contra si mesmo
  rationale: Expressa a oposição interna indicada pela construção com o reflexivo; a concordância no masculino acompanha o gênero gramatical de “reino” em português.
- source_word: μερισθῇ
  choice: estiver dividido
  rationale: Conserva o sentido passivo e combina naturalmente com a construção condicional, sem especificar a causa da divisão.
- source_word: οὐ δύναται
  choice: não poderá
  rationale: Comunica incapacidade no contexto da condição formulada, com fluência em português.
- source_word: σταθῆναι
  choice: permanecer de pé
  rationale: Preserva a metáfora de continuar estabelecido, tornando explícito o valor contextual de “estar em pé” sem reduzi-lo apenas a sobrevivência abstrata.
- source_word: ἡ βασιλεία ἐκείνη
  choice: esse reino
  rationale: Retém a repetição enfática do substantivo com o demonstrativo e soa natural em português.
theological_decisions:
- issue: Natureza da declaração
  choice: Apresentá-la como um princípio geral dentro do argumento de Jesus, sem ampliar seu alcance.
  alternative: Trat-la como uma máxima sociopolítica geral ou explicitar uma conclusão doutrinária sobre Satanás.
  rationale: O versículo funciona como analogia na resposta de Jesus; a tradução deve preservar sua força proverbial sem acrescentar afirmações que o texto não faz.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a metáfora e a repetição retórica do grego, evitando rigidez excessiva.
