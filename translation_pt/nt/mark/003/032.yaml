base_translation:
  language: en
  yaml_path: translation/nt/mark/003/032.yaml
  text: And a crowd was sitting around him[a], and they said to him, “Look, your mother and your brothers are outside looking for you.”
translation:
  language: pt
  text: 'E uma multidão estava sentada ao redor dele, e lhe disseram: “Veja, sua mãe e seus irmãos estão lá fora procurando por você.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “buscando você”. O verbo grego pode significar “buscar” ou “procurar”; aqui, provavelmente se refere à tentativa de encontrá-lo fisicamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθητο
  choice: estava sentada
  rationale: O imperfeito apresenta uma situação em andamento; a locução verbal preserva esse valor durativo e concorda naturalmente com “multidão”.
- source_word: περὶ αὐτὸν ὄχλος
  choice: uma multidão estava sentada ao redor dele
  rationale: περί com acusativo expressa a disposição espacial em torno de Jesus; “ao redor dele” conserva claramente essa imagem.
- source_word: λέγουσιν
  choice: lhe disseram
  rationale: O presente grego funciona como presente histórico; o pretérito é mais natural na narrativa em português. O pronome “lhe” explicita o destinatário já presente no grego.
- source_word: Ἰδοὺ
  choice: Olhe
  rationale: A forma chama a atenção do ouvinte de maneira direta e atual, sem o tom arcaico de “Eis”.
- source_word: μήτηρ
  choice: mãe
  rationale: Equivalente direto e natural do termo de parentesco.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém o plural masculino do grego e não acrescenta uma interpretação sobre a natureza exata do parentesco.
- source_word: ἔξω
  choice: lá fora
  rationale: Expressa naturalmente em português a localização externa em relação ao lugar onde Jesus estava.
- source_word: ζητοῦσίν σε
  choice: procurando por você
  rationale: ζητέω pode significar procurar ou buscar; neste contexto, indica que os familiares tentavam encontrá-lo ou obter sua presença. A formulação é clara e corrente em português brasileiro.
theological_decisions:
- issue: Referência de “irmãos”
  choice: Traduzir ἀδελφοί diretamente como “irmãos”, sem explicação interpretativa no texto.
  alternative: “parentes próximos” ou “irmãos e irmãs”
  rationale: O versículo emprega o termo comum para irmãos, mas não define aqui a natureza teológica ou biológica precisa dessas relações familiares. A tradução direta evita importar conclusões denominacionais.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Olhe” preserva a força de ἰδού em registro corrente; “lá fora” e “procurando por você” soam naturais sem perder o sentido do original.
