review_pass:
  verdict: revise
  source_fidelity: A expressão τὴν χεῖρα ἔχοντι ξηράν descreve literalmente um homem que tinha a mão «seca/ressequida», isto é, definhada. «Atrofiada» comunica a ideia contextual, mas introduz uma caracterização médica mais específica do que o grego afirma. «Ressequida» conserva melhor a imagem e o grau de precisão da fonte. O presente histórico em «diz», «homem» e «Levante-se e venha para o meio» refletem adequadamente o texto grego.
  naturalness: «E diz ao homem que tinha a mão ressequida» é claro, digno e compreensível no português bíblico moderno. «Levante-se e venha para o meio» torna natural em português o imperativo seguido de εἰς τὸ μέσον, preservando o movimento em direção ao centro.
  terminology: «Mão ressequida» é preferível a «mão atrofiada», pois não diagnostica atrofia e mantém a linguagem descritiva da fonte. A nota deve evitar «de todos», que não está expresso no grego, e não deve sugerir que o homem já estivesse no meio.
  issues:
  - severity: medium
    issue: «Atrofiada» especifica além do texto-fonte.
    rationale: ξηράν significa primariamente «seca, ressequida, definhada»; embora uma atrofia possa corresponder ao quadro, o termo português apresenta uma definição clínica que o grego não fornece.
  - severity: medium
    issue: A nota acrescenta «de todos» e sua primeira alternativa enfraquece o movimento de εἰς.
    rationale: «Levante-se no meio de todos» inclui participantes não mencionados e pode indicar simplesmente levantar-se estando já no meio, enquanto εἰς τὸ μέσον aponta para o meio/centro como destino.
  revised_text: 'E diz ao homem que tinha a mão ressequida: “Levante-se e venha para o meio.”[a]'
  revised_footnotes:
  - marker: a
    text: 'Ou: “Levante-se e vá para o centro”; de modo mais idiomático, “Venha à frente”.'
    reason: lexical_alternative
