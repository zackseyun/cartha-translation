  yaml_path: translation/nt/mark/003/003.yaml
  text: And he says to the man with the withered hand[a], “Rise and come to the middle.”
translation:
  language: pt
  text: 'E diz ao homem que tinha a mão ressequida: “Levante-se e venha para o meio.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Levante-se e vá para o centro”; de modo mais idiomático, “Venha à frente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico característico da narrativa vívida de Marcos.
- source_word: ἀνθρώπῳ
  choice: homem
  rationale: O contexto identifica um indivíduo do sexo masculino; “homem” traduz o referente de modo natural e preciso.
- source_word: τὴν χεῖρα ἔχοντι ξηράν
  choice: que tinha a mão atrofiada
  rationale: A oração relativa soa natural em português e descreve a condição sem sugerir que a mão estivesse apenas ressecada.
- source_word: ξηράν
  choice: atrofiada
  rationale: Embora o sentido básico seja “seca”, no contexto de uma mão incapacitada “atrofiada” comunica de modo claro e corrente a condição física, sem especificar sua causa.
- source_word: Ἔγειρε
  choice: Levante-se
  rationale: Expressa diretamente o imperativo de ἐγείρω em português atual e digno.
- source_word: εἰς τὸ μέσον
  choice: venha para o meio
  rationale: Torna explícito, de maneira idiomática, o movimento indicado por εἰς em direção ao centro do grupo, sem reduzir a expressão à paráfrase “venha à frente”.
