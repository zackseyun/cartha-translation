  text: καὶ παρετήρουν αὐτὸν εἰ τοῖς σάββασιν θεραπεύσει αὐτόν, ἵνα ⸀κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/002.yaml
  text: And they were watching him closely to see whether he would heal him on the Sabbath[a], so that they might accuse him.
translation:
  language: pt
  text: E eles o observavam atentamente para ver se ele curaria aquele homem no sábado[a], a fim de poderem acusá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “nos sábados”; o plural pode ser usado idiomaticamente para o dia de sábado.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετήρουν
  choice: observavam atentamente
  rationale: O imperfeito expressa uma ação contínua, e o verbo sugere observação cuidadosa, aqui com intenção hostil.
- source_word: εἰ
  choice: para ver se
  rationale: Depois de um verbo de observação, esta formulação natural em português preserva o sentido de pergunta indireta.
- source_word: τοῖς σάββασιν
  choice: no sábado
  rationale: Embora o grego use o dativo plural, a forma plural pode designar idiomaticamente o dia de sábado; o singular é a expressão natural em português.
- source_word: θεραπεύσει
  choice: curaria
  rationale: O futuro do grego, dentro de uma pergunta indireta dependente de um verbo no passado, é naturalmente expresso pelo futuro do pretérito em português.
- source_word: ἵνα
  choice: a fim de
  rationale: Preserva claramente a finalidade da vigilância.
- source_word: κατηγορήσωσιν αὐτοῦ
  choice: poderem acusá-lo
  rationale: Expressa o propósito indicado pelo subjuntivo sem introduzir a ideia mais específica de processo judicial formal.
theological_decisions:
- issue: Intenção dos observadores
  choice: Vigilância hostil com o propósito de encontrar motivo para acusar Jesus
  alternative: Formulação mais jurídica, como “processá-lo”
  rationale: O contexto e o verbo indicam hostilidade e acusação, mas o texto não especifica um procedimento judicial formal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Aquele homem” explicita o referente de αὐτόν para evitar em português a ambiguidade pronominal indesejada entre Jesus e o homem, sem acrescentar conteúdo novo.
