id: MRK.3.21
reference: Mark 3:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ παρ’ αὐτοῦ ἐξῆλθον κρατῆσαι αὐτόν, ἔλεγον γὰρ ὅτι ἐξέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/021.yaml
  text: And when those close to him heard[a], they went out to seize him, for they were saying[b], “He is out of his mind.”
translation:
  language: pt
  text: 'Quando os que eram próximos dele souberam disso[a], saíram para agarrá-lo, pois diziam: “Ele está fora de si.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os familiares dele” ou “os seus”; a expressão grega é idiomática e pode referir-se especificamente às pessoas da casa ou do círculo próximo de Jesus.
    reason: alternative_reading
  - marker: b
    text: Ou “Ele perdeu o juízo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρ’ αὐτοῦ
  choice: os que eram próximos dele
  rationale: A expressão grega é idiomática e pode indicar pessoas ligadas a Jesus, provavelmente familiares ou integrantes de seu círculo próximo. A formulação preserva essa ambiguidade sem explicitar um parentesco que o grego não nomeia diretamente.
- source_word: ἀκούσαντες
  choice: quando ... souberam disso
  rationale: O particípio aoristo tem valor temporal. “Souberam disso” é natural em português e explicita que eles receberam notícia da situação descrita no contexto, sem definir exatamente o conteúdo ouvido.
- source_word: ἐξῆλθον
  choice: saíram
  rationale: Reproduz de modo direto e natural o movimento expresso pelo aoristo, sem acrescentar um ponto de partida ou destino não declarado.
- source_word: κρατῆσαι
  choice: para agarrá-lo
  rationale: Mantém a força de tomar fisicamente alguém sob controle, sem introduzir a ideia jurídica mais específica de prisão nem interpretar antecipadamente a ação como mero cuidado ou contenção.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito comunica fala em curso ou repetida; “diziam” preserva esse aspecto com naturalidade.
- source_word: ἐξέστη
  choice: Ele está fora de si
  rationale: Expressão portuguesa corrente que comunica perda de domínio ou equilíbrio mental sem recorrer a um diagnóstico moderno mais forte do que o texto.
theological_decisions:
- issue: Identidade de οἱ παρ’ αὐτοῦ
  choice: os que eram próximos dele
  alternative: sua família; os seus; seus companheiros
  rationale: O contexto posterior favorece a referência à família de Jesus, mas a expressão grega não emprega um termo explícito de parentesco. A tradução principal conserva a indeterminação e registra as leituras mais específicas em nota.
- issue: Sentido da acusação ἐξέστη
  choice: Ele está fora de si
  alternative: Ele perdeu o juízo; Ele está transtornado
  rationale: A formulação preserva a acusação de desequilíbrio ou perda de controle sem transformá-la em diagnóstico clínico nem suavizar a tensão narrativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Agarrá-lo” conserva a força física do verbo sem sugerir necessariamente uma prisão formal; “fora de si” é claro, corrente e não clínico.
