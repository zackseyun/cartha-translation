source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἱεροσολύμων καὶ ἀπὸ τῆς Ἰδουμαίας ⸀καὶ πέραν τοῦ Ἰορδάνου ⸁καὶ περὶ Τύρον καὶ Σιδῶνα, πλῆθος πολύ, ⸀ἀκούοντες ὅσα ⸀ἐποίει ἦλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/008.yaml
  text: and from Jerusalem[a], and from Idumea, and beyond the Jordan, and around Tyre and Sidon, a great crowd, hearing what he was doing[c][b], came to him.
translation:
  language: pt
  text: e de Jerusalém, e da Idumeia, e do outro lado do Jordão, e dos arredores de Tiro e Sidom, uma grande multidão, ao ouvir tudo o que ele fazia, foi até ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ Ἱεροσολύμων
  choice: de Jerusalém
  rationale: ἀπό com o genitivo indica procedência; o nome geográfico recebe sua forma portuguesa consagrada.
- source_word: ἀπὸ τῆς Ἰδουμαίας
  choice: da Idumeia
  rationale: Preserva a procedência regional expressa por ἀπό e usa a forma portuguesa corrente do topônimo.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: do outro lado do Jordão
  rationale: A expressão designa a região situada além ou na margem oposta do rio; a formulação é clara e natural em português.
- source_word: περὶ Τύρον καὶ Σιδῶνα
  choice: dos arredores de Tiro e Sidom
  rationale: περί com acusativo tem sentido espacial e aponta para a região circundante, não necessariamente apenas para as duas cidades.
- source_word: πλῆθος πολύ
  choice: uma grande multidão
  rationale: Expressa naturalmente em português um agrupamento muito numeroso e mantém o substantivo coletivo singular do grego.
- source_word: ἀκούοντες
  choice: ao ouvir
  rationale: Mantém a ligação circunstancial do particípio com o verbo principal sem decidir rigidamente entre valor temporal e causal.
- source_word: ὅσα ἐποίει
  choice: tudo o que ele fazia
  rationale: ὅσα pode ter força abrangente, enquanto o imperfeito ἐποίει apresenta a atividade como contínua ou habitual.
- source_word: ἦλθον πρὸς αὐτόν
  choice: foi até ele
  rationale: O verbo está no singular porque concorda com πλῆθος, e πρός indica movimento em direção a Jesus; em português, 'foi' se ajusta naturalmente ao ponto de vista narrativo.
- source_word: καὶ ... καὶ ... καὶ
  choice: e ... e ... e
  rationale: A repetição preserva o efeito cumulativo característico da enumeração de Marcos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem cumulativa e a concordância singular de 'multidão ... foi' seguem de perto a estrutura grega, sem tornar a frase artificial.
