lexical_decisions:
- source_word: ὅτι
  choice: porque
  rationale: Expressa claramente a relação causal com a declaração anterior de Jesus sobre a culpa deles.
- source_word: ἔλεγον
  choice: eles diziam
  rationale: O imperfeito indica uma acusação contínua ou repetida; “diziam” preserva naturalmente esse aspecto em português.
- source_word: Πνεῦμα ἀκάθαρτον
  choice: um espírito impuro
  rationale: Preserva o sentido de ἀκάθαρτος e usa uma expressão bíblica clara e corrente em português.
- source_word: ἔχει
  choice: tem
  rationale: Reproduz diretamente o verbo grego sem explicitar no texto principal a ideia interpretativa de possessão.
theological_decisions:
- issue: Natureza da acusação contra Jesus
  choice: “Ele tem um espírito impuro”
  alternative: “Ele está possuído por um espírito impuro”
  rationale: A formulação direta conserva a gravidade da acusação e evita desenvolver além do que o grego afirma expressamente; a leitura mais idiomática é mantida em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Espírito impuro” mantém a terminologia do original sem paráfrase denominacional.
