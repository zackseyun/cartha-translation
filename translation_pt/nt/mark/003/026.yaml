source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς ἀνέστη ἐφ’ ἑαυτὸν καὶ ⸀ἐμερίσθη, οὐ δύναται ⸀στῆναι ἀλλὰ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/026.yaml
  text: And if Satan has risen up against himself and is divided[a], he cannot stand, but has come to an end.
translation:
  language: pt
  text: E, se Satanás se levantou contra si mesmo e ficou dividido, não pode subsistir, mas tem fim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σατανᾶς
  choice: Satanás
  rationale: Forma tradicional e amplamente reconhecida em português para o nome pessoal transliterado do grego.
- source_word: ἀνέστη
  choice: se levantou
  rationale: Preserva a imagem de levantar-se em oposição e funciona naturalmente com «contra si mesmo».
- source_word: ἐφ’ ἑαυτὸν
  choice: contra si mesmo
  rationale: Neste contexto, ἐπί com o pronome reflexivo indica ação hostil dirigida contra o próprio sujeito.
- source_word: ἐμερίσθη
  choice: ficou dividido
  rationale: Expressa de modo natural o estado resultante da divisão interna, sem transformar explicitamente o passivo grego em ação reflexiva deliberada.
- source_word: οὐ δύναται στῆναι
  choice: não pode permanecer de pé
  rationale: Conserva a metáfora de «estar de pé» e comunica a incapacidade de continuar ou subsistir.
- source_word: ἀλλὰ τέλος ἔχει
  choice: mas chegou ao fim
  rationale: Formulação portuguesa idiomática e concisa para a consequência de não poder subsistir; a expressão mais literal é preservada em nota.
theological_decisions:
- issue: Natureza da afirmação sobre a queda de Satanás
  choice: Apresentar «chegou ao fim» como a consequência lógica da hipótese formulada por Jesus.
  alternative: Expandir a frase como uma declaração absoluta e independente sobre a derrota escatológica final de Satanás.
  rationale: O versículo integra o argumento de redução ao absurdo sobre um reino dividido. A tradução não acrescenta uma explicação doutrinária além da lógica imediata do texto.
- issue: Valor temporal de τέλος ἔχει
  choice: «chegou ao fim», com nota para a formulação literal «tem fim».
  alternative: «está chegando ao fim».
  rationale: O presente grego ἔχει não contém por si só um aspecto progressivo explícito; a redação escolhida reflete o caráter conclusivo da expressão, enquanto a nota preserva sua forma literal e a ambiguidade possível.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição da imagem de levantar-se/permanecer de pé preserva a força retórica do grego. O marcador da nota foi colocado após a expressão a que efetivamente se refere.
