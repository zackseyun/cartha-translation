revisions:
- from: E, se Satanás se levantou contra si mesmo e ficou dividido, não pode permanecer de pé, mas chegou ao fim.[a]
  to: E, se Satanás se levantou contra si mesmo e ficou dividido, não pode subsistir, mas tem fim.
  rationale: A revisão substitui o perfectivo «chegou ao fim» por «tem fim», que reproduz o presente ἔχει e mantém a concisão e a ambiguidade temporal da expressão grega. «Não pode subsistir» comunica de modo idiomático a incapacidade de um reino ou poder dividido de continuar, sem perder a função retórica de στῆναι. A nota é removida porque sua alternativa passa a integrar o texto.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:56:45Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução transmite corretamente a estrutura condicional e o sentido de oposição interna: «Satanás», «contra si mesmo», a divisão e a incapacidade de subsistir. Contudo, «chegou ao fim» torna o presente ἔχει mais explicitamente perfectivo/conclusivo do que o grego exige. «Tem fim» preserva melhor a formulação concisa e sua força argumentativa, sem decidir indevidamente entre “está chegando ao fim” e “já chegou ao fim”.'
  naturalness: «Não pode permanecer de pé» é compreensível e preserva a metáfora, mas «não pode subsistir» é mais idiomático neste argumento sobre a continuidade de um domínio e continua em registro moderno internacional. «Ficou dividido» é natural e exprime adequadamente o estado resultante.
  terminology: «Satanás» é a forma estabelecida em português. Não há termo teológico que exija ajuste. A nota atual cria uma oposição desnecessária, pois propõe como alternativa literal uma expressão que é preferível no próprio texto.
  issues:
  - severity: medium
    issue: «mas chegou ao fim» para ἀλλὰ τέλος ἔχει
    rationale: O presente ἔχει significa literalmente «tem», e, no contexto, pode expressar o desfecho inevitável sem afirmar que ele já se completou. «Chegou ao fim» estreita essa nuance para um resultado consumado.
  - severity: low
    issue: Nota lexical sobre «tem fim»
    rationale: Uma vez que «tem fim» é uma tradução natural, direta e mais próxima do grego, a nota deixa de ser necessária; mantê-la apenas para contrastar com «chegou ao fim» chama atenção para uma perda de nuance evitável.
  revised_text: E, se Satanás se levantou contra si mesmo e ficou dividido, não pode subsistir, mas tem fim.
  revised_footnotes: []
