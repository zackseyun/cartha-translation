revisions:
- from: E disse aos seus discípulos que mantivessem um pequeno barco à sua disposição por causa da multidão, para que não o comprimissem.[a]
  to: E disse aos seus discípulos que um pequeno barco ficasse à sua disposição por causa da multidão, para que não o apertassem.[a]
  rationale: A revisão preserva o pequeno barco como sujeito da disponibilidade contínua e substitui uma formulação algo técnica por «o apertassem», expressão natural para a pressão exercida por uma multidão. A nota foi corrigida para que todas as alternativas mantenham Jesus como objeto do verbo grego.
  reviewer_model: gpt-5.6-terra
