source:
  edition: SBLGNT
  text: καὶ εἶπεν τοῖς μαθηταῖς αὐτοῦ ἵνα πλοιάριον προσκαρτερῇ αὐτῷ διὰ τὸν ὄχλον ἵνα μὴ θλίβωσιν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/009.yaml
  text: And he told his disciples that a small boat should stay ready for him because of the crowd[a], so that they might not crush him.
translation:
  language: pt
  text: E disse aos seus discípulos que um pequeno barco ficasse à sua disposição por causa da multidão, para que não o apertassem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o pressionassem» ou «o esmagassem». O verbo grego pode indicar apertar, pressionar ou esmagar sob pressão.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: disse
  rationale: Com a construção indireta introduzida por «que», «disse aos seus discípulos» é natural em português e corresponde diretamente a λέγω.
- source_word: μαθηταῖς
  choice: discípulos
  rationale: É o termo consagrado e adequado nos Evangelhos, preservando a relação entre mestre e seguidores.
- source_word: πλοιάριον
  choice: pequeno barco
  rationale: Preserva de modo natural o valor diminutivo de πλοιάριον.
- source_word: προσκαρτερῇ αὐτῷ
  choice: mantivessem ... à sua disposição
  rationale: Expressa a disponibilidade contínua do barco para Jesus; o plural retoma naturalmente os discípulos como responsáveis por mantê-lo pronto, embora o verbo grego tenha «pequeno barco» como sujeito gramatical.
- source_word: διὰ τὸν ὄχλον
  choice: por causa da multidão
  rationale: διά com acusativo indica aqui causa ou motivo.
- source_word: θλίβωσιν
  choice: comprimissem
  rationale: Comunica a pressão física exercida pela multidão sem exigir que o resultado fosse literalmente esmagar Jesus; preserva a força e a amplitude contextual do verbo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «À sua disposição» comunica disponibilidade prática com naturalidade; «comprimissem» mantém a imagem concreta da pressão da multidão. O marcador foi colocado imediatamente após a expressão explicada.
