review_pass:
  verdict: revise
  source_fidelity: A oração final é corretamente entendida como a prevenção de pressão física da multidão sobre Jesus. Contudo, «mantivessem um pequeno barco» desloca o sujeito gramatical de πλοιάριον para os discípulos; embora o sentido prático seja próximo, uma formulação com o barco como sujeito preserva melhor a construção grega e a disponibilidade contínua expressa por προσκαρτερῇ.
  naturalness: «Que um pequeno barco ficasse à sua disposição» é claro, idiomático e mantém o fluxo natural em português moderno. «Não o apertassem» descreve de modo mais corrente a pressão de uma multidão do que «não o comprimissem».
  terminology: «Discípulos», «pequeno barco», «multidão» e «à sua disposição» são adequados. A nota deve conservar alternativas que tenham Jesus como objeto direto, pois θλίβωσιν αὐτόν significa que a multidão o pressiona.
  issues:
  - severity: low
    issue: O sujeito de προσκαρτερῇ é «um pequeno barco», não os discípulos.
    rationale: 'A redação proposta atribui aos discípulos a ação de manter o barco, uma explicitação contextualmente plausível, mas a formulação revisada preserva a sintaxe e a imagem do grego: o barco fica disponível para ele.'
  - severity: medium
    issue: A alternativa da nota «se apertassem contra ele» não corresponde bem à voz ativa de θλίβωσιν αὐτόν.
    rationale: 'O verbo tem Jesus como objeto: a multidão o aperta ou pressiona. «Se apertassem contra ele» pode sugerir uma ação reflexiva da multidão e deixa de exprimir com precisão essa relação.'
  revised_text: E disse aos seus discípulos que um pequeno barco ficasse à sua disposição por causa da multidão, para que não o apertassem.[a]
  revised_footnotes:
  - marker: a
    text: Ou «o pressionassem» ou «o esmagassem». O verbo grego pode indicar apertar, pressionar ou esmagar sob pressão.
    reason: lexical_alternative
