id: MRK.3.11
reference: Mark 3:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὰ πνεύματα τὰ ἀκάθαρτα, ὅταν αὐτὸν ⸂ἐθεώρουν, προσέπιπτον⸃ αὐτῷ καὶ ⸀ἔκραζον ⸀λέγοντα ὅτι Σὺ εἶ ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/011.yaml
  text: And whenever the unclean spirits saw him[a], they fell down before him and cried out, saying, “You are the Son of God.”
translation:
  language: pt
  text: 'E, sempre que os espíritos impuros o viam, prostravam-se diante dele e gritavam: “Você é o Filho de Deus!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεύματα τὰ ἀκάθαρτα
  choice: os espíritos impuros
  rationale: Tradução direta que preserva a ideia de impureza de ἀκάθαρτα sem substituí-la pela interpretação mais ampla “maus”.
- source_word: ὅταν
  choice: sempre que
  rationale: 'Com os verbos no imperfeito, expressa uma ocorrência repetida: isso acontecia cada vez que o viam.'
- source_word: ἐθεώρουν
  choice: viam
  rationale: Forma natural em português; o aspecto reiterado já é comunicado por “sempre que” e pelo imperfeito.
- source_word: προσέπιπτον αὐτῷ
  choice: prostravam-se diante dele
  rationale: Preserva a ação física de cair ou lançar-se diante de alguém, indicando submissão ou súplica sem afirmar explicitamente adoração.
- source_word: ἔκραζον
  choice: gritavam
  rationale: Comunica de modo claro e atual a intensidade de κράζω, sem tom excessivamente sensacionalista.
- source_word: λέγοντα
  choice: 'gritavam:'
  rationale: Em português, o conteúdo dito pode seguir diretamente o verbo “gritavam”; os dois-pontos evitam o redundante “gritavam, dizendo” sem perder o sentido do particípio.
- source_word: Σὺ εἶ
  choice: Você é
  rationale: Expressão natural e amplamente compreensível em português moderno. O pronome explícito mantém o foco em Jesus sem criar ênfase artificial.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: o Filho de Deus
  rationale: Preserva a forma titular e o peso cristológico da expressão grega.
theological_decisions:
- issue: Se a ação dos espíritos diante de Jesus deve ser traduzida como adoração ou como prostração
  choice: prostravam-se diante dele
  alternative: adoravam-no; curvavam-se diante dele; lançavam-se aos pés dele
  rationale: προσπίπτω descreve cair ou prostrar-se diante de alguém e pode envolver reverência, súplica ou submissão forçada. Como o texto não declara explicitamente que os espíritos prestavam culto, a tradução conserva a ação e a tensão teológica sem a resolver.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. “Espíritos impuros” mantém a terminologia concreta do texto; “prostravam-se” é corrente em registro bíblico sem ser arcaico. A pontuação direta após “gritavam” produz uma frase natural em português.
