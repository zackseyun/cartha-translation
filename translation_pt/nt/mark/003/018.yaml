  text: καὶ Ἀνδρέαν καὶ Φίλιππον καὶ Βαρθολομαῖον καὶ Μαθθαῖον καὶ Θωμᾶν καὶ Ἰάκωβον τὸν τοῦ Ἁλφαίου καὶ Θαδδαῖον καὶ Σίμωνα τὸν ⸀Καναναῖον
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/018.yaml
  text: and Andrew[a], and Philip, and Bartholomew, and Matthew, and Thomas, and James the son of Alphaeus, and Thaddaeus, and Simon the Cananaean.
translation:
  language: pt
  text: e André, Filipe, Bartolomeu, Mateus, Tomé, Tiago, filho de Alfeu, Tadeu e Simão, o Cananeu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, Cananeu; provavelmente significa “Zelote”, como em Lucas 6:15. Aqui, o termo não parece indicar que Simão fosse natural de Canaã.
    reason: Esclarece um qualificativo de provável origem aramaica que, em português, poderia ser entendido incorretamente como designação étnica ou geográfica.
lexical_decisions:
- source_word: καὶ
  choice: e
  rationale: A conjunção introduz e encadeia a continuação da lista. Em português, a repetição de «e» diante de cada nome seria pesada; ela é preservada no início e antes do último nome, segundo o uso natural.
- source_word: Ἀνδρέαν; Φίλιππον; Βαρθολομαῖον; Μαθθαῖον; Θωμᾶν; Θαδδαῖον
  choice: André; Filipe; Bartolomeu; Mateus; Tomé; Tadeu
  rationale: Empregam-se as formas tradicionais e amplamente reconhecidas desses nomes em português.
- source_word: Ἰάκωβον τὸν τοῦ Ἁλφαίου
  choice: Tiago, filho de Alfeu
  rationale: A construção com artigo e genitivo identifica Tiago por sua relação filial; «filho de Alfeu» expressa isso com clareza e naturalidade.
- source_word: Σίμωνα τὸν Καναναῖον
  choice: Simão, o Cananeu
  rationale: Mantém de modo transparente a forma distintiva usada por Marcos, sem transformá-la silenciosamente na forma «Zelote» encontrada no paralelo de Lucas. Uma nota esclarece o provável sentido sem sugerir indevidamente origem étnica.
theological_decisions:
- issue: Sentido do qualificativo Καναναῖος aplicado a Simão
  choice: Simão, o Cananeu
  alternative: Simão, o Zelote
  rationale: Embora o termo provavelmente reflita uma palavra aramaica que significa «zeloso» ou «zelote», Marcos emprega Καναναῖος, enquanto Lucas 6:15 usa explicitamente ζηλωτής. O texto conserva a forma marcana e a nota apresenta a provável interpretação, preservando a distinção e evitando afirmar mais do que a evidência permite.
translation_notes:
  register: Português atual, digno e de leitura ampla. A enumeração evita a repetição excessiva da conjunção, sem perder a estrutura de lista. A vírgula em «Tiago, filho de Alfeu» e «Simão, o Cananeu» torna naturais as expressões identificadoras.
