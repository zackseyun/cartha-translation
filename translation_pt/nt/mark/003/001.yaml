  text: Καὶ εἰσῆλθεν πάλιν ⸀εἰς συναγωγήν, καὶ ἦν ἐκεῖ ἄνθρωπος ἐξηραμμένην ἔχων τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/001.yaml
  text: And he entered a synagogue again[c][b][a], and a man was there with a withered hand.
translation:
  language: pt
  text: Ele entrou novamente numa sinagoga, e havia ali um homem com uma mão atrofiada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma mão ressequida” ou “uma mão mirrada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: entrou
  rationale: O aoristo de εἰσέρχομαι indica de modo simples a entrada no local; “entrou” é natural e direto em narrativa portuguesa.
- source_word: πάλιν
  choice: novamente
  rationale: πάλιν assinala repetição. “Novamente” preserva esse valor com registro corrente e digno.
- source_word: εἰς συναγωγήν
  choice: numa sinagoga
  rationale: Com verbo de movimento, “entrou numa sinagoga” expressa naturalmente em português a direção de εἰς. A ausência de artigo em grego favorece a leitura indefinida, sem impedir a alternativa definida.
- source_word: ἦν ἐκεῖ
  choice: estava ali
  rationale: A construção apresenta a presença do homem naquele lugar; “estava ali” traduz tanto o verbo quanto o advérbio sem repetição artificial.
- source_word: ἄνθρωπος
  choice: um homem
  rationale: Neste episódio, ἄνθρωπος refere-se naturalmente a um indivíduo do sexo masculino; “um homem” é preciso e idiomático.
- source_word: ἐξηραμμένην
  choice: atrofiada
  rationale: O particípio perfeito descreve a mão em condição persistente de ressecamento, encolhimento ou perda funcional. “Atrofiada” comunica claramente essa condição física em português moderno.
- source_word: ἔχων τὴν χεῖρα
  choice: que tinha uma das mãos atrofiada
  rationale: A oração relativa reproduz com naturalidade a construção participial. “Uma das mãos” evita a leitura estranha de uma mão indefinida e expressa idiomaticamente a parte corporal afetada.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A coordenação narrativa foi preservada, mas sem iniciar o versículo com “E”, já que “Ele entrou” mantém de forma natural a continuidade sugerida por Καί. A possível leitura definida de συναγωγήν não foi posta em nota, pois o contexto anterior imediato não identifica inequivocamente um edifício específico; a tradução indefinida preserva melhor a forma grega.
