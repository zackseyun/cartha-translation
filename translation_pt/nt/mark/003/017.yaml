  text: καὶ Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν τοῦ Ἰακώβου (καὶ ἐπέθηκεν αὐτοῖς ⸀ὀνόματα Βοανηργές, ὅ ἐστιν Υἱοὶ Βροντῆς),
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/017.yaml
  text: and James the son of Zebedee[a], and John the brother of James (he gave them the name Boanerges, which means Sons of Thunder),
translation:
  language: pt
  text: e Tiago, filho de Zebedeu, e João, irmão de Tiago (aos quais deu o nome[a] de Boanerges, que significa “Filhos do Trovão”),
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “nomes”, no plural; provavelmente o plural funciona coletivamente para um único apelido compartilhado pelos dois irmãos.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰάκωβον
  choice: Tiago
  rationale: Forma tradicional e amplamente reconhecida em português para Ἰάκωβος quando designa o apóstolo, embora o nome seja etimologicamente equivalente a Jacó.
- source_word: τὸν τοῦ Ζεβεδαίου
  choice: filho de Zebedeu
  rationale: A construção artigo + genitivo identifica Tiago por sua relação paterna; a explicitação de “filho” é idiomática e fiel ao sentido.
- source_word: Ἰωάννην
  choice: João
  rationale: Forma portuguesa tradicional e corrente do nome Ἰωάννης.
- source_word: τὸν ἀδελφὸν τοῦ Ἰακώβου
  choice: irmão de Tiago
  rationale: ἀδελφός indica aqui parentesco familiar literal.
- source_word: ἐπέθηκεν αὐτοῖς ὀνόματα
  choice: aos quais deu o nome
  rationale: Com ὀνόματα, ἐπιτίθημι significa atribuir ou dar nome. A formulação portuguesa é natural; o singular coletivo representa um apelido compartilhado, enquanto a nota registra o plural grego.
- source_word: Βοανηργές
  choice: Boanerges
  rationale: Preserva-se por transliteração a forma semítica que o próprio texto mantém antes de explicar seu significado.
- source_word: ὅ ἐστιν
  choice: que significa
  rationale: Introduz com clareza, em português atual, a interpretação do apelido semítico.
- source_word: Υἱοὶ Βροντῆς
  choice: Filhos do Trovão
  rationale: Tradução direta que conserva a imagem vívida e a função de apelido coletivo.
theological_decisions:
- issue: Forma do apelido explicativo dado a Tiago e João
  choice: Manter “Boanerges” e acrescentar a explicação “Filhos do Trovão”
  alternative: Traduzir apenas o significado, omitindo a forma transliterada
  rationale: O texto preserva tanto a forma estrangeira quanto sua interpretação; manter ambas respeita sua textura narrativa sem impor leitura doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Mantém-se a estrutura de continuação da lista do contexto e o parêntese do texto-fonte.
