review_pass:
  verdict: revise
  source_fidelity: 'A primeira oração traduz adequadamente ἐποίησεν δώδεκα como a constituição/designação de um grupo: “designou doze”. A primeira finalidade, “para que estivessem com ele”, corresponde bem a ἵνα ὦσιν μετ’ αὐτοῦ. Contudo, a segunda finalidade grega tem sujeito explícito no verbo, isto é, Jesus: καὶ ἵνα ἀποστέλλῃ αὐτούς κηρύσσειν. “E para enviá-los” pode ser entendida, mas perde a forma finita paralela e deixa menos claro que ele é quem os envia. “E para que os enviasse a pregar” preserva a estrutura e o sentido.'
  naturalness: '“Designou doze” e “pregar” são naturais em português moderno de ampla compreensão. A revisão torna as duas orações de finalidade paralelas e mais fluentes: “para que estivessem... e para que os enviasse...”. A vírgula final é adequadamente mantida, pois o período continua no versículo seguinte.'
  terminology: “Designou” comunica apropriadamente o valor contextual de ἐποίησεν, sem introduzir “apóstolos” no texto principal. A nota textual mantém corretamente a variante mais longa, e “proclamar” é uma alternativa lexical válida para κηρύσσειν.
  issues:
