    issue: A segunda oração de finalidade é traduzida por infinitivo (“e para enviá-los”), em vez de uma oração finita paralela.
    rationale: O grego repete ἵνα e usa ἀποστέλλῃ, cujo sujeito é Jesus. “E para que os enviasse a pregar” representa mais precisamente a sintaxe, explicita o agente e preserva o paralelismo das finalidades.
  revised_text: E ele designou doze[a], para que estivessem com ele e para que os enviasse a pregar[b],
