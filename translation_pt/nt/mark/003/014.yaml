base_translation:
  language: en
  yaml_path: translation/nt/mark/003/014.yaml
  text: And he appointed twelve[a], so that they might be with him and so that he might send them out to preach[b],
translation:
  language: pt
  text: E ele designou doze[a], para que estivessem com ele e para que os enviasse a pregar[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos acrescentam: “aos quais também chamou apóstolos”.'
    reason: textual_variant
  - marker: b
    text: Ou “a proclamar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: designou
  rationale: Embora o sentido básico seja “fez”, aqui o verbo indica que Jesus constituiu ou designou um grupo. “Designou” é natural em português e preserva esse sentido sem sugerir criação.
- source_word: δώδεκα
  choice: doze
  rationale: O grego traz apenas o numeral, sem substantivo expresso nem artigo. “Doze” preserva naturalmente essa elipse.
- source_word: ἵνα ὦσιν μετ’ αὐτοῦ
  choice: para que estivessem com ele
  rationale: A construção com ἵνα e subjuntivo expressa finalidade; esta formulação comunica com clareza o propósito e mantém a nuance verbal.
- source_word: ἀποστέλλῃ αὐτούς
  choice: para enviá-los
  rationale: O verbo significa enviar e pode envolver comissionamento. “Enviá-los” conserva o sentido sem inserir o título técnico “apóstolos”, ausente do texto principal da SBLGNT neste versículo.
- source_word: κηρύσσειν
  choice: a pregar
  rationale: O verbo indica proclamação pública. “Pregar” é conciso, corrente e apropriado ao contexto; “proclamar” permanece uma alternativa válida.
theological_decisions:
- issue: Inserção de um título apostólico implícito no texto principal
  choice: Não acrescentar “apóstolos” à tradução do versículo.
  alternative: “E designou doze, aos quais também chamou apóstolos...”
  rationale: O texto da SBLGNT fornecido diz apenas que ele designou doze. A leitura mais longa pertence a outra tradição textual e é registrada em nota, sem ser incorporada ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “para” reflete as duas orações de finalidade do grego. Mantém-se a vírgula final porque o versículo prossegue sintaticamente no contexto imediato.
