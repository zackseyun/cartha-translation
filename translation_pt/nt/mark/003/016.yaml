  text: καὶ ⸂ἐποίησεν τοὺς δώδεκα, καὶ⸃ ἐπέθηκεν ⸂ὄνομα τῷ Σίμωνι⸃ Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/016.yaml
  text: And he appointed the twelve[a], and he gave Simon the name Peter,
translation:
  language: pt
  text: E constituiu os doze e deu a Simão o nome de Pedro[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome grego Pedro significa “pedra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: constituiu
  rationale: Embora o verbo possa significar literalmente “fez”, neste contexto ele descreve Jesus formando e estabelecendo o grupo dos doze. “Constituiu” transmite esse sentido sem introduzir terminologia eclesiástica posterior.
- source_word: τοὺς δώδεκα
  choice: os doze
  rationale: Designa o grupo reconhecido dos doze discípulos. A forma em minúsculas corresponde de modo transparente ao grego; a capitalização não é exigida pelo texto-fonte.
- source_word: ἐπέθηκεν ὄνομα
  choice: deu ... o nome
  rationale: A expressão grega significa literalmente “pôs um nome”. A formulação escolhida preserva explicitamente o ato de dar um nome e soa natural em português.
- source_word: Σίμωνι
  choice: Simão
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: Πέτρον
  choice: Pedro
  rationale: Como Πέτρος funciona aqui como nome pessoal dado a Simão, usa-se a forma tradicional portuguesa. Seu significado é informado em nota, sem substituir o nome no texto.
theological_decisions:
- issue: A ação de Jesus em relação aos doze
  choice: constituiu os doze
  alternative: fez os doze; designou os doze
  rationale: O contexto apresenta Jesus estabelecendo o grupo dos doze. “Constituiu” preserva essa força institucional sem sugerir que ele os criou nem importar um cargo eclesiástico posterior.
- issue: Tratamento de Πέτρος
  choice: Pedro
  alternative: Pedra; Rocha
  rationale: O termo funciona como nome pessoal. A tradução mantém a forma portuguesa consagrada e registra em nota o conteúdo semântico do nome.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém-se a coordenação simples do grego e a vírgula final porque o versículo continua na sequência. O marcador da nota foi colocado após “Pedro”, termo ao qual a explicação lexical se refere.
