  text: καὶ περιβλεψάμενος ⸂τοὺς περὶ αὐτὸν κύκλῳ⸃ καθημένους λέγει· Ἴδε ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/034.yaml
  text: And looking around at those seated around him in a circle[a], he says, “Behold, my mother and my brothers!”
translation:
  language: pt
  text: 'E, olhando ao redor para os que estavam sentados em círculo à sua volta, ele diz: “Vejam! Aqui estão minha mãe e meus irmãos[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”. O grego diz literalmente “irmãos”, mas o grupo mais amplo ao redor de Jesus pode ter incluído também mulheres.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: olhando ao redor
  rationale: Preserva a ação deliberada de percorrer com o olhar as pessoas presentes, em linguagem portuguesa natural.
- source_word: τοὺς περὶ αὐτὸν κύκλῳ καθημένους
  choice: os que estavam sentados em círculo à sua volta
  rationale: 'Expressa os três elementos da frase grega: as pessoas sentadas, ao redor de Jesus e dispostas em círculo.'
- source_word: λέγει
  choice: ele diz
  rationale: Mantém o presente histórico característico da narrativa vívida de Marcos.
- source_word: Ἴδε
  choice: Vejam! Aqui estão
  rationale: O plural dirige naturalmente a atenção de todo o grupo; a combinação reproduz a força dêitica de Ἴδε sem recorrer ao arcaizante «eis».
- source_word: μήτηρ
  choice: mãe
  rationale: Equivalente lexical direto e natural.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Conserva a forma masculina plural do grego; em português, «irmãos» também pode abranger um grupo familiar misto, embora o sentido inclusivo seja esclarecido em nota.
theological_decisions:
- issue: O termo familiar masculino ἀδελφοί num grupo de seguidores que talvez incluísse mulheres
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A tradução principal preserva a forma masculina do texto grego sem excluir a possível referência coletiva a mulheres; a alternativa semântica é registrada em nota, evitando resolver além do que o original explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «À sua volta» evita a possível ambiguidade de «ao seu redor», enquanto «ele diz» conserva o presente histórico de Marcos.
