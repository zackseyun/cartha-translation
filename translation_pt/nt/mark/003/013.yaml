  text: Καὶ ἀναβαίνει εἰς τὸ ὄρος καὶ προσκαλεῖται οὓς ἤθελεν αὐτός, καὶ ἀπῆλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/013.yaml
  text: And he went up on the mountain and called to himself those whom he wanted[b][a], and they came to him.
translation:
  language: pt
  text: E ele subiu ao monte, chamou para junto de si os que ele mesmo quis, e eles foram até ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνει
  choice: subiu
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma natural na narrativa portuguesa, preservando a ideia de subida.
- source_word: εἰς τὸ ὄρος
  choice: ao monte
  rationale: Com o verbo de movimento ascendente, a expressão indica que Jesus subiu ao monte; esta formulação é natural e não força uma localização mais específica.
- source_word: προσκαλεῖται
  choice: chamou para junto de si
  rationale: A voz média sugere envolvimento pessoal e um chamado dirigido para junto do próprio Jesus; a expressão preserva essa nuance sem a formalidade de 'convocou'.
- source_word: οὓς ἤθελεν αὐτός
  choice: os que ele mesmo quis
  rationale: ‘Quis’ traduz θέλω de modo natural, enquanto ‘ele mesmo’ conserva a ênfase do pronome explícito αὐτός sem ampliar o texto para uma doutrina específica.
- source_word: ἀπῆλθον πρὸς αὐτόν
  choice: eles foram até ele
  rationale: ‘Foram’ reflete de modo transparente ἀπέρχομαι, e ‘até ele’ expressa o movimento em direção a Jesus indicado por πρὸς αὐτόν.
theological_decisions:
- issue: Ênfase na escolha pessoal de Jesus
  choice: os que ele mesmo quis
  alternative: os que ele quis
  rationale: A tradução mantém a ênfase de αὐτός na iniciativa pessoal de Jesus, mas não a transforma numa afirmação sobre um sistema teológico de eleição que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura permanece próxima do grego, mas usa tempos verbais e expressões naturais na narrativa portuguesa.
