source:
  edition: SBLGNT
  text: ⸂Καὶ ἔρχονται⸃ ⸂ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ⸃ καὶ ἔξω ⸀στήκοντες ἀπέστειλαν πρὸς αὐτὸν ⸀καλοῦντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/031.yaml
  text: Then his mother and his brothers came[a], and standing outside they sent word to him[b], calling him.
translation:
  language: pt
  text: Então chegaram sua mãe e seus irmãos e, estando do lado de fora, mandaram chamá-lo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Então
  rationale: No início da oração, καί faz a narrativa avançar; “Então” é natural em português e preserva essa função.
- source_word: ἔρχονται
  choice: chegaram
  rationale: O presente grego é histórico; o pretérito perfeito é a forma narrativa natural em português.
- source_word: ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: a mãe e os irmãos de Jesus
  rationale: A repetição de αὐτοῦ identifica a família dele; explicitar “de Jesus” evita em português uma sequência pesada de possessivos sem acrescentar interpretação.
- source_word: ἔξω στήκοντες
  choice: ficaram do lado de fora
  rationale: Expressa naturalmente a posição ou permanência deles fora do local, como indica o particípio presente.
- source_word: ἀπέστειλαν πρὸς αὐτὸν καλοῦντες αὐτόν
  choice: mandaram chamá-lo
  rationale: A construção descreve o envio de alguém ou de um recado para chamar Jesus; a expressão portuguesa reúne naturalmente a ação e sua finalidade.
theological_decisions:
- issue: Referência de οἱ ἀδελφοὶ αὐτοῦ
  choice: os irmãos de Jesus
  alternative: os parentes de Jesus
  rationale: “Irmãos” corresponde ao sentido direto de ἀδελφοί. O texto não define aqui a natureza biológica ou mais ampla desse parentesco, por isso a tradução não a especifica.
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa e ampla legibilidade brasileira. A oração foi dividida em duas frases para evitar uma cadeia de particípios pouco natural, sem perder nenhuma ação do grego.
