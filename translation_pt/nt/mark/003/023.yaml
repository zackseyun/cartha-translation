  text: καὶ προσκαλεσάμενος αὐτοὺς ἐν παραβολαῖς ἔλεγεν αὐτοῖς· Πῶς δύναται Σατανᾶς Σατανᾶν ἐκβάλλειν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/023.yaml
  text: 'And after calling them to himself, he was speaking to them in parables: “How can Satan cast out Satan?”'
translation:
  language: pt
  text: 'E, chamando-os para junto de si, falava-lhes em parábolas: “Como pode Satanás expulsar Satanás?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: chamou para perto
  rationale: O particípio aoristo médio indica que Jesus os chamou para junto de si antes de falar; a formulação preserva a sequência de modo natural em português.
- source_word: ἐν παραβολαῖς
  choice: por meio de parábolas
  rationale: Mantém o plural e comunica que Jesus usou comparações ou ilustrações ao falar, sem definir de modo excessivamente estreito a forma literária.
- source_word: ἔλεγεν
  choice: falava
  rationale: O imperfeito apresenta a fala em andamento ou como discurso desenvolvido; “falava” preserva esse aspecto com naturalidade.
- source_word: Πῶς δύναται
  choice: Como pode
  rationale: Expressa de modo conciso a pergunta retórica grega acerca da possibilidade.
- source_word: Σατανᾶς
  choice: Satanás
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἐκβάλλειν
  choice: expulsar
  rationale: No contexto de exorcismo em Marcos, “expulsar” é claro, atual e corresponde ao sentido de fazer sair à força.
theological_decisions:
- issue: Força da pergunta de Jesus sobre Satanás agir contra si mesmo
  choice: “Como pode Satanás expulsar Satanás?”
  alternative: “Como é possível que Satanás expulse Satanás?”
  rationale: A tradução conserva a forma retórica e a aparente impossibilidade apontada no contexto, sem acrescentar ao texto uma explicação teológica.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Então” liga o versículo ao contexto narrativo; “para perto” comunica de maneira idiomática o movimento em direção a Jesus.
