  text: ὃς ⸀γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ θεοῦ, οὗτος ἀδελφός μου καὶ ⸀ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/035.yaml
  text: For whoever does the will of God, this one is my brother and sister and mother.
translation:
  language: pt
  text: Pois quem fizer a vontade de Deus, esse[a] é meu irmão, minha irmã e minha mãe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “essa pessoa”. O grego usa aqui um demonstrativo enfático, literalmente “este”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ... ἂν ποιήσῃ
  choice: quem fizer
  rationale: A construção com pronome relativo, ἄν e aoristo do subjuntivo exprime uma condição geral indefinida. Em português, “quem fizer” preserva naturalmente tanto a abrangência de “quem quer que” quanto o valor eventual do subjuntivo.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação ou razão da declaração anterior. “Pois” mantém essa ligação de modo claro e conciso.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: a vontade de Deus
  rationale: É uma tradução direta e idiomática, com cadência bíblica natural em português contemporâneo.
- source_word: οὗτος
  choice: esse
  rationale: Preserva a força demonstrativa e enfática do grego, retomando de maneira natural a pessoa indicada por “quem fizer”.
- source_word: ἀδελφός μου καὶ ἀδελφὴ καὶ μήτηρ
  choice: meu irmão, minha irmã e minha mãe
  rationale: Mantém separadamente os três termos concretos de parentesco e explicita os possessivos exigidos pelo uso natural do português.
- source_word: ἐστίν
  choice: é
  rationale: Traduz diretamente a cópula singular, em concordância com o sujeito demonstrativo “esse”.
theological_decisions:
- issue: Representação de gênero no sujeito singular diante de termos de parentesco masculinos e femininos
  choice: esse
  alternative: ele; essa pessoa
  rationale: “Esse” conserva o demonstrativo singular do grego sem transformar a frase em plural. Os termos seguintes — “irmão”, “irmã” e “mãe” — deixam claro que a declaração não se restringe a homens.
- issue: Natureza da linguagem familiar de Jesus
  choice: manutenção de “irmão, irmã e mãe”
  alternative: membro da minha família; meu parente
  rationale: Os substantivos concretos devem ser preservados porque a enumeração redefine a pertença familiar em torno de fazer a vontade de Deus. Uma expressão genérica enfraqueceria a força retórica e teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Pois” preserva a conexão explicativa; “quem fizer” é idiomático e mantém a condição geral; “esse” conserva a ênfase demonstrativa sem recorrer a uma formulação pesada.
