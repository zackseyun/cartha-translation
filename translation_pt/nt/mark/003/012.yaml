source:
  edition: SBLGNT
  text: καὶ πολλὰ ἐπετίμα αὐτοῖς ἵνα μὴ ⸂αὐτὸν φανερὸν⸃ ⸀ποιήσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/012.yaml
  text: And he sternly warned them many times not to make him known[a].
translation:
  language: pt
  text: E repetidas vezes os advertia severamente para que não o tornassem conhecido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o revelassem”, “o tornassem público” ou, mais formalmente, “o manifestassem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: muitas vezes
  rationale: O neutro plural é usado adverbialmente com ἐπετίμα e comunica ação repetida ou enfática; “muitas vezes” preserva naturalmente essa força.
- source_word: ἐπετίμα
  choice: advertia severamente
  rationale: Expressa uma advertência ou ordem enérgica dirigida aos espíritos impuros, sem restringir o sentido a uma simples repreensão.
- source_word: αὐτοῖς
  choice: os
  rationale: Pronome que retoma os espíritos impuros mencionados no contexto imediato.
- source_word: ἵνα μὴ
  choice: para que não
  rationale: Mantém de modo natural tanto a finalidade quanto o conteúdo proibitivo da advertência.
- source_word: αὐτὸν φανερὸν ποιήσωσιν
  choice: o tornassem conhecido
  rationale: Reproduz a expressão idiomática no sentido de revelar ou tornar pública a identidade de alguém, sem acrescentar qual aspecto dessa identidade seria divulgado.
theological_decisions:
- issue: Natureza da ordem de Jesus aos espíritos impuros
  choice: A ordem proíbe que eles tornem Jesus conhecido, sem especificar além do que o versículo afirma.
  alternative: Explicitar que não deveriam revelar que ele era o Filho de Deus, ou entender a ordem apenas como uma ordem geral de silêncio.
  rationale: Embora o contexto imediato envolva a identidade de Jesus, o versículo diz somente que não deveriam torná-lo conhecido. A tradução preserva essa abertura e não introduz uma confissão cristológica mais explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “os advertia severamente, muitas vezes” conserva tanto a intensidade quanto a possível repetição da ação; a nota preserva as alternativas lexicais de φανερὸν ποιέω.
