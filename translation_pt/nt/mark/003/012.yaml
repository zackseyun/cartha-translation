  naturalness: “E os advertia severamente, muitas vezes” é compreensível, mas a vírgula e a posição de “muitas vezes” tornam a frase um pouco truncada em português. “E repetidas vezes os advertia severamente” é mais fluente e conserva o aspecto iterativo do imperfeito.
