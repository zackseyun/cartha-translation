id: MRK.3.27
reference: Mark 3:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂ἀλλ’ οὐδεὶς δύναται⸃ ⸂εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν τὰ σκεύη⸃ αὐτοῦ διαρπάσαι ἐὰν μὴ πρῶτον τὸν ἰσχυρὸν δήσῃ, καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/027.yaml
  text: But no one can enter the house of the strong man and plunder his goods unless he first ties up the strong man[b][a]; then indeed he will plunder his house.
translation:
  language: pt
  text: Mas ninguém pode entrar na casa do homem forte e saquear os bens dele sem primeiro amarrar o homem forte; então saqueará a casa dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto, o “homem forte” faz parte da comparação de Jesus sobre vencer Satanás; a tradução conserva a imagem sem tornar explícita essa interpretação no texto.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Mas
  rationale: Marca o contraste com a acusação anterior e introduz a refutação de Jesus de modo natural em português.
- source_word: οὐδεὶς δύναται
  choice: ninguém pode
  rationale: Expressa de maneira direta e idiomática a impossibilidade indicada pelo grego.
- source_word: εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν
  choice: entrar na casa do homem forte
  rationale: Reproduz com naturalidade a entrada na casa e mantém ἰσχυρός como adjetivo substantivado masculino dentro da metáfora.
- source_word: τὰ σκεύη αὐτοῦ
  choice: os bens dele
  rationale: No contexto de saque a uma casa, σκεύη abrange objetos, utensílios e pertences; “bens” comunica esse sentido sem restringi-lo a vasos ou utensílios.
- source_word: διαρπάσαι / διαρπάσει
  choice: saquear / saqueará
  rationale: Mantém a repetição do mesmo verbo grego e sua ideia forte de tomar e levar bens à força.
- source_word: ἐὰν μὴ πρῶτον
  choice: sem primeiro
  rationale: Formula idiomaticamente em português a condição necessária e sua prioridade temporal.
- source_word: δήσῃ
  choice: amarrar
  rationale: Preserva a imagem concreta de prender fisicamente o homem forte; é corrente e mais vívido que uma formulação abstrata.
- source_word: καὶ τότε
  choice: então
  rationale: Indica claramente que o saque ocorre somente depois de o homem forte ser amarrado.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: a casa dele
  rationale: Conserva a repetição e a imagem concreta da casa; “dele” reduz a possível ambiguidade pronominal no português corrente.
theological_decisions:
- issue: Identidade metafórica do “homem forte” no argumento de Jesus
  choice: Manter “o homem forte” sem identificar explicitamente a personagem no texto principal.
  alternative: Traduzir interpretativamente como “Satanás” ou “o poderoso”.
  rationale: O contexto aponta para Satanás, mas o grego apresenta uma comparação figurada. Preservar a metáfora evita converter interpretação contextual em conteúdo explícito do versículo.
- issue: Alcance metafórico de “casa”
  choice: Conservar a imagem concreta de “casa”.
  alternative: Explicitar como “domínio”, “reino” ou “tudo o que lhe pertence”.
  rationale: Embora a casa possa representar o domínio do homem forte, o texto não abandona a figura doméstica e não deve ser teologicamente expandido na tradução.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Saquear” conserva a força da ação, e “os bens dele” comunica naturalmente o sentido contextual de σκεύη. O marcador [a] aparece no texto principal.
