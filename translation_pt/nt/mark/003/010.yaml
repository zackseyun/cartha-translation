- from: Pois ele havia curado muitas pessoas, de modo que todos os que sofriam de enfermidades se comprimiam ao redor dele[a] para tocá-lo.
  to: Pois ele havia curado muitos, de modo que todos os que tinham aflições[b] avançavam sobre ele[a] para tocá-lo.
  rationale: A revisão corrige a imagem espacial e dinâmica de ἐπιπίπτειν αὐτῷ, substituindo o ajuntamento «ao redor» pelo avanço «sobre» Jesus. Também emprega «aflições» para preservar a amplitude semântica de μάστιγας e acrescenta uma nota ancorada ao termo para explicitar as alternativas relevantes.
