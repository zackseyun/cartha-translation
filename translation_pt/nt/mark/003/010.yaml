review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva bem a relação explicativa de γάρ, a anterioridade contextual de «havia curado», a finalidade de tocar Jesus e o valor abrangente de ὅσοι. Contudo, «se comprimiam ao redor dele» enfraquece e altera a direção de ἐπιπίπτειν αὐτῷ: o verbo descreve o avanço/ímpeto da multidão sobre Jesus, não meramente pessoas agrupadas ao seu redor. «Enfermidades» é possível no contexto, mas «aflições» mantém melhor a amplitude e a vividez figurada de μάστιγας.'
  naturalness: «Avançavam sobre ele» é português moderno, claro e suficientemente vigoroso no contexto de uma multidão, sem a estranheza de uma reprodução excessivamente literal como «caíam sobre ele». «Tinham aflições» é conciso e natural.
  terminology: «Aflições» para μάστιγας evita restringir o termo a doenças diagnosticáveis e não sugere os açoites literais. A nota registra tanto a alternativa mais literal para ἐπιπίπτω quanto o sentido figurado de μάστιγας.
  issues:
  - severity: medium
    issue: «Se comprimiam ao redor dele» para ἐπιπίπτειν αὐτῷ
    rationale: A expressão sugere cercar ou aglomerar-se em volta de Jesus; o grego enfatiza movimento impetuoso dirigido sobre ele. A substituição por «avançavam sobre ele» preserva melhor a força e a direção.
  - severity: low
    issue: «Enfermidades» para μάστιγας
    rationale: É aceitável no contexto de cura, mas torna o referente mais estritamente médico que o grego. «Aflições» conserva o escopo mais amplo do termo e seu caráter de sofrimento.
