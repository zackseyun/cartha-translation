source:
  edition: SBLGNT
  text: πολλοὺς γὰρ ἐθεράπευσεν, ὥστε ἐπιπίπτειν αὐτῷ ἵνα αὐτοῦ ἅψωνται ὅσοι εἶχον μάστιγας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/010.yaml
  text: For he had healed many, so that all who had afflictions were pressing in on him in order to touch him.
translation:
  language: pt
  text: Pois ele havia curado muitos, de modo que todos os que tinham aflições[b] avançavam sobre ele[a] para tocá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “caíam sobre ele”. O verbo grego é enérgico e descreve pessoas que avançavam impetuosamente em direção a Jesus.
    reason: lexical_alternative
  - marker: b
    text: Ou “enfermidades”, “doenças” ou “flagelos”. A palavra grega significa literalmente “açoites”, mas aqui se refere figuradamente a aflições ou males sofridos.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς
  choice: muitas pessoas
  rationale: O acusativo plural é objeto de ἐθεράπευσεν. Em português, explicitar “pessoas” torna a referência natural e inequívoca.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação da situação narrada no contexto e preserva a ligação argumentativa.
- source_word: ἐθεράπευσεν
  choice: havia curado
  rationale: O aoristo descreve a atividade anterior de Jesus que explica o comportamento da multidão; o mais-que-perfeito composto expressa naturalmente essa anterioridade em português.
- source_word: ὥστε
  choice: de modo que
  rationale: Introduz o resultado das muitas curas, preservando a relação lógica do texto grego.
- source_word: ἐπιπίπτειν αὐτῷ
  choice: se comprimiam ao redor dele
  rationale: No contexto de uma multidão, ἐπιπίπτω retrata pessoas avançando com ímpeto sobre Jesus. A formulação comunica a pressão física sem sugerir literalmente que caíam em cima dele.
- source_word: ἵνα
  choice: para
  rationale: Expressa de forma direta e natural a finalidade do movimento da multidão.
- source_word: αὐτοῦ ἅψωνται
  choice: tocá-lo
  rationale: ἅπτομαι com genitivo significa normalmente tocar; aqui o contexto de cura confirma o sentido físico.
- source_word: ὅσοι
  choice: todos os que
  rationale: Preserva a força abrangente do relativo e identifica os membros aflitos da multidão.
- source_word: εἶχον μάστιγας
  choice: sofriam de enfermidades
  rationale: μάστιξ significa literalmente “açoite”, mas é empregado figuradamente para males dolorosos ou doenças. “Sofriam de enfermidades” transmite tanto a condição quanto seu peso, sem recorrer a uma tradução literal enganosa.
theological_decisions:
- issue: Natureza de μάστιγας no contexto de cura
  choice: enfermidades
  alternative: aflições; doenças; flagelos
  rationale: O contexto aponta para males dos quais as pessoas buscavam cura, mas o termo grego é vívido e não estritamente clínico. “Enfermidades”, com o verbo “sofriam”, preserva o sentido de padecimento sem especificar diagnósticos nem importar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pois” mantém a conexão explicativa; “se comprimiam ao redor dele” reproduz a pressão da multidão em linguagem natural. A nota conserva a força e a possível formulação mais literal de ἐπιπίπτω.
