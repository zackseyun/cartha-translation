source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς οἱ ἀπὸ Ἱεροσολύμων καταβάντες ἔλεγον ὅτι Βεελζεβοὺλ ἔχει καὶ ὅτι ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/022.yaml
  text: And the scribes who had come down from Jerusalem were saying[a], “He has Beelzebul,” and[c][b], “By the ruler of the demons he casts out the demons.”
translation:
  language: pt
  text: 'E os escribas que tinham descido de Jerusalém diziam: “Ele tem Belzebul[a][b]” e “É pelo governante[c] dos demônios que ele expulsa os demônios.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: “Ele está possuído por Belzebul.”'
    reason: lexical_alternative
  - marker: b
    text: Grego Βεελζεβούλ; tradicionalmente traduzido como “Belzebu”.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “pelo príncipe dos demônios”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: escribas
  rationale: É o termo tradicional e ainda compreensível no contexto dos Evangelhos, designando especialistas reconhecidos na Lei, não meros copistas.
- source_word: ἀπὸ Ἱεροσολύμων καταβάντες
  choice: que tinham descido de Jerusalém
  rationale: A oração relativa é natural em português; o mais-que-perfeito composto situa a chegada antes da acusação, e “descido” preserva a orientação geográfica expressa no grego.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito português reproduz naturalmente o aspecto contínuo ou repetido do imperfeito grego.
- source_word: Βεελζεβοὺλ
  choice: Belzebul
  rationale: Translitera diretamente a forma Βεελζεβούλ do texto grego; a forma portuguesa tradicional “Belzebu” é preservada em nota.
- source_word: ἔχει
  choice: tem
  rationale: Mantém a formulação concisa e ambígua do grego. O sentido contextual mais explícito, “está possuído por”, aparece em nota sem substituir o idioma do texto-fonte.
- source_word: ἐν τῷ ἄρχοντι τῶν δαιμονίων
  choice: pelo governante dos demônios
  rationale: Neste contexto, ἐν tem valor instrumental ou associativo; “pelo” comunica que a acusação atribui a expulsão ao poder do chefe demoníaco. “Governante” é atual e expressa autoridade sem recorrer ao mais tradicional “príncipe”.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: expulsa os demônios
  rationale: “Expulsar” exprime com clareza e naturalidade a remoção forçada indicada por ἐκβάλλω no contexto de exorcismo, enquanto δαιμόνια é traduzido diretamente por “demônios”.
theological_decisions:
- issue: Sentido da acusação Βεελζεβοὺλ ἔχει
  choice: Ele tem Belzebul
  alternative: Ele está possuído por Belzebul
  rationale: A tradução principal preserva o idioma e a tensão do grego, sem decidir no corpo do texto se a acusação descreve possessão, controle ou influência; a explicitação contextual é oferecida em nota.
- issue: Tradução de ἄρχων
  choice: governante dos demônios
  alternative: príncipe dos demônios
  rationale: “Governante” comunica de modo atual a ideia de autoridade. “Príncipe” é possível e tradicional, mas pode sugerir ao leitor moderno um título hereditário não exigido pelo grego.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe conserva as duas acusações coordenadas e o aspecto durativo de “diziam”. A construção enfática “É pelo governante... que” torna natural em português a posição inicial da expressão instrumental no grego, sem acrescentar conteúdo.
