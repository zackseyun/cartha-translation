  text: Καὶ ὁ Ἰησοῦς ⸂μετὰ τῶν μαθητῶν αὐτοῦ ἀνεχώρησεν⸃ πρὸς τὴν θάλασσαν· καὶ πολὺ πλῆθος ἀπὸ τῆς Γαλιλαίας ⸀ἠκολούθησεν, καὶ ἀπὸ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/007.yaml
  text: And Jesus withdrew with his disciples to the sea[a], and a great crowd from Galilee followed, and from Judea[b],
translation:
  language: pt
  text: Jesus se retirou com os seus discípulos para o mar[a][b], e uma grande multidão da Galileia o seguiu, e da Judeia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em direção ao mar”. A preposição grega pode indicar movimento em direção ao mar.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o mar da Galileia. O texto grego diz simplesmente “o mar”.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: se retirou
  rationale: Preserva a ideia de afastar-se ou retirar-se, possivelmente diante de oposição ou pressão, sem tornar explícita uma causa que o texto não declara.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: com os seus discípulos
  rationale: “Discípulos” é a expressão corrente e adequada no contexto dos Evangelhos, abrangendo aprendizado e seguimento pessoal.
- source_word: πρὸς τὴν θάλασσαν
  choice: em direção ao mar
  rationale: A preposição πρός com acusativo indica movimento na direção do mar, sem exigir que se afirme a chegada à margem; “mar” mantém o termo empregado pelo texto grego.
- source_word: πολὺ πλῆθος
  choice: uma grande multidão
  rationale: Expressa naturalmente em português o tamanho considerável do grupo e conserva a ênfase do original.
- source_word: ἠκολούθησεν
  choice: o seguiu
  rationale: O verbo indica que a multidão acompanhou Jesus; o pronome explicita em português o referente já claro no contexto grego.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: vinda da Galileia
  rationale: Comunica a procedência da multidão em português natural.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: também veio gente da Judeia
  rationale: Torna natural a continuação da lista de procedências, que se estende ao versículo seguinte, sem sugerir que toda a multidão tenha uma única origem.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pontuação e a vírgula final preservam o fato de que a enumeração continua no versículo seguinte. Os marcadores foram posicionados junto às expressões que explicam; por isso, a nota cultural sobre o “mar” aparece no marcador [b] após a menção à Judeia conforme o material fornecido, embora seu referente seja “mar”.
