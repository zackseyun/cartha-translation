  text: Ἀμὴν λέγω ὑμῖν ὅτι πάντα ἀφεθήσεται ⸂τοῖς υἱοῖς τῶν ἀνθρώπων, τὰ ἁμαρτήματα⸃ καὶ ⸂αἱ βλασφημίαι ὅσα ἐὰν⸃ βλασφημήσωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/028.yaml
  text: Truly I tell you that all sins will be forgiven to the sons of men[a], and whatever blasphemies they may utter;
translation:
  language: pt
  text: Em verdade lhes digo que todos os pecados serão perdoados aos filhos dos homens[a], e quaisquer blasfêmias que proferirem;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos seres humanos” ou “às pessoas”. A expressão grega “filhos dos homens” refere-se genericamente à humanidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Em verdade
  rationale: Na fórmula solene dos Sinópticos, comunica naturalmente a força asseverativa de Ἀμήν sem recorrer à transliteração.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Mantém a primeira pessoa, o presente e o endereço plural em português corrente e digno.
- source_word: πάντα
  choice: todos
  rationale: O neutro plural tem alcance abrangente sobre os substantivos que se seguem; em português, a concordância com “pecados” torna a formulação natural.
- source_word: ἀφεθήσεται
  choice: serão perdoados
  rationale: No contexto de pecados, o futuro passivo de ἀφίημι expressa perdão. O plural português decorre da construção natural com “todos os pecados”.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: aos filhos dos homens
  rationale: Preserva a forma semítica e masculina representativa da expressão grega, enquanto a nota esclarece seu sentido humano inclusivo.
- source_word: τὰ ἁμαρτήματα
  choice: os pecados
  rationale: Designa atos de pecado; o artigo é natural em português após “todos”.
- source_word: αἱ βλασφημίαι
  choice: todas as blasfêmias
  rationale: “Blasfêmias” mantém a força religiosa exigida pelo contexto; “todas” explicita em português o alcance de ὅσα ἐάν sobre o substantivo.
- source_word: ὅσα ἐὰν βλασφημήσωσιν
  choice: que proferirem
  rationale: A oração relativa indefinida é vertida de modo idiomático; o futuro do subjuntivo preserva o caráter aberto da expressão, e “proferir blasfêmias” evita repetição inelegante.
theological_decisions:
- issue: Alcance da declaração de perdão diante da advertência subsequente sobre a blasfêmia contra o Espírito Santo
  choice: Manter neste versículo a declaração abrangente de perdão, sem antecipar a exceção do versículo seguinte.
  alternative: Inserir aqui uma limitação implícita ao alcance do perdão.
  rationale: O texto primeiro afirma amplamente o perdão e só depois apresenta a advertência. A tradução deve preservar essa tensão literária e teológica.
- issue: Sentido genérico de τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: Manter “aos filhos dos homens” no texto principal e esclarecer na nota que a expressão abrange os seres humanos em geral.
  alternative: Traduzir diretamente por “aos seres humanos” ou “às pessoas”.
  rationale: A opção preserva a forma representativa e semítica do original sem obscurecer seu sentido inclusivo para o leitor moderno.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Em verdade lhes digo” conserva a solenidade formular; “bem como” liga naturalmente os dois grupos abrangidos sem enfraquecer a declaração. O ponto e vírgula preserva a continuidade com o versículo seguinte.
