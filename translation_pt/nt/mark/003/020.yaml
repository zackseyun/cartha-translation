  text: Καὶ ⸀ἔρχεται εἰς οἶκον· καὶ συνέρχεται πάλιν ⸀ὁ ὄχλος, ὥστε μὴ δύνασθαι αὐτοὺς ⸀μηδὲ ἄρτον φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/020.yaml
  text: And he comes into a house[a], and the crowd gathers again[c][b], so that they are not even able to eat bread.
translation:
  language: pt
  text: E ele entra numa casa[a], e a multidão se reúne novamente, de modo que eles não conseguem nem comer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «vai para casa». O grego diz literalmente «entra numa casa», mas a expressão também pode ter o sentido idiomático de ir para casa.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «comer pão»; isto é, fazer uma refeição.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: entra
  rationale: O presente histórico preserva a vivacidade característica de Marcos; com εἰς οἶκον, o português natural pede o verbo de movimento «entra».
- source_word: εἰς οἶκον
  choice: numa casa
  rationale: A expressão não tem artigo nem possessivo explícito. «Numa casa» evita identificar indevidamente o local, enquanto a possível leitura idiomática «para casa» é preservada em nota.
- source_word: συνέρχεται πάλιν ὁ ὄχλος
  choice: a multidão se reúne novamente
  rationale: «Se reúne» expressa naturalmente o sentido intransitivo de ajuntamento; «novamente» preserva πάλιν.
- source_word: ὥστε μὴ δύνασθαι αὐτοὺς
  choice: de modo que eles não conseguem
  rationale: A construção com ὥστε e infinitivo indica resultado. O presente acompanha os presentes históricos anteriores, e «eles» mantém a referência plural de αὐτούς sem explicitar além do texto.
- source_word: μηδὲ ἄρτον φαγεῖν
  choice: nem comer
  rationale: Aqui «comer pão» funciona idiomaticamente como comer ou tomar uma refeição. A tradução corrente comunica o sentido sem uma expressão pouco natural em português; a forma literal é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com presente histórico para conservar a vivacidade narrativa de Marcos. A ordem foi ajustada à sintaxe natural do português sem resolver a ambiguidade quanto à casa nem identificar explicitamente quem está incluído em «eles».
