base_translation:
  language: en
  yaml_path: translation/nt/mark/003/033.yaml
  text: And answering them[a], he says[b], “Who are my mother and my brothers?”
translation:
  language: pt
  text: 'E, respondendo-lhes, diz: “Quem são minha mãe e meus irmãos?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Quem é minha mãe ou meus irmãos?”, com o verbo no singular, em concordância com o primeiro elemento, e com “ou” no grego. Em português, “Quem são minha mãe e meus irmãos?” expressa naturalmente a pergunta que abrange ambos.
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: respondendo
  rationale: Preserva o particípio aoristo grego e, em combinação com “diz”, mantém o estilo narrativo vívido de Marcos.
- source_word: αὐτοῖς
  choice: -lhes
  rationale: O pronome dativo indica os destinatários da resposta; “respondendo-lhes” expressa isso de modo claro e corrente em português.
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico de Marcos e sua vivacidade narrativa.
- source_word: Τίς
  choice: Quem
  rationale: Equivalente direto e natural do pronome interrogativo que pergunta pela identidade.
- source_word: μήτηρ
  choice: mãe
  rationale: Termo familiar padrão, natural e digno em português.
- source_word: ἢ
  choice: ou
  rationale: Reproduz a conjunção disjuntiva do texto grego sem convertê-la interpretativamente em “e”.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva o plural masculino do grego, que no contexto imediato se refere aos irmãos de Jesus, sem ampliá-lo para “irmãos e irmãs”.
theological_decisions:
- issue: Terminologia familiar de ἀδελφοί
  choice: irmãos
  alternative: irmãos e irmãs; familiares
  rationale: O plural masculino deve ser preservado, sem inserir uma ampliação inclusiva ou uma interpretação denominacional sobre o parentesco exato.
- issue: Relação entre mãe e irmãos na pergunta
  choice: “mãe ou meus irmãos”
  alternative: “mãe e meus irmãos”
  rationale: A tradução principal conserva o ἢ (“ou”) do texto grego e sua tensão sintática, enquanto a forma mais idiomática com “e” é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação principal conserva o particípio, o presente histórico, a conjunção disjuntiva e a concordância singular do grego; as notas oferecem a expressão portuguesa mais idiomática.
