lexical_decisions:
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa natural, ligando esta expressão infinitiva às declarações anteriores sobre a missão dos Doze.
- source_word: ἔχειν
  choice: terem
  rationale: O infinitivo flexionado concorda naturalmente com o sujeito plural recuperado do contexto e preserva a construção da sequência.
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: Expressa a autoridade ou prerrogativa concedida para agir, mais precisamente do que apenas força ou capacidade.
- source_word: ἐκβάλλειν
  choice: expulsar
  rationale: Equivalente corrente e preciso no contexto de exorcismo, mantendo a ideia de fazer sair à força.
- source_word: τὰ δαιμόνια
  choice: demônios
  rationale: Traduz diretamente δαιμόνια, sem substituir o termo pela expressão diferente “espíritos impuros”.
theological_decisions:
- issue: Natureza de ἐξουσία na missão dos discípulos
  choice: autoridade
  alternative: poder
  rationale: O contexto enfatiza uma prerrogativa concedida por Jesus, sem negar a capacidade sobrenatural envolvida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Terem” recupera naturalmente o sujeito plural do contexto; “expulsar demônios” é uma formulação corrente e fiel ao grego.
