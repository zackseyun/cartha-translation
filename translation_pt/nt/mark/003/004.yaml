source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἔξεστιν τοῖς σάββασιν ⸀ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ἀποκτεῖναι; οἱ δὲ ἐσιώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/004.yaml
  text: And he said to them[a], “Is it lawful on the Sabbath to do good or to do harm[b], to save a life or to kill?” But they were silent.
translation:
  language: pt
  text: 'E ele lhes disse: “É permitido, no sábado[a], fazer o bem ou fazer o mal, salvar uma vida ou matar?” Mas eles permaneceram em silêncio.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “nos sábados”; o plural é um idiomatismo comum para “no sábado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔξεστιν
  choice: É permitido
  rationale: No debate sobre a observância do sábado, o verbo pergunta o que a lei permite. “É permitido” comunica essa força jurídica e ética de modo natural em português.
- source_word: τοῖς σάββασιν
  choice: no sábado
  rationale: Embora a forma grega esteja no plural, trata-se de um idiomatismo comum que, neste contexto, se refere ao sábado como dia de observância. O singular é a forma natural e inequívoca em português.
- source_word: ἀγαθοποιῆσαι
  choice: fazer o bem
  rationale: Tradução direta, concisa e corrente do infinitivo, preservando o contraste ético com fazer o mal.
- source_word: κακοποιῆσαι
  choice: fazer o mal
  rationale: Preserva tanto o paralelismo verbal com “fazer o bem” quanto a dimensão moral do termo; “causar dano” seria possível, mas estreitaria seu alcance.
- source_word: ψυχὴν σῶσαι
  choice: salvar uma vida
  rationale: Neste contraste com matar, ψυχή designa a vida de uma pessoa, não especificamente uma alma imaterial.
- source_word: ἀποκτεῖναι
  choice: matar
  rationale: Expressa o sentido básico do verbo sem acrescentar a qualificação jurídica de “assassinar”.
- source_word: ἐσιώπων
  choice: ficaram calados
  rationale: Forma narrativa natural em português que comunica a ausência persistente de resposta indicada pelo imperfeito grego.
theological_decisions:
- issue: Sentido do plural grego na expressão sobre o sábado
  choice: 'Traduzir idiomaticamente no singular: “no sábado”'
  alternative: “nos sábados”
  rationale: O plural grego é um idiomatismo corrente e o episódio ocorre em um sábado específico. O singular evita sugerir indevidamente uma série de sábados, enquanto a forma do original é documentada em nota.
- issue: Contraste entre ἀγαθοποιῆσαι e κακοποιῆσαι
  choice: “fazer o bem ou fazer o mal”
  alternative: “fazer o bem ou causar dano”
  rationale: A formulação mantém o paralelismo e a tensão ética ampla da pergunta. O contexto de salvar ou matar esclarece suas consequências concretas sem exigir que a tradução reduza κακοποιῆσαι apenas à ideia de dano.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. Conservou-se “disse” para refletir λέγει, embora a fala tenha forma de pergunta. A conjunção inicial e o contraste final foram mantidos sem tornar a sintaxe excessivamente literal.
