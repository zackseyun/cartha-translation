  text: καὶ ἐὰν οἰκία ἐφ’ ἑαυτὴν μερισθῇ, οὐ ⸀δυνήσεται ⸂ἡ οἰκία ἐκείνη σταθῆναι⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/025.yaml
  text: And if a house is divided against itself[a], that house will not be able to stand.
translation:
  language: pt
  text: E, se uma casa estiver dividida contra si mesma[a], essa casa não poderá ficar de pé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “família” ou “grupo doméstico” em lugar de “casa” (οἰκία), embora a metáfora imediata de “ficar de pé” favoreça “casa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: casa
  rationale: Preserva o sentido concreto principal e a imagem de uma estrutura que pode ou não ficar de pé; o sentido coletivo de “família” ou “grupo doméstico” continua possível e é registrado em nota.
- source_word: ἐφ’ ἑαυτὴν
  choice: contra si mesma
  rationale: Expressa naturalmente em português a oposição interna indicada pela construção grega com pronome reflexivo.
- source_word: μερισθῇ
  choice: estiver dividida
  rationale: Reproduz a condição eventual expressa pelo aoristo passivo do subjuntivo após ἐάν, em formulação portuguesa natural.
- source_word: δυνήσεται
  choice: poderá
  rationale: O futuro de δύναμαι indica capacidade futura; “poderá” preserva essa força de maneira clara e concisa.
- source_word: σταθῆναι
  choice: ficar de pé
  rationale: Mantém a metáfora concreta ligada à casa e comunica também, por implicação, a ideia de permanecer ou subsistir.
- source_word: ἡ οἰκία ἐκείνη
  choice: essa casa
  rationale: O demonstrativo retoma a casa mencionada na condição; “essa” é a escolha mais natural no português corrente para essa referência textual.
- source_word: καὶ ἐὰν
  choice: E, se
  rationale: Preserva tanto a conexão com o argumento anterior quanto a introdução da condição.
theological_decisions: []
