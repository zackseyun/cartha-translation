  text: ὃς δ’ ἂν βλασφημήσῃ εἰς τὸ πνεῦμα τὸ ἅγιον, οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα, ἀλλὰ ἔνοχός ἐστιν αἰωνίου ⸀ἁμαρτήματος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/029.yaml
  text: but whoever blasphemes against the Holy Spirit never has forgiveness[c][b][a], but is guilty of an eternal sin.
translation:
  language: pt
  text: Mas quem blasfemar contra o Espírito Santo nunca tem perdão[a], mas é réu de pecado eterno[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não tem perdão para a era”, expressão que, em contexto negativo, também pode ser traduzida por “não tem perdão para sempre” ou “nunca tem perdão”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “é passível de pecado eterno”.'
    reason: lexical_alternative
  - marker: c
    text: Alguns manuscritos trazem “julgamento eterno” ou “condenação eterna” em vez de “pecado eterno”.
    reason: textual_variant
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: mas quem
  rationale: ὃς com ἄν introduz uma oração relativa indefinida, expressa naturalmente por “quem”; δέ marca aqui o contraste com a declaração anterior e é traduzido por “mas”.
- source_word: βλασφημήσῃ
  choice: blasfemar
  rationale: O aoristo do subjuntivo com ἄν tem força geral. “Blasfemar” conserva tanto o sentido de fala injuriosa quanto o peso religioso do verbo.
- source_word: εἰς τὸ πνεῦμα τὸ ἅγιον
  choice: contra o Espírito Santo
  rationale: Neste uso, εἰς indica o alvo da blasfêmia; “contra” é a forma idiomática e clara em português.
- source_word: οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα
  choice: nunca terá perdão
  rationale: Em contexto negativo, εἰς τὸν αἰῶνα tem sentido idiomático de “nunca” ou “para sempre”. O futuro em português exprime naturalmente a consequência permanente da condição, embora o grego use literalmente “não tem”.
- source_word: ἀλλὰ ἔνοχός ἐστιν
  choice: mas será culpado
  rationale: ἀλλά introduz forte contraste, e ἔνοχος pode indicar culpa ou sujeição a uma consequência. “Será culpado” é natural em português e se ajusta à formulação condicional.
- source_word: αἰωνίου ἁμαρτήματος
  choice: de um pecado eterno
  rationale: A leitura do SBLGNT traz ἁμάρτημα, “pecado”, modificado por αἰώνιος, “eterno”; a tradução segue diretamente o texto-base.
theological_decisions:
- issue: Natureza da ofensa imperdoável
  choice: Manter a formulação direta “blasfemar contra o Espírito Santo” sem qualificações interpretativas.
  alternative: Explicá-la como rejeição deliberada e persistente do testemunho do Espírito ou como atribuição da obra do Espírito ao poder demoníaco.
  rationale: O contexto imediato orienta a compreensão, mas o versículo formula a ofensa diretamente. Acrescentar uma definição doutrinária resolveria uma tensão que o próprio texto preserva.
- issue: Variante textual no fim do versículo
  choice: Traduzir a leitura do SBLGNT, “pecado eterno”.
  alternative: “julgamento eterno” ou “condenação eterna”.
  rationale: O texto grego fornecido lê αἰωνίου ἁμαρτήματος. As variantes conhecidas devem ser registradas em nota, não inseridas no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva o termo teológico tradicional “blasfemar” e evita explicar no corpo do versículo a natureza precisa da blasfêmia.
