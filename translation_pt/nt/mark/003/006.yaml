source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ Φαρισαῖοι ⸀εὐθὺς μετὰ τῶν Ἡρῳδιανῶν συμβούλιον ⸀ἐδίδουν κατ’ αὐτοῦ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/006.yaml
  text: And the Pharisees went out and immediately began plotting with the Herodians against him[a], how they might destroy him.
translation:
  language: pt
  text: Os fariseus saíram e imediatamente começaram a tramar com os herodianos contra ele, buscando um modo de destruí-lo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais explicitamente neste contexto, “matá-lo” ou “levá-lo à morte”.
    reason: Alternativa lexical que explicita a intenção letal indicada pelo contexto sem restringir o sentido mais amplo de ἀπόλλυμι no texto principal.
lexical_decisions:
- source_word: ἐξελθόντες
  choice: saíram
  rationale: O particípio aoristo expressa uma ação associada à principal; em narrativa portuguesa, a forma finita “saíram” é natural e preserva o movimento para fora do local anterior.
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Mantém a urgência narrativa característica de Marcos em linguagem corrente e digna.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: com os herodianos
  rationale: μετά com genitivo indica associação. “Herodianos” é a designação tradicional e transparente do grupo ligado aos interesses da dinastia de Herodes.
- source_word: συμβούλιον ἐδίδουν
  choice: começaram a tramar
  rationale: A expressão idiomática significa deliberar ou fazer planos; o propósito hostil torna apropriado “tramar”. “Começaram” comunica de modo natural o valor ingressivo ou progressivo do imperfeito ἐδίδουν.
- source_word: κατ’ αὐτοῦ
  choice: contra ele
  rationale: κατά com genitivo tem aqui sentido adversativo, confirmado pelo propósito hostil da deliberação.
- source_word: ὅπως
  choice: buscando um modo de
  rationale: Com o subjuntivo, introduz propósito e também admite a nuance de deliberação sobre como executar o plano. A formulação portuguesa evita uma construção rígida e preserva ambas as ideias.
- source_word: ἀπολέσωσιν
  choice: destruí-lo
  rationale: ἀπόλλυμι pode significar destruir, arruinar ou matar. “Destruí-lo” conserva a amplitude lexical, enquanto o contexto deixa clara a intenção de eliminar Jesus; a alternativa mais explícita é registrada em nota.
theological_decisions:
- issue: Se a intenção dos líderes deve ser explicitamente apresentada como homicida no texto principal
  choice: Manter “destruí-lo” no texto principal.
  alternative: Traduzir “matá-lo” ou “levá-lo à morte”.
  rationale: Neste contexto, a intenção é claramente letal, mas ἀπόλλυμι possui sentido mais amplo que o verbo português “matar”. A tradução principal preserva essa amplitude sem ocultar a leitura contextual, explicitada na nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Tramar” comunica com clareza a deliberação conspiratória sem soar técnico; a estrutura mantém o ritmo urgente da narrativa de Marcos.
