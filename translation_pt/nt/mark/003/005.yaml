  source_fidelity: O texto preserva adequadamente a sequência participial do grego, a ira e o pesar de Jesus, a causa desse pesar, o presente histórico («diz»), a ordem e a restauração passiva da mão. «Do coração deles» reproduz de modo defensável o singular grego καρδίας com possessivo plural, sem transformar a construção em uma afirmação teológica adicional.
