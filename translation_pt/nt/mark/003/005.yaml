id: MRK.3.5
reference: Mark 3:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος αὐτοὺς μετ’ ὀργῆς, συλλυπούμενος ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν, λέγει τῷ ἀνθρώπῳ· Ἔκτεινον τὴν ⸀χεῖρα· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/005.yaml
  text: And after looking around at them with anger[a], grieved at the hardness of their hearts, he says to the man, “Stretch out your hand.” And he stretched it out, and his hand was restored.
translation:
  language: pt
  text: 'E, depois de olhar ao redor para eles com ira, entristecido com a dureza do coração deles[a], diz ao homem: “Estenda a mão.” Ele a estendeu, e sua mão foi restaurada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos corações deles”. O grego traz “coração” no singular, provavelmente em sentido coletivo.
    reason: Alternativa lexical e esclarecimento do singular coletivo no texto-fonte.
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: depois de olhar ao redor para eles
  rationale: O particípio aoristo indica uma ação anterior ao verbo principal e descreve Jesus percorrendo com o olhar as pessoas ao redor; a formulação mantém essa sequência em português natural.
- source_word: μετ’ ὀργῆς
  choice: com ira
  rationale: μετά com genitivo expressa a maneira ou emoção concomitante. “Ira” preserva diretamente a força do termo sem suavizar a reação de Jesus.
- source_word: συλλυπούμενος
  choice: entristecido
  rationale: O particípio expressa dor ou pesar. “Entristecido” é corrente e digno, sem acrescentar uma intensidade não explicitada no texto.
- source_word: ἐπὶ τῇ πωρώσει
  choice: com a dureza
  rationale: ἐπί com dativo indica aqui o motivo do pesar, enquanto πώρωσις conserva a metáfora de endurecimento ou insensibilidade. Em português, “entristecido com” comunica naturalmente essa relação causal.
- source_word: τῆς καρδίας αὐτῶν
  choice: do coração deles
  rationale: καρδίας está no singular, acompanhado de pronome plural. O português permite conservar com naturalidade esse singular coletivo, deixando a alternativa plural em nota.
- source_word: λέγει
  choice: diz
  rationale: O presente histórico de Marcos foi preservado para manter a vivacidade narrativa, em vez de ser nivelado para o passado.
- source_word: τῷ ἀνθρώπῳ
  choice: ao homem
  rationale: O termo se refere ao homem específico da cena; esta é a forma concreta e natural em português.
- source_word: Ἔκτεινον τὴν χεῖρα
  choice: Estenda a mão
  rationale: O imperativo pede uma ação definida. “Estenda a mão” é claro, atual e corresponde precisamente ao movimento indicado por ἐκτείνω.
- source_word: ἐξέτεινεν
  choice: Ele a estendeu
  rationale: A tradução retoma o verbo da ordem e usa o pronome para evitar repetição pesada, como o grego também deixa o objeto subentendido.
- source_word: ἀπεκατεστάθη
  choice: foi restaurada
  rationale: O passivo descreve o retorno da mão à condição adequada. “Foi restaurada” é mais específico ao verbo do que simplesmente “foi curada”.
theological_decisions:
- issue: A ira e a tristeza de Jesus
  choice: 'Traduzir explicitamente as duas emoções: “com ira” e “entristecido”.'
  alternative: Suavizar ὀργή como “indignação” ou ampliar συλλυπούμενος como “profundamente entristecido”.
  rationale: O texto apresenta simultaneamente ira e pesar. A tradução preserva essa tensão e a seriedade moral da cena sem atenuação doutrinária.
- issue: O singular coletivo “coração”
  choice: Manter “do coração deles” no texto.
  alternative: Usar o plural idiomático “dos corações deles”.
  rationale: O singular grego pode funcionar coletivamente. Como a construção também é inteligível e natural em português, ela preserva mais de perto a forma da fonte, enquanto a nota registra a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva-se o presente histórico de Marcos (“diz”), a força de “ira” e o paralelismo entre a ordem e a resposta. O marcador [a] aparece imediatamente após a expressão explicada.
