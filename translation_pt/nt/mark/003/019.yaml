  text: καὶ Ἰούδαν ⸀Ἰσκαριώθ, ὃς καὶ παρέδωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/019.yaml
  text: and Judas Iscariot[a], who also betrayed him.
translation:
  language: pt
  text: e Judas Iscariotes[a], que também o traiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que também o entregou”. O verbo grego pode significar “entregar”; aqui se traduz por “traiu” porque, no contexto, a ação de Judas contra Jesus tem esse sentido.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa que liga o último nome aos anteriores na lista dos apóstolos.
- source_word: Ἰούδαν
  choice: Judas
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: Ἰσκαριώθ
  choice: Iscariotes
  rationale: Transliteração tradicional portuguesa da designação; evita atribuir-lhe uma etimologia incerta.
- source_word: ὃς
  choice: que
  rationale: Pronome relativo natural em português, introduzindo uma caracterização de Judas.
- source_word: καὶ
  choice: também
  rationale: Na oração relativa, tem valor adverbial e acrescenta a ação que identifica Judas.
- source_word: παρέδωκεν
  choice: traiu
  rationale: Embora o verbo possa significar literalmente entregar, neste contexto, com Judas como sujeito e Jesus como objeto, comunica uma entrega traiçoeira; “traiu” expressa esse sentido narrativo em português corrente.
- source_word: αὐτόν
  choice: o
  rationale: Pronome objeto que retoma Jesus; a forma átona é natural e clara em português.
theological_decisions:
- issue: Tradução de παραδίδωμι para a ação de Judas contra Jesus
  choice: traiu
  alternative: entregou / entregou às autoridades
  rationale: O verbo grego não significa necessariamente traição em todos os contextos, mas aqui a identidade de Judas e o desenvolvimento narrativo dão à entrega esse caráter. A tradução principal comunica a força contextual, enquanto a nota preserva o sentido lexical mais amplo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural sobretudo no uso brasileiro e ampla inteligibilidade internacional. Mantém-se “Iscariotes”, forma bíblica tradicional em português, e explicita-se em nota a amplitude de παραδίδωμι.
