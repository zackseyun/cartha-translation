  text: ⸂Καὶ οἱ⸃ βόσκοντες ⸀αὐτοὺς ἔφυγον καὶ ⸀ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς· καὶ ⸀ἦλθον ἰδεῖν τί ἐστιν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/014.yaml
  text: And those who were tending them fled and reported it in the city and in the countryside[a], and they came to see what had happened.
translation:
  language: pt
  text: Os que cuidavam dos porcos fugiram e contaram o ocorrido na cidade e na zona rural[a]; então as pessoas vieram ver o que tinha acontecido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos campos”. Aqui, o termo grego provavelmente se refere às áreas rurais ao redor da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: βόσκοντες αὐτούς
  choice: os que cuidavam dos porcos
  rationale: O particípio designa os responsáveis por cuidar da manada. Explicitar “dos porcos” retoma com clareza o referente de αὐτούς no contexto e soa mais natural em português do que “cuidavam deles”.
- source_word: ἔφυγον
  choice: fugiram
  rationale: Preserva a força narrativa do aoristo e expressa uma retirada súbita motivada pelo que ocorreu.
- source_word: ἀπήγγειλαν
  choice: contaram o ocorrido
  rationale: O verbo significa comunicar ou relatar uma notícia. A expressão é natural em português e fornece ao verbo o complemento implícito no grego.
- source_word: εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς
  choice: na cidade e na zona rural
  rationale: Com um verbo de comunicação, εἰς indica os lugares alcançados pela notícia. No contraste com πόλις, ἀγροί provavelmente abrange a região rural ao redor, não apenas campos cultivados.
- source_word: ἦλθον
  choice: as pessoas foram
  rationale: O plural grego tem sujeito implícito e se refere naturalmente aos que ouviram a notícia. “As pessoas” evita um “eles” de referente incerto; “foram” adota a perspectiva idiomática dos cuidadores e do local do acontecimento.
- source_word: ἰδεῖν
  choice: ver
  rationale: Expressa naturalmente a finalidade do movimento indicado por ἦλθον.
- source_word: τί ἐστιν τὸ γεγονός
  choice: o que tinha acontecido
  rationale: Reproduz de modo idiomático o sentido do particípio perfeito γεγονός em uma narrativa passada.
