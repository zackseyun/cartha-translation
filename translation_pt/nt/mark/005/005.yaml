  text: καὶ διὰ παντὸς νυκτὸς καὶ ἡμέρας ἐν τοῖς ⸂μνήμασιν καὶ ἐν τοῖς ὄρεσιν⸃ ἦν κράζων καὶ κατακόπτων ἑαυτὸν λίθοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/005.yaml
  text: And continually[a], night and day, among the tombs and on the mountains, he was crying out and cutting himself with stones.
translation:
  language: pt
  text: E continuamente, noite e dia, entre os túmulos e nos montes, ele gritava e se cortava com pedras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ παντὸς νυκτὸς καὶ ἡμέρας
  choice: continuamente, noite e dia
  rationale: A expressão transmite ação contínua ao longo da noite e do dia; esta formulação é natural em português e preserva tanto a duração quanto a abrangência temporal.
- source_word: μνήμασιν
  choice: túmulos
  rationale: μνῆμα designa um lugar de sepultamento; “túmulos” corresponde bem ao provável contexto de sepulturas escavadas na rocha.
- source_word: ὄρεσιν
  choice: montes
  rationale: ὄρος pode designar monte ou montanha. “Montes” é uma tradução direta, natural no contexto e não exagera a elevação do terreno.
- source_word: ἦν κράζων
  choice: ele gritava
  rationale: A construção perifrástica no imperfeito expressa ação contínua no passado. Em combinação com “continuamente”, “gritava” comunica essa duração sem redundância excessiva.
- source_word: κατακόπτων ἑαυτὸν
  choice: se cortava
  rationale: κατακόπτω indica golpear ou cortar, possivelmente com gravidade. “Se cortava” comunica com clareza a autolesão sem intensificar além do que o contexto exige.
- source_word: λίθοις
  choice: com pedras
  rationale: O dativo tem valor instrumental; “com pedras” é a expressão natural em português.
