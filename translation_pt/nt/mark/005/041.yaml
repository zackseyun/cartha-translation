  source_fidelity: A revisão é necessária para refletir com maior precisão tanto o παιδίον inicial (“criança”) quanto a transliteração preservada no texto crítico, κουμ. O presente histórico λέγει pode ser mantido naturalmente em português como “diz-lhe”.
  naturalness: 'A formulação revista é fluente em português moderno: “tomando a mão da criança, diz-lhe” e “que, traduzido, significa” soam naturais e conservam a estrutura explicativa de Marcos.'
  terminology: “Talitha koum” reproduz de modo transparente a forma semítica conforme transmitida pelo grego crítico. “Menina, eu lhe digo, levante-se” preserva o tratamento feminino explícito de κοράσιον, a ênfase de σοὶ λέγω e o imperativo ἔγειρε.
  issues:
  - severity: medium
    issue: A forma principal “Talita cum” não acompanha de modo suficientemente direto a leitura κουμ do SBLGNT, e a nota explica incorretamente que “cum” português reproduz aproximadamente seu som.
    rationale: Em português brasileiro, “cum” normalmente tem vogal nasal, não correspondendo bem a /kum/. A forma “Talitha koum” preserva mais claramente a grafia transmitida pelo texto grego; a forma tradicional pode ser mencionada em nota sem alegação fonética imprecisa.
  - severity: low
    issue: “Tomando a menina pela mão” antecipa o gênero que o texto só explicita na tradução subsequente de κοράσιον.
    rationale: Embora o contexto identifique a criança como menina, παιδίον é literalmente “criança”. “Tomando a mão da criança” preserva a progressão do texto-fonte.
  - severity: low
    issue: O pretérito “disse-lhe” neutraliza o presente histórico λέγει.
    rationale: O pretérito é possível em narrativa portuguesa, mas “diz-lhe” é igualmente natural e preserva a vivacidade formal de Marcos.
  revised_text: 'E, tomando a mão da criança, diz-lhe: “Talitha koum”[a], que, traduzido, significa: “Menina, eu lhe digo, levante-se.”'
