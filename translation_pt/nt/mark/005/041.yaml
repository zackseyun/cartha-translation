source:
  edition: SBLGNT
  text: καὶ κρατήσας τῆς χειρὸς τοῦ παιδίου λέγει αὐτῇ· Ταλιθα ⸀κουμ, ὅ ἐστιν μεθερμηνευόμενον· Τὸ κοράσιον, σοὶ λέγω, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/041.yaml
  text: And taking the child's hand[a], he says to her, “Talitha koum,” which is translated, “Little girl, I say to you, get up.”
translation:
  language: pt
  text: 'E, tomando a mão da criança, diz-lhe: “Talitha koum”[a], que, traduzido, significa: “Menina, eu lhe digo, levante-se.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão aramaica é tradicionalmente transliterada em algumas versões como “Talita cum”. O texto grego crítico traz κουμ, aqui transliterado “koum”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατήσας τῆς χειρὸς τοῦ παιδίου
  choice: tomando a menina pela mão
  rationale: A construção indica que Jesus segurou a mão da criança. Esta formulação é natural em português, mantém a ação concreta e evita a intensidade indevida de “agarrando”.
- source_word: λέγει αὐτῇ
  choice: disse-lhe
  rationale: Embora o grego use o presente histórico, o pretérito é mais natural na narrativa portuguesa e mantém a vivacidade sem produzir estranheza.
- source_word: Ταλιθα κουμ
  choice: Talita cum
  rationale: Preserva em transliteração a expressão aramaica mantida pelo próprio texto grego; “cum” representa em ortografia portuguesa a pronúncia aproximada de κουμ, enquanto a explicação de Marcos esclarece seu sentido.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: que traduzido quer dizer
  rationale: Expressa de modo corrente que Marcos fornece a tradução da frase aramaica, sem sugerir uma interpretação teológica adicional.
- source_word: Τὸ κοράσιον
  choice: Menina
  rationale: κοράσιον designa uma menina jovem e aqui funciona como forma direta de tratamento. “Menina” é natural e afetuoso; “menininha” poderia soar infantilizado em excesso.
- source_word: σοὶ λέγω
  choice: eu lhe digo
  rationale: Mantém a frase enfática explícita no grego e usa a forma amplamente compreensível “lhe” para o singular feminino.
- source_word: ἔγειρε
  choice: levante-se
  rationale: O imperativo pode significar despertar ou levantar-se. No contexto, “levante-se” comunica com clareza a ordem concreta, preservando a ressonância de restauração à vida.
theological_decisions:
- issue: Manutenção das palavras aramaicas de Jesus
  choice: Conservar “Talita cum” no texto e apresentar imediatamente a tradução de Marcos.
  alternative: 'Apresentar apenas a tradução portuguesa: “Menina, eu lhe digo: levante-se.”'
  rationale: O texto-fonte preserva deliberadamente a fala semítica e depois a traduz. Manter ambas respeita a textura narrativa e não atribui significado doutrinário oculto à fórmula.
- issue: Amplitude semântica de ἔγειρε
  choice: Traduzir por “levante-se”.
  alternative: “Desperte” ou “ressuscite”.
  rationale: “Levante-se” corresponde à ordem imediata e preserva a possível ressonância de despertar e restauração sem impor ao verbo um termo teológico mais específico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa natural. Optou-se pelo pretérito em vez de reproduzir mecanicamente o presente histórico de Marcos. A transliteração “Talita cum” favorece a leitura portuguesa, e a nota registra a forma internacional “Talitha koum”.
