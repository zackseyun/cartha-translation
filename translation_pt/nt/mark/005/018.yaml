  text: καὶ ⸀ἐμβαίνοντος αὐτοῦ εἰς τὸ πλοῖον παρεκάλει αὐτὸν ὁ δαιμονισθεὶς ἵνα ⸂μετ’ αὐτοῦ ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/018.yaml
  text: And as he was getting into the boat[a], the man who had been demon-possessed kept begging him that he might be with him.
translation:
  language: pt
  text: Enquanto Jesus entrava no barco, o homem que havia estado possuído por demônios[a] continuava suplicando-lhe que pudesse estar com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o endemoninhado”.'
    reason: Alternativa lexical mais concisa para o particípio substantivado ὁ δαιμονισθείς.
lexical_decisions:
- source_word: ἐμβαίνοντος αὐτοῦ εἰς τὸ πλοῖον
  choice: Enquanto Jesus entrava no barco
  rationale: O particípio presente no genitivo absoluto apresenta uma ação em andamento, simultânea à súplica. “Enquanto ... entrava” comunica naturalmente essa relação temporal. O nome “Jesus” explicita em português o referente do pronome grego sem alterar o sentido.
- source_word: παρεκάλει
  choice: continuava suplicando-lhe
  rationale: O imperfeito retrata uma súplica prolongada ou repetida. “Continuava suplicando” preserva tanto o aspecto durativo quanto a intensidade do pedido.
- source_word: ὁ δαιμονισθείς
  choice: o homem que havia estado possuído por demônios
  rationale: O particípio substantivado identifica o homem anteriormente dominado por demônios, mas já liberto no momento desta cena. A formulação deixa claro que se trata de uma condição passada e mantém a referência pessoal do texto.
- source_word: ἵνα μετ’ αὐτοῦ ᾖ
  choice: que pudesse ficar com ele
  rationale: A oração com ἵνα expressa o conteúdo do pedido. “Ficar com ele” conserva o sentido relacional de μετ’ αὐτοῦ sem reduzi-lo apenas à ideia de transporte ou viagem.
theological_decisions:
- issue: Como traduzir δαιμονισθείς sem reduzir a aflição a uma categoria clínica ou metafórica posterior
  choice: possuído por demônios
  alternative: endemoninhado
  rationale: A expressão apresenta a dominação demoníaca como real, de acordo com a narrativa, e é imediatamente compreensível para leitores atuais. A formulação perifrástica também permite indicar com clareza que essa condição já havia cessado.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Evitou-se linguagem excessivamente técnica ou arcaica; a repetição pronominal foi mantida onde necessária para preservar a estrutura e a relação pessoal expressas no grego.
