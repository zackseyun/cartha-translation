source:
  edition: SBLGNT
  text: καὶ ἐπηρώτα αὐτόν· Τί ⸂ὄνομά σοι⸃; καὶ ⸂λέγει αὐτῷ⸃· ⸀Λεγιὼν ὄνομά μοι, ὅτι πολλοί ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/009.yaml
  text: And he was asking him, “What is your name?” And he says to him, “My name is Legion,[a] because we are many.”
translation:
  language: pt
  text: 'E ele lhe perguntava: “Qual é o seu nome?” Ele lhe diz: “Meu nome é Legião,[a] porque somos muitos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Legião” é um termo militar latino incorporado ao grego, que designava uma grande unidade do exército romano; aqui funciona como o nome declarado pelo demônio e sugere uma multidão.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτα
  choice: perguntava
  rationale: O imperfeito grego indica ação em curso ou reiterada; o imperfeito português preserva esse aspecto sem tornar a frase artificial.
- source_word: Τί ὄνομά σοι
  choice: Qual é o seu nome?
  rationale: É a forma idiomática, direta e natural em português para a construção grega com ὄνομα e pronome no dativo.
- source_word: λέγει αὐτῷ
  choice: Ele lhe diz
  rationale: O presente histórico conserva a vivacidade característica da narrativa de Marcos; “lhe” expressa naturalmente o objeto indireto.
- source_word: Λεγιὼν
  choice: Legião
  rationale: O termo funciona aqui como nome ou designação declarada. A inicial maiúscula preserva esse uso, enquanto a nota esclarece sua origem militar.
- source_word: ὄνομά μοι
  choice: Meu nome é
  rationale: Equivalente português natural da expressão nominal grega com pronome no dativo.
- source_word: ὅτι πολλοί ἐσμεν
  choice: porque somos muitos
  rationale: ὅτι apresenta a razão do nome, e a primeira pessoa do plural deve ser mantida por sua importância no contraste entre um falante e a pluralidade declarada.
theological_decisions:
- issue: Mudança do singular para o plural na autorreferência do falante
  choice: Manter “Meu nome é Legião” no singular e “somos muitos” no plural.
  alternative: Uniformizar como “Nosso nome é Legião” ou de outra forma reduzir a tensão.
  rationale: O grego conserva deliberadamente a passagem da identificação singular para a explicação plural. A tradução mantém essa tensão e não determina além do texto como se relacionam o indivíduo possuído e a multiplicidade demoníaca.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperfeito “perguntava” e o presente histórico “diz” preservam os contrastes aspectuais do grego. A colocação pronominal é natural sem perder a concisão narrativa.
