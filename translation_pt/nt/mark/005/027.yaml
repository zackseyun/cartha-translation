  text: ⸀ἀκούσασα περὶ τοῦ Ἰησοῦ, ἐλθοῦσα ἐν τῷ ὄχλῳ ὄπισθεν ἥψατο τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/027.yaml
  text: having heard about Jesus[a], she came up behind him in the crowd and touched his garment.
translation:
  language: pt
  text: Depois de ouvir falar de Jesus, ela se aproximou por trás, no meio da multidão, e tocou na roupa dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no manto dele” ou “na veste dele”. A palavra grega ἱμάτιον designa de modo amplo uma peça de roupa, muitas vezes uma veste exterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσασα περὶ τοῦ Ἰησοῦ
  choice: Depois de ouvir falar de Jesus
  rationale: O particípio aoristo indica uma ação anterior à ação principal. A construção idiomática portuguesa “ouvir falar de” traduz naturalmente περί com genitivo neste contexto.
- source_word: ἐλθοῦσα ἐν τῷ ὄχλῳ ὄπισθεν
  choice: ela se aproximou por trás, no meio da multidão
  rationale: Expressa de modo natural o movimento em direção a Jesus, a posição por trás e a circunstância de estar entre a multidão, sem tornar a sequência grega rígida em português.
- source_word: ἥψατο
  choice: tocou
  rationale: Neste relato, o aoristo médio de ἅπτω denota tocar; “tocou” evita sugerir indevidamente que ela agarrou ou segurou por algum tempo.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: na roupa dele
  rationale: ἱμάτιον pode designar uma peça de roupa, frequentemente a veste exterior. “Roupa” é corrente, clara e suficientemente ampla; a nota registra alternativas mais específicas.
theological_decisions: []
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. “Depois de ouvir falar” preserva a anterioridade do primeiro particípio; “se aproximou por trás” comunica com clareza o movimento narrativo. O marcador de nota foi colocado após a expressão lexical a que se refere.
