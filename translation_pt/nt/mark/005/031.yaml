source:
  edition: SBLGNT
  text: καὶ ἔλεγον αὐτῷ οἱ μαθηταὶ αὐτοῦ· Βλέπεις τὸν ὄχλον συνθλίβοντά σε, καὶ λέγεις· Τίς μου ἥψατο;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/031.yaml
  text: And his disciples were saying to him[a], “You see the crowd pressing in on you, and you say, ‘Who touched me?’”
translation:
  language: pt
  text: 'E os seus discípulos lhe diziam: “Você vê a multidão se apertando contra você e pergunta: ‘Quem tocou em mim?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito indica fala em andamento ou reiterada; “diziam” preserva naturalmente esse aspecto narrativo.
- source_word: μαθηταὶ
  choice: discípulos
  rationale: Termo consagrado e claro para os aprendizes e seguidores de Jesus.
- source_word: Βλέπεις
  choice: Você vê
  rationale: Reproduz o presente do indicativo e o apelo dos discípulos ao que estava evidente naquele momento.
- source_word: ὄχλον
  choice: a multidão
  rationale: Equivalente atual e natural para o grupo numeroso que cercava Jesus.
- source_word: συνθλίβοντά
  choice: apertando você por todos os lados
  rationale: Expressa a compressão física exercida pela multidão ao redor de Jesus, sem sugerir necessariamente que o estivesse esmagando.
- source_word: λέγεις
  choice: ainda pergunta
  rationale: Em português, o contraste com a situação evidente é comunicado naturalmente por “ainda”; “pergunta” traduz o valor pragmático de λέγεις ao introduzir uma pergunta direta.
- source_word: Τίς μου ἥψατο
  choice: Quem tocou em mim?
  rationale: Traduz de modo idiomático o ato específico expresso pelo aoristo e a construção de ἅπτομαι com genitivo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O pronome “você” torna natural a fala direta; “apertando você por todos os lados” preserva a força física de συνθλίβω e evita a ambiguidade menos natural de “apertando-se contra você”.
