  - severity: low
    issue: «ainda pergunta» introduz uma partícula contrastiva não expressa lexicalmente no texto grego.
    rationale: O tom de estranhamento é inferível do contexto e da pergunta dos discípulos, mas λέγεις é simplesmente «você diz/pergunta».
