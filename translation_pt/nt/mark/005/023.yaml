  text: καὶ ⸀παρακαλεῖ αὐτὸν πολλὰ λέγων ὅτι Τὸ θυγάτριόν μου ἐσχάτως ἔχει, ἵνα ἐλθὼν ἐπιθῇς ⸂τὰς χεῖρας αὐτῇ⸃ ⸀ἵνα σωθῇ καὶ ⸀ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/023.yaml
  text: And he begged him earnestly[a], saying, “My little daughter is at the point of death. Come and lay your hands on her, so that she may be healed and live.”
translation:
  language: pt
  text: 'E lhe suplicava insistentemente, dizendo: “Minha filhinha está à beira da morte. Venha e ponha as mãos sobre ela, para que seja salva[a] e viva.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seja curada” ou “fique bem”. O verbo grego pode significar salvar, resgatar ou curar; aqui, o contexto imediato é de cura física.
    reason: alternative_reading
lexical_decisions:
- source_word: παρακαλεῖ αὐτὸν πολλὰ
  choice: lhe suplicava insistentemente
  rationale: No contexto, παρακαλέω expressa um apelo urgente, e πολλὰ intensifica esse apelo. A formulação comunica o desespero de Jairo em português natural sem especificar, de modo incerto, que ele repetiu o pedido.
- source_word: θυγάτριόν
  choice: filhinha
  rationale: O diminutivo grego sugere pouca idade e/ou afeto. “Filhinha” conserva de modo natural tanto a forma diminutiva quanto o tom emocional.
- source_word: ἐσχάτως ἔχει
  choice: está à beira da morte
  rationale: A expressão idiomática indica que ela se encontra em condição extrema, prestes a morrer. A tradução preserva a urgência sem recorrer a uma expressão excessivamente coloquial.
- source_word: ἐλθὼν ἐπιθῇς τὰς χεῖρας αὐτῇ
  choice: Venha e ponha as mãos sobre ela
  rationale: Embora ἐλθών seja formalmente um particípio, ele integra o pedido e é expresso naturalmente em português por dois verbos coordenados. “Ponha as mãos” preserva o plural χεῖρας e o gesto de cura.
- source_word: σωθῇ
  choice: seja salva
  rationale: σῴζω pode significar salvar, resgatar, curar ou fazer ficar bem. “Seja salva” preserva a amplitude lexical e a ligação com outros usos do verbo, enquanto a nota registra o sentido físico mais imediato neste contexto.
- source_word: ζήσῃ
  choice: viva
  rationale: O verbo significa diretamente “viver” e expressa o resultado esperado do salvamento ou da cura.
theological_decisions:
- issue: Sentido de σωθῇ em um contexto de cura
  choice: seja salva
  alternative: seja curada; fique bem
  rationale: O contexto imediato favorece a cura física, mas o verbo grego possui a amplitude de salvar, resgatar e curar. O texto principal conserva essa tensão lexical, e a nota apresenta as alternativas contextualmente plausíveis sem impor um sentido exclusivamente médico ou espiritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Venha” e “ponha” mantêm um pedido respeitoso e natural; “à beira da morte” comunica a gravidade sem coloquialismo excessivo. O marcador foi colocado junto a “salva”, termo ao qual a nota efetivamente se refere.
