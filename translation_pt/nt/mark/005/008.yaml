  text: For he was saying to him[a], “Come out of the man, unclean spirit.”
translation:
  language: pt
  text: 'Pois Jesus lhe dizia: “Saia do homem, espírito impuro!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega traduzida por “espírito impuro”, embora formalmente articulada, funciona aqui como chamamento direto.
    reason: grammatical_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito apresenta a fala como ação em curso ou repetida no passado; em português narrativo, “dizia” preserva esse aspecto com naturalidade.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação do que foi narrado no versículo anterior, sem tornar a relação mais específica do que o grego.
- source_word: αὐτῷ
  choice: lhe
  rationale: Conserva o pronome dativo masculino do texto grego. O referente imediato é o homem, embora a ordem seja dirigida ao espírito impuro; “lhe” mantém essa tensão sem a resolver explicitamente.
- source_word: Ἔξελθε
  choice: Saia
  rationale: Imperativo aoristo direto. “Saia” é a forma idiomática em português para ordenar que o espírito deixe o homem.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: espírito impuro
  rationale: Embora a expressão tenha artigo e forma nominativa, aqui funciona como chamamento direto após o imperativo. “Espírito impuro” preserva a terminologia própria do texto, sem substituí-la pela interpretação “espírito maligno”.
- source_word: ἐκ τοῦ ἀνθρώπου
  choice: desse homem
  rationale: Com verbo de saída, ἐκ indica movimento para fora. “Desse homem” expressa de modo natural em português tanto a origem interior quanto o indivíduo masculino específico do contexto.
theological_decisions:
- issue: Sentido de πνεῦμα ἀκάθαρτον no contexto de exorcismo
  choice: espírito impuro
  alternative: espírito maligno
  rationale: O grego designa literalmente um “espírito impuro”, expressão característica dos Evangelhos e portadora de conotações de impureza. “Maligno” seria uma explicitação interpretativa.
- issue: Referente de αὐτῷ e destinatário da ordem
  choice: Manter “lhe” na moldura narrativa e o espírito como vocativo na ordem
  alternative: Explicitar “ao espírito” ou entender o pronome como neutro
  rationale: A forma grega permite que a narração apresente Jesus falando ao homem enquanto a ordem visa o espírito nele. A tradução conserva essa tensão narrativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O sujeito “Jesus” foi explicitado para evitar a ambiguidade pouco natural de dois pronomes masculinos contíguos em português. A pontuação assinala claramente o vocativo.
