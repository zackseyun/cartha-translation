lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conjunção narrativa simples que preserva o estilo paratático característico de Marcos.
- source_word: γυνὴ
  choice: uma mulher
  rationale: O substantivo sem artigo introduz uma nova participante; o artigo indefinido é natural em português.
- source_word: οὖσα
  choice: que sofria
  rationale: O particípio descreve uma condição contínua. A formulação comunica com naturalidade a duração e o caráter aflitivo da condição, sem transformá-la em diagnóstico específico.
- source_word: ἐν ῥύσει αἵματος
  choice: de um fluxo de sangue
  rationale: A expressão preposicional indica o estado ou condição da mulher. A tradução conserva a imagem concreta do grego e permanece compreensível.
- source_word: ῥύσει
  choice: fluxo
  rationale: ῥύσις designa fluxo ou corrimento; “fluxo” preserva a expressão nominal e evita precisão médica não explicitada no texto.
- source_word: αἵματος
  choice: sangue
  rationale: Equivalente direto do genitivo que especifica a natureza do fluxo.
- source_word: δώδεκα ἔτη
  choice: havia doze anos
  rationale: O acusativo expressa extensão temporal. Em português, “havia doze anos” indica de modo idiomático que a condição persistia até aquele momento.
