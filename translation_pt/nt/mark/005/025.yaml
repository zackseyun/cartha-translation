  text: And there was a woman who had been suffering from a flow of blood for twelve years,[a]
translation:
  language: pt
  text: E havia uma mulher que sofria de um fluxo de sangue havia doze anos,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com uma hemorragia” ou “com sangramento”.
