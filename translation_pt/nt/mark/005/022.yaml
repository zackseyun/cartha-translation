  text: ⸀καὶ ἔρχεται εἷς τῶν ἀρχισυναγώγων, ὀνόματι Ἰάϊρος, καὶ ἰδὼν αὐτὸν πίπτει πρὸς τοὺς πόδας αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/022.yaml
  text: And one of the synagogue rulers[a], named Jairus, came, and when he saw him[b], he fell at his feet.
translation:
  language: pt
  text: Então chegou um dos dirigentes da sinagoga, chamado Jairo, e, ao ver Jesus, caiu aos pés dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: chegou
  rationale: O presente histórico grego dá vivacidade à narrativa; o pretérito perfeito soa natural na narração em português e preserva o sentido do acontecimento.
- source_word: εἷς τῶν ἀρχισυναγώγων
  choice: um dos dirigentes da sinagoga
  rationale: A construção partitiva é mantida. ἀρχισυνάγωγος designa alguém com função de liderança ou administração na sinagoga; “dirigente” é claro e atual sem sugerir autoridade política.
- source_word: ὀνόματι Ἰάϊρος
  choice: chamado Jairo
  rationale: Reproduz de modo conciso e natural a expressão idiomática de identificação.
- source_word: Ἰάϊρος
  choice: Jairo
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἰδὼν αὐτὸν
  choice: ao ver Jesus
  rationale: A oração reduzida temporal representa naturalmente o particípio aoristo. O nome “Jesus” esclarece o referente do pronome grego sem alterar seu sentido.
- source_word: πίπτει πρὸς τοὺς πόδας αὐτοῦ
  choice: prostrou-se aos pés dele
  rationale: O segundo presente histórico é vertido no passado para manter a fluidez narrativa. “Prostrou-se aos pés” comunica a ação física e sua postura de súplica sem convertê-la explicitamente em adoração.
theological_decisions:
- issue: Natureza do gesto diante de Jesus
  choice: prostrou-se aos pés dele
  alternative: adorou-o
  rationale: O grego descreve o ato físico de cair aos pés de Jesus, que pode expressar reverência, desespero ou súplica, mas não emprega aqui um verbo que signifique explicitamente adorar. A tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O passado foi preferido ao presente histórico para uma narrativa natural. “Dirigentes” evita o tom político de “governantes” e comunica a função de liderança na sinagoga.
