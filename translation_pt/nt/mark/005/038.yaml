source:
  edition: SBLGNT
  text: καὶ ⸀ἔρχονται εἰς τὸν οἶκον τοῦ ἀρχισυναγώγου, καὶ θεωρεῖ θόρυβον ⸀καὶ κλαίοντας καὶ ἀλαλάζοντας πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/038.yaml
  text: And they come to the house of the synagogue leader[a], and he sees a commotion, and people weeping and wailing loudly.
translation:
  language: pt
  text: E eles chegam à casa do dirigente da sinagoga, e ele vê um alvoroço[a], com pessoas chorando e lamentando em alta voz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tumulto”; o termo grego pode indicar agitação barulhenta ou desordem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: chegam
  rationale: O presente histórico é mantido para preservar a vivacidade narrativa; “chegam” expressa naturalmente a entrada deles na cena.
- source_word: οἶκον
  choice: casa
  rationale: Equivalente direto e natural, sem acrescentar a conotação afetiva que “lar” poderia sugerir.
- source_word: ἀρχισυναγώγου
  choice: dirigente da sinagoga
  rationale: Designa o responsável ou oficial principal da sinagoga; a formulação é clara, moderna e não arcaizante.
- source_word: θεωρεῖ
  choice: vê
  rationale: O verbo no singular tem Jesus como referente natural no contexto; “vê” é direto e preserva o presente histórico.
- source_word: θόρυβον
  choice: alvoroço
  rationale: O termo indica aqui barulho acompanhado de agitação, não apenas um som; “alvoroço” comunica bem essa cena tumultuada.
- source_word: κλαίοντας
  choice: pessoas chorando
  rationale: O particípio descreve os presentes na cena; explicitar “pessoas” produz português natural sem alterar o sentido.
- source_word: ἀλαλάζοντας
  choice: lamentando em alta voz
  rationale: No contexto de luto, o verbo descreve gritos ou lamentos audíveis e intensos; a escolha evita uma expressão excessivamente técnica.
- source_word: πολλά
  choice: em alta voz
  rationale: Usado adverbialmente para intensificar os lamentos; a expressão comunica em português natural sua manifestação forte e ruidosa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os presentes históricos foram preservados. A construção “com pessoas...” apresenta de modo natural em português os elementos da cena ligados pelas conjunções gregas, sem eliminar a relação entre o alvoroço, o choro e os lamentos.
