  text: καὶ ἤρξαντο παρακαλεῖν αὐτὸν ἀπελθεῖν ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/017.yaml
  text: And they began to beg him to leave their region[a].
translation:
  language: pt
  text: E começaram a suplicar-lhe que saísse da região deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que fosse embora do território deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a ligação simples com a narrativa anterior, sem acrescentar uma nuance temporal ausente do grego.
- source_word: ἤρξαντο
  choice: começaram
  rationale: Expressa naturalmente em português o sentido ingressivo da construção com infinitivo.
- source_word: παρακαλεῖν
  choice: a suplicar
  rationale: No contexto da reação ao exorcismo, comunica a insistência e a intensidade do pedido; “pedir” seria possível, mas menos forte.
- source_word: αὐτὸν
  choice: lhe
  rationale: Pronome oblíquo que retoma Jesus como destinatário da súplica, em construção idiomática com “suplicar”.
- source_word: ἀπελθεῖν
  choice: que saísse
  rationale: A oração completiva com subjuntivo é natural em português após “suplicar-lhe” e transmite o conteúdo do infinitivo grego.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: da região deles
  rationale: Embora ὅρια possa designar literalmente limites ou fronteiras, aqui a expressão se refere ao território ou à região pertencente àquelas pessoas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Suplicar” preserva a intensidade contextual sem tornar a frase arcaica; “região” evita o sentido inadequadamente literal de apenas cruzar uma fronteira.
