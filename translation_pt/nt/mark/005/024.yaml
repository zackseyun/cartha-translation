  text: καὶ ἀπῆλθεν μετ’ αὐτοῦ. Καὶ ἠκολούθει αὐτῷ ὄχλος πολύς, καὶ συνέθλιβον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/024.yaml
  text: And he went with him[a]. And a large crowd was following him and pressing around him.
translation:
  language: pt
  text: E Jesus foi com ele. Uma grande multidão o seguia e o apertava de todos os lados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se comprimia ao redor dele” ou “se apertava contra ele”. O verbo grego descreve a pressão física da multidão em torno de Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: foi
  rationale: O aoristo de ἀπέρχομαι narra o movimento de Jesus em resposta a Jairo. “Foi” é natural no contexto e evita a ideia potencialmente equivocada de que ele simplesmente “foi embora”.
- source_word: μετ’ αὐτοῦ
  choice: com ele
  rationale: μετά com o genitivo indica acompanhamento; “com ele” reproduz isso de modo claro e idiomático.
- source_word: ἠκολούθει
  choice: seguia
  rationale: O imperfeito indica uma ação em andamento. Em português, “seguia” expressa naturalmente esse aspecto contínuo.
- source_word: ὄχλος πολύς
  choice: uma grande multidão
  rationale: A expressão indica uma multidão numerosa; esta é a formulação corrente e digna em português moderno.
- source_word: συνέθλιβον
  choice: o apertava de todos os lados
  rationale: O verbo συνθλίβω transmite pressão física causada pela multidão que se comprimia em torno de Jesus. A formulação preserva essa força sem sugerir necessariamente esmagamento ou ferimento.
- source_word: αὐτόν
  choice: o
  rationale: O pronome tem Jesus como referente e objeto da pressão exercida pela multidão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e narrativo, com legibilidade brasileira e alcance internacional. O nome “Jesus” explicita o sujeito naturalmente recuperável do contexto, evitando em português a sequência ambígua “ele foi com ele”. A repetição inicial de καί foi mantida apenas na primeira oração; na segunda, a justaposição é mais natural sem perder a progressão narrativa.
