  text: καὶ παρεκάλει αὐτὸν πολλὰ ἵνα μὴ ⸀αὐτὰ ἀποστείλῃ ἔξω τῆς χώρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/010.yaml
  text: And he begged him repeatedly not to send them out of the region[a].
translation:
  language: pt
  text: E ele lhe suplicava insistentemente que não os mandasse para fora daquela região.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E ele lhe suplicava muitas vezes que não os mandasse para fora daquele território.”'
    reason: Alternativas lexicais para πολλὰ e χώρα, preservando respectivamente a possível ideia de repetição e o sentido territorial.
lexical_decisions:
- source_word: παρεκάλει
  choice: suplicava
  rationale: Neste contexto de exorcismo, o verbo expressa um pedido urgente e intenso; “suplicava” é natural, digno e preserva essa força.
- source_word: πολλὰ
  choice: insistentemente
  rationale: Como acusativo adverbial, intensifica a súplica e pode sugerir insistência ou repetição. “Insistentemente” comunica isso de modo idiomático sem determinar rigidamente se foram muitos pedidos distintos.
- source_word: ἵνα μὴ
  choice: que não
  rationale: Introduz de maneira natural em português o conteúdo da súplica negativa.
- source_word: αὐτὰ
  choice: os
  rationale: O pronome grego é neutro plural e retoma os espíritos impuros/demônios. Em português, o masculino plural pessoal “os” é a forma idiomática.
- source_word: ἀποστείλῃ
  choice: mandasse
  rationale: Expressa diretamente a ideia de enviar para outro lugar, sem acrescentar a força de “expulsar”, que não está explicitada pelo verbo.
- source_word: ἔξω τῆς χώρας
  choice: para fora daquela região
  rationale: χώρα designa aqui o distrito ou território local, não necessariamente um país no sentido moderno. “Daquela região” torna clara a referência geográfica contextual.
theological_decisions:
- issue: Alternância entre o sujeito singular e o pronome plural no contexto da fala demoníaca
  choice: Manter “ele lhe suplicava” no singular e “os mandasse” no plural.
  alternative: Harmonizar a frase no plural, tratando todos os demônios como sujeito da súplica.
  rationale: O grego preserva a tensão entre um porta-voz singular e a pluralidade dos demônios. A tradução mantém essa oscilação sem a resolver silenciosamente.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é digno e claro; “suplicava insistentemente” transmite a urgência sem soar arcaico. O marcador [a] aparece no texto principal.
