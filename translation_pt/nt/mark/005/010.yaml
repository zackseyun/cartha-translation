  source_fidelity: 'A tradução preserva com precisão a estrutura relevante do grego: o sujeito singular em «ele lhe suplicava», o objeto plural em «os mandasse», a intensidade de παρεκάλει πολλὰ e o sentido geográfico local de ἔξω τῆς χώρας. «Insistentemente» é uma boa forma idiomática de expressar a força adverbial de πολλὰ sem impor uma única nuance.'
