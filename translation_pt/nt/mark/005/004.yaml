source:
  edition: SBLGNT
  text: διὰ τὸ αὐτὸν πολλάκις πέδαις καὶ ἁλύσεσι δεδέσθαι καὶ διεσπάσθαι ὑπ’ αὐτοῦ τὰς ἁλύσεις καὶ τὰς πέδας συντετρῖφθαι, καὶ οὐδεὶς ⸂ἴσχυεν αὐτὸν⸃ δαμάσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/004.yaml
  text: because he had often been bound with shackles and chains[a], and the chains had been torn apart by him and the shackles smashed to pieces, and no one was strong enough to subdue him.
translation:
  language: pt
  text: porque muitas vezes ele tinha sido amarrado com grilhões e correntes, e tinha arrebentado as correntes e despedaçado os grilhões; e ninguém era forte o bastante para dominá-lo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “domá-lo”. O verbo grego pode significar “domar” ou, em sentido mais amplo, “dominar, pôr sob controle”.
    reason: Alternativa lexical que preserva a amplitude semântica de δαμάζω.
lexical_decisions:
- source_word: διὰ τὸ αὐτὸν
  choice: porque ele tinha sido
  rationale: διά com infinitivo articular introduz a causa da afirmação anterior. A construção com “porque” preserva essa ligação causal, e o mais-que-perfeito composto integra naturalmente a sequência ao pano de fundo narrativo.
- source_word: πολλάκις
  choice: muitas vezes
  rationale: Expressa repetição frequente em linguagem corrente e clara.
- source_word: πέδαις / τὰς πέδας
  choice: grilhões / os grilhões
  rationale: πέδη designa especificamente uma peça de contenção, sobretudo para os pés. “Grilhões” mantém a distinção em relação às correntes e é amplamente compreensível.
- source_word: ἁλύσεσι / τὰς ἁλύσεις
  choice: correntes / as correntes
  rationale: ἅλυσις designa correntes; a escolha preserva os dois tipos de contenção mencionados no grego.
- source_word: δεδέσθαι
  choice: tinha sido preso
  rationale: O infinitivo perfeito indica o estado resultante de atos anteriores de amarrar ou prender. “Tinha sido preso” é natural no contexto e não sugere prisão institucional.
- source_word: διεσπάσθαι ὑπ’ αὐτοῦ
  choice: havia arrebentado
  rationale: διασπάω comunica a ruptura violenta das correntes. A voz passiva grega com agente é vertida de modo ativo em português para maior naturalidade, sem mudar quem pratica a ação.
- source_word: συντετρῖφθαι
  choice: despedaçado
  rationale: συντρίβω transmite quebra intensa, até reduzir algo a pedaços. “Despedaçado” conserva a força da imagem.
- source_word: οὐδεὶς ἴσχυεν
  choice: ninguém tinha força suficiente
  rationale: A formulação preserva a ênfase de ἰσχύω em força ou capacidade, em vez de reduzi-la ao sentido genérico de “poder”.
- source_word: δαμάσαι
  choice: dominá-lo
  rationale: δαμάζω pode significar domar, subjugar ou pôr sob controle. “Dominá-lo” comunica aqui a incapacidade de contê-lo sem impor a imagem mais específica de adestramento animal.
theological_decisions:
- issue: Natureza da condição e da força do homem
  choice: Descrever as repetidas tentativas fracassadas de contê-lo e sua força extraordinária sem explicar aqui a origem dessa força.
  alternative: Tornar explícita a ação demoníaca ou empregar linguagem mais carregada, como se ninguém conseguisse “domá-lo”.
  rationale: O versículo relata a impossibilidade de contê-lo, enquanto o contexto mais amplo apresenta sua opressão demoníaca. A tradução não acrescenta ao versículo uma explicação teológica que o próprio texto não explicita neste ponto.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A abertura em minúscula mantém a dependência causal em relação ao versículo anterior. “Mas” explicita o contraste natural entre ter sido preso e romper as contenções, embora o grego encadeie as orações com καί. O ponto e vírgula evita uma sequência excessivamente longa e destaca a conclusão.
