  text: καὶ κράξας φωνῇ μεγάλῃ ⸀λέγει· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; ὁρκίζω σε τὸν θεόν, μή με βασανίσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/007.yaml
  text: And crying out with a loud voice[a], he says, “What have I to do with you, Jesus, Son of the Most High God? I adjure you by God[c][b], do not torment me.”
translation:
  language: pt
  text: 'E, gritando em voz alta, ele diz: “Que tenho eu a ver com você?[a] Jesus, Filho do Deus Altíssimo? Eu o conjuro por Deus:[b] não me atormente.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão grega é um modo de indicar afastamento, conflito ou recusa de envolvimento entre as partes. Também pode ser traduzida: “O que há entre mim e você?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Eu lhe imploro por Deus” ou “Eu o ponho sob juramento diante de Deus”. O verbo grego indica uma ordem ou apelo solene ligado a juramento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας φωνῇ μεγάλῃ
  choice: gritando em alta voz
  rationale: Reproduz a força do clamor intenso e a circunstância expressa pelo particípio, em português claro e vívido.
- source_word: λέγει
  choice: ele diz
  rationale: Mantém o presente histórico característico da narrativa de Marcos, preservando sua vivacidade.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Que tenho eu a ver com você?
  rationale: Expressa de modo conciso o idioma semítico de afastamento, oposição ou rejeição de envolvimento, sem tentar explicitar além do que o texto diz.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: Filho do Deus Altíssimo
  rationale: Preserva de forma explícita e natural tanto o título filial quanto o epíteto divino.
- source_word: ὁρκίζω σε τὸν θεόν
  choice: Eu o conjuro por Deus
  rationale: Conserva o sentido solene e ligado a juramento do verbo ὁρκίζω, embora a formulação seja deliberadamente elevada.
- source_word: μή με βασανίσῃς
  choice: não me atormente
  rationale: Transmite a intensidade de βασανίζω sem especificar indevidamente a forma do sofrimento.
theological_decisions:
- issue: Reconhecimento da identidade de Jesus pelo espírito impuro
  choice: Filho do Deus Altíssimo
  alternative: Filho de Deus, o Altíssimo
  rationale: Mantém a confissão cristológica explícita do texto sem enfraquecê-la nem acrescentar formulações doutrinárias posteriores.
- issue: Força de ὁρκίζω na súplica dirigida a Jesus
  choice: Eu o conjuro por Deus
  alternative: Eu lhe imploro por Deus
  rationale: Preserva a tensão do apelo solene, com força de juramento, feito pelo espírito impuro ao invocar Deus, em vez de reduzi-lo a uma súplica comum.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O presente histórico “ele diz” preserva a vivacidade típica de Marcos. “Conjuro” é mais elevado que o restante do versículo, mas foi mantido para comunicar a força solene e jurídica do original; a nota oferece alternativas mais transparentes.
