id: MRK.5.20
reference: Mark 5:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν καὶ ἤρξατο κηρύσσειν ἐν τῇ Δεκαπόλει ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς, καὶ πάντες ἐθαύμαζον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/020.yaml
  text: And he went away and began to proclaim in the Decapolis how much Jesus had done for him[a], and everyone was amazed.
translation:
  language: pt
  text: Então ele foi embora e começou a proclamar na Decápolis tudo o que Jesus havia feito por ele[a]; e todos ficavam admirados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «quanto Jesus havia feito por ele».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: foi embora
  rationale: Expressa de modo natural a partida do homem daquele lugar, sem a formalidade de «partiu».
- source_word: ἤρξατο κηρύσσειν
  choice: começou a proclamar
  rationale: Preserva o aspecto ingressivo de ἤρξατο com infinitivo e apresenta κηρύσσειν como anúncio público, sem sugerir necessariamente um sermão formal.
- source_word: ἐν τῇ Δεκαπόλει
  choice: na Decápolis
  rationale: Traduz diretamente ἐν e conserva o nome tradicional da região das dez cidades.
- source_word: ὅσα
  choice: tudo o que
  rationale: Neste contexto, ὅσα pode indicar a totalidade das coisas feitas. «Quanto» seria possível, mas menos natural nesta construção em português.
- source_word: ἐποίησεν αὐτῷ
  choice: havia feito por ele
  rationale: O mais-que-perfeito composto situa naturalmente a ação de Jesus antes da proclamação; «por ele» comunica o sentido benéfico do dativo.
- source_word: πάντες
  choice: todos
  rationale: Equivalente direto e idiomático do plural πάντες, sem acrescentar um referente ausente no grego.
- source_word: ἐθαύμαζον
  choice: ficavam admirados
  rationale: O imperfeito sugere reação contínua ou repetida; «ficavam admirados» preserva essa nuance melhor que um pretérito pontual.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Emprega a forma portuguesa convencional do nome próprio.
theological_decisions:
- issue: Alcance da proclamação do homem em relação à identidade de Jesus
  choice: Relatar diretamente que o homem proclamava o que Jesus havia feito por ele, sem explicação doutrinária adicional.
  alternative: Acrescentar uma formulação teológica explícita sobre a autoridade divina de Jesus.
  rationale: O versículo evidencia o poder extraordinário de Jesus por meio do testemunho e da admiração geral, mas não formula aqui uma conclusão doutrinária explícita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Decápolis» conserva o topônimo tradicional; «proclamar» mantém o caráter público do anúncio sem impor um contexto sermônico.
