  text: καὶ ⸂ἐξελθόντος αὐτοῦ⸃ ἐκ τοῦ πλοίου ⸂εὐθὺς ὑπήντησεν⸃ αὐτῷ ἐκ τῶν μνημείων ἄνθρωπος ἐν πνεύματι ἀκαθάρτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/002.yaml
  text: And when he got out of the boat[a], immediately a man with an unclean spirit came out from the tombs to meet him,
translation:
  language: pt
  text: Quando ele saiu do barco, imediatamente veio dos túmulos ao seu encontro um homem com um espírito impuro[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “possuído por um espírito impuro”. O grego diz mais literalmente “com um espírito impuro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ ἐκ τοῦ πλοίου
  choice: Quando ele saiu do barco
  rationale: O genitivo absoluto com particípio aoristo é expresso naturalmente por uma oração temporal. “Saiu do barco” é claro e preserva a ação concluída sem impor a nuance mais específica de “depois que”.
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Preserva o marcador narrativo enfático e recorrente de Marcos, em linguagem corrente e digna.
- source_word: ὑπήντησεν αὐτῷ
  choice: veio ... ao seu encontro
  rationale: Expressa o movimento indicado pelo contexto e o sentido de encontrar-se com alguém, permitindo ligar naturalmente a procedência “dos túmulos” ao homem.
- source_word: ἐκ τῶν μνημείων
  choice: dos túmulos
  rationale: μνημεῖον designa túmulo ou sepultura; “túmulos” é preciso no contexto e natural em português.
- source_word: ἄνθρωπος
  choice: um homem
  rationale: O substantivo masculino singular refere-se, no contexto, a um indivíduo do sexo masculino.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: com um espírito impuro
  rationale: Mantém proximidade com a construção grega e descreve a condição ou associação do homem sem introduzir no texto principal a formulação mais interpretativa “possuído”.
theological_decisions:
- issue: Linguagem referente à aflição demoníaca
  choice: com um espírito impuro
  alternative: possuído por um espírito impuro
  rationale: A construção grega é literalmente “em/com um espírito impuro”. A opção principal preserva essa formulação e sua tensão, enquanto a nota registra a interpretação contextual possível sem sistematizá-la no texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A ordem foi ajustada para fluência, mantendo “imediatamente” e a procedência dos túmulos em posição clara. A vírgula antes do marcador de nota segue a apresentação do trecho fornecido, que continua no versículo seguinte.
