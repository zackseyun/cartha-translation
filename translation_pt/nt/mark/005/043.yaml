  text: καὶ διεστείλατο αὐτοῖς πολλὰ ἵνα μηδεὶς γνοῖ τοῦτο, καὶ εἶπεν δοθῆναι αὐτῇ φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/043.yaml
  text: And he strictly ordered them that no one should know this[c][b][a], and he said that she should be given something to eat.
translation:
  language: pt
  text: E ordenou-lhes com firmeza que ninguém soubesse disso[a]; e disse que dessem a ela algo para comer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deu-lhes ordens rigorosas para que ninguém ficasse sabendo disso”. A expressão grega inclui uma palavra intensificadora, literalmente “muito” ou “muitas coisas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “que fosse dado a ela comer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο αὐτοῖς πολλὰ
  choice: ordenou-lhes com firmeza
  rationale: O verbo médio διαστέλλομαι expressa uma ordem ou advertência forte, e πολλά intensifica o ato de ordenar. A formulação preserva essa força em português natural sem impor a ideia menos certa de repetição.
- source_word: ἵνα μηδεὶς γνοῖ τοῦτο
  choice: que ninguém soubesse disso
  rationale: 'A oração com ἵνα e subjuntivo apresenta o conteúdo e propósito da ordem: impedir que o acontecimento se tornasse conhecido. ''Disso'' retoma naturalmente o que ocorreu.'
- source_word: εἶπεν
  choice: disse
  rationale: Traduz diretamente o verbo comum λέγω, sem ampliar seu sentido para 'determinou', embora o contexto dê à fala valor de instrução.
- source_word: δοθῆναι αὐτῇ φαγεῖν
  choice: que dessem a ela algo para comer
  rationale: A construção grega é literalmente passiva, 'ser dado a ela para comer'. A forma portuguesa explicita o agente indeterminado e o objeto implícito, produzindo uma frase corrente e mantendo o sentido.
theological_decisions:
- issue: Ordem de segredo e seu alcance
  choice: Apresentar somente a ordem firme para que ninguém soubesse do acontecimento.
  alternative: Explicar a ordem como parte de um tema teológico mais amplo de segredo messiânico ou restringi-la expressamente apenas à família e às testemunhas imediatas.
  rationale: O versículo não fornece essa explicação nem delimita explicitamente o alcance além dos destinatários de αὐτοῖς; a tradução preserva a tensão narrativa sem acrescentar interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. 'Ordenou-lhes' conserva concisão e solenidade moderada; 'com firmeza' comunica a intensificação de πολλά. A repetição de 'que' é natural neste período, e 'algo para comer' explicita apenas o complemento exigido pelo idioma.
