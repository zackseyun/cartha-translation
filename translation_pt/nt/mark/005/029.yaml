  text: καὶ ⸀εὐθὺς ἐξηράνθη ἡ πηγὴ τοῦ αἵματος αὐτῆς, καὶ ἔγνω τῷ σώματι ὅτι ἴαται ἀπὸ τῆς μάστιγος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/029.yaml
  text: And immediately the flow of her blood dried up[b][a], and she knew in her body that she had been healed of the affliction.
translation:
  language: pt
  text: E imediatamente a fonte de seu sangramento secou[a], e ela soube em seu corpo que estava curada da aflição[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a nascente do seu sangue secou”. O grego emprega a imagem vívida de uma fonte ou nascente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “do flagelo”. A palavra grega significa literalmente “açoite” e pode designar, por extensão, uma aflição ou um sofrimento doloroso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Preserva a urgência narrativa característica de Marcos em linguagem corrente.
- source_word: ἐξηράνθη
  choice: secou
  rationale: Mantém a imagem vívida de ξηραίνω e expressa naturalmente a interrupção do sangramento.
- source_word: ἡ πηγὴ τοῦ αἵματος αὐτῆς
  choice: a fonte do seu sangue
  rationale: Conserva a metáfora explícita de πηγή, isto é, fonte ou nascente, sem reduzi-la apenas ao fluxo resultante.
- source_word: ἔγνω τῷ σώματι
  choice: soube, em seu corpo
  rationale: Preserva tanto o sentido cognitivo de ἔγνω quanto a percepção corporal indicada pelo dativo τῷ σώματι.
- source_word: ἴαται
  choice: estava curada
  rationale: O perfeito indica uma cura já realizada cujo resultado permanecia; em português, 'estava curada' comunica naturalmente esse estado resultante após 'soube'.
- source_word: ἀπὸ τῆς μάστιγος
  choice: daquele sofrimento
  rationale: μάστιξ significa literalmente açoite e, por extensão, sofrimento doloroso ou aflição; aqui se refere à enfermidade debilitante da mulher.
theological_decisions:
- issue: Natureza da declaração de cura
  choice: Apresentar tanto a cessação objetiva do sangramento quanto o reconhecimento corporal da mulher, sem explicar o mecanismo da cura.
  alternative: Traduzir apenas como uma sensação subjetiva da mulher.
  rationale: O grego afirma a interrupção do sangramento e também o conhecimento corporal da cura; a tradução mantém ambos sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A metáfora corporal do original foi mantida, e as alternativas menos transparentes foram registradas em notas.
