  source_fidelity: A tradução reproduz adequadamente a imediatidade (εὐθύς), a cessação do sangramento (ἐξηράνθη), o reconhecimento corporal (ἔγνω τῷ σώματι) e o estado resultante da cura expresso pelo perfeito ἴαται. Contudo, «fonte do seu sangue» pode, em português, sugerir a origem do próprio sangue, em vez da origem do sangramento; «fonte de seu sangramento» conserva a metáfora de πηγή no sentido contextual mais claro. «Daquele sofrimento» introduz uma deixis não marcada no grego; «da aflição» é mais direto e mantém a extensão figurada de μάστιξ.
  naturalness: «Fonte de seu sangramento» é mais idiomático e imediatamente inteligível em português moderno do que «fonte do seu sangue». A retirada das vírgulas em «soube em seu corpo» melhora o fluxo sem alterar a nuance. «Curada da aflição» é natural e formalmente adequado.
  terminology: «Sangramento», «curada» e «aflição» são escolhas claras e dignas. A nota preserva «nascente» como alternativa mais literal para πηγή e «flagelo» para a imagem figurada de μάστιξ, sem impor uma leitura médica ou doutrinária.
