    rationale: Embora reflita literalmente πηγὴ τοῦ αἵματος αὐτῆς, a expressão pode ser entendida como a fonte/origem do sangue dela. No contexto, πηγή designa a fonte do sangramento; «fonte de seu sangramento» preserva a imagem e comunica o referente com maior precisão.
  - severity: low
    issue: «daquele sofrimento» acrescenta uma nuance demonstrativa.
    rationale: O artigo grego τῆς não exige o demonstrativo português «daquele». «Da aflição» traduz o referente definido sem introduzir uma deixis adicional.
