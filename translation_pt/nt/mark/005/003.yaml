  yaml_path: translation/nt/mark/005/003.yaml
  text: who had his dwelling among the tombs[a], and no one could bind him anymore, not even with a chain.
translation:
  language: pt
  text: Ele morava entre os túmulos[a], e ninguém mais conseguia prendê-lo, nem mesmo com uma corrente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais literal, “nos túmulos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοίκησιν εἶχεν
  choice: morava
  rationale: A expressão idiomática significa que aquele era o lugar onde ele vivia. “Morava” é natural e claro em português, sem sugerir o caráter doméstico que “tinha sua moradia” poderia transmitir.
- source_word: ἐν τοῖς μνήμασιν
  choice: entre os túmulos
  rationale: μνῆμα designa túmulo ou lugar de sepultamento. “Entre os túmulos” descreve naturalmente o ambiente e evita afirmar de modo excessivamente específico que ele permanecia dentro deles.
- source_word: οὐκέτι
  choice: mais
  rationale: Na construção negativa “ninguém mais”, comunica que essa capacidade já não existia, preservando o sentido temporal de οὐκέτι.
- source_word: ἐδύνατο αὐτὸν δῆσαι
  choice: conseguia prendê-lo
  rationale: Expressa a incapacidade contínua de dominá-lo fisicamente. “Prender” é idiomático no contexto e mantém a ideia de amarrar ou manter preso.
- source_word: οὐδὲ ἁλύσει
  choice: nem mesmo com uma corrente
  rationale: Preserva a intensificação de οὐδέ e o singular ἁλύσει, indicando que nem uma corrente bastava para prendê-lo.
