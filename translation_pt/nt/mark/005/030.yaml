  text: καὶ ⸀εὐθὺς ὁ Ἰησοῦς ἐπιγνοὺς ἐν ἑαυτῷ τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν ἐπιστραφεὶς ἐν τῷ ὄχλῳ ἔλεγεν· Τίς μου ἥψατο τῶν ἱματίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/030.yaml
  text: And immediately Jesus[a], perceiving in himself that power had gone out from him, turned around in the crowd and said, “Who touched my garments?”
translation:
  language: pt
  text: 'E imediatamente Jesus, percebendo em si mesmo que dele havia saído poder, voltou-se no meio da multidão e disse: “Quem tocou nas minhas roupas?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Preserva o advérbio temporal característico de Marcos e a rapidez do movimento narrativo, em português atual.
- source_word: ἐπιγνοὺς
  choice: percebendo
  rationale: Expressa a consciência clara indicada por ἐπιγινώσκω e se harmoniza naturalmente com ἐν ἑαυτῷ.
- source_word: ἐν ἑαυτῷ
  choice: em si mesmo
  rationale: Mantém a referência explícita à percepção interior de Jesus, sem acrescentar explicação.
- source_word: τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν
  choice: que dele havia saído poder
  rationale: Reproduz a origem marcada por ἐξ αὐτοῦ e a anterioridade relativa do particípio aoristo ἐξελθοῦσαν; a ordem portuguesa evita uma formulação pesada.
- source_word: ἐπιστραφεὶς
  choice: voltou-se
  rationale: Comunica o movimento físico de Jesus de modo natural e digno, sem exigir o mais coloquial “virou-se”.
- source_word: ἐν τῷ ὄχλῳ
  choice: no meio da multidão
  rationale: Situa Jesus entre as pessoas que o cercavam e oferece maior clareza espacial do que apenas “na multidão”.
- source_word: ἔλεγεν
  choice: perguntou
  rationale: Como introduz uma pergunta direta, “perguntou” é idiomático em português; o contexto não exige representar o imperfeito como ação repetida.
- source_word: ἥψατο
  choice: tocou
  rationale: É o equivalente direto e contextual do uso médio de ἅπτω.
- source_word: τῶν ἱματίων
  choice: nas minhas roupas
  rationale: Mantém o plural e o sentido amplo de vestes, em linguagem moderna e acessível; “manto” seria específico demais.
theological_decisions:
- issue: A saída de δύναμις de Jesus
  choice: Afirmar diretamente que dele havia saído poder
  alternative: Explicitar como “poder de cura” ou tratar a experiência apenas como uma sensação subjetiva
  rationale: O texto apresenta a saída de poder como o conteúdo da percepção de Jesus. A tradução preserva essa afirmação e sua tensão narrativa sem explicar o mecanismo nem restringir δύναμις por meio de um qualificativo ausente.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O registro é digno, porém não arcaico. Não se adotou o marcador [a] da camada inglesa porque a nota fornecida (“Ou ‘minhas vestes’”) parece desalinhada com a posição do marcador junto a “Jesus” e não registra uma ambiguidade necessária do texto grego.
