    rationale: Embora reproduza mecanicamente o perfeito de ἔχω, «tinha tido» é estilisticamente pesado. «Aquele que tivera a legião» mantém a referência a uma condição anterior e soa natural em português literário moderno.
  - severity: low
    issue: Pontuação do inciso com travessão.
    rationale: A vírgula depois do travessão de fechamento («—, e») é desnecessária; o travessão já delimita o inciso e a coordenação final flui sem essa vírgula.
