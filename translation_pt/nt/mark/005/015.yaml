reference: Mark 5:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔρχονται πρὸς τὸν Ἰησοῦν, καὶ θεωροῦσιν τὸν δαιμονιζόμενον ⸀καθήμενον ἱματισμένον καὶ σωφρονοῦντα, τὸν ἐσχηκότα τὸν ⸀λεγιῶνα, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/015.yaml
  text: And they came to Jesus and saw the demon-possessed man sitting there[b][a], clothed and in his right mind—the one who had the legion—and they were afraid.
translation:
  language: pt
  text: Então chegaram até Jesus e viram o homem que estivera possuído por demônios, sentado, vestido e em perfeito juízo — aquele que tivera a legião[a] — e ficaram com medo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Legião». O termo retoma a autodesignação dos demônios no versículo 9 e pode ser entendido como nome próprio.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχονται
  choice: chegaram
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, mais natural na narrativa em português.
- source_word: θεωροῦσιν
  choice: viram
  rationale: Outro presente histórico; «viram» expressa de modo claro a percepção visual no fluxo narrativo.
- source_word: δαιμονιζόμενον
  choice: o homem que tinha estado possuído por demônios
  rationale: O particípio substantivado identifica o homem antes afligido; a formulação deixa claro que a possessão já cessara e preserva a realidade da aflição demoníaca.
- source_word: καθήμενον
  choice: sentado
  rationale: Descreve de maneira direta a condição visível do homem, sem acrescentar ao texto um advérbio de lugar.
- source_word: ἱματισμένον
  choice: vestido
  rationale: Termo corrente e digno que realça o contraste com a condição anterior do homem.
- source_word: σωφρονοῦντα
  choice: em perfeito juízo
  rationale: Expressão portuguesa natural para lucidez e domínio de si restaurados, sem reduzir a cena a uma descrição clínica.
- source_word: ἐσχηκότα
  choice: que tinha tido
  rationale: O particípio perfeito remete à posse anterior, ainda relevante para identificar o homem; o mais-que-perfeito composto preserva essa relação temporal.
- source_word: λεγιῶνα
  choice: a legião
  rationale: O artigo grego e o contexto permitem entender o termo como designação descritiva da multidão de demônios; a possível leitura como nome próprio é preservada em nota.
- source_word: ἐφοβήθησαν
  choice: ficaram com medo
  rationale: 'Formulação idiomática que pode transmitir o aspecto ingressivo do aoristo: o que viram provocou medo.'
theological_decisions:
- issue: Descrição da aflição demoníaca
  choice: o homem que tinha estado possuído por demônios
  alternative: o endemoninhado
  rationale: A tradução mantém a apresentação narrativa de possessão demoníaca real, evita terminologia potencialmente estigmatizante ou menos transparente e indica, pelo contexto verbal, que a condição havia cessado.
- issue: λεγιών como designação ou nome próprio
  choice: a legião
  alternative: Legião
  rationale: O grego pode retomar tanto uma designação quanto o nome usado anteriormente pelos demônios. A minúscula no texto não força a leitura como nome próprio, e a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Os presentes históricos foram naturalizados no passado. A ordem dos três particípios visíveis — sentado, vestido e em perfeito juízo — foi preservada.
