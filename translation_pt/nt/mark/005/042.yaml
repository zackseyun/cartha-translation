source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀνέστη τὸ κοράσιον καὶ περιεπάτει, ἦν γὰρ ἐτῶν δώδεκα. καὶ ἐξέστησαν ⸁εὐθὺς ἐκστάσει μεγάλῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/042.yaml
  text: And immediately the girl stood up and began walking[a], for she was twelve years old[b]. And immediately they were overcome with great amazement.
translation:
  language: pt
  text: E imediatamente a menina se levantou[a] e começou a andar, pois tinha doze anos. E imediatamente eles ficaram tomados de grande espanto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «se pôs de pé». O verbo grego também pode ser traduzido como «se ergueu».
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «ficaram espantados com grande espanto». O grego emprega palavras da mesma raiz para intensificar o assombro.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Preserva a vivacidade e o ritmo urgente característicos da narrativa de Marcos, em linguagem clara e corrente.
- source_word: ἀνέστη
  choice: se levantou
  rationale: Neste contexto, descreve a ação física da menina ao levantar-se depois da ordem de Jesus. A expressão é natural em português e não torna explícita uma nuance técnica de ressurreição que o verbo, isoladamente, não exige.
- source_word: κοράσιον
  choice: a menina
  rationale: Expressa de modo natural a referência a uma menina; a idade indicada logo depois torna desnecessário acrescentar qualificadores como «pequena» ou «jovem».
- source_word: περιεπάτει
  choice: começou a andar
  rationale: O imperfeito apresenta uma ação em curso após ela se levantar; esta formulação comunica de modo idiomático tanto o início quanto a continuidade visível da ação.
- source_word: ἦν γὰρ ἐτῶν δώδεκα
  choice: pois tinha doze anos
  rationale: É a forma corrente de indicar idade em português, e «pois» conserva a função explicativa de γάρ.
- source_word: ἐξέστησαν
  choice: ficaram tomados
  rationale: Comunica que os presentes foram profundamente dominados pelo assombro e permite reproduzir com naturalidade a intensidade da construção cognata grega.
- source_word: ἐκστάσει μεγάλῃ
  choice: de grande espanto
  rationale: Transmite a forte admiração ou assombro da expressão sem recorrer a «êxtase», termo que poderia sugerir um sentido moderno inadequado.
theological_decisions:
- issue: Possível nuance de ressurreição em ἀνέστη
  choice: Traduzir como ação física — «se levantou» — dentro do relato do milagre.
  alternative: «ressuscitou» ou «se ergueu»
  rationale: O contexto mostra claramente que a menina voltou à vida, mas o verbo também pode simplesmente descrever alguém que se levanta. A tradução preserva a força do acontecimento sem impor ao verbo uma formulação teológica mais específica do que ele exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «imediatamente» foi mantida para refletir o texto grego e o ritmo narrativo de Marcos; a construção cognata final foi vertida idiomaticamente e esclarecida em nota.
