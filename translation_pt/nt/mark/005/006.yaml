  text: ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν ἀπὸ μακρόθεν ἔδραμεν καὶ προσεκύνησεν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/006.yaml
  text: And seeing Jesus from a distance[a], he ran and bowed down before him,
translation:
  language: pt
  text: E, ao ver Jesus de longe, correu e se prostrou diante dele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o adorou” ou “lhe prestou homenagem”. O verbo grego pode indicar adoração ou um ato de reverência ou prostração, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδὼν
  choice: E, ao ver
  rationale: Mantém a coordenação narrativa característica de Marcos e expressa naturalmente em português a relação temporal do particípio aoristo, sem acrescentar uma sequência mais rígida do que o grego exige.
- source_word: τὸν Ἰησοῦν
  choice: Jesus
  rationale: Reprodução direta do nome próprio; o artigo grego não é usado com nomes pessoais nesse contexto em português corrente.
- source_word: ἀπὸ μακρόθεν
  choice: de longe
  rationale: Expressa com clareza e naturalidade a distância espacial, sem o tom mais literário de alternativas como “ao longe”.
- source_word: ἔδραμεν
  choice: correu
  rationale: Traduz diretamente o aoristo de τρέχω, sem acrescentar a intensidade implícita em opções como “precipitou-se”.
- source_word: προσεκύνησεν αὐτόν
  choice: se prostrou diante dele
  rationale: Preserva o gesto visível de prostração e evita decidir no texto principal se o ato constitui adoração religiosa ou homenagem, nuances que o verbo προσκυνέω pode assumir conforme o contexto.
theological_decisions:
- issue: Se προσεκύνησεν deve ser traduzido explicitamente como um ato de adoração dirigido a Jesus
  choice: se prostrou diante dele
  alternative: o adorou; lhe prestou homenagem
  rationale: O verbo pode indicar adoração, homenagem ou prostração. Neste contexto, explicitar “adorou” resolveria uma nuance teológica que o termo grego deixa aberta; a tradução escolhida comunica o ato e preserva a tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A construção “ao ver” evita rigidez, enquanto “se prostrou diante dele” preserva tanto a ação corporal quanto a possível força religiosa do original.
