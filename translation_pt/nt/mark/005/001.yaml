lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Preserva de modo transparente o fluxo narrativo paratático característico de Marcos, sem suavizá-lo para «Então».
- source_word: ἦλθον
  choice: chegaram
  rationale: O aoristo indicativo plural de ἔρχομαι refere-se naturalmente a Jesus e aos que estavam com ele; «chegaram» é idiomático em português para a conclusão da travessia.
- source_word: εἰς τὸ πέραν
  choice: ao outro lado
  rationale: Expressa com naturalidade o movimento até a margem oposta, preservando o sentido direcional da locução grega.
- source_word: τῆς θαλάσσης
  choice: do mar
  rationale: Embora o referente seja o mar da Galileia, geograficamente um lago, o grego emprega θάλασσα; «mar» preserva a formulação da fonte e o uso tradicional dos Evangelhos.
- source_word: εἰς τὴν χώραν
  choice: à região
  rationale: χώρα designa aqui uma área ou distrito; «região» evita o sentido moderno de um Estado nacional associado a «país».
- source_word: Γερασηνῶν
  choice: dos gerasenos
  rationale: Reproduz o gentílico plural do texto SBLGNT em forma portuguesa natural, sem substituir a leitura adotada por uma variante manuscrita.
theological_decisions:
- issue: Variação textual e geográfica do topônimo na narrativa
  choice: gerasenos
  alternative: gadarenos; gergesenos
  rationale: O texto principal segue Γερασηνῶν, a leitura do SBLGNT. Como há variantes manuscritas relevantes e antigas, elas são mantidas em nota sem tentar resolver silenciosamente a questão geográfica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação inicial com «E» conserva o ritmo de Marcos; «chegaram» soa mais natural que «vieram» neste contexto de travessia. O marcador [a] aparece imediatamente após «mar», conforme a camada de consulta fornecida, embora a nota diga respeito ao topônimo no fim do versículo.
