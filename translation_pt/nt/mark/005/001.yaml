base_translation:
  language: en
  yaml_path: translation/nt/mark/005/001.yaml
  text: And they came to the other side of the sea[a], to the region of the Gerasenes.
translation:
  language: pt
  text: E chegaram ao outro lado do mar, à região dos gerasenos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem «gadarenos»; outros, «gergesenos».
