  text: ἡ δὲ γυνὴ φοβηθεῖσα καὶ τρέμουσα, εἰδυῖα ὃ γέγονεν ⸀αὐτῇ, ἦλθεν καὶ προσέπεσεν αὐτῷ καὶ εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/033.yaml
  text: But the woman[a], fearing and trembling, knowing what had happened to her[b], came and fell down before him and told him the whole truth.
translation:
  language: pt
  text: Mas a mulher, com medo e tremendo, sabendo o que lhe havia acontecido, veio e caiu diante dele[a] e contou-lhe toda a verdade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “prostrou-se diante dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca uma leve contraposição ou progressão narrativa em relação à pergunta de Jesus e à reação da multidão.
- source_word: ἡ γυνὴ
  choice: a mulher
  rationale: O artigo retoma a mulher já apresentada na narrativa.
- source_word: φοβηθεῖσα καὶ τρέμουσα
  choice: com medo e tremendo
  rationale: Expressa de modo natural em português os dois particípios e preserva a vivacidade de seu estado emocional.
- source_word: εἰδυῖα ὃ γέγονεν αὐτῇ
  choice: sabendo o que lhe havia acontecido
  rationale: Mantém a relação circunstancial do particípio sem torná-la explicitamente causal e traduz o dativo de maneira idiomática.
- source_word: ἦλθεν
  choice: veio
  rationale: Reproduz o movimento simples expresso pelo aoristo narrativo.
- source_word: προσέπεσεν αὐτῷ
  choice: prostrou-se diante dele
  rationale: Comunica o ato físico de cair diante de Jesus em atitude de temor ou reverência, sem afirmar por si só que se tratava de adoração.
- source_word: εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν
  choice: contou-lhe toda a verdade
  rationale: É uma formulação portuguesa natural que preserva a ideia de um relato completo, sem ocultação.
theological_decisions:
- issue: A postura da mulher diante de Jesus em προσέπεσεν αὐτῷ
  choice: prostrou-se diante dele
  alternative: caiu diante dele
  rationale: O verbo pode indicar que ela caiu diante de Jesus por reverência, medo ou súplica. A tradução preserva a postura sem decidir que o gesto constituiu formalmente adoração.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção narrativa fluida. “Com medo e tremendo” evita o pouco natural “temendo e tremendo”, enquanto “prostrou-se” conserva a força física e reverencial do verbo grego.
