  source_fidelity: 'A primeira oração reproduz adequadamente o vocativo Θυγάτηρ, πίστις e o perfeito σέσωκέν σε: “sua fé salvou você” preserva a amplitude de σῴζω sem reduzir antecipadamente o sentido a cura. “Vá em paz” é equivalente idiomático fiel de ὕπαγε εἰς εἰρήνην. Contudo, “fique livre do seu sofrimento” representa apenas a separação da aflição expressa por ἀπό e deixa de explicitar ὑγιής, isto é, o estado de estar bem/sã.'
