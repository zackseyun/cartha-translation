source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· ὕπαγε εἰς εἰρήνην, καὶ ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/034.yaml
  text: But he said to her[a], “Daughter, your faith has saved you. Go in peace[b], and be well from your affliction.”
translation:
  language: pt
  text: 'Mas ele lhe disse: “Filha, sua fé salvou você[a]. Vá em paz e fique bem, livre do seu sofrimento.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “curou você” ou “deixou você bem”. O verbo grego pode se referir a salvação, livramento ou cura.
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: Filha
  rationale: Mantém o vocativo literal, afetuoso e familiar, sem acrescentar um possessivo ausente do grego.
- source_word: πίστις
  choice: fé
  rationale: Neste contexto, indica a confiança da mulher em Jesus; “fé” preserva o termo teologicamente significativo e sua concordância lexical.
- source_word: σέσωκέν σε
  choice: salvou você
  rationale: Preserva a amplitude de σῴζω, que pode envolver salvação, livramento ou cura, e mantém a tensão com a referência explícita à condição física na oração seguinte. O perfeito grego é expresso naturalmente pelo pretérito perfeito em português.
- source_word: ὕπαγε εἰς εἰρήνην
  choice: Vá em paz
  rationale: Expressão idiomática natural em português que comunica partida em estado de paz.
- source_word: ἴσθι ὑγιὴς ἀπὸ
  choice: fique livre de
  rationale: O imperativo estativo pede que ela permaneça sã e separada da aflição. “Fique livre de” soa natural em português e evita tratar o verbo como um novo ato de cura.
- source_word: μάστιγός
  choice: sofrimento
  rationale: A palavra, literalmente ligada a açoite ou flagelo, designa aqui metaforicamente a condição dolorosa e debilitante da mulher; “sofrimento” conserva essa força sem soar arcaico.
theological_decisions:
- issue: Sentido de σῴζω em contexto de cura
  choice: salvou você
  alternative: curou você / deixou você bem
  rationale: “Salvou” preserva a abrangência lexical e a possível dimensão que ultrapassa a cura física, sem negar que a cura esteja incluída no contexto.
- issue: Relação entre fé e salvação/cura
  choice: a sua fé salvou você
  alternative: a sua confiança curou você
  rationale: A formulação conserva πίστις como “fé” e não especifica além do texto de que modo a fé se relaciona com a ação salvadora de Jesus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento “você” evita a artificialidade regional de “tu” e a excessiva formalidade de “a senhora”. A construção final foi tornada idiomática sem apagar a distinção entre σῴζω e ὑγιής.
