base_translation:
  language: en
  yaml_path: translation/nt/mark/005/011.yaml
  text: There was there near the mountain a large herd of pigs feeding[a][b].
translation:
  language: pt
  text: Havia ali, perto do monte, uma grande manada de porcos se alimentando.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “junto ao monte”. A expressão grega indica localização perto ou ao lado do monte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “suínos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: Havia
  rationale: O imperfeito ἦν tem aqui sentido existencial, expresso naturalmente por “havia”. A partícula δέ é um conector narrativo leve e não exige uma palavra separada em português.
- source_word: ἐκεῖ
  choice: ali
  rationale: Advérbio locativo simples; “ali” é natural na narrativa e aponta para o lugar já em foco.
- source_word: πρὸς τῷ ὄρει
  choice: perto do monte
  rationale: Com o dativo, πρός indica localização ou proximidade. “Perto do monte” preserva esse sentido sem impor precisão indevida.
- source_word: ἀγέλη
  choice: manada
  rationale: Designa um agrupamento de animais. “Manada” é uma equivalência corrente e compreensível para um grupo numeroso de porcos.
- source_word: χοίρων
  choice: de porcos
  rationale: χοῖρος significa porco. A forma comum “porcos” é mais atual e acessível que alternativas formais.
- source_word: μεγάλη
  choice: grande
  rationale: Qualifica o tamanho ou número da manada; “grande” é a formulação portuguesa direta e natural.
- source_word: βοσκομένη
  choice: se alimentando
  rationale: O particípio presente descreve a manada enquanto comia. “Se alimentando” é abrangente e evita restringir a ação a pastar capim.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural sobretudo no Brasil e compreensão internacional. “Monte” mantém o referente topográfico sem ampliar indevidamente para “montanha”; “manada de porcos” é idiomático e acessível.
