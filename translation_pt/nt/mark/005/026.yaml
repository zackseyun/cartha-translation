id: MRK.5.26
reference: Mark 5:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πολλὰ παθοῦσα ὑπὸ πολλῶν ἰατρῶν καὶ δαπανήσασα τὰ παρ’ αὐτῆς πάντα καὶ μηδὲν ὠφεληθεῖσα ἀλλὰ μᾶλλον εἰς τὸ χεῖρον ἐλθοῦσα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/026.yaml
  text: and after suffering much under many physicians[a], and after spending all that she had and benefiting nothing, but rather becoming worse[b],
translation:
  language: pt
  text: e que tinha sofrido muito nas mãos de muitos médicos[a], gastado tudo o que possuía[b] e, sem ter obtido benefício algum, pelo contrário, piorado,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa de muitos médicos” ou “sob o tratamento de muitos médicos”. O grego pode enfatizar tanto a atuação dos médicos como o fato de ela ter sido submetida aos tratamentos deles.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “todas as coisas da parte dela”, isto é, tudo o que ela tinha.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ παθοῦσα
  choice: tinha sofrido muito
  rationale: Expressa o particípio aoristo como circunstância anterior e preserva de modo natural a intensidade de πολλά e o sentido experiencial de πάσχω.
- source_word: ὑπὸ πολλῶν ἰατρῶν
  choice: nas mãos de muitos médicos
  rationale: Ὑπό com genitivo indica agência ou fonte. A expressão comunica que o sofrimento ocorreu sob os tratamentos dos médicos sem eliminar a possível ênfase na atuação deles.
- source_word: δαπανήσασα
  choice: gastado
  rationale: Mantém o sentido simples de despender recursos e acompanha naturalmente a sequência de formas participiais, sem acrescentar a ideia mais forte de esgotamento ao próprio verbo.
- source_word: τὰ παρ’ αὐτῆς πάντα
  choice: tudo o que possuía
  rationale: Forma idiomática em português para tudo quanto estava à disposição dela ou lhe pertencia, preservando a totalidade expressa por πάντα.
- source_word: μηδὲν ὠφεληθεῖσα
  choice: sem ter obtido benefício algum
  rationale: 'Reflete o valor passivo de ὠφελέω: ela não recebeu proveito ou melhora alguma dos tratamentos.'
- source_word: ἀλλὰ μᾶλλον
  choice: pelo contrário
  rationale: 'Marca com clareza a oposição intensificada: não apenas faltou benefício, mas ocorreu o resultado inverso.'
- source_word: εἰς τὸ χεῖρον ἐλθοῦσα
  choice: piorado
  rationale: Equivalente português natural para a expressão idiomática que descreve a passagem a um estado pior.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura permanece como continuação da frase anterior e conserva a sequência cumulativa dos particípios gregos. O marcador [b] foi colocado junto à expressão que sua nota explica.
