reference: Mark 5:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπέτρεψεν ⸀αὐτοῖς. καὶ ἐξελθόντα τὰ πνεύματα τὰ ἀκάθαρτα εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, ⸀ὡς δισχίλιοι, καὶ ἐπνίγοντο ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/013.yaml
  text: And he permitted them[a]. Then the unclean spirits came out and entered the pigs, and the herd—about two thousand—rushed down the steep bank into the sea[b], and they drowned in the sea.
translation:
  language: pt
  text: E ele lhes deu permissão. Então os espíritos impuros saíram e entraram nos porcos; e a manada, cerca de dois mil, precipitou-se pela encosta íngreme para dentro do mar[a], e os porcos se afogaram no mar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o mar da Galileia, que geograficamente é um lago.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέτρεψεν αὐτοῖς
  choice: lhes deu permissão
  rationale: Expressa com clareza o sentido de autorizar ou permitir, mantendo como referente contextual os espíritos impuros.
- source_word: τὰ πνεύματα τὰ ἀκάθαρτα
  choice: os espíritos impuros
  rationale: Preserva a linguagem pessoal e espiritual do grego; «impuros» comunica naturalmente em português as conotações de ἀκάθαρτα.
- source_word: ἐξελθόντα
  choice: saíram
  rationale: O particípio aoristo indica que os espíritos deixaram o homem antes de entrarem nos porcos; a coordenação torna a sequência natural em português.
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: entraram nos porcos
  rationale: É uma formulação direta e idiomática que reproduz o movimento indicado por εἰς.
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: a manada ... precipitou-se
  rationale: O verbo comunica movimento súbito e impetuoso; o singular concorda com o substantivo coletivo «manada».
- source_word: κατὰ τοῦ κρημνοῦ
  choice: pela encosta íngreme
  rationale: κρημνός pode designar encosta abrupta, barranco ou precipício; esta opção evita pressupor uma queda vertical sem enfraquecer o perigo do terreno.
- source_word: εἰς τὴν θάλασσαν
  choice: para dentro do mar
  rationale: Mantém o substantivo «mar» usado no texto grego, embora geograficamente se trate do mar da Galileia, um lago.
- source_word: ὡς δισχίλιοι
  choice: cerca de dois mil
  rationale: Preserva o valor aproximativo de ὡς diante do numeral.
- source_word: ἐπνίγοντο
  choice: se afogaram
  rationale: O médio/passivo imperfeito descreve os animais perecendo por afogamento; em português narrativo, «se afogaram» é natural e não sugere um agente externo que os tenha afogado.
theological_decisions:
- issue: Referente de «lhes»
  choice: Os espíritos impuros
  alternative: A manada ou outro grupo
  rationale: O contexto imediato identifica os espíritos como aqueles que haviam pedido permissão; a tradução conserva o pronome sem inserir explicação no corpo do versículo.
- issue: Natureza dos «espíritos impuros»
  choice: Conservar a linguagem de seres espirituais pessoais
  alternative: Forças malignas impessoais
  rationale: O substantivo πνεύματα e as ações atribuídas a eles sustentam a linguagem pessoal da narrativa, sem exigir elaboração demonológica adicional.
- issue: Sujeito implícito de ἐπνίγοντο
  choice: Explicitar «os porcos»
  alternative: Manter apenas «eles» ou fazer de «a manada» o sujeito
  rationale: A forma plural grega remete naturalmente aos cerca de dois mil porcos; a explicitação evita em português uma possível referência equivocada aos espíritos impuros.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Manada» e «encosta íngreme» são termos correntes; a repetição de «mar» preserva a ênfase e a estrutura do original.
