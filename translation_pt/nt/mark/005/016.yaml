  text: ⸂καὶ διηγήσαντο⸃ αὐτοῖς οἱ ἰδόντες πῶς ἐγένετο τῷ δαιμονιζομένῳ καὶ περὶ τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/016.yaml
  text: And those who had seen it told them how it had happened to the demon-possessed man[a], and about the pigs.
translation:
  language: pt
  text: E os que tinham visto contaram-lhes como aquilo havia acontecido ao homem possuído por demônios[a] e sobre os porcos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao endemoninhado” ou “ao homem sob ação demoníaca”. O termo grego não especifica, por si só, o grau exato dessa ação nem se refere explicitamente a um ou a vários demônios.
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσαντο
  choice: contaram
  rationale: O verbo indica relatar ou narrar o ocorrido; “contaram” é natural, claro e adequado ao contexto narrativo.
- source_word: οἱ ἰδόντες
  choice: os que tinham visto
  rationale: Preserva o particípio substantivado e identifica essas pessoas como testemunhas do ocorrido sem acrescentar o termo interpretativo “testemunhas oculares”.
- source_word: πῶς ἐγένετο
  choice: como aquilo havia acontecido
  rationale: Mantém a ideia de como o acontecimento se deu e o mais-que-perfeito situa o fato antes do relato das testemunhas.
- source_word: τῷ δαιμονιζομένῳ
  choice: ao homem possuído por demônios
  rationale: Expressa de modo claro e corrente a condição da pessoa sob ação demoníaca no contexto. O plural concorda com a descrição anterior de muitos demônios, embora a forma grega, por si só, não especifique número.
- source_word: περὶ τῶν χοίρων
  choice: o que tinha acontecido com os porcos
  rationale: No contexto, περί com o genitivo introduz o segundo assunto do relato. A formulação explicita naturalmente em português a elipse do acontecimento referente aos porcos.
theological_decisions:
- issue: Tradução de δαιμονιζομένῳ numa narrativa de ação demoníaca
  choice: o homem possuído por demônios
  alternative: o endemoninhado; o homem sob ação demoníaca
  rationale: A escolha comunica de forma acessível que o homem estava sujeito a agentes demoníacos reais dentro do mundo narrativo de Marcos, sem reduzir sua condição a uma categoria meramente psicológica. A nota registra alternativas e a indeterminação lexical quanto ao grau exato de domínio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “E também” distingue com naturalidade os dois assuntos relatados; a repetição de “acontecido” torna explícita a elipse grega sem mudar o sentido.
