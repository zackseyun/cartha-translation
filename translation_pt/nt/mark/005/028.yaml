  yaml_path: translation/nt/mark/005/028.yaml
  text: For she was saying[a], "If I touch even his garments, I will be healed."
translation:
  language: pt
  text: 'Pois ela dizia: “Se eu tocar nem que seja só nas roupas dele, ficarei curada[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego também pode significar “serei salva” ou “ficarei bem”; neste contexto, refere-se à cura física.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ela dizia
  rationale: O imperfeito indica ação em curso ou repetida no passado. “Ela dizia” preserva esse aspecto sem determinar se as palavras foram pronunciadas em voz alta ou apenas pensadas.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação para a ação narrada anteriormente e mantém a conexão argumentativa de modo natural e digno.
- source_word: ὅτι
  choice: dois-pontos e discurso direto
  rationale: Introduz o conteúdo do que ela dizia; em português, o discurso direto é a forma mais natural de apresentá-lo.
- source_word: ἐὰν
  choice: Se
  rationale: Introduz uma condição eventual com subjuntivo; “Se eu tocar” expressa naturalmente a ação futura esperada.
- source_word: ἅψωμαι
  choice: eu tocar
  rationale: O verbo significa “tocar” neste contexto; o futuro do subjuntivo português corresponde de modo idiomático à condição grega.
- source_word: κἂν
  choice: nem que seja só
  rationale: Preserva a ênfase de minimização — tocar apenas nas roupas já seria suficiente — em linguagem portuguesa corrente.
- source_word: τῶν ἱματίων αὐτοῦ
  choice: nas roupas dele
  rationale: O substantivo está no plural e designa genericamente as peças de roupa. “Roupas” é atual, claro e menos específico do que “manto”.
- source_word: σωθήσομαι
  choice: ficarei curada
  rationale: No contexto imediato da hemorragia, o verbo se refere à restauração física. A amplitude semântica de σῴζω, que também pode significar “salvar”, é preservada em nota.
theological_decisions:
- issue: Sentido de σωθήσομαι em uma narrativa de cura
  choice: ficarei curada
  alternative: serei salva; ficarei bem
  rationale: A expectativa imediata da mulher é a cura física. Contudo, como o verbo grego pode abranger tanto cura quanto salvação, a alternativa é registrada em nota para não eliminar a possível ressonância teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Nem que seja só” comunica de forma natural a ideia de tocar apenas nas roupas, sem tornar o texto excessivamente formal.
