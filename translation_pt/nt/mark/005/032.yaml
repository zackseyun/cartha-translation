- source_word: ἰδεῖν
  choice: para ver
  rationale: O infinitivo exprime propósito e recebe uma tradução direta e natural.
- source_word: τὴν ... ποιήσασαν
  choice: quem tinha feito
  rationale: A construção substantivada identifica a pessoa responsável; em português, «quem» é natural, enquanto a nota preserva a informação gramatical de que o referente é feminino.
- source_word: τοῦτο
  choice: aquilo
  rationale: O demonstrativo remete ao ato imediatamente anterior; «aquilo» é idiomático nesse contexto narrativo.
