  text: καὶ οὐκ ἀφῆκεν οὐδένα ⸂μετ’ αὐτοῦ⸃ συνακολουθῆσαι εἰ μὴ ⸀τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/037.yaml
  text: And he allowed no one to accompany him except Peter and James and John, the brother of James.
translation:
  language: pt
  text: E não permitiu que ninguém o acompanhasse, a não ser Pedro, Tiago e João, irmão de Tiago.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: permitiu
  rationale: Com o infinitivo συνακολουθῆσαι, o verbo significa permitir ou deixar que alguém faça algo. “Permitiu” é claro, atual e preserva a autoridade de Jesus sobre quem poderia acompanhá-lo.
- source_word: οὐδένα
  choice: ninguém
  rationale: Expressa de modo direto a exclusão total indicada pelo pronome sob negação.
- source_word: μετ’ αὐτοῦ συνακολουθῆσαι
  choice: o acompanhasse
  rationale: “Acompanhar” reúne naturalmente em português a ideia do verbo composto e da expressão “com ele”, evitando a redundância de “acompanhasse com ele”.
- source_word: εἰ μὴ
  choice: a não ser
  rationale: Neste contexto, introduz uma exceção, não uma condição. “A não ser” é idiomático e inequívoco.
- source_word: τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Pedro, Tiago e João
  rationale: Emprega as formas portuguesas tradicionais dos nomes. A enumeração com vírgulas é natural em português sem perder a coordenação do grego.
- source_word: τὸν ἀδελφὸν Ἰακώβου
  choice: irmão de Tiago
  rationale: A expressão em aposição identifica João de maneira transparente; em português, o artigo pode ser omitido naturalmente após o nome próprio.
theological_decisions: []
