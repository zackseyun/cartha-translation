id: MRK.5.36
reference: Mark 5:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀παρακούσας τὸν λόγον λαλούμενον λέγει τῷ ἀρχισυναγώγῳ· Μὴ φοβοῦ, μόνον πίστευε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/036.yaml
  text: But Jesus[a], overhearing the word being spoken, says to the synagogue leader, “Do not be afraid[b]; only believe.”
translation:
  language: pt
  text: 'Mas Jesus, ouvindo[a] o que estava sendo dito, diz ao dirigente da sinagoga: “Não tenha medo; apenas creia[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desconsiderando o que estava sendo dito”, entendendo παρακούσας como recusar-se a dar atenção à notícia, em vez de ouvi-la.
    reason: alternative_reading
  - marker: b
    text: Ou “apenas confie”; também pode ser entendido como “continue crendo”. O verbo grego é πιστεύω.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσας
  choice: ouvindo
  rationale: O particípio pode significar ouvir algo dito ou desconsiderá-lo. No fluxo narrativo, Jesus ouve a notícia dirigida ao dirigente e responde a ela; a outra acepção é preservada em nota.
- source_word: τὸν λόγον λαλούμενον
  choice: o que estava sendo dito
  rationale: Expressa naturalmente em português a fala em andamento e remete à notícia do versículo anterior, sem explicitar além do grego.
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico característico e vívido da narrativa de Marcos.
- source_word: ἀρχισυναγώγῳ
  choice: ao dirigente da sinagoga
  rationale: Designa o responsável ou dirigente da sinagoga em linguagem atual, clara e sem tom arcaico.
- source_word: Μὴ φοβοῦ
  choice: Não tenha medo
  rationale: É a formulação idiomática contemporânea que preserva a força da ordem negativa.
- source_word: μόνον
  choice: apenas
  rationale: Preserva a restrição enfática da resposta pedida por Jesus e soa natural em português.
- source_word: πίστευε
  choice: creia
  rationale: É o equivalente verbal direto de πιστεύω no contexto. A forma presente pode sugerir continuidade, mas o português não exige que essa nuance seja explicitada no texto principal.
theological_decisions:
- issue: Sentido de παρακούσας
  choice: Jesus ouviu o que estava sendo dito e então falou ao dirigente da sinagoga.
  alternative: Jesus desconsiderou o que foi dito e falou ao dirigente da sinagoga.
  rationale: As duas acepções são lexicalmente possíveis. O contexto imediato favorece a percepção da notícia, mas a ambiguidade interpretativa genuína é preservada em nota.
- issue: Sentido de πιστεύω na ordem de Jesus
  choice: creia
  alternative: confie; continue crendo
  rationale: “Creia” mantém a correspondência lexical direta e a linguagem bíblica compreensível. “Confie” enfatiza a dimensão relacional, e “continue crendo” explicita uma possível nuance durativa do presente, mas nenhuma delas deve substituir silenciosamente a formulação mais aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Dirigente da sinagoga” comunica a função sem arcaísmo; o presente “diz” conserva a vivacidade narrativa de Marcos.
