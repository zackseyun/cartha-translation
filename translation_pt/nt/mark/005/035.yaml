  source_fidelity: 'O texto reproduz com fidelidade a sequência e os elementos centrais do grego: a ação simultânea («Enquanto ele ainda falava»), a chegada dos mensageiros, a origem contextualizada deles, o anúncio da morte da filha e a pergunta que desaconselha continuar a incomodar Jesus. «Da casa do dirigente da sinagoga» é uma explicitação contextual segura de ἀπὸ τοῦ ἀρχισυναγώγου, devidamente sinalizada por nota.'
