id: MRK.5.35
reference: Mark 5:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχονται ἀπὸ τοῦ ἀρχισυναγώγου λέγοντες ὅτι Ἡ θυγάτηρ σου ἀπέθανεν· τί ἔτι σκύλλεις τὸν διδάσκαλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/035.yaml
  text: While he was still speaking[a], people came from the synagogue leader's house, saying, “Your daughter has died[b]. Why do you still trouble the Teacher?”
translation:
  language: pt
  text: 'Enquanto ele ainda falava, chegaram pessoas da casa do dirigente da sinagoga[a], dizendo: “Sua filha morreu. Por que continuar incomodando o Mestre?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “do dirigente da sinagoga”.
    reason: A tradução explicita “casa” com base no contexto, pois o próprio dirigente estava com Jesus.
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Enquanto ele ainda falava
  rationale: O genitivo absoluto indica uma ação simultânea, e ἔτι acrescenta a ideia de continuidade. A formulação é natural em português e conserva a sequência narrativa.
- source_word: ἔρχονται
  choice: chegaram
  rationale: Trata-se de presente histórico. O pretérito perfeito é a forma narrativa mais natural em português neste contexto.
- source_word: ἀπὸ τοῦ ἀρχισυναγώγου
  choice: da casa do dirigente da sinagoga
  rationale: A expressão grega diz literalmente que vieram “do dirigente da sinagoga”, mas, como o dirigente está com Jesus, o contexto indica sua casa ou seu círculo doméstico. A explicitação evita uma leitura ilógica e é assinalada em nota.
- source_word: λέγοντες ὅτι
  choice: 'dizendo:'
  rationale: O particípio introduz discurso direto; os dois-pontos são idiomáticos em português.
- source_word: Ἡ θυγάτηρ σου
  choice: Sua filha
  rationale: Reproduz de maneira direta e clara a expressão possessiva grega.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: O aoristo apresenta a morte como acontecimento consumado. O pretérito perfeito expressa isso naturalmente em português, sem acrescentar uma nuance aspectual indevida.
- source_word: τί ἔτι
  choice: Por que continuar
  rationale: A construção questiona a razão de prosseguir com uma ação agora considerada inútil. Esta formulação conserva esse valor e soa natural em português.
- source_word: σκύλλεις
  choice: incomodando
  rationale: Neste contexto, σκύλλω significa causar incômodo ou impor-se a alguém. “Incomodar” mantém o tom respeitoso sem a intensidade excessiva de “atormentar” ou “importunar”.
- source_word: τὸν διδάσκαλον
  choice: o Mestre
  rationale: διδάσκαλος designa aquele que ensina. “Mestre” é um título corrente e digno em português, preservando a forma titulada usada pelos mensageiros em vez de substituí-la pelo nome de Jesus.
theological_decisions:
- issue: Referência e força do título τὸν διδάσκαλον
  choice: o Mestre
  alternative: Jesus; o professor
  rationale: O grego emprega um título, não o nome. “O Mestre” conserva a perspectiva dos falantes e não amplia a afirmação cristológica além do que o texto explicita.
- issue: Origem dos mensageiros em ἀπὸ τοῦ ἀρχισυναγώγου
  choice: da casa do dirigente da sinagoga
  alternative: do dirigente da sinagoga
  rationale: O contexto mostra que o próprio dirigente está junto de Jesus; portanto, a expressão aponta para sua casa ou seu pessoal. A tradução torna explícita essa referência contextual sem identificar os mensageiros mais precisamente do que o texto permite.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Dirigente da sinagoga” evita o tom arcaico de “chefe da sinagoga”; “Mestre” preserva o título tradicional e natural.
