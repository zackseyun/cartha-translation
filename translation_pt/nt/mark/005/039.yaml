  text: καὶ εἰσελθὼν λέγει αὐτοῖς· Τί θορυβεῖσθε καὶ κλαίετε; τὸ παιδίον οὐκ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/039.yaml
  text: And after entering, he says to them, “Why are you making a commotion and weeping? The child has not died, but is sleeping.”
translation:
  language: pt
  text: 'E, depois de entrar, ele lhes diz: “Por que vocês estão fazendo esse alvoroço e chorando? A criança não morreu, mas está dormindo.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A criança não morreu, mas dorme.” À luz da ressurreição que está prestes a acontecer, Jesus pode estar usando “dormir” como metáfora para a morte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: depois de entrar
  rationale: O particípio aoristo apresenta a entrada como anterior ao verbo principal; a formulação é clara e natural em português.
- source_word: λέγει
  choice: ele lhes diz
  rationale: Mantém o presente histórico característico da narrativa vívida de Marcos; αὐτοῖς é expresso por “lhes”.
- source_word: Τί
  choice: Por que
  rationale: Neste contexto interrogativo, introduz uma censura e corresponde naturalmente ao sentido idiomático.
- source_word: θορυβεῖσθε
  choice: vocês estão fazendo esse alvoroço
  rationale: Expressa uma perturbação ruidosa e coletiva, adequada à cena de luto; “esse” torna natural a referência ao tumulto presente.
- source_word: κλαίετε
  choice: chorando
  rationale: É corrente, digno e não especifica além do grego se havia pranto ritual.
- source_word: παιδίον
  choice: a criança
  rationale: Preserva o termo neutro e geral empregado no versículo, embora o contexto identifique uma menina.
- source_word: οὐκ ἀπέθανεν
  choice: não morreu
  rationale: Traduz diretamente o aoristo verbal sem convertê-lo na expressão estativa “não está morta”.
- source_word: καθεύδει
  choice: está dormindo
  rationale: Formulação natural em português que conserva a linguagem de sono e sua possível força metafórica.
theological_decisions:
- issue: Se a declaração de Jesus deve ser entendida como negação literal da morte ou como linguagem metafórica de sono
  choice: Manter no texto “não morreu, mas está dormindo”, sem explicação interpretativa.
  alternative: “A criança não está permanentemente morta; apenas dorme” ou “não está morta da perspectiva de Jesus, pois ele a ressuscitará”.
  rationale: O grego apresenta a afirmação de modo incisivo. A tradução preserva a tensão entre negação literal, metáfora e antecipação da ressurreição, sem decidir por uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O presente histórico foi preservado. “Alvoroço” comunica o ruído coletivo sem impor a ideia específica de lamentação ritual.
