  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀καὶ οὐκ ἀφῆκεν αὐτόν, ἀλλὰ λέγει αὐτῷ· Ὕπαγε εἰς τὸν οἶκόν σου πρὸς τοὺς σούς, καὶ ⸀ἀπάγγειλον αὐτοῖς ὅσα ⸂ὁ κύριός σοι⸃ πεποίηκεν καὶ ἠλέησέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/019.yaml
  text: And he did not permit him[a], but said to him, “Go to your home, to your own people[c][b], and report to them how much the Lord has done for you and has shown mercy to you.”
translation:
  language: pt
  text: 'Ele não permitiu, mas lhe disse: “Vá para casa, para junto dos seus[a], e conte-lhes tudo o que o Senhor fez por você e como teve misericórdia de você.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “os seus”; a expressão pode incluir a família, os parentes e outras pessoas próximas.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “o Senhor” pode ser entendido especificamente como Deus; a formulação também preserva a ligação entre a misericórdia de Deus e a autoridade e ação de Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἀφῆκεν αὐτόν
  choice: Ele não permitiu
  rationale: Neste contexto, ἀφίημι significa permitir. O pronome objeto pode ficar implícito em português sem perda de sentido, evitando a formulação pesada «não o permitiu».
- source_word: λέγει αὐτῷ
  choice: lhe disse
  rationale: O presente histórico grego é vertido pelo pretérito, forma natural na narrativa portuguesa; o dativo αὐτῷ é expresso por «lhe».
- source_word: Ὕπαγε εἰς τὸν οἶκόν σου
  choice: Vá para casa
  rationale: A expressão indica o retorno ao ambiente doméstico. «Vá para casa» é corrente e comunica melhor esse sentido do que a versão estritamente espacial «entre em sua casa».
- source_word: πρὸς τοὺς σούς
  choice: para junto dos seus
  rationale: Preserva a expressão aberta do grego, que pode abranger família, parentes e pessoas próximas, sem restringi-la indevidamente.
- source_word: ἀπάγγειλον αὐτοῖς
  choice: conte-lhes
  rationale: ἀπαγγέλλω significa comunicar ou relatar. «Conte-lhes» é natural em português e adequado à ordem de narrar o que aconteceu.
- source_word: ὅσα ὁ κύριός σοι πεποίηκεν
  choice: tudo o que o Senhor fez por você
  rationale: ὅσα abrange o conjunto ou a grandeza dos atos realizados; «tudo o que» é claro e idiomático. O dativo σοι é entendido como benefativo, «por você».
- source_word: ἠλέησέν σε
  choice: como teve misericórdia de você
  rationale: Mantém o vocabulário teologicamente significativo da misericórdia e coordena naturalmente o segundo conteúdo que o homem deve contar.
theological_decisions:
- issue: Identidade de ὁ κύριος no relato do que foi feito pelo homem
  choice: o Senhor
  alternative: Deus
  rationale: «Senhor» traduz diretamente κύριος e conserva a tensão narrativa entre a misericórdia atribuída ao Senhor e a autoridade e ação do próprio Jesus, sem decidir explicitamente a referência no texto principal.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Emprega «você» por naturalidade ampla no Brasil, mantém «misericórdia» por sua importância bíblica e conserva a abertura semântica de «os seus» e «o Senhor».
