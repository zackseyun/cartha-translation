id: MRK.5.40
reference: Mark 5:40
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ κατεγέλων αὐτοῦ. ⸀αὐτὸς δὲ ἐκβαλὼν πάντας παραλαμβάνει τὸν πατέρα τοῦ παιδίου καὶ τὴν μητέρα καὶ τοὺς μετ’ αὐτοῦ, καὶ εἰσπορεύεται ὅπου ἦν τὸ ⸀παιδίον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/040.yaml
  text: And they were laughing at him[a]. But he, after putting them all outside, takes the child's father and mother and those with him[b], and goes in where the child was.
translation:
  language: pt
  text: E riam dele[a]. Mas ele, depois de mandar todos para fora, leva consigo o pai e a mãe da criança e os que estavam com ele[b], e entra onde a criança estava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “zombavam dele”. O verbo grego pode indicar riso de deboche.
    reason: lexical_alternative
  - marker: b
    text: Isto é, os discípulos que o acompanhavam.
    reason: cross_reference
lexical_decisions:
- source_word: κατεγέλων
  choice: riam dele
  rationale: O imperfeito indica uma ação em curso, e a construção portuguesa “rir de alguém” expressa naturalmente o riso de menosprezo sem tornar explícita uma intensidade maior do que a do grego.
- source_word: ἐκβαλὼν πάντας
  choice: depois de mandar todos para fora
  rationale: O particípio exprime uma ação anterior aos verbos principais. “Mandar para fora” comunica a retirada do grupo com naturalidade e evita a possível associação exorcística de “expulsar”.
- source_word: παραλαμβάνει
  choice: leva consigo
  rationale: Conserva o presente histórico de Marcos e explicita de modo idiomático que Jesus faz essas pessoas acompanhá-lo.
- source_word: παιδίου / παιδίον
  choice: criança
  rationale: Mantém o termo neutro usado duas vezes no versículo; embora o contexto identifique a criança como menina, o grego desta frase não repete essa especificação.
- source_word: τοὺς μετ’ αὐτοῦ
  choice: os que estavam com ele
  rationale: Reproduz a expressão grega sem identificar no texto principal quem eram os acompanhantes.
- source_word: εἰσπορεύεται
  choice: entra
  rationale: Mantém o presente histórico e expressa com clareza o movimento para o lugar onde estava a criança.
- source_word: ὅπου ἦν τὸ παιδίον
  choice: onde a criança estava
  rationale: Preserva a indicação simples de localização, sem acrescentar que a criança estava deitada.
theological_decisions:
- issue: Tempo narrativo e vivacidade
  choice: Manter os presentes históricos em “leva consigo” e “entra”
  alternative: 'Uniformizar a narração no pretérito: “levou consigo” e “entrou”'
  rationale: Os presentes históricos são característicos da narrativa de Marcos e conferem vivacidade à cena; seu uso aqui permanece natural e compreensível em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva os presentes históricos de Marcos, evita linguagem excessivamente técnica e mantém a neutralidade lexical de “criança”.
