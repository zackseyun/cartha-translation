source:
  edition: SBLGNT
  text: καὶ παρεκάλεσαν ⸀αὐτὸν λέγοντες· Πέμψον ἡμᾶς εἰς τοὺς χοίρους, ἵνα εἰς αὐτοὺς εἰσέλθωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/012.yaml
  text: And they begged him[a], saying, “Send us into the pigs, so that we may enter them.”
translation:
  language: pt
  text: 'E eles lhe suplicaram: “Manda-nos para os porcos, para que entremos neles.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλεσαν
  choice: suplicaram
  rationale: No contexto, o verbo expressa um pedido insistente dirigido a Jesus. “Suplicaram” preserva a intensidade e mantém um registro digno e natural.
- source_word: αὐτὸν
  choice: lhe
  rationale: O pronome retoma Jesus como destinatário da súplica; a forma enclítica é natural em português.
- source_word: λέγοντες
  choice: ':'
  rationale: Os dois-pontos introduzem de modo idiomático o conteúdo da fala, transmitindo a função do particípio grego sem uma formulação pesada como “dizendo”.
- source_word: Πέμψον
  choice: Manda-nos
  rationale: πέμπω significa enviar ou mandar. “Manda-nos” conserva a forma imperativa e, no contexto, deixa implícita a autoridade de Jesus sem substituir o verbo por uma paráfrase de permissão.
- source_word: ἡμᾶς
  choice: -nos
  rationale: Representa diretamente o pronome objeto da primeira pessoa do plural.
- source_word: εἰς τοὺς χοίρους
  choice: para os porcos
  rationale: Em português, “mandar para os porcos” é mais natural que “mandar para dentro dos porcos”; o movimento para o interior é explicitado na oração seguinte. “Porcos” é a designação moderna e comum de χοῖροι.
- source_word: ἵνα
  choice: para que
  rationale: Introduz adequadamente a finalidade do pedido, preservando a relação sintática do grego.
- source_word: εἰς αὐτοὺς εἰσέλθωμεν
  choice: entremos neles
  rationale: Conserva a ideia explícita de entrada nos animais e a forma verbal de primeira pessoa do plural, sem explicar além do texto.
theological_decisions:
- issue: Natureza do pedido dirigido a Jesus
  choice: Os espíritos suplicam a Jesus que os mande para os porcos, reconhecendo narrativamente sua autoridade sobre o destino deles.
  alternative: Traduzir como mero pedido de mudança de lugar ou explicitar “permite-nos ir”.
  rationale: “Suplicaram” e “Manda-nos” refletem a força do texto e sua apresentação da autoridade de Jesus, enquanto evitam trocar o sentido lexical de πέμπω por uma paráfrase interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e a pontuação foram ajustadas à naturalidade do português, sem perda do conteúdo ou da intensidade do grego.
