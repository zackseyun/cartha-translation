source:
  edition: SBLGNT
  text: Καὶ διαπεράσαντος τοῦ Ἰησοῦ ἐν τῷ πλοίῳ πάλιν εἰς τὸ πέραν συνήχθη ὄχλος πολὺς ἐπ’ αὐτόν, καὶ ἦν παρὰ τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/021.yaml
  text: And after Jesus had crossed over again in the boat to the other side[a], a large crowd gathered around him, and he was beside the sea.
translation:
  language: pt
  text: Depois que Jesus atravessou novamente de barco para o outro lado, uma grande multidão se reuniu ao redor dele, e ele estava junto ao mar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trata-se do mar da Galileia, um lago tradicionalmente chamado de «mar» nos Evangelhos.
    reason: cultural_note
lexical_decisions:
- source_word: διαπεράσαντος
  choice: Depois que Jesus atravessou
  rationale: O particípio aoristo em genitivo absoluto apresenta uma circunstância anterior à ação principal. A construção «Depois que» comunica com naturalidade essa sequência temporal em português.
- source_word: ἐν τῷ πλοίῳ
  choice: de barco
  rationale: Embora literalmente signifique «no barco», «de barco» expressa de modo natural em português o meio pelo qual Jesus fez a travessia, sem alterar o sentido.
- source_word: πάλιν
  choice: novamente
  rationale: Preserva de forma clara a ideia de repetição indicada pelo advérbio grego.
- source_word: εἰς τὸ πέραν
  choice: para o outro lado
  rationale: No contexto da travessia, a expressão indica a margem oposta e é vertida por um equivalente português claro e corrente.
- source_word: συνήχθη
  choice: se reuniu
  rationale: Embora a forma grega seja passiva, neste contexto descreve naturalmente o ajuntamento da multidão. A construção pronominal evita uma passiva artificial em português.
- source_word: ὄχλος πολὺς
  choice: uma grande multidão
  rationale: Equivalente natural que comunica o tamanho numeroso do grupo sem tom arcaico.
- source_word: ἐπ’ αὐτόν
  choice: ao redor dele
  rationale: Com o verbo «reunir», a preposição indica convergência em direção a Jesus e, no contexto, a multidão que se junta ao seu redor.
- source_word: παρὰ τὴν θάλασσαν
  choice: junto ao mar
  rationale: A expressão indica localização ao lado da margem. «Junto ao mar» é natural, clara e próxima da forma grega.
- source_word: θάλασσαν
  choice: mar
  rationale: Mantém o termo grego, que chama esse corpo de água de «mar», enquanto a nota esclarece que geograficamente se trata de um lago.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva a sequência narrativa do grego sem reproduzir de modo artificial o genitivo absoluto. O marcador foi colocado após «mar», o termo diretamente esclarecido pela nota.
