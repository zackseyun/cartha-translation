  text: καὶ προσκαλεῖται τοὺς δώδεκα, καὶ ἤρξατο αὐτοὺς ἀποστέλλειν δύο δύο, καὶ ἐδίδου αὐτοῖς ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/007.yaml
  text: And he called the Twelve and began to send them out two by two[c][b][a], and he was giving them authority over the unclean spirits.
translation:
  language: pt
  text: Ele chamou os Doze[c] e começou a enviá-los de dois em dois,[a] e lhes dava autoridade[b] sobre os espíritos impuros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «em duplas».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «poder sobre os espíritos impuros».'
    reason: alternative_reading
  - marker: c
    text: 'O grego emprega aqui o presente histórico: «chama».'
    reason: previous_rendering
lexical_decisions:
- source_word: προσκαλεῖται
  choice: chamou
  rationale: Embora o grego use o presente histórico, o passado produz uma sequência narrativa natural em português com «começou», sem alterar o sentido do acontecimento.
- source_word: τοὺς δώδεκα
  choice: os Doze
  rationale: A expressão funciona como designação reconhecida do grupo escolhido por Jesus; a inicial maiúscula preserva esse valor titular.
- source_word: ἤρξατο ... ἀποστέλλειν
  choice: começou a enviá-los
  rationale: Reproduz naturalmente a construção de início seguida de infinitivo e mantém o sentido missionário de ἀποστέλλω sem acrescentar «apóstolos».
- source_word: δύο δύο
  choice: de dois em dois
  rationale: Expressão distributiva idiomática em português que preserva o sentido e a repetição do grego.
- source_word: ἐδίδου
  choice: lhes dava
  rationale: O imperfeito grego apresenta a concessão de autoridade como ação em curso ou concomitante ao envio; o imperfeito português conserva esse aspecto.
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: Indica autorização ou domínio concedido por Jesus, não apenas força ou capacidade bruta.
- source_word: τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: os espíritos impuros
  rationale: Mantém a terminologia de Marcos e evita substituir a expressão por uma interpretação mais estreita, como «demônios».
theological_decisions:
- issue: Natureza da concessão de Jesus aos Doze em ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: autoridade sobre os espíritos impuros
  alternative: poder sobre os espíritos impuros
  rationale: «Autoridade» preserva melhor a ideia relacional e delegada de ἐξουσία, mantendo claro que os Doze recebem de Jesus o direito de agir contra esses espíritos.
translation_notes:
  register: Português moderno, claro e digno, com fluidez brasileira e compreensão internacional. Conserva-se «os Doze» como título, o imperfeito em «lhes dava» e a expressão bíblica «espíritos impuros».
