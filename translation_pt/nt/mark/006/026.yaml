  naturalness: A formulação revista é fluente em português moderno e evita que «recusá-la» possa ser entendido como rejeição pessoal. «Não quis recusar-lhe o pedido» exprime naturalmente, no contexto, o sentido de ἀθετῆσαι αὐτήν.
  terminology: «Rei», «juramentos» e «profundamente triste» são apropriados. «Pessoas à mesa», com nota para a postura de reclinar-se, mantém legibilidade e preserva o dado cultural. A nota b esclarece adequadamente a alternativa sem impor leitura doutrinária.
