  text: καὶ περίλυπος γενόμενος ὁ βασιλεὺς διὰ τοὺς ὅρκους καὶ τοὺς ⸀ἀνακειμένους οὐκ ἠθέλησεν ⸂ἀθετῆσαι αὐτήν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/026.yaml
  text: And the king[a], becoming deeply grieved, because of his oaths and those reclining at the table[c][b], did not want to refuse her.
translation:
  language: pt
  text: O rei ficou profundamente triste e, por causa de seus juramentos e das pessoas à mesa[a], não quis recusar-lhe o pedido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “dos que estavam reclinados à mesa”; essa era a postura costumeira em refeições formais. Também pode ser traduzido por “dos convidados para o jantar”.
    reason: lexical_alternative
  - marker: b
    text: Ou “rejeitá-la” ou “negar-lhe o pedido”. O sentido é que ele não quis deixar de cumprir o que havia prometido a ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: περίλυπος
  choice: profundamente triste
  rationale: Expressa a intensidade da tristeza em português atual e natural, sem enfraquecer o sentido do termo grego.
- source_word: γενόμενος
  choice: ficou
  rationale: O particípio indica a entrada em um estado; “ficou profundamente triste” comunica essa mudança de modo idiomático.
- source_word: ὁ βασιλεὺς
  choice: o rei
  rationale: É a correspondência direta do termo grego e preserva a maneira como Marcos designa Herodes nesta narrativa.
- source_word: διὰ τοὺς ὅρκους
  choice: por causa de seus juramentos
  rationale: διά com acusativo expressa causa. O possessivo, implícito no contexto, esclarece naturalmente que se trata dos juramentos feitos pelo rei.
- source_word: τοὺς ἀνακειμένους
  choice: as pessoas que estavam à mesa
  rationale: Apresenta em português natural os participantes da refeição, enquanto a nota preserva o detalhe cultural de que estavam reclinados.
- source_word: οὐκ ἠθέλησεν
  choice: não quis
  rationale: Mantém a ideia de vontade ou disposição, não de incapacidade.
- source_word: ἀθετῆσαι αὐτήν
  choice: recusá-la
  rationale: No contexto, significa não rejeitar a mulher ou deixar de atender ao que lhe havia prometido; a formulação conserva o pronome pessoal do grego sem inserir “pedido” no texto principal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A conjunção adversativa “mas” explicita o contraste contextual entre a profunda tristeza do rei e sua decisão motivada pelos juramentos e pelos presentes, sem alterar a relação causal expressa no grego.
