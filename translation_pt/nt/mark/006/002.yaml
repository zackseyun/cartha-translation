source:
  edition: SBLGNT
  text: καὶ γενομένου σαββάτου ἤρξατο ⸂διδάσκειν ἐν τῇ συναγωγῇ⸃· καὶ ⸀οἱ πολλοὶ ἀκούοντες ἐξεπλήσσοντο λέγοντες· Πόθεν τούτῳ ταῦτα, καὶ τίς ἡ σοφία ἡ δοθεῖσα ⸀τούτῳ, καὶ ⸀αἱ δυνάμεις τοιαῦται διὰ τῶν χειρῶν αὐτοῦ ⸀γινόμεναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/002.yaml
  text: And when the Sabbath came[a], he began to teach in the synagogue. And many who heard him were astonished, saying, “Where did this man get these things? And what is this wisdom given to him, and such mighty works happening through his hands?”
translation:
  language: pt
  text: 'Quando chegou o sábado, ele começou a ensinar na sinagoga. Muitos que o ouviam ficavam espantados e diziam: “De onde este homem tirou estas coisas? Que sabedoria é esta que lhe foi dada? E que obras poderosas[a] são estas que se realizam por meio de suas mãos?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tais milagres” ou “tais manifestações de poder”. O plural grego δυνάμεις pode designar feitos extraordinários ou demonstrações de poder.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένου σαββάτου
  choice: Quando chegou o sábado
  rationale: O genitivo absoluto estabelece a circunstância temporal. A formulação conserva a ideia de chegada do sábado em português natural.
- source_word: ἤρξατο διδάσκειν
  choice: começou a ensinar
  rationale: Reproduz de modo direto a construção ingressiva de ἄρχομαι com infinitivo.
- source_word: ἐν τῇ συναγωγῇ
  choice: na sinagoga
  rationale: Neste contexto judaico, συναγωγή designa naturalmente o local ou instituição da sinagoga.
- source_word: οἱ πολλοὶ ἀκούοντες
  choice: Muitos dos que o ouviam
  rationale: Expressa idiomaticamente o grupo numeroso entre os ouvintes e explicita o objeto de ouvir, claro pelo contexto.
- source_word: ἐξεπλήσσοντο
  choice: ficavam admirados
  rationale: O imperfeito indica uma reação em curso; 'ficavam admirados' preserva esse aspecto e a intensidade sem soar artificial.
- source_word: Πόθεν τούτῳ ταῦτα
  choice: De onde vêm a este homem essas coisas?
  rationale: Mantém a pergunta pela origem e conserva o dativo τούτῳ, bem como o tom de distanciamento de 'este homem', sem inserir explicitamente um verbo de aquisição.
- source_word: τίς ἡ σοφία ἡ δοθεῖσα τούτῳ
  choice: Que sabedoria é essa que lhe foi dada?
  rationale: Preserva a forma interrogativa, o destaque dado à sabedoria e o particípio passivo δοθεῖσα.
- source_word: αἱ δυνάμεις τοιαῦται
  choice: tais obras poderosas
  rationale: No plural e neste contexto, δυνάμεις aponta para feitos que manifestam poder. 'Obras poderosas' preserva essa nuance sem restringir o termo à palavra interpretativa 'milagres'.
- source_word: διὰ τῶν χειρῶν αὐτοῦ γινόμεναι
  choice: se realizam ... por meio de suas mãos
  rationale: Conserva tanto o valor instrumental de διά com genitivo quanto a imagem concreta das mãos; o presente acompanha a forma participial γινόμεναι.
theological_decisions:
- issue: Sentido de δυνάμεις
  choice: obras poderosas
  alternative: milagres; manifestações de poder
  rationale: A expressão comunica feitos extraordinários associados ao poder sem reduzir a amplitude lexical do grego nem impor uma categoria teológica posterior.
- issue: Tom de τούτῳ
  choice: este homem
  alternative: ele; este
  rationale: A formulação retém o possível tom de distanciamento dos falantes, mas não o torna inequivocamente hostil.
- issue: Agência em διὰ τῶν χειρῶν αὐτοῦ γινόμεναι
  choice: se realizam ... por meio de suas mãos
  alternative: são feitas pelas mãos dele; ele realiza
  rationale: A construção escolhida preserva a formulação mediada e não transforma silenciosamente o particípio médio-passivo em uma declaração ativa direta.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência das perguntas foi pontuada de modo natural, preservando a surpresa crescente dos ouvintes e a imagem bíblica de obras realizadas por meio das mãos.
