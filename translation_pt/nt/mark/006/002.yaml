revisions:
- from: 'Quando chegou o sábado, ele começou a ensinar na sinagoga. Muitos dos que o ouviam ficavam admirados e diziam: “De onde vêm a este homem essas coisas? Que sabedoria é essa que lhe foi dada? E como se realizam tais obras poderosas por meio de suas mãos[a]?”'
  to: 'Quando chegou o sábado, ele começou a ensinar na sinagoga. Muitos que o ouviam ficavam espantados e diziam: “De onde este homem tirou estas coisas? Que sabedoria é esta que lhe foi dada? E que obras poderosas[a] são estas que se realizam por meio de suas mãos?”'
  rationale: A revisão elimina a pergunta de modo introduzida indevidamente por «como» e torna explícita em português a interrogação elíptica que abrange as obras poderosas. Também torna a primeira pergunta mais idiomática, fortalece a expressão do espanto e posiciona a âncora da nota junto de δυνάμεις («obras poderosas»).
