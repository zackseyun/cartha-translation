source:
  edition: SBLGNT
  text: πάντες γὰρ αὐτὸν εἶδον καὶ ἐταράχθησαν. ⸂ὁ δὲ εὐθὺς⸃ ἐλάλησεν μετ’ αὐτῶν, καὶ λέγει αὐτοῖς· Θαρσεῖτε, ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/050.yaml
  text: For they all saw him and were troubled. But he immediately spoke with them and says to them, “Take courage; I am; do not be afraid.”
translation:
  language: pt
  text: 'Pois todos o viram e ficaram assustados. Mas ele imediatamente falou com eles e lhes disse: “Coragem! Eu sou. Não tenham medo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: ficaram apavorados
  rationale: No contexto da aparição sobre o mar, expressa forte perturbação e medo de modo natural em português.
- source_word: Θαρσεῖτε
  choice: Coragem!
  rationale: Imperativo idiomático e direto que transmite o encorajamento de Jesus.
- source_word: ἐγώ εἰμι
  choice: Eu sou
  rationale: Preserva a forma marcada e a possível ressonância teológica do grego, sem reduzi-la silenciosamente ao simples identificador “sou eu”.
- source_word: μὴ φοβεῖσθε
  choice: Não tenham medo
  rationale: Forma corrente, clara e fiel ao imperativo presente negativo dirigido ao grupo.
- source_word: λέγει
  choice: disse
  rationale: O presente histórico grego é vertido naturalmente pelo pretérito narrativo em português, sem mudança de conteúdo.
theological_decisions:
- issue: Possível ressonância teológica de ἐγώ εἰμι
  choice: Eu sou
  alternative: Sou eu
  rationale: “Eu sou” conserva tanto a autoidentificação no contexto quanto a formulação potencialmente alusiva, sem decidir que se trata apenas de uma expressão idiomática nem afirmar explicitamente uma alusão divina.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural brasileiro (“tenham”). A ordem narrativa foi mantida, enquanto o presente histórico foi naturalizado. “Eu sou” foi preservado deliberadamente, apesar de ser menos idiomático que “sou eu”, para manter a ambiguidade do original.
