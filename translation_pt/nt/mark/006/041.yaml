source:
  edition: SBLGNT
  text: καὶ λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κατέκλασεν τοὺς ἄρτους καὶ ἐδίδου τοῖς μαθηταῖς ⸀αὐτοῦ ἵνα ⸀παρατιθῶσιν αὐτοῖς, καὶ τοὺς δύο ἰχθύας ἐμέρισεν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/041.yaml
  text: And taking the five loaves and the two fish[a], looking up to heaven, he blessed and broke the loaves, and kept giving them to his disciples to set before them[b], and he divided the two fish among them all.
translation:
  language: pt
  text: E, tomando os cinco pães e os dois peixes, levantou os olhos para o céu, pronunciou a bênção[a], partiu os pães e continuou a dá-los aos seus discípulos para que os colocassem diante do povo; e repartiu os dois peixes entre todos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deu graças”. O verbo grego significa literalmente “abençoou”, mas, no contexto de uma refeição, seu sentido pode se aproximar de dar graças.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: tomando
  rationale: O particípio aoristo introduz a sequência de ações; “tomando” preserva a ligação participial com naturalidade em português.
- source_word: ἄρτους
  choice: pães
  rationale: O plural contado (“cinco”) indica unidades de pão; “pães” é concreto e natural em português.
- source_word: ἰχθύας
  choice: peixes
  rationale: Equivalente direto e corrente do substantivo plural.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: levantou os olhos para o céu
  rationale: Expressão idiomática portuguesa que preserva tanto o olhar para cima quanto a direção indicada por εἰς.
- source_word: εὐλόγησεν
  choice: pronunciou a bênção
  rationale: Preserva o sentido lexical de “abençoar” sem acrescentar um objeto direto ausente no grego e soa natural no contexto de uma refeição.
- source_word: κατέκλασεν τοὺς ἄρτους
  choice: partiu os pães
  rationale: Mantém a ação concreta e o objeto explícito do texto grego.
- source_word: ἐδίδου
  choice: continuou a dá-los
  rationale: O imperfeito sugere ação continuada ou repetida durante a distribuição; o pronome retoma os pães, objeto explícito da oração grega.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: aos seus discípulos
  rationale: Representa tanto o substantivo quanto o possessivo αὐτοῦ.
- source_word: ἵνα παρατιθῶσιν αὐτοῖς
  choice: para que os servissem ao povo
  rationale: A construção com ἵνα exprime finalidade. “Servissem” comunica a colocação da comida diante dos presentes; “ao povo” esclarece o referente contextual de αὐτοῖς sem confundi-lo com os discípulos.
- source_word: ἐμέρισεν πᾶσιν
  choice: repartiu ... entre todos
  rationale: “Repartiu” preserva a ideia de dividir em porções, e “entre todos” representa o dativo distributivo πᾶσιν.
theological_decisions:
- issue: Sentido de εὐλόγησεν no contexto da refeição
  choice: pronunciou a bênção
  alternative: deu graças
  rationale: O verbo é εὐλογέω, “abençoar”, embora em contexto de refeição possa sobrepor-se semanticamente à ação de dar graças. A formulação escolhida mantém a transparência lexical e não afirma que Jesus abençoou diretamente os alimentos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a sequência narrativa do grego, mas evita ambiguidades pronominais desnecessárias. O ponto e vírgula antes da distribuição dos peixes distingue com clareza as duas ações.
