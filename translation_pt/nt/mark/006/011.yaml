  naturalness: '"Em qualquer lugar em que não os receberem nem os ouvirem" é idiomático em português moderno e evita atribuir literalmente a um "lugar" os atos de receber e ouvir. "Ao saírem dali" e "sacudam o pó debaixo de seus pés" são claros e adequados ao registro.'
  terminology: '"Receber", "ouvir", "sacudir o pó" e "testemunho" mantêm a terminologia e o grau de explicitação do grego. "Para eles" preserva a relação indicada por αὐτοῖς sem impor uma interpretação judicial ou denominacional.'
