source:
  edition: SBLGNT
  text: καὶ ⸂ὃς ἂν τόπος μὴ δέξηται⸃ ὑμᾶς μηδὲ ἀκούσωσιν ὑμῶν, ἐκπορευόμενοι ἐκεῖθεν ἐκτινάξατε τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν εἰς μαρτύριον ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/011.yaml
  text: And whatever place does not receive you or listen to you, as you leave there, shake off the dust that is under your feet as a testimony against them.
translation:
  language: pt
  text: E, em qualquer lugar em que não os receberem nem os ouvirem, ao saírem dali, sacudam o pó debaixo de seus pés, como testemunho para eles.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como testemunho contra eles”. O grego diz mais literalmente “como testemunho para/a eles”; no contexto de rejeição, a expressão também pode ser entendida com força adversa.'
    reason: alternative_reading
  - marker: b
    text: Sacudir o pó dos pés era um ato simbólico de afastamento e advertência diante da rejeição.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν τόπος
  choice: qualquer lugar
  rationale: A construção indefinida e generalizante é expressa naturalmente por “qualquer lugar”, preservando o substantivo singular τόπος.
- source_word: μὴ δέξηται ὑμᾶς
  choice: não receber vocês
  rationale: δέχομαι, no contexto, envolve receber os mensageiros, inclusive com possível nuance de hospitalidade; “receber” mantém essa amplitude sem explicitação excessiva.
- source_word: μηδὲ ἀκούσωσιν ὑμῶν
  choice: nem os ouvir
  rationale: ἀκούω com genitivo pode indicar ouvir com atenção. “Ouvir” é natural e preserva a possibilidade de significar mais que mera percepção sonora, sem tornar explícito demais o sentido de obedecer.
- source_word: ἐκπορευόμενοι ἐκεῖθεν
  choice: ao saírem dali
  rationale: O particípio circunstancial tem valor temporal; esta formulação reproduz com clareza a sequência da ação.
- source_word: ἐκτινάξατε
  choice: sacudam
  rationale: O verbo denota sacudir para remover algo; com o objeto “o pó”, a construção portuguesa comunica naturalmente o gesto de sacudi-lo dos pés.
- source_word: τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν
  choice: o pó debaixo dos seus pés
  rationale: A formulação mantém a referência explícita ao pó situado sob os pés e é corrente em português moderno.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: como testemunho contra eles
  rationale: Embora αὐτοῖς seja formalmente “a/para eles”, o contexto de rejeição confere ao gesto provável força adversa. A tradução principal comunica essa função, e a forma menos interpretativa é preservada em nota.
theological_decisions:
- issue: Força do gesto de sacudir o pó
  choice: Um testemunho de advertência contra os que rejeitam os mensageiros e a mensagem.
  alternative: “Como testemunho para eles”, sem explicitar se o testemunho lhes é favorável ou contrário.
  rationale: O contexto favorece uma ação simbólica de dissociação e advertência, mas εἰς μαρτύριον αὐτοῖς não contém uma preposição grega equivalente a “contra”. Por isso, a leitura contextual aparece no texto e a ambiguidade formal é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para clareza do plural. A construção é próxima do grego, mas evita rigidez; as notas preservam a ambiguidade de αὐτοῖς e explicam sucintamente o gesto cultural.
