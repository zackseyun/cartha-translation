- from: E qualquer lugar que não receber vocês nem os ouvir, ao saírem dali, sacudam o pó debaixo dos seus pés, como testemunho contra eles.[a][b]
  to: E, em qualquer lugar em que não os receberem nem os ouvirem, ao saírem dali, sacudam o pó debaixo de seus pés, como testemunho para eles.[a][b]
