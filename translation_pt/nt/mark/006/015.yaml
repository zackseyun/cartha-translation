  text: ἄλλοι ⸀δὲ ἔλεγον ὅτι Ἠλίας ἐστίν· ἄλλοι δὲ ἔλεγον ὅτι ⸀προφήτης ὡς εἷς τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/015.yaml
  text: But others were saying[a], “He is Elijah,” and others were saying, “He is a prophet, like one of the prophets.”
translation:
  language: pt
  text: 'Outros, porém, diziam: “Ele é Elias”; e outros diziam: “É um profeta[a], como um dos profetas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, menos provavelmente, “o Profeta”, se a expressão for entendida como referência a uma figura escatológica específica. Aqui, porém, o grego é mais naturalmente entendido como “um profeta”, pois a frase continua: “como um dos profetas”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι δὲ
  choice: Outros, porém
  rationale: ἄλλοι distingue outro grupo entre as opiniões relatadas, enquanto δέ marca contraste leve ou continuação; “Outros, porém” reproduz naturalmente essa transição.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito indica fala contínua ou repetida. Em português, “diziam” preserva esse aspecto sem o tornar excessivamente explícito.
- source_word: ὅτι Ἠλίας ἐστίν
  choice: “Ele é Elias”
  rationale: A citação direta é natural em português depois de um verbo de fala, e Ἠλίας corresponde ao nome tradicional “Elias”.
- source_word: προφήτης
  choice: um profeta
  rationale: O predicativo sem artigo tem aqui sentido mais naturalmente indefinido, especialmente por ser seguido de “como um dos profetas”.
- source_word: ὡς εἷς τῶν προφητῶν
  choice: como um dos antigos profetas
  rationale: ὡς expressa comparação, e “um dos antigos profetas” comunica naturalmente que a referência é aos profetas conhecidos do passado, sem identificar Jesus como um deles em sentido literal.
theological_decisions:
- issue: Se προφήτης deve ser entendido genericamente como “um profeta” ou como o título escatológico “o Profeta”
  choice: um profeta
  alternative: o Profeta
  rationale: A ausência do artigo e a qualificação imediata ὡς εἷς τῶν προφητῶν favorecem a identificação genérica. A alternativa titular é preservada em nota, sem ser imposta ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O paralelismo e o aspecto verbal do relato foram preservados.
