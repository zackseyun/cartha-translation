  text: for they did not understand about the loaves[b][a], but their hearts were hardened.
translation:
  language: pt
  text: pois não tinham compreendido a respeito dos pães[a], mas o coração deles estava endurecido.[b]
  philosophy: optimal-equivalence
  footnotes:
