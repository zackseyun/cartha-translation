    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆκαν
  choice: tinham compreendido
  rationale: O aoristo no contexto narrativo remete à falta de compreensão anterior dos discípulos; o mais-que-perfeito em português explicita naturalmente essa relação temporal.
- source_word: ἐπὶ τοῖς ἄρτοις
  choice: o que os pães significavam
  rationale: A expressão aponta não apenas para os pães como assunto, mas para a significação do milagre. Esta formulação torna clara a relação idiomática sem acrescentar uma interpretação específica.
- source_word: ἄρτοις
  choice: os pães
  rationale: O plural definido remete aos pães do episódio da alimentação, preservando o número do grego e a referência narrativa.
- source_word: ἀλλ’ ἦν
  choice: pelo contrário, ... estava
  rationale: A formulação preserva a força adversativa e apresenta como estado contínuo a condição expressa pelo imperfeito ἦν.
- source_word: αὐτῶν ἡ καρδία
  choice: o coração deles
  rationale: Mantém o singular coletivo do grego, compreensível em português, sugerindo a condição comum dos discípulos sem eliminar a possibilidade distributiva.
- source_word: πεπωρωμένη
  choice: endurecido
  rationale: Traduz a metáfora de insensibilidade expressa por πωρόω com uma equivalência bíblica e corrente, sem declarar quem causou o endurecimento.
theological_decisions:
- issue: Natureza e causa da condição dos discípulos em πεπωρωμένη
  choice: o coração deles estava endurecido
  alternative: o coração deles estava insensível
  rationale: A tradução conserva a metáfora e a tensão teológica do texto, que descreve a insensibilidade espiritual sem identificar explicitamente sua causa.
- issue: Sentido de ἐπὶ τοῖς ἄρτοις
  choice: o que os pães significavam
  alternative: a respeito dos pães
  rationale: O contexto indica que faltou aos discípulos captar a relevância do sinal, mas a tradução não especifica qual conclusão cristológica ou teológica deveriam ter tirado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o singular coletivo “o coração deles” e explicita de modo natural a significação contextual dos pães.
