  text: Καὶ ⸀εὐθὺς ἠνάγκασεν τοὺς μαθητὰς αὐτοῦ ἐμβῆναι εἰς τὸ πλοῖον καὶ προάγειν ⸂εἰς τὸ πέραν⸃ πρὸς Βηθσαϊδάν, ἕως αὐτὸς ⸀ἀπολύει τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/045.yaml
  text: And immediately he compelled his disciples to get into the boat and go ahead to the other side[a], toward Bethsaida[b], until he himself dismissed the crowd.
translation:
  language: pt
  text: E imediatamente Jesus obrigou os seus discípulos a entrar no barco e a ir adiante, para o outro lado, em direção a Betsaida[a], até que ele próprio despedisse a multidão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para Betsaida”. A preposição grega pode indicar direção (“em direção a”) ou destino (“para”).
    reason: lexical_alternative
  - marker: b
    text: O grego traz literalmente uma construção próxima de “até que ele próprio despede a multidão”, com verbo no presente em uma oração temporal. Em português narrativo, o imperfeito do subjuntivo é a forma idiomática após “até que”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: logo em seguida
  rationale: Conserva o ritmo urgente e característico da narrativa de Marcos em português natural.
- source_word: ἠνάγκασεν
  choice: obrigou
  rationale: Expressa a forte pressão ou necessidade comunicada por ἀναγκάζω, sem acrescentar a ideia de coerção física.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: os seus discípulos
  rationale: “Discípulos” é o termo corrente e preciso para a relação entre mestre e aprendiz nos Evangelhos.
- source_word: ἐμβῆναι εἰς τὸ πλοῖον
  choice: a entrar no barco
  rationale: Formulação direta, corrente e fiel ao ato de embarcar.
- source_word: προάγειν
  choice: seguir à frente
  rationale: Preserva a ideia relacional de que os discípulos deviam partir antes de Jesus.
- source_word: εἰς τὸ πέραν
  choice: para o outro lado
  rationale: Reproduz a expressão idiomática que aponta para a margem oposta do lago.
- source_word: πρὸς Βηθσαϊδάν
  choice: em direção a Betsaida
  rationale: Mantém a nuance direcional de πρός com acusativo sem afirmar mais explicitamente do que o grego que Betsaida seria o ponto final alcançado.
- source_word: ἕως
  choice: enquanto
  rationale: No contexto, apresenta a partida dos discípulos como simultânea à dispensa da multidão; a alternativa mais literal “até que” é registrada em nota para preservar a ambiguidade temporal.
- source_word: αὐτὸς
  choice: ele próprio
  rationale: 'Conserva a ênfase do pronome grego: Jesus pessoalmente ficaria para tratar da multidão.'
- source_word: ἀπολύει
  choice: despedia
  rationale: O presente grego ocorre numa oração temporal dentro de uma narrativa passada; o imperfeito português transmite com naturalidade a ação em andamento e simultânea.
- source_word: τὸν ὄχλον
  choice: a multidão
  rationale: Equivalente contemporâneo e natural de ὄχλος neste contexto narrativo.
