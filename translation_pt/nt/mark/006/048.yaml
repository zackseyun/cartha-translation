  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀ἰδὼν αὐτοὺς βασανιζομένους ἐν τῷ ἐλαύνειν, ἦν γὰρ ὁ ἄνεμος ἐναντίος ⸀αὐτοῖς, περὶ τετάρτην φυλακὴν τῆς νυκτὸς ἔρχεται πρὸς αὐτοὺς περιπατῶν ἐπὶ τῆς θαλάσσης· καὶ ἤθελεν παρελθεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/048.yaml
  text: And seeing them straining at the oars[a], because the wind was against them, about the fourth watch of the night he comes to them, walking on the sea[d][c][b]; and he intended to pass by them.
translation:
  language: pt
  text: E, vendo-os lutando com os remos[d], pois o vento lhes era contrário, por volta da quarta vigília da noite[a], ele vem até eles, caminhando sobre o mar[b], e pretendia passar por eles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A «quarta vigília da noite», segundo a contagem romana, correspondia aproximadamente ao período entre as três e as seis horas da manhã.
    reason: cultural_note
  - marker: b
    text: 'Ou: «caminhando sobre a água». O grego diz «sobre o mar».'
    reason: lexical_alternative
  - marker: c
    text: «Pretendia passar por eles» pode significar simplesmente que ele pretendia ir além deles, mas também pode evocar passagens do Antigo Testamento nas quais Deus «passa» ao se revelar (por exemplo, Êx 33.19, 22; 34.6; 1Rs 19.11).
    reason: alternative_reading
  - marker: d
    text: 'Mais literalmente: «atormentados ao remar».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: vendo
  rationale: Preserva o valor participial e a ligação temporal do aoristo sem tornar a sequência mais explícita do que o grego.
- source_word: βασανιζομένους ἐν τῷ ἐλαύνειν
  choice: lutando para remar
  rationale: Expressa de modo natural o esforço penoso e intenso causado pelo vento contrário. A nota registra a força mais literal de βασανιζομένους.
- source_word: ἐναντίος αὐτοῖς
  choice: lhes era contrário
  rationale: Formulação portuguesa natural para o vento que soprava contra eles, mantendo o pronome do texto-fonte.
- source_word: περὶ τετάρτην φυλακὴν τῆς νυκτός
  choice: por volta da quarta vigília da noite
  rationale: Mantém o sistema antigo de contagem das horas; περὶ é representado por «por volta de».
- source_word: ἔρχεται πρὸς αὐτούς
  choice: ele vem até eles
  rationale: Conserva o presente histórico de Marcos e sua vivacidade narrativa.
- source_word: περιπατῶν ἐπὶ τῆς θαλάσσης
  choice: caminhando sobre o mar
  rationale: Traduz θάλασσα por «mar», sem suavizá-lo para «água», e expressa naturalmente a posição indicada por ἐπί.
- source_word: ἤθελεν παρελθεῖν αὐτούς
  choice: pretendia passar por eles
  rationale: O imperfeito indica intenção; «passar por eles» mantém aberta tanto a leitura de simples deslocamento quanto uma possível ressonância de manifestação divina.
theological_decisions:
- issue: Sentido de «pretendia passar por eles»
  choice: Manter a formulação literal e semanticamente aberta no texto principal.
  alternative: Explicitar que ele queria ultrapassá-los ou que estava se revelando segundo o motivo veterotestamentário de Deus «passar» diante de alguém.
  rationale: O grego não explica a intenção. A tradução preserva a tensão entre o sentido espacial comum e uma possível alusão às manifestações divinas do Antigo Testamento; a nota apresenta ambas as possibilidades sem decidir entre elas.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O presente histórico «vem» preserva a vivacidade característica de Marcos; a ordem das orações acompanha de perto o fluxo grego sem produzir construção artificial.
