  text: Καὶ ὀψίας γενομένης ἦν τὸ πλοῖον ἐν μέσῳ τῆς θαλάσσης, καὶ αὐτὸς μόνος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/047.yaml
  text: And when evening had come[a], the boat was in the middle of the sea, and he was alone on the land.
translation:
  language: pt
  text: Ao anoitecer, o barco estava no meio do mar, e ele estava sozinho em terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na margem”. O grego diz “sobre a terra”, em contraste com a posição do barco no mar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: Quando chegou a tarde
  rationale: O genitivo absoluto expressa uma circunstância temporal. A formulação é natural em português e preserva a transição para o período da tarde/noite sem explicitação indevida.
- source_word: πλοῖον
  choice: o barco
  rationale: No contexto do mar da Galileia, “barco” é a designação moderna mais natural; “navio” sugeriria uma embarcação maior.
- source_word: ἐν μέσῳ τῆς θαλάσσης
  choice: no meio do mar
  rationale: Mantém de modo claro e idiomático a localização da embarcação afastada da terra.
- source_word: θαλάσσης
  choice: do mar
  rationale: Embora o mar da Galileia seja geograficamente um lago, o texto grego usa θάλασσα, “mar”; a tradução preserva essa designação.
- source_word: αὐτὸς μόνος
  choice: ele estava sozinho
  rationale: Expressa naturalmente a ênfase do pronome com μόνος na condição solitária de Jesus, sem a rigidez de “ele próprio estava sozinho”.
- source_word: ἐπὶ τῆς γῆς
  choice: em terra
  rationale: Reproduz em português corrente o contraste espacial entre Jesus em terra e o barco no mar, sem restringir necessariamente o sentido à beira imediata da água.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa corrente. A nota foi colocada junto a “em terra”, expressão à qual se refere.
