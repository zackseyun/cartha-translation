lexical_decisions:
- source_word: ἔφαγον
  choice: comeram
  rationale: Aoristo ativo de ἐσθίω, o verbo comum para comer. “Comeram” é a equivalência direta e natural; não é necessário acrescentar um objeto, e a ideia de saciedade é expressa pelo verbo seguinte.
- source_word: πάντες
  choice: todos
  rationale: O adjetivo nominativo plural é usado substantivamente e abrange toda a multidão mencionada no contexto. Em português, “todos” expressa naturalmente esse alcance universal.
- source_word: ἐχορτάσθησαν
  choice: ficaram satisfeitos
  rationale: O passivo de χορτάζω indica que foram plenamente alimentados, até a saciedade. “Ficaram satisfeitos” comunica isso de modo claro e idiomático, sem inserir uma ideia além do texto.
- source_word: καὶ ... καὶ
  choice: E ... e ...
  rationale: A repetição de καί coordena as ações de maneira simples. Preservar o “E” inicial mantém o fluxo narrativo e o estilo paratático de Marcos.
