  text: καὶ ⸀λέγει αὐτοῖς· Δεῦτε ὑμεῖς αὐτοὶ κατ’ ἰδίαν εἰς ἔρημον τόπον καὶ ⸀ἀναπαύσασθε ὀλίγον. ἦσαν γὰρ οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί, καὶ οὐδὲ φαγεῖν εὐκαίρουν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/031.yaml
  text: And he said to them[a], “Come away by yourselves to a desolate place and rest a little.” For many were coming and going[b], and they did not even have an opportunity to eat.
translation:
  language: pt
  text: 'Ele lhes disse: “Venham sozinhos para um lugar isolado[a] e descansem um pouco”. Pois muitos chegavam e saíam, e eles nem sequer tinham oportunidade de comer[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um lugar deserto” ou “um lugar solitário”. O termo grego se refere a um local isolado ou desabitado, não necessariamente a um deserto no sentido moderno.
    reason: lexical_alternative
  - marker: b
    text: Ou “nem sequer tinham tempo para comer”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: disse
  rationale: Embora o grego use o presente histórico, o pretérito é mais natural na narrativa em português e preserva a função discursiva.
- source_word: Δεῦτε
  choice: Venham
  rationale: O imperativo introduz um convite para se aproximarem e se retirarem com Jesus; “Venham” transmite isso naturalmente sem acrescentar informação não expressa.
- source_word: ὑμεῖς αὐτοὶ κατ’ ἰδίαν
  choice: só vocês
  rationale: A combinação dos pronomes enfáticos com a locução “à parte” ressalta que os discípulos deveriam afastar-se dos demais. “Só vocês” reúne essas ideias de modo claro e idiomático.
- source_word: ἔρημον τόπον
  choice: um lugar isolado
  rationale: ἔρημος descreve aqui um lugar ermo, desabitado ou afastado, não necessariamente um deserto árido. “Lugar isolado” comunica com clareza o propósito de se afastarem da multidão.
- source_word: ἀναπαύσασθε ὀλίγον
  choice: descansem um pouco
  rationale: A expressão indica interromper o trabalho para repousar por breve tempo; a tradução é direta, natural e semanticamente precisa.
- source_word: οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί
  choice: muitos chegavam e saíam
  rationale: Os particípios descrevem o fluxo contínuo de numerosas pessoas. O imperfeito em português preserva esse aspecto durativo.
- source_word: οὐδὲ φαγεῖν εὐκαίρουν
  choice: eles nem sequer tinham oportunidade de comer
  rationale: εὐκαιρέω significa dispor de ocasião ou oportunidade. “Nem sequer” representa οὐδέ, e “tinham oportunidade” mantém a nuance lexical sem deixar de ser compreensível.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala direta é natural, e a repetição enfática do grego foi condensada em “só vocês” sem eliminar a ideia de separação.
