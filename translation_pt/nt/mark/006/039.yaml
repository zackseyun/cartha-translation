base_translation:
  language: en
  yaml_path: translation/nt/mark/006/039.yaml
  text: And he commanded them all to recline in groups on the green grass[a][b].
translation:
  language: pt
  text: E ordenou-lhes que fizessem todos se acomodarem em grupos sobre a grama verde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “grupo por grupo”; a expressão grega repetida tem sentido distributivo e destaca a organização das pessoas em grupos para a refeição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξεν
  choice: ordenou
  rationale: Expressa uma ordem com autoridade, preservando a força do verbo grego.
- source_word: αὐτοῖς
  choice: lhes
  rationale: Mantém o objeto indireto, que no contexto se refere aos discípulos, sem explicitar no texto aquilo que o pronome grego deixa implícito.
- source_word: ἀνακλῖναι
  choice: que fizessem ... se acomodar
  rationale: A construção causativa distingue os destinatários da ordem daqueles que deveriam tomar posição para a refeição; “se acomodar” comunica com naturalidade a ideia de reclinar-se ou assentar-se para comer.
- source_word: πάντας
  choice: todos
  rationale: Refere-se à totalidade das pessoas que deveriam ser acomodadas e permanece sintaticamente distinto de “lhes”.
- source_word: συμπόσια συμπόσια
  choice: em grupos
  rationale: A repetição grega tem sentido distributivo e descreve grupos separados, organizados para a refeição; a nota registra essa particularidade.
- source_word: ἐπὶ τῷ χλωρῷ χόρτῳ
  choice: sobre a grama verde
  rationale: Tradução direta e natural de χλωρός e χόρτος no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “ordenou-lhes que fizessem todos se acomodar” preserva a distinção gramatical entre os discípulos, que recebem a ordem, e a multidão, que deve ser acomodada. “Se acomodar” evita a impressão moderna inadequada de que todos necessariamente se deitaram, sem apagar o contexto de refeição.
