  text: ⸀καὶ ἐξελθοῦσα εἶπεν τῇ μητρὶ αὐτῆς· Τί ⸀αἰτήσωμαι; ἡ δὲ εἶπεν· Τὴν κεφαλὴν Ἰωάννου τοῦ ⸀βαπτίζοντος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/024.yaml
  text: And after going out, she said to her mother, “What should I ask for?” And she said, “The head of John the Baptizer.”
translation:
  language: pt
  text: 'Depois de sair, ela disse à mãe: “O que devo pedir?” A mãe respondeu: “A cabeça de João, o Batizador[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, conforme o uso tradicional, “João Batista”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: Depois de sair
  rationale: O particípio aoristo indica uma ação anterior ao verbo principal; esta formulação preserva com naturalidade a sequência temporal.
- source_word: Τί αἰτήσωμαι
  choice: O que devo pedir?
  rationale: O subjuntivo aoristo médio deliberativo expressa uma consulta sobre o que convém pedir; “devo pedir” comunica essa nuance em português corrente.
- source_word: μητρὶ αὐτῆς
  choice: à mãe
  rationale: No contexto imediato, o artigo definido com o vínculo familiar torna desnecessário repetir o possessivo, sem alterar o referente.
- source_word: κεφαλὴν
  choice: A cabeça
  rationale: Mantém sem eufemismo o objeto literal e chocante do pedido.
- source_word: τοῦ βαπτίζοντος
  choice: o Batizador
  rationale: O particípio presente substantivado identifica João por sua atividade característica. “Batizador” traduz o sentido do grego e evita que o título seja confundido com uma designação denominacional moderna.
theological_decisions:
- issue: Tradução do epíteto βαπτίζων aplicado a João
  choice: o Batizador
  alternative: o Batista
  rationale: A tradução pelo sentido reflete diretamente o particípio grego, enquanto a forma tradicional e amplamente reconhecida é preservada em nota. Nenhuma distinção doutrinária moderna deve ser inferida do epíteto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Depois de sair” conserva a relação temporal do particípio; “A mãe respondeu” evita a repetição ambígua de “ela disse” e identifica naturalmente a interlocutora, sem acrescentar conteúdo ao diálogo.
