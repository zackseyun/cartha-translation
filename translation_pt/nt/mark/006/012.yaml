source:
  edition: SBLGNT
  text: Καὶ ἐξελθόντες ⸀ἐκήρυξαν ἵνα ⸀μετανοῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/012.yaml
  text: And they went out and proclaimed that people should repent[a].
translation:
  language: pt
  text: E eles saíram e proclamaram que as pessoas se arrependessem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “que eles se arrependessem”; “eles” se refere aos que ouviram a proclamação.
    reason: Alternativa mais formal que preserva o sujeito plural implícito do verbo grego, embora possa soar ambígua em português.
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Preserva o conectivo narrativo simples e liga o versículo à comissão precedente sem acrescentar uma nuance temporal.
- source_word: ἐξελθόντες
  choice: eles saíram
  rationale: Converte naturalmente o particípio aoristo em verbo finito, mantendo os discípulos como sujeito e a saída como ação anterior ou concomitante à proclamação.
- source_word: ἐκήρυξαν
  choice: proclamaram
  rationale: Expressa a ideia de anúncio público própria de κηρύσσω sem restringi-la à acepção eclesiástica moderna de “pregar”.
- source_word: ἵνα
  choice: que
  rationale: Introduz de modo idiomático o conteúdo ou a resposta visada pela proclamação, preservando a abertura funcional da construção grega.
- source_word: μετανοῶσιν
  choice: se arrependessem
  rationale: Traduz de maneira concisa e reconhecível a mudança de mente e de rumo implicada por μετανοέω no contexto do Evangelho, sem reduzi-la apenas a pensamento ou sentimento.
theological_decisions:
- issue: Identidade do sujeito implícito de μετανοῶσιν
  choice: que as pessoas se arrependessem
  alternative: que eles se arrependessem
  rationale: O plural grego aponta aos ouvintes da proclamação. “As pessoas” evita que o pronome seja entendido como referência aos próprios discípulos, sem acrescentar conteúdo doutrinário.
- issue: Força de ἵνα após ἐκήρυξαν
  choice: 'introdução do conteúdo ou da resposta visada: “que ... se arrependessem”'
  alternative: 'finalidade explícita: “para que ... se arrependessem”'
  rationale: A construção pode envolver conteúdo e propósito. A formulação escolhida é natural em português e não força uma distinção que o grego não resolve completamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A ordem narrativa é natural, e “se arrependessem” conserva o peso teológico do termo sem explicação excessiva no corpo do texto.
