source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ὁ Ἰωάννης τῷ Ἡρῴδῃ ὅτι Οὐκ ἔξεστίν σοι ἔχειν τὴν γυναῖκα τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/018.yaml
  text: For John had been saying to Herod[a], “It is not lawful for you to have your brother’s wife.”
translation:
  language: pt
  text: 'Pois João vinha dizendo a Herodes: “Não é lícito você ter a esposa do seu irmão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: vinha dizendo
  rationale: O imperfeito indica ação passada contínua ou repetida. “Vinha dizendo” expressa naturalmente esse aspecto durativo em português, sem reduzi-lo a uma única fala.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação do contexto anterior e preserva a conexão argumentativa do grego.
- source_word: Ἡρῴδῃ
  choice: a Herodes
  rationale: Forma tradicional e amplamente reconhecida do nome em português; a preposição marca o destinatário da fala.
- source_word: Οὐκ ἔξεστίν σοι
  choice: Não é lícito você
  rationale: ἔξεστιν designa aquilo que é permitido ou lícito. “Não é lícito” mantém a força jurídico-moral da repreensão, enquanto “você” torna clara e natural a referência do dativo σοι.
- source_word: ἔχειν
  choice: ter
  rationale: Preserva o sentido direto do infinitivo e é idiomático no contexto de uma relação conjugal.
- source_word: γυναῖκα
  choice: a mulher
  rationale: γυνή pode significar “mulher” ou “esposa”. Aqui a relação conjugal é clara pelo contexto, mas “a mulher do seu irmão” preserva a formulação do grego e é natural em português.
- source_word: τοῦ ἀδελφοῦ σου
  choice: do seu irmão
  rationale: Reproduz com naturalidade o genitivo e mantém em destaque a relação familiar central à acusação.
theological_decisions:
- issue: Natureza da repreensão de João
  choice: “Não é lícito você ter”
  alternative: “Não é permitido que você tenha” / “Não é certo você ter”
  rationale: A tradução conserva a força de proibição legal e moral de ἔξεστιν, provavelmente relacionada às normas da Torá, sem inserir no texto uma citação ou explicação que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. “Vinha dizendo” preserva o aspecto contínuo do imperfeito; “não é lícito” mantém o tom profético e jurídico-moral. Não há variantes ou ambiguidades que exijam nota de rodapé nesta formulação.
