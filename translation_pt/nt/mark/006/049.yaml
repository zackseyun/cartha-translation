source:
  edition: SBLGNT
  text: οἱ δὲ ἰδόντες αὐτὸν ⸂ἐπὶ τῆς θαλάσσης περιπατοῦντα⸃ ἔδοξαν ⸂ὅτι φάντασμά ἐστιν⸃ καὶ ἀνέκραξαν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/049.yaml
  text: But when they saw him walking on the sea[a], they thought that it was a ghost, and they cried out,
translation:
  language: pt
  text: Mas, quando o viram andando sobre o mar, pensaram que fosse uma aparição[a] e gritaram,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um fantasma” ou “uma figura espectral”. O termo grego φάντασμα se refere a uma aparição de aspecto sobrenatural.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mas
  rationale: δέ introduz com leve contraste a reação dos discípulos; o grupo já está implícito na forma verbal portuguesa.
- source_word: ἰδόντες αὐτόν
  choice: quando o viram
  rationale: O particípio aoristo tem valor temporal e é expresso naturalmente em português por uma oração com “quando”.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: andando sobre o mar
  rationale: ἐπί com genitivo, neste contexto, descreve Jesus sobre a superfície da água. “Mar” preserva a designação de θάλασσα usada no relato.
- source_word: ἔδοξαν
  choice: pensaram
  rationale: δοκέω indica aqui uma conclusão ou suposição equivocada dos discípulos.
- source_word: ὅτι φάντασμά ἐστιν
  choice: que fosse uma aparição
  rationale: A construção portuguesa com “pensaram que fosse” transmite de modo idiomático a percepção equivocada. “Aparição” mantém a ideia de uma figura espectral sem pressupor de forma excessivamente específica o espírito de uma pessoa morta.
- source_word: καὶ ἀνέκραξαν
  choice: e gritaram
  rationale: ἀνακράζω denota um grito forte; “gritaram” é direto, natural e preserva a intensidade.
theological_decisions:
- issue: Natureza da ação de Jesus sobre a água
  choice: andando sobre o mar
  alternative: andando junto ao mar
  rationale: No contexto narrativo, ἐπὶ τῆς θαλάσσης descreve movimento sobre a superfície da água, e não apenas ao lado dela.
- issue: Natureza do φάντασμα percebido pelos discípulos
  choice: uma aparição
  alternative: um fantasma
  rationale: O termo grego designa uma manifestação espectral. “Aparição” preserva a amplitude lexical sem definir uma ontologia específica; a alternativa comum é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e ampla legibilidade brasileira. A vírgula final foi preservada porque o versículo continua diretamente no seguinte.
