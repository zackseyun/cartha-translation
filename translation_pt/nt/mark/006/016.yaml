  text: ἀκούσας δὲ ⸀ὁ Ἡρῴδης ⸀ἔλεγεν· Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην, οὗτος ⸀ἠγέρθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/016.yaml
  text: But when Herod heard it[a], he said, “John, whom I beheaded[b], has been raised.”
translation:
  language: pt
  text: 'Mas Herodes, ao ouvir isso, dizia[a]: “João, a quem eu decapitei, foi ressuscitado[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “continuava dizendo”; o verbo grego está no imperfeito e pode indicar fala contínua ou repetida.'
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “foi levantado”. O verbo grego está na voz passiva; traduções como “ressuscitou” expressam o sentido em voz ativa.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: ao ouvir isso
  rationale: O particípio aoristo é entendido temporalmente em relação ao verbo principal. “Ao ouvir isso” é natural em português; “isso” retoma as notícias mencionadas no contexto.
- source_word: δὲ
  choice: Mas
  rationale: A conjunção assinala uma transição com leve contraste, voltando a narrativa para a reação de Herodes.
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito grego é preservado pelo imperfeito português, deixando aberta a possibilidade de fala contínua ou repetida.
- source_word: Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην
  choice: João, a quem eu decapitei
  rationale: A formulação portuguesa reorganiza a ordem marcada do grego para ficar inteligível, mas conserva a ênfase do pronome ἐγώ em “eu” e o sentido específico de decapitação.
- source_word: οὗτος
  choice: esse
  rationale: O demonstrativo retoma João com força enfática; “esse” preserva melhor essa retomada do que o simples pronome “ele”.
- source_word: ἠγέρθη
  choice: foi ressuscitado
  rationale: A forma passiva é mantida. No contexto de alguém que voltou dentre os mortos, “ressuscitado” comunica com clareza o sentido, sem transformar a construção em voz ativa.
theological_decisions:
- issue: A voz passiva de ἠγέρθη na linguagem de ressurreição
  choice: foi ressuscitado
  alternative: ressuscitou / levantou-se
  rationale: A opção mantém a voz passiva do grego e não identifica explicitamente o agente. Assim, preserva-se a forma e a tensão do texto sem converter a afirmação de Herodes em uma fórmula ativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O travessão destaca a retomada enfática de João por οὗτος sem tornar a frase excessivamente literal.
