id: MRK.6.17
reference: Mark 6:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Αὐτὸς γὰρ ὁ Ἡρῴδης ἀποστείλας ἐκράτησεν τὸν Ἰωάννην καὶ ἔδησεν αὐτὸν ἐν φυλακῇ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ, ὅτι αὐτὴν ἐγάμησεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/017.yaml
  text: For Herod himself had sent and seized John[a], and bound him in prison because of Herodias, the wife of Philip his brother[b], because he had married her.
translation:
  language: pt
  text: Pois o próprio Herodes havia mandado prender João[a] e o tinha mantido preso, por causa de Herodias, esposa de Filipe, seu irmão, pois Herodes havia se casado com ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tendo enviado, prendeu João”; a construção apresenta Herodes como responsável pela prisão.
    reason: Esclarecer a construção grega sem afirmar mais do que o texto explicita sobre os agentes enviados.
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ Ἡρῴδης
  choice: Pois o próprio Herodes
  rationale: “Pois” preserva a ligação explicativa de γάρ, e “o próprio Herodes” mantém a ênfase de Αὐτός sem sugerir que ele executou pessoalmente a prisão.
- source_word: ἀποστείλας ἐκράτησεν
  choice: havia mandado prender
  rationale: A combinação do particípio “tendo enviado” com “prendeu/deteve” apresenta Herodes como responsável pela ação realizada por agentes. “Mandado prender” expressa isso com naturalidade e evita a impressão de que ele apenas enviou uma mensagem e depois prendeu João pessoalmente.
- source_word: τὸν Ἰωάννην
  choice: João
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: ἔδησεν αὐτὸν ἐν φυλακῇ
  choice: o tinha amarrado na prisão
  rationale: “Amarrado” preserva o sentido concreto de δέω sem acrescentar correntes, algemas ou outro instrumento não mencionado; “na prisão” traduz o local de confinamento indicado por φυλακή.
- source_word: διὰ Ἡρῳδιάδα
  choice: por causa de Herodias
  rationale: διά com acusativo indica aqui a causa da prisão; a formulação é clara e corrente em português.
- source_word: τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: mulher de seu irmão Filipe
  rationale: 'No contexto, γυνή designa a esposa. “Mulher de” é natural em português e conserva a relação declarada no texto: Herodias era mulher de Filipe, irmão de Herodes.'
- source_word: ὅτι αὐτὴν ἐγάμησεν
  choice: pois ele havia se casado com ela
  rationale: O mais-que-perfeito composto comunica naturalmente que o casamento antecedeu e motivou a prisão, sem acrescentar avaliação moral à oração.
theological_decisions:
- issue: Avaliação moral do casamento de Herodes com Herodias
  choice: Relatar a causa histórica sem inserir no versículo uma condenação explícita
  alternative: Qualificar já aqui o casamento como ilícito
  rationale: Este versículo identifica a prisão de João com Herodias e com o casamento de Herodes; a condenação legal e moral aparece no contexto seguinte. A tradução não antecipa nem omite a tensão narrativa.
- issue: Responsabilidade de Herodes pela prisão
  choice: “o próprio Herodes havia mandado prender”
  alternative: “Herodes pessoalmente prendeu”
  rationale: A ênfase recai sobre a responsabilidade de Herodes, enquanto ἀποστείλας permite entender que a ação foi executada por enviados. A formulação evita atribuir-lhe participação física não afirmada pelo texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “o próprio Herodes” para a ênfase, “mandado prender” para a ação por agentes e “havia se casado” para a anterioridade narrativa. Evita linguagem jurídica excessivamente técnica e detalhes não presentes no grego.
