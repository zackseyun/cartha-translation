revisions:
- from: Pois o próprio Herodes havia mandado prender João[a] e o tinha amarrado na prisão, por causa de Herodias, mulher de seu irmão Filipe, pois ele havia se casado com ela.
  to: Pois o próprio Herodes havia mandado prender João[a] e o tinha mantido preso, por causa de Herodias, esposa de Filipe, seu irmão, pois Herodes havia se casado com ela.
  rationale: A revisão substitui uma expressão concreta, mas estranha em português, por uma formulação idiomática que preserva o sentido de custódia de δέω ἐν φυλακῇ. Também torna inequívocas as referências a Filipe e a Herodes. A nota foi ajustada para descrever a construção participial sem transformar em afirmação explícita um detalhe apenas inferido do contexto.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:56:23Z'
review_pass:
  verdict: revise
  source_fidelity: A ação mediada de ἀποστείλας ἐκράτησεν é bem comunicada por “havia mandado prender”. Contudo, “amarrado na prisão” é pouco natural e pode sugerir apenas que João foi atado dentro da prisão, em vez de expressar a detenção/confinamento resultante de ἔδησεν ἐν φυλακῇ. A revisão preserva a responsabilidade de Herodes e a causalidade do enunciado.
  naturalness: “Manter preso” é uma formulação moderna e idiomática em português, mais fluente do que “amarrar na prisão”. “Esposa de Filipe, seu irmão” também elimina a leitura momentaneamente ambígua de “mulher de seu irmão Filipe”.
  terminology: “Esposa” é inequívoco para γυνή neste contexto. “Mantido preso” traduz adequadamente o efeito de δέω no contexto carcerário sem acrescentar o instrumento de contenção (correntes, algemas etc.). O nome Herodes é repetido na última oração para evitar ambiguidade de referente.
  issues:
  - severity: medium
    issue: “o tinha amarrado na prisão” soa pouco idiomático e especifica de modo potencialmente enganoso o local do ato de amarrar.
    rationale: δέω tem o sentido básico de “atar”, mas, em conjunto com ἐν φυλακῇ e a ação de custódia precedente, o português natural pode expressar o confinamento como “manteve preso”, sem sugerir detalhes materiais não explicitados.
  - severity: low
    issue: “mulher de seu irmão Filipe” e “pois ele” admitem uma ambiguidade referencial evitável.
    rationale: A aposição “Filipe, seu irmão” e a repetição de “Herodes” deixam claros tanto o vínculo fraterno quanto quem se casou com Herodias.
  revised_text: Pois o próprio Herodes havia mandado prender João[a] e o tinha mantido preso, por causa de Herodias, esposa de Filipe, seu irmão, pois Herodes havia se casado com ela.
  revised_footnotes:
