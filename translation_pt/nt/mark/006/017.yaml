    text: Literalmente, “tendo enviado, prendeu João”; a construção apresenta Herodes como responsável pela prisão.
    reason: Esclarecer a construção grega sem afirmar mais do que o texto explicita sobre os agentes enviados.
  revision_rationale: A revisão substitui uma expressão concreta, mas estranha em português, por uma formulação idiomática que preserva o sentido de custódia de δέω ἐν φυλακῇ. Também torna inequívocas as referências a Filipe e a Herodes. A nota foi ajustada para descrever a construção participial sem transformar em afirmação explícita um detalhe apenas inferido do contexto.
