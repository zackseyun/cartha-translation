  text: ἀπόλυσον αὐτούς, ἵνα ἀπελθόντες εἰς τοὺς κύκλῳ ἀγροὺς καὶ κώμας ἀγοράσωσιν ἑαυτοῖς ⸂τί φάγωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/036.yaml
  text: Send them away[a], so that they may go into the surrounding countryside and villages and buy themselves something to eat.
translation:
  language: pt
  text: Despede-os, para que vão aos campos e povoados vizinhos e comprem para si algo para comer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόλυσον αὐτούς
  choice: Mandem o povo embora
  rationale: O imperativo aoristo de ἀπολύω significa aqui dispensar ou mandar embora. O referente plural é a multidão mencionada no contexto; “o povo” é natural em português e evita um pronome sem antecedente no versículo isolado.
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade da ordem e é a formulação corrente e clara em português.
- source_word: ἀπελθόντες
  choice: vá
  rationale: O particípio aoristo expressa uma ação anterior ou associada à compra. Integrá-lo à oração de finalidade produz português natural sem eliminar a sequência implícita.
- source_word: τοὺς κύκλῳ ἀγροὺς καὶ κώμας
  choice: aos campos e povoados ao redor
  rationale: κύκλῳ indica os lugares circundantes; ἀγροί pode designar campos, propriedades rurais ou áreas campestres, e κῶμαι, povoados ou aldeias. A tradução conserva os dois termos concretos.
- source_word: ἀγοράσωσιν ἑαυτοῖς
  choice: compre para si
  rationale: ἀγοράζω tem o sentido comum de comprar, e o dativo reflexivo ἑαυτοῖς assinala benefício próprio. O singular coletivo concorda naturalmente com “o povo”.
- source_word: τί φάγωσιν
  choice: algo para comer
  rationale: A expressão idiomática comunica o sentido indefinido de τί e a finalidade do alimento em português atual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala direta usa o imperativo plural “Mandem”, adequado aos discípulos como destinatários. “Povoados” é amplamente compreensível e preserva o caráter rural de κῶμαι.
