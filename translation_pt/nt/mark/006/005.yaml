  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐδύνατο ἐκεῖ ⸂ποιῆσαι οὐδεμίαν δύναμιν⸃, εἰ μὴ ὀλίγοις ἀρρώστοις ἐπιθεὶς τὰς χεῖρας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/005.yaml
  text: And he was not able to do any mighty work there[a], except that he laid his hands on a few sick people and healed them.
translation:
  language: pt
  text: E não podia fazer ali nenhum ato de poder[a], exceto que, impondo as mãos sobre alguns poucos doentes, os curou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nenhum milagre” ou “nenhuma obra poderosa”; literalmente, “nenhum poder”, expressão usada por Marcos para atos milagrosos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: não pôde
  rationale: Traduz diretamente a forma de δύναμαι sob negação, preservando a afirmação de incapacidade sem a suavizar.
- source_word: ποιῆσαι
  choice: fazer
  rationale: Mantém o sentido amplo e direto de ποιέω e forma, com o complemento, uma expressão natural em português.
- source_word: οὐδεμίαν δύναμιν
  choice: nenhum ato de poder
  rationale: No uso de Marcos, δύναμις pode designar uma ação milagrosa. “Ato de poder” conserva a ligação lexical com poder e evita tornar “milagre” a única interpretação.
- source_word: εἰ μὴ
  choice: a não ser
  rationale: Introduz com clareza a exceção à negação precedente.
- source_word: ὀλίγοις ἀρρώστοις
  choice: alguns doentes
  rationale: Expressa de modo natural a pequena quantidade indicada por ὀλίγοις e o sentido de pessoas enfermas de ἀρρώστοις.
- source_word: ἐπιθεὶς τὰς χεῖρας
  choice: impor as mãos sobre
  rationale: Reproduz a ação física do particípio aoristo numa expressão bíblica ainda clara e corrente em português.
- source_word: ἐθεράπευσεν
  choice: curá-los
  rationale: Traduz θεραπεύω no contexto de restauração da saúde; o pronome retoma claramente “alguns doentes”.
theological_decisions:
- issue: Se οὐκ ἐδύνατο deve ser suavizado para evitar a ideia de limitação em Jesus
  choice: 'Manter o sentido explícito: “não pôde fazer ali nenhum ato de poder”'
  alternative: “não quis fazer ali nenhum ato de poder” ou uma formulação que indique apenas ausência de ação
  rationale: O grego afirma incapacidade mediante δύναμαι com negação. A tradução preserva a tensão teológica do texto, sem a resolver por explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Não pôde” preserva a força do original; “ato de poder” mantém a dimensão lexical de δύναμις, esclarecida pela nota.
