revisions:
- from: E não pôde fazer ali nenhum ato de poder[a], a não ser impor as mãos sobre alguns doentes e curá-los.
  to: E não podia fazer ali nenhum ato de poder[a], exceto que, impondo as mãos sobre alguns poucos doentes, os curou.
  rationale: A revisão ajusta o aspecto do imperfeito grego, explicita a pequena quantidade de pessoas e torna mais clara em português a sequência «impondo as mãos ... curou», sem suavizar a incapacidade expressa no texto nem resolver a tensão teológica.
