  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ἐκεῖθεν, καὶ ⸀ἔρχεται εἰς τὴν πατρίδα αὐτοῦ, καὶ ἀκολουθοῦσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/001.yaml
  text: And he went out from there and came to his hometown[a], and his disciples followed him.
translation:
  language: pt
  text: Ele saiu dali e foi para sua terra natal,[a] e seus discípulos o seguiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vai para sua terra natal, e seus discípulos o seguem”. O grego usa presentes históricos para dar vivacidade à narrativa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: O aoristo de ἐξέρχομαι indica a saída do lugar anterior. “Saiu” preserva de modo natural a imagem verbal do grego.
- source_word: ἐκεῖθεν
  choice: dali
  rationale: O advérbio assinala o ponto de partida. “Dali” é conciso, natural e retoma o local anterior.
- source_word: ἔρχεται
  choice: foi
  rationale: Embora o grego empregue o presente histórico, o pretérito é mais natural na narrativa portuguesa. “Foi para” expressa adequadamente o movimento em direção ao destino no enquadramento do narrador.
- source_word: πατρίδα
  choice: terra natal
  rationale: Neste contexto, πατρίς designa o lugar ou a região de origem de Jesus. “Terra natal” preserva uma abrangência possível maior que “cidade natal”, sem sugerir necessariamente uma nação.
- source_word: ἀκολουθοῦσιν
  choice: seguiram
  rationale: O presente histórico foi vertido no pretérito por naturalidade narrativa. “Seguiram” mantém tanto o sentido de acompanhar quanto a linguagem característica do discipulado.
- source_word: μαθηταὶ
  choice: discípulos
  rationale: “Discípulos” é a tradução corrente e precisa de μαθηταί nos Evangelhos, reunindo as ideias de aprendizes e seguidores.
theological_decisions:
- issue: Tradução dos presentes históricos ἔρχεται e ἀκολουθοῦσιν
  choice: 'Uso do pretérito: “foi” e “seguiram”'
  alternative: 'Manter o presente histórico: “vai” e “seguem”'
  rationale: A decisão é estilística, não doutrinária. O pretérito produz uma narrativa natural em português, enquanto a nota preserva para o leitor a vivacidade e a forma verbal do original.
- issue: Extensão geográfica de πατρίς
  choice: “terra natal”
  alternative: “cidade natal” ou “região natal”
  rationale: O termo grego pode designar o lugar de origem sem fixar por si só se se trata estritamente da cidade ou da região. “Terra natal” conserva essa flexibilidade contextual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção evita excesso de coordenação por “e”, sem perder a sequência narrativa do grego.
