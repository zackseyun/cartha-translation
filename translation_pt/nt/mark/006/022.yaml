  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἰσελθούσης τῆς θυγατρὸς ⸂αὐτῆς τῆς⸃ Ἡρῳδιάδος καὶ ὀρχησαμένης ⸂καὶ ἀρεσάσης⸃ τῷ Ἡρῴδῃ καὶ τοῖς συνανακειμένοις, ⸂εἶπεν ὁ βασιλεὺς⸃ τῷ κορασίῳ· Αἴτησόν με ὃ ἐὰν θέλῃς, καὶ δώσω σοι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/022.yaml
  text: And when Herodias's daughter came in and danced[a], and pleased Herod and those reclining at the table with him, the king said to the girl, “Ask me for whatever you want[b], and I will give it to you.”
translation:
  language: pt
  text: 'Quando a filha de Herodias[a] entrou e dançou, agradou a Herodes e aos que estavam reclinados à mesa com ele[b]. Então o rei disse à menina: “Peça-me o que quiser, e eu lhe darei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos ou tradições são entendidos como “a filha dele, Herodias”, em vez de “a filha de Herodias”. O texto grego seguido aqui diz “a filha de Herodias”.
    reason: textual_variant
  - marker: b
    text: Ou “aos que estavam comendo com ele”; o grego se refere aos demais convidados do banquete, que comiam reclinados à mesa, conforme o costume da época.
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθούσης
  choice: quando ... entrou
  rationale: O particípio aoristo em genitivo absoluto recebe valor temporal; “quando ... entrou” é natural em português e preserva a entrada da jovem no ambiente do banquete.
- source_word: τῆς θυγατρὸς αὐτῆς τῆς Ἡρῳδιάδος
  choice: a filha da própria Herodias
  rationale: A construção genitiva identifica mais naturalmente a jovem como filha de Herodias, e αὐτῆς é representado por “própria”, sem ocultar a variante textual e interpretativa registrada em nota.
- source_word: ὀρχησαμένης
  choice: dançou
  rationale: O pretérito perfeito expressa de modo claro e fluente a ação do particípio aoristo, sem acrescentar conotações não presentes no verbo.
- source_word: ἀρεσάσης
  choice: agradou
  rationale: Tradução direta de ἀρέσκω, mantendo o tom sóbrio do original sem intensificá-lo como “encantou” faria.
- source_word: τοῖς συνανακειμένοις
  choice: aos que estavam reclinados à mesa com ele
  rationale: Preserva a imagem concreta dos demais participantes do banquete reclinados à mesa, costume que recebe breve explicação em nota.
- source_word: εἶπεν ὁ βασιλεὺς
  choice: o rei disse
  rationale: Mantém βασιλεύς como “rei”, conforme a designação narrativa de Marcos, sem substituí-la pelo título histórico técnico de tetrarca.
- source_word: τῷ κορασίῳ
  choice: à menina
  rationale: “Menina” é uma tradução moderna e natural de κοράσιον; evita o arcaísmo de “donzela”.
- source_word: Αἴτησόν με
  choice: Peça-me
  rationale: Forma imperativa direta e idiomática em português, adequada ao pedido que Herodes autoriza.
- source_word: ὃ ἐὰν θέλῃς
  choice: o que quiser
  rationale: Expressa naturalmente a escolha aberta indicada pela construção relativa indefinida com ἐάν.
- source_word: δώσω σοι
  choice: eu lhe darei
  rationale: O pronome “lhe” representa o destinatário e o objeto fica naturalmente recuperável de “o que quiser”, como permite o português.
theological_decisions:
- issue: Designação de Herodes Antipas por βασιλεύς
  choice: o rei
  alternative: Herodes, o tetrarca; o governante
  rationale: A tradução conserva a designação narrativa de Marcos em vez de corrigir o texto com um título histórico mais técnico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura participial grega foi convertida em sequência verbal natural. Os marcadores de nota foram posicionados junto às expressões que efetivamente explicam.
