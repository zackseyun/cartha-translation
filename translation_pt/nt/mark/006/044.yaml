base_translation:
  language: en
  yaml_path: translation/nt/mark/006/044.yaml
  text: And those who ate the loaves were five thousand men[a][b].
translation:
  language: pt
  text: E os que comeram os pães eram cinco mil homens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz especificamente “homens”, isto é, pessoas do sexo masculino, e não usa um termo genérico para “pessoas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν
  choice: eram
  rationale: O imperfeito de εἰμί funciona como cópula simples para declarar o total. “Eram” reproduz diretamente a construção grega sem acrescentar a ideia de que foram contados.
- source_word: οἱ φαγόντες
  choice: os que comeram
  rationale: O particípio aoristo com artigo identifica o grupo pela ação concluída de comer. A formulação é natural em português e não transforma desnecessariamente o aoristo em mais-que-perfeito.
- source_word: τοὺς ἄρτους
  choice: os pães
  rationale: Embora ἄρτος possa designar pão em sentido coletivo ou um pão específico, o plural aqui retoma os pães concretos distribuídos no relato. “Os pães” preserva tanto o plural quanto essa referência narrativa.
- source_word: πεντακισχίλιοι
  choice: cinco mil
  rationale: Equivalência cardinal direta e idiomática em português.
- source_word: ἄνδρες
  choice: homens
  rationale: ἀνήρ é um termo especificamente masculino, não uma designação genérica de pessoas. “Homens” conserva essa precisão do texto grego.
theological_decisions:
- issue: Termo masculino específico na contagem
  choice: Traduzir ἄνδρες como “homens” no texto principal.
  alternative: pessoas
  rationale: O grego emprega o termo especificamente masculino ἀνήρ, e não um substantivo genérico para pessoas. A tradução preserva essa especificidade sem concluir se mulheres e crianças estavam ou não presentes.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do original. Mantém-se “os pães” no plural, como referência aos pães do relato; não se acrescenta nota para o singular coletivo “pão”, pois em português o plural é natural e semanticamente preciso neste contexto.
