  text: καὶ ⸀ἐθαύμαζεν διὰ τὴν ἀπιστίαν αὐτῶν. Καὶ περιῆγεν τὰς κώμας κύκλῳ διδάσκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/006.yaml
  text: And he was amazed because of their unbelief[a]. And he went around among the villages[b], teaching.
translation:
  language: pt
  text: E admirava-se por causa da incredulidade deles.[a] E percorria os povoados ao redor, ensinando.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficava espantado por causa da incredulidade deles”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “percorria em circuito os povoados” ou “percorria os povoados vizinhos, ensinando”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζεν
  choice: admirava-se
  rationale: O imperfeito indica uma reação passada em curso; “admirava-se” preserva de modo digno e natural o sentido de espanto de θαυμάζω sem explicar ou atenuar a afirmação.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: por causa da incredulidade deles
  rationale: διά com acusativo expressa causa, e ἀπιστία, neste contexto, indica incredulidade ou recusa em crer, não apenas fé fraca.
- source_word: περιῆγεν
  choice: percorria
  rationale: O imperfeito retrata a atividade continuada de ir de lugar em lugar; “percorria” comunica bem esse movimento itinerante.
- source_word: τὰς κώμας
  choice: os povoados
  rationale: κώμη designa uma aldeia ou povoação rural; “povoados” é claro e amplamente compreensível em português.
- source_word: κύκλῳ
  choice: ao redor
  rationale: O advérbio indica os lugares circunvizinhos ou um percurso em circuito; “ao redor” conserva essa abertura de sentido sem tornar a frase artificial.
- source_word: διδάσκων
  choice: ensinando
  rationale: O particípio presente descreve a ação contemporânea ao percurso, e o gerúndio português mantém essa relação de modo natural.
theological_decisions:
- issue: A reação de Jesus diante da incredulidade
  choice: admirava-se por causa da incredulidade deles
  alternative: ficava espantado por causa da falta de fé deles
  rationale: A redação mantém a afirmação narrativa de que Jesus se admirava, sem suavizá-la nem acrescentar uma explicação cristológica ausente do texto. “Incredulidade” preserva melhor a força contextual de ἀπιστία.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A segunda ocorrência de καί foi vertida por “Depois” para dar continuidade narrativa natural. Os imperfeitos “admirava-se” e “percorria” preservam o aspecto durativo das formas gregas.
source_grounding:
  english_pob_role: consult_only
