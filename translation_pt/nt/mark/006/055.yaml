base_translation:
  language: en
  yaml_path: translation/nt/mark/006/055.yaml
  text: They ran throughout that whole region and began carrying those who were sick on mats to wherever they heard he was[a].
translation:
  language: pt
  text: Correram por toda aquela região e começaram a levar em esteiras[a] os que estavam doentes para onde quer que ouvissem dizer que ele estava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “catres” ou “leitos portáteis”; o termo grego se refere a uma forma simples e portátil de cama.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέδραμον
  choice: Correram por toda
  rationale: Preserva tanto a rapidez expressa pelo verbo composto quanto o movimento por toda a extensão da região.
- source_word: ὅλην τὴν χώραν ἐκείνην
  choice: toda aquela região
  rationale: “Região” comunica o distrito ou território circundante sem sugerir um país no sentido moderno, e mantém a ênfase de “toda aquela”.
- source_word: ἤρξαντο ... περιφέρειν
  choice: começaram a levar
  rationale: Mantém o valor ingressivo de ἤρξαντο e expressa naturalmente o transporte dos doentes de um lugar para outro.
- source_word: ἐπὶ τοῖς κραβάττοις
  choice: em esteiras
  rationale: κράβαττος designa um leito simples e portátil; “esteiras” é claro, concreto e adequado ao contexto, enquanto alternativas são registradas em nota.
- source_word: τοὺς κακῶς ἔχοντας
  choice: os que estavam doentes
  rationale: Traduz de modo idiomático a expressão grega para pessoas enfermas, sem acrescentar gravidade ou diagnóstico.
- source_word: ὅπου ἤκουον ὅτι ἐστίν
  choice: para onde quer que ouvissem dizer que ele estava
  rationale: Explicita o sentido de destino assumido por ὅπου no contexto e conserva o caráter indireto da informação recebida.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluência brasileira. A construção “para onde quer que” preserva a ideia distributiva sem tornar a frase excessivamente literal.
