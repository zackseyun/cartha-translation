  text: καὶ εἰσελθοῦσα ⸀εὐθὺς μετὰ σπουδῆς πρὸς τὸν βασιλέα ᾐτήσατο λέγουσα· Θέλω ἵνα ⸂ἐξαυτῆς δῷς μοι⸃ ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/025.yaml
  text: And she immediately went in with haste to the king and asked[a], saying, “I want you to give me at once, on a platter, the head of John the Baptizer.”
translation:
  language: pt
  text: 'Ela entrou imediatamente e, com toda a pressa, foi até o rei e lhe pediu: “Quero que você me dê agora mesmo, numa bandeja, a cabeça de João, o Batizador[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, tradicionalmente, “João Batista”.
    reason: alternativa_lexical
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: entrou
  rationale: O particípio aoristo indica a entrada dela no ambiente do banquete ou na presença do rei; “entrou” é direto e natural em português.
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Preserva a urgência narrativa característica de Marcos.
- source_word: μετὰ σπουδῆς
  choice: com toda a pressa
  rationale: Expressa rapidez intensa sem sugerir entusiasmo positivo; também mantém esse elemento distinto de εὐθὺς.
- source_word: πρὸς τὸν βασιλέα
  choice: foi até o rei
  rationale: Torna natural em português o movimento em direção ao rei após a entrada, sem omitir a preposição grega.
- source_word: βασιλέα
  choice: o rei
  rationale: Embora Herodes Antipas fosse historicamente tetrarca, o texto grego emprega βασιλεύς e deve ser traduzido conforme a designação narrativa.
- source_word: ᾐτήσατο
  choice: lhe pediu
  rationale: O verbo denota a apresentação de um pedido; “pediu” evita intensificá-lo indevidamente como uma exigência, cuja contundência já aparece na fala citada.
- source_word: Θέλω
  choice: Quero
  rationale: Reproduz de maneira simples e contundente a expressão de vontade.
- source_word: ἵνα ... δῷς μοι
  choice: que você me dê
  rationale: É a construção portuguesa corrente para expressar o conteúdo do que ela quer, mantendo explícito o agente da ação.
- source_word: ἐξαυτῆς
  choice: agora mesmo
  rationale: Comunica a exigência de execução imediata e a distingue do εὐθὺς que descreve a entrada dela.
- source_word: ἐπὶ πίνακι
  choice: numa bandeja
  rationale: πίναξ designa uma travessa ou bandeja; “bandeja” é natural no contexto de um banquete e na formulação portuguesa desta cena.
- source_word: τὴν κεφαλὴν
  choice: a cabeça
  rationale: Mantém sem atenuação a especificidade brutal do pedido.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: João Batista
  rationale: Em português, “João Batista” é a forma consagrada e amplamente compreensível; “Batista” funciona aqui como o título identificador correspondente a βαπτιστής.
theological_decisions:
- issue: Tradução de Ἰωάννου τοῦ βαπτιστοῦ
  choice: João Batista
  alternative: João, o Batizador
  rationale: “João Batista” é a forma portuguesa tradicional e corrente, sem perda prática da identificação. “João, o Batizador” explicitaria mais diretamente o caráter descritivo do grego, mas soa menos natural e não é necessário para a clareza neste versículo.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição semântica de εὐθὺς e ἐξαυτῆς foi preservada por “imediatamente” e “agora mesmo”. A coordenação foi levemente explicitada (“foi até o rei”) para representar πρὸς τὸν βασιλέα com fluidez.
