    rationale: A substituição por «deles» torna explícito o referente pessoal, harmoniza a sequência pronominal e preserva mais diretamente o objeto plural da compaixão no texto-fonte.
  revised_text: Ao desembarcar, ele viu uma grande multidão e teve compaixão deles, porque eram como ovelhas sem pastor.[a] E começou a lhes ensinar muitas coisas.
