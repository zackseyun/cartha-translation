  source_fidelity: 'A tradução transmite com precisão a progressão narrativa e os elementos centrais do grego: o desembarque contextual de ἐξελθών, a multidão, a compaixão, a imagem das ovelhas sem pastor e o início de um ensino extenso. Contudo, «teve compaixão dela» faz «multidão» ser o objeto expresso da compaixão, ao passo que o grego se refere às pessoas da multidão (αὐτούς); a oração seguinte já retoma essas pessoas no plural («eram»).'
  naturalness: «Ao desembarcar» e «uma grande multidão» são naturais e claros. A concordância entre «dela» e «eram» é compreensível por silepse, mas fica menos fluida e cria uma mudança de referente desnecessária. «Teve compaixão deles» é idiomático, claro e mantém o referente pessoal do original.
  terminology: «Compaixão», «ovelhas sem pastor» e «ensinar muitas coisas» são escolhas adequadas, modernas e fiéis. A nota preserva a metáfora sem impor uma interpretação doutrinária e suas referências são pertinentes.
  issues:
