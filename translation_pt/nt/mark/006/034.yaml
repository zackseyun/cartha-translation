  to: Ao desembarcar, ele viu uma grande multidão e teve compaixão deles, porque eram como ovelhas sem pastor.[a] E começou a lhes ensinar muitas coisas.
  rationale: A revisão limita-se a restaurar no português o referente plural e pessoal de αὐτούς por meio de «deles» e a conservar a ligação narrativa simples de καί com «E começou». Não altera a imagem pastoral, o sentido da compaixão nem a extensão do ensino.
