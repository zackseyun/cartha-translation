base_translation:
  language: en
  yaml_path: translation/nt/mark/006/034.yaml
  text: And when he went ashore[a], he saw a large crowd, and he had compassion on them, because they were like sheep without a shepherd[b]. And he began to teach them many things.
translation:
  language: pt
  text: Ao desembarcar, ele viu uma grande multidão e teve compaixão deles, porque eram como ovelhas sem pastor.[a] E começou a lhes ensinar muitas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A imagem de “ovelhas sem pastor” retoma a linguagem bíblica sobre um povo sem liderança fiel; compare Números 27:17; 1 Reis 22:17; Ezequiel 34:5.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Ao desembarcar
  rationale: Embora signifique literalmente “tendo saído”, o contexto imediato da travessia de barco indica a saída da embarcação para terra. “Ao desembarcar” expressa isso de modo natural e conciso.
- source_word: εἶδεν
  choice: ele viu
  rationale: Tradução direta do aoristo de ὁράω, sem acrescentar nuance interpretativa.
- source_word: πολὺν ὄχλον
  choice: uma grande multidão
  rationale: Preserva tanto o sentido coletivo de ὄχλος quanto a dimensão quantitativa indicada por πολύν.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοὺς
  choice: teve compaixão dela
  rationale: O verbo indica compaixão profunda. Em português atual, “ter compaixão de” é natural; o pronome singular retoma “multidão” e evita a forma pouco idiomática “compaixão sobre eles”.
- source_word: ὅτι
  choice: porque
  rationale: Introduz claramente a razão da compaixão de Jesus.
- source_word: ὡς πρόβατα μὴ ἔχοντα ποιμένα
  choice: como ovelhas sem pastor
  rationale: Mantém intacta a conhecida metáfora pastoral e traduz a construção participial de forma idiomática.
- source_word: ἤρξατο διδάσκειν
  choice: começou a lhes ensinar
  rationale: Reproduz o valor ingressivo da construção e posiciona o objeto indireto de maneira natural em português.
- source_word: αὐτοὺς πολλά
  choice: lhes ensinar muitas coisas
  rationale: πολλά indica aqui o conteúdo amplo do ensino. “Muitas coisas” é direto e preserva sua força substantivada.
theological_decisions:
- issue: Imagem pastoral de ovelhas sem liderança
  choice: Manter “como ovelhas sem pastor” sem explicar seu sentido no corpo do versículo.
  alternative: Expandir interpretativamente para “como ovelhas sem liderança espiritual”.
  rationale: A formulação provavelmente evoca passagens bíblicas sobre o povo sem liderança fiel, mas a tradução deve conservar a metáfora e sua amplitude teológica, deixando as referências intertextuais para a nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a sequência narrativa e a metáfora do original sem explicitação doutrinária. Não se incluiu a nota inglesa associada a “ao desembarcar”, pois seu conteúdo (“foi movido de compaixão”) corresponde a outro elemento do versículo e parece resultar de um marcador deslocado; a alternativa lexical já está registrada nas decisões.
