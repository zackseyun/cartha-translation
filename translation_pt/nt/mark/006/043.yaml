lexical_decisions:
- source_word: ἦραν
  choice: recolheram
  rationale: No contexto da refeição, o aoristo de αἴρω descreve a coleta das sobras; “recolheram” é natural e preserva a ação concreta.
- source_word: κλάσματα
  choice: pedaços
  rationale: κλάσματα designa pedaços quebrados, neste contexto principalmente do pão. “Pedaços” é claro e corrente; a nota registra a alternativa mais explícita.
- source_word: δώδεκα κοφίνων πληρώματα
  choice: doze cestos cheios
  rationale: A formulação comunica de modo natural tanto o número de recipientes quanto a quantidade que os enchia, sem reduzir πλήρωμα apenas ao recipiente.
- source_word: κόφινος
  choice: cesto
  rationale: “Cesto” é um equivalente português comum e não acrescenta uma especificação de tamanho ausente do versículo.
- source_word: πληρώματα
  choice: cheios
  rationale: Aqui o plural de πλήρωμα indica os conteúdos ou as quantidades que enchiam os cestos; integrado à expressão “cestos cheios”, produz português claro.
- source_word: ἀπὸ τῶν ἰχθύων
  choice: além do que sobrou dos peixes
  rationale: ἀπό indica que parte do material recolhido procedia também dos peixes. A formulação torna essa relação natural em português sem afirmar uma quantidade específica.
