  text: καὶ ὤμοσεν ⸀αὐτῇ· ⸂Ὅ τι⸃ ἐάν με αἰτήσῃς δώσω σοι ἕως ἡμίσους τῆς βασιλείας μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/023.yaml
  text: And he swore to her[a], “Whatever you ask me, I will give you[b], up to half of my kingdom.”
translation:
  language: pt
  text: 'E jurou a ela: “Tudo o que você me pedir, eu lhe darei, até a metade do meu reino”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Até a metade do meu reino” era uma fórmula régia convencional e hiperbólica, usada para expressar extrema generosidade.
    reason: cultural_note
lexical_decisions:
- source_word: ὤμοσεν
  choice: jurou
  rationale: O aoristo de ὀμνύω indica que ele fez um juramento. “Jurou” é direto, natural e preserva a solenidade da promessa.
- source_word: αὐτῇ
  choice: a ela
  rationale: O dativo feminino singular retoma a jovem do contexto e indica a pessoa a quem o juramento foi feito.
- source_word: Ὅ τι ἐάν
  choice: Tudo o que
  rationale: A expressão relativa com ἐάν introduz uma condição indefinida e abrangente. “Tudo o que” é idiomático em português e mantém o caráter aberto da oferta.
- source_word: με αἰτήσῃς
  choice: você me pedir
  rationale: Neste contexto, αἰτέω significa pedir algo a alguém. “Me pedir” é a formulação corrente e adequada ao discurso direto.
- source_word: δώσω σοι
  choice: eu lhe darei
  rationale: O futuro de δίδωμι expressa a promessa, e o pronome “lhe” representa o objeto indireto σοι sem precisar explicitar o objeto já indicado pela oração anterior.
- source_word: ἕως ἡμίσους
  choice: até a metade
  rationale: ἕως indica aqui limite ou extensão, não tempo. “Até a metade” comunica naturalmente o limite quantitativo da oferta.
- source_word: τῆς βασιλείας μου
  choice: do meu reino
  rationale: Embora βασιλεία possa significar reinado, domínio ou autoridade real, “reino” é o sentido concreto mais natural nesta fórmula régia.
theological_decisions:
- issue: Sentido de βασιλεία na fala de Herodes
  choice: reino
  alternative: reinado; domínio real
  rationale: A cena apresenta uma oferta régia exagerada, e “reino” preserva esse sentido narrativo sem atribuir ao termo um significado teológico técnico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O discurso direto mantém a força solene e exagerada do juramento sem expansão interpretativa.
