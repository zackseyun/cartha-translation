  text: And they went away in the boat to a desolate place by themselves[a][b].
translation:
  language: pt
  text: E foram no barco para um lugar deserto, a sós[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para um lugar isolado” ou “para um lugar desabitado”.
