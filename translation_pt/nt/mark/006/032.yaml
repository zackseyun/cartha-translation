lexical_decisions:
- source_word: ἀπῆλθον
  choice: foram
  rationale: O aoristo de ἀπέρχομαι indica que saíram do local anterior. Em português, “foram” expressa naturalmente esse deslocamento no contexto, sem a formalidade de “partiram”.
- source_word: ἐν τῷ πλοίῳ
  choice: no barco
  rationale: Reproduz de perto a expressão grega, literalmente “no barco”, e é natural no contexto narrativo.
- source_word: εἰς ἔρημον τόπον
  choice: para um lugar deserto
  rationale: ἔρημος descreve aqui um lugar desabitado ou isolado. “Lugar deserto” conserva essa amplitude sem exigir que se trate de um deserto geográfico.
- source_word: κατ’ ἰδίαν
  choice: a sós
  rationale: A expressão idiomática indica separação das outras pessoas ou privacidade. “A sós” é conciso, natural e compatível com o sujeito plural.
- source_word: καὶ
  choice: E
  rationale: Mantém a continuação narrativa simples e o estilo paratático característico de Marcos.
