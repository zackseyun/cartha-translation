source:
  edition: SBLGNT
  text: Καὶ συνάγονται οἱ ἀπόστολοι πρὸς τὸν Ἰησοῦν, καὶ ἀπήγγειλαν αὐτῷ ⸀πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/030.yaml
  text: And the apostles gathered to Jesus[a], and they reported to him all that they had done and taught.
translation:
  language: pt
  text: E os apóstolos se reuniram com Jesus e lhe contaram tudo o que tinham feito e tudo o que tinham ensinado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνάγονται
  choice: se reuniram
  rationale: O presente histórico grego é expresso naturalmente pelo pretérito perfeito na narrativa; a forma pronominal preserva a ideia de o grupo voltar a se reunir.
- source_word: οἱ ἀπόστολοι
  choice: os apóstolos
  rationale: É a designação reconhecida dos Doze em sua função de enviados, e não uma referência genérica a mensageiros.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: com Jesus
  rationale: Embora πρός com acusativo indique orientação ou movimento em direção a Jesus, em português 'se reuniram com Jesus' expressa de modo natural o encontro resultante sem alterar o sentido contextual.
- source_word: ἀπήγγειλαν αὐτῷ
  choice: lhe contaram
  rationale: No contexto do retorno da missão, o verbo descreve o relato feito a Jesus; 'lhe contaram' é atual e natural, mantendo a ideia de prestar contas do ocorrido.
- source_word: πάντα ὅσα ἐποίησαν
  choice: tudo o que tinham feito
  rationale: Preserva a abrangência de πάντα e apresenta as ações como anteriores ao relato.
- source_word: ὅσα ἐδίδαξαν
  choice: tudo o que tinham ensinado
  rationale: Mantém explicitamente a segunda oração relativa e seu paralelismo com o que haviam feito.
theological_decisions:
- issue: Designação narrativa dos discípulos como ἀπόστολοι
  choice: apóstolos
  alternative: mensageiros; enviados
  rationale: O termo identifica o grupo que retorna de sua missão com a designação ligada ao comissionamento; traduzi-lo genericamente enfraqueceria esse aspecto da narrativa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural. A repetição de 'tudo o que' conserva o paralelismo enfático das duas orações gregas.
