base_translation:
  language: en
  yaml_path: translation/nt/mark/006/053.yaml
  text: And after crossing over to the land[b][a], they came to Gennesaret and moored there.
translation:
  language: pt
  text: Depois de atravessarem, chegaram à terra, em Genesaré,[a] e ali atracaram.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chegaram à margem, em Genesaré”; o grego diz literalmente “chegaram à terra, a Genesaré”, referindo-se à chegada por barco.
    reason: lexical_alternative
  - marker: b
    text: Ou “ancoraram ali” ou “desembarcaram”; o verbo grego tem sentido náutico e indica que levaram o barco a um lugar de atracação.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Depois de
  rationale: O valor conectivo de καί é incorporado à abertura temporal natural em português, junto ao particípio aoristo, sem acrescentar uma nova relação lógica.
- source_word: διαπεράσαντες
  choice: Depois de atravessarem
  rationale: O particípio aoristo indica ação anterior à chegada; a construção preserva com naturalidade a sequência temporal.
- source_word: ἐπὶ τὴν γῆν ἦλθον εἰς Γεννησαρὲτ
  choice: chegaram à terra de Genesaré
  rationale: A formulação mantém γῆ como “terra”, em contexto de chegada por barco, e entende Genesaré como a região ou terra alcançada, sem reduzir o termo apenas a “praia”.
- source_word: Γεννησαρὲτ
  choice: Genesaré
  rationale: Forma tradicional e amplamente reconhecível em português para o topônimo.
- source_word: προσωρμίσθησαν
  choice: atracaram ali
  rationale: “Atracaram” conserva o sentido náutico específico de levar a embarcação a um ponto de parada; “ali” torna explícito em português o local já indicado pelo contexto.
