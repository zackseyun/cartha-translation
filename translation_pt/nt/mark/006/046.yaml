  text: καὶ ἀποταξάμενος αὐτοῖς ἀπῆλθεν εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/046.yaml
  text: And after saying goodbye to them[a], he went away to the mountain to pray.
translation:
  language: pt
  text: Depois de se despedir deles[a], ele foi ao monte para orar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de tomar licença deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποταξάμενος
  choice: depois de se despedir
  rationale: O particípio médio indica despedir-se ou tomar licença de alguém. “Despedir-se” é natural em português e se ajusta ao dativo αὐτοῖς, sem sugerir que Jesus formalmente os dispensou.
- source_word: αὐτοῖς
  choice: deles
  rationale: O pronome no dativo plural se refere às pessoas mencionadas no contexto e é expresso de modo idiomático na construção pronominal “despedir-se deles”.
- source_word: ἀπῆλθεν
  choice: foi
  rationale: O verbo indica que ele partiu daquele lugar. Após “se despedir deles”, o simples “foi” comunica naturalmente o deslocamento sem redundância.
- source_word: εἰς τὸ ὄρος
  choice: ao monte
  rationale: A expressão com artigo é preservada como “ao monte”. Em português bíblico contemporâneo, “monte” é uma forma corrente e digna para ὄρος, sem especificar além do texto se era uma montanha elevada ou região montanhosa.
- source_word: προσεύξασθαι
  choice: para orar
  rationale: O infinitivo aoristo expressa propósito; “para orar” transmite isso de forma direta.
- source_word: καὶ
  choice: E
  rationale: Mantém o conectivo narrativo simples do grego, sem acrescentar uma nuance temporal mais explícita.
theological_decisions:
- issue: Referência de τὸ ὄρος (“o monte”)
  choice: Traduzir como “ao monte”, sem atribuir significado simbólico ou teológico.
  alternative: Traduzir de modo indefinido como “a um monte” ou interpretar o lugar como cenário de revelação especial.
  rationale: O grego emprega o artigo definido e não explica qualquer simbolismo. A tradução preserva o detalhe narrativo concreto sem importar associações teológicas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Despedir-se” é idiomático; “ao monte” preserva o artigo grego e o uso bíblico corrente sem soar excessivamente arcaico.
