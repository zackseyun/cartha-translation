  text: Καὶ ἤδη ὥρας πολλῆς γενομένης προσελθόντες αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ἔλεγον ὅτι Ἔρημός ἐστιν ὁ τόπος, καὶ ἤδη ὥρα πολλή·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/035.yaml
  text: And when it was already very late[a], his disciples came to him and were saying, “This place is deserted[b], and it is already very late.”
translation:
  language: pt
  text: 'Quando já era muito tarde, seus discípulos se aproximaram dele e diziam: “Este lugar é deserto, e já está muito tarde.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη
  choice: já
  rationale: Indica que o tempo havia avançado; “já” é a forma mais direta e natural em ambas as ocorrências.
- source_word: ὥρας πολλῆς γενομένης
  choice: quando já estava ficando muito tarde
  rationale: O genitivo absoluto indica que o dia havia chegado a uma hora avançada. A formulação portuguesa é idiomática e conserva o aspecto progressivo sugerido pelo particípio aoristo em construção temporal, sem reproduzir literalmente o idioma grego.
- source_word: προσελθόντες αὐτῷ
  choice: se aproximaram dele
  rationale: Expressa com naturalidade o movimento dos discípulos em direção a Jesus e mantém a relação temporal com o verbo principal.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seus discípulos
  rationale: Construção possessiva normal e clara em português.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito preserva a apresentação da fala como ação em curso, sem afirmar necessariamente repetição insistente.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: Este lugar é deserto
  rationale: ἔρημος descreve aqui um lugar isolado ou sem habitantes. “Deserto” preserva a concisão e não exige que o local seja um deserto árido.
- source_word: καὶ ἤδη ὥρα πολλή
  choice: e já está muito tarde
  rationale: Formulação portuguesa corrente para uma hora avançada, refletindo a força de πολλή no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa natural. A repetição de “já” e “muito tarde” foi mantida porque corresponde à repetição enfática do grego. Não foram incluídas notas, pois as alternativas são estilísticas e não alteram materialmente o sentido.
