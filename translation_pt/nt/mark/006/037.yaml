  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Δότε αὐτοῖς ὑμεῖς φαγεῖν. καὶ λέγουσιν αὐτῷ· Ἀπελθόντες ἀγοράσωμεν δηναρίων διακοσίων ἄρτους καὶ ⸀δώσομεν αὐτοῖς φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/037.yaml
  text: But he answered and said to them[a], “You yourselves give them something to eat.” And they said to him[b], “Should we go and buy bread for two hundred denarii and give it to them to eat?”
translation:
  language: pt
  text: 'Ele, porém, lhes respondeu: “Deem vocês mesmos algo para eles comerem.” Eles lhe disseram: “Devemos ir comprar pão[a] por duzentos denários[b] e dar a eles para comer?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pães”. A palavra grega ἄρτους pode significar “pão” ou “pães”.
    reason: lexical_alternative
  - marker: b
    text: Um denário correspondia normalmente ao pagamento de um dia de trabalho de um trabalhador ou soldado.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: respondeu
  rationale: Em português, “respondeu” expressa naturalmente a fórmula narrativa grega sem a redundância pouco idiomática de “respondendo, disse”.
- source_word: Δότε
  choice: Deem
  rationale: Preserva o imperativo direto de δίδωμι.
- source_word: ὑμεῖς
  choice: vocês mesmos
  rationale: O pronome explícito é enfático; “vocês mesmos” mantém essa ênfase em português corrente.
- source_word: φαγεῖν
  choice: algo para eles comerem
  rationale: Reproduz de modo natural a construção “dar ... para comer”, sem reduzi-la ao verbo mais interpretativo “alimentar”.
- source_word: Ἀπελθόντες ἀγοράσωμεν
  choice: Devemos ir comprar
  rationale: A pergunta com subjuntivo deliberativo é comunicada com clareza por “devemos”; o particípio subordinado é traduzido naturalmente por “ir comprar”.
- source_word: δηναρίων διακοσίων
  choice: por duzentos denários
  rationale: A construção genitiva indica preço; “por” é a forma portuguesa direta e idiomática.
- source_word: ἄρτους
  choice: pão
  rationale: Ἄρτος pode designar pão em sentido coletivo ou pães individuais. “Pão” é natural no contexto de uma compra, e a alternativa é preservada em nota.
- source_word: καὶ δώσομεν αὐτοῖς φαγεῖν
  choice: e dar a eles para comer
  rationale: Mantém o paralelo verbal com a ordem de Jesus e inclui a segunda ação no alcance natural da pergunta deliberativa.
