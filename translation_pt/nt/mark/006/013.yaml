source:
  edition: SBLGNT
  text: καὶ δαιμόνια πολλὰ ἐξέβαλλον, καὶ ἤλειφον ἐλαίῳ πολλοὺς ἀρρώστους καὶ ἐθεράπευον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/013.yaml
  text: And they were casting out many demons[a], and were anointing many sick people with oil and healing them.
translation:
  language: pt
  text: E expulsavam muitos demônios, ungiam com óleo muitos doentes e os curavam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δαιμόνια
  choice: demônios
  rationale: Equivalente direto e natural de δαιμόνια; evita importar a expressão distinta “espíritos impuros” de outros contextos.
- source_word: πολλὰ
  choice: muitos
  rationale: Preserva de modo simples o sentido quantitativo do adjetivo que modifica “demônios”.
- source_word: ἐξέβαλλον
  choice: expulsavam
  rationale: O pretérito imperfeito expressa ação repetida ou contínua neste resumo narrativo; “expulsavam” é idiomático em contextos de exorcismo.
- source_word: ἤλειφον
  choice: ungiam
  rationale: Traduz a aplicação de óleo e preserva o aspecto repetido do imperfeito, com formulação natural no contexto.
- source_word: ἐλαίῳ
  choice: com óleo
  rationale: ἔλαιον designa óleo, normalmente de oliva no contexto mediterrâneo antigo; “óleo” basta no texto sem explicitação desnecessária.
- source_word: πολλοὺς ἀρρώστους
  choice: muitos doentes
  rationale: Reproduz de modo conciso e natural o adjetivo substantivado e sua quantificação.
- source_word: ἐθεράπευον
  choice: os curavam
  rationale: “Curavam” comunica θεραπεύω e mantém o aspecto contínuo ou repetido do imperfeito; o pronome retoma claramente os doentes.
- source_word: καὶ
  choice: e
  rationale: Mantém a coordenação simples e o estilo paratático da frase grega.
theological_decisions:
- issue: Função da unção com óleo em relação à cura
  choice: Relatar descritivamente que os discípulos ungiam com óleo e curavam, sem definir o mecanismo teológico.
  alternative: Afirmar que o óleo efetuava a cura, ou que a unção era puramente simbólica e sem qualquer papel.
  rationale: O versículo associa narrativamente a unção e a cura, mas não explica a eficácia do óleo nem formula uma doutrina sacramental. A redação preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os três verbos no pretérito imperfeito refletem as ações reiteradas do resumo narrativo. Não foi incluída nota sobre “óleo de oliva”, pois a alternativa lexical pertence a ἐλαίῳ, não a δαιμόνια, e “óleo” traduz adequadamente o texto sem exigir esclarecimento.
