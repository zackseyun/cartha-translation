source:
  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτοῖς ὁ Ἰησοῦς ὅτι Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ πατρίδι αὐτοῦ καὶ ἐν τοῖς ⸂συγγενεῦσιν αὐτοῦ⸃ καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/004.yaml
  text: And Jesus was saying to them[c][b][a], “A prophet is not without honor except in his hometown and among his relatives and in his household.”
translation:
  language: pt
  text: 'E Jesus lhes dizia: “Um profeta só fica sem honra em sua terra natal[a], entre os seus parentes[b] e em sua casa[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lugar de origem” ou “terra de origem”. O grego πατρίς se refere ao lugar de onde alguém é; neste contexto, trata-se de Nazaré.
    reason: lexical_alternative
  - marker: b
    text: Ou “os de sua parentela”. O termo grego designa parentes ou membros do mesmo grupo familiar.
    reason: lexical_alternative
  - marker: c
    text: Ou “entre os de sua casa”. O grego pode se referir à casa física ou às pessoas que formam o lar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito grego apresenta a fala em curso no quadro narrativo; “dizia” conserva esse aspecto com naturalidade em português.
- source_word: προφήτης
  choice: profeta
  rationale: Equivalente corrente e preciso para προφήτης.
- source_word: οὐκ ἔστιν ... ἄτιμος εἰ μὴ
  choice: só fica sem honra em
  rationale: Esta formulação portuguesa expressa de modo natural a construção proverbial de negação seguida de exceção, preservando o contraste de honra e desonra.
- source_word: πατρίδι
  choice: terra natal
  rationale: πατρίς designa o lugar de origem da pessoa; “terra natal” mantém a amplitude lexical sem sugerir necessariamente uma nação inteira.
- source_word: συγγενεῦσιν
  choice: parentes
  rationale: O termo se refere aos membros do mesmo grupo de parentesco; “parentes” é claro e atual.
- source_word: οἰκίᾳ
  choice: própria casa
  rationale: οἰκία pode indicar tanto a casa quanto as pessoas que a compõem. “Casa” preserva essa ambiguidade melhor que uma explicitação exclusiva como “família” ou “lar doméstico”.
- source_word: καὶ ... καὶ ... καὶ
  choice: e ... entre ... e
  rationale: A enumeração cumulativa é preservada em português, com ajuste idiomático das preposições exigidas pelos complementos.
theological_decisions:
- issue: Alcance do provérbio de Jesus sobre a honra de um profeta
  choice: Traduzir como um provérbio geral aplicado por Jesus a si mesmo no contexto, sem explicitar além do texto sua identidade messiânica ou a natureza da rejeição.
  alternative: Parafrasear como declaração explícita de que Jesus é o Messias rejeitado ou como ensino geral sobre incredulidade.
  rationale: O grego apresenta um dito proverbial sobre um profeta. O contexto o aplica a Jesus, mas a tradução não deve acrescentar uma conclusão doutrinária que o versículo não formula.
- issue: Sentido de οἰκία
  choice: Manter “casa”, que pode evocar tanto o espaço doméstico quanto os que pertencem a ele.
  alternative: Resolver o termo exclusivamente como “família”, “lar” ou “os de sua casa”.
  rationale: A palavra grega admite referente físico e coletivo. Preservar essa abertura evita eliminar uma ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Terra natal” é mais amplamente natural que “cidade natal” e não restringe πατρίς à categoria administrativa de cidade. A construção “só fica sem honra” evita o pouco idiomático duplo negativo “não fica sem honra, exceto”, mantendo a força proverbial.
