  text: καὶ ἐξελθόντων αὐτῶν ἐκ τοῦ πλοίου ⸀εὐθὺς ἐπιγνόντες αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/054.yaml
  text: And when they got out of the boat[a], immediately they recognized him.
translation:
  language: pt
  text: Quando eles saíram do barco, as pessoas imediatamente o reconheceram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais próximo à construção grega: “Tendo eles saído do barco, [sujeito não expresso] o reconheceu imediatamente”. O particípio grego traduzido por “reconheceu” não nomeia o seu sujeito; o contexto indica as pessoas daquele lugar.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξελθόντων αὐτῶν
  choice: quando eles saíram
  rationale: O genitivo absoluto é expresso naturalmente por uma oração temporal; «saíram» preserva o sentido contextual de deixar o barco.
- source_word: πλοίου
  choice: barco
  rationale: No contexto do mar da Galileia, πλοῖον designa naturalmente uma embarcação, e «barco» é a forma moderna mais adequada.
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Mantém a força do advérbio e a recorrente ênfase narrativa de Marcos na prontidão dos acontecimentos.
- source_word: ἐπιγνόντες
  choice: reconheceram
  rationale: Aqui ἐπιγινώσκω indica identificar Jesus ao vê-lo; «reconheceram» é o equivalente português mais claro.
- source_word: αὐτόν
  choice: o
  rationale: O pronome retoma Jesus no contexto e é expresso naturalmente pelo objeto direto «o».
- source_word: sujeito implícito de ἐπιγνόντες
  choice: as pessoas
  rationale: O particípio nominativo plural não pode retomar diretamente o αὐτῶν genitivo da oração absoluta; o contexto seguinte aponta para os habitantes do lugar. A explicitação evita que o português atribua o reconhecimento a Jesus e aos discípulos.
theological_decisions:
- issue: Identificação de quem reconheceu Jesus
  choice: as pessoas imediatamente o reconheceram
  alternative: imediatamente o reconheceram, deixando o sujeito sem identificação lexical explícita
  rationale: A questão é sintática e contextual, não doutrinária. O texto grego deixa o sujeito do particípio implícito, enquanto o versículo seguinte mostra que são pessoas da região que reconhecem Jesus e percorrem os arredores. A tradução explicita esse referente sem acrescentar conteúdo teológico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para manter naturalidade e evitar ambiguidade quanto ao sujeito, preservando em nota a construção mais literal e a indeterminação formal do grego.
