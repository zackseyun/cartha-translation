source:
  edition: SBLGNT
  text: καὶ ὅπου ἂν εἰσεπορεύετο εἰς κώμας ἢ ⸂εἰς πόλεις ἢ εἰς⸃ ἀγροὺς ἐν ταῖς ἀγοραῖς ⸀ἐτίθεσαν τοὺς ἀσθενοῦντας, καὶ παρεκάλουν αὐτὸν ἵνα κἂν τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ ἅψωνται· καὶ ὅσοι ἂν ⸀ἥψαντο αὐτοῦ ἐσῴζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/056.yaml
  text: And wherever he entered villages or cities or countryside[a], they were laying the sick in the marketplaces and begged him that they might even touch the fringe of his garment[c][b]; and as many as touched it were being healed.
translation:
  language: pt
  text: E, onde quer que ele entrasse — em povoados, cidades ou zonas rurais —, colocavam os doentes nas praças e lhe suplicavam que pudessem ao menos tocar na franja de sua roupa[a]. E todos os que tocavam nele[b] ficavam curados.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na borda”, “na bainha” ou “no pendão de sua roupa”. O termo grego pode designar a extremidade de uma veste e, no contexto judaico, pode evocar seus pendões ou franjas.
    reason: lexical_alternative
  - marker: b
    text: O grego diz literalmente “tocavam nele”; pelo contexto, isso inclui tocar na franja de sua roupa.
    reason: referent_ambiguity
  - marker: c
    text: Literalmente, “eram salvos”. Neste contexto, o verbo grego refere-se a serem curados ou restabelecidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἂν εἰσεπορεύετο
  choice: onde quer que ele entrasse
  rationale: A construção generalizante com ἄν e o imperfeito descreve o que acontecia repetidamente em qualquer lugar aonde Jesus entrava. O imperfeito do subjuntivo em português exprime isso com naturalidade.
- source_word: κώμας ἢ εἰς πόλεις ἢ εἰς ἀγρούς
  choice: em povoados, cidades ou zonas rurais
  rationale: κώμαι designa povoados ou aldeias, πόλεις cidades, e ἀγροί, nesta enumeração, áreas rurais ou campo, não necessariamente propriedades agrícolas individuais.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: nas praças
  rationale: ἀγορά era a praça pública, normalmente também usada como mercado. 'Praças' comunica melhor o local público onde os doentes eram colocados, sem sugerir apenas estabelecimentos comerciais modernos.
- source_word: ἐτίθεσαν τοὺς ἀσθενοῦντας
  choice: colocavam os doentes
  rationale: O imperfeito indica ação habitual e repetida; 'colocavam' preserva esse aspecto de modo natural.
- source_word: παρεκάλουν αὐτόν
  choice: lhe suplicavam
  rationale: Neste contexto, παρακαλέω expressa um pedido insistente e urgente. 'Suplicavam' mantém a intensidade em registro digno e corrente.
- source_word: ἵνα κἂν ... ἅψωνται
  choice: que os deixasse ao menos tocar
  rationale: A construção apresenta o toque como o mínimo solicitado. 'Ao menos' expressa claramente esse valor de κἄν; 'os deixasse' torna idiomático em português o pedido dirigido a Jesus sem alterar seu conteúdo.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: na franja de sua roupa
  rationale: κράσπεδον pode designar a borda, a bainha ou a franja, inclusive possivelmente o pendão ritual da veste judaica. 'Franja' preserva essa abertura sem especificar demais.
- source_word: ὅσοι ἂν ἥψαντο αὐτοῦ
  choice: todos os que tocavam nele
  rationale: O grego traz αὐτοῦ, referente masculino a Jesus, e não um pronome neutro referente à roupa. 'Nele' segue diretamente a forma do texto, enquanto o contexto indica que esse toque podia ocorrer pela franja de sua roupa.
- source_word: ἐσῴζοντο
  choice: ficavam curados
  rationale: Embora σῴζω também possa significar 'salvar', o contexto imediato é a cura física dos doentes. 'Ficavam curados' comunica o resultado habitual e preserva o aspecto do imperfeito.
theological_decisions:
- issue: Sentido de ἐσῴζοντο (σῴζω)
  choice: ficavam curados
  alternative: eram salvos / ficavam bem
  rationale: O campo semântico do verbo inclui salvação, libertação e cura. Como os referentes são explicitamente os doentes, a cura física é o sentido contextual mais direto; uma nota preserva a formulação literal e sua amplitude.
- issue: Objeto do toque em ἥψαντο αὐτοῦ
  choice: tocavam nele
  alternative: tocavam nela, isto é, na franja ou roupa
  rationale: O pronome grego refere-se gramaticalmente a Jesus. Mantê-lo evita substituir silenciosamente o objeto explícito, enquanto a frase anterior deixa claro que o toque pretendido era na franja da roupa.
- issue: Natureza da franja da roupa
  choice: franja
  alternative: bainha / borda / pendão da roupa
  rationale: O termo pode evocar os pendões prescritos para vestes judaicas, mas o versículo não explicita essa identificação. A tradução não impõe essa interpretação, e a nota registra as possibilidades.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A construção com travessões organiza a enumeração sem perder seu caráter distributivo. Os imperfeitos 'colocavam', 'suplicavam', 'tocavam' e 'ficavam' preservam o caráter habitual da síntese narrativa. As notas mantêm as ambiguidades lexicais de κράσπεδον e σῴζω e a referência gramatical de αὐτοῦ.
