base_translation:
  language: en
  yaml_path: translation/nt/mark/006/021.yaml
  text: And when an opportune day came[a], Herod gave a banquet on his birthday for his nobles and military commanders and the leading men of Galilee[d][c][b],
translation:
  language: pt
  text: E, quando chegou um dia oportuno[a], Herodes ofereceu, no seu aniversário, um banquete[b] aos seus nobres, aos comandantes militares e aos homens de maior destaque da Galileia[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um dia conveniente” ou “um dia favorável”. O grego indica uma ocasião adequada ou estratégica.
    reason: lexical_alternative
  - marker: b
    text: Ou “ofereceu um jantar festivo”. Literalmente, o grego diz “fez um jantar”.
    reason: lexical_alternative
  - marker: c
    text: Ou “aos principais homens da Galileia”. A expressão se refere aos homens proeminentes da região.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Mantém o conectivo narrativo característico do estilo paratático de Marcos.
- source_word: γενομένης ἡμέρας εὐκαίρου
  choice: quando chegou um dia oportuno
  rationale: A construção absoluta introduz a circunstância, e εὔκαιρος indica uma ocasião adequada ou estratégica; “dia oportuno” preserva o tom narrativo ameaçador.
- source_word: ὅτε
  choice: expresso pela oração principal que identifica a ocasião
  rationale: A conjunção temporal especifica em que consistiu o “dia oportuno”. Em português, repetir “quando” seria pesado; a relação temporal permanece clara na estrutura da frase.
- source_word: τοῖς γενεσίοις αὐτοῦ
  choice: no seu aniversário
  rationale: γενέσια refere-se à celebração do aniversário; esta é a formulação portuguesa mais direta e natural.
- source_word: δεῖπνον ἐποίησεν
  choice: ofereceu ... um banquete
  rationale: O idiomatismo significa literalmente “fez uma refeição”, mas descreve uma festa formal oferecida por Herodes, como confirma a lista de convidados.
- source_word: τοῖς μεγιστᾶσιν αὐτοῦ
  choice: aos seus nobres
  rationale: μεγιστᾶνες designa pessoas de alta posição ligadas ao governante; “nobres” comunica de modo conciso esse estatuto de elite.
- source_word: τοῖς χιλιάρχοις
  choice: aos comandantes militares
  rationale: O termo designa oficiais militares superiores. A tradução funcional evita impor o título técnico romano “tribunos” ao contexto herodiano.
- source_word: τοῖς πρώτοις τῆς Γαλιλαίας
  choice: aos homens de maior destaque da Galileia
  rationale: πρῶτοι refere-se aos homens proeminentes ou de primeira posição na região; a formulação preserva tanto o estatuto quanto a referência masculina.
- source_word: Ἡρῴδης
  choice: Herodes
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
