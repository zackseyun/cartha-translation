  text: καὶ ἀνέβη πρὸς αὐτοὺς εἰς τὸ πλοῖον, καὶ ἐκόπασεν ὁ ἄνεμος. καὶ λίαν ⸂ἐκ περισσοῦ⸃ ἐν ἑαυτοῖς ⸀ἐξίσταντο,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/051.yaml
  text: And he got into the boat with them[a], and the wind stopped. And they were utterly astonished within themselves[b],
translation:
  language: pt
  text: E ele entrou no barco com eles, e o vento cessou. Então, no íntimo, eles ficaram espantados além de toda medida[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficaram fora de si de espanto”. O grego acumula expressões de intensidade: literalmente, “muitíssimo, além da medida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη πρὸς αὐτοὺς εἰς τὸ πλοῖον
  choice: entrou no barco com eles
  rationale: Embora ἀνέβη signifique literalmente “subiu”, neste contexto descreve a entrada no barco. “Com eles” comunica de modo natural a proximidade expressa por πρὸς αὐτούς.
- source_word: ἐκόπασεν ὁ ἄνεμος
  choice: o vento cessou
  rationale: κοπάζω descreve o vento que para ou perde sua força. “Cessou” é claro, conciso e mantém um registro digno.
- source_word: λίαν ἐκ περισσοῦ
  choice: além de toda medida
  rationale: A expressão acumula intensificadores e indica uma reação extraordinariamente forte. Esta formulação conserva a ênfase incomum do grego sem reduzi-la a um simples “muito”.
- source_word: ἐν ἑαυτοῖς
  choice: no íntimo
  rationale: Expressa que a reação ocorreu interiormente. “No íntimo” é natural em português e preserva o valor reflexivo sem soar mecânico.
- source_word: ἐξίσταντο
  choice: ficaram espantados
  rationale: O verbo pode indicar espanto intenso, chegando à ideia de ficar fora de si. “Ficaram espantados” é claro no texto principal, enquanto a força da alternativa é registrada em nota.
theological_decisions:
- issue: Intensidade da reação dos discípulos diante da autoridade de Jesus sobre o vento
  choice: eles ficaram espantados além de toda medida
  alternative: eles ficaram fora de si de espanto
  rationale: A redação mantém a reação avassaladora descrita pelo grego sem acrescentar uma explicação teológica que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para fluidez, preservando a interioridade e a intensidade excepcional da reação.
