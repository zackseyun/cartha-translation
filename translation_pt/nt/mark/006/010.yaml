  yaml_path: translation/nt/mark/006/010.yaml
  text: And he was saying to them[a], “Wherever you enter a house, stay there until you leave that place.”
translation:
  language: pt
  text: 'E dizia-lhes: “Onde quer que entrem numa casa, fiquem ali até saírem daquele lugar.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até saírem de lá”. Mais literalmente, o grego diz “até que saiam de lá”; no contexto, a expressão provavelmente se refere à saída daquela localidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν αὐτοῖς
  choice: E dizia-lhes
  rationale: O imperfeito ἔλεγεν conserva o aspecto durativo ou reiterado da fala no contexto narrativo; “dizia-lhes” é natural, conciso e digno em português.
- source_word: Ὅπου ἐὰν
  choice: Onde quer que
  rationale: A combinação expressa uma referência indefinida e corresponde naturalmente a “onde quer que”.
- source_word: εἰσέλθητε εἰς οἰκίαν
  choice: entrem numa casa
  rationale: “Entrar numa casa” comunica de modo idiomático o movimento para dentro indicado por εἰς, sem a rigidez de uma reprodução palavra por palavra.
- source_word: οἰκίαν
  choice: casa
  rationale: Neste contexto, οἰκία designa primariamente a casa em que os discípulos ficariam hospedados; “casa” evita interpretar o termo como “lar” ou “família”.
- source_word: ἐκεῖ μένετε
  choice: fiquem ali
  rationale: O imperativo presente μένετε instrui os discípulos a permanecer naquele alojamento; “fiquem ali” é claro e corrente.
- source_word: ἕως ἂν ἐξέλθητε ἐκεῖθεν
  choice: até saírem daquele lugar
  rationale: A formulação comunica a leitura contextual de que devem permanecer na mesma casa até partirem da localidade, ao mesmo tempo que a nota registra a expressão grega mais literal e sua possível amplitude.
theological_decisions:
- issue: Alcance de ἐκεῖθεν na cláusula de partida
  choice: A permanência na mesma casa dura até os discípulos saírem daquela localidade.
  alternative: A permanência dura até eles saírem da casa; ou, mais literalmente, “até saírem de lá”.
  rationale: No contexto das instruções missionárias, a frase provavelmente proíbe a mudança de uma hospedagem para outra enquanto os discípulos estiverem no mesmo lugar. Como ἐκεῖθεν pode ser entendido de forma menos específica, a alternativa mais literal é preservada em nota, sem eliminar a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação pronominal em “dizia-lhes” preserva um tom bíblico moderado sem soar arcaica; “numa casa” e “fiquem ali” mantêm a instrução natural e acessível.
