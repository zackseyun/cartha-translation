source:
  edition: SBLGNT
  text: ὁ γὰρ Ἡρῴδης ἐφοβεῖτο τὸν Ἰωάννην, εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον, καὶ συνετήρει αὐτόν, καὶ ἀκούσας αὐτοῦ πολλὰ ⸀ἠπόρει, καὶ ἡδέως αὐτοῦ ἤκουεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/020.yaml
  text: For Herod feared John[a], knowing that he was a righteous and holy man, and he kept him safe. And when he heard him, he was greatly perplexed, and yet he listened to him gladly.
translation:
  language: pt
  text: Pois Herodes temia João, sabendo que ele era um homem justo e santo, e o mantinha protegido. Quando o ouvia, ficava muito perplexo[a], mas o escutava com prazer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “fazia muitas coisas” em vez de “ficava muito perplexo”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐφοβεῖτο
  choice: temia
  rationale: Preserva a força direta do imperfeito, indicando uma atitude contínua de temor diante de João, sem reduzi-la apenas a respeito.
- source_word: εἰδὼς
  choice: sabendo
  rationale: Mantém a forma participial e permite perceber naturalmente seu valor causal em relação ao temor e à proteção de João.
- source_word: ἄνδρα δίκαιον καὶ ἅγιον
  choice: um homem justo e santo
  rationale: Traduz de modo direto tanto a retidão moral expressa por δίκαιον quanto o caráter santo expresso por ἅγιον.
- source_word: συνετήρει αὐτόν
  choice: o mantinha protegido
  rationale: Comunica o sentido contextual de preservar João de dano, evitando a ambiguidade excessiva de uma tradução como 'o guardava'.
- source_word: ἀκούσας αὐτοῦ
  choice: Quando o ouvia
  rationale: Expressa de modo natural em português o ato recorrente de Herodes ouvir João, em harmonia com o aspecto do verbo principal seguinte.
- source_word: πολλὰ ἠπόρει
  choice: ficava muito perplexo
  rationale: Segue o texto crítico SBLGNT; πολλὰ intensifica a perplexidade indicada por ἠπόρει.
- source_word: ἡδέως αὐτοῦ ἤκουεν
  choice: mas o escutava com prazer
  rationale: Transmite o prazer ou a disposição favorável de Herodes ao ouvir João; 'mas' torna natural em português o contraste implícito com sua perplexidade.
theological_decisions:
- issue: Variante textual na reação de Herodes ao ouvir João
  choice: ficava muito perplexo (ἠπόρει)
  alternative: fazia muitas coisas (ἐποίει)
  rationale: Segue-se a leitura do SBLGNT, que preserva a tensão entre a profunda perplexidade de Herodes e seu prazer em ouvir João. A variante, por alterar significativamente o sentido, é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva a tensão narrativa entre temor, proteção, perplexidade e prazer em ouvir João.
