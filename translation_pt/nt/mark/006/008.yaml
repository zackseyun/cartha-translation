  yaml_path: translation/nt/mark/006/008.yaml
  text: And he instructed them to take nothing for the journey except a staff only—no bread[a], no bag[b], no copper in their belt—
translation:
  language: pt
  text: 'E ele lhes ordenou que não levassem nada para a viagem, a não ser um bastão apenas: nem pão, nem bolsa[a], nem cobre[b] no cinto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, uma bolsa de viagem para provisões.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “cobre”; isto é, moedas de cobre ou dinheiro levado no cinto.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλεν
  choice: ordenou
  rationale: O verbo expressa uma instrução com autoridade. “Ordenou” preserva essa força e é natural em português.
- source_word: μηδὲν αἴρωσιν
  choice: não levassem nada
  rationale: No contexto de preparativos para a viagem, αἴρω tem o sentido de levar ou carregar; a formulação é idiomática e precisa.
- source_word: εἰς ὁδὸν
  choice: para a viagem
  rationale: Expressa naturalmente a finalidade dos itens que poderiam ser levados.
- source_word: εἰ μὴ ῥάβδον μόνον
  choice: a não ser somente um bordão
  rationale: “Bordão” designa o bastão usado pelo viajante, e “somente” preserva a ênfase de μόνον.
- source_word: ἄρτον
  choice: pão
  rationale: Mantém o substantivo concreto do grego, sem generalizá-lo como alimento.
- source_word: πήραν
  choice: bolsa
  rationale: Refere-se a uma bolsa de viagem, especialmente para carregar provisões; “bolsa” é clara e corrente, com o sentido específico indicado em nota.
- source_word: ζώνην
  choice: cinto
  rationale: Designa a faixa ou o cinto em que se podia guardar dinheiro.
- source_word: χαλκόν
  choice: cobre
  rationale: Preserva o sentido literal do metal, usado por extensão para moedas de cobre; a nota esclarece o valor monetário.
