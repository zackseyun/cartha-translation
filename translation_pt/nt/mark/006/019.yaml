base_translation:
  language: en
  yaml_path: translation/nt/mark/006/019.yaml
  text: But Herodias held a grudge against him and wanted to kill him[a], but she could not.
translation:
  language: pt
  text: Mas Herodias guardava rancor contra ele e queria matá-lo[a], porém não conseguia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alimentava ressentimento contra ele” ou “tinha algo contra ele”. A expressão grega indica hostilidade contínua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste com a afirmação anterior e introduz a hostilidade de Herodias.
- source_word: Ἡρῳδιὰς
  choice: Herodias
  rationale: Segue a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἐνεῖχεν αὐτῷ
  choice: guardava rancor contra ele
  rationale: Expressa a hostilidade ressentida e contínua da construção idiomática, preservando o valor durativo do imperfeito.
- source_word: ἤθελεν
  choice: queria
  rationale: Tradução direta e natural do imperfeito de θέλω, que indica seu desejo ou intenção persistente.
- source_word: αὐτὸν ἀποκτεῖναι
  choice: matá-lo
  rationale: Representa de modo direto o sentido de ἀποκτείνω sem acrescentar uma qualificação jurídica ou moral não explícita.
- source_word: καὶ οὐκ ἠδύνατο
  choice: porém não conseguia
  rationale: O καί assume força adversativa no contexto; o imperfeito é expresso naturalmente por 'não conseguia', indicando incapacidade continuada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. 'Guardava rancor' comunica de modo idiomático a hostilidade duradoura sem recorrer a expressão excessivamente coloquial.
