base_translation:
  language: en
  yaml_path: translation/nt/mark/006/027.yaml
  text: And immediately the king sent an executioner and ordered him to bring his head[a]. And he went and beheaded him in the prison.
translation:
  language: pt
  text: E imediatamente o rei enviou um carrasco[a] e ordenou que trouxesse a cabeça de João. Ele foi e decapitou João na prisão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um guarda” ou “um membro da guarda pessoal”; o grego emprega um termo tomado do latim (spekoulátōr) para um integrante da guarda do governante, que aqui atua como carrasco.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Expressa com naturalidade a prontidão característica da narrativa de Marcos.
- source_word: βασιλεὺς
  choice: o rei
  rationale: Preserva a designação narrativa de Marcos, embora Herodes Antipas fosse tecnicamente tetrarca.
- source_word: σπεκουλάτορα
  choice: executor
  rationale: O empréstimo latino designa um membro da guarda do governante que, neste contexto, exerce a função de executar a sentença; a nota preserva as alternativas mais literais.
- source_word: ἐπέταξεν ἐνέγκαι
  choice: ordenou que trouxesse
  rationale: Reproduz de modo natural em português a força da ordem seguida de infinitivo.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: a cabeça de João
  rationale: Explicita o referente de αὐτοῦ para evitar que, em português, o possessivo seja entendido como referente ao executor.
- source_word: ἀπεκεφάλισεν αὐτὸν
  choice: decapitou João
  rationale: Expressa com clareza a ação e torna explícito o referente do pronome, sem alterar o sentido.
- source_word: ἐν τῇ φυλακῇ
  choice: na prisão
  rationale: Mantém o local concreto indicado pelo grego e soa natural em português.
