  text: καὶ ἀνέπεσαν πρασιαὶ πρασιαὶ ⸀κατὰ ἑκατὸν καὶ ⸁κατὰ πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/040.yaml
  text: And they reclined in groups of hundreds and of fifties[a].
translation:
  language: pt
  text: E eles se acomodaram em grupos de cem e de cinquenta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “canteiros, canteiros”, imagem que sugere fileiras ou seções organizadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπεσαν
  choice: se acomodaram
  rationale: No contexto de uma refeição, o verbo indica tomar lugar, normalmente reclinando-se. “Se acomodaram” comunica de modo natural em português o ato de tomar lugar para comer, sem sugerir necessariamente cadeiras.
- source_word: πρασιαὶ πρασιαὶ
  choice: em grupos
  rationale: A repetição do substantivo πρασιά, literalmente usado para canteiros de jardim, descreve aqui grupos dispostos de maneira ordenada. “Em grupos” transmite claramente o sentido contextual; a imagem concreta é preservada em nota.
- source_word: κατὰ ἑκατὸν
  choice: de cem
  rationale: κατά com o numeral tem força distributiva, indicando grupos compostos de cem pessoas.
- source_word: κατὰ πεντήκοντα
  choice: de cinquenta
  rationale: Em paralelo com a expressão anterior, κατά marca distribuição em grupos de cinquenta.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A formulação mantém o paralelismo numérico e registra em nota a metáfora agrícola incomum do grego.
