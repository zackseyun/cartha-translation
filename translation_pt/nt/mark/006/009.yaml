lexical_decisions:
- source_word: ἀλλὰ
  choice: mas
  rationale: Marca o contraste com as instruções de viagem anteriores de modo natural e conciso.
- source_word: ὑποδεδεμένους
  choice: fossem calçados com
  rationale: O particípio perfeito descreve o estado resultante de estar com os pés calçados; esta formulação também mantém o paralelismo verbal da instrução indireta no contexto.
- source_word: σανδάλια
  choice: sandálias
  rationale: Equivalente direto, corrente e historicamente adequado para o calçado mencionado.
- source_word: μὴ ἐνδύσησθε
  choice: não vestissem
  rationale: A proibição com aoristo médio refere-se a vestir-se; em português, «não vestissem» é natural no discurso indireto e pode expressar a ação sem introduzir uma interpretação adicional.
- source_word: δύο
  choice: duas
  rationale: Mantém diretamente o numeral, com concordância de gênero em português.
- source_word: χιτῶνας
  choice: túnicas
  rationale: Designa com precisão a peça básica de roupa usada junto ao corpo, evitando o anacronismo de «camisas» e a generalidade de «roupas».
