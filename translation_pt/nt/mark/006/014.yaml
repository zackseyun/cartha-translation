  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἤκουσεν ὁ βασιλεὺς Ἡρῴδης, φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ, καὶ ⸀ἔλεγον ὅτι Ἰωάννης ὁ βαπτίζων ⸂ἐγήγερται ἐκ νεκρῶν⸃, καὶ διὰ τοῦτο ἐνεργοῦσιν αἱ δυνάμεις ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/014.yaml
  text: And King Herod heard of it[a], for his name had become well known, and people were saying, “John the Baptizer has been raised from the dead[c][b], and because of this these powers are at work in him.”
translation:
  language: pt
  text: 'E o rei Herodes ouviu falar disso, pois o nome de Jesus havia se tornado bem conhecido, e as pessoas diziam: “João, o Batizador,[a] foi ressuscitado dentre os mortos;[b] por isso, os poderes[c] atuam nele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, conforme a forma tradicional, “João Batista”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “ressuscitou dentre os mortos”. O verbo grego está na voz passiva: “foi ressuscitado”.'
    reason: alternative_reading
  - marker: c
    text: Ou “poderes milagrosos” ou “obras poderosas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: o rei Herodes
  rationale: Preserva diretamente o título βασιλεύς e segue uma ordem natural em português.
- source_word: ἤκουσεν
  choice: ouviu falar disso
  rationale: O objeto está implícito no contexto anterior; esta formulação é natural em português e não acrescenta conteúdo específico.
- source_word: φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ
  choice: pois o nome de Jesus havia se tornado bem conhecido
  rationale: Comunica idiomaticamente que o nome ou a reputação se tornou publicamente conhecido. A explicitação de Jesus evita uma referência pronominal ambígua em português.
- source_word: ἔλεγον
  choice: as pessoas diziam
  rationale: O plural sem sujeito expresso tem sentido indefinido; “as pessoas” o transmite naturalmente.
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: João, o Batizador
  rationale: Preserva a força verbal do particípio, isto é, aquele que batiza, enquanto a forma tradicional aparece em nota.
- source_word: ἐγήγερται ἐκ νεκρῶν
  choice: foi ressuscitado dentre os mortos
  rationale: Preserva a voz passiva do perfeito grego e expressa de modo claro o estado resultante, sem convertê-lo em forma ativa ou intransitiva.
- source_word: διὰ τοῦτο
  choice: por isso
  rationale: Expressa de modo conciso e natural a relação causal indicada pela locução grega.
- source_word: ἐνεργοῦσιν
  choice: atuam
  rationale: O presente indica atividade em curso, e “atuam” combina naturalmente com “poderes”.
- source_word: αἱ δυνάμεις
  choice: esses poderes
  rationale: Mantém o plural e evita decidir no texto principal entre capacidades sobrenaturais e obras milagrosas.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Reproduz diretamente ἐν αὐτῷ e preserva a ideia de poderes operantes nele, sem a interpretação instrumental “por meio dele”.
theological_decisions:
- issue: Voz de ἐγήγερται no contexto de ressurreição
  choice: foi ressuscitado dentre os mortos
  alternative: ressuscitou dentre os mortos
  rationale: A forma grega é passiva; mantê-la evita atribuir ao sujeito uma ação que a gramática não explicita.
- issue: Designação Ἰωάννης ὁ βαπτίζων
  choice: João, o Batizador
  alternative: João Batista
  rationale: A escolha principal representa mais claramente o particípio substantivado; a designação tradicional é preservada em nota para reconhecimento do leitor.
- issue: Sentido de αἱ δυνάμεις
  choice: esses poderes
  alternative: essas obras poderosas / esses poderes milagrosos
  rationale: O substantivo pode apontar para poderes ou manifestações milagrosas. A tradução principal conserva a amplitude sem resolver a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A pontuação divide a longa coordenação grega para maior clareza sem alterar suas relações lógicas. Todos os marcadores de nota aparecem no texto principal.
