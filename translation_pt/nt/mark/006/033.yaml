source:
  edition: SBLGNT
  text: καὶ εἶδον αὐτοὺς ὑπάγοντας καὶ ⸀ἐπέγνωσαν πολλοί, καὶ πεζῇ ἀπὸ πασῶν τῶν πόλεων συνέδραμον ἐκεῖ καὶ προῆλθον ⸀αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/033.yaml
  text: And many saw them going and recognized them[b][a], and on foot from all the towns they ran there together and got there ahead of them.
translation:
  language: pt
  text: Muitos os viram partir e os reconheceram; então, a pé[a], vindos de todas as cidades[b], correram juntos para lá e chegaram antes deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por terra”, destacando o contraste com a viagem de barco.
    reason: lexical_alternative
  - marker: b
    text: Ou “povoados”; a palavra grega pode designar cidades ou localidades menores, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: viram
  rationale: Tradução direta de ὁράω, adequada à sequência narrativa e sem acrescentar uma nuance além da percepção visual.
- source_word: ὑπάγοντας
  choice: partir
  rationale: O particípio descreve Jesus e os discípulos quando se afastavam de barco; “partir” expressa naturalmente esse movimento no contexto.
- source_word: ἐπέγνωσαν
  choice: reconheceram
  rationale: Neste contexto, ἐπιγινώσκω indica identificar quem eles eram, não adquirir conhecimento novo em sentido amplo.
- source_word: πολλοί
  choice: muitos
  rationale: O adjetivo substantivado pode ser vertido naturalmente como “muitos”, sem necessidade de explicitar “pessoas”.
- source_word: πεζῇ
  choice: a pé
  rationale: Preserva o contraste específico entre o deslocamento por terra da multidão e a viagem de barco de Jesus e dos discípulos.
- source_word: ἀπὸ πασῶν τῶν πόλεων
  choice: vindos de todas as cidades
  rationale: “Cidades” é uma tradução corrente de πόλεις; “vindos” explicita em português a relação sintática da expressão de origem sem alterar seu sentido.
- source_word: συνέδραμον
  choice: correram juntos
  rationale: Mantém tanto a ideia de correr quanto o sentido coletivo ou convergente presente no verbo composto συντρέχω.
- source_word: ἐκεῖ
  choice: para lá
  rationale: Forma deítica natural em português, que indica o destino do movimento.
- source_word: προῆλθον αὐτούς
  choice: chegaram antes deles
  rationale: No contexto, a expressão significa precedê-los na chegada; esta formulação comunica claramente a comparação temporal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. O ponto e vírgula organiza a longa coordenação grega sem apagar a continuidade dos acontecimentos. A formulação conserva o sujeito plural e a convergência da multidão, sem identificar além do que o contexto permite quem exatamente foi reconhecido.
