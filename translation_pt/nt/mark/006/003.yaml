id: MRK.6.3
reference: Mark 6:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τέκτων, ὁ υἱὸς ⸀τῆς Μαρίας ⸂καὶ ἀδελφὸς⸃ Ἰακώβου καὶ ⸀Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/003.yaml
  text: Is this not the carpenter[b][a], the son of Mary and brother of James and Joses and Judas and Simon? And are not his sisters here with us? And they took offense at him.
translation:
  language: pt
  text: Não é este o carpinteiro, o filho de Maria e irmão de Tiago, José, Judas e Simão? E não estão aqui conosco as irmãs dele?[a] E eles se ofendiam com ele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “parentes”. Os termos gregos normalmente significam “irmão” e “irmãs”, mas algumas tradições cristãs os entendem aqui de modo mais amplo, como parentes próximos ou filhos de um casamento anterior de José.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “tropeçavam por causa dele” ou “ficavam escandalizados com ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκτων
  choice: carpinteiro
  rationale: É o sentido tradicional e mais provável no contexto de uma aldeia, embora o termo grego possa designar mais amplamente um artesão ou construtor.
- source_word: υἱὸς τῆς Μαρίας
  choice: o filho de Maria
  rationale: Preserva diretamente a identificação marcada pela mãe, sem explicar se a expressão é neutra ou depreciativa.
- source_word: ἀδελφὸς / ἀδελφαὶ
  choice: irmão / irmãs
  rationale: São os sentidos lexicais comuns dos termos gregos; uma nota registra interpretações mais amplas sem resolver no texto principal a relação familiar exata.
- source_word: Ἰωσῆτος
  choice: José
  rationale: Emprega a forma portuguesa bíblica corrente e inteligível para o nome grego atestado aqui.
- source_word: ὧδε πρὸς ἡμᾶς
  choice: aqui conosco
  rationale: Expressa de modo natural a presença local e a proximidade social indicadas pela locução grega.
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: eles se ofendiam com ele
  rationale: No contexto, descreve uma reação negativa a Jesus, não um tropeço literal; o imperfeito português também preserva o aspecto durativo ou reiterado do grego.
theological_decisions:
- issue: Relação dos “irmãos” e das “irmãs” com Jesus
  choice: Manter “irmão” e “irmãs” no texto principal sem especificar a relação biológica exata.
  alternative: Parentes próximos ou meio-irmãos por parte de José.
  rationale: Os termos gregos normalmente significam irmãos, mas o texto não resolve as interpretações históricas sobre o parentesco; a tradução preserva essa tensão.
- issue: Força social da expressão “filho de Maria”
  choice: Traduzir a expressão de forma direta, sem comentário interpretativo no texto.
  alternative: Explicitar que seria uma designação depreciativa.
  rationale: A expressão pode ter uma conotação social negativa, mas essa nuance não é declarada explicitamente no versículo.
- issue: Sentido de σκανδαλίζω
  choice: Traduzir a reação como “se ofendiam com ele”.
  alternative: “Tropeçavam por causa dele” ou “ficavam escandalizados com ele”.
  rationale: A escolha comunica a rejeição provocada por Jesus sem transformar a metáfora em tropeço físico; a nota conserva a imagem alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções naturais para leitores brasileiros. Mantém a identificação “o filho de Maria” e os termos familiares sem acrescentar conclusões doutrinárias.
