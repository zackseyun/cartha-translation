id: MRK.6.29
reference: Mark 6:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ μαθηταὶ αὐτοῦ ἦλθον καὶ ἦραν τὸ πτῶμα αὐτοῦ καὶ ἔθηκαν αὐτὸ ἐν μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/029.yaml
  text: And when his disciples heard[a], they came and took up his body and laid it in a tomb.
translation:
  language: pt
  text: Quando os discípulos dele souberam disso, vieram, recolheram o corpo[a] e o colocaram num túmulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cadáver”. O termo grego se refere especificamente a um corpo morto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: quando ... souberam disso
  rationale: O particípio aoristo tem valor temporal. “Souberam disso” expressa naturalmente, em português, que os discípulos receberam a notícia dos acontecimentos narrados, sem acrescentar um objeto específico ausente no grego.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: os discípulos dele
  rationale: “Discípulos” preserva o sentido relacional de μαθηταί. No contexto imediato, “dele” se refere a João Batista.
- source_word: ἦλθον
  choice: vieram
  rationale: Corresponde ao sentido comum de ἔρχομαι e apresenta a chegada deles ao local na sequência narrativa.
- source_word: ἦραν
  choice: recolheram
  rationale: Neste contexto funerário, αἴρω descreve pegar e retirar o cadáver. “Recolheram” é natural, respeitoso e abrange a ação sem sugerir detalhes não declarados.
- source_word: πτῶμα
  choice: corpo
  rationale: Embora πτῶμα designe especificamente um cadáver, “corpo” é a formulação mais corrente e digna no texto principal; a precisão lexical é registrada em nota.
- source_word: ἔθηκαν
  choice: colocaram
  rationale: Em contexto de sepultamento, τίθημι significa pôr ou depositar. “Colocaram” é claro e natural, sem perder a sobriedade do relato.
- source_word: ἐν μνημείῳ
  choice: num túmulo
  rationale: μνημεῖον designa aqui um lugar de sepultamento; “túmulo” corresponde ao uso neotestamentário e é amplamente compreensível.
theological_decisions:
- issue: Referente de “os discípulos dele”
  choice: Os discípulos de João Batista
  alternative: Os discípulos de Jesus
  rationale: O antecedente no contexto imediato é João Batista, cuja execução acaba de ser narrada. São os discípulos de João que recolhem e sepultam seu corpo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção temporal foi naturalizada, e a linguagem funerária mantém tom respeitoso. O marcador da nota foi colocado junto a “corpo”, termo ao qual a alternativa lexical se refere.
