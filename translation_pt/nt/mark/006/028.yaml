source:
  edition: SBLGNT
  text: καὶ ἤνεγκεν τὴν κεφαλὴν αὐτοῦ ἐπὶ πίνακι καὶ ἔδωκεν αὐτὴν τῷ κορασίῳ, καὶ τὸ κοράσιον ἔδωκεν αὐτὴν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/028.yaml
  text: And he brought his head on a platter and gave it to the girl[a], and the girl gave it to her mother.
translation:
  language: pt
  text: E ele trouxe a cabeça dele numa bandeja[a] e a deu à menina; e a menina a deu à mãe dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “numa travessa” ou “num prato”. O grego πίναξ se refere a uma bandeja, travessa ou prato usado para servir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκεν
  choice: trouxe
  rationale: O aoristo de φέρω descreve o ato concreto de trazer a cabeça ao local do banquete. “Trouxe” é natural e não especifica além do texto o modo de transportá-la.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: a cabeça dele
  rationale: Mantém o pronome possessivo do grego e sua referência contextual a João Batista, sem substituir o pronome pelo nome.
- source_word: ἐπὶ πίνακι
  choice: numa bandeja
  rationale: πίναξ designa uma peça usada para servir, como bandeja, travessa ou prato. “Numa bandeja” soa natural em português e se ajusta ao contexto do banquete.
- source_word: ἔδωκεν
  choice: deu
  rationale: A repetição de “deu” nas duas orações reproduz a repetição de δίδωμι no grego e destaca a sequência da entrega.
- source_word: τῷ κορασίῳ / τὸ κοράσιον
  choice: à menina / a menina
  rationale: κοράσιον indica uma menina ou jovem. “Menina” é claro, atual e dispensa uma forma arcaica como “donzela”.
- source_word: τῇ μητρὶ αὐτῆς
  choice: à mãe dela
  rationale: Expressa de modo natural e inequívoco que se trata da mãe da menina, preservando o referente feminino de αὐτῆς.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura narrativa próxima do grego. A repetição de “deu” foi mantida, e “à mãe dela” evita a ambiguidade que “à sua mãe” poderia criar em português.
