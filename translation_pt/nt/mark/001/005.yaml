id: MRK.1.5
reference: Mark 1:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐξεπορεύετο πρὸς αὐτὸν πᾶσα ἡ Ἰουδαία χώρα καὶ οἱ Ἱεροσολυμῖται ⸂πάντες, καὶ ἐβαπτίζοντο⸃ ⸂ὑπ’ αὐτοῦ ἐν τῷ Ἰορδάνῃ ποταμῷ⸃ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/005.yaml
  text: And all the Judean countryside and all the people of Jerusalem were going out to him, and they were being baptized by him in the Jordan River, confessing their sins.
translation:
  language: pt
  text: E toda a região da Judeia e todos os habitantes de Jerusalém iam até ele e eram batizados por ele no rio Jordão, confessando os seus pecados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: iam até ele
  rationale: O imperfeito apresenta uma ação contínua ou repetida no passado. Em português, “iam até ele” comunica naturalmente esse aspecto e o movimento em direção a João.
- source_word: πᾶσα ἡ Ἰουδαία χώρα
  choice: toda a região da Judeia
  rationale: χώρα pode designar terra, região ou distrito. “Região da Judeia” é claro e geograficamente abrangente, sem restringir o referente apenas à zona rural.
- source_word: οἱ Ἱεροσολυμῖται πάντες
  choice: todos os habitantes de Jerusalém
  rationale: Ἱεροσολυμῖται designa os moradores de Jerusalém. “Habitantes de Jerusalém” é corrente, preciso e mais amplamente natural do que “jerosolimitanos”.
- source_word: ἐβαπτίζοντο
  choice: eram batizados
  rationale: O imperfeito passivo indica uma ação repetida sofrida pelos grupos que chegavam. “Eram batizados” preserva voz e aspecto de modo idiomático.
- source_word: ὑπ’ αὐτοῦ
  choice: por ele
  rationale: Mantém o pronome do grego; o contexto identifica seu referente como João, sem necessidade de explicitação interpretativa.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: no rio Jordão
  rationale: Inclui o substantivo ποταμός, “rio”, e segue a ordem idiomática do nome geográfico em português.
- source_word: ἐξομολογούμενοι
  choice: confessando
  rationale: O particípio descreve uma ação concomitante ao batismo. “Confessando” expressa diretamente o reconhecimento declarado dos pecados sem acrescentar circunstâncias ausentes do texto.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: os seus pecados
  rationale: Tradução natural do objeto acusativo com o pronome possessivo; o referente de “seus” são as pessoas que recebiam o batismo.
theological_decisions:
- issue: Alcance de “toda” e “todos” nas referências à Judeia e a Jerusalém
  choice: Preservar os quantificadores universais do grego, entendidos no possível sentido coletivo e retórico da narrativa
  alternative: Substituir por “muitos da Judeia e de Jerusalém”
  rationale: O texto usa πᾶσα e πάντες. A tradução deve conservar essa força expressiva sem converter a generalização narrativa em uma afirmação técnica de universalidade matemática.
- issue: Natureza do batismo
  choice: Empregar “batizados”, sem definir o modo nem explicar seu significado teológico
  alternative: Traduzir como “imersos” ou “lavados”
  rationale: Neste versículo, o verbo relata o ato sem explicitar seu modo ou desenvolver sua significação teológica. O termo estabelecido “batizados” evita impor uma leitura denominacional.
- issue: Relação entre confissão e batismo
  choice: Manter “confessando” como ação concomitante, sem especificar causalidade, condição ou fórmula ritual
  alternative: Explicitar “depois de confessarem” ou “porque confessavam”
  rationale: O particípio presente descreve a confissão em associação com o batismo, mas não define por si só uma sequência temporal rígida nem uma relação causal precisa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção conserva o movimento narrativo do imperfeito e evita tanto arcaísmos quanto explicações doutrinárias inseridas no corpo do versículo.
