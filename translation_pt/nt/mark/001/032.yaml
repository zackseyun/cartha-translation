  text: Ὀψίας δὲ γενομένης, ὅτε ⸀ἔδυ ὁ ἥλιος, ἔφερον πρὸς αὐτὸν πάντας τοὺς κακῶς ἔχοντας καὶ τοὺς δαιμονιζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/032.yaml
  text: When evening came[a], when the sun had set[d][c][b], they brought to him all who were sick and those who were demon-possessed.
translation:
  language: pt
  text: Ao cair da tarde, quando o sol se pôs, traziam até ele todos os doentes e os endemoninhados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os demonizados” ou “os que estavam sob o poder de demônios”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Ao cair da tarde
  rationale: O genitivo absoluto introduz uma transição temporal. A expressão é natural em português e conserva a ideia da chegada do período da tarde.
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: quando o sol se pôs
  rationale: Traduz diretamente ὅτε e o aoristo ἔδυ, mantendo a relação temporal com a oração anterior sem transformar explicitamente 'quando' em 'depois que'.
- source_word: ἔφερον
  choice: traziam
  rationale: 'O imperfeito apresenta uma ação em andamento ou repetida: as pessoas continuavam trazendo os necessitados até Jesus.'
- source_word: πρὸς αὐτὸν
  choice: a ele
  rationale: Mantém o pronome do grego e expressa movimento em direção a Jesus sem repetir seu nome, que não aparece neste versículo.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: todos os doentes
  rationale: A expressão idiomática significa os que se encontravam mal ou enfermos. 'Todos os doentes' é conciso, claro e preserva a força abrangente de πάντας.
- source_word: τοὺς δαιμονιζομένους
  choice: os endemoninhados
  rationale: '''Endemoninhados'' é uma expressão portuguesa corrente para pessoas sob atuação ou domínio demoníaco e conserva a distinção textual entre enfermidade e atividade demoníaca.'
theological_decisions:
- issue: Como traduzir δαιμονιζομένους sem eliminar nem definir em excesso a atividade demoníaca
  choice: os endemoninhados
  alternative: os demonizados; os que estavam sob o poder de demônios
  rationale: A tradução preserva a referência concreta do texto a demônios e não a reduz a enfermidade, mas evita acrescentar uma teoria detalhada sobre a natureza ou o grau desse domínio.
- issue: Relação temporal entre a chegada da tarde e o pôr do sol
  choice: Ao cair da tarde, quando o sol se pôs
  alternative: Quando chegou a tarde, depois que o sol se pôs
  rationale: O grego usa ὅτε, 'quando'. A versão conserva essa relação e não explicita como causal ou posterior aquilo que o versículo apenas situa temporalmente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperfeito 'traziam' preserva o desenvolvimento da cena; 'ao cair da tarde' evita uma formulação rígida, e 'endemoninhados' mantém a linguagem sobrenatural do texto sem explicação doutrinária adicional.
