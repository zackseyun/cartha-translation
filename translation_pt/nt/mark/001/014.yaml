  text: ⸂Καὶ μετὰ⸃ τὸ παραδοθῆναι τὸν Ἰωάννην ἦλθεν ὁ Ἰησοῦς εἰς τὴν Γαλιλαίαν κηρύσσων τὸ ⸀εὐαγγέλιον τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/014.yaml
  text: And after John was handed over[a], Jesus came into Galilee[c][b], proclaiming the good news of God.
translation:
  language: pt
  text: Depois de João ter sido entregue[a], Jesus foi para a Galileia, proclamando as boas-novas de Deus[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois que João foi preso”. O grego diz mais literalmente “foi entregue”, expressão que também antecipa a linguagem usada mais adiante em Marcos a respeito da paixão de Jesus.
    reason: lexical_alternative
  - marker: b
    text: Ou “o evangelho de Deus”.
    reason: lexical_alternative
  - marker: c
    text: A expressão “de Deus” pode indicar as boas-novas que vêm de Deus, pertencem a Deus ou têm Deus como seu centro.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὸ παραδοθῆναι
  choice: Depois que ... foi entregue
  rationale: A construção com μετά e infinitivo articular é temporal. “Foi entregue” preserva o sentido amplo e a ligação verbal com a linguagem posterior de Marcos sobre a paixão, sem especificar mais do que o grego.
- source_word: Ἰωάννην
  choice: João
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome Ἰωάννης.
- source_word: ἦλθεν
  choice: foi
  rationale: Neste contexto narrativo, “foi para a Galileia” expressa de modo natural em português o deslocamento indicado por ἦλθεν εἰς, sem alterar o acontecimento descrito.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: para a Galileia
  rationale: “Para” preserva a direção e o movimento de entrada indicados por εἰς, com maior naturalidade em português do que “para dentro da Galileia”.
- source_word: κηρύσσων
  choice: proclamando
  rationale: Expressa o anúncio público próprio de κηρύσσω e mantém um registro digno e acessível, sem restringir a ação à pregação em ambiente religioso.
- source_word: εὐαγγέλιον
  choice: boas-novas
  rationale: Comunica diretamente o sentido lexical de notícia boa, conservando também o peso teológico adquirido pelo termo no contexto cristão.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Mantém a amplitude do genitivo grego, que pode indicar a origem, a pertença ou o conteúdo central das boas-novas, sem selecionar apenas uma dessas relações.
theological_decisions:
- issue: Tradução de παραδοθῆναι e sua relação com o vocabulário recorrente da paixão em Marcos
  choice: foi entregue
  alternative: foi preso
  rationale: “Foi entregue” preserva a ressonância narrativa do verbo παραδίδωμι, usado depois para a entrega de Jesus, enquanto “foi preso” explicitaria apenas o resultado histórico imediato.
- issue: Sentido do genitivo em τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: as boas-novas de Deus
  alternative: as boas-novas vindas de Deus / as boas-novas sobre Deus
  rationale: 'A formulação conserva a ambiguidade genuína: as boas-novas podem ser entendidas como provenientes de Deus, pertencentes a Deus ou centradas nele.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Boas-novas” evita depender exclusivamente do termo eclesiástico “evangelho”, enquanto “foi entregue” conserva uma importante ligação literária de Marcos. A ordem da frase foi mantida próxima à do grego sem sacrificar a naturalidade.
