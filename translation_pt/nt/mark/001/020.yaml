source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐκάλεσεν αὐτούς. καὶ ἀφέντες τὸν πατέρα αὐτῶν Ζεβεδαῖον ἐν τῷ πλοίῳ μετὰ τῶν μισθωτῶν ἀπῆλθον ὀπίσω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/020.yaml
  text: And immediately he called them[a], and leaving their father Zebedee in the boat with the hired workers, they went after him.
translation:
  language: pt
  text: E imediatamente os chamou. Eles deixaram seu pai Zebedeu no barco com os trabalhadores contratados e foram atrás dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seguiram-no”. A expressão grega pode indicar tanto o movimento físico atrás de Jesus quanto o começo do discipulado.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Preserva a força temporal e o senso de urgência característico da narrativa de Marcos, em linguagem portuguesa corrente.
- source_word: ἐκάλεσεν
  choice: chamou
  rationale: É o equivalente direto e natural neste contexto de chamado ao discipulado, sem especificar em excesso se foi uma ordem ou um convite.
- source_word: ἀφέντες
  choice: deixaram
  rationale: Expressa de modo natural a ação anterior e associada ao verbo principal, sem a conotação mais dura de “abandonaram”.
- source_word: πατέρα αὐτῶν Ζεβεδαῖον
  choice: seu pai Zebedeu
  rationale: Reproduz com clareza a relação familiar e usa a forma tradicional portuguesa do nome próprio.
- source_word: πλοίῳ
  choice: barco
  rationale: É o termo corrente e adequado para uma embarcação de pesca no mar da Galileia.
- source_word: μισθωτῶν
  choice: trabalhadores contratados
  rationale: Indica pessoas que trabalhavam mediante pagamento, sem acrescentar a ideia específica de diaristas nem recorrer ao tom corporativo moderno de “funcionários”.
- source_word: ἀπῆλθον ὀπίσω αὐτοῦ
  choice: foram atrás dele
  rationale: Expressa naturalmente o afastamento do barco e preserva tanto o movimento físico atrás de Jesus quanto a possível ressonância de início do discipulado.
theological_decisions:
- issue: Nuance de discipulado em ὀπίσω αὐτοῦ
  choice: foram atrás dele
  alternative: seguiram-no
  rationale: A formulação escolhida mantém a ação física da cena e permite que a ideia de seguir Jesus como discípulo permaneça presente sem tornar explícito apenas um dos sentidos possíveis.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A segunda oração foi dividida em nova frase para evitar uma coordenação pesada, sem alterar a sequência narrativa.
