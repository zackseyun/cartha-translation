translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição de “e” conserva o ritmo narrativo de Marcos sem produzir uma sintaxe artificial; a divisão em duas frases torna a relação participial clara.
