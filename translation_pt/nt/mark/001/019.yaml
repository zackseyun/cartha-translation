  text: καὶ ⸀προβὰς ὀλίγον εἶδεν Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ αὐτοὺς ἐν τῷ πλοίῳ καταρτίζοντας τὰ δίκτυα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/019.yaml
  text: And going on a little farther[a], he saw James the son of Zebedee and John his brother, and they were in the boat mending the nets,
translation:
  language: pt
  text: E, indo um pouco mais adiante, viu Tiago, filho de Zebedeu, e João, irmão dele, no barco, remendando[a] as redes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “consertando” ou “preparando” as redes; o verbo grego pode significar pôr algo em ordem ou restaurá-lo à condição adequada.
    reason: lexical_alternative
lexical_decisions:
- source_word: προβὰς ὀλίγον
  choice: seguindo um pouco mais adiante
  rationale: 'O particípio aoristo exprime uma circunstância temporal de movimento: Jesus continuou por uma curta distância. A formulação é natural em português e mantém a ideia de breve avanço.'
- source_word: εἶδεν
  choice: viu
  rationale: Reproduz o sentido narrativo simples do aoristo de ὁράω sem acrescentar a ênfase de “notou” ou “avistou”.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Tiago, filho de Zebedeu
  rationale: A construção com artigo e genitivo identifica Tiago por sua filiação; esta é a forma idiomática em português.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: João, irmão dele
  rationale: O pronome αὐτοῦ retoma naturalmente Tiago. “Irmão dele” preserva essa referência sem inserir o nome novamente.
- source_word: καὶ αὐτοὺς ἐν τῷ πλοίῳ
  choice: Eles também estavam no barco
  rationale: O segundo καί tem valor inclusivo (“também”), indicando que esses dois, assim como os irmãos mencionados anteriormente, estavam no barco. A reformulação em oração independente evita uma construção acusativa pouco natural em português.
- source_word: καταρτίζοντας
  choice: remendando
  rationale: No contexto de redes de pesca, “remendando” é a opção mais idiomática, embora o verbo também possa indicar preparar ou pôr em ordem.
- source_word: τὰ δίκτυα
  choice: as redes
  rationale: Mantém o artigo do grego e o sentido específico de redes de pesca, sem acrescentar um possessivo ausente do texto.
