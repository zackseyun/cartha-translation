  text: ἐγένετο Ἰωάννης ⸀ὁ βαπτίζων ἐν τῇ ⸀ἐρήμῳ κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/004.yaml
  text: John the Baptist appeared in the wilderness[a], proclaiming a baptism of repentance for the forgiveness of sins.
translation:
  language: pt
  text: João Batista apareceu no deserto, proclamando um batismo de arrependimento para o perdão dos pecados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: apareceu
  rationale: No estilo narrativo de Marcos, introduz João em cena; “apareceu” comunica essa função com naturalidade, sem o literalismo inadequado de “veio a ser”.
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: João Batista
  rationale: O particípio substantivado identifica João por sua atividade de batizar. “João Batista” é a forma consagrada, natural e amplamente compreensível em português.
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: “Deserto” é a tradução bíblica corrente de ἔρημος em português e designa uma região erma, sem implicar necessariamente um cenário arenoso.
- source_word: κηρύσσων
  choice: proclamando
  rationale: Preserva a ideia de anúncio público própria de κηρύσσω e evita restringir o sentido ao uso eclesiástico moderno de “pregar”.
- source_word: βάπτισμα μετανοίας
  choice: um batismo de arrependimento
  rationale: Mantém a construção genitiva e seu sentido caracterizador, sem parafrasear excessivamente a relação entre o batismo e o arrependimento.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: para o perdão dos pecados
  rationale: Expressa de modo natural a relação de finalidade ou resultado indicada por εἰς, preservando o plural “pecados” e sem definir além do grego o mecanismo dessa relação.
theological_decisions:
- issue: Relação entre batismo, arrependimento e perdão
  choice: “um batismo de arrependimento para o perdão dos pecados”
  alternative: “um batismo que simbolizava o arrependimento” ou “um batismo que produzia o perdão”
  rationale: A formulação conserva a relação afirmada no grego sem decidir se o batismo é instrumental, simbólico ou declarativo, evitando impor ao texto debates doutrinários posteriores.
translation_notes:
  register: Português moderno, digno e de leitura natural, com vocabulário bíblico amplamente reconhecido. Não se acrescentou nota para “Batista”, pois em português essa forma consagrada representa adequadamente ὁ βαπτίζων sem criar ambiguidade relevante.
