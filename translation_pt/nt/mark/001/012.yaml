  text: Καὶ εὐθὺς τὸ πνεῦμα αὐτὸν ἐκβάλλει εἰς τὴν ἔρημον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/012.yaml
  text: And immediately the Spirit drives him out into the wilderness[a].
translation:
  language: pt
  text: E imediatamente o Espírito o impele para o deserto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o expulsa” ou “o envia”. O verbo grego é vigoroso; compare o uso frequente, em Marcos, do mesmo verbo para expulsar demônios.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Mantém a coordenação simples e o fluxo narrativo característico de Marcos, sem explicitar mais do que o grego.
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Preserva a urgência e o rápido avanço narrativo marcano em linguagem portuguesa corrente.
- source_word: τὸ πνεῦμα
  choice: o Espírito
  rationale: Conserva a forma definida do grego e remete naturalmente ao Espírito mencionado no batismo de Jesus em Marcos 1:10, sem acrescentar “Santo” ao texto.
- source_word: αὐτὸν
  choice: o
  rationale: Pronome objeto que retoma Jesus; esta colocação é natural e clara em português.
- source_word: ἐκβάλλει
  choice: impele
  rationale: Comunica uma ação enérgica e preserva a iniciativa vigorosa do Espírito sem sugerir que Jesus esteja sendo expulso como um demônio. A nota registra alternativas mais literais e a força do verbo.
- source_word: εἰς τὴν ἔρημον
  choice: para o deserto
  rationale: “Deserto” é a formulação bíblica corrente em português para uma região erma ou desabitada e não exige a ideia específica de dunas ou areia.
theological_decisions:
- issue: A força da ação do Espírito sobre Jesus
  choice: O Espírito “o impele” para o deserto.
  alternative: O Espírito “o expulsa”, “o lança para fora” ou “o envia” ao deserto.
  rationale: O verbo ἐκβάλλω é forte e não deve ser suavizado para “conduz”. “Impele” preserva a iniciativa vigorosa do Espírito e a tensão teológica do texto, enquanto a nota torna transparente a força ainda mais concreta das alternativas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Impele” é um termo corrente em registro bíblico-literário e mantém a força incomum da ação; a nota evita ocultar a amplitude lexical do original.
