source:
  edition: SBLGNT
  text: λέγων· ⸀Τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/024.yaml
  text: saying[a], “What have you to do with us[b], Jesus the Nazarene? Have you come to destroy us? I know who you are—the Holy One of God.”
translation:
  language: pt
  text: 'dizendo: “O que temos nós a ver com você,[a] Jesus, o Nazareno?[b] Você veio para nos destruir? Sei quem você é: o Santo de Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que há entre nós e você?” A expressão grega é uma maneira idiomática de indicar afastamento ou hostilidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Jesus de Nazaré”. Grego: “Jesus, o Nazareno”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: dizendo
  rationale: O particípio introduz diretamente a fala e é preservado de modo simples e formal.
- source_word: Τί ἡμῖν καὶ σοί
  choice: O que temos nós a ver com você
  rationale: A expressão idiomática, literalmente ‘que [há] para nós e para você?’, comunica afastamento ou confronto. A formulação escolhida é natural em português e mantém a força adversativa sem explicar além do texto.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: Jesus, o Nazareno
  rationale: Mantém a forma adjetival e vocativa do grego. A vírgula ajuda a leitura natural em português; ‘Jesus de Nazaré’ é registrado como alternativa.
- source_word: ἦλθες
  choice: Você veio
  rationale: O pretérito perfeito traduz naturalmente o aoristo em uma pergunta sobre a vinda de Jesus e sua finalidade.
- source_word: ἀπολέσαι
  choice: para nos destruir
  rationale: Neste contexto, o infinitivo expressa finalidade, e ‘destruir’ transmite diretamente o sentido de ἀπόλλυμι.
- source_word: οἶδά σε τίς εἶ
  choice: Sei quem você é
  rationale: É a equivalência direta e natural da declaração de reconhecimento.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: o Santo de Deus
  rationale: Preserva a expressão titular e a relação genitiva sem ampliá-la em uma formulação doutrinária.
theological_decisions:
- issue: Título cristológico no reconhecimento demoníaco
  choice: o Santo de Deus
  alternative: o Santo que vem de Deus
  rationale: A tradução conserva a força titular e a ambiguidade da construção genitiva, sem acrescentar uma explicação cristológica não explicitada no grego.
- issue: Plural na fala do espírito impuro
  choice: nos
  alternative: me
  rationale: O grego usa explicitamente o plural ἡμᾶς; ele é mantido sem decidir a quem exatamente o falante inclui nesse plural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento por ‘você’ evita tanto a solenidade artificial quanto regionalismos marcados. A ordem ‘temos nós’ preserva certa ênfase retórica sem soar arcaica.
