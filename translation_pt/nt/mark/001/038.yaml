source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἄγωμεν ⸀ἀλλαχοῦ εἰς τὰς ἐχομένας κωμοπόλεις, ἵνα καὶ ἐκεῖ κηρύξω, εἰς τοῦτο γὰρ ⸀ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/038.yaml
  text: And he said to them[a], “Let us go elsewhere, to the neighboring towns, so that I may preach there also[b], for that is why I came out.”
translation:
  language: pt
  text: 'E ele lhes disse: “Vamos a outros lugares, aos povoados vizinhos[a], para que eu pregue também ali, pois foi para isso que saí[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego pode designar núcleos populacionais menores, algo entre aldeias e cidades.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois com esse propósito saí”. A frase pode se referir simplesmente à saída de Jesus do lugar em que estava ou, de modo mais amplo, ao propósito de sair para pregar.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγωμεν
  choice: Vamos
  rationale: O subjuntivo exortativo na primeira pessoa do plural convida os discípulos a acompanhá-lo; “Vamos” é natural e preserva essa força.
- source_word: ἀλλαχοῦ
  choice: a outros lugares
  rationale: Expressa movimento para outro lugar ou para outros lugares. Esta formulação é clara e idiomática em português.
- source_word: ἐχομένας
  choice: vizinhos
  rationale: O particípio é usado aqui em sentido geográfico para lugares próximos ou contíguos.
- source_word: κωμοπόλεις
  choice: povoados
  rationale: O termo designa núcleos populacionais menores, com características intermediárias entre aldeias e cidades. “Povoados” é compreensível e evita sugerir grandes centros urbanos.
- source_word: ἵνα καὶ ἐκεῖ κηρύξω
  choice: para que eu pregue também ali
  rationale: “Para que” preserva a finalidade introduzida por ἵνα; “pregue” traduz naturalmente κηρύξω, e “também ali” mantém a ênfase de καὶ ἐκεῖ.
- source_word: εἰς τοῦτο
  choice: foi para isso
  rationale: A expressão indica propósito e liga a saída de Jesus à pregação em outros lugares.
- source_word: ἐξῆλθον
  choice: saí
  rationale: Tradução direta do aoristo de ἐξέρχομαι. Mantém aberta a possibilidade de uma saída do lugar presente e de uma referência mais ampla ao propósito de Jesus.
- source_word: λέγει αὐτοῖς
  choice: ele lhes disse
  rationale: O presente histórico grego é vertido pelo pretérito, forma natural na narrativa portuguesa.
theological_decisions:
- issue: Alcance de ἐξῆλθον
  choice: “saí”, sem especificar o ponto de partida
  alternative: “vim” ou “saí daqui”
  rationale: O grego pode se referir simplesmente à saída do lugar em que Jesus estava, mas o contexto também permite uma alusão mais ampla ao propósito de sua atividade de pregação. A tradução não restringe a frase a uma dessas leituras.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Povoados” evita a possível ambiguidade brasileira de “vilas” como conjunto residencial, enquanto a nota registra a faixa semântica do termo grego. A conjunção inicial foi preservada como “E”, acompanhando a continuidade narrativa do original.
