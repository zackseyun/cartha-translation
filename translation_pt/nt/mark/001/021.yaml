  text: Καὶ εἰσπορεύονται εἰς Καφαρναούμ. καὶ ⸀εὐθὺς τοῖς σάββασιν ⸂ἐδίδασκεν εἰς τὴν συναγωγήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/021.yaml
  text: And they went into Capernaum, and immediately on the Sabbath he began teaching in the synagogue.
translation:
  language: pt
  text: E eles entraram[a] em Cafarnaum. Logo no sábado[b], ele ensinava[c] na sinagoga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entram”. Marcos usa com frequência o presente histórico para dar vivacidade à narrativa.'
    reason: lexical_alternative
  - marker: b
    text: Em grego, “nos sábados”, expressão idiomática que aqui significa “no sábado”.
    reason: lexical_alternative
  - marker: c
    text: Também pode ser entendido como “começou a ensinar” ou “ensinou”; o imperfeito grego pode apresentar a ação em andamento ou, conforme o contexto, destacar seu início.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσπορεύονται
  choice: entraram
  rationale: O presente grego funciona como presente histórico, frequente na narrativa vívida de Marcos. O pretérito é mais natural em português narrativo, enquanto “entraram” preserva a ideia de movimento para dentro.
- source_word: Καφαρναούμ
  choice: Cafarnaum
  rationale: É a forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: εὐθύς
  choice: logo
  rationale: Transmite a prontidão expressa por εὐθύς em português atual e mantém o ritmo ágil característico de Marcos.
- source_word: τοῖς σάββασιν
  choice: no sábado
  rationale: Embora a forma grega seja plural, trata-se de uma expressão temporal idiomática que, neste contexto, normalmente se refere ao sábado em questão.
- source_word: ἐδίδασκεν
  choice: ensinava
  rationale: O pretérito imperfeito português representa naturalmente o aspecto imperfeito do grego, sem decidir se a ação estava começando ou simplesmente em andamento.
- source_word: συναγωγήν
  choice: sinagoga
  rationale: No contexto judaico, συναγωγή designa a sinagoga local, não apenas uma assembleia genérica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O pronome “eles” explicita o sujeito plural sem acrescentar identificação ausente no versículo. O imperfeito “ensinava” preserva a abertura aspectual do original, enquanto as alternativas são registradas em nota.
