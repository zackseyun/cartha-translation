source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ὀργισθεὶς ἐκτείνας τὴν χεῖρα ⸂αὐτοῦ ἥψατο⸃ καὶ λέγει αὐτῷ· Θέλω, καθαρίσθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/041.yaml
  text: And being angry[a], he stretched out his hand, touched him, and said to him, “I am willing; be cleansed.”
translation:
  language: pt
  text: 'E, estando irado[a], estendeu a mão, tocou nele e lhe disse: “Quero; seja purificado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “movido de compaixão” em vez de “estando irado”.
    reason: textual_variant
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: estando irado
  rationale: Reproduz diretamente o particípio aoristo de ὀργίζομαι no texto impresso da SBLGNT, preservando a emoção difícil sem substituí-la pela variante mais conhecida.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: estendeu a mão
  rationale: Transforma naturalmente o particípio em verbo finito na sequência narrativa e conserva a ação corporal concreta.
- source_word: ἥψατο
  choice: tocou nele
  rationale: Neste contexto, o médio de ἅπτω significa naturalmente tocar; a formulação mantém a importância do contato físico com o homem que tinha lepra.
- source_word: λέγει αὐτῷ
  choice: lhe disse
  rationale: O presente histórico grego é vertido pelo pretérito, forma natural na narrativa portuguesa, e o pronome dativo evita repetição desnecessária.
- source_word: Θέλω
  choice: Quero
  rationale: Em português, «Quero» exprime de modo direto e natural tanto a vontade quanto a disposição de realizar a cura, sem sugerir mero futuro.
- source_word: καθαρίσθητι
  choice: seja purificado
  rationale: O imperativo passivo preserva as dimensões física e ritual de καθαρίζω; «purificado» comunica mais claramente essa amplitude do que apenas «limpo».
theological_decisions:
- issue: Variante textual sobre o estado emocional de Jesus
  choice: Traduzir ὀργισθείς, leitura impressa na SBLGNT, como «estando irado» no texto principal.
  alternative: «movido de compaixão»
  rationale: A tradução dá prioridade ao texto grego fornecido e mantém sua tensão teológica. Como a variante altera de maneira significativa a descrição da emoção de Jesus, ela é registrada em nota em vez de ser harmonizada silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das ações permanece clara, e a formulação conserva tanto a dificuldade textual quanto o sentido ritual e físico da purificação.
