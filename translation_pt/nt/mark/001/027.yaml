source:
  edition: SBLGNT
  text: καὶ ἐθαμβήθησαν ⸀ἅπαντες, ὥστε συζητεῖν ⸂πρὸς ἑαυτοὺς⸃ λέγοντας· Τί ἐστιν τοῦτο; ⸂διδαχὴ καινή⸃· κατ’ ἐξουσίαν καὶ τοῖς πνεύμασι τοῖς ἀκαθάρτοις ἐπιτάσσει, καὶ ὑπακούουσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/027.yaml
  text: And they were all amazed[a], so that they discussed among themselves, saying, “What is this? A new teaching with authority! He even commands the unclean spirits, and they obey him.”
translation:
  language: pt
  text: 'E todos ficaram admirados, a ponto de discutirem entre si, dizendo: “O que é isto? Um ensinamento novo, com autoridade!”[a] Ele dá ordens até aos espíritos impuros, e eles lhe obedecem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que é isto? Que novo ensinamento é este, com autoridade?” O grego pode ser pontuado de modo que “ensinamento novo” faça parte mais diretamente da pergunta.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐθαμβήθησαν
  choice: ficaram admirados
  rationale: Expressa a forte reação de espanto de modo natural em português, sem acrescentar uma intensidade não explicitada.
- source_word: ἅπαντες
  choice: todos
  rationale: Preserva a ênfase na totalidade das pessoas presentes.
- source_word: ὥστε συζητεῖν
  choice: a ponto de discutirem
  rationale: A construção com ὥστε e infinitivo indica resultado; esta formulação é clara e não sugere necessariamente hostilidade.
- source_word: πρὸς ἑαυτούς
  choice: entre si
  rationale: Indica uma conversa recíproca dentro do grupo e é idiomático em português.
- source_word: Τί ἐστιν τοῦτο;
  choice: O que é isto?
  rationale: Mantém a pergunta direta e admirada do grego sem explicá-la além do texto.
- source_word: διδαχὴ καινή
  choice: Um ensinamento novo
  rationale: “Ensinamento” é atual e acessível; evita o tom técnico que “doutrina” poderia adquirir.
- source_word: κατ’ ἐξουσίαν
  choice: com autoridade
  rationale: Preserva a ideia de autoridade na maneira ou qualidade do ensino e do ato de ordenar, sem resolver excessivamente sua ligação sintática.
- source_word: τοῖς πνεύμασι τοῖς ἀκαθάρτοις
  choice: aos espíritos impuros
  rationale: “Impuros” comunica em português atual a noção de ἀκάθαρτος e mantém sua dimensão religiosa e moral.
- source_word: ἐπιτάσσει
  choice: dá ordens
  rationale: Comunica uma ordem autoritativa de maneira natural e direta.
- source_word: ὑπακούουσιν αὐτῷ
  choice: eles lhe obedecem
  rationale: Expressa claramente a resposta obediente dos espíritos à ordem de Jesus.
theological_decisions:
- issue: Relação sintática de “com autoridade”
  choice: Apresentar “Um ensinamento novo, com autoridade!” como avaliação exclamativa, deixando a autoridade associada ao ensinamento e, pelo contexto, ao comando de Jesus.
  alternative: Pontuar como pergunta — “O que é isto? Que novo ensinamento é este, dado com autoridade?” — ou ligar “com autoridade” sobretudo ao verbo “dá ordens”.
  rationale: A sintaxe e a pontuação possíveis do grego admitem mais de uma relação. A redação escolhida preserva a tensão sem fixar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Isto”, “entre si”, “ensinamento” e “lhe obedecem” mantêm clareza sem coloquialismo excessivo. A vírgula em “novo, com autoridade” conserva certa abertura sintática.
