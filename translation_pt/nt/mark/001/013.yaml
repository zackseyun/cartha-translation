  text: καὶ ⸀ἦν ἐν τῇ ἐρήμῳ ⸂τεσσεράκοντα ἡμέρας⸃ πειραζόμενος ὑπὸ τοῦ Σατανᾶ, καὶ ἦν μετὰ τῶν θηρίων, καὶ οἱ ἄγγελοι διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/013.yaml
  text: And he was in the wilderness forty days[a], being tempted by Satan; and he was with the wild animals, and the angels were ministering to him.
translation:
  language: pt
  text: E estava no deserto por quarenta dias, sendo tentado por Satanás[a]; estava com os animais selvagens, e os anjos o serviam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sendo posto à prova por Satanás”. O verbo grego pode significar tanto “tentar” como “pôr à prova”, embora “tentado” se ajuste melhor ao fato de Satanás ser aqui o agente explícito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρήμῳ
  choice: deserto
  rationale: Em português bíblico corrente, “deserto” expressa naturalmente uma região erma e preserva a ressonância bíblica do lugar de provação, sem exigir que se trate de um deserto arenoso.
- source_word: τεσσεράκοντα ἡμέρας
  choice: durante quarenta dias
  rationale: Expressa com clareza o acusativo grego de duração, sem explicitar as possíveis ressonâncias bíblicas do número quarenta.
- source_word: πειραζόμενος
  choice: sendo tentado
  rationale: O verbo pode significar “tentar” ou “pôr à prova”. Como Satanás é o agente explícito, “tentado” é a leitura contextual mais natural; a alternativa legítima é preservada em nota.
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: por Satanás
  rationale: Mantém a forma tradicional e amplamente compreendida do nome ou título do adversário sobrenatural.
- source_word: μετὰ τῶν θηρίων
  choice: com os animais selvagens
  rationale: Tradução clara e atual que conserva o caráter não domesticado e potencialmente ameaçador do ambiente.
- source_word: ἄγγελοι
  choice: os anjos
  rationale: Embora o substantivo possa significar “mensageiros”, o contexto sobrenatural indica seres celestiais.
- source_word: διηκόνουν αὐτῷ
  choice: o serviam
  rationale: “Serviam” comunica de modo natural o sentido de διακονέω e, com o pretérito imperfeito, preserva a ação contínua.
- source_word: καὶ ἦν ... καὶ ἦν ... καὶ
  choice: E esteve ... Estava ... e ...
  rationale: Conserva em boa medida a progressão paratática de Marcos, mas evita uma sequência artificial em português; a alternância verbal também distingue a permanência delimitada de quarenta dias da cena descritiva.
theological_decisions:
- issue: Sentido de πειραζόμενος em relação a Satanás
  choice: sendo tentado
  alternative: sendo posto à prova
  rationale: A ação de Satanás favorece o sentido hostil de tentação, mas o verbo grego admite também a ideia de prova; a nota mantém essa tensão sem resolver além do que o contexto permite.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Deserto”, “animais selvagens” e “serviam” evitam arcaísmos, enquanto a estrutura conserva a concisão narrativa de Marcos.
