  text: ⸀ἐγὼ ἐβάπτισα ⸀ὑμᾶς ὕδατι, αὐτὸς δὲ βαπτίσει ὑμᾶς ⸀ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/008.yaml
  text: I baptized you with water[a], but he will baptize you with the Holy Spirit.
translation:
  language: pt
  text: Eu batizei vocês com água, mas ele os batizará com o Espírito Santo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no Espírito Santo”. A preposição grega pode ser traduzida das duas maneiras.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: Eu
  rationale: O pronome explícito preserva a ênfase e o contraste com αὐτός na oração seguinte.
- source_word: ἐβάπτισα
  choice: batizei
  rationale: Mantém o sentido ritual e a continuidade lexical com βαπτίσει, sem especificar indevidamente o modo do batismo.
- source_word: ὑμᾶς
  choice: vocês / os
  rationale: Expressa claramente a segunda pessoa do plural em português corrente; na segunda ocorrência, o pronome átono evita repetição pouco natural.
- source_word: ὕδατι
  choice: com água
  rationale: Traduz naturalmente o dativo de meio e estabelece o paralelo com a ação realizada pelo que vem.
- source_word: αὐτὸς
  choice: ele
  rationale: A estrutura contrastiva «mas ele» comunica a força enfática do pronome grego sem recorrer à expressão menos natural «ele mesmo».
- source_word: δὲ
  choice: mas
  rationale: Marca com clareza o contraste entre o batismo de João e o daquele que vem.
- source_word: βαπτίσει
  choice: batizará
  rationale: Preserva o futuro e a correspondência verbal com «batizei».
- source_word: ἐν
  choice: com
  rationale: É uma tradução portuguesa natural para o meio ou agente nessa construção, embora «no» também seja possível e seja registrado em nota.
- source_word: πνεύματι ἁγίῳ
  choice: o Espírito Santo
  rationale: No contexto, a expressão se refere mais naturalmente ao Espírito divino; a forma consagrada é clara, atual e digna.
theological_decisions:
- issue: Se πνεύματι ἁγίῳ designa o Espírito Santo divino ou uma força santa impessoal
  choice: o Espírito Santo
  alternative: espírito santo / um espírito santo
  rationale: O contraste profético entre o batismo de João e o do que vem aponta mais naturalmente para o Espírito divino, sem acrescentar ao versículo uma formulação doutrinária mais desenvolvida.
- issue: Como traduzir ἐν em ἐν πνεύματι ἁγίῳ
  choice: com o Espírito Santo
  alternative: no Espírito Santo
  rationale: «Com» comunica de modo natural o meio e preserva o paralelismo com «com água»; a nota mantém a possibilidade de entender a expressão em sentido locativo ou de esfera.
translation_notes:
  register: Português moderno, corrente e digno, com ampla legibilidade brasileira. «Vocês» explicita o plural do grego; «os» retoma o mesmo referente de modo natural. A formulação evita linguagem arcaica e não especifica o modo do batismo.
