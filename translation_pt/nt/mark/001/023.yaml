lexical_decisions:
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Preserva a rapidez narrativa característica de Marcos e corresponde diretamente ao advérbio grego.
- source_word: ἦν
  choice: havia
  rationale: O verbo tem aqui sentido existencial; “havia” expressa naturalmente a presença do homem naquele lugar.
- source_word: συναγωγῇ αὐτῶν
  choice: sinagoga deles
  rationale: “Sinagoga” identifica claramente o local judaico, enquanto “deles” conserva o pronome do texto grego sem explicitar um referente além do que o contexto permite.
- source_word: ἄνθρωπος
  choice: um homem
  rationale: Neste relato, o substantivo masculino singular designa um indivíduo do sexo masculino.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: com um espírito impuro
  rationale: É uma formulação idiomática em português que mantém a associação expressa pelo grego sem acrescentar explicitamente a ideia interpretativa de possessão.
- source_word: ἀκαθάρτῳ
  choice: impuro
  rationale: “Impuro” conserva as conotações religiosas e morais do termo e é natural no português contemporâneo.
- source_word: ἀνέκραξεν
  choice: gritou
  rationale: O verbo grego indica um brado forte; “gritou” é direto, natural e não especifica indevidamente a emoção envolvida.
theological_decisions:
- issue: Formulação da aflição espiritual em ἐν πνεύματι ἀκαθάρτῳ
  choice: com um espírito impuro
  alternative: possuído por um espírito impuro
  rationale: A construção grega afirma uma relação estreita entre o homem e o espírito, mas não emprega nesta frase um verbo que signifique explicitamente “possuir”. A tradução evita transformar uma expressão ambígua em uma descrição doutrinariamente mais definida.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do original. “Imediatamente” mantém o ritmo marcante de Marcos; “gritou” oferece naturalidade sem enfraquecer a intensidade do verbo. Os dois marcadores foram colocados junto à expressão a que suas notas efetivamente se referem.
