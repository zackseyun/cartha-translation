  text: 'E imediatamente, na sinagoga deles, havia um homem com um espírito impuro[a][b], e ele gritou:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “em um espírito impuro”.'
