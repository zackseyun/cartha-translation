id: MRK.1.10
reference: Mark 1:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀναβαίνων ⸀ἐκ τοῦ ὕδατος εἶδεν σχιζομένους τοὺς οὐρανοὺς καὶ τὸ πνεῦμα ⸀ὡς περιστερὰν καταβαῖνον ⸀εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/010.yaml
  text: And immediately[a], as he was coming up out of the water[b], he saw the heavens being torn open and the Spirit descending like a dove upon him.
translation:
  language: pt
  text: E logo, quando estava saindo da água, ele viu os céus se rasgando[a] e o Espírito descendo como uma pomba sobre ele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os céus sendo rasgados». O verbo grego é mais forte do que simplesmente «abrindo-se».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «para dentro dele». A preposição grega εἰς pode ter esse sentido, mas, neste contexto, «sobre ele» expressa de modo mais natural a descida do Espírito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: logo
  rationale: Preserva a urgência narrativa característica de Marcos em português atual, sem recorrer ao mais pesado «imediatamente».
- source_word: ἀναβαίνων ἐκ τοῦ ὕδατος
  choice: quando estava saindo da água
  rationale: Expressa a simultaneidade do particípio presente com o verbo principal e verte ἐκ como movimento para fora da água em linguagem natural.
- source_word: εἶδεν
  choice: ele viu
  rationale: Tradução direta do aoristo de percepção, mantendo Jesus como sujeito explícito para maior clareza em português.
- source_word: σχιζομένους τοὺς οὐρανούς
  choice: os céus se rasgando
  rationale: Mantém a imagem forte e dinâmica de σχίζω, mais intensa do que simplesmente «se abrindo», e conserva o plural de οὐρανούς.
- source_word: τὸ πνεῦμα
  choice: o Espírito
  rationale: O contexto aponta para o Espírito divino, mas o texto grego não acrescenta explicitamente «Santo»; a tradução preserva essa forma.
- source_word: ὡς περιστερὰν
  choice: como uma pomba
  rationale: Mantém a comparação sem decidir se ela diz respeito à aparência, ao modo de descida ou a ambos.
- source_word: καταβαῖνον
  choice: descendo
  rationale: Corresponde de perto ao movimento indicado por καταβαίνω e combina com o registro digno da narrativa.
- source_word: εἰς αὐτόν
  choice: sobre ele
  rationale: No contexto da descida do Espírito, «sobre ele» comunica naturalmente a relação pretendida, embora εἰς também possa admitir a leitura literal «para dentro dele».
theological_decisions:
- issue: Identidade de «o Espírito»
  choice: o Espírito divino, traduzido como «o Espírito»
  alternative: o Espírito Santo
  rationale: O contexto do batismo identifica o referente, mas a formulação grega é τὸ πνεῦμα, sem o adjetivo «Santo»; evita-se acrescentar uma especificação ausente.
- issue: Sentido exato da comparação com a pomba
  choice: manter a comparação aberta com «como uma pomba»
  alternative: o Espírito assumiu a forma de uma pomba ou desceu à maneira de uma pomba
  rationale: ὡς περιστερὰν não determina se a semelhança está na forma, no movimento ou em ambos; a tradução não resolve essa ambiguidade genuína.
- issue: Direção expressa por εἰς αὐτόν
  choice: sobre ele
  alternative: para dentro dele
  rationale: «Sobre ele» se ajusta ao idioma da descida do Espírito e ao português natural, enquanto a alternativa lexicalmente possível é registrada em nota para não ocultar a tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Logo» sustenta o ritmo vivo de Marcos; «se rasgando» preserva a força imagética sem soar artificial. As notas foram colocadas junto às expressões a que efetivamente se referem.
