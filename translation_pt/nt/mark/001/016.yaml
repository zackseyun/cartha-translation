  text: ⸂Καὶ παράγων⸃ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν Σίμωνα καὶ Ἀνδρέαν τὸν ⸀ἀδελφὸν Σίμωνος ⸀ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/016.yaml
  text: And as he was passing along beside the Sea of Galilee, he saw Simon and Andrew, Simon’s brother, casting a net into the sea, for they were fishermen.
translation:
  language: pt
  text: E, enquanto passava junto ao mar da Galileia, ele viu Simão e André, irmão de Simão, lançando uma rede ao mar, pois eram pescadores.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ παράγων
  choice: E, enquanto passava
  rationale: O particípio presente indica uma ação em andamento e contemporânea ao verbo principal; “enquanto passava” preserva essa relação temporal, e “E” mantém a ligação narrativa de Καί.
- source_word: παρὰ τὴν θάλασσαν
  choice: junto ao mar
  rationale: παρά com o acusativo indica movimento ao longo de ou nas proximidades de algo. “Junto ao mar” é natural em português e conserva o cenário.
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: o mar da Galileia
  rationale: Embora geograficamente seja um lago, θάλασσα e o nome tradicional em português justificam “mar da Galileia”.
- source_word: εἶδεν
  choice: viu
  rationale: Tradução direta do aoristo de ὁράω, sem acrescentar a nuance interpretativa de “notou”.
- source_word: Σίμωνα καὶ Ἀνδρέαν
  choice: Simão e André
  rationale: Empregam-se as formas tradicionais e amplamente reconhecidas desses nomes em português.
- source_word: τὸν ἀδελφὸν Σίμωνος
  choice: irmão de Simão
  rationale: A expressão identifica André por aposição. A formulação é concisa e natural em português.
- source_word: ἀμφιβάλλοντας
  choice: lançando uma rede
  rationale: O verbo designa o ato de lançar uma rede de pesca. A explicitação de “uma rede” está contida no sentido lexical e produz português claro sem especificar indevidamente um tipo regional de rede.
- source_word: ἐν τῇ θαλάσσῃ
  choice: ao mar
  rationale: Embora ἐν costume significar “em”, com o ato de lançar uma rede a expressão portuguesa idiomática “ao mar” comunica adequadamente o movimento pretendido.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: pois eram pescadores
  rationale: γάρ introduz a explicação para a atividade descrita; “pois” preserva essa função com fluidez narrativa.
