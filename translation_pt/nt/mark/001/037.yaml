  yaml_path: translation/nt/mark/001/037.yaml
  text: And they found him and said to him[a], “Everyone is looking for you.”
translation:
  language: pt
  text: 'E encontraram-no e lhe disseram: “Todos estão procurando você[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Todos estão buscando você.” O verbo grego ζητέω também pode ser traduzido por “buscar”, mas, neste contexto, provavelmente se refere às pessoas tentando localizar Jesus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρον
  choice: encontraram
  rationale: O aoristo de εὑρίσκω apresenta o resultado bem-sucedido da busca; “encontraram” é a equivalência narrativa mais direta e natural.
- source_word: λέγουσιν
  choice: disseram
  rationale: Embora seja um presente histórico no grego, o pretérito perfeito é idiomático na narrativa portuguesa e preserva a sequência dos acontecimentos.
- source_word: ὅτι
  choice: discurso direto introduzido por dois-pontos
  rationale: Neste contexto, ὅτι introduz o conteúdo da fala; a pontuação e as aspas expressam isso naturalmente em português.
- source_word: Πάντες
  choice: Todos
  rationale: O plural substantivado refere-se coletivamente às pessoas que procuravam Jesus no contexto imediato, sem exigir universalidade absoluta.
- source_word: ζητοῦσίν σε
  choice: estão procurando você
  rationale: ζητέω pode significar procurar ou buscar. Aqui, o contexto favorece pessoas tentando localizar Jesus; “procurando você” é claro e corrente no português moderno.
- source_word: καὶ
  choice: E
  rationale: Mantém a conexão simples e o ritmo narrativo característico de Marcos.
- source_word: αὐτὸν / αὐτῷ / σε
  choice: o / lhe / você
  rationale: 'Os pronomes são vertidos segundo suas funções sintáticas: objeto de encontrar, destinatário da fala e objeto da procura.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “disseram-lhe” mantém clareza formal sem soar excessivamente arcaica; na fala citada, “você” é natural e evita a ambiguidade regional de outras formas de tratamento.
