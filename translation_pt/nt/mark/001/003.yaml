  text: φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/003.yaml
  text: 'A voice of one crying out in the wilderness: ‘Prepare the way of the Lord[b][a]; make his paths straight,’'
translation:
  language: pt
  text: 'Uma voz de quem clama no deserto: “Preparem o caminho do Senhor[b]; endireitem as suas veredas”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, com outra pontuação da citação de Isaías: “Uma voz de quem clama: ‘No deserto, preparem o caminho do Senhor; endireitem as suas veredas’”.'
    reason: alternative_reading
  - marker: b
    text: “Senhor” traduz o grego kyriou; a citação remete a Isaías 40:3, onde o texto hebraico se refere ao SENHOR (YHWH).
    reason: cross_reference
lexical_decisions:
- source_word: φωνὴ βοῶντος
  choice: Uma voz clama
  rationale: Expressa de modo natural em português o idiomatismo grego, literalmente “voz de alguém que clama”, preservando a proclamação vigorosa sem uma construção pesada.
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: ἔρημος designa uma região desabitada ou erma; “deserto” é claro, corrente e adequado tanto ao cenário de Marcos quanto à citação profética.
- source_word: Ἑτοιμάσατε
  choice: Preparem
  rationale: O imperativo plural convoca os ouvintes diretamente a uma preparação decisiva; a forma plural explícita evita a ambiguidade que “preparai” ou “prepare” criaria no português moderno.
- source_word: τὴν ὁδὸν
  choice: o caminho
  rationale: “Caminho” conserva tanto a imagem concreta de uma via quanto seu alcance profético e metafórico.
- source_word: κυρίου
  choice: do Senhor
  rationale: Reproduz o genitivo grego e mantém o título κύριος, enquanto a nota registra o pano de fundo hebraico da citação.
- source_word: εὐθείας ποιεῖτε
  choice: endireitem
  rationale: O verbo português incorpora naturalmente a ideia de “tornar retas”, comunicando com clareza a ordem grega sem perder seu sentido.
- source_word: τὰς τρίβους αὐτοῦ
  choice: as suas veredas
  rationale: “Veredas” preserva a imagem plural de trilhas ou vias e distingue estilisticamente τρίβους de ὁδόν; “suas” retoma o Senhor de modo natural.
theological_decisions:
- issue: Tradução de κύριος numa citação de Isaías em que o hebraico se refere a YHWH
  choice: Senhor
  alternative: SENHOR
  rationale: O texto principal traduz diretamente o grego κύριος como “Senhor”. A nota preserva a importante relação com Isaías 40:3 e com o nome divino no texto hebraico, sem substituir no corpo da tradução o termo efetivamente presente em Marcos.
- issue: Ligação sintática de ἐν τῇ ἐρήμῳ (“no deserto”)
  choice: Ligado a “clama”
  alternative: Ligado a “Preparem o caminho do Senhor”
  rationale: A redação de Marcos é lida naturalmente como “uma voz clama no deserto”. Como a pontuação não fazia parte dos manuscritos gregos antigos e a citação de Isaías admite a outra divisão tradicional, a alternativa é explicitada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “preparem/endireitem” representa os imperativos plurais gregos. A formulação “Uma voz clama” privilegia naturalidade sem apagar a estrutura ou a força do original. Todos os marcadores de nota aparecem no texto principal.
