  terminology: “Senhor” traduz corretamente κυρίου, e a nota explica de modo adequado a relação da citação com Isaías 40:3 e YHWH. “Deserto”, “caminho” e “veredas” são escolhas semanticamente defensáveis. A nota de pontuação preserva corretamente a alternativa de ligação de “no deserto”.
