  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ἐξελθὼν ἤρξατο κηρύσσειν πολλὰ καὶ διαφημίζειν τὸν λόγον, ὥστε μηκέτι αὐτὸν δύνασθαι φανερῶς εἰς πόλιν εἰσελθεῖν, ἀλλὰ ἔξω ⸀ἐπ’ ἐρήμοις τόποις ἦν· καὶ ἤρχοντο πρὸς αὐτὸν ⸀πάντοθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/045.yaml
  text: But after he went out, he began to proclaim widely and to spread the message, so that Jesus could no longer enter a town openly, but stayed outside in deserted places; and people were coming to him from everywhere.
translation:
  language: pt
  text: Mas ele, depois de sair, começou a proclamar amplamente e a espalhar a notícia, de modo que Jesus já não podia entrar abertamente em nenhuma cidade, mas permanecia do lado de fora, em lugares desertos. E vinham a ele de toda parte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρύσσειν πολλὰ
  choice: proclamar muitas coisas
  rationale: Preserva o valor adverbial de πολλὰ ligado a κηρύσσειν sem acrescentar um objeto ausente no grego; em português, a formulação comunica que ele divulgava amplamente o ocorrido.
- source_word: διαφημίζειν τὸν λόγον
  choice: espalhar a notícia
  rationale: Aqui λόγος é a notícia ou relato do que havia acontecido, e διαφημίζειν indica torná-la amplamente conhecida.
- source_word: φανερῶς
  choice: abertamente
  rationale: Expressa a ideia de entrada pública e visível, em contraste com a permanência em lugares afastados.
- source_word: ἐπ’ ἐρήμοις τόποις
  choice: em lugares desertos
  rationale: Mantém o plural e o sentido de locais ermos, desabitados ou afastados, sem sugerir necessariamente um deserto árido.
- source_word: ἤρχοντο ... πάντοθεν
  choice: vinham ... de toda parte
  rationale: O imperfeito sugere movimento contínuo ou repetido, enquanto πάντοθεν indica todas as direções ou lugares.
theological_decisions:
- issue: Referente de αὐτόν em μηκέτι αὐτὸν δύνασθαι
  choice: Jesus
  alternative: ele
  rationale: O referente gramatical é Jesus, embora o sujeito mais próximo seja o homem curado; explicitar o nome evita ambiguidade enganosa em português e concorda com o contexto narrativo.
- issue: Objeto não expresso de κηρύσσειν
  choice: não inserir “isso” nem identificar explicitamente o conteúdo
  alternative: proclamar isso por toda parte
  rationale: O grego não traz objeto explícito para κηρύσσειν; “muitas coisas” preserva melhor a construção e evita restringir indevidamente o conteúdo da proclamação.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa natural. “Permanecia” representa o imperfeito ἦν de modo idiomático; “em nenhuma cidade” comunica naturalmente a construção genérica sem artigo εἰς πόλιν.
