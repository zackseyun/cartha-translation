source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/025.yaml
  text: And Jesus rebuked him[a], saying, “Be silent, and come out of him!”
translation:
  language: pt
  text: 'E Jesus o repreendeu, dizendo: “Cale-se[a] e saia dele!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Seja amordaçado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: repreendeu
  rationale: Expressa uma censura firme e autoritativa, sentido característico de ἐπιτιμάω neste contexto, sem ampliar o verbo para uma formulação mais interpretativa como “ordenou severamente”.
- source_word: αὐτῷ
  choice: o
  rationale: O pronome masculino singular remete ao espírito impuro, a quem Jesus se dirige diretamente; o contexto e a ordem “saia dele” distinguem o espírito do homem.
- source_word: λέγων
  choice: dizendo
  rationale: Preserva de modo natural em português a ligação participial que introduz o conteúdo da repreensão.
- source_word: Φιμώθητι
  choice: Cale-se
  rationale: O imperativo passivo de φιμόω significa literalmente ser amordaçado, mas aqui funciona idiomaticamente como uma ordem enérgica para ficar em silêncio. “Cale-se” conserva a força e é natural no português atual.
- source_word: ἔξελθε
  choice: saia
  rationale: No contexto de exorcismo, indica sair de dentro da pessoa afligida. “Saia” é direto, idiomático e adequado ao imperativo.
- source_word: ἐξ αὐτοῦ
  choice: dele
  rationale: ἐξ indica movimento para fora do interior. Com “saia”, a forma “dele” comunica naturalmente em português que o espírito deve deixar o homem.
theological_decisions:
- issue: Referente da repreensão de Jesus
  choice: Jesus se dirige diretamente ao espírito impuro, não ao homem.
  alternative: Entender o homem como referente imediato da repreensão.
  rationale: A ordem “saia dele” distingue claramente o destinatário da ordem — o espírito — do homem do qual ele deve sair, preservando a distinção narrativa sem acrescentar afirmações doutrinárias.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Cale-se” mantém o tom abrupto e autoritativo; a imagem literal de amordaçar é preservada em nota.
