  text: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις ἦλθεν Ἰησοῦς ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας καὶ ἐβαπτίσθη ⸂εἰς τὸν Ἰορδάνην ὑπὸ Ἰωάννου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/009.yaml
  text: And it happened in those days that Jesus came from Nazareth of Galilee and was baptized in the Jordan by John[a].
translation:
  language: pt
  text: E aconteceu, naqueles dias, que Jesus veio de Nazaré da Galileia e foi batizado no Jordão por João.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para dentro do Jordão”. A preposição grega pode ser traduzida mais literalmente dessa forma.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: E aconteceu
  rationale: Reproduz de modo natural a transição narrativa do grego, mantendo seu tom bíblico sem recorrer a uma fórmula arcaica como “e sucedeu”.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: naqueles dias
  rationale: É a correspondência temporal direta e idiomática, preservando o leve tom solene da narrativa.
- source_word: ἦλθεν
  choice: veio
  rationale: Traduz o verbo comum de movimento sem acrescentar a ênfase no ponto de chegada que “chegou” poderia sugerir.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας
  choice: de Nazaré da Galileia
  rationale: Mantém de perto a construção identificadora do lugar e soa natural em português.
- source_word: ἐβαπτίσθη
  choice: foi batizado
  rationale: Expressa claramente o aoristo passivo e evita restringir a tradução a uma formulação denominacionalmente marcada sobre o modo do batismo.
- source_word: εἰς τὸν Ἰορδάνην
  choice: no Jordão
  rationale: É a forma idiomática em português para indicar o local do batismo; a alternativa mais literal “para dentro do Jordão” preserva a força direcional possível de εἰς e é registrada em nota.
- source_word: ὑπὸ Ἰωάννου
  choice: por João
  rationale: ὑπό com genitivo indica o agente pessoal da construção passiva, expresso diretamente por “por João”.
theological_decisions:
- issue: Tradução de βαπτίζω em contexto de sensibilidade denominacional
  choice: foi batizado
  alternative: foi imerso
  rationale: “Foi batizado” relata fielmente o acontecimento sem impor uma especificação do modo além do que a formulação do versículo exige.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência narrativa bíblica. “Galileia” segue a ortografia brasileira moderna; a redação permanece compreensível internacionalmente.
