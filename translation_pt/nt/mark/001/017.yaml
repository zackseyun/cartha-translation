source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς γενέσθαι ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/017.yaml
  text: And Jesus said to them, “Come after me, and I will make you become fishers of men.”
translation:
  language: pt
  text: 'E Jesus lhes disse: “Sigam-me, e eu farei com que vocês se tornem pescadores de gente.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῦτε ὀπίσω μου
  choice: Venham após mim
  rationale: Preserva a imagem de seguir atrás de Jesus e o chamado direto, em português natural e digno.
- source_word: ποιήσω ὑμᾶς γενέσθαι
  choice: farei com que vocês se tornem
  rationale: Representa explicitamente tanto ποιήσω quanto γενέσθαι, mantendo a ideia de que Jesus produzirá uma transformação progressiva nos discípulos.
- source_word: ἁλιεῖς ἀνθρώπων
  choice: pescadores de gente
  rationale: Mantém a metáfora de pescadores e traduz ἀνθρώπων de maneira inclusiva e corrente; no contexto, o plural genérico se refere a seres humanos, não exclusivamente a homens do sexo masculino.
theological_decisions:
- issue: Agência de Jesus na formação dos discípulos
  choice: eu farei com que vocês se tornem
  alternative: eu farei de vocês
  rationale: A formulação escolhida conserva a construção incomum do grego e ressalta que Jesus é o agente da transformação, sem definir além do texto como esse processo ocorre.
- issue: Alcance de ἀνθρώπων
  choice: gente
  alternative: homens
  rationale: ἀνθρώπων é genérico neste contexto. “Gente” evita uma leitura restrita ao sexo masculino sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. “Após mim” mantém solenidade moderada e proximidade formal com a imagem grega; “vocês” expressa naturalmente o plural de ὑμᾶς.
