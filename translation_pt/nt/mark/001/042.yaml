  text: καὶ ⸀εὐθὺς ἀπῆλθεν ἀπ’ αὐτοῦ ἡ λέπρα, καὶ ἐκαθαρίσθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/042.yaml
  text: And immediately the leprosy left him[a], and he was cleansed.
translation:
  language: pt
  text: E, imediatamente, a lepra o deixou, e ele foi purificado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ficou limpo». O verbo também inclui a ideia de purificação ritual, não apenas de recuperação física.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Preserva a prontidão característica da narrativa de Marcos em português moderno e natural.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: o deixou
  rationale: Expressa de modo idiomático o sentido literal de que a lepra se afastou dele, sem perder a relação indicada por ἀπ’ αὐτοῦ.
- source_word: λέπρα
  choice: a lepra
  rationale: É a forma bíblica tradicional e concisa; embora o termo grego possa abranger doenças de pele além da hanseníase moderna, uma paráfrase mais específica excederia o texto.
- source_word: ἐκαθαρίσθη
  choice: ele ficou purificado
  rationale: Mantém tanto a recuperação física quanto a dimensão de pureza ritual presente em καθαρίζω; em português, «ficou purificado» soa mais natural aqui do que «foi purificado».
theological_decisions:
- issue: Relação entre cura física e pureza ritual em ἐκαθαρίσθη
  choice: ele ficou purificado
  alternative: ele foi curado; ele ficou limpo
  rationale: A tradução evita reduzir o acontecimento à cura física e conserva a dimensão cultual de restauração da pureza, sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação simples preserva o ritmo direto de Marcos.
