  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂καὶ ἐξῆλθεν⸃ ἡ ἀκοὴ αὐτοῦ εὐθὺς ⸀πανταχοῦ εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/028.yaml
  text: And the news about him went out at once everywhere into the whole surrounding region of Galilee[a][b].
translation:
  language: pt
  text: E a notícia a respeito dele se espalhou imediatamente por todos os lugares de toda a região ao redor da Galileia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o relato a respeito dele” ou “a fama dele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: se espalhou
  rationale: Embora o sentido básico seja “saiu”, com ἀκοή o português natural descreve a difusão da notícia com “se espalhou”, preservando a imagem de propagação no contexto.
- source_word: ἀκοὴ
  choice: notícia
  rationale: Aqui designa aquilo que se ouve, isto é, notícia ou relato acerca de Jesus; “notícia” é clara e corrente, sem enfatizar indevidamente reputação ou celebridade.
- source_word: αὐτοῦ
  choice: a respeito dele
  rationale: O genitivo indica o conteúdo da notícia, não posse; “a respeito dele” expressa isso com clareza.
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Mantém a ênfase marcana na rapidez da ação em linguagem portuguesa natural e digna.
- source_word: πανταχοῦ
  choice: por toda parte
  rationale: Equivalente idiomático direto de “em todo lugar”, destacando a ampla difusão.
- source_word: εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας
  choice: em toda a região ao redor da Galileia
  rationale: O valor direcional/resultativo de εἰς é expresso naturalmente por “em” após “se espalhou”; “toda” preserva a abrangência, e “região ao redor da Galileia” mantém a relação geográfica potencialmente ambígua do grego.
theological_decisions:
- issue: Referente de ἀκοὴ αὐτοῦ
  choice: a notícia a respeito dele
  alternative: a fama dele
  rationale: “Notícia” representa o relato que circulava sobre Jesus sem acrescentar a noção mais forte de reputação ou celebridade contida em “fama”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita o pouco natural “saiu... para dentro” e conserva tanto a rapidez quanto a extensão da propagação.
