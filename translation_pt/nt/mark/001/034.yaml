  text: καὶ ἐθεράπευσεν πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις, καὶ δαιμόνια πολλὰ ἐξέβαλεν, καὶ οὐκ ἤφιεν λαλεῖν τὰ δαιμόνια, ὅτι ᾔδεισαν ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/034.yaml
  text: And he healed many who were sick with various diseases[a], and he cast out many demons, and he would not allow the demons to speak, because they knew him.
translation:
  language: pt
  text: 'E curou muitos que sofriam de várias doenças, expulsou muitos demônios e não permitia que os demônios falassem, porque o conheciam.[a]


    [a] Ou: “sabiam quem ele era”. O grego diz simplesmente: “o conheciam”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sabiam quem ele era”. O grego diz simplesmente: “o conheciam”.'
    reason: Registra uma explicitação contextual possível sem inseri-la no texto principal.
lexical_decisions:
- source_word: ἐθεράπευσεν
  choice: curou
  rationale: “Curar” expressa de modo natural e direto o sentido de θεραπεύω neste contexto de enfermidades.
- source_word: πολλοὺς κακῶς ἔχοντας
  choice: muitos que sofriam
  rationale: A expressão idiomática κακῶς ἔχω indica estar doente ou enfermo. Com o complemento “de várias doenças”, “que sofriam” evita repetição e soa natural em português.
- source_word: ποικίλαις νόσοις
  choice: de várias doenças
  rationale: ποικίλος indica variedade, e νόσος significa doença ou enfermidade. A construção com “sofriam de” é idiomática em português.
- source_word: δαιμόνια πολλὰ ἐξέβαλεν
  choice: expulsou muitos demônios
  rationale: “Expulsar” preserva a força de ἐκβάλλω e é a formulação corrente em contextos de exorcismo.
- source_word: οὐκ ἤφιεν
  choice: não permitia
  rationale: O imperfeito grego apresenta a ação em curso ou reiterada durante a cena; o imperfeito português mantém esse aspecto.
- source_word: λαλεῖν
  choice: falassem
  rationale: “Falar” é o equivalente comum de λαλέω; o subjuntivo é exigido naturalmente após “não permitia que”.
- source_word: ὅτι
  choice: porque
  rationale: Neste contexto, ὅτι introduz de modo mais natural a razão pela qual Jesus silenciava os demônios.
- source_word: ᾔδεισαν αὐτόν
  choice: o conheciam
  rationale: Mantém a formulação concisa do grego, cujo objeto é simplesmente αὐτόν, “o”, sem explicitar além do texto em que sentido os demônios o conheciam.
theological_decisions:
- issue: Se o conhecimento dos demônios deve ser expandido em uma confissão cristológica explícita
  choice: o conheciam
  alternative: sabiam quem ele era
  rationale: O grego afirma apenas que os demônios o conheciam. A tradução principal preserva essa concisão e a tensão teológica do texto, sem importar uma identificação mais explícita de passagens próximas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação narrativa foi mantida, e o imperfeito “não permitia” preserva o aspecto contínuo ou reiterado da proibição.
