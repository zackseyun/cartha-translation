base_translation:
  language: en
  yaml_path: translation/nt/mark/001/030.yaml
  text: Simon’s mother-in-law was lying sick with a fever[b][a], and immediately they told him about her.
translation:
  language: pt
  text: A sogra de Simão estava deitada, com febre, e imediatamente lhe falaram[a] a respeito dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “lhe falam”; Marcos usa o presente histórico para dar vivacidade à narrativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: πενθερὰ
  choice: sogra
  rationale: É o termo comum e preciso em português para a mãe do cônjuge; no contexto, refere-se à sogra de Simão.
- source_word: κατέκειτο
  choice: estava deitada
  rationale: Preserva o aspecto durativo do imperfeito e a ideia de permanecer deitada, sem acrescentar que ela estivesse permanentemente acamada.
- source_word: πυρέσσουσα
  choice: com febre
  rationale: Expressa de modo natural e claro o particípio que indica que ela sofria de febre.
- source_word: εὐθὺς
  choice: logo
  rationale: Comunica a prontidão característica da narrativa de Marcos em português natural e conciso.
- source_word: λέγουσιν αὐτῷ
  choice: lhe falaram
  rationale: Traduz idiomaticamente a comunicação dirigida a Jesus; o pretérito mantém a fluidez da narrativa em português, enquanto a nota registra o presente histórico grego.
- source_word: περὶ αὐτῆς
  choice: a respeito dela
  rationale: 'Corresponde naturalmente ao sentido de περί com genitivo: ''sobre'' ou ''a respeito de'' alguém.'
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui é um conectivo narrativo leve. A sequência da frase em português já cumpre essa função sem exigir 'mas', 'ora' ou 'então', que poderiam acrescentar contraste ou temporalidade indevidos.
