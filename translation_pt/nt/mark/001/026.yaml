  text: καὶ σπαράξαν αὐτὸν τὸ πνεῦμα τὸ ἀκάθαρτον καὶ ⸀φωνῆσαν φωνῇ μεγάλῃ ἐξῆλθεν ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/026.yaml
  text: And the unclean spirit[a], after convulsing him and crying out with a loud voice[b], came out of him.
translation:
  language: pt
  text: E o espírito impuro, depois de fazê-lo ter convulsões e de gritar em alta voz, saiu dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπαράξαν
  choice: depois de fazê-lo ter convulsões
  rationale: O particípio aoristo indica uma ação anterior à saída do espírito. A formulação expressa com clareza que o espírito causou as convulsões, sem recorrer ao literalismo potencialmente enganoso de “dilacerá-lo”.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: o espírito impuro
  rationale: Expressão neotestamentária para um espírito demoníaco. “Impuro” preserva a ideia de impureza ritual e moral e soa natural no português moderno.
- source_word: φωνῆσαν
  choice: gritar
  rationale: O particípio descreve uma forte emissão vocal associada à saída. “Gritar” é direto e não acrescenta uma emoção específica.
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: O dativo expressa modo; a formulação preserva a referência concreta à voz e comunica naturalmente sua intensidade.
- source_word: ἐξῆλθεν ἐξ αὐτοῦ
  choice: saiu dele
  rationale: Tradução direta e idiomática da fórmula de expulsão, preservando o sentido pessoal e espacial do espírito deixando o homem.
- source_word: καὶ ... καὶ
  choice: E ... e
  rationale: Mantém a coordenação simples e o fluxo narrativo característico de Marcos, enquanto os particípios são integrados naturalmente à frase portuguesa.
theological_decisions:
- issue: Natureza da entidade que possuía o homem
  choice: A expressão refere-se a um espírito demoníaco pessoal.
  alternative: Uma força maligna impessoal.
  rationale: 'No mundo narrativo de Marcos, o espírito impuro atua como agente pessoal: provoca convulsões, grita e sai do homem. A tradução conserva essa agência sem acrescentar elaboração doutrinária.'
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A construção “fazê-lo ter convulsões” evita a possível ambiguidade de “convulsioná-lo” e deixa explícita a causalidade presente no contexto.
