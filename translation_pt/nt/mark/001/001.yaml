  yaml_path: translation/nt/mark/001/001.yaml
  text: The beginning of the good news of Jesus the Messiah[a][b].
translation:
  language: pt
  text: O início da boa notícia de Jesus, o Messias.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «evangelho». A palavra grega εὐαγγέλιον significa «boa notícia» e é tradicionalmente traduzida por «evangelho».
    reason: lexical_alternative
  - marker: b
    text: Ou «Jesus Cristo». A palavra grega Χριστός significa «Messias» quando empregada como título.
    reason: alternative_reading
  - marker: c
    text: A expressão «de Jesus» pode indicar a boa notícia a respeito de Jesus ou a boa notícia que vem dele; o grego permite essa concisão.
    reason: source_ambiguity
lexical_decisions:
- source_word: Ἀρχὴ
  choice: O início
  rationale: Expressa naturalmente o substantivo que abre o texto, sem transformá-lo numa oração completa nem decidir se funciona como título ou como começo da narrativa.
- source_word: εὐαγγελίου
  choice: boa notícia
  rationale: Traduz de modo transparente o sentido de εὐαγγέλιον em português atual; a forma tradicional «evangelho» é preservada em nota.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Emprega a forma portuguesa convencional do nome próprio.
- source_word: χριστοῦ
  choice: o Messias
  rationale: Traduz Χριστός como título e não como se fosse sobrenome; o artigo é acrescentado por naturalidade em português.
theological_decisions:
- issue: Traduzir Χριστός como título ou conservar a forma tradicional «Cristo»
  choice: o Messias
  alternative: Jesus Cristo
  rationale: Neste enunciado de abertura, Χριστός identifica Jesus por sua função messiânica. «Messias» torna explícito o valor do título, enquanto a alternativa tradicional é registrada em nota.
- issue: Relação expressa pelo genitivo Ἰησοῦ
  choice: de Jesus
  alternative: sobre Jesus; anunciada por Jesus
  rationale: A construção portuguesa «de Jesus» conserva a concisão e a possível amplitude do genitivo grego, sem decidir silenciosamente se a notícia tem Jesus como conteúdo, origem ou proclamador.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. «O início» soa natural como abertura nominal; «boa notícia» comunica o sentido lexical sem depender de vocabulário eclesiástico, que permanece disponível em nota.
