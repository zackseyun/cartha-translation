  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀κατεδίωξεν αὐτὸν ⸀Σίμων καὶ οἱ μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/036.yaml
  text: And Simon and those with him pursued him,[a]
translation:
  language: pt
  text: E Simão e os que estavam com ele foram atrás de Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «procuraram Jesus com insistência». O verbo grego pode indicar uma busca empenhada ou a ação de ir no encalço de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδίωξεν
  choice: foram atrás de
  rationale: O verbo καταδιώκω tem força maior que um simples «procurar» e pode indicar perseguir ou buscar alguém com empenho. «Foram atrás de» conserva essa intensidade sem sugerir necessariamente hostilidade.
- source_word: αὐτὸν
  choice: de Jesus
  rationale: O pronome retoma Jesus no contexto imediato. Repetir o nome evita a possível ambiguidade de «dele» depois de «Simão e os que estavam com ele».
- source_word: Σίμων
  choice: Simão
  rationale: Forma tradicional e corrente do nome em português.
- source_word: οἱ μετ’ αὐτοῦ
  choice: os que estavam com ele
  rationale: Tradução próxima da expressão grega, sem especificar além do texto se eram discípulos, amigos ou outros companheiros.
- source_word: καὶ
  choice: E
  rationale: Mantém a ligação simples com a narrativa anterior e o estilo paratático característico de Marcos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e narrativo, com leitura natural no Brasil e ampla compreensão internacional. «Foram atrás de» preserva a energia do verbo grego sem o tom necessariamente hostil que «perseguiram» pode assumir em português.
