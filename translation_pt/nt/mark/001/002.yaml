id: MRK.1.2
reference: Mark 1:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Καθὼς γέγραπται ἐν ⸂τῷ Ἠσαΐᾳ τῷ προφήτῃ⸃· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/002.yaml
  text: 'Just as it is written in Isaiah the prophet: ‘Behold[a], I send my messenger before your face[c][b], who will prepare your way.’'
translation:
  language: pt
  text: 'Assim como está escrito no profeta Isaías[a]: “Eis que envio o meu mensageiro diante de ti,[c] o qual preparará o teu caminho”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “nos profetas” em vez de “no profeta Isaías”.
    reason: textual_variant
  - marker: b
    text: A citação combina palavras de Malaquias 3:1 e Isaías 40:3.
    reason: cross_reference
  - marker: c
    text: Ou “à tua frente”. Literalmente, “diante da tua face”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς
  choice: Assim como
  rationale: Preserva a força comparativa que liga a afirmação ao que está escrito, em português natural.
- source_word: γέγραπται
  choice: está escrito
  rationale: Reproduz a fórmula de citação das Escrituras e o estado presente resultante expresso pelo perfeito passivo.
- source_word: ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ
  choice: no profeta Isaías
  rationale: Identifica diretamente a fonte profética em uma ordem idiomática no português, sem explicitar “livro”, que não aparece no grego.
- source_word: Ἰδοὺ
  choice: Eis que
  rationale: Mantém a chamada solene de atenção própria da linguagem profética, sem recorrer a uma expressão coloquial.
- source_word: ἀποστέλλω
  choice: envio
  rationale: Traduz diretamente o presente grego e conserva a vivacidade da declaração profética.
- source_word: ἄγγελόν
  choice: mensageiro
  rationale: O termo pode designar alguém que leva uma mensagem; neste contexto, refere-se ao precursor humano, não necessariamente a um ser celestial.
- source_word: πρὸ προσώπου σου
  choice: diante de ti
  rationale: Expressa naturalmente em português a ideia de estar à frente ou na presença de alguém, preservando em nota a forma mais literal.
- source_word: κατασκευάσει
  choice: preparará
  rationale: Comunica de modo conciso a ação futura de aprontar ou deixar pronto.
- source_word: τὴν ὁδόν σου
  choice: o teu caminho
  rationale: Conserva a imagem de caminho e sua possível força figurada.
theological_decisions:
- issue: A fórmula de citação nomeia Isaías, embora a citação reúna linguagem associada a Malaquias e Isaías.
  choice: Manter “no profeta Isaías” no texto principal.
  alternative: “nos profetas”
  rationale: A leitura adotada pelo SBLGNT nomeia Isaías. A tradução não harmoniza a tensão; registra em nota tanto a variante textual quanto a natureza composta da citação.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. “Eis que” preserva o tom profético elevado; “diante de ti” evita uma tradução excessivamente literal sem apagar a imagem original, registrada na nota.
