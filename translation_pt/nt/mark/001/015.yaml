id: MRK.1.15
reference: Mark 1:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ λέγων ὅτι Πεπλήρωται ὁ καιρὸς καὶ ἤγγικεν ἡ βασιλεία τοῦ θεοῦ· μετανοεῖτε καὶ πιστεύετε ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/015.yaml
  text: and saying[a], “The time has been fulfilled, and the kingdom of God has drawn near[b]. Repent and believe in the good news.”
translation:
  language: pt
  text: 'e dizia: “O tempo se cumpriu, e o Reino de Deus se aproximou[a]. Arrependam-se e creiam nas boas-novas[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o governo de Deus se aproximou”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “creiam no evangelho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπλήρωται
  choice: se cumpriu
  rationale: O perfeito grego apresenta o tempo determinado como tendo chegado ao cumprimento, com resultado vigente; a formulação portuguesa é natural e preserva esse valor.
- source_word: ὁ καιρὸς
  choice: O tempo
  rationale: Neste contexto, καιρός designa o momento decisivo ou determinado. “O tempo” mantém concisão e permite que o contexto comunique essa nuance.
- source_word: ἤγγικεν
  choice: se aproximou
  rationale: O perfeito indica uma aproximação já ocorrida cujo resultado presente permanece. “Se aproximou” conserva o movimento verbal sem reduzir a expressão a um simples estado.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: “Reino de Deus” é uma expressão clara, estabelecida e ampla, capaz de abranger tanto o governo régio de Deus quanto o âmbito associado a esse governo.
- source_word: μετανοεῖτε
  choice: Arrependam-se
  rationale: O imperativo convoca a uma mudança decisiva de mente, orientação e vida. “Arrependam-se” é a forma portuguesa corrente que preserva a força moral e religiosa do termo sem paráfrase redutora.
- source_word: πιστεύετε
  choice: creiam
  rationale: “Creiam” corresponde diretamente ao imperativo πιστεύετε e, com a preposição seguinte, expressa fé ou confiança dirigida às boas-novas.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: nas boas-novas
  rationale: εὐαγγέλιον significa notícia ou anúncio bom. “Boas-novas” é compreensível e preserva o sentido lexical, enquanto “evangelho” aparece como alternativa tradicional em nota.
- source_word: λέγων
  choice: e dizia
  rationale: O particípio liga esta fala à ação narrativa do versículo anterior. O imperfeito português produz uma continuação natural sem reproduzir de modo rígido a construção participial grega.
theological_decisions:
- issue: Sentido de βασιλεία τοῦ θεοῦ
  choice: Reino de Deus
  alternative: governo de Deus
  rationale: “Reino” preserva a amplitude e a ressonância canônica da expressão, sem restringi-la somente ao exercício dinâmico do governo nem somente a um território.
- issue: Força de μετανοεῖτε καὶ πιστεύετε
  choice: Arrependam-se e creiam
  alternative: Continuem se arrependendo e crendo
  rationale: Embora os imperativos presentes possam ter valor imperfectivo, os imperativos simples em português preservam a convocação urgente sem impor uma interpretação aspectual excessivamente explícita.
- issue: Relação temporal expressa por ἤγγικεν
  choice: se aproximou
  alternative: está próximo
  rationale: A escolha mantém a forma verbal de aproximação e o resultado presente do perfeito, sem decidir se o Reino chegou plenamente ou permanece apenas iminente.
- issue: Tradução de εὐαγγέλιον
  choice: boas-novas
  alternative: evangelho
  rationale: A expressão comunica de modo transparente o significado do termo grego; a alternativa tradicional é mantida em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. “Reino” recebe inicial maiúscula por referência específica ao Reino de Deus. A construção “e dizia” mantém a ligação narrativa com o versículo anterior. Todos os marcadores de nota aparecem no texto principal.
