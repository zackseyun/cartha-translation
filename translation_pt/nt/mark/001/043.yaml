  yaml_path: translation/nt/mark/001/043.yaml
  text: And after sternly warning him[a], he immediately sent him away[b],
translation:
  language: pt
  text: E, depois de adverti-lo severamente[a], imediatamente o mandou embora[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois de lhe dar uma ordem rigorosa”; o verbo grego também pode transmitir forte indignação ou repreensão severa.
    reason: lexical_alternative
  - marker: b
    text: Ou “o expulsou” / “o mandou sair”; o verbo grego é mais forte que um simples “mandou embora”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβριμησάμενος
  choice: depois de adverti-lo severamente
  rationale: O particípio transmite forte intensidade emocional, que neste contexto se expressa como advertência rigorosa. A formulação preserva tanto a força quanto o caráter diretivo, sem afirmar que Jesus condenou pessoalmente o homem.
- source_word: αὐτῷ
  choice: -lo
  rationale: O pronome no dativo se refere ao homem curado e é expresso naturalmente em português como objeto de “advertir”.
- source_word: εὐθύς
  choice: imediatamente
  rationale: Preserva a ideia de prontidão e o ritmo narrativo característico de Marcos em linguagem atual.
- source_word: ἐξέβαλεν
  choice: mandou-o embora
  rationale: O verbo é mais forte que um simples “despediu”, mas, por ter como objeto o homem curado e não um demônio, “mandou-o embora” comunica de modo natural uma dispensa enérgica. A nota registra alternativas mais literais e fortes.
- source_word: αὐτόν
  choice: -o
  rationale: Pronome acusativo referente ao mesmo homem, incorporado a “mandou-o”.
- source_word: καὶ
  choice: E
  rationale: Conjunção simples que dá continuidade à narrativa e preserva o estilo coordenativo de Marcos.
theological_decisions:
- issue: Tom da ação de Jesus para com o homem curado
  choice: Jesus o adverte e o manda embora com marcada severidade, sem que a tradução atribua a ele ira pecaminosa ou hostilidade.
  alternative: Jesus apenas lhe dá uma instrução firme, com pouca carga emocional; ou repreende pessoalmente o homem.
  rationale: Tanto ἐμβριμησάμενος quanto ἐξέβαλεν são expressões fortes. A tradução conserva essa força e a tensão do texto, mas não acrescenta um juízo sobre a moralidade da emoção de Jesus nem transforma a advertência em condenação pessoal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Adverti-lo severamente” e “mandou-o embora” mantêm a intensidade dos dois verbos sem produzir uma formulação artificial; as notas preservam as alternativas lexicais mais fortes.
