base_translation:
  language: en
  yaml_path: translation/nt/mark/001/006.yaml
  text: John was clothed with camel’s hair and a leather belt around his waist[a], and he was eating locusts and wild honey.
translation:
  language: pt
  text: João estava vestido com uma roupa de pelos de camelo e usava um cinto de couro em volta da cintura[a], e comia gafanhotos e mel silvestre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A roupa de João lembra a descrição de Elias em 2 Reis 1:8, contribuindo para a apresentação de João, em Marcos, como precursor profético.
    reason: cross_reference
lexical_decisions:
- source_word: ἐνδεδυμένος τρίχας καμήλου
  choice: vestia uma roupa de pelos de camelo
  rationale: O particípio perfeito descreve o estado habitual de João vestido desse material. A explicitação de “uma roupa” evita que “vestia pelos” pareça indicar pelos soltos e deixa claro que se tratava de uma peça feita de pelos de camelo.
- source_word: ζώνην δερματίνην
  choice: um cinto de couro
  rationale: Equivalente moderno e natural para o cinto ou faixa especificado como sendo de couro.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: em volta da cintura
  rationale: Expressa com clareza contemporânea a região da cintura/lombos, sem o arcaísmo de “lombos”.
- source_word: ἔσθων
  choice: comia
  rationale: O particípio presente, dentro do retrato descritivo, indica alimentação habitual ou característica; o imperfeito português transmite isso naturalmente.
- source_word: ἀκρίδας
  choice: gafanhotos
  rationale: É o sentido lexical normal do termo grego, referente aos insetos.
- source_word: μέλι ἄγριον
  choice: mel silvestre
  rationale: Tradução direta e idiomática para o mel encontrado na natureza.
- source_word: καὶ ἦν
  choice: João vestia
  rationale: A abertura com καί dá continuidade à narrativa. Em português, essa continuidade pode permanecer implícita, sem introduzir um marcador temporal inexistente no grego; a construção com “vestia” reproduz naturalmente o retrato descritivo.
theological_decisions:
- issue: Relação das roupas de João com a imagem profética de Elias
  choice: Manter no texto principal apenas a descrição da roupa e da alimentação de João.
  alternative: Identificar explicitamente João com Elias no texto principal.
  rationale: A roupa evoca 2 Reis 1:8, mas Marcos 1:6 não explicita essa identificação. A nota pode indicar a alusão sem transformar uma inferência intertextual em afirmação do versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Roupa de pelos de camelo” esclarece o material da veste; “cintura”, “gafanhotos” e “mel silvestre” são termos correntes. O imperfeito preserva o caráter descritivo e habitual do retrato.
