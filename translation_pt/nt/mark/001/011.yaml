  source_fidelity: 'A declaração é transmitida com fidelidade: «dos céus» preserva o plural de ἐκ τῶν οὐρανῶν, «Você é o meu Filho amado» representa adequadamente Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, e a posição inicial de «em você» conserva a ênfase da formulação grega. Contudo, «em você me agrado» é pouco idiomático no português moderno e pode soar ambíguo; «em você tenho prazer» comunica de modo mais claro a aprovação expressa por εὐδόκησα.'
