  text: καὶ φωνὴ ἐγένετο ἐκ τῶν οὐρανῶν· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν ⸀σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/011.yaml
  text: 'And a voice came from the heavens: “You are my beloved Son[b][a]; in you I am well pleased.”'
translation:
  language: pt
  text: 'E veio uma voz dos céus: “Você é o meu Filho amado; em você tenho prazer.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em você me alegro”. O verbo grego também pode ser traduzido no passado: “em você tive prazer”.'
    reason: alternative_reading
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: veio uma voz
  rationale: A construção idiomática descreve o surgimento da voz no curso da narrativa. “Veio uma voz” conserva essa força e soa natural em português.
- source_word: ἐκ τῶν οὐρανῶν
  choice: dos céus
  rationale: Preserva o plural do grego e é uma expressão natural em português.
- source_word: Σὺ εἶ
  choice: Você é
  rationale: O pronome explícito mantém a forma direta e enfática da declaração. “Você” oferece ampla legibilidade brasileira sem perder dignidade.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: o meu Filho amado
  rationale: Expressa naturalmente tanto a relação filial quanto o amor declarado. A inicial maiúscula em “Filho” sinaliza o uso cristológico contextual sem acrescentar terminologia posterior.
- source_word: ἐν σοὶ
  choice: em você
  rationale: Reproduz diretamente a preposição grega ἐν e mantém a ligação pessoal da aprovação divina com Jesus.
- source_word: εὐδόκησα
  choice: me agrado
  rationale: O aoristo, nesta fórmula declarativa, pode exprimir a aprovação vigente de Deus. “Me agrado” é claro, conciso e preserva a força presente da fala; alternativas que tornam mais visível o aspecto passado são registradas em nota.
theological_decisions:
- issue: Expressar a declaração divina a Jesus sem reduzir sua força cristológica
  choice: o meu Filho amado
  alternative: o meu Filho, o Amado; o meu Filho querido
  rationale: A formulação mantém juntas a identidade filial e a afeição divina, sem importar definições doutrinárias posteriores.
- issue: Preservar ou suavizar o plural οὐρανῶν
  choice: dos céus
  alternative: do céu
  rationale: O plural grego é claro e natural em português, portanto foi preservado.
- issue: Valor temporal e idiomático de εὐδόκησα
  choice: me agrado
  alternative: tenho prazer; me agradei
  rationale: A declaração comunica aprovação divina dirigida ao Filho no momento narrado. O presente idiomático conserva essa força, enquanto a nota reconhece maneiras legítimas de representar mais explicitamente o aoristo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade especialmente natural no Brasil. Conserva-se “dos céus” para representar o plural grego. A ordem das palavras foi ajustada ao português corrente sem eliminar a solenidade da declaração.
