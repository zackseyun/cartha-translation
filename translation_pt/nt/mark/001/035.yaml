  text: Καὶ πρωῒ ἔννυχα λίαν ἀναστὰς ἐξῆλθεν καὶ ἀπῆλθεν εἰς ἔρημον τόπον κἀκεῖ προσηύχετο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/035.yaml
  text: And very early[a], while it was still dark, he got up, went out, and went away to a desolate place, and there he was praying.
translation:
  language: pt
  text: E, de madrugada, quando ainda estava bem escuro, ele se levantou, saiu e foi para um lugar deserto[a]; e ali orava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um lugar ermo”, “um lugar isolado” ou “um lugar desabitado”. O termo grego pode descrever um local desabitado, desolado ou semelhante a uma região selvagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωῒ ἔννυχα λίαν
  choice: de madrugada, quando ainda estava bem escuro
  rationale: Reúne a referência à manhã muito cedo, a indicação de que ainda era noite e o intensificador, produzindo uma expressão natural em português sem perder a forte ênfase temporal.
- source_word: ἀναστὰς
  choice: ele se levantou
  rationale: Expressa de modo idiomático a ação anterior aos verbos principais e preserva a sequência narrativa.
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Mantém o movimento concreto para fora do lugar em que Jesus estava e o distingue do verbo seguinte.
- source_word: ἀπῆλθεν
  choice: foi para
  rationale: Indica o deslocamento para outro local sem fundi-lo com o ato anterior de sair; em português, a construção com o destino é mais natural do que 'foi embora para'.
- source_word: εἰς ἔρημον τόπον
  choice: para um lugar deserto
  rationale: Preserva o sentido de um lugar ermo, desabitado ou semelhante ao deserto, sem afirmar necessariamente uma região geográfica desértica.
- source_word: κἀκεῖ
  choice: e ali
  rationale: Reproduz de forma concisa a ligação narrativa e a referência ao local.
- source_word: προσηύχετο
  choice: ficou orando
  rationale: O imperfeito apresenta a oração como ação em curso; 'ficou orando' comunica essa duração com naturalidade, sem acrescentar uma duração específica.
theological_decisions:
- issue: Ênfase narrativa na oração de Jesus
  choice: Narrar diretamente que Jesus se retirou e permaneceu em oração.
  alternative: Explicitar no texto que a solidão serve de modelo para os discípulos ou tirar conclusões cristológicas sobre dependência.
  rationale: O grego descreve a ação de Jesus sem formular essas aplicações ou conclusões; a tradução preserva o dado narrativo sem incorporar interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação simples conserva o ritmo narrativo de Marcos; 'bem escuro' comunica naturalmente a intensificação temporal, e 'lugar deserto' mantém a ambiguidade espacial do grego.
