id: MRK.1.31
reference: Mark 1:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἤγειρεν αὐτὴν κρατήσας τῆς ⸀χειρός· καὶ ἀφῆκεν αὐτὴν ὁ ⸀πυρετός, καὶ διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/031.yaml
  text: And coming near[a], he raised her up, taking her by the hand; and the fever left her, and she served them.
translation:
  language: pt
  text: E, aproximando-se, ele a levantou, tomando-a pela mão; a febre a deixou, e ela os servia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “começou a servi-los”. O imperfeito grego pode simplesmente descrever que ela os servia, embora o contexto também permita entender o serviço como resultado imediato da cura.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: aproximando-se
  rationale: O particípio aoristo indica que Jesus se aproximou antes de levantá-la, sem precisar explicitar além do grego que ele foi até ela.
- source_word: ἤγειρεν αὐτὴν
  choice: ele a levantou
  rationale: Preserva o sentido direto de ἐγείρω e sua possível ressonância mais ampla, embora aqui descreva fazê-la levantar-se.
- source_word: κρατήσας τῆς χειρός
  choice: tomando-a pela mão
  rationale: Expressão portuguesa natural que comunica o ato de segurá-la pela mão enquanto a levantava.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: a febre a deixou
  rationale: Mantém a estrutura em que a febre é o sujeito e se afasta dela, de modo claro e idiomático.
- source_word: διηκόνει αὐτοῖς
  choice: ela os servia
  rationale: O imperfeito descreve a ação de servir sem exigir que se acrescente lexicalmente 'começou'; o contexto permite entender o serviço como resultado imediato da cura.
theological_decisions:
- issue: Possível ressonância de ἐγείρω com linguagem de ressurreição
  choice: ele a levantou
  alternative: ele a ajudou a se levantar
  rationale: A formulação preserva a dicção de Marcos sem transformar a cura em relato explícito de ressurreição.
- issue: Valor do imperfeito διηκόνει
  choice: ela os servia
  alternative: ela começou a servi-los
  rationale: A tradução mantém o aspecto imperfeito e não decide de forma categórica se ele é ingressivo; o contexto ainda sugere que o serviço ocorreu logo após a cura.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A ordem coordenada e a repetição de “e” preservam o ritmo narrativo de Marcos; “servia” evita o tom eclesiástico de “ministrava”.
