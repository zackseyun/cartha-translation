  text: Καὶ ἔρχεται πρὸς αὐτὸν λεπρὸς παρακαλῶν αὐτὸν καὶ ⸀γονυπετῶν λέγων αὐτῷ ὅτι Ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/040.yaml
  text: And a man with leprosy comes to him[a], pleading with him and kneeling, and saying to him, “If you are willing[d][c][b], you are able to make me clean.”
translation:
  language: pt
  text: 'E um homem com lepra[a] vem até ele, suplica-lhe, ajoelha-se e lhe diz: “Se quiseres, podes tornar-me limpo[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um leproso”. O termo grego pode designar alguém afetado por diversas doenças de pele, não somente pela enfermidade hoje chamada hanseníase.
    reason: lexical_alternative
  - marker: b
    text: Ou “purificar-me”. O verbo grego pode referir-se tanto à purificação da impureza quanto à restauração física.
    reason: lexical_alternative
lexical_decisions:
- source_word: λεπρὸς
  choice: um homem com lepra
  rationale: Emprega linguagem centrada na pessoa e mantém o referente do adjetivo grego substantivado. No contexto bíblico, o termo pode abranger doenças de pele além da enfermidade hoje chamada hanseníase.
- source_word: παρακαλῶν
  choice: suplicando-lhe
  rationale: Expressa o apelo insistente e pessoal adequado ao contexto, sem acrescentar desespero não explicitado no texto.
- source_word: γονυπετῶν
  choice: ajoelhando-se
  rationale: Reproduz de modo conciso e natural a postura indicada pelo particípio grego.
- source_word: Ἐὰν θέλῃς
  choice: Se quiseres
  rationale: Preserva a condição referente à vontade de Jesus, em português corrente e digno.
- source_word: δύνασαί
  choice: podes
  rationale: Comunica diretamente capacidade ou poder, sentido de δύναμαι neste contexto.
- source_word: καθαρίσαι
  choice: tornar-me limpo
  rationale: Mantém a linguagem de limpeza do original e deixa em aberto tanto a restauração física quanto a remoção da impureza ritual, sem reduzi-la simplesmente a 'curar'.
- source_word: ἔρχεται
  choice: vem
  rationale: Conserva o presente histórico característico da narrativa vívida de Marcos.
theological_decisions:
- issue: Natureza da limpeza no contexto da lepra
  choice: tornar-me limpo
  alternative: curar-me; purificar-me
  rationale: O texto usa o verbo de limpar/purificar, não um verbo comum para curar. A opção escolhida preserva a sobreposição entre restauração física e pureza ritual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e formas amplamente compreensíveis no mundo lusófono. O presente histórico de Marcos foi preservado. A colocação pronominal evita coloquialismo excessivamente regional, e a estrutura mantém a sequência dos particípios sem rigidez artificial.
