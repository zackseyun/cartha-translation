lexical_decisions:
- source_word: ἦν ... ἐπισυνηγμένη
  choice: estava reunida
  rationale: A construção perifrástica com o imperfeito de εἰμί e o particípio perfeito passivo descreve o estado da multidão naquela cena. “Estava reunida” preserva naturalmente esse valor em português.
- source_word: ὅλη ἡ πόλις
  choice: toda a cidade
  rationale: Reproduz diretamente a expressão grega e conserva sua generalização vívida, sem enfraquecê-la para “muita gente da cidade” nem exigir uma leitura matematicamente exaustiva.
- source_word: πρὸς τὴν θύραν
  choice: à porta
  rationale: Embora πρός com acusativo possa ser traduzido mais literalmente com ideia de direção, o contexto estático favorece a expressão portuguesa idiomática “à porta”, isto é, junto à entrada da casa.
- source_word: θύραν
  choice: porta
  rationale: É o correspondente direto e natural de θύρα; no contexto, designa a porta ou entrada da casa.
