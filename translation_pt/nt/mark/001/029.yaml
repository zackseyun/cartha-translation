  text: Καὶ ⸀εὐθὺς ἐκ τῆς συναγωγῆς ⸂ἐξελθόντες ἦλθον⸃ εἰς τὴν οἰκίαν Σίμωνος καὶ Ἀνδρέου μετὰ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/029.yaml
  text: And immediately, after leaving the synagogue, they came into the house of Simon and Andrew, with James and John.
translation:
  language: pt
  text: E imediatamente, ao saírem da sinagoga, foram para a casa de Simão e André, com Tiago e João.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Preserva o advérbio característico de Marcos e o ritmo urgente da narrativa em português atual.
- source_word: ἐκ τῆς συναγωγῆς / ἐξελθόντες
  choice: ao saírem da sinagoga
  rationale: Expressa de modo natural tanto a saída quanto sua relação temporal com a ação principal, sem repetir desnecessariamente a ideia de movimento para fora.
- source_word: ἦλθον
  choice: foram
  rationale: ἔρχομαι pode significar “vir” ou “ir” conforme o ponto de vista; em português narrativo, com o destino expresso e sem um centro dêitico no local, “foram” é a opção mais natural.
- source_word: εἰς τὴν οἰκίαν
  choice: para a casa
  rationale: Indica movimento em direção à residência e, no contexto, entrada nela; “para a casa” soa mais idiomático em português do que “para dentro da casa”.
- source_word: Σίμωνος καὶ Ἀνδρέου
  choice: de Simão e André
  rationale: Os genitivos identificam a casa associada aos dois irmãos; a construção portuguesa é direta e mantém essa relação sem explicá-la além do texto.
- source_word: μετὰ Ἰακώβου καὶ Ἰωάννου
  choice: com Tiago e João
  rationale: μετά com genitivo expressa acompanhamento; “com” é a equivalência direta e natural.
- source_word: Σίμωνος / Ἀνδρέου / Ἰακώβου / Ἰωάννου
  choice: Simão / André / Tiago / João
  rationale: Empregam-se as formas tradicionais e amplamente reconhecidas desses nomes em português.
