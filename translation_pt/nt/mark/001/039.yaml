  text: καὶ ⸀ἦλθεν κηρύσσων ⸂εἰς τὰς συναγωγὰς⸃ αὐτῶν εἰς ὅλην τὴν Γαλιλαίαν καὶ τὰ δαιμόνια ἐκβάλλων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/039.yaml
  text: And he went throughout all Galilee[a], preaching in their synagogues and casting out demons.
translation:
  language: pt
  text: E ele foi por toda a Galileia[a], pregando nas sinagogas deles e expulsando demônios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «E ele veio, pregando nas sinagogas deles por toda a Galileia e expulsando demônios». O verbo grego também pode ser traduzido por «veio», mas, neste contexto, provavelmente descreve o deslocamento de Jesus pela região.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: foi por
  rationale: Embora o aoristo de ἔρχομαι possa significar «veio», neste contexto, junto da expressão regional e dos particípios, descreve o deslocamento itinerante de Jesus pela Galileia. «Foi por» expressa isso em português natural sem transformar o verbo em «percorreu».
- source_word: κηρύσσων
  choice: pregando
  rationale: κηρύσσω designa proclamação pública. «Pregando» é natural no contexto das sinagogas e mantém a ideia de anúncio público.
- source_word: εἰς τὰς συναγωγὰς αὐτῶν
  choice: nas sinagogas deles
  rationale: Embora εἰς tenha o sentido básico de «para dentro de», aqui introduz o lugar ou âmbito da atividade. «Nas sinagogas deles» é idiomático e conserva αὐτῶν.
- source_word: εἰς ὅλην τὴν Γαλιλαίαν
  choice: por toda a Galileia
  rationale: A expressão indica a extensão geográfica do deslocamento. «Por toda a Galileia» preserva ὅλην e comunica naturalmente a abrangência regional.
- source_word: τὰ δαιμόνια
  choice: demônios
  rationale: δαιμόνια nomeia especificamente seres demoníacos. Em português, a atividade geral de expulsá-los é expressa com naturalidade sem artigo.
- source_word: ἐκβάλλων
  choice: expulsando
  rationale: Em contextos de exorcismo, ἐκβάλλω significa fazer sair ou expulsar. «Expulsando» é claro, atual e preciso.
theological_decisions:
- issue: Natureza de τὰ δαιμόνια
  choice: demônios
  alternative: espíritos malignos
  rationale: O termo grego designa diretamente demônios e o relato os apresenta como seres sobre os quais Jesus exerce autoridade. A tradução não acrescenta definições doutrinárias além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição do pronome em «E ele foi» mantém a referência explícita do grego; «sinagogas deles» preserva o pronome original, e «expulsando demônios» evita um artigo pouco natural em português para uma atividade geral.
