  source_fidelity: O texto traduz com fidelidade a construção de ἦλθεν com os particípios κηρύσσων e ἐκβάλλων. «Foi por toda a Galileia» comunica adequadamente o movimento itinerante no contexto, sem alegar mais do que o grego afirma. «Pregando», «nas sinagogas deles» e «expulsando demônios» correspondem bem aos termos e à função sintática do original.
  naturalness: O português é moderno, claro e bem adequado à leitura brasileira e internacional. «E ele foi» mantém a referência explícita sem soar excessivamente pesado. «Nas sinagogas deles» é um pouco mais marcado que «nas suas sinagogas», mas é plenamente natural e preserva com clareza o possessivo plural do grego.
  terminology: «Pregando» é apropriado para κηρύσσων; «sinagogas» preserva o referente histórico; e «demônios» é o equivalente direto e usual de δαιμόνια. «Expulsando» traduz naturalmente ἐκβάλλων no contexto de exorcismo, sem introduzir formulação doutrinária adicional.
