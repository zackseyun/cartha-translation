source:
  edition: SBLGNT
  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/022.yaml
  text: And they were astonished at his teaching[a], for he was teaching them as one having authority, and not as the scribes.
translation:
  language: pt
  text: E ficavam admirados com o seu ensino, pois ele os ensinava como quem tem autoridade, e não como os escribas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: ficavam admirados
  rationale: O imperfeito expressa uma reação contínua ou recorrente, e o verbo indica forte admiração. “Ficavam admirados” preserva o aspecto verbal em português natural.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: com o seu ensino
  rationale: διδαχή se refere aqui ao ensino de Jesus, seja em conteúdo, seja na maneira de ensinar. “Ensino” é atual e claro, sem a conotação sistemática que “doutrina” pode ter.
- source_word: ἦν γὰρ διδάσκων
  choice: pois ele os ensinava
  rationale: A construção perifrástica ἦν + particípio apresenta a ação em andamento; o imperfeito “ensinava” comunica esse aspecto com naturalidade.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: como quem tem autoridade
  rationale: A expressão mantém a comparação introduzida por ὡς e traduz ἐξουσία diretamente como “autoridade”, em formulação idiomática e fiel.
- source_word: γραμματεῖς
  choice: os escribas
  rationale: “Escribas” é a designação histórica direta dos especialistas judeus nas Escrituras e na Lei, evitando inserir no texto uma explicação interpretativa.
theological_decisions:
- issue: Natureza da autoridade de Jesus em contraste com a dos escribas
  choice: Descrever Jesus como quem tem autoridade, sem especificar neste versículo a origem ou natureza dessa autoridade.
  alternative: “como quem tem autoridade divina”
  rationale: O texto contrasta claramente a maneira de Jesus ensinar com a dos escribas, mas não qualifica explicitamente a autoridade como “divina” nesta frase. A tradução preserva a afirmação e sua tensão teológica sem ampliá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “ensino/ensinava” reflete a ligação lexical do grego διδαχή/διδάσκων e permanece natural. “Escribas” preserva o referente histórico.
