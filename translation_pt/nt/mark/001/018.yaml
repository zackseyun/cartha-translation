  yaml_path: translation/nt/mark/001/018.yaml
  text: And immediately they left the nets and followed him[a].
translation:
  language: pt
  text: E imediatamente eles deixaram as redes e o seguiram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a coordenação simples e o fluxo narrativo característico de Marcos, sem acrescentar nuance interpretativa.
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Expressa com clareza moderna a prontidão e a urgência do advérbio, frequente em Marcos.
- source_word: ἀφέντες
  choice: deixaram
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal; em português corrente, a coordenação com verbo finito comunica isso naturalmente, sem a intensidade excessiva de 'abandonaram'.
- source_word: τὰ δίκτυα
  choice: as redes
  rationale: Reproduz o artigo grego e evita acrescentar o possessivo 'suas', embora ele esteja implícito no contexto.
- source_word: ἠκολούθησαν
  choice: seguiram
  rationale: Preserva tanto o movimento literal quanto a dimensão emergente de discipulado, sem explicá-la além do que o texto diz.
- source_word: αὐτῷ
  choice: o
  rationale: O pronome retoma Jesus no contexto imediato; mantém-se a referência pronominal do grego em vez de substituir pelo nome.
theological_decisions:
- issue: Nuance de discipulado em ἠκολούθησαν
  choice: o seguiram
  alternative: foram com ele; tornaram-se seus discípulos
  rationale: A formulação simples conserva simultaneamente o sentido narrativo e sua possível profundidade teológica, sem transformar a tradução em explicação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem 'E imediatamente' preserva a cadência marcana; 'o seguiram' é idiomático e fiel ao pronome grego.
