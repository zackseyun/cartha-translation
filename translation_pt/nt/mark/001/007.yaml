source:
  edition: SBLGNT
  text: καὶ ἐκήρυσσεν λέγων· Ἔρχεται ὁ ἰσχυρότερός μου ὀπίσω μου, οὗ οὐκ εἰμὶ ἱκανὸς κύψας λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/007.yaml
  text: And he was proclaiming[a], saying, “The one stronger than I is coming after me[c][b], of whom I am not worthy to stoop down and untie the strap of his sandals.”
translation:
  language: pt
  text: 'E ele proclamava: “Depois de mim vem aquele que é mais forte do que eu. Não sou digno[a] de me abaixar e desamarrar a correia das suas sandálias.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não estou à altura” ou “não sou capaz”; a expressão ressalta a profunda indignidade de João diante daquele que vem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκήρυσσεν
  choice: proclamava
  rationale: O imperfeito indica ação contínua ou repetida, e “proclamava” conserva a ideia de anúncio público própria de κηρύσσω.
- source_word: λέγων
  choice: ':'
  rationale: O particípio introduz o conteúdo da proclamação; em português atual, os dois-pontos expressam essa função com mais naturalidade do que “dizendo”.
- source_word: Ἔρχεται
  choice: vem
  rationale: O presente comunica vivacidade e iminência; “vem” é natural e direto em português.
- source_word: ὁ ἰσχυρότερός μου
  choice: aquele que é mais forte do que eu
  rationale: O adjetivo comparativo substantivado designa uma pessoa superior em força ou poder, sem exigir o tom mais elevado de “mais poderoso”.
- source_word: ὀπίσω μου
  choice: Depois de mim
  rationale: Neste contexto, a expressão aponta principalmente para a sequência da chegada e da atuação, embora também possa conservar a imagem de vir atrás.
- source_word: ἱκανὸς
  choice: digno
  rationale: No contexto de uma tarefa servil diante de alguém superior, “digno” comunica a profunda humildade de João; a nota preserva a amplitude lexical de capacidade ou suficiência.
- source_word: κύψας λῦσαι
  choice: me abaixar e desamarrar
  rationale: A formulação coordenada é idiomática em português e conserva a ação física de abaixar-se para então soltar a correia.
- source_word: τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: a correia das suas sandálias
  rationale: “Correia” designa com precisão a tira de couro, e “sandálias” corresponde ao tipo de calçado do contexto antigo.
theological_decisions:
- issue: Sentido de ἱκανός na declaração de João
  choice: Não sou digno
  alternative: Não sou capaz / não estou à altura
  rationale: A cena enfatiza a inferioridade de posição e a profunda humildade de João diante daquele que vem, não uma simples incapacidade física. A nota mantém disponível a amplitude semântica do termo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A abertura mantém o aspecto contínuo do imperfeito grego; o discurso direto evita construções excessivamente literais e pouco naturais.
