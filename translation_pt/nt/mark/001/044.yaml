    issue: O imperativo de advertência Ὅρα foi omitido.
    rationale: A construção Ὅρα μηδενὶ μηδὲν εἴπῃς não é apenas uma proibição; Ὅρα acrescenta a ideia de cuidado/atenção. A redação proposta conserva essa força sem tornar o português artificial.
  - severity: low
    issue: A alternativa da nota «como prova diante deles» não corresponde precisamente à relação de αὐτοῖς.
    rationale: «Diante deles» sugere localização ou audiência, ao passo que αὐτοῖς é dativo, «a/para eles». A nota pode explicar a função evidencial sem tratar essa reformulação como equivalente literal.
