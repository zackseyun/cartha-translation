  verdict: revise
  source_fidelity: 'A tradução transmite adequadamente a proibição, a ida ao sacerdote, a oferta prescrita por Moisés e a finalidade testemunhal. Contudo, «Não conte nada a ninguém» não representa explicitamente o imperativo inicial Ὅρα, que introduz a proibição com força de advertência: «Veja que não diga nada a ninguém» preserva melhor esse elemento.'
  naturalness: «Veja que não diga nada a ninguém» é uma formulação moderna, clara e amplamente compreensível. «Apresente-se ao sacerdote» e «ofereça pela sua purificação» são naturais e adequados ao registro ritual do contexto.
  terminology: «Sacerdote», «purificação», «Moisés» e «testemunho» são apropriados. «Testemunho para eles» mantém prudentemente aberto o referente de αὐτοῖς e não introduz indevidamente o sentido de «contra eles». A nota deve evitar apresentar «diante deles» como alternativa direta, pois isso altera a relação expressa por αὐτοῖς.
  issues:
