source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ὅρα μηδενὶ μηδὲν εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου ἃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/044.yaml
  text: And he says to him[a], “See that you say nothing to anyone; rather, go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”
translation:
  language: pt
  text: 'E lhe disse: “Veja que não diga nada a ninguém. Em vez disso, vá, apresente-se ao sacerdote e ofereça pela sua purificação o que Moisés ordenou, como testemunho para eles”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para testemunho a eles”; a expressão pode indicar evidência apresentada aos sacerdotes ou a outras pessoas. Alguns também a entendem, em sentido mais incisivo, como “testemunho contra eles”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα μηδενὶ μηδὲν εἴπῃς
  choice: Não conte nada a ninguém
  rationale: O imperativo ὅρα reforça a proibição, enquanto a construção dupla com μηδενί e μηδέν a torna abrangente. Em português, a ordem direta comunica naturalmente essa força sem acrescentar uma advertência estranha ao contexto.
- source_word: ἀλλὰ
  choice: Em vez disso
  rationale: Expressa com clareza o contraste corretivo entre aquilo que o homem não deve fazer e aquilo que deve fazer.
- source_word: ὕπαγε
  choice: vá
  rationale: Imperativo simples de movimento, vertido de modo direto e corrente.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: apresente-se ao sacerdote
  rationale: Conserva a ideia reflexiva de comparecer pessoalmente diante da autoridade sacerdotal para inspeção, em formulação natural em português.
- source_word: προσένεγκε περὶ τοῦ καθαρισμοῦ σου
  choice: ofereça pela sua purificação
  rationale: O contexto cultual favorece “ofereça”, e “purificação” comunica o sentido ritual de καθαρισμός sem reduzir a expressão à cura física.
- source_word: ἃ προσέταξεν Μωϋσῆς
  choice: o que Moisés ordenou
  rationale: O relativo neutro plural grego é naturalmente expresso em português pelo coletivo singular “o que”, abrangendo as prescrições mosaicas pertinentes.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: como testemunho para eles
  rationale: Preserva o valor de propósito ou resultado e mantém indefinidos tanto o referente de “eles” quanto o possível caráter probatório ou confrontador do testemunho.
theological_decisions:
- issue: Referente e força de εἰς μαρτύριον αὐτοῖς
  choice: como testemunho para eles
  alternative: como prova diante deles; como testemunho contra eles
  rationale: O grego não explicita “contra” nem identifica sem ambiguidade os destinatários. A tradução mantém aberta a possibilidade de referência aos sacerdotes e/ou a outros observadores, sem impor um tom hostil.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Apresente-se” e “purificação” preservam o contexto ritual sem linguagem excessivamente técnica. O marcador de nota foi colocado após a frase à qual se refere.
