base_translation:
  language: en
  yaml_path: translation/nt/mark/011/010.yaml
  text: Blessed is the coming kingdom of our father David! Hosanna in the highest![a]
translation:
  language: pt
  text: Bendito seja o reino de nosso pai Davi, que está chegando! Hosana nas alturas![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Hosana” pode refletir a súplica “Salva, por favor” ou “Salva agora”, embora aqui funcione como uma aclamação litúrgica de louvor.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογημένη
  choice: Bendito
  rationale: Adjetivo predicativo numa aclamação litúrgica; “bendito” conserva o tom solene e é a formulação portuguesa consagrada e natural.
- source_word: ἡ ἐρχομένη βασιλεία
  choice: o Reino que vem
  rationale: A oração relativa reproduz com naturalidade a força do particípio presente ἐρχομένη, sem tornar a expectativa mais fixa do que o grego exige. A repetição de “o reino” esclarece em português que a expressão seguinte está ligada ao Reino, evitando a leitura momentânea de que “que vem” descreve Davi.
- source_word: βασιλεία
  choice: Reino
  rationale: “Reino” é idiomático no contexto dinástico davídico e pode abranger tanto domínio quanto realidade régia concreta; a inicial maiúscula segue o uso editorial bíblico em referência ao Reino esperado.
- source_word: τοῦ πατρὸς ἡμῶν Δαυίδ
  choice: de nosso pai Davi
  rationale: Preserva o genitivo que associa o Reino a Davi e mantém “pai” como título ancestral honorífico, sem acrescentar explicitamente “messiânico”.
- source_word: Ὡσαννὰ
  choice: Hosana
  rationale: No uso do Novo Testamento, funciona como aclamação litúrgica estabelecida; a transliteração tradicional portuguesa é preferível no texto, enquanto a súplica hebraica subjacente é registrada em nota.
- source_word: ἐν τοῖς ὑψίστοις
  choice: nas alturas
  rationale: Expressão portuguesa natural, tradicional e concisa para o domínio celestial mais elevado, sem explicitar além do grego “céus” ou “lugares”.
theological_decisions:
- issue: Natureza da aclamação ao Reino davídico
  choice: Traduzir diretamente como bênção sobre o Reino vindouro associado a Davi, sem inserir o adjetivo “messiânico”.
  alternative: Bendito é o Reino messiânico que vem, o Reino de nosso pai Davi!
  rationale: O contexto sugere expectativa messiânica, mas o texto grego diz apenas “o reino que vem de nosso pai Davi”. A tradução deixa a alusão davídica falar por si e preserva a tensão interpretativa.
- issue: Sentido de “Hosana”
  choice: Manter a aclamação litúrgica transliterada no texto.
  alternative: Salva-nos, por favor, nas alturas!
  rationale: Embora derive de uma súplica por salvação, no contexto a palavra já funciona como aclamação. A nota conserva a origem lexical sem reduzir seu valor litúrgico a uma única paráfrase.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Nas alturas” e “Hosana” preservam o registro litúrgico familiar. A retomada “o reino de nosso pai Davi” evita uma possível ambiguidade sintática em português sem acrescentar conteúdo teológico.
