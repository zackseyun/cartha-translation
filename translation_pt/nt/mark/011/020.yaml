  yaml_path: translation/nt/mark/011/020.yaml
  text: And as they were passing by early in the morning[a], they saw the fig tree withered from the roots.
translation:
  language: pt
  text: Ao passarem de manhã cedo, viram a figueira seca desde as raízes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ressecada a partir das raízes».'
    reason: Alternativa lexical para «seca desde as raízes», explicitando a imagem de ressecamento e a noção de procedência ou alcance expressa por ἐκ ῥιζῶν.
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: Ao passarem por ali
  rationale: O particípio presente indica uma ação de fundo simultânea ao verbo principal. A construção com «ao» preserva essa relação de modo natural em português.
- source_word: πρωῒ
  choice: de manhã cedo
  rationale: Expressa tanto o período da manhã quanto a ideia de que era cedo.
- source_word: εἶδον
  choice: viram
  rationale: Tradução direta do aoristo de percepção, sem acrescentar a noção interpretativa de «notaram».
- source_word: συκῆν
  choice: a figueira
  rationale: É a designação comum e natural da árvore neste contexto narrativo.
- source_word: ἐξηραμμένην
  choice: seca
  rationale: O particípio perfeito passivo descreve o estado resultante da figueira. «Seca» é claro e idiomático, mantendo a ideia de um processo anterior com resultado presente.
- source_word: ἐκ ῥιζῶν
  choice: desde as raízes
  rationale: Preserva o plural do grego e comunica que a secura alcançava ou procedia das raízes, sem especificar além do texto.
