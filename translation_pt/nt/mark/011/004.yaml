  yaml_path: translation/nt/mark/011/004.yaml
  text: And they went away and found a colt tied at a door outside on the street[a], and they untied it.
translation:
  language: pt
  text: Eles partiram e encontraram um animal jovem amarrado junto a uma porta, do lado de fora, na rua[a], e o desamarraram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «junto a uma porta, do lado de fora, ao longo da rua». A expressão grega admite pequenas diferenças quanto à relação espacial entre a porta, o exterior e a rua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: foram
  rationale: No fluxo narrativo, o aoristo indica que os discípulos partiram para cumprir as instruções; «foram» é natural em português e o contexto já comunica o afastamento.
- source_word: εὗρον
  choice: encontraram
  rationale: Equivalente direto e idiomático de εὑρίσκω neste contexto narrativo.
- source_word: πῶλον
  choice: jumentinho
  rationale: πῶλος designa um animal jovem sem especificar por si só a espécie, mas o contexto imediato identifica o animal como um jumento. «Jumentinho» é claro ao leitor moderno e evita a possível associação de «potro» exclusivamente com cavalos.
- source_word: δεδεμένον
  choice: amarrado
  rationale: O particípio perfeito passivo descreve o estado em que o animal se encontrava; «amarrado» é concreto e natural.
- source_word: πρὸς θύραν
  choice: junto a uma porta
  rationale: πρός com acusativo expressa proximidade espacial; «junto a» preserva essa relação sem sugerir necessariamente que o animal bloqueava a entrada.
- source_word: ἔξω
  choice: do lado de fora
  rationale: Expressa de modo corrente que o animal estava no exterior.
- source_word: ἐπὶ τοῦ ἀμφόδου
  choice: na rua
  rationale: ἄμφοδον pode designar rua, viela ou passagem pública; «na rua» é a formulação ampla e natural, embora a ligação espacial exata com a porta admita outra leitura, registrada em nota.
- source_word: λύουσιν αὐτόν
  choice: o desamarraram
  rationale: O presente histórico é vertido no pretérito perfeito para manter a narrativa natural em português; «desamarraram» descreve precisamente a ação concreta.
