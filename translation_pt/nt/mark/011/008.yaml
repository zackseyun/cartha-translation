  text: ⸂καὶ πολλοὶ⸃ τὰ ἱμάτια αὐτῶν ἔστρωσαν εἰς τὴν ὁδόν, ἄλλοι δὲ στιβάδας ⸂κόψαντες ἐκ τῶν ἀγρῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/008.yaml
  text: And many spread their cloaks on the road, and others spread leafy branches cut from the fields.
translation:
  language: pt
  text: Muitos estenderam suas capas sobre o caminho, e outros estenderam ramagens[a] que haviam cortado nos campos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «folhagem» ou «ramos». O termo grego pode se referir, de modo mais amplo, a porções de vegetação cortada, não especificamente a ramos de palmeira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: muitos
  rationale: Reproduz diretamente o sentido quantitativo, sem acrescentar uma ênfase ausente do grego.
- source_word: ἱμάτια
  choice: capas
  rationale: No contexto, refere-se às vestes exteriores colocadas no caminho; «capas» é claro e natural em português moderno.
- source_word: ἔστρωσαν
  choice: estenderam
  rationale: Expressa a ação de dispor algo sobre uma superfície e funciona naturalmente tanto com as capas quanto, por elipse, com as ramagens.
- source_word: εἰς τὴν ὁδόν
  choice: sobre o caminho
  rationale: Embora εἰς costume indicar movimento para dentro ou em direção a, com στρώννυμι descreve aqui a colocação sobre a superfície do caminho.
- source_word: ἄλλοι δὲ
  choice: e outros
  rationale: δέ introduz uma adição com contraste leve; «e outros» evita acentuar indevidamente a oposição.
- source_word: στιβάδας
  choice: ramagens
  rationale: O termo pode indicar porções ou camadas de vegetação cortada, incluindo folhagem e ramos; «ramagens» preserva essa amplitude sem introduzir palmeiras, mencionadas especificamente apenas em João.
- source_word: κόψαντες
  choice: que haviam cortado
  rationale: A forma participial indica uma ação anterior à de estender; o mais-que-perfeito composto explicita naturalmente essa relação temporal em português.
- source_word: ἐκ τῶν ἀγρῶν
  choice: nos campos
  rationale: Com «cortar», o português natural indica o lugar de onde a vegetação foi retirada por meio de «nos campos»; ἀγροί designa campos ou áreas rurais abertas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A repetição de «estenderam» torna explícita em português a ação subentendida na segunda oração grega. «Ramagens» mantém a imagem coletiva e a amplitude lexical do original.
