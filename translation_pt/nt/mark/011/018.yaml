  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ ⸂ἀρχιερεῖς καὶ οἱ γραμματεῖς⸃, καὶ ἐζήτουν πῶς αὐτὸν ἀπολέσωσιν· ἐφοβοῦντο γὰρ αὐτόν, ⸂πᾶς γὰρ⸃ ὁ ὄχλος ἐξεπλήσσετο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/018.yaml
  text: And the chief priests and the scribes heard it[a], and they were seeking how they might destroy him, for they feared him, because the whole crowd was astonished at his teaching.
translation:
  language: pt
  text: Os chefes dos sacerdotes e os escribas ouviram isso e procuravam um modo de destruí-lo[a], pois tinham medo dele, porque toda a multidão estava maravilhada com o seu ensino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “matá-lo” ou “levá-lo à morte”. O verbo grego pode ter o sentido mais amplo de “destruir”, embora o contexto indique uma intenção letal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: ouviram isso
  rationale: O verbo pode significar tanto ouvir como tomar conhecimento. O pronome “isso” retoma naturalmente as ações e palavras de Jesus no templo sem especificá-las além do texto.
- source_word: ἀρχιερεῖς
  choice: chefes dos sacerdotes
  rationale: No plural, designa a liderança sacerdotal de Jerusalém, não vários ocupantes simultâneos do cargo singular de sumo sacerdote.
- source_word: γραμματεῖς
  choice: escribas
  rationale: Termo tradicional e ainda compreensível para a classe de estudiosos e intérpretes da Lei no contexto dos Evangelhos.
- source_word: ἐζήτουν
  choice: procuravam
  rationale: O imperfeito indica uma ação contínua ou uma tentativa em andamento.
- source_word: πῶς
  choice: um modo de
  rationale: Expressa a deliberação sobre a maneira ou os meios de realizar a intenção, em português natural.
- source_word: ἀπολέσωσιν
  choice: destruí-lo
  rationale: ἀπόλλυμι pode significar destruir ou matar. “Destruí-lo” preserva a amplitude lexical, enquanto o contexto indica uma intenção letal.
- source_word: ἐφοβοῦντο
  choice: tinham medo dele
  rationale: Mantém o sentido contínuo do imperfeito e comunica com naturalidade o temor provocado por Jesus e por sua influência sobre a multidão.
- source_word: πᾶς ὁ ὄχλος
  choice: toda a multidão
  rationale: Preserva o caráter coletivo e enfático da expressão grega.
- source_word: ἐξεπλήσσετο
  choice: estava maravilhada
  rationale: Expressa a forte reação contínua da multidão sem recorrer a formulação excessivamente expansiva.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: com o seu ensino
  rationale: ἐπί com o dativo indica aqui a ocasião ou causa da reação; “maravilhada com” é uma construção natural em português.
theological_decisions:
- issue: Alcance da intenção dos líderes em ἀπολέσωσιν
  choice: destruí-lo
  alternative: matá-lo; levá-lo à morte
  rationale: O contexto aponta para uma conspiração letal, mas o verbo grego tem sentido lexical mais amplo. O texto principal preserva essa amplitude, e a nota registra a implicação contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência causal dupla do grego foi preservada por “pois... porque”. O marcador foi colocado junto a “destruí-lo”, termo ao qual a nota lexical efetivamente se refere.
