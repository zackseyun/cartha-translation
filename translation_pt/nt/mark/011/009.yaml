  text: καὶ οἱ προάγοντες καὶ οἱ ἀκολουθοῦντες ⸀ἔκραζον· Ὡσαννά· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/009.yaml
  text: And those going ahead and those following were crying out[b][a], “Hosanna! Blessed is the one who comes in the name of the Lord!”
translation:
  language: pt
  text: 'E tanto os que iam à frente como os que vinham atrás clamavam: “Hosana!”[a] “Bendito o que vem em nome do Senhor!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosana” é uma aclamação litúrgica de origem hebraica/aramaica que significa algo como “salva, por favor” ou “salva agora”; aqui, também funciona como grito de louvor.
    reason: lexical_alternative
  - marker: b
    text: A expressão “Bendito o que vem em nome do Senhor” retoma o Salmo 118:26.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: os que iam à frente
  rationale: O particípio presente substantivado identifica o grupo à frente da procissão; a formulação portuguesa é natural e, com o imperfeito, apresenta a ação em andamento.
- source_word: οἱ ἀκολουθοῦντες
  choice: os que vinham atrás
  rationale: Expressa com clareza o grupo que seguia Jesus e mantém o paralelismo com os que iam à frente.
- source_word: ἔκραζον
  choice: clamavam
  rationale: O imperfeito retrata uma aclamação contínua ou repetida; “clamavam” conserva o caráter público e solene sem soar excessivamente coloquial.
- source_word: Ὡσαννά
  choice: Hosana
  rationale: Mantém a forma litúrgica tradicional e reconhecível, derivada do hebraico/aramaico, enquanto a nota registra tanto seu sentido de súplica quanto seu uso como aclamação.
- source_word: Εὐλογημένος
  choice: Bendito
  rationale: Reproduz naturalmente a fórmula de bênção e preserva a ressonância do Salmo 118:26.
- source_word: ὁ ἐρχόμενος
  choice: o que vem
  rationale: Traduz o particípio presente substantivado sem acrescentar um título messiânico que não está expresso no grego.
- source_word: ἐν ὀνόματι κυρίου
  choice: em nome do Senhor
  rationale: Preserva o conhecido idioma bíblico, que pode envolver autoridade e representação, bem como a forma da alusão ao salmo.
- source_word: κυρίου
  choice: Senhor
  rationale: É a tradução portuguesa convencional de κύριος neste contexto e conserva a linguagem da citação bíblica.
theological_decisions:
- issue: Se a identificação messiânica deve ser explicitada na aclamação
  choice: Manter “Bendito o que vem em nome do Senhor” sem acrescentar “Messias” ou “rei”.
  alternative: “Bendito o Messias que vem em nome do Senhor” ou “Bendito o Rei que vem em nome do Senhor”.
  rationale: A aclamação tem importância messiânica no contexto, mas o texto grego deste versículo não inclui nenhum desses títulos. A redação alusiva ao Salmo 118 preserva a força teológica sem resolver interpretativamente a expressão.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Clamavam” mantém o tom público e solene da cena; “o que vem” conserva a concisão e a ambiguidade do original. Os marcadores foram posicionados junto aos elementos que explicam.
