id: MRK.11.11
reference: Mark 11:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν εἰς ⸀Ἱεροσόλυμα εἰς τὸ ἱερόν· καὶ περιβλεψάμενος πάντα ⸀ὀψὲ ἤδη οὔσης τῆς ὥρας ἐξῆλθεν εἰς Βηθανίαν μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/011.yaml
  text: And he entered Jerusalem[a], into the temple courts; and after looking around at everything, since it was already late[c][b], he went out to Bethany with the twelve.
translation:
  language: pt
  text: E ele entrou em Jerusalém e foi ao complexo do templo[a]. Depois de olhar tudo ao redor, como já era tarde[b], saiu para Betânia com os doze[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao recinto do templo”, “aos pátios do templo” ou simplesmente “ao templo”. O termo grego se refere ao complexo mais amplo do templo, não especificamente ao santuário interior.
    reason: lexical_alternative
  - marker: b
    text: Ou “porque já era tarde” ou “visto que a hora já estava adiantada”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, os doze discípulos de Jesus.
    reason: referent_clarification
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: entrou
  rationale: O aoristo de εἰσέρχομαι indica diretamente a entrada de Jesus em Jerusalém; “entrou” é natural e preserva o movimento narrativo.
- source_word: Ἱεροσόλυμα
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome do lugar.
- source_word: τὸ ἱερόν
  choice: o complexo do templo
  rationale: Ἱερόν designa o conjunto da área do templo, e não especificamente o santuário interior (ναός). A formulação evita confundir os dois espaços.
- source_word: περιβλεψάμενος πάντα
  choice: Depois de olhar tudo ao redor
  rationale: O particípio descreve um olhar abrangente em volta; a formulação comunica tanto a sequência quanto a extensão da observação.
- source_word: ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: como já era tarde
  rationale: O genitivo absoluto fornece a circunstância temporal e possivelmente causal da saída. “Como” preserva essa sobreposição sem a definir de modo rígido.
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Preserva de maneira concisa o sentido direcional de ἐξέρχομαι no contexto.
- source_word: Βηθανίαν
  choice: Betânia
  rationale: Forma portuguesa consagrada do nome do lugar.
- source_word: μετὰ τῶν δώδεκα
  choice: com os doze
  rationale: Reproduz a designação numérica do grego sem transformá-la, por capitalização, em um título formal.
theological_decisions:
- issue: Referência espacial de τὸ ἱερόν
  choice: o complexo do templo
  alternative: o templo; os pátios do templo; o recinto do templo
  rationale: A expressão se refere à área mais ampla do templo, não especificamente ao santuário interior. A escolha torna clara essa distinção espacial sem acrescentar interpretação doutrinária.
- issue: Valor de ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: como já era tarde
  alternative: porque já era tarde; visto que a hora já estava adiantada
  rationale: A construção pode ser entendida como circunstância temporal com nuance causal. “Como” conserva essa tensão em vez de optar exclusivamente por uma relação causal.
- issue: Apresentação de τῶν δώδεκα
  choice: os doze
  alternative: os Doze
  rationale: O grego designa o grupo pelo número, mas não determina capitalização. A minúscula evita impor a aparência de título formal, sem obscurecer que se trata dos doze discípulos de Jesus.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe foi dividida em duas frases para evitar uma coordenação pesada, sem alterar a progressão narrativa. “Complexo do templo” explicita a amplitude de ἱερόν; as alternativas mais tradicionais são preservadas em nota.
