source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐγγίζουσιν εἰς Ἱεροσόλυμα εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ Ὄρος τῶν Ἐλαιῶν, ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/001.yaml
  text: And when they were approaching Jerusalem[a], at Bethphage and Bethany, near the Mount of Olives[b], he sends two of his disciples
translation:
  language: pt
  text: Quando se aproximavam de Jerusalém[a], em Betfagé e Betânia, perto do monte das Oliveiras[b], ele envia dois dos seus discípulos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se aproximavam de Jerusalém, de Betfagé e Betânia, em direção ao monte das Oliveiras”. O grego emprega preposições espaciais que podem ser traduzidas de modo mais literal, mas o texto principal expressa o sentido em português natural.'
    reason: lexical_alternative
  - marker: b
    text: Marcos usa muitas vezes o presente histórico na narração; por isso, “ele envia” também pode ser traduzido por “ele enviou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζουσιν
  choice: se aproximavam
  rationale: O presente grego funciona na narrativa de Marcos como presente histórico; o imperfeito em português expressa com naturalidade a aproximação em curso.
- source_word: εἰς Ἱεροσόλυμα
  choice: de Jerusalém
  rationale: Com o verbo pronominal português «aproximar-se», a regência natural é «de»; a expressão continua indicando o lugar do qual eles se aproximavam.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: em Betfagé e Betânia
  rationale: Neste encadeamento geográfico, a frase situa o grupo na região dessas localidades; «em» evita uma repetição rígida de movimento que o contexto não exige.
- source_word: πρὸς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: perto do monte das Oliveiras
  rationale: πρός tem aqui valor espacial de proximidade ou orientação. «Perto de» comunica a localização sem impor movimento em direção ao monte.
- source_word: ἀποστέλλει
  choice: ele envia
  rationale: Mantém o presente histórico de Marcos e sua vivacidade narrativa; o pronome explicita em português o sujeito já conhecido pelo contexto.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: dois dos seus discípulos
  rationale: Reproduz naturalmente a construção partitiva e conserva a relação expressa por αὐτοῦ.
- source_word: Βηθφαγὴ
  choice: Betfagé
  rationale: Forma tradicional e amplamente reconhecida em português para o topônimo.
- source_word: Βηθανίαν
  choice: Betânia
  rationale: Forma tradicional e amplamente reconhecida em português para o topônimo.
- source_word: Ὄρος τῶν Ἐλαιῶν
  choice: monte das Oliveiras
  rationale: Forma consagrada e clara em português, preservando a construção genitiva do topônimo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva-se o presente histórico em «ele envia», enquanto «se aproximavam» favorece o fluxo narrativo e descreve a ação em curso.
