  text: καὶ ἀποκριθέντες ⸂τῷ Ἰησοῦ λέγουσιν⸃· Οὐκ οἴδαμεν. καὶ ὁ ⸀Ἰησοῦς λέγει αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/033.yaml
  text: And answering Jesus[a], they say, “We do not know.” And Jesus says to them, “Neither do I tell you by what authority I do these things.”
translation:
  language: pt
  text: 'Em resposta, dizem a Jesus: “Não sabemos.” E Jesus lhes diz: “Nem eu lhes digo com que autoridade faço estas coisas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: responderam
  rationale: O particípio introduz a resposta deles; em português, a forma verbal finita produz uma narrativa natural sem perder a relação com a fala direta.
- source_word: λέγουσιν / λέγει / λέγω
  choice: responderam / disse / digo
  rationale: O primeiro λέγουσιν fica incorporado de modo natural à fórmula «responderam». No segundo, o pretérito «disse» evita a artificialidade do presente histórico neste contexto; no discurso direto, «digo» preserva o presente de λέγω.
- source_word: Οὐκ οἴδαμεν
  choice: Não sabemos
  rationale: Tradução direta do perfeito com sentido presente.
- source_word: Οὐδὲ ἐγὼ
  choice: Eu também não
  rationale: Preserva a resposta negativa correspondente e a ênfase explícita em ἐγώ, em português corrente.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: com que autoridade
  rationale: Expressão idiomática em português para a autoridade ou autorização com que alguém age.
- source_word: ταῦτα
  choice: estas coisas
  rationale: Mantém o demonstrativo neutro plural, que remete às ações recentes de Jesus.
- source_word: ποιῶ
  choice: faço
  rationale: O presente simples corresponde ao grego e é natural em português.
