base_translation:
  language: en
  yaml_path: translation/nt/mark/011/003.yaml
  text: And if anyone says to you[a], ‘Why are you doing this?’ say[b], ‘The Lord has need of it,’ and he will send it back here immediately.
translation:
  language: pt
  text: 'E, se alguém perguntar a vocês: “Por que estão fazendo isso?”, respondam: “O Senhor[a] precisa dele e imediatamente o mandará de volta para cá”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O mestre precisa dele” ou “O senhor precisa dele”. A palavra grega κύριος pode significar “senhor” ou “mestre”; aqui é traduzida como título: “Senhor”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “e ele imediatamente o manda de volta para cá”. O verbo grego está no presente e pode ter valor futuro neste contexto; seu sujeito não é expresso.'
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: se alguém perguntar a vocês
  rationale: ἐάν com o subjuntivo aoristo introduz uma condição futura aberta. Como a fala seguinte é uma pergunta, “perguntar” é mais natural em português do que o literal “dizer”, sem alterar o sentido.
- source_word: Τί ποιεῖτε τοῦτο;
  choice: Por que estão fazendo isso?
  rationale: Neste contexto, τί funciona como contestação da ação; a formulação escolhida é idiomática e preserva esse valor.
- source_word: εἴπατε
  choice: respondam
  rationale: O imperativo aoristo plural significa literalmente “digam”; depois de uma pergunta direta, “respondam” expressa naturalmente a função discursiva.
- source_word: Ὁ κύριος
  choice: O Senhor
  rationale: Preserva o título κύριος e sua força no contexto do Evangelho, sem reduzir a expressão ao sentido secular de “dono” ou “senhor”.
- source_word: αὐτοῦ χρείαν ἔχει
  choice: precisa dele
  rationale: A expressão significa “tem necessidade dele”. Em português, “precisa dele” é clara e natural; o pronome masculino retoma o jumentinho do versículo anterior.
- source_word: εὐθὺς
  choice: logo
  rationale: Expressa prontidão ou imediatidade de modo natural no contexto; “imediatamente” também seria possível.
- source_word: αὐτὸν ἀποστέλλει πάλιν ὧδε
  choice: o mandará de volta para cá
  rationale: O presente ἀποστέλλει admite valor futuro no contexto. πάλιν, com verbo de envio, é idiomaticamente “de volta”, e ὧδε é “para cá” por indicar movimento ao lugar do falante.
theological_decisions:
- issue: Referente e força de κύριος
  choice: “O Senhor”, entendido no contexto narrativo como referência a Jesus
  alternative: “O dono” ou “o senhor” em sentido comum
  rationale: A tradução conserva a forma titular e a ambiguidade lexical relevante por meio de nota, sem acrescentar uma afirmação doutrinária além do contexto.
- issue: Sujeito de ἀποστέλλει
  choice: 'A forma verbal é vertida sem explicitar um sujeito nominal: “o mandará”'
  alternative: Entender como “ele [o Senhor] o mandará” ou como “ele [quem questiona/detém o animal] o deixará ir”
  rationale: O sujeito não está expresso no grego e pode ser inferido de maneiras diferentes. A tradução principal mantém a referência pronominal implícita, e a nota registra a ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A pontuação do diálogo foi naturalizada. “A vocês” evita regionalismo excessivo; “jumentinho” não é repetido porque o pronome retoma claramente o antecedente no versículo anterior.
