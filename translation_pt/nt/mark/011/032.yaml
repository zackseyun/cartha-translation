  text: ἀλλὰ εἴπωμεν· Ἐξ ἀνθρώπων;— ἐφοβοῦντο τὸν ⸀ὄχλον, ἅπαντες γὰρ εἶχον τὸν Ἰωάννην ⸂ὄντως ὅτι⸃ προφήτης ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/032.yaml
  text: But if we say[a], ‘From men’?”—they were afraid of the crowd[b], for everyone held that John truly was a prophet.
translation:
  language: pt
  text: 'Mas, se dissermos: “Dos seres humanos”? — eles tinham medo da multidão, pois todos consideravam que João era realmente um profeta.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Dos homens”; de modo mais interpretativo, “De origem humana”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ εἴπωμεν
  choice: Mas, se dissermos
  rationale: Reproduz o contraste e a alternativa implícita na deliberação, com construção condicional natural em português.
- source_word: Ἐξ ἀνθρώπων
  choice: Dos seres humanos
  rationale: Expressa literalmente a origem humana em contraste com a origem celestial mencionada no contexto, sem limitar o sentido a pessoas do sexo masculino.
- source_word: ἐφοβοῦντο τὸν ὄχλον
  choice: tinham medo da multidão
  rationale: O imperfeito indica o temor que condicionava a deliberação; “multidão” corresponde naturalmente ao grupo reunido.
- source_word: ἅπαντες γὰρ εἶχον
  choice: pois todos consideravam
  rationale: γάρ introduz a razão do medo, e ἔχω aqui expressa a opinião ou avaliação sustentada por todos.
- source_word: ὄντως ὅτι προφήτης ἦν
  choice: que João era realmente profeta
  rationale: Mantém a afirmação dentro da perspectiva popular relatada e conserva a ênfase de ὄντως sem transformá-la numa declaração independente do narrador.
theological_decisions:
- issue: Origem expressa por ἐξ ἀνθρώπων
  choice: Dos seres humanos
  alternative: De origem humana; Dos homens
  rationale: A frase contrasta origem humana e celestial. A tradução escolhida permanece próxima da forma grega e é inclusiva e clara no português atual; “de origem humana” explicita mais a relação semântica.
- issue: Força da avaliação popular de João
  choice: todos consideravam que João era realmente profeta
  alternative: todos consideravam João verdadeiramente um profeta
  rationale: A redação conserva tanto a convicção da multidão quanto o fato de que essa convicção é relatada como a razão do medo dos líderes, sem apresentar a frase como nova afirmação direta do narrador.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Dos seres humanos” evita a possível leitura masculina de “dos homens”; “multidão” preserva o cenário narrativo, e “era realmente profeta” mantém a ênfase sem soar excessivamente técnica.
