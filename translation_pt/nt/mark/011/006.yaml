  text: And they said to them just as Jesus had said[a], and they let them go.
translation:
  language: pt
  text: E eles lhes disseram conforme Jesus havia dito, e os deixaram ir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “permitiram que fossem” ou “os liberaram”. O verbo grego pode significar permitir, soltar ou deixar ir; aqui indica que os presentes já não impediram os discípulos de levar o jumentinho.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: E eles
  rationale: O artigo substantivado retoma os discípulos, e δέ funciona aqui como conectivo narrativo simples.
- source_word: εἶπαν αὐτοῖς
  choice: lhes responderam
  rationale: Embora λέγω signifique literalmente “dizer”, no contexto os discípulos falam em resposta à pergunta do versículo anterior; “responderam” expressa isso naturalmente sem acrescentar conteúdo.
- source_word: καθὼς εἶπεν ὁ Ἰησοῦς
  choice: conforme Jesus havia dito
  rationale: καθώς indica correspondência com as instruções de Jesus; o mais-que-perfeito composto deixa clara a anterioridade da fala em português corrente.
- source_word: ἀφῆκαν αὐτούς
  choice: os deixaram ir
  rationale: ἀφίημι pode significar permitir, soltar ou deixar ir. Neste contexto, indica que os presentes deixaram de impedir os discípulos de levar o jumentinho.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa e ampla legibilidade brasileira. O pronome “os” preserva o referente humano plural do grego, enquanto a nota esclarece o sentido contextual da permissão.
