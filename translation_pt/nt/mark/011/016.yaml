source:
  edition: SBLGNT
  text: καὶ οὐκ ἤφιεν ἵνα τις διενέγκῃ σκεῦος διὰ τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/016.yaml
  text: And he would not allow anyone to carry a vessel through the temple courts[a][b].
translation:
  language: pt
  text: E não permitia que ninguém carregasse qualquer objeto pelo recinto do templo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «pelo templo». O termo grego se refere de modo amplo ao complexo ou recinto do templo, não especificamente ao santuário interior.
    reason: lexical_alternative
  - marker: b
    text: Ou «recipiente», «utensílio» ou «implemento». A palavra grega é ampla e não especifica o tipo de objeto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤφιεν
  choice: não permitia
  rationale: 'O imperfeito expressa uma ação contínua ou repetida: Jesus impedia que isso acontecesse. «Não permitia» preserva esse aspecto de modo natural em português.'
- source_word: ἵνα τις διενέγκῃ
  choice: que ninguém carregasse
  rationale: Depois de ἤφιεν, ἵνα com o subjuntivo indica aquilo que não era permitido. A construção com «que» e o imperfeito do subjuntivo é idiomática em português; o pronome indefinido assume forma negativa por concordância com «não».
- source_word: διενέγκῃ
  choice: carregasse ... pelo
  rationale: Neste contexto, διαφέρω significa levar ou transportar algo através de uma área. «Carregasse ... pelo» comunica tanto a ação quanto a travessia.
- source_word: σκεῦος
  choice: objeto algum
  rationale: σκεῦος é amplo e pode designar objeto, recipiente, utensílio ou implemento. «Objeto algum» evita especificar indevidamente o tipo de item; a nota conserva alternativas relevantes.
- source_word: διὰ τοῦ ἱεροῦ
  choice: pelo pátio do templo
  rationale: ἱερόν designa o complexo do templo, em contraste com ναός, o santuário propriamente dito. No contexto da passagem, «pátio do templo» comunica naturalmente a área pública atravessada, sem sugerir o recinto interior.
theological_decisions:
- issue: Sentido de ἱερόν em relação ao templo de Jerusalém
  choice: o complexo mais amplo do templo, vertido como «pátio do templo»
  alternative: «templo» ou «recinto do templo»
  rationale: A escolha mantém a distinção contextual entre ἱερόν, o complexo do templo, e ναός, o santuário interior. Não se afirma que alguém estivesse atravessando o santuário propriamente dito.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Não permitia» conserva o aspecto durativo do imperfeito; «objeto algum» reproduz a amplitude de σκεῦος sem o possível arcaísmo ou a ambiguidade moderna de «vaso».
