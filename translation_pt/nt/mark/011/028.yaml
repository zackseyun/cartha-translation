id: MRK.11.28
reference: Mark 11:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγον αὐτῷ· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; ⸀ἢ τίς σοι ⸂ἔδωκεν τὴν ἐξουσίαν ταύτην⸃ ἵνα ταῦτα ποιῇς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/028.yaml
  text: And they were saying to him[b][a], “By what authority are you doing these things? Or who gave you this authority to do these things?”
translation:
  language: pt
  text: 'E lhe perguntavam: “Com que autoridade você faz estas coisas?[a] Ou quem lhe deu esta autoridade para fazer estas coisas?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Em que autoridade você faz estas coisas?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para que você faça estas coisas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον αὐτῷ
  choice: lhe perguntavam
  rationale: O imperfeito ἔλεγον apresenta a fala em andamento, e o conteúdo é claramente interrogativo. “Lhe perguntavam” comunica ambos os aspectos de modo natural em português.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: Com que autoridade
  rationale: A construção ἐν com o dativo indica aqui a base ou autorização pela qual Jesus age. “Com que autoridade” é idiomático e mantém o desafio quanto à legitimidade de suas ações.
- source_word: ἐξουσίᾳ / ἐξουσίαν
  choice: autoridade
  rationale: ἐξουσία designa autoridade, direito ou competência reconhecida. “Autoridade” se ajusta melhor ao questionamento dos líderes no contexto do templo.
- source_word: ταῦτα ποιεῖς / ταῦτα ποιῇς
  choice: faz estas coisas / fazer estas coisas
  rationale: Mantém-se o plural ταῦτα, que pode abranger as ações e o ensino recentes de Jesus, sem restringir a referência a um único ato.
- source_word: ἢ
  choice: Ou
  rationale: Introduz uma segunda pergunta que reformula e aprofunda a primeira, perguntando pela pessoa que concedeu a autoridade.
- source_word: τίς σοι ἔδωκεν
  choice: quem lhe deu
  rationale: O aoristo ἔδωκεν é expresso naturalmente pelo pretérito perfeito “deu”, e “lhe” oferece uma forma amplamente inteligível e digna.
- source_word: ἵνα ταῦτα ποιῇς
  choice: para fazer estas coisas
  rationale: Depois de “deu esta autoridade”, a construção infinitiva é a forma mais natural em português para expressar a finalidade indicada por ἵνα com o subjuntivo.
theological_decisions:
- issue: Natureza da autorização reivindicada por Jesus
  choice: Apresentar de modo neutro o desafio dos líderes à autoridade de Jesus
  alternative: Explicitar na pergunta que se trata de autoridade divina
  rationale: O versículo registra a pergunta dos interlocutores, mas não declara ainda a origem da autoridade. A tradução preserva essa tensão sem antecipar uma resposta teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O pronome “você” evita uma formulação excessivamente formal, enquanto “lhe” mantém fluidez e respeito. A repetição de “esta autoridade” e “estas coisas” acompanha deliberadamente a repetição enfática do grego.
