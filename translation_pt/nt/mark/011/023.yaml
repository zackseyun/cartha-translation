id: MRK.11.23
reference: Mark 11:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἀμὴν λέγω ὑμῖν ὅτι ὃς ἂν εἴπῃ τῷ ὄρει τούτῳ· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, καὶ μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ ἀλλὰ ⸀πιστεύῃ ὅτι ⸂ὃ λαλεῖ γίνεται, ἔσται αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/023.yaml
  text: Truly I tell you[a], whoever says to this mountain, ‘Be lifted up and be thrown into the sea,’ and does not doubt in his heart but believes that what he says is happening[b], it will be so for him.
translation:
  language: pt
  text: 'Em verdade lhes digo: quem disser a este monte: “Seja levantado e lançado ao mar”, e não duvidar no coração,[a] mas crer que aquilo que diz está acontecendo,[b] assim lhe será.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não hesitar no íntimo” ou “não ficar dividido interiormente”; o verbo grego pode indicar divisão interior, além de dúvida.
    reason: lexical_alternative
  - marker: b
    text: Ou “que aquilo que diz acontece” ou “se realiza”. O grego emprega o tempo presente (“está acontecendo”/“acontece”) antes da oração de resultado no futuro.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Em verdade lhes digo
  rationale: Reproduz de modo natural e solene a fórmula enfática que introduz a declaração de Jesus.
- source_word: ὃς ἂν εἴπῃ
  choice: quem disser
  rationale: Expressa a condição geral e indefinida formada pelo relativo com ἄν e o subjuntivo aoristo.
- source_word: τῷ ὄρει τούτῳ
  choice: a este monte
  rationale: Mantém o demonstrativo e traduz ὄρος pelo termo corrente e adequado à imagem.
- source_word: Ἄρθητι καὶ βλήθητι
  choice: Seja levantado e lançado
  rationale: Preserva os dois imperativos passivos e a imagem concreta de levantar o monte e lançá-lo ao mar.
- source_word: μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ
  choice: não duvidar no coração
  rationale: No contexto, διακρίνω indica dúvida ou hesitação interior; 'no coração' preserva a expressão antropológica grega.
- source_word: πιστεύῃ
  choice: crer
  rationale: É o equivalente direto e natural de πιστεύω neste contexto.
- source_word: ὅτι ὃ λαλεῖ γίνεται
  choice: que aquilo que diz está acontecendo
  rationale: Conserva o presente de γίνεται e evita convertê-lo silenciosamente em futuro, embora a construção também admita sentido gnômico.
- source_word: ἔσται αὐτῷ
  choice: assim lhe será
  rationale: Mantém o futuro e a formulação relativamente aberta do grego sem especificar o mecanismo do resultado.
theological_decisions:
- issue: Natureza da declaração sobre fé e fala
  choice: Apresentar diretamente a condição e a promessa, sem acrescentar qualificações doutrinárias.
  alternative: Reduzir a fala a mera hipérbole ou expandi-la como promessa absoluta e irrestrita.
  rationale: O versículo usa uma imagem extrema e afirma sua condição com força, mas não explicita aqui um sistema teológico que autorize suavizar ou ampliar a declaração.
- issue: Masculino singular genérico em αὐτοῦ / αὐτῷ
  choice: Usar construções portuguesas no singular ('no coração', 'lhe') sem inserir marca de gênero inexistente nesses pontos da formulação natural.
  alternative: Explicitar 'no seu coração' e 'para ele'.
  rationale: O português permite preservar o referente singular e genérico de forma natural, sem mudar o alcance da frase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a solenidade da fala de Jesus, os passivos da imagem e a tensão temporal entre γίνεται, no presente, e ἔσται, no futuro.
