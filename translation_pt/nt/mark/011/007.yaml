  text: καὶ ⸀φέρουσιν τὸν πῶλον πρὸς τὸν Ἰησοῦν, καὶ ⸀ἐπιβάλλουσιν αὐτῷ τὰ ἱμάτια αὐτῶν, καὶ ἐκάθισεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/007.yaml
  text: And they brought the colt to Jesus, and they threw their cloaks on it, and he sat on it.
translation:
  language: pt
  text: Então levaram o jumentinho a Jesus, lançaram sobre ele as suas capas, e Jesus sentou-se nele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶλον
  choice: jumentinho
  rationale: No contexto da entrada em Jerusalém, designa o filhote de uma jumenta; “jumentinho” é natural, claro e coerente com o cenário narrativo.
- source_word: ἐπιβάλλουσιν
  choice: lançaram sobre
  rationale: Preserva a ação concreta de colocar as capas sobre o animal e mantém a força do verbo sem sugerir necessariamente violência.
- source_word: ἱμάτια
  choice: capas
  rationale: Refere-se às vestes exteriores usadas pelos discípulos, aqui empregadas como assento improvisado.
- source_word: ἐκάθισεν
  choice: sentou-se
  rationale: Tradução direta e idiomática do aoristo, descrevendo Jesus tomando assento sobre o animal.
theological_decisions:
- issue: Referente do sujeito implícito em ἐκάθισεν
  choice: Jesus sentou-se
  alternative: ele sentou-se
  rationale: Embora o grego use sujeito implícito, o referente narrativo é Jesus. Repetir o nome evita que, em português, “ele” pareça referir-se ao jumentinho, sem acrescentar interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação simples acompanha o ritmo narrativo do grego; não foram necessárias notas de rodapé.
