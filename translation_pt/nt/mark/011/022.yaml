  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς λέγει αὐτοῖς· Ἔχετε πίστιν θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/022.yaml
  text: And Jesus answered them[a], “Have faith in God.”
translation:
  language: pt
  text: 'E Jesus lhes respondeu[a]: “Tenham fé em Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “Tenham fé de Deus”. A expressão também pode ser entendida como “Tenham a fidelidade de Deus” ou “Tenham fé proveniente de Deus”.
    reason: Leitura alternativa decorrente da ambiguidade do genitivo θεοῦ em πίστιν θεοῦ.
lexical_decisions:
- source_word: ἀποκριθεὶς ... λέγει
  choice: respondeu
  rationale: O particípio ἀποκριθείς e o presente histórico λέγει formam uma introdução de fala. Em narrativa portuguesa, o pretérito «respondeu» é natural e expressa adequadamente a função discursiva sem reproduzir de modo rígido o particípio e o presente histórico.
- source_word: Ἔχετε
  choice: Tenham
  rationale: O imperativo presente plural pede que os discípulos possuam ou mantenham essa disposição. «Tenham» é direto, corrente e não explicita além do necessário a nuance aspectual.
- source_word: πίστιν
  choice: fé
  rationale: «Fé» é a correspondência usual e natural neste contexto de exortação, além de manter a ligação com o ensino seguinte sobre crer e orar.
- source_word: θεοῦ
  choice: em Deus
  rationale: 'Embora seja formalmente um genitivo, no contexto θεοῦ é mais provavelmente o alvo da fé: «fé em Deus». A construção grega permanece ambígua, por isso as outras possibilidades são registradas em nota.'
- source_word: αὐτοῖς
  choice: lhes
  rationale: O pronome retoma os discípulos como destinatários da resposta; «lhes respondeu» é uma formulação portuguesa concisa e natural.
theological_decisions:
- issue: Genitivo ambíguo em πίστιν θεοῦ
  choice: fé em Deus
  alternative: fé de Deus; fidelidade de Deus; fé proveniente de Deus
  rationale: 'A sequência imediata, que trata de crer e orar, favorece a leitura objetiva: Deus é aquele em quem se deposita a fé. Contudo, a forma grega não determina por si só essa relação, de modo que a tradução não deve ocultar as leituras alternativas.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O pronome «lhes» evita explicitar novamente os discípulos, e «Tenham fé em Deus» preserva a concisão e a força da exortação.
