reference: Mark 11:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πάντα ὅσα ⸂προσεύχεσθε καὶ αἰτεῖσθε⸃, πιστεύετε ὅτι ⸀ἐλάβετε, καὶ ἔσται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/024.yaml
  text: For this reason I tell you[a], whatever you pray and ask for, believe that you have received it[b], and it will be yours.
translation:
  language: pt
  text: 'Por isso, eu lhes digo: tudo o que pedirem em oração, creiam que já o receberam[a], e vocês o terão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas tradições textuais trazem uma forma que pode ser traduzida como “creiam que o estão recebendo”, em vez de “creiam que já o receberam”. O texto grego adotado aqui traz “receberam”, com sentido de ação concluída.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural a ligação inferencial com o ensino anterior sobre fé e oração.
- source_word: πάντα ὅσα προσεύχεσθε καὶ αἰτεῖσθε
  choice: tudo o que pedirem em oração
  rationale: Formulação idiomática em português que conserva tanto a oração quanto o ato de pedir, sem a construção pouco natural 'orar e pedir tudo o que'.
- source_word: πιστεύετε
  choice: creiam
  rationale: Imperativo plural direto, adequado à exortação dirigida aos discípulos.
- source_word: ὅτι ἐλάβετε
  choice: que já o receberam
  rationale: O pretérito perfeito preserva o sentido de ação concluída do aoristo; 'já' torna clara, em português, a sequência temporal deliberadamente paradoxal.
- source_word: καὶ ἔσται ὑμῖν
  choice: e vocês o terão
  rationale: Transmite naturalmente que aquilo que foi pedido lhes pertencerá ou estará à sua disposição, mantendo a referência singular coletiva de 'tudo o que'.
theological_decisions:
- issue: Relação temporal entre fé e resposta à oração
  choice: creiam que já o receberam, e vocês o terão
  alternative: creiam que o estão recebendo, e vocês o terão
  rationale: O texto adotado pelo SBLGNT traz ἐλάβετε, aoristo, e não uma forma presente. A tradução mantém a tensão entre considerar o pedido recebido e ainda vir a tê-lo, sem explicar essa tensão por meio de um sistema doutrinário específico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome explícito “vocês” esclarece o destinatário plural, enquanto “o” retoma coletivamente “tudo o que”. A redação evita tanto rigidez literal quanto expansão interpretativa.
