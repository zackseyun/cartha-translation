  text: Καὶ ⸀ὅταν ὀψὲ ἐγένετο, ⸀ἐξεπορεύοντο ἔξω τῆς πόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/019.yaml
  text: And whenever evening came, they would go out of the city.
translation:
  language: pt
  text: E, sempre que anoitecia, eles saíam da cidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: sempre que
  rationale: Com o imperfeito ἐξεπορεύοντο, expressa ação habitual ou repetida; “sempre que” preserva essa nuance com naturalidade.
- source_word: ὀψὲ ἐγένετο
  choice: anoitecia
  rationale: Expressa de modo natural em português a ideia idiomática de que chegava a tarde/noite, sem rigidez literal.
- source_word: ἐξεπορεύοντο
  choice: eles saíam
  rationale: O imperfeito indica aqui, com maior probabilidade, uma ação costumeira e repetida; “saíam” comunica essa duração ou habitualidade.
- source_word: ἔξω τῆς πόλεως
  choice: da cidade
  rationale: Com o verbo de movimento “sair”, “da cidade” transmite naturalmente o movimento para fora expresso pelo grego.
- source_word: πόλεως
  choice: cidade
  rationale: O texto grego diz “a cidade” e não explicita “Jerusalém”; a tradução mantém essa referência sem acrescentar o nome próprio.
