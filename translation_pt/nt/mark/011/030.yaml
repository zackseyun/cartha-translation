  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων; ἀποκρίθητέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/030.yaml
  text: Was John's baptism from heaven or from men? Answer me[a][b].
translation:
  language: pt
  text: O batismo de João vinha do céu[a] ou dos seres humanos[b]? Respondam-me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de Deus”. O grego diz literalmente “do céu”, expressão judaica que indica origem ou autoridade divina.
    reason: lexical_alternative
  - marker: b
    text: Isto é, de origem ou autoridade meramente humana.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ βάπτισμα τὸ Ἰωάννου
  choice: O batismo de João
  rationale: A construção com o genitivo identifica o batismo associado a João. “O batismo de João” é natural em português e mantém a forma tradicional sem rigidez.
- source_word: ἐξ οὐρανοῦ
  choice: do céu
  rationale: Preserva literalmente o idioma judaico que aponta para origem ou autoridade divina, sem substituí-lo pela interpretação explícita “de Deus”.
- source_word: ἐξ ἀνθρώπων
  choice: dos seres humanos
  rationale: ἀνθρώπων tem sentido genérico; “seres humanos” comunica origem ou autoridade meramente humana e evita a possível leitura restrita de “homens” como pessoas do sexo masculino.
- source_word: ἦν ἢ
  choice: vinha ... ou ...?
  rationale: Embora o grego use o verbo “ser”, em português “vinha de” expressa de modo natural a pergunta sobre origem, preservando claramente o contraste.
- source_word: ἀποκρίθητέ μοι
  choice: Respondam-me
  rationale: O imperativo aoristo exige uma resposta direta. O plural corresponde aos interlocutores e mantém a força da ordem.
theological_decisions:
- issue: Sentido de “do céu” na pergunta de Jesus
  choice: Manter “do céu” no texto principal como idioma de origem ou autoridade divina.
  alternative: de Deus
  rationale: A expressão preserva a formulação reverencial judaica e a força retórica da pergunta, sem tornar explícita no texto principal uma interpretação que o idioma apenas implica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “Respondam-me” explicita naturalmente o número verbal grego. “Seres humanos” preserva o caráter genérico de ἀνθρώπων.
