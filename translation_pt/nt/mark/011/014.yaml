  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτῇ· Μηκέτι ⸂εἰς τὸν αἰῶνα ἐκ σοῦ⸃ μηδεὶς καρπὸν φάγοι. καὶ ἤκουον οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/014.yaml
  text: And answering[a], he said to it[c][b], “May no one ever eat fruit from you again.” And his disciples were listening.
translation:
  language: pt
  text: 'E, respondendo, disse à figueira[a]: “Que nunca mais ninguém coma fruto de você[b]!” E os seus discípulos ouviram isso[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “E, respondendo, disse a ela”. “Responder” é um modo narrativo comum no grego, mesmo quando nenhuma fala anterior foi registrada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Que ninguém coma fruto de você para sempre”. Em grego, literalmente: “para dentro da era”.'
    reason: alternative_reading
  - marker: c
    text: 'O imperfeito grego também pode ser traduzido por “estavam ouvindo”: “E os seus discípulos estavam ouvindo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: respondendo
  rationale: Preserva o particípio e o idiomatismo narrativo grego de responder mesmo sem fala anterior explícita, de modo natural em português.
- source_word: αὐτῇ
  choice: à figueira
  rationale: O pronome feminino retoma a figueira; repetir o referente evita a possível ambiguidade de “a ela” e mantém a personificação apenas no grau exigido pelo contexto.
- source_word: Μηκέτι ... εἰς τὸν αἰῶνα
  choice: Nunca mais
  rationale: A combinação de “não mais” com “para sempre/era adentro” forma uma negação enfática e permanente; “nunca mais” é a expressão portuguesa natural correspondente.
- source_word: ἐκ σοῦ
  choice: de você
  rationale: Mantém o discurso direto à árvore na segunda pessoa. “Você” oferece ampla compreensão moderna e leitura brasileira natural.
- source_word: μηδεὶς
  choice: ninguém
  rationale: Equivalente português direto do sujeito indefinido negativo.
- source_word: καρπὸν
  choice: fruto
  rationale: O singular genérico é natural em português e preserva a forma do grego.
- source_word: φάγοι
  choice: coma
  rationale: O presente do subjuntivo em uma oração independente após “ninguém” reproduz de maneira idiomática a força volitiva/imprecatória do optativo, sem convertê-lo em simples previsão.
- source_word: ἤκουον
  choice: ouviram
  rationale: O imperfeito grego pode indicar que os discípulos estavam ouvindo ou, no contexto, que ouviram a declaração. A forma simples é clara e evita sugerir atenção deliberada não necessariamente expressa por ἀκούω.
- source_word: μαθηταὶ αὐτοῦ
  choice: os seus discípulos
  rationale: Forma possessiva idiomática e clara em português.
theological_decisions:
- issue: Natureza do pronunciamento de Jesus à figueira
  choice: “Nunca mais ninguém coma fruto de você” como desejo imprecatório/pronunciamento de juízo
  alternative: “Nunca mais ninguém comerá fruto de você” como simples previsão
  rationale: O optativo φάγοι tem força volitiva, não é futuro indicativo. A formulação com o subjuntivo preserva o pronunciamento de maldição ou juízo sem reduzi-lo a uma previsão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção “Nunca mais ninguém coma” conserva a força de imprecação do optativo, embora seja mais marcada que uma previsão no futuro. Os marcadores foram colocados exatamente nos pontos relevantes do texto.
