source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν κώμην τὴν κατέναντι ὑμῶν, καὶ ⸀εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν εὑρήσετε πῶλον δεδεμένον ἐφ’ ὃν οὐδεὶς ⸀οὔπω ἀνθρώπων ⸀ἐκάθισεν· ⸂λύσατε αὐτὸν καὶ φέρετε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/002.yaml
  text: And he says to them[a], “Go into the village opposite you, and as soon as you enter it, you will find a colt tied there, on which no one has yet sat[b]. Untie it and bring it.”
translation:
  language: pt
  text: 'E lhes disse: “Vão ao povoado que está diante de vocês. Assim que entrarem nele, encontrarão um potro[a] amarrado, no qual ninguém ainda montou[b]. Desamarrem-no e tragam-no.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego πῶλον designa um animal jovem e não especifica necessariamente a espécie; também pode ser traduzido por “jumentinho”. Neste contexto, refere-se ao animal que Jesus montará.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sobre o qual nenhum ser humano ainda se sentou”. A expressão afirma explicitamente que nenhuma pessoa havia montado o animal.
    reason: literal_rendering
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Vão
  rationale: O imperativo indica deslocamento; “Vão” é direto, natural e não acrescenta uma nuance ausente do grego.
- source_word: κώμην
  choice: povoado
  rationale: κώμη designa uma localidade menor que uma cidade. “Povoado” é claro e amplamente compreensível em português.
- source_word: τὴν κατέναντι ὑμῶν
  choice: que está diante de vocês
  rationale: A expressão identifica o povoado situado em frente ao lugar onde estavam. A formulação evita a possível ideia de oposição sugerida por “oposto”.
- source_word: εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν
  choice: Assim que entrarem nele
  rationale: A oração temporal expressa de modo idiomático que o encontro ocorrerá logo na entrada do povoado.
- source_word: πῶλον
  choice: jumentinho
  rationale: πῶλος pode designar um animal jovem sem especificar por si só a espécie; neste contexto, o animal destinado à montaria de Jesus é entendido como um jumento jovem. A ambiguidade lexical é registrada em nota.
- source_word: δεδεμένον
  choice: amarrado
  rationale: O particípio perfeito passivo descreve o animal no estado de estar preso por uma amarra; “amarrado” é a forma corrente em português.
- source_word: οὐδεὶς οὔπω ἀνθρώπων ἐκάθισεν
  choice: no qual ninguém ainda montou
  rationale: Embora o grego diga literalmente que nenhum ser humano ainda se sentou sobre o animal, “montou” comunica naturalmente a ação no contexto sem ampliar οὔπω para “jamais”.
- source_word: λύσατε αὐτὸν καὶ φέρετε
  choice: Desamarrem-no e tragam-no
  rationale: “Desamarrar” corresponde à soltura do animal preso, e “trazer” preserva a amplitude de φέρω sem especificar se ele seria conduzido ou carregado.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “vocês”. O presente narrativo grego λέγει foi vertido pelo pretérito “disse”, forma mais natural na narrativa portuguesa. A pontuação divide a ordem inicial da previsão seguinte para melhorar a fluidez sem alterar a relação entre as ideias.
