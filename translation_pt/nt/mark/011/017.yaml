id: MRK.11.17
reference: Mark 11:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐδίδασκεν ⸂καὶ ἔλεγεν⸃ ⸀αὐτοῖς· Οὐ γέγραπται ὅτι Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται πᾶσιν τοῖς ἔθνεσιν; ὑμεῖς δὲ ⸀πεποιήκατε αὐτὸν σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/017.yaml
  text: And he was teaching and saying to them[a], “Is it not written[b], ‘My house will be called a house of prayer for all the nations’? But you have made it a den of robbers.”
translation:
  language: pt
  text: 'E ele ensinava e lhes dizia: “Não está escrito: ‘A minha casa será chamada casa de oração para todas as nações[a]’? Mas vocês fizeram dela um covil de ladrões[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para todos os povos”. O grego diz literalmente “para todas as nações”, ecoando Isaías 56:7 e destacando que a casa de Deus se destinava também às nações além de Israel.
    reason: lexical_alternative
  - marker: b
    text: “Covil de ladrões” ecoa Jeremias 7:11. A palavra grega traduzida como “ladrões” também pode significar “bandidos” ou “salteadores” em alguns contextos.
    reason: cross_reference
lexical_decisions:
- source_word: ἐδίδασκεν καὶ ἔλεγεν
  choice: ensinava e lhes dizia
  rationale: Os dois verbos estão no imperfeito e apresentam ações em andamento ou reiteradas; a formulação mantém esse aspecto com naturalidade em português.
- source_word: Οὐ γέγραπται
  choice: Não está escrito
  rationale: Reproduz de modo idiomático a fórmula no perfeito passivo que apela para a autoridade permanente das Escrituras.
- source_word: Ὁ οἶκός μου
  choice: A minha casa
  rationale: Mantém o sentido direto de οἶκος e o eco verbal de Isaías 56:7, sem substituir a metáfora por “templo”.
- source_word: οἶκος προσευχῆς
  choice: casa de oração
  rationale: Expressão portuguesa natural e tradicional que representa com precisão a construção genitiva grega.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: para todas as nações
  rationale: Preserva o alcance universal da citação de Isaías e traduz ἔθνη diretamente como “nações”; a nota registra a alternativa idiomática “todos os povos”.
- source_word: πεποιήκατε
  choice: fizeram dela
  rationale: O perfeito indica uma ação cujo resultado permanece; “fizeram dela” expressa naturalmente a transformação da casa no estado denunciado.
- source_word: σπήλαιον λῃστῶν
  choice: covil de ladrões
  rationale: “Covil” comunica um esconderijo ou refúgio e preserva a conhecida alusão a Jeremias 7:11; “ladrões” evita impor uma nuance política mais específica.
theological_decisions:
- issue: Alcance universal da citação profética
  choice: para todas as nações
  alternative: para todos os povos; por todas as nações
  rationale: A opção mantém a forma e a tensão do texto grego e o vínculo com Isaías 56:7, sem desenvolver o alcance da frase segundo um sistema teológico posterior.
- issue: Sentido de λῃστῶν na acusação de Jesus
  choice: ladrões
  alternative: bandidos; salteadores; insurgentes
  rationale: A alusão a Jeremias 7:11 favorece “ladrões”. Embora o termo possa designar bandidos ou rebeldes em certos contextos, o versículo não exige que se explicite uma conotação política.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” torna explícito o pronome enfático ὑμεῖς e soa natural ao público geral; “dela” evita a repetição pesada de “a minha casa”. Os marcadores foram colocados junto às expressões efetivamente explicadas pelas notas.
