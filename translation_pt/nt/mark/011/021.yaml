  verdict: revise
  source_fidelity: A tradução reproduz adequadamente os elementos centrais do grego, inclusive o presente histórico em “diz”, a referência pronominal em “lhe”, “Rabi” e a figueira que secou. Contudo, “Então” torna a simples conjunção καί em uma inferência temporal mais definida, e “o senhor” introduz uma forma de tratamento ausente do texto grego.
  naturalness: O texto é claro e natural. “E Pedro, lembrando-se” preserva melhor tanto a ligação narrativa quanto a construção participial, sem a nuance temporal adicional de “Então”. “Amaldiçoaste” é apropriado no registro bíblico moderno e evita a introdução de um pronome/tratamento de terceira pessoa.
  terminology: “Rabi”, “figueira” e “amaldiçoaste” são adequados. “Secou” é idiomático para uma árvore; a nota pode registrar “está ressequida” como alternativa que torna mais explícito o estado resultante do perfeito.
