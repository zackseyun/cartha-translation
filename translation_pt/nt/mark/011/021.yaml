    rationale: O verbo grego é segunda pessoa singular. Embora respeitoso em português brasileiro, “o senhor” muda a pessoa gramatical da formulação e introduz um elemento pragmático não expresso. “Amaldiçoaste” preserva diretamente a segunda pessoa.
