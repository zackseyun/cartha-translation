base_translation:
  language: en
  yaml_path: translation/nt/mark/011/021.yaml
  text: And Peter[a], remembering, says to him, “Rabbi, look—the fig tree that you cursed has withered.”
translation:
  language: pt
  text: 'E Pedro, lembrando-se, lhe diz: “Rabi, veja! A figueira que amaldiçoaste secou[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “está ressequida”. O verbo grego pode indicar que algo secou ou murchou; o tempo perfeito destaca o resultado presente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναμνησθεὶς
  choice: lembrando-se
  rationale: Preserva a relação participial com a fala de Pedro e expressa naturalmente a ideia de recordar-se ou ser levado a lembrar.
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico característico da narrativa vívida de Marcos.
- source_word: αὐτῷ
  choice: lhe
  rationale: Conserva o pronome do grego sem explicitar desnecessariamente o referente, Jesus.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Mantém o título transliterado presente no texto grego e preserva o contexto judaico.
- source_word: ἴδε
  choice: veja
  rationale: Imperativo corrente e natural em português para chamar a atenção do interlocutor.
- source_word: ἡ συκῆ
  choice: a figueira
  rationale: Designa claramente a árvore, como exige o contexto.
- source_word: κατηράσω
  choice: o senhor amaldiçoou
  rationale: Traduz diretamente o aoristo da segunda pessoa; o tratamento 'o senhor' soa natural e respeitoso em português brasileiro, de acordo com a forma de tratamento 'Rabi'.
- source_word: ἐξήρανται
  choice: secou
  rationale: É uma forma idiomática aplicada a uma árvore e comunica o processo concluído com resultado presente; a nota registra a alternativa lexical mais explícita.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O presente histórico foi preservado em “diz”, e “Rabi” mantém a ambientação judaica. A colocação do marcador após a frase associa a nota ao verbo final.
