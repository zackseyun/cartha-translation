  text: Καὶ τῇ ἐπαύριον ἐξελθόντων αὐτῶν ἀπὸ Βηθανίας ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/012.yaml
  text: And on the next day, when they had gone out from Bethany, he was hungry.
translation:
  language: pt
  text: E, no dia seguinte, quando saíram de Betânia, ele sentiu fome.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Mantém a ligação narrativa e o estilo paratático característico de Marcos.
- source_word: τῇ ἐπαύριον
  choice: no dia seguinte
  rationale: Expressa de modo natural e claro a sequência temporal indicada pela construção adverbial.
- source_word: ἐξελθόντων αὐτῶν
  choice: quando saíram
  rationale: A construção genitiva absoluta indica uma ação temporal do grupo, anterior ou circunstancial à ação principal. O plural é preservado sem tornar a frase pesada.
- source_word: ἀπὸ Βηθανίας
  choice: de Betânia
  rationale: ἀπό indica movimento para longe de um lugar; a forma portuguesa consagrada do topônimo é Betânia.
- source_word: ἐπείνασεν
  choice: ele sentiu fome
  rationale: Tradução portuguesa corrente que pode comunicar naturalmente o surgimento da fome sem exagerar um valor ingressivo que o aoristo, por si só, não exige.
theological_decisions:
- issue: Sujeito implícito de ἐπείνασεν
  choice: Manter o sujeito como “ele”, referindo-se contextualmente a Jesus.
  alternative: Explicitar “Jesus” para maior clareza.
  rationale: O grego não nomeia o sujeito nesta oração, embora o contexto o torne claro. “Ele” preserva a concisão do texto e sua afirmação direta da fome humana de Jesus, sem acréscimo interpretativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Sentiu fome” é mais idiomático do que “teve fome” no português brasileiro e evita a rigidez de “ficou com fome”; a ordem da frase conserva o encadeamento simples do grego.
