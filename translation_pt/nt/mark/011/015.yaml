  text: Καὶ ἔρχονται εἰς Ἱεροσόλυμα. καὶ ⸀εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς πωλοῦντας καὶ ⸀τοὺς ἀγοράζοντας ἐν τῷ ἱερῷ, καὶ τὰς τραπέζας τῶν κολλυβιστῶν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστερὰς κατέστρεψεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/015.yaml
  text: And they came to Jerusalem. And entering the temple[a], he began to drive out those who were selling and those who were buying in the temple, and he overturned the tables of the money changers and the seats of those who were selling doves.
translation:
  language: pt
  text: E chegaram a Jerusalém. Ao entrar no templo[a], ele começou a expulsar os que vendiam e os que compravam no templo; derrubou as mesas dos cambistas e os assentos dos que vendiam pombas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos pátios do templo” ou “na área do templo”; o termo grego se refere ao complexo mais amplo do templo, não especificamente ao santuário interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: chegaram
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma natural na narrativa em português, sem alterar a sequência dos acontecimentos.
- source_word: Ἱεροσόλυμα
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do topônimo.
- source_word: εἰσελθὼν
  choice: ao entrar
  rationale: Expressa de modo natural a relação circunstancial do particípio aoristo com a ação principal, sem a rigidez de uma construção participial literal.
- source_word: τὸ ἱερὸν / ἐν τῷ ἱερῷ
  choice: o templo / no templo
  rationale: Mantém a designação familiar e concisa; aqui ἱερόν indica o complexo do templo, nuance esclarecida em nota.
- source_word: ἤρξατο ἐκβάλλειν
  choice: começou a expulsar
  rationale: Preserva explicitamente o aspecto incoativo da construção e a força de ἐκβάλλω em português corrente.
- source_word: τοὺς πωλοῦντας καὶ τοὺς ἀγοράζοντας
  choice: os que vendiam e os que compravam
  rationale: Conserva o paralelismo dos particípios substantivados e seu sentido de atividade em andamento.
- source_word: κολλυβιστῶν
  choice: cambistas
  rationale: Termo português claro e tradicional para pessoas que trocavam moedas.
- source_word: καθέδρας
  choice: assentos
  rationale: Equivalente abrangente que evita especificar indevidamente cadeiras ou bancos.
- source_word: περιστερὰς
  choice: pombas
  rationale: Termo natural em português e adequado ao contexto de animais vendidos para sacrifício.
- source_word: κατέστρεψεν
  choice: virou
  rationale: No contexto de mesas e assentos, comunica de maneira natural e vívida a ação de pô-los de pernas para o ar.
theological_decisions:
- issue: Alcance espacial de ἱερόν no relato
  choice: templo, entendido como o complexo do templo
  alternative: pátios do templo; área do templo
  rationale: Ἱερόν designa aqui a área mais ampla do templo, não especificamente o santuário interior. O texto principal conserva a expressão familiar, e a nota impede uma leitura espacial indevidamente restrita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação reduz o acúmulo de coordenações sem apagar a sequência narrativa do grego.
