id: MRK.11.29
reference: Mark 11:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰησοῦς εἶπεν αὐτοῖς· Ἐπερωτήσω ⸀ὑμᾶς ἕνα λόγον, καὶ ἀποκρίθητέ μοι, καὶ ἐρῶ ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/029.yaml
  text: But Jesus said to them[a], “I will ask you one question. Answer me[b], and I will tell you by what authority I do these things.”
translation:
  language: pt
  text: 'Mas Jesus lhes disse: “Vou fazer uma pergunta a vocês.[a] Respondam-me, e eu lhes direi com que autoridade faço estas coisas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma coisa”; mais literalmente, “uma palavra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca uma leve contraposição ou transição em resposta à pergunta dos líderes no versículo anterior.
- source_word: εἶπεν αὐτοῖς
  choice: lhes disse
  rationale: Forma narrativa natural e fiel para o verbo de fala com objeto indireto.
- source_word: Ἐπερωτήσω ὑμᾶς
  choice: Vou fazer uma pergunta a vocês
  rationale: Expressa naturalmente em português o futuro que introduz a contrapergunta de Jesus.
- source_word: ἕνα λόγον
  choice: uma pergunta
  rationale: Embora λόγος possa significar literalmente “palavra”, neste contexto designa algo que deve ser respondido; “uma pergunta” comunica melhor o sentido idiomático.
- source_word: ἀποκρίθητέ μοι
  choice: Respondam-me
  rationale: Preserva a força imperativa do aoristo e dirige a resposta explicitamente a Jesus.
- source_word: ἐρῶ ὑμῖν
  choice: eu lhes direi
  rationale: Tradução idiomática da promessa de revelar a informação solicitada.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: com que autoridade
  rationale: Em português, esta formulação expressa de modo natural a base ou autorização pela qual Jesus age.
- source_word: ταῦτα ποιῶ
  choice: faço estas coisas
  rationale: O presente simples mantém a referência às ações de Jesus que estão sendo contestadas.
theological_decisions:
- issue: Sentido de ἐξουσία no contexto
  choice: autoridade
  alternative: direito; poder
  rationale: A controvérsia diz respeito à legitimidade ou autorização das ações de Jesus, não apenas à sua capacidade; “autoridade” preserva a amplitude institucional e teológica do termo.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A divisão em duas frases evita uma coordenação pouco natural entre declaração e imperativo, sem eliminar a sequência lógica do grego. O pronome explícito “eu” na promessa dá clareza e leve ênfase responsiva.
