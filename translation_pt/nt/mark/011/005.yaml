base_translation:
  language: en
  yaml_path: translation/nt/mark/011/005.yaml
  text: And some of those standing there were saying to them[a], “What are you doing, untying the colt?”
translation:
  language: pt
  text: 'E alguns dos que estavam ali lhes diziam: “O que vocês estão fazendo, desamarrando o jumentinho[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um animal jovem”. A palavra grega πῶλος pode designar um animal jovem; neste contexto, refere-se a um jumento.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες
  choice: alguns
  rationale: Preserva a referência indefinida a uma parte não especificada das pessoas presentes, em português natural.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: dos que estavam ali
  rationale: Reproduz de modo idiomático o particípio substantivado e o advérbio ἐκεῖ, sem interpretar as pessoas especificamente como meros espectadores.
- source_word: ἔλεγον
  choice: disseram
  rationale: Em português narrativo, o pretérito perfeito é a forma mais natural para introduzir esta fala; o imperfeito grego apresenta a ação em curso, mas “estavam dizendo” soaria pesado neste contexto e poderia sugerir repetição.
- source_word: αὐτοῖς
  choice: a eles
  rationale: Mantém explicitamente o objeto indireto plural, referente aos discípulos.
- source_word: Τί ποιεῖτε
  choice: O que vocês estão fazendo
  rationale: Expressa diretamente a pergunta no presente, sem acrescentar uma ideia causal como “por quê”.
- source_word: λύοντες
  choice: desamarrando
  rationale: No contexto de um animal preso, é o equivalente corrente e preciso do particípio presente λύοντες.
- source_word: τὸν πῶλον
  choice: o jumentinho
  rationale: Embora πῶλος possa designar genericamente um animal novo, o contexto imediato identifica o animal como montaria e favorece “jumentinho”; a nota preserva a amplitude lexical do termo grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vocês” é usado como forma plural corrente; a ordem da pergunta conserva a ação participial do grego sem artificialidade.
