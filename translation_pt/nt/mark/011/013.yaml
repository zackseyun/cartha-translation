source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν ⸀ἀπὸ μακρόθεν ἔχουσαν φύλλα ἦλθεν εἰ ἄρα ⸂τι εὑρήσει⸃ ἐν αὐτῇ, καὶ ἐλθὼν ἐπ’ αὐτὴν οὐδὲν εὗρεν εἰ μὴ φύλλα, ⸂ὁ γὰρ καιρὸς οὐκ ἦν⸃ σύκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/013.yaml
  text: And seeing from a distance a fig tree having leaves[a], he went to see whether perhaps he would find anything on it. But when he came to it, he found nothing except leaves, for it was not the season for figs.
translation:
  language: pt
  text: E, vendo de longe uma figueira com folhas, foi ver se talvez encontraria nela alguma coisa. Mas, ao chegar perto dela, não encontrou nada além de folhas, pois não era a época dos figos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o tempo dos figos”.'
    reason: Alternativa lexical para καιρός, que pode indicar tanto a época apropriada quanto o tempo ou momento oportuno.
lexical_decisions:
- source_word: ἰδὼν
  choice: vendo
  rationale: Preserva o valor circunstancial do particípio, sem especificar além do necessário se a ação é estritamente anterior ou simultânea.
- source_word: συκῆν
  choice: uma figueira
  rationale: Equivalente corrente e preciso em português.
- source_word: ἀπὸ μακρόθεν
  choice: de longe
  rationale: Expressão natural que mantém o sentido espacial da locução grega.
- source_word: ἔχουσαν φύλλα
  choice: com folhas
  rationale: Formulação idiomática em português, semanticamente equivalente a 'tendo folhas'.
- source_word: ἦλθεν εἰ ἄρα τι εὑρήσει ἐν αὐτῇ
  choice: foi ver se talvez encontraria nela alguma coisa
  rationale: Comunica naturalmente a finalidade e a expectativa incerta expressas por εἰ ἄρα, sem eliminar o sentido de possibilidade.
- source_word: ἐν αὐτῇ
  choice: nela
  rationale: O pronome retoma naturalmente 'figueira'; em português, encontrar fruto 'nela' é idiomático.
- source_word: ἐλθὼν ἐπ’ αὐτὴν
  choice: ao chegar perto dela
  rationale: Transmite de modo fluente a aproximação indicada pelo particípio e pela preposição, evitando uma repetição pouco natural de 'ir' e 'vir'.
- source_word: οὐδὲν εὗρεν εἰ μὴ φύλλα
  choice: não encontrou nada além de folhas
  rationale: Mantém a exclusividade de εἰ μὴ em linguagem portuguesa atual e clara.
- source_word: ὁ γὰρ καιρὸς οὐκ ἦν σύκων
  choice: pois não era a temporada de figos
  rationale: '''Temporada'' expressa o período apropriado indicado por καιρός e preserva diretamente o comentário explicativo do narrador.'
theological_decisions:
- issue: Força interpretativa da explicação sobre a temporada de figos
  choice: 'Manter a afirmação direta: ''pois não era a temporada de figos''.'
  alternative: Expandir a frase com uma explicação agrícola ou reformulá-la para atenuar a aparente tensão narrativa.
  rationale: A tradução preserva a tensão de Jesus procurar algo na figueira embora o narrador diga que não era a temporada de figos, sem tentar resolvê-la por paráfrase.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para soar natural, mantendo a sequência e a incerteza do grego. O sujeito permanece implícito, como é natural em português e compatível com o contexto.
