source:
  edition: SBLGNT
  text: καὶ ⸀διελογίζοντο πρὸς ἑαυτοὺς λέγοντες· ⸂Τί εἴπωμεν;⸃ ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί ⸀οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/031.yaml
  text: And they were reasoning among themselves[a], saying, “What should we say? If we say, ‘From heaven,’ he will say, ‘Why then did you not believe him?’”
translation:
  language: pt
  text: 'E eles raciocinavam entre si, dizendo: “O que devemos dizer? Se dissermos: ‘Do céu’[a], ele dirá: ‘Por que, então, vocês não acreditaram nele?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Do céu” é uma forma reverencial judaica de dizer “de Deus” ou “de origem divina”.
    reason: cultural_note
lexical_decisions:
- source_word: διελογίζοντο
  choice: discutiam
  rationale: O imperfeito indica uma deliberação em andamento. “Discutiam” comunica naturalmente a troca de raciocínios no grupo, sem sugerir necessariamente uma briga.
- source_word: πρὸς ἑαυτοὺς
  choice: entre si
  rationale: A expressão indica deliberação recíproca dentro do grupo, não apenas pensamento interior individual.
- source_word: λέγοντες
  choice: introduzido por dois-pontos
  rationale: O particípio introduz o conteúdo da discussão; em português, os dois-pontos evitam a construção menos natural “dizendo” sem perder informação.
- source_word: Τί εἴπωμεν;
  choice: O que devemos dizer?
  rationale: O subjuntivo aoristo deliberativo pergunta qual resposta deveriam dar; esta formulação é atual, clara e mantém esse valor.
- source_word: ἐὰν εἴπωμεν
  choice: Se dissermos
  rationale: Preserva de modo idiomático a condição eventual expressa por ἐάν com o subjuntivo.
- source_word: Ἐξ οὐρανοῦ
  choice: Do céu
  rationale: Mantém literalmente a expressão reverencial judaica e sua ambiguidade cultural, esclarecida em nota, sem substituí-la interpretativamente por “De Deus”.
- source_word: ἐρεῖ
  choice: ele dirá
  rationale: Tradução direta do futuro de λέγω; a fala citada mostra que a resposta esperada assume forma de pergunta.
- source_word: Διὰ τί οὖν
  choice: Então, por que
  rationale: Expressa com naturalidade a inferência marcada por οὖν e liga a pergunta à resposta hipotética anterior.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: vocês não acreditaram nele
  rationale: πιστεύω com dativo significa aqui acreditar na pessoa, isto é, aceitar seu testemunho. “Acreditaram nele” preserva essa relação sem introduzir a nuance mais forte de “crer em” alguém.
theological_decisions:
- issue: Sentido de “do céu” com referência ao batismo ou à autoridade de João
  choice: Manter “Do céu” no texto principal
  alternative: “De Deus”
  rationale: A expressão indica origem ou autorização divina por meio de uma formulação reverencial judaica. Preservá-la mantém a linguagem da fonte e evita converter uma explicação cultural em tradução explícita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe direta conserva o movimento deliberativo do versículo; “vocês” evita formas regionais ou arcaizantes, e a nota explica o idioma cultural sem sobrecarregar o texto principal.
