id: MRK.11.26
reference: Mark 11:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: robinson-pierpont-2005-byzantine
  text: Εἰ δὲ ὑμεῖς οὐκ ἀφίετε, οὐδὲ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφήσει τὰ παραπτώματα ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/026.yaml
  text: But[a] if you do not forgive, neither will your Father who is in heaven forgive your trespasses.
translation:
  language: pt
  text: Mas[a], se vocês não perdoarem, nem o Pai de vocês, que está nos céus, perdoará as suas transgressões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo não aparece nos manuscritos gregos mais antigos, entre eles o Sinaítico e o Vaticano, do século IV, nem nas antigas versões coptas. Está presente, porém, na tradição majoritária bizantina, na tradição latina e na maioria dos testemunhos siríacos. É provável que tenha sido acrescentado por copistas posteriores para harmonizar esta passagem com as palavras de Jesus em Mateus 6:15.
    reason: textual_critical
lexical_decisions:
- source_word: ἀφίημι
  choice: perdoar
  rationale: No contexto de ofensas humanas e do juízo divino, “perdoar” expressa com naturalidade a ideia de deixar de cobrar a culpa; a repetição do mesmo verbo preserva o paralelismo grego.
- source_word: παράπτωμα
  choice: transgressões
  rationale: “Transgressões” preserva a noção de desvios ou faltas morais e mantém alguma distinção em relação ao termo mais geral para “pecado”, sem soar excessivamente técnico.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: que está nos céus
  rationale: Reproduz a oração atributiva grega e mantém o plural literal “céus”, em linguagem bíblica clara e digna.
theological_decisions:
- issue: Relação entre o perdão concedido e o perdão divino
  choice: Preservar a formulação condicional e recíproca do versículo sem explicá-la no texto
  alternative: Parafrasear de modo a definir se o perdão humano é causa, condição ou evidência do perdão divino
  rationale: O grego afirma a relação de forma direta, mas não desenvolve aqui sua natureza teológica; explicá-la resolveria uma tensão que o texto preserva.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. Emprega “vocês” para o plural ὑμεῖς, evitando tanto regionalismo excessivo quanto ambiguidade numérica. A posição do marcador após “Mas” vincula a nota à presença textual do versículo inteiro, em correspondência com a camada de consulta.
