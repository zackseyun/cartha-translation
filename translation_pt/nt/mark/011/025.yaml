id: MRK.11.25
reference: Mark 11:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀στήκετε προσευχόμενοι, ἀφίετε εἴ τι ἔχετε κατά τινος, ἵνα καὶ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφῇ ὑμῖν τὰ παραπτώματα ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/025.yaml
  text: And whenever you stand praying[a], forgive, if you have anything against anyone[b], so that your Father who is in the heavens may also forgive you your trespasses.
translation:
  language: pt
  text: E, sempre que estiverem de pé orando, perdoem, se tiverem alguma coisa contra alguém, para que também o Pai de vocês, que está nos céus[a], perdoe as transgressões de vocês[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «que está no céu». O grego traz «nos céus», no plural.
    reason: lexical_alternative
  - marker: b
    text: Ou «ofensas» ou «delitos».
    reason: lexical_alternative
lexical_decisions:
- source_word: στήκετε
  choice: estiverem de pé
  rationale: Preserva a imagem concreta da postura indicada pelo verbo e, com «sempre que», expressa naturalmente uma ação habitual ou recorrente.
- source_word: προσευχόμενοι
  choice: orando
  rationale: O particípio descreve uma ação simultânea a «estiverem de pé»; «de pé orando» mantém essa relação sem reduzir a expressão a um simples «quando orarem».
- source_word: ἀφίετε
  choice: perdoem
  rationale: Neste contexto interpessoal, o verbo significa deixar de cobrar uma ofensa, isto é, perdoar. A mesma escolha lexical também mantém a correspondência com a ação posterior do Pai.
- source_word: εἴ τι ἔχετε κατά τινος
  choice: se tiverem alguma coisa contra alguém
  rationale: Formulação corrente em português que preserva tanto a ideia de queixa ou ressentimento contra uma pessoa quanto a abrangência dos pronomes indefinidos gregos.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: o Pai de vocês, que está nos céus
  rationale: «Pai de vocês» é claro e natural para leitores brasileiros, e «nos céus» conserva o plural explícito do grego.
- source_word: ἀφῇ
  choice: perdoe
  rationale: O subjuntivo depois de ἵνα é adequadamente representado por «para que ... perdoe»; «também» preserva o καί que vincula as duas ações de perdoar.
- source_word: παραπτώματα
  choice: transgressões
  rationale: «Transgressões» comunica violações ou faltas e preserva uma distinção possível em relação ao termo grego mais geral para «pecados».
theological_decisions:
- issue: Relação condicional entre o perdão humano e o perdão divino
  choice: «para que também ... perdoe»
  alternative: Uma paráfrase que apresente o perdão aos outros apenas como evidência de já ter sido perdoado
  rationale: A construção ἵνα ... ἀφῇ estabelece no próprio versículo uma ligação real entre perdoar os outros e o perdão concedido pelo Pai. A tradução mantém essa tensão sem impor uma explicação doutrinária externa.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A colocação «de pé orando» conserva a imagem e a relação participial do grego; «Pai de vocês» evita ambiguidade de referente no português falado e escrito contemporâneo.
