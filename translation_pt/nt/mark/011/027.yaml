id: MRK.11.27
reference: Mark 11:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται πάλιν εἰς Ἱεροσόλυμα. καὶ ἐν τῷ ἱερῷ περιπατοῦντος αὐτοῦ ἔρχονται πρὸς αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/027.yaml
  text: And they came again to Jerusalem. And as he was walking in the temple courts[a], the chief priests and the scribes and the elders came to him.
translation:
  language: pt
  text: Eles chegaram novamente a Jerusalém. Enquanto Jesus caminhava pelos pátios do templo[a], os chefes dos sacerdotes, os escribas e os anciãos se aproximaram dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «no templo», «na área do templo» ou «no recinto do templo»; o termo grego se refere ao complexo mais amplo do templo, não especificamente ao santuário interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: chegaram
  rationale: O presente grego é um presente histórico; o pretérito perfeito é mais natural na narrativa em português e preserva o fluxo do relato.
- source_word: πάλιν
  choice: novamente
  rationale: Expressa de modo claro a repetição da chegada a Jerusalém.
- source_word: Ἱεροσόλυμα
  choice: Jerusalém
  rationale: Forma consagrada do topônimo em português.
- source_word: ἐν τῷ ἱερῷ
  choice: pelos pátios do templo
  rationale: ἱερόν designa o complexo mais amplo do templo, e não especificamente o santuário interior; com o verbo caminhar, «pelos» comunica naturalmente o espaço percorrido.
- source_word: περιπατοῦντος αὐτοῦ
  choice: Enquanto Jesus caminhava
  rationale: O genitivo absoluto fornece a circunstância de fundo e apresenta uma ação em andamento. O nome «Jesus» evita uma sequência pronominal potencialmente pouco clara em português.
- source_word: ἀρχιερεῖς
  choice: os chefes dos sacerdotes
  rationale: No plural, refere-se às principais autoridades sacerdotais. Esta expressão é clara em português atual e evita sugerir vários sumos sacerdotes simultâneos.
- source_word: γραμματεῖς
  choice: os escribas
  rationale: Equivalente lexical direto e tradicional, ainda compreensível no contexto dos Evangelhos, sem restringir interpretativamente o termo a «mestres da Lei».
- source_word: πρεσβύτεροι
  choice: os anciãos
  rationale: Neste contexto institucional, designa líderes reconhecidos do povo, e não apenas homens idosos.
- source_word: πρὸς αὐτόν
  choice: se aproximaram dele
  rationale: Expressa idiomaticamente o movimento em direção a Jesus indicado por πρὸς com verbo de movimento.
theological_decisions:
- issue: Sentido espacial de ἱερόν
  choice: pátios do templo
  alternative: templo; área do templo; recinto do templo
  rationale: A tradução distingue o complexo público do templo do santuário interior, sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos três grupos de autoridades foi preservada. O presente histórico grego foi vertido no passado, de modo natural à narrativa portuguesa.
