  text: ὁ δὲ ⸂ἐκπερισσῶς ἐλάλει⸃· Ἐὰν ⸂δέῃ με⸃ συναποθανεῖν σοι, οὐ μή σε ⸀ἀπαρνήσομαι. ὡσαύτως δὲ καὶ πάντες ἔλεγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/031.yaml
  text: But he kept insisting all the more[a], “If I must die together with you[c][b], I will certainly not deny you.” And they all were saying the same thing.
translation:
  language: pt
  text: 'Mas ele insistia com ainda mais veemência[a]: “Se eu tiver de morrer com você[b], de modo nenhum o negarei[c].” E todos diziam a mesma coisa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falava com a máxima ênfase”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “morrer junto com você”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “nunca o negarei”. O grego emprega uma negação enfática.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπερισσῶς ἐλάλει
  choice: insistia com ainda mais veemência
  rationale: O advérbio intensifica a fala de Pedro, e o imperfeito indica ação continuada ou repetida. A formulação comunica tanto a insistência quanto sua intensidade crescente.
- source_word: Ἐὰν δέῃ με
  choice: Mesmo que eu tenha de
  rationale: δέῃ expressa necessidade. Neste contexto concessivo, “mesmo que” apresenta naturalmente o caso extremo invocado por Pedro sem reduzir a ideia de obrigação.
- source_word: συναποθανεῖν σοι
  choice: morrer com você
  rationale: O verbo composto expressa morrer junto com alguém. “Morrer com você” é a forma natural em português, enquanto a nota registra a composição explícita do grego.
- source_word: οὐ μή
  choice: de modo nenhum
  rationale: A dupla negação grega é enfática. “De modo nenhum” preserva a força categórica da promessa de Pedro em português atual e digno.
- source_word: ἀπαρνήσομαι
  choice: o negarei
  rationale: “Negar” é claro e mantém a ligação verbal com as posteriores negações de Pedro. O pronome retoma Jesus sem ambiguidade no discurso direto.
- source_word: ὡσαύτως δὲ καὶ πάντες ἔλεγον
  choice: E todos diziam a mesma coisa
  rationale: A expressão torna explícito que os demais discípulos faziam a mesma declaração; o imperfeito “diziam” preserva o caráter contínuo ou repetido da fala.
theological_decisions:
- issue: Força da promessa de Pedro de não negar Jesus
  choice: de modo nenhum o negarei
  alternative: nunca o negarei
  rationale: A tradução conserva a negação enfática de οὐ μή e a autoconfiança categórica de Pedro, sem explicar nem suavizar antecipadamente a tensão narrativa com sua posterior negação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Você” mantém clareza e acessibilidade; “com ainda mais veemência” conserva a escalada da insistência, e “de modo nenhum” oferece ênfase forte sem arcaísmo.
