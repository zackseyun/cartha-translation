source:
  edition: SBLGNT
  text: Καὶ ⸂νεανίσκος τις⸃ ⸀συνηκολούθει αὐτῷ περιβεβλημένος σινδόνα ἐπὶ γυμνοῦ, καὶ κρατοῦσιν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/051.yaml
  text: And a certain young man was following him[a], wearing only a linen cloth over his naked body, and they seize him,
translation:
  language: pt
  text: E certo jovem o seguia, coberto apenas com um pano de linho[a] sobre o corpo nu; e eles o agarram,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um lençol de linho”. O termo grego σινδών pode se referir a um pano de linho ou a um tecido semelhante a um lençol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεανίσκος τις
  choice: certo jovem
  rationale: νεανίσκος designa um jovem, e τις lhe dá caráter indefinido, mas particularizante; “certo jovem” preserva a introdução de uma pessoa específica, porém não identificada.
- source_word: συνηκολούθει
  choice: o seguia
  rationale: O imperfeito expressa ação contínua no passado; em português, “seguia” comunica naturalmente esse aspecto durativo.
- source_word: αὐτῷ
  choice: o
  rationale: O pronome se refere a Jesus no contexto; o verbo português “seguir” rege objeto direto.
- source_word: περιβεβλημένος
  choice: coberto
  rationale: O particípio de περιβάλλω pode indicar estar vestido ou envolto em algo. “Coberto” se ajusta ao pano sem determinar que se tratava de uma peça de roupa confeccionada.
- source_word: σινδόνα
  choice: um pano de linho
  rationale: σινδών pode designar um pano de linho, um lençol ou tecido semelhante; “pano de linho” mantém a referência ampla sem definir sua forma exata.
- source_word: ἐπὶ γυμνοῦ
  choice: apenas ... sobre o corpo nu
  rationale: A expressão indica que o tecido estava diretamente sobre o corpo, sem roupa por baixo. A formulação explicita isso em português natural.
- source_word: κρατοῦσιν
  choice: agarram
  rationale: O presente histórico produz vivacidade narrativa. “Agarram” preserva tanto esse tempo verbal quanto a ação física, sem interpretar o ato especificamente como prisão formal.
- source_word: αὐτόν
  choice: o
  rationale: O pronome retoma o jovem como objeto direto de “agarram”.
theological_decisions: []
