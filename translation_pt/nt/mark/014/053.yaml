source:
  edition: SBLGNT
  text: Καὶ ἀπήγαγον τὸν Ἰησοῦν πρὸς τὸν ἀρχιερέα, καὶ ⸀συνέρχονται πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι καὶ οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/053.yaml
  text: And they led Jesus away to the high priest[a], and all the chief priests and the elders and the scribes gathered together.
translation:
  language: pt
  text: Levaram Jesus ao sumo sacerdote, e reúnem-se todos os principais sacerdotes, os anciãos e os escribas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego muda aqui para o presente histórico: “reúnem-se”, uma forma vívida dentro de uma narrativa no passado.'
    reason: Esclarecer a mudança de tempo verbal preservada na tradução.
lexical_decisions:
- source_word: ἀπήγαγον (ἀπάγω)
  choice: levaram
  rationale: Expressa de modo natural o ato de conduzir Jesus sob custódia, sem acrescentar detalhes sobre a maneira como isso ocorreu.
- source_word: ἀρχιερέα
  choice: sumo sacerdote
  rationale: No singular, designa a autoridade sacerdotal principal; “sumo sacerdote” é a forma portuguesa clara e consagrada.
- source_word: συνέρχονται (συνέρχομαι)
  choice: se reúnem
  rationale: Preserva o presente histórico do grego e sua vivacidade narrativa. Essa mudança de tempo também é natural e compreensível em português.
- source_word: πάντες
  choice: todos
  rationale: Mantém a ênfase abrangente do texto grego sobre os grupos de líderes reunidos.
- source_word: ἀρχιερεῖς
  choice: chefes dos sacerdotes
  rationale: No plural, refere-se ao grupo dirigente sacerdotal, distinguindo-o do sumo sacerdote mencionado no singular.
- source_word: πρεσβύτεροι
  choice: anciãos
  rationale: Neste contexto institucional, indica líderes reconhecidos do povo, não apenas homens de idade avançada.
- source_word: γραμματεῖς
  choice: escribas
  rationale: Mantém a designação histórica ampla para os especialistas ligados à escrita e interpretação da Lei, sem restringi-la a uma única função.
theological_decisions:
- issue: Presente histórico em συνέρχονται dentro de uma narrativa no passado
  choice: Preservado como “se reúnem”
  alternative: “se reuniram”
  rationale: O presente grego introduz vivacidade à cena. O português admite esse recurso narrativo sem dificuldade, portanto não é necessário nivelar o verbo ao passado. A escolha não resolve nem cria qualquer distinção doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário bíblico amplamente reconhecido. A ordem foi levemente ajustada para fluência, sem alterar as relações sintáticas ou a abrangência de “todos”.
