base_translation:
  language: en
  yaml_path: translation/nt/mark/014/064.yaml
  text: You have heard the blasphemy[b][a]. What does it seem to you? And they all condemned him as deserving death.
translation:
  language: pt
  text: “Vocês ouviram a blasfêmia. O que lhes parece?[a]” E todos o condenaram como merecedor da morte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “O que vocês acham?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como sujeito à pena de morte”; também: “culpado de morte”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσατε
  choice: Vocês ouviram
  rationale: O aoristo remete diretamente ao que eles acabaram de ouvir; o pretérito perfeito simples é a forma natural em português.
- source_word: τῆς βλασφημίας
  choice: a blasfêmia
  rationale: Preserva o peso jurídico-religioso da acusação e a referência definida às palavras que acabavam de ser pronunciadas.
- source_word: τί ὑμῖν φαίνεται
  choice: O que lhes parece?
  rationale: Mantém de perto a formulação grega e, no contexto, solicita a opinião ou o veredito dos presentes.
- source_word: οἱ δὲ πάντες
  choice: E todos
  rationale: Expressa de modo claro a unanimidade enfatizada por πάντες e a continuidade narrativa de δέ.
- source_word: κατέκριναν
  choice: condenaram
  rationale: Verbo judicial claro e corrente que comunica a emissão de um juízo adverso.
- source_word: ἔνοχον εἶναι θανάτου
  choice: como merecedor da morte
  rationale: Comunica que o consideraram sujeito à pena de morte, evitando a possível leitura de que 'culpado de morte' significaria culpado de causar uma morte.
theological_decisions:
- issue: A acusação de βλασφημία no julgamento
  choice: blasfêmia
  alternative: fala blasfema
  rationale: A tradução conserva a gravidade jurídica e teológica da acusação feita pelo conselho sem apresentá-la como endosso do narrador.
- issue: O sentido judicial de ἔνοχον εἶναι θανάτου
  choice: merecedor da morte
  alternative: sujeito à pena de morte; réu de morte
  rationale: A escolha exprime o veredito dos julgadores sem resolver além do texto a questão da justiça desse veredito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” na fala dirigida ao grupo e “lhes” na construção idiomática “O que lhes parece?”. Os marcadores aparecem imediatamente após as expressões correspondentes.
