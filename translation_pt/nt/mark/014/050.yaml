  text: καὶ ἀφέντες αὐτὸν ⸂ἔφυγον πάντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/050.yaml
  text: And leaving him, they all fled.
translation:
  language: pt
  text: E, deixando-o, todos fugiram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a coordenação simples e o fluxo narrativo, sem acrescentar nuance temporal ou conclusiva.
- source_word: ἀφέντες
  choice: deixando-o
  rationale: O particípio aoristo de ἀφίημι indica deixá-lo para trás; esta formulação conserva a estrutura concisa e evita intensificar interpretativamente com «abandonando».
- source_word: αὐτόν
  choice: -o
  rationale: O pronome retoma Jesus e funciona naturalmente em português como objeto direto enclítico de «deixando».
- source_word: ἔφυγον
  choice: fugiram
  rationale: Expressa de modo conciso e digno a fuga diante do perigo, preservando a força do aoristo narrativo.
- source_word: πάντες
  choice: todos
  rationale: Preserva a ênfase na totalidade dos que estavam com Jesus, sem ampliar o referente além do contexto.
theological_decisions:
- issue: Extensão do abandono de Jesus pelos seus companheiros
  choice: todos fugiram
  alternative: todos eles fugiram
  rationale: A redação mantém a afirmação abrangente do grego neste momento da narrativa, sem atenuá-la nem identificar mais precisamente o grupo além do que o contexto permite.
translation_notes:
  register: Português moderno, conciso e digno, de ampla compreensão internacional e leitura natural no Brasil. A ordem «deixando-o, todos fugiram» conserva a relação participial do grego e sua ênfase final na fuga de todos.
