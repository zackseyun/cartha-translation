  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε αὐτήν· τί αὐτῇ κόπους παρέχετε; καλὸν ἔργον ἠργάσατο ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/006.yaml
  text: But Jesus said[a], “Leave her alone[c][b]. Why are you troubling her? She has done a beautiful work for me.”
translation:
  language: pt
  text: 'Mas Jesus disse: “Deixem-na em paz. Por que vocês a estão incomodando? Ela fez uma bela obra para mim.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em mim”; também pode ser entendido como “sobre mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca naturalmente o contraste entre a crítica anterior e a resposta protetora de Jesus.
- source_word: Ἄφετε αὐτήν
  choice: Deixem-na em paz
  rationale: Expressa de modo idiomático e direto a ordem de cessar a interferência contra a mulher.
- source_word: τί αὐτῇ κόπους παρέχετε;
  choice: Por que vocês a estão incomodando?
  rationale: A expressão significa causar incômodo, dificuldade ou aflição a alguém; esta formulação preserva a repreensão em português corrente.
- source_word: καλὸν ἔργον
  choice: uma bela obra
  rationale: Mantém a amplitude de καλός, que pode indicar algo bom, belo, nobre ou apropriado, e realça a avaliação positiva do gesto.
- source_word: ἠργάσατο
  choice: fez
  rationale: É a forma mais natural de expressar o verbo no contexto, sem a rigidez de uma tradução como 'realizou'.
- source_word: ἐν ἐμοί
  choice: para mim
  rationale: Traduz idiomaticamente a orientação pessoal do ato para Jesus; a forma literal 'em mim' é preservada em nota.
theological_decisions:
- issue: Nuance de καλὸν ἔργον na avaliação do gesto da mulher
  choice: uma bela obra
  alternative: uma boa obra; uma ação nobre
  rationale: Preserva o elogio e a beleza apropriada do gesto sem introduzir uma doutrina de mérito ou uma interpretação sacramental.
- issue: Força de ἐν ἐμοί
  choice: para mim
  alternative: em mim; sobre mim; comigo
  rationale: Comunica em português natural que a ação foi dirigida pessoalmente a Jesus, sem limitar a frase ao aspecto físico da unção nem eliminar a forma grega, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O plural explícito “vocês” reflete os verbos no plural e evita ambiguidade. A nota conserva a construção incomum ἐν ἐμοί e sua possível referência contextual à ação feita sobre Jesus.
