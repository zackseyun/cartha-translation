  verdict: revise
  source_fidelity: A tradução transmite adequadamente a indignação, a referência indefinida a alguns e a avaliação de «desperdício». Contudo, a pergunta nominal «Por que este desperdício de perfume?» deixa apenas implícito o verbo perfeito γέγονεν («aconteceu/ocorreu»). Embora seja uma elipse possível em português, uma formulação verbal preserva mais claramente o evento expresso no grego e o aspecto de resultado presente.
  naturalness: «Mas alguns ficaram indignados entre si» é natural e adequado ao registro. «Por que aconteceu este desperdício de perfume?» continua clara, idiomática e um pouco mais explícita sem se tornar pesada.
  terminology: «Indignados», «desperdício» e «perfume» são escolhas apropriadas. A nota sobre μύρον preserva corretamente «óleo perfumado» e «unguento». A nota sobre πρὸς ἑαυτούς deve formular a alternativa interior de modo mais idiomático em português.
