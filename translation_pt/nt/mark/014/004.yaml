  text: ἦσαν δέ τινες ἀγανακτοῦντες πρὸς ⸀ἑαυτούς· Εἰς τί ἡ ἀπώλεια αὕτη τοῦ μύρου γέγονεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/004.yaml
  text: 'But some were indignant among themselves: “Why has this waste of the perfume happened?”[a][b]'
translation:
  language: pt
  text: 'Mas alguns ficaram indignados entre si: “Por que aconteceu este desperdício de perfume?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uns aos outros” ou “em seu íntimo”. A expressão grega pode indicar uma queixa mútua dentro do grupo ou uma reação interior.
    reason: lexical_alternative
  - marker: b
    text: Ou “óleo perfumado” ou “unguento”. O termo grego μύρον designa óleo aromático ou unguento.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Mas ... ficaram
  rationale: δέ marca aqui um contraste suave com a ação da mulher; “mas” expressa naturalmente essa reação, e “ficaram” introduz em português o estado manifestado no episódio.
- source_word: τινες
  choice: alguns
  rationale: Mantém a referência indefinida e não identifica além do que o texto grego informa.
- source_word: ἀγανακτοῦντες
  choice: indignados
  rationale: Comunica forte desaprovação, incluindo o tom moral da reação, e não apenas irritação.
- source_word: πρὸς ἑαυτούς
  choice: entre si
  rationale: É uma formulação natural e concisa que sugere a reação ou queixa circulando dentro do grupo, sem excluir totalmente a ambiguidade explicada em nota.
- source_word: Εἰς τί
  choice: Por que
  rationale: Equivalente idiomático em português para a pergunta acerca da finalidade ou razão percebida.
- source_word: ἡ ἀπώλεια αὕτη
  choice: este desperdício
  rationale: No contexto do produto caro derramado, ἀπώλεια exprime a avaliação dos que o consideram perdido ou esbanjado.
- source_word: τοῦ μύρου
  choice: de perfume
  rationale: μύρον designa óleo aromático ou unguento; “perfume” é claro e corrente, enquanto a nota preserva a alternativa material mais específica.
- source_word: γέγονεν
  choice: '[expresso pela construção nominal interrogativa]'
  rationale: Em português natural, “Por que este desperdício de perfume?” comunica que o desperdício ocorreu sem a formulação pesada “por que aconteceu”; o resultado presente do perfeito permanece implícito no demonstrativo e na pergunta.
