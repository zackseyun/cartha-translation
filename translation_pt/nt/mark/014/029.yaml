  text: ὁ δὲ Πέτρος ἔφη αὐτῷ· ⸂Εἰ καὶ⸃ πάντες σκανδαλισθήσονται, ἀλλ’ οὐκ ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/029.yaml
  text: But Peter said to him[a], “Even if all fall away, I will not.”
translation:
  language: pt
  text: 'Mas Pedro lhe disse: “Mesmo que todos se afastem[a], eu não.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tropecem”, “venham a cair” ou “sejam levados a tropeçar”. O verbo grego pode indicar ser levado a tropeçar, escandalizar-se ou afastar-se.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Expressa o contraste entre a previsão anterior de Jesus e a objeção confiante de Pedro.
- source_word: ἔφη αὐτῷ
  choice: lhe disse
  rationale: Reproduz com naturalidade o verbo de fala e mantém a referência pronominal a Jesus.
- source_word: Εἰ καὶ
  choice: Mesmo que
  rationale: Transmite de modo idiomático o valor condicional-concessivo da expressão grega.
- source_word: πάντες
  choice: todos
  rationale: Conserva o alcance abrangente do grego, que no contexto se refere aos demais discípulos.
- source_word: σκανδαλισθήσονται
  choice: se afastem
  rationale: No contexto da deserção dos discípulos, comunica uma ruptura de lealdade sem afirmar necessariamente apostasia definitiva; a nota preserva a metáfora e a voz passiva possíveis no grego.
- source_word: ἀλλ’ οὐκ ἐγώ
  choice: eu não
  rationale: Mantém a elipse e a ênfase contrastiva sobre Pedro, com formulação breve e natural em português.
theological_decisions:
- issue: Sentido de σκανδαλισθήσονται no contexto do fracasso dos discípulos
  choice: se afastem
  alternative: tropecem; sejam levados a tropeçar; venham a cair
  rationale: A escolha comunica a deserção relacional prevista no contexto sem decidir que se trata de abandono espiritual definitivo. A nota registra a amplitude metafórica e a possível força passiva do verbo.
translation_notes:
  register: Português moderno, claro e digno, com construção natural tanto no Brasil quanto em outros contextos lusófonos. A resposta elíptica “eu não” preserva a ênfase concisa do original.
