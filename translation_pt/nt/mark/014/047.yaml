    issue: “Cortou-lhe a orelha” não explicita de modo inequívoco que a orelha foi separada.
    rationale: ἀφεῖλεν (“tirou/removeu”) com τὸ ὠτάριον, no contexto do golpe com espada, descreve a perda da orelha, não somente um ferimento cortante. “Decepou-lhe” preserva esse resultado sem acrescentar detalhes.
  - severity: low
    issue: “Puxou a espada” é compreensível, mas menos idiomático do que “sacou a espada”.
    rationale: Com uma arma, σπάομαι significa sacar/retirar da bainha. “Sacou” é natural no português moderno e mantém o sentido específico.
