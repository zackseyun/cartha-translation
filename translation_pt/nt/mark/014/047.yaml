  text: εἷς δέ ⸀τις τῶν παρεστηκότων σπασάμενος τὴν μάχαιραν ἔπαισεν τὸν δοῦλον τοῦ ἀρχιερέως καὶ ἀφεῖλεν αὐτοῦ τὸ ⸀ὠτάριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/047.yaml
  text: But one of those standing nearby drew his sword and struck the high priest’s slave[a], and cut off his ear.
translation:
  language: pt
  text: Mas um dos que estavam ali sacou a espada, golpeou o escravo[a] do sumo sacerdote e decepou-lhe a orelha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις
  choice: Mas um
  rationale: A expressão introduz de modo indefinido uma pessoa do grupo. “Mas” representa a leve transição ou contraposição de δέ sem identificar o agressor.
- source_word: τῶν παρεστηκότων
  choice: dos que estavam ali
  rationale: O particípio indica os presentes, em posição próxima à cena. A formulação é natural em português e conserva o sentido espacial.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: puxou a espada
  rationale: Com μάχαιρα, o verbo descreve sacar ou puxar uma arma. A sequência com verbo finito reproduz naturalmente em português a ação anterior ao golpe.
- source_word: ἔπαισεν
  choice: golpeou
  rationale: Expressa um golpe violento de modo claro, atual e digno.
- source_word: τὸν δοῦλον τοῦ ἀρχιερέως
  choice: o escravo do sumo sacerdote
  rationale: “Escravo” preserva a condição social e a relação de subordinação expressas por δοῦλος; “sumo sacerdote” é a designação portuguesa consagrada para ἀρχιερεύς.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτάριον
  choice: cortou-lhe a orelha
  rationale: No contexto do ataque com espada, “cortou” comunica idiomaticamente o resultado de ἀφαιρέω. O diminutivo ὠτάριον não exige “orelhinha”, que seria inadequado no registro e no contexto.
theological_decisions:
- issue: Tradução de δοῦλος em contexto de condição social
  choice: escravo
  alternative: servo
  rationale: A relação com o sumo sacerdote e a condição subordinada justificam preservar a realidade social mais forte do termo grego, sem suavizá-la; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e narrativo, com legibilidade brasileira e compreensão internacional. “Cortou-lhe” mantém concisão e dignidade; não se acrescenta “direita”, informação ausente do texto de Marcos.
