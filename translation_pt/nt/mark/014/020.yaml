  text: ὁ ⸀δὲ εἶπεν αὐτοῖς· ⸀Εἷς τῶν δώδεκα, ὁ ἐμβαπτόμενος μετ’ ἐμοῦ εἰς ⸀τὸ τρύβλιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/020.yaml
  text: And he said to them[a], “One of the twelve, the one dipping with me into the bowl.”
translation:
  language: pt
  text: 'Ele lhes disse: “Um dos doze, aquele que mergulha comigo na tigela[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no prato”. A palavra grega τρύβλιον pode indicar uma tigela ou um prato usado para comer.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: respondeu
  rationale: No contexto da pergunta dos discípulos, δέ introduz a resposta de Jesus. A formulação natural em português integra o conectivo ao verbo de elocução sem impor forte contraste.
- source_word: εἶπεν αὐτοῖς
  choice: lhes respondeu
  rationale: Embora λέγω signifique literalmente ‘dizer’, aqui a fala responde ao questionamento anterior; ‘lhes respondeu’ expressa naturalmente essa função contextual sem alterar o conteúdo.
- source_word: Εἷς τῶν δώδεκα
  choice: um dos doze
  rationale: Preserva a identificação do traidor como integrante do círculo dos doze, com minúscula em texto corrido.
- source_word: ὁ ἐμβαπτόμενος
  choice: aquele que põe o pão
  rationale: O particípio presente retrata a ação à mesa. Em português corrente, explicitar o objeto implícito como ‘o pão’ torna inteligível o costume de mergulhar alimento, embora o grego não nomeie o objeto.
- source_word: μετ’ ἐμοῦ
  choice: comigo
  rationale: μετά com genitivo indica acompanhamento; ‘comigo’ é a equivalência direta e natural.
- source_word: εἰς τὸ τρύβλιον
  choice: na tigela
  rationale: τρύβλιον designa um recipiente de mesa, como tigela ou prato. Com ‘põe o pão’, a preposição portuguesa ‘na’ exprime idiomaticamente o movimento para dentro indicado por εἰς.
