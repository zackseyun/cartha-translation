lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca o leve contraste e a reviravolta narrativa em relação à tentativa de prendê-lo.
- source_word: καταλιπὼν
  choice: largou
  rationale: Expressa de modo natural que ele deixou o tecido para trás a fim de escapar.
- source_word: σινδόνα
  choice: pano de linho
  rationale: Mantém a referência ao material sem especificar além do grego se era lençol, tecido ou veste.
- source_word: γυμνὸς
  choice: nu
  rationale: É o sentido mais direto no contexto, embora o termo possa indicar pouca ou insuficiente roupa em outros contextos.
- source_word: ἔφυγεν
  choice: fugiu
  rationale: Preserva de forma concisa a urgência do verbo narrativo.
