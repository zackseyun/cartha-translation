base_translation:
  language: en
  yaml_path: translation/nt/mark/014/058.yaml
  text: that[a], ‘We heard him saying, “I will destroy this temple made with hands[b], and in three days I will build another not made with hands.”’
translation:
  language: pt
  text: 'que[a] “Nós o ouvimos dizer: ‘Destruirei este templo feito por mãos humanas[b] e, em três dias, construirei outro, não feito por mãos humanas’”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase continua o relato do testemunho iniciado no versículo anterior; “que” introduz o conteúdo da acusação.
    reason: contextual_clarity
  - marker: b
    text: “Feito por mãos humanas” e “não feito por mãos humanas” preservam o contraste entre χειροποίητον e ἀχειροποίητον no texto grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo do testemunho/acusação, com valor declarativo, não causal.
- source_word: Ἡμεῖς
  choice: Nós
  rationale: Mantém o pronome explícito e sua ênfase na afirmação das testemunhas.
- source_word: ἠκούσαμεν αὐτοῦ λέγοντος
  choice: o ouvimos dizer
  rationale: Expressão natural em português que representa adequadamente a construção com particípio.
- source_word: καταλύσω
  choice: destruirei
  rationale: No contexto de um edifício, comunica claramente a ideia de destruir ou desmantelar.
- source_word: ναὸν τοῦτον
  choice: este templo
  rationale: Preserva o substantivo reconhecível e a força dêitica do demonstrativo.
- source_word: χειροποίητον
  choice: feito por mãos humanas
  rationale: Torna explícito o agente humano implícito na expressão e preserva o contraste com ἀχειροποίητον.
- source_word: διὰ τριῶν ἡμερῶν
  choice: no decorrer de três dias
  rationale: Preserva o sentido temporal de uma ação situada dentro do período abrangido pelos três dias, sem impor a leitura de somente depois de três dias.
- source_word: ἄλλον
  choice: outro
  rationale: Mantém a referência a um segundo templo em contraste com o primeiro.
- source_word: ἀχειροποίητον
  choice: não feito por mãos humanas
  rationale: Preserva em paralelo direto a oposição lexical com χειροποίητον.
- source_word: οἰκοδομήσω
  choice: construirei
  rationale: Traduz o sentido básico de construir, sem acrescentar a ideia não expressa de reconstrução.
theological_decisions:
- issue: Caráter hostil e alegado do testemunho
  choice: Manter a declaração como fala citada das testemunhas, sem comentário interpretativo
  alternative: Acrescentar linguagem que indique explicitamente uma distorção das palavras de Jesus
  rationale: O versículo relata o que as testemunhas afirmaram ter ouvido; a estrutura de citação preserva essa mediação sem harmonização externa.
- issue: Possível ressonância teológica do contraste entre os dois templos
  choice: Preservar o contraste verbal “feito por mãos humanas” / “não feito por mãos humanas”
  alternative: Interpretar como “humano” / “divino”
  rationale: O grego mantém a natureza do segundo templo em tensão e não identifica explicitamente o referente; uma formulação interpretativa resolveria indevidamente essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “No decorrer de três dias” soa natural e conserva a extensão temporal de διὰ τριῶν ἡμερῶν. A repetição de “mãos humanas” é deliberada para manter o paralelismo retórico do original.
