  text: καὶ ⸂προελθὼν μικρὸν ἔπιπτεν⸃ ἐπὶ τῆς γῆς, καὶ προσηύχετο ἵνα εἰ δυνατόν ἐστιν παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/035.yaml
  text: And going a little farther[a], he fell to the ground and was praying that, if it were possible, the hour might pass from him.
translation:
  language: pt
  text: E, indo um pouco mais adiante[a], caiu por terra e orava para que, se fosse possível, a hora passasse dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo avançado um pouco”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: indo um pouco mais adiante
  rationale: Expressa naturalmente o avanço por uma curta distância além dos discípulos, preservando o valor espacial de προέρχομαι e a medida μικρόν.
- source_word: ἔπιπτεν ἐπὶ τῆς γῆς
  choice: caiu por terra
  rationale: O imperfeito pode descrever ou apresentar o ingresso na ação; no fluxo narrativo, o pretérito perfeito é natural em português. “Por terra” comunica o movimento até o chão com dignidade e clareza.
- source_word: προσηύχετο
  choice: orava
  rationale: O pretérito imperfeito preserva o aspecto durativo da oração em andamento.
- source_word: ἵνα
  choice: para que
  rationale: Introduz aqui o conteúdo desejado da oração e conserva também sua nuance volitiva ou final sem tornar a frase artificial.
- source_word: εἰ δυνατόν ἐστιν
  choice: se fosse possível
  rationale: Embora ἐστιν esteja no presente, o imperfeito do subjuntivo é a formulação portuguesa idiomática para uma condição apresentada com reserva dentro desta oração solene.
- source_word: παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα
  choice: aquela hora se afastasse dele
  rationale: “Aquela hora” conserva a expressão metafórica e teologicamente carregada ἡ ὥρα. “Se afastasse dele” transmite o pedido de que ela passe sem impor uma explicação do sofrimento.
theological_decisions:
- issue: Sentido de ἡ ὥρα (“a hora”)
  choice: aquela hora
  alternative: o momento de sofrimento
  rationale: Mantém a imagem temporal do texto para o tempo determinado do sofrimento e da morte iminentes de Jesus, sem substituí-la por uma paráfrase explicativa. O demonstrativo português torna natural a referência definida no contexto, sem alterar seu conteúdo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e os aspectos verbais foram ajustados à narrativa natural em português, preservando a solenidade, a ambiguidade e a tensão teológica do grego.
