  text: ὁ δὲ πάλιν ἠρνεῖτο. καὶ μετὰ μικρὸν πάλιν οἱ παρεστῶτες ἔλεγον τῷ Πέτρῳ· Ἀληθῶς ἐξ αὐτῶν εἶ, καὶ γὰρ Γαλιλαῖος εἶ ⸂καὶ ἡ λαλιά σου ὁμοιάζει⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/070.yaml
  text: But he again denied it[a]. And after a little while, those standing nearby again were saying to Peter, “Surely you are one of them, for you are also a Galilean[b], and your speech is similar.”
translation:
  language: pt
  text: 'Mas ele tornou a negar. Pouco depois, os que estavam ali voltaram a dizer a Pedro: “Com certeza você é um deles, pois também é galileu, e o seu jeito de falar[a] é parecido com o deles”[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o seu sotaque” ou “a sua fala”. O termo grego pode se referir à maneira de falar, ao dialeto ou ao sotaque.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos omitem “e o seu jeito de falar é parecido com o deles”.
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνεῖτο
  choice: tornou a negar
  rationale: O imperfeito indica uma negação continuada ou repetida no contexto. “Tornou a negar” comunica com naturalidade que Pedro negou novamente, sem exigir um objeto expresso em português.
- source_word: μετὰ μικρὸν
  choice: Pouco depois
  rationale: Expressa de modo corrente e fiel o breve intervalo indicado pela locução grega.
- source_word: οἱ παρεστῶτες
  choice: os que estavam ali
  rationale: Preserva a ideia das pessoas presentes ou próximas, em linguagem natural e clara.
- source_word: πάλιν ... ἔλεγον
  choice: voltaram a dizer
  rationale: Reúne o valor de πάλιν e o aspecto imperfeito de ἔλεγον, indicando que os presentes retomaram a afirmação.
- source_word: Ἀληθῶς
  choice: Com certeza
  rationale: Transmite a convicção enfática da afirmação em fala direta moderna.
- source_word: ἐξ αὐτῶν εἶ
  choice: você é um deles
  rationale: É a forma idiomática mais clara de indicar que Pedro pertencia ao grupo associado a Jesus.
- source_word: καὶ γὰρ Γαλιλαῖος εἶ
  choice: pois também é galileu
  rationale: “Pois” conserva a função explicativa de γάρ, e “também” representa καί.
- source_word: ἡ λαλιά σου
  choice: o seu jeito de falar
  rationale: A expressão portuguesa abrange maneira de falar, padrão de fala e sotaque sem restringir indevidamente o sentido.
- source_word: ὁμοιάζει
  choice: é parecido com o deles
  rationale: O verbo significa ser semelhante. O complemento “com o deles”, implícito no contexto, torna a frase natural em português e explicita que a fala de Pedro se parecia com a dos galileus mencionados.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” foi usado por ser natural na fala direta contemporânea; “galileu” permanece como identificação regional. A tradução conserva a repetição da negação e da acusação sem tornar a sintaxe pesada.
