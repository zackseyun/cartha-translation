id: MRK.14.7
reference: Mark 14:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, καὶ ὅταν θέλητε δύνασθε ⸀αὐτοῖς εὖ ποιῆσαι, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/007.yaml
  text: For you always have the poor with you[a], and whenever you want, you are able to do good to them; but you do not always have me.
translation:
  language: pt
  text: Pois vocês sempre têm os pobres com vocês e, quando quiserem, podem fazer o bem a eles; mas nem sempre têm a mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: sempre
  rationale: Preserva o sentido temporal de disponibilidade contínua e sustenta o contraste repetido no versículo.
- source_word: γὰρ
  choice: pois
  rationale: Introduz a explicação da declaração anterior de modo natural e sem explicitar além do texto a relação lógica.
- source_word: τοὺς πτωχοὺς
  choice: os pobres
  rationale: Traduz diretamente o adjetivo substantivado, referindo-se às pessoas pobres como grupo.
- source_word: ἔχετε μεθ’ ἑαυτῶν
  choice: têm ... com vocês
  rationale: Expressa presença e disponibilidade contínuas, mantendo a formulação concreta do grego.
- source_word: ὅταν θέλητε
  choice: quando quiserem
  rationale: Reproduz a condição temporal indefinida de ὅταν com o subjuntivo em português corrente.
- source_word: δύνασθε
  choice: podem
  rationale: Comunica capacidade ou possibilidade de maneira natural e direta.
- source_word: αὐτοῖς εὖ ποιῆσαι
  choice: fazer o bem a eles
  rationale: Preserva o idioma grego de agir em benefício de alguém sem restringi-lo apenas à esmola ou a uma modalidade específica de ajuda.
- source_word: ἐμὲ δὲ οὐ πάντοτε ἔχετε
  choice: mas nem sempre têm a mim
  rationale: Mantém o contraste enfático com ἐμέ e o presente do original, sem convertê-lo interpretativamente em futuro.
theological_decisions:
- issue: Possível interpretação de que Jesus desvaloriza o cuidado com os pobres
  choice: Manter o contraste entre a presença contínua dos pobres e a presença corporal limitada de Jesus, ao mesmo tempo preservando a possibilidade contínua de lhes fazer o bem.
  alternative: Entender que Jesus descarta a preocupação com os pobres em favor da devoção a ele.
  rationale: A oração «quando quiserem, podem fazer o bem a eles» afirma expressamente a oportunidade de beneficiá-los. O contraste é temporal e situacional; o texto não nega o dever de misericórdia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação «têm a mim» preserva a ênfase do pronome grego; embora ligeiramente marcada, é clara e evita apagar o contraste. Não se acrescentou nota, pois «fazer o bem a eles» já comunica adequadamente o idioma grego.
