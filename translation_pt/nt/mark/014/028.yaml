  text: ἀλλὰ μετὰ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/028.yaml
  text: But after I am raised[a], I will go ahead of you into Galilee.
translation:
  language: pt
  text: Mas, depois de eu ser ressuscitado[a], irei adiante de vocês para a Galileia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois que eu tiver sido ressuscitado”. O grego emprega o infinitivo passivo do verbo “ressuscitar”, expressão comum para a ressurreição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca de modo natural o contraste com o anúncio anterior de que os discípulos se dispersariam.
- source_word: μετὰ τὸ ἐγερθῆναί με
  choice: depois de eu ser ressuscitado
  rationale: A construção temporal com μετά e infinitivo articulado significa “depois de”; a formulação preserva a voz passiva de ἐγείρω e seu sentido de ressurreição.
- source_word: προάξω
  choice: irei adiante de
  rationale: Expressa que Jesus irá antes dos discípulos rumo ao destino mencionado, em linguagem portuguesa atual e clara.
- source_word: ὑμᾶς
  choice: vocês
  rationale: Representa explicitamente a segunda pessoa do plural para leitores de português moderno, com ampla legibilidade brasileira.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: para a Galileia
  rationale: Comunica naturalmente o movimento em direção à região; “para” é mais idiomático em português neste contexto do que uma reprodução rígida de εἰς.
theological_decisions:
- issue: Voz passiva na referência à ressurreição
  choice: depois de eu ser ressuscitado
  alternative: depois que eu ressuscitar
  rationale: A tradução mantém a forma passiva do grego, sem convertê-la silenciosamente numa construção intransitiva, preservando assim a formulação e a tensão próprias do texto.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “vocês” para tornar inequívoco o plural. A ordem da frase e o futuro “irei” preservam a sequência temporal e o movimento indicados no grego.
