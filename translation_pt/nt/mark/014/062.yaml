source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἐγώ εἰμι, καὶ ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν καθήμενον τῆς δυνάμεως καὶ ἐρχόμενον μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/062.yaml
  text: And Jesus said[a], “I am[c][b], and you will see the Son of Man seated at the right hand of Power and coming with the clouds of heaven.”
translation:
  language: pt
  text: 'Mas Jesus disse: “Eu sou[a], e vocês verão o Filho do Homem sentado à direita do Poder[b] e vindo com as nuvens do céu.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sou eu” ou “Eu sou ele”. O grego diz simplesmente: “Eu sou”.'
    reason: alternative_reading
  - marker: b
    text: “O Poder” é uma forma reverencial de se referir a Deus.
    reason: cultural_note
  - marker: c
    text: A declaração faz alusão ao Salmo 110:1 e a Daniel 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Eu sou
  rationale: Reproduz a afirmação enfática e sem predicativo do grego. No contexto, responde diretamente à pergunta do sumo sacerdote, sem acrescentar “ele” nem excluir possíveis ressonâncias mais profundas.
- source_word: ὄψεσθε
  choice: vocês verão
  rationale: Equivalente direto e natural do futuro de ὁράω, preservando o caráter de declaração dirigida aos ouvintes.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a autodesignação estabelecida de Jesus e sua ligação verbal e temática com Daniel 7.
- source_word: ἐκ δεξιῶν
  choice: à direita de
  rationale: Expressão portuguesa natural para a posição de honra e autoridade indicada pelo idioma grego.
- source_word: τῆς δυνάμεως
  choice: do Poder
  rationale: Preserva a circunlocução reverencial empregada no grego para se referir a Deus, sem substituí-la explicitamente por “Deus”.
- source_word: καθήμενον
  choice: sentado
  rationale: Forma clara e digna que descreve a posição entronizada do Filho do Homem.
- source_word: ἐρχόμενον
  choice: vindo
  rationale: Mantém o sentido verbal e a ressonância escatológica da linguagem de Daniel 7.
- source_word: μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: com as nuvens do céu
  rationale: Segue de perto o grego e conserva o registro apocalíptico e a alusão a Daniel 7:13.
- source_word: καὶ ... καὶ
  choice: e ... e
  rationale: 'Conserva a força cumulativa das duas imagens ligadas: estar sentado à direita do Poder e vir com as nuvens.'
theological_decisions:
- issue: Se Ἐγώ εἰμι deve ser traduzido como afirmação simples ou identificação expandida
  choice: Eu sou
  alternative: Sou eu / Eu sou ele
  rationale: O grego não contém predicativo explícito. “Eu sou” preserva tanto a resposta afirmativa imediata quanto possíveis ressonâncias teológicas, sem decidir além do que o texto diz.
- issue: Como representar τῆς δυνάμεως
  choice: o Poder
  alternative: Deus / o Todo-Poderoso
  rationale: A fonte usa uma circunlocução reverencial. Mantê-la conserva a formulação e o tom do texto, enquanto uma nota esclarece a referência.
- issue: Relação da declaração com as Escrituras de Israel
  choice: Indicar em nota as alusões ao Salmo 110:1 e a Daniel 7:13
  alternative: Deixar as alusões sem indicação
  rationale: A nota torna acessível o pano de fundo intertextual sem inserir a interpretação no corpo do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa. A ordem e as conjunções preservam o movimento cumulativo do grego. As notas aparecem junto às expressões pertinentes; a nota intertextual é colocada ao fim da declaração.
