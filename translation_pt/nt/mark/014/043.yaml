  text: Καὶ ⸀εὐθὺς ἔτι αὐτοῦ λαλοῦντος παραγίνεται ⸀Ἰούδας ⸀εἷς τῶν δώδεκα καὶ μετ’ αὐτοῦ ⸀ὄχλος μετὰ μαχαιρῶν καὶ ξύλων παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/043.yaml
  text: And immediately[a], while he was still speaking, Judas arrived, one of the Twelve, and with him a crowd with swords and clubs[d][c][b], from the chief priests and the scribes and the elders.
translation:
  language: pt
  text: E imediatamente, enquanto ele ainda falava, chegou[a] Judas, um dos Doze, e, com ele, uma multidão[b] com espadas e porretes[c], da parte[d] dos principais sacerdotes, dos escribas e dos anciãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego usa aqui o presente histórico, literalmente “chega”, dando vivacidade à narrativa.
    reason: alternative_reading
  - marker: b
    text: Também poderia ser traduzido por “turba”; a palavra grega significa propriamente “multidão”, embora o contexto seja hostil.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “madeiras”; neste contexto, refere-se a objetos de madeira usados como armas, isto é, porretes.
    reason: lexical_alternative
  - marker: d
    text: Ou “enviada pelos”. O grego diz mais literalmente “da parte dos”, indicando origem ou autorização sem explicitar como o grupo foi mobilizado.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Preserva a ideia de súbita urgência característica da narrativa de Marcos, em linguagem portuguesa corrente.
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: enquanto ele ainda falava
  rationale: Reproduz de modo natural a ação simultânea expressa pelo genitivo absoluto e traduz explicitamente ἔτι por “ainda”.
- source_word: παραγίνεται
  choice: chegou
  rationale: O presente histórico grego é vertido pelo pretérito, mais natural na narrativa portuguesa; “chegou” comunica a entrada de Judas em cena.
- source_word: εἷς τῶν δώδεκα
  choice: um dos Doze
  rationale: Mantém a designação breve e reconhecível do grupo, sem acrescentar “discípulos”, ausente no texto.
- source_word: ὄχλος
  choice: uma multidão
  rationale: É o equivalente lexical direto; o caráter hostil fica evidente pelas armas e pelo contexto, sem ser antecipado pela palavra “turba”.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: com espadas e porretes
  rationale: “Espadas” representa adequadamente μάχαιραι, enquanto “porretes” expressa o sentido contextual de ξύλα como objetos de madeira usados como armas.
- source_word: παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων
  choice: da parte dos chefes dos sacerdotes, dos escribas e dos anciãos
  rationale: “Da parte de” conserva a noção de origem ou autorização indicada por παρά com genitivo, sem afirmar expressamente que a multidão foi enviada.
- source_word: ἀρχιερέων
  choice: chefes dos sacerdotes
  rationale: Designa a liderança sacerdotal, não vários sumos sacerdotes simultaneamente.
- source_word: γραμματέων
  choice: escribas
  rationale: Equivalente direto e tradicional, sem ampliar interpretativamente para “mestres da Lei”.
- source_word: πρεσβυτέρων
  choice: anciãos
  rationale: Preserva a designação institucional dos líderes judeus reconhecidos.
theological_decisions:
- issue: Presente histórico em παραγίνεται
  choice: 'Uso do pretérito: “chegou”'
  alternative: 'Manter o presente narrativo: “chega”'
  rationale: O presente grego dá vivacidade à cena, mas o pretérito é mais idiomático na narrativa portuguesa. A nota preserva a informação sobre a forma do original.
- issue: Força de παρά com as autoridades
  choice: “da parte dos”
  alternative: “enviada pelos”
  rationale: O original indica procedência ou autorização institucional, mas não explicita o ato de enviar; a formulação escolhida preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem narrativa e a repetição dos grupos de liderança foram preservadas, enquanto a pontuação torna inteligível a chegada simultânea de Judas e da multidão.
