  text: καὶ ἡ παιδίσκη ἰδοῦσα αὐτὸν ⸂ἤρξατο πάλιν⸃ λέγειν τοῖς ⸀παρεστῶσιν ὅτι Οὗτος ἐξ αὐτῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/069.yaml
  text: And the servant girl[a], seeing him, began again to say to those standing nearby, “This man is one of them.”
translation:
  language: pt
  text: 'E a criada, ao vê-lo, começou novamente a dizer aos que estavam por perto[a]: “Este homem é um deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos presentes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίσκη
  choice: criada
  rationale: Designa uma jovem servidora ou escrava doméstica. “Criada” é clara no contexto e não torna explícita uma condição jurídica que o termo, isoladamente, não permite definir com certeza.
- source_word: ἰδοῦσα
  choice: ao vê-lo
  rationale: 'Expressa com naturalidade a circunstância temporal e causal do particípio aoristo: ela começa a falar ao notar Pedro.'
- source_word: ἤρξατο πάλιν λέγειν
  choice: começou novamente a dizer
  rationale: Preserva tanto o aspecto ingressivo de ἤρξατο quanto a repetição indicada por πάλιν.
- source_word: τοῖς παρεστῶσιν
  choice: aos que estavam por perto
  rationale: Comunica de modo natural que ela se dirigiu às pessoas presentes nas proximidades, preservando o sentido espacial do particípio.
- source_word: Οὗτος
  choice: Este homem
  rationale: O demonstrativo aponta diretamente para Pedro; acrescentar “homem” é idiomático em português e não introduz tom depreciativo.
- source_word: ἐξ αὐτῶν
  choice: é um deles
  rationale: É a forma portuguesa mais direta e natural de expressar pertencimento ao grupo associado a Jesus.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. Mantém a repetição de “novamente” e evita especificar como certa a condição de escrava da παιδίσκη.
