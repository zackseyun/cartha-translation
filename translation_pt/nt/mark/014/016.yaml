id: MRK.14.16
reference: Mark 14:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ⸀μαθηταὶ καὶ ἦλθον εἰς τὴν πόλιν καὶ εὗρον καθὼς εἶπεν αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/016.yaml
  text: And the disciples went out and came into the city[a], and found it just as he had told them, and they prepared the Passover.
translation:
  language: pt
  text: Os discípulos saíram, foram para a cidade e encontraram tudo exatamente como ele lhes havia dito. Então prepararam a Páscoa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a refeição da Páscoa”. O grego τὸ πάσχα pode se referir à Páscoa em geral ou, neste contexto, à refeição que estava sendo preparada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: saíram
  rationale: O aoristo de ἐξέρχομαι indica que partiram do lugar onde estavam; “saíram” é direto e natural em português.
- source_word: μαθηταὶ
  choice: os discípulos
  rationale: É o termo consagrado e adequado para os seguidores e aprendizes de Jesus.
- source_word: ἦλθον εἰς τὴν πόλιν
  choice: foram para a cidade
  rationale: Embora o grego use literalmente “vieram para dentro da cidade”, o português narrativo adota naturalmente o ponto de vista dos discípulos com “foram para a cidade”; a ideia de deslocamento até a cidade é preservada.
- source_word: εὗρον
  choice: encontraram tudo
  rationale: O objeto está implícito no grego. “Tudo” explicita de modo idiomático que as circunstâncias estavam conforme Jesus havia indicado, sem identificar um objeto específico ausente do texto.
- source_word: καθὼς εἶπεν αὐτοῖς
  choice: exatamente como ele lhes havia dito
  rationale: καθώς exprime correspondência, e o mais-que-perfeito composto comunica naturalmente que a fala de Jesus precedeu a chegada dos discípulos.
- source_word: ἡτοίμασαν
  choice: prepararam
  rationale: Reproduz com clareza e concisão o sentido de ἑτοιμάζω, “preparar, deixar pronto”.
- source_word: τὸ πάσχα
  choice: a Páscoa
  rationale: Mantém a amplitude lexical de πάσχα, que pode designar a celebração pascal ou, neste contexto, a refeição da Páscoa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição das conjunções gregas foi ajustada em duas frases para produzir narrativa natural sem alterar a sequência dos acontecimentos. O marcador da nota foi colocado após “Páscoa”, termo ao qual a alternativa lexical se refere.
