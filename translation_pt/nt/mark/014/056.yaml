  text: πολλοὶ γὰρ ἐψευδομαρτύρουν κατ’ αὐτοῦ, καὶ ἴσαι αἱ μαρτυρίαι οὐκ ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/056.yaml
  text: For many were giving false testimony against him[a], and their testimonies were not consistent.
translation:
  language: pt
  text: Pois muitos davam falso testemunho contra ele[a], e os testemunhos não concordavam entre si.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “prestavam falso testemunho contra ele, e os testemunhos não estavam de acordo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: muitos
  rationale: O adjetivo substantivado se refere a numerosas pessoas. “Muitos” é conciso e não acrescenta “testemunhas”, substantivo que não está explícito.
- source_word: γὰρ
  choice: pois
  rationale: A conjunção introduz a explicação do que ocorre na cena e é preservada por um conectivo natural em português.
- source_word: ἐψευδομαρτύρουν
  choice: davam falso testemunho
  rationale: O imperfeito descreve ação continuada ou repetida; a expressão mantém o sentido forense do verbo e é clara em português atual.
- source_word: κατ’ αὐτοῦ
  choice: contra ele
  rationale: Neste contexto judicial, κατά com genitivo indica testemunho dirigido de modo hostil contra Jesus.
- source_word: ἴσαι
  choice: concordavam entre si
  rationale: Embora o adjetivo signifique literalmente “iguais”, aplicado aos testemunhos indica que eles não coincidiam ou não estavam de acordo.
- source_word: αἱ μαρτυρίαι οὐκ ἦσαν
  choice: os testemunhos não concordavam
  rationale: A formulação idiomática comunica que os depoimentos não eram correspondentes, preservando o sentido simples da negação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com registro jurídico acessível. “Mas” traduz idiomaticamente o valor adversativo de καί no contexto; a nota preserva uma formulação mais formal e próxima da estrutura grega.
