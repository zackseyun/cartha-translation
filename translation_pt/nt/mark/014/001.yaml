  text: Ἦν δὲ τὸ πάσχα καὶ τὰ ἄζυμα μετὰ δύο ἡμέρας. καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς πῶς αὐτὸν ἐν δόλῳ κρατήσαντες ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/001.yaml
  text: The Passover and Unleavened Bread were two days away[a]. And the chief priests and the scribes were seeking how, by deceit, they might arrest him and kill him[c][b],
translation:
  language: pt
  text: Faltavam dois dias para a Páscoa e a Festa dos Pães sem Fermento[a]. Os chefes dos sacerdotes e os escribas procuravam um modo de prendê-lo por meio de engano[b] e matá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “depois de dois dias”. A expressão indica que a Páscoa e a Festa dos Pães sem Fermento estavam próximas.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser traduzida como “capturá-lo por meio de um ardil” ou “prendê-lo à traição”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: Faltavam
  rationale: A construção temporal é expressa de modo idiomático em português; o valor levemente transitivo de δέ fica a cargo da progressão narrativa, sem acrescentar um marcador temporal inexistente.
- source_word: τὸ πάσχα
  choice: a Páscoa
  rationale: Designação corrente da celebração judaica; neste contexto, refere-se à festa, não especificamente ao cordeiro pascal.
- source_word: τὰ ἄζυμα
  choice: a Festa dos Pães sem Fermento
  rationale: Literalmente, “os [pães] sem fermento”; no contexto festivo, a expressão designa a Festa dos Pães sem Fermento. A explicitação torna o referente claro.
- source_word: μετὰ δύο ἡμέρας
  choice: Faltavam dois dias para
  rationale: Equivalente temporal natural em português para indicar que as festas estavam próximas; a nota conserva a forma mais literal.
- source_word: ἐζήτουν
  choice: procuravam
  rationale: O imperfeito indica uma busca ou tentativa em andamento.
- source_word: οἱ ἀρχιερεῖς
  choice: os chefes dos sacerdotes
  rationale: Expressa o grupo das principais autoridades sacerdotais, e não vários sumos sacerdotes em exercício.
- source_word: οἱ γραμματεῖς
  choice: os escribas
  rationale: Equivalente direto e tradicional, ainda compreensível em português moderno.
- source_word: πῶς
  choice: um modo de
  rationale: Formulação idiomática que conserva a ideia de procurarem como realizar a ação.
- source_word: ἐν δόλῳ
  choice: por meio de engano
  rationale: Preserva o sentido moral de fraude, ardil ou dolo, sem reduzi-lo apenas a segredo ou discrição.
- source_word: κρατήσαντες
  choice: prendê-lo
  rationale: No contexto da conspiração das autoridades, o particípio indica capturar ou deter Jesus; “prender” comunica naturalmente essa tomada sob custódia.
- source_word: ἀποκτείνωσιν
  choice: matá-lo
  rationale: Tradução direta e natural do verbo, sem acrescentar uma nuance jurídica além do necessário.
theological_decisions:
- issue: Relação entre a Páscoa e os Pães sem Fermento
  choice: 'Manter as duas celebrações distintas: “a Páscoa e a Festa dos Pães sem Fermento”'
  alternative: Tratá-las como um único título festivo
  rationale: Marcos nomeia ambas explicitamente. A tradução mantém a distinção, sem negar sua estreita associação no calendário judaico.
- issue: Caracterização moral do plano dos líderes
  choice: Traduzir ἐν δόλῳ como “por meio de engano”
  alternative: “às escondidas” ou “em segredo”
  rationale: O grego comunica fraude ou ardil, não apenas sigilo. A tradução preserva essa carga ética sem comentário adicional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Pães sem Fermento” evita o termo menos corrente “ázimos”; “chefes dos sacerdotes” distingue as autoridades sacerdotais do sumo sacerdote individual. A ordem da frase foi ajustada para fluência natural sem eliminar a proximidade temporal nem o caráter enganoso do plano.
