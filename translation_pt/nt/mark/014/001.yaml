  terminology: A terminologia é consistente e fiel. “Páscoa” e “Festa dos Pães sem Fermento” distinguem as expressões gregas sem negar sua associação histórica. “Chefes dos sacerdotes” comunica bem o plural ἀρχιερεῖς; “escribas” é o correspondente estabelecido de γραμματεῖς. “Engano” representa adequadamente δόλος, sem reduzi-lo a mera ação secreta.
