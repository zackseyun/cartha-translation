  text: ὁ δὲ ἤρξατο ἀναθεματίζειν καὶ ὀμνύναι ὅτι Οὐκ οἶδα τὸν ἄνθρωπον τοῦτον ὃν λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/071.yaml
  text: But he began to call down curses and to swear[a], “I do not know this man you are talking about.”
translation:
  language: pt
  text: 'Mas ele começou a invocar maldições e a jurar[a]: “Não conheço esse homem de quem vocês estão falando.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a amaldiçoar”; possivelmente, “a invocar uma maldição sobre si mesmo”. O grego não declara explicitamente sobre quem recai a maldição.
    reason: alternativa lexical e preservação da ambiguidade do original
lexical_decisions:
- source_word: ἤρξατο
  choice: começou
  rationale: Expressa naturalmente o valor ingressivo de ἄρχομαι com infinitivos complementares.
- source_word: ἀναθεματίζειν
  choice: invocar maldições
  rationale: Comunica a ideia de apelar para uma maldição, e não apenas usar linguagem profana, sem especificar um objeto que o grego deixa implícito.
- source_word: ὀμνύναι
  choice: jurar
  rationale: É conciso, natural e preserva o sentido formal de prestar juramento.
- source_word: ὅτι
  choice: introdução de discurso direto
  rationale: Aqui introduz o conteúdo do juramento e da negação; em português, o discurso direto é a formulação mais natural.
- source_word: Οὐκ οἶδα
  choice: Não conheço
  rationale: Mantém o sentido direto e contundente da negação, sem ampliar para uma explicação de vínculo ou reconhecimento.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: esse homem
  rationale: Preserva a força demonstrativa de τοῦτον; em português corrente, “esse” se ajusta naturalmente ao homem mencionado pelos interlocutores.
- source_word: ὃν λέγετε
  choice: de quem vocês estão falando
  rationale: Formulação moderna e clara para a referência à pessoa mencionada pelos presentes.
- source_word: ὁ δὲ
  choice: Mas ele
  rationale: δέ indica progressão narrativa com leve contraste e intensificação em relação à acusação anterior.
theological_decisions:
- issue: Natureza da imprecação de Pedro em ἀναθεματίζειν
  choice: Descrever a ação como invocação de maldições sem identificar seu objeto.
  alternative: “começou a amaldiçoar” ou “começou a invocar uma maldição sobre si mesmo”
  rationale: Em contexto de juramento, o verbo pode sugerir uma imprecação contra si mesmo, mas o texto grego não explicita sobre quem recai a maldição. A tradução principal preserva essa indeterminação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” traduz o plural λέγετε sem regionalismo excessivo; “invocar maldições” evita confundir imprecação com mero palavrão.
