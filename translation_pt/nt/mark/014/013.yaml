  text: καὶ ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν πόλιν, καὶ ἀπαντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/013.yaml
  text: And he sends two of his disciples and says to them[a], “Go into the city, and a man carrying a jar of water will meet you. Follow him,”
translation:
  language: pt
  text: 'Então ele envia dois dos seus discípulos e lhes diz: “Vão à cidade, e um homem carregando um jarro de água encontrará vocês. Sigam-no.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστέλλει
  choice: envia
  rationale: Preserva o presente histórico de Marcos, mantendo a vivacidade narrativa do grego.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: dois dos seus discípulos
  rationale: Reproduz naturalmente a construção partitiva e emprega o termo corrente e preciso para μαθηταί.
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico, em paralelo com ἀποστέλλει.
- source_word: Ὑπάγετε
  choice: Vão
  rationale: Imperativo direto, natural no português moderno e adequado ao discurso dirigido a duas pessoas.
- source_word: εἰς τὴν πόλιν
  choice: à cidade
  rationale: Expressa de modo idiomático o movimento em direção à cidade; o contexto implica a entrada nela.
- source_word: ἀπαντήσει ὑμῖν
  choice: encontrará vocês
  rationale: Traduz claramente o futuro e o encontro previsto, com ampla legibilidade brasileira.
- source_word: ἄνθρωπος
  choice: um homem
  rationale: Neste contexto, o substantivo designa um indivíduo masculino específico.
- source_word: κεράμιον ὕδατος
  choice: um jarro de água
  rationale: É uma formulação clara e natural; κεράμιον pode indicar um recipiente de barro, mas o material não precisa ser explicitado aqui.
- source_word: βαστάζων
  choice: carregando
  rationale: Representa naturalmente o particípio presente que descreve a ação do homem.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: Sigam-no
  rationale: Transmite de modo direto e conciso o imperativo aoristo plural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e claro, com legibilidade brasileira e compreensão internacional. Os presentes históricos foram preservados. O tratamento plural usa “vocês”, corrente no Brasil; a forma verbal plural também é amplamente compreensível. Não se acrescentou nota sobre κεράμιον porque “jarro” já pode designar o recipiente sem excluir sua provável composição de barro.
