id: MRK.14.3
reference: Mark 14:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὄντος αὐτοῦ ἐν Βηθανίᾳ ἐν τῇ οἰκίᾳ Σίμωνος τοῦ λεπροῦ κατακειμένου αὐτοῦ ἦλθεν γυνὴ ἔχουσα ἀλάβαστρον μύρου νάρδου πιστικῆς πολυτελοῦς· ⸀συντρίψασα ⸀τὴν ἀλάβαστρον κατέχεεν ⸀αὐτοῦ τῆς κεφαλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/003.yaml
  text: And while he was in Bethany[a], reclining at the house of Simon the leper, a woman came with an alabaster jar of very expensive pure nard perfume; she broke the jar and poured it on his head.
translation:
  language: pt
  text: Enquanto Jesus estava em Betânia, reclinado à mesa na casa de Simão, o leproso, chegou uma mulher com um frasco de alabastro cheio de perfume de nardo puro[a], muito caro. Ela quebrou o frasco e derramou o perfume sobre a cabeça dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nardo genuíno». O sentido do adjetivo grego traduzido como «puro» é debatido.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος αὐτοῦ ... κατακειμένου αὐτοῦ
  choice: Enquanto Jesus estava ... reclinado à mesa
  rationale: O genitivo absoluto estabelece a cena e apresenta uma ação em andamento. O nome «Jesus» torna a referência natural em português, e «à mesa» explicita de modo idiomático a postura de quem participava de uma refeição, indicada por κατακεῖμαι neste contexto.
- source_word: Βηθανίᾳ
  choice: Betânia
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: οἰκίᾳ Σίμωνος τοῦ λεπροῦ
  choice: na casa de Simão, o leproso
  rationale: Preserva a designação dada pelo texto grego sem acrescentar que ele teria sido curado anteriormente.
- source_word: γυνὴ
  choice: uma mulher
  rationale: A mulher é introduzida sem identificação adicional neste ponto do relato de Marcos.
- source_word: ἀλάβαστρον
  choice: frasco de alabastro
  rationale: O substantivo designa um recipiente para perfume. «Frasco» é claro e natural em português, enquanto «de alabastro» conserva a caracterização tradicional do recipiente.
- source_word: μύρου
  choice: perfume
  rationale: μύρον designa uma substância aromática, em forma de óleo ou unguento. «Perfume» comunica sua função com clareza sem definir indevidamente sua consistência.
- source_word: νάρδου
  choice: nardo
  rationale: Mantém a identificação da substância aromática específica em vez de generalizá-la.
- source_word: πιστικῆς
  choice: puro
  rationale: «Puro» expressa uma interpretação comum de um adjetivo raro e debatido, possivelmente referente à autenticidade do nardo. A incerteza lexical é registrada em nota.
- source_word: πολυτελοῦς
  choice: muito caro
  rationale: Comunica de maneira direta o alto valor econômico do perfume, relevante para a reação narrada nos versículos seguintes.
- source_word: συντρίψασα τὴν ἀλάβαστρον
  choice: Ela quebrou o frasco
  rationale: Transforma o particípio anterior à ação principal em uma sequência narrativa natural, sem intensificá-lo como «despedaçou».
- source_word: κατέχεεν αὐτοῦ τῆς κεφαλῆς
  choice: derramou o perfume sobre a cabeça dele
  rationale: «Sobre» representa naturalmente o movimento de derramar em cima da cabeça. A repetição de «o perfume» evita uma referência pronominal pouco clara em português.
theological_decisions:
- issue: Se a designação de Simão deve ser suavizada para indicar que ele já não sofria de lepra
  choice: Simão, o leproso
  alternative: Simão, que tinha sido leproso
  rationale: O grego o identifica como «o leproso» e não afirma que se tratava de uma condição passada. Acrescentar essa explicação resolveria uma questão histórica que o próprio texto deixa em aberto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura narrativa é fluida sem apagar a informação do original. A nota foi colocada junto de «puro», o termo ao qual se refere, em vez de junto do topônimo.
