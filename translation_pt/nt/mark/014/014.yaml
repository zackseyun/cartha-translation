revisions:
- from: 'E, onde quer que ele entre, digam ao dono da casa: “O Mestre pergunta: ‘Onde está o meu quarto de hóspedes[a], no qual comerei a Páscoa com os meus discípulos?’”'
  to: 'E, onde quer que ele entre, digam ao dono da casa: “O Mestre diz: ‘Onde está o meu quarto de hóspedes[a] onde eu possa comer a Páscoa com os meus discípulos?’”'
  rationale: A revisão restaura «diz» para λέγει e emprega «onde eu possa comer» para expressar naturalmente em português a finalidade ou ação contemplada relativa ao aposento. Conserva-se a terminologia central, o possessivo e a oração restritiva sem vírgula.
