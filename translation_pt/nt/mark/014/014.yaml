  - severity: medium
    issue: «no qual comerei» apresenta φάγω como futuro assertivo.
    rationale: No contexto da pergunta sobre o aposento destinado à refeição, «onde eu possa comer» conserva melhor a ação contemplada/visada expressa pelo subjuntivo grego.
