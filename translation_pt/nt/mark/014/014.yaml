  text: καὶ ὅπου ⸀ἐὰν εἰσέλθῃ εἴπατε τῷ οἰκοδεσπότῃ ὅτι Ὁ διδάσκαλος λέγει· Ποῦ ἐστιν τὸ κατάλυμά ⸀μου ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/014.yaml
  text: And wherever he enters[a], say to the master of the house, ‘The Teacher says, “Where is my guest room where I may eat the Passover with my disciples?”’
translation:
  language: pt
  text: 'E, onde quer que ele entre, digam ao dono da casa: “O Mestre diz: ‘Onde está o meu quarto de hóspedes[a] onde eu possa comer a Páscoa com os meus discípulos?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alojamento” ou “aposento”; o termo grego se refere a um lugar de hospedagem e, aqui, provavelmente indica um quarto de hóspedes numa casa particular, não uma hospedaria comercial.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν εἰσέλθῃ
  choice: onde quer que ele entre
  rationale: A combinação de ὅπου com ἐάν e o subjuntivo expressa uma referência indefinida; esta formulação preserva naturalmente esse sentido em português.
- source_word: εἴπατε
  choice: digam
  rationale: Imperativo aoristo plural dirigido aos dois discípulos; “digam” introduz de modo natural a fala que devem transmitir.
- source_word: οἰκοδεσπότῃ
  choice: dono da casa
  rationale: Designa a pessoa responsável pela casa. “Dono da casa” é corrente e claro, sem a rigidez de “chefe da casa” ou o caráter arcaico de “senhor da casa”.
- source_word: Ὁ διδάσκαλος λέγει
  choice: O Mestre pergunta
  rationale: διδάσκαλος significa mestre ou professor; “Mestre” é a designação tradicional e natural de Jesus neste contexto. Embora λέγει seja literalmente “diz”, em português a frase citada funciona como pergunta, e “pergunta” transmite naturalmente o ato de fala.
- source_word: κατάλυμά μου
  choice: meu quarto de hóspedes
  rationale: κατάλυμα pode indicar alojamento ou aposento para hóspedes; neste contexto doméstico, “quarto de hóspedes” é a opção mais clara. O possessivo μου é preservado.
- source_word: τὸ πάσχα
  choice: a Páscoa
  rationale: πάσχα pode designar a festa ou a refeição pascal. Com o verbo “comer”, “a Páscoa” conserva a expressão do grego sem explicitação desnecessária.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: com os meus discípulos
  rationale: Preserva o sentido relacional e formativo convencional de μαθηταί nos Evangelhos.
- source_word: φάγω
  choice: comerei
  rationale: O subjuntivo aoristo indica a ação contemplada a ser realizada naquele local. O futuro é mais natural em português no discurso direto e não transforma a frase em pedido de permissão.
theological_decisions:
- issue: Tradução da designação διδάσκαλος aplicada a Jesus
  choice: O Mestre
  alternative: O Professor
  rationale: “Mestre” comunica o sentido comum de διδάσκαλος no contexto discipular e funciona como designação reconhecível, sem importar um título cristológico mais forte que o grego.
- issue: Sentido de κατάλυμα
  choice: quarto de hóspedes
  alternative: alojamento
  rationale: O contexto aponta para um aposento numa casa particular, e não para uma hospedaria comercial. A nota mantém visíveis as possibilidades lexicais mais amplas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura da fala dentro da fala foi preservada com aspas de níveis distintos; a oração relativa foi mantida sem vírgula, por restringir qual quarto é procurado.
