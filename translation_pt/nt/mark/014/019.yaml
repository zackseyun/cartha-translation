base_translation:
  language: en
  yaml_path: translation/nt/mark/014/019.yaml
  text: They began to be grieved and to say to him[a], one by one, “Surely not I?”
translation:
  language: pt
  text: 'Eles começaram a ficar tristes e a lhe dizer, cada um por sua vez: “Não sou eu, certo?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Por acaso eu?” A partícula grega usada na pergunta indica que se espera uma resposta negativa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: começaram
  rationale: O aoristo de ἄρχω com os infinitivos complementares indica o início das ações; “começaram” é natural e preciso em português.
- source_word: λυπεῖσθαι
  choice: a ficar tristes
  rationale: O infinitivo expressa a entrada num estado de tristeza ou aflição. “Ficar tristes” comunica naturalmente esse valor incoativo no contexto.
- source_word: καὶ λέγειν
  choice: e a lhe dizer
  rationale: λέγω significa propriamente “dizer/falar”. Embora a fala tenha forma interrogativa, “dizer” preserva a escolha lexical do grego sem transformá-la em “perguntar”.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome remete a Jesus pelo contexto; “lhe” mantém a referência pronominal concisamente.
- source_word: εἷς κατὰ εἷς
  choice: um por um
  rationale: A expressão distributiva indica que cada discípulo falou individualmente, em sequência; “um por um” é idiomático e exato.
- source_word: Μήτι ἐγώ;
  choice: Não sou eu, sou?
  rationale: μήτι introduz uma pergunta que espera resposta negativa. Esta formulação preserva tanto a elipse quanto a expectativa de que a resposta seja “não” em português corrente.
theological_decisions:
- issue: Força da pergunta dos discípulos
  choice: 'Traduzir a pergunta como uma expectativa de resposta negativa: “Não sou eu, sou?”'
  alternative: “Sou eu?”
  rationale: A partícula μήτι sinaliza que o falante espera uma resposta negativa. A alternativa mais simples perderia essa nuance de apreensão e negação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Ficar tristes” evita a rigidez de “ser entristecidos”, e a pergunta final conserva em linguagem natural a expectativa negativa marcada por μήτι.
