id: MRK.14.34
reference: Mark 14:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/034.yaml
  text: And he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch.”
translation:
  language: pt
  text: 'E ele lhes diz: “Minha alma está profundamente triste[a], até a morte[b]. Fiquem aqui e vigiem[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tomada de profunda tristeza” ou “dominada pela tristeza”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a ponto de morrer”.
    reason: lexical_alternative
  - marker: c
    text: Ou “fiquem acordados”; a ordem pode incluir tanto permanecer fisicamente acordado quanto manter-se vigilante.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico característico da narrativa vívida de Marcos, sem o regularizar para o passado.
- source_word: Περίλυπός
  choice: profundamente triste
  rationale: Expressa tristeza e aflição intensas em português atual e digno, sem enfraquecer nem exagerar o termo grego.
- source_word: ψυχή
  choice: alma
  rationale: Preserva a imagem antropológica do grego e comunica a profunda angústia interior de Jesus; no contexto, pode abranger sua pessoa inteira, não apenas uma parte separável dela.
- source_word: ἕως θανάτου
  choice: até a morte
  rationale: Reproduz de modo conciso a expressão grega de intensidade extrema, mantendo aberta a nuance entre uma tristeza que chega à morte e uma tristeza a ponto de causar a morte.
- source_word: μείνατε
  choice: Fiquem
  rationale: Verbo natural no português contemporâneo para a ordem de permanecer naquele lugar; evita a rigidez menos coloquial de “permaneçam” sem perder a solenidade.
- source_word: ὧδε
  choice: aqui
  rationale: Equivalente locativo direto e natural.
- source_word: γρηγορεῖτε
  choice: vigiem
  rationale: Abrange tanto não adormecer quanto manter-se alerta e vigilante, preservando a amplitude contextual do imperativo.
theological_decisions:
- issue: Sentido de ψυχή na declaração de Jesus
  choice: alma
  alternative: minha pessoa / minha vida
  rationale: “Alma” conserva a linguagem do texto e a realidade da angústia humana de Jesus sem impor uma explicação posterior sobre a relação entre alma, vida e pessoa.
- issue: Força de γρηγορεῖτε
  choice: vigiem
  alternative: fiquem acordados
  rationale: A ordem inclui a vigília física, mas também pode envolver atenção vigilante; “vigiem” preserva essa tensão em vez de reduzi-la apenas à ausência de sono.
- issue: Força de ἕως θανάτου
  choice: até a morte
  alternative: a ponto de morrer
  rationale: A formulação escolhida preserva a concisão e a possível ambiguidade da expressão grega quanto ao alcance extremo da tristeza.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Mantém-se o presente histórico de Marcos. “Fiquem” soa mais natural que “permaneçam”, enquanto “vigiem” conserva a dupla nuance de vigília física e vigilância atenta.
