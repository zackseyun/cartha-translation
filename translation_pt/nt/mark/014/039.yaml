  text: καὶ πάλιν ἀπελθὼν προσηύξατο τὸν αὐτὸν λόγον εἰπών.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/039.yaml
  text: And again he went away and prayed[b][a], saying the same words.
translation:
  language: pt
  text: E, afastando-se novamente, orou, dizendo as mesmas palavras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a mesma coisa” ou “a mesma declaração”. Em grego, literalmente, “a mesma palavra”; aqui, “palavra” se refere ao conteúdo da oração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: novamente
  rationale: Marca a repetição da ação e mantém de modo natural a sequência narrativa.
- source_word: ἀπελθὼν
  choice: afastando-se
  rationale: O particípio aoristo indica que Jesus se retirou antes de orar; a forma pronominal comunica com naturalidade o movimento para longe.
- source_word: προσηύξατο
  choice: orou
  rationale: É a tradução corrente e clara do aoristo de προσεύχομαι; a voz média não exige expressão adicional em português.
- source_word: τὸν αὐτὸν λόγον
  choice: as mesmas palavras
  rationale: Neste contexto, λόγος designa o conteúdo verbal da oração repetida. O plural idiomático evita sugerir que Jesus repetiu apenas uma palavra, sem perder a referência à mesma declaração.
- source_word: εἰπών
  choice: dizendo
  rationale: O particípio esclarece o conteúdo ou modo da oração e se liga naturalmente ao verbo principal em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa fluida. “Afastando-se” conserva a sequência do particípio grego, e “as mesmas palavras” expressa de modo idiomático o conteúdo repetido da oração.
