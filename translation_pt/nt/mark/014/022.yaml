  naturalness: Recomenda-se «tomou o pão» e «deu-lhes», formulações correntes, claras e adequadas ao registro bíblico moderno. «Pronunciou uma bênção» expressa naturalmente εὐλογήσας no contexto da refeição, sem sugerir que o grego especifique uma fórmula ou uma bênção determinada.
