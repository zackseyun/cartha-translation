base_translation:
  language: en
  yaml_path: translation/nt/mark/014/022.yaml
  text: And as they were eating[a], he took bread, blessed it, broke it, and gave it to them, and said, “Take; this is my body.”
translation:
  language: pt
  text: 'Enquanto comiam, ele tomou o pão, pronunciou uma bênção, partiu-o, deu-lhes e disse: “Tomem; isto é o meu corpo.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “isto representa o meu corpo” / “isto significa o meu corpo”. Literalmente, o grego diz: “isto é o meu corpo”.'
    reason: Leituras interpretativas alternativas da cópula são registradas sem substituir a redação direta do grego no texto principal.
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: Enquanto comiam
  rationale: O genitivo absoluto com particípio presente indica uma ação em andamento simultânea aos acontecimentos seguintes; esta formulação é natural em português.
- source_word: λαβὼν ἄρτον
  choice: ele pegou o pão
  rationale: O particípio aoristo é expresso naturalmente por verbo finito na narrativa portuguesa. O artigo definido é idiomático no contexto da refeição e não acrescenta uma especificação ausente no grego.
- source_word: εὐλογήσας
  choice: pronunciou a bênção
  rationale: No contexto de uma refeição, o verbo pode indicar a recitação de uma bênção sobre o pão. A formulação evita a impressão de que o grego explicita um objeto direto.
- source_word: ἔκλασεν
  choice: partiu-o
  rationale: O pronome retoma naturalmente o pão, e o verbo preserva a ação concreta de parti-lo.
- source_word: ἔδωκεν αὐτοῖς
  choice: deu-o a eles
  rationale: O objeto, implícito no grego, é recuperado do contexto; a formulação evita o mais interpretativo “distribuiu”.
- source_word: Λάβετε
  choice: Tomem
  rationale: O imperativo plural dirige-se aos discípulos. “Tomem” é direto, atual e não acrescenta um objeto não expresso.
- source_word: τοῦτό ἐστιν
  choice: isto é
  rationale: Traduz diretamente a construção com a cópula, sem resolver de modo interpretativo sua força na declaração.
- source_word: τὸ σῶμά μου
  choice: o meu corpo
  rationale: σῶμα significa diretamente “corpo”; o artigo é natural em português com o possessivo e não altera o sentido.
theological_decisions:
- issue: Formulação da declaração de Jesus sobre o pão
  choice: isto é o meu corpo
  alternative: isto representa o meu corpo / isto significa o meu corpo
  rationale: O grego emprega a cópula comum ἐστιν. A tradução principal preserva a expressão e sua tensão teológica, sem decidir no texto debates sobre a Ceia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência verbal foi tornada natural em narrativa, mantendo concisão e proximidade com o grego. O marcador da nota foi colocado após a declaração à qual a alternativa efetivamente se refere.
