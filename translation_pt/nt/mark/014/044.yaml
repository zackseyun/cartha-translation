base_translation:
  language: en
  yaml_path: translation/nt/mark/014/044.yaml
  text: The one betraying him had given them a signal[a], saying, “The one I kiss is he[c][b]. Seize him and lead him away securely.”
translation:
  language: pt
  text: 'Aquele que o estava traindo já lhes havia dado um sinal[a], dizendo: “Aquele a quem eu beijar[b] é ele. Prendam-no e levem-no com segurança[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um sinal combinado”; o termo grego indica um meio de identificação acertado previamente.
    reason: lexical_alternative
  - marker: b
    text: O beijo era uma forma habitual de saudação e, aqui, servia para identificar Jesus.
    reason: cultural_note
  - marker: c
    text: Ou “seguramente”. Neste contexto, provavelmente significa levá-lo de modo a mantê-lo sob custódia firme, e não zelar principalmente por seu bem-estar.
    reason: alternative_reading
lexical_decisions:
- source_word: δεδώκει
  choice: já lhes havia dado
  rationale: O mais-que-perfeito grego indica que o sinal tinha sido combinado antes da chegada; “já havia dado” expressa essa anterioridade com naturalidade.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: Aquele que o estava traindo
  rationale: Preserva a construção participial e, no contexto narrativo, traduz παραδίδωμι pelo sentido de trair, sem reduzir a expressão a um título nominal.
- source_word: σύσσημον
  choice: um sinal
  rationale: Refere-se a um sinal combinado para identificação. “Sinal” é claro em português, e a nota explicita seu caráter previamente acertado.
- source_word: λέγων
  choice: dizendo
  rationale: Mantém a ligação participial entre a entrega prévia do sinal e as instruções citadas.
- source_word: Ὃν ἂν φιλήσω
  choice: Aquele a quem eu beijar
  rationale: Reproduz de modo natural a relativa indefinida com ἄν e não acrescenta um substantivo ausente do grego.
- source_word: αὐτός ἐστιν
  choice: é ele
  rationale: Conserva a identificação enfática e concisa do original.
- source_word: κρατήσατε
  choice: Prendam-no
  rationale: No contexto da detenção, comunica tanto a captura quanto a necessidade de mantê-lo sob controle; é mais natural aqui do que “agarrem-no”.
- source_word: ἀπάγετε ἀσφαλῶς
  choice: levem-no sob forte vigilância
  rationale: Expressa o sentido contextual de conduzi-lo de modo seguro, impedindo fuga, sem sugerir principalmente cuidado com o bem-estar de Jesus.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e as relações verbais do grego são preservadas quando naturais. “Sob forte vigilância” explicita idiomaticamente a força contextual de ἀσφαλῶς sem eliminar sua nuance de segurança.
