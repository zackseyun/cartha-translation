id: MRK.14.38
reference: Mark 14:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ ⸀ἔλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/038.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: pt
  text: Mantenham-se acordados e orem, para que não entrem em tentação.[a] O espírito está disposto, mas a carne é fraca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “provação” ou “prova” para “tentação” (πειρασμόν).
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Mantenham-se acordados
  rationale: O imperativo plural pede que os discípulos permaneçam despertos; a formulação também conserva, no contexto, a ideia de vigilância.
- source_word: προσεύχεσθε
  choice: orem
  rationale: Imperativo plural claro e natural; o presente grego admite a exortação continuada sem exigir uma perífrase em português.
- source_word: ἵνα μὴ ἔλθητε
  choice: para que não entrem
  rationale: Expressa naturalmente a finalidade preventiva de ἵνα μή com o subjuntivo, sem recorrer a uma construção arcaizante.
- source_word: εἰς πειρασμόν
  choice: em tentação
  rationale: πειρασμός pode indicar tentação, prova ou provação. 'Tentação' é adequado à advertência imediata, enquanto a amplitude lexical é preservada em nota.
- source_word: τὸ μὲν πνεῦμα πρόθυμον
  choice: O espírito está disposto
  rationale: A elipse da cópula é suprida naturalmente. 'Espírito' em minúscula favorece, sem tornar absolutamente explícita, a referência à disposição interior humana; πρόθυμον indica prontidão ou boa vontade.
- source_word: ἡ δὲ σὰρξ ἀσθενής
  choice: mas a carne é fraca
  rationale: Mantém a antítese com 'espírito' e preserva σάρξ como 'carne', sem convertê-la indevidamente em 'natureza pecaminosa' nem reduzi-la apenas a 'corpo'.
theological_decisions:
- issue: Referente de πνεῦμα
  choice: espírito humano / disposição interior, grafado em minúscula
  alternative: Espírito Santo
  rationale: O contraste imediato com a carne e a situação dos discípulos sonolentos favorecem a disposição interior humana. A minúscula evita impor uma identificação com o Espírito Santo que o contexto não exige.
- issue: Sentido de σάρξ
  choice: carne
  alternative: corpo; natureza pecaminosa
  rationale: Aqui a expressão destaca a fragilidade humana diante de uma intenção sincera, não necessariamente uma categoria doutrinária específica de natureza pecaminosa. 'Carne' preserva a tensão antropológica do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural é explicitado por formas verbais de terceira pessoa. 'Mantenham-se acordados' conserva tanto o sentido literal quanto a exortação à vigilância; a construção evita linguagem arcaica.
