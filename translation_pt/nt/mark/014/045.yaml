  text: καὶ ἐλθὼν ⸀εὐθὺς προσελθὼν αὐτῷ λέγει· ⸀Ῥαββί, καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/045.yaml
  text: And when he came[a], he immediately went up to him and said, “Rabbi!” and kissed him repeatedly.
translation:
  language: pt
  text: 'Ao chegar, ele foi imediatamente até Jesus e disse: “Rabi!” e o beijou efusivamente[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o beijou repetidamente” ou “o beijou calorosamente”. O verbo grego é mais enfático que um simples “beijou”.
    reason: alternativa lexical
lexical_decisions:
- source_word: ἐλθὼν
  choice: Ao chegar
  rationale: O particípio aoristo tem valor temporal; esta formulação preserva a sequência de modo natural em português.
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Mantém o movimento rápido característico da narrativa de Marcos.
- source_word: προσελθὼν αὐτῷ
  choice: foi [...] até Jesus
  rationale: Expressa a aproximação física sem repetir de maneira pesada o verbo “chegar”; explicitar “Jesus” torna claro o referente do pronome no versículo isolado.
- source_word: λέγει
  choice: disse
  rationale: O presente histórico grego é vertido pelo pretérito, forma natural na narrativa portuguesa.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Preserva o título semítico empregado na cena e sua textura histórica.
- source_word: κατεφίλησεν
  choice: o beijou efusivamente
  rationale: O verbo composto é mais enfático que o simples “beijar”. “Efusivamente” comunica essa força sem determinar se houve necessariamente vários beijos nem atribuir sinceridade ao gesto.
theological_decisions:
- issue: Forma de tratamento usada por Judas (Ῥαββί)
  choice: Rabi
  alternative: Mestre
  rationale: A transliteração preserva o título efetivamente empregado e a ironia narrativa, sem acrescentar interpretação doutrinária.
- issue: Força do beijo de Judas (κατεφίλησεν)
  choice: o beijou efusivamente
  alternative: o beijou repetidamente
  rationale: A tradução escolhida conserva a intensidade do verbo, mas não resolve indevidamente a ambiguidade entre intensidade, calor demonstrativo e possível repetição.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase acompanha o avanço narrativo do grego, e a nota preserva a amplitude semântica do verbo final.
