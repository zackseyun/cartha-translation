id: MRK.14.24
reference: Mark 14:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ αἷμά μου ⸀τῆς διαθήκης τὸ ⸂ἐκχυννόμενον ὑπὲρ πολλῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/024.yaml
  text: And he said to them[a], “This is my blood of the covenant[c][b], which is poured out for many.”
translation:
  language: pt
  text: 'E ele lhes disse: “Isto é o meu sangue da aliança[a], que é derramado[b] em favor de muitos[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “o meu sangue da nova aliança”. O texto grego adotado aqui diz apenas “o meu sangue da aliança”.
    reason: textual_variant
  - marker: b
    text: 'Ou: “que está sendo derramado”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “por muitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτό ἐστιν
  choice: Isto é
  rationale: Mantém diretamente a construção copulativa grega, sem introduzir interpretações como “isto significa” ou “isto representa”.
- source_word: τὸ αἷμά μου
  choice: o meu sangue
  rationale: Reproduz a construção possessiva e conserva a imagem explícita do sangue, em vez de parafraseá-la como “minha morte”.
- source_word: τῆς διαθήκης
  choice: da aliança
  rationale: “Aliança” é o sentido contextual de διαθήκη, especialmente diante da linguagem de sangue que remete ao estabelecimento da aliança; o texto adotado não contém “nova”.
- source_word: ἐκχυννόμενον
  choice: que é derramado
  rationale: A oração relativa soa natural em português e preserva a imagem sacrificial do particípio presente passivo; a forma progressiva possível é registrada em nota.
- source_word: ὑπὲρ πολλῶν
  choice: em favor de muitos
  rationale: Expressa de modo idiomático o valor de ὑπέρ com o genitivo e evita que “por muitos”, junto de uma forma passiva, seja entendido como indicação de quem derrama o sangue.
theological_decisions:
- issue: 'Sentido de διαθήκη: aliança ou testamento'
  choice: aliança
  alternative: testamento
  rationale: No contexto da ceia e da linguagem do sangue, o termo evoca a ratificação de uma aliança, particularmente Êxodo 24:8; “testamento” obscureceria essa ligação.
- issue: Inclusão de “nova” antes de “aliança”
  choice: da aliança
  alternative: da nova aliança
  rationale: O texto do SBLGNT aqui não contém καινῆς (“nova”). A tradução não harmoniza Marcos com passagens paralelas, mas registra a variante manuscrita em nota.
- issue: Alcance teológico de ὑπὲρ πολλῶν
  choice: em favor de muitos
  alternative: em favor de todos
  rationale: A tradução conserva πολλῶν (“muitos”) e não resolve no próprio versículo debates mais amplos sobre o alcance da expiação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Isto é” preserva a formulação direta; “sangue da aliança” mantém a ressonância bíblica; “em favor de muitos” evita ambiguidade de agente na construção passiva.
