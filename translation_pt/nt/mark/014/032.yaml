  text: Καὶ ἔρχονται εἰς χωρίον οὗ τὸ ὄνομα Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς αὐτοῦ· Καθίσατε ὧδε ἕως προσεύξωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/032.yaml
  text: And they came to a place whose name was Gethsemane[a], and he says to his disciples, “Sit here until I pray.”
translation:
  language: pt
  text: 'Eles chegaram a um lugar chamado Getsêmani[a], e Jesus disse aos seus discípulos: “Sentem-se aqui até que eu ore.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “Eles chegam a um lugar cujo nome é Getsêmani, e ele diz”. Marcos emprega o presente histórico para dar vivacidade à narrativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: chegaram
  rationale: O presente grego funciona como presente histórico na narrativa. O pretérito perfeito é mais natural em português e mantém o avanço narrativo.
- source_word: χωρίον
  choice: lugar
  rationale: O termo pode indicar um lugar, terreno ou propriedade; “lugar” preserva a amplitude sem especificar além do texto.
- source_word: οὗ τὸ ὄνομα Γεθσημανί
  choice: chamado Getsêmani
  rationale: Expressa de modo natural em português a construção grega “cujo nome [era] Getsêmani”, mantendo o nome próprio por transliteração consagrada.
- source_word: λέγει
  choice: disse
  rationale: Embora o grego use novamente o presente histórico, o pretérito é idiomático em narrativa portuguesa. O sujeito explícito “Jesus” evita ambiguidade sem acrescentar informação contextual nova.
- source_word: μαθηταῖς
  choice: discípulos
  rationale: É o equivalente tradicional e preciso, preservando a relação entre mestre e aprendizes.
- source_word: Καθίσατε
  choice: Sentem-se
  rationale: Reproduz a ordem direta em forma natural e amplamente compreensível no português moderno.
- source_word: ὧδε
  choice: aqui
  rationale: Equivalente direto e natural do advérbio dêitico.
- source_word: ἕως προσεύξωμαι
  choice: enquanto eu oro
  rationale: Neste contexto, a expressão delimita o período em que os discípulos devem permanecer sentados. “Enquanto eu oro” é natural em português; “até que eu ore” poderia sugerir apenas o início da oração, e “até eu terminar de orar” tornaria explícito um término não formulado no grego.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas verbais de ampla legibilidade brasileira. Os presentes históricos gregos foram vertidos no passado no texto principal, e a forma mais literal foi preservada em nota.
