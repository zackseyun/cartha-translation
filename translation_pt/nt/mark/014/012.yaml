  text: Καὶ τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων, ὅτε τὸ πάσχα ἔθυον, λέγουσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ· Ποῦ θέλεις ἀπελθόντες ἑτοιμάσωμεν ἵνα φάγῃς τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/012.yaml
  text: And on the first day of Unleavened Bread[a], when they were sacrificing the Passover lamb, his disciples said to him, “Where do you want us to go and prepare so that you may eat the Passover?”
translation:
  language: pt
  text: 'No primeiro dia dos Pães sem Fermento, quando sacrificavam o cordeiro da Páscoa,[a] os discípulos de Jesus lhe perguntaram: “Onde o senhor quer que vamos e preparemos a Páscoa, para que a coma?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando sacrificavam a Páscoa”. O grego diz literalmente “a Páscoa”, expressão que, neste contexto, provavelmente se refere ao cordeiro pascal que era sacrificado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων
  choice: No primeiro dia dos Pães sem Fermento
  rationale: Traduz naturalmente a construção genitiva e preserva a designação festiva sem acrescentar “Festa de”, expressão não explícita no grego.
- source_word: ὅτε τὸ πάσχα ἔθυον
  choice: quando sacrificavam o cordeiro da Páscoa
  rationale: O imperfeito ἔθυον indica a ação em curso ou costumeira. Com o verbo “sacrificar”, πάσχα se refere contextualmente à vítima pascal; “cordeiro” explicita esse referente em português corrente.
- source_word: λέγουσιν
  choice: perguntaram
  rationale: O presente histórico grego é vertido no passado, como é natural na narrativa portuguesa. Como a fala direta é interrogativa, “perguntaram” comunica com precisão a função do verbo de elocução.
- source_word: Ποῦ θέλεις
  choice: Onde o senhor quer
  rationale: θέλω expressa desejo ou intenção. “Quer” é a equivalência moderna mais natural; “o senhor” torna explícito o sujeito na pergunta dirigida respeitosamente a Jesus, sem usar uma forma arcaica.
- source_word: ἀπελθόντες ἑτοιμάσωμεν
  choice: que vamos preparar
  rationale: O particípio de movimento é integrado à expressão verbal de modo idiomático, preservando a sequência de ir e preparar sem produzir uma formulação rígida.
- source_word: ἵνα φάγῃς τὸ πάσχα
  choice: para que a coma
  rationale: “Para que” preserva a relação de finalidade de ἵνα. Aqui πάσχα designa a refeição pascal; o pronome feminino retoma “a Páscoa” sem repetição desnecessária.
theological_decisions:
- issue: Referência de πάσχα nas duas ocorrências do versículo
  choice: Na primeira ocorrência, “cordeiro da Páscoa”, por estar associado ao sacrifício; na segunda, “Páscoa”, em referência à refeição.
  alternative: Traduzir ambas simplesmente como “Páscoa” ou ambas como “cordeiro da Páscoa”.
  rationale: 'O contexto verbal determina a nuance de cada ocorrência: θύω aponta para a vítima sacrificial, enquanto ἐσθίω aponta para a refeição. A distinção é lexical e contextual, não uma harmonização teológica.'
- issue: Forma de tratamento dirigida a Jesus
  choice: “o senhor” em minúscula como forma respeitosa de segunda pessoa
  alternative: “você”, “tu” ou “Senhor” como título explícito
  rationale: O grego contém apenas a segunda pessoa singular e não emprega κύριος neste trecho. A forma escolhida oferece leitura brasileira natural e respeitosa sem inserir no texto um título cristológico ausente.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Pães sem Fermento” funciona como nome da celebração. A colocação pronominal e a forma “para que a coma” mantêm clareza formal sem arcaísmo excessivo.
