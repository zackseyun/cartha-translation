id: MRK.14.10
reference: Mark 14:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Καὶ Ἰούδας ⸂Ἰσκαριὼθ ὁ⸃ εἷς τῶν δώδεκα ἀπῆλθεν πρὸς τοὺς ἀρχιερεῖς ἵνα αὐτὸν ⸂παραδοῖ αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/010.yaml
  text: And Judas Iscariot[a], one of the Twelve, went to the chief priests in order to hand him over to them.
translation:
  language: pt
  text: E Judas Iscariotes, um dos Doze, foi até os chefes dos sacerdotes para entregá-lo a eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “traí-lo, entregando-o a eles”. O verbo grego pode significar “entregar”; no caso de Judas, essa entrega é um ato de traição.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Mantém o conectivo narrativo simples e liga este acontecimento ao contexto anterior sem acrescentar nuance interpretativa.
- source_word: Ἰούδας Ἰσκαριὼθ
  choice: Judas Iscariotes
  rationale: Emprega as formas tradicionais e amplamente reconhecidas do nome e do epíteto em português.
- source_word: ὁ εἷς τῶν δώδεκα
  choice: um dos Doze
  rationale: A inicial maiúscula indica que “os Doze” é a designação do grupo reconhecido de discípulos, não apenas um numeral.
- source_word: ἀπῆλθεν
  choice: foi
  rationale: Expressa de modo natural o verbo narrativo de movimento, sem enfatizar indevidamente a ideia de partida ou afastamento.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: até os chefes dos sacerdotes
  rationale: No plural, o termo designa a liderança sacerdotal de Jerusalém; “chefes dos sacerdotes” é claro e evita sugerir a existência simultânea de vários sumos sacerdotes em exercício.
- source_word: ἵνα
  choice: para
  rationale: Comunica de maneira direta e natural a finalidade da ação.
- source_word: παραδοῖ
  choice: entregá-lo
  rationale: Preserva o sentido amplo de entregar ou pôr alguém em poder de outros, sem substituir no texto principal esse sentido pela interpretação mais específica de trair.
- source_word: αὐτὸν ... αὐτοῖς
  choice: -lo a eles
  rationale: Mantém explícitos tanto o objeto, Jesus, quanto os destinatários, os chefes dos sacerdotes.
theological_decisions:
- issue: Sentido de παραδοῖ no contexto da traição de Judas
  choice: entregá-lo a eles
  alternative: traí-lo, entregando-o a eles
  rationale: A ação de Judas constitui traição, mas o verbo grego tem o sentido mais amplo de entregar. A formulação principal conserva a recorrência e a tensão do vocabulário da narrativa da paixão, enquanto a nota registra a implicação contextual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Foi até” soa natural para movimento em direção a pessoas; “chefes dos sacerdotes” comunica a função institucional com clareza. A nota mantém a alternativa interpretativa sem sobrecarregar o texto principal.
