  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔρχεται τὸ τρίτον καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἀπέχει· ἦλθεν ἡ ὥρα, ἰδοὺ παραδίδοται ὁ υἱὸς τοῦ ἀνθρώπου εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/041.yaml
  text: And he comes the third time and says to them[a], “Are you still sleeping and resting? It is enough; the hour has come. Look[c][b], the Son of Man is being handed over into the hands of sinners.”
translation:
  language: pt
  text: 'E ele vem pela terceira vez e lhes diz: “Vocês ainda estão dormindo e descansando?[a] Basta![b] Chegou a hora. Vejam: o Filho do Homem está sendo entregue nas mãos dos pecadores.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Continuem dormindo e descansando”. A formulação grega pode ser entendida como uma declaração ou permissão irônica, ou como uma pergunta retórica.'
    reason: alternative_reading
  - marker: b
    text: A expressão traduzida por “Basta!” é difícil. Também pode ser entendida como “É o bastante”; uma proposta menos provável neste contexto lhe atribui sentido comercial, como “o pagamento foi recebido integralmente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται τὸ τρίτον
  choice: vem pela terceira vez
  rationale: Mantém o presente histórico vívido do grego e expressa τὸ τρίτον de modo natural em português.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Vocês ainda estão dormindo e descansando?
  rationale: A leitura interrogativa comunica de modo natural a provável repreensão no contexto, sem ocultar que a construção grega também admite uma declaração ou permissão irônica; essa alternativa é registrada em nota.
- source_word: ἀπέχει
  choice: Basta!
  rationale: Expressão grega notoriamente difícil. A interjeição concisa se ajusta à transição dramática, enquanto alternativas legítimas são preservadas em nota.
- source_word: ἦλθεν ἡ ὥρα
  choice: Chegou a hora
  rationale: Preserva tanto a imagem temporal como a ressonância do momento determinado.
- source_word: ἰδοὺ
  choice: Vejam
  rationale: Equivalente moderno, claro e digno que conserva a função de chamar a atenção dos discípulos.
- source_word: παραδίδοται
  choice: está sendo entregue
  rationale: Conserva o sentido amplo de entregar, sem restringi-lo antecipadamente à ideia de traição ou somente à ação de Judas.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Forma consagrada e semanticamente adequada para a autodesignação, preservando seu possível valor titular.
- source_word: εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν
  choice: nas mãos dos pecadores
  rationale: Preserva a imagem concreta de cair sob o poder de outros e traduz naturalmente o adjetivo substantivado.
theological_decisions:
- issue: Força de Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: 'Pergunta retórica de repreensão: “Vocês ainda estão dormindo e descansando?”'
  alternative: 'Declaração ou permissão irônica: “Continuem dormindo e descansando.”'
  rationale: A pontuação não fazia parte dos manuscritos mais antigos, e as formas gregas permitem ambas as leituras. A pergunta é fluente e coerente com a situação, mas a nota conserva a ambiguidade real.
- issue: Sentido de ἀπέχει
  choice: “Basta!”
  alternative: “É o bastante” ou, de modo menos provável neste contexto, “o pagamento foi recebido integralmente”
  rationale: A expressão é lexicalmente obscura. “Basta!” marca adequadamente a mudança narrativa sem introduzir uma interpretação comercial especulativa.
- issue: Sentido de παραδίδοται
  choice: “está sendo entregue”
  alternative: “está sendo traído”
  rationale: A escolha preserva a amplitude narrativa e teológica do verbo, sem limitar a agência a Judas.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento plural “vocês” favorece clareza imediata. A redação mantém dignidade narrativa, evita arcaísmos e preserva em notas as ambiguidades genuínas do grego.
