id: MRK.14.21
reference: Mark 14:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ὅτι ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· ⸀καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/021.yaml
  text: For the Son of Man goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been good for him if that man had not been born.
translation:
  language: pt
  text: Pois o Filho do Homem vai, conforme está escrito a respeito dele; mas ai daquele homem por quem o Filho do Homem é traído[a]! Teria sido bom para ele se aquele homem não tivesse nascido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “é entregue”.
    reason: Alternativa lexical que preserva o sentido mais amplo de παραδίδοται.
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz naturalmente, em português, a explicação causal dada por Jesus.
- source_word: ὁ μὲν ... δὲ
  choice: segue seu caminho ... mas ai
  rationale: O contraste μέν...δέ é expresso de modo idiomático por “mas”, sem tornar explícito o μέν.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a autodesignação tradicional de Jesus e sua possível ressonância daniélica.
- source_word: ὑπάγει
  choice: segue seu caminho
  rationale: Expressa o movimento rumo ao destino previsto sem limitar o verbo a uma simples partida espacial.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: conforme está escrito a respeito dele
  rationale: Preserva tanto a comparação de καθώς quanto a força resultativa de γέγραπται em português natural.
- source_word: οὐαὶ
  choice: ai
  rationale: É a interjeição profética tradicional e conserva a força solene de denúncia.
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: daquele homem
  rationale: Identifica um homem específico e mantém a força do demonstrativo.
- source_word: δι’ οὗ
  choice: por meio de quem
  rationale: Preserva a ideia de agência ou mediação de διά com o genitivo.
- source_word: παραδίδοται
  choice: é traído
  rationale: No contexto imediato da ação de Judas, comunica claramente o caráter traiçoeiro do ato; a tradução mais literal é registrada em nota.
- source_word: καλὸν αὐτῷ
  choice: Teria sido bom para esse homem
  rationale: Expressa de maneira clara a avaliação contrafactual ligada à condição seguinte.
- source_word: εἰ οὐκ ἐγεννήθη
  choice: não ter nascido
  rationale: Reproduz em português idiomático a condição contrária ao fato, sem acrescentar a ênfase de “nunca”.
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: esse homem
  rationale: Retém a repetição enfática e específica do grego, evitando uma formulação excessivamente pesada.
theological_decisions:
- issue: Sentido de παραδίδοται no contexto da paixão
  choice: é traído
  alternative: é entregue
  rationale: A traição de Judas está em primeiro plano, mas a nota preserva o sentido mais amplo e literal do verbo nos relatos da paixão.
- issue: Soberania divina e responsabilidade humana
  choice: conforme está escrito ... mas ai daquele homem
  alternative: Nenhuma harmonização explicativa acrescentada
  rationale: A tradução mantém lado a lado o cumprimento do que está escrito e a culpa do agente humano, sem resolver a tensão teológica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Segue seu caminho” evita rigidez literal e mantém a ideia de avanço para o destino anunciado. A pontuação separa com clareza o cumprimento das Escrituras, a advertência e a avaliação contrafactual.
