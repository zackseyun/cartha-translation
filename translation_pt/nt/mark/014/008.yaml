source:
  edition: SBLGNT
  text: ὃ ⸀ἔσχεν ἐποίησεν, προέλαβεν μυρίσαι ⸂τὸ σῶμά μου⸃ εἰς τὸν ἐνταφιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/008.yaml
  text: She did what she could[a]; she anointed my body beforehand for burial.
translation:
  language: pt
  text: Ela fez o que podia[a]; ungiu antecipadamente o meu corpo para o sepultamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “O que ela tinha, ela fez.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἔσχεν ἐποίησεν
  choice: Ela fez o que podia
  rationale: A expressão significa idiomaticamente que ela fez o que estava ao seu alcance. Esta formulação é natural em português e preserva o sentido, enquanto a nota registra a forma mais literal.
- source_word: προέλαβεν
  choice: antecipadamente
  rationale: O verbo indica que a ação foi realizada antes do momento esperado; ligado a «ungiu», o advérbio comunica isso com clareza sem introduzir ideia de movimento.
- source_word: μυρίσαι
  choice: ungiu
  rationale: O infinitivo refere-se à aplicação de perfume ou unguento. «Ungiu» é preciso no contexto de preparação funerária e permanece corrente no registro bíblico moderno.
- source_word: τὸ σῶμά μου
  choice: o meu corpo
  rationale: Tradução direta e natural da expressão nominal.
- source_word: εἰς τὸν ἐνταφιασμόν
  choice: para o sepultamento
  rationale: A preposição expressa finalidade em relação à preparação do corpo. «Sepultamento» comunica claramente o enterro sem recorrer a termo excessivamente técnico.
theological_decisions:
- issue: Explicitação do sujeito feminino, implícito na forma verbal grega
  choice: Ela fez...; ungiu...
  alternative: O que ela tinha, fez; antecipou-se a ungir...
  rationale: Embora o grego não traga pronome sujeito explícito nesta oração, o contexto imediato identifica a mulher. «Ela» torna a primeira oração natural em português; sua omissão antes de «ungiu» evita repetição desnecessária sem criar conteúdo teológico novo.
- issue: Relação de προέλαβεν com a unção e o sepultamento
  choice: ungiu antecipadamente o meu corpo para o sepultamento
  alternative: antecipou-se a ungir o meu corpo para o sepultamento
  rationale: A formulação escolhida mantém a ação anterior ao sepultamento sem sugerir que o verbo descreva deslocamento ou chegada.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução usa equivalência ótima: verte idiomaticamente ὃ ἔσχεν ἐποίησεν no texto principal e preserva sua forma mais literal em nota.'
