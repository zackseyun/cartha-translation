  text: Καὶ ὄντος τοῦ Πέτρου ⸂κάτω ἐν τῇ αὐλῇ⸃ ἔρχεται μία τῶν παιδισκῶν τοῦ ἀρχιερέως,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/066.yaml
  text: And while Peter was below in the courtyard[a], one of the high priest’s servant girls came,
translation:
  language: pt
  text: Enquanto Pedro estava embaixo, no pátio, chegou uma das servas do sumo sacerdote[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma das escravas do sumo sacerdote”. A palavra grega παιδίσκη pode designar uma jovem serva doméstica ou escrava; aqui, “serva” destaca sua função na casa sem determinar de modo explícito sua condição jurídica.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος τοῦ Πέτρου
  choice: Enquanto Pedro estava
  rationale: O genitivo absoluto com particípio presente introduz uma circunstância temporal em andamento; esta formulação é natural em português e preserva esse valor.
- source_word: κάτω
  choice: embaixo
  rationale: Indica que Pedro estava numa parte inferior do local, possivelmente em contraste com o espaço onde ocorria o interrogatório; “embaixo” mantém a referência espacial sem explicá-la além do texto.
- source_word: ἐν τῇ αὐλῇ
  choice: no pátio
  rationale: Neste contexto, αὐλή designa o pátio da residência do sumo sacerdote. “Pátio” é claro e corrente em português.
- source_word: ἔρχεται
  choice: chegou
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma natural na narrativa portuguesa. “Chegou” conserva o movimento de entrada em cena sem acrescentar a ideia específica de aproximação.
- source_word: μία τῶν παιδισκῶν
  choice: uma das servas
  rationale: παιδίσκη pode designar uma jovem serva ou escrava. “Serva” comunica a função doméstica e a condição subordinada, enquanto a nota preserva a alternativa lexical referente à escravidão.
- source_word: τοῦ ἀρχιερέως
  choice: do sumo sacerdote
  rationale: O genitivo expressa associação com a casa do sumo sacerdote; a formulação portuguesa é idiomática e não define além do necessário a natureza jurídica dessa relação.
