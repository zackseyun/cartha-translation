  text: καὶ ὁ Πέτρος ἀπὸ μακρόθεν ἠκολούθησεν αὐτῷ ἕως ἔσω εἰς τὴν αὐλὴν τοῦ ἀρχιερέως καὶ ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν καὶ θερμαινόμενος πρὸς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/054.yaml
  text: And Peter followed him from a distance[a], as far as inside the courtyard of the high priest. He was sitting with the officers and warming himself by the fire.
translation:
  language: pt
  text: Pedro o seguiu de longe até entrar no pátio do sumo sacerdote. Ali estava sentado com os guardas, aquecendo-se junto à fogueira.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “junto à luz”. O grego diz literalmente “em direção à luz” ou “junto à luz”, provavelmente referindo-se à luz da fogueira no pátio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν
  choice: de longe
  rationale: Expressão portuguesa natural que preserva a distância física e a cautela sugerida pela narrativa.
- source_word: ἠκολούθησεν αὐτῷ
  choice: o seguiu
  rationale: O aoristo narrativo é adequadamente expresso pelo pretérito perfeito; o pronome retoma Jesus sem acrescentar informação.
- source_word: ἕως ἔσω εἰς
  choice: até entrar no
  rationale: Reproduz de modo natural a ideia de movimento até o interior da área indicada, sem sugerir que Pedro entrou na casa propriamente dita.
- source_word: αὐλήν
  choice: pátio
  rationale: Neste contexto, designa o espaço interno descoberto da residência do sumo sacerdote; “pátio” é claro e corrente.
- source_word: ἀρχιερέως
  choice: sumo sacerdote
  rationale: Equivalente português tradicional, claro e contextualmente exato para o título.
- source_word: ἦν συγκαθήμενος
  choice: Ali ficou sentado com
  rationale: Comunica a situação contínua descrita pela construção perifrástica e representa o elemento associativo de συγκαθήμενος por meio de “com”.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: com os guardas
  rationale: No contexto da prisão e da audiência, os ὑπηρέται são agentes subordinados com funções de custódia e segurança; “guardas” comunica essa função ao leitor comum.
- source_word: θερμαινόμενος
  choice: aquecendo-se
  rationale: Preserva a ação simultânea e o sentido reflexivo contextual do particípio.
- source_word: πρὸς τὸ φῶς
  choice: junto à fogueira
  rationale: Embora φῶς signifique literalmente “luz”, o contexto de aquecer-se indica a fogueira que produzia essa luz; a nota conserva a formulação literal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A divisão em duas frases torna clara a mudança da ação de seguir para a cena contínua no pátio. O marcador da nota foi colocado após “fogueira”, termo ao qual a alternativa lexical efetivamente se refere.
