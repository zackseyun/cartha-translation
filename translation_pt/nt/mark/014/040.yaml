base_translation:
  language: en
  yaml_path: translation/nt/mark/014/040.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down, and they did not know what they should answer him.
translation:
  language: pt
  text: E, ao voltar, encontrou-os dormindo, pois os olhos deles estavam pesados[a], e eles não sabiam o que lhe responder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estavam sobrecarregados”. O grego retrata os olhos como estando sobrecarregados ou pesados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἐλθὼν
  choice: voltando ... outra vez
  rationale: Expressa com naturalidade a ação repetida e mantém a ligação circunstancial do particípio aoristo com o verbo principal.
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: encontrou-os ... dormindo
  rationale: Preserva o aspecto verbal e contínuo de καθεύδοντας em português corrente.
- source_word: ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ καταβαρυνόμενοι
  choice: pois os olhos deles estavam pesados
  rationale: Conserva a imagem grega de olhos oprimidos pelo sono em uma formulação idiomática e clara; a nuance mais literal é indicada na nota.
- source_word: οὐκ ᾔδεισαν
  choice: eles não sabiam
  rationale: Traduz diretamente a ideia de não saber, sem substituí-la por falta de compreensão.
- source_word: τί ἀποκριθῶσιν αὐτῷ
  choice: o que lhe responder
  rationale: Forma natural em português para a pergunta indireta, mantendo Jesus como destinatário da resposta.
