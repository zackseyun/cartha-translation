  rationale: A revisão elimina a intensificação adicional de «nem», explicita naturalmente a duração indicada por μίαν ὥραν e desloca o marcador para a expressão grega efetivamente comentada. O restante da tradução preserva com fidelidade o presente histórico marcano, a repreensão singular dirigida a Simão e o contraste entre dormir e permanecer acordado.
