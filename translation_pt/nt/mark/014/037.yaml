    issue: «Nem uma hora» acrescenta ênfase não explicitamente presente.
    rationale: μίαν ὥραν é simplesmente «uma hora» como acusativo de duração. Embora a pergunta negativa tenha força repreensiva, «nem» pode acrescentar a noção de «nem sequer». «Por uma hora» preserva a duração sem essa amplificação.
  - severity: low
    issue: O marcador da nota está no fim da fala, não junto à expressão comentada.
    rationale: A nota trata da alternativa para γρηγορῆσαι; ancorá-la após «acordado» torna a referência lexical inequívoca.
