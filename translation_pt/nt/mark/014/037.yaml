  text: καὶ ἔρχεται καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Σίμων, καθεύδεις; οὐκ ἴσχυσας μίαν ὥραν γρηγορῆσαι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/037.yaml
  text: And he comes and finds them sleeping[a], and he says to Peter, “Simon, are you sleeping? Were you not able to stay awake one hour?”
translation:
  language: pt
  text: 'E ele vem, encontra-os dormindo e diz a Pedro: “Simão, você está dormindo? Não conseguiu ficar acordado[a] por uma hora?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não conseguiu vigiar por uma hora?”'
    reason: Alternativa lexical para γρηγορῆσαι, que pode significar permanecer acordado ou manter-se vigilante.
lexical_decisions:
- source_word: ἔρχεται
  choice: vem
  rationale: Mantém o presente histórico de Marcos, que confere vivacidade à narrativa e é natural neste contexto em português.
- source_word: εὑρίσκει
  choice: encontra
  rationale: Preserva o presente histórico e traduz diretamente a ação de achar os discípulos dormindo.
- source_word: καθεύδοντας
  choice: dormindo
  rationale: O gerúndio expressa a ação em curso e conserva a força verbal do particípio grego.
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico em continuidade com “vem” e “encontra”.
- source_word: τῷ Πέτρῳ
  choice: a Pedro
  rationale: Forma portuguesa natural para o dativo que identifica o destinatário da fala.
- source_word: Σίμων
  choice: Simão
  rationale: Preserva o nome pessoal usado por Jesus, distinto da designação narrativa “Pedro”.
- source_word: καθεύδεις
  choice: você está dormindo?
  rationale: Expressa de modo atual e claro a pergunta direta no presente e a repreensão imediata.
- source_word: οὐκ ἴσχυσας
  choice: não conseguiu
  rationale: Neste contexto, ἰσχύω indica capacidade efetiva. “Não conseguiu” é natural em português e evita restringir a ideia à força física.
- source_word: μίαν ὥραν
  choice: nem uma hora
  rationale: O acusativo marca duração. “Nem” comunica naturalmente a força retórica da pergunta negativa, sem alterar sua substância.
- source_word: γρηγορῆσαι
  choice: ficar acordado
  rationale: O contraste imediato com dormir favorece o sentido concreto de permanecer desperto, embora o verbo também possa transmitir a ideia de vigiar.
theological_decisions:
- issue: Preservação dos presentes históricos de Marcos
  choice: 'Os verbos narrativos principais foram mantidos no presente: “vem”, “encontra” e “diz”.'
  alternative: 'Passá-los ao pretérito: “veio”, “encontrou” e “disse”.'
  rationale: O presente histórico reproduz a vivacidade característica da narrativa de Marcos sem causar estranheza excessiva em português.
- issue: Sentido de γρηγορέω no contexto
  choice: “ficar acordado”
  alternative: “vigiar” ou “manter-se vigilante”
  rationale: A oposição direta a “dormindo” torna a vigília física o sentido mais imediato. A nota preserva a alternativa lexical e sua nuance de vigilância.
- issue: Força de οὐκ ἴσχυσας
  choice: “não conseguiu”
  alternative: “não teve forças” ou “não foi capaz”
  rationale: A formulação comunica incapacidade contextual sem impor a ideia mais específica de falta de força física.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “você” torna explícito o singular da repreensão dirigida a Simão. A coordenação foi levemente enxugada para soar natural em português, enquanto os presentes históricos foram preservados.
