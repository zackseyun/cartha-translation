review_pass:
  verdict: revise
  source_fidelity: Os presentes históricos em «vem», «encontra» e «diz» refletem adequadamente ἔρχεται, εὑρίσκει e λέγει. «Dormindo», «Simão», «você está dormindo?» e «não conseguiu ficar acordado» transmitem bem os elementos gregos e conservam a distinção entre Pedro na narração e Simão na interpelação. Contudo, «nem uma hora» explicita uma intensificação (‘nem sequer’) que não está marcada no grego; a duração simples deve ser mantida.
  naturalness: A redação é clara e natural em português moderno. «Você» é compreensível e especialmente legível para brasileiros, sem prejudicar de modo relevante a compreensão internacional. «Por uma hora» torna explícita e idiomática a duração de μίαν ὥραν.
  terminology: «Vigiar» é uma alternativa lexical válida para γρηγορῆσαι neste contexto, e a nota a apresenta sem substituir indevidamente o sentido concreto primário de permanecer acordado. O marcador deve ser colocado junto de «ficar acordado», termo ao qual a nota se refere.
  issues:
