  text: Então eles lançaram as mãos sobre ele[a] e o prenderam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “puseram as mãos nele”. A expressão grega é um idiomatismo para tomar alguém à força, muitas vezes a fim de prendê-lo.'
