lexical_decisions:
- source_word: οἱ δὲ
  choice: Então eles
  rationale: O artigo funciona substantivamente, com o sentido de “eles”, e δέ assinala uma transição narrativa leve. “Então” expressa naturalmente a progressão sem introduzir contraste forte.
- source_word: ἐπέβαλαν τὰς χεῖρας αὐτῷ
  choice: puseram as mãos nele
  rationale: A expressão idiomática indica lançar ou pôr as mãos sobre alguém, aqui com intenção hostil. A formulação preserva a imagem concreta sem confundi-la com a imposição de mãos em sentido religioso.
- source_word: ἐκράτησαν αὐτόν
  choice: o agarraram
  rationale: κρατέω descreve tomar e manter alguém sob controle. “Agarraram” comunica a ação física e enérgica, enquanto “prenderam” explicitaria o sentido contextual de detenção.
