id: MRK.14.61
reference: Mark 14:61
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ἐσιώπα καὶ ⸂οὐκ ἀπεκρίνατο οὐδέν⸃. πάλιν ὁ ἀρχιερεὺς ἐπηρώτα αὐτὸν καὶ λέγει αὐτῷ· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ εὐλογητοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/061.yaml
  text: But he kept silent and answered nothing[a]. Again the high priest questioned him and says to him, “Are you the Messiah[b], the Son of the Blessed One?”
translation:
  language: pt
  text: 'Mas ele permanecia calado e não respondeu nada. Novamente, o sumo sacerdote o interrogava e lhe diz: “Você é o Messias[a], o Filho do Bendito[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cristo”. O título grego é Χριστός (Christós), aqui traduzido como “Messias” porque funciona como título em um contexto messiânico judaico.
    reason: alternative_reading
  - marker: b
    text: “O Bendito” é uma maneira reverente judaica de se referir a Deus.
    reason: cultural_note
lexical_decisions:
- source_word: ἐσιώπα
  choice: permanecia calado
  rationale: O imperfeito apresenta o silêncio de Jesus como contínuo; a formulação é natural em português e preserva esse aspecto.
- source_word: οὐκ ἀπεκρίνατο οὐδέν
  choice: não respondeu nada
  rationale: Reproduz de modo idiomático e enfático a negação total expressa no grego.
- source_word: πάλιν
  choice: Novamente
  rationale: Marca claramente a repetição do interrogatório.
- source_word: ἀρχιερεὺς
  choice: sumo sacerdote
  rationale: É a designação portuguesa tradicional e precisa para o principal ofício sacerdotal judaico neste contexto.
- source_word: ἐπηρώτα
  choice: interrogava
  rationale: O imperfeito sugere ação continuada ou repetida, e “interrogava” se ajusta ao contexto judicial sem exagerar sua força.
- source_word: λέγει
  choice: lhe diz
  rationale: Mantém o presente histórico característico da narrativa vívida de Marcos, apesar da mudança de tempo verbal.
- source_word: χριστός
  choice: Messias
  rationale: Aqui funciona como título judaico messiânico, não como nome próprio; “Messias” torna essa função explícita sem acrescentar interpretação.
- source_word: ὁ υἱὸς τοῦ εὐλογητοῦ
  choice: o Filho do Bendito
  rationale: Preserva a forma reverente e indireta de referência a Deus, em vez de substituí-la pela palavra “Deus”.
theological_decisions:
- issue: Tradução de Χριστός como título messiânico
  choice: Messias
  alternative: Cristo
  rationale: No interrogatório do sumo sacerdote, o termo é um título ligado à expectativa messiânica judaica; “Messias” preserva melhor essa função contextual.
- issue: Tradução de τοῦ εὐλογητοῦ
  choice: do Bendito
  alternative: de Deus
  rationale: A expressão grega é uma maneira reverente de se referir a Deus. Manter “o Bendito” conserva a formulação indireta e a textura judaica do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Você” comunica naturalmente a segunda pessoa singular neste diálogo. O presente histórico em “lhe diz” foi mantido para preservar a vivacidade estilística de Marcos; “o Bendito” conserva deliberadamente a expressão reverencial do original.
