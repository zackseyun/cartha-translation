  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ὁ παραδιδούς με ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/042.yaml
  text: Get up; let us go. Look[a], the one betraying me has come near.
translation:
  language: pt
  text: 'Levantem-se, vamos! Vejam: aquele que me trai[a] já está perto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “me entrega”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Levantem-se
  rationale: O imperativo plural, neste contexto, chama os discípulos a se erguerem e agirem; “Levantem-se” é natural e não limita o sentido a despertar do sono.
- source_word: ἄγωμεν
  choice: vamos
  rationale: O subjuntivo hortativo de primeira pessoa do plural é expresso de modo idiomático e direto por “vamos”.
- source_word: ἰδού
  choice: Vejam
  rationale: A interjeição chama a atenção dos discípulos para a aproximação imediata de Judas. “Vejam” preserva essa força em português atual.
- source_word: ὁ παραδιδούς
  choice: aquele que me trai
  rationale: O particípio substantivado designa quem está entregando Jesus. No contexto narrativo, “trai” comunica naturalmente a deslealdade de Judas, enquanto a nota preserva o sentido mais literal de entregar.
- source_word: με
  choice: me
  rationale: Pronome objeto que se refere a Jesus.
- source_word: ἤγγικεν
  choice: já está perto
  rationale: O perfeito indica que a aproximação ocorreu e produziu a situação presente. “Já está perto” transmite tanto a aproximação concluída quanto sua relevância imediata.
theological_decisions:
- issue: Sentido de παραδίδωμι no relato da paixão
  choice: trai
  alternative: entrega
  rationale: “Trai” expressa com clareza a dimensão relacional e moral presente na ação de Judas, sem apagar o sentido concreto de “entregar”, que é mantido em nota como alternativa mais literal.
translation_notes:
  register: Português moderno, claro e digno, com formas plurais naturais para a fala dirigida aos discípulos. A pontuação mantém a urgência da cena, e “já está perto” reproduz de modo idiomático o valor resultativo do perfeito grego.
