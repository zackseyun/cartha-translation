  terminology: «Templo», com nota que especifica o complexo/recinto, corresponde bem a ἱερόν. «Escrituras» com inicial maiúscula é o termo consagrado e apropriado para αἱ γραφαί neste contexto. «Prenderam» é adequado no contexto narrativo, e a nota lexical evita que a opção contextual seja tratada como o único sentido possível.
