  text: καθ’ ἡμέραν ἤμην πρὸς ὑμᾶς ἐν τῷ ἱερῷ διδάσκων καὶ οὐκ ἐκρατήσατέ με· ἀλλ’ ἵνα πληρωθῶσιν αἱ γραφαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/049.yaml
  text: Day after day I was with you in the temple[a], teaching, and you did not seize me[c][b]. But let the Scriptures be fulfilled.
translation:
  language: pt
  text: Dia após dia, eu estava com vocês no templo[a], ensinando, e vocês não me prenderam[b]. Mas isso aconteceu para que se cumprissem as Escrituras.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Templo” aqui se refere ao conjunto ou recinto do templo, não apenas ao santuário interior.
    reason: cultural_note
  - marker: b
    text: 'Ou: “não me agarraram” ou “não se apoderaram de mim”.'
    reason: lexical_alternative
  - marker: c
    text: 'Mais literalmente: “Mas para que se cumprissem as Escrituras”. O grego é elíptico e deixa implícita a oração principal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Dia após dia
  rationale: Expressa de modo natural o sentido distributivo e reiterado de “cada dia”, preservando a ênfase na presença pública e contínua de Jesus.
- source_word: ἤμην πρὸς ὑμᾶς
  choice: eu estava com vocês
  rationale: Traduz naturalmente a presença de Jesus junto aos seus interlocutores, sem acrescentar a ideia mais específica de estar “entre” eles.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: É a forma corrente em português; neste contexto, ἱερόν designa o conjunto ou recinto do templo, esclarecido em nota.
- source_word: διδάσκων
  choice: ensinando
  rationale: Mantém de forma concisa o particípio presente e a ideia da atividade contínua de Jesus.
- source_word: οὐκ ἐκρατήσατέ με
  choice: vocês não me prenderam
  rationale: No contexto da detenção de Jesus, “prender” comunica naturalmente o sentido de κρατέω, embora o verbo também possa significar “agarrar” ou “apoderar-se de”; essa amplitude é registrada em nota.
- source_word: ἀλλ’ ἵνα
  choice: Mas isso aconteceu para que
  rationale: O grego introduz uma oração elíptica de propósito ou resultado, sem declarar o verbo principal. A expressão suprida produz português completo e natural, e a elipse é explicitada em nota.
- source_word: πληρωθῶσιν
  choice: se cumprissem
  rationale: Reproduz o aoristo passivo do subjuntivo após ἵνα e concorda temporalmente com o verbo suprido “aconteceu”, sem transformar a frase em ordem ou permissão.
- source_word: αἱ γραφαί
  choice: as Escrituras
  rationale: Refere-se aos escritos sagrados de Israel; a forma consagrada com inicial maiúscula identifica esse referente.
theological_decisions:
- issue: Oração elíptica de propósito e cumprimento das Escrituras
  choice: Mas isso aconteceu para que se cumprissem as Escrituras.
  alternative: Mas para que se cumprissem as Escrituras.
  rationale: O grego deixa implícita a oração principal depois de ἀλλ’ ἵνα. Suprir “isso aconteceu” torna a frase idiomática em português e mantém a relação de propósito ou resultado, sem formular um determinismo mais forte do que o texto expressa. A alternativa mais literal é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Dia após dia” conserva a força reiterativa; “vocês” é natural no português brasileiro e amplamente inteligível. A frase final explicita discretamente a elipse grega, enquanto a nota preserva sua forma mais literal.
