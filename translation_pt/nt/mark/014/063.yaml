  text: ὁ δὲ ἀρχιερεὺς διαρρήξας τοὺς χιτῶνας αὐτοῦ λέγει· Τί ἔτι χρείαν ἔχομεν μαρτύρων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/063.yaml
  text: Then the high priest tore his garments and said[b][a], “What further need do we have of witnesses?”
translation:
  language: pt
  text: 'Então o sumo sacerdote rasgou suas vestes[a] e disse[b]: “Que necessidade ainda temos de testemunhas?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas túnicas”.
    reason: lexical_alternative
  - marker: b
    text: 'O grego emprega o presente histórico: “diz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεὺς
  choice: o sumo sacerdote
  rationale: Equivalente português consagrado e preciso para o ocupante singular do ofício que preside a audiência.
- source_word: διαρρήξας
  choice: rasgou
  rationale: Expressa de modo claro e atual a ação do particípio aoristo, sem arcaísmo nem explicação interpretativa do gesto.
- source_word: τοὺς χιτῶνας αὐτοῦ
  choice: suas vestes
  rationale: Mantém o plural e soa natural no contexto; evita especificar indevidamente que se tratava de vestes cerimoniais, embora χιτών possa designar mais precisamente uma túnica.
- source_word: λέγει
  choice: disse
  rationale: Adapta o presente histórico grego ao passado narrativo natural em português, registrando a forma original em nota.
- source_word: Τί ἔτι χρείαν ἔχομεν
  choice: Que necessidade ainda temos
  rationale: Preserva a estrutura interrogativa e o valor de ἔτι, que indica que testemunhas adicionais já não seriam necessárias.
- source_word: μαρτύρων
  choice: de testemunhas
  rationale: Reproduz naturalmente em português o genitivo dependente de χρείαν ἔχομεν.
theological_decisions:
- issue: Sentido do ato de rasgar as vestes
  choice: Narrar literalmente que o sumo sacerdote rasgou suas vestes, sem explicar o motivo.
  alternative: Explicitar que o gesto demonstrava indignação diante do que ele considerava blasfêmia.
  rationale: O versículo relata o ato e a fala, mas não interpreta expressamente o gesto; a tradução preserva essa contenção narrativa e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a concisão e a pergunta retórica do grego.
