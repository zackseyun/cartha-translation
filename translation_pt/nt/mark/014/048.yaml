review_pass:
  verdict: revise
  source_fidelity: A pergunta retórica, as armas e o propósito de prender Jesus foram bem transmitidos. Porém, «assaltante» é mais estreito e contemporaneamente pode sugerir especificamente quem comete um assalto; λῃστής abrange mais naturalmente um bandido/brigante violento, possivelmente um insurgente. «Jesus lhes respondeu» também representa de modo mais direto a fórmula ἀποκριθεὶς ... εἶπεν sem criar a ligação temporal explícita de «Então».
  naturalness: A redação é clara, moderna e apropriada ao registro narrativo. «Vocês saíram» é natural e reproduz melhor ἐξήλθατε («saíram/foram para fora») do que «vieram», sem prejudicar a fluência.
  terminology: «Bandido» é a opção principal mais ampla e idiomática para λῃστής neste contexto. A nota preserva, de forma não doutrinária, as alternativas «assaltante», «fora da lei» e «rebelde» e a possível conotação de brigante ou insurgente.
  issues:
