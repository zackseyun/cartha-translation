source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/048.yaml
  text: And Jesus answered and said to them[a], “Have you come out as against a robber, with swords and clubs, to arrest me?”
translation:
  language: pt
  text: 'Jesus lhes respondeu: “Vocês saíram com espadas e porretes para me prender, como se eu fosse um bandido[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “assaltante”, “fora da lei” ou “rebelde”; o termo grego pode designar um bandido violento ou insurgente, e não apenas um ladrão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: Então Jesus lhes disse
  rationale: A fórmula narrativa introduz uma fala em resposta à ação dos que vieram prendê-lo. Em português atual, “lhes disse” evita o redundante e pouco natural “respondendo, disse”, enquanto “Então” mantém a ligação narrativa.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: como se eu fosse um assaltante
  rationale: A construção apresenta o tratamento dado a Jesus como se ele fosse um criminoso perigoso contra quem seria necessária uma expedição armada. A formulação é natural em português e mantém o caráter retórico da pergunta.
- source_word: λῃστὴν
  choice: assaltante
  rationale: “Assaltante” comunica um criminoso violento com mais precisão contextual do que “ladrão”, que pode sugerir apenas furto. Como λῃστής também pode designar bandido ou insurgente, essa amplitude é registrada em nota.
- source_word: ἐξήλθατε
  choice: Vocês vieram
  rationale: No contexto, o verbo descreve a ida do grupo até Jesus para prendê-lo. “Vieram” é a forma idiomática em português a partir da perspectiva de quem os recebe.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: com espadas e porretes
  rationale: “Espadas” é a equivalência contextual usual de μάχαιραι; “porretes” expressa que os objetos de madeira eram levados como armas, não meros pedaços de pau.
- source_word: συλλαβεῖν με
  choice: para me prender
  rationale: O infinitivo indica o propósito da ação, e “prender” comunica naturalmente a detenção pretendida neste contexto.
theological_decisions:
- issue: Amplitude semântica de λῃστής na pergunta retórica sobre Jesus
  choice: assaltante no texto principal, com a nuance mais ampla em nota
  alternative: bandido, fora da lei ou rebelde
  rationale: O termo pode apontar para um criminoso violento ou até um insurgente, e não apenas para um ladrão. O texto principal usa uma expressão clara e corrente sem eliminar a possível dimensão político-insurgente, que permanece explicitada na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Vocês” corresponde ao plural αὐτοῖς/ἐξήλθατε sem regionalismo excessivo; a ordem da frase foi ajustada para preservar a força retórica em português.
