    issue: «assaltante» restringe indevidamente λῃστής.
    rationale: Embora possível, «assaltante» em português tende a evocar um autor de assalto e não cobre tão bem o campo de bandido/brigante violento, por vezes insurgente, que o grego pode ter.
  - severity: low
    issue: «Então» explicita uma relação temporal não marcada de modo específico pelo καί.
    rationale: A conjunção pode simplesmente dar continuidade narrativa. «Jesus lhes respondeu» é conciso, natural e conserva melhor a força responsiva do particípio ἀποκριθείς.
