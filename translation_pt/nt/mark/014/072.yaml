  text: καὶ ⸀εὐθὺς ἐκ δευτέρου ἀλέκτωρ ἐφώνησεν· καὶ ἀνεμνήσθη ὁ Πέτρος τὸ ῥῆμα ⸀ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Πρὶν ἀλέκτορα ⸂φωνῆσαι δὶς τρίς με ἀπαρνήσῃ⸃, καὶ ἐπιβαλὼν ἔκλαιεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/072.yaml
  text: And immediately a rooster crowed a second time. And Peter remembered the word[a], how Jesus had said to him, “Before a rooster crows twice, you will deny me three times.” And breaking down, he wept.
translation:
  language: pt
  text: 'E imediatamente um galo cantou pela segunda vez. Então Pedro se lembrou da palavra, de como Jesus lhe havia dito: “Antes que um galo cante duas vezes, você me negará três vezes.” E, desabando[a], chorava.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao pensar nisso, chorava”. O sentido do particípio grego ἐπιβαλών é incerto; ele também tem sido entendido como referência a um gesto físico, como cobrir a cabeça.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Preserva o sentido temporal e a urgência característica da narrativa de Marcos.
- source_word: ἐκ δευτέρου
  choice: pela segunda vez
  rationale: Expressa de maneira natural e explícita a segunda ocorrência.
- source_word: ἀλέκτωρ / ἐφώνησεν
  choice: um galo cantou
  rationale: É a combinação idiomática corrente em português para o som emitido pelo galo.
- source_word: ἀνεμνήσθη
  choice: se lembrou
  rationale: Verte naturalmente o aoristo de sentido depoente no contexto narrativo.
- source_word: τὸ ῥῆμα
  choice: da palavra
  rationale: Mantém proximidade formal com ῥῆμα; a oração seguinte esclarece o conteúdo da palavra.
- source_word: ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: de como Jesus lhe havia dito
  rationale: Representa ὡς sem eliminar sua nuance e usa o mais-que-perfeito composto para situar a fala antes da lembrança.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι δὶς
  choice: Antes que um galo cante duas vezes
  rationale: A oração temporal com subjuntivo é natural em português; o artigo indefinido não sugere um galo previamente identificado.
- source_word: τρίς με ἀπαρνήσῃ
  choice: você me negará três vezes
  rationale: “Negar” preserva o sentido relacional de repudiar ou declarar não conhecer Jesus e é amplamente compreensível.
- source_word: ἐπιβαλών
  choice: desabando
  rationale: O particípio é difícil e admite diversas interpretações. “Desabando” comunica o colapso emocional provável sem especificar um gesto físico incerto.
- source_word: ἔκλαιεν
  choice: chorava
  rationale: O imperfeito português preserva o aspecto contínuo do imperfeito grego e mantém um registro natural e digno.
theological_decisions:
- issue: Interpretação do particípio difícil ἐπιβαλών
  choice: “desabando”, com nota de transparência
  alternative: “ao pensar nisso”; “cobrindo a cabeça”; ou alguma forma que indique um gesto físico
  rationale: A expressão afeta a representação da reação de Pedro, mas o grego não identifica com segurança uma ação mental ou gesto físico específico. A tradução principal comunica o colapso emocional contextual, enquanto a nota preserva a incerteza lexical.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Você” evita solenidade artificial; “chorava” conserva o aspecto contínuo. A repetição de “vez/vezes” acompanha a contagem enfática do original.
