id: MRK.14.25
reference: Mark 14:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐκέτι οὐ μὴ πίω ἐκ τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω καινὸν ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/025.yaml
  text: Truly I tell you[c][b][a], I will certainly not drink again from the fruit of the vine until that day when I drink it new in the kingdom of God.
translation:
  language: pt
  text: 'Em verdade lhes digo: certamente não voltarei a beber[a] do fruto da videira[b] até aquele dia em que o beberei novo[c] no Reino de Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «nunca mais beberei». O grego emprega uma negação enfática.'
    reason: lexical_alternative
  - marker: b
    text: «Fruto da videira» é a expressão grega; refere-se aqui à bebida proveniente da videira usada na ceia.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «de novo». O adjetivo grego significa «novo» e pode sugerir a novidade escatológica.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Em verdade
  rationale: Na fórmula solene ἀμὴν λέγω ὑμῖν, «Em verdade lhes digo» comunica com clareza e dignidade a força asseverativa, sendo mais transparente no português corrente do que a simples transliteração «Amém».
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Preserva a declaração direta dirigida ao grupo e soa natural em português moderno.
- source_word: οὐκέτι οὐ μὴ πίω
  choice: certamente não voltarei a beber
  rationale: «Não voltarei a beber» expressa οὐκέτι, enquanto «certamente» conserva a força da negação futura enfática οὐ μή sem produzir uma construção artificial em português.
- source_word: ἐκ τοῦ γενήματος τῆς ἀμπέλου
  choice: do fruto da videira
  rationale: Mantém a expressão metafórica do grego e evita especificar «vinho», termo que o texto não emprega diretamente, embora o contexto se refira à bebida da ceia.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: até aquele dia
  rationale: Reproduz de maneira direta tanto a relação temporal quanto a ênfase demonstrativa de ἐκείνης.
- source_word: ὅταν
  choice: em que
  rationale: Ligado a «aquele dia», «em que» exprime naturalmente o momento futuro singular em vista; evita a possível ideia iterativa de «sempre que».
- source_word: αὐτὸ
  choice: o
  rationale: O pronome retoma naturalmente aquilo que se bebe, isto é, o fruto da videira mencionado antes.
- source_word: πίνω
  choice: beberei
  rationale: O presente do subjuntivo grego depois de ὅταν tem referência futura; o futuro do indicativo é a forma mais natural de expressá-la nesta construção portuguesa.
- source_word: καινὸν
  choice: novo
  rationale: Traduz diretamente a ideia de novidade sem decidir se se trata de algo novo em qualidade ou de beber novamente no banquete futuro.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: no Reino de Deus
  rationale: Preserva a formulação neotestamentária tradicional e seu peso teológico sem paráfrase interpretativa.
theological_decisions:
- issue: Sentido de καινὸν na oração final
  choice: «novo», sem definir a natureza da novidade
  alternative: «de novo» ou «renovado»
  rationale: O adjetivo pode indicar novidade qualitativa e também admitir, no contexto, a ideia de beber novamente. A tradução conserva essa tensão escatológica sem explicar além do que o grego afirma.
- issue: Referente de «fruto da videira»
  choice: Conservar a expressão «fruto da videira»
  alternative: «vinho»
  rationale: Embora o contexto identifique a expressão com a bebida da ceia, o grego não usa diretamente o termo «vinho». A formulação original evita uma especificação indevida.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem da frase foi ajustada ao uso natural do português, mantendo a declaração enfática, a imagem «fruto da videira» e a ambiguidade de «novo».
