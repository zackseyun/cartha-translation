  source_fidelity: A tradução reproduz com precisão a fórmula solene «Em verdade lhes digo», a dupla negação enfática com οὐκέτι («certamente não voltarei a beber»), a expressão não especificada «fruto da videira», o marco temporal demonstrativo e a oração futura introduzida por ὅταν. «O beberei novo» mantém de modo deliberadamente literal a predicação de καινόν sobre a bebida, sem resolver se a ideia é novidade qualitativa ou beber novamente.
