id: MRK.14.9
reference: Mark 14:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀμὴν ⸀δὲ λέγω ὑμῖν, ὅπου ⸀ἐὰν κηρυχθῇ τὸ ⸀εὐαγγέλιον εἰς ὅλον τὸν κόσμον, καὶ ὃ ἐποίησεν αὕτη λαληθήσεται εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/009.yaml
  text: Truly I tell you[a], wherever the good news is proclaimed in the whole world[b], what this woman has done will also be spoken of in memory of her.
translation:
  language: pt
  text: 'Em verdade lhes digo: onde quer que as boas-novas sejam proclamadas em todo o mundo, também será contado o que esta mulher fez, em memória dela.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como memorial dela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Em verdade
  rationale: Introduz uma declaração solene e enfática de Jesus em linguagem digna e corrente, sem deixar a forma semítica sem tradução.
- source_word: δὲ
  choice: implícito no fluxo
  rationale: A partícula é um conectivo leve; uma conjunção explícita tornaria a frase menos natural em português.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Forma idiomática que preserva a primeira pessoa e o endereço plural.
- source_word: ὅπου ἐὰν
  choice: onde quer que
  rationale: Expressa de modo natural a generalidade indefinida da construção grega.
- source_word: κηρυχθῇ
  choice: sejam proclamadas
  rationale: Preserva o sentido de anúncio público de κηρύσσω; o plural concorda naturalmente com “boas-novas” em português.
- source_word: τὸ εὐαγγέλιον
  choice: as boas-novas
  rationale: Comunica o sentido lexical de uma notícia boa e mantém o caráter reconhecível da expressão cristã.
- source_word: εἰς ὅλον τὸν κόσμον
  choice: em todo o mundo
  rationale: Expressão portuguesa natural para o amplo alcance espacial indicado pelo grego.
- source_word: καὶ
  choice: também
  rationale: 'Explicita a força aditiva: juntamente com a proclamação das boas-novas, o feito da mulher será contado.'
- source_word: ὃ ἐποίησεν αὕτη
  choice: o que esta mulher fez
  rationale: O demonstrativo feminino aponta para a mulher do contexto; explicitar “mulher” torna o referente claro sem acrescentar interpretação.
- source_word: λαληθήσεται
  choice: será contado
  rationale: No contexto, indica que o feito será narrado ou mencionado; “será contado” é idiomático e preserva a voz passiva.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: em memória dela
  rationale: Expressa com naturalidade a finalidade memorial da locução grega.
theological_decisions:
- issue: Tradução de εὐαγγέλιον na promessa de proclamação mundial
  choice: as boas-novas
  alternative: o evangelho
  rationale: “Boas-novas” torna transparente o sentido lexical sem excluir o uso cristão mais técnico de “evangelho”; não há necessidade de impor uma nuance denominacional.
- issue: Sentido de εἰς μνημόσυνον αὐτῆς
  choice: em memória dela
  alternative: como memorial dela
  rationale: A formulação principal é clara e corrente; a alternativa conserva mais diretamente a forma nominal μνημόσυνον. Nenhuma delas define além do texto a natureza ou prática desse memorial.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Em verdade” mantém a solenidade da fórmula; “boas-novas” prioriza transparência lexical; “será contado” evita restringir λαλέω a uma modalidade formal de pregação.
