source:
  edition: SBLGNT
  text: ἠδύνατο γὰρ τοῦτο ⸂τὸ μύρον⸃ πραθῆναι ἐπάνω ⸂δηναρίων τριακοσίων⸃ καὶ δοθῆναι τοῖς πτωχοῖς· καὶ ἐνεβριμῶντο αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/005.yaml
  text: For this perfume could have been sold for more than three hundred denarii and given to the poor.” And they scolded her[a][b].
translation:
  language: pt
  text: Pois este perfume poderia ter sido vendido por mais de trezentos denários, e o dinheiro dado aos pobres”. E a repreendiam severamente[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “óleo perfumado” ou “unguento aromático”, em vez de “perfume”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a censuravam duramente”. O verbo grego transmite forte desagrado ou repreensão severa.
    reason: lexical_alternative
lexical_decisions:
- source_word: μύρον
  choice: perfume
  rationale: Refere-se a uma substância aromática, em forma de óleo ou unguento. “Perfume” é natural e claro em português moderno, enquanto a nota preserva as alternativas mais concretas.
- source_word: πραθῆναι
  choice: ter sido vendido
  rationale: O infinitivo passivo, combinado com ἠδύνατο, expressa uma possibilidade passada que não se realizou; “poderia ter sido vendido” reproduz essa força idiomaticamente.
- source_word: ἐπάνω
  choice: por mais de
  rationale: Com o genitivo de valor, indica uma quantia superior ao número mencionado.
- source_word: δηναρίων τριακοσίων
  choice: trezentos denários
  rationale: A transliteração preserva a moeda histórica sem impor uma equivalência moderna imprecisa.
- source_word: δοθῆναι τοῖς πτωχοῖς
  choice: o dinheiro dado aos pobres
  rationale: O grego diz literalmente que poderia ser “dado aos pobres”; explicitar “o dinheiro” torna claro, em português, que se trata do produto da venda, sem alterar o sentido.
- source_word: ἐνεβριμῶντο αὐτῇ
  choice: a repreendiam severamente
  rationale: O verbo comunica forte desagrado expresso contra a mulher e censura enérgica; esta formulação preserva tanto a ação verbal quanto sua intensidade.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a justificativa da reclamação anterior e mantém de modo conciso a conexão explicativa.
- source_word: ἠδύνατο
  choice: poderia ter sido
  rationale: Neste contexto, o imperfeito expressa uma possibilidade passada não concretizada.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para esclarecer que aquilo que seria dado aos pobres era o dinheiro obtido com a venda. As duas notas registram a amplitude lexical sem sobrecarregar o texto principal.
