id: MRK.14.27
reference: Mark 14:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς ὁ Ἰησοῦς ὅτι Πάντες ⸀σκανδαλισθήσεσθε, ὅτι γέγραπται· Πατάξω τὸν ποιμένα, καὶ ⸂τὰ πρόβατα διασκορπισθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/027.yaml
  text: 'And Jesus says to them[a], “You will all fall away, because it is written: ‘I will strike the shepherd, and the sheep will be scattered.’”'
translation:
  language: pt
  text: 'E Jesus lhes diz: “Todos vocês tropeçarão[a], pois está escrito: ‘Ferirei o pastor, e as ovelhas serão dispersas.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serão levados a tropeçar”. Aqui, o tropeço implica falhar em relação a Jesus e abandoná-lo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico de Marcos, que confere vivacidade à narrativa, e corresponde diretamente à forma presente grega.
- source_word: σκανδαλισθήσεσθε
  choice: tropeçarão
  rationale: Preserva a metáfora e a ambiguidade do verbo grego, cujo passivo pode indicar que os discípulos serão levados a tropeçar; no contexto, o tropeço se manifesta em abandono e dispersão.
- source_word: γέγραπται
  choice: está escrito
  rationale: Fórmula portuguesa consagrada para introduzir uma citação autorizada das Escrituras, refletindo o perfeito passivo grego.
- source_word: Πατάξω
  choice: Ferirei
  rationale: Expressa de modo atual e digno o golpe contra o pastor, sem recorrer a vocabulário arcaico.
- source_word: ποιμένα
  choice: o pastor
  rationale: Tradução direta que conserva a imagem profética no singular definido.
- source_word: τὰ πρόβατα
  choice: as ovelhas
  rationale: Equivalente natural que mantém a metáfora do rebanho.
- source_word: διασκορπισθήσονται
  choice: serão dispersas
  rationale: Conserva a voz passiva, o tempo futuro e a imagem das ovelhas separadas após o pastor ser ferido.
theological_decisions:
- issue: Sentido de σκανδαλισθήσεσθε na reação dos discípulos a Jesus
  choice: tropeçarão
  alternative: se afastarão; serão levados a tropeçar; abandonarão a fé
  rationale: “Tropeçarão” preserva a metáfora do original e evita decidir se o termo designa apenas a deserção imediata ou uma ruptura espiritual mais ampla. A nota esclarece a força contextual e a possibilidade passiva sem impor apostasia definitiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O presente histórico “diz” e a fórmula “está escrito” foram preservados; a citação mantém paralelismo simples e solene.
