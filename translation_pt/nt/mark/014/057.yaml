lexical_decisions:
- source_word: καί
  choice: Então
  rationale: Conector narrativo natural em português, que dá continuidade à sequência dos acontecimentos sem acrescentar uma relação lógica forte.
- source_word: τινες
  choice: alguns
  rationale: Mantém a referência indefinida a certas pessoas não identificadas.
- source_word: ἀναστάντες
  choice: se levantaram
  rationale: Expressa de modo natural o particípio aoristo e se ajusta ao contexto formal de depoimento perante o conselho.
- source_word: ἐψευδομαρτύρουν
  choice: davam falso testemunho
  rationale: Preserva tanto o sentido forense de testemunhar falsamente quanto o aspecto imperfeito, que apresenta a ação em curso.
- source_word: κατ’ αὐτοῦ
  choice: contra ele
  rationale: Representa o valor adversativo de κατά com genitivo neste contexto judicial.
- source_word: λέγοντες
  choice: 'dizendo:'
  rationale: Introduz naturalmente o conteúdo do falso testemunho apresentado no versículo seguinte; os dois-pontos sinalizam a fala que segue.
