base_translation:
  language: en
  yaml_path: translation/nt/mark/014/002.yaml
  text: For they were saying[a], “Not during the feast, lest there be an uproar from the people.”
translation:
  language: pt
  text: 'Pois eles diziam: “Não durante a festa, para que não haja tumulto entre o povo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “provocado pelo povo”. O genitivo grego τοῦ λαοῦ pode indicar que o tumulto surgiria do povo ou que ocorreria entre o povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: eles diziam
  rationale: O imperfeito indica fala em andamento ou repetida; “diziam” preserva esse aspecto com naturalidade.
- source_word: γάρ
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e mantém a ligação argumentativa.
- source_word: Μὴ
  choice: Não
  rationale: 'Preserva a formulação negativa elíptica e incisiva: “Não [façamos isso] durante a festa”.'
- source_word: ἐν τῇ ἑορτῇ
  choice: durante a festa
  rationale: A preposição tem sentido temporal, e “festa” designa naturalmente o período festivo mencionado no contexto.
- source_word: μήποτε
  choice: para que não
  rationale: Expressa o resultado temido que eles pretendiam evitar, em português atual e claro.
- source_word: ἔσται
  choice: haja
  rationale: Após “para que não”, o presente do subjuntivo comunica de modo natural a possibilidade futura temida.
- source_word: θόρυβος
  choice: tumulto
  rationale: Denota agitação pública ruidosa e desordenada sem necessariamente indicar uma revolta de grande escala.
- source_word: τοῦ λαοῦ
  choice: entre o povo
  rationale: O genitivo admite tanto a ideia de tumulto surgido do povo como de tumulto ocorrido em seu meio; a opção principal é idiomática, e a alternativa de origem é preservada em nota.
