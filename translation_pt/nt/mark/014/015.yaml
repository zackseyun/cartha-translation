  terminology: As escolhas terminológicas são sóbrias e não denominacionais. A nota lexical apresenta de modo adequado a alternativa «sala superior» e esclarece que ἐστρωμένον pode referir-se à disposição/preparação do ambiente, não apenas ao mobiliário.
