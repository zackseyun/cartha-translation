  source_fidelity: 'O texto traduz todos os elementos relevantes: αὐτὸς é adequadamente enfatizado em «ele mesmo»; ὑμῖν, em «a vocês»; ἀνάγαιον μέγα, em «uma grande sala no andar de cima»; os dois particípios, em «arrumada e pronta»; e o imperativo plural ἑτοιμάσατε ἡμῖν, em «preparem ali para nós». A elipse do objeto de «preparem» é igualmente presente e contextualizável no grego, sem introduzir interpretação indevida.'
