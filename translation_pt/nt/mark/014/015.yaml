  text: καὶ αὐτὸς ὑμῖν δείξει ἀνάγαιον μέγα ἐστρωμένον ἕτοιμον· ⸀καὶ ἐκεῖ ἑτοιμάσατε ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/015.yaml
  text: And he himself will show you a large upper room[a], furnished and ready; prepare for us there.
translation:
  language: pt
  text: E ele mesmo mostrará a vocês uma grande sala no andar de cima[a], arrumada e pronta; preparem ali para nós.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma grande sala superior, equipada e pronta». O particípio ἐστρωμένον pode indicar uma sala disposta ou preparada, não apenas mobiliada.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: ele mesmo
  rationale: Preserva a ênfase do pronome grego, em vez de reduzi-lo a um simples «ele».
- source_word: δείξει
  choice: mostrará
  rationale: Equivalente natural do futuro de δείκνυμι; «a vocês» traduz ὑμῖν.
- source_word: ἀνάγαιον
  choice: sala no andar de cima
  rationale: Expressa com clareza atual uma sala situada na parte superior da casa; evita que «cenáculo» soe técnico ou arcaico.
- source_word: μέγα
  choice: grande
  rationale: Mantém diretamente a descrição de tamanho.
- source_word: ἐστρωμένον
  choice: arrumada
  rationale: O particípio pode indicar que a sala estava disposta ou preparada, talvez com os elementos necessários para a refeição, sem exigir a ideia estrita de mobiliário.
- source_word: ἕτοιμον
  choice: pronta
  rationale: Preserva o sentido de disponibilidade imediata e forma um par natural com «arrumada».
- source_word: ἐκεῖ
  choice: ali
  rationale: Advérbio locativo natural, apontando para a sala que acabara de ser mencionada.
- source_word: ἑτοιμάσατε
  choice: preparem
  rationale: Imperativo plural direto, adequado à ordem dada aos discípulos.
- source_word: ἡμῖν
  choice: para nós
  rationale: Traduz o dativo sem explicitar além do texto quem está incluído no grupo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Sala no andar de cima» comunica o referente de modo mais imediato que «cenáculo»; a nota preserva uma alternativa mais formal e a amplitude lexical de ἐστρωμένον.
