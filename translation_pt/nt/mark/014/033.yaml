- from: E leva consigo Pedro, Tiago e João, e começou a sentir-se profundamente angustiado e aflito.[a]
  to: E leva Pedro, Tiago e João consigo, e começou a ficar profundamente perturbado[a] e angustiado.
  rationale: A revisão melhora a ordem idiomática de «consigo», distingue com mais clareza os dois verbos gregos de sofrimento e posiciona a âncora da nota junto ao primeiro deles. Conserva o presente histórico, a progressão ingressiva e a intensidade emocional sem acrescentar explicação teológica.
