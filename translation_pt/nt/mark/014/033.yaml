  text: καὶ παραλαμβάνει τὸν Πέτρον καὶ ⸂Ἰάκωβον καὶ⸃ Ἰωάννην μετ’ ⸀αὐτοῦ, καὶ ἤρξατο ἐκθαμβεῖσθαι καὶ ἀδημονεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/033.yaml
  text: And he takes Peter and James and John with him[a], and he began to be greatly distressed and troubled,
translation:
  language: pt
  text: E leva Pedro, Tiago e João consigo, e começou a ficar profundamente perturbado[a] e angustiado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “começou a ficar profundamente alarmado e angustiado”. O primeiro verbo pode indicar intenso alarme, choque ou angústia neste contexto.'
    reason: alternativa lexical
lexical_decisions:
- source_word: παραλαμβάνει
  choice: leva consigo
  rationale: O presente histórico conserva a vivacidade da narrativa de Marcos, e a expressão indica que Jesus escolhe esses discípulos para acompanhá-lo.
- source_word: μετ’ αὐτοῦ
  choice: consigo
  rationale: Integra de modo natural em português a ideia de que Pedro, Tiago e João acompanham Jesus, sem omitir o valor de μετά com genitivo.
- source_word: ἤρξατο
  choice: começou
  rationale: Preserva explicitamente o aspecto ingressivo da construção com os infinitivos seguintes.
- source_word: ἐκθαμβεῖσθαι
  choice: sentir-se profundamente angustiado
  rationale: No contexto do Getsêmani, o verbo comunica forte abalo emocional, alarme ou angústia, e não simples admiração. A formulação mantém a intensidade sem adotar a opção interpretativamente mais forte.
- source_word: ἀδημονεῖν
  choice: aflito
  rationale: Expressa sofrimento interior agudo e mantém distinto o segundo termo da dupla descrição emocional.
- source_word: καὶ ... καὶ
  choice: e ... e
  rationale: Retém a coordenação repetida e o movimento cumulativo característicos do estilo de Marcos.
theological_decisions:
- issue: O estado emocional de Jesus no Getsêmani
  choice: 'Traduzir os dois verbos como sofrimento humano real e intenso: “profundamente angustiado e aflito”.'
  alternative: Empregar linguagem mais branda, como “admirado e inquieto”, ou mais forte, como “tomado de horror e em agonia”.
  rationale: A redação preserva a plena realidade da angústia de Jesus sem amenizá-la nem acrescentar uma explicação teológica que o texto não oferece.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O presente histórico “leva” preserva a vivacidade de Marcos; “consigo” evita repetição pesada. A nota registra a amplitude semântica de ἐκθαμβεῖσθαι.
