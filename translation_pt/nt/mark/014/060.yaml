  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἰς μέσον ἐπηρώτησεν τὸν Ἰησοῦν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/060.yaml
  text: And the high priest stood up in the middle and questioned Jesus[a], saying[c][b], “Do you answer nothing? What are these men testifying against you?”
translation:
  language: pt
  text: 'Então, o sumo sacerdote se levantou e foi para o meio[a] e perguntou a Jesus: “Você não responde nada?[b] O que estes[c] testemunham contra você?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi para o centro”. A expressão indica que o sumo sacerdote assumiu uma posição central diante da assembleia.
    reason: lexical_alternative
  - marker: b
    text: Ou “Você não dá nenhuma resposta?”
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “estes”; a forma grega é masculina plural e se refere às testemunhas presentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: se levantou
  rationale: Expressa de modo natural a ação física indicada pelo particípio aoristo de ἀνίστημι e preserva o movimento narrativo.
- source_word: ὁ ἀρχιερεὺς
  choice: o sumo sacerdote
  rationale: É a designação portuguesa corrente para o sacerdote que presidia a assembleia nesse contexto.
- source_word: εἰς μέσον
  choice: foi para o meio
  rationale: A preposição εἰς sugere movimento para uma posição central; a formulação explicita esse movimento em português sem linguagem arcaica.
- source_word: ἐπηρώτησεν
  choice: perguntou
  rationale: No contexto judicial, o verbo descreve uma pergunta incisiva. “Perguntou” é natural e não intensifica indevidamente o sentido como poderia fazer “interrogou”.
- source_word: ἀποκρίνῃ οὐδέν
  choice: Você não responde nada?
  rationale: Preserva a forma direta e desafiadora da pergunta grega em português corrente.
- source_word: οὗτοί
  choice: estes homens
  rationale: O demonstrativo masculino plural aponta para as testemunhas presentes; “homens” torna explícito o referente masculino.
- source_word: καταμαρτυροῦσιν
  choice: testemunham contra você
  rationale: Mantém tanto o valor presente do verbo quanto sua nuance jurídica de prestar testemunho contra alguém.
theological_decisions:
- issue: Referência masculina de οὗτοί
  choice: estes homens
  alternative: estes; estas pessoas
  rationale: O masculino plural refere-se às testemunhas masculinas específicas da cena, e não a um grupo humano genérico. A tradução preserva essa informação sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O tratamento por “você” mantém a fala direta natural. A ordem das perguntas e a tensão do confronto judicial foram preservadas.
