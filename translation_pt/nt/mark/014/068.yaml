  text: ὁ δὲ ἠρνήσατο λέγων· ⸂Οὔτε οἶδα οὔτε ἐπίσταμαι σὺ τί⸃ λέγεις, καὶ ἐξῆλθεν ἔξω εἰς τὸ προαύλιον ⸂καὶ ἀλέκτωρ ἐφώνησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/068.yaml
  text: But he denied it[a], saying, “I neither know nor understand what you are saying.” And he went out into the forecourt, and a rooster crowed.
translation:
  language: pt
  text: 'Mas ele negou, dizendo: “Não sei nem entendo o que você está dizendo”. Então saiu para o pátio de entrada, e um galo cantou[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos não trazem: “e um galo cantou”.'
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνήσατο
  choice: negou
  rationale: O verbo significa negar ou rejeitar uma alegação. Em português, o uso absoluto de “negou” é natural neste contexto e evita acrescentar um objeto não expresso no grego.
- source_word: Οὔτε οἶδα οὔτε ἐπίσταμαι
  choice: Não sei nem entendo
  rationale: Mantém a duplicação enfática dos dois verbos, distinguindo saber de entender em linguagem corrente.
- source_word: σὺ τί λέγεις
  choice: o que você está dizendo
  rationale: Tradução direta e natural, que preserva a referência explícita à fala da serva.
- source_word: ἐξῆλθεν ἔξω
  choice: saiu
  rationale: O verbo português já expressa adequadamente o movimento para fora; o destino subsequente esclarece para onde ele foi.
- source_word: προαύλιον
  choice: pátio de entrada
  rationale: Designa a área diante do pátio interior ou junto à entrada. “Pátio de entrada” comunica melhor essa nuance espacial ao leitor comum do que um termo técnico como “vestíbulo”.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: um galo cantou
  rationale: É a expressão idiomática corrente em português e representa naturalmente o substantivo grego sem artigo.
theological_decisions:
- issue: Inclusão da oração καὶ ἀλέκτωρ ἐφώνησεν
  choice: 'Incluída no texto principal: “e um galo cantou”.'
  alternative: Omitir a oração, conforme alguns manuscritos.
  rationale: O SBLGNT fornecido inclui a oração, embora assinale variação textual. A tradução segue o texto-base e registra a incerteza em nota, sem ocultá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a repetição enfática da negação de Pedro e evita explicitar um objeto que o grego deixa implícito. O marcador [a] foi colocado após a oração à qual se refere.
