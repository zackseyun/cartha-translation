  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀνακειμένων αὐτῶν καὶ ἐσθιόντων ⸂ὁ Ἰησοῦς εἶπεν⸃· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με ὁ ἐσθίων μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/018.yaml
  text: And while they were reclining and eating[a], Jesus said, “Truly I tell you[c][b], one of you will betray me—one who is eating with me.”
translation:
  language: pt
  text: 'Enquanto estavam reclinados à mesa[a] e comiam, Jesus disse: “Em verdade lhes digo[b]: um de vocês me trairá[c] — aquele que está comendo comigo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Reclinar-se era a postura habitual durante uma refeição formal.
    reason: cultural_note
  - marker: b
    text: 'Ou, mais literalmente: “Amém, digo a vocês”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “me entregará”. O verbo grego pode significar entregar, pôr nas mãos de alguém ou trair; aqui se refere à entrega traiçoeira feita por um dos próprios companheiros de Jesus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακειμένων
  choice: estavam reclinados à mesa
  rationale: O particípio descreve a postura costumeira nas refeições formais do antigo mundo mediterrâneo. A expressão preserva o cenário histórico, e «à mesa» esclarece naturalmente o contexto em português.
- source_word: ἐσθιόντων / ἐσθίων
  choice: comiam / está comendo
  rationale: 'O verbo significa simplesmente «comer». Na segunda ocorrência, a construção relativa reproduz o particípio grego com artigo: «aquele que está comendo comigo».'
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Em verdade lhes digo
  rationale: Esta fórmula solene de Jesus é apresentada em português corrente e digno. A alternativa mais literal com «Amém» é mantida em nota.
- source_word: εἷς ἐξ ὑμῶν
  choice: um de vocês
  rationale: Tradução idiomática da expressão partitiva, indicando claramente que se trata de alguém pertencente ao grupo.
- source_word: παραδώσει
  choice: me trairá
  rationale: Embora o verbo possa significar literalmente «entregar», neste contexto ele descreve a entrega traiçoeira de Jesus por um companheiro de mesa. A alternativa mais literal é registrada em nota.
- source_word: μετ’ ἐμοῦ
  choice: comigo
  rationale: Equivalente português direto e natural para a ideia de companhia.
theological_decisions:
- issue: Tradução de παραδώσει no anúncio da paixão
  choice: me trairá
  alternative: me entregará
  rationale: O verbo grego não significa sempre «trair», mas aqui a ação parte de um companheiro que compartilha a refeição com Jesus. «Trairá» comunica a deslealdade relacional sem acrescentar uma afirmação doutrinária; a tradução mais literal permanece disponível em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento «vocês/lhes» evita regionalismo excessivo; a formulação mantém solenidade sem arcaísmo. O travessão conserva a força explicativa da expressão final sem resolver além do grego a identidade do traidor.
