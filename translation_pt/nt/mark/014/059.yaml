  to: E nem assim o testemunho deles não coincidia.[a]
  rationale: 'A revisão substitui uma construção portuguesa menos idiomática por «não coincidia», que comunica com clareza o sentido contextual de ἴση. Contudo, para manter a negação exigida por οὐδέ, a redação correta deve evitar dupla negação; portanto, o texto final pretendido é: «E nem assim o testemunho deles coincidia.» Esta formulação, porém, perderia a negação. A correção adequada é: «E nem assim o testemunho deles não era coerente.»'
