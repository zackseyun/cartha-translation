base_translation:
  language: en
  yaml_path: translation/nt/mark/014/059.yaml
  text: And not even in this way was their testimony consistent[a].
translation:
  language: pt
  text: E nem assim o testemunho deles não coincidia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não estava de acordo”; mais literalmente: “não era igual”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a ligação narrativa com o relato anterior sobre os depoimentos conflitantes.
- source_word: οὐδὲ
  choice: nem
  rationale: 'Em combinação com «assim», expressa com naturalidade a negação enfática: nem mesmo desse modo houve concordância.'
- source_word: οὕτως
  choice: assim
  rationale: Retoma de modo conciso e natural a forma de acusação citada imediatamente antes.
- source_word: ἴση
  choice: de acordo
  rationale: Embora signifique literalmente «igual», no contexto judicial indica que os depoimentos não coincidiam entre si.
- source_word: ἦν
  choice: estava
  rationale: O imperfeito de εἰμί descreve a condição do testemunho naquele momento; «estava» é idiomático em português.
- source_word: ἡ μαρτυρία
  choice: o testemunho
  rationale: Preserva o singular coletivo do grego e o sentido judicial de depoimento ou testemunho.
- source_word: αὐτῶν
  choice: deles
  rationale: Reproduz naturalmente o genitivo possessivo plural sem explicitar além do texto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Estava de acordo» comunica o sentido jurídico contextual, enquanto a nota preserva a formulação mais literal e a alternativa idiomática.
