reference: Mark 14:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Αββα ὁ πατήρ, πάντα δυνατά σοι· παρένεγκε τὸ ποτήριον ⸂τοῦτο ἀπ’ ἐμοῦ⸃· ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/036.yaml
  text: And he was saying[a], “Abba, Father, all things are possible for you. Take this cup away from me. Yet not what I will[c][b], but what you will.”
translation:
  language: pt
  text: 'E ele dizia[a]: “Aba, Pai[b], tudo te é possível. Afasta de mim este cálice[c]. Contudo, não o que eu quero, mas o que tu queres.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “disse”. O imperfeito grego pode indicar fala repetida ou contínua: “dizia”.'
    reason: lexical_alternative
  - marker: b
    text: “Aba” é uma forma aramaica de tratamento usada para o pai; aqui ela é mantida junto da palavra grega traduzida como “Pai”.
    reason: cultural_note
  - marker: c
    text: “Cálice” é uma metáfora bíblica para o sofrimento que lhe estava destinado; compare Marcos 10:38.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito grego pode indicar fala contínua ou repetida. “Dizia” preserva naturalmente esse aspecto em português; a nota registra a alternativa pontual “disse”.
- source_word: Αββα ὁ πατήρ
  choice: Aba, Pai
  rationale: Mantém a forma aramaica de tratamento e verte a expressão grega explicativa como vocativo, sem acrescentar o possessivo “meu”, ausente do texto.
- source_word: πάντα δυνατά σοι
  choice: tudo te é possível
  rationale: Expressão corrente e digna em português que preserva o alcance abrangente e a construção com o dativo.
- source_word: παρένεγκε τὸ ποτήριον τοῦτο ἀπ’ ἐμοῦ
  choice: Afasta de mim este cálice
  rationale: Transmite o pedido imperativo para que o cálice seja removido, com ordem de palavras natural em português, preservando a metáfora de “cálice”.
- source_word: ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ
  choice: Contudo, não o que eu quero, mas o que tu queres
  rationale: Repõe na segunda oração o verbo elíptico para clareza. “Quero/queres” traduz θέλω em português moderno sem eliminar o contraste entre a vontade de Jesus e a do Pai.
theological_decisions:
- issue: Manutenção das formas aramaica e grega no modo como Jesus se dirige a Deus
  choice: Aba, Pai
  alternative: Aba, meu Pai
  rationale: O texto preserva a forma aramaica ao lado da explicação grega. Manter ambas segue a fonte e evita introduzir o possessivo “meu”, que não está explícito.
- issue: Força metafórica de ποτήριον
  choice: este cálice
  alternative: este sofrimento
  rationale: A imagem bíblica deve ser preservada em vez de substituída por sua interpretação. No contexto, aponta para o sofrimento destinado a Jesus, mas “cálice” mantém a tensão e as ressonâncias intertextuais.
- issue: Contraste entre as vontades expresso por θέλω
  choice: não o que eu quero, mas o que tu queres
  alternative: não seja o que eu quero, mas o que tu queres
  rationale: A tradução conserva a formulação elíptica e o contraste do grego sem inserir um imperativo como “seja”, que não aparece expressamente no texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “tu” para preservar o tratamento direto no singular e a distinção verbal entre Jesus e o Pai. Mantém “Aba” e “cálice” por sua importância textual e intertextual.
