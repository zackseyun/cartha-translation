source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι σὺ σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃ πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι τρίς ⸂με ἀπαρνήσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/030.yaml
  text: And Jesus says to him[a], “Truly I tell you, today, this very night, before a rooster crows twice, you will deny me three times.”
translation:
  language: pt
  text: 'E Jesus lhe diz: “Em verdade lhe digo: hoje, nesta mesma noite, antes que o galo cante duas vezes, você me negará três vezes.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico característico da narrativa de Marcos, sem normalizá-lo para o passado.
- source_word: Ἀμὴν λέγω σοι
  choice: Em verdade lhe digo
  rationale: Expressa em português atual a fórmula solene de afirmação e preserva o destinatário singular indicado por σοι.
- source_word: σήμερον ταύτῃ τῇ νυκτί
  choice: hoje, nesta mesma noite
  rationale: Conserva as duas expressões temporais do grego e comunica sua ênfase e imediatismo com naturalidade.
- source_word: δὶς ἀλέκτορα φωνῆσαι
  choice: o galo cante duas vezes
  rationale: Emprega a forma idiomática corrente em português, preservando a especificação marcana de dois cantos.
- source_word: τρίς με ἀπαρνήσῃ
  choice: você me negará três vezes
  rationale: Traduz diretamente a predição futura, mantém o objeto 'me' e preserva o contraste numérico entre duas e três vezes.
theological_decisions:
- issue: Combinação de σήμερον com ταύτῃ τῇ νυκτί
  choice: 'Manter ambas as expressões: “hoje, nesta mesma noite”'
  alternative: Condensar apenas como “esta noite”
  rationale: O texto grego contém as duas expressões; mantê-las preserva a intensidade temporal sem acrescentar interpretação.
- issue: Presente histórico em λέγει
  choice: “Jesus lhe diz”
  alternative: “Jesus lhe disse”
  rationale: O presente conserva um traço narrativo perceptível do texto de Marcos.
- issue: Força enfática do pronome explícito σὺ
  choice: Expressá-la pelo “você” antes de “me negará”
  alternative: Acrescentar “você” também antes das expressões temporais
  rationale: O pronome sujeito explícito é preservado, mas sem criar uma repetição pouco natural em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Lhe digo” conserva o singular do destinatário; “você” torna explícito o sujeito enfático sem recorrer ao regionalismo “tu”. A expressão idiomática “o galo cante” foi preferida à menos natural “um galo cante”.
