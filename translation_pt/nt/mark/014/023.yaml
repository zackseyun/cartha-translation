  text: καὶ ⸀λαβὼν ποτήριον εὐχαριστήσας ἔδωκεν αὐτοῖς, καὶ ἔπιον ἐξ αὐτοῦ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/023.yaml
  text: And taking a cup[a], after giving thanks he gave it to them, and they all drank from it.
translation:
  language: pt
  text: E, tomando um cálice[a], depois de dar graças, deu-o a eles, e todos beberam dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o cálice”. No grego, “cálice” aparece sem artigo, embora o contexto da refeição possa indicar um cálice específico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: tomando
  rationale: O particípio aoristo introduz uma ação anterior à entrega; “tomando” preserva de modo natural em português a sequência participial do grego.
- source_word: ποτήριον
  choice: um cálice
  rationale: O substantivo aparece sem artigo. “Um cálice” representa diretamente essa forma, enquanto o contexto da refeição ainda pode apontar para um cálice específico.
- source_word: εὐχαριστήσας
  choice: depois de dar graças
  rationale: O particípio aoristo indica ação anterior ao verbo principal. A expressão comunica claramente a sequência temporal e evita introduzir terminologia litúrgica posterior.
- source_word: ἔδωκεν αὐτοῖς
  choice: deu-o a eles
  rationale: O pronome “o” retoma naturalmente “cálice”, objeto subentendido no grego, sem acrescentar conteúdo estranho ao contexto.
- source_word: ἔπιον
  choice: beberam
  rationale: Equivalente corrente e direto do aoristo, adequado ao registro narrativo.
- source_word: ἐξ αὐτοῦ
  choice: dele
  rationale: O pronome grego retoma o substantivo neutro ποτήριον; em português, “dele” retoma com clareza “cálice” e expressa a ideia de beber a partir dele.
- source_word: πάντες
  choice: todos
  rationale: A colocação em “todos beberam dele” preserva a ênfase de que cada um dos presentes bebeu.
theological_decisions:
- issue: Possíveis conotações eucarísticas de εὐχαριστήσας
  choice: depois de dar graças
  alternative: depois de abençoá-lo; depois de pronunciar a ação de graças
  rationale: O verbo significa dar graças. Embora a passagem tenha importância sacramental na tradição cristã, a tradução não deve importar terminologia eclesial posterior nem transformar a ação de graças em bênção explícita do cálice.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Cálice” foi preferido a “copo” por ser natural no contexto de vinho e da refeição, sem recorrer a vocabulário litúrgico no verbo εὐχαριστέω.
