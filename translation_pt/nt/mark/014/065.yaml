  text: καὶ ἤρξαντό τινες ἐμπτύειν αὐτῷ καὶ περικαλύπτειν ⸂αὐτοῦ τὸ πρόσωπον⸃ καὶ κολαφίζειν αὐτὸν καὶ λέγειν αὐτῷ· Προφήτευσον, καὶ οἱ ὑπηρέται ῥαπίσμασιν αὐτὸν ⸀ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/065.yaml
  text: And some began to spit on him[a], and to cover his face, and to strike him with their fists, and to say to him[b], “Prophesy!” And the officers received him with blows.
translation:
  language: pt
  text: 'E alguns começaram a cuspir nele, a cobrir-lhe o rosto[a], a dar-lhe socos e a dizer-lhe: “Profetize!” E os guardas o receberam com golpes.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a vendar-lhe os olhos”. O grego diz literalmente “cobrir-lhe o rosto”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, de modo mais idiomático: “E os guardas o golpearam”. A expressão grega diz literalmente “o receberam com golpes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντό
  choice: começaram
  rationale: Preserva o aspecto ingressivo de ἄρχομαι com infinitivos e a progressão narrativa.
- source_word: τινες
  choice: alguns
  rationale: Representa de modo conciso o plural indefinido, sem identificar além do que o texto permite.
- source_word: ἐμπτύειν αὐτῷ
  choice: cuspir nele
  rationale: É a expressão idiomática natural em português para o dativo que indica o alvo direto da afronta.
- source_word: περικαλύπτειν αὐτοῦ τὸ πρόσωπον
  choice: cobrir-lhe o rosto
  rationale: Mantém a formulação concreta do grego sem explicitar como fato a função provável de vendar.
- source_word: κολαφίζειν αὐτὸν
  choice: dar-lhe socos
  rationale: κολαφίζω normalmente indica golpear com o punho; a expressão é clara e atual em português.
- source_word: λέγειν αὐτῷ· Προφήτευσον
  choice: 'dizer-lhe: “Profetize!”'
  rationale: Preserva a ordem zombeteira em sua forma breve, sem acrescentar objeto ou explicação.
- source_word: ὑπηρέται
  choice: guardas
  rationale: No contexto judicial, designa auxiliares subordinados com função de custódia; “guardas” é mais claro ao leitor comum do que “oficiais” ou “servidores”.
- source_word: ῥαπίσμασιν
  choice: com golpes
  rationale: Conserva a amplitude do substantivo, que pode indicar bofetadas ou outros golpes, sem precisão indevida.
- source_word: ἔλαβον
  choice: receberam
  rationale: Reproduz a construção marcante ῥαπίσμασιν αὐτὸν ἔλαβον; como ela é pouco usual em português moderno, a nota oferece a leitura idiomática.
theological_decisions:
- issue: Forma da ordem zombeteira Προφήτευσον no contexto da identidade de Jesus
  choice: “Profetize!”
  alternative: “Profetize para nós!” / “Mostre que é profeta!”
  rationale: O imperativo isolado mantém a ironia narrativa e a tensão cristológica sem introduzir palavras explicativas ausentes do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição coordenada conserva o ritmo cumulativo da agressão. “Dar-lhe socos” comunica com naturalidade a força específica de κολαφίζειν; “receberam com golpes” preserva deliberadamente a imagem incomum do grego, esclarecida em nota.
