review_pass:
  verdict: revise
  source_fidelity: O texto principal reproduz adequadamente a progressão ingressiva de ἤρξαντό, o sujeito indefinido τινες, a ação de cobrir o rosto, os golpes com os punhos (κολαφίζειν), a ordem breve «Profetize!» e a expressão final deliberadamente literal «o receberam com golpes».
  naturalness: O português é moderno e claro em geral. «O receberam com golpes» é propositalmente incomum, mas é compreensível e a nota oferece uma opção idiomática. A nota a, porém, contém «vendá-lo», que em português significa normalmente «vendê-lo» e não pode funcionar como alternativa para cobrir-lhe o rosto.
  terminology: «Guardas», «golpes» e «Profetize!» são escolhas adequadas ao contexto e não impõem interpretação teológica. Para a alternativa de περικαλύπτειν, «vendar-lhe os olhos» expressa a provável função sem substituir a redação literal no texto principal.
  issues:
  - severity: high
    issue: A nota a traz «a vendá-lo».
    rationale: Em português, «vendá-lo» significa vendê-lo; é uma forma lexicalmente incorreta neste contexto e introduz um sentido alheio ao grego. A alternativa adequada é «vendar-lhe os olhos» (ou «vendar o rosto»), mantendo claro que o texto principal diz literalmente cobrir o rosto.
  - severity: low
    issue: A alternativa na nota b usa o imperfeito «golpeavam».
    rationale: Como alternativa idiomática para o aoristo ἔλαβον, «o golpearam» preserva melhor a apresentação pontual/resumitiva da ação, sem pretender resolver de modo exclusivo a expressão idiomática grega.
