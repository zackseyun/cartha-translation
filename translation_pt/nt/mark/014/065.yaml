  to: 'E alguns começaram a cuspir nele, a cobrir-lhe o rosto[a], a dar-lhe socos e a dizer-lhe: “Profetize!” E os guardas o receberam com golpes.[b]'
  rationale: A única alteração necessária ao texto e às notas é corrigir a alternativa equivocada «vendá-lo» para «vendar-lhe os olhos» e ajustar o tempo verbal da alternativa idiomática da nota b. O texto principal é mantido, pois conserva a formulação literal e a ambiguidade da expressão final.
