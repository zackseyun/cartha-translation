  text: Καὶ ὀψίας γενομένης ἔρχεται μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/017.yaml
  text: And when evening came[a], he comes with the twelve.
translation:
  language: pt
  text: E, ao cair da tarde, ele chega com os doze.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com os Doze”, entendendo a expressão como uma designação reconhecida do grupo apostólico de Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Conjunção narrativa simples que preserva o estilo paratático característico de Marcos.
- source_word: ὀψίας γενομένης
  choice: ao cair da tarde
  rationale: Expressão temporal natural em português para o genitivo absoluto, indicando a chegada do período da tarde/noite sem rigidez literal.
- source_word: ἔρχεται
  choice: ele chega
  rationale: Mantém o presente histórico vívido do grego; “chega” também expressa naturalmente a chegada ao lugar pressuposto pelo contexto.
- source_word: μετὰ τῶν δώδεκα
  choice: com os doze
  rationale: μετά com genitivo indica companhia. A formulação concisa preserva a referência ao grupo apostólico sem acrescentar “discípulos” ou “apóstolos” ao texto.
theological_decisions:
- issue: Referência de “os doze”
  choice: A expressão designa o círculo dos doze seguidores escolhidos por Jesus, incluindo Judas neste ponto da narrativa.
  alternative: Explicitar “os doze discípulos” ou grafar “os Doze” como título reconhecido.
  rationale: O referente é claro no contexto, mas o texto grego não acrescenta “discípulos” nem “apóstolos”. A tradução mantém a concisão e evita explicitação interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O presente “chega” preserva o presente histórico de Marcos. A inicial minúscula em “os doze” favorece transparência lexical, enquanto a nota registra a possível leitura quase titular.
