  text: οἱ δὲ ἀκούσαντες ἐχάρησαν καὶ ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι. καὶ ἐζήτει πῶς ⸂αὐτὸν εὐκαίρως παραδοῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/011.yaml
  text: When they heard it[a], they rejoiced and promised to give him money[b]. And he began seeking how he might betray him at an opportune time.
translation:
  language: pt
  text: Quando ouviram isso, eles se alegraram e prometeram dar-lhe dinheiro[a]. E ele começou a procurar uma forma de traí-lo[b] no momento oportuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prata”. O termo grego pode designar literalmente o metal ou, de modo mais geral, dinheiro.
    reason: lexical_alternative
  - marker: b
    text: Ou “entregá-lo”. O verbo grego pode significar entregar alguém ou passá-lo às mãos de outros; aqui, “traí-lo” reflete o contexto da ação desleal de Judas.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀκούσαντες
  choice: Quando ouviram isso
  rationale: O particípio com δέ introduz a reação dos principais sacerdotes. “Quando ouviram isso” explicita naturalmente o valor temporal e retoma, sem acréscimo interpretativo, a proposta de Judas no contexto anterior.
- source_word: ἐχάρησαν
  choice: eles se alegraram
  rationale: Expressa a reação de alegria indicada pelo aoristo de χαίρω, preservando a força verbal e o tom moralmente marcante da narrativa.
- source_word: ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι
  choice: prometeram dar-lhe dinheiro
  rationale: ἐπαγγέλλομαι indica promessa ou compromisso, e ἀργύριον designa aqui de modo idiomático dinheiro, sem que Marcos especifique quantia ou tipo de moeda.
- source_word: ἐζήτει
  choice: começou a procurar
  rationale: 'O imperfeito descreve uma busca em curso e, no fluxo narrativo, admite nuance ingressiva: depois da promessa, Judas começou a buscar o modo adequado de agir.'
- source_word: πῶς
  choice: uma forma de
  rationale: A formulação portuguesa comunica de modo natural a ideia de maneira ou meio expressa por πῶς, evitando uma construção rígida como “procurar como poderia”.
- source_word: εὐκαίρως
  choice: no momento oportuno
  rationale: O advérbio indica uma ocasião conveniente ou favorável para a ação, sem especificar circunstâncias que o versículo não declara.
- source_word: παραδοῖ
  choice: traí-lo
  rationale: Embora παραδίδωμι possa significar literalmente entregar ou passar alguém às mãos de outros, no contexto da ação de Judas o verbo tem força de traição.
theological_decisions:
- issue: Sentido de παραδίδωμι na ação de Judas
  choice: traí-lo
  alternative: entregá-lo
  rationale: O contexto imediato apresenta uma cooperação desleal de Judas com os adversários de Jesus; “trair” comunica essa força contextual. A alternativa mais literal é preservada em nota para não ocultar a amplitude semântica do verbo.
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição inicial de “E” preserva a progressão narrativa de καί sem produzir artificialidade. Os pronomes têm referentes claros no contexto: “eles” são os principais sacerdotes, e “ele” é Judas.'
