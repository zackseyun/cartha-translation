id: MRK.14.55
reference: Mark 14:55
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς καὶ ὅλον τὸ συνέδριον ἐζήτουν κατὰ τοῦ Ἰησοῦ μαρτυρίαν εἰς τὸ θανατῶσαι αὐτόν, καὶ οὐχ ηὕρισκον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/055.yaml
  text: The chief priests and the whole council were seeking testimony against Jesus in order to put him to death, and they were not finding any.
translation:
  language: pt
  text: Os principais sacerdotes e todo o conselho[a] procuravam testemunho contra Jesus para matá-lo, e não encontravam nenhum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente, «todo o Sinédrio».
    reason: alternativa lexical e identificação histórica de συνέδριον
lexical_decisions:
- source_word: οἱ δὲ
  choice: Os
  rationale: δέ é um conectivo leve de progressão narrativa. O português não exige um marcador explícito aqui; omitir «então» ou «ora» evita acrescentar uma noção temporal ou adversativa mais forte que o grego.
- source_word: ἀρχιερεῖς
  choice: principais sacerdotes
  rationale: No plural, a expressão designa a liderança sacerdotal de Jerusalém, não vários sumos sacerdotes em exercício. «Principais sacerdotes» é claro e corrente.
- source_word: ὅλον τὸ συνέδριον
  choice: todo o conselho
  rationale: συνέδριον designa o conselho dirigente. A tradução comunica o sentido no texto principal, enquanto a nota preserva o nome histórico «Sinédrio».
- source_word: ἐζήτουν
  choice: procuravam
  rationale: O imperfeito apresenta uma busca contínua ou reiterada; «procuravam» preserva naturalmente esse aspecto em português.
- source_word: κατὰ τοῦ Ἰησοῦ μαρτυρίαν
  choice: testemunho contra Jesus
  rationale: κατά com o genitivo tem aqui força adversativa, e μαρτυρία se refere ao conteúdo testemunhal em contexto judicial.
- source_word: εἰς τὸ θανατῶσαι αὐτόν
  choice: para matá-lo
  rationale: A construção expressa propósito, e θανατόω significa causar a morte ou matar. «Para matá-lo» é direto e não acrescenta a ideia específica de condenação, ausente da expressão grega.
- source_word: καὶ οὐχ ηὕρισκον
  choice: e não encontravam nenhum
  rationale: 'O imperfeito mantém a ação contínua: apesar da busca, não encontravam testemunho algum. «Nenhum» retoma naturalmente «testemunho», e «e» preserva o καί do texto.'
theological_decisions:
- issue: Identificação de συνέδριον
  choice: todo o conselho
  alternative: todo o Sinédrio
  rationale: A decisão é lexical e cultural, não doutrinária. O texto principal traduz o significado do termo grego; a nota fornece a designação histórica mais específica sem restringir silenciosamente a formulação da fonte.
- issue: Finalidade da busca por testemunho
  choice: para matá-lo
  alternative: para condená-lo à morte
  rationale: O grego declara que a finalidade era causar a morte de Jesus, mas não emprega neste ponto um verbo que signifique «condenar». A tradução evita inserir uma etapa jurídica não expressa na frase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se o aspecto durativo dos imperfeitos e evita-se linguagem jurídica mais específica do que a do original.
