source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα δυσὶν ἐξ αὐτῶν περιπατοῦσιν ἐφανερώθη ἐν ἑτέρᾳ μορφῇ πορευομένοις εἰς ἀγρόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/012.yaml
  text: After these things[b][a], he appeared in a different form to two of them as they were walking on their way into the countryside.
translation:
  language: pt
  text: Depois disso, ele apareceu sob uma forma diferente[a] a dois deles, enquanto caminhavam a caminho do campo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sob outra forma”; também pode ser entendido como “com uma aparência diferente”.
    reason: lexical_alternative
  - marker: b
    text: Ou “para um campo”. Aqui, “do campo” reflete o provável sentido de ἀγρός como região rural.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Depois disso
  rationale: Preserva a sequência temporal indicada por μετά com acusativo e incorpora naturalmente o valor de retomada de δέ, sem a rigidez de “depois destas coisas”.
- source_word: δυσὶν ἐξ αὐτῶν
  choice: a dois deles
  rationale: Expressa de modo idiomático que os dois pertenciam ao grupo maior.
- source_word: περιπατοῦσιν
  choice: enquanto caminhavam
  rationale: O particípio presente indica uma ação em andamento e simultânea à aparição.
- source_word: ἐφανερώθη
  choice: ele apareceu
  rationale: Neste contexto, o passivo de φανερόω descreve idiomaticamente uma aparição; “apareceu” é claro e natural em português.
- source_word: ἐν ἑτέρᾳ μορφῇ
  choice: sob uma forma diferente
  rationale: Mantém a ideia de diferença expressa por ἑτέρᾳ e a referência de μορφή à forma ou aparência, sem explicar a natureza dessa diferença.
- source_word: πορευομένοις
  choice: a caminho
  rationale: Comunica deslocamento intencional e evita a repetição pouco natural de “caminhavam... iam”.
- source_word: εἰς ἀγρόν
  choice: do campo
  rationale: Neste contexto, ἀγρός provavelmente designa a região rural como destino; a locução portuguesa “a caminho do campo” expressa isso naturalmente.
theological_decisions:
- issue: Natureza da aparição da ressurreição descrita por ἐν ἑτέρᾳ μορφῇ
  choice: Traduzir descritivamente como “sob uma forma diferente”, sem explicar em que consistia a diferença.
  alternative: “com outra aparência” ou “sob outra forma”
  rationale: O texto afirma uma diferença de forma, mas não esclarece se houve alteração da aparência, da percepção dos discípulos ou do modo de reconhecimento. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção evita repetição verbal excessiva, conserva a ambiguidade de “forma diferente” e apresenta em nota a possível leitura mais específica de ἀγρός.
