source:
  edition: SBLGNT
  text: ἐκεῖνοι δὲ ἐξελθόντες ἐκήρυξαν πανταχοῦ, τοῦ κυρίου συνεργοῦντος καὶ τὸν λόγον βεβαιοῦντος διὰ τῶν ἐπακολουθούντων ⸀σημείων.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/020.yaml
  text: And they went out and proclaimed everywhere[b][a], while the Lord worked with them and confirmed the message through the accompanying signs.
translation:
  language: pt
  text: Eles saíram e proclamaram por toda parte, enquanto o Senhor cooperava com eles e confirmava a mensagem[a] por meio dos sinais que se seguiam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a palavra”. Aqui, o grego λόγος se refere ao conteúdo proclamado.
    reason: lexical_alternative
  - marker: b
    text: Ou “por meio dos sinais que os acompanhavam” ou “por meio dos sinais acompanhantes”. O grego não explicita se os sinais acompanhavam os proclamadores ou a mensagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ
  choice: Eles
  rationale: O demonstrativo retoma o grupo de discípulos mencionado no contexto; em português, o pronome é natural. δέ marca aqui a continuação da narrativa e não exige uma conjunção explícita.
- source_word: ἐξελθόντες
  choice: saíram
  rationale: O particípio aoristo expressa uma ação anterior ou concomitante à proclamação e é vertido naturalmente como verbo coordenado.
- source_word: ἐκήρυξαν πανταχοῦ
  choice: proclamaram por toda parte
  rationale: κηρύσσω indica anúncio público; “proclamaram” evita restringir o sentido à pregação eclesiástica. πανταχοῦ é expresso idiomaticamente por “por toda parte”.
- source_word: τοῦ κυρίου συνεργοῦντος
  choice: enquanto o Senhor cooperava com eles
  rationale: A construção genitiva absoluta descreve a atuação simultânea do Senhor. “Cooperava com eles” preserva o sentido de ação conjunta presente em συνεργέω; “com eles” é exigido idiomaticamente em português e é recuperado do sujeito principal.
- source_word: τὸν λόγον
  choice: a mensagem
  rationale: Neste contexto, λόγος designa o conteúdo proclamado, não uma palavra isolada. “Mensagem” torna essa referência clara, enquanto a nota conserva a alternativa formal “palavra”.
- source_word: βεβαιοῦντος
  choice: confirmava
  rationale: βεβαιόω significa confirmar, validar ou atestar; “confirmava” comunica de modo direto a função atribuída à atuação do Senhor.
- source_word: διὰ τῶν ἐπακολουθούντων σημείων
  choice: por meio dos sinais que se seguiam
  rationale: διά com genitivo indica meio. A formulação “que se seguiam” preserva a abertura de ἐπακολουθέω entre seguir e acompanhar, sem explicitar se os sinais acompanhavam os mensageiros ou a mensagem.
theological_decisions:
- issue: Referente de “o Senhor”
  choice: Manter o título “o Senhor”, cujo referente contextual é Jesus ressuscitado.
  alternative: Entender “o Senhor” como referência mais geral a Deus.
  rationale: Marcos 16:19 chama Jesus de “o Senhor”; manter o título preserva a formulação grega e permite que o contexto determine o referente.
- issue: Função dos sinais
  choice: Apresentar os sinais como o meio pelo qual o Senhor confirmava a mensagem.
  alternative: Entender que os sinais apenas se seguiam aos proclamadores, sem função explícita de confirmação.
  rationale: A sintaxe liga diretamente “confirmava a mensagem” a “por meio dos sinais”, indicando uma função confirmatória, sem afirmar nada além do versículo sobre sua duração ou normatividade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase mantém a progressão narrativa e a simultaneidade da atuação do Senhor. As notas preservam as alternativas lexicais genuínas sem resolver além do texto a relação exata dos sinais com os proclamadores ou com a mensagem.
