id: MRK.16.19
reference: Mark 16:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ μὲν οὖν κύριος ⸀Ἰησοῦς μετὰ τὸ λαλῆσαι αὐτοῖς ἀνελήμφθη εἰς τὸν οὐρανὸν καὶ ἐκάθισεν ἐκ δεξιῶν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/019.yaml
  text: So then, the Lord Jesus, after speaking to them, was taken up into heaven and sat down at the right hand of God.
translation:
  language: pt
  text: Assim, o Senhor Jesus, depois de falar com eles, foi elevado ao céu e sentou-se à direita de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὲν οὖν
  choice: Assim
  rationale: A combinação introduz a continuação conclusiva da narrativa. “Assim” comunica de modo natural em português sua força transitiva e inferencial, sem a tornar excessivamente explícita.
- source_word: κύριος Ἰησοῦς
  choice: o Senhor Jesus
  rationale: “Senhor” preserva o peso titular de κύριος no uso neotestamentário, e o artigo grego é representado naturalmente em português.
- source_word: μετὰ τὸ λαλῆσαι αὐτοῖς
  choice: depois de falar com eles
  rationale: A construção μετά com infinitivo articular é temporal. A formulação conserva a sequência e traduz αὐτοῖς de maneira idiomática.
- source_word: ἀνελήμφθη
  choice: foi elevado
  rationale: O aoristo passivo é mantido, sem explicitar o agente. “Foi elevado” é digno e natural no contexto da ascensão; o destino aparece na expressão seguinte.
- source_word: εἰς τὸν οὐρανόν
  choice: ao céu
  rationale: “Ao céu” expressa de modo idiomático o movimento indicado por εἰς com acusativo. Em português, o artigo é natural nessa expressão.
- source_word: ἐκάθισεν
  choice: sentou-se
  rationale: O aoristo apresenta o ato de assumir a posição sentada. “Sentou-se” preserva essa ação concluída em português corrente.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: à direita de Deus
  rationale: Embora ἐκ tenha sentido básico de origem, ἐκ δεξιῶν é uma expressão idiomática de posição. “À direita de Deus” é a equivalência bíblica consagrada e natural em português.
theological_decisions:
- issue: Linguagem da ascensão e exaltação sem ampliação doutrinária
  choice: foi elevado ao céu e sentou-se à direita de Deus
  alternative: foi recebido no céu e tomou assento à direita de Deus
  rationale: A tradução afirma diretamente a ascensão e a posição exaltada de Jesus, mantendo a voz passiva e a expressão bíblica, mas sem identificar um agente não expresso nem acrescentar explicação teológica.
- issue: κύριος como título cristológico
  choice: o Senhor Jesus
  alternative: o Mestre Jesus
  rationale: “Senhor” conserva a amplitude e o peso teológico de κύριος no Novo Testamento; “Mestre” reduziria indevidamente o título a uma função social ou pedagógica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das orações acompanha de perto o grego, enquanto “Assim”, “ao céu” e “à direita de Deus” asseguram naturalidade idiomática. Não são necessárias notas de rodapé para esta redação.
