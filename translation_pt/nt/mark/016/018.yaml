source:
  edition: SBLGNT
  text: ⸀ὄφεις ἀροῦσιν κἂν θανάσιμόν τι πίωσιν οὐ μὴ αὐτοὺς βλάψῃ, ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν καὶ καλῶς ἕξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/018.yaml
  text: They will pick up snakes[a], and if they drink anything deadly, it will certainly not harm them; they will lay hands on the sick[d][c][b], and they will recover.
translation:
  language: pt
  text: Eles pegarão cobras[a][b] e, mesmo que bebam algo mortal[c], de modo nenhum isso lhes fará mal; imporão as mãos sobre os doentes, e eles se recuperarão[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos antigos não incluem Marcos 16.9–20; este versículo faz parte do final longo de Marcos.
    reason: textual_variant
  - marker: b
    text: 'Ou: “serpentes”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “alguma coisa mortífera”; a expressão é ampla e não se limita estritamente a veneno.'
    reason: lexical_alternative
  - marker: d
    text: 'Literalmente: “eles ficarão bem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφεις
  choice: cobras
  rationale: “Cobras” é o termo comum e natural no português atual; “serpentes” é uma alternativa mais tradicional, registrada em nota.
- source_word: ἀροῦσιν
  choice: pegarão
  rationale: αἴρω pode significar levantar ou pegar. Neste contexto físico, “pegarão” comunica a ação com clareza sem acrescentar a ideia de manuseio deliberado ou ritual.
- source_word: κἂν
  choice: e, mesmo que
  rationale: A contração καὶ ἐάν introduz uma condição com possível força concessiva. “Mesmo que” expressa naturalmente essa nuance antes da negação enfática.
- source_word: θανάσιμόν τι
  choice: algo mortal
  rationale: A expressão denota algo capaz de causar morte. “Algo mortal” mantém a abrangência do grego, sem restringi-la especificamente a veneno.
- source_word: πίωσιν
  choice: bebam
  rationale: O aoristo do subjuntivo na oração condicional é expresso naturalmente pelo presente do subjuntivo em português após “mesmo que”.
- source_word: οὐ μὴ
  choice: de modo nenhum
  rationale: A dupla negação grega é enfática. “De modo nenhum” conserva essa força em português corrente e digno.
- source_word: βλάψῃ
  choice: fará mal
  rationale: βλάπτω indica causar dano ou prejuízo. “Fará mal” é natural no contexto de ingerir algo mortal e preserva o sentido amplo.
- source_word: ἐπὶ ἀρρώστους
  choice: sobre os doentes
  rationale: Com a imposição de mãos, ἐπί seguido do acusativo é representado naturalmente por “sobre”; ἄρρωστος designa pessoas doentes ou enfermas.
- source_word: χεῖρας ἐπιθήσουσιν
  choice: imporão as mãos
  rationale: “Impor as mãos” é uma expressão bíblica estabelecida em português e corresponde diretamente ao gesto descrito.
- source_word: καλῶς ἕξουσιν
  choice: eles se recuperarão
  rationale: A expressão significa literalmente “estarão bem”. No contexto dos doentes, “se recuperarão” comunica com naturalidade o resultado, enquanto a forma mais literal é preservada em nota.
theological_decisions:
- issue: Natureza das proteções e curas prometidas
  choice: Traduzir diretamente as ações futuras e seus resultados, sem qualificá-los.
  alternative: Interpretar os sinais como universais em todas as épocas, limitados ao período apostólico ou puramente simbólicos.
  rationale: O grego apresenta as ações e os resultados de maneira direta. A tradução não deve introduzir uma posição denominacional sobre continuidade, cessação ou simbolismo.
- issue: Situação textual de Marcos 16.9–20
  choice: Traduzir o versículo conforme o texto fornecido e informar em nota que ele pertence ao final longo de Marcos.
  alternative: Omitir o versículo ou colocá-lo entre colchetes no texto principal.
  rationale: O versículo consta da fonte fornecida, mas a ausência de Marcos 16.9–20 em alguns manuscritos antigos é uma variante textual relevante e deve ser comunicada com transparência.
- issue: Referente do sujeito em καλῶς ἕξουσιν
  choice: Entender o sujeito implícito como os doentes sobre quem as mãos são impostas.
  alternative: Manter uma formulação pronominal mais aberta, que poderia ser associada aos que impõem as mãos.
  rationale: O plural “os doentes” é o referente contextual imediato, e o sentido natural é que eles ficarão bem. A tradução explicita isso apenas pela continuidade normal do pronome “eles”, sem acrescentar agente ou mecanismo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Cobras” e “doentes” favorecem a compreensão comum; “imporão as mãos” preserva o idioma bíblico reconhecível. A negação enfática e a amplitude de “algo mortal” foram mantidas, sem inserir qualificações doutrinárias.
