source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἰς τὸν κόσμον ἅπαντα κηρύξατε τὸ εὐαγγέλιον πάσῃ τῇ κτίσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/015.yaml
  text: And he said to them[b][a], “Go into all the world and proclaim the good news to all creation.”
translation:
  language: pt
  text: 'E ele lhes disse: “Vão pelo mundo inteiro e proclamem as boas-novas[b] a toda a criação.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a cada criatura”. A expressão grega pode ser entendida coletivamente (“toda a criação”) ou distributivamente (“cada criatura”).
    reason: alternative_reading
  - marker: b
    text: Ou “o evangelho”. A palavra grega εὐαγγέλιον significa literalmente “boa notícia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευθέντες
  choice: Vão
  rationale: O particípio aoristo, antes do imperativo principal, tem aqui força de circunstância acompanhante. Em português natural, o imperativo “Vão” transmite melhor a comissão do que o literal “Tendo ido”; “À medida que forem” enfraqueceria essa força.
- source_word: κόσμον ἅπαντα
  choice: pelo mundo inteiro
  rationale: κόσμος designa o mundo como esfera da missão, e ἅπας reforça sua totalidade. “Pelo mundo inteiro” é natural em português e preserva o alcance universal.
- source_word: κηρύξατε
  choice: proclamem
  rationale: κηρύσσω denota anunciar pública e autorizadamente. “Proclamem” mantém esse sentido sem restringi-lo ao uso eclesiástico que “preguem” pode sugerir.
- source_word: τὸ εὐαγγέλιον
  choice: as boas-novas
  rationale: εὐαγγέλιον significa uma notícia boa e, neste contexto, a mensagem cristã. “As boas-novas” comunica diretamente o sentido; “o evangelho” é mantido em nota por ser a expressão cristã tradicional.
- source_word: πάσῃ τῇ κτίσει
  choice: a toda a criação
  rationale: κτίσις pode significar “criação” ou “criatura”. A formulação escolhida preserva a amplitude e a possível dimensão cósmica do grego sem restringir antecipadamente a referência a indivíduos humanos.
- source_word: εἶπεν αὐτοῖς
  choice: ele lhes disse
  rationale: Tradução direta e natural da introdução narrativa, sem acrescentar força interpretativa.
theological_decisions:
- issue: Alcance de πάσῃ τῇ κτίσει na comissão
  choice: a toda a criação
  alternative: a cada criatura
  rationale: A expressão pode ser entendida coletivamente ou cosmicamente como “toda a criação”, ou distributivamente como “cada criatura”. A tradução principal mantém o horizonte amplo do grego, e a nota preserva a alternativa sem reduzir o texto apenas às pessoas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vão”, “proclamem” e “boas-novas” oferecem clareza contemporânea; a ordem das notas acompanha os termos a que se referem no texto.
