id: MRK.16.6
reference: Mark 16:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐταῖς· Μὴ ἐκθαμβεῖσθε· Ἰησοῦν ζητεῖτε τὸν Ναζαρηνὸν τὸν ἐσταυρωμένον· ἠγέρθη, οὐκ ἔστιν ὧδε· ἴδε ὁ τόπος ὅπου ἔθηκαν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/006.yaml
  text: But he says to them[a], “Do not be alarmed. You are looking for Jesus the Nazarene, the one who has been crucified. He has been raised; he is not here[b]. Look—the place where they laid him.”
translation:
  language: pt
  text: 'Mas ele lhes diz: “Não fiquem assustadas. Vocês estão procurando Jesus, o Nazareno[a], aquele que foi crucificado. Ele foi ressuscitado; não está aqui[b]. Vejam o lugar onde o colocaram.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Nazoreu” ou “de Nazaré”. O grego emprega uma designação derivada de Nazaré.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “Ele ressuscitou”. O verbo grego está na voz passiva: “Ele foi ressuscitado”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκθαμβεῖσθε
  choice: não fiquem assustadas
  rationale: Expressa forte perturbação ou alarme e concorda naturalmente com as mulheres às quais o mensageiro se dirige.
- source_word: Ναζαρηνὸν
  choice: o Nazareno
  rationale: Preserva a forma adjetival usada como designação de Jesus, sem reduzi-la apenas a uma indicação geográfica.
- source_word: ἐσταυρωμένον
  choice: aquele que foi crucificado
  rationale: Mantém a identificação enfática de Jesus pelo acontecimento da crucificação; em português, esta formulação é clara e digna.
- source_word: ἠγέρθη
  choice: Ele foi ressuscitado
  rationale: Preserva a voz passiva do grego e, assim, a ação implícita de Deus, sem explicitá-la além do texto.
- source_word: ζητεῖτε
  choice: Vocês estão procurando
  rationale: A forma progressiva comunica naturalmente em português a ação presente no contexto.
- source_word: ἴδε
  choice: Vejam
  rationale: O imperativo plural dirige enfaticamente a atenção das mulheres ao lugar; “Vejam” é atual e natural.
- source_word: ἔθηκαν
  choice: colocaram
  rationale: Traduz de modo claro o ato de pôr o corpo no túmulo; evita a possível estranheza de “deitaram” neste contexto.
- source_word: λέγει αὐταῖς
  choice: ele lhes diz
  rationale: Conserva o presente histórico característico da narrativa vívida de Marcos.
theological_decisions:
- issue: Formulação e voz da ressurreição
  choice: Ele foi ressuscitado
  alternative: Ele ressuscitou / Ele se levantou
  rationale: O aoristo passivo ἠγέρθη é representado por uma construção passiva em português, preservando a forma do texto e a ação divina implícita sem resolver explicitamente o agente.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Vocês” e as formas femininas tornam explícito o referente feminino já presente no contexto e no pronome grego αὐταῖς. A redação conserva o presente histórico de Marcos e usa linguagem digna sem arcaísmos.
