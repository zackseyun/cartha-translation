source:
  edition: SBLGNT
  text: Ὕστερον ⸀δὲ ἀνακειμένοις αὐτοῖς τοῖς ἕνδεκα ἐφανερώθη, καὶ ὠνείδισεν τὴν ἀπιστίαν αὐτῶν καὶ σκληροκαρδίαν ὅτι τοῖς θεασαμένοις αὐτὸν ⸀ἐγηγερμένον οὐκ ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/014.yaml
  text: Later[a], he appeared to the eleven themselves as they were reclining at the table, and he rebuked their unbelief and hardness of heart[c][b], because they had not believed those who had seen him after he had been raised.
translation:
  language: pt
  text: Mais tarde[a], ele apareceu aos onze enquanto estavam reclinados à mesa[b] e os repreendeu por sua incredulidade e dureza de coração, porque não tinham acreditado nos que o haviam visto depois de ele ter sido ressuscitado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Depois”.
    reason: lexical_alternative
  - marker: b
    text: Ou “enquanto estavam reclinados”; o grego se refere à postura habitual para comer.
    reason: cultural_note
  - marker: c
    text: Ou “os que o haviam visto ressuscitado”. Mais literalmente, o grego diz “os que o haviam visto tendo sido ressuscitado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕστερον
  choice: Mais tarde
  rationale: Marca uma ocasião posterior de modo natural no português moderno, sem impor uma sequência mais precisa do que o texto indica.
- source_word: ἀνακειμένοις
  choice: enquanto estavam reclinados à mesa
  rationale: Expressa a postura habitual nas refeições antigas e torna claro ao leitor moderno o contexto de mesa.
- source_word: αὐτοῖς τοῖς ἕνδεκα
  choice: aos próprios onze
  rationale: Conserva a ênfase de αὐτοῖς sobre o grupo dos onze.
- source_word: ἐφανερώθη
  choice: apareceu
  rationale: É a forma idiomática e precisa em relatos de aparições após a ressurreição.
- source_word: ὠνείδισεν
  choice: repreendeu
  rationale: Comunica censura verbal forte em linguagem atual e digna.
- source_word: ἀπιστίαν
  choice: incredulidade
  rationale: Indica aqui a falta ou recusa de crer no testemunho recebido.
- source_word: σκληροκαρδίαν
  choice: dureza de coração
  rationale: Preserva a metáfora bíblica de resistência interior, em vez de reduzi-la simplesmente a teimosia.
- source_word: θεασαμένοις
  choice: nos que o haviam visto
  rationale: Identifica com clareza as testemunhas oculares, mantendo a anterioridade em relação à aparição aos onze.
- source_word: ἐγηγερμένον
  choice: depois de ele ter sido ressuscitado
  rationale: Preserva o valor perfeito e passivo do particípio e comunica claramente a ressurreição em português natural.
- source_word: οὐκ ἐπίστευσαν
  choice: não tinham acreditado
  rationale: O mais-que-perfeito composto situa a recusa em crer antes desta aparição e se encaixa naturalmente na oração causal.
theological_decisions:
- issue: Formulação da ressurreição em ἐγηγερμένον
  choice: depois de ele ter sido ressuscitado
  alternative: o haviam visto ressuscitado
  rationale: A formulação principal preserva explicitamente a voz passiva do grego sem identificar além do texto o agente da ressurreição; a alternativa conserva de modo mais compacto a ambiguidade sintática.
- issue: Sentido de σκληροκαρδία
  choice: dureza de coração
  alternative: teimosia
  rationale: Mantém a metáfora e sua ressonância bíblico-teológica acerca da resistência interior, sem substituí-la por uma interpretação mais estreita.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto conserva a metáfora “dureza de coração”, evita arcaísmos e explicita com discrição o contexto cultural da refeição. Todos os marcadores de nota aparecem junto às expressões correspondentes.
