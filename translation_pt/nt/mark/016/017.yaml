source:
  edition: SBLGNT
  text: σημεῖα δὲ τοῖς πιστεύσασιν ⸂ταῦτα παρακολουθήσει⸃, ἐν τῷ ὀνόματί μου δαιμόνια ἐκβαλοῦσιν, γλώσσαις λαλήσουσιν ⸀καιναῖς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/017.yaml
  text: 'And these signs will accompany those who have believed: in my name they will cast out demons[b][a]; they will speak in new tongues.'
translation:
  language: pt
  text: 'E estes sinais acompanharão os que crerem: em meu nome expulsarão demônios; falarão em novas línguas[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “novos idiomas”. O termo grego pode referir-se a línguas ou idiomas; “línguas” preserva aqui a ambiguidade da expressão.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: sinais
  rationale: “Sinais” conserva a nuance de acontecimentos que apontam para uma realidade e a atestam, sem ampliar o termo para “milagres”.
- source_word: τοῖς πιστεύσασιν
  choice: os que crerem
  rationale: O particípio aoristo designa genericamente aqueles que vieram a crer. Em português, “os que crerem” é natural no contexto futuro e mantém o valor verbal, sem limitar a referência a um grupo já encerrado.
- source_word: ταῦτα
  choice: estes
  rationale: O demonstrativo aponta adiante para os sinais enumerados no versículo.
- source_word: παρακολουθήσει
  choice: acompanharão
  rationale: O verbo expressa a ideia de acompanhar ou estar associado, evitando que “seguirão” seja entendido apenas como sequência temporal.
- source_word: ἐν τῷ ὀνόματί μου
  choice: em meu nome
  rationale: Expressão portuguesa natural para uma ação realizada sob a autoridade de Jesus.
- source_word: δαιμόνια
  choice: demônios
  rationale: Tradução direta do substantivo grego, sem substituí-lo pela expressão relacionada, mas distinta, “espíritos impuros”.
- source_word: ἐκβαλοῦσιν
  choice: expulsarão
  rationale: Verbo claro e corrente em português para a ação de fazer os demônios sair.
- source_word: γλώσσαις
  choice: línguas
  rationale: “Línguas” preserva a ambiguidade do grego entre idiomas e fala de natureza não especificada pelo próprio versículo.
- source_word: λαλήσουσιν
  choice: falarão
  rationale: Equivalente corrente e digno do verbo grego “falar”.
- source_word: καιναῖς
  choice: novas
  rationale: Reproduz diretamente a ideia de novidade de espécie ou qualidade, sem explicar além do texto.
theological_decisions:
- issue: Sentido de γλώσσαις em “falarão em novas línguas”
  choice: Manter “línguas” no texto principal sem definir a natureza do fenômeno.
  alternative: “idiomas” ou uma referência explícita a fala extática
  rationale: O termo grego pode referir-se a línguas ou idiomas, mas o versículo não determina com precisão se se trata de idiomas humanos reconhecíveis ou de outro tipo de fala. A tradução preserva essa tensão e evita uma leitura denominacional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e a estrutura do grego são mantidas quando naturais; “acompanharão” comunica associação, e não mera sucessão.
