review_pass:
  verdict: revise
  source_fidelity: 'A estrutura e os principais termos são bem traduzidos: “sinais”, “acompanharão”, “em meu nome”, “expulsarão demônios” e “falarão em novas línguas” refletem adequadamente o grego. Contudo, “os que crerem” usa uma construção prospectiva em português e pode incluir pessoas que ainda virão a crer, enquanto o particípio aoristo τοῖς πιστεύσασιν apresenta os que já creram como o grupo acompanhado pelos sinais. “Os que creram” conserva melhor esse aspecto, sem alterar a generalidade da referência.'
  naturalness: O texto é claro, fluente e de registro bíblico moderno. “Os que creram” é natural neste enunciado e torna mais explícita a anterioridade implicada pelo particípio grego.
  terminology: “Demônios” traduz diretamente δαιμόνια. “Línguas” mantém, de modo apropriado, a ambiguidade de γλώσσαις, sem decidir entre idiomas e uma fala cuja natureza o versículo não especifica. A nota é ajustada para explicar essa alternativa de forma mais precisa em português.
  issues:
  - severity: medium
    issue: Tempo/aspecto de τοῖς πιστεύσασιν
    rationale: “Os que crerem” é uma formulação portuguesa tradicional e compreensível, mas seu futuro do subjuntivo não reproduz bem o aoristo participial, que se refere aos que já creram. “Os que creram” é uma correção segura e mais fiel.
  revised_text: 'E estes sinais acompanharão os que creram: em meu nome expulsarão demônios; falarão em novas línguas[a].'
  revised_footnotes:
  - marker: a
    text: Ou “novos idiomas”. A palavra grega também pode designar idiomas; “línguas” preserva a ambiguidade da expressão.
    reason: lexical_alternative
  revision_rationale: A revisão limita-se a substituir a forma prospectiva “os que crerem” por “os que creram”, refletindo melhor o particípio aoristo πιστεύσασιν e a decisão registrada na trilha de auditoria inglesa. A nota foi apenas esclarecida, mantendo a alternativa lexical e a ambiguidade teológica do texto.
