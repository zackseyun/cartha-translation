  text: καὶ ἔλεγον πρὸς ἑαυτάς· Τίς ἀποκυλίσει ἡμῖν τὸν λίθον ⸀ἐκ τῆς θύρας τοῦ μνημείου;
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/003.yaml
  text: And they were saying to one another[a], “Who will roll away the stone for us from the entrance of the tomb?”
translation:
  language: pt
  text: 'E diziam umas às outras: “Quem vai rolar para nós a pedra para longe da entrada[a] do túmulo?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da porta do túmulo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito grego apresenta a fala como contínua ou repetida durante o caminho; o imperfeito português preserva naturalmente esse aspecto.
- source_word: πρὸς ἑαυτάς
  choice: umas às outras
  rationale: 'Embora a expressão seja literalmente reflexiva, neste contexto plural tem sentido recíproco: as mulheres conversavam entre si.'
- source_word: Τίς
  choice: Quem
  rationale: Equivalente direto e natural do pronome interrogativo que pergunta pela pessoa capaz de realizar a ação.
- source_word: ἀποκυλίσει
  choice: vai rolar ... para longe
  rationale: Mantém a imagem concreta de deslocar a pedra rolando-a e expressa de modo corrente em português a ação futura esperada.
- source_word: ἡμῖν
  choice: para nós
  rationale: 'O dativo indica benefício: alguém faria isso em favor delas.'
- source_word: τὸν λίθον
  choice: a pedra
  rationale: Traduz o substantivo sem acrescentar que a pedra era grande, informação não expressa neste versículo.
- source_word: ἐκ τῆς θύρας
  choice: para longe da entrada
  rationale: ἐκ indica afastamento, e θύρα pode designar a abertura ou entrada; em referência a um túmulo, “entrada” é mais claro do que “porta”.
- source_word: τοῦ μνημείου
  choice: do túmulo
  rationale: No contexto funerário, μνημεῖον designa o túmulo onde o corpo havia sido depositado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção compreensível tanto no Brasil como em outros contextos lusófonos. A formulação conserva o aspecto contínuo do imperfeito e a imagem concreta da pedra sendo rolada.
