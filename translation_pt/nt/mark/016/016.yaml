source:
  edition: SBLGNT
  text: ὁ πιστεύσας καὶ βαπτισθεὶς σωθήσεται, ὁ δὲ ἀπιστήσας κατακριθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/016.yaml
  text: The one who has believed and been baptized will be saved[b][a], but the one who has disbelieved will be condemned.
translation:
  language: pt
  text: Aquele que tiver crido e sido batizado será salvo[a], mas aquele que não tiver crido será condenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “Quem crer e for batizado será salvo, mas quem não crer será condenado.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύσας
  choice: aquele que tiver crido
  rationale: O artigo com o particípio aoristo funciona substantivamente e tem sentido genérico. O futuro composto do subjuntivo expressa com naturalidade em português a ação anterior em relação ao futuro «será salvo», preservando o singular representativo.
- source_word: βαπτισθεὶς
  choice: sido batizado
  rationale: Mantém a voz passiva e, coordenado com «tiver crido», apresenta o batismo como ação anterior ao resultado futuro sem repetir desnecessariamente o auxiliar.
- source_word: σωθήσεται
  choice: será salvo
  rationale: Conserva a voz passiva futura e o sentido soteriológico normal de σῴζω neste contexto.
- source_word: ὁ δὲ ἀπιστήσας
  choice: mas aquele que não tiver crido
  rationale: Preserva o contraste verbal com «crido» e o singular substantivado. Em português atual, «não tiver crido» é mais natural e claro do que «tiver descrido».
- source_word: κατακριθήσεται
  choice: será condenado
  rationale: Equivale diretamente ao futuro passivo e comunica um julgamento desfavorável que resulta em condenação.
- source_word: καὶ
  choice: e
  rationale: Coordena diretamente os dois particípios, sem acrescentar ênfase ausente do grego.
- source_word: δὲ
  choice: mas
  rationale: Expressa o contraste entre os dois sujeitos e seus respectivos resultados.
theological_decisions:
- issue: Relação entre fé, batismo e salvação
  choice: Traduzir fé e batismo como descrições coordenadas daquele que será salvo, sem explicar causalmente a relação entre eles.
  alternative: Tornar o batismo explicitamente a causa instrumental da salvação ou tratá-lo como mero detalhe incidental.
  rationale: O grego coordena «tendo crido» e «tendo sido batizado» na primeira oração, enquanto a segunda menciona como fundamento expresso da condenação apenas a incredulidade. A tradução preserva essa assimetria e a tensão teológica do texto.
- issue: Construção masculina singular com sentido genérico
  choice: Usar «aquele que» no singular representativo.
  alternative: Usar o plural «os que» ou a formulação mais idiomática «quem crer».
  rationale: «Aquele que» conserva o número singular da construção substantivada; no contexto, seu alcance é genérico, não restrito a homens.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação principal conserva o singular representativo e a anterioridade aspectual dos particípios; a nota oferece a expressão corrente sem alterar a assimetria entre as duas orações.
