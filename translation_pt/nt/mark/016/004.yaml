  yaml_path: translation/nt/mark/016/004.yaml
  text: And looking up[a], they saw that the stone had been rolled away, for it was extremely large.
translation:
  language: pt
  text: E, levantando os olhos, viram que a pedra já tinha sido rolada para longe, pois era extremamente grande.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλέψασαι
  choice: levantando os olhos
  rationale: O particípio aoristo descreve de modo natural o gesto das mulheres ao dirigirem o olhar para o túmulo; a expressão é corrente e preserva a ideia de erguer o olhar.
- source_word: θεωροῦσιν
  choice: viram
  rationale: Embora o presente histórico grego possa sugerir observação atenta, o pretérito é mais natural na narrativa portuguesa e comunica claramente a percepção visual.
- source_word: ὅτι
  choice: que
  rationale: Introduz explicitamente o conteúdo do que elas viram.
- source_word: ἀποκεκύλισται
  choice: já havia sido removida
  rationale: O perfeito passivo apresenta a pedra como estando afastada em consequência de uma ação anterior; «já havia sido» expressa essa anterioridade e o estado resultante. «Removida» é idiomático em português para a pedra que fechava o túmulo sem especificar um agente.
- source_word: ὁ λίθος
  choice: a pedra
  rationale: Tradução direta e suficiente no contexto, sem acrescentar «do túmulo», que não está expresso neste versículo.
- source_word: ἦν γὰρ μέγας σφόδρα
  choice: pois era muito grande
  rationale: «Pois» preserva a função explicativa de γάρ, e «muito grande» transmite naturalmente a forte intensificação de σφόδρα sem soar rebuscado.
- source_word: καὶ
  choice: E
  rationale: Mantém a ligação simples com a sequência narrativa anterior.
