translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O presente histórico grego foi vertido pelo pretérito narrativo. Não se acrescentou nota porque a nuance resultativa do perfeito foi incorporada no texto por «já havia sido removida».
