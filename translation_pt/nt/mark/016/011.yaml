  text: κἀκεῖνοι ἀκούσαντες ὅτι ζῇ καὶ ἐθεάθη ὑπ’ αὐτῆς ἠπίστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/011.yaml
  text: And they[a], when they heard that he was alive and had been seen by her[b], did not believe.
translation:
  language: pt
  text: E eles, quando ouviram que ele estava vivo[a] e que havia sido visto por ela[b], não acreditaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “está vivo” ou “vive”. O verbo grego está no presente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “foi visto por ela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: E eles
  rationale: A contração de καί com ἐκεῖνοι dá continuidade à narrativa e retoma o grupo mencionado; “E eles” é natural em português sem enfatizar excessivamente o demonstrativo.
- source_word: ἀκούσαντες
  choice: quando ouviram
  rationale: O particípio aoristo tem valor temporal neste contexto; a oração finita comunica com clareza a sequência dos acontecimentos.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo daquilo que ouviram.
- source_word: ζῇ
  choice: estava vivo
  rationale: O presente grego expressa que Jesus vive. Depois do verbo passado “ouviram”, “estava vivo” é natural no discurso indireto em português, sem negar a continuidade dessa vida; a forma mais literal no presente é registrada em nota.
- source_word: καὶ
  choice: e que
  rationale: Coordena os dois conteúdos do relato ouvido; a repetição de “que” torna clara e natural a construção portuguesa.
- source_word: ἐθεάθη
  choice: havia sido visto
  rationale: O aoristo passivo de θεάομαι indica que ele foi visto. O mais-que-perfeito composto esclarece que isso ocorreu antes de eles ouvirem o relato, sem converter o passivo em “apareceu”.
- source_word: ὑπ’ αὐτῆς
  choice: por ela
  rationale: Preserva o pronome grego e sua referência contextual sem inserir explicitamente o nome de Maria.
- source_word: ἠπίστησαν
  choice: não acreditaram
  rationale: Traduz diretamente a falta de fé no relato, sem acrescentar a ideia mais forte de uma recusa deliberada.
theological_decisions:
- issue: Expressão da vida de Jesus após a ressurreição no discurso indireto
  choice: ele estava vivo
  alternative: ele está vivo; ele vive
  rationale: O presente ζῇ apresenta Jesus como vivo. Em português, a concordância temporal no discurso indireto favorece “estava vivo”, mas o presente do original e suas traduções possíveis são preservados em nota para não enfraquecer a ideia de vida contínua.
- issue: Sentido do passivo ἐθεάθη
  choice: havia sido visto por ela
  alternative: foi visto por ela; apareceu a ela
  rationale: A formulação passiva mantém o foco lexical em ele ter sido visto e evita resolver a expressão como uma aparição ativa, embora essa seja uma interpretação contextual possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a estrutura narrativa concisa e usa discurso indireto natural. Todos os marcadores de nota aparecem no texto principal.
