  source_fidelity: A tradução preserva adequadamente os referentes, o relato implícito e a recusa em crer no testemunho. Contudo, “foram e relataram” pode sugerir em português que eles foram até o grupo para relatar, enquanto ἀπελθόντες expressa mais diretamente a partida anterior ao relato. “Partiram e relataram” representa melhor a sequência do particípio aoristo.
  naturalness: O texto é claro e de registro apropriado. “Aos demais” e “estes também não acreditaram neles” distinguem naturalmente os dois mensageiros do grupo restante. A substituição de “foram” por “partiram” torna o movimento narrativo mais preciso sem perder fluência.
  terminology: “Relataram isso”, “aos demais” e “não acreditaram neles” são escolhas modernas e adequadas. A nota para “aos outros” registra uma alternativa lexical legítima. Não há questão teológica especial em “acreditar” neste contexto de aceitação de testemunho.
