  text: κἀκεῖνοι ἀπελθόντες ἀπήγγειλαν τοῖς λοιποῖς· οὐδὲ ἐκείνοις ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/013.yaml
  text: And they went away and reported it to the rest[a], but they did not believe them either.
translation:
  language: pt
  text: E eles partiram e relataram isso aos demais[a], mas estes também não acreditaram neles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos outros”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: E eles
  rationale: A forma composta significa “e aqueles” ou “e eles também”. O pronome retoma naturalmente os dois discípulos mencionados no contexto, sem acrescentar ao texto a palavra “homens”.
- source_word: ἀπελθόντες
  choice: foram
  rationale: O particípio aoristo indica que eles partiram antes de fazer o relato. Em português, “foram e relataram” expressa essa sequência com naturalidade.
- source_word: ἀπήγγειλαν
  choice: relataram isso
  rationale: O verbo significa comunicar, anunciar ou relatar. “Isso” explicita com naturalidade o objeto subentendido no grego, isto é, o que lhes havia acontecido.
- source_word: τοῖς λοιποῖς
  choice: aos demais
  rationale: Refere-se aos membros restantes do grupo. “Aos demais” é claro e digno; a alternativa igualmente possível “aos outros” é registrada em nota.
- source_word: οὐδὲ
  choice: mas ... também não
  rationale: A construção comunica que, assim como no episódio anterior, esse relato tampouco foi aceito. “Mas ... também não” preserva tanto o contraste narrativo quanto a força aditiva.
- source_word: ἐκείνοις
  choice: neles
  rationale: O dativo plural retoma os dois que fizeram o relato. Depois de “acreditar”, “neles” é a construção portuguesa natural e mantém o referente plural.
- source_word: ἐπίστευσαν
  choice: acreditaram
  rationale: Neste contexto narrativo, o verbo indica aceitar como verdadeiro o testemunho apresentado, e não primariamente depositar confiança pessoal.
theological_decisions:
- issue: Sentido de πιστεύω no contexto de um testemunho narrativo
  choice: não acreditaram
  alternative: não confiaram
  rationale: Aqui o foco está na recusa do relato dos dois discípulos. “Não acreditaram” preserva esse sentido direto sem introduzir uma nuance de confiança pessoal ou uma formulação doutrinária mais carregada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A alternância entre “eles” e “estes” ajuda a distinguir os dois mensageiros do grupo restante sem explicitar referentes além do que o contexto fornece.
