review_pass:
  verdict: revise
  source_fidelity: 'O texto principal conserva adequadamente a sequência narrativa, o sujeito feminino implícito, «túmulo», «um jovem», a posição à direita e a veste branca. «Profundamente assustadas» tende a restringir ἐξεθαμβήθησαν ao medo intenso; o verbo comunica sobretudo espanto/perturbação muito forte, podendo incluir alarme. A nota proposta não é uma variante de tradução nem uma alternativa explicitada pelo versículo: «anjo» é uma identificação inferida do contexto e dos paralelos.'
  naturalness: «Trajando uma veste branca» é mais fluente e menos repetitivo do que «vestido com uma veste branca», mantendo o sentido de στολὴ λευκή. «Ficaram muito espantadas» é natural em português moderno e expressa melhor a força de ἐξεθαμβήθησαν sem impor terror.
  terminology: '«Jovem» traduz νεανίσκος de modo fiel e sem antecipar a identificação angelical. «Veste branca» é apropriado para στολὴ λευκή. A nota «Ou: anjo» deve ser removida, pois sugere uma alternativa lexical que o grego deste versículo não oferece.'
  issues:
  - severity: medium
    issue: A nota de rodapé apresenta «anjo» como se fosse alternativa de tradução.
    rationale: O texto grego diz νεανίσκον, «um jovem». A identificação como anjo é inferencial, baseada no contexto e em relatos paralelos, não uma leitura alternativa deste versículo. A nota também introduz uma conclusão interpretativa desnecessária no aparato.
  - severity: low
    issue: «Profundamente assustadas» estreita excessivamente o campo de ἐξεθαμβήθησαν.
    rationale: O verbo denota espanto intenso, choque ou alarme. «Muito espantadas» preserva essa amplitude e evita especificar medo profundo.
  - severity: low
    issue: «Vestido com uma veste branca» é estilisticamente repetitivo.
    rationale: «Trajando uma veste branca» mantém a referência a uma veste/robe e soa mais natural em português moderno.
  revised_text: E, quando entraram no túmulo, viram um jovem sentado à direita, trajando uma veste branca, e ficaram muito espantadas.
