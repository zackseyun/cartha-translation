  text: καὶ εἰσελθοῦσαι εἰς τὸ μνημεῖον εἶδον νεανίσκον καθήμενον ἐν τοῖς δεξιοῖς περιβεβλημένον στολὴν λευκήν, καὶ ἐξεθαμβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/005.yaml
  text: And when they entered the tomb, they saw a young man sitting on the right, clothed in a white robe, and they were alarmed.
translation:
  language: pt
  text: E, quando entraram no túmulo, viram um jovem sentado à direita, trajando uma veste branca, e ficaram muito espantadas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: quando entraram
  rationale: O particípio aoristo feminino plural retoma as mulheres e expressa uma circunstância temporal anterior à ação principal; a oração finita é natural em português.
- source_word: μνημεῖον
  choice: túmulo
  rationale: No contexto do sepultamento e da ressurreição, é o equivalente português mais claro e usual.
- source_word: νεανίσκον
  choice: um jovem
  rationale: Traduz diretamente a designação narrativa grega sem identificar explicitamente a figura como anjo.
- source_word: καθήμενον ἐν τοῖς δεξιοῖς
  choice: sentado à direita
  rationale: Reproduz de modo idiomático tanto a postura quanto a localização da figura no interior do túmulo.
- source_word: περιβεβλημένον στολὴν λευκήν
  choice: vestido com uma veste branca
  rationale: Expressa o estado resultante do particípio perfeito e preserva στολή como uma veste distintiva, sem especificar além do texto.
- source_word: ἐξεθαμβήθησαν
  choice: ficaram profundamente assustadas
  rationale: O verbo denota forte perturbação e assombro; esta formulação mantém sua intensidade sem reduzi-lo a simples surpresa nem necessariamente elevá-lo a terror.
theological_decisions:
- issue: Identidade do νεανίσκος
  choice: um jovem
  alternative: um anjo
  rationale: Marcos o descreve neste versículo como νεανίσκος. Embora o contexto mais amplo e os relatos paralelos apontem para um mensageiro angelical, o texto principal preserva a designação explícita do evangelista.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A concordância feminina em “assustadas” torna explícito que o sujeito são as mulheres mencionadas no contexto. A repetição “vestido com uma veste” é aceitável, mas deliberadamente próxima da imagem lexical grega.
