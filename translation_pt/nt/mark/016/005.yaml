revisions:
- from: E, quando entraram no túmulo, viram um jovem[a] sentado à direita, vestido com uma veste branca, e ficaram profundamente assustadas.
  to: E, quando entraram no túmulo, viram um jovem sentado à direita, trajando uma veste branca, e ficaram muito espantadas.
  rationale: A revisão mantém a equivalência do texto grego e melhora a naturalidade. Remove-se a nota interpretativa sobre identidade angelical porque não corresponde a uma alternativa textual ou lexical de νεανίσκος; a ambiguidade narrativa permanece no texto. Ajustam-se a expressão da veste e a reação das mulheres para refletir melhor o uso grego e o português atual.
