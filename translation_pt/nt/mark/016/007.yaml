id: MRK.16.7
reference: Mark 16:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπάγετε εἴπατε τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ ὅτι Προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν· ἐκεῖ αὐτὸν ὄψεσθε, καθὼς εἶπεν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/007.yaml
  text: But go[a], tell his disciples and Peter, ‘He is going ahead of you into Galilee. There you will see him[b], just as he told you.’
translation:
  language: pt
  text: 'Mas vão[a] e digam aos discípulos dele e a Pedro: “Ele vai adiante de vocês para a Galileia. Lá vocês o verão, assim como ele lhes disse.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pedro é mencionado separadamente dos “discípulos dele”. Isso pode destacar sua restauração depois de ele ter negado Jesus, mas o grego não diz explicitamente “especialmente a Pedro”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca o contraste e a transição para a ordem dada às mulheres, de modo conciso e natural.
- source_word: ὑπάγετε
  choice: vão
  rationale: Imperativo plural que ordena que partam e prossigam; “vão” preserva a força sem tornar explícito além do necessário o aspecto verbal.
- source_word: εἴπατε
  choice: digam
  rationale: Imperativo plural seguido dos destinatários e do conteúdo da mensagem; é a forma corrente e direta em português.
- source_word: τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ
  choice: aos discípulos dele e a Pedro
  rationale: Mantém a coordenação simples do grego e a menção separada de Pedro, sem acrescentar “especialmente” nem “inclusive”.
- source_word: Προάγει ὑμᾶς
  choice: Ele vai adiante de vocês
  rationale: Preserva tanto o movimento anterior de Jesus quanto a relação direcional com os discípulos, em linguagem moderna.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: para a Galileia
  rationale: Neste contexto de movimento rumo a uma região, “para a Galileia” é natural e representa adequadamente εἰς.
- source_word: ἐκεῖ αὐτὸν ὄψεσθε
  choice: Lá vocês o verão
  rationale: Tradução direta do advérbio locativo e do futuro de ὁράω, preservando a promessa do encontro.
- source_word: καθὼς εἶπεν ὑμῖν
  choice: assim como ele lhes disse
  rationale: Mantém a correspondência com a declaração anterior de Jesus e reproduz de perto o verbo “disse”.
theological_decisions:
- issue: Menção separada de Pedro depois de “os discípulos dele”
  choice: Manter “aos discípulos dele e a Pedro” sem explicar a implicação no texto principal.
  alternative: “aos discípulos dele, especialmente a Pedro” ou “aos discípulos dele, inclusive Pedro”
  rationale: O grego destaca Pedro por meio de uma menção separada, possivelmente com importância narrativa e restauradora após sua negação, mas não afirma gramaticalmente “especialmente” nem “inclusive”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural e “dele” para evitar a possível ambiguidade de “seus discípulos”. A fala é apresentada como citação direta, de modo natural em português.
