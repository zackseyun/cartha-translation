  source_fidelity: A identificação elíptica «Maria, a de Tiago» preserva adequadamente a ambiguidade de Μαρία ἡ τοῦ Ἰακώβου, e a nota a explica sem transformá-la em afirmação textual. Contudo, «Quando o sábado terminou» pode sugerir o instante de seu término, enquanto διαγενομένου ... indica mais precisamente que ele já havia passado. «Para ir ungir Jesus» também torna singular um movimento cujo sujeito são as três mulheres e substitui o pronome do texto pelo nome próprio.
  naturalness: «Depois que o sábado passou» é moderno e natural. «Para irem ungi-lo» expressa com fluência a finalidade, conserva o sujeito plural e evita a explicitação desnecessária de «Jesus».
  terminology: «Aromas» é aceitável em registro bíblico para substâncias aromáticas funerárias; «ungir» traduz diretamente ἀλείφω e mantém o sentido funerário contextual, sem parafraseá-lo.
