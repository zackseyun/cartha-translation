source:
  edition: SBLGNT
  text: Καὶ διαγενομένου τοῦ σαββάτου ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ τοῦ⸃ Ἰακώβου καὶ Σαλώμη ἠγόρασαν ἀρώματα ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/001.yaml
  text: And when the Sabbath was over[a], Mary Magdalene, Mary the mother of James, and Salome bought spices so that they might come and anoint him.
translation:
  language: pt
  text: Depois que o sábado passou, Maria Madalena, Maria, a de Tiago[a], e Salomé compraram aromas para irem ungi-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “Maria, a de Tiago”; isto é, Maria identificada por sua relação com Tiago, tradicionalmente entendida como sua mãe.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαγενομένου τοῦ σαββάτου
  choice: Quando o sábado terminou
  rationale: O genitivo absoluto indica que o sábado já havia passado antes da ação principal; a formulação é natural e clara em português.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Maria Madalena
  rationale: Forma tradicional, reconhecível e natural do nome e do epíteto em português.
- source_word: Μαρία ἡ τοῦ Ἰακώβου
  choice: Maria, a de Tiago
  rationale: Preserva no texto a expressão elíptica do grego, que identifica Maria por sua relação com Tiago sem explicitar qual era essa relação.
- source_word: Σαλώμη
  choice: Salomé
  rationale: Forma portuguesa convencional do nome.
- source_word: ἠγόρασαν
  choice: compraram
  rationale: Equivalente simples e natural do aoristo narrativo.
- source_word: ἀρώματα
  choice: aromas
  rationale: Designa substâncias aromáticas usadas na preparação funerária; mantém amplitude sem reduzir o referente a especiarias culinárias ou a perfumes modernos.
- source_word: ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν
  choice: para ir ungir Jesus
  rationale: Expressa naturalmente a finalidade e a sequência de deslocamento e unção. O nome Jesus esclarece o referente pronominal em português sem alterar o sentido.
- source_word: ἀλείψωσιν
  choice: ungir
  rationale: Equivalente direto que conserva o ato de aplicar substâncias aromáticas ao corpo no contexto funerário.
theological_decisions:
- issue: Relação de Maria com Tiago na expressão elíptica Μαρία ἡ τοῦ Ἰακώβου
  choice: Maria, a de Tiago
  alternative: Maria, mãe de Tiago
  rationale: O grego identifica Maria em relação a Tiago, mas não declara aqui a natureza dessa relação. A tradução conserva a ambiguidade genuína, enquanto a nota informa a compreensão tradicional.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem narrativa foi mantida; a ambiguidade da identificação de Maria foi preservada e explicada em nota.
