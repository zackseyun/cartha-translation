  text: καὶ λίαν πρωῒ ⸂τῇ μιᾷ τῶν⸃ σαββάτων ἔρχονται ἐπὶ τὸ μνημεῖον ἀνατείλαντος τοῦ ἡλίου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/002.yaml
  text: And very early on the first day of the week[c][b][a], they come to the tomb when the sun had risen.
translation:
  language: pt
  text: E bem cedo, no primeiro dia da semana[a], elas chegam[b] ao túmulo, quando o sol já havia nascido.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, «no primeiro dos sábados», expressão idiomática que significa «no primeiro dia da semana».
    reason: lexical_alternative
  - marker: b
    text: Marcos emprega aqui o presente histórico, «elas chegam»; muitas traduções usam o passado, «elas chegaram».
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «depois que o sol havia nascido». A construção grega indica a circunstância temporal da chegada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λίαν πρωῒ
  choice: bem cedo
  rationale: A expressão portuguesa natural preserva a intensificação de πρωῒ por λίαν sem redundância desnecessária.
- source_word: τῇ μιᾷ τῶν σαββάτων
  choice: no primeiro dia da semana
  rationale: Traduz claramente o sentido do idiomatismo semítico e coiné, cuja forma literal é «no primeiro dos sábados».
- source_word: ἔρχονται
  choice: elas chegam
  rationale: Mantém o presente histórico característico da narrativa de Marcos; o sujeito feminino é recuperado do contexto imediato.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: ao túmulo
  rationale: No contexto de sepultamento, μνημεῖον designa naturalmente um túmulo, e ἐπί com acusativo indica movimento até o local.
- source_word: ἀνατείλαντος τοῦ ἡλίου
  choice: quando o sol já havia nascido
  rationale: A oração temporal reproduz o genitivo absoluto e apresenta o nascer do sol como circunstância temporal da chegada, sem impor a formulação mais forte «depois que».
