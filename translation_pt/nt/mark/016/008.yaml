  source_fidelity: A tradução reproduz adequadamente a sequência narrativa, a fuga do túmulo, a negação enfática e a causa final do medo. Contudo, “estavam tomadas de tremor e espanto” enfraquece e torna mais estática a construção εἶχεν αὐτὰς τρόμος καὶ ἔκστασις, cujo sentido é que tremor e espanto as dominavam/apanhavam.
  naturalness: O português é claro, moderno e adequado ao registro narrativo. “Tremor e espanto as dominavam” é igualmente natural e reflete melhor o aspecto em curso do imperfeito grego.
  terminology: “Túmulo”, “tremor”, “espanto” e “medo” são escolhas apropriadas. A nota textual preserva corretamente o final breve como variante; apenas se ajusta sua formulação para maior proximidade com o grego e uniformidade tipográfica.
  issues:
