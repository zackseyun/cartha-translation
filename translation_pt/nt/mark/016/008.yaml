  text: καὶ ἐξελθοῦσαι ἔφυγον ἀπὸ τοῦ μνημείου, εἶχεν ⸀γὰρ αὐτὰς τρόμος καὶ ἔκστασις· καὶ οὐδενὶ οὐδὲν εἶπαν, ἐφοβοῦντο ⸁γάρ. ⟦Πάντα δὲ τὰ παρηγγελμένα τοῖς περὶ τὸν Πέτρον συντόμως ἐξήγγειλαν. μετὰ δὲ ταῦτα καὶ αὐτὸς ὁ Ἰησοῦς ἀπὸ ἀνατολῆς καὶ ἄχρι δύσεως ἐξαπέστειλεν δι’ αὐτῶν τὸ ἱερὸν καὶ ἄφθαρτον κήρυγμα τῆς αἰωνίου σωτηρίας. ἀμήν.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/008.yaml
  text: And they went out and fled from the tomb[a], for trembling and astonishment had seized them. And they said nothing to anyone, for they were afraid.
translation:
  language: pt
  text: Elas saíram e fugiram do túmulo[a], pois tremor e espanto as dominavam. E não disseram nada a ninguém, pois estavam com medo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos acrescentam o chamado final breve: “Elas relataram resumidamente aos que estavam ao redor de Pedro tudo o que lhes havia sido ordenado. Depois dessas coisas, o próprio Jesus também enviou, por meio delas, do oriente ao ocidente, a sagrada e incorruptível proclamação da salvação eterna. Amém.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐξελθοῦσαι
  choice: Elas saíram
  rationale: O particípio aoristo feminino plural se refere às mulheres e indica uma ação anterior ou concomitante à fuga; a coordenação em português preserva com naturalidade a sequência narrativa.
- source_word: ἔφυγον
  choice: fugiram
  rationale: Mantém a força vívida de φεύγω sem reduzi-la ao sentido mais neutro de simplesmente ir embora.
- source_word: μνημείου
  choice: túmulo
  rationale: É a designação portuguesa corrente e precisa para μνημεῖον neste contexto funerário e de ressurreição.
- source_word: εἶχεν αὐτὰς
  choice: estavam tomadas de
  rationale: Reproduz idiomaticamente a ideia de que o tremor e o espanto as dominavam, preservando a intensidade da expressão grega.
- source_word: τρόμος
  choice: tremor
  rationale: Conserva o componente corporal de estremecimento e evita sobrepor seu sentido ao medo explicitamente mencionado no fim do versículo.
- source_word: ἔκστασις
  choice: espanto
  rationale: Neste contexto, indica assombro ou estado de estar fora de si; “espanto” é claro, natural e não sugere o sentido moderno potencialmente enganoso de “êxtase”.
- source_word: οὐδενὶ οὐδὲν εἶπαν
  choice: não disseram nada a ninguém
  rationale: Expressa em português corrente a negação universal enfática da construção grega.
- source_word: ἐφοβοῦντο
  choice: estavam com medo
  rationale: Comunica naturalmente o estado contínuo indicado pelo imperfeito.
- source_word: γάρ
  choice: pois / porque
  rationale: As duas ocorrências introduzem explicações causais. A variação portuguesa evita rigidez sem eliminar a função discursiva; “porque” no fecho mantém a frase explicativa e sua terminação abrupta.
theological_decisions:
- issue: Tratamento do final breve colocado entre colchetes duplos após Marcos 16:8
  choice: Excluir o final breve do texto principal e registrá-lo integralmente em nota textual.
  alternative: Incluir o final breve no texto principal ou apresentar ambos os finais como texto corrido.
  rationale: O SBLGNT assinala esse material com colchetes duplos, indicando forte dúvida quanto à sua pertença ao texto original. A nota preserva a transparência manuscrita sem tratá-lo como parte segura do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva a concisão, a intensidade emocional e o encerramento abrupto do grego, sem harmonizá-lo com os relatos posteriores.
