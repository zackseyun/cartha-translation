  text: ἐκείνη πορευθεῖσα ἀπήγγειλεν τοῖς μετ’ αὐτοῦ γενομένοις πενθοῦσι καὶ κλαίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/010.yaml
  text: She went and reported it to those who had been with him[a], who were mourning and weeping.
translation:
  language: pt
  text: Ela foi e contou isso aos que tinham estado com ele, os quais estavam de luto e choravam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνη
  choice: Ela
  rationale: O demonstrativo retoma Maria Madalena, mencionada no versículo anterior. Em português natural, o pronome identifica claramente a referente sem a rigidez de “aquela”.
- source_word: πορευθεῖσα
  choice: foi
  rationale: O particípio aoristo indica uma ação anterior ou associada à do verbo principal. A construção “foi e contou” preserva a sequência de modo idiomático.
- source_word: ἀπήγγειλεν
  choice: contou isso
  rationale: O verbo significa comunicar, relatar ou anunciar. “Contou” é claro e natural; “isso” explicita o objeto implícito no grego, retomando a aparição relatada no contexto imediato.
- source_word: τοῖς μετ’ αὐτοῦ γενομένοις
  choice: aos que tinham estado com ele
  rationale: A expressão identifica os que anteriormente estiveram na companhia de Jesus, sem restringir o grupo por meio de um título não presente no texto.
- source_word: πενθοῦσι
  choice: estavam de luto
  rationale: O verbo denota lamentar uma morte ou perda. “Estavam de luto” comunica bem o contexto de pesar pela morte de Jesus.
- source_word: καὶ κλαίουσιν
  choice: e choravam
  rationale: O verbo descreve choro ou pranto. “Choravam” é corrente, digno e mantém a ação distinta do estado de luto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A frase preserva a distinção entre estar de luto e chorar, bem como a relação dos destinatários com Jesus, sem identificá-los mais especificamente do que o grego permite.
