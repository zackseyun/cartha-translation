  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⟦Ἀναστὰς δὲ πρωῒ πρώτῃ σαββάτου ἐφάνη πρῶτον Μαρίᾳ τῇ Μαγδαληνῇ, ⸀παρ’ ἧς ἐκβεβλήκει ἑπτὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/009.yaml
  text: After he had risen[a], early on the first day of the week, he appeared first to Mary Magdalene, from whom he had cast out seven demons.
translation:
  language: pt
  text: Depois de ressuscitar[a], de madrugada, no primeiro dia da semana, ele apareceu primeiro a Maria Madalena, de quem havia expulsado sete demônios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os versículos 9–20 não constam de alguns manuscritos antigos de Marcos; outros manuscritos os incluem, às vezes com variações.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀναστὰς
  choice: Depois de ressuscitar
  rationale: O particípio aoristo tem valor temporal em relação a ἐφάνη; a formulação expressa com naturalidade que a ressurreição precedeu a aparição, sem explicitar além do grego o sujeito já retomado por «ele» na oração principal.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: δέ é um conectivo leve; em português, a progressão discursiva já é natural sem «então», «ora» ou «mas», que poderiam acrescentar uma nuance excessiva.
- source_word: πρωῒ
  choice: de madrugada
  rationale: Indica as primeiras horas da manhã; «de madrugada» é corrente, conciso e distinto da expressão seguinte sobre o dia da semana.
- source_word: πρώτῃ σαββάτου
  choice: no primeiro dia da semana
  rationale: Reproduz o sentido idiomático judaico-cristão da expressão e é imediatamente compreensível em português moderno.
- source_word: ἐφάνη
  choice: apareceu
  rationale: A forma passiva/deponente, em relatos de aparições após a ressurreição, é vertida naturalmente por «apareceu», sem a rigidez de «foi visto».
- source_word: πρῶτον
  choice: primeiro
  rationale: Preserva o valor adverbial de sequência das aparições.
- source_word: Μαρίᾳ τῇ Μαγδαληνῇ
  choice: a Maria Madalena
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome; o dativo identifica a pessoa a quem ele apareceu.
- source_word: παρ’ ἧς
  choice: de quem
  rationale: Com ἐκβεβλήκει, introduz naturalmente em português a pessoa da qual os demônios foram expulsos.
- source_word: ἐκβεβλήκει
  choice: havia expulsado
  rationale: O mais-que-perfeito grego indica ação anterior à aparição; «havia expulsado» preserva essa relação temporal e o sentido exorcístico de ἐκβάλλω.
- source_word: ἑπτὰ δαιμόνια
  choice: sete demônios
  rationale: Mantém literalmente o número e traduz δαιμόνια pelo termo direto e habitual nos contextos de exorcismo dos Evangelhos.
theological_decisions:
- issue: Situação textual de Marcos 16.9 no final longo do Evangelho
  choice: Traduzir o versículo conforme o texto grego fornecido e assinalar em nota que Marcos 16.9–20 não consta de alguns manuscritos antigos.
  alternative: Encerrar o texto de Marcos em 16.8, conforme alguns manuscritos, ou apresentar formas variantes do final.
  rationale: O SBLGNT fornecido inclui o versículo entre sinais de passagem textualmente disputada. A tradução conserva o texto apresentado sem ocultar a relevante incerteza manuscrita nem decidir a questão em favor de uma tradição específica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. «Depois de ressuscitar» evita uma construção participial rígida; «de madrugada» mantém a referência às primeiras horas da manhã. A nota textual é concisa e não tenta resolver a disputa manuscrita.
