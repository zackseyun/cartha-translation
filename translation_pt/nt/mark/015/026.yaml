  text: καὶ ἦν ἡ ἐπιγραφὴ τῆς αἰτίας αὐτοῦ ἐπιγεγραμμένη· Ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/026.yaml
  text: 'And the inscription of the charge against him was written: “The King of the Jews.”[a]'
translation:
  language: pt
  text: 'E a inscrição com a acusação contra ele estava escrita: “O Rei dos Judeus”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O Rei dos judeanos”.'
    reason: Alternativa lexical para Ἰουδαίων, que pode designar os judeus em sentido étnico-religioso ou, em certos contextos, os habitantes da Judeia.
lexical_decisions:
- source_word: ἐπιγραφή
  choice: inscrição
  rationale: Designa o texto escrito afixado na cruz; “inscrição” preserva o sentido formal sem acrescentar a ideia específica de uma placa.
- source_word: αἰτία
  choice: acusação contra ele
  rationale: No contexto judicial, indica a acusação ou imputação declarada contra Jesus. A formulação é clara e mantém a relação expressa por αὐτοῦ.
- source_word: ἐπιγεγραμμένη
  choice: dizia
  rationale: A construção perifrástica com ἦν indica que a inscrição permanecia escrita. Em português, “a inscrição ... dizia” comunica isso de modo natural, embora seja menos formalmente correspondente que “estava escrita”.
- source_word: βασιλεὺς
  choice: Rei
  rationale: Integra o teor formal da acusação afixada; a inicial maiúscula é apropriada no título citado.
- source_word: Ἰουδαίων
  choice: Judeus
  rationale: No título político relatado pela narrativa da paixão, a expressão tradicional e amplamente inteligível é “Rei dos Judeus”. “Judeus” pode abranger a designação étnico-religiosa, enquanto “judeanos” continua sendo uma possibilidade lexical contextual.
theological_decisions:
- issue: Sentido de Ἰουδαίων no título da crucificação
  choice: dos Judeus
  alternative: dos judeanos
  rationale: “Rei dos Judeus” preserva o título reconhecido nas narrativas da paixão e não limita explicitamente a referência aos habitantes da Judeia. Como Ἰουδαῖος também pode ter sentido geográfico em certos contextos, a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para soar natural; a repetição etimológica de ἐπιγραφή/ἐπιγεγραμμένη foi evitada sem perda do conteúdo. A pontuação apresenta diretamente o teor da inscrição.
