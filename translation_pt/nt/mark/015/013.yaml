  text: 'Mas eles gritaram novamente: “Crucifique-o!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ
  choice: eles
  rationale: O artigo nominativo plural é substantivado e retoma o grupo já em cena; “eles” é a forma natural e contextualmente fiel em português.
- source_word: δὲ
  choice: Mas
  rationale: δέ introduz aqui um contraste leve com a fala anterior de Pilatos; “Mas” preserva essa força adversativa sem exagerá-la.
- source_word: πάλιν
  choice: novamente
  rationale: πάλιν indica repetição; “novamente” comunica isso de maneira clara e natural.
- source_word: ἔκραξαν
  choice: gritaram
  rationale: κράζω descreve um clamor em voz alta; “gritaram” preserva diretamente a intensidade da cena.
- source_word: Σταύρωσον
  choice: Crucifique
  rationale: Imperativo aoristo ativo na segunda pessoa do singular, dirigido a Pilatos; o imperativo direto mantém a forma e a contundência do grego.
- source_word: αὐτόν
  choice: -o
  rationale: Pronome objeto que se refere a Jesus; o clítico “-o” é a forma portuguesa natural após o imperativo afirmativo.
