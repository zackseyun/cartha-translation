  text: ὁ δὲ Πιλᾶτος ἀπεκρίθη αὐτοῖς λέγων· Θέλετε ἀπολύσω ὑμῖν τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/009.yaml
  text: But Pilate answered them[a], saying, “Do you want me to release to you the King of the Jews?”
translation:
  language: pt
  text: 'Mas Pilatos lhes respondeu: “Vocês querem que eu lhes solte o Rei dos Judeus[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o rei dos habitantes da Judeia”. O termo grego Ἰουδαίων pode se referir tanto aos judeus quanto aos habitantes da Judeia; nesta designação recorrente da narrativa da paixão, “Judeus” é a tradução tradicional e adequada ao contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca uma leve contraposição ou mudança narrativa em relação ao contexto anterior; “Mas” é natural em português.
- source_word: ἀπεκρίθη αὐτοῖς λέγων
  choice: lhes respondeu
  rationale: Expressa de modo natural o ato de responder e introduzir a fala. O particípio λέγων não precisa ser reproduzido como “dizendo”, construção menos fluente aqui em português.
- source_word: Θέλετε
  choice: Vocês querem
  rationale: Comunica de modo claro e atual a ideia de desejo ou intenção expressa por θέλω.
- source_word: ἀπολύσω ὑμῖν
  choice: que eu solte para vocês
  rationale: No contexto judicial, ἀπολύω significa libertar ou soltar um preso. A formulação preserva tanto o sujeito de primeira pessoa quanto o dativo ὑμῖν.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: o Rei dos Judeus
  rationale: Mantém o título político recorrente na narrativa da paixão. “Judeus” é a forma tradicional e contextualmente adequada, enquanto a nota registra a alternativa lexical genuína.
theological_decisions:
- issue: Sentido e apresentação de τὸν βασιλέα τῶν Ἰουδαίων
  choice: o Rei dos Judeus
  alternative: o rei dos judeanos
  rationale: A expressão funciona na narrativa como título político carregado de ironia, sem que a tradução resolva essa tensão ou acrescente uma afirmação doutrinária. A inicial maiúscula apresenta a expressão como designação titular; “judeanos” permanece uma possibilidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” evita a ambiguidade regional de outras formas de segunda pessoa plural; “solte” é natural no contexto de libertar um preso. A construção grega com λέγων foi condensada para evitar o pouco idiomático “respondeu-lhes, dizendo”, sem perda semântica.
