  yaml_path: translation/nt/mark/015/018.yaml
  text: 'And they began to salute him: “Hail[b][a], King of the Jews!”'
translation:
  language: pt
  text: 'E começaram a saudá-lo: “Salve, Rei dos Judeus!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Rei dos judeanos”. O termo grego pode designar tanto os judeus como povo quanto os habitantes da Judeia.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a coordenação simples e o estilo paratático característico de Marcos.
- source_word: ἤρξαντο
  choice: começaram
  rationale: Expressa naturalmente o valor ingressivo de ἄρχομαι com infinitivo.
- source_word: ἀσπάζεσθαι
  choice: a saudá-lo
  rationale: O verbo normalmente significa cumprimentar ou saudar; neste contexto, “saudar” também comporta a encenação formal e zombeteira dos soldados.
- source_word: Χαῖρε
  choice: Salve
  rationale: Como fórmula de saudação dirigida a um rei, “Salve” conserva o tom cerimonial e a ironia da aclamação simulada.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: Rei dos Judeus
  rationale: Mantém a forma tradicional e contextualmente adequada do título na narrativa da paixão; Ἰουδαῖοι também pode ser entendido geograficamente como “judeanos”.
theological_decisions:
- issue: Preservar a ironia e o significado régio da aclamação dirigida a Jesus
  choice: “Salve, Rei dos Judeus!” como saudação régia zombeteira
  alternative: “Viva, Rei dos Judeus!” ou “Saudações, Rei dos Judeus!”
  rationale: “Salve” reproduz uma aclamação formal sem explicitar no corpo do texto a zombaria, que já decorre do contexto narrativo.
- issue: Amplitude semântica de Ἰουδαίων
  choice: Judeus
  alternative: judeanos
  rationale: No título da paixão, “Rei dos Judeus” é a leitura natural e reconhecível em português; a alternativa geográfica legítima é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e a coordenação simples preservam o ritmo narrativo de Marcos; “Salve” mantém o registro cerimonial apropriado à zombaria régia.
