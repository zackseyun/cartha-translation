  text: ὁ δὲ Πιλᾶτος πάλιν ⸀ἐπηρώτα αὐτὸν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; ἴδε πόσα σου ⸀κατηγοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/004.yaml
  text: But Pilate again questioned him, saying, “Do you give no answer? Look how many charges they are bringing against you.”
translation:
  language: pt
  text: 'Mas Pilatos voltou a perguntar-lhe: “Você não responde nada? Veja quantas acusações fazem contra você.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Veja de quantas coisas o acusam.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca o avanço da narrativa com leve contraste em relação ao silêncio de Jesus.
- source_word: πάλιν
  choice: voltou a
  rationale: Expressa naturalmente em português a repetição da ação.
- source_word: ἐπηρώτα
  choice: interrogá-lo
  rationale: O imperfeito sugere ação continuada ou reiterada, e o contexto é judicial; “interrogar” comunica isso sem exigir uma formulação pesada.
- source_word: λέγων
  choice: ':'
  rationale: Em português corrente, os dois-pontos introduzem a fala de modo mais natural do que o literal “dizendo”, sem perda de conteúdo.
- source_word: Οὐκ ἀποκρίνῃ οὐδέν;
  choice: Você não responde nada?
  rationale: Preserva a pergunta incisiva e a dupla negação idiomática do grego em linguagem portuguesa natural.
- source_word: ἴδε
  choice: Veja
  rationale: Imperativo que chama a atenção; é atual, digno e amplamente compreensível.
- source_word: πόσα
  choice: quantas acusações
  rationale: “Quantas” literalmente deixa implícitas as coisas alegadas; “acusações” explicita o sentido judicial determinado por κατηγοροῦσιν.
- source_word: σου κατηγοροῦσιν
  choice: fazem contra você
  rationale: Com “acusações”, a expressão “fazer acusações contra alguém” reproduz naturalmente o valor do genitivo da pessoa acusada e o presente do verbo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla legibilidade brasileira. A fala direta usa “você”, forma natural no português brasileiro contemporâneo; a narração mantém concisão e tom judicial. O particípio λέγων foi convertido em pontuação por naturalidade sintática.
