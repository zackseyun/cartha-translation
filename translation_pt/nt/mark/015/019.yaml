  text: καὶ ἔτυπτον αὐτοῦ τὴν κεφαλὴν καλάμῳ καὶ ἐνέπτυον αὐτῷ, καὶ τιθέντες τὰ γόνατα προσεκύνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/019.yaml
  text: And they were striking his head with a reed and spitting on him[a], and kneeling down they were bowing down to him.
translation:
  language: pt
  text: E batiam na cabeça dele com uma vara de junco, cuspiam nele e, ajoelhando-se, curvavam-se diante dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “prestavam-lhe homenagem” ou “o adoravam”. O verbo grego pode indicar curvar-se diante de alguém, prestar homenagem ou adorar; aqui, descreve a imitação zombeteira da honra devida a um rei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυπτον
  choice: batiam repetidamente
  rationale: O imperfeito indica ação contínua ou reiterada. A expressão comunica essa força de modo natural em português.
- source_word: αὐτοῦ τὴν κεφαλήν
  choice: na cabeça dele
  rationale: O genitivo pronominal expressa posse; esta é uma formulação clara e natural em português.
- source_word: καλάμῳ
  choice: com uma vara de junco
  rationale: κάλαμος designa um junco ou uma vara feita de junco. A formulação mantém a ligação com o objeto usado como cetro de zombaria no contexto.
- source_word: ἐνέπτυον αὐτῷ
  choice: cuspiam nele
  rationale: O imperfeito sugere ação contínua ou repetida, preservada naturalmente pelo pretérito imperfeito português.
- source_word: τιθέντες τὰ γόνατα
  choice: ajoelhando-se
  rationale: A expressão literalmente relacionada a pôr os joelhos é um modo idiomático de dizer que se ajoelhavam.
- source_word: προσεκύνουν
  choice: curvavam-se diante dele
  rationale: No contexto, o verbo descreve uma reverência corporal que imita zombeteiramente a honra prestada a um rei. A escolha preserva o gesto sem afirmar devoção sincera.
theological_decisions:
- issue: Sentido de προσκυνέω no contexto da zombaria
  choice: curvavam-se diante dele
  alternative: o adoravam; prestavam-lhe homenagem
  rationale: O contexto mostra soldados encenando de modo zombeteiro a reverência real. A tradução principal comunica o gesto visível e evita decidir que houve adoração sincera, enquanto a nota preserva a amplitude lexical e a ironia teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula separa as agressões da encenação de reverência sem fragmentar o versículo.
