  text: ὁ δὲ Ἰησοῦς ἀφεὶς φωνὴν μεγάλην ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/037.yaml
  text: But Jesus[a], uttering a loud cry[b], breathed his last.
translation:
  language: pt
  text: Mas Jesus, soltando um forte grito, deu seu último suspiro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: δὲ é um conectivo leve; “Mas” preserva a mudança narrativa e o contraste solene neste momento culminante.
- source_word: ἀφεὶς
  choice: soltando
  rationale: O particípio de ἀφίημι, construído com φωνὴν μεγάλην, significa aqui emitir ou soltar um som; “soltando” é natural e mantém a imagem do grego.
- source_word: φωνὴν μεγάλην
  choice: um forte grito
  rationale: φωνή pode designar voz, som ou grito; neste contexto, “grito” expressa a manifestação vocal, e “forte” comunica de modo idiomático sua intensidade ou volume.
- source_word: ἐξέπνευσεν
  choice: deu seu último suspiro
  rationale: ἐκπνέω significa literalmente expirar o ar e, idiomaticamente, morrer. A expressão preserva a imagem corporal e a solenidade sem introduzir a formulação teológica de outras passagens.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Mas Jesus
  rationale: O artigo diante do nome próprio não requer representação separada em português; o conectivo é expresso por “Mas”.
theological_decisions:
- issue: Expressar a morte de Jesus sem importar nuances teológicas adicionais
  choice: deu seu último suspiro
  alternative: morreu; entregou o espírito
  rationale: A escolha reflete a imagem do verbo grego e indica claramente a morte. “Entregou o espírito” poderia harmonizar indevidamente o versículo com a redação de outros Evangelhos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português sem perder a sequência narrativa do grego.
