id: MRK.15.14
reference: Mark 15:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἔλεγεν αὐτοῖς· Τί γὰρ ⸂ἐποίησεν κακόν⸃; οἱ δὲ ⸀περισσῶς ἔκραξαν· Σταύρωσον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/014.yaml
  text: But Pilate was saying to them[a], “For what evil has he done?” But they cried out all the more, “Crucify him!”
translation:
  language: pt
  text: 'Pilatos, porém, lhes perguntava: “Afinal, que mal ele fez?”[a] Mas eles gritaram ainda mais: “Crucifique-o!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por quê? Que mal ele fez?”'
    reason: Alternativa que torna mais explícito o valor explicativo ou argumentativo de γάρ.
lexical_decisions:
- source_word: ἔλεγεν
  choice: perguntava
  rationale: O imperfeito apresenta a fala de Pilatos como contínua ou reiterada. Como a fala introduz uma pergunta, “perguntava” é natural em português e preserva o aspecto sem exigir uma repetição explícita.
- source_word: Τί γὰρ ἐποίησεν κακόν
  choice: Afinal, que mal ele fez?
  rationale: “Afinal” expressa naturalmente o valor argumentativo de γάρ, enquanto “que mal” conserva a força moral de κακόν e o pedido de fundamento para a acusação.
- source_word: κακόν
  choice: mal
  rationale: “Mal” preserva o peso moral do termo grego e é mais direto do que formulações atenuadas como “o que ele fez de errado”.
- source_word: περισσῶς
  choice: ainda mais
  rationale: A expressão comunica a intensificação da reação da multidão de modo claro e idiomático.
- source_word: ἔκραξαν
  choice: gritavam
  rationale: O verbo comunica um clamor público em voz alta. O imperfeito em português combina naturalmente com a intensificação progressiva expressa por “ainda mais”.
- source_word: Σταύρωσον αὐτόν
  choice: Crucifique-o!
  rationale: O imperativo direto mantém a exigência enfática dirigida a Pilatos e segue o uso corrente e digno em português.
- source_word: δὲ
  choice: porém / Mas
  rationale: As duas ocorrências marcam contrastes no diálogo. A variação evita rigidez sem eliminar o movimento adversativo.
- source_word: Πιλᾶτος
  choice: Pilatos
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Força moral de κακόν na pergunta de Pilatos
  choice: “que mal ele fez”
  alternative: “o que ele fez de errado”
  rationale: “Mal” mantém a força moral e jurídica da contestação de Pilatos sem acrescentar uma conclusão doutrinária sobre a inocência de Jesus além do que a pergunta expressa.
- issue: Valor discursivo de γάρ
  choice: “Afinal”
  alternative: Omitir o conectivo ou traduzir por “Pois”
  rationale: “Afinal” torna explícita, em português natural, a exigência de uma razão para a condenação, preservando o vínculo argumentativo sem produzir uma frase artificial.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Lhes perguntava” preserva o aspecto imperfeito sem soar mecânico; “Crucifique-o!” mantém a força pública e direta da exigência.
