lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: como já havia anoitecido
  rationale: A construção genitiva absoluta expressa uma circunstância temporal; esta formulação é natural em português e preserva o valor de ἤδη, indicando que a tarde/noite já havia chegado.
- source_word: παρασκευή
  choice: Dia da Preparação
  rationale: Neste contexto, designa o dia reconhecido de preparação antes do sábado, e não uma preparação genérica. A inicial maiúscula sinaliza o uso calendárico.
- source_word: προσάββατον
  choice: a véspera do sábado
  rationale: Traduz de modo conciso a explicação de Marcos para παρασκευή. A nota explicita o sentido igualmente possível de 'dia anterior ao sábado' sem substituir o termo pelo mais interpretativo 'sexta-feira'.
- source_word: ἐπεὶ
  choice: visto que
  rationale: Introduz a explicação causal ou circunstancial para a ação subsequente e se integra com naturalidade ao fluxo narrativo.
- source_word: ὅ ἐστιν
  choice: isto é
  rationale: Fórmula explicativa corrente e clara em português.
- source_word: Καὶ
  choice: E
  rationale: Conserva o estilo narrativo paratático característico de Marcos.
