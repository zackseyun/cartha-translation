id: MRK.15.1
reference: Mark 15:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς πρωῒ συμβούλιον ποιήσαντες οἱ ἀρχιερεῖς μετὰ τῶν πρεσβυτέρων καὶ γραμματέων καὶ ὅλον τὸ συνέδριον δήσαντες τὸν Ἰησοῦν ἀπήνεγκαν καὶ ⸀παρέδωκαν Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/001.yaml
  text: And immediately[a], early in the morning, the chief priests held a consultation with the elders and scribes and the whole council; then they bound Jesus, led him away, and handed him over to Pilate.
translation:
  language: pt
  text: E, imediatamente, de manhã cedo, os principais sacerdotes deliberaram, com os anciãos, os escribas e todo o conselho. Então amarraram Jesus, levaram-no e o entregaram a Pilatos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: logo
  rationale: Preserva a prontidão característica da narrativa de Marcos de modo natural em português; em combinação com πρωῒ, «logo de manhã cedo» comunica tanto a rapidez quanto o momento.
- source_word: πρωῒ
  choice: de manhã cedo
  rationale: Expressa de forma idiomática o período inicial da manhã indicado pelo advérbio.
- source_word: συμβούλιον ποιήσαντες
  choice: fizeram uma consulta
  rationale: Reproduz a ideia de deliberação conjunta sem sugerir necessariamente que naquele momento se constituiu um novo conselho.
- source_word: ἀρχιερεῖς
  choice: principais sacerdotes
  rationale: Designa as autoridades sacerdotais de maior destaque, e não vários sumos sacerdotes simultaneamente no cargo.
- source_word: πρεσβυτέρων
  choice: anciãos
  rationale: Neste contexto institucional, refere-se a líderes reconhecidos do povo.
- source_word: γραμματέων
  choice: escribas
  rationale: Termo tradicional, conciso e historicamente adequado para os especialistas ligados à Lei e aos textos sagrados.
- source_word: ὅλον τὸ συνέδριον
  choice: todo o Conselho
  rationale: Traduz a instituição governante de modo compreensível; a inicial maiúscula sinaliza que se trata de um órgão específico, e a nota preserva a designação histórica «Sinédrio».
- source_word: δήσαντες
  choice: amarraram
  rationale: Comunica diretamente que Jesus foi preso com laços antes de ser levado, em linguagem atual e digna.
- source_word: ἀπήνεγκαν
  choice: levaram-no dali
  rationale: No contexto de custódia, expressa sua remoção sem sugerir que foi carregado fisicamente.
- source_word: παρέδωκαν
  choice: o entregaram
  rationale: Preserva a transferência formal de Jesus à autoridade de Pilatos e o peso narrativo do verbo, sem acrescentar uma interpretação doutrinária.
- source_word: Πιλάτῳ
  choice: a Pilatos
  rationale: Forma portuguesa convencional do nome, com a regência exigida por «entregar».
theological_decisions:
- issue: Referência de συνέδριον
  choice: «todo o Conselho», com nota indicando «todo o Sinédrio»
  alternative: «todo o Sinédrio» no texto principal
  rationale: A tradução comunica imediatamente a função institucional ao leitor comum, enquanto a nota conserva o nome histórico mais específico sem resolver além do que o grego afirma.
- issue: Força de παρέδωκαν na narrativa da paixão
  choice: «o entregaram», com sentido de transferência à autoridade romana
  alternative: «o puseram nas mãos de Pilatos»
  rationale: «Entregaram» mantém a ação judicial e o possível peso narrativo do termo, sem importar para este versículo implicações teológicas adicionais.
- issue: Relação entre os grupos mencionados e ὅλον τὸ συνέδριον
  choice: 'Mantida a coordenação: «com os anciãos, os escribas e todo o Conselho»'
  alternative: Reformular os grupos como partes explicativas do Conselho
  rationale: O grego coordena as expressões e deixa alguma tensão entre os grupos nomeados e o Conselho inteiro; a tradução não transforma essa relação em uma explicação ausente do texto.
translation_notes:
  register: Português moderno, corrente e digno, com ampla legibilidade brasileira. «Logo de manhã cedo» evita a sequência menos natural «imediatamente, de manhã cedo» sem perder a urgência de εὐθὺς. A divisão em duas frases torna clara a sequência deliberar–amarrar–levar–entregar, preservando a ordem do grego.
