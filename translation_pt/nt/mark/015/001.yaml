revisions:
- from: E, logo de manhã cedo, os principais sacerdotes fizeram uma consulta com os anciãos, os escribas e todo o Conselho[a]. Depois, amarraram Jesus, levaram-no dali e o entregaram a Pilatos.
  to: E, imediatamente, de manhã cedo, os principais sacerdotes deliberaram, com os anciãos, os escribas e todo o conselho. Então amarraram Jesus, levaram-no e o entregaram a Pilatos.
  rationale: 'A revisão separa explicitamente a prontidão de εὐθὺς do horário indicado por πρωῒ, torna inequívoca a deliberação conjunta expressa por συμβούλιον ποιήσαντες e normaliza a capitalização de «conselho». Mantém-se a ordem narrativa: deliberação, amarração, condução e entrega a Pilatos.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:09:27Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva os participantes, a sequência de ações e a transferência de Jesus a Pilatos. Contudo, «logo de manhã cedo» funde εὐθὺς e πρωῒ de maneira que tende a expressar apenas o horário matutino, deixando de explicitar a prontidão de εὐθὺς. «Fizeram uma consulta com» também pode sugerir que os sacerdotes consultaram os demais grupos, em vez de que deliberaram juntamente com eles.
  naturalness: O texto é geralmente claro e de registro adequado. «Imediatamente, de manhã cedo» é um pouco mais marcado, mas é natural o bastante e preserva os dois advérbios. «Deliberaram» oferece uma formulação mais idiomática e não ambígua para συμβούλιον ποιήσαντες neste contexto.
  terminology: «Principais sacerdotes», «anciãos», «escribas», «Sinédrio», «amarraram» e «entregaram» são escolhas adequadas. «Conselho» deve ficar em minúscula, pois o grego usa um substantivo institucional comum, e a nota já fornece a designação histórica alternativa.
  issues:
  - severity: medium
    issue: εὐθὺς não está suficientemente representado.
    rationale: Em «logo de manhã cedo», «logo» é facilmente lido como parte da expressão temporal «logo de manhã», isto é, como referência ao início da manhã, enquanto πρωῒ já comunica esse dado. «Imediatamente» preserva de modo explícito a urgência narrativa.
  - severity: medium
    issue: «fizeram uma consulta com» pode alterar a relação entre os grupos.
    rationale: A construção portuguesa pode significar que os principais sacerdotes buscaram conselho dos anciãos, escribas e conselho. O grego apresenta uma deliberação dos principais sacerdotes juntamente com esses grupos. «Deliberaram, com...» evita essa assimetria interpretativa.
  - severity: low
    issue: Maiúscula em «Conselho».
    rationale: Não é necessária para traduzir συνέδριον e pode dar à expressão uma aparência de título oficial não assinalada no texto grego. A nota mantém «Sinédrio» como alternativa histórica.
  revised_text: E, imediatamente, de manhã cedo, os principais sacerdotes deliberaram, com os anciãos, os escribas e todo o conselho. Então amarraram Jesus, levaram-no e o entregaram a Pilatos.
  revised_footnotes:
  - marker: a
    text: 'Ou: «todo o Sinédrio». O termo grego refere-se ao conselho governante judaico.'
    reason: alternative_reading
  revision_rationale: 'A revisão separa explicitamente a prontidão de εὐθὺς do horário indicado por πρωῒ, torna inequívoca a deliberação conjunta expressa por συμβούλιον ποιήσαντες e normaliza a capitalização de «conselho». Mantém-se a ordem narrativa: deliberação, amarração, condução e entrega a Pilatos.'
