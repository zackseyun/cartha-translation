  text: καὶ ⸀ἐνδιδύσκουσιν αὐτὸν πορφύραν καὶ περιτιθέασιν αὐτῷ πλέξαντες ἀκάνθινον στέφανον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/017.yaml
  text: And they dress him in purple[a], and after weaving a crown of thorns, they place it on him.
translation:
  language: pt
  text: E eles o vestem de púrpura[a] e, depois de trançarem uma coroa de espinhos, colocam-na sobre ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o vestem com tecido púrpura”; o grego não diz explicitamente “manto” neste versículo, embora o contexto indique uma peça de roupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδιδύσκουσιν
  choice: vestem ... de
  rationale: O verbo indica pôr roupa em alguém. “Vestem-no de” seria possível, mas “o vestem de” mantém clareza e fluidez em português internacional com boa legibilidade brasileira.
- source_word: πορφύραν
  choice: púrpura
  rationale: O substantivo pode designar tecido púrpura ou uma veste dessa cor. Como o grego não explicita “manto” neste versículo, “púrpura” preserva a forma concisa e a ambiguidade lexical do original.
- source_word: περιτιθέασιν
  choice: colocam-na nele
  rationale: O verbo significa pôr ao redor ou sobre alguém. O pronome retoma “coroa” e torna explícita, em português natural, a relação sintática implícita na construção grega.
- source_word: πλέξαντες
  choice: depois de trançarem
  rationale: O particípio aoristo apresenta a confecção da coroa como anterior ao ato de colocá-la; a expressão comunica essa sequência com naturalidade.
- source_word: ἀκάνθινον
  choice: de espinhos
  rationale: O adjetivo indica algo feito de espinhos; “de espinhos” é a formulação portuguesa corrente e precisa.
- source_word: στέφανον
  choice: coroa
  rationale: Embora o termo também possa significar grinalda, “coroa” comunica melhor a paródia de realeza presente no contexto, sem acrescentar interpretação alheia ao texto.
theological_decisions:
- issue: Imagem de falsa realeza na humilhação de Jesus
  choice: Traduzir στέφανος por “coroa”.
  alternative: “grinalda”
  rationale: A roupa púrpura e a coroa formam uma encenação zombeteira de realeza. “Coroa” conserva essa ironia narrativa e seu peso teológico sem resolver além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e acessível, de alcance internacional e leitura natural no Brasil. A ordem coordenada do grego foi preservada, com leve explicitação pronominal para clareza.
