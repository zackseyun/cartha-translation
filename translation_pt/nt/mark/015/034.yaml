source:
  edition: SBLGNT
  text: καὶ τῇ ⸂ἐνάτῃ ὥρᾳ⸃ ἐβόησεν ὁ Ἰησοῦς φωνῇ ⸀μεγάλῃ· Ἐλωῒ ἐλωῒ ⸀λεμὰ σαβαχθάνι; ὅ ἐστιν μεθερμηνευόμενον Ὁ θεός μου ὁ θεός μου, εἰς τί ⸂ἐγκατέλιπές με⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/034.yaml
  text: And at the ninth hour Jesus cried out with a loud voice[a], “Eloi, Eloi, lema sabachthani?” which is translated, “My God, my God[c][b], for what reason have you forsaken me?”
translation:
  language: pt
  text: 'E, à hora nona, Jesus clamou em alta voz: “Eloí, Eloí, lemá sabactâni?”[a] que, traduzido, é: “Meu Deus, meu Deus,[b] por que razão me abandonaste?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos e muitas tradições registram a expressão semítica como “lamá sabactâni”, em vez de “lemá sabactâni”.
    reason: textual_variant
  - marker: b
    text: As palavras de Jesus ecoam o Salmo 22:1.
    reason: cross_reference
  - marker: c
    text: 'Ou, de modo mais conciso: “por que me abandonaste?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐνάτῃ ὥρᾳ
  choice: à hora nona
  rationale: Mantém a forma antiga de contagem das horas usada por Marcos, sem substituí-la pela explicação interpretativa “por volta das três da tarde”.
- source_word: ἐβόησεν ... φωνῇ μεγάλῃ
  choice: clamou em alta voz
  rationale: Expressa tanto o forte clamor do verbo quanto a intensidade da expressão instrumental, em linguagem natural e solene.
- source_word: Ἐλωῒ ἐλωῒ λεμὰ σαβαχθάνι
  choice: Eloí, Eloí, lemá sabactâni?
  rationale: Preserva, como Marcos, as palavras semíticas transliteradas antes de apresentar sua tradução. “Lemá” segue a forma do texto grego da SBLGNT.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: Isso, traduzido, significa
  rationale: Indica claramente que Marcos fornece em seguida a tradução da expressão semítica, com formulação corrente em português.
- source_word: εἰς τί
  choice: por que razão
  rationale: Torna explícito o valor interrogativo da expressão grega e conserva sua nuance formal sem sugerir uma explicação teológica.
- source_word: ἐγκατέλιπές με
  choice: me abandonaste
  rationale: Comunica diretamente a ideia de ser deixado ou abandonado. O pretérito perfeito corresponde naturalmente ao aoristo grego e é idiomático em português.
theological_decisions:
- issue: Relação do clamor de Jesus com o Salmo 22:1
  choice: Manter o clamor como pergunta direta de abandono e indicar sua ressonância bíblica apenas em nota.
  alternative: Suavizar o sentido de abandono ou acrescentar no texto uma explicação cristológica.
  rationale: O versículo preserva a tensão do clamor e sua evocação do salmo, mas não explica ali como esse abandono deve ser entendido teologicamente.
- issue: Forma das palavras semíticas de Jesus
  choice: Preservar a transliteração marcana e apresentar logo depois a tradução.
  alternative: Omitir a expressão semítica ou harmonizá-la com a forma de Mateus, “Eli, Eli”.
  rationale: Marcos deliberadamente registra a forma semítica e depois a traduz; conservar ambas respeita sua composição e evita harmonização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Hora nona” conserva o modo de expressão do texto antigo; “clamou em alta voz” mantém a solenidade sem soar arcaico. A transliteração recebe acentos segundo a leitura natural em português.
