source:
  edition: SBLGNT
  text: Οἱ δὲ στρατιῶται ἀπήγαγον αὐτὸν ἔσω τῆς αὐλῆς, ὅ ἐστιν πραιτώριον, καὶ συγκαλοῦσιν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/016.yaml
  text: Then the soldiers led him inside the courtyard[a], which is the praetorium[b], and they call together the whole cohort.
translation:
  language: pt
  text: Então os soldados o levaram para dentro do pátio, isto é, o pretório[a], e convocaram toda a coorte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sede do governador”.'
    reason: lexical_alternative
  - marker: b
    text: Uma “coorte” era uma unidade militar romana; aqui, o termo se refere aos soldados reunidos sob autoridade romana.
    reason: cultural_note
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Então
  rationale: δέ marca aqui a progressão da narrativa, sem contraste forte; “Então” produz uma transição natural em português.
- source_word: στρατιῶται
  choice: soldados
  rationale: É o equivalente direto e corrente para os integrantes da força militar.
- source_word: ἀπήγαγον
  choice: levaram
  rationale: No contexto, o verbo indica conduzir alguém a um destino; “levaram” é natural e mantém o sentido.
- source_word: ἔσω τῆς αὐλῆς
  choice: para dentro do pátio
  rationale: Expressa tanto o movimento para o interior quanto o sentido espacial de αὐλή, sem especificar além do texto.
- source_word: ὅ ἐστιν πραιτώριον
  choice: isto é, o pretório
  rationale: A fórmula grega introduz uma explicação. “Pretório” preserva o termo administrativo romano e sua especificidade histórica.
- source_word: συγκαλοῦσιν
  choice: convocaram
  rationale: Comunica de modo natural a ação de chamar pessoas para que se reunissem. O presente histórico grego foi vertido pelo pretérito, mais idiomático na narrativa portuguesa.
- source_word: ὅλην τὴν σπεῖραν
  choice: toda a coorte
  rationale: “Coorte” preserva o sentido técnico de uma unidade militar romana; a nota esclarece que, neste contexto, o termo designa os soldados reunidos sob autoridade romana.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantêm-se os termos históricos “pretório” e “coorte”, acompanhados de notas explicativas. O presente histórico de συγκαλοῦσιν foi normalizado para o pretérito narrativo em português.
