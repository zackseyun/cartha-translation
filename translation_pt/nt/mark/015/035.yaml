  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καί τινες τῶν παρεστηκότων ἀκούσαντες ἔλεγον· ⸀Ἴδε Ἠλίαν φωνεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/035.yaml
  text: And some of those standing there[a], when they heard it, were saying, “Look, he is calling Elijah.”
translation:
  language: pt
  text: 'E alguns dos que estavam ali, ao ouvirem isso, diziam: “Olhem! Ele está chamando Elias.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele está chamando por Elias.”'
    reason: Alternativa lexical para φωνεῖ com objeto direto, que pode ser entendida como chamar alguém ou chamar por alguém.
lexical_decisions:
- source_word: καί
  choice: E
  rationale: Conectivo comum que mantém a continuidade narrativa com o clamor anterior de Jesus, sem acrescentar uma nuance temporal.
- source_word: τινες
  choice: alguns
  rationale: Indica uma parte não especificada das pessoas presentes e soa natural em português atual.
- source_word: τῶν παρεστηκότων
  choice: dos que estavam ali
  rationale: Expressa de modo idiomático tanto a presença quanto a localização concreta das pessoas junto à cena.
- source_word: ἀκούσαντες
  choice: ao ouvirem isso
  rationale: A construção temporal comunica que ouviram antes de reagir; “isso” explicita naturalmente o objeto subentendido, o clamor de Jesus.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito português preserva o aspecto durativo ou repetido do imperfeito grego sem afirmar repetição de maneira excessiva.
- source_word: Ἴδε
  choice: Olhem!
  rationale: Imperativo atual e natural para chamar a atenção de um grupo; evita o arcaísmo de “Eis”.
- source_word: Ἠλίαν
  choice: Elias
  rationale: Forma portuguesa convencional do nome do profeta.
- source_word: φωνεῖ
  choice: está chamando
  rationale: O presente progressivo é natural na fala direta e mantém a possibilidade de chamar Elias pelo nome, sem inserir explicitamente a ideia de pedir sua vinda.
theological_decisions:
- issue: Explicitar ou não que os presentes entenderam equivocadamente o clamor de Jesus como um chamado a Elias
  choice: Manter no texto principal a afirmação direta “Ele está chamando Elias”
  alternative: “Ele está chamando por Elias” ou “Eles pensaram que ele estava chamando Elias”
  rationale: O grego registra a fala dos presentes, não uma explicação do narrador. A forma direta preserva a tensão e deixa que o contexto revele o equívoco.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Dos que estavam ali” é mais concreto que “dos presentes”; “Olhem!” reproduz a fala espontânea dirigida a várias pessoas. O marcador [a] aparece no texto principal e remete à alternativa lexical.
