  text: καὶ γνοὺς ἀπὸ τοῦ κεντυρίωνος ἐδωρήσατο τὸ ⸀πτῶμα τῷ Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/045.yaml
  text: And after learning from the centurion[a], he granted the body to Joseph.
translation:
  language: pt
  text: E, depois de saber pelo centurião, concedeu o corpo[a] a José.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «cadáver» ou «corpo morto».
    reason: πtῶμα designa mais especificamente um corpo morto; «corpo» é a formulação principal mais natural em português narrativo.
lexical_decisions:
- source_word: γνοὺς
  choice: depois de se informar
  rationale: O particípio aoristo tem valor temporal/circunstancial e indica que Pilatos agiu após obter a informação; a formulação é natural em português e preserva a sequência.
- source_word: ἀπὸ τοῦ κεντυρίωνος
  choice: com o centurião
  rationale: Embora ἀπό com genitivo indique a fonte da informação, em português 'informar-se com alguém' expressa naturalmente que Pilatos confirmou o fato junto ao centurião. 'Centurião' mantém a precisão histórica.
- source_word: ἐδωρήσατο
  choice: concedeu
  rationale: O verbo pode significar dar ou outorgar como favor; 'concedeu' combina com a autorização oficial de Pilatos para entregar o corpo.
- source_word: πτῶμα
  choice: corpo
  rationale: O termo designa especificamente um cadáver, mas 'corpo' é a forma narrativa mais natural e digna em português; o contexto deixa claro que se trata do corpo morto.
- source_word: τῷ Ἰωσήφ
  choice: a José
  rationale: O dativo marca José como destinatário da concessão.
