id: MRK.15.12
reference: Mark 15:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸂πάλιν ἀποκριθεὶς ἔλεγεν⸃ αὐτοῖς· Τί οὖν ⸀θέλετε ποιήσω ⸂ὃν λέγετε⸃ ⸀τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/012.yaml
  text: Pilate answered them again[a], “Then what do you want me to do with the one you call the king of the Jews?”
translation:
  language: pt
  text: 'Pilatos lhes respondeu novamente: “Então, o que vocês querem que eu faça com aquele a quem vocês chamam de rei dos judeus?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: novamente
  rationale: O advérbio assinala que Pilatos volta a falar no diálogo; “novamente” é claro e natural em português.
- source_word: ἀποκριθεὶς ἔλεγεν
  choice: perguntou
  rationale: A construção narrativa introduz uma resposta em forma de pergunta. “Perguntou” evita a formulação pouco natural “respondendo, dizia” e representa com clareza a função da fala no contexto.
- source_word: Τί οὖν
  choice: Então, o que
  rationale: “Então” preserva a inferência ligada à exigência anterior da multidão e soa natural no diálogo.
- source_word: θέλετε
  choice: vocês querem
  rationale: Neste contexto, θέλω expressa desejo ou preferência; “querem” é corrente e direto.
- source_word: ποιήσω
  choice: que eu faça
  rationale: O subjuntivo aoristo dependente de θέλετε é expresso idiomaticamente em português por “querem que eu faça”.
- source_word: ὃν λέγετε
  choice: aquele a quem vocês chamam
  rationale: A oração relativa atribui a designação aos interlocutores. Esta formulação mantém essa distância retórica sem acrescentar uma afirmação de Pilatos.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: rei dos judeus
  rationale: É o título político recorrente na narrativa da paixão. A inicial minúscula corresponde ao uso descritivo na fala, sem impor uma leitura confessional.
theological_decisions:
- issue: Se as palavras de Pilatos endossam a realeza de Jesus ou refletem a designação usada pela multidão
  choice: “aquele a quem vocês chamam de rei dos judeus”
  alternative: “aquele que vocês dizem ser o rei dos judeus”
  rationale: A oração ὃν λέγετε põe a designação na boca dos interlocutores. A tradução conserva a distância retórica de Pilatos sem transformar a frase em confissão ou negação de sua parte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” torna explícito o referente coletivo de αὐτοῖς e θέλετε. Não há nota textual necessária neste versículo; a alternativa inglesa fornecida não representa uma diferença substantiva que exija nota em português.
