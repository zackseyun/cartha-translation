source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος βουλόμενος τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, καὶ παρέδωκεν τὸν Ἰησοῦν φραγελλώσας ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/015.yaml
  text: So Pilate[a], wanting to satisfy the crowd, released Barabbas to them; and after having Jesus flogged, he handed him over to be crucified.
translation:
  language: pt
  text: Então Pilatos, querendo satisfazer a multidão[a], soltou-lhes Barrabás; e, depois de mandar açoitar Jesus, entregou-o para ser crucificado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “agradar à multidão”. Literalmente: “fazer o que era suficiente para a multidão”.'
    reason: Alternativa lexical e forma literal do idioma grego.
lexical_decisions:
- source_word: βουλόμενος
  choice: querendo
  rationale: Expressa a vontade ou intenção de Pilatos de modo natural, sem sugerir deliberação maior do que o texto indica.
- source_word: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: satisfazer a multidão
  rationale: Reproduz com clareza o sentido idiomático de atender à exigência da multidão, preservando a tensão política e moral do contexto.
- source_word: ἀπέλυσεν
  choice: soltou
  rationale: No contexto de um prisioneiro, é uma forma corrente e clara de dizer que Pilatos o pôs em liberdade.
- source_word: αὐτοῖς
  choice: -lhes
  rationale: Mantém a referência à multidão como beneficiária da decisão de soltar Barrabás.
- source_word: παρέδωκεν
  choice: entregou-o
  rationale: Preserva o sentido de colocar Jesus sob o poder de outros, importante na narrativa da Paixão.
- source_word: φραγελλώσας
  choice: depois de mandar açoitar Jesus
  rationale: Explicita a anterioridade do particípio aoristo e a responsabilidade de Pilatos por ordenar o açoite, sem afirmar que ele o executou pessoalmente.
- source_word: ἵνα σταυρωθῇ
  choice: para ser crucificado
  rationale: Expressa de forma natural a finalidade da entrega, mantendo a voz passiva do grego.
- source_word: Βαραββᾶν
  choice: Barrabás
  rationale: Segue a forma tradicional e amplamente reconhecida do nome em português.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Segue a forma consagrada do nome em português.
theological_decisions:
- issue: O motivo de Pilatos em τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: Pilatos quis satisfazer a exigência da multidão
  alternative: Pilatos quis agradar à multidão
  rationale: “Satisfazer” comunica melhor o apaziguamento político e o atendimento da demanda popular; “agradar” é possível, mas pode soar brando demais.
- issue: A responsabilidade de Pilatos no particípio φραγελλώσας
  choice: Pilatos mandou açoitar Jesus
  alternative: Pilatos açoitou Jesus
  rationale: A formulação causativa é natural no contexto de autoridade judicial e evita sugerir que Pilatos realizou pessoalmente o castigo, sem diminuir sua responsabilidade.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Multidão”, “açoitar” e “crucificado” preservam o tom narrativo bíblico sem arcaísmo excessivo.
