  naturalness: “Para que lhes soltasse Barrabás de preferência” é português moderno e claro no contexto narrativo, preservando a força preferencial de μᾶλλον sem exigir uma expansão interpretativa. “Os principais sacerdotes” é a designação mais corrente e reconhecível para ἀρχιερεῖς em português bíblico contemporâneo.
  terminology: “Principais sacerdotes” representa adequadamente o grupo dirigente sacerdotal referido por ἀρχιερεῖς, sem sugerir múltiplos ocupantes do cargo de sumo sacerdote. “Incitaram a multidão” e “soltasse Barrabás” são fiéis e naturais.
  issues:
