revisions:
- from: Mas os chefes dos sacerdotes incitaram a multidão para que Pilatos lhes soltasse Barrabás em vez de Jesus.[a]
  to: Mas os principais sacerdotes incitaram a multidão para que lhes soltasse Barrabás de preferência.[a]
  rationale: A revisão remove as explicitações de Pilatos e Jesus do texto principal, preservando o sujeito e o termo de comparação implícitos no grego. Mantém-se a relação de preferência expressa por μᾶλλον por meio de “de preferência”, com nota que registra alternativas e explica a implicitação contextual. “Principais sacerdotes” adota a designação portuguesa mais estabelecida para o grupo sacerdotal dirigente.
