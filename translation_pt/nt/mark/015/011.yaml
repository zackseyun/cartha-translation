base_translation:
  language: en
  yaml_path: translation/nt/mark/015/011.yaml
  text: But the chief priests stirred up the crowd so that he would release Barabbas to them instead[a][b].
translation:
  language: pt
  text: Mas os principais sacerdotes incitaram a multidão para que lhes soltasse Barrabás de preferência.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que lhes soltasse Barrabás antes” ou “em vez disso”. O termo grego traduzido por “de preferência” expressa que Barrabás devia ser solto em preferência à alternativa implícita no contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mas
  rationale: δέ introduz aqui um contraste suave com a expectativa apresentada no contexto anterior; “Mas” expressa essa relação naturalmente.
- source_word: ἀρχιερεῖς
  choice: os chefes dos sacerdotes
  rationale: Designa a liderança sacerdotal de Jerusalém. Esta formulação é clara em português amplo e evita sugerir a existência simultânea de vários sumos sacerdotes em exercício.
- source_word: ἀνέσεισαν
  choice: incitaram
  rationale: O verbo ἀνασείω indica despertar ou instigar um grupo a agir; “incitaram” transmite com precisão a ação deliberada dos líderes.
- source_word: τὸν ὄχλον
  choice: a multidão
  rationale: ὄχλος designa a multidão reunida no cenário narrativo; a escolha é corrente, clara e digna.
- source_word: ἵνα
  choice: para que
  rationale: Introduz o propósito pretendido pela ação dos chefes dos sacerdotes.
- source_word: μᾶλλον
  choice: em vez de Jesus
  rationale: μᾶλλον marca preferência pela libertação de Barrabás; o objeto da comparação está implícito no grego e é explicitado a partir do contexto imediato para produzir português natural, com nota que preserva a forma mais estrita.
- source_word: τὸν Βαραββᾶν
  choice: Barrabás
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: ἀπολύσῃ
  choice: soltasse
  rationale: O aoristo do subjuntivo depois de ἵνα expressa o resultado pretendido; o imperfeito do subjuntivo é a construção portuguesa natural após “para que” em narrativa passada.
- source_word: αὐτοῖς
  choice: lhes
  rationale: O pronome dativo apresenta a multidão como beneficiária da soltura; “lhes soltasse” é idiomático e conserva essa relação.
theological_decisions:
- issue: Sujeito implícito de ἀπολύσῃ
  choice: Pilatos
  alternative: 'deixar o sujeito sem nome: “para que lhes soltasse”'
  rationale: O sujeito não está expresso nesta oração grega, mas Pilatos é inequívoco no contexto imediato. Explicitá-lo evita uma construção portuguesa pouco clara sem introduzir uma interpretação teológica.
- issue: Termo de comparação implícito em μᾶλλον
  choice: Jesus
  alternative: traduzir apenas “antes” ou “em vez disso”
  rationale: O contexto estabelece Jesus como a alternativa a Barrabás. A explicitação torna a preferência compreensível em português; a nota registra que o nome não se repete no texto grego deste versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Chefes dos sacerdotes” é transparente para leitores comuns; “incitaram” preserva a força deliberada do verbo. A explicitação contextual de Pilatos e Jesus favorece a fluidez sem ocultar, graças à nota, a concisão do original.
