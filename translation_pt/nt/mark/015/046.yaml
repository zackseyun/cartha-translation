source:
  edition: SBLGNT
  text: καὶ ἀγοράσας ⸀σινδόνα καθελὼν αὐτὸν ἐνείλησεν τῇ σινδόνι καὶ ⸀ἔθηκεν αὐτὸν ἐν ⸀μνημείῳ ὃ ἦν λελατομημένον ἐκ πέτρας, καὶ προσεκύλισεν λίθον ἐπὶ τὴν θύραν τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/046.yaml
  text: And after buying a linen cloth[a], he took him down, wrapped him in the linen cloth, and laid him in a tomb that had been cut out of rock[c][b]. Then he rolled a stone against the entrance of the tomb.
translation:
  language: pt
  text: Depois de comprar um pano de linho[a], ele o tirou da cruz, envolveu-o no pano de linho e o colocou num túmulo que havia sido escavado na rocha[b]. Então rolou uma pedra contra a entrada[c] do túmulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lençol de linho” ou “mortalha”.
    reason: lexical_alternative
  - marker: b
    text: Ou “talhado na rocha”.
    reason: lexical_alternative
  - marker: c
    text: Ou “porta”; o termo grego pode significar “porta”, “entrada” ou “abertura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σινδόνα / σινδόνι
  choice: pano de linho / pano de linho
  rationale: σινδών designa um tecido de linho que, neste contexto, serve para envolver o corpo. “Pano de linho” é claro e não especifica além do texto que se tratava de uma mortalha.
- source_word: καθελών
  choice: o tirou da cruz
  rationale: O verbo καθαιρέω indica tirar ou fazer descer; no contexto imediato, o referente implícito é a cruz. A explicitação torna a ação natural e inequívoca em português sem alterar seu sentido contextual.
- source_word: ἐνείλησεν
  choice: envolveu-o
  rationale: O verbo significa envolver ou enrolar em algo. “Envolveu-o” é natural, preciso e adequado ao contexto funerário.
- source_word: ἔθηκεν
  choice: o colocou
  rationale: τίθημι aqui descreve a colocação do corpo no túmulo. “Colocou” é corrente e respeitoso, sem acrescentar uma postura corporal não expressa no grego.
- source_word: μνημείῳ / μνημείου
  choice: túmulo / túmulo
  rationale: μνημεῖον refere-se aqui a um lugar de sepultamento escavado na rocha; “túmulo” comunica adequadamente esse tipo de estrutura.
- source_word: λελατομημένον ἐκ πέτρας
  choice: que havia sido escavado na rocha
  rationale: O particípio perfeito passivo apresenta o túmulo no estado resultante de já ter sido aberto na rocha. “Escavado na rocha” é idiomático e preserva πέτρα como formação rochosa.
- source_word: προσεκύλισεν
  choice: rolou
  rationale: O verbo descreve o movimento da pedra por rolamento até junto da abertura; a direção e o fechamento são expressos naturalmente pela frase preposicional seguinte.
- source_word: ἐπὶ τὴν θύραν τοῦ μνημείου
  choice: contra a entrada do túmulo
  rationale: θύρα pode designar tanto porta quanto entrada ou abertura. “Entrada” evita sugerir uma porta com dobradiças e se ajusta ao túmulo fechado por uma pedra.
- source_word: ἀγοράσας
  choice: Depois de comprar
  rationale: O particípio aoristo indica uma ação anterior às ações principais. “Depois de comprar” preserva com clareza essa sequência temporal.
