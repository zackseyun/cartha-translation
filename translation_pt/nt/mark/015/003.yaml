lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a conexão narrativa simples e o fluxo paratático característico de Marcos.
- source_word: κατηγόρουν
  choice: faziam acusações
  rationale: O imperfeito indica ação contínua ou repetida no passado; a construção com “faziam” comunica esse aspecto de modo natural em português.
- source_word: αὐτοῦ
  choice: contra ele
  rationale: O genitivo regido por κατηγορέω identifica a pessoa acusada; em português, “contra ele” explicita naturalmente essa relação.
- source_word: οἱ ἀρχιερεῖς
  choice: os principais sacerdotes
  rationale: Designa as principais autoridades sacerdotais, e não vários ocupantes simultâneos do cargo singular de sumo sacerdote.
- source_word: πολλά
  choice: muitas acusações
  rationale: O neutro plural indica a multiplicidade das matérias alegadas. A formulação é clara e natural, embora torne explícito o substantivo implícito no grego.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperfeito foi mantido para expressar a continuidade das acusações.
