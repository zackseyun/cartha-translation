  text: And the chief priests were accusing him of many things[a].
translation:
  language: pt
  text: E os principais sacerdotes o acusavam de muitas coisas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “faziam muitas acusações contra ele”.'
