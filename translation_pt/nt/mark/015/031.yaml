review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente o contraste irônico de «salvou ... salvar», o imperfeito de ἔλεγον e a designação coletiva de οἱ ἀρχιερεῖς. Contudo, a ordem e a ligação sintática de «junto com os escribas, zombavam e diziam uns aos outros» deslocam πρὸς ἀλλήλους para o verbo principal «diziam» de modo mais definitivo do que o grego exige. É preferível conservar a ligação mais imediata com a zombaria, sem excluir que a fala fosse recíproca.
  naturalness: «Zombavam entre si e diziam» é natural, claro e evita a leitura indesejada de que os sacerdotes zombavam uns dos outros como alvo da zombaria. «Da mesma forma ... também» representa idiomaticamente a força comparativa e aditiva inicial.
  terminology: «Principais sacerdotes», «escribas» e a repetição «salvou ... salvar» são adequados, consistentes e teologicamente não restritivos.
  issues:
  - severity: medium
    issue: A expressão «uns aos outros» é ligada exclusivamente a «diziam» no texto principal.
    rationale: Em ἐμπαίζοντες πρὸς ἀλλήλους μετὰ τῶν γραμματέων ἔλεγον, πρὸς ἀλλήλους segue imediatamente o particípio «zombando» e pode caracterizar a zombaria/troca de zombaria entre eles. A versão principal deve preservar essa relação sem fixar indevidamente uma análise sintática.
  - severity: low
    issue: A nota atual descreve de forma excessivamente ampla «a zombaria praticada entre eles».
    rationale: Em contexto, «entre si» significa que eles trocavam palavras de escárnio entre si, não que fossem mutuamente o objeto de zombaria. A nota pode enunciar a ambiguidade de escopo de modo mais preciso.
  revised_text: 'Da mesma forma, os principais sacerdotes também, junto com os escribas, zombavam entre si e diziam: “Salvou os outros; não consegue salvar a si mesmo.”'
  revised_footnotes:
  - marker: a
    text: 'Ou: “zombavam e diziam uns aos outros”. A expressão grega «entre si» pode realçar a troca recíproca de palavras entre os principais sacerdotes, com os escribas participando.'
    reason: alternativa sintática e lexical
  revision_rationale: 'A revisão aproxima a ordem e o escopo sintático do grego: os principais sacerdotes, com os escribas, participam da zombaria, e «entre si» é mantido junto de «zombavam». A nota registra de maneira precisa a possível ligação da expressão recíproca com «diziam».'
