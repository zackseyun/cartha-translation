  text: ὁμοίως καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες πρὸς ἀλλήλους μετὰ τῶν γραμματέων ἔλεγον· Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/031.yaml
  text: In the same way the chief priests[a], mocking among themselves with the scribes, were saying, “He saved others; he cannot save himself.”
translation:
  language: pt
  text: 'Da mesma forma, os principais sacerdotes também, junto com os escribas, zombavam entre si e diziam: “Salvou os outros; não consegue salvar a si mesmo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως καί
  choice: Do mesmo modo, também
  rationale: Preserva tanto a comparação com as zombarias anteriores quanto a força aditiva de καί, em português natural.
- source_word: οἱ ἀρχιερεῖς
  choice: os principais sacerdotes
  rationale: Designa as autoridades sacerdotais dirigentes sem sugerir que vários homens exerciam simultaneamente o cargo singular de sumo sacerdote.
- source_word: ἐμπαίζοντες
  choice: zombavam
  rationale: Expressa a zombaria hostil do particípio; a forma verbal coordenada produz uma frase clara e corrente em português.
- source_word: πρὸς ἀλλήλους
  choice: uns aos outros
  rationale: Mantém a reciprocidade da expressão grega e, nesta construção, liga-a naturalmente ao ato de falar.
- source_word: μετὰ τῶν γραμματέων
  choice: junto com os escribas
  rationale: Indica que os escribas participavam da zombaria com os principais sacerdotes.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito comunica uma fala em andamento ou repetida sem explicitação excessiva.
- source_word: Ἄλλους ἔσωσεν
  choice: Salvou os outros
  rationale: Tradução direta que conserva a amplitude de σῴζω e a ironia deliberada da provocação.
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: não consegue salvar a si mesmo
  rationale: Conserva a ideia de incapacidade e repete o verbo salvar, como no grego; “a si mesmo” dá a ênfase reflexiva adequada.
theological_decisions:
- issue: Repetição de σῴζω nas duas orações
  choice: salvou ... salvar
  alternative: livrou ... livrar; resgatou ... resgatar
  rationale: A repetição preserva o vínculo verbal e a ironia teológica da fala, sem limitar o sentido à libertação física nem impor uma interpretação doutrinária mais estreita.
- issue: Relação sintática de πρὸς ἀλλήλους com a zombaria e a fala
  choice: diziam uns aos outros
  alternative: zombavam entre si, junto com os escribas
  rationale: A opção principal evita que o português sugira que eles zombavam uns dos outros e entende a expressão recíproca como referente à conversa; a nota mantém a outra ligação sintática possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Principais sacerdotes” é preferido a “sumos sacerdotes” para representar o grupo dirigente. O ponto e vírgula conserva a formulação incisiva das duas orações da provocação.
