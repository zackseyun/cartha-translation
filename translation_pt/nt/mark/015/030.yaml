  text: σῶσον σεαυτὸν ⸀καταβὰς ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/030.yaml
  text: Save yourself[a], coming down from the cross!
translation:
  language: pt
  text: Salve a si mesmo[a], descendo da cruz!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Salve a si mesmo, tendo descido da cruz”; ou: “Salve a si mesmo; desça da cruz!”'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: σῶσον
  choice: Salve
  rationale: Imperativo aoristo na segunda pessoa do singular, usado aqui como desafio zombeteiro. “Salve” é direto, natural e mantém a ligação com a linguagem de salvação sem reduzir o sentido a mero livramento físico.
- source_word: σεαυτόν
  choice: a si mesmo
  rationale: Pronome reflexivo no acusativo, objeto direto de σῶσον. “A si mesmo” preserva com clareza a força reflexiva e a ironia da provocação.
- source_word: καταβάς
  choice: descendo
  rationale: Particípio aoristo ativo de καταβαίνω. O gerúndio português representa naturalmente a ação associada ao imperativo, sem impor de modo inequívoco uma relação instrumental, temporal ou uma segunda ordem coordenada.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: da cruz
  rationale: Expressa movimento para longe da cruz; “descer da cruz” é a formulação idiomática e corrente neste contexto.
theological_decisions:
- issue: Relação do particípio καταβάς com o imperativo σῶσον
  choice: “Salve a si mesmo, descendo da cruz!”
  alternative: “Salve a si mesmo; desça da cruz!” ou “Salve a si mesmo depois de descer da cruz!”
  rationale: O grego apresenta um imperativo seguido de um particípio aoristo numa provocação condensada. O gerúndio conserva essa vinculação sintática e a ambiguidade entre ação associada, meio e circunstância, sem transformar necessariamente o particípio em outro imperativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A colocação “a si mesmo” evita a possível ambiguidade regional de “salve-se” e preserva a ênfase reflexiva do grego.
