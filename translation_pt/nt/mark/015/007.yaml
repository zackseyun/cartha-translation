  text: ἦν δὲ ὁ λεγόμενος Βαραββᾶς μετὰ τῶν ⸀στασιαστῶν δεδεμένος οἵτινες ἐν τῇ στάσει φόνον πεποιήκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/007.yaml
  text: The man called Barabbas was bound with the rebels who had committed murder in the rebellion[a].
translation:
  language: pt
  text: O homem chamado Barrabás estava preso com os rebeldes que, durante a rebelião, haviam cometido assassinato.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com os insurgentes” / “durante a revolta”. O grego usa termos relacionados para os participantes de uma revolta e para a própria revolta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: estava
  rationale: O imperfeito ἦν descreve o estado de Barrabás; δέ é um conectivo leve cuja força pode ser deixada ao fluxo do contexto em português, sem acrescentar um marcador temporal.
- source_word: ὁ λεγόμενος
  choice: o homem chamado
  rationale: A construção com artigo e particípio identifica Barrabás pela designação, sem a conotação depreciativa que “o assim chamado” poderia sugerir.
- source_word: Βαραββᾶς
  choice: Barrabás
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: μετὰ τῶν στασιαστῶν
  choice: com os rebeldes
  rationale: στασιασταί designa participantes de uma revolta; “rebeldes” é claro, natural e adequado ao contexto político-criminal.
- source_word: δεδεμένος
  choice: preso
  rationale: O particípio perfeito passivo de δέω significa literalmente estar amarrado ou acorrentado; neste contexto de custódia, “preso” comunica naturalmente o estado resultante sem afirmar especificamente o tipo de restrição física.
- source_word: οἵτινες
  choice: que
  rationale: Introduz uma oração descritiva referente aos rebeldes; o relativo simples é natural em português.
- source_word: ἐν τῇ στάσει
  choice: durante a rebelião
  rationale: στάσις denota aqui revolta ou insurreição. “Durante” expressa naturalmente o valor contextual de ἐν, e “rebelião” mantém a relação lexical com “rebeldes”.
- source_word: φόνον πεποιήκεισαν
  choice: haviam cometido assassinato
  rationale: A forma verbal indica ação concluída anteriormente. “Cometer assassinato” preserva a força criminal de φόνος sem acrescentar que houve apenas uma vítima.
theological_decisions: []
