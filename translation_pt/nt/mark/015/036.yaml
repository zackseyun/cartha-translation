  text: δραμὼν δέ ⸂τις καὶ⸃ γεμίσας σπόγγον ὄξους ⸀περιθεὶς καλάμῳ ἐπότιζεν αὐτόν, λέγων· Ἄφετε ἴδωμεν εἰ ἔρχεται Ἠλίας καθελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/036.yaml
  text: Then someone ran[a], filled a sponge with sour wine, put it on a reed, and gave him a drink, saying, “Leave him alone[b]. Let us see whether Elijah is coming to take him down.”
translation:
  language: pt
  text: 'Então alguém correu, encheu uma esponja de vinho azedo[a], colocou-a numa cana e lhe dava de beber, dizendo: “Deixem-no![b] Vejamos se Elias vem descê-lo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vinho azedo” era uma bebida barata e ácida feita de vinho; não significa necessariamente vinagre culinário no sentido moderno.
    reason: cultural_note
  - marker: b
    text: 'Ou: “Esperem!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δραμὼν
  choice: correu
  rationale: O particípio aoristo apresenta a ação inicial da sequência; em português narrativo, a forma finita coordenada é mais natural.
- source_word: τις καὶ
  choice: alguém
  rationale: O pronome indefinido identifica uma pessoa não especificada. O καί associado à expressão não exige aqui a tradução separada por “também”.
- source_word: γεμίσας σπόγγον ὄξους
  choice: encheu uma esponja de vinho azedo
  rationale: ὄξος designa vinho azedo ou avinagrado, uma bebida barata e ácida; “vinho azedo” evita a ideia moderna de vinagre culinário puro.
- source_word: περιθεὶς καλάμῳ
  choice: colocou-a numa vara de junco
  rationale: A expressão descreve a colocação da esponja em um κάλαμος para erguê-la. “Vara de junco” preserva o sentido lexical e esclarece sua função como haste.
- source_word: ἐπότιζεν αὐτόν
  choice: lhe dava de beber
  rationale: O imperfeito apresenta a ação em curso, aspecto preservado naturalmente por “dava”, sem afirmar que Jesus efetivamente bebeu.
- source_word: Ἄφετε
  choice: Deixem-no!
  rationale: O imperativo pede que os demais parem ou o deixem naquele momento. A formulação concisa conserva o objeto implícito no contexto sem acrescentar “em paz”.
- source_word: ἴδωμεν εἰ ἔρχεται Ἠλίας
  choice: Vejamos se Elias vem
  rationale: A construção expressa a proposta de observar se Elias intervirá; o presente “vem” mantém a vivacidade de ἔρχεται.
- source_word: καθελεῖν αὐτόν
  choice: descê-lo
  rationale: No contexto da crucificação, καθαιρέω significa retirar alguém de um lugar elevado. “Descê-lo” é conciso e mantém a referência contextual à cruz sem explicitá-la no texto.
theological_decisions:
- issue: Sentido do imperativo Ἄφετε
  choice: “Deixem-no!” como ordem para que os demais não interfiram por enquanto
  alternative: “Esperem!”
  rationale: O verbo pode ter o sentido literal de deixar ou parar, mas, neste contexto, também pode funcionar idiomaticamente como um pedido para esperar. O texto principal preserva o sentido mais direto, e a nota registra a alternativa sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sequência de particípios foi convertida em verbos coordenados, e o imperfeito de ἐπότιζεν foi preservado em “lhe dava de beber”. Todos os marcadores de nota aparecem junto ao trecho correspondente.
