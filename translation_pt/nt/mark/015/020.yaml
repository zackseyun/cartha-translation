source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν πορφύραν καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια ⸂τὰ ἴδια⸃. καὶ ἐξάγουσιν αὐτὸν ἵνα ⸀σταυρώσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/020.yaml
  text: And when they had mocked him, they stripped the purple robe off him and put his own clothes on him. And they lead him out to crucify him.
translation:
  language: pt
  text: Depois de zombarem dele, tiraram-lhe o manto púrpura[a] e vestiram-no com as suas próprias roupas. Então o levam para fora a fim de crucificá-lo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a veste púrpura” ou “a capa púrpura”. O grego diz simplesmente “a púrpura”, deixando a peça de roupa subentendida pelo contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “para que o crucificassem”. O grego emprega uma oração que expressa finalidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: zombarem
  rationale: O verbo descreve escárnio ou tratamento zombeteiro. “Zombarem” é direto, corrente e mantém o tom solene da narrativa.
- source_word: ἐξέδυσαν
  choice: tiraram-lhe
  rationale: O verbo indica retirar de alguém uma peça de roupa. A construção comunica claramente a ação sem sugerir que Jesus a retirou por si mesmo.
- source_word: πορφύραν
  choice: manto púrpura
  rationale: O grego diz literalmente “a púrpura”, com a peça de roupa subentendida pelo contexto. “Manto púrpura” torna a referência explícita e remete naturalmente à veste de falsa realeza da cena anterior.
- source_word: ἐνέδυσαν
  choice: vestiram-no com
  rationale: Preserva o sentido causativo de vestir outra pessoa e forma um contraste claro com a retirada do manto.
- source_word: τὰ ἱμάτια τὰ ἴδια
  choice: as suas próprias roupas
  rationale: “Roupas” é natural no português moderno, e “próprias” preserva a ênfase de τὰ ἴδια nas roupas pessoais de Jesus.
- source_word: ἐξάγουσιν
  choice: o levam para fora
  rationale: O presente histórico grego é mantido para preservar a vivacidade e a mudança de aspecto verbal da narrativa.
- source_word: ἵνα σταυρώσωσιν αὐτόν
  choice: a fim de crucificá-lo
  rationale: A locução expressa com clareza a finalidade da ação, refletindo a oração de propósito formada por ἵνα com o subjuntivo.
- source_word: σταυρώσωσιν
  choice: crucificá-lo
  rationale: “Crucificar” corresponde precisamente ao modo de execução indicado pelo verbo e é plenamente compreensível.
theological_decisions:
- issue: Descrição narrativa da humilhação de Jesus antes da crucificação
  choice: Apresentar diretamente o escárnio, a retirada da veste de falsa realeza, a devolução de suas próprias roupas e sua condução para a crucificação.
  alternative: Acrescentar explicações simbólicas sobre realeza, expiação ou cumprimento profético no corpo do versículo.
  rationale: O texto narra os atos sem explicitar sua interpretação teológica. A tradução preserva a humilhação evidente na cena sem inserir conclusões doutrinárias que pertencem à interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. O presente histórico em “o levam” foi preservado deliberadamente; “a fim de” mantém de modo natural a finalidade expressa no grego.
