id: MRK.15.43
reference: Mark 15:43
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἐλθὼν Ἰωσὴφ ⸀ὁ ἀπὸ Ἁριμαθαίας εὐσχήμων βουλευτής, ὃς καὶ αὐτὸς ἦν προσδεχόμενος τὴν βασιλείαν τοῦ θεοῦ, τολμήσας εἰσῆλθεν πρὸς ⸀τὸν Πιλᾶτον καὶ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/043.yaml
  text: Joseph of Arimathea[a], a respected council member who was himself also waiting for the kingdom of God[d][c][b], boldly went in to Pilate and asked for the body of Jesus.
translation:
  language: pt
  text: José de Arimateia, membro respeitado do Conselho, que também esperava o Reino de Deus, tomou coragem, apresentou-se diante de Pilatos e pediu o corpo de Jesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: '[incorporado à progressão da ação]'
  rationale: O particípio aoristo introduz a ação de José. Em português, traduzi-lo separadamente como “tendo vindo” seria pesado e redundante antes de “apresentou-se”; seu valor narrativo fica naturalmente incorporado à sequência.
- source_word: ὁ ἀπὸ Ἁριμαθαίας
  choice: de Arimateia
  rationale: Forma idiomática e concisa em português para indicar a procedência de José, refletindo adequadamente ἀπό.
- source_word: εὐσχήμων
  choice: respeitado
  rationale: Expressa estima e posição social em linguagem atual. “Ilustre”, “proeminente” e “honrado” também são possíveis, mas podem elevar ou restringir indevidamente a nuance.
- source_word: βουλευτής
  choice: membro do Conselho
  rationale: Traduz o cargo sem identificar explicitamente o órgão como Sinédrio, especificação provável no contexto, mas não presente no termo grego.
- source_word: ὃς καὶ αὐτὸς
  choice: que também
  rationale: Preserva a inclusão enfática de José entre os que aguardavam o Reino. O pronome αὐτός não precisa ser vertido por “ele próprio”, formulação menos natural aqui em português.
- source_word: ἦν προσδεχόμενος
  choice: esperava
  rationale: O imperfeito perifrástico descreve uma atitude contínua de expectativa. “Esperava” comunica isso de modo claro e natural.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: Tradução direta e consagrada da expressão central no Evangelho, sem resolver além do texto a natureza ou o momento desse Reino.
- source_word: τολμήσας
  choice: tomou coragem
  rationale: Preserva a ideia de ousar diante de risco ou dificuldade e mantém a relação do particípio com a ação seguinte. É mais explícito que um simples advérbio como “corajosamente”.
- source_word: εἰσῆλθεν πρὸς τὸν Πιλᾶτον
  choice: apresentou-se diante de Pilatos
  rationale: Comunica naturalmente a entrada de José na presença de Pilatos. Evita o pouco idiomático “entrou até Pilatos”, sem reduzir a expressão a um mero deslocamento.
- source_word: ᾐτήσατο
  choice: pediu
  rationale: Verbo corrente e adequado para solicitar que o corpo lhe fosse entregue; o complemento explicita o objeto pedido.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: o corpo de Jesus
  rationale: Tradução formal, transparente e solene da construção genitiva.
theological_decisions:
- issue: Identidade do conselho a que José pertencia
  choice: membro do Conselho
  alternative: membro do Sinédrio
  rationale: Embora o contexto provavelmente indique o Sinédrio, βουλευτής não o nomeia explicitamente. A redação mantém a extensão semântica do original.
- issue: Força de τολμήσας
  choice: tomou coragem
  alternative: ousou; foi corajosamente
  rationale: A formulação conserva a percepção de risco e a coragem necessária para comparecer diante de Pilatos, sem sugerir temeridade ou motivação não declarada.
- issue: Expectativa do Reino de Deus
  choice: esperava o Reino de Deus
  alternative: aguardava a chegada do Reino de Deus
  rationale: O original afirma a expectativa contínua, mas não contém substantivo equivalente a “chegada”. A tradução evita acrescentar uma formulação escatológica mais específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Conselho” recebe inicial maiúscula por funcionar contextualmente como designação institucional, sem inserir o nome histórico “Sinédrio”. A frase preserva a sequência narrativa e a ênfase na coragem de José, evitando construções participiais artificiais.
