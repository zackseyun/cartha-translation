  source_fidelity: 'A tradução representa adequadamente os elementos centrais do grego: José é identificado como sendo de Arimateia, como βουλευτής de condição respeitada, alguém que também aguardava o Reino de Deus, e cuja coragem ao dirigir-se a Pilatos é salientada. A incorporação de ἐλθών na progressão de “apresentou-se diante de Pilatos” é uma solução idiomática aceitável e não elimina a ação relevante. “Tomou coragem” transmite bem τολμήσας sem imputar uma motivação adicional.'
