  text: καὶ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη εἰς δύο ἀπ’ ἄνωθεν ἕως κάτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/038.yaml
  text: And the curtain of the temple was torn in two[b][a], from top to bottom.
translation:
  language: pt
  text: E a cortina do santuário[a] rasgou-se em duas, de cima a baixo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a cortina do templo”. O termo grego pode referir-se mais especificamente ao santuário interno do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταπέτασμα
  choice: cortina
  rationale: Designa a peça de tecido suspensa no templo. “Cortina” é clara e atual em português, preservando a imagem concreta sem acrescentar uma interpretação simbólica.
- source_word: ναοῦ
  choice: santuário
  rationale: Neste contexto, ναός se refere mais precisamente ao edifício sagrado ou recinto interno do templo, e não a todo o complexo do templo. “Santuário” comunica essa especificidade de modo natural.
- source_word: ἐσχίσθη
  choice: rasgou-se
  rationale: O aoristo passivo de σχίζω indica que a cortina sofreu a ação de ser rasgada. O uso pronominal em português é natural e não identifica um agente que o grego deixa sem expressão.
- source_word: εἰς δύο
  choice: em duas
  rationale: Expressa de maneira concisa e idiomática a divisão da cortina em duas partes; o feminino concorda naturalmente com “cortina”.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: de cima a baixo
  rationale: Preserva a direção e a extensão do rasgo em uma expressão corrente e fiel em português.
- source_word: καὶ
  choice: E
  rationale: Mantém o conectivo narrativo simples do grego, sem acrescentar uma nuance temporal.
theological_decisions:
- issue: Significado interpretativo do rasgo da cortina do santuário
  choice: Relatar o acontecimento sem explicar seu simbolismo no texto principal.
  alternative: Explicitar que o rasgo representa acesso a Deus ou juízo sobre o sistema do templo.
  rationale: O versículo descreve o acontecimento, mas não declara expressamente seu significado teológico. A tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Cortina” evita o caráter mais tradicional de “véu”; “santuário” preserva a provável especificidade de ναός. A ordem “de cima a baixo” mantém a ênfase espacial do original.
