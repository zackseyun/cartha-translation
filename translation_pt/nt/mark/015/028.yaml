  yaml_path: translation/nt/mark/015/028.yaml
  text: And[a] the scripture was fulfilled that says, "And he was numbered with the transgressors."
translation:
  language: pt
  text: 'E cumpriu-se a Escritura que diz: “E ele foi contado entre os transgressores.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo não aparece nos manuscritos gregos mais antigos, entre eles o Sinaítico e o Vaticano, do século IV, nem em antigas traduções coptas. Está, porém, preservado na maioria dos manuscritos bizantinos e na tradição latina. É provável que tenha sido acrescentado por copistas posteriores para harmonizar esta passagem com Lucas 22:37, que cita Isaías 53:12.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπληρώθη (πληρόω)
  choice: cumpriu-se
  rationale: No contexto do cumprimento de uma declaração profética das Escrituras, esta é a formulação portuguesa natural e consagrada para o aoristo passivo.
- source_word: ἀνόμων (ἄνομος)
  choice: transgressores
  rationale: Embora o sentido literal seja “os sem lei” ou “iníquos”, “transgressores” preserva o peso moral e jurídico da citação de Isaías 53:12 sem restringi-la ao sentido moderno de criminosos condenados.
- source_word: ἐλογίσθη (λογίζομαι)
  choice: foi contado
  rationale: Expressa naturalmente o passivo no sentido de ser incluído, classificado ou considerado como pertencente ao grupo mencionado.
- source_word: γραφή
  choice: Escritura
  rationale: Designa aqui um texto sagrado específico e introduz uma citação profética; a inicial maiúscula deixa clara essa referência no português moderno.
theological_decisions:
- issue: Relação da crucificação de Jesus com Isaías 53:12
  choice: Preservar a afirmação explícita de cumprimento profético
  alternative: Atenuar para “aconteceu o que estava escrito”
  rationale: O verbo grego πληρόω apresenta o acontecimento como cumprimento da Escritura, sem exigir explicação adicional sobre o modo desse cumprimento.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha de perto o grego sem soar artificial; “cumpriu-se a Escritura” e “foi contado entre” conservam a linguagem bíblica reconhecível. O marcador da nota foi colocado após a frase completa para sinalizar que a questão textual diz respeito ao versículo inteiro.
