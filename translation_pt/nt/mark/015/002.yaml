  text: καὶ ἐπηρώτησεν αὐτὸν ὁ Πιλᾶτος· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς ⸂αὐτῷ λέγει⸃· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/002.yaml
  text: And Pilate asked him[a], “Are you the king of the Jews?” And he answered him[b], “You say so.”
translation:
  language: pt
  text: 'Pilatos lhe perguntou: “Você é o rei dos judeus[a]?” Ele lhe respondeu: “É o que você diz.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos judeus da Judeia”. Aqui, a expressão “rei dos judeus” reflete a acusação política habitual apresentada a Pilatos.
    reason: lexical_alternative
  - marker: b
    text: Ou “Você diz”, ou, mais explicitamente, “Isso é o que você diz”. A resposta de Jesus é breve e conserva certa ambiguidade.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: perguntou
  rationale: O verbo pode significar perguntar ou interrogar. “Perguntou” é natural no contexto e não intensifica indevidamente o caráter formal do questionamento.
- source_word: Σὺ εἶ
  choice: Você é
  rationale: Em uma pergunta direta, reproduz com naturalidade o pronome explícito e seu possível destaque, sem recorrer ao hoje menos corrente “tu”.
- source_word: βασιλεὺς
  choice: rei
  rationale: Preserva o sentido régio e a natureza política da acusação apresentada a Pilatos.
- source_word: Ἰουδαίων
  choice: dos judeus
  rationale: “Rei dos judeus” é a formulação política reconhecível neste contexto da paixão. “Dos judeanos” é lexicalmente possível, mas menos natural e menos adequada à expressão estabelecida.
- source_word: ἀποκριθεὶς αὐτῷ λέγει
  choice: Ele lhe respondeu
  rationale: Expressa em português corrente a construção participial seguida do presente histórico, evitando uma formulação artificial como “respondendo-lhe, diz”.
- source_word: Σὺ λέγεις
  choice: É o que você diz
  rationale: Mantém a resposta breve e atribui a formulação a Pilatos sem convertê-la explicitamente em um “sim” nem em uma negação.
theological_decisions:
- issue: Força da resposta de Jesus, Σὺ λέγεις
  choice: 'Resposta contida e parcialmente ambígua: “É o que você diz.”'
  alternative: “Sim, é como você diz” ou, mais literalmente, “Você diz”
  rationale: O grego não contém um “sim” explícito. A tradução preserva a tensão entre reconhecimento e distanciamento, sem transformar a resposta numa afirmação irrestrita ou numa negação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “você” por naturalidade contemporânea; a sintaxe narrativa é fluida, e a resposta final conserva deliberadamente a concisão e a ambiguidade do grego.
