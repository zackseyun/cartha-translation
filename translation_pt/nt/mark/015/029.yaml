id: MRK.15.29
reference: Mark 15:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ οἱ παραπορευόμενοι ἐβλασφήμουν αὐτὸν κινοῦντες τὰς κεφαλὰς αὐτῶν καὶ λέγοντες· Οὐὰ ὁ καταλύων τὸν ναὸν καὶ ⸂οἰκοδομῶν ἐν τρισὶν ἡμέραις⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/029.yaml
  text: And those passing by were reviling him[a], shaking their heads and saying[b], “Aha! You who would tear down the temple and build it in three days,”
translation:
  language: pt
  text: 'Os que passavam por ali o insultavam, balançando a cabeça e dizendo: “Ah! Você que derruba o templo[a] e o constrói em três dias[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente, “o santuário”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o reconstrói em três dias”. O verbo grego significa simplesmente “construir”, embora o contexto possa dar a ideia de reconstrução.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: os que passavam por ali
  rationale: Expressa naturalmente em português a ação contínua de pessoas que passavam pelo local.
- source_word: ἐβλασφήμουν
  choice: o insultavam
  rationale: No contexto, o verbo descreve fala abusiva dirigida a Jesus; “insultavam” comunica isso sem restringir o sentido ao uso técnico de “blasfemar”.
- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: balançando a cabeça
  rationale: Equivalente idiomático contemporâneo do gesto de desprezo e zombaria.
- source_word: Οὐὰ
  choice: Ah!
  rationale: Interjeição breve que, no contexto e com a pontuação, transmite escárnio; evita o sentido de lamento que “Ai!” normalmente teria.
- source_word: ὁ καταλύων
  choice: você que derruba
  rationale: Reproduz a construção de tratamento direto e mantém o presente participial da acusação, sem acrescentar modalidade ausente do grego.
- source_word: ναὸν
  choice: o templo
  rationale: É a forma corrente e imediatamente compreensível; uma nota preserva o sentido potencialmente mais específico de santuário.
- source_word: οἰκοδομῶν ἐν τρισὶν ἡμέραις
  choice: o constrói em três dias
  rationale: Traduz diretamente “construir” e mantém a referência pronominal natural em português; “reconstrói” permanece como alternativa contextual em nota.
theological_decisions:
- issue: Referência da declaração sobre o templo
  choice: Apresentar diretamente a acusação dos zombadores, sem identificar no texto principal o templo com o corpo de Jesus.
  alternative: Explicitar que Jesus falava metaforicamente de seu corpo.
  rationale: Marcos registra a provocação segundo a perspectiva dos que passavam. A tradução deve preservar essa perspectiva narrativa e a tensão intertextual, sem importar para o versículo a interpretação apresentada em João.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A fala mantém o tom direto de zombaria. A vírgula final preserva o fato de que a frase continua no versículo seguinte.
