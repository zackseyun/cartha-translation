id: MRK.15.10
reference: Mark 15:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγίνωσκεν γὰρ ὅτι διὰ φθόνον παραδεδώκεισαν αὐτὸν οἱ ἀρχιερεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/010.yaml
  text: For he knew that the chief priests had handed him over because of envy[a].
translation:
  language: pt
  text: Pois ele sabia que os chefes dos sacerdotes o tinham entregado por inveja[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “movidos pela inveja” ou “por ciúme”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: sabia
  rationale: O imperfeito expressa a percepção contínua ou já estabelecida de Pilatos; em português idiomático, “sabia” transmite naturalmente esse valor.
- source_word: γὰρ
  choice: Pois
  rationale: A conjunção introduz a explicação do que foi dito antes, e “pois” preserva com clareza essa ligação discursiva.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo do que Pilatos sabia.
- source_word: διὰ φθόνον
  choice: por inveja
  rationale: διά com acusativo indica causa ou motivo. “Por inveja” é conciso, natural e mantém o sentido de φθόνος sem ampliá-lo.
- source_word: παραδεδώκεισαν
  choice: tinham entregado
  rationale: O mais-que-perfeito grego apresenta a entrega como anterior ao conhecimento mencionado. “Tinham entregado” preserva essa relação temporal e o contexto judicial, sem impor o sentido mais específico de “traído”.
- source_word: αὐτὸν
  choice: o
  rationale: Pronome objeto que retoma Jesus; a forma átona é natural em português.
- source_word: οἱ ἀρχιερεῖς
  choice: os chefes dos sacerdotes
  rationale: Designa as principais autoridades sacerdotais, não vários ocupantes simultâneos do cargo singular de sumo sacerdote. A expressão é clara para leitores modernos.
theological_decisions:
- issue: Motivo atribuído aos chefes dos sacerdotes
  choice: O versículo declara que eles entregaram Jesus por inveja.
  alternative: “por ciúme”
  rationale: A tradução preserva de modo direto a avaliação de Pilatos sobre o motivo deles, sem acrescentar elaboração teológica nem intensificar o sentido de φθόνος.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase segue o fluxo explicativo do grego, e o marcador [a] aparece junto ao termo ao qual se refere.
