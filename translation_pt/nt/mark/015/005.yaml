id: MRK.15.5
reference: Mark 15:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς οὐκέτι οὐδὲν ἀπεκρίθη, ὥστε θαυμάζειν τὸν Πιλᾶτον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/005.yaml
  text: But Jesus no longer answered anything[a], so that Pilate was amazed.
translation:
  language: pt
  text: Mas Jesus não respondeu mais nada[a], de modo que Pilatos ficou admirado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Mas Jesus já não deu resposta alguma, e por isso Pilatos ficou maravilhado.»'
    reason: Alternativa lexical que preserva outras formas naturais de traduzir ἀπεκρίθη e ὥστε θαυμάζειν.
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Expressa o contraste leve com as acusações e com a resposta anterior de Jesus, além de dar continuidade natural à narrativa.
- source_word: οὐκέτι
  choice: não... mais
  rationale: 'Preserva o sentido temporal de cessação: Jesus já não continuou respondendo.'
- source_word: οὐδὲν
  choice: nada
  rationale: Em combinação com a negação verbal, a construção portuguesa «não respondeu... nada» é natural e comunica a totalidade do silêncio.
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: É a equivalência corrente e adequada ao contexto de interrogatório judicial.
- source_word: ὥστε
  choice: de modo que
  rationale: Introduz claramente o resultado do silêncio de Jesus, sem sugerir necessariamente propósito.
- source_word: θαυμάζειν
  choice: ficou admirado
  rationale: Transmite de maneira natural a reação resultante de Pilatos; evita o tom mais arcaico de «maravilhou-se».
- source_word: Πιλᾶτον
  choice: Pilatos
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem da frase acompanha de perto o grego, enquanto «de modo que» explicita a relação de resultado.
