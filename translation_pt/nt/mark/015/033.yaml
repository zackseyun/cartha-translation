  text: ⸂Καὶ γενομένης⸃ ὥρας ἕκτης σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/033.yaml
  text: And when the sixth hour had come[b][a], darkness came over the whole land until the ninth hour.
translation:
  language: pt
  text: Quando chegou a sexta hora[b], houve escuridão sobre toda a terra[a] até a nona hora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sobre toda a região». A palavra grega pode referir-se a uma região ou à Terra inteira.
    reason: alternative_reading
  - marker: b
    text: Isto é, aproximadamente do meio-dia até as três horas da tarde.
    reason: cultural_note
lexical_decisions:
- source_word: γενομένης ὥρας ἕκτης
  choice: quando chegou a hora sexta
  rationale: Traduz naturalmente o genitivo absoluto com sentido temporal e preserva o modo antigo de contar as horas, esclarecido em nota.
- source_word: σκότος
  choice: escuridão
  rationale: Equivalente direto, claro e digno para o substantivo grego.
- source_word: ἐγένετο
  choice: houve
  rationale: Expressa com naturalidade em português o surgimento da escuridão, sem acrescentar uma imagem como 'caiu'.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: sobre toda a terra
  rationale: Mantém a amplitude lexical de γῆ; em português, 'terra' pode referir-se tanto à região quanto à Terra em sentido mais abrangente. A nota explicita a ambiguidade.
- source_word: ἕως ὥρας ἐνάτης
  choice: até a hora nona
  rationale: Preserva de modo coerente o sistema horário da fonte, com a equivalência moderna indicada em nota.
theological_decisions:
- issue: Alcance de γῆ na escuridão durante a crucificação
  choice: terra, mantendo no texto a amplitude do termo
  alternative: região; ou toda a Terra
  rationale: O grego γῆ admite tanto um sentido regional quanto um sentido mais amplo. A tradução não determina se a escuridão foi local ou global, e a nota conserva explicitamente as duas possibilidades.
translation_notes:
  register: 'Português moderno, claro e solene, com legibilidade brasileira. A ordem dos marcadores acompanha os elementos a que cada nota se refere: [b] após «hora sexta» e [a] após «terra».'
