source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἐθαύμασεν εἰ ἤδη τέθνηκεν, καὶ προσκαλεσάμενος τὸν κεντυρίωνα ἐπηρώτησεν αὐτὸν εἰ ⸀πάλαι ἀπέθανεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/044.yaml
  text: But Pilate was amazed that he had already died[a], and summoning the centurion, he asked him whether he had died already.
translation:
  language: pt
  text: Pilatos, porém, ficou surpreso por ele já ter morrido. Então chamou o centurião e perguntou se já fazia algum tempo que ele havia morrido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se ele estava morto havia algum tempo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμασεν
  choice: ficou surpreso
  rationale: Expressa naturalmente, em português atual, o espanto de Pilatos diante da rapidez da morte, sem o tom mais elevado ou ambíguo de “admirou-se”.
- source_word: εἰ ἤδη τέθνηκεν
  choice: por ele já ter morrido
  rationale: No contexto de um verbo de surpresa, esta construção portuguesa comunica com naturalidade a pergunta implícita introduzida por εἰ. O perfeito τέθνηκεν apresenta a morte como consumada, com seu estado resultante.
- source_word: προσκαλεσάμενος
  choice: Então chamou
  rationale: Transformar o particípio em oração coordenada preserva a sequência narrativa e produz uma frase clara e corrente em português.
- source_word: κεντυρίωνα
  choice: centurião
  rationale: É o termo histórico tradicional e preciso para o oficial romano designado por κεντυρίων.
- source_word: ἐπηρώτησεν αὐτὸν
  choice: perguntou
  rationale: O objeto fica claro pelo contexto imediato (“o centurião”); a formulação evita o possível peso de “perguntou-lhe” sem perder informação.
- source_word: εἰ πάλαι ἀπέθανεν
  choice: se já fazia algum tempo que ele havia morrido
  rationale: πάλαι indica que a morte teria ocorrido algum tempo antes, em relação ao momento da pergunta, sem necessariamente sugerir um intervalo longo. A construção escolhida comunica esse valor temporal com clareza.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases evita uma coordenação longa, e “ficou surpreso” preserva a força narrativa sem soar arcaico. O pronome “ele” mantém a referência do texto grego sem inserir explicitamente o nome de Jesus.
