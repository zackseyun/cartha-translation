review_pass:
  verdict: revise
  source_fidelity: O texto transmite adequadamente o presente histórico (σταυροῦσιν), a divisão das roupas e a distribuição determinada por sortes. Contudo, «lançando sortes sobre elas» é uma reprodução excessivamente literal de ἐπ’ αὐτά e não é a formulação mais idiomática em português para este procedimento.
  naturalness: «E eles o crucificam» e «repartem entre si as roupas dele» são claros e naturais no registro narrativo adotado. «Lançando sortes por elas» exprime com mais naturalidade em português que as roupas são os itens atribuídos por sorteio. A locução «quem ficaria com o quê» preserva bem a força distributiva de τίς τί.
  terminology: «Crucificam», «repartem», «roupas» e «lançando sortes» são escolhas modernas, claras e fiéis. «Roupas» é apropriado para ἱμάτια neste contexto e evita arcaísmo desnecessário.
  issues:
  - severity: low
    issue: Formulação preposicional de ἐπ’ αὐτά
    rationale: «Sobre elas» segue a superfície do grego, mas em português soa pouco idiomático após «lançando sortes» e pode sugerir literalmente lançar objetos sobre as roupas. «Por elas» mantém o sentido de que as sortes determinam a atribuição das roupas.
  revised_text: E eles o crucificam e repartem entre si as roupas dele, lançando sortes por elas para decidir quem ficaria com o quê.
