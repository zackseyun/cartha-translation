source:
  edition: SBLGNT
  text: καὶ ⸂σταυροῦσιν αὐτὸν καὶ⸃ διαμερίζονται τὰ ἱμάτια αὐτοῦ, βάλλοντες κλῆρον ἐπ’ αὐτὰ τίς τί ἄρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/024.yaml
  text: And they crucify him and divide his garments among themselves[a], casting lots for them to decide what each would take.
translation:
  language: pt
  text: E eles o crucificam e repartem entre si as roupas dele, lançando sortes por elas para decidir quem ficaria com o quê.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σταυροῦσιν
  choice: crucificam
  rationale: O presente histórico mantém a vivacidade característica da narrativa de Marcos e soa natural em português dentro da sequência narrativa.
- source_word: διαμερίζονται
  choice: repartem entre si
  rationale: Expressa de modo claro tanto a divisão das peças quanto sua distribuição entre os participantes.
- source_word: ἱμάτια
  choice: roupas
  rationale: Termo concreto, atual e amplamente compreensível para peças de vestuário, sem elevar artificialmente o registro.
- source_word: βάλλοντες κλῆρον
  choice: lançando sortes
  rationale: Equivalente tradicional e inteligível do procedimento de determinar uma distribuição por sorteio.
- source_word: ἐπ’ αὐτὰ
  choice: sobre elas
  rationale: Preserva de perto a relação da preposição com as roupas, sem especificar além do que o grego afirma.
- source_word: τίς τί ἄρῃ
  choice: para decidir quem ficaria com o quê
  rationale: Reproduz a força distributiva dos dois pronomes interrogativos e explicita naturalmente em português o resultado determinado pelas sortes.
theological_decisions:
- issue: Presente histórico no relato da paixão
  choice: 'Manter o presente narrativo: “crucificam” e “repartem”.'
  alternative: 'Converter para o pretérito: “crucificaram” e “repartiram”.'
  rationale: O presente histórico reflete a textura discursiva vívida de Marcos; trata-se de uma decisão narrativa, sem acréscimo doutrinário.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Roupas” evita o tom mais arcaizante de “vestes”; “ficaria com o quê” comunica com naturalidade a distribuição concreta, sem resolver além do necessário a construção grega.
