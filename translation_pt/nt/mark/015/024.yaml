revisions:
- from: E eles o crucificam e repartem entre si as roupas dele, lançando sortes sobre elas, para decidir quem ficaria com o quê.
  to: E eles o crucificam e repartem entre si as roupas dele, lançando sortes por elas para decidir quem ficaria com o quê.
  rationale: A revisão limita-se a substituir «sobre elas» por «por elas», uma construção portuguesa mais natural para sortes lançadas a fim de determinar a distribuição de objetos. O presente histórico, a distribuição das roupas e a ambiguidade distributiva de «quem ficaria com o quê» são preservados.
