  text: καὶ σὺν αὐτῷ σταυροῦσιν δύο λῃστάς, ἕνα ἐκ δεξιῶν καὶ ἕνα ἐξ εὐωνύμων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/027.yaml
  text: And with him they crucify two robbers[a], one at his right and one at his left.
translation:
  language: pt
  text: E com ele crucificam dois bandidos[a], um à sua direita e outro à sua esquerda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «assaltantes» ou «salteadores»; possivelmente «insurgentes», se o termo for entendido com conotação política.
    reason: alternativa lexical
lexical_decisions:
- source_word: σὺν αὐτῷ
  choice: com ele
  rationale: σύν com o dativo expressa acompanhamento; «com ele» é direto, natural e mantém Jesus como referência espacial da frase.
- source_word: σταυροῦσιν
  choice: crucificam
  rationale: O presente do indicativo é um presente histórico característico da narrativa vívida de Marcos. O presente português o preserva sem prejudicar a compreensão.
- source_word: δύο λῃστάς
  choice: dois assaltantes
  rationale: λῃστής designa ladrão violento, salteador ou bandido, e pode em certos contextos ter conotações insurgentes. «Assaltantes» é corrente e comunica melhor a dimensão de violência do que o termo genérico «ladrões», sem impor uma leitura política.
- source_word: ἕνα ἐκ δεξιῶν
  choice: um à sua direita
  rationale: A expressão idiomática indica posição ao lado direito; a formulação portuguesa é clara e natural.
- source_word: ἕνα ἐξ εὐωνύμων αὐτοῦ
  choice: outro à sua esquerda
  rationale: εὐώνυμος é uma forma eufemística de indicar o lado esquerdo. «Outro» torna natural o paralelismo português, enquanto «sua» explicita que as posições são relativas a Jesus.
theological_decisions:
- issue: Sentido de λῃσταί no relato da crucificação
  choice: assaltantes
  alternative: bandidos; possivelmente insurgentes
  rationale: O termo pode indicar criminosos violentos ou salteadores e, em certos contextos, pessoas ligadas à insurreição. O versículo não exige a nuance política; por isso, o texto principal conserva o sentido amplo e a nota registra as possibilidades legítimas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O presente histórico «crucificam» reproduz a vivacidade de Marcos. «À sua direita/à sua esquerda» evita rigidez literal e mantém a referência espacial inequívoca.
