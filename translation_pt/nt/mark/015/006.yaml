  text: Κατὰ δὲ ἑορτὴν ἀπέλυεν αὐτοῖς ἕνα δέσμιον ⸂ὃν παρῃτοῦντο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/006.yaml
  text: At the feast he would release for them one prisoner whom they asked for[a].
translation:
  language: pt
  text: Por ocasião da festa, ele costumava soltar para eles um preso que pedissem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que eles pediam».'
    reason: A forma grega está no imperfeito e pode ser reproduzida mais diretamente como uma ação habitual no passado; no contexto de uma prática geral, «que pedissem» é mais idiomático em português.
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: Por ocasião da festa
  rationale: κατά com o acusativo tem sentido temporal e indica a ocasião habitual da festa. δέ funciona como conexão narrativa leve e não exige uma palavra específica em português.
- source_word: ἀπέλυεν
  choice: costumava soltar
  rationale: O imperfeito expressa uma prática habitual no passado; «costumava soltar» torna esse aspecto explícito e natural em português.
- source_word: αὐτοῖς
  choice: para eles
  rationale: O dativo indica os beneficiários da soltura. «Para eles» preserva essa relação sem identificar além do texto o grupo referido.
- source_word: ἕνα δέσμιον
  choice: um preso
  rationale: Neste contexto judicial, δέσμιος é naturalmente «preso». Embora ἕνα expresse literalmente «um», em português o artigo numeral já comunica adequadamente que se tratava de uma só pessoa.
- source_word: ὃν παρῃτοῦντο
  choice: que pedissem
  rationale: παραιτέομαι significa aqui pedir ou solicitar alguém. O subjuntivo português encaixa-se naturalmente na formulação de um costume geral, enquanto a nota registra a forma mais próxima do imperfeito grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. «Festa» conserva a designação tradicional e contextual da Páscoa; «preso» evita o tom mais literário de «cativo».
