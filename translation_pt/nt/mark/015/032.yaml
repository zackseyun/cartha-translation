  text: ὁ χριστὸς ὁ ⸀βασιλεὺς Ἰσραὴλ καταβάτω νῦν ἀπὸ τοῦ σταυροῦ, ἵνα ἴδωμεν καὶ ⸀πιστεύσωμεν. καὶ οἱ συνεσταυρωμένοι ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/032.yaml
  text: Let the Messiah[a], the King of Israel, come down now from the cross[b], so that we may see and believe.” And those who were crucified with him were also insulting him.
translation:
  language: pt
  text: “Que o Messias[a], o Rei de Israel, desça agora da cruz, para que vejamos e creiamos!” E os que foram crucificados com ele também o insultavam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Cristo”. O título grego Χριστός significa “Ungido” e, neste contexto, tem sentido régio e messiânico.
    reason: alternative_reading
  - marker: b
    text: Ou “o afrontavam” ou “o injuriavam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Aqui, Χριστός funciona como título régio e messiânico no escárnio; “Messias” comunica o sentido de ungido esperado com mais clareza do que a transliteração tradicional “Cristo”.
- source_word: ὁ βασιλεὺς Ἰσραήλ
  choice: o Rei de Israel
  rationale: Mantém o título e o genitivo de modo claro e natural, preservando o foco da zombaria na pretensão régia de Jesus.
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: desça agora da cruz
  rationale: O imperativo de terceira pessoa exprime uma exigência provocadora. “Desça” é natural em português, e “agora” preserva a urgência irônica.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμεν
  choice: para que vejamos e creiamos
  rationale: Conserva a construção de finalidade com os dois subjuntivos e a formulação concisa do desafio.
- source_word: οἱ συνεσταυρωμένοι σὺν αὐτῷ
  choice: os que estavam crucificados com ele
  rationale: Expressa de maneira idiomática o estado resultante indicado pelo particípio perfeito passivo, sem acrescentar identificação não explícita nesta frase.
- source_word: ὠνείδιζον αὐτόν
  choice: o insultavam
  rationale: O imperfeito indica ação continuada; “insultavam” é corrente e transmite adequadamente a hostilidade verbal. “Também” representa o καί que associa esses homens aos zombadores anteriores.
theological_decisions:
- issue: Tradução de Χριστός em contexto de escárnio régio-messiânico
  choice: Messias
  alternative: Cristo
  rationale: O termo é usado como título, em paralelo com “Rei de Israel”, e não simplesmente como parte de um nome. “Messias” preserva essa força sem decidir além do que o contexto afirma.
translation_notes:
  register: Português moderno, claro e digno, com construção compreensível tanto no Brasil quanto em outros contextos lusófonos. A fala conserva o tom de desafio e escárnio. As formas “vejamos” e “creiamos” mantêm a estrutura do grego sem soar excessivamente arcaicas.
