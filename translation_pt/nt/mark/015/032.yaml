  source_fidelity: A fala preserva corretamente o imperativo provocador, o título messiânico e régio, a imediatidade de «agora» e a finalidade expressa por ἵνα. «Para que vejamos e creiamos» reproduz bem os dois subjuntivos. A forma «estavam crucificados», porém, pode sugerir em português uma ação de crucificação em curso, enquanto o particípio perfeito passivo grego designa os que já tinham sido crucificados com ele.
  naturalness: O português é moderno, claro e adequado ao registro narrativo. «Foram crucificados com ele» é mais direto e menos potencialmente aspectual-ambíguo do que «estavam crucificados com ele».
  terminology: «Messias» é uma escolha apropriada para ὁ χριστός no escárnio de caráter régio, e «Rei de Israel» preserva o título. «Insultavam» transmite adequadamente o imperfeito ὠνείδιζον. Na nota, «injuriavam» é uma alternativa semântica mais próxima do que «censuravam».
