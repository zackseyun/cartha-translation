review_pass:
  verdict: revise
  source_fidelity: A tradução transmite a ação de pedir e o caráter habitual de ἐποίει. Contudo, «a multidão subiu» soa espacialmente pouco motivado em português neste contexto; ἀναβάς descreve a aproximação da multidão a Pilatos. Além disso, «pedir que ele fizesse como costumava fazer» conserva a forma comparativa, mas fica menos clara do que a elipse grega permite em português.
  naturalness: «A multidão se aproximou» é mais idiomático e narrativamente claro. «Começou a pedir-lhe que fizesse o que costumava fazer por eles» expressa de modo natural o pedido cujo conteúdo é elíptico no grego, sem especificar qual era o costume.
  terminology: «Multidão», «pedir», «costumava fazer» e «por eles» são adequados, modernos e fiéis aos termos e ao aspecto verbal do original.
  issues:
  - severity: medium
    issue: «A multidão subiu» é uma reprodução excessivamente literal de ἀναβάς.
    rationale: Embora ἀναβαίνω possa significar literalmente «subir», neste cenário a ideia relevante é a multidão ir ao encontro/aproximar-se de Pilatos. «Subiu» sem um destino ou referência espacial soa artificial em português e pode sugerir uma elevação física não requerida pelo texto.
  - severity: low
    issue: A construção «pedir que ele fizesse como costumava fazer» é sintaticamente pesada e deixa a elipse pouco inteligível.
    rationale: O grego permite que o objeto de αἰτεῖσθαι permaneça implícito; em português, «pedir-lhe que fizesse o que costumava fazer por eles» mantém essa indefinição substantiva sem introduzir o conteúdo específico do costume.
  revised_text: E a multidão se aproximou e começou a pedir-lhe que fizesse o que costumava fazer por eles.[a]
  revised_footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “E a multidão, tendo subido, começou a pedir conforme costumava fazer por eles.”'
    reason: Alternativa mais formal que reproduz de perto o particípio ἀναβάς e a construção elíptica introduzida por καθώς.
