revisions:
- from: E a multidão subiu e começou a pedir que ele fizesse como costumava fazer por eles.[a]
  to: E a multidão se aproximou e começou a pedir-lhe que fizesse o que costumava fazer por eles.[a]
  rationale: A revisão substitui o literalismo pouco natural «subiu» por «se aproximou», que comunica a função contextual do particípio sem acrescentar um destino. Também torna fluente em português a construção elíptica de καθώς + ἐποίει, preservando a indefinição quanto ao ato costumeiro de Pilatos e o valor habitual do imperfeito.
