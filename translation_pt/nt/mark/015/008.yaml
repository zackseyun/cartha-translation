  yaml_path: translation/nt/mark/015/008.yaml
  text: And the crowd came up and began to ask him to do as he used to do for them[a].
translation:
  language: pt
  text: E a multidão se aproximou e começou a pedir-lhe que fizesse o que costumava fazer por eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “E a multidão, tendo subido, começou a pedir conforme costumava fazer por eles.”'
    reason: Alternativa mais formal que reproduz de perto o particípio ἀναβάς e a construção elíptica introduzida por καθώς.
lexical_decisions:
- source_word: ἀναβὰς
  choice: subiu
  rationale: O particípio aoristo de ἀναβαίνω indica movimento para cima ou aproximação; “subiu” preserva de modo conciso a imagem espacial do grego sem especificar além do texto.
- source_word: ὁ ὄχλος
  choice: a multidão
  rationale: ὄχλος designa naturalmente uma multidão ou grupo numeroso; “a multidão” é corrente e adequado ao contexto narrativo.
- source_word: ἤρξατο αἰτεῖσθαι
  choice: começou a pedir
  rationale: A construção ἄρχομαι com infinitivo expressa o início da ação, e αἰτέω significa pedir ou solicitar. “Começou a pedir” é natural e mantém o aspecto ingressivo.
- source_word: καθὼς
  choice: como
  rationale: καθώς significa “como” ou “assim como”. A tradução conserva a relação comparativa sem transformar explicitamente a expressão naquilo que a multidão pedia.
- source_word: ἐποίει
  choice: costumava fazer
  rationale: O imperfeito de ποιέω tem aqui valor habitual; “costumava fazer” comunica claramente uma prática repetida no passado.
- source_word: αὐτοῖς
  choice: por eles
  rationale: O dativo pode ter sentido benefactivo. “Por eles” expressa que a prática de Pilatos beneficiava a multidão, embora “para eles” também seja possível.
