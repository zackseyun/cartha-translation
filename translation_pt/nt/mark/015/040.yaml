  text: Ἦσαν δὲ καὶ γυναῖκες ἀπὸ μακρόθεν θεωροῦσαι, ἐν ⸀αἷς καὶ ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸀ἡ Ἰακώβου τοῦ μικροῦ καὶ ⸀Ἰωσῆτος μήτηρ καὶ Σαλώμη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/040.yaml
  text: There were also women watching from a distance[a], among whom were Mary Magdalene, Mary the mother of James the younger and of Joses, and Salome[c][b],
translation:
  language: pt
  text: Havia também mulheres observando de longe[a]. Entre elas estavam Maria Madalena, Maria, mãe de Tiago, o Menor[b], e de Josés[c], e Salomé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à distância”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Tiago, o pequeno”. O grego não especifica se a designação se refere à idade, à estatura, à importância ou a outra forma de distinção.
    reason: lexical_alternative
  - marker: c
    text: O nome grego aqui é Josés, uma forma distinta de José.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ καὶ
  choice: Havia também
  rationale: Expressa com naturalidade o imperfeito de εἰμί e a força aditiva de καί; δέ funciona aqui como transição narrativa leve, sem exigir tradução separada.
- source_word: γυναῖκες
  choice: mulheres
  rationale: Equivalente português direto e atual para o plural de γυνή neste contexto.
- source_word: ἀπὸ μακρόθεν
  choice: de longe
  rationale: Locução idiomática e clara que preserva a ideia espacial de distância.
- source_word: θεωροῦσαι
  choice: observando
  rationale: O particípio presente indica atenção visual contínua; “observando” mantém esse aspecto sem sugerir mera visão passageira.
- source_word: ἐν αἷς
  choice: Entre elas estavam
  rationale: Identifica naturalmente algumas mulheres dentro do grupo maior e evita a rigidez de uma construção relativa literal.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Maria Madalena
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: Μαρία ἡ Ἰακώβου τοῦ μικροῦ καὶ Ἰωσῆτος μήτηρ
  choice: Maria, mãe de Tiago, o mais jovem, e de Josés
  rationale: Torna explícito que μήτηρ rege os dois genitivos, ao mesmo tempo que preserva o descritor ambíguo de Tiago.
- source_word: Ἰακώβου
  choice: Tiago
  rationale: Forma consagrada em português bíblico para Ἰάκωβος neste contexto.
- source_word: τοῦ μικροῦ
  choice: o mais jovem
  rationale: É uma leitura contextualmente plausível e mais transparente que “o Menor”, mas a nota preserva outras nuances possíveis de μικρός.
- source_word: Ἰωσῆτος
  choice: Josés
  rationale: Translitera a forma grega distinta Ἰωσῆς/Ἰωσῆτος, sem harmonizá-la com José.
- source_word: Σαλώμη
  choice: Salomé
  rationale: Forma portuguesa convencional do nome próprio.
theological_decisions:
- issue: Sentido do descritor τοῦ μικροῦ aplicado a Tiago
  choice: “o mais jovem”, com nota de alternativa
  alternative: “o Menor” ou “o pequeno”
  rationale: O grego pode indicar idade, estatura ou distinção relativa. A tradução principal oferece uma designação natural, mas a nota evita apresentar a nuance como certa.
- issue: Identidade do segundo filho de Maria
  choice: Preservar o nome Josés
  alternative: Harmonizar como José
  rationale: A forma do texto grego é distinta da forma comum de José; preservá-la evita uma identificação que o versículo não faz explicitamente.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural para leitores brasileiros e compreensão internacional. A divisão em duas frases melhora a clareza sem alterar a relação lógica do original. Os marcadores aparecem imediatamente após as expressões a que se referem.
