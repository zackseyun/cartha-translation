  text: ἰδὼν δὲ ὁ κεντυρίων ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ ὅτι ⸀οὕτως ἐξέπνευσεν εἶπεν· Ἀληθῶς ⸂οὗτος ὁ ἄνθρωπος⸃ υἱὸς ⸂θεοῦ ἦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/039.yaml
  text: When the centurion[a], who was standing opposite him, saw that he breathed his last in this way, he said, “Truly this man was God's Son.”
translation:
  language: pt
  text: 'Quando o centurião, que estava de pé em frente a ele, viu que ele havia expirado daquela maneira, disse: “Verdadeiramente, este homem era Filho de Deus”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Verdadeiramente, este homem era um filho de Deus”. A expressão grega pode ser entendida em sentido qualitativo ou indefinido, embora, no contexto de Marcos, provavelmente tenha a força do título “Filho de Deus”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Quando ... viu
  rationale: O particípio aoristo ἰδών tem sentido temporal neste contexto. O δέ é uma conexão leve e não exige uma conjunção explícita em português.
- source_word: κεντυρίων
  choice: centurião
  rationale: É o termo tradicional, preciso e amplamente compreensível para o oficial romano designado por κεντυρίων.
- source_word: ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ
  choice: que estava de pé diante dele
  rationale: Preserva tanto a posição já assumida indicada pelo particípio perfeito quanto o sentido espacial de estar defronte ou em frente a Jesus.
- source_word: ὅτι οὕτως ἐξέπνευσεν
  choice: que ele havia expirado daquela maneira
  rationale: “Expirar” conserva a imagem de ἐκπνέω e também comunica naturalmente a morte; “daquela maneira” mantém o valor de οὕτως e a relação com o modo como Jesus morreu.
- source_word: Ἀληθῶς
  choice: Verdadeiramente
  rationale: Mantém a força solene e afirmativa do advérbio grego.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: este homem
  rationale: É a equivalência direta, natural e adequada ao referente masculino específico.
- source_word: υἱὸς θεοῦ
  choice: Filho de Deus
  rationale: A construção predicativa sem artigo pode ter força qualitativa ou definida. Em português, “Filho de Deus” preserva a formulação titular no contexto de Marcos sem inserir um artigo definido ausente do grego.
- source_word: ἦν
  choice: era
  rationale: Reproduz naturalmente o imperfeito de εἰμί e o ponto de vista passado da declaração do centurião.
theological_decisions:
- issue: Força de υἱὸς θεοῦ na declaração do centurião
  choice: Filho de Deus
  alternative: um filho de Deus
  rationale: No contexto narrativo de Marcos, a expressão evoca um título cristológico importante, mas sua forma grega sem artigo também admite discussão qualitativa ou indefinida. O texto principal mantém a força titular sem acrescentar o artigo definido em português, e a leitura alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Centurião” conserva a precisão histórica; “havia expirado” organiza naturalmente a anterioridade da morte em relação à percepção e à fala do oficial. O marcador de nota aparece após a declaração à qual se refere.
