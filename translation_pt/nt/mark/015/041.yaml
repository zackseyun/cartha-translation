id: MRK.15.41
reference: Mark 15:41
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀αἳ ὅτε ἦν ἐν τῇ Γαλιλαίᾳ ἠκολούθουν αὐτῷ καὶ διηκόνουν αὐτῷ, καὶ ἄλλαι πολλαὶ αἱ συναναβᾶσαι αὐτῷ εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/041.yaml
  text: These women[a], when he was in Galilee, used to follow him and minister to him[b]; and there were many other women who had gone up with him to Jerusalem.
translation:
  language: pt
  text: Essas mulheres, quando ele estava na Galileia, costumavam segui-lo e servi-lo[a]; e havia muitas outras mulheres que tinham subido com ele para Jerusalém[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prestavam-lhe assistência”. O verbo grego pode indicar serviço, cuidado ou apoio prático.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “subido com ele para Jerusalém”, segundo a maneira bíblica tradicional de falar da ida a Jerusalém como uma subida.
    reason: cultural_note
lexical_decisions:
- source_word: αἳ
  choice: Essas mulheres
  rationale: O pronome relativo retoma as mulheres mencionadas no versículo anterior. Em português, “Essas mulheres” torna a retomada clara e permite que o versículo funcione naturalmente como frase completa.
- source_word: ὅτε ἦν ἐν τῇ Γαλιλαίᾳ
  choice: quando ele estava na Galileia
  rationale: Reproduz de modo direto a oração temporal e a localização, sem explicitação desnecessária.
- source_word: ἠκολούθουν
  choice: costumavam segui-lo
  rationale: O imperfeito descreve uma ação habitual no passado; “costumavam” comunica essa continuidade melhor do que o simples “seguiram”.
- source_word: διηκόνουν αὐτῷ
  choice: servi-lo
  rationale: διακονέω pode indicar serviço, cuidado e apoio prático. “Servi-lo” é natural e amplo em português, sem sugerir necessariamente um cargo eclesiástico posterior.
- source_word: ἄλλαι πολλαὶ
  choice: muitas outras mulheres
  rationale: O referente feminino é claro no contexto; repetir “mulheres” evita ambiguidade em português.
- source_word: αἱ συναναβᾶσαι αὐτῷ
  choice: que tinham subido com ele
  rationale: O particípio aoristo indica uma ação anterior à situação narrada. “Tinham subido” preserva tanto essa relação temporal quanto a imagem tradicional da subida a Jerusalém.
- source_word: εἰς Ἱεροσόλυμα
  choice: para Jerusalém
  rationale: Expressa naturalmente o destino indicado por εἰς com nome de cidade.
theological_decisions:
- issue: Natureza do serviço das mulheres expresso por διηκόνουν
  choice: servi-lo
  alternative: prestar-lhe assistência; ministrar a ele
  rationale: “Servi-lo” mantém a amplitude do verbo grego, que pode envolver cuidado e apoio prático, sem reduzir a atividade a tarefas domésticas nem importar a ideia técnica de um ministério ou cargo eclesiástico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Costumavam segui-lo” comunica o aspecto habitual do imperfeito; “servi-lo” evita o sentido eclesiástico que “ministrar” pode adquirir. A estrutura coordenada com ponto e vírgula preserva a unidade do período grego.
