  yaml_path: translation/nt/mark/015/022.yaml
  text: And they bring him to the place Golgotha[a], which is translated, “Place of a Skull.”
translation:
  language: pt
  text: E levaram-no a Gólgota, o lugar que, traduzido, é “Lugar da Caveira”.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Lugar de uma caveira”. A expressão grega Κρανίου Τόπος não traz artigo; conforme o contexto, pode ser entendida como “lugar de uma caveira” ou “lugar da caveira”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: levaram
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma natural na narrativa portuguesa. “Levaram” indica movimento até o destino sem afirmar que Jesus foi carregado fisicamente.
- source_word: ἐπὶ τὸν Γολγοθᾶν τόπον
  choice: ao lugar chamado Gólgota
  rationale: “Ao” expressa o movimento em direção ao lugar. A formulação portuguesa preserva τόπον e identifica naturalmente Gólgota como o nome do local; “chamado” é uma explicitação idiomática, não uma informação adicional substancial.
- source_word: Γολγοθᾶν
  choice: Gólgota
  rationale: O nome próprio é transliterado na forma tradicional e amplamente reconhecida em português.
- source_word: μεθερμηνευόμενον
  choice: traduzido
  rationale: O particípio indica a tradução ou interpretação do nome semítico. “Traduzido” mantém esse sentido lexical e funciona naturalmente na oração explicativa.
- source_word: Κρανίου Τόπος
  choice: Lugar da Caveira
  rationale: A construção com “da Caveira” é idiomática e tradicional em português. Embora o grego não tenha artigo, o português normalmente emprega a contração definida em nomes descritivos desse tipo; a alternativa formalmente possível é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa natural. O pretérito perfeito evita um presente histórico menos uniforme em português. A nota preserva a ambiguidade da construção grega sem tornar o texto principal artificial.
