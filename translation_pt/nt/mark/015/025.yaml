  text: Ἦν δὲ ὥρα τρίτη καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/025.yaml
  text: It was the third hour[a], and they crucified him.
translation:
  language: pt
  text: Era a terceira hora[a], e o crucificaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, por volta das nove horas da manhã, segundo a maneira judaica comum de contar as horas do dia.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν
  choice: Era
  rationale: O imperfeito de εἰμί introduz idiomaticamente a indicação de tempo; em português, “Era” é a forma natural e concisa.
- source_word: δὲ
  choice: e
  rationale: Aqui, δέ funciona como conectivo narrativo leve, sem contraste forte; “e” preserva a progressão do relato sem acrescentar uma ideia temporal ausente.
- source_word: ὥρα τρίτη
  choice: a terceira hora
  rationale: Mantém a expressão temporal antiga do texto-fonte e deixa sua conversão aproximada ao horário moderno para a nota.
- source_word: ἐσταύρωσαν
  choice: crucificaram
  rationale: Traduz diretamente o aoristo ativo e emprega o termo corrente e preciso para a execução por crucificação.
- source_word: αὐτόν
  choice: o
  rationale: Pronome objeto que retoma Jesus; a forma átona “o” é natural e inequívoca no contexto.
theological_decisions:
- issue: Expressão temporal e sua relação com a cronologia
  choice: Manter “a terceira hora” no texto principal.
  alternative: Traduzir como “cerca das nove horas da manhã”.
  rationale: O versículo apresenta a designação temporal antiga sem convertê-la. Preservá-la evita introduzir no texto uma harmonização cronológica ou um esquema explicativo específico, enquanto a nota oferece a informação cultural necessária.
translation_notes:
  register: Português moderno, claro e digno, com formulação amplamente compreensível e boa legibilidade brasileira. A ordem “e o crucificaram” preserva concisão e continuidade narrativa.
