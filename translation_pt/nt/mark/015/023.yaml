  text: καὶ ἐδίδουν ⸀αὐτῷ ἐσμυρνισμένον οἶνον, ⸀ὃς δὲ οὐκ ἔλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/023.yaml
  text: And they were giving him wine mixed with myrrh[b][a], but he did not take it.
translation:
  language: pt
  text: E lhe davam vinho misturado com mirra[a], mas ele não o tomou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ofereciam-lhe vinho misturado com mirra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδουν
  choice: lhe davam
  rationale: O imperfeito expressa uma ação em curso ou tentada. “Lhe davam” preserva esse aspecto e permanece mais próximo de δίδωμι do que “ofereceram”.
- source_word: ἐσμυρνισμένον οἶνον
  choice: vinho misturado com mirra
  rationale: A expressão indica vinho preparado com mirra. Esta formulação é clara, atual e explicita naturalmente a substância envolvida.
- source_word: ὃς δὲ
  choice: mas ele
  rationale: Embora ὃς seja formalmente pronome relativo, aqui retoma Jesus de modo resumptivo; “mas ele” comunica com naturalidade a referência e a força adversativa de δέ.
- source_word: ἔλαβεν
  choice: não o tomou
  rationale: λαμβάνω pode significar “tomar” ou “receber”. “Não o tomou” é direto e usa o pronome para retomar o vinho sem ambiguidade em português.
theological_decisions:
- issue: Motivo da recusa de Jesus
  choice: Descrever a recusa sem explicar sua motivação.
  alternative: Afirmar que Jesus recusou uma bebida narcótica destinada a aliviar a dor, ou atribuir outra razão específica.
  rationale: O texto informa apenas que lhe davam vinho misturado com mirra e que ele não o tomou; não explicita a finalidade da bebida nem o motivo da recusa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi naturalizada sem eliminar o contraste do grego; evitou-se uma nota sobre a construção resumptiva porque ela não produz uma ambiguidade relevante na tradução portuguesa.
