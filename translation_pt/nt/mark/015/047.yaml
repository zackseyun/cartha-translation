id: MRK.15.47
reference: Mark 15:47
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ δὲ Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ Ἰωσῆτος⸃ ἐθεώρουν ποῦ ⸀τέθειται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/047.yaml
  text: And Mary Magdalene and Mary the mother of Joses were watching where he was laid[a].
translation:
  language: pt
  text: Maria Madalena e Maria, mãe de José, observavam onde ele tinha sido colocado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “Maria de José”. O grego identifica essa Maria por sua relação com José.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: e
  rationale: Funciona aqui como conectivo leve, dando continuidade ao relato do sepultamento, sem contraste forte.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Maria Madalena
  rationale: Forma tradicional e amplamente reconhecida em português para o nome e o epíteto identificador.
- source_word: Μαρία ἡ Ἰωσῆτος
  choice: Maria, mãe de José
  rationale: O genitivo identifica Maria por sua relação com José; à luz do uso em Marcos, explicitar “mãe de” produz português natural, enquanto a forma mais literal é preservada em nota.
- source_word: ἐθεώρουν
  choice: observavam
  rationale: O imperfeito expressa uma ação contínua no passado; “observavam” preserva esse aspecto e indica atenção ao local.
- source_word: ποῦ
  choice: onde
  rationale: Equivalente adverbial direto e natural em português.
- source_word: τέθειται
  choice: ele tinha sido colocado
  rationale: O perfeito passivo indica uma ação concluída cujo resultado permanecia; o mais-que-perfeito composto é natural na sequência narrativa, e “ele” explicita o referente contextual, Jesus.
theological_decisions:
- issue: Objeto implícito do verbo passivo
  choice: Explicitar “ele”, referindo-se a Jesus
  alternative: Explicitar “o corpo” ou manter o referente implícito
  rationale: O grego deixa o referente subentendido, mas o português natural requer que ele seja expresso. “Ele” mantém Jesus como referente pessoal, sem reduzir a referência apenas ao corpo.
- issue: Relação de Maria com José
  choice: Explicitar “mãe de José” no texto
  alternative: Traduzir literalmente “Maria de José”
  rationale: O genitivo grego é relacional e não nomeia expressamente a relação. O contexto marcano favorece a relação materna, mas a ambiguidade formal é registrada na nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Observavam” mantém o caráter contínuo da ação sem soar coloquial; “tinha sido colocado” preserva de modo natural o estado resultante expresso pelo perfeito passivo grego.
