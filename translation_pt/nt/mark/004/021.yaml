  text: Καὶ ἔλεγεν ⸀αὐτοῖς· Μήτι ⸂ἔρχεται ὁ λύχνος⸃ ἵνα ὑπὸ τὸν μόδιον τεθῇ ἢ ὑπὸ τὴν κλίνην, οὐχ ἵνα ἐπὶ τὴν λυχνίαν ⸀τεθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/021.yaml
  text: And he was saying to them[a], “A lamp does not come to be put under a basket or under a bed[b], does it? Is it not to be put on the lampstand?”
translation:
  language: pt
  text: 'E ele lhes dizia: “Será que uma lamparina vem[a] para ser posta debaixo de um cesto[b] ou debaixo da cama? Não é para ser posta sobre um suporte para lamparina?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “Será que a lamparina vem...?” O grego emprega uma imagem vívida, como se a própria lamparina viesse para ocupar seu lugar.
    reason: lexical_alternative
  - marker: b
    text: O termo grego designa um recipiente usado como medida para produtos secos; tradicionalmente, “alqueire”.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito apresenta a fala em andamento ou como parte do ensino continuado de Jesus; “dizia” preserva esse aspecto sem tornar a frase artificial.
- source_word: Μήτι
  choice: Será que ...?
  rationale: Introduz uma pergunta retórica que espera resposta negativa. “Será que” transmite essa expectativa de modo natural em português.
- source_word: ἔρχεται ὁ λύχνος
  choice: uma lamparina vem
  rationale: Preserva a personificação vívida do grego, em que a lamparina “vem”, e emprega o artigo indefinido para comunicar o sentido genérico do provérbio.
- source_word: λύχνος
  choice: lamparina
  rationale: Refere-se ao pequeno utensílio portátil, normalmente alimentado com óleo, e não à luz abstrata. “Lamparina” comunica melhor o objeto antigo do que “lâmpada” em muitos contextos modernos.
- source_word: μόδιον
  choice: cesto
  rationale: μόδιος designa uma medida para secos e, por extensão, o recipiente usado para medir. “Cesto” mantém clara a imagem doméstica, com a precisão cultural fornecida em nota.
- source_word: κλίνην
  choice: cama
  rationale: κλίνη pode indicar cama ou divã; “cama” é a opção mais direta, natural e amplamente compreensível neste quadro doméstico.
- source_word: λυχνίαν
  choice: suporte para lamparina
  rationale: λυχνία é o suporte no qual se coloca uma lamparina. A expressão é clara em português contemporâneo e evita o termo menos conhecido “lampadário”.
- source_word: ἵνα ... τεθῇ
  choice: para ser colocada
  rationale: Expressa de forma natural o propósito indicado por ἵνα com o subjuntivo passivo de τίθημι.
theological_decisions:
- issue: Preservar a personificação literal de ἔρχεται ὁ λύχνος ou interpretá-la como uma ação humana passiva
  choice: “uma lamparina vem”
  alternative: “alguém traz uma lamparina” ou “uma lamparina é trazida”
  rationale: A formulação ativa é deliberadamente vívida e proverbial. Mantê-la conserva a tensão e a força retórica do texto sem acrescentar um agente humano ausente do grego.
- issue: Valor genérico do artigo em ὁ λύχνος
  choice: “uma lamparina”
  alternative: “a lamparina”
  rationale: Embora o grego empregue artigo definido, a referência é genérica. O artigo indefinido comunica com mais naturalidade em português uma verdade proverbial aplicável a qualquer lamparina.
translation_notes:
  register: Português moderno, claro e digno, com construção retórica natural. “Lamparina” e “suporte para lamparina” preservam o cenário doméstico antigo sem recorrer a vocabulário excessivamente técnico ou arcaico.
