  text: καὶ ἐγένετο ἐν τῷ σπείρειν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ἦλθεν τὰ πετεινὰ καὶ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/004.yaml
  text: And as he was sowing[a], some seed fell along the path, and the birds came and devoured it.
translation:
  language: pt
  text: Enquanto ele semeava, parte da semente caiu à beira do caminho[a], e as aves vieram e a devoraram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: junto ao caminho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ σπείρειν
  choice: Enquanto ele semeava
  rationale: A construção narrativa ἐγένετο ἐν com infinitivo articular situa o acontecimento durante a ação. “Enquanto ele semeava” transmite naturalmente o valor temporal, sem o literalismo pouco idiomático de “aconteceu durante o semear”.
- source_word: ὃ μὲν
  choice: parte da semente
  rationale: O relativo neutro com μέν tem sentido distributivo e aponta para uma porção daquilo que era semeado. A formulação explicita em português o referente exigido pelo contexto e preserva o valor coletivo singular.
- source_word: ἔπεσεν
  choice: caiu
  rationale: Equivalente direto e natural de πίπτω neste contexto.
- source_word: παρὰ τὴν ὁδόν
  choice: à beira do caminho
  rationale: παρά com acusativo indica aqui a posição junto ao caminho. “À beira do caminho” é natural em português e se ajusta ao cenário agrícola melhor do que “estrada”.
- source_word: τὰ πετεινὰ
  choice: as aves
  rationale: πετεινά designa genericamente os animais que voam, aqui as aves que comem a semente. O grego deste versículo não acrescenta “do céu” nem “do ar”.
- source_word: κατέφαγεν
  choice: devoraram
  rationale: O composto κατεσθίω exprime consumo completo ou enfático; “devoraram” conserva essa força. O plural é exigido pela concordância natural em português com “as aves”.
- source_word: αὐτό
  choice: a
  rationale: O pronome retoma coletivamente “parte da semente”. Em português, o pronome feminino singular concorda com “semente”.
