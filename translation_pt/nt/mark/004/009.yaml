  yaml_path: translation/nt/mark/004/009.yaml
  text: And he was saying[a], “Whoever has ears to hear, let him hear.”
translation:
  language: pt
  text: 'E dizia: “Quem tem ouvidos para ouvir, ouça.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a ligação narrativa simples, sem acrescentar uma ideia temporal que a conjunção não explicita.
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito português reflete naturalmente o aspecto do imperfeito grego, sem enfatizar indevidamente repetição ou continuidade.
- source_word: Ὃς ἔχει
  choice: Quem tem
  rationale: Expressa com naturalidade a força genérica da construção relativa singular, sem restringi-la a um referente masculino.
- source_word: ὦτα
  choice: ouvidos
  rationale: Tradução literal e idiomática do plural, adequada ao caráter proverbial da declaração.
- source_word: ἀκούειν
  choice: para ouvir
  rationale: Complementa naturalmente “ouvidos” e conserva a repetição lexical com o imperativo seguinte.
- source_word: ἀκουέτω
  choice: ouça
  rationale: O presente do subjuntivo com valor imperativo é a forma portuguesa natural de reproduzir o imperativo grego de terceira pessoa, mantendo o eco de “ouvir”.
theological_decisions:
- issue: Expressão masculina genérica em uma declaração proverbial
  choice: Quem tem ouvidos para ouvir, ouça
  alternative: Aquele que tem ouvidos para ouvir, ouça
  rationale: “Quem” comunica a referência genérica do masculino singular grego sem introduzir uma especificação masculina ausente do sentido e preserva a estrutura singular e o chamado individual.
translation_notes:
  register: Português moderno, claro e digno, com cadência proverbial. O imperfeito “dizia” preserva o aspecto verbal do texto-fonte; a repetição “ouvir/ouça” mantém o efeito retórico do grego.
