  text: καὶ ⸀ἐκεῖνοί εἰσιν οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες, οἵτινες ἀκούουσιν τὸν λόγον καὶ παραδέχονται καὶ καρποφοροῦσιν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/020.yaml
  text: 'And those are the ones sown on the good soil: they hear the word and receive it and bear fruit—thirtyfold and sixtyfold and a hundredfold[a].'
translation:
  language: pt
  text: 'E estes são os que foram semeados em solo bom: eles ouvem a palavra, recebem-na[a] e dão fruto — trinta, sessenta e cem por um.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aceitam-na” ou “acolhem-na”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοί
  choice: estes
  rationale: O demonstrativo retoma o último grupo apresentado na explicação da parábola; em português, “estes” funciona naturalmente como referência aos que acabam de ser descritos.
- source_word: οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες
  choice: os que foram semeados em solo bom
  rationale: Preserva a imagem passiva da semeadura e usa “solo” como termo agrícola corrente. “Em” é natural em português para a semente lançada no solo.
- source_word: γῆν τὴν καλὴν
  choice: solo bom
  rationale: No contexto agrícola, γῆ designa a terra cultivável; “solo bom” mantém o contraste avaliativo entre os diferentes terrenos.
- source_word: οἵτινες
  choice: eles
  rationale: Abre uma nova oração explicativa em português natural, apresentando as características que definem esse grupo.
- source_word: ἀκούουσιν τὸν λόγον
  choice: ouvem a palavra
  rationale: Mantém a terminologia repetida da parábola e sua ressonância bíblica, sem restringir λόγος a uma paráfrase interpretativa.
- source_word: παραδέχονται
  choice: recebem-na
  rationale: Expressa a acolhida favorável da palavra e preserva a progressão ouvir–receber–dar fruto. O pronome retoma explicitamente “a palavra”.
- source_word: καρποφοροῦσιν
  choice: dão fruto
  rationale: É uma expressão portuguesa corrente que conserva a metáfora agrícola e sua implicação espiritual sem explicá-la além do texto.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: um a trinta, um a sessenta e um a cem
  rationale: Torna explícita a proporção da colheita em linguagem agrícola compreensível e preserva o καί repetido antes do último rendimento.
theological_decisions:
- issue: Natureza da resposta à palavra no solo bom
  choice: O versículo descreve uma acolhida genuinamente positiva da palavra proclamada, que resulta em fruto.
  alternative: Entender o solo bom como afirmação necessária da perseverança final, ou apenas como resposta inicial.
  rationale: O grego afirma que essas pessoas ouvem, recebem e dão fruto, mas não desenvolve aqui um sistema doutrinário sobre perseverança ou apostasia; a tradução não deve resolver essa tensão além do que está expresso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “um a trinta, um a sessenta e um a cem” comunica o rendimento multiplicado sem recorrer ao menos natural “trinta vezes” e conserva o ritmo cumulativo do grego.
