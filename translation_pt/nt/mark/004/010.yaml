id: MRK.4.10
reference: Mark 4:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂Καὶ ὅτε⸃ ἐγένετο κατὰ μόνας, ⸀ἠρώτων αὐτὸν οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα ⸂τὰς παραβολάς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/010.yaml
  text: And when he was alone[a], those around him with the Twelve were asking him about the parables.
translation:
  language: pt
  text: Quando ele ficou a sós, os que estavam com ele[a], juntamente com os Doze, lhe perguntavam sobre as parábolas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que estavam ao redor dele”; a expressão se refere ao círculo de seguidores de Jesus, não necessariamente apenas aos Doze.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: Quando
  rationale: O contexto temporal fica claro em português sem a necessidade de reproduzir καί por um “E” que soaria mais marcado; a continuidade narrativa permanece natural.
- source_word: ἐγένετο κατὰ μόνας
  choice: ele ficou a sós
  rationale: A expressão indica que Jesus estava em ambiente privado, afastado da multidão, e não necessariamente sem nenhuma outra pessoa presente. “Ficou a sós” é idiomático e condiz com a presença dos discípulos na sequência.
- source_word: ἠρώτων
  choice: lhe perguntavam
  rationale: O imperfeito grego apresenta a ação em andamento ou de modo continuado. O imperfeito português preserva esse aspecto sem acrescentar a ideia mais específica de insistência.
- source_word: οἱ περὶ αὐτὸν
  choice: os que estavam com ele
  rationale: A expressão designa o círculo mais amplo de seguidores em torno de Jesus. A formulação escolhida é natural e evita reduzi-los aos Doze.
- source_word: σὺν τοῖς δώδεκα
  choice: juntamente com os Doze
  rationale: Mantém a ideia de acompanhamento expressa por σύν e deixa clara a distinção entre o grupo mais amplo e os Doze.
- source_word: τὰς παραβολάς
  choice: as parábolas
  rationale: Reproduz o plural do texto grego fornecido, sem restringir a pergunta apenas à parábola imediatamente anterior.
theological_decisions:
- issue: Identidade do grupo que fez as perguntas
  choice: Um grupo mais amplo de seguidores de Jesus, juntamente com os Doze, fez as perguntas.
  alternative: Somente os Doze fizeram as perguntas.
  rationale: A construção οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα distingue naturalmente os que estavam com Jesus dos Doze, ao mesmo tempo que reúne ambos os grupos na ação.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Lhe perguntavam” conserva o aspecto durativo do imperfeito grego, e “juntamente com” explicita sem exagero a relação entre o grupo mais amplo e os Doze.
