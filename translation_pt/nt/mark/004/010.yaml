  source_fidelity: 'O texto traduz com fidelidade os elementos centrais do grego: a situação privada expressa por ἐγένετο κατὰ μόνας, o imperfeito de ἠρώτων em «lhe perguntavam», o grupo mais amplo indicado por οἱ περὶ αὐτόν, sua associação com os Doze e o plural «as parábolas». A omissão de «E» antes de «Quando» é uma adaptação sintática natural em português e não altera o encadeamento narrativo.'
  naturalness: A redação é clara, moderna e adequada ao registro bíblico acessível. «Quando ele ficou a sós» é uma formulação idiomática que, no contexto, comunica o afastamento da multidão para uma situação privada; a continuação deixa claro que não exige ausência absoluta de outras pessoas. «Juntamente com os Doze» e «lhe perguntavam sobre as parábolas» são naturais e precisos.
  terminology: «Os Doze» é a designação estabelecida e apropriada. «Parábolas» reproduz corretamente o plural grego. A nota apresenta de modo equilibrado a alternativa «os que estavam ao redor dele» e preserva a distinção entre o círculo de seguidores e os Doze, sem impor uma identificação mais restrita.
