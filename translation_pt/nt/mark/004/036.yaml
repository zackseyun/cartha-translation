  text: καὶ ἀφέντες τὸν ὄχλον παραλαμβάνουσιν αὐτὸν ὡς ἦν ἐν τῷ πλοίῳ, καὶ ἄλλα ⸀πλοῖα ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/036.yaml
  text: And leaving the crowd[a], they take him with them just as he was, in the boat[b], and other boats were with him.
translation:
  language: pt
  text: E, deixando a multidão, levaram Jesus consigo, tal como estava no barco; e outros barcos estavam com ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέντες
  choice: deixando
  rationale: O particípio aoristo indica uma ação anterior ou concomitante à ação principal. “Deixando” é natural e não impõe a ideia mais específica de despedir formalmente a multidão.
- source_word: τὸν ὄχλον
  choice: a multidão
  rationale: Expressa de modo claro e contemporâneo o grupo reunido à margem.
- source_word: παραλαμβάνουσιν αὐτόν
  choice: levaram Jesus consigo
  rationale: παραλαμβάνω aqui significa tomar ou levar alguém consigo. O nome “Jesus” evita uma sequência pronominal pouco clara em português, sem acrescentar conteúdo novo.
- source_word: ὡς ἦν
  choice: assim como estava
  rationale: Preserva a formulação concisa e sua possível referência tanto à condição em que Jesus se encontrava quanto ao fato de ele já estar no barco, sem explicar além do texto.
- source_word: ἐν τῷ πλοίῳ
  choice: no barco
  rationale: “Barco” é o termo corrente e adequado ao cenário do lago. A posição depois de “assim como estava” acompanha a ordem grega e evita sugerir de modo inequívoco que Jesus só então entrou no barco.
- source_word: ἄλλα πλοῖα
  choice: outros barcos
  rationale: Traduz diretamente o plural, sem acrescentar a ideia não expressa de que fossem barcos pequenos.
- source_word: ἦν μετ’ αὐτοῦ
  choice: o acompanhavam
  rationale: Em português, “o acompanhavam” comunica naturalmente que os outros barcos seguiam com Jesus; a concordância plural segue o sentido do sujeito neutro plural grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com preferência por uma narrativa natural. O passado perfeito (“levaram”, “acompanhavam”) ajusta o presente histórico grego ao uso narrativo corrente em português. A pontuação preserva a relação de “assim como estava” com a tomada de Jesus e sua localização no barco, sem eliminar totalmente a ambiguidade sintática do original.
