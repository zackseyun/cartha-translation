revisions:
- from: 'E ele lhes dizia: “A vocês foi dado o mistério do Reino de Deus; mas, para os que estão de fora, tudo acontece por meio de parábolas,”'
  to: 'E dizia-lhes: “A vocês foi dado o mistério do Reino de Deus; mas, para os que estão de fora, tudo vem em parábolas,”'
  rationale: A revisão substitui uma formulação instrumental potencialmente enganosa por uma expressão portuguesa natural que preserva a forma dinâmica e a ambiguidade interpretativa do grego. Também ajusta a abertura para uma ordem mais idiomática, sem alterar aspecto verbal, contraste nem registro.
