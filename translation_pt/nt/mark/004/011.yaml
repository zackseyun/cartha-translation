  text: καὶ ἔλεγεν αὐτοῖς· Ὑμῖν ⸂τὸ μυστήριον δέδοται⸃ τῆς βασιλείας τοῦ θεοῦ· ἐκείνοις δὲ τοῖς ἔξω ἐν παραβολαῖς τὰ πάντα γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/011.yaml
  text: And he was saying to them, “To you the mystery of the kingdom of God has been given, but to those outside everything comes in parables,”
translation:
  language: pt
  text: 'E dizia-lhes: “A vocês foi dado o mistério do Reino de Deus; mas, para os que estão de fora, tudo vem em parábolas,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μυστήριον
  choice: mistério
  rationale: Preserva o sentido de uma realidade divina antes oculta e agora concedida para ser conhecida, sem reduzi-la a mero segredo.
- source_word: τοῖς ἔξω
  choice: os que estão de fora
  rationale: Mantém a imagem espacial e relacional do grego, sem definir além do texto quem integra esse grupo.
- source_word: ἐν παραβολαῖς
  choice: por meio de parábolas
  rationale: Expressa o valor instrumental ou modal de ἐν de maneira natural em português.
- source_word: γίνεται
  choice: acontece
  rationale: Reproduz o caráter dinâmico de γίνεται e evita a formulação estática 'está em parábolas'.
theological_decisions:
- issue: A concessão do mistério do Reino
  choice: foi dado
  alternative: é dado
  rationale: O perfeito passivo δέδοται indica uma dádiva já concedida com efeito presente; a voz passiva preserva a ação divina implícita sem explicitá-la.
- issue: A função das parábolas para os de fora
  choice: tudo acontece por meio de parábolas
  alternative: tudo é apresentado em parábolas
  rationale: A tradução mantém a tensão do enunciado e o verbo dinâmico γίνεται, sem decidir antecipadamente se as parábolas apenas comunicam, revelam ou ocultam.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente naturalizada, mas o contraste entre 'vocês' e 'os que estão de fora', bem como a ambiguidade teológica da formulação, foi preservado.
