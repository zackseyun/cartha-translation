review_pass:
  verdict: revise
  source_fidelity: 'A primeira cláusula traduz com precisão o perfeito passivo δέδοται: «foi dado» preserva tanto a dádiva já concedida quanto seu efeito presente, sem explicitar o agente. «Mistério do Reino de Deus» corresponde diretamente a τὸ μυστήριον τῆς βασιλείας τοῦ θεοῦ. Na segunda cláusula, porém, «tudo acontece por meio de parábolas» pode sugerir que os acontecimentos se realizam instrumentalmente por parábolas. O grego ἐν παραβολαῖς τὰ πάντα γίνεται descreve antes o modo em que tudo chega/se apresenta aos de fora. «Tudo vem em parábolas» conserva o verbo dinâmico γίνεται e a concisão ambígua do original.'
  naturalness: «E ele lhes dizia» é compreensível, mas «E dizia-lhes» é mais idiomático e mantém o imperfeito iterativo. «Tudo vem em parábolas» é natural, conciso e evita a construção potencialmente equívoca «acontece por meio de».
  terminology: «Mistério», «Reino de Deus» e «os que estão de fora» são escolhas adequadas. «A vocês» preserva o contraste enfático de Ὑμῖν de modo claro para leitores brasileiros e internacionais.
  issues:
  - severity: medium
    issue: «Tudo acontece por meio de parábolas»
    rationale: A expressão instrumental «por meio de» pode alterar o alcance de ἐν παραβολαῖς, fazendo as parábolas parecerem o meio pelo qual todos os acontecimentos ocorrem. A formulação «tudo vem em parábolas» reflete melhor tanto o γίνεται dinâmico quanto a construção modal do grego e o audit trail inglês.
  revised_text: 'E dizia-lhes: “A vocês foi dado o mistério do Reino de Deus; mas, para os que estão de fora, tudo vem em parábolas,”'
  revised_footnotes: []
