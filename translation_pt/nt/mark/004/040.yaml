base_translation:
  language: en
  yaml_path: translation/nt/mark/004/040.yaml
  text: And he said to them[c][b][a], “Why are you so fearful? Do you still have no faith?”
translation:
  language: pt
  text: 'E ele lhes disse: “Por que vocês estão com medo?[a] Ainda não têm fé?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Por que vocês são covardes?”'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “fé” também pode ser entendida como “confiança”.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conjunção narrativa simples, ligando a fala ao episódio anterior.
- source_word: εἶπεν αὐτοῖς
  choice: ele lhes disse
  rationale: Forma natural e transparente de introduzir discurso direto, preservando o pronome dativo plural.
- source_word: Τί
  choice: Por que
  rationale: Com o adjetivo e o verbo ‘ser’, τί tem valor adverbial e introduz uma pergunta de repreensão.
- source_word: δειλοί
  choice: com tanto medo
  rationale: Expressa de modo natural o temor dos discípulos no contexto da tempestade, sem eliminar o tom reprovador; o sentido mais forte, ‘covardes’, é registrado em nota.
- source_word: οὔπω
  choice: Ainda não
  rationale: Reproduz diretamente o valor temporal de ‘não ainda’ e funciona naturalmente na pergunta retórica em português.
- source_word: ἔχετε πίστιν
  choice: têm fé
  rationale: Mantém o verbo de posse e traduz πίστις pelo equivalente tradicional e amplo ‘fé’, sem explicitar um objeto ausente no grego.
theological_decisions:
- issue: Sentido de πίστις no contexto do medo durante a tempestade
  choice: fé
  alternative: confiança
  rationale: ‘Fé’ preserva a amplitude do substantivo grego e a formulação teológica tradicional; ‘confiança’ é contextualmente plausível, mas poderia explicitar em excesso o sentido sem que o objeto seja declarado.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por ‘vocês’ para ampla legibilidade brasileira. A formulação preserva a repreensão, o aspecto temporal de οὔπω e a amplitude de πίστις.
