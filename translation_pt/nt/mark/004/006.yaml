  yaml_path: translation/nt/mark/004/006.yaml
  text: And when the sun rose[a], it was scorched, and because it had no root, it withered.
translation:
  language: pt
  text: E, quando o sol nasceu, ela foi queimada pelo sol e, por não ter raiz, secou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva o conectivo narrativo simples que liga o versículo ao contexto anterior.
- source_word: ὅτε ἀνέτειλεν ὁ ἥλιος
  choice: quando o sol nasceu
  rationale: Expressão temporal direta e idiomática em português para o nascer do sol.
- source_word: ἐκαυματίσθη
  choice: foi queimada pelo calor
  rationale: Comunica o dano causado pelo calor intenso do sol e explicita naturalmente em português o sentido de καυματίζω, sem sugerir necessariamente combustão.
- source_word: διὰ τὸ μὴ ἔχειν ῥίζαν
  choice: por não ter raiz
  rationale: Mantém de modo conciso a relação causal do infinitivo articular com διά e preserva o singular ῥίζαν.
- source_word: ἐξηράνθη
  choice: secou
  rationale: Reproduz o sentido de tornar-se seca ou murchar; no contexto da planta abrasada e sem raiz, 'secou' é claro e natural.
