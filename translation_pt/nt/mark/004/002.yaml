  text: 'And he was teaching them many things in parables[a], and in his teaching he was saying to them:'
translation:
  language: pt
  text: 'E ele lhes ensinava muitas coisas por meio de parábolas[a] e, em seu ensino, dizia-lhes:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ensinava-lhes muito por meio de parábolas”. O grego πολλά pode ser traduzido como “muitas coisas” ou, de forma mais compacta, “muito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: ensinava
  rationale: O imperfeito apresenta a ação como contínua no cenário; o pretérito imperfeito em português preserva esse aspecto de modo natural.
- source_word: ἐν παραβολαῖς
  choice: por meio de parábolas
  rationale: A expressão comunica com clareza o meio pelo qual Jesus ensinava, sentido possível de ἐν com o dativo, sem perder a referência explícita às parábolas.
- source_word: πολλά
  choice: muitas coisas
  rationale: O neutro plural pode designar o amplo conteúdo do ensino; “muitas coisas” é natural em português e mantém a possibilidade lexical refletida no grego.
- source_word: ἔλεγεν
  choice: dizia-lhes
  rationale: O pretérito imperfeito preserva a ação discursiva em andamento e conduz naturalmente à fala direta do versículo seguinte.
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: em seu ensino
  rationale: Mantém de perto a construção grega e associa a fala seguinte ao ensino de Jesus, sem transformar a expressão em oração temporal.
- source_word: καὶ
  choice: E
  rationale: Preserva a continuidade narrativa e o estilo paratático característico de Marcos.
- source_word: αὐτοὺς / αὐτοῖς
  choice: lhes / lhes
  rationale: Em português, o pronome oblíquo “lhes” funciona naturalmente com “ensinar” e “dizer”; em “dizia-lhes”, exprime claramente o destinatário.
