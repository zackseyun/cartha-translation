source:
  edition: SBLGNT
  text: χωρὶς δὲ παραβολῆς οὐκ ἐλάλει αὐτοῖς, κατ’ ἰδίαν δὲ τοῖς ⸂ἰδίοις μαθηταῖς⸃ ἐπέλυεν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/034.yaml
  text: And he was not speaking to them without a parable[b][a], but in private he was explaining everything to his own disciples.
translation:
  language: pt
  text: E não lhes falava sem usar uma parábola; mas, em privado, explicava tudo aos seus próprios discípulos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «interpretava tudo» ou «esclarecia tudo». O verbo grego pode significar explicar, interpretar ou expor.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς παραβολῆς
  choice: sem usar uma parábola
  rationale: Expressa naturalmente em português a ideia de não falar sem recorrer a uma parábola, preservando o singular grego.
- source_word: οὐκ ἐλάλει αὐτοῖς
  choice: não lhes falava
  rationale: O imperfeito indica ação habitual ou recorrente neste resumo narrativo; «não lhes falava» preserva esse valor.
- source_word: κατ’ ἰδίαν
  choice: em particular
  rationale: Equivalente corrente e claro para a ideia de falar em privado, em contraste com o ensino público.
- source_word: τοῖς ἰδίοις μαθηταῖς
  choice: aos seus próprios discípulos
  rationale: «Próprios» conserva a ênfase possessiva de ἰδίοις, que seria enfraquecida em «aos seus discípulos».
- source_word: ἐπέλυεν
  choice: explicava
  rationale: Neste contexto, o verbo significa explicar, interpretar ou esclarecer; «explicava» é natural, acessível e mantém o aspecto imperfeito.
- source_word: πάντα
  choice: tudo
  rationale: Preserva o alcance abrangente e não especificado do neutro plural grego, sem limitá-lo explicitamente às parábolas.
theological_decisions:
- issue: Alcance da explicação particular de Jesus
  choice: «tudo», sem especificar o conteúdo
  alternative: «todas as parábolas» ou «tudo o que havia dito»
  rationale: O grego traz apenas πάντα. Embora o contexto possa apontar para o ensino em parábolas, a tradução não deve restringir o referente além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção «não lhes falava» mantém o caráter habitual do imperfeito; «em particular» cria contraste natural com o ensino dirigido ao público.
