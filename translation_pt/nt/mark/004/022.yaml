source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ⸀κρυπτὸν ἐὰν μὴ ⸀ἵνα φανερωθῇ, οὐδὲ ἐγένετο ἀπόκρυφον ἀλλ’ ἵνα ⸂ἔλθῃ εἰς φανερόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/022.yaml
  text: For nothing is hidden except to be revealed[b][a], nor has anything become concealed except to come to light.
translation:
  language: pt
  text: Pois não há nada oculto senão para ser revelado,[a] nem nada passou a estar oculto senão para vir a público.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois não há nada oculto sem que seja revelado [...] nem nada passe a estar oculto sem que venha a público.” As orações gregas com ἵνα podem ter nuance de propósito ou de resultado.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “vir para o que é manifesto”, isto é, para o âmbito aberto ou visível.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτόν
  choice: oculto
  rationale: Expressa naturalmente aquilo que está escondido, sem acrescentar a ideia específica de segredo intencional.
- source_word: ἐὰν μὴ ἵνα
  choice: senão para
  rationale: Conserva de modo conciso tanto a construção de exceção quanto a força de propósito de ἵνα.
- source_word: φανερωθῇ
  choice: ser revelado
  rationale: Mantém a voz passiva e comunica com clareza a passagem do ocultamento à manifestação.
- source_word: ἀπόκρυφον
  choice: escondido
  rationale: Preserva o paralelismo com κρυπτόν mediante um termo próximo, mas não idêntico, e indica aquilo que foi posto fora da vista.
- source_word: ἐγένετο
  choice: foi escondido
  rationale: Em português natural, a formulação comunica a entrada no estado de ocultamento; evita o pouco idiomático 'tornou-se escondido'.
- source_word: ἔλθῃ εἰς φανερόν
  choice: vir a público
  rationale: Preserva a imagem de movimento de ἔλθῃ e traduz εἰς φανερόν como passagem para o âmbito aberto e visível.
- source_word: γάρ
  choice: Pois
  rationale: Mantém a relação explicativa com o contexto anterior.
theological_decisions:
- issue: Nuance de propósito ou resultado nas duas orações com ἵνα
  choice: 'Traduzir com força de propósito: ''para ser revelado'' e ''para vir a público''.'
  alternative: 'Traduzir com nuance de resultado: ''sem que seja revelado'' e ''sem que venha a público''.'
  rationale: ἵνα normalmente introduz propósito, mas no grego koiné também pode aproximar-se de resultado. O texto principal preserva a força final, e a nota registra a ambiguidade sem atribuir explicitamente a Deus a causa do ocultamento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo foi mantido por 'oculto/revelado' e 'escondido/vir a público'. Os marcadores aparecem junto às respectivas expressões.
