  text: καὶ οὐκ ἔχουσιν ῥίζαν ἐν ἑαυτοῖς ἀλλὰ πρόσκαιροί εἰσιν, εἶτα γενομένης θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον ⸀εὐθὺς σκανδαλίζονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/017.yaml
  text: and they have no root in themselves[a], but are temporary; then, when affliction or persecution arises because of the word, they immediately fall away.
translation:
  language: pt
  text: e não têm raiz em si mesmos, mas duram apenas algum tempo; então, quando surge aflição ou perseguição por causa da palavra, imediatamente tropeçam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se afastam”, “são feitos tropeçar” ou “ficam ofendidos”. O verbo grego pode indicar tropeço, escândalo ou afastamento diante da pressão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτοῖς
  choice: raiz em si mesmos
  rationale: Preserva a metáfora agrícola e o sentido reflexivo sem acrescentar ideias como profundidade ou firmeza, ausentes do grego.
- source_word: πρόσκαιροί
  choice: duram apenas algum tempo
  rationale: Expressa de modo natural que permanecem somente por um período, sem introduzir a nuance psicológica de inconstância.
- source_word: γενομένης θλίψεως ἢ διωγμοῦ
  choice: quando surge aflição ou perseguição
  rationale: Verte temporalmente o genitivo absoluto e mantém a distinção entre sofrimento ou pressão e perseguição.
- source_word: διὰ τὸν λόγον
  choice: por causa da palavra
  rationale: Mantém a repetição de λόγος no contexto da parábola e indica claramente a causa da aflição ou perseguição.
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Preserva a urgência característica do vocabulário de Marcos.
- source_word: σκανδαλίζονται
  choice: se afastam
  rationale: No contexto, comunica o abandono provocado pela pressão após uma recepção inicial da palavra, sem acrescentar explicitamente um objeto como “da fé”, que não consta do grego.
theological_decisions:
- issue: Sentido de σκανδαλίζονται no contexto de discipulado e abandono
  choice: se afastam
  alternative: tropeçam; são levados a tropeçar; ficam ofendidos
  rationale: 'O contexto indica mais que uma reação emocional: essas pessoas deixam de perseverar quando enfrentam aflição ou perseguição. “Se afastam” conserva essa gravidade sem decidir questões sobre sua condição salvífica final.'
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura mantém a progressão do grego e a terminologia recorrente da parábola.
