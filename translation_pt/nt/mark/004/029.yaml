  text: ὅταν δὲ ⸀παραδοῖ ὁ καρπός, ⸀εὐθὺς ἀποστέλλει τὸ δρέπανον, ὅτι παρέστηκεν ὁ θερισμός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/029.yaml
  text: But when the crop is ready[a], he immediately sends in the sickle, because the harvest has come.
translation:
  language: pt
  text: Mas, quando a plantação está pronta[a], ele logo passa a foice, porque chegou a colheita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se entrega” ou “amadurece”. O grego emprega uma expressão ativa incomum, tendo a plantação como sujeito; mais literalmente, ela “se entrega”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Mas, quando
  rationale: ὅταν introduz uma circunstância temporal indefinida, e δέ marca uma transição levemente contrastiva. “Mas, quando” reproduz com naturalidade o movimento do discurso.
- source_word: παραδοῖ
  choice: está pronta
  rationale: 'Embora παραδίδωμι costume significar “entregar”, aqui a plantação é o sujeito de uma expressão ativa incomum: ela se oferece ou se mostra disponível para a ceifa. “Está pronta” comunica claramente o sentido contextual, enquanto a nota preserva a forma inusitada do grego.'
- source_word: ὁ καρπός
  choice: a plantação
  rationale: καρπός pode designar fruto ou produto da terra. Neste contexto de semente, foice e colheita, “plantação” comunica ao leitor comum o conjunto da lavoura que chegou ao ponto de ser ceifada, sem restringi-la a uma espécie específica.
- source_word: εὐθὺς
  choice: logo
  rationale: Mantém a prontidão característica de εὐθύς em Marcos com uma forma corrente e concisa em português.
- source_word: ἀποστέλλει τὸ δρέπανον
  choice: passa a foice
  rationale: O grego diz literalmente “envia a foice”, expressão que indica o início imediato da ceifa. “Passa a foice” conserva a imagem concreta e soa natural em português.
- source_word: ὅτι
  choice: porque
  rationale: Introduz de modo claro a razão da ação imediata.
- source_word: παρέστηκεν
  choice: chegou
  rationale: O perfeito indica que a colheita chegou e agora está presente. “Chegou” preserva de maneira direta tanto a chegada quanto o estado resultante.
- source_word: ὁ θερισμός
  choice: a colheita
  rationale: É a equivalência corrente e abrangente para θερισμός neste contexto agrícola.
theological_decisions:
- issue: A prontidão metafórica da plantação na parábola do Reino
  choice: Manter a imagem agrícola da plantação que fica pronta para a colheita, sem identificar explicitamente o referente teológico.
  alternative: Interpretar a colheita diretamente como juízo, missão ou consumação final.
  rationale: A formulação da parábola não define aqui uma única aplicação teológica. A tradução preserva essa tensão e evita inserir no versículo uma interpretação denominacional ou escatológica específica.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. A construção principal é natural; a nota registra a expressão grega incomum sem sobrecarregar o texto.
