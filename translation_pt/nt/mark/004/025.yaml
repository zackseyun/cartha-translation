  text: ὃς γὰρ ⸀ἔχει, δοθήσεται αὐτῷ· καὶ ὃς οὐκ ἔχει, καὶ ⸀ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/025.yaml
  text: For whoever has[a], more will be given to him; and whoever does not have, even what he has will be taken away from him.
translation:
  language: pt
  text: Pois, a quem tem será dado mais[a]; e, de quem não tem, até o que tem será tirado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz simplesmente “será dado”; “mais” está implícito no contraste do provérbio e foi acrescentado para tornar a frase natural em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: a quem
  rationale: O relativo indefinido tem sentido genérico. “A quem” comunica a aplicação proverbial de modo natural em português, sem restringi-la a uma pessoa específica.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior e preserva de forma concisa a conexão argumentativa.
- source_word: ἔχει
  choice: tem
  rationale: Mantém o sentido simples e amplo de posse, sem especificar indevidamente o que está em vista.
- source_word: δοθήσεται αὐτῷ
  choice: mais será dado
  rationale: O grego não expressa o objeto de “será dado”, mas o contraste do provérbio implica aumento. A inclusão de “mais” torna a frase natural e inteligível em português; a nota registra a forma mais literal.
- source_word: καὶ
  choice: e
  rationale: Coordena diretamente as duas partes contrastantes do provérbio.
- source_word: οὐκ ἔχει
  choice: não tem
  rationale: É a forma corrente e direta de expressar posse negada.
- source_word: ὃ ἔχει
  choice: o que tem
  rationale: Preserva a referência ampla e não especificada do pronome relativo neutro.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: será tirado
  rationale: O futuro passivo de αἴρω com ἀπό indica remoção ou perda. Em português, a construção com “a quem” já identifica de quem aquilo será tirado, evitando uma repetição pesada.
theological_decisions:
- issue: Objeto implícito em δοθήσεται
  choice: Traduzir como “mais será dado”, com nota.
  alternative: “será dado”, sem objeto expresso.
  rationale: O original deixa o objeto implícito. O contraste entre receber e perder sugere aumento para quem tem, mas a nota conserva transparência quanto à forma grega e evita apresentar “mais” como palavra explicitamente presente.
- issue: Referência genérica no singular
  choice: Usar “a quem tem”.
  alternative: “àquele que tem” ou uma reformulação no plural.
  rationale: A formulação mantém o caráter singular e proverbial do grego, ao mesmo tempo que soa natural em português e não acrescenta uma especificação de gênero desnecessária.
- issue: Objeto não especificado de ἔχει
  choice: Manter simplesmente “tem” e “o que tem”.
  alternative: Explicitar “entendimento”, “fé”, “receptividade” ou outra realidade contextual.
  rationale: O dito deixa deliberadamente aberto aquilo que a pessoa tem. A tradução preserva essa amplitude e não resolve a tensão por meio de uma interpretação teológica particular.
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial concisa. “Pois” conserva a ligação com o contexto anterior; “a quem” oferece fluidez e aplicação genérica ampla.
