  yaml_path: translation/nt/mark/004/003.yaml
  text: Listen! Behold[a], the sower went out to sow.
translation:
  language: pt
  text: Escutem! Eis que o semeador saiu para semear.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούετε
  choice: Escutem!
  rationale: Imperativo presente ativo na segunda pessoa do plural, usado para exigir atenção. “Escutem!” é natural em português moderno e mantém a força direta da ordem.
- source_word: ἰδού
  choice: Eis que
  rationale: Partícula discursiva que chama a atenção para o que vem a seguir. “Eis que” conserva sua função enfática e narrativa sem recorrer a uma formulação excessivamente coloquial.
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Aoristo ativo indicativo de ἐξέρχομαι, indicando movimento para fora. “Saiu” é a equivalência mais direta e natural no contexto.
- source_word: ὁ σπείρων
  choice: o semeador
  rationale: Particípio presente com artigo, empregado substantivamente. Aqui designa a pessoa por sua atividade, e “o semeador” é claro, idiomático e adequado ao contexto da parábola.
- source_word: σπεῖραι
  choice: para semear
  rationale: Infinitivo aoristo que expressa propósito depois de ἐξῆλθεν. “Para semear” explicita naturalmente essa relação de finalidade em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição semeador/semear preserva o jogo lexical do grego.
