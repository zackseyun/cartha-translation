  text: καὶ οὗτοί εἰσιν ⸀ὁμοίως οἱ ἐπὶ τὰ πετρώδη σπειρόμενοι, οἳ ὅταν ἀκούσωσιν τὸν λόγον ⸀εὐθὺς μετὰ χαρᾶς λαμβάνουσιν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/016.yaml
  text: 'And these are likewise the ones sown on the rocky ground: when they hear the word[a], they immediately receive it with joy,'
translation:
  language: pt
  text: 'E estes são, do mesmo modo, os que são semeados em terreno pedregoso: quando ouvem a palavra, imediatamente a recebem com alegria,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: do mesmo modo
  rationale: Preserva a ligação analógica com a explicação anterior e soa natural em português atual.
- source_word: ἐπὶ τὰ πετρώδη
  choice: em terreno pedregoso
  rationale: Expressa naturalmente o local caracterizado por pedras ou substrato rochoso, mantendo a imagem agrícola.
- source_word: σπειρόμενοι
  choice: os semeados
  rationale: Mantém a forma participial e a identificação metafórica das pessoas com aquilo que é semeado, sem acrescentar explicação interpretativa.
- source_word: τὸν λόγον
  choice: a palavra
  rationale: Conserva a terminologia repetida no contexto da parábola e sua ressonância bíblica; aqui designa a mensagem proclamada.
- source_word: εὐθύς
  choice: imediatamente
  rationale: Preserva a força temporal do advérbio e o estilo característico de Marcos.
- source_word: μετὰ χαρᾶς
  choice: com alegria
  rationale: Reproduz diretamente a expressão de modo sem a comprimir em um advérbio.
- source_word: λαμβάνουσιν αὐτόν
  choice: a recebem
  rationale: Mantém o sentido básico de receber e não sugere, além do texto, uma aceitação duradoura.
theological_decisions:
- issue: Referente de “os semeados” na explicação da parábola
  choice: Manter a formulação parabólica “os semeados em terreno pedregoso”.
  alternative: Explicitar como “aqueles cujo coração é como terreno pedregoso”.
  rationale: O grego preserva a imagem da semeadura ao identificar as pessoas representadas; a alternativa acrescentaria uma interpretação ausente do texto.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A construção “os semeados” é deliberadamente mantida por fidelidade à metáfora, apesar de ser menos comum na fala cotidiana.
