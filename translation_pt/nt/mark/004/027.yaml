  text: καὶ καθεύδῃ καὶ ἐγείρηται νύκτα καὶ ἡμέραν, καὶ ὁ σπόρος ⸀βλαστᾷ καὶ μηκύνηται ὡς οὐκ οἶδεν αὐτός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/027.yaml
  text: and he sleeps and rises night and day[a], and the seed sprouts and grows[b], though he himself does not know how.
translation:
  language: pt
  text: E ele dorme e se levanta, noite e dia, e a semente brota e cresce[a], embora ele próprio não saiba como.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “brota e se alonga” ou “brota e fica alta”. O segundo verbo sugere especificamente alongamento ou aumento de estatura.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “como ele próprio não sabe”; o sentido é “embora ele próprio não saiba como”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεύδῃ
  choice: dorme
  rationale: O presente do subjuntivo integra a sequência da parábola e descreve uma ação habitual ou contínua; o presente do indicativo em português expressa isso com naturalidade.
- source_word: ἐγείρηται
  choice: se levanta
  rationale: A forma média/passiva tem aqui sentido intransitivo de acordar ou levantar-se. “Se levanta” é natural e não sugere ressurreição.
- source_word: νύκτα καὶ ἡμέραν
  choice: noite e dia
  rationale: Preserva a expressão temporal e o ciclo contínuo indicado pelo grego.
- source_word: σπόρος
  choice: a semente
  rationale: O artigo remete à semente já lançada na parábola; “semente” mantém o foco no que foi semeado e em seu desenvolvimento.
- source_word: βλαστᾷ
  choice: brota
  rationale: Expressa de modo claro e corrente o início visível do crescimento vegetal.
- source_word: μηκύνηται
  choice: cresce
  rationale: Embora o verbo possa enfatizar alongamento ou aumento de estatura, “cresce” é a formulação portuguesa mais natural neste contexto; a nuance específica é preservada em nota.
- source_word: ὡς
  choice: embora
  rationale: No contexto, introduz de maneira natural a tensão entre o crescimento da semente e o desconhecimento do homem quanto ao modo como isso ocorre.
- source_word: οὐκ οἶδεν αὐτός
  choice: ele próprio não saiba como
  rationale: “Ele próprio” conserva a ênfase de αὐτός, e “como” explicita em português o sentido idiomático da construção.
theological_decisions:
- issue: Agência no crescimento da semente dentro da parábola
  choice: Manter inexplicado, do ponto de vista do semeador, o modo como a semente cresce, sem nomear explicitamente o agente.
  alternative: Explicitar que Deus faz a semente crescer, ou apresentar o crescimento como processo meramente natural.
  rationale: O versículo enfatiza que o homem desconhece como ocorre o crescimento. A tradução preserva essa tensão narrativa sem acrescentar uma explicação teológica ou naturalista ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação repetida preserva o ritmo simples da narrativa grega; “noite e dia” mantém a expressão temporal, e “ele próprio” conserva a ênfase do original.
