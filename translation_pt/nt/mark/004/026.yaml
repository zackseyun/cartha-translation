  text: Καὶ ἔλεγεν· Οὕτως ἐστὶν ἡ βασιλεία τοῦ θεοῦ ⸀ὡς ἄνθρωπος βάλῃ τὸν σπόρον ἐπὶ τῆς γῆς
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/026.yaml
  text: 'And he was saying[c][b][a], “The kingdom of God is like this: as when a man casts the seed upon the ground,”'
translation:
  language: pt
  text: 'E dizia: “O reino de Deus é como se um homem lançasse a semente sobre a terra[a],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O reino de Deus é como um homem que lança semente à terra.” A comparação continua no versículo seguinte, e a construção grega é condensada.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito grego pode indicar fala contínua ou habitual; “dizia” preserva naturalmente esse aspecto em português.
- source_word: Οὕτως
  choice: é assim
  rationale: Introduz a maneira da comparação de modo corrente e digno em português.
- source_word: βασιλεία τοῦ θεοῦ
  choice: o reino de Deus
  rationale: Expressão tradicional e reconhecível, capaz de abranger tanto o domínio quanto o reinado de Deus.
- source_word: ὡς
  choice: como quando
  rationale: Introduz a comparação comprimida que prossegue no versículo seguinte, sem completá-la por paráfrase.
- source_word: ἄνθρωπος
  choice: um homem
  rationale: Mantém a forma representativa masculina singular do texto grego.
- source_word: βάλῃ
  choice: lança
  rationale: Preserva a imagem concreta de βάλλω e se ajusta ao ato agrícola de espalhar a semente.
- source_word: τὸν σπόρον
  choice: a semente
  rationale: Reproduz o artigo grego e funciona naturalmente em sentido genérico.
- source_word: ἐπὶ τῆς γῆς
  choice: sobre a terra
  rationale: No contexto agrícola, indica o chão ou solo; “terra” conserva a formulação ampla do grego.
theological_decisions:
- issue: Comparação introdutória sintaticamente incompleta, que continua no versículo seguinte
  choice: 'Manter “é assim: como quando” e deixar a comparação em aberto'
  alternative: “O reino de Deus é como um homem que semeia a semente na terra.”
  rationale: O grego Οὕτως... ὡς é comprimido e seu desenvolvimento continua no versículo 27. A redação escolhida preserva essa tensão e evita inserir uma explicação completa ausente deste versículo.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A formulação conserva o tom narrativo, a imagem agrícola e a comparação aberta do original.
