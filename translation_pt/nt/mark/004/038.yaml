  text: καὶ ⸂αὐτὸς ἦν⸃ ⸀ἐν τῇ πρύμνῃ ἐπὶ τὸ προσκεφάλαιον καθεύδων· καὶ ⸀ἐγείρουσιν αὐτὸν καὶ λέγουσιν αὐτῷ· Διδάσκαλε, οὐ μέλει σοι ὅτι ἀπολλύμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/038.yaml
  text: But he himself was in the stern[a], asleep on the cushion; and they woke him and said to him, “Teacher, do you not care that we are perishing?”
translation:
  language: pt
  text: 'Mas ele estava na parte de trás do barco, dormindo sobre o travesseiro[a]. Eles o acordaram e lhe disseram: “Mestre, o senhor não se importa que estejamos morrendo?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre a almofada”. O termo grego pode designar um travesseiro ou uma almofada usada como apoio para a cabeça.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς ἦν
  choice: ele estava
  rationale: O pronome explícito tem força contrastiva no contexto; em português, o contraste é preservado naturalmente por “Mas ele”, sem o peso pouco idiomático de “ele mesmo estava”.
- source_word: ἐν τῇ πρύμνῃ
  choice: na parte de trás do barco
  rationale: πρύμνα designa a popa. A formulação descritiva é imediatamente compreensível para leitores comuns e evita o termo náutico potencialmente menos conhecido “popa”.
- source_word: ἐπὶ τὸ προσκεφάλαιον
  choice: sobre o travesseiro
  rationale: προσκεφάλαιον designa um apoio para a cabeça, um travesseiro ou almofada. “Travesseiro” preserva diretamente essa função sem acrescentar que a cabeça de Jesus estava sobre ele.
- source_word: καθεύδων
  choice: dormindo
  rationale: O particípio expressa uma ação em curso e se integra de modo natural à oração portuguesa.
- source_word: ἐγείρουσιν
  choice: acordaram
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma narrativa natural em português.
- source_word: λέγουσιν
  choice: disseram
  rationale: Assim como ἐγείρουσιν, trata-se de presente histórico, traduzido naturalmente pelo passado em português.
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: No uso bíblico corrente em português, “Mestre” comunica com dignidade o sentido de διδάσκαλος como aquele que ensina.
- source_word: οὐ μέλει σοι
  choice: o senhor não se importa
  rationale: A expressão mantém o tom direto e acusatório da pergunta. “O senhor” fornece uma forma de tratamento natural e respeitosa, sem usar o ambíguo “você”.
- source_word: ἀπολλύμεθα
  choice: estejamos morrendo
  rationale: No contexto da tempestade, o verbo indica morte iminente. “Estejamos morrendo” soa urgente e natural em português, sem introduzir uma causa ou mecanismo não expresso.
theological_decisions:
- issue: Força narrativa da pergunta dos discípulos a Jesus
  choice: “o senhor não se importa que estejamos morrendo?”
  alternative: “não te importa que pereçamos?” ou uma formulação mais branda, como “isso não importa para o senhor?”
  rationale: A redação preserva a acusação urgente contida no grego, sem explicar os motivos de Jesus nem avaliar explicitamente a fé dos discípulos.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A tradução prefere vocabulário cotidiano (“parte de trás do barco”) e diálogo vivo, mantendo um registro digno. O tratamento “o senhor” evita regionalismos excessivos e preserva respeito.
