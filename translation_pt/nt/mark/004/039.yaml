  text: καὶ διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ εἶπεν τῇ θαλάσσῃ· Σιώπα, πεφίμωσο. καὶ ἐκόπασεν ὁ ἄνεμος, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/039.yaml
  text: And having awakened[a], he rebuked the wind and said to the sea, “Be silent! Be still!” And the wind ceased[b], and there was a great calm.
translation:
  language: pt
  text: 'E, depois de acordar[a], ele repreendeu o vento e disse ao mar: “Cale-se! Fique amordaçada![b]” Então o vento cessou, e houve uma grande calmaria.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de ter sido despertado”. A forma grega é passiva, e o contexto anterior relata que os discípulos o acordaram.'
    reason: lexical_alternative
  - marker: b
    text: O segundo verbo evoca pôr uma mordaça ou focinheira; em tradução mais idiomática, pode ser entendido como “Fique quieto!” ou “Aquiete-se!”.
    reason: lexical_note
lexical_decisions:
- source_word: διεγερθεὶς (διεγείρω)
  choice: tendo despertado
  rationale: Reproduz o valor temporal do particípio aoristo e se encaixa naturalmente no contexto em que Jesus desperta do sono, sem explicitar no texto principal se ele acordou por si ou foi despertado pelos discípulos.
- source_word: ἐπετίμησεν (ἐπιτιμάω)
  choice: repreendeu
  rationale: Preserva o tom de censura e comando autoritativo frequente no uso de Marcos, sem suavizá-lo para uma simples advertência.
- source_word: τῷ ἀνέμῳ
  choice: o vento
  rationale: Traduz diretamente o substantivo grego, sem ampliá-lo interpretativamente para 'tempestade'.
- source_word: τῇ θαλάσσῃ
  choice: ao mar
  rationale: Mantém o termo grego θάλασσα, em vez de contextualizá-lo como 'lago', preservando tanto a formulação da narrativa quanto sua força imagética.
- source_word: Σιώπα
  choice: Cale-se!
  rationale: Imperativo direto e vigoroso, natural em português quando alguém ordena silêncio.
- source_word: πεφίμωσο (φιμόω)
  choice: Fique amordaçado!
  rationale: Conserva a metáfora forte do verbo, literalmente ligado a pôr uma mordaça ou focinheira, e o valor resultativo do imperativo perfeito passivo.
- source_word: ἐκόπασεν (κοπάζω)
  choice: cessou
  rationale: Expressa de modo conciso que o vento parou ou amainou.
- source_word: γαλήνη μεγάλη
  choice: uma grande calmaria
  rationale: Segue de perto a expressão grega e mantém a repetição marcana de grandeza presente no contexto.
theological_decisions:
- issue: Se o segundo comando de Jesus deve ser suavizado para uma fórmula tradicional ou conservar a imagem de amordaçar
  choice: 'Conservar a formulação forte: “Cale-se! Fique amordaçado!”'
  alternative: “Silêncio! Acalme-se!” ou “Paz! Aquiete-se!”
  rationale: O grego contém dois imperativos e não traz um substantivo equivalente a 'paz'. A imagem de amordaçar apresenta de forma vívida a autoridade de Jesus sobre o mar, sem acrescentar uma formulação tradicional ausente do texto.
- issue: Se θάλασσα deve ser traduzido geograficamente como 'lago'
  choice: mar
  alternative: lago
  rationale: A tradução 'mar' corresponde diretamente ao texto-fonte e preserva a tensão entre a geografia conhecida e a linguagem narrativa de Marcos, sem reduzir o termo a uma explicação geográfica.
- issue: Se o particípio διεγερθεὶς deve especificar que Jesus foi despertado pelos discípulos
  choice: tendo despertado, com nota sobre a alternativa passiva
  alternative: tendo sido despertado
  rationale: A forma grega é morfologicamente passiva, mas o verbo pode descrever o despertar ou levantar-se. O contexto permite entender que os discípulos o acordaram, porém o texto principal não precisa tornar essa agência mais explícita do que o original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por construções naturais no Brasil sem regionalismos marcados. A coordenação simples conserva o ritmo narrativo de Marcos; “amordaçado” é deliberadamente vívido e incomum porque reflete a metáfora igualmente forte do grego.
