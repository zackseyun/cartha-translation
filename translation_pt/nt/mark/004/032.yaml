  text: καὶ ὅταν σπαρῇ, ἀναβαίνει καὶ γίνεται ⸂μεῖζον πάντων τῶν λαχάνων⸃ καὶ ποιεῖ κλάδους μεγάλους, ὥστε δύνασθαι ὑπὸ τὴν σκιὰν αὐτοῦ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/032.yaml
  text: and when it is sown[a], it comes up and becomes larger than all the garden plants, and it produces large branches[b], so that the birds of the sky are able to nest under its shade.
translation:
  language: pt
  text: E, quando é semeada, brota e se torna maior do que todas as plantas da horta; produz grandes ramos, de modo que as aves do céu[a] podem se abrigar à sua sombra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aves do ar”.
    reason: lexical_alternative
  - marker: b
    text: Ou “habitar” ou “se estabelecer”. A formulação pode ecoar imagens do Antigo Testamento em que aves encontram abrigo numa grande árvore (por exemplo, Ez 17:23; Dn 4:12).
    reason: cross_reference
lexical_decisions:
- source_word: σπαρῇ
  choice: é semeada
  rationale: O aoristo passivo do subjuntivo depois de ὅταν forma uma oração temporal indefinida. “É semeada” preserva a voz passiva e a ligação verbal com a imagem da semente.
- source_word: ἀναβαίνει
  choice: brota
  rationale: No contexto agrícola, o verbo descreve a planta emergindo do solo. “Brota” comunica isso de modo natural e conciso em português.
- source_word: γίνεται
  choice: se torna
  rationale: O verbo indica o estado resultante do crescimento, preservado diretamente por “se torna”.
- source_word: μεῖζον πάντων τῶν λαχάνων
  choice: maior do que todas as plantas da horta
  rationale: λάχανα designa plantas cultivadas em horta, não necessariamente apenas verduras ou legumes. A formulação mantém o comparativo grego e evita restringir indevidamente o referente.
- source_word: ποιεῖ κλάδους μεγάλους
  choice: produz grandes ramos
  rationale: A combinação verbal refere-se naturalmente ao surgimento de ramos; “produz” é idiomático sem enfraquecer a imagem.
- source_word: ὥστε δύνασθαι
  choice: de modo que ... podem
  rationale: A construção com ὥστε e infinitivo exprime resultado e capacidade. “De modo que ... podem” conserva ambos os aspectos em português corrente.
- source_word: ὑπὸ τὴν σκιὰν αὐτοῦ
  choice: à sua sombra
  rationale: No contexto de abrigo oferecido por uma planta, “à sua sombra” é a expressão portuguesa natural para a imagem espacial do grego.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: as aves do céu
  rationale: “Aves do céu” reproduz de perto a expressão grega e mantém sua ressonância bíblica sem recorrer à formulação tradicional “aves do ar”.
- source_word: κατασκηνοῦν
  choice: fazer ninho
  rationale: Com aves como sujeito, “fazer ninho” comunica naturalmente a ideia contextual de se instalar ou habitar, embora o verbo grego não designe exclusivamente a nidificação.
theological_decisions:
- issue: Imagem intertextual de aves abrigadas nos ramos
  choice: Manter a imagem no texto sem explicitar sua possível interpretação teológica.
  alternative: Traduzir κατασκηνοῦν mais literalmente como “habitar” para realçar possíveis ecos da imagem veterotestamentária da grande árvore.
  rationale: A linguagem pode evocar textos como Ezequiel 17:23 e Daniel 4:12, mas o versículo não interpreta explicitamente essa alusão. A tradução conserva a imagem e deixa sua significação teológica em aberto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Plantas da horta” evita o sentido moderno mais estreito de “hortaliças”, e “fazer ninho” torna a cena imediatamente compreensível, enquanto a nota preserva a amplitude lexical e a possível alusão bíblica.
