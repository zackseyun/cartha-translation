  text: καὶ ⸀ἄλλα ἔπεσεν εἰς τὴν γῆν τὴν καλήν, καὶ ἐδίδου καρπὸν ἀναβαίνοντα καὶ ⸀αὐξανόμενα, καὶ ἔφερεν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/008.yaml
  text: And other seed fell into the good soil[a], and it was producing fruit, growing up and increasing, and bearing thirtyfold and sixtyfold and a hundredfold.
translation:
  language: pt
  text: Outras sementes caíram em terra boa[a] e davam fruto, crescendo e aumentando, e rendiam trinta, sessenta e cem por um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “outras caíram em terra boa”, subentendendo-se “sementes” pelo contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: Outras sementes
  rationale: O adjetivo neutro plural é usado substantivamente e retoma as sementes do contexto; explicitar “sementes” torna o português natural e claro, preservando o plural grego.
- source_word: γῆν τὴν καλήν
  choice: solo bom
  rationale: No contexto agrícola, γῆ designa o solo em que se semeia; “solo bom” é corrente e preciso.
- source_word: ἐδίδου καρπὸν
  choice: davam fruto
  rationale: O imperfeito indica produção continuada; a concordância no plural acompanha “outras sementes”, forma natural de representar o neutro plural grego.
- source_word: ἀναβαίνοντα
  choice: brotando
  rationale: No contexto da germinação, o particípio descreve a planta surgindo e crescendo para cima; “brotando” comunica isso de modo natural.
- source_word: αὐξανόμενα
  choice: crescendo
  rationale: Preserva a ideia de aumento contínuo e mantém uma progressão distinta de “brotando”.
- source_word: ἔφερεν
  choice: produziam
  rationale: O verbo descreve o rendimento continuado da colheita; “produziam” introduz naturalmente as proporções seguintes.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: a trinta, a sessenta e a cem por um
  rationale: A expressão indica proporções de rendimento. “A trinta... por um” é compreensível em português e retém a distribuição singular de cada grupo sem recorrer ao menos natural “trinta vezes”.
