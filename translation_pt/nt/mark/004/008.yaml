review_pass:
  verdict: revise
  source_fidelity: A tradução comunica corretamente a queda em solo fértil, a frutificação progressiva e os três níveis de rendimento. Contudo, «a trinta, a sessenta e a cem por um» é uma reprodução demasiado literal e pouco idiomática da construção de rendimento em português; a formulação sem as preposições é mais clara e natural, sem perda de sentido.
  naturalness: «Solo bom» é compreensível, mas «terra boa» soa mais natural no registro agrícola e bíblico em português internacional. «Crescendo e aumentando» preserva melhor a distinção entre ἀναβαίνοντα (crescer para cima/despontar) e αὐξανόμενα (aumentar), evitando que «brotando» sugira exclusivamente o momento inicial da germinação.
  terminology: Não há termos teológicos especializados neste versículo. «Fruto» e «cem por um» são adequados ao contexto da parábola e ao uso bíblico corrente.
