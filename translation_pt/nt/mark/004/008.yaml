revisions:
- from: Outras sementes caíram em solo bom[a] e davam fruto, brotando e crescendo; e produziam a trinta, a sessenta e a cem por um.
  to: Outras sementes caíram em terra boa[a] e davam fruto, crescendo e aumentando, e rendiam trinta, sessenta e cem por um.
  rationale: 'A revisão conserva o plural explícito «outras sementes», legítimo no contexto para o neutro plural substantivado ἄλλα, bem como o aspecto contínuo dos imperfeitos. Ajusta apenas expressões de estilo: «terra boa» é mais corrente no quadro agrícola, «crescendo e aumentando» mantém os dois matizes dos particípios, e «trinta, sessenta e cem por um» é a forma portuguesa mais fluente para os rendimentos indicados.'
