  - severity: low
    issue: Escolha verbal para os particípios de crescimento
    rationale: «Brotando e crescendo» é possível, mas «crescendo e aumentando» reproduz mais diretamente a progressão entre ἀναβαίνοντα e αὐξανόμενα e evita restringir o primeiro termo ao início da germinação.
  revised_text: Outras sementes caíram em terra boa[a] e davam fruto, crescendo e aumentando, e rendiam trinta, sessenta e cem por um.
