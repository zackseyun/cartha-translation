  text: καὶ ἔλεγεν αὐτοῖς· Βλέπετε τί ἀκούετε. ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν καὶ προστεθήσεται ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/024.yaml
  text: And he was saying to them[a], “Pay attention to what you hear. With the measure you use, it will be measured to you[b], and more will be added to you.”
translation:
  language: pt
  text: 'E ele lhes dizia: “Prestem atenção ao que vocês ouvem. Pela medida que vocês usarem, vocês serão medidos, e ainda lhes será acrescentado.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No contexto, alguns entendem que aquilo que será acrescentado é maior compreensão para quem acolhe o ensino de Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito indica fala em andamento ou reiterada; “dizia” preserva esse aspecto com naturalidade em português.
- source_word: Βλέπετε
  choice: Prestem atenção
  rationale: Embora o verbo tenha o sentido básico de “ver”, aqui funciona como exortação à atenção cuidadosa.
- source_word: τί ἀκούετε
  choice: ao que vocês ouvem
  rationale: τί significa “o que”, não “como”; a tradução mantém a formulação própria de Marcos sem harmonizá-la com Lucas 8.18.
- source_word: ἐν ᾧ μέτρῳ μετρεῖτε
  choice: Com a medida que usarem
  rationale: A expressão apresenta a medida como padrão ou instrumento. “Usarem” evita uma construção redundante e pouco natural, enquanto “medida” preserva a metáfora.
- source_word: μετρηθήσεται ὑμῖν
  choice: será medido para vocês
  rationale: Mantém a voz passiva e a ideia de reciprocidade sem inserir explicitamente “de volta”, ausente do grego.
- source_word: προστεθήσεται ὑμῖν
  choice: ainda lhes será acrescentado
  rationale: Preserva o sentido de “acrescentar” e deixa implícito, como no grego, o que será acrescentado. “Ainda” comunica a ideia aditiva sem transformar o verbo em “dar”.
theological_decisions:
- issue: Sentido do princípio de reciprocidade
  choice: Manter a metáfora ampla no contexto de ouvir o ensino de Jesus
  alternative: Restringi-la a juízo, generosidade ou aumento de entendimento espiritual
  rationale: O contexto imediato favorece a receptividade ao ensino de Jesus, mas a formulação não especifica de modo inequívoco uma única aplicação; a tradução conserva essa tensão.
- issue: Objeto implícito de “será acrescentado”
  choice: Não explicitar no texto principal o que será acrescentado
  alternative: Traduzir como “mais entendimento lhes será dado”
  rationale: O verbo grego não declara o objeto. Explicitá-lo como entendimento resolveria uma ambiguidade interpretativa que deve ser preservada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. A ordem e as metáforas do grego foram mantidas sempre que naturais, sem harmonização com passagens paralelas.
