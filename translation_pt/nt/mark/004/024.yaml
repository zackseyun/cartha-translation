  source_fidelity: O texto preserva bem o imperfeito de ἔλεγεν, a exortação de Βλέπετε, o objeto «o que» em τί ἀκούετε e a ambiguidade do objeto em προστεθήσεται. Contudo, «será medido para vocês» não representa com naturalidade o valor recíproco da construção passiva com ὑμῖν; em português, é mais claro que os próprios ouvintes serão medidos segundo a medida que empregam.
