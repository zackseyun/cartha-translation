source:
  edition: SBLGNT
  text: ὡς ⸀κόκκῳ σινάπεως, ὃς ὅταν σπαρῇ ἐπὶ τῆς γῆς, ⸂μικρότερον ὂν⸃ πάντων τῶν ⸀σπερμάτων τῶν ἐπὶ τῆς γῆς—
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/031.yaml
  text: It is like a mustard seed[a], which, when it is sown on the ground[b], being smaller than all the seeds on the ground—
translation:
  language: pt
  text: É como um grão de mostarda[a] que, quando é semeado no solo, é menor do que todas as sementes que estão no solo—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma semente de mostarda».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: É como
  rationale: Explicita em português o referente elíptico da comparação, retomando o reino de Deus mencionado no versículo anterior.
- source_word: κόκκῳ σινάπεως
  choice: um grão de mostarda
  rationale: Preserva o sentido de κόκκος como grão ou semente e soa natural no contexto da planta; a alternativa comum «semente de mostarda» é registrada em nota.
- source_word: ὃς
  choice: que
  rationale: Introduz naturalmente em português a oração relativa referente a «grão».
- source_word: ὅταν σπαρῇ
  choice: quando é semeado
  rationale: Expressa o valor temporal genérico de ὅταν com aoristo do subjuntivo sem tornar a frase artificial.
- source_word: ἐπὶ τῆς γῆς
  choice: sobre a terra
  rationale: Mantém de perto ἐπί e entende γῆ como terra ou solo no contexto agrícola.
- source_word: μικρότερον ὂν
  choice: é menor
  rationale: Converte a construção participial em oração finita natural em português e preserva o comparativo μικρότερον.
- source_word: πάντων τῶν σπερμάτων
  choice: do que todas as sementes
  rationale: Representa diretamente o genitivo de comparação, sem introduzir uma classificação botânica ausente do texto.
- source_word: τῶν ἐπὶ τῆς γῆς
  choice: que há sobre a terra
  rationale: Retém o qualificador grego repetido e acrescenta apenas o elemento idiomático necessário para uma construção portuguesa clara.
theological_decisions:
- issue: Comparativo ou superlativo na descrição do grão de mostarda
  choice: é menor do que todas as sementes
  alternative: é a menor de todas as sementes
  rationale: O texto grego emprega o comparativo μικρότερον, não um superlativo explícito. A tradução conserva essa forma e a tensão da comparação sem suavizá-la segundo a redação tradicional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. O travessão final preserva a continuidade sintática com o versículo seguinte.
