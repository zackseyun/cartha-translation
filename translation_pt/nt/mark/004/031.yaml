  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a comparação elíptica, «grão de mostarda», o valor temporal genérico de ὅταν σπαρῇ e, sobretudo, o comparativo μικρότερον: «menor do que todas», sem o transformar em superlativo. O travessão final também reproduz corretamente a continuação sintática. Contudo, «sobre a terra» é pouco idiomático para semear em português e pode sugerir a superfície da terra, em vez do solo agrícola visado no contexto.'
  naturalness: A construção geral é clara e de registro apropriado. A substituição de «sobre a terra» por «no solo» torna as duas ocorrências mais naturais e precisas no contexto agrícola, especialmente para leitores brasileiros, sem perda do sentido do grego.
  terminology: «Grão de mostarda» é uma escolha válida e natural; a nota oferece de modo adequado a alternativa «semente de mostarda». «Menor do que» mantém corretamente o comparativo grego e não introduz interpretação teológica.
