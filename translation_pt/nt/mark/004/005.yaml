  text: ⸂καὶ ἄλλο⸃ ἔπεσεν ἐπὶ τὸ πετρῶδες ⸀ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ ⸀εὐθὺς ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/005.yaml
  text: And other seed fell on the rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil.
translation:
  language: pt
  text: Outra semente caiu em terreno rochoso[a], onde não havia muita terra, e logo brotou, porque a camada de terra não era profunda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terreno pedregoso”. O grego descreve um terreno rochoso coberto apenas por uma camada fina de terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: Outra semente
  rationale: O adjetivo neutro singular é usado substantivamente e retoma de modo implícito a semente do contexto anterior; explicitar “semente” torna a frase natural e clara em português.
- source_word: πετρῶδες
  choice: terreno rochoso
  rationale: Designa terreno com rocha sob uma camada fina de terra, e não apenas um lugar com pedras espalhadas. “Terreno rochoso” preserva bem a imagem agrícola.
- source_word: γῆν πολλήν
  choice: muita terra
  rationale: Neste contexto, γῆ indica a terra em que a semente cresce. “Muita terra” é corrente em português e prepara a referência posterior à pouca profundidade.
- source_word: εὐθὺς
  choice: logo
  rationale: Expressa prontidão ou rapidez; “logo” é conciso, natural e preserva a súbita germinação.
- source_word: ἐξανέτειλεν
  choice: brotou
  rationale: No contexto agrícola, o verbo descreve a semente germinando e surgindo do solo; “brotou” é preciso e idiomático.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: porque a terra não era profunda
  rationale: A construção com διά e infinitivo articular indica causa. A formulação finita é natural em português e comunica claramente a camada rasa de terra.
- source_word: ὅπου
  choice: onde
  rationale: Equivalente locativo direto e natural.
theological_decisions: []
