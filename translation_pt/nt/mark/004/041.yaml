  text: καὶ ἐφοβήθησαν φόβον μέγαν, καὶ ἔλεγον πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ ὁ ἄνεμος καὶ ἡ θάλασσα ⸀ὑπακούει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/041.yaml
  text: And they feared a great fear[a], and they said to one another, “Who then is this, that even the wind and the sea obey him?”
translation:
  language: pt
  text: 'E eles ficaram tomados de grande temor[a] e diziam uns aos outros: “Quem é este, afinal, que até o vento e o mar lhe obedecem?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “temeram um grande temor”. O grego usa uma expressão intensificada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: ficaram tomados de grande temor
  rationale: O verbo seguido do acusativo cognato intensifica o medo. A formulação preserva a ênfase do grego em português natural e digno; a nota registra a forma mais literal.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito grego pode indicar ação contínua ou repetida. O imperfeito português é natural aqui e conserva esse aspecto sem exagerá-lo.
- source_word: πρὸς ἀλλήλους
  choice: uns aos outros
  rationale: Expressa diretamente a reciprocidade da conversa em português corrente.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: Quem é este, afinal
  rationale: “Afinal” conserva a nuance inferencial e admirada de ἄρα depois de Jesus acalmar a tempestade.
- source_word: ὅτι
  choice: que
  rationale: Introduz naturalmente, em português, o fato surpreendente que fundamenta a pergunta.
- source_word: καὶ ὁ ἄνεμος καὶ ἡ θάλασσα
  choice: até o vento e o mar
  rationale: “Até” comunica o valor enfático do primeiro καί, enquanto “e” coordena os dois elementos.
- source_word: ὑπακούει αὐτῷ
  choice: lhe obedecem
  rationale: “Obedecer” preserva a personificação dos elementos e a força da autoridade exercida por Jesus. O plural é exigido em português pelo sujeito composto, embora o grego empregue verbo no singular.
theological_decisions:
- issue: A autoridade de Jesus sobre a criação
  choice: Manter a pergunta admirada dos discípulos e a afirmação direta de que vento e mar lhe obedecem.
  alternative: Explicitar na tradução uma conclusão sobre a identidade divina de Jesus.
  rationale: O versículo sugere autoridade extraordinária por meio da pergunta e da obediência dos elementos, mas não formula explicitamente a conclusão doutrinária; a tradução preserva essa tensão sem ampliá-la.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Temor” mantém o tom solene e a intensidade do contexto; “afinal” transmite a surpresa inferencial sem soar arcaico.
