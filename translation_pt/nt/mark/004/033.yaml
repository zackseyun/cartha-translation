source:
  edition: SBLGNT
  text: Καὶ τοιαύταις παραβολαῖς πολλαῖς ἐλάλει αὐτοῖς τὸν λόγον, καθὼς ἠδύναντο ἀκούειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/033.yaml
  text: And with many such parables he was speaking the word to them[b][a], as they were able to hear it.
translation:
  language: pt
  text: E, com muitas parábolas como essas, falava-lhes a palavra[a], conforme podiam ouvi-la.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a mensagem” ou “o ensino”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “na medida em que eram capazes de ouvir” ou “tanto quanto podiam ouvir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαύταις
  choice: como essas
  rationale: Retoma as parábolas anteriores e preserva o sentido comparativo do demonstrativo grego em português natural.
- source_word: παραβολαῖς
  choice: parábolas
  rationale: É o termo tradicional, claro e contextualmente exato para as comparações narrativas usadas por Jesus.
- source_word: πολλαῖς
  choice: muitas
  rationale: Equivalente quantitativo direto e idiomático, modificando “parábolas”.
- source_word: ἐλάλει
  choice: anunciava
  rationale: Expressa a comunicação oral da mensagem e, no imperfeito, mantém a ação continuada ou habitual. “Falava-lhes a palavra” seria mais formalmente próximo, mas pouco natural no português atual.
- source_word: αὐτοῖς
  choice: lhes
  rationale: 'Reproduz de modo conciso e natural o objeto indireto dativo: “a eles”.'
- source_word: τὸν λόγον
  choice: a palavra
  rationale: Preserva a expressão grega e sua ressonância no Evangelho de Marcos, sem restringi-la antecipadamente a “mensagem” ou “ensino”.
- source_word: καθὼς
  choice: conforme
  rationale: Introduz a correspondência entre a maneira ou medida do ensino e a capacidade dos ouvintes.
- source_word: ἠδύναντο
  choice: podiam
  rationale: Representa diretamente a capacidade expressa por δύναμαι e combina naturalmente com o aspecto imperfeito do contexto.
- source_word: ἀκούειν
  choice: ouvi-la
  rationale: Mantém o sentido lexical básico de “ouvir”, sem explicitar “entender”; o pronome retoma “a palavra”.
theological_decisions:
- issue: Sentido de τὸν λόγον no ministério de ensino de Jesus
  choice: a palavra
  alternative: a mensagem; o ensino
  rationale: “A palavra” preserva a formulação grega e o uso bíblico sem impor um sentido doutrinário mais estreito. As alternativas esclarecem sentidos contextualmente possíveis.
- issue: Implicação de ἀκούειν
  choice: ouvi-la
  alternative: entendê-la; acolhê-la
  rationale: O texto fala da capacidade de ouvir. Embora o contexto possa incluir compreensão ou receptividade, a tradução não resolve essa tensão interpretativa.
- issue: Alcance de καθὼς ἠδύναντο ἀκούειν
  choice: conforme podiam ouvi-la
  alternative: na medida em que eram capazes de ouvir; tanto quanto podiam ouvir
  rationale: A formulação principal conserva a concisão e a ambiguidade do grego entre modo e medida; a nota registra explicitamente a leitura quantitativa possível.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Por meio de” explicita de modo natural o valor instrumental de ἐν implícito na construção com as parábolas. A colocação pronominal “ele lhes anunciava” é fluente e evita tanto arcaísmo quanto coloquialismo excessivo.
