id: MRK.4.14
reference: Mark 4:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ σπείρων τὸν λόγον σπείρει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/014.yaml
  text: The sower sows the word[a].
translation:
  language: pt
  text: O semeador semeia a palavra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a mensagem”. A palavra grega λόγος pode significar “palavra” ou “mensagem”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σπείρων
  choice: O semeador
  rationale: O particípio presente com artigo funciona como substantivo e designa quem se caracteriza por semear. “O semeador” é natural, conciso e preserva a imagem da parábola sem ampliar para a ocupação mais geral de “agricultor”.
- source_word: τὸν λόγον
  choice: a palavra
  rationale: λόγος pode significar “palavra” ou “mensagem”. Aqui, “a palavra” preserva a formulação aberta do grego e a conexão com a proclamação, sem explicitar conteúdo que o versículo não declara.
- source_word: σπείρει
  choice: semeia
  rationale: O presente do indicativo descreve a ação geral na explicação da parábola. A repetição “semeador semeia” reproduz naturalmente a repetição da raiz σπειρ- no grego.
theological_decisions:
- issue: Referente de “a palavra” na explicação da parábola
  choice: a palavra
  alternative: a mensagem; a palavra de Deus; o evangelho
  rationale: O texto grego traz apenas τὸν λόγον. Embora o contexto indique uma mensagem proclamada de origem divina, acrescentar “de Deus” ou identificar diretamente o referente como “o evangelho” resolveria no texto algo que este versículo deixa implícito.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação concisa mantém a imagem agrícola e a repetição retórica do original.
source_grounding:
  english_pob_role: consult_only
