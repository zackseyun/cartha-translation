source:
  edition: SBLGNT
  text: καὶ ἄλλο ἔπεσεν εἰς τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ συνέπνιξαν αὐτό, καὶ καρπὸν οὐκ ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/007.yaml
  text: And other seed fell among the thorns[a], and the thorns came up and choked it[b], and it yielded no fruit.
translation:
  language: pt
  text: Outra semente caiu entre os espinhos, e os espinhos cresceram e a sufocaram, e ela não produziu fruto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλο
  choice: Outra semente
  rationale: O neutro singular significa literalmente “outra coisa”, mas retoma de modo elíptico a semente no contexto da parábola. Explicitar “semente” dá clareza natural em português sem acrescentar conteúdo novo.
- source_word: ἔπεσεν
  choice: caiu
  rationale: Traduz diretamente o aoristo de πίπτω. Evita a interpretação mais ampla de “foi semeada”, verbo que não aparece nesta cláusula.
- source_word: εἰς τὰς ἀκάνθας
  choice: entre os espinhos
  rationale: Embora εἰς tenha o sentido básico de “para dentro de”, “entre os espinhos” é a formulação portuguesa natural para a semente que cai numa área tomada por espinheiros.
- source_word: ἀνέβησαν
  choice: cresceram
  rationale: No contexto vegetal, ἀναβαίνω descreve os espinhos que brotam ou sobem ao crescer. “Cresceram” é claro, corrente e não exige explicitar uma fase específica como “brotaram”.
- source_word: συνέπνιξαν
  choice: a sufocaram
  rationale: Preserva a imagem vívida do verbo συμπνίγω, segundo a qual a vegetação concorrente impede o desenvolvimento da planta.
- source_word: αὐτό
  choice: a
  rationale: O pronome grego neutro retoma o elemento semeado; em português, a referência explicitada por “semente” exige o pronome feminino “a”.
- source_word: καρπὸν οὐκ ἔδωκεν
  choice: ela não produziu fruto
  rationale: A expressão significa literalmente que a semente/planta “não deu fruto”. “Não produziu fruto” é português agrícola natural e mantém o resultado negativo sem paráfrase excessiva.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A coordenação repetida com “e” preserva o encadeamento narrativo do grego sem tornar a frase artificial.
