  text: Καὶ ἔλεγεν· ⸀Πῶς ὁμοιώσωμεν τὴν βασιλείαν τοῦ θεοῦ, ἢ ἐν ⸀τίνι ⸂αὐτὴν παραβολῇ θῶμεν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/030.yaml
  text: And he was saying[a], “How should we compare the kingdom of God, or in what parable should we set it forth?”
translation:
  language: pt
  text: 'E dizia: “Como devemos comparar o Reino de Deus, ou com que parábola devemos apresentá-lo?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito grego indica ação em curso ou reiterada; “dizia” preserva naturalmente esse aspecto em português.
- source_word: Πῶς
  choice: Como
  rationale: Introduz de modo direto e idiomático a maneira da comparação.
- source_word: ὁμοιώσωμεν
  choice: devemos comparar
  rationale: O subjuntivo aoristo em pergunta deliberativa é expresso com naturalidade por “devemos comparar”.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: Expressão consagrada, clara e suficientemente ampla para preservar tanto o domínio quanto o governo de Deus.
- source_word: ἢ
  choice: Ou
  rationale: Introduz a segunda pergunta como reformulação alternativa da primeira.
- source_word: ἐν τίνι ... παραβολῇ
  choice: com que parábola
  rationale: O uso de ἐν com dativo pode ter valor instrumental; “com que parábola” é natural em português e indica o meio de apresentação.
- source_word: παραβολῇ
  choice: parábola
  rationale: É o termo estabelecido e contextualmente preciso para essa forma de ensino nos Evangelhos.
- source_word: αὐτὴν ... θῶμεν
  choice: devemos apresentá-lo
  rationale: Neste contexto, τίθημι tem o sentido idiomático de expor ou apresentar; o pronome retoma “Reino”, masculino em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A pontuação em duas perguntas preserva a reformulação retórica do grego sem tornar a frase artificial.
