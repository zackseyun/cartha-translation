  text: ⸀αὐτομάτη ἡ γῆ καρποφορεῖ, πρῶτον χόρτον, ⸂εἶτα στάχυν, εἶτα⸃ ⸂πλήρης σῖτον⸃ ἐν τῷ στάχυϊ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/028.yaml
  text: 'The soil bears fruit by itself: first the stalk[a], then the head, then the full grain in the head.'
translation:
  language: pt
  text: 'A terra produz por si mesma: primeiro o broto, depois a espiga e, por fim, o grão cheio na espiga.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτομάτη
  choice: por si mesma
  rationale: O adjetivo concorda com ἡ γῆ e indica que a terra produz sem ação humana visível; a expressão é natural e preserva esse sentido.
- source_word: ἡ γῆ
  choice: a terra
  rationale: No contexto agrícola, refere-se ao solo cultivado. “A terra” é corrente em português e mantém a personificação gramatical exigida por αὐτομάτη.
- source_word: καρποφορεῖ
  choice: produz
  rationale: O verbo significa dar ou produzir fruto/colheita. Aqui, “produz” liga-se naturalmente à enumeração dos estágios do cereal sem exigir a repetição explícita de “fruto”.
- source_word: πρῶτον χόρτον
  choice: primeiro o broto
  rationale: χόρτος designa aqui o primeiro crescimento verde visível da planta cerealífera; “broto” comunica esse estágio com clareza, sem sugerir prematuramente o caule já formado.
- source_word: εἶτα στάχυν
  choice: depois a espiga
  rationale: στάχυς é a espiga ou cabeça do cereal; “espiga” é a designação natural e amplamente compreensível em português.
- source_word: εἶτα πλήρης σῖτον ἐν τῷ στάχυϊ
  choice: e, por fim, o grão cheio na espiga
  rationale: A formulação preserva a sequência, o sentido não necessariamente técnico de πλήρης e a localização expressa por ἐν τῷ στάχυϊ. “Por fim” torna natural a terceira etapa, embora o grego repita εἶτα.
theological_decisions: []
