translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa e o aspecto verbal do grego foram preservados sem rigidez artificial; as notas registram alternativas mais formais e a ambiguidade de voz em γεμίζεσθαι.
