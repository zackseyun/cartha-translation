  text: καὶ γίνεται λαῖλαψ ⸂μεγάλη ἀνέμου⸃, ⸂καὶ τὰ⸃ κύματα ἐπέβαλλεν εἰς τὸ πλοῖον, ὥστε ⸂ἤδη γεμίζεσθαι τὸ πλοῖον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/037.yaml
  text: And a great windstorm arose[a], and the waves were breaking into the boat[c][b], so that the boat was already filling.
translation:
  language: pt
  text: E levantou-se uma grande tempestade de vento[a], e as ondas invadiam o barco[b], de modo que o barco já estava se enchendo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “uma grande tormenta de vento”.
    reason: lexical_alternative
  - marker: b
    text: Ou “as ondas batiam para dentro do barco”. O verbo grego no imperfeito retrata uma ação contínua ou repetida.
    reason: lexical_alternative
  - marker: c
    text: Ou “o barco já estava sendo enchido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεται
  choice: levantou-se
  rationale: O presente histórico de Marcos descreve o início repentino da tempestade; “levantou-se” é natural em português e preserva esse valor ingressivo.
- source_word: λαῖλαψ μεγάλη ἀνέμου
  choice: uma grande tempestade de vento
  rationale: Mantém de modo claro tanto μεγάλη (“grande”) quanto o genitivo ἀνέμου (“de vento”), sem acrescentar uma intensidade não explicitada pelo adjetivo.
- source_word: κύματα
  choice: as ondas
  rationale: Equivalente corrente e preciso de κύματα no contexto de uma tempestade no lago.
- source_word: ἐπέβαλλεν εἰς τὸ πλοῖον
  choice: se lançavam para dentro do barco
  rationale: O imperfeito retrata ação contínua ou repetida; a formulação preserva a força das ondas e seu movimento para dentro do barco.
- source_word: πλοῖον
  choice: barco
  rationale: “Barco” é a designação moderna mais natural para a embarcação do contexto do mar da Galileia.
- source_word: ὥστε
  choice: de modo que
  rationale: Expressa com naturalidade a consequência introduzida por ὥστε.
- source_word: ἤδη
  choice: já
  rationale: Reproduz diretamente a ideia de que o processo de enchimento já estava em curso.
- source_word: γεμίζεσθαι τὸ πλοῖον
  choice: o barco já estava se enchendo
  rationale: Representa de forma idiomática o processo contínuo expresso pelo infinitivo presente, sem eliminar a possibilidade formal de leitura passiva.
