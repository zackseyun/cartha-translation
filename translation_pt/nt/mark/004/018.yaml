  text: καὶ ⸀ἄλλοι εἰσὶν οἱ εἰς τὰς ἀκάνθας σπειρόμενοι· ⸂οὗτοί εἰσιν⸃ οἱ τὸν λόγον ⸀ἀκούσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/018.yaml
  text: And others are those sown among the thorns[a]; these are the ones who have heard the word[b],
translation:
  language: pt
  text: E outros são os que foram semeados entre os espinhos[a]; estes são os que ouviram a palavra[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em meio aos espinhos».
    reason: lexical_alternative
  - marker: b
    text: Ou «a mensagem».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι
  choice: outros
  rationale: O adjetivo substantivado distingue este grupo dos anteriores e soa natural em português.
- source_word: εἰς τὰς ἀκάνθας
  choice: entre os espinhos
  rationale: Embora εἰς possa ser vertido formalmente por «em meio aos», «entre os espinhos» expressa com naturalidade o terreno tomado por espinhos e preserva a imagem agrícola.
- source_word: ἀκάνθας
  choice: espinhos
  rationale: É a tradução corrente e concreta neste contexto parabólico.
- source_word: σπειρόμενοι
  choice: foram semeados
  rationale: Mantém a voz passiva e a metáfora que identifica as pessoas com a semente; o pretérito composto seria menos natural em português.
- source_word: οὗτοί εἰσιν
  choice: estes são
  rationale: Conserva de modo conciso a fórmula de identificação que introduz a explicação.
- source_word: οἱ ... ἀκούσαντες
  choice: os que ouviram
  rationale: O particípio aoristo apresenta o ouvir como ação anterior; o pretérito perfeito é natural e fiel em português.
- source_word: τὸν λόγον
  choice: a palavra
  rationale: Preserva a expressão bíblica e sua ressonância contextual; «a mensagem» continua sendo alternativa legítima.
theological_decisions:
- issue: Identificação metafórica das pessoas com a semente na explicação da parábola
  choice: 'Manter literalmente a metáfora: «os que foram semeados entre os espinhos»'
  alternative: «os que foram plantados entre os espinhos» ou «os que foram semeados em terreno cheio de espinhos»
  rationale: O grego prolonga expressamente a metáfora da semente. Mantê-la preserva a estrutura literária e evita introduzir uma explicação interpretativa no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva a metáfora deliberadamente incomum do original e mantém a vírgula final por continuidade sintática com o versículo seguinte.
