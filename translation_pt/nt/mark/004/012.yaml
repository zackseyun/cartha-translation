base_translation:
  language: en
  yaml_path: translation/nt/mark/004/012.yaml
  text: so that seeing they may see and not perceive[a], and hearing they may hear and not understand[c][b], lest they turn back and it be forgiven them.
translation:
  language: pt
  text: para que, vendo, vejam e não percebam[a], e, ouvindo, ouçam e não entendam[b], para que não se voltem[c] e sejam perdoados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não discernam”.'
    reason: lexical_alternative
  - marker: b
    text: Jesus faz eco a Isaías 6:9–10, preservando a tensão entre o juízo divino e a falta de resposta do povo.
    reason: cross_reference
  - marker: c
    text: “Se voltem” também pode ser traduzido por “voltem” ou, neste contexto, “se arrependam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Preserva naturalmente em português a linguagem de propósito ou resultado, sem resolver a tensão do texto.
- source_word: βλέποντες βλέπωσι
  choice: vendo, vejam
  rationale: Mantém o particípio e o verbo finito, bem como a repetição enfática e paradoxal do grego.
- source_word: ἴδωσιν
  choice: percebam
  rationale: Distingue este verbo do βλέπω repetido e comunica a ideia de captar ou discernir o que se vê.
- source_word: ἀκούοντες ἀκούωσι
  choice: ouvindo, ouçam
  rationale: Conserva a construção duplicada e sua força retórica, ligada ao eco de Isaías.
- source_word: συνιῶσιν
  choice: entendam
  rationale: É a tradução corrente e clara para a compreensão mental ou espiritual indicada pelo verbo.
- source_word: μήποτε
  choice: para que não
  rationale: Expressa de modo claro a força prospectiva negativa no contexto e, ligada à oração anterior, preserva a formulação difícil do grego.
- source_word: ἐπιστρέψωσιν
  choice: se voltem
  rationale: Mantém a imagem verbal ampla de voltar-se, sem explicitar no texto principal a interpretação possível de arrependimento ou conversão.
- source_word: ἀφεθῇ αὐτοῖς
  choice: sejam perdoados
  rationale: Transmite em português natural o passivo divino e o sentido de perdão, sem acrescentar um objeto não expresso nesta forma do texto grego.
theological_decisions:
- issue: Força de propósito ou resultado da citação de Isaías e a possível implicação de que as parábolas impeçam o arrependimento
  choice: Manter «para que ... para que não»
  alternative: Traduzir como simples resultado, por exemplo, «de modo que» ou «caso contrário»
  rationale: A redação grega preserva uma tensão entre juízo divino e falta de resposta humana. A tradução não a suaviza nem a resolve em favor de uma leitura determinista ou meramente descritiva.
- issue: Sentido de ἐπιστρέψωσιν em relação ao arrependimento
  choice: Traduzir por «se voltem» no texto principal
  alternative: «se arrependam» ou «se convertam»
  rationale: O verbo pode ter conotações de arrependimento e retorno a Deus no contexto profético, mas sua imagem lexical é mais ampla. A nota conserva essa possibilidade interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição incomum de «vendo, vejam» e «ouvindo, ouçam» foi mantida deliberadamente para conservar a força retórica do original e seu eco de Isaías.
