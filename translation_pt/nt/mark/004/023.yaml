lexical_decisions:
- source_word: εἴ
  choice: Se
  rationale: Mantém diretamente a forma condicional grega e soa natural em português.
- source_word: τις
  choice: alguém
  rationale: Pronome indefinido singular de alcance geral; preserva o convite aberto sem transformar a construção em relativa.
- source_word: ἔχει
  choice: tem
  rationale: Equivalente simples e idiomático do presente indicativo de posse.
- source_word: ὦτα
  choice: ouvidos
  rationale: Conserva o plural literal e a expressão bíblica corrente em português.
- source_word: ἀκούειν
  choice: para ouvir
  rationale: Expressa adequadamente finalidade ou capacidade e preserva a repetição do verbo ἀκούω.
- source_word: ἀκουέτω
  choice: ouça
  rationale: O presente imperativo grego de terceira pessoa é vertido pelo presente do subjuntivo com força imperativa, forma natural em português; a repetição de 'ouvir' mantém o chamado à escuta receptiva.
theological_decisions:
- issue: Referência genérica singular no imperativo
  choice: ouça
  alternative: que ele ouça
  rationale: Em português, o sujeito singular genérico fica naturalmente implícito na forma verbal. Assim se preserva o singular grego sem introduzir um pronome masculino desnecessário nem converter a frase ao plural.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão e com boa legibilidade brasileira. A formulação preserva o paralelismo e a repetição enfática do original.
