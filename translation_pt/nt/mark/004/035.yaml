  choice: ele lhes diz
  rationale: Preserva o presente histórico característico da narrativa de Marcos; a construção continua natural em português.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Naquele dia
  rationale: Expressão temporal idiomática que mantém a referência ao mesmo dia.
- source_word: ὀψίας γενομένης
  choice: ao cair da tarde
  rationale: Representa naturalmente o valor temporal do genitivo absoluto e o início do período vespertino, sem tornar a frase pesada.
- source_word: Διέλθωμεν
  choice: Vamos atravessar
  rationale: Transmite de modo corrente o subjuntivo exortativo da primeira pessoa do plural e o movimento de travessia.
- source_word: εἰς τὸ πέραν
  choice: para o outro lado
  rationale: Mantém a referência contextual à margem oposta do lago sem acrescentar explicitamente um referente ausente no grego.
