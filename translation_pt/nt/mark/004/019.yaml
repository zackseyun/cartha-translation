reference: Mark 4:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ αἱ μέριμναι τοῦ ⸀αἰῶνος καὶ ἡ ἀπάτη τοῦ πλούτου καὶ αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι εἰσπορευόμεναι συμπνίγουσιν τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/019.yaml
  text: and the cares of the age[a], and the deceitfulness of riches, and the desires for other things entering in choke the word[d][c][b], and it becomes unfruitful.
translation:
  language: pt
  text: e as preocupações desta era[a], o engano da riqueza[b] e os desejos por outras coisas entram e sufocam a palavra, e ela se torna infrutífera[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as preocupações deste mundo”. A palavra grega pode significar “era” ou, por extensão, a ordem mundial presente.
    reason: lexical_alternative
  - marker: b
    text: Ou “o caráter enganoso das riquezas”.
    reason: lexical_alternative
  - marker: c
    text: Ou “fica sem dar fruto”. O grego diz mais diretamente “torna-se infrutífera”; “a palavra” é o antecedente singular explícito mais próximo, embora a imagem também possa levar o leitor a pensar no ouvinte ou na semente/planta.
    reason: alternative_reading
lexical_decisions:
- source_word: μέριμναι
  choice: preocupações
  rationale: Expressa cuidados que ocupam e inquietam, sem limitar o termo a ansiedade psicológica intensa.
- source_word: τοῦ αἰῶνος
  choice: desta era
  rationale: Preserva o sentido primariamente temporal de αἰών e indica a ordem presente sugerida pelo contexto.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: o engano da riqueza
  rationale: Mantém a construção concisa e a ideia de que a riqueza exerce poder enganador.
- source_word: αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι
  choice: os desejos por outras coisas
  rationale: Formulação natural que conserva a amplitude do objeto dos desejos.
- source_word: εἰσπορευόμεναι
  choice: entram
  rationale: Transforma o particípio em verbo coordenado para deixar claro, em português natural, que os três elementos entram e sufocam.
- source_word: συμπνίγουσιν
  choice: sufocam
  rationale: Preserva a imagem vívida de impedir o crescimento e a frutificação.
- source_word: τὸν λόγον
  choice: a palavra
  rationale: Conserva o idioma bíblico e a ligação com a palavra semeada na parábola.
- source_word: ἄκαρπος γίνεται
  choice: ela se torna infrutífera
  rationale: Segue o resultado expresso pelo grego e retoma naturalmente o antecedente singular mais próximo, 'a palavra'.
theological_decisions:
- issue: Referente de ἄκαρπος γίνεται
  choice: O pronome feminino 'ela' retoma 'a palavra'.
  alternative: O ouvinte, ou a semente/planta, torna-se infrutífero.
  rationale: O antecedente singular explícito mais próximo é τὸν λόγον. A nota preserva a possível leitura evocada pela imagem da parábola sem introduzi-la como sujeito no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação verbal 'entram e sufocam' evita que 'entram' pareça aplicar-se apenas aos desejos e comunica naturalmente o alcance do particípio grego sobre a série inteira.
