id: MRK.4.15
reference: Mark 4:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδὸν ὅπου σπείρεται ὁ λόγος, καὶ ὅταν ἀκούσωσιν ⸀εὐθὺς ἔρχεται ὁ Σατανᾶς καὶ αἴρει τὸν λόγον τὸν ἐσπαρμένον ⸂εἰς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/015.yaml
  text: 'And these are the ones along the road where the word is sown: when they hear[a], Satan immediately comes and takes away the word that was sown in them.'
translation:
  language: pt
  text: 'E estes são os que estão à beira do caminho, onde a palavra é semeada: quando a ouvem, imediatamente vem Satanás e tira a palavra que foi semeada neles.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que foi semeada para dentro deles”.'
    reason: Alternativa lexical que torna explícita a possível força direcional de εἰς.
lexical_decisions:
- source_word: οὗτοι δέ εἰσιν
  choice: E estes são
  rationale: Mantém a identificação dos referentes na explicação da parábola e traduz δέ como conexão discursiva leve.
- source_word: οἱ παρὰ τὴν ὁδόν
  choice: os que estão à beira do caminho
  rationale: Expressa naturalmente a posição indicada por παρά com acusativo e preserva a imagem agrícola de ὁδός.
- source_word: σπείρεται ὁ λόγος
  choice: a palavra é semeada
  rationale: Preserva a voz passiva, a metáfora da semeadura e a repetição temática de λόγος.
- source_word: ὅταν ἀκούσωσιν
  choice: quando a ouvem
  rationale: Comunica o valor temporal geral de ὅταν com subjuntivo; o pronome retoma naturalmente 'a palavra' em português.
- source_word: εὐθύς
  choice: imediatamente
  rationale: Conserva a urgência característica do termo em Marcos.
- source_word: ὁ Σατανᾶς
  choice: Satanás
  rationale: Emprega a forma tradicional e amplamente compreendida do nome/título pessoal.
- source_word: αἴρει
  choice: tira
  rationale: Representa o sentido amplo de remover ou levar embora sem acrescentar a intensidade interpretativa de 'arrebata'.
- source_word: τὸν λόγον τὸν ἐσπαρμένον εἰς αὐτούς
  choice: a palavra que foi semeada neles
  rationale: Mantém a relação do particípio com 'a palavra' e verte εἰς αὐτούς de modo natural, sem eliminar a possível nuance direcional.
theological_decisions:
- issue: Agência pessoal de Satanás na explicação da parábola
  choice: Satanás vem e tira a palavra
  alternative: o adversário vem e tira a palavra
  rationale: O grego usa ὁ Σατανᾶς como nome/título de uma figura pessoal; a tradução não transforma essa agência em mera abstração.
- issue: Sentido de εἰς αὐτούς
  choice: semeada neles
  alternative: semeada para dentro deles
  rationale: A forma idiomática 'neles' preserva a recepção interior sugerida pelo contexto, enquanto a nota registra a nuance direcional possível sem a resolver indevidamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A construção conserva a metáfora, a repetição de “palavra” e a sequência enfática do grego.
