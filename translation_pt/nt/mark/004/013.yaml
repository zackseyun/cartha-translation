  text: Καὶ λέγει αὐτοῖς· Οὐκ οἴδατε τὴν παραβολὴν ταύτην, καὶ πῶς πάσας τὰς παραβολὰς γνώσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/013.yaml
  text: And he says to them[a], “Do you not understand this parable? Then how will you understand all the parables?”
translation:
  language: pt
  text: 'E ele lhes diz: “Vocês não entendem esta parábola? Então como entenderão todas as parábolas?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Vocês não conhecem esta parábola? E como conhecerão todas as parábolas?” Os dois verbos gregos podem ser traduzidos por “conhecer” ou “saber”, mas aqui têm o sentido de entender.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico característico de Marcos e sua vivacidade narrativa.
- source_word: οἴδατε
  choice: entendem
  rationale: Embora o verbo possa significar literalmente “sabem” ou “conhecem”, neste contexto indica compreender o sentido da parábola.
- source_word: παραβολὴν ταύτην
  choice: esta parábola
  rationale: “Parábola” é o termo corrente e preciso para essa forma de ensino; o demonstrativo aponta para a narrativa anterior.
- source_word: καὶ πῶς
  choice: Então como
  rationale: O καί liga as perguntas e, no contexto, introduz a consequência lógica da primeira; “então” exprime essa relação naturalmente em português.
- source_word: πάσας τὰς παραβολὰς
  choice: todas as parábolas
  rationale: Reproduz o plural abrangente e se refere de modo geral ao ensino de Jesus por parábolas.
- source_word: γνώσεσθε
  choice: entenderão
  rationale: Neste contexto, o futuro de γινώσκω trata de captar o sentido das parábolas; “entenderão” preserva a ligação retórica com οἴδατε.
theological_decisions:
- issue: Relação entre οἴδατε e γνώσεσθε
  choice: Traduzir ambos por formas de “entender”
  alternative: Traduzir literalmente por “conhecer/saber”, ou diferenciar os verbos como “sabem” e “entenderão”
  rationale: A questão é a compreensão do significado das parábolas, não o simples conhecimento de sua existência. A tradução comum mantém a força retórica sem apagar em nota a diferença lexical grega.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” comunica naturalmente o plural de αὐτοῖς e dos verbos, sem regionalismo marcado. O presente histórico foi preservado.
