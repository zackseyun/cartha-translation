revisions:
- from: E começou outra vez a ensinar à beira-mar. Uma multidão enorme se reúne ao redor dele[a]; por isso, ele entrou num barco e sentou-se, no mar[b], enquanto toda a multidão ficou em terra, junto ao mar.
  to: E começou outra vez a ensinar junto ao mar. Uma multidão enorme se reúne junto dele[a], de modo que ele entrou num barco e sentou-se nele, no mar[b], enquanto toda a multidão estava em terra, junto ao mar.
  rationale: A revisão torna mais explícita a direção de πρὸς αὐτόν, traduz ὥστε com uma relação consecutiva mais próxima e esclarece, no próprio texto, que Jesus se sentou no barco situado no mar. As notas e seus marcadores permanecem adequadamente ancorados.
