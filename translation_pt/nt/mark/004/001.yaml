  text: Καὶ πάλιν ἤρξατο διδάσκειν παρὰ τὴν θάλασσαν. καὶ ⸀συνάγεται πρὸς αὐτὸν ὄχλος ⸀πλεῖστος, ὥστε αὐτὸν ⸂εἰς πλοῖον ἐμβάντα⸃ καθῆσθαι ἐν τῇ θαλάσσῃ, καὶ πᾶς ὁ ὄχλος πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς ⸀ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/001.yaml
  text: And again he began to teach beside the sea. And a very large crowd gathers to him, so that he got into a boat and sat on the sea, and the whole crowd was by the sea on the land.
translation:
  language: pt
  text: E começou outra vez a ensinar junto ao mar. Uma multidão enorme se reúne junto dele[a], de modo que ele entrou num barco e sentou-se nele, no mar[b], enquanto toda a multidão estava em terra, junto ao mar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “está se reunindo junto dele”. Marcos usa com frequência o presente histórico para dar vivacidade à narração.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, sobre a água, dentro de um barco, enquanto a multidão permanecia em terra.
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν
  choice: outra vez
  rationale: Expressa de modo natural a repetição da atividade de Jesus e mantém o sentido direto do advérbio.
- source_word: ἤρξατο διδάσκειν
  choice: começou a ensinar
  rationale: Preserva a construção ingressiva e soa natural em português atual.
- source_word: παρὰ τὴν θάλασσαν
  choice: à beira-mar
  rationale: Comunica a localização junto ao mar sem substituir o termo do texto por 'lago'.
- source_word: συνάγεται
  choice: se reúne
  rationale: Mantém o presente histórico característico da narração vívida de Marcos.
- source_word: ὄχλος πλεῖστος
  choice: uma multidão enorme
  rationale: Transmite a forte intensificação de πλεῖστος em linguagem corrente e digna.
- source_word: πρὸς αὐτόν
  choice: ao redor dele
  rationale: No contexto da reunião de uma multidão, expressa naturalmente o movimento em direção a Jesus e sua concentração junto dele.
- source_word: ὥστε
  choice: por isso
  rationale: Apresenta de forma idiomática o resultado provocado pelo tamanho da multidão.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: ele entrou num barco
  rationale: Converte o particípio subordinado em oração finita natural em português, sem alterar a sequência da ação.
- source_word: καθῆσθαι
  choice: sentou-se
  rationale: Traduz diretamente a ação resultante e preserva a prática de ensinar sentado.
- source_word: ἐν τῇ θαλάσσῃ
  choice: no mar
  rationale: Mantém formalmente a expressão grega; a nota esclarece que Jesus estava sobre a água dentro do barco.
- source_word: πᾶς ὁ ὄχλος
  choice: toda a multidão
  rationale: Preserva o valor coletivo e abrangente da expressão grega.
- source_word: ἐπὶ τῆς γῆς
  choice: em terra
  rationale: É a forma portuguesa idiomática de contrastar a posição da multidão com a de Jesus no barco.
