source:
  edition: SBLGNT
  text: καὶ ⸀παραγγέλλει τῷ ὄχλῳ ἀναπεσεῖν ἐπὶ τῆς γῆς· καὶ λαβὼν τοὺς ἑπτὰ ἄρτους εὐχαριστήσας ἔκλασεν καὶ ἐδίδου τοῖς μαθηταῖς αὐτοῦ ἵνα ⸀παρατιθῶσιν καὶ παρέθηκαν τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/006.yaml
  text: And he instructed the crowd to recline on the ground[a]. Then, taking the seven loaves, after giving thanks he broke them and kept giving them to his disciples so that they might set them before the crowd[b], and they set them before the crowd.
translation:
  language: pt
  text: E ordenou à multidão que se reclinasse no chão[a]. Então, tomou os sete pães, deu graças, partiu-os e continuou a entregá-los aos seus discípulos, para que os servissem à multidão[b]; e eles os serviram à multidão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se sentasse”. O verbo grego indica mais especificamente a postura de reclinar-se para uma refeição.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os pusessem diante da multidão”. O verbo grego é usado para apresentar ou servir alimentos.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλει
  choice: ordenou
  rationale: O verbo expressa uma ordem ou instrução com autoridade. “Ordenou” conserva essa força e o presente histórico é vertido pelo passado, mais natural na narrativa em português.
- source_word: ἀναπεσεῖν
  choice: que se acomodasse
  rationale: O verbo indica reclinar-se, especialmente para uma refeição. “Acomodar-se” é natural em português e permite registrar em nota o sentido mais específico do grego.
- source_word: ἐπὶ τῆς γῆς
  choice: no chão
  rationale: Neste contexto, γῆ designa a superfície sobre a qual a multidão se acomoda; “no chão” é a expressão corrente e precisa.
- source_word: λαβὼν τοὺς ἑπτὰ ἄρτους
  choice: tomou os sete pães
  rationale: Ἄρτοι são pães ou unidades de pão no contexto da refeição. A oração coordenada reproduz com naturalidade a sequência do particípio grego.
- source_word: εὐχαριστήσας
  choice: deu graças
  rationale: A expressão comunica a ação de agradecer antes da refeição sem acrescentar o objeto “a Deus”, que permanece implícito no original.
- source_word: ἔκλασεν
  choice: partiu-os
  rationale: O pronome retoma claramente os sete pães e torna explícito em português o objeto subentendido no grego.
- source_word: ἐδίδου
  choice: continuou a entregá-los
  rationale: O imperfeito sugere ação continuada ou repetida. “Continuou a entregá-los” preserva esse aspecto distributivo.
- source_word: ἵνα παρατιθῶσιν
  choice: para que os servissem à multidão
  rationale: Παρατίθημι significa literalmente pôr diante de alguém, sobretudo alimentos. “Servir” é a forma natural em português neste contexto, enquanto a imagem literal é preservada em nota.
- source_word: παρέθηκαν
  choice: eles os serviram à multidão
  rationale: O aoristo relata a execução da ação pelos discípulos. A repetição de “serviram” mantém a ligação lexical com a oração anterior sem tornar a frase artificial.
- source_word: ὄχλος
  choice: multidão
  rationale: “Multidão” é corrente, digna e adequada ao grupo numeroso descrito pela narrativa.
theological_decisions:
- issue: Sequência narrativa e possível ressonância eucarística
  choice: “deu graças”, sem terminologia sacramental adicional
  alternative: Explicitar uma referência eucarística ou acrescentar “a Deus”
  rationale: A linguagem descreve a ação de graças numa refeição e pode ter ressonâncias para leitores cristãos, mas o versículo não formula aqui uma doutrina sacramental nem explicita o objeto do agradecimento.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe evita literalismo rígido, preserva o aspecto contínuo de ἐδίδου e registra em notas as imagens concretas de reclinar-se e pôr o alimento diante das pessoas.
