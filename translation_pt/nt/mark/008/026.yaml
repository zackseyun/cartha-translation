  text: καὶ ἀπέστειλεν αὐτὸν ⸀εἰς οἶκον αὐτοῦ λέγων· Μηδὲ εἰς τὴν κώμην ⸀εἰσέλθῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/026.yaml
  text: And he sent him to his home[a], saying, “Do not even enter the village.”
translation:
  language: pt
  text: 'E ele o enviou para casa, dizendo: “Não entre nem mesmo no povoado.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos acrescentam: “e não diga nada a ninguém no povoado”.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: mandou
  rationale: Neste contexto, o verbo indica que Jesus despediu o homem, orientando-o a ir para casa. “Mandou” é natural em português e preserva a ideia de envio sem sugerir uma missão formal.
- source_word: εἰς οἶκον αὐτοῦ
  choice: para casa
  rationale: Embora a expressão possa ser vertida literalmente como “para a casa dele”, “para casa” comunica de modo idiomático que ele devia retornar à própria moradia.
- source_word: λέγων
  choice: dizendo
  rationale: Preserva a ligação participial entre o envio e a instrução dada por Jesus.
- source_word: Μηδὲ
  choice: nem mesmo
  rationale: 'Expressa a força enfática da negação: o homem não devia sequer entrar no povoado.'
- source_word: κώμην
  choice: povoado
  rationale: κώμη designa normalmente uma localidade pequena; “povoado” é claro e adequado ao contexto.
- source_word: εἰσέλθῃς
  choice: entre
  rationale: O subjuntivo aoristo em uma proibição é expresso naturalmente em português pelo imperativo negativo “não entre”.
theological_decisions:
- issue: Alcance da proibição de Jesus quanto ao povoado
  choice: A ordem proíbe diretamente a entrada no povoado, sem explicitar motivo algum.
  alternative: Alguns manuscritos ampliam a ordem, acrescentando que o homem não deveria contar nada a ninguém no povoado.
  rationale: O texto da SBLGNT contém somente a proibição de entrar no povoado; a redação mais longa não deve ser incorporada ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Então” cria uma transição narrativa natural; “para casa” evita uma formulação possessiva desnecessariamente pesada, e “nem mesmo” mantém a ênfase da proibição.
