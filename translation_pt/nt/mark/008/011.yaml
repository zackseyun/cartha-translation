id: MRK.8.11
reference: Mark 8:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθον οἱ Φαρισαῖοι καὶ ἤρξαντο συζητεῖν αὐτῷ, ζητοῦντες παρ’ αὐτοῦ σημεῖον ἀπὸ τοῦ οὐρανοῦ, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/011.yaml
  text: And the Pharisees came out and began to argue with him[a], seeking from him a sign from heaven, testing him.
translation:
  language: pt
  text: Então os fariseus saíram e começaram a discutir com ele, pedindo-lhe um sinal vindo do céu[a], para pô-lo à prova.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um sinal vindo do firmamento”; mais provavelmente, a expressão se refere a um sinal de origem celestial, isto é, divina.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: saíram
  rationale: O aoristo de ἐξέρχομαι indica que entraram em cena saindo de algum lugar não especificado. “Saíram” preserva o movimento sem acrescentar uma origem.
- source_word: ἤρξαντο συζητεῖν
  choice: começaram a discutir
  rationale: Mantém o aspecto ingressivo de ἤρξαντο e expressa o caráter controverso de συζητέω neste contexto hostil.
- source_word: αὐτῷ
  choice: com ele
  rationale: O dativo regido por συζητεῖν é naturalmente expresso por “com ele”; mantém-se o pronome do grego sem inserir o nome de Jesus.
- source_word: ζητοῦντες παρ’ αὐτοῦ
  choice: pedindo-lhe
  rationale: Embora ζητέω possa ser traduzido literalmente como “buscar”, neste contexto significa solicitar algo a alguém. “Pedindo-lhe” reúne de modo natural o particípio e παρά com genitivo, sem intensificar para “exigindo”.
- source_word: σημεῖον
  choice: um sinal
  rationale: “Sinal” preserva a ênfase na função comprobatória do ato, sem reduzi-lo genericamente a um milagre.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: vindo do céu
  rationale: A formulação conserva a imagem e a ambiguidade do original, ao mesmo tempo que indica naturalmente origem; no contexto, é provável que se trate de procedência ou autenticação divina.
- source_word: πειράζοντες αὐτόν
  choice: para pô-lo à prova
  rationale: O particípio expressa a finalidade ou motivação hostil do pedido. “Pôr à prova” preserva o sentido de testar sem sugerir necessariamente indução ao pecado.
theological_decisions:
- issue: Sentido de “do céu” no pedido de um sinal
  choice: Manter “do céu” no texto, com provável sentido de origem ou autenticação divina
  alternative: Entender literalmente como um sinal vindo do céu físico
  rationale: O contexto judaico e evangélico favorece a referência à autoridade divina, mas a tradução não deve eliminar a possibilidade imagética de algo procedente do céu; por isso, a expressão literal é mantida e esclarecida em nota.
- issue: Nuance de πειράζοντες
  choice: “para pô-lo à prova”
  alternative: “tentando-o”
  rationale: Aqui os fariseus submetem Jesus a um teste hostil. “Tentando-o” poderia ser entendido principalmente como indução ao pecado, sentido não exigido pelo contexto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “pedindo-lhe” é corrente em registro bíblico contemporâneo e evita a rigidez de “buscando dele”. “Então” dá continuidade narrativa natural a Καί sem sobrecarregar o versículo.
