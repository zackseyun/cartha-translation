id: MRK.8.25
reference: Mark 8:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶτα πάλιν ⸀ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ, καὶ ⸂διέβλεψεν καὶ ἀπεκατέστη καὶ ἐνέβλεπεν⸃ τηλαυγῶς ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/025.yaml
  text: Then again he laid his hands on his eyes[a], and he saw clearly and was restored[b], and he was seeing everything distinctly.
translation:
  language: pt
  text: Então Jesus tornou a pôr as mãos sobre os olhos dele[a]. O homem viu com clareza, ficou restabelecido e continuava vendo tudo nitidamente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem uma redação refletida em traduções como: “e ele olhou atentamente, ficou restabelecido e viu tudo claramente”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “conseguia ver tudo claramente”; a oração final combina um verbo no imperfeito com um advérbio que indica visão clara ou distinta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα πάλιν
  choice: Então ... tornou a
  rationale: “Então” marca a sequência, e “tornou a” expressa a repetição da ação de modo natural em português.
- source_word: ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: Jesus tornou a pôr as mãos sobre os olhos dele
  rationale: “Pôr as mãos sobre” preserva a ação física concreta. Os sujeitos “Jesus” e “o homem” são explicitados a partir do contexto para evitar a ambiguidade pronominal que seria pouco natural em português.
- source_word: διέβλεψεν
  choice: viu com clareza
  rationale: O verbo indica visão clara ou recuperação da capacidade de enxergar com clareza; esta formulação se ajusta ao avanço da visão parcial para a plena sem importar a leitura variante “olhou atentamente”.
- source_word: ἀπεκατέστη
  choice: ficou restabelecido
  rationale: Preserva a ideia de restauração a uma condição adequada sem especificar além do grego se o foco recai sobre cura ou normalização da visão.
- source_word: ἐνέβλεπεν
  choice: continuava vendo
  rationale: O imperfeito descreve a visão como estado em curso ou resultado persistente após os acontecimentos expressos pelos aoristos.
- source_word: τηλαυγῶς
  choice: nitidamente
  rationale: Comunica visão clara e distinta; evita repetir “com clareza” e não exclui por explicitação indevida a possível nuance de alcance visual.
- source_word: ἅπαντα
  choice: tudo
  rationale: É a forma idiomática e abrangente de expressar o neutro plural em português.
theological_decisions:
- issue: Apresentação narrativa da cura em duas etapas
  choice: Preservar a progressão entre ver com clareza, ficar restabelecido e continuar vendo nitidamente.
  alternative: Reduzir toda a sequência a uma única declaração de cura instantânea e concluída.
  rationale: A sucessão verbal grega, sobretudo a passagem dos aoristos ao imperfeito ἐνέβλεπεν, sustenta um desenvolvimento narrativo e um estado resultante; a tradução não deve eliminar essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em duas frases e a explicitação contextual dos sujeitos evitam confusão entre Jesus e o homem curado, sem alterar a sequência das ações. “Continuava vendo” conserva de modo natural o valor imperfectivo.
