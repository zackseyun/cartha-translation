reference: Mark 8:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου· καὶ ἐν τῇ ὁδῷ ἐπηρώτα τοὺς μαθητὰς αὐτοῦ λέγων αὐτοῖς· Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/027.yaml
  text: And Jesus went out[a], with his disciples, to the villages of Caesarea Philippi. And on the way he was asking his disciples, saying to them, “Who do people say that I am?”
translation:
  language: pt
  text: 'Jesus saiu com os seus discípulos para os povoados de Cesareia de Filipe. No caminho, perguntava aos seus discípulos: “Quem as pessoas[a] dizem que eu sou?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego usa aqui uma palavra que pode ser traduzida literalmente como “os seres humanos” ou, no uso tradicional, “os homens”; neste contexto, refere-se às pessoas em geral, não apenas aos homens.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: O aoristo de ἐξέρχομαι expressa aqui o deslocamento de Jesus; “saiu” é direto, natural e não acrescenta uma ideia de partida definitiva.
- source_word: κώμας
  choice: povoados
  rationale: κώμη designa normalmente uma povoação menor que uma cidade. “Povoados” comunica bem esse sentido e se ajusta à região ao redor de Cesareia de Filipe.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: Cesareia de Filipe
  rationale: É a forma portuguesa corrente do topônimo e distingue essa localidade de outras chamadas Cesareia.
- source_word: ἐν τῇ ὁδῷ
  choice: No caminho
  rationale: Expressão idiomática que conserva tanto a situação narrativa quanto o motivo marcano do caminho.
- source_word: ἐπηρώτα
  choice: perguntava
  rationale: O imperfeito indica ação em curso no cenário narrado. “Perguntava” preserva esse aspecto sem sugerir necessariamente repetição enfática.
- source_word: λέγων αὐτοῖς
  choice: 'perguntava aos seus discípulos:'
  rationale: Em português, introduzir diretamente a fala após “perguntava” transmite com naturalidade a função do particípio λέγων αὐτοῖς, evitando a redundância pouco idiomática de “perguntava, dizendo-lhes”.
- source_word: Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
  choice: Quem as pessoas dizem que eu sou?
  rationale: τίνα ... εἶναι pergunta pela identidade de Jesus. ἄνθρωποι é genérico neste contexto, por isso “as pessoas” é mais exato que “os homens” e a construção mantém a tensão aberta da pergunta.
- source_word: οἱ μαθηταὶ αὐτοῦ / τοὺς μαθητὰς αὐτοῦ
  choice: os seus discípulos
  rationale: A tradução representa o possessivo αὐτοῦ nas duas ocorrências e emprega o termo português tradicional e claro para μαθηταί.
theological_decisions:
- issue: Sentido genérico de ἄνθρωποι na pergunta de Jesus
  choice: as pessoas
  alternative: os homens
  rationale: Embora o substantivo esteja no masculino gramatical, refere-se aqui ao público em geral, e não exclusivamente a pessoas do sexo masculino. “As pessoas” preserva esse alcance sem impor uma restrição ausente do grego.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Povoados” evita elevar κώμας a “cidades”; “perguntava” conserva o aspecto do imperfeito; a fórmula participial grega foi integrada à pontuação natural do discurso direto.
