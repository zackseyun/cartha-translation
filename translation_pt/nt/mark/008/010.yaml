  text: καὶ ⸀εὐθὺς ἐμβὰς εἰς τὸ πλοῖον μετὰ τῶν μαθητῶν αὐτοῦ ἦλθεν εἰς τὰ μέρη Δαλμανουθά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/010.yaml
  text: And immediately[a], getting into the boat with his disciples, he went to the region of Dalmanutha.
translation:
  language: pt
  text: E imediatamente, depois de entrar no barco com os seus discípulos, foi para a região de Dalmanuta[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os arredores de Dalmanuta”. O grego emprega literalmente uma expressão no plural: “as partes/regiões de Dalmanuta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Preserva a força temporal e a urgência característica da narrativa de Marcos em linguagem portuguesa corrente.
- source_word: ἐμβὰς
  choice: entrando
  rationale: Reproduz de modo natural o particípio aoristo, cuja ação antecede a do verbo principal.
- source_word: πλοῖον
  choice: barco
  rationale: É o termo moderno mais adequado para a embarcação usada no contexto do mar da Galileia; “navio” sugeriria uma embarcação maior.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: com os seus discípulos
  rationale: Expressa com clareza e concisão a ideia de acompanhamento indicada por μετά com o genitivo.
- source_word: ἦλθεν
  choice: foi
  rationale: No movimento narrativo em direção a um destino, “foi” é natural em português e corresponde ao valor contextual de ἔρχομαι.
- source_word: τὰ μέρη
  choice: a região
  rationale: Embora o grego use uma expressão plural, ela designa idiomaticamente uma área ou distrito; “a região” comunica esse sentido com naturalidade.
- source_word: Δαλμανουθά
  choice: Dalmanuta
  rationale: Transliteração portuguesa do topônimo grego, com adaptação ortográfica natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do grego sem sacrificar a naturalidade. O marcador da nota foi colocado junto de “região de Dalmanuta”, expressão à qual a variante lexical se refere.
