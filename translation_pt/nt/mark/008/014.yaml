source:
  edition: SBLGNT
  text: Καὶ ἐπελάθοντο λαβεῖν ἄρτους, καὶ εἰ μὴ ἕνα ἄρτον οὐκ εἶχον μεθ’ ἑαυτῶν ἐν τῷ πλοίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/014.yaml
  text: And they had forgotten to take bread[a], and except for one loaf they had no bread with them in the boat.
translation:
  language: pt
  text: Eles tinham se esquecido de levar pão[a] e não tinham pão consigo no barco, a não ser um único pão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “pães”. O plural grego ἄρτους pode se referir a pães individuais, mas aqui provavelmente significa pão ou provisões em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελάθοντο
  choice: tinham se esquecido
  rationale: O aoristo de ἐπιλανθάνομαι indica que o esquecimento ocorreu antes da situação descrita; o mais-que-perfeito composto é natural em português e explicita essa relação narrativa.
- source_word: λαβεῖν
  choice: de levar
  rationale: O infinitivo completa o verbo de esquecimento. “Levar” expressa naturalmente a ideia de trazer pão consigo para a viagem.
- source_word: ἄρτους
  choice: pão
  rationale: Embora o plural possa designar pães individuais, neste contexto refere-se naturalmente ao alimento ou à provisão em geral.
- source_word: εἰ μὴ ἕνα ἄρτον
  choice: a não ser por um único pão
  rationale: εἰ μή tem sentido exceptivo aqui. “Um único pão” preserva a singularidade enfática de ἕνα ἄρτον.
- source_word: οὐκ εἶχον
  choice: não tinham pão
  rationale: A repetição de “pão” torna explícito em português o objeto subentendido pelo grego e conserva o contraste com o único pão.
- source_word: μεθ’ ἑαυτῶν
  choice: consigo
  rationale: Forma idiomática e concisa de expressar que o pão estava com eles.
- source_word: ἐν τῷ πλοίῳ
  choice: no barco
  rationale: Equivalente direto e natural para o cenário indicado por ἐν com πλοῖον.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém a estrutura exceptiva do grego e a distinção entre “pão” como provisão geral e “um único pão” como unidade contável.
