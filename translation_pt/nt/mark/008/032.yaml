source:
  edition: SBLGNT
  text: καὶ παρρησίᾳ τὸν λόγον ἐλάλει. καὶ προσλαβόμενος ⸂ὁ Πέτρος αὐτὸν⸃ ἤρξατο ἐπιτιμᾶν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/032.yaml
  text: And he was speaking the word openly[a]. And Peter took him aside and began to rebuke him.
translation:
  language: pt
  text: E ele falava abertamente[a] sobre isso. Então Pedro o levou à parte e começou a repreendê-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “claramente” ou “com franqueza”. O termo grego indica uma fala franca, aberta e sem ocultação.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: abertamente
  rationale: O substantivo no dativo tem valor adverbial e indica fala franca, aberta e sem ocultação. “Abertamente” é natural em português e preserva a ênfase principal; “claramente” e “com franqueza” também são possíveis.
- source_word: τὸν λόγον
  choice: sobre isso
  rationale: A expressão retoma o conteúdo da predição imediatamente anterior. Em português corrente, “falava sobre isso” comunica com clareza essa referência discursiva; “a palavra” seria mais formalmente próximo, mas poderia soar obscuro ou sugerir um referente técnico não exigido pelo contexto.
- source_word: ἐλάλει
  choice: falava
  rationale: O imperfeito expressa ação em andamento; “falava” preserva naturalmente esse aspecto sem sugerir repetição excessiva.
- source_word: προσλαβόμενος
  choice: chamou à parte
  rationale: No contexto, o particípio descreve Pedro levando Jesus à parte para falar com ele. “Chamou à parte” é idiomático e torna explícita a força contextual sem acrescentar uma motivação.
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: começou a repreendê-lo
  rationale: A construção ἄρχομαι com infinitivo é representada diretamente por “começou a”. “Repreender” transmite a correção forte expressa por ἐπιτιμάω.
theological_decisions:
- issue: Força de παρρησίᾳ na predição do sofrimento de Jesus
  choice: abertamente
  alternative: claramente; com franqueza
  rationale: A tradução destaca que Jesus falava sem ocultação e com franqueza, preservando a relação narrativa com a reação direta de Pedro. A nota mantém disponíveis as nuances de clareza e franqueza sem escolher uma interpretação teológica mais estreita.
- issue: Referente de τὸν λόγον
  choice: sobre isso
  alternative: a palavra; essa mensagem; esse assunto
  rationale: O referente é o ensino precedente de Jesus sobre seu sofrimento, rejeição, morte e ressurreição. A forma pronominal preserva essa ligação contextual sem transformar “palavra” em título ou conceito teológico técnico.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A sintaxe preserva o aspecto contínuo do imperfeito e a transição narrativa. O pronome em “repreendê-lo” refere-se inequivocamente a Jesus.
