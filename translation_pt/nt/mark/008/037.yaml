  text: ⸂τί γὰρ⸃ ⸀δοῖ ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/037.yaml
  text: For what can a man give in exchange for his life?[a]
translation:
  language: pt
  text: Pois o que alguém poderia dar em troca de sua vida?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alma”; a palavra grega pode significar “vida”, “a própria pessoa” ou “alma”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Pois o que
  rationale: τί introduz a pergunta retórica, e γάρ a liga de modo explicativo à declaração anterior. “Pois o que” preserva essa conexão em português natural.
- source_word: δοῖ
  choice: poderia dar
  rationale: O aoristo do subjuntivo de δίδωμι ocorre numa pergunta retórica. “Poderia dar” expressa de maneira idiomática a possibilidade considerada e a impossibilidade implícita.
- source_word: ἄνθρωπος
  choice: alguém
  rationale: Embora o substantivo esteja no masculino singular, aqui tem sentido humano genérico. “Alguém” comunica esse valor representativo com naturalidade e sem restringir a referência a homens.
- source_word: ἀντάλλαγμα
  choice: em troca de
  rationale: O substantivo designa aquilo que se dá como troca, compensação ou preço equivalente. A locução “em troca de” é a formulação portuguesa mais natural depois de “dar”.
- source_word: τῆς ψυχῆς αὐτοῦ
  choice: de sua vida
  rationale: No contexto de Marcos 8:35–37, ψυχή abrange a vida e a própria pessoa. “Vida” mantém a ligação com os versículos anteriores, enquanto a nota registra “alma” e a amplitude semântica do termo.
theological_decisions:
- issue: Tradução de ψυχή numa declaração sobre perda, ganho e salvação
  choice: vida
  alternative: alma; a si mesmo
  rationale: '“Vida” oferece clareza e coerência contextual, mas ψυχή não se limita à existência biológica: pode envolver a pessoa inteira e sua dimensão mais profunda. A nota preserva essa tensão sem impor uma interpretação teológica mais estreita.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta retórica foi mantida, assim como sua ligação explicativa com o versículo anterior. O pronome possessivo “sua” retoma naturalmente o referente genérico “alguém”.
