source:
  edition: SBLGNT
  text: καὶ ἀναστενάξας τῷ πνεύματι αὐτοῦ λέγει· Τί ἡ γενεὰ αὕτη ⸂ζητεῖ σημεῖον⸃; ἀμὴν λέγω ⸀ὑμῖν, εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/012.yaml
  text: And sighing deeply in his spirit[a], he says, “Why does this generation seek a sign? Truly I say to you, no sign will be given to this generation.”
translation:
  language: pt
  text: 'E, suspirando profundamente em seu espírito, ele diz: “Por que esta geração busca um sinal? Em verdade lhes digo: nenhum sinal será dado a esta geração[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “se será dado um sinal a esta geração” — fórmula grega semelhante a um juramento, cujo sentido é que nenhum sinal será dado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστενάξας
  choice: suspirando profundamente
  rationale: Expressa a força intensificada do verbo grego e soa natural em português, sem exagerar a emoção como poderia ocorrer com “gemendo”.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: em seu espírito
  rationale: Preserva a linguagem antropológica e o provável dativo de esfera ou respeito, em vez de reduzi-lo a “consigo mesmo” ou “interiormente”.
- source_word: λέγει
  choice: ele diz
  rationale: Mantém o presente histórico de Marcos e sua vivacidade narrativa.
- source_word: Τί
  choice: Por que
  rationale: Neste uso idiomático com verbo, τί pergunta pela razão; “por que” comunica isso naturalmente.
- source_word: γενεὰ
  choice: geração
  rationale: Conserva tanto a dimensão coletiva quanto a temporal da expressão grega.
- source_word: ζητεῖ
  choice: busca
  rationale: É o equivalente lexical direto e evita intensificar indevidamente o sentido com “exige”.
- source_word: σημεῖον
  choice: sinal
  rationale: Mantém o termo teologicamente significativo sem acrescentar no texto principal a explicação “milagroso” ou “comprobatório”.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Em verdade lhes digo
  rationale: Reproduz de modo digno e compreensível a fórmula solene de Jesus, com boa legibilidade em português brasileiro e compreensão internacional.
- source_word: εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον
  choice: nenhum sinal será dado a esta geração
  rationale: A oração com εἰ funciona como fórmula elíptica de juramento de sentido enfaticamente negativo; explicitar a negação transmite sua força em português.
theological_decisions:
- issue: Tradução da oração de juramento com εἰ após ἀμὴν λέγω ὑμῖν
  choice: 'Entendê-la como negação enfática: “nenhum sinal será dado a esta geração”'
  alternative: “se algum sinal será dado a esta geração”
  rationale: A alternativa reproduz mais diretamente a forma grega, mas fica incompleta e obscura em português. A tradução escolhida comunica a função pragmática da fórmula sem resolver indevidamente uma tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservam-se “em seu espírito”, o presente histórico “ele diz” e o termo “sinal”. A pontuação segue uso editorial natural em português.
