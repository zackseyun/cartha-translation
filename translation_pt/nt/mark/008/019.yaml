  text: ὅτε τοὺς πέντε ἄρτους ἔκλασα εἰς τοὺς πεντακισχιλίους, πόσους κοφίνους ⸂κλασμάτων πλήρεις⸃ ἤρατε; λέγουσιν αὐτῷ· Δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/019.yaml
  text: When I broke the five loaves for the five thousand[a], how many baskets full of broken pieces did you pick up?” They said to him[c][b], “Twelve.”
translation:
  language: pt
  text: 'Quando parti os cinco pães para os cinco mil[a], quantos cestos cheios de pedaços vocês recolheram?[b] Eles lhe disseram: “Doze.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “para os cinco mil homens”. O grego diz literalmente “os cinco mil”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “vocês apanharam?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε
  choice: Quando
  rationale: Introduz naturalmente a oração temporal que relembra o milagre da alimentação.
- source_word: ἔκλασα
  choice: parti
  rationale: O aoristo de κλάω descreve o ato de partir os pães; “parti” é concreto, corrente e mantém a ligação verbal com os pedaços restantes.
- source_word: τοὺς πέντε ἄρτους
  choice: os cinco pães
  rationale: Em português, “pães” é contável e natural neste contexto, sem necessidade de explicitar “pães inteiros” ou “filões”.
- source_word: εἰς τοὺς πεντακισχιλίους
  choice: para os cinco mil
  rationale: “Para” expressa de modo idiomático a relação com o grupo alimentado; não se acrescenta “homens”, preservando a formulação convencional e a possível abrangência contextual.
- source_word: κοφίνους
  choice: cestos
  rationale: κόφινος designa um cesto; “cestos” é claro e preserva a distinção lexical possível em relação a σπυρίς, frequentemente vertido como “cestas” ou “cestos grandes”.
- source_word: κλασμάτων πλήρεις
  choice: cheios de pedaços
  rationale: Reproduz a construção atributiva e comunica que os cestos continham os pedaços resultantes dos pães partidos.
- source_word: ἤρατε
  choice: vocês recolheram
  rationale: No contexto dos restos, αἴρω tem o sentido prático de apanhar e juntar; “recolheram” é natural em português e conserva o plural da segunda pessoa.
- source_word: λέγουσιν αὐτῷ
  choice: Eles lhe disseram
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, mais natural na narrativa portuguesa, mantendo explícito o destinatário.
- source_word: Δώδεκα
  choice: Doze
  rationale: Mantém a resposta numérica breve, cujo referente, os cestos, já está claro.
theological_decisions:
- issue: Força representativa de πεντακισχιλίους
  choice: os cinco mil
  alternative: os cinco mil homens
  rationale: Embora a forma seja masculina e possa designar homens em certos contextos, aqui funciona como identificação convencional da multidão. Acrescentar “homens” tornaria explícita uma especificidade que o verso não exige e poderia estreitar indevidamente a referência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo e torna explícita a segunda pessoa do plural. A ordem da pergunta segue o grego sem soar artificial; “recolheram” é mais idiomático do que o literal “levantaram” neste contexto.
