  text: Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/002.yaml
  text: I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat.
translation:
  language: pt
  text: Tenho compaixão da multidão, porque já faz três dias que permanece comigo e não tem o que comer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σπλαγχνίζομαι
  choice: Tenho compaixão
  rationale: Expressa a compaixão profunda indicada pelo verbo grego e preserva seu aspecto presente em português natural e digno.
- source_word: ἐπὶ τὸν ὄχλον
  choice: da multidão
  rationale: Com «ter compaixão», a regência idiomática em português é «de»; «multidão» é a correspondência corrente de ὄχλος.
- source_word: ὅτι
  choice: porque
  rationale: Introduz claramente a causa da compaixão de Jesus.
- source_word: ἤδη ἡμέραι τρεῖς
  choice: já faz três dias
  rationale: Transmite de modo natural tanto a duração de três dias quanto a ideia de que esse período já foi alcançado.
- source_word: προσμένουσίν μοι
  choice: permanece comigo
  rationale: Preserva a ideia de continuar junto de alguém; o singular concorda naturalmente com o coletivo «multidão», como também ocorre no texto grego.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: não tem o que comer
  rationale: É uma formulação portuguesa idiomática que comunica com precisão a falta de alimento; o singular mantém a concordância com «multidão».
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém dignidade sem arcaísmo e conserva a referência coletiva à multidão no singular.
