  text: ὅτε ⸀καὶ τοὺς ἑπτὰ εἰς τοὺς τετρακισχιλίους, πόσων σπυρίδων πληρώματα κλασμάτων ἤρατε; ⸂καὶ λέγουσιν αὐτῷ⸃· Ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/020.yaml
  text: And when the seven were for the four thousand[a], how many large baskets full of broken pieces did you pick up? They said to him, “Seven.”
translation:
  language: pt
  text: 'E, quando os sete pães foram repartidos entre os quatro mil, quantos cestos grandes cheios de pedaços vocês recolheram? Eles lhe responderam: “Sete.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε καὶ
  choice: E, quando
  rationale: Introduz naturalmente a segunda parte da comparação de Jesus, preservando tanto a conexão com a pergunta anterior quanto o valor temporal.
- source_word: τοὺς ἑπτὰ
  choice: os sete
  rationale: Mantém a elipse do grego, que remete aos sete pães mencionados no contexto, sem acrescentar na tradução uma palavra ausente do texto.
- source_word: εἰς τοὺς τετρακισχιλίους
  choice: para os quatro mil
  rationale: Expressa de modo conciso a relação dos sete pães com o grupo alimentado; o contexto deixa claro que se trata de pessoas.
- source_word: πόσων σπυρίδων
  choice: quantos cestos grandes
  rationale: σπυρίς designa um cesto grande e contrasta lexicalmente com κόφινος no versículo anterior; o adjetivo preserva essa distinção.
- source_word: πληρώματα κλασμάτων
  choice: cestos grandes cheios de pedaços
  rationale: Comunica em português natural que os cestos continham quantidades completas de pedaços de pão, preservando a imagem concreta.
- source_word: ἤρατε
  choice: vocês recolheram
  rationale: No contexto, αἴρω se refere a juntar e retirar as sobras; “recolheram” é claro, natural e preciso.
- source_word: καὶ λέγουσιν αὐτῷ
  choice: Eles lhe responderam
  rationale: O presente histórico grego é vertido pelo passado narrativo natural em português; “responderam” explicita pragmaticamente a função da fala sem alterar seu conteúdo.
- source_word: Ἑπτά
  choice: Sete
  rationale: Preserva diretamente a resposta numérica breve.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A elipse “os sete” foi preservada porque é compreensível no contexto imediato. “Cestos grandes” mantém a distinção entre σπυρίς aqui e o termo para cestos menores em Marcos 8:19.
