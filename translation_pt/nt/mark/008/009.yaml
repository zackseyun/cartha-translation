  text: ἦσαν ⸀δὲ ὡς τετρακισχίλιοι. καὶ ἀπέλυσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/009.yaml
  text: There were about four thousand[a], and he sent them away.
translation:
  language: pt
  text: Eram cerca de quatro mil, e ele os mandou embora[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dispensou-os”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν
  choice: Eram
  rationale: O verbo εἰμί indica aqui o número das pessoas reunidas. Em português, “eram” expressa isso de modo natural e conciso.
- source_word: δὲ
  choice: ','
  rationale: δέ é um conectivo leve; neste contexto, a continuidade discursiva é preservada naturalmente pela pontuação, sem acrescentar um marcador temporal mais forte.
- source_word: ὡς
  choice: cerca de
  rationale: Diante de um numeral, ὡς indica aproximação; “cerca de” comunica claramente que o total não é exato.
- source_word: τετρακισχίλιοι
  choice: quatro mil
  rationale: O numeral indica o tamanho aproximado do grupo.
- source_word: καὶ
  choice: e
  rationale: A conjunção liga de modo simples a indicação do número à ação seguinte de Jesus.
- source_word: ἀπέλυσεν
  choice: mandou embora
  rationale: Neste contexto, ἀπολύω significa fazer a multidão partir ou dispensá-la. “Mandou embora” é claro, corrente e adequado à narrativa.
- source_word: αὐτούς
  choice: os
  rationale: O pronome retoma as pessoas da multidão e é expresso naturalmente pelo pronome objeto “os”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção concisa preserva a aproximação numérica e a continuidade simples da narrativa. O marcador da nota foi colocado junto à expressão verbal à qual a alternativa lexical se refere.
