id: MRK.8.35
reference: Mark 8:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ⸂ψυχὴν αὐτοῦ⸃ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ⸀ἀπολέσει τὴν ⸄ψυχὴν αὐτοῦ⸅ ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου ⸀σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/035.yaml
  text: For whoever wants to save his life will lose it[b][a], but whoever loses his life for my sake and for the gospel will save it.
translation:
  language: pt
  text: Pois quem quiser salvar a sua vida a perderá; mas quem perder a sua vida por causa de mim e do evangelho a salvará.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alma” nas duas ocorrências; a palavra grega pode significar “vida”, “ser” ou “alma”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχή
  choice: vida
  rationale: No contexto de negar a si mesmo e seguir Jesus, refere-se à vida ou ao próprio ser. “Vida” conserva o paradoxo entre tentar preservá-la e perdê-la por Jesus, sem restringir o termo à parte imaterial da pessoa.
- source_word: σῶσαι / σώσει
  choice: salvar / salvará
  rationale: Mantém a correspondência verbal nas duas metades e o contraste deliberado com “perder”, além de conservar a ressonância soteriológica possível.
- source_word: ἀπολέσει
  choice: perderá
  rationale: Com ψυχή, “perder” expressa de modo natural o paradoxo; “destruir” seria forte demais e “abrir mão” acrescentaria interpretação.
- source_word: ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου
  choice: por causa de mim e do evangelho
  rationale: ἕνεκεν indica causa ou motivo. A formulação é clara e natural em português e aplica a mesma relação a Jesus e ao evangelho.
- source_word: εὐαγγέλιον
  choice: evangelho
  rationale: É o termo consagrado e ainda corrente em português, além de preservar um motivo literário importante em Marcos.
- source_word: ὃς ... ὃς
  choice: quem ... quem
  rationale: Transmite de maneira idiomática o valor genérico e proverbial da construção grega.
- source_word: θέλῃ
  choice: quiser
  rationale: Expressa a volição de forma natural, atual e concisa.
- source_word: αὐτοῦ / αὐτήν
  choice: sua / a
  rationale: “Sua vida” é singular e genericamente aplicável em português; o pronome átono “a” retoma “vida” com naturalidade.
theological_decisions:
- issue: Sentido antropológico de ψυχή no paradoxo de Jesus
  choice: Traduzir ψυχή como “vida” no texto principal
  alternative: Traduzir como “alma”
  rationale: O contexto imediato trata de discipulado, autonegação e da perda da vida por Jesus e pelo evangelho. “Vida” comunica melhor a força concreta do dito, mas a nota preserva a amplitude semântica e a tradução tradicional “alma”.
- issue: Referência genérica no singular
  choice: Usar “quem” e “sua”, formas naturalmente genéricas em português
  alternative: Explicitar “aquele que” com referência masculina
  rationale: O português permite conservar o singular da construção sem atribuir gênero ao referente nem mudar para o plural.
- issue: Alcance salvífico do verbo σῴζω
  choice: Conservar “salvar” nas duas ocorrências
  alternative: Usar “preservar”
  rationale: “Salvar” mantém a tensão entre a preservação da vida presente e a salvação final, sem decidir antecipadamente todo o alcance teológico do dito.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A estrutura paralela e o futuro paradoxal do original foram preservados. “Por causa de” evita uma formulação excessivamente eclesiástica e expressa naturalmente o motivo indicado por ἕνεκεν.
