base_translation:
  language: en
  yaml_path: translation/nt/mark/008/007.yaml
  text: And they had a few small fish[a]; and after blessing them[b], he said to set these also before them.
translation:
  language: pt
  text: Tinham também alguns peixinhos; depois de abençoá-los, ele disse que os servissem também.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰχθύδια ὀλίγα
  choice: alguns peixinhos
  rationale: O diminutivo ἰχθύδια indica peixes pequenos, e ὀλίγα expressa quantidade limitada. “Alguns peixinhos” preserva ambas as nuances de modo natural em português.
- source_word: εὐλογήσας αὐτά
  choice: depois de abençoá-los
  rationale: O particípio aoristo indica ação anterior à ordem, e o pronome plural retoma os peixinhos. “Abençoar” mantém correspondência direta com εὐλογέω sem substituí-lo por “dar graças”.
- source_word: καὶ ταῦτα
  choice: também
  rationale: Neste contexto, καί marca que os peixinhos deveriam ser servidos além dos pães. O objeto já está expresso pelo pronome em “os servissem”, tornando desnecessária a repetição demonstrativa pouco natural “estes também”.
- source_word: παρατιθέναι
  choice: que os servissem
  rationale: Em contexto de refeição, παρατίθημι significa pôr alimento diante de alguém, isto é, servi-lo. A oração com subjuntivo transmite naturalmente em português a instrução introduzida por εἶπεν.
- source_word: εἶπεν
  choice: ele disse
  rationale: Preserva o sentido básico de λέγω, enquanto a construção seguinte comunica o valor instrutivo sem ampliar o verbo para “ordenou”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução conserva a distinção entre “abençoar” e “dar graças” e evita uma formulação passiva ou excessivamente literal para a instrução de servir.
