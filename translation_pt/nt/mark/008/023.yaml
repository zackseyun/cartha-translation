  text: καὶ ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ ⸀ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης, καὶ πτύσας εἰς τὰ ὄμματα αὐτοῦ, ἐπιθεὶς τὰς χεῖρας αὐτῷ, ἐπηρώτα αὐτόν· Εἴ τι ⸀βλέπεις;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/023.yaml
  text: And taking the blind man by the hand[a], he led him out of the village; and after spitting on his eyes and laying his hands on him, he asked him, “Do you see anything?”
translation:
  language: pt
  text: 'E, tomando o cego pela mão, levou-o para fora do povoado. Depois de cuspir nos olhos dele[a] e de pôr as mãos sobre ele, perguntou-lhe: “Você vê alguma coisa?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “cuspir dentro dos olhos dele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ
  choice: tomando o cego pela mão
  rationale: A construção com o genitivo expressa o ato concreto de segurar alguém pela mão. Esta formulação é natural em português e mantém o gesto de orientação e cuidado sem acrescentar interpretação.
- source_word: ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης
  choice: levou-o para fora do povoado
  rationale: Embora ἐκφέρω possa significar “carregar” ou “trazer para fora”, o contexto de tomar o homem pela mão favorece “levar”. κώμη designa uma aldeia ou pequeno núcleo habitado; “povoado” é claro e amplamente compreensível.
- source_word: πτύσας εἰς τὰ ὄμματα αὐτοῦ
  choice: depois de cuspir nos olhos dele
  rationale: O particípio aoristo é expresso naturalmente como ação anterior. “Cuspir nos olhos” preserva a ação física, enquanto a nota registra a força direcional mais literal de εἰς.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: pôr as mãos sobre ele
  rationale: A tradução conserva o contato físico descrito no texto sem lhe atribuir um sentido ritual ou eclesiástico posterior.
- source_word: ἐπηρώτα αὐτόν
  choice: perguntou-lhe
  rationale: O imperfeito grego pode realçar o desenvolvimento da ação, mas o pretérito perfeito é a forma narrativa mais natural em português para introduzir a pergunta direta.
- source_word: Εἴ τι βλέπεις;
  choice: Você vê alguma coisa?
  rationale: A pergunta direta preserva o indefinido τι e indaga se há qualquer percepção visual, sem transformar βλέπεις em uma afirmação sobre capacidade.
theological_decisions:
- issue: Preservação da concretude das ações de cura
  choice: Manter explicitamente que Jesus cuspiu nos olhos do homem e pôs as mãos sobre ele.
  alternative: Suavizar ou generalizar os gestos físicos.
  rationale: O relato apresenta uma sequência concreta e marcante. Suavizá-la apagaria um aspecto deliberado da narrativa.
- issue: Possível conotação ritual da imposição das mãos
  choice: 'Traduzir como descrição simples do toque: “pôr as mãos sobre ele”.'
  alternative: Empregar linguagem que indique um rito formal ou sacramental.
  rationale: Neste contexto, a expressão descreve uma ação de cura; o versículo não exige uma interpretação ritual posterior.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “você” na fala direta por sua naturalidade no português brasileiro e boa inteligibilidade internacional. “Povoado” comunica um núcleo menor que uma cidade. O marcador da nota foi colocado junto à expressão a que efetivamente se refere.
