  yaml_path: translation/nt/mark/008/016.yaml
  text: And they were discussing with one another that they had no bread[a].
translation:
  language: pt
  text: E conversavam entre si sobre não terem pão[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “não tinham pães”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διελογίζοντο
  choice: discutiam
  rationale: O imperfeito indica uma conversa em andamento. “Discutiam” é natural em português e pode expressar que ponderavam o assunto juntos, sem exigir a ideia de uma briga.
- source_word: πρὸς ἀλλήλους
  choice: entre si
  rationale: A expressão indica interação recíproca dentro do grupo; “entre si” é conciso e idiomático.
- source_word: ὅτι
  choice: que
  rationale: Aqui introduz o conteúdo da discussão, e não necessariamente sua causa; “que” preserva essa leitura sintática.
- source_word: ἄρτους
  choice: pão
  rationale: Embora o grego use o plural “pães”, o singular coletivo “pão” é mais natural em português para alimento. A forma literal é preservada em nota porque o contexto imediato conta pães.
- source_word: οὐκ ἔχουσιν
  choice: não tinham
  rationale: O presente grego aparece no conteúdo do discurso, mas o imperfeito em português ajusta naturalmente a frase ao tempo da narrativa sem alterar o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A construção mantém a ambiguidade de ὅτι como introdutor do conteúdo da conversa, em vez de explicá-lo como “porque”.
