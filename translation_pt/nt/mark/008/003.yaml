  text: καὶ ἐὰν ἀπολύσω αὐτοὺς νήστεις εἰς οἶκον αὐτῶν, ἐκλυθήσονται ἐν τῇ ὁδῷ· ⸂καί τινες⸃ αὐτῶν ⸀ἀπὸ μακρόθεν ⸀ἥκασιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/003.yaml
  text: And if I send them away hungry to their homes[a], they will collapse on the way, and some of them have come from far away.
translation:
  language: pt
  text: E, se eu os mandar para casa sem comer, eles desfalecerão pelo caminho[a]; e alguns deles vieram de longe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficarão exaustos pelo caminho”. O verbo grego pode indicar perder as forças ou ficar exausto a ponto de desfalecer.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσω
  choice: mandar
  rationale: No contexto da multidão, o verbo significa dispensar ou mandar embora. Com o complemento “para casa”, “mandar” expressa isso de modo natural e sem sugerir libertação de prisão ou escravidão.
- source_word: νήστεις
  choice: sem comer
  rationale: O termo descreve pessoas em jejum ou sem alimento. “Sem comer” comunica o estado físico no contexto sem sugerir necessariamente um jejum religioso intencional.
- source_word: εἰς οἶκον αὐτῶν
  choice: para casa
  rationale: 'A expressão tem sentido distributivo: cada pessoa voltaria para a própria casa. “Para casa” é idiomático em português e abrange naturalmente toda a multidão.'
- source_word: ἐκλυθήσονται
  choice: desfalecerão
  rationale: O verbo indica perder as forças, ficar exausto ou desfalecer. “Desfalecerão” preserva a gravidade física do contexto sem afirmar necessariamente perda completa de consciência.
- source_word: ἐν τῇ ὁδῷ
  choice: pelo caminho
  rationale: Expressão portuguesa natural para algo que ocorre durante o trajeto.
- source_word: καί τινες αὐτῶν
  choice: e alguns deles
  rationale: Mantém a coordenação explícita do grego e identifica naturalmente uma parte da multidão.
- source_word: ἀπὸ μακρόθεν
  choice: de longe
  rationale: Expressa de modo conciso e idiomático a grande distância de onde alguns haviam vindo.
- source_word: ἥκασιν
  choice: vieram
  rationale: O perfeito grego apresenta essas pessoas como tendo chegado de longe. Em português, “vieram” transmite naturalmente esse resultado presente no contexto narrativo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A construção evita que “em jejum” seja entendida exclusivamente como prática religiosa e conserva, em nota, a amplitude de ἐκλυθήσονται.
