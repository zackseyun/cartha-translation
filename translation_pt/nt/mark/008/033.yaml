  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιστραφεὶς καὶ ἰδὼν τοὺς μαθητὰς αὐτοῦ ἐπετίμησεν ⸀Πέτρῳ ⸂καὶ λέγει⸃· Ὕπαγε ὀπίσω μου, Σατανᾶ, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/033.yaml
  text: But turning around and seeing his disciples[a], he rebuked Peter and said, “Get behind me, Satan, because you are not setting your mind on the things of God, but on the things of men.”
translation:
  language: pt
  text: 'Mas Jesus, voltando-se e vendo os seus discípulos, repreendeu Pedro e disse: “Vá para trás de mim, Satanás! Pois você não tem em mente as coisas de Deus, mas as coisas humanas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: se voltou
  rationale: O particípio aoristo, embora formalmente passivo, tem sentido intransitivo e descreve a mudança física de direção de Jesus.
- source_word: ἰδὼν
  choice: olhou para
  rationale: No contexto, expressa que Jesus dirigiu o olhar aos discípulos; a formulação é natural em português e mantém a sequência narrativa.
- source_word: μαθητὰς
  choice: discípulos
  rationale: É a tradução corrente de μαθητής nos Evangelhos e preserva o sentido de aprendizes e seguidores comprometidos de Jesus.
- source_word: ἐπετίμησεν
  choice: repreendeu
  rationale: Comunica uma censura verbal forte e corresponde ao uso recorrente de ἐπιτιμάω nos Evangelhos.
- source_word: καὶ λέγει
  choice: dizendo
  rationale: O presente histórico grego é vertido numa construção narrativa natural em português, sem alterar o sentido.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Vá para trás de mim
  rationale: Preserva a referência espacial e a força da ordem, além de permitir a possível implicação contextual de que Pedro deve voltar à posição de seguidor, sem explicitá-la.
- source_word: Σατανᾶ
  choice: Satanás
  rationale: Transliteração convencional do vocativo, preservando a contundência e a possível dimensão pessoal do termo.
- source_word: φρονεῖς
  choice: pensa
  rationale: Em oposição entre as coisas de Deus e as humanas, o verbo denota orientação mental e preocupação; 'pensa' é claro e natural, embora o contexto lhe dê sentido mais amplo que mera cognição.
- source_word: τὰ τοῦ θεοῦ
  choice: as coisas de Deus
  rationale: Mantém a expressão grega ampla e evita restringi-la a planos, interesses ou preocupações específicos.
- source_word: τὰ τῶν ἀνθρώπων
  choice: as coisas humanas
  rationale: ἄνθρωποι é genérico neste contexto. 'Humanas' expressa com precisão o contraste entre o que pertence à esfera de Deus e o que pertence à humanidade, sem sugerir apenas pessoas do sexo masculino.
theological_decisions:
- issue: Referente de “Satanás” na fala dirigida a Pedro
  choice: Jesus repreende Pedro diretamente com o vocativo “Satanás”, associando sua postura à oposição satânica sem declarar que Pedro seja literalmente Satanás.
  alternative: Jesus estaria falando com Satanás por trás de Pedro, ou usaria o termo apenas no sentido impessoal de “adversário”.
  rationale: Pedro é o objeto explícito da repreensão, e a fala que segue se dirige a ele na segunda pessoa. A tradução conserva a tensão do texto sem acrescentar uma explicação metafísica.
- issue: Sentido de τὰ τῶν ἀνθρώπων
  choice: as coisas humanas
  alternative: as coisas dos homens; os interesses humanos
  rationale: A expressão se refere genericamente ao domínio ou às preocupações da humanidade. A escolha mantém a amplitude do original e o contraste com “as coisas de Deus”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem enfática é preservada, e não se acrescenta explicação denominacional. Nenhuma nota é necessária, pois “coisas humanas” já comunica o sentido genérico de ἀνθρώπων.
