  text: Καὶ ⸀ἔρχονται εἰς Βηθσαϊδάν. καὶ φέρουσιν αὐτῷ τυφλὸν καὶ παρακαλοῦσιν αὐτὸν ἵνα αὐτοῦ ἅψηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/022.yaml
  text: And they came to Bethsaida. And they brought a blind man to him and begged him to touch him.
translation:
  language: pt
  text: E chegaram a Betsaida. Então lhe trouxeram um cego e suplicaram que tocasse nele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: chegaram
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, mais natural na narrativa portuguesa, sem alterar a sequência dos acontecimentos.
- source_word: εἰς Βηθσαϊδάν
  choice: a Betsaida
  rationale: Com um nome de lugar, εἰς indica aqui o destino; «a Betsaida» é uma formulação natural e mantém o nome próprio transliterado.
- source_word: φέρουσιν
  choice: trouxeram
  rationale: O presente histórico é traduzido no passado. «Trouxeram» preserva o sentido amplo sem especificar indevidamente que o homem tenha sido carregado.
- source_word: τυφλὸν
  choice: um cego
  rationale: O adjetivo substantivado masculino singular refere-se a um homem. «Um cego» é conciso, corrente e fiel à forma do texto.
- source_word: παρακαλοῦσιν
  choice: suplicaram
  rationale: Neste contexto, o verbo expressa um pedido insistente, mais forte que um simples «pediram»; «suplicaram» transmite essa intensidade com registro digno.
- source_word: ἵνα αὐτοῦ ἅψηται
  choice: que tocasse nele
  rationale: A oração com ἵνα e subjuntivo apresenta o conteúdo do pedido. «Que tocasse nele» é idiomático em português e representa o verbo ἅπτομαι com seu complemento.
- source_word: καὶ
  choice: E / Então
  rationale: O primeiro καί é preservado como «E», mantendo a ligação paratática de Marcos. O segundo é traduzido como «Então» para expressar a progressão narrativa de modo natural, sem acrescentar uma relação causal.
