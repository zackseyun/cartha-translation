  text: ⸂καὶ ἔφαγον⸃ καὶ ἐχορτάσθησαν, καὶ ἦραν περισσεύματα κλασμάτων ἑπτὰ σπυρίδας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/008.yaml
  text: And they ate and were satisfied[a], and they picked up seven baskets of leftover pieces.
translation:
  language: pt
  text: Eles comeram e ficaram satisfeitos, e recolheram sete cestos de pedaços que sobraram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego σπυρίδας se refere a cestos, provavelmente cestos grandes; no relato da alimentação dos cinco mil, Marcos usa uma palavra diferente (κόφινοι, 6.43).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: comeram
  rationale: O aoristo de ἐσθίω descreve de modo simples a ação passada; “comeram” é direto e natural.
- source_word: ἐχορτάσθησαν
  choice: ficaram satisfeitos
  rationale: χορτάζω indica que comeram até ter o suficiente. A expressão comunica saciedade e provisão plena em português corrente.
- source_word: ἦραν
  choice: recolheram
  rationale: Embora αἴρω possa significar “levantar” ou “pegar”, neste contexto trata-se de juntar os restos após a refeição; “recolheram” expressa naturalmente essa ação.
- source_word: περισσεύματα κλασμάτων
  choice: pedaços que sobraram
  rationale: A construção conserva tanto a ideia dos pedaços partidos (κλασμάτων) quanto a do excedente restante (περισσεύματα), com sintaxe natural em português.
- source_word: ἑπτὰ σπυρίδας
  choice: sete cestos
  rationale: σπυρίς designa um cesto, provavelmente de maior tamanho. O texto principal usa o termo português comum, enquanto a nota registra a possível dimensão e a distinção lexical em Marcos.
