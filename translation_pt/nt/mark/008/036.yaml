id: MRK.8.36
reference: Mark 8:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφελεῖ ⸀ἄνθρωπον ⸂κερδῆσαι τὸν κόσμον ὅλον καὶ ζημιωθῆναι⸃ τὴν ψυχὴν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/036.yaml
  text: For what does it profit a man to gain the whole world and forfeit his life?[a][b]
translation:
  language: pt
  text: Pois que vantagem há em alguém ganhar o mundo inteiro e perder a própria vida?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a própria alma”. A palavra grega ψυχή pode significar “vida”, “alma” ou “o próprio ser”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Pois que
  rationale: τί introduz a pergunta retórica, e γάρ a liga à explicação anterior. “Pois que” conserva essa conexão em português natural.
- source_word: ὠφελεῖ
  choice: vantagem há
  rationale: ὠφελέω significa beneficiar ou trazer proveito. A formulação mantém a ideia de proveito e se encaixa naturalmente na pergunta retórica.
- source_word: ἄνθρωπον
  choice: alguém
  rationale: ἄνθρωπος é singular e genérico neste contexto. “Alguém” comunica com naturalidade que a afirmação se aplica a qualquer ser humano, sem restringi-la ao sexo masculino.
- source_word: κερδῆσαι
  choice: ganhar
  rationale: κερδαίνω significa ganhar ou obter lucro; “ganhar” preserva a metáfora econômica e o contraste com perder.
- source_word: τὸν κόσμον ὅλον
  choice: o mundo inteiro
  rationale: κόσμος, intensificado por ὅλον, indica o mundo em toda a sua extensão. “O mundo inteiro” é corrente e abrangente.
- source_word: ζημιωθῆναι
  choice: perder
  rationale: O infinitivo passivo de ζημιόω pode significar sofrer perda ou ficar privado de algo. “Perder” expressa claramente o contraste com “ganhar”, sem acrescentar a ideia jurídica que “confiscar” poderia sugerir.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: a própria vida
  rationale: ψυχή pode significar vida, alma ou o próprio ser. No contexto imediato de Marcos 8:35–37, “vida” preserva a continuidade do paradoxo de salvar e perder a ψυχή; “própria” representa αὐτοῦ com naturalidade.
theological_decisions:
- issue: Sentido de ψυχή na declaração sobre discipulado
  choice: vida
  alternative: alma
  rationale: O contexto imediato favorece “vida”, pois trata de salvar ou perder a ψυχή por causa de Jesus e do evangelho. Contudo, o termo grego também pode denotar “alma” ou a pessoa em sua totalidade; por isso, a alternativa tradicional é mantida em nota, sem resolver indevidamente a amplitude do termo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Alguém” traduz o singular genérico sem necessidade de nota cultural; a construção preserva a pergunta retórica e o contraste econômico entre ganhar e perder.
