id: MRK.8.15
reference: Mark 8:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ διεστέλλετο αὐτοῖς λέγων· Ὁρᾶτε, βλέπετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ τῆς ζύμης Ἡρῴδου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/015.yaml
  text: And he kept instructing them[a], saying, “Watch out[b]; beware of the leaven of the Pharisees and the leaven of Herod.”
translation:
  language: pt
  text: 'E ele continuava a adverti-los, dizendo: “Fiquem atentos! Tenham cuidado com o fermento[a] dos fariseus e com o fermento de Herodes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “levedura”. Aqui, “fermento” é uma metáfora cuja influência se espalha; o versículo não especifica se ela se refere ao ensino, à hipocrisia ou a outro aspecto associado aos fariseus e a Herodes. Compare Mateus 16:6,12 e Lucas 12:1.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: διεστέλλετο
  choice: continuava a adverti-los
  rationale: O imperfeito indica uma advertência em curso ou reiterada. “Advertir” comunica a seriedade da fala sem transformá-la numa ordem formal única.
- source_word: λέγων
  choice: dizendo
  rationale: O particípio introduz diretamente o conteúdo da advertência e pode ser preservado com naturalidade em português.
- source_word: Ὁρᾶτε
  choice: Fiquem atentos!
  rationale: No imperativo e neste contexto, o verbo pede vigilância, não apenas percepção visual. A formulação mantém a primeira advertência enfática.
- source_word: βλέπετε
  choice: Tenham cuidado
  rationale: O segundo imperativo reforça o primeiro. Uma expressão distinta, mas próxima, preserva a repetição retórica sem soar mecânica.
- source_word: ἀπὸ
  choice: com
  rationale: Em português, “ter cuidado com” é a construção idiomática correspondente neste contexto de advertência, embora a preposição grega expresse literalmente afastamento ou separação.
- source_word: ζύμης
  choice: fermento
  rationale: “Fermento” é corrente em português, preserva a imagem de algo que se espalha pela massa e permite tanto a leitura concreta quanto a metafórica.
- source_word: Φαρισαίων
  choice: dos fariseus
  rationale: Forma portuguesa convencional para o nome do grupo; o genitivo expressa associação com o fermento.
- source_word: Ἡρῴδου
  choice: de Herodes
  rationale: O texto nomeia diretamente Herodes, em paralelo com os fariseus. Não se amplia o referente para sua casa, seu partido ou sua influência.
theological_decisions:
- issue: Sentido metafórico de “fermento”
  choice: Manter a metáfora sem explicá-la no texto principal.
  alternative: Traduzir interpretativamente como “ensino”, “hipocrisia” ou “influência corruptora”.
  rationale: Embora o contexto e os paralelos sinóticos apontem para uma influência negativa, este versículo não define com precisão o aspecto visado. A metáfora preserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A duplicação dos imperativos gregos foi mantida por duas advertências naturais e enfáticas. “Continuava a adverti-los” explicita com moderação o aspecto durativo ou reiterado do imperfeito.
