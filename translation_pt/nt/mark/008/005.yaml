  text: And he asked them, “How many loaves do you have?” They said, “Seven.”
translation:
  language: pt
  text: 'E ele lhes perguntou: “Quantos pães vocês têm?” Eles disseram: “Sete.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva o conectivo narrativo simples e característico de Marcos, sem acrescentar uma nuance temporal como “Então”.
- source_word: ἠρώτα
  choice: perguntou
  rationale: Embora o imperfeito possa indicar ação em curso ou repetida, o pretérito perfeito é a forma narrativa mais natural em português neste contexto e comunica adequadamente o ato de perguntar.
- source_word: αὐτούς
  choice: lhes
  rationale: O pronome retoma os discípulos e funciona naturalmente em português como objeto indireto de “perguntou”.
- source_word: Πόσους
  choice: Quantos
  rationale: Equivalente interrogativo quantitativo direto e idiomático em português.
- source_word: ἔχετε
  choice: vocês têm
  rationale: Expressa com clareza a segunda pessoa do plural em português moderno de ampla compreensão, com boa legibilidade brasileira.
- source_word: ἄρτους
  choice: pães
  rationale: No contexto de contagem, o plural “pães” representa unidades de pão de modo natural, sem exigir o menos corrente “pães inteiros” ou “filões”.
- source_word: οἱ δὲ εἶπαν
  choice: Eles disseram
  rationale: Identifica naturalmente o grupo que responde; a transição entre pergunta e resposta já comunica a função de δέ, sem impor “mas”, que sugeriria contraste excessivo.
- source_word: Ἑπτά
  choice: Sete
  rationale: Tradução direta do numeral cardinal na resposta dos discípulos.
