  text: καὶ ἐπετίμησεν αὐτοῖς ἵνα μηδενὶ λέγωσιν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/030.yaml
  text: And he warned them to tell no one about him[a].
translation:
  language: pt
  text: E ele os advertiu severamente para que não falassem a ninguém a respeito dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os repreendeu” ou “lhes ordenou severamente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: advertiu severamente
  rationale: O verbo pode significar “repreender” e também transmitir uma ordem ou advertência enérgica. Neste contexto, a expressão comunica com naturalidade a força da proibição sem sugerir necessariamente que os discípulos haviam cometido uma falta.
- source_word: αὐτοῖς
  choice: os
  rationale: O pronome dativo plural retoma os discípulos; em português, é expresso naturalmente como objeto direto de “advertiu”.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: para que não falassem a ninguém
  rationale: Após o verbo de advertência, ἵνα com o subjuntivo introduz o conteúdo da ordem. “Para que não falassem” preserva a estrutura e o sentido proibitivo.
- source_word: περὶ αὐτοῦ
  choice: a respeito dele
  rationale: περί com o genitivo significa “a respeito de” ou “acerca de”; a formulação escolhida é clara e digna em português contemporâneo.
theological_decisions:
- issue: Força da ordem de Jesus no contexto do chamado segredo messiânico
  choice: Expressar uma advertência severa para não divulgar sua identidade, sem explicar o motivo do silêncio.
  alternative: “repreendeu-os” ou “ordenou-lhes severamente”
  rationale: O texto apresenta uma proibição enfática, mas não fornece aqui uma teoria sobre sua finalidade. A tradução preserva essa força e deixa em aberto a tensão narrativa e teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Advertiu severamente” mantém o tom enérgico do original; “a respeito dele” evita coloquialismo excessivo.
