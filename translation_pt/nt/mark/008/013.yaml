  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἐμβὰς⸃ ἀπῆλθεν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/013.yaml
  text: And leaving them[a], he got back into the boat and went to the other side.
translation:
  language: pt
  text: E, deixando-os, entrou de novo no barco[a] e foi para o outro lado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “voltou a entrar no barco e foi para o outro lado”. O advérbio πάλιν pode indicar repetição (“de novo”) ou retorno (“voltou a”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεὶς
  choice: deixando
  rationale: O particípio aoristo de ἀφίημι indica aqui que Jesus deixou aquelas pessoas; “deixando” preserva de modo natural a ligação participial com o verbo principal.
- source_word: αὐτοὺς
  choice: os
  rationale: O pronome retoma os fariseus do contexto imediato; o objeto pronominal é claro e conciso em português.
- source_word: πάλιν
  choice: de novo
  rationale: πάλιν pode significar “de novo” ou, conforme o contexto, sugerir retorno. “De novo” preserva mais diretamente o valor adverbial e a repetição do ato de entrar no barco.
- source_word: ἐμβὰς
  choice: entrou ... no barco
  rationale: O particípio de ἐμβαίνω significa entrar ou embarcar. O barco está implícito pelo contexto narrativo e foi explicitado para dar clareza em português.
- source_word: ἀπῆλθεν
  choice: foi
  rationale: O aoristo de ἀπέρχομαι expressa partida; “foi” é natural, e o destino é indicado pela expressão seguinte.
- source_word: εἰς τὸ πέραν
  choice: para o outro lado
  rationale: A expressão designa o outro lado do lago e mantém a formulação geográfica recorrente em Marcos.
