  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀γνοὺς λέγει αὐτοῖς· Τί διαλογίζεσθε ὅτι ἄρτους οὐκ ἔχετε; οὔπω νοεῖτε οὐδὲ συνίετε; ⸀πεπωρωμένην ἔχετε τὴν καρδίαν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/017.yaml
  text: And knowing[a], he says to them[c][b], “Why are you discussing that you have no bread? Do you not yet perceive or understand? Do you have your heart hardened?”
translation:
  language: pt
  text: 'Jesus percebeu isso e lhes disse: “Por que vocês estão discutindo que não têm pão? Ainda não percebem nem entendem? Vocês têm o coração endurecido?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: percebeu isso
  rationale: O particípio aoristo indica que Jesus tomou conhecimento da discussão; “isso” explicita apenas o objeto implícito no contexto imediato.
- source_word: διαλογίζεσθε
  choice: estão discutindo
  rationale: A forma descreve a deliberação ou conversa entre os discípulos; esta expressão é natural em português e se ajusta ao contexto.
- source_word: ἄρτους
  choice: pão
  rationale: Embora o grego use o plural, “pão” como nome não contável é a formulação idiomática em português para a falta desse alimento.
- source_word: νοεῖτε
  choice: percebem
  rationale: Conserva a ideia de apreensão mental e ajuda a distinguir este verbo de συνίετε.
- source_word: συνίετε
  choice: entendem
  rationale: Expressa compreensão e preserva o par retórico “percebem nem entendem” sem fundir os dois verbos.
- source_word: πεπωρωμένην
  choice: endurecido
  rationale: O particípio perfeito passivo descreve um estado persistente de dureza ou insensibilidade; “endurecido” mantém a metáfora bíblica.
- source_word: καρδίαν
  choice: coração
  rationale: Mantém a metáfora da fonte interior da compreensão e da receptividade, e preserva o singular distributivo do grego.
theological_decisions:
- issue: Formulação da pergunta final sobre a condição interior dos discípulos
  choice: Vocês estão com o coração endurecido?
  alternative: O coração de vocês está endurecido?
  rationale: A construção portuguesa com “estar com” reproduz de modo natural a estrutura grega ἔχετε + objeto + particípio, sem transformar a pergunta em afirmação nem explicar a causa do endurecimento. O singular “coração” preserva o idioma distributivo do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. O presente narrativo grego λέγει foi vertido pelo passado narrativo natural “disse”. A repetição interrogativa foi mantida para conservar a força da repreensão.
