base_translation:
  language: en
  yaml_path: translation/nt/mark/008/001.yaml
  text: In those days[a], when again a large crowd was present and they had nothing to eat, he called his disciples and says to them[b],
translation:
  language: pt
  text: 'Naqueles dias, quando novamente uma grande multidão estava reunida[a] e não tinha o que comer, ele chamou os discípulos e lhes diz[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «havendo novamente uma grande multidão». O grego emprega aqui uma construção circunstancial conhecida como genitivo absoluto.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, «lhes diz». Marcos usa com frequência o presente histórico; por isso, algumas traduções regularizam a expressão para o passado: «lhes disse».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείναις ταῖς ἡμέραις
  choice: Naqueles dias
  rationale: Expressão temporal corrente e fiel, que situa a cena sem especificar uma duração além da indicada pelo grego.
- source_word: πάλιν
  choice: novamente
  rationale: Assinala a repetição de uma situação semelhante na narrativa de Marcos; é natural e direto em português.
- source_word: πολλοῦ ὄχλου ὄντος
  choice: havia uma grande multidão
  rationale: Converte a construção circunstancial do genitivo absoluto em uma oração natural em português, preservando a ideia do grande número de pessoas.
- source_word: καὶ μὴ ἐχόντων τί φάγωσιν
  choice: e eles não tinham o que comer
  rationale: O plural retoma a multidão segundo o sentido coletivo e comunica de modo claro a falta de alimento.
- source_word: προσκαλεσάμενος
  choice: chamou
  rationale: No contexto, o verbo indica que ele convocou os discípulos para perto de si; a forma simples «chamou» é natural e evita explicitação desnecessária.
- source_word: τοὺς μαθητάς
  choice: os discípulos
  rationale: O artigo grego identifica os discípulos já conhecidos no contexto. O português não precisa acrescentar o possessivo «seus».
- source_word: λέγει αὐτοῖς
  choice: lhes diz
  rationale: Mantém o presente histórico característico de Marcos e traduz de maneira concisa o pronome dativo αὐτοῖς.
theological_decisions:
- issue: Presente histórico na narrativa de Marcos
  choice: Manter o presente em «lhes diz»
  alternative: 'Regularizar para o passado: «lhes disse»'
  rationale: Embora a sequência «chamou... e lhes diz» seja marcada em português, ela preserva a mudança verbal e a vivacidade narrativa do texto grego, sem alterar o conteúdo teológico.
- issue: Referente implícito do sujeito de προσκαλεσάμενος e λέγει
  choice: Traduzir pelo pronome «ele»
  alternative: Explicitar «Jesus»
  rationale: O grego não repete o nome de Jesus neste versículo; o pronome conserva essa coesão contextual sem acrescentar uma identificação ausente da frase.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente ajustada para naturalidade, enquanto o presente histórico de Marcos foi deliberadamente preservado.
