  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς γὰρ ἐὰν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν ὅταν ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/038.yaml
  text: For whoever is ashamed of me and of my words in this adulterous and sinful generation[a], the Son of Man will also be ashamed of him when he comes in the glory of his Father with the holy angels.
translation:
  language: pt
  text: Pois quem se envergonhar de mim e das minhas palavras nesta geração adúltera e pecadora[a], também o Filho do Homem se envergonhará dele quando vier na glória de seu Pai com os santos anjos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “geração infiel e pecadora”. “Adúltera” foi mantido no texto porque o grego emprega a metáfora profética concreta do adultério para a infidelidade espiritual e moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: se envergonhar de / se envergonhará de
  rationale: Preserva o sentido direto de vergonha em relação a uma pessoa ou às suas palavras e mantém a reciprocidade entre a resposta humana presente e a futura resposta do Filho do Homem.
- source_word: λόγους
  choice: palavras
  rationale: Reproduz o plural grego e conserva a ênfase pessoal e verbal; “mensagem” seria mais interpretativo.
- source_word: γενεᾷ
  choice: geração
  rationale: É o equivalente usual e adequado ao contexto, abrangendo a comunidade humana contemporânea caracterizada moralmente.
- source_word: μοιχαλίδι
  choice: adúltera
  rationale: Mantém a metáfora profética concreta do grego, que evoca infidelidade espiritual e moral, sem substituí-la por uma explicação.
- source_word: ἁμαρτωλῷ
  choice: pecadora
  rationale: É o equivalente adjetival direto e forma um par natural com “adúltera”.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Preserva o título cristológico estabelecido e suas ressonâncias bíblicas e escatológicas.
- source_word: δόξῃ
  choice: glória
  rationale: Conserva o peso bíblico e teológico da honra, majestade e manifestação radiante divina.
- source_word: μετὰ τῶν ἀγγέλων τῶν ἁγίων
  choice: com os santos anjos
  rationale: Reflete naturalmente a construção atributiva, sem acrescentar o possessivo “seus”, ausente do grego.
- source_word: ὃς γὰρ ἐὰν
  choice: Pois quem
  rationale: Expressa de modo natural a condição geral e mantém a conexão explicativa de γάρ.
- source_word: ἐν τῇ γενεᾷ ταύτῃ
  choice: no meio desta ... geração
  rationale: Indica com clareza o ambiente social e moral em que a vergonha é manifestada, sem alterar o referente.
- source_word: αὐτόν
  choice: dele
  rationale: Mantém o singular masculino gramatical ligado ao indivíduo genérico introduzido por “quem”.
theological_decisions:
- issue: Força metafórica de μοιχαλίδι
  choice: Manter “adúltera” no texto principal como metáfora profética de infidelidade espiritual e moral.
  alternative: Traduzir por “infiel” para explicitar o sentido figurado.
  rationale: O termo grego emprega deliberadamente a imagem concreta do adultério, em continuidade com a linguagem profética bíblica; preservá-la mantém a profundidade intertextual.
- issue: Referência de “o Filho do Homem”
  choice: Conservar o título messiânico e escatológico “o Filho do Homem”.
  alternative: Substituir por “eu” ou “o Messias”.
  rationale: O grego apresenta um título cristológico distinto; substituí-lo resolveria indevidamente sua textura e força alusiva.
- issue: Pronome singular αὐτόν
  choice: Traduzir por “dele”, em concordância com o indivíduo genérico “quem”.
  alternative: Empregar uma formulação plural ou impessoal.
  rationale: A escolha reflete a gramática singular do texto sem restringir a aplicação geral da advertência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “No meio desta geração” soa natural e explicita o contexto social de ἐν sem parafrasear. A repetição de “se envergonhar” foi preservada para manter a reciprocidade enfática do original.
