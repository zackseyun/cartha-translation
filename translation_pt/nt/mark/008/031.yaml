  text: Καὶ ἤρξατο διδάσκειν αὐτοὺς ὅτι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ⸀ὑπὸ τῶν πρεσβυτέρων καὶ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ ἀποκτανθῆναι καὶ μετὰ τρεῖς ἡμέρας ἀναστῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/031.yaml
  text: And he began to teach them that the Son of Man must suffer many things[a], and be rejected by the elders and the chief priests and the scribes, and be killed, and after three days rise again.
translation:
  language: pt
  text: E ele começou a ensiná-los que era necessário que o Filho do Homem sofresse muitas coisas, fosse rejeitado pelos anciãos, pelos principais sacerdotes e pelos escribas, fosse morto e, depois de três dias, ressuscitasse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em três dias”. O grego de Marcos diz literalmente “depois de três dias”; algumas tradições traduzem a expressão de modo mais idiomático ou a harmonizam com passagens paralelas que dizem “no terceiro dia”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξατο διδάσκειν
  choice: começou a ensiná-los
  rationale: Preserva o valor ingressivo de ἄρχομαι com infinitivo e expressa naturalmente a transição narrativa.
- source_word: δεῖ
  choice: tinha de
  rationale: Comunica necessidade forte no discurso indireto em tempo passado, sem explicar além do grego a natureza dessa necessidade.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém o título tradicional, sua transparência lexical e suas ressonâncias bíblicas.
- source_word: πολλὰ παθεῖν
  choice: sofrer muitas coisas
  rationale: Reflete de perto o plural πολλά e preserva a amplitude dos sofrimentos anunciados.
- source_word: ἀποδοκιμασθῆναι
  choice: ser rejeitado
  rationale: É uma formulação clara e natural para a desaprovação e rejeição oficial indicadas pelo verbo.
- source_word: ὑπὸ τῶν πρεσβυτέρων
  choice: pelos anciãos
  rationale: Designa o grupo reconhecido de líderes judeus, e não apenas homens idosos.
- source_word: τῶν ἀρχιερέων
  choice: pelos principais sacerdotes
  rationale: No plural, refere-se à elite sacerdotal; evita sugerir a existência simultânea de vários sumos sacerdotes em exercício.
- source_word: τῶν γραμματέων
  choice: pelos escribas
  rationale: Conserva a designação histórica e lexical tradicional do grupo.
- source_word: ἀποκτανθῆναι
  choice: ser morto
  rationale: Traduz diretamente o infinitivo passivo, com linguagem natural e solene.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: depois de três dias
  rationale: Traduz o sentido normal de μετά com acusativo e preserva a formulação própria de Marcos sem harmonizá-la com passagens paralelas.
- source_word: ἀναστῆναι
  choice: ressuscitar
  rationale: Expressa naturalmente em português o infinitivo intransitivo no contexto de retorno da morte, sem mudar para uma construção passiva.
theological_decisions:
- issue: A necessidade expressa por δεῖ na predição da paixão
  choice: tinha de
  alternative: era necessário que
  rationale: Preserva a força da necessidade apresentada no texto, possivelmente divina no contexto, sem inserir uma explicação doutrinária sobre seu mecanismo.
- issue: A expressão temporal μετὰ τρεῖς ἡμέρας
  choice: depois de três dias
  alternative: no terceiro dia
  rationale: Mantém a redação grega de Marcos em vez de harmonizá-la com fórmulas temporais de passagens paralelas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação dos infinitivos preserva o encadeamento enfático do grego. O marcador [a] foi colocado após a expressão temporal a que a nota se refere.
