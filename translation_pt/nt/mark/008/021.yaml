lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a ligação narrativa simples do grego sem acrescentar uma força temporal específica.
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito de λέγω é vertido pelo imperfeito português, preservando seu aspecto durativo ou reiterativo sem tornar a frase artificial.
- source_word: αὐτοῖς
  choice: lhes
  rationale: Traduz diretamente o pronome dativo plural sem explicitar no texto um referente que o versículo deixa implícito.
- source_word: Οὔπω
  choice: ainda não
  rationale: Expressão natural em português para οὔπω, indicando que a compreensão continuava ausente até aquele momento.
- source_word: συνίετε
  choice: entendem
  rationale: Traduz com clareza o sentido de apreender ou compreender mentalmente; a segunda pessoa do plural é expressa de modo natural por “vocês”.
theological_decisions:
- issue: Se deve ser acrescentado um objeto à pergunta de Jesus
  choice: 'Manter o objeto implícito: “Vocês ainda não entendem?”'
  alternative: “Vocês ainda não entendem isso?”
  rationale: O grego não declara o objeto de συνίετε. Não acrescentar “isso” preserva a amplitude e a força da repreensão.
- issue: Forma da pergunta em uma variante textual
  choice: 'Seguir o texto da SBLGNT: “Vocês ainda não entendem?”'
  alternative: “Como é que vocês não entendem?”
  rationale: A tradução principal segue Οὔπω συνίετε da edição indicada, enquanto a nota registra a variante πῶς οὐ συνίετε sem misturá-la ao texto adotado.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Vocês” explicita de forma idiomática o plural já presente no verbo grego, e “lhes dizia” conserva o imperfeito sem rigidez excessiva.
