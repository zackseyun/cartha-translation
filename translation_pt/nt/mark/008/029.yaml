source:
  edition: SBLGNT
  text: καὶ αὐτὸς ⸂ἐπηρώτα αὐτούς⸃· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸀ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ· Σὺ εἶ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/029.yaml
  text: And he was asking them[a], “But who do you say that I am?” Peter answered him, “You are the Messiah.”
translation:
  language: pt
  text: 'E ele lhes perguntava: “Mas vocês, quem dizem que eu sou?” Pedro lhe respondeu: “Você é o Messias[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”.'
    reason: Registra a tradução tradicional alternativa do título grego ὁ χριστός.
lexical_decisions:
- source_word: ἐπηρώτα
  choice: continuou perguntando
  rationale: O imperfeito apresenta a pergunta em curso no desenvolvimento da conversa. “Continuou perguntando” comunica esse aspecto de modo natural e liga a pergunta à anterior, sem reduzi-la a um passado pontual.
- source_word: Ὑμεῖς δὲ
  choice: Mas vocês
  rationale: O pronome explícito Ὑμεῖς é enfático, e δέ estabelece contraste com a opinião das outras pessoas mencionada no contexto. “Mas vocês” preserva ambos.
- source_word: τίνα με λέγετε εἶναι
  choice: quem dizem que eu sou
  rationale: Esta formulação idiomática em português representa naturalmente a construção grega de acusativo com infinitivo e mantém aberta a pergunta sobre a identidade de Jesus.
- source_word: ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ
  choice: Pedro lhe respondeu
  rationale: A combinação do particípio ἀποκριθείς com o presente histórico λέγει é vertida por uma forma narrativa natural no passado, sem duplicar desnecessariamente “respondeu e disse”.
- source_word: Σὺ εἶ
  choice: Você é
  rationale: O pronome grego explícito traz alguma ênfase. “Você é” é claro, direto e amplamente compreensível, sem acrescentar uma intensificação ausente do texto.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Χριστός funciona aqui como título e corresponde ao conceito hebraico do ungido esperado. “Messias” preserva esse sentido titular e o contexto judaico; a forma tradicional “o Cristo” é registrada em nota.
theological_decisions:
- issue: Tradução de Χριστός como título
  choice: o Messias
  alternative: o Cristo
  rationale: Neste contexto confessional, Χριστός é um título, não um sobrenome ou simples nome próprio. “O Messias” comunica seu conteúdo histórico e judaico sem definir além do que a afirmação declara; “o Cristo” permanece como alternativa tradicional em nota.
translation_notes:
  register: Português moderno, digno e de ampla legibilidade, com “vocês” para a segunda pessoa do plural e “você” para a fala dirigida a Jesus. A colocação pronominal evita formalismo excessivo, enquanto a pontuação mantém o ritmo do diálogo.
