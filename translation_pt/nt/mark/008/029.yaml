  naturalness: O texto é claro, moderno e adequado ao português de ampla legibilidade. «Perguntava-lhes» é natural em narrativa e evita a interpretação potencialmente excessiva de «continuou perguntando». A alternância entre «vocês» e «você» é compreensível e consistente com uma distinção plural/singular de registro brasileiro.
  terminology: «Messias» é a tradução apropriada de ὁ χριστός neste contexto titular; a nota «o Cristo» preserva a alternativa tradicional. «Pedro» e os pronomes estão corretos.
