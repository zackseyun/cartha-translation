base_translation:
  language: en
  yaml_path: translation/nt/mark/008/018.yaml
  text: Having eyes[a], do you not see? And having ears, do you not hear? And do you not remember?
translation:
  language: pt
  text: Tendo olhos, vocês não veem? E, tendo ouvidos, não ouvem? E não se lembram?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Embora tenham olhos, vocês não percebem? E, embora tenham ouvidos, não entendem?” O grego usa os verbos comuns “ver” e “ouvir”, que neste contexto também podem indicar percepção espiritual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοὺς ἔχοντες
  choice: Tendo olhos
  rationale: Preserva a construção participial e o paralelismo do grego em uma formulação natural e retoricamente incisiva em português.
- source_word: βλέπετε
  choice: não veem
  rationale: Traduz o sentido comum de “ver” sem explicitar indevidamente a percepção espiritual implícita no contexto.
- source_word: ὦτα ἔχοντες
  choice: tendo ouvidos
  rationale: Mantém a estrutura paralela à primeira oração participial.
- source_word: ἀκούετε
  choice: não ouvem
  rationale: Conserva o verbo sensorial comum do grego, deixando que o contexto sugira a ideia de compreender ou dar atenção.
- source_word: μνημονεύετε
  choice: não se lembram
  rationale: É a expressão corrente e clara em português para a recordação que Jesus cobra dos discípulos.
- source_word: καὶ
  choice: E
  rationale: Mantém a força cumulativa das perguntas sucessivas; antes da segunda construção, a coordenação é expressa naturalmente como “E, tendo...”.
- source_word: οὐ / οὐκ
  choice: não
  rationale: Reproduz a negação nas três perguntas retóricas.
theological_decisions:
- issue: Sentido figurado ou estritamente sensorial de ver e ouvir
  choice: Manter “veem” e “ouvem” no texto principal, permitindo que o contexto indique a insensibilidade espiritual.
  alternative: Traduzir por “percebem” e “entendem”, tornando explícito o sentido figurado.
  rationale: O grego emprega os verbos comuns para ver e ouvir, em linguagem que evoca a tradição profética. A tradução concreta preserva tanto essa ressonância quanto a tensão entre percepção física e compreensão espiritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais brasileiras de uso corrente. A repetição e o paralelismo das perguntas de Jesus foram preservados.
