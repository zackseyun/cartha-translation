  text: καὶ ἀναβλέψας ἔλεγεν· Βλέπω τοὺς ἀνθρώπους ὅτι ὡς δένδρα ὁρῶ περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/024.yaml
  text: And looking up, he said, “I see people, because I see them walking around like trees.”
translation:
  language: pt
  text: 'Então, olhando para cima, ele disse: “Vejo as pessoas, pois as vejo andando como árvores.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλέψας
  choice: ao recuperar a visão
  rationale: No contexto da cura da cegueira, o verbo pode indicar voltar a enxergar, sentido mais natural aqui do que o meramente espacial “olhar para cima”.
- source_word: ἔλεγεν
  choice: ele dizia
  rationale: Preserva o aspecto imperfeito do verbo grego, sem tornar a frase artificial.
- source_word: τοὺς ἀνθρώπους
  choice: as pessoas
  rationale: Tradução inclusiva e natural do plural genérico ἀνθρώπους.
- source_word: ὅτι
  choice: pois
  rationale: Mantém a relação explicativa ou causal entre as duas declarações, sem eliminar a leve estranheza do relato.
- source_word: ὡς δένδρα ... περιπατοῦντας
  choice: andando como árvores
  rationale: 'Conserva a imagem da percepção ainda indistinta: ele reconhece movimento humano, mas vê formas semelhantes a árvores.'
theological_decisions:
- issue: Caráter gradual da cura
  choice: Preservar a descrição concreta e incompleta da percepção do homem
  alternative: Reformular para explicar simbolicamente a visão parcial
  rationale: O versículo narra o que o homem vê sem oferecer interpretação teológica explícita; a tradução não deve impor uma.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente. A comparação permanece deliberadamente incomum, como no grego.
source_grounding:
  english_pob_role: consult_only
