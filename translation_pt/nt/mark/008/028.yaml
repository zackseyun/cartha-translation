base_translation:
  language: en
  yaml_path: translation/nt/mark/008/028.yaml
  text: They told him[a], saying, “John the Baptist; and others, Elijah; but others, one of the prophets.”
translation:
  language: pt
  text: 'Eles lhe disseram: “João Batista; outros, Elias; e outros, um dos profetas.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: “Eles lhe disseram: ‘Você é João Batista’; outros: ‘Você é Elias’; e outros: ‘Você é um dos profetas.’” O grego emprega uma fórmula equivalente a “disseram-lhe, dizendo” e deixa subentendido “você é” nos itens da enumeração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Eles
  rationale: O artigo com δέ retoma os discípulos como sujeito a partir do contexto anterior. Em português, “Eles” faz essa retomada naturalmente, sem precisar explicitar a leve força conectiva de δέ.
- source_word: εἶπαν αὐτῷ λέγοντες
  choice: lhe responderam
  rationale: A construção com o verbo finito e o particípio do mesmo verbo é uma fórmula de introdução da fala. Como a declaração responde à pergunta do versículo anterior, “lhe responderam” comunica naturalmente sua função; a duplicação literal (“disseram-lhe, dizendo”) seria pesada em português atual.
- source_word: ὅτι
  choice: — (representado pela introdução da citação direta)
  rationale: Aqui ὅτι introduz o conteúdo relatado. Os dois-pontos e as aspas expressam isso de modo idiomático em português.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: João Batista
  rationale: É a forma tradicional, clara e amplamente reconhecida em português para a personagem histórica, sem implicar neste contexto uma denominação posterior.
- source_word: ἄλλοι ... ἄλλοι δὲ
  choice: outros ... e outros
  rationale: Preserva a distribuição entre diferentes grupos e opiniões. O segundo δέ tem aqui força continuativa ou levemente contrastiva; “e outros” mantém a enumeração sem impor um contraste forte demais.
- source_word: Ἠλίαν
  choice: Elias
  rationale: Forma convencional do nome em português bíblico e corrente.
- source_word: ὅτι εἷς τῶν προφητῶν
  choice: um dos profetas
  rationale: Mantém a elipse concisa do grego, no qual o predicado implícito (“você é”) é recuperado pelo contexto.
- source_word: προφητῶν
  choice: profetas
  rationale: Equivalente português padrão para προφῆται neste contexto, referente às figuras proféticas de Israel.
theological_decisions:
- issue: Apresentação das identificações populares de Jesus
  choice: As opiniões são apresentadas como uma lista elíptica, sem repetir “você é” em cada item.
  alternative: '“Eles lhe responderam: ‘Uns dizem que você é João Batista; outros, Elias; e outros, um dos profetas’.”'
  rationale: O grego deixa o predicado subentendido e concentra a atenção na variedade das opiniões populares. A formulação escolhida preserva essa concisão e não resolve além do texto a relação sintática entre os itens.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A pontuação apresenta a resposta como citação direta e preserva a enumeração comprimida do original.
