source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ εἶπεν αὐτοῖς· ⸂Εἴ τις⸃ θέλει ὀπίσω μου ⸀ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/034.yaml
  text: And after calling the crowd together with his disciples[a], he said to them, “If anyone wants to come after me, let him deny himself, take up his cross[b], and follow me.”
translation:
  language: pt
  text: 'Depois de chamar para junto de si a multidão e também os seus discípulos, Jesus lhes disse: “Se alguém quiser[a] vir após mim, negue a si mesmo, tome a sua cruz[b] e siga-me.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se alguém desejar vir após mim”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “tome a sua cruz” mantém a imagem literal da cruz, em vez de reduzi-la à ideia de apenas suportar um fardo.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Depois de chamar para junto de si
  rationale: O particípio aoristo indica uma ação anterior à fala; a formulação preserva tanto a sequência quanto a ideia de convocar as pessoas para perto de si.
- source_word: τὸν ὄχλον
  choice: a multidão
  rationale: Equivalente corrente e natural de ὄχλος no contexto narrativo.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: e também os seus discípulos
  rationale: No contexto do verbo composto προσκαλέομαι, σύν identifica os discípulos como convocados juntamente com a multidão. A redação explicita essa associação de modo natural em português.
- source_word: Εἴ τις θέλει
  choice: Se alguém quiser
  rationale: Preserva a construção condicional e o caráter aberto do convite, em português moderno e natural.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: vir após mim
  rationale: Mantém a imagem espacial e discipular do grego sem confundi-la com o imperativo explícito ἀκολουθείτω μοι no fim da frase.
- source_word: ἀπαρνησάσθω ἑαυτόν
  choice: negue a si mesmo
  rationale: Reproduz a força do imperativo de terceira pessoa e a ideia de renúncia à primazia do próprio eu, sem ampliar o sentido por meio de paráfrase.
- source_word: ἀράτω
  choice: tome
  rationale: Equivalente idiomático de αἴρω nesta expressão, indicando assumir a cruz.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: a sua cruz
  rationale: Mantém literalmente σταυρός e conserva o possessivo, que individualiza o custo do discipulado.
- source_word: ἀκολουθείτω μοι
  choice: siga-me
  rationale: Traduz com naturalidade o imperativo presente. A dimensão contínua do seguimento permanece implícita no contexto do discipulado.
theological_decisions:
- issue: Força das exigências do discipulado
  choice: 'Convite geral seguido de três imperativos: “negue... tome... siga-me”.'
  alternative: Empregar uma construção repetida com “deve”.
  rationale: O grego combina uma condição aberta com imperativos de terceira pessoa. A tradução conserva tanto a liberdade expressa em “se alguém quiser” quanto a força vinculante das exigências, sem impor uma moldura denominacional.
- issue: Sentido de σταυρός
  choice: Manter a imagem literal como “cruz”.
  alternative: Parafrasear como “sofrimento”, “fardo” ou apenas “martírio”.
  rationale: A metáfora remete concretamente ao instrumento romano de execução. Uma paráfrase reduziria a amplitude histórica e teológica da imagem.
- issue: Relação entre ὀπίσω μου ἐλθεῖν e ἀκολουθείτω μοι
  choice: Distinguir “vir após mim” de “siga-me”.
  alternative: Traduzir ambas as expressões simplesmente com o verbo “seguir”.
  rationale: 'A distinção preserva a repetição conceitual e a progressão do original: desejar colocar-se atrás de Jesus implica obedecer ao chamado final para segui-lo.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vir após mim” preserva a linguagem figurada do discipulado; “negue a si mesmo” conserva a formulação forte e tradicional sem soar arcaica. O nome “Jesus” foi explicitado como sujeito para evitar ambiguidade na apresentação isolada do versículo.
