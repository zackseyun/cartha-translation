  source_fidelity: 'A tradução representa fielmente a construção grega: o particípio aoristo é expresso por “Depois de chamar”, a multidão é reunida juntamente com os discípulos, e a sequência condicional seguida de imperativos é preservada. “Vir após mim” distingue adequadamente ὀπίσω μου ἐλθεῖν de “siga-me” para ἀκολουθείτω μοι. “Negue a si mesmo” e “tome a sua cruz” mantêm a força e a concretude do texto, sem reduzir a cruz a mero fardo.'
  naturalness: O português é moderno, claro e de registro apropriado. “Depois de chamar para junto de si” é um pouco mais formal, mas é plenamente natural em registro bíblico contemporâneo e comunica bem o ato de convocar. “Se alguém quiser... negue... tome... e siga-me” flui com clareza para leitores brasileiros e internacionais.
  terminology: “Multidão”, “discípulos”, “cruz” e “siga-me” são escolhas estáveis, compreensíveis e semanticamente adequadas. A explicitação de “Jesus” torna o sujeito claro na apresentação isolada do versículo e não introduz conteúdo interpretativo. As notas preservam tanto a alternativa lexical de θέλει quanto a imagem histórica literal de σταυρός.
