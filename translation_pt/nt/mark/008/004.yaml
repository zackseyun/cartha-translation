  text: καὶ ἀπεκρίθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ὅτι Πόθεν τούτους δυνήσεταί τις ὧδε χορτάσαι ἄρτων ἐπ’ ἐρημίας;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/004.yaml
  text: And his disciples answered him[a], “From where will anyone be able to satisfy these people with bread here in a desolate place?”
translation:
  language: pt
  text: 'E os seus discípulos lhe responderam: “De onde[a] alguém poderá conseguir pão para saciar esta gente aqui, num lugar deserto?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como alguém poderá alimentar esta gente com pão aqui, num lugar deserto?”'
    reason: Alternativa idiomática para a pergunta introduzida por Πόθεν e para χορτάσαι, em consonância com a alternativa registrada na auditoria inglesa.
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: responderam
  rationale: Verbo narrativo comum de resposta; corresponde diretamente ao grego e soa natural em português.
- source_word: ὅτι
  choice: ': “'
  rationale: Introduz discurso direto depois do verbo de resposta; em português, a pontuação e as aspas cumprem naturalmente essa função.
- source_word: Πόθεν
  choice: De onde
  rationale: Preserva a pergunta pela origem da provisão, sem transformá-la na pergunta mais interpretativa “Como”.
- source_word: τούτους
  choice: toda esta gente
  rationale: Explicita de modo inclusivo e idiomático que o pronome plural se refere à multidão; “toda” reforça naturalmente a extensão implícita no ato de saciar o grupo, sem restringi-lo a homens.
- source_word: δυνήσεταί τις
  choice: alguém poderá
  rationale: Mantém tanto o sujeito indefinido quanto o valor futuro de capacidade.
- source_word: ὧδε
  choice: aqui
  rationale: Equivalente locativo simples, direto e natural.
- source_word: χορτάσαι
  choice: conseguir pão suficiente para alimentar
  rationale: Expressa no contexto alimentar a ideia de dar até a satisfação, evitando o pouco natural “satisfazer com pão” e preservando a noção de suficiência.
- source_word: ἄρτων
  choice: pão
  rationale: Equivalente lexical direto, sem especificar indevidamente “pães” ou generalizar para “comida”.
- source_word: ἐπ’ ἐρημίας
  choice: num lugar deserto
  rationale: Comunica uma região isolada ou desabitada em português corrente, preservando o cenário sem exigir a imagem específica de um deserto arenoso.
