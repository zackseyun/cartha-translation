id: MRK.12.10
reference: Mark 12:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐδὲ τὴν γραφὴν ταύτην ἀνέγνωτε· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/010.yaml
  text: 'Have you not even read this Scripture: ‘The stone that the builders rejected[a], this has become the cornerstone’?”'
translation:
  language: pt
  text: 'Vocês nem sequer leram esta passagem da Escritura: “A pedra que os construtores rejeitaram, essa se tornou a pedra angular[a]”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a cabeça do ângulo”; também pode ser traduzido por “a principal pedra de esquina”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: nem sequer
  rationale: Preserva a negação enfática da pergunta retórica e soa natural em português atual.
- source_word: τὴν γραφὴν ταύτην
  choice: esta passagem da Escritura
  rationale: No Novo Testamento, γραφή normalmente designa a Escritura sagrada; “passagem” torna claro que Jesus cita um texto específico, sem reduzir o termo a uma escrita qualquer.
- source_word: ἀνέγνωτε
  choice: leram
  rationale: O aoristo, nesta pergunta retórica, é expresso naturalmente pelo pretérito perfeito em português.
- source_word: Λίθον
  choice: A pedra
  rationale: Embora o substantivo grego não tenha artigo, a citação aponta para uma pedra específica dentro da metáfora, favorecendo o artigo definido em português.
- source_word: ἀπεδοκίμασαν
  choice: rejeitaram
  rationale: Comunica com clareza a ideia de recusar após avaliação, sem sobrecarregar o texto principal.
- source_word: οἱ οἰκοδομοῦντες
  choice: os construtores
  rationale: O particípio substantivado é vertido de modo conciso e idiomático, preservando a imagem da construção.
- source_word: οὗτος ἐγενήθη
  choice: tornou-se
  rationale: Mantém a referência enfática à mesma pedra e expressa naturalmente a mudança de condição indicada pelo aoristo.
- source_word: εἰς κεφαλὴν γωνίας
  choice: a pedra angular
  rationale: É a expressão portuguesa estabelecida e inteligível para a pedra principal associada ao ângulo da construção, enquanto a nota registra a forma mais literal.
theological_decisions:
- issue: Uso messiânico da imagem de Salmos 118:22
  choice: Manter no texto a metáfora da pedra, dos construtores e da pedra angular, sem identificar explicitamente a pedra com o Messias.
  alternative: Explicitar na tradução que a pedra representa Jesus ou o Messias.
  rationale: O contexto aplica a imagem a Jesus, mas o texto citado conserva sua força por meio da metáfora; explicitá-la na tradução resolveria uma identificação que o próprio contexto deve comunicar.
- issue: Função arquitetônica de κεφαλὴ γωνίας
  choice: Usar “pedra angular” e registrar a tradução literal em nota.
  alternative: Usar no texto “pedra principal do ângulo”, “pedra de esquina” ou “pedra de remate”.
  rationale: A expressão grega pode suscitar discussão sobre a posição arquitetônica exata. “Pedra angular” preserva o sentido principal sem decidir entre reconstruções específicas, e a nota mantém visível a formulação original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” corresponde ao plural dirigido aos interlocutores. A pergunta retórica preserva o tom enfático de repreensão, e a citação mantém a concisão poética do original.
