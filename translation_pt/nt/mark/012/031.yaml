  text: ⸀δευτέρα αὕτη· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν. μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/031.yaml
  text: 'The second is this: ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these[a].'
translation:
  language: pt
  text: 'O segundo é este: “Ame o seu próximo como a si mesmo”. Não há outro mandamento maior do que estes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Nenhum outro mandamento é maior do que estes”; no contexto, “estes” se refere aos dois mandamentos em conjunto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δευτέρα αὕτη
  choice: O segundo é este
  rationale: Supre naturalmente o verbo de ligação implícito no grego e mantém em destaque a posição ordinal, retomando o primeiro mandamento no contexto.
- source_word: Ἀγαπήσεις
  choice: Ame
  rationale: O futuro do indicativo empregado na citação de Levítico 19:18 tem força imperativa. Em português moderno, o imperativo «Ame» comunica essa ordem de modo claro e digno, sem o tom preditivo que «amarás» pode sugerir ao leitor atual.
- source_word: τὸν πλησίον σου
  choice: o seu próximo
  rationale: «Próximo» é a equivalência bíblica estabelecida e semanticamente adequada neste contexto ético, preservando a ligação com Levítico 19:18.
- source_word: ὡς σεαυτόν
  choice: como a si mesmo
  rationale: Reproduz concisamente a comparação grega sem acrescentar um segundo verbo, além de evitar ambiguidades de referência.
- source_word: μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν
  choice: Não há outro mandamento maior do que estes
  rationale: Mantém tanto a construção existencial quanto o comparativo e, sobretudo, o plural τούτων, que remete aos dois mandamentos no contexto.
- source_word: ἐντολή
  choice: mandamento
  rationale: Preserva o registro bíblico e pactual apropriado à discussão dos mandamentos da Torá.
theological_decisions:
- issue: Referente de τούτων («estes») na frase final
  choice: Referência plural aos dois mandamentos em conjunto
  alternative: Referência apenas ao segundo mandamento imediatamente anterior, entendido de modo generalizado
  rationale: O demonstrativo plural aponta naturalmente para os dois mandamentos apresentados no contexto. A tradução conserva o plural do original, sem reduzi-lo a uma referência singular.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O imperativo «Ame» evita o possível valor meramente futuro de «amarás», enquanto «mandamento» e «próximo» preservam o registro e as conexões bíblicas.
