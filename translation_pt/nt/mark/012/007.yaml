base_translation:
  language: en
  yaml_path: translation/nt/mark/012/007.yaml
  text: But those tenant farmers said to one another[a], ‘This is the heir. Come, let us kill him[b], and the inheritance will be ours.’
translation:
  language: pt
  text: 'Mas aqueles arrendatários disseram uns aos outros[a]: “Este é o herdeiro. Venham, vamos matá-lo, e a herança será nossa[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “disseram entre si”.
    reason: lexical_alternative
  - marker: b
    text: Ou “e a herança pertencerá a nós”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ οἱ γεωργοὶ
  choice: Mas aqueles arrendatários
  rationale: “Mas” expressa o contraste narrativo suave de δέ; “aqueles” preserva o demonstrativo ἐκεῖνοι. No contexto da vinha, γεωργοί designa os que cultivam a propriedade alheia mediante arrendamento; “arrendatários” comunica essa relação com o proprietário de modo natural e conciso.
- source_word: πρὸς ἑαυτοὺς εἶπαν
  choice: disseram uns aos outros
  rationale: A construção indica fala dentro do grupo e deliberação mútua. “Uns aos outros” evita sugerir apenas pensamento interior.
- source_word: ὅτι
  choice: discurso direto marcado por aspas
  rationale: Aqui ὅτι introduz a fala direta; em português, as aspas a apresentam com naturalidade.
- source_word: Οὗτός ἐστιν ὁ κληρονόμος
  choice: Este é o herdeiro
  rationale: Preserva o demonstrativo e emprega o termo jurídico e familiar corrente para κληρονόμος.
- source_word: δεῦτε ἀποκτείνωμεν αὐτόν
  choice: Venham, vamos matá-lo
  rationale: δεῦτε é uma convocação dirigida ao grupo, e o subjuntivo ἀποκτείνωμεν expressa uma proposta exortativa. A formulação é direta sem acrescentar a nuance jurídica de “assassinar”.
- source_word: καὶ ἡμῶν ἔσται ἡ κληρονομία
  choice: e a herança será nossa
  rationale: Reproduz de maneira idiomática a expectativa de posse e a força possessiva de ἡμῶν, sem acrescentar “dele”, ausente do grego.
theological_decisions:
- issue: Sentido de γεωργοί na parábola da vinha
  choice: arrendatários
  alternative: lavradores; agricultores; viticultores
  rationale: O contexto mostra que cultivam uma vinha pertencente a outro e lhe devem o produto. “Arrendatários” preserva essa relação essencial sem acrescentar uma interpretação alegórica ou denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Venham, vamos” transmite a convocação e a proposta coletiva sem rigidez excessiva. Todos os marcadores de nota aparecem no texto principal.
