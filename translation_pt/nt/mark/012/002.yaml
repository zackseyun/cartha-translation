  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν πρὸς τοὺς γεωργοὺς τῷ καιρῷ δοῦλον, ἵνα παρὰ τῶν γεωργῶν λάβῃ ἀπὸ ⸂τῶν καρπῶν⸃ τοῦ ἀμπελῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/002.yaml
  text: And at the proper time he sent a slave to the vine-growers[b][a], so that he might receive from the vine-growers some of the fruit of the vineyard.
translation:
  language: pt
  text: E, no tempo apropriado, enviou aos viticultores um escravo[a], para receber deles uma parte dos frutos da vinha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”, para δοῦλος.
    reason: alternative_reading
  - marker: b
    text: Ou “alguns dos frutos da vinha”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Equivalente narrativo natural do aoristo de ἀποστέλλω, sem formalidade desnecessária.
- source_word: γεωργοὺς / γεωργῶν
  choice: viticultores
  rationale: γεωργός designa quem trabalha a terra; no contexto específico de uma vinha, “viticultores” preserva essa especificidade. A segunda ocorrência é retomada naturalmente por “deles”.
- source_word: τῷ καιρῷ
  choice: no tempo apropriado
  rationale: καιρός indica aqui o tempo oportuno ou estabelecido, provavelmente ligado à colheita, sem que o texto o explicite.
- source_word: δοῦλον
  choice: escravo
  rationale: Preserva o estatuto social expresso por δοῦλος no mundo da parábola; “servo” continua sendo uma alternativa tradicional e possível.
- source_word: ἵνα ... λάβῃ
  choice: para receber
  rationale: A oração infinitiva portuguesa expressa com naturalidade a finalidade da construção grega com ἵνα e subjuntivo.
- source_word: παρὰ τῶν γεωργῶν
  choice: deles
  rationale: O pronome retoma claramente os viticultores e preserva a ideia de fonte indicada por παρά com genitivo, evitando repetição pesada.
- source_word: ἀπὸ τῶν καρπῶν τοῦ ἀμπελῶνος
  choice: uma parte dos frutos da vinha
  rationale: Torna explícito, de modo idiomático, o valor partitivo de ἀπό com o genitivo, sem acrescentar a noção interpretativa de “sua parte”.
- source_word: ἀμπελῶνος
  choice: vinha
  rationale: Equivalente português corrente e tradicional de ἀμπελών.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Viticultores” é preciso no contexto da vinha; “uma parte dos frutos” comunica naturalmente a construção partitiva. Todos os marcadores de nota aparecem no texto.
