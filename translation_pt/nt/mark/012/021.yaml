source:
  edition: SBLGNT
  text: καὶ ὁ δεύτερος ἔλαβεν αὐτήν, καὶ ἀπέθανεν ⸂μὴ καταλιπὼν⸃ σπέρμα, καὶ ὁ τρίτος ὡσαύτως·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/021.yaml
  text: And the second took her[a], and died, leaving no offspring, and the third likewise.
translation:
  language: pt
  text: O segundo casou-se com ela[a] e morreu sem deixar descendência; e o terceiro, da mesma forma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tomou-a”; neste contexto, isto é, tomou-a como esposa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: o segundo
  rationale: O ordinal substantivado é traduzido de modo conciso. “Irmão” está implícito no contexto, mas não é repetido nesta oração.
- source_word: ἔλαβεν αὐτήν
  choice: casou-se com ela
  rationale: Embora o sentido básico de λαμβάνω seja “tomar/receber”, neste contexto de casamento levirato a expressão significa tomar a viúva como esposa. A tradução explicita o sentido idiomático em português corrente.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: Tradução direta e sóbria do aoristo de ἀποθνῄσκω, adequada ao estilo narrativo.
- source_word: μὴ καταλιπὼν
  choice: sem deixar
  rationale: Expressa naturalmente em português a circunstância indicada pelo particípio aoristo negado.
- source_word: σπέρμα
  choice: descendência
  rationale: Neste contexto, σπέρμα se refere à prole, não a semente literal. “Descendência” preserva o valor coletivo sem restringi-lo a um único filho.
- source_word: ὁ τρίτος ὡσαύτως
  choice: e o terceiro, da mesma forma
  rationale: Mantém a construção elíptica e concisa do grego, deixando que as ações anteriores sejam subentendidas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A formulação principal verte idiomaticamente a expressão matrimonial, enquanto a nota preserva sua forma mais literal.
