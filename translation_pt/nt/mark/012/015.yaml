id: MRK.12.15
reference: Mark 12:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ εἰδὼς αὐτῶν τὴν ὑπόκρισιν εἶπεν αὐτοῖς· Τί με πειράζετε; φέρετέ μοι δηνάριον ἵνα ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/015.yaml
  text: But knowing their hypocrisy[a], he said to them[b], “Why are you testing me? Bring me a denarius so that I may see it.”
translation:
  language: pt
  text: 'Mas ele, sabendo da hipocrisia deles, disse-lhes: “Por que vocês estão me pondo à prova?[b] Tragam-me um denário[a] para eu ver.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O denário era uma moeda romana de prata, comumente usada como pagamento por um dia de trabalho.
    reason: cultural_note
  - marker: b
    text: Ou “Por que vocês estão me tentando?”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: sabendo
  rationale: Expressa de modo direto a percepção consciente de Jesus, sem acrescentar como ele chegou a esse conhecimento.
- source_word: ὑπόκρισιν
  choice: hipocrisia
  rationale: Preserva a força moral do termo grego e se ajusta ao contexto de uma armadilha disfarçada de pergunta sincera.
- source_word: Τί
  choice: Por que
  rationale: Neste uso idiomático, Τί pergunta pela razão da ação, e “Por que” é a formulação natural em português.
- source_word: πειράζετε
  choice: estão me pondo à prova
  rationale: Comunica uma prova hostil ou tentativa de apanhar Jesus numa armadilha, preservando também a amplitude semântica do verbo.
- source_word: φέρετέ
  choice: Tragam-me
  rationale: Reproduz o imperativo plural e deixa claro que a moeda deve ser levada até Jesus.
- source_word: δηνάριον
  choice: um denário
  rationale: Mantém o nome histórico específico da moeda; a nota explica seu valor cultural aproximado.
- source_word: ἵνα ἴδω
  choice: para eu ver
  rationale: É uma forma natural e concisa de exprimir a finalidade; a moeda permanece como objeto implícito, como no grego.
theological_decisions:
- issue: Sentido de πειράζετε na acusação de Jesus
  choice: pondo à prova
  alternative: tentando
  rationale: “Pondo à prova” comunica o caráter adversarial da ação no contexto, sem restringir o verbo à ideia de sedução ao pecado; a alternativa legítima é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O plural “vocês” torna explícito o número indicado pelos verbos gregos. Os marcadores das notas foram posicionados junto aos termos que explicam.
