  yaml_path: translation/nt/mark/012/042.yaml
  text: And a poor widow came and put in two lepta[c][b][a], which is a quadrans.
translation:
  language: pt
  text: E veio uma viúva pobre e depositou duas pequenas moedas de cobre[a], o que equivale a um quadrante[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, “duas lepta”, nome de moedas de valor muito baixo. Duas lepta equivaliam a um quadrante romano.
    reason: cultural_note
  - marker: b
    text: O quadrante era uma pequena moeda romana. Traduções antigas às vezes empregam nomes de moedas de outras épocas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: veio
  rationale: O particípio aoristo é expresso naturalmente por um verbo finito coordenado, preservando a sequência narrativa.
- source_word: μία
  choice: uma
  rationale: Neste contexto, introduz uma personagem individual, sem ênfase especial no número um.
- source_word: χήρα πτωχή
  choice: uma viúva pobre
  rationale: Tradução direta, natural e fiel; o contexto posterior explicita a profundidade de sua pobreza.
- source_word: ἔβαλεν
  choice: depositou
  rationale: No contexto do cofre de ofertas, comunica com clareza que ela colocou ali as moedas, sem sugerir um lançamento vigoroso.
- source_word: λεπτὰ δύο
  choice: duas pequenas moedas de cobre
  rationale: Torna compreensível ao leitor comum o referente histórico de λεπτά, enquanto a nota preserva o nome específico da moeda.
- source_word: ὅ ἐστιν
  choice: que equivalem a
  rationale: Explicita que a oração apresenta a equivalência monetária do total das duas moedas, não a identidade de cada uma delas.
- source_word: κοδράντης
  choice: um quadrante
  rationale: Preserva em português o nome histórico da moeda romana designada pelo grego κοδράντης.
