revisions:
- from: Então veio uma viúva pobre e depositou duas pequenas moedas de cobre[a], que equivalem a um quadrante[b].
  to: E veio uma viúva pobre e depositou duas pequenas moedas de cobre[a], o que equivale a um quadrante[b].
  rationale: A revisão remove a inferência temporal de “Então” e torna explícito, pela expressão “o que equivale”, que a equivalência se refere ao total das duas moedas, conforme o relativo neutro singular do grego. As notas mantêm a informação histórica e o termo específico da moeda com redação mais segura em português.
