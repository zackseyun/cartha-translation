    reason: lexical_alternative
  revision_rationale: A revisão remove a inferência temporal de “Então” e torna explícito, pela expressão “o que equivale”, que a equivalência se refere ao total das duas moedas, conforme o relativo neutro singular do grego. As notas mantêm a informação histórica e o termo específico da moeda com redação mais segura em português.
