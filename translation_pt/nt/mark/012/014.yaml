  text: ⸀καὶ ἐλθόντες λέγουσιν αὐτῷ· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις· ἔξεστιν ⸂δοῦναι κῆνσον Καίσαρι⸃ ἢ οὔ; δῶμεν ἢ μὴ δῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/014.yaml
  text: And they came and said to him[a], “Teacher, we know that you are truthful and do not care about anyone, for you do not look at the face of men, but truly teach the way of God. Is it lawful to pay the poll tax to Caesar or not? Should we pay it[b], or should we not pay it?”
translation:
  language: pt
  text: 'Então eles se aproximaram e lhe disseram: “Mestre, sabemos que o senhor é verdadeiro e não se deixa influenciar por ninguém, pois não olha para a aparência das pessoas,[a] mas ensina verdadeiramente o caminho de Deus. É permitido pagar o imposto a César ou não? Devemos pagá-lo[b] ou não?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não mostra favoritismo às pessoas” ou “não se deixa levar pela posição delas”.'
    reason: lexical_alternative
  - marker: b
    text: O termo grego κῆνσος refere-se ao imposto romano de recenseamento, ou de capitação.
    reason: cultural_note
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: Forma consagrada e natural de tratamento para um instrutor no contexto dos Evangelhos.
- source_word: ἀληθὴς
  choice: verdadeiro
  rationale: Preserva o predicativo pessoal e indica alguém íntegro e comprometido com a verdade.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: não se deixa influenciar por ninguém
  rationale: Expressa em português corrente o sentido contextual de não ser condicionado pela posição ou opinião das pessoas, sem sugerir indiferença afetiva.
- source_word: οὐ ... βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: não olha para a aparência das pessoas
  rationale: Retém parte da imagem concreta do grego e comunica de modo inteligível o idiomatismo ligado à parcialidade e ao status.
- source_word: ἐπ’ ἀληθείας
  choice: com verdade
  rationale: Mantém a ligação lexical com ἀληθὴς e qualifica a maneira pela qual Jesus ensina.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: o caminho de Deus
  rationale: Preserva a expressão bíblica concreta sem reduzi-la a uma paráfrase abstrata.
- source_word: ἔξεστιν
  choice: É permitido
  rationale: Comunica a questão de legitimidade moral e legal em português natural, sem limitar necessariamente a pergunta à legislação romana.
- source_word: δοῦναι κῆνσον Καίσαρι
  choice: pagar o imposto a César
  rationale: Em contexto tributário, δοῦναι corresponde naturalmente a 'pagar'; κῆνσος designa aqui o tributo romano individual, detalhado em nota.
- source_word: δῶμεν ἢ μὴ δῶμεν
  choice: Devemos pagá-lo ou não?
  rationale: Conserva a insistência da segunda pergunta e explicita o objeto exigido pela fluência do português.
theological_decisions:
- issue: Sentido da afirmação οὐ μέλει σοι περὶ οὐδενός
  choice: não se deixa influenciar por ninguém
  alternative: não se importa com ninguém
  rationale: A alternativa literal poderia insinuar falta de compaixão. O contexto explica que Jesus não favorece pessoas por aparência ou posição; a tradução conserva esse sentido sem acrescentar uma avaliação teológica.
- issue: Idiomatismo sobre olhar para o rosto das pessoas
  choice: não olha para a aparência das pessoas
  alternative: não mostra favoritismo
  rationale: A formulação escolhida mantém a imagem do texto grego, enquanto a nota registra explicitamente o sentido de imparcialidade.
- issue: Âmbito de ἔξεστιν
  choice: É permitido
  alternative: É lícito
  rationale: A escolha preserva a tensão da pergunta — que pode envolver lei, consciência e fidelidade a Deus — sem decidir antecipadamente qual sistema jurídico está em vista.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento “o senhor” soa natural na fala respeitosa dirigida a Jesus; “pessoas” evita o possível sentido exclusivamente masculino de “homens”. Os marcadores [a] e [b] aparecem no texto principal.
