id: MRK.12.33
reference: Mark 12:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὸ ἀγαπᾶν αὐτὸν ἐξ ὅλης ⸀τῆς καρδίας καὶ ἐξ ὅλης τῆς ⸀συνέσεως καὶ ἐξ ὅλης τῆς ἰσχύος καὶ τὸ ἀγαπᾶν τὸν πλησίον ὡς ἑαυτὸν ⸀περισσότερόν ἐστιν πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/033.yaml
  text: and to love him with all the heart and with all the understanding and with all the strength[a], and to love one’s neighbor as oneself, is more than all burnt offerings and sacrifices.
translation:
  language: pt
  text: e amá-lo de todo o coração, de todo o entendimento e de toda a força, e amar o próximo como a si mesmo, é mais importante do que todos os holocaustos[a] e sacrifícios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Holocaustos eram ofertas inteiramente consumidas pelo fogo sobre o altar.
    reason: Esclarecer o sentido específico de ὁλοκαυτώματα, que pode não ser evidente para leitores modernos.
lexical_decisions:
- source_word: ἀγαπᾶν
  choice: amar
  rationale: O infinitivo articulado é expresso naturalmente em português pelo infinitivo, preservando a força verbal e o paralelismo das duas ocorrências.
- source_word: αὐτόν
  choice: -lo
  rationale: O pronome retoma Deus no contexto anterior; a forma pronominal preserva a redação grega sem substituir explicitamente o referente.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: de todo o coração
  rationale: Expressão portuguesa corrente para dedicação interior integral, mantendo a totalidade indicada por ὅλης.
- source_word: συνέσεως
  choice: entendimento
  rationale: Reflete compreensão e discernimento, distinguindo σύνεσις de termos gregos mais gerais que podem ser traduzidos por 'mente'.
- source_word: ἰσχύος
  choice: força
  rationale: Equivalente claro e habitual para a plena capacidade ou vigor da pessoa neste contexto.
- source_word: πλησίον
  choice: o próximo
  rationale: Formulação genérica, natural e consagrada em português para a pessoa a quem se deve amor.
- source_word: ὡς ἑαυτόν
  choice: como a si mesmo
  rationale: Mantém o valor reflexivo genérico do grego, sem transformar a frase em tratamento direto ao leitor.
- source_word: περισσότερόν ἐστιν
  choice: é mais importante do que
  rationale: Comunica claramente a superioridade de valor expressa pelo comparativo; uma tradução literal como 'é mais do que' seria menos natural em português neste contexto.
- source_word: πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν
  choice: todos os holocaustos e sacrifícios
  rationale: '''Holocaustos'' é o termo bíblico português para ofertas inteiramente consumidas pelo fogo; a construção com ''do que'' traduz naturalmente o genitivo de comparação.'
theological_decisions:
- issue: Relação entre os mandamentos do amor e o culto sacrificial
  choice: O amor integral a Deus e o amor ao próximo são declarados superiores a todos os holocaustos e sacrifícios.
  alternative: Entender que o versículo abole explicitamente todo o sistema sacrificial.
  rationale: O comparativo περισσότερόν afirma superioridade, mas o versículo não declara explicitamente a abolição dos sacrifícios; a tensão entre amor obediente e rito é preservada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o paralelismo dos infinitivos e evita linguagem denominacional. O termo técnico 'holocaustos' recebe nota por ter hoje outro sentido predominante fora do contexto bíblico.
