  text: ⸂ἔφη αὐτοῖς ὁ Ἰησοῦς⸃· Οὐ διὰ τοῦτο πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/024.yaml
  text: 'Jesus said to them[a], “Is this not why you are mistaken: because you know neither the Scriptures nor the power of God?”'
translation:
  language: pt
  text: 'Jesus lhes disse[a]: “Não é por isso que vocês estão enganados, por não conhecerem nem as Escrituras nem o poder de Deus?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus lhes disse: ‘Não é por esta razão que vocês se desviam, por não conhecerem nem as Escrituras nem o poder de Deus?’”'
    reason: Registra a alternativa lexical de πλανᾶσθε (‘se desviam’) e uma formulação mais explícita de διὰ τοῦτο, preservando a amplitude semântica do grego.
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Ἰησοῦς
  choice: Jesus lhes disse
  rationale: φημί introduz aqui a fala direta com o sentido comum de ‘dizer’. A formulação é natural em português e não acrescenta a nuance de ‘responder’, que não está expressa no verbo.
- source_word: Οὐ διὰ τοῦτο
  choice: Não é por isso que
  rationale: A construção introduz uma pergunta retórica que espera concordância e indica a causa do erro. ‘Não é por isso que’ preserva de modo claro tanto a força interrogativa quanto a relação causal.
- source_word: πλανᾶσθε
  choice: vocês estão enganados
  rationale: A forma pode significar estar em erro, enganar-se ou ser desviado. No contexto da controvérsia sobre a ressurreição, ‘estão enganados’ é corrente e preserva a repreensão sem decidir se a ênfase é intelectual, moral ou espiritual.
- source_word: μὴ εἰδότες
  choice: por não conhecerem
  rationale: O particípio negativo apresenta a causa do erro. A construção causal explícita é natural em português e mantém a ligação lógica do grego.
- source_word: τὰς γραφὰς
  choice: as Escrituras
  rationale: No plural e neste contexto judaico, γραφαί designa os escritos sagrados reconhecidos. ‘As Escrituras’ é a tradução tradicional, clara e precisa.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: nem o poder de Deus
  rationale: Mantém o paralelismo da coordenação negativa e traduz diretamente δύναμις e o genitivo τοῦ θεοῦ.
theological_decisions:
- issue: Natureza do erro expresso por πλανᾶσθε
  choice: vocês estão enganados
  alternative: vocês se desviam / vocês são induzidos ao erro
  rationale: O grego admite desde estar equivocado até ser desviado. A escolha comunica um erro real e a repreensão de Jesus, sem atribuir explicitamente uma causa externa nem reduzir o problema a mero equívoco intelectual.
- issue: Relação entre desconhecer as Escrituras e o poder de Deus e o erro dos saduceus
  choice: relação causal expressa por ‘por não conhecerem’
  alternative: 'particípio circunstancial: ‘não conhecendo’'
  rationale: O contexto e διὰ τοῦτο favorecem a leitura causal. A tradução explicita essa relação sem hierarquizar os dois elementos nem desenvolver uma conclusão doutrinária além do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O uso de ‘vocês’ evita regionalismo excessivo; ‘lhes disse’ conserva concisão narrativa. A pergunta retórica e a relação causal foram mantidas sem suavizar a repreensão.
