lexical_decisions:
- source_word: πρωτοκαθεδρίας
  choice: os lugares de destaque
  rationale: O termo designa os assentos de maior prestígio numa assembleia. “Lugares de destaque” comunica de modo natural tanto a posição proeminente quanto o status social, sem sugerir apenas conforto físico.
- source_word: συναγωγαῖς
  choice: nas sinagogas
  rationale: Neste contexto, refere-se aos locais judaicos de reunião; “sinagogas” é a tradução corrente e precisa.
- source_word: πρωτοκλισίας
  choice: os lugares de honra
  rationale: O termo indica as posições de maior honra nas refeições, originalmente associadas aos lugares principais nos divãs em que os convidados se reclinavam. A formulação escolhida preserva a função social de modo claro para leitores modernos.
- source_word: δείπνοις
  choice: nos banquetes
  rationale: Embora possa designar refeições ou jantares, o contexto enfatiza ocasiões sociais em que se concediam posições de honra; “banquetes” expressa bem esse cenário.
- source_word: καὶ ... καὶ
  choice: e ... e
  rationale: A repetição da conjunção é mantida, refletindo a coordenação e o acúmulo dos sinais de busca por prestígio.
- source_word: ἐν ταῖς συναγωγαῖς ... ἐν τοῖς δείπνοις
  choice: nas sinagogas ... nos banquetes
  rationale: A preposição é vertida de forma natural em português, com “em” contraído com os artigos nos dois contextos.
