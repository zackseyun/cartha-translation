  text: ⸀καὶ λαβόντες αὐτὸν ἔδειραν καὶ ἀπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/003.yaml
  text: And they took him[a], beat him, and sent him away empty-handed.
translation:
  language: pt
  text: E eles o agarraram, espancaram e o mandaram embora de mãos vazias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vazio”. O adjetivo grego κενόν significa literalmente “vazio”; aqui indica que o servo foi mandado de volta sem receber nada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: agarraram
  rationale: O particípio aoristo indica a ação que precede os verbos principais. No contexto de violência contra o servo, “agarraram” comunica com naturalidade o ato hostil sem acrescentar a ideia mais técnica de prisão.
- source_word: ἔδειραν
  choice: espancaram
  rationale: O verbo δέρω significa bater ou surrar. “Espancaram” expressa claramente uma agressão repetida ou severa, sem especificar o procedimento formal de um açoite.
- source_word: ἀπέστειλαν
  choice: mandaram embora
  rationale: Neste contexto, ἀποστέλλω descreve o envio do servo para longe da presença dos lavradores. “Mandaram embora” é natural e preserva essa direção.
- source_word: κενόν
  choice: de mãos vazias
  rationale: 'O adjetivo, literalmente “vazio”, funciona aqui de modo predicativo ou adverbial: o servo foi devolvido sem receber nada. “De mãos vazias” transmite esse sentido idiomaticamente.'
- source_word: καὶ ... καὶ
  choice: e ... e
  rationale: A repetição de καί coordena as ações em sequência e preserva o estilo narrativo paratático do grego.
