id: MRK.12.23
reference: Mark 12:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν τῇ ἀναστάσει ⸂ὅταν ἀναστῶσιν⸃ τίνος αὐτῶν ἔσται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/023.yaml
  text: In the resurrection[a], when they rise, whose wife will she be? For the seven had her as wife.
translation:
  language: pt
  text: Na ressurreição, quando eles ressuscitarem, de qual deles ela será esposa? Pois os sete a tiveram como esposa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνάστασις
  choice: ressurreição
  rationale: Neste contexto, o substantivo designa a ressurreição escatológica discutida com os saduceus. “Ressurreição” é o equivalente português natural e consagrado.
- source_word: ὅταν ἀναστῶσιν
  choice: quando eles ressuscitarem
  rationale: ὅταν com o aoristo do subjuntivo forma uma oração temporal voltada para o futuro. O futuro do subjuntivo em português expressa isso naturalmente, sem acrescentar a ideia não explícita de “novamente”.
- source_word: τίνος αὐτῶν
  choice: de qual deles
  rationale: A combinação do interrogativo genitivo com o genitivo partitivo pergunta a qual dos sete ela pertencerá como esposa. “De qual deles” é claro e idiomático em português.
- source_word: ἔσται γυνή
  choice: ela será esposa
  rationale: A construção predicativa pergunta em relação a qual homem ela terá a condição de esposa. A formulação preserva a ausência de artigo diante de γυνή e soa natural na pergunta completa.
- source_word: γυνή
  choice: esposa
  rationale: Nas duas ocorrências, o contexto matrimonial exige “esposa”, não o sentido mais amplo de “mulher”.
- source_word: οἱ γὰρ ἑπτὰ
  choice: Pois os sete
  rationale: γάρ introduz a explicação da pergunta. “Os sete” basta, pois o contexto anterior já os identifica.
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: a tiveram como esposa
  rationale: A expressão ἔχω + acusativo + γυναῖκα descreve a relação de tê-la por esposa. Esta tradução mantém essa nuance melhor do que “casaram-se com ela”, que destacaria o acontecimento.
theological_decisions:
- issue: Linguagem da ressurreição na controvérsia com os saduceus
  choice: Na ressurreição, quando eles ressuscitarem
  alternative: Na ressurreição dos mortos, quando eles voltarem a viver
  rationale: A redação afirma a futura ressurreição sem ampliar o texto com “dos mortos”, “de novo” ou “voltarem a viver”. Assim, preserva-se a formulação e a tensão argumentativa do grego.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A repetição “ressurreição/ressuscitarem” acompanha deliberadamente a repetição lexical grega e mantém a ênfase do debate.
