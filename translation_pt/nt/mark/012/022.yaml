  text: καὶ ⸂οἱ ἑπτὰ⸃ οὐκ ἀφῆκαν σπέρμα· ⸀ἔσχατον πάντων ⸂καὶ ἡ γυνὴ ἀπέθανεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/022.yaml
  text: And the seven left no offspring. Last of all[a], the woman also died.
translation:
  language: pt
  text: E os sete não deixaram descendência. Por último, depois de todos eles, a mulher também morreu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἑπτὰ
  choice: os sete
  rationale: O artigo com o numeral tem função substantiva e retoma os sete irmãos mencionados no contexto; a forma concisa preserva essa referência.
- source_word: οὐκ ἀφῆκαν σπέρμα
  choice: não deixaram descendência
  rationale: A expressão significa literalmente que não deixaram 'semente', isto é, filhos ou descendentes. 'Descendência' comunica o sentido com naturalidade e precisão em português.
- source_word: ἔσχατον πάντων
  choice: Por último, depois de todos eles
  rationale: A expressão adverbial assinala que a mulher morreu por último na sequência, depois dos sete; esta formulação torna claro o referente de πάντων sem perder a ordem temporal.
- source_word: καὶ ἡ γυνὴ
  choice: a mulher também
  rationale: O καί tem força aditiva, incluindo a mulher na sequência das mortes; 'também' expressa isso naturalmente.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: Tradução direta e não eufemística do aoristo de ἀποθνῄσκω.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A expressão idiomática ligada a σπέρμα foi vertida pelo sentido, evitando o pouco natural 'semente'; não foi necessária nota de rodapé.
