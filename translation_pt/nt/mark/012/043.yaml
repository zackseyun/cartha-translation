source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ ⸀εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ἡ χήρα αὕτη ἡ πτωχὴ πλεῖον πάντων ⸀ἔβαλεν τῶν βαλλόντων εἰς τὸ γαζοφυλάκιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/043.yaml
  text: And calling his disciples to himself[a], he said to them, “Truly I say to you that this poor widow has put in more than all those who are putting into the treasury.”
translation:
  language: pt
  text: 'E, chamando seus discípulos para junto de si, disse-lhes: “Em verdade lhes digo que esta viúva pobre depositou mais do que todos os que estão depositando no cofre das ofertas.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tesouro do templo”. O termo grego pode designar o receptáculo das ofertas ou a área do templo onde ficavam esses cofres.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: chamando para junto de si
  rationale: Expressa naturalmente o particípio aoristo médio e preserva a ideia de Jesus reunir os discípulos ao seu redor antes de falar, sem tornar a sequência mais explícita do que o grego.
- source_word: μαθητὰς
  choice: discípulos
  rationale: Termo neotestamentário corrente em português, que preserva a relação de aprendizado e seguimento.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Em verdade lhes digo
  rationale: Mantém o caráter solene e enfático da fórmula de Jesus em linguagem digna e amplamente compreensível.
- source_word: χήρα ... πτωχὴ
  choice: viúva pobre
  rationale: Tradução direta e clara, sem intensificar πτωχή para 'miserável' ou 'indigente'.
- source_word: πλεῖον πάντων
  choice: mais do que todos os outros
  rationale: Preserva a comparação abrangente e deixa que o contexto do versículo seguinte explique em que sentido sua oferta foi maior.
- source_word: ἔβαλεν / τῶν βαλλόντων
  choice: depositou / que estão depositando
  rationale: No contexto de contribuições, 'depositar' comunica idiomaticamente βάλλω; a alternância verbal distingue o ato concluído da viúva da ação em curso dos demais.
- source_word: γαζοφυλάκιον
  choice: cofre das ofertas
  rationale: Torna explícita para o leitor moderno a referência ao receptáculo do tesouro do templo, evitando que 'tesouro' seja entendido como o dinheiro em si.
theological_decisions:
- issue: Sentido da avaliação da oferta da viúva
  choice: 'Manter a afirmação comparativa literal: ela depositou ''mais do que todos os outros''.'
  alternative: Explicitar que ela deu proporcionalmente mais ou que sua oferta tinha maior valor espiritual.
  rationale: O versículo 44 explica a avaliação com base na pobreza da viúva e na abundância dos demais. O texto principal não deve antecipar essa explicação nem resolver a tensão entre quantidade monetária e valor proporcional.
translation_notes:
  register: Português moderno, digno e de ampla legibilidade brasileira. A construção evita arcaísmos, preserva a solenidade da fala de Jesus e mantém a ambiguidade interpretativa da comparação.
