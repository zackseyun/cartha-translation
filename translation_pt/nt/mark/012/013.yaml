  terminology: «Fariseus» e «herodianos» são as formas portuguesas convencionais e apropriadas. A nota explica corretamente a metáfora cinegética do verbo grego e o sentido de lograr Jesus mediante sua fala, sem introduzir interpretação doutrinária.
