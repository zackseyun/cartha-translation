id: MRK.12.13
reference: Mark 12:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἀποστέλλουσιν πρὸς αὐτόν τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν ἵνα αὐτὸν ἀγρεύσωσιν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/013.yaml
  text: And they send to him some of the Pharisees and some of the Herodians[a], so that they might trap him by a word.
translation:
  language: pt
  text: E enviam a ele alguns dos fariseus e alguns dos herodianos, para apanhá-lo em alguma palavra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enredá-lo pelo que dissesse”. O verbo grego evoca a captura de uma presa, e a expressão final indica que pretendiam apanhá-lo por meio de sua fala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: enviam
  rationale: Mantém o presente histórico do grego, que também funciona naturalmente na narrativa em português.
- source_word: τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν
  choice: alguns dos fariseus e alguns dos herodianos
  rationale: Reproduz a construção partitiva e deixa claro que foram enviados representantes dos dois grupos.
- source_word: Φαρισαίων
  choice: fariseus
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do grupo judaico.
- source_word: Ἡρῳδιανῶν
  choice: herodianos
  rationale: Forma tradicional em português para o grupo ligado a Herodes.
- source_word: ἵνα
  choice: para
  rationale: Expressa de modo claro e natural a finalidade da ação.
- source_word: ἀγρεύσωσιν
  choice: apanhá-lo
  rationale: Preserva a metáfora de caça do verbo grego e, no contexto, comunica a intenção de surpreendê-lo ou enredá-lo.
- source_word: λόγῳ
  choice: em alguma palavra
  rationale: Conserva a referência à fala como o âmbito ou meio pelo qual pretendiam apanhá-lo, sem especificar além do texto se seria uma única declaração ou sua resposta em geral.
theological_decisions:
- issue: Sujeito narrativo implícito no verbo grego plural
  choice: sujeito não expresso em português
  alternative: eles; os chefes dos sacerdotes, escribas e líderes
  rationale: Como o português permite sujeito oculto, a forma verbal “enviam” preserva a indeterminação local do grego sem importar para o versículo uma identificação explícita baseada no contexto anterior.
- issue: Natureza da armadilha por meio de λόγῳ
  choice: apanhá-lo em alguma palavra
  alternative: apanhá-lo pelo que dissesse; enredá-lo numa declaração
  rationale: A formulação conserva tanto a metáfora hostil de caça quanto a relativa abertura da expressão grega, sem decidir se a ênfase recai sobre uma palavra específica, uma declaração ou a fala de Jesus em geral.
translation_notes:
  register: Português moderno, digno e acessível, com presente histórico. “Apanhá-lo em alguma palavra” mantém a imagem do original, enquanto a nota esclarece o sentido metafórico e oferece uma formulação mais idiomática.
