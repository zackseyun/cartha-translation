  source_fidelity: O texto preserva adequadamente o presente histórico de ἀποστέλλουσιν, a construção partitiva («alguns dos fariseus e alguns dos herodianos»), a finalidade introduzida por ἵνα e a imagem de captura em ἀγρεύσωσιν. «Apanhá-lo em alguma palavra» é uma formulação bíblica estabelecida em português e mantém, sem estreitar indevidamente, o valor instrumental/contextual de λόγῳ.
