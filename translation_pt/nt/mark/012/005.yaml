  text: ⸀καὶ ἄλλον ἀπέστειλεν· κἀκεῖνον ἀπέκτειναν, καὶ πολλοὺς ἄλλους, ⸂οὓς μὲν δέροντες οὓς δὲ ἀποκτέννοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/005.yaml
  text: And he sent another[a], and they killed that one; and many others—some they beat, and some they killed.
translation:
  language: pt
  text: 'Então enviou outro; também mataram esse. Enviou ainda muitos outros: a uns espancaram, e a outros mataram.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλον
  choice: outro
  rationale: Refere-se a outro servo na sequência; “outro” é direto e natural em português.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Reproduz de modo claro e idiomático a ação narrativa expressa pelo aoristo.
- source_word: κἀκεῖνον
  choice: também a esse
  rationale: Preserva tanto a força aditiva de καί quanto a ênfase demonstrativa de ἐκεῖνον.
- source_word: ἀπέκτειναν
  choice: mataram
  rationale: Expressa diretamente a violência de ἀποκτείνω, sem acrescentar uma ideia judicial não exigida pelo contexto.
- source_word: πολλοὺς ἄλλους
  choice: muitos outros
  rationale: Designa outros servos enviados além dos já mencionados.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: em alguns ... e outros
  rationale: Representa naturalmente em português a distribuição contrastiva entre os dois grupos.
- source_word: δέροντες
  choice: bateram
  rationale: Mantém o sentido amplo de agredir ou espancar, sem especificar um açoitamento formal.
- source_word: ἀποκτέννοντες
  choice: mataram
  rationale: O verbo finito em português comunica com naturalidade o resumo distributivo dos particípios gregos.
theological_decisions:
- issue: Forma do resumo participial distributivo
  choice: 'Usar verbos finitos: “em alguns bateram, e outros mataram”'
  alternative: “batendo em alguns e matando outros”
  rationale: A construção finita é mais natural no português moderno e mantém a distribuição dos atos entre os muitos servos, sem alterar o sentido teológico.
- issue: Sujeito implícito de “enviou” antes de “muitos outros”
  choice: Repetir “Enviou” para tornar explícita em português a relação elíptica
  alternative: “e muitos outros, em alguns batendo e outros matando”
  rationale: O grego apresenta uma sequência comprimida e elíptica. A repetição verbal comunica o referente natural — o proprietário enviou muitos outros — sem resolver qualquer tensão doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Evitaram-se tanto linguagem arcaica quanto especificações jurídicas ausentes do grego.
