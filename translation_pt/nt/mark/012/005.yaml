revisions:
- from: 'Então enviou outro, e também a esse mataram. Enviou ainda muitos outros: em alguns bateram, e outros mataram.'
  to: 'Então enviou outro; também mataram esse. Enviou ainda muitos outros: a uns espancaram, e a outros mataram.'
  rationale: A revisão corrige a regência e melhora a fluência sem alterar o referente dos pronomes nem a estrutura do enunciado. A repetição de “Enviou” torna explícita em português a elipse que liga “muitos outros” à ação do proprietário. A construção “a uns ... a outros ...” reproduz a distribuição correlativa do grego e mantém o contraste entre espancar e matar.
