source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ εἶπεν ἐν ⸂τῷ πνεύματι τῷ⸃ ἁγίῳ· ⸀Εἶπεν ⸀κύριος τῷ κυρίῳ μου· ⸀Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/036.yaml
  text: David himself said in the Holy Spirit[a], ‘The Lord said to my Lord[b], “Sit at my right hand until I put your enemies under your feet.”’
translation:
  language: pt
  text: 'O próprio Davi disse no Espírito Santo[a]: “O Senhor disse ao meu Senhor[b]: ‘Sente-se à minha direita, até que eu ponha os seus inimigos debaixo dos seus pés.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelo Espírito Santo”.'
    reason: alternative_reading
  - marker: b
    text: A citação é do Salmo 110:1. No texto hebraico, o primeiro “Senhor” representa o nome divino (YHWH, tradicionalmente traduzido como “SENHOR”), enquanto o segundo se refere ao senhor de Davi.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: O próprio Davi
  rationale: Preserva de modo natural em português o uso intensivo de αὐτός, que enfatiza Davi como aquele que falou.
- source_word: ἐν τῷ πνεύματι τῷ ἁγίῳ
  choice: no Espírito Santo
  rationale: Reproduz de perto ἐν com o dativo e mantém aberta a nuance exata da atuação do Espírito, sem reduzi-la apenas a instrumento.
- source_word: κύριος
  choice: Senhor
  rationale: É o equivalente corrente e digno de κύριος. A repetição no texto grego é mantida, enquanto a distinção presente no salmo hebraico é explicada em nota.
- source_word: τῷ κυρίῳ μου
  choice: ao meu Senhor
  rationale: Mantém a repetição de κύριος e a força do argumento cristológico no contexto, sem substituir o termo por uma interpretação mais estreita como “mestre”.
- source_word: Κάθου
  choice: Sente-se
  rationale: Forma imperativa idiomática e respeitosa em português, adequada à linguagem de entronização.
- source_word: ἐκ δεξιῶν μου
  choice: à minha direita
  rationale: Expressa naturalmente o sentido idiomático da locução grega, isto é, ocupar o lugar à direita.
- source_word: ἕως ἂν θῶ
  choice: até que eu ponha
  rationale: Preserva a referência futura e traduz θῶ de modo direto, claro e corrente.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: debaixo dos seus pés
  rationale: Segue a formulação específica de Marcos, sem acrescentar a imagem mais extensa de “estrado para os pés” encontrada no salmo.
theological_decisions:
- issue: Fórmula que descreve a fala profética de Davi
  choice: disse no Espírito Santo
  alternative: disse pelo Espírito Santo
  rationale: “No Espírito Santo” acompanha mais diretamente o grego e afirma a atuação do Espírito sem definir de maneira mais estreita o modo da inspiração.
- issue: Força cristológica da citação do Salmo 110:1
  choice: O Senhor disse ao meu Senhor
  alternative: O SENHOR disse ao meu Senhor
  rationale: Como Marcos emprega κύριος nas duas ocorrências, o texto principal preserva “Senhor” em ambas. A relação da primeira ocorrência com o nome divino no hebraico é informada em nota, sem ser introduzida silenciosamente no texto grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “Sente-se” e pronomes possessivos de terceira pessoa para tratamento respeitoso e natural. Os marcadores [a] e [b] aparecem no texto principal e correspondem às respectivas notas.
