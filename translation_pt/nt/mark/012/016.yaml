base_translation:
  language: en
  yaml_path: translation/nt/mark/012/016.yaml
  text: And they brought one. And he says to them[a], “Whose image is this, and whose inscription?” And they said to him, “Caesar’s.”
translation:
  language: pt
  text: 'Eles o trouxeram[a]. E ele lhes diz: “De quem são esta imagem e esta inscrição?” Eles lhe responderam: “De César.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles trouxeram um”. O objeto, entendido pelo contexto anterior, é o denário.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν
  choice: trouxeram um
  rationale: O verbo significa “trazer”, e seu objeto está implícito no contexto anterior. “Um” retoma naturalmente o denário sem inserir novamente o nome da moeda no texto.
- source_word: λέγει
  choice: ele lhes diz
  rationale: Mantém o presente histórico característico da narrativa vívida de Marcos; “lhes” representa αὐτοῖς de modo natural.
- source_word: Τίνος
  choice: De quem
  rationale: O genitivo interrogativo pergunta a quem pertencem ou com quem se associam a imagem e a inscrição.
- source_word: εἰκών
  choice: imagem
  rationale: “Imagem” é claro no contexto de uma moeda e conserva a terminologia bíblica ampla do termo grego.
- source_word: ἐπιγραφή
  choice: inscrição
  rationale: Designa com precisão as palavras gravadas na moeda e é mais acessível do que o termo técnico “legenda”.
- source_word: Καίσαρος
  choice: De César
  rationale: O genitivo responde de forma concisa à pergunta “De quem...?”, mantendo aberta a nuance de posse ou associação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O presente histórico “diz” preserva a vivacidade narrativa de Marcos. A formulação “De quem são esta imagem e esta inscrição?” expressa em português natural um único interrogativo grego que abrange os dois substantivos.
