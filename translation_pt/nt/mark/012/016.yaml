  rationale: Substituiu-se «trouxeram um» por «o trouxeram», uma retomada pronominal idiomática do denário já mencionado. A nota preserva a possibilidade de explicitar o objeto como «um», sem alterar o sentido. O restante do texto permanece fiel ao grego e natural em português moderno.
