  text: παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/011.yaml
  text: This came from the Lord[b][a], and it is marvelous in our eyes.
translation:
  language: pt
  text: Isto veio do Senhor[b][a] e é maravilhoso aos nossos olhos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi feito pelo Senhor”. A expressão grega pode indicar fonte ou agência; “veio do Senhor” destaca mais diretamente a origem.'
    reason: lexical_alternative
  - marker: b
    text: Esta frase cita Salmo 118:23.
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ κυρίου
  choice: veio do Senhor
  rationale: παρά com o genitivo indica aqui fonte ou origem. “Veio do Senhor” é natural em português e preserva essa nuance; “foi feito pelo Senhor” explicitaria agência, também possível.
- source_word: κυρίου
  choice: Senhor
  rationale: Embora a citação de Salmo 118:23 remonte ao nome divino no hebraico, o texto grego de Marcos traz κύριος; “Senhor” traduz diretamente o texto neotestamentário e mantém a alusão.
- source_word: ἐγένετο
  choice: veio
  rationale: No conjunto da expressão, γίνομαι comunica que isso veio a acontecer ou teve sua origem no Senhor. “Veio” produz uma formulação clara sem sugerir acaso.
- source_word: αὕτη
  choice: Isto
  rationale: O demonstrativo retoma o acontecimento mencionado no verso anterior, sem acrescentar “pedra”, palavra que não aparece nesta oração.
- source_word: θαυμαστὴ
  choice: maravilhoso
  rationale: θαυμαστός descreve algo admirável, extraordinário. “Maravilhoso” conserva o tom elevado da citação e é corrente em português.
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: aos nossos olhos
  rationale: A expressão preserva a imagem do original e constitui uma locução idiomática clara em português, equivalente a “para nós” ou “à nossa vista”.
theological_decisions:
- issue: Tradução de κύριος numa citação de um salmo que se refere a Deus
  choice: Senhor
  alternative: SENHOR
  rationale: A tradução segue o texto grego de Marcos, que emprega κύριος, sem inserir no corpo do texto a forma tipográfica normalmente usada para representar o nome divino hebraico.
- issue: Fonte ou agência em παρὰ κυρίου
  choice: do Senhor
  alternative: pelo Senhor
  rationale: A construção pode ser entendida em termos de origem ou agência. “Do Senhor” preserva mais diretamente a noção de fonte, enquanto a nota registra a alternativa legítima.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém-se a imagem bíblica em “aos nossos olhos” e a interrogação do texto grego, pois o versículo conclui a pergunta iniciada no contexto anterior.
