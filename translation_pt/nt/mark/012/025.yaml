id: MRK.12.25
reference: Mark 12:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἐκ νεκρῶν ἀναστῶσιν, οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ εἰσὶν ὡς ⸀ἄγγελοι ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/025.yaml
  text: For when they rise from the dead[a], they neither marry nor are given in marriage, but are like angels in heaven.
translation:
  language: pt
  text: Pois quando ressuscitam dentre os mortos, nem se casam nem são dados em casamento, mas são como os anjos nos céus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no céu”. O grego está no plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν γὰρ
  choice: Pois, quando
  rationale: Preserva tanto a força explicativa de γάρ quanto o valor temporal de ὅταν, com formulação natural em português.
- source_word: ἐκ νεκρῶν ἀναστῶσιν
  choice: ressuscitam dentre os mortos
  rationale: Mantém a forma ativa de ἀναστῶσιν e expressa com clareza a ideia de sair do meio dos mortos.
- source_word: οὔτε γαμοῦσιν οὔτε γαμίζονται
  choice: nem se casam nem são dados em casamento
  rationale: Reproduz a correlação οὔτε...οὔτε e conserva a distinção entre contrair casamento e ser dado em casamento.
- source_word: ἀλλ’ εἰσὶν
  choice: mas são
  rationale: Expressa diretamente o contraste introduzido por ἀλλά.
- source_word: ὡς ἄγγελοι
  choice: como os anjos
  rationale: ὡς indica comparação, não identidade; a tradução não sugere que os ressuscitados se tornem anjos.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: nos céus
  rationale: Preserva naturalmente em português o plural explícito do grego.
theological_decisions:
- issue: Natureza da comparação com os anjos
  choice: Os ressuscitados são como os anjos quanto à ausência de casamento.
  alternative: Os ressuscitados tornam-se anjos.
  rationale: A partícula comparativa ὡς expressa semelhança, não transformação ou identidade ontológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Dentre os mortos” conserva a precisão da expressão grega sem soar excessivamente técnica; “nos céus” mantém o plural do texto-fonte.
