  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ἐξ ὅλης τῆς ψυχῆς σου καὶ ἐξ ὅλης τῆς διανοίας σου καὶ ἐξ ὅλης τῆς ἰσχύος ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/030.yaml
  text: And you shall love the Lord your God with all your heart and with all your soul and with all your mind and with all your strength[a][b][c].
translation:
  language: pt
  text: E ame o Senhor, seu Deus, com todo o seu coração, com toda a sua alma[a], com toda a sua mente[b] e com toda a sua força[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com toda a sua vida», para «com toda a sua alma» (ψυχῆς).
    reason: lexical_alternative
  - marker: b
    text: Ou «com todo o seu entendimento», para «com toda a sua mente» (διανοίας).
    reason: lexical_alternative
  - marker: c
    text: Ou «com todo o seu vigor», para «com toda a sua força» (ἰσχύος).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπήσεις
  choice: ame
  rationale: O futuro indicativo na citação tem força imperativa. Em português atual, o imperativo «ame» comunica naturalmente o mandamento, sem o tom preditivo que «amarás» pode ter fora do registro bíblico.
- source_word: κύριον τὸν θεόν σου
  choice: o Senhor, seu Deus
  rationale: Preserva a fórmula pactual e a distinção lexical entre κύριος e θεός. A vírgula torna natural em português a relação apositiva de «seu Deus» com «o Senhor».
- source_word: ἐξ ὅλης
  choice: com todo/com toda
  rationale: Neste contexto, ἐξ indica a totalidade dos recursos pessoais empregados no amor a Deus; «com» é idiomático em português, e a repetição de ὅλης é mantida em cada membro.
- source_word: καρδίας
  choice: coração
  rationale: Equivalente tradicional e semanticamente adequado para o centro interior da vontade, dos afetos e das disposições, sem explicitação interpretativa no texto.
- source_word: ψυχῆς
  choice: alma
  rationale: ψυχή pode designar alma, vida ou o próprio ser. «Alma» preserva a distinção entre os quatro termos e continua amplamente compreensível.
- source_word: διανοίας
  choice: mente
  rationale: Expressa naturalmente a faculdade de pensar e compreender, mantendo-a distinta de «coração».
- source_word: ἰσχύος
  choice: força
  rationale: Equivalente claro de ἰσχύς, abrangendo força ou vigor e preservando a conhecida sequência quádrupla.
- source_word: καὶ ... καὶ ... καὶ ... καὶ
  choice: e ... com ... com ... e com
  rationale: O «E» inicial e a conjunção antes do último membro preservam a coordenação do mandamento; a repetição de «com toda» mantém o efeito cumulativo em português sem tornar a enumeração artificial.
theological_decisions:
- issue: Tradução de κύριος na citação do mandamento
  choice: o Senhor
  alternative: o SENHOR; o Mestre
  rationale: O grego traz κύριος. «O Senhor» corresponde diretamente ao texto neotestamentário e conserva o eco da fórmula pactual sem introduzir no corpo do texto uma convenção tipográfica baseada no hebraico subjacente.
- issue: Termos antropológicos na ordem quádrupla
  choice: coração / alma / mente / força
  alternative: coração / vida / entendimento / vigor
  rationale: Mantêm-se os quatro termos distintos, em vez de reduzi-los a uma paráfrase sobre amar a Deus com o ser inteiro. Assim se preservam a forma retórica e a abertura semântica do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega «seu/sua» na fórmula tradicional e evita «tu» ou «você», permitindo leitura suprarregional. O imperativo «ame» prioriza a força de mandamento do futuro grego; a repetição «com todo/com toda» conserva a ênfase na totalidade.
