  source_fidelity: A tradução reproduz adequadamente a moldura discursiva (ἐν τῇ διδαχῇ αὐτοῦ ἔλεγεν), a advertência (Βλέπετε ἀπό), os escribas, as vestes longas e as saudações em espaços públicos. Contudo, θέλοντων expressa primariamente vontade ou desejo; “gostam de” é possível no contexto, mas atenua a nuance volitiva mais direta do grego.
  naturalness: O português é claro, moderno e apropriado ao registro narrativo. “Cuidado com”, “escribas”, “vestes longas”, “saudações” e “praças” são compreensíveis e naturais. A oração sem vírgula depois de “escribas” preserva corretamente seu caráter caracterizador.
  terminology: “Escribas” mantém o referente histórico sem paráfrase interpretativa. “Vestes longas” é uma boa equivalência para στολαῖς; a nota cultural esclarece adequadamente a conotação de status. “Praças” comunica a função pública das ἀγοραί, embora não explicite seu aspecto comercial, o que não é necessário neste contexto.
