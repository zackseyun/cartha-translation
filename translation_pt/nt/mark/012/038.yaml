  text: Καὶ ⸂ἐν τῇ διδαχῇ αὐτοῦ ἔλεγεν⸃· Βλέπετε ἀπὸ τῶν γραμματέων τῶν θελόντων ἐν στολαῖς περιπατεῖν καὶ ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/038.yaml
  text: And in his teaching he was saying[b][a], “Beware of the scribes who want to walk around in long robes and receive greetings in the marketplaces,”
translation:
  language: pt
  text: 'E, em seu ensino, ele dizia: “Cuidado com os escribas que querem andar com vestes longas[a] e receber saudações nas praças,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vestes longas” refere-se a mantos exteriores vistosos, associados a posição social e honra pública.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: em seu ensino
  rationale: Preserva a estrutura do grego e apresenta a esfera ou o contexto em que Jesus falava, em português natural e digno.
- source_word: ἔλεγεν
  choice: ele dizia
  rationale: O imperfeito indica ação em curso ou habitual; “dizia” conserva esse aspecto sem tornar a frase pesada.
- source_word: Βλέπετε ἀπὸ
  choice: Cuidado com
  rationale: Expressa de modo corrente e direto o imperativo de alerta e proteção diante das pessoas descritas.
- source_word: γραμματέων
  choice: os escribas
  rationale: É o termo tradicional e historicamente adequado para os especialistas na Lei e nas Escrituras, sem substituir o termo por uma explicação interpretativa.
- source_word: τῶν θελόντων
  choice: que gostam de
  rationale: No contexto, o particípio caracteriza uma preferência cultivada e recorrente; “gostam de” comunica isso com naturalidade, embora “querem” seja possível.
- source_word: ἐν στολαῖς περιπατεῖν
  choice: andar com vestes longas
  rationale: στολαί designa vestes compridas e distintas; a formulação conserva tanto a ação pública quanto a aparência associada a prestígio.
- source_word: ἀσπασμοὺς
  choice: saudações
  rationale: Tradução direta que, no contexto das praças, permite perceber o reconhecimento público e honorífico sem inseri-lo no corpo do texto.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: nas praças
  rationale: As ἀγοραί eram espaços públicos de comércio e convivência; “praças” comunica melhor a função social do local em português contemporâneo do que “mercados” isoladamente.
theological_decisions:
- issue: Alcance da advertência de Jesus sobre os escribas
  choice: A oração “que gostam de...” caracteriza os escribas contra os quais se dirige a advertência, sem afirmar explicitamente que cada escriba, sem exceção, agia assim.
  alternative: Entender a frase como condenação indiscriminada de todos os escribas enquanto classe.
  rationale: O artigo e o particípio grego ligam a advertência aos escribas descritos pela busca de exibição e honra pública. A ausência de vírgula antes da oração caracterizadora preserva esse vínculo sem resolver além do texto a extensão exata do grupo.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Cuidado com” evita a solenidade pouco corrente de “acautelai-vos”; “escribas” preserva o referente histórico. A ordem das ideias e o aspecto verbal do grego foram mantidos sem sacrificar a fluidez.
