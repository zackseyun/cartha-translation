  text: Καὶ ἔρχονται Σαδδουκαῖοι πρὸς αὐτόν, οἵτινες λέγουσιν ἀνάστασιν μὴ εἶναι, καὶ ⸀ἐπηρώτων αὐτὸν λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/018.yaml
  text: And Sadducees came to him, who say there is no resurrection, and they began questioning him, saying,
translation:
  language: pt
  text: 'E vieram até ele alguns saduceus, os quais dizem que não há ressurreição, e começaram a interrogá-lo, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: alguns saduceus
  rationale: O plural sem artigo introduz membros desse grupo; “alguns” torna natural em português o valor indefinido sem sugerir que todos estavam presentes.
- source_word: ἀνάστασιν μὴ εἶναι
  choice: não há ressurreição
  rationale: Reproduz de modo claro e direto a negação da existência da ressurreição.
- source_word: ἐπηρώτων
  choice: começaram a interrogá-lo
  rationale: O imperfeito retrata uma ação iniciada e em andamento no contexto; “interrogar” preserva o caráter formal e controverso da pergunta.
- source_word: λέγοντες
  choice: dizendo
  rationale: Mantém a construção participial que introduz diretamente as palavras seguintes.
theological_decisions:
- issue: A negação saduceia da ressurreição
  choice: não há ressurreição
  alternative: não existe ressurreição
  rationale: A formulação preserva a afirmação doutrinária do grupo sem especificar aqui a natureza da ressurreição, que será esclarecida pelo contexto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Então vieram até ele” mantém a progressão narrativa; a vírgula antes de “e começaram” conserva a coordenação do grego.
