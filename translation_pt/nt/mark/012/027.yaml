  source_fidelity: A tradução reproduz com precisão o contraste de οὐκ ἔστιν θεὸς νεκρῶν ἀλλὰ ζώντων. «Ele» recupera legitimamente o referente divino do contexto, e «Deus dos mortos... dos vivos» conserva a construção e a antítese do grego. «Vocês estão muito enganados» transmite adequadamente a repreensão intensificada por πολύ e preserva a margem semântica de πλανᾶσθε, sem atribuir indevidamente o erro a engano externo ou interno.
  naturalness: O texto é claro, fluente e digno em português moderno de ampla compreensão. «Vocês» favorece a legibilidade brasileira sem comprometer a compreensão internacional, e «muito enganados» é idiomático no registro de uma repreensão direta.
