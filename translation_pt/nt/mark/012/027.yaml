id: MRK.12.27
reference: Mark 12:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐκ ἔστιν ⸀θεὸς νεκρῶν ⸀ἀλλὰ ζώντων· ⸀πολὺ πλανᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/027.yaml
  text: He is not God of the dead[a], but of the living[b]. You are greatly mistaken.
translation:
  language: pt
  text: Ele não é Deus dos mortos, mas dos vivos. Vocês estão muito enganados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεὸς
  choice: Deus
  rationale: Embora esteja sem artigo nessa construção, refere-se inequivocamente ao Deus de Abraão, Isaque e Jacó; em português, o nome divino é a tradução natural, não “um deus”.
- source_word: νεκρῶν
  choice: dos mortos
  rationale: O genitivo plural é substantivado e forma, em português corrente, um contraste direto e conciso com “dos vivos”.
- source_word: ἀλλὰ ζώντων
  choice: mas dos vivos
  rationale: O particípio presente substantivado designa os que vivem; “dos vivos” preserva a antítese e soa natural.
- source_word: οὐκ ἔστιν
  choice: Ele não é
  rationale: O pronome “Ele” é recuperado do contexto imediato, em que se fala de Deus, e evita a repetição menos fluida “Deus não é Deus”; não altera o referente implícito no grego.
- source_word: πολὺ
  choice: muito
  rationale: Usado adverbialmente, intensifica πλανᾶσθε; “muito” transmite essa força em linguagem atual e clara.
- source_word: πλανᾶσθε
  choice: estão enganados
  rationale: A forma médio-passiva expressa aqui o estado de estar em erro. “Estão enganados” mantém a censura sem decidir se o erro decorre de autoengano ou de engano externo.
theological_decisions:
- issue: Implicação da vida contínua diante de Deus no argumento de Jesus
  choice: Manter o contraste simples entre “os mortos” e “os vivos”, sem explicá-lo doutrinariamente.
  alternative: Parafrasear como uma afirmação explícita sobre a ressurreição ou o estado intermediário.
  rationale: O contexto usa a declaração no argumento em favor da ressurreição, mas o versículo não explicita todas as conclusões teológicas; a tradução preserva sua concisão e tensão.
- issue: Sujeito implícito de οὐκ ἔστιν
  choice: Retomar Deus com “Ele”.
  alternative: “Deus não é Deus dos mortos, mas dos vivos.”
  rationale: Ambas as formas comunicam o sentido. “Ele” é uma retomada natural do referente no contexto e não introduz uma interpretação teológica adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” comunica naturalmente a segunda pessoa plural ao público brasileiro; “estão muito enganados” conserva a intensidade da repreensão sem soar arcaico.
