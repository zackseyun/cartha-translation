source:
  edition: SBLGNT
  text: περὶ δὲ τῶν νεκρῶν ὅτι ἐγείρονται οὐκ ἀνέγνωτε ἐν τῇ βίβλῳ Μωϋσέως ἐπὶ τοῦ βάτου ⸀πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων· Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ⸂ὁ θεὸς Ἰσαὰκ καὶ ὁ⸃ θεὸς Ἰακώβ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/026.yaml
  text: And concerning the dead[a], that they are raised, have you not read in the book of Moses, in the passage about the bush, how God spoke to him, saying, ‘I am the God of Abraham and the God of Isaac and the God of Jacob’?”
translation:
  language: pt
  text: 'E, quanto ao fato de os mortos serem ressuscitados, vocês não leram no livro de Moisés, na passagem sobre a sarça[a], como Deus lhe disse: “Eu sou o Deus de Abraão, o Deus de Isaque e o Deus de Jacó”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “junto à sarça”. A expressão grega também pode designar a passagem das Escrituras pelo episódio da sarça.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τῶν νεκρῶν ὅτι ἐγείρονται
  choice: E, quanto ao fato de os mortos serem ressuscitados
  rationale: A formulação apresenta com naturalidade o tema introduzido por περὶ e conserva o valor passivo de ἐγείρονται. O conectivo δέ é representado de modo leve por “E”, sem criar um contraste mais forte do que o texto exige.
- source_word: οὐκ ἀνέγνωτε
  choice: vocês não leram
  rationale: O aoristo é expresso pelo pretérito perfeito, forma natural em português para a pergunta retórica de Jesus. “Vocês” oferece ampla inteligibilidade moderna.
- source_word: ἐν τῇ βίβλῳ Μωϋσέως
  choice: no livro de Moisés
  rationale: βίβλος pode significar livro ou rolo; “livro de Moisés” é claro, natural e não especifica além do necessário o formato material.
- source_word: ἐπὶ τοῦ βάτου
  choice: na passagem sobre a sarça
  rationale: A expressão identifica a seção das Escrituras pelo episódio da sarça. A tradução explicita essa função referencial para o leitor moderno, enquanto a alternativa mais literal é preservada em nota.
- source_word: πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων
  choice: como Deus lhe falou, dizendo
  rationale: “Como” introduz o que Deus declarou na passagem citada; “lhe falou” e “dizendo” preservam tanto o verbo principal quanto o particípio introdutor da citação.
- source_word: Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: Eu sou o Deus de Abraão, o Deus de Isaque e o Deus de Jacó
  rationale: Mantém-se a identificação no presente e a repetição de “o Deus de”, que dá força retórica à citação e é relevante para o argumento no contexto.
theological_decisions:
- issue: Linguagem da ressurreição em ὅτι ἐγείρονται
  choice: os mortos serem ressuscitados
  alternative: os mortos ressuscitarem
  rationale: A forma passiva preserva a nuance de que os mortos são levantados, sem explicitar no versículo quem realiza a ação nem resolver além do grego a relação entre ação divina e ressurreição.
- issue: Tempo presente e repetição na autoidentificação divina
  choice: Eu sou o Deus de Abraão, o Deus de Isaque e o Deus de Jacó
  alternative: Eu sou Deus de Abraão, de Isaque e de Jacó
  rationale: O presente e a estrutura repetida são preservados porque integram o raciocínio de Jesus. A tradução evita condensar a fórmula ou explicar diretamente sua consequência teológica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por “vocês” e por uma sintaxe natural. “Sarça” foi mantido por ser o termo bíblico reconhecível para o arbusto do episódio, e a nota esclarece a ambiguidade entre localização e identificação da passagem.
