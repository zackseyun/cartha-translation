base_translation:
  language: en
  yaml_path: translation/nt/mark/012/020.yaml
  text: There were seven brothers; and the first took a wife[a], and when he died he left no offspring.
translation:
  language: pt
  text: Havia sete irmãos; o primeiro casou-se com uma mulher e, ao morrer, não deixou descendência.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “semente”; aqui, no sentido de prole ou descendentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ ἀδελφοὶ ἦσαν
  choice: Havia sete irmãos
  rationale: Traduz naturalmente a construção existencial e preserva a referência específica a irmãos homens no contexto do casamento levirato.
- source_word: ὁ πρῶτος
  choice: O primeiro
  rationale: Indica a sequência entre os sete irmãos sem acrescentar a ideia não expressa de que ele fosse o mais velho.
- source_word: ἔλαβεν γυναῖκα
  choice: se casou
  rationale: Expressa em português atual o sentido idiomático de tomar uma mulher por esposa, evitando a formulação pouco natural e potencialmente ambígua 'tomou uma mulher'.
- source_word: ἀποθνῄσκων
  choice: ao morrer
  rationale: Reproduz de modo conciso e natural a relação temporal do particípio grego.
- source_word: οὐκ ἀφῆκεν
  choice: não deixou
  rationale: No contexto da morte, ἀφίημι significa deixar alguém ou algo após si.
- source_word: σπέρμα
  choice: descendência
  rationale: Comunica o uso figurado e familiar de 'semente' para prole, sem restringi-lo indevidamente a um único filho.
