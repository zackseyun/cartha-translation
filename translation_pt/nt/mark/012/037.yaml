source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ λέγει αὐτὸν κύριον, καὶ πόθεν ⸂αὐτοῦ ἐστιν υἱός⸃; καὶ ὁ πολὺς ὄχλος ἤκουεν αὐτοῦ ἡδέως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/037.yaml
  text: David himself calls him Lord[b][a], so how is he his son? And the large crowd was listening to him gladly.
translation:
  language: pt
  text: O próprio Davi o chama de Senhor; então, como ele pode ser seu filho?[a][b] E a grande multidão o ouvia com prazer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “então, de onde vem que ele seja seu filho?”'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “filho” retoma o título messiânico “Filho de Davi” e também pode ter o sentido mais amplo de “descendente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: O próprio Davi
  rationale: Preserva o uso intensivo de αὐτός, que enfatiza que foi o próprio Davi quem lhe atribuiu esse título.
- source_word: λέγει αὐτὸν κύριον
  choice: o chama de Senhor
  rationale: Em português, a construção predicativa é expressa naturalmente por “chamar de”; “Senhor” mantém a força titular e escriturística de κύριος.
- source_word: καὶ πόθεν αὐτοῦ ἐστιν υἱός
  choice: então, como ele pode ser seu filho?
  rationale: πόθεν tem sentido literal de “de onde”, mas aqui questiona a base lógica da relação. “Como ele pode ser” comunica a força retórica sem eliminar a tensão.
- source_word: υἱός
  choice: filho
  rationale: Mantém o termo concreto usado no grego e a ligação com o título messiânico “Filho de Davi”; “descendente” explicitaria apenas um de seus sentidos contextuais.
- source_word: ὁ πολὺς ὄχλος
  choice: a grande multidão
  rationale: Expressa de modo natural que se tratava de uma multidão numerosa, sem interpretar a expressão como uma classe social.
- source_word: ἤκουεν αὐτοῦ ἡδέως
  choice: o ouvia com prazer
  rationale: O imperfeito é compatível com a ação contínua de ouvir, enquanto “com prazer” transmite claramente a satisfação indicada por ἡδέως.
theological_decisions:
- issue: A força cristológica de Davi chamar o Messias de “Senhor”
  choice: Manter o título direto “Senhor” e a pergunta retórica sem explicação doutrinária no corpo do texto.
  alternative: Explicitar “o Messias” ou dizer “em que sentido ele é seu filho”.
  rationale: 'A formulação conserva o argumento de Jesus e sua tensão: o descendente davídico é chamado de Senhor por Davi, sem inserir no versículo uma resolução teológica mais ampla.'
- issue: Sentido de υἱός no contexto messiânico
  choice: filho
  alternative: descendente
  rationale: “Filho” preserva tanto a expressão grega quanto a alusão ao título “Filho de Davi”; a nota informa o sentido genealógico mais amplo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “O próprio Davi” conserva a ênfase; “o chama de Senhor” é idiomático; “com prazer” evita tanto o tom arcaico quanto uma paráfrase excessivamente emotiva.
