source:
  edition: SBLGNT
  text: Καὶ προσελθὼν εἷς τῶν γραμματέων ἀκούσας αὐτῶν συζητούντων, ⸀ἰδὼν ὅτι καλῶς ⸂ἀπεκρίθη αὐτοῖς⸃, ἐπηρώτησεν αὐτόν· Ποία ἐστὶν ⸂ἐντολὴ πρώτη πάντων⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/028.yaml
  text: And one of the scribes came up and heard them debating, and seeing that he had answered them well, he asked him, “Which commandment is the first of all?”
translation:
  language: pt
  text: 'Um dos escribas se aproximou e os ouviu debatendo. Ao perceber que Jesus lhes havia respondido bem, perguntou-lhe: “Qual é o primeiro[a] de todos os mandamentos?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o principal” ou “o mais importante”.
    reason: Alternativa lexical para πρώτη, que pode indicar primazia de posição ou de importância.
lexical_decisions:
- source_word: γραμματέων
  choice: escribas
  rationale: No contexto dos Evangelhos, designa especialistas judeus reconhecidos na Lei. “Escribas” é a tradução direta e tradicional, sem especificar em excesso sua função.
- source_word: προσελθὼν
  choice: se aproximou
  rationale: Expressa com naturalidade o movimento em direção a Jesus indicado por προσέρχομαι.
- source_word: ἀκούσας αὐτῶν συζητούντων
  choice: os ouviu debatendo
  rationale: συζητέω pode indicar discussão, disputa ou debate. “Debatendo” comunica uma troca pública de argumentos sem necessariamente sugerir hostilidade.
- source_word: ἰδὼν ὅτι καλῶς ἀπεκρίθη αὐτοῖς
  choice: Ao perceber que Jesus lhes havia respondido bem
  rationale: “Perceber” transmite o valor contextual de ἰδών, e “bem” preserva καλῶς sem interpretar a expressão como uma declaração explícita de correção doutrinária. O nome “Jesus” esclarece o referente pronominal evidente no contexto.
- source_word: ἐπηρώτησεν αὐτόν
  choice: perguntou-lhe
  rationale: Tradução corrente e concisa de ἐπερωτάω com seu objeto.
- source_word: Ποία
  choice: Qual
  rationale: Introduz naturalmente em português a identificação de um mandamento entre vários.
- source_word: ἐντολή
  choice: mandamento
  rationale: Mantém o registro bíblico habitual e a referência à Lei.
- source_word: πρώτη πάντων
  choice: o primeiro de todos
  rationale: Conserva a formulação concreta do grego e sua possível nuance de primazia, sem substituí-la no texto principal por uma paráfrase explicitamente interpretativa.
theological_decisions:
- issue: Sentido de πρώτη na pergunta sobre o mandamento
  choice: o primeiro de todos
  alternative: o principal de todos; o mais importante de todos
  rationale: πρώτη pode indicar tanto posição inicial quanto primazia em importância. A tradução principal mantém “primeiro”, preservando a forma e a tensão semântica do grego, enquanto a nota registra o sentido possível de superioridade em categoria.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural sobretudo no Brasil e compreensão internacional. A construção “perguntou-lhe” evita repetição e mantém um registro bíblico contemporâneo sem arcaísmo excessivo.
