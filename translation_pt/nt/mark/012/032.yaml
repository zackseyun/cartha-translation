source:
  edition: SBLGNT
  text: ⸀καὶ εἶπεν αὐτῷ ὁ γραμματεύς· Καλῶς, διδάσκαλε, ἐπ’ ἀληθείας εἶπες ὅτι εἷς ἐστιν καὶ οὐκ ἔστιν ἄλλος πλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/032.yaml
  text: And the scribe said to him[a], “Well said, Teacher. You have spoken truly that he is one, and there is no other besides him.”
translation:
  language: pt
  text: 'E o escriba lhe disse: “Muito bem, Mestre. Disseste a verdade ao dizer que ele é um só[a] e que não há outro além dele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito segundo o contexto: “Deus é um só”. O grego diz apenas “ele é um só”; o referente é indicado pelo contexto anterior.'
    reason: alternative_reading
lexical_decisions:
- source_word: γραμματεύς
  choice: escriba
  rationale: É o equivalente tradicional, conciso e historicamente reconhecível para um especialista judeu nas Escrituras e na Lei; evita transformar a função em uma paráfrase interpretativa.
- source_word: Καλῶς
  choice: Muito bem
  rationale: Neste contexto, expressa aprovação ao que Jesus acaba de dizer. A formulação é natural no diálogo em português e mantém a concisão do advérbio grego.
- source_word: διδάσκαλε
  choice: Mestre
  rationale: É a forma corrente e digna de tratamento para διδάσκαλος nos Evangelhos, com o sentido de quem ensina.
- source_word: ἐπ’ ἀληθείας
  choice: com verdade
  rationale: Reproduz o valor adverbial da expressão, afirmando que a declaração de Jesus corresponde à verdade, sem acrescentar intensidade ausente do texto.
- source_word: εἶπες
  choice: Disseste
  rationale: O pretérito perfeito traduz diretamente o aoristo e soa natural como referência à fala imediatamente anterior.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo daquilo que Jesus disse, e não a causa da aprovação do escriba.
- source_word: εἷς ἐστιν
  choice: ele é um só
  rationale: Preserva o sujeito implícito do grego e sua referência contextual a Deus. “Um só” comunica unidade e exclusividade de modo idiomático em português.
- source_word: οὐκ ἔστιν ἄλλος
  choice: não há outro
  rationale: É a construção existencial natural em português e corresponde diretamente à afirmação grega.
- source_word: πλὴν αὐτοῦ
  choice: além dele
  rationale: Expressa a exclusão indicada por πλήν com genitivo, de forma clara e natural.
theological_decisions:
- issue: Sujeito implícito em εἷς ἐστιν
  choice: Manter “ele é um só” no texto principal.
  alternative: Explicitar “Deus é um só” ou “há um só Deus”.
  rationale: O contexto anterior identifica inequivocamente Deus como referente, mas este versículo não repete θεός. A tradução mantém a elipse da fonte e esclarece o referente em nota, sem tornar o texto principal mais explícito que o grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Escriba” preserva a designação histórica; “Mestre” é natural no contexto evangélico. A colocação pronominal em “lhe disse” e a forma “disseste” mantêm um registro literário acessível sem arcaísmo excessivo.
