id: MRK.12.9
reference: Mark 12:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀τί ποιήσει ὁ κύριος τοῦ ἀμπελῶνος; ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργούς, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/009.yaml
  text: What will the owner of the vineyard do? He will come and destroy the tenant farmers[a], and give the vineyard to others.
translation:
  language: pt
  text: O que fará o dono da vinha? Ele virá, destruirá os agricultores arrendatários[a] e dará a vinha a outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lavradores arrendatários”; o termo grego designa os que cultivavam a vinha de outra pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ποιήσει
  choice: O que fará
  rationale: Reproduz de modo direto e natural a pergunta retórica no futuro, sem acrescentar uma conexão ausente do grego.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: o dono da vinha
  rationale: No contexto da parábola, κύριος designa o proprietário da vinha; “dono” comunica esse sentido sem introduzir no enunciado um título divino explícito.
- source_word: ἀμπελῶνος / ἀμπελῶνα
  choice: vinha
  rationale: Equivalente corrente e preciso de ἀμπελών no contexto agrícola e parabólico.
- source_word: ἐλεύσεται
  choice: Ele virá
  rationale: Tradução direta do futuro de ἔρχομαι, preservando a intervenção vívida do proprietário.
- source_word: ἀπολέσει
  choice: destruirá
  rationale: Mantém a severidade do juízo e a amplitude semântica de ἀπόλλυμι sem restringi-lo necessariamente a “matará”.
- source_word: τοὺς γεωργούς
  choice: os lavradores arrendatários
  rationale: Expressa tanto o trabalho agrícola quanto a condição desses homens, que cultivam a vinha pertencente a outro.
- source_word: δώσει
  choice: dará
  rationale: Equivalente direto de δίδωμι, sem especificar indevidamente “arrendará” ou “confiará”.
- source_word: ἄλλοις
  choice: a outros
  rationale: Preserva a referência aberta do grego, sem acrescentar “lavradores” ou “arrendatários” ao texto principal.
theological_decisions:
- issue: Tradução de κύριος com referente humano dentro da parábola
  choice: dono
  alternative: senhor; proprietário
  rationale: O referente imediato é quem possui a vinha. “Dono” é claro e natural em português e evita impor um título cristológico à formulação, sem eliminar as implicações teológicas da parábola.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa. “Lavradores arrendatários” conserva os aspectos agrícola e contratual de γεωργοί; a nota oferece uma alternativa de vocabulário corrente.
