id: MRK.12.12
reference: Mark 12:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐζήτουν αὐτὸν κρατῆσαι, καὶ ἐφοβήθησαν τὸν ὄχλον, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς τὴν παραβολὴν εἶπεν. καὶ ἀφέντες αὐτὸν ἀπῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/012.yaml
  text: And they were seeking to seize him[a], but they feared the crowd, for they knew that he had spoken the parable against them. So they left him and went away.
translation:
  language: pt
  text: Eles procuravam prendê-lo, mas tiveram medo da multidão, pois sabiam que ele havia contado a parábola contra eles.[a] Então o deixaram e foram embora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a respeito deles” ou “dirigida a eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: procuravam
  rationale: O imperfeito indica uma ação em curso ou uma tentativa; “procuravam” preserva esse aspecto sem explicitar mais do que o grego.
- source_word: κρατῆσαι
  choice: prendê-lo
  rationale: No contexto, κρατέω significa apoderar-se de Jesus ou detê-lo. “Prender” é natural em português e comunica a intenção sem exigir a ideia técnica de um processo legal formal.
- source_word: ἐφοβήθησαν τὸν ὄχλον
  choice: tiveram medo da multidão
  rationale: Expressão corrente e clara para o aoristo de φοβέομαι com objeto acusativo.
- source_word: ἔγνωσαν
  choice: sabiam
  rationale: Traduz diretamente o reconhecimento expresso por γινώσκω; “perceberam” também seria possível, mas acrescentaria ênfase ao momento da descoberta.
- source_word: πρὸς αὐτούς
  choice: contra eles
  rationale: 'O contexto hostil favorece o sentido adversativo: a parábola era dirigida a eles e os condenava. A amplitude da preposição é preservada em nota.'
- source_word: τὴν παραβολὴν εἶπεν
  choice: havia contado a parábola
  rationale: Em português, “contar uma parábola” é idiomático; o mais-que-perfeito composto esclarece que esse ato precedeu o conhecimento mencionado.
- source_word: ἀφέντες αὐτὸν
  choice: o deixaram
  rationale: O particípio indica que desistiram de agir contra ele e o deixaram; a formulação evita interpretar o gesto como soltura após uma prisão.
- source_word: ἀπῆλθον
  choice: foram embora
  rationale: Equivalente narrativo natural e moderno para a ideia de afastar-se ou partir.
theological_decisions:
- issue: Força de πρὸς αὐτούς
  choice: contra eles
  alternative: a respeito deles; dirigida a eles
  rationale: “Contra eles” expressa adequadamente a força acusatória no contexto, enquanto a nota reconhece que a construção grega também pode indicar referência ou direção sem tornar explícita a nuance adversativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A ordem narrativa e o contraste do grego foram mantidos sem rigidez sintática.
