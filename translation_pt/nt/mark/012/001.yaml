  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο αὐτοῖς ἐν παραβολαῖς ⸀λαλεῖν· Ἀμπελῶνα ⸂ἄνθρωπος ἐφύτευσεν⸃, καὶ περιέθηκεν φραγμὸν καὶ ὤρυξεν ὑπολήνιον καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/001.yaml
  text: 'And he began to speak to them in parables: “A man planted a vineyard[a], and put a fence around it, and dug a winepress pit, and built a tower, and leased it to tenant farmers[d][c][b], and went away.”'
translation:
  language: pt
  text: 'E ele começou a falar-lhes por meio de parábolas: “Um homem plantou uma vinha, cercou-a com uma cerca[a], cavou um tanque do lagar[b], construiu uma torre, arrendou a vinha a lavradores[c] e foi embora.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “cercou-a com uma sebe” ou “com uma barreira”. A palavra grega pode indicar diferentes tipos de cercado ou barreira.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o tanque inferior do lagar, no qual o suco prensado era recolhido. Também pode ser traduzido por “cavou um tanque para o lagar”.
    reason: lexical_alternative
  - marker: c
    text: Também pode ser traduzido por “alugou-a a agricultores” ou “arrendou-a a vinhateiros”. Eram lavradores que cultivavam a propriedade de outra pessoa.
    reason: lexical_alternative
  - marker: d
    text: As imagens da vinha plantada, cercada e equipada evocam Isaías 5:1–2.
    reason: cross_reference
lexical_decisions:
- source_word: ἤρξατο ... λαλεῖν
  choice: começou a falar
  rationale: Reproduz naturalmente em português a construção incoativa formada por ἤρξατο com o infinitivo λαλεῖν.
- source_word: ἐν παραβολαῖς
  choice: por meio de parábolas
  rationale: Exprime com clareza o meio ou modo do ensino; o plural também permite que este relato introduza uma série de parábolas.
- source_word: Ἀμπελῶνα ἄνθρωπος ἐφύτευσεν
  choice: Um homem plantou uma vinha
  rationale: Mantém o referente masculino e a ordem narrativa natural em português, sem tornar ἄνθρωπος genericamente inclusivo.
- source_word: περιέθηκεν φραγμόν
  choice: cercou-a com uma barreira
  rationale: φραγμός pode designar cerca, sebe ou outro tipo de cercado; “barreira” preserva essa amplitude lexical.
- source_word: ὤρυξεν ὑπολήνιον
  choice: cavou um tanque para o lagar
  rationale: ὑπολήνιον é o recipiente inferior do lagar, onde o líquido prensado era recolhido; “tanque para o lagar” é preciso e inteligível.
- source_word: ᾠκοδόμησεν πύργον
  choice: construiu uma torre
  rationale: Tradução direta e corrente, preservando a sequência das instalações da vinha.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: arrendou a vinha a lavradores
  rationale: O verbo indica cessão mediante arrendamento, e γεωργοί são os lavradores que cultivam a propriedade alheia. A repetição de “vinha” evita a ambiguidade de gênero que surgiria com um pronome português após “torre”.
- source_word: ἀπεδήμησεν
  choice: partiu para longe
  rationale: Comunica que o proprietário se ausentou para outro lugar, possivelmente por um período prolongado, sem acrescentar destino ou duração.
theological_decisions:
- issue: Relação entre o proprietário e os γεωργοί
  choice: arrendou a vinha a lavradores
  alternative: alugou-a a agricultores; entregou-a a vinhateiros
  rationale: A formulação conserva a distinção essencial entre o dono e os cultivadores sem especificar além do texto as condições econômicas do arrendamento.
- issue: Possível eco de Isaías 5:1–2
  choice: preservar as imagens agrícolas e registrar o eco em nota
  alternative: explicitar Isaías no corpo do texto
  rationale: A vinha cercada, o tanque do lagar e a torre evocam Isaías, mas a alusão não deve ser transformada em explicação dentro da fala de Jesus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Então” mantém a continuidade narrativa de Καί. “Por meio de parábolas” soa mais natural do que o decalque “em parábolas”. O texto evita regionalismos e conserva a concisão e a progressão verbal do grego.
