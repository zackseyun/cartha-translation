  text: ἔτι ⸂ἕνα εἶχεν, υἱὸν ἀγαπητόν· ἀπέστειλεν⸃ αὐτὸν ⸂ἔσχατον πρὸς αὐτοὺς⸃ λέγων ὅτι Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/006.yaml
  text: He still had one[a], a beloved son. He sent him last to them, saying[c][b], ‘They will respect my son.’
translation:
  language: pt
  text: 'Ainda lhe restava um: seu filho amado. Por último, enviou-o a eles, dizendo: “Respeitarão meu filho.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo também pode significar “terão vergonha diante do meu filho” ou “mostrarão deferência ao meu filho”; neste contexto, “respeitarão” expressa melhor o sentido.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι ἕνα εἶχεν
  choice: Ainda lhe restava um
  rationale: Expressa de modo natural que, depois dos servos já enviados, ainda havia uma pessoa restante que ele podia enviar.
- source_word: υἱὸν ἀγαπητόν
  choice: seu filho amado
  rationale: Preserva o sentido afetivo de ἀγαπητός e a ressonância cristológica da expressão no Evangelho de Marcos, sem explicá-la dentro do texto.
- source_word: ἀπέστειλεν αὐτὸν ἔσχατον πρὸς αὐτούς
  choice: Por último, enviou-o a eles
  rationale: Mantém a posição culminante do filho na sequência; “por último” é mais natural em português narrativo do que o advérbio isolado “último”.
- source_word: λέγων ὅτι
  choice: 'dizendo:'
  rationale: Introduz naturalmente o discurso direto em português.
- source_word: Ἐντραπήσονται
  choice: Respeitarão
  rationale: No contexto, o verbo indica tratar alguém com respeito ou deferência, embora também possa envolver a ideia de sentir vergonha diante dessa pessoa.
- source_word: τὸν υἱόν μου
  choice: meu filho
  rationale: Tradução direta que conserva a força possessiva e cristológica da frase.
theological_decisions:
- issue: Ressonância cristológica de υἱὸν ἀγαπητόν
  choice: Manter “seu filho amado” sem ampliação interpretativa
  alternative: “seu filho muito amado”
  rationale: A formulação ecoa a apresentação de Jesus como o Filho amado em Marcos; a tradução preserva essa ressonância sem impor uma explicação doutrinária ao texto.
- issue: Sentido de ἐντραπήσονται
  choice: “Respeitarão” no texto principal, com nota sobre a amplitude semântica
  alternative: “Terão vergonha diante de”
  rationale: O contexto favorece respeito ou deferência, mas a nota preserva a tensão lexical ligada à vergonha.
translation_notes:
  register: Português moderno, digno e acessível, com construção narrativa natural. A colocação pronominal em “enviou-o” mantém um tom literário moderado sem prejudicar a clareza. Todos os marcadores de nota presentes no aparato aparecem no texto principal.
