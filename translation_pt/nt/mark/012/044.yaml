source:
  edition: SBLGNT
  text: πάντες γὰρ ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον, αὕτη δὲ ἐκ τῆς ὑστερήσεως αὐτῆς πάντα ὅσα εἶχεν ἔβαλεν, ὅλον τὸν βίον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/044.yaml
  text: For they all gave out of their abundance[a], but she, out of her poverty, put in everything she had—her whole livelihood.
translation:
  language: pt
  text: Pois todos deram do que lhes sobrava; ela, porém, da sua pobreza, deu tudo o que tinha — todo o seu sustento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tudo o que tinha para viver”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: todos
  rationale: Preserva a totalidade enfática e, no contexto, refere-se coletivamente aos demais ofertantes.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a relação explicativa com a avaliação feita por Jesus no versículo anterior.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: do que lhes sobrava
  rationale: Expressa de modo natural que deram a partir do excedente, isto é, do que ultrapassava suas necessidades.
- source_word: ἔβαλον / ἔβαλεν
  choice: deram / deu
  rationale: No contexto de ofertas, 'dar' comunica naturalmente o ato de colocar dinheiro no tesouro, sem exigir o sentido literal de 'lançar'.
- source_word: αὕτη δὲ
  choice: ela, porém
  rationale: Preserva o contraste explícito entre a viúva e todos os demais ofertantes.
- source_word: ἐκ τῆς ὑστερήσεως αὐτῆς
  choice: da sua pobreza
  rationale: ὑστέρησις indica carência ou privação; 'pobreza' torna clara a condição econômica em foco.
- source_word: πάντα ὅσα εἶχεν
  choice: tudo o que tinha
  rationale: Reproduz de forma idiomática e enfática a abrangência total da expressão grega.
- source_word: ὅλον τὸν βίον αὐτῆς
  choice: todo o seu sustento
  rationale: Neste contexto monetário, βίος designa os recursos necessários para viver; 'sustento' é claro, digno e corrente em português.
theological_decisions:
- issue: Sentido de βίος na declaração sobre a oferta da viúva
  choice: meios de subsistência ('sustento')
  alternative: sua vida inteira
  rationale: O contexto trata de dinheiro e βίος pode designar os recursos de que alguém vive. A tradução evita sugerir que ela entregou literalmente sua vida biológica, sem reduzir a radicalidade de ter dado tudo de que dispunha.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção mantém o paralelismo e o contraste do grego, usando vocabulário acessível e digno.
