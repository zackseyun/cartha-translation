  text: ⸂ἀπεκρίθη ὁ Ἰησοῦς⸃ ὅτι Πρώτη ⸀ἐστίν· Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/029.yaml
  text: 'Jesus answered[a], “The first is: Hear, O Israel, the Lord our God[b], the Lord is one.'
translation:
  language: pt
  text: 'Jesus respondeu: “O primeiro é: ‘Ouça, ó Israel: o Senhor, nosso Deus, o Senhor é um[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Senhor, nosso Deus, é o único Senhor”; ou: “o Senhor é nosso Deus, somente o Senhor”. O grego ecoa Deuteronômio 6:4 e pode enfatizar a unidade de Deus, sua exclusividade, ou ambas. Nesta citação do Shemá, “Senhor” traduz o grego κύριος, usado na Septuaginta em lugar do nome divino YHWH.'
    reason: alternative_reading; cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: Forma narrativa padrão e natural em diálogo, preservando a ideia de resposta.
- source_word: Πρώτη
  choice: O primeiro
  rationale: O adjetivo substantivado retoma o mandamento implícito no contexto; o masculino é necessário em português por referência a “mandamento”.
- source_word: Ἄκουε
  choice: Ouça
  rationale: Preserva a força imperativa e a ressonância tradicional do início do Shemá, em registro moderno e digno.
- source_word: Ἰσραήλ
  choice: ó Israel
  rationale: Mantém o vocativo explícito com uma forma solene, clara e corrente em citações bíblicas.
- source_word: κύριος
  choice: Senhor
  rationale: Reproduz o uso neotestamentário de κύριος; nesta citação, o termo grego também representa o nome divino YHWH na Septuaginta, nuance indicada em nota.
- source_word: θεὸς ἡμῶν
  choice: nosso Deus
  rationale: Tradução direta e idiomática da construção possessiva.
- source_word: εἷς
  choice: um
  rationale: Mantém a formulação compacta do grego e não resolve indevidamente se a ênfase recai na unidade, na exclusividade ou em ambas.
theological_decisions:
- issue: Formulação da cláusula final do Shemá
  choice: o Senhor, nosso Deus, o Senhor é um
  alternative: 'o Senhor, nosso Deus, é o único Senhor; ou: o Senhor é nosso Deus, somente o Senhor'
  rationale: A redação escolhida acompanha de perto a ordem do grego e preserva a densidade e a ambiguidade genuína da confissão quanto à unidade e/ou exclusividade de Deus. As principais possibilidades idiomáticas são registradas em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A forma “Ouça, ó Israel” conserva a solenidade reconhecível do Shemá sem recorrer a linguagem arcaica. A nota reúne a ambiguidade sintática e o contexto do nome divino, e seu marcador aparece imediatamente após a expressão relevante.
