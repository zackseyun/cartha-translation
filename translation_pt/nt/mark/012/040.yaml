  text: οἱ κατεσθίοντες τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσευχόμενοι· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/040.yaml
  text: who devour widows’ houses and for appearance’s sake pray at length—these will receive greater condemnation[a][b].
translation:
  language: pt
  text: os que devoram as casas das viúvas e, a pretexto de fazerem longas orações — estes receberão condenação maior[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «por aparência» ou «para se exibirem».
    reason: lexical_alternative
  - marker: b
    text: Ou «julgamento maior».
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίοντες
  choice: devoram
  rationale: Preserva a metáfora vívida de consumir vorazmente os bens alheios, sem reduzi-la à explicação interpretativa «exploram».
- source_word: οἰκίας
  choice: casas
  rationale: Reproduz a expressão concreta do grego; no contexto, pode abranger o lar, os bens ou o patrimônio das viúvas, sem que a tradução determine uma extensão única.
- source_word: χηρῶν
  choice: das viúvas
  rationale: Representa naturalmente em português o genitivo plural que identifica as viúvas como proprietárias e vítimas.
- source_word: προφάσει
  choice: por aparência
  rationale: Comunica que as orações servem de fachada ou exibição; a nota registra alternativas mais explicitamente ligadas ao fingimento.
- source_word: μακρὰ προσευχόμενοι
  choice: fazem longas orações
  rationale: Expressão corrente e clara em português para a oração prolongada, mantendo a relação com a conduta descrita pelo particípio.
- source_word: λήμψονται
  choice: receberão
  rationale: Equivalente natural e solene do futuro grego no contexto de prestação de contas.
- source_word: περισσότερον
  choice: maior
  rationale: Mantém o comparativo sem especificar além do texto se a diferença é de intensidade, gravidade ou extensão.
- source_word: κρίμα
  choice: condenação
  rationale: No contexto da advertência, exprime adequadamente o resultado punitivo do julgamento; «julgamento» continua possível e é registrado em nota.
theological_decisions:
- issue: Sentido de κρίμα na advertência contra a hipocrisia religiosa
  choice: condenação
  alternative: julgamento
  rationale: O contexto aponta para uma prestação de contas punitiva, mas não define seus pormenores. «Condenação» comunica essa força, enquanto a nota preserva o termo mais amplo «julgamento».
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A imagem concreta «devoram as casas» e a ambiguidade lexical de κρίμα foram preservadas; o travessão marca a conclusão enfática.
