  text: Καὶ ⸀καθίσας ⸀κατέναντι τοῦ γαζοφυλακίου ἐθεώρει πῶς ὁ ὄχλος βάλλει χαλκὸν εἰς τὸ γαζοφυλάκιον· καὶ πολλοὶ πλούσιοι ἔβαλλον πολλά·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/041.yaml
  text: And sitting opposite the treasury[a], he was watching how the crowd was putting money into the treasury; and many rich people were putting in much.
translation:
  language: pt
  text: E, sentado em frente à tesouraria[a], ele observava como a multidão depositava dinheiro na tesouraria; e muitos ricos depositavam grandes quantias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “caixa de ofertas” ou “cofre de ofertas”; o termo grego pode indicar a tesouraria do templo ou os recipientes associados a ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθίσας
  choice: sentando-se
  rationale: O particípio aoristo introduz a postura que acompanha a ação principal; esta formulação é natural em português e mantém a função narrativa sem tornar obrigatória uma sequência temporal rígida.
- source_word: κατέναντι
  choice: diante de
  rationale: Expressa a posição em frente ao local; é corrente e natural em português, sem sugerir necessariamente grande distância.
- source_word: γαζοφυλάκιον
  choice: tesouro
  rationale: Mantém a designação tradicional e concisa, preservando a possível referência tanto ao tesouro do templo quanto aos recipientes ligados a ele; a alternativa mais específica aparece em nota.
- source_word: ἐθεώρει
  choice: observava
  rationale: O imperfeito indica observação contínua; 'observava' transmite tanto a duração quanto a atenção envolvida.
- source_word: πῶς
  choice: como
  rationale: Preserva o foco explícito no modo ou processo pelo qual a multidão contribuía, sem reduzi-lo apenas ao fato de que contribuía.
- source_word: ὁ ὄχλος
  choice: a multidão
  rationale: Equivalente coletivo natural e atual, apropriado ao contexto narrativo.
- source_word: βάλλει / ἔβαλλον
  choice: depositava / depositavam
  rationale: Embora βάλλω possa significar literalmente lançar, no contexto de colocar dinheiro em receptáculos 'depositar' comunica a ação de modo idiomático e preserva o aspecto contínuo dos imperfeitos.
- source_word: χαλκόν
  choice: dinheiro
  rationale: Literalmente cobre ou bronze, o termo designa aqui moeda de metal comum; 'dinheiro' é natural no contexto, evita restringir indevidamente a tradução e concorda com o sentido monetário.
- source_word: πολλοὶ πλούσιοι
  choice: muitos ricos
  rationale: O adjetivo substantivado permite esta forma inclusiva e concisa, sem acrescentar 'homens' ao texto.
- source_word: πολλά
  choice: grandes quantias
  rationale: No contexto monetário, o neutro plural indica muito dinheiro; 'grandes quantias' torna claro o sentido idiomático e contrasta naturalmente com a oferta posterior da viúva.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção conserva o andamento narrativo e o aspecto contínuo de ἐθεώρει e dos verbos de contribuição, sem especificar além do que o termo γαζοφυλάκιον permite.
