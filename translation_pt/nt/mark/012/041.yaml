  source_fidelity: A tradução preserva bem a observação contínua (ἐθεώρει) e o foco em como a multidão contribuía (πῶς), bem como o contraste entre muitos ricos e suas grandes quantias. Contudo, «diante do tesouro» não exprime com suficiente precisão κατέναντι («em frente a/oposto a») e «tesouro» em português tende a designar riqueza, não a tesouraria ou os recipientes do templo.
  naturalness: «Em frente à tesouraria» é mais idiomático e claro para leitores contemporâneos. «E, sentado» mantém de modo natural a função de cenário do particípio aoristo, sem impor mais sequência temporal do que o grego requer.
  terminology: «Tesouraria» é uma designação portuguesa mais adequada para γαζοφυλάκιον como termo principal. A nota preserva a ambiguidade lexical entre a tesouraria do templo e os recipientes de ofertas, sem decidir indevidamente a questão.
