reference: Mark 12:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν ⸀αὐτοῖς· ⸂Τὰ Καίσαρος ἀπόδοτε⸃ Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ. καὶ ⸀ἐξεθαύμαζον ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/017.yaml
  text: But Jesus said to them[a], “Give back to Caesar the things that are Caesar’s, and to God the things that are God’s.” And they were utterly amazed at him.
translation:
  language: pt
  text: 'Mas Jesus lhes disse: “Deem a César o que é de César e a Deus o que é de Deus.” E ficaram profundamente admirados com ele.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Deem
  rationale: O imperativo de ἀποδίδωμι pode significar dar, devolver ou pagar o que é devido. Em português, “deem a César o que é de César” preserva com naturalidade a ideia de atribuir ou entregar a cada um o que lhe pertence, sem restringir o sentido apenas ao pagamento de imposto.
- source_word: Τὰ Καίσαρος ... Καίσαρι
  choice: a César o que é de César
  rationale: A formulação idiomática preserva tanto a relação de posse expressa pelo genitivo quanto o paralelismo deliberado da frase.
- source_word: τὰ τοῦ θεοῦ ... τῷ θεῷ
  choice: a Deus o que é de Deus
  rationale: Mantém o paralelismo com a primeira oração e não define além do texto quais obrigações pertencem a Deus.
- source_word: ἐξεθαύμαζον
  choice: ficaram profundamente admirados
  rationale: O verbo intensivo ἐκθαυμάζω indica forte admiração ou assombro. A formulação comunica essa intensidade em português natural.
- source_word: ἐπ’ αὐτῷ
  choice: com ele
  rationale: Com verbo de admiração, ἐπί com dativo pode indicar o objeto ou motivo da reação. “Com ele” conserva a referência pessoal sem substituir explicitamente Jesus por sua resposta.
- source_word: δὲ
  choice: Mas
  rationale: δέ introduz a resposta de Jesus com leve contraste em relação à tentativa de seus interlocutores.
- source_word: εἶπεν αὐτοῖς
  choice: lhes disse
  rationale: Equivalente corrente e conciso que preserva tanto o ato de falar quanto seus destinatários.
theological_decisions:
- issue: Relação entre a obrigação civil e a obrigação para com Deus
  choice: Traduzir diretamente as duas orações paralelas, sem formular uma teoria sobre as relações entre autoridade civil e autoridade divina.
  alternative: Interpretar a frase como forte endosso da autoridade civil ou como redução implícita das reivindicações de César.
  rationale: O texto reconhece aquilo que é de César e aquilo que é de Deus, mas não apresenta uma teoria política completa nem explicita aqui os limites entre as duas esferas. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção idiomática natural tanto no Brasil quanto em outros contextos lusófonos. “Deem” evita o lusitanismo mais marcado “dai” e mantém a força imperativa. Não se acrescentou nota porque “deem” funciona naturalmente no contexto e não elimina a noção de entregar o que é devido.
