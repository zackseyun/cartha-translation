id: MRK.12.35
reference: Mark 12:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς ἔλεγεν διδάσκων ἐν τῷ ἱερῷ· Πῶς λέγουσιν οἱ γραμματεῖς ὅτι ὁ χριστὸς υἱὸς ⸂Δαυίδ ἐστιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/035.yaml
  text: And Jesus answered and said[a], as he was teaching in the temple, “How do the scribes say that the Messiah is the son of David?”
translation:
  language: pt
  text: 'Enquanto ensinava no templo, Jesus tomou a palavra e disse: “Como é que os escribas dizem que o Messias[a] é filho de Davi?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”. O título grego é Christós, usado aqui em sentido messiânico.'
    reason: Registra o equivalente tradicional do título grego sem obscurecer seu sentido judaico-messiânico no texto principal.
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: tomou a palavra
  rationale: O particípio frequentemente introduz uma resposta, mesmo sem pergunta explícita. “Tomou a palavra” conserva a ideia de que Jesus reage ao debate em curso e soa natural em português.
- source_word: ἔλεγεν
  choice: disse
  rationale: Embora o imperfeito possa ser traduzido por “dizia”, o perfeito narrativo “disse” introduz com naturalidade a pergunta direta; a ação em curso já é expressa por “Enquanto ensinava”.
- source_word: διδάσκων
  choice: Enquanto ensinava
  rationale: Expressa a simultaneidade indicada pelo particípio presente e fornece de modo claro a circunstância da fala.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: Ἱερόν designa o complexo do templo, e “templo” é a forma tradicional e compreensível em português sem restringir indevidamente a referência ao santuário interior.
- source_word: Πῶς
  choice: Como é que
  rationale: Mantém a forma interrogativa do grego e, no contexto, comunica naturalmente o questionamento de Jesus quanto à afirmação dos escribas, sem acrescentar explicitamente a ideia de impossibilidade.
- source_word: γραμματεῖς
  choice: os escribas
  rationale: É o termo histórico usual para os especialistas na Lei e evita a ampliação interpretativa de “mestres da Lei”.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Aqui Χριστός funciona claramente como título dentro da expectativa messiânica judaica; “Messias” transmite esse sentido de modo direto.
- source_word: υἱὸς Δαυίδ
  choice: filho de Davi
  rationale: A expressão identifica a descendência e a designação davídica atribuídas ao Messias. Sem artigo, a formulação é natural em português e não torna a construção grega mais definida do que ela é.
theological_decisions:
- issue: Tradução de Χριστός como título
  choice: Messias
  alternative: Cristo
  rationale: No debate sobre a relação do esperado rei davídico com Davi, Χριστός é um título messiânico, não um nome pessoal. “Cristo” permanece na nota como equivalente tradicional.
- issue: Força da pergunta introduzida por Πῶς
  choice: Como é que os escribas dizem
  alternative: Como podem os escribas dizer
  rationale: “Como é que” preserva a pergunta e sua força retórica sem resolver antecipadamente se Jesus nega a filiação davídica ou questiona a suficiência da formulação.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Tomou a palavra” evita o pouco natural “respondendo, disse” quando não há pergunta explícita imediatamente anterior. A ordem foi ajustada para fluência, mantendo o ensino no templo como circunstância simultânea.
