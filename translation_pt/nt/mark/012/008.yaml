base_translation:
  language: en
  yaml_path: translation/nt/mark/012/008.yaml
  text: And they took him[a], killed him, and threw him out of the vineyard.
translation:
  language: pt
  text: E eles o pegaram[a], mataram-no e o lançaram para fora da vinha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns leitores talvez esperem a ordem “lançaram-no para fora da vinha e o mataram”, com base nos relatos paralelos da parábola; porém, o texto grego de Marcos aqui diz “mataram-no e o lançaram para fora da vinha”.
    reason: cross_reference
lexical_decisions:
- source_word: λαβόντες
  choice: agarrando-o
  rationale: O particípio aoristo de λαμβάνω introduz a sequência de ações. “Agarrando-o” é natural em português e, neste contexto hostil, comunica que eles o tomaram sob seu poder sem tornar a expressão excessivamente interpretativa.
- source_word: ἀπέκτειναν
  choice: mataram-no
  rationale: ἀποκτείνω significa diretamente “matar” ou “tirar a vida”. “Mataram-no” é claro, atual e preserva a força direta do grego.
- source_word: ἐξέβαλον
  choice: o lançaram para fora
  rationale: ἐκβάλλω indica lançar ou pôr para fora, muitas vezes com força. “Lançaram para fora” mantém essa força e combina naturalmente com a indicação da vinha.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: para fora da vinha
  rationale: ἔξω com o genitivo, após um verbo de movimento, indica deslocamento para o exterior. “Para fora da vinha” expressa isso com clareza em português.
- source_word: ἀμπελῶνος
  choice: vinha
  rationale: ἀμπελών é o termo comum para uma plantação de videiras; “vinha” é a correspondência bíblica e corrente em português.
theological_decisions:
- issue: Ordem entre a morte e a expulsão na parábola
  choice: 'Preservar a sequência do texto grego: eles o mataram e depois o lançaram para fora da vinha.'
  alternative: Inverter a ordem para dizer que primeiro o lançaram para fora da vinha e depois o mataram, conforme a expectativa criada por tradições paralelas.
  rationale: O texto do SBLGNT em Marcos 12:8 apresenta explicitamente a ordem ἀπέκτειναν ... καὶ ἐξέβαλον, isto é, “mataram ... e lançaram para fora”. A tradução não harmoniza Marcos com os relatos paralelos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção é concisa e mantém a sequência rápida e severa do original.
