source:
  edition: SBLGNT
  text: Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν ὅτι ἐάν τινος ἀδελφὸς ἀποθάνῃ καὶ καταλίπῃ γυναῖκα καὶ ⸂μὴ ἀφῇ τέκνον⸃, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν ⸀γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/019.yaml
  text: Teacher[a], Moses wrote for us that if someone's brother dies and leaves behind a wife and leaves no child[c][b], his brother should take the wife and raise up offspring for his brother.
translation:
  language: pt
  text: Mestre, Moisés nos escreveu que, se o irmão de alguém morrer, deixando esposa e não deixando filho[a][b], o irmão dele deve tomar a esposa por mulher e suscitar descendência para seu irmão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “não deixar criança” ou “não deixar filho”; o singular pode ter sentido genérico, isto é, não deixar filhos.
    reason: lexical_alternative
  - marker: b
    text: Ver Deuteronômio 25:5, a disposição da Lei de Moisés citada aqui.
    reason: cross_reference
  - marker: c
    text: Mais literalmente, “levantar semente para seu irmão”, expressão que se refere a gerar descendência no cumprimento da obrigação do casamento levirato.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: Forma vocativa natural e consagrada em português para quem é reconhecido como mestre ou instrutor; neste contexto, dirige-se a Jesus sem acrescentar uma nuance de domínio que o termo grego não exige.
- source_word: ἔγραψεν ἡμῖν
  choice: nos escreveu
  rationale: Reproduz de modo conciso o verbo e o dativo, expressando que a disposição mosaica foi escrita para o povo de Israel.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: se o irmão de alguém morrer
  rationale: Mantém o caráter indefinido de τινος e os termos familiares masculinos explícitos no texto grego.
- source_word: καταλίπῃ γυναῖκα
  choice: deixando mulher
  rationale: καταλείπω descreve aquilo que a pessoa deixa ao morrer. O português preserva a referência à esposa sobrevivente sem inserir um possessivo ausente do grego.
- source_word: μὴ ἀφῇ τέκνον
  choice: não deixar filho
  rationale: Mantém o singular τέκνον e o sentido de não deixar um descendente ao morrer. Em português, “filho” é claro no contexto da sucessão familiar.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: o irmão dele deve tomar a mulher por esposa
  rationale: O subjuntivo com ἵνα exprime aqui a exigência citada da lei. “Tomar por esposa” torna explícito o sentido matrimonial de λαμβάνω com γυνή, evitando que “tomar a mulher” seja entendido como mero ato de levá-la.
- source_word: ἐξαναστήσῃ σπέρμα
  choice: suscitar descendência
  rationale: Transmite a expressão jurídica idiomática sem o sentido potencialmente obscuro de uma tradução literal como “levantar semente”.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: para seu irmão
  rationale: Preserva o dativo de benefício ou referência sem acrescentar “falecido”, informação já estabelecida pela oração condicional.
theological_decisions:
- issue: Expressão jurídica do casamento levirato
  choice: “tomar a mulher por esposa e suscitar descendência para seu irmão”
  alternative: “casar-se com a viúva e gerar filhos em nome do irmão falecido”
  rationale: A formulação escolhida comunica a obrigação matrimonial e familiar com clareza, mas evita inserir no texto principal explicações como “em nome de” ou repetir que o irmão está falecido.
- issue: Linguagem marcada por gênero
  choice: Manter “irmão”, “mulher” e “filho”
  alternative: Empregar termos neutros como “parente”, “cônjuge” ou “descendente” em toda a frase
  rationale: A lei citada descreve explicitamente um irmão, uma esposa e a necessidade de um filho ou descendente. Neutralizar esses termos apagaria elementos presentes no grego.
- issue: Singular de τέκνον
  choice: “filho” no singular
  alternative: “filhos” ou “descendentes”
  rationale: O singular foi preservado, sem decidir além do texto se a exigência se refere especificamente a um único filho ou, genericamente, à ausência de prole.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Mestre” e “suscitar descendência” preservam o tom bíblico sem arcaísmo excessivo; “tomar a mulher por esposa” esclarece naturalmente o sentido matrimonial da construção grega.
