id: MRK.12.34
reference: Mark 12:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς ἰδὼν ⸀αὐτὸν ὅτι νουνεχῶς ἀπεκρίθη εἶπεν αὐτῷ· Οὐ μακρὰν εἶ ἀπὸ τῆς βασιλείας τοῦ θεοῦ. καὶ οὐδεὶς οὐκέτι ἐτόλμα αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/034.yaml
  text: And Jesus[a], seeing that he had answered wisely, said to him, “You are not far from the kingdom of God.” And no one any longer dared to question him.
translation:
  language: pt
  text: 'Ao ver que ele tinha respondido com discernimento, Jesus lhe disse: “Você não está longe do Reino de Deus”.[a] E ninguém mais ousava questioná-lo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você está perto do Reino de Deus”. O grego expressa proximidade, não entrada explícita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Ao ver
  rationale: Expressa naturalmente em português o particípio aoristo, mantendo o valor circunstancial e observacional da construção.
- source_word: νουνεχῶς
  choice: com discernimento
  rationale: Comunica sensatez e compreensão ponderada, sem reduzir o termo apenas a habilidade intelectual.
- source_word: ἀπεκρίθη
  choice: tinha respondido
  rationale: O mais-que-perfeito composto esclarece que a resposta do escriba precedeu a declaração de Jesus.
- source_word: Οὐ μακρὰν εἶ ἀπὸ
  choice: Você não está longe de
  rationale: Preserva a metáfora espacial e afirma proximidade sem transformar essa proximidade em entrada ou posse.
- source_word: βασιλείας τοῦ θεοῦ
  choice: Reino de Deus
  rationale: É a formulação consagrada, clara e ampla em português, capaz de abranger tanto o governo quanto o domínio de Deus.
- source_word: οὐκέτι
  choice: mais
  rationale: Na construção negativa “ninguém mais”, transmite de modo idiomático que, a partir daquele momento, as perguntas cessaram.
- source_word: ἐτόλμα
  choice: ousava
  rationale: O imperfeito português reflete o aspecto do imperfeito grego e apresenta a ausência continuada de disposição para questioná-lo.
- source_word: ἐπερωτῆσαι
  choice: questioná-lo
  rationale: Indica dirigir perguntas a Jesus e preserva a possível força de pô-lo à prova no contexto, sem chegar ao sentido excessivo de interrogatório.
theological_decisions:
- issue: A posição do escriba em relação ao Reino e à salvação
  choice: “Você não está longe do Reino de Deus”
  alternative: “Você está perto do Reino de Deus”
  rationale: O grego afirma proximidade, mas não declara entrada, pertencimento ou posse. A formulação conserva a tensão entre o elogio ao discernimento do escriba e a ausência de uma declaração de que ele já esteja no Reino.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. “Você” oferece naturalidade ampla no Brasil; a colocação pronominal em “lhe disse” e “questioná-lo” mantém um tom literário moderado. O marcador da nota foi colocado junto à declaração a que efetivamente se refere.
