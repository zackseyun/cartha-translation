  text: καὶ πάλιν ἀπέστειλεν πρὸς αὐτοὺς ἄλλον δοῦλον· ⸀κἀκεῖνον ⸀ἐκεφαλίωσαν καὶ ⸀ἠτίμασαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/004.yaml
  text: And again he sent another servant to them[c][b][a], and they struck him on the head and dishonored him.
translation:
  language: pt
  text: E enviou-lhes novamente outro servo[a]; também feriram este na cabeça[b] e o desonraram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «outro escravo». A palavra grega pode significar «servo» ou «escravo», conforme o contexto.
    reason: alternative_reading
  - marker: b
    text: O verbo grego raro se refere à violência dirigida à cabeça; também pode ser traduzido por «atingiram-no na cabeça». Não significa aqui «decapitaram».
    reason: lexical_alternative
  - marker: c
    text: Ou «o trataram vergonhosamente».
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: novamente
  rationale: Expressa de modo natural a repetição da ação na sequência da parábola.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: O aoristo narra um acontecimento passado simples; «enviou» é claro e corrente.
- source_word: πρὸς αὐτοὺς
  choice: a eles
  rationale: Com verbo de envio, πρὸς com acusativo indica os destinatários.
- source_word: ἄλλον δοῦλον
  choice: outro servo
  rationale: δοῦλος pode designar servo ou escravo. «Servo» mantém a relação com o senhor e soa natural no contexto; a alternativa socialmente mais explícita consta em nota.
- source_word: κἀκεῖνον
  choice: também a esse
  rationale: Preserva a força cumulativa da crase καὶ ἐκεῖνον, ligando o tratamento deste segundo servo ao do anterior.
- source_word: ἐκεφαλίωσαν
  choice: feriram na cabeça
  rationale: O verbo raro indica violência dirigida à cabeça. A formulação conserva a referência anatômica sem sugerir decapitação e sem definir além da evidência o tipo exato de golpe.
- source_word: ἠτίμασαν
  choice: desonraram
  rationale: Reproduz de forma concisa a ideia de tratar alguém sem honra, com desprezo ou vergonha.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem narrativa natural. «Também a esse» preserva a continuidade enfática do grego; as notas mantêm visíveis as ambiguidades lexicais de δοῦλος, ἐκεφαλίωσαν e ἠτίμασαν.
