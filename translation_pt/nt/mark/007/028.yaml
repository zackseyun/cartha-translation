id: MRK.7.28
reference: Mark 7:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ δὲ ἀπεκρίθη καὶ λέγει αὐτῷ· ⸀Κύριε, ⸀καὶ τὰ κυνάρια ὑποκάτω τῆς τραπέζης ⸀ἐσθίουσιν ἀπὸ τῶν ψιχίων τῶν παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/028.yaml
  text: But she answered and said to him[a], “Lord[b], even the little dogs under the table eat from the children's crumbs.”
translation:
  language: pt
  text: 'Mas ela lhe respondeu: “Senhor[a], até os cachorrinhos[b] debaixo da mesa comem das migalhas das crianças.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “senhor”, como forma respeitosa de tratamento. O grego κύριε pode ser tanto um título quanto uma forma cortês de dirigir-se a alguém.
    reason: alternative_reading
  - marker: b
    text: O termo grego designa cães pequenos ou domésticos; “cachorrinhos” preserva a nuance diminutiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη καὶ λέγει αὐτῷ
  choice: ela lhe respondeu
  rationale: A combinação semítica de “respondeu e diz” introduz a fala. Em português narrativo atual, “lhe respondeu” comunica naturalmente tanto a resposta quanto o destinatário, sem reproduzir de modo artificial a mudança para o presente histórico.
- source_word: Κύριε
  choice: Senhor
  rationale: “Senhor” preserva o título e também pode funcionar como tratamento respeitoso; a possível acepção menos titular é registrada em nota.
- source_word: καὶ
  choice: até
  rationale: 'Neste contexto, καί tem força inclusiva/enfática: a mulher aceita a imagem e afirma que até os cachorrinhos recebem algo.'
- source_word: κυνάρια
  choice: cachorrinhos
  rationale: O diminutivo grego designa cães pequenos ou domésticos. “Cachorrinhos” conserva essa nuance sem impor especificamente a ideia de filhotes.
- source_word: ὑποκάτω τῆς τραπέζης
  choice: debaixo da mesa
  rationale: Expressão espacial direta, clara e idiomática em português.
- source_word: ἐσθίουσιν
  choice: comem
  rationale: O presente expressa uma ação habitual ou geral na ilustração; o presente simples português corresponde bem a esse valor.
- source_word: ἀπὸ τῶν ψιχίων
  choice: das migalhas
  rationale: “Migalhas” representa os pequenos pedaços de comida, e a contração “das” reproduz naturalmente a relação introduzida por ἀπό.
- source_word: τῶν παιδίων
  choice: das crianças
  rationale: O genitivo associa as migalhas às crianças sem acrescentar “comida”, termo não explícito no grego.
theological_decisions:
- issue: Sentido de κύριε no tratamento dirigido a Jesus
  choice: Senhor
  alternative: senhor, como simples tratamento respeitoso
  rationale: A tradução principal mantém “Senhor”, que preserva tanto a forma tradicional do título quanto a possibilidade de tratamento respeitoso. A nota reconhece a ambiguidade pragmática do contexto sem decidir que a mulher esteja fazendo uma confissão cristológica plena.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fala conserva a concisão e a perspicácia da resposta da mulher; “cachorrinhos” mantém a imagem doméstica e o diminutivo do original.
