  source_fidelity: O texto transmite com precisão μάτην (“em vão”), o contraste de δέ (“Mas”), σέβονταί με (“me adoram”) e a construção participial διδάσκοντες. “Ensinando como doutrinas mandamentos humanos” expressa adequadamente a crítica de que mandamentos de origem humana são apresentados com estatuto doutrinário. “Humanos” representa bem o genitivo ἀνθρώπων sem introduzir uma restrição masculina ausente do grego.
  naturalness: O português é moderno, claro e de registro apropriado para uma citação profética no discurso de Jesus. A ordem em “ensinando como doutrinas mandamentos humanos” é um pouco mais formal, mas é plenamente natural e ajuda a conservar a ênfase na qualificação indevida desses mandamentos como doutrinas.
  terminology: “Adoram”, “em vão”, “doutrinas” e “mandamentos” mantêm o peso religioso e crítico do original. “Mandamentos humanos” é uma escolha internacionalmente compreensível e adequada ao contraste contextual entre autoridade divina e origem humana.
