  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/007.yaml
  text: But they worship me in vain[a], teaching as doctrines the commandments of men.
translation:
  language: pt
  text: Mas eles me adoram em vão, ensinando como doutrinas mandamentos humanos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ensinando doutrinas que são mandamentos humanos”.'
    reason: A construção grega admite uma formulação em que “mandamentos humanos” explica o conteúdo das “doutrinas”, em vez de destacar explicitamente que são ensinados como doutrinas.
lexical_decisions:
- source_word: μάτην
  choice: em vão
  rationale: Expressa naturalmente a ideia de algo sem resultado ou propósito válido e preserva a força crítica da citação profética.
- source_word: δὲ
  choice: Mas
  rationale: 'Marca o contraste com a declaração anterior: embora honrem a Deus com os lábios, o culto que prestam é vazio.'
- source_word: σέβονταί
  choice: adoram
  rationale: O verbo denota reverência ou culto dirigido à divindade; “adoram” é claro e natural neste contexto.
- source_word: διδάσκοντες
  choice: ensinando
  rationale: Mantém o particípio presente e apresenta o ensino como característica ou modo desse culto vão.
- source_word: διδασκαλίας
  choice: como doutrinas
  rationale: Torna explícita, de maneira idiomática, a relação entre os ensinamentos e os mandamentos humanos, sem ir além do sentido possível do grego.
- source_word: ἐντάλματα ἀνθρώπων
  choice: mandamentos humanos
  rationale: Comunica tanto o caráter prescritivo de ἐντάλματα quanto a origem humana indicada pelo genitivo ἀνθρώπων, sem sugerir contraste entre os sexos.
theological_decisions:
- issue: Relação sintática entre “doutrinas/ensinamentos” e “mandamentos humanos”
  choice: ensinando como doutrinas mandamentos humanos
  alternative: ensinando doutrinas que são mandamentos humanos
  rationale: A formulação escolhida preserva a crítica de que preceitos de origem humana recebem o estatuto de doutrina, ao mesmo tempo que mantém a concisão e a tensão da expressão grega.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Mandamentos humanos” evita o uso genericamente masculino de “dos homens” e ressalta com naturalidade a origem humana em contraste com a autoridade divina.
