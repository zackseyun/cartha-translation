  text: ⸂καὶ ἔλεγεν⸃ αὐτῇ· Ἄφες πρῶτον χορτασθῆναι τὰ τέκνα, οὐ γὰρ ⸂καλόν ἐστιν⸃ λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ ⸂τοῖς κυναρίοις βαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/027.yaml
  text: And he was saying to her[a], “Let the children be fed first, for it is not good to take the children’s bread and throw it to the little dogs.”
translation:
  language: pt
  text: 'E ele lhe dizia: “Deixe primeiro que os filhos comam até ficarem satisfeitos, pois não é bom tirar o pão dos filhos e jogá-lo aos cachorrinhos[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cães de casa”, ou simplesmente “cães”. O grego emprega um termo diminutivo, que pode sugerir cães pequenos ou domésticos, em vez de enfatizar cães selvagens que vivem de restos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito expressa uma fala em curso; “dizia” preserva esse aspecto de modo natural em português.
- source_word: Ἄφες
  choice: Deixe
  rationale: O imperativo de ἀφίημι tem aqui o sentido idiomático de permitir que algo aconteça.
- source_word: πρῶτον
  choice: primeiro
  rationale: Mantém a prioridade temporal sem transformar essa prioridade em exclusão permanente.
- source_word: χορτασθῆναι
  choice: comam até ficarem satisfeitos
  rationale: Expressa de modo claro o sentido passivo de receber alimento até a saciedade e preserva a imagem da refeição.
- source_word: τὰ τέκνα
  choice: os filhos
  rationale: No quadro doméstico da comparação, “filhos” comunica a relação familiar com naturalidade, sem especificar sexo ou idade.
- source_word: καλόν ἐστιν
  choice: é bom
  rationale: Representa diretamente καλόν, que neste contexto abrange o que é bom, apropriado ou conveniente, sem restringir o sentido apenas à correção moral.
- source_word: λαβεῖν
  choice: tirar
  rationale: No contexto, o pão é retirado dos filhos para ser lançado a outros; “tirar” torna essa relação clara e natural.
- source_word: ἄρτον
  choice: pão
  rationale: Equivalente concreto que conserva intacta a imagem doméstica da fala.
- source_word: κυναρίοις
  choice: cachorrinhos
  rationale: Preserva o diminutivo grego e sugere cães pequenos ou domésticos, sem substituir a metáfora por sua interpretação.
- source_word: βαλεῖν
  choice: jogá-lo aos
  rationale: Mantém a vivacidade de βάλλω; o pronome retoma naturalmente “pão” em português.
theological_decisions:
- issue: Sentido metafórico de “filhos” e “cachorrinhos”
  choice: Manter a metáfora doméstica sem identificar seus referentes no texto principal.
  alternative: Explicitar “filhos” como Israel ou os judeus e “cachorrinhos” como os gentios.
  rationale: O grego apresenta uma imagem, não uma explicação de seus referentes. Preservá-la evita introduzir interpretação no texto traduzido.
- issue: Nuance de πρῶτον (“primeiro”)
  choice: Conservar “primeiro” no texto principal.
  alternative: Omitir a ideia de sequência para tornar a frase mais fluida.
  rationale: A palavra preserva a tensão narrativa e teológica entre prioridade inicial e possível acesso posterior, sem resolver essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ele lhe dizia” conserva o aspecto verbal sem soar artificial; “comam até ficarem satisfeitos” evita a possível conotação de excesso de “se fartem”. O marcador da nota foi colocado junto a “cachorrinhos”, termo ao qual a nota se refere.
