id: MRK.7.26
reference: Mark 7:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂ἡ δὲ γυνὴ ἦν⸃ Ἑλληνίς, Συροφοινίκισσα τῷ γένει· καὶ ἠρώτα αὐτὸν ἵνα τὸ δαιμόνιον ἐκβάλῃ ἐκ τῆς θυγατρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/026.yaml
  text: The woman was a Greek[a], a Syrophoenician by birth[b], and she kept asking him to cast the demon out of her daughter.
translation:
  language: pt
  text: A mulher era grega[a], siro-fenícia de nascimento[b], e continuava pedindo a ele que expulsasse o demônio de sua filha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “gentia”; o grego diz “grega”, termo que neste contexto provavelmente indica também que ela não era judia.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “siro-fenícia quanto à origem”; isto é, de ascendência siro-fenícia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑλληνίς
  choice: grega
  rationale: Traduz diretamente o termo feminino para “grega”. Neste contexto, a palavra também assinala que ela não era judia, mas essa implicação não substitui no texto principal a identificação lexical específica.
- source_word: Συροφοινίκισσα τῷ γένει
  choice: siro-fenícia de nascimento
  rationale: A expressão identifica sua origem étnica e geográfica. “De nascimento” comunica de modo natural o sentido de γένος como origem ou linhagem, sem recorrer à linguagem moderna potencialmente problemática de “raça”.
- source_word: ἠρώτα
  choice: continuava pedindo
  rationale: O imperfeito apresenta o pedido como contínuo ou repetido. “Continuava pedindo” preserva esse aspecto sem intensificar necessariamente o verbo para “implorava”.
- source_word: ἵνα ... ἐκβάλῃ
  choice: que expulsasse
  rationale: A construção introduz o conteúdo do pedido, e “expulsasse” expressa com clareza a ação de fazer o demônio sair.
- source_word: τὸ δαιμόνιον
  choice: o demônio
  rationale: É o equivalente direto de δαιμόνιον e mantém sem atenuação a afirmação sobrenatural do texto.
- source_word: ἐκ τῆς θυγατρὸς αὐτῆς
  choice: de sua filha
  rationale: Em português, com o verbo “expulsar”, a preposição “de” expressa naturalmente a procedência indicada por ἐκ.
- source_word: δὲ
  choice: sem equivalente explícito
  rationale: Aqui δέ funciona como transição narrativa leve. A fluidez da frase em português não exige um marcador como “ora” ou “mas”, que poderia acrescentar uma nuance temporal ou adversativa excessiva.
theological_decisions:
- issue: Identificação étnica da mulher
  choice: 'Mantêm-se os dois qualificativos: “grega” e “siro-fenícia de nascimento”.'
  alternative: “gentia, de origem siro-fenícia”
  rationale: O texto apresenta duas camadas de identidade, provavelmente cultural/religiosa e étnico-geográfica. Preservá-las evita reduzir “grega” apenas a “gentia” ou omitir a origem siro-fenícia.
- issue: Natureza da aflição da filha
  choice: “o demônio”
  alternative: “o espírito maligno”
  rationale: A tradução segue o substantivo explícito δαιμόνιον e não reformula nem suaviza a afirmação do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Siro-fenícia” conserva a designação histórica; “continuava pedindo” torna perceptível o aspecto durativo do imperfeito sem exagerar a emoção.
