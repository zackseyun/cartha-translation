  text: Καὶ συνάγονται πρὸς αὐτὸν οἱ Φαρισαῖοι καί τινες τῶν γραμματέων ἐλθόντες ἀπὸ Ἱεροσολύμων
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/001.yaml
  text: And the Pharisees and some of the scribes[a], who had come from Jerusalem, gather around him.
translation:
  language: pt
  text: E os fariseus e alguns dos escribas, vindos de Jerusalém, reúnem-se em torno dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Preserva a conexão narrativa característica de Marcos de modo natural em português.
- source_word: συνάγονται
  choice: reúnem-se
  rationale: O presente narrativo descreve o ajuntamento diante de Jesus; a forma pronominal é corrente e digna em português.
- source_word: πρὸς αὐτόν
  choice: em torno dele
  rationale: Em combinação com συνάγονται, expressa o movimento e o agrupamento em relação a Jesus; esta formulação é mais natural do que a tradução estritamente literal «até ele».
- source_word: οἱ Φαρισαῖοι
  choice: os fariseus
  rationale: Forma tradicional e amplamente reconhecida para o nome desse grupo judaico.
- source_word: τινες τῶν γραμματέων
  choice: alguns dos escribas
  rationale: Mantém o sentido partitivo do grego, indicando que se trata de parte dos escribas.
- source_word: γραμματέων
  choice: escribas
  rationale: Correspondência lexical direta e consagrada no contexto dos Evangelhos, sem ampliar interpretativamente sua função.
- source_word: ἐλθόντες
  choice: vindos
  rationale: O particípio indica que eles vieram de Jerusalém antes de se reunirem; a construção reduzida preserva essa relação de modo conciso e natural.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: de Jerusalém
  rationale: Expressa diretamente a procedência indicada pelo grego.
