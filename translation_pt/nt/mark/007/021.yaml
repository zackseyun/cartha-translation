  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔσωθεν γὰρ ἐκ τῆς καρδίας τῶν ἀνθρώπων οἱ διαλογισμοὶ οἱ κακοὶ ἐκπορεύονται, ⸂πορνεῖαι, κλοπαί, φόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/021.yaml
  text: 'For from within[a], out of the heart of men, evil thoughts come out: sexual immoralities, thefts, murders[b],'
translation:
  language: pt
  text: 'Pois é de dentro, do coração das pessoas, que saem os maus pensamentos: atos de imoralidade sexual[a], furtos e homicídios,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego está no plural e se refere de modo amplo a práticas sexuais ilícitas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσωθεν
  choice: de dentro
  rationale: Preserva a ideia de origem interior e o contraste do contexto entre o que vem de fora e o que procede do interior.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação que fundamenta a afirmação anterior, de modo conciso e natural em português.
- source_word: καρδίας
  choice: coração
  rationale: Mantém o termo antropológico bíblico para o centro interior do pensamento, da vontade e da vida moral, sem substituí-lo por uma interpretação.
- source_word: ἀνθρώπων
  choice: pessoas
  rationale: O plural grego é genérico e se refere aos seres humanos em geral; “pessoas” comunica isso com naturalidade e precisão no português atual.
- source_word: διαλογισμοὶ οἱ κακοὶ
  choice: os maus pensamentos
  rationale: Expressa reflexões e deliberações interiores moralmente más, preservando tanto o sentido mental quanto a qualificação ética.
- source_word: ἐκπορεύονται
  choice: saem
  rationale: Mantém a imagem concreta de algo que procede do interior, em linguagem corrente.
- source_word: πορνεῖαι
  choice: atos de imoralidade sexual
  rationale: O plural indica práticas sexuais ilícitas; a formulação preserva o caráter plural e a amplitude do termo sem restringi-lo a uma única categoria.
- source_word: κλοπαί
  choice: furtos
  rationale: Equivalente plural claro para atos de apropriação ilícita, adequado à lista de vícios.
- source_word: φόνοι
  choice: homicídios
  rationale: Comunica mortes humanas ilícitas e conserva o peso moral do termo na lista.
theological_decisions:
- issue: Sentido genérico de ἀνθρώπων
  choice: pessoas
  alternative: homens; seres humanos
  rationale: Embora a forma grega seja um genitivo plural gramaticalmente masculino, seu referente é a humanidade em geral. “Pessoas” evita sugerir indevidamente que a declaração se limita ao sexo masculino.
- issue: Amplitude e número de πορνεῖαι
  choice: atos de imoralidade sexual
  alternative: imoralidade sexual; prostituições; fornicações
  rationale: A expressão traduz o plural e mantém a referência ampla a práticas sexuais ilícitas, sem impor uma definição denominacional mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção enfática “é de dentro... que” realça a origem interior indicada pelo grego. A vírgula final preserva o fato de que a lista prossegue no versículo seguinte.
