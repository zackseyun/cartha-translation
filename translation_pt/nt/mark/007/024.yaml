id: MRK.7.24
reference: Mark 7:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂Ἐκεῖθεν δὲ⸃ ἀναστὰς ἀπῆλθεν εἰς τὰ ⸀ὅρια ⸀Τύρου. καὶ εἰσελθὼν εἰς οἰκίαν οὐδένα ἤθελεν γνῶναι, καὶ οὐκ ἠδυνήθη λαθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/024.yaml
  text: From there he got up and went away to the region of Tyre[a]. After entering a house, he wanted no one to know it[c][b], yet he could not remain hidden.
translation:
  language: pt
  text: Dali, ele se levantou e foi para a região de Tiro.[a] Entrou numa casa e não queria que ninguém soubesse que ele estava ali,[b] mas não conseguiu passar despercebido.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o território de Tiro”; o grego pode indicar o distrito ou a região fronteiriça associada a Tiro, e não somente a linha de fronteira.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não queria que ninguém soubesse”; o grego deixa implícito o objeto, provavelmente sua presença ou localização.
    reason: lexical_alternative
  - marker: c
    text: Ou “não conseguiu permanecer escondido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκεῖθεν δὲ
  choice: Dali
  rationale: Ἐκεῖθεν indica partida do lugar anterior; δέ funciona como conexão narrativa leve e pode ser absorvido naturalmente em português.
- source_word: ἀναστὰς
  choice: ele se levantou
  rationale: O particípio aoristo introduz a ação seguinte e conserva aqui o sentido concreto de levantar-se.
- source_word: ἀπῆλθεν
  choice: foi
  rationale: No contexto, o destino expresso por εἰς torna clara a ideia de deslocamento e partida; “foi” é natural e evita a possível ambiguidade de “foi embora”.
- source_word: εἰς τὰ ὅρια Τύρου
  choice: para a região de Tiro
  rationale: ὅρια pode designar limites, território ou região; no contexto geográfico, “região” comunica a área associada a Tiro sem restringi-la à linha de fronteira.
- source_word: καὶ εἰσελθὼν εἰς οἰκίαν
  choice: Entrou numa casa
  rationale: O particípio é sequencial, e οἰκίαν sem artigo aponta naturalmente para uma casa não especificada.
- source_word: οὐδένα ἤθελεν γνῶναι
  choice: não queria que ninguém soubesse que ele estava ali
  rationale: O grego deixa implícito o conteúdo de γνῶναι; a formulação explicita minimamente sua presença ou localização para produzir português natural.
- source_word: καὶ οὐκ ἠδυνήθη λαθεῖν
  choice: mas não conseguiu passar despercebido
  rationale: λανθάνω significa escapar à percepção ou não ser notado; “passar despercebido” preserva esse sentido idiomaticamente, e “mas” expressa o contraste com sua intenção.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem narrativa foi mantida, e os elementos implícitos no grego foram explicitados apenas quando necessários à fluência.
