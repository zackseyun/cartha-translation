  text: καὶ διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸀λέγωσιν· ὅσον δὲ ⸂αὐτοῖς διεστέλλετο, αὐτοὶ⸃ μᾶλλον περισσότερον ἐκήρυσσον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/036.yaml
  text: And he ordered them to tell no one. But the more he ordered them[a], the more abundantly they proclaimed it.
translation:
  language: pt
  text: E ordenou-lhes que não contassem a ninguém. Mas, quanto mais lhes ordenava, mais ainda eles o proclamavam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas, por mais que lhes ordenasse, mais ainda eles o proclamavam.”'
    reason: A construção grega pode ser expressa de forma concessiva; “mais ainda” representa a intensificação de μᾶλλον περισσότερον.
lexical_decisions:
- source_word: διεστείλατο
  choice: ordenou-lhes
  rationale: O verbo médio διαστέλλομαι comunica aqui uma ordem firme. “Ordenou” é natural, atual e preserva melhor essa força do que “instruiu”; “advertiu severamente” acrescentaria uma nuance não exigida.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: que não contassem a ninguém
  rationale: A oração expressa o conteúdo da ordem. “Contassem” é idiomático no contexto de divulgar o que havia acontecido, sem tornar explícito além do necessário o conteúdo implícito.
- source_word: ὅσον ... διεστέλλετο
  choice: quanto mais lhes ordenava
  rationale: 'A combinação de ὅσον com o imperfeito transmite uma relação progressiva e reiterada: à medida que ele continuava ordenando, aumentava a proclamação.'
- source_word: μᾶλλον περισσότερον
  choice: tanto mais amplamente
  rationale: Os dois advérbios reforçam o aumento. “Tanto mais amplamente” mantém a correlação com “quanto mais” e expressa a crescente extensão da divulgação.
- source_word: ἐκήρυσσον
  choice: eles o proclamavam
  rationale: κηρύσσω indica proclamar publicamente. “Proclamavam” conserva essa força melhor do que “anunciavam”; o pronome “o” retoma de modo natural o fato ocorrido, implícito no grego.
theological_decisions:
- issue: Segredo messiânico e força da ordem de Jesus
  choice: Apresentar a proibição como uma ordem real e firme, sem explicar seu motivo.
  alternative: Traduzir como “advertiu severamente” ou inserir uma explicação teológica para o silêncio.
  rationale: O texto mantém em tensão a ordem de Jesus e a divulgação crescente feita pelos presentes. A tradução não deve resolver essa tensão nem importar uma teoria sobre a razão da proibição.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A estrutura correlativa “quanto mais... tanto mais” preserva a progressão enfática do grego; “amplamente” evita o pouco natural “mais abundantemente” neste contexto.
