  text: ⸀ἀφέντες τὴν ἐντολὴν τοῦ θεοῦ κρατεῖτε τὴν παράδοσιν τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/008.yaml
  text: Leaving the commandment of God[a], you hold fast to the tradition of men.
translation:
  language: pt
  text: Vocês deixam de lado o mandamento de Deus e se apegam à tradição dos seres humanos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dos homens”; aqui, o termo grego se refere aos seres humanos em geral, em contraste com Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες
  choice: deixam de lado
  rationale: O particípio aoristo de ἀφίημι expressa aqui o ato de pôr de lado o mandamento. A forma verbal coordenada é natural em português e evita a ambiguidade temporal que “tendo deixado” poderia sugerir.
- source_word: ἐντολὴν τοῦ θεοῦ
  choice: o mandamento de Deus
  rationale: “Mandamento” preserva o sentido religioso e a autoridade divina expressos por ἐντολή; o genitivo indica que o mandamento procede de Deus ou lhe pertence.
- source_word: κρατεῖτε
  choice: se apegam a
  rationale: κρατέω indica adesão firme. “Apegar-se a” comunica essa tenacidade em português atual sem tornar a expressão excessivamente forte.
- source_word: παράδοσιν
  choice: tradição
  rationale: É o equivalente direto e natural de παράδοσις neste contexto, referindo-se ao que foi transmitido por seres humanos.
- source_word: ἀνθρώπων
  choice: dos seres humanos
  rationale: O plural genérico contrasta a origem humana da tradição com a origem divina do mandamento; não se refere apenas a pessoas do sexo masculino.
theological_decisions:
- issue: Contraste entre o mandamento divino e a tradição humana
  choice: Preservar a oposição explícita entre “o mandamento de Deus” e “a tradição dos seres humanos”.
  alternative: Empregar simplesmente “tradição humana”.
  rationale: A construção com dois genitivos mantém mais de perto o paralelismo e a força do contraste grego, sem transformar a declaração em condenação geral de toda tradição.
translation_notes:
  register: Português moderno, claro e digno, com sujeito explícito no plural para refletir κρατεῖτε. “Deixam de lado” e “se apegam” preservam a censura e o contraste do original em formulação natural para leitores brasileiros e amplamente lusófonos.
