  to: 'Mas vocês dizem: “Se alguém disser a seu pai ou a sua mãe: ‘Corbã’ — isto é, uma oferta — é tudo o que você poderia receber de mim como ajuda...”[a]'
  rationale: A revisão explicita em português a cópula implícita na fórmula grega («Corbã ... é tudo o que...»), preservando a estrutura condicional, o empréstimo semítico seguido da glosa de Marcos e o alcance não especificado da ajuda. As reticências e a nota indicam, sem criar conteúdo, que a consequência sintática vem em 7:12.
