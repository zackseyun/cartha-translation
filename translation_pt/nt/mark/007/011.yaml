  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ἐὰν εἴπῃ ἄνθρωπος τῷ πατρὶ ἢ τῇ μητρί· Κορβᾶν, ὅ ἐστιν Δῶρον, ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/011.yaml
  text: But you say[a], ‘If a man says to his father or his mother, “Corban” (that is, a gift)[b], whatever you might have benefited from me—’
translation:
  language: pt
  text: 'Mas vocês dizem: “Se alguém disser a seu pai ou a sua mãe: ‘Corbã’ — isto é, uma oferta — é tudo o que você poderia receber de mim como ajuda...”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Corbã” era um termo para algo declarado como oferta dedicada a Deus e, assim, não disponível para o uso comum, inclusive para ajudar a família. Ou: “uma dádiva”. A frase continua no versículo 12, que declara a consequência dessa prática.'
    reason: Explica o termo semítico, registra a alternativa lexical para Δῶρον e esclarece que a construção se completa no versículo seguinte.
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Mas vocês dizem
  rationale: δὲ estabelece contraste com o mandamento divino citado anteriormente; λέγετε, no presente, descreve a prática geral dos interlocutores.
- source_word: Ἐὰν εἴπῃ ἄνθρωπος
  choice: Se alguém disser
  rationale: ἐὰν com o subjuntivo aoristo introduz um caso eventual. “Alguém” comunica naturalmente o valor representativo de ἄνθρωπος sem sugerir que a regra se limite a homens.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: ao pai ou à mãe
  rationale: O dativo indica os destinatários; a formulação conserva os dois termos de parentesco e é idiomática em português.
- source_word: Κορβᾶν
  choice: Corbã
  rationale: Mantém o termo semítico preservado pelo próprio texto grego, em transliteração adequada ao português, deixando que a glosa de Marcos e a nota esclareçam seu sentido.
- source_word: ὅ ἐστιν Δῶρον
  choice: isto é, uma oferta
  rationale: δῶρον pode significar “presente”, “dádiva” ou “oferta”. Neste contexto de consagração religiosa, “oferta” comunica melhor o sentido sem eliminar a explicação fornecida pelo narrador.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: aquilo que você poderia receber de mim como ajuda
  rationale: A construção relativa com ἐὰν tem sentido indefinido, e ὠφεληθῇς significa ser ajudado ou beneficiado. A formulação explicita de modo natural que se trata da ajuda que o pai ou a mãe receberia, sem limitar indevidamente sua natureza.
theological_decisions:
- issue: Fórmula de consagração Κορβᾶν no contexto da tradição humana
  choice: Conservar “Corbã” no texto e explicá-lo por “isto é, uma oferta”, com nota sobre sua dedicação a Deus.
  alternative: Traduzir diretamente como “oferta” ou “dádiva dedicada a Deus”.
  rationale: O grego conserva deliberadamente o termo semítico e em seguida o traduz. Reproduzir essa estrutura mantém a especificidade histórica e religiosa sem acrescentar uma teoria posterior sobre o funcionamento do voto.
- issue: Natureza da ajuda negada aos pais
  choice: Usar a expressão abrangente “receber de mim como ajuda”.
  alternative: Especificar “sustento”, “dinheiro” ou “bens”.
  rationale: O verbo ὠφελέω permite ajuda ou benefício em sentido amplo. A tradução não restringe o dito a uma única forma de assistência.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural ὑμεῖς e “você” para o pai ou a mãe individualmente considerado. A ordem foi levemente ajustada para fluência, preservando o contraste, a fórmula condicional, o termo histórico e a suspensão sintática que conduz ao versículo seguinte.
