    rationale: A sequência «É Corbã — isto é, uma oferta — aquilo...» não estabelece em português que o que o progenitor receberia é declarado Corbã. O grego admite a cópula elíptica, mas a tradução portuguesa precisa de «é» após a glosa.
  - severity: low
    issue: Os destinatários podem ser explicitados como «seu pai» e «sua mãe».
    rationale: Embora «ao pai ou à mãe» seja possível, os possessivos tornam explícita a referência que está marcada em grego por ἐμοῦ no enunciado e é pressuposta pela formulação proverbial, sem alterar o sentido.
