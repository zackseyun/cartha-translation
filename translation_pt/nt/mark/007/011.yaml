  source_fidelity: 'A tradução preserva o contraste, a condição eventual, o termo semítico e o sentido amplo de ὠφεληθῇς. Contudo, a construção portuguesa atual não exprime claramente a relação predicativa elíptica: no grego, «Corban» é identificado com aquilo de que o pai ou a mãe poderia beneficiar-se; em português, é necessário explicitar «é».'
  naturalness: «É Corbã ... aquilo que...» soa truncado e não é uma formulação idiomática para a fórmula citada. «Corbã ... é tudo o que você poderia receber de mim como ajuda» é clara, natural e conserva a suspensão sintática que o versículo seguinte completa.
  terminology: «Corbã» é uma transliteração portuguesa adequada de Κορβᾶν. «Oferta» é aceitável para Δῶρον neste contexto, desde que a nota não apresente como certo mais do que o texto declara. «Ajuda» mantém apropriadamente a amplitude de ὠφεληθῇς.
