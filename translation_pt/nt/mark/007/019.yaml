  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι οὐκ εἰσπορεύεται αὐτοῦ εἰς τὴν καρδίαν ἀλλ’ εἰς τὴν κοιλίαν, καὶ εἰς τὸν ἀφεδρῶνα ἐκπορεύεται; —⸀καθαρίζων πάντα τὰ βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/019.yaml
  text: because it does not enter into his heart but into his stomach[a], and goes out into the latrine"—thus cleansing all foods.
translation:
  language: pt
  text: porque não entra no coração da pessoa, mas no estômago, e sai para a latrina” — purificando assim todos os alimentos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eliminando assim todos os alimentos”, entendendo a frase final como referência ao processo digestivo, e não como um comentário explicativo de Marcos.'
    reason: alternative_reading
lexical_decisions:
- source_word: καρδίαν
  choice: coração
  rationale: Preserva a imagem antropológica bíblica e o contraste entre o interior da pessoa e o aparelho digestivo, sem interpretar o termo como “mente” ou “íntimo”.
- source_word: κοιλίαν
  choice: estômago
  rationale: Expressa com naturalidade o sentido fisiológico exigido pelo contexto; “ventre” seria mais literal, mas menos preciso no português corrente.
- source_word: ἀφεδρῶνα
  choice: latrina
  rationale: Designa de modo concreto e digno o lugar de evacuação, sem sugerir necessariamente instalações sanitárias modernas.
- source_word: καθαρίζων
  choice: purificando assim
  rationale: Mantém a forma participial e a transparência lexical da expressão grega, evitando explicitar em excesso a interpretação narratorial como “declarando puros”.
- source_word: βρώματα
  choice: todos os alimentos
  rationale: Conserva o plural grego e se ajusta à discussão sobre diferentes alimentos e pureza.
- source_word: αὐτοῦ
  choice: da pessoa
  rationale: O pronome remete à pessoa de modo representativo; esta formulação é natural e evita o masculino genérico pouco necessário em português.
- source_word: εἰσπορεύεται / ἐκπορεύεται
  choice: entra / sai
  rationale: Preserva de maneira simples o contraste de movimento entre ingestão e eliminação.
theological_decisions:
- issue: Interpretação de καθαρίζων πάντα τὰ βρώματα
  choice: 'Inciso explicativo do narrador: “purificando assim todos os alimentos”'
  alternative: 'Sentido fisiológico: o processo digestivo “elimina/purga todos os alimentos”'
  rationale: O particípio masculino singular pode ser entendido como comentário de Marcos sobre a consequência do ensino de Jesus, mas a sintaxe permite relacioná-lo ao processo digestivo. A tradução principal mantém a formulação relativamente aberta, e a nota registra explicitamente a alternativa genuína sem eliminar a tensão teológica relativa às leis alimentares.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Da pessoa” evita ambiguidade referencial e funciona como singular representativo. A pontuação apresenta a oração final como inciso, mas a nota conserva a alternativa sintática e interpretativa.
