id: MRK.7.22
reference: Mark 7:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μοιχεῖαι⸃, πλεονεξίαι, πονηρίαι, δόλος, ἀσέλγεια, ὀφθαλμὸς πονηρός, βλασφημία, ὑπερηφανία, ἀφροσύνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/022.yaml
  text: adulteries[a], greed, wickedness, deceit, sensuality, an evil eye, slander, pride[b], foolishness.
translation:
  language: pt
  text: adultérios, ganância, maldades, engano, libertinagem, olho mau[a], difamação[b], arrogância e insensatez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “inveja” ou “olhar avarento”; literalmente, “olho mau”, expressão que indica uma atitude invejosa, mesquinha ou maliciosa.
    reason: lexical_alternative
  - marker: b
    text: Ou “blasfêmia”. O termo grego pode se referir tanto à fala difamatória contra pessoas quanto à fala blasfema contra Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχεῖαι
  choice: adultérios
  rationale: O plural preserva a forma grega e apresenta atos reiterados de adultério dentro da lista de vícios.
- source_word: πλεονεξίαι
  choice: ganância
  rationale: Expressa de modo natural o desejo ávido de possuir mais, inclusive com possível sentido material ou explorador; o singular coletivo é mais idiomático em português.
- source_word: πονηρίαι
  choice: maldades
  rationale: O plural português preserva o plural grego e abrange diversas manifestações de perversidade moral.
- source_word: δόλος
  choice: engano
  rationale: Termo atual e claro para a intenção de iludir ou agir fraudulentamente.
- source_word: ἀσέλγεια
  choice: libertinagem
  rationale: Comunica conduta desregrada e sem pudor, frequentemente de caráter sexual, sem recorrer a linguagem arcaica.
- source_word: ὀφθαλμὸς πονηρός
  choice: olho mau
  rationale: Mantém a metáfora semítica presente no grego; a nota esclarece seus sentidos idiomáticos de inveja, avareza ou disposição maliciosa.
- source_word: βλασφημία
  choice: difamação
  rationale: No contexto da lista, representa com clareza a fala injuriosa contra alguém, sem excluir por nota o sentido possível de blasfêmia contra Deus.
- source_word: ὑπερηφανία
  choice: arrogância
  rationale: Expressa diretamente a exaltação presunçosa de si mesmo e evita a possível ambiguidade positiva de “orgulho” no português moderno.
- source_word: ἀφροσύνη
  choice: insensatez
  rationale: Indica falta moral e prática de bom senso, e não mera limitação intelectual.
theological_decisions:
- issue: Amplitude semântica de βλασφημία na lista de vícios
  choice: difamação
  alternative: blasfêmia
  rationale: O termo pode designar fala injuriosa contra seres humanos ou fala irreverente contra Deus. “Difamação” se encaixa naturalmente entre vícios interpessoais, enquanto a nota conserva a alternativa teologicamente relevante.
- issue: Sentido idiomático de ὀφθαλμὸς πονηρός
  choice: olho mau
  alternative: inveja; olhar avarento ou malicioso
  rationale: A tradução principal preserva a imagem do texto, e a nota evita que ela seja entendida apenas como referência supersticiosa ao “mau-olhado”.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração concisa acompanha o formato do grego. Os marcadores foram colocados junto às expressões a que suas notas realmente se referem: “olho mau” e “difamação”.'
