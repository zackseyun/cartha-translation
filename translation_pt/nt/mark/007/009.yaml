  text: Καὶ ἔλεγεν αὐτοῖς· Καλῶς ἀθετεῖτε τὴν ἐντολὴν τοῦ θεοῦ, ἵνα τὴν παράδοσιν ὑμῶν ⸀τηρήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/009.yaml
  text: And he was saying to them[a], “You neatly set aside the commandment of God so that you may keep your tradition.”
translation:
  language: pt
  text: 'E continuava dizendo a eles: “Vocês sabem muito bem deixar de lado o mandamento de Deus para guardar a tradição de vocês!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês fazem muito bem em deixar de lado o mandamento de Deus a fim de guardar a tradição de vocês”. Aqui, a expressão grega é irônica, não uma aprovação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: continuava dizendo
  rationale: O imperfeito apresenta a fala como contínua ou reiterada; esta formulação preserva o aspecto e soa natural em português.
- source_word: Καλῶς
  choice: sabem muito bem
  rationale: O advérbio é irônico no contexto. A expressão comunica habilidade censurável sem soar como aprovação literal.
- source_word: ἀθετεῖτε
  choice: deixar de lado
  rationale: Expressa a rejeição deliberada do mandamento em linguagem corrente, preservando o contraste com guardar a tradição.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: o mandamento de Deus
  rationale: Mantém o peso religioso de ἐντολή e o contraste formal entre a autoridade divina e a tradição dos interlocutores.
- source_word: ἵνα
  choice: para
  rationale: Introduz de modo natural a finalidade pretendida, sem eliminar a relação de propósito do grego.
- source_word: τὴν παράδοσιν ὑμῶν
  choice: a tradição de vocês
  rationale: Traduz diretamente a tradição recebida e conserva a ênfase contrastiva do possessivo plural.
- source_word: τηρήσητε
  choice: guardar
  rationale: Verbo bíblico e ainda corrente para observar ou conservar, criando contraste claro com deixar de lado.
theological_decisions:
- issue: Tom da declaração de Jesus
  choice: 'Repreensão irônica: “Vocês sabem muito bem...”'
  alternative: 'Elogio literal: “Vocês fazem bem em deixar de lado...”'
  rationale: O contexto mostra que Jesus condena a substituição do mandamento divino pela tradição humana. A tradução sinaliza a ironia sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “A eles” evita marcar gênero ausente da forma pronominal grega; “de vocês” torna explícito o plural de ὑμῶν. A exclamação reforça a ironia já presente no contexto sem alterar o conteúdo proposicional.
