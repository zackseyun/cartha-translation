  text: πάντα ταῦτα τὰ πονηρὰ ἔσωθεν ἐκπορεύεται καὶ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/023.yaml
  text: All these evil things come out from within and defile the man[a].
translation:
  language: pt
  text: Todas essas coisas más vêm de dentro e tornam a pessoa impura[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o ser humano”. O grego emprega o singular de modo genérico, referindo-se a qualquer pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ταῦτα τὰ πονηρά
  choice: Todas essas coisas más
  rationale: A expressão enfática e abrangente retoma os males enumerados no contexto anterior. “Coisas más” conserva a concretude do plural substantivado e soa natural em português.
- source_word: ἔσωθεν
  choice: de dentro
  rationale: O advérbio indica origem interior e mantém o contraste do contexto entre o que vem de fora e o que procede do interior.
- source_word: ἐκπορεύεται
  choice: vêm
  rationale: Embora o verbo grego esteja no singular, concorda com um sujeito neutro plural segundo uso comum do grego. Em português, a concordância plural é exigida, e “vêm” expressa naturalmente o movimento desde uma fonte interior.
- source_word: κοινοῖ
  choice: tornam ... impura
  rationale: Neste contexto de pureza em Marcos, o verbo significa tornar impuro ou contaminar, não simplesmente tornar comum. A formulação explicita com clareza o resultado sobre a pessoa.
- source_word: τὸν ἄνθρωπον
  choice: a pessoa
  rationale: ἄνθρωπος é usado aqui de modo genérico para um ser humano. Em português contemporâneo, “a pessoa” comunica naturalmente essa referência inclusiva sem alterar o singular.
theological_decisions:
- issue: Sentido genérico de τὸν ἄνθρωπον na afirmação sobre a impureza humana
  choice: a pessoa
  alternative: o ser humano
  rationale: A declaração se aplica genericamente a qualquer pessoa. O português não precisa reproduzir o gênero gramatical masculino do grego para preservar esse sentido; “a pessoa” mantém o singular e evita sugerir uma referência exclusiva ao sexo masculino.
- issue: Relação entre κοινόω e a linguagem de pureza
  choice: tornam ... impura
  alternative: contaminam
  rationale: A escolha preserva a conexão com a discussão contextual sobre pureza e impureza, sem decidir indevidamente se a impureza deve ser entendida como apenas ritual ou apenas moral.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Coisas más” retoma concretamente a lista anterior; “tornam a pessoa impura” preserva a linguagem de pureza do contexto sem recorrer ao menos corrente “profanam”.
