  text: καὶ ἀπ’ ⸀ἀγορᾶς ἐὰν μὴ ⸀βαπτίσωνται οὐκ ἐσθίουσιν, καὶ ἄλλα πολλά ἐστιν ἃ παρέλαβον κρατεῖν, βαπτισμοὺς ποτηρίων καὶ ξεστῶν καὶ χαλκίων ⸂καὶ κλινῶν⸃—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/004.yaml
  text: 'And when they come from the marketplace[a], they do not eat unless they wash themselves[b], and there are many other things that they have received to keep: washings of cups and pitchers and copper vessels and dining couches—'
translation:
  language: pt
  text: 'E, quando voltam do mercado, não comem sem se lavar[a]. Há muitas outras coisas que receberam para observar: lavagens de copos, jarros, recipientes de cobre e leitos usados nas refeições[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a menos que se imerjam”. O grego emprega uma forma do verbo muitas vezes traduzido por “batizar”, mas aqui se refere à lavagem ritual no contexto dos costumes de pureza.'
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos omitem “e leitos usados nas refeições”.
    reason: textual_variant
lexical_decisions:
- source_word: ἀγορᾶς
  choice: praça
  rationale: No contexto antigo, ἀγορά designa a praça pública onde funcionava o mercado. “Praça” é natural em português e conserva a referência ao espaço público, sem restringi-la apenas ao ato de comprar e vender.
- source_word: βαπτίσωνται
  choice: se lavar
  rationale: A forma verbal média, neste contexto de pureza ritual antes da refeição, refere-se a lavar a si mesmos. A tradução evita associações indevidas com o batismo cristão, enquanto a nota preserva a possibilidade lexical de imersão.
- source_word: παρέλαβον κρατεῖν
  choice: receberam para observar
  rationale: A expressão indica práticas tradicionais que foram recebidas e continuam sendo mantidas. “Observar” comunica naturalmente o cumprimento de costumes ou preceitos.
- source_word: βαπτισμοὺς
  choice: lavagens
  rationale: Aqui o substantivo descreve lavagens rituais de utensílios e objetos; “lavagens” mantém o sentido concreto sem impor que todas fossem feitas por imersão.
- source_word: ξεστῶν
  choice: jarros
  rationale: ξέστης é um recipiente semelhante a uma jarra ou jarro. “Jarros” é uma equivalência clara e corrente, sem especificar excessivamente forma ou material.
- source_word: χαλκίων
  choice: recipientes de cobre
  rationale: O termo designa objetos ou utensílios feitos de cobre ou liga de cobre. “Recipientes de cobre” é claro e adequado à lista de objetos lavados.
- source_word: κλινῶν
  choice: leitos usados nas refeições
  rationale: κλίνη pode ser cama, leito ou divã. No contexto das refeições reclinadas, a formulação explicita a função provável sem substituir o objeto por “mesas”.
- source_word: ἄλλα πολλά
  choice: muitas outras coisas
  rationale: A expressão grega é deliberadamente ampla. A tradução conserva essa generalidade, em vez de restringi-la a “tradições” ou “práticas”.
theological_decisions:
- issue: Sentido de βαπτίσωνται e βαπτισμοὺς no contexto de pureza ritual
  choice: Traduzir por “se lavar” e “lavagens”.
  alternative: “imergir-se” e “imersões”; ou “batizar-se” e “batismos”.
  rationale: O contexto trata de costumes judaicos de pureza, não do batismo cristão. “Lavar” comunica o sentido contextual sem introduzir associações sacramentais; a nota registra que o verbo também pode indicar imersão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Praça” reflete a ágora antiga como espaço público de mercado; “leitos usados nas refeições” esclarece um costume cultural sem transformar κλίνη em “mesa”. O travessão final preserva a continuidade sintática do contexto.
