id: MRK.7.15
reference: Mark 7:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐδέν ἐστιν ἔξωθεν τοῦ ἀνθρώπου εἰσπορευόμενον εἰς αὐτὸν ὃ δύναται ⸂κοινῶσαι αὐτόν⸃· ἀλλὰ τὰ ⸂ἐκ τοῦ ἀνθρώπου ἐκπορευόμενά⸃ ἐστιν τὰ κοινοῦντα τὸν ⸀ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/015.yaml
  text: There is nothing outside a man that by going into him is able to defile him; rather, the things that come out from the man are what defile the man.
translation:
  language: pt
  text: Não há nada fora da pessoa que, entrando nela, possa torná-la impura[a]; pelo contrário, as coisas que saem da pessoa são as que a tornam impura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contaminá-la”. O verbo grego pode indicar tornar alguém impuro no sentido de pureza religiosa e também assumir uma força moral no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέν
  choice: nada
  rationale: O neutro singular indefinido é usado de modo absoluto; “nada” é o equivalente português mais natural e preciso.
- source_word: ἔξωθεν τοῦ ἀνθρώπου
  choice: fora da pessoa
  rationale: Preserva a ideia de origem ou posição externa e prepara o contraste deliberado com aquilo que sai da pessoa.
- source_word: τοῦ ἀνθρώπου / τὸν ἄνθρωπον
  choice: da pessoa / a pessoa
  rationale: Ἄνθρωπος tem aqui sentido genérico de ser humano. Em português atual, “pessoa” comunica naturalmente esse valor sem restringi-lo ao sexo masculino e mantém o singular representativo.
- source_word: εἰσπορευόμενον εἰς αὐτόν
  choice: entrando nela
  rationale: Reproduz de modo conciso a força do particípio e concorda naturalmente com “pessoa” em português.
- source_word: δύναται
  choice: possa
  rationale: O subjuntivo após a construção relativa comunica adequadamente a capacidade expressa por δύναται, sem tornar a frase pesada.
- source_word: κοινῶσαι / κοινοῦντα
  choice: torná-la impura / a tornam impura
  rationale: No contexto da controvérsia sobre pureza, κοινόω significa tornar alguém impuro. A formulação preserva diretamente a dimensão de pureza e admite, no contexto mais amplo, implicações morais.
- source_word: ἀλλὰ
  choice: pelo contrário
  rationale: Expressa com clareza o forte contraste corretivo da declaração.
- source_word: τὰ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενα
  choice: as coisas que saem da pessoa
  rationale: Mantém o plural substantivado do grego e o contraste espacial entre o que está fora e o que sai do ser humano.
theological_decisions:
- issue: Sentido de κοινόω em uma controvérsia sobre pureza
  choice: tornar impura
  alternative: contaminar
  rationale: “Tornar impura” explicita o sentido ligado à pureza sem limitá-lo necessariamente a uma categoria apenas ritual. “Contaminar” seria mais compacto, mas pode sugerir sobretudo sujeira física ou transmissão de agentes nocivos.
- issue: Valor genérico de ἄνθρωπος
  choice: pessoa
  alternative: homem / ser humano
  rationale: O termo se refere genericamente a qualquer ser humano. “Pessoa” é natural, claro e singular em português moderno; não acrescenta uma distinção sexual ausente do referente contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura conserva o contraste entre o que vem de fora e o que sai da pessoa, evitando literalismo pouco natural.
