  source_fidelity: O texto reproduz com precisão a oposição do grego entre o que está fora da pessoa e entra nela e o que sai da pessoa. «Nada», «possa», «pelo contrário» e a construção plural «as coisas que saem» refletem adequadamente a sintaxe e o contraste de οὐδέν, δύναται, ἀλλά e τὰ ... ἐκπορευόμενα. «Torná-la impura» comunica bem κοινόω no campo semântico de pureza, sem impor uma leitura doutrinária estreita.
  naturalness: A redação é clara, fluente e apropriada ao português moderno de ampla compreensão, inclusive no Brasil. A concordância feminina em «pessoa», «nela» e «tornam impura» é natural e consistente. A repetição de «pessoa» preserva a ênfase e o paralelismo do original.
  terminology: «Pessoa» expressa legitimamente o valor humano genérico de ἄνθρωπος em português contemporâneo. «Tornar impura» é uma escolha terminológica segura no contexto de pureza; a nota oferece «contaminar» como alternativa e explica de modo suficiente a amplitude contextual do verbo.
