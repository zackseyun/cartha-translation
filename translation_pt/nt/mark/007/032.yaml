  text: καὶ φέρουσιν αὐτῷ κωφὸν ⸀καὶ ⸀μογιλάλον, καὶ παρακαλοῦσιν αὐτὸν ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/032.yaml
  text: And they brought to him a man who was deaf and had difficulty speaking[a], and they begged him to lay his hand on him.
translation:
  language: pt
  text: E levaram a Jesus um homem surdo e que tinha dificuldade para falar[a], e lhe suplicaram que pusesse a mão sobre ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «um homem surdo e com dificuldade para falar».
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: levaram
  rationale: O presente histórico é frequente em Marcos; o pretérito perfeito soa natural na narrativa em português e preserva a sequência do acontecimento.
- source_word: αὐτῷ
  choice: a Jesus
  rationale: O pronome se refere a Jesus. Explicitar o referente evita a possível ambiguidade de «lhe» ou «a ele» em português.
- source_word: κωφόν
  choice: um homem surdo
  rationale: κωφός aqui indica surdez; a deficiência de fala é descrita separadamente por μογιλάλον, portanto não se deve traduzir como «surdo-mudo».
- source_word: μογιλάλον
  choice: que tinha dificuldade para falar
  rationale: O adjetivo raro indica fala difícil ou impedida, não necessariamente incapacidade total de falar. A formulação é clara e atual.
- source_word: παρακαλοῦσιν
  choice: lhe suplicaram
  rationale: No contexto, o verbo expressa um pedido insistente e urgente, mais forte que um simples «pediram».
- source_word: ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα
  choice: que pusesse a mão sobre ele
  rationale: A oração expressa o conteúdo do pedido. O singular «a mão» acompanha τὴν χεῖρα e preserva o gesto de cura descrito no texto.
theological_decisions:
- issue: Natureza da deficiência do homem
  choice: Ele é descrito como surdo e com dificuldade para falar, não como totalmente mudo.
  alternative: «surdo-mudo» ou «surdo e mudo»
  rationale: Os termos distintos κωφός e μογιλάλος apontam para surdez acompanhada de fala difícil. Traduzir μογιλάλος por «mudo» afirmaria mais do que o grego e apagaria essa distinção.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Suplicaram» conserva a intensidade do pedido sem soar excessivamente arcaico; «pusesse a mão sobre ele» mantém a construção singular e o gesto do original.
