  text: Μωϋσῆς γὰρ εἶπεν· Τίμα τὸν πατέρα σου καὶ τὴν μητέρα σου, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/010.yaml
  text: For Moses said[a], ‘Honor your father and your mother,’ and[b], ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: pt
  text: 'Pois Moisés disse: “Honre seu pai e sua mãe” e: “Quem falar mal[a] do pai ou da mãe certamente morrerá[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem amaldiçoar o pai ou a mãe”. O verbo também pode significar insultar, difamar ou amaldiçoar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “deverá ser morto”. O grego emprega uma fórmula jurídica que, literalmente, diz: “morra de morte”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa do conectivo no argumento de Jesus e soa natural em português.
- source_word: εἶπεν
  choice: disse
  rationale: Verbo de elocução simples e natural para introduzir as citações.
- source_word: Τίμα
  choice: Honre
  rationale: O imperativo preserva o peso ético e a formulação reconhecível do mandamento.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα σου
  choice: seu pai e sua mãe
  rationale: Reproduz explicitamente os dois objetos e emprega uma formulação clara no português moderno.
- source_word: Ὁ κακολογῶν
  choice: Quem falar mal de
  rationale: Expressa o valor genérico do particípio substantivado e conserva a amplitude lexical de κακολογέω sem restringi-lo apenas a uma maldição formal.
- source_word: πατέρα ἢ μητέρα
  choice: pai ou mãe
  rationale: Preserva a alternativa coordenada do grego, que não traz pronome possessivo explícito nesta oração.
- source_word: θανάτῳ τελευτάτω
  choice: certamente morrerá
  rationale: Comunica a força solene e obrigatória da fórmula jurídica de origem semítica em português natural, sem explicitar além do texto o agente da morte.
theological_decisions:
- issue: Formulação da pena legal θανάτῳ τελευτάτω
  choice: certamente morrerá
  alternative: deverá ser morto
  rationale: A opção escolhida preserva mais diretamente a forma da expressão grega e sua força jurídica enfática. A alternativa explicita legitimamente a execução da pena, mas introduz uma construção passiva e um agente implícito que não aparecem de modo formal na frase grega.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. As citações mantêm tom solene sem recorrer a linguagem arcaica. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem.
