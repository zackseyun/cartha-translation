  text: If anyone has ears to hear, let him hear.
translation:
  language: pt
  text: Se alguém tem ouvidos para ouvir, ouça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo não aparece nos manuscritos gregos mais antigos, entre eles o Sinaítico e o Vaticano, do século 4, nem nas antigas versões coptas. Está, porém, presente na tradição majoritária bizantina, na tradição latina e na maioria dos testemunhos siríacos. É provável que seja um acréscimo posterior de um copista, repetindo a mesma frase encontrada em Marcos 4:9 e 4:23.
    reason: textual_critical
lexical_decisions:
- source_word: ὦτα
  choice: ouvidos
  rationale: Mantém a imagem concreta do órgão da audição, usada aqui como apelo à receptividade e à compreensão.
- source_word: ἀκουέτω
  choice: ouça
  rationale: O imperativo presente ativo na terceira pessoa do singular é expresso de modo natural e direto em português, preservando a força da exortação.
