  text: καὶ ἀναβλέψας εἰς τὸν οὐρανὸν ἐστέναξεν, καὶ λέγει αὐτῷ· Εφφαθα, ὅ ἐστιν Διανοίχθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/034.yaml
  text: And looking up to heaven[a], he sighed and said to him, “Ephphatha,” that is[b], “Be opened.”
translation:
  language: pt
  text: 'E, olhando para o céu, suspirou[b] e lhe disse: “Efatá”[a], isto é: “Abra-se”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Aramaico: “Efatá” significa “Abra-se”.'
    reason: cultural_note
  - marker: b
    text: Ou “gemeu”; o verbo pode expressar um suspiro profundo ou um gemido.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβλέψας
  choice: olhando para o céu
  rationale: O particípio aoristo descreve o gesto que acompanha e antecede a fala. Em português, “olhando para o céu” expressa naturalmente a elevação do olhar.
- source_word: εἰς τὸν οὐρανόν
  choice: para o céu
  rationale: Neste contexto, “céu” preserva tanto a referência espacial quanto a possível dimensão de um gesto voltado a Deus, sem explicitar além do texto.
- source_word: ἐστέναξεν
  choice: suspirou
  rationale: στενάζω pode indicar suspirar ou gemer. “Suspirou” é natural e não determina em excesso a intensidade emocional; a alternativa é registrada em nota.
- source_word: λέγει αὐτῷ
  choice: lhe disse
  rationale: O presente histórico grego é vertido pelo passado, corrente na narrativa portuguesa. O pronome mantém a referência pessoal do dativo αὐτῷ.
- source_word: Εφφαθα
  choice: Efatá
  rationale: A palavra aramaica preservada por Marcos é transliterada na forma tradicional e legível em português, mantendo a textura linguística do relato.
- source_word: Διανοίχθητι
  choice: Abra-se
  rationale: O imperativo passivo aoristo singular é expresso naturalmente por “Abra-se”, preservando tanto o comando quanto a forma passiva/reflexiva idiomática em português.
theological_decisions:
- issue: Referente de αὐτῷ
  choice: lhe disse, referindo-se ao homem surdo
  alternative: Entender a ordem como dirigida indiretamente aos ouvidos e à capacidade de falar do homem
  rationale: O dativo grego refere-se mais naturalmente ao homem. A tradução mantém a pessoa interpelada sem explicitar qual faculdade deve abrir-se, preservando a concisão e a tensão do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem da frase acompanha o fluxo narrativo grego sem rigidez; a palavra aramaica e a explicação de Marcos são preservadas.
