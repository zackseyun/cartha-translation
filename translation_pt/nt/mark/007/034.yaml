  naturalness: «E, olhando para o céu, suspirou e lhe disse» é natural em português moderno e mantém o encadeamento narrativo. «Abra-se» é uma forma idiomática e adequada para o imperativo passivo singular da explicação grega.
  terminology: «Efatá» é uma transliteração portuguesa tradicional e reconhecível. «Céu», «suspirou» e «Abra-se» são escolhas sóbrias e semanticamente apropriadas.
