review_pass:
  verdict: revise
  source_fidelity: A tradução capta a observação, o grupo parcial dos discípulos, a ação em curso e a explicação parentética de Marcos. Contudo, “profanadas” tende a significar ‘dessacralizadas’ ou ‘violadas’, o que é mais forte e menos preciso do que o sentido de impureza ritual de κοιναῖς neste contexto. A glosa “sem lavar” também fica elíptica demais, pois o grego especifica mãos não lavadas.
  naturalness: A redação é em geral fluente e adequada ao português moderno. “Com mãos impuras, isto é, não lavadas” é natural, claro e conserva a relação explicativa presente no texto.
  terminology: “Impuras” comunica adequadamente a categoria ritual sem sugerir dano ou profanação ativa. A nota preserva o valor literal de κοινός (“comuns”) e esclarece que se trata de impureza ritual, não de sujeira física.
  issues:
  - severity: medium
    issue: “mãos profanadas” para κοιναῖς χερσίν
    rationale: “Profanadas” em português normalmente sugere que algo sagrado foi violado ou dessacralizado. No contexto, κοινός designa mãos ritualmente impuras/comuns, sem afirmar que tenham sido profanadas.
  - severity: low
    issue: “isto é, sem lavar”
    rationale: A expressão deixa implícito o referente e pode soar incompleta. “Isto é, não lavadas” retoma naturalmente “mãos” e traduz com maior clareza ἀνίπτοις.
  - severity: low
    issue: Posição da nota lexical
    rationale: A nota explica κοιναῖς, não a glosa ἀνίπτοις; por isso, o marcador deve acompanhar “impuras”.
