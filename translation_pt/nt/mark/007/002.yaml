source:
  edition: SBLGNT
  text: καὶ ἰδόντες τινὰς τῶν μαθητῶν αὐτοῦ ⸂ὅτι κοιναῖς χερσίν, τοῦτ’ ἔστιν ἀνίπτοις, ἐσθίουσιν⸃ ⸀τοὺς ⸀ἄρτους—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/002.yaml
  text: and they saw that some of his disciples were eating the bread with defiled hands—that is[a], unwashed hands—
translation:
  language: pt
  text: e viram que alguns dos discípulos dele comiam o pão com mãos impuras[a], isto é, não lavadas—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “com mãos comuns”; isto é, consideradas ritualmente impuras, e não simplesmente sujas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: viram
  rationale: O particípio aoristo tem como sujeito implícito os fariseus e alguns escribas do versículo anterior. A forma finita é natural em português e preserva o caráter de observação.
- source_word: τινὰς τῶν μαθητῶν αὐτοῦ
  choice: alguns dos discípulos dele
  rationale: τινάς com genitivo partitivo significa naturalmente “alguns dos discípulos”. “Dele” mantém clara a referência a Jesus sem sugerir que os discípulos pertenciam ao grupo observador.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo do que eles viram, não a causa.
- source_word: κοιναῖς χερσίν
  choice: com as mãos profanadas
  rationale: No contexto judaico de pureza, κοινός indica aquilo que foi tornado comum ou ritualmente impróprio. “Profanadas” comunica esse sentido melhor que o literal e pouco natural “comuns”, sem reduzi-lo a mera sujeira física.
- source_word: τοῦτ’ ἔστιν ἀνίπτοις
  choice: isto é, sem lavar
  rationale: Reproduz a explicação dada pelo próprio narrador. Como “as mãos” já aparece imediatamente antes, a elipse é clara e natural em português.
- source_word: ἐσθίουσιν
  choice: comiam
  rationale: O imperfeito português expressa naturalmente a ação em andamento observada na narrativa.
- source_word: τοὺς ἄρτους
  choice: o pão
  rationale: Embora a forma grega seja plural, “o pão” é a expressão idiomática em português para o alimento consumido neste contexto.
theological_decisions:
- issue: Nuance de pureza em κοινός
  choice: “profanadas” no texto, com nota explicativa
  alternative: “comuns”, “impuras” ou “contaminadas”
  rationale: A passagem trata de impureza ritual, e não apenas de higiene. “Profanadas” conserva o contraste entre o comum e o sagrado implicado por κοινός; a nota explicita a literalidade e evita que o leitor entenda apenas sujeira física.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A oração permanece aberta com travessão porque o período continua nos versículos seguintes.
