  naturalness: O texto é claro e de bom registro, mas “a amarra de sua língua se soltou” soa algo rígido e pode sugerir que a amarra se desprendeu por si mesma. “A amarra que prendia sua língua foi solta” é natural, conserva a metáfora e deixa claro o agente passivo sem especificá-lo.
  terminology: “Ouvidos” é apropriado para αἱ ἀκοαί neste contexto. A imagem de δεσμός deve ser mantida sem convertê-la no texto em diagnóstico clínico; “amarra” é aceitável quando explicitada pela oração relativa. “Corretamente” representa ὀρθῶς com maior precisão, enquanto as demais possibilidades podem constar da nota.
