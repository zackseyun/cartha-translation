  text: ⸀καὶ ⸀ἠνοίγησαν αὐτοῦ αἱ ἀκοαί, καὶ ἐλύθη ὁ δεσμὸς τῆς γλώσσης αὐτοῦ, καὶ ἐλάλει ὀρθῶς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/035.yaml
  text: And his ears were opened[a], and the bond of his tongue was released[c][b], and he spoke plainly.
translation:
  language: pt
  text: E seus ouvidos foram abertos, e a amarra que prendia sua língua foi solta, e ele falava corretamente[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ele falava claramente”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ele falava distintamente”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “a amarra de sua língua foi solta”; isto é, o impedimento que restringia sua fala foi removido. Quanto a “ouvidos”, o grego também pode se referir à capacidade de ouvir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνοίγησαν
  choice: se abriram
  rationale: O aoristo passivo plural de ἀνοίγω descreve a abertura súbita dos ouvidos. Em português, a construção pronominal é natural e preserva o sentido passivo sem tornar a frase pesada.
- source_word: αἱ ἀκοαί
  choice: seus ouvidos
  rationale: O plural ἀκοαί pode indicar tanto os ouvidos quanto a faculdade auditiva. No relato concreto de cura, “seus ouvidos” é claro e idiomático, enquanto a alternativa é registrada em nota.
- source_word: ἐλύθη
  choice: se soltou
  rationale: O aoristo passivo de λύω indica que aquilo que prendia a língua foi desfeito ou solto. A formulação portuguesa comunica a remoção imediata da restrição.
- source_word: ὁ δεσμὸς τῆς γλώσσης αὐτοῦ
  choice: a amarra de sua língua
  rationale: δεσμός designa uma amarra, vínculo ou prisão. “A amarra de sua língua” conserva a imagem concreta do grego em vez de substituí-la diretamente pela explicação clínica “impedimento da fala”.
- source_word: ἐλάλει
  choice: ele falava
  rationale: O imperfeito de λαλέω retrata o exercício da capacidade restaurada. “Falava” preserva melhor esse aspecto do que “falou” e não acrescenta explicitamente a ideia de começo.
- source_word: ὀρθῶς
  choice: claramente
  rationale: No contexto da restauração da fala, ὀρθῶς indica fala correta, normal e inteligível. “Claramente” comunica esse resultado de modo natural, sem sugerir apenas correção moral ou gramatical.
theological_decisions:
- issue: Se a descrição da cura da fala deve ser literal-metafórica ou explicativa
  choice: Conservar no texto a metáfora “a amarra de sua língua se soltou”
  alternative: “seu impedimento da fala desapareceu” ou “sua língua ficou livre”
  rationale: O texto descreve uma cura milagrosa por meio da imagem concreta de uma amarra sendo solta, não por um termo clínico. Preservar essa imagem evita explicar além do que o grego afirma, e a nota esclarece seu sentido no contexto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação simples acompanha o ritmo narrativo grego. A metáfora da língua presa foi mantida, mas expressa com “amarra”, termo corrente e compreensível; as notas preservam as alternativas lexicais genuínas.
