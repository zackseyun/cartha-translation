- from: E seus ouvidos se abriram[a], a amarra de sua língua se soltou[b], e ele falava claramente[c].
  to: E seus ouvidos foram abertos, e a amarra que prendia sua língua foi solta, e ele falava corretamente[a][b][c].
  rationale: 'A revisão torna explícita a voz passiva dos dois verbos de cura, mantém a metáfora concreta de δεσμός sem introduzir terminologia clínica no texto principal e traduz ὀρθῶς por “corretamente”, seu valor mais direto. As alternativas contextualmente possíveis e a nuance de ἀκοαί são mantidas em notas. Os marcadores foram reorganizados para que cada nota esteja ancorada no elemento pertinente: a, b e c em “corretamente”, onde tratam das alternativas de ὀρθῶς e da explicação lexical complementar.'
