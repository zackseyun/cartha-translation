base_translation:
  language: en
  yaml_path: translation/nt/mark/007/020.yaml
  text: And he was saying, “What comes out from the man—that defiles the man.”
translation:
  language: pt
  text: 'E ele dizia: “O que sai da pessoa, isso é o que a torna impura.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “isso é o que a contamina”. O verbo grego pertence à linguagem de pureza e indica tornar alguém impuro ou contaminado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ele dizia
  rationale: O imperfeito apresenta a fala em andamento ou como continuação da explicação; “dizia” preserva esse aspecto com naturalidade em português.
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ é um conectivo narrativo leve; “E” mantém a continuidade sem introduzir um contraste forte.
- source_word: ὅτι
  choice: introdução por dois-pontos e discurso direto
  rationale: Depois de um verbo de fala, o português natural introduz o conteúdo diretamente, sem traduzir ὅτι por “que”.
- source_word: Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον
  choice: O que sai da pessoa
  rationale: A construção participial substantivada é expressa de modo idiomático por “o que sai”. Neste contexto, ἄνθρωπος tem sentido humano genérico, para o qual “pessoa” é claro e natural.
- source_word: ἐκεῖνο
  choice: isso é o que
  rationale: 'A formulação conserva a ênfase demonstrativa: aquilo que sai é precisamente o agente da impureza.'
- source_word: κοινοῖ
  choice: a torna impura
  rationale: No contexto, κοινόω pertence à linguagem de pureza e significa tornar alguém impuro ou contaminado, não literalmente “tornar comum”. “Torna impura” explicita essa categoria e mantém a construção causativa.
theological_decisions:
- issue: Linguagem de pureza em κοινόω
  choice: torna impura
  alternative: contamina
  rationale: “Torna impura” preserva de modo explícito a categoria de pureza presente no contexto judaico; “contamina” é mais conciso, mas pode soar apenas moral ou físico e deixar menos evidente essa linguagem.
- issue: Sentido genérico de ἄνθρωπος
  choice: pessoa
  alternative: homem
  rationale: O referente é qualquer ser humano, não especificamente um indivíduo masculino. “Pessoa” comunica esse valor genérico em português atual sem alterar o alcance da afirmação.
translation_notes:
  register: Português moderno, claro e digno, com fluidez brasileira e compreensão internacional. A repetição retórica do grego é parcialmente preservada por “isso é o que”, enquanto o pronome “a” evita uma repetição pesada de “a pessoa”.
