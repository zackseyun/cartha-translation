  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν ⸀αὐτοῖς· Καλῶς ἐπροφήτευσεν Ἠσαΐας περὶ ὑμῶν τῶν ὑποκριτῶν, ὡς γέγραπται ⸀ὅτι Οὗτος ὁ λαὸς τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/006.yaml
  text: 'But he said to them[a], “Isaiah prophesied well about you hypocrites, as it is written: ‘This people honors me with their lips, but their heart is far from me.’”'
translation:
  language: pt
  text: 'Mas ele lhes disse: “Isaías profetizou muito bem a respeito de vocês, hipócritas, como está escrito: ‘Este povo me honra com os lábios, mas seu coração está longe de mim.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição com leve contraste em relação à fala anterior e introduz a resposta de Jesus de modo natural.
- source_word: εἶπεν αὐτοῖς
  choice: ele lhes disse
  rationale: Reproduz de maneira corrente e relativamente formal o verbo de fala com objeto indireto.
- source_word: Καλῶς
  choice: muito bem
  rationale: Conserva a avaliação positiva do advérbio e soa idiomático em português; não restringe o sentido a mera exatidão.
- source_word: ἐπροφήτευσεν
  choice: profetizou
  rationale: É o equivalente direto e habitual, mantendo clara a função profética da citação.
- source_word: περὶ ὑμῶν τῶν ὑποκριτῶν
  choice: a respeito de vocês, hipócritas
  rationale: Expressa a referência indicada por περί e preserva a aposição acusatória que identifica diretamente os ouvintes.
- source_word: ὡς γέγραπται ὅτι
  choice: 'como está escrito:'
  rationale: É a fórmula idiomática portuguesa para introduzir uma citação das Escrituras; os dois-pontos tornam desnecessária a tradução explícita de ὅτι.
- source_word: Οὗτος ὁ λαὸς
  choice: Este povo
  rationale: Mantém o demonstrativo e o substantivo no singular, preservando o tom da citação profética.
- source_word: τοῖς χείλεσίν με τιμᾷ
  choice: me honra com os lábios
  rationale: Traduz τιμάω por seu sentido direto e conserva a imagem corporal do texto grego sem exigir um possessivo pouco natural.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: mas seu coração
  rationale: Preserva o singular coletivo de καρδία e retoma naturalmente 'este povo' em português.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: está longe de mim
  rationale: Expressa de forma natural tanto a metáfora de distância quanto sua dimensão relacional, sem acrescentar interpretação.
theological_decisions:
- issue: Aplicação da profecia de Isaías aos interlocutores de Jesus
  choice: 'Manter a acusação direta: “a respeito de vocês, hipócritas” e “Este povo”'
  alternative: Generalizar ou suavizar a declaração, afastando-a dos ouvintes imediatos
  rationale: O grego aplica explicitamente a profecia aos interlocutores presentes. A tradução conserva essa força sem ampliar nem explicar doutrinariamente a censura.
- issue: Singular coletivo em “povo” e “coração”
  choice: Preservar “Este povo” e “seu coração” no singular
  alternative: Empregar formas plurais, como “estas pessoas” e “seus corações”
  rationale: O singular sustenta a imagem coletiva da citação de Isaías e mantém a tensão entre a expressão externa do povo e sua disposição interior comum.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “A respeito de vocês” é natural e mantém a referência direta; “vocês” evita regionalismo excessivo. A formulação conserva o paralelismo e o tom solene da citação sem recorrer a linguagem arcaica.
