  text: καὶ ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς εὗρεν τὸ ⸂παιδίον βεβλημένον ἐπὶ τὴν κλίνην καὶ τὸ δαιμόνιον ἐξεληλυθός⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/030.yaml
  text: And when she went away to her house, she found the child lying on the bed[a], and the demon gone.
translation:
  language: pt
  text: E, quando foi para casa, encontrou a criança deitada na cama, e o demônio já tinha saído.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “e o demônio tendo saído”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσα
  choice: quando foi
  rationale: O particípio aoristo indica uma ação anterior à de encontrar; a construção temporal é natural em português e preserva a sequência narrativa.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: para casa
  rationale: Expressa naturalmente o movimento de volta à residência dela; o possessivo é dispensável em português neste contexto.
- source_word: εὗρεν
  choice: ela encontrou
  rationale: Equivalente narrativo direto de εὑρίσκω.
- source_word: παιδίον
  choice: a criança
  rationale: Preserva o termo neutro usado neste versículo, embora o contexto identifique a criança como filha da mulher.
- source_word: βεβλημένον
  choice: deitada
  rationale: O particípio perfeito passivo descreve o estado resultante da criança sobre a cama; “deitada” é natural e não sugere violência indevidamente.
- source_word: ἐπὶ τὴν κλίνην
  choice: na cama
  rationale: Em português corrente, “na cama” é a expressão idiomática para a posição descrita, sem alterar o sentido.
- source_word: δαιμόνιον
  choice: o demônio
  rationale: Traduz diretamente δαιμόνιον e mantém a distinção lexical do versículo.
- source_word: ἐξεληλυθός
  choice: já tinha saído
  rationale: O perfeito enfatiza uma saída concluída com efeito presente; “já tinha saído” explicita naturalmente essa anterioridade e o estado resultante.
theological_decisions:
- issue: Descrição do resultado do exorcismo
  choice: viu que o demônio já tinha saído
  alternative: e o demônio tendo saído
  rationale: A formulação conserva a realidade e o resultado completo da saída do demônio, sem acrescentar agente, mecanismo ou interpretação teológica ausentes do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “ela” evita ambiguidade quanto ao sujeito; “viu que” torna idiomática a coordenação de dois complementos de “encontrou” sem mudar o conteúdo observado.
