  text: ⸀καὶ ἐπερωτῶσιν αὐτὸν οἱ Φαρισαῖοι καὶ οἱ γραμματεῖς· Διὰ τί ⸂οὐ περιπατοῦσιν οἱ μαθηταί σου⸃ κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων, ἀλλὰ ⸀κοιναῖς χερσὶν ἐσθίουσιν τὸν ἄρτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/005.yaml
  text: And the Pharisees and the scribes asked him[a], “Why do your disciples not walk according to the tradition of the elders, but eat bread with unclean hands?”
translation:
  language: pt
  text: 'E os fariseus e os escribas lhe perguntaram: “Por que os seus discípulos não vivem segundo a tradição dos anciãos, mas comem pão com as mãos impuras[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “com mãos comuns”; isto é, ritualmente impuras.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπερωτῶσιν
  choice: perguntaram
  rationale: O presente histórico grego é expresso naturalmente pelo pretérito perfeito em português, sem acrescentar ideia de repetição.
- source_word: γραμματεῖς
  choice: escribas
  rationale: Termo tradicional e preciso para a classe reconhecida de estudiosos e intérpretes da Lei no contexto dos Evangelhos.
- source_word: περιπατοῦσιν
  choice: vivem
  rationale: O sentido idiomático é conduzir a vida ou comportar-se. Em português atual, “vivem segundo” comunica com clareza a metáfora convencional grega sem produzir a estranheza de “andam segundo”.
- source_word: κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων
  choice: segundo a tradição dos anciãos
  rationale: Preserva a relação de conformidade indicada por κατά e o genitivo, sem explicitar além do texto como a tradição foi transmitida.
- source_word: κοιναῖς χερσὶν
  choice: com as mãos impuras
  rationale: Neste contexto, κοινός designa impureza ritual, não sujeira física. “Impuras” é claro em português e a nota preserva o sentido literalmente incomum de “comuns”.
- source_word: ἐσθίουσιν τὸν ἄρτον
  choice: comem pão
  rationale: Mantém o substantivo concreto ἄρτον, que pode representar a refeição, em vez de generalizá-lo como “comida”.
theological_decisions:
- issue: Natureza da impureza indicada por κοινός
  choice: mãos impuras, com nota esclarecendo o caráter ritual
  alternative: mãos comuns; mãos contaminadas
  rationale: A controvérsia trata de pureza ritual segundo a tradição farisaica, não de higiene nem necessariamente de culpa moral. A formulação e a nota mantêm essa distinção sem antecipar a conclusão teológica da passagem.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Vivem segundo” verte naturalmente o idioma semítico-grego de “andar segundo”; “anciãos” e “escribas” preservam a terminologia histórica.
