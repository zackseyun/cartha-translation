reference: Mark 7:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἰσῆλθεν ⸀εἰς οἶκον ἀπὸ τοῦ ὄχλου, ἐπηρώτων αὐτὸν οἱ μαθηταὶ αὐτοῦ ⸂τὴν παραβολήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/017.yaml
  text: And when he entered a house away from the crowd[a], his disciples asked him about the parable.
translation:
  language: pt
  text: E, depois de deixar a multidão, entrou numa casa; seus discípulos lhe perguntaram sobre a parábola.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o dito” ou “a ilustração”. A palavra grega é παραβολή.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Mantém o conectivo característico do fluxo narrativo de Marcos sem o omitir.
- source_word: ὅτε
  choice: quando
  rationale: Expressa naturalmente a conjunção temporal que introduz a circunstância da pergunta.
- source_word: εἰσῆλθεν εἰς οἶκον
  choice: entrou numa casa
  rationale: Preserva o sentido do verbo e reflete a ausência de artigo diante de οἶκον, sem identificar a casa como já conhecida.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: afastando-se da multidão
  rationale: Torna explícita, de modo natural em português, a separação espacial indicada pela preposição, sem acrescentar uma nova ação independente.
- source_word: ἐπηρώτων
  choice: perguntaram
  rationale: O pretérito perfeito é idiomático na narrativa portuguesa; embora o imperfeito grego possa sugerir ação em curso, aqui não é necessário marcar essa nuance.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seus discípulos
  rationale: Reproduz com naturalidade a construção possessiva e mantém claro o referente.
- source_word: τὴν παραβολήν
  choice: a parábola
  rationale: Conserva a categoria figurativa usada pelo próprio texto, sem reduzi-la a uma interpretação mais estreita.
theological_decisions:
- issue: Sentido de παραβολή neste contexto, em que a declaração anterior também pode ser entendida mais amplamente como uma fala figurada
  choice: a parábola
  alternative: a declaração; a ilustração
  rationale: A tradução direta preserva a maneira como Marcos caracteriza o ensino de Jesus e mantém aberta a amplitude semântica do termo por meio de nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação de “afastando-se da multidão” evita a possível leitura de que a casa estivesse fisicamente longe da multidão e comunica a separação associada à entrada.
