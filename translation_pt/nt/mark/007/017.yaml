  naturalness: O texto é claro e de registro apropriado. A revisão melhora o encadeamento temporal e evita o gerúndio que pode soar ligeiramente ambíguo neste contexto.
  terminology: “Parábola” é a equivalência direta e apropriada de παραβολή. Na nota, “dito” é uma alternativa lexical mais próxima de “saying” do que “declaração”; “ilustração” permanece uma possibilidade contextual.
