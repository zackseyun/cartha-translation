  - severity: low
    issue: A nota usa “declaração” como alternativa para παραβολή.
    rationale: “Declaração” é possível em sentido amplo, mas “dito” corresponde mais diretamente à alternativa lexical “saying” e preserva melhor o caráter de enunciado breve/figurativo.
  revised_text: E, depois de deixar a multidão, entrou numa casa; seus discípulos lhe perguntaram sobre a parábola.[a]
