source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῇ· Διὰ τοῦτον τὸν λόγον ὕπαγε, ἐξελήλυθεν ⸂ἐκ τῆς θυγατρός σου τὸ δαιμόνιον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/029.yaml
  text: And he said to her[a], “Because of this word, go; the demon has gone out of your daughter.”
translation:
  language: pt
  text: 'E ele lhe disse: “Por causa desta palavra, vá; o demônio já saiu de sua filha.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῇ
  choice: E ele lhe disse
  rationale: Mantém a ligação narrativa simples de καί e traduz naturalmente o dativo αὐτῇ, sem acrescentar uma nuance temporal mais forte.
- source_word: Διὰ τοῦτον τὸν λόγον
  choice: Por causa desta palavra
  rationale: διά com acusativo expressa aqui causa ou motivo. “Palavra” preserva o singular λόγον e remete de modo transparente à resposta anterior da mulher; “por causa do que você disse” seria mais idiomático, mas também mais explicativo.
- source_word: ὕπαγε
  choice: vá
  rationale: O imperativo funciona como despedida ou autorização para partir. “Vá” é direto, atual e fiel, sem acrescentar elementos como “siga o seu caminho”.
- source_word: ἐξελήλυθεν
  choice: já saiu
  rationale: O perfeito apresenta uma ação concluída cujo resultado permanece. “Já saiu” comunica em português que a saída ocorreu e que o demônio não permanece nela; o advérbio “já” explicita naturalmente a força resultativa no contexto.
- source_word: ἐκ τῆς θυγατρός σου
  choice: de sua filha
  rationale: Com o verbo “sair”, a preposição “de” preserva a imagem de procedência expressa por ἐκ e soa natural em português.
- source_word: τὸ δαιμόνιον
  choice: o demônio
  rationale: É o equivalente lexical direto de δαιμόνιον neste contexto e preserva a referência sobrenatural pessoal, sem importar a expressão distinta “espírito impuro”.
theological_decisions:
- issue: Linguagem de exorcismo e a natureza da aflição
  choice: o demônio já saiu de sua filha
  alternative: o espírito mau deixou sua filha
  rationale: O grego nomeia explicitamente τὸ δαιμόνιον e declara que ele saiu da filha. A tradução mantém essa afirmação sem reduzi-la a doença, influência abstrata ou metáfora.
- issue: Relação entre a resposta da mulher e a ordem de Jesus
  choice: Por causa desta palavra, vá
  alternative: Por ter dito isso, vá
  rationale: A formulação preserva a força causal de διά e o substantivo singular λόγος, sem definir além do texto de que modo a palavra da mulher se relaciona com a concessão de Jesus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se “sua filha”, natural no contexto e sem ambiguidade prática. A ordem “o demônio já saiu de sua filha” acompanha a sintaxe idiomática do português e conserva o resultado presente do perfeito grego.
