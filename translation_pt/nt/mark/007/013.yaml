id: MRK.7.13
reference: Mark 7:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀκυροῦντες τὸν λόγον τοῦ θεοῦ τῇ παραδόσει ὑμῶν ᾗ παρεδώκατε· καὶ παρόμοια τοιαῦτα πολλὰ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/013.yaml
  text: thus nullifying the word of God by your tradition that you have handed down[c][b][a]. And you do many other similar things.
translation:
  language: pt
  text: assim anulando a palavra de Deus pela tradição que vocês transmitiram.[a][b] E fazem muitas outras coisas semelhantes.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “invalidando” ou “tornando sem efeito” a palavra de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “que vocês passaram adiante”.
    reason: lexical_alternative
  - marker: c
    text: Ou “muitas coisas semelhantes a essas”.
    reason: previous_rendering
lexical_decisions:
- source_word: ἀκυροῦντες
  choice: anulando
  rationale: Expressa a ideia de tirar a validade ou o efeito de algo e mantém a forma participial, que dá continuidade à acusação do versículo anterior.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: É a correspondência mais direta da expressão grega e preserva o contraste solene entre a palavra divina e a tradição dos interlocutores.
- source_word: τῇ παραδόσει ὑμῶν
  choice: pela tradição de vocês
  rationale: 'O dativo tem sentido instrumental: a tradição é o meio pelo qual eles anulam a palavra de Deus. A formulação é clara e natural em português.'
- source_word: ᾗ παρεδώκατε
  choice: que vocês transmitiram
  rationale: Mantém a relação etimológica e conceitual entre tradição e aquilo que foi transmitido, sem acrescentar quem a recebeu.
- source_word: παρόμοια τοιαῦτα πολλὰ
  choice: muitas outras coisas semelhantes
  rationale: Comunica de modo idiomático a expressão grega enfática e parcialmente redundante, preservando a ideia de numerosas práticas do mesmo tipo.
- source_word: ποιεῖτε
  choice: fazem
  rationale: O presente simples comunica adequadamente uma prática habitual e contínua.
theological_decisions:
- issue: Natureza da tradição na acusação de Jesus
  choice: tradição de vocês
  alternative: tradição humana
  rationale: O grego diz literalmente “tradição de vocês”; embora o contexto a apresente como tradição humana em oposição à palavra de Deus, a tradução não acrescenta um adjetivo ausente deste versículo.
- issue: Força de ἀκυροῦντες em relação à palavra de Deus
  choice: anulando
  alternative: invalidando
  rationale: “Anulando” preserva a acusação de que a prática deles retira a validade ou eficácia normativa da palavra de Deus, sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” reproduz o plural da segunda pessoa de modo natural. A abertura com “assim anulando” conserva a ligação sintática com o versículo anterior; “muitas outras coisas semelhantes” evita uma redundância pouco natural em português sem eliminar a ênfase da expressão grega.
