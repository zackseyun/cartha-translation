  text: καὶ ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου κατ’ ἰδίαν ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ καὶ πτύσας ἥψατο τῆς γλώσσης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/033.yaml
  text: And taking him aside from the crowd privately[a], he put his fingers into his ears, and after spitting[b], he touched his tongue.
translation:
  language: pt
  text: E, tirando-o da multidão e levando-o à parte[a], pôs os dedos nos ouvidos dele e, depois de cuspir[b], tocou-lhe a língua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em privado”.
    reason: lexical_alternative
  - marker: b
    text: 'O grego diz: “e, depois de cuspir, tocou-lhe a língua”; não afirma explicitamente que Jesus pôs saliva na língua do homem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου
  choice: levando-o para longe da multidão
  rationale: O particípio indica que Jesus separou o homem das demais pessoas. A formulação é natural em português e preserva tanto o afastamento quanto a referência explícita à multidão.
- source_word: κατ’ ἰδίαν
  choice: em particular
  rationale: A expressão indica uma ação realizada à parte, sem a presença da multidão. “Em particular” é corrente e mantém a função adverbial da expressão.
- source_word: ἔβαλεν
  choice: pôs
  rationale: Embora βάλλω possa significar literalmente lançar, neste contexto de ação corporal tem o sentido idiomático de pôr ou colocar; “pôs” é claro e não sugere força indevida.
- source_word: τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ
  choice: pôs os dedos nos ouvidos dele
  rationale: A redação preserva a ação física concreta e usa “dele” para deixar claro que os ouvidos pertenciam ao homem, evitando uma sequência pronominal ambígua em português.
- source_word: πτύσας
  choice: depois de cuspir
  rationale: O particípio aoristo apresenta a ação como anterior ou associada ao toque. A tradução torna natural a sequência sem afirmar onde caiu ou foi aplicada a saliva.
- source_word: ἥψατο τῆς γλώσσης αὐτοῦ
  choice: tocou-lhe a língua
  rationale: ἅπτομαι com genitivo significa aqui tocar. A construção portuguesa com pronome possessivo dativo é concisa, digna e identifica naturalmente a língua como sendo a do homem.
theological_decisions:
- issue: Descrição do gesto de cura de Jesus
  choice: Relatar que Jesus cuspiu e depois tocou a língua do homem, sem afirmar que aplicou saliva nela.
  alternative: Traduzir como se Jesus tivesse colocado saliva na língua do homem ou explicar um significado ritual ou medicinal.
  rationale: O grego menciona o ato de cuspir e o toque na língua, mas não explicita o destino da saliva nem interpreta o significado do gesto. A tradução preserva essa contenção narrativa e teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom permanece narrativo e digno; “multidão”, “em particular” e “tocou-lhe a língua” são formas correntes sem coloquialismo excessivo. A pontuação conserva a sequência das ações e os marcadores [a] e [b] aparecem no texto.
