lexical_decisions:
- source_word: οὐκέτι
  choice: já não
  rationale: Expressa de modo natural em português a cessação de uma possibilidade ou prática anterior.
- source_word: ἀφίετε
  choice: permitem
  rationale: Neste contexto, ἀφίημι tem o sentido de permitir ou deixar que alguém aja, e não os sentidos de perdoar ou abandonar.
- source_word: αὐτὸν
  choice: ele
  rationale: O pronome masculino singular refere-se à pessoa que poderia fazer algo em benefício dos pais; em português, funciona como sujeito da oração infinitiva introduzida por «que».
- source_word: οὐδὲν ποιῆσαι
  choice: faça coisa alguma
  rationale: Preserva a negação abrangente da construção grega e soa digna e natural em português corrente.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: pelo pai ou pela mãe
  rationale: A preposição «por» comunica benefício neste contexto e mantém a formulação ampla do grego sem limitar explicitamente a ação ao sustento financeiro.
theological_decisions:
- issue: Explicitar ou não a ideia de ajuda material sugerida pelo contexto de Corbã
  choice: Manter a expressão geral «faça coisa alguma pelo pai ou pela mãe»
  alternative: «faça coisa alguma para ajudar o pai ou a mãe» ou «contribua para o sustento do pai ou da mãe»
  rationale: O contexto aponta para apoio prático ou financeiro, mas o texto deste versículo emprega uma formulação mais ampla. A tradução preserva essa amplitude e deixa que o contexto forneça a implicação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. «Vocês» representa o plural implícito no verbo grego; «já não permitem» conserva a força temporal de οὐκέτι. O artigo definido em «o pai» e «a mãe» é idiomático em português para parentesco pessoal, sem necessidade de repetir «seu».
