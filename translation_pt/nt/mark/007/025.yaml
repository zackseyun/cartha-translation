source:
  edition: SBLGNT
  text: ⸂ἀλλ’ εὐθὺς ἀκούσασα⸃ γυνὴ περὶ αὐτοῦ, ἧς εἶχεν τὸ θυγάτριον αὐτῆς πνεῦμα ἀκάθαρτον, ἐλθοῦσα προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/025.yaml
  text: But immediately a woman whose little daughter had an unclean spirit[a], having heard about him[c][b], came and fell at his feet.
translation:
  language: pt
  text: Mas uma mulher, cuja filhinha[a] tinha um espírito impuro[b], assim que ouviu falar dele, veio e se lançou aos seus pés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filha pequena”. O grego emprega uma forma diminutiva de “filha”.
    reason: lexical_alternative
  - marker: b
    text: Ou “espírito imundo”; tradicionalmente entendido também como um demônio.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  choice: Mas
  rationale: Mantém a leve força adversativa ou continuativa que liga o versículo ao contexto anterior.
- source_word: εὐθὺς ἀκούσασα ... περὶ αὐτοῦ
  choice: assim que ouviu falar dele
  rationale: Expressa naturalmente a relação temporal imediata entre ouvir a respeito de Jesus e a ação subsequente, sem tornar a frase pesada em português.
- source_word: γυνὴ
  choice: uma mulher
  rationale: O substantivo sem artigo introduz uma nova personagem de modo indefinido.
- source_word: θυγάτριον
  choice: filhinha
  rationale: Preserva tanto a relação familiar quanto a forma diminutiva do termo grego, que pode indicar pouca idade ou tom afetuoso.
- source_word: πνεῦμα ἀκάθαρτον
  choice: espírito impuro
  rationale: Mantém a terminologia característica de Marcos e é clara em português moderno; evita substituir o termo por uma interpretação como 'demônio'.
- source_word: ἐλθοῦσα
  choice: veio
  rationale: Apresenta a ação em sequência narrativa natural, de acordo com o ponto de vista da cena.
- source_word: προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ
  choice: se lançou aos seus pés
  rationale: Comunica o movimento físico de cair diante de Jesus em atitude urgente de súplica e humildade, sem especificar além do texto a postura exata.
theological_decisions:
- issue: Tradução de πνεῦμα ἀκάθαρτον
  choice: espírito impuro
  alternative: espírito imundo; demônio
  rationale: A tradução lexical conserva a expressão de Marcos e suas possíveis conotações morais e rituais. 'Demônio' identifica o referente de modo interpretativo, mas não reproduz diretamente a formulação grega.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez narrativa. “Filhinha” conserva o diminutivo sem ocultar a relação familiar; “assim que” transmite a urgência típica de Marcos de maneira natural.
