  text: οἱ γὰρ Φαρισαῖοι καὶ πάντες οἱ Ἰουδαῖοι ἐὰν μὴ πυγμῇ νίψωνται τὰς χεῖρας οὐκ ἐσθίουσιν, κρατοῦντες τὴν παράδοσιν τῶν πρεσβυτέρων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/003.yaml
  text: For the Pharisees and all the Jews do not eat unless they wash their hands with a fist[a], holding to the tradition of the elders.
translation:
  language: pt
  text: Pois os fariseus e todos os judeus não comem, a menos que lavem as mãos com o punho[a], apegando-se à tradição dos anciãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego é difícil e pode referir-se a uma maneira ou extensão costumeira da lavagem ritual das mãos; também pode significar “até o pulso”, “cuidadosamente” ou “completamente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação parentética de Marcos de modo natural e preserva o valor explicativo da conjunção.
- source_word: Φαρισαῖοι
  choice: fariseus
  rationale: Forma tradicional e amplamente reconhecida em português para o nome desse grupo judaico.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: todos os judeus
  rationale: Reproduz a expressão ampla do grego, entendida no contexto como generalização explicativa, sem restringi-la a habitantes da Judeia.
- source_word: ἐὰν μὴ
  choice: sem
  rationale: Em combinação com a oração principal negativa, expressa com naturalidade em português a condição de 'a menos que'.
- source_word: πυγμῇ
  choice: com o punho
  rationale: Mantém no texto a formulação mais literal de um termo grego notoriamente difícil, evitando resolver silenciosamente se indica instrumento, extensão ou modo da lavagem; a nota registra as possibilidades.
- source_word: νίψωνται τὰς χεῖρας
  choice: lavar as mãos
  rationale: Equivalente português claro e convencional para a lavagem dessa parte do corpo.
- source_word: οὐκ ἐσθίουσιν
  choice: não comem
  rationale: Preserva o presente habitual e não acrescenta um objeto ausente no grego.
- source_word: κρατοῦντες
  choice: apegando-se
  rationale: Expressa adesão firme e contínua à tradição, preservando o valor circunstancial do particípio.
- source_word: παράδοσιν τῶν πρεσβυτέρων
  choice: tradição dos anciãos
  rationale: Formulação concisa que conserva a relação genitiva, sem decidir além do texto se os anciãos são apenas a fonte ou também os transmissores da tradição.
theological_decisions:
- issue: Alcance de 'todos os judeus'
  choice: Mantida a expressão ampla 'todos os judeus'.
  alternative: '''todos os habitantes da Judeia'' ou ''muitos judeus'''
  rationale: O texto grego diz explicitamente 'todos os judeus'. A formulação funciona como generalização explicativa e não deve ser estreitada nem convertida em afirmação estatística mais precisa que a fonte.
- issue: Sentido de πυγμῇ
  choice: Traduzido literalmente como 'com o punho', com nota explicativa.
  alternative: '''até o pulso'', ''cuidadosamente'' ou ''completamente'''
  rationale: O sentido exato é disputado e provavelmente se refere a uma maneira ou extensão costumeira da lavagem ritual. A tradução principal conserva a dificuldade lexical, e a nota impede que a expressão literal seja tomada como interpretação segura.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. 'Anciãos' preserva o termo histórico tradicional; 'apegando-se' comunica adesão firme sem introduzir avaliação denominacional.
