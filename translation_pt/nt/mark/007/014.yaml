- source_word: Ἀκούσατέ μου
  choice: Escutem-me
  rationale: Reproduz o imperativo dirigido à multidão e a ideia de prestar atenção ao que Jesus diz.
- source_word: σύνετε
  choice: entendam
  rationale: Traduz diretamente o imperativo de compreender ou captar o sentido.
