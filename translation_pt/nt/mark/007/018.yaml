  text: καὶ λέγει αὐτοῖς· Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε; οὐ νοεῖτε ὅτι πᾶν τὸ ἔξωθεν εἰσπορευόμενον εἰς τὸν ἄνθρωπον οὐ δύναται αὐτὸν κοινῶσαι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/018.yaml
  text: And he said to them[b][a], “So are you also without understanding? Do you not understand that everything that enters into the man from outside is not able to defile him,”
translation:
  language: pt
  text: 'E ele lhes disse: “Vocês também são assim tão sem entendimento? Não compreendem que nada do que entra de fora no ser humano pode torná-lo impuro[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contaminá-lo”. Neste contexto, o verbo grego se relaciona às categorias de pureza e impureza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: disse
  rationale: O presente histórico grego é vertido pelo passado, forma natural na narrativa em português.
- source_word: Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε
  choice: Vocês também são assim tão sem entendimento?
  rationale: Preserva a ênfase da repreensão, a inclusão dos discípulos por καί e a ideia de falta de compreensão, sem recorrer a termos insultuosos mais fortes.
- source_word: οὐ νοεῖτε
  choice: Não compreendem
  rationale: Expressa de modo claro o ato de perceber ou entender e mantém a ligação semântica com ἀσύνετοι.
- source_word: πᾶν τὸ ἔξωθεν εἰσπορευόμενον
  choice: nada do que entra de fora
  rationale: A construção negativa idiomática em português comunica que nenhuma coisa proveniente de fora tem a capacidade indicada; 'entra de fora' representa tanto o movimento de entrada quanto a origem externa.
- source_word: εἰς τὸν ἄνθρωπον
  choice: no ser humano
  rationale: Mantém o referente humano genérico singular sem sugerir que a afirmação se limite aos homens do sexo masculino.
- source_word: κοινῶσαι
  choice: torná-lo impuro
  rationale: No contexto, o verbo denota tornar comum ou impuro segundo categorias de pureza; 'impuro' preserva essa dimensão melhor do que uma expressão de mera sujeira física.
theological_decisions:
- issue: Sentido de pureza em κοινόω
  choice: torná-lo impuro
  alternative: contaminá-lo
  rationale: A formulação escolhida conserva as conotações de pureza ritual do contexto sem limitar o verbo à contaminação física nem antecipar conclusões doutrinárias desenvolvidas nos versículos seguintes.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “vocês” para ampla legibilidade brasileira. A vírgula final foi mantida porque a fala e a frase continuam no versículo seguinte.
