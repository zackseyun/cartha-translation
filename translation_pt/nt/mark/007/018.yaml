  verdict: approve
  source_fidelity: 'A tradução representa adequadamente a construção grega sob negação: “nada do que entra de fora no ser humano pode” equivale, em português natural, a “tudo o que entra ... não pode”. “Torná-lo impuro” comunica apropriadamente κοινῶσαι no quadro de pureza ritual, sem reduzir o sentido à sujeira física ou à corrupção moral.'
  naturalness: O texto é claro, fluente e adequado ao português moderno de ampla compreensão. “Vocês” e “ser humano” são escolhas naturais para o registro e a legibilidade pretendidos. A vírgula final é correta, pois a fala permanece sintaticamente incompleta e continua no versículo seguinte.
  terminology: “Sem entendimento” preserva a reprimenda de ἀσύνετοι sem intensificá-la indevidamente. “Impuro”, acompanhado da nota sobre categorias de pureza e impureza, mantém a terminologia contextual de κοινόω. A alternativa “contaminá-lo” é útil, embora menos específica do que a leitura principal.
