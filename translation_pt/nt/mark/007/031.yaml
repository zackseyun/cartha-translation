  text: Καὶ πάλιν ἐξελθὼν ἐκ τῶν ὁρίων Τύρου ⸂ἦλθεν διὰ Σιδῶνος εἰς⸃ τὴν θάλασσαν τῆς Γαλιλαίας ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/031.yaml
  text: And again[a], after departing from the region of Tyre, he came through Sidon to the Sea of Galilee[b], through the midst of the region of the Decapolis.
translation:
  language: pt
  text: Ele saiu novamente da região de Tiro e, passando por Sidom[a], foi até o mar da Galileia, pelo meio da região da Decápolis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelo caminho de Sidom”. A expressão grega pode indicar uma viagem através de Sidom ou por uma rota que passava por ali.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “entre os territórios da Decápolis”. A expressão grega pode ser traduzida mais literalmente como “entre” ou “no meio de”, e a descrição da rota apresenta dificuldade geográfica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: novamente
  rationale: Indica uma nova movimentação na narrativa; “novamente” é claro e natural em português.
- source_word: ἐξελθὼν ἐκ τῶν ὁρίων Τύρου
  choice: saiu da região de Tiro
  rationale: O particípio aoristo expressa uma ação anterior à do verbo principal. Aqui, ὅρια designa o território ou a região, não apenas uma linha de fronteira.
- source_word: ἦλθεν
  choice: foi até
  rationale: No contexto de um itinerário, “foi até” soa mais natural em português do que a reprodução mecânica de “veio”, sem alterar o sentido do movimento.
- source_word: διὰ Σιδῶνος
  choice: passando por Sidom
  rationale: διά com genitivo indica movimento através de um lugar ou um trajeto que passa por ele; a formulação conserva essa descrição da rota.
- source_word: εἰς τὴν θάλασσαν τῆς Γαλιλαίας
  choice: até o mar da Galileia
  rationale: Mantém a designação geográfica tradicional e traduz θάλασσα por “mar”.
- source_word: ἀνὰ μέσον
  choice: pelo meio de
  rationale: Conserva a força espacial da expressão incomum, sem reduzi-la simplesmente a “por”.
- source_word: τῶν ὁρίων Δεκαπόλεως
  choice: da região da Decápolis
  rationale: ὅρια tem sentido territorial neste contexto, e “Decápolis” é a forma consagrada do nome regional em português.
