  naturalness: O português é moderno, claro e de registro apropriado. “Ficavam extremamente admirados” é natural e representa satisfatoriamente o imperfeito. A redação revisada torna a segunda frase mais direta e equilibrada.
  terminology: “Surdos” e “mudos”, no contexto específico de incapacidade de ouvir e de falar e em paralelismo com o texto-fonte, são escolhas semanticamente adequadas. A nota sobre Isaías 35:5–6 é pertinente; a formulação da nota a foi ajustada para apresentar claramente sua alternativa de ordem mais formal.
