  text: καὶ ὑπερπερισσῶς ἐξεπλήσσοντο λέγοντες· Καλῶς πάντα πεποίηκεν, καὶ τοὺς κωφοὺς ποιεῖ ἀκούειν ⸀καὶ ἀλάλους λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/037.yaml
  text: And they were utterly astonished[a], saying, “He has done everything well[b]. He makes even the deaf hear and the mute speak.”
translation:
  language: pt
  text: 'E ficavam extremamente admirados, dizendo: “Ele fez tudo bem[a]. Faz os surdos ouvirem e os mudos falarem.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, numa formulação mais literal: “Ele fez bem todas as coisas”, expressão que pode ecoar a linguagem das Escrituras a respeito das obras de Deus.'
    reason: lexical_alternative
  - marker: b
    text: Esta declaração recorda Isaías 35:5–6, onde, na restauração realizada por Deus, os surdos ouvem e os mudos falam.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπερπερισσῶς
  choice: extremamente
  rationale: O advérbio intensifica a reação em grau extraordinário. “Extremamente” transmite essa força em português atual sem recorrer a uma formulação artificialmente literal.
- source_word: ἐξεπλήσσοντο
  choice: ficavam admirados
  rationale: O imperfeito descreve uma reação contínua ou reiterada de assombro. “Ficavam admirados” preserva esse aspecto e combina naturalmente com o intensificador.
- source_word: λέγοντες
  choice: dizendo
  rationale: O particípio introduz diretamente as palavras com que a multidão expressava sua reação.
- source_word: Καλῶς
  choice: muito bem
  rationale: O advérbio avalia positivamente a qualidade das obras de Jesus. “Muito bem” é natural em português e dá à exclamação a ênfase esperada, sem explicitar além do texto qualquer possível alusão bíblica.
- source_word: πάντα
  choice: tudo
  rationale: “Tudo” é o equivalente idiomático e abrangente do plural neutro substantivado, preservando o alcance geral da declaração.
- source_word: πεποίηκεν
  choice: fez
  rationale: O perfeito grego apresenta a obra como realizada e relevante no presente. O pretérito perfeito simples é a forma idiomática em português; “tem feito” sugeriria repetição ou continuidade e alteraria o aspecto.
- source_word: κωφοὺς
  choice: os surdos
  rationale: Neste contexto, o termo designa pessoas que não ouvem. A forma substantivada é concisa, clara e mantém o paralelismo do grego.
- source_word: ποιεῖ ἀκούειν
  choice: faz ... ouvirem
  rationale: ποιεῖ com infinitivo expressa causação. A construção portuguesa mantém de modo direto e vívido a afirmação de que ele faz os surdos ouvir.
- source_word: ἀλάλους
  choice: os mudos
  rationale: O termo designa os que não conseguem falar. “Os mudos” é conciso e preserva o paralelismo com “os surdos” no contexto específico da cura.
- source_word: λαλεῖν
  choice: falarem
  rationale: “Falar” é o equivalente comum e natural do verbo grego neste relato de cura.
- source_word: καὶ
  choice: até
  rationale: '“Até” comunica de maneira idiomática a força inclusiva e enfática da coordenação: ele faz inclusive os surdos ouvir e os mudos falar.'
theological_decisions:
- issue: Possível alusão a Isaías 35:5–6 e possível ressonância da linguagem da criação em “fez tudo muito bem”
  choice: Manter a declaração em linguagem direta e próxima do grego, deixando as possíveis alusões implícitas no texto principal.
  alternative: 'Traduzir de modo mais formal: “Ele fez bem todas as coisas”, reforçando a possível ressonância da linguagem bíblica sobre as obras de Deus.'
  rationale: A combinação de surdos que ouvem e mudos que falam provavelmente recorda Isaías 35:5–6, enquanto a avaliação abrangente das obras pode evocar a linguagem da criação. A tradução conserva essas possibilidades sem afirmar como explícita uma identificação teológica que o versículo apenas sugere.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “ficavam extremamente admirados” preserva o aspecto contínuo do imperfeito e a intensidade incomum do advérbio grego. Optou-se por “fez”, e não “tem feito”, porque o perfeito composto português normalmente indicaria ação repetida ou continuada. Os marcadores [a] e [b] foram posicionados junto às expressões efetivamente explicadas pelas notas.
