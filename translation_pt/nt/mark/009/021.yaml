  text: καὶ ἐπηρώτησεν τὸν πατέρα αὐτοῦ· Πόσος χρόνος ἐστὶν ὡς τοῦτο γέγονεν αὐτῷ; ὁ δὲ εἶπεν· ⸀Ἐκ παιδιόθεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/021.yaml
  text: And he asked his father[a], “How long has this been happening to him?” And he said, “From childhood.”
translation:
  language: pt
  text: 'E ele perguntou ao pai do menino: “Há quanto tempo isso acontece com ele?” O pai respondeu: “Desde a infância.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: perguntou
  rationale: O aoristo de ἐπερωτάω introduz aqui uma pergunta direta e simples; “perguntou” é natural e não acrescenta formalidade ou intensidade.
- source_word: τὸν πατέρα αὐτοῦ
  choice: ao pai do menino
  rationale: No contexto, αὐτοῦ se refere ao menino afligido. A explicitação evita, em português, a possível impressão de que se trata do pai de Jesus, sem alterar o referente.
- source_word: Πόσος χρόνος ἐστὶν ὡς
  choice: Há quanto tempo
  rationale: A expressão idiomática pergunta pela duração desde o início da condição até o presente; “Há quanto tempo” transmite isso com clareza no português atual.
- source_word: τοῦτο γέγονεν αὐτῷ
  choice: isso acontece com ele
  rationale: O perfeito γέγονεν indica uma condição que começou no passado e persiste. O presente, combinado com “há quanto tempo”, comunica naturalmente essa continuidade.
- source_word: ὁ δὲ εἶπεν
  choice: O pai respondeu
  rationale: δέ marca a progressão narrativa, e εἶπεν introduz a resposta. Repetir o referente como “O pai” deixa clara a troca de falante em português corrente.
- source_word: Ἐκ παιδιόθεν
  choice: Desde a infância
  rationale: ἐκ com παιδιόθεν indica o ponto de origem na infância. “Desde a infância” expressa de modo idiomático tanto esse início quanto a continuidade até o presente.
