source:
  edition: SBLGNT
  text: καὶ ἐγένετο νεφέλη ἐπισκιάζουσα αὐτοῖς, καὶ ⸀ἐγένετο φωνὴ ἐκ τῆς νεφέλης· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/007.yaml
  text: 'And a cloud came[a], overshadowing them, and a voice came out of the cloud: “This is my beloved Son; listen to him.”'
translation:
  language: pt
  text: 'E veio uma nuvem que os cobriu com sua sombra, e da nuvem veio uma voz: “Este é o meu Filho amado. Escutem-no.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: veio
  rationale: Com «nuvem» e depois «voz» como sujeitos, o verbo marca o surgimento ou a ocorrência dos acontecimentos. «Veio» é natural em português e mantém o movimento da narrativa.
- source_word: νεφέλη
  choice: nuvem
  rationale: Equivalente direto e corrente, sem explicitar no corpo do texto o simbolismo da presença divina.
- source_word: ἐπισκιάζουσα αὐτοῖς
  choice: que os cobriu com sua sombra
  rationale: Reproduz de modo claro a imagem de uma nuvem projetando sombra sobre eles e evita o caráter menos corrente de «ensombreou-os».
- source_word: φωνὴ ἐκ τῆς νεφέλης
  choice: da nuvem veio uma voz
  rationale: Preserva a origem espacial indicada por ἐκ e não acrescenta um verbo de fala ausente do grego.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: o meu Filho amado
  rationale: Tradução direta que conserva tanto a relação filial quanto o valor afetivo de ἀγαπητός.
- source_word: ἀκούετε αὐτοῦ
  choice: Escutem-no
  rationale: O imperativo pede atenção e acolhimento ao que ele diz, não mera percepção auditiva. «Escutem-no» mantém essa força sem tornar explícita apenas a ideia de obedecer.
theological_decisions:
- issue: Declaração divina sobre a identidade de Jesus
  choice: «Este é o meu Filho amado»
  alternative: «Este é meu Filho, o Amado»
  rationale: A formulação mantém a afirmação direta da filiação de Jesus e a qualificação ἀγαπητός, sem acrescentar explicação doutrinária.
- issue: Força de ἀκούετε αὐτοῦ
  choice: «Escutem-no»
  alternative: «Ouçam-no» ou «Obedeçam-lhe»
  rationale: O verbo abrange ouvir com atenção e dar ouvidos. «Escutem-no» preserva essa amplitude melhor que a possível leitura puramente auditiva de «ouçam» e evita restringi-lo ao sentido explícito de obediência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem «da nuvem veio uma voz» conserva a progressão narrativa e a origem da voz. Não se incluiu nota, pois «Escutem-no» comunica adequadamente no próprio texto a força contextual do imperativo.
