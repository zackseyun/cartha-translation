source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς πᾶς ὁ ὄχλος ⸂ἰδόντες αὐτὸν ἐξεθαμβήθησαν⸃, καὶ προστρέχοντες ἠσπάζοντο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/015.yaml
  text: And immediately the whole crowd[a], when they saw him, were greatly amazed, and running up to him, greeted him.
translation:
  language: pt
  text: E imediatamente, quando toda a multidão o viu, ficou muito espantada[a]; então todos correram até ele e o saudaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficou atônita” ou “ficou alarmada”. O verbo grego pode expressar intenso espanto, assombro ou alarme, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Preserva a urgência característica da narrativa de Marcos em português corrente e digno.
- source_word: πᾶς ὁ ὄχλος
  choice: toda a multidão
  rationale: Expressa naturalmente o sentido coletivo e abrangente da construção grega.
- source_word: ἰδόντες αὐτόν
  choice: quando toda a multidão o viu
  rationale: Interpreta o particípio aoristo em sentido temporal, como a circunstância que desencadeia a reação.
- source_word: ἐξεθαμβήθησαν
  choice: ficou muito espantada
  rationale: Comunica uma reação intensa de assombro sem especificar uma causa que o texto não declara.
- source_word: προστρέχοντες
  choice: todos correram até ele
  rationale: Retrata com clareza o movimento rápido em direção a Jesus; 'todos' explicita em português que os membros da multidão realizam a ação.
- source_word: ἠσπάζοντο αὐτόν
  choice: o saudaram
  rationale: É uma tradução neutra, natural e contextualmente adequada para o ato de cumprimentar Jesus.
theological_decisions:
- issue: Nuance da reação da multidão expressa por ἐξεθαμβήθησαν
  choice: uma reação intensa de espanto
  alternative: ficou atônita; ficou alarmada; espantou-se por causa de uma aparência radiante
  rationale: O versículo descreve uma reação intensa ao ver Jesus, mas não explica sua causa. A tradução evita tanto reduzir a força do verbo quanto introduzir a hipótese de medo ou de uma aparência sobrenatural.
translation_notes:
  register: Português moderno de ampla compreensão, com legibilidade brasileira. A concordância singular em 'ficou' acompanha o substantivo coletivo 'multidão'; 'todos' torna natural a passagem para as ações individuais dos integrantes da multidão.
