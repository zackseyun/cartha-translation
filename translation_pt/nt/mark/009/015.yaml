  source_fidelity: 'A tradução preserva adequadamente a progressão do grego: a multidão vê Jesus, reage com forte espanto, corre até ele e o saúda. «Toda a multidão» reproduz bem o coletivo πᾶς ὁ ὄχλος, e o singular em «ficou muito espantada» é concordância portuguesa legítima com «multidão». «Então todos» torna explícita, de modo natural, a referência aos integrantes da multidão nas ações subsequentes, sem introduzir conteúdo material alheio ao texto.'
