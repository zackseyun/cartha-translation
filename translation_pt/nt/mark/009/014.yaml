base_translation:
  language: en
  yaml_path: translation/nt/mark/009/014.yaml
  text: And when they came to the disciples[a], they saw a large crowd around them, and scribes arguing with them.
translation:
  language: pt
  text: Quando chegaram aos discípulos, viram uma grande multidão ao redor deles e escribas discutindo[a] com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «debatendo». O verbo grego pode indicar discussão ou debate; neste contexto, provavelmente implica confronto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες πρὸς τοὺς μαθητάς
  choice: Quando chegaram até os discípulos
  rationale: O particípio aoristo é expresso por uma oração temporal natural em português, preservando a sequência narrativa; πρός com acusativo indica movimento em direção aos discípulos.
- source_word: εἶδον
  choice: viram
  rationale: O aoristo narrativo de ὁράω tem aqui o sentido simples e direto de perceber visualmente.
- source_word: ὄχλον πολύν
  choice: uma grande multidão
  rationale: A expressão indica uma multidão numerosa; esta formulação é clara, natural e mantém a ênfase quantitativa.
- source_word: περὶ αὐτούς
  choice: ao redor deles
  rationale: περί com acusativo tem sentido espacial neste contexto, situando a multidão em torno dos discípulos.
- source_word: γραμματεῖς
  choice: alguns escribas
  rationale: “Escribas” preserva a designação histórica dos especialistas judeus nas Escrituras e na Lei. O artigo indefinido plural exigido pelo português torna natural a referência sem afirmar que todos os escribas estavam presentes.
- source_word: συζητοῦντας πρὸς αὐτούς
  choice: discutindo com eles
  rationale: συζητέω pode denotar discussão ou debate; no contexto de controvérsia, “discutindo” comunica o provável tom de confronto sem exagerá-lo. O pronome se refere naturalmente aos discípulos.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com sintaxe narrativa natural e vocabulário acessível. O marcador foi colocado junto a “discutindo”, termo ao qual a nota lexical se refere.
