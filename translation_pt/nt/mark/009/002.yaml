  text: Καὶ μετὰ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ τὸν Ἰάκωβον ⸀καὶ Ἰωάννην, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν μόνους. καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/002.yaml
  text: And after six days[a], Jesus takes Peter and James and John, and brings them up onto a high mountain by themselves. And he was transfigured before them[c][b],
translation:
  language: pt
  text: Seis dias depois[a], Jesus levou consigo Pedro, Tiago e João e os fez subir com ele, a sós, a um monte alto[b]. E foi transfigurado diante deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Depois de seis dias”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em particular, sozinhos”. O grego reúne duas expressões de separação, enfatizando que Jesus levou consigo somente esses três.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “foi transformado diante deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ἡμέρας ἓξ
  choice: Seis dias depois
  rationale: Expressa naturalmente em português a sucessão temporal indicada por μετά com acusativo; a forma mais literal é registrada em nota.
- source_word: παραλαμβάνει
  choice: levou consigo
  rationale: Comunica que Jesus tomou os três discípulos para acompanhá-lo. O passado é a forma narrativa natural em português, embora o grego empregue o presente histórico.
- source_word: ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν
  choice: os fez subir a um monte alto
  rationale: Preserva o movimento ascendente de ἀναφέρει e o destino expresso por εἰς, em formulação corrente e clara.
- source_word: κατ’ ἰδίαν μόνους
  choice: onde ficaram a sós
  rationale: A expressão idiomática portuguesa comunica a separação enfática do restante das pessoas sem a redundância pouco natural de traduzir mecanicamente os dois termos gregos.
- source_word: μετεμορφώθη
  choice: foi transfigurado
  rationale: É a designação tradicional e contextualmente precisa da mudança visível de Jesus; mantém-se a alternativa lexical mais geral em nota.
- source_word: ἔμπροσθεν αὐτῶν
  choice: diante deles
  rationale: Reproduz de modo natural que o acontecimento se deu à vista e na presença dos discípulos.
theological_decisions:
- issue: Sentido de μετεμορφώθη no contexto cristológico
  choice: foi transfigurado
  alternative: foi transformado
  rationale: “Transfigurado” identifica com precisão a manifestação visível narrada sem explicar sua natureza além do texto; “transformado” continua lexicalmente possível e é preservado em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A narrativa usa o pretérito, natural em português, em vez de reproduzir rigidamente o presente histórico de Marcos. Os marcadores aparecem junto às expressões pertinentes e em ordem alfabética.
