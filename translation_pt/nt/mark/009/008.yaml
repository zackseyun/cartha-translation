  text: καὶ ἐξάπινα περιβλεψάμενοι οὐκέτι οὐδένα εἶδον ⸂ἀλλὰ τὸν Ἰησοῦν μόνον μεθ’ ἑαυτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/008.yaml
  text: And suddenly, looking around, they no longer saw anyone except Jesus alone with them.
translation:
  language: pt
  text: E, de repente, ao olharem em volta, não viram mais ninguém, a não ser Jesus, sozinho com eles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάπινα
  choice: de repente
  rationale: Expressa de modo natural a ideia de algo súbito e inesperado.
- source_word: περιβλεψάμενοι
  choice: ao olharem em volta
  rationale: Reproduz o particípio aoristo e o sentido de olhar ao redor.
- source_word: οὐκέτι οὐδένα εἶδον
  choice: não viram mais ninguém
  rationale: Mantém a negação temporal de οὐκέτι e o objeto indefinido οὐδένα em português corrente.
- source_word: ἀλλὰ τὸν Ἰησοῦν μόνον
  choice: a não ser Jesus, sozinho
  rationale: Mantém a exclusividade da construção; a posição de μόνον permite associação retórica tanto com Jesus como único visto quanto com sua presença sem Moisés e Elias.
- source_word: μεθ’ ἑαυτῶν
  choice: com eles
  rationale: Tradução direta e idiomática da expressão reflexiva, referindo-se aos discípulos.
theological_decisions:
- issue: Alcance de μόνον (“somente/sozinho”)
  choice: Jesus, sozinho com eles
  alternative: somente Jesus com eles
  rationale: A formulação conserva a ênfase em Jesus como a única pessoa restante com os discípulos, sem acrescentar interpretação teológica além do texto.
translation_notes:
  register: Português moderno, claro e digno, com construção fluente para leitores brasileiros e compreensão ampla no mundo lusófono.
source_grounding:
  english_pob_role: consult_only
