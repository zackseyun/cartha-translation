id: MRK.9.12
reference: Mark 9:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἔφη αὐτοῖς· Ἠλίας μὲν ἐλθὼν πρῶτον ⸀ἀποκαθιστάνει πάντα, καὶ πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου ἵνα πολλὰ πάθῃ καὶ ⸀ἐξουδενηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/012.yaml
  text: He said to them[a], “Elijah indeed, having come first, restores all things. And how is it written about the Son of Man that he should suffer many things and be treated with contempt?”
translation:
  language: pt
  text: 'Ele lhes disse: “De fato, Elias vem primeiro e restaura todas as coisas. E como está escrito a respeito do Filho do Homem que ele deve sofrer muitas coisas e ser desprezado[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ser tratado como alguém sem valor”. O verbo grego também pode significar ser considerado como nada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: Ele lhes disse
  rationale: Forma narrativa natural em português, preservando tanto o verbo de fala quanto o objeto indireto.
- source_word: Ἠλίας μὲν ἐλθὼν πρῶτον
  choice: De fato, Elias vem primeiro
  rationale: A construção com μέν afirma a precedência da vinda de Elias. A formulação finita é mais natural em português e mantém o valor geral ou vívido ligado ao presente do verbo principal.
- source_word: ἀποκαθιστάνει πάντα
  choice: restaura todas as coisas
  rationale: “Restaura” expressa o restabelecimento ao estado devido; “todas as coisas” conserva a amplitude do neutro plural πάντα.
- source_word: πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: como está escrito a respeito do Filho do Homem
  rationale: Mantém a fórmula escriturística “está escrito”, traduz ἐπί como referência temática e conserva o título tradicional e semanticamente relevante.
- source_word: ἵνα πολλὰ πάθῃ
  choice: que ele deve sofrer muitas coisas
  rationale: “Deve” comunica aqui a expectativa ou necessidade expressa no conteúdo do que está escrito, sem reduzir ἵνα a uma finalidade simples; “muitas coisas” preserva o plural neutro.
- source_word: ἐξουδενηθῇ
  choice: ser desprezado
  rationale: Verbo passivo que indica ser considerado sem valor ou tratado com desdém. “Ser desprezado” é conciso, claro e natural, com a nuance mais explícita registrada em nota.
theological_decisions:
- issue: Relação entre a restauração ligada a Elias e o sofrimento do Filho do Homem
  choice: Conservar a segunda oração como pergunta retórica genuína, sem explicitar uma conjunção adversativa.
  alternative: “Mas como, então, está escrito...?” ou uma explicação doutrinária que harmonize as duas afirmações.
  rationale: O grego justapõe a restauração e o sofrimento mediante uma pergunta. A tradução preserva essa tensão e não determina além do texto a relação lógica entre as ideias.
- issue: Referência de “Filho do Homem”
  choice: Manter o título “Filho do Homem”.
  alternative: “o Ser Humano” ou “o Messias”.
  rationale: O título possui ressonâncias próprias no Evangelho; substituí-lo por uma interpretação reduziria sua amplitude e importaria uma identificação explicativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a pergunta do original foram preservadas, enquanto a construção participial foi suavizada para uma formulação idiomática em português.
