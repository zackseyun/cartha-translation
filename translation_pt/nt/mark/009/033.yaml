  text: Καὶ ⸀ἦλθον εἰς Καφαρναούμ. καὶ ἐν τῇ οἰκίᾳ γενόμενος ἐπηρώτα αὐτούς· Τί ἐν τῇ ⸀ὁδῷ διελογίζεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/033.yaml
  text: And they came to Capernaum. And when he was in the house, he was asking them, “What were you discussing on the way?”
translation:
  language: pt
  text: 'E chegaram a Cafarnaum. Quando Jesus estava na casa, perguntava-lhes: “O que vocês estavam discutindo pelo caminho?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sobre o que vocês estavam debatendo pelo caminho?” O verbo pode indicar conversa, debate ou discussão; o versículo seguinte mostra que o assunto era quem deles era o maior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: chegaram
  rationale: O aoristo de ἔρχομαι com εἰς e um lugar indica aqui a chegada a Cafarnaum; “chegaram” é natural e preciso em português.
- source_word: Καφαρναούμ
  choice: Cafarnaum
  rationale: Segue a forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: ἐν τῇ οἰκίᾳ
  choice: em casa
  rationale: Expressão idiomática e natural em português. Embora o grego tenha artigo, o contexto não identifica necessariamente uma casa específica para o leitor; “em casa” evita a formulação menos natural “na casa” sem decidir de quem era a residência.
- source_word: γενόμενος
  choice: quando Jesus estava
  rationale: O particípio tem valor temporal. A explicitação de Jesus como sujeito esclarece a mudança do plural ἦλθον para o singular sem acrescentar conteúdo interpretativo indevido.
- source_word: ἐπηρώτα
  choice: perguntou-lhes
  rationale: Embora o imperfeito possa sugerir ação em curso ou reiterada, o pretérito perfeito é a forma narrativa mais natural em português neste contexto; o aspecto não exige que se traduza “ficou perguntando”.
- source_word: ἐν τῇ ὁδῷ
  choice: pelo caminho
  rationale: Equivalente idiomático para uma conversa ocorrida durante o trajeto.
- source_word: διελογίζεσθε
  choice: estavam discutindo
  rationale: “Discutir” em português pode abranger conversar ou debater uma questão sem necessariamente implicar briga, preservando a amplitude do verbo; o contexto do versículo seguinte permite também o sentido mais forte de altercação.
theological_decisions:
- issue: Mudança do sujeito plural da chegada para o sujeito singular da pergunta
  choice: Explicitar “Jesus” como sujeito da oração singular
  alternative: 'Manter apenas o pronome implícito: “quando estava em casa, perguntou-lhes”'
  rationale: O contexto identifica Jesus como o sujeito singular. Explicitá-lo torna a frase clara em português sem introduzir uma interpretação doutrinária.
- issue: Força de διελογίζεσθε
  choice: “estavam discutindo”, com nota sobre a possível ideia de debate ou discussão acalorada
  alternative: “estavam conversando” ou “estavam discutindo entre vocês”
  rationale: 'A tradução mantém a tensão lexical: o verbo pode designar deliberação, debate ou disputa, e o versículo seguinte revela que o assunto era quem deles era o maior.'
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Perguntou-lhes” preserva um tom bíblico moderado sem soar arcaico; “vocês” torna a fala direta inequívoca e acessível.
