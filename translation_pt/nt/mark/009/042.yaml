id: MRK.9.42
reference: Mark 9:42
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὃς ⸀ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν ⸀τούτων τῶν πιστευόντων ⸂εἰς ἐμέ⸃, καλόν ἐστιν αὐτῷ μᾶλλον εἰ περίκειται ⸂μύλος ὀνικὸς⸃ περὶ τὸν τράχηλον αὐτοῦ καὶ βέβληται εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/042.yaml
  text: And whoever causes one of these little ones who believe in me to stumble[a], it is better for him if a donkey millstone is put around his neck and he is thrown into the sea.
translation:
  language: pt
  text: E quem fizer tropeçar um destes pequeninos que creem em mim, melhor lhe seria que lhe pusessem ao redor do pescoço uma pedra de moinho movida por jumento[a] e que fosse lançado ao mar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, uma grande pedra de moinho, daquelas movidas por um jumento.
    reason: Esclarece a referência cultural e o tamanho implicado por μύλος ὀνικός.
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: fizer tropeçar
  rationale: Preserva a metáfora de causar queda espiritual ou levar ao pecado, sem restringir o sentido apenas a uma interpretação específica.
- source_word: μικρῶν τούτων
  choice: destes pequeninos
  rationale: Mantém a amplitude da expressão grega, que pode incluir pessoas vulneráveis ou humildes, sem a limitar exclusivamente a crianças.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: que creem em mim
  rationale: É a correspondência direta e natural de πιστεύω εἰς com objeto pessoal.
- source_word: καλόν ἐστιν αὐτῷ μᾶλλον
  choice: melhor lhe seria
  rationale: Expressa naturalmente em português a comparação implícita e o caráter hipotético da advertência severa.
- source_word: μύλος ὀνικός
  choice: uma pedra de moinho movida por jumento
  rationale: Explicita que se trata da grande pedra de moinho acionada por um animal, em contraste com a pedra menor de moinho manual.
- source_word: περίκειται ... περὶ τὸν τράχηλον
  choice: lhe pusessem ao redor do pescoço
  rationale: Comunica em português corrente a colocação da pedra em torno do pescoço.
- source_word: βέβληται εἰς τὴν θάλασσαν
  choice: fosse lançado ao mar
  rationale: Reproduz de forma vívida e idiomática o resultado expresso pela forma passiva grega.
theological_decisions:
- issue: Referente de “estes pequeninos”
  choice: Expressão ampla, capaz de incluir crentes vulneráveis ou humildes
  alternative: Crianças especificamente
  rationale: A qualificação “que creem em mim” favorece uma referência mais ampla aos discípulos, embora não exclua crianças; a tradução não força uma identificação mais estreita.
- issue: Sentido de σκανδαλίσῃ
  choice: fizer tropeçar
  alternative: levar a pecar
  rationale: A escolha preserva a metáfora e sua possível abrangência — pecado, queda ou afastamento — sem resolver indevidamente a tensão semântica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pequeninos” preserva a expressão tradicional sem restringi-la a crianças; “pedra de moinho movida por jumento” privilegia clareza histórica.
