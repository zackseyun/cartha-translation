  naturalness: O português é moderno, claro e de registro apropriado. Reposicionar a expressão temporal torna a sequência final mais fluente e inequívoca.
  terminology: «Filho do Homem», «discípulos», «entregue», «homens» e «ressuscitará» são escolhas adequadas e consistentes com o texto-fonte. Não há notas de rodapé nem âncoras a preservar neste rascunho.
