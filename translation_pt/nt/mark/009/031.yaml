  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐδίδασκεν γὰρ τοὺς μαθητὰς αὐτοῦ καὶ ἔλεγεν αὐτοῖς ὅτι Ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἀνθρώπων, καὶ ἀποκτενοῦσιν αὐτόν, καὶ ἀποκτανθεὶς ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/031.yaml
  text: For he was teaching his disciples and telling them[a], “The Son of Man is being handed over into the hands of men, and they will kill him, and after he is killed[b], after three days he will rise.”
translation:
  language: pt
  text: 'Pois ele ensinava seus discípulos e lhes dizia: “O Filho do Homem está sendo entregue nas mãos dos homens, e eles o matarão; depois de ser morto, ressuscitará após três dias.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: ensinava
  rationale: O imperfeito apresenta o ensino como ação contínua ou reiterada no pano de fundo narrativo.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa da conjunção em relação ao contexto anterior.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: seus discípulos
  rationale: “Discípulos” é a forma consagrada e preserva a ideia de aprendizes ligados ao mestre.
- source_word: ἔλεγεν αὐτοῖς
  choice: lhes dizia
  rationale: O imperfeito acompanha “ensinava” e expressa instrução continuada; a formulação é natural em português.
- source_word: Ὁ υἱὸς τοῦ ἀνθρώπου
  choice: O Filho do Homem
  rationale: Preserva a autodesignação tradicional e suas possíveis ressonâncias bíblicas sem parafraseá-la.
- source_word: παραδίδοται
  choice: está sendo entregue
  rationale: O presente passivo sugere uma entrega iminente ou em curso e deixa o agente sem identificação, sem restringir o sentido a “traído”.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: nas mãos dos homens
  rationale: Conserva a imagem concreta de estar sob o poder de outros e o contraste verbal entre “Filho do Homem” e “homens”.
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: eles o matarão
  rationale: Reproduz de modo direto o futuro ativo com agentes humanos não especificados.
- source_word: ἀποκτανθεὶς
  choice: Depois de ser morto
  rationale: O particípio aoristo passivo indica uma ação anterior à ressurreição e preserva explicitamente a voz passiva.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: após três dias
  rationale: μετά com acusativo tem aqui o sentido normal de “depois de”; a tradução evita harmonização com a fórmula “no terceiro dia”.
- source_word: ἀναστήσεται
  choice: ressuscitará
  rationale: O futuro médio tem sentido intransitivo; “ressuscitará” é natural em português e não o transforma em passivo (“será ressuscitado”).
theological_decisions:
- issue: Sentido e voz de παραδίδοται
  choice: está sendo entregue
  alternative: é traído
  rationale: O passivo grego não identifica o agente e pode abranger traição, prisão, ação humana e permissão divina. A tradução mantém essa abertura teológica.
- issue: Contraste entre Ὁ υἱὸς τοῦ ἀνθρώπου e ἀνθρώπων
  choice: O Filho do Homem ... nas mãos dos homens
  alternative: O Filho do Homem ... em mãos humanas
  rationale: A escolha conserva de modo transparente o contraste lexical do grego, sem afirmar que apenas indivíduos masculinos estejam em vista.
- issue: Relação temporal de μετὰ τρεῖς ἡμέρας
  choice: após três dias
  alternative: no terceiro dia
  rationale: Traduz a expressão específica deste versículo sem harmonizá-la silenciosamente com outras formulações das predições da ressurreição.
- issue: Voz de ἀναστήσεται
  choice: ressuscitará
  alternative: será ressuscitado
  rationale: Preserva o valor intransitivo da forma média neste texto, sem importar a voz passiva usada em outras passagens.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo narrativo dos imperfeitos, a imagem idiomática das “mãos” e a repetição temporal do grego sem tornar a frase excessivamente artificial.
