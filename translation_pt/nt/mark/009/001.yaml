id: MRK.9.1
reference: Mark 9:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι εἰσίν τινες ⸂τῶν ὧδε⸃ ἑστηκότων οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ ἐληλυθυῖαν ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/001.yaml
  text: And he was saying to them[a], “Truly I say to you[d][c][b], there are some standing here who will certainly not taste death until they see the kingdom of God having come in power.”
translation:
  language: pt
  text: 'E dizia-lhes: “Em verdade lhes digo: alguns dos que estão aqui de modo nenhum provarão a morte[a] até que vejam o reino de Deus já chegado com poder[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Provar a morte” é uma expressão idiomática que significa “experimentar a morte” ou “morrer”.
    reason: lexical_alternative
  - marker: b
    text: A expressão “o reino de Deus já chegado com poder” pode ser relacionada à transfiguração, à ressurreição e exaltação de Jesus, ao Pentecostes, ao juízo sobre Jerusalém ou à consumação futura do reino; o próprio texto não especifica qual acontecimento está em vista.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: dizia-lhes
  rationale: O imperfeito indica uma ação discursiva em andamento no contexto narrativo; “dizia-lhes” preserva esse aspecto sem deixar de ser idiomático em português.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Em verdade lhes digo
  rationale: A fórmula solene introdutória é expressa de modo natural e digno; “em verdade” comunica a força discursiva de Ἀμήν sem depender de mera transliteração.
- source_word: τινες τῶν ὧδε ἑστηκότων
  choice: alguns dos que estão aqui
  rationale: 'A formulação conserva claramente o sentido partitivo: trata-se de alguns dentre os presentes.'
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: de modo nenhum provarão a morte
  rationale: “De modo nenhum” representa a forte negação οὐ μή, enquanto “provarão a morte” mantém a metáfora grega, esclarecida em nota.
- source_word: ἕως ἂν ἴδωσιν
  choice: até que vejam
  rationale: Reproduz de modo direto a construção temporal voltada para um acontecimento futuro.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: o reino de Deus
  rationale: “Reino de Deus” é a expressão consagrada e preserva tanto o governo divino quanto sua dimensão escatológica, sem restringir βασιλεία a apenas um desses aspectos.
- source_word: ἐληλυθυῖαν
  choice: já chegado
  rationale: O particípio perfeito descreve o reino como tendo chegado e estando presente nessa condição; “já chegado” procura conservar esse valor resultativo.
- source_word: ἐν δυνάμει
  choice: com poder
  rationale: “Com poder” é natural em português e comunica a manifestação de poder sem especificar indevidamente sua forma.
theological_decisions:
- issue: O acontecimento ao qual se refere a chegada do reino de Deus com poder
  choice: Manter a referência sem identificar um acontecimento específico
  alternative: Identificá-la com a transfiguração, a ressurreição e exaltação, o Pentecostes, o juízo sobre Jerusalém ou a consumação futura
  rationale: O grego não nomeia explicitamente o acontecimento em vista. A tradução preserva essa abertura interpretativa, em vez de resolver no texto uma questão teológica disputada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se o imperfeito narrativo, a forte negação, a metáfora de “provar a morte” e o valor resultativo do particípio perfeito, sem eliminar a ambiguidade escatológica do versículo.
source_grounding:
  english_pob_role: consult_only
