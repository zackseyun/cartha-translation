  text: For everyone will be salted with fire[a][b].
translation:
  language: pt
  text: Pois todos serão salgados com fogo[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “temperados com fogo”. A imagem pode evocar juízo, purificação ou linguagem sacrificial; compare Levítico 2:13.'
    reason: lexical_alternative
  - marker: b
    text: 'Alguns manuscritos acrescentam: “e todo sacrifício será salgado com sal”.'
    reason: textual_variant
lexical_decisions:
- source_word: Πᾶς
  choice: todos
  rationale: O adjetivo masculino singular, usado substantivamente, refere-se naturalmente a cada pessoa. Em português, “todos” expressa essa referência coletiva de modo claro no contexto.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa de γάρ e liga o versículo à advertência anterior.
- source_word: πυρὶ
  choice: com fogo
  rationale: A preposição “com” preserva razoavelmente a abertura do dativo grego quanto a meio ou elemento, sem decidir entre “pelo fogo” e “no fogo”.
- source_word: ἁλισθήσεται
  choice: serão salgados
  rationale: Reproduz diretamente o futuro passivo de ἁλίζω e conserva a imagem deliberadamente incomum, sem reduzi-la a uma interpretação específica.
theological_decisions:
- issue: Sentido da metáfora “salgados com fogo”
  choice: Conservar a formulação metafórica sem definir se ela indica principalmente juízo, purificação, sacrifício ou prova no discipulado.
  alternative: Explicitar uma única leitura, como “purificados pelo fogo”, “julgados pelo fogo” ou “consagrados como sacrifício”.
  rationale: O grego é conciso e alusivo, e o contexto permite mais de uma associação. A tradução preserva essa tensão teológica genuína.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A construção incomum “salgados com fogo” foi mantida intencionalmente por refletir a imagem marcante e ambígua do original.
