  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂Καὶ καταβαινόντων⸃ αὐτῶν ⸀ἐκ τοῦ ὄρους διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸂ἃ εἶδον διηγήσωνται⸃, εἰ μὴ ὅταν ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ἀναστῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/009.yaml
  text: And as they were coming down from the mountain[a], he ordered them to tell no one what they had seen[b], except when the Son of Man had risen from among the dead.
translation:
  language: pt
  text: Enquanto desciam do monte, ele lhes ordenou que não contassem a ninguém o que tinham visto, a não ser quando[a] o Filho do Homem ressuscitasse dentre os mortos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “até que”.'
    reason: alternative_reading
  - marker: b
    text: A expressão grega indica literalmente a saída “do meio dos mortos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: Enquanto desciam do monte
  rationale: O particípio presente em genitivo absoluto indica uma ação em curso e simultânea à ordem de Jesus. “Enquanto desciam” preserva essa relação temporal em português natural.
- source_word: διεστείλατο
  choice: ordenou
  rationale: O verbo expressa uma determinação ou instrução firme. “Ordenou” mantém sua força sem recorrer a uma formulação arcaica.
- source_word: ἵνα μηδενὶ ἃ εἶδον διηγήσωνται
  choice: que não contassem a ninguém o que tinham visto
  rationale: A formulação comunica naturalmente em português o conteúdo da ordem. “Tinham visto” situa a visão antes da ordem, e “contassem” traduz com clareza o ato de relatar.
- source_word: εἰ μὴ ὅταν
  choice: a não ser quando
  rationale: A expressão preserva de perto a forma grega de exceção ligada a um momento futuro. A alternativa idiomática “até que” é registrada em nota.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a conhecida autodesignação de Jesus e suas ressonâncias bíblicas, sem a reduzir a uma expressão antropológica genérica.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: “Dentre os mortos” comunica que ele se levantaria do meio dos que estão mortos, preservando a nuance de ἐκ com o plural νεκρῶν.
- source_word: ἀναστῇ
  choice: ressuscitasse
  rationale: O aoristo do subjuntivo após ὅταν aponta para um acontecimento futuro em relação à ordem. O pretérito imperfeito do subjuntivo é natural após “quando” no discurso indireto em português.
theological_decisions:
- issue: Tradução de ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  alternative: o Ser Humano
  rationale: A tradução tradicional continua compreensível e preserva tanto o caráter de título quanto as possíveis alusões a Daniel, sem impor uma interpretação específica.
- issue: Força temporal de εἰ μὴ ὅταν
  choice: a não ser quando
  alternative: até que
  rationale: A escolha mantém a estrutura de exceção do grego e sua tensão temporal; a nota oferece a formulação portuguesa mais idiomática sem substituir silenciosamente a forma do texto-fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das palavras foi ajustada à sintaxe natural do português, mantendo a progressão narrativa, a firmeza da ordem e a expressão cristológica tradicional.
