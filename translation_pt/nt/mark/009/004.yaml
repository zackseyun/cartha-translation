source:
  edition: SBLGNT
  text: καὶ ὤφθη αὐτοῖς Ἠλίας σὺν Μωϋσεῖ, καὶ ἦσαν συλλαλοῦντες τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/004.yaml
  text: And Elijah appeared to them with Moses[a], and they were talking with Jesus.
translation:
  language: pt
  text: E Elias lhes apareceu com Moisés, e os dois estavam conversando com Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: estavam falando com Jesus.'
    reason: Alternativa lexical para συλλαλοῦντες; “falando com” é possível, embora “conversando com” expresse melhor o caráter recíproco do verbo.
lexical_decisions:
- source_word: ὤφθη
  choice: apareceu
  rationale: O aoristo passivo de ὁράω tem aqui sentido intransitivo de tornar-se visível ou aparecer; “apareceu” é natural em português e corresponde ao caráter repentino da cena.
- source_word: αὐτοῖς
  choice: lhes
  rationale: O pronome dativo identifica as pessoas às quais Elias apareceu. “Lhes apareceu” preserva de modo claro e idiomático essa relação.
- source_word: Ἠλίας σὺν Μωϋσεῖ
  choice: Elias ... com Moisés
  rationale: Mantém os nomes tradicionais em português e traduz diretamente a ideia de acompanhamento expressa por σύν.
- source_word: ἦσαν συλλαλοῦντες
  choice: estavam conversando
  rationale: A construção perifrástica indica uma ação em andamento, e συλλαλέω descreve fala recíproca; “estavam conversando” comunica ambos os aspectos em português atual.
- source_word: τῷ Ἰησοῦ
  choice: com Jesus
  rationale: Embora formalmente dativo, com συλλαλέω indica o interlocutor; “com Jesus” expressa naturalmente a reciprocidade da conversa.
- source_word: ἦσαν
  choice: os dois estavam
  rationale: O sujeito plural retoma Elias e Moisés. A explicitação “os dois” evita em português uma possível leitura segundo a qual o pronome “eles” se referiria aos discípulos, sem acrescentar participantes à cena.
theological_decisions:
- issue: Identidade e realidade de Elias e Moisés na transfiguração
  choice: Apresentar diretamente Elias e Moisés como aparecendo e conversando com Jesus
  alternative: Qualificar a aparição como apenas visionária ou como representação simbólica
  rationale: A narrativa grega apresenta as personagens sem qualificação interpretativa. A tradução conserva essa afirmação e não decide questões teológicas que o versículo não explica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem básica do grego foi preservada, e “os dois” foi usado para dar clareza ao sujeito plural sem alterar o conteúdo.
