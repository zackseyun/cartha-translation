source:
  edition: SBLGNT
  text: οἱ δὲ ἐσιώπων, πρὸς ἀλλήλους γὰρ διελέχθησαν ἐν τῇ ὁδῷ τίς μείζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/034.yaml
  text: But they kept silent[a], because on the road they had argued with one another about who was greater.
translation:
  language: pt
  text: Mas eles ficaram calados, pois, no caminho, haviam discutido entre si sobre quem era maior.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quem era o maior”. Muitas traduções empregam aqui o superlativo de modo idiomático, mas o adjetivo grego está no comparativo: “maior”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπων
  choice: ficaram calados
  rationale: O imperfeito retrata o silêncio mantido em resposta à pergunta de Jesus; em português, “ficaram calados” expressa com naturalidade essa reação continuada.
- source_word: διελέχθησαν
  choice: haviam discutido
  rationale: O contexto de rivalidade por posição favorece “discutido”, que pode indicar confronto sem exagerar para uma briga aberta. O mais-que-perfeito composto situa a discussão antes do silêncio narrado.
- source_word: πρὸς ἀλλήλους
  choice: entre si
  rationale: Preserva de modo idiomático e conciso o sentido recíproco da expressão grega.
- source_word: ἐν τῇ ὁδῷ
  choice: no caminho
  rationale: É uma expressão portuguesa natural para o contexto de viagem e corresponde ao sentido locativo do grego.
- source_word: τίς μείζων
  choice: quem era maior
  rationale: Mantém o comparativo μείζων, sem transformá-lo silenciosamente no superlativo idiomático “o maior”.
- source_word: οἱ δὲ
  choice: Mas eles
  rationale: δέ marca contraste leve entre a pergunta anterior de Jesus e a reação dos discípulos.
- source_word: γὰρ
  choice: pois
  rationale: Introduz com clareza a razão do silêncio, em registro natural e digno.
theological_decisions:
- issue: Comparativo μείζων versus formulação superlativa idiomática
  choice: quem era maior
  alternative: quem era o maior
  rationale: O grego emprega explicitamente o comparativo. A tradução o preserva, mantendo a forma e a tensão da disputa por posição sem substituí-la pela formulação tradicional no superlativo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem perder a relação causal nem a anterioridade da discussão.
