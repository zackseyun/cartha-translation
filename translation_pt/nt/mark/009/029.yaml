  text: καὶ εἶπεν αὐτοῖς· Τοῦτο τὸ γένος ἐν οὐδενὶ δύναται ἐξελθεῖν εἰ μὴ ἐν ⸀προσευχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/029.yaml
  text: And he said to them[a], “This kind cannot come out by anything except prayer.”
translation:
  language: pt
  text: 'E ele lhes disse: “Esse tipo não pode sair por nenhum meio, a não ser pela oração.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos posteriores trazem: “pela oração e pelo jejum”.'
    reason: textual_variant
lexical_decisions:
- source_word: Τοῦτο τὸ γένος
  choice: Esse tipo
  rationale: γένος designa aqui uma espécie ou categoria. O contexto indica um espírito impuro, mas o grego não repete explicitamente “espírito”; “esse tipo” preserva a concisão e a referência contextual.
- source_word: ἐν οὐδενὶ
  choice: por nenhum meio
  rationale: A construção com ἐν expressa meio ou instrumento. “Por nenhum meio” é natural em português e mantém a negação enfática sem sugerir que se trate de um objeto.
- source_word: δύναται ἐξελθεῖν
  choice: não pode sair
  rationale: A expressão indica incapacidade. “Sair” é claro e idiomático no contexto da saída de um espírito impuro.
- source_word: εἰ μὴ
  choice: a não ser
  rationale: Introduz a única exceção à afirmação negativa anterior; “a não ser” reproduz essa relação de maneira natural.
- source_word: ἐν προσευχῇ
  choice: pela oração
  rationale: O uso de ἐν indica o meio pelo qual isso pode ocorrer. “Pela oração” conserva explicitamente o valor instrumental.
theological_decisions:
- issue: Inclusão de “e jejum”
  choice: Somente “oração” no texto principal
  alternative: “oração e jejum”
  rationale: O texto da SBLGNT traz apenas προσευχῇ (“oração”). A leitura mais longa, “oração e jejum”, pertence a uma tradição manuscrita posterior; por isso, é registrada em nota, mas não incorporada ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva a referência implícita de “esse tipo” e torna explícito o valor instrumental de ἐν por meio de “pela oração”.
