  text: καὶ ⸂ἀπεκρίθη αὐτῷ εἷς ἐκ τοῦ ὄχλου⸃· Διδάσκαλε, ἤνεγκα τὸν υἱόν μου πρὸς σέ, ἔχοντα πνεῦμα ἄλαλον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/017.yaml
  text: And one from the crowd answered him[a], “Teacher, I brought my son to you, having a mute spirit.”
translation:
  language: pt
  text: 'E um da multidão lhe respondeu: “Mestre, eu trouxe a ti o meu filho, que tem um espírito mudo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o meu filho, com um espírito mudo”.'
    reason: Alternativa mais compacta para o particípio ἔχοντα; a redação principal explicita seu referente por meio de uma oração relativa.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: Verbo narrativo comum que preserva naturalmente a ideia de resposta no contexto.
- source_word: εἷς ἐκ τοῦ ὄχλου
  choice: um dos que estavam na multidão
  rationale: Expressa com naturalidade a construção partitiva e não acrescenta explicitamente ‘homem’, termo ausente do grego.
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: Forma vocativa corrente e digna em português para quem ensina; neste contexto, comunica adequadamente o sentido de διδάσκαλος.
- source_word: ἤνεγκα
  choice: eu trouxe
  rationale: O pretérito perfeito traduz de modo natural o aoristo e situa a ação como concluída.
- source_word: τὸν υἱόν μου
  choice: o meu filho
  rationale: Preserva a relação familiar explicitada por υἱός, sem substituir o termo por ‘menino’ ou ‘criança’.
- source_word: πρὸς σέ
  choice: a ti
  rationale: Reproduz o destinatário do movimento indicado por πρός e mantém o tratamento direto no singular.
- source_word: ἔχοντα
  choice: que tem
  rationale: A oração relativa identifica com clareza o filho como referente do particípio, mantendo a relação sintática sem tornar a frase artificial em português.
- source_word: πνεῦμα ἄλαλον
  choice: um espírito mudo
  rationale: Tradução direta que conserva tanto ‘espírito’ quanto o adjetivo ‘mudo’, sem explicitar além do texto a natureza maligna do espírito ou o modo exato da aflição.
theological_decisions:
- issue: Natureza de πνεῦμα no relato
  choice: espírito
  alternative: espírito maligno ou demônio
  rationale: O contexto de exorcismo sugere um espírito maligno, mas este versículo diz apenas ‘espírito’; a tradução preserva essa formulação e não acrescenta uma identificação explícita.
- issue: Relação entre o espírito e a incapacidade de falar
  choice: espírito mudo
  alternative: espírito que o impede de falar
  rationale: A redação mantém a atribuição gramatical de ἄλαλον ao espírito e evita converter a expressão em uma explicação causal que, embora plausível no contexto, não é explicitada nesta frase.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. ‘Mestre’ é idiomático no uso bíblico e corrente; ‘a ti’ preserva o tratamento singular e confere leve solenidade sem arcaísmo excessivo.
