source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ ὀφθαλμός σου σκανδαλίζῃ σε, ἔκβαλε αὐτόν· καλόν ⸀σέ ἐστιν μονόφθαλμον εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς ⸀τὴν ⸀γέενναν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/047.yaml
  text: And if your eye causes you to stumble[a], throw it out. It is better for you to enter the kingdom of God with one eye than, having two eyes, to be thrown into Gehenna,
translation:
  language: pt
  text: E, se o seu olho faz você tropeçar, jogue-o fora. É melhor você entrar no Reino de Deus com um só olho do que, tendo dois olhos, ser lançado na Geena[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “inferno”. O grego traz “Geena”, termo ligado ao vale de Hinom e usado para o juízo escatológico.
    reason: Preservar no texto o termo grego específico e informar o equivalente tradicional amplamente conhecido.
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: faz você tropeçar
  rationale: Preserva a metáfora de tropeço do verbo grego, que neste contexto aponta para cair em pecado, sem reduzir o sentido apenas a uma formulação moral abstrata.
- source_word: ἔκβαλε
  choice: jogue-o fora
  rationale: Traduz diretamente a força do imperativo de ἐκβάλλω, sem acrescentar a ideia mais específica de arrancar, que não está expressa no verbo.
- source_word: καλόν ... ἤ
  choice: É melhor ... do que
  rationale: Embora καλόν signifique literalmente “bom”, a construção contrastiva com ἤ pede em português a forma comparativa idiomática “melhor... do que”.
- source_word: μονόφθαλμον
  choice: com um só olho
  rationale: Expressa de modo natural e concreto o sentido de “caolho” ou “com um olho”, evitando uma palavra que pode soar pejorativa ou menos clara.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: Reino de Deus
  rationale: Formulação transparente e consagrada, que mantém o peso teológico e a estrutura da expressão grega.
- source_word: βληθῆναι
  choice: ser lançado
  rationale: Reproduz o infinitivo passivo de βάλλω com uma formulação natural e digna em português.
- source_word: γέενναν
  choice: Geena
  rationale: Mantém o termo específico usado no grego, ligado ao vale de Hinom e à linguagem judaica de juízo escatológico, em vez de fundi-lo silenciosamente com o termo mais geral “inferno”.
theological_decisions:
- issue: Tradução de γέεννα no contexto de juízo
  choice: Geena
  alternative: inferno
  rationale: O texto emprega o termo específico γέεννα. “Geena” preserva sua identidade histórica e seu uso escatológico, enquanto “inferno” é oferecido em nota como equivalente tradicional e mais conhecido.
- issue: Amplitude de σκανδαλίζω
  choice: faz você tropeçar
  alternative: faz você pecar
  rationale: A opção escolhida conserva a imagem verbal do original e sua tensão metafórica; o contexto deixa claro que se trata de um tropeço moral, sem tornar explícito mais do que o grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação pronominal e o uso de “você” favorecem naturalidade contemporânea; “Reino de Deus” e “ser lançado” mantêm o registro bíblico sem arcaísmo. A vírgula final foi preservada porque o versículo continua sintaticamente no versículo seguinte.
