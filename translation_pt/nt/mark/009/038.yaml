id: MRK.9.38
reference: Mark 9:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂Ἔφη αὐτῷ ὁ Ἰωάννης⸃· Διδάσκαλε, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, ⸂καὶ ἐκωλύομεν αὐτόν, ὅτι οὐκ ἠκολούθει ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/038.yaml
  text: John said to him[a], “Teacher, we saw someone casting out demons in your name, and we tried to stop him because he was not following us.”
translation:
  language: pt
  text: 'João lhe disse: “Mestre, vimos alguém expulsando demônios em seu nome e tentamos impedi-lo[a], porque ele não nos seguia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “procurávamos impedi-lo”. O imperfeito grego pode indicar ação contínua, repetida ou tentada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔφη αὐτῷ ὁ Ἰωάννης
  choice: João lhe disse
  rationale: O verbo narrativo ἔφη é expresso naturalmente pelo pretérito perfeito “disse”; αὐτῷ é preservado pelo pronome “lhe”, e o sujeito explícito é mantido.
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: “Mestre” é a forma vocativa tradicional e corrente em português para διδάσκαλος no contexto dos Evangelhos, comunicando a função de quem ensina.
- source_word: εἴδομέν τινα
  choice: vimos alguém
  rationale: τινα é indefinido e não exige especificação adicional; “alguém” reproduz essa indefinição com naturalidade.
- source_word: ἐν τῷ ὀνόματί σου
  choice: em seu nome
  rationale: Preserva a expressão bíblica e a ideia de agir invocando ou sob a autoridade de Jesus, sem restringir o sentido a mero uso verbal do nome.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: expulsando demônios
  rationale: “Expulsar demônios” é uma formulação clara, natural e precisa para a atividade exorcística indicada por ἐκβάλλω.
- source_word: καὶ ἐκωλύομεν αὐτόν
  choice: e tentamos impedi-lo
  rationale: O imperfeito pode apresentar ação em curso, repetida ou tentada. No contexto, “tentamos impedi-lo” é natural e preserva essa nuance sem afirmar que a ação foi concluída.
- source_word: ὅτι οὐκ ἠκολούθει ἡμῖν
  choice: porque ele não nos seguia
  rationale: Traduz diretamente ἡμῖν por “nos” e conserva a ênfase potencialmente significativa de João no grupo dos discípulos.
theological_decisions:
- issue: Referente da lealdade do homem na oração final
  choice: porque ele não nos seguia
  alternative: porque ele não seguia o senhor / porque ele não era do nosso grupo
  rationale: O grego traz explicitamente ἡμῖν, “a nós”. A tradução direta preserva a tensão narrativa entre a preocupação de João com os limites do grupo e a resposta de Jesus no contexto seguinte.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Mestre”, “em seu nome” e “expulsando demônios” preservam o registro reconhecível dos Evangelhos sem arcaísmo. A colocação pronominal “impedi-lo” mantém naturalidade no texto escrito.
