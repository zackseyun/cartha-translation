id: MRK.9.11
reference: Mark 9:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτων αὐτὸν λέγοντες· Ὅτι λέγουσιν οἱ γραμματεῖς ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/011.yaml
  text: And they were asking him[a], saying, “Why do the scribes say that Elijah must come first?”
translation:
  language: pt
  text: 'E eles lhe perguntavam: “Por que[a] os escribas dizem que Elias deve vir primeiro?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como é que os escribas dizem que Elias deve vir primeiro?”'
    reason: Alternativa lexical para a força interrogativa de ὅτι.
lexical_decisions:
- source_word: ἐπηρώτων
  choice: perguntavam
  rationale: O imperfeito indica uma ação em andamento ou reiterada no relato; “perguntavam” preserva esse aspecto com naturalidade em português.
- source_word: λέγοντες
  choice: introduzido diretamente pela fala citada
  rationale: Embora corresponda literalmente a “dizendo”, o português natural permite que os dois-pontos introduzam o conteúdo da pergunta sem perda de sentido.
- source_word: Ὅτι
  choice: Por que
  rationale: Neste contexto interrogativo, ὅτι introduz idiomaticamente uma pergunta equivalente a “por que” ou “como é que”; “Por que” comunica o sentido de modo claro e corrente.
- source_word: γραμματεῖς
  choice: escribas
  rationale: “Escribas” é o termo histórico tradicional e suficientemente compreensível, sem ampliar interpretativamente a função do grupo.
- source_word: Ἠλίαν
  choice: Elias
  rationale: Forma consagrada do nome próprio em português.
- source_word: δεῖ
  choice: deve
  rationale: Expressa necessidade e preserva, sem explicitação adicional, a força da expectativa profética ou escriturística no contexto.
- source_word: ἐλθεῖν
  choice: vir
  rationale: Depois de δεῖ, “vir” é a formulação natural em português para o advento esperado de Elias.
- source_word: πρῶτον
  choice: primeiro
  rationale: Mantém diretamente a prioridade temporal indicada pelo grego.
theological_decisions:
- issue: Força da pergunta introduzida por Ὅτι
  choice: Pergunta direta com “Por que”
  alternative: “Como é que os escribas dizem...”
  rationale: A formulação comunica claramente a força interrogativa, enquanto a alternativa mais próxima da construção grega é preservada em nota.
- issue: Natureza da vinda de Elias
  choice: “Elias deve vir primeiro” sem expansão interpretativa
  alternative: “Elias deve voltar primeiro” ou “Elias deve vir antes do Messias”
  rationale: O grego afirma somente que Elias deve vir primeiro; acrescentar “voltar” ou identificar explicitamente o acontecimento subsequente resolveria conteúdo que o versículo deixa implícito.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A conjunção inicial “E” e o aspecto durativo do imperfeito foram preservados; o particípio λέγοντες foi vertido idiomaticamente por pontuação, evitando o pouco natural “perguntavam, dizendo”.
