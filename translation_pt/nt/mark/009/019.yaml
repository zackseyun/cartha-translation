  text: ὁ δὲ ἀποκριθεὶς ⸀αὐτοῖς λέγει· Ὦ γενεὰ ἄπιστος, ἕως πότε πρὸς ὑμᾶς ἔσομαι; ἕως πότε ἀνέξομαι ὑμῶν; φέρετε αὐτὸν πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/019.yaml
  text: And answering them[a], he says, “O unbelieving generation[b], how long will I be with you? How long will I put up with you? Bring him to me.”
translation:
  language: pt
  text: 'Ele, porém, respondendo-lhes, diz: “Ó geração incrédula[a], até quando estarei com vocês? Até quando os suportarei[b]? Tragam-no até mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “geração sem fé” ou “geração infiel”. O termo grego pode indicar falta de fé ou falta de fidelidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “Até quando os tolerarei?” ou “Até quando terei paciência com vocês?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: respondendo a eles, diz
  rationale: Preserva o particípio e o presente histórico característico de Marcos, com formulação natural em português.
- source_word: γενεὰ ἄπιστος
  choice: geração incrédula
  rationale: No contexto, expressa primariamente falta de fé ou confiança; a possível nuance de infidelidade é preservada em nota.
- source_word: ἕως πότε πρὸς ὑμᾶς ἔσομαι
  choice: até quando estarei com vocês?
  rationale: Reproduz com naturalidade a pergunta temporal e a ideia de permanência junto aos interlocutores.
- source_word: ἀνέξομαι ὑμῶν
  choice: até quando terei de suportá-los?
  rationale: Comunica a ideia de tolerar ou aguentar alguém, preservando a exasperação da fala sem recorrer a expressão excessivamente coloquial.
- source_word: φέρετε αὐτὸν πρός με
  choice: Tragam-no a mim
  rationale: Traduz diretamente o imperativo plural e o movimento do menino em direção a Jesus.
theological_decisions:
- issue: Sentido de ἄπιστος na repreensão de Jesus
  choice: incrédula
  alternative: sem fé; infiel
  rationale: “Incrédula” comunica a falta de fé ou confiança mais evidente no contexto, enquanto a nota mantém aberta a possível nuance de falta de fidelidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” expressa claramente o plural de ὑμᾶς; “suportá-los” evita tanto rigidez excessiva quanto coloquialismo inadequado.
