  text: οὐ γὰρ ᾔδει τί ⸀ἀποκριθῇ, ⸂ἔκφοβοι γὰρ ἐγένοντο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/006.yaml
  text: For he did not know what he should answer[b][a], for they were terrified.
translation:
  language: pt
  text: Pois ele não sabia o que responder, porque eles ficaram apavorados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ ... ᾔδει
  choice: não sabia
  rationale: οἶδα expressa conhecimento ou percepção; com a negação, «não sabia» é a forma natural e exata em português.
- source_word: τί ἀποκριθῇ
  choice: o que responder
  rationale: ἀποκρίνομαι significa responder; a construção deliberativa é expressa com naturalidade pelo infinitivo em português.
- source_word: ἔκφοβοι
  choice: apavorados
  rationale: O adjetivo intensifica a ideia de medo; «apavorados» comunica essa força em linguagem atual.
- source_word: ἐγένοντο
  choice: ficaram
  rationale: γίνομαι indica entrada em um estado; «ficaram apavorados» preserva esse aspecto de modo idiomático.
- source_word: γὰρ ... γὰρ
  choice: pois ... porque
  rationale: As duas partículas introduzem explicações sucessivas. Variar entre «pois» e «porque» preserva as relações lógicas sem produzir uma repetição pouco natural.
theological_decisions:
- issue: Sujeito da oração no plural
  choice: todos ficaram apavorados
  alternative: ele ficou apavorado
  rationale: O adjetivo ἔκφοβοι e o verbo ἐγένοντο estão no plural. «Todos» torna explícita em português a referência contextual a Pedro e seus companheiros, sem reduzir o sujeito a Pedro.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução mantém a progressão explicativa do grego e distingue o singular «ele» do sujeito plural da oração final.
