id: MRK.9.43
reference: Mark 9:43
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐὰν ⸀σκανδαλίζῃ σε ἡ χείρ σου, ἀπόκοψον αὐτήν· καλόν ⸂ἐστίν σε⸃ κυλλὸν ⸂εἰσελθεῖν εἰς τὴν ζωὴν⸃ ἢ τὰς δύο χεῖρας ἔχοντα ἀπελθεῖν εἰς τὴν γέενναν, εἰς τὸ πῦρ τὸ ⸀ἄσβεστον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/043.yaml
  text: And if your hand causes you to stumble[a], cut it off. It is better for you to enter into life crippled than, having two hands, to go away into Gehenna[b], into the unquenchable fire.
translation:
  language: pt
  text: E, se a sua mão faz você tropeçar[a], corte-a. É melhor entrar na vida mutilado do que, tendo as duas mãos, ir para a Geena[b], para o fogo que não se apaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faz você pecar”. O verbo grego pode significar fazer alguém tropeçar, cair ou pecar.'
    reason: lexical_alternative
  - marker: b
    text: Geena é a forma grega de um nome de lugar associado ao juízo divino; tradicionalmente traduzida como “inferno”.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: faz você tropeçar
  rationale: Preserva a metáfora de tropeço do grego e sua amplitude, que no contexto pode incluir levar ao pecado, sem restringi-la indevidamente no texto principal.
- source_word: ἀπόκοψον
  choice: corte-a
  rationale: Reproduz de forma direta e enfática o imperativo aoristo e mantém a severidade concreta da imagem.
- source_word: καλόν
  choice: é melhor
  rationale: Embora καλόν signifique literalmente 'bom', a construção comparativa com ἤ pede naturalmente 'melhor' em português.
- source_word: κυλλόν
  choice: com uma só mão
  rationale: No contexto específico da mão cortada, esta formulação natural comunica a condição indicada por κυλλός sem recorrer a termos potencialmente pejorativos ou menos precisos; a ideia de mutilação permanece explícita na frase anterior.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: entrar na vida
  rationale: Mantém a expressão escatológica e solene do original em português natural.
- source_word: ἀπελθεῖν
  choice: ir
  rationale: Em português, 'ir para a Geena' expressa naturalmente o movimento e o destino; 'ir embora para' seria menos idiomático neste contexto.
- source_word: γέενναν
  choice: Geena
  rationale: Usa a forma portuguesa tradicional do topônimo grego, preservando a referência judaica específica em vez de substituí-la diretamente pelo conceito mais amplo de 'inferno'.
- source_word: ἄσβεστον
  choice: que não se apaga
  rationale: Equivalente claro e corrente de 'inextinguível', preservando a afirmação enfática do grego.
- source_word: χεὶρ σου
  choice: a sua mão
  rationale: Tradução direta que mantém a imagem corporal central à advertência.
- source_word: τὰς δύο χεῖρας ἔχοντα
  choice: tendo as duas mãos
  rationale: Conserva explicitamente o contraste do original entre entrar na vida privado de uma mão e seguir para o juízo com ambas.
theological_decisions:
- issue: Tradução de γέεννα em uma declaração de juízo
  choice: Geena
  alternative: inferno
  rationale: Preserva o topônimo e a imagem histórica específica do texto grego, sem identificar silenciosamente o termo com todas as associações posteriores de 'inferno'; a alternativa comum aparece em nota.
- issue: Força da imagem de cortar a mão
  choice: Manter a linguagem corporal concreta sem explicá-la no texto principal
  alternative: Parafrasear como uma exortação geral a evitar o pecado
  rationale: A formulação chocante pertence à retórica do versículo. Explicá-la ou suavizá-la resolveria uma tensão que o próprio texto mantém.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação pronominal e o uso de “você” favorecem naturalidade contemporânea. “Com uma só mão” evita um rótulo dirigido a pessoas com deficiência e comunica precisamente a imagem contextual, enquanto “Geena” mantém a especificidade do termo-fonte.
