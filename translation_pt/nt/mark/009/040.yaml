  text: ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ἡμῶν, ὑπὲρ ἡμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/040.yaml
  text: For whoever is not against us is for us[a].
translation:
  language: pt
  text: Pois quem não é contra nós é a nosso favor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “está do nosso lado”. A expressão grega também pode ter o sentido de “age em nosso benefício” ou “em nosso favor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: quem
  rationale: O pronome relativo tem sentido genérico e substantivado; “quem” expressa isso de modo natural e conciso em português.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e preserva de modo claro a ligação argumentativa.
- source_word: οὐκ ἔστιν
  choice: não é
  rationale: Reproduz diretamente a cópula negada no presente, sem ampliação desnecessária.
- source_word: καθ’ ἡμῶν
  choice: contra nós
  rationale: κατά com o genitivo indica oposição; “contra nós” é claro e mantém a formulação relacional do grego.
- source_word: ὑπὲρ ἡμῶν
  choice: a nosso favor
  rationale: ὑπέρ com o genitivo pode indicar apoio, benefício ou representação. “A nosso favor” forma uma antítese natural com “contra nós” e evita a possível leitura instrumental de “por nós” em português.
- source_word: ἐστιν
  choice: é
  rationale: Traduz diretamente a cópula que completa a antítese.
theological_decisions:
- issue: Alcance do alinhamento expresso por “contra nós” e “a nosso favor”
  choice: Manter a linguagem relacional na primeira pessoa do plural, sem explicitar o objeto ou o alcance desse alinhamento.
  alternative: “Quem não se opõe à nossa missão está do nosso lado” ou “quem não é contra Deus é a favor de Deus”.
  rationale: O grego diz literalmente “nós” e não define aqui o alinhamento como sendo diretamente com Deus, com o Reino ou com a missão. A tradução preserva a tensão e deixa que o contexto determine o alcance.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Pois” mantém a conexão explicativa; “a nosso favor” conserva o paralelismo antitético sem soar arcaico. O marcador [a] aparece no texto principal.
