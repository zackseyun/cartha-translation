source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Πέτρος λέγει τῷ Ἰησοῦ· Ῥαββί, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν ⸂τρεῖς σκηνάς⸃, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/005.yaml
  text: 'And Peter answered and said to Jesus[a], “Rabbi, it is good for us to be here, and let us make three shelters: one for you, one for Moses, and one for Elijah.”'
translation:
  language: pt
  text: 'Pedro tomou a palavra e disse a Jesus: “Rabi, é bom estarmos aqui. Façamos três abrigos[a]: um para ti, um para Moisés e um para Elias.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tendas”, “cabanas” ou “tabernáculos”. A palavra grega se refere a abrigos temporários e pode evocar essas imagens, mas o versículo não torna explícita tal associação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... λέγει
  choice: tomou a palavra e disse
  rationale: A combinação é uma fórmula narrativa que introduz uma fala, mesmo sem pergunta anterior. Esta tradução evita o pouco natural “respondeu e disse” e verte o presente histórico λέγει pelo passado, de modo corrente em narrativa portuguesa.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Mantém o título semítico de tratamento e seu caráter respeitoso, sem substituí-lo pela explicação mais geral “Mestre”.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: é bom estarmos aqui
  rationale: Reproduz de modo natural a avaliação de Pedro e conserva o sentido sóbrio de καλόν, sem intensificá-lo como “maravilhoso”.
- source_word: ποιήσωμεν
  choice: Façamos
  rationale: O subjuntivo hortativo de primeira pessoa propõe uma ação conjunta. “Façamos” preserva tanto essa força quanto o sentido básico de ποιέω, sem especificar excessivamente o modo de construção.
- source_word: σκηνάς
  choice: abrigos
  rationale: O termo pode indicar estruturas temporárias, como tendas ou cabanas. “Abrigos” comunica o sentido básico em linguagem atual e não torna explícita uma associação cultual que o versículo apenas pode sugerir.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: um para ti, um para Moisés e um para Elias
  rationale: Conserva a repetição distributiva de μίαν e a estrutura paralela do grego.
theological_decisions:
- issue: Possíveis conotações festivas ou cultuais de σκηνάς
  choice: Usar “abrigos” no texto principal
  alternative: “tendas”, “cabanas” ou “tabernáculos”
  rationale: O termo pode evocar a Festa das Cabanas ou imagens do tabernáculo, mas o versículo não identifica explicitamente as estruturas dessa maneira. A tradução principal permanece neutra, e a nota preserva as alternativas relevantes.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Rabi” preserva o ambiente semítico; “ti” mantém de forma concisa o paralelismo dos três destinatários. A fórmula narrativa foi naturalizada sem eliminar sua função discursiva.
