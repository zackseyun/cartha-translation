id: MRK.9.39
reference: Mark 9:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Μὴ κωλύετε αὐτόν, οὐδεὶς γάρ ἐστιν ὃς ποιήσει δύναμιν ἐπὶ τῷ ὀνόματί μου καὶ δυνήσεται ταχὺ κακολογῆσαί με·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/039.yaml
  text: But Jesus said[a], “Do not stop him[b], for there is no one who will do a mighty work in my name and soon be able to speak evil of me.”
translation:
  language: pt
  text: 'Mas Jesus disse: “Não o impeçam, pois ninguém que fizer uma obra poderosa em meu nome poderá logo depois falar mal de mim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κωλύετε
  choice: impeçam
  rationale: No contexto, o imperativo presente com μή proíbe os discípulos de continuar tentando impedir o homem; “não o impeçam” é claro, natural e mantém a ideia de obstrução.
- source_word: δύναμιν
  choice: uma obra poderosa
  rationale: A expressão comunica um feito extraordinário que manifesta poder, preservando melhor a amplitude de δύναμις do que o termo mais específico “milagre”.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: em meu nome
  rationale: É a formulação portuguesa corrente para uma ação realizada mediante a invocação ou autoridade do nome de Jesus.
- source_word: ταχὺ
  choice: logo depois
  rationale: Expressa proximidade temporal em relação ao ato anterior. “Logo depois” torna natural em português a sequência implícita, sem sugerir rapidez no modo de falar.
- source_word: κακολογῆσαί με
  choice: falar mal de mim
  rationale: Reproduz de modo direto e atual o sentido amplo de falar de forma hostil ou injuriosa, sem restringi-lo a calúnia ou maldição.
- source_word: οὐδεὶς γάρ ἐστιν ὃς
  choice: pois ninguém que
  rationale: Mantém a explicação causal e a construção generalizante do grego em português idiomático.
- source_word: δυνήσεται
  choice: poderá
  rationale: O futuro de δύναμαι indica capacidade futura; “poderá” conserva conjuntamente futuro e possibilidade.
theological_decisions:
- issue: Natureza do feito realizado em nome de Jesus
  choice: obra poderosa
  alternative: milagre
  rationale: A tradução mantém a amplitude semântica de δύναμις e indica um feito extraordinário sem impor uma categoria moderna mais estreita.
- issue: Relação do agente com Jesus
  choice: Formulação descritiva limitada ao que Jesus afirma neste versículo
  alternative: Paráfrase que o identifique como verdadeiro discípulo ou como mero oportunista
  rationale: O texto afirma apenas que quem realiza tal obra em nome de Jesus não poderá logo depois falar mal dele; não define de modo abrangente a condição espiritual do agente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem eliminar a relação temporal ou a tensão do enunciado.
