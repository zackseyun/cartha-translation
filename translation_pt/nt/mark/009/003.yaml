source:
  edition: SBLGNT
  text: καὶ τὰ ἱμάτια αὐτοῦ ⸀ἐγένετο στίλβοντα λευκὰ ⸀λίαν οἷα γναφεὺς ἐπὶ τῆς γῆς οὐ δύναται ⸀οὕτως λευκᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/003.yaml
  text: And his clothes became gleaming[a], very white, such as no launderer on earth is able to whiten.
translation:
  language: pt
  text: E suas roupas ficaram resplandecentes, intensamente brancas, como nenhum lavandeiro na terra é capaz de branqueá-las assim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱμάτια
  choice: roupas
  rationale: Termo geral e natural para peças de vestuário; evita a formalidade de “vestes” e a especificidade indevida de “túnicas”.
- source_word: ἐγένετο
  choice: ficaram
  rationale: Expressa com naturalidade a mudança de estado ocorrida na transfiguração.
- source_word: στίλβοντα
  choice: resplandecentes
  rationale: Comunica o brilho intenso e visível do particípio sem acrescentar uma interpretação teológica explícita.
- source_word: λευκὰ λίαν
  choice: intensamente brancas
  rationale: Preserva tanto a cor quanto a forte intensificação de λίαν em português corrente e expressivo.
- source_word: οἷα
  choice: como
  rationale: Introduz de maneira idiomática a comparação com a capacidade humana de branquear tecidos.
- source_word: γναφεύς
  choice: lavandeiro
  rationale: Designa de modo compreensível o profissional que limpa e alveja tecidos; “pisoeiro” seria histórico, mas pouco transparente para o leitor comum.
- source_word: ἐπὶ τῆς γῆς
  choice: na terra
  rationale: Mantém a localização e o contraste entre a capacidade terrena e a aparência extraordinária descrita.
- source_word: οὐ δύναται
  choice: seria capaz
  rationale: No contexto comparativo, o condicional soa natural em português e comunica incapacidade, sem alterar o sentido do presente grego.
- source_word: οὕτως λευκᾶναι
  choice: branqueá-las
  rationale: Expressa a ação de tornar brancas e explicita o objeto feminino plural recuperado naturalmente de “roupas”.
theological_decisions:
- issue: Descrição do efeito visível da transfiguração
  choice: Descrever as roupas como resplandecentes e intensamente brancas, sem explicação teológica adicional.
  alternative: Traduzir com linguagem interpretativa, como “resplandecentes de glória”.
  rationale: O versículo descreve o fenômeno visível, mas não identifica explicitamente o brilho como “glória”; a tradução deixa essa interpretação a cargo do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Lavandeiro” é mais acessível que o histórico “pisoeiro”; a construção comparativa foi ajustada à sintaxe natural do português.
