    issue: «seria capaz» traduz οὐ δύναται com valor condicional.
    rationale: 'O grego usa presente de capacidade: «nenhum lavandeiro na terra é capaz de...». O condicional enfraquece e desloca desnecessariamente a afirmação comparativa.'
  - severity: medium
    issue: A tradução não representa expressamente οὕτως.
    rationale: 'οὕτως qualifica λευκᾶναι: nenhum profissional humano é capaz de branquear as roupas «assim» ou «desse modo». Explicitá-lo preserva a comparação de grau e modo.'
  revised_text: E suas roupas ficaram resplandecentes, intensamente brancas, como nenhum lavandeiro na terra é capaz de branqueá-las assim.
