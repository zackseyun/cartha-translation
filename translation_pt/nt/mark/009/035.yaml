  text: καὶ καθίσας ἐφώνησεν τοὺς δώδεκα καὶ λέγει αὐτοῖς· Εἴ τις θέλει πρῶτος εἶναι ἔσται πάντων ἔσχατος καὶ πάντων διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/035.yaml
  text: And sitting down, he called the twelve and says to them, “If anyone wants to be first, he will be last of all and servant of all.”
translation:
  language: pt
  text: 'Então, depois de se sentar, chamou os Doze e lhes disse: “Se alguém quiser ser o primeiro, será o último de todos e o servo de todos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσας
  choice: depois de se sentar
  rationale: 'Expressa naturalmente o particípio aoristo e preserva a sequência da ação: Jesus se senta e então chama os Doze.'
- source_word: ἐφώνησεν
  choice: chamou
  rationale: Equivalente direto e corrente para o ato de convocar os Doze.
- source_word: λέγει
  choice: disse
  rationale: O presente histórico grego é vertido pelo passado narrativo natural em português, sem alteração do sentido ou da vivacidade essencial da cena.
- source_word: πρῶτος
  choice: o primeiro
  rationale: Preserva a linguagem de posição e precedência presente no contraste com ἔσχατος.
- source_word: ἔσχατος
  choice: o último
  rationale: Mantém diretamente o contraste proverbial com “o primeiro”.
- source_word: διάκονος
  choice: servo
  rationale: No contexto, designa quem se coloca a serviço dos demais; “servo” preserva a força ética da inversão de status, sem exigir o sentido eclesiástico posterior de “diácono”.
theological_decisions:
- issue: Força da declaração ἔσται
  choice: “será”
  alternative: “deverá ser”
  rationale: O futuro indicativo grego é preservado sem convertê-lo explicitamente em obrigação; assim se mantém a tensão entre consequência, definição e exigência implícita do discipulado.
- issue: Alcance repetido de πάντων
  choice: “de todos” nas duas ocorrências
  alternative: omitir uma das repetições por estilo
  rationale: A repetição enfatiza a abrangência radical tanto da última posição quanto do serviço e deve ser mantida.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Os Doze” conserva a designação reconhecível do grupo apostólico. A fala direta mantém o paralelismo e a contundência do original.
