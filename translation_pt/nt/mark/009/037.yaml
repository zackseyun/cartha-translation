source:
  edition: SBLGNT
  text: Ὃς ⸀ἂν ἓν τῶν τοιούτων παιδίων δέξηται ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται· καὶ ὃς ⸁ἂν ἐμὲ ⸀δέχηται, οὐκ ἐμὲ δέχεται ἀλλὰ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/037.yaml
  text: Whoever receives one of such children in my name receives me; and whoever receives me receives not me, but the one who sent me.
translation:
  language: pt
  text: Quem receber uma criança desse tipo[a] em meu nome recebe a mim; e quem receber a mim não é a mim que recebe, mas aquele que me enviou.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “uma dentre tais crianças”. O grego ressalta uma criança desse tipo, sem exigir que se refira especificamente a várias crianças presentes.
    reason: lexical_alternative
  - marker: b
    text: “Receber” também pode ser traduzido por “acolher” em todo o versículo; o mesmo verbo grego se repete em cada parte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃς ἂν
  choice: Quem
  rationale: A combinação do pronome relativo com ἄν expressa uma condição geral e indefinida; “quem” a comunica de modo natural em português.
- source_word: ἓν τῶν τοιούτων παιδίων
  choice: uma criança como esta
  rationale: A formulação preserva a ideia qualitativa de τοιούτων (“desse tipo, como esta”) e soa natural em português, sem transformar indevidamente a expressão em simples demonstrativo.
- source_word: δέξηται / δέχεται / δέχηται
  choice: receber / recebe
  rationale: O mesmo verbo é mantido em todas as ocorrências para conservar a cadeia retórica que liga a criança, Jesus e aquele que o enviou. “Acolher” também seria possível, mas estreitaria ligeiramente a amplitude de δέχομαι.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: em meu nome
  rationale: Expressão portuguesa concisa que comunica a ação motivada pela pessoa, pelo nome ou pela autoridade de Jesus, sem resolver em paráfrase todas as nuances possíveis da construção.
- source_word: οὐκ ἐμὲ δέχεται ἀλλὰ τὸν ἀποστείλαντά με
  choice: não é a mim que recebe, mas aquele que me enviou
  rationale: A construção clivada reproduz a ênfase e o contraste do grego de maneira inteligível, preservando deliberadamente a tensão da afirmação.
theological_decisions:
- issue: 'Força do contraste final: “não ... a mim, mas aquele que me enviou”'
  choice: Manter o contraste explícito sem acrescentar “somente” ou “também”.
  alternative: “não recebe somente a mim, mas também aquele que me enviou”
  rationale: Embora a alternativa explicite uma interpretação relacional plausível, ela introduz palavras ausentes do grego e resolve a tensão. O texto traduzido conserva a formulação enfática e permite que o contexto mostre que receber Jesus alcança aquele que o enviou.
- issue: Referência de τοιούτων
  choice: “uma criança como esta”
  alternative: “uma destas crianças”
  rationale: A opção escolhida conserva a força qualitativa (“dessa espécie, como esta”) em vez de pressupor um grupo de várias crianças presentes, algo que o grego não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão “uma criança como esta” evita o pouco natural “uma de tais crianças”, enquanto a construção “não é a mim que recebe” conserva a ênfase retórica do original.
