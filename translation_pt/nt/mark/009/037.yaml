  naturalness: «Uma criança desse tipo» é português moderno, claro e natural, e comunica melhor o valor qualitativo sem exigir a formulação pouco idiomática «uma dentre tais crianças» no corpo do texto. A construção «não é a mim que recebe» conserva a ênfase e permanece inteligível.
  terminology: «Receber» é uma escolha consistente e apropriada para δέχομαι nas três ocorrências. «Aquele que me enviou» reproduz naturalmente o particípio substantivado e preserva a linguagem de envio.
