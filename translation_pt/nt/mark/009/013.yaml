id: MRK.9.13
reference: Mark 9:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ λέγω ὑμῖν ὅτι καὶ Ἠλίας ἐλήλυθεν, καὶ ἐποίησαν αὐτῷ ὅσα ⸀ἤθελον, καθὼς γέγραπται ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/013.yaml
  text: But I tell you that Elijah also has come[a], and they did to him whatever they wanted, just as it is written about him.
translation:
  language: pt
  text: Mas eu lhes digo que Elias também já veio[a], e fizeram com ele tudo o que quiseram, assim como está escrito a respeito dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, Elias já veio na pessoa e no ministério de João Batista; veja Marcos 9:11–12 e compare Mateus 11:14; 17:12–13.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca o contraste com a expectativa dos discípulos e soa direto e natural em português.
- source_word: λέγω ὑμῖν
  choice: eu lhes digo
  rationale: Preserva a fórmula enfática de discurso direto e o endereço plural aos ouvintes.
- source_word: ὅτι καὶ Ἠλίας ἐλήλυθεν
  choice: que Elias também já veio
  rationale: O perfeito ἐλήλυθεν indica uma vinda já realizada com relevância presente; “já veio” expressa isso naturalmente, enquanto “também” representa καί sem o interpretar como intensivo.
- source_word: ἐποίησαν αὐτῷ
  choice: fizeram com ele
  rationale: Mantém a formulação aberta e vigorosa do grego, que é completada pela oração seguinte, em português idiomático.
- source_word: ὅσα ἤθελον
  choice: tudo o que quiseram
  rationale: Comunica a extensão irrestrita da expressão grega de modo claro e natural.
- source_word: καθὼς γέγραπται
  choice: assim como está escrito
  rationale: Preserva a fórmula tradicional de referência às Escrituras e a força do perfeito passivo.
- source_word: ἐπ’ αὐτόν
  choice: a respeito dele
  rationale: No contexto de γέγραπται, a expressão significa mais naturalmente “sobre/a respeito de”; evita impor a alternativa possível “contra ele”.
theological_decisions:
- issue: Identidade de Elias nesta declaração
  choice: Manter “Elias” no texto principal sem explicação interpretativa.
  alternative: Explicitar no texto que Elias veio na pessoa e no ministério de João Batista.
  rationale: O texto grego nomeia Elias, e a identificação contextual com João Batista não deve substituir a formulação do versículo. A relação pode ser indicada em nota, preservando a tensão e a progressão do relato.
- issue: Sentido de ἐπ’ αὐτόν
  choice: “a respeito dele”
  alternative: “contra ele”
  rationale: Ambos os sentidos são lexicalmente possíveis em certos contextos, mas, com a fórmula γέγραπται, o sentido de assunto ou referência é mais provável. A tradução evita transformar a frase em uma afirmação explícita de oposição.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Eu lhes digo” mantém a solenidade natural sem arcaísmo; “já veio” torna explícito o valor resultativo do perfeito grego, e “fizeram com ele tudo o que quiseram” conserva a força da declaração.
