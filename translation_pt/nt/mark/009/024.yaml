  text: ⸀εὐθὺς κράξας ὁ πατὴρ τοῦ ⸀παιδίου ἔλεγεν· ⸀Πιστεύω· βοήθει μου τῇ ἀπιστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/024.yaml
  text: Immediately the father of the child cried out and said[a], “I believe[b]; help my unbelief!”
translation:
  language: pt
  text: 'Imediatamente, o pai do menino gritou e disse: “Eu creio; ajuda-me na minha incredulidade!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ajuda-me na minha falta de fé”. O termo grego pode indicar incredulidade ou deficiência de fé.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: Imediatamente
  rationale: Preserva a prontidão da resposta e a urgência característica da narrativa de Marcos, em português atual e natural.
- source_word: κράξας
  choice: clamou
  rationale: Expressa uma fala forte e urgente, com intensidade emocional, sem precisar acrescentar um advérbio de volume.
- source_word: ὁ πατὴρ τοῦ παιδίου
  choice: o pai do menino
  rationale: No contexto, a criança é identificada como filho do homem; “menino” é natural em português e corresponde adequadamente a παιδίον aqui.
- source_word: ἔλεγεν
  choice: clamou
  rationale: A introdução da fala foi integrada ao particípio κράξας para evitar a formulação pesada “clamou e dizia”, sem perda do conteúdo narrativo.
- source_word: Πιστεύω
  choice: Eu creio
  rationale: Mantém a ligação direta com o campo semântico da fé e a formulação concisa da confissão.
- source_word: βοήθει
  choice: ajude
  rationale: Verbo direto e corrente que preserva a força da súplica no imperativo presente.
- source_word: μου τῇ ἀπιστίᾳ
  choice: a minha incredulidade
  rationale: Reproduz de modo direto o paradoxo entre crer e ainda experimentar incredulidade; a nota registra a nuance possível de deficiência de fé.
theological_decisions:
- issue: Tensão entre Πιστεύω e ἀπιστίᾳ
  choice: “Eu creio; ajude a minha incredulidade!”
  alternative: “Eu creio; ajude a minha falta de fé!”
  rationale: A tradução conserva a tensão deliberada entre fé real e incredulidade remanescente, sem harmonizá-la nem transformá-la numa afirmação teológica mais sistemática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação concisa preserva a urgência e a tensão emocional do original.
