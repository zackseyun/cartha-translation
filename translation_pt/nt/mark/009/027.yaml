base_translation:
  language: en
  yaml_path: translation/nt/mark/009/027.yaml
  text: But Jesus[a], taking hold of his hand, raised him up[b], and he stood up.
translation:
  language: pt
  text: Mas Jesus, segurando-o pela mão, levantou-o[a], e ele se levantou[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ergueu-o”; o verbo grego também pode ser usado para despertar alguém do sono ou para ressuscitar alguém.
    reason: lexical_alternative
  - marker: b
    text: Ou “ele se pôs de pé”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste moderado entre a impressão da multidão de que o menino estava morto e a ação de Jesus.
- source_word: κρατήσας τῆς χειρὸς αὐτοῦ
  choice: segurando-o pela mão
  rationale: Expressão natural em português que preserva tanto o contato físico quanto a referência específica à mão.
- source_word: ἤγειρεν αὐτόν
  choice: levantou-o
  rationale: Indica que Jesus fez o menino erguer-se, mantendo a possível ressonância do verbo usado também para despertar ou levantar dentre os mortos sem afirmar aqui uma ressurreição.
- source_word: ἀνέστη
  choice: ele ficou de pé
  rationale: Descreve com clareza o resultado físico da ação, em linguagem atual e sem arcaísmo.
theological_decisions:
- issue: Possível ressonância de linguagem de ressurreição em ἤγειρεν e ἀνέστη
  choice: Usar linguagem comum de levantar-se no contexto, com nota sobre o alcance lexical de ἐγείρω.
  alternative: Traduzir de modo mais formal como “ergueu-o, e ele se levantou”, realçando mais a ressonância.
  rationale: O contexto descreve a recuperação do menino depois da expulsão do espírito, não declara que ele ressuscitou. A tradução mantém o sentido contextual em primeiro plano sem eliminar a possível ressonância verbal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Segurando-o pela mão” soa natural e conserva a ação concreta; “ficou de pé” evita uma formulação arcaica.
