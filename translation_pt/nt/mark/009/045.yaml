id: MRK.9.45
reference: Mark 9:45
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ πούς σου σκανδαλίζῃ σε, ἀπόκοψον αὐτόν· καλόν ἐστίν ⸀σε εἰσελθεῖν εἰς τὴν ζωὴν χωλὸν ἢ τοὺς δύο πόδας ἔχοντα βληθῆναι εἰς τὴν ⸀γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/045.yaml
  text: And if your foot causes you to stumble[a], cut it off. It is better for you to enter into life lame than, having both feet, to be thrown into Gehenna.
translation:
  language: pt
  text: E, se o seu pé fizer você tropeçar, corte-o. É melhor você entrar na vida manco do que, tendo os dois pés, ser lançado na Geena.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “inferno”. O termo grego é Geena, que evoca o vale de Hinom e suas associações com o juízo divino.'
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: fizer você tropeçar
  rationale: Preserva a imagem de tropeço presente no verbo grego e sua implicação moral, sem restringi-lo explicitamente a «fazer pecar».
- source_word: ἀπόκοψον
  choice: corte-o
  rationale: Mantém a força concreta e incisiva do imperativo aoristo, sem suavizar a linguagem.
- source_word: καλόν ἐστίν
  choice: É melhor
  rationale: Na construção comparativa com ἤ, expressa de modo natural que uma situação é preferível à outra.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: entrar na vida
  rationale: Conserva a expressão escatológica do original sem acrescentar «eterna», termo que não aparece no texto grego.
- source_word: χωλὸν
  choice: manco
  rationale: Designa especificamente a limitação para andar e corresponde ao contraste estabelecido com os dois pés.
- source_word: βληθῆναι
  choice: ser lançado
  rationale: Reproduz com clareza a forma passiva e a ação vigorosa de βάλλω.
- source_word: γέενναν
  choice: Geena
  rationale: Mantém a especificidade histórica e escatológica do termo grego, em vez de substituí-lo no texto principal pelo termo interpretativo tradicional «inferno».
- source_word: τοὺς δύο πόδας ἔχοντα
  choice: tendo os dois pés
  rationale: Reproduz naturalmente a construção participial e preserva o contraste com entrar na vida manco.
theological_decisions:
- issue: Tradução de γέεννα em contexto de juízo
  choice: Geena
  alternative: inferno
  rationale: O original emprega o termo específico γέεννα, associado ao vale de Hinom e ao juízo divino. «Geena» preserva essa especificidade; «inferno» é indicado em nota como equivalente interpretativo tradicional.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A formulação «fizer você tropeçar» preserva a metáfora sem obscurecer sua dimensão moral. O marcador da nota foi colocado após «Geena», pois é esse o termo explicado pela nota.
