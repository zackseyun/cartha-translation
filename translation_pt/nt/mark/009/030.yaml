  text: Κἀκεῖθεν ἐξελθόντες ⸀παρεπορεύοντο διὰ τῆς Γαλιλαίας, καὶ οὐκ ἤθελεν ἵνα τις γνοῖ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/030.yaml
  text: And from there[a] they went on through Galilee[b], and he did not want anyone to know.
translation:
  language: pt
  text: E, saindo dali, eles passavam pela Galileia, e ele não queria que ninguém soubesse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego não declara o que ele não queria que ninguém soubesse; no contexto, pode referir-se à sua presença ou ao seu percurso pela Galileia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντες
  choice: E, saindo dali
  rationale: Preserva tanto a continuidade narrativa de καί + ἐκεῖθεν quanto o sentido explícito de partida expresso pelo particípio ἐξελθόντες, em português natural.
- source_word: παρεπορεύοντο
  choice: eles atravessavam
  rationale: O imperfeito indica deslocamento em curso; “atravessavam” comunica de modo idiomático a passagem pela região.
- source_word: διὰ τῆς Γαλιλαίας
  choice: a Galileia
  rationale: Com “atravessar”, o percurso indicado por διά com genitivo é expresso naturalmente por objeto direto em português.
- source_word: οὐκ ἤθελεν
  choice: ele não queria
  rationale: θέλω exprime vontade ou desejo; esta formulação é clara, atual e mantém Jesus como sujeito singular implícito no grego.
- source_word: ἵνα τις γνοῖ
  choice: que ninguém soubesse
  rationale: A oração com ἵνα e subjuntivo expressa o conteúdo da vontade negativa. Mantém-se sem objeto explícito o que ninguém deveria saber, como no grego.
theological_decisions:
- issue: Sujeito implícito de ἤθελεν
  choice: “ele”, referindo-se a Jesus
  alternative: Sujeito impessoal ou coletivo
  rationale: O verbo no singular retoma naturalmente Jesus como sujeito narrativo; explicitar o pronome é necessário para a fluência em português.
- issue: Objeto implícito de γνοῖ
  choice: Deixado sem explicitação
  alternative: Acrescentar “que ele estava ali” ou “por onde passava”
  rationale: O texto grego não declara o conteúdo do saber. Preservar essa abertura evita resolver indevidamente se se trata da presença, localização ou rota de Jesus.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “saindo dali” preserva o particípio de partida, enquanto “atravessavam” representa o aspecto contínuo do imperfeito sem rigidez.
