source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν αὐτὸν καταλάβῃ ῥήσσει αὐτόν, καὶ ἀφρίζει καὶ τρίζει τοὺς ⸀ὀδόντας καὶ ξηραίνεται· καὶ εἶπα τοῖς μαθηταῖς σου ἵνα αὐτὸ ἐκβάλωσιν, καὶ οὐκ ἴσχυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/018.yaml
  text: And wherever it seizes him[a], it throws him down, and he foams and grinds his teeth and becomes rigid. And I told your disciples to cast it out, but they were not able.
translation:
  language: pt
  text: E, onde quer que o espírito se apodere dele, lança-o ao chão; ele espuma, range os dentes e fica rígido.[a] Pedi aos teus discípulos que o expulsassem, mas eles não conseguiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «definha», «fica ressequido» ou, mais literalmente, «seca».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν
  choice: sempre que
  rationale: Embora a expressão possa significar literalmente «onde quer que», neste contexto descreve ocorrências repetidas toda vez que o espírito se apodera do menino; «sempre que» comunica naturalmente essa contingência repetida em português.
- source_word: καταλάβῃ
  choice: se apodera dele
  rationale: Expressa a ação hostil de agarrar ou dominar o menino e soa natural na descrição do espírito.
- source_word: ῥήσσει
  choice: lança-o ao chão
  rationale: No contexto, indica que o espírito derruba o menino violentamente. A formulação evita sugerir laceração física, possibilidade inadequada aqui para o português comum.
- source_word: ἀφρίζει
  choice: ele espuma
  rationale: Reproduz o sentido direto do verbo sem acrescentar «pela boca», detalhe implícito, mas não expresso no grego.
- source_word: τρίζει τοὺς ὀδόντας
  choice: range os dentes
  rationale: É a expressão portuguesa corrente para o ato físico descrito pelo grego.
- source_word: ξηραίνεται
  choice: fica rígido
  rationale: No encadeamento dos sintomas, esta é uma compreensão contextual plausível; como o verbo significa mais literalmente secar ou definhar, a ambiguidade lexical é preservada em nota.
- source_word: εἶπα
  choice: Pedi
  rationale: Com uma oração de propósito introduzida por ἵνα, o pai relata que solicitou aos discípulos que expulsassem o espírito. «Pedi» é natural e não implica mera informação.
- source_word: ἐκβάλωσιν
  choice: expulsassem
  rationale: É o verbo português claro e corrente para a expulsão de um espírito, preservando o sentido exorcístico.
- source_word: οὐκ ἴσχυσαν
  choice: não conseguiram
  rationale: Comunica a incapacidade ou falta de poder indicada pelo verbo sem explicar indevidamente a causa do fracasso.
theological_decisions:
- issue: Referente de αὐτό em «expulsassem»
  choice: O pronome é explicitado como «o espírito» pelo contexto imediato e retomado pelo pronome «o».
  alternative: Entender o pronome de modo mais genérico como referência à aflição.
  rationale: A narrativa apresenta um espírito hostil que se apodera do menino e que os discípulos tentam expulsar. A tradução mantém o foco no agente espiritual sem acrescentar uma identificação doutrinária além do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «ele» distingue o menino do espírito e evita ambiguidade sintática; «teus discípulos» conserva o tratamento singular do texto.
