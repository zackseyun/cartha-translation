review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz bem a sequência de ações e sintomas, bem como a incapacidade dos discípulos. Contudo, «sempre que» altera a força primariamente espacial de ὅπου ἐάν («onde quer que»/«em qualquer lugar onde»), reduzindo-a a uma relação exclusivamente temporal.
  naturalness: O português é moderno, claro e de registro apropriado. «Lança-o ao chão», «espuma», «range os dentes» e «fica rígido» são formulações naturais. A explicitação de «o espírito» evita uma ambiguidade de referente que os pronomes portugueses poderiam criar.
  terminology: «Expulsassem» preserva adequadamente o sentido exorcístico de ἐκβάλωσιν sem impor uma leitura doutrinária adicional. A nota em «fica rígido» preserva de modo suficiente as alternativas literais e disputadas de ξηραίνεται.
  issues:
