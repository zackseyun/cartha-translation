    issue: «sempre que» para ὅπου ἐάν
    rationale: A expressão grega é uma relativa indefinida de lugar, «onde quer que» ou «em qualquer lugar onde». Embora o contexto implique repetição eventual, «sempre que» elimina o elemento espacial presente no original.
