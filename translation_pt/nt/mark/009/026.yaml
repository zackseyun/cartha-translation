source:
  edition: SBLGNT
  text: καὶ ⸂κράξας καὶ πολλὰ σπαράξας⸃ ἐξῆλθεν· καὶ ἐγένετο ὡσεὶ νεκρὸς ὥστε ⸀τοὺς πολλοὺς λέγειν ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/026.yaml
  text: And after crying out and convulsing him greatly[a], it came out; and he became like a dead man, so that many were saying[b], “He is dead.”
translation:
  language: pt
  text: 'Depois de gritar e sacudir violentamente o menino[a], o espírito saiu. O menino ficou como morto[b], de modo que muitos diziam: “Ele morreu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fazê-lo ter fortes convulsões”.'
    reason: lexical_alternative
  - marker: b
    text: 'Também pode ser traduzido: “como se estivesse morto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας
  choice: depois de gritar
  rationale: O particípio aoristo indica uma ação anterior à saída do espírito. “Gritar” preserva o sentido verbal sem especificar indevidamente que foi um grito estridente.
- source_word: πολλὰ σπαράξας
  choice: sacudir violentamente o menino
  rationale: Neste contexto de exorcismo, σπαράσσω descreve convulsões ou sacudidas violentas, não o ato literal de rasgar. O objeto “o menino” é explicitado a partir do contexto para evitar ambiguidade em português, e πολλὰ é expresso pelo intensificador “violentamente”.
- source_word: ἐξῆλθεν
  choice: o espírito saiu
  rationale: O sujeito implícito é o espírito mencionado no contexto. Torná-lo explícito produz português claro sem alterar o referente.
- source_word: ἐγένετο ὡσεὶ νεκρός
  choice: O menino ficou como morto
  rationale: A expressão indica estado ou aparência resultante. “Como morto” conserva a comparação introduzida por ὡσεὶ e não afirma que o menino tenha realmente morrido.
- source_word: ὥστε τοὺς πολλοὺς λέγειν
  choice: de modo que muitos diziam
  rationale: τοὺς πολλούς é traduzido naturalmente por “muitos”, sem pressupor “a maioria”; “diziam” comunica a reação contínua dos presentes.
- source_word: ὅτι ἀπέθανεν
  choice: “Ele morreu.”
  rationale: O aoristo de ἀποθνῄσκω é vertido diretamente como “morreu”. A fala direta apresenta a conclusão dos observadores, não uma afirmação do narrador.
theological_decisions:
- issue: Se o menino morreu de fato ou apenas parecia morto
  choice: 'O narrador afirma que ele ficou “como morto”, enquanto os presentes concluem: “Ele morreu.”'
  alternative: Traduzir de modo a afirmar que o menino morreu de fato ou, inversamente, declarar explicitamente que estava apenas inconsciente.
  rationale: A comparação ὡσεὶ e a atribuição da conclusão à multidão distinguem a descrição do narrador da percepção dos observadores. A tradução mantém essa tensão sem introduzir neste versículo uma morte e ressurreição nem explicar clinicamente o estado do menino.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A repetição de “o menino” evita confusão entre o espírito e o menino; a sequência narrativa e a distinção entre aparência e conclusão dos observadores são preservadas.
