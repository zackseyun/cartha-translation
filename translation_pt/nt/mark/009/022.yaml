  text: καὶ πολλάκις ⸂καὶ εἰς πῦρ αὐτὸν⸃ ἔβαλεν καὶ εἰς ὕδατα ἵνα ἀπολέσῃ αὐτόν· ἀλλ’ εἴ τι ⸀δύνῃ, βοήθησον ἡμῖν σπλαγχνισθεὶς ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/022.yaml
  text: And many times it has thrown him both into fire and into waters to destroy him[a]. But if you can do anything, help us[b], having compassion on us.
translation:
  language: pt
  text: Muitas vezes o lançou no fogo e nas águas, para destruí-lo[a]. Mas, se podes fazer alguma coisa, ajuda-nos, tendo compaixão de nós[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na água”. O grego traz o plural: “nas águas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “movido de compaixão por nós” ou “tem misericórdia de nós”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάκις
  choice: muitas vezes
  rationale: Expressa claramente a repetição dos episódios e corresponde de modo natural ao advérbio grego.
- source_word: ἔβαλεν
  choice: o lançou
  rationale: O aoristo resume ações repetidas no passado; em português, o pretérito perfeito é natural neste relato e mantém a força de lançar.
- source_word: εἰς πῦρ ... καὶ εἰς ὕδατα
  choice: tanto no fogo como na água
  rationale: A construção correlativa preserva a ênfase dos dois destinos. O singular coletivo 'água' é mais idiomático em português, enquanto a nota registra o plural grego.
- source_word: ἵνα ἀπολέσῃ αὐτόν
  choice: para destruí-lo
  rationale: Preserva a ideia de propósito expressa por ἵνα e a amplitude de ἀπόλλυμι, sem restringi-la explicitamente a 'matar'.
- source_word: ἀλλ’ εἴ τι δύνῃ
  choice: Mas, se podes fazer alguma coisa
  rationale: Representa o indefinido τι e conserva sem suavização a hesitação do pai quanto à capacidade de Jesus.
- source_word: βοήθησον ἡμῖν
  choice: ajuda-nos
  rationale: Imperativo direto, atual e digno, que comunica o pedido urgente de auxílio.
- source_word: σπλαγχνισθεὶς ἐφ’ ἡμᾶς
  choice: tendo compaixão de nós
  rationale: Mantém a forma participial e comunica a compaixão profunda expressa pelo verbo grego.
theological_decisions:
- issue: O tom do apelo do pai e sua incerteza implícita acerca da capacidade de Jesus
  choice: se podes fazer alguma coisa
  alternative: se és capaz de fazer alguma coisa
  rationale: A formulação preserva diretamente a hesitação presente no grego, sem transformá-la numa declaração mais confiante nem resolver a tensão narrativa.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. Emprega 'tu' de modo coerente com a forma verbal 'podes', em registro bíblico digno, sem arcaísmos excessivos. A sintaxe permanece próxima do grego, mas natural em português.
