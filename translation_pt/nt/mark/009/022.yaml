  source_fidelity: A tradução reproduz com precisão a repetição temporal, o propósito destrutivo, a hesitação do pai em «se podes fazer alguma coisa», o imperativo de auxílio e o apelo por compaixão. Contudo, o texto grego traz explicitamente «para/as águas» no plural (εἰς ὕδατα); é preferível conservar esse plural no texto, em vez de o relegar a uma nota.
  naturalness: «Muitas vezes o lançou no fogo e nas águas» é natural, claro e adequado ao registro bíblico moderno. «Se podes ... ajuda-nos» mantém um tratamento coerente e é amplamente compreensível.
