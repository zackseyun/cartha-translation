  text: καὶ ἐπηρώτησεν ⸀αὐτούς· Τί συζητεῖτε πρὸς ⸀αὑτούς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/016.yaml
  text: And he asked them[a], “What are you discussing with one another?”
translation:
  language: pt
  text: 'E ele lhes perguntou: “O que vocês estão discutindo entre si?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sobre o que vocês estão debatendo entre si?” O verbo também pode indicar uma discussão ou disputa, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: perguntou
  rationale: No contexto narrativo, o aoristo de ἐπερωτάω introduz uma pergunta direta; “perguntou” é natural e preserva o sentido sem acrescentar formalidade ou intensidade.
- source_word: αὐτούς
  choice: lhes
  rationale: O pronome plural não identifica explicitamente seu referente neste versículo. “Lhes” conserva essa falta de especificidade.
- source_word: Τί
  choice: O que
  rationale: Aqui, τί pergunta pelo conteúdo ou assunto da discussão, não principalmente por sua causa.
- source_word: συζητεῖτε
  choice: estão discutindo
  rationale: συζητέω pode indicar conversa, debate ou discussão contenciosa. “Estão discutindo” mantém uma amplitude semelhante em português, enquanto a possível ideia de disputa é registrada em nota.
- source_word: πρὸς αὑτούς
  choice: uns com os outros
  rationale: A expressão tem sentido recíproco. “Uns com os outros” comunica isso de modo claro e idiomático em português.
- source_word: καὶ
  choice: E
  rationale: καί liga a ação à narrativa anterior sem exigir uma nuance temporal mais específica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “vocês” torna explícito o plural já presente no verbo grego; a formulação evita identificar além do texto o referente de “lhes”.
