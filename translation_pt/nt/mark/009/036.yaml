  text: καὶ λαβὼν παιδίον ἔστησεν αὐτὸ ἐν μέσῳ αὐτῶν καὶ ἐναγκαλισάμενος αὐτὸ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/036.yaml
  text: 'And taking a child[a], he set him in their midst, and taking him in his arms[b], he said to them:'
translation:
  language: pt
  text: 'E, pegando uma criança, colocou-a de pé no meio deles e, tomando-a nos braços[a], disse-lhes:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abraçando-a”. O verbo grego pode indicar tomar alguém nos braços ou abraçar.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: pegando
  rationale: O particípio aoristo introduz uma ação anterior ao verbo principal. “Pegando” preserva com naturalidade a sequência participial.
- source_word: παιδίον
  choice: uma criança
  rationale: Designa uma criança, sem exigir que se explicite uma nuance diminutiva como “criancinha”.
- source_word: ἔστησεν
  choice: colocou-a
  rationale: O verbo é causativo, literalmente “fez ficar de pé”. No contexto, “colocou-a” é natural em português e mantém a ação sem impor que a criança tenha permanecido especificamente em pé.
- source_word: ἐν μέσῳ αὐτῶν
  choice: no meio deles
  rationale: Expressão idiomática que conserva tanto a dimensão espacial quanto a presença da criança entre o grupo.
- source_word: ἐναγκαλισάμενος
  choice: tomando-a nos braços
  rationale: Expressa concretamente o gesto de acolher a criança nos braços; “abraçando-a” também é lexicalmente possível.
- source_word: εἶπεν αὐτοῖς
  choice: disse-lhes
  rationale: Tradução direta, concisa e digna da construção grega.
theological_decisions: []
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. Emprega-se “a criança” retomada por pronome feminino conforme o gênero da palavra em português, sem afirmar o sexo da criança. A construção conserva a sequência das ações do grego.
