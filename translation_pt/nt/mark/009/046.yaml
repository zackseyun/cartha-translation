  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: pt
  text: onde[a] o verme deles não morre, e o fogo não se apaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo não aparece nos manuscritos gregos mais antigos, incluindo o Sinaítico e o Vaticano, do século IV, nem em antigas traduções coptas; está, porém, presente na tradição majoritária bizantina e na tradição latina. É provavelmente um acréscimo posterior de copistas, repetindo as mesmas palavras do versículo 48 (e do versículo 44).
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: verme
  rationale: Pode designar verme ou larva que consome matéria em decomposição. “Verme” preserva a ligação direta e reconhecível com Isaías 66:24, de onde vem a formulação.
- source_word: τελευτᾷ
  choice: morre
  rationale: Neste contexto, τελευτάω expressa o fim da vida; o presente negado é traduzido naturalmente por “não morre”, preservando a ideia de continuidade.
- source_word: σβέννυται
  choice: se apaga
  rationale: O passivo de σβέννυμι indica que o fogo não é extinto. “Não se apaga” é corrente, claro e mantém a força da imagem de juízo.
theological_decisions:
- issue: Imagem do verme e do fogo
  choice: Manter literalmente “o verme deles” e “o fogo”
  alternative: Explicitar uma interpretação específica do destino final ou da duração do castigo
  rationale: O texto emprega imagens derivadas de Isaías 66:24 sem explicar aqui todos os seus referentes; a tradução preserva essa tensão e evita impor uma leitura denominacional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o paralelismo breve do grego e a ressonância tradicional de Isaías 66:24.
