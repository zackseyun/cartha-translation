reference: Mark 9:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἤνεγκαν αὐτὸν πρὸς αὐτόν. καὶ ἰδὼν αὐτὸν ⸂τὸ πνεῦμα εὐθὺς⸃ ⸀συνεσπάραξεν αὐτόν, καὶ πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο ἀφρίζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/020.yaml
  text: And they brought him to him[a]. And when the spirit saw him, it immediately convulsed him, and he fell on the ground and rolled about[b], foaming.
translation:
  language: pt
  text: E o levaram até Jesus. Quando o espírito viu Jesus, imediatamente fez o menino entrar em convulsões; ele caiu no chão e rolava, espumando.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤνεγκαν αὐτὸν πρὸς αὐτόν
  choice: o levaram até Jesus
  rationale: Expressa naturalmente o movimento em direção a Jesus e explicita o referente do segundo pronome para evitar a sequência obscura «o levaram até ele», sem alterar o sentido.
- source_word: ἰδὼν αὐτόν
  choice: quando o espírito viu Jesus
  rationale: O particípio aoristo tem valor temporal. Repetir «Jesus» esclarece que o espírito o viu, evitando ambiguidade pronominal em português.
- source_word: τὸ πνεῦμα
  choice: o espírito
  rationale: Conserva a formulação do versículo, que diz apenas «o espírito», sem acrescentar «impuro» ou substituir por «demônio» com base no contexto mais amplo.
- source_word: εὐθύς
  choice: imediatamente
  rationale: Preserva a força do advérbio e o ritmo característico da narrativa de Marcos em linguagem atual.
- source_word: συνεσπάραξεν αὐτόν
  choice: fez o menino ter fortes convulsões
  rationale: Comunica de modo claro a causação e a violência dos espasmos. «Convulsionou-o» seria pouco natural ou poderia sugerir que o espírito sofreu a convulsão.
- source_word: πεσὼν ἐπὶ τῆς γῆς
  choice: ele caiu no chão
  rationale: Converte o particípio em oração coordenada natural em português e deixa claro que foi o menino quem caiu.
- source_word: ἐκυλίετο
  choice: ficou rolando
  rationale: O imperfeito descreve ação contínua; «ficou rolando» reproduz esse aspecto de maneira idiomática.
- source_word: ἀφρίζων
  choice: espumando
  rationale: Mantém o particípio conciso e não acrescenta «pela boca», informação implícita, mas não expressa no grego.
theological_decisions:
- issue: Identificação de τὸ πνεῦμα
  choice: «o espírito»
  alternative: «o espírito impuro» ou «o demônio»
  rationale: Embora o contexto identifique a entidade como espírito impuro, este versículo emprega somente τὸ πνεῦμα. A tradução não acrescenta uma qualificação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os referentes pronominais foram explicitados como «Jesus» e «o menino» para impedir ambiguidades naturais em português; não foi introduzida nenhuma especificação teológica ausente do versículo.
