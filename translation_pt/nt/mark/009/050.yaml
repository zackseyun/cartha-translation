base_translation:
  language: en
  yaml_path: translation/nt/mark/009/050.yaml
  text: Salt is good[a]; but if the salt becomes unsalty, with what will you season it? Have salt in yourselves[c][b], and be at peace with one another.
translation:
  language: pt
  text: O sal é bom; mas, se o sal perder o sabor[a], com que vocês o temperarão? Tenham sal em vocês mesmos[b] e vivam em paz uns com os outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deixar de ser salgado” ou “tornar-se insípido”.'
    reason: lexical_alternative
  - marker: b
    text: A ordem “Tenham sal em vocês mesmos” preserva a metáfora grega. Ela pode se referir, entre outras possibilidades, à pureza, à sabedoria, à fidelidade à aliança ou a uma influência preservadora; o texto não especifica um único sentido.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: bom
  rationale: Mantém a avaliação ampla e aforística do grego, sem restringi-la a “útil” ou “benéfico”.
- source_word: ἅλας / ἅλα
  choice: sal
  rationale: Preserva o substantivo e a metáfora de modo consistente nas duas ocorrências.
- source_word: ἄναλον γένηται
  choice: perder o sabor
  rationale: Expressa em português natural a ideia de o sal tornar-se insípido ou deixar de ser salgado, preservando a mudança de estado indicada por γένηται.
- source_word: ἐν τίνι αὐτὸ ἀρτύσετε
  choice: com que vocês o temperarão?
  rationale: “Com que” indica naturalmente o meio, e “temperar” conserva a metáfora culinária de ἀρτύω.
- source_word: ἔχετε ἐν ἑαυτοῖς ἅλα
  choice: tenham sal em vocês mesmos
  rationale: Mantém literalmente a metáfora e o valor reflexivo de ἐν ἑαυτοῖς, sem impor uma interpretação específica.
- source_word: εἰρηνεύετε ἐν ἀλλήλοις
  choice: vivam em paz uns com os outros
  rationale: Comunica de forma idiomática o imperativo contínuo e a relação recíproca expressa pelo grego.
theological_decisions:
- issue: Sentido metafórico de “sal” no imperativo
  choice: 'Preservar a metáfora: “Tenham sal em vocês mesmos”'
  alternative: Explicitar como pureza, sabedoria, fidelidade à aliança ou influência preservadora
  rationale: O texto não identifica expressamente o referente da metáfora; mantê-la evita resolver uma ambiguidade teológica genuína.
- issue: Forma do mandamento final sobre a paz
  choice: “vivam em paz uns com os outros”
  alternative: “estejam em paz uns com os outros”
  rationale: As duas formas são possíveis; “vivam em paz” transmite com naturalidade a conduta contínua requerida pelo presente imperativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento de boa legibilidade brasileira. A metáfora central foi mantida, enquanto “perder o sabor” evita o pouco natural “tornar-se sem sal”. Não se adotou uma terceira nota, pois “vivam em paz” está no texto principal e não constitui uma variante adicional.
