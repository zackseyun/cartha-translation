id: MRK.9.25
reference: Mark 9:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ὅτι ἐπισυντρέχει ὄχλος ἐπετίμησεν τῷ πνεύματι τῷ ἀκαθάρτῳ λέγων αὐτῷ· Τὸ ⸂ἄλαλον καὶ κωφὸν πνεῦμα⸃, ἐγὼ ⸂ἐπιτάσσω σοι⸃, ἔξελθε ἐξ αὐτοῦ καὶ μηκέτι εἰσέλθῃς εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/025.yaml
  text: But when Jesus saw that a crowd was quickly gathering[a], he rebuked the unclean spirit, saying to it, “You mute and deaf spirit, I command you, come out of him and never enter him again.”
translation:
  language: pt
  text: 'Mas, ao ver que uma multidão se ajuntava rapidamente[a], Jesus repreendeu o espírito impuro, dizendo-lhe: “Espírito mudo e surdo, eu lhe ordeno: saia dele e nunca mais entre nele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma multidão corria para se ajuntar”. O verbo grego sugere pessoas convergindo rapidamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Mas, ao ver
  rationale: O particípio aoristo estabelece a circunstância da ação principal, e δέ funciona como conexão narrativa leve. A formulação é natural em português e conserva a transição e o valor temporal.
- source_word: ἐπισυντρέχει ὄχλος
  choice: uma multidão se ajuntava rapidamente
  rationale: O verbo descreve pessoas convergindo, possivelmente correndo juntas. “Se ajuntava rapidamente” preserva o aspecto progressivo e a urgência sem produzir uma expressão artificial.
- source_word: ἐπετίμησεν
  choice: repreendeu
  rationale: Mantém o sentido de censura autoritativa característico do uso evangélico do verbo em ordens dirigidas a espíritos e forças hostis.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: o espírito impuro
  rationale: “Impuro” comunica em português atual as conotações morais e religiosas de ἀκάθαρτος e evita que “imundo” seja entendido apenas como sujeira física.
- source_word: Τὸ ἄλαλον καὶ κωφὸν πνεῦμα
  choice: Espírito mudo e surdo
  rationale: O artigo com o nominativo tem função vocativa. A tradução conserva separadamente as duas características, incapacidade de falar e de ouvir, em uma forma direta e natural de tratamento.
- source_word: ἐγὼ ἐπιτάσσω σοι
  choice: eu lhe ordeno
  rationale: ἐπιτάσσω expressa uma ordem autoritativa, e o pronome explícito ἐγώ recebe correspondência em “eu”, preservando sua ênfase sem amplificação.
- source_word: ἔξελθε ἐξ αὐτοῦ
  choice: saia dele
  rationale: É a forma idiomática e direta, em português, de expressar a ordem de abandonar a pessoa.
- source_word: μηκέτι εἰσέλθῃς εἰς αὐτόν
  choice: nunca mais entre nele
  rationale: A construção proíbe decisivamente qualquer entrada futura. “Nunca mais” transmite com clareza a força de μηκέτι neste contexto.
theological_decisions:
- issue: Terminologia demoníaca e autoridade de Jesus
  choice: Manter “espírito impuro”, “repreendeu” e “eu lhe ordeno” como linguagem pessoal e autoritativa.
  alternative: “espírito maligno” ou uma formulação que trate o episódio apenas como enfermidade
  rationale: O texto apresenta um espírito pessoal, diretamente interpelado e submetido à ordem de Jesus. A tradução não reduz essa apresentação a uma condição médica nem acrescenta uma explicação doutrinária além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “lhe” no discurso direto e preserva a concisão e a autoridade da ordem de Jesus.
