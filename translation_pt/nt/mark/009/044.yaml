  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: pt
  text: onde[a] o verme deles não morre, e o fogo não se apaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo não consta dos manuscritos gregos mais antigos, entre eles o Sinaítico e o Vaticano, do século IV, nem de antigas traduções coptas. Contudo, aparece no Alexandrino, do século V, na tradição latina e na maioria dos manuscritos bizantinos posteriores. É provável que seja um acréscimo posterior de um copista, repetindo a frase idêntica do versículo 48.
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: verme
  rationale: Equivalente direto e tradicional, adequado à imagem de um organismo que se alimenta de matéria em decomposição e que preserva a alusão a Isaías 66:24.
- source_word: τελευτᾷ
  choice: morre
  rationale: Embora o verbo possa significar «chegar ao fim», aplicado a um ser vivo, «morre» é a forma mais natural e exata em português.
- source_word: σβέννυται
  choice: se apaga
  rationale: Expressa naturalmente em português o passivo grego no contexto do fogo, sem acrescentar um agente e preservando a ideia de que ele não é extinto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação tradicional e natural. «Não se apaga» é mais corrente e acessível do que «não é extinto», mantendo o sentido do presente passivo grego.
