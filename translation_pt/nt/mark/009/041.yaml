source:
  edition: SBLGNT
  text: Ὃς γὰρ ἂν ποτίσῃ ὑμᾶς ποτήριον ὕδατος ἐν ⸀ὀνόματι ὅτι χριστοῦ ἐστε, ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ ⸀ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/041.yaml
  text: For whoever gives you a cup of water to drink in the name that you are Messiah's[a], truly I say to you, he will certainly not lose his reward.
translation:
  language: pt
  text: 'Pois quem lhes der um copo de água para beber, por vocês pertencerem ao Messias[a], em verdade lhes digo: de modo nenhum perderá a sua recompensa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “em nome de que vocês pertencem ao Messias”.'
    reason: A construção grega ἐν ὀνόματι ὅτι χριστοῦ ἐστε é incomum; a tradução principal a entende em sentido causal, enquanto a nota preserva a formulação mais literal e sua ambiguidade sintática.
lexical_decisions:
- source_word: Ὃς γὰρ ἂν
  choice: Pois quem
  rationale: Mantém γάρ como ligação explicativa com o ensino anterior e verte naturalmente a construção relativa indefinida.
- source_word: ποτίσῃ ὑμᾶς ποτήριον ὕδατος
  choice: lhes der um copo de água para beber
  rationale: Expressa de maneira corrente o sentido de ποτίζω, “dar de beber”, preservando o objeto explícito “um copo de água”.
- source_word: ἐν ὀνόματι ὅτι χριστοῦ ἐστε
  choice: em reconhecimento de que vocês pertencem ao Messias
  rationale: Preserva a referência a ὄνομα sem acrescentar “meu”, ausente do texto grego, e comunica que a ação se baseia na identificação dos discípulos como pertencentes ao Messias. A nota registra a leitura causal mais direta de ὅτι.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: em verdade lhes digo
  rationale: Fórmula solene e digna, corrente em português bíblico e ainda compreensível para leitores modernos.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: de modo nenhum perderá
  rationale: Reproduz a forte negação de οὐ μή com o subjuntivo aoristo.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: a sua recompensa
  rationale: “Recompensa” é o equivalente contextual mais natural de μισθός neste ensino moral e escatológico.
theological_decisions:
- issue: Sentido de ἐν ὀνόματι ὅτι
  choice: em reconhecimento de que vocês pertencem ao Messias
  alternative: porque vocês pertencem ao Messias
  rationale: A formulação principal conserva a referência explícita a “nome” de maneira idiomática, sem inserir “meu nome”; a alternativa entende ὅτι causalmente e torna explícito o motivo do gesto.
- issue: Tradução de Χριστός na construção possessiva
  choice: Messias
  alternative: Cristo
  rationale: Aqui Χριστός funciona como título de Jesus; “Messias” preserva esse valor titular, enquanto “Cristo” pode ser entendido como nome próprio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais (“vocês”, “lhes”). A ordem foi levemente ajustada com vírgulas para facilitar a leitura sem eliminar a tensão da expressão grega.
