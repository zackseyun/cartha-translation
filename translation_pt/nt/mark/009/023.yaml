id: MRK.9.23
reference: Mark 9:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τὸ Εἰ ⸀δύνῃ, πάντα δυνατὰ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/023.yaml
  text: But Jesus said to him[b][a], “ ‘If you can’? All things are possible for the one who believes.”
translation:
  language: pt
  text: 'Mas Jesus lhe disse: “Como assim, ‘se podes’?[a] Tudo é possível para quem crê.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “O ‘se podes’?” Jesus retoma e contesta as palavras do pai no versículo anterior.'
    reason: lexical_alternative
  - marker: b
    text: “Quem crê” também pode ser traduzido como “quem tem fé” ou “quem confia”.
    reason: alternative_reading
lexical_decisions:
- source_word: Τὸ Εἰ δύνῃ
  choice: Como assim, ‘se podes’?
  rationale: O artigo neutro Τὸ substantiva a expressão citada e assinala a repetição incisiva das palavras do pai no versículo anterior. A formulação preserva a citação e o tom de contestação em português natural.
- source_word: δύνῃ
  choice: podes
  rationale: δύναμαι significa comumente ‘poder, ser capaz’. ‘Podes’ é conciso e mantém a segunda pessoa do singular da fala direta.
- source_word: πάντα
  choice: tudo
  rationale: O neutro plural tem sentido abrangente. ‘Tudo’ é a forma mais natural em português e conserva a força retórica da afirmação.
- source_word: δυνατὰ
  choice: é possível
  rationale: Neste predicativo, δυνατός expressa possibilidade. A concordância no singular em ‘Tudo é possível’ é a construção idiomática correspondente em português.
- source_word: τῷ πιστεύοντι
  choice: para quem crê
  rationale: O particípio presente substantivado designa a pessoa que crê em sentido geral. ‘Para quem crê’ é natural e preserva o caráter verbal, sem transformá-lo no rótulo ‘o crente’.
- source_word: πιστεύοντι
  choice: crê
  rationale: πιστεύω pode significar crer, ter fé ou confiar. ‘Crê’ é a correspondência direta e tradicional, enquanto as demais nuances são registradas em nota.
theological_decisions:
- issue: Alcance de ‘tudo é possível’
  choice: Manter a afirmação abrangente sem qualificadores interpretativos no texto principal.
  alternative: ‘Tudo é possível com Deus para quem crê’ ou ‘Tudo é possível a quem crê, no âmbito do poder de Deus’.
  rationale: O grego não inclui explicitamente ‘com Deus’ neste versículo. Acrescentar essa expressão resolveria no texto principal uma tensão que a formulação original deixa aberta.
- issue: Força da repetição de ‘se podes’
  choice: 'Apresentar a expressão como uma pergunta contestadora: ‘Como assim, “se podes”?’'
  alternative: ‘Quanto a esse “se podes”’ ou, mais literalmente, ‘O “se podes”?’
  rationale: A construção grega ecoa de modo incisivo as palavras do pai. A pergunta comunica essa força sem atribuir a Jesus uma explicação teológica ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se ‘podes’ para conservar a segunda pessoa singular do original e a ligação com a fala anterior; a estrutura permanece clara para leitores de diferentes regiões lusófonas.
