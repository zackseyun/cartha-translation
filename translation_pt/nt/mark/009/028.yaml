  text: καὶ ⸂εἰσελθόντος αὐτοῦ⸃ εἰς οἶκον οἱ μαθηταὶ αὐτοῦ ⸂κατ’ ἰδίαν ἐπηρώτων αὐτόν⸃· Ὅτι ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/028.yaml
  text: And when he had entered the house[a], his disciples were asking him privately, “Why were we not able to cast it out?”
translation:
  language: pt
  text: 'E, depois que ele entrou numa casa, seus discípulos lhe perguntavam em particular: “Por que nós não conseguimos expulsá-lo?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome grego é neutro e pode referir-se tanto ao espírito impuro quanto ao menino, pois o termo grego para “menino” também é neutro. No contexto, a referência ao espírito é mais natural. Em português, “expulsá-lo” pode retomar qualquer um dos dois, pois tanto “espírito” como “menino” são masculinos.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ εἰς οἶκον
  choice: depois que ele entrou em casa
  rationale: O particípio aoristo em genitivo absoluto fornece o pano de fundo temporal anterior ao verbo principal. A formulação é natural em português e não torna a casa mais definida do que o grego sem artigo exige.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seus discípulos
  rationale: “Discípulos” é a designação corrente e exata no contexto dos Evangelhos, preservando a relação de aprendizado e seguimento.
- source_word: κατ’ ἰδίαν
  choice: em particular
  rationale: Expressa que a pergunta foi feita à parte dos demais, em ambiente privado, com linguagem natural e digna.
- source_word: ἐπηρώτων
  choice: perguntavam
  rationale: O imperfeito é mantido para representar a ação em curso, sem intensificá-la indevidamente como repetição insistente.
- source_word: Ὅτι
  choice: Por que
  rationale: Neste contexto interrogativo, ὅτι introduz idiomaticamente uma pergunta sobre a razão.
- source_word: ἡμεῖς οὐκ ἠδυνήθημεν
  choice: nós não conseguimos
  rationale: Traduz a incapacidade expressa pelo aoristo de δύναμαι de modo corrente. O pronome explícito conserva a ênfase de ἡμεῖς.
- source_word: ἐκβαλεῖν αὐτό
  choice: expulsá-lo
  rationale: “Expulsar” comunica com clareza o sentido de ἐκβάλλω no contexto de exorcismo. O pronome oblíquo masculino em português retoma naturalmente “espírito”, embora o grego αὐτό seja neutro.
theological_decisions:
- issue: Referente do pronome final αὐτό
  choice: Entendido como referência ao espírito, expresso por “expulsá-lo”.
  alternative: Entendê-lo como referência ao menino, também formalmente possível na tradução portuguesa “expulsá-lo”.
  rationale: O pronome grego é neutro e aponta mais naturalmente para o espírito impuro, enquanto o menino é masculino. Como “espírito” e “menino” são ambos masculinos em português, a tradução não consegue reproduzir essa distinção gramatical; a nota a torna explícita sem eliminar a ambiguidade possível.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Em casa” é idiomático e evita impor uma casa específica onde o grego não usa artigo. A ordem mantém a progressão narrativa e a ênfase explícita em “nós”.
