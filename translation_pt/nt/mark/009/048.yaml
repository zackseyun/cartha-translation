  yaml_path: translation/nt/mark/009/048.yaml
  text: where their worm does not die[b][a], and the fire is not quenched.
translation:
  language: pt
  text: onde o verme deles não morre[a], e o fogo não se apaga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a larva deles não chega ao fim”.'
    reason: lexical_alternative
  - marker: b
    text: Esta frase ecoa Isaías 66:24.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: onde
  rationale: Advérbio relativo simples e natural, que introduz o lugar descrito sem acrescentar interpretação.
- source_word: ὁ σκώληξ αὐτῶν
  choice: o verme deles
  rationale: “Verme” preserva a imagem concreta e a alusão a Isaías 66:24 sem especificar em excesso “larva”; “deles” mantém a associação pessoal expressa pelo genitivo αὐτῶν.
- source_word: οὐ τελευτᾷ
  choice: não morre
  rationale: Embora τελευτάω também possa significar “chegar ao fim”, com “verme” como sujeito, “não morre” é idiomático, direto e conserva a força da imagem.
- source_word: τὸ πῦρ
  choice: o fogo
  rationale: Equivalência direta e natural do substantivo grego.
- source_word: οὐ σβέννυται
  choice: não se apaga
  rationale: Expressa naturalmente em português o presente passivo e o estado contínuo de um fogo que não é extinto.
theological_decisions:
- issue: Natureza da imagem de juízo
  choice: Manter as imagens concretas do verme e do fogo sem defini-las como aniquilação, tormento consciente ou mera metáfora.
  alternative: Interpretar explicitamente a imagem como punição consciente contínua, destruição irreversível ou vergonha e profanação metafóricas.
  rationale: O versículo ecoa Isaías 66:24 e apresenta imagens vívidas de juízo, mas não exige que a tradução resolva debates doutrinários mais amplos.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Não se apaga” evita o tom excessivamente arcaico de “não é apagado” e preserva o sentido do passivo grego.
