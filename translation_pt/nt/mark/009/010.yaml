id: MRK.9.10
reference: Mark 9:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὸν λόγον ἐκράτησαν πρὸς ἑαυτοὺς συζητοῦντες τί ἐστιν τὸ ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/010.yaml
  text: And they kept the matter to themselves[b][a], discussing what it meant to rise from the dead.
translation:
  language: pt
  text: Eles guardaram para si o que ele havia dito[a], discutindo o que significava ressuscitar dentre os mortos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “essa palavra” ou “essa declaração”.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “ressuscitar dos mortos”. A expressão grega diz, mais literalmente, “levantar-se dentre os mortos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: o que ele havia dito
  rationale: Neste contexto, λόγος se refere à declaração anterior de Jesus, não a uma palavra isolada. A formulação é natural em português e mantém clara a ligação com a ordem do versículo 9.
- source_word: ἐκράτησαν
  choice: guardaram
  rationale: κρατέω tem o sentido básico de segurar, reter ou conservar. Com πρὸς ἑαυτούς, indica que os discípulos mantiveram a declaração no próprio círculo.
- source_word: πρὸς ἑαυτούς
  choice: para si
  rationale: A expressão indica que eles não divulgaram o que Jesus havia dito. “Para si” é conciso e idiomático em português.
- source_word: συζητοῦντες
  choice: discutindo
  rationale: O particípio descreve uma conversa deliberativa entre os discípulos. “Discutindo” comunica troca de ideias sem exigir a noção de conflito.
- source_word: τί ἐστιν
  choice: o que significava
  rationale: Embora a forma seja literalmente “o que é”, o contexto mostra que eles procuravam compreender o sentido da expressão de Jesus. A tradução preserva essa perplexidade de modo natural.
- source_word: τὸ ἐκ νεκρῶν ἀναστῆναι
  choice: ressuscitar dentre os mortos
  rationale: O infinitivo articular nomeia o tema da discussão. “Ressuscitar dentre os mortos” conserva tanto a ideia de ressurreição quanto a força de ἐκ, que pode indicar sair do meio dos mortos.
theological_decisions:
- issue: A linguagem da ressurreição na discussão dos discípulos
  choice: ressuscitar dentre os mortos
  alternative: ressuscitar dos mortos
  rationale: A tradução mantém a formulação que intrigava os discípulos sem antecipar uma explicação doutrinária posterior. “Dentre os mortos” também preserva a possível nuance de sair do meio dos mortos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção evita literalismo rígido em λόγος e τί ἐστιν, mas conserva a perplexidade dos discípulos e a nuance de ἐκ νεκρῶν.
