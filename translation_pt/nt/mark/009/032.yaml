id: MRK.9.32
reference: Mark 9:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα, καὶ ἐφοβοῦντο αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/032.yaml
  text: But they did not understand the statement[a], and they were afraid to ask him.
translation:
  language: pt
  text: Mas eles não entendiam o que ele havia dito[a] e tinham medo de lhe perguntar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a declaração” ou “o que havia sido dito”. O termo grego ῥῆμα pode se referir a uma palavra falada, uma declaração ou algo que foi dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mas eles
  rationale: δέ introduz aqui um contraste leve entre a predição de Jesus e a falta de compreensão dos discípulos; o sujeito implícito é retomado naturalmente por “eles”.
- source_word: ἠγνόουν
  choice: não entendiam
  rationale: ἀγνοέω, neste contexto, indica falta de compreensão. O imperfeito é preservado pela forma portuguesa “entendiam”, que apresenta um estado contínuo no passado.
- source_word: τὸ ῥῆμα
  choice: o que ele havia dito
  rationale: ῥῆμα se refere à declaração que Jesus acabara de fazer. A formulação é clara e natural em português, sem reduzir o sentido a uma única “palavra”; a nota registra alternativas mais formais.
- source_word: ἐφοβοῦντο
  choice: tinham medo
  rationale: A expressão idiomática comunica o estado contínuo de temor indicado pelo imperfeito grego.
- source_word: αὐτὸν ἐπερωτῆσαι
  choice: de lhe perguntar
  rationale: O pronome refere-se a Jesus, e ἐπερωτάω tem aqui o sentido comum de fazer uma pergunta. “Lhe perguntar” é natural e mantém Jesus como objeto indireto em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução conserva o contraste de δέ e o aspecto contínuo dos dois imperfeitos, evitando uma reprodução rígida de ῥῆμα como “palavra”.
