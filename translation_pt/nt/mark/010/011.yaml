  text: καὶ λέγει αὐτοῖς· Ὃς ⸀ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ καὶ γαμήσῃ ἄλλην μοιχᾶται ἐπ’ αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/011.yaml
  text: And he says to them[a], “Whoever divorces his wife and marries another commits adultery against her.”
translation:
  language: pt
  text: 'E ele lhes diz: “Quem se divorciar de sua mulher e se casar com outra comete adultério contra ela.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico grego, traço narrativo frequente em Marcos, de modo natural em português.
- source_word: αὐτοῖς
  choice: lhes
  rationale: O pronome dativo é expresso naturalmente em português como objeto indireto.
- source_word: Ὃς ἂν
  choice: Quem
  rationale: A construção relativa com ἄν introduz uma condição geral indefinida; “Quem” é claro e idiomático neste contexto.
- source_word: ἀπολύσῃ
  choice: se divorciar
  rationale: No contexto conjugal, ἀπολύω se refere ao divórcio, não simplesmente a mandar embora.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: sua mulher
  rationale: γυνή pode significar mulher ou esposa; o possessivo e o contexto de divórcio exigem o sentido de esposa. “Sua mulher” é uma expressão corrente e clara em português.
- source_word: γαμήσῃ ἄλλην
  choice: se casar com outra
  rationale: ἄλλην é feminino e indica outra mulher; a formulação portuguesa é natural e preserva esse sentido.
- source_word: μοιχᾶται
  choice: comete adultério
  rationale: Expressão portuguesa padrão e clara para o verbo neste contexto.
- source_word: ἐπ’ αὐτήν
  choice: contra ela
  rationale: 'Preserva a direção relacional da expressão: o adultério constitui uma ofensa contra a mulher de quem ele se divorciou.'
theological_decisions:
- issue: Preservar a força de ἐπ’ αὐτήν como indicação do mal praticado contra a mulher
  choice: comete adultério contra ela
  alternative: comete adultério; comete adultério com outra
  rationale: A expressão consta do grego e não deve ser omitida nem reinterpretada como referência à nova mulher. “Contra ela” mantém a ênfase de que a ação do marido ofende sua mulher.
- issue: Formulação masculina na condição geral
  choice: Quem se divorciar de sua mulher
  alternative: Qualquer homem que se divorciar de sua mulher
  rationale: “Quem” traduz naturalmente a condição geral indefinida sem acrescentar um substantivo ausente do grego; o contexto conjugal permanece explícito em “sua mulher”.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Conserva-se o presente histórico de Marcos. A sintaxe é direta, e “contra ela” mantém a tensão e a precisão relacional do original.
