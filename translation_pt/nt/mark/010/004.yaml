source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· ⸂Ἐπέτρεψεν Μωϋσῆς⸃ βιβλίον ἀποστασίου γράψαι καὶ ἀπολῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/004.yaml
  text: They said[b][a], “Moses permitted us to write a certificate of divorce and send her away.”
translation:
  language: pt
  text: 'Eles responderam: “Moisés permitiu escrever uma certidão de divórcio[a] e mandá-la embora[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um documento de divórcio”. A expressão grega se refere ao documento legal escrito que formalizava o divórcio.
    reason: lexical_alternative
  - marker: b
    text: Ou “e divorciar-se dela”. Literalmente, “e mandá-la embora”, expressão usada aqui no contexto do divórcio.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Eles responderam
  rationale: O artigo substantivado retoma os interlocutores, e δέ introduz a resposta. Em português natural, “responderam” explicita a função discursiva sem acrescentar conteúdo indevido.
- source_word: Ἐπέτρεψεν
  choice: permitiu
  rationale: Preserva o sentido de autorização ou concessão de ἐπιτρέπω e a distinção contextual entre permitir e ordenar.
- source_word: Μωϋσῆς
  choice: Moisés
  rationale: Forma tradicional e corrente do nome em português.
- source_word: βιβλίον ἀποστασίου
  choice: uma certidão de divórcio
  rationale: Designa o documento legal escrito que formalizava o divórcio; “certidão de divórcio” é clara e atual.
- source_word: γράψαι
  choice: escrever
  rationale: Reproduz diretamente o infinitivo de γράφω, sem especificar além do texto.
- source_word: καὶ ἀπολῦσαι
  choice: e mandá-la embora
  rationale: Preserva a imagem verbal de ἀπολύω, que neste contexto se refere ao ato de divorciar-se da esposa. O pronome feminino é suprido a partir do contexto.
theological_decisions:
- issue: Natureza da instrução de Moisés sobre o divórcio
  choice: Moisés permitiu escrever o documento e mandar a esposa embora
  alternative: Moisés ordenou que se escrevesse uma certidão de divórcio
  rationale: O verbo Ἐπέτρεψεν significa explicitamente “permitiu”. Essa formulação mantém a tensão contextual entre concessão e mandamento, sem transformar a permissão em ordem.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Certidão de divórcio” comunica o caráter jurídico do documento; “mandá-la embora” conserva a imagem do original, enquanto a nota esclarece o sentido contextual.
