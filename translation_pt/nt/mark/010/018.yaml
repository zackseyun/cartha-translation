id: MRK.10.18
reference: Mark 10:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/018.yaml
  text: But Jesus said to him[a], “Why do you call me good? No one is good except one—God.”
translation:
  language: pt
  text: 'Mas Jesus lhe disse: “Por que você me chama de bom?[a] Ninguém é bom, a não ser um só: Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Para que você me chama de bom?”'
    reason: Alternativa lexical que reflete mais de perto a forma grega Τί με λέγεις ἀγαθόν, embora seja menos natural em português.
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca de modo natural o leve contraste e a resposta de Jesus à forma como o homem se dirigiu a ele.
- source_word: εἶπεν αὐτῷ
  choice: lhe disse
  rationale: Equivalente corrente e transparente da construção com objeto indireto.
- source_word: Τί
  choice: Por que
  rationale: Embora τί signifique formalmente “que”, aqui funciona idiomaticamente com valor de razão; “Por que” é natural em português.
- source_word: με λέγεις ἀγαθόν
  choice: você me chama de bom
  rationale: Preserva a relação predicativa entre “me” e “bom” em linguagem atual e clara.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: bom
  rationale: Mantém a repetição lexical e a força retórica do grego sem acrescentar qualificações interpretativas.
- source_word: οὐδεὶς
  choice: Ninguém
  rationale: Expressa diretamente a negação universal.
- source_word: εἰ μὴ εἷς
  choice: a não ser um só
  rationale: Reproduz a construção de exceção e conserva a ênfase de εἷς na singularidade daquele que é identificado em seguida.
- source_word: ὁ θεός
  choice: Deus
  rationale: É a forma idiomática em português para o nome divino; o artigo grego não exige “o Deus” neste contexto.
theological_decisions:
- issue: Possível implicação cristológica da declaração de Jesus sobre a bondade
  choice: Traduzir a afirmação diretamente, sem qualificadores interpretativos.
  alternative: Redigir a frase de modo a sugerir que Jesus nega sua divindade ou, no sentido oposto, que afirma explicitamente sua divindade aqui.
  rationale: 'A formulação preserva a tensão do texto: Jesus questiona o uso de “bom” e afirma a singular bondade de Deus, sem tornar explícita uma conclusão cristológica que o próprio versículo não verbaliza.'
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. O pronome “você” torna explícito o sujeito já indicado pela forma verbal grega e soa natural no diálogo. A pontuação “um só: Deus” preserva a ênfase em εἷς e identifica Deus como a única exceção.'
