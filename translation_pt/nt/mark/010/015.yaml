source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/015.yaml
  text: Truly I say to you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: pt
  text: 'Em verdade lhes digo: quem não receber o Reino de Deus como uma criança[a] de modo nenhum entrará nele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «como criança». A expressão pode apontar para humildade, confiança ou dependência próprias de uma criança, mas o grego não especifica qual aspecto está em vista.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Em verdade
  rationale: Introduz uma declaração solene e autorizada. A expressão é clara e digna em português e comunica o valor discursivo do termo sem simplesmente transliterá-lo.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Reproduz diretamente o verbo no presente e o pronome dativo plural, com formulação natural em português.
- source_word: ὃς ἂν
  choice: quem
  rationale: Neste enunciado geral, “quem” expressa de modo idiomático a referência indefinida e abrangente da construção grega.
- source_word: μὴ δέξηται
  choice: não receber
  rationale: “Receber” preserva a ideia de acolhimento receptivo expressa por δέχομαι e se combina naturalmente com “o Reino de Deus”.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: É a formulação tradicional e amplamente compreensível, preservando tanto a dimensão do governo de Deus quanto a de seu domínio sem restringir o sentido.
- source_word: ὡς παιδίον
  choice: como uma criança
  rationale: Mantém a comparação aberta do grego. “Criança” traduz παιδίον sem acrescentar uma qualidade específica, como humildade, confiança ou dependência.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: de modo nenhum entrará
  rationale: A dupla negação com o subjuntivo aoristo é enfática; esta expressão transmite sua força com clareza e sem linguagem arcaica.
- source_word: εἰς αὐτήν
  choice: nele
  rationale: O pronome retoma “Reino”, masculino em português. Com o verbo “entrar”, a forma preposicionada é natural e explícita.
theological_decisions:
- issue: Sentido de receber o Reino de Deus “como uma criança”
  choice: Manter a comparação sem definir qual característica infantil está em vista.
  alternative: Explicitar humildade, confiança ou dependência como o sentido da comparação.
  rationale: O grego não identifica a qualidade específica. Preservar a formulação aberta evita impor uma interpretação teológica particular.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com boa legibilidade brasileira. “Em verdade lhes digo” conserva a solenidade da fórmula; “de modo nenhum” comunica a negação enfática. A nota preserva a ambiguidade interpretativa de ὡς παιδίον.
