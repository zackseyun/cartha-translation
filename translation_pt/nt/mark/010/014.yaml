source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ἠγανάκτησεν καὶ εἶπεν αὐτοῖς· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με, μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/014.yaml
  text: But when Jesus saw it[a], he was indignant and said to them, “Let the children come to me; do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: pt
  text: 'Mas, ao ver isso, Jesus ficou indignado e lhes disse: “Deixem as crianças virem a mim; não as impeçam, pois o Reino de Deus pertence aos que são como elas.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “pois de tais é o Reino de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: Mas, ao ver isso, Jesus
  rationale: O particípio aoristo apresenta a circunstância da reação de Jesus; “isso” retoma naturalmente a repreensão dos discípulos no contexto. δέ marca contraste moderado, bem expresso por “Mas”.
- source_word: ἠγανάκτησεν
  choice: ficou indignado
  rationale: Expressa forte desagrado com dimensão moral, sem sugerir ira descontrolada.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: Deixem as crianças vir a mim
  rationale: ἀφίημι significa aqui permitir; a construção é direta e natural em português. “Crianças” traduz παιδία sem acrescentar um diminutivo não exigido pelo termo.
- source_word: μὴ κωλύετε αὐτά
  choice: não as impeçam
  rationale: Traduz de modo corrente a ordem de não obstruir o acesso das crianças a Jesus; o pronome feminino concorda com “crianças”.
- source_word: τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ
  choice: pois o Reino de Deus pertence aos que são como elas
  rationale: τοιοῦτος tem força representativa e aponta para pessoas desse tipo, não somente para as crianças presentes. “Pertence” comunica em português natural a construção grega com genitivo, enquanto a nota preserva sua forma mais literal.
theological_decisions:
- issue: Sentido de τῶν τοιούτων (“dos que são assim”)
  choice: aos que são como elas
  alternative: “de tais é o Reino de Deus”
  rationale: A tradução comunica a referência representativa da expressão sem afirmar que o Reino consiste exclusivamente em crianças nem acrescentar ideias sobre inocência ou salvação automática. A formulação mais literal é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se “Reino” com inicial maiúscula por convenção editorial para a expressão bíblica “Reino de Deus”. O marcador da nota vem após a declaração a que se refere.
