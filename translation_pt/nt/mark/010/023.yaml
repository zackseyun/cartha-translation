id: MRK.10.23
reference: Mark 10:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ περιβλεψάμενος ὁ Ἰησοῦς λέγει τοῖς μαθηταῖς αὐτοῦ· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/023.yaml
  text: And looking around[a], Jesus says to his disciples, “How difficult it is for those who have wealth to enter the kingdom of God!”
translation:
  language: pt
  text: 'E, olhando ao redor, Jesus diz aos seus discípulos: “Como será difícil para os que têm riquezas[a] entrar no Reino de Deus!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dinheiro”, “bens”.
    reason: χρήματα pode designar dinheiro ou posses materiais de maneira mais ampla.
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: olhando ao redor
  rationale: Preserva de modo natural a ação circunstancial do particípio aoristo e a ideia de Jesus percorrer com o olhar as pessoas ao redor.
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico característico da narrativa vívida de Marcos.
- source_word: Πῶς δυσκόλως
  choice: Como será difícil
  rationale: Expressa em português corrente a exclamação enfática de dificuldade, enquanto o futuro de εἰσελεύσονται é refletido por “será”.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: os que têm riquezas
  rationale: Reproduz a construção participial sem transformá-la no rótulo social fixo “os ricos”.
- source_word: χρήματα
  choice: riquezas
  rationale: Abrange dinheiro e bens materiais, sem restringir o sentido apenas a dinheiro em espécie.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: Reino de Deus
  rationale: Formulação consagrada, clara e semanticamente transparente, que preserva a linguagem concreta de reino.
- source_word: εἰσελεύσονται
  choice: entrar
  rationale: O infinitivo completa naturalmente a construção portuguesa “será difícil para... entrar”, e a orientação futura fica expressa em “será”.
theological_decisions:
- issue: Se a declaração de Jesus expressa impossibilidade absoluta ou grande dificuldade para quem possui riquezas
  choice: 'Grande dificuldade: “Como será difícil para os que têm riquezas...!”'
  alternative: Uma formulação interpretativamente intensificada que indique impossibilidade prática
  rationale: O grego usa δυσκόλως, “com dificuldade”, e não um termo que por si só signifique impossibilidade. A tradução mantém a tensão da afirmação sem antecipar uma conclusão doutrinária mais forte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O presente histórico “diz” conserva a vivacidade de Marcos; “será difícil” mantém a força exclamativa e a orientação futura do verbo grego.
