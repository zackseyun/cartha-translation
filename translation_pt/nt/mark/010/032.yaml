revisions:
- from: Eles estavam a caminho[a], subindo para Jerusalém. Jesus ia à frente deles; eles estavam espantados, e os que o seguiam estavam com medo. Então Jesus chamou novamente os Doze para junto de si[b] e começou a lhes dizer o que estava para lhe acontecer.
  to: Eles estavam a caminho[a], subindo para Jerusalém, e Jesus ia à frente deles. Eles estavam espantados, e os que o seguiam estavam com medo. E, tomando novamente os Doze à parte[b], começou a lhes dizer o que estava para lhe acontecer.
  rationale: A revisão corrige a tradução de παραλαβών, trocando “chamou ... para junto de si” por “tomando ... à parte”, que conserva a ação de levar os Doze consigo e seu sentido contextual de instrução reservada. “E” substitui “Então” para não acrescentar uma sequenciação temporal explícita. As notas permanecem ancoradas e pertinentes às alternativas lexicais.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:56:30Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva bem o cenário da viagem, a subida a Jerusalém, a posição de Jesus à frente do grupo e a distinção entre espanto e medo. Contudo, “chamou ... os Doze para junto de si” não traduz adequadamente παραλαβών: o verbo descreve Jesus tomando/levando os Doze consigo, no contexto para uma conversa reservada, e não simplesmente chamando-os.'
  naturalness: O português é moderno, claro e apropriado. A revisão mantém essa fluidez, mas substitui uma construção interpretativa por uma formulação idiomática mais próxima do grego.
  terminology: “Jerusalém”, “os Doze”, “estavam espantados” e “estavam com medo” são escolhas adequadas. “À parte” expressa naturalmente o sentido contextual de separar os Doze para instrução, sem identificar de modo indevido os demais seguidores.
  issues:
  - severity: medium
    issue: “Chamou novamente os Doze para junto de si” para παραλαβὼν πάλιν τοὺς δώδεκα
    rationale: παραλαμβάνω não significa primariamente “chamar”. Aqui indica tomar os Doze consigo, com a força contextual de os separar para lhes falar. A redação proposta altera a ação narrada.
  - severity: low
    issue: “Então” introduz um valor temporal mais definido do que o conector καί exige
    rationale: Embora seja possível em narrativa portuguesa, “E” preserva de modo mais transparente a simples continuidade coordenativa do grego e é coerente com a nota editorial de não inserir marcador temporal explícito.
  revised_text: Eles estavam a caminho[a], subindo para Jerusalém, e Jesus ia à frente deles. Eles estavam espantados, e os que o seguiam estavam com medo. E, tomando novamente os Doze à parte[b], começou a lhes dizer o que estava para lhe acontecer.
  revised_footnotes:
