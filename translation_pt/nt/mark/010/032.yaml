  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐν τῇ ὁδῷ ἀναβαίνοντες εἰς Ἱεροσόλυμα, καὶ ἦν προάγων αὐτοὺς ὁ Ἰησοῦς, καὶ ἐθαμβοῦντο, ⸂οἱ δὲ⸃ ἀκολουθοῦντες ἐφοβοῦντο. καὶ παραλαβὼν πάλιν τοὺς δώδεκα ἤρξατο αὐτοῖς λέγειν τὰ μέλλοντα αὐτῷ συμβαίνειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/032.yaml
  text: They were on the road[a], going up to Jerusalem, and Jesus was going ahead of them; and they were astonished, while those who were following were afraid. And taking the Twelve aside again[b], he began to tell them the things that were about to happen to him.
translation:
  language: pt
  text: Eles estavam a caminho[a], subindo para Jerusalém, e Jesus ia à frente deles. Eles estavam espantados, e os que o seguiam estavam com medo. E, tomando novamente os Doze à parte[b], começou a lhes dizer o que estava para lhe acontecer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na estrada”.
    reason: lexical_alternative
  - marker: b
    text: Ou “tomando novamente os Doze consigo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ὁδῷ
  choice: a caminho
  rationale: Expressão portuguesa natural que mantém tanto o cenário da viagem quanto a possível ressonância mais ampla de “caminho”; a alternativa concreta “na estrada” consta em nota.
- source_word: ἀναβαίνοντες εἰς Ἱεροσόλυμα
  choice: subindo para Jerusalém
  rationale: Preserva a linguagem de subida, adequada tanto à elevação de Jerusalém quanto ao uso tradicional ligado à peregrinação.
- source_word: προάγων αὐτούς
  choice: ia à frente deles
  rationale: Retrata diretamente a posição de Jesus diante do grupo, sem acrescentar a interpretação mais forte de que ele os “liderava”.
- source_word: ἐθαμβοῦντο
  choice: estavam espantados
  rationale: Comunica assombro intenso ou perplexidade sem necessariamente implicar horror; a forma contínua reflete o imperfeito grego.
- source_word: οἱ δὲ ἀκολουθοῦντες
  choice: os que o seguiam
  rationale: Mantém a formulação participial e não identifica o grupo com precisão maior do que a permitida pelo texto.
- source_word: ἐφοβοῦντο
  choice: estavam com medo
  rationale: Tradução corrente e direta, distinguindo essa reação do espanto expresso pelo verbo anterior.
- source_word: παραλαβὼν ... τοὺς δώδεκα
  choice: chamou ... os Doze para junto de si
  rationale: Expressa em português idiomático que Jesus tomou os Doze consigo para lhes falar; a nota preserva a alternativa mais concisa “tomou consigo”.
- source_word: πάλιν
  choice: novamente
  rationale: Indica com clareza a repetição da ação.
- source_word: ἤρξατο αὐτοῖς λέγειν
  choice: começou a lhes dizer
  rationale: Preserva a força incoativa e explicita naturalmente os destinatários em português.
- source_word: τὰ μέλλοντα αὐτῷ συμβαίνειν
  choice: o que estava para lhe acontecer
  rationale: Mantém a iminência dos acontecimentos sem introduzir uma ideia mais forte de destino inevitável.
theological_decisions:
- issue: Distinção emocional entre os grupos na narrativa
  choice: “estavam espantados” para ἐθαμβοῦντο e “estavam com medo” para ἐφοβοῦντο
  alternative: Generalizar ambas as reações como formas de espanto ou temor
  rationale: Os dois verbos gregos são distintos e o texto parece diferenciar as reações. A tradução conserva essa tensão sem explicar sua causa nem harmonizar as emoções.
- issue: Identidade dos que seguiam
  choice: “os que o seguiam”
  alternative: “seus seguidores” ou identificação de todos como discípulos
  rationale: A formulação preserva a indefinição do particípio grego e evita decidir se o grupo inclui apenas discípulos ou um conjunto mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação divide o longo período grego para fluidez sem eliminar suas relações narrativas. Não se acrescenta um marcador temporal como “naquele momento”, pois δέ funciona aqui como conector discursivo. Todos os marcadores de nota aparecem no texto.
