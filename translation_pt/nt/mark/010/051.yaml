  text: καὶ ἀποκριθεὶς ⸂αὐτῷ ὁ Ἰησοῦς εἶπεν⸃· Τί ⸂σοι θέλεις ποιήσω⸃; ὁ δὲ τυφλὸς εἶπεν αὐτῷ· Ραββουνι, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/051.yaml
  text: And answering him[a], Jesus said, “What do you want me to do for you?” And the blind man said to him, “Rabboni, that I may see again.”
translation:
  language: pt
  text: 'Jesus lhe respondeu: “O que você quer que eu faça por você?” O cego lhe disse: “Rabôni[a], que eu volte a ver.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rabôni é uma forma aramaica de tratamento que significa “meu mestre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: respondeu
  rationale: O particípio aoristo introduz a fala de Jesus como resposta. Em português atual, a forma finita “respondeu” é mais natural do que uma reprodução rígida como “respondendo, disse”, sem perder a relação discursiva do grego.
- source_word: Τί σοι θέλεις ποιήσω
  choice: O que você quer que eu faça por você?
  rationale: A formulação preserva tanto a vontade expressa por θέλεις quanto o dativo σοι (“por você”), em português claro e idiomático.
- source_word: τυφλὸς
  choice: o cego
  rationale: O adjetivo grego é substantivado e identifica o homem já conhecido no contexto. “O cego” é uma forma direta e natural em português.
- source_word: Ραββουνι
  choice: Rabôni
  rationale: Mantém no texto a forma semítica de tratamento preservada pelo grego. A grafia acentuada orienta a pronúncia em português, e a nota explica o significado.
- source_word: ἵνα ἀναβλέψω
  choice: que eu volte a ver
  rationale: No contexto de cura, ἀναβλέπω significa recuperar a visão ou ver novamente. A construção com “que” preserva a forma concisa do pedido e o valor de ἵνα.
theological_decisions:
- issue: Tratamento Ραββουνι dirigido a Jesus
  choice: Manter “Rabôni” no texto com nota explicativa
  alternative: Traduzir diretamente como “meu Mestre” ou “meu Senhor”
  rationale: O texto grego conserva a forma aramaica transliterada, cuja textura histórica e força de tratamento pessoal convém preservar. A nota comunica sua faixa de sentido sem escolher de modo indevido entre “mestre” e “senhor”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe foi tornada natural sem omitir o caráter responsivo da fala de Jesus. O marcador [a] aparece imediatamente após o termo explicado.
