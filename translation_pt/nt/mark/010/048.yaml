id: MRK.10.48
reference: Mark 10:48
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπετίμων αὐτῷ πολλοὶ ἵνα σιωπήσῃ· ὁ δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/048.yaml
  text: And many were rebuking him so that he would be silent[a], but he was crying out all the more, “Son of David, have mercy on me!”
translation:
  language: pt
  text: 'Muitos o repreendiam para que se calasse, mas ele gritava ainda mais: “Filho de Davi[a], tenha misericórdia de mim!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filho de Davi” é um título régio-messiânico; seu sentido também poderia ser expresso como “Messias”, mas aqui se preserva a formulação grega.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμων
  choice: repreendiam
  rationale: O imperfeito indica uma ação contínua ou repetida, e “repreendiam” preserva a força de ἐπιτιμάω no esforço de silenciá-lo.
- source_word: πολλοὶ
  choice: Muitos
  rationale: O adjetivo substantivado é traduzido diretamente, sem introduzir “a multidão”, expressão mais específica que o grego.
- source_word: ἵνα σιωπήσῃ
  choice: para que se calasse
  rationale: Expressa naturalmente a finalidade das repreensões e mantém o sentido de silêncio presente no grego.
- source_word: πολλῷ μᾶλλον
  choice: ainda mais
  rationale: Reproduz o comparativo enfático sem acrescentar explicitamente a ideia de volume.
- source_word: ἔκραζεν
  choice: gritava
  rationale: O imperfeito comunica ação em andamento, enquanto “gritava” preserva a urgência de κράζω.
- source_word: Υἱὲ Δαυίδ
  choice: Filho de Davi
  rationale: Mantém literalmente o título régio-messiânico e sua ressonância teológica, sem substituí-lo por uma interpretação.
- source_word: ἐλέησόν με
  choice: tenha misericórdia de mim
  rationale: Forma uma súplica natural em português contemporâneo e preserva o sentido forte de ἐλεέω.
theological_decisions:
- issue: Significado messiânico de “Filho de Davi”
  choice: Manter o título “Filho de Davi”.
  alternative: “Messias”
  rationale: O grego emprega diretamente Υἱὲ Δαυίδ. Traduzir o título preserva a formulação e permite que sua dimensão messiânica permaneça perceptível sem transformar interpretação em texto.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção “para que se calasse” conserva a relação de finalidade, e “ainda mais” evita explicitar que ele gritava mais alto, algo não declarado diretamente no grego.
