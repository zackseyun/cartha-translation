  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸ δὲ καθίσαι ἐκ δεξιῶν μου ⸀ἢ ἐξ εὐωνύμων οὐκ ἔστιν ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/040.yaml
  text: But to sit at my right or at my left is not mine to give[a], but for those for whom it has been prepared.
translation:
  language: pt
  text: Mas sentar-se à minha direita ou à minha esquerda não cabe a mim conceder[a], mas é para aqueles a quem isso foi preparado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não é meu conceder”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... καθίσαι
  choice: sentar-se
  rationale: O infinitivo articular funciona substantivamente, mas o infinitivo em português preserva de modo natural sua força verbal.
- source_word: ἐκ δεξιῶν μου
  choice: à minha direita
  rationale: Expressa de forma idiomática e direta a posição ao lado direito, sem acrescentar 'mão', ausente no grego.
- source_word: ἢ ἐξ εὐωνύμων
  choice: ou à minha esquerda
  rationale: O uso idiomático plural indica o lado esquerdo; a formulação mantém o paralelismo com 'à minha direita'.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: não cabe a mim conceder
  rationale: Reproduz a ideia de que a concessão não pertence à atribuição de Jesus nesse enunciado, sem explicar teologicamente a limitação.
- source_word: ἀλλ’ οἷς
  choice: mas é para aqueles a quem
  rationale: Explicita de maneira mínima a elipse grega, retomando os lugares mencionados, e preserva o contraste introduzido por ἀλλά.
- source_word: ἡτοίμασται
  choice: isso foi preparado
  rationale: O perfeito passivo indica uma preparação já realizada cujo resultado permanece; 'foi preparado' é claro e natural no contexto.
theological_decisions:
- issue: Se a declaração de Jesus deve ser formulada como negação absoluta de autoridade ou explicada à luz da vontade do Pai
  choice: não cabe a mim conceder
  alternative: não cabe a mim conceder independentemente da vontade do Pai
  rationale: O grego declara a limitação sem fornecer sua explicação. A tradução preserva essa tensão e não introduz uma harmonização teológica ausente do versículo.
- issue: Agente não expresso do passivo em ἡτοίμασται
  choice: 'manter o passivo: ''foi preparado'''
  alternative: Deus preparou
  rationale: O texto não nomeia o agente. Manter o passivo evita inserir explicitamente uma identificação teológica que, embora plausível no contexto, não está formulada aqui.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção 'não cabe a mim conceder' soa natural e preserva a limitação expressa no original; a nota registra uma alternativa mais formal e próxima da estrutura grega.
