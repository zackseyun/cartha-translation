source:
  edition: SBLGNT
  text: ὁ δὲ στυγνάσας ἐπὶ τῷ λόγῳ ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/022.yaml
  text: But he[a], becoming gloomy at the word, went away grieving[c][b], for he had many possessions.
translation:
  language: pt
  text: Mas ele, com o semblante carregado por causa dessa palavra[a], foi embora entristecido, pois tinha muitos bens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “abatido por causa dessa palavra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στυγνάσας
  choice: abatido
  rationale: Expressa uma reação sombria e visível, como a de quem fica com o semblante carregado, sem acrescentar ira ou rebeldia ao texto.
- source_word: ἐπὶ τῷ λόγῳ
  choice: com essa palavra
  rationale: Mantém o singular λόγῳ e comunica de modo natural que a palavra de Jesus foi a ocasião ou causa da reação.
- source_word: ἀπῆλθεν
  choice: foi embora
  rationale: Equivalente narrativo claro e corrente para o movimento de afastar-se.
- source_word: λυπούμενος
  choice: entristecido
  rationale: Preserva a tristeza que acompanha o homem ao sair, com linguagem natural em português.
- source_word: κτήματα πολλά
  choice: muitos bens
  rationale: κτήματα designa propriedades ou posses; 'muitos bens' conserva a ideia de abundância sem limitar indevidamente o referente a imóveis.
- source_word: ἦν γὰρ ἔχων
  choice: pois tinha
  rationale: Reproduz naturalmente em português o estado contínuo expresso pela construção perifrástica grega.
theological_decisions:
- issue: Natureza da reação emocional do homem à exigência de Jesus
  choice: O texto retrata abatimento visível e tristeza, sem juízo moral adicional.
  alternative: Entender que ele ficou irado ou apenas decepcionado.
  rationale: O grego descreve uma reação sombria e pesarosa, mas não afirma explicitamente ira nem define toda a atitude moral do homem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita tanto o literalismo pouco natural quanto a explicitação excessiva da expressão facial.
