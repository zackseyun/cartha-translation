  text: Mas entre vocês não é assim[a]. Pelo contrário, quem quiser tornar-se grande entre vocês será servo de vocês[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas não é dessa maneira entre vocês”.'
    reason: lexical_alternative
  - marker: b
    text: 'Neste contexto, o futuro “será” também pode ter o sentido de “deverá ser”: quem quiser tornar-se grande entre vocês deverá ser servo de vocês.'
