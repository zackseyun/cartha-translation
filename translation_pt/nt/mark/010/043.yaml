lexical_decisions:
- source_word: οὐχ οὕτως δέ ἐστιν ἐν ὑμῖν
  choice: Mas entre vocês não é assim
  rationale: Expressa de modo natural a negação de οὕτως e o contraste marcado por δέ, mantendo a referência ao padrão de autoridade descrito no contexto anterior.
- source_word: ἀλλ’
  choice: Pelo contrário
  rationale: Preserva a forte oposição corretiva entre o modo de governar das nações e o padrão apresentado por Jesus.
- source_word: ὃς ἂν θέλῃ
  choice: quem quiser
  rationale: A construção indefinida com ἄν e subjuntivo é bem representada por uma formulação geral; “quiser” conserva o sentido volitivo de θέλω.
- source_word: μέγας γενέσθαι
  choice: tornar-se grande
  rationale: “Tornar-se” preserva o aspecto ingressivo de γενέσθαι, enquanto “grande” mantém a linguagem de posição ou importância de μέγας.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: É uma formulação atual e clara para o sentido comunitário da expressão, usada de maneira consistente nas duas ocorrências.
- source_word: ἔσται ὑμῶν διάκονος
  choice: será servo de vocês
  rationale: “Será” conserva formalmente o futuro ἔσται, e “servo” comunica o serviço humilde de διάκονος sem sugerir necessariamente um ofício eclesiástico.
theological_decisions:
- issue: Força do futuro ἔσται na instrução de Jesus
  choice: será servo de vocês
  alternative: deverá ser servo de vocês
  rationale: O futuro pode ter força normativa ou imperativa no contexto, mas a tradução principal preserva a forma verbal grega; a nota registra a força contextual possível sem resolver indevidamente a ambiguidade.
- issue: Sentido de διάκονος
  choice: servo
  alternative: servidor; ministro
  rationale: Neste contexto, o termo descreve quem serve humildemente à comunidade, não de modo inequívoco um cargo eclesiástico. “Servo” preserva essa dimensão ética e social.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Vocês” oferece clareza internacional com naturalidade no Brasil; “pelo contrário” marca a correção enfática; a ordem “entre vocês não é assim” evita uma construção rígida. A vírgula final foi mantida porque o versículo prossegue diretamente no seguinte.
