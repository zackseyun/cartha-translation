  source_fidelity: 'O texto traduz todos os elementos relevantes do grego: a construção incoativa Ἤρξατο λέγειν (“começou a ... dizer”), Pedro como sujeito, o pronome dativo não explicitado como “Jesus”, o marcador enfático ἰδού (“Veja”), o pronome explícito ἡμεῖς (“nós”), e a afirmação coordenada de ter deixado tudo e seguido Jesus. “Deixamos” e “seguimos” são adequados para os tempos gregos neste contexto narrativo e não acrescentam avaliação à fala de Pedro.'
