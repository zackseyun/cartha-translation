  text: Ἤρξατο ⸂λέγειν ὁ Πέτρος⸃ αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ⸀ἠκολουθήκαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/028.yaml
  text: Peter began to say to him[a], “Look, we have left everything and followed you.”
translation:
  language: pt
  text: 'Pedro começou a lhe dizer: “Veja, nós deixamos tudo e seguimos você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤρξατο λέγειν
  choice: começou a dizer
  rationale: A construção com ἄρχομαι e infinitivo indica o início da fala; esta formulação é natural e mantém o aspecto narrativo.
- source_word: ὁ Πέτρος
  choice: Pedro
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: αὐτῷ
  choice: lhe
  rationale: Conserva o pronome do grego, cujo referente contextual é Jesus, sem explicitar o nome.
- source_word: Ἰδοὺ
  choice: Veja
  rationale: Funciona aqui como marcador discursivo que chama a atenção; é atual e digno, sem o caráter arcaizante de “Eis”.
- source_word: ἡμεῖς
  choice: nós
  rationale: O pronome expresso preserva a ênfase do grego sobre o grupo dos discípulos.
- source_word: ἀφήκαμεν
  choice: deixamos
  rationale: Expressa de modo direto a ação passada; evita “abandonamos”, que poderia intensificar indevidamente o tom.
- source_word: πάντα
  choice: tudo
  rationale: Equivalente abrangente e idiomático para o neutro plural.
- source_word: ἠκολουθήκαμέν
  choice: seguimos
  rationale: O perfeito indica uma ação iniciada com relevância contínua; em português, o pretérito perfeito simples comunica isso naturalmente no contexto.
- source_word: σοι
  choice: você
  rationale: Traduz diretamente o objeto de ἀκολουθέω em português moderno de ampla legibilidade brasileira.
theological_decisions:
- issue: A afirmação de Pedro sobre o custo do discipulado
  choice: Apresentar diretamente a alegação de Pedro, sem confirmá-la nem atenuá-la.
  alternative: Acrescentar uma avaliação, usar “abrimos mão de tudo” ou antecipar na formulação a resposta de Jesus.
  rationale: O versículo registra a fala enfática de Pedro, não uma avaliação do narrador; a tensão deve permanecer aberta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Veja” preserva a função de ἰδού como chamada de atenção. “Você” evita a ambiguidade regional de formas verbais associadas a “tu” e é amplamente compreensível.
