source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐμβλέψας αὐτῷ ἠγάπησεν αὐτὸν καὶ εἶπεν αὐτῷ· Ἕν ⸀σε ὑστερεῖ· ὕπαγε ὅσα ἔχεις πώλησον καὶ δὸς ⸀τοῖς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν οὐρανῷ, καὶ δεῦρο ἀκολούθει ⸀μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/021.yaml
  text: 'And Jesus[a], looking at him, loved him and said to him, “One thing you lack: go, sell whatever you have and give to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: pt
  text: 'Jesus, olhando para ele, amou-o e lhe disse: “Uma coisa lhe falta: vá, venda tudo o que você tem[a] e dê aos pobres; e você terá um tesouro no céu; venha e siga-me.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tudo quanto você possui”. A expressão grega ὅσα ἔχεις pode ser traduzida de mais de uma forma; neste contexto, abrange o conjunto das posses dele.'
    reason: alternativa lexical
lexical_decisions:
- source_word: ἐμβλέψας αὐτῷ
  choice: olhou atentamente para ele
  rationale: O particípio descreve um olhar dirigido e atento. A formulação mantém essa força sem sugerir uma intensidade emocional maior do que a expressa pelo texto.
- source_word: ἠγάπησεν αὐτόν
  choice: amou-o
  rationale: Tradução direta do aoristo de ἀγαπάω, preservando a afirmação clara de que Jesus amou aquele homem.
- source_word: Ἕν σε ὑστερεῖ
  choice: Uma coisa lhe falta
  rationale: O neutro singular ἕν é usado substantivamente, e 'coisa' torna a frase natural em português. A construção conserva a deficiência presente indicada por ὑστερεῖ.
- source_word: ὕπαγε
  choice: vá
  rationale: Equivalente direto e natural do imperativo de movimento.
- source_word: ὅσα ἔχεις
  choice: tudo o que você tem
  rationale: A expressão relativa pode ser vertida como 'tudo o que você tem' ou 'quanto você tem'. No contexto, seu alcance é abrangente e se refere ao conjunto das posses do homem.
- source_word: πώλησον
  choice: venda
  rationale: Reproduz de modo simples e direto o sentido comercial do imperativo aoristo.
- source_word: δὸς τοῖς πτωχοῖς
  choice: dê aos pobres
  rationale: O adjetivo substantivado πτωχοῖς designa pessoas pobres; 'aos pobres' é corrente e mantém a categoria social mencionada.
- source_word: θησαυρὸν ἐν οὐρανῷ
  choice: um tesouro no céu
  rationale: Expressa de forma natural a recompensa celestial prometida, sem ampliar seu conteúdo.
- source_word: δεῦρο ἀκολούθει μοι
  choice: venha e siga-me
  rationale: δεῦρο convoca o homem a aproximar-se, e o imperativo presente ἀκολούθει comunica o chamado ao seguimento continuado. A expressão portuguesa mantém esse chamado com naturalidade.
theological_decisions:
- issue: O sentido do amor de Jesus pelo homem
  choice: Afirmar diretamente que Jesus 'amou-o'.
  alternative: Reduzir a frase a uma demonstração externa de bondade ou interpretá-la tecnicamente como amor eletivo.
  rationale: O texto declara sem qualificação que Jesus o amou. A tradução não enfraquece a afirmação nem lhe impõe um sistema teológico posterior, preservando a tensão narrativa.
- issue: A abrangência da ordem relativa às posses
  choice: Traduzir ὅσα ἔχεις como 'tudo o que você tem'.
  alternative: Amenizar a ordem como um chamado genérico à generosidade ou usar a formulação mais formal 'tudo quanto você tem'.
  rationale: A expressão grega, no contexto, abrange as posses do homem. A tradução conserva a força integral da ordem sem acrescentar explicações interpretativas ao corpo do versículo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. Emprega 'você' no discurso direto, mas conserva formas pronominais concisas como 'lhe' e 'amou-o'. A pontuação divide as ordens e a promessa para facilitar a leitura sem alterar sua sequência lógica.
