  text: 'E ele lhe disse: “Mestre, tenho guardado todas essas coisas desde a minha juventude.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: disse
  rationale: Verbo narrativo comum de fala; “disse” é natural e preserva o sentido sem acrescentar a ideia de resposta explícita.
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: Vocativo de διδάσκαλος. Em português, “Mestre” é a forma idiomática e digna de se dirigir a quem ensina, sem exigir um sentido teológico adicional.
- source_word: ταῦτα πάντα
  choice: todas essas coisas
  rationale: Mantém o demonstrativo e a totalidade expressa por πάντα, retomando os mandamentos mencionados anteriormente.
- source_word: ἐφυλαξάμην
  choice: tenho guardado
  rationale: No contexto de mandamentos, φυλάσσω significa guardar ou observar. O perfeito composto português resume uma conduta iniciada no passado e afirmada como válida até o presente da fala.
- source_word: ἐκ νεότητός μου
  choice: desde a minha juventude
  rationale: A preposição ἐκ com o genitivo temporal indica o ponto inicial; “desde a minha juventude” expressa isso naturalmente sem ampliar o período para a infância.
- source_word: ὁ δὲ
  choice: E ele
  rationale: δέ funciona aqui como conectivo narrativo leve; “E ele” mantém a continuidade sem introduzir contraste forte.
