  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω, ⸀ἢ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/038.yaml
  text: But Jesus said to them[a], “You do not know what you are asking. Are you able to drink the cup that I drink[b], or to be baptized with the baptism with which I am baptized?”
translation:
  language: pt
  text: 'Mas Jesus lhes disse: “Vocês não sabem o que estão pedindo. São capazes de beber o cálice que eu bebo[a] ou de ser batizados com o batismo com que eu sou batizado[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “cálice” é uma metáfora bíblica para a porção destinada a alguém; aqui se refere especialmente ao sofrimento que Jesus enfrentaria.
    reason: cross_reference
  - marker: b
    text: Ou, de modo mais interpretativo, “passar pelo batismo pelo qual eu passo”. O grego repete palavras da mesma família de “batismo” para dar ênfase.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Mas Jesus lhes disse
  rationale: δέ introduz aqui uma resposta corretiva; “mas” expressa naturalmente esse leve contraste. “Lhes disse” reproduz αὐτοῖς em português corrente e digno.
- source_word: Οὐκ οἴδατε τί αἰτεῖσθε
  choice: Vocês não sabem o que estão pedindo
  rationale: Mantém o sentido básico de οἶδα (“saber”) sem o interpretar antecipadamente como “entender”; “o que estão pedindo” é a forma idiomática de expressar a ação em curso.
- source_word: δύνασθε
  choice: São capazes de
  rationale: Explicita capacidade, o sentido de δύναμαι, e evita que “podem” seja entendido como mera permissão.
- source_word: πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω
  choice: beber o cálice que eu bebo
  rationale: Conserva literalmente a metáfora do cálice e sua formulação paralela, sem acrescentar no texto principal uma interpretação como sofrimento ou ira.
- source_word: ποτήριον
  choice: cálice
  rationale: “Cálice” é a correspondência bíblica tradicional e ainda compreensível para ποτήριον, preservando a metáfora de uma porção ou experiência destinada a alguém.
- source_word: ἢ
  choice: ou
  rationale: Reproduz o valor disjuntivo de ἢ no texto da SBLGNT, sem harmonização com outras tradições textuais ou passagens paralelas.
- source_word: τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι
  choice: ser batizados com o batismo com que eu sou batizado
  rationale: Preserva deliberadamente a repetição do grupo lexical βάπτισμα/βαπτίζω e as formas passivas. Embora menos fluente que uma paráfrase com “passar por”, mantém a força retórica e as ressonâncias do original.
theological_decisions:
- issue: Sentido metafórico de “cálice” e “batismo”
  choice: Manter literalmente as duas metáforas no texto principal.
  alternative: Explicitar como “sofrer o sofrimento que eu sofro”, “passar pela mesma provação” ou mencionar diretamente morte e ira divina.
  rationale: O contexto aponta para o sofrimento que Jesus enfrentará, mas este versículo não esgota o alcance das imagens. Conservá-las evita restringir a interpretação e mantém a tensão teológica e intertextual do texto.
translation_notes:
  register: Português moderno, amplamente internacional, com boa legibilidade brasileira. O pronome “vocês” comunica naturalmente o plural; “são capazes de” destaca capacidade. A repetição pouco usual em “ser batizados com o batismo” é intencional, pois reproduz uma característica retórica relevante do grego.
