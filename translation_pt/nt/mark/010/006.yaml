  text: But from the beginning of creation[b][a], he made them male and female.
translation:
  language: pt
  text: Mas, desde o princípio da criação, ele os fez macho e fêmea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, seguindo mais de perto a ordem grega: “macho e fêmea ele os fez”. O verbo grego significa “fez”; “criou” reflete o contexto de Gênesis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ δὲ ἀρχῆς κτίσεως
  choice: Mas, desde o princípio da criação
  rationale: δὲ tem força contrastiva em relação à concessão anterior sobre o divórcio; ἀπό marca o ponto inicial, expresso naturalmente em português por “desde”; e o genitivo κτίσεως é preservado como “da criação”.
- source_word: ἄρσεν καὶ θῆλυ
  choice: homem e mulher
  rationale: No contexto da citação de Gênesis, a expressão designa os dois sexos humanos. Em português corrente, “homem e mulher” comunica essa oposição humana de modo mais natural e digno do que “macho e fêmea”, sem deslocá-la para papéis sociais.
- source_word: ἐποίησεν
  choice: fez
  rationale: ποιέω significa aqui “fazer”. “Fez” mantém transparência lexical, enquanto “criou” explicitaria o pano de fundo de Gênesis com um verbo diferente.
- source_word: αὐτούς
  choice: os
  rationale: O pronome acusativo masculino plural retoma os seres humanos mencionados como homem e mulher. O pronome átono “os” preserva essa referência sem acrescentar “ambos”.
theological_decisions:
- issue: Expressão dos sexos na citação de Gênesis
  choice: homem e mulher
  alternative: macho e fêmea
  rationale: A tradução preserva a polaridade sexual da expressão grega, mas usa os termos normalmente aplicados a seres humanos em português. A nota registra a correspondência lexical mais direta.
- issue: Sujeito divino implícito
  choice: ele os fez
  alternative: Deus os fez
  rationale: O grego deixa o sujeito na forma verbal e ele é entendido pelo contexto da citação. “Ele” mantém essa forma sem inserir explicitamente “Deus” no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Desde o princípio da criação” reproduz naturalmente a relação temporal; “homem e mulher” evita a conotação zoológica que “macho e fêmea” pode ter no uso corrente, enquanto a nota conserva a forma lexical mais direta.
