base_translation:
  language: en
  yaml_path: translation/nt/mark/010/044.yaml
  text: And whoever wants to be first among you will be the slave of all[a].
translation:
  language: pt
  text: E quem quiser ser o primeiro entre vocês será escravo de todos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo de todos”. A palavra grega é doulos, termo mais forte que a palavra traduzida por “servo” no versículo anterior; por isso, usa-se aqui “escravo” para preservar o contraste.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: quem quiser
  rationale: A construção com pronome relativo, ἄν e subjuntivo exprime uma condição geral e indefinida. “Quem quiser” é natural em português e preserva o sentido volitivo.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: Neste contexto de posição dentro do grupo, a expressão significa idiomaticamente “entre vocês”, não apenas localização física.
- source_word: πρῶτος
  choice: o primeiro
  rationale: Preserva diretamente a ideia de primazia ou posição de destaque e soa natural com o artigo em português.
- source_word: ἔσται
  choice: será
  rationale: Reproduz diretamente o futuro de εἰμί. Embora a declaração tenha força normativa no contexto, não se substitui a forma por “deverá ser”.
- source_word: πάντων
  choice: de todos
  rationale: O genitivo indica submissão ou relação com todos e mantém o alcance universal da expressão.
- source_word: δοῦλος
  choice: escravo
  rationale: δοῦλος é mais forte que διάκονος no versículo anterior. “Escravo” preserva a intensificação, a subordinação radical e a baixa condição social evocadas pelo termo.
theological_decisions:
- issue: Tradução de δοῦλος numa declaração sobre discipulado
  choice: escravo
  alternative: servo
  rationale: O contexto contrapõe a busca por posição à autodepreciação radical. Como o versículo anterior emprega διάκονος, traduzir δοῦλος por “escravo” mantém a distinção e a intensificação, sem suavizar a tensão da imagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para legibilidade brasileira e uso internacional corrente. A ordem e a concisão do dito foram preservadas.
