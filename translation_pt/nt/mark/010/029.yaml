source:
  edition: SBLGNT
  text: ⸂ἔφη ὁ Ἰησοῦς⸃· Ἀμὴν λέγω ὑμῖν, οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ἀδελφοὺς ἢ ἀδελφὰς ἢ ⸂μητέρα ἢ πατέρα⸃ ἢ τέκνα ἢ ἀγροὺς ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/029.yaml
  text: Jesus said, “Truly I say to you, there is no one who has left house or brothers or sisters or mother or father or children or fields for my sake and for the sake of the gospel,”
translation:
  language: pt
  text: 'Jesus disse: “Em verdade lhes digo: não há ninguém que tenha deixado casa, irmãos, irmãs, mãe, pai, filhos ou campos por minha causa e por causa do evangelho,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη ὁ Ἰησοῦς
  choice: Jesus disse
  rationale: A forma de φημί introduz a fala de modo simples; “disse” é natural e não acrescenta a ideia de resposta que não está explícita.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Em verdade lhes digo
  rationale: Preserva a solenidade da fórmula introdutória e soa digna e compreensível em português moderno.
- source_word: οὐδείς ἐστιν ὃς
  choice: não há ninguém que
  rationale: Reproduz de maneira idiomática a construção existencial e sua força universal negativa.
- source_word: ἀφῆκεν
  choice: tenha deixado
  rationale: O pretérito perfeito composto do subjuntivo se ajusta à oração relativa generalizante sem sugerir necessariamente abandono ou repúdio.
- source_word: οἰκίαν
  choice: casa
  rationale: Equivalente direto que pode denotar a moradia ou propriedade, sem a carga afetiva adicional de “lar”.
- source_word: ἀδελφοὺς ἢ ἀδελφὰς
  choice: irmãos, irmãs
  rationale: Mantém as duas categorias familiares explicitamente distintas no grego.
- source_word: μητέρα ἢ πατέρα
  choice: mãe, pai
  rationale: Equivalentes diretos, preservando a ordem do texto da SBLGNT.
- source_word: τέκνα
  choice: filhos
  rationale: Em português, “filhos” é o termo natural e abrangente para a descendência, sem especificar sexo.
- source_word: ἀγρούς
  choice: campos
  rationale: Representa concretamente terrenos rurais ou cultivados e permanece mais próximo do grego que “fazendas”.
- source_word: ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου
  choice: por minha causa e por causa do evangelho
  rationale: Preserva a repetição enfática de ἕνεκεν e distingue claramente as duas expressões coordenadas.
theological_decisions:
- issue: A natureza de deixar familiares e propriedades por causa de Jesus e do evangelho
  choice: tenha deixado
  alternative: tenha abandonado
  rationale: “Deixado” conserva o custo radical do discipulado sem afirmar além do texto que houve repúdio definitivo ou negligência das responsabilidades familiares.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A fórmula “Em verdade lhes digo” mantém o caráter proverbial e autoritativo da declaração. A vírgula final foi preservada porque o versículo continua sintaticamente em Marcos 10:30.
