  naturalness: O português é moderno, claro e solene. «Em verdade lhes digo» é uma formulação estabelecida e compreensível; «não há ninguém que tenha deixado» é sintaticamente natural. A vírgula final é apropriada, pois a frase continua no versículo seguinte.
