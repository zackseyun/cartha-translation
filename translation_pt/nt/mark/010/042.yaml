id: MRK.10.42
reference: Mark 10:42
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂καὶ προσκαλεσάμενος αὐτοὺς ὁ Ἰησοῦς⸃ λέγει αὐτοῖς· Οἴδατε ὅτι οἱ δοκοῦντες ἄρχειν τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι αὐτῶν κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/042.yaml
  text: And Jesus called them to himself and said to them[a], “You know that those who are considered rulers of the Gentiles lord it over them[b], and their great ones exercise authority over them.”
translation:
  language: pt
  text: 'Jesus os chamou para junto de si e lhes disse: “Vocês sabem que aqueles que são considerados governantes[a] dos gentios[b] dominam sobre eles, e os seus poderosos exercem autoridade sobre eles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aqueles que parecem governar”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “das nações”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: chamou para junto de si
  rationale: Expressa o valor médio de προσκαλέομαι, isto é, chamar alguém para perto de si, e mantém de modo natural a ação anterior à fala de Jesus.
- source_word: λέγει
  choice: disse
  rationale: O presente histórico grego é vertido pelo pretérito, forma corrente e natural na narrativa portuguesa.
- source_word: Οἴδατε
  choice: Vocês sabem
  rationale: οἶδα tem sentido presente e indica conhecimento reconhecido; “vocês sabem” é direto, atual e amplamente compreensível.
- source_word: οἱ δοκοῦντες ἄρχειν
  choice: aqueles que são considerados governantes
  rationale: Preserva o sentido de pessoas publicamente tidas ou reconhecidas como governantes, sem negar necessariamente que exerçam governo de fato; a leitura alternativa é registrada em nota.
- source_word: τῶν ἐθνῶν
  choice: dos gentios
  rationale: No contexto judaico do dito, ἔθνη pode designar os povos não judeus. “Gentios” preserva esse contraste, enquanto “nações” permanece como alternativa lexical em nota.
- source_word: κατακυριεύουσιν
  choice: dominam sobre
  rationale: Comunica o exercício opressivo ou prepotente do domínio, força presente no composto κατακυριεύω, sem recorrer a uma expressão pouco natural em português.
- source_word: οἱ μεγάλοι αὐτῶν
  choice: os seus poderosos
  rationale: μέγαλοι designa aqui pessoas de elevada posição e poder. “Poderosos” é natural em português e evita especificar um cargo que o grego não menciona.
- source_word: κατεξουσιάζουσιν
  choice: exercem autoridade sobre
  rationale: Mantém a referência ao uso da autoridade e preserva alguma distinção em relação ao verbo anterior, mais explicitamente marcado como domínio opressivo.
theological_decisions:
- issue: Força de δοκοῦντες em οἱ δοκοῦντες ἄρχειν
  choice: aqueles que são considerados governantes
  alternative: aqueles que parecem governar
  rationale: A formulação principal reflete reconhecimento ou reputação pública, sem insinuar que a autoridade seja apenas aparente. A nota preserva a ambiguidade lexical genuína de δοκέω.
- issue: Referente de τῶν ἐθνῶν
  choice: gentios
  alternative: nações
  rationale: “Gentios” expressa adequadamente os povos não judeus no contexto do Evangelho, mas “nações” também é uma tradução lexical possível e fica registrada em nota.
- issue: Caráter do poder descrito por κατακυριεύουσιν e κατεξουσιάζουσιν
  choice: dominam sobre / exercem autoridade sobre
  alternative: subjugam / exercem poder sobre
  rationale: A tradução conserva o paralelismo e a crítica ao uso dominador do poder sem acrescentar uma teoria política ou eclesiológica não explicitada no versículo.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para leitura ampla no Brasil. A ordem e o paralelismo do grego são preservados sem rigidez; “poderosos” traduz a posição social de οἱ μεγάλοι de modo idiomático.
