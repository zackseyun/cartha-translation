review_pass:
  verdict: approve
  source_fidelity: A tradução representa adequadamente a sequência participial («Jesus os chamou para junto de si e lhes disse») e o presente histórico como pretérito narrativo. «Aqueles que são considerados governantes dos gentios» comunica de modo defensável οἱ δοκοῦντες ἄρχειν τῶν ἐθνῶν, sem transformar a expressão em negação de sua autoridade real. «Dominam sobre eles» preserva a força dominadora de κατακυριεύουσιν; «os seus poderosos exercem autoridade sobre eles» mantém o paralelismo e a distinção lexical de κατεξουσιάζουσιν.
  naturalness: O texto é claro, moderno e adequado à leitura brasileira e internacional. «Vocês sabem», «para junto de si» e «os seus poderosos» são naturais no registro bíblico acessível adotado. A repetição de «eles» reproduz utilmente o paralelismo do original.
  terminology: «Gentios» é uma opção contextual e lexicalmente legítima para τῶν ἐθνῶν, com «nações» devidamente preservado como alternativa. «Governantes», «poderosos» e «exercem autoridade» não especificam cargos ausentes do grego nem introduzem interpretação confessional.
