  text: ἐὰν μὴ λάβῃ ἑκατονταπλασίονα νῦν ἐν τῷ καιρῷ τούτῳ οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ ⸀μητέρας καὶ τέκνα καὶ ἀγροὺς μετὰ διωγμῶν, καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/030.yaml
  text: who will not receive a hundredfold now in this time—houses and brothers and sisters and mothers and children and fields[a], with persecutions—and in the age to come[b], eternal life.
translation:
  language: pt
  text: que não receba cem vezes mais[a], agora, neste tempo — casas, irmãos, irmãs, mães, filhos e campos, com perseguições — e, na era vindoura[b], a vida eterna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cem por um”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “na era que há de vir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λάβῃ
  choice: receba
  rationale: No contexto de promessa e recompensa, “receba” expressa algo concedido, sem sugerir apropriação ativa.
- source_word: ἑκατονταπλασίονα
  choice: cem vezes mais
  rationale: Expressão clara no português atual que conserva a força quantitativa de uma retribuição centuplicada.
- source_word: νῦν ἐν τῷ καιρῷ τούτῳ
  choice: agora, neste tempo
  rationale: Mantém explícita a ênfase no presente e o contraste com a era vindoura.
- source_word: οἰκίας
  choice: casas
  rationale: Equivalente concreto e direto do plural grego.
- source_word: ἀδελφοὺς καὶ ἀδελφὰς
  choice: irmãos, irmãs
  rationale: Preserva a distinção explícita entre os termos masculino e feminino no texto grego.
- source_word: μητέρας
  choice: mães
  rationale: Equivalente direto, mantendo o plural do texto adotado pelo SBLGNT.
- source_word: τέκνα
  choice: filhos
  rationale: Em português, “filhos” pode designar coletivamente os descendentes de ambos os sexos e soa natural nesta enumeração familiar.
- source_word: ἀγρούς
  choice: campos
  rationale: Conserva a imagem concreta de terrenos rurais ou cultivados.
- source_word: μετὰ διωγμῶν
  choice: com perseguições
  rationale: Mantém sem atenuação a tensão entre a abundante recompensa presente e o sofrimento contínuo.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: na era vindoura
  rationale: Expressa o sentido temporal e escatológico de αἰών, em contraste com “neste tempo”.
- source_word: ζωὴν αἰώνιον
  choice: a vida eterna
  rationale: Equivalente idiomático estabelecido que comunica adequadamente o sentido escatológico da expressão.
theological_decisions:
- issue: Natureza da recompensa prometida no tempo presente
  choice: Apresentar diretamente casas, relações familiares e campos como recompensa presente, mantendo “com perseguições”.
  alternative: Reduzir a promessa a bênçãos exclusivamente espirituais ou entendê-la como prosperidade material livre de sofrimento.
  rationale: O texto reúne recompensa abundante e perseguições; a tradução preserva essa tensão sem impor uma interpretação denominacional.
- issue: Distinção de gênero nos termos familiares
  choice: Traduzir ἀδελφοὺς e ἀδελφὰς separadamente como “irmãos, irmãs”.
  alternative: Fundir ambos em um único termo coletivo.
  rationale: O grego nomeia separadamente homens e mulheres, e a tradução conserva essa distinção.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os travessões delimitam a enumeração e preservam o contraste entre a recompensa presente, acompanhada de perseguições, e a vida eterna na era vindoura. O fragmento começa com “que não receba” porque continua sintaticamente o versículo anterior.
