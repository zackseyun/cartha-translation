  text: ἕνεκεν τούτου καταλείψει ἄνθρωπος τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα ⸂καὶ προσκολληθήσεται πρὸς τὴν γυναῖκα αὐτοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/007.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife,[a]
translation:
  language: pt
  text: Por isso, o homem deixará seu pai e sua mãe e se unirá à sua mulher,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se apegará à sua mulher”. O verbo grego pode enfatizar uma ligação estreita.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos antigos omitem “e se unirá à sua mulher”.
    reason: textual_variant
lexical_decisions:
- source_word: ἕνεκεν τούτου
  choice: Por isso
  rationale: Expressão causal natural em português moderno, preservando a função explicativa do grego.
- source_word: καταλείψει
  choice: deixará
  rationale: Traduz diretamente o futuro indicativo e comunica de modo claro a saída do núcleo familiar dos pais.
- source_word: ἄνθρωπος
  choice: o homem
  rationale: Embora o substantivo possa ser genérico em outros contextos, aqui a referência subsequente à sua mulher especifica o participante masculino do casamento.
- source_word: τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα
  choice: seu pai e sua mãe
  rationale: Mantém os dois vínculos parentais e soa natural em português.
- source_word: προσκολληθήσεται
  choice: se unirá
  rationale: O futuro passivo descreve estreita vinculação conjugal. A forma pronominal é idiomática em português, sem tornar explícito um agente não indicado.
- source_word: πρὸς τὴν γυναῖκα αὐτοῦ
  choice: à sua mulher
  rationale: No contexto matrimonial, γυνή significa esposa; “sua mulher” é uma formulação corrente e digna em português amplamente compreensível.
theological_decisions:
- issue: Linguagem representativa marcada por gênero numa citação sobre o casamento
  choice: o homem ... sua mulher
  alternative: a pessoa ... seu cônjuge
  rationale: O contexto especifica o par conjugal masculino-feminino; manter essa referência evita neutralizar uma distinção presente no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Por isso” e “se unirá” oferecem naturalidade sem perder a força causal e relacional do original.
