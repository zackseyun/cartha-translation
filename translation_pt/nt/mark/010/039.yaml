base_translation:
  language: en
  yaml_path: translation/nt/mark/010/039.yaml
  text: And they said to him[a], “We are able.” But Jesus said to them, “The cup that I drink, you will drink; and the baptism with which I am baptized[b], you will be baptized,”
translation:
  language: pt
  text: 'Eles lhe disseram: “Podemos.”[a] Mas Jesus lhes disse: “O cálice que eu bebo vocês beberão, e vocês serão batizados com o batismo com o qual sou batizado,[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Somos capazes.”'
    reason: lexical_alternative
  - marker: b
    text: “Cálice” e “batismo” são metáforas para o sofrimento e o destino que Jesus está prestes a enfrentar e dos quais seus discípulos também participarão.
    reason: cross_reference
lexical_decisions:
- source_word: Δυνάμεθα
  choice: Podemos
  rationale: Forma direta e natural em português para a afirmação presente de capacidade, preservando a confiança da resposta sem acrescentar interpretação.
- source_word: ποτήριον
  choice: cálice
  rationale: Mantém a imagem bíblica de uma experiência ou destino designado, aqui ligado ao sofrimento, sem explicá-la dentro do texto.
- source_word: πίνω / πίεσθε
  choice: eu bebo / vocês beberão
  rationale: Preserva o paralelismo verbal entre a experiência de Jesus e a experiência futura dos discípulos.
- source_word: βάπτισμα
  choice: batismo
  rationale: Conserva o termo e sua ressonância bíblica, enquanto o contexto e a nota esclarecem seu emprego metafórico.
- source_word: βαπτίζομαι / βαπτισθήσεσθε
  choice: sou batizado / vocês serão batizados
  rationale: Reproduz as formas passivas e mantém a ligação lexical explícita com “batismo”.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Jesus, porém, lhes disse
  rationale: “Porém” expressa o contraste moderado entre a autoconfiança dos discípulos e a resposta de Jesus.
theological_decisions:
- issue: Linguagem metafórica do cálice e do batismo
  choice: Preservar as duas metáforas no texto principal.
  alternative: Substituí-las diretamente por “sofrimento”, “morte” ou “martírio”.
  rationale: As imagens fazem parte da formulação teologicamente significativa do texto e não devem ser reduzidas a uma única explicação.
- issue: Relação do dito com o batismo sacramental
  choice: Traduzir βάπτισμα por “batismo”, deixando o contexto indicar seu sentido metafórico.
  alternative: Usar “imersão”, “provação” ou “experiência”.
  rationale: “Batismo” corresponde diretamente ao termo grego e preserva sua ressonância; a nota evita que o emprego metafórico seja perdido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural e paralelismo deliberadamente preservado. A colocação “com o batismo com que” é um pouco solene, mas natural o bastante e mantém a repetição do grego.
