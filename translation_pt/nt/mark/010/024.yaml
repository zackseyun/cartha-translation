source:
  edition: SBLGNT
  text: οἱ δὲ μαθηταὶ ἐθαμβοῦντο ἐπὶ τοῖς λόγοις αὐτοῦ. ὁ δὲ Ἰησοῦς πάλιν ἀποκριθεὶς λέγει αὐτοῖς· Τέκνα, πῶς δύσκολόν ⸀ἐστιν εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/024.yaml
  text: But the disciples were astonished at his words. Jesus answered again and said to them[a], “Children, how difficult it is to enter the kingdom of God!”
translation:
  language: pt
  text: 'Mas os discípulos ficaram espantados com as palavras dele. Jesus, porém, tornou a lhes dizer[a]: “Filhos, como é difícil entrar no Reino de Deus!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “Filhos, como é difícil para os que confiam nas riquezas entrar no Reino de Deus!”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐθαμβοῦντο
  choice: ficaram espantados
  rationale: Expressa com naturalidade a forte reação de assombro dos discípulos. Embora o imperfeito grego apresente a reação em curso, o português narrativo favorece aqui a forma perfectiva sem perder o sentido contextual.
- source_word: ἐπὶ τοῖς λόγοις αὐτοῦ
  choice: com as palavras dele
  rationale: A preposição ἐπί com dativo indica aquilo que provocou ou fundamentou o espanto. “Com as palavras dele” é claro, corrente e mantém a referência explícita às palavras de Jesus.
- source_word: πάλιν ἀποκριθεὶς λέγει αὐτοῖς
  choice: tornou a lhes dizer
  rationale: Reproduz o valor reiterativo de πάλιν e comunica naturalmente em português a retomada da fala. A fórmula grega ἀποκριθεὶς λέγει não exige a conservação mecânica de dois verbos, sobretudo porque não há uma pergunta explícita neste ponto.
- source_word: Τέκνα
  choice: Filhos
  rationale: Como vocativo afetuoso dirigido por um mestre a seus discípulos, “Filhos” preserva a ternura e a relação figurada sem acrescentar o possessivo “meus”. “Crianças” soaria como referência à idade, pouco natural neste contexto.
- source_word: πῶς δύσκολόν ἐστιν
  choice: como é difícil
  rationale: Mantém a força exclamativa de πῶς e traduz diretamente o predicativo δύσκολον em linguagem atual e digna.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: entrar no Reino de Deus
  rationale: Formulação portuguesa natural e fiel para o movimento expresso por εἰς com εἰσελθεῖν. A inicial maiúscula em “Reino” sinaliza a realidade teológica específica sem alterar o sentido.
theological_decisions:
- issue: Inclusão da expressão “para os que confiam nas riquezas”
  choice: 'Seguir a leitura mais curta do SBLGNT: “como é difícil entrar no Reino de Deus”'
  alternative: “Filhos, como é difícil para os que confiam nas riquezas entrar no Reino de Deus”
  rationale: A leitura fornecida pelo texto grego crítico não contém a expressão explicativa. Mantê-la fora do texto principal preserva a formulação mais ampla e sua tensão teológica; a variante mais longa, por restringir explicitamente a dificuldade aos que confiam nas riquezas, é registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Tornou a lhes dizer” evita uma reprodução rígida da fórmula narrativa grega; “Filhos” conserva o tom afetuoso do vocativo. O marcador [a] foi colocado imediatamente após a introdução à fala, sinalizando a variante que ocorre dentro da declaração de Jesus.
