base_translation:
  language: en
  yaml_path: translation/nt/mark/010/016.yaml
  text: And he took them in his arms and blessed them[b][a], laying his hands on them.
translation:
  language: pt
  text: E, tomando-as nos braços, as abençoava[a], pondo as mãos sobre elas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego está no imperfeito e tem forma intensificada, podendo sugerir uma bênção contínua, reiterada ou enfática.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισάμενος
  choice: tomando-as nos braços
  rationale: O particípio indica especificamente acolher ou tomar alguém nos braços. A formulação é natural em português e preserva a ternura física da ação.
- source_word: κατευλόγει
  choice: continuava a abençoá-las
  rationale: O imperfeito apresenta a bênção como ação em curso ou reiterada, enquanto o composto intensivo pode sugerir ênfase. A tradução explicita prudentemente o aspecto durativo sem acrescentar uma ideia alheia ao grego.
- source_word: τιθεὶς τὰς χεῖρας ἐπ’ αὐτά
  choice: impondo-lhes as mãos
  rationale: A expressão descreve o gesto que acompanha a bênção. 'Impor as mãos' é idiomático, claro e reconhecível no registro bíblico português.
- source_word: αὐτὰ ... αὐτά
  choice: as / lhes
  rationale: Os pronomes retomam as crianças mencionadas no contexto imediato; as formas femininas concordam naturalmente com 'crianças' em português.
- source_word: καὶ
  choice: E
  rationale: A conjunção simples preserva o encadeamento narrativo característico de Marcos sem introduzir valor temporal ou conclusivo adicional.
theological_decisions:
- issue: Natureza da ação de Jesus para com as crianças
  choice: Manter as ações concretas de tomá-las nos braços, abençoá-las e impor-lhes as mãos, sem terminologia sacramental ou cerimonial adicional.
  alternative: Ele as abraçou e pronunciou uma bênção sobre elas / abençoou-as mediante a imposição de mãos.
  rationale: O texto retrata a acolhida afetuosa e a bênção de Jesus. A tradução preserva os gestos sem enquadrá-los em categorias doutrinárias posteriores que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase mantém o fluxo narrativo do grego. 'Impondo-lhes as mãos' preserva o gesto bíblico tradicional sem interpretação confessional adicional.
