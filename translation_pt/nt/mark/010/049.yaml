  text: καὶ στὰς ὁ Ἰησοῦς εἶπεν· ⸂Φωνήσατε αὐτόν⸃. καὶ φωνοῦσι τὸν τυφλὸν λέγοντες αὐτῷ· Θάρσει, ⸀ἔγειρε, φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/049.yaml
  text: And Jesus stopped and said[a], “Call him.” And they called the blind man, saying to him, “Take courage; get up[b], he is calling you.”
translation:
  language: pt
  text: 'E Jesus parou e disse: “Chamem-no.” E chamaram o cego e lhe disseram: “Coragem! Levante-se; ele está chamando você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: parou
  rationale: Embora seja formalmente um particípio de ἵστημι, no contexto narrativo indica que Jesus interrompeu seu movimento. “Parou” é natural e preciso em português.
- source_word: Φωνήσατε αὐτόν
  choice: Chamem-no
  rationale: O imperativo plural de φωνέω ordena aos presentes que chamem o homem. “Chamem-no” preserva tanto o número verbal quanto a concisão da ordem.
- source_word: φωνοῦσι
  choice: chamaram
  rationale: Mantém a repetição lexical de φωνέω e expressa naturalmente, em português, a execução imediata da ordem de Jesus.
- source_word: τὸν τυφλὸν
  choice: o cego
  rationale: O adjetivo substantivado designa o homem cego já identificado no contexto. “O cego” é direto e natural, sem acrescentar informação.
- source_word: Θάρσει
  choice: Coragem!
  rationale: O imperativo transmite ânimo e encorajamento. A interjeição “Coragem!” reproduz sua força de modo corrente e digno.
- source_word: ἔγειρε
  choice: Levante-se
  rationale: O imperativo chama o homem a se erguer. “Levante-se” é claro, natural e ligeiramente mais digno do que alternativas coloquiais.
- source_word: φωνεῖ σε
  choice: ele está chamando você
  rationale: A construção progressiva comunica a ação presente e imediata; “você” oferece ampla legibilidade brasileira sem alterar o referente.
- source_word: καὶ φωνοῦσι
  choice: Então chamaram
  rationale: Embora καί possa ser vertido literalmente por “e”, aqui “então” comunica com naturalidade a sequência narrativa e a resposta à ordem de Jesus.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição de “chamar” foi preservada por refletir a repetição de φωνέω no grego. Não foram incluídas notas, pois as alternativas são estilísticas e não envolvem ambiguidade relevante para publicação.
