  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/009.yaml
  text: Therefore[a], what God has joined together, man must not separate.
translation:
  language: pt
  text: Portanto, o que Deus uniu, ninguém separe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃ
  choice: o que
  rationale: O pronome relativo neutro singular retoma a união matrimonial mencionada no contexto; “o que” é natural em português e preserva essa referência coletiva.
- source_word: οὖν
  choice: Portanto
  rationale: Marca a conclusão decorrente do argumento anterior sobre a ação e o propósito de Deus no casamento.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: É o sujeito explícito da ação; em português, o nome aparece naturalmente sem artigo neste enunciado.
- source_word: συνέζευξεν
  choice: uniu
  rationale: O aoristo descreve a ação divina de juntar em união. “Uniu” é claro e idiomático; evita tornar excessivamente explícita a metáfora literal de pôr sob o mesmo jugo.
- source_word: ἄνθρωπος
  choice: ninguém
  rationale: O singular sem artigo tem sentido humano genérico e, com a proibição, equivale naturalmente a “nenhuma pessoa”. “Ninguém” comunica com clareza que nenhum ser humano deve desfazer a união.
- source_word: μὴ χωριζέτω
  choice: separe
  rationale: O imperativo presente com μή exprime proibição. O presente do subjuntivo após “ninguém” preserva em português uma formulação direta, solene e natural.
theological_decisions:
- issue: Sentido genérico de ἄνθρωπος na proibição
  choice: ninguém
  alternative: o homem não separe / nenhuma pessoa separe
  rationale: Aqui ἄνθρωπος não restringe a proibição ao sexo masculino, mas contrasta qualquer ser humano com Deus. “Ninguém” preserva essa abrangência sem introduzir uma distinção de gênero ausente do sentido contextual.
- issue: Natureza da união expressa por συνέζευξεν
  choice: uniu
  alternative: juntou / pôs sob o mesmo jugo
  rationale: “Uniu” mantém a ação divina central sem definir além do texto o modo ou a natureza teológica exata dessa união.
translation_notes:
  register: Português moderno, amplo e digno, com boa legibilidade brasileira. A construção é concisa e proverbial, preservando a ênfase contrastiva entre a ação de Deus e a proibição dirigida a qualquer ser humano.
