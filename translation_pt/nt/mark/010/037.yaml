  text: οἱ δὲ εἶπαν αὐτῷ· Δὸς ἡμῖν ἵνα εἷς ⸂σου ἐκ δεξιῶν⸃ καὶ εἷς ἐξ ⸀ἀριστερῶν καθίσωμεν ἐν τῇ δόξῃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/037.yaml
  text: They said to him, “Grant to us that one of us may sit at your right and one at your left in your glory.”
translation:
  language: pt
  text: 'Eles lhe disseram: “Concede-nos que, na tua glória, um de nós se sente à tua direita e o outro à tua esquerda.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δὸς ἡμῖν
  choice: Concede-nos
  rationale: Expressa naturalmente o pedido por uma concessão ou privilégio, mantendo o tom direto do imperativo grego.
- source_word: εἷς ... καὶ εἷς
  choice: um de nós ... e o outro
  rationale: Torna explícita em português a referência aos dois interlocutores, já implícita no contexto e refletida com precisão pelo sentido da construção.
- source_word: ἐκ δεξιῶν ... ἐξ ἀριστερῶν
  choice: à tua direita ... à tua esquerda
  rationale: São as expressões portuguesas naturais para posições de honra ao lado de alguém.
- source_word: ἐν τῇ δόξῃ σου
  choice: na tua glória
  rationale: Preserva a formulação compacta e a possível amplitude teológica de δόξα, sem definir se aponta ao reino, à exaltação ou à manifestação gloriosa de Jesus.
theological_decisions:
- issue: Sentido de “na tua glória”
  choice: Manter “na tua glória” sem explicação no texto
  alternative: “quando entrares no teu reino glorioso”
  rationale: O grego diz literalmente “na tua glória”; uma paráfrase ligada explicitamente ao reino resolveria uma relação que o texto deixa aberta.
translation_notes:
  register: Português moderno, claro e digno, com colocação pronominal natural e tratamento por “tu”, coerente com o discurso direto bíblico. A ordem foi levemente ajustada para dar fluidez ao português sem perder nenhuma informação do grego.
