source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν αὐτοῖς· Πρὸς τὴν σκληροκαρδίαν ὑμῶν ἔγραψεν ὑμῖν τὴν ἐντολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/005.yaml
  text: But Jesus said to them[c][b][a], “Because of your hardness of heart he wrote this commandment for you.”
translation:
  language: pt
  text: 'Mas Jesus lhes disse: “Foi por causa da dureza do coração de vocês que ele[a] escreveu esse mandamento[b] para vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, Moisés, mencionado no versículo anterior.
    reason: cross_reference
  - marker: b
    text: Ou “essa ordem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste moderado entre o apelo dos interlocutores a Moisés e a explicação de Jesus.
- source_word: Πρὸς
  choice: por causa de
  rationale: Com o acusativo, expressa aqui a razão ou circunstância motivadora da concessão legal.
- source_word: σκληροκαρδίαν
  choice: dureza do coração
  rationale: Preserva a metáfora moral e antropológica do composto grego, em linguagem bíblica ainda compreensível.
- source_word: ἔγραψεν
  choice: ele escreveu
  rationale: Mantém implícito, como no grego, o sujeito retomado do versículo anterior.
- source_word: ἐντολὴν ταύτην
  choice: esse mandamento
  rationale: Expressa a ordem normativa específica que já estava em discussão; “esse” retoma naturalmente, em português, o conteúdo mencionado pelos interlocutores.
theological_decisions:
- issue: Identificação do sujeito de ἔγραψεν
  choice: Manter “ele” no texto e esclarecer em nota que se refere a Moisés.
  alternative: Explicitar “Moisés” no texto principal.
  rationale: O sujeito grego não é repetido neste versículo, mas é recuperado claramente do contexto imediato; a nota evita ambiguidade ao leitor isolado sem acrescentar ênfase ao texto.
- issue: Força de σκληροκαρδία
  choice: “dureza do coração”
  alternative: “obstinação” ou “coração endurecido”
  rationale: A opção conserva a imagem do original e sua tensão moral, sem reduzi-la a uma explicação psicológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A construção anteposta “Foi por causa...” dá naturalidade e preserva a relação causal de Πρὸς. Todos os marcadores de nota aparecem no texto principal.
