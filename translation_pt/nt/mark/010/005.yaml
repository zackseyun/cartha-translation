  source_fidelity: 'A tradução preserva adequadamente a progressão do grego: a resposta contrastiva de Jesus, a relação causal de πρὸς, a metáfora de σκληροκαρδία, o sujeito singular retomado do contexto e o demonstrativo referente ao mandamento em discussão. “Para vocês” representa corretamente o segundo ὑμῖν.'
