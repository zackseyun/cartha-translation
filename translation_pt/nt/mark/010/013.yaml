  text: Καὶ προσέφερον αὐτῷ παιδία ἵνα ⸂αὐτῶν ἅψηται⸃· οἱ δὲ μαθηταὶ ⸂ἐπετίμησαν αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/013.yaml
  text: And they were bringing children to him so that he might touch them[a], but the disciples rebuked them.
translation:
  language: pt
  text: E traziam crianças a Jesus para que ele tocasse nelas[a], mas os discípulos os repreenderam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “criancinhas”. O termo grego παιδία pode se referir a crianças de modo amplo, incluindo crianças pequenas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέφερον
  choice: traziam
  rationale: O imperfeito indica uma ação contínua ou repetida no passado. “Traziam” preserva esse aspecto e expressa naturalmente o sentido de levar ou apresentar alguém a outra pessoa.
- source_word: παιδία
  choice: crianças
  rationale: O termo pode designar crianças de modo amplo, inclusive crianças pequenas. “Crianças” é natural e evita tornar explícita uma ideia diminutiva que o contexto permite, mas não exige.
- source_word: ἵνα αὐτῶν ἅψηται
  choice: para que ele tocasse nelas
  rationale: A construção com ἵνα e subjuntivo expressa finalidade. “Tocasse nelas” conserva o sentido direto de ἅπτομαι sem importar dos relatos paralelos o gesto mais específico de impor as mãos.
- source_word: ἐπετίμησαν
  choice: repreendiam
  rationale: O verbo comunica repreensão firme. O imperfeito português acompanha a forma grega e apresenta a reação dos discípulos como ação em curso ou repetida.
- source_word: αὐτοῖς
  choice: os que as traziam
  rationale: O pronome provavelmente se refere às pessoas que levavam as crianças. Tornar o referente explícito em português evita que “as repreendiam” seja entendido como uma repreensão dirigida às próprias crianças.
- source_word: δὲ
  choice: mas
  rationale: A conjunção assinala o contraste entre a iniciativa de trazer as crianças e a reação dos discípulos.
theological_decisions:
- issue: Referente da repreensão dos discípulos
  choice: Os discípulos repreendiam as pessoas que traziam as crianças.
  alternative: Os discípulos repreendiam as crianças.
  rationale: O referente mais coerente de αὐτοῖς é o sujeito implícito de προσέφερον, isto é, as pessoas que traziam as crianças. A explicitação em português preserva essa leitura provável e evita ambiguidade pronominal artificial.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição aspectual de “traziam” e “repreendiam” reflete os imperfeitos gregos. “A Jesus” explicita o referente de αὐτῷ de modo natural, e “os que as traziam” esclarece o antecedente provável do pronome sem acrescentar uma interpretação denominacional.
