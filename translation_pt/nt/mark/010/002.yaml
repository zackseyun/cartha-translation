  text: ⸀Καὶ ⸀ἐπηρώτων αὐτὸν εἰ ἔξεστιν ἀνδρὶ γυναῖκα ἀπολῦσαι, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/002.yaml
  text: And they were asking him whether it is lawful for a man to divorce a wife[a], testing him.
translation:
  language: pt
  text: E lhe perguntavam se é lícito a um homem divorciar-se de sua esposa[a], pondo-o à prova.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a um marido divorciar-se de sua esposa”.'
    reason: Registra a possibilidade de entender ἀνήρ e γυνή diretamente como “marido” e “esposa”, em vez de preservar o valor genérico de “homem” na formulação principal.
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Mantém a ligação simples com a narrativa anterior, sem acrescentar uma nuance temporal.
- source_word: ἐπηρώτων
  choice: lhe perguntavam
  rationale: O imperfeito sugere ação em andamento ou reiterada; “perguntavam” reproduz essa perspectiva de modo natural.
- source_word: ἔξεστιν
  choice: é lícito
  rationale: No contexto de uma controvérsia sobre divórcio, expressa permissibilidade jurídica ou religiosa, não mera possibilidade.
- source_word: ἀνδρὶ
  choice: a um homem
  rationale: Preserva o sentido genérico de ἀνήρ, embora “marido” também seja possível no contexto conjugal.
- source_word: γυναῖκα
  choice: sua esposa
  rationale: No contexto de ἀπολῦσαι, γυνή designa a esposa. O possessivo, embora não expresso no grego, torna explícita em português a relação conjugal pressuposta.
- source_word: ἀπολῦσαι
  choice: divorciar-se
  rationale: Nesse contexto jurídico-conjugal, o verbo significa romper o casamento; a tradução literal “mandar embora” obscureceria o tema.
- source_word: πειράζοντες
  choice: pondo-o à prova
  rationale: Conserva a forma circunstancial do particípio e a ideia de prova hostil, sem explicitar além do texto que pretendiam armadilhá-lo.
theological_decisions:
- issue: Ambiguidade de ἀνήρ e γυνή na formulação da questão conjugal
  choice: a um homem divorciar-se de sua esposa
  alternative: a um marido divorciar-se da esposa
  rationale: A redação principal mantém o valor genérico de ἀνήρ e comunica naturalmente a relação conjugal. A nota registra a leitura relacional igualmente possível, sem decidir uma questão doutrinária sobre o divórcio.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Lícito” preserva o tom jurídico da controvérsia; “pondo-o à prova” mantém a tensão do particípio sem transformar a tradução em paráfrase.
