  text: Καὶ προσπορεύονται αὐτῷ Ἰάκωβος καὶ Ἰωάννης ⸀οἱ υἱοὶ Ζεβεδαίου λέγοντες ⸀αὐτῷ· Διδάσκαλε, θέλομεν ἵνα ὃ ἐὰν αἰτήσωμέν ⸀σε ποιήσῃς ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/035.yaml
  text: And James and John[a], the sons of Zebedee, came to him and said to him, “Teacher, we want you to do for us whatever we ask of you.”
translation:
  language: pt
  text: 'Tiago e João, os filhos de Zebedeu, aproximaram-se dele[a] e lhe disseram: “Mestre, queremos que faças por nós tudo o que te pedirmos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram até ele”. O verbo grego indica movimento em direção a Jesus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσπορεύονται
  choice: aproximaram-se dele
  rationale: O verbo expressa movimento em direção a Jesus. O pretérito é natural na narrativa em português, embora o grego empregue o presente histórico.
- source_word: οἱ υἱοὶ Ζεβεδαίου
  choice: os filhos de Zebedeu
  rationale: Mantém a identificação apositiva e a relação genitiva do texto grego.
- source_word: λέγοντες αὐτῷ
  choice: e lhe disseram
  rationale: Transforma o particípio grego em verbo finito coordenado, construção narrativa mais natural em português.
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: Equivalente corrente e preciso para o título de quem ensina, sem ampliar indevidamente o sentido para autoridade absoluta.
- source_word: θέλομεν
  choice: queremos
  rationale: Expressa de forma direta e atual a vontade declarada pelos dois discípulos.
- source_word: ἵνα
  choice: que
  rationale: Depois de “queremos”, a oração com “que” e subjuntivo reproduz naturalmente em português o conteúdo desejado.
- source_word: ὃ ἐὰν αἰτήσωμέν σε
  choice: tudo o que lhe pedirmos
  rationale: A combinação do relativo com ἐάν indica referência indefinida; “tudo o que” transmite naturalmente o sentido de “qualquer coisa que” neste pedido.
- source_word: ποιήσῃς ἡμῖν
  choice: faça por nós
  rationale: Preserva o sentido amplo de ποιέω e o beneficiário expresso por ἡμῖν, sem interpretar antecipadamente o verbo como “conceder”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “O senhor” funciona como forma respeitosa de segunda pessoa dirigida a Jesus e evita tanto o informal “você” quanto uma construção com “tu” menos corrente para muitos leitores brasileiros.
