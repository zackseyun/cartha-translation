  text: Καὶ ⸂εἰς τὴν οἰκίαν⸃ πάλιν οἱ μαθηταὶ ⸂περὶ τούτου⸃ ⸀ἐπηρώτων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/010.yaml
  text: And in the house again[b][a], the disciples were asking him about this.
translation:
  language: pt
  text: E, na casa, os discípulos lhe perguntavam novamente sobre isso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme a ligação de “novamente” (πάλιν): “E, novamente na casa, os discípulos lhe perguntavam sobre isso.”'
    reason: A posição de πάλιν no grego permite relacioná-lo à situação na casa ou ao ato de perguntar.
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Preserva o conectivo narrativo comum sem acrescentar uma nuance temporal ausente do grego.
- source_word: εἰς τὴν οἰκίαν
  choice: em casa
  rationale: Embora εἰς possa indicar movimento para dentro, com οἰκίαν neste contexto a expressão situa a cena no interior da casa; a formulação é natural e não exige identificar a casa como residência de Jesus ou dos discípulos.
- source_word: πάλιν
  choice: novamente
  rationale: A posição grega admite associação com o retorno à casa ou com o ato de perguntar. Mantê-lo perto da expressão locativa preserva a ordem e parte da ambiguidade do texto.
- source_word: οἱ μαθηταὶ
  choice: os discípulos
  rationale: Traduz diretamente o sintagma definido que identifica o grupo já conhecido no relato, sem acrescentar o possessivo 'seus'.
- source_word: περὶ τούτου
  choice: sobre isso
  rationale: Expressão corrente e direta; o demonstrativo remete ao assunto do divórcio discutido imediatamente antes.
- source_word: ἐπηρώτων
  choice: perguntavam
  rationale: O imperfeito apresenta a ação em curso ou repetida; 'perguntavam' preserva esse aspecto sem impor valor incoativo como 'começaram a perguntar'.
- source_word: αὐτόν
  choice: lhe
  rationale: Pronome oblíquo natural em português para o objeto da pergunta, tendo Jesus como referente contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. A tradução conserva o aspecto imperfeito de ἐπηρώτων e sinaliza em nota a ambiguidade de πάλιν.
