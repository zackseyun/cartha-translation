  yaml_path: translation/nt/mark/010/036.yaml
  text: And he said to them, “What do you want me to do for you?”
translation:
  language: pt
  text: 'E ele lhes disse: “O que vocês querem que eu faça por vocês?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: E ele
  rationale: A construção idiomática retoma Jesus como sujeito e dá continuidade à narrativa. “E ele” preserva a ligação sem introduzir um contraste mais forte do que o grego exige.
- source_word: εἶπεν
  choice: disse
  rationale: É o equivalente direto do verbo de fala; a própria forma interrogativa deixa claro que se trata de uma pergunta.
- source_word: αὐτοῖς
  choice: lhes
  rationale: Representa naturalmente o dativo plural sem acrescentar “aos dois”, expressão que o contexto permite, mas que não aparece explicitamente no grego.
- source_word: Τί
  choice: O que
  rationale: Introduz de maneira direta e natural a pergunta sobre a ação desejada.
- source_word: θέλετε
  choice: vocês querem
  rationale: Expressa desejo em português moderno e mantém o plural da segunda pessoa.
- source_word: ποιήσω
  choice: que eu faça
  rationale: O aoristo do subjuntivo após θέλετε indica a ação desejada. A oração “que eu faça” é a construção idiomática correspondente em português.
- source_word: ὑμῖν
  choice: por vocês
  rationale: 'O dativo tem sentido benefactivo: a ação seria realizada em favor deles.'
theological_decisions: []
