  text: τὰς ἐντολὰς οἶδας· Μὴ ⸂φονεύσῃς, Μὴ μοιχεύσῃς⸃, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Μὴ ἀποστερήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/019.yaml
  text: 'You know the commandments: Do not murder[a], do not commit adultery, do not steal, do not bear false witness, do not defraud[b], honor your father and mother.'
translation:
  language: pt
  text: 'Você conhece os mandamentos: Não assassine[a], não cometa adultério, não roube, não dê falso testemunho, não defraude[b], honre seu pai e sua mãe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não mate”. O verbo grego designa mais especificamente matar de modo ilícito, isto é, cometer homicídio.'
    reason: lexical_alternative
  - marker: b
    text: “Não defraude” também pode ser traduzido por “não prive” ou “não despoje”. O termo indica reter ou tomar aquilo que pertence a outra pessoa por direito, muitas vezes mediante exploração.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: os mandamentos
  rationale: Preserva a alusão clara ao Decálogo e emprega a designação consagrada e natural em português.
- source_word: οἶδας
  choice: você conhece
  rationale: Embora formalmente perfeito, οἶδα tem sentido presente no grego koiné; esta formulação é direta e amplamente compreensível.
- source_word: Μὴ φονεύσῃς
  choice: Não mate
  rationale: No contexto do mandamento, φονεύω se refere à morte ilícita. A formulação tradicional e reconhecível foi mantida no texto, com nota esclarecendo a precisão lexical.
- source_word: Μὴ μοιχεύσῃς
  choice: não cometa adultério
  rationale: Equivalente idiomático e preciso para μοιχεύω em contexto moral e jurídico.
- source_word: Μὴ κλέψῃς
  choice: não roube
  rationale: Tradução direta, natural e precisa de κλέπτω nesta lista de mandamentos.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: não dê falso testemunho
  rationale: Mantém a dimensão jurídica e testemunhal do verbo, além de ecoar a linguagem conhecida do Decálogo.
- source_word: Μὴ ἀποστερήσῃς
  choice: não defraude
  rationale: Expressa privar alguém do que lhe pertence por direito, muitas vezes por fraude ou exploração, sem reduzir o termo ao simples furto.
- source_word: Τίμα
  choice: honre
  rationale: Comunica o sentido forte e pactual de τιμάω neste mandamento, mais amplo que mero respeito.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: seu pai e sua mãe
  rationale: Português natural que preserva os dois referentes e a força direta do mandamento.
theological_decisions:
- issue: Formulação das alusões ao Decálogo
  choice: Usar linguagem reconhecível como a dos mandamentos, com esclarecimentos lexicais em notas
  alternative: Empregar formulações menos tradicionais, como “não assassine” e “não prive ninguém do que lhe pertence”
  rationale: A redação mantém a identificação imediata com o Decálogo, mas as notas evitam que a linguagem tradicional seja entendida de modo mais amplo ou mais estreito que o grego.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sequência breve e imperativa conserva o ritmo de uma lista de mandamentos; a pontuação e a repetição de “não” seguem a estrutura enfática do grego.
