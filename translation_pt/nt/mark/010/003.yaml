source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Τί ὑμῖν ἐνετείλατο Μωϋσῆς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/003.yaml
  text: But he answered them, “What did Moses command you?”
translation:
  language: pt
  text: 'Mas ele lhes respondeu: “O que Moisés ordenou a vocês?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Conjunção de contraste leve que marca a mudança na conversa e a resposta de Jesus à pergunta de teste anterior.
- source_word: ἀποκριθεὶς εἶπεν
  choice: respondeu
  rationale: A expressão grega, literalmente próxima de 'tendo respondido, disse', funciona como uma única ideia verbal e é expressa com naturalidade em português por 'respondeu'.
- source_word: αὐτοῖς
  choice: lhes
  rationale: O pronome indica os destinatários da resposta; 'lhes respondeu' é claro, idiomático e preserva o valor de objeto indireto.
- source_word: Τί
  choice: O que
  rationale: Introduz uma pergunta direta sobre o conteúdo da ordem dada por Moisés.
- source_word: ὑμῖν
  choice: a vocês
  rationale: Explicita em português moderno e amplamente compreensível os destinatários da ordem, evitando a possível ambiguidade de 'lhes' dentro da pergunta.
- source_word: ἐνετείλατο
  choice: ordenou
  rationale: Preserva o sentido de uma instrução dotada de autoridade, adequado ao contexto da legislação mosaica.
- source_word: Μωϋσῆς
  choice: Moisés
  rationale: Forma tradicional e plenamente natural do nome próprio em português.
theological_decisions:
- issue: Referência à autoridade mosaica na resposta de Jesus
  choice: 'Manter Moisés como o mediador humano explicitamente nomeado: ''O que Moisés ordenou a vocês?'''
  alternative: Expandir para 'O que a Lei de Moisés ordena a vocês?' ou 'O que Deus ordenou a vocês por meio de Moisés?'
  rationale: O grego nomeia Moisés sem substituir o nome por 'a Lei' nem explicitar Deus como agente último. A tradução preserva essa formulação e não acrescenta uma explicação teológica ausente do versículo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A construção 'a vocês' evita regionalizar excessivamente com 'vos' e torna explícito o destinatário da ordem. Não há necessidade de notas de rodapé neste versículo.
