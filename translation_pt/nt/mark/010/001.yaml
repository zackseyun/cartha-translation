  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐκεῖθεν ἀναστὰς ἔρχεται εἰς τὰ ὅρια τῆς Ἰουδαίας ⸀καὶ πέραν τοῦ Ἰορδάνου, καὶ συμπορεύονται πάλιν ὄχλοι πρὸς αὐτόν, καὶ ὡς εἰώθει πάλιν ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/001.yaml
  text: And from there[a], rising, he comes into the region of Judea and beyond the Jordan, and crowds gather to him again, and as was his custom[b], he again taught them.
translation:
  language: pt
  text: Levantando-se, foi dali para a região da Judeia e para além do Jordão.[a][b] Novamente, multidões se reuniram em torno dele e, como de costume, ele voltou a ensiná-las.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o outro lado do Jordão”. A expressão grega pode designar a área situada na margem oposta do rio.'
    reason: lexical_alternative
  - marker: b
    text: A construção também pode ser entendida como “para a região da Judeia do outro lado do Jordão”. O grego não torna inteiramente explícita a relação entre as duas expressões geográficas.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐκεῖθεν ἀναστὰς
  choice: Ele se levantou, partiu dali
  rationale: Reproduz a sequência do particípio aoristo e do ponto de partida em português natural. “Levantou-se” indica pôr-se em movimento, sem qualquer conotação de ressurreição; “partiu dali” explicita o valor contextual da expressão.
- source_word: ἔρχεται
  choice: foi
  rationale: O presente histórico de Marcos é vertido pelo pretérito, forma mais natural na narrativa portuguesa. A vivacidade do original é preservada pela construção direta, sem produzir uma mudança temporal artificial.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: a região da Judeia
  rationale: ὅρια pode designar limites, território ou região. Aqui, “região” comunica naturalmente o destino geográfico sem sugerir apenas uma linha de fronteira.
- source_word: καὶ πέραν τοῦ Ἰορδάνου
  choice: e para além do Jordão
  rationale: Mantém a sequência compacta do grego e deixa aberta a relação sintática e geográfica entre a Judeia e o território do outro lado do rio.
- source_word: συμπορεύονται πάλιν ὄχλοι πρὸς αὐτόν
  choice: Novamente, multidões se reuniram junto dele
  rationale: Com ὄχλοι e πρὸς αὐτόν, o verbo comunica a convergência das multidões em direção a Jesus. “Reuniram-se junto dele” é claro e idiomático, e “novamente” preserva a primeira ocorrência de πάλιν.
- source_word: ὡς εἰώθει πάλιν ἐδίδασκεν αὐτούς
  choice: como de costume, ele voltou a ensiná-las
  rationale: “Como de costume” expressa a ação habitual de εἰώθει. “Voltou a” preserva a segunda ocorrência de πάλιν, enquanto o verbo ensinar mantém o aspecto recorrente indicado pelo imperfeito.
theological_decisions:
- issue: Presente histórico da narrativa
  choice: 'Uso do pretérito: “foi”'
  alternative: 'Preservar literalmente o presente: “vai” ou “vem”'
  rationale: Em português narrativo moderno, o pretérito evita uma oscilação temporal pouco natural. A escolha não altera o conteúdo e conserva a progressão narrativa.
- issue: Relação sintática de καὶ πέραν τοῦ Ἰορδάνου
  choice: “para a região da Judeia e para além do Jordão”
  alternative: “para a região da Judeia, do outro lado do Jordão” ou “para a região da Judeia, passando pelo outro lado do Jordão”
  rationale: A formulação grega é geograficamente e sintaticamente compacta. O texto principal acompanha sua ordem sem decidir se se trata de dois âmbitos, de uma localização combinada ou de uma indicação de percurso; a nota registra a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A repetição de πάλιν foi preservada por “novamente” e “voltou a”, evitando uma repetição mecânica. As notas ficam junto à expressão geográfica a que efetivamente se referem.
