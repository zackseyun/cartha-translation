revisions:
- from: Ele se levantou, partiu dali e foi para a região da Judeia e para além do Jordão.[a][b] Novamente, multidões se reuniram junto dele e, como de costume, ele voltou a ensiná-las.
  to: Levantando-se, foi dali para a região da Judeia e para além do Jordão.[a][b] Novamente, multidões se reuniram em torno dele e, como de costume, ele voltou a ensiná-las.
  rationale: A revisão remove a ação adicional introduzida por «partiu», preservando o particípio de ἀναστὰς com «Levantando-se» e o verbo narrativo de deslocamento com «foi». Também torna mais idiomática a reunião das multidões e restringe a nota à ambiguidade sintática efetivamente sustentada pelo grego.
