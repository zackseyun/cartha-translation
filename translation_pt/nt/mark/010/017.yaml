id: MRK.10.17
reference: Mark 10:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ εἰς ὁδὸν προσδραμὼν εἷς καὶ γονυπετήσας αὐτὸν ἐπηρώτα αὐτόν· Διδάσκαλε ἀγαθέ, τί ποιήσω ἵνα ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/017.yaml
  text: And as he was going out onto the road[a], one man ran up and knelt before him and asked him, “Good Teacher, what must I do so that I may inherit eternal life?”
translation:
  language: pt
  text: 'Quando Jesus estava saindo para a estrada[a], um homem correu até ele, ajoelhou-se diante dele e lhe perguntou: “Bom Mestre, o que devo fazer para herdar a vida eterna?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando estava partindo para a viagem”. A expressão grega pode indicar tanto sair para a estrada quanto iniciar uma viagem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ εἰς ὁδόν
  choice: Quando Jesus estava saindo para a estrada
  rationale: O genitivo absoluto apresenta uma ação de fundo simultânea à ação principal. A expressão pode descrever tanto a saída para a estrada quanto o início de uma viagem; o texto principal preserva a cena concreta, e a nota registra a alternativa idiomática.
- source_word: προσδραμὼν
  choice: correu até ele
  rationale: O particípio aoristo retrata de modo vívido e conciso a aproximação urgente do homem.
- source_word: εἷς
  choice: um homem
  rationale: O numeral substantivado introduz um indivíduo, e a forma masculina, confirmada pelo contexto narrativo, favorece 'um homem' em português natural.
- source_word: γονυπετήσας αὐτόν
  choice: ajoelhou-se diante dele
  rationale: A expressão indica que o homem se pôs de joelhos perante Jesus, numa postura de respeito ou súplica, sem exigir a intensidade adicional de 'caiu de joelhos'.
- source_word: ἐπηρώτα αὐτόν
  choice: lhe perguntou
  rationale: Embora o imperfeito possa realçar a ação em curso, no fluxo narrativo português o pretérito perfeito comunica naturalmente o ato de perguntar.
- source_word: Διδάσκαλε ἀγαθέ
  choice: Bom Mestre
  rationale: Em português, 'Mestre' é o equivalente tradicional e natural de διδάσκαλος no contexto de ensino, sem introduzir um título mais forte; 'Bom' permanece em destaque por sua importância na resposta seguinte.
- source_word: τί ποιήσω
  choice: o que devo fazer
  rationale: A pergunta deliberativa busca saber qual ação é requerida. 'Devo fazer' expressa essa força de maneira corrente, sem tornar a obrigação mais absoluta do que o contexto permite.
- source_word: ἵνα
  choice: para
  rationale: A preposição com infinitivo expressa de modo idiomático em português a finalidade introduzida por ἵνα.
- source_word: ζωὴν αἰώνιον
  choice: a vida eterna
  rationale: É a formulação portuguesa clara e estabelecida, preservando a duração e a ressonância teológica da expressão grega.
- source_word: κληρονομήσω
  choice: herdar
  rationale: Mantém a imagem específica de receber uma herança, em vez de reduzi-la ao sentido mais genérico de obter ou receber.
theological_decisions:
- issue: Forma de tratamento dirigida a Jesus
  choice: Bom Mestre
  alternative: Bom Professor
  rationale: διδάσκαλος designa aquele que ensina. 'Mestre' é natural neste contexto evangélico e não importa o título κύριος; conservar 'Bom' é importante para a tensão com a resposta de Jesus no versículo seguinte.
- issue: Representação do gênero de εἷς
  choice: um homem
  alternative: alguém
  rationale: A forma masculina substantivada e o contexto sustentam a referência a um homem; a tradução evita apagar essa informação gramatical e narrativa.
- issue: Relação entre ação e herança
  choice: o que devo fazer para herdar
  alternative: o que devo fazer para que eu herde
  rationale: A formulação preserva, sem harmonização teológica, a própria pergunta do homem, que relaciona uma ação sua ao ato de herdar a vida eterna.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das ações permanece vívida e natural; repetições pronominais desnecessárias foram evitadas sem perda de referentes.
