  text: Καὶ ἀκούσαντες οἱ δέκα ἤρξαντο ἀγανακτεῖν περὶ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/041.yaml
  text: And when the ten heard it[a], they began to be indignant with James and John.
translation:
  language: pt
  text: E, quando os dez ouviram isso, começaram a ficar indignados com Tiago e João.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa de Tiago e João” ou “a respeito de Tiago e João”. A preposição grega pode indicar o alvo ou a ocasião da indignação.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Conjunção narrativa simples, preservada sem acrescentar uma nuance temporal ausente do grego.
- source_word: ἀκούσαντες
  choice: quando ... ouviram isso
  rationale: O particípio aoristo indica ação anterior à do verbo principal; a oração temporal é natural em português. “Isso” explicita o objeto implícito recuperável do contexto.
- source_word: οἱ δέκα
  choice: os dez
  rationale: Mantém a formulação literal do grego, sem explicitar “os outros” ou “discípulos”, embora isso esteja implícito no contexto.
- source_word: ἤρξαντο
  choice: começaram
  rationale: Preserva o aspecto ingressivo da construção com infinitivo, destacando o início da reação.
- source_word: ἀγανακτεῖν
  choice: a ficar indignados
  rationale: Expressa forte desagrado ou indignação; a construção com “ficar” soa natural após “começaram” e comunica o surgimento desse estado.
- source_word: περὶ Ἰακώβου καὶ Ἰωάννου
  choice: com Tiago e João
  rationale: No contexto de reação emocional, περί pode indicar tanto o alvo como a ocasião da indignação. “Com” é idiomático e apresenta os dois como alvo provável, sem eliminar as alternativas em nota.
- source_word: Ἰακώβου
  choice: Tiago
  rationale: Forma tradicional e amplamente reconhecida em português para o nome Ἰάκωβος.
- source_word: Ἰωάννου
  choice: João
  rationale: Forma tradicional e amplamente reconhecida em português para o nome Ἰωάννης.
