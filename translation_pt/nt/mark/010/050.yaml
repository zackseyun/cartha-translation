lexical_decisions:
- source_word: δὲ
  choice: Então
  rationale: Aqui, δέ é um conectivo narrativo leve que faz a ação avançar, sem exigir um contraste forte.
- source_word: ἀποβαλών
  choice: jogou ... para o lado
  rationale: O particípio aoristo de ἀποβάλλω descreve um gesto decidido de se desfazer da capa; esta formulação preserva a vivacidade sem sugerir necessariamente abandono definitivo.
- source_word: ἱμάτιον
  choice: capa
  rationale: Ἱμάτιον designa com frequência a veste exterior; “capa” é conciso, natural e adequado ao contexto.
- source_word: ἀναπηδήσας
  choice: levantou-se de um salto
  rationale: O particípio transmite um movimento súbito e enérgico; a expressão comunica prontidão e vivacidade em português corrente.
- source_word: ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: foi até Jesus
  rationale: A construção indica movimento em direção a Jesus e chegada junto dele. Em português narrativo, “foi até Jesus” expressa naturalmente o deslocamento a partir da perspectiva da cena.
