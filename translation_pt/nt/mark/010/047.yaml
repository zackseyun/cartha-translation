id: MRK.10.47
reference: Mark 10:47
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὅτι Ἰησοῦς ὁ ⸀Ναζαρηνός ἐστιν ἤρξατο κράζειν καὶ λέγειν· ⸀Υἱὲ Δαυὶδ Ἰησοῦ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/047.yaml
  text: And when he heard that it was Jesus the Nazarene[a], he began to cry out and say, “Jesus, Son of David, have mercy on me!”
translation:
  language: pt
  text: 'E, ao ouvir que era Jesus, o Nazareno[a], começou a gritar, dizendo: “Jesus, Filho de Davi, tem misericórdia de mim!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Jesus de Nazaré”. O grego diz literalmente “Jesus, o Nazareno”, preservando um epíteto em vez de empregar a expressão geográfica mais explícita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: ao ouvir
  rationale: O particípio aoristo tem valor temporal e indica a circunstância anterior ao início do clamor; “ao ouvir” preserva a sequência com naturalidade em português.
- source_word: Ναζαρηνός
  choice: o Nazareno
  rationale: Mantém a forma adjetiva e epitética do grego, em vez de convertê-la diretamente na expressão geográfica “de Nazaré”.
- source_word: ἤρξατο κράζειν καὶ λέγειν
  choice: começou a gritar, dizendo
  rationale: Preserva o aspecto incoativo de ἤρξατο e representa os dois verbos de modo idiomático; o gerúndio explicita que as palavras citadas constituem o grito.
- source_word: κράζειν
  choice: gritar
  rationale: Comunica uma manifestação vocal forte, pública e urgente, sem necessariamente sugerir ira.
- source_word: Υἱὲ Δαυὶδ
  choice: Filho de Davi
  rationale: Conserva a forma literal e a ressonância régio-messiânica do título no contexto de Marcos.
- source_word: ἐλέησόν με
  choice: tem misericórdia de mim
  rationale: Formulação clara, solene e tradicional para o imperativo aoristo, adequada à intensidade da súplica.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Emprega a forma convencional portuguesa do nome próprio tanto na identificação quanto no vocativo.
theological_decisions:
- issue: Força messiânica de “Filho de Davi”
  choice: Manter “Filho de Davi” como título dirigido a Jesus.
  alternative: “Descendente de Davi”
  rationale: A forma literal preserva tanto a referência davídica quanto sua possível força régio-messiânica, sem reduzi-la a uma simples informação genealógica.
- issue: Tradução de Ναζαρηνός
  choice: Traduzir como “o Nazareno”.
  alternative: “de Nazaré”
  rationale: O grego usa uma designação adjetiva com caráter de epíteto; a opção principal conserva essa forma, enquanto a alternativa geográfica é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem vocativa “Jesus, Filho de Davi” acompanha o grego, e “tem misericórdia de mim” conserva a gravidade bíblica da súplica.
