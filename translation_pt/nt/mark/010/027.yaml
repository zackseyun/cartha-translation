id: MRK.10.27
reference: Mark 10:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἐμβλέψας αὐτοῖς ὁ Ἰησοῦς λέγει· Παρὰ ἀνθρώποις ἀδύνατον ἀλλ’ οὐ παρὰ θεῷ, πάντα γὰρ ⸀δυνατὰ παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/027.yaml
  text: Jesus looked at them and said, “With men it is impossible, but not with God, because all things are possible with God.”
translation:
  language: pt
  text: 'Jesus olhou para eles e disse: “Para os seres humanos isso é impossível, mas não para Deus, pois para Deus todas as coisas são possíveis.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας αὐτοῖς
  choice: olhou para eles
  rationale: Expressa de modo natural o olhar direto e atento de Jesus, sem acrescentar uma intensidade não exigida pelo contexto.
- source_word: Παρὰ ἀνθρώποις
  choice: Para os seres humanos
  rationale: Reproduz o contraste entre a incapacidade humana e o poder divino com linguagem inclusiva e corrente; aqui ἄνθρωποι designa a humanidade, não apenas homens do sexo masculino.
- source_word: ἀδύνατον
  choice: impossível
  rationale: Equivalente direto que preserva a afirmação categórica do grego.
- source_word: παρὰ θεῷ / παρὰ τῷ θεῷ
  choice: para Deus
  rationale: Mantém a formulação relacional do texto — aquilo que é impossível no âmbito humano é possível no âmbito de Deus — em português natural.
- source_word: γὰρ
  choice: pois
  rationale: 'Preserva a função explicativa ou fundamentadora da conjunção: a declaração final dá a razão para ''mas não para Deus''.'
- source_word: πάντα
  choice: todas as coisas
  rationale: Conserva a abrangência formal da expressão, deixando que o contexto imediato delimite sua aplicação.
theological_decisions:
- issue: Alcance de 'todas as coisas'
  choice: Manter 'todas as coisas' sem qualificação explícita
  alternative: Explicitar 'tudo isso' ou 'tudo o que diz respeito à salvação'
  rationale: O grego usa πάντα de modo abrangente, enquanto o contexto trata da possibilidade da salvação. A tradução não deve inserir no corpo do versículo uma delimitação interpretativa ausente do texto.
- issue: Contraste entre capacidade humana e divina
  choice: Preservar 'isso é impossível, mas não para Deus'
  alternative: Parafrasear como 'os seres humanos não podem salvar-se, mas Deus pode salvá-los'
  rationale: A paráfrase explicitaria corretamente o contexto, mas resolveria a referência implícita de 'impossível'. A formulação escolhida mantém a concisão e a tensão do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Seres humanos' evita que 'homens' seja entendido como referência exclusivamente masculina. O pronome 'isso' retoma naturalmente a questão contextual da salvação sem sobrecarregar o versículo.
