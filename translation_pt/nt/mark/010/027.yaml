  naturalness: A redação é moderna, clara e natural em português de ampla compreensão. “Olhou para eles” é uma tradução idiomática e suficiente para ἐμβλέψας αὐτοῖς; o demonstrativo “isso” torna explícita em português a elipse presente no grego sem especificar além do contexto.
