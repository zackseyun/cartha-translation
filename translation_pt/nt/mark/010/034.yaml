source:
  edition: SBLGNT
  text: καὶ ἐμπαίξουσιν αὐτῷ καὶ ⸂ἐμπτύσουσιν αὐτῷ καὶ μαστιγώσουσιν αὐτὸν⸃ καὶ ⸀ἀποκτενοῦσιν, καὶ ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/034.yaml
  text: And they will mock him[a], and spit on him, and flog him, and kill him, and after three days he will rise.
translation:
  language: pt
  text: E zombarão dele, cuspirão nele, o açoitarão e o matarão; e, depois de três dias[a], ele ressuscitará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em três dias”. O grego de Marcos diz “depois de três dias”, enquanto outras passagens expressam o momento como “ao terceiro dia”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμπαίξουσιν αὐτῷ
  choice: zombarão dele
  rationale: O verbo exprime escárnio e tratamento desdenhoso. “Zombarão dele” é corrente, claro e preserva a hostilidade da ação.
- source_word: ἐμπτύσουσιν αὐτῷ
  choice: cuspirão nele
  rationale: A construção indica que o cuspe é dirigido contra ele como ato de humilhação; “cuspirão nele” é a formulação portuguesa mais direta e natural.
- source_word: μαστιγώσουσιν αὐτόν
  choice: o açoitarão
  rationale: “Açoitar” comunica uma surra punitiva e se mantém inteligível no registro bíblico moderno, sem a possível generalidade de “bater”.
- source_word: ἀποκτενοῦσιν
  choice: o matarão
  rationale: O verbo significa diretamente matar. A escolha evita acrescentar a conotação jurídica de “executar” ou a qualificação moral específica de “assassinar”.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: depois de três dias
  rationale: μετά com acusativo tem aqui o sentido normal de “depois de”. A tradução conserva a formulação própria de Marcos sem harmonizá-la silenciosamente com “ao terceiro dia” de outras passagens.
- source_word: ἀναστήσεται
  choice: ele ressuscitará
  rationale: O futuro médio tem sentido intransitivo neste contexto. “Ressuscitará” é a expressão portuguesa natural e inequívoca para levantar-se dentre os mortos, sem converter a forma em passiva nem acrescentar “novamente”.
theological_decisions:
- issue: Formulação da ressurreição
  choice: ele ressuscitará
  alternative: ele será ressuscitado; ele ressuscitará novamente
  rationale: A forma grega ἀναστήσεται favorece uma expressão intransitiva. A tradução não a transforma em passiva e não acrescenta a ideia de “novamente”, que não está explícita, preservando ao mesmo tempo o restante do testemunho neotestamentário sobre a ação do Pai.
- issue: Indicação temporal da ressurreição
  choice: depois de três dias
  alternative: ao terceiro dia; em três dias
  rationale: A redação de Marcos é mantida em vez de ser ajustada às fórmulas temporais paralelas. A nota registra a relação possível com a contagem inclusiva sem apagar a expressão grega.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência coordenada preserva o ritmo cumulativo do grego; o ponto e vírgula destaca a passagem da morte para a ressurreição sem romper a frase.
