  text: καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν· ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ μία σάρξ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/008.yaml
  text: and the two will become one flesh. So they are no longer two[a], but one flesh.
translation:
  language: pt
  text: e os dois se tornarão uma só carne. Assim, já não são dois, mas uma só carne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσονται ... εἰς
  choice: se tornarão
  rationale: Embora ἔσονται seja forma de εἰμί (“ser”), a construção com εἰς e acusativo expressa o resultado da união; “se tornarão” é natural em português e preserva esse sentido.
- source_word: οἱ δύο
  choice: os dois
  rationale: Mantém a dualidade explícita do texto e prepara o contraste com “já não são dois”.
- source_word: εἰς σάρκα μίαν
  choice: uma só carne
  rationale: A expressão bíblica consagrada comunica a união resultante de modo natural; “só” ressalta a unidade sem acrescentar uma interpretação.
- source_word: ὥστε
  choice: Assim
  rationale: Introduz de forma clara e natural a conclusão decorrente da declaração anterior.
- source_word: οὐκέτι
  choice: já não
  rationale: Expressa de maneira corrente e concisa a cessação do estado anterior.
- source_word: σάρκα / σάρξ
  choice: carne
  rationale: Preserva o sentido literal e a ligação intertextual com Gênesis, sem reduzir a expressão a “corpo” ou a outra interpretação.
- source_word: ἀλλὰ μία σάρξ
  choice: mas uma só carne
  rationale: Conserva o contraste central do argumento e a formulação bíblica da união conjugal.
theological_decisions:
- issue: Sentido de “uma só carne” na citação de Gênesis
  choice: Manter a expressão “uma só carne” sem explicação interpretativa.
  alternative: um só corpo; uma só pessoa; sexualmente unidos
  rationale: A expressão possui alcance antropológico, conjugal e pactual que o versículo não restringe. Preservá-la evita reduzir ou resolver indevidamente sua amplitude teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a repetição do original foram preservadas por serem essenciais ao contraste entre “dois” e “uma só carne”. Não se acrescentou nota, pois “se tornarão uma só carne” comunica naturalmente a construção grega ἔσονται ... εἰς σάρκα μίαν.
