base_translation:
  language: en
  yaml_path: translation/nt/mark/010/026.yaml
  text: And they were exceedingly astonished[a], saying to one another, “Then who can be saved?”
translation:
  language: pt
  text: 'Eles, porém, ficaram extremamente espantados e diziam uns aos outros[a]: “Então, quem pode ser salvo?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre si”; mais literalmente, “a si mesmos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Eles, porém
  rationale: O artigo retoma os discípulos ou ouvintes do contexto, e δέ marca a progressão com leve contraste. “Eles, porém” preserva essa relação de modo natural em português.
- source_word: περισσῶς
  choice: ainda mais
  rationale: O advérbio intensifica o espanto e, no contexto da reação anterior, pode indicar aumento de intensidade. “Ainda mais” comunica essa força sem recorrer a uma formulação excessivamente rebuscada.
- source_word: ἐξεπλήσσοντο
  choice: ficaram ... espantados
  rationale: O verbo expressa forte assombro. Esta formulação é clara e idiomática; em conjunto com “ainda mais”, preserva sua intensidade.
- source_word: λέγοντες
  choice: e diziam
  rationale: O particípio descreve a fala simultânea à reação. A coordenação verbal é mais natural em português e o imperfeito “diziam” reflete o aspecto em desenvolvimento do contexto.
- source_word: πρὸς ἑαυτούς
  choice: uns aos outros
  rationale: Embora a expressão possa ser entendida mais literalmente como “a si mesmos” ou idiomaticamente como “entre si”, o contexto de fala coletiva favorece o sentido recíproco.
- source_word: Καὶ
  choice: Então
  rationale: Aqui καί introduz a pergunta como consequência do ensino anterior. “Então” torna explícita essa ligação inferencial natural em português.
- source_word: τίς
  choice: quem
  rationale: O interrogativo pergunta que pessoa teria essa possibilidade; o valor consequencial já está expresso por “Então”.
- source_word: δύναται
  choice: pode
  rationale: “Pode” é o equivalente moderno e direto para a ideia de capacidade ou possibilidade.
- source_word: σωθῆναι
  choice: ser salvo
  rationale: No contexto da entrada no Reino de Deus, a expressão tem peso soteriológico e escatológico, que “ser salvo” preserva melhor do que termos genéricos como “ser resgatado”.
theological_decisions:
- issue: Sentido da linguagem de salvação no contexto
  choice: ser salvo
  alternative: ser resgatado; ser liberto
  rationale: A discussão circundante trata da entrada no Reino de Deus. A tradução mantém a amplitude teológica de σωθῆναι sem restringi-la a um livramento meramente temporal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a intensidade da reação, a progressão discursiva e a ambiguidade lexical de πρὸς ἑαυτούς por meio da nota.
