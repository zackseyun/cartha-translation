  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ⸀οἱ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/031.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: pt
  text: Mas muitos que são primeiros serão últimos, e os últimos, primeiros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: muitos
  rationale: O adjetivo substantivado se refere a um grupo amplo, sem indicar todos os indivíduos; “muitos” é natural e preserva a formulação aberta.
- source_word: δὲ
  choice: mas
  rationale: Marca aqui uma transição com leve contraste em relação à promessa do versículo anterior.
- source_word: ἔσονται
  choice: serão
  rationale: É o futuro simples de εἰμί; “serão” expressa diretamente o valor verbal em português atual.
- source_word: πρῶτοι
  choice: primeiros
  rationale: Designa primazia de posição ou condição. “Primeiros” mantém a antítese proverbial com “últimos”.
- source_word: ἔσχατοι
  choice: últimos
  rationale: Contrasta diretamente com πρῶτοι em posição ou condição, sem definir de modo indevido quais grupos estão em vista.
- source_word: οἱ ἔσχατοι
  choice: os últimos
  rationale: O artigo substantiva o adjetivo; “os últimos” reproduz isso com concisão e naturalidade.
- source_word: καὶ
  choice: e
  rationale: Liga as duas metades paralelas da declaração sem acrescentar uma relação mais específica.
theological_decisions:
- issue: Natureza da inversão entre primeiros e últimos
  choice: Apresentar a declaração como um princípio amplo de inversão, sem identificar especificamente os primeiros e os últimos.
  alternative: Especificar os grupos como ricos e pobres, discípulos e pessoas de fora, ou tratar a frase como regra absoluta para cada indivíduo.
  rationale: O texto formula uma inversão paradoxal, mas não define aqui as categorias de modo exaustivo. A tradução preserva essa abertura e tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A elipse verbal na segunda oração (“e os últimos, primeiros”) conserva o paralelismo conciso e proverbial do grego.
