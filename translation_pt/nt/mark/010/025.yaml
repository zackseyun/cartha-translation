  text: εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸂τῆς τρυμαλιᾶς τῆς⸃ ῥαφίδος ⸀διελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/025.yaml
  text: It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God[a][b][c].
translation:
  language: pt
  text: É mais fácil um camelo passar pelo buraco de uma agulha do que um rico entrar no Reino de Deus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “pela abertura de uma agulha”.
    reason: lexical_alternative
  - marker: b
    text: Alguns propuseram “corda” em vez de “camelo”, mas o texto grego aqui diz “camelo”.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερόν
  choice: mais fácil
  rationale: O comparativo significa “mais fácil” ou “menos difícil”; a formulação natural em português preserva a comparação hiperbólica.
- source_word: κάμηλον
  choice: um camelo
  rationale: O texto grego atestado traz κάμηλος, “camelo”. A proposta “corda” depende de outra forma lexical e não deve substituir a leitura do texto-fonte.
- source_word: διὰ τῆς τρυμαλιᾶς τῆς ῥαφίδος
  choice: pelo buraco de uma agulha
  rationale: A expressão designa literalmente a abertura de uma agulha de costura. “Buraco de uma agulha” é claro e corrente em português amplo; “fundo de uma agulha” é uma alternativa tradicional brasileira, mas menos internacional.
- source_word: διελθεῖν
  choice: passar
  rationale: O infinitivo de διέρχομαι expressa atravessar ou passar através de algo; “passar pelo” comunica naturalmente a imagem concreta.
- source_word: πλούσιον
  choice: um rico
  rationale: O adjetivo masculino singular é substantivado. “Um rico” conserva sua forma e sua força representativa sem acrescentar o substantivo “homem”.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: entrar no Reino de Deus
  rationale: A formulação é natural em português e preserva a expressão central βασιλεία τοῦ θεοῦ. A inicial maiúscula em “Reino” sinaliza o referente teológico específico sem alterar o sentido.
theological_decisions:
- issue: Imagem do camelo e da agulha
  choice: Manter literalmente a imagem hiperbólica de um camelo passando pelo buraco de uma agulha.
  alternative: Interpretá-la como referência a um suposto portão estreito chamado “Buraco da Agulha” ou substituir “camelo” por “corda”.
  rationale: O grego apresenta uma imagem extrema. A tradução deve preservar sua tensão e não introduzir explicações posteriores que não estejam apoiadas na redação do texto.
- issue: Força representativa de πλούσιον
  choice: Traduzir por “um rico”, mantendo o masculino singular substantivado.
  alternative: Traduzir por “uma pessoa rica”.
  rationale: “Um rico” reflete a forma gramatical do grego e funciona naturalmente como representante da classe em português, sem limitar a aplicação do dito apenas aos homens.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A redação mantém a concisão proverbial e a hipérbole do original. Todos os marcadores das notas aparecem no texto principal.
