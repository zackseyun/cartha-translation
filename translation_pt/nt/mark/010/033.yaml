id: MRK.10.33
reference: Mark 10:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ ⸀τοῖς γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/033.yaml
  text: that[a], ‘Look, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and the scribes[b], and they will condemn him to death and hand him over to the Gentiles.’
translation:
  language: pt
  text: 'que: “Vejam! Estamos subindo para Jerusalém, e o Filho do Homem será entregue aos chefes dos sacerdotes e aos escribas. Eles o condenarão à morte e o entregarão aos gentios.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: que dizia
  rationale: Introduz o conteúdo da fala de Jesus em continuação ao versículo anterior. Em português, a inclusão de “dizia” torna natural o vínculo sintático implícito no trecho isolado, sem atribuir valor causal a ὅτι.
- source_word: Ἰδοὺ
  choice: Vejam!
  rationale: Marcador discursivo que chama enfaticamente a atenção dos discípulos; “Vejam!” é atual, claro e mantém a força do imperativo plural.
- source_word: ἀναβαίνομεν
  choice: Estamos subindo
  rationale: Preserva o presente e a linguagem convencional de subida a Jerusalém, adequada tanto à geografia quanto ao uso bíblico.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Tradução consagrada e formalmente próxima, que mantém a autodesignação e suas ressonâncias bíblicas sem paráfrase interpretativa.
- source_word: παραδοθήσεται / παραδώσουσιν
  choice: será entregue / o entregarão
  rationale: Repete a mesma raiz verbal em português e conserva a ideia ampla de transferência para o poder de outros, sem restringi-la prematuramente a traição.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: aos chefes dos sacerdotes
  rationale: Designa os principais integrantes da autoridade sacerdotal como grupo e evita sugerir vários ocupantes simultâneos do ofício singular de sumo sacerdote.
- source_word: τοῖς γραμματεῦσιν
  choice: aos escribas
  rationale: Equivalente lexical direto, historicamente preciso e ainda compreensível em português moderno.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: Eles o condenarão à morte
  rationale: Expressa de modo idiomático o julgamento formal adverso e seu resultado fatal.
- source_word: τοῖς ἔθνεσιν
  choice: aos gentios
  rationale: No contexto da paixão, refere-se aos governantes não judeus aos quais Jesus seria entregue; a opção mantém a distinção histórica presente no texto.
theological_decisions:
- issue: Autodesignação ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  alternative: o Ser Humano
  rationale: A formulação tradicional preserva mais diretamente o grego, a autodesignação cristológica e sua possível ressonância em Daniel, sem resolver ou achatar essas dimensões.
- issue: Sentido de τοῖς ἔθνεσιν
  choice: aos gentios
  alternative: às nações
  rationale: A sequência narrativa indica a transferência das autoridades judaicas para autoridades não judaicas. “Gentios” comunica essa distinção contextual sem transformar o referente em nações políticas abstratas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vejam!” evita o arcaísmo “Eis” e concorda com os discípulos no plural. A pontuação divide a longa coordenação grega em duas frases para favorecer a leitura sem alterar a sequência dos acontecimentos.
