id: MRK.10.45
reference: Mark 10:45
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/045.yaml
  text: For even the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: pt
  text: Pois até o Filho do Homem não veio para ser servido, mas para servir e dar a sua vida como resgate em lugar de muitos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Pois até
  rationale: Preserva a função explicativa de γάρ e a ênfase de καί, ligando naturalmente a declaração ao ensino anterior.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a autodesignação consagrada de Jesus e sua ressonância intertextual, sem substituí-la por uma interpretação.
- source_word: οὐκ ἦλθεν
  choice: não veio
  rationale: Tradução direta do verbo, com os infinitivos seguintes expressando a finalidade de sua vinda.
- source_word: διακονηθῆναι ... διακονῆσαι
  choice: ser servido ... servir
  rationale: A repetição da mesma raiz em português preserva com clareza a inversão retórica entre receber serviço e prestar serviço.
- source_word: δοῦναι
  choice: dar
  rationale: Expressa o sentido básico do verbo sem acrescentar a ideia mais específica de ser entregue.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: a sua vida
  rationale: Neste contexto, ψυχή indica a vida entregue até a morte, e não apenas uma alma imaterial.
- source_word: λύτρον
  choice: resgate
  rationale: Termo natural e digno em português para o preço que obtém libertação, preservando o peso da metáfora.
- source_word: ἀντὶ πολλῶν
  choice: em lugar de muitos
  rationale: Torna explícito o valor de troca ou substituição normalmente expresso por ἀντί, de modo natural em português.
theological_decisions:
- issue: Força de ἀντί na declaração sobre o resgate
  choice: em lugar de muitos
  alternative: por muitos
  rationale: ἀντί indica mais naturalmente troca ou substituição. Como “em lugar de muitos” é claro e idiomático em português, o texto principal pode preservar essa força sem precisar reduzi-la ao mais amplo “por muitos”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o título tradicional “Filho do Homem”, o paralelismo “ser servido/servir” e a concisão solene da declaração.
