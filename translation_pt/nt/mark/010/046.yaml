  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἰεριχώ. καὶ ἐκπορευομένου αὐτοῦ ἀπὸ Ἰεριχὼ καὶ τῶν μαθητῶν αὐτοῦ καὶ ὄχλου ἱκανοῦ ⸀ὁ υἱὸς Τιμαίου Βαρτιμαῖος ⸀τυφλὸς ⸂προσαίτης ἐκάθητο παρὰ τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/046.yaml
  text: And they came to Jericho[a]. And as he was going out from Jericho, along with his disciples and a considerable crowd, Bartimaeus, the son of Timaeus, a blind beggar[c][b], was sitting beside the road.
translation:
  language: pt
  text: Eles chegaram a Jericó.[a] Quando ele saía de Jericó com os seus discípulos e uma multidão considerável,[b] Bartimeu, filho de Timeu, um mendigo cego, estava sentado à beira do caminho.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega o presente histórico, literalmente “chegam”, um recurso narrativo comum aqui expresso no passado para soar natural em português.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma grande multidão”.
    reason: lexical_alternative
  - marker: c
    text: Ou “ao lado da estrada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: chegaram
  rationale: O presente histórico grego dá vivacidade à narrativa; o pretérito perfeito é a forma mais natural de manter a sequência narrativa em português moderno.
- source_word: ἐκπορευομένου αὐτοῦ
  choice: quando ele saía
  rationale: A construção absoluta indica uma ação em andamento contemporânea à cena principal. Esta formulação conserva tanto a simultaneidade quanto o movimento para fora da cidade.
- source_word: ὄχλου ἱκανοῦ
  choice: uma multidão considerável
  rationale: ἱκανός indica aqui quantidade ou tamanho substancial. “Considerável” comunica isso sem intensificação indevida; “uma grande multidão” também é possível.
- source_word: ὁ υἱὸς Τιμαίου Βαρτιμαῖος
  choice: Bartimeu, filho de Timeu
  rationale: Mantém tanto o nome semítico em sua forma portuguesa tradicional quanto a explicação fornecida pelo próprio texto.
- source_word: τυφλὸς προσαίτης
  choice: um mendigo cego
  rationale: A expressão é direta, clara e corrente em português, preservando as duas informações do grego sem eufemismo nem linguagem excessivamente técnica.
- source_word: παρὰ τὴν ὁδόν
  choice: à beira do caminho
  rationale: Expressa naturalmente a posição ao lado da via. “Caminho” se harmoniza com o vocabulário narrativo de Marcos, embora “estrada” também seja possível.
- source_word: Ἰεριχώ
  choice: Jericó
  rationale: Forma consagrada do topônimo em português.
theological_decisions:
- issue: Identificação narrativa de Bartimeu
  choice: Manter no texto tanto “Bartimeu” quanto “filho de Timeu”.
  alternative: Manter apenas o nome ou apenas sua explicação.
  rationale: O grego apresenta os dois elementos em aposição. Preservá-los mantém integralmente o detalhe narrativo sem impor uma interpretação teológica adicional.
- issue: Referente de αὐτοῦ em “quando ele saía”
  choice: Conservar o pronome “ele”, como no grego.
  alternative: Explicitar “Jesus”.
  rationale: O contexto identifica o referente como Jesus, mas o versículo grego emprega um pronome. A tradução conserva essa forma sem criar ambiguidade relevante no fluxo narrativo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe preserva o encadeamento narrativo do grego sem reproduzir de modo artificial todos os seus repetidos conectivos. Os nomes seguem as formas tradicionais em português.
