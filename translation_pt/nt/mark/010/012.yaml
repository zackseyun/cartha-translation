  text: καὶ ἐὰν ⸂αὐτὴ ἀπολύσασα τὸν ἄνδρα αὐτῆς γαμήσῃ ἄλλον⸃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/012.yaml
  text: and if she divorces her husband and marries another man[a], she commits adultery.
translation:
  language: pt
  text: E, se ela se divorciar[a] do marido e se casar com outro homem, comete adultério.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “mandar embora o marido”. Neste contexto matrimonial, o sentido é “divorciar-se”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: e
  rationale: Conjunção natural que liga esta declaração ao caso paralelo do versículo anterior.
- source_word: ἐὰν
  choice: se
  rationale: Introduz de modo natural em português a condição expressa no grego.
- source_word: αὐτὴ
  choice: ela
  rationale: Mantém o sujeito feminino explícito e o paralelismo deliberado com o versículo anterior.
- source_word: ἀπολύσασα
  choice: se divorciar
  rationale: No contexto matrimonial, ἀπολύω designa o divórcio; esta formulação comunica claramente esse sentido em português atual.
- source_word: τὸν ἄνδρα αὐτῆς
  choice: do marido
  rationale: Neste contexto, ἀνήρ significa 'marido'. A regência idiomática de 'divorciar-se' em português pede 'do marido'.
- source_word: γαμήσῃ ἄλλον
  choice: se casar com outro homem
  rationale: Torna explícito o referente masculino de ἄλλον e preserva a especificidade de gênero do grego.
- source_word: μοιχᾶται
  choice: comete adultério
  rationale: Expressão direta, natural e digna para o presente grego, sem transformar a ação em um rótulo pessoal.
theological_decisions:
- issue: Preservação da formulação específica quanto ao gênero
  choice: ela se divorciar do marido e se casar com outro homem
  alternative: uma mulher se divorciar do marido e se casar com outra pessoa
  rationale: O grego traz sujeito feminino explícito e objeto masculino; a tradução preserva essa especificidade e o paralelo com o caso masculino do versículo anterior.
- issue: Sentido de ἀπολύω no contexto matrimonial
  choice: se divorciar
  alternative: mandar embora
  rationale: O contexto trata da dissolução do casamento. 'Divorciar-se' transmite o valor jurídico-matrimonial do verbo sem sugerir mera separação física.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega-se a construção pronominal corrente “divorciar-se do marido” e mantém-se a concisão da declaração grega.
