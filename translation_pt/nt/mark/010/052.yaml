id: MRK.10.52
reference: Mark 10:52
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂καὶ ὁ⸃ Ἰησοῦς εἶπεν αὐτῷ· Ὕπαγε, ἡ πίστις σου σέσωκέν σε. καὶ ⸀εὐθὺς ἀνέβλεψεν, καὶ ἠκολούθει ⸀αὐτῷ ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/052.yaml
  text: And Jesus said to him[a], “Go[c][b]; your faith has saved you.” And immediately he regained his sight and followed him on the road.
translation:
  language: pt
  text: 'E Jesus lhe disse: “Vá; a sua fé salvou você[a]”. Imediatamente ele recuperou a visão e o seguia pelo caminho[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “curou você” ou “fez você ficar bem”. O verbo grego pode referir-se tanto à cura quanto à salvação.
    reason: lexical_alternative
  - marker: b
    text: Ou “pela estrada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕπαγε
  choice: Vá
  rationale: Imperativo simples e natural em português, sem acrescentar a ideia possessiva de “siga o seu caminho”, ausente do grego.
- source_word: πίστις
  choice: fé
  rationale: Equivalente tradicional, claro e contextualmente adequado; aqui envolve a confiança do homem em Jesus.
- source_word: σέσωκέν
  choice: salvou
  rationale: Preserva a amplitude de σῴζω, que pode indicar tanto cura como salvação, sem reduzir a declaração à restauração física.
- source_word: εὐθύς
  choice: imediatamente
  rationale: Mantém a rapidez característica da narrativa de Marcos em linguagem natural.
- source_word: ἀνέβλεψεν
  choice: recuperou a visão
  rationale: No contexto de um homem cego, comunica com clareza a restauração da capacidade de ver.
- source_word: ἠκολούθει
  choice: começou a seguir
  rationale: O imperfeito retrata uma ação em curso; esta formulação natural marca o início do seguimento sem sugerir que foi apenas momentâneo.
- source_word: αὐτῷ
  choice: Jesus
  rationale: A repetição do nome evita a possível ambiguidade do pronome português e identifica corretamente aquele a quem o homem seguia.
- source_word: ἐν τῇ ὁδῷ
  choice: pelo caminho
  rationale: Expressão portuguesa natural que preserva tanto o cenário concreto da viagem quanto a possível ressonância de discipulado.
- source_word: καὶ ὁ Ἰησοῦς
  choice: E Jesus
  rationale: Conserva o conectivo narrativo καί e o fluxo do relato.
theological_decisions:
- issue: Sentido de σῴζω na declaração de Jesus
  choice: salvou você
  alternative: curou você; fez você ficar bem
  rationale: O verbo grego abrange cura, livramento e salvação. O contexto confirma a cura física, mas a formulação de Jesus é mais ampla; “salvou” preserva essa tensão lexical e teológica.
- issue: Ressonância de ἐν τῇ ὁδῷ
  choice: pelo caminho
  alternative: pela estrada
  rationale: “Caminho” mantém o sentido concreto, mas não elimina a possível associação marcana entre seguir Jesus e o caminho do discipulado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para a referência singular e “Jesus” no segundo período para evitar ambiguidade pronominal. A pontuação mantém a declaração direta e o ritmo ágil de Marcos.
