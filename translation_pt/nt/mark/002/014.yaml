source:
  edition: SBLGNT
  text: καὶ παράγων εἶδεν Λευὶν τὸν τοῦ Ἁλφαίου καθήμενον ἐπὶ τὸ τελώνιον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι. καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/014.yaml
  text: And as he was passing by[a], he saw Levi the son of Alphaeus sitting at the tax booth, and he says to him, “Follow me.” And he rose and followed him.
translation:
  language: pt
  text: 'Ao passar, Jesus viu Levi, filho de Alfeu, sentado no posto de cobrança de impostos[a], e lhe diz: “Siga-me.” Levi se levantou e o seguiu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “posto de cobrança de taxas” ou “posto alfandegário”. O termo grego pode indicar um local onde se cobravam impostos, pedágios ou direitos aduaneiros.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων
  choice: Ao passar
  rationale: O particípio presente estabelece uma ação em andamento contemporânea a εἶδεν. A formulação é natural em português e não acrescenta destino ou localização.
- source_word: εἶδεν
  choice: viu
  rationale: Tradução direta do aoristo de ὁράω, sem acrescentar a nuance interpretativa de “notou”.
- source_word: Λευὶν
  choice: Levi
  rationale: Transliteração portuguesa consagrada do nome pessoal.
- source_word: τὸν τοῦ Ἁλφαίου
  choice: filho de Alfeu
  rationale: A construção genitiva identifica Levi por sua filiação; “filho de” torna explícita em português a relação subentendida no grego.
- source_word: καθήμενον
  choice: sentado
  rationale: Descreve de modo direto a posição de Levi quando foi visto.
- source_word: ἐπὶ τὸ τελώνιον
  choice: no posto de cobrança de impostos
  rationale: τελώνιον designa o lugar em que se arrecadavam impostos, taxas ou direitos aduaneiros. A expressão escolhida é clara para leitores atuais sem restringir indevidamente o local a um pedágio.
- source_word: λέγει
  choice: lhe diz
  rationale: Conserva o presente histórico de Marcos e sua vivacidade narrativa, embora os verbos ao redor estejam no passado.
- source_word: Ἀκολούθει μοι
  choice: Siga-me
  rationale: Traduz diretamente o imperativo presente, preservando o chamado a seguir Jesus sem acrescentar “venha”.
- source_word: ἀναστὰς
  choice: se levantou
  rationale: Expressa de forma natural a ação anterior ao verbo principal e preserva a sequência narrativa.
- source_word: ἠκολούθησεν αὐτῷ
  choice: o seguiu
  rationale: Mantém a ligação verbal com a ordem de Jesus e evita a paráfrase “tornou-se seu seguidor”.
theological_decisions:
- issue: Presente histórico na narrativa de Marcos
  choice: 'Manter λέγει no presente: “lhe diz”'
  alternative: 'Regularizar a narração no passado: “lhe disse”'
  rationale: O presente preserva a vivacidade estilística do texto grego sem mudar o sentido nem introduzir interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O nome “Jesus” foi explicitado como sujeito para evitar ambiguidade natural em português no início isolado do versículo. O presente histórico em “lhe diz” foi preservado deliberadamente. O marcador [a] foi colocado junto à expressão que a nota explica.
