source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Τὸ σάββατον διὰ τὸν ἄνθρωπον ἐγένετο ⸀καὶ οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/027.yaml
  text: And he was saying to them[a], “The Sabbath came into being for man, and not man for the Sabbath.”
translation:
  language: pt
  text: 'E ele lhes dizia: “O sábado veio a existir para o ser humano[a], e não o ser humano para o sábado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a humanidade”. O grego emprega o singular “ser humano” de modo representativo, referindo-se aos seres humanos em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito indica uma fala em curso ou reiterada no contexto narrativo. “Dizia” preserva esse aspecto de modo natural em português.
- source_word: τὸ σάββατον
  choice: o sábado
  rationale: O singular com artigo se refere ao dia ou à instituição do sábado. A forma consagrada “o sábado” é clara e não exige o acréscimo interpretativo de “dia”.
- source_word: διὰ τὸν ἄνθρωπον
  choice: para o ser humano
  rationale: διά com acusativo expressa finalidade ou benefício. O singular ἄνθρωπος tem sentido representativo e abrange os seres humanos em geral; “o ser humano” mantém o singular e comunica esse alcance naturalmente.
- source_word: ἐγένετο
  choice: veio a existir
  rationale: A expressão preserva o sentido de γίνομαι, “vir a existir” ou “vir a ser”, sem restringi-lo à ideia de fabricação.
- source_word: οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον
  choice: e não o ser humano para o sábado
  rationale: A construção elíptica mantém o paralelismo e a antítese do grego, deixando implícito o verbo na segunda oração, como no texto-fonte.
theological_decisions:
- issue: Sentido genérico do singular ἄνθρωπος
  choice: “o ser humano” no texto principal
  alternative: “a humanidade” ou “o homem”
  rationale: A declaração apresenta um princípio geral. “O ser humano” conserva o singular representativo, inclui naturalmente homens e mulheres e evita que “o homem” seja entendido como referência exclusiva ao sexo masculino; a nota registra a possibilidade coletiva.
- issue: Relação de finalidade ou benefício expressa por διά com acusativo
  choice: “para”
  alternative: “por causa de” ou “em benefício de”
  rationale: “Para” reproduz de maneira concisa a relação de finalidade/benefício e sustenta o paralelismo retórico sem decidir de forma excessiva entre propósito e benefício.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação pronominal em “lhes dizia” é natural, e o paralelismo conciso preserva a força proverbial da declaração.
