base_translation:
  language: en
  yaml_path: translation/nt/mark/002/001.yaml
  text: And when he entered Capernaum again after some days[a], it was heard that he was at home.
translation:
  language: pt
  text: Alguns dias depois, Jesus entrou novamente em Cafarnaum, e soube-se que ele estava em casa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: em uma casa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: quando Jesus entrou
  rationale: O particípio aoristo é expresso como oração temporal em português natural. O nome “Jesus”, implícito no grego pelo contexto, é explicitado para dar clareza ao leitor.
- source_word: πάλιν
  choice: novamente
  rationale: Expressa de modo claro e corrente a ideia de retorno ou repetição.
- source_word: Καφαρναούμ
  choice: Cafarnaum
  rationale: Segue a forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: δι’ ἡμερῶν
  choice: alguns dias depois
  rationale: Comunica de maneira idiomática o intervalo indefinido indicado pela expressão grega.
- source_word: ἠκούσθη
  choice: soube-se
  rationale: Mantém a construção impessoal do relato grego e soa mais natural em português do que uma reprodução literal como “foi ouvido”.
- source_word: ἐν οἴκῳ
  choice: em casa
  rationale: É uma expressão portuguesa natural e uma leitura contextual plausível; como o grego também pode indicar simplesmente uma casa, essa alternativa é preservada em nota.
- source_word: ἐστίν
  choice: estava
  rationale: O presente grego ocorre no discurso indireto; o imperfeito português harmoniza naturalmente com o verbo de comunicação no passado sem alterar o sentido.
theological_decisions:
- issue: Se ἐν οἴκῳ indica que Jesus estava em casa ou simplesmente dentro de uma casa.
  choice: em casa
  alternative: em uma casa
  rationale: A primeira opção é idiomática e adequada ao contexto de Cafarnaum, mas a formulação grega não identifica inequivocamente a casa como residência de Jesus; por isso, a alternativa permanece em nota.
translation_notes:
  register: Português moderno, claro e digno, com construção impessoal natural. A ordem da frase preserva a relação temporal do grego sem produzir uma formulação rígida.
