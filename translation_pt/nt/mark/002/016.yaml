id: MRK.2.16
reference: Mark 2:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς ⸂τῶν Φαρισαίων⸃ ⸀ἰδόντες ⸂ὅτι ἐσθίει⸃ μετὰ τῶν ⸂ἁμαρτωλῶν καὶ τελωνῶν⸃ ἔλεγον τοῖς μαθηταῖς αὐτοῦ· ⸀Ὅτι μετὰ τῶν ⸂τελωνῶν καὶ ἁμαρτωλῶν⸃ ⸀ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/016.yaml
  text: And the scribes of the Pharisees[a], seeing that he was eating with sinners and tax collectors, were saying to his disciples, “Why does he eat with tax collectors and sinners?”
translation:
  language: pt
  text: 'E os escribas dos fariseus[a], vendo que ele comia com pecadores e cobradores de impostos, diziam aos discípulos dele: “Por que ele come com cobradores de impostos e pecadores?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os escribas que pertenciam ao grupo dos fariseus”. A expressão grega pode indicar pertencimento ou associação.'
    reason: ambiguidade_sintática
lexical_decisions:
- source_word: γραμματεῖς
  choice: escribas
  rationale: Termo tradicional e ainda compreensível nos Evangelhos para especialistas reconhecidos nos textos e na interpretação da Lei, sem ampliar o sentido para uma função específica.
- source_word: τῶν Φαρισαίων
  choice: dos fariseus
  rationale: Preserva de modo direto o genitivo de afiliação, sem decidir se todos esses escribas eram pessoalmente fariseus ou estavam associados ao grupo.
- source_word: ἰδόντες
  choice: vendo
  rationale: Reproduz naturalmente o particípio circunstancial, mantendo a relação temporal com a ação principal.
- source_word: ὅτι ἐσθίει
  choice: que ele comia
  rationale: O imperfeito retrata a ação em andamento na cena; em português, “comia” é natural e preserva esse valor narrativo.
- source_word: μετὰ
  choice: com
  rationale: Expressa associação e convivência à mesa sem explicitar no corpo do texto implicações sociais que o contexto permite inferir.
- source_word: ἁμαρτωλῶν
  choice: pecadores
  rationale: Equivalente direto que conserva a força do rótulo social e religioso empregado pelos críticos.
- source_word: τελωνῶν
  choice: cobradores de impostos
  rationale: Forma clara e corrente em português para os agentes de arrecadação estigmatizados no contexto dos Evangelhos.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito português preserva o aspecto durativo ou reiterado da reclamação, sem intensificá-lo como “ficavam dizendo”.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: aos discípulos dele
  rationale: “Discípulos” mantém a relação formal entre mestre e aprendizes; “dele” evita, no fluxo da frase, uma possível associação momentânea de “seus” com os fariseus.
- source_word: Ὅτι
  choice: Por que
  rationale: Neste contexto interrogativo, introduz idiomaticamente o motivo da objeção; “por que” comunica isso com naturalidade em português.
- source_word: ἐσθίει
  choice: ele come
  rationale: O presente na pergunta pode exprimir comportamento característico, e o presente simples português preserva essa possibilidade.
theological_decisions:
- issue: Força social e religiosa da comunhão à mesa
  choice: Manter no texto principal a formulação concreta “come/comia com pecadores e cobradores de impostos”.
  alternative: Traduzir de modo mais explícito como “partilha refeições com cobradores de impostos e pecadores”.
  rationale: A tensão está na associação pública de Jesus com grupos estigmatizados. O grego a expressa pelo verbo comum “comer” acompanhado de “com”; a tradução conserva essa formulação e deixa que a narrativa revele sua importância.
- issue: Relação dos escribas com os fariseus
  choice: “os escribas dos fariseus”
  alternative: “os escribas que eram fariseus” ou “os escribas farisaicos”
  rationale: O genitivo pode indicar pertencimento ou associação. A redação escolhida preserva essa abertura sem afirmar mais precisamente a natureza da relação.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Mantêm-se “escribas” e “discípulos” como termos bíblicos consolidados; “cobradores de impostos” é preferido a formas menos correntes como “publicanos”. O paralelismo com a ordem alternada dos grupos no original foi preservado.
