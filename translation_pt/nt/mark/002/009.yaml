source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν τῷ παραλυτικῷ· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ ἆρον ⸂τὸν κράβαττόν σου⸃ καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/009.yaml
  text: 'Which is easier: to say to the paralyzed man[a], ‘Your sins are forgiven,’ or to say, ‘Get up, pick up your mat, and walk’?”'
translation:
  language: pt
  text: 'O que é mais fácil: dizer ao homem paralisado: “Os seus pecados estão perdoados”[a], ou dizer: “Levante-se, pegue a sua esteira e ande”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os seus pecados foram perdoados”. A forma verbal grega também pode ser entendida com ênfase no resultado vigente do perdão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: O que é mais fácil
  rationale: Expressa de modo natural em português a comparação introduzida pelo neutro τί e pelo comparativo εὐκοπώτερον, sem acrescentar explicações.
- source_word: εἰπεῖν
  choice: dizer
  rationale: Introduz discurso direto nas duas alternativas e mantém o paralelismo do texto grego.
- source_word: τῷ παραλυτικῷ
  choice: ao homem paralisado
  rationale: Identifica com clareza a pessoa afetada pela paralisia, em linguagem atual e não excessivamente técnica.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Os seus pecados estão perdoados
  rationale: O presente passivo ἀφίενταί permite uma formulação que destaca o estado vigente de perdão. Esta opção é natural em português e não especifica além do texto o agente da ação.
- source_word: ἁμαρτίαι
  choice: pecados
  rationale: É o equivalente corrente e contextualmente adequado, sem impor uma metáfora de dívida ou reduzir o sentido a meras ofensas.
- source_word: Ἔγειρε
  choice: Levante-se
  rationale: Imperativo claro, atual e digno para a ordem de se erguer.
- source_word: ἆρον
  choice: pegue
  rationale: No contexto, αἴρω significa levantar e levar consigo. “Pegue” comunica naturalmente o primeiro movimento exigido, em conexão com a ordem de andar.
- source_word: τὸν κράβαττόν σου
  choice: a sua esteira
  rationale: κράβαττος designa uma cama simples e portátil. “Esteira” evita sugerir uma cama pesada ou uma maca médica.
- source_word: περιπάτει
  choice: ande
  rationale: Traduz naturalmente o imperativo presente no conjunto de ordens, sem tornar explícita uma duração que soaria artificial em português.
theological_decisions:
- issue: Formulação da declaração de perdão
  choice: Os seus pecados estão perdoados
  alternative: Os seus pecados foram perdoados; Os seus pecados são perdoados
  rationale: A opção escolhida preserva a declaração passiva e destaca o estado resultante, sem definir o momento exato da ação nem explicitar seu agente. Assim, mantém a tensão narrativa entre a autoridade de Jesus para perdoar e a comprovação visível dessa autoridade pela cura.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação conserva o paralelismo da pergunta, usa tratamento respeitoso e evita vocabulário médico excessivamente técnico. O marcador da nota foi colocado junto à declaração de perdão, à qual a variante se refere.
