  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἠγέρθη ⸂καὶ εὐθὺς⸃ ἄρας τὸν κράβαττον ἐξῆλθεν ⸀ἔμπροσθεν πάντων, ὥστε ἐξίστασθαι πάντας καὶ δοξάζειν τὸν θεὸν λέγοντας ὅτι ⸂Οὕτως οὐδέποτε⸃ εἴδομεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/012.yaml
  text: And he got up[a], and immediately picked up the mat and went out before them all, so that they were all amazed and glorified God, saying, “We have never seen anything like this.”
translation:
  language: pt
  text: 'Ele se levantou e imediatamente pegou a esteira e saiu à vista de todos. Com isso, todos ficaram maravilhados e glorificaram a Deus, dizendo: “Nunca vimos nada assim.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Nunca vimos assim”. A expressão grega indica que eles nunca tinham visto algo semelhante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγέρθη
  choice: se levantou
  rationale: No contexto imediato da cura do paralítico, o verbo descreve o homem levantando-se em resposta à ordem de Jesus. A forma portuguesa é natural e não introduz aqui, indevidamente, uma alusão explícita à ressurreição.
- source_word: εὐθύς
  choice: imediatamente
  rationale: Preserva a rapidez da ação e a conhecida urgência narrativa de Marcos em linguagem clara.
- source_word: ἄρας
  choice: pegou
  rationale: Expressa de modo natural o ato de levantar e levar a esteira; a continuação, em que o homem sai com ela, torna evidente que ele a carrega.
- source_word: κράβαττον
  choice: esteira
  rationale: Designa uma cama simples ou acolchoado usado para deitar. “Esteira” é acessível e evita sugerir uma cama de estrutura completa ou interpretar o objeto especificamente como maca.
- source_word: ἔμπροσθεν πάντων
  choice: à vista de todos
  rationale: Comunica que a saída ocorreu publicamente, na presença de todos, sem a possível impressão espacial rígida de que ele apenas passou à frente de cada pessoa.
- source_word: ὥστε ἐξίστασθαι πάντας
  choice: Com isso, todos ficaram maravilhados
  rationale: A construção indica o resultado produzido pelo acontecimento. “Ficaram maravilhados” transmite o forte espanto de ἐξίστασθαι em português corrente e digno.
- source_word: δοξάζειν τὸν θεόν
  choice: glorificaram a Deus
  rationale: Mantém a linguagem bíblica usual e o sentido de atribuir glória a Deus, sem reduzi-lo apenas a elogio.
- source_word: Οὕτως οὐδέποτε εἴδομεν
  choice: Nunca vimos nada assim
  rationale: Reproduz de forma idiomática a afirmação de que aquilo era sem precedente para os presentes, preservando a concisão enfática do grego.
theological_decisions:
- issue: Possíveis ressonâncias de ressurreição em ἠγέρθη
  choice: se levantou
  alternative: foi levantado; ressurgiu
  rationale: Embora ἐγείρω possa ser usado em contextos de ressurreição, aqui descreve diretamente o paralítico curado levantando-se e obedecendo à ordem de Jesus. A tradução mantém o sentido contextual sem apagar o campo semântico do verbo por meio de uma paráfrase excessiva.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período foi dividido para favorecer clareza oral e escrita, sem alterar a relação de resultado expressa por ὥστε. “À vista de todos” preserva o caráter público do acontecimento; “esteira” comunica uma cama simples e portátil.
