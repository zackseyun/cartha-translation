  naturalness: O português é claro e moderno. “Roupa velha”, “remendo” e “rasgo” são naturais. “Caso contrário” preserva melhor a lógica proverbial do original, e “se desprende da roupa velha” torna explícito o efeito físico sem soar técnico.
  terminology: “Remendo” é adequado para ἐπίβλημα; “tecido que ainda não encolheu” comunica bem ῥάκους ἀγνάφου. A alternativa técnica “não apisoado” deve ser explicada como tecido não submetido ao processo de apisoamento/enfeltramento, evitando sugerir apenas processamento genérico.
