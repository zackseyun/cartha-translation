base_translation:
  language: en
  yaml_path: translation/nt/mark/002/021.yaml
  text: No one sews a patch of unshrunk cloth onto an old garment[a]; otherwise[b], the patch pulls away from it—the new from the old—and a worse tear results.
translation:
  language: pt
  text: Ninguém costura um remendo de tecido que ainda não encolheu numa roupa velha[a]; caso contrário, o remendo novo se desprende da roupa velha, e o rasgo fica pior[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de tecido não apisoado”. O grego se refere a tecido que não passou pelo processo de apisoamento e que, por isso, ainda poderia encolher depois de usado como remendo.
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “o remendo tira dele, o novo do velho”. A construção grega é difícil; o sentido é que o remendo novo se desprende da roupa velha, agravando o rasgo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίβλημα
  choice: remendo
  rationale: No contexto de conserto de roupa, designa o pedaço aplicado para cobrir um rasgo; “remendo” é o equivalente português mais natural.
- source_word: ῥάκους ἀγνάφου
  choice: de tecido que ainda não encolheu
  rationale: ἄγναφος descreve tecido ainda não apisoado ou processado e, portanto, sujeito a encolher. A formulação comunica de modo claro o efeito relevante na comparação.
- source_word: ἐπιράπτει
  choice: costura ... numa
  rationale: O verbo indica prender mediante costura. “Costura ... numa roupa” é concreto e idiomático em português.
- source_word: ἱμάτιον παλαιόν
  choice: uma roupa velha
  rationale: ἱμάτιον pode designar uma peça de vestuário sem exigir aqui a especificação de capa ou manto; “roupa” é amplo e acessível.
- source_word: εἰ δὲ μή
  choice: Se fizer isso
  rationale: A expressão introduz a consequência de agir contra a prática recém-enunciada. Em português, a condição positiva explícita soa mais natural que o literal “se não”.
- source_word: αἴρει τὸ πλήρωμα ... τὸ καινὸν τοῦ παλαιοῦ
  choice: o remendo novo repuxa a roupa velha
  rationale: A sintaxe grega é compacta e difícil, literalmente próxima de “o enchimento tira dela, o novo do velho”. “Repuxa” expressa o efeito físico do tecido novo sobre o velho sem sobrecarregar o verso.
- source_word: χεῖρον σχίσμα γίνεται
  choice: o rasgo fica ainda maior
  rationale: 'Expressa naturalmente o resultado comparativo: o dano se agrava e o rasgo aumenta.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. “Roupa” evita a formalidade pouco comum de “vestimenta”; “repuxa” preserva concretamente a imagem do tecido que contrai e força a peça antiga. Os marcadores [a] e [b] aparecem no texto principal.
