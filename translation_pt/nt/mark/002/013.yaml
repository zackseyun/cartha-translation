id: MRK.2.13
reference: Mark 2:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν πάλιν παρὰ τὴν θάλασσαν· καὶ πᾶς ὁ ὄχλος ἤρχετο πρὸς αὐτόν, καὶ ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/013.yaml
  text: And he went out again beside the sea[a], and the whole crowd was coming to him[c][b], and he was teaching them.
translation:
  language: pt
  text: E ele saiu novamente para junto do mar[a]. Toda a multidão vinha até ele[b], e ele os ensinava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para a beira do mar».'
    reason: lexical_alternative
  - marker: b
    text: Os verbos «vinha» e «ensinava» traduzem formas gregas no imperfeito, que podem indicar ações em andamento no passado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: O aoristo de ἐξέρχομαι é expresso naturalmente pelo pretérito perfeito; não se acrescenta um ponto de partida ausente do grego.
- source_word: πάλιν
  choice: novamente
  rationale: Indica repetição de modo claro e corrente; «de novo» também seria possível.
- source_word: παρὰ τὴν θάλασσαν
  choice: para junto do mar
  rationale: παρά com acusativo comunica movimento para uma posição ao lado da margem. A formulação preserva tanto o movimento de ἐξῆλθεν quanto a proximidade espacial.
- source_word: πᾶς ὁ ὄχλος
  choice: toda a multidão
  rationale: É a forma portuguesa natural de representar πᾶς ὁ com um substantivo coletivo singular.
- source_word: ἤρχετο
  choice: vinha
  rationale: O pretérito imperfeito preserva a ação em curso no passado sem impor a ideia mais forte de repetição expressa por «continuava vindo».
- source_word: πρὸς αὐτόν
  choice: até ele
  rationale: Exprime de maneira idiomática o movimento em direção à pessoa, possivelmente com chegada; «em direção a ele» preservaria apenas a direção.
- source_word: ἐδίδασκεν
  choice: ensinava
  rationale: O pretérito imperfeito representa naturalmente a atividade contínua no passado indicada pelo imperfeito grego.
- source_word: αὐτούς
  choice: os
  rationale: Pronome objeto retoma semanticamente as pessoas que compunham a multidão; a forma masculina plural é natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pretérito imperfeito reproduz naturalmente o aspecto das duas formas gregas. A divisão em duas frases evita uma sequência pesada de coordenações sem apagar a progressão narrativa.
