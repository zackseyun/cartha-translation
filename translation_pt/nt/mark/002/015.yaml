source:
  edition: SBLGNT
  text: Καὶ ⸀γίνεται κατακεῖσθαι αὐτὸν ἐν τῇ οἰκίᾳ αὐτοῦ, καὶ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ, ἦσαν γὰρ πολλοὶ καὶ ⸀ἠκολούθουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/015.yaml
  text: And it happened that he was reclining at table in his house[a], and many tax collectors and sinners were reclining with Jesus and his disciples, for there were many, and they were following him.
translation:
  language: pt
  text: E aconteceu que ele estava reclinado à mesa em sua casa[a], e muitos cobradores de impostos e pecadores estavam reclinados com Jesus e seus discípulos; pois eram muitos e o seguiam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na casa de Levi”; alguns entendem “na casa de Jesus”. O grego diz apenas “em sua casa”.
    reason: alternative_reading
lexical_decisions:
- source_word: γίνεται
  choice: aconteceu
  rationale: O presente histórico de Marcos é vertido pelo passado narrativo natural em português, preservando a progressão vívida do relato.
- source_word: κατακεῖσθαι
  choice: estava reclinado à mesa
  rationale: Indica a postura habitual durante uma refeição; “à mesa” esclarece o contexto sem reduzir o verbo simplesmente a “comer”.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: em sua casa
  rationale: Mantém o possessivo grego e sua ambiguidade quanto ao dono da casa.
- source_word: τελῶναι
  choice: cobradores de impostos
  rationale: Expressão atual e clara para agentes responsáveis pela cobrança de tributos.
- source_word: ἁμαρτωλοὶ
  choice: pecadores
  rationale: Tradução direta do rótulo religioso e social empregado no texto, sem explicá-lo no corpo do versículo.
- source_word: συνανέκειντο
  choice: também estavam reclinados com
  rationale: Conserva tanto a postura à mesa quanto a ideia de associação expressa pelo verbo composto; “também” ajuda a reproduzir naturalmente a participação conjunta.
- source_word: μαθηταῖς
  choice: discípulos
  rationale: Termo consagrado, claro e adequado à relação de aprendizado e seguimento.
- source_word: ἦσαν γὰρ πολλοὶ
  choice: pois eram muitos
  rationale: Preserva o valor explicativo de γάρ e o caráter conciso da oração grega.
- source_word: ἠκολούθουν αὐτῷ
  choice: o seguiam
  rationale: O imperfeito indica ação continuada ou habitual; em português, o pretérito imperfeito preserva naturalmente esse aspecto.
theological_decisions:
- issue: Antecedente de “sua” em “sua casa” (αὐτοῦ)
  choice: Manter “em sua casa” sem identificar o proprietário no texto principal.
  alternative: “na casa de Levi” ou “na casa de Jesus”
  rationale: O pronome grego não identifica inequivocamente o antecedente. O contexto anterior favorece Levi para muitos leitores, enquanto outros entendem Jesus; a tradução preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a ambiguidade do possessivo e o cenário de refeição, evitando linguagem arcaica.
