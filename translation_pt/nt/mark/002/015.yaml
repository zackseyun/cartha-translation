- from: E aconteceu que ele estava reclinado à mesa em sua casa[a]. Muitos cobradores de impostos e pecadores também estavam reclinados com Jesus e seus discípulos, pois eram muitos e o seguiam.
  to: E aconteceu que ele estava reclinado à mesa em sua casa[a], e muitos cobradores de impostos e pecadores estavam reclinados com Jesus e seus discípulos; pois eram muitos e o seguiam.
  rationale: A revisão preserva a ambiguidade deliberada do possessivo αὐτοῦ e todas as informações do texto-fonte, ao mesmo tempo que restabelece no português a coordenação narrativa entre Jesus e os demais convivas. Remove-se «também», que não é exigido pelo grego.
