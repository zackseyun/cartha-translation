    rationale: O texto grego a coordena diretamente à cena de Jesus reclinado à mesa. Manter a coordenação torna mais claro que eles estavam à mesa juntamente com Jesus e seus discípulos.
  - severity: low
    issue: Inclusão de «também» em «também estavam reclinados».
    rationale: Embora seja compatível com o contexto, «também» introduz uma nuance aditiva desnecessária; o καί pode ser vertido simplesmente pela coordenação da frase.
  revised_text: E aconteceu que ele estava reclinado à mesa em sua casa[a], e muitos cobradores de impostos e pecadores estavam reclinados com Jesus e seus discípulos; pois eram muitos e o seguiam.
