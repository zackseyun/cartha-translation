review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente o presente histórico com passado narrativo, a refeição em posição reclinada, a ambiguidade de «em sua casa», os grupos mencionados e o aspecto imperfeito de «o seguiam». Contudo, a divisão em duas frases enfraquece a ligação coordenativa explícita do grego entre Jesus à mesa e os muitos que estavam à mesa com ele.
  naturalness: O português é moderno, claro e apropriado. A coordenação numa única frase, com ponto e vírgula, preserva melhor o encadeamento do original sem prejudicar a legibilidade. «Também» é dispensável, pois acrescenta uma ênfase que não é necessária para verter o simples καί.
  terminology: «Cobradores de impostos», «pecadores» e «discípulos» são escolhas estáveis, compreensíveis e fiéis. «Reclinado à mesa» comunica corretamente o costume de refeição antigo.
  issues:
