  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὁ Ἰησοῦς λέγει αὐτοῖς ⸀ὅτι Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλ’ οἱ κακῶς ἔχοντες· οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/017.yaml
  text: And when Jesus heard it, he says to them, “Those who are strong have no need of a physician, but those who are sick. I did not come to call the righteous, but sinners.”
translation:
  language: pt
  text: 'E, quando Jesus ouviu isso, diz a eles: “Os que têm saúde[a] não precisam de médico, mas sim os doentes. Não vim chamar os justos[b], mas os pecadores.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que são fortes” ou “os que estão bem”; o grego se refere literalmente aos que têm força ou estão bem.
    reason: lexical_alternative
  - marker: b
    text: No contexto, “os justos” pode ser entendido de modo irônico, isto é, como os considerados justos ou os que se consideram justos; o texto grego diz simplesmente “os justos”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: quando Jesus ouviu isso
  rationale: O particípio aoristo expressa naturalmente uma circunstância temporal anterior ao verbo principal. “Isso” retoma a fala do contexto, cujo objeto fica implícito no grego.
- source_word: λέγει
  choice: diz
  rationale: Preserva o presente histórico característico da narrativa vívida de Marcos.
- source_word: οἱ ἰσχύοντες
  choice: os que têm saúde
  rationale: No contraste médico, a expressão designa os fortes ou sadios. “Têm saúde” é natural em português e mantém a noção de vigor, com a alternativa mais literal registrada em nota.
- source_word: χρείαν ἔχουσιν
  choice: não precisam
  rationale: Equivalente idiomático e direto da expressão grega “não têm necessidade”.
- source_word: ἰατροῦ
  choice: médico
  rationale: Termo corrente, digno e exato em português moderno para o profissional da medicina.
- source_word: οἱ κακῶς ἔχοντες
  choice: os doentes
  rationale: A expressão idiomática grega, literalmente relativa aos que estão mal, é usada aqui em sentido de enfermidade.
- source_word: οὐκ ἦλθον καλέσαι
  choice: não vim chamar
  rationale: Reproduz de modo conciso o aoristo e o infinitivo de finalidade, sem restringir “chamar” a convidar ou convocar.
- source_word: δικαίους
  choice: os justos
  rationale: Mantém a designação moral e religiosa do texto grego sem explicitar uma possível ironia.
- source_word: ἁμαρτωλούς
  choice: os pecadores
  rationale: Tradução substantivada tradicional e semanticamente direta do termo grego.
theological_decisions:
- issue: Possível ironia em “os justos”
  choice: Manter “os justos” no texto principal
  alternative: “os que se consideram justos”
  rationale: O contexto pode sugerir ironia ou justiça presumida, mas o grego simplesmente diz “justos”. A tradução preserva essa tensão sem decidir a interpretação pelo leitor.
- issue: Objeto implícito de “ouvir”
  choice: Explicitar “isso”
  alternative: “Ao ouvir, Jesus diz a eles”
  rationale: O objeto está implícito no grego e é recuperável no contexto. Em português, “ouviu isso” torna a relação discursiva clara sem acrescentar conteúdo doutrinário.
- issue: Presente histórico de λέγει
  choice: “diz”
  alternative: “disse”
  rationale: O presente conserva a vivacidade narrativa de Marcos; o passado seria português narrativo mais convencional, mas apagaria essa característica do original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O presente histórico foi preservado. “Médico” e “doentes” soam naturais sem perder o caráter proverbial da fala.
