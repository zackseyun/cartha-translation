  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ⸂αὐτὸν ἐν τοῖς σάββασιν παραπορεύεσθαι⸃ διὰ τῶν σπορίμων, καὶ ⸂οἱ μαθηταὶ αὐτοῦ ἤρξαντο⸃ ὁδὸν ποιεῖν τίλλοντες τοὺς στάχυας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/023.yaml
  text: And it happened that on the Sabbath he was passing through the grainfields[a], and his disciples began to make their way[c][b], plucking the heads of grain.
translation:
  language: pt
  text: Aconteceu que, num sábado, Jesus passava por campos de cereal[a], e seus discípulos começaram a avançar pelo campo[b], arrancando espigas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por entre o cereal ainda em pé”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “começaram a fazer caminho”; a expressão pode referir-se a avançar pelo campo enquanto arrancavam as espigas.
    reason: lexical_alternative
  - marker: c
    text: Isto é, as partes superiores das plantas de cereal, onde ficam os grãos.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐγένετο
  choice: Aconteceu que
  rationale: Reproduz de modo natural em português moderno a fórmula narrativa que introduz o acontecimento, sem recorrer ao arcaico “sucedeu que”.
- source_word: ἐν τοῖς σάββασιν
  choice: num sábado
  rationale: Embora o grego empregue uma forma plural, ela funciona idiomaticamente aqui em referência a um dia de sábado; “num sábado” mantém o cenário e soa natural.
- source_word: αὐτὸν
  choice: Jesus
  rationale: O pronome grego retoma Jesus no contexto. Repetir o nome em português evita uma referência potencialmente vaga no início isolado do versículo.
- source_word: παραπορεύεσθαι
  choice: passava
  rationale: Expressa o deslocamento em curso de maneira simples e idiomática; a ideia de atravessar o local é completada por “por campos de cereal”.
- source_word: διὰ τῶν σπορίμων
  choice: por campos de cereal
  rationale: σπόριμα designa terras semeadas ou campos de cereais. A formulação é clara e não especifica indevidamente qual cereal era cultivado.
- source_word: ἤρξαντο
  choice: começaram
  rationale: Corresponde diretamente ao valor ingressivo do verbo e introduz a ação subsequente.
- source_word: ὁδὸν ποιεῖν
  choice: a abrir caminho
  rationale: Mantém a imagem concreta de “fazer caminho” e deixa aberta a relação entre avançar pelo campo e arrancar as espigas, sem transformar a ação em construção formal de uma estrada.
- source_word: τίλλοντες
  choice: arrancando
  rationale: Transmite a ação de puxar e retirar as espigas; é mais preciso neste contexto do que o genérico “colhendo”.
- source_word: τοὺς στάχυας
  choice: espigas
  rationale: É o termo português corrente para as partes do cereal indicadas por στάχυας e evita a expressão menos natural “cabeças de cereal”.
theological_decisions:
- issue: Terminologia do sábado
  choice: num sábado
  alternative: nos sábados
  rationale: O plural grego pode funcionar idiomaticamente com sentido singular neste contexto. A escolha é linguística e preserva o sábado como cenário da controvérsia.
- issue: Sentido de ὁδὸν ποιεῖν na controvérsia sobre o sábado
  choice: começaram a abrir caminho
  alternative: começaram a seguir caminho
  rationale: “Abrir caminho” conserva mais de perto a expressão grega, mas a nota reconhece seu possível sentido idiomático de avançar. Assim, a tradução não exagera a atividade como construção de uma estrada nem elimina a possível imagem de formar passagem entre as plantas.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente internacional. A ordem narrativa foi mantida, e as notas preservam alternativas lexicais e a ambiguidade de ὁδὸν ποιεῖν.
