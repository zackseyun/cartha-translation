  text: Σοὶ λέγω, ⸀ἔγειρε ἆρον τὸν κράβαττόν σου καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/011.yaml
  text: I say to you[a], get up, pick up your mat[b], and go to your house.
translation:
  language: pt
  text: 'Eu digo a você: levante-se, pegue a sua esteira[a] e vá para a sua casa.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “leito”. O termo grego κράβαττος indica uma esteira ou cama simples e portátil usada para dormir.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “vá para casa”. Grego: “vá para a sua casa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοὶ λέγω
  choice: Eu digo a você
  rationale: Preserva a fórmula de fala direta e a ênfase do pronome dativo colocado no início em grego, sem tornar a frase artificial em português.
- source_word: ἔγειρε
  choice: levante-se
  rationale: Imperativo claro e corrente, adequado à ordem dirigida ao paralítico; evita o tom mais literário de “erga-se”.
- source_word: ἆρον
  choice: pegue
  rationale: Expressa de modo natural a ação concreta de levantar e levar o objeto, no contexto da sequência de ordens.
- source_word: κράβαττόν
  choice: esteira
  rationale: Designa uma superfície simples e portátil usada para dormir; “esteira” evita sugerir uma cama com estrutura ou uma maca hospitalar.
- source_word: ὕπαγε
  choice: vá
  rationale: Equivalente português direto e idiomático do imperativo de movimento.
- source_word: εἰς τὸν οἶκόν σου
  choice: para a sua casa
  rationale: Mantém tanto a direção expressa por εἰς quanto o substantivo concreto οἶκος; “para casa” seria mais idiomático, mas um pouco menos formalmente próximo do grego.
theological_decisions:
- issue: Tom e força da ordem de Jesus
  choice: 'Uma ordem pessoal, direta e revestida de autoridade: “Eu digo a você: levante-se...”'
  alternative: 'Uma formulação mais tradicional: “Eu lhe digo: erga-se, tome o seu leito e vá para casa.”'
  rationale: A tradução conserva a autoridade imediata da fala e a sequência de imperativos, sem acrescentar uma explicação teológica à declaração.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Emprega “levante-se” e “pegue” em vez de alternativas mais arcaicas ou excessivamente formais. Os marcadores foram posicionados junto aos termos a que suas notas realmente se referem.
