  text: ὥστε κύριός ἐστιν ὁ υἱὸς τοῦ ἀνθρώπου καὶ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/028.yaml
  text: So the Son of Man is Lord even of the Sabbath[a].
translation:
  language: pt
  text: Portanto, o Filho do Homem é Senhor até do sábado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Portanto, o Filho do Homem também é Senhor do sábado”. A conjunção grega pode significar simplesmente “e/também”, mas aqui provavelmente tem o sentido de “até”, enfatizando a extensão de sua autoridade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Portanto
  rationale: Introduz a conclusão decorrente do argumento anterior e mantém de modo natural a relação lógica do grego.
- source_word: κύριος
  choice: Senhor
  rationale: Expressa autoridade e soberania; a forma tradicional preserva a força cristológica da declaração sobre o Filho do Homem.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém o título característico usado por Jesus nos Evangelhos, incluindo suas ressonâncias intertextuais e sua tensão teológica.
- source_word: καὶ
  choice: até
  rationale: Neste contexto, καί tem provavelmente sentido ascensivo, enfatizando que a autoridade do Filho do Homem se estende inclusive ao sábado.
- source_word: σαββάτου
  choice: do sábado
  rationale: É a forma corrente e clara em português para o singular neste contexto de observância do sábado.
theological_decisions:
- issue: Força cristológica da afirmação de autoridade sobre o sábado
  choice: Traduzir κύριος diretamente por “Senhor”, apresentando a declaração como senhorio sobre o sábado.
  alternative: “tem autoridade sobre o sábado”
  rationale: O predicativo κύριος comunica senhorio, e não apenas uma permissão limitada; a tradução preserva a força da afirmação sem acrescentar explicação doutrinária.
- issue: Referência de “Filho do Homem”
  choice: Manter “o Filho do Homem” como título de Jesus.
  alternative: “o ser humano” ou “o homem” em sentido representativo
  rationale: Em Marcos, a expressão funciona como autodesignação de Jesus e conserva possíveis ressonâncias daniélicas; não convém resolver na tradução a tensão existente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Até do sábado” preserva a ênfase ascensiva sem perder a alternativa lexical em nota.
