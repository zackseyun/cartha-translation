source:
  edition: SBLGNT
  text: Τί οὗτος οὕτως λαλεῖ; ⸀βλασφημεῖ· τίς δύναται ἀφιέναι ἁμαρτίας εἰ μὴ εἷς ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/007.yaml
  text: Why does this man speak like this? He is blaspheming! Who can forgive sins except God alone?[a][b]
translation:
  language: pt
  text: “Por que este homem fala assim? Ele está blasfemando! Quem pode perdoar pecados, a não ser somente Deus?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “O que este homem fala assim?” Nesse uso idiomático, o grego tem o sentido de “Por que este homem fala assim?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a não ser o único Deus”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: Por que
  rationale: Na construção interrogativa Τί ... λαλεῖ, pergunta-se pela razão ou pelo fundamento de ele falar desse modo; “Por que” comunica naturalmente esse valor em português.
- source_word: οὗτος
  choice: este homem
  rationale: O demonstrativo cria distanciamento ao se referir a Jesus. “Este homem” preserva esse tom sem acrescentar desprezo mais forte do que o texto exige.
- source_word: οὕτως λαλεῖ
  choice: fala assim
  rationale: Expressão corrente e direta em português, que conserva a objeção à maneira e ao conteúdo da fala de Jesus.
- source_word: βλασφημεῖ
  choice: Ele está blasfemando
  rationale: A forma progressiva apresenta a acusação como reação imediata às palavras que Jesus acaba de dizer e mantém o peso teológico de βλασφημέω.
- source_word: τίς δύναται
  choice: Quem pode
  rationale: Equivalente português natural para uma pergunta sobre capacidade ou autoridade.
- source_word: ἀφιέναι ἁμαρτίας
  choice: perdoar pecados
  rationale: Neste contexto, ἀφίημι com ἁμαρτίας tem o sentido estabelecido de conceder perdão, não o sentido literal mais amplo de deixar ou mandar embora.
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: a não ser somente Deus
  rationale: A construção expressa exceção e exclusividade. Esta formulação é clara e idiomática, embora a ordem grega também permita destacar “o único Deus”.
theological_decisions:
- issue: Se οὗτος deve receber um tom acentuadamente depreciativo
  choice: este homem
  alternative: este sujeito; este aí
  rationale: A hostilidade e o distanciamento estão presentes, mas uma expressão mais depreciativa intensificaria a censura além do que o demonstrativo, por si só, exige.
- issue: Força da acusação βλασφημεῖ
  choice: Ele está blasfemando!
  alternative: Ele blasfema!; Isso é blasfêmia!
  rationale: A tradução mantém a acusação teológica dos escribas como fala deles, sem decidir antecipadamente a tensão cristológica desenvolvida pela narrativa.
- issue: Sentido de εἷς ὁ θεός
  choice: somente Deus
  alternative: o único Deus
  rationale: A leitura principal destaca que ninguém além de Deus pode perdoar pecados. A alternativa conserva mais visivelmente a justaposição grega de εἷς e ὁ θεός e é registrada em nota para preservar a ambiguidade de ênfase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Fala assim” evita rigidez; “blasfemando” conserva o termo teológico corrente. As duas notas registram a forma mais literal da pergunta e a possível ênfase alternativa de εἷς ὁ θεός.
