  source_fidelity: A redação reproduz adequadamente a reunião de muitas pessoas, a consequência da falta de espaço inclusive na área junto à porta e a ação continuada de Jesus. «A palavra» conserva τὸν λόγον sem acrescentar «de Deus».
  naturalness: «Muitos se reuniram» e «já não havia lugar nem mesmo junto à porta» são naturais. Porém, «lhes falava a palavra» soa sintaticamente marcado e pouco idiomático no português moderno; «lhes anunciava a palavra» comunica naturalmente a proclamação pública em contexto, sem especificar o conteúdo da palavra.
  terminology: «A palavra» é uma correspondência apropriada para τὸν λόγον, e a nota registra de modo adequado «a mensagem» como alternativa lexical. «Anunciava» é contextual para λαλέω neste discurso público, mas não introduz uma especificação teológica.
