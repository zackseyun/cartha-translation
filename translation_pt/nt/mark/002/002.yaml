source:
  edition: SBLGNT
  text: ⸀καὶ συνήχθησαν πολλοὶ ὥστε μηκέτι χωρεῖν μηδὲ τὰ πρὸς τὴν θύραν, καὶ ἐλάλει αὐτοῖς τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/002.yaml
  text: And many were gathered together[a], so that there was no longer room, not even at the door, and he was speaking the word to them.
translation:
  language: pt
  text: Muitos se reuniram, de modo que já não havia lugar nem mesmo junto à porta, e ele lhes anunciava a palavra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a mensagem”. Em grego, “a palavra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πολλοὶ
  choice: Muitos se reuniram
  rationale: O aoristo passivo descreve muitas pessoas vindo a ficar reunidas. Em português, a construção pronominal é natural e conserva a ideia de ajuntamento sem sugerir necessariamente que alguém as convocou.
- source_word: ὥστε μηκέτι χωρεῖν
  choice: de modo que já não havia lugar
  rationale: Expressa com clareza a consequência introduzida por ὥστε e o esgotamento do espaço indicado por μηκέτι e χωρεῖν.
- source_word: μηδὲ τὰ πρὸς τὴν θύραν
  choice: nem mesmo junto à porta
  rationale: A expressão grega designa a área próxima da porta. “Junto à porta” é natural e evita restringir indevidamente o sentido ao vão da porta.
- source_word: ἐλάλει αὐτοῖς
  choice: ele lhes falava
  rationale: O imperfeito indica uma ação em andamento. “Falava” preserva esse aspecto e evita o sentido mais específico de “pregava”, que o verbo λαλέω por si só não exige.
- source_word: τὸν λόγον
  choice: a palavra
  rationale: Mantém a formulação grega e sua possível densidade teológica, sem acrescentar “de Deus”, expressão que não aparece explicitamente no versículo. A alternativa idiomática “a mensagem” é registrada em nota.
theological_decisions:
- issue: Sentido de τὸν λόγον no ensino de Jesus
  choice: a palavra
  alternative: a mensagem; a palavra de Deus
  rationale: “A palavra” preserva a expressão do texto e permite que o contexto determine seu conteúdo. “A mensagem” explicita legitimamente o sentido comunicativo, enquanto “a palavra de Deus” acrescentaria uma especificação teológica não expressa no versículo.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível ao público geral. A formulação “lhes falava a palavra” é deliberadamente próxima do grego para conservar λόγος, embora seja um pouco mais marcada do que “lhes comunicava a mensagem”.
