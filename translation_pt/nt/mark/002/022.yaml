reference: Mark 2:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή, ⸂ῥήξει ὁ οἶνος⸃ τοὺς ἀσκούς, καὶ ὁ οἶνος ⸂ἀπόλλυται καὶ οἱ ἀσκοί⸃. ἀλλὰ οἶνον νέον εἰς ἀσκοὺς ⸀καινούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/022.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the wine will burst the wineskins, and the wine is ruined, and the wineskins too[b]. But new wine is for fresh wineskins.
translation:
  language: pt
  text: E ninguém põe vinho novo em odres velhos. Caso contrário, o vinho romperá os odres, e tanto o vinho como os odres se perderão.[a] Mas vinho novo é para odres novos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o vinho se perderá, e também os odres”.'
    reason: A forma grega pode ser reproduzida de modo mais distributivo, destacando separadamente a perda do vinho e a dos odres.
  - marker: b
    text: “Novos” pode ter aqui o sentido de odres novos em condição, isto é, ainda frescos e flexíveis.
    reason: καινούς pode ressaltar novidade qualitativa, em contraste com odres velhos.
lexical_decisions:
- source_word: βάλλει
  choice: põe
  rationale: No contexto de colocar vinho em recipientes, “põe” é natural e preserva o sentido geral do verbo, sem especificar indevidamente o ato de derramar.
- source_word: οἶνον νέον
  choice: vinho novo
  rationale: Expressão tradicional e clara; “novo” indica vinho recém-produzido, ainda sujeito à fermentação.
- source_word: ἀσκούς
  choice: odres
  rationale: “Odres” designa com precisão os recipientes de pele usados para guardar vinho e preserva a imagem cultural do texto.
- source_word: παλαιούς
  choice: velhos
  rationale: Equivalente direto que mantém o contraste com καινούς, sem explicitar a inferência de que os odres estejam gastos.
- source_word: ῥήξει
  choice: romperá
  rationale: Expressa naturalmente a ruptura dos odres causada pela pressão do vinho em fermentação.
- source_word: ἀπόλλυται
  choice: se perderão
  rationale: No contexto, o verbo comunica a perda tanto do vinho quanto dos recipientes; a construção coordenada é concisa e natural em português.
- source_word: καινούς
  choice: novos
  rationale: “Novos” é claro e idiomático em português. A nota registra a possível nuance qualitativa de odres ainda frescos ou sem uso.
- source_word: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινούς
  choice: Mas vinho novo é para odres novos
  rationale: A frase grega é elíptica, sem verbo expresso. “É para” conserva o caráter proverbial e evita acrescentar obrigação ou ordem explícita.
theological_decisions:
- issue: Natureza da oração final elíptica
  choice: 'Traduzida como princípio geral: “vinho novo é para odres novos”.'
  alternative: “vinho novo deve ser posto em odres novos” ou “põe-se vinho novo em odres novos”.
  rationale: O grego omite o verbo. A formulação escolhida preserva a concisão proverbial sem introduzir modalidade obrigatória nem agente não expresso.
- issue: Escopo de ἀπόλλυται na consequência
  choice: Expresso como perda conjunta do vinho e dos odres.
  alternative: “o vinho se perde, e também os odres”.
  rationale: A redação comunica o mesmo resultado contextual sem determinar além do necessário se o vinho é derramado, desperdiçado ou arruinado.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Odres” é um termo cultural específico, mas corrente em traduções bíblicas; as notas esclarecem as principais nuances lexicais e sintáticas sem resolver indevidamente a elipse grega.
