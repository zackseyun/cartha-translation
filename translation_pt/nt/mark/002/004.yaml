    issue: “acima de onde ele estava” torna explícita uma relação vertical não enunciada na oração relativa grega.
    rationale: ὅπου ἦν significa simplesmente “onde ele estava”. Embora o teto torne a relação vertical evidente no contexto, “onde ele estava” preserva melhor a formulação do texto-fonte.
  - severity: low
    issue: O presente histórico de χαλῶσι foi convertido em pretérito (“baixaram”).
    rationale: O pretérito é idiomático em português, mas “baixam” pode conservar sem dificuldade a vivacidade narrativa marcada pelo presente histórico grego.
