base_translation:
  language: en
  yaml_path: translation/nt/mark/002/004.yaml
  text: And not being able to bring him to him because of the crowd[a], they removed the roof where he was, and after digging through it[c][b], they lower the mat on which the paralyzed man was lying.
translation:
  language: pt
  text: E, como não conseguiam levá-lo até Jesus por causa da multidão[a], removeram a cobertura do teto onde ele estava e, depois de abrir um buraco, baixam a esteira em que o homem paralítico estava deitado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “levá-lo até ele”; o primeiro pronome se refere ao homem paralítico, e o segundo, a Jesus.'
    reason: lexical_alternative
  - marker: b
    text: 'O grego usa aqui o presente histórico: “baixam a esteira”, dando vivacidade à narrativa.'
    reason: discourse_feature
lexical_decisions:
- source_word: μὴ δυνάμενοι
  choice: como não conseguiam
  rationale: Expressa com naturalidade a circunstância causal do particípio grego, sem transformar a relação em explicação excessiva.
- source_word: προσενέγκαι αὐτῷ
  choice: levá-lo até Jesus
  rationale: 'Distingue claramente em português os dois referentes pronominais: o homem paralítico é levado até Jesus. A repetição literal ''levá-lo até ele'' seria possível, mas menos clara isoladamente.'
- source_word: διὰ τὸν ὄχλον
  choice: por causa da multidão
  rationale: Representa diretamente o valor causal de διά com o acusativo e usa o equivalente corrente de ὄχλος.
- source_word: ἀπεστέγασαν τὴν στέγην
  choice: removeram a cobertura do teto
  rationale: Reproduz a ação de retirar ou descobrir a cobertura, evitando sugerir necessariamente a remoção de toda a estrutura do teto.
- source_word: ὅπου ἦν
  choice: acima de onde ele estava
  rationale: Torna explícita a relação espacial implícita no contexto do teto, sem identificar materiais ou arquitetura não especificados pelo texto.
- source_word: ἐξορύξαντες
  choice: depois de abrir um buraco
  rationale: Comunica o resultado da ação de escavar ou romper a cobertura em português natural, sem especificar o material do teto.
- source_word: χαλῶσι
  choice: baixaram
  rationale: O pretérito mantém a sequência narrativa idiomática em português; o presente histórico grego é assinalado em nota.
- source_word: κράβαττον
  choice: esteira
  rationale: Designa um leito simples e portátil, sem sugerir uma cama estruturada ou uma maca médica moderna.
- source_word: ὁ παραλυτικὸς
  choice: o homem paralítico
  rationale: O adjetivo substantivado grego identifica o homem por sua condição; esta forma é clara, digna e natural em português.
- source_word: ὅπου ... κατέκειτο
  choice: em que ... estava deitado
  rationale: A oração relativa é entendida naturalmente como referente à esteira sobre a qual o homem estava deitado.
