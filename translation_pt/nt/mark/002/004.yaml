review_pass:
  verdict: revise
  source_fidelity: A tradução comunica corretamente a impossibilidade causada pela multidão, a remoção da cobertura, a abertura feita no teto e a descida da esteira. Contudo, “acima de onde ele estava” explicita uma relação espacial que o grego expressa apenas como “onde ele estava”; o contexto permite a inferência, mas a tradução não precisa acrescentá-la. O presente histórico de χαλῶσι é mais bem preservado por “baixam”.
  naturalness: O português é claro, contemporâneo e adequado ao registro narrativo. “Cobertura do teto”, “abrir um buraco” e “esteira” são compreensíveis e não impõem uma reconstrução arquitetônica ou material específica.
  terminology: “Homem paralítico” é uma designação clara e digna para ὁ παραλυτικός. “Esteira” é uma opção aceitável para κράβαττος neste contexto. A identificação explícita de Jesus em “levá-lo até Jesus” esclarece corretamente os dois referentes pronominais gregos.
  issues:
