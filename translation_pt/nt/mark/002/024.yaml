base_translation:
  language: en
  yaml_path: translation/nt/mark/002/024.yaml
  text: And the Pharisees were saying to him[a], “Look, why are they doing what is not permitted on the Sabbath?”
translation:
  language: pt
  text: 'E os fariseus lhe diziam: “Veja: por que eles fazem no sábado o que não é permitido?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Veja: o que eles fazem no sábado que não é permitido?” O grego permite entender τί como “o que”, embora, neste contexto, seja mais provável o sentido de “por que”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conectivo narrativo simples, preservando a continuidade sem acrescentar uma nuance temporal.
- source_word: οἱ Φαρισαῖοι
  choice: os fariseus
  rationale: Forma convencional em português para o nome do grupo, com o artigo definido.
- source_word: ἔλεγον
  choice: diziam
  rationale: O pretérito imperfeito expressa adequadamente a ação passada em curso ou reiterada, sem forçar uma repetição explícita.
- source_word: αὐτῷ
  choice: lhe
  rationale: Pronome dativo natural em português, referindo-se a Jesus.
- source_word: Ἴδε
  choice: Veja!
  rationale: Imperativo que chama a atenção; é atual e digno, sem o tom arcaico de “Eis”.
- source_word: τί
  choice: Por que
  rationale: Embora τί possa significar literalmente “o que”, neste contexto de censura funciona provavelmente em sentido adverbial, introduzindo a razão da conduta questionada.
- source_word: ποιοῦσιν
  choice: eles fazem
  rationale: O presente do discurso direto é preservado de modo natural em português.
- source_word: τοῖς σάββασιν
  choice: no sábado
  rationale: O plural grego é uma expressão idiomática comum para o dia de sábado; o singular é a forma natural em português.
- source_word: ὃ οὐκ ἔξεστιν
  choice: o que não é permitido
  rationale: Expressa a ideia de licitude ou permissão e mantém a força jurídico-religiosa sem especificar a fonte da proibição.
theological_decisions:
- issue: Natureza da objeção dos fariseus
  choice: o que não é permitido
  alternative: o que não é lícito
  rationale: A tradução conserva a acusação em termos de permissão ou licitude, sem decidir se a norma invocada é a lei bíblica, a tradição farisaica ou outra interpretação religiosa.
- issue: Valor interrogativo de τί
  choice: Por que eles fazem...?
  alternative: O que eles fazem no sábado que não é permitido?
  rationale: O contexto favorece o sentido idiomático de “por que”, mas a nota preserva a leitura formalmente possível com “o que”.
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural no Brasil. “Veja!” mantém a função de chamar a atenção; “diziam” preserva o aspecto imperfeito; a formulação evita linguagem arcaica e não identifica além do texto a autoridade normativa pressuposta pela acusação.
