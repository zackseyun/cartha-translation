  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν νηστεύειν; ὅσον χρόνον ⸂ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν⸃ οὐ δύνανται νηστεύειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/019.yaml
  text: And Jesus said to them[a], “The wedding guests cannot fast while the bridegroom is with them, can they? As long as they have the bridegroom with them, they cannot fast.”
translation:
  language: pt
  text: 'E Jesus lhes disse: “Por acaso os convidados do casamento[a] podem jejuar enquanto o noivo está com eles? Enquanto têm o noivo com eles, não podem jejuar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os filhos do salão nupcial” ou “os filhos do aposento nupcial”, uma expressão idiomática para os que participam da celebração do casamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνανται ... νηστεύειν;
  choice: Por acaso ... podem jejuar?
  rationale: A partícula μή introduz uma pergunta retórica que espera resposta negativa. “Por acaso” comunica essa expectativa com naturalidade em português, enquanto a frase seguinte explicita a impossibilidade.
- source_word: οἱ υἱοὶ τοῦ νυμφῶνος
  choice: os convidados do casamento
  rationale: A expressão, literalmente “os filhos da sala nupcial” ou “os filhos do aposento nupcial”, é um idiomatismo para os participantes da celebração, especialmente os companheiros do noivo. A tradução idiomática evita uma formulação opaca sem restringir indevidamente o grupo aos padrinhos.
- source_word: ἐν ᾧ ... ἐστιν
  choice: enquanto ... está com eles
  rationale: A construção tem sentido temporal neste contexto. “Enquanto” expressa com clareza a duração da presença do noivo.
- source_word: ὁ νυμφίος / τὸν νυμφίον
  choice: o noivo
  rationale: “Noivo” é o termo corrente e digno em português, preservando integralmente a imagem nupcial e sua possível ressonância teológica.
- source_word: μετ’ αὐτῶν
  choice: com eles
  rationale: μετά com genitivo indica companhia; “com eles” é a correspondência direta e natural.
- source_word: ὅσον χρόνον
  choice: Enquanto
  rationale: A expressão marca a duração de uma circunstância. Neste período, “Enquanto” é natural e evita a formulação mais pesada “durante todo o tempo em que”.
- source_word: ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν
  choice: têm o noivo com eles
  rationale: Mantém o verbo explícito ἔχουσιν, “têm”, em vez de repetir apenas “o noivo está”, preservando a variação do original sem perder naturalidade.
- source_word: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: E Jesus lhes disse
  rationale: Reproduz de modo claro e corrente a introdução narrativa, inclusive a conjunção que liga este versículo ao contexto anterior.
theological_decisions:
- issue: Identificação metafórica de Jesus como o noivo
  choice: Preservar a imagem do noivo sem explicitar sua interpretação teológica no texto principal.
  alternative: Acrescentar linguagem interpretativa que identifique diretamente Jesus com um noivo messiânico ou divino.
  rationale: Jesus emprega para si a imagem do noivo, mas o versículo não desenvolve explicitamente todas as implicações dessa imagem. A tradução conserva a metáfora e deixa sua interpretação aberta ao contexto e ao leitor.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O discurso permanece digno e acessível; “Por acaso” sinaliza a força retórica da pergunta, e “noivo” conserva a metáfora bíblica sem linguagem arcaica.
