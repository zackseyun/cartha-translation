  terminology: «Filho do Homem», «autoridade» e «perdoar pecados» são escolhas precisas e mantêm os termos teologicamente relevantes sem interpretar além do texto. A nota sobre o título preserva apropriadamente sua ambiguidade e possível alusão a Daniel 7.
