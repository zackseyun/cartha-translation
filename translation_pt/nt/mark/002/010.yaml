source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας⸃— λέγει τῷ παραλυτικῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/010.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he says to the paralyzed man[b][a],
translation:
  language: pt
  text: 'Mas, para que vocês saibam que o Filho do Homem[a] tem autoridade na terra para perdoar pecados — diz ao homem paralisado[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Ser Humano”. O título grego “Filho do Homem” pode expressar tanto a condição humana quanto uma alusão a Daniel 7.
    reason: alternative_reading
  - marker: b
    text: Ou “ao paralítico”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: Mas, para que vocês saibam
  rationale: Preserva o leve contraste de δέ e a finalidade expressa por ἵνα com o subjuntivo εἰδῆτε, em português natural.
- source_word: ἐξουσίαν ἔχει
  choice: tem autoridade
  rationale: ἐξουσία indica prerrogativa ou autoridade legítima, e não apenas capacidade ou força.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a forma tradicional do título e sua possível ressonância de Daniel 7, sem eliminar sua ambiguidade idiomática.
- source_word: ἐπὶ τῆς γῆς
  choice: na terra
  rationale: Expressa naturalmente o âmbito terreno em que essa autoridade é exercida.
- source_word: ἀφιέναι ἁμαρτίας
  choice: para perdoar pecados
  rationale: No contexto, ἀφίημι significa perdoar ou remitir; esta é a formulação portuguesa mais clara e consagrada.
- source_word: λέγει τῷ παραλυτικῷ
  choice: disse ao homem paralítico
  rationale: O pretérito é a forma narrativa mais natural em português para o presente histórico grego λέγει; 'homem paralítico' comunica de modo imediato o substantivo adjetival παραλυτικῷ.
theological_decisions:
- issue: Sentido do título ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  alternative: o Ser Humano
  rationale: A tradução conserva tanto o título reconhecível quanto sua possível ligação com Daniel 7, sem decidir se a ênfase recai sobre humanidade, identidade messiânica ou autoridade apocalíptica.
- issue: Sentido de ἐξουσία no perdão dos pecados
  choice: autoridade
  alternative: poder
  rationale: O contexto ressalta a prerrogativa legítima de perdoar pecados, e não meramente a capacidade de fazê-lo.
- issue: Presente histórico λέγει
  choice: disse
  alternative: diz
  rationale: O pretérito mantém a vivacidade da interrupção e soa mais natural na narrativa portuguesa, sem alterar a referência temporal do episódio.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pontuação com reticências e travessões preserva a frase interrompida, que continua no versículo seguinte. Os marcadores aparecem junto aos termos correspondentes no texto.
