source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν ἐν ⸂ἐκείνῃ τῇ ἡμέρᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/020.yaml
  text: But days will come when the bridegroom is taken away from them[a], and then they will fast in that day.
translation:
  language: pt
  text: Mas virão dias em que o noivo lhes será tirado; então, naquele dia[a], jejuarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego está no singular: “naquele dia”, não “naqueles dias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Mas virão dias
  rationale: Mantém o contraste expresso por δέ e reproduz com naturalidade em português a expressão que anuncia um tempo futuro.
- source_word: ὅταν
  choice: em que
  rationale: No contexto futuro, introduz o momento em que ocorrerá a retirada do noivo, sem o sentido iterativo que “sempre que” poderia sugerir.
- source_word: ἀπαρθῇ ἀπ’ αὐτῶν
  choice: lhes será tirado
  rationale: Preserva a voz passiva, a separação e o tom de perda abrupta, sem identificar o agente nem explicar antecipadamente a forma da retirada.
- source_word: ὁ νυμφίος
  choice: o noivo
  rationale: É o equivalente português corrente e preciso, mantendo intacta a metáfora nupcial.
- source_word: καὶ τότε
  choice: então
  rationale: Expressa claramente a sequência temporal entre a retirada do noivo e o jejum.
- source_word: νηστεύσουσιν
  choice: jejuarão
  rationale: Traduz diretamente o futuro de νηστεύω com o termo religioso comum e amplamente compreensível.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: naquele dia
  rationale: Conserva o singular enfático do grego e soa natural em português.
theological_decisions:
- issue: Identificação metafórica de Jesus como o noivo
  choice: Manter “o noivo” sem explicitar na tradução que Jesus fala de si mesmo.
  alternative: Traduzir de forma explicativa como “quando eu lhes for tirado”.
  rationale: O contexto permite reconhecer a referência a Jesus, mas o texto emprega deliberadamente a metáfora; preservá-la mantém sua força literária e teológica.
- issue: Natureza da retirada do noivo
  choice: Usar a passiva “lhes será tirado”, sem indicar o agente nem mencionar explicitamente a morte ou a crucificação.
  alternative: Traduzir como “for morto” ou “lhes for tirado à força”.
  rationale: A formulação antecipa uma retirada dolorosa, mas não nomeia aqui o agente nem define seu modo; a tradução conserva essa abertura.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe concisa. “Noivo” é mais natural no uso contemporâneo do que uma forma marcada como “esposo”, e o ponto e vírgula ajuda a tornar clara a sequência do enunciado.
