  text: And they came[a], bringing to him a paralyzed man carried by four.
translation:
  language: pt
  text: E vieram até ele, trazendo um homem paralítico carregado por quatro[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por quatro homens”; o grego diz simplesmente “por quatro”.'
