lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém o conectivo narrativo simples e o estilo paratático característico de Marcos.
- source_word: ἔρχονται
  choice: vieram
  rationale: O presente histórico grego é vertido naturalmente pelo pretérito perfeito na narrativa em português.
- source_word: φέροντες
  choice: trazendo
  rationale: Expressa a ação concomitante ao verbo principal e combina naturalmente com «até ele»; a ação física de carregar é explicitada por αἰρόμενον.
- source_word: πρὸς αὐτὸν
  choice: até ele
  rationale: Indica movimento em direção a Jesus de modo natural em português.
- source_word: παραλυτικὸν
  choice: um homem paralítico
  rationale: O adjetivo substantivado designa uma pessoa com paralisia; «homem paralítico» é claro, corrente e evita o uso isolado do rótulo «um paralítico».
- source_word: αἰρόμενον
  choice: carregado
  rationale: Preserva o particípio passivo que modifica o homem e indica que outras pessoas o transportavam fisicamente.
- source_word: ὑπὸ τεσσάρων
  choice: por quatro
  rationale: Conserva a elipse do grego, que não explicita «homens»; a nota esclarece a alternativa contextual.
