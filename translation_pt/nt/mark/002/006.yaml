base_translation:
  language: en
  yaml_path: translation/nt/mark/002/006.yaml
  text: 'But some of the scribes were sitting there[a], reasoning in their hearts:'
translation:
  language: pt
  text: 'Mas alguns dos escribas estavam sentados ali, raciocinando em seus corações[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pensando consigo mesmos” ou “refletindo no íntimo”. O grego diz literalmente “em seus corações”, expressão bíblica que indica o pensamento interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Mas ... estavam
  rationale: δέ introduz uma mudança de foco com leve contraste, passando para a reação interior dos escribas; “mas” sinaliza isso naturalmente sem tornar a oposição forte demais.
- source_word: τινες τῶν γραμματέων
  choice: alguns dos escribas
  rationale: Preserva a construção partitiva, indicando que se trata de alguns membros do grupo, não necessariamente de todos. “Escribas” é a designação tradicional e adequada ao contexto dos Evangelhos.
- source_word: ἐκεῖ καθήμενοι
  choice: sentados ali
  rationale: Expressa de modo natural tanto a localização quanto a postura contínua descrita pelo particípio.
- source_word: διαλογιζόμενοι
  choice: raciocinando
  rationale: O verbo descreve deliberação ou reflexão interior. “Raciocinando” preserva essa nuance sem antecipar explicitamente o teor da objeção.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: em seus corações
  rationale: Mantém a imagem bíblica do coração como centro do pensamento e da reflexão interior, sem reduzi-la à distinção moderna entre mente e emoção.
theological_decisions:
- issue: Sentido antropológico de καρδίαις
  choice: em seus corações
  alternative: no íntimo; em suas mentes
  rationale: A formulação literal preserva o mundo conceitual bíblico, no qual o coração inclui o pensamento e a deliberação, sem impor uma dicotomia moderna entre razão e sentimento.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem “sentados ali” é idiomática, e “raciocinando em seus corações” conserva tanto a ação interior quanto a imagem do original.
