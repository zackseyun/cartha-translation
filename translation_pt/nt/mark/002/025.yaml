  text: And he said to them, “Have you never read what David did when he was in need and was hungry, he and those with him?”
translation:
  language: pt
  text: 'E ele lhes disse: “Vocês nunca leram o que Davi fez quando teve necessidade e sentiu fome, ele e os que estavam com ele?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρείαν ἔσχεν
  choice: teve necessidade
  rationale: Preserva a expressão distinta de fome e seu sentido amplo, sem especificar uma necessidade que o grego não explicita.
- source_word: ἐπείνασεν
  choice: sentiu fome
  rationale: Expressa de modo natural em português o estado indicado pelo aoristo, mantendo-o separado de “teve necessidade”.
- source_word: οἱ μετ’ αὐτοῦ
  choice: os que estavam com ele
  rationale: Tradução clara e direta da expressão, sem acrescentar uma caracterização não presente no texto.
