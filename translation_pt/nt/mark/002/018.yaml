  verdict: revise
  source_fidelity: A tradução transmite corretamente o jejum em curso, a pergunta e o contraste. Contudo, «Então» é mais específico do que o simples καί, e a elipse em «Então vêm dizer a Jesus» tende a retomar como sujeito os grupos mencionados na oração anterior, embora o grego não o identifique.
  naturalness: «E vêm e lhe dizem» é português moderno, natural e preserva adequadamente os presentes históricos de Marcos. «Teus discípulos» mantém um registro direto e digno.
  terminology: «Discípulos», «fariseus» e «jejuar» são termos corretos e estabelecidos. «João» e «Jesus» estão adequadamente empregados.
  issues:
  - severity: medium
    issue: «Então» e a provável identificação do sujeito implícito
    rationale: O texto grego tem καί («e») e deixa sem expressão o sujeito de ἔρχονται e λέγουσιν. «Então» acrescenta uma inferência discursiva, e a elipse após a primeira oração em português convida o leitor a entender que os discípulos de João e os fariseus são os que vêm falar. A redação revisada conserva a ligação simples e evita nomear o destinatário onde o grego usa pronome.
  - severity: low
    issue: Nota de rodapé não apresenta uma alternativa útil
    rationale: «Vêm dizer a ele» apenas substitui «a Jesus» por uma forma pronominal e não esclarece a ambiguidade relevante. A nota deve registrar que o sujeito dos verbos não é explicitado e, se oferecer alternativa, indicar a possibilidade genérica sem a impor ao texto.
  revised_text: 'Os discípulos de João e os fariseus estavam jejuando. E vêm e lhe dizem[a]: “Por que os discípulos de João e os discípulos dos fariseus jejuam, mas os teus discípulos não jejuam?”'
