source:
  edition: SBLGNT
  text: Καὶ ἦσαν οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀Φαρισαῖοι νηστεύοντες. καὶ ἔρχονται καὶ λέγουσιν αὐτῷ· Διὰ τί οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀μαθηταὶ τῶν Φαρισαίων νηστεύουσιν, οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/018.yaml
  text: John's disciples and the Pharisees were fasting. And they come and say to him[a], "Why do John's disciples and the disciples of the Pharisees fast, but your disciples do not fast?"
translation:
  language: pt
  text: 'Os discípulos de João e os fariseus estavam jejuando. E vêm e lhe dizem[a]: “Por que os discípulos de João e os discípulos dos fariseus jejuam, mas os teus discípulos não jejuam?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “algumas pessoas vêm e lhe dizem”. O grego não explicita o sujeito de “vêm” e “dizem”.'
    reason: A alternativa torna explícito, de maneira genérica, um sujeito que o texto grego deixa implícito; o texto principal preserva essa ambiguidade.
lexical_decisions:
- source_word: ἦσαν ... νηστεύοντες
  choice: estavam jejuando
  rationale: A construção perifrástica com o imperfeito de εἰμί e o particípio presente expressa uma ação em andamento no passado. “Estavam jejuando” é natural e preserva esse aspecto.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: os discípulos de João
  rationale: O genitivo indica associação; esta é a formulação mais natural e clara em português.
- source_word: οἱ Φαρισαῖοι
  choice: os fariseus
  rationale: Forma tradicional e amplamente reconhecida em português para o grupo judaico.
- source_word: ἔρχονται καὶ λέγουσιν
  choice: vêm dizer
  rationale: Os presentes históricos preservam a vivacidade narrativa característica de Marcos. A construção portuguesa é corrente e não exige repetir a conjunção entre os dois verbos.
- source_word: αὐτῷ
  choice: a Jesus
  rationale: Embora o grego diga literalmente “a ele”, explicitar o referente como “Jesus” evita uma sequência pronominal pouco clara em português sem alterar a identidade do destinatário.
- source_word: Διὰ τί
  choice: Por que
  rationale: Equivalente interrogativo direto, idiomático e preciso em português.
- source_word: οἱ μαθηταὶ τῶν Φαρισαίων
  choice: os discípulos dos fariseus
  rationale: Preserva claramente a relação expressa pelo genitivo e o paralelismo com “os discípulos de João”.
- source_word: νηστεύουσιν
  choice: jejuam
  rationale: O presente pode indicar uma prática habitual; o presente simples em português preserva naturalmente esse valor e o contraste.
- source_word: οἱ δὲ σοὶ μαθηταὶ
  choice: mas os teus discípulos
  rationale: “Mas” expressa o contraste marcado por δέ, e “teus” comunica de modo direto a força possessiva de σοί.
theological_decisions:
- issue: Identidade dos que vêm falar com Jesus
  choice: O sujeito permanece implícito em “vêm dizer”.
  alternative: Suprir “algumas pessoas vieram” ou identificar os interlocutores como um grupo específico.
  rationale: O grego não explicita o sujeito de ἔρχονται e λέγουσιν. A tradução preserva essa ambiguidade em vez de atribuir a fala a um grupo determinado.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O presente histórico foi mantido em “vêm dizer”, enquanto “estavam jejuando” preserva a ação passada em curso. O artigo antes de “fariseus” segue o uso natural em português.
