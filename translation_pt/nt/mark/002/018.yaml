- from: 'Os discípulos de João e os fariseus estavam jejuando. Então vêm dizer a Jesus[a]: “Por que os discípulos de João e os discípulos dos fariseus jejuam, mas os teus discípulos não jejuam?”'
  to: 'Os discípulos de João e os fariseus estavam jejuando. E vêm e lhe dizem[a]: “Por que os discípulos de João e os discípulos dos fariseus jejuam, mas os teus discípulos não jejuam?”'
  rationale: A revisão substitui o conectivo inferencial por «E», mantém os dois presentes históricos e troca «a Jesus» por «lhe», correspondente ao pronome grego αὐτῷ. Assim, evita-se identificar indevidamente os interlocutores, enquanto a nota explica a ambiguidade textual de modo funcional.
