id: MRK.2.26
reference: Mark 2:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ ἐπὶ Ἀβιαθὰρ ἀρχιερέως καὶ τοὺς ἄρτους τῆς προθέσεως ἔφαγεν, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ ⸂τοὺς ἱερεῖς⸃, καὶ ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/026.yaml
  text: how he entered into the house of God in the time of Abiathar the high priest[a], and ate the bread of the Presence, which it is not lawful to eat except for the priests[b], and also gave some to those who were with him?
translation:
  language: pt
  text: como ele entrou na casa de Deus no tempo do sumo sacerdote Abiatar[a], comeu os pães da Presença, que não é permitido comer senão aos sacerdotes[b], e também os deu aos que estavam com ele?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “durante o sumo sacerdócio de Abiatar”. A expressão também pode ser entendida de maneira mais ampla como referência à época ou ao contexto narrativo associado ao sumo sacerdote Abiatar.'
    reason: alternative_reading
  - marker: b
    text: Os “pães da Presença” eram pães consagrados colocados diante de Deus no santuário; tradicionalmente, “pães da proposição”.
    reason: cultural_note
lexical_decisions:
- source_word: πῶς
  choice: como
  rationale: Introduz o conteúdo do episódio recordado por Jesus e corresponde de modo natural à força narrativa do grego.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: entrou na casa de Deus
  rationale: Tradução direta e idiomática que preserva a designação grega do lugar sagrado.
- source_word: ἐπὶ Ἀβιαθὰρ ἀρχιερέως
  choice: no tempo do sumo sacerdote Abiatar
  rationale: ἐπί com genitivo pode ter sentido temporal. A formulação mantém certa amplitude e não impõe uma precisão cronológica maior que a expressão grega.
- source_word: ἄρτους τῆς προθέσεως
  choice: os pães da Presença
  rationale: Expressão transparente que conserva a ideia dos pães consagrados colocados diante de Deus; o plural acompanha ἄρτους e soa natural em português.
- source_word: ἔφαγεν
  choice: comeu
  rationale: O pretérito perfeito traduz naturalmente o aoristo narrativo.
- source_word: οὓς οὐκ ἔξεστιν φαγεῖν
  choice: que não é permitido comer
  rationale: Comunica com clareza a noção de permissão legal e sagrada de ἔξεστιν sem tornar a frase excessivamente formal.
- source_word: εἰ μὴ τοὺς ἱερεῖς
  choice: senão aos sacerdotes
  rationale: Expressa de forma concisa e idiomática que a permissão se restringia aos sacerdotes.
- source_word: ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν
  choice: e também os deu aos que estavam com ele
  rationale: Retoma explicitamente os pães com o pronome “os” e reproduz de perto, em português natural, a expressão “os que estavam com ele”.
theological_decisions:
- issue: A expressão temporal referente a Abiatar e sua relação com o relato de 1 Samuel 21
  choice: no tempo do sumo sacerdote Abiatar
  alternative: durante o sumo sacerdócio de Abiatar; no trecho a respeito do sumo sacerdote Abiatar
  rationale: A expressão grega admite uma referência temporal mais ampla e possivelmente uma associação narrativa. A tradução principal preserva essa amplitude relativa, enquanto a nota registra alternativas sem eliminar a tensão cronológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Sumo sacerdote” mantém o termo bíblico corrente; “pães da Presença” esclarece a expressão cultual sem recorrer apenas ao tradicional e menos transparente “pães da proposição”.
