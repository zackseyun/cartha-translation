  text: καὶ ⸀εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς τῷ πνεύματι αὐτοῦ ὅτι ⸀οὕτως διαλογίζονται ἐν ἑαυτοῖς ⸀λέγει αὐτοῖς· Τί ταῦτα διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/008.yaml
  text: And immediately Jesus[a], perceiving in his spirit that they were reasoning this way within themselves, said to them, “Why are you reasoning about these things in your hearts?”
translation:
  language: pt
  text: 'E Jesus, percebendo imediatamente em seu espírito[a] que eles raciocinavam dessa maneira dentro de si mesmos, disse-lhes: “Por que vocês raciocinam sobre essas coisas em seus corações?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sabendo em seu espírito” ou “reconhecendo dentro de si”. O grego não define explicitamente o modo da percepção de Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: imediatamente
  rationale: Preserva o marcador narrativo característico de Marcos e sua sensação de urgência, em português atual e natural.
- source_word: ἐπιγνοὺς
  choice: percebendo
  rationale: Expressa reconhecimento ou percepção clara sem definir indevidamente como Jesus obteve esse conhecimento.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: em seu espírito
  rationale: Reflete de perto o dativo grego e mantém aberta sua possível nuance de esfera ou meio, sem reduzir a expressão a mera intuição nem explicá-la explicitamente como onisciência.
- source_word: οὕτως
  choice: dessa maneira
  rationale: Transmite naturalmente o modo como eles raciocinavam.
- source_word: διαλογίζονται
  choice: raciocinavam
  rationale: Preserva o sentido de reflexão ou deliberação interior, sem sugerir necessariamente uma discussão verbal.
- source_word: ἐν ἑαυτοῖς
  choice: dentro de si mesmos
  rationale: No contexto, indica um processo interior; a formulação evita interpretá-lo como conversa entre eles.
- source_word: Τί ταῦτα διαλογίζεσθε
  choice: Por que vocês raciocinam sobre essas coisas
  rationale: Embora τί seja literalmente “o que”, nesta pergunta a forma idiomática “por que” comunica adequadamente sua força; “sobre essas coisas” representa ταῦτα sem omissão.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: em seu coração
  rationale: “Coração” preserva a imagem bíblica do centro interior do pensamento e da intenção. O singular distributivo é idiomático em português ao se dirigir ao grupo.
theological_decisions:
- issue: Natureza do conhecimento de Jesus em “percebendo em seu espírito”
  choice: Manter “em seu espírito” e afirmar que Jesus percebeu o raciocínio interior deles sem especificar o mecanismo.
  alternative: Interpretar explicitamente a frase como onisciência divina sobrenatural, ação do Espírito Santo ou apenas aguda intuição humana.
  rationale: O versículo apresenta Jesus como conhecedor do raciocínio interior deles, mas τῷ πνεύματι αὐτοῦ não define por si só o modo dessa percepção. A tradução conserva a força e a tensão teológica do texto sem impor uma explicação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” oferece uma forma corrente de segunda pessoa plural; “perguntou-lhes” mantém fluidez narrativa e representa naturalmente λέγει αὐτοῖς neste discurso direto. A ordem da frase acompanha de perto o grego sem soar artificial.
