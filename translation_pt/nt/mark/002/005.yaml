  text: ⸂καὶ ἰδὼν⸃ ὁ Ἰησοῦς τὴν πίστιν αὐτῶν λέγει τῷ παραλυτικῷ· Τέκνον, ⸂ἀφίενταί σου⸃ αἱ ⸀ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/005.yaml
  text: And Jesus[a], seeing their faith, says to the paralyzed man, “Child, your sins are forgiven.”
translation:
  language: pt
  text: 'E Jesus, vendo a fé deles, diz ao homem paralisado: “Filho[a], os seus pecados estão perdoados.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Criança”; o grego τέκνον é uma forma carinhosa de tratamento que significa “filho” ou “criança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: vendo
  rationale: Preserva a relação participial com o verbo principal e soa natural em português.
- source_word: πίστιν
  choice: fé
  rationale: Aqui indica a confiança demonstrada pelo grupo ao levar o homem até Jesus.
- source_word: αὐτῶν
  choice: deles
  rationale: O genitivo plural qualifica a fé como pertencente ao grupo mencionado no contexto.
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico e a vivacidade característica da narrativa de Marcos.
- source_word: παραλυτικῷ
  choice: homem paralisado
  rationale: Expressa de modo atual e respeitoso o adjetivo substantivado que designa a pessoa com paralisia.
- source_word: Τέκνον
  choice: Filho
  rationale: Como vocativo afetuoso dirigido a um homem adulto, “Filho” comunica naturalmente em português o calor relacional de τέκνον; a nota registra o sentido lexical mais amplo.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: os seus pecados estão perdoados
  rationale: Reproduz o presente passivo como uma realidade vigente, sem explicitar o agente divino nem impor a ideia de processo.
- source_word: ἁμαρτίαι
  choice: pecados
  rationale: Equivalente corrente que preserva o plural do grego.
theological_decisions:
- issue: Natureza da declaração de perdão feita por Jesus
  choice: os seus pecados estão perdoados
  alternative: os seus pecados foram perdoados; os seus pecados estão sendo perdoados
  rationale: A formulação conserva a força declarativa do presente passivo e deixa implícito o agente, como no grego, sem definir além do texto o mecanismo ou o momento do perdão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O presente histórico “diz” preserva o estilo vívido de Marcos; “homem paralisado” evita o substantivo potencialmente rotulador “paralítico”.
