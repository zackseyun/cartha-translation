id: EPH.4.25
reference: Ephesians 4:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Διὸ ἀποθέμενοι τὸ ψεῦδος λαλεῖτε ἀλήθειαν ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ, ὅτι ἐσμὲν ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/025.yaml
  text: Therefore[a], having put away falsehood, let each one speak truth with his neighbor, because we are members of one another.
translation:
  language: pt
  text: Por isso, tendo deixado de lado a falsidade[a], cada um fale a verdade com o seu próximo, porque somos membros uns dos outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a mentira”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Por isso
  rationale: Conjunção inferencial que liga a exortação ao argumento anterior; mantém a força conclusiva em português corrente.
- source_word: ἀποθέμενοι
  choice: tendo deixado de lado
  rationale: O particípio aoristo, ligado ao imperativo principal, apresenta o abandono da falsidade como condição ou ação acompanhante; a expressão também preserva a imagem de pôr algo de lado.
- source_word: τὸ ψεῦδος
  choice: a falsidade
  rationale: O singular com artigo pode designar a falsidade ou a prática da mentira como categoria ética. “A falsidade” expressa esse sentido amplo, enquanto “a mentira” permanece uma alternativa formal possível.
- source_word: λαλεῖτε ἀλήθειαν
  choice: fale a verdade
  rationale: O imperativo presente ordena uma prática contínua de falar a verdade. Em português, o singular concorda naturalmente com o distributivo “cada um”.
- source_word: ἕκαστος
  choice: cada um
  rationale: Preserva a força distributiva, aplicando individualmente a ordem dada à comunidade inteira.
- source_word: μετὰ τοῦ πλησίον αὐτοῦ
  choice: com o seu próximo
  rationale: μετά com o genitivo indica associação, e πλησίον designa o próximo no sentido ético e relacional.
- source_word: ὅτι
  choice: porque
  rationale: Introduz de maneira clara a razão da ordem de falar a verdade.
- source_word: ἐσμὲν ἀλλήλων μέλη
  choice: somos membros uns dos outros
  rationale: Mantém a metáfora corporal e a interdependência comunitária expressa pelo grego, sem explicá-la além do texto.
theological_decisions:
- issue: Linguagem distributiva gramaticalmente masculina
  choice: “cada um ... com o seu próximo”
  alternative: “cada pessoa ... com o seu próximo”
  rationale: As formas gregas são masculinas singulares com alcance representativo e incluem toda a comunidade. A formulação portuguesa conserva essa estrutura sem restringir a exortação aos homens.
- issue: Alcance de ψεῦδος
  choice: “a falsidade”
  alternative: “a mentira”
  rationale: No contexto ético imediato, o termo provavelmente se refere à falsidade como prática geral. Contudo, o artigo e o singular permitem a tradução mais formal “a mentira”, preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção participial conserva a relação entre abandonar a falsidade e falar a verdade; “membros uns dos outros” mantém deliberadamente a tensão da metáfora corporal.
