id: EPH.4.3
reference: Ephesians 4:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: σπουδάζοντες τηρεῖν τὴν ἑνότητα τοῦ πνεύματος ἐν τῷ συνδέσμῳ τῆς εἰρήνης·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/003.yaml
  text: making every effort to keep the unity of the Spirit in the bond of peace[a][b].
translation:
  language: pt
  text: esforçando-se para preservar a unidade do Espírito no vínculo da paz[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “empenhando-se em manter” ou “procurando diligentemente preservar”.
    reason: lexical_alternative
  - marker: b
    text: “O Espírito” provavelmente se refere aqui ao Espírito Santo, embora alguns entendam a expressão de modo mais geral, como o espírito compartilhado entre os fiéis.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδάζοντες
  choice: esforçando-se
  rationale: O particípio presente expressa empenho diligente e contínuo. “Esforçando-se” é natural em português e mantém a ideia de dedicação ativa no fluxo exortativo dos versículos anteriores.
- source_word: τηρεῖν
  choice: preservar
  rationale: O verbo indica guardar ou manter algo já existente. “Preservar” evita sugerir que os fiéis devam criar essa unidade.
- source_word: τὴν ἑνότητα
  choice: a unidade
  rationale: Equivalente direto, claro e corrente de ἑνότης, apropriado ao contexto comunitário.
- source_word: τοῦ πνεύματος
  choice: do Espírito
  rationale: O contexto de Efésios, especialmente 4.4 e 4.30, favorece a referência ao Espírito Santo; a maiúscula registra essa leitura sem apagar a alternativa, documentada em nota.
- source_word: ἐν
  choice: 'no'
  rationale: Mantém a preposição grega e permite que a expressão indique a esfera ou o meio em que a unidade é preservada.
- source_word: τῷ συνδέσμῳ
  choice: vínculo
  rationale: σύνδεσμος designa aquilo que liga ou mantém unido. “Vínculo” preserva a metáfora de ligação em linguagem digna e compreensível.
- source_word: τῆς εἰρήνης
  choice: da paz
  rationale: Reproduz de modo conciso o genitivo grego, apresentando a paz como o vínculo que mantém unidos.
theological_decisions:
- issue: Referente de πνεύματος
  choice: o Espírito Santo
  alternative: o espírito humano ou um espírito compartilhado entre os fiéis
  rationale: O uso próximo em Efésios favorece fortemente o Espírito Santo. A tradução adota essa leitura por meio da maiúscula, mas preserva a alternativa em nota.
- issue: Natureza da unidade
  choice: uma unidade já existente que deve ser preservada
  alternative: uma unidade a ser criada pelos fiéis
  rationale: τηρεῖν significa manter, guardar ou preservar, não produzir; por isso, a formulação evita apresentar os fiéis como criadores da unidade.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação mantém o encadeamento participial com o contexto anterior, preserva a metáfora de “vínculo” e usa “Espírito” com maiúscula como decisão contextual explícita.
