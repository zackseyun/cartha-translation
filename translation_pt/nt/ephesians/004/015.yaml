  text: ἀληθεύοντες δὲ ἐν ἀγάπῃ αὐξήσωμεν εἰς αὐτὸν τὰ πάντα, ὅς ἐστιν ἡ κεφαλή, ⸀Χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/015.yaml
  text: but speaking truth in love[a], let us grow in every way into him who is the head, Messiah[c][b],
translation:
  language: pt
  text: 'Mas, falando a verdade em amor[a], cresçamos em todos os aspectos[b] para aquele que é a cabeça: o Messias[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sendo verdadeiros» ou «praticando a verdade»; o verbo grego pode incluir tanto a fala verdadeira quanto a conduta verdadeira.
    reason: lexical_alternative
  - marker: b
    text: Ou «em tudo»; mais literalmente, «todas as coisas». A expressão «para aquele» também pode ser traduzida mais literalmente como «para dentro dele».
    reason: lexical_alternative
  - marker: c
    text: Grego «Cristo»; aqui traduzido como «Messias» porque o termo funciona como título.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀληθεύοντες
  choice: falando a verdade
  rationale: O particípio pode abranger tanto a fala verdadeira quanto uma conduta pautada pela verdade. No contexto de ensino enganoso e edificação comunitária, «falando a verdade» é natural e pertinente; a amplitude semântica é preservada em nota.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste moderado com a instabilidade e o engano descritos no contexto anterior.
- source_word: ἐν ἀγάπῃ
  choice: em amor
  rationale: Preserva a construção grega e permite entender o amor tanto como modo quanto como esfera da ação.
- source_word: αὐξήσωμεν
  choice: cresçamos
  rationale: O subjuntivo na primeira pessoa do plural tem força exortativa, expressa naturalmente em português por «cresçamos».
- source_word: εἰς αὐτόν
  choice: em direção àquele
  rationale: Expressa o movimento orientado para Cristo sem recorrer ao pouco natural «para dentro dele»; a possível nuance de crescimento para dentro dele é registrada em nota.
- source_word: τὰ πάντα
  choice: em todos os aspectos
  rationale: No contexto do verbo «crescer», a expressão tem sentido abrangente e adverbial, isto é, crescimento sob todos os aspectos, sem sugerir que objetos chamados «todas as coisas» estejam crescendo.
- source_word: κεφαλή
  choice: cabeça
  rationale: Tradução direta que mantém a metáfora do corpo sem decidir se ela enfatiza fonte, autoridade ou outra nuance contextual.
- source_word: Χριστός
  choice: o Messias
  rationale: Aqui o termo aparece em aposição a «a cabeça» e funciona como título; «o Messias» comunica esse valor em português.
theological_decisions:
- issue: Amplitude semântica de ἀληθεύοντες
  choice: falando a verdade
  alternative: sendo verdadeiros; praticando a verdade
  rationale: O contexto favorece a referência à comunicação verdadeira, mas o verbo pode incluir uma vida coerente com a verdade. A nota conserva essa amplitude para não restringir indevidamente o sentido.
- issue: Força interpretativa de κεφαλή
  choice: cabeça
  alternative: fonte; autoridade sobre
  rationale: A metáfora é mantida sem incorporar à tradução uma solução para interpretações teológicas debatidas.
- issue: Força direcional de εἰς αὐτόν
  choice: em direção àquele
  alternative: para dentro dele; nele
  rationale: A formulação principal é idiomática e conserva a orientação do crescimento para o Messias; a nota registra a versão mais literal e sua possível nuance de incorporação.
- issue: Valor titular de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: A posição apositiva favorece a leitura como título. A nota oferece a forma tradicional «Cristo» e esclarece a correspondência lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Em amor» preserva a formulação paulina sem perder inteligibilidade; «em direção àquele» evita o decalque pouco natural «para dentro dele». Os dois-pontos antes de «o Messias» tornam clara a aposição.
