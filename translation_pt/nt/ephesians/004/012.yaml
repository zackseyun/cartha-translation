source:
  edition: SBLGNT
  text: πρὸς τὸν καταρτισμὸν τῶν ἁγίων εἰς ἔργον διακονίας, εἰς οἰκοδομὴν τοῦ σώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/012.yaml
  text: for the equipping of the saints for the work of ministry[a], for the building up of the body of Messiah[c][b],
translation:
  language: pt
  text: para o preparo dos santos para a obra do ministério[a], para a edificação do corpo do Messias[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a obra de serviço”. A palavra grega διακονία pode significar “serviço” ou “ministério”.
    reason: lexical_alternative
  - marker: b
    text: Ou “de Cristo”. O título grego Χριστός é traduzido aqui por “Messias” para preservar seu sentido titular.
    reason: alternative_reading
  - marker: c
    text: 'A construção grega também pode ser entendida de modo progressivo: “para preparar os santos para a obra do ministério, para a edificação do corpo do Messias”.'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς τὸν καταρτισμὸν
  choice: para o preparo
  rationale: A expressão indica finalidade e o ato de tornar alguém apto ou preparado. “Preparo” é natural em português moderno e evita a possível ideia de perfeição moral associada a “aperfeiçoamento”.
- source_word: τῶν ἁγίων
  choice: dos santos
  rationale: É o termo paulino habitual para os que foram separados para Deus. “Santos” preserva essa linguagem estabelecida sem limitar o referente a pessoas posteriormente canonizadas.
- source_word: εἰς ἔργον διακονίας
  choice: para a obra do ministério
  rationale: Mantém o singular ἔργον e traduz διακονία de modo adequado ao contexto comunitário. “Ministério” aqui inclui serviço cristão e não implica atividade exclusiva do clero.
- source_word: εἰς οἰκοδομὴν
  choice: para a edificação
  rationale: Preserva a metáfora de construção aplicada ao fortalecimento e crescimento da comunidade, em linguagem bíblica ainda clara no português corrente.
- source_word: τοῦ σώματος
  choice: do corpo
  rationale: Traduz diretamente a metáfora paulina da comunidade como corpo.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Χριστός funciona como título; “Messias” torna explícito seu sentido titular, enquanto “Cristo” é registrado como alternativa tradicional.
theological_decisions:
- issue: Relação sintática entre as três expressões de finalidade
  choice: Manter “para... para... para...”, sem explicitar se as três finalidades são coordenadas ou se as duas últimas dependem do preparo dos santos.
  alternative: 'Entender progressivamente: os santos são preparados para a obra do ministério, e essa obra resulta na edificação do corpo do Messias.'
  rationale: A sequência grega πρὸς... εἰς... εἰς... admite mais de uma análise. A redação conserva a estrutura e a tensão do original sem decidir se o ministério é apresentado diretamente como função dos líderes mencionados no versículo anterior ou dos santos preparados por eles.
- issue: Sentido de διακονία
  choice: ministério
  alternative: serviço
  rationale: “Ministério” corresponde bem ao contexto e pode abranger toda forma de serviço na comunidade, sem restringi-lo a ministros ordenados; a alternativa lexical é preservada em nota.
- issue: Tradução do título Χριστός
  choice: Messias
  alternative: Cristo
  rationale: “Messias” preserva de forma transparente o valor titular do termo grego; “Cristo” permanece a forma tradicional possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Preparo” evita o tom arcaico ou potencialmente equívoco de “aperfeiçoamento”; “edificação” conserva a metáfora arquitetônica paulina. A ordem [b][c] liga primeiro a alternativa lexical a “Messias” e depois registra a ambiguidade sintática do conjunto.
