id: EPH.4.21
reference: Ephesians 4:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἴ γε αὐτὸν ἠκούσατε καὶ ἐν αὐτῷ ἐδιδάχθητε, καθώς ἐστιν ἀλήθεια ἐν τῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/021.yaml
  text: if indeed you heard him and were taught in him[a], just as truth is in Jesus[b],
translation:
  language: pt
  text: se é que vocês o ouviram e nele foram ensinados[a], assim como a verdade está em Jesus[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês ouviram falar dele”. Mais literalmente, o grego diz “vocês o ouviram”, possivelmente refletindo a ideia de que, na mensagem apostólica, eles ouviram o próprio Cristo.'
    reason: alternative_reading
  - marker: b
    text: “Nele” e “em Jesus” podem indicar esfera, união ou estreita associação; o grego deixa a nuance mais ampla do que uma simples ideia de “por ele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: se é que
  rationale: Preserva a forma condicional e a ênfase retórica de γε, que no contexto pressupõe a condição sem convertê-la explicitamente em uma afirmação causal.
- source_word: αὐτὸν ἠκούσατε
  choice: vocês o ouviram
  rationale: Mantém o objeto direto do grego e a expressão marcante de que os leitores ouviram o próprio Cristo, possivelmente por meio da proclamação apostólica, sem reduzi-la no texto principal a 'ouviram falar dele'.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Conserva a preposição ἐν e deixa abertas as nuances de esfera, união ou associação, em vez de interpretá-la apenas como agência.
- source_word: ἐδιδάχθητε
  choice: foram ensinados
  rationale: Reproduz de modo direto e natural o aoristo passivo.
- source_word: καθώς
  choice: assim como
  rationale: Expressa a força comparativa que relaciona o ensino recebido à verdade em Jesus.
- source_word: ἀλήθεια
  choice: a verdade
  rationale: Em português, o artigo torna a expressão mais natural e não exige que o substantivo grego tenha artigo; preserva o sentido de verdade encontrada ou presente em Jesus.
- source_word: ἐν τῷ Ἰησοῦ
  choice: em Jesus
  rationale: Preserva o nome pessoal 'Jesus' e a amplitude semântica de ἐν, sem restringi-la a 'por Jesus' ou explicitá-la apenas como união.
theological_decisions:
- issue: Se αὐτὸν ἠκούσατε deve ser traduzido diretamente como 'vocês o ouviram' ou idiomaticamente como 'vocês ouviram falar dele'.
  choice: vocês o ouviram
  alternative: vocês ouviram falar dele
  rationale: A construção grega tem Cristo como objeto direto de 'ouvir'. A tradução escolhida preserva essa formulação incomum e a possível ideia de que, na mensagem apostólica, ouviram o próprio Cristo; a nota registra a leitura idiomática possível.
- issue: 'Como representar as duas expressões com ἐν: ἐν αὐτῷ e ἐν τῷ Ἰησοῦ.'
  choice: nele / em Jesus
  alternative: por ele / em união com Jesus
  rationale: A repetição de 'em' preserva a tensão e a amplitude da linguagem paulina, que pode indicar esfera, união ou estreita associação, sem resolvê-la em simples agência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com 'vocês' para o plural. A redação mantém a construção condicional de transição e as expressões paulinas com 'em'. A vírgula final foi preservada porque o versículo continua sintaticamente no contexto seguinte.
