source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς ἐγὼ ὁ δέσμιος ἐν κυρίῳ ἀξίως περιπατῆσαι τῆς κλήσεως ἧς ἐκλήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/001.yaml
  text: Therefore I[a], the prisoner in the Lord, urge you to walk worthily of the calling with which you were called[b],
translation:
  language: pt
  text: Portanto, eu, o prisioneiro no Senhor[a], exorto vocês a andarem de modo digno da vocação para a qual foram chamados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o prisioneiro do Senhor” ou “um prisioneiro por causa do Senhor”.
    reason: alternative_reading
  - marker: b
    text: Ou “a viverem de modo digno da vocação para a qual foram chamados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: exorto
  rationale: O verbo introduz um apelo pastoral enfático. “Exorto” conserva essa força sem reduzir a expressão a um simples pedido.
- source_word: οὖν
  choice: Portanto
  rationale: Marca a conclusão prática decorrente da exposição anterior e mantém explícita a ligação lógica.
- source_word: δέσμιος
  choice: prisioneiro
  rationale: É o equivalente direto e natural para a condição de quem está preso.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Preserva a formulação paulina e evita limitar a relação ao Senhor a uma única nuance, como causa, propósito ou posse.
- source_word: ἀξίως
  choice: de modo digno
  rationale: Expressa com naturalidade uma conduta correspondente à vocação recebida.
- source_word: περιπατῆσαι
  choice: andarem
  rationale: Mantém a metáfora paulina de andar como maneira de viver, embora a nota registre a alternativa mais explícita.
- source_word: κλήσεως
  choice: vocação
  rationale: No contexto paulino, designa o chamado divino e a condição para a qual os fiéis foram chamados; “vocação” é conciso e estabelecido em português.
- source_word: ἧς ἐκλήθητε
  choice: com que foram chamados
  rationale: Reproduz de perto a relação entre o substantivo e o verbo cognato no grego, sem ocultar a repetição conceitual.
theological_decisions:
- issue: Sentido da autodescrição ὁ δέσμιος ἐν κυρίῳ
  choice: o prisioneiro no Senhor
  alternative: o prisioneiro do Senhor; um prisioneiro por causa do Senhor
  rationale: A tradução principal conserva a preposição grega e sua amplitude teológica, sem decidir se a expressão indica principalmente pertencimento, esfera de relação ou causa do aprisionamento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” comunica diretamente o plural de ὑμᾶς; “andarem” preserva a metáfora bíblica sem tornar a frase obscura.
