id: EPH.4.22
reference: Ephesians 4:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀποθέσθαι ὑμᾶς κατὰ τὴν προτέραν ἀναστροφὴν τὸν παλαιὸν ἄνθρωπον τὸν φθειρόμενον κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/022.yaml
  text: to put off[a], with respect to your former way of life, the old man, which is being corrupted according to deceitful desires[b],
translation:
  language: pt
  text: quanto ao modo de vida que vocês tinham antes, despir-se do velho ser humano[a], que está se corrompendo conforme os desejos enganosos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o velho homem”. A expressão grega se refere representativamente ao antigo modo de existência humana; também pode ser traduzida por “o velho eu”.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “os desejos do engano”; isto é, desejos moldados pelo engano.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθέσθαι
  choice: despir-se
  rationale: Preserva a metáfora de tirar uma peça de roupa, retomada pelo verbo correspondente em 4.24, e mantém a forma infinitiva do grego.
- source_word: κατὰ τὴν προτέραν ἀναστροφὴν
  choice: quanto ao modo de vida que vocês tinham antes
  rationale: Κατά indica aqui referência ou esfera; a formulação é natural em português e ἀναστροφή designa a conduta ou maneira de viver anterior.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: o velho ser humano
  rationale: Mantém o valor antropológico de ἄνθρωπος e a expressão representativa paulina, sem sugerir que a referência se limite aos homens nem reduzi-la simplesmente ao eu individual.
- source_word: τὸν φθειρόμενον
  choice: que está se corrompendo
  rationale: Expressa o aspecto progressivo do particípio presente e seu sentido de deterioração moral, sem excluir a ideia mais ampla de ruína.
- source_word: κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης
  choice: conforme os desejos enganosos
  rationale: Conserva κατά como padrão ou influência determinante e verte o genitivo literalmente 'do engano' de modo atributivo e natural; 'desejos' não restringe o termo a impulsos sexuais.
theological_decisions:
- issue: Sentido de τὸν παλαιὸν ἄνθρωπον
  choice: o velho ser humano
  alternative: o velho eu; o velho homem
  rationale: '''Velho ser humano'' retém a linguagem antropológica e possível dimensão representativa ou corporativa da expressão, evitando tanto a ambiguidade moderna de ''velho homem'' quanto a individualização interpretativa de ''velho eu''.'
- issue: Força do infinitivo ἀποθέσθαι
  choice: despir-se
  alternative: que vocês se dispam; terem se despido
  rationale: O infinitivo preserva a sintaxe grega dependente do contexto anterior e não decide se o enfoque recai sobre ordem, conteúdo do ensino ou acontecimento ligado à conversão.
- issue: Agência e processo em φθειρόμενον
  choice: está se corrompendo
  alternative: é corrompido; caminha para a ruína
  rationale: A construção pronominal portuguesa comunica naturalmente o processo contínuo expresso pelo particípio passivo sem impor um agente específico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural 'vocês' torna explícito ὑμᾶς. A ordem foi ajustada para clareza em português, mantendo o infinitivo e a metáfora de despir-se. A vírgula final reflete que o versículo integra a frase iniciada no contexto anterior e continuada nos versículos seguintes.
