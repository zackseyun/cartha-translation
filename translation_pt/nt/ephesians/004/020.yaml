  text: ὑμεῖς δὲ οὐχ οὕτως ἐμάθετε τὸν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/020.yaml
  text: But you did not learn Messiah in this way,[a]
translation:
  language: pt
  text: Vocês, porém, não aprenderam o Messias dessa maneira,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês, porém, não aprenderam Cristo dessa maneira.”'
    reason: Registra a tradução tradicional e possível de Χριστόν como “Cristo”, em vez do título explícito “o Messias”.
lexical_decisions:
- source_word: ὑμεῖς
  choice: vocês
  rationale: O pronome explícito, no plural, destaca os destinatários em contraste com a conduta descrita anteriormente. “Vocês” é natural e amplamente compreensível em português moderno.
- source_word: δὲ
  choice: porém
  rationale: Marca o contraste com a descrição anterior. A posição após “vocês” comunica de modo natural a força adversativa.
- source_word: οὐχ οὕτως
  choice: não... dessa maneira
  rationale: 'A negação com οὕτως se refere ao modo: a maneira como os leitores aprenderam o Messias não corresponde ao modo de vida anteriormente descrito.'
- source_word: ἐμάθετε
  choice: aprenderam
  rationale: Mantém o sentido direto do aoristo ativo de μανθάνω. Evita introduzir a ideia passiva de “foram ensinados”, explicitada mais claramente no versículo seguinte, ou a interpretação “vieram a conhecer”.
- source_word: τὸν Χριστόν
  choice: o Messias
  rationale: Preserva Χριστός como título messiânico e mantém a expressão deliberadamente incomum de aprender uma pessoa, sem acrescentar “Jesus” nem parafrasear a relação entre a pessoa e a mensagem a respeito dela.
theological_decisions:
- issue: Tradução de Χριστόν como título ou como forma semelhante a nome próprio
  choice: o Messias
  alternative: Cristo
  rationale: Neste contexto, a forma pode conservar sua força titular. “O Messias” torna esse valor explícito sem acrescentar conteúdo ausente do grego; a tradução tradicional “Cristo” permanece registrada em nota por ser lexical e contextualmente possível.
- issue: Sentido da expressão ἐμάθετε τὸν Χριστόν
  choice: aprenderam o Messias
  alternative: aprenderam a conhecer o Messias
  rationale: A construção grega é incomum e apresenta o Messias como objeto direto de “aprender”. A tradução mantém essa tensão, em vez de explicá-la como aquisição de conhecimento pessoal.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para o plural. A formulação incomum “aprenderam o Messias” é mantida de propósito por refletir a construção marcante do original.
