id: EPH.4.18
reference: Ephesians 4:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἐσκοτωμένοι τῇ διανοίᾳ ὄντες, ἀπηλλοτριωμένοι τῆς ζωῆς τοῦ θεοῦ, διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς, διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/018.yaml
  text: being darkened in their understanding[a], alienated from the life of God because of the ignorance that is in them, because of the hardness of their hearts[e][d][c][b],
translation:
  language: pt
  text: com o entendimento obscurecido[a], alheios à vida de Deus[b][c] por causa da ignorância que há neles, por causa da dureza do coração deles[d][e],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com a mente obscurecida”.
    reason: lexical_alternative
  - marker: b
    text: Ou “separados da vida de Deus”.
    reason: lexical_alternative
  - marker: c
    text: “A vida de Deus” pode significar tanto a vida que pertence a Deus como a vida que vem de Deus.
    reason: alternative_reading
  - marker: d
    text: Ou “insensibilidade” em vez de “dureza”.
    reason: lexical_alternative
  - marker: e
    text: O grego traz “coração” no singular; também se pode traduzir “a dureza dos seus corações”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκοτωμένοι τῇ διανοίᾳ ὄντες
  choice: com o entendimento obscurecido
  rationale: Expressa de modo natural em português o estado resultante indicado pelo particípio perfeito passivo, preservando o sentido cognitivo de διάνοια e a ligação participial com o contexto.
- source_word: ἀπηλλοτριωμένοι
  choice: alheios
  rationale: Comunica um estado contínuo de separação ou estranhamento sem restringi-lo à ideia jurídica de exclusão.
- source_word: τῆς ζωῆς τοῦ θεοῦ
  choice: à vida de Deus
  rationale: Mantém a construção genitiva aberta tanto à vida que pertence a Deus quanto à vida que procede dele.
- source_word: διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς
  choice: por causa da ignorância que há neles
  rationale: Reproduz claramente a relação causal de διά com acusativo e situa a ignorância no interior deles.
- source_word: διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν
  choice: por causa da dureza do coração deles
  rationale: Preserva a metáfora de endurecimento e o singular coletivo καρδίας, usando uma formulação compreensível em português moderno.
theological_decisions:
- issue: Sentido de “vida de Deus”
  choice: Manter “vida de Deus” sem explicitar a relação do genitivo.
  alternative: “vida que vem de Deus” ou “a própria vida de Deus”
  rationale: O grego permite mais de uma nuance relacionada; a tradução preserva essa ambiguidade teológica genuína.
- issue: Singular “coração” com referente plural
  choice: Usar “coração deles”.
  alternative: “corações deles”
  rationale: A forma escolhida reflete o singular grego e pode ser entendida coletivamente, enquanto a alternativa plural é mais idiomática e também possível.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A redação mantém a estrutura dependente do contexto anterior e evita tornar os particípios gregos em afirmações independentes. “Alheios” e “dureza do coração” conservam o tom bíblico sem arcaísmo excessivo.
