  yaml_path: translation/nt/ephesians/004/005.yaml
  text: one Lord[a], one faith, one baptism;
translation:
  language: pt
  text: um só Senhor, uma só fé[a], um só batismo;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma só confiança” ou “uma só fidelidade”; aqui, “fé” se ajusta melhor à unidade compartilhada enfatizada no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς / μία / ἓν
  choice: um só / uma só
  rationale: As três formas do numeral concordam em gênero com seus substantivos. A repetição de “só” torna natural em português a ênfase na unidade e preserva o paralelismo tríplice.
- source_word: κύριος
  choice: Senhor
  rationale: É o equivalente português corrente do título κύριος e, neste contexto paulino, refere-se mais naturalmente a Cristo, não apenas a um mestre humano.
- source_word: πίστις
  choice: fé
  rationale: “Fé” é a tradução mais ampla e natural neste contexto, em que se destaca a fé compartilhada que une a comunidade; o termo grego também pode expressar confiança ou fidelidade.
- source_word: βάπτισμα
  choice: batismo
  rationale: Termo preciso, corrente e amplamente compreendido para βάπτισμα, sem explicitar modalidade, eficácia ou interpretação denominacional.
theological_decisions:
- issue: Referente de “Senhor”
  choice: Manter “Senhor” como título, referindo-se mais naturalmente a Jesus no contexto de Efésios 4.4–6.
  alternative: Entender a palavra como referência mais geral a Deus.
  rationale: A sequência menciona um Espírito, um Senhor e um Deus e Pai; isso favorece a referência cristológica, embora o versículo isolado não nomeie Jesus.
- issue: Sentido de “um só batismo”
  choice: Traduzir de forma neutra, sem definir modalidade, eficácia ou natureza do batismo.
  alternative: Explicitar uma leitura especificamente sacramental ou uma leitura primordialmente metafórica/espiritual.
  rationale: O texto afirma a unidade do batismo, mas não resolve por si só debates denominacionais sobre sua teologia.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção “um só / uma só” preserva com naturalidade a insistência do grego na unidade.
