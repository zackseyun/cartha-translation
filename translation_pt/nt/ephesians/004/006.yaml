id: EPH.4.6
reference: Ephesians 4:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἷς θεὸς καὶ πατὴρ πάντων, ὁ ἐπὶ πάντων καὶ διὰ πάντων καὶ ἐν ⸀πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/006.yaml
  text: one God and Father of all[b][a], who is over all and through all and in all.
translation:
  language: pt
  text: um só Deus e Pai de todos[a], que está sobre todos, age por meio de todos e está em todos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Pai de todas as pessoas” ou “Pai de todas as coisas”. O grego não explicita o substantivo a que “todos” se refere.
    reason: lexical_alternative
  - marker: b
    text: Ou “em todas as pessoas”. Alguns manuscritos trazem “em todos vocês”.
    reason: textual_variant
lexical_decisions:
- source_word: εἷς
  choice: um só
  rationale: 'Expressa naturalmente em português o numeral enfático que integra a sequência de unidade do contexto: um só corpo, um só Espírito e um só Senhor.'
- source_word: θεὸς καὶ πατὴρ
  choice: Deus e Pai
  rationale: Preserva os dois títulos coordenados e a designação pessoal e relacional de Deus.
- source_word: πάντων
  choice: de todos
  rationale: Mantém a amplitude e a indeterminação do grego, que não explicita se a referência é a todas as pessoas ou a todas as coisas.
- source_word: ὁ ἐπὶ πάντων
  choice: que está sobre todos
  rationale: A construção explicativa é vertida com naturalidade; 'sobre todos' comunica supremacia ou soberania sem estreitar o referente.
- source_word: διὰ πάντων
  choice: age por meio de todos
  rationale: διά com genitivo indica mediação ou agência. O verbo 'age', implícito na construção nominal grega, torna a frase idiomática em português, embora 'por meio de todos' seja uma alternativa mais formal.
- source_word: ἐν πᾶσιν
  choice: está em todos
  rationale: Fornece em português o verbo exigido pela construção e preserva o paralelismo e a abertura do referente de πᾶσιν.
theological_decisions:
- issue: Alcance das formas repetidas πάντων / πᾶσιν
  choice: Manter 'todos' sem acrescentar um substantivo que restrinja o referente.
  alternative: Traduzir como 'todas as pessoas', 'todos os fiéis' ou 'todas as coisas'.
  rationale: O contexto imediato trata da unidade da igreja, mas o grego não declara o substantivo subentendido. A tradução preserva essa amplitude e a tensão interpretativa.
- issue: Sentido de διὰ πάντων
  choice: Traduzir como 'age por meio de todos'.
  alternative: Traduzir formalmente como 'por meio de todos'.
  rationale: O verbo acrescentado explicita de modo mínimo a atividade divina sugerida pela preposição e produz português corrente, sem identificar uma operação específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de 'todos' reproduz a ênfase retórica do grego; 'um só' ressalta a unidade no contexto. Todos os marcadores de notas aparecem no texto principal.
