source:
  edition: SBLGNT
  text: οἵτινες ἀπηλγηκότες ἑαυτοὺς παρέδωκαν τῇ ἀσελγείᾳ εἰς ἐργασίαν ἀκαθαρσίας πάσης ἐν πλεονεξίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/019.yaml
  text: who[a], having become callous[c][b], gave themselves over to sensuality for the practice of every kind of impurity with greediness.
translation:
  language: pt
  text: os quais, tendo se tornado insensíveis[a], entregaram-se à devassidão[b], para praticar todo tipo de impureza com avidez[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tendo perdido toda a sensibilidade” ou “tendo ficado endurecidos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “à libertinagem” ou “à conduta desenfreada”.
    reason: lexical_alternative
  - marker: c
    text: Ou “em ganância” ou “com cobiça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: os quais
  rationale: Retoma os gentios mencionados no contexto anterior e preserva a ligação relativa do grego sem acrescentar ênfase indevida.
- source_word: ἀπηλγηκότες
  choice: tendo se tornado insensíveis
  rationale: O particípio perfeito descreve a chegada a um estado persistente de insensibilidade, sobretudo moral no contexto. A formulação conserva tanto o processo anterior quanto seu resultado presente.
- source_word: ἑαυτοὺς παρέδωκαν
  choice: entregaram-se
  rationale: Expressa de modo natural em português a entrega voluntária indicada pelo objeto reflexivo e pelo verbo παραδίδωμι.
- source_word: τῇ ἀσελγείᾳ
  choice: à devassidão
  rationale: Designa conduta desavergonhada e desenfreada, frequentemente sexual, sem limitar necessariamente o termo apenas à esfera sexual.
- source_word: εἰς ἐργασίαν
  choice: para praticar
  rationale: 'Comunica de maneira direta a finalidade ou o resultado da entrega: dedicar-se ativamente à prática do que segue.'
- source_word: ἀκαθαρσίας πάσης
  choice: todo tipo de impureza
  rationale: Expressa com naturalidade a abrangência distributiva de πάσης, incluindo toda forma de impureza.
- source_word: ἐν πλεονεξίᾳ
  choice: com avidez
  rationale: Mantém a ideia de desejo insaciável por mais e funciona naturalmente como indicação do modo em que a impureza é praticada, sem excluir a noção de ganância.
theological_decisions:
- issue: Força moral e psicológica de ἀπηλγηκότες
  choice: tendo se tornado insensíveis
  alternative: tendo perdido toda a sensibilidade; tendo ficado endurecidos
  rationale: O contexto trata de alienação ética e entrega à impureza. A tradução aponta para insensibilidade moral, mas evita transformar explicitamente a expressão em terminologia clínica ou resolver além do necessário a imagem grega.
- issue: Amplitude de ἀσέλγεια
  choice: devassidão
  alternative: libertinagem; conduta desenfreada
  rationale: O termo frequentemente abrange desregramento sexual, mas também pode descrever autoindulgência descarada de modo mais amplo. A escolha preserva essa amplitude.
- issue: Relação sintática e sentido de ἐν πλεονεξίᾳ
  choice: com avidez
  alternative: em ganância; com cobiça
  rationale: A expressão provavelmente caracteriza a prática da impureza como insaciável, mas πλεονεξία também pode ser entendida como ganância ou cobiça. A nota preserva essa tensão lexical sem impor uma interpretação exclusivamente econômica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Devassidão” evita o possível sentido neutro ou positivo que “sensualidade” pode ter no português atual; “com avidez” conserva a força insaciável da expressão final. Todos os marcadores aparecem junto aos termos correspondentes.
