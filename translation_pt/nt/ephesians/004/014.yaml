id: EPH.4.14
reference: Ephesians 4:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα μηκέτι ὦμεν νήπιοι, κλυδωνιζόμενοι καὶ περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας ἐν τῇ κυβείᾳ τῶν ἀνθρώπων ἐν πανουργίᾳ πρὸς τὴν μεθοδείαν τῆς πλάνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/014.yaml
  text: so that we may no longer be children[a], tossed by waves and carried about by every wind of teaching, by human trickery, by craftiness in the scheming of error[c][b],
translation:
  language: pt
  text: para que não sejamos mais crianças, jogados de um lado para outro pelas ondas e levados de um lado para outro por todo vento de ensino, pela trapaça humana[a], pela astúcia com vistas à trama do engano[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “no jogo de dados das pessoas”, imagem associada à fraude e à trapaça.
    reason: cultural_note
  - marker: b
    text: 'Ou: “com vistas à trama do erro”; a expressão grega também pode ser entendida, no contexto, como “na trama do engano”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μηκέτι ὦμεν
  choice: para que não sejamos mais
  rationale: Preserva a força de propósito de ἵνα com o subjuntivo e o sentido temporal de μηκέτι em português natural.
- source_word: νήπιοι
  choice: crianças
  rationale: Comunica a metáfora de imaturidade sem restringi-la a bebês de colo.
- source_word: κλυδωνιζόμενοι
  choice: jogados de um lado para outro pelas ondas
  rationale: Explicita a imagem marítima do verbo e sua ideia de instabilidade.
- source_word: περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας
  choice: levados de cá para lá por todo vento de ensino
  rationale: Mantém a voz passiva, o movimento instável e a metáfora do vento; “ensino” traduz διδασκαλία sem tecnicismo desnecessário.
- source_word: ἐν τῇ κυβείᾳ τῶν ἀνθρώπων
  choice: pela trapaça humana
  rationale: Expressa o sentido contextual de fraude de κυβεία, cuja imagem literal é a manipulação no jogo de dados.
- source_word: ἐν πανουργίᾳ
  choice: pela astúcia
  rationale: Preserva o sentido moralmente negativo de habilidade ardilosa ou inescrupulosa.
- source_word: πρὸς τὴν μεθοδείαν τῆς πλάνης
  choice: com vistas às maquinações do engano
  rationale: “Com vistas a” retém a orientação expressa por πρός; “maquinações” comunica planejamento deliberado, e “engano” conserva a possível dimensão ativa de πλάνη.
theological_decisions:
- issue: Sentido de διδασκαλία
  choice: ensino
  alternative: doutrina
  rationale: “Ensino” é amplo e corrente, sem limitar a advertência apenas a sistemas doutrinários formalizados.
- issue: Sentido de πλάνη
  choice: engano
  alternative: erro
  rationale: O termo pode denotar erro, extravio ou engano. “Engano” se ajusta ao contexto de trapaça e astúcia, enquanto a nota registra a alternativa sem eliminar a ambiguidade.
- issue: Relação sintática de πρὸς τὴν μεθοδείαν
  choice: com vistas às maquinações
  alternative: nas maquinações
  rationale: A formulação mantém a ideia direcional ou final de πρός, embora o grego seja condensado e também admita uma expressão contextual mais locativa.
translation_notes:
  register: Português atual, digno e de leitura ampla, com cadência metafórica preservada. “De cá para lá” torna natural a instabilidade descrita pelos dois particípios, e as notas conservam as imagens e ambiguidades relevantes do grego.
