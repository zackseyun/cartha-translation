  text: τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι καὶ ⸀κατέβη εἰς τὰ κατώτερα μέρη τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/009.yaml
  text: What does “he ascended” mean except that he also descended into the lower parts of the earth?[a]
translation:
  language: pt
  text: O que significa “subiu”, senão que ele também desceu às partes mais baixas da terra?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “às regiões inferiores, isto é, à terra”. A expressão pode referir-se simplesmente à descida à terra ou, mais especificamente, ao mundo dos mortos.'
    reason: Registra as principais maneiras de relacionar “as partes mais baixas” com “a terra” e preserva a ambiguidade interpretativa do grego.
lexical_decisions:
- source_word: Ἀνέβη
  choice: subiu
  rationale: Aoristo de ἀναβαίνω, retomando a citação anterior. “Subiu” conserva de modo natural a imagem de movimento vertical e o paralelo com “desceu”.
- source_word: τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι
  choice: Ora, o que significa “subiu”, senão que
  rationale: A formulação portuguesa comunica a inferência feita a partir da palavra citada. “Ora” representa a função argumentativa de δέ, sem lhe dar sentido temporal.
- source_word: καὶ κατέβη
  choice: ele também desceu
  rationale: “Também” preserva o valor aditivo de καί e o contraste paralelo entre subir e descer.
- source_word: εἰς
  choice: às
  rationale: A contração de “a” com o artigo expressa em português o movimento dirigido para essas partes; neste contexto, é mais natural que “para dentro de” sem apagar a direção.
- source_word: τὰ κατώτερα μέρη
  choice: as partes mais baixas
  rationale: Mantém tanto μέρη, “partes”, quanto a forma comparativa de κατώτερα, “mais baixas”, sem identificar antecipadamente o referente como a terra ou o mundo dos mortos.
- source_word: τῆς γῆς
  choice: da terra
  rationale: “Terra” se ajusta ao contraste cósmico entre descida e subida. A construção genitiva permanece ambígua entre “partes mais baixas da terra” e “partes mais baixas, isto é, a terra”.
theological_decisions:
- issue: Sentido de εἰς τὰ κατώτερα μέρη τῆς γῆς
  choice: às partes mais baixas da terra
  alternative: às regiões inferiores, isto é, à terra; ou às partes inferiores da terra, entendidas como o mundo dos mortos
  rationale: O grego permite entender “da terra” como especificação das partes inferiores da própria terra ou, possivelmente, como explicação de que a terra é a região inferior. A tradução principal conserva essa tensão e não impõe uma doutrina específica sobre a descida ao mundo dos mortos.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade no Brasil. As aspas identificam a palavra retomada da citação anterior; “Ora” funciona como conector argumentativo, não temporal.
