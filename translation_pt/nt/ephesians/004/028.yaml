  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ κλέπτων μηκέτι κλεπτέτω, μᾶλλον δὲ κοπιάτω ἐργαζόμενος ⸂ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν⸃, ἵνα ἔχῃ μεταδιδόναι τῷ χρείαν ἔχοντι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/028.yaml
  text: The one who steals must steal no longer[a], but rather must labor, doing good work with his own hands[b], so that he may have something to share with the one who has need.
translation:
  language: pt
  text: Quem rouba não roube mais; pelo contrário, trabalhe arduamente, fazendo com as próprias mãos o que é bom[a], para que tenha o que repartir com quem passa necessidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “trabalhando com as próprias mãos no que é bom”.'
    reason: A construção grega também pode ser traduzida de modo mais próximo à sequência verbal “trabalhando ... o que é bom”, sem restringir “o que é bom” a um tipo específico de trabalho.
lexical_decisions:
- source_word: ὁ κλέπτων
  choice: Quem rouba
  rationale: O particípio presente substantivado descreve a pessoa que pratica o roubo, sem transformá-lo em um rótulo fixo como “o ladrão”.
- source_word: μηκέτι κλεπτέτω
  choice: não roube mais
  rationale: Expressa de modo natural em português tanto a ordem do imperativo quanto a cessação de uma prática anterior.
- source_word: μᾶλλον δὲ
  choice: Pelo contrário
  rationale: Marca com clareza o forte contraste corretivo entre roubar e passar a trabalhar honestamente.
- source_word: κοπιάτω
  choice: trabalhe arduamente
  rationale: Preserva a ideia de esforço intenso presente em κοπιάω, mais forte que o simples “trabalhar”.
- source_word: ἐργαζόμενος ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν
  choice: fazendo com as próprias mãos o que é bom
  rationale: Mantém a referência concreta ao trabalho pessoal e preserva a amplitude de τὸ ἀγαθόν, que pode indicar aquilo que é bom, útil ou honesto.
- source_word: ἵνα ἔχῃ μεταδιδόναι
  choice: para que tenha o que repartir
  rationale: Reproduz a finalidade da oração e explicita de modo idiomático os recursos implícitos que a pessoa passa a ter para compartilhar.
- source_word: τῷ χρείαν ἔχοντι
  choice: com quem passa necessidade
  rationale: Forma corrente e digna de descrever o destinatário necessitado, sem convertê-lo em um rótulo social permanente.
theological_decisions:
- issue: Finalidade ética do trabalho
  choice: O trabalho honesto substitui o roubo e possibilita repartir com quem passa necessidade.
  alternative: Entender a finalidade principal como autossuficiência ou restituição.
  rationale: A oração final declara expressamente que o propósito é ter o que repartir. O sustento próprio pode estar implícito, mas a generosidade é o objetivo explicitado pelo texto; restituição não é mencionada aqui.
translation_notes:
  register: Português moderno, claro e amplamente compreensível, com legibilidade brasileira. “Quem rouba” evita linguagem marcada por gênero e preserva o valor participial; “passa necessidade” é natural sem perder a dignidade do registro.
