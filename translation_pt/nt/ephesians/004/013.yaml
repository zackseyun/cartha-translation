id: EPH.4.13
reference: Ephesians 4:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μέχρι καταντήσωμεν οἱ πάντες εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ, εἰς ἄνδρα τέλειον, εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/013.yaml
  text: until we all attain to the unity of the faith and of the knowledge of the Son of God[a], to a mature man, to the measure of the stature of the fullness of Messiah[e][d][c][b],
translation:
  language: pt
  text: até que todos nós cheguemos à unidade da fé[a] e do conhecimento do Filho de Deus[b], ao homem maduro[c], à medida da estatura[d] da plenitude do Messias[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «da fé comum». A expressão pode se referir à fé cristã compartilhada ou, de modo mais geral, à fé dos que creem.
    reason: alternative_reading
  - marker: b
    text: Ou «do pleno conhecimento» ou «do conhecimento profundo».
    reason: lexical_alternative
  - marker: c
    text: Ou «à plena maturidade». O grego diz literalmente «a um homem maduro», usando uma imagem masculina singular para a maturidade coletiva de toda a igreja.
    reason: lexical_alternative
  - marker: d
    text: Ou «maturidade».
    reason: lexical_alternative
  - marker: e
    text: 'Grego: «Cristo», título que significa «Messias» ou «Ungido».'
    reason: alternative_reading
lexical_decisions:
- source_word: μέχρι
  choice: até que
  rationale: Marca a meta do processo descrito no contexto anterior e introduz naturalmente o subjuntivo em português.
- source_word: καταντήσωμεν οἱ πάντες
  choice: todos nós cheguemos
  rationale: Comunica a ideia metafórica de alcançar uma meta e mantém a inclusão explícita de toda a comunidade.
- source_word: εἰς τὴν ἑνότητα τῆς πίστεως
  choice: à unidade da fé
  rationale: Preserva a estrutura de finalidade e a formulação concisa do grego; «da fé» permite o sentido provável da fé compartilhada sem excluir totalmente a referência ao crer dos fiéis.
- source_word: ἐπιγνώσεως
  choice: conhecimento
  rationale: É natural e exato em português; possíveis nuances de conhecimento pleno ou profundo são registradas em nota.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: do Filho de Deus
  rationale: Reproduz diretamente o título cristológico e a relação genitiva.
- source_word: εἰς ἄνδρα τέλειον
  choice: ao homem maduro
  rationale: Mantém a imagem masculina singular que representa a maturidade coletiva da igreja; «maduro» corresponde melhor ao contexto de crescimento do que «perfeito».
- source_word: μέτρον ἡλικίας
  choice: medida da estatura
  rationale: Conserva a metáfora corporal de crescimento, embora ἡλικία também possa indicar maturidade.
- source_word: τοῦ πληρώματος
  choice: da plenitude
  rationale: Preserva o termo paulino teologicamente denso sem o reduzir a uma paráfrase.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Traduz Χριστός como título, destacando seu sentido de Ungido, de acordo com a orientação do projeto.
theological_decisions:
- issue: Sentido de τῆς πίστεως
  choice: da fé, provavelmente a fé compartilhada pela comunidade
  alternative: da fé no sentido da confiança exercida pelos fiéis
  rationale: O artigo e o contexto de unidade comunitária favorecem a fé comum, mas a redação principal conserva a concisão e a ambiguidade possível do grego.
- issue: Imagem de εἰς ἄνδρα τέλειον
  choice: ao homem maduro
  alternative: à plena maturidade; ao homem perfeito
  rationale: O masculino singular é uma imagem coletiva da igreja chegando à maturidade. Mantê-lo evita apagar a metáfora, enquanto a nota esclarece seu alcance corporativo.
- issue: Valor de Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto teológico, Χριστός conserva força titular; «Messias» torna esse valor explícito sem acrescentar uma interpretação denominacional.
- issue: Relação em τοῦ πληρώματος τοῦ Χριστοῦ
  choice: da plenitude do Messias
  alternative: da plena medida que pertence ao Messias ou que é caracterizada por ele
  rationale: A construção genitiva admite mais de uma relação precisa; a tradução formal evita decidir silenciosamente entre posse, origem ou caracterização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «à/ao» preserva o movimento retórico dos três εἰς. Mantiveram-se «homem maduro», «estatura» e «plenitude» para conservar a metáfora de crescimento e a densidade do original.
