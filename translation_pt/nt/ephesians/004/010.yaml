id: EPH.4.10
reference: Ephesians 4:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ καταβὰς αὐτός ἐστιν καὶ ὁ ἀναβὰς ὑπεράνω πάντων τῶν οὐρανῶν, ἵνα πληρώσῃ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/010.yaml
  text: The one who descended is himself also the one who ascended far above all the heavens[b][a], so that he might fill all things.
translation:
  language: pt
  text: Aquele que desceu é o mesmo que também subiu muito acima de todos os céus[a], a fim de encher todas as coisas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «acima de todos os céus». A expressão pode enfatizar sua exaltação sobre todo domínio celestial.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «cumprir todas as coisas». Em alguns contextos, o verbo grego pode significar «cumprir», mas aqui «encher» se ajusta melhor ao contexto imediato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καταβὰς
  choice: Aquele que desceu
  rationale: O particípio aoristo com artigo funciona como substantivo; a oração relativa é natural em português e preserva a referência pessoal.
- source_word: αὐτός ἐστιν καὶ
  choice: é o mesmo que também
  rationale: A formulação preserva a ênfase de αὐτός na identidade entre quem desceu e quem subiu, sem tornar a frase pesada.
- source_word: ὁ ἀναβὰς
  choice: subiu
  rationale: A construção integra o segundo particípio substantivado à expressão portuguesa «o mesmo que também subiu», mantendo o paralelismo sem repetição artificial.
- source_word: ὑπεράνω
  choice: muito acima
  rationale: Expressa de modo idiomático a ideia intensiva de posição ou exaltação superior.
- source_word: πάντων τῶν οὐρανῶν
  choice: de todos os céus
  rationale: Mantém tanto a totalidade indicada por πάντων como o plural οὐρανῶν, sem reduzir a expressão cosmológica.
- source_word: ἵνα
  choice: a fim de
  rationale: Marca claramente a finalidade da subida em português corrente e digno.
- source_word: πληρώσῃ
  choice: encher
  rationale: «Encher» é o sentido mais provável no contexto e preserva a imagem de plenitude; a nota registra a alternativa «cumprir».
- source_word: τὰ πάντα
  choice: todas as coisas
  rationale: Conserva o alcance amplo e deliberadamente não especificado da expressão grega.
theological_decisions:
- issue: Identidade daquele que desceu e subiu
  choice: «é o mesmo que também» destaca que se trata da mesma pessoa
  alternative: Uma tradução menos enfática, como «também foi quem subiu»
  rationale: O pronome enfático αὐτός e os particípios articulados repetidos ressaltam a identidade, sem exigir que a tradução acrescente uma identificação não expressa neste versículo.
- issue: Alcance de τὰ πάντα
  choice: «todas as coisas»
  alternative: «tudo», «todas as pessoas» ou «o universo inteiro»
  rationale: A expressão é abrangente. A tradução mantém sua amplitude e tensão teológica, sem restringi-la a pessoas nem explicá-la como uma referência cosmológica específica.
- issue: Sentido de πληρόω
  choice: «encher»
  alternative: «cumprir»
  rationale: No contexto imediato, «encher» se ajusta melhor à linguagem de plenitude, mas a polissemia real do verbo é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Aquele que» mantém solenidade natural; «é o mesmo que também» comunica a ênfase de identidade sem literalismo rígido. Os marcadores aparecem após as expressões às quais suas notas se referem.
