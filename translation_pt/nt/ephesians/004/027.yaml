  text: μηδὲ δίδοτε τόπον τῷ διαβόλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/027.yaml
  text: and do not give place to the devil[a].
translation:
  language: pt
  text: e não deem lugar ao diabo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oportunidade” ou “espaço”; literalmente, “não deem lugar ao diabo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: e não
  rationale: No contexto, a conjunção dá continuidade às exortações anteriores; “e não” preserva naturalmente essa ligação e introduz a proibição.
- source_word: δίδοτε
  choice: deem
  rationale: O imperativo presente de δίδωμι tem o sentido direto de “dar”; a construção portuguesa “dar lugar a” mantém tanto o verbo quanto o caráter contínuo da exortação.
- source_word: τόπον
  choice: lugar
  rationale: O sentido literal é “lugar”, e a expressão “dar lugar a” é natural em português, podendo comunicar espaço ou oportunidade para agir sem introduzir a metáfora mais específica de “brecha”.
- source_word: τῷ διαβόλῳ
  choice: ao diabo
  rationale: Com o artigo e neste contexto, διάβολος designa o adversário pessoal; “o diabo” é a forma convencional e contextualmente adequada em português.
theological_decisions:
- issue: Se διάβολος deve ser entendido como substantivo comum (“caluniador”) ou como designação do ser maligno pessoal (“o diabo”)
  choice: o diabo
  alternative: o caluniador
  rationale: Na exortação paulina, a expressão aponta convencionalmente para o adversário pessoal, não apenas para um caluniador humano. A tradução preserva esse referente provável sem ampliar o texto.
- issue: Se τόπον deve ser explicitado como “oportunidade” ou mantido como “lugar”
  choice: lugar
  alternative: oportunidade
  rationale: '“Lugar” reproduz diretamente a imagem grega e conserva sua amplitude: pode envolver espaço, ocasião ou oportunidade de ação. O português “dar lugar a” permanece compreensível sem resolver a metáfora de modo excessivamente interpretativo.'
translation_notes:
  register: Português moderno, digno e de leitura ampla, com forma verbal plural adequada à exortação dirigida à comunidade. A ordem “dar lugar ao diabo” segue de perto o grego e soa natural em português.
