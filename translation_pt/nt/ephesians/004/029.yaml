  source_fidelity: A tradução reproduz adequadamente a proibição abrangente de πᾶς λόγος σαπρός, a imagem concreta de algo que sai da boca, o contraste com a fala boa voltada à edificação em relação à necessidade e a finalidade de conceder χάρις aos ouvintes. «Palavra podre» preserva, de modo deliberadamente vívido, a metáfora de σαπρός; «graça» mantém a amplitude de χάρις sem excluir a nuance de benefício indicada na nota.
