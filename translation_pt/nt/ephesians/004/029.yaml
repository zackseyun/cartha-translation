  terminology: «Edificar» conserva a metáfora de οἰκοδομή sem recorrer a uma formulação excessivamente eclesiástica. «Graça» é terminologicamente defensável no contexto paulino; a nota oferece «trazer benefício» como alternativa contextual legítima. As notas estão corretamente ancoradas e correspondem às alternativas relevantes.
