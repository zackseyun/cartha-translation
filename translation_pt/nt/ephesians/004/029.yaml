  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πᾶς λόγος σαπρὸς ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω, ἀλλὰ εἴ τις ἀγαθὸς πρὸς οἰκοδομὴν τῆς χρείας, ἵνα δῷ χάριν τοῖς ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/029.yaml
  text: Let no rotten word come out of your mouth[a], but only such as is good for building up according to the need[d][c][b], so that it may give grace to those who hear.
translation:
  language: pt
  text: Que nenhuma palavra podre saia da boca de vocês,[a] mas somente a que for boa para edificar conforme a necessidade,[b] a fim de dar graça aos que a ouvem.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nenhuma conversa corrompida» ou «nenhuma palavra nociva». O grego diz literalmente «nenhuma palavra podre».
    reason: lexical_alternative
  - marker: b
    text: Ou «para edificar segundo a necessidade»; também pode ter o sentido de «para edificar como a necessidade exigir».
    reason: lexical_alternative
  - marker: c
    text: Ou «a fim de trazer benefício aos que a ouvem».
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς λόγος σαπρὸς
  choice: nenhuma palavra podre
  rationale: 'Sob negação, πᾶς com o substantivo singular tem sentido distributivo: nenhuma palavra desse tipo. «Podre» preserva a metáfora vívida de σαπρός, embora λόγος neste contexto se refira ao que é dito, não apenas a uma palavra isolada.'
- source_word: ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω
  choice: saia da boca de vocês
  rationale: A forma imperativa com μή expressa proibição. A expressão mantém a imagem corporal do grego e soa natural em português; o singular «boca» acompanha o idioma coletivo da fonte.
- source_word: ἀλλὰ εἴ τις ἀγαθὸς
  choice: mas somente a que for boa
  rationale: A construção é elíptica e retoma λόγος. «Somente» explicita o contraste implícito entre a fala proibida e a fala aceitável sem alterar seu sentido.
- source_word: πρὸς οἰκοδομὴν τῆς χρείας
  choice: para edificar conforme a necessidade
  rationale: «Edificar» conserva a metáfora de construção de οἰκοδομή e é compreensível no contexto. O genitivo τῆς χρείας é compacto e admite mais de uma relação; «conforme a necessidade» preserva essa concisão sem trocar necessidade por mera ocasião.
- source_word: ἵνα δῷ χάριν
  choice: a fim de dar graça
  rationale: A formulação conserva χάρις como «graça» e a ideia de que a fala concede algo aos ouvintes. Embora «benefício» seja possível no contexto, seria uma interpretação mais estreita.
- source_word: τοῖς ἀκούουσιν
  choice: aos que a ouvem
  rationale: O particípio presente designa os que estão ouvindo. O pronome «a» retoma naturalmente a palavra ou fala boa mencionada antes.
theological_decisions:
- issue: Sentido de χάριν numa exortação ética
  choice: graça
  alternative: benefício; favor
  rationale: «Graça» preserva a amplitude do vocabulário paulino e a possibilidade de uma fala que comunique bondade graciosa, sem afirmar que a fala humana confira por si mesma a graça salvadora.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A tradução mantém a metáfora concreta de fala «podre», evita o termo mais eclesiástico «edificação» como substantivo e conserva a ambiguidade semântica de χάρις por meio do texto e da nota.
