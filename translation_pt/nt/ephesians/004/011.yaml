source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἔδωκεν τοὺς μὲν ἀποστόλους, τοὺς δὲ προφήτας, τοὺς δὲ εὐαγγελιστάς, τοὺς δὲ ποιμένας καὶ διδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/011.yaml
  text: And he himself gave some as apostles[a], some as prophets, some as evangelists, and some as shepherds and teachers[b],
translation:
  language: pt
  text: E foi ele mesmo quem deu alguns como apóstolos, outros como profetas, outros como evangelistas e outros como pastores[a] e mestres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra grega traduzida como «pastores» designa literalmente pessoas que cuidam de um rebanho.
    reason: lexical_alternative
  - marker: b
    text: O único artigo grego antes de «pastores e mestres» pode indicar uma relação especialmente estreita entre essas funções, embora a expressão não precise ser entendida como um único cargo.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: E foi ele mesmo quem
  rationale: Mantém a ligação com o contexto anterior e preserva a ênfase do pronome αὐτός no próprio Cristo como aquele que dá.
- source_word: ἔδωκεν
  choice: deu
  rationale: Reproduz diretamente o sentido de δίδωμι sem restringi-lo à ideia interpretativa de nomeação para um cargo.
- source_word: τοὺς μὲν ... τοὺς δὲ
  choice: uns como ... outros como
  rationale: Expressa em português natural a distribuição marcada pela sequência μέν/δέ e deixa claro que as pessoas foram dadas nessas funções.
- source_word: ἀποστόλους
  choice: apóstolos
  rationale: Equivalente corrente e preciso de ἀπόστολοι.
- source_word: προφήτας
  choice: profetas
  rationale: Equivalente direto e consagrado de προφῆται.
- source_word: εὐαγγελιστάς
  choice: evangelistas
  rationale: Termo português estabelecido que corresponde de modo conciso a εὐαγγελισταί.
- source_word: ποιμένας
  choice: pastores
  rationale: Em português, “pastores” preserva tanto a imagem literal de quem cuida de um rebanho quanto seu uso ministerial no contexto, sem exigir uma formulação artificial.
- source_word: διδασκάλους
  choice: mestres
  rationale: Equivalente natural de διδάσκαλοι neste elenco de funções, evitando o sentido mais restrito que “professores” poderia sugerir.
theological_decisions:
- issue: Se ποιμένας deve ser traduzido como metáfora pastoral ou como título eclesiástico
  choice: pastores
  alternative: pastores de rebanho; líderes pastorais
  rationale: “Pastores” é lexicalmente fiel em português e conserva a sobreposição entre a imagem do pastoreio e a função exercida na comunidade. A nota explicita o sentido literal sem impor uma estrutura eclesiástica posterior.
- issue: Se “pastores e mestres” designa uma única função ou dois grupos distintos
  choice: Manter os dois substantivos coordenados, sem decidir a questão
  alternative: pastores-mestres; dois grupos inteiramente separados
  rationale: O único artigo grego antes dos dois substantivos sugere ligação estreita, mas não obriga a tratá-los como um só cargo. A tradução conserva essa tensão e a nota informa a ambiguidade sintática.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “foi ele mesmo quem” transmite naturalmente a ênfase do grego, e a série “uns ... outros” evita a rigidez de uma reprodução literal dos artigos repetidos.
