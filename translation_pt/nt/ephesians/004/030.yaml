source:
  edition: SBLGNT
  text: καὶ μὴ λυπεῖτε τὸ πνεῦμα τὸ ἅγιον τοῦ θεοῦ, ἐν ᾧ ἐσφραγίσθητε εἰς ἡμέραν ἀπολυτρώσεως.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/030.yaml
  text: And do not grieve the Holy Spirit of God[a], in whom you were sealed for the day of redemption.
translation:
  language: pt
  text: E não entristeçam o Espírito Santo de Deus, no qual vocês foram selados para o dia da redenção.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até o dia da redenção”. O grego diz literalmente “para o dia da redenção” (εἰς ἡμέραν ἀπολυτρώσεως), expressão que também pode ser entendida em sentido temporal, voltado para o futuro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπεῖτε
  choice: entristeçam
  rationale: O presente imperativo com μή expressa proibição. “Não entristeçam” é natural em português, conserva a força pessoal e relacional do verbo e evita opções menos precisas, como “não ofendam”.
- source_word: πνεῦμα τὸ ἅγιον τοῦ θεοῦ
  choice: o Espírito Santo de Deus
  rationale: Mantém a expressão grega completa, inclusive o genitivo “de Deus”, e emprega o título consagrado e claro em português.
- source_word: ἐν ᾧ
  choice: em quem
  rationale: Preserva a preposição ἐν e trata o referente pessoalmente. Embora o pronome grego seja neutro por concordar com πνεῦμα, “em quem” comunica melhor a referência ao Espírito Santo do que “no qual”.
- source_word: ἐσφραγίσθητε
  choice: vocês foram selados
  rationale: Reproduz de modo conciso o aoristo passivo e conserva a metáfora do selo sem explicitar indevidamente ideias de posse, autenticação ou proteção.
- source_word: εἰς ἡμέραν ἀπολυτρώσεως
  choice: para o dia da redenção
  rationale: “Para” preserva a orientação para uma finalidade ou destino futuro expressa por εἰς, sem reduzi-la exclusivamente à duração temporal. O contexto permite entender “o dia” como definido, embora o grego não use artigo.
theological_decisions:
- issue: Referência pessoal ao Espírito Santo na oração relativa
  choice: “em quem”
  alternative: “no qual” ou “por quem”
  rationale: “Em quem” preserva tanto a preposição grega quanto a referência pessoal ao Espírito, que pode ser entristecido, sem transformar ἐν explicitamente em agente.
- issue: Relação do selo com o dia da redenção
  choice: “para o dia da redenção”
  alternative: “até o dia da redenção”
  rationale: A formulação mantém a força prospectiva e possivelmente final de εἰς sem impor uma conclusão mais específica sobre duração, perseverança ou mecanismo sacramental.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa. A construção mantém a linguagem bíblica reconhecível sem arcaísmos e conserva a ambiguidade de εἰς em nota.
