source:
  edition: SBLGNT
  text: ὀργίζεσθε καὶ μὴ ἁμαρτάνετε· ὁ ἥλιος μὴ ἐπιδυέτω ⸀ἐπὶ παροργισμῷ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/026.yaml
  text: Be angry[a], and do not sin. Do not let the sun go down on your anger[c][b],
translation:
  language: pt
  text: Fiquem irados[a], mas não pequem. Não deixem que o sol se ponha sobre a ira de vocês[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se ficarem irados, não pequem”. No grego, a forma é literalmente imperativa (“Fiquem irados”), mas alguns a entendem em sentido concessivo neste contexto.'
    reason: alternative_reading
  - marker: b
    text: Paulo provavelmente faz alusão ao Salmo 4:4 (4:5 na Septuaginta), que associa a ira à ordem de não pecar.
    reason: cross_reference
  - marker: c
    text: 'Ou: “sobre a irritação de vocês”, “sobre a provocação de vocês” ou “enquanto continuarem ressentidos”. O termo grego pode indicar ira, exasperação ou aquilo que a provoca.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργίζεσθε
  choice: Fiquem irados
  rationale: Mantém a forma imperativa do grego e a provável alusão ao Salmo 4:4 (LXX 4:5), sem transformar a frase principal em condição. O plural explicita naturalmente o número verbal em português.
- source_word: καὶ μὴ ἁμαρτάνετε
  choice: mas não pequem
  rationale: Preserva a proibição direta. Embora καί normalmente signifique “e”, “mas” comunica em português a relação de contraste ou limitação evidente entre a ira e o não pecar, sem acrescentar conteúdo substancial.
- source_word: ὁ ἥλιος μὴ ἐπιδυέτω
  choice: Não deixem que o sol se ponha
  rationale: Forma portuguesa natural de expressar o imperativo proibitivo de terceira pessoa, conservando a imagem concreta do pôr do sol.
- source_word: ἐπὶ παροργισμῷ ὑμῶν
  choice: sobre a ira de vocês
  rationale: “Ira” é clara, digna e mantém o vínculo lexical e temático com a primeira oração. παροργισμός também pode apontar para irritação, exasperação ou provocação; essa amplitude é registrada em nota.
theological_decisions:
- issue: Se a oração inicial ordena a ira ou funciona como concessão condicional
  choice: 'Mantida como imperativo: “Fiquem irados”.'
  alternative: “Se ficarem irados, não pequem.”
  rationale: 'A forma grega é imperativa. A tradução conserva a tensão do texto: não oferece aprovação irrestrita da ira, pois a proibição de pecar e o limite temporal vêm imediatamente em seguida, mas também não enfraquece o imperativo convertendo-o silenciosamente em condição.'
translation_notes:
  register: Português moderno, digno e acessível, com plural em “vocês” para ampla legibilidade brasileira. “Fiquem irados” é mais corrente do que “irai-vos” e preserva o imperativo. A vírgula final foi mantida por o versículo integrar a frase que prossegue em Efésios 4:27.
