id: EPH.4.24
reference: Ephesians 4:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐνδύσασθαι τὸν καινὸν ἄνθρωπον τὸν κατὰ θεὸν κτισθέντα ἐν δικαιοσύνῃ καὶ ὁσιότητι τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/024.yaml
  text: and to put on the new man[d][c][b][a], created according to God in righteousness and holiness of the truth.
translation:
  language: pt
  text: e a se revestirem do novo homem[a], criado segundo Deus[b] em justiça[c] e santidade da verdade[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nova pessoa” ou “novo ser”. Em grego, literalmente, “novo homem”, em correspondência com a expressão “velho homem” no contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “conforme Deus”; possivelmente, “à semelhança de Deus”.
    reason: lexical_alternative
  - marker: c
    text: Ou “retidão”.
    reason: lexical_alternative
  - marker: d
    text: Ou “em verdadeira justiça e santidade”; também pode indicar justiça e santidade que procedem da verdade.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδύσασθαι
  choice: se revestirem
  rationale: Mantém a metáfora de vestir presente no contexto imediato e expressa adequadamente a forma média do infinitivo, com concordância natural com os destinatários plurais.
- source_word: καινὸν
  choice: novo
  rationale: Preserva a ideia de novidade em natureza ou qualidade sem reduzi-la a mera renovação.
- source_word: ἄνθρωπον
  choice: homem
  rationale: Conserva a expressão antropológica no singular e sua correspondência lexical com o “velho homem” do contexto; alternativas mais interpretativas são registradas em nota.
- source_word: κατὰ θεὸν
  choice: segundo Deus
  rationale: Preserva de modo conciso a construção com κατά e sua possível ideia de conformidade com Deus, sem explicitar como “imagem” aquilo que o texto deixa implícito.
- source_word: κτισθέντα
  choice: criado
  rationale: Mantém a voz passiva, a referência ao “novo homem” e a ressonância da linguagem de criação.
- source_word: δικαιοσύνῃ
  choice: justiça
  rationale: É o equivalente português natural de δικαιοσύνη neste contexto e pode abranger tanto a retidão quanto a justiça; a nuance de “retidão” é indicada em nota.
- source_word: ὁσιότητι
  choice: santidade
  rationale: Expressa naturalmente a qualidade de devoção e conformidade ao que é santo indicada por ὁσιότης.
- source_word: τῆς ἀληθείας
  choice: da verdade
  rationale: Preserva a relação genitiva e a possibilidade de a expressão qualificar tanto “justiça” quanto “santidade”, sem resolver silenciosamente a construção como mero adjetivo.
theological_decisions:
- issue: Expressão antropológica em “novo homem”
  choice: Manter “novo homem”
  alternative: “nova pessoa” ou “novo ser”
  rationale: O grego emprega ἄνθρωπος no singular e o vincula ao motivo contextual do “velho homem”. A formulação escolhida preserva essa ligação e deixa em nota opções mais inclusivas e interpretativas.
- issue: Sentido de κατὰ θεὸν
  choice: “segundo Deus”
  alternative: “à semelhança de Deus” ou “conforme Deus”
  rationale: A tradução mantém a ambiguidade entre conformidade com Deus, correspondência ao seu padrão e semelhança com ele, sem transformar uma implicação possível em afirmação explícita.
- issue: Relação de τῆς ἀληθείας com justiça e santidade
  choice: “justiça e santidade da verdade”
  alternative: “verdadeira justiça e santidade” ou “justiça e santidade que procedem da verdade”
  rationale: A formulação principal conserva o genitivo e sua tensão interpretativa. A nota oferece leituras qualitativa e de origem sem escolher definitivamente entre elas.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. “Se revestirem” conserva a metáfora paulina de vestimenta; “novo homem” e “segundo Deus” mantêm deliberadamente a formulação marcada do original. A expressão final permanece mais formal para não eliminar a ambiguidade do genitivo, esclarecida em nota.
