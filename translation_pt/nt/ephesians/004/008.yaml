id: EPH.4.8
reference: Ephesians 4:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὸ λέγει· Ἀναβὰς εἰς ὕψος ᾐχμαλώτευσεν αἰχμαλωσίαν, ⸀ἔδωκεν δόματα τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/008.yaml
  text: Therefore it says[a], “Having ascended on high[b], he led captivity captive and gave gifts to men.”
translation:
  language: pt
  text: 'Por isso, diz: “Tendo subido ao alto, levou cativo o cativeiro[a] e deu dádivas às pessoas[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “levou cativos consigo” ou “capturou uma multidão de cativos”. O grego emprega uma expressão enfática com palavras da mesma raiz, em eco ao Salmo 68:18.'
    reason: lexical_alternative
  - marker: b
    text: “Pessoas” traduz um termo grego que, neste contexto, se refere genericamente aos seres humanos.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Preserva a força inferencial que liga a citação ao argumento anterior, em português corrente e natural.
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente e não acrescenta um sujeito ausente no grego; no contexto, funciona como fórmula de citação das Escrituras.
- source_word: Ἀναβὰς εἰς ὕψος
  choice: Tendo subido ao alto
  rationale: Conserva a forma participial, a relação temporal com os verbos principais e o eco elevado do salmo.
- source_word: ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: levou cativo o cativeiro
  rationale: Reproduz, tanto quanto o português permite, a enfática construção grega com palavras cognatas e preserva a alusão ao Salmo 68:18 sem definir quem ou o que constitui o cativeiro.
- source_word: ἔδωκεν δόματα
  choice: deu dádivas
  rationale: Traduz diretamente o ato de dar e distingue δόματα, os bens concedidos, da linguagem sobre a graça no contexto próximo.
- source_word: τοῖς ἀνθρώποις
  choice: às pessoas
  rationale: ἄνθρωποι tem aqui sentido humano genérico; “pessoas” comunica isso com clareza no português moderno sem restringir a referência aos homens do sexo masculino.
theological_decisions:
- issue: Identidade do “cativeiro” levado cativo
  choice: 'Manter a expressão aberta: “levou cativo o cativeiro”'
  alternative: “levou consigo uma multidão de cativos” ou “fez prisioneiros”
  rationale: A formulação cognata é densa e alusiva. Mantê-la evita decidir se Paulo se refere a inimigos derrotados, pessoas libertadas ou outra imagem específica.
- issue: Alcance de τοῖς ἀνθρώποις
  choice: Traduzir no sentido genérico como “às pessoas”
  alternative: “aos homens” ou “aos seres humanos”
  rationale: O substantivo grego pode abranger a humanidade em geral, e o contexto não limita as dádivas a pessoas do sexo masculino.
- issue: Sujeito de λέγει
  choice: 'Não explicitar o sujeito: “diz”'
  alternative: “ele diz” ou “a Escritura diz”
  rationale: O texto grego não fornece sujeito expresso. A tradução conserva essa abertura, embora a fórmula introduza uma citação bíblica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção incomum “levou cativo o cativeiro” foi preservada deliberadamente por seu valor retórico e intertextual; as alternativas mais idiomáticas aparecem em nota.
