id: EPH.4.7
reference: Ephesians 4:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἑνὶ δὲ ἑκάστῳ ἡμῶν ἐδόθη ⸀ἡ χάρις κατὰ τὸ μέτρον τῆς δωρεᾶς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/007.yaml
  text: But grace was given to each one of us according to the measure of Messiah’s gift[a].
translation:
  language: pt
  text: Mas a graça foi dada a cada um de nós segundo a medida do dom do Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do dom de Cristo”. O título grego Χριστός significa “Messias”, embora também possa ser traduzido por “Cristo” quando funciona mais como nome.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑνὶ ... ἑκάστῳ ἡμῶν
  choice: a cada um de nós
  rationale: A construção dativa distributiva e enfática destaca a concessão individual dentro da comunidade; “a cada um de nós” preserva essa ênfase com naturalidade em português.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma leve contraposição entre a unidade ressaltada nos versículos anteriores e a diversidade da graça concedida individualmente.
- source_word: ἐδόθη
  choice: foi dada
  rationale: Reproduz naturalmente o aoristo passivo como passado simples e concorda com o substantivo feminino “graça”.
- source_word: ἡ χάρις
  choice: a graça
  rationale: Mantém o vocabulário teológico paulino sem restringir explicitamente o sentido; neste contexto, a graça está ligada à capacitação concedida para o serviço.
- source_word: κατὰ τὸ μέτρον
  choice: segundo a medida
  rationale: Expressa o padrão ou a proporção indicada por κατά com acusativo, em formulação digna e corrente.
- source_word: τῆς δωρεᾶς
  choice: do dom
  rationale: “Dom” comunica uma dádiva concedida gratuitamente e evita a repetição menos elegante de “dádiva” após “foi dada”.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Preserva o conteúdo titular de Χριστός neste contexto, em vez de tratá-lo apenas como forma onomástica tradicional.
theological_decisions:
- issue: Sentido de χάρις no contexto
  choice: Manter “graça”, entendida no contexto como concessão graciosa individualmente distribuída para o serviço na igreja.
  alternative: Explicitar como “capacitação graciosa” ou restringir a “graça salvadora”.
  rationale: Os versículos seguintes tratam de dons e funções ministeriais, mas o texto usa o termo amplo χάρις. A tradução preserva essa amplitude e deixa o contexto orientar seu sentido.
- issue: Valor do genitivo τοῦ Χριστοῦ
  choice: “do dom do Messias”, preservando a possível relação ampla de posse ou procedência.
  alternative: “do dom dado pelo Messias”.
  rationale: O genitivo pode indicar que o dom pertence ao Messias ou procede dele. Não se explicita “dado pelo” para evitar resolver uma relação que o grego deixa sinteticamente aberta.
- issue: Tradução de Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: Neste uso, o valor titular permanece semanticamente relevante; “Messias” comunica o significado do título, enquanto a nota registra a forma tradicional possível.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase permanece próxima do grego sem soar artificial; “segundo a medida” conserva a formulação proporcional e a tensão interpretativa do original.
