source:
  edition: SBLGNT
  text: Τοῦτο οὖν λέγω καὶ μαρτύρομαι ἐν κυρίῳ, μηκέτι ὑμᾶς περιπατεῖν καθὼς καὶ ⸀τὰ ἔθνη περιπατεῖ ἐν ματαιότητι τοῦ νοὸς αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/017.yaml
  text: 'Therefore I say this and testify in the Lord: you must no longer walk as the Gentiles walk[a], in the futility of their minds,'
translation:
  language: pt
  text: 'Portanto, digo isto e dou testemunho no Senhor: vocês não devem mais andar como os gentios andam[a], na futilidade de suas mentes,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as nações”; algumas traduções vertem ἔθνη aqui como “pagãos”.'
    reason: Alternativa lexical para ἔθνη, preservando seus possíveis sentidos no contexto.
lexical_decisions:
- source_word: Τοῦτο οὖν
  choice: Portanto, digo isto
  rationale: οὖν introduz uma conclusão baseada na exortação anterior; “portanto” preserva essa ligação lógica, e Τοῦτο funciona naturalmente como objeto de “digo”.
- source_word: μαρτύρομαι
  choice: testemunho
  rationale: O verbo expressa uma declaração pessoal solene, com força de testemunho, sem precisar ser ampliado para “insisto”.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Mantém a formulação grega e permite tanto a ideia de esfera quanto a de autoridade, sem decidir entre elas.
- source_word: μηκέτι ὑμᾶς περιπατεῖν
  choice: vocês não devem mais andar
  rationale: “Não devem mais” explicita em português a força exortativa do infinitivo, enquanto “andar” conserva a metáfora ética do original.
- source_word: καθὼς καὶ τὰ ἔθνη
  choice: como os gentios
  rationale: Em Paulo, ἔθνη frequentemente designa os não judeus. “Gentios” preserva essa categoria sem acrescentar o juízo religioso mais forte de “pagãos”. O καί é refletido pelo paralelismo da construção, pois um “também” explícito seria pouco natural e potencialmente ambíguo em português.
- source_word: περιπατεῖ
  choice: andam
  rationale: A repetição de “andar” reproduz a repetição do verbo grego e preserva a imagem de conduta ou modo de vida.
- source_word: ἐν ματαιότητι
  choice: na futilidade
  rationale: ματαιότης comunica vazio, falta de propósito ou ineficácia; “futilidade” é uma equivalência direta e corrente.
- source_word: τοῦ νοὸς αὐτῶν
  choice: da mente deles
  rationale: νοῦς refere-se à mente ou faculdade de pensar. “Deles” identifica claramente os gentios como referente e evita a ambiguidade que “sua mente” teria em português.
theological_decisions:
- issue: Sentido de ἔθνη no contraste ético dirigido a uma comunidade majoritariamente gentia
  choice: gentios
  alternative: nações; pagãos
  rationale: “Gentios” conserva a categoria étnica e pactual paulina. O contraste diz respeito ao antigo modo de vida gentio, sem transformar o termo em uma afirmação ontológica sobre todos os não judeus.
- issue: Força do infinitivo περιπατεῖν depois de λέγω καὶ μαρτύρομαι
  choice: vocês não devem mais andar
  alternative: que vocês não andem mais
  rationale: A formulação escolhida torna clara a urgência moral da exortação em português, sem acrescentar uma categoria teológica ausente do texto.
- issue: Sentido de ἐν κυρίῳ
  choice: no Senhor
  alternative: pelo Senhor; diante do Senhor
  rationale: A tradução mantém aberta a possibilidade de a expressão indicar esfera, união ou autoridade, sem resolver uma ambiguidade genuína do grego.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Vocês” evita regionalismo excessivo; “andar” conserva a metáfora ética paulina, e a repetição deliberada espelha o original.
