  text: and to be renewed in the spirit of your mind,[a]
translation:
  language: pt
  text: e serem renovados no espírito da mente de vocês,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, quanto ao dativo, “pelo espírito da mente de vocês”. A expressão provavelmente se refere à disposição ou orientação interior da mente, e não diretamente ao Espírito Santo.
    reason: Leitura alternativa do dativo e possível identificação de πνεῦμα.
lexical_decisions:
- source_word: ἀνανεοῦσθαι
  choice: a serem renovados
  rationale: Preserva o infinitivo presente passivo e sua ligação com a sequência do contexto. A forma passiva evita transformar a renovação em ação meramente reflexiva; o presente pode sugerir um processo contínuo, sem que seja necessário explicitá-lo.
- source_word: δὲ
  choice: e
  rationale: Aqui δέ funciona como conectivo suave dentro de uma sequência, sem exigir contraste forte.
- source_word: τῷ πνεύματι
  choice: no espírito
  rationale: Mantém o dativo como esfera ou aspecto em que ocorre a renovação e conserva a possível ambiguidade de πνεῦμα, sem identificar diretamente o referente como o Espírito Santo.
- source_word: τοῦ νοὸς
  choice: da mente
  rationale: Reproduz de modo direto a construção genitiva. Embora a expressão seja incomum, preserva a formulação densa de Paulo e sua referência à disposição interior ligada à mente.
- source_word: ὑμῶν
  choice: de vocês
  rationale: Expressa claramente, em português corrente e de ampla legibilidade brasileira, o possessivo da segunda pessoa do plural.
theological_decisions:
- issue: Se πνεύματι se refere ao Espírito Santo ou ao espírito/disposição interior humana
  choice: espírito como disposição ou orientação interior da mente
  alternative: Espírito Santo como agente da renovação da mente
  rationale: A construção τοῦ νοὸς ὑμῶν qualifica mais naturalmente πνεύματι, favorecendo uma expressão antropológica. A tradução mantém “espírito” e inclui a alternativa em nota, preservando a ambiguidade sem introduzir no texto principal uma identificação mais explícita do que o grego permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A expressão deliberadamente compacta “espírito da mente” preserva a tensão e a ambiguidade do original; a nota esclarece a principal alternativa sem resolver indevidamente a questão.
