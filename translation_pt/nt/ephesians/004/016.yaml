source:
  edition: SBLGNT
  text: ἐξ οὗ πᾶν τὸ σῶμα συναρμολογούμενον καὶ συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/016.yaml
  text: from whom the whole body[a], being joined together and held together through every supporting joint, according to the working in measure of each individual part[d][c][b], causes the growth of the body for building itself up in love.
translation:
  language: pt
  text: Dele, todo o corpo, bem ajustado e unido por meio de cada junta que lhe dá suporte, segundo a atividade na medida de cada parte, promove o crescimento do próprio corpo para a edificação de si mesmo em amor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por “cada junta que lhe dá suporte” também pode ser entendida como “cada ligação que fornece o necessário” ou “cada ligamento de sustentação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ οὗ
  choice: dele
  rationale: O antecedente imediato é Cristo no versículo 15; a forma pessoal preserva Cristo como fonte, e não uma origem impessoal.
- source_word: πᾶν τὸ σῶμα
  choice: todo o corpo
  rationale: Expressão natural em português para o coletivo singular, preservando a totalidade.
- source_word: συναρμολογούμενον καὶ συμβιβαζόμενον
  choice: bem ajustado e unido
  rationale: Conserva as ideias complementares de encaixe e coesão, com forma participial natural em português.
- source_word: διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας
  choice: por meio de cada junta que lhe dá suporte
  rationale: Mantém a imagem corporal de ἁφή e expressa o fornecimento ou apoio indicado por ἐπιχορηγία sem restringir indevidamente a imagem a ligamentos.
- source_word: κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους
  choice: segundo a atividade na medida de cada parte
  rationale: Preserva a relação entre a atuação e a medida correspondente a cada parte, sem acrescentar o qualificativo interpretativo 'adequada'.
- source_word: τὴν αὔξησιν τοῦ σώματος ποιεῖται
  choice: promove o crescimento do próprio corpo
  rationale: Expressa de modo idiomático que o corpo, ligado a Cristo e mediante a atuação de suas partes, produz seu crescimento; 'próprio' também torna clara a relação reflexiva com a edificação subsequente.
- source_word: εἰς οἰκοδομὴν ἑαυτοῦ
  choice: para que ele se edifique
  rationale: Reproduz a metáfora de edificação e a força reflexiva de ἑαυτοῦ em linguagem portuguesa corrente.
- source_word: ἐν ἀγάπῃ
  choice: em amor
  rationale: Tradução direta e natural, coerente com o vocabulário paulino no contexto.
theological_decisions:
- issue: Agência e fonte do crescimento do corpo
  choice: Cristo é apresentado como a fonte ('dele'), enquanto o corpo promove seu crescimento mediante a atividade de cada parte.
  alternative: Ler ἐξ οὗ impessoalmente como 'do qual' ou atribuir o crescimento exclusivamente a Cristo sem preservar a atuação das partes.
  rationale: O antecedente contextual é Cristo, mas a sintaxe faz de 'todo o corpo' o sujeito de ποιεῖται. A tradução mantém em tensão a origem em Cristo e a participação coordenada de cada parte.
- issue: Sentido da imagem corporal em διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας
  choice: Manter a imagem concreta com 'cada junta que lhe dá suporte'.
  alternative: Traduzir por 'cada ligamento de sustentação' ou pela expressão abstrata 'cada conexão que fornece'.
  rationale: O grego admite alguma amplitude entre ponto de contato, junta e ligação, junto com a ideia de provisão ou apoio. A formulação escolhida conserva a metáfora sem impor anatomia excessivamente precisa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi mantida próxima à progressão do grego, mas com sintaxe natural. Evitou-se 'funcionamento adequado' porque 'adequado' explicitaria uma inferência de ἐν μέτρῳ; 'atividade na medida de cada parte' preserva melhor a formulação e sua possível tensão.
