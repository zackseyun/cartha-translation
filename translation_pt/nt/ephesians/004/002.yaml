  text: com toda humildade e mansidão, com paciência, suportando uns aos outros em amor,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πάσης
  choice: com toda
  rationale: μετά com o genitivo indica acompanhamento, e πάσης intensifica de modo abrangente; “com toda” é natural em português e preserva essa força.
- source_word: ταπεινοφροσύνης
  choice: humildade
  rationale: O substantivo designa humildade ou modéstia de mente; “humildade” é claro, atual e adequado ao sentido ético.
- source_word: πραΰτητος
  choice: mansidão
  rationale: O termo expressa brandura e força sob controle. “Mansidão” preserva o vocabulário ético do texto sem sugerir fraqueza necessariamente.
- source_word: μακροθυμίας
  choice: paciência
  rationale: Refere-se à disposição persistente de suportar pessoas e à demora em irar-se; “paciência” é a formulação moderna mais natural.
- source_word: ἀνεχόμενοι
  choice: suportando
  rationale: O particípio presente comunica ação contínua de tolerar e sustentar-se mutuamente; “suportando” mantém tanto o aspecto durativo quanto o sentido relacional.
- source_word: ἀλλήλων
  choice: uns aos outros
  rationale: É a expressão recíproca corrente em português e representa diretamente o pronome grego.
- source_word: ἐν ἀγάπῃ
  choice: em amor
  rationale: A construção pode indicar esfera ou modo. “Em amor” conserva a forma concisa e a possível amplitude da relação sintática.
theological_decisions:
- issue: Tradução de ἀγάπη
  choice: amor
  alternative: caridade
  rationale: “Amor” é o equivalente atual e abrangente; “caridade” pode soar restrita à assistência material ou marcada por tradição específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura participial e a pontuação final foram mantidas porque o versículo integra a frase iniciada no contexto anterior e continuada no seguinte.
