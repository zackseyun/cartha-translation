id: EPH.4.32
reference: Ephesians 4:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀γίνεσθε εἰς ἀλλήλους χρηστοί, εὔσπλαγχνοι, χαριζόμενοι ἑαυτοῖς καθὼς καὶ ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/032.yaml
  text: And be kind to one another[a], tenderhearted, forgiving one another[b], just as God in Messiah forgave you.
translation:
  language: pt
  text: Sejam bondosos uns com os outros e compassivos, perdoando uns aos outros, assim como Deus também perdoou vocês no Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em Cristo”.'
    reason: Tradução tradicional do título grego Χριστός.
lexical_decisions:
- source_word: γίνεσθε
  choice: Sejam
  rationale: O presente imperativo plural introduz uma exortação contínua. “Sejam” é natural em português e preserva a força imperativa sem sugerir necessariamente uma mudança de estado, como faria “tornem-se”.
- source_word: εἰς ἀλλήλους
  choice: uns com os outros
  rationale: Expressa orientação relacional e reciprocidade. Esta formulação é idiomática em português moderno.
- source_word: χρηστοί
  choice: bondosos
  rationale: No contexto de conduta interpessoal, comunica disposição ativa para fazer o bem. Também mantém distinção semântica em relação a “compassivos”.
- source_word: εὔσπλαγχνοι
  choice: compassivos
  rationale: O termo indica compaixão profunda e sincera. “Compassivos” é claro, digno e corrente em português.
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: perdoando uns aos outros
  rationale: Neste contexto, χαρίζομαι denota conceder perdão, como confirma a comparação com a ação de Deus. O reflexivo plural ἑαυτοῖς tem sentido recíproco.
- source_word: καθὼς καὶ
  choice: assim como ... também
  rationale: “Assim como” introduz a comparação, e “também” representa καί, preservando a correspondência enfática entre o perdão mútuo e o perdão concedido por Deus.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Χριστός funciona como título e, por isso, é traduzido por “Messias”. “No” preserva de modo conciso a construção com ἐν e evita definir de forma excessiva se a expressão indica esfera, união ou mediação.
- source_word: ἐχαρίσατο ὑμῖν
  choice: perdoou vocês
  rationale: O aoristo refere-se ao ato de Deus de conceder perdão. “Perdoou vocês” é direto, natural e preserva o objeto plural.
theological_decisions:
- issue: Tradução de Χριστῷ
  choice: Messias
  alternative: Cristo
  rationale: O termo grego mantém aqui valor titular. “Messias” traduz o título, enquanto “Cristo”, forma tradicional, é registrado em nota.
- issue: Sentido de ἐν Χριστῷ
  choice: no Messias
  alternative: por meio do Messias
  rationale: A tradução mantém a preposição ἐν sem reduzir a expressão apenas a instrumentalidade. O grego pode envolver esfera, união ou mediação, e essa tensão não deve ser resolvida silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação “bondosos ... e compassivos” evita uma sequência adjetival rígida. O pronome “vocês” comunica naturalmente a segunda pessoa do plural em português brasileiro e permanece amplamente compreensível em contexto internacional.
