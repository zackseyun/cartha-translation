  text: ἓν σῶμα καὶ ἓν πνεῦμα, καθὼς καὶ ἐκλήθητε ἐν μιᾷ ἐλπίδι τῆς κλήσεως ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/004.yaml
  text: There is one body and one Spirit[a], just as you also were called in one hope of your calling.
translation:
  language: pt
  text: Há um só corpo e um só Espírito[a], assim como também vocês foram chamados em uma só esperança da vocação de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um só espírito». A palavra grega pode significar «espírito» ou «Espírito»; neste contexto, provavelmente se refere ao Espírito Santo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν / μιᾷ
  choice: um só / uma só
  rationale: A repetição enfatiza a unidade. Em português, «um só» e «uma só» exprimem esse valor com naturalidade e clareza.
- source_word: σῶμα
  choice: corpo
  rationale: Preserva a metáfora corporativa sem explicitar no texto quem compõe o corpo.
- source_word: πνεῦμα
  choice: Espírito
  rationale: No contexto da fórmula de unidade de Efésios 4:4–6, a referência mais provável é ao Espírito Santo. Como o grego antigo não distingue maiúsculas e minúsculas nesse uso, registra-se a alternativa em nota.
- source_word: καθὼς καὶ
  choice: assim como também
  rationale: Mantém tanto a relação comparativa de καθώς quanto a força inclusiva de καί aplicada aos destinatários.
- source_word: ἐκλήθητε
  choice: vocês foram chamados
  rationale: Conserva a voz passiva e não explicita o agente divino, que permanece implícito no grego.
- source_word: ἐν μιᾷ ἐλπίδι
  choice: em uma só esperança
  rationale: Mantém a preposição ἐν e integra a expressão ao motivo reiterado da unidade.
- source_word: τῆς κλήσεως ὑμῶν
  choice: a esperança da vocação de vocês
  rationale: A retomada de «a esperança» torna clara em português a relação genitiva, evitando a formulação pouco natural «em uma só esperança da vocação de vocês», e preserva a ligação lexical entre «foram chamados» e «vocação».
theological_decisions:
- issue: Referente de πνεῦμα
  choice: Espírito Santo, indicado pela inicial maiúscula
  alternative: espírito, como realidade espiritual ou disposição compartilhada entre os fiéis
  rationale: A sequência «um só corpo... um só Espírito... um só Senhor... um só Deus e Pai» favorece fortemente a referência ao Espírito Santo. A nota preserva a ambiguidade formal do vocábulo grego.
- issue: Sentido de κλῆσις
  choice: vocação
  alternative: chamado
  rationale: «Vocação» mantém em português a distinção substantiva e a ligação semântica com «foram chamados», sem acrescentar conteúdo denominacional. «Chamado» seria igualmente possível, mas pode soar mais repetitivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para leitura natural no Brasil e inteligibilidade internacional. A repetição «um só/uma só» preserva a ênfase retórica na unidade.
