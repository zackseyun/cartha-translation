id: EPH.4.31
reference: Ephesians 4:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πᾶσα πικρία καὶ θυμὸς καὶ ὀργὴ καὶ κραυγὴ καὶ βλασφημία ἀρθήτω ἀφ’ ὑμῶν σὺν πάσῃ κακίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/031.yaml
  text: Let all bitterness and wrath and anger and clamor and slander be taken away from you[a], along with all malice.
translation:
  language: pt
  text: Que toda amargura, fúria, ira, gritaria e difamação[a] sejam eliminadas do meio de vocês, junto com toda malícia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fala abusiva”; tradicionalmente, “blasfêmia”. Neste contexto, o termo grego provavelmente se refere a palavras prejudiciais contra outras pessoas.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα πικρία
  choice: toda amargura
  rationale: Preserva a abrangência de πᾶσα e traduz πικρία pela atitude interior persistente de ressentimento áspero.
- source_word: θυμός
  choice: fúria
  rationale: Expressa uma paixão intensa e explosiva, mantendo distinção natural em relação a ὀργή.
- source_word: ὀργή
  choice: ira
  rationale: Mantém o sentido de indignação ou raiva e permite distingui-lo de θυμός sem ampliar indevidamente o termo.
- source_word: κραυγή
  choice: gritaria
  rationale: No contexto da lista de vícios, refere-se a manifestações verbais altas e hostis; 'gritaria' é corrente e clara em português.
- source_word: βλασφημία
  choice: difamação
  rationale: Neste contexto de relações interpessoais, indica fala que prejudica ou denigre outras pessoas; 'difamação' comunica esse sentido sem restringi-lo à ofensa contra Deus.
- source_word: ἀρθήτω ἀφ’ ὑμῶν
  choice: sejam eliminados do meio de vocês
  rationale: Conserva a força passiva do imperativo e torna explícita, de modo idiomático, a remoção desses vícios da vida da comunidade.
- source_word: σὺν πάσῃ κακίᾳ
  choice: junto com toda maldade
  rationale: Preserva a ideia acompanhante de σύν e a abrangência de πάσῃ. 'Maldade' mantém a extensão possível de κακία, incluindo malícia e má intenção.
theological_decisions:
- issue: Sentido de βλασφημία na lista ética
  choice: difamação interpessoal
  alternative: fala abusiva; blasfêmia
  rationale: Os termos ao redor tratam de atitudes e falas destrutivas nas relações humanas. A tradução principal segue esse contexto, enquanto a nota preserva a amplitude lexical e a forma tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração conserva o ritmo da lista grega, e a construção passiva mantém a forma da exortação.
