  naturalness: O emprego de dois-pontos é possível, mas a vírgula reproduz mais naturalmente a progressão do grego e evita apresentar a oração infinitiva como uma explicação excessivamente demarcada. A pontuação em torno dos travessões também deve evitar a combinação pouco fluida «—, nele».
  terminology: «Administração», «plenitude dos tempos», «Messias», «céus», «terra» e «nele» são escolhas adequadas para português moderno e conservam os termos e as relações relevantes do original. A nota deve formular a alternativa de «cabeça» de maneira idiomática e sem alterar o referente cristológico.
