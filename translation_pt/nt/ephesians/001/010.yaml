  text: εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν, ἀνακεφαλαιώσασθαι τὰ πάντα ἐν τῷ Χριστῷ, τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς· ἐν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/010.yaml
  text: for the administration of the fullness of the times[a], to sum up all things in the Messiah—the things in the heavens and the things on the earth—in him,
translation:
  language: pt
  text: para a administração da plenitude dos tempos, reunir todas as coisas no Messias[a] — as que estão nos céus e as que estão na terra — nele,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “recapitular todas as coisas no Messias” ou “reunir todas as coisas sob uma só cabeça, em Cristo”. O verbo grego pode transmitir a ideia de resumir, unificar ou reunir sob uma cabeça.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκονομίαν
  choice: administração
  rationale: Preserva a ideia de gestão ou ordenação do propósito divino sem reduzir o termo a mero “plano”.
- source_word: πληρώματος τῶν καιρῶν
  choice: plenitude dos tempos
  rationale: Mantém a expressão densa do grego e o sentido de tempos determinados que chegam à sua medida plena.
- source_word: ἀνακεφαλαιώσασθαι
  choice: reunir
  rationale: Em português corrente, “reunir” comunica naturalmente a convergência de todas as coisas no Messias; a possível nuance de recapitulação ou subordinação a uma cabeça é preservada em nota.
- source_word: τὰ πάντα
  choice: todas as coisas
  rationale: Reproduz o alcance abrangente do neutro plural substantivado no contexto cósmico.
- source_word: ἐν τῷ Χριστῷ
  choice: no Messias
  rationale: Χριστός funciona aqui como título, e “Messias” torna explícito esse valor.
- source_word: τὰ ἐπὶ τοῖς οὐρανοῖς
  choice: as que estão nos céus
  rationale: Preserva o plural grego e expressa de modo natural a localização no âmbito celestial.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: as que estão na terra
  rationale: Mantém o contraste locativo com os céus em português natural.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Conserva a repetição enfática do grego e sua referência mais natural ao Messias.
theological_decisions:
- issue: Sentido de ἀνακεφαλαιώσασθαι
  choice: reunir todas as coisas no Messias
  alternative: recapitular todas as coisas no Messias; reunir todas as coisas sob uma só cabeça, o Messias
  rationale: O verbo pode exprimir síntese, unificação ou reunião sob uma cabeça. O texto principal usa uma formulação clara sem eliminar as demais nuances, que são registradas na nota.
- issue: Tradução de Χριστῷ
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, o termo conserva claramente seu valor titular; “Messias” comunica esse sentido sem importar uma leitura denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O dois-pontos explicita que a reunião de todas as coisas descreve o propósito ou conteúdo dessa administração, sem resolver em excesso a relação sintática.
