lexical_decisions:
- source_word: ἧς
  choice: que
  rationale: Pronome relativo no genitivo feminino singular, retomando a graça mencionada no versículo 7. Em português, «que» liga a oração de modo natural; a relação semântica com a graça é preservada pelo verbo e pelo contexto.
- source_word: ἐπερίσσευσεν
  choice: derramou abundantemente
  rationale: 'O aoristo ativo de περισσεύω tem aqui sentido causativo/transitivo: Deus fez sua graça transbordar em direção aos destinatários. «Derramou abundantemente» comunica generosidade transbordante em português corrente e combina naturalmente com «sobre nós».'
- source_word: εἰς ἡμᾶς
  choice: sobre nós
  rationale: εἰς indica a direção da abundância para os destinatários. «Sobre nós» é idiomático com «derramou» e mantém a imagem de uma graça concedida abundantemente.
- source_word: ἐν
  choice: em
  rationale: Mantém a forma grega e deixa aberta a possibilidade de valor modal, instrumental ou esférico, sem decidir se a sabedoria caracteriza o ato de Deus ou aquilo que acompanha a graça concedida.
- source_word: πάσῃ
  choice: toda
  rationale: Com substantivos abstratos no singular, πᾶς expressa abrangência ou plenitude. «Toda sabedoria e discernimento» é claro e natural.
- source_word: σοφίᾳ
  choice: sabedoria
  rationale: Equivalente padrão e transparente de σοφία, adequado ao uso paulino.
- source_word: φρονήσει
  choice: discernimento
  rationale: φρόνησις pode indicar entendimento prático, inteligência ou prudência. «Discernimento» distingue o termo de «sabedoria» e soa atual e digno em português.
theological_decisions:
- issue: Relação de «em toda sabedoria e discernimento» com o restante da frase
  choice: A formulação permanece sintaticamente aberta, sem atribuir explicitamente a sabedoria e o discernimento nem ao modo como Deus derramou sua graça nem ao que foi concedido aos crentes.
  alternative: Entender a expressão como descrição da sabedoria e do discernimento de Deus ao conceder a graça, ou como sabedoria e discernimento associados ao dom recebido pelos crentes.
  rationale: A construção grega admite as duas relações. Preservar essa ambiguidade evita impor uma resolução teológica que o texto não torna explícita.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O tom é digno e corrente. «Derramou abundantemente» evita tanto uma formulação excessivamente literal quanto uma expressão coloquial, preservando a imagem de superabundância.
