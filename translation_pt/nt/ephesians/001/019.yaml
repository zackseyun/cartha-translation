id: EPH.1.19
reference: Ephesians 1:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τί τὸ ὑπερβάλλον μέγεθος τῆς δυνάμεως αὐτοῦ εἰς ἡμᾶς τοὺς πιστεύοντας κατὰ τὴν ἐνέργειαν τοῦ κράτους τῆς ἰσχύος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/019.yaml
  text: and what is the surpassing greatness of his power toward us who believe[a], according to the working of the might of his strength
translation:
  language: pt
  text: e qual é a grandeza extraordinária do seu poder para nós que cremos,[a] segundo a atuação da força do seu vigor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em nós que cremos”. O grego diz “para nós”, mas algumas traduções interpretam a expressão como referência ao poder de Deus atuando dentro dos que creem.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερβάλλον
  choice: incomparável
  rationale: Expressa aquilo que excede ou ultrapassa, sem intensificar até a ideia mais absoluta de algo 'imensurável'.
- source_word: μέγεθος
  choice: grandeza
  rationale: Equivalente natural e digno para o substantivo abstrato, formando a expressão 'grandeza incomparável'.
- source_word: δύναμις
  choice: poder
  rationale: Termo corrente no uso paulino para capacidade eficaz e primeiro elemento da acumulação de palavras relacionadas à força.
- source_word: εἰς ἡμᾶς
  choice: para conosco
  rationale: Preserva a orientação do poder de Deus em relação aos crentes sem especificar indevidamente que se trata apenas de atuação interior ou apenas de benefício externo.
- source_word: τοὺς πιστεύοντας
  choice: os que cremos
  rationale: O particípio substantivado é vertido verbalmente e, em concordância com 'nós', mantém a inclusão do autor e dos destinatários.
- source_word: κατά
  choice: segundo
  rationale: 'Indica correspondência ou medida: o poder dirigido aos crentes está de acordo com a atuação divina descrita a seguir.'
- source_word: ἐνέργεια
  choice: atuação
  rationale: Comunica atividade operante e eficaz sem as associações modernas potencialmente enganosas de 'energia'.
- source_word: κράτος
  choice: força
  rationale: Representa força manifestada ou poderosa e permanece distinto de δύναμις e ἰσχύς.
- source_word: ἰσχύς
  choice: vigor
  rationale: Denota força inerente ou capacidade robusta; 'vigor' permite conservar a acumulação retórica sem repetir 'força'.
- source_word: καὶ τί
  choice: e qual é
  rationale: Retoma com clareza a oração iniciada nos versículos anteriores, suprindo naturalmente em português a cópula implícita.
theological_decisions:
- issue: Acumulação δύναμις / ἐνέργεια / κράτος / ἰσχύς
  choice: 'Conservar termos distintos e relacionados: ''poder ... atuação ... força ... vigor''.'
  alternative: Reduzir a sequência a menos sinônimos ou traduzi-la dinamicamente como 'a plena força do seu poder'.
  rationale: A sequência retórica enfatiza a magnitude e a eficácia do poder de Deus; mantê-la evita apagar a ênfase ou impor distinções teológicas técnicas.
- issue: Direção do poder divino em εἰς ἡμᾶς
  choice: '''para conosco, os que cremos'''
  alternative: '''em nós, os que cremos'' ou ''a favor de nós, os que cremos'''
  rationale: A preposição εἰς indica direção ou referência, não é ἐν. A formulação escolhida preserva essa abertura sem decidir se a ênfase recai exclusivamente na operação interior ou no benefício concedido aos crentes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva a continuidade sintática com os versículos anteriores e a densa acumulação retórica de termos ligados ao poder.
