source:
  edition: SBLGNT
  text: γνωρίσας ἡμῖν τὸ μυστήριον τοῦ θελήματος αὐτοῦ, κατὰ τὴν εὐδοκίαν αὐτοῦ ἣν προέθετο ἐν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/009.yaml
  text: having made known to us the mystery of his will[a], according to his good pleasure, which he purposed in himself
translation:
  language: pt
  text: tendo-nos dado a conhecer o mistério da sua vontade, conforme a sua boa vontade, que propôs nele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em Cristo”. Outros entendem “nele” em sentido reflexivo, como “em si mesmo”.'
    reason: Preserva a ambiguidade interpretativa do referente de ἐν αὐτῷ sem resolvê-la no texto principal.
lexical_decisions:
- source_word: γνωρίσας
  choice: dando-nos a conhecer
  rationale: O particípio aoristo ativo modifica o sujeito implícito da frase maior. A construção preserva o valor participial e soa natural em português, sem acrescentar a ideia mais interpretativa de “revelar”.
- source_word: ἡμῖν
  choice: nos
  rationale: 'O dativo funciona como objeto indireto: Deus dá o mistério a conhecer a nós.'
- source_word: μυστήριον
  choice: mistério
  rationale: No uso paulino, designa um propósito divino antes oculto e agora dado a conhecer; “mistério” preserva essa nuance estabelecida melhor que “segredo”.
- source_word: θελήματος
  choice: vontade
  rationale: É a correspondência direta neste contexto e mantém a distinção entre a vontade de Deus e o ato de estabelecê-la expresso mais adiante.
- source_word: κατὰ
  choice: conforme
  rationale: Com o acusativo, indica conformidade ou norma; “conforme” é exato e idiomático.
- source_word: εὐδοκίαν
  choice: bom propósito
  rationale: A expressão comunica a intenção favorável e deliberada de Deus em linguagem atual. Evita o registro pouco corrente de “beneplácito”, embora seja um pouco mais explicativa.
- source_word: προέθετο
  choice: havia estabelecido
  rationale: O aoristo médio exprime aquilo que Deus determinou ou propôs. “Havia estabelecido” é natural e evita a repetição de “propósito/propôs”.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Reproduz o pronome grego sem decidir no texto principal se o referente é Cristo ou se a expressão deve ser entendida reflexivamente em relação a Deus.
theological_decisions:
- issue: Referente de ἐν αὐτῷ
  choice: O texto principal mantém o pronome literal “nele”.
  alternative: “em Cristo” ou, em sentido reflexivo, “em si mesmo”
  rationale: O contexto favorece para muitos intérpretes uma referência a Cristo, enquanto outros entendem a expressão reflexivamente a respeito de Deus. A tradução conserva a tensão e registra as interpretações na nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira ampla. “Dando-nos a conhecer” conserva a estrutura participial; “bom propósito” privilegia compreensão corrente, enquanto a nota preserva a ambiguidade teológica do pronome final.
