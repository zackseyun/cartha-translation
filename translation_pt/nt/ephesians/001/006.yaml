id: EPH.1.6
reference: Ephesians 1:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰς ἔπαινον δόξης τῆς χάριτος αὐτοῦ ⸀ἧς ἐχαρίτωσεν ἡμᾶς ἐν τῷ ἠγαπημένῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/006.yaml
  text: to the praise of the glory of his grace[a], with which he has favored us in the Beloved[b],
translation:
  language: pt
  text: para o louvor da glória da sua graça, com a qual nos agraciou[a] no Amado[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com a qual nos favoreceu”. O verbo grego é da mesma família da palavra traduzida como “graça” e indica que Deus agiu graciosamente para conosco.
    reason: lexical_alternative
  - marker: b
    text: “O Amado” se refere ao Filho, isto é, ao Messias.
    reason: cross_reference
lexical_decisions:
- source_word: εἰς ἔπαινον
  choice: para o louvor
  rationale: A preposição εἰς indica propósito ou resultado nesta expressão; “para o louvor” é natural em português e mantém o caráter doxológico.
- source_word: δόξης
  choice: da glória
  rationale: “Glória” é o equivalente corrente de δόξα neste contexto paulino e preserva sua força teológica.
- source_word: τῆς χάριτος αὐτοῦ
  choice: da sua graça
  rationale: “Graça” comunica o favor divino salvador e permite conservar a ligação lexical com o verbo cognato χαριτόω.
- source_word: ἧς ἐχαρίτωσεν ἡμᾶς
  choice: com a qual nos agraciou
  rationale: A formulação mantém a referência à graça e reproduz, por meio de “graça/agraciou”, a relação entre χάρις e χαριτόω, sem tornar a frase excessivamente artificial.
- source_word: ἐν
  choice: 'no'
  rationale: Mantém o sentido básico de ἐν e deixa aberta a riqueza da ideia paulina de esfera ou união, sem explicá-la dentro do texto.
- source_word: τῷ ἠγαπημένῳ
  choice: Amado
  rationale: O particípio passivo substantivado funciona como título de Cristo. “Amado” preserva essa forma sem acrescentar “Filho”, palavra que não aparece explicitamente no versículo.
theological_decisions:
- issue: Relação entre χάρις e χαριτόω
  choice: graça, com a qual nos agraciou
  alternative: graça, pela qual nos favoreceu
  rationale: “Agraciou” conserva a ligação verbal intencional com “graça”. A alternativa é mais coloquial, mas enfraquece essa correspondência lexical.
- issue: Força cristológica de τῷ ἠγαπημένῳ
  choice: no Amado
  alternative: no seu Filho amado
  rationale: A expressão se refere a Cristo, mas o grego emprega um título substantivado e não explicita “Filho”. A tradução evita acrescentar essa identificação ao texto principal.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A construção “graça… agraciou” é deliberada para refletir a relação lexical grega; “no Amado” preserva tanto a concisão quanto a possível dimensão de união ou esfera expressa por ἐν.
