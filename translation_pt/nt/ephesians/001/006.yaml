  source_fidelity: O texto reproduz adequadamente εἰς ἔπαινον δόξης τῆς χάριτος αὐτοῦ como “para o louvor da glória da sua graça”. “Com a qual nos agraciou” comunica de modo fiel a ação expressa por ἐχαρίτωσεν e preserva a relação lexical deliberada com χάρις. “No Amado” mantém a formulação titular substantivada de τῷ ἠγαπημένῳ e o valor básico, sem expansão interpretativa, de ἐν.
  naturalness: A redação é clara, solene e natural em português contemporâneo de ampla legibilidade. A aproximação “graça ... agraciou” é um leve realce estilístico, mas é plenamente aceitável e justificável por refletir o cognato grego.
  terminology: “Glória”, “graça” e “Amado” são termos adequados e consistentes para o contexto. A nota a explica corretamente a relação entre χάρις e χαριτόω; a nota b identifica o referente de “O Amado” sem introduzir essa identificação no texto traduzido.
