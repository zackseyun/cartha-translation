  text: ἐν ᾧ καὶ ὑμεῖς ἀκούσαντες τὸν λόγον τῆς ἀληθείας, τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν, ἐν ᾧ καὶ πιστεύσαντες ἐσφραγίσθητε τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/013.yaml
  text: In him[a], you also, after hearing the word of truth, the good news of your salvation, in him, and after believing, were sealed with the Holy Spirit of promise[d][c][b],
translation:
  language: pt
  text: Nele[a], vocês também, depois de ouvirem a palavra da verdade — as boas-novas da salvação de vocês[b] — e, depois de crerem nele[d], foram selados com o Espírito Santo prometido[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em quem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o evangelho da salvação de vocês”.'
    reason: lexical_alternative
  - marker: c
    text: 'Mais literalmente: “o Espírito Santo da promessa”.'
    reason: alternative_reading
  - marker: d
    text: 'Ou, preservando mais de perto a ordem grega: “e, nele, depois de crerem”.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nele
  rationale: O pronome relativo retoma Cristo no contexto anterior. “Nele” é natural em português e conserva o sentido paulino de união com Cristo; a alternativa mais formal é registrada em nota.
- source_word: καὶ ὑμεῖς
  choice: também vocês
  rationale: Mantém a ênfase inclusiva e aditiva, em contraste com o “nós” dos versículos anteriores.
- source_word: ἀκούσαντες
  choice: depois de ouvirem
  rationale: Expressa a relação normalmente antecedente do particípio aoristo com o verbo principal, sem transformar a sequência em uma formulação doutrinária técnica.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: a palavra da verdade
  rationale: Preserva a expressão paulina e a força lexical de λόγος, permanecendo compreensível em português atual.
- source_word: τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν
  choice: as boas-novas da salvação de vocês
  rationale: “Boas-novas” comunica de modo transparente o sentido de εὐαγγέλιον; os travessões indicam que a expressão explica “a palavra da verdade”.
- source_word: πιστεύσαντες
  choice: depois de crerem
  rationale: Conserva o provável valor antecedente do particípio aoristo, sem especificar além do texto a relação temporal exata entre fé e selamento.
- source_word: ἐσφραγίσθητε
  choice: foram selados
  rationale: Mantém a voz passiva e a imagem de selo, com seus sentidos de pertencimento, autenticação e proteção.
- source_word: τῷ πνεύματι
  choice: com o Espírito
  rationale: “Com” preserva naturalmente a imagem do selo sem decidir de maneira rígida entre os possíveis valores instrumental e associativo do dativo.
- source_word: τῆς ἐπαγγελίας τῷ ἁγίῳ
  choice: Santo prometido
  rationale: Reorganiza a expressão grega comprimida em português natural, entendendo o genitivo como referência ao Espírito que foi prometido; a forma mais literal permanece em nota.
theological_decisions:
- issue: Relação entre ouvir, crer e ser selado
  choice: “depois de ouvirem” e “depois de crerem”
  alternative: “quando ouviram” e “quando creram”
  rationale: Os particípios aoristos anteriores ao verbo finito favorecem uma relação antecedente, mas a tradução não pretende definir um intervalo temporal nem impor uma ordem da salvação denominacional.
- issue: Relação do segundo ἐν ᾧ com πιστεύσαντες
  choice: “e, nele, depois de crerem”
  alternative: “e, depois de crerem nele”
  rationale: A formulação principal conserva a repetição locativa e o tema de estar em Cristo, ao mesmo tempo que permite sua associação com o ato de crer; a alternativa idiomática é fornecida em nota.
- issue: Sentido de “Espírito da promessa”
  choice: “Espírito Santo prometido”
  alternative: “Espírito Santo da promessa”
  rationale: O grego admite uma relação genitiva compacta. A tradução principal explicita a leitura mais natural — o Espírito prometido por Deus — sem adotar a interpretação mais específica de que o Espírito garante a promessa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo; “boas-novas” torna εὐαγγέλιον transparente, enquanto “evangelho” é preservado em nota. Os travessões esclarecem a aposição sem simplificar a estrutura teológica do período.
