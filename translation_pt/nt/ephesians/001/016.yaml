lexical_decisions:
- source_word: οὐ παύομαι
  choice: não deixo de
  rationale: Expressa a ação contínua de não cessar, com formulação natural e digna em português.
- source_word: εὐχαριστῶν
  choice: dar graças
  rationale: Preserva o sentido explícito de agradecimento dirigido a Deus e a relação contemporânea do particípio com o verbo principal.
- source_word: ὑπὲρ ὑμῶν
  choice: por vocês
  rationale: Neste contexto de ação de graças, indica as pessoas pelas quais Paulo agradece; a forma é clara e amplamente compreensível.
- source_word: μνείαν ποιούμενος
  choice: mencionando-os
  rationale: Representa de perto o idioma grego, literalmente 'fazendo menção', e explicita o objeto indicado pelo contexto.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: em minhas orações
  rationale: Comunica de modo idiomático a ocasião ou esfera em que Paulo faz menção deles.
