revisions:
- from: a fim de que nós, que já antes tínhamos depositado nossa esperança no Messias, existíssemos para o louvor da sua glória.[a]
  to: a fim de que nós que já havíamos esperado no Messias fôssemos para o louvor da sua glória.[a]
  rationale: A revisão substitui o imperfeito não motivado «existíssemos» por «fôssemos», que expressa naturalmente a finalidade da construção grega, e elimina a redundância de «já antes». O mais-que-perfeito «havíamos esperado» conserva a anterioridade e a relevância do perfeito grego, sem determinar que «nós» seja necessariamente o primeiro grupo histórico. A alternativa interpretativamente mais específica é preservada na nota.
