review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a finalidade de εἰς τὸ εἶναι, a fórmula «para o louvor da sua glória» e «Messias» para Χριστός. Contudo, «existíssemos» introduz um imperfeito sem apoio no infinitivo presente εἶναι e soa como existência continuada no passado, em vez de finalidade. «Já antes» também é redundante; o mais-que-perfeito já expressa a anterioridade do perfeito προηλπικότας.
  naturalness: «Existíssemos para o louvor» é pouco natural e semanticamente impreciso no português atual. «Fôssemos para o louvor» mantém a fórmula paulina e a relação de propósito de modo claro. A relativa sem vírgulas conserva melhor seu caráter identificador.
  terminology: «Messias», «esperado» e «louvor da sua glória» são escolhas adequadas, fiéis e de registro bíblico moderno. A nota mantém, sem impor, a leitura mais forte «os primeiros a esperar».
  issues:
  - severity: medium
    issue: «existíssemos» para εἶναι
    rationale: O infinitivo presente «ser» não requer nem sugere o imperfeito «existíssemos». A forma pode fazer o propósito parecer situado num passado durativo e é menos idiomática na fórmula «para o louvor».
  - severity: low
    issue: Redundância em «já antes»
    rationale: «Já» e «antes» duplicam a noção de anterioridade. «Já havíamos esperado» representa suficientemente o aspecto perfeito e a prioridade indicada por προ-.
  - severity: low
    issue: Vírgulas em torno da oração relativa
    rationale: A oração identifica o grupo referido por «nós». Sem vírgulas, o português reflete melhor essa função delimitadora sem decidir qual grupo histórico está em vista.
  revised_text: a fim de que nós que já havíamos esperado no Messias fôssemos para o louvor da sua glória.[a]
