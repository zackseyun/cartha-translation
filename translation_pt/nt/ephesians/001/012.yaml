  text: εἰς τὸ εἶναι ἡμᾶς εἰς ἔπαινον δόξης αὐτοῦ τοὺς προηλπικότας ἐν τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/012.yaml
  text: so that we who had already hoped in Messiah might be for the praise of his glory[a][b].
translation:
  language: pt
  text: a fim de que nós que já havíamos esperado no Messias fôssemos para o louvor da sua glória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a fim de que nós que fomos os primeiros a esperar no Messias fôssemos para o louvor da sua glória”.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τὸ εἶναι
  choice: a fim de que ... existíssemos
  rationale: A preposição com o infinitivo articular expressa propósito ou resultado. Esta formulação preserva a força télica e a ligação com a existência dos que esperam no Messias.
- source_word: ἡμᾶς
  choice: nós
  rationale: Embora seja acusativo como sujeito do infinitivo grego, na reestruturação com oração finita em português requer a forma nominativa “nós”.
- source_word: εἰς ἔπαινον
  choice: para o louvor
  rationale: Expressa propósito ou resultado e mantém de modo natural a fórmula repetida em Efésios.
- source_word: δόξης αὐτοῦ
  choice: da sua glória
  rationale: Preserva a construção genitiva direta e o peso teológico de “glória”, sem diluí-la numa paráfrase.
- source_word: τοὺς προηλπικότας
  choice: que já antes tínhamos depositado nossa esperança
  rationale: O particípio perfeito de προελπίζω indica esperança anterior com relevância contínua. “Já antes” comunica a prioridade temporal sem decidir que o grupo tenha sido necessariamente o primeiro em sentido histórico.
- source_word: ἐν τῷ Χριστῷ
  choice: no Messias
  rationale: Χριστός funciona aqui como título do Ungido; “Messias” explicita esse valor e a expressão mantém o Messias como objeto e âmbito da esperança.
theological_decisions:
- issue: Se προηλπικότας identifica o primeiro grupo a esperar, possivelmente os judeus crentes, ou apenas pessoas que já esperavam anteriormente
  choice: que já antes tínhamos depositado nossa esperança
  alternative: que fomos os primeiros a esperar
  rationale: O prefixo προ- marca anterioridade, mas não determina sozinho se Paulo descreve o primeiro grupo em sentido histórico-salvífico. O texto principal conserva a formulação mais cautelosa, e a alternativa mais específica fica em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação conserva a oração relativa que identifica o “nós”, a linguagem paulina de esperança no Messias e a fórmula “para o louvor da sua glória”.
