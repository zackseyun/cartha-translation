  text: which is his body[b][a], the fullness of the one who fills all things in all.
translation:
  language: pt
  text: a qual é o corpo dele, a plenitude daquele que enche todas as coisas em todos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a plenitude daquele que enche tudo em todos”.'
    reason: lexical_alternative
  - marker: b
    text: O particípio também pode ser entendido como “daquele que é preenchido”, embora a maioria dos intérpretes entenda aqui “daquele que enche”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἥτις
  choice: a qual
  rationale: Retoma “a igreja” do versículo 22; a forma feminina explicita naturalmente a concordância em português, sem ampliar indevidamente a nuance qualitativa do pronome.
- source_word: σῶμα
  choice: corpo
  rationale: Preserva diretamente a metáfora paulina estabelecida para a relação entre a igreja e o Messias.
- source_word: πλήρωμα
  choice: plenitude
  rationale: Mantém o termo teologicamente denso e sua abertura interpretativa, sem decidir se a igreja é aquilo que é preenchido ou, em algum sentido, complemento.
- source_word: τοῦ ... πληρουμένου
  choice: daquele que enche
  rationale: Expressa o sentido ativo mais provável do particípio médio/passivo no contexto, mantendo em nota a leitura passiva gramaticalmente possível.
- source_word: τὰ πάντα
  choice: todas as coisas
  rationale: Reproduz a abrangência da expressão neutra plural e seu provável alcance cósmico.
- source_word: ἐν πᾶσιν
  choice: em todos
  rationale: Reflete de perto a formulação comprimida e ambígua do grego, sem restringi-la a “de todas as maneiras” nem explicitar se o referente são pessoas ou coisas.
theological_decisions:
- issue: Sentido de πλήρωμα na relação entre a igreja e o Messias
  choice: A igreja é chamada de corpo e plenitude dele, sem explicar em que sentido é sua plenitude.
  alternative: Aquilo que é preenchido pelo Messias; ou o complemento/a conclusão do Messias dentro da metáfora corporal.
  rationale: “Plenitude” conserva a tensão teológica e lexical do original em vez de impor uma interpretação.
- issue: Voz e nuance de πληρουμένου
  choice: 'Sentido ativo: “daquele que enche”.'
  alternative: “daquele que é preenchido”.
  rationale: Embora a forma seja morfologicamente média/passiva, o contexto favorece o sentido ativo; a possibilidade passiva é registrada em nota.
- issue: Referência de ἐν πᾶσιν
  choice: “em todos”, preservando a concisão e a ambiguidade.
  alternative: “em tudo”, “em todas as coisas” ou “de todas as maneiras”.
  rationale: O grego não resolve de modo inequívoco se a expressão é pessoal, neutra ou adverbial; a tradução evita estreitá-la silenciosamente.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “A qual” assegura a ligação gramatical com “a igreja”; “plenitude” e “em todos” preservam a densidade e a ambiguidade do grego.
