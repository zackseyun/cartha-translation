id: EPH.1.4
reference: Ephesians 1:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καθὼς ἐξελέξατο ἡμᾶς ἐν αὐτῷ πρὸ καταβολῆς κόσμου, εἶναι ἡμᾶς ἁγίους καὶ ἀμώμους κατενώπιον αὐτοῦ ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/004.yaml
  text: just as he chose us in him before the foundation of the world[a], to be holy and blameless before him in love[c][b],
translation:
  language: pt
  text: assim como nos escolheu nele, antes da fundação do mundo, para sermos santos e irrepreensíveis[b] diante dele, em amor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou a expressão “em amor” pode ser ligada ao versículo seguinte: “Em amor, ele nos predestinou...”'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “sem defeito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: assim como
  rationale: Mantém a ligação comparativa e explicativa com a bênção mencionada no contexto anterior.
- source_word: ἐξελέξατο
  choice: escolheu
  rationale: Expressa claramente o ato divino de escolher sem introduzir, por si só, formulações teológicas posteriores associadas a termos mais técnicos.
- source_word: ἡμᾶς
  choice: nos
  rationale: Representa o objeto direto de ἐξελέξατο e o sujeito entendido da oração infinitiva seguinte.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Preserva de modo conciso a linguagem paulina de relação ou união, mantendo o pronome do texto grego.
- source_word: πρὸ καταβολῆς κόσμου
  choice: antes da fundação do mundo
  rationale: Equivalente consagrado e claro que conserva tanto a imagem quanto o sentido temporal da expressão grega.
- source_word: εἶναι ἡμᾶς
  choice: para sermos
  rationale: Expressa naturalmente em português a finalidade ou o resultado da escolha; a primeira pessoa do plural explicita o sujeito do infinitivo presente no grego.
- source_word: ἁγίους
  choice: santos
  rationale: Preserva os sentidos moral e consagratório do termo sem reduzi-lo a uma paráfrase.
- source_word: ἀμώμους
  choice: irrepreensíveis
  rationale: Comunica de forma natural a ideia de não dar motivo legítimo de acusação, mantendo também, em nota, a imagem cultual possível de ausência de defeito.
- source_word: κατενώπιον αὐτοῦ
  choice: diante dele
  rationale: Reproduz de modo conciso a noção de presença e responsabilidade perante Deus.
- source_word: ἐν ἀγάπῃ
  choice: em amor
  rationale: Mantém a expressão em sua posição no grego e evita decidir silenciosamente se ela se liga ao que precede ou ao versículo seguinte.
theological_decisions:
- issue: Possível leitura doutrinariamente carregada de ἐξελέξατο no contexto da predestinação
  choice: nos escolheu
  alternative: nos elegeu
  rationale: O texto afirma inequivocamente a escolha divina, mas “escolheu” comunica o sentido lexical sem impor uma formulação denominacional posterior.
- issue: Ligação sintática de ἐν ἀγάπῃ
  choice: manter “em amor” no fim do versículo 4 e registrar a ambiguidade em nota
  alternative: 'ligar a expressão ao versículo 5: “Em amor, ele nos predestinou...”'
  rationale: A construção grega admite ambas as ligações. A posição no texto principal preserva a ordem da fonte, e a nota torna explícita a alternativa genuína.
- issue: Valor da oração infinitiva εἶναι ἡμᾶς
  choice: para sermos
  alternative: para que fôssemos
  rationale: A construção pode ser entendida em termos de finalidade ou resultado. O infinitivo pessoal oferece uma formulação portuguesa natural sem eliminar essa elasticidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação preserva a continuidade sintática com o versículo anterior e mantém, em vez de resolver, a ambiguidade de “em amor”.
