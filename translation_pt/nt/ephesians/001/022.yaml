id: EPH.1.22
reference: Ephesians 1:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πάντα ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ, καὶ αὐτὸν ἔδωκεν κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/022.yaml
  text: And he subjected all things under his feet[a], and gave him as head over all things to the church[b],
translation:
  language: pt
  text: E sujeitou todas as coisas debaixo dos pés dele[a] e o deu à igreja[b] como cabeça sobre todas as coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão evoca o Salmo 8:6, onde todas as coisas são colocadas debaixo dos pés daquele que governa.
    reason: cross_reference
  - marker: b
    text: 'Ou: «para a igreja»; o dativo grego τῇ ἐκκλησίᾳ pode indicar tanto o destinatário quanto o beneficiário.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: todas as coisas
  rationale: O neutro plural abrange a totalidade das coisas e preserva o alcance cósmico da afirmação.
- source_word: ὑπέταξεν
  choice: sujeitou
  rationale: Expressa de modo conciso a ação de colocar tudo em posição subordinada, sem enfraquecer a força do verbo grego.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: debaixo dos pés dele
  rationale: Mantém a imagem concreta de domínio e sujeição, importante por sua ligação com o Salmo 8:6.
- source_word: αὐτὸν ἔδωκεν
  choice: o deu
  rationale: Preserva o sentido básico de δίδωμι e deixa aberta a relação do dativo τῇ ἐκκλησίᾳ como destinatário ou beneficiário.
- source_word: κεφαλὴν
  choice: como cabeça
  rationale: A preposição «como» torna natural em português o complemento predicativo, conservando a metáfora de cabeça.
- source_word: ὑπὲρ πάντα
  choice: sobre todas as coisas
  rationale: Comunica supremacia e autoridade sobre a totalidade, retomando claramente o neutro plural πάντα.
- source_word: τῇ ἐκκλησίᾳ
  choice: à igreja
  rationale: Representa de forma direta o dativo ligado a «deu», sem excluir o possível sentido de benefício, indicado em nota.
theological_decisions:
- issue: Relação entre a posição de Cristo como cabeça, todas as coisas e a igreja
  choice: Cristo é dado à igreja como aquele que é cabeça sobre todas as coisas.
  alternative: Cristo é dado como cabeça sobre todas as coisas para o benefício da igreja.
  rationale: A formulação preserva a supremacia universal de Cristo e a relação especial dele com a igreja, enquanto a nota mantém aberta a ambiguidade do dativo grego.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e vocabulário amplamente compreensível. A repetição de «todas as coisas» conserva a abrangência e a ligação interna do texto grego; «cabeça» mantém a metáfora sem explicá-la de modo denominacional.
