  text: ἣν ⸀ἐνήργηκεν ἐν τῷ Χριστῷ ἐγείρας αὐτὸν ⸀ἐκ νεκρῶν, καὶ ⸀καθίσας ἐν δεξιᾷ αὐτοῦ ἐν τοῖς ἐπουρανίοις
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/020.yaml
  text: which he worked in the Messiah when he raised him from the dead and seated him at his right hand in the heavenly places[b][a],
translation:
  language: pt
  text: que ele exerceu no Messias[a], quando o ressuscitou dentre os mortos e o fez sentar-se à sua direita nas regiões celestiais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em Cristo”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “nos lugares celestiais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: que
  rationale: Retoma a realidade feminina mencionada no contexto anterior — o poder — e mantém naturalmente a ligação da oração relativa em português.
- source_word: ἐνήργηκεν
  choice: exerceu
  rationale: Expressa a atuação eficaz do poder de Deus; em português, “exerceu” combina naturalmente com “poder” retomado do versículo anterior.
- source_word: ἐν τῷ Χριστῷ
  choice: no Messias
  rationale: Preserva a preposição ἐν e apresenta Χριστός como título messiânico neste contexto.
- source_word: ἐγείρας αὐτὸν
  choice: quando o ressuscitou
  rationale: Traduz o particípio aoristo com uma oração temporal natural, sem excluir sua possível nuance de meio ou circunstância concomitante.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: Formulação portuguesa idiomática para a ressurreição, preservando melhor a ideia do plural grego νεκρῶν.
- source_word: καθίσας
  choice: e o fez sentar-se
  rationale: Representa o valor causativo transitivo do verbo e coordena esta ação com a ressurreição.
- source_word: ἐν δεξιᾷ αὐτοῦ
  choice: à sua direita
  rationale: Equivalente idiomático português para a posição de honra e autoridade indicada pela expressão grega.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: nas regiões celestiais
  rationale: Comunica de modo claro a esfera celestial indicada pelo adjetivo substantivado plural, sem acrescentar uma especificação ausente no grego.
theological_decisions:
- issue: Sentido de Χριστῷ
  choice: Messias
  alternative: Cristo
  rationale: O termo pode ser percebido como título ou como designação consolidada. “Messias” torna explícito seu valor titular, enquanto a alternativa tradicional é preservada em nota.
- issue: Sentido de ἐν τοῖς ἐπουρανίοις
  choice: nas regiões celestiais
  alternative: nos lugares celestiais
  rationale: A expressão designa a esfera celestial. “Regiões celestiais” é corrente e natural, enquanto “lugares celestiais” preserva mais diretamente a forma locativa tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase começa em minúscula por continuar sintaticamente o versículo anterior. As notas mantêm as alternativas tradicionais sem resolver indevidamente a amplitude lexical do grego.
