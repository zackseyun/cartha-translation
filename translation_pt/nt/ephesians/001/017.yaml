id: EPH.1.17
reference: Ephesians 1:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῆς δόξης, δώῃ ὑμῖν πνεῦμα σοφίας καὶ ἀποκαλύψεως ἐν ἐπιγνώσει αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/017.yaml
  text: that the God of our Lord Jesus the Messiah[a], the Father of glory, may give you a spirit of wisdom and revelation in the knowledge of him[c][b],
translation:
  language: pt
  text: para que o Deus de nosso Senhor Jesus, o Messias[a], o Pai da glória[b], lhes dê um espírito[c] de sabedoria e de revelação no conhecimento dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “Jesus Cristo”. O título grego Χριστός significa “Messias”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o Pai glorioso”. A expressão grega diz literalmente “o Pai da glória”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “o Espírito de sabedoria e de revelação”. O grego πνεῦμα pode indicar tanto um espírito ou disposição concedido por Deus quanto o Espírito Santo.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz o conteúdo e propósito da oração iniciada no versículo anterior, preservando claramente a relação subordinada.
- source_word: ὁ θεὸς τοῦ κυρίου ἡμῶν
  choice: o Deus de nosso Senhor
  rationale: Tradução direta e natural da relação genitiva, mantendo 'Senhor' como título cristológico.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como o título 'Messias', em português idiomático, em vez de tratá-lo apenas como parte de um nome tradicional.
- source_word: ὁ πατὴρ τῆς δόξης
  choice: o Pai da glória
  rationale: Preserva a construção genitiva do grego e sua densidade teológica, sem decidir em favor da paráfrase 'o Pai glorioso'.
- source_word: δώῃ ὑμῖν
  choice: lhes dê
  rationale: O presente do subjuntivo português após 'para que' expressa naturalmente o subjuntivo aoristo grego neste contexto de oração.
- source_word: πνεῦμα σοφίας καὶ ἀποκαλύψεως
  choice: um espírito de sabedoria e de revelação
  rationale: Mantém πνεῦμα sem artigo como 'um espírito', deixando aberta a possibilidade de uma disposição concedida por Deus; a possível referência ao Espírito Santo é registrada em nota.
- source_word: ἐν ἐπιγνώσει αὐτοῦ
  choice: no pleno conhecimento dele
  rationale: ἐπίγνωσις pode sugerir conhecimento pleno ou verdadeiro; 'pleno conhecimento' distingue o termo de simples informação, enquanto 'dele' preserva a referência pronominal sem explicitar além do grego.
theological_decisions:
- issue: Se πνεῦμα se refere ao Espírito Santo ou a um espírito/disposição concedido por Deus
  choice: um espírito de sabedoria e de revelação
  alternative: o Espírito de sabedoria e de revelação
  rationale: A ausência de artigo e a construção admitem ambas as leituras. O texto principal evita impor a identificação mais específica, e a nota conserva explicitamente a alternativa pneumatológica.
- issue: Como traduzir Χριστός em Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: Χριστός retém valor titular e significa 'Messias'. A vírgula e o artigo tornam o título natural em português sem alterar sua relação com Jesus.
- issue: Sentido do genitivo em ὁ πατὴρ τῆς δόξης
  choice: o Pai da glória
  alternative: o Pai glorioso
  rationale: A forma literal preserva a abertura semântica do genitivo, que pode indicar que a glória caracteriza o Pai ou procede dele.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal 'lhes dê' é natural e formal sem arcaísmo. As notas aparecem na ordem em que os pontos correspondentes surgem no texto.
