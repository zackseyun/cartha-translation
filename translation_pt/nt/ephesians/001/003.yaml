source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who has blessed us with every spiritual blessing in the heavenly realms in Messiah[c][b],
translation:
  language: pt
  text: Bendito seja o Deus e Pai de nosso Senhor Jesus, o Messias[a]; ele nos abençoou com toda bênção espiritual[b] nas regiões celestiais[c], no Messias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradução tradicional: “Jesus Cristo” e, no fim do versículo, “em Cristo”. O título grego Χριστός significa “Messias” ou “Ungido”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “toda bênção do Espírito”. O adjetivo grego pode significar “espiritual” de modo mais amplo ou “pertencente ao Espírito”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “nos lugares celestiais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Bendito seja
  rationale: O adjetivo predicativo introduz uma fórmula de louvor. “Bendito seja” é natural em português e mantém o caráter doxológico e exclamativo.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: o Deus e Pai
  rationale: O artigo rege os dois substantivos coordenados; a formulação preserva tanto a referência a Deus quanto a relação de Pai.
- source_word: τοῦ κυρίου ἡμῶν
  choice: de nosso Senhor
  rationale: “Senhor” conserva a força titular de κύριος e corresponde ao uso cristológico do Novo Testamento.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Χριστός tem sentido titular, “Messias”. A inserção idiomática do artigo e da vírgula em português deixa claro que se trata do título de Jesus.
- source_word: ὁ εὐλογήσας ἡμᾶς
  choice: que nos abençoou
  rationale: O particípio aoristo descreve o ato realizado por Deus. O pretérito perfeito é direto e natural, sem acrescentar ao aspecto verbal uma especificação ausente no grego.
- source_word: ἐν πάσῃ εὐλογίᾳ πνευματικῇ
  choice: com toda bênção espiritual
  rationale: Depois de “abençoou”, “com” expressa naturalmente o conteúdo ou meio da bênção. “Toda bênção” conserva a distributividade de πάσῃ, e “espiritual” mantém a amplitude de πνευματικῇ.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: nas regiões celestiais
  rationale: A expressão substantivada designa a esfera celestial. “Regiões celestiais” é compreensível e preserva o plural, sem torná-lo excessivamente concreto.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Mantém de forma compacta a fórmula paulina com ἐν e traduz Χριστός segundo seu sentido titular.
theological_decisions:
- issue: Tradução de Χριστός nas fórmulas paulinas
  choice: “Messias” em “Jesus, o Messias” e “no Messias”
  alternative: “Cristo” em “Jesus Cristo” e “em Cristo”
  rationale: O título grego significa “Ungido/Messias”. Traduzir o título torna seu conteúdo semântico visível, enquanto a nota registra a forma tradicional e amplamente conhecida.
- issue: Sentido de πνευματικῇ
  choice: “espiritual”
  alternative: “do Espírito”
  rationale: O adjetivo pode caracterizar as bênçãos como espirituais ou indicar que procedem do Espírito. O texto principal preserva essa amplitude, e a nota apresenta a leitura mais específica.
- issue: Referente e natureza de ἐν τοῖς ἐπουρανίοις
  choice: “nas regiões celestiais”
  alternative: “nos lugares celestiais”
  rationale: A expressão aponta para a esfera celestial, mas não define com precisão lugares concretos. A opção escolhida mantém essa relativa abertura sem eliminar a alternativa espacial.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A cadência de bênção foi preservada, assim como a repetição lexical entre “Bendito” e “abençoou”. As notas mantêm as ambiguidades lexicais relevantes sem sobrecarregar o texto principal.
