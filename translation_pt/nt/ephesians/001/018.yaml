id: EPH.1.18
reference: Ephesians 1:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πεφωτισμένους τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν εἰς τὸ εἰδέναι ὑμᾶς τίς ἐστιν ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ, ⸀τίς ὁ πλοῦτος τῆς δόξης τῆς κληρονομίας αὐτοῦ ἐν τοῖς ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/018.yaml
  text: having the eyes of your heart enlightened[a], so that you may know what is the hope of his calling, what is the wealth of the glory of his inheritance among the saints[b],
translation:
  language: pt
  text: com os olhos do coração de vocês iluminados, para que saibam qual é a esperança do chamado dele, qual é a riqueza[a] da glória da herança dele entre os santos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as riquezas da glória”.
    reason: Registra uma forma portuguesa tradicional e idiomática de expressar abundância, embora o substantivo grego esteja no singular.
  - marker: b
    text: Ou “nos santos”; também pode ser entendido como “entre o seu povo santo”.
    reason: Preserva a amplitude de ἐν τοῖς ἁγίοις, que pode ser traduzido como “nos santos” ou “entre os santos”, e esclarece o sentido coletivo sem substituir “santos” no texto principal.
lexical_decisions:
- source_word: πεφωτισμένους
  choice: iluminados
  rationale: O particípio perfeito passivo comunica um estado resultante produzido por uma ação recebida. A construção com “com os olhos... iluminados” é natural em português, mantém a voz passiva e se liga ao contexto sintático anterior.
- source_word: ὀφθαλμοὺς τῆς καρδίας ὑμῶν
  choice: os olhos do coração de vocês
  rationale: Preserva a metáfora paulina, em vez de reduzi-la interpretativamente a “entendimento” ou “mente”; “de vocês” oferece clareza e ampla legibilidade brasileira.
- source_word: εἰς τὸ εἰδέναι ὑμᾶς
  choice: para que saibam
  rationale: Expressa de modo idiomático a finalidade da construção infinitiva grega.
- source_word: ἐλπὶς
  choice: esperança
  rationale: Equivalente corrente que preserva o sentido paulino de expectativa confiante.
- source_word: κλήσεως αὐτοῦ
  choice: do chamado dele
  rationale: Mantém o vocabulário teológico de “chamado” e representa o genitivo sem expandi-lo para uma paráfrase interpretativa.
- source_word: πλοῦτος τῆς δόξης
  choice: a riqueza da glória
  rationale: Reproduz o singular πλοῦτος e conserva a relação genitiva densa do original, sem convertê-la em uma avaliação como “a gloriosa riqueza”.
- source_word: κληρονομίας αὐτοῦ
  choice: da herança dele
  rationale: Preserva a abertura do genitivo, que pode indicar a herança pertencente a Deus ou aquela que ele concede, sem decidir a questão no texto principal.
- source_word: ἐν τοῖς ἁγίοις
  choice: entre os santos
  rationale: “Entre” é uma leitura natural de ἐν em sentido corporativo; “santos” preserva o termo paulino, enquanto a alternativa mais formal “nos santos” é registrada em nota.
theological_decisions:
- issue: Se “a herança dele entre/nos santos” é a herança de Deus, constituída por seu povo, ou a herança que ele concede aos fiéis
  choice: a herança dele entre os santos
  alternative: a herança dele nos santos; a herança que ele concede entre os santos
  rationale: O genitivo αὐτοῦ e a preposição ἐν permitem mais de uma nuance. A formulação principal conserva a tensão do grego e evita impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções compreensíveis no Brasil. A metáfora “olhos do coração”, o vocabulário “chamado”, “glória”, “herança” e “santos”, e as ambiguidades teológicas relevantes foram preservados. A pontuação final mantém a continuidade sintática do período iniciado nos versículos anteriores.
