id: EPH.1.15
reference: Ephesians 1:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Διὰ τοῦτο κἀγώ, ἀκούσας τὴν καθ’ ὑμᾶς πίστιν ἐν τῷ κυρίῳ Ἰησοῦ καὶ τὴν ⸂ἀγάπην τὴν⸃ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/015.yaml
  text: For this reason[a], I also, having heard of your faith in the Lord Jesus and your love for all the saints[b],
translation:
  language: pt
  text: Por essa razão, eu também, tendo ouvido falar da fé de vocês no Senhor Jesus[a] e do amor de vocês por todos os santos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da confiança de vocês no Senhor Jesus”; em alguns contextos, o substantivo grego também pode ter o sentido de “fidelidade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “do amor de vocês para com todos os santos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Por essa razão
  rationale: A expressão introduz a resposta de Paulo com base no que foi exposto anteriormente. “Por essa razão” conserva essa relação causal e inferencial de modo natural.
- source_word: κἀγώ
  choice: eu também
  rationale: A contração de καί + ἐγώ inclui o próprio Paulo na resposta mencionada, mantendo a ênfase aditiva sem exagerá-la.
- source_word: ἀκούσας
  choice: tendo ouvido falar
  rationale: O particípio aoristo modifica Paulo e apresenta o que ele ouviu como circunstância anterior à ação principal, que continua no versículo seguinte. “Ouvido falar” é idiomático para notícias recebidas a respeito da fé e do amor dos destinatários.
- source_word: τὴν καθ’ ὑμᾶς πίστιν
  choice: da fé de vocês
  rationale: A construção κατά + ὑμᾶς se refere à fé que caracteriza ou pertence aos destinatários. A formulação escolhida é clara e natural em português.
- source_word: πίστιν
  choice: fé
  rationale: Neste contexto, πίστις indica principalmente a relação de confiança dos destinatários com o Senhor Jesus. “Fé” preserva o termo paulino habitual sem excluir por completo suas nuances.
- source_word: ἐν τῷ κυρίῳ Ἰησοῦ
  choice: no Senhor Jesus
  rationale: Mantém a preposição ἐν e a expressão paulina, sem substituí-la pela interpretação mais explícita “em relação ao Senhor Jesus”.
- source_word: κυρίῳ
  choice: Senhor
  rationale: “Senhor” preserva o título cristológico estabelecido de Jesus e o peso teológico de κύριος.
- source_word: ἀγάπην
  choice: amor
  rationale: “Amor” é a correspondência moderna, direta e natural para ἀγάπη.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: por todos os santos
  rationale: Depois de ἀγάπη, εἰς indica a direção ou os destinatários do amor. Em português, “amor por” comunica isso com naturalidade.
- source_word: ἁγίους
  choice: santos
  rationale: “Santos” conserva a designação paulina coletiva dos que pertencem a Deus, sem parafraseá-la nem limitá-la ao sentido posterior de pessoas canonizadas.
theological_decisions:
- issue: Sentido de πίστις em relação ao Senhor Jesus
  choice: fé
  alternative: confiança; fidelidade
  rationale: A construção aponta mais diretamente para a confiança dos destinatários no Senhor Jesus. “Fé” é a tradução principal mais adequada; a nota preserva “confiança” e registra que “fidelidade” pode ocorrer como nuance lexical em outros contextos, sem impô-la aqui.
- issue: Tradução de κύριος como título de Jesus
  choice: Senhor
  alternative: Mestre
  rationale: Aqui κύριος funciona como título cristológico. “Senhor” conserva tanto o uso paulino quanto seu peso teológico, enquanto “Mestre” estreitaria o sentido.
- issue: Referente de οἱ ἅγιοι
  choice: os santos
  alternative: o povo santo de Deus; os consagrados
  rationale: A expressão designa coletivamente os fiéis, não uma classe posterior de pessoas canonizadas. A tradução tradicional “os santos” mantém a terminologia paulina e permanece compreensível no contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura participial e a vírgula final foram mantidas porque a frase prossegue no versículo seguinte. “Vocês” oferece clareza internacional com boa naturalidade no Brasil; “tendo ouvido falar” conserva a relação sintática do particípio grego sem soar excessivamente técnica.
