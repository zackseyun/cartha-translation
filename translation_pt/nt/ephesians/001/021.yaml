id: EPH.1.21
reference: Ephesians 1:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑπεράνω πάσης ἀρχῆς καὶ ἐξουσίας καὶ δυνάμεως καὶ κυριότητος καὶ παντὸς ὀνόματος ὀνομαζομένου οὐ μόνον ἐν τῷ αἰῶνι τούτῳ ἀλλὰ καὶ ἐν τῷ μέλλοντι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/021.yaml
  text: far above every rule and authority and power and dominion[a], and every name that is named[c][b], not only in this age but also in the one to come.
translation:
  language: pt
  text: muito acima de todo governo, autoridade, poder e domínio[a], e de todo nome que se nomeia[b], não somente nesta era, mas também na que há de vir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo principado, autoridade, poder e senhorio”. Os termos gregos podem indicar categorias ou esferas de autoridade, inclusive poderes cósmicos ou espirituais.
    reason: lexical_alternative
  - marker: b
    text: Ou “todo título que se concede”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεράνω
  choice: muito acima
  rationale: Expressa enfaticamente superioridade e exaltação, em português natural, sem acrescentar uma comparação ausente do grego.
- source_word: πάσης ἀρχῆς
  choice: todo governo
  rationale: Neste contexto, ἀρχή indica governo, poder governante ou principado; “governo” conserva o sentido categorial sem especificar se se trata de poderes humanos ou espirituais.
- source_word: ἐξουσίας
  choice: autoridade
  rationale: Equivalente corrente para autoridade ou poder legitimado, mantendo distinção em relação a δύναμις.
- source_word: δυνάμεως
  choice: poder
  rationale: Tradução ampla e natural que comunica capacidade ou força e preserva a sequência de categorias.
- source_word: κυριότητος
  choice: domínio
  rationale: Comunica senhorio ou esfera de domínio sem confundir o termo com o título divino “Senhor”.
- source_word: παντὸς ὀνόματος ὀνομαζομένου
  choice: todo nome que se nomeia
  rationale: Mantém a repetição retórica do substantivo e do particípio gregos e preserva a abrangência entre nome, título ou posição reconhecida.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: não somente ... mas também
  rationale: Reproduz de forma clara e digna a construção correlativa grega.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: nesta era
  rationale: Preserva o sentido temporal de αἰών e o contraste com a era futura, evitando reduzi-lo ao espaço físico do “mundo”.
- source_word: ἐν τῷ μέλλοντι
  choice: na que há de vir
  rationale: Conserva a elipse do grego, na qual “era” está subentendido, e oferece uma formulação portuguesa natural.
theological_decisions:
- issue: Natureza de ἀρχή, ἐξουσία, δύναμις e κυριότης
  choice: Traduzir como categorias amplas de governo, autoridade, poder e domínio, sem identificar seus portadores.
  alternative: Explicitar que são poderes cósmicos, espirituais ou ordens angelicais.
  rationale: Embora o contexto possa abranger poderes cósmicos ou espirituais, o grego não define aqui sua natureza. A tradução preserva essa amplitude e evita impor uma ontologia específica.
- issue: Sentido de παντὸς ὀνόματος ὀνομαζομένου
  choice: Preservar literalmente a linguagem de “nome” e “nomear”.
  alternative: Interpretar como “todo título que se concede”.
  rationale: A expressão pode incluir títulos, posições ou qualquer realidade nomeada, mas o texto mantém alcance mais amplo; por isso, a tradução não restringe o referente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A formulação mantém a cadência enumerativa do grego e conserva deliberadamente a ambiguidade quanto à natureza dos poderes mencionados.
