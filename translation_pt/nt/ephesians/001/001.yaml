id: EPH.1.1
reference: Ephesians 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ τοῖς ἁγίοις τοῖς οὖσιν ⸂[ἐν Ἐφέσῳ]⸃ καὶ πιστοῖς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God[c][b], to the saints who are [in Ephesus] and faithful in Messiah Jesus:'
translation:
  language: pt
  text: 'Paulo, apóstolo do Messias Jesus[c] pela vontade de Deus, aos santos que estão [em Éfeso][a] e são fiéis[b] no Messias Jesus:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos antigos omitem “em Éfeso”. Por isso, alguns entendem que a carta se destinava a uma circulação mais ampla, e não somente à igreja em Éfeso.
    reason: textual_variant
  - marker: b
    text: 'Ou: “crentes no Messias Jesus”.'
    reason: lexical_alternative
  - marker: c
    text: 'Grego: “Cristo Jesus” (Christos Iēsous). Aqui, Χριστός é traduzido como “Messias” por funcionar como título.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: apóstolo
  rationale: Preserva o título técnico ligado ao encargo e à autoridade de Paulo, em vez de usar o sentido mais genérico de “mensageiro” ou “enviado”.
- source_word: Χριστοῦ Ἰησοῦ
  choice: do Messias Jesus
  rationale: Χριστός conserva aqui sua força titular; “Messias” comunica esse sentido, enquanto a ordem dos nomes acompanha de perto o grego.
- source_word: διὰ θελήματος θεοῦ
  choice: pela vontade de Deus
  rationale: Tradução natural de διά com genitivo nesta fórmula de comissionamento, indicando que o apostolado de Paulo decorre da vontade divina.
- source_word: τοῖς ἁγίοις
  choice: aos santos
  rationale: Designa coletivamente o povo consagrado a Deus e corresponde ao uso paulino reconhecido, sem sugerir uma classe especial posterior.
- source_word: τοῖς οὖσιν
  choice: que estão
  rationale: Reproduz de modo direto o particípio de εἰμί na identificação dos destinatários.
- source_word: '[ἐν Ἐφέσῳ]'
  choice: '[em Éfeso]'
  rationale: Mantém a expressão entre colchetes para tornar visível sua incerteza textual, conforme a edição grega fornecida.
- source_word: πιστοῖς
  choice: fiéis
  rationale: Preserva o valor adjetival e a possível ideia de fidelidade; a alternativa “crentes” é registrada em nota por também ser lexicalmente possível.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Preserva a preposição relacional ἐν e a força titular de Χριστός, indicando a relação ou união dos destinatários com Jesus, o Messias.
theological_decisions:
- issue: Tradução de Χριστός na saudação paulina
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός ainda funciona claramente como título. “Messias” explicita essa função sem transformar o título silenciosamente em parte de um nome próprio.
- issue: Situação textual de ἐν Ἐφέσῳ
  choice: Manter “[em Éfeso]” entre colchetes
  alternative: Omitir “em Éfeso”
  rationale: Alguns testemunhos antigos importantes não contêm a expressão. Os colchetes preservam a leitura presente em muitos manuscritos sem ocultar a dúvida textual.
- issue: Sentido de πιστοῖς
  choice: fiéis
  alternative: crentes
  rationale: O termo pode caracterizar os destinatários como fiéis ou identificá-los como os que creem. A tradução principal mantém a nuance adjetival, e a nota preserva a alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura de saudação foi mantida em uma única frase, próxima do grego. Os colchetes sinalizam a variante textual, e as notas preservam as ambiguidades de πιστός e do título Χριστός.
