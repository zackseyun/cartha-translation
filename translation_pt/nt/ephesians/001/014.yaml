source:
  edition: SBLGNT
  text: ⸀ὅ ἐστιν ἀρραβὼν τῆς κληρονομίας ἡμῶν, εἰς ἀπολύτρωσιν τῆς περιποιήσεως, εἰς ἔπαινον τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/014.yaml
  text: who is the down payment of our inheritance, toward the redemption of the possession, to the praise of his glory.
translation:
  language: pt
  text: o qual é a garantia da nossa herança, para a redenção da propriedade adquirida, para o louvor da sua glória.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅ
  choice: o qual
  rationale: O pronome relativo retoma o Espírito Santo no versículo anterior e preserva a ligação sintática e pessoal do grego.
- source_word: ἀρραβών
  choice: garantia
  rationale: Designa o sinal inicial que assegura o recebimento pleno futuro; “garantia” comunica isso naturalmente em português sem limitar a imagem a uma transação monetária.
- source_word: κληρονομία
  choice: herança
  rationale: Equivalente direto e tradicional, adequado ao contexto escatológico.
- source_word: εἰς ἀπολύτρωσιν
  choice: até a redenção
  rationale: Aqui εἰς aponta para o alvo ou marco futuro ao qual a garantia se estende. “Até” expressa essa orientação temporal-final em português corrente.
- source_word: περιποίησις
  choice: propriedade adquirida
  rationale: O substantivo pode indicar posse ou aquilo que foi adquirido e preservado como propriedade. A formulação mantém a referência deliberadamente aberta quanto ao possuidor explícito.
- source_word: ἔπαινος τῆς δόξης
  choice: louvor da sua glória
  rationale: Preserva a formulação genitiva densa do original e sua correspondência com Efésios 1:6,12.
theological_decisions:
- issue: Referente de “propriedade adquirida”
  choice: Manter a expressão sem explicitar “de Deus” nem “nossa”
  alternative: “até Deus redimir plenamente o povo que lhe pertence”
  rationale: O grego τῆς περιποιήσεως não nomeia expressamente o possuidor nem identifica de modo inequívoco a posse; explicitar o referente resolveria uma ambiguidade genuína.
- issue: Relação entre o Espírito e a herança futura
  choice: “garantia da nossa herança”
  alternative: “primeira parcela da nossa herança”
  rationale: A tradução escolhida preserva a certeza dada pelo Espírito sem impor exclusivamente a metáfora financeira de pagamento parcial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as três relações finais do grego são mantidas tanto quanto permite uma formulação natural.
