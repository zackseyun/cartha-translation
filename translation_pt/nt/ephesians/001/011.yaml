id: EPH.1.11
reference: Ephesians 1:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ἐκληρώθημεν προορισθέντες κατὰ πρόθεσιν τοῦ τὰ πάντα ἐνεργοῦντος κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/011.yaml
  text: In him we also were made an inheritance[a], having been predestined according to the purpose of the one who works all things according to the counsel of his will,
translation:
  language: pt
  text: Nele também fomos feitos herança[a], tendo sido predestinados conforme o propósito daquele que realiza todas as coisas segundo o conselho da sua vontade,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “também recebemos uma herança”. O verbo grego pode significar tanto receber uma herança como ser constituído a herança, ou propriedade, de Deus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nele
  rationale: Retoma o Messias no contexto anterior e expressa de modo natural em português a relação com Cristo.
- source_word: ἐκληρώθημεν
  choice: fomos feitos herança
  rationale: Preserva a forma passiva e a provável ideia de que os fiéis se tornaram o povo que pertence a Deus, sem apagar a possibilidade de o verbo significar receber uma herança, registrada em nota.
- source_word: προορισθέντες
  choice: tendo sido predestinados
  rationale: Reproduz a determinação prévia expressa pelo particípio, sem acrescentar um sistema teológico além do texto.
- source_word: κατὰ πρόθεσιν
  choice: conforme o propósito
  rationale: Comunica a intenção deliberada de Deus com linguagem portuguesa clara e próxima do grego.
- source_word: τοῦ τὰ πάντα ἐνεργοῦντος
  choice: daquele que realiza todas as coisas
  rationale: Identifica Deus como sujeito atuante e mantém o alcance abrangente da expressão, com formulação natural em português.
- source_word: κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ
  choice: segundo o conselho da sua vontade
  rationale: Mantém a nuance deliberativa de βουλή e sua relação genitiva com a vontade de Deus, sem reduzi-la simplesmente a 'plano'.
theological_decisions:
- issue: Sentido de ἐκληρώθημεν
  choice: Os fiéis foram feitos herança, isto é, o povo pertencente a Deus.
  alternative: Os fiéis receberam uma herança.
  rationale: A forma passiva admite as duas interpretações. O pano de fundo veterotestamentário do povo de Deus como sua herança favorece a leitura adotada, mas a alternativa é genuína e por isso foi preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem e a densidade argumentativa do grego foram preservadas sem tornar a frase artificial; a vírgula final mantém a continuidade sintática com o versículo seguinte.
