id: EPH.1.5
reference: Ephesians 1:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: προορίσας ἡμᾶς εἰς υἱοθεσίαν διὰ Ἰησοῦ Χριστοῦ εἰς αὐτόν, κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/005.yaml
  text: having predestined us for adoption through Jesus the Messiah to himself[a], according to the good pleasure of his will[c][b],
translation:
  language: pt
  text: tendo-nos predestinado para a adoção como filhos[a], por meio de Jesus, o Messias[b], para si mesmo[c], segundo o bom prazer da sua vontade,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para adoção” ou “para recebermos a condição de filhos”. O termo grego se refere literalmente à colocação na condição de filho e ressalta a posição jurídica de herdeiro.
    reason: lexical_alternative
  - marker: b
    text: Ou “por meio de Jesus Cristo”. “Messias” traduz o título grego Christós.
    reason: alternative_reading
  - marker: c
    text: Ou “para ele”. A expressão grega pode indicar direção para Deus ou finalidade para ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: προορίσας
  choice: tendo-nos predestinado
  rationale: Mantém o sentido explícito de determinar de antemão e conserva a forma participial, que liga este versículo à longa declaração de bênção iniciada no contexto anterior.
- source_word: εἰς υἱοθεσίαν
  choice: para a adoção como filhos
  rationale: Expressa tanto a adoção quanto a concessão da condição jurídica e hereditária de filho, componente presente em υἱοθεσία.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: por meio de Jesus, o Messias
  rationale: διά com o genitivo indica meio ou agência. Χριστός é traduzido como o título “Messias”, enquanto Ἰησοῦ permanece como nome próprio.
- source_word: εἰς αὐτόν
  choice: para si mesmo
  rationale: Preserva Deus como alvo ou beneficiário da adoção; a nota registra a possível nuance direcional, “para ele”.
- source_word: κατὰ τὴν εὐδοκίαν
  choice: segundo o bom prazer
  rationale: κατά indica conformidade, e εὐδοκία comunica agrado favorável ou beneplácito sem exigir uma paráfrase explicativa.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: da sua vontade
  rationale: Tradução direta da construção genitiva, preservando θέλημα como “vontade”, sem substituí-lo interpretativamente por “propósito”.
theological_decisions:
- issue: Sentido de προορίσας em um contexto doutrinariamente disputado
  choice: predestinado
  alternative: decidido de antemão
  rationale: O verbo grego afirma uma determinação prévia. A tradução mantém essa força lexical sem acrescentar uma teoria sistemática sobre a natureza ou o modo da predestinação.
- issue: Nuance filial e jurídica de υἱοθεσία
  choice: adoção como filhos
  alternative: adoção; condição de filhos
  rationale: A formulação conserva o componente masculino formal do termo grego e sua associação com a condição de herdeiro, sem implicar que a aplicação se restrinja aos homens.
- issue: Valor titular de Χριστοῦ
  choice: o Messias
  alternative: Cristo
  rationale: Traduz o título grego para tornar seu sentido perceptível, em vez de tratá-lo apenas como parte do nome de Jesus.
- issue: Função de εἰς αὐτόν
  choice: para si mesmo
  alternative: para ele
  rationale: A expressão pode apontar para Deus como finalidade ou como direção da adoção. O texto principal exprime a nuance final, e a nota preserva a alternativa direcional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura participial e a vírgula final preservam a continuidade sintática com Efésios 1:3–14. “Bom prazer” mantém a solenidade do original sem recorrer ao mais técnico “beneplácito”.
