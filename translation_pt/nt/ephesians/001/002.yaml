  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: pt
  text: Graça e paz a vocês, da parte de Deus, nosso Pai, e do Senhor Jesus, o Messias.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus Cristo”. O grego Χριστός pode funcionar como título (“Messias”) ou, em certos contextos, como uma forma semelhante a um nome (“Cristo”).'
    reason: alternative_reading
  - marker: b
    text: 'Outra forma possível: “do Senhor Jesus Cristo”.'
    reason: previous_rendering
lexical_decisions:
- source_word: χάρις
  choice: Graça
  rationale: Preserva tanto a forma da saudação paulina quanto seu conteúdo teológico, sem reduzi-la a mero cumprimento ou a 'favor'.
- source_word: ὑμῖν
  choice: a vocês
  rationale: É a expressão natural no português moderno e torna explícito o destinatário plural indicado pelo dativo grego.
- source_word: εἰρήνη
  choice: paz
  rationale: Mantém o sentido comum e a provável ressonância do conceito bíblico de shalom.
- source_word: ἀπὸ
  choice: da parte de
  rationale: Expressa naturalmente em português a origem da graça e da paz, sem alterar a relação indicada pela preposição.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Deus, nosso Pai
  rationale: Entende a sequência como aposicional, conforme a fórmula paulina, e a vírgula esclarece em português que Deus é identificado como nosso Pai.
- source_word: κυρίου
  choice: Senhor
  rationale: Conserva o valor titular e cristológico habitual de κύριος no Novo Testamento.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título e usa artigo e pontuação naturais em português para tornar transparente seu sentido messiânico.
theological_decisions:
- issue: Sentido de Χριστοῦ na sequência Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: Χριστός pode funcionar como título ('Messias') ou como designação já próxima de um nome próprio ('Cristo'). O texto principal explicita o título sem excluir a forma tradicional, registrada em nota.
- issue: Relação entre θεοῦ e πατρὸς ἡμῶν
  choice: Deus, nosso Pai
  alternative: nosso Deus e Pai
  rationale: A leitura aposicional corresponde mais diretamente à construção e à fórmula de saudação, sem inserir uma conjunção ausente no grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “vocês” para o plural e mantém a concisão solene da saudação paulina. A vírgula em “Deus, nosso Pai” marca aposição; em “Jesus, o Messias”, explicita o caráter titular de Messias.
