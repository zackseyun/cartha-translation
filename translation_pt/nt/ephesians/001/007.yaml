source:
  edition: SBLGNT
  text: ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν διὰ τοῦ αἵματος αὐτοῦ, τὴν ἄφεσιν τῶν παραπτωμάτων, κατὰ ⸂τὸ πλοῦτος⸃ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/007.yaml
  text: In him we have redemption through his blood[a], the forgiveness of trespasses[b], according to the riches of his grace
translation:
  language: pt
  text: Nele[a] temos a redenção por meio do seu sangue, o perdão dos delitos[b], segundo a riqueza da sua graça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “No qual”.
    reason: lexical_alternative
  - marker: b
    text: Ou “transgressões”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nele
  rationale: O pronome relativo retoma o Amado do versículo anterior. “Nele” é natural em português e preserva o sentido de participação ou união, enquanto “no qual” é uma alternativa mais formal.
- source_word: ἔχομεν
  choice: temos
  rationale: O presente do indicativo expressa uma realidade ou posse atual; “temos” é direto e idiomático.
- source_word: ἀπολύτρωσιν
  choice: redenção
  rationale: O termo indica libertação obtida mediante um custo e conserva, no uso paulino, um peso teológico que “libertação” isoladamente não expressaria por completo.
- source_word: διὰ τοῦ αἵματος αὐτοῦ
  choice: por meio do seu sangue
  rationale: διά com o genitivo indica meio ou instrumento. A formulação mantém a imagem concreta, sacrificial e pactual do sangue sem substituí-la interpretativamente por “morte”.
- source_word: ἄφεσιν
  choice: perdão
  rationale: Neste contexto, o termo designa a remissão das faltas e explica, em aposição, a redenção; “perdão” é a expressão contemporânea mais clara.
- source_word: παραπτωμάτων
  choice: delitos
  rationale: O termo se refere a faltas, ofensas ou transgressões morais. “Delitos” é compreensível e preserva a gravidade da infração; “transgressões” continua sendo uma alternativa legítima.
- source_word: κατὰ τὸ πλοῦτος
  choice: segundo a riqueza
  rationale: κατά com o acusativo indica padrão ou medida. “Segundo a riqueza” mantém a ideia de que a redenção e o perdão correspondem à abundância da graça divina, e não apenas procedem dela.
- source_word: χάριτος
  choice: graça
  rationale: “Graça” é o equivalente estabelecido e semanticamente adequado para o favor generoso de Deus no uso paulino.
theological_decisions:
- issue: Relação entre “redenção” e “o perdão dos delitos”
  choice: 'Manter as duas expressões em aposição: “a redenção ... o perdão dos delitos”'
  alternative: 'Explicitar: “a redenção, isto é, o perdão dos delitos”'
  rationale: O segundo sintagma acusativo explica naturalmente o primeiro, mas o grego não contém uma fórmula explicativa como “isto é”. A aposição preserva a estrutura e sua abertura sem acrescentar interpretação.
- issue: Linguagem expiatória em “por meio do seu sangue”
  choice: Conservar a referência concreta ao sangue
  alternative: “por meio da sua morte” ou “por meio da sua morte sacrificial”
  rationale: O texto menciona explicitamente o sangue. Substituí-lo por “morte” explicaria a imagem, mas reduziria sua dimensão sacrificial e pactual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A redação mantém a sequência compacta do grego e evita explicitar relações que o original deixa implícitas.
