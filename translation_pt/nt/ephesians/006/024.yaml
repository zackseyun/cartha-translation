  text: ἡ χάρις μετὰ πάντων τῶν ἀγαπώντων τὸν κύριον ἡμῶν Ἰησοῦν Χριστὸν ἐν ⸀ἀφθαρσίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/024.yaml
  text: Grace be with all who love our Lord Jesus the Messiah with incorruptibility[a].
translation:
  language: pt
  text: A graça esteja com todos os que amam nosso Senhor Jesus, o Messias, em incorruptibilidade[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com amor imperecível”; também pode ser entendido como “com sinceridade” ou “com amor que não morre”. A expressão grega “em incorruptibilidade” é concisa e ambígua.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: A graça
  rationale: Mantém o termo paulino característico nas bênçãos epistolares; o artigo torna a fórmula natural em português.
- source_word: μετὰ πάντων
  choice: esteja com todos
  rationale: A frase grega não contém verbo, mas a fórmula de bênção em português pede naturalmente o subjuntivo optativo «esteja»; μετά com genitivo corresponde diretamente a «com».
- source_word: ἀγαπώντων
  choice: os que amam
  rationale: Traduz o particípio presente substantivado por uma oração relativa natural, preservando o amor como característica contínua.
- source_word: κύριον ἡμῶν
  choice: nosso Senhor
  rationale: «Senhor» é a tradução corrente e adequada do título cristológico κύριος.
- source_word: Ἰησοῦν Χριστόν
  choice: Jesus, o Messias
  rationale: Traduz Χριστός em seu sentido titular de «Messias»; a vírgula e o artigo tornam a aposição idiomática em português.
- source_word: ἐν ἀφθαρσίᾳ
  choice: em incorruptibilidade
  rationale: A formulação deliberadamente concisa preserva a ambiguidade sintática e semântica do grego, sem decidir se a expressão qualifica o amor, a condição dos que amam ou a esfera da bênção.
theological_decisions:
- issue: Sentido e relação sintática de ἐν ἀφθαρσίᾳ
  choice: Manter «em incorruptibilidade» no texto principal
  alternative: «com amor imperecível»; «com amor que não morre»; «com sinceridade»
  rationale: O grego não explicita com segurança se a incorruptibilidade caracteriza o amor, descreve sua permanência ou exprime sinceridade. A tradução formal no texto preserva essa tensão, enquanto a nota oferece leituras interpretativas naturais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «A graça esteja com» conserva o tom de bênção epistolar. «Em incorruptibilidade» é menos coloquial por necessidade de preservar uma ambiguidade genuína do original, esclarecida na nota.
