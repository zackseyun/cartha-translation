id: EPH.6.23
reference: Ephesians 6:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἰρήνη τοῖς ἀδελφοῖς καὶ ἀγάπη μετὰ πίστεως ἀπὸ θεοῦ πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/023.yaml
  text: Peace to the brothers[a], and love with faith[c][b], from God the Father and the Lord Jesus the Messiah.
translation:
  language: pt
  text: Paz aos irmãos[a] e amor com fé[b], da parte de Deus Pai e do Senhor Jesus, o Messias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos irmãos e às irmãs”. O grego diz literalmente “irmãos”, uma forma masculina plural que pode referir-se a toda a comunidade de fiéis.
    reason: alternative_reading
  - marker: b
    text: Ou “amor com fidelidade” ou “amor com confiança”. A palavra grega pode ter esses sentidos, embora “fé” seja a tradução padrão aqui.
    reason: lexical_alternative
  - marker: c
    text: 'Grego: “Jesus Cristo”. Aqui, “Messias” traduz o título Χριστός para preservar seu significado.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰρήνη
  choice: Paz
  rationale: Mantém a fórmula breve de bênção expressa pelo substantivo, sem acrescentar um verbo ausente no grego.
- source_word: τοῖς ἀδελφοῖς
  choice: aos irmãos
  rationale: Reproduz a forma masculina plural do grego; no uso paulino, ela pode incluir toda a comunidade de fiéis, possibilidade indicada em nota.
- source_word: ἀγάπη
  choice: amor
  rationale: É o equivalente corrente de ἀγάπη e preserva sua ligação lexical com o uso recorrente de Paulo.
- source_word: μετὰ πίστεως
  choice: com fé
  rationale: μετά com genitivo indica acompanhamento, e 'fé' é o sentido padrão de πίστις neste contexto, sem eliminar outras nuances possíveis.
- source_word: ἀπὸ
  choice: da parte de
  rationale: Expressa de modo natural em português a origem da bênção em Deus Pai e no Senhor Jesus.
- source_word: θεοῦ πατρὸς
  choice: Deus Pai
  rationale: Reflete precisamente o grego, que não contém o possessivo 'nosso'.
- source_word: κυρίου
  choice: Senhor
  rationale: É a tradução convencional e contextualmente adequada de κύριος como título de Jesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título e usa o artigo exigido pela formulação idiomática em português; a vírgula torna clara a aposição.
theological_decisions:
- issue: Tradução de Χριστοῦ na bênção final
  choice: o Messias
  alternative: Cristo
  rationale: Χριστός conserva aqui valor titular; 'Messias' comunica o significado do título, enquanto a forma tradicional 'Cristo' é registrada em nota.
- issue: Abrangência de ἀδελφοῖς
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A forma grega é masculina plural, mas pode dirigir-se à comunidade inteira; a tradução principal preserva a forma, e a nota explicita o possível alcance inclusivo.
- issue: Sentido de πίστις
  choice: fé
  alternative: fidelidade ou confiança
  rationale: '''Fé'' é a leitura lexical padrão neste contexto, mas πίστις admite as nuances de fidelidade e confiança, preservadas em nota.'
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A concisão da bênção grega foi preservada; 'da parte de' evita uma sequência portuguesa pouco natural com 'de Deus Pai'.
