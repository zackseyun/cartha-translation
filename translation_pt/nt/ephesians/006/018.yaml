id: EPH.6.18
reference: Ephesians 6:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ πάσης προσευχῆς καὶ δεήσεως, προσευχόμενοι ἐν παντὶ καιρῷ ἐν πνεύματι, καὶ εἰς ⸀αὐτὸ ἀγρυπνοῦντες ἐν πάσῃ προσκαρτερήσει καὶ δεήσει περὶ πάντων τῶν ἁγίων,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/018.yaml
  text: with every prayer and petition, praying at all times in the Spirit, and for this very thing staying alert with all perseverance in petition for all the saints,
translation:
  language: pt
  text: com toda oração e súplica, orando em todo tempo no Espírito[a] e, para isso mesmo, mantendo-se vigilantes com toda perseverança e súplica por todos os santos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em espírito”. O grego também permite uma leitura mais geral, embora, neste contexto, provavelmente se refira ao Espírito Santo.
    reason: alternative_reading
  - marker: b
    text: Aqui, “santos” significa todo o povo santo de Deus, isto é, todos os que creem.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πάσης προσευχῆς καὶ δεήσεως
  choice: com toda oração e súplica
  rationale: διά com genitivo expressa aqui meio ou modo. “Com” mantém essa relação de forma natural em português. “Oração” traduz o termo geral προσευχή, enquanto “súplica” distingue δέησις como pedido insistente ou específico.
- source_word: προσευχόμενοι
  choice: orando
  rationale: O particípio presente dá continuidade à exortação do contexto anterior; o gerúndio preserva esse fluxo em português.
- source_word: ἐν παντὶ καιρῷ
  choice: em todo tempo
  rationale: 'A expressão comunica abrangência: em cada ocasião ou a todo momento. “Em todo tempo” é clara, corrente no registro bíblico e próxima da forma grega.'
- source_word: ἐν πνεύματι
  choice: no Espírito
  rationale: O contexto imediato e o uso paulino favorecem a referência ao Espírito Santo. A nota preserva a possibilidade gramatical de uma leitura mais geral.
- source_word: εἰς αὐτὸ
  choice: para isso mesmo
  rationale: A expressão indica o propósito ou alvo do que acaba de ser dito, e αὐτό acrescenta ênfase. “Para isso mesmo” conserva essa força sem se tornar obscuro.
- source_word: ἀγρυπνοῦντες
  choice: mantendo-se vigilantes
  rationale: O particípio descreve vigilância contínua e atenta. A formulação portuguesa mantém tanto a duração quanto a imagem de estar alerta.
- source_word: ἐν πάσῃ προσκαρτερήσει καὶ δεήσει
  choice: com toda perseverança e súplica
  rationale: A tradução preserva a coordenação explícita entre προσκαρτέρησις e δέησις, sem excluir a possibilidade de que a perseverança caracterize a súplica. “Perseverança” expressa constância dedicada.
- source_word: περὶ πάντων τῶν ἁγίων
  choice: por todos os santos
  rationale: No uso paulino, ἅγιοι designa todos os que pertencem a Deus como seu povo consagrado. “Santos” preserva o termo tradicional, enquanto a nota evita a leitura posterior de uma categoria restrita.
theological_decisions:
- issue: Referente de πνεύματι
  choice: Espírito Santo (“no Espírito”)
  alternative: espírito humano ou disposição espiritual (“em espírito”)
  rationale: A proximidade de “a espada do Espírito” em Efésios 6:17 e o uso paulino da oração associada ao Espírito tornam a referência ao Espírito Santo a leitura mais provável. Como o grego não traz artigo e admite uma leitura mais geral, a alternativa é registrada em nota.
- issue: Sentido de ἅγιοι
  choice: todo o povo santo de Deus, isto é, todos os que creem
  alternative: um grupo restrito de santos reconhecidos posteriormente pela Igreja
  rationale: Em Paulo, o termo normalmente abrange a comunidade inteira dos que pertencem a Deus, e não uma categoria eclesiástica posterior.
- issue: Relação entre προσκαρτερήσει e δεήσει
  choice: 'dois elementos coordenados: “perseverança e súplica”'
  alternative: 'hendíade: “perseverança na súplica”'
  rationale: O καί grego coordena formalmente os substantivos. A tradução mantém essa estrutura e sua possível tensão sem impor a leitura de hendíade, embora o sentido permita entender que a perseverança acompanha e qualifica a súplica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o encadeamento participial do grego e o vocabulário bíblico reconhecível, esclarecendo em notas apenas ambiguidades reais ou possíveis mal-entendidos.
