id: EPH.6.9
reference: Ephesians 6:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ οἱ κύριοι, τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς, ἀνιέντες τὴν ἀπειλήν, εἰδότες ὅτι καὶ ⸂αὐτῶν καὶ ὑμῶν⸃ ὁ κύριός ἐστιν ἐν οὐρανοῖς, καὶ προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/009.yaml
  text: And masters[a], do the same things toward them, giving up threatening, knowing that both their Master and yours is in heaven[c][b], and there is no partiality with him.
translation:
  language: pt
  text: E vocês, senhores, façam o mesmo para com eles[a], deixando de lado as ameaças[b], sabendo que o Senhor deles e de vocês está nos céus[c] e que, diante dele, não há parcialidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tratem-nos da mesma maneira”. O grego retoma de perto a instrução anterior e enfatiza a reciprocidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “parem de ameaçá-los”. O particípio grego pode indicar cessar ou abandonar a prática das ameaças.'
    reason: lexical_alternative
  - marker: c
    text: 'Também se pode traduzir: “no céu”. O grego emprega o plural, “nos céus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριοι
  choice: senhores
  rationale: No código doméstico, refere-se aos senhores humanos em relação às pessoas escravizadas mencionadas no contexto. “Senhores” preserva o papel social histórico e também permite perceber a repetição retórica de κύριος mais adiante.
- source_word: τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς
  choice: façam o mesmo para com eles
  rationale: Mantém a ligação verbal com as instruções anteriores e ressalta a reciprocidade exigida, em português claro e digno.
- source_word: ἀνιέντες τὴν ἀπειλήν
  choice: deixando de lado as ameaças
  rationale: Expressa a ideia de abandonar ou cessar a prática de ameaçar. O plural idiomático comunica melhor em português a prática habitual indicada pelo substantivo abstrato singular.
- source_word: εἰδότες
  choice: sabendo
  rationale: Preserva a forma participial e deixa perceptível seu valor causal como fundamento da ordem.
- source_word: καὶ αὐτῶν καὶ ὑμῶν ὁ κύριος
  choice: o Senhor deles e de vocês
  rationale: Reproduz os dois grupos coordenados e emprega “Senhor” como título divino, ao mesmo tempo que conserva a correspondência lexical com os “senhores” humanos no início do versículo.
- source_word: ἐν οὐρανοῖς
  choice: nos céus
  rationale: Preserva o plural do grego, que é natural e tradicional também em português.
- source_word: προσωπολημψία
  choice: parcialidade
  rationale: Termo moderno e claro para favorecimento injusto, com o registro moral e judicial adequado.
- source_word: παρ’ αὐτῷ
  choice: diante dele
  rationale: Comunica naturalmente a ideia de que não há parcialidade na presença ou no juízo de Deus.
theological_decisions:
- issue: A repetição de κύριος para referentes humanos e divino
  choice: Traduzir κύριοι por “senhores” e o κύριος divino por “Senhor”
  alternative: Usar “amos” para os humanos ou “Mestre” para o referente divino
  rationale: 'A escolha distingue graficamente o título divino pela maiúscula, mas preserva em português a repetição lexical e o contraste retórico: os senhores terrenos também estão sujeitos ao Senhor celestial.'
- issue: Terminologia da estrutura social antiga
  choice: Usar “senhores” no contexto da relação com pessoas escravizadas
  alternative: Usar “patrões”, “empregadores” ou “donos”
  rationale: “Patrões” e “empregadores” modernizariam anacronicamente a relação; “donos” estreitaria o sentido do papel relacional expresso por κύριοι. “Senhores” preserva melhor o contexto histórico sem suavizá-lo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Para com eles” conserva a direção relacional de πρός sem perder naturalidade. A formulação mantém a tensão histórica do código doméstico e a igualdade de todos perante o Senhor, sem substituir a relação antiga por categorias trabalhistas modernas.
