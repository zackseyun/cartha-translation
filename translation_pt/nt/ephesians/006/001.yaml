  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν ὑμῶν ἐν κυρίῳ, τοῦτο γάρ ἐστιν δίκαιον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/001.yaml
  text: Children[a], obey your parents in the Lord, for this is right.
translation:
  language: pt
  text: Filhos, obedeçam a seus pais no Senhor[a], pois isso é justo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como quem pertence ao Senhor” ou “em união com o Senhor”. A expressão “no Senhor” pode indicar a esfera ou a maneira da obediência e também pode sugerir que essa obediência é delimitada pela lealdade ao Senhor.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: Filhos
  rationale: O plural vocativo dirige-se diretamente aos membros mais jovens da família. “Filhos” é natural em português e, no plural genérico, inclui filhos e filhas.
- source_word: ὑπακούετε
  choice: obedeçam
  rationale: O imperativo presente exige obediência responsiva e contínua, não apenas escutar. “Obedeçam” expressa claramente a força da ordem.
- source_word: γονεῦσιν
  choice: pais
  rationale: O substantivo plural designa coletivamente pai e mãe. “Pais” é a forma idiomática e precisa em português.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: 'Conserva a formulação paulina compacta e sua abertura interpretativa: pode indicar a esfera, a maneira ou o enquadramento da obediência pela lealdade ao Senhor.'
- source_word: δίκαιον
  choice: justo
  rationale: Neste contexto, indica aquilo que é moralmente correto e apropriado. “Justo” mantém a concisão e a dignidade do original.
theological_decisions:
- issue: Alcance da expressão ἐν κυρίῳ (“no Senhor”)
  choice: Ligá-la ao mandamento — “obedeçam a seus pais no Senhor” — sem explicitar uma única nuance.
  alternative: Entender que os filhos que estão no Senhor devem obedecer aos pais, ou parafrasear como “obedeçam como convém no Senhor”.
  rationale: A construção grega liga mais naturalmente a expressão ao imperativo, mas não define se ela indica identidade, esfera, maneira ou um limite implícito decorrente da lealdade ao Senhor. A tradução compacta preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Filhos” funciona como plural inclusivo no contexto familiar; “seus pais” evita ambiguidade e soa natural. A ordem e a concisão do grego foram preservadas.
