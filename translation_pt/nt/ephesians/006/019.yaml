  text: καὶ ὑπὲρ ἐμοῦ, ἵνα μοι δοθῇ λόγος ἐν ἀνοίξει τοῦ στόματός μου, ἐν παρρησίᾳ γνωρίσαι τὸ μυστήριον τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/019.yaml
  text: and for me[a], that words may be given to me in opening my mouth, to make known with boldness the mystery of the gospel[e][d][c][b],
translation:
  language: pt
  text: e também por mim, para que, ao abrir a boca, me seja dada uma mensagem[a] e eu dê a conhecer, com ousadia[b], o mistério do evangelho[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me sejam dadas palavras” ou “me seja dada uma palavra”.
    reason: lexical_alternative
  - marker: b
    text: Ou “com franqueza”, “com confiança” ou “ousadamente”.
    reason: lexical_alternative
  - marker: c
    text: Ou “da boa notícia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑπὲρ ἐμοῦ
  choice: e também por mim
  rationale: No contexto do pedido de oração iniciado no versículo anterior, ὑπέρ com o genitivo significa naturalmente “por” ou “em favor de”. “Também” explicita o valor aditivo de καί sem inserir um novo verbo no versículo.
- source_word: ἵνα μοι δοθῇ λόγος
  choice: para que me seja dada a mensagem
  rationale: ἵνα introduz o conteúdo ou propósito da oração pedida. Aqui, λόγος é a fala ou mensagem concedida a Paulo, não um título como “a Palavra”. “Mensagem” comunica com naturalidade o singular e o conteúdo significativo da fala.
- source_word: ἐν ἀνοίξει τοῦ στόματός μου
  choice: ao abrir a boca
  rationale: A expressão preserva a imagem concreta do grego e, em português natural, indica o momento em que Paulo começa a falar.
- source_word: γνωρίσαι
  choice: a fim de tornar conhecido
  rationale: O infinitivo expressa a finalidade ligada à concessão da mensagem. “Tornar conhecido” corresponde diretamente ao verbo sem restringi-lo à ideia mais específica de pregação formal.
- source_word: ἐν παρρησίᾳ
  choice: com ousadia
  rationale: παρρησία reúne as ideias de franqueza, abertura e coragem no falar. “Com ousadia” conserva a forma nominal e o destaque retórico.
- source_word: τὸ μυστήριον
  choice: o mistério
  rationale: No uso paulino, μυστήριον designa um propósito divino antes oculto e agora revelado, não um enigma insolúvel. “Mistério” mantém essa densidade teológica consagrada.
- source_word: τοῦ εὐαγγελίου
  choice: do evangelho
  rationale: “Evangelho” é corrente e compreensível em português e preserva a densidade do termo paulino; literalmente, trata-se da boa notícia.
theological_decisions:
- issue: Sentido de λόγος no pedido de oração de Paulo
  choice: mensagem
  alternative: palavra; palavras; capacidade de falar
  rationale: O singular λόγος aponta aqui para fala significativa ou conteúdo comunicado. “Mensagem” evita sugerir que Paulo pede apenas capacidade vocal, mas não atribui ao texto uma doutrina técnica de inspiração.
- issue: Relação sintática de ἐν ἀνοίξει τοῦ στόματός μου
  choice: ao abrir a boca
  alternative: na abertura da minha boca; quando eu abrir a boca
  rationale: A tradução mantém a ligação entre a concessão da mensagem e o início da fala, sem decidir além do necessário se a expressão é estritamente temporal ou circunstancial.
- issue: Força de παρρησία
  choice: com ousadia
  alternative: com confiança; com franqueza; ousadamente
  rationale: A formulação preserva a tensão entre coragem e liberdade franca na comunicação pública, sem reduzir o termo a um sentimento interior de autoconfiança.
- issue: Sentido paulino de μυστήριον
  choice: mistério
  alternative: segredo
  rationale: “Mistério” mantém a noção de um propósito de Deus antes oculto e agora dado a conhecer, sem sugerir um segredo permanentemente reservado ou um problema indecifrável.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O versículo conserva sua ligação coordenada com o contexto anterior por meio de “e também por mim”. A ordem foi levemente ajustada para fluência, mantendo a imagem de abrir a boca e a finalidade de dar a conhecer o mistério.
