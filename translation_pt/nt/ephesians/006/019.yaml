    issue: Alternativa de nota «capacidade de falar» é excessivamente interpretativa
    rationale: λόγος neste contexto designa fala, palavra ou mensagem concedida, não especificamente a capacidade de falar. Uma alternativa como «me seja dada uma palavra» conserva melhor o campo semântico.
