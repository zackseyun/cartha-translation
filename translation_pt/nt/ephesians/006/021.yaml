id: EPH.6.21
reference: Ephesians 6:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἵνα δὲ ⸂εἰδῆτε καὶ ὑμεῖς⸃ τὰ κατ’ ἐμέ, τί πράσσω, πάντα ⸂γνωρίσει ὑμῖν⸃ Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/021.yaml
  text: So that you also may know the things concerning me[a], what I am doing, Tychicus, the beloved brother and faithful minister in the Lord[b], will make everything known to you.
translation:
  language: pt
  text: Mas, para que vocês também saibam o que se passa comigo[a] e o que estou fazendo, Tíquico, o amado irmão e fiel ministro[b] no Senhor, contará tudo a vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as minhas circunstâncias”; a expressão grega se refere literalmente a “as coisas a meu respeito”.
    reason: lexical_alternative
  - marker: b
    text: Ou “fiel servo”; o termo grego também pode ser traduzido como “servo” ou, em certos contextos, “diácono”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἵνα δὲ
  choice: Mas, para que
  rationale: ἵνα introduz a finalidade, e δέ acrescenta uma conexão adversativa leve com o contexto anterior. A formulação é natural em português e preserva ambas as funções.
- source_word: εἰδῆτε καὶ ὑμεῖς
  choice: vocês também saibam
  rationale: 'καί com o pronome explícito e enfático indica inclusão adicional: os destinatários também devem saber.'
- source_word: τὰ κατ’ ἐμέ
  choice: o que se passa comigo
  rationale: Expressa em português corrente a locução grega referente aos assuntos ou às circunstâncias de Paulo, sem restringi-la apenas ao seu estado pessoal.
- source_word: τί πράσσω
  choice: o que estou fazendo
  rationale: Tradução direta e natural de πράσσω neste contexto, indicando a atividade ou ocupação de Paulo.
- source_word: πάντα γνωρίσει ὑμῖν
  choice: contará tudo a vocês
  rationale: γνωρίζω significa dar a conhecer ou informar. Aqui, como Tíquico transmitirá notícias, 'contará tudo a vocês' é idiomático e conserva o alcance de πάντα.
- source_word: Τυχικὸς
  choice: Tíquico
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: o amado irmão
  rationale: Preserva tanto a afeição de ἀγαπητός quanto a linguagem familiar cristã de ἀδελφός.
- source_word: πιστὸς διάκονος
  choice: fiel ministro
  rationale: διάκονος descreve aqui o serviço confiável de Tíquico sem indicar inequivocamente o ofício eclesiástico formal de diácono.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Mantém a expressão paulina que indica esfera ou relação com o Senhor.
theological_decisions:
- issue: Sentido de διάκονος aplicado a Tíquico
  choice: ministro
  alternative: servo; diácono
  rationale: O contexto apresenta Tíquico como colaborador confiável encarregado de transmitir notícias. Não há indicação inequívoca de um cargo eclesiástico formal; 'ministro' preserva a ideia de serviço sem impor essa conclusão.
- issue: Tradução de ἀδελφός
  choice: irmão
  alternative: companheiro; irmão na fé
  rationale: Tíquico é um indivíduo do sexo masculino, e 'irmão' preserva com precisão a metáfora familiar cristã.
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Mestre
  rationale: Na expressão paulina ἐν κυρίῳ, κύριος funciona como o título cristológico usual; 'Senhor' preserva essa linguagem sem explicitação adicional.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. Emprega 'vocês' para o plural e mantém as expressões cristãs tradicionais 'irmão' e 'no Senhor'. A redação procura equilibrar proximidade ao grego e clareza idiomática.
