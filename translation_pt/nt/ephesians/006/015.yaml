id: EPH.6.15
reference: Ephesians 6:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὑποδησάμενοι τοὺς πόδας ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/015.yaml
  text: and having shod your feet with the readiness of the gospel of peace,[a]
translation:
  language: pt
  text: e tendo calçado os pés com a prontidão do evangelho da paz,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “preparação”; possivelmente, “a prontidão para anunciar o evangelho da paz” ou “a base firme proporcionada pelo evangelho da paz”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδησάμενοι
  choice: tendo calçado
  rationale: O particípio aoristo médio descreve o ato de pôr calçado. “Tendo calçado” preserva tanto a imagem do equipamento para os pés quanto a estrutura participial, em português natural.
- source_word: τοὺς πόδας
  choice: os pés
  rationale: O grego menciona diretamente os pés, não as sandálias; a tradução mantém explícita a metáfora corporal.
- source_word: ἐν
  choice: com
  rationale: Neste contexto, ἐν indica aquilo com que os pés são equipados. “Com” é idiomático em português e preserva essa relação instrumental.
- source_word: ἑτοιμασίᾳ
  choice: prontidão
  rationale: O substantivo pode indicar prontidão ou preparação. “Prontidão” é conciso e não decide se se trata especificamente da disposição para anunciar ou da firmeza proporcionada pelo evangelho.
- source_word: εὐαγγελίου
  choice: evangelho
  rationale: “Evangelho” é o equivalente paulino consagrado e continua amplamente compreensível em português moderno.
- source_word: εἰρήνης
  choice: paz
  rationale: Mantém o sentido direto de εἰρήνη e a cadeia genitiva compacta, na qual “da paz” qualifica “evangelho”.
theological_decisions:
- issue: Sentido de ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης
  choice: os pés são equipados com a prontidão associada ao evangelho da paz ou proveniente dele
  alternative: a prontidão para anunciar o evangelho da paz; ou a base firme proporcionada pelo evangelho da paz
  rationale: A expressão grega é condensada e permite mais de uma interpretação. O texto principal conserva a ambiguidade por meio de “prontidão do evangelho da paz”, sem acrescentar explicitamente a ideia de proclamação nem substituir a prontidão pela imagem interpretativa de firmeza.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A formulação acompanha a sequência da metáfora da armadura e mantém a compactação e a ambiguidade genuínas do grego.
