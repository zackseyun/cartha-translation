source:
  edition: SBLGNT
  text: ὑπὲρ οὗ πρεσβεύω ἐν ἁλύσει, ἵνα ἐν αὐτῷ παρρησιάσωμαι ὡς δεῖ με λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/020.yaml
  text: for which I am an ambassador in chains[a], so that in it I may speak boldly[c][b], as I ought to speak.
translation:
  language: pt
  text: pelo qual sou embaixador em correntes[a], para que, ao anunciá-lo, eu fale com coragem, como devo falar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “numa corrente”, imagem do aprisionamento de Paulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ οὗ
  choice: pelo qual
  rationale: O pronome relativo é neutro singular e retoma mais naturalmente “o mistério do evangelho” do versículo anterior. “Pelo qual” preserva a relação de causa ou interesse expressa por ὑπέρ.
- source_word: πρεσβεύω
  choice: sou embaixador
  rationale: Mantém a imagem de um enviado oficial que representa e comunica uma mensagem.
- source_word: ἐν ἁλύσει
  choice: em correntes
  rationale: Embora o grego empregue o singular, a expressão portuguesa idiomática “em correntes” conserva a imagem concreta do aprisionamento.
- source_word: ἵνα
  choice: para que
  rationale: Introduz com clareza a finalidade do pedido de oração.
- source_word: ἐν αὐτῷ
  choice: ao anunciá-lo
  rationale: O pronome é neutro e provavelmente se refere ao mistério do evangelho. A formulação explicita de modo natural a relação contextual sem introduzir um referente pessoal.
- source_word: παρρησιάσωμαι
  choice: eu fale com coragem
  rationale: Expressa franqueza, abertura e destemor na fala, em português atual e digno.
- source_word: ὡς δεῖ με λαλῆσαι
  choice: como devo falar
  rationale: Preserva a ideia de necessidade ou obrigação e também a referência explícita ao ato de falar.
theological_decisions:
- issue: Referente de οὗ e αὐτῷ
  choice: Ambos são entendidos como referências neutras ao mistério do evangelho mencionado no versículo anterior.
  alternative: Entender a construção de modo mais pessoal, especialmente αὐτῷ como “nele”.
  rationale: As formas gregas fornecidas são gramaticalmente neutras, favorecendo o evangelho ou seu mistério como antecedente e evitando importar um referente cristológico não indicado pela morfologia.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Embaixador em correntes” preserva o contraste marcante entre a autoridade da missão e a condição de prisioneiro. A expressão “ao anunciá-lo” comunica de forma natural o provável sentido contextual de ἐν αὐτῷ.
