id: EPH.6.5
reference: Ephesians 6:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οἱ δοῦλοι, ὑπακούετε τοῖς ⸂κατὰ σάρκα κυρίοις⸃ μετὰ φόβου καὶ τρόμου ἐν ἁπλότητι τῆς καρδίας ὑμῶν ὡς τῷ Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/005.yaml
  text: Slaves[a], obey your masters according to the flesh with fear and trembling, in sincerity of your heart, as to Messiah[b],
translation:
  language: pt
  text: Escravos, obedeçam aos seus senhores segundo a carne[a], com temor e tremor, na sinceridade do coração de vocês, como ao Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, senhores apenas no âmbito terreno ou humano.
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “Cristo”; aqui traduzido como “Messias” porque o termo funciona como título.'
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλοι
  choice: Escravos
  rationale: O termo designa pessoas submetidas à escravidão; neste código doméstico, “escravos” expressa com transparência a realidade social, sem suavizá-la como “servos”.
- source_word: ὑπακούετε
  choice: obedeçam
  rationale: O imperativo presente exige obediência contínua; “obedeçam” é claro e natural neste contexto.
- source_word: κατὰ σάρκα
  choice: segundo a carne
  rationale: A formulação conserva a expressão grega e o contraste entre a autoridade humana e temporal dos senhores e a relação com o Messias. A nota esclarece o sentido sem eliminar a imagem no texto.
- source_word: κυρίοις
  choice: senhores
  rationale: No contexto da escravidão doméstica, refere-se aos senhores humanos dos escravos. “Senhores” mantém a relação social e evita inserir no texto a explicação mais específica “donos”.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: com temor e tremor
  rationale: Preserva a expressão enfática e sua ressonância em outros textos paulinos.
- source_word: ἐν ἁπλότητι τῆς καρδίας ὑμῶν
  choice: na sinceridade do coração de vocês
  rationale: ἁπλότης comunica sinceridade e inteireza de intenção; esta formulação é natural em português e conserva a dimensão interior.
- source_word: ὡς τῷ Χριστῷ
  choice: como ao Messias
  rationale: ὡς mantém a comparação sem identificar os senhores humanos com o Messias; Χριστός é traduzido como o título “Messias”.
theological_decisions:
- issue: Tradução de Χριστῷ
  choice: Messias
  alternative: Cristo
  rationale: O termo tem valor titular, e “Messias” traduz seu sentido em vez de apenas reproduzir a forma tradicional.
- issue: Tradução de δοῦλοι no contexto escravista
  choice: Escravos
  alternative: servos
  rationale: O contexto trata de pessoas sob o domínio de senhores; “escravos” não encobre a realidade histórica da escravidão.
- issue: Sentido de κατὰ σάρκα
  choice: segundo a carne
  alternative: humanos
  rationale: A tradução formal preserva a imagem e a possível tensão do contraste paulino; a nota explica que se trata de autoridade no âmbito terreno ou humano.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantém-se “segundo a carne” para preservar a formulação e a tensão do original, acompanhada de esclarecimento em nota.
