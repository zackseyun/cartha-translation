  text: εἰδότες ὅτι ⸂ἕκαστος, ὃ ἂν⸃ ποιήσῃ ἀγαθόν, τοῦτο ⸀κομίσεται ⸀παρὰ κυρίου, εἴτε δοῦλος εἴτε ἐλεύθερος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/008.yaml
  text: knowing that each one[a], whatever good he does, this he will receive back from the Lord[b], whether slave or free.
translation:
  language: pt
  text: sabendo que cada um, seja qual for o bem que fizer, isso receberá de volta[a] do Senhor, seja escravo, seja livre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será recompensado por isso pelo Senhor”. O verbo grego pode indicar receber em retorno aquilo que corresponde à ação praticada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: sabendo
  rationale: Preserva a forma participial e sua ligação com a exortação anterior, sem tornar explicitamente causal uma relação que o grego deixa implícita.
- source_word: ἕκαστος
  choice: cada um
  rationale: Mantém a ênfase distributiva e singular do termo grego.
- source_word: ὃ ἂν ποιήσῃ ἀγαθόν
  choice: seja qual for o bem que fizer
  rationale: Expressa a indefinição da construção com ἄν e conserva o caráter moralmente bom da ação.
- source_word: τοῦτο
  choice: isso
  rationale: Retoma diretamente o bem praticado, preservando o demonstrativo enfático.
- source_word: κομίσεται
  choice: receberá de volta
  rationale: Comunica a ideia de receber em retorno aquilo que corresponde à ação, sem reduzir a expressão a uma transação comercial.
- source_word: παρὰ κυρίου
  choice: do Senhor
  rationale: Παρά com o genitivo indica a fonte; “Senhor” preserva o peso teológico do provável referente divino.
- source_word: δοῦλος
  choice: escravo
  rationale: O contraste explícito com ἐλεύθερος torna central a condição social de escravidão; “servo” atenuaria essa realidade.
- source_word: ἐλεύθερος
  choice: livre
  rationale: Reproduz de modo conciso o contraste de condição social com “escravo”.
theological_decisions:
- issue: Tradução de δοῦλος no contexto das relações domésticas
  choice: escravo
  alternative: servo
  rationale: O contraste com “livre” exige preservar a distinção histórica e social entre escravidão e liberdade.
- issue: Referente e tradução de κυρίου
  choice: Senhor
  alternative: senhor ou amo
  rationale: Embora o contexto mencione senhores humanos, aqui a fonte da retribuição é o Senhor divino; a tradução mantém esse provável referente sem apagar a ressonância do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “cada um, seja qual for o bem que fizer” conserva a ênfase distributiva do grego; “seja escravo, seja livre” mantém o paralelismo conciso do original.
