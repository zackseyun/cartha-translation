source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔστιν ἡμῖν ἡ πάλη πρὸς αἷμα καὶ σάρκα, ἀλλὰ πρὸς τὰς ἀρχάς, πρὸς τὰς ἐξουσίας, πρὸς τοὺς κοσμοκράτορας τοῦ ⸀σκότους τούτου, πρὸς τὰ πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/012.yaml
  text: For our struggle is not against flesh and blood[a], but against the rulers, against the authorities, against the world-rulers of this darkness[c][b], against the spiritual forces of evil in the heavenly realms.
translation:
  language: pt
  text: pois a nossa luta não é contra carne e sangue[a], mas contra os governantes, contra as autoridades, contra os dominadores mundiais destas trevas[b], contra as forças espirituais do mal nas regiões celestiais[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o nosso combate não é contra carne e sangue”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os dominadores deste mundo de trevas”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “nos lugares celestiais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλη
  choice: luta
  rationale: O termo designa luta corporal ou combate próximo. “Luta” preserva a metáfora e é natural no português atual; “combate” seria possível, mas menos próximo da imagem de enfrentamento corpo a corpo.
- source_word: πρὸς αἷμα καὶ σάρκα
  choice: contra carne e sangue
  rationale: Embora o grego tenha literalmente “sangue e carne”, a ordem “carne e sangue” corresponde ao idioma português consagrado e se refere a seres humanos, sem introduzir essa explicação no texto.
- source_word: ἀρχάς
  choice: governantes
  rationale: No contexto, o termo indica poderes que governam. “Governantes” é claro e atual, enquanto “principados” é tradicional, porém menos transparente ao leitor comum.
- source_word: ἐξουσίας
  choice: autoridades
  rationale: Expressa autoridade ou poder delegado e mantém a distinção lexical em relação a ἀρχάς.
- source_word: κοσμοκράτορας
  choice: dominadores deste mundo
  rationale: O raro composto denota dominadores do mundo ou do cosmos. A formulação preserva a força governante do termo e permite que “de trevas” qualifique “este mundo”, uma relação sintaticamente possível no grego.
- source_word: τοῦ σκότους τούτου
  choice: deste mundo de trevas
  rationale: A expressão pode ser entendida como “desta escuridão” ou, em ligação com o componente κόσμος de κοσμοκράτορας, “deste mundo de trevas”. A escolha produz português natural sem acrescentar “presente”, que não está explícito.
- source_word: τὰ πνευματικὰ τῆς πονηρίας
  choice: as forças espirituais do mal
  rationale: O adjetivo neutro plural substantivado aponta aqui para realidades ou poderes espirituais. “Forças espirituais” torna o referente inteligível sem especificá-lo além do que o contexto permite.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: nas regiões celestiais
  rationale: A expressão recorrente em Efésios indica a esfera celestial. “Regiões celestiais” é clara, digna e suficientemente ampla para seus diferentes usos na carta.
theological_decisions:
- issue: Natureza dos adversários mencionados
  choice: A tradução apresenta adversários espirituais supra-humanos.
  alternative: Os termos poderiam ser entendidos primariamente como governantes e estruturas humanas, ou como poderes espirituais juntamente com suas manifestações terrenas.
  rationale: A sequência culmina em τὰ πνευματικὰ τῆς πονηρίας e em uma localização celestial, favorecendo adversários espirituais. O texto não exclui possíveis manifestações históricas ou institucionais desses poderes.
- issue: Sentido de σάρξ nesta expressão
  choice: “Carne” é mantida dentro da expressão “carne e sangue”.
  alternative: Explicitar como “seres humanos” ou interpretar como “natureza pecaminosa”.
  rationale: Aqui σάρξ integra um modo de dizer referente à humanidade mortal e corpórea; não designa especificamente uma natureza pecaminosa.
- issue: Relação de τοῦ σκότους τούτου com κοσμοκράτορας
  choice: “dominadores deste mundo de trevas”
  alternative: “dominadores mundiais destas trevas” ou “dominadores deste mundo, destas trevas”.
  rationale: A construção grega permite tensão entre “dominadores desta escuridão” e a ideia de dominadores do mundo caracterizado por trevas. A redação escolhida é natural em português, e a alternativa mais formal é registrada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é digno e direto. A repetição de “contra” reproduz a ênfase retórica do original. “Pois” mantém a ligação explicativa de ὅτι com o contexto anterior.
