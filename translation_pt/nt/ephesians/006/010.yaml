  text: Finally[a], be strengthened in the Lord and in the strength of his might.
translation:
  language: pt
  text: Finalmente[a], sejam fortalecidos[b] no Senhor e na força do seu poder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos antigos não trazem “Finalmente”.
    reason: textual_variant
  - marker: b
    text: 'Ou: “sejam fortes no Senhor”. O verbo grego também pode ser expresso assim de modo mais idiomático, mas “sejam fortalecidos” preserva melhor sua nuance passiva ou receptiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: Finalmente
  rationale: Funciona naturalmente como marcador discursivo que introduz a seção conclusiva da carta, sem a rigidez de uma tradução como “quanto ao mais”.
- source_word: ἐνδυναμοῦσθε
  choice: sejam fortalecidos
  rationale: 'Preserva a forma de exortação e a nuance passiva ou receptiva: os leitores recebem força, em vez de simplesmente produzirem coragem por si mesmos.'
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Mantém a linguagem relacional ou de esfera expressa por ἐν sem especificar indevidamente que se trata apenas de instrumento ou agente.
- source_word: κράτει
  choice: força
  rationale: Expressa poder efetivo ou vigor manifesto e forma, em português, uma combinação compreensível com ἰσχύος.
- source_word: ἰσχύος
  choice: poder
  rationale: Distingue o termo de κράτος e preserva a acumulação enfática de vocabulário de poder no grego.
- source_word: αὐτοῦ
  choice: seu
  rationale: Retoma naturalmente “o Senhor”; no contexto imediato, o referente é claro.
theological_decisions:
- issue: Voz e fonte do fortalecimento em ἐνδυναμοῦσθε
  choice: 'Exortação receptiva: “sejam fortalecidos”'
  alternative: 'Exortação idiomática ativa: “sejam fortes”'
  rationale: A forma verbal admite valor passivo ou médio, mas a tradução passiva conserva melhor a dependência da força encontrada no Senhor sem definir além do texto o modo exato dessa atuação.
- issue: Sentido de ἐν em ἐν κυρίῳ
  choice: “no Senhor”
  alternative: “pelo Senhor”
  rationale: “No Senhor” preserva a linguagem paulina de esfera ou relação e evita resolver a expressão exclusivamente como agência instrumental.
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” é a equivalência natural neste contexto paulino e mantém a referência cristológica sem expansão interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Sejam fortalecidos” conserva deliberadamente a nuance receptiva do verbo; “na força do seu poder” mantém a ênfase acumulativa do grego, embora soe mais solene que a fala cotidiana.
