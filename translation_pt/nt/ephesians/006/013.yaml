  terminology: «Armadura de Deus», «dia mau», «resistir» e «permanecer firmes» são escolhas terminologicamente adequadas. A nota de «dia mau» preserva corretamente a abertura da expressão, e a nota de «armadura completa» esclarece πανοπλία sem impor uma interpretação teológica ao genitivo.
