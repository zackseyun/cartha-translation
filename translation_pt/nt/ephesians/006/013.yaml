id: EPH.6.13
reference: Ephesians 6:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἀναλάβετε τὴν πανοπλίαν τοῦ θεοῦ, ἵνα δυνηθῆτε ἀντιστῆναι ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ καὶ ἅπαντα κατεργασάμενοι στῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/013.yaml
  text: Therefore take up the full armor of God[a], so that you may be able to withstand in the evil day, and having done everything[d][c][b], to stand firm.
translation:
  language: pt
  text: Por isso, tomem toda a armadura de Deus[a], para que possam resistir no dia mau[b] e, depois de terem feito tudo[c], permanecer firmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a armadura completa de Deus”. O termo grego se refere a todo o equipamento de um soldado.
    reason: lexical_alternative
  - marker: b
    text: A expressão “dia mau” pode se referir, de modo geral, a um período de intensa maldade, provação ou conflito, sem indicar necessariamente apenas um acontecimento específico do fim dos tempos.
    reason: alternative_reading
  - marker: c
    text: Ou “depois de terem realizado tudo” ou “depois de terem levado tudo a cabo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural a conclusão que decorre da exortação anterior.
- source_word: ἀναλάβετε
  choice: tomem
  rationale: O imperativo indica pegar ou tomar o equipamento; em português, “tomem” preserva a imagem militar sem confundi-lo com o verbo “vestir”.
- source_word: τὴν πανοπλίαν τοῦ θεοῦ
  choice: toda a armadura de Deus
  rationale: πανoπλία designa o equipamento completo do soldado. “De Deus” mantém aberto se a armadura pertence a Deus, procede dele ou é fornecida por ele.
- source_word: ἵνα δυνηθῆτε
  choice: para que possam
  rationale: Reproduz com naturalidade tanto a finalidade quanto a capacidade expressas pela oração grega.
- source_word: ἀντιστῆναι
  choice: resistir
  rationale: No contexto militar, significa opor-se e não ceder diante do ataque; “resistir” é claro e idiomático.
- source_word: ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ
  choice: no dia mau
  rationale: Mantém a formulação solene e aberta do grego, sem identificar necessariamente um único evento escatológico.
- source_word: ἅπαντα κατεργασάμενοι
  choice: depois de terem feito tudo
  rationale: Expressa a anterioridade do particípio e preserva a amplitude de κατεργάζομαι, que pode indicar fazer, realizar ou levar a cabo.
- source_word: στῆναι
  choice: permanecer firmes
  rationale: Comunica, no contexto da batalha, a ideia de continuar de pé e manter a posição após ter resistido.
theological_decisions:
- issue: Sentido de “dia mau”
  choice: Mantido como referência geral e aberta a um tempo de maldade, provação ou intenso conflito espiritual.
  alternative: Entendê-lo exclusivamente como um dia escatológico específico ou apenas como uma provação pessoal.
  rationale: A expressão grega não exige que o referente seja limitado a uma dessas leituras.
- issue: Força do genitivo em “armadura de Deus”
  choice: Preservar a construção ampla “de Deus”.
  alternative: Especificar “armadura que pertence a Deus” ou “armadura fornecida por Deus”.
  rationale: O genitivo grego admite nuances relacionadas, e a tradução não deve escolher uma delas de forma indevida.
- issue: Força de στῆναι
  choice: “permanecer firmes”, destacando a manutenção da posição no cenário militar.
  alternative: “ficar de pé” ou simplesmente “permanecer”.
  rationale: A escolha comunica idiomaticamente o resultado de resistir sem introduzir a ideia explícita de conquistar ou vencer.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas naturais para leitores brasileiros. O plural “vocês” fica implícito nas formas verbais. A construção conserva a imagem militar, a abrangência da armadura e as ambiguidades legítimas do texto grego.
