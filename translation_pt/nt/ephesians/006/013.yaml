  source_fidelity: 'A tradução acompanha com precisão a progressão do grego: a inferência («Por isso»), o imperativo para tomar a panóplia divina, a finalidade («para que possam»), a resistência no «dia mau» e o resultado final de manter-se firme. «Toda a armadura de Deus» comunica adequadamente o sentido de equipamento completo sem definir o valor amplo do genitivo.'
