  text: τίμα τὸν πατέρα σου καὶ τὴν μητέρα, ἥτις ἐστὶν ἐντολὴ πρώτη ἐν ἐπαγγελίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/002.yaml
  text: Honor your father and mother—which is the first commandment with a promise—[a]
translation:
  language: pt
  text: Honre seu pai e sua mãe — este é o primeiro mandamento com uma promessa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “o primeiro mandamento em promessa”; o sentido provável é que este é o primeiro mandamento acompanhado de uma promessa.'
    reason: alternativa lexical e preservação da formulação incomum do grego
lexical_decisions:
- source_word: τίμα
  choice: Honre
  rationale: O imperativo de τιμάω exige uma atitude ativa de honra, não apenas estima interior. “Honre” é natural, preciso e preserva o peso ético da citação do Decálogo.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: seu pai e sua mãe
  rationale: Tradução direta e idiomática dos termos familiares, mantendo o possessivo que no grego acompanha explicitamente “pai” e é naturalmente entendido também com “mãe”.
- source_word: ἥτις ἐστίν
  choice: este é
  rationale: Retoma o mandamento recém-citado e introduz a explicação de Paulo. O demonstrativo masculino concorda naturalmente com “mandamento” em português.
- source_word: ἐντολὴ πρώτη
  choice: o primeiro mandamento
  rationale: “Mandamento” preserva a ressonância do Decálogo, e πρώτη tem sentido ordinal, “primeiro”, não necessariamente “mais importante”.
- source_word: ἐν ἐπαγγελίᾳ
  choice: acompanhado de promessa
  rationale: A expressão grega é literalmente “em promessa”, mas no contexto indica que o mandamento vem associado a uma promessa. Esta formulação comunica o sentido com clareza sem acrescentar o artigo indefinido ausente no grego.
theological_decisions:
- issue: Sentido de “primeiro mandamento” e sua relação com a numeração do Decálogo
  choice: “o primeiro mandamento acompanhado de promessa”
  alternative: “o primeiro mandamento na promessa”; “o principal mandamento com promessa”; “o primeiro mandamento da segunda tábua”
  rationale: A tradução mantém πρώτη como ordinal e entende ἐν ἐπαγγελίᾳ como a caracterização do mandamento. Não impõe uma numeração denominacional do Decálogo nem transforma “primeiro” em “principal”.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O travessão marca o comentário explicativo de Paulo. “Honre” conserva a forma tradicional e o caráter ativo do imperativo.
