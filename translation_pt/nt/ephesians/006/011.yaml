id: EPH.6.11
reference: Ephesians 6:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/011.yaml
  text: Put on the full armor of God[b][a], so that you may be able to stand against the schemes of the devil.
translation:
  language: pt
  text: Vistam a armadura completa de Deus[a], para que possam permanecer firmes contra as artimanhas do diabo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a armadura de Deus”. O termo grego se refere ao equipamento completo de um soldado.
    reason: lexical_alternative
  - marker: b
    text: Ou “estratagemas”, “ciladas” ou “métodos ardilosos do diabo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: Vistam
  rationale: O imperativo aoristo médio, na segunda pessoa do plural, ordena que os leitores ponham em si a armadura. “Vistam” é natural em português, mantém a força da ordem e se ajusta à imagem de vestir o equipamento de combate.
- source_word: πανοπλίαν
  choice: toda a armadura
  rationale: O termo designa o equipamento completo de um soldado fortemente armado, não apenas uma peça defensiva. “Toda a armadura” comunica a ideia de totalidade em linguagem clara; a nota explicita a extensão do termo grego.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: A construção genitiva é mantida ampla, sem decidir de modo excessivo se a ênfase recai na posse, na origem ou no fornecimento da armadura.
- source_word: πρὸς τὸ δύνασθαι ὑμᾶς στῆναι
  choice: para que possam ficar firmes
  rationale: A preposição com o infinitivo articular expressa propósito. A formulação é natural em português e preserva tanto a capacidade concedida quanto a finalidade da ordem.
- source_word: στῆναι
  choice: ficar firmes
  rationale: Neste contexto militar, o verbo indica manter a posição e não ceder. “Ficar firmes” torna explícita em português a nuance contextual sem substituir a imagem por “vencer” ou “resistir”.
- source_word: μεθοδείας
  choice: artimanhas
  rationale: O substantivo se refere a métodos ardilosos, planos ou táticas enganosas. “Artimanhas” é atual, compreensível e conserva a conotação de astúcia hostil.
- source_word: τοῦ διαβόλου
  choice: do diabo
  rationale: Neste contexto de conflito espiritual, διάβολος funciona como designação pessoal do adversário maligno, e não apenas como o substantivo comum “caluniador”. “O diabo” é a forma estabelecida e clara em português.
theological_decisions:
- issue: Referente e tradução de διάβολος
  choice: o diabo, como adversário maligno pessoal
  alternative: o caluniador
  rationale: O contexto imediato da luta espiritual em Efésios 6 favorece a referência a um adversário sobrenatural pessoal. A tradução não acrescenta detalhes doutrinários além dos indicados pelo contexto.
- issue: Relação expressa por τοῦ θεοῦ
  choice: de Deus
  alternative: dada por Deus / pertencente a Deus
  rationale: A forma portuguesa preserva a amplitude do genitivo grego, evitando decidir entre procedência, fornecimento e posse quando o texto não exige uma única relação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vistam” dirige a ordem à comunidade. “Toda a armadura” preserva a imagem militar e a ideia de equipamento completo; “ficar firmes” comunica a manutenção da posição sem introduzir a noção adicional de vitória.
