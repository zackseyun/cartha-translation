id: EPH.6.6
reference: Ephesians 6:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ κατ’ ὀφθαλμοδουλίαν ὡς ἀνθρωπάρεσκοι ἀλλ’ ὡς ⸀δοῦλοι Χριστοῦ ποιοῦντες τὸ θέλημα τοῦ θεοῦ, ἐκ ψυχῆς
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/006.yaml
  text: not by eye-service[a], as people-pleasers, but as slaves of Messiah[c][b], doing the will of God from the soul.
translation:
  language: pt
  text: não servindo apenas quando estão sendo observados[a], como quem procura agradar às pessoas, mas como escravos do Messias[b], fazendo a vontade de Deus com toda a alma[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «com serviço aos olhos»; isto é, servindo apenas sob o olhar de alguém ou para manter as aparências.
    reason: lexical_alternative
  - marker: b
    text: Ou «de Cristo». O grego Christós significa «Ungido» e corresponde ao título «Messias».
    reason: alternative_reading
  - marker: c
    text: Ou «de coração» ou «sinceramente»; literalmente, «a partir da alma».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοδουλίαν
  choice: servindo apenas quando estão sendo observados
  rationale: O composto raro descreve serviço prestado para causar boa impressão sob o olhar de alguém. A formulação explicita o sentido em português corrente; a imagem literal é preservada em nota.
- source_word: ἀνθρωπάρεσκοι
  choice: como quem procura agradar às pessoas
  rationale: Expressa de modo natural a busca de aprovação humana implícita no termo, sem recorrer ao pouco idiomático «agradadores de pessoas».
- source_word: δοῦλοι
  choice: escravos
  rationale: O contexto imediato trata de pessoas escravizadas, e o contraste redefine sua pertença em relação ao Messias. «Escravos» preserva a força social e retórica do termo.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Traduz o sentido titular de Χριστός e ressalta a pertença ao governante ungido; «de Cristo» permanece registrado como alternativa tradicional.
- source_word: ποιοῦντες
  choice: fazendo
  rationale: Reproduz diretamente o particípio presente e sua ação concomitante à exortação do contexto.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: a vontade de Deus
  rationale: É a expressão portuguesa corrente e semanticamente adequada para aquilo que Deus quer que seja feito.
- source_word: ἐκ ψυχῆς
  choice: com toda a alma
  rationale: Mantém o vocábulo antropológico «alma» e comunica em português natural a sinceridade interior e integral da expressão grega.
theological_decisions:
- issue: Tradução de δοῦλοι no código doméstico
  choice: escravos do Messias
  alternative: servos de Cristo
  rationale: Como o contexto se dirige a escravos reais e explora a pertença a outro senhor, suavizar δοῦλοι como «servos» reduziria uma tensão histórica e teológica presente no texto.
- issue: Valor titular de Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: «Messias» torna transparente o significado de «Ungido» e preserva a função de título. A forma tradicional «Cristo» é indicada em nota sem ser excluída como leitura legítima.
- issue: Força de ἐκ ψυχῆς
  choice: com toda a alma
  alternative: de coração / sinceramente
  rationale: A escolha conserva ψυχή como «alma» sem impor uma antropologia técnica; as alternativas idiomáticas são oferecidas em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe continua o imperativo do versículo anterior. Evitaram-se tanto o decalque pouco natural «serviço aos olhos» no texto principal quanto a suavização histórica de «escravos».
