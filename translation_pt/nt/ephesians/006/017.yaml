id: EPH.6.17
reference: Ephesians 6:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὴν περικεφαλαίαν τοῦ σωτηρίου ⸀δέξασθε, καὶ τὴν μάχαιραν τοῦ πνεύματος, ὅ ἐστιν ῥῆμα θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/017.yaml
  text: And receive the helmet of salvation[a], and the sword of the Spirit, which is the word of God[b],
translation:
  language: pt
  text: Recebam também o capacete da salvação[a] e a espada do Espírito, que é a palavra de Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tomem o capacete da salvação”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a declaração de Deus”; o grego rhēma pode enfatizar uma palavra proferida ou uma mensagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξασθε
  choice: recebam
  rationale: Imperativo aoristo médio, segunda pessoa do plural. “Recebam” preserva a ideia de acolher ou tomar para si aquilo que é fornecido, sem perder a naturalidade em português; “tomem” continua sendo uma alternativa possível na imagem da armadura.
- source_word: περικεφαλαίαν
  choice: capacete
  rationale: Equivalente direto e corrente para a proteção militar da cabeça mencionada na metáfora.
- source_word: τοῦ σωτηρίου
  choice: da salvação
  rationale: Expressão natural que mantém a construção genitiva e a ressonância teológica paulina sem determinar além do texto a relação exata entre o capacete e a salvação.
- source_word: μάχαιραν
  choice: espada
  rationale: Equivalente claro e idiomático para μάχαιρα. Embora o termo possa designar uma arma de lâmina relativamente curta, “espada” evita uma especificidade desnecessária.
- source_word: τοῦ πνεύματος
  choice: do Espírito
  rationale: Neste contexto paulino, a referência mais provável é ao Espírito Santo. A inicial maiúscula comunica esse entendimento sem definir se o genitivo indica origem, posse ou meio.
- source_word: ὅ ἐστιν
  choice: que é
  rationale: Mantém de forma natural a função explicativa da oração relativa grega.
- source_word: ῥῆμα θεοῦ
  choice: a palavra de Deus
  rationale: “Palavra de Deus” é clara, reconhecível e teologicamente adequada; uma nota preserva a possível ênfase de ῥῆμα em palavra proferida, declaração ou mensagem.
theological_decisions:
- issue: Referente de τοῦ πνεύματος
  choice: Espírito Santo
  alternative: espírito humano ou sentido espiritual genérico
  rationale: No contexto da armadura de Deus e da identificação subsequente com a palavra de Deus, “Espírito” é mais naturalmente entendido como o Espírito Santo. A tradução não especifica além do grego de que modo a espada se relaciona com o Espírito.
- issue: Relação expressa pelo genitivo em “capacete da salvação”
  choice: preservar a formulação genitiva
  alternative: explicitar como “capacete que é a salvação” ou “capacete que traz salvação”
  rationale: O grego não resolve expressamente a relação semântica do genitivo; conservar “da salvação” mantém a ambiguidade e evita impor uma interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Recebam também” reproduz a coordenação do versículo e soa natural no plural. Mantiveram-se a metáfora militar, a concisão do original e as ambiguidades genuínas dos genitivos.
