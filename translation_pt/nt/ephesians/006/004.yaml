id: EPH.6.4
reference: Ephesians 6:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ οἱ πατέρες, μὴ παροργίζετε τὰ τέκνα ὑμῶν, ἀλλὰ ἐκτρέφετε αὐτὰ ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/004.yaml
  text: And fathers[a], do not provoke your children to anger[c][b], but bring them up in the discipline and instruction of the Lord.
translation:
  language: pt
  text: E vocês, pais[a], não provoquem seus filhos à ira[b], mas criem-nos na disciplina e na instrução do Senhor.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz especificamente “pais” no sentido de pais do sexo masculino, não um termo genérico para ambos os progenitores.
    reason: lexical_clarification
  - marker: b
    text: 'Ou: “não exasperem seus filhos”. O verbo grego significa despertar ira ou provocar ressentimento.'
    reason: lexical_alternative
  - marker: c
    text: A expressão “do Senhor” pode indicar disciplina e instrução que vêm do Senhor, pertencem a ele, são caracterizadas por ele ou são orientadas por ele.
    reason: alternative_reading
lexical_decisions:
- source_word: πατέρες
  choice: pais
  rationale: No contexto da exortação doméstica, o termo grego designa especificamente os pais do sexo masculino. “Pais” é a forma portuguesa natural de dirigir-se a eles; a nota esclarece que o original não emprega um termo genérico para ambos os progenitores.
- source_word: παροργίζετε
  choice: provoquem ... à ira
  rationale: 'Expressa de modo claro a força causativa do verbo: levar alguém à ira ou despertar ressentimento. A formulação também mantém a referência explícita à ira presente no verbo grego.'
- source_word: τέκνα
  choice: filhos
  rationale: É o termo familiar corrente e inclusivo em português para os filhos e as filhas de uma família.
- source_word: ἐκτρέφετε
  choice: criem-nos
  rationale: Embora o verbo possa referir-se literalmente a nutrir, neste contexto significa sustentar e formar os filhos durante seu crescimento; “criem-nos” comunica naturalmente essa ideia.
- source_word: παιδείᾳ
  choice: disciplina
  rationale: Abrange a formação, o treinamento e a correção próprios da criação dos filhos. “Disciplina” preserva melhor o componente formativo e corretivo.
- source_word: νουθεσίᾳ
  choice: instrução
  rationale: Designa orientação verbal, advertência ou correção. “Instrução” é clara e atual, sem excluir o aspecto corretivo indicado na nota.
- source_word: κυρίου
  choice: do Senhor
  rationale: 'Mantém a forma compacta do genitivo grego e preserva sua amplitude: a disciplina e a instrução podem ser entendidas como provenientes do Senhor, pertencentes a ele, caracterizadas por ele ou orientadas por ele.'
theological_decisions:
- issue: Alcance de πατέρες na exortação doméstica
  choice: A exortação dirige-se especificamente aos pais do sexo masculino.
  alternative: Entender ou traduzir como “pais e mães” ou “progenitores”.
  rationale: O substantivo grego é masculino e, neste contexto, nomeia os pais de família. A tradução não amplia silenciosamente o referente, embora a aplicação do princípio possa ser mais abrangente.
- issue: Sentido de κυρίου em παιδείᾳ καὶ νουθεσίᾳ κυρίου
  choice: “do Senhor”, sem especificar uma única relação semântica.
  alternative: “provenientes do Senhor”, “acerca do Senhor” ou “segundo o Senhor”.
  rationale: O genitivo pode indicar origem, pertencimento, caráter ou orientação. A formulação escolhida conserva a ambiguidade e a amplitude teológica do grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Criem-nos” evita uma paráfrase longa; “à ira” preserva o conteúdo explícito do verbo grego. A colocação dos marcadores associa cada nota ao trecho que realmente esclarece.
