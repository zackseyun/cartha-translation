  text: μετ’ εὐνοίας δουλεύοντες, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/007.yaml
  text: serving with goodwill[a], as to the Lord and not to men,
translation:
  language: pt
  text: servindo de boa vontade, como ao Senhor e não a seres humanos[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a homens”; o grego contrasta seres humanos com o Senhor.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ εὐνοίας
  choice: de boa vontade
  rationale: A construção com μετά e genitivo indica a disposição com que o serviço é prestado. “De boa vontade” é natural em português e comunica prontidão e intenção favorável sem acrescentar uma ideia alheia ao texto.
- source_word: δουλεύοντες
  choice: servindo
  rationale: O particípio de δουλεύω pode designar o serviço prestado por um escravo. Como o contexto imediato já identifica os destinatários como escravos, “servindo” expressa de modo idiomático a ação aqui enfatizada sem ocultar a realidade social estabelecida no parágrafo.
- source_word: ὡς
  choice: como
  rationale: 'Introduz a maneira ou comparação: o serviço deve ser prestado como ao Senhor. “Como” preserva a formulação concisa e a força do grego.'
- source_word: τῷ κυρίῳ
  choice: ao Senhor
  rationale: “Senhor” preserva o título cristológico e mantém a distinção entre o Senhor e os senhores humanos mencionados no contexto.
- source_word: ἀνθρώποις
  choice: a seres humanos
  rationale: O plural é genérico e estabelece um contraste entre seres humanos e o Senhor. “Seres humanos” torna esse contraste explícito e evita restringir indevidamente a referência ao sexo masculino.
theological_decisions:
- issue: Tradução de κύριος em contraste com senhores humanos
  choice: Senhor
  alternative: senhor ou dono
  rationale: A expressão aponta para o Senhor divino a quem o serviço é, em última instância, dirigido. “Senhor” preserva o título cristológico e evita confundi-lo com os senhores terrenos do contexto.
- issue: Intensidade da nuance escravista em δουλεύοντες
  choice: servindo
  alternative: servindo como escravos
  rationale: O contexto já explicita que Paulo se dirige a escravos. A tradução “servindo” mantém o foco verbal desta oração e sua fluidez, enquanto a condição social permanece clara no parágrafo.
- issue: Alcance de ἀνθρώποις
  choice: seres humanos
  alternative: homens
  rationale: Neste contraste, ἄνθρωποι designa seres humanos em oposição ao Senhor. A tradução inclusiva conserva esse sentido sem resolver a tensão contextual de que os senhores antigos eram normalmente homens; a forma mais literal fica registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil. “De boa vontade” é idiomático; “seres humanos” preserva o contraste universal do grego. A pontuação final mantém a continuidade sintática do versículo no período maior.
