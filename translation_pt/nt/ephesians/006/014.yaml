id: EPH.6.14
reference: Ephesians 6:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: στῆτε οὖν περιζωσάμενοι τὴν ὀσφὺν ὑμῶν ἐν ἀληθείᾳ, καὶ ἐνδυσάμενοι τὸν θώρακα τῆς δικαιοσύνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/014.yaml
  text: Stand[a], therefore, having fastened your waist with truth and having put on the breastplate of righteousness[b],
translation:
  language: pt
  text: Portanto, permaneçam de pé, tendo cingido a cintura com a verdade[a] e vestido a couraça da justiça[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com a veracidade». A expressão grega pode indicar tanto a verdade quanto a sinceridade ou integridade.
    reason: lexical_alternative
  - marker: b
    text: Ou «da retidão». O termo grego pode abranger justiça, condição de justo e conduta reta.
    reason: lexical_alternative
lexical_decisions:
- source_word: στῆτε
  choice: permaneçam de pé
  rationale: Expressa a ordem de assumir e conservar a posição diante do ataque. É mais natural neste contexto do que «fiquem de pé», que poderia sugerir apenas o ato de se levantar, e evita acrescentar explicitamente «firmes», ausente do verbo grego.
- source_word: οὖν
  choice: portanto
  rationale: Preserva a relação de conclusão com a exortação anterior.
- source_word: περιζωσάμενοι
  choice: tendo cingido
  rationale: Mantém a forma participial e a imagem de preparar a roupa ou armadura ao redor da cintura, sem inserir no texto um «cinto» que o grego não nomeia expressamente.
- source_word: τὴν ὀσφὺν ὑμῶν
  choice: a cintura
  rationale: Equivalente moderno e natural para a região dos lombos; o possessivo fica claro pelo sujeito plural em português.
- source_word: ἐν ἀληθείᾳ
  choice: com a verdade
  rationale: Representa de modo natural o valor instrumental ou associativo de ἐν, preservando a possibilidade de referência tanto à verdade quanto à veracidade pessoal.
- source_word: ἐνδυσάμενοι
  choice: tendo vestido
  rationale: É a expressão portuguesa normal para colocar uma peça de roupa ou armadura e mantém o paralelismo com o primeiro particípio.
- source_word: θώρακα
  choice: couraça
  rationale: Termo português corrente para a proteção militar do tronco e adequado à metáfora da armadura.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: «Justiça» é o equivalente português tradicional e abrangente, capaz de incluir condição justa, conduta reta e dimensão pública; a alternativa «retidão» explicita a nuance ética e é preservada em nota.
theological_decisions:
- issue: Sentido de δικαιοσύνη na metáfora da armadura
  choice: justiça
  alternative: retidão
  rationale: O termo grego pode apontar para justiça, condição de justo ou conduta reta. «Justiça» conserva a amplitude lexical e o uso paulino sem decidir se a ênfase recai na dádiva divina, no caráter ético ou em ambos.
- issue: Sentido de ἀλήθεια
  choice: verdade
  alternative: veracidade
  rationale: «Verdade» preserva a formulação ampla do grego, que pode abranger tanto a verdade objetiva quanto a sinceridade ou integridade de quem a pratica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Cingido» conserva a imagem antiga de preparação para o combate; o restante da frase oferece contexto suficiente para sua compreensão. A vírgula final foi mantida porque o versículo continua sintaticamente no versículo seguinte.
