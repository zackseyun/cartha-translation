id: EPH.6.16
reference: Ephesians 6:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἐν πᾶσιν ἀναλαβόντες τὸν θυρεὸν τῆς πίστεως, ἐν ᾧ δυνήσεσθε πάντα τὰ βέλη τοῦ ⸀πονηροῦ πεπυρωμένα σβέσαι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/016.yaml
  text: In all circumstances[a], taking up the shield of faith[c][b], with which you will be able to extinguish all the flaming arrows of the evil one.
translation:
  language: pt
  text: Em todas as circunstâncias, tomem o escudo da fé, com o qual poderão apagar todas as flechas[a] em chamas[b] do Maligno[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dardos” ou, de modo mais geral, “projéteis”.
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional da expressão: “dardos inflamados”.'
    reason: lexical_alternative
  - marker: c
    text: Ou “do mal”; a expressão grega também pode ser entendida em sentido abstrato, embora o sentido pessoal se ajuste bem ao contexto de combate espiritual.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πᾶσιν
  choice: Em todas as circunstâncias
  rationale: A expressão funciona adverbialmente no contexto da lista da armadura e indica toda situação, em vez do sentido mais rígido de “em todas as coisas”.
- source_word: ἀναλαβόντες
  choice: tomem
  rationale: Embora seja formalmente um particípio aoristo, expressa uma ação que acompanha a sequência de exortações. O imperativo torna essa força natural e clara em português.
- source_word: θυρεὸν
  choice: escudo
  rationale: O termo designa um escudo grande; “escudo” preserva a imagem militar de modo claro sem acrescentar uma qualificação ao texto principal.
- source_word: τῆς πίστεως
  choice: da fé
  rationale: O genitivo identifica metaforicamente o escudo com a fé. “Fé” é a opção natural neste contexto de confiança defensiva em Deus.
- source_word: ἐν ᾧ
  choice: com o qual
  rationale: A expressão retoma “escudo” e tem sentido instrumental, expresso naturalmente por “com o qual”.
- source_word: δυνήσεσθε
  choice: poderão
  rationale: Preserva o futuro e a ideia de capacidade do verbo grego em português atual.
- source_word: βέλη
  choice: flechas
  rationale: O termo pode abranger projéteis, mas “flechas” comunica com clareza a imagem militar; “dardos” é preservado em nota.
- source_word: πεπυρωμένα
  choice: em chamas
  rationale: O particípio perfeito passivo descreve projéteis incendiados. “Em chamas” mantém vividamente a imagem sem soar arcaico.
- source_word: σβέσαι
  choice: apagar
  rationale: O verbo significa extinguir ou apagar. “Apagar” é corrente em português e se ajusta naturalmente ao fogo das flechas.
- source_word: τοῦ πονηροῦ
  choice: do Maligno
  rationale: O adjetivo substantivado com artigo é lido pessoalmente no contexto de combate espiritual. A leitura abstrata continua possível e é registrada em nota.
theological_decisions:
- issue: Sentido de τοῦ πονηροῦ
  choice: do Maligno
  alternative: do mal
  rationale: O ataque pessoal retratado no contexto da guerra espiritual favorece a referência ao Maligno, mas a forma grega também admite a leitura abstrata “o mal”; por isso, a ambiguidade é preservada em nota.
- issue: Sentido de πίστις
  choice: fé
  alternative: confiança; fidelidade
  rationale: Neste contexto, “fé” expressa adequadamente a confiança do fiel em Deus e preserva a terminologia paulina habitual sem excluir as nuances lexicais do termo.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A construção participial foi expressa como exortação direta para que o versículo soe natural dentro da sequência da armadura de Deus.
