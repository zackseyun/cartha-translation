  text: ἵνα εὖ σοι γένηται καὶ ἔσῃ μακροχρόνιος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/003.yaml
  text: so that it may go well with you and you may live long on the earth[a].
translation:
  language: pt
  text: para que tudo corra bem com você e você tenha vida longa sobre a terra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na terra”, ecoando a formulação do quinto mandamento em Êxodo 20:12 e Deuteronômio 5:16.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade ou o resultado ligado à promessa do mandamento e mantém essa relação de modo natural em português.
- source_word: εὖ σοι γένηται
  choice: tudo corra bem com você
  rationale: Reproduz idiomaticamente a ideia de que as coisas vão bem para a pessoa; “tudo” torna natural em português o sujeito implícito da expressão grega.
- source_word: καὶ
  choice: e
  rationale: Mantém a coordenação simples entre os dois resultados prometidos.
- source_word: ἔσῃ μακροχρόνιος
  choice: você tenha vida longa
  rationale: Expressa com clareza o sentido do predicativo grego, literalmente relacionado a ser longevo, sem sugerir uma garantia interpretativa além da formulação proverbial da promessa.
- source_word: ἐπὶ τῆς γῆς
  choice: sobre a terra
  rationale: Segue a formulação grega efetivamente presente e conserva seu alcance amplo; a possível alusão à terra da promessa é indicada em nota.
theological_decisions:
- issue: Alcance de ἐπὶ τῆς γῆς em relação à promessa do quinto mandamento
  choice: sobre a terra
  alternative: na terra
  rationale: A tradução acompanha a redação ampla do grego de Efésios, sem inserir a especificação territorial encontrada no contexto veterotestamentário, ao mesmo tempo que preserva essa possível ressonância em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Corra bem com você” é idiomático sem ser coloquial demais; “sobre a terra” preserva a amplitude e a leve solenidade da expressão grega.
