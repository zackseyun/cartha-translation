source:
  edition: SBLGNT
  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα γνῶτε τὰ περὶ ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/022.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: pt
  text: 'Eu o enviei a vocês justamente para isto: para que saibam como estamos[a] e para que ele encoraje os corações de vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «saibam quais são as nossas circunstâncias» ou «saibam das coisas a nosso respeito».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: o
  rationale: Pronome relativo acusativo masculino singular que retoma Tíquico; em português, a retomada pronominal em «Eu o enviei» é natural e clara.
- source_word: ἔπεμψα
  choice: enviei
  rationale: O aoristo indicativo é vertido naturalmente pelo pretérito perfeito, sem exigir valor de presente perfeito.
- source_word: πρὸς ὑμᾶς
  choice: a vocês
  rationale: Com verbo de envio, πρός com acusativo indica direção às pessoas; «a vocês» é corrente e amplamente compreensível.
- source_word: εἰς αὐτὸ τοῦτο
  choice: justamente para isto
  rationale: Preserva a ênfase de αὐτὸ τοῦτο sobre a finalidade específica do envio.
- source_word: ἵνα
  choice: para que
  rationale: Introduz de modo explícito e natural a oração de finalidade.
- source_word: γνῶτε τὰ περὶ ἡμῶν
  choice: saibam como estamos
  rationale: Expressa de forma idiomática os assuntos, a condição e as circunstâncias referentes a Paulo e seus companheiros, sem restringir o sentido apenas a fatores externos.
- source_word: καὶ
  choice: e para que
  rationale: A repetição de «para que» explicita que a segunda ação também pertence à finalidade do envio.
- source_word: παρακαλέσῃ
  choice: encoraje
  rationale: No contexto de fortalecimento pastoral e com «coração», «encoraje» comunica bem o sentido de παρακαλέω, embora o verbo também possa significar consolar ou exortar.
- source_word: τὰς καρδίας ὑμῶν
  choice: o coração de vocês
  rationale: Mantém a expressão antropológica bíblica; o singular distributivo é idiomático em português e se refere ao íntimo de todos os destinatários.
theological_decisions:
- issue: Sentido de τὰ περὶ ἡμῶν
  choice: «como estamos»
  alternative: «nossas circunstâncias» ou «as coisas a nosso respeito»
  rationale: A expressão grega pode abranger tanto a condição pessoal quanto as circunstâncias de Paulo e seus companheiros. A formulação escolhida conserva essa amplitude sem reduzir o sentido ao aspecto externo.
- issue: Amplitude de παρακαλέω
  choice: «encoraje»
  alternative: «console» ou «exorte»
  rationale: O contexto favorece fortalecimento e ânimo, mas a escolha não elimina a amplitude pastoral do verbo grego.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. «Vocês» evita regionalismo excessivo; «justamente para isto» conserva a ênfase do original. A pontuação com dois-pontos torna transparentes as duas finalidades coordenadas.
