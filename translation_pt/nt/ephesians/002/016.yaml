source:
  edition: SBLGNT
  text: καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ διὰ τοῦ σταυροῦ ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/016.yaml
  text: and might reconcile both to God in one body through the cross, having put the hostility to death by it.
translation:
  language: pt
  text: e reconciliasse ambos com Deus em um só corpo, por meio da cruz, tendo por meio dela matado a hostilidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «tendo nele matado a hostilidade». A expressão grega também pode ser entendida como uma referência a Cristo.'
    reason: Preserva a possibilidade de que ἐν αὐτῷ se refira a Cristo, sem impor essa leitura no texto principal, que segue a leitura instrumental ligada à cruz.
lexical_decisions:
- source_word: ἀποκαταλλάξῃ
  choice: reconciliasse
  rationale: Expressa a restauração da relação com Deus e preserva o valor subjuntivo dependente do contexto sintático anterior.
- source_word: τοὺς ἀμφοτέρους
  choice: ambos
  rationale: Mantém de modo conciso a referência aos dois grupos mencionados no contexto, judeus e gentios.
- source_word: ἐν ἑνὶ σώματι
  choice: em um só corpo
  rationale: Preserva tanto a unidade numérica enfatizada por ἑνί quanto a metáfora eclesial de σώμα.
- source_word: διὰ τοῦ σταυροῦ
  choice: por meio da cruz
  rationale: Traduz claramente o meio pelo qual ocorre a reconciliação.
- source_word: ἀποκτείνας τὴν ἔχθραν
  choice: tendo nela matado a hostilidade
  rationale: Conserva a imagem forte de matar ou levar à morte, sem suavizá-la para mera remoção.
- source_word: ἐν αὐτῷ
  choice: nela
  rationale: Mantém a referência pronominal ambígua do grego em forma natural; no texto português, o referente mais imediato é a cruz.
theological_decisions:
- issue: Referência de ἐν αὐτῷ
  choice: nela
  alternative: nele / por meio dela
  rationale: O pronome pode ser relacionado à cruz ou a Cristo no fluxo do contexto. A tradução segue o antecedente explícito mais próximo, “cruz”, mas registra a ambiguidade textual em nota, sem excluir a leitura cristológica.
- issue: Sentido de “um só corpo”
  choice: manter a expressão sem explicitação
  alternative: em seu único corpo / formando um só corpo
  rationale: O grego permite tensão entre o corpo corporativo unido e uma possível ressonância do corpo crucificado de Cristo. A formulação literal preserva essa densidade sem impor uma única interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe coordenada adequada à continuidade da frase iniciada no contexto anterior. “Hostilidade” comunica ἔχθρα com clareza ampla; “matado” preserva a força retórica do original.
