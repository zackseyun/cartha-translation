  yaml_path: translation/nt/ephesians/002/017.yaml
  text: And he came and proclaimed peace to you who were far away[b][a], and peace to those who were near.
translation:
  language: pt
  text: E ele veio e anunciou paz a vocês, que estavam longe[b][a], e paz aos que estavam perto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a paz foi anunciada aos que antes estavam longe e aos que estavam perto — no contexto, respectivamente, gentios e judeus (ver Ef 2.11–13).
    reason: cross_reference
  - marker: b
    text: 'Ou: «anunciou as boas-novas de paz». O verbo grego muitas vezes significa «anunciar boas-novas», mas aqui seu objeto é simplesmente «paz».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: ele veio
  rationale: O particípio aoristo indica ação preparatória ou circunstância acompanhante. A forma coordenada é natural em português e preserva a imagem de sua vinda.
- source_word: εὐηγγελίσατο
  choice: anunciou
  rationale: O verbo significa anunciar boas-novas. Como seu objeto direto aqui é «paz», «anunciou» preserva o sentido proclamativo sem acrescentar «o evangelho» ao texto.
- source_word: εἰρήνην
  choice: paz
  rationale: Equivalente direto que também comporta, no contexto, as ideias de reconciliação e plenitude.
- source_word: ὑμῖν
  choice: a vocês
  rationale: Reproduz naturalmente o objeto indireto e a referência direta aos destinatários.
- source_word: τοῖς μακρὰν
  choice: que estavam longe
  rationale: Mantém a metáfora de distância e expressa com naturalidade a situação anterior sugerida pelo contexto.
- source_word: τοῖς ἐγγύς
  choice: aos que estavam perto
  rationale: Preserva o paralelismo e o contraste com os que estavam longe.
- source_word: καὶ ... καὶ
  choice: e ... e
  rationale: Mantém a coordenação enfática dos dois grupos aos quais a mesma paz foi anunciada.
theological_decisions:
- issue: Identidade dos que estavam longe e dos que estavam perto
  choice: Manter no texto as categorias metafóricas «longe» e «perto».
  alternative: Explicitar «gentios» e «judeus» no texto principal.
  rationale: O contexto aponta respectivamente para gentios e judeus (Ef 2.11–13), mas o versículo emprega as imagens de distância e proximidade. A tradução preserva essa retórica e deixa a identificação contextual para a nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. «Vocês» torna explícito o plural de ὑμῖν; «aos que» mantém a distinção entre os destinatários diretamente interpelados e o segundo grupo.
