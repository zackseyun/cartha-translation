id: EPH.2.20
reference: Ephesians 2:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐποικοδομηθέντες ἐπὶ τῷ θεμελίῳ τῶν ἀποστόλων καὶ προφητῶν, ὄντος ἀκρογωνιαίου αὐτοῦ ⸂Χριστοῦ Ἰησοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/020.yaml
  text: having been built on the foundation of the apostles and prophets[a], Messiah Jesus himself being the cornerstone[b],
translation:
  language: pt
  text: edificados sobre o fundamento dos apóstolos e profetas[a], sendo o próprio Messias Jesus[b] a pedra angular,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “fundamento dos apóstolos e profetas” pode indicar o fundamento associado ao testemunho deles, lançado por eles ou constituído por eles; o genitivo grego não especifica mais precisamente.
    reason: lexical_alternative
  - marker: b
    text: Ou “Cristo Jesus”. O título grego Χριστός é traduzido aqui como “Messias” para preservar seu sentido.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποικοδομηθέντες
  choice: edificados
  rationale: O particípio aoristo passivo descreve os destinatários como incorporados à construção de Deus. “Edificados” preserva a voz passiva e a ligação participial com a frase ao redor.
- source_word: ἐπὶ τῷ θεμελίῳ
  choice: sobre o fundamento
  rationale: A preposição com o dativo exprime apoio ou localização na metáfora arquitetônica; “sobre o fundamento” é claro e idiomático.
- source_word: τῶν ἀποστόλων καὶ προφητῶν
  choice: dos apóstolos e profetas
  rationale: Mantém o genitivo sem decidir se o fundamento consiste neles, foi lançado por eles ou está associado ao testemunho deles.
- source_word: ὄντος
  choice: sendo
  rationale: Preserva de modo conciso a construção participial do genitivo absoluto, sem acrescentar uma relação explicativa ausente do grego.
- source_word: ἀκρογωνιαίου
  choice: pedra angular
  rationale: Equivalente corrente para a principal pedra de referência e união na metáfora de uma construção; evita o acréscimo de “principal”, não expresso separadamente.
- source_word: αὐτοῦ
  choice: o próprio
  rationale: O pronome intensifica Χριστοῦ Ἰησοῦ; “o próprio” comunica essa ênfase pessoal em português natural.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Messias Jesus
  rationale: Χριστός conserva aqui seu valor titular; “Messias” torna explícito o sentido do título, enquanto “Jesus” mantém a ordem do grego.
theological_decisions:
- issue: Sentido de “fundamento dos apóstolos e profetas”
  choice: 'Manter o genitivo amplo: “dos apóstolos e profetas”'
  alternative: “lançado pelos apóstolos e profetas” ou “constituído pelos apóstolos e profetas”
  rationale: O grego não determina com precisão se os apóstolos e profetas lançam o fundamento, constituem esse fundamento ou estão associados a ele por seu testemunho. A tradução não resolve essa tensão.
- issue: Tradução de Χριστός
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Neste contexto teológico e metafórico, Χριστός permanece reconhecível como título. A forma tradicional é registrada em nota sem substituir o sentido do título no texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A redação preserva a forma fragmentária e participial do versículo, que continua a frase iniciada no contexto anterior, bem como a ambiguidade do genitivo.
