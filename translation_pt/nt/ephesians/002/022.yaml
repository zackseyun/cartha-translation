  text: in whom you also are being built together into a dwelling place for God in the Spirit[a][b].
translation:
  language: pt
  text: Nele[a], vocês também estão sendo edificados juntos para se tornarem morada de Deus no Espírito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no qual”, caso o relativo se refira à construção inteira, e não diretamente a Cristo.
    reason: alternative_reading
  - marker: b
    text: Ou “em espírito” ou “por meio do Espírito”. A expressão pode indicar a esfera da habitação de Deus ou a atuação do Espírito Santo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nele
  rationale: O relativo retoma mais naturalmente Cristo no fluxo dos versículos anteriores. “Nele” preserva a referência pessoal e é idiomático em português; a possível referência ao edifício inteiro é registrada em nota.
- source_word: καὶ ὑμεῖς
  choice: também vocês
  rationale: “Também” conserva a força aditiva de καί, incluindo explicitamente os destinatários na construção conjunta; “vocês” mantém a ênfase do pronome plural expresso.
- source_word: συνοικοδομεῖσθε
  choice: estão sendo edificados juntos
  rationale: A forma verbal é presente, passiva e plural. A construção progressiva comunica a ação em curso, enquanto “juntos” representa o prefixo συν- e “edificados” mantém a metáfora arquitetônica.
- source_word: εἰς
  choice: para se tornarem
  rationale: Neste contexto, εἰς indica finalidade ou resultado. A formulação natural em português explicita o movimento rumo à condição de morada sem acrescentar conteúdo alheio ao texto.
- source_word: κατοικητήριον τοῦ θεοῦ
  choice: morada de Deus
  rationale: “Morada” expressa de modo claro e digno um lugar onde Deus habita. O genitivo “de Deus” preserva a concisão e a abertura semântica do grego, podendo indicar a morada destinada a Deus ou caracterizada por sua presença.
- source_word: ἐν πνεύματι
  choice: no Espírito
  rationale: O contexto paulino de templo e habitação favorece a referência ao Espírito Santo. “No” conserva a preposição e não reduz a expressão apenas à agência instrumental.
theological_decisions:
- issue: Referente de ἐν ᾧ
  choice: 'Referência a Cristo: “Nele”.'
  alternative: 'Referência ao edifício inteiro: “nele” no sentido de “nesse edifício” ou “no qual”.'
  rationale: A repetição contextual de ἐν ᾧ e a centralidade de Cristo na coesão do edifício favorecem o antecedente pessoal, sem eliminar a ambiguidade gramatical, que é preservada em nota.
- issue: Sentido de ἐν πνεύματι
  choice: 'Referência ao Espírito Santo: “no Espírito”.'
  alternative: “em espírito” ou “por meio do Espírito”.
  rationale: A linguagem de templo e habitação divina favorece o Espírito Santo como referente. Manter “no” deixa aberta a sobreposição entre esfera e agência, evitando impor uma distinção que o grego não resolve.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Edificados” foi mantido por sua precisão na metáfora arquitetônica; “morada” evita o tom arcaico de “habitação” e soa natural sem perder solenidade.
