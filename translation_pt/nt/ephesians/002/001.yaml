  text: Καὶ ὑμᾶς ὄντας νεκροὺς τοῖς παραπτώμασιν καὶ ταῖς ἁμαρτίαις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/001.yaml
  text: And you were dead in your trespasses and sins,
translation:
  language: pt
  text: E vocês, que estavam mortos em suas transgressões e pecados,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεκρούς
  choice: mortos
  rationale: Mantém diretamente a metáfora forte do texto grego, sem reduzi-la a fraqueza ou enfermidade.
- source_word: παραπτώμασιν
  choice: transgressões
  rationale: Expressa atos que ultrapassam limites ou se desviam do que é correto, distinguindo o termo de ἁμαρτίαις sem recorrer a linguagem excessivamente técnica.
- source_word: ἁμαρτίαις
  choice: pecados
  rationale: É o equivalente português corrente e abrangente para ações e condições contrárias à vontade de Deus.
- source_word: τοῖς ... καὶ ταῖς
  choice: em ... e ...
  rationale: O dativo pode indicar a esfera ou condição em que se encontravam; “em” preserva essa relação sem impor exclusivamente uma leitura causal.
- source_word: ὄντας
  choice: que estavam
  rationale: Reproduz o particípio circunstancial ligado a “vocês” e conserva a dependência sintática da oração em relação ao desenvolvimento posterior.
theological_decisions:
- issue: Sentido de “mortos”
  choice: Manter a metáfora sem explicação interpretativa no corpo do texto
  alternative: Explicitar como “espiritualmente mortos”
  rationale: O grego diz apenas “mortos”. Acrescentar “espiritualmente” resolveria no texto uma metáfora cuja natureza e alcance devem emergir do contexto.
- issue: Relação das transgressões e dos pecados com a morte
  choice: “em suas transgressões e pecados”
  alternative: “por causa de suas transgressões e pecados”
  rationale: A construção dativa permite entender esfera ou condição e pode também admitir nuance causal. A preposição “em” preserva melhor essa abertura.
- issue: Estrutura incompleta do versículo
  choice: Conservar a oração suspensa com vírgula final
  alternative: 'Transformar em frase independente: “E vocês estavam mortos...”'
  rationale: No grego, “vocês” e “estando mortos” dependem do verbo principal retomado adiante, especialmente no versículo 5. Preservar essa estrutura evita antecipar uma solução sintática.
translation_notes:
  register: Português moderno, claro e digno, com uso de “vocês” para o plural. A formulação mantém a construção suspensa do grego e vocabulário amplamente compreensível em contextos lusófonos, com boa legibilidade brasileira.
