id: EPH.2.4
reference: Ephesians 2:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πλούσιος ὢν ἐν ἐλέει, διὰ τὴν πολλὴν ἀγάπην αὐτοῦ ἣν ἠγάπησεν ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/004.yaml
  text: But God[a], being rich in mercy, because of his great love with which he loved us,
translation:
  language: pt
  text: Mas Deus, sendo rico em misericórdia[a], por causa do seu grande amor com que nos amou,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «abundante em misericórdia». A expressão grega diz literalmente «rico em misericórdia».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca o forte contraste com a condição humana descrita nos versículos anteriores e mantém a força adversativa em português natural.
- source_word: πλούσιος ὢν
  choice: sendo rico
  rationale: Preserva a construção participial descritiva e causal, bem como a imagem de abundância.
- source_word: ἐν ἐλέει
  choice: em misericórdia
  rationale: Reproduz de perto a expressão grega e mantém ἔλεος distinto de ἀγάπη.
- source_word: διὰ τὴν πολλὴν ἀγάπην αὐτοῦ
  choice: por causa do seu grande amor
  rationale: Com acusativo, διά indica causa; «grande amor» expressa de modo idiomático a intensidade de πολλήν, e «seu» retoma Deus.
- source_word: ἣν ἠγάπησεν ἡμᾶς
  choice: com que nos amou
  rationale: Mantém a oração relativa e a repetição cognata entre ἀγάπη e ἀγαπάω, sem tornar o português obscuro.
theological_decisions:
- issue: Repetição cognata «amor ... amou»
  choice: seu grande amor com que nos amou
  alternative: seu grande amor por nós
  rationale: A repetição intencional do substantivo e do verbo no grego acrescenta ênfase; preservá-la mantém a textura retórica sem acrescentar interpretação.
- issue: Relação entre misericórdia e amor
  choice: sendo rico em misericórdia, por causa do seu grande amor
  alternative: por causa do seu amor misericordioso
  rationale: O texto apresenta misericórdia e amor como conceitos relacionados, mas distintos; fundi-los apagaria essa tensão semântica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a estrutura suspensa do versículo, que continua no contexto seguinte, e mantém a repetição enfática «amor ... amou».
