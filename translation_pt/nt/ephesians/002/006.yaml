    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγειρεν
  choice: nos ressuscitou com ele
  rationale: O prefixo συν- expressa participação conjunta. O objeto “nos” vem do contexto sintático da frase, e “com ele” explicita naturalmente em português a associação com o Messias.
- source_word: συνεκάθισεν
  choice: nos fez sentar com ele
  rationale: O verbo significa fazer sentar juntamente. Esta formulação preserva a ação causativa e a participação conjunta sem explicitar além do texto uma ideia de entronização.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: nas regiões celestiais
  rationale: A expressão substantivada designa a esfera celestial. “Regiões celestiais” é natural em português e evita a estranheza de uma tradução excessivamente literal como “nos celestiais”.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Χριστός conserva aqui seu sentido titular, “Messias”. A preposição ἐν é mantida por “no”, preservando a linguagem paulina de participação e união.
- source_word: καὶ … καὶ
  choice: e … e
  rationale: A repetição da conjunção coordena cumulativamente as duas ações divinas e é preservada de modo direto.
theological_decisions:
- issue: Participação com o Messias nos verbos compostos com συν-
  choice: Explicitar “com ele” nos dois verbos.
  alternative: 'Deixar a associação implícita: “nos ressuscitou e nos fez sentar”.'
  rationale: Os dois verbos gregos apresentam as ações como compartilhadas com outra pessoa, identificada pelo contexto como o Messias. A explicitação conserva essa força sem acrescentar uma conclusão doutrinária externa.
- issue: Χριστῷ como título ou forma semelhante a nome próprio
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: A tradução “Messias” comunica o sentido do título grego Χριστός; a alternativa tradicional é registrada em nota para preservar familiaridade e transparência lexical.
- issue: Valor de ἐν Χριστῷ Ἰησοῦ
  choice: Preservar a formulação concisa “no Messias Jesus”.
  alternative: Interpretar como “em união com o Messias Jesus” ou ligar apenas a expressão ao ato de sentar.
  rationale: A construção grega permite que a frase expresse a esfera ou união na qual se realizam as ações. A tradução mantém a concisão e a possível abrangência sobre ambos os verbos, sem resolver além do necessário a relação sintática.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Fez sentar” soa mais natural e preciso do que “assentou” neste contexto; “regiões celestiais” comunica a esfera indicada pelo plural substantivado grego.
