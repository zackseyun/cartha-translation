  yaml_path: translation/nt/ephesians/002/006.yaml
  text: and raised us up with him and seated us with him in the heavenly places in Messiah Jesus[b][a],
translation:
  language: pt
  text: e nos ressuscitou com ele e nos fez sentar com ele nas regiões celestiais[b], no Messias Jesus[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em Cristo Jesus”.'
