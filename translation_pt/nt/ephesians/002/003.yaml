  text: ἐν οἷς καὶ ἡμεῖς πάντες ἀνεστράφημέν ποτε ἐν ταῖς ἐπιθυμίαις τῆς σαρκὸς ἡμῶν, ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν, καὶ ⸀ἤμεθα τέκνα φύσει ὀργῆς ὡς καὶ οἱ λοιποί·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/003.yaml
  text: among whom we all also once lived in the desires of our flesh[a], fulfilling the desires of the flesh and of the mind, and we were by nature children of wrath[e][d][c][b], just as the rest were.
translation:
  language: pt
  text: Entre eles[a], também todos nós vivíamos antes, seguindo os desejos da nossa carne[b], cumprindo as vontades da carne e dos pensamentos; e éramos, por natureza, filhos da ira[c], assim como os demais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nessas coisas”. A expressão grega pode se referir às pessoas caracterizadas pela desobediência ou à esfera de transgressões e pecados mencionada antes.'
    reason: alternative_reading
  - marker: b
    text: “Carne” também poderia ser traduzida aqui como “natureza pecaminosa”; o texto principal mantém o termo de Paulo sem restringir sua abrangência teológica.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “objetos da ira”. “Filhos da ira” é uma tradução literal da expressão idiomática grega.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: entre eles
  rationale: O pronome relativo no dativo plural pode retomar pessoalmente os “filhos da desobediência” do versículo anterior. A nota preserva a possibilidade de referência às transgressões ou à esfera de desobediência.
- source_word: ἀνεστράφημέν ποτε
  choice: vivíamos no passado
  rationale: ἀναστρέφω descreve a maneira de viver ou de se conduzir, e ποτε situa essa vida no estado anterior. A formulação é natural e clara em português atual.
- source_word: ἐπιθυμίαις
  choice: desejos
  rationale: Mantém a amplitude do termo grego, sem restringi-lo indevidamente a desejos sexuais.
- source_word: σάρξ
  choice: carne
  rationale: Preserva o termo paulino e sua tensão antropológica e ética, sem o interpretar de modo mais estreito como “natureza pecaminosa”.
- source_word: ποιοῦντες τὰ θελήματα
  choice: cumprindo as vontades
  rationale: Expressa a realização prática e habitual dos impulsos ou propósitos mencionados, ao mesmo tempo que mantém a distinção entre ἐπιθυμίαι e θελήματα.
- source_word: διανοιῶν
  choice: pensamentos
  rationale: O plural pode indicar pensamentos, disposições mentais ou modos de pensar. “Pensamentos” é conciso e compreensível, sem reduzir o termo à faculdade abstrata da mente.
- source_word: τέκνα ὀργῆς
  choice: filhos da ira
  rationale: Conserva o forte idioma semítico do grego, deixando em aberto sua relação precisa com condição, caráter e sujeição ao juízo.
- source_word: φύσει
  choice: por natureza
  rationale: É uma correspondência direta e tradicional que preserva o alcance teológico debatido do termo, sem restringi-lo a “por nascimento”.
- source_word: οἱ λοιποί
  choice: os demais
  rationale: Reproduz naturalmente a comparação com o restante da humanidade fora de Cristo.
theological_decisions:
- issue: Sentido ético e antropológico de σάρξ
  choice: carne
  alternative: natureza pecaminosa
  rationale: Embora o contexto atribua força moral ao termo, “natureza pecaminosa” explicaria a antropologia paulina de forma mais específica do que o grego exige. “Carne” preserva a terminologia e a tensão teológica.
- issue: Força de τέκνα φύσει ὀργῆς
  choice: éramos, por natureza, filhos da ira
  alternative: éramos, por natureza, objetos da ira
  rationale: A tradução mantém tanto o idioma “filhos da ira” quanto a expressão “por natureza”, sem transformar a frase numa formulação doutrinária mais sistemática.
- issue: Referente de ἐν οἷς
  choice: entre eles
  alternative: nessas coisas
  rationale: O contexto imediato favorece uma referência pessoal aos “filhos da desobediência”, mas a forma grega permite uma ligação com as transgressões ou com a esfera de desobediência; essa ambiguidade é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vivíamos no passado” evita uma construção excessivamente literal; “cumprindo as vontades” conserva a força volitiva do plural grego. A pontuação com ponto e vírgula torna legível o período longo sem quebrar sua unidade argumentativa.
