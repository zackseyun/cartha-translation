id: EPH.2.13
reference: Ephesians 2:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: νυνὶ δὲ ἐν Χριστῷ Ἰησοῦ ὑμεῖς οἵ ποτε ὄντες μακρὰν ⸂ἐγενήθητε ἐγγὺς⸃ ἐν τῷ αἵματι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/013.yaml
  text: But now in Messiah Jesus[d][c][b][a], you who once were far away have become near by the blood of the Messiah.
translation:
  language: pt
  text: Mas agora, no Messias Jesus, vocês, que antes estavam longe, tornaram-se próximos pelo sangue do Messias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Mas agora
  rationale: Preserva tanto a transição contrastiva de δέ quanto a ênfase temporal de νυνί, em português natural.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Mantém a linguagem paulina de união ou incorporação por meio de «em» e traduz Χριστός como o título «Messias».
- source_word: ὑμεῖς οἵ ποτε ὄντες
  choice: vocês, que antes estavam
  rationale: Reproduz naturalmente o pronome enfático e a condição anterior indicada por ποτε e ὄντες.
- source_word: μακρὰν
  choice: longe
  rationale: É a correspondência adverbial direta e idiomática, capaz de conservar a dimensão figurada e relacional do contexto.
- source_word: ἐγενήθητε ἐγγὺς
  choice: tornaram-se próximos
  rationale: Reflete diretamente o sentido de mudança de estado de γίνομαι sem introduzir explicitamente um agente não expresso; «próximos» mantém o contraste com «longe».
- source_word: ἐν τῷ αἵματι
  choice: pelo sangue
  rationale: Entende ἐν em sentido instrumental, apresentando o sangue como meio, numa formulação corrente e digna em português.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Traduz Χριστός como título, de modo coerente com sua primeira ocorrência no versículo.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Χριστός conserva força titular e é semanticamente traduzível como «Messias»; isso torna seu significado acessível sem acrescentar uma interpretação denominacional.
- issue: Voz e agência em ἐγενήθητε ἐγγὺς
  choice: tornaram-se próximos
  alternative: foram aproximados
  rationale: A forma grega expressa a passagem a um novo estado e não nomeia explicitamente o agente. A opção escolhida preserva essa abertura, enquanto a alternativa realçaria agência passiva implícita.
- issue: Força de ἐν τῷ αἵματι τοῦ Χριστοῦ
  choice: 'instrumental: «pelo sangue do Messias»'
  alternative: 'esfera ou mediação: «no sangue do Messias» / «por meio do sangue do Messias»'
  rationale: O contexto favorece o sangue como meio da aproximação. «Pelo» comunica isso sem desenvolver uma teoria específica da expiação além do que o texto afirma.
translation_notes:
  register: Português moderno, corrente e digno, com legibilidade brasileira e compreensão internacional. «Vocês» evita a ambiguidade regional de «vós» e corresponde ao plural grego. A concisão e o paralelismo entre «longe» e «próximos» foram preservados.
