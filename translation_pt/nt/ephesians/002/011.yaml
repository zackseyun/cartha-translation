id: EPH.2.11
reference: Ephesians 2:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Διὸ μνημονεύετε ὅτι ⸂ποτὲ ὑμεῖς⸃ τὰ ἔθνη ἐν σαρκί, οἱ λεγόμενοι ἀκροβυστία ὑπὸ τῆς λεγομένης περιτομῆς ἐν σαρκὶ χειροποιήτου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/011.yaml
  text: Therefore remember that formerly you[a], the Gentiles in the flesh[d][c][b], who are called “uncircumcision” by what is called “circumcision,” made by hands in the flesh—
translation:
  language: pt
  text: Portanto, lembrem-se de que, outrora, vocês, os gentios na carne,[a] eram chamados de “incircuncisão” pela chamada “circuncisão”[b] feita por mãos humanas na carne[c] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês, outrora, as nações na carne”. O grego dá ênfase a “vocês” e usa “nações/gentios” no sentido de não judeus.'
    reason: lexical_alternative
  - marker: b
    text: “Circuncisão” e “incircuncisão” são aqui rótulos étnicos e ligados à aliança, não apenas descrições anatômicas.
    reason: cultural_note
  - marker: c
    text: 'A expressão também pode ser traduzida: “a assim chamada ‘circuncisão’, feita por mãos humanas na carne”. A formulação de Paulo pode conter uma crítica à circuncisão meramente exterior.'
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: Portanto
  rationale: Marca a conclusão inferida do argumento anterior e funciona naturalmente como transição em português.
- source_word: μνημονεύετε
  choice: lembrem-se
  rationale: Traduz o imperativo presente plural de modo corrente; o contexto sustenta a ideia de manter essa realidade na memória sem precisar explicitá-la.
- source_word: ποτὲ ὑμεῖς
  choice: outrora, vocês
  rationale: Conserva o contraste temporal e dá destaque explícito a “vocês”, como no grego.
- source_word: τὰ ἔθνη
  choice: os gentios
  rationale: Neste contraste entre judeus e não judeus, refere-se aos povos não judeus, e não às nações em sentido geopolítico.
- source_word: ἐν σαρκί
  choice: na carne
  rationale: Mantém o termo concreto de Paulo, que aqui indica condição corporal e identidade étnico-social, não natureza pecaminosa.
- source_word: οἱ λεγόμενοι ἀκροβυστία
  choice: eram chamados de “incircuncisão”
  rationale: Preserva o ato de rotulação social e o uso coletivo do substantivo abstrato; as aspas assinalam que se trata de uma designação convencional.
- source_word: ὑπὸ τῆς λεγομένης περιτομῆς
  choice: pela chamada “circuncisão”
  rationale: Reproduz a simetria retórica de λεγόμενοι/λεγομένης e mantém certa distância de Paulo em relação ao rótulo, sem intensificar o tom como sarcasmo.
- source_word: ἐν σαρκὶ χειροποιήτου
  choice: feita por mãos humanas na carne
  rationale: Liga χειροποίητος diretamente a “circuncisão” e torna explícito, de modo natural, que se trata de um ato corporal realizado por seres humanos.
theological_decisions:
- issue: Sentido de σάρξ em contexto não moral
  choice: na carne
  alternative: no corpo; em termos físicos
  rationale: A expressão descreve a condição corporal e étnico-ritual dos gentios e a circuncisão física; não deve ser convertida em linguagem sobre corrupção moral.
- issue: Força de λεγομένης com περιτομή
  choice: pela chamada “circuncisão”
  alternative: pela assim chamada “circuncisão”; pelos que são chamados de “circuncisão”
  rationale: A formulação preserva a repetição de “chamar” aplicada aos dois grupos e a possível crítica à identidade meramente exterior, sem impor um tom antijudaico mais forte.
- issue: Função de περιτομή e ἀκροβυστία
  choice: substantivos abstratos entre aspas como rótulos coletivos
  alternative: os circuncidados e os incircuncisos
  rationale: O grego emprega termos abstratos como designações étnico-religiosas; conservá-los mantém a forma e a tensão retórica do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas naturais para leitores brasileiros. A repetição de “na carne” foi mantida por corresponder à estrutura e à ênfase do grego. O travessão final preserva a continuidade sintática com o versículo seguinte.
