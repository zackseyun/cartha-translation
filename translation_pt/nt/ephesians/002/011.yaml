  source_fidelity: 'A tradução preserva adequadamente a estrutura e os elementos semânticos do grego: Διὸ é bem vertido por “Portanto”; o imperativo plural μνημονεύετε por “lembrem-se”; τὰ ἔθνη é corretamente contextualizado como “os gentios”; e a dupla referência a ἐν σαρκί permanece explícita, sem lhe atribuir sentido moral. “Eram chamados de ‘incircuncisão’” comunica de modo natural a rotulação coletiva expressa por οἱ λεγόμενοι ἀκροβυστία no quadro temporal de “outrora”. A qualificação final é corretamente ligada a “circuncisão”.'
