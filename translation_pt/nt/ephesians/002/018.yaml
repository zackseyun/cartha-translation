  text: ὅτι δι’ αὐτοῦ ἔχομεν τὴν προσαγωγὴν οἱ ἀμφότεροι ἐν ἑνὶ πνεύματι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/018.yaml
  text: For through him we both have access in one Spirit to the Father[a][b][c].
translation:
  language: pt
  text: Pois, por meio dele, ambos temos acesso, em um só Espírito, ao Pai.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Porque, por meio dele, ambos temos acesso...”'
    reason: lexical_alternative
  - marker: b
    text: “Acesso” também pode ser traduzido por “aproximação” ou “apresentação”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “por um só Espírito”. “Em um só Espírito” preserva a expressão grega, que pode indicar tanto o meio como a esfera desse acesso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: No contexto, introduz a razão ou explicação da afirmação anterior sobre a paz e a reconciliação. “Pois” é natural e preserva a ligação argumentativa; “porque” também é possível.
- source_word: δι’ αὐτοῦ
  choice: por meio dele
  rationale: διά com o genitivo expressa mediação ou agência. “Por meio dele” conserva com clareza o papel mediador de Cristo.
- source_word: ἔχομεν
  choice: temos
  rationale: Reproduz de modo direto o presente do indicativo e comunica uma realidade compartilhada atual.
- source_word: τὴν προσαγωγὴν
  choice: acesso
  rationale: προσαγωγή pode indicar acesso, aproximação ou apresentação à presença de alguém. “Acesso” é claro em português moderno e não limita a expressão a uma apresentação inicial.
- source_word: οἱ ἀμφότεροι
  choice: nós dois
  rationale: Mantém a primeira pessoa e a referência conjunta aos dois grupos mencionados no contexto, judeus e gentios, sem explicitá-los dentro do versículo.
- source_word: ἐν ἑνὶ πνεύματι
  choice: em um só Espírito
  rationale: Preserva a preposição grega ἐν e o provável referente, o Espírito Santo. “Um só” soa natural em português e enfatiza a unidade compartilhada.
- source_word: πρὸς τὸν πατέρα
  choice: ao Pai
  rationale: πρός com acusativo indica orientação ou movimento em direção à presença pessoal do Pai. “Ao Pai” é conciso e fiel.
theological_decisions:
- issue: Referente de πνεύματι
  choice: o Espírito Santo
  alternative: um espírito humano compartilhado
  rationale: 'O contexto apresenta uma estrutura fortemente trinitária: por meio dele, em um só Espírito, ao Pai. A inicial maiúscula registra a leitura mais provável sem acrescentar uma identificação explicativa ao texto.'
- issue: Sentido de προσαγωγή
  choice: acesso compartilhado ao Pai
  alternative: apresentação formal à presença do Pai
  rationale: O termo pode conter nuances régias ou cultuais, mas “acesso” comunica melhor o privilégio presente e comum dos dois grupos sem especificar demais a metáfora.
- issue: Força de ἐν em ἐν ἑνὶ πνεύματι
  choice: em um só Espírito
  alternative: por um só Espírito
  rationale: “Em” preserva a forma grega e deixa aberta a possibilidade de indicar esfera ou meio, evitando resolver uma ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem “ao Pai em um só Espírito” mantém a ligação natural de “acesso ao Pai”, embora o grego disponha o sintagma referente ao Espírito antes de “ao Pai”. Os marcadores foram colocados ao fim do versículo e correspondem integralmente às notas.
