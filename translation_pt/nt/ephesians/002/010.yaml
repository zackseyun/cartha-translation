source:
  edition: SBLGNT
  text: αὐτοῦ γάρ ἐσμεν ποίημα, κτισθέντες ἐν Χριστῷ Ἰησοῦ ἐπὶ ἔργοις ἀγαθοῖς οἷς προητοίμασεν ὁ θεὸς ἵνα ἐν αὐτοῖς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/010.yaml
  text: For we are his workmanship[a], created in Messiah Jesus for good works[b], which God prepared beforehand so that we might walk in them.
translation:
  language: pt
  text: Pois somos obra dele[a], criados no Messias Jesus[b] para boas obras, as quais Deus preparou de antemão para que andemos nelas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “aquilo que ele fez” ou “obra realizada por ele”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em Cristo Jesus”. O termo grego Χριστός significa “Messias”, isto é, “Ungido”.'
    reason: alternative_reading
  - marker: c
    text: Aqui, “andar” é uma metáfora para viver ou conduzir a vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοῦ γάρ ἐσμεν ποίημα
  choice: Pois somos obra dele
  rationale: “Pois” mantém a ligação explicativa com o contexto anterior. “Obra dele” expressa de modo natural que os fiéis são aquilo que Deus fez, sem acrescentar a imagem não explícita de mãos ou artesanato.
- source_word: κτισθέντες
  choice: criados
  rationale: Reproduz o particípio passivo de κτίζω de forma concisa e natural, conservando Deus como agente implícito da criação.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Mantém ἐν como união ou esfera e traduz Χριστός como o título “Messias”, em vez de tratá-lo apenas como nome próprio.
- source_word: ἐπὶ ἔργοις ἀγαθοῖς
  choice: para boas obras
  rationale: Expressa a finalidade ou o resultado visado pela construção com ἐπί e dativo, sem reduzir ἔργα apenas a atos isolados.
- source_word: οἷς προητοίμασεν ὁ θεός
  choice: as quais Deus preparou de antemão
  rationale: O relativo feminino plural retoma claramente “boas obras”, e “de antemão” preserva a nuance temporal do prefixo προ-.
- source_word: ἵνα ἐν αὐτοῖς περιπατήσωμεν
  choice: para que andássemos nelas
  rationale: Conserva tanto a finalidade introduzida por ἵνα quanto a metáfora paulina de “andar” como modo de viver; “nelas” retoma as boas obras.
theological_decisions:
- issue: Χριστός como título ou forma semelhante a nome próprio
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Aqui Χριστός continua designando Jesus como o Ungido. “Messias” torna explícito o valor do título, enquanto a nota registra a forma tradicional sem impor uma distinção doutrinária adicional.
- issue: Relação entre o preparo divino e a conduta humana
  choice: Deus preparou de antemão para que andássemos nelas
  alternative: Deus preparou de antemão para que as praticássemos
  rationale: A redação preserva simultaneamente a iniciativa de Deus e a finalidade de uma vida humana caracterizada por boas obras, sem decidir debates sistemáticos sobre predestinação ou agência humana.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a metáfora paulina de “andar”, explica-a em nota e evita linguagem excessivamente técnica ou distintivos denominacionais.
