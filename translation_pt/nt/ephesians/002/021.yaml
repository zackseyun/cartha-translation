id: EPH.2.21
reference: Ephesians 2:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν ᾧ ⸀πᾶσα οἰκοδομὴ συναρμολογουμένη αὔξει εἰς ναὸν ἅγιον ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/021.yaml
  text: in whom the whole building[a], being fitted together, grows into a holy temple in the Lord,
translation:
  language: pt
  text: Nele, todo o edifício[a], bem ajustado, cresce para se tornar um templo santo no Senhor,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cada edifício”. A expressão grega pode ser entendida tanto em sentido distributivo como corporativo; o texto principal segue a imagem contextual de um único templo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nele
  rationale: O pronome relativo retoma mais naturalmente Cristo, mencionado no versículo anterior; “nele” preserva a referência pessoal e a formulação paulina.
- source_word: πᾶσα οἰκοδομὴ
  choice: todo o edifício
  rationale: Embora a construção grega sem artigo também possa ser entendida distributivamente, o contexto apresenta judeus e gentios unidos em uma só realidade edificada.
- source_word: συναρμολογουμένη
  choice: bem ajustado
  rationale: O particípio passivo presente descreve as partes sendo continuamente encaixadas em um conjunto coerente; a formulação mantém a metáfora arquitetônica com naturalidade.
- source_word: αὔξει
  choice: cresce
  rationale: O presente indica desenvolvimento contínuo e preserva a combinação paulina de crescimento orgânico com a imagem de um edifício.
- source_word: εἰς
  choice: para se tornar
  rationale: Expressa a meta ou o resultado do crescimento; esta formulação torna explícita em português a força resultativa da preposição sem alterar a imagem.
- source_word: ναὸν ἅγιον
  choice: um templo santo
  rationale: ναός designa o santuário do templo; “templo santo” é claro, digno e semanticamente direto.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Preserva a amplitude da expressão paulina, que pode indicar esfera, relação ou união, sem escolher uma explicação mais estreita.
theological_decisions:
- issue: 'Antecedente de ᾧ: Cristo pessoalmente ou a imagem do edifício'
  choice: 'Referência pessoal a Cristo: “Nele”'
  alternative: 'Referência impessoal: “no qual”'
  rationale: O antecedente contextual mais natural é o próprio Cristo Jesus como pedra angular, e a repetição de expressões equivalentes no contexto favorece a referência cristológica pessoal.
- issue: Sentido corporativo ou distributivo de πᾶσα οἰκοδομὴ
  choice: 'Sentido corporativo: “todo o edifício”'
  alternative: 'Sentido distributivo: “cada edifício”'
  rationale: O contexto enfatiza a unidade de judeus e gentios como um só povo e templo. A alternativa gramaticalmente possível é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Bem ajustado” evita uma construção passiva pesada, enquanto “para se tornar” comunica naturalmente a meta do crescimento. A vírgula final foi mantida para refletir que o versículo continua sintaticamente no seguinte.
