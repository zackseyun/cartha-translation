  text: καὶ ὄντας ἡμᾶς νεκροὺς τοῖς παραπτώμασιν συνεζωοποίησεν τῷ Χριστῷ— χάριτί ἐστε σεσῳσμένοι—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/005.yaml
  text: even when we were dead in our trespasses[a], he made us alive together with Messiah—by grace you have been saved—
translation:
  language: pt
  text: mesmo quando estávamos mortos em nossas transgressões, ele nos deu vida juntamente com o Messias[a] — pela graça vocês foram salvos —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com Cristo”. O grego Χριστός é um título que significa “Messias”; tradicionalmente, também se emprega “Cristo”.'
    reason: Explica a alternativa tradicional para a tradução do título grego sem caracterizar imprecisamente «Cristo» como transliteração.
lexical_decisions:
- source_word: ὄντας ἡμᾶς νεκρούς
  choice: mesmo quando estávamos mortos
  rationale: A construção participial retoma o estado descrito no contexto e admite valor temporal com nuance concessiva. “Mesmo quando” expressa ambas de modo natural, sem transformar a frase numa explicação causal.
- source_word: τοῖς παραπτώμασιν
  choice: em nossas transgressões
  rationale: O dativo indica a esfera ou referência em que se encontrava a morte. “Em nossas transgressões” mantém essa formulação, enquanto “nossas” é explicitado naturalmente a partir do pronome de primeira pessoa e do paralelo no versículo 1.
- source_word: συνεζωοποίησεν
  choice: nos deu vida juntamente
  rationale: O verbo composto reúne as ideias de dar vida e de fazê-lo em união com outro. Esta formulação é clara em português e permite que a expressão seguinte identifique com quem essa vida é compartilhada.
- source_word: τῷ Χριστῷ
  choice: com o Messias
  rationale: O dativo é associativo e indica união com o Messias. “Messias” preserva o sentido titular de Χριστός neste contexto.
- source_word: χάριτί
  choice: pela graça
  rationale: O dativo tem valor instrumental ou de fundamento. “Pela graça” é uma expressão precisa, corrente e teologicamente não restritiva.
- source_word: ἐστε σεσῳσμένοι
  choice: vocês foram salvos
  rationale: A perífrase perfeita passiva descreve uma salvação realizada cujos efeitos permanecem. “Foram salvos” preserva de modo idiomático a ação concluída e a voz passiva; o contexto comunica seu resultado presente.
theological_decisions:
- issue: Tradução de Χριστῷ
  choice: o Messias
  alternative: Cristo
  rationale: Aqui Χριστός conserva claramente sua força titular. “Messias” torna explícito esse sentido; a forma tradicional “Cristo” é indicada em nota sem sugerir diferença de referente.
- issue: Relação expressa por τοῖς παραπτώμασιν
  choice: mortos em nossas transgressões
  alternative: mortos por causa de nossas transgressões
  rationale: A construção grega pode suscitar leitura de esfera ou de causa. A tradução com “em” preserva a formulação menos determinada e evita resolver silenciosamente a relação como estritamente causal.
- issue: Força da oração parentética χάριτί ἐστε σεσῳσμένοι
  choice: manter a declaração entre travessões
  alternative: integrá-la à frase sem destaque parentético
  rationale: A inserção abrupta antecipa a explicação dos versículos 8–9 e dá ênfase retórica à graça. Os travessões preservam essa interrupção do fluxo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Emprega “vocês” para o plural de segunda pessoa, evita construções arcaicas e conserva a interrupção retórica do original. O marcador [a] aparece imediatamente após “Messias”, termo ao qual a nota se refere.
