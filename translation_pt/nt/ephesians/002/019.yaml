id: EPH.2.19
reference: Ephesians 2:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἄρα οὖν οὐκέτι ἐστὲ ξένοι καὶ πάροικοι, ἀλλὰ ⸀ἐστὲ συμπολῖται τῶν ἁγίων καὶ οἰκεῖοι τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/019.yaml
  text: So then[a], you are no longer strangers and resident foreigners, but you are fellow citizens with the saints and members of God's household[c][b],
translation:
  language: pt
  text: Portanto, vocês já não são estrangeiros nem residentes estrangeiros[a], mas concidadãos com os santos[b][c] e membros da família de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “residentes sem cidadania plena”. O termo grego se refere a pessoas que vivem em um lugar sem possuir cidadania plena.
    reason: lexical_alternative
  - marker: b
    text: Ou “concidadãos dos santos”. O sentido é que agora vocês compartilham a cidadania com o povo santo de Deus.
    reason: lexical_alternative
  - marker: c
    text: Aqui, “santos” significa o povo santo de Deus, não apenas uma classe especial de pessoas oficialmente reconhecidas como santas.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Portanto
  rationale: As duas partículas introduzem uma conclusão enfática baseada no argumento anterior. “Portanto” transmite essa força de modo natural e claro em português.
- source_word: οὐκέτι
  choice: já não
  rationale: Expressa a cessação de uma condição anterior e ressalta a mudança de situação dos destinatários.
- source_word: ξένοι
  choice: estrangeiros
  rationale: Denota pessoas de fora, sem pertencimento ao povo em questão. “Estrangeiros” preserva o contraste com cidadania e família.
- source_word: πάροικοι
  choice: residentes sem cidadania plena
  rationale: O termo designa estrangeiros que residiam em determinado lugar sem desfrutar de todos os direitos cívicos. A formulação explicita essa nuance social e jurídica sem recorrer a termos arcaicos.
- source_word: συμπολῖται
  choice: concidadãos
  rationale: O composto grego ressalta cidadania compartilhada; “concidadãos” é o equivalente português mais direto e natural.
- source_word: τῶν ἁγίων
  choice: dos santos
  rationale: Mantém a construção genitiva e o termo bíblico tradicional, sem restringir no texto principal quem são os santos. Uma nota esclarece tanto o sentido associativo quanto o emprego de “santos”.
- source_word: οἰκεῖοι
  choice: membros da família
  rationale: Refere-se aos que pertencem a uma casa ou unidade doméstica. “Membros da família” comunica naturalmente a metáfora relacional em português.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: O genitivo indica pertencimento; “família de Deus” é uma expressão clara e idiomática em português.
theological_decisions:
- issue: Referente de τῶν ἁγίων (“dos santos”)
  choice: Manter “santos” como designação ampla do povo santo de Deus
  alternative: Anjos; especificamente os judeus crentes; ou todos os crentes sem distinção
  rationale: O contexto descreve a incorporação dos gentios ao povo e à família de Deus. O texto não restringe explicitamente o referente, por isso a tradução conserva a amplitude e a tensão interpretativa.
- issue: Metáfora de οἰκεῖοι τοῦ θεοῦ
  choice: “membros da família de Deus”
  alternative: “pertencentes à casa de Deus” ou “membros da casa de Deus”
  rationale: O grego pode evocar tanto a casa quanto a unidade doméstica. “Família de Deus” comunica o pertencimento relacional sem introduzir uma estrutura eclesiológica específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Vocês” reproduz o plural de ἐστέ sem regionalismo excessivo; “já não” marca de forma idiomática a mudança de condição. A linguagem cívica da primeira metade e a metáfora familiar da segunda foram preservadas.
