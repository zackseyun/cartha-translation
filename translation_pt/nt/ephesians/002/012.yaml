id: EPH.2.12
reference: Ephesians 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ⸀ἦτε τῷ καιρῷ ἐκείνῳ χωρὶς Χριστοῦ, ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ καὶ ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας, ἐλπίδα μὴ ἔχοντες καὶ ἄθεοι ἐν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/012.yaml
  text: that at that time you were without Messiah[a], alienated from the commonwealth of Israel and strangers to the covenants of the promise[c][b], having no hope and without God in the world.
translation:
  language: pt
  text: que, naquele tempo, vocês estavam sem o Messias[a], afastados da comunidade de Israel e alheios às alianças da promessa[b], sem esperança e sem Deus no mundo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem Cristo”. O título grego Χριστός pode ser traduzido das duas maneiras; aqui, “Messias” ressalta seu sentido no contexto judaico e pactual.
    reason: alternative_reading
  - marker: b
    text: Ou “às alianças de promessa”.
    reason: lexical_alternative
  - marker: c
    text: “Sem Deus” também pode ter o sentido de “ímpios”. A expressão pode indicar estar sem o verdadeiro Deus, e não necessariamente o ateísmo filosófico moderno.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς Χριστοῦ
  choice: sem o Messias
  rationale: Χριστός tem aqui força de título no contexto judaico e pactual; “Messias” comunica esse sentido, enquanto a alternativa tradicional é indicada em nota.
- source_word: ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραήλ
  choice: afastados da comunidade de Israel
  rationale: O particípio descreve um estado de separação, e πολιτεία aponta para a coletividade ou ordem cívica de Israel, não apenas para cidadania individual.
- source_word: ξένοι
  choice: alheios
  rationale: Expressa estar fora da esfera social e pactual, em paralelo com o estado de afastamento mencionado anteriormente.
- source_word: διαθηκῶν τῆς ἐπαγγελίας
  choice: às alianças da promessa
  rationale: Preserva o plural “alianças” e o singular “promessa”, mantendo a relação genitiva sem transformá-la em simples promessas pactuais.
- source_word: ἐλπίδα μὴ ἔχοντες
  choice: sem esperança
  rationale: Forma natural e concisa em português para a condição expressa pelo particípio grego.
- source_word: ἄθεοι ἐν τῷ κόσμῳ
  choice: sem Deus no mundo
  rationale: Evita impor a categoria moderna de ateísmo filosófico e conserva a ideia de privação ou ausência de relação com Deus.
theological_decisions:
- issue: Tradução de Χριστός neste contexto paulino
  choice: Messias
  alternative: Cristo
  rationale: O contexto da comunidade de Israel e das alianças favorece a leitura titular; a alternativa tradicional permanece em nota.
- issue: Sentido de ἄθεοι
  choice: sem Deus
  alternative: ímpios; ateus
  rationale: A formulação preserva a tensão entre ausência de relação com Deus e impiedade, sem reduzir o termo à negação filosófica da existência divina.
- issue: Relação em διαθηκῶν τῆς ἐπαγγελίας
  choice: alianças da promessa
  alternative: alianças de promessa
  rationale: Mantém a construção singular do grego e sua ambiguidade quanto à promessa associada às alianças.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Vocês” torna explícito o plural de ἦτε; “comunidade de Israel” evita o tom excessivamente técnico de “comunidade política” e a possível redução individualista de “cidadania”.
