  text: τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν καταργήσας, ἵνα τοὺς δύο κτίσῃ ἐν ⸀αὑτῷ εἰς ἕνα καινὸν ἄνθρωπον ποιῶν εἰρήνην,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/015.yaml
  text: having abolished the law of commandments expressed in decrees, so that he might create the two into one new man in himself, making peace,
translation:
  language: pt
  text: tendo abolido a lei dos mandamentos expressos em decretos[a], a fim de criar, em si mesmo, dos dois um só novo homem[b], fazendo a paz,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em decretos”, “constituída por decretos” ou, tradicionalmente, “em ordenanças”.
    reason: lexical_alternative
  - marker: b
    text: “Um só novo homem” é uma imagem corporativa no singular; alternativamente, “uma só nova humanidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμον
  choice: lei
  rationale: Mantém o sentido do código legal mosaico qualificado pela expressão seguinte, sem exigir inicial maiúscula.
- source_word: ἐντολῶν
  choice: mandamentos
  rationale: Preserva o sentido formal e pactual de ἐντολή e se ajusta naturalmente à construção genitiva.
- source_word: ἐν δόγμασιν
  choice: expressos em decretos
  rationale: Torna explícita, sem grande paráfrase, a relação provável entre os mandamentos e os decretos; a formulação grega também admite outras relações sintáticas, registradas em nota.
- source_word: καταργήσας
  choice: tendo abolido
  rationale: Expressa a força decisiva do particípio aoristo e conserva a linguagem forte do contexto sem ampliar seu objeto além da frase especificada.
- source_word: ἵνα
  choice: a fim de
  rationale: Introduz com clareza a finalidade da ação anterior.
- source_word: τοὺς δύο
  choice: dos dois
  rationale: Conserva o numeral explícito e, com o verbo criar, produz uma construção portuguesa natural que aponta para os dois grupos do contexto.
- source_word: κτίσῃ
  choice: criar
  rationale: Preserva a linguagem de criação e sua possível ressonância de nova criação.
- source_word: ἐν αὑτῷ
  choice: em si mesmo
  rationale: Representa o pronome reflexivo e mantém Cristo como a esfera ou pessoa na qual ocorre a união.
- source_word: εἰς ἕνα καινὸν ἄνθρωπον
  choice: um só novo homem
  rationale: Preserva a imagem corporativa singular e a forma masculina de ἄνθρωπος; 'um só' comunica aqui a unidade resultante.
- source_word: ποιῶν εἰρήνην
  choice: fazendo a paz
  rationale: Tradução direta e natural do particípio presente com seu objeto, ligada à criação dos dois em um.
theological_decisions:
- issue: Sentido corporativo de ἕνα καινὸν ἄνθρωπον
  choice: um só novo homem
  alternative: uma só nova humanidade
  rationale: A alternativa explicita corretamente a dimensão coletiva, mas a opção principal preserva a metáfora singular de Paulo e deixa que o contexto revele seu caráter corporativo.
- issue: Força de καταργήσας em relação à lei
  choice: tendo abolido
  alternative: tendo anulado
  rationale: 'Conserva a força do verbo no contexto, restringindo a afirmação ao objeto que o próprio versículo qualifica: a lei dos mandamentos expressos em decretos.'
- issue: Posição e relação de ἐν αὑτῷ
  choice: criar, em si mesmo, dos dois um só novo homem
  alternative: criar dos dois um só novo homem em si mesmo
  rationale: A posição escolhida acompanha de perto a estrutura grega e liga 'em si mesmo' ao ato criador, sem excluir a leitura em que a expressão caracteriza o novo homem resultante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a sintaxe participial do fragmento fornecido e mantém a ambiguidade pertinente de ἐν δόγμασιν por meio de nota.
