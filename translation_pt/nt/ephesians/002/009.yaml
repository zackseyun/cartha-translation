  text: οὐκ ἐξ ἔργων, ἵνα μή τις καυχήσηται.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/009.yaml
  text: not from works[a], so that no one may boast.
translation:
  language: pt
  text: não vem de obras,[a] para que ninguém se glorie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não procede de obras”. A expressão grega indica origem ou fonte; alguns entendem também uma nuance instrumental (“não é por obras”), mas a formulação mais literal é “não vem de obras”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐξ
  choice: não vem de
  rationale: A formulação expressa negação e origem ou fonte. “Não vem de” é natural em português e preserva o valor básico de ἐξ no contexto.
- source_word: ἔργων
  choice: obras
  rationale: “Obras” corresponde diretamente ao termo grego e mantém a formulação paulina ampla, sem acrescentar “da lei”, “boas” ou outra delimitação ausente do texto.
- source_word: ἵνα μή τις
  choice: para que ninguém
  rationale: Expressa de modo claro e natural a finalidade negativa introduzida por ἵνα μή, sem eliminar a possível proximidade entre finalidade e resultado.
- source_word: καυχήσηται
  choice: se glorie
  rationale: O verbo traduz adequadamente o subjuntivo de καυχάομαι e conserva a linguagem paulina de gloriar-se, mais precisa aqui do que “tenha orgulho”.
theological_decisions:
- issue: Sentido de “obras” na declaração de Paulo
  choice: Manter simplesmente “obras”.
  alternative: “obras da lei”, “esforço humano” ou “boas obras”
  rationale: O grego traz apenas ἔργων. Especificar o tipo de obras resolveria interpretativamente uma formulação que o texto mantém ampla.
- issue: Relação expressa por ἐξ
  choice: 'Traduzir como origem ou fonte: “vem de”.'
  alternative: Traduzir instrumentalmente como “por meio de” ou “por”.
  rationale: ἐξ denota primariamente origem ou fonte neste enunciado. A nota registra a alternativa mais literal e a possível leitura instrumental sem incorporá-la de modo exclusivo ao texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Se glorie” preserva a expressão teológica tradicional sem soar arcaica; a frase permanece ligada sintaticamente ao contexto anterior.
