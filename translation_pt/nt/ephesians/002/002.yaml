  text: ἐν αἷς ποτε περιεπατήσατε κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου, κατὰ τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος, τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος ἐν τοῖς υἱοῖς τῆς ἀπειθείας·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/002.yaml
  text: in which you once walked[a], according to the age of this world, according to the ruler of the authority of the air[c][b], the spirit now at work in the sons of disobedience.
translation:
  language: pt
  text: nas quais vocês antes viviam, conforme a era deste mundo[a], conforme o governante da autoridade do ar[b], o espírito que agora atua nos filhos da desobediência[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «conforme o curso deste mundo». O grego usa «era» (αἰών), destacando a época ou o padrão do mundo presente.'
    reason: lexical_alternative
  - marker: b
    text: «O ar» reflete a linguagem cosmológica antiga para a esfera associada a poderes espirituais hostis.
    reason: cultural_note
  - marker: c
    text: Isto é, pessoas caracterizadas pela desobediência; a expressão não se limita a homens.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αἷς
  choice: nos quais
  rationale: Retoma os substantivos plurais «delitos» e «pecados» do versículo anterior e preserva o sentido metafórico de uma esfera de conduta.
- source_word: ποτε περιεπατήσατε
  choice: vocês antes viviam
  rationale: «Antes» marca a condição passada, e «viviam» comunica naturalmente a metáfora paulina de andar como modo de vida.
- source_word: κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου
  choice: seguindo a era deste mundo
  rationale: «Era» distingue αἰών de κόσμος e conserva sua dimensão temporal e cultural; «seguindo» expressa com clareza a conformidade indicada por κατά.
- source_word: τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος
  choice: o governante da autoridade do ar
  rationale: Mantém a cadeia genitiva e a distinção lexical entre ἄρχων, «governante», e ἐξουσία, «autoridade», sem explicar além do texto.
- source_word: τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος
  choice: o espírito que agora atua
  rationale: A minúscula corresponde ao contexto de uma influência espiritual hostil; a construção preserva a atividade presente e a relação explicativa com a expressão anterior.
- source_word: ἐν τοῖς υἱοῖς τῆς ἀπειθείας
  choice: nos filhos da desobediência
  rationale: Conserva o idiomatismo semítico e a forma masculina do original, esclarecida em nota para evitar que seja entendida como referência exclusiva a homens.
theological_decisions:
- issue: Relação entre «o espírito que agora atua» e «o governante da autoridade do ar»
  choice: A pontuação apresenta «o espírito» como explicação ou descrição adicional da potência hostil mencionada antes.
  alternative: Entender «o espírito» especificamente como o próprio governante ou como uma força espiritual distinta subordinada a ele.
  rationale: A cadeia de genitivos e os artigos gregos permitem uma relação apositiva, mas não definem com precisão se as expressões têm referente estritamente idêntico; a tradução preserva essa tensão.
- issue: Sentido de «filhos da desobediência»
  choice: Manter a expressão idiomática «filhos da desobediência» no texto.
  alternative: Traduzir de modo explicativo como «pessoas desobedientes» ou usar «filhos e filhas».
  rationale: A expressão descreve pessoas caracterizadas pela desobediência e não deve ser limitada ao sexo masculino; a nota esclarece seu alcance sem apagar a forma do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Vocês» evita regionalismo excessivo; «viviam» torna natural a metáfora de περιπατέω, enquanto «era», «autoridade», «ar» e «filhos da desobediência» preservam distinções e imagens relevantes do grego.
