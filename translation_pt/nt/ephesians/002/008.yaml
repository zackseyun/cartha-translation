  text: τῇ γὰρ χάριτί ἐστε σεσῳσμένοι ⸀διὰ πίστεως· καὶ τοῦτο οὐκ ἐξ ὑμῶν, θεοῦ τὸ δῶρον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/008.yaml
  text: For by grace you have been saved through faith[a], and this is not from yourselves[b]; it is the gift of God.
translation:
  language: pt
  text: Pois pela graça vocês foram salvos, mediante a fé[a]; e isto[b] não vem de vocês; é dom de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fé” também pode ser entendida como “confiança”; em certos contextos, a palavra grega pode significar “fidelidade”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, em sentido mais amplo: “toda esta realidade de salvação pela graça mediante a fé não vem de vocês”. O demonstrativo grego “isto” provavelmente retoma a oração anterior como um todo, e não apenas “fé”.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάριτι
  choice: graça
  rationale: Em Paulo, χάρις frequentemente designa o favor bondoso e imerecido de Deus. “Graça” preserva esse sentido estabelecido sem ampliar o texto.
- source_word: ἐστε σεσῳσμένοι
  choice: vocês foram salvos
  rationale: A construção perifrástica no perfeito expressa uma ação realizada cujos efeitos permanecem. “Foram salvos” é a formulação mais natural em português; o contexto sustenta a continuidade do resultado.
- source_word: διὰ πίστεως
  choice: mediante a fé
  rationale: διά com o genitivo indica meio ou instrumento. “Mediante a fé” reproduz essa relação com clareza, e “fé” é a equivalência usual de πίστις neste contexto.
- source_word: τοῦτο
  choice: isto
  rationale: O demonstrativo neutro provavelmente retoma a realidade expressa pela oração anterior como um todo, sem especificar isoladamente “graça” ou “fé”. “Isto” conserva a concisão e a ambiguidade do grego.
- source_word: οὐκ ἐξ ὑμῶν
  choice: não vem de vocês
  rationale: ἐκ indica fonte ou origem. A formulação comunica naturalmente que essa realidade salvadora não se origina nos destinatários.
- source_word: θεοῦ τὸ δῶρον
  choice: é dom de Deus
  rationale: A expressão identifica a realidade anterior como dádiva proveniente de Deus. A cópula, implícita no grego, é acrescentada para produzir português natural.
theological_decisions:
- issue: Referente de τοῦτο (“isto”) em relação à graça, à fé e à salvação
  choice: “Isto” retoma provavelmente toda a realidade anterior — a salvação pela graça mediante a fé.
  alternative: “Isto” pode ser entendido como referência específica à fé, ou, menos provavelmente, à graça.
  rationale: Como τοῦτο é neutro, não concorda naturalmente de modo isolado com os substantivos femininos χάρις (“graça”) ou πίστις (“fé”). A referência à oração ou ao conceito anterior como um todo é sintaticamente provável, mas a tradução mantém o demonstrativo sem explicitação dogmática.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” evita regionalismo excessivo; “mediante” mantém com precisão a relação de meio sem soar arcaico. A ordem e a pontuação acompanham de perto a progressão enfática do grego.
