  text: αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν, ὁ ποιήσας τὰ ἀμφότερα ἓν καὶ τὸ μεσότοιχον τοῦ φραγμοῦ λύσας, τὴν ἔχθραν ἐν τῇ σαρκὶ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/014.yaml
  text: For he himself is our peace[a], who made both one and broke down the dividing wall of the barrier—the hostility—in his flesh[d][c][b],
translation:
  language: pt
  text: 'Pois ele mesmo é a nossa paz: fez dos dois um só e, em sua carne, derrubou o muro de separação, a barreira — isto é, a hostilidade.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “os dois” se refere, no contexto, a gentios e judeus. Outra pontuação possível liga “a hostilidade” mais diretamente ao que segue no versículo 15.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: ele mesmo
  rationale: Preserva a ênfase do pronome intensivo e destaca que o próprio Cristo é a paz.
- source_word: γάρ
  choice: Pois
  rationale: Mantém a ligação explicativa com a afirmação anterior de modo natural em português.
- source_word: ἡ εἰρήνη ἡμῶν
  choice: a nossa paz
  rationale: Reproduz diretamente a imagem de Cristo como a paz que reconcilia.
- source_word: τὰ ἀμφότερα ἓν
  choice: dos dois um só
  rationale: 'Mantém implícitos, como no grego, os dois grupos identificados pelo contexto: gentios e judeus.'
- source_word: τὸ μεσότοιχον τοῦ φραγμοῦ
  choice: o muro de separação, a barreira
  rationale: Conserva a imagem arquitetônica e entende o genitivo como explicativo ou caracterizador.
- source_word: λύσας
  choice: derrubou
  rationale: É a expressão portuguesa natural para desfazer ou demolir um muro.
- source_word: τὴν ἔχθραν
  choice: a hostilidade
  rationale: Termo moderno e claro para a oposição relacional; a construção explicativa preserva sua relação com a barreira.
- source_word: ἐν τῇ σαρκὶ αὐτοῦ
  choice: em sua carne
  rationale: Mantém a concretude de σάρξ e evita substituir a expressão por uma interpretação teológica mais específica.
theological_decisions:
- issue: Referente de τὰ ἀμφότερα
  choice: Manter “os dois” implícito
  alternative: Explicitar “os dois grupos”, isto é, judeus e gentios
  rationale: O contexto identifica os referentes, mas a forma concisa conserva a formulação e a tensão retórica do grego.
- issue: Relação de τὴν ἔχθραν com a frase anterior
  choice: Apresentar “a hostilidade” como explicação da barreira
  alternative: Ligá-la ao que segue no versículo 15 ou tratá-la como objeto separado
  rationale: A aposição é sintaticamente plausível e a pontuação explicativa evita sugerir que a hostilidade estivesse localizada na carne de Cristo.
- issue: Sentido de ἐν τῇ σαρκὶ αὐτοῦ
  choice: “em sua carne”, ligado ao ato de derrubar
  alternative: “por meio de seu corpo” ou ligar a expressão diretamente a “hostilidade”
  rationale: A tradução literal preserva a linguagem encarnacional, enquanto a posição na frase esclarece que a expressão se relaciona à ação de Cristo sem eliminar a ambiguidade sintática do original.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A ordem foi ajustada para evitar a interpretação equivocada de que a hostilidade estava na carne de Cristo, sem substituir “carne” por uma paráfrase doutrinária.
