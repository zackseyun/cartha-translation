base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/007.yaml
  text: so that in the coming ages he might display the surpassing riches of his grace in kindness toward us in Messiah Jesus[a][b][c].
translation:
  language: pt
  text: para mostrar, nas eras vindouras[a], a riqueza incomparável[b] da sua graça, em bondade para conosco no Messias Jesus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nas eras que estão por vir”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a riqueza imensurável”.'
    reason: lexical_alternative
  - marker: c
    text: 'Tradicionalmente: “em Cristo Jesus”. O grego emprega Χριστός, título que significa “Messias” ou “Ungido”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: para
  rationale: Introduz a finalidade decorrente do contexto anterior de modo natural e preserva a força télica da construção.
- source_word: ἐνδείξηται
  choice: mostrar
  rationale: Expressa o sentido de tornar evidente ou demonstrar publicamente, sem tecnicismo desnecessário.
- source_word: ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις
  choice: nas eras vindouras
  rationale: Preserva o plural de αἰῶσιν e a referência às eras que hão de vir; “vindouras” mantém um registro digno e claro.
- source_word: τὸ ὑπερβάλλον πλοῦτος
  choice: a riqueza incomparável
  rationale: Reproduz a ideia de uma riqueza que excede toda medida. O singular concorda com πλοῦτος, apesar da variante de concordância presente na tradição textual.
- source_word: τῆς χάριτος αὐτοῦ
  choice: da sua graça
  rationale: “Graça” conserva o sentido paulino estabelecido de favor divino generoso e imerecido.
- source_word: ἐν χρηστότητι
  choice: expressa em bondade
  rationale: Torna explícita, de maneira idiomática, a relação entre a graça e sua manifestação em bondade, sem alterar o referente.
- source_word: ἐφ’ ἡμᾶς
  choice: para conosco
  rationale: Comunica a orientação benéfica da bondade divina em relação a nós em português corrente.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Traduz Χριστός como título e preserva a linguagem paulina de união ou esfera de atuação no Messias.
theological_decisions:
- issue: Χριστῷ como título ou forma semelhante a nome próprio
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Aqui Χριστός mantém seu conteúdo titular; “Messias” traduz esse título, enquanto “Cristo” poderia ser percebido apenas como parte do nome.
- issue: Sentido de ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  alternative: por meio do Messias Jesus
  rationale: Mantém a preposição ἐν e a ambiguidade da fórmula paulina, que pode indicar esfera, união ou vínculo, sem reduzi-la apenas a instrumentalidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Eras vindouras” preserva o plural e o horizonte escatológico; “riqueza incomparável” evita uma formulação rígida; “no Messias Jesus” conserva tanto o título quanto a construção paulina com ἐν.
