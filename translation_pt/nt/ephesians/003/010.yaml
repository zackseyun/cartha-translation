id: EPH.3.10
reference: Ephesians 3:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα γνωρισθῇ νῦν ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις ἐν τοῖς ἐπουρανίοις διὰ τῆς ἐκκλησίας ἡ πολυποίκιλος σοφία τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/010.yaml
  text: so that now[a], through the church, the manifold wisdom of God might be made known to the rulers and the authorities in the heavenly realms[c][b],
translation:
  language: pt
  text: para que agora, por meio da igreja, a multiforme sabedoria de Deus seja dada a conhecer aos principados e às autoridades nas regiões celestiais[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos lugares celestiais”.
    reason: lexical_alternative
  - marker: b
    text: “Os principados e as autoridades nas regiões celestiais” provavelmente são poderes cósmicos ou espirituais, e não apenas autoridades humanas.
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade e preserva naturalmente o valor télico em português.
- source_word: γνωρισθῇ
  choice: seja dada a conhecer
  rationale: Preserva a voz passiva e o valor subjuntivo da oração de finalidade.
- source_word: νῦν
  choice: agora
  rationale: Equivalente temporal direto e natural.
- source_word: ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις
  choice: aos principados e às autoridades
  rationale: Mantém a distinção entre os dois termos e a conhecida associação paulina; “principados” assinala poderes governantes sem explicitar além do texto sua natureza.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: nas regiões celestiais
  rationale: Expressa a esfera celestial de modo corrente e evita a formulação pouco natural “nos celestiais”.
- source_word: διὰ τῆς ἐκκλησίας
  choice: por meio da igreja
  rationale: Torna explícito o sentido instrumental de διά com genitivo.
- source_word: ἡ πολυποίκιλος σοφία
  choice: a multiforme sabedoria
  rationale: “Multiforme” comunica a rica variedade e as muitas facetas de πολυποίκιλος com concisão e dignidade.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Genitivo que identifica Deus como aquele a quem pertence a sabedoria.
theological_decisions:
- issue: Identidade dos “principados e autoridades”
  choice: Manter os títulos amplos no texto, com nota indicando a provável referência a poderes cósmicos ou espirituais.
  alternative: Traduzir explicitamente como “poderes espirituais” ou entender autoridades humanas.
  rationale: O qualificativo “nas regiões celestiais” favorece poderes supra-humanos, mas o texto não os chama expressamente de anjos ou espíritos; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada com naturalidade, mantendo a finalidade, a instrumentalidade da igreja e a ênfase na sabedoria de Deus.
