  text: ἵνα ἐξισχύσητε καταλαβέσθαι σὺν πᾶσιν τοῖς ἁγίοις τί τὸ πλάτος καὶ μῆκος καὶ ⸂ὕψος καὶ βάθος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/018.yaml
  text: so that you may be strong enough to comprehend[a], together with all the saints, what is the width and length and height and depth[b],
translation:
  language: pt
  text: para que vocês tenham força suficiente para compreender, juntamente com todos os santos, qual é a largura[a], o comprimento, a altura e a profundidade[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amplitude”.
    reason: lexical_alternative
  - marker: b
    text: O grego não declara o que essas dimensões descrevem; muitos entendem que o pensamento se completa no versículo seguinte com o amor do Messias.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade ou o resultado da oração precedente, preservando de modo natural a força télica da conjunção.
- source_word: ἐξισχύσητε
  choice: vocês tenham força suficiente
  rationale: Expressa a ideia de possuir força ou capacidade adequada para realizar o infinitivo seguinte, sem reduzir o verbo a mera possibilidade intelectual.
- source_word: καταλαβέσθαι
  choice: compreender
  rationale: Neste contexto, indica apreender ou captar plenamente uma realidade; “compreender” é claro, digno e natural em português.
- source_word: σὺν πᾶσιν τοῖς ἁγίοις
  choice: juntamente com todos os santos
  rationale: Preserva a participação coletiva indicada por σύν e o uso paulino estabelecido de ἅγιοι para os que pertencem a Deus.
- source_word: τί
  choice: qual é
  rationale: Introduz naturalmente, em português, o conteúdo a ser compreendido sem acrescentar a interpretação “quão grande é”.
- source_word: τὸ πλάτος
  choice: a largura
  rationale: Equivalente dimensional direto e corrente; “amplitude” é possível, mas menos concreto.
- source_word: μῆκος
  choice: o comprimento
  rationale: Equivalente dimensional direto e natural.
- source_word: ὕψος
  choice: a altura
  rationale: Equivalente dimensional direto.
- source_word: βάθος
  choice: a profundidade
  rationale: Equivalente dimensional direto.
theological_decisions:
- issue: Referente das quatro dimensões
  choice: Manter implícito o objeto de “largura, comprimento, altura e profundidade”.
  alternative: Explicitar “do amor do Messias” ou relacionar as dimensões ao plano salvador ou à plenitude de Deus.
  rationale: O texto grego deste versículo não declara o que as dimensões descrevem. Acrescentar um referente resolveria indevidamente uma ambiguidade que o contexto, especialmente o versículo seguinte, pode esclarecer.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para leitura ampla e especialmente natural no Brasil. A construção mantém a ênfase na força necessária e conserva sem explicação intrusiva o referente aberto das quatro dimensões.
