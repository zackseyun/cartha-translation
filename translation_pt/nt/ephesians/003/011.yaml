  text: κατὰ πρόθεσιν τῶν αἰώνων ἣν ἐποίησεν ἐν ⸀τῷ Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/011.yaml
  text: according to the eternal purpose that he accomplished in Messiah Jesus our Lord[c][b][a],
translation:
  language: pt
  text: segundo o propósito eterno[a] que ele realizou no[b] Messias[c] Jesus, nosso Senhor,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o propósito das eras”. A expressão grega é, mais literalmente, “o propósito das eras”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por meio do Messias Jesus”. A preposição grega significa literalmente “em”, mas, neste contexto, também pode ser entendida em sentido instrumental.'
    reason: alternative_reading
  - marker: c
    text: 'Grego: “Cristo”; traduzido aqui como “Messias” porque o termo funciona como título.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: segundo
  rationale: Com o acusativo πρόθεσιν, indica conformidade; “segundo” é natural e preserva a relação explícita com o propósito divino.
- source_word: πρόθεσιν τῶν αἰώνων
  choice: propósito eterno
  rationale: A expressão grega é literalmente “propósito das eras”, mas, neste contexto, comunica a duração eterna do propósito. A forma idiomática fica no texto, e a expressão literal é preservada em nota.
- source_word: ἣν ἐποίησεν
  choice: que ele realizou
  rationale: O pronome retoma “propósito”, e ποιέω, nesse contexto, indica que Deus o levou a efeito. “Realizou” é claro sem especificar além do texto como isso ocorreu.
- source_word: ἐν
  choice: 'no'
  rationale: Contração de “em” com o artigo exigido em português diante de “Messias”. Preserva a preposição grega e deixa aberta sua possível nuance instrumental, registrada em nota.
- source_word: Χριστῷ
  choice: Messias
  rationale: Aqui Χριστός funciona como título; “Messias” explicita seu sentido e conserva seu pano de fundo judaico.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: κυρίῳ ἡμῶν
  choice: nosso Senhor
  rationale: Tradução direta e corrente, preservando o título κύριος e o possessivo ἡμῶν.
theological_decisions:
- issue: Sentido de τῶν αἰώνων em πρόθεσιν τῶν αἰώνων
  choice: propósito eterno
  alternative: propósito das eras
  rationale: “Eterno” expressa de modo natural o valor temporal da locução no contexto, enquanto a nota conserva a forma mais literal e sua imagem própria.
- issue: Força de ἐν τῷ Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  alternative: por meio do Messias Jesus
  rationale: A tradução principal mantém o valor básico de ἐν e não resolve silenciosamente se a construção tem nuance instrumental.
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: O termo funciona como título neste contexto; “Messias” comunica seu significado em vez de tratá-lo apenas como parte de um nome composto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação principal é idiomática, enquanto as notas preservam a literalidade e as ambiguidades relevantes do grego.
