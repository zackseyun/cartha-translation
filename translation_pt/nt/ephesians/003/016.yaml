id: EPH.3.16
reference: Ephesians 3:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα ⸀δῷ ὑμῖν κατὰ ⸂τὸ πλοῦτος⸃ τῆς δόξης αὐτοῦ δυνάμει κραταιωθῆναι διὰ τοῦ πνεύματος αὐτοῦ εἰς τὸν ἔσω ἄνθρωπον,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/016.yaml
  text: that he may grant you[a], according to the riches of his glory, to be strengthened with power through his Spirit in the inner man,
translation:
  language: pt
  text: para que ele lhes conceda, segundo a riqueza da sua glória, ser fortalecidos com poder, por meio do seu Espírito, no homem interior.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no ser interior”. O grego diz literalmente “homem interior”, expressão no singular que representa o eu interior da pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz o conteúdo e a finalidade do pedido de oração de Paulo, preservando de modo natural a força subordinativa.
- source_word: δῷ ὑμῖν
  choice: ele lhes conceda
  rationale: O subjuntivo aoristo de δίδωμι sob ἵνα é bem expresso por “conceda” no contexto de oração; “lhes” representa o plural ὑμῖν.
- source_word: κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ
  choice: segundo a riqueza da sua glória
  rationale: κατά com acusativo indica padrão ou medida. “Segundo” evita sugerir apenas uma parcela e mantém a densidade teológica de δόξα. O singular “riqueza” segue a forma textual πλοῦτος.
- source_word: δυνάμει κραταιωθῆναι
  choice: ser fortalecidos com poder
  rationale: Preserva a voz passiva de κραταιωθῆναι e entende o dativo δυνάμει como meio ou modo, em português claro.
- source_word: διὰ τοῦ πνεύματος αὐτοῦ
  choice: por meio do seu Espírito
  rationale: διά com genitivo marca meio ou agência. “Espírito” com inicial maiúscula identifica o provável referente divino no contexto paulino.
- source_word: εἰς τὸν ἔσω ἄνθρωπον
  choice: no homem interior
  rationale: Mantém a expressão paulina concreta e o singular representativo do grego. “No” comunica em português o âmbito ou alvo interior do fortalecimento sem impor ao εἰς um sentido espacial rígido.
theological_decisions:
- issue: Referente de πνεῦμα
  choice: o Espírito de Deus (“seu Espírito”)
  alternative: o espírito de Deus entendido de forma mais geral como influência divina impessoal
  rationale: O contexto descreve a agência divina nos fiéis, e o uso paulino favorece fortemente a referência ao Espírito pessoal de Deus. A redação conserva simplesmente “seu Espírito”.
- issue: Sentido de ἔσω ἄνθρωπον
  choice: “homem interior” como expressão singular representativa para o eu interior
  alternative: “ser interior” ou “pessoa interior”
  rationale: A tradução principal preserva a formulação metafórica e gramatical do grego sem restringi-la aos homens; a nota esclarece seu alcance representativo e oferece uma alternativa inclusiva natural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura permanece subordinada porque o versículo continua a oração iniciada no contexto anterior. “Riqueza”, no singular, segue o texto grego apresentado; a nota evita que “homem interior” seja entendido como referência exclusiva ao sexo masculino.
