id: EPH.3.17
reference: Ephesians 3:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κατοικῆσαι τὸν Χριστὸν διὰ τῆς πίστεως ἐν ταῖς καρδίαις ὑμῶν ἐν ἀγάπῃ· ἐρριζωμένοι καὶ τεθεμελιωμένοι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/017.yaml
  text: so that Messiah may dwell in your hearts through faith[a], being rooted and grounded in love[c][b],
translation:
  language: pt
  text: para que o Messias[a] habite nos corações de vocês por meio da fé[b], estando vocês enraizados e alicerçados no amor[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Cristo”. O termo grego Χριστός é um título que significa “Messias”, isto é, “Ungido”.
    reason: alternative_reading
  - marker: b
    text: Ou “por meio da confiança”. Aqui, “fé” é o sentido mais provável do grego πίστις.
    reason: lexical_alternative
  - marker: c
    text: A expressão “no amor” liga-se mais naturalmente a “enraizados e alicerçados”; alguns, porém, a ligam a “habite nos corações de vocês”.
    reason: alternative_reading
lexical_decisions:
- source_word: κατοικῆσαι
  choice: habite
  rationale: O infinitivo aoristo depende da oração de pedido anterior e expressa propósito ou resultado. “Habite” comunica residência estável, não mera presença passageira.
- source_word: τὸν Χριστόν
  choice: o Messias
  rationale: O artigo e o contexto permitem preservar Χριστός como título, vertendo seu sentido em português, em vez de apenas transliterá-lo.
- source_word: διὰ τῆς πίστεως
  choice: por meio da fé
  rationale: A construção διά com genitivo indica o meio. Neste contexto, “fé” é a tradução mais natural de πίστις, embora “confiança” seja lexicalmente possível.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: nos corações de vocês
  rationale: Mantém o plural grego e a expressão bíblica natural para o centro da vida interior, sem restringi-la às emoções.
- source_word: ἐν ἀγάπῃ
  choice: no amor
  rationale: Preserva a ideia da esfera ou do solo figurado em que os leitores estão enraizados e alicerçados.
- source_word: ἐρριζωμένοι
  choice: estando vocês enraizados
  rationale: O particípio perfeito passivo descreve um estado presente resultante de uma ação anterior. “Enraizados” conserva a metáfora agrícola.
- source_word: τεθεμελιωμένοι
  choice: alicerçados
  rationale: Conserva a metáfora arquitetônica de fundamento e forma, em português natural, um par expressivo com “enraizados”.
theological_decisions:
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: o Cristo
  rationale: A forma principal traduz o significado do título grego. A alternativa tradicional é registrada sem impor uma distinção doutrinária.
- issue: Sentido de πίστις
  choice: fé
  alternative: confiança
  rationale: “Fé” é o sentido contextual mais provável para o meio pelo qual o Messias habita nos corações; “confiança” continua possível no âmbito lexical.
- issue: Ligação sintática de ἐν ἀγάπῃ
  choice: ligado a “enraizados e alicerçados”
  alternative: ligado a “habite nos corações de vocês”
  rationale: A sequência e as metáforas favorecem entender o amor como a esfera em que os leitores estão enraizados e alicerçados, mas a posição da expressão permite a outra ligação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa. A vírgula final preserva o fato de que a construção continua no versículo seguinte. As duas metáforas distintas do original — agrícola e arquitetônica — foram mantidas.
