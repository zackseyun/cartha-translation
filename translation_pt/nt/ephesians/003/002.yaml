  text: εἴ γε ἠκούσατε τὴν οἰκονομίαν τῆς χάριτος τοῦ θεοῦ τῆς δοθείσης μοι εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/002.yaml
  text: assuming indeed that you have heard of the stewardship of God's grace that was given to me for you[b][a],
translation:
  language: pt
  text: Se, de fato, vocês ouviram falar do encargo de administrar a graça de Deus[b] que me foi concedida em favor de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se é que vocês ouviram falar”. O grego mantém uma forma condicional, embora, no contexto, Paulo provavelmente suponha que isso seja verdade.'
    reason: alternative_reading
  - marker: b
    text: Para “encargo de administrar”, o termo grego também pode ser traduzido como “administração”, “mordomia” ou “incumbência”. Ele indica a gestão de algo confiado a alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: supondo, é claro, que
  rationale: Preserva a forma condicional e, ao mesmo tempo, comunica que Paulo espera que a suposição seja verdadeira.
- source_word: ἠκούσατε
  choice: tenham ouvido falar
  rationale: O perfeito composto após “supondo que” é natural em português e apresenta o ato passado de ouvir como relevante para o argumento presente.
- source_word: οἰκονομίαν
  choice: encargo de administrar
  rationale: Expressa de modo claro a responsabilidade confiada a Paulo, preservando as ideias de incumbência e administração sem recorrer ao termo menos transparente “dispensação”.
- source_word: χάριτος τοῦ θεοῦ
  choice: a graça de Deus
  rationale: Mantém a terminologia paulina habitual e a relação genitiva, que pode indicar tanto origem como pertencimento.
- source_word: τῆς δοθείσης μοι
  choice: que me foi concedida
  rationale: O particípio genitivo concorda diretamente com “graça”; “concedida” preserva o sentido de dom e a voz passiva, sem identificar explicitamente o agente.
- source_word: εἰς ὑμᾶς
  choice: em favor de vocês
  rationale: Comunica a orientação e o benefício do dom recebido por Paulo para os destinatários.
theological_decisions:
- issue: Sentido de “οἰκονομία da graça de Deus”
  choice: A responsabilidade confiada a Paulo de administrar a graça divina em favor dos destinatários.
  alternative: O plano ou a dispensação salvífica de Deus em sentido mais abstrato.
  rationale: O contexto imediato destaca o ministério confiado a Paulo em favor dos gentios. “Encargo de administrar” mantém esse sentido pessoal sem excluir o plano divino mais amplo.
- issue: Força de εἴ γε
  choice: Uma suposição retórica que Paulo espera ser verdadeira.
  alternative: 'Uma condição que expressa dúvida real: “se é que vocês ouviram”.'
  rationale: A expressão conserva forma condicional, mas o contexto sugere que Paulo presume que os leitores conhecem sua missão.
- issue: Referente de τῆς δοθείσης μοι
  choice: A graça de Deus foi concedida a Paulo.
  alternative: Por sentido amplo, o encargo ou a administração foi dado a Paulo.
  rationale: A concordância gramatical no genitivo liga diretamente o particípio a χάριτος, embora o contexto permita compreender que essa graça inclui a incumbência ministerial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” evita regionalismo excessivo; “encargo de administrar” torna explícita a ideia de responsabilidade confiada sem impor uma interpretação denominacional.
