  text: καὶ φωτίσαι ⸀πάντας τίς ἡ οἰκονομία τοῦ μυστηρίου τοῦ ἀποκεκρυμμένου ἀπὸ τῶν αἰώνων ἐν τῷ θεῷ τῷ τὰ πάντα ⸀κτίσαντι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/009.yaml
  text: and to bring to light for everyone what is the administration of the mystery hidden from the ages in God[a], who created all things[b],
translation:
  language: pt
  text: e trazer à luz, para todos, qual é a administração do mistério[a], oculto desde as eras[b] em Deus, que criou todas as coisas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «qual é a gestão do mistério» ou «qual é o plano do mistério».
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «desde as eras»; ou «por eras»; de modo mais interpretativo, «desde a eternidade».
    reason: lexical_alternative
lexical_decisions:
- source_word: φωτίσαι
  choice: trazer à luz
  rationale: Preserva a metáfora de iluminação e, com a oração interrogativa indireta que segue, comunica naturalmente a ideia de tornar conhecido.
- source_word: πάντας
  choice: para todos
  rationale: Expressa o alcance pessoal e universal do grego sem produzir a construção pouco natural «iluminar todos quanto a».
- source_word: τίς ἡ οἰκονομία
  choice: qual é a administração
  rationale: Mantém o sentido de gestão, ordenação ou execução ligado a οἰκονομία, sem reduzir o termo simplesmente a «plano» nem importar um sistema teológico posterior.
- source_word: μυστηρίου
  choice: mistério
  rationale: Conserva o uso paulino de um propósito divino antes oculto e agora revelado; «segredo» perderia parte dessa ressonância.
- source_word: ἀποκεκρυμμένου
  choice: oculto
  rationale: Reproduz de modo conciso o estado resultante expresso pelo particípio perfeito passivo.
- source_word: ἀπὸ τῶν αἰώνων
  choice: ao longo das eras
  rationale: Comunica a ocultação através de eras passadas em português natural, sem transformar explicitamente a expressão em «desde a eternidade».
- source_word: ἐν τῷ θεῷ
  choice: em Deus
  rationale: Mantém a preposição grega e a imagem de que o mistério permanecia oculto em Deus, não apenas junto dele.
- source_word: τῷ τὰ πάντα κτίσαντι
  choice: que criou todas as coisas
  rationale: A oração relativa verte naturalmente o particípio atributivo e «todas as coisas» corresponde ao alcance de τὰ πάντα.
theological_decisions:
- issue: Sentido de οἰκονομία em relação ao mistério
  choice: administração
  alternative: gestão; plano; ordenação
  rationale: «Administração» preserva o aspecto concreto da execução ou disposição do mistério, sem limitar o termo ao conteúdo do mistério nem lhe atribuir um sentido técnico denominacional.
- issue: Força temporal de ἀπὸ τῶν αἰώνων
  choice: ao longo das eras
  alternative: desde as eras; por eras; desde a eternidade
  rationale: A tradução conserva a referência às eras e a duração prolongada da ocultação, evitando afirmar de forma mais explícita do que o grego que ela remonta à eternidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil e compreensíveis internacionalmente. A vírgula final foi mantida porque o versículo continua a oração iniciada no contexto anterior.
