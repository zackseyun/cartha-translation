  source_fidelity: O texto traduz adequadamente ἐξ οὗ πᾶσα πατριὰ ἐν οὐρανοῖς καὶ ἐπὶ γῆς ὀνομάζεται. “De quem” preserva a origem expressa por ἐξ οὗ; “toda família” mantém a leitura distributiva mais provável de πᾶσα πατριά; e “nos céus e na terra” reproduz corretamente os dois âmbitos. “Recebe o nome” é uma forma portuguesa natural de exprimir o passivo ὀνομάζεται no contexto e conserva a relação de nomeação/origem.
  naturalness: A redação é fluente, moderna e digna em português amplamente compreensível, com boa legibilidade brasileira. “Nos céus e na terra” é idiomático e apropriado ao registro bíblico.
  terminology: “Família” é a opção principal mais segura para πατριά, sem impor a interpretação abstrata “paternidade”. A nota apresenta de maneira adequada tanto a possibilidade coletiva (“a família inteira”) quanto a leitura interpretativa ligada ao jogo de palavras com “Pai” no versículo anterior.
