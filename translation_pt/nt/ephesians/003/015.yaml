  text: ἐξ οὗ πᾶσα πατριὰ ἐν οὐρανοῖς καὶ ἐπὶ γῆς ὀνομάζεται,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/015.yaml
  text: from whom every family in heaven and on earth is named,[a]
translation:
  language: pt
  text: de quem toda família nos céus e na terra recebe o nome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a família inteira nos céus e na terra é nomeada”; ou, de modo mais interpretativo: “de quem toda paternidade nos céus e na terra recebe seu nome”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξ οὗ
  choice: de quem
  rationale: Representa naturalmente a ideia de origem expressa por ἐξ com o pronome relativo no genitivo, sem tornar explícita além do grego a relação indicada pelo verbo de nomear.
- source_word: πᾶσα
  choice: toda
  rationale: 'Com o substantivo singular πατριά, tem aqui sentido distributivo: cada família. Em português, “toda família” comunica isso de modo natural, embora a leitura coletiva “a família inteira” continue possível.'
- source_word: πατριὰ
  choice: família
  rationale: É o equivalente moderno mais claro para um grupo familiar, clã ou linhagem. Preserva, tanto quanto possível em português, a relação contextual com “Pai” sem substituir o sentido concreto pelo abstrato “paternidade”.
- source_word: ἐν οὐρανοῖς
  choice: nos céus
  rationale: Conserva o plural do grego e é uma formulação portuguesa natural para o âmbito celestial.
- source_word: ἐπὶ γῆς
  choice: na terra
  rationale: Tradução locativa idiomática e precisa.
- source_word: ὀνομάζεται
  choice: recebe o nome
  rationale: Expressa com naturalidade o presente passivo “é nomeada”, mantendo o vínculo lexical com nome. Evita afirmar de maneira excessivamente interpretativa que o nome necessariamente “deriva” de Deus.
theological_decisions:
- issue: Sentido de πᾶσα πατριὰ em relação ao Pai mencionado no versículo anterior
  choice: toda família
  alternative: a família inteira; toda paternidade
  rationale: A redação principal mantém o sentido distributivo mais provável e o significado comum de πατριά, sem decidir que Paulo fala de uma única família coletiva nem transformar o termo em uma abstração teológica. A nota registra as alternativas e a possível ideia de derivação do nome.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Recebe o nome” é mais natural que “é nomeada” neste contexto e ainda preserva a ambiguidade quanto à natureza exata da relação de origem.
