  text: ἐμοὶ τῷ ἐλαχιστοτέρῳ πάντων ἁγίων ἐδόθη ἡ χάρις αὕτη— ⸀τοῖς ἔθνεσιν εὐαγγελίσασθαι ⸂τὸ ἀνεξιχνίαστον πλοῦτος⸃ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/008.yaml
  text: To me[a], the very least of all the saints, this grace was given—to proclaim to the Gentiles the unsearchable riches of Messiah[c][b],
translation:
  language: pt
  text: 'A mim, o menor de todos os santos, foi dada esta graça: anunciar aos gentios[a] as riquezas insondáveis do Messias[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “às nações”. Neste contexto, o termo se refere provavelmente aos povos não judeus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de Cristo”. O título grego Χριστός pode ser traduzido como “Messias” ou vertido tradicionalmente como “Cristo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλαχιστοτέρῳ
  choice: o menor
  rationale: O comparativo intensificado expressa a profunda humildade retórica de Paulo. “O menor” é natural em português e, no contexto, comunica sua autodepreciação extrema sem a formulação pouco idiomática “menor que o menor”.
- source_word: ἁγίων
  choice: santos
  rationale: No uso paulino, refere-se aos que pertencem a Deus como povo consagrado. “Santos” mantém concisão, continuidade lexical e registro bíblico compreensível.
- source_word: χάρις
  choice: graça
  rationale: Preserva tanto o favor divino imerecido quanto a comissão concedida a Paulo, sem reduzir o termo a apenas “dom” ou “favor”.
- source_word: ἔθνεσιν
  choice: gentios
  rationale: Neste contexto, designa especialmente os povos não judeus, em consonância com o contraste entre judeus e gentios desenvolvido na carta.
- source_word: εὐαγγελίσασθαι
  choice: anunciar
  rationale: O infinitivo indica a missão de comunicar as boas-novas. Como o objeto explicita aquilo que é anunciado, “anunciar” é fluente e suficientemente claro.
- source_word: ἀνεξιχνίαστον
  choice: insondáveis
  rationale: Indica aquilo cuja extensão não pode ser plenamente investigada ou compreendida. “Insondáveis” preserva a imagem e é idiomático em português.
- source_word: πλοῦτος
  choice: riquezas
  rationale: Mantém a metáfora paulina da abundância dos bens salvíficos encontrados no Messias.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Χριστός funciona aqui como título do Ungido. “Messias” traduz o sentido do título e evita tratá-lo automaticamente como mero nome próprio.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: O termo grego é um título que significa “Ungido”. “Messias” torna explícito esse valor titular, enquanto “Cristo” é a forma tradicional transliterada por meio do latim.
- issue: Alcance de ἔθνεσιν
  choice: aos gentios
  alternative: às nações
  rationale: O contexto da carta aponta para os não judeus como destinatários da missão de Paulo. A alternativa literal “nações” permanece possível e é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem inicial “A mim” preserva a ênfase do grego. Os dois-pontos representam naturalmente a relação explicativa do infinitivo com a graça concedida.
