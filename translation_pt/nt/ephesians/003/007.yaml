source:
  edition: SBLGNT
  text: οὗ ⸀ἐγενήθην διάκονος κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ ⸂τῆς δοθείσης⸃ μοι κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/007.yaml
  text: of which I became a servant according to the gift of God's grace given to me according to the working of his power—[a]
translation:
  language: pt
  text: do qual me tornei servo[a], segundo o dom da graça de Deus que me foi dada, segundo a atuação do seu poder—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fui constituído ministro”.'
    reason: Alternativa lexical e possível nuance passiva de ἐγενήθην, juntamente com a tradução possível de διάκονος.
lexical_decisions:
- source_word: οὗ
  choice: do qual
  rationale: O pronome relativo genitivo retoma o substantivo neutro εὐαγγέλιον (“evangelho”) no contexto anterior. “Do qual” preserva a ligação relativa sem substituir o referente por uma explicitação.
- source_word: ἐγενήθην
  choice: me tornei
  rationale: O aoristo de γίνομαι indica que Paulo passou a exercer essa função. “Me tornei” é natural em português e não elimina totalmente a possível nuance passiva, esclarecida em nota.
- source_word: διάκονος
  choice: servo
  rationale: Neste contexto, διάκονος descreve quem serve ao evangelho. “Servo” comunica a função sem importar necessariamente o cargo eclesiástico posterior associado a “diácono”.
- source_word: κατὰ τὴν δωρεὰν
  choice: segundo o dom
  rationale: A expressão com κατά indica conformidade, base ou medida. “Segundo o dom” conserva a estrutura e a relação conceitual do grego.
- source_word: τῆς χάριτος τοῦ θεοῦ
  choice: da graça de Deus
  rationale: A cadeia de genitivos é expressa de modo claro e natural, mantendo o dom ligado à graça que procede de Deus.
- source_word: τῆς δοθείσης μοι
  choice: que me foi dada
  rationale: A oração relativa explicita com naturalidade o particípio passivo feminino, que modifica “graça”, e preserva a recepção do dom por Paulo.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: segundo a atuação
  rationale: ἐνέργεια denota ação eficaz ou poder em operação. “Atuação” é corrente e mantém a ideia dinâmica sem recorrer ao termo técnico “operação”.
- source_word: τῆς δυνάμεως αὐτοῦ
  choice: do seu poder
  rationale: “Poder” é a correspondência portuguesa normal para δύναμις neste contexto paulino e conserva a referência a Deus.
theological_decisions:
- issue: Natureza da função de Paulo como διάκονος
  choice: servo
  alternative: ministro; diácono
  rationale: O texto descreve o serviço de Paulo em relação ao evangelho, sem identificar explicitamente um cargo eclesiástico formal. “Servo” preserva o sentido funcional.
- issue: Agência em ἐγενήθην
  choice: me tornei
  alternative: fui constituído
  rationale: A forma grega pode admitir nuance passiva, enquanto o contexto atribui a vocação à graça e ao poder de Deus. A tradução principal mantém a expressão idiomática sem decidir além do necessário; a nota registra a alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o caráter de continuação sintática do versículo anterior e o travessão final presente no texto-fonte fornecido.
