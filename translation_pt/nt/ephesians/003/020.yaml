id: EPH.3.20
reference: Ephesians 3:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τῷ δὲ δυναμένῳ ὑπὲρ πάντα ποιῆσαι ὑπερεκπερισσοῦ ὧν αἰτούμεθα ἢ νοοῦμεν κατὰ τὴν δύναμιν τὴν ἐνεργουμένην ἐν ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/020.yaml
  text: To the one who is able to do far beyond all that we ask or think[a], according to the power at work in us[b],
translation:
  language: pt
  text: Àquele que é capaz de fazer muito além[a] de tudo o que pedimos ou pensamos[b], segundo o poder que atua em nós,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de modo superabundante” ou “imensamente além”; o grego intensifica a ideia de exceder tudo o que se pede ou pensa.
    reason: lexical_alternative
  - marker: b
    text: Ou “concebemos” ou “imaginamos”; o verbo grego pode se referir ao que a mente é capaz de conceber.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: Àquele que é capaz
  rationale: O particípio substantivado no dativo introduz o destinatário da doxologia, que prossegue no versículo 21. A formulação preserva a referência implícita sem acrescentar “Deus”, ausente neste versículo.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui δέ assinala uma transição leve para a conclusão doxológica. Em português, acrescentar “agora”, “mas” ou “porém” tornaria a ligação mais marcada do que o contexto exige; a própria abertura “Àquele” realiza naturalmente a transição.
- source_word: ὑπὲρ πάντα ... ὑπερεκπερισσοῦ
  choice: muito além de tudo
  rationale: A expressão comunica excesso de medida, e o advérbio intensivo reforça esse sentido. “Muito além” é natural e enfático sem introduzir uma quantificação matemática ausente do grego.
- source_word: ποιῆσαι
  choice: fazer
  rationale: Mantém a amplitude e a simplicidade de ποιέω; “realizar” seria possível, mas ligeiramente mais específico.
- source_word: ὧν αἰτούμεθα ἢ νοοῦμεν
  choice: do que pedimos ou pensamos
  rationale: A construção comparativa é vertida de maneira idiomática. νοέω abrange aquilo que a mente pensa ou concebe, por isso “pensamos” preserva sua amplitude.
- source_word: κατὰ τὴν δύναμιν
  choice: segundo o poder
  rationale: κατά com acusativo indica aqui conformidade, padrão ou medida, não apenas instrumento; “segundo” preserva essa nuance.
- source_word: τὴν ἐνεργουμένην
  choice: que atua
  rationale: Expressa a atividade presente e eficaz do poder, em linguagem portuguesa corrente e digna.
- source_word: ἐν ἡμῖν
  choice: em nós
  rationale: Preserva o sentido mais direto de poder operante nos crentes, sem excluir a dimensão comunitária.
theological_decisions:
- issue: Referente implícito do destinatário da doxologia
  choice: Àquele que é capaz
  alternative: A Deus, que é capaz
  rationale: Embora o contexto identifique claramente Deus, o versículo não repete o substantivo θεός. A tradução mantém o referente implícito e a continuidade sintática com o versículo 21.
- issue: Modo de atuação do poder divino nos crentes
  choice: o poder que atua em nós
  alternative: o poder que atua entre nós
  rationale: “Em nós” reflete diretamente ἐν ἡμῖν e afirma a eficácia desse poder nos crentes sem definir um mecanismo doutrinário específico.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Conserva-se a forma incompleta da frase e a vírgula final, pois a doxologia continua no versículo 21. O tom é elevado sem recorrer a formulações arcaicas.
