  text: ἐν ᾧ ἔχομεν τὴν παρρησίαν ⸀καὶ προσαγωγὴν ἐν πεποιθήσει διὰ τῆς πίστεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/012.yaml
  text: in whom we have boldness and access with confidence through faith in him[a].
translation:
  language: pt
  text: Nele temos ousadia e acesso, com confiança, por meio da fé nele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio da fidelidade dele”. A expressão grega pode se referir tanto à fé dirigida a Cristo quanto à fidelidade do próprio Cristo.'
    reason: Leitura alternativa de um genitivo grego genuinamente ambíguo.
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nele
  rationale: O pronome relativo masculino retoma naturalmente Cristo no contexto anterior. “Nele” é conciso e preserva a ideia de relação ou união com Cristo.
- source_word: παρρησίαν
  choice: ousadia
  rationale: Expressa franqueza e liberdade diante de Deus, sem se confundir com πεποίθησις, traduzido separadamente por “confiança”.
- source_word: προσαγωγὴν
  choice: acesso a Deus
  rationale: No uso paulino, o termo indica entrada ou acesso à presença de Deus. O complemento “a Deus”, implícito no contexto, torna o sentido claro em português corrente.
- source_word: ἐν πεποιθήσει
  choice: com confiança
  rationale: A construção indica a maneira segura e confiante pela qual esse acesso é desfrutado; “com confiança” é natural em português.
- source_word: διὰ τῆς πίστεως αὐτοῦ
  choice: por meio da fé nele
  rationale: Adota no texto principal a leitura do genitivo objetivo, isto é, fé dirigida a Cristo, sem eliminar a possível leitura subjetiva, registrada em nota.
theological_decisions:
- issue: Sentido de διὰ τῆς πίστεως αὐτοῦ
  choice: por meio da fé nele
  alternative: por meio da fidelidade dele
  rationale: O genitivo αὐτοῦ pode indicar tanto fé em Cristo quanto a fidelidade do próprio Cristo. O contexto do acesso dos crentes favorece a primeira leitura no texto principal, enquanto a nota preserva a ambiguidade real.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Acesso a Deus” explicita o referente contextual sem alterar o sentido; a ambiguidade teológica de πίστις αὐτοῦ é preservada em nota.
