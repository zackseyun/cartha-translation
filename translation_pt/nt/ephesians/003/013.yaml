id: EPH.3.13
reference: Ephesians 3:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὸ αἰτοῦμαι μὴ ⸀ἐγκακεῖν ἐν ταῖς θλίψεσίν μου ὑπὲρ ὑμῶν, ἥτις ἐστὶν δόξα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/013.yaml
  text: Therefore I ask you not to lose heart because of my afflictions for your sake[b][a], which are your glory.
translation:
  language: pt
  text: Por isso, peço que vocês não desanimem por causa das minhas aflições em favor de vocês[a] — isso é a glória de vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não fiquem desanimados diante das minhas aflições em favor de vocês”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, as aflições de Paulo — ou, mais amplamente, seu ministério e sofrimento em favor deles — redundam na glória dos leitores no propósito salvador de Deus.
    reason: referent_clarification
lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Expressa de modo natural a conclusão decorrente do argumento anterior.
- source_word: αἰτοῦμαι
  choice: peço que vocês
  rationale: O destinatário do pedido está implícito no grego e é explicitado em português para que a construção com o infinitivo seja clara e natural.
- source_word: μὴ ἐγκακεῖν
  choice: não desanimem
  rationale: Comunica a ideia de perder a coragem ou ficar desalentado, em linguagem atual e digna.
- source_word: ἐν ταῖς θλίψεσίν μου
  choice: por causa das minhas aflições
  rationale: Embora ἐν possa ser vertido literalmente por “em”, aqui indica a circunstância ou causa do desânimo. “Aflições” conserva a gravidade de θλῖψις.
- source_word: ὑπὲρ ὑμῶν
  choice: em favor de vocês
  rationale: Preserva o sentido benefativo de ὑπέρ, indicando que os sofrimentos de Paulo estavam ligados ao serviço prestado em benefício dos leitores.
- source_word: ἥτις ἐστὶν δόξα ὑμῶν
  choice: isso é a glória de vocês
  rationale: “Isso” retoma a situação precedente como um todo sem impor um antecedente mais estreito do que o grego permite; “glória” mantém a força teológica e retórica de δόξα.
theological_decisions:
- issue: Referente de ἥτις em “ἥτις ἐστὶν δόξα ὑμῶν”
  choice: “Isso” retoma as aflições de Paulo em favor dos leitores, consideradas como uma realidade conjunta.
  alternative: A oração pode remeter mais amplamente ao ministério de Paulo e aos sofrimentos que ele suporta em favor deles.
  rationale: A tradução mantém a relação mais imediata com as aflições, mas o pronome neutro “isso” preserva a possibilidade de referência à situação ou ao ministério-sofrimento como um todo.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Vocês” explicita o destinatário plural; “aflições” mantém o peso do sofrimento; o travessão destaca a conclusão enfática sem explicar além do texto.
