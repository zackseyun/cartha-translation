  text: γνῶναί τε τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην τοῦ Χριστοῦ, ἵνα πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/019.yaml
  text: and to know the love of Messiah that surpasses knowledge[b][a], so that you may be filled unto all the fullness of God.
translation:
  language: pt
  text: e conhecer o amor do Messias[a], que supera o conhecimento, para que vocês sejam cheios para toda a plenitude de Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, conforme a tradução tradicional, “de Cristo”.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “cheios de toda a plenitude de Deus”. O grego traz “cheios para toda a plenitude de Deus”, uma expressão condensada em que a preposição pode destacar orientação para a medida plena da plenitude de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναί
  choice: conhecer
  rationale: Preserva a ligação lexical e o paradoxo com γνώσεως (“conhecimento”), permitindo tanto o sentido cognitivo quanto o experiencial.
- source_word: τε
  choice: e
  rationale: Coordena de modo leve este infinitivo com os pedidos anteriores da oração de Paulo.
- source_word: ὑπερβάλλουσαν τῆς γνώσεως
  choice: que supera o conhecimento
  rationale: Expressa com naturalidade o particípio presente e conserva o paradoxo de conhecer um amor que excede o conhecimento.
- source_word: ἀγάπην τοῦ Χριστοῦ
  choice: o amor do Messias
  rationale: Mantém a construção genitiva sem decidir explicitamente entre o amor exercido pelo Messias e o amor dirigido a ele; “Messias” traduz o valor titular de Χριστός.
- source_word: ἵνα
  choice: para que
  rationale: Introduz naturalmente em português a ideia de propósito ou resultado.
- source_word: πληρωθῆτε
  choice: vocês sejam cheios
  rationale: Reflete o aoristo passivo do verbo e usa uma formulação clara e corrente no contexto bíblico.
- source_word: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: até toda a plenitude de Deus
  rationale: Conserva a força direcional ou télica de εἰς e a expressão densa de Paulo, sem reduzi-la simplesmente a “com toda a plenitude”.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: Χριστός mantém aqui seu valor de título; “Messias” comunica esse sentido, enquanto a alternativa tradicional é registrada em nota.
- issue: Sentido do genitivo em ἀγάπην τοῦ Χριστοῦ
  choice: amor do Messias
  alternative: amor que o Messias tem por nós / amor pelo Messias
  rationale: A formulação preserva a ambiguidade gramatical do genitivo, embora o contexto favoreça fortemente o amor demonstrado pelo Messias.
- issue: Sentido de εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: cheios até toda a plenitude de Deus
  alternative: cheios de toda a plenitude de Deus
  rationale: “Até” preserva a orientação para uma meta ou medida plena sugerida por εἰς e evita eliminar a tensão da expressão condensada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A expressão incomum “cheios até” foi mantida deliberadamente para refletir a construção grega e sua força direcional; a leitura mais idiomática aparece em nota.
