    issue: «até toda a plenitude de Deus» é sintaticamente inadequado em português.
    rationale: Embora εἰς possa ter valor direcional/télico, «até» requer normalmente um limite ou oração que possa funcionar como termo de chegada; ligado diretamente a «toda a plenitude», produz uma sequência pouco inteligível. «Para toda a plenitude» mantém a orientação da preposição sem afirmar que o texto significa simplesmente «com».
  - severity: low
