  text: εἶναι τὰ ἔθνη συγκληρονόμα καὶ σύσσωμα καὶ συμμέτοχα τῆς ἐπαγγελίας ⸂ἐν Χριστῷ Ἰησοῦ⸃ διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/006.yaml
  text: that the Gentiles are fellow heirs[a], fellow members of the body, and fellow partakers of the promise in Messiah Jesus through the gospel[c][b],
translation:
  language: pt
  text: isto é, que os gentios[a] são coerdeiros, membros do mesmo corpo e coparticipantes da promessa em Jesus, o Messias,[b] por meio do evangelho,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «as nações». Aqui, o termo se refere especificamente aos povos não judeus incluídos na promessa salvadora de Deus juntamente com os judeus.
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: «em Cristo Jesus». O título grego Χριστός é traduzido aqui por «Messias» para preservar sua força titular.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶναι
  choice: isto é, que ... são
  rationale: O infinitivo explicita o conteúdo do mistério mencionado no contexto anterior. A construção finita introduzida por «isto é, que» liga naturalmente este fragmento ao versículo precedente.
- source_word: τὰ ἔθνη
  choice: os gentios
  rationale: Neste contexto paulino, o termo designa especificamente os povos não judeus, agora incluídos com os judeus na promessa, e não nações em sentido geopolítico.
- source_word: συγκληρονόμα
  choice: coerdeiros
  rationale: O composto com συν- expressa participação conjunta na mesma herança. «Coerdeiros» é conciso, corrente e mantém o paralelismo do original.
- source_word: σύσσωμα
  choice: membros do mesmo corpo
  rationale: O termo raro indica incorporação conjunta em um só corpo. A formulação explicita a metáfora corporal sem acrescentar uma interpretação denominacional.
- source_word: συμμέτοχα
  choice: coparticipantes
  rationale: Expressa participação conjunta e, com «coerdeiros», reproduz tanto quanto possível a sequência enfática dos três compostos gregos com συν-.
- source_word: τῆς ἐπαγγελίας
  choice: da promessa
  rationale: 'Mantém o singular e a relação genitiva: os gentios participam conjuntamente da promessa.'
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: em Jesus, o Messias
  rationale: A expressão preserva o valor titular de Χριστός e, em português natural, identifica Jesus como o Messias sem tratar o título apenas como parte de um nome próprio.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: por meio do evangelho
  rationale: διά com o genitivo indica o meio pelo qual os gentios passam a participar da promessa.
theological_decisions:
- issue: Valor titular ou nominal de Χριστός
  choice: Jesus, o Messias
  alternative: Cristo Jesus
  rationale: No argumento sobre o cumprimento da promessa e a inclusão dos gentios, o sentido messiânico do título permanece relevante. A tradução escolhida torna esse valor explícito sem impor uma leitura sectária.
- issue: Referente de τὰ ἔθνη
  choice: os gentios
  alternative: as nações
  rationale: O contraste contextual é entre judeus e não judeus. «Gentios» comunica com maior precisão essa referência, enquanto a alternativa lexical é registrada em nota.
- issue: Força de σύσσωμα
  choice: membros do mesmo corpo
  alternative: formam um só corpo
  rationale: A escolha conserva a metáfora de pertencimento corporal e evita transformar o adjetivo em uma afirmação verbal mais interpretativa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário compreensível tanto no Brasil quanto em outros contextos lusófonos. A série «coerdeiros, membros do mesmo corpo e coparticipantes» busca preservar o paralelismo enfático do grego sem recorrer a neologismos pouco naturais. A pontuação final mantém o caráter de fragmento sintaticamente ligado ao contexto anterior.
