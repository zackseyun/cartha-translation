id: EPH.3.21
reference: Ephesians 3:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: αὐτῷ ἡ δόξα ἐν τῇ ἐκκλησίᾳ ⸀καὶ ἐν Χριστῷ Ἰησοῦ εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/021.yaml
  text: To him be glory in the church and in Messiah Jesus through all generations forever and ever[a]. Amen.
translation:
  language: pt
  text: A ele seja a glória, na igreja e no Messias Jesus, por todas as gerações, para todo o sempre.[a] Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Cristo Jesus». O título grego Χριστός significa «Messias».'
    reason: Registra a forma tradicional alternativa e esclarece o sentido do título grego.
lexical_decisions:
- source_word: αὐτῷ ἡ δόξα
  choice: A ele seja a glória
  rationale: A frase grega não traz verbo expresso. A formulação doxológica portuguesa com «seja» comunica naturalmente a atribuição de glória sem transformar a expressão em mera afirmação de posse.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: na igreja
  rationale: «Igreja» é a tradução corrente e adequada de ἐκκλησία no uso paulino; «na» preserva a preposição ἐν e seu paralelismo com a expressão seguinte.
- source_word: καὶ ἐν Χριστῷ Ἰησοῦ
  choice: e no Messias Jesus
  rationale: Χριστός é preservado como título significativo, «Messias», enquanto Ἰησοῦ é transliterado pelo nome português tradicional. A repetição de «no» mantém o paralelismo do grego.
- source_word: εἰς πάσας τὰς γενεὰς
  choice: por todas as gerações
  rationale: A expressão indica extensão ao longo de todas as gerações; «por» é idiomático em português nesse uso temporal.
- source_word: τοῦ αἰῶνος τῶν αἰώνων
  choice: para todo o sempre
  rationale: Trata-se de uma expressão intensiva de duração ilimitada. «Para todo o sempre» é clara, natural e conserva o tom doxológico.
- source_word: ἀμήν
  choice: Amém
  rationale: Forma litúrgica tradicional e amplamente compreendida em português.
theological_decisions:
- issue: Χριστός como título ou forma semelhante a nome próprio
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: A tradução «Messias» torna explícito o sentido titular de Χριστός sem mudar o referente. A alternativa tradicional «Cristo Jesus» é registrada em nota para não ocultar a equivalência terminológica.
- issue: Relação de ἐν com igreja e Messias Jesus
  choice: na igreja e no Messias Jesus
  alternative: entre a igreja e por meio do Messias Jesus
  rationale: Mantém-se a mesma preposição nos dois membros paralelos, evitando especificar de modo indevido relações instrumentais ou coletivas que o texto grego não explicita.
translation_notes:
  register: Português moderno, claro e reverente, com cadência doxológica. A vírgula após «glória» ajuda a leitura da atribuição com dois âmbitos paralelos; a nota é marcada no texto principal conforme exigido.
