lexical_decisions:
- source_word: Τούτου χάριν
  choice: Por essa razão
  rationale: A construção idiomática indica o motivo do que segue e retoma o contexto anterior. “Por essa razão” é natural em português e preserva essa ligação discursiva.
- source_word: κάμπτω
  choice: dobro
  rationale: O verbo significa literalmente “dobrar”. Com “os joelhos” como objeto explícito, esta tradução conserva a imagem corporal do grego sem reduzi-la ao interpretativo “ajoelho-me”.
- source_word: τὰ γόνατά μου
  choice: os joelhos
  rationale: Em português, com o sujeito expresso pelo verbo na primeira pessoa, o artigo definido é a forma idiomática usual para partes do corpo; a relação possessiva permanece clara. A expressão corporal explícita é preservada.
- source_word: πρὸς
  choice: diante de
  rationale: Neste contexto de oração, a preposição expressa orientação em direção à pessoa a quem Paulo se dirige. “Diante de” produz uma formulação portuguesa natural para a postura de oração, embora “ao” seja uma alternativa mais estritamente direcional.
- source_word: πατέρα
  choice: Pai
  rationale: O artigo e o contexto identificam Deus como aquele a quem a oração é dirigida. A inicial maiúscula assinala o uso como designação divina segundo a convenção portuguesa.
theological_decisions:
- issue: Se πατέρα deve ser traduzido como título divino
  choice: o Pai
  alternative: o pai
  rationale: O contexto descreve a oração de Paulo dirigida a Deus, e o versículo seguinte desenvolve a linguagem de paternidade. “O Pai” identifica naturalmente o referente sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a imagem de dobrar os joelhos e a conexão argumentativa com o contexto anterior.
