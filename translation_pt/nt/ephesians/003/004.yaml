id: EPH.3.4
reference: Ephesians 3:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πρὸς ὃ δύνασθε ἀναγινώσκοντες νοῆσαι τὴν σύνεσίν μου ἐν τῷ μυστηρίῳ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/004.yaml
  text: By reading this[a], you are able to understand my insight into the mystery of Messiah,
translation:
  language: pt
  text: Ao lerem isso, vocês podem compreender o meu entendimento do mistério do Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cristo”. O título grego Χριστός pode ser traduzido como “Messias” ou, tradicionalmente, “Cristo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς ὃ ... ἀναγινώσκοντες
  choice: Ao lerem isso
  rationale: A expressão retoma o que Paulo acabou de escrever. Em português natural, a combinação com o particípio comunica a circunstância ou o meio pelo qual os leitores podem compreender.
- source_word: δύνασθε
  choice: vocês podem
  rationale: Expressa capacidade de modo claro e corrente, com ampla legibilidade no português brasileiro.
- source_word: νοῆσαι
  choice: compreender
  rationale: Indica apreender mentalmente ou entender; “compreender” mantém o registro digno e evita uma construção pesada.
- source_word: τὴν σύνεσίν μου
  choice: o meu entendimento
  rationale: σύνεσις pode designar entendimento, compreensão ou discernimento. “Entendimento” preserva o sentido sem atribuir uma revelação especial além do que o texto afirma.
- source_word: ἐν τῷ μυστηρίῳ
  choice: do mistério
  rationale: Depois de “entendimento”, o português idiomático emprega “de” para indicar o assunto ou domínio compreendido; isso representa naturalmente o valor contextual de ἐν.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Χριστός funciona aqui como título. “Messias” traduz o valor do termo grego e evita tratá-lo apenas como nome próprio tradicional.
theological_decisions:
- issue: Sentido do genitivo em τοῦ Χριστοῦ
  choice: do Messias
  alternative: referente ao Messias / revelado no Messias
  rationale: 'O genitivo admite mais de uma relação semântica: o mistério pode ser entendido como concernente ao Messias, pertencente a ele ou centrado nele. A formulação concisa “do Messias” preserva essa abertura.'
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Como título, Χριστός significa “Ungido/Messias”. A forma tradicional “Cristo” é registrada em nota para não ocultar a equivalência.
translation_notes:
  register: Português moderno, claro e digno, com pronome plural “vocês” para legibilidade brasileira. A formulação mantém a conexão com os versículos anteriores e preserva a concisão do grego.
