  source_fidelity: A tradução reproduz adequadamente a ligação retrospectiva de πρὸς ὃ com o que foi escrito, o particípio ἀναγινώσκοντες em construção natural de meio/circunstância («Ao lerem isso»), a capacidade expressa por δύνασθε e o conteúdo de νοῆσαι τὴν σύνεσίν μου. «Do mistério do Messias» mantém de modo conciso a relação genitiva aberta em τοῦ Χριστοῦ.
  naturalness: O texto é claro, moderno e fluente para leitores internacionais, com boa legibilidade brasileira. «Vocês podem compreender o meu entendimento» é levemente repetitivo em termos semânticos, como também o é parcialmente o grego, mas permanece natural e preserva a distinção entre compreender e o entendimento de Paulo.
