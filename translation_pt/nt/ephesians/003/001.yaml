id: EPH.3.1
reference: Ephesians 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τούτου χάριν ἐγὼ Παῦλος ὁ δέσμιος τοῦ Χριστοῦ Ἰησοῦ ὑπὲρ ὑμῶν τῶν ἐθνῶν—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/001.yaml
  text: For this reason I[a], Paul[c][b], the prisoner of Messiah Jesus on behalf of you Gentiles—
translation:
  language: pt
  text: Por essa razão, eu, Paulo, prisioneiro do Messias Jesus em favor de vocês, gentios—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Por essa razão
  rationale: A expressão funciona como marcador discursivo que retoma o argumento anterior e introduz sua consequência; esta formulação é natural em português e preserva a força inferencial.
- source_word: ἐγὼ Παῦλος
  choice: eu, Paulo,
  rationale: O pronome expresso recebe destaque, e as vírgulas representam naturalmente a aposição do nome em português.
- source_word: ὁ δέσμιος
  choice: prisioneiro
  rationale: Designa diretamente alguém mantido sob custódia; evita acrescentar a imagem mais interpretativa de correntes.
- source_word: τοῦ Χριστοῦ Ἰησοῦ
  choice: do Messias Jesus
  rationale: 'Χριστός é vertido como o título ''Messias'', enquanto a construção com ''de'' mantém aberta a relação: Paulo está preso por sua ligação e serviço ao Messias Jesus.'
- source_word: ὑπὲρ ὑμῶν
  choice: por causa de vocês
  rationale: No contexto do encarceramento de Paulo, ὑπέρ exprime que sua condição decorre de seu ministério em benefício dos destinatários; a formulação é idiomática e não força exclusivamente a ideia de representação.
- source_word: τῶν ἐθνῶν
  choice: os gentios
  rationale: A expressão está em aposição a 'vocês' e, no contexto paulino, identifica pessoas não judias, não nações em sentido geopolítico.
theological_decisions:
- issue: Χριστοῦ como título ou forma semelhante a nome próprio
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Aqui Χριστός conserva valor titular. 'Messias' torna esse valor explícito sem tratar 'Cristo' como sobrenome.
- issue: Relação expressa pelo genitivo τοῦ Χριστοῦ Ἰησοῦ
  choice: prisioneiro do Messias Jesus
  alternative: prisioneiro por causa do Messias Jesus
  rationale: A formulação mais concisa preserva a tensão entre pertencimento/serviço ao Messias e o fato de Paulo estar preso em razão dele, sem limitar o genitivo a uma única explicação.
- issue: Nuance de ὑπὲρ ὑμῶν
  choice: por causa de vocês
  alternative: em favor de vocês
  rationale: A construção liga o encarceramento de Paulo ao seu ministério entre os gentios. A opção principal soa natural e preserva o nexo causal-beneficiário, enquanto a alternativa salienta mais diretamente o benefício.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém-se o travessão final porque o período é interrompido e retomado em 3.14 após a digressão de 3.2–13.
