  text: ⸀κατὰ ἀποκάλυψιν ⸀ἐγνωρίσθη μοι τὸ μυστήριον, καθὼς προέγραψα ἐν ὀλίγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/003.yaml
  text: that the mystery was made known to me by revelation[a], as I wrote before briefly[c][b],
translation:
  language: pt
  text: que, por revelação[a], o mistério me foi dado a conhecer[b], como escrevi antes em poucas palavras[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo uma revelação” ou “mediante revelação”.
    reason: lexical_alternative
  - marker: b
    text: Ou “me foi revelado”; literalmente, “me foi dado a conhecer”.
    reason: lexical_alternative
  - marker: c
    text: Ou “brevemente” ou “de modo resumido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀποκάλυψιν
  choice: por revelação
  rationale: Expressa de modo natural em português o meio ou modo pelo qual o mistério foi comunicado, sem explicitar o agente além do texto.
- source_word: ἐγνωρίσθη μοι
  choice: me foi dado a conhecer
  rationale: Preserva a forma passiva e o sentido de γνωρίζω, evitando repetir diretamente a linguagem de revelação já presente na oração.
- source_word: τὸ μυστήριον
  choice: o mistério
  rationale: Mantém a categoria teológica paulina de um propósito divino antes oculto e agora manifestado, sem antecipar a explicação dos versículos seguintes.
- source_word: καθὼς
  choice: como
  rationale: Conjunção comparativa simples e natural que relaciona a afirmação ao que Paulo escreveu anteriormente.
- source_word: προέγραψα
  choice: escrevi antes
  rationale: No contexto, refere-se ao que foi escrito anteriormente, provavelmente nesta carta, sem introduzir uma referência mais específica do que o grego permite.
- source_word: ἐν ὀλίγῳ
  choice: em poucas palavras
  rationale: Reproduz com clareza a ideia idiomática de brevidade e é corrente no português moderno.
theological_decisions:
- issue: Sentido de μυστήριον no uso paulino
  choice: o mistério
  alternative: o segredo; o plano oculto de Deus
  rationale: O versículo nomeia a realidade sem ainda definir plenamente seu conteúdo. A tradução preserva a categoria e a tensão do texto, deixando sua explicação ao contexto.
- issue: Agente implícito do passivo ἐγνωρίσθη
  choice: manter o agente sem expressão explícita
  alternative: Deus me deu a conhecer
  rationale: Embora o contexto indique ação divina, o grego usa o passivo sem nomear aqui o agente; a tradução não acrescenta essa identificação ao corpo do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, preservando a passiva e todas as relações semânticas do grego. A vírgula final mantém a continuidade sintática com o versículo seguinte.
