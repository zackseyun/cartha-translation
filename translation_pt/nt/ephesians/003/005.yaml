id: EPH.3.5
reference: Ephesians 3:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃ ἑτέραις γενεαῖς οὐκ ἐγνωρίσθη τοῖς υἱοῖς τῶν ἀνθρώπων ὡς νῦν ἀπεκαλύφθη τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/005.yaml
  text: which was not made known to the sons of men in other generations as it has now been revealed to his holy apostles and prophets in the Spirit[b][a],
translation:
  language: pt
  text: o qual, em outras gerações, não foi dado a conhecer aos filhos dos homens[a] como agora foi revelado aos seus santos apóstolos e profetas no Espírito[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos seres humanos” ou “à humanidade”; literalmente, o grego diz “aos filhos dos homens”.
    reason: lexical_alternative
  - marker: b
    text: Ou “pelo Espírito”; a expressão grega pode indicar esfera ou meio.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: o qual
  rationale: Pronome relativo neutro que retoma o mistério mencionado no contexto anterior; a tradução mantém a ligação relativa sem repetir explicitamente o antecedente.
- source_word: ἑτέραις γενεαῖς
  choice: em outras gerações
  rationale: O dativo tem sentido temporal; “outras” reproduz diretamente ἑτέραις sem reduzir a expressão apenas ao passado remoto.
- source_word: οὐκ ἐγνωρίσθη
  choice: não foi dado a conhecer
  rationale: Preserva a voz passiva e o sentido causativo de γνωρίζω, isto é, tornar algo conhecido.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: aos filhos dos homens
  rationale: Mantém a forma semítica e o registro do grego; uma nota esclarece que a expressão designa os seres humanos em geral.
- source_word: ὡς νῦν
  choice: como agora
  rationale: Conserva a comparação de modo ou grau entre a revelação anterior e a atual, sem afirmar que o mistério era absolutamente desconhecido antes.
- source_word: ἀπεκαλύφθη
  choice: foi revelado
  rationale: Equivalente corrente e claro para o termo paulino de revelação, mantendo a voz passiva.
- source_word: τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις
  choice: aos seus santos apóstolos e profetas
  rationale: “Santos” modifica naturalmente os dois substantivos coordenados, e “seus” preserva αὐτοῦ sem explicitar além do texto o referente contextual.
- source_word: ἐν πνεύματι
  choice: no Espírito
  rationale: O contexto de revelação divina favorece a referência ao Espírito Santo; “no” preserva a abertura semântica de ἐν entre esfera e meio.
theological_decisions:
- issue: Referente de πνεύματι
  choice: Espírito Santo
  alternative: espírito humano ou modo espiritual
  rationale: A revelação concedida a apóstolos e profetas favorece fortemente o Espírito Santo como referente; a inicial maiúscula indica essa leitura provável.
- issue: Força comparativa de ὡς νῦν
  choice: diferença de modo ou grau da revelação
  alternative: negação absoluta de qualquer conhecimento nas gerações anteriores
  rationale: 'ὡς introduz uma comparação: o mistério não foi dado a conhecer anteriormente da maneira ou no grau em que agora foi revelado. A tradução evita eliminar essa tensão.'
- issue: Valor de ἐν em ἐν πνεύματι
  choice: “no Espírito”, preservando esfera ou meio
  alternative: “pelo Espírito”, explicitando agência
  rationale: O grego permite entender a frase como esfera ou instrumento. O texto principal conserva essa ambiguidade legítima, e a nota registra a alternativa idiomática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura relativa e a vírgula final refletem que este versículo integra uma frase mais longa. Mantém-se a expressão formal “filhos dos homens” por correspondência com o texto-fonte, acompanhada de esclarecimento inclusivo em nota.
