source:
  edition: SBLGNT
  text: καὶ περιπατεῖτε ἐν ἀγάπῃ, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν ⸀ἡμᾶς καὶ παρέδωκεν ἑαυτὸν ὑπὲρ ⸀ἡμῶν προσφορὰν καὶ θυσίαν τῷ θεῷ εἰς ὀσμὴν εὐωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/002.yaml
  text: and walk in love[a], just as the Messiah also loved us and gave himself up for us[c][b], an offering and sacrifice to God for a fragrant aroma.
translation:
  language: pt
  text: e vivam em amor, assim como também o Messias[a] nos amou e entregou a si mesmo por nós[b], como oferta e sacrifício a Deus, para aroma agradável[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”. O termo grego Χριστός é usado aqui como título e significa “Messias”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em nosso favor”. A expressão grega pode ter força benefactiva ou representativa neste contexto.'
    reason: lexical_alternative
  - marker: c
    text: A expressão “aroma agradável” retoma a linguagem sacrificial do Antigo Testamento para uma oferta aceita por Deus.
    reason: cross_reference
lexical_decisions:
- source_word: περιπατεῖτε
  choice: vivam
  rationale: O verbo significa literalmente “caminhem”, mas aqui é uma metáfora paulina para a maneira de viver. “Vivam” comunica esse sentido de modo natural no português atual.
- source_word: ἐν ἀγάπῃ
  choice: em amor
  rationale: Mantém a forma da expressão grega e sua possível nuance de esfera ou modo de vida.
- source_word: ὁ Χριστός
  choice: o Messias
  rationale: O artigo e o contexto favorecem o uso titular; “Messias” traduz o sentido de Χριστός sem tratá-lo simplesmente como nome próprio.
- source_word: ἠγάπησεν ἡμᾶς
  choice: nos amou
  rationale: Tradução direta do aoristo, preservando a ligação lexical com ἀγάπῃ no início do versículo.
- source_word: παρέδωκεν ἑαυτὸν
  choice: entregou a si mesmo
  rationale: Expressa com clareza a entrega voluntária de Cristo e conserva o pronome reflexivo enfático.
- source_word: ὑπὲρ ἡμῶν
  choice: por nós
  rationale: Formulação natural que preserva a força benefactiva ou representativa de ὑπέρ sem especificar além do que a preposição exige.
- source_word: προσφορὰν καὶ θυσίαν
  choice: oferta e sacrifício
  rationale: Mantém os dois termos cultuais distintos do grego, sem fundi-los em uma só ideia.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: Representa o dativo como destinatário da oferta sacrificial.
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: em aroma agradável
  rationale: Preserva a imagem concreta e o eco da linguagem sacrificial do Antigo Testamento, com uma expressão compreensível em português.
theological_decisions:
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: o Cristo
  rationale: Neste contexto, Χριστός com artigo funciona como título. “Messias” comunica seu significado, enquanto a alternativa tradicional é registrada em nota.
- issue: Força de ὑπὲρ ἡμῶν no contexto sacrificial
  choice: por nós
  alternative: em nosso favor
  rationale: “Por nós” mantém abertas as nuances benefactiva e representativa da expressão e não a restringe a uma formulação doutrinária mais específica.
- issue: Sentido de εἰς ὀσμὴν εὐωδίας
  choice: em aroma agradável
  alternative: como fragrância agradável
  rationale: A tradução conserva a metáfora sacrificial e sua conotação de aceitação por Deus sem substituir a imagem por uma explicação teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Vivam” evita o arcaísmo de “andai”, enquanto “em amor”, “oferta e sacrifício” e “aroma agradável” preservam a densidade e as imagens do texto grego.
