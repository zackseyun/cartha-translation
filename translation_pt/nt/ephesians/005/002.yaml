  source_fidelity: A tradução reproduz adequadamente a exortação a viver em amor, o título «o Messias», o amor e a autoentrega dele «por nós», bem como o par cultual «oferta e sacrifício a Deus». Contudo, «em aroma agradável» não representa naturalmente εἰς, que neste contexto introduz o resultado/finalidade sacrificial («para aroma agradável»).
  naturalness: '«Vivam em amor» é português moderno e claro. «Entregou a si mesmo por nós» é preciso, embora ligeiramente formal em registro apropriado. A sequência final deve ser ajustada: «em aroma agradável» é pouco idiomática e enfraquece a relação final expressa pelo grego.'
