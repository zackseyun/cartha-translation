id: EPH.5.21
reference: Ephesians 5:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑποτασσόμενοι ἀλλήλοις ἐν φόβῳ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/021.yaml
  text: submitting to one another in the fear of Messiah[a][b].
translation:
  language: pt
  text: submetendo-se uns aos outros no temor do Messias[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «na reverência pelo Messias» ou «em assombro diante do Messias».
    reason: lexical_alternative
  - marker: b
    text: Grego «Cristo»; aqui traduzido como «o Messias» porque Χριστός funciona como título.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποτασσόμενοι
  choice: submetendo-se
  rationale: O particípio presente dá continuidade à sequência ligada ao contexto imperativo anterior. «Submetendo-se» é natural em português e conserva tanto o aspecto contínuo quanto a relação voluntária indicada pelo contexto, sem transformá-lo em um novo mandamento independente.
- source_word: ἀλλήλοις
  choice: uns aos outros
  rationale: Reproduz com clareza o sentido recíproco do pronome no dativo plural.
- source_word: ἐν
  choice: 'no'
  rationale: A contração de «em» com o artigo em «no temor» expressa naturalmente esfera ou modo e permanece próxima da construção grega.
- source_word: φόβῳ
  choice: temor
  rationale: «Temor» preserva a força lexical de φόβος e sua tensão teológica, podendo incluir reverência e assombro sem sugerir necessariamente terror servil.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Χριστός conserva aqui força titular; «Messias» traduz o título em vez de apenas transliterá-lo. O genitivo é expresso naturalmente por «do».
theological_decisions:
- issue: Sentido de «temor do Messias»
  choice: 'genitivo objetivo: temor reverente dirigido ao Messias'
  alternative: temor produzido pelo Messias; reverência por Cristo
  rationale: A leitura mais direta entende o Messias como objeto do temor. Manter «temor» preserva a formulação forte e sua tensão teológica, sem reduzi-la a mera cortesia.
- issue: Tradução de Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: Neste contexto, Χριστός pode ser entendido como título. «Messias» torna esse valor explícito, enquanto a forma tradicional é registrada em nota.
- issue: Relação sintática do particípio
  choice: manter a forma participial ligada ao contexto anterior
  alternative: 'verter como imperativo independente: «submetam-se»'
  rationale: O grego emprega um particípio, não um imperativo finito. O gerúndio português preserva essa ligação e evita decidir no próprio versículo a extensão exata da estrutura sintática anterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Submetendo-se uns aos outros» é idiomático e conserva a reciprocidade; «temor» mantém a linguagem bíblica corrente sem suavizar a força do original.
