id: EPH.5.1
reference: Ephesians 5:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: γίνεσθε οὖν μιμηταὶ τοῦ θεοῦ, ὡς τέκνα ἀγαπητά,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/001.yaml
  text: Therefore[a], become imitators of God, as beloved children,
translation:
  language: pt
  text: Portanto, tornem-se imitadores de Deus, como filhos amados,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sejam imitadores de Deus”; o imperativo grego pode enfatizar tanto tornar-se quanto ser de modo contínuo.
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: tornem-se
  rationale: O imperativo presente de γίνομαι pode destacar processo ou entrada num modo contínuo de viver. “Tornem-se” preserva essa força exortativa melhor que o simples “sejam”, sem ampliar o sentido.
- source_word: οὖν
  choice: portanto
  rationale: Assinala a inferência a partir do argumento anterior e mantém clara a ligação lógica.
- source_word: μιμηταὶ
  choice: imitadores
  rationale: Expressa diretamente aqueles que imitam ou tomam alguém por modelo; “seguidores” seria mais amplo e enfraqueceria o motivo explícito da imitação.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: É a forma portuguesa natural e precisa para o genitivo grego.
- source_word: ὡς
  choice: como
  rationale: Preserva de modo compacto a ideia de condição, maneira ou base da exortação sem impor exclusivamente um valor causal.
- source_word: τέκνα
  choice: filhos
  rationale: Neste contexto familiar, “filhos” funciona em português como plural inclusivo e comunica naturalmente a relação filial, embora o grego τέκνα não seja marcado quanto ao sexo.
- source_word: ἀγαπητά
  choice: amados
  rationale: Mantém o sentido afetivo de pessoas queridas e alvo de amor, em linguagem corrente e digna.
theological_decisions:
- issue: Relação entre a exortação e a identidade filial
  choice: A exortação chama os destinatários a se tornarem imitadores de Deus na condição de filhos amados.
  alternative: 'Entender a frase apenas como comparação: imitem Deus do modo como filhos amados imitam.'
  rationale: A construção com ὡς permite nuance de maneira e de condição/base. A tradução “como filhos amados” conserva essa abertura e não sugere que a imitação os transforme em filhos de Deus.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Tornem-se” explicita o imperativo plural; “filhos” é usado no sentido coletivo inclusivo comum em português.
