id: EPH.5.11
reference: Ephesians 5:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ μὴ συγκοινωνεῖτε τοῖς ἔργοις τοῖς ἀκάρποις τοῦ σκότους, μᾶλλον δὲ καὶ ἐλέγχετε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/011.yaml
  text: And do not participate in the unfruitful works of darkness[a], but instead even expose them[b],
translation:
  language: pt
  text: E não participem das obras infrutíferas das trevas[a]; pelo contrário, até mesmo as exponham[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não compartilhem das” ou “não tenham comunhão com as”.
    reason: lexical_alternative
  - marker: b
    text: Ou “as repreendam” ou “as censurem”. O verbo grego pode incluir correção verbal, mas, neste contexto, também transmite a ideia de trazer essas obras à luz.
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκοινωνεῖτε
  choice: participem
  rationale: O verbo indica tomar parte ou compartilhar ativamente de algo. “Participem” é natural em português moderno e preserva a ideia de envolvimento conjunto.
- source_word: ἔργοις
  choice: obras
  rationale: “Obras” mantém a continuidade com o vocabulário moral paulino e corresponde diretamente ao sentido do termo grego.
- source_word: ἀκάρποις
  choice: infrutíferas
  rationale: Preserva a metáfora agrícola do grego e a ligação contextual com o fruto da luz no versículo 9.
- source_word: σκότους
  choice: das trevas
  rationale: Reproduz de modo conciso o genitivo grego, mantendo sua força moral e metafórica sem especificar indevidamente a relação.
- source_word: μᾶλλον δὲ καὶ
  choice: pelo contrário, até mesmo
  rationale: 'Expressa tanto o forte contraste introduzido por μᾶλλον δέ quanto a força adicional de καί: não basta deixar de participar; é preciso também agir em oposição.'
- source_word: ἐλέγχετε
  choice: as exponham
  rationale: No contexto de luz e trevas, o verbo inclui trazer as obras à luz e revelar seu caráter. A escolha mantém essa conexão contextual sem excluir a ideia de censura ou correção.
theological_decisions:
- issue: Sentido de ἐλέγχετε em relação às obras más
  choice: as exponham
  alternative: as repreendam / as censurem
  rationale: O contexto imediato enfatiza que a luz torna as coisas visíveis (vv. 8, 13). “Exponham” preserva essa ligação temática, embora o verbo também possa envolver reprovação moral; a nota registra essa amplitude.
- issue: Força do contraste entre os imperativos
  choice: não participem... pelo contrário, até mesmo as exponham
  alternative: não compartilhem... mas antes as repreendam
  rationale: 'A formulação conserva as duas exigências do texto: abstenção das obras das trevas e oposição ativa a elas, sem determinar um método que o grego não explicita.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural “vocês” está implícito nas formas verbais. A colocação de “as” retoma explicitamente “obras”, e “até mesmo” preserva a intensificação de καί.
