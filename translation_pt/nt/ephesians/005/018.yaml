source:
  edition: SBLGNT
  text: καὶ μὴ μεθύσκεσθε οἴνῳ, ἐν ᾧ ἐστιν ἀσωτία, ἀλλὰ πληροῦσθε ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/018.yaml
  text: And do not get drunk with wine[a], in which there is debauchery, but be filled with the Spirit,
translation:
  language: pt
  text: E não se embriaguem com vinho, pois nisso há desregramento, mas sejam cheios do Espírito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no Espírito”; alguns entendem πνεῦμα em sentido mais geral como “espírito”.
    reason: Preserva a ambiguidade de ἐν πνεύματι quanto ao valor de ἐν e ao referente de πνεῦμα, sem tornar a alternativa desnecessariamente pouco idiomática em português.
lexical_decisions:
- source_word: μεθύσκεσθε
  choice: se embriaguem
  rationale: O presente passivo com μή expressa uma proibição. “Não se embriaguem” é natural em português e comunica tanto o processo quanto o estado resultante.
- source_word: οἴνῳ
  choice: com vinho
  rationale: O dativo indica a substância ou o meio da embriaguez; “com vinho” é a formulação idiomática mais direta em português.
- source_word: ἐν ᾧ
  choice: no qual
  rationale: A construção relativa retoma naturalmente “vinho”, ou o estado de embriaguez associado a ele. “No qual” preserva a ligação explícita do grego sem acrescentar uma explicação interpretativa.
- source_word: ἀσωτία
  choice: devassidão
  rationale: O termo denota conduta moralmente desenfreada, dissoluta e também esbanjadora. “Devassidão” conserva sua força ética e é compreensível no português atual.
- source_word: πληροῦσθε
  choice: sejam cheios
  rationale: O presente passivo imperativo ordena uma condição contínua ou reiterada. “Sejam cheios” mantém a voz passiva e deixa o aspecto contínuo implícito, como é natural em português.
- source_word: ἐν πνεύματι
  choice: do Espírito
  rationale: Depois de πληροῦσθε, a expressão pode indicar conteúdo, meio ou esfera. “Cheios do Espírito” é idiomático, sustenta o contraste com o vinho e identifica πνεῦμα como o Espírito Santo, sem eliminar as alternativas, registradas em nota.
theological_decisions:
- issue: Referente de πνεύματι
  choice: o Espírito Santo
  alternative: espírito, entendido de modo mais geral ou como o espírito humano
  rationale: No contexto das exortações paulinas, πνεύματι provavelmente se refere ao Espírito Santo, embora o substantivo grego esteja sem artigo e permita outra compreensão. A inicial maiúscula registra a leitura principal; a nota preserva a ambiguidade.
- issue: Valor de ἐν em ἐν πνεύματι
  choice: conteúdo, expresso por “do Espírito”
  alternative: esfera (“no Espírito”) ou meio/agente (“pelo Espírito”)
  rationale: A construção admite mais de uma relação semântica. O português idiomático favorece “cheios do Espírito”, mas a nota mantém a leitura locativa ou esférica mais formal.
translation_notes:
  register: Português moderno, claro e digno, com construção amplamente compreensível no Brasil e em outros contextos lusófonos. “Devassidão” mantém a gravidade moral do original sem recorrer a paráfrase denominacional.
