    issue: “Devassidão” pode restringir indevidamente ἀσωτία.
    rationale: No uso português contemporâneo, o termo frequentemente evoca em primeiro lugar promiscuidade ou imoralidade sexual. O grego designa mais amplamente conduta desenfreada/dissoluta e irresponsável. “Desregramento” mantém a força ética sem essa redução semântica.
  - severity: low
    issue: A redação da nota torna “em espírito” uma tradução pouco natural da oração inteira.
    rationale: 'A alternativa diz respeito a ἐν πνεύματι, não exige repetir “sejam cheios”. É mais claro indicar “Ou ‘no Espírito’; alguns entendem πνεύμαti em sentido mais geral: ‘espírito’.”'
