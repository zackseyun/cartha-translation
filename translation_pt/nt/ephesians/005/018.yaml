  source_fidelity: A estrutura exortativa, a proibição presente, o contraste entre vinho e πνεύματι e a voz passiva de πληροῦσθε estão bem preservados. Contudo, “devassidão” tende no português atual a sugerir sobretudo imoralidade sexual e pode estreitar ἀσωτία, que abrange vida desenfreada, imprudente e dissoluta. A formulação “pois nisso há desregramento” comunica melhor a ligação intencionalmente concisa de ἐν ᾧ sem decidir em excesso se o antecedente prático é o vinho ou a embriaguez com ele associada.
  naturalness: “Não se embriaguem com vinho” e “sejam cheios do Espírito” são naturais, claras e adequadas ao registro. “Desregramento” é mais atual e semanticamente abrangente que “devassidão”. A nota deve apresentar a alternativa como alternativa para a expressão, não como uma repetição pouco natural de toda a oração (“sejam cheios em espírito”).
  terminology: “Espírito”, com maiúscula, é uma leitura contextual plausível para πνεύματι e a nota preserva adequadamente a possibilidade de “espírito”. “Cheios do Espírito” é idiomático e não força uma única análise do valor de ἐν; “no Espírito” deve constar como alternativa de tradução da expressão.
  issues:
