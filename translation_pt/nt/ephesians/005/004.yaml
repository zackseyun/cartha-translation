  text: καὶ αἰσχρότης καὶ μωρολογία ἢ εὐτραπελία, ⸂ἃ οὐκ ἀνῆκεν⸃, ἀλλὰ μᾶλλον εὐχαριστία.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/004.yaml
  text: And obscenity and foolish talk or crude joking[a], which are not fitting[b], but rather thanksgiving.
translation:
  language: pt
  text: nem indecência, nem conversa tola ou piadas vulgares[a], coisas que não convêm[b], mas, em vez disso, ações de graças.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “gracejos indecentes”. O termo grego pode designar espirituosidade em outros contextos, mas aqui tem sentido negativo por estar agrupado com formas impróprias de falar.
    reason: lexical_alternative
  - marker: b
    text: Ou “coisas que não são apropriadas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσχρότης
  choice: indecência
  rationale: O substantivo designa aquilo que é vergonhoso, baixo ou indecente. No contexto de vícios ligados à fala, “indecência” mantém a amplitude do termo sem restringi-lo exclusivamente a palavras obscenas.
- source_word: μωρολογία
  choice: conversa tola
  rationale: Expressa fala insensata ou estúpida; “conversa tola” é clara, corrente e conserva a referência explícita à comunicação verbal.
- source_word: ἢ
  choice: nem
  rationale: Embora isoladamente signifique “ou”, em português a continuação natural da enumeração negativa iniciada no contexto anterior pede “nem”, sem alterar a relação cumulativa entre os itens.
- source_word: εὐτραπελία
  choice: piadas vulgares
  rationale: O termo pode indicar espirituosidade em outros contextos, mas aqui a associação com vícios e a qualificação como impróprio exigem sentido negativo. “Piadas vulgares” comunica humor indecente em linguagem acessível.
- source_word: ἃ οὐκ ἀνῆκεν
  choice: coisas que não são apropriadas
  rationale: O pronome relativo neutro plural retoma coletivamente os comportamentos enumerados. A formulação preserva tanto essa referência coletiva quanto a avaliação de inadequação moral.
- source_word: ἀλλὰ μᾶλλον
  choice: mas, em vez disso
  rationale: Marca forte contraste e apresenta a alternativa positiva à fala imprópria; a expressão é natural em português e mantém a força adversativa.
- source_word: εὐχαριστία
  choice: ações de graças
  rationale: O substantivo indica gratidão expressa ou agradecimento. “Ações de graças” conserva a forma nominal e, no uso bíblico corrente, sugere adequadamente sua expressão verbal.
theological_decisions:
- issue: Alcance de αἰσχρότης em relação à fala
  choice: Usar “indecência”, permitindo que o contexto a associe à fala sem excluir inteiramente o sentido mais amplo de conduta vergonhosa.
  alternative: “obscenidade” ou “linguagem obscena”, restringindo explicitamente o termo à fala.
  rationale: Os substantivos seguintes e o contraste com ações de graças favorecem um foco na fala, mas o termo grego em si pode ser mais amplo. A tradução preserva essa tensão sem impor uma restrição que o vocábulo não exige sozinho.
- issue: Avaliação moral de εὐτραπελία
  choice: Traduzir negativamente como “piadas vulgares”.
  alternative: “espirituosidade” ou “gracejos”.
  rationale: Embora o termo possa ter valor positivo em outros usos gregos, sua posição na lista e a afirmação de que essas coisas não são apropriadas estabelecem aqui uma conotação negativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A enumeração usa “nem” para se integrar naturalmente à proibição iniciada no contexto anterior. A locução “ações de graças” mantém o contraste nominal e discursivo do grego.
