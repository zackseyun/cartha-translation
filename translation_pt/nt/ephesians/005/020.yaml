  text: εὐχαριστοῦντες πάντοτε ὑπὲρ πάντων ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῷ θεῷ καὶ πατρί,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/020.yaml
  text: always giving thanks for everything to God the Father in the name of our Lord Jesus the Messiah[b][a],
translation:
  language: pt
  text: dando sempre graças por tudo[b] a Deus, o Pai, em nome de nosso Senhor Jesus, o Messias[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais tradicionalmente, “Jesus Cristo”.
    reason: alternative_reading
  - marker: b
    text: “Por tudo” também pode ser entendido, mais literalmente, como “por todas as coisas”; alguns entendem “por todos”, embora o contexto favoreça o sentido abrangente de coisas, situações ou circunstâncias.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: dando graças
  rationale: O particípio presente mantém a ligação com a exortação anterior e expressa uma prática contínua; “dar graças” é natural, digno e tradicional sem ser arcaico.
- source_word: πάντοτε
  choice: sempre
  rationale: Equivalente direto e idiomático do advérbio, preservando sua abrangência temporal.
- source_word: ὑπὲρ πάντων
  choice: por tudo
  rationale: O genitivo plural pode ser neutro ou masculino. No contexto, a referência abrangente a coisas, situações ou circunstâncias é a leitura mais provável; a ambiguidade real é registrada em nota.
- source_word: ἐν ὀνόματι
  choice: em nome de
  rationale: Conserva a expressão bíblica e sua possível força representativa ou mediadora sem explicá-la em excesso.
- source_word: κυρίου
  choice: Senhor
  rationale: Mantém o título cristológico usual para κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título e emprega o artigo necessário ao português idiomático; a forma tradicional “Jesus Cristo” aparece em nota.
- source_word: τῷ θεῷ καὶ πατρί
  choice: a Deus, o Pai
  rationale: O dativo indica o destinatário das ações de graças. A formulação portuguesa apresenta “Pai” como designação do mesmo referente, de modo natural e sem acrescentar um possessivo ausente no grego.
theological_decisions:
- issue: Sentido de Χριστοῦ em τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: o Messias
  alternative: Cristo
  rationale: O termo conserva força titular neste contexto; “Messias” torna o título semanticamente transparente, enquanto a forma tradicional é preservada em nota.
- issue: Referente de πάντων em ὑπὲρ πάντων
  choice: tudo
  alternative: todos
  rationale: A forma grega admite gramaticalmente uma referência neutra (“todas as coisas”) ou masculina (“todas as pessoas”). O fluxo da exortação favorece gratidão abrangente por todas as coisas ou circunstâncias, sem eliminar a alternativa em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A forma participial e a vírgula final preservam a continuidade sintática do versículo no período maior. Os marcadores foram colocados imediatamente após as expressões a que se referem.
