  text: μὴ οὖν γίνεσθε συμμέτοχοι αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/007.yaml
  text: Therefore[a], do not become partners with them.
translation:
  language: pt
  text: Portanto, não se tornem participantes com eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não compartilhem com eles” ou “não sejam seus coparticipantes”. No contexto, a expressão se refere a participar da conduta pecaminosa deles ou de suas consequências.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: não
  rationale: Nega naturalmente o imperativo γίνεσθε em português.
- source_word: οὖν
  choice: Portanto
  rationale: Mantém a inferência decorrente da advertência dos versículos anteriores.
- source_word: γίνεσθε
  choice: se tornem
  rationale: Preserva o sentido de entrar numa condição ou vir a assumi-la, em vez de simplesmente 'ser'.
- source_word: συμμέτοχοι
  choice: participantes
  rationale: Expressa de modo atual e claro a ideia de compartilhar algo com outros, sem especificar além do texto o objeto dessa participação.
- source_word: αὐτῶν
  choice: com eles
  rationale: Mantém o referente pessoal do pronome e reproduz de maneira idiomática sua relação com συμμέτοχοι.
theological_decisions:
- issue: Alcance da participação indicada por συμμέτοχοι αὐτῶν
  choice: Proibição geral de participar com essas pessoas, deixando implícita a relação contextual com sua conduta pecaminosa e suas consequências.
  alternative: não participem das obras deles
  rationale: O grego diz literalmente 'deles/com eles', sem nomear aqui as obras. A redação preserva essa abertura, enquanto a nota esclarece a implicação do contexto.
translation_notes:
  register: Português moderno, claro e digno, com construção amplamente compreensível no Brasil e em outras comunidades lusófonas. 'Participantes com eles' preserva a forma pessoal do original, embora seja menos coloquial do que uma explicitação interpretativa.
