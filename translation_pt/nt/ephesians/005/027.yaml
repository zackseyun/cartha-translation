  text: ἵνα παραστήσῃ ⸀αὐτὸς ἑαυτῷ ἔνδοξον τὴν ἐκκλησίαν, μὴ ἔχουσαν σπίλον ἢ ῥυτίδα ἤ τι τῶν τοιούτων, ἀλλ’ ἵνα ᾖ ἁγία καὶ ἄμωμος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/027.yaml
  text: so that he himself might present the church to himself in splendor[a], not having spot or wrinkle or anything like that[c][b], but so that she might be holy and blameless.
translation:
  language: pt
  text: para que ele mesmo apresentasse a igreja a si próprio em esplendor[a], sem mancha, ruga ou qualquer coisa semelhante[b], mas para que ela fosse santa e irrepreensível[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “gloriosa”. O adjetivo grego pode indicar uma qualidade (“gloriosa”) ou a condição em que a igreja é apresentada (“em esplendor”).
    reason: lexical_alternative
  - marker: b
    text: Ou “ou qualquer coisa desse tipo”.
    reason: lexical_alternative
  - marker: c
    text: Ou “sem defeito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραστήσῃ
  choice: apresentasse
  rationale: O aoristo do subjuntivo com ἵνα expressa finalidade. “Apresentasse” é natural em português e conserva a ideia de conduzir alguém à presença de outra pessoa ou de exibi-lo em determinada condição.
- source_word: αὐτὸς ... ἑαυτῷ
  choice: ele mesmo ... a si próprio
  rationale: A formulação mantém tanto a ênfase do pronome explícito αὐτός quanto a força reflexiva de ἑαυτῷ, sem simplificar a imagem.
- source_word: ἔνδοξον
  choice: em esplendor
  rationale: Expressa a condição gloriosa em que a igreja é apresentada e preserva a possibilidade de entender o adjetivo como qualidade, indicada na nota.
- source_word: ἐκκλησίαν
  choice: a igreja
  rationale: Neste contexto paulino, refere-se corporativamente ao povo de Deus; “igreja” é a equivalência consagrada e compreensível.
- source_word: μὴ ἔχουσαν
  choice: sem
  rationale: Embora o grego empregue um particípio, “sem” comunica com naturalidade em português a condição descrita, sem alterar seu sentido.
- source_word: σπίλον
  choice: mancha
  rationale: Mantém a imagem concreta de impureza ou defeito e forma uma combinação natural com “ruga”.
- source_word: ῥυτίδα
  choice: ruga
  rationale: É o equivalente direto e preserva a imagem corporal e nupcial.
- source_word: ἤ τι τῶν τοιούτων
  choice: nem coisa alguma semelhante
  rationale: Preserva a generalização aberta que vai além dos dois exemplos anteriores.
- source_word: ἁγία
  choice: santa
  rationale: É a tradução corrente e mantém o peso teológico do termo sem substituí-lo por uma explicação.
- source_word: ἄμωμος
  choice: irrepreensível
  rationale: Comunica ausência de culpa ou defeito moral e evita repetir “mancha”; a dimensão de ausência de defeito é preservada em nota.
theological_decisions:
- issue: A apresentação reflexiva de Cristo e da igreja
  choice: Manter “ele mesmo ... a si próprio”
  alternative: Simplificar para “apresentasse a igreja” ou interpretar explicitamente a apresentação como feita diante de Deus
  rationale: O grego traz tanto αὐτός enfático quanto ἑαυτῷ reflexivo. A tradução conserva essa tensão literária e teológica sem determinar além do texto a quem ou em que momento ocorre a apresentação.
- issue: As imagens de pureza aplicadas à igreja
  choice: Usar “mancha”, “ruga”, “santa” e “irrepreensível”
  alternative: Usar “mácula”, “ruga”, “santa” e “sem defeito”
  rationale: A escolha mantém juntas a imagem concreta, possivelmente nupcial, e a linguagem de santidade e integridade, sem restringi-las a uma única interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “para que ... apresentasse” conserva a oração de finalidade; “ele mesmo ... a si próprio” é deliberadamente enfática para refletir o grego. Evitou-se “mácula” por ser menos corrente, preferindo-se “mancha”.
