  yaml_path: translation/nt/ephesians/005/008.yaml
  text: For you were once darkness[a], but now you are light in the Lord. Walk as children of light,
translation:
  language: pt
  text: Pois vocês antes eram trevas, mas agora são luz no Senhor. Vivam como filhos da luz,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conservando a metáfora grega: “Caminhem como filhos da luz”. “Caminhar” é uma metáfora frequente nas cartas de Paulo para a maneira de viver.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε
  choice: eram
  rationale: O imperfeito de εἰμί expressa um estado passado; “eram” é direto e natural em português.
- source_word: γάρ
  choice: Pois
  rationale: Introduz a explicação que fundamenta a exortação anterior, preservando a ligação argumentativa.
- source_word: ποτε
  choice: antes
  rationale: Expressa de modo natural a condição passada em contraste com “agora”.
- source_word: σκότος
  choice: trevas
  rationale: Mantém o substantivo predicativo e a força da metáfora de identidade; o texto não diz apenas que estavam nas trevas.
- source_word: νῦν δὲ
  choice: mas agora
  rationale: Preserva o contraste enfático entre a condição anterior e a presente.
- source_word: φῶς
  choice: luz
  rationale: Mantém o substantivo predicativo e a linguagem intensa de identidade e transformação.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Expressa a esfera ou união na qual existe a nova identidade deles, em consonância com o uso paulino.
- source_word: ὡς
  choice: como
  rationale: Introduz a maneira de viver correspondente à identidade declarada.
- source_word: τέκνα φωτός
  choice: filhos da luz
  rationale: “Filhos” funciona em português como expressão coletiva tradicional e inteligível para pessoas de ambos os sexos, preservando a construção metafórica “da luz”.
- source_word: περιπατεῖτε
  choice: Vivam
  rationale: No contexto ético, o imperativo metafórico significa conduzir a vida; “vivam” comunica isso com naturalidade no português moderno, enquanto a nota conserva a imagem literal de caminhar.
theological_decisions:
- issue: Linguagem metafórica de identidade em “eram trevas” e “são luz”
  choice: Preservar as metáforas fortes “trevas” e “luz”.
  alternative: “estavam nas trevas, mas agora estão na luz”
  rationale: Os predicativos gregos aparecem sem preposição e descrevem de forma intensa a condição e identidade transformadas, não apenas o ambiente em que as pessoas se encontram.
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” preserva o uso neotestamentário e sua ressonância teológica sem estreitar indevidamente o sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O pronome “vocês” torna explícito o plural. Optou-se por “Vivam” no texto principal por sua naturalidade atual, registrando em nota a metáfora literal “Caminhem”.
