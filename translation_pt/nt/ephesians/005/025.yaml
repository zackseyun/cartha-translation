source:
  edition: SBLGNT
  text: Οἱ ἄνδρες, ἀγαπᾶτε τὰς ⸀γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/025.yaml
  text: Husbands[a], love your wives, just as Messiah also loved the church and gave himself up for her[b],
translation:
  language: pt
  text: Maridos, amem suas esposas, assim como também o Messias[a] amou a igreja e se entregou por ela[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”. O título grego Χριστός é traduzido aqui como “Messias” para preservar seu sentido como título.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “entregou a si mesmo por ela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνδρες
  choice: Maridos
  rationale: No contexto das instruções sobre o casamento e em paralelo com γυναῖκας, o termo designa homens em relação às suas esposas, não homens em geral.
- source_word: ἀγαπᾶτε
  choice: amem
  rationale: O imperativo presente é expresso de modo natural e direto em português, preservando a ligação lexical com ἠγάπησεν, traduzido por “amou”.
- source_word: τὰς γυναῖκας
  choice: suas esposas
  rationale: O contexto matrimonial determina o sentido de “esposas”; “suas” explicita naturalmente a relação indicada pela exortação aos maridos.
- source_word: καθὼς καὶ
  choice: assim como também
  rationale: A formulação preserva tanto a comparação introduzida por καθώς quanto a força aditiva ou enfática de καί.
- source_word: ὁ Χριστός
  choice: o Messias
  rationale: Χριστός funciona aqui como título; “Messias” comunica seu significado, enquanto a alternativa tradicional “Cristo” é registrada em nota.
- source_word: ἠγάπησεν
  choice: amou
  rationale: O passado simples traduz adequadamente o aoristo e mantém o paralelo com “amem”.
- source_word: τὴν ἐκκλησίαν
  choice: a igreja
  rationale: Neste contexto paulino, ἐκκλησία designa corporativamente o povo de Deus; “igreja” é o equivalente português estabelecido e claro.
- source_word: ἑαυτὸν παρέδωκεν
  choice: se entregou
  rationale: A expressão portuguesa comunica entrega voluntária de si mesmo de forma natural, sem acrescentar uma explicação teológica ausente da cláusula.
- source_word: ὑπὲρ αὐτῆς
  choice: por ela
  rationale: ὑπέρ com genitivo indica ação em favor de alguém; “por ela” preserva de modo conciso essa relação, retomando “a igreja”.
theological_decisions:
- issue: Tradução de Χριστός na analogia entre o casamento e a igreja
  choice: o Messias
  alternative: o Cristo
  rationale: A escolha preserva o sentido titular do termo grego sem introduzir uma interpretação denominacional; a forma tradicional é mantida em nota.
- issue: Alcance sacrificial de παρέδωκεν ὑπὲρ αὐτῆς
  choice: se entregou por ela
  alternative: entregou a si mesmo por ela
  rationale: A tradução expressa a autoentrega voluntária do Messias em favor da igreja, mas não acrescenta terminologia expiatória além do que a frase grega declara.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. O imperativo “amem” evita formas regionais marcadas; “esposas” esclarece a relação matrimonial, e “se entregou” conserva a força da autoentrega sem expansão interpretativa.
