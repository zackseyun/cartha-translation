  text: ὅτι ἀνήρ ἐστιν κεφαλὴ τῆς γυναικὸς ὡς καὶ ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας, ⸀αὐτὸς σωτὴρ τοῦ σώματος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/023.yaml
  text: For the husband is the head of the wife[a], as the Messiah also is the head of the church[d][c][b], himself the Savior of the body.
translation:
  language: pt
  text: pois o marido é a cabeça da esposa, assim como o Messias também é a cabeça da igreja[a] — ele mesmo é o Salvador do corpo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cabeça” preserva a metáfora grega. Ela é entendida de diferentes maneiras, entre elas autoridade, preeminência ou fonte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: pois
  rationale: Introduz a razão da exortação anterior e preserva com naturalidade a força explicativa do grego.
- source_word: ἀνήρ
  choice: marido
  rationale: No contexto doméstico e em correlação com γυνή, o sentido relacional é 'marido', não o genérico 'homem'.
- source_word: κεφαλή
  choice: cabeça
  rationale: Preserva a metáfora grega sem restringi-la a uma interpretação discutida, como 'fonte', 'líder' ou 'autoridade'.
- source_word: γυνή
  choice: esposa
  rationale: No par conjugal com ἀνήρ, o sentido contextual é 'esposa'.
- source_word: ὡς καὶ
  choice: assim como ... também
  rationale: Mantém a estrutura comparativa e evita sugerir identidade completa entre as duas relações.
- source_word: Χριστός
  choice: Messias
  rationale: Traduz o título e conserva sua força messiânica neste contexto cristológico.
- source_word: ἐκκλησία
  choice: igreja
  rationale: É o equivalente moderno mais claro para a comunidade dos fiéis no uso paulino deste contexto.
- source_word: αὐτός
  choice: ele mesmo
  rationale: Preserva a ênfase do pronome grego e identifica o Messias de modo enfático como Salvador.
- source_word: σωτήρ
  choice: Salvador
  rationale: Expressa adequadamente o sentido de quem salva ou liberta no contexto cristológico.
- source_word: σῶμα
  choice: corpo
  rationale: Mantém a metáfora paulina e não acrescenta o possessivo 'seu', ausente do texto grego.
theological_decisions:
- issue: Sentido de κεφαλή na comparação entre marido e esposa e entre Messias e igreja
  choice: Manter a metáfora 'cabeça' no texto principal.
  alternative: '''fonte'', ''líder'' ou ''aquele que exerce autoridade sobre'''
  rationale: O alcance da metáfora é debatido; traduzi-la literalmente preserva a ambiguidade e a tensão teológica sem impor uma interpretação.
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: O termo funciona aqui como título cristológico; 'Messias' explicita seu sentido sem alterar o referente.
- issue: Relação sintática de αὐτὸς σωτὴρ τοῦ σώματος
  choice: sendo ele mesmo o Salvador do corpo
  alternative: ele mesmo, o Salvador do corpo
  rationale: A formulação portuguesa torna clara a relação com o Messias e preserva a ênfase de αὐτός, embora o grego apresente uma construção nominal concisa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem e a comparação do grego foram mantidas, enquanto 'sendo ele mesmo' evita uma aposição pouco natural em português. O único marcador de nota, [a], aparece no texto principal.
