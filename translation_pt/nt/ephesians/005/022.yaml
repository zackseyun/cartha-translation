  text: Αἱ γυναῖκες τοῖς ἰδίοις ⸀ἀνδράσιν ὡς τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/022.yaml
  text: Wives[a], to your own husbands as to the Lord,
translation:
  language: pt
  text: Esposas[a], aos seus próprios maridos, como ao Senhor,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Muitas traduções suprem “submetam-se” com base no versículo 21: “Esposas, submetam-se aos seus próprios maridos, como ao Senhor”. O grego do próprio versículo 22 é elíptico e depende da construção do versículo anterior.'
    reason: Leitura alternativa e esclarecimento da elipse no texto grego.
lexical_decisions:
- source_word: Αἱ γυναῖκες
  choice: Esposas
  rationale: No contexto das relações domésticas e em correlação com ἀνδράσιν, γυνή tem aqui o sentido relacional de “esposas”, não o sentido geral de “mulheres”.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: a seus próprios maridos
  rationale: ἀνήρ significa aqui “marido” pelo contexto matrimonial. “Próprios” representa ἰδίοις e ressalta a relação conjugal específica, sem acrescentar uma ideia ausente do grego.
- source_word: ὡς
  choice: como
  rationale: “Como” preserva a comparação simples e deixa que o contexto imediato determine seu alcance exato.
- source_word: τῷ κυρίῳ
  choice: ao Senhor
  rationale: κύριος refere-se aqui ao Senhor Jesus; a contração “ao” representa naturalmente a construção dativa e o artigo em português.
- source_word: verbo implícito pelo contexto
  choice: elipse preservada
  rationale: O texto grego do versículo 22 não contém verbo expresso e depende de ὑποτασσόμενοι (“submetendo-se”) no versículo 21. A formulação portuguesa mantém essa dependência sintática.
theological_decisions:
- issue: Suprir ou não “submetam-se” no texto principal
  choice: Não suprir o verbo; preservar a construção elíptica e explicar em nota sua dependência do versículo 21.
  alternative: Esposas, submetam-se a seus próprios maridos, como ao Senhor.
  rationale: Embora suprir o verbo produza uma frase autônoma e natural, ele não está expresso no grego deste versículo. Preservar a elipse mantém a primazia do texto-fonte e evita apresentar como explícito no versículo 22 aquilo que é retomado do versículo anterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A vírgula e a ausência de verbo preservam deliberadamente a construção elíptica do grego; a nota evita que isso pareça mero fragmento acidental.
