lexical_decisions:
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão ou explicação da afirmação anterior e preserva de modo natural a força causal do grego.
- source_word: μέλη
  choice: membros
  rationale: Designa partes constitutivas de um corpo e mantém tanto a imagem corporal paulina quanto seu sentido comunitário.
- source_word: ἐσμὲν
  choice: somos
  rationale: Traduz diretamente o presente do indicativo de εἰμί, com concordância natural em português.
- source_word: τοῦ σώματος
  choice: do corpo
  rationale: Preserva a metáfora estabelecida no contexto, na qual a comunidade está unida a Cristo como corpo dele.
- source_word: αὐτοῦ
  choice: dele
  rationale: O pronome se refere a Cristo no contexto. A forma “dele” é clara e natural, sem introduzir informação ausente do grego.
theological_decisions:
- issue: Inclusão da leitura bizantina mais longa, “da sua carne e dos seus ossos”
  choice: 'Traduzir apenas o texto do SBLGNT: “porque somos membros do corpo dele”.'
  alternative: “porque somos membros do corpo dele, da sua carne e dos seus ossos”
  rationale: A fonte fornecida traz a leitura mais curta. A expansão, provavelmente influenciada pela linguagem de Gênesis 2:23 já evocada no contexto, é registrada em nota para assegurar transparência textual sem incorporá-la ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Membros” preserva a conhecida imagem paulina; “corpo dele” evita a possível ambiguidade momentânea de “seu corpo” e identifica naturalmente o referente contextual.
