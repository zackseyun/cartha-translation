  text: Βλέπετε οὖν ⸂ἀκριβῶς πῶς⸃ περιπατεῖτε, μὴ ὡς ἄσοφοι ἀλλ’ ὡς σοφοί,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/015.yaml
  text: Therefore[b][a], watch carefully how you walk—not as unwise but as wise—
translation:
  language: pt
  text: 'Portanto, prestem muita atenção à maneira como vivem: não como insensatos, mas como sábios.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βλέπετε
  choice: prestem muita atenção
  rationale: O presente imperativo na segunda pessoa do plural expressa uma exortação contínua e dirigida a toda a comunidade. Em português, a locução comunica com naturalidade a vigilância exigida.
- source_word: οὖν
  choice: Portanto
  rationale: Preserva a inferência e a ligação lógica com a argumentação anterior.
- source_word: ἀκριβῶς πῶς
  choice: muita atenção à maneira como
  rationale: A formulação idiomática conserva a ênfase de ἀκριβῶς sobre o exame cuidadoso do modo de proceder, sem o tom técnico que «exatamente» poderia produzir.
- source_word: περιπατεῖτε
  choice: vivem
  rationale: Neste contexto, «andar» é uma metáfora para a conduta ou o modo de vida. «Vivem» transmite diretamente seu sentido corrente em português moderno.
- source_word: μὴ ὡς ἄσοφοι
  choice: não como insensatos
  rationale: ἄσοφοι contrasta com «sábios» e designa quem carece de sabedoria. O masculino plural português pode abranger toda a comunidade, como ocorre no grego.
- source_word: ἀλλ’ ὡς σοφοί
  choice: mas como sábios
  rationale: Mantém de forma concisa o paralelismo antitético com «insensatos».
theological_decisions:
- issue: Sentido metafórico de περιπατεῖτε
  choice: Traduzir o sentido como «vivem» no texto principal
  alternative: Conservar literalmente «andam» e explicar a metáfora em nota
  rationale: A metáfora grega descreve o modo de vida. Em português comum, «a maneira como vivem» comunica o sentido com clareza e dignidade, sem acrescentar interpretação denominacional.
- issue: Masculino plural em ἄσοφοι / σοφοί
  choice: Empregar «insensatos ... sábios» com valor representativo
  alternative: Usar «pessoas insensatas ... pessoas sábias»
  rationale: As formas gregas são masculinas plurais, mas a exortação se dirige à comunidade inteira. O português permite que esses plurais tenham referência abrangente, preservando a forma sem restringir o chamado aos homens.
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução prioriza equivalência ótima: explicita em linguagem natural o sentido idiomático de «andar» e mantém o contraste compacto entre falta de sabedoria e sabedoria.'
