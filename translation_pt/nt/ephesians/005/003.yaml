source:
  edition: SBLGNT
  text: Πορνεία δὲ καὶ ⸂ἀκαθαρσία πᾶσα⸃ ἢ πλεονεξία μηδὲ ὀνομαζέσθω ἐν ὑμῖν, καθὼς πρέπει ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/003.yaml
  text: But sexual immorality and every impurity or greed must not even be named among you[a], as is proper for saints[c][b],
translation:
  language: pt
  text: Mas a imoralidade sexual, toda espécie de impureza ou a ganância nem sequer sejam mencionadas entre vocês[a], como convém aos santos[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem sequer se fale delas entre vocês”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como convém ao povo santo de Deus”.'
    reason: lexical_alternative
  - marker: c
    text: “Santos” aqui se refere aos fiéis como pessoas separadas para Deus, não a uma classe posteriormente canonizada.
    reason: cultural_note
lexical_decisions:
- source_word: Πορνεία
  choice: imoralidade sexual
  rationale: Expressa de modo atual e abrangente a conduta sexual ilícita, sem restringir o termo à relação sexual antes do casamento.
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição com leve contraste em relação à exortação anterior.
- source_word: ἀκαθαρσία πᾶσα
  choice: toda espécie de impureza
  rationale: Preserva a abrangência de πᾶσα e soa mais natural em português do que a formulação literal 'toda impureza'.
- source_word: ἢ
  choice: ou
  rationale: Mantém o valor disjuntivo do grego na enumeração dos vícios.
- source_word: πλεονεξία
  choice: ganância
  rationale: Comunica o desejo ávido de ter mais, com suas conotações de cobiça e exploração, sem limitar o termo à esfera sexual.
- source_word: μηδὲ ὀνομαζέσθω
  choice: nem sequer sejam mencionadas
  rationale: O imperativo passivo expressa uma proibição forte; 'nem sequer' preserva a ênfase, e o plural retoma naturalmente os três vícios enumerados em português.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: Indica a presença dessas práticas ou de sua menção imprópria no meio da comunidade.
- source_word: καθὼς πρέπει
  choice: como convém
  rationale: Expressa de maneira digna e corrente o padrão de conduta apropriada.
- source_word: ἁγίοις
  choice: santos
  rationale: Conserva a designação paulina dos que pertencem a Deus, esclarecida em nota para evitar a ideia de uma classe posteriormente canonizada.
theological_decisions:
- issue: Sentido de πλεονεξία junto a pecados sexuais
  choice: ganância em sentido amplo
  alternative: cobiça; avidez sexual
  rationale: Embora o contexto trate de ética sexual, o substantivo possui alcance moral mais amplo no uso paulino; a tradução não o restringe sem indicação explícita do texto.
- issue: Referente de ἁγίοις
  choice: santos, isto é, os que pertencem a Deus
  alternative: os que são santos; o povo santo de Deus
  rationale: O termo se refere coletivamente aos fiéis como povo separado para Deus, não apenas a pessoas posteriormente reconhecidas por canonização.
- issue: Alcance de μηδὲ ὀνομαζέσθω
  choice: nem sequer sejam mencionadas
  alternative: nem sequer existam entre vocês
  rationale: A tradução preserva o sentido lexical de 'nomear/mencionar' e deixa em aberto a força retórica da expressão, sem reduzi-la apenas à proibição de praticar esses vícios.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção no plural torna explícita a concordância natural com os três itens da lista, sem alterar o sentido do imperativo singular grego, que trata a enumeração de modo coletivo.
