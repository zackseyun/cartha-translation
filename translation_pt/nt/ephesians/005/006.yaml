id: EPH.5.6
reference: Ephesians 5:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μηδεὶς ὑμᾶς ἀπατάτω κενοῖς λόγοις, διὰ ταῦτα γὰρ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/006.yaml
  text: Let no one deceive you with empty words[a], for because of these things the wrath of God comes upon the sons of disobedience.
translation:
  language: pt
  text: Que ninguém engane vocês com palavras vazias, pois é por causa dessas coisas que a ira de Deus vem sobre os filhos da desobediência.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isto é, aqueles que são caracterizados pela desobediência. Também se pode traduzir: “os desobedientes”.'
    reason: Esclarecimento do idiomatismo semítico “filhos da desobediência” e apresentação de uma alternativa lexical natural.
lexical_decisions:
- source_word: Μηδεὶς ... ἀπατάτω
  choice: Que ninguém engane vocês
  rationale: A construção com imperativo presente expressa uma proibição. Esta formulação é natural em português, mantém a força exortativa do grego e usa “vocês” para o plural ὑμᾶς.
- source_word: κενοῖς λόγοις
  choice: com palavras vazias
  rationale: Preserva a metáfora de κενός (“vazio, sem conteúdo, inútil”) e o sentido amplo de λόγοι, sem restringi-lo indevidamente a argumentos.
- source_word: διὰ ταῦτα
  choice: por causa dessas coisas
  rationale: διά com acusativo indica causa; a tradução mantém a referência demonstrativa ao comportamento mencionado no contexto anterior.
- source_word: ἔρχεται
  choice: vem
  rationale: Reproduz o presente grego sem decidir se sua força é habitual, certa ou iminente.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: a ira de Deus
  rationale: Traduz diretamente ὀργή e conserva a força teológica do termo, sem suavizá-lo como mero juízo.
- source_word: ἐπὶ
  choice: sobre
  rationale: Expressa de modo natural em português a direção ou incidência da ira sobre pessoas.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: os filhos da desobediência
  rationale: Mantém a imagem semítica do texto grego e sua forma masculina plural; a nota esclarece que se trata de pessoas caracterizadas pela desobediência.
theological_decisions:
- issue: Linguagem sobre a ira divina
  choice: a ira de Deus
  alternative: o juízo de Deus
  rationale: O original emprega explicitamente ὀργή. A tradução preserva essa linguagem e sua tensão teológica, em vez de generalizá-la.
- issue: Sentido da expressão τοὺς υἱοὺς τῆς ἀπειθείας
  choice: os filhos da desobediência
  alternative: os desobedientes
  rationale: A opção principal conserva a metáfora relacional e caracterizadora do original. A nota fornece o sentido idiomático sem substituí-lo no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” comunica naturalmente o plural; “palavras vazias” e “ira de Deus” preservam de modo claro as imagens e a força do original.
