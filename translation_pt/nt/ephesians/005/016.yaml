id: EPH.5.16
reference: Ephesians 5:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐξαγοραζόμενοι τὸν καιρόν, ὅτι αἱ ἡμέραι πονηραί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/016.yaml
  text: making the most of the time[a], because the days are evil.
translation:
  language: pt
  text: aproveitando ao máximo o tempo[a], porque os dias são maus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “resgatando o tempo”; a expressão grega também pode significar “aproveitando toda oportunidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαγοραζόμενοι
  choice: aproveitando ao máximo
  rationale: O particípio evoca literalmente a ideia de comprar ou resgatar, mas, neste contexto exortativo, é uma expressão idiomática para tirar pleno proveito do tempo ou da oportunidade. A formulação é natural em português e evita sugerir indevidamente redenção salvífica.
- source_word: καιρόν
  choice: o tempo
  rationale: καιρός pode indicar o momento oportuno ou a oportunidade, não apenas o tempo em abstrato. “O tempo” mantém a concisão e a familiaridade, enquanto “aproveitando ao máximo” comunica a dimensão de oportunidade; a alternativa é preservada em nota.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão da exortação e é o equivalente causal mais claro em português contemporâneo.
- source_word: αἱ ἡμέραι
  choice: os dias
  rationale: Tradução direta que preserva a imagem do texto sem explicitar no corpo do versículo se a expressão designa a época presente ou suas circunstâncias.
- source_word: πονηραί
  choice: maus
  rationale: Preserva a avaliação moral de πονηραί. “Difíceis” ou “atribulados” enfraqueceria a dimensão de maldade presente no termo.
theological_decisions:
- issue: Possível leitura de ἐξαγοραζόμενοι como linguagem de redenção salvífica
  choice: Exortação idiomática a aproveitar plenamente o tempo ou a oportunidade
  alternative: resgatando o tempo
  rationale: Embora o verbo possa conservar a metáfora de comprar ou resgatar, o contexto parenético favorece o sentido prático de aproveitar a ocasião. A tradução principal evita introduzir uma referência explícita à salvação, mas a nota preserva a metáfora e a ambiguidade lexical genuína.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção participa da exortação iniciada no contexto anterior; mantém-se o particípio, como no grego. “Os dias são maus” conserva a formulação forte e tradicional sem arcaísmo.
