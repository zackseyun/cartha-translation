  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὰ δὲ πάντα ἐλεγχόμενα ὑπὸ τοῦ φωτὸς φανεροῦται,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/013.yaml
  text: But all things[a], when exposed by the light, are made visible,
translation:
  language: pt
  text: Mas todas as coisas, quando expostas pela luz, tornam-se visíveis,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tudo o que é exposto pela luz torna-se visível”. O particípio e o verbo gregos permitem construções muito próximas, com ênfase no ato de expor ou na visibilidade resultante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... πάντα
  choice: todas as coisas
  rationale: O neutro plural com artigo tem alcance amplo e abrangente; “todas as coisas” preserva essa forma e soa natural em português.
- source_word: δὲ
  choice: Mas
  rationale: Marca um contraste ou avanço moderado em relação à afirmação anterior.
- source_word: ἐλεγχόμενα
  choice: quando expostas
  rationale: Neste contexto de luz e visibilidade, ἐλέγχω indica exposição ou desmascaramento, não apenas repreensão verbal. A construção temporal reproduz naturalmente a relação do particípio com o verbo principal.
- source_word: ὑπὸ τοῦ φωτὸς
  choice: pela luz
  rationale: ὑπό com genitivo indica agência; o artigo definido retoma a luz já presente no contexto.
- source_word: φανεροῦται
  choice: tornam-se visíveis
  rationale: Expressa o resultado de φανερόω no passivo — vir a ser manifesto ou visível — e mantém a imagem da iluminação sem recorrer a linguagem abstrata.
theological_decisions:
- issue: Sentido de “a luz” no contexto
  choice: Manter “a luz” sem especificar o referente no próprio versículo.
  alternative: Cristo, o evangelho, a verdade moral ou o testemunho da comunidade dos que creem.
  rationale: O contexto chama os crentes de luz no Senhor e fala de expor as obras das trevas, mas este versículo não restringe explicitamente o referente. A tradução preserva a amplitude da metáfora.
- issue: Relação sintática entre o particípio e o verbo principal
  choice: “todas as coisas, quando expostas pela luz, tornam-se visíveis”
  alternative: “tudo o que é exposto pela luz torna-se visível”
  rationale: As duas análises são próximas e possíveis. O texto principal preserva mais diretamente a abrangência de τὰ πάντα e apresenta ἐλεγχόμενα como circunstância; a nota registra a leitura atributiva alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Tornam-se visíveis” evita o tom excessivamente técnico de “são manifestadas” e conserva a metáfora da luz.
