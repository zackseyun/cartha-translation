id: EPH.5.31
reference: Ephesians 5:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀντὶ τούτου καταλείψει ἄνθρωπος ⸀τὸν ⸀πατέρα καὶ ⸀τὴν μητέρα καὶ προσκολληθήσεται ⸂τῇ γυναικὶ⸃ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/031.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife[a], and the two will become one flesh.
translation:
  language: pt
  text: Por essa razão, o homem deixará seu pai e sua mãe e se unirá à sua mulher, e os dois se tornarão uma só carne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντὶ τούτου
  choice: Por essa razão
  rationale: No contexto da citação de Gênesis 2:24, a expressão funciona como conexão causal ou resultativa. “Por essa razão” é natural em português e evita o sentido inadequado de substituição que “em vez disso” poderia sugerir.
- source_word: καταλείψει
  choice: deixará
  rationale: Expressa a saída do núcleo familiar paterno para a formação da união conjugal, sem a conotação afetiva negativa que “abandonará” poderia introduzir.
- source_word: ἄνθρωπος
  choice: o homem
  rationale: Embora o termo possa ser genérico em outros contextos, aqui designa o parceiro masculino, em correspondência com “sua mulher” na citação matrimonial.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: seu pai e sua mãe
  rationale: A repetição do possessivo soa natural em português e explicita corretamente a relação indicada pelo contexto e pela tradição da citação.
- source_word: προσκολληθήσεται
  choice: se unirá a
  rationale: Preserva a ideia de ligação estreita e duradoura no vínculo conjugal, em linguagem atual e digna. Evita tanto a rigidez de “será colado” quanto a possível estreiteza física de “se apegará”.
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: à sua mulher
  rationale: γυνή significa aqui “mulher” no sentido de esposa. “Sua mulher” conserva a formulação bíblica corrente e é amplamente compreensível em português.
- source_word: ἔσονται οἱ δύο
  choice: os dois se tornarão
  rationale: Embora ἔσονται corresponda formalmente a “serão”, “se tornarão” comunica com naturalidade o resultado da união expresso por εἰς.
- source_word: εἰς σάρκα μίαν
  choice: uma só carne
  rationale: Mantém a linguagem concreta e relacional da citação de Gênesis. “Carne” não deve ser substituída por “corpo”, pois a expressão abrange a união matrimonial sem remeter aqui à noção paulina de natureza pecaminosa.
theological_decisions:
- issue: Linguagem marcada por gênero na citação matrimonial
  choice: o homem ... sua mulher
  alternative: uma pessoa ... seu cônjuge
  rationale: O texto apresenta deliberadamente o par masculino-feminino da citação de Gênesis 2:24. A tradução preserva essa especificidade, sem neutralizá-la.
- issue: Sentido de σάρξ em εἰς σάρκα μίαν
  choice: uma só carne
  alternative: um só corpo
  rationale: Neste contexto, σάρξ pertence à linguagem criacional e matrimonial de Gênesis, não à categoria teológica de natureza pecaminosa. A expressão tradicional preserva a amplitude e a tensão do original.
- issue: Valor de ἀντὶ τούτου
  choice: Por essa razão
  alternative: Em vez disso
  rationale: A expressão introduz a consequência ou fundamento da declaração citada. Interpretá-la como substituição literal obscureceria sua função no contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A redação conserva o ritmo de uma citação solene das Escrituras sem recorrer a formas arcaicas.
