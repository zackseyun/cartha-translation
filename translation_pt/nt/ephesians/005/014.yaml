id: EPH.5.14
reference: Ephesians 5:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πᾶν γὰρ τὸ φανερούμενον φῶς ἐστιν. διὸ λέγει· Ἔγειρε, ὁ καθεύδων, καὶ ἀνάστα ἐκ τῶν νεκρῶν, καὶ ἐπιφαύσει σοι ὁ Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/014.yaml
  text: For everything that is made visible is light[a]. Therefore it says, “Wake up, sleeper, and rise from the dead[c][b], and Messiah will shine on you.”
translation:
  language: pt
  text: 'Pois tudo o que é trazido à luz é luz.[a] Por isso se diz: “Desperte, você que dorme, levante-se dentre os mortos, e o Messias[c] brilhará sobre você.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tudo o que é tornado visível é luz” ou “tudo o que é exposto é luz”. O particípio grego pode indicar aquilo que é tornado visível, revelado ou exposto.'
    reason: lexical_alternative
  - marker: b
    text: A origem da citação é incerta. Ela pode ecoar temas das Escrituras, especialmente Isaías 60:1, ou provir de um antigo hino cristão.
    reason: cross_reference
  - marker: c
    text: 'Grego: “o Cristo”. Aqui, Χριστός é traduzido como o título “o Messias”. Alternativamente: “o Cristo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν
  choice: tudo
  rationale: O neutro singular com o particípio substantivado tem sentido genérico e abrangente, sem exigir referente pessoal.
- source_word: φανερούμενον
  choice: é trazido à luz
  rationale: Preserva o valor passivo e permite tanto a ideia de tornar visível quanto a de expor, em continuidade com a imagem da luz no contexto.
- source_word: φῶς
  choice: luz
  rationale: Correspondência direta que mantém implícita a força metafórica.
- source_word: διὸ
  choice: por isso
  rationale: Expressa de modo natural em português a inferência introduzida pelo termo grego.
- source_word: λέγει
  choice: se diz
  rationale: Mantém indeterminado o sujeito da citação, como no grego, sem identificá-lo como Deus, a Escritura ou um hino.
- source_word: Ἔγειρε
  choice: desperte
  rationale: Imperativo natural e digno que preserva a metáfora do sono.
- source_word: ὁ καθεύδων
  choice: você que dorme
  rationale: Reproduz com clareza o particípio substantivado em função de vocativo e evita o pouco natural 'dorminhoco'.
- source_word: ἀνάστα
  choice: levante-se
  rationale: Imperativo corrente que conserva a ideia de erguer-se e sua ressonância com a ressurreição no complemento seguinte.
- source_word: ἐκ τῶν νεκρῶν
  choice: dentre os mortos
  rationale: Torna explícito o sentido de sair do meio dos mortos sem interpretar além do texto.
- source_word: ἐπιφαύσει
  choice: iluminará
  rationale: Verbo natural em português que conserva a imagem de luz incidindo sobre alguém; a alternativa mais formal é registrada em nota.
- source_word: ὁ Χριστός
  choice: o Messias
  rationale: O artigo e o contexto favorecem o uso titular; 'Messias' comunica o sentido de Χριστός em vez de tratá-lo apenas como nome próprio.
theological_decisions:
- issue: Natureza da introdução da citação
  choice: se diz
  alternative: a Escritura diz; ele diz; diz um hino
  rationale: O sujeito está indeterminado no grego e a origem exata da citação é incerta; a tradução não deve resolver essa questão.
- issue: Identidade da fonte citada
  choice: Registrar a incerteza em nota
  alternative: Identificar diretamente Isaías 60:1 ou um hino cristão primitivo
  rationale: A formulação pode ecoar temas bíblicos, sobretudo Isaías 60:1, mas não corresponde exatamente a uma fonte conhecida.
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: o Cristo
  rationale: Aqui o termo funciona naturalmente como título; a alternativa tradicional é preservada em nota.
- issue: Relação entre o que é exposto e a luz
  choice: tudo o que é trazido à luz é luz
  alternative: tudo o que é exposto torna-se visível pela luz
  rationale: A construção grega é densa e admite discussão. A redação mantém a predicação explícita φῶς ἐστιν sem inserir 'pela luz' nem resolver se há transformação ou apenas manifestação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Empregou-se “você” por naturalidade contemporânea, sem coloquialismo excessivo. “Trazido à luz” mantém a ligação lexical e imagética com o contexto, enquanto as notas preservam as ambiguidades relevantes.
