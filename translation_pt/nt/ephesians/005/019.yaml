lexical_decisions:
- source_word: λαλοῦντες
  choice: falando
  rationale: Preserva o particípio e o sentido amplo do verbo, sem restringi-lo a uma forma solene de discurso.
- source_word: ἑαυτοῖς
  choice: uns com os outros
  rationale: No contexto plural e comunitário, o reflexivo tem naturalmente sentido recíproco; a expressão é clara e corrente em português.
- source_word: ψαλμοῖς
  choice: salmos
  rationale: Equivalente tradicional e direto, sem limitar a referência exclusivamente aos Salmos canônicos.
- source_word: ὕμνοις
  choice: hinos
  rationale: Equivalente lexical consagrado que mantém a sequência tríplice do grego.
- source_word: ᾠδαῖς πνευματικαῖς
  choice: cânticos espirituais
  rationale: Reproduz naturalmente a relação entre substantivo e adjetivo sem acrescentar uma afirmação mais forte de inspiração pelo Espírito.
- source_word: ᾄδοντες
  choice: cantando
  rationale: Tradução direta do particípio, coordenada com ψάλλοντες.
- source_word: ψάλλοντες
  choice: entoando louvores
  rationale: Expressa a nuance musical e laudatória do verbo no grego do Novo Testamento sem exigir nem excluir acompanhamento instrumental.
- source_word: τῇ καρδίᾳ ὑμῶν
  choice: de coração
  rationale: Forma portuguesa natural que comunica modo e interioridade, preservando a participação sincera do coração sem uma construção rígida.
- source_word: τῷ κυρίῳ
  choice: ao Senhor
  rationale: Mantém o título κύριος e o valor direcional do dativo, sem explicitar além do que o versículo diz.
theological_decisions:
- issue: Sentido de ψάλλοντες em relação à prática musical
  choice: entoando louvores, sem especificar acompanhamento instrumental
  alternative: fazendo melodia; tocando; cantando louvores
  rationale: O verbo pode ter antecedentes ligados a tocar cordas, mas neste contexto não exige instrumentos. A redação evita impor uma posição denominacional favorável ou contrária ao uso deles.
- issue: Referente de τῷ κυρίῳ
  choice: ao Senhor
  alternative: ao Senhor Jesus
  rationale: Embora o contexto de Efésios possa apontar para Cristo, o versículo emprega apenas κύριος; a tradução preserva essa formulação.
- issue: Valor de πνευματικαῖς
  choice: espirituais
  alternative: inspirados pelo Espírito
  rationale: A tradução mantém a possível amplitude do adjetivo e não transforma a expressão numa afirmação explícita sobre inspiração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Cânticos” preserva a distinção tradicional entre salmos, hinos e cânticos; “de coração” evita artificialidade e comunica naturalmente o valor modal ou interior do dativo grego.
