  text: For this reason[a], do not become foolish, but understand what the will of the Lord is.
translation:
  language: pt
  text: Por essa razão[a], não se tornem insensatos, mas entendam qual é a vontade do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Portanto, não sejam insensatos”. O verbo grego também pode ser expresso de maneira mais estática como “sejam”, mas “se tornem” preserva melhor a ideia de entrar nessa condição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por essa razão
  rationale: A locução retoma a exortação anterior com valor causal ou inferencial. “Por essa razão” conserva claramente essa ligação em português atual.
- source_word: μὴ γίνεσθε
  choice: não se tornem
  rationale: γίνομαι expressa entrar ou vir a estar numa condição, e não apenas um estado. “Não se tornem” preserva essa nuance dinâmica e a força proibitiva do imperativo.
- source_word: ἄφρονες
  choice: insensatos
  rationale: O termo descreve quem carece de entendimento ou bom senso. “Insensatos” cria um contraste lexical claro com a ordem seguinte para entender, sem repetir diretamente a linguagem de sabedoria do contexto.
- source_word: ἀλλὰ
  choice: mas
  rationale: “Mas” comunica de modo natural o forte contraste entre a proibição e a ordem positiva.
- source_word: συνίετε
  choice: entendam
  rationale: O verbo significa compreender, captar ou perceber. “Entendam” é claro, natural e permite, no contexto, a ideia de discernimento refletido.
- source_word: τί
  choice: qual é
  rationale: Na oração interrogativa indireta, “qual é” apresenta idiomaticamente em português o conteúdo que deve ser entendido.
- source_word: τὸ θέλημα
  choice: a vontade
  rationale: θέλημα designa vontade, propósito ou aquilo que se deseja que seja feito. “A vontade” é a equivalência consagrada e adequada ao uso paulino.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: A tradução mantém o título κύριος e não explicita além do grego a identidade de seu referente.
theological_decisions:
- issue: Referente de τοῦ κυρίου
  choice: do Senhor, sem acrescentar “Jesus”
  alternative: do Senhor Jesus; de Deus
  rationale: Embora o contexto de Efésios frequentemente aplique “Senhor” a Jesus, o versículo traz apenas κυρίου. A tradução preserva essa formulação e sua possível tensão referencial.
- issue: Força da proibição μὴ γίνεσθε
  choice: não se tornem
  alternative: não sejam; deixem de ser
  rationale: A escolha preserva a ideia de vir a uma condição, sem afirmar que os destinatários já sejam plenamente insensatos nem transformar a ordem em mandamento para interromper um estado já existente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “se tornem/entendam” representa naturalmente os imperativos dirigidos à comunidade. “Insensatos” mantém o contraste com “entendam” e evita linguagem excessivamente coloquial.
