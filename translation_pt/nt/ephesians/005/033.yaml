  text: πλὴν καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος τὴν ἑαυτοῦ γυναῖκα οὕτως ἀγαπάτω ὡς ἑαυτόν, ἡ δὲ γυνὴ ἵνα φοβῆται τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/033.yaml
  text: Nevertheless[a], you also—each one individually—must love his own wife as himself[b], and the wife must fear her husband.
translation:
  language: pt
  text: Em todo caso, cada um de vocês também ame a própria esposa assim como a si mesmo; e que a esposa respeite[a] o marido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “tema o marido”. Aqui, “temer” tem o sentido de respeito reverente, não necessariamente de sentir pavor.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Em todo caso
  rationale: Marca a transição conclusiva para o resumo prático, preservando o valor de retomada e ressalva sem soar excessivamente literário.
- source_word: καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος
  choice: também cada um de vocês
  rationale: Conserva tanto a inclusão enfática de καί quanto a força distributiva da expressão, aplicando a exortação pessoalmente a cada marido.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: a própria esposa
  rationale: No contexto matrimonial, γυνή significa 'esposa', e ἑαυτοῦ reforça que se trata da esposa de cada um.
- source_word: οὕτως ἀγαπάτω ὡς ἑαυτόν
  choice: ame a própria esposa assim como a si mesmo
  rationale: O subjuntivo exortativo português comunica naturalmente o imperativo grego de terceira pessoa; 'assim como' mantém a comparação expressa por οὕτως ... ὡς.
- source_word: ἵνα φοβῆται
  choice: respeite
  rationale: Embora φοβέομαι possa significar literalmente 'temer', neste contexto relacional comunica reverência ou respeito. A alternativa literal é registrada em nota para preservar a amplitude lexical.
- source_word: τὸν ἄνδρα
  choice: o marido
  rationale: No contexto do casal, ἀνήρ tem o sentido específico de 'marido'; o artigo definido reproduz adequadamente a construção grega.
theological_decisions:
- issue: Sentido de φοβῆται na exortação à esposa
  choice: respeite
  alternative: tema ou reverencie
  rationale: A tradução principal evita sugerir pavor ou ameaça, sentidos não exigidos pelo contexto, mas a nota conserva o termo mais literal e a tensão lexical do grego.
- issue: Especificidade matrimonial e de gênero
  choice: cada marido deve amar a própria esposa; a esposa deve respeitar o marido
  alternative: linguagem neutra sobre cônjuges
  rationale: As formas gregas são singulares e especificamente relacionadas a marido e esposa; a tradução não neutraliza essa particularidade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção singular “cada um de vocês ame” preserva a aplicação individual do grego; o ponto e vírgula mantém unidas as duas partes do resumo matrimonial.
