id: EPH.5.5
reference: Ephesians 5:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ⸀ἴστε γινώσκοντες ὅτι πᾶς πόρνος ἢ ἀκάθαρτος ἢ πλεονέκτης, ⸀ὅ ἐστιν εἰδωλολάτρης, οὐκ ἔχει κληρονομίαν ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/005.yaml
  text: For you know this[a], understanding that every sexually immoral or unclean or greedy person, who is an idolater[b], has no inheritance in the kingdom of Messiah and God.
translation:
  language: pt
  text: 'Pois saibam isto com certeza: nenhuma pessoa sexualmente imoral, impura ou gananciosa — que é idólatra[b] — tem herança no reino do Messias e de Deus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois vocês sabem isto, compreendendo que”. A expressão grega combina dois verbos relacionados a saber e compreender, dando ênfase à certeza.'
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “o que é idolatria”, provavelmente em referência especial à ganância ou cobiça.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴστε γινώσκοντες
  choice: vocês sabem disto, compreendendo
  rationale: Preserva tanto a afirmação enfática de saber quanto a nuance participial de γινώσκοντες, em português atual e inteligível.
- source_word: πόρνος
  choice: pessoa sexualmente imoral
  rationale: Expressa alguém caracterizado pela imoralidade sexual sem recorrer ao termo mais estreito ou antiquado “fornicador”.
- source_word: ἀκάθαρτος
  choice: impura
  rationale: Mantém o sentido ético de impureza e também sua ressonância metafórica, sem restringi-lo indevidamente.
- source_word: πλεονέκτης
  choice: gananciosa
  rationale: Comunica em linguagem corrente a cobiça ávida e possessiva indicada pelo termo.
- source_word: ὅ ἐστιν εἰδωλολάτρης
  choice: que é idólatra
  rationale: Segue a leitura contextual que caracteriza a pessoa gananciosa como idólatra, enquanto a forma neutra e a leitura abstrata ficam registradas em nota.
- source_word: κληρονομίαν
  choice: herança
  rationale: Conserva a linguagem paulina e suas ressonâncias pactuais e escatológicas.
- source_word: βασιλείᾳ
  choice: reino
  rationale: É a tradução estabelecida e adequada, capaz de abranger domínio e reinado.
- source_word: Χριστοῦ
  choice: Messias
  rationale: Traduz Χριστός como título nesta construção, em conformidade com sua função no contexto.
- source_word: τοῦ Χριστοῦ καὶ θεοῦ
  choice: do Messias e de Deus
  rationale: Reproduz com naturalidade os genitivos coordenados sem impor uma conclusão sintática ou cristológica além da formulação grega.
theological_decisions:
- issue: Referente de ὅ ἐστιν εἰδωλολάτρης
  choice: 'A oração é aplicada à pessoa mencionada por último: “que é idólatra”.'
  alternative: “o que é idolatria”, referindo-se sobretudo à ganância/cobiça.
  rationale: O relativo neutro produz ambiguidade, e Colossenses 3:5 favorece a associação da ganância com a idolatria. O texto principal oferece uma construção portuguesa natural, e a nota preserva a alternativa formal.
- issue: Sentido da exclusão da herança
  choice: “tem herança” em declaração presente, negada por “nenhuma”.
  alternative: “não herdará o reino”.
  rationale: O grego emprega o presente οὐκ ἔχει; a tradução conserva esse aspecto e toda a força da advertência.
- issue: Relação entre “o Messias e Deus”
  choice: 'Genitivos coordenados traduzidos diretamente: “do Messias e de Deus”.'
  alternative: Uma formulação interpretativa que explicite determinada conclusão cristológica baseada na sintaxe.
  rationale: A tradução preserva a expressão grega e sua tensão sem decidir no próprio texto uma questão sintática debatida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo; “pessoa” permite coordenar naturalmente os três qualificativos. Os travessões demarcam a oração explicativa sem eliminar sua possível ligação especial com a ganância.
