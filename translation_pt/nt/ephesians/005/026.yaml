  text: ἵνα αὐτὴν ἁγιάσῃ καθαρίσας τῷ λουτρῷ τοῦ ὕδατος ἐν ῥήματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/026.yaml
  text: so that he might sanctify her[a], having cleansed her by the washing of water with the word[c][b],
translation:
  language: pt
  text: para santificá-la[a], tendo-a purificado pela lavagem com água, com a palavra[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para torná-la santa”.
    reason: lexical_alternative
  - marker: b
    text: Ou “com a mensagem”; o termo grego também pode indicar uma declaração ou mensagem.
    reason: alternative_reading
  - marker: c
    text: A expressão “lavagem com água, com a palavra” provavelmente evoca o batismo, mas o grego não define por si só até que ponto a referência deve ser entendida em sentido especificamente sacramental.
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: para
  rationale: Introduz a finalidade da entrega de Cristo mencionada no contexto; “para” expressa essa força de modo natural e conciso em português.
- source_word: αὐτὴν
  choice: -la
  rationale: O pronome feminino singular retoma a igreja no contexto e é preservado no pronome enclítico português.
- source_word: ἁγιάσῃ
  choice: santificá-la
  rationale: “Santificar” conserva a ligação lexical e teológica com a santidade, sem excluir o sentido comum de tornar santa ou consagrar.
- source_word: καθαρίσας
  choice: tendo-a purificado
  rationale: A construção com gerúndio composto preserva o particípio aoristo e apresenta a purificação como ação anterior ou associada à santificação. O objeto feminino, implícito no particípio grego, é explicitado em português.
- source_word: τῷ λουτρῷ
  choice: pela lavagem
  rationale: A preposição “por” representa naturalmente o provável valor instrumental do dativo. “Lavagem” comunica o ato de lavar sem impor que se trate literalmente de um banho.
- source_word: τοῦ ὕδατος
  choice: com água
  rationale: Embora o grego tenha uma construção genitiva, “lavagem com água” é a formulação corrente em português e expressa de modo claro o elemento empregado na lavagem.
- source_word: ἐν ῥήματι
  choice: com a palavra
  rationale: “Com” permite que a expressão indique meio ou circunstância associada, sem definir em excesso sua relação precisa com a lavagem.
- source_word: ῥήματι
  choice: palavra
  rationale: ῥῆμα pode designar palavra, declaração ou mensagem. “Palavra” mantém a amplitude do termo e evita identificá-lo sem necessidade com uma fórmula ou mensagem específica.
theological_decisions:
- issue: Relação entre purificação, lavagem com água e palavra em um contexto possivelmente batismal
  choice: Conservar a imagem da lavagem com água e sua associação com a palavra, sem definir uma teologia sacramental específica.
  alternative: Explicitar que se trata do batismo sacramental, ou interpretar toda a linguagem como metáfora sem referência batismal.
  rationale: A linguagem provavelmente evoca o batismo, mas o grego não determina por si só como deve ser entendida a natureza sacramental dessa referência.
- issue: Sentido específico de ῥήματι
  choice: Usar “palavra” no texto principal.
  alternative: Usar “mensagem”, “declaração” ou uma expressão interpretativa como “mensagem do evangelho”.
  rationale: O contexto pode sugerir uma mensagem proclamada associada à obra salvadora de Cristo, mas o termo grego é mais amplo e não exige essa especificação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém o encadeamento sintático do grego sem sacrificar a naturalidade; a vírgula final indica que o versículo continua no contexto imediato.
