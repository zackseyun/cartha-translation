  text: οὕτως ὀφείλουσιν ⸀καὶ οἱ ἄνδρες ἀγαπᾶν τὰς ἑαυτῶν γυναῖκας ὡς τὰ ἑαυτῶν σώματα· ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα ἑαυτὸν ἀγαπᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/028.yaml
  text: In the same way, husbands also ought to love their own wives as their own bodies. He who loves his own wife loves himself,
translation:
  language: pt
  text: Da mesma forma, os maridos também devem amar a própria esposa como o próprio corpo. Quem ama a própria esposa ama a si mesmo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Da mesma forma
  rationale: Retoma a comparação e a exortação anteriores com naturalidade, preservando a força de conexão do advérbio.
- source_word: ὀφείλουσιν
  choice: devem
  rationale: Expressa a obrigação moral indicada pelo verbo no contexto exortativo, sem recorrer a uma formulação excessivamente pesada.
- source_word: καὶ οἱ ἄνδρες
  choice: os maridos também
  rationale: καί tem força aditiva, e ἄνδρες designa os maridos neste contexto matrimonial.
- source_word: ἀγαπᾶν
  choice: amar
  rationale: Preserva de modo direto a repetição de ἀγαπάω e sua ligação lexical ao longo do versículo.
- source_word: τὰς ἑαυτῶν γυναῖκας
  choice: a própria esposa
  rationale: γυναῖκας significa 'esposas' no contexto; o singular distributivo é idiomático em português e 'própria' conserva a ênfase reflexiva de ἑαυτῶν.
- source_word: ὡς τὰ ἑαυτῶν σώματα
  choice: como o próprio corpo
  rationale: Mantém a comparação e traduz literalmente σώματα; o singular distributivo soa natural em português, pois cada marido é comparado ao próprio corpo.
- source_word: ὁ ἀγαπῶν
  choice: Quem ama
  rationale: Expressa naturalmente o particípio substantivado sem perder a referência geral ao marido no contexto imediato.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: a própria esposa
  rationale: Preserva tanto o sentido conjugal de γυνή quanto a ênfase reflexiva de ἑαυτοῦ.
- source_word: ἑαυτὸν ἀγαπᾷ
  choice: ama a si mesmo
  rationale: Reflete diretamente o pronome reflexivo e a repetição verbal que estruturam o argumento de Paulo.
theological_decisions:
- issue: Linguagem de gênero na exortação doméstica
  choice: Traduzir οἱ ἄνδρες por 'os maridos' e verter ὁ ἀγαπῶν naturalmente por 'Quem ama'
  alternative: Traduzir ἄνδρες por 'homens' ou repetir 'o marido que ama'
  rationale: O contexto trata especificamente da relação conjugal. 'Quem ama' é uma formulação portuguesa natural cujo referente continua sendo o marido mencionado na primeira oração, sem ampliar o enunciado para toda a humanidade.
- issue: Natureza da comparação entre esposa e corpo
  choice: Manter a analogia explícita, sem explicação doutrinária adicional
  alternative: Verter ou explicar a frase como uma afirmação de identidade metafísica
  rationale: O texto compara o amor do marido pela esposa ao amor pelo próprio corpo e conclui que amar a esposa é amar a si mesmo; a tradução conserva essa tensão ética e teológica sem desenvolvê-la além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega singular distributivo ('a própria esposa', 'o próprio corpo'), natural em português, para representar os plurais gregos aplicados individualmente a cada marido. Não são necessárias notas textuais ou explicativas neste versículo.
