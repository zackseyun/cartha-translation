id: EPH.5.29
reference: Ephesians 5:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ποτε τὴν ἑαυτοῦ σάρκα ἐμίσησεν, ἀλλὰ ἐκτρέφει καὶ θάλπει αὐτήν, καθὼς καὶ ὁ ⸀Χριστὸς τὴν ἐκκλησίαν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/029.yaml
  text: For no one ever hated his own flesh[a], but nourishes and cherishes it, just as the Messiah also does the church[c][b],
translation:
  language: pt
  text: Pois ninguém jamais odiou a própria carne[a]; pelo contrário, ele a nutre e cuida dela com carinho, assim como também o Messias faz com a igreja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “carne” se refere ao próprio corpo ou ser físico, não à “natureza pecaminosa”.
    reason: lexical_clarification
lexical_decisions:
- source_word: οὐδεὶς γάρ ποτε
  choice: Pois ninguém jamais
  rationale: “Pois” mantém a função explicativa de γάρ; “ninguém jamais” expressa de modo natural a combinação enfática de οὐδεὶς com ποτε.
- source_word: τὴν ἑαυτοῦ σάρκα
  choice: a própria carne
  rationale: Preserva o sentido literal de σάρξ e o valor reflexivo de ἑαυτοῦ. No contexto, “carne” indica a pessoa em sua realidade física, e não uma suposta natureza pecaminosa.
- source_word: ἐμίσησεν
  choice: odiou
  rationale: Equivalente direto e corrente do aoristo de μισέω.
- source_word: ἀλλὰ
  choice: pelo contrário
  rationale: Torna clara e natural em português a forte oposição entre odiar e cuidar, sem alterar o sentido.
- source_word: ἐκτρέφει
  choice: nutre
  rationale: Expressa alimentar e sustentar, adequando-se à imagem do cuidado com o próprio corpo.
- source_word: θάλπει
  choice: cuida dela com carinho
  rationale: Comunica o cuidado terno indicado pelo verbo, cujo sentido contextual vai além da ideia literal de aquecer.
- source_word: καθὼς καὶ
  choice: assim como também
  rationale: Conserva tanto a comparação introduzida por καθώς quanto a força aditiva de καί.
- source_word: ὁ Χριστὸς
  choice: o Messias
  rationale: Traduz o título Χριστός pelo seu significado, particularmente apropriado aqui por vir com artigo e funcionar como título.
- source_word: τὴν ἐκκλησίαν
  choice: a igreja
  rationale: Equivalente consagrado e claro para a comunidade do povo de Deus neste contexto paulino.
theological_decisions:
- issue: Sentido de σάρξ
  choice: carne
  alternative: corpo
  rationale: O uso é literal e se refere ao próprio ser físico dentro da analogia entre marido e mulher e entre o Messias e a igreja. “Carne” preserva a ligação lexical e a linguagem do contexto sem introduzir o sentido ético de “natureza pecaminosa”.
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: o Cristo
  rationale: O artigo e o contexto favorecem a leitura como título. “Messias” comunica em português o significado do título grego, enquanto “Cristo” é a forma tradicional transliterada.
- issue: Verbos elípticos na oração final
  choice: faz com a igreja
  alternative: nutre e cuida da igreja com carinho
  rationale: O grego omite os verbos na comparação final. “Faz com a igreja” mantém essa elipse de modo idiomático em português, permitindo que o leitor recupere as duas ações anteriores sem explicitação indevida.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição do pronome em “ele a nutre” evita ambiguidade sintática, e “cuida dela com carinho” expressa naturalmente a ternura de θάλπει.
