base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/010.yaml
  text: testing what is pleasing to the Lord;[a]
translation:
  language: pt
  text: discernindo o que agrada ao Senhor;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pondo à prova” ou “verificando” o que agrada ao Senhor.
    reason: Alternativas lexicais para δοκιμάζοντες, ressaltando sua força de exame e comprovação.
lexical_decisions:
- source_word: δοκιμάζοντες
  choice: discernindo
  rationale: O particípio presente ativo dá continuidade ao fluxo de exortação e expressa uma ação contínua de examinar para reconhecer e aprovar o que é adequado. Em português atual, “discernindo” comunica naturalmente esse processo avaliativo; “pondo à prova” preserva mais explicitamente a força probativa e é registrado em nota.
- source_word: τί
  choice: o que
  rationale: Introduz uma pergunta indireta; “o que” é a formulação mais natural em português moderno.
- source_word: ἐστιν
  choice: '[expresso pela construção “o que agrada”]'
  rationale: A cópula grega é representada de modo idiomático na oração portuguesa, sem necessidade de traduzir separadamente “é”.
- source_word: εὐάρεστον
  choice: agrada
  rationale: O verbo “agradar” expressa de maneira clara e natural aquilo que é agradável ou aceitável ao Senhor, evitando a rigidez de “bem-agradável”.
- source_word: τῷ κυρίῳ
  choice: ao Senhor
  rationale: O dativo dependente de εὐάρεστον indica aquele a quem algo agrada. Mantém-se o título “Senhor” sem especificar além do texto grego.
theological_decisions:
- issue: Referente de κύριος
  choice: Senhor
  alternative: o Senhor Jesus; Deus
  rationale: O grego emprega apenas o título κύριος. Embora o contexto paulino possa favorecer uma leitura cristológica, a tradução preserva a formulação e a tensão do texto sem explicitar o referente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O gerúndio mantém a ligação participial com o contexto anterior.
