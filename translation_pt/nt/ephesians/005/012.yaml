  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὰ γὰρ κρυφῇ γινόμενα ὑπ’ αὐτῶν αἰσχρόν ἐστιν καὶ λέγειν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/012.yaml
  text: For it is shameful even to speak of the things done by them in secret[a].
translation:
  language: pt
  text: Pois até falar das coisas que eles fazem em segredo é vergonhoso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois até falar do que é feito por eles em segredo é vergonhoso.”'
    reason: Alternativa mais formal que preserva a construção passiva do particípio γινόμενα com o agente ὑπ’ αὐτῶν.
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação que sustenta a exortação anterior e preserva o encadeamento argumentativo de Paulo.
- source_word: τὰ ... γινόμενα ὑπ’ αὐτῶν
  choice: das coisas que eles fazem
  rationale: O artigo com o particípio tem valor substantivado e se refere a ações. A construção ativa é natural em português e mantém explícita a agência indicada por ὑπό com genitivo.
- source_word: κρυφῇ
  choice: em segredo
  rationale: Expressa que as ações ocorrem de modo oculto; a locução é corrente e fiel ao sentido adverbial.
- source_word: αἰσχρόν
  choice: vergonhoso
  rationale: Comunica a reprovação moral de αἰσχρός em linguagem clara, atual e digna.
- source_word: καὶ λέγειν
  choice: até falar
  rationale: καί tem aqui força ascendente, bem expressa por “até”; “falar das coisas” é idiomático em português e não torna o verbo mais específico do que o grego.
theological_decisions:
- issue: Referente de αὐτῶν
  choice: Manter o pronome como “eles”, sem explicitar o referente no versículo.
  alternative: “aqueles que praticam as obras das trevas” ou outra identificação contextual explícita.
  rationale: O grego conserva apenas o pronome, cujo referente é recuperado pelo contexto. Explicitá-lo no texto resolveria uma referência que o original deixa contextual.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. A ordem foi ajustada para soar natural, sem eliminar a ligação explicativa nem a ênfase de “até”.
