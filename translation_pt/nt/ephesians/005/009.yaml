  text: for the fruit of the light is in all goodness and righteousness and truth[c][b][a],
translation:
  language: pt
  text: pois o fruto da luz[a] se manifesta em toda bondade, justiça e verdade,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “o fruto do Espírito” em vez de “o fruto da luz”.
    reason: textual_variant
lexical_decisions:
- source_word: γὰρ
  choice: pois
  rationale: Introduz a explicação da exortação anterior e mantém de modo natural a força causal do conectivo.
- source_word: καρπὸς
  choice: fruto
  rationale: Preserva a metáfora paulina de qualidades produzidas e sua ressonância bíblica.
- source_word: τοῦ φωτός
  choice: da luz
  rationale: Reproduz diretamente o genitivo e retoma a identidade dos leitores como luz no Senhor no versículo anterior.
- source_word: ἐν
  choice: se manifesta em
  rationale: Neste contexto, a preposição indica a esfera ou expressão visível do fruto. A formulação evita o sentido meramente locativo de “está em” sem reduzir a expressão à ideia estrita de composição.
- source_word: πάσῃ
  choice: toda
  rationale: Com o substantivo abstrato no singular, comunica abrangência completa.
- source_word: ἀγαθωσύνῃ
  choice: bondade
  rationale: Expressa a qualidade moral positiva sem restringi-la apenas à gentileza.
- source_word: δικαιοσύνῃ
  choice: justiça
  rationale: Em português, “justiça” abrange tanto a retidão moral quanto o agir justo e preserva aqui a amplitude de δικαιοσύνη.
- source_word: ἀληθείᾳ
  choice: verdade
  rationale: Mantém a amplitude do termo, que pode envolver tanto conformidade com a realidade quanto sinceridade moral.
theological_decisions:
- issue: Variante textual na expressão genitiva
  choice: o fruto da luz
  alternative: o fruto do Espírito
  rationale: O texto da SBLGNT traz φωτός (“luz”), leitura que também se ajusta ao contexto imediato de Efésios 5:8. A variante πνεύματος (“Espírito”) é preservada em nota por sua presença na tradição manuscrita.
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: “Justiça” é uma tradução ampla e corrente em português, capaz de incluir tanto o caráter reto quanto a prática do que é justo, sem impor uma distinção teológica ausente do contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Se manifesta em” comunica a função contextual de ἐν de maneira mais natural do que o locativo “está em”, preservando a relação entre o fruto e as três qualidades.
