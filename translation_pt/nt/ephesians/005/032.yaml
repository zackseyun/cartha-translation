  text: τὸ μυστήριον τοῦτο μέγα ἐστίν, ἐγὼ δὲ λέγω εἰς Χριστὸν καὶ εἰς τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/032.yaml
  text: This mystery is great[c][b][a], but I am speaking with reference to Messiah and the church.
translation:
  language: pt
  text: Este mistério é grande[a], mas estou falando a respeito do Messias[b] e da igreja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Este mistério é profundo”. O grego diz mais literalmente “grande”, termo que pode indicar grandeza ou importância, e não somente profundidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “Cristo”. Aqui, Χριστός é traduzido como título: “o Messias”.'
    reason: alternative_reading
lexical_decisions:
- source_word: μυστήριον
  choice: mistério
  rationale: No uso paulino, designa uma verdade divina antes oculta e agora revelada, não apenas algo enigmático. “Mistério” preserva esse uso e seu peso teológico.
- source_word: μέγα
  choice: grande
  rationale: É o sentido lexical direto e mantém aberta a ideia de grandeza ou importância, sem restringi-la à profundidade.
- source_word: δὲ
  choice: mas
  rationale: Marca uma transição levemente contrastiva entre a afirmação sobre o mistério e a explicação de Paulo.
- source_word: λέγω
  choice: estou falando
  rationale: Expressa naturalmente o presente e conserva a força verbal, sem substituí-la pelo mais interpretativo “quero dizer”.
- source_word: εἰς
  choice: a respeito de
  rationale: Depois de λέγω, indica referência. A expressão é clara e idiomática em português.
- source_word: Χριστόν
  choice: o Messias
  rationale: Χριστός conserva aqui forte valor de título; “o Messias” comunica esse valor de modo transparente.
- source_word: ἐκκλησίαν
  choice: a igreja
  rationale: Neste contexto paulino, refere-se ao povo de Deus em sua identidade coletiva; “igreja” é a tradução mais clara e estabelecida.
theological_decisions:
- issue: Referente de “este mistério” na relação entre casamento, Messias e igreja
  choice: Manter a expressão sem definir se o mistério é especificamente o casamento, Gênesis 2:24 ou a relação tipológica apontada no contexto.
  alternative: Explicitar que o mistério é a união matrimonial, a citação de Gênesis 2:24 ou sua significação tipológica.
  rationale: O grego afirma a grandeza do mistério e então esclarece que Paulo fala a respeito do Messias e da igreja, mas não elimina todas as possibilidades quanto ao referente exato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. “Estou falando a respeito de” evita a rigidez de uma reprodução literal de λέγω εἰς, enquanto “Messias” preserva o valor titular de Χριστός.
