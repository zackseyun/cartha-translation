source:
  edition: SBLGNT
  text: ἀλλὰ ⸀ὡς ἡ ἐκκλησία ὑποτάσσεται τῷ Χριστῷ, οὕτως καὶ αἱ γυναῖκες ⸀τοῖς ἀνδράσιν ἐν παντί.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/024.yaml
  text: But as the church submits to Messiah[a], so also wives to their husbands in everything.
translation:
  language: pt
  text: Mas, assim como a igreja se submete ao Messias[a], também as esposas se submetem aos seus maridos em tudo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cristo”. O título grego Χριστός é traduzido aqui como “Messias” porque funciona como título.
    reason: Leitura alternativa tradicional para o título grego.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca o contraste ou a retomada em relação à afirmação anterior, de modo natural em português.
- source_word: ὡς ... οὕτως καὶ
  choice: assim como ... também
  rationale: Preserva a estrutura correlativa da comparação grega em português corrente.
- source_word: ἡ ἐκκλησία
  choice: a igreja
  rationale: No uso paulino, designa aqui a comunidade cristã; “igreja” é a forma consagrada e clara em português.
- source_word: ὑποτάσσεται
  choice: se submete
  rationale: A forma verbal expressa submissão relacional; a construção pronominal é natural em português e não acrescenta uma ideia de coerção.
- source_word: τῷ Χριστῷ
  choice: ao Messias
  rationale: Χριστός funciona como título neste contexto; “Messias” traduz o título, enquanto “Cristo” é mantido em nota como alternativa tradicional.
- source_word: αἱ γυναῖκες
  choice: as esposas
  rationale: No contexto das relações domésticas e em correlação com ἀνδράσιν, o sentido exigido é “esposas”, não “mulheres” em geral.
- source_word: τοῖς ἀνδράσιν
  choice: aos seus maridos
  rationale: O contexto matrimonial requer “maridos”; “seus” explicita de modo idiomático a relação recíproca implícita na construção grega.
- source_word: ἐν παντί
  choice: em tudo
  rationale: Reproduz diretamente a amplitude da expressão grega, sem inserir qualificações interpretativas.
- source_word: '[elipse verbal na segunda oração]'
  choice: também as esposas aos seus maridos
  rationale: Mantém a elipse do verbo repetido, como no texto grego, em uma formulação compreensível pelo paralelismo com a primeira oração.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: O termo funciona como título e por isso é traduzido como “Messias”; a forma tradicional “Cristo” é registrada em nota.
- issue: Alcance da submissão conjugal
  choice: Manter “em tudo” sem qualificações adicionais
  alternative: Expansões como “em tudo o que for apropriado”
  rationale: O grego diz simplesmente ἐν παντί. Acrescentar limites explicativos resolveria no texto uma tensão que o versículo não explicita.
- issue: Verbo elíptico na segunda oração
  choice: Preservar a elipse
  alternative: Suprir “se submetam” ou “devem se submeter”
  rationale: A ausência do verbo repetido é genuína no grego e o paralelismo permite conservá-la em português sem perder a compreensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo e a elipse do original sem acrescentar explicações ao texto principal.
