source:
  edition: SBLGNT
  text: ὥστε ⸂αὐτοὺς ἡμᾶς⸃ ἐν ὑμῖν ⸀ἐγκαυχᾶσθαι ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν αἷς ἀνέχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/004.yaml
  text: so that we ourselves boast about you among the churches of God because of your perseverance and faith in all your persecutions and afflictions that you are enduring,[a]
translation:
  language: pt
  text: de modo que nós mesmos nos gloriamos de vocês entre as igrejas de Deus, por causa da perseverança e da fé de vocês em meio a todas as perseguições e aflições que estão suportando.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fidelidade”; πίστις pode significar tanto fé como fidelidade constante, especialmente em contextos de sofrimento.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: de modo que
  rationale: Introduz o resultado da afirmação anterior de maneira natural em português.
- source_word: αὐτοὺς ἡμᾶς
  choice: nós mesmos
  rationale: Preserva a ênfase do grego em Paulo e seus companheiros.
- source_word: ἐν ὑμῖν ἐγκαυχᾶσθαι
  choice: nos orgulhamos de vocês
  rationale: Expressa idiomaticamente o ato de falar com orgulho a respeito deles, sem enfraquecer a força retórica do verbo.
- source_word: ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ
  choice: entre as igrejas de Deus
  rationale: Indica o âmbito comunitário em que esse orgulho é expresso e conserva o plural do original.
- source_word: ὑπὲρ
  choice: por causa de
  rationale: Marca aqui o fundamento do orgulho de Paulo e seus companheiros.
- source_word: ὑπομονῆς
  choice: perseverança
  rationale: Comunica resistência paciente e constante sob pressão em linguagem atual.
- source_word: πίστεως
  choice: fé
  rationale: Mantém o sentido usual de πίστις, preservando em nota a possibilidade contextual de fidelidade.
- source_word: διωγμοῖς
  choice: perseguições
  rationale: Designa oposição hostil sofrida por causa da lealdade religiosa.
- source_word: θλίψεσιν
  choice: aflições
  rationale: Conserva a ideia de pressões e sofrimentos mais amplos, distinguindo-os das perseguições.
- source_word: αἷς ἀνέχεσθε
  choice: que estão suportando
  rationale: Reflete a ação presente e contínua de resistir às aflições.
theological_decisions:
- issue: Sentido de πίστις em contexto de sofrimento
  choice: fé
  alternative: fidelidade
  rationale: O termo pode apontar tanto para a fé mantida sob perseguição quanto para a fidelidade perseverante. A leitura principal permanece no texto, e a ambiguidade legítima é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação evita arcaísmos e mantém a ênfase, a progressão lógica e a ambiguidade lexical do grego.
