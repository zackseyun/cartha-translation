  rationale: A revisão elimina uma explicitação verbal não presente no texto grego e torna mais transparente que «em todas as perseguições e aflições» qualifica a perseverança e a fé. Também restitui com maior precisão a força de ἐγκαυχᾶσθαι, mantendo português moderno e legível.
