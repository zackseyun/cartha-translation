  text: καὶ ὑμῖν τοῖς θλιβομένοις ἄνεσιν μεθ’ ἡμῶν ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπ’ οὐρανοῦ μετ’ ἀγγέλων δυνάμεως αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/007.yaml
  text: and to you who are being afflicted[a], relief with us at the revelation of the Lord Jesus from heaven with his mighty angels.
translation:
  language: pt
  text: e a vocês, que estão sendo afligidos, alívio juntamente conosco, quando o Senhor Jesus for revelado desde o céu com os anjos do seu poder[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “com seus anjos poderosos”.'
    reason: alternativa lexical para a construção genitiva ἀγγέλων δυνάμεως αὐτοῦ
lexical_decisions:
- source_word: θλιβομένοις
  choice: que estão sendo afligidos
  rationale: O particípio presente passivo indica pessoas que, naquele momento, sofrem aflição ou opressão. A formulação preserva tanto o aspecto contínuo quanto a voz passiva.
- source_word: ἄνεσιν
  choice: alívio
  rationale: Expressa a cessação ou diminuição da pressão, em contraste direto com a aflição, sem limitar o sentido a repouso interior.
- source_word: μεθ’ ἡμῶν
  choice: juntamente conosco
  rationale: Preserva a associação de Paulo e seus companheiros aos destinatários no mesmo alívio prometido; “juntamente” torna essa inclusão clara e natural em português.
- source_word: ἐν τῇ ἀποκαλύψει
  choice: quando ... for revelado
  rationale: A preposição com o substantivo de evento tem valor temporal. A construção verbal comunica esse valor de modo natural em português, embora não reproduza a forma nominal grega.
- source_word: ἀποκαλύψει
  choice: for revelado
  rationale: Mantém a ideia de desvelamento ou manifestação pública de Jesus, em linguagem corrente e digna.
- source_word: κυρίου
  choice: Senhor
  rationale: É o equivalente estabelecido para κύριος como título de Jesus no Novo Testamento.
- source_word: ἀπ’ οὐρανοῦ
  choice: desde o céu
  rationale: ἀπό indica procedência ou ponto de origem; “desde o céu” preserva esse valor sem transformar a expressão em mero local estático.
- source_word: μετ’ ἀγγέλων δυνάμεως αὐτοῦ
  choice: com os anjos do seu poder
  rationale: Reproduz a construção genitiva comprimida do grego e não decide silenciosamente entre anjos caracterizados como poderosos e anjos associados ao poder do Senhor.
theological_decisions:
- issue: Sentido da expressão genitiva ἀγγέλων δυνάμεως αὐτοῦ
  choice: com os anjos do seu poder
  alternative: com seus anjos poderosos
  rationale: A tradução principal conserva a tensão sintática do original. A alternativa idiomática entende o genitivo qualitativamente e é registrada em nota.
- issue: Valor temporal de ἐν τῇ ἀποκαλύψει
  choice: quando o Senhor Jesus for revelado
  alternative: na revelação do Senhor Jesus
  rationale: A forma verbal exprime com clareza, em português natural, que o alívio está ligado ao momento da revelação escatológica, sem alterar o agente ou o conteúdo do acontecimento.
translation_notes:
  register: Português moderno, amplo e legível no Brasil, com tom digno. A ordem fragmentária do versículo foi mantida por ele continuar a construção iniciada no versículo anterior. O marcador foi colocado junto à expressão a que a nota efetivamente se refere.
