source:
  edition: SBLGNT
  text: Εὐχαριστεῖν ὀφείλομεν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοί, καθὼς ἄξιόν ἐστιν, ὅτι ὑπεραυξάνει ἡ πίστις ὑμῶν καὶ πλεονάζει ἡ ἀγάπη ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/003.yaml
  text: We ought always to give thanks to God for you[a], brothers, as is fitting, because your faith is growing abundantly and the love of each and every one of you for one another is increasing[c][b],
translation:
  language: pt
  text: Devemos sempre dar graças a Deus por vocês, irmãos[a], como é justo, porque a fé[b] de vocês cresce sobremaneira, e o amor de cada um de vocês pelos outros[c] aumenta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o grego diz “irmãos” e pode dirigir-se inclusivamente a toda a comunidade de fiéis.
    reason: lexical_alternative
  - marker: b
    text: Ou “a fidelidade”; a palavra grega pode significar “fé”, “confiança” ou “fidelidade”.
    reason: alternative_reading
  - marker: c
    text: Mais literalmente, “o amor de cada um de todos vocês para com os outros”; a expressão grega é enfática e redundante.
    reason: source_form
lexical_decisions:
- source_word: Εὐχαριστεῖν ὀφείλομεν
  choice: Devemos dar graças
  rationale: O infinitivo com ὀφείλομεν expressa dever ou obrigação moral. “Devemos dar graças” é natural em português e preserva o tom de reconhecimento devido.
- source_word: πάντοτε
  choice: sempre
  rationale: Reproduz diretamente a ideia temporal contínua do advérbio grego.
- source_word: περὶ ὑμῶν
  choice: por vocês
  rationale: Em fórmulas de ação de graças, περί com referência a pessoas corresponde naturalmente a “por”, e não ao mais literal e menos idiomático “a respeito de”.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém o substantivo masculino plural do texto grego; no contexto de uma comunidade cristã, ele pode incluir homens e mulheres, o que é esclarecido em nota.
- source_word: καθὼς ἄξιόν ἐστιν
  choice: como é justo
  rationale: Expressa adequação moral ou aquilo que convém. “Como é justo” é corrente e digno, sem sugerir mérito pessoal.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão pela qual a ação de graças é devida.
- source_word: ὑπεραυξάνει
  choice: cresce extraordinariamente
  rationale: O verbo composto intensifica a noção de crescimento; “extraordinariamente” conserva essa força sem recorrer a uma construção artificial.
- source_word: ἡ πίστις
  choice: a fé
  rationale: “Fé” é o sentido mais provável neste contexto, embora o campo semântico também permita “fidelidade”, preservado em nota.
- source_word: πλεονάζει
  choice: aumenta cada vez mais
  rationale: Comunica crescimento abundante e contínuo, distinguindo-o estilisticamente do verbo intensivo anterior.
- source_word: ἡ ἀγάπη
  choice: o amor
  rationale: É o equivalente português atual e usual para o amor existente entre os membros da comunidade.
- source_word: ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους
  choice: o amor de cada um de vocês pelos outros
  rationale: Preserva a ênfase distributiva em cada membro e a reciprocidade, com sintaxe portuguesa natural. A forma grega mais pleonástica é indicada em nota.
theological_decisions:
- issue: Sentido de πίστις
  choice: fé
  alternative: fidelidade ou confiança
  rationale: O contexto fala naturalmente do crescimento da fé dos tessalonicenses, mas o termo grego pode abranger confiança e fidelidade; a alternativa não é eliminada e aparece em nota.
- issue: Alcance comunitário de ἀδελφοί
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A tradução principal conserva a forma masculina plural do grego, enquanto a nota esclarece que o vocativo pode dirigir-se inclusivamente a toda a comunidade de fiéis.
- issue: Reciprocidade e distribuição do amor
  choice: o amor de cada um de vocês pelos outros
  alternative: o amor de cada um de todos vocês uns pelos outros
  rationale: A redação principal mantém a referência individual e recíproca sem reproduzir de modo pouco natural toda a redundância enfática do grego; a formulação mais literal é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “vocês” evita formas regionais de segunda pessoa; “dar graças” preserva o registro bíblico sem soar arcaico. A intensificação distinta dos dois verbos gregos é refletida por “cresce extraordinariamente” e “aumenta cada vez mais”.
