  text: since it is just before God to repay affliction to those who afflict you[a]
translation:
  language: pt
  text: visto que é justo da parte de Deus retribuir aflição aos que afligem vocês[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se de fato é justo da parte de Deus retribuir tribulação aos que afligem vocês”.'
    reason: Registra a forma condicional possível de εἴπερ e alternativas mais literais para παρὰ θεῷ e θλῖψιν.
lexical_decisions:
- source_word: εἴπερ
  choice: visto que
  rationale: Neste contexto, introduz uma premissa que Paulo apresenta como verdadeira, sem sugerir dúvida real; “visto que” preserva a relação lógica com a frase ao redor.
- source_word: δίκαιον
  choice: justo
  rationale: Expressa aquilo que é moralmente correto no juízo de Deus e se ajusta naturalmente ao contexto judicial de retribuição.
- source_word: παρὰ θεῷ
  choice: diante de Deus
  rationale: Comunica que a justiça da retribuição é considerada segundo a avaliação e o padrão de Deus, preservando uma formulação concisa e digna.
- source_word: ἀνταποδοῦναι
  choice: retribuir
  rationale: Expressa dar em retorno ou como resposta, adequando-se ao contexto de justa retribuição divina sem o tom coloquial de “dar o troco”.
- source_word: τοῖς θλίβουσιν ὑμᾶς
  choice: aos que afligem vocês
  rationale: Mantém a gravidade da ação e preserva a ligação lexical com θλῖψιν por meio de “afligem/aflição”.
- source_word: θλῖψιν
  choice: com aflição
  rationale: Preserva a correspondência verbal com “afligem” e descreve o sofrimento retribuído sem recorrer ao termo menos corrente “tribulação”.
theological_decisions:
- issue: Natureza da retribuição divina
  choice: A cláusula afirma que Deus retribui justamente aos perseguidores com aflição, sem especificar aqui todo o momento ou modo desse juízo.
  alternative: Entender a aflição como exclusivamente escatológica, ou como abrangendo também juízos históricos presentes.
  rationale: O grego afirma a justiça da retribuição divina, mas esta cláusula isolada não resolve plenamente quando nem como ela se realiza; a tradução mantém essa abertura.
- issue: Força de εἴπερ
  choice: 'Traduzir como premissa assumida: “visto que”.'
  alternative: 'Traduzir de modo formalmente condicional: “se de fato”.'
  rationale: No contexto, a condição tem força retórica e pressupõe a justiça de Deus, mas a alternativa é registrada em nota para preservar a forma possível do grego.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Vocês” torna explícito o plural de ὑμᾶς; a repetição “afligem/aflição” reproduz deliberadamente o vínculo lexical do grego.
