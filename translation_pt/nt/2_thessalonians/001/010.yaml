  text: ὅταν ἔλθῃ ἐνδοξασθῆναι ἐν τοῖς ἁγίοις αὐτοῦ καὶ θαυμασθῆναι ἐν πᾶσιν τοῖς πιστεύσασιν, ὅτι ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ’ ὑμᾶς, ἐν τῇ ἡμέρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/010.yaml
  text: on that day when he comes to be glorified among his saints and to be marveled at among all who have believed[b][a], because our testimony to you was believed.
translation:
  language: pt
  text: naquele dia, quando ele vier para ser glorificado entre os seus santos[a] e admirado entre todos os que creram, porque vocês creram no nosso testemunho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos seus santos”. A preposição grega pode indicar tanto que ele será glorificado entre o seu povo santo como que a sua glória será manifestada neles.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, conservando mais de perto a ordem grega: “quando ele vier para ser glorificado entre os seus santos e admirado entre todos os que creram, porque vocês creram no nosso testemunho, naquele dia”.'
    reason: word_order_alternative
lexical_decisions:
- source_word: ὅταν ἔλθῃ
  choice: quando ele vier
  rationale: A construção temporal com o subjuntivo aponta aqui para um acontecimento futuro definido; esta é a formulação natural em português.
- source_word: ἐνδοξασθῆναι
  choice: para ser glorificado
  rationale: O infinitivo passivo exprime propósito ou resultado e preserva o sentido forte de manifestação e reconhecimento da glória.
- source_word: ἐν τοῖς ἁγίοις αὐτοῦ
  choice: entre os seus santos
  rationale: “Entre” comunica naturalmente o cenário coletivo, enquanto “santos” mantém o uso paulino estabelecido; a possível nuance “nos seus santos” é preservada em nota.
- source_word: θαυμασθῆναι
  choice: admirado
  rationale: O infinitivo passivo paralelo denota assombro e admiração diante de Cristo; “admirado” é corrente e digno em português.
- source_word: ἐν πᾶσιν τοῖς πιστεύσασιν
  choice: entre todos os que creram
  rationale: Preserva a força verbal do particípio e o paralelismo das duas expressões introduzidas por ἐν.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão pela qual os destinatários estão incluídos entre os que creram.
- source_word: ἐπιστεύθη
  choice: foi crido
  rationale: Mantém a voz passiva do grego e a ligação lexical com “os que creram”, embora a expressão seja deliberadamente mais formal.
- source_word: τὸ μαρτύριον ἡμῶν
  choice: o nosso testemunho
  rationale: Designa o testemunho ou a proclamação apostólica de modo direto e tradicional.
- source_word: ἐφ’ ὑμᾶς
  choice: a vocês
  rationale: Expressa a direção do testemunho aos tessalonicenses em português amplamente compreensível.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: naquele dia
  rationale: É a expressão temporal idiomática e preserva a solenidade escatológica.
theological_decisions:
- issue: Referente e força de “os seus santos” no contexto escatológico
  choice: “entre os seus santos”, entendidos no contexto imediato como o povo santo de Cristo
  alternative: “nos seus santos”, destacando que a glória de Cristo se manifesta neles; ou “entre os seus seres santos”, admitindo referente celestial
  rationale: O paralelismo com “todos os que creram” favorece a referência aos fiéis. A tradução principal evita impor uma nuance mística ou instrumental, enquanto a nota preserva a ambiguidade real de ἐν.
- issue: Sentido de πιστεύσασιν e ἐπιστεύθη em relação à proclamação apostólica
  choice: 'Manter em ambos os casos a linguagem de crer: “os que creram” e “foi crido”'
  alternative: “os que confiaram” e “foi acolhido com fé”
  rationale: A repetição conserva a ligação lexical do grego e não acrescenta uma definição doutrinária específica ao ato de crer.
- issue: Posição de “naquele dia”
  choice: Colocada no início para enquadrar toda a oração temporal
  alternative: Conservá-la no final, seguindo a ordem do grego
  rationale: A posição inicial é mais natural em português e torna clara a relação com a vinda, sem mudar o alcance escatológico da expressão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Santos” conserva a terminologia paulina tradicional; “a vocês” evita regionalismo excessivo. A forma “foi crido” é formal, mas foi mantida para reproduzir a voz passiva e a repetição lexical do grego.
