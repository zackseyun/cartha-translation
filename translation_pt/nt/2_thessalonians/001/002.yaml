id: 2TH.1.2
reference: 2 Thessalonians 1:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: pt
  text: Graça e paz a vocês, da parte de Deus Pai e do Senhor Jesus, o Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Jesus Cristo”. O título grego Χριστός pode ser traduzido como “Cristo” ou “Messias”; aqui, “Messias” explicita o sentido do título.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: graça
  rationale: Preserva tanto a fórmula de saudação paulina quanto o peso teológico característico do termo.
- source_word: ὑμῖν
  choice: a vocês
  rationale: É a forma natural e amplamente compreensível de expressar o dativo nessa fórmula de bênção em português moderno.
- source_word: εἰρήνη
  choice: paz
  rationale: Tradução consagrada que mantém o sentido de paz, integridade e bem-estar.
- source_word: ἀπὸ
  choice: da parte de
  rationale: Expressa com naturalidade em português a origem da graça e da paz.
- source_word: θεοῦ πατρὸς
  choice: Deus Pai
  rationale: O texto grego impresso não contém ἡμῶν ('nosso'); em português, 'Deus Pai' é natural e evita acrescentar um possessivo desnecessário.
- source_word: κυρίου
  choice: Senhor
  rationale: Mantém a força titular de κύριος e seu uso neotestamentário estabelecido.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título e torna essa função clara e idiomática em português.
theological_decisions:
- issue: Ausência de ἡμῶν ('nosso') depois de θεοῦ πατρὸς no texto grego impresso
  choice: Deus Pai
  alternative: Deus, nosso Pai
  rationale: Ao contrário do inglês, o português permite a construção natural 'Deus Pai'. Assim, não é necessário suprir 'nosso', e a tradução acompanha mais diretamente a evidência textual apresentada.
- issue: Sentido de Χριστός em Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: A opção principal explicita o significado titular de Χριστός sem negar que 'Cristo' seja a forma tradicional e lexicalmente válida.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A construção nominal conserva a concisão da saudação grega; a vírgula em 'Jesus, o Messias' evidencia que 'Messias' funciona como título.
