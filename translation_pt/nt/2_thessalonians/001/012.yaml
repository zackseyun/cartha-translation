id: 2TH.1.12
reference: 2 Thessalonians 1:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅπως ἐνδοξασθῇ τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν ὑμῖν, καὶ ὑμεῖς ἐν αὐτῷ, κατὰ τὴν χάριν τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/012.yaml
  text: so that the name of our Lord Jesus may be glorified in you[a], and you in him[c][b], according to the grace of our God and the Lord Jesus the Messiah.
translation:
  language: pt
  text: para que o nome de nosso Senhor Jesus seja glorificado em vocês[a], e vocês nele, segundo a graça de nosso Deus e do Senhor Jesus, o Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre vocês”. A preposição grega pode ter os dois matizes neste contexto.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega final pode ser entendida como ligando estreitamente “nosso Deus” e “Senhor Jesus, o Messias” numa só designação, ou como se referindo distintamente a “nosso Deus” e ao “Senhor Jesus, o Messias”. A tradução não pretende resolver essa questão.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: para que
  rationale: Introduz o propósito ou resultado pretendido da oração anterior e preserva naturalmente a força télica.
- source_word: ἐνδοξασθῇ
  choice: seja glorificado
  rationale: Preserva a voz passiva, o modo subjuntivo e o peso teológico da linguagem de glória.
- source_word: τὸ ὄνομα
  choice: o nome
  rationale: Mantém a formulação do grego, inclusive seu possível sentido metonímico de identidade e reputação reveladas.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: de nosso Senhor Jesus
  rationale: É uma ordem natural em português e conserva o título κύριος.
- source_word: ἐν ὑμῖν
  choice: em vocês
  rationale: Reproduz diretamente ἐν com o plural; a possível nuance corporativa de 'entre vocês' é registrada em nota.
- source_word: καὶ ὑμεῖς ἐν αὐτῷ
  choice: e vocês nele
  rationale: Conserva o paralelismo recíproco. O masculino 'nele' remete mais naturalmente ao Senhor Jesus.
- source_word: κατὰ τὴν χάριν
  choice: segundo a graça
  rationale: Expressa padrão ou fundamento sem reduzir κατά a um sentido meramente instrumental.
- source_word: χάριν
  choice: graça
  rationale: É o equivalente paulino estabelecido para χάρις e preserva sua densidade teológica.
- source_word: τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: de nosso Deus e Senhor Jesus, o Messias
  rationale: Mantém a construção grega compacta e a ligação sintática estreita entre os títulos, sem inserir um artigo que imponha dois referentes. Χριστοῦ é vertido como título em português idiomático.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: o Messias
  alternative: Cristo
  rationale: Aqui Χριστός funciona como título; 'o Messias' explicita seu sentido em português corrente sem alterar o referente.
- issue: Referente de αὐτῷ
  choice: nele, isto é, no Senhor Jesus
  alternative: nisso, isto é, no nome
  rationale: O pronome masculino e o padrão recíproco de glorificação favorecem a referência ao próprio Senhor Jesus, embora a proximidade de 'nome' torne concebível a alternativa formal.
- issue: Força da expressão genitiva final
  choice: 'construção estreitamente ligada: ''de nosso Deus e Senhor Jesus, o Messias'''
  alternative: 'dois referentes expressos: ''de nosso Deus e do Senhor Jesus, o Messias'''
  rationale: A presença de um só artigo no grego antes de θεοῦ e a coordenação com καί favorecem a ligação estreita. A tradução conserva a forma compacta e a nota reconhece a leitura distinta sem resolver silenciosamente a tensão cristológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com 'vocês' para o plural de segunda pessoa. A formulação preserva o paralelismo do grego, emprega 'Messias' como título e evita vocabulário denominacional.
