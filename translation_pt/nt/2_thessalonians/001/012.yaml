  naturalness: O português é moderno, claro e apropriado ao registro epistolar. «Vocês» é uma escolha amplamente compreensível. A inclusão de «do» antes de «Senhor Jesus» torna a coordenação mais natural e evita que a sintaxe portuguesa atribua automaticamente ambos os títulos a Jesus.
  terminology: «Senhor», «graça» e «Messias» são adequados. «Jesus, o Messias» expressa naturalmente o valor titular de Χριστός em português.
