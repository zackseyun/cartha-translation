id: 2TH.1.1
reference: 2 Thessalonians 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God our Father and the Lord Jesus the Messiah:'
translation:
  language: pt
  text: Paulo, Silvano e Timóteo, à igreja dos tessalonicenses em Deus, nosso Pai, e no Senhor Jesus, o Messias:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Jesus Cristo”. O título grego Χριστός pode ser traduzido como “Messias” ou, de modo mais tradicional, como “Cristo”.
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Paulo
  rationale: Forma portuguesa consagrada do nome pessoal grego Παῦλος.
- source_word: Σιλουανὸς
  choice: Silvano
  rationale: Transliteração portuguesa direta de Σιλουανός, sem harmonizá-lo com a forma abreviada Silas encontrada em Atos.
- source_word: Τιμόθεος
  choice: Timóteo
  rationale: Forma portuguesa consagrada do nome pessoal Τιμόθεος.
- source_word: ἐκκλησίᾳ
  choice: igreja
  rationale: Equivalente natural no uso epistolar paulino para a comunidade cristã reunida.
- source_word: Θεσσαλονικέων
  choice: dos tessalonicenses
  rationale: Preserva o genitivo plural referente ao povo, em vez de convertê-lo na expressão locativa 'em Tessalônica'.
- source_word: ἐν
  choice: em
  rationale: Mantém a formulação teológica condensada de Paulo, sem decidir entre esfera, união, fundamento ou pertencimento.
- source_word: θεῷ πατρὶ ἡμῶν
  choice: Deus, nosso Pai
  rationale: Preserva o pronome possessivo ἡμῶν e usa pontuação natural em português para a aposição.
- source_word: κυρίῳ
  choice: Senhor
  rationale: Título português tradicional e semanticamente adequado para κύριος aplicado a Jesus.
- source_word: Χριστῷ
  choice: o Messias
  rationale: Traduz o título Χριστός em vez de tratá-lo apenas como parte de um nome; o artigo torna a expressão idiomática em português.
theological_decisions:
- issue: Tradução de Χριστῷ na sequência Ἰησοῦ Χριστῷ
  choice: o Messias
  alternative: Cristo
  rationale: O título é traduzido para conservar seu conteúdo messiânico; a forma tradicional 'Cristo' permanece registrada como alternativa legítima.
- issue: Relação expressa por ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ
  choice: em Deus, nosso Pai, e no Senhor Jesus, o Messias
  alternative: pertencente a Deus, nosso Pai, e ao Senhor Jesus, o Messias
  rationale: A tradução mantém ἐν de modo formalmente aberto, preservando a possível tensão entre esfera, união, fundamento e pertencimento, sem explicá-la em excesso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação dos três remetentes foi vertida naturalmente sem repetir 'e' antes de cada nome. As vírgulas em 'Deus, nosso Pai' e 'Jesus, o Messias' assinalam aposições e evitam construções pouco idiomáticas.
