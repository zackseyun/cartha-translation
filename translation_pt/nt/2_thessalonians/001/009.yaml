review_pass:
  verdict: revise
  source_fidelity: A construção grega δίκην τίσουσιν ὄλεθρον αἰώνιον expressa que os referidos sofrerão/incorrerão em uma pena, a saber, destruição eterna. A redação proposta explicita melhor essa relação com “pena de eterna destruição”. “Longe da presença” preserva a leitura principal de ἀπό como separação, enquanto a nota mantém adequadamente a leitura alternativa de origem.
  naturalness: “Sofrerão a pena da destruição eterna” pode sugerir que se sofre uma pena causada pela destruição, em vez de que a própria destruição é a pena. “Sofrerão a pena de eterna destruição” é mais claro, natural e mantém registro bíblico moderno. “Longe da presença” é idiomático e evita transformar a relação preposicional em um particípio explicativo (“afastados”).
  terminology: “Senhor”, “glória”, “poder” e “destruição eterna” são escolhas adequadas e consistentes. A formulação não especifica a natureza metafísica da destruição nem resolve a ambiguidade de ἀπό.
  issues:
  - severity: medium
    issue: Relação sintática pouco clara em “a pena da destruição eterna”.
    rationale: O acusativo ὄλεθρον αἰώνιον especifica a pena que será sofrida. Em português, “pena da destruição” pode inverter ou obscurecer essa relação. “Pena de eterna destruição” a comunica com maior precisão.
  - severity: low
    issue: “Afastados” torna a leitura de separação mais parafrástica.
    rationale: Embora compatível com a leitura principal, “longe da presença” traduz mais diretamente o valor separativo de ἀπό e se harmoniza melhor com a alternativa de origem preservada na nota.
  revised_text: Eles sofrerão a pena de eterna destruição[a], longe da presença do Senhor e da glória do seu poder,
  revised_footnotes:
  - marker: a
    text: 'Ou, possivelmente: “destruição que vem da presença do Senhor e da glória do seu poder”. A preposição grega pode indicar tanto separação (“longe de”) quanto origem (“que vem de”).'
    reason: alternative_reading
  revision_rationale: A revisão esclarece que “eterna destruição” é o conteúdo da penalidade judicial, preserva a leitura principal de separação em ἀπό com expressão portuguesa idiomática e mantém em nota a alternativa gramaticalmente possível de origem. A vírgula final é conservada, pois a oração prossegue no versículo seguinte.
