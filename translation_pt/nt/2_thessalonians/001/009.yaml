id: 2TH.1.9
reference: 2 Thessalonians 1:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἵτινες δίκην τίσουσιν ὄλεθρον αἰώνιον ἀπὸ προσώπου τοῦ κυρίου καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/009.yaml
  text: These will pay the penalty of eternal destruction[a], away from the presence of the Lord and from the glory of his might,
translation:
  language: pt
  text: Eles sofrerão a pena de eterna destruição[a], longe da presença do Senhor e da glória do seu poder,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “destruição que vem da presença do Senhor e da glória do seu poder”. A preposição grega pode indicar tanto separação (“longe de”) quanto origem (“que vem de”).'
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: Eles
  rationale: Retoma naturalmente, em português, os perseguidores mencionados no versículo anterior, sem forçar a nuance qualitativa do pronome grego.
- source_word: δίκην τίσουσιν
  choice: sofrerão a pena
  rationale: A expressão grega indica incorrer numa penalidade judicial. Esta formulação preserva o sentido jurídico e soa natural em português.
- source_word: ὄλεθρον
  choice: destruição
  rationale: Mantém a gravidade do termo no contexto de juízo sem definir, por si só, a natureza precisa da punição final.
- source_word: αἰώνιον
  choice: eterna
  rationale: Neste contexto escatológico, expressa de modo natural a duração ou finalidade permanente do juízo.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: afastados da presença do Senhor
  rationale: Interpreta ἀπό como separação ou exclusão; traduz πρόσωπον idiomaticamente por 'presença', em vez do literal 'rosto'.
- source_word: καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ
  choice: e da glória do seu poder
  rationale: '''Glória'' representa δόξα, e ''poder'' comunica ἰσχύς de maneira clara e digna no português atual.'
theological_decisions:
- issue: Sentido de ἀπό em relação ao juízo final
  choice: 'separação/exclusão: ''afastados da presença do Senhor'''
  alternative: 'origem: ''destruição que vem da presença do Senhor e da glória do seu poder'''
  rationale: ἀπό pode indicar tanto separação quanto origem. A leitura de exclusão é contextualmente forte, mas a leitura de origem também é gramaticalmente possível e, por isso, é preservada em nota.
- issue: Implicação de 'destruição eterna'
  choice: manter a expressão sem especificar o modo da punição final
  alternative: entendê-la especificamente como aniquilação ou como tormento consciente eterno
  rationale: A expressão grega declara a penalidade, mas não resolve sozinha o debate doutrinário mais amplo sobre a natureza exata do castigo final.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Sofrerão a pena' evita a construção menos idiomática 'pagarão a pena'; 'poder' é mais corrente que 'força' ou 'pujança' neste contexto. A vírgula final foi mantida porque o versículo continua sintaticamente no versículo 10.
