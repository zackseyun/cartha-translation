source:
  edition: SBLGNT
  text: ἔνδειγμα τῆς δικαίας κρίσεως τοῦ θεοῦ, εἰς τὸ καταξιωθῆναι ὑμᾶς τῆς βασιλείας τοῦ θεοῦ, ὑπὲρ ἧς καὶ πάσχετε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/005.yaml
  text: This is evidence of the righteous judgment of God[a], so that you may be counted worthy of the kingdom of God, for which you are also suffering[c][b],
translation:
  language: pt
  text: Isso é evidência do justo julgamento de Deus[a], para que vocês sejam considerados dignos do reino de Deus[b], pelo qual também estão sofrendo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prova” ou “sinal” do justo julgamento de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “para vocês serem considerados dignos” ou “resultando em que vocês sejam considerados dignos”. A construção grega pode expressar propósito ou resultado.
    reason: alternative_reading
  - marker: c
    text: Ou “por causa do qual”, “em favor do qual” ou “por amor do qual”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειγμα
  choice: evidência
  rationale: O termo designa algo que demonstra ou aponta para uma realidade. “Evidência” conserva essa força sem afirmar necessariamente uma prova conclusiva. O verbo e o sujeito demonstrativo são supridos em português porque o grego apresenta um fragmento sem verbo, ligado ao versículo anterior.
- source_word: δικαίας κρίσεως
  choice: justo julgamento
  rationale: A expressão transmite tanto o ato judicial quanto sua qualidade moral. Esta ordem é natural em português e mantém a associação direta com Deus.
- source_word: εἰς τὸ καταξιωθῆναι
  choice: para que vocês sejam considerados dignos
  rationale: A construção com εἰς e infinitivo articular pode indicar propósito ou resultado. O passivo de καταξιόω significa ser considerado ou reconhecido como digno, não tornar-se intrinsecamente digno.
- source_word: βασιλείας τοῦ θεοῦ
  choice: reino de Deus
  rationale: Tradução direta e consagrada da expressão, clara para leitores modernos.
- source_word: ὑπὲρ ἧς
  choice: pelo qual
  rationale: ὑπέρ com genitivo pode significar “por causa de”, “em favor de” ou “por amor de”. “Pelo qual” liga naturalmente o sofrimento ao reino sem eliminar essa amplitude semântica.
- source_word: καὶ πάσχετε
  choice: também estão sofrendo
  rationale: A forma progressiva comunica o caráter presente e contínuo do sofrimento no contexto, e “também” representa καί.
theological_decisions:
- issue: Relação entre o sofrimento e ser considerado digno do reino
  choice: O sofrimento dos destinatários está ligado ao justo julgamento de Deus e ao propósito ou resultado de eles serem considerados dignos do reino.
  alternative: O sofrimento conquista ou merece a entrada no reino.
  rationale: O passivo καταξιωθῆναι fala de serem considerados dignos, não declara que o sofrimento produza mérito. A tradução mantém a ligação forte estabelecida pelo texto sem convertê-la numa doutrina de mérito.
- issue: Valor sintático de εἰς τὸ com o infinitivo
  choice: 'A tradução principal usa linguagem de propósito: “para que”.'
  alternative: 'A construção pode expressar resultado: “tendo como resultado que”.'
  rationale: As duas relações são gramaticalmente possíveis; a nota preserva a ambiguidade legítima do grego.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Vocês” evita uma forma regional marcada; “reino” permanece em minúscula como substantivo comum. A frase explicita “Isso é”, necessário em português devido à dependência contextual do fragmento grego.
