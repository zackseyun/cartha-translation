id: 2TH.1.11
reference: 2 Thessalonians 1:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ προσευχόμεθα πάντοτε περὶ ὑμῶν, ἵνα ὑμᾶς ἀξιώσῃ τῆς κλήσεως ὁ θεὸς ἡμῶν καὶ πληρώσῃ πᾶσαν εὐδοκίαν ἀγαθωσύνης καὶ ἔργον πίστεως ἐν δυνάμει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/011.yaml
  text: To this end also we always pray for you[a], that our God may count you worthy of the calling and may fulfill every good resolve and work of faith with power[c][b],
translation:
  language: pt
  text: Com esse fim, também oramos sempre por vocês, para que o nosso Deus os considere dignos do chamado[a] e realize plenamente, com poder, todo bom propósito[b] e toda obra de fé[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os torne dignos do chamado”. O verbo grego pode significar tanto “considerar dignos” como “tornar dignos”.
    reason: alternative_reading
  - marker: b
    text: Ou “todo propósito de bondade” ou “todo desejo de fazer o bem”.
    reason: lexical_alternative
  - marker: c
    text: “Obra de fé” também pode ser entendida como “obra produzida pela fé”; neste contexto, “fé” também pode ser traduzida como “fidelidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Com esse fim
  rationale: Retoma o que foi dito anteriormente e conserva a ideia de finalidade, em português natural.
- source_word: καὶ
  choice: também
  rationale: Expressa o valor aditivo e enfático da partícula sem exagerá-lo.
- source_word: προσευχόμεθα πάντοτε περὶ ὑμῶν
  choice: oramos sempre por vocês
  rationale: Comunica a ação habitual indicada pelo presente com πάντοτε e emprega a formulação corrente em português.
- source_word: ἵνα
  choice: para que
  rationale: Mantém tanto a nuance de finalidade quanto o conteúdo da oração.
- source_word: ἀξιώσῃ
  choice: considere dignos
  rationale: Preserva o sentido avaliativo possível do verbo sem excluir a alternativa causativa, registrada em nota.
- source_word: τῆς κλήσεως
  choice: do chamado
  rationale: Mantém o artigo definido e não acrescenta um possessivo ausente no grego.
- source_word: ὁ θεὸς ἡμῶν
  choice: o nosso Deus
  rationale: Conserva o possessivo explícito no texto-fonte.
- source_word: πληρώσῃ
  choice: realize plenamente
  rationale: Expressa a ideia de levar à realização ou ao cumprimento os propósitos e as obras mencionados.
- source_word: πᾶσαν εὐδοκίαν ἀγαθωσύνης
  choice: todo bom propósito
  rationale: εὐδοκία pode indicar propósito, desejo ou beneplácito; a formulação é natural e comunica um propósito caracterizado pela bondade, sem eliminar alternativas legítimas.
- source_word: ἔργον πίστεως
  choice: toda obra de fé
  rationale: Conserva a formulação compacta e a relação genitiva aberta do original, que pode indicar uma obra decorrente da fé.
- source_word: πίστεως
  choice: fé
  rationale: É o equivalente contextual mais direto de πίστις, enquanto a possibilidade de 'fidelidade' é preservada em nota.
- source_word: ἐν δυνάμει
  choice: com poder
  rationale: Indica o modo ou meio poderoso pelo qual Deus realiza plenamente o que foi mencionado.
theological_decisions:
- issue: Sentido de ἀξιώσῃ em relação ao chamado divino
  choice: considere dignos do chamado
  alternative: torne dignos do chamado
  rationale: O verbo admite tanto uma nuance avaliativa quanto causativa. O texto principal adota a primeira, mas a segunda é preservada em nota para não resolver silenciosamente a tensão.
- issue: Sentido de πίστις em ἔργον πίστεως
  choice: fé
  alternative: fidelidade
  rationale: “Fé” é o equivalente principal, mas o contexto também permite entender a expressão como obra decorrente da fé ou marcada pela fidelidade.
- issue: Relação de ἐν δυνάμει com os objetos de πληρώσῃ
  choice: com poder, ligado à ação divina de realizar plenamente
  alternative: posição final, com possível alcance mais próximo sobre a obra de fé
  rationale: A posição adotada em português torna clara a ligação com o verbo principal, sem negar que a ordem grega permita ao leitor perceber associação especial com a expressão final.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para legibilidade brasileira. A sintaxe foi ajustada para fluência sem acrescentar possessivos ou explicações ausentes no grego. As ambiguidades relevantes foram mantidas no texto ou registradas em notas.
