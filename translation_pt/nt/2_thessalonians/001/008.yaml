  text: ἐν ⸂φλογὶ πυρός⸃, διδόντος ἐκδίκησιν τοῖς μὴ εἰδόσι θεὸν καὶ τοῖς μὴ ὑπακούουσιν τῷ εὐαγγελίῳ τοῦ κυρίου ἡμῶν Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/008.yaml
  text: in flaming fire[a], inflicting vengeance on those who do not know God and on those who do not obey the gospel of our Lord Jesus[b],
translation:
  language: pt
  text: em chama de fogo[a], infligindo vingança[b] sobre os que não conhecem a Deus e sobre os que não obedecem ao evangelho de nosso Senhor Jesus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em fogo flamejante”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aplicando retribuição”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν φλογὶ πυρός
  choice: em fogo flamejante
  rationale: Reproduz de modo natural a imagem vívida e intensificada da expressão grega, que se liga à revelação do Senhor mencionada no versículo anterior.
- source_word: διδόντος ἐκδίκησιν
  choice: exercendo vingança
  rationale: O sentido literal de διδόντος é “dando”, mas, em combinação com ἐκδίκησιν, a expressão indica executar ou aplicar uma resposta judicial. “Exercendo vingança” é idiomático e mantém a força ativa do original.
- source_word: τοῖς μὴ εἰδόσι θεὸν
  choice: os que não conhecem a Deus
  rationale: O particípio de οἶδα tem sentido presente e descreve o estado daqueles que não conhecem a Deus.
- source_word: τοῖς μὴ ὑπακούουσιν
  choice: os que não obedecem
  rationale: Traduz diretamente a ideia de não atender ou não obedecer, sem acrescentar a noção explícita de recusa deliberada.
- source_word: τῷ εὐαγγελίῳ
  choice: ao evangelho
  rationale: “Evangelho” é a tradução tradicional, precisa e amplamente compreendida do termo no contexto paulino.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: de nosso Senhor Jesus
  rationale: Mantém o título κύριος e expressa em ordem natural a relação genitiva do grego.
theological_decisions:
- issue: Natureza de ἐκδίκησις no juízo divino
  choice: vingança
  alternative: retribuição; punição judicial
  rationale: O termo designa uma ação judicial executada pelo Senhor revelado. “Vingança” preserva a severidade e a tensão teológica do texto, sem reduzir a ação a uma reação emocional humana.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A construção participial preserva a ligação sintática com o Senhor Jesus no contexto anterior, e a repetição de “sobre os que” mantém claros os dois grupos coordenados.
