id: 2TH.3.6
reference: 2 Thessalonians 3:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ Χριστοῦ στέλλεσθαι ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ ἀτάκτως περιπατοῦντος καὶ μὴ κατὰ τὴν παράδοσιν ἣν ⸀παρελάβοσαν παρ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/006.yaml
  text: We command you[a], brothers, in the name of our Lord Jesus the Messiah[e][d][c][b], to keep away from every brother who is walking disorderly and not according to the tradition that they received from us.
translation:
  language: pt
  text: Nós lhes ordenamos, irmãos[a], em nome de nosso Senhor Jesus, o Messias[b], que se afastem[c] de todo irmão que vive de maneira indisciplinada[d] e não de acordo com a tradição que eles receberam de nós.[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” traduz o masculino plural ἀδελφοί; Paulo se dirige à igreja como um todo.
    reason: lexical_alternative
  - marker: b
    text: “Messias” também pode ser traduzido por “Cristo”.
    reason: alternative_reading
  - marker: c
    text: Ou “que se retirem da convivência com”; o grego indica manter distância da associação próxima.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “que anda de maneira indisciplinada”; “andar” é uma metáfora para o modo de viver. Neste contexto, “ociosamente” também é possível.
    reason: lexical_alternative
  - marker: e
    text: Alguns manuscritos trazem “que vocês receberam de nós” ou “que ele recebeu de nós”, harmonizando a frase com “todo irmão”. O texto impresso traz “que eles receberam de nós”.
    reason: textual_variant
lexical_decisions:
- source_word: Παραγγέλλομεν
  choice: Nós lhes ordenamos
  rationale: O verbo παραγγέλλω expressa uma determinação dada com autoridade; “ordenamos” preserva essa força melhor do que “aconselhamos” ou “instruímos”.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém o vocativo masculino plural e a linguagem familiar da comunidade cristã; uma nota esclarece que a igreja inteira está sendo interpelada.
- source_word: ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: em nome de nosso Senhor Jesus, o Messias
  rationale: “Em nome de” preserva a fórmula solene e sua ideia de autoridade. Χριστός é traduzido como o título “Messias”, em português idiomático com artigo e aposto.
- source_word: στέλλεσθαι ὑμᾶς ἀπὸ
  choice: que se afastem de
  rationale: A forma média com ἀπό indica que os destinatários devem manter distância ou retirar-se da convivência próxima, sem transformar a expressão em um termo técnico de expulsão formal.
- source_word: παντὸς ἀδελφοῦ
  choice: de todo irmão
  rationale: Preserva o singular masculino e a linguagem de parentesco usada para um membro da comunidade.
- source_word: ἀτάκτως περιπατοῦντος
  choice: que vive de maneira indisciplinada
  rationale: “Vive” comunica naturalmente a metáfora de περιπατέω sobre a conduta habitual, enquanto “de maneira indisciplinada” conserva o sentido amplo de ἀτάκτως sem restringi-lo desde já à ociosidade.
- source_word: μὴ κατὰ τὴν παράδοσιν
  choice: e não de acordo com a tradição
  rationale: παράδοσις é aquilo que foi transmitido; “tradição” é a correspondência direta, e o próprio versículo identifica sua origem apostólica.
- source_word: ἣν παρελάβοσαν παρ’ ἡμῶν
  choice: que eles receberam de nós
  rationale: A forma παρελάβοσαν do texto impresso é terceira pessoa do plural. O pronome “eles” torna explícita essa leitura, apesar da mudança inesperada do singular “todo irmão” para o plural.
theological_decisions:
- issue: Tradução de Χριστοῦ no título cristológico
  choice: o Messias
  alternative: Cristo
  rationale: Aqui Χριστός funciona como título. “O Messias” preserva seu conteúdo titular, enquanto a nota registra a forma tradicional “Cristo”.
- issue: Alcance da separação ordenada por στέλλεσθαι ὑμᾶς ἀπὸ
  choice: que se afastem de
  alternative: que se retirem da convivência com
  rationale: A tradução mantém a força disciplinar e relacional da ordem sem especificar uma expulsão eclesiástica formal que o verbo, por si só, não exige.
- issue: Sentido de ἀτάκτως no contexto
  choice: de maneira indisciplinada
  alternative: ociosamente
  rationale: O contexto posterior relaciona a conduta à ociosidade, mas o termo neste versículo possui alcance mais amplo. A tradução preserva essa amplitude sem apagar a ligação contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A colocação pronominal “lhes ordenamos” e o subjuntivo “que se afastem” evitam rigidez excessiva. A metáfora grega de “andar” é expressa no texto como “viver” e preservada em nota. O conectivo δέ, de baixa intensidade, não recebe um “agora” temporal inexistente; a transição é comunicada naturalmente pelo início da ordem.
