  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου, ὅ ἐστιν σημεῖον ἐν πάσῃ ἐπιστολῇ· οὕτως γράφω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/017.yaml
  text: The greeting is by my own hand—Paul's—which is a sign in every letter[a]; this is how I write.
translation:
  language: pt
  text: A saudação é de meu próprio punho — Paulo —, e isso é um sinal em cada carta[a]. É assim que escrevo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A saudação, de meu próprio punho — Paulo —, é um sinal em cada carta; assim escrevo.”'
    reason: Alternativa sintática que mantém a ligação mais direta entre a saudação autógrafa e o sinal, bem como a formulação concisa de οὕτως γράφω.
lexical_decisions:
- source_word: ἀσπασμὸς
  choice: A saudação
  rationale: No contexto epistolar, ἀσπασμός designa a saudação; esta é a opção mais natural e amplamente compreensível em português moderno.
- source_word: τῇ ἐμῇ χειρὶ
  choice: de próprio punho
  rationale: A expressão idiomática portuguesa comunica que esta parte foi escrita pessoalmente pela mão de Paulo, sem sugerir que ele tenha redigido necessariamente toda a carta.
- source_word: Παύλου
  choice: de mim, Paulo
  rationale: O genitivo identifica Paulo como autor do trecho manuscrito. A formulação em aposição preserva a autodeclaração do original e soa natural em português.
- source_word: ὅ ἐστιν σημεῖον
  choice: e isso é um sinal
  rationale: O pronome relativo retoma a saudação autógrafa. A coordenação com “isso” evita uma sequência pesada de relativas e mantém a referência clara.
- source_word: ἐν πάσῃ ἐπιστολῇ
  choice: em cada carta
  rationale: “Carta” é corrente e menos eclesiástico que “epístola”. “Cada” expressa naturalmente a prática recorrente indicada pelo singular distributivo πᾶς.
- source_word: οὕτως γράφω
  choice: É assim que escrevo
  rationale: Preserva o valor modal provável de οὕτως e a referência à maneira de Paulo escrever, sem explicitar além do texto a função autenticadora.
theological_decisions:
- issue: Alcance da fórmula autógrafa de Paulo
  choice: A saudação escrita de próprio punho é apresentada como sinal recorrente nas cartas de Paulo.
  alternative: 'A frase final pode referir-se mais estritamente ao ato presente: “Assim escrevo”.'
  rationale: O contexto e “um sinal em cada carta” favorecem a ideia de identificação ou autenticação pelo trecho autógrafo, mas a tradução não transforma essa inferência em explicação doutrinária e a nota preserva a leitura mais literal da frase final.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “De próprio punho” é idiomático e preciso; os travessões destacam a identificação pessoal de Paulo. A nota registra a ambiguidade sintática e o valor possível de οὕτως sem sobrecarregar o texto principal.
