  text: πεποίθαμεν δὲ ἐν κυρίῳ ἐφ’ ὑμᾶς, ὅτι ἃ ⸀παραγγέλλομεν καὶ ποιεῖτε καὶ ποιήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/004.yaml
  text: And we have confidence in the Lord about you, that you are doing and will do what we command.
translation:
  language: pt
  text: 'Mas temos confiança no Senhor a respeito de vocês: vocês fazem e farão o que ordenamos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεποίθαμεν
  choice: temos confiança
  rationale: 'Expressa de modo natural o perfeito grego com sentido presente e contínuo: uma confiança estabelecida que permanece.'
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Preserva a formulação paulina e situa no Senhor, e não meramente nos destinatários, o fundamento ou âmbito da confiança.
- source_word: ἐφ’ ὑμᾶς
  choice: a respeito de vocês
  rationale: Comunica naturalmente que a confiança diz respeito aos leitores, sem sugerir que ela esteja fundada neles.
- source_word: παραγγέλλομεν
  choice: ordenamos
  rationale: Mantém a força de instrução autorizada do verbo, adequada ao contexto das orientações apostólicas da carta.
- source_word: ποιεῖτε καὶ ποιήσετε
  choice: estão fazendo e continuarão a fazer
  rationale: Representa o presente em curso e entende o futuro como continuidade da obediência, em português corrente.
theological_decisions:
- issue: Fundamento da confiança apostólica
  choice: “no Senhor” permanece ligado a “temos confiança”
  alternative: Ler a expressão principalmente como confiança nos leitores por causa do Senhor
  rationale: A tradução preserva a construção grega e deixa aberta a extensão exata da expressão, ao mesmo tempo que evita transferir silenciosamente o fundamento da confiança do Senhor para os destinatários.
- issue: Força de παραγγέλλομεν
  choice: “ordenamos”
  alternative: “instruímos” ou “recomendamos”
  rationale: O contexto imediato usa linguagem apostólica de comando; “ordenamos” preserva essa força sem acrescentar uma teoria denominacional sobre autoridade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Vocês” evita regionalismo excessivo; “continuarão a fazer” explicita de modo idiomático a relação entre o presente ποιεῖτε e o futuro ποιήσετε.
