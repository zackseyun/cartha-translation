  text: καὶ ἵνα ῥυσθῶμεν ἀπὸ τῶν ἀτόπων καὶ πονηρῶν ἀνθρώπων, οὐ γὰρ πάντων ἡ πίστις.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/002.yaml
  text: and that we may be delivered from wicked and evil men[b][a], for not all have faith.
translation:
  language: pt
  text: e para que sejamos livrados de homens perversos[a] e maus, pois nem todos têm fé.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “homens insensatos e maus”. O adjetivo grego pode significar “impróprios”, “absurdos” ou “insensatos” e, neste contexto, descreve adversários de conduta moralmente desviada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois nem todos são fiéis”. Literalmente, o grego diz: “pois não é de todos a fé”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ῥυσθῶμεν
  choice: sejamos livres
  rationale: O aoristo passivo do subjuntivo depois de ἵνα expressa finalidade. “Sejamos livres” comunica de modo natural a ideia de ser resgatado do poder ou da ação de pessoas hostis, sem especificar o meio.
- source_word: ἀτόπων
  choice: perversos
  rationale: Ἄτοπος pode indicar aquilo que é impróprio, absurdo, desatinado ou moralmente perverso. No contexto de adversários hostis e em combinação com πονηρῶν, “perversos” expressa a conduta desviada sem repetir simplesmente “maus”; a alternativa lexical é preservada em nota.
- source_word: πονηρῶν
  choice: maus
  rationale: Termo moral comum para aquilo que é mau ou maligno. “Maus” é claro, atual e forma uma combinação natural com “perversos”.
- source_word: ἀνθρώπων
  choice: homens
  rationale: O substantivo está no masculino plural e, neste contexto, parece referir-se a adversários humanos concretos, provavelmente homens. A tradução conserva essa referência sem generalizá-la para toda a humanidade.
- source_word: πίστις
  choice: fé
  rationale: “Fé” é o sentido mais provável no contexto da oposição à missão apostólica. A possibilidade semântica de “fidelidade” é mantida em nota.
- source_word: οὐ γὰρ πάντων ἡ πίστις
  choice: pois nem todos têm fé
  rationale: A expressão grega é elíptica, literalmente “pois não é de todos a fé”. O português explicita naturalmente a posse com “têm”, sem transformar a frase numa afirmação mais ampla de que a fé não se destina a todos.
theological_decisions:
- issue: Sentido de πίστις na oração elíptica οὐ γὰρ πάντων ἡ πίστις
  choice: nem todos têm fé
  alternative: nem todos são fiéis
  rationale: No contexto de opositores à proclamação, a falta de fé é a leitura mais provável. Contudo, πίστις também pode denotar fidelidade ou confiabilidade; essa tensão legítima é preservada em nota, sem decidir além do que o grego permite.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil como em outros contextos lusófonos. A coordenação e a oração de finalidade seguem de perto a estrutura grega, enquanto a elipse final é explicitada de forma idiomática.
