source:
  edition: SBLGNT
  text: οὐχ ὅτι οὐκ ἔχομεν ἐξουσίαν, ἀλλ’ ἵνα ἑαυτοὺς τύπον δῶμεν ὑμῖν εἰς τὸ μιμεῖσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/009.yaml
  text: not because we do not have the right, but in order to give ourselves to you as an example for you to imitate us.
translation:
  language: pt
  text: não porque não tenhamos direito[a], mas para nos oferecer como exemplo a vocês[b], a fim de que nos imitem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “autoridade” ou “poder”. Neste contexto, a palavra indica sobretudo um direito ou uma prerrogativa legítima.
    reason: lexical_alternative
  - marker: b
    text: Ou “modelo” ou “padrão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι οὐκ ἔχομεν ἐξουσίαν
  choice: não porque não tenhamos esse direito
  rationale: Preserva a negação retórica e traduz ἐξουσίαν, neste contexto de sustento material, como uma prerrogativa legítima, e não como mero poder.
- source_word: ἑαυτοὺς τύπον δῶμεν ὑμῖν
  choice: nos apresentarmos a vocês como exemplo
  rationale: Reproduz naturalmente em português a ideia idiomática de oferecer a própria conduta como padrão visível aos destinatários.
- source_word: εἰς τὸ μιμεῖσθαι ἡμᾶς
  choice: a fim de que nos imitem
  rationale: Mantém o sentido de finalidade da construção e a referência direta a Paulo e seus companheiros como aqueles a serem imitados.
theological_decisions:
- issue: Natureza da ἐξουσία mencionada por Paulo
  choice: direito legítimo ao sustento
  alternative: autoridade ou poder apostólico em sentido mais amplo
  rationale: O contexto imediato trata de trabalhar para não ser pesado à comunidade. A tradução comunica uma reivindicação legítima sem ampliar a frase para uma doutrina geral da autoridade apostólica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Vocês” torna explícito o plural de ὑμῖν. A repetição de finalidade é evitada por meio de “mas para” e “a fim de que”, sem apagar a relação entre oferecer o exemplo e ser imitado.
