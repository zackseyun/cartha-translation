id: 2TH.3.16
reference: 2 Thessalonians 3:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος τῆς εἰρήνης δῴη ὑμῖν τὴν εἰρήνην διὰ παντὸς ἐν παντὶ τρόπῳ. ὁ κύριος μετὰ πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/016.yaml
  text: May the Lord of peace himself give you peace at all times in every way[b][a]. The Lord be with all of you.
translation:
  language: pt
  text: Que o próprio Senhor da paz dê paz a vocês em todos os momentos[a] e de todas as maneiras.[b] O Senhor esteja com todos vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “continuamente”.
    reason: lexical_alternative
  - marker: b
    text: Ou “de todo modo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: o próprio
  rationale: O uso intensivo de αὐτός destaca pessoalmente o sujeito e é expresso de modo natural em português por “o próprio Senhor”.
- source_word: δὲ
  choice: não expresso por uma palavra separada
  rationale: Aqui δέ apenas marca uma transição suave para a bênção final; em português, a passagem para a construção optativa com “Que” comunica naturalmente essa função sem exigir “agora”, “mas” ou “e”.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Preserva o título κύριος sem explicitar um referente além do que o texto declara.
- source_word: τῆς εἰρήνης
  choice: da paz
  rationale: 'Mantém a construção relacional e semelhante a um título: “o Senhor da paz”.'
- source_word: δῴη
  choice: Que ... dê
  rationale: O optativo aoristo tem força de desejo ou oração nesta bênção; a construção com “Que” a representa naturalmente.
- source_word: τὴν εἰρήνην
  choice: paz
  rationale: Em português, o substantivo sem artigo soa natural após “dar” e preserva o sentido sem rigidez desnecessária.
- source_word: ὑμῖν
  choice: a vocês
  rationale: Torna explícito o destinatário plural em português moderno, com boa legibilidade brasileira.
- source_word: διὰ παντὸς
  choice: em todos os momentos
  rationale: Comunica de maneira clara a constância temporal da expressão grega.
- source_word: ἐν παντὶ τρόπῳ
  choice: de todas as maneiras
  rationale: Preserva a amplitude referente ao modo, sem restringi-la a meios ou circunstâncias específicos.
- source_word: μετὰ πάντων ὑμῶν
  choice: com todos vocês
  rationale: Mantém explicitamente o alcance inclusivo de πάντων e usa uma formulação natural no português moderno.
theological_decisions:
- issue: Referente de “o Senhor” na bênção
  choice: Manter “o Senhor” sem identificação adicional.
  alternative: Explicitar “o Senhor Jesus” ou interpretar de modo geral como “Deus”.
  rationale: O grego traz apenas ὁ κύριος. Embora o contexto paulino possa apontar para Jesus, a tradução não deve acrescentar uma identificação que o versículo não explicita.
- issue: Força da oração final sem verbo expresso
  choice: 'Traduzir como desejo de bênção: “O Senhor esteja com todos vocês.”'
  alternative: 'Traduzir como afirmação indicativa: “O Senhor está com todos vocês.”'
  rationale: No contexto, a oração nominal grega funciona como bênção, não como simples declaração; o subjuntivo “esteja” preserva essa força.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “A vocês” e “todos vocês” evitam formas regionais menos amplamente transparentes; a construção mantém o caráter de bênção do original.
