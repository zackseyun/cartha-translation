source:
  edition: SBLGNT
  text: καὶ μὴ ὡς ἐχθρὸν ἡγεῖσθε, ἀλλὰ νουθετεῖτε ὡς ἀδελφόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/015.yaml
  text: And do not regard him as an enemy[b][a], but admonish him as a brother.
translation:
  language: pt
  text: E não o considerem inimigo, mas admoestem-no como irmão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “irmão” refere-se a outro crente; o termo pode representar qualquer integrante da comunidade cristã.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγεῖσθε
  choice: considerem
  rationale: O imperativo médio exprime ter ou considerar alguém de determinada maneira; “considerem” é natural e preserva o sentido avaliativo.
- source_word: ἐχθρόν
  choice: inimigo
  rationale: O substantivo predicativo após ὡς designa a categoria em que a pessoa não deve ser enquadrada; “inimigo” é a correspondência direta e corrente.
- source_word: νουθετεῖτε
  choice: admoestem-no
  rationale: O verbo reúne advertência e correção orientadora. “Admoestem” conserva essa força pastoral e corretiva melhor do que “ensinem” e com maior amplitude que “avisem”.
- source_word: ἀδελφόν
  choice: irmão
  rationale: Mantém o singular masculino do texto grego e a linguagem de parentesco usada para um integrante da comunidade cristã; uma nota esclarece o alcance comunitário.
- source_word: ὡς
  choice: como
  rationale: Nos dois segmentos, ὡς assinala a condição ou maneira segundo a qual a pessoa é considerada e corrigida; “como” é direto e idiomático.
- source_word: καὶ μὴ ... ἀλλά
  choice: E não ... mas ...
  rationale: A formulação preserva tanto a ligação com a instrução anterior quanto o contraste enfático entre hostilidade e correção fraterna.
theological_decisions:
- issue: Postura disciplinar diante de um crente desobediente
  choice: A pessoa não deve ser considerada inimiga, mas corrigida dentro de uma relação fraterna.
  alternative: Ler a frase apenas como orientação geral para conflitos interpessoais.
  rationale: O contexto imediato de 2 Tessalonicenses 3:14–15 trata da resposta comunitária a quem não obedece à instrução apostólica. “Irmão” mantém o reconhecimento da relação comunitária, sem transformar a disciplina em hostilidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Admoestem” é um termo um pouco mais elevado, mas preserva com precisão a combinação de advertência e correção presente no grego.
