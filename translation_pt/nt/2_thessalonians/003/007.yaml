base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/007.yaml
  text: For you yourselves know how you ought to imitate us[a], because we did not behave disorderly among you.
translation:
  language: pt
  text: Pois vocês mesmos sabem como devem nos imitar, porque não nos comportamos de maneira indisciplinada entre vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais especificamente neste contexto: “não ficamos ociosos entre vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: vocês mesmos
  rationale: Preserva a ênfase do pronome intensivo sobre o sujeito implícito de οἴδατε.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz naturalmente, em português, a explicação ou fundamento da exortação anterior.
- source_word: οἴδατε
  choice: sabem
  rationale: Embora οἶδα tenha forma perfeita, aqui possui sentido presente.
- source_word: πῶς δεῖ μιμεῖσθαι ἡμᾶς
  choice: como devem nos imitar
  rationale: Expressa de modo natural tanto a maneira indicada por πῶς quanto a obrigação de δεῖ, mantendo ἡμᾶς como objeto pessoal.
- source_word: ὅτι
  choice: porque
  rationale: Apresenta a conduta dos missionários como fundamento explicativo do modo de imitá-los.
- source_word: οὐκ ἠτακτήσαμεν
  choice: não nos comportamos de maneira indisciplinada
  rationale: Mantém o sentido amplo de conduta desordenada ou fora da ordem, sem restringi-lo no texto principal à ociosidade.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: Representa de forma idiomática a conduta dos missionários no meio da comunidade tessalonicense.
theological_decisions:
- issue: Sentido de ἀτακτέω no contexto imediato
  choice: conduta indisciplinada ou desordenada em sentido amplo
  alternative: não ficamos ociosos entre vocês
  rationale: O contexto do capítulo relaciona a conduta desordenada à recusa de trabalhar, mas o verbo possui alcance lexical mais amplo. O texto principal preserva essa amplitude, e a nota registra a leitura contextual mais específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação pronominal em “devem nos imitar” é natural no português brasileiro contemporâneo; “de maneira indisciplinada” evita a formulação pouco idiomática “comportar-se desordenadamente” sem estreitar o sentido à ociosidade.
