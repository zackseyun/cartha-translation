  text: ὑμεῖς δέ, ἀδελφοί, μὴ ⸀ἐγκακήσητε καλοποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/013.yaml
  text: But as for you[a], brothers, do not grow weary in doing good.
translation:
  language: pt
  text: Mas vocês, irmãos[a], não se cansem de fazer o bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o grego diz “irmãos”, termo que pode dirigir-se inclusivamente a toda a comunidade de crentes.
    reason: alternativa lexical
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Mas vocês
  rationale: δέ estabelece contraste com os desordeiros mencionados anteriormente, e o pronome explícito ὑμεῖς dá ênfase aos destinatários. “Mas vocês” preserva ambos com naturalidade em português.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: O vocativo masculino plural significa literalmente “irmãos” e, neste contexto congregacional, provavelmente se dirige de modo inclusivo a toda a comunidade cristã; a nota preserva essa abrangência sem apagar a forma grega.
- source_word: μὴ ἐγκακήσητε
  choice: não se cansem
  rationale: A construção com μή exprime proibição. ἐγκακέω pode indicar desanimar, perder o ânimo ou cansar-se de perseverar; “não se cansem” é natural e se liga claramente à atividade contínua expressa pelo particípio.
- source_word: καλοποιοῦντες
  choice: de fazer o bem
  rationale: O particípio presente indica a atividade contínua na qual os leitores não devem se cansar. “Fazer o bem” é uma formulação corrente, clara e digna em português.
theological_decisions:
- issue: Sentido congregacional de ἀδελφοί
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A forma grega é masculina plural, embora no uso epistolar provavelmente inclua toda a comunidade, homens e mulheres. Mantém-se “irmãos” no texto e explicita-se a inclusão em nota, sem decidir além da evidência linguística.
translation_notes:
  register: Português moderno, claro e amplamente compreensível, com boa legibilidade brasileira. A frase conserva o contraste inicial e a exortação direta, em registro simples e digno.
