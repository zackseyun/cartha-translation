source:
  edition: SBLGNT
  text: πιστὸς δέ ἐστιν ὁ κύριος, ὃς στηρίξει ὑμᾶς καὶ φυλάξει ἀπὸ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/003.yaml
  text: But the Lord is faithful[a], who will strengthen you and guard you from the evil one.
translation:
  language: pt
  text: Mas o Senhor é fiel e fortalecerá vocês e os guardará do Maligno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do mal”. A expressão grega τοῦ πονηροῦ pode ser entendida como masculina (“o Maligno”) ou neutra (“o mal”).'
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: fiel
  rationale: Expressa de modo natural tanto a confiabilidade quanto a fidelidade do Senhor, em contraste com a falta de fé mencionada no contexto anterior.
- source_word: δέ
  choice: Mas
  rationale: Preserva a força contrastiva em relação à afirmação anterior de que nem todos têm fé.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Mantém o título do texto grego sem explicitar além do que o próprio versículo diz; no contexto paulino, provavelmente se refere ao Senhor Jesus.
- source_word: στηρίξει
  choice: fortalecerá
  rationale: Comunica a ideia de tornar firme e dar estabilidade, com linguagem pastoral clara e corrente.
- source_word: φυλάξει
  choice: guardará
  rationale: Preserva o sentido ativo de guardar, vigiar e proteger.
- source_word: ἀπὸ
  choice: do
  rationale: Na contração portuguesa de 'de + o', expressa proteção para longe do alcance do perigo mencionado.
- source_word: τοῦ πονηροῦ
  choice: o Maligno
  rationale: Adota no texto principal a leitura masculina pessoal, bem atestada no uso do Novo Testamento, sem apagar a leitura neutra possível, registrada em nota.
theological_decisions:
- issue: Referente de τοῦ πονηροῦ
  choice: o Maligno
  alternative: o mal
  rationale: A forma grega pode ser entendida como masculina ('o Maligno') ou neutra ('o mal'). O texto principal adota a leitura pessoal, enquanto a nota preserva a ambiguidade gramatical e teológica genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O pronome 'vocês' explicita naturalmente o plural de ὑμᾶς. A coordenação verbal foi simplificada em português ('e fortalecerá...') sem perder a relação do pronome relativo grego com 'o Senhor'.
