id: 2TH.3.5
reference: 2 Thessalonians 3:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος κατευθύναι ὑμῶν τὰς καρδίας εἰς τὴν ἀγάπην τοῦ θεοῦ καὶ εἰς τὴν ὑπομονὴν τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/005.yaml
  text: May the Lord direct your hearts into the love of God and into the steadfastness of Messiah[a][b][c].
translation:
  language: pt
  text: Que o Senhor dirija os corações de vocês ao amor de Deus[a] e à perseverança do Messias[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ao amor por Deus». Também pode significar «ao amor de Deus por vocês».
    reason: alternative_reading
  - marker: b
    text: Ou «à perseverança do Messias», entendida como a perseverança que ele demonstra, ou «à perseverança em relação ao Messias».
    reason: alternative_reading
  - marker: c
    text: 'Grego: «Cristo»; traduzido aqui como «Messias» porque o termo funciona como título.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Senhor
  rationale: É a forma portuguesa consagrada para o título divino e cristológico, sem especificar além do que o contexto permite.
- source_word: κατευθύναι
  choice: dirija
  rationale: O optativo exprime desejo ou oração; a construção «Que ... dirija» comunica isso naturalmente e preserva a ideia de conduzir para uma direção.
- source_word: ὑμῶν τὰς καρδίας
  choice: o coração de vocês
  rationale: «Coração» preserva a metáfora bíblica do centro do pensamento, da vontade e dos afetos. O singular distributivo é idiomático em português e evita o pouco natural «seus corações» neste contexto.
- source_word: ἀγάπην
  choice: amor
  rationale: Equivalente direto, claro e corrente de ἀγάπη.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Mantém no texto principal a ambiguidade do genitivo, que pode indicar o amor proveniente de Deus, o amor dirigido a Deus ou a esfera do amor divino.
- source_word: ὑπομονὴν
  choice: perseverança
  rationale: Expressa constância e resistência sob pressão em português natural; neste contexto, comunica melhor o aspecto duradouro de ὑπομονή do que «paciência».
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Χριστός funciona como título; «Messias» traduz seu sentido. A construção genitiva preserva, tanto quanto possível, suas possíveis relações com «perseverança».
theological_decisions:
- issue: Ambiguidade do genitivo em τὴν ἀγάπην τοῦ θεοῦ
  choice: amor de Deus
  alternative: amor a Deus; amor que Deus tem
  rationale: O grego permite leitura subjetiva, objetiva ou mais ampla. A formulação principal não impõe uma interpretação teológica específica, e a nota explicita as possibilidades.
- issue: Ambiguidade do genitivo em τὴν ὑπομονὴν τοῦ Χριστοῦ
  choice: perseverança do Messias
  alternative: perseverança pelo Messias; perseverança que o Messias demonstra
  rationale: A expressão pode indicar a perseverança própria do Messias, perseverança dirigida a ele ou perseverança caracterizada por ele. A tradução conserva a tensão e a nota registra alternativas.
- issue: Tradução de Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: O termo grego é um título que significa «Ungido»; «Messias» comunica sua função titular, enquanto a nota fornece a forma tradicional «Cristo».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Vocês» torna explícito o plural de ὑμῶν; «Que o Senhor dirija» reproduz naturalmente o desejo ou oração expresso pelo optativo. Os marcadores aparecem no texto junto às expressões pertinentes.
