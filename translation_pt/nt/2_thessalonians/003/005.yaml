  source_fidelity: A oração desiderativa («Que o Senhor dirija») traduz bem o optativo κατευθύναι. «Amor de Deus» e «perseverança do Messias» preservam adequadamente os genitivos ambíguos do grego. Contudo, τὰς καρδίας está no plural, e «o coração de vocês» reduz essa pluralidade sem necessidade.
  naturalness: «Que o Senhor dirija os corações de vocês» é natural no português contemporâneo, claramente plural e apropriado ao registro epistolar e orante. A formulação anterior com singular distributivo é possível, mas menos próxima da forma fonte.
  terminology: «Senhor», «amor», «perseverança» e «Messias» são escolhas adequadas. As notas alternativas foram ajustadas para não sugerir que «amor que Deus tem» exige ou identifica um objeto não expresso e para exprimir com maior precisão a possibilidade de uma relação da perseverança com o Messias.
  issues:
  - severity: low
    issue: «o coração de vocês» está no singular, enquanto τὰς καρδίας está no plural.
    rationale: Embora o singular distributivo seja idiomático em português, «os corações de vocês» é igualmente natural e preserva diretamente o plural explícito do texto grego.
  - severity: low
    issue: A nota a diz «o amor que Deus tem».
    rationale: Essa formulação fica semanticamente incompleta em português e pode induzir a especificação de um objeto que o grego não explicita. «O amor de Deus por vocês» esclarece a leitura subjetiva como alternativa, sem alterar o texto principal.
  - severity: low
    issue: A nota b usa «perseverança pelo Messias».
    rationale: «Pelo Messias» tende a significar ‘em favor do Messias’ e não comunica com clareza a alternativa relacional pretendida. «Perseverança em relação ao Messias» mantém a possibilidade sem impor uma leitura doutrinal.
