source:
  edition: SBLGNT
  text: τοῖς δὲ τοιούτοις παραγγέλλομεν καὶ παρακαλοῦμεν ⸂ἐν κυρίῳ Ἰησοῦ Χριστῷ⸃ ἵνα μετὰ ἡσυχίας ἐργαζόμενοι τὸν ἑαυτῶν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/012.yaml
  text: To such people we command and urge in the Lord Jesus the Messiah that[a], working quietly[c][b], they should eat their own bread.
translation:
  language: pt
  text: Quanto a essas pessoas, ordenamos e exortamos, no Senhor Jesus, o Messias,[a] que, trabalhando em sossego,[b] comam o próprio pão.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “pela autoridade do Senhor Jesus, o Messias”. Tradicionalmente, Χριστός é traduzido por “Cristo”.
    reason: ambiguidade_sintática_e_alternativa_lexical
  - marker: b
    text: 'Ou: “com tranquilidade”. A expressão indica uma conduta quieta e ordeira, em contraste com a ociosidade intrometida.'
    reason: alternativa_lexical
  - marker: c
    text: “Comer o próprio pão” significa aqui viver do sustento obtido pelo próprio trabalho.
    reason: esclarecimento_idiomático
lexical_decisions:
- source_word: τοῖς δὲ τοιούτοις
  choice: Quanto a essas pessoas
  rationale: Retoma as pessoas ociosas e intrometidas mencionadas no contexto. “Quanto a” expressa naturalmente a transição leve de δέ sem acrescentar uma ideia temporal.
- source_word: παραγγέλλομεν καὶ παρακαλοῦμεν
  choice: ordenamos e exortamos
  rationale: Mantém os dois verbos e, assim, tanto a autoridade da ordem apostólica como o apelo pastoral insistente.
- source_word: ἐν κυρίῳ Ἰησοῦ Χριστῷ
  choice: no Senhor Jesus, o Messias
  rationale: “No” preserva a formulação relacional e sua possível associação com esfera, união ou autoridade. “O Messias” traduz Χριστός como título semanticamente ativo.
- source_word: μετὰ ἡσυχίας ἐργαζόμενοι
  choice: trabalhando em sossego
  rationale: Reproduz a construção participial e descreve trabalho realizado de modo quieto, ordeiro e não intrometido, em contraste com a conduta do versículo anterior.
- source_word: τὸν ἑαυτῶν ἄρτον
  choice: o próprio pão
  rationale: Conserva a imagem concreta do pão e a ênfase reflexiva em viver do próprio trabalho, sem substituir a metáfora por uma explicação.
- source_word: ἐσθίωσιν
  choice: comam
  rationale: O subjuntivo dependente dos verbos de ordem e exortação comunica o conteúdo da instrução de modo natural em português.
theological_decisions:
- issue: Sentido de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός funciona como título de Jesus; “o Messias” mantém explícito esse valor, enquanto “Cristo” pode ser percebido apenas como parte de um nome.
- issue: Força de ἐν κυρίῳ
  choice: no Senhor
  alternative: pela autoridade do Senhor
  rationale: A tradução principal preserva a formulação grega e sua amplitude relacional; a nota registra a leitura de autoridade sem torná-la a única interpretação possível.
- issue: Autoridade e apelo pastoral
  choice: ordenamos e exortamos
  alternative: instruímos
  rationale: Fundir os verbos reduziria a tensão intencional entre uma ordem autorizada e um apelo pastoral.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. “Exortamos” conserva o tom apostólico sem arcaísmo excessivo; “em sossego” comunica uma vida ordeira, não mera ausência de som. A pontuação destaca “o Messias” como título de Jesus.
