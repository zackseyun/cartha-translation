  yaml_path: translation/nt/2_thessalonians/003/011.yaml
  text: For we hear that some among you are walking disorderly[a], doing no work at all[b], but meddling.
translation:
  language: pt
  text: Pois ouvimos que alguns entre vocês vivem de maneira desordenada[a], sem fazer trabalho algum, mas intrometendo-se na vida alheia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «vivem ociosamente» ou «levam uma vida indisciplinada». O advérbio grego pode descrever uma conduta fora da ordem ou ociosa em relação ao que se esperava da comunidade.
    reason: lexical_alternative
  - marker: b
    text: 'Tradicionalmente, «ocupando-se do que não lhes diz respeito». No grego há um jogo de palavras: eles não fazem trabalho, mas se ocupam indevidamente de outras coisas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούομεν
  choice: ouvimos
  rationale: O presente grego comunica uma informação atual ou recorrente; em português, o presente «ouvimos» é natural e mantém esse valor.
- source_word: γάρ
  choice: Pois
  rationale: Introduz a razão ou explicação da exortação anterior e preserva de modo conciso a ligação argumentativa.
- source_word: τινας
  choice: alguns
  rationale: Refere-se a um grupo não especificado dentro da comunidade.
- source_word: περιπατοῦντας
  choice: vivem
  rationale: O verbo «andar» é usado idiomaticamente para modo de vida ou conduta. «Vivem» transmite esse sentido com clareza no português atual.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: Indica que essas pessoas fazem parte ou estão no meio da comunidade tessalonicense.
- source_word: ἀτάκτως
  choice: de maneira desordenada
  rationale: Preserva o sentido amplo de conduta fora da ordem ou indisciplinada, sem reduzi-lo apenas à ociosidade, que a frase seguinte explicita.
- source_word: μηδὲν ἐργαζομένους
  choice: sem trabalhar em coisa alguma
  rationale: Mantém a ênfase de μηδέν na total ausência de trabalho e prepara o contraste verbal seguinte.
- source_word: ἀλλὰ
  choice: mas
  rationale: Marca o forte contraste entre não trabalhar e ocupar-se indevidamente de outros assuntos.
- source_word: περιεργαζομένους
  choice: intrometendo-se na vida alheia
  rationale: Comunica em português corrente a ideia de ocupar-se indevidamente dos assuntos dos outros. O jogo verbal com ἐργαζομένους não pode ser reproduzido integralmente sem artificialidade e é indicado em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preferiu-se «vivem» ao calque «andam» para tornar explícito o uso idiomático de περιπατέω. «Intrometendo-se na vida alheia» oferece uma formulação natural, enquanto a nota preserva a alternativa mais formal e o jogo de palavras grego.
