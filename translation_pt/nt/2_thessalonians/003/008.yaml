  text: nor did we eat bread from anyone free of charge[a], but with labor and hardship, working night and day so as not to burden any of you.
translation:
  language: pt
  text: nem comemos de graça o pão de ninguém[a]; pelo contrário, trabalhamos noite e dia, com esforço e fadiga, para não sobrecarregar nenhum de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem comemos o pão de ninguém sem pagar”. O grego diz literalmente “pão”, embora a palavra possa referir-se de modo mais amplo a alimento ou sustento material.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δωρεὰν
  choice: de graça
  rationale: Expressão corrente em português para algo recebido sem custo, preservando a nuance econômica do contexto.
- source_word: ἄρτον
  choice: pão
  rationale: Mantém o termo concreto do grego, que neste contexto pode representar de modo mais amplo alimento ou sustento.
- source_word: παρά τινος
  choice: de ninguém
  rationale: Com a negação, traduz naturalmente a ideia de não receber pão de pessoa alguma.
- source_word: ἐν κόπῳ καὶ μόχθῳ
  choice: com esforço e fadiga
  rationale: Preserva o efeito cumulativo dos dois quase sinônimos, ressaltando trabalho árduo e penoso em linguagem natural.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: noite e dia
  rationale: Reproduz o idiomatismo temporal que indica atividade intensa e contínua.
- source_word: ἐργαζόμενοι
  choice: trabalhamos
  rationale: A forma verbal finita em português integra naturalmente o particípio grego à oração contrastiva, sem alterar seu sentido.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί
  choice: para não sermos um peso
  rationale: Expressa claramente a finalidade e a ideia contextual de não impor encargo material ou financeiro.
- source_word: τινα ὑμῶν
  choice: nenhum de vocês
  rationale: Preserva o sentido distributivo da expressão grega em português corrente.
- source_word: οὐδὲ ... ἀλλ’
  choice: nem ... pelo contrário
  rationale: Mantém o forte contraste entre não receber sustento gratuito e trabalhar arduamente.
