id: 2TH.3.1
reference: 2 Thessalonians 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τὸ λοιπὸν προσεύχεσθε, ἀδελφοί, περὶ ἡμῶν, ἵνα ὁ λόγος τοῦ κυρίου τρέχῃ καὶ δοξάζηται καθὼς καὶ πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/001.yaml
  text: Finally[a], brothers, pray for us, that the word of the Lord may spread rapidly and be honored, just as it was among you[b],
translation:
  language: pt
  text: Por fim, irmãos[a], orem por nós, para que a palavra do Senhor se espalhe rapidamente e seja honrada, assim como aconteceu entre vocês[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o grego diz “irmãos” e pode dirigir-se representativamente a toda a congregação.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “corra e seja glorificada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπὸν
  choice: Por fim
  rationale: Funciona como marcador discursivo que introduz a parte final da carta; é uma formulação natural e digna em português.
- source_word: προσεύχεσθε
  choice: orem
  rationale: O imperativo presente plural pede oração contínua, mas o imperativo simples em português expressa a exortação com naturalidade.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva o substantivo masculino plural do grego como forma representativa de tratamento à congregação; a possível inclusão de mulheres é esclarecida em nota.
- source_word: περὶ ἡμῶν
  choice: por nós
  rationale: Com o verbo orar, esta é a construção idiomática e exata em português.
- source_word: ἵνα
  choice: para que
  rationale: Expressa naturalmente a finalidade e o resultado pretendido do pedido de oração.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: a palavra do Senhor
  rationale: Preserva o conhecido idioma bíblico e a relação genitiva, podendo designar a mensagem proclamada que procede do Senhor ou diz respeito a ele.
- source_word: τρέχῃ
  choice: se espalhe rapidamente
  rationale: 'Comunica em português corrente o sentido contextual da metáfora de correr: o avanço rápido da mensagem. A imagem literal é preservada em nota.'
- source_word: δοξάζηται
  choice: seja honrada
  rationale: Transmite que a palavra deve ser recebida com honra e reconhecimento; evita uma expressão pouco natural sem apagar o sentido passivo. A tradução literal é indicada em nota.
- source_word: καθὼς καὶ πρὸς ὑμᾶς
  choice: assim como aconteceu entre vocês
  rationale: Torna explícita, de modo natural, a comparação com a experiência já ocorrida entre os tessalonicenses, sem acrescentar conteúdo teológico.
theological_decisions:
- issue: Alcance de ἀδελφοί no tratamento à congregação
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: Mantém no texto a forma masculina do original, sem excluir a provável referência representativa à congregação inteira, esclarecida em nota.
- issue: Metáfora de τρέχῃ aplicada à palavra do Senhor
  choice: se espalhe rapidamente
  alternative: corra
  rationale: A equivalência ótima comunica com clareza o avanço veloz da mensagem, enquanto a nota conserva a imagem grega e sua possível força interpretativa.
- issue: Sentido passivo de δοξάζηται
  choice: seja honrada
  alternative: seja glorificada
  rationale: No contexto, a palavra recebe reconhecimento e honra. A alternativa mais formal permanece na nota para preservar a tensão lexical.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa e evita construções excessivamente literais, preservando em notas as imagens e alternativas relevantes do grego.
