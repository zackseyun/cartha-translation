source:
  edition: SBLGNT
  text: Εἰ δέ τις οὐχ ὑπακούει τῷ λόγῳ ἡμῶν διὰ τῆς ἐπιστολῆς, τοῦτον σημειοῦσθε, ⸀μὴ ⸀συναναμίγνυσθαι αὐτῷ, ἵνα ἐντραπῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/014.yaml
  text: And if anyone does not obey our word through this letter[a], take note of that person; do not associate with him[d][c][b], so that he may be ashamed.
translation:
  language: pt
  text: E, se alguém não obedecer à nossa palavra transmitida por esta carta[a], tomem nota dessa pessoa[b] e não mantenham convivência com ela[c], para que fique envergonhada[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como «por meio desta carta» ou «nesta carta». A expressão grega pode indicar o meio pelo qual a instrução é comunicada.
    reason: lexical_alternative
  - marker: b
    text: Ou «marquem» ou «assinalem».
    reason: lexical_alternative
  - marker: c
    text: Ou «não se associem com ela».
    reason: lexical_alternative
  - marker: d
    text: A finalidade é corretiva; compare o v. 15, no qual essa pessoa ainda deve ser advertida «como irmão».
    reason: cross_reference
lexical_decisions:
- source_word: ὑπακούει
  choice: obedecer
  rationale: O verbo expressa submissão ou atenção prática a uma instrução com autoridade; «obedecer» é claro e adequado ao contexto exortativo.
- source_word: τῷ λόγῳ ἡμῶν
  choice: à nossa palavra
  rationale: Preserva a expressão grega e designa a instrução apostólica comunicada à comunidade.
- source_word: διὰ τῆς ἐπιστολῆς
  choice: transmitida por esta carta
  rationale: διά com genitivo indica aqui o meio pelo qual a palavra chega aos leitores. «Esta» explicita naturalmente a carta em mãos sem eliminar as alternativas possíveis.
- source_word: σημειοῦσθε
  choice: tomem nota
  rationale: O imperativo pede que a comunidade identifique ou assinale a pessoa; a formulação é atual e não acrescenta um procedimento formal específico.
- source_word: τοῦτον
  choice: dessa pessoa
  rationale: Torna explícito e natural em português o referente individual do demonstrativo grego.
- source_word: μὴ συναναμίγνυσθαι αὐτῷ
  choice: não se associem com ela
  rationale: Expressa a proibição de manter convivência ou companhia, preservando a dimensão social sem impor uma categoria jurídica eclesiástica posterior.
- source_word: ἐντραπῇ
  choice: fique envergonhada
  rationale: Mantém a oração de finalidade e a ideia de que a pessoa venha a sentir vergonha, sem apresentar a humilhação como fim em si mesma.
- source_word: τις
  choice: alguém
  rationale: Representa naturalmente o pronome indefinido e mantém aberto o alcance da condição.
- source_word: αὐτῷ
  choice: ela
  rationale: Em português, o pronome retoma naturalmente «pessoa», substantivo gramaticalmente feminino, sem alterar o referente humano genérico.
theological_decisions:
- issue: Natureza da medida ordenada por μὴ συναναμίγνυσθαι αὐτῷ
  choice: Afastamento relacional ou comunitário com finalidade corretiva, sem definição técnica de excomunhão.
  alternative: Excomunhão formal plena; ou simples evitação casual sem dimensão comunitária.
  rationale: O versículo ordena limitar a associação, mas não define um procedimento jurídico. O versículo 15 ainda manda advertir a pessoa como irmão, indicando finalidade corretiva.
- issue: Sentido de ἐντραπῇ
  choice: Vergonha corretiva destinada a levar a pessoa a reconhecer sua conduta.
  alternative: Humilhação pública como finalidade em si mesma.
  rationale: A oração de finalidade, lida com o versículo seguinte, aponta para correção, embora a tradução preserve a linguagem séria de vergonha usada no texto.
translation_notes:
  register: Português moderno, claro e digno, com formas de plural facilmente legíveis no Brasil. A repetição de «pessoa» e o pronome «ela» evitam o masculino genérico onde o grego τις é indefinido, sem tornar a frase artificial. A formulação conserva a força comunitária da ordem e sua finalidade corretiva.
