  text: The grace of our Lord Jesus Christ be with all of you[a].
translation:
  language: pt
  text: A graça de nosso Senhor Jesus Cristo esteja com todos vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “A graça de nosso Senhor Jesus Cristo com todos vocês”. O verbo “esteja” está implícito no grego.'
    reason: clareza sobre o verbo suprido na tradução
lexical_decisions:
- source_word: χάρις
  choice: graça
  rationale: Termo consagrado nas bênçãos paulinas, expressando o favor generoso de Deus; é natural, teologicamente adequado e amplamente compreensível em português.
- source_word: κυρίου
  choice: Senhor
  rationale: Preserva o título cristológico de autoridade e reverência, sem reduzi-lo ao sentido social de mestre ou dono.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus Cristo
  rationale: Em português, “Jesus Cristo” é a forma corrente e digna; “Cristo” conserva o título tradicional derivado de Χριστός, embora nesta fórmula também funcione quase como parte do nome.
- source_word: μετὰ πάντων ὑμῶν
  choice: esteja com todos vocês
  rationale: A preposição μετά com o genitivo significa “com”, e πάντων ὑμῶν inclui toda a comunidade. “Esteja” explicita naturalmente em português o verbo subentendido na bênção nominal grega.
theological_decisions:
- issue: Tradução de Χριστοῦ na bênção final
  choice: Cristo
  alternative: Messias
  rationale: Embora Χριστός tenha o sentido de “Messias/Ungido”, na fórmula paulina “Jesus Cristo” é a expressão portuguesa estabelecida e pode funcionar de modo quase onomástico. A alternativa “Messias” torna mais explícito o valor do título, mas não é necessária neste contexto.
- issue: Força da fórmula nominal sem verbo expresso
  choice: esteja
  alternative: seja
  rationale: O grego apresenta uma bênção nominal, literalmente “a graça... com todos vocês”. “Esteja” comunica de modo natural o desejo implícito sem transformar a frase em afirmação indicativa nem resolver além do necessário sua força beneditória.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com “vocês” para o plural de segunda pessoa. A formulação preserva a concisão e o caráter litúrgico da bênção final.
