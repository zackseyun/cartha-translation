id: 2TH.3.10
reference: 2 Thessalonians 3:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε ἦμεν πρὸς ὑμᾶς, τοῦτο παρηγγέλλομεν ὑμῖν, ὅτι εἴ τις οὐ θέλει ἐργάζεσθαι μηδὲ ἐσθιέτω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/010.yaml
  text: 'For even when we were with you, we kept commanding you this: if anyone is not willing to work, neither let him eat.'
translation:
  language: pt
  text: 'Pois, mesmo quando estávamos com vocês, ordenávamos isto: se alguém não quer trabalhar[a], também não coma.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz “não quer trabalhar”, referindo-se à falta de disposição, não à incapacidade.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nem coma”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Pois, mesmo
  rationale: “Pois” preserva a ligação explicativa de γάρ com o contexto anterior, e “mesmo” comunica a ênfase acrescentada por καί.
- source_word: ὅτε ἦμεν πρὸς ὑμᾶς
  choice: quando estávamos com vocês
  rationale: πρός com pessoas expressa aqui companhia ou presença; esta formulação é natural e clara em português moderno.
- source_word: τοῦτο παρηγγέλλομεν ὑμῖν
  choice: ordenávamos isto
  rationale: O imperfeito παρηγγέλλομεν apresenta uma ordem dada de modo contínuo ou habitual no passado. “Ordenávamos” conserva esse aspecto sem acrescentar conteúdo a τοῦτο, que aponta para a declaração seguinte.
- source_word: εἴ τις οὐ θέλει ἐργάζεσθαι
  choice: se alguém não quer trabalhar
  rationale: θέλει se refere à vontade ou disposição, não à capacidade. “Não quer trabalhar” é direto, natural e não transforma falta de vontade em impossibilidade.
- source_word: μηδὲ ἐσθιέτω
  choice: também não coma
  rationale: μηδέ liga a consequência negativa à condição anterior, e o imperativo presente ἐσθιέτω é adequadamente expresso pelo presente do subjuntivo com valor imperativo em português.
theological_decisions:
- issue: Se a declaração trata de incapacidade ou de falta de disposição para trabalhar
  choice: “se alguém não quer trabalhar”
  alternative: “se alguém não pode trabalhar”
  rationale: O verbo θέλει diz respeito à vontade. A tradução preserva a distinção entre não querer e não poder, evitando aplicar a ordem a quem é incapaz de trabalhar.
- issue: Força da consequência expressa por μηδὲ ἐσθιέτω
  choice: “também não coma”
  alternative: “nem coma”
  rationale: A formulação mantém a força imperativa do grego e sua ligação lógica com a condição, sem ampliar a afirmação para além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento “vocês” traduz naturalmente o plural ὑμᾶς/ὑμῖν. A construção singular “alguém... coma” preserva o alcance genérico do original sem marcar gênero desnecessariamente.
