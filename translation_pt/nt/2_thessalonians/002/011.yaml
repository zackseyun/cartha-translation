  text: καὶ διὰ τοῦτο ⸀πέμπει αὐτοῖς ὁ θεὸς ἐνέργειαν πλάνης εἰς τὸ πιστεῦσαι αὐτοὺς τῷ ψεύδει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/011.yaml
  text: And because of this[a], God sends them a working of delusion so that they may believe the lie,
translation:
  language: pt
  text: E, por isso, Deus lhes envia uma ação de engano[a] para que creiam na mentira,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma influência enganadora”, “uma atuação de engano” ou, tradicionalmente, “um forte engano”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: por isso
  rationale: Expressa de modo natural a relação causal com a recusa da verdade mencionada anteriormente, sem reduzir a expressão a uma conclusão meramente inferencial.
- source_word: πέμπει
  choice: envia
  rationale: Reproduz diretamente o presente do indicativo e mantém Deus como sujeito explícito da ação.
- source_word: ἐνέργειαν πλάνης
  choice: uma atuação do engano
  rationale: Mantém distintos os dois substantivos gregos e a relação genitiva entre eles. “Atuação” comunica força em atividade, enquanto “engano” preserva a amplitude de πλάνη entre erro, ilusão e ação enganadora.
- source_word: εἰς τὸ πιστεῦσαι
  choice: para que creiam
  rationale: É uma formulação portuguesa clara que conserva a força final ou resultativa da construção grega sem tentar decidir rigidamente entre propósito e resultado.
- source_word: τῷ ψεύδει
  choice: na mentira
  rationale: O singular definido conserva a provável referência contextual a uma mentira específica, em vez de generalizar como “no que é falso”.
theological_decisions:
- issue: A ação divina no endurecimento judicial
  choice: Deus lhes envia uma atuação do engano
  alternative: Deus permite que uma atuação do engano venha sobre eles
  rationale: O grego apresenta explicitamente Deus como sujeito de “envia”. A tradução mantém essa afirmação direta, sem suavizá-la como mera permissão, e deixa aberta a interpretação teológica do modo dessa ação judicial.
- issue: Propósito ou resultado de εἰς τὸ πιστεῦσαι
  choice: para que creiam
  alternative: resultando em que creiam
  rationale: A construção admite matizes de propósito e resultado. “Para que creiam” acompanha de perto sua forma e força, sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A expressão deliberadamente incomum “atuação do engano” preserva a estrutura e a ambiguidade de ἐνέργειαν πλάνης; a nota oferece equivalentes mais idiomáticos. A vírgula final foi mantida porque o versículo fornecido integra uma frase que continua no versículo seguinte.
