id: 2TH.2.16
reference: 2 Thessalonians 2:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς καὶ ⸀θεὸς ⸀ὁ πατὴρ ἡμῶν, ὁ ἀγαπήσας ἡμᾶς καὶ δοὺς παράκλησιν αἰωνίαν καὶ ἐλπίδα ἀγαθὴν ἐν χάριτι,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/016.yaml
  text: May our Lord Jesus the Messiah himself[a], and God our Father, who loved us and gave us eternal encouragement and good hope by grace,
translation:
  language: pt
  text: Que o próprio nosso Senhor Jesus, o Messias, e Deus, nosso Pai, que nos amou e nos deu consolo eterno[a] e boa esperança pela graça,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encorajamento” ou “ânimo”.
    reason: παράκλησις possui uma faixa semântica que inclui consolo, encorajamento e fortalecimento; o contexto admite mais de uma nuance.
lexical_decisions:
- source_word: Αὐτὸς
  choice: o próprio
  rationale: Preserva o uso intensivo de αὐτός e enfatiza a atuação pessoal do Senhor Jesus, com formulação natural em português.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: A partícula marca uma transição leve. Como o versículo integra uma frase que continua no versículo seguinte, acrescentar “agora” poderia sugerir uma referência temporal ausente do contexto.
- source_word: κύριος
  choice: Senhor
  rationale: É o equivalente corrente e adequado para κύριος como título cristológico.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus, o Messias
  rationale: Χριστός conserva aqui seu valor de título. “O Messias” comunica esse sentido de modo transparente e idiomático em português.
- source_word: θεὸς ὁ πατὴρ ἡμῶν
  choice: Deus, nosso Pai
  rationale: A aposição preserva tanto θεός como πατήρ e soa natural em português.
- source_word: ὁ ἀγαπήσας
  choice: que nos amou
  rationale: A construção participial articular é vertida naturalmente como oração relativa, sem acrescentar uma especificação interpretativa do antecedente.
- source_word: δοὺς
  choice: nos deu
  rationale: O particípio aoristo coordenado com ἀγαπήσας é expresso por um verbo no passado, mantendo a sequência direta das ações.
- source_word: παράκλησιν
  choice: consolo
  rationale: παράκλησις pode indicar consolo, encorajamento ou estímulo. “Consolo” é claro e natural neste contexto; a alternativa semântica principal é preservada em nota.
- source_word: αἰωνίαν
  choice: eterno
  rationale: Expressa de modo direto a duração permanente indicada por αἰώνιος.
- source_word: ἐλπίδα ἀγαθήν
  choice: boa esperança
  rationale: Mantém a forma qualitativa e a avaliação positiva do original sem expansão desnecessária.
- source_word: ἐν χάριτι
  choice: pela graça
  rationale: 'Representa de modo idiomático o provável valor instrumental ou causal de ἐν: o dom é concedido mediante a graça.'
theological_decisions:
- issue: Concordância dos particípios singulares com os sujeitos coordenados “nosso Senhor Jesus, o Messias” e “Deus, nosso Pai”
  choice: Manter uma única oração relativa no singular — “que nos amou e nos deu” — sem explicitar além do grego a qual dos sujeitos ela se refere.
  alternative: Fazer a oração relativa referir-se expressamente apenas a Deus Pai, ou reformulá-la no plural para atribuí-la explicitamente a ambos.
  rationale: A sintaxe grega coordena os dois sujeitos e depois emprega modificadores singulares. A tradução conserva essa tensão e evita tanto restringir quanto ampliar explicitamente a referência por razões doutrinárias.
translation_notes:
  register: Português moderno, claro e reverente, com ampla legibilidade brasileira. A ordem foi levemente ajustada para soar natural, sem eliminar a ambiguidade sintática do original. A vírgula final foi mantida porque a frase continua no versículo 17.
