id: 2TH.2.2
reference: 2 Thessalonians 2:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς ⸀μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε δι’ ἐπιστολῆς ὡς δι’ ἡμῶν, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/002.yaml
  text: that you not be quickly shaken from your mind or alarmed[a], either by a spirit or by a message or by a letter as if from us[b], to the effect that the day of the Lord has come.
translation:
  language: pt
  text: para que vocês não se deixem abalar tão depressa em seu modo de pensar, nem se alarmem, seja por um espírito[a], seja por uma mensagem, seja por uma carta — como se viessem de nós —, com a alegação de que o dia do Senhor já chegou[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma manifestação espiritual” ou “uma revelação profética”.
    reason: lexical_alternative
  - marker: b
    text: Ou “já está presente”. O perfeito grego pode expressar a alegação de que o dia do Senhor já está aqui.
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: depressa
  rationale: Modifica os dois infinitivos e expressa a rapidez com que os leitores poderiam ser abalados ou alarmados, não a proximidade temporal do Dia.
- source_word: σαλευθῆναι
  choice: se deixem abalar
  rationale: Preserva a metáfora de ser sacudido ou desestabilizado e soa natural em português.
- source_word: ἀπὸ τοῦ νοὸς
  choice: em seu modo de pensar
  rationale: A expressão aponta para a disposição mental ou entendimento estabelecido; esta formulação evita o pouco natural 'afastados da mente' sem reduzir o sentido apenas à emoção.
- source_word: θροεῖσθαι
  choice: fiquem alarmados
  rationale: Comunica o estado de perturbação e alarme indicado pelo verbo, sem exagerar como 'aterrorizados'.
- source_word: πνεύματος
  choice: um espírito
  rationale: Mantém a formulação literal e a ambiguidade do substantivo sem artigo; no contexto, pode designar uma alegada manifestação ou revelação espiritual, esclarecida em nota.
- source_word: λόγου
  choice: uma mensagem
  rationale: No contraste com uma carta, provavelmente indica comunicação oral, ensino ou relato; 'mensagem' é mais clara no português atual do que o literal 'palavra'.
- source_word: ἐπιστολῆς
  choice: uma carta
  rationale: Equivalente corrente e natural para correspondência escrita.
- source_word: ὡς δι’ ἡμῶν
  choice: supostamente vinda de nós
  rationale: Expressa de modo idiomático a alegação de que a carta teria procedido de Paulo e seus companheiros, sem afirmar que de fato veio deles.
- source_word: ὡς ὅτι
  choice: afirmando que
  rationale: Introduz naturalmente em português o conteúdo alegado pelas fontes mencionadas.
- source_word: ἐνέστηκεν
  choice: já chegou
  rationale: O perfeito apresenta o Dia como tendo chegado e estando agora presente; 'já' torna explícita essa força contextual, enquanto a alternativa mais literal é preservada em nota.
- source_word: ἡμέρα τοῦ κυρίου
  choice: o dia do Senhor
  rationale: Preserva a expressão escatológica estabelecida e não a confunde com um dia semanal de culto.
theological_decisions:
- issue: Sentido de ἐνέστηκεν na alegação escatológica
  choice: já chegou
  alternative: já está presente
  rationale: O perfeito pode descrever uma chegada cujo resultado presente permanece. A tradução principal comunica que se alegava que o dia do Senhor já havia chegado; a nota conserva a formulação mais literal e sua possível importância interpretativa.
- issue: Sentido de πνεύματος entre as fontes alegadas
  choice: um espírito
  alternative: uma manifestação espiritual ou uma revelação profética
  rationale: O substantivo sem artigo não exige referência direta ao Espírito Santo e, neste contexto, pode apontar para uma alegada comunicação profética. O texto principal mantém a ambiguidade lexical, e a nota oferece o sentido contextual possível.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A construção correlativa 'seja... seja... seja...' reproduz com naturalidade a tríade grega. 'Em seu modo de pensar' traduz idiomaticamente a expressão mental sem eliminar sua amplitude, e as notas preservam as ambiguidades relevantes.
