  text: οὗ ἐστιν ἡ παρουσία κατ’ ἐνέργειαν τοῦ Σατανᾶ ἐν πάσῃ δυνάμει καὶ σημείοις καὶ τέρασιν ψεύδους
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/009.yaml
  text: whose coming is according to the working of Satan[b][a], with all power and signs and wonders of falsehood.
translation:
  language: pt
  text: A vinda dele será segundo a atuação de Satanás, com todo poder, sinais e prodígios de falsidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com toda espécie de poder, sinais e prodígios de mentira”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: desse
  rationale: O pronome relativo genitivo retoma “o perverso” do versículo anterior. Em português, “a vinda desse” mantém a ligação genitival de modo claro e natural.
- source_word: παρουσία
  choice: vinda
  rationale: No contexto escatológico, indica chegada ou advento, e não apenas presença estática.
- source_word: κατ’ ἐνέργειαν
  choice: segundo a atuação
  rationale: Preserva a ideia de conformidade com a atividade operante de Satanás, sem impor uma causalidade mais específica do que o grego expressa.
- source_word: τοῦ Σατανᾶ
  choice: de Satanás
  rationale: Emprega a forma tradicional do nome próprio e conserva o genitivo, que associa a atuação a Satanás.
- source_word: ἐν πάσῃ δυνάμει
  choice: com todo poder
  rationale: O uso de ἐν apresenta aquilo que acompanha ou caracteriza a vinda; “todo poder” mantém a formulação abrangente sem reduzir δύναμις a “milagres”.
- source_word: σημείοις
  choice: sinais
  rationale: Equivalente corrente que preserva a ideia de manifestações dotadas de significado ou pretensa autenticação.
- source_word: τέρασιν
  choice: prodígios
  rationale: Termo bíblico ainda compreensível e digno para fenômenos extraordinários, formando a combinação natural “sinais e prodígios”.
- source_word: ψεύδους
  choice: de falsidade
  rationale: 'Mantém a forma genitiva e a ambiguidade sobre o alcance: as manifestações podem ser caracterizadas pela falsidade ou servir à mentira, sem que o texto determine se são meros truques.'
theological_decisions:
- issue: Natureza das manifestações satânicas
  choice: “poder, sinais e prodígios de falsidade” deixa em aberto se as manifestações são intrinsecamente falsas ou se operam a serviço do engano.
  alternative: “falsos prodígios” poderia sugerir que se trata apenas de fenômenos forjados; “prodígios mentirosos” poderia personificar ou estreitar a relação com a mentira.
  rationale: O genitivo ψεύδους caracteriza a série de manifestações pela falsidade, mas não oferece uma explicação metafísica completa sobre sua realidade ou origem. A tradução conserva essa tensão.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Desse” retoma o perverso mencionado no contexto anterior; “prodígios” preserva a combinação bíblica corrente com “sinais”. O marcador [a] aparece no texto principal.
