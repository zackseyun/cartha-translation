  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς ἐδιδάχθητε εἴτε διὰ λόγου εἴτε δι’ ἐπιστολῆς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/015.yaml
  text: So then[a], brothers, stand firm and hold fast to the traditions that you were taught, whether by word or by our letter.
translation:
  language: pt
  text: Portanto, irmãos[a], permaneçam firmes e apeguem-se às tradições que lhes foram ensinadas, seja oralmente, seja por carta nossa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o grego diz “irmãos”, mas provavelmente se dirige a toda a congregação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Portanto
  rationale: As duas partículas introduzem uma conclusão enfática com base no argumento anterior. “Portanto” expressa essa força inferencial de modo natural e digno em português.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: O vocativo plural masculino significa literalmente “irmãos”. Em Paulo, pode abranger toda a comunidade; a forma do grego é mantida no texto, e a provável abrangência inclusiva é indicada em nota.
- source_word: στήκετε
  choice: permaneçam firmes
  rationale: O imperativo presente pede constância e perseverança. “Permaneçam firmes” comunica tanto continuidade quanto estabilidade em português atual.
- source_word: κρατεῖτε
  choice: apeguem-se
  rationale: O verbo indica reter com firmeza ou continuar aderindo a algo. “Apeguem-se” preserva a intensidade do imperativo e combina naturalmente com “às tradições”.
- source_word: παραδόσεις
  choice: tradições
  rationale: O substantivo designa aquilo que é transmitido ou entregue. “Tradições” conserva esse sentido de conteúdo transmitido e não reduz o termo a meros “ensinos” ou “instruções”.
- source_word: ἐδιδάχθητε
  choice: lhes foram ensinadas
  rationale: A forma passiva apresenta os tessalonicenses como destinatários do ensino. A concordância com “tradições” produz uma formulação clara e natural em português.
- source_word: διὰ λόγου
  choice: por palavra
  rationale: Em contraste com a carta, λόγος se refere à comunicação falada. “Por palavra” mantém a concisão e a estrutura paralela do grego sem explicitar além do necessário.
- source_word: δι’ ἐπιστολῆς ἡμῶν
  choice: por carta nossa
  rationale: A expressão contrapõe a transmissão escrita à oral e preserva o possessivo ἡμῶν. “Por carta nossa” é fiel e idiomático.
theological_decisions:
- issue: Tradução de παράδοσις em um texto usado em debates sobre a tradição apostólica
  choice: tradições
  alternative: ensinamentos; instruções
  rationale: O grego fala do que foi transmitido e inclui meios oral e escrito. “Tradições” preserva o dado lexical e a tensão teológica do texto sem identificar essas tradições apostólicas com qualquer formulação denominacional posterior.
- issue: Abrangência de ἀδελφοί numa congregação provavelmente mista
  choice: irmãos, com nota explicativa
  alternative: irmãos e irmãs
  rationale: O texto principal conserva a forma masculina do grego, enquanto a nota informa que o vocativo provavelmente se dirige a toda a congregação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é claro e digno; mantém o paralelismo “seja... seja...” e evita linguagem arcaica ou terminologia denominacional.
