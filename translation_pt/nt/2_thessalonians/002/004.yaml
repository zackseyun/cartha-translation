id: 2TH.2.4
reference: 2 Thessalonians 2:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ ἀντικείμενος καὶ ὑπεραιρόμενος ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα, ὥστε αὐτὸν εἰς τὸν ναὸν τοῦ ⸀θεοῦ καθίσαι ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/004.yaml
  text: the one who opposes and exalts himself over every so-called god or object of worship[a], so that he takes his seat in the temple of God[b], displaying himself as being God.
translation:
  language: pt
  text: aquele que se opõe e se exalta acima de tudo o que se chama deus ou é objeto de adoração, a ponto de se assentar no templo de Deus[a], apresentando-se como Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no santuário de Deus”.
    reason: lexical_alternative
  - marker: b
    text: Ou “apresentando-se como um deus”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀντικείμενος
  choice: aquele que se opõe
  rationale: O particípio presente com artigo funciona como substantivo e expressa oposição contínua, sem transformá-lo em um título técnico.
- source_word: ὑπεραιρόμενος
  choice: se exalta acima de
  rationale: Preserva a força reflexiva do particípio e expressa superioridade arrogada em português natural.
- source_word: ἐπὶ πάντα λεγόμενον θεὸν
  choice: acima de tudo o que se chama deus
  rationale: ἐπί com acusativo, após o verbo de exaltação, indica superioridade; λεγόμενον designa aquilo que recebe o nome de deus sem confirmar que de fato o seja.
- source_word: σέβασμα
  choice: objeto de adoração
  rationale: Abrange qualquer objeto de veneração religiosa, não apenas uma divindade.
- source_word: ὥστε
  choice: a ponto de
  rationale: Comunica naturalmente o resultado ou efeito da oposição e autoexaltação anteriores.
- source_word: εἰς τὸν ναὸν τοῦ θεοῦ
  choice: no templo de Deus
  rationale: Embora εἰς normalmente indique movimento para dentro, com καθίζω a expressão pode ser vertida idiomaticamente como assentar-se no templo; ναός pode designar especificamente o santuário.
- source_word: καθίσαι
  choice: se assentar
  rationale: Expressa o ato deliberado de ocupar um assento, sem acrescentar explicitamente a ideia de entronização.
- source_word: ἀποδεικνύντα ἑαυτὸν
  choice: apresentando-se
  rationale: Indica que ele se mostra ou se apresenta publicamente como algo, sem pressupor necessariamente uma proclamação verbal formal.
- source_word: ὅτι ἔστιν θεός
  choice: como Deus
  rationale: A construção exprime a alegação ou apresentação culminante da figura; a ausência de artigo permite discussão, preservada em nota.
theological_decisions:
- issue: Se θεός no final deve ser traduzido como “Deus” ou “um deus”
  choice: Deus
  alternative: um deus
  rationale: O contexto apresenta a figura no templo de Deus reivindicando a mais elevada condição divina. “Deus” transmite melhor a força da pretensão blasfema sem afirmar que ela seja verdadeira; a possibilidade lexical “um deus” é mantida em nota.
- issue: Se ναός deve ser traduzido mais especificamente como “santuário”
  choice: templo de Deus
  alternative: santuário de Deus
  rationale: “Templo de Deus” é claro e natural, sem decidir se a referência é literal ou metafórica. “Santuário” preserva a possível especificidade de ναός e consta em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem e as relações lógicas do grego são preservadas sem rigidez; as ambiguidades de ναός e do θεός anartro final são registradas em notas.
