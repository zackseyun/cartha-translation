id: 2TH.2.1
reference: 2 Thessalonians 2:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, ὑπὲρ τῆς παρουσίας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡμῶν ἐπισυναγωγῆς ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/001.yaml
  text: We ask you[a], brothers, concerning the coming of our Lord Jesus the Messiah and our gathering together to him[b],
translation:
  language: pt
  text: Quanto à vinda de nosso Senhor Jesus, o Messias, e à nossa reunião com ele, pedimos a vocês, irmãos[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Irmãos» é a forma de tratamento usada por Paulo; neste contexto, ele provavelmente se dirige a toda a comunidade de fiéis.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: pedimos
  rationale: Introduz um apelo pastoral cortês, não uma ordem; em português, «pedimos a vocês» comunica naturalmente essa força.
- source_word: δὲ
  choice: Quanto a
  rationale: A partícula marca a transição para um assunto relacionado. A construção «Quanto a» realiza essa função em conjunto com ὑπέρ, sem introduzir contraste forte nem um «agora» temporal.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva a forma masculina do vocativo grego e o modo paulino de dirigir-se à comunidade; uma nota esclarece seu provável alcance contextual.
- source_word: ὑπὲρ
  choice: quanto a
  rationale: Introduz o assunto do apelo. «Quanto a» é claro, corrente e adequado ao registro da passagem.
- source_word: παρουσίας
  choice: vinda
  rationale: Neste contexto escatológico, designa a futura chegada ou manifestação de Jesus; «vinda» é a expressão portuguesa consagrada e clara.
- source_word: κυρίου
  choice: Senhor
  rationale: Preserva a autoridade do título e sua força teológica estabelecida no Novo Testamento.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Χριστός tem aqui força titular. «O Messias» traduz seu sentido, enquanto a aposição com vírgulas produz português natural.
- source_word: ἐπισυναγωγῆς
  choice: reunião
  rationale: Expressa o ajuntamento dos fiéis sem acrescentar conotações institucionais. O complemento «com ele» torna clara a orientação relacional do ajuntamento.
- source_word: ἐπ’ αὐτόν
  choice: com ele
  rationale: No contexto de ἐπισυναγωγή, a expressão indica a reunião dirigida a Cristo e em sua presença. «Com ele» é natural em português, embora «junto dele» também seja possível.
theological_decisions:
- issue: Tradução de Χριστοῦ no título cristológico
  choice: Messias
  alternative: Cristo
  rationale: Aqui Χριστός conserva sentido titular; traduzir «Messias» torna esse sentido transparente sem negar a forma tradicional «Cristo».
- issue: Alcance de ἀδελφοί
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A forma masculina do texto é preservada, enquanto a nota registra que, no contexto, Paulo provavelmente se dirige a toda a comunidade de fiéis.
- issue: Relação entre a vinda e a reunião dos fiéis
  choice: dois elementos coordenados sem definir sua relação temporal ou lógica exata
  alternative: nossa reunião por ocasião da vinda dele
  rationale: O grego une os dois substantivos com καί sob a mesma preposição, mas não identifica um com o outro nem explicita sua sequência. A tradução mantém a coordenação e evita impor um esquema escatológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A oração temática foi antecipada («Quanto à...»), uma ordem natural em português para reproduzir a transição marcada por δέ e o assunto introduzido por ὑπέρ. A coordenação entre a vinda e a reunião foi preservada sem explicar além do grego.
