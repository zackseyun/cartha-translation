id: 2TH.2.14
reference: 2 Thessalonians 2:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰς ⸀ὃ ἐκάλεσεν ὑμᾶς διὰ τοῦ εὐαγγελίου ἡμῶν, εἰς περιποίησιν δόξης τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/014.yaml
  text: to which he called you through our gospel[b][a], for obtaining the glory of our Lord Jesus the Messiah.
translation:
  language: pt
  text: Para isso ele chamou vocês por meio do nosso evangelho, a fim de alcançarem[b] a glória de nosso Senhor Jesus, o Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais tradicional, “Jesus Cristo”.
    reason: alternative_reading
  - marker: b
    text: “A fim de alcançarem a glória” também pode ser traduzido como “para tomarem posse da glória” ou “para participarem da glória” de nosso Senhor Jesus, o Messias.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Para isso
  rationale: Retoma o conjunto de ideias do versículo anterior e expressa o alvo do chamado sem definir de modo excessivamente restrito o antecedente do pronome relativo.
- source_word: ἐκάλεσεν ὑμᾶς
  choice: ele chamou vocês
  rationale: Mantém a formulação paulina ampla e direta, sem especificar se o chamado deve ser entendido segundo um sistema teológico particular.
- source_word: διὰ τοῦ εὐαγγελίου ἡμῶν
  choice: por meio do nosso evangelho
  rationale: Expressa o valor instrumental de διά com o genitivo e conserva a expressão apostólica “nosso evangelho”, isto é, o evangelho anunciado por eles.
- source_word: εἰς περιποίησιν
  choice: a fim de alcançarem
  rationale: Comunica com naturalidade o propósito ou alvo e o sentido de obtenção de περιποίησις, enquanto uma nota preserva as possibilidades de posse e participação.
- source_word: δόξης τοῦ κυρίου ἡμῶν
  choice: a glória de nosso Senhor
  rationale: Mantém a relação genitiva do grego e não decide indevidamente entre obter a glória pertencente ao Senhor e participar dela.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título semanticamente ativo e usa a forma idiomática portuguesa com artigo; a forma tradicional “Jesus Cristo” é registrada em nota.
theological_decisions:
- issue: Natureza do chamado divino
  choice: ele chamou vocês
  alternative: ele os chamou eficazmente; ele os convidou
  rationale: A tradução conserva a força salvífica do uso paulino sem importar a noção técnica de chamado irresistível nem reduzir o verbo a um simples convite.
- issue: Sentido de περιποίησις em relação à glória
  choice: a fim de alcançarem a glória
  alternative: para tomarem posse da glória; para participarem da glória
  rationale: “Alcançarem” representa adequadamente a ideia de obtenção, mas a amplitude lexical do substantivo e a relação exata com “glória” justificam preservar outras possibilidades em nota.
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Neste contexto, depois de “Senhor Jesus”, o caráter titular de Χριστός permanece perceptível; a tradução principal explicita seu sentido, enquanto a forma tradicional é mantida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa. A formulação conserva “nosso evangelho” como expressão paulina e mantém, por meio de nota, a ambiguidade de περιποίησις.
