  text: And then the lawless one will be revealed[a], whom the Lord Jesus will slay with the breath of his mouth and bring to nothing by the appearance of his coming[b],
translation:
  language: pt
  text: E então será revelado o iníquo, a quem o Senhor Jesus matará com o sopro de sua boca[a] e reduzirá a nada pela manifestação de sua vinda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com o espírito de sua boca”. A palavra grega pode significar tanto “sopro” como “espírito”; “sopro” se ajusta melhor à expressão neste contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pela manifestação de sua presença”. Neste contexto, “vinda” é o sentido mais provável de παρουσία, embora “presença” também faça parte do campo semântico da palavra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαλυφθήσεται
  choice: será revelado
  rationale: Preserva o futuro passivo e a linguagem de revelação, sem explicitar um agente que o grego não nomeia.
- source_word: ὁ ἄνομος
  choice: aquele que vive sem lei
  rationale: Expressa naturalmente em português o adjetivo substantivado e evita acrescentar «homem», palavra ausente neste versículo.
- source_word: ἀνελεῖ
  choice: matará
  rationale: Comunica de modo claro, atual e direto o sentido de tirar a vida; evita tanto um arcaísmo quanto o enfraquecimento para «eliminará».
- source_word: τῷ πνεύματι τοῦ στόματος αὐτοῦ
  choice: com o sopro de sua boca
  rationale: «Sopro» é o sentido mais natural de πνεῦμα nessa expressão e conserva a imagem profética, enquanto «espírito» permanece lexicalmente possível.
- source_word: καταργήσει
  choice: reduzirá a nada
  rationale: Transmite a anulação decisiva ou destituição de poder, sem restringir o verbo à ideia de aniquilação física.
- source_word: τῇ ἐπιφανείᾳ
  choice: pela manifestação
  rationale: Expressa uma aparição visível e pública com dignidade e naturalidade, sem acrescentar a noção interpretativa de esplendor.
- source_word: τῆς παρουσίας αὐτοῦ
  choice: de sua vinda
  rationale: No contexto escatológico, παρουσία normalmente indica chegada ou vinda; «presença» continua dentro do campo semântico e é registrada em nota.
theological_decisions:
- issue: Identidade e descrição do oponente escatológico
  choice: aquele que vive sem lei
  alternative: o iníquo; o homem da ilegalidade
  rationale: Mantém a forma adjetival substantivada deste versículo e não importa para ele a expressão mais extensa do contexto próximo.
- issue: Meio pelo qual o Senhor Jesus vence
  choice: com o sopro de sua boca
  alternative: com o espírito de sua boca
  rationale: «Sopro» se ajusta melhor à expressão e à imagem de juízo profético, mas a possível leitura «espírito» é preservada em nota.
- issue: Sentido escatológico de παρουσία
  choice: vinda
  alternative: presença
  rationale: «Vinda» é o sentido contextual mais provável, sem negar que o termo grego também possa denotar presença.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A estrutura mantém o paralelismo dos dois atos do Senhor Jesus e preserva as alternativas lexicais relevantes em notas.
