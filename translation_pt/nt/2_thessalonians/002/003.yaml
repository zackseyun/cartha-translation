id: 2TH.2.3
reference: 2 Thessalonians 2:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ⸀ἀνομίας, ὁ υἱὸς τῆς ἀπωλείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/003.yaml
  text: Let no one deceive you in any way[a], because that day will not come unless the rebellion comes first and the man of lawlessness is revealed[b], the son of destruction.
translation:
  language: pt
  text: Que ninguém engane vocês de modo algum, pois esse dia não virá sem que primeiro venha a rebelião[a] e seja revelado o homem da iniquidade[b], o filho da destruição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a apostasia” ou “o afastamento”. O termo grego pode indicar uma rebelião decisiva, muitas vezes entendida como abandono da fé.
    reason: alternative_reading
  - marker: b
    text: Alguns manuscritos trazem “o homem do pecado” em vez de “o homem da iniquidade”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξαπατήσῃ
  choice: engane
  rationale: Expressa de modo natural a ideia de enganar ou induzir ao erro, sem exagerar a força do prefixo.
- source_word: κατὰ μηδένα τρόπον
  choice: de modo algum
  rationale: Reproduz a proibição enfática em português claro e corrente.
- source_word: ὅτι
  choice: pois
  rationale: Introduz naturalmente a razão da advertência, preservando a ligação lógica com a oração anterior.
- source_word: ἐὰν μὴ ἔλθῃ
  choice: não virá sem que ... venha
  rationale: Torna explícito o sujeito elíptico, “esse dia”, recuperado do contexto imediato, e preserva a condição necessária.
- source_word: ἡ ἀποστασία
  choice: a rebelião
  rationale: Mantém o sentido amplo de revolta decisiva sem limitar indevidamente o termo à apostasia religiosa; a alternativa é registrada em nota.
- source_word: πρῶτον
  choice: primeiro
  rationale: Indica diretamente a sequência dos acontecimentos.
- source_word: ἀποκαλυφθῇ
  choice: seja revelado
  rationale: Preserva a voz passiva e a ressonância apocalíptica de algo ou alguém que se torna manifesto.
- source_word: ὁ ἄνθρωπος τῆς ἀνομίας
  choice: o homem da rebeldia
  rationale: ἀνομία denota desprezo ou violação da lei e pode ser traduzida naturalmente por “rebeldia” neste contexto. Mantém-se “homem” porque o grego é singular masculino e designa uma figura específica.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: o filho da destruição
  rationale: Conserva a forma semítica do grego e sua ambiguidade entre caracterização e destino, evitando explicá-la apenas como “destinado à destruição”.
theological_decisions:
- issue: Sujeito implícito de “não virá”
  choice: Suprir “esse dia” a partir do versículo anterior
  alternative: 'Manter a construção elíptica: “pois, sem que primeiro venha...”'
  rationale: O contexto identifica o referente como o dia do Senhor. Supri-lo produz português inteligível sem acrescentar uma interpretação alheia ao contexto imediato.
- issue: Sentido de ἀποστασία
  choice: a rebelião
  alternative: a apostasia; o afastamento
  rationale: O termo pode indicar rebelião, revolta ou apostasia. A opção ampla evita decidir prematuramente se o acontecimento é exclusivamente uma deserção religiosa, enquanto a nota conserva essa possibilidade.
- issue: Leitura textual em τῆς ἀνομίας
  choice: 'Seguir o SBLGNT: “da rebeldia”'
  alternative: “do pecado”, conforme variante manuscrita
  rationale: O texto-fonte fornecido traz ἀνομίας. A variante tradicional ἁμαρτίας é relevante e aparece em nota para transparência textual.
- issue: Força da expressão “filho da destruição”
  choice: Preservar o idioma semítico literalmente compreensível
  alternative: o destinado à destruição
  rationale: A formulação pode caracterizar a figura pela destruição e também sugerir seu destino. A tradução mantém essa tensão em vez de escolher apenas um sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” evita uma forma regional ou excessivamente solene; “de modo algum” mantém a ênfase. A estrutura conserva o encadeamento do grego sem produzir uma frase artificial.
