  text: καὶ νῦν τὸ κατέχον οἴδατε, εἰς τὸ ἀποκαλυφθῆναι αὐτὸν ἐν τῷ ⸀ἑαυτοῦ καιρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/006.yaml
  text: And now you know what is restraining him[b][a], so that he may be revealed in his own time.
translation:
  language: pt
  text: E agora vocês sabem o que o está impedindo[a], para que ele seja revelado no seu próprio tempo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que o está detendo”. O grego emprega uma expressão neutra e não identifica aqui a força que o impede.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “no tempo determinado para ele”. A expressão grega pode indicar um momento apropriado ou designado.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ κατέχον
  choice: o que o está impedindo
  rationale: A expressão substantivada neutra é traduzida de modo impessoal, sem identificar a força restritiva. “Impedindo” comunica a ideia de deter ou conter sem especificar o agente.
- source_word: οἴδατε
  choice: vocês sabem
  rationale: Traduz naturalmente o verbo de forma perfeita com sentido presente e mantém a referência de Paulo ao conhecimento prévio dos leitores.
- source_word: εἰς τὸ ἀποκαλυφθῆναι αὐτόν
  choice: para que ele seja revelado
  rationale: A construção com infinitivo articular pode indicar propósito ou resultado; esta formulação portuguesa é clara e conserva essa abertura contextual.
- source_word: ἐν τῷ ἑαυτοῦ καιρῷ
  choice: no seu próprio tempo
  rationale: Mantém tanto a referência reflexiva quanto a ideia temporal de καιρός, sem tornar explícita na tradução principal a noção interpretativa de um tempo designado.
- source_word: νῦν
  choice: agora
  rationale: Equivalente temporal direto e natural no contexto do discurso.
- source_word: αὐτόν
  choice: o / ele
  rationale: O pronome masculino retoma a figura mencionada anteriormente; o clítico em “o está impedindo” e “ele” preservam essa referência pessoal sem identificá-la além do texto.
theological_decisions:
- issue: Identidade daquilo ou daquele que restringe
  choice: Traduzir de modo neutro como “o que o está impedindo”, sem identificar o agente.
  alternative: O governo romano; o Espírito Santo; um poder angelical; o decreto ou a providência de Deus.
  rationale: O neutro τὸ κατέχον não identifica a força restritiva neste versículo. A tradução preserva a ambiguidade e não introduz uma conclusão doutrinária disputada.
- issue: Sentido de καιρός no contexto escatológico
  choice: “seu próprio tempo”
  alternative: “tempo determinado para ele” ou “momento apropriado”
  rationale: Embora καιρός possa denotar um momento apropriado ou determinado, a opção principal conserva a formulação menos interpretativa e deixa essa nuance para a nota.
- issue: Relação expressa por εἰς τό com infinitivo
  choice: “para que ele seja revelado”
  alternative: “resultando em que ele seja revelado” ou “até que ele seja revelado”
  rationale: A construção admite uma nuance de propósito ou resultado. “Para que” é idiomático e adequado, sem identificar explicitamente quem ordena o acontecimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa do plural. A ordem foi levemente ajustada à sintaxe natural do português, mantendo a ambiguidade do agente restritivo e do valor de καιρός.
