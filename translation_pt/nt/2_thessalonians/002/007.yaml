source:
  edition: SBLGNT
  text: τὸ γὰρ μυστήριον ἤδη ἐνεργεῖται τῆς ἀνομίας· μόνον ὁ κατέχων ἄρτι ἕως ἐκ μέσου γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/007.yaml
  text: For the mystery of lawlessness is already at work[b][a]; only the one who now restrains will do so until he is out of the way.
translation:
  language: pt
  text: Pois o mistério da iniquidade já está em ação; apenas aquele que agora restringe continuará a fazê-lo até que saia do caminho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até que seja removido” ou “até que seja tirado do caminho”. O grego é menos explícito quanto a como isso acontece.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: mistério
  rationale: Conserva o sentido paulino de uma realidade oculta que já está operando, sem reduzi-la a um simples enigma.
- source_word: ἐνεργεῖται
  choice: já está atuando
  rationale: Expressa de modo natural uma atividade presente e contínua que já se encontra em curso.
- source_word: ἀνομίας
  choice: iniquidade
  rationale: É uma forma consagrada e digna em português para a oposição à lei e à ordem de Deus; evita que “ilegalidade” seja entendida apenas em sentido civil ou criminal.
- source_word: μόνον
  choice: falta apenas que
  rationale: Introduz com naturalidade a ressalva limitadora e ajuda a representar a construção elíptica do grego em português corrente.
- source_word: ὁ κατέχων
  choice: aquele que agora o detém
  rationale: Mantém a figura sem identificá-la e traduz κατέχω como ação de deter ou conter. O pronome “o” retoma naturalmente o processo ligado à iniquidade no contexto.
- source_word: ἄρτι
  choice: agora
  rationale: Marca claramente o momento presente da atividade restritiva.
- source_word: ἕως ἐκ μέσου γένηται
  choice: até que saia do caminho
  rationale: Reproduz a expressão idiomática e evita introduzir um agente responsável por removê-lo, pois esse agente não é expresso no grego.
theological_decisions:
- issue: Identidade de ὁ κατέχων (“aquele que detém”)
  choice: Traduzir de maneira genérica como “aquele que agora o detém”, sem identificar a figura.
  alternative: O Estado romano, o governo humano, o Espírito Santo, um ser angelical, Paulo ou a pregação apostólica.
  rationale: O versículo menciona uma figura restritiva, mas não revela sua identidade. A tradução preserva essa ambiguidade escatológica.
- issue: Agência em ἕως ἐκ μέσου γένηται
  choice: Usar “até que saia do caminho”.
  alternative: “Até que seja removido” ou “até que seja tirado do caminho”.
  rationale: A construção grega indica que essa figura chegará a estar fora do meio ou do caminho, mas não declara explicitamente quem ou o que causará isso.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém a elipse e as ambiguidades do grego sem impor uma identificação denominacional à figura que detém nem especificar a agência de sua saída.
