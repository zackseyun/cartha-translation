- from: Pois o mistério da iniquidade já está atuando; falta apenas que aquele que agora o detém[a] continue assim até que saia do caminho.[b]
  to: Pois o mistério da iniquidade já está em ação; apenas aquele que agora restringe continuará a fazê-lo até que saia do caminho.[a]
  rationale: 'A revisão elimina o objeto acrescentado a «restringe», melhora a fluência da oração elíptica e mantém duas ambiguidades do grego: a identidade daquele que restringe e a agência ou o modo de sua saída. A nota anterior sobre a identidade do restritor não é necessária, pois o texto revisto já o apresenta genericamente; a única nota preservada registra alternativas relevantes para ἕως ἐκ μέσου γένηται.'
