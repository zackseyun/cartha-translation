base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/010.yaml
  text: and with every deception of unrighteousness for those who are perishing[d][c][b][a], because they did not accept the love of the truth so as to be saved.
translation:
  language: pt
  text: e com todo engano da injustiça, para os que estão perecendo[a], porque não acolheram o amor da verdade[b], para serem salvos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre os que estão perecendo”.'
    reason: lexical_alternative
  - marker: b
    text: 'O contexto favorece: “amor pela verdade”; ou: “não receberam” ou “não aceitaram o amor da verdade”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “para que fossem salvos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτῃ
  choice: engano
  rationale: Expressa o sentido de fraude ou ação enganosa e combina naturalmente com ἐν πάσῃ, sem sugerir apenas um estado mental interno.
- source_word: ἀδικίας
  choice: da injustiça
  rationale: Preserva o substantivo e a construção genitiva do grego, mantendo sua força moral ampla; a relação também pode ser expressa idiomaticamente como “engano injusto”.
- source_word: τοῖς ἀπολλυμένοις
  choice: entre os que estão perecendo
  rationale: Representa o particípio presente como uma condição em curso e entende o dativo como o âmbito em que o engano atua, sem convertê-lo em um rótulo determinista.
- source_word: ἀνθ’ ὧν
  choice: porque
  rationale: Comunica de modo natural a força causal da expressão no contexto, em vez do mais literal e menos claro “em retribuição pelo fato de que”.
- source_word: ἀγάπην τῆς ἀληθείας
  choice: o amor da verdade
  rationale: Mantém a forma genitiva e a tensão da expressão grega, embora o contexto favoreça o sentido de amor pela verdade.
- source_word: ἐδέξαντο
  choice: acolheram
  rationale: δέχομαι pode significar receber, aceitar ou acolher. “Acolher” transmite tanto recepção quanto disposição favorável diante da verdade.
- source_word: εἰς τὸ σωθῆναι αὐτούς
  choice: para serem salvos
  rationale: Reproduz com clareza a orientação para propósito ou resultado do infinitivo articular com εἰς e preserva a voz passiva.
theological_decisions:
- issue: Se τοῖς ἀπολλυμένοις descreve um destino fixado ou uma condição em curso
  choice: os que estão perecendo
  alternative: os condenados; os que estão sendo destruídos
  rationale: O particípio presente é representado como processo em curso, evitando impor ao texto uma formulação determinista que ele não explicita.
- issue: Se τὴν ἀγάπην τῆς ἀληθείας significa amor pela verdade ou amor proveniente da verdade
  choice: o amor da verdade
  alternative: o amor pela verdade
  rationale: A construção genitiva é preservada no texto. O contexto favorece o sentido objetivo, isto é, amor pela verdade, mas a tradução não elimina inteiramente a forma e a tensão do original.
- issue: Se εἰς τὸ σωθῆναι expressa propósito ou resultado
  choice: para serem salvos
  alternative: de modo que fossem salvos
  rationale: A formulação portuguesa mantém aberta a proximidade entre propósito e resultado sem definir uma sequência soteriológica além do que a construção grega permite.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Mantêm-se “injustiça”, “perecendo” e “amor da verdade” para preservar os vínculos formais e teológicos do grego, enquanto “acolheram” evita rigidez excessiva.
