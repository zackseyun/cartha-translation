translation:
  language: pt
  text: encoraje os corações de vocês e fortaleça vocês em toda boa obra e palavra[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “console os corações de vocês”; o verbo grego também pode ter o sentido de “consolar” ou “exortar”.
