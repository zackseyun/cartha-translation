  - marker: b
    text: Ou “os torne firmes” ou “os estabeleça” em toda boa obra e palavra.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: encoraje
  rationale: No contexto desta oração, retoma o encorajamento eterno do versículo 16 e mantém um sentido amplo, sem restringir o verbo apenas a consolo emocional ou exortação moral.
- source_word: ὑμῶν τὰς καρδίας
  choice: o coração de vocês
  rationale: Preserva a metáfora antropológica bíblica para a interioridade humana; o singular coletivo é mais natural em português com a expressão “de vocês”.
- source_word: στηρίξαι
  choice: fortaleça
  rationale: Comunica em português corrente a ideia de tornar firme, consolidar ou confirmar.
- source_word: ἐν παντὶ
  choice: em toda
  rationale: Mantém a esfera em que ocorre o fortalecimento e concorda naturalmente com os substantivos coordenados.
- source_word: ἔργῳ
  choice: obra
  rationale: Representa de modo direto ação ou feito e conserva o paralelo conciso com “palavra”.
- source_word: λόγῳ
  choice: palavra
  rationale: Preserva a formulação bíblica e, em paralelo com “obra”, refere-se ao que é dito.
- source_word: ἀγαθῷ
  choice: boa
  rationale: 'O adjetivo singular tem alcance semântico sobre os dois substantivos coordenados: toda obra e palavra que sejam boas.'
theological_decisions:
- issue: Sentido de καρδία
  choice: coração
  alternative: interior; mente
  rationale: Preserva a metáfora bíblica sem reduzi-la a emoções ou intelecto.
- issue: Amplitude de παρακαλέω
  choice: encoraje
  alternative: console; exorte
  rationale: “Encoraje” se ajusta à oração e à ligação com o versículo 16, mantendo uma amplitude que pode incluir consolo e estímulo.
- issue: Sentido de στηρίζω
  choice: fortaleça
  alternative: firme; confirme
  rationale: É natural e acessível, ao mesmo tempo que transmite a ideia de tornar alguém firme.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A colocação pronominal em “os fortaleça” é natural no contexto coordenado. O versículo é continuação sintática do anterior, por isso começa com minúscula.
