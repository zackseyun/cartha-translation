source:
  edition: SBLGNT
  text: ἵνα κριθῶσιν ⸀πάντες οἱ μὴ πιστεύσαντες τῇ ἀληθείᾳ ἀλλὰ εὐδοκήσαντες ⸀τῇ ἀδικίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/012.yaml
  text: so that all may be judged who did not believe the truth but took pleasure in unrighteousness[a].
translation:
  language: pt
  text: para que sejam julgados todos os que não creram na verdade, mas tiveram prazer na injustiça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sejam condenados”. Neste contexto, o verbo grego pode indicar um julgamento desfavorável, embora seu sentido mais literal seja “sejam julgados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade ou o resultado ligado ao contexto anterior, sem definir de modo excessivo qual dessas nuances predomina.
- source_word: κριθῶσιν
  choice: sejam julgados
  rationale: Preserva o sentido judicial básico de κρίνω; embora o contexto indique um juízo desfavorável, “condenados” tornaria explícito algo que o verbo, isoladamente, não exige.
- source_word: πάντες
  choice: todos
  rationale: Correspondência direta e natural para o plural abrangente.
- source_word: οἱ μὴ πιστεύσαντες
  choice: os que não creram
  rationale: Traduz naturalmente o particípio aoristo substantivado e mantém a ideia de recusa em crer.
- source_word: τῇ ἀληθείᾳ
  choice: na verdade
  rationale: O verbo português “crer” rege naturalmente “em”; o artigo definido conserva a referência provável à verdade do evangelho.
- source_word: ἀλλὰ
  choice: mas
  rationale: Expressa com clareza o forte contraste entre não crer na verdade e ter prazer na injustiça.
- source_word: εὐδοκήσαντες
  choice: tiveram prazer
  rationale: Comunica o componente volitivo e afetivo do verbo, mais do que mera aprovação intelectual.
- source_word: τῇ ἀδικίᾳ
  choice: na injustiça
  rationale: “Injustiça” é uma tradução corrente e digna de ἀδικία, abrangendo aquilo que é contrário à justiça; mantém a formulação sem restringi-la apenas a atos específicos de maldade.
theological_decisions:
- issue: Se κριθῶσιν deve ser traduzido por “sejam julgados” ou pelo mais interpretativo “sejam condenados”
  choice: sejam julgados
  alternative: sejam condenados
  rationale: O contexto é claramente desfavorável, mas κρίνω designa mais amplamente o ato de julgar. A tradução principal preserva essa amplitude e deixa que o contexto comunique o resultado adverso.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Creram na verdade” soa natural e conserva a referência definida do grego. “Injustiça” mantém o registro moral e teológico de ἀδικία sem recorrer ao menos corrente “iniquidade”.
