source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ὀφείλομεν εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου, ὅτι εἵλατο ὑμᾶς ὁ θεὸς ⸀ἀπαρχὴν εἰς σωτηρίαν ἐν ἁγιασμῷ πνεύματος καὶ πίστει ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/013.yaml
  text: But we ought always to give thanks to God for you[a], brothers beloved by the Lord, because God chose you as firstfruits for salvation through sanctification by the Spirit and faith in the truth[b],
translation:
  language: pt
  text: Mas nós devemos sempre dar graças a Deus por vocês, irmãos[a] amados pelo Senhor, porque Deus os escolheu como primícias[b] para a salvação, por meio da santificação do Espírito[c] e da fé na verdade,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” traduz o masculino plural ἀδελφοί; neste tipo de tratamento, a palavra pode incluir toda a comunidade de fiéis, tanto homens como mulheres.
    reason: cultural_note
  - marker: b
    text: 'Alguns manuscritos trazem: “porque Deus os escolheu desde o princípio para a salvação”. O texto principal segue a leitura “como primícias” (ἀπαρχήν); a alternativa corresponde a ἀπ’ ἀρχῆς (“desde o princípio”).'
    reason: textual_variant
  - marker: c
    text: 'Ou: “do espírito”, com possível referência ao espírito humano. O contexto favorece aqui uma referência ao Espírito Santo.'
    reason: translation_ambiguity
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: Mas nós
  rationale: O δέ contrasta esta afirmação com a descrição anterior, e o pronome explícito Ἡμεῖς recebe expressão natural e enfática em português.
- source_word: ὀφείλομεν
  choice: devemos
  rationale: Expressa obrigação moral ou dever apropriado sem acrescentar uma ideia de coerção externa.
- source_word: εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν
  choice: sempre dar graças a Deus por vocês
  rationale: Reproduz de maneira corrente e clara a fórmula paulina de ação de graças, com boa legibilidade brasileira.
- source_word: ἀδελφοὶ
  choice: irmãos
  rationale: Mantém a forma masculina plural do grego; uma nota esclarece que a expressão pode abranger toda a comunidade cristã.
- source_word: ἠγαπημένοι ὑπὸ κυρίου
  choice: amados pelo Senhor
  rationale: Preserva o valor passivo do particípio e sua função adjetiva, em linguagem natural e digna.
- source_word: εἵλατο
  choice: escolheu
  rationale: Traduz diretamente o sentido de αἱρέομαι no contexto, sem desenvolver uma doutrina específica de eleição.
- source_word: ἀπαρχὴν
  choice: como primícias
  rationale: Segue a leitura impressa do SBLGNT e conserva a metáfora cultual de primeiros frutos; a variante textual é registrada em nota.
- source_word: εἰς σωτηρίαν
  choice: para a salvação
  rationale: Comunica o alvo ou resultado indicado por εἰς com o acusativo.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: por meio da santificação do Espírito
  rationale: Entende ἐν em sentido instrumental e, pelo contexto soteriológico paulino, toma πνεύματος primariamente como referência ao Espírito Santo, registrando a alternativa em nota.
- source_word: καὶ πίστει ἀληθείας
  choice: e da fé na verdade
  rationale: 'Interpreta o genitivo ἀληθείας de modo objetivo: a verdade é aquilo em que se deposita fé.'
theological_decisions:
- issue: Referência de πνεύματος em ἐν ἁγιασμῷ πνεύματος
  choice: Espírito Santo
  alternative: espírito humano
  rationale: O contexto de salvação e santificação favorece a ação do Espírito Santo, indicada pela inicial maiúscula; como a forma grega por si só permite a outra leitura, ela é preservada em nota.
- issue: Alcance de εἵλατο ὑμᾶς ὁ θεὸς
  choice: Deus os escolheu
  alternative: Deus os tomou para si
  rationale: A formulação conserva a afirmação de escolha divina sem acrescentar um sistema denominacional sobre eleição.
- issue: Leitura textual ἀπαρχὴν
  choice: como primícias
  alternative: desde o princípio
  rationale: O texto principal segue o SBLGNT; a variante ἀπ’ ἀρχῆς, bem atestada na tradição manuscrita, permanece acessível em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe de ampla compreensão e boa legibilidade brasileira. Emprega “vocês/os” em vez de formas lusitanas com “vós”, conserva “primícias” por sua precisão metafórica e mantém a vírgula final porque o versículo continua sintaticamente no seguinte.
