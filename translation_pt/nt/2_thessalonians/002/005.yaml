lexical_decisions:
- source_word: μνημονεύετε
  choice: se lembram
  rationale: Expressa de modo natural em português a retenção de uma instrução anterior na memória; o presente funciona bem na pergunta retórica.
- source_word: ἔτι ὢν πρὸς ὑμᾶς
  choice: quando eu ainda estava com vocês
  rationale: Comunica claramente a circunstância temporal e a presença pessoal de Paulo entre os leitores, preservando a força de ἔτι.
- source_word: ταῦτα
  choice: essas coisas
  rationale: Mantém o plural do demonstrativo e remete naturalmente aos assuntos já mencionados por Paulo.
- source_word: ἔλεγον
  choice: costumava lhes dizer
  rationale: Representa o aspecto imperfeito do verbo, sugerindo ensino repetido ou habitual no passado, sem exagerar a frequência.
- source_word: οὐ ... ὅτι
  choice: não se lembram de que ...?
  rationale: Preserva a pergunta retórica negativa e introduz de maneira idiomática em português o conteúdo a ser lembrado.
