lexical_decisions:
- source_word: ἀλλὰ πολλῷ μᾶλλον
  choice: Muito pelo contrário
  rationale: A expressão combina contraste corretivo com intensificação explícita. “Muito pelo contrário” é natural em português e preserva a força de πολλῷ μᾶλλον sem deslocá-la inequivocamente para o grau de necessidade.
- source_word: τὰ δοκοῦντα
  choice: que parecem ser
  rationale: Mantém a distinção entre aparência ou avaliação humana e a realidade afirmada pelo predicado.
- source_word: μέλη
  choice: membros
  rationale: Conserva o termo recorrente na metáfora paulina do corpo e é compreensível em português, embora “partes” também seja possível.
- source_word: τοῦ σώματος
  choice: do corpo
  rationale: Reproduz diretamente o genitivo que identifica o todo ao qual pertencem os membros.
- source_word: ἀσθενέστερα
  choice: mais fracos
  rationale: Expressa naturalmente o comparativo e não especifica se a fraqueza percebida é física, social ou funcional.
- source_word: ὑπάρχειν
  choice: ser
  rationale: Com δοκοῦντα, forma em português a construção idiomática “parecem ser”.
- source_word: ἀναγκαῖά ἐστιν
  choice: são necessários
  rationale: Preserva de modo direto a afirmação de necessidade; “indispensáveis” seria uma alternativa legítima e um pouco mais enfática.
theological_decisions:
- issue: Força metafórica da imagem do corpo no contexto da igreja
  choice: Manter a imagem concreta dos membros do corpo sem explicá-la como referência direta aos integrantes da igreja dentro do versículo.
  alternative: Traduzir interpretativamente como “as pessoas da igreja” ou expressão semelhante.
  rationale: O contexto aplica a metáfora à comunidade, mas o versículo continua formulado em termos do corpo. Preservar essa linguagem evita transformar a tradução em comentário.
- issue: Âmbito de “parecem ser mais fracos”
  choice: Preservar a percepção de fraqueza sem definir sua natureza.
  alternative: Especificar fraqueza social, funcional ou honorífica.
  rationale: O grego não determina aqui em que sentido esses membros parecem mais fracos; explicitar uma categoria resolveria indevidamente a abertura da metáfora.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Muito pelo contrário” reúne de forma idiomática o contraste e a intensificação do grego; “membros” mantém a coesão da metáfora paulina.
