  text: If all were one member, where would the body be?
translation:
  language: pt
  text: Se todos fossem uma só parte, onde estaria o corpo?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: Se
  rationale: Introduz naturalmente em português a condição hipotética do argumento.
- source_word: δὲ
  choice: —
  rationale: Funciona como conectivo leve no fluxo retórico; o contraste já fica claro em português sem conjunção explícita.
- source_word: ἦν
  choice: fossem
  rationale: O imperfeito de εἰμί integra uma hipótese irreal ou contrária ao quadro real; o imperfeito do subjuntivo é a construção idiomática após «se» em português.
- source_word: τὰ πάντα
  choice: todos
  rationale: No contexto, refere-se coletivamente a todos os membros ou partes, não a todas as coisas em sentido abstrato.
- source_word: ἓν μέλος
  choice: uma só parte
  rationale: «Parte» comunica com clareza μέλος como parte do corpo, enquanto «uma só» preserva a ênfase numeral de ἓν. Evita a possível leitura institucional de «membro» sem perder a metáfora corporal.
- source_word: ποῦ τὸ σῶμα
  choice: onde estaria o corpo?
  rationale: Mantém a pergunta retórica e expressa de modo natural a inexistência do corpo na situação hipotética.
theological_decisions:
- issue: Extensão da metáfora do corpo
  choice: Manter apenas «o corpo»
  alternative: Explicitar «o corpo de Cristo» ou «a igreja»
  rationale: Embora o contexto aplique a metáfora à comunidade cristã, o versículo diz somente τὸ σῶμα. A tradução não acrescenta uma especificação teológica ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação concisa conserva a estrutura condicional e a força retórica do grego.
