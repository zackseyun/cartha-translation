source:
  edition: SBLGNT
  text: καὶ ἐὰν εἴπῃ τὸ οὖς· Ὅτι οὐκ εἰμὶ ὀφθαλμός, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/016.yaml
  text: And if the ear says[a], ‘Because I am not an eye, I am not of the body,’ it is not for this reason not of the body.
translation:
  language: pt
  text: 'E, se o ouvido disser[a]: “Porque não sou olho, não faço parte do corpo”, nem por isso deixa de fazer parte do corpo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “não sou do corpo” ... “nem por isso não é do corpo”. O grego repete a mesma expressão para dar força ao argumento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conjunção simples que liga este exemplo ao do versículo anterior.
- source_word: ἐὰν εἴπῃ
  choice: se ... disser
  rationale: A construção com ἐὰν e subjuntivo apresenta uma hipótese; em português, o futuro do subjuntivo é a forma natural.
- source_word: τὸ οὖς
  choice: o ouvido
  rationale: Mantém o termo anatômico comum e sua personificação na analogia.
- source_word: Ὅτι
  choice: Porque
  rationale: 'Introduz a alegação com nuance causal: a suposta falta de pertencimento decorre de não ser olho.'
- source_word: ὀφθαλμός
  choice: olho
  rationale: Equivalente anatômico direto e idiomático em função predicativa.
- source_word: ἐκ τοῦ σώματος
  choice: fazer parte do corpo
  rationale: Neste contexto, ἐκ τοῦ σώματος expressa pertencimento. A formulação idiomática evita o português pouco natural “ser do corpo” e é repetida semanticamente nas duas ocorrências.
- source_word: οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: nem por isso deixa de fazer parte do corpo
  rationale: Reproduz com clareza a refutação enfática da conclusão, preservando as duas negações por meio da construção portuguesa “nem por isso deixa de”.
theological_decisions:
- issue: Pertencimento na metáfora do corpo
  choice: Traduzir ambas as ocorrências de ἐκ τοῦ σώματος como “fazer parte do corpo”
  alternative: “ser do corpo” ou “pertencer ao corpo”
  rationale: A escolha explicita apenas o sentido lexical contextual de pertencimento e mantém a repetição retórica, sem acrescentar uma identificação doutrinária que não esteja expressa neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção “nem por isso deixa de” conserva a lógica negativa do grego sem produzir uma frase artificial.
