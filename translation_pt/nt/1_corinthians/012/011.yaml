  text: πάντα δὲ ταῦτα ἐνεργεῖ τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα, διαιροῦν ἰδίᾳ ἑκάστῳ καθὼς βούλεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/011.yaml
  text: But one and the same Spirit works all these things[d][c][b][a], distributing to each one individually just as he wills.
translation:
  language: pt
  text: Mas um só e o mesmo Espírito realiza todas essas coisas[a], distribuindo a cada um individualmente[b], conforme quer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «produz» ou «opera» todas essas coisas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «repartindo a cada um individualmente».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «conforme escolhe». O verbo grego pode indicar querer, escolher ou desejar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ ταῦτα
  choice: Mas todas essas coisas
  rationale: Mantém a totalidade enfática de πάντα...ταῦτα e usa «mas» para a transição levemente contrastiva entre a diversidade recém-enumerada e sua única fonte.
- source_word: ἐνεργεῖ
  choice: são realizadas por
  rationale: Expressa a operação causal e ativa do Espírito em português natural; a construção passiva também permite conservar «todas essas coisas» em posição de destaque.
- source_word: τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα
  choice: o único e mesmo Espírito
  rationale: Reproduz a ênfase grega na identidade e unidade da fonte dos diversos dons. A inicial maiúscula sinaliza o Espírito Santo no contexto paulino.
- source_word: διαιροῦν
  choice: que as distribui
  rationale: O particípio explica como o Espírito realiza essas coisas. «Distribui» preserva a ideia de repartição sem sugerir fragmentação negativa; o objeto «as» retoma naturalmente «essas coisas».
- source_word: ἰδίᾳ ἑκάστῳ
  choice: individualmente a cada um
  rationale: Conserva tanto a aplicação individual expressa por ἰδίᾳ quanto o sentido distributivo singular de ἑκάστῳ.
- source_word: καθὼς βούλεται
  choice: conforme ele quer
  rationale: Comunica o padrão determinado pela vontade ou escolha do próprio Espírito em linguagem atual e digna.
theological_decisions:
- issue: Referente e agência pessoal de πνεῦμα / βούλεται
  choice: «Espírito» refere-se ao Espírito Santo, e «ele» torna explícita sua agência pessoal.
  alternative: Omitir o pronome («conforme quer») ou empregar formulação impessoal.
  rationale: Embora πνεῦμα seja gramaticalmente neutro em grego, βούλεται atribui vontade ao Espírito. O contexto apresenta o Espírito como agente pessoal que distribui os dons, sem exigir uma explicação doutrinária adicional no corpo do versículo.
- issue: Alcance de ἐνεργεῖ em relação aos dons
  choice: «são realizadas pelo» apresenta o Espírito como agente de todas as manifestações mencionadas.
  alternative: «opera» ou «produz todas essas coisas».
  rationale: A tradução preserva a forte agência causal do texto sem definir o mecanismo pelo qual cada manifestação ocorre.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. «O único e mesmo Espírito» conserva a ênfase do grego sem soar arcaico. A ordem das notas segue os elementos a que se referem no texto.
