  text: Καὶ γὰρ τὸ σῶμα οὐκ ἔστιν ἓν μέλος ἀλλὰ πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/014.yaml
  text: For the body is not one member, but many.
translation:
  language: pt
  text: Pois o corpo não é um só membro, mas muitos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Pois
  rationale: A combinação introduz uma explicação que dá continuidade ao argumento anterior. “Pois” expressa naturalmente essa força explicativa em português, sem reproduzir mecanicamente as duas partículas.
- source_word: τὸ σῶμα
  choice: o corpo
  rationale: Tradução direta do sujeito, preservando a metáfora corporal de Paulo sem explicá-la no próprio texto.
- source_word: οὐκ ἔστιν
  choice: não é
  rationale: Reproduz de modo simples e direto a cópula negada, sem acrescentar a ideia explícita de composição.
- source_word: ἓν μέλος
  choice: um só membro
  rationale: “Membro” preserva a imagem do corpo e mantém a conexão lexical com o contexto. “Um só” expressa com naturalidade o contraste enfático entre ἓν e πολλά.
- source_word: ἀλλὰ πολλά
  choice: mas muitos
  rationale: Mantém a elipse do grego, no qual “membros” fica subentendido, e continua claro em português por concordar com “membro” na oração anterior.
theological_decisions:
- issue: Referência metafórica de “o corpo”
  choice: Manter “o corpo” sem expansão interpretativa.
  alternative: “o corpo de Cristo”
  rationale: Embora o contexto mais amplo aplique a imagem à comunidade como corpo de Cristo, este versículo diz apenas “o corpo”. A tradução preserva a formulação do texto e deixa que o contexto esclareça a referência.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A redação conserva a concisão e o paralelismo do grego. Não são necessárias notas de rodapé.
