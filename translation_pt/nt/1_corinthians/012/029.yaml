id: 1CO.12.29
reference: 1 Corinthians 12:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ πάντες ἀπόστολοι; μὴ πάντες προφῆται; μὴ πάντες διδάσκαλοι; μὴ πάντες δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/029.yaml
  text: Not all are apostles[a], are they? Not all are prophets, are they? Not all are teachers, are they? Not all work miracles, do they?
translation:
  language: pt
  text: Por acaso todos são apóstolos? Por acaso todos são profetas? Por acaso todos são mestres? Por acaso todos realizam milagres[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «poderes» ou «obras poderosas». Aqui o grego emprega o termo como referência abreviada a feitos milagrosos ou àqueles que os realizam.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: Será que... ?
  rationale: Nas quatro perguntas, μή indica que se espera uma resposta negativa. A construção «Será que todos...?» comunica isso com naturalidade em português sem transformar a expectativa retórica em uma afirmação explícita.
- source_word: πάντες
  choice: todos
  rationale: Preserva a repetição enfática do grego e destaca que nem todos os membros do corpo exercem a mesma função ou manifestação.
- source_word: ἀπόστολοι
  choice: apóstolos
  rationale: É o equivalente corrente para a função reconhecida no contexto paulino, mais adequado aqui do que o sentido genérico de «mensageiros».
- source_word: προφῆται
  choice: profetas
  rationale: Equivalente direto e natural para aqueles que profetizam no contexto da comunidade cristã.
- source_word: διδάσκαλοι
  choice: mestres
  rationale: Termo claro e tradicional, de leitura atual, para os que exercem a função de ensinar.
- source_word: δυνάμεις
  choice: realizam milagres
  rationale: O substantivo plural significa literalmente «poderes» ou «obras poderosas», mas nesta série funciona de modo metonímico para a realização de feitos milagrosos. A forma verbal torna o sentido inteligível sem dizer que as próprias pessoas são «poderes».
theological_decisions:
- issue: Sentido de δυνάμεις no último item da série
  choice: realizam milagres
  alternative: são operadores de feitos poderosos / têm poderes milagrosos
  rationale: A tradução expressa a função ou manifestação indicada pelo substantivo grego sem definir a natureza, a duração ou a distribuição teológica desse dom além do que o versículo afirma.
- issue: Força retórica das quatro perguntas com μή
  choice: Será que todos...?
  alternative: Por acaso todos são...? / Nem todos são..., não é?
  rationale: A formulação escolhida preserva perguntas que esperam resposta negativa e mantém a tensão retórica, sem substituir as perguntas por declarações.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «Será que todos» reproduz a cadência retórica do original. O marcador da nota foi colocado no último item, ao qual δυνάμεις e a explicação lexical pertencem.
