reference: 1 Corinthians 12:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Διαιρέσεις δὲ χαρισμάτων εἰσίν, τὸ δὲ αὐτὸ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/004.yaml
  text: There are varieties of gifts[a], but the same Spirit.
translation:
  language: pt
  text: Há diferentes tipos de dons[a], mas o Espírito é o mesmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “distribuições” ou “diferenças de dons”. O grego enfatiza a diversidade entre os dons, não a divisão na igreja.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαιρέσεις
  choice: diferentes tipos
  rationale: Neste contexto, o substantivo indica distinções ou diversidade entre os dons, não facções na igreja. “Diferentes tipos” comunica isso com clareza em português atual.
- source_word: δὲ ... δὲ
  choice: mas
  rationale: O primeiro δέ tem leve função de transição e não precisa ser explicitado em português; o segundo estabelece o contraste entre a diversidade dos dons e a identidade do Espírito, sendo traduzido por “mas”.
- source_word: χαρισμάτων
  choice: dons
  rationale: χάρισμα designa aqui dádivas ou capacitações concedidas pela graça. “Dons” é a forma mais clara, natural e consagrada em português, sem exigir que a nuance da graça seja expandida no texto principal.
- source_word: τὸ ... αὐτὸ
  choice: é o mesmo
  rationale: A expressão ressalta a identidade do Espírito em meio à diversidade. A construção predicativa “o Espírito é o mesmo” é natural em português e preserva a ênfase.
- source_word: πνεῦμα
  choice: Espírito
  rationale: O contexto imediato identifica o Espírito Santo como a fonte dos dons; a inicial maiúscula sinaliza esse referente sem acrescentar uma expansão interpretativa ao versículo.
theological_decisions:
- issue: Referente de πνεῦμα
  choice: Espírito Santo
  alternative: espírito humano ou princípio/poder espiritual
  rationale: Em 1 Coríntios 12:3-11, o Espírito distribui os dons e é apresentado como agente divino. “Espírito”, com inicial maiúscula, representa o referente contextual sem inserir “Santo”, ausente neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem “o Espírito é o mesmo” evita uma frase nominal pouco idiomática e mantém o contraste entre diversidade e unidade.
