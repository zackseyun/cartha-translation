  text: διὸ γνωρίζω ὑμῖν ὅτι οὐδεὶς ἐν πνεύματι θεοῦ λαλῶν λέγει· Ἀνάθεμα ⸀Ἰησοῦς, καὶ οὐδεὶς δύναται εἰπεῖν· ⸂Κύριος Ἰησοῦς⸃ εἰ μὴ ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/003.yaml
  text: Therefore I make known to you that no one speaking by the Spirit of God says[a], “Jesus is accursed,” and no one is able to say[b], “Jesus is Lord,” except by the Holy Spirit.
translation:
  language: pt
  text: 'Portanto, faço saber a vocês que ninguém que fala pelo Espírito de Deus diz: “Jesus é maldito”[a]; e ninguém pode dizer: “Jesus é Senhor”[b], a não ser pelo Espírito Santo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Maldito seja Jesus”, refletindo a força possível da exclamação grega Ἀνάθεμα Ἰησοῦς.'
    reason: lexical_alternative
  - marker: b
    text: 'Em grego, literalmente: “Senhor Jesus”; no contexto, o sentido é confessional: “Jesus é Senhor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Portanto
  rationale: Preserva a ligação inferencial com a discussão anterior em linguagem natural e digna.
- source_word: γνωρίζω ὑμῖν
  choice: faço saber a vocês
  rationale: Reproduz o sentido causativo de γνωρίζω sem acrescentar uma nuance volitiva ausente no grego.
- source_word: ἐν πνεύματι θεοῦ
  choice: pelo Espírito de Deus
  rationale: Expressa de modo claro o provável valor instrumental ou de agência de ἐν neste contexto.
- source_word: λαλῶν λέγει
  choice: que fala ... diz
  rationale: Mantém a distinção verbal do grego de maneira compreensível em português.
- source_word: Ἀνάθεμα Ἰησοῦς
  choice: Jesus é maldito
  rationale: Traduz naturalmente a exclamação nominal, suprindo a cópula implícita sem convertê-la em imperativo.
- source_word: δύναται εἰπεῖν
  choice: pode dizer
  rationale: Equivalente português direto e natural para a ideia de capacidade ou possibilidade.
- source_word: Κύριος Ἰησοῦς
  choice: Jesus é Senhor
  rationale: O contexto exige que a expressão nominal seja entendida como conteúdo confessional; a cópula implícita torna isso claro em português.
- source_word: εἰ μὴ
  choice: a não ser
  rationale: Marca com naturalidade a única exceção à declaração negativa anterior.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: pelo Espírito Santo
  rationale: Mantém paralelismo com a expressão anterior e comunica a agência do Espírito.
theological_decisions:
- issue: Sentido de κύριος na confissão Κύριος Ἰησοῦς
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” preserva tanto o sentido do título quanto seu peso cristológico no contexto paulino, sem explicitar além do texto suas implicações teológicas.
- issue: Alcance da capacitação espiritual para dizer “Jesus é Senhor”
  choice: Manter a afirmação sem definir se se refere apenas à pronúncia sincera ou a uma doutrina completa da conversão
  alternative: Restringir a uma confissão sincera ou expandir para uma formulação sistemática sobre regeneração
  rationale: O texto vincula a confissão do senhorio de Jesus à ação do Espírito Santo, mas não desenvolve aqui todos os contornos doutrinários dessa relação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação conserva tom digno e claro, usa “a vocês” para ὑμῖν e preserva o paralelismo entre “pelo Espírito de Deus” e “pelo Espírito Santo”.
