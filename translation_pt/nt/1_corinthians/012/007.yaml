  text: ἑκάστῳ δὲ δίδοται ἡ φανέρωσις τοῦ πνεύματος πρὸς τὸ συμφέρον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/007.yaml
  text: But to each one the manifestation of the Spirit is given for the common good[a].
translation:
  language: pt
  text: Mas a cada um é dada a manifestação do Espírito para o bem comum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para o que é benéfico» ou «para o benefício de todos».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστῳ
  choice: a cada um
  rationale: Preserva com clareza a força distributiva do dativo singular, referindo-se a cada pessoa no corpo.
- source_word: δὲ
  choice: Mas
  rationale: Expressa a leve transição ou contraste com a diversidade mencionada nos versículos anteriores, sem exagerar a oposição.
- source_word: δίδοται
  choice: é dada
  rationale: Mantém o presente, a voz passiva e a ideia de dom, em formulação direta e natural.
- source_word: φανέρωσις
  choice: manifestação
  rationale: Indica aquilo que torna evidente ou visível a atuação do Espírito; é preciso e adequado ao contexto dos dons espirituais.
- source_word: τοῦ πνεύματος
  choice: do Espírito
  rationale: Segue de perto o grego sem acrescentar «Santo»; o contexto identifica claramente o referente como o Espírito Santo.
- source_word: πρὸς τὸ συμφέρον
  choice: para o bem comum
  rationale: Expressa naturalmente a finalidade benéfica e, no contexto do corpo e da edificação mútua, sua orientação comunitária.
theological_decisions:
- issue: Referente de «Espírito»
  choice: A expressão refere-se ao Espírito Santo, traduzida como «do Espírito».
  alternative: Entender πνεῦμα de modo genérico como «espírito».
  rationale: O contexto imediato atribui os dons ao mesmo Espírito (1Co 12.4,8–11). A tradução mantém a forma concisa do grego, sem tornar explícito o adjetivo «Santo».
- issue: Alcance de συμφέρον
  choice: 'O benefício tem orientação comunitária: «para o bem comum».'
  alternative: «para o que é benéfico», deixando o alcance inteiramente geral.
  rationale: A expressão grega pode designar aquilo que é útil ou benéfico em sentido geral, mas o desenvolvimento do capítulo sobre um só corpo e a função mútua dos dons sustenta a formulação comunitária, preservando-se a alternativa em nota.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. «A cada um» preserva a distribuição individual; «bem comum» comunica de modo conciso a finalidade comunitária sugerida pelo contexto.
