id: 1CO.12.12
reference: 1 Corinthians 12:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καθάπερ γὰρ τὸ σῶμα ἕν ἐστιν καὶ μέλη ⸂πολλὰ ἔχει⸃, πάντα δὲ τὰ μέλη τοῦ ⸀σώματος πολλὰ ὄντα ἕν ἐστιν σῶμα, οὕτως καὶ ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/012.yaml
  text: For just as the body is one and has many members[a], and all the members of the body, though they are many, are one body[b], so also is Messiah.
translation:
  language: pt
  text: Pois, assim como o corpo é um só e tem muitos membros[a], e todos os membros do corpo, embora sejam muitos, formam um só corpo, assim também é o Messias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, muitas partes integrantes do corpo.
    reason: lexical_clarification
  - marker: b
    text: 'Ou: “o Cristo”. A expressão grega diz literalmente “assim também o Messias” e é desenvolvida nos versículos seguintes em relação aos muitos membros que formam um só corpo.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καθάπερ γὰρ
  choice: Pois, assim como
  rationale: Preserva tanto a ligação explicativa de γάρ (“pois”) quanto a comparação enfática de καθάπερ (“assim como”), em português natural.
- source_word: σῶμα
  choice: corpo
  rationale: É o equivalente direto e corrente, essencial para manter a metáfora corporal de Paulo.
- source_word: ἕν
  choice: um só
  rationale: “Um só” expressa com clareza a unidade numérica e coletiva enfatizada no argumento.
- source_word: μέλη
  choice: membros
  rationale: Mantém a imagem das partes integrantes de um corpo e prepara sua aplicação à comunidade nos versículos seguintes.
- source_word: πολλὰ ὄντα
  choice: embora sejam muitos
  rationale: Explicita de modo natural o valor concessivo da construção participial grega.
- source_word: ἕν ἐστιν σῶμα
  choice: formam um só corpo
  rationale: Evita uma concordância pouco natural em português e comunica fielmente que a multiplicidade dos membros constitui uma unidade corporal.
- source_word: οὕτως καὶ ὁ Χριστός
  choice: assim também é o Messias
  rationale: Conserva a conclusão comparativa e a formulação condensada e surpreendente do grego, sem substituí-la por “a igreja” ou “o corpo do Messias”.
theological_decisions:
- issue: Tradução de ὁ Χριστός
  choice: o Messias
  alternative: o Cristo
  rationale: Χριστός conserva aqui força titular. “Messias” comunica diretamente a ideia do Ungido, enquanto “Cristo” pode ser entendido apenas como nome próprio.
- issue: Sentido de “assim também é o Messias”
  choice: Manter a expressão condensada do texto
  alternative: assim também é o corpo do Messias / assim também é a igreja
  rationale: O grego identifica de maneira sintética a unidade do corpo com o Messias; os versículos seguintes desenvolvem essa relação. Expandir a frase resolveria uma tensão que o próprio texto deixa aberta neste ponto.
translation_notes:
  register: Português contemporâneo, claro e digno, com ampla legibilidade brasileira. “Formam um só corpo” favorece a naturalidade sem apagar a estrutura lógica do grego; “Messias” preserva o valor de título de Χριστός.
