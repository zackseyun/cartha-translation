  text: ⸀νυνὶ δὲ ὁ θεὸς ἔθετο τὰ μέλη, ἓν ἕκαστον αὐτῶν, ἐν τῷ σώματι καθὼς ἠθέλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/018.yaml
  text: But as it is[a], God arranged the members, each one of them[b], in the body just as he desired.
translation:
  language: pt
  text: Mas, de fato, Deus dispôs os membros, cada um deles, no corpo, conforme quis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como desejou”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Mas, de fato
  rationale: Marca o contraste com as situações hipotéticas anteriores e retorna à realidade presente, sem dar à expressão um sentido meramente temporal.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Tradução direta e natural do sujeito.
- source_word: ἔθετο
  choice: dispôs
  rationale: Comunica tanto a colocação quanto a ordenação intencional dos membros no corpo, preservando a amplitude de τίθημι sem reduzir o verbo a mera localização física.
- source_word: τὰ μέλη
  choice: os membros
  rationale: Termo preciso e tradicional para as partes integrantes de um corpo; mantém a metáfora corporal de Paulo.
- source_word: ἓν ἕκαστον αὐτῶν
  choice: cada um deles
  rationale: Preserva a força distributiva da expressão e enfatiza individualmente todos os membros.
- source_word: ἐν τῷ σώματι
  choice: no corpo
  rationale: Forma direta e idiomática; no contexto imediato designa o corpo da metáfora, aplicado à comunidade no argumento mais amplo.
- source_word: καθὼς ἠθέλησεν
  choice: conforme quis
  rationale: Expressa naturalmente em português que a disposição correspondeu à vontade de Deus, mantendo a força volitiva sem linguagem técnica.
theological_decisions:
- issue: Intencionalidade divina na disposição dos membros no corpo
  choice: Deus dispôs deliberadamente cada membro no corpo conforme sua vontade.
  alternative: Deus apenas colocou os membros no corpo, sem ênfase em sua ordenação intencional.
  rationale: O verbo ἔθετο, unido a καθὼς ἠθέλησεν, apresenta a diversidade do corpo como resultado da ação e vontade divinas. “Dispôs” preserva essa intencionalidade sem extrapolar o que o versículo afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Mas, de fato” recupera o valor discursivo de νυνὶ δὲ; “dispôs” é natural e conserva a ideia de colocação ordenada. A nota registra uma alternativa para ἠθέλησεν. O marcador [a] aparece no texto principal.
