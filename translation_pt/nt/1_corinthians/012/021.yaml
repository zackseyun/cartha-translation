id: 1CO.12.21
reference: 1 Corinthians 12:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί· Χρείαν σου οὐκ ἔχω, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν· Χρείαν ὑμῶν οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/021.yaml
  text: But the eye cannot say to the hand[a], ‘I have no need of you,’ or again the head to the feet, ‘I have no need of you.’
translation:
  language: pt
  text: 'Mas o olho não pode dizer à mão: “Não preciso de você”; nem a cabeça pode dizer aos pés: “Não preciso de vocês”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύναται
  choice: não pode
  rationale: Expressa de modo natural a incapacidade indicada pela negação com δύναμαι, sem reduzi-la a mera impropriedade.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste com a exposição anterior sobre a diversidade e a interdependência das partes do corpo.
- source_word: ὁ ὀφθαλμός
  choice: o olho
  rationale: Preserva literalmente a imagem corporal desenvolvida por Paulo.
- source_word: εἰπεῖν τῇ χειρί
  choice: dizer à mão
  rationale: Reproduz de forma direta o infinitivo e o dativo de objeto indireto, mantendo a personificação.
- source_word: Χρείαν σου οὐκ ἔχω
  choice: Não preciso de você
  rationale: É a formulação corrente e clara em português para a ausência de necessidade; conserva o sentido sem a conotação mais dura de 'não tenho utilidade para você'.
- source_word: ἢ πάλιν
  choice: nem
  rationale: Em português, após a primeira oração negativa, 'nem' introduz naturalmente o segundo exemplo análogo. A repetição verbal foi explicitada para completar a construção com clareza.
- source_word: ἡ κεφαλὴ τοῖς ποσίν
  choice: a cabeça pode dizer aos pés
  rationale: Mantém as partes do corpo e torna explícito o verbo subentendido no grego, conforme exige a fluência do português.
- source_word: ὑμῶν
  choice: vocês
  rationale: Diferentemente do inglês, o português permite marcar naturalmente o plural do pronome dirigido aos dois pés, em contraste com o singular 'você' dirigido à mão.
theological_decisions:
- issue: Linguagem metafórica do corpo para a interdependência da igreja
  choice: Preservar literalmente as partes do corpo, sem explicação interpretativa no texto
  alternative: Substituir ou ampliar a metáfora com referência explícita aos membros da igreja
  rationale: O argumento teológico de Paulo opera por meio da própria metáfora; explicá-la no versículo transformaria tradução em comentário.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A distinção entre o singular σου ('você', dirigido à mão) e o plural ὑμῶν ('vocês', dirigido aos pés) aparece diretamente no texto, dispensando nota. A segunda ocorrência de 'pode dizer' foi explicitada para evitar uma elipse pouco natural em português.
