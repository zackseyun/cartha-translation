id: 1CO.12.6
reference: 1 Corinthians 12:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ διαιρέσεις ἐνεργημάτων εἰσίν, ⸂ὁ δὲ⸃ ⸀αὐτὸς θεός, ὁ ἐνεργῶν τὰ πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/006.yaml
  text: And there are varieties of workings[b][a], but it is the same God who works all things in all people.
translation:
  language: pt
  text: E há diferentes formas de atuação, mas é o mesmo Deus que realiza todas as coisas em todos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais explicitamente, “em todas as pessoas”. O grego diz literalmente “em todos”, sem declarar o substantivo; o contexto sugere todos os membros da comunidade nos quais Deus produz essas manifestações.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: diferentes formas
  rationale: No paralelismo dos versículos 4–6, indica diversidade de tipos ou manifestações, sem sugerir conflito ou ruptura.
- source_word: ἐνεργημάτων
  choice: atuação
  rationale: Refere-se à atividade eficaz ou às suas manifestações. “Atuação” é natural em português e permite preservar a ligação conceitual com ἐνεργῶν por meio de “realiza”.
- source_word: ὁ δὲ αὐτὸς θεός
  choice: mas é o mesmo Deus
  rationale: O δέ assinala contraste brando entre a diversidade das atuações e a identidade de sua fonte. O verbo “é”, implícito no grego, torna a frase natural em português.
- source_word: ὁ ἐνεργῶν
  choice: que realiza
  rationale: A oração relativa traduz naturalmente o particípio presente e comunica a ação efetiva de Deus, sem reduzir o verbo a mera intenção.
- source_word: τὰ πάντα
  choice: todas as coisas
  rationale: Mantém a formulação abrangente do grego, sem restringi-la explicitamente apenas aos dons mencionados no contexto imediato.
- source_word: ἐν πᾶσιν
  choice: em todos
  rationale: Preserva a ausência de substantivo explícito no grego. No contexto comunitário, o plural provavelmente se refere a todas as pessoas ou membros, explicação mantida em nota.
theological_decisions:
- issue: Alcance da atuação divina em τὰ πάντα ἐν πᾶσιν
  choice: “realiza todas as coisas em todos”
  alternative: “realiza todas essas coisas em todas as pessoas”
  rationale: A tradução conserva tanto a amplitude de τὰ πάντα quanto a forma elíptica de ἐν πᾶσιν. O contexto trata das manifestações na comunidade, mas o texto não explicita “essas” nem “pessoas”; a nota esclarece a referência provável sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção preserva o contraste entre diversidade e unidade e mantém a elipse do texto grego, esclarecendo-a em nota.
