  yaml_path: translation/nt/1_corinthians/012/020.yaml
  text: But as it is[a], there are many parts, yet one body.
translation:
  language: pt
  text: Mas, de fato, há muitas partes[a], porém um só corpo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «muitos membros, mas um só corpo».'
    reason: Alternativa lexical para μέλη; «membros» pode designar as partes constituintes do corpo e preserva a formulação tradicional.
lexical_decisions:
- source_word: νῦν
  choice: de fato
  rationale: Neste contexto argumentativo, introduz a realidade efetiva em contraste com a hipótese do versículo anterior, não apenas um momento temporal.
- source_word: δὲ
  choice: Mas
  rationale: Marca a retomada contrastiva em relação à declaração condicional anterior.
- source_word: πολλὰ ... μέλη
  choice: muitas partes
  rationale: No contexto da metáfora corporal, refere-se às partes constituintes do corpo; esta formulação é clara e natural em português atual.
- source_word: μὲν ... δὲ
  choice: muitas partes, porém um só corpo
  rationale: A construção correlativa contrasta a pluralidade das partes com a unidade do corpo; 'porém' expressa naturalmente esse equilíbrio.
- source_word: ἓν
  choice: um só
  rationale: Explicita em português a ênfase na unidade em contraste com a pluralidade.
- source_word: σῶμα
  choice: corpo
  rationale: Preserva a imagem corporal e sua força teológica de unidade na diversidade.
theological_decisions:
- issue: Tradução de μέλη na metáfora do corpo
  choice: partes
  alternative: membros
  rationale: '''Partes'' comunica diretamente a imagem anatômica em português contemporâneo, sem antecipar o sentido eclesial de ''membros''; o contexto mantém clara a aplicação à comunidade.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva o contraste retórico entre a multiplicidade das partes e a unidade do corpo.
