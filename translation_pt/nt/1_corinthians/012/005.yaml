  yaml_path: translation/nt/1_corinthians/012/005.yaml
  text: And there are varieties of ministries[a], and the same Lord.
translation:
  language: pt
  text: E há diferentes formas de serviço[a], e o Senhor é o mesmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diferentes ministérios” ou “diferentes maneiras de servir”.
    reason: Alternativas lexicais para διακονιῶν, cujo campo semântico abrange serviço e ministério.
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a ligação aditiva e a estrutura paralela dos versículos 4–6.
- source_word: διαιρέσεις
  choice: diferentes formas
  rationale: Neste contexto, indica diversidade de tipos, não divisões ou facções. A expressão é natural em português e se combina claramente com “serviço”.
- source_word: διακονιῶν
  choice: serviço
  rationale: O termo pode indicar serviços, ministérios ou formas de servir. “Serviço” preserva a amplitude do grego e evita restringir o sentido a cargos ou estruturas eclesiásticas.
- source_word: εἰσιν
  choice: há
  rationale: É a forma existencial mais natural e concisa em português.
- source_word: ὁ αὐτὸς
  choice: é o mesmo
  rationale: Preserva a ênfase na identidade e unidade do Senhor em meio à diversidade e acompanha o paralelismo do contexto.
- source_word: κύριος
  choice: Senhor
  rationale: É o equivalente tradicional e contextual do título κύριος, preservando seu peso teológico sem explicitar o referente no corpo do texto.
theological_decisions:
- issue: Referente de “Senhor” na formulação triádica de 1 Coríntios 12:4–6
  choice: Manter “Senhor” sem acrescentar “Jesus” no texto; no contexto, o referente mais provável é o Senhor Jesus.
  alternative: Entender a expressão como referência mais genérica ao Senhor/Deus.
  rationale: A sequência menciona o mesmo Espírito, o mesmo Senhor e o mesmo Deus. A tradução conserva a formulação de Paulo e sua tensão teológica, sem introduzir uma explicação interpretativa no versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Diferentes formas de serviço” comunica diversidade sem sugerir conflito; “mas” torna natural em português o contraste implícito entre diversidade e unidade, embora o grego use καί.
