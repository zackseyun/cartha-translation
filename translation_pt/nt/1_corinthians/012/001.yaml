id: 1CO.12.1
reference: 1 Corinthians 12:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν πνευματικῶν, ἀδελφοί, οὐ θέλω ὑμᾶς ἀγνοεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/001.yaml
  text: Concerning spiritual gifts, brothers, I do not want you to be uninformed.
translation:
  language: pt
  text: Quanto aos dons espirituais[a], irmãos[b], não quero que vocês fiquem sem saber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “coisas espirituais”. A expressão grega é mais ampla que “dons espirituais”, embora o contexto deste capítulo se concentre nos dons concedidos pelo Espírito.
    reason: alternative_reading
  - marker: b
    text: Aqui, “irmãos” é a forma usada por Paulo para se dirigir à comunidade e provavelmente inclui também as mulheres.
    reason: cultural_note
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Quanto a
  rationale: Introduz um novo assunto e expressa naturalmente em português a transição marcada por περί e δέ, sem acrescentar um advérbio temporal inexistente no grego.
- source_word: τῶν πνευματικῶν
  choice: os dons espirituais
  rationale: O adjetivo substantivado é elíptico e pode significar, de modo mais amplo, “as coisas espirituais”. Contudo, o contexto imediato trata das manifestações e distribuições concedidas pelo Espírito; por isso, “dons espirituais” comunica com clareza o referente provável, enquanto a ambiguidade é preservada em nota.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém a forma masculina plural do vocativo grego e o modo paulino de se dirigir à comunidade. Uma nota esclarece que, nesse uso congregacional, o termo provavelmente abrange também as mulheres.
- source_word: οὐ θέλω ὑμᾶς ἀγνοεῖν
  choice: não quero que vocês fiquem sem saber
  rationale: Reproduz de maneira natural e corrente o sentido de não permanecer desinformado ou sem conhecimento, evitando a carga pejorativa que “ignorantes” pode ter no português atual.
theological_decisions:
- issue: Interpretação de τῶν πνευματικῶν
  choice: dons espirituais no texto principal
  alternative: coisas espirituais; pessoas espirituais
  rationale: A expressão grega não explicita “dons” e é lexicalmente mais ampla. Ainda assim, 1 Coríntios 12:4–11 concentra-se nos dons, manifestações e distribuições do Espírito, favorecendo esta leitura contextual. A nota conserva a amplitude genuína do original sem ocultá-la.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Vocês” é natural no português brasileiro e amplamente compreensível. A construção “fiquem sem saber” evita tanto o tom excessivamente técnico de “desinformados” quanto a conotação depreciativa moderna de “ignorantes”.
