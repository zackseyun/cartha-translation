  naturalness: O texto é claro, moderno e fluente para leitores brasileiros, permanecendo amplamente compreensível no português internacional. «Quanto aos dons espirituais, irmãos» e «não quero que vocês fiquem sem saber» têm registro apropriado para uma epístola em tradução contemporânea.
  terminology: «Dons espirituais» é terminologia bíblica corrente e contextualmente apropriada, sem apagar a ambiguidade lexical, que está bem registrada na nota. «Irmãos» e a nota explicativa mantêm tanto a forma do texto-fonte quanto sua função congregacional provável.
