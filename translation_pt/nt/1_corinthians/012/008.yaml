id: 1CO.12.8
reference: 1 Corinthians 12:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ᾧ μὲν γὰρ διὰ τοῦ πνεύματος δίδοται λόγος σοφίας, ἄλλῳ δὲ λόγος γνώσεως κατὰ τὸ αὐτὸ πνεῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/008.yaml
  text: For to one is given through the Spirit a message of wisdom[a], and to another a message of knowledge according to the same Spirit[c][b],
translation:
  language: pt
  text: Pois a um é dada, por meio do Espírito, uma mensagem de sabedoria[a]; e a outro, uma mensagem de conhecimento[b], segundo o mesmo Espírito[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma palavra de sabedoria” ou “uma declaração de sabedoria”.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma palavra de conhecimento” ou “uma declaração de conhecimento”.
    reason: lexical_alternative
  - marker: c
    text: Ou “pelo mesmo Espírito”. O grego emprega aqui uma preposição diferente da usada em “por meio do Espírito”, provavelmente destacando a conformidade com o mesmo Espírito como fonte comum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ μὲν ... ἄλλῳ δὲ
  choice: a um ... e a outro
  rationale: Reproduz de modo natural em português a distribuição contrastiva entre diferentes pessoas na comunidade.
- source_word: διὰ τοῦ πνεύματος
  choice: por meio do Espírito
  rationale: Preserva o valor de meio ou agência de διά com o genitivo e o distingue da preposição κατά na oração seguinte.
- source_word: δίδοται
  choice: é dada
  rationale: 'Mantém o presente passivo: a manifestação é concedida, não produzida pela própria pessoa.'
- source_word: λόγος σοφίας
  choice: uma mensagem de sabedoria
  rationale: Aqui λόγος provavelmente designa fala, expressão ou mensagem, não apenas uma palavra isolada. A formulação é clara e atual, sem eliminar outras possibilidades.
- source_word: λόγος γνώσεως
  choice: uma mensagem de conhecimento
  rationale: Mantém o paralelismo com λόγος σοφίας e traduz γνώσεως diretamente como “de conhecimento”.
- source_word: κατὰ τὸ αὐτὸ πνεῦμα
  choice: segundo o mesmo Espírito
  rationale: Conserva o sentido de conformidade ou correspondência de κατά e a variação em relação a “por meio do Espírito”.
theological_decisions:
- issue: Referente de πνεύματος / πνεῦμα
  choice: Espírito Santo, indicado por “Espírito” com inicial maiúscula
  alternative: espírito humano
  rationale: O contexto imediato de 1 Coríntios 12 apresenta o único Espírito como aquele que concede e distribui manifestações à comunidade.
- issue: Sentido de λόγος nas expressões λόγος σοφίας e λόγος γνώσεως
  choice: mensagem
  alternative: palavra; declaração
  rationale: “Mensagem” comunica uma expressão inteligível sem definir de forma indevida sua modalidade. As traduções mais literais são registradas em notas.
- issue: Relação expressa por κατὰ τὸ αὐτὸ πνεῦμα
  choice: segundo o mesmo Espírito
  alternative: pelo mesmo Espírito
  rationale: A escolha preserva a diferença entre κατά e o διά anterior, sem negar que o Espírito seja a fonte comum dos dons.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Por meio de” e “segundo” preservam a distinção entre as preposições gregas; “mensagem” evita a possível impressão de uma única palavra, enquanto as notas mantêm as alternativas tradicionais.
